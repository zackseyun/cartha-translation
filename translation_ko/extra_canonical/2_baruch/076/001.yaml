- from: 그는 대답하여 내게 말했습니다. “이런 일들 뒤에 너에게 일어날 일을 보여 달라고 네가 기도하였기 때문에, 나는 너에게 이 환상을 보여 주었습니다. 이는 네가 이런 일들 뒤에 일어날 일을 보게 하려는 것입니다. 너는 반드시 이 땅을 떠나게 되겠지만 죽음에 이르는 것은 아니며, 정해진 때들을 위해 보존될 것입니다. 그러므로 그 산의 꼭대기로 올라가십시오. 그러면 그 땅의 여러 지역과, 사람이 사는 세상의 모습과, 산들의 봉우리와, 골짜기들의 깊은 곳과, 바다의 깊은 곳과, 강들의 수가 네 앞을 지나갈 것입니다. 그러면 네가 네가 떠나는 것과 네가 가는 곳을 보게 될 것입니다. 이것은 사십 일 후에 일어날 것입니다. 그러므로 이제 이 날들 동안 백성에게 가르칠 수 있는 만큼 가르치십시오. 그러면 그들이 배우고, 마지막 때에 죽지 않고, 배워서 마지막 때에 살게 될 것입니다.”[a]
  to: 그는 대답하여 내게 말했습니다. “이런 일들 뒤에 너에게 일어날 일을 보여 달라고 네가 기도하였기 때문에, 나는 너에게 이 환상을 보여 주었습니다. 이는 네가 이런 일들 뒤에 일어날 일을 보게 하려는 것입니다. 너는 반드시 이 땅을 떠나게 되겠지만, 죽음에 이르는 것은 아니며 정해진 때들을 위하여 보존될 것입니다. 그러므로 그 산의 꼭대기로 올라가십시오. 그러면 그 땅의 여러 지역과 사람이 사는 세상의 모습과 산들의 봉우리와 골짜기들의 깊은 곳과 바다의 깊은 곳과 강들의 수가 네 앞을 지나갈 것입니다. 그러면 네가 무엇을 떠나며 어디로 가는지를 보게 될 것입니다. 이것은 사십 일 후에 일어날 것입니다. 그러므로 이제 이 날들 동안 백성에게 가르칠 수 있는 만큼 가르치십시오. 그러면 그들이 배워 마지막 때에 죽지 않고, 또 배워 마지막 때에 살게 될 것입니다.”[a]
  rationale: 현행 번역의 본문 선택은 유지했습니다. 제공된 시리아어 OCR은 절 경계와 내용이 심하게 훼손되어 있으나, 영어 POB 감사 이력은 현재 본문이 해당 장의 실제 내용에 맞고 아담·죄·질병을 다루는 대안은 잘못된 OCR에 따른 것임을 명시합니다. 따라서 안전한 수정은 한국어의 명백한 중복 오자를 고치고 문장 연결을 다듬는 데 한정했습니다. 각주 앵커 [a]는 유지하고, 감사본의 이전 번역 각주를 한국어로 옮겼습니다.
