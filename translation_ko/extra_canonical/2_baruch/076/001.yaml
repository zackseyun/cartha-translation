  source_fidelity: 현행 본문은 제공된 영어 POB 감사본이 보존한 2바룩 76장의 환상, 땅을 떠남, 죽음이 아닌 보존, 산 위의 조망, 사십 일, 백성을 가르치라는 흐름을 충실히 따릅니다. 다만 ‘네가 네가 떠나는 것’은 명백한 중복 오류이므로 바로잡아야 합니다. ‘정해진 때들을 위하여 보존될 것입니다’는 죽음은 아니나 미래의 때들을 위해 보존된다는 원문의 긴장을 해석적으로 해소하지 않고 유지합니다.
  naturalness: 합쇼체의 직접 발화로서 전반적으로 자연스럽습니다. 다만 중복된 ‘네가’를 삭제하고, ‘떠나는 것’은 목적어를 밝혀 ‘무엇을 떠나며 어디로 가는지’로 옮기면 한국어 문장이 훨씬 자연스럽고 원문의 병렬도 드러납니다. 마지막 권면에서는 ‘배우다’의 의도적인 반복을 유지하되 문장 연결을 다듬었습니다.
  terminology: ‘환상’, ‘정해진 때들’, ‘사람이 사는 세상’, ‘마지막 때’는 문맥과 격식에 적절합니다. ‘보존되다’는 원문이 말하는 보전의 뜻을 전달하되 그 방식에 관한 교리적 설명을 덧붙이지 않습니다.
  issues:
