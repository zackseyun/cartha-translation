theological_decisions:
- issue: Baruch의 ‘떠남’과 ‘죽음이 아님’의 긴장
  chosen_reading: 본문의 긴장을 유지하여, 떠남은 말하되 그것이 죽음에 이르는 것은 아니라고 분명히 옮겼습니다.
  alternative_readings:
  - 죽지 않고 옮겨질 것입니다
  - 죽음을 겪지 않고 옮겨질 것입니다
  rationale: 본문은 일반적 죽음이 아님을 분명히 하지만, 그 방식까지 풀어서 해석하지는 않으므로 해설을 덧붙이지 않았습니다.
  doctrine_reference: Preserve theological tension rather than resolve it
- issue: ‘마지막 때’의 반복
  chosen_reading: 두 번의 ܙܒܢܐ ܐܚܪܝܐ를 모두 ‘마지막 때’로 옮겼습니다.
  alternative_readings:
  - 마지막 시대
  - 끝때
  rationale: 시리아어의 종말론적 반복을 살리되, 한국어에서 가장 자연스럽고 엄숙한 표현을 택했습니다.
  doctrine_reference: Ceriani primary-witness priority
