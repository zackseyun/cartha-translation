  lexicon: Payne Smith
  rationale: 두 동사의 연속이 포착하는 ‘붙잡음’과 아래로의 강한 이동을 함께 살리기 위해, 둘째 동사를 약화하지 않고 방향성을 분명히 했습니다.
- source_word: ܢܗ̈ܪܐ
  english_pob_choice: rivers
  chosen_korean: 강
  alternatives_korean:
  - 빛들
  - 하천들
  lexicon: Payne Smith; comparative with Kmosko Latin
  rationale: POB의 본문 선택을 따라 ‘강’으로 옮기고, 대안 독법이 있음을 각주로 밝혔습니다.
- source_word: ܩܪܘܙܐ
  english_pob_choice: proclamation
  chosen_korean: 선포
  alternatives_korean:
  - 선언
  - 알림
  lexicon: Payne Smith
  rationale: 추상적 ‘it’로 흐리지 않고, 번개에 의인화되어 연결된 행위를 명사 그대로 살리기 위해 ‘선포’로 옮겼습니다.
theological_decisions:
- issue: 열두 강의 독법
  chosen_reading: 본문에는 ‘열두 강’으로 두고, 각주로 ‘열두 빛’이라는 대안 독법을 제시합니다.
  alternative_readings:
  - 열두 빛
  - 열두 빛들
  rationale: 서사적 연속성과 교정본의 지지를 살리되, 문자 변이 가능성을 숨기지 않기 위해 본문-각주 구분을 유지했습니다.
  doctrine_reference: 텍스트 비평 및 본문 신뢰성
- issue: 환상의 상징을 역사적으로 해석할지 여부
  chosen_reading: 이 절에서는 상징을 해석하지 않고, 보이는 이미지 그대로 옮깁니다.
  alternative_readings:
  - 즉시 역사적 대응을 덧붙이는 번역
  rationale: 이 장의 해석은 뒤에서 제시되므로, 여기서는 독자가 먼저 환상 자체를 보도록 두는 것이 본문의 순서를 존중합니다.
  doctrine_reference: 문맥 우선 원칙
