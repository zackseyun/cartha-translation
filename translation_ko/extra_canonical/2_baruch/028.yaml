  text: '1 Therefore, whoever understands shall then be wise.

    2 For the measure and the reckoning of that time are two parts of weeks—seven weeks.

    3 And I answered and said, “It is good for a man to come and see, but it is better that he should not come, lest he fall.

    4 But I will say this also:

    5 Can what is incorruptible despise what is corruptible, and what happens to what is corruptible, so as to look only to what is not corruptible?

    6 But if these things will surely come to pass, O Lord, as you have told me, show me this also, if I have found favor before you:

    7 Will these things happen in one place, or in one part of the earth, or will the whole earth experience them?”'
translation:
  language: ko
  text: '1 그러므로 이를 이해하는 사람은 그때에 지혜로울 것입니다.


    2 그 시대의 척도와 계산은 한 주들의 두 부분, 곧 일곱 주입니다.


    3 나는 대답하여 말했습니다. “사람이 와서 보는 것은 좋지만, 차라리 오지 않는 것이 더 좋습니다. 그렇지 않으면 그가 넘어질까 두렵습니다.


    4 그러나 나는 이 또한 말하겠습니다.


    5 썩지 않는 것이 썩는 것을 업신여길 수 있습니까? 또 썩는 것에게 무슨 일이 일어나서, 그것이 썩지 않는 것만 보게 되겠습니까?


    6 그러나 이 일들이 반드시 일어날 것이라면, 주님, 당신이 제게 말씀하신 대로 이것도 제게 보여 주십시오. 제가 당신 앞에서 은혜를 얻었다면 말입니다.


    7 이 일들이 한 곳에서 일어납니까, 아니면 땅의 한 부분에서 일어납니까, 아니면 온 땅이 그것들을 겪게 됩니까?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢܝܢ
  english_pob_choice: the measure
  chosen_korean: 척도
  alternatives_korean:
  - 분량
  - 측정
  lexicon: measure; reckoning
  rationale: 시기와 관련된 산정 개념이므로, 단순한 ‘분량’보다 시간적 기준을 드러내는 ‘척도’가 자연스럽습니다.
- source_word: ܚܫܒܘܢܐ / reckoning
  english_pob_choice: the reckoning
  chosen_korean: 계산
  alternatives_korean:
  - 산정
  - 헤아림
  lexicon: reckoning; calculation
  rationale: 문맥상 시기의 수를 따지는 뜻이어서 ‘계산’이 가장 직접적이며, 수학적·시간적 산정을 함께 살릴 수 있습니다.
- source_word: ܠܐ ܡܬܚܒܠ / incorruptible
  english_pob_choice: what is incorruptible
  chosen_korean: 썩지 않는 것
  alternatives_korean:
  - 부패하지 않는 것
  - 썩지 아니한 것
  lexicon: incorruptible; imperishable
  rationale: 대조 구조에서 추상 명사화한 표현이 필요하여, ‘썩지 않는 것’이 원문의 상태 대비를 가장 자연스럽게 드러냅니다.
- source_word: ܡܬܚܒܠ / corruptible
  english_pob_choice: what is corruptible
  chosen_korean: 썩는 것
  alternatives_korean:
  - 부패하는 것
  - 썩을 수 있는 것
  lexicon: corruptible; perishable
  rationale: 앞 항과 대구를 이루도록 ‘썩지 않는 것 / 썩는 것’으로 직역해 대비를 보존했습니다.
- source_word: ܡܪܝ / Lord
  english_pob_choice: O Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주여
  - 주
  lexicon: Lord
  rationale: 기도체 직접 호칭이므로 현대 합쇼체에서 자연스럽고 경건한 ‘주님’을 택했습니다.
theological_decisions:
- issue: ‘한 곳에서’와 ‘땅의 한 부분에서’의 범위 질문
  chosen_reading: 원문의 병렬 질문을 유지해, 재난의 공간적 범위에 대한 불확실성을 그대로 살렸습니다.
  alternative_readings:
  - ‘어느 한 지역에서’로 평탄화
  - ‘온 땅에’만 강조
  rationale: 본문은 사건의 지역적 제한 가능성과 전면적 확산 가능성을 함께 묻고 있으므로, 둘을 모두 드러내야 긴장이 보존됩니다.
