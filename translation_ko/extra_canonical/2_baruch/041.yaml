  yaml_path: translation/extra_canonical/2_baruch/041.yaml
  text: '1[c]. And I said, “For whom and for how many will these things be? And who will be counted worthy to see that time?[a]

    2. But I will speak with you all that I think, and I will ask of you concerning those of your people whom I have seen in great number, who withdrew from your covenant and cast from themselves the yoke of your law.

    3[d]. But others again I have seen who left their vanity[b] and fled beneath your wings.

    4. What then will happen to these? Or how will that last time receive them?

    5. Or will the time of these perhaps be weighed, and as the balance inclines, so will they be judged?”'
  footnotes:
  - marker: a
    text: The present Ceriani chapter bucket overlaps with the close of chapter 40 and the start of chapter 42. This question section is clear in sense, but its exact edge is clarified with Kmosko page 576.
    reason: textual_variant
  - marker: b
    text: The Syriac line here is locally uncertain in the Ceriani OCR; 'their vanity' is supported by the Kmosko Latin control witness.
    reason: lexical_alternative
  - marker: c
    text: Or 'time?”[a]'.
    reason: previous_rendering
  - marker: d
    text: Or '“But I will speak before you'.
    reason: previous_rendering
translation:
  language: ko
  text: '저는 말했습니다. 「이 일들은 누구를 위한 것이며, 또 얼마나 많은 사람을 위한 것입니까? 또 그때를 볼 자가 누구이겠습니까?」


    그러나 저는 당신에게 제가 생각하는 모든 것을 말씀드리고, 당신의 백성 가운데서 제가 큰 무리로 보았던 사람들에 관하여 당신에게 묻겠습니다. 그들은 당신의 언약에서 물러나고 당신의 율법의 멍에를 스스로 던져 버렸습니다.


    그러나 다른 이들은 또다시 자신들의 헛됨[a]을 떠나 당신의 날개 아래로 달아나는 것을 제가 보았습니다.


    그러면 이들은 어떻게 되겠습니까? 또는 그 마지막 때가 이들을 어떻게 받아들이겠습니까?


    또 이들의 때가 저울에 달리듯 달려서, 저울이 기우는 대로 이들이 심판받게 되겠습니까?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܩܝܡܐ / ܩܝܡ̈ܐ
  english_pob_choice: your covenant
  chosen_korean: 당신의 언약
  alternatives_korean:
  - 당신의 약속
  - 당신의 언약-약정
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 영문 POB가 ‘covenant’로 잡은 흐름을 따라, 공동체와 하나님 사이의 관계적·법적 의미를 살리기 위해 ‘언약’으로 옮겼습니다.
- source_word: ܢܡܘܣܐ
  english_pob_choice: law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 가르침
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: ‘율법의 멍에’는 유대적 언약 질서와 복종의 이미지를 함께 지니므로, 일반적 ‘법’보다 ‘율법’이 더 정확합니다.
- source_word: ܡܘܒܠܐ / locally uncertain phrase
  english_pob_choice: their vanity
  chosen_korean: 자신들의 헛됨
  alternatives_korean:
  - 자신들의 공허함
  - 자신들의 허영
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: Kmosko의 라틴어 통제본이 vanitatem suam을 지지하므로, 도덕적·영적 공허를 드러내는 ‘헛됨’이 가장 안전합니다.
- source_word: ܓܢܦ̈ܐ
  english_pob_choice: beneath your wings
  chosen_korean: 당신의 날개 아래로
  alternatives_korean:
  - 당신의 보호 아래로
  - 당신의 날개 밑으로
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 보호의 은유를 평평하게 풀지 않고, 성경적 이미지인 ‘날개 아래’ 표현을 그대로 살렸습니다.
- source_word: ܡܬܬܚܒܘ
  english_pob_choice: be weighed
  chosen_korean: 저울에 달려
  alternatives_korean:
  - 헤아려져
  - 평가되어
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 뒤따르는 저울 이미지가 판단의 방식이 ‘달아 봄’임을 분명히 하므로, 단순한 평가는 피했습니다.
theological_decisions:
- issue: ‘당신의 날개 아래로’ 이미지의 보존
  chosen_reading: 회개한 자들이 단지 도덕적으로 개혁되는 것이 아니라 하나님의 보호와 피난처로 달려가는 장면으로 읽었습니다.
  alternative_readings:
  - ‘당신의 보호 아래로’처럼 의미를 풀어쓴 읽기
  rationale: 원문 은유는 신학적으로 중요하므로, 보호의 이미지를 해석적으로 지워 버리지 않았습니다.
  doctrine_reference: 하나님의 피난처/보호 은유
- issue: 마지막 때가 이들을 ‘받아들인다’는 문장
  chosen_reading: 마지막 때가 그들을 어떻게 맞이하는지에 대한 질문으로 남겨 두고, 다음 절에서의 판결을 미리 확정하지 않았습니다.
  alternative_readings:
  - 앞선 문맥에서 이미 최종 판결이 내려진 것으로 읽는 해석
  rationale: 본문은 질문의 형태로 긴장을 유지하며, 결론을 앞당기지 않습니다.
  doctrine_reference: 종말 심판의 점진적 전개
