  text: And they brought the cedar near it[a]. And I saw, and behold, the vine opened its mouth and said to that cedar, “Are you not the cedar that remained from the forest of wickedness? In what did wickedness not find in you a means of asking praise for itself? And your insolence was not cut off from those who had no pity. You stretched out your hand to those far away, and those who came near you, you caught in the snares of your evil. And your soul was always held fast, for you were never uprooted. But now your time has hastened and your hour has come. Therefore go, O cedar, after the forest which went before you, and become dust with it, and let your ashes be mixed together. And now lie down in distress, and rest in torment until your last time comes[e][d][c][b], in which you will return and be tormented still more.”
  footnotes:
  - marker: a
    text: The Ceriani chapter bucket overlaps adjacent material here. The scene-setting clause before the vine’s speech may partly belong to the close of chapter 36, but the speech itself securely belongs in this chapter.
    reason: textual_variant
  - marker: b
    text: After the speech, the surviving bucket continues with an incomplete transition ('After these things I saw ...'), which likely runs into the next scene. It is omitted from the main translation here because the chapter edge remains medium-confidence.
    reason: alternative_reading
  - marker: c
    text: Or 'those who came near you were caught in the snares of your evil.'.
    reason: previous_rendering
  - marker: d
    text: Or 'So go also after the forest'.
    reason: previous_rendering
  - marker: e
    text: Or 'your time has drawn near'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그들은 그 백향목을 그 곁으로 가져왔습니다[a]. 내가 보니, 보라, 포도나무가 입을 열어 그 백향목에게 말하였습니다. 「너는 악의 숲에서 남아 있던 그 백향목이 아니냐? 악이 무엇으로 너에게서 자신을 위해 찬양을 구하는 수단을 찾지 못하였느냐? 너의 교만은 불쌍히 여기지 않는 자들에게서 끊어지지 않았고, 너는 네 손을 먼 데 있는 것들에 뻗었으며, 네게 가까이 오는 자들은 네 악의 올가미에 걸리게 하였도다. 네 영혼은 늘 붙들려 있었으니, 너는 결코 뿌리째 뽑히지 않았기 때문이다. 그러나 이제 네 때가 앞당겨졌고 네 시간이 이르렀다. 그러므로 백향목아, 네 앞에 있던 숲을 따라 가서 그와 함께 티끌이 되고, 네 재가 함께 섞이게 하라. 이제 환난 속에 누워라. 그리고 네 마지막 때가 올 때까지 고통 가운데서 쉬어라[e][d][c][b]. 그러면 그때 네가 돌아와서 더욱 더 고통을 당할 것이다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܪܙܐ
  english_pob_choice: cedar
  chosen_korean: 백향목
  alternatives_korean:
  - 향나무
  - 삼나무
  lexicon: Payne Smith
  rationale: 시리아어 ܐܪܙܐ는 성경적 상징성이 강한 백향목을 가리키므로, 단순한 일반 수목명보다 상징과 위엄을 살리는 ‘백향목’이 적절합니다.
- source_word: ܥܒܐ ܕܒܝܫܬܐ
  english_pob_choice: the forest of wickedness
  chosen_korean: 악의 숲
  alternatives_korean:
  - 악한 숲
  - 악함의 숲
  lexicon: Payne Smith
  rationale: 속격 관계를 살리면서도 한국어에서 자연스러운 표현으로 옮기기 위해 ‘악의 숲’으로 간결하게 처리했습니다.
- source_word: ܟܣܝ̈ܬܝܬܐ
  english_pob_choice: the snares of your evil
  chosen_korean: 네 악의 올가미
  alternatives_korean:
  - 네 악의 그물
  - 네 숨은 덫
  lexicon: Payne Smith
  rationale: 이 어휘는 포획과 얽힘의 이미지를 지니므로, 한국어에서는 예배적 관용보다 직접적인 위협감을 주는 ‘올가미’가 가장 잘 맞습니다.
- source_word: ܣܪܗܒ
  english_pob_choice: your time has hastened
  chosen_korean: 네 때가 앞당겨졌고
  alternatives_korean:
  - 네 때가 다가왔고
  - 네 때가 빨리 왔고
  lexicon: Payne Smith
  rationale: 동사는 ‘가까워지다’보다 ‘재촉되다/앞당겨지다’의 긴박한 의미가 강하므로, 종말론적 압박감을 살려 ‘앞당겨졌고’로 옮겼습니다.
theological_decisions:
- issue: 포도나무의 발화를 어디까지 인격화할 것인가
  chosen_reading: 비유적 인격화된 화자로 유지하되, 뒤늦은 해석을 미리 끌어오지 않았습니다.
  alternative_readings:
  - 포도나무를 곧바로 메시아로 해석하기
  - 상징을 설명적으로 풀어 쓰기
  rationale: 이 장면은 환상 내 발화 자체가 핵심이므로, 후속 해석을 본문 속에 선반영하지 않고 장면의 긴장을 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: 마지막 심판 어조의 강도
  chosen_reading: ‘고통 가운데서 쉬어라’와 ‘더욱 더 고통을 당할 것이다’로 강한 형벌 어조를 유지했습니다.
  alternative_readings:
  - ‘괴로움 속에 머물러라’로 완화하기
  - ‘고난을 겪을 것이다’로 일반화하기
  rationale: 시리아어의 종말 심판 선언은 위협적이고 재판적이므로, 어조를 약화시키지 않는 것이 원문 충실성에 부합합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1
