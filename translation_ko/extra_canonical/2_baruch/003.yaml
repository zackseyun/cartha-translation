base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/003.yaml
  text: '1 And I said[a], “O Lord, my Lord, is it for this that I have asked, that I should see this? No, my Lord.

    2 Let your mercies be shown to me. Take my spirit to yourself, that I may go to my fathers and not see the destruction of my mother.

    3 For I cannot endure that I should die with many, or that I should die with my assembly; but neither can my soul endure to see the evil of my mother.

    4 But one thing I will say before you, O Lord:

    5 What then will happen after these things?

    6 For if you destroy your city and deliver up your land[b][c][d][e],

    7 ...'
  footnotes:
  - marker: a
    text: “My mother” is Baruch’s lamenting way of speaking about Jerusalem/Zion; the metaphor is retained rather than replaced with a flatter explanatory term.
    reason: cultural_note
    anchor_ref: '3:1'
  - marker: e
    text: The chapter’s closing questions run across a page edge in the Ceriani bucket. The rendering follows the primary Syriac trajectory, with control witnesses helping confirm the continuation and chapter boundary.
    reason: textual_variant
    anchor_ref: 3:5-9
  - marker: d
    text: '“Primeval silence” expresses cosmic-reversal imagery: Baruch fears that Jerusalem’s fall would seem to undo the ordered world shaped by God’s covenant purposes.'
    reason: cross_reference
    anchor_ref: '3:7'
  - marker: c
    text: Or 'take away my spirit first'.
    reason: previous_rendering
  - marker: b
    text: Or 'I cannot resist you'.
    reason: previous_rendering
translation:
  language: ko
  text: '1 내가 말했습니다. 「오 주님, 제 주님, 제가 이것을 보려고 이것을 구한 것입니까? 아닙니다, 제 주님.」

    2 저에게 긍휼을 베풀어 주십시오. 제 영을 당신께로 거두어 가셔서, 제가 제 조상들에게로 가고 제 어머니의 멸망은 보지 않게 하십시오.

    3 나는 많은 이들과 함께 죽는 것도, 내 회중과 함께 죽는 것도 견딜 수 없습니다. 또 내 영혼은 내 어머니의 재앙을 보는 것도 견딜 수 없습니다.

    4 그러나 오 주님, 제가 당신 앞에서 한 가지를 말씀드리겠습니다.

    5 그 후에는 무엇이 일어나겠습니까?

    6 만일 당신이 당신의 도성을 멸하고 당신의 땅을 넘겨주신다면[a][b]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܣܒ ܠܘܬܟ ܪܘܚܝ
  english_pob_choice: take my spirit to yourself
  chosen_korean: 제 영을 당신께로 거두어 가셔서
  alternatives_korean:
  - 제 영을 당신께로 데려가셔서
  - 제 영을 당신 자신에게로 받아 가셔서
  lexicon: Payne Smith
  rationale: ܠܘܬܟ는 단순한 ‘빼앗다’보다 ‘당신께로/당신 곁으로’의 방향을 가지므로, 관계적 방향성을 살려 옮겼습니다.
- source_word: ܐܒ̈ܗܝ
  english_pob_choice: my fathers
  chosen_korean: 제 조상들에게로
  alternatives_korean:
  - 제 아버지들에게로
  - 제 선조들에게로
  lexicon: Payne Smith
  rationale: 시리아어 관용구의 족장적·조상적 뉘앙스를 유지하면서 한국어에서 가장 자연스러운 ‘조상들’로 옮겼습니다.
- source_word: ܟܢܘܫܬܝ
  english_pob_choice: my assembly
  chosen_korean: 내 회중
  alternatives_korean:
  - 내 무리
  - 내 모임
  lexicon: Payne Smith
  rationale: 이 단어는 단순한 군중이 아니라 함께 모인 공동체를 가리키므로, 예배적·공동체적 뉘앙스를 살려 ‘회중’으로 번역했습니다.
- source_word: ܒܝܫܬܐ / ܒܝܫܬܗ̇
  english_pob_choice: evil / destruction
  chosen_korean: 멸망 / 재앙
  alternatives_korean:
  - 악
  - 불행
  - 파멸
  lexicon: Payne Smith
  rationale: 문맥에서 바룩이 두려워하는 것은 단순한 도덕적 ‘악’이 아니라 예루살렘의 참화이므로, 2절은 ‘멸망’, 3절은 그 재난의 체험을 ‘재앙’으로 구분해 옮겼습니다.
- source_word: ܬܘܒܕ / ܬܫܠܡ
  english_pob_choice: destroy / deliver up
  chosen_korean: 멸하고 / 넘겨주신다면
  alternatives_korean:
  - 파괴하고 / 넘기신다면
  - 무너뜨리고 / 맡기신다면
  lexicon: Payne Smith
  rationale: 두 동사는 별개의 행위를 이루므로, 1) 도성을 멸하는 것과 2) 땅을 적대자에게 넘기는 것을 한국어에서도 구분되게 처리했습니다.
theological_decisions:
- issue: 3절의 ‘죽음’과 ‘영혼’의 병치
  chosen_reading: 바룩은 단순한 퇴각이나 심리적 회피가 아니라, 자신이 죽어 공동체의 재앙을 함께 겪지 않게 해 달라고 간구합니다.
  alternative_readings:
  - 그저 현장을 떠나고 싶다는 뜻이다
  - 환시적 체험을 중단해 달라는 뜻이다
  rationale: 시리아어는 ‘많은 이들과 함께 죽는 것’과 ‘내 회중과 함께 죽는 것’을 병치하고 있어, 죽음의 요청으로 읽는 것이 가장 직접적입니다.
  doctrine_reference: lament theology; death-before-witness motif
- issue: ‘제 어머니’의 의미
  chosen_reading: ‘제 어머니’는 예루살렘/시온을 가리키는 애도적 비유를 그대로 살렸습니다.
  alternative_readings:
  - 민족 전체를 뜻하는 일반 표현이다
  - 본문에서 ‘도성’으로 풀어 써야 한다
  rationale: 문맥상 바룩의 애가적 인격화 표현이므로, 설명으로 바꾸지 않고 메타포를 유지하는 편이 독자에게 더 정확합니다.
  doctrine_reference: biblical city-personification
