base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/004.yaml
  text: '1 And the Lord said to me[a], “This city will be delivered up for a time, and the people will be led away into captivity, but the world will not be forgotten.


    2 Or do you think that this is the city of which I said, ''On my hands I have engraved you''?


    3 For it is not that which is by the hands of men; it is that which will be revealed, which was prepared beforehand from the time I resolved to make Paradise, and I showed it to Adam before he sinned.


    4 But when he transgressed the commandment, it was taken away from him, just as Paradise also was.


    5 And after these things I showed it to my servant Abraham by night, between the pieces of the sacrifice.


    6 And again I also showed it to Moses on Mount Sinai[b][c][d][e][f], when I showed him the pattern of the tabernacle and all its vessels.”'
  footnotes:
  - marker: a
    text: 'The rebuke’s subordinate wording is textually rough in the Ceriani OCR at this point. The sense is clear from the Syriac trajectory and control witnesses: Baruch must not identify the presently visible city with the city in its ultimate divine form.'
    reason: textual_variant
    anchor_ref: '4:2'
  - marker: f
    text: The contrast is between the city now seen in history and a city already prepared by God before its disclosure.
    reason: cross_reference
    anchor_ref: '4:3'
  - marker: e
    text: The final clause is completed from the immediate continuation of the chapter’s sentence across the page edge, with control-witness support.
    reason: textual_variant
    anchor_ref: '4:6'
  - marker: d
    text: Or 'Or are you so foolish that you think this is that city?'.
    reason: previous_rendering
  - marker: c
    text: Or 'It is not this building that is now in your midst'.
    reason: previous_rendering
  - marker: b
    text: Or 'and the people will be led away into captivity for a time'.
    reason: previous_rendering
translation:
  language: ko
  text: '1 주님께서 제게 말씀하셨습니다. 「이 도성은 한동안 넘겨질 것이며, 백성은 포로로 끌려가겠지만, 세상은 잊히지 않을 것입니다.


    2 아니, 내가 ‘내 손바닥에 너를 새겨 두었다’고 말한 바로 그 도성이라고 생각합니까?


    3 그것은 사람의 손으로 지은 것이 아니라, 드러날 것이며 — 내가 낙원을 만들기로 마음먹은 때부터 미리 준비해 두었던 것이고, 내가 아담이 죄를 짓기 전에 그에게 보여 주었던 것입니다.


    4 그러나 그가 계명을 어겼을 때, 낙원도 그러했듯이 그것은 그에게서 거두어졌습니다.


    5 그 후 나는 밤에, 희생제물의 조각들 사이에서 내 종 아브라함에게도 그것을 보여 주었습니다.


    6 그리고 다시 시내 산에서, 내가 성막과 그 모든 기구의 모양을 그에게 보여 주었을 때, 모세에게도 그것을 보여 주었습니다.”[a][b][c]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܫܬܠܡܐ / ܡܬܕܒܪ ܫܒܝܐ
  english_pob_choice: will be delivered up / will be led away into captivity
  chosen_korean: 한동안 넘겨질 것이며 / 포로로 끌려가겠지만
  alternatives_korean:
  - 넘겨질 것이며 / 포로로 잡혀가겠지만
  - 인도되어 갈 것이며 / 사로잡혀 가겠지만
  lexicon: Payne Smith
  rationale: 도성은 일시적으로 ‘넘겨짐’의 뉘앙스를 살리고, 백성은 실제 포로 이동을 드러내기 위해 ‘포로로 끌려가다’로 옮겼습니다. temporal qualifier는 첫째 절에만 두어 Syriac 구조를 따랐습니다.
- source_word: ܥܠܡܐ ܠܐ ܡܬܬܢܫܐ
  english_pob_choice: the world will not be forgotten
  chosen_korean: 세상은 잊히지 않을 것입니다
  alternatives_korean:
  - 세상은 버림받지 않을 것입니다
  - 세상은 망각되지 않을 것입니다
  lexicon: Payne Smith
  rationale: Syriac의 이미지가 ‘기억에서 사라지지 않음’에 가깝기 때문에, POB의 결을 따라 ‘잊히지 않는다’로 간결하게 살렸습니다.
- source_word: ܡܕܝܢܬܐ
  english_pob_choice: city
  chosen_korean: 도성
  alternatives_korean:
  - 도시
  - 성읍
  lexicon: Payne Smith
  rationale: 본문은 일반적 city이지만, 문맥상 종말론적/성전적 성격의 도시이므로 한국어 성서 문체에서 자연스러운 ‘도성’을 택했습니다. 본문에서 예루살렘을 미리 단정하지 않기 위해 고유명사는 피했습니다.
- source_word: ܦܪܕܝܣܐ
  english_pob_choice: Paradise
  chosen_korean: 낙원
  alternatives_korean:
  - 파라다이스
  - 동산
  lexicon: Payne Smith
  rationale: 아담-낙원-계명 위반의 연결을 살리기 위해 교리적·문학적 울림이 있는 ‘낙원’을 유지했습니다.
- source_word: ܒܝܢܬ ܦܓܪ̈ܐ ܕܕܒܚܐ
  english_pob_choice: between the pieces of the sacrifice
  chosen_korean: 희생제물의 조각들 사이에서
  alternatives_korean:
  - 희생제물의 조각들 사이에
  - 제물의 쪼갠 조각들 사이에서
  lexicon: Payne Smith
  rationale: 아브라함의 언약 장면을 드러내되 과도한 해설은 피하고, 제물 조각 사이를 가로지르는 장면을 한국어로 자연스럽게 표현했습니다.
- source_word: ܡܪܝܐ / ܠܘܬ ܒܪܘܟ
  english_pob_choice: the Lord said to me
  chosen_korean: 주님께서 제게 말씀하셨습니다
  alternatives_korean:
  - 주께서 내게 말씀하셨습니다
  - 주님이 저에게 말씀하셨습니다
  lexicon: Payne Smith
  rationale: 내러티브는 합쇼체로, 신적 화자는 공손한 직접화법을 유지해 ‘주님께서’와 ‘제게’로 옮겼습니다.
theological_decisions:
- issue: ‘이 도성’과 ‘내가 말한 그 도성’의 대비
  chosen_reading: 본문은 현재 눈앞의 도성과 하나님이 미리 새겨 두었다고 말한 도성을 대비합니다.
  alternative_readings:
  - 현재의 예루살렘만을 가리키는 단순한 수사
  - 미래 재건된 예루살렘만을 말하는 표현
  rationale: Syriac의 수사 질문은 현시점의 도성과 선재적으로 준비된 도성을 구분합니다. 이를 흐리지 않기 위해 ‘바로 그 도성’과 ‘미리 준비해 두었던 것’을 살렸습니다.
  doctrine_reference: pre-prepared/heavenly city motif
- issue: 포로와 세계의 관계
  chosen_reading: 도성과 백성의 심판은 일시적이지만, 창조 세계 전체의 망각이나 폐기는 아닙니다.
  alternative_readings:
  - 세계도 함께 버려진다는 뜻
  - 심판이 곧 종말적 폐기를 뜻한다는 읽기
  rationale: ‘한동안’과 ‘세상은 잊히지 않을 것입니다’가 심판의 엄중함과 하나님의 기억/보존을 함께 유지합니다.
  doctrine_reference: divine judgment with remembered mercy
