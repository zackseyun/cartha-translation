  text: He answered and said to me[a], “Hear then the word. For the earth will then surely give back the dead whom it now receives, keeping them without changing anything in their form. But as it received them, so it will restore them, and as I delivered them to it, so it will also raise them. For then it is necessary to show the living that the dead have come to life, and that those who had departed have returned. And it shall be, when those who now know one another have recognized one another, then judgment will grow strong[b], and those things that were spoken beforehand will come.”
  footnotes:
  - marker: a
    text: The chapter edge is slightly unstable in the current Ceriani bucket. The page supplied in the prompt preserves the transition into the answer, while the continuation of the answer runs onto the adjacent page.
    reason: textual_variant
  - marker: b
    text: The final clause about judgment and the previously spoken things is textually awkward in the Ceriani lineation here; the rendering follows the control-backed sense without claiming complete certainty for every word of the edge line.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 대답하여 제게 말했습니다[a]. “그러니 말씀을 들으십시오. 땅이 이제 받는 죽은 이들을 반드시 다시 내줄 것이기 때문입니다. 그리고 그들의 형체를 조금도 바꾸지 않은 채 붙들고 있다가, 그것을 받았던 그대로 다시 돌려주고, 제가 그것들을 그곳에 넘겨주었듯이 그것들을 또한 일으킬 것입니다. 그러므로 그때에는 살아 있는 이들에게 죽은 이들이 살아났고, 떠나갔던 이들이 돌아왔음을 보여 주어야 합니다. 그리고 지금 서로를 아는 사람들이 서로를 알아보게 될 때, 심판은 더욱 굳게 세워지고[b], 미리 말해진 것들이 이루어질 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܒܥܘܢ ܫܘܒܩܢܐ
  english_pob_choice: give back / restore
  chosen_korean: 다시 내줄 것입니다 / 다시 돌려주고
  alternatives_korean:
  - 되돌려줄 것입니다
  - 돌려보낼 것입니다
  lexicon: Payne Smith
  rationale: 땅이 죽은 이들을 잠시 받아 두었다가 다시 반환하는 이미지이므로, 단순히 ‘내놓다’보다 ‘다시 내주다/돌려주다’가 소유 회복과 반환의 뉘앙스를 더 잘 드러냅니다.
- source_word: ܒܨܘܪܬܗܘܢ
  english_pob_choice: in their form
  chosen_korean: 그들의 형체
  alternatives_korean:
  - 그들의 모습
  - 그들의 모양
  lexicon: Payne Smith
  rationale: 본문은 부활 전후의 동일성과 연속성을 말하므로, 외형보다 넓고도 구체적인 ‘형체’가 적절합니다.
- source_word: ܡܩܝܡܐ
  english_pob_choice: raise
  chosen_korean: 일으킬 것입니다
  alternatives_korean:
  - 다시 세울 것입니다
  - 살리실 것입니다
  lexicon: Payne Smith
  rationale: 이 동사는 단순한 배치가 아니라 부활적 ‘일으킴’의 힘을 가지므로, 한국어로도 그 역동성을 살렸습니다.
- source_word: ܐܬܝܕܥܘ ܚܕ ܠܚܕ
  english_pob_choice: recognized one another
  chosen_korean: 서로를 알아보게 될 때
  alternatives_korean:
  - 서로를 다시 알게 될 때
  - 서로를 알아볼 때
  lexicon: Payne Smith
  rationale: 본문은 추상적 인지가 아니라 상호 인식을 말하므로, ‘서로를 알아보다’로 분명하게 옮겼습니다.
theological_decisions:
- issue: 부활의 연속성
  chosen_reading: 죽은 이들은 땅이 받았던 그대로 다시 돌려받고, 형체를 잃지 않은 채 일으켜져서, 개인의 동일성이 유지됩니다.
  alternative_readings:
  - 상징적 회복 장면
  - 개인적 연속성이 약한 영적 재현
  rationale: 받음-돌려줌-일으킴의 반복과 ‘형체’ 언급이 부활의 실제성과 인격적 연속성을 강하게 지지합니다.
  doctrine_reference: translation philosophy; bodily continuity
- issue: 심판과 상호 인식의 관계
  chosen_reading: 서로의 인식은 단순한 재회가 아니라, 살아 있는 자들 앞에서 부활이 공적으로 확인되고 심판이 굳게 세워지는 계기가 됩니다.
  alternative_readings:
  - 정서적 재회의 묘사일 뿐
  - 심판과 무관한 부차적 장면
  rationale: 본문은 살아 있는 자들에게 보여 주는 것과 심판의 견고함을 직접 연결하므로, 인식은 종말론적 공적 증거의 기능을 갖습니다.
  doctrine_reference: eschatology; public vindication
