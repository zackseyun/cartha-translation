base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/085/001.yaml
  text: '… the times are close and already pressing in. The pitcher is near the well, the ship the harbor, the journey the city, and life its completion.


    So then receive his commandments, that you may not be cut off from the greatness of his mercy, but may find rest and not condemnation.


    For when the Most High brings these things to pass, there will no longer be room for repentance, or a boundary for the times, or an extension of the seasons, or a turning toward rest; nor will anyone be helped by prayer, or by the mediation of fathers, or by the petition of prophets, or by the aid of the righteous, or by the weeping of women, or by the tenderness of little children, or by the crying of infants, or by the innocence of newborns, or by the righteousness of their fathers. None of the things once thought and seen to be helpers will be able to help.


    For each of us will then be judged by himself alone.


    And he will preserve for his age those who have hope in him, but he will at once destroy those who are defiled with sins.'
  footnotes:
  - marker: a
    text: Or 'stand by himself alone'.
    reason: previous_rendering
translation:
  language: ko
  text: '…때가 가까워졌고 이미 몰려오고 있습니다. 항아리는 우물에, 배는 항구에, 여행은 도시에, 그리고 생명은 그 완성에 가깝습니다.


    그러므로 그의 계명을 받으십시오. 그래야 그의 큰 긍휼에서 끊어지지 않고, 안식을 얻으며 정죄를 받지 않을 것입니다.


    지극히 높으신 분이 이것들을 이루실 때에는, 더 이상 회개할 여지도, 때의 경계도, 계절의 연장도, 안식으로 향함도 없을 것입니다. 또 기도도, 조상들의 중재도, 예언자들의 간구도, 의인들의 도움도, 여인들의 울음도, 어린아이들의 부드러움도, 젖먹이들의 울부짖음도, 갓난아이들의 순결도, 그들의 아버지들의 의로움도 누구에게도 도움이 되지 않을 것입니다. 한때 도움이라고 생각되고 그렇게 여겨졌던 것들 가운데 그 어느 것도 도움을 줄 수 없을 것입니다.


    그때에는 우리 각 사람이 홀로 심판받을 것입니다.


    그리고 그는 그를 바라는 자들을 그의 시대를 위하여 보존하실 것이며, 죄로 더럽혀진 자들을 즉시 멸하실 것입니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܦܩ̈ܘܕܘܗܝ
  english_pob_choice: his commandments
  chosen_korean: 그의 계명
  alternatives_korean:
  - 그의 명령
  - 그의 규례
  lexicon: Payne Smith
  rationale: 시리아어는 권위를 지닌 하나님의 명령을 가리키므로, 한국어에서는 ‘계명’이 가장 자연스럽게 그 규범성과 언약적 권위를 살립니다.
- source_word: ܬܐܢܝܚܘܢ
  english_pob_choice: find rest
  chosen_korean: 안식을 얻으며
  alternatives_korean:
  - 쉼을 얻으며
  - 위로를 받으며
  lexicon: Payne Smith
  rationale: 문맥이 심판과 정죄의 대비이므로, 단순한 위로나 휴식보다 종말론적 쉼을 드러내는 ‘안식’을 택했습니다.
- source_word: ܒܟܝܐ ܕܢܫ̈ܐ / ܛܝܒܘܬܐ ܕܛܠܝ̈ܐ / ܕܟܝܘܬܐ ܕܝܠܝ̈ܕܐ
  english_pob_choice: the weeping of women / the tenderness of little children / the innocence of newborns
  chosen_korean: 여인들의 울음 / 어린아이들의 부드러움 / 젖먹이들의 울부짖음 / 갓난아이들의 순결
  alternatives_korean:
  - 여인들의 통곡 / 어린아이들의 사랑스러움 / 아기들의 울음 / 갓난아이들의 깨끗함
  lexicon: Payne Smith
  rationale: 이 목록은 중재 가능성의 점층적 열거이므로, 각 표현의 감정적 호소력을 살리되 과도하게 완화하지 않도록 직역에 가깝게 옮겼습니다.
- source_word: ܡܬܬܕܝܢ
  english_pob_choice: be judged by himself alone
  chosen_korean: 홀로 심판받을
  alternatives_korean:
  - 스스로 서게 될
  - 자기 혼자 판단받을
  lexicon: Payne Smith
  rationale: 시리아어 동사는 ‘서다’가 아니라 ‘심판받다’이므로, 본문 의미를 직접적으로 드러내는 한국어를 사용했습니다.
- source_word: ܡܦܠܓܝܢ ܒܚܛܝ̈ܬܐ
  english_pob_choice: defiled with sins
  chosen_korean: 죄로 더럽혀진
  alternatives_korean:
  - 죄들로 나뉜
  - 죄에 얽힌
  lexicon: Payne Smith
  rationale: 원문은 죄 가운데 있는 상태를 가리키므로, 한국어에서는 도덕적 오염 상태를 분명히 하는 ‘더럽혀진’이 가장 적절합니다.
theological_decisions:
- issue: 마지막 심판에서 여러 중재 수단이 무력하다는 긴 열거를 어떻게 처리할 것인가
  chosen_reading: 기도, 조상들의 중재, 예언자들의 간구, 의인들의 도움, 여성과 아이들의 울음까지 각각 구분하여 살렸습니다.
  alternative_readings:
  - ‘아무 중재도 소용없다’로 요약
  - 열거를 일부 통합하여 간략화
  rationale: 시리아어 수사는 누적적이고 강한 경고를 이루므로, 항목들을 유지해야 독자가 각 ‘도움’의 무력함을 본문대로 읽을 수 있습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: 마지막 보존 절을 어떻게 신학적으로 드러낼 것인가
  chosen_reading: ‘그를 바라는 자들을 그의 시대를 위해 보존하실 것이며’로 옮겼습니다.
  alternative_readings:
  - ‘그 안에 소망이 있는 자들’
  - ‘그가 합당하다고 여기는 자들’
  rationale: 시리아어는 하나님께 소망을 둔 사람들을 가리키므로, 관계를 분명히 하되 새로운 교리를 덧붙이지 않도록 했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1
