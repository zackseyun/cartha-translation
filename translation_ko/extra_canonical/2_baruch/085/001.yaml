  to: '…때가 가까워졌고 이미 몰려오고 있습니다. 항아리는 우물에, 배는 항구에, 여행은 도시에, 그리고 생명은 그 완성에 가깝습니다.


    그러므로 그의 계명을 받으십시오. 그래야 그의 큰 긍휼에서 끊어지지 않고, 안식을 얻으며 정죄를 받지 않을 것입니다.


    지극히 높으신 분이 이것들을 이루실 때에는, 더 이상 회개할 여지도, 때의 경계도, 계절의 연장도, 안식으로 향함도 없을 것입니다. 또 기도도, 조상들의 중재도, 예언자들의 간구도, 의인들의 도움도, 여인들의 울음도, 어린아이들의 부드러움도, 젖먹이들의 울부짖음도, 갓난아이들의 순결도, 그들의 아버지들의 의로움도 누구에게도 도움이 되지 않을 것입니다. 한때 도움이라고 생각되고 그렇게 여겨졌던 것들 가운데 그 어느 것도 도움을 줄 수 없을 것입니다.


    그때에는 우리 각 사람이 홀로 심판받을 것입니다.


    그리고 그는 그를 바라는 자들을 그의 시대를 위하여 보존하실 것이며, 죄로 더럽혀진 자들을 즉시 멸하실 것입니다.'
  rationale: 정의되지 않은 [a][b] 표지를 삭제하여 각주 구조를 완결했습니다. 본문의 의미는 바꾸지 않고, ‘안식으로 향함’과 ‘그 어느 것도 도움을 줄 수 없을 것입니다’로 시리아어 및 영어 POB의 수사적 의미를 더 자연스러운 현대 한국어로 옮겼습니다. 마지막의 ‘그의 시대’는 원문의 다소 난해한 ‘his age’를 해석적으로 확정하지 않고 보존했습니다.
