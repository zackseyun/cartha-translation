translation:
  language: ko
  text: '그러나 위로의 말씀도 들으십시오. 나는 시온을 두고 슬퍼하며 지극히 높으신 분께 자비를 구하여 말했습니다. 「이 일들이 우리에게 끝까지 계속되겠습니까? 그리고 이런 환난들이 우리에게 늘 닥치겠습니까?」 그러자 능하신 분이 그의 자비의 풍성함에 따라 행하시고, 그의 은혜의 위대함에 따라 우리를 용서하셨습니다. 그리고 내가 강건해지도록 말씀을 내게 드러내셨고, 내가 다시 흔들리지 않도록 환상을 보여 주셨으며, 때들의 비밀을 내게 알리시고, 세대들의 도래를 내게 보여 주셨습니다.


    그러므로 내 형제들이여, 나는 여러분이 겪는 환난의 많음 때문에 위로를 받도록 여러분에게 이 글을 썼습니다. 우리 지으신 분께서 우리의 모든 원수들이 우리에게 저지른 모든 악한 일에 대해 그들에게 보응을 요구하실 것이며, 지극히 높으신 분이 예비하신 끝이 가까이 왔고 그의 자비가 오고 있으며, 그의 심판의 완성이 멀지 않다는 것을 아십시오.


    지금 우리는 나라들의 번성의 풍성함을 보면서도 그들이 악을 행하는 것을 봅니다. 그러나 그것은 물방울처럼 여겨질 것입니다. 우리는 그들의 권세의 힘을 바라보지만, 그것은 침처럼 셈해질 것입니다. 우리는 그들의 위대함의 영광을 생각하지만, 그들은 능하신 분의 명령들을 지키지 않고 오히려 그것을 멸시했습니다. 우리는 환난 가운데 흔들리는 아름다움을 보지만, 그것은 고통받는 살처럼 찾아질 것입니다. 우리는 그들이 의지하는 확신만을 헤아리지만, 그것은 우리 눈앞에서 흔들리겠고, 그러나 그들은 파도처럼 부서질 것입니다. 그리고 우리는 하나님께서 그들에게 주신 좋은 것들 가운데 번성하는 그들의 힘의 소망만을 바라보지만, 그것은 사라져 쌓여 두어질 것이며, 애통이 그것을 덮칠 것입니다.[a]'
  philosophy: optimal-equivalence
