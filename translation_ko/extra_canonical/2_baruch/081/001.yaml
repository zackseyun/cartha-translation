theological_decisions:
- issue: ‘our Maker will require vengeance’의 한국어 처리
  chosen_reading: 우리 지으신 분께서 ... 보응을 요구하실 것
  alternative_readings:
  - 우리 지으신 분께서 ... 원수를 갚으실 것
  - 우리 지으신 분께서 ... 공의를 집행하실 것
  rationale: 단순한 감정적 복수보다 법정적·언약적 변호의 의미가 강하므로, 엄중한 심판의 뉘앙스를 유지하는 표현을 택했습니다.
  doctrine_reference: divine justice and eschatological vindication
- issue: ‘completion of his judgment’의 종말론적 어조
  chosen_reading: 그의 심판의 완성이 멀지 않다
  alternative_readings:
  - 그의 심판의 끝이 멀지 않다
  - 그의 심판이 곧 완성될 것이다
  rationale: 시간적 ‘끝’으로만 좁히지 않고, 이미 준비된 심판이 완결 단계에 이르고 있음을 살렸습니다.
  doctrine_reference: apocalyptic consummation
