translation:
  language: ko
  text: '그러나 위로의 말씀[a]도 들으십시오. 나는 시온을 두고 애통하며 지극히 높으신 분께 자비를 구하고 말했습니다. 「이 일들이 우리에게 끝까지 계속되겠습니까? 이런 환난들이 언제나 우리에게 닥치겠습니까?」 그러자 능하신 분께서는 그의 자비가 풍성하심을 따라 행하셨고, 그의 은혜가 크심을 따라 우리를 아끼셨습니다. 그리고 내가 굳세어지도록 말씀을 내게 드러내셨고, 내가 다시 흔들리지 않도록 환상들을 내게 주셨으며, 때들의 비밀을 내게 알리시고 세대들의 도래를 내게 보여 주셨습니다.


    그러므로 나의 형제들이여, 여러분이 겪는 많은 환난으로 말미암아 위로를 받게 하려고 내가 여러분에게 이 글을 썼습니다. 우리 창조주께서 우리의 모든 원수가 우리에게 저지른 모든 악행에 대하여 그들에게 보응을 물으실 것이며, 지극히 높으신 분께서 마련하신 완성이 가까이 왔고 그의 자비가 오고 있으며, 그의 심판의 완성이 멀지 않았다는 것을 아십시오.


    지금 우리는 나라들의 풍성한 번영을 보면서 그들이 악을 행하는 것도 봅니다. 그러나 그들은 물방울처럼 여겨질 것입니다. 우리는 그들의 권세의 힘을 바라보지만, 그것은 침처럼 셈해질 것입니다. 우리는 그들의 위대함의 영광을 생각하지만, 그들은 능하신 분의 명령들을 지키지 않고 그것들을 멸시했습니다. 우리는 환난 가운데 흔들리는 아름다움을 보지만, 그것은 고통 중의 살처럼 찾아내어질 것입니다. 우리는 그들이 의지하는 확신만을 헤아리지만, 그것은 우리 눈앞에서 흔들리고, 그들은 파도처럼 부서질 것입니다. 우리는 하나님께서 그들에게 주신 좋은 것들 가운데 번성하는 그들의 힘에 대한 소망만을 바라보지만, 그것은 감추어 두어질 것이며 애통이 그것을 덮칠 것입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘위로에 관하여’.
    reason: 시리아어 구문은 직접적으로 ‘위로의 말씀’을 뜻하며, 영어 POB 감사본의 기존 대안(‘concerning consolation’)을 한국어로 보존합니다. 표지는 해당 구문에 붙입니다.
