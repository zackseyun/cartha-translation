- from: '그러나 위로의 말씀도 들으십시오. 나는 시온을 두고 슬퍼하며 지극히 높으신 분께 자비를 구하여 말했습니다. 「이 일들이 우리에게 끝까지 계속되겠습니까? 그리고 이런 환난들이 우리에게 늘 닥치겠습니까?」 그러자 능하신 분이 그의 자비의 풍성함에 따라 행하시고, 그의 은혜의 위대함에 따라 우리를 용서하셨습니다. 그리고 내가 강건해지도록 말씀을 내게 드러내셨고, 내가 다시 흔들리지 않도록 환상을 보여 주셨으며, 때들의 비밀을 내게 알리시고, 세대들의 도래를 내게 보여 주셨습니다.


