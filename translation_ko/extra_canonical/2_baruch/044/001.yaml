    text: Or 'and the mighty ones of the people, and the elders'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나 바룩은 그곳에서 떠나 백성에게로 갔습니다. 나는 내 맏아들과 그곳의 주민들과 그 유력한 이들의 장로들과 백성의 장로들 가운데 낮은 이들을 불러 모으고, 그들에게 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “백성의 유력한 이들과 장로들”.
    reason: 이 난해한 열거는 다른 구문 분석이 가능하므로, 영어 POB 감사 기록에 제시된 대안적 독법을 반영합니다.
lexical_decisions:
- source_word: ܒܘܟܪܝ
  english_pob_choice: my firstborn
  chosen_korean: 나의 맏아들
  alternatives_korean:
  - 나의 첫아들
  - 첫째 아들
  lexicon: Payne Smith
  rationale: 시리아어 형태는 문자적으로 ‘firstborn’에 가깝지만, 이 문맥에서는 사람을 부르는 호칭이므로 직역적인 가족 표현을 살렸습니다. 영어 POB의 ‘my firstborn’에 맞추되, 한국어에서는 자연스러운 ‘맏아들’이 가장 직접적입니다.
- source_word: ܥܡܘܪܝܗ
  english_pob_choice: its inhabitants
  chosen_korean: 그 성읍의 주민들
  alternatives_korean:
  - 그것의 주민들
  - 그곳의 거주자들
  lexicon: Payne Smith
  rationale: 대상은 도시/공동체의 거주민들을 가리키므로, 지시대명사를 한국어에서 자연스럽게 풀어 ‘그 성읍의 주민들’로 옮겼습니다.
- source_word: ܩܫܝܫܝ ܪ̈ܘܪܒܢܘܗܝ
  english_pob_choice: the elders of its great ones
  chosen_korean: 그 큰 이들의 장로들
  alternatives_korean:
  - 그 큰 자들의 장로들
  - 그 권세 있는 이들의 장로들
  lexicon: Payne Smith
  rationale: 구문이 ‘great ones’와 ‘elders’의 소유/수식 관계를 가지므로, 의미를 풀어 ‘그 큰 이들의 장로들’로 옮겼습니다. 전통적 교회용어를 덧붙이지 않고 계층적 호칭의 긴장을 그대로 남겼습니다.
- source_word: ܡܟܝܟܐ
  english_pob_choice: the lowly
  chosen_korean: 낮은 이들
  alternatives_korean:
  - 겸손한 이들
  - 천한 이들
  lexicon: Payne Smith
  rationale: 사회적 낮은 지위를 가리키는 뉘앙스를 살리기 위해 ‘낮은 이들’을 선택했습니다. ‘겸손한 이들’은 도덕적 성향으로 기울 수 있어 여기서는 덜 적절합니다.
theological_decisions:
- issue: 호칭 목록의 사회적 계층성
  chosen_reading: 왕성한/유력한 이들과 낮은 이들을 함께 부르는 공적 집회로 이해했습니다.
  alternative_readings:
  - 단순히 지도층과 평민의 이중 구분으로 읽기
  - 수사적 과장으로만 처리하기
  rationale: 본문은 맏아들, 주민, 큰 이들의 장로, 낮은 이들을 연속해서 열거하여 공동체 전 계층을 포괄합니다. 이 사회적 긴장을 완화하지 않고 보존하는 편이 원문 의도에 가깝습니다.
  doctrine_reference: 공동체 전체를 향한 예언자적 소환
