- from: 그리고 나는 그곳에서 떠나 백성에게로 갔습니다. 나는 나의 맏아들과 그 성읍의 주민들과 그 큰 이들의 장로들과 백성의 장로들 가운데서 낮은 이들을 불러 모으고 그들에게 말했습니다.[a]
