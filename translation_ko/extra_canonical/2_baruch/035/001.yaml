  yaml_path: translation/extra_canonical/2_baruch/035/001.yaml
  text: 'And I, Baruch, went to the holy gate, and sat down in humility, and I wept and said:


    “O my eyes, become springs,

    and eyelids of water, a fountain of tears.

    For how can I find rest over Zion?

    And how can I weep for Jerusalem?

    For the people whom I nourished

    and who were formerly greater than I in vision

    have been shaken with trembling.”'
  footnotes:
  - marker: a
    text: Or 'And how can I weep for the mourning and find it?'.
    reason: previous_rendering
translation:
  language: ko
  text: '바룩인 나는 거룩한 문으로 가서 겸손히 앉아 울며 말하였습니다.


    “오 내 눈들아, 샘들이 되라.

    물의 눈꺼풀들, 눈물의 샘이 되라.

    시온 위에서 내가 어떻게 안식을 찾겠습니까?

    예루살렘을 두고 내가 어떻게 울겠습니까?

    내가 기르던 백성, 그리고 이전에는 나보다 환상에서 더 컸던 그들이 떨림에 흔들렸기 때문입니다.”[a]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܬܪܥܐ ܩܕܝܫܐ
  english_pob_choice: the holy gate
  chosen_korean: 거룩한 문
  alternatives_korean:
  - 거룩한 문간
  - 성스러운 문
  lexicon: Payne Smith
  rationale: 시리아어는 구체적으로 ‘문/문짝’의 뜻이 강하므로, 추상화된 ‘장소’보다 문을 살리되 한국어에서는 자연스럽게 ‘거룩한 문’으로 옮겼습니다.
- source_word: ܡ̈ܟܝܟܐܝܬ
  english_pob_choice: in humility
  chosen_korean: 겸손히
  alternatives_korean:
  - 낮아져서
  - 비천한 마음으로
  lexicon: Payne Smith
  rationale: 기도와 애도의 자세를 드러내는 부사이므로, 현대 합쇼체에서 어색하지 않으면서도 낮춤의 태도를 담는 ‘겸손히’를 택했습니다.
- source_word: ܡܒܘ̈ܥܐ
  english_pob_choice: springs
  chosen_korean: 샘들
  alternatives_korean:
  - 샘물
  - 우물들
  lexicon: Payne Smith
  rationale: 복수의 물줄기 이미지를 직관적으로 살리기 위해 ‘샘들’로 옮겼습니다.
- source_word: ܐܡܘ̈ܬܐ
  english_pob_choice: eyelids
  chosen_korean: 눈꺼풀들
  alternatives_korean:
  - 눈두덩이
  - 눈시울
  lexicon: Payne Smith
  rationale: 본문 전승이 눈의 몸짓을 가리키는 표현으로 이해되므로, ‘눈꺼풀들’로 직역에 가깝게 옮겨 눈물의 흐름과 연결했습니다.
- source_word: ܐܬܬܢܝܚ
  english_pob_choice: find rest
  chosen_korean: 안식을 찾다
  alternatives_korean:
  - 쉬다
  - 평안을 얻다
  lexicon: Payne Smith
  rationale: 시온에 대한 상실감 때문에 마음이 놓이지 않는다는 뜻을 살려, 정서적·종말론적 뉘앙스를 함께 품는 ‘안식을 찾다’를 택했습니다.
- source_word: ܐܒܠܐ
  english_pob_choice: Jerusalem
  chosen_korean: 예루살렘
  alternatives_korean:
  - 애통
  - 애도
  lexicon: Payne Smith
  rationale: 문맥상 시온-예루살렘 병행이 요구되므로, 영어 본문이 채택한 예루살렘을 그대로 살려 장소 대조를 분명히 했습니다.
theological_decisions:
- issue: ‘나보다…더 컸던’의 관계를 어떻게 살릴지
  chosen_reading: 예언자 바룩의 낮아짐과, 한때 그보다 더 큰 비전의 은사를 받았던 백성의 동요를 함께 드러냈습니다.
  alternative_readings:
  - 단순히 ‘내가 가르쳤던 백성’으로 완화하는 번역
  - ‘더 컸던’ 대신 ‘더 훌륭했던’으로 도덕화하는 번역
  rationale: 본문은 위계나 도덕성보다 비전/계시의 크기를 말하므로, 비교의 긴장을 유지하는 쪽이 더 원문에 가깝습니다.
  doctrine_reference: 예언적 계시와 탄식의 문맥
- issue: ‘떨림에 흔들렸다’의 반복
  chosen_reading: 중복을 줄이지 않고 ‘떨림에 흔들렸다’로 옮겼습니다.
  alternative_readings:
  - ‘몹시 흔들렸다’로 단순화
  - ‘두려움에 사로잡혔다’로 해석화
  rationale: 시리아어의 긴박한 동작성과 불안의 중첩을 보존하기 위해 반복적 표현을 유지했습니다.
  doctrine_reference: 문학적 반복의 보존
