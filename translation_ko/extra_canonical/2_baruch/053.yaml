base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/053.yaml
  text: 'And when I had said these things[a], I slept there, and I saw a vision by night. And behold, I saw from the great sea a cloud ascending, and it was full of white and black waters, and there were many colors in those waters, and on its head there appeared the likeness of a great lightning. And I looked, and that cloud passed swiftly in a violent course and covered the whole earth. And after these things, waters began to descend from it upon the earth, and I saw that those waters did not all have one appearance. And after these things again I saw black, and after these things again bright, and again black, and again bright. And this was until twelve times, but the black were more numerous than the bright in all of them.


    And it came to pass, at the end of the cloud, that black waters, darker than all the waters that had been before, descended; and wherever those waters descended, they produced ruin and destruction. And after these things I saw that lightning, which I had seen at the head of the cloud, and it seized it and flashed. And it became as a man, and in the days of tribulation men came to see how they might pass through. And after these things I saw twelve rivers ascending from the sea, and they were joined to that flash and were praising it[b][c][d][e][f][g]. And I awoke from fear.'
  footnotes:
  - marker: a
    text: Many editions begin this chapter at “And when I had said these things, I sat there, and I saw a vision by night.” The preceding moral consolations are often assigned to the previous section.
    reason: alternative_reading
    anchor_ref: '53:1'
  - marker: g
    text: Some control witnesses read “and fire was mixed in them,” describing the final black waters.
    reason: textual_variant
    anchor_ref: '53:7'
  - marker: f
    text: Control witness (Kmosko) clarifies that the lightning “illumined the earth and healed the regions where the last waters descended” and then “occupied the whole earth and had dominion.” The primary Syriac lineation here is partially obscured.
    reason: textual_variant
    anchor_ref: 53:8-9
  - marker: e
    text: Syriac spelling here can be read as “rivers” (naharē) or “lights” (nūhrē). Context and the Latin control favor “rivers.”
    reason: textual_variant
    anchor_ref: '53:11'
  - marker: d
    text: Or 'I sat there'.
    reason: previous_rendering
  - marker: c
    text: Or 'a cloud ascending, white and black; and in that cloud there was much water'.
    reason: previous_rendering
  - marker: b
    text: Or 'On the earth I saw that people were dying, but they were not many.'.
    reason: previous_rendering
translation:
  language: ko
  text: '내가 이 말을 마치고 거기서 잠이 들었는데, 밤에 환상을 보았습니다. 보라, 큰 바다에서 구름 하나가 올라오는 것을 보았는데, 그 안에는 흰 물과 검은 물이 가득했고, 그 물들에는 여러 빛깔이 섞여 있었으며, 그 꼭대기에는 큰 번개와 같은 것이 나타났습니다. 내가 바라보니 그 구름은 거센 기세로 빠르게 지나가 온 땅을 덮었습니다. 그 뒤에 물들이 그 구름에서 땅 위로 내려오기 시작했는데, 나는 그 물들이 다 한 모양은 아님을 보았습니다. 그 뒤에 다시 검은 것이 보였고, 그 뒤에 다시 밝은 것이 보였으며, 또 검은 것, 또 밝은 것이 이어졌습니다. 이것이 열두 번까지 계속되었으나, 모든 경우에 검은 것이 밝은 것보다 더 많았습니다.


    그 구름의 끝에 이르러서는, 이전의 모든 물보다 더 어두운 검은 물들이 내려왔고, 그 물들이 내리는 곳마다 파괴와 멸망을 일으켰습니다. 그 뒤에 나는 구름 꼭대기에서 보았던 바로 그 번개가 그것을 붙잡아 번쩍이는 것을 보았습니다. 그것은 사람과 같게 되었고, 환난의 날들에 사람들은 어떻게 지나갈 수 있는지를 보려고 나왔습니다. 그 뒤에 나는 바다에서 올라오는 열두 강을 보았는데, 그 강들은 그 번쩍임에 합쳐져 그것을 찬양하고 있었습니다. 나는 두려움으로 깨어났습니다.[a][b][c][d][e][f][g]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܢܢܐ
  english_pob_choice: cloud
  chosen_korean: 구름
  alternatives_korean:
  - 먹구름
  - 폭풍구름
  lexicon: Payne Smith
  rationale: 일반적인 ‘구름’으로 옮기되, 문맥상 거대한 종말적 현상이라는 점은 주변 묘사로 드러나게 두었습니다.
- source_word: ܡܬܚܫܒܝܢ ܬܡܢ ܘܗܠܝܢ
  english_pob_choice: those waters did not all have one appearance
  chosen_korean: 그 물들이 다 한 모양은 아님을
  alternatives_korean:
  - 그 물들이 모두 같은 모습이 아님을
  - 그 물들이 한 가지 모양이 아님을
  lexicon: 문맥상 반복되는 색 대비
  rationale: 연속된 검은/밝은 물의 대비를 자연스러운 한국어로 풀어, ‘한 모양이 아님’이라는 관찰을 살렸습니다.
- source_word: ܐܘܟܡܐ / ܢܗܝܪܐ
  english_pob_choice: black / bright
  chosen_korean: 검은 / 밝은
  alternatives_korean:
  - 어두운 / 빛나는
  - 검은 / 빛나는
  lexicon: Payne Smith
  rationale: 대조를 분명히 하기 위해 ‘bright’를 ‘밝은’으로 두었고, 반복 구조를 살리기 위해 간결하게 유지했습니다.
- source_word: ܒܪܩܐ
  english_pob_choice: lightning
  chosen_korean: 번개
  alternatives_korean:
  - 번쩍임
  - 번갯불
  lexicon: Payne Smith
  rationale: 현대 한국어에서 가장 직관적인 대응어는 ‘번개’이며, 뒤의 ‘번쩍이는’으로 동작성을 보완했습니다.
- source_word: ܢܗ̈ܪܐ/ܢܘܗ̈ܪܐ
  english_pob_choice: rivers
  chosen_korean: 열두 강
  alternatives_korean:
  - 열두 빛
  - 열두 광채
  lexicon: Payne Smith; Kmosko Latin control
  rationale: 문맥과 대조 본문이 ‘강들’을 지지하므로 ‘강’으로 옮기고, 그 의미를 분명히 하기 위해 수량을 그대로 살렸습니다.
- source_word: ܡܫܒܚܝܢ
  english_pob_choice: were praising it
  chosen_korean: 찬양하고 있었습니다
  alternatives_korean:
  - 찬미하고 있었습니다
  - 그것을 찬송하고 있었습니다
  lexicon: Payne Smith
  rationale: 시리아어 동사의 기본 의미를 따라, 경건한 찬송의 의미가 드러나는 ‘찬양하다’를 선택했습니다.
theological_decisions:
- issue: 마지막 단락의 ‘열두 강’과 본문의 다른 전승 가능성(‘열두 빛’) 가운데 어느 쪽을 본문으로 둘 것인지
