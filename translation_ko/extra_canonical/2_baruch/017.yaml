  text: And the Lord said to me[a], “With the Most High there is no reckoning of many years or few years. For what did it profit Adam that he lived nine hundred and thirty years, yet transgressed what had been commanded him? So the multitude of time that he lived did not benefit him, but brought death and cut short the years of those born from him. And what did Moses lack because he lived only one hundred and twenty years? Because he was subject to the one who formed him, he brought the law near to the offspring of Jacob and kindled a lamp for the people of Israel.”
  footnotes:
  - marker: a
    text: The chapter opening is preserved in a medium-confidence boundary zone, and several words around the verse transition are OCR-noisy. The sense, however, is strongly supported by the Adam/Moses contrast and the surrounding context.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 주님께서 내게 말씀하셨습니다[a]. 「지극히 높으신 분에게는 많은 해와 적은 해를 따지는 셈이 없습니다. 아담이 그에게 명령된 것을 어겼으니, 그가 구백삼십 년을 산 것이 무슨 유익이 있었습니까? 그러므로 그가 산 많은 세월은 그에게 유익이 되지 못하고, 죽음을 가져왔으며, 그에게서 난 자손들의 해를 줄였습니다. 또한 모세가 백이십 년만 살았다고 해서 무엇이 부족했습니까? 그는 자신을 지으신 분에게 종속되어 있었기 때문에, 야곱의 자손들에게 율법을 가까이 가져왔고 이스라엘 백성을 위해 등불을 밝혔습니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢܝܗܝ
  english_pob_choice: reckoning
  chosen_korean: 따지는 셈
  alternatives_korean:
  - 계산
  - 헤아림
  lexicon: Payne Smith
  rationale: 지극히 높으신 분 앞에서의 시간 ‘셈’이라는 논지를 살리되, 한국어로는 자연스럽고 구어적이지 않은 ‘따지는 셈’으로 계산적 뉘앙스를 유지했습니다.
- source_word: ܙܒܘ̈ܢܝ / ܫ̈ܢܝܗܝ
  english_pob_choice: many years or few years
  chosen_korean: 많은 해와 적은 해
  alternatives_korean:
  - 오랜 세월과 짧은 세월
  - 많은 연수와 적은 연수
  lexicon: Payne Smith
  rationale: 원문 대비 구조를 살려 장구한 기간과 짧은 기간의 대비를 그대로 드러내는 표현을 택했습니다.
- source_word: ܡܘܬܪܐ
  english_pob_choice: profit / benefit
  chosen_korean: 유익
  alternatives_korean:
  - 이익
  - 도움
  lexicon: Payne Smith
  rationale: 아담의 장수와 순종 불순종의 대비가 목적론적 논증이므로, ‘유익’이 문맥상 가장 중립적이고 적절합니다.
- source_word: ܡܒܣܪܝܢ
  english_pob_choice: kindled
  chosen_korean: 밝혔습니다
  alternatives_korean:
  - 붙였습니다
  - 켰습니다
  lexicon: Payne Smith
  rationale: ‘등불’과 결합된 조명 이미지를 살리되, 문맥상 율법의 전달과 계몽을 함께 아우를 수 있는 동사를 택했습니다.
- source_word: ܢܣܘܒܘܬ ܒܪܢܫܐ ܕܒܣܘܪ
  english_pob_choice: the people of Israel
  chosen_korean: 이스라엘 백성
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 후손
  lexicon: Payne Smith
  rationale: 집단적·민족적 범주를 자연스럽게 드러내면서도, 후반의 ‘등불’ 이미지와 연결되는 공동체성을 유지했습니다.
theological_decisions:
- issue: 아담의 장수와 순종의 가치
  chosen_reading: 긴 생명 자체는 구원적 가치가 없고, 순종 없이 산 긴 세월은 오히려 죽음을 낳는다는 논지를 분명히 드러냈습니다.
  alternative_readings:
  - 단지 아담과 모세의 대조를 보여 주는 수사로만 약화할 수 있습니다.
  rationale: 문맥상 질문들은 두 인물의 연수를 비교하려는 것이 아니라, 순종 여부가 삶의 참된 유익을 결정한다는 논증을 형성합니다.
  doctrine_reference: obedience and life
- issue: 모세가 율법을 가까이 가져오고 등불을 밝힘
  chosen_reading: 모세의 역할을 율법의 매개와 계시적 인도라는 두 측면으로 함께 보존했습니다.
  alternative_readings:
  - 모세 자신이 곧 등불이라는 개인적 비유로만 좁힐 수 있습니다.
  - ‘법’으로 번역해 보다 일반적인 규범처럼 만들 수 있습니다.
  rationale: 원문은 ‘율법’과 ‘등불’을 병치하므로, 모세가 율법을 가져와 백성을 비추는 계시적 기능을 살리는 쪽이 더 충실합니다.
  doctrine_reference: law and revelation
