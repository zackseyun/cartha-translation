  yaml_path: translation/extra_canonical/2_baruch/025/001.yaml
  text: 'Then he answered me and said, “You too shall be spared until that time, until the sign that the Mighty One will perform for the inhabitants of the earth at the end of the days. And this will be the sign: bewilderment will seize the inhabitants of the earth, and they will fall into many afflictions; then again into great anguish. And when, because of the abundance of their distress, they say in their thoughts, ‘The Mighty One no longer remembers the earth,’ and they have given up hope, then the time will awaken.”'
  footnotes:
  - marker: a
    text: Or 'Then I answered and said to him, “I too have been shaken because of the dwelling in which I dwell. But the Mighty One has made me know the judgment of the times, and what has happened again after these things. And he said to me, ‘You are not yet at the end. But when you see part of the signs that have happened before, then you will understand that this is the beginning of the anguish that is to come. And they will fall into many sufferings, and they will be in great torments. And when they say in their thoughts, because of their many distresses, “The Mighty One no longer remembers the earth,” then hope will awaken.’'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러자 그가 제게 대답하여 말씀하셨습니다. “너도 그때까지, 곧 마지막 날들에 전능하신 분께서 땅의 주민들을 위해 행하실 표징이 있을 때까지 보호받을 것입니다. 그리고 이것이 그 표징입니다. 혼란이 땅의 주민들을 사로잡을 것이며, 그들은 많은 환난에 빠지고 이어서 큰 고통에 빠질 것입니다. 또 그들이 넘치는 고통 때문에 마음속으로 ‘전능하신 분께서는 더 이상 땅을 기억하지 않으십니다’라고 말하고 희망을 버리면, 그때가 깨어날 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܪܝܡܢܐ
  english_pob_choice: the Mighty One
  chosen_korean: 전능하신 분
  alternatives_korean:
  - 능하신 분
  - 강하신 분
  - 전능자
  lexicon: Payne Smith
  rationale: 제목적 신칭으로서 문맥의 장엄함을 살리면서도 현대 한국어에서 자연스럽게 읽히도록 옮겼습니다. 영어 POB의 ‘the Mighty One’에 대응해 ‘전능하신 분’을 택했습니다.
- source_word: ܬܘܩܢܐ
  english_pob_choice: sign
  chosen_korean: 표징
  alternatives_korean:
  - 징조
  - 표지
  - 신호
  lexicon: Payne Smith
  rationale: 종말론적 식별 표지를 가리키므로 단순 신호보다 성서적 뉘앙스가 있는 ‘표징’이 적절합니다.
- source_word: ܙܘ̈ܥܐ
  english_pob_choice: bewilderment
  chosen_korean: 혼란
  alternatives_korean:
  - 당혹
  - 어리둥절함
  - 공포
  lexicon: Payne Smith
  rationale: 사람들을 덮쳐 행동과 인식을 무너뜨리는 상태를 가리켜, 영어 POB의 ‘bewilderment’에 가장 가까운 한국어로 ‘혼란’을 선택했습니다.
- source_word: ܐܘܠܨܢܐ
  english_pob_choice: afflictions
  chosen_korean: 환난
  alternatives_korean:
  - 고난
  - 압제
  - 재난
  lexicon: Payne Smith
  rationale: 문맥이 누적되는 종말적 고통을 말하므로, 한국어 성서어휘에서 널리 통용되면서도 무게감이 있는 ‘환난’을 사용했습니다.
theological_decisions:
- issue: 마지막 구절의 시상과 의인화
  chosen_reading: ‘그때 시간이 깨어날 것이다’로 직역해, 시간을 잠든 듯 묘사하는 원문의 의인화를 유지했습니다.
  alternative_readings:
  - 그때 때가 올 것이다
  - 그때가 되면 기회가 열린다
  rationale: 원문은 ‘시간/때’가 깨어나는 이미지로 종말의 전환을 인격화합니다. 이를 평이하게 풀면 긴장감이 약해지므로, 원문의 수사와 종말론적 힘을 보존했습니다.
  doctrine_reference: apocalyptic imagery preservation
