revisions:
- from: 그러자 그가 제게 대답하며 말했습니다. “그때까지, 곧 마지막 날들에 전능하신 분이 땅의 거주민들을 위해 행하실 표징까지 너도 보존될 것이다. 그리고 이것이 그 표징이다. 땅의 거주민들에게 혼란이 덮칠 것이며, 그들은 많은 환난에 떨어졌다가 다시 큰 고통에 빠질 것이다. 또 그들의 고통이 넘쳐나 마음속으로 ‘전능하신 분이 더 이상 땅을 기억하지 않으신다’고 말하게 되고, 그들이 희망을 버리면, 그때 시간이 깨어날 것이다.”[a]
  to: 그러자 그가 제게 대답하여 말씀하셨습니다. “너도 그때까지, 곧 마지막 날들에 전능하신 분께서 땅의 주민들을 위해 행하실 표징이 있을 때까지 보호받을 것입니다. 그리고 이것이 그 표징입니다. 혼란이 땅의 주민들을 사로잡을 것이며, 그들은 많은 환난에 빠지고 이어서 큰 고통에 빠질 것입니다. 또 그들이 넘치는 고통 때문에 마음속으로 ‘전능하신 분께서는 더 이상 땅을 기억하지 않으십니다’라고 말하고 희망을 버리면, 그때가 깨어날 것입니다.”
  rationale: 문장의 시제와 사건의 연속성을 바로잡고, 현대 표준 한국어 합쇼체로 통일했습니다. ‘그때가 깨어날 것입니다’는 원문의 의인화를 보존합니다. 현 본문과 무관한 과거 번역 이력 각주 및 그 앵커는 삭제했습니다.
