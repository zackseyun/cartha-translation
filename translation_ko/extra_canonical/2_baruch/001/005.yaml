review_pass:
  verdict: revise
  source_fidelity: 시리아어의 두 절은 ‘내 백성이 징계를 받을 것이다’와 ‘때가 와서 그들이 그들의 시대의 번영을 구할 것이다’라는 뜻입니다. 초안은 핵심 의미를 대체로 반영하지만, 종결 표현이 합쇼체가 아니고 ‘그들이 시대의 번영’은 소유·수식 관계가 부자연스럽습니다.
  naturalness: ‘때가 와서 그들이 자기 시대의 번영을 구할 것입니다’는 원문의 접속 관계를 자연스럽게 살리며, 현대 표준 한국어 합쇼체 문장으로 매끄럽습니다.
  terminology: ‘징계’는 여기서 백성이 받는 징벌적 교정을 나타내는 표현으로 적절합니다. ܡܘܨܠܚܘܬܐ는 ‘번영’, ܙܒܢ̈ܐ는 ‘시대/때’로 옮기는 것이 적절합니다.
  issues:
  - severity: medium
    issue: 합쇼체 종결 미준수
    rationale: 초안의 최종 종결 ‘올 것이다’는 평서체이므로, 지정된 현대 formal-polite 합쇼체에 맞게 ‘올 것입니다’로 고쳐야 합니다.
  - severity: low
    issue: ‘그들이 시대의 번영’의 수식 관계가 어색함
    rationale: 원문은 ‘그들의 시대들의 번영’을 뜻하므로, 한국어에서는 ‘그들이 자기 시대의 번영을’처럼 관계를 명시하는 편이 자연스럽습니다.
  revised_text: 그리고 내 백성은 징계를 받을 것이며, 때가 와서 그들이 자기 시대의 번영을 구할 것입니다.”
