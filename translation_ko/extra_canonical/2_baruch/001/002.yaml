  text: “You have seen all that this people has done to me; the evil that these two tribes that remain have done is greater than that of the ten tribes that were taken captive.”
translation:
  language: ko
  text: 주님께서 바룩에게 말씀하시기를, '이 백성이 내게 행한 모든 것을 보셨나니, 남은 두 지파가 행한 악이 사로잡혀 간 열 지파의 악보다 더 크도다.' 하셨느니라.
  philosophy: Source-grounded optimal equivalence, prioritizing Syriac semantic structure over traditional ecclesial phrasing. The register is 합쇼체 (formal polite) for narrative and direct speech, consistent with the People's Open Bible standard for non-archaic modern Korean.
lexical_decisions:
- term: ܡܪܝܐ (Marja)
  korean: 주님
  rationale: Syriac 'Marja' (Lord) is rendered as '주님' to reflect the divine address in the narrative, aligning with the POB convention for divine titles in direct speech contexts.
- term: ܒܪ ܢܪܝܐ (Bar Narja)
  korean: 바룩
  rationale: Standard transliteration of the proper name 'Baruch' in modern Korean biblical usage, per project glossary.
- term: ܫܒܛܝܢ (Shebatin)
  korean: 지파
  rationale: Syriac 'Shebatin' (tribes) rendered as '지파' to maintain the historical/tribal context of the Northern Kingdom's ten tribes and the Southern remnant, avoiding modern political connotations of '부족'.
- term: ܥܒܕ (Abad)
  korean: 행한
  rationale: Syriac 'Abad' (done) rendered as '행한' to capture the active moral agency of the people, distinguishing it from passive suffering.
theological_decisions:
- decision: Comparative clause structure
  rationale: The Syriac text implies a comparison ('greater than') which was clarified in the English revision. The Korean translation explicitly renders this comparative structure ('...보다 더 크도다') to ensure the theological weight of the remnant's sin being worse than the exiled tribes is preserved, as per the source's intent.
