translation:
  language: ko
  text: 유다의 왕 여고냐의 제이십오년에 야훼의 말씀이 네리야의 아들 바룩에게 이르러 말씀하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܢܬ ܥܣܪܝܢ ܘܚܡܫ
  english_pob_choice: the twenty-fifth year
  chosen_korean: 제이십오년에
  alternatives_korean:
  - 스물다섯째 해에
  - 제25년에
  lexicon: 일반 연대 표현
  rationale: 히브리식/시리아어식 연대 표현을 한국어 성경문체에 맞게 자연스럽게 옮기되, 연대 정보는 그대로 보존했습니다.
- source_word: ܦܬܓܡܗ ܕܡܪܝܐ
  english_pob_choice: the word of the Lord
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 주님의 말씀이
  - 주님의 말씀
  lexicon: 말씀 / 야훼
  rationale: 시리아어의 ‘주’는 이 문맥에서 야훼를 가리키는 예언 공식으로 보이므로, 프로젝트 기본어휘에 따라 ‘야훼’로 옮겼습니다.
- source_word: ܐܬܦܫܩ ܡܢ ܝܘܢܝܐ ܠܣܘܪܝܝܐ
  english_pob_choice: came to / saying
  chosen_korean: 이르러 말씀하셨습니다
  alternatives_korean:
  - 임하여 말씀하셨습니다
  - 와서 그에게 말씀하셨습니다
  lexicon: 예언 수식구
  rationale: 원문은 예언적 말씀이 바룩에게 ‘이르렀다’는 공식문을 이루므로, 한국어에서는 동사를 두 번 나누기보다 ‘이르러 말씀하셨습니다’로 자연스럽게 재현했습니다.
- source_word: ܒܪܘܟ ܒܪ ܢܪܝܐ
  english_pob_choice: Baruch son of Neriah
  chosen_korean: 네리야의 아들 바룩
  alternatives_korean:
  - 바룩, 네리야의 아들
  - 네리아의 아들 바룩
  lexicon: 고유명사
  rationale: 널리 알려진 성경 인명 형태를 따르되, 한국어 성경에서 안정적으로 쓰이는 어순인 ‘네리야의 아들 바룩’을 택했습니다.
theological_decisions:
- issue: 예언 공식에서 ‘the word of the Lord’가 누구의 말씀인가
  chosen_reading: ‘야훼의 말씀’으로 직접 옮겨, 말씀의 주체가 단순한 메시지가 아니라 인격적으로 발화하시는 야훼이심을 드러냈습니다.
  alternative_readings:
  - ‘주님의 말씀’으로 완화
  - 비인칭적으로 ‘말씀이 임했습니다’로만 처리
  rationale: 본문은 예언자에게 임하는 신적 발화의 공식을 사용하므로, 주체를 분명히 하되 한국어 문체는 자연스럽게 유지했습니다.
  doctrine_reference: 예언적 계시와 하나님의 직접 발화
- issue: ‘and He said to him’의 반복 표현 처리
  chosen_reading: ‘이르러 말씀하셨습니다’로 통합해, 동일한 신적 발화가 이어지는 구조를 살렸습니다.
  alternative_readings:
  - ‘그리고 그에게 말씀하셨습니다’로 직역
  - ‘말하여 이르시되’ 같은 전통적 문체
  rationale: 시리아어의 반복은 서술의 흐름을 잇는 기능이므로, 한국어에서는 합쇼체로 매끄럽게 정리하되 의미의 중복은 유지했습니다.
  doctrine_reference: 서술적 반복의 수사적 기능
