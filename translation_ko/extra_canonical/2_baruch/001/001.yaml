revisions:
- from: 유다의 왕 여고냐의 제이십오년에 야훼의 말씀이 네리야의 아들 바룩에게 이르러 말씀하셨습니다.
  to: 유다 왕 여고냐의 스물다섯째 해에 야훼의 말씀이 네리야의 아들 바룩에게 임하였고, 야훼께서 그에게 말씀하셨습니다.
  rationale: 원문의 예언 공식에 있는 말씀의 도래와 야훼의 직접 발화라는 두 서술을 모두 보존했습니다. 두 번째 절의 주체를 ‘야훼께서’로 밝혀 한국어에서 생길 수 있는 ‘말씀이 말씀하셨다’라는 주체 혼동을 피했습니다. 이는 원문의 신적 발화 주체를 새로 해석하거나 교리적으로 확장하지 않고, 영어 POB의 ‘and He said to him’이 반영한 문맥적 주체를 한국어 문법에 맞게 드러낸 것입니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:44Z'
