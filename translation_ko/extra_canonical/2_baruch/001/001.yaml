  naturalness: ‘제이십오년’은 이해 가능하나 현대 표준어 합쇼체 본문에는 ‘스물다섯째 해’가 더 자연스럽습니다. 또한 ‘말씀이 ... 말씀하셨습니다’는 문법적 주체가 불명확해질 수 있으므로, 두 절을 분명히 나누는 편이 좋습니다.
  terminology: ‘야훼’, ‘여고냐’, ‘네리야’, ‘바룩’은 일관된 성경 고유명사 표기로 사용할 수 있습니다. ‘야훼의 말씀’은 ܦܬܓܡܗ ܕܡܪܝܐ에 충실합니다.
  issues:
