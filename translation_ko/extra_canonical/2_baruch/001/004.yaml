  text: 그러므로 보십시오. 내가 이 성읍과 그 주민에게 재앙을 내릴 것입니다. 그 성읍은 한동안 내 앞에서 사라지게 될 것이며, 내가 이 백성을 여러 나라 가운데 흩어 그들이 여러 나라의 종이 되게 할 것입니다.
