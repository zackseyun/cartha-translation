  text: 'And it happened after these things, and behold, I heard a voice, and I saw a might fixed upon me. And a voice was heard from on high and said to me:'
translation:
  language: ko
  text: 그리고 이 일들 후에, 보니 내가 한 음성을 들었고, 내게 고정된 한 권능을 보았습니다. 그리고 높은 곳에서 음성이 들려와 내게 말했습니다:[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: “after these things” / ܡܢ ܒܬܪ ܗܠܝܢ
  english_pob_choice: And it happened after these things
  chosen_korean: 이 일들 후에
  alternatives_korean:
  - 그 후에
  - 이런 일들 뒤에
  lexicon: after these things
  rationale: 서술 연결을 자연스럽게 하면서도, 뒤의 환상 개시를 위한 시간 전환을 그대로 살렸습니다.
- source_word: ܩܠܐ / voice
  english_pob_choice: a voice
  chosen_korean: 한 음성
  alternatives_korean:
  - 소리
  - 목소리
  lexicon: voice
  rationale: 환시 문맥에서 단순한 소리보다 인격적 발화의 뉘앙스가 살아나는 표준적 번역입니다.
- source_word: ܚܝܠܐ / might, strength
  english_pob_choice: a might
  chosen_korean: 한 권능
  alternatives_korean:
  - 한 힘
  - 한 능력
  lexicon: might
  rationale: 시각적으로 ‘내게 고정된’ 것으로 보이는 초월적 실체를 한국어에서 가장 무리 없이 전달하면서도, 단순 육체적 힘으로 축소하지 않기 위해 ‘권능’을 택했습니다.
- source_word: ܐܬܩܒܥ ܠܝ / fixed upon me
  english_pob_choice: fixed upon me
  chosen_korean: 내게 고정된
  alternatives_korean:
  - 내게 붙들린
  - 내게 세워진
  lexicon: fixed upon me
  rationale: 원문의 정지·부착 이미지를 살리되, 문맥상 환상 속에서 바울/바룩에게 부여된 초월적 ‘세워짐’을 과도하게 해석하지 않도록 했습니다.
- source_word: ܡܢ ܡܪܘܡܐ / from on high
  english_pob_choice: from on high
  chosen_korean: 높은 곳에서
  alternatives_korean:
  - 위로부터
  - 높은 데서
  lexicon: from on high
  rationale: 하늘/상천의 발화라는 종교적 느낌을 유지하면서도 현대 한국어 문장으로 자연스럽게 만들었습니다.
theological_decisions:
- issue: 환시 서술에서 ܚܝܠܐ를 어떤 신학적 뉘앙스로 옮길지
  chosen_reading: ‘한 권능’으로 옮겨, 단순한 물리적 힘이 아니라 하늘에서 온 초월적 현현으로 읽히게 했습니다.
  alternative_readings:
  - ‘한 힘’으로 평이하게 처리
  - ‘능력’으로 추상화
  rationale: 이 구절은 이어지는 하늘 음성의 개시 장면이므로, 환시 속 실재를 축소하지 않는 표현이 필요합니다.
  doctrine_reference: 계시 문학의 신적 현현 표현
