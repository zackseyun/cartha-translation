translation:
  language: ko
  text: '그리고 그 일들이 있은 뒤에 나는 백성에게 가서 그들에게 말했습니다. 「너희의 장로들과 너희의 자녀들을 내게 모으십시오. 그러면 내가 그들에게 말을 하겠습니다.」


    그리하여 그들은 모두 키드론 골짜기에 모였습니다.


    그리고 나는 그들에게 묻고 말했습니다.[a][b][c]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܗܘܘ ܡܢ ܒܬܪ ܗܠܝܢ
  english_pob_choice: And it happened after these things
  chosen_korean: 그리고 그 일들이 있은 뒤에
  alternatives_korean:
  - 그 일들 뒤에
  - 이 일들 후에
  lexicon: Smith
  rationale: 서사 전환 공식의 ‘after these things’를 한국어에서 자연스럽고 격식 있게 살려, 단순한 순차 표현보다 서술적 전환감을 유지했습니다.
- source_word: ܣܒܝܟܘܢ
  english_pob_choice: your elders
  chosen_korean: 너희의 장로들
  alternatives_korean:
  - 너희의 늙은이들
  - 너희의 노인들
  lexicon: Smith
  rationale: 문맥상 단순 연장자가 아니라 백성의 대표 역할을 하는 장로를 가리키므로, 교회적 용어를 쓰되 원문의 사회적·대표적 의미를 보존했습니다.
- source_word: ܟܢܫܘ
  english_pob_choice: Gather
  chosen_korean: 모으십시오
  alternatives_korean:
  - 모이게 하십시오
  - 불러 모으십시오
  lexicon: Smith
  rationale: 명령의 직접성을 살리면서도 한국어에서 자연스러운 집합 요청으로 옮겼습니다.
- source_word: ܠܗܘܢ
  english_pob_choice: to them
  chosen_korean: 그들에게
  alternatives_korean:
  - 너희에게
  - 그대들에게
  lexicon: Smith
  rationale: 주석된 대로 발화 대상은 모여 온 사람들 자체가 아니라 장로들이므로, 대명사 지시를 ‘그들에게’로 맞추었습니다.
theological_decisions:
- issue: 발화 대상의 범위
  chosen_reading: 장로들과 자녀들을 모으되, 내가 말할 대상은 ‘그들’로 유지하여 장로들에게 직접 연설하는 구도를 살렸습니다.
  alternative_readings:
  - 그들에게를 너희에게로 풀어 백성 전체를 수신자로 읽기
  - 모인 무리 전체에게 말하는 것으로 평탄화하기
  rationale: 시리아어 주해와 영어 감사 기록이 지적하듯 동사의 목적어는 장로들을 가리키며, 이 긴장감을 풀어버리면 본문의 지시 구조가 흐려집니다.
  doctrine_reference: source-grounded discourse reference
