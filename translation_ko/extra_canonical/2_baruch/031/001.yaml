  source_fidelity: 소집 명령, ‘장로들과 자녀들’, 키드론 골짜기, 그리고 마지막의 ‘묻고 말하다’는 대체로 충실합니다. 그러나 인용문 안의 ܥܡܗܘܢ ܡܠܝ(‘그들과 내 말을 [나누다/말하다]’)에 대해 초안의 ‘그들에게 내 말을 전하겠습니다’는 동반/상호의 대상 표지를 약화시키고, ‘전하다’는 원문의 ‘말하다’보다 전달 행위를 강하게 암시합니다. 영어 감사 이력의 본문 선택을 따라 이를 보정했습니다.
  naturalness: 합쇼체는 일관되고 자연스럽습니다. 다만 ‘물으며 말하였습니다’는 한국어에서 다소 부자연스러운 동시 진행으로 들립니다. 순차적 관용 표현인 ‘물어 말하였습니다’로 다듬었습니다. 절 끝의 발화 도입은 다음 절로 이어지는 원문 구조를 보존합니다.
  terminology: ‘장로들’, ‘자녀들’, ‘키드론 골짜기’는 적절합니다. ‘내 말’은 1인칭 소유와 복수적 ‘말들’의 의미를 자연스럽게 포괄합니다. ‘말씀’으로 과도하게 높이지 않은 점도 적절합니다.
