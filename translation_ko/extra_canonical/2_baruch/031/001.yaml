    text: Or 'and I will speak words to you.'.
    reason: previous_rendering
translation:
  language: ko
  text: '그리고 이 일들이 있은 뒤에, 내가 백성에게 가서 그들에게 말하였습니다. “너희 장로들과 너희 자녀들을 내게 모으십시오. 그러면 내가 그들에게 내 말을 전하겠습니다.”


    그들이 모두 키드론 골짜기에 모였습니다.


    그리고 내가 그들에게 물으며 말하였습니다.[a]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܟܢܫܘ
  english_pob_choice: Gather
  chosen_korean: 모으십시오
  alternatives_korean:
  - 모이게 하십시오
  - 소집하십시오
  lexicon: Smith
  rationale: 명령형의 직접성을 살리되, 현대 한국어에서 사람을 불러 모으는 공적 요청으로 자연스럽게 들리는 표현을 택했습니다.
- source_word: ܣܒܝܟܘܢ
  english_pob_choice: your elders
  chosen_korean: 너희 장로들
  alternatives_korean:
  - 너희 노인들
  - 너희 연장자들
  lexicon: Smith
  rationale: 문맥상 단순한 나이가 아니라 공동체의 대표적 원로들을 가리키므로, 고유한 사회적 기능을 드러내는 ‘장로들’을 선택했습니다.
- source_word: ܒܚܠܬܐ ܕܩܕܪܘܢ
  english_pob_choice: in the valley of Kidron
  chosen_korean: 키드론 골짜기
  alternatives_korean:
  - 키드론 계곡
  - 기드론 골짜기
  lexicon: Smith
  rationale: 지명은 통용되는 음역을 따르되, ‘골짜기’로 원문의 지형 이미지를 보존했습니다.
- source_word: ܡܠܝ
  english_pob_choice: my words
  chosen_korean: 내 말
  alternatives_korean:
  - 내 말들
  - 내 말씀
  lexicon: Smith
  rationale: ‘내 말’은 복수 개념을 한국어에서 자연스럽게 포괄하면서도, 소유격 ‘내’가 드러내는 1인칭을 보존합니다. ‘말씀’은 여기서 문체상 과도하게 성화될 수 있어 피했습니다.
theological_decisions:
- issue: 집단적 청중 표지의 보존
  chosen_reading: ‘너희 장로들과 너희 자녀들’로 옮겨, 공동체 전체를 향한 직접적 소집이라는 구조를 유지했습니다.
  alternative_readings:
  - ‘너희 모든 장로들’
  - ‘너희의 어른들과 자녀들’
  rationale: 본문은 특정 계층만이 아니라 백성 전체의 대표층과 후속 세대를 함께 불러 모으는 장면이므로, 청중 범위를 축소하지 않도록 했습니다.
  doctrine_reference: 공동체적 소집과 세대 간 전달의 강조를 보존
- issue: 동사의 의미 확정
  chosen_reading: 마지막 구절은 ‘내가 그들에게 물으며 말하였습니다’로 옮겼습니다.
  alternative_readings:
  - ‘내가 그들에게 대답하며 말하였습니다’
  - ‘내가 그들에게 말하기 시작하였습니다’
  rationale: 시리아어 동사는 ‘묻다/문의하다’의 방향을 가지므로, POB 영어의 ‘I asked and said’ 흐름을 반영해 질문의 동작을 유지했습니다.
  doctrine_reference: 원문 동작의 방향성과 서사적 긴장을 보존
