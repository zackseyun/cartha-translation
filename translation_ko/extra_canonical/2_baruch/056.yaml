base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/056.yaml
  text: 'That great cloud which you saw ascending from the sea and going to cover this earth—understand: it is the world in which the Mighty One made his strength when he intended to make the creation[1]. And it happened that, when the word went out from before him, the establishment of the world stood—fair, small—and it was prepared as it was sought that it should be.


    And as for the first black waters which you saw descending from above that cloud, it is the transgression of corruption which the first Adam committed first. For when he sinned, death was aroused, though it was not in its time, and mourning became known, and sufferings were prepared, and pains were created, and toil was completed; and greatness began to wane.


    And the last day, which was seen in a form and took on a likeness—you will know that the time will be demanded, and the measure of humanity will be measured, and its strength will be tested.


    Therefore, because Adam, when he heard from God something of what would be, and understood that the release of the dead was given, and was commanded by God, considered what was reckoned; and five thoughts were thought. For he made himself liable; he was also liable before the angels; and even at that time when he was created, there was a vision seen by him—of the bitter life and of the elements with fire.


    And thus God gathered in [their] time[d][c][b][a][7][6][5][4][3][2], in the likeness in which they had been created.'
  footnotes:
  - marker: '1'
    text: Ceriani reads ‘went and covered (ḥapith) the earth’; Kmosko’s control has ‘covered (kasyth)’. Both mean ‘covered’, with no difference in sense.
    reason: textual_variant
  - marker: '2'
    text: The Syriac here is difficult. Kmosko reads ‘this is the ordering/structure (nugra) of the world which the Mighty One made’; Ceriani’s OCR has ‘who made his power’. The translation follows the ‘ordering’ sense.
    reason: textual_variant
  - marker: '3'
    text: ‘Fair, small’ (šapir, zʿur) is striking in context; possibly indicating the initial state as nascent/embryonic before further ordering. The phrase is retained literally.
    reason: lexical_alternative
  - marker: '4'
    text: ‘The last day … took on the likeness of death’ is syntactically terse; it is taken as an eschatological aside indicating that the end will resemble death in its effects.
    reason: lexical_alternative
  - marker: '5'
    text: ‘The semblance (numsha) of humanity will be wiped away’ involves a rare term; ‘semblance/appearance’ is a cautious rendering of an obscure word and verb (mšḥ ‘to wipe’).
    reason: lexical_alternative
  - marker: '6'
    text: ‘Forgiveness for those who had died had been given’ reads šūbaqnā d-mēte as an objective genitive, i.e., forgiveness pertaining to the dead, not that Adam forgave others.
    reason: lexical_alternative
  - marker: '7'
    text: ‘Five thoughts were thought’ is followed by compressed clauses (‘he made himself liable … before the angels … in the time he was created … wild beasts … elements’). The enumeration is obscure in Syriac; the translation preserves the sequence without harmonizing.
    reason: textual_variant
  - marker: a
    text: Or 'the ordering of the world'.
    reason: previous_rendering
  - marker: b
    text: Or 'in littleness and took on the likeness of death—you will know that the time will be demanded, and the semblance of humanity will be wiped away, and its strength will be broken'.
    reason: previous_rendering
  - marker: c
    text: Or 'forgiveness for those who had died'.
    reason: previous_rendering
  - marker: d
    text: Or 'the fierce living creatures'.
    reason: previous_rendering
translation:
  language: ko
  text: '당신이 본 그 큰 구름은 바다에서 올라와 이 땅을 덮으려던 것인데—이것을 알아두십시오. 그것은 전능하신 분이 창조를 이루려 하실 때 그분이 세우신 세상입니다. 그리고 그분 앞에서 말씀이 나오자 세상의 성립은—아름답고도 작게—서 있었고, 그것은 마땅히 있어야 할 대로 준비되었습니다.


    그리고 그 구름 위에서 위로부터 내려온 첫 검은 물들은, 첫 آدم이 맨 처음 범한 부패의 범죄입니다. 그가 죄를 지었을 때 죽음이 일어났지만, 그것은 그때가 아니었습니다. 애도가 알려졌고, 고통들이 예비되었으며, 아픔들이 지어졌고, 수고가 마무리되었으며, 위대함은 점차 시들어 갔습니다.


    그리고 형체로 보이며 모양을 입은 마지막 날은, 때가 요구될 것이며, 인류의 크기가 재어질 것이며, 그 힘이 시험될 것임을 당신이 알게 될 것입니다.


    그러므로 아담은, 앞으로 있을 일의 일부를 하나님에게서 들었고, 죽은 자들에게 대한 풀어 주심이 주어졌음을 깨달았으며, 하나님에게서 명령을 받았으므로, 생각할 바를 생각하였고 다섯 가지 생각을 생각하였습니다. 그는 자기 자신에게 죄책을 지웠고, 천사들 앞에서도 죄책을 졌으며, 자기가 지음받던 바로 그때에도 그에게는 하나의 환상이 보였으니—쓰디쓴 삶과 불과 함께 있는 요소들에 대한 환상이었습니다.


    그리고 하나님은 그들이 창조되었던 그 모양대로, 그들의 때에 그들을 모으셨습니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܢܢܐ / ܚܦܝܬܗ
  english_pob_choice: cloud ... going to cover
  chosen_korean: 큰 구름 / 덮으려던 것
  alternatives_korean:
  - 구름
  - 덮어 가리려던 것
  lexicon: Sokoloff (Syriac); Payne Smith
  rationale: ‘덮다’는 구름의 이동 목적과 심상 모두를 살리며, 본문이 말하는 우주적 표지를 자연스럽게 전달합니다.
- source_word: ܢܘܓܪܗ ܕܥܠܡܐ
  english_pob_choice: ordering/establishment of the world
  chosen_korean: 세상의 성립
  alternatives_korean:
  - 세상의 질서
  - 세상의 구조
  lexicon: Sokoloff (Syriac)
  rationale: 본문은 창조 직전의 세상 형성 상태를 말하므로, ‘성립’이 질서 잡힌 우주가 세워지는 뉘앙스를 간결하게 담습니다.
- source_word: ܡܠܬܐ
  english_pob_choice: the word went out
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 명령
  lexicon: Sokoloff (Syriac)
  rationale: 창조를 이루는 신적 발화라는 문맥상 ‘말씀’이 가장 직접적이며, 단순한 ‘명령’보다 원문의 신학적 울림을 보존합니다.
- source_word: ܡܥܒܪܢܘܬܐ
  english_pob_choice: transgression of corruption
  chosen_korean: 부패의 범죄
  alternatives_korean:
  - 부패의 범과
  - 타락의 죄과
  lexicon: Sokoloff (Syriac)
  rationale: 원문은 단순한 실수보다 파괴적 위반을 가리키므로, ‘범죄’가 죄의 무게를 더 정확히 드러냅니다.
- source_word: ܐܬܬܙܝܥ
  english_pob_choice: death was aroused
  chosen_korean: 죽음이 일어났습니다
  alternatives_korean:
  - 죽음이 stirred up 되었습니다
  - 죽음이 분발되었습니다
  lexicon: Sokoloff (Syriac)
  rationale: 한국어로는 죽음이 ‘일어나다’가 가장 자연스럽지만, 문맥상 죽음이 역사 안으로 সক개처럼 돌출해 들어온다는 점을 유지합니다.
- source_word: ܪܘܪܒܘܬܐ ܫܪܝܬ ܕܬܡܘܟ
  english_pob_choice: greatness began to wane
  chosen_korean: 위대함은 점차 시들어 갔습니다
  alternatives_korean:
  - 위대함은 쇠퇴하기 시작했습니다
  - 위대함은 가라앉기 시작했습니다
  lexicon: Sokoloff (Syriac)
  rationale: ‘wane’는 단순한 감소보다 빛과 기세의 약화를 뜻하므로, ‘시들어 가다’가 시적 이미지와 의미를 함께 살립니다.
theological_decisions:
- issue: ‘말씀’이 나와 세상의 성립이 서 있었다는 표현
  chosen_reading: 창조적 발화가 세계를 세우는 하나님 행위로 이해했습니다.
  alternative_readings:
  - 단순한 명령 집행
  - 추상적 이성/이데아의 발현
  rationale: 본문은 창조를 향한 하나님의 발화와 그 결과로서 세계의 세움을 병치하므로, 신적 창조 말씀으로 읽는 것이 가장 자연스럽습니다.
  doctrine_reference: 창세기 1장, 시편 33:6-9
