    issue: ‘이 시대의 해’라는 표현
    rationale: ‘years’의 직역 흔적이 강하여 현대 한국어에서는 자연스럽지 않습니다. ‘이 시대의 세월’로 고치면 시간적 폭과 현세적 상황의 함의를 자연스럽게 전달합니다.
  - severity: low
    issue: 접속 어미 ‘-는데’의 어조
    rationale: 원문의 탄식과 수사의문문을 연결하는 한국어 문체로는 ‘-오니’가 더 자연스럽고 일관된 합쇼체 문체를 이룹니다.
  revised_text: 그리고 제가 대답하여 말했습니다. “주님, 나의 주님, 이 시대의 세월은 짧고도 악하오니, 누가 이처럼 짧은 때에 헤아릴 수 없는 것을 얻을 수 있겠습니까?”
