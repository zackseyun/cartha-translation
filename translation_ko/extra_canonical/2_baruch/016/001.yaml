  yaml_path: translation/extra_canonical/2_baruch/016/001.yaml
  text: And I answered and said, "O Lord, my Lord, the years of this age are few and evil, and who can acquire, in so little time, that which is immeasurable?"
translation:
  language: ko
  text: 그리고 제가 대답하여 말했습니다. “주님, 나의 주님, 이 시대의 세월은 짧고도 악하오니, 누가 이처럼 짧은 때에 헤아릴 수 없는 것을 얻을 수 있겠습니까?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܥܢܝܬ ܘܐܡܪܬ
  english_pob_choice: I answered and said
  chosen_korean: 제가 대답하여 말했습니다
  alternatives_korean:
  - 제가 응답하여 말했습니다
  - 제가 대답하며 말했습니다
  lexicon: Payne Smith
  rationale: 서술 동사의 결합을 자연스러운 한국어 관용으로 옮기되, ‘대답하다’와 ‘말하다’의 이중 동작을 유지했습니다.
- source_word: ܡܪܝܐ ܡܪܝ
  english_pob_choice: O Lord, my Lord
  chosen_korean: 주님, 나의 주님
  alternatives_korean:
  - 주여, 나의 주님
  - 주님, 내 주님
  lexicon: Payne Smith
  rationale: 호격의 반복을 살리면서도 현대 합쇼체에서 자연스럽고 공손한 직접 호칭으로 옮겼습니다.
- source_word: ܙܒܘ̈ܢܝ
  english_pob_choice: of this age
  chosen_korean: 이 시대의
  alternatives_korean:
  - 이 때의
  - 이 세대의
  lexicon: Payne Smith
  rationale: 단순한 순간이 아니라 현재의 유한한 세상 질서를 가리키는 말이므로 ‘시대’로 옮겼습니다.
- source_word: ܡܫܘܚܬܐ
  english_pob_choice: that which is immeasurable
  chosen_korean: 헤아릴 수 없는 것
  alternatives_korean:
  - 측량할 수 없는 것
  - 헤아릴 수 없이 큰 것
  lexicon: Payne Smith
  rationale: 짧은 인간의 시간과 대비되는 ‘측량 불가’의 의미를 직설적으로 살려, 추상 명사성을 한국어에서 자연스럽게 구현했습니다.
theological_decisions:
- issue: ‘이 시대의 해는 적고도 악한데’의 어조를 단순 정보가 아니라 탄식으로 유지할지 여부
  chosen_reading: 바룩의 말은 현실 비판이 아니라 유한한 인간 생애와 도달 불가능해 보이는 종말적 목표 앞에서 드는 탄식으로 읽었습니다.
  alternative_readings:
  - 시간이 짧고 악하다는 객관 진술로만 읽는 방식
  - 하나님의 요구 자체를 문제 삼는 비판적 독백으로 읽는 방식
  rationale: 이후 문맥이 인간의 길이 아니라 삶의 성격과 준비를 강조하므로, 본절의 질문은 목표의 부정을 뜻하지 않고 인간 한계의 절감을 드러냅니다.
  doctrine_reference: '문맥 신학: 2 Baruch 15–17의 종말론적 권면'
