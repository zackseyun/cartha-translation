  source_fidelity: 초안은 영어 POB 감사 문구의 두 절을 충실히 옮겼습니다. ‘lifted up their voices’는 ‘소리를 높여’, ‘they all wept’는 ‘모두 울었습니다’, ‘sat there and fasted until evening’은 ‘거기 앉아서 저녁까지 금식했습니다’로 각각 자연스럽고 의미 손실 없이 반영되었습니다. 제공된 시리아어 페이지 묶음은 장 단위의 중첩·보간 자료여서 해당 절의 직접 대조 근거가 불명확하지만, 영어 감사 문구와 초안 사이에 불일치는 없습니다.
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽습니다. 문장 연결의 ‘그러자’와 ‘그리고’는 원문의 서사적 진행을 무리 없이 드러내며, ‘금식했습니다’도 문맥과 문체에 적절합니다.
  terminology: ‘금식’은 정착된 성서 어휘이며, 인명·신학 용어 또는 주석 표지가 이 절에는 없습니다.
