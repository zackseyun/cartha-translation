translation:
  language: ko
  text: 그리고 나는 말했습니다. “그러므로 나는 헛되이 기다렸고, 시온도 헛되이 세워졌습니다. 우리를 미워하는 자들이 그 성을 차지했다면, 당신은 당신의 큰 이름을 위해 무엇을 하시겠습니까?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܡܪ ܠܝ
  english_pob_choice: And I said
  chosen_korean: 그리고 나는 말했습니다
  alternatives_korean:
  - 그리고 내가 말했습니다
  - 나는 말했습니다
  lexicon: Syriac direct speech formula
  rationale: 서사 전환과 직접화법 시작을 자연스럽게 살리면서, 합쇼체 서술을 유지했습니다.
- source_word: ܙܢܝ̈ܐ ܠܣ̈ܓܝܐܐ / ܠܣ̈ܓܝܐܐ ... ܒܣܓܝ̈ܐܐ
  english_pob_choice: hoped in vain / in vain was Zion built
  chosen_korean: 헛되이 기다렸고, 시온도 헛되이 세워졌습니다
  alternatives_korean:
  - 헛되이 바랐고, 시온도 헛되이 세워졌습니다
  - 헛되이 소망했고, 시온도 헛되이 세워졌습니다
  lexicon: Syriac idiom of futility with repeated 'vain'
  rationale: 반복된 ‘헛되이’를 그대로 살려 원문의 절망감을 유지하고, 시온의 ‘세워짐’을 수동적으로 옮겼습니다.
- source_word: ܐܚܒܬ / ܠܐܢܫܝܢ... ܕܐܚܒܬ
  english_pob_choice: those who hate us
  chosen_korean: 우리를 미워하는 자들
  alternatives_korean:
  - 우리를 증오하는 자들
  - 우리의 원수들
  lexicon: Syriac contrast within the lament
  rationale: 앞뒤의 ‘사랑/미움’ 대비를 살리면서도, 본문이 특정한 군사적 칭호보다 관계적 적대에 초점을 둔다고 보았습니다.
- source_word: ܙܕܩܗ
  english_pob_choice: its own right
  chosen_korean: 당신의 큰 이름을 위해 무엇을 하시겠습니까
  alternatives_korean:
  - 그의 권리를 위해
  - 그의 의를 위해
  lexicon: Payne Smith / contextual juridical claim
  rationale: 영문 POB의 본문은 이 구절을 ‘큰 이름’ 논변으로 연결하므로, 한국어 본문에서는 자연스럽게 그 수사 구조를 살렸습니다.
theological_decisions:
- issue: 시온/예루살렘의 의미
  chosen_reading: 여기서는 현재의 시온이 헛되이 세워졌다는 탄식으로 옮기되, 앞선 문맥의 종말론적 구분은 본문 안에 덧붙이지 않았습니다.
  alternative_readings:
  - 미리 준비된 하늘 시온을 가리킨다
  - 땅의 예루살렘만을 가리킨다
  rationale: 이 절 자체는 화자의 탄식과 질문에 집중하므로, 문맥 신학은 과잉 설명하지 않고 본문이 말하는 수준만 유지했습니다.
  doctrine_reference: 2 Baruch 4–5의 시온/예루살렘 문맥
- issue: 하나님의 이름에 대한 호칭
  chosen_reading: ‘your great name’을 하나님께 대한 직접 호칭으로 이해해 ‘당신의 큰 이름’으로 옮겼습니다.
  alternative_readings:
  - 당신의 위대한 이름
  - 주님의 큰 이름
  rationale: 직접화법 내부의 기도적 질문을 살리기 위해, 지나치게 전례화된 표현보다 원문의 논변 구조가 보이도록 했습니다.
  doctrine_reference: 신적 이름과 명예를 근거로 한 성서적 탄원
