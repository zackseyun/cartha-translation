  text: He answered and said to me, “Hear then the word.”
  footnotes:
  - marker: a
    text: Or 'He answered and said to me, “Hear then the word. For the earth will then surely give back the dead whom it now receives, keeping them without changing anything in their form. But as it received them, so it will restore them, and as I delivered them to it, so it will also raise them. For then it is necessary to show the living that the dead have come to life, and that those who had departed have returned. And it shall be, when those who now know one another have recognized one another, then judgment will grow strong, and those things that were spoken beforehand will come.”'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 내게 대답하여 말했습니다. 「그러니 그 말을 들으십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '다른 번역(이전 범위 과다 번역): “그가 나에게 대답하여 말했습니다. ‘그러니 그 말을 들으십시오. 땅은 지금 받아들이는 죽은 이들을 반드시 돌려줄 것이며, 그들의 모습을 조금도 바꾸지 않고 지킬 것입니다. 땅이 그들을 받은 그대로 돌려줄 것이고, 내가 그들을 땅에 맡긴 그대로 땅도 그들을 일으킬 것입니다. 이는 살아 있는 이들에게 죽은 이들이 살아났고 떠난 이들이 돌아왔음을 보이기 위해서입니다. 지금 서로 아는 이들이 서로를 알아볼 때, 심판은 굳세어지고 미리 말해진 일들이 이루어질 것입니다.’”'
    reason: 이 각주는 이전 번역이 50:2–4의 내용을 50:1에 포함했던 이력을 보존합니다. 현 절의 본문은 인용문의 첫 문장까지만입니다.
