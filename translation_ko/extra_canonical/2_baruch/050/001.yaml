translation:
  language: ko
  text: 그가 나에게 대답하며 말했습니다. 「그러니 그 말씀을 들으십시오.」[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܢܐ ܘܐܡܪ ܠܝ
  english_pob_choice: He answered and said to me
  chosen_korean: 그가 나에게 대답하며 말했습니다
  alternatives_korean:
  - 그가 나에게 대답하여 말했습니다
  - 그가 내게 응답하며 말했습니다
  lexicon: Payne Smith
  rationale: 시리아어 관용구를 자연스러운 서술로 옮기되, ‘대답하다+말하다’의 이중 동사를 유지해 원문의 응답 장면을 드러냈습니다.
- source_word: ܫܡܥ
  english_pob_choice: Hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들으시오
  - 들어 보십시오
  lexicon: Payne Smith
  rationale: 직접 화법 안의 명령형을 현대 표준어 공손 명령으로 옮겨, 본문의 권면적 어조를 살렸습니다.
- source_word: ܒܪܡ
  english_pob_choice: then
  chosen_korean: 그러니
  alternatives_korean:
  - 그런즉
  - 그러면
  lexicon: Payne Smith
  rationale: 단순 시간 부사보다 담화 전환과 결론 연결을 보이는 접속부사로 처리해 문맥의 흐름을 반영했습니다.
- source_word: ܡܠܬܐ
  english_pob_choice: the word
  chosen_korean: 그 말씀
  alternatives_korean:
  - 그 말
  - 그 한마디
  lexicon: Payne Smith
  rationale: 지시된 내용을 단순한 ‘말’보다 조금 더 중량감 있게 살리되, 본문이 요구하는 범위를 넘지 않도록 ‘말씀’으로 번역했습니다.
theological_decisions:
- issue: 직접 화법의 공손도
  chosen_reading: 본문은 화자에게 하는 직접 명령을 포함하므로, 한국어에서는 공손한 명령형 「들으십시오」를 사용했습니다.
  alternative_readings:
  - 반말형 「들어라」
  - 중립형 「들으시오」
  rationale: 시리아어 원문은 내용상 명령을 분명히 하며, 한국어 합쇼체 목표에 맞추어 권위는 유지하되 현대적 공손성을 확보했습니다.
  doctrine_reference: 번역 문체 결정
