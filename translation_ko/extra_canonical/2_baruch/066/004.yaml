  text: 그는 마술을 행하는 자들을 불로 태우셨고, 백성을 미혹하던 거짓 예언자들도 불에 내주셨습니다. 또 그들이 살아 있을 때 그들의 말을 들었던 백성은 그 시냇물에 던지셨습니다.
