revisions:
- from: 그리고 그는 마술사들을 불태웠다. 그리고 백성을 미혹하는 거짓 예언자들을 그분께서는 불살라 버리셨습니다. 그리고 살아 있을 때 그들의 말을 들었던 사람들을 그 시냇물에 던지셨습니다.
  to: 그는 마술을 행하는 자들을 불로 태우셨고, 백성을 미혹하던 거짓 예언자들도 불에 내주셨습니다. 또 그들이 살아 있을 때 그들의 말을 들었던 백성은 그 시냇물에 던지셨습니다.
  rationale: 원문에 있는 ‘불로’와 두 번째 대상에 대한 ‘불에 내주다’를 보완하고, 합쇼체 종결을 일관되게 했습니다. ‘그들이 살아 있을 때’는 원문과 영어 감사본의 시간 수식을 보존하며, ‘시냇물’은 ܢܚܠܐ(개울/시내)의 문맥상 무난한 번역입니다.
