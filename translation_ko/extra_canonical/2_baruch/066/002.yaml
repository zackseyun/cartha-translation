  text: 땅을 정결하게 하여 우상을 버리며 더럽혔던 기명을 거룩하게 하며 제물을 제단에 다시 드리며 거룩한 자들의 뿔을 높이며 의인을 높이며 총명이 있는 모든 자를 영화롭게 하였느니라. 그는 또한 제사장들을 다시 섬기게 하였고 마술사와 점쟁이와 마술사들을 그 땅에서 쫓아냈습니다.
