translation:
  language: ko
  text: 그는 땅에서 우상들을 없애고, 더럽혀졌던 그릇들을 거룩하게 하며, 제단에 제물을 다시 바치게 하고, 거룩한 자들의 뿔을 높이며, 의인들을 높이고, 총명이 있는 모든 사람을 영화롭게 했습니다. 또 제사장들을 다시 그 직무에 복귀시키고, 그 땅에서 주술사들과 점쟁이들과 신접한 자들을 쫓아냈습니다.
  philosophy: optimal-equivalence
