revisions:
- from: 땅을 정결하게 하여 우상을 버리며 더럽혔던 기명을 거룩하게 하며 제물을 제단에 다시 드리며 거룩한 자들의 뿔을 높이며 의인을 높이며 총명이 있는 모든 자를 영화롭게 하였느니라. 그는 또한 제사장들을 다시 섬기게 하였고 마술사와 점쟁이와 마술사들을 그 땅에서 쫓아냈습니다.
  to: 그는 땅에서 우상들을 없애고, 더럽혀졌던 그릇들을 거룩하게 하며, 제단에 제물을 다시 바치게 하고, 거룩한 자들의 뿔을 높이며, 의인들을 높이고, 총명이 있는 모든 사람을 영화롭게 했습니다. 또 제사장들을 다시 그 직무에 복귀시키고, 그 땅에서 주술사들과 점쟁이들과 신접한 자들을 쫓아냈습니다.
  rationale: 원문의 병렬된 개혁 행위를 빠짐없이 보존하고, 현대 합쇼체로 문체를 통일했습니다. ‘뿔’은 권세·힘을 나타내는 원문의 비유를 해설 없이 유지했습니다. 마지막의 세 주술 관련 범주는 중복되지 않도록 구별했습니다.
