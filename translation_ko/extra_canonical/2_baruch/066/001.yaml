translation:
  language: ko
  text: 그리고 네가 본 그 열 번째 빛나는 물들은 유다 왕 요시야 시대의 순결을 가리킵니다. 그 시대에 그는 홀로 마음의 충만함과 온 영혼으로 왕에게 복종했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒ̈ܬܪ ܒܣܝ̈ܡܐ
  english_pob_choice: the tenth bright waters
  chosen_korean: 그 열 번째 빛나는 물들
  alternatives_korean:
  - 열 번째 밝은 물들
  - 열 번째 맑은 물들
  lexicon: Payne Smith
  rationale: 시각적·상징적 표지를 드러내기 위해 ‘빛나는 물들’을 살렸고, 단순한 수식어로 약화하지 않았습니다.
- source_word: ܕܫܘܝܐ
  english_pob_choice: the purity
  chosen_korean: 순결
  alternatives_korean:
  - 정결
  - 바름
  lexicon: Payne Smith
  rationale: 문맥상 요시야 시대의 도덕적·종교적 정화가 핵심이므로, 상태를 드러내는 ‘순결’이 가장 자연스럽습니다.
- source_word: ܡܢ ܡܠܝܘ ܠܒܗ
  english_pob_choice: with the fullness of his heart
  chosen_korean: 마음의 충만함과
  alternatives_korean:
  - 온 마음으로
  - 마음이 가득한 채
  lexicon: Payne Smith
  rationale: ‘마음의 충만함’은 본문의 ‘충만함’ 어휘를 보존하면서도 한국어로 읽히게 하며, 다음 구절의 ‘온 영혼으로’와 구별됩니다.
- source_word: ܟܠܗ̇ ܢܦܫܗ
  english_pob_choice: with all his soul
  chosen_korean: 온 영혼으로
  alternatives_korean:
  - 모든 영혼으로
  - 전 영혼으로
  lexicon: Payne Smith
  rationale: 총체성을 나타내는 표현을 살리기 위해 ‘온 영혼으로’로 옮겼습니다.
- source_word: ܡܠܟܐ
  english_pob_choice: the king
  chosen_korean: 왕에게
  alternatives_korean:
  - 임금에게
  - 통치자에게
  lexicon: Payne Smith
  rationale: 본절은 유다 왕 요시야가 특정한 왕권 질서에 복종한 것을 말하므로, 일반적인 ‘왕’이 가장 직접적입니다.
theological_decisions:
- issue: 요시야 시대의 의미 범위
  chosen_reading: 순결로 표상되는 개혁기
  alternative_readings:
  - 도덕적 의로움
  - 의식적 정결
  rationale: 이 절은 단순 연대 정보가 아니라 요시야 시대를 ‘순결’로 요약하는 상징적 해석입니다. 따라서 역사적 인물명과 함께 정화의 의미를 분명히 유지했습니다.
  doctrine_reference: 역사-상징 독해
- issue: ‘왕에게 복종했다’의 대상
  chosen_reading: 유다 왕에게 복종했다
  alternative_readings:
  - 하나님께 복종했다
  - 권위에 굴복했다
  rationale: 시리아어 본문과 영어 POB 모두 ‘왕’(ܡܠܟܐ)을 가리키며, 본절의 초점은 정치적·역사적 충성의 진술입니다.
  doctrine_reference: 본문 문맥 우선
