  - 광명한 물
  lexicon: Payne Smith
  rationale: 물의 상징을 직역하되, 시각적 대비를 살리기 위해 ‘밝은’으로 옮겼습니다.
- source_word: ܬܪܝܨܘܬܐ / ܬܩܢܘܬܐ
  english_pob_choice: integrity and uprightness
  chosen_korean: 온전함과 바름
  alternatives_korean:
  - 성실함과 올곧음
  - 정직함과 바름
  lexicon: Payne Smith
  rationale: 히스기야의 인격적·윤리적 성격을 한국어로 자연스럽게 드러내면서도, 이중 표현을 유지했습니다.
- source_word: ܛܝܒܘܬܐ
  english_pob_choice: gracious favor
  chosen_korean: 은혜로운 호의
  alternatives_korean:
  - 은혜
  - 선한 호의
  lexicon: Payne Smith
  rationale: 단순한 호의보다 하나님에게서 임한 긍휼의 성격이 더 강하므로, 은혜의 뉘앙스를 함께 살렸습니다.
- source_word: ܚܝܠܬܢܐ
  english_pob_choice: the Mighty One
  chosen_korean: 권능자
  alternatives_korean:
  - 전능하신 분
  - 능하신 분
  lexicon: Payne Smith
  rationale: 2바룩에서 반복되는 신칭으로, 위엄과 능력을 간결하게 드러내는 표현을 택했습니다.
- source_word: ܒܒܥܘܬܗ
  english_pob_choice: his prayer
  chosen_korean: 그의 기도
  alternatives_korean:
  - 그의 간구
  - 그의 청원
  lexicon: Payne Smith
  rationale: 문맥상 하나님께 드린 간구이므로, 가장 직접적인 한국어 표현을 사용했습니다.
theological_decisions:
- issue: 3절의 ‘trusted in his works’와 ‘hoped in his righteousness’의 처리
  chosen_reading: 히스기야가 자기의 행위와 의를 의지하고 하나님께 말한 것으로 그대로 살렸습니다.
  alternative_readings:
  - ‘하나님만 의지했다’로 일반화하기
  - ‘선행을 내세웠다’로 비판적으로 바꾸기
  rationale: 본문은 히스기야의 행위와 의를 기도의 근거로 제시하므로, 그 긴장을 지우지 않고 보존하는 것이 필요합니다.
  doctrine_reference: 문맥 보존과 행위-의의 서술을 평준화하지 않으려는 번역 원칙
- issue: 6절의 천사 이름과 대화 표현
  chosen_reading: ‘너와 말하는 그의 천사 라미엘’로 옮겨, 천사적 전달자라는 기능을 드러냈습니다.
  alternative_readings:
  - 이름만 제시하기
  - ‘말하는 천사’로 일반화하기
  rationale: 문맥상 고유천사 명칭이 보존되어야 하며, 동시에 기능 설명도 함께 있어야 합니다.
  doctrine_reference: 묵시문학적 천사 전승 보존
