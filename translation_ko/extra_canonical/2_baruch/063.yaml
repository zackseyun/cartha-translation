  yaml_path: translation/extra_canonical/2_baruch/063.yaml
  text: '1[a]. And the eighth bright waters that you saw—these are the integrity and uprightness of Hezekiah king of Judah, and the gracious favor that came upon him.


    2. For when Sennacherib was stirred up for destruction, and his wrath was inflamed so as to destroy, together with the multitude of the nations that were with him,


    3. and when Hezekiah the king heard what the king of Assyria was devising—to come, seize him, and destroy his people, the two and a half tribes that remained, and even to overthrow Zion also—then Hezekiah trusted in his works, hoped in his righteousness, and spoke with the Mighty One.


    4. And he said, “Behold, Sennacherib is prepared to destroy us, and he will be exalted and lifted up if he destroys Zion.”


    5. And the Mighty One heard him, because Hezekiah was wise, and he regarded his prayer[b], because he was righteous.


    6. And then the Mighty One commanded Ramiel, his angel who speaks with you.


    7. And I went out and destroyed their multitude; the number of the chiefs alone was one hundred and eighty-five thousand, and each one of them had the like number.


    8. And at that time I burned their bodies from within, but I preserved their garments and their weapons outwardly, so that the still greater wonders of the Mighty One might be seen, and that his name might be spoken throughout the whole earth.


    9. And Zion was saved, and Jerusalem was delivered, and Israel also was released from distress.


    10. And all those who were in the holy land rejoiced, and the name of the Mighty One was glorified, so that it was spoken of.


    11. These are the eighth bright waters that you saw.'
  footnotes:
  - marker: a
    text: Verse 4 is preserved here with help from the Kmosko control witness because the Ceriani chapter edge in this zone remains textually rough; the sense of Hezekiah’s plea is clear, but the local page transition is not perfectly clean.
    reason: textual_variant
  - marker: b
    text: Verse 7 is especially noisy in the Ceriani OCR. The numeral ‘one hundred and eighty-five thousand’ and the clause about the chiefs are retained with support from the control witness rather than from the page slice alone.
    reason: textual_variant
translation:
  language: ko
  text: '1[a]. 그리고 네가 본 여덟째의 밝은 물은 유다 왕 히스기야의 온전함과 바름, 그리고 그에게 임한 은혜로운 호의입니다.


    2. 곧 산헤립이 멸망을 위해 일어나고, 그의 분노가 불붙어 멸하려 하였으며, 그와 함께한 많은 민족의 무리도 그러하였습니다.


    3. 그리고 히스기야 왕이 앗시리아 왕이 꾀하던 일을 들었는데, 곧 와서 그를 붙잡고 그의 백성, 남아 있던 두 지파 반과 시온까지도 무너뜨리려는 것이었습니다. 그때 히스기야는 자기의 행위와 의를 의지하고, 권능자와 말하였습니다.


    4. 그는 말하였습니다. “보십시오, 산헤립이 우리를 멸하려고 준비하고 있습니다. 그가 시온을 멸하면, 스스로 높아지고 들려질 것입니다.”


    5. 권능자는 그를 들으셨습니다. 히스기야가 지혜로웠고, 자기의 기도를 살피셨기 때문이며, 그가 의로웠기 때문입니다.


    6. 그때 권능자는 너와 말하는 그의 천사 라미엘에게 명하셨습니다.


    7. 그러자 내가 나가서 그들의 많은 무리를 멸하였는데, 지휘관들의 수만 해도 십팔만 오천이었고, 그들 각자에게도 그와 같은 수가 있었습니다.


    8. 그때 나는 그들의 몸은 안에서부터 태워 버렸지만, 그들의 옷과 무기는 겉으로는 보존하여, 권능자의 더 큰 놀라움이 드러나고 그의 이름이 온 땅에 말해지게 하였습니다.


    9. 그러자 시온은 구원받고, 예루살렘은 건져졌으며, 이스라엘도 고난에서 풀려났습니다.


    10. 그리고 거룩한 땅에 있던 모든 사람이 기뻐하였고, 권능자의 이름이 영화롭게 되어, 그것이 말해졌습니다.


    11. 이것들은 네가 본 여덟째의 밝은 물입니다.'
