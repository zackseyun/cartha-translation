lexical_decisions:
- source_word: ܘܥ̣ܢܝܬ ܘܐܡ̣ܪܬ
  english_pob_choice: And I answered and said
  chosen_korean: 나는 대답하며 말했습니다
  alternatives_korean:
  - 내가 대답하여 말했습니다
  - 대답하여 말했습니다
  lexicon: Payne Smith
  rationale: 서술의 간결함을 살리면서도 응답-발화의 이중 동사를 자연스러운 한국어로 옮겼습니다.
- source_word: ܗܘ ܕܐܬܝ̇
  english_pob_choice: that is to come
  chosen_korean: 장차 올
  alternatives_korean:
  - 다가올
  - 올
  lexicon: Smith
  rationale: 시리아어의 미래적 지시를 반영해 단순한 현재적 '올'보다 예언적 긴장을 살렸습니다.
- source_word: ܐܘܠܨܢܐ
  english_pob_choice: tribulation
  chosen_korean: 환난
  alternatives_korean:
  - 고난
  - 재난
  - 압박
  lexicon: Payne Smith
  rationale: 묵시적 문맥에서 반복되는 압박과 재난의 의미를 한국어 성서어법의 '환난'으로 옮겼습니다.
- source_word: ܡܣܘܟ
  english_pob_choice: deeply entangled
  chosen_korean: 감싸겠습니까
  alternatives_korean:
  - 휩싸겠습니까
  - 얽히겠습니까
  lexicon: Smith
  rationale: 문맥상 ‘오랜 기간을 둘러싸다/에워싸다’는 의미가 자연스럽고, 이어지는 ‘많은 해’와의 결합을 살리기 위해 ‘감싸다’를 택했습니다.
theological_decisions:
- issue: 문장의 두 번째 질문에서 ܐܘܠܨܢܐ를 어떻게 옮길지
  chosen_reading: ‘환난’으로 번역해 묵시문학적 압박의 성격을 유지했습니다.
  alternative_readings:
  - 고난
  - 재난
  - 환란
  rationale: 이 책의 종말론적 맥락에서 단순한 일반 고통보다 공동체를 덮치는 종말적 고난의 뉘앙스가 더 강하므로 ‘환난’이 가장 적절합니다.
  doctrine_reference: 묵시문학적 환난 이해
- issue: 시리아어의 ‘that’(원지시)와 미래 구문의 긴장
  chosen_reading: ‘장차 올’로 옮겨 다가오는 사건의 거리감을 보존했습니다.
  alternative_readings:
  - 올
  - 다가올
  rationale: 원문의 원지시와 미래성을 약화시키지 않기 위해 시간적 거리감을 분명히 드러냈습니다.
  doctrine_reference: 예언-종말론적 시간성
