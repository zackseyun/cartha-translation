  yaml_path: translation/extra_canonical/2_baruch/071.yaml
  text: '1. And the holy land shall have mercy on its own[a], and at that time it shall protect its inhabitants.


    2. This is the vision that you saw, and this is its interpretation.


    3. For I have come to make these things known to you, because your prayer has been heard before the Most High.'
  footnotes:
  - marker: a
    text: The surviving Ceriani chapter bucket around chapters 71–72 is structurally unstable in the current substrate, and the local OCR is difficult at this boundary. This draft follows the standard chapter division attested in the Syriac tradition for the short oracle traditionally counted as chapter 71.
    reason: textual_variant
translation:
  language: ko
  text: '1. 거룩한 땅은 자기의 것을 불쌍히 여기며[a] 그때에 그 주민들을 지킬 것입니다.


    2. 이것이 네가 본 환상이며, 이것이 그 해석입니다.


    3. 내가 이 일들을 네게 알리러 온 것은, 지극히 높으신 이 앞에서 네 기도가 들렸기 때문입니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܪܥܐ ܩܕܝܫܬܐ
  english_pob_choice: the holy land
  chosen_korean: 거룩한 땅
  alternatives_korean:
  - 성스러운 땅
  - 성별된 땅
  lexicon: Payne Smith
  rationale: 땅을 인격적으로 말하는 종말론적 표현을 살리기 위해, 그리고 English POB의 'holy land'에 맞추어 표준적이면서도 신학적 무게가 있는 '거룩한 땅'을 택했습니다.
- source_word: ܬܪܚܡ
  english_pob_choice: shall have mercy on
  chosen_korean: 불쌍히 여기며
  alternatives_korean:
  - 긍휼을 베풀며
  - 자비를 베풀며
  lexicon: Payne Smith
  rationale: 동사가 단순 감정이 아니라 능동적 자비를 뜻하므로, 한국어에서는 결과보다 행위를 드러내는 '불쌍히 여기며'로 옮겼습니다.
- source_word: ܕܝܠܗ̇
  english_pob_choice: its own
  chosen_korean: 자기의 것
  alternatives_korean:
  - 그것의 것
  - 자기 백성
  lexicon: Payne Smith
  rationale: 소유 격 관용구를 과도하게 풀지 않고, 땅과 그에 속한 존재들의 관계를 간결하게 유지하기 위해 '자기의 것'으로 옮겼습니다.
- source_word: ܬܢܛܪ
  english_pob_choice: it shall protect
  chosen_korean: 지킬 것입니다
  alternatives_korean:
  - 보호할 것입니다
  - 안전하게 지킬 것입니다
  lexicon: Payne Smith
  rationale: 보호와 보존의 뜻을 함께 담으면서도 예언 문맥에 어울리는 간결한 표현으로 '지키다'를 택했습니다.
- source_word: ܦܘܫܩܐ
  english_pob_choice: interpretation
  chosen_korean: 해석
  alternatives_korean:
  - 풀이
  - 설명
  lexicon: Payne Smith
  rationale: 환상-해석이라는 묵시문학의 정형을 살리기 위해 '해석'이 가장 직접적입니다.
- source_word: ܐܫܬܡܥܬ ܒܥܘܬܟ ܠܘܬ ܡܪܝܡܐ
  english_pob_choice: your prayer has been heard before the Most High
  chosen_korean: 지극히 높으신 이 앞에서 네 기도가 들렸기 때문입니다
  alternatives_korean:
  - 지극히 높으신 이께 네 기도가 들렸기 때문입니다
  - 네 기도가 지극히 높으신 이 앞에서 받아들여졌기 때문입니다
  lexicon: Payne Smith
  rationale: '''before the Most High''의 전승적 궁정/천상적 장소성을 보존하기 위해 ''앞에서''를 유지하고, 수동적 ''들리다''로 신적 응답의 직접성을 절제했습니다.'
theological_decisions:
- issue: 땅을 행위자처럼 의인화하는 표현을 유지할지 여부
  chosen_reading: 거룩한 땅은 자기의 것을 불쌍히 여기며 그때에 그 주민들을 지킬 것입니다
  alternative_readings:
  - 하나님께서 땅을 통해 자비를 베푸실 것입니다
  - 땅의 백성이 자비를 받을 것입니다
  rationale: 본문은 땅을 종말론적 주체처럼 말하므로, 그 의인화와 언약적 결속을 평평하게 만들지 않고 그대로 살렸습니다.
  doctrine_reference: 묵시적 의인화는 원문이 요구할 때 유지한다.
- issue: 3절에서 하나님의 응답을 얼마나 명시할지
  chosen_reading: 지극히 높으신 이 앞에서 네 기도가 들렸기 때문입니다
  alternative_readings:
  - 지극히 높으신 이께서 네 기도에 응답하셨기 때문입니다
  - 네 기도가 받아들여졌기 때문입니다
  rationale: 본문은 '응답'을 확대해서 말하기보다 '들렸다'는 청원을 상징적으로 높이는 표현을 사용하므로, 그 절제를 유지했습니다.
  doctrine_reference: 원문이 말하는 신적 행위의 범위를 넘겨 확대하지 않는다.
