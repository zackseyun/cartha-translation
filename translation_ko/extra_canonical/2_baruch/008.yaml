base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/008.yaml
  text: '1 And I saw that he went into the Holy of Holies[a], and took from there the veils, the ephod, the altar, the mercy seat, the two tables, the holy garments of the priests, the censer, the forty-eight precious stones, and all the holy vessels of the tabernacle. And he said to the earth with a loud voice, "Earth, earth, earth, hear the word of the mighty God, and receive what I commit to you, and guard them until the last times, so that, when you are commanded, you may restore them, so that strangers may not boast over them. For the time has drawn near when Jerusalem also will be delivered up for a time, until it is said that it will be restored again forever."


    2 And after these things I heard that angel say to the angels who held the torches, "Now pull down the walls and overturn them to their foundations, lest the enemies boast and say, ''We ourselves have pulled down the wall of Zion, and we have burned the dwelling place of the mighty God.''" And I stood there, where I had been before. Then the angels came down as he commanded them. And when they began at the corners of the wall, a voice was heard from within the temple after the wall had fallen, saying[e][d][c][b], "Enter ..."'
  footnotes:
  - marker: a
    text: The inventory of cultic objects on this Ceriani page is partly OCR-fragile. 'the cover,' 'the two tables,' and 'the priestly adornment' are medium-confidence renderings kept intentionally transparent.
    reason: lexical_alternative
  - marker: b
    text: The repeated cry 'Earth, earth, earth' is preserved as a formal triad because the rhetoric is emphatic and likely intentional.
    reason: cultural_note
  - marker: c
    text: The closing words 'Enter ...' break off at the page edge, and the chapter boundary here remains medium-confidence; the next page continues the voice from within the temple.
    reason: textual_variant
  - marker: d
    text: Or 'the priestly adornment'.
    reason: previous_rendering
  - marker: e
    text: Or 'the dwelling place of the mighty God.\' Yet I will be there, as I was there before."'.
    reason: previous_rendering
translation:
  language: ko
  text: '1 나는 그가 지성소[a]로 들어가서 거기서 휘장들, 에봇, 제단, 속죄소, 두 판, 제사장들의 거룩한 옷, 향로, 마흔여덟 개의 귀한 돌, 그리고 성막의 모든 거룩한 기구를 가져가는 것을 보았습니다. 그리고 그는 큰소리로 땅에게 말했습니다. 「땅아, 땅아, 땅아, 야훼의 말씀을 들으라. 내가 너에게 맡기는 것을 받아 지니고, 마지막 때까지 그것들을 지키라. 너희가 명령을 받을 때 그것들을 다시 돌려주게 하려는 것이니, 외인들이 그것들로 자랑하지 못하게 하려는 것이다. 예루살렘도 한때 넘겨질 때가 가까이 왔기 때문이다. 그러다가 그것이 다시 영원히 회복될 것이라고 말해질 때까지이다.」


    2 그리고 이 일 뒤에 나는 그 천사가 횃불들을 들고 있던 천사들에게 말하는 것을 들었습니다. 「이제 성벽을 허물고 그 기초까지 뒤엎어라. 그래야 원수들이 자랑하면서 ''우리가 시온의 성벽을 무너뜨렸고, 우리가 야훼의 거처를 불살랐다'' 하고 말하지 못할 것이다.」 그리고 나는 전에 있던 곳에 그대로 서 있었습니다. 그때 천사들이 그가 명령한 대로 내려왔습니다. 그리고 그들이 성벽의 모퉁이들에서 시작하자, 성벽이 무너진 뒤 성전 안에서 음성이 들려와 말했습니다. 「들어오라 …」'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܝܬ ܩܘܕܫܐ ܩܘܕܫܐ
  english_pob_choice: the Holy of Holies / Most Holy Place
  chosen_korean: 지성소
  alternatives_korean:
  - 가장 거룩한 곳
  - 지극히 거룩한 곳
  lexicon: Syriac sanctuary terminology (standard biblical usage)
  rationale: 시리아어의 성소 최상위 표현은 한국어 성경 전통에서 통용되는 '지성소'로 옮기는 것이 가장 자연스럽고, 본문의 성전 맥락도 분명하게 드러냅니다.
- source_word: ܚܘܣܝܐ
  english_pob_choice: the mercy seat
  chosen_korean: 속죄소
  alternatives_korean:
  - 자비소
  - 덮개
  lexicon: Hebrew cultic term via biblical sanctuary usage
  rationale: 이 항목은 성막 기구 목록의 전문 용어이므로, 의미를 살리면서도 전통적·학술적으로 확인 가능한 '속죄소'를 택했습니다.
- source_word: ܐܪܥܐ ܐܪܥܐ ܐܪܥܐ
  english_pob_choice: Earth, earth, earth
  chosen_korean: 땅아, 땅아, 땅아
  alternatives_korean:
  - 지면아, 지면아, 지면아
  - 땅, 땅, 땅
  lexicon: Vocative repetition in Syriac
  rationale: 삼중 호격의 수사적 강도를 보존하기 위해 반복 구조를 그대로 살렸고, 명령/호소의 대상이 되는 지구-땅의 인격화도 유지했습니다.
- source_word: ܕܘܟܬܐ ܕܐܠܗܐ ܚܝܒܬܐ
  english_pob_choice: the dwelling place of the mighty God
  chosen_korean: 야훼의 거처
  alternatives_korean:
  - 전능하신 하나님의 거처
  - 강하신 하나님의 거처
  lexicon: Theophoric/temple diction
  rationale: 문맥상 성전 파괴와 연관된 거처 표현이므로, '거처'로 장소성을 살리고 하나님의 이름은 문맥상 야훼로 옮겼습니다.
theological_decisions:
- issue: 성전 기구를 땅에 맡기고 보존하게 하는 장면
  chosen_reading: 땅은 성물들을 받아 지니고 마지막 때까지 지켜야 하는 수동적 보관자가 아니라, 하나님의 명령 아래 보존과 반환을 수행하는 책임을 부여받습니다.
  alternative_readings:
  - 단순한 매장 이미지로 약화할 수 있습니다.
  - 상징적 파괴 서사로만 읽을 수 있습니다.
  rationale: 본문은 성물의 소실이 아니라, 정해진 때까지 보호되었다가 다시 돌려주는 보존-회복의 서사를 말합니다.
  doctrine_reference: divine preservation of holy things
- issue: 성전 파괴의 책임 귀속
  chosen_reading: 성벽은 원수의 자랑을 막기 위해 천상의 명령 아래 무너집니다.
  alternative_readings:
  - 단순한 군사적 함락으로만 번역할 수 있습니다.
  rationale: 본문은 적의 행위가 완전히 배제되는 것이 아니라, 최종 원인이 하나님의 통치와 심판 아래 있음을 드러냅니다.
  doctrine_reference: divine sovereignty in judgment
