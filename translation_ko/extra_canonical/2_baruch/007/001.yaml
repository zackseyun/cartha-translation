revisions:
- from: 이 일들 뒤에 나는 그 횃불을 들고 서 있던 천사들에게 말하는 그 천사의 소리를 들었습니다. 「이제 그 성벽의 버팀목들을 허물고 그것들을 무너뜨리십시오. 그러면 원수들이 자랑하며 ‘우리가 직접 시온의 성벽을 무너뜨렸고, 우리가 메시아의 곳을 불태웠다’라고 말하지 못할 것입니다. 그리고 내가 전에 서 있던 그 자리에 서 있으십시오.」[a]
  to: 이 일들 뒤에, 나는 그 천사가 횃불을 들고 있던 천사들에게 말하는 것을 들었습니다. “이제 그 성벽의 버팀목들을 허물고 성벽을 무너뜨리십시오. 그러면 원수들이 자랑하며, ‘우리가 직접 시온의 성벽을 무너뜨렸고 위대하신 하나님의 처소를 불태웠다’라고 말하지 못할 것입니다. 그리고 내가 전에 서 있던 곳에 서 있으십시오.”[a]
  rationale: ‘메시아의 곳’을 원문에 충실한 ‘위대하신 하나님의 처소’로 바로잡고, 이에 근거한 잘못된 ܡܫܝܚܐ 어휘 결정을 제거해야 합니다. 또한 한국어 문장을 매끄럽게 다듬고, 마지막 문장의 대안적 본문 이해는 각주로 보존했습니다.
