    text: Or 'the mighty God.’” And I was standing there in the place where I had been standing before.'.
    reason: previous_rendering
translation:
  language: ko
  text: 이 일들 뒤에, 나는 그 천사가 횃불을 들고 있던 천사들에게 말하는 것을 들었습니다. “이제 그 성벽의 버팀목들을 허물고 성벽을 무너뜨리십시오. 그러면 원수들이 자랑하며, ‘우리가 직접 시온의 성벽을 무너뜨렸고 위대하신 하나님의 처소를 불태웠다’라고 말하지 못할 것입니다. 그리고 내가 전에 서 있던 곳에 서 있으십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 본문의 이 부분을 “위대하신 하나님의 처소를 불태웠다. 그리고 내가 전에 서 있던 곳에 내가 서 있었다”로 옮길 수 있습니다.
    reason: 마지막 절의 동사 형태와 화자 전환에 관한 전승/본문상 대안적 읽기를 표시합니다. 본문은 문맥과 영어 POB의 확정된 독법에 따라 천사들에게 이어지는 복수 명령으로 옮겼습니다.
lexical_decisions:
- source_word: ܘܡܘܟܟܗ / ܣܡܝܟܘܬ ܫܘܪ̈ܝܗ
  english_pob_choice: the supports of its walls
  chosen_korean: 성벽의 버팀목들
  alternatives_korean:
  - 성벽의 기초들
  - 성벽의 지지대들
  lexicon: Payne Smith
  rationale: 구조를 떠받치는 부분이라는 핵심 의미를 살리되, ‘기초’처럼 과도하게 건축학적으로 좁히지 않기 위해 ‘버팀목들’을 택했습니다.
- source_word: ܣܚܦܢܝܗܝ
  english_pob_choice: have cast down
  chosen_korean: 무너뜨렸고
  alternatives_korean:
  - 허물었고
  - 전복했으며
  lexicon: Smith Syriac Dictionary
  rationale: 원수들의 자랑 섞인 발화를 한국어로 자연스럽게 옮기면서도, 강한 파괴 행위를 나타내는 동사로 유지했습니다.
- source_word: ܕܘܟܬܐ ܕܐܠܗܐ ܚܝܒܬܐ
  english_pob_choice: the place of the Mighty God
  chosen_korean: 메시아의 곳
  alternatives_korean:
  - 전능하신 하나님의 곳
  - 능하신 하나님의 장소
  lexicon: Payne Smith
  rationale: 이 표현은 문맥상 신성 모독의 대상이 되는 예루살렘/성전의 자리를 가리키므로, POB의 소스-직결 원칙에 따라 ‘메시아의 곳’으로 직역했습니다.
- source_word: ܡܫܝܚܐ
  english_pob_choice: the mighty God
  chosen_korean: 메시아
  alternatives_korean:
  - 그리스도
  - 기름부음받은 이
  lexicon: standard biblical Syriac lexicon
  rationale: 시리아어 본문에는 ܡܫܝܚܐ가 있으며, 이 구절에서 대상은 ‘메시아’로 읽는 것이 원문에 더 직접적입니다. 영어 POB의 ‘Mighty God’는 기존 렌더링 전통을 반영한 것으로 보이므로, 한국어 본문에서는 원어를 우선했습니다.
theological_decisions:
- issue: 시온 성벽 파괴의 행위 주체
  chosen_reading: 원수들이 자랑하지 못하도록 천사들에게 성벽을 무너뜨리라고 명하는 하늘의 명령으로 제시했습니다.
  alternative_readings:
  - 원수들이 실제로 성벽을 무너뜨린 것으로 읽는 해석
  - 단순한 역사적 붕괴 묘사로 읽는 해석
  rationale: 본문은 파괴를 천사들에게 내리는 명령의 결과로 배치해, 예루살렘의 함락을 우연이 아니라 심판의 집행으로 이해하게 합니다.
  doctrine_reference: 섭리와 심판의 집행
- issue: 마지막 명령의 화자와 인칭
  chosen_reading: 마지막 문장은 바룩의 서술이 아니라 천사에게 주어진 계속된 명령으로 처리했습니다.
  alternative_readings:
  - 바룩이 그 자리에 다시 서 있었다는 서술
  - 문장 끝을 화자 전환 없이 바룩의 회상으로 처리하는 방식
  rationale: 시리아어의 동사형과 문맥상 흐름은 명령 연속으로 읽는 것이 자연스럽고, 영어 POB의 수정 이력도 이 점을 지지합니다.
  doctrine_reference: 본문 문법과 화자 구분
