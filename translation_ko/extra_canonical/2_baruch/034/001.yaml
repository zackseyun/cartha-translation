  text: Then I lifted up my eyes and wept, and I said at that time, “Far be it from me that I should be silent toward you or forget you. But only as far as the house of the tombs of my fathers, in affliction and in the distress of lamentation cry aloud, so that I may not be forgotten before you and afterward. And these things I have declared to you for your remembrance.”
  footnotes:
  - marker: a
    text: Or 'Have pity on me, that I may be silent toward you or forget you no longer.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 나는 눈을 들어 울며 말했습니다. 「나로서는 결코 당신들에게 침묵하거나 당신들을 잊는 일이 없게 하십시오. 다만 내 조상들의 무덤집까지는, 고난과 애도의 괴로움 속에서 크게 부르짖게 하셔서 내가 당신들 앞에서, 또 그 뒤에도 잊히지 않게 하십시오. 그리고 나는 이 일들을 당신들의 기억을 위하여 당신들에게 말해 두었습니다.」[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܣ ܠܝ
  english_pob_choice: Far be it from me
  chosen_korean: 나로서는 결코 … 않게 하십시오
  alternatives_korean:
  - 그럴 리 없습니다
  - 감히 … 하지 않겠습니다
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 시리아어 관용구는 간청보다 강한 거부/불가성의 표현이므로, 한국어에서도 단순한 감정 표현이 아니라 ‘결코 … 않게’로 옮겨 어조를 보존했습니다.
- source_word: ܕܐܫܬܘܩܘܟܘܢ
  english_pob_choice: that I should be silent toward you
  chosen_korean: 당신들에게 침묵하거나
  alternatives_korean:
  - 당신들에 대해 말하기를 그치거나
  - 당신들에 관해 침묵하거나
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 동사는 ‘침묵하다’의 의미가 핵심이므로, 관계적 방향성을 살리되 과도하게 풀이하지 않고 ‘당신들에게 침묵하다’로 처리했습니다.
- source_word: ܠܒܝܬ ܩܘ̣ܒܘܪ ܩܘ̈ܒ̣ܪܐ ܕܐܒܗܝ
  english_pob_choice: the house of the tombs of my fathers
  chosen_korean: 내 조상들의 무덤집
  alternatives_korean:
  - 내 조상들의 묘실
  - 내 조상들의 장지
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 중첩된 장례 이미지를 평준화하지 않기 위해 직역에 가까운 ‘무덤집’을 택해, 단순한 묘지보다 더 구체적인 장례 공간감을 유지했습니다.
- source_word: ܡܢ ܚܒܠܬܐ ܒܥܝܩܘܬ ܝܠܠܐ ܨܘܝܘ
  english_pob_choice: in affliction and in the distress of lamentation cry aloud
  chosen_korean: 고난과 애도의 괴로움 속에서 크게 부르짖게 하셔서
  alternatives_korean:
  - 환난과 통곡의 고통 속에서 외치게 하셔서
  - 고통과 애도의 답답함 속에서 소리치게 하셔서
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: ‘고난’과 ‘애도의 괴로움’이라는 누적된 감정층을 살리고, imperative 성격의 ‘크게 부르짖게 하셔서’로 호소의 힘을 유지했습니다.
- source_word: ܥܘܗܕܢܘܢ
  english_pob_choice: for your remembrance
  chosen_korean: 당신들의 기억을 위하여
  alternatives_korean:
  - 그들을 기억하시기 위하여
  - 당신들의 기억 가운데 두기 위하여
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 문맥상 기억의 대상이 독자/청자 쪽에 놓이므로, 소유격적 의미를 살려 ‘당신들의 기억’을 사용했고, 기억-회상의 기능을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 직접 화법의 호칭과 간구 어조
  chosen_reading: ‘당신들’ 호칭을 유지하고, 끝부분은 청유형 ‘-게 하십시오’로 옮겼습니다.
  alternative_readings:
  - ‘너희’로 낮춘 호칭
  - 단정문 ‘나는 침묵하지 않겠습니다’
  rationale: 본문은 청자에게 직접 말하는 탄원체이므로, 현대 합쇼체 안에서 거리감과 간구성을 함께 유지하는 호칭/어미를 선택했습니다.
  doctrine_reference: 문학-예언적 탄원 화법 보존
- issue: ‘잊히지 않게’의 수동성
  chosen_reading: ‘내가 당신들 앞에서, 또 그 뒤에도 잊히지 않게 하십시오’로 수동 의미를 살렸습니다.
  alternative_readings:
  - ‘내가 당신들을 잊지 않게 하십시오’
  - ‘내가 잊어버리지 않게 하십시오’
  rationale: 시리아어의 초점은 말하는 자가 잊히지 않도록 하는 데 있으므로, 능동화하여 주체를 바꾸지 않고 문맥상의 수동/피동 감각을 유지했습니다.
  doctrine_reference: 기억-망각 모티프의 보존
