base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/084.yaml
  text: '1[a]. Look, while I am still alive I have made these things known to you, because I said that you should learn what is good; for the Mighty One commanded me to instruct you, and before I die I will set before you some of the ordinances of his judgment.


    2. Remember how Moses once called heaven and earth as witnesses against you and said, “If you trespass the law[b], you will be scattered; but if you keep it, you will be kept.”


    3. He also kept saying other things to you when you were together in the wilderness as twelve tribes.


    4. But after his death you cast them away from yourselves, and because of this what had been foretold came upon you.


    5. And now, Moses used to tell you before it happened to you—and look, it has happened to you—because you abandoned the law.


    6. So I also say to you after your suffering: if you listen to these words that have been spoken to you, you will receive from the Mighty One what has been kept ready and stored up for you.


    7. Let this letter also be a witness between me and you, so that you may remember the commandments of the Mighty One, and so that it may become a vindication for me before him who sent me.


    8. Remember the law and Zion, and the holy land, and your brothers, and the covenant of your fathers; and do not forget the festivals and the sabbaths.


    9. Hand on this letter and the traditions of the law to your children after you, just as your fathers handed them on to you.


    10. And at all times keep asking earnestly, and pray diligently with your whole heart, that the Mighty One may have mercy on you and may not reckon the multitude of your sins, but remember the uprightness of your fathers.


    11. For if he should judge us apart from the abundance of his mercies[e][d][c], woe to all of us who have been born.'
  footnotes:
  - marker: a
    text: The Ceriani bucket for chapter 84 overlaps with adjacent material, especially near the opening on printed p. 176. The translation follows the standard chapter division but does not pretend the edge is perfectly secure.
    reason: alternative_reading
  - marker: b
    text: Several lines on printed pp. 176–177 are OCR-rough in the supplied bucket. The rendering of v. 6–9 is therefore cautious and guided by the chapter’s internal sense rather than by false word-for-word certainty.
    reason: textual_variant
  - marker: c
    text: The close of this chapter runs directly into the start of chapter 85 in the page sequence. The final warning is translated here as the end of chapter 84 in keeping with the established numbering.
    reason: cross_reference
  - marker: d
    text: Or 'but if you keep it, you will stand fast.'.
    reason: previous_rendering
  - marker: e
    text: Or 'He also kept saying such things to you'.
    reason: previous_rendering
translation:
  language: ko
  text: '1[a]. 보십시오, 제가 아직 살아 있는 동안 이 일들을 여러분에게 알려 드립니다. 이는 제가 선한 것들을 배우라고 말했기 때문입니다. 전능하신 이가 저에게 여러분을 가르치라고 명하셨고, 제가 죽기 전에 여러분 앞에 그분의 심판의 규례들 가운데 일부를 제시하려는 것입니다.


    2. 모세가 한때 하늘과 땅을 증인으로 여러분에게 불러 세워 이렇게 말한 것을 기억하십시오. “너희가 율법[b]을 범하면 흩어질 것이요, 그것을 지키면 지켜질 것이다.”


    3. 그가 또한 여러분이 광야에서 열두 지파로 함께 있던 때에 다른 것들도 여러분에게 계속 말했습니다.


    4. 그러나 그의 죽음 뒤에 여러분은 그것들을 자신들에게서 내버렸고, 이 때문에 미리 말해졌던 일이 여러분에게 닥쳤습니다.


    5. 이제 모세는 그것이 여러분에게 일어나기 전에 여러분에게 말해 왔습니다—보십시오, 그것이 여러분에게 일어났습니다—여러분이 율법을 버렸기 때문입니다.


    6. 그러므로 저도 여러분의 고난 뒤에 여러분에게 말합니다. 여러분이 이 말들, 곧 여러분에게 전해진 이 말들에 귀를 기울인다면, 전능하신 이가 여러분을 위해 마련해 두시고 간직해 두신 것을 받게 될 것입니다.


    7. 이 편지가 저와 여러분 사이의 증인이 되게 하여, 여러분이 전능하신 이의 명령들을 기억하게 하십시오. 또한 이 편지가 저를 보내신 분 앞에서 저에게 변호[b]가 되게 하십시오.


    8. 율법과 시온, 거룩한 땅과 여러분의 형제들, 그리고 여러분 조상의 언약을 기억하고, 절기와 안식일을 잊지 마십시오.


    9. 이 편지와 율법의 전승을 여러분 뒤의 자녀들에게 넘겨주십시오. 여러분의 조상들이 그것들을 여러분에게 넘겨준 것처럼 하십시오.


    10. 또 언제나 간절히 구하고, 온 마음으로 부지런히 기도하여 전능하신 이가 여러분에게 자비를 베푸시고 여러분의 죄의 많은 수를 계산하지 않으시며, 오히려 여러분 조상들의 의를 기억하시도록 하십시오.


    11. 그분이 만일 그분의 풍성하신 자비[c][d][e]에서 우리를 떼어 놓고 우리를 심판하신다면, 태어난 우리 모두에게 화가 있을 것입니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܠܬܐ
  english_pob_choice: the Mighty One
  chosen_korean: 전능하신 이
  alternatives_korean:
  - 강하신 이
  - 하나님
  lexicon: Payne Smith
  rationale: 시리아어 본문의 신적 칭호를 살리면서도, 한국어에서는 ‘전능하신 이’가 존칭과 위엄을 함께 전달해 POB의 고유한 호칭감을 유지합니다.
- source_word: ܢܡܘܣܐ
  english_pob_choice: law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 가르침
  lexicon: Payne Smith
  rationale: 문맥이 모세의 경고와 언약적 순종을 다루므로, 일반적인 ‘법’보다 ‘율법’이 원문의 토라적 무게를 더 정확히 드러냅니다.
- source_word: ܐܚܪ̈ܢܝܬܐ
  english_pob_choice: other things
  chosen_korean: 다른 것들도
  alternatives_korean:
  - 그 같은 것들도
  - 그 밖의 것들도
  lexicon: Payne Smith
  rationale: 검토본이 지적하듯 이 표현은 ‘such things’가 아니라 추가로 말한 ‘other things’이므로, 한국어도 단순히 ‘다른 것들’로 옮겨 추가 발언의 의미를 보존했습니다.
- source_word: ܫܘܒ̈ܠܡܢܘܬܗ
  english_pob_choice: a vindication for me
  chosen_korean: 저에게 변호
  alternatives_korean:
  - 저를 위한 입증
  - 저에 대한 의변
  lexicon: Payne Smith
  rationale: 법정적·변론적 의미가 분명하므로, ‘변호’가 한국어 독자에게 가장 직접적이고 자연스럽게 해당 기능을 전달합니다.
theological_decisions:
- issue: 모세의 경고를 통한 언약적 심판과 보존의 대조
  chosen_reading: ‘범하면 흩어질 것이요, 지키면 지켜질 것이다’로 번역해 동일 어근의 보존/유지 대조를 드러냈습니다.
