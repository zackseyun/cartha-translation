  yaml_path: translation/extra_canonical/2_baruch/037/001.yaml
  text: And after these things I saw that the cedar was burning, and the forest that was around it, and the vine was growing, and the plain around it was full of unfading flowers. And I awoke and arose.
  footnotes:
  - marker: a
    text: Or 'And they brought the cedar that had been thrown down near it. And I saw, and behold, the vine opened its mouth and said to the cedar, “Are you not that cedar which was left from the forest of wickedness? By your hands wickedness was kept in being and wrought through all those years, and goodness was not found. What was not yours you kept seizing, and what was yours you never pitied. You stretched out your hand to those far away, and those who came near you, you caught in the snares of your evil. And your soul was exalted at all times, as though you could not be uprooted. But now your time has hastened, and your hour has come. So go also, O cedar, after the forest that went before you, and become dust with it, and let your ashes be mingled together. And now lie down in anguish, and rest in torment until your last time comes, when you shall return again and be tormented yet more.”'.
    reason: previous_rendering
translation:
  language: ko
  text: 그런 일들이 있은 뒤에 나는 보았습니다. 백향목이 불타고 있었고, 그 둘레의 숲도 불타고 있었으며, 포도나무는 자라고 있었고, 그 둘레의 평야는 시들지 않는 꽃들로 가득 차 있었습니다. 그리고 나는 깨어 일어났습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢ ܒܬܪ ܗܠܝܢ
  english_pob_choice: After these things
  chosen_korean: 그런 일들이 있은 뒤에
  alternatives_korean:
  - 그 일들 후에
  - 이 일들이 지난 뒤에
  lexicon: Payne Smith
  rationale: 시간적 전환을 자연스럽게 살리되, 앞선 환상 서술과 이어지는 흐름을 분명히 하기 위해 한국어로 매끄럽게 옮겼습니다.
- source_word: ܚܙܝܬ
  english_pob_choice: I saw
  chosen_korean: 나는 보았습니다
  alternatives_korean:
  - 내가 보았습니다
  - 보았습니다
  lexicon: Payne Smith
  rationale: 예언자적 환상 서술의 1인칭 시점을 분명히 드러내기 위해 주어를 살렸습니다.
- source_word: ܐܪܙܐ
  english_pob_choice: cedar
  chosen_korean: 백향목
  alternatives_korean:
  - 삼나무
  - 향나무
  lexicon: Payne Smith
  rationale: 상징적 나무를 가리키는 전통적 식물명으로서 문맥에 맞는 한국어 관용을 따랐습니다.
- source_word: ܥܝܪܐ ... ܕܠܐ ܡܬܟܡܪܢ
  english_pob_choice: full of unfading flowers
  chosen_korean: 시들지 않는 꽃들로 가득 차 있었습니다
  alternatives_korean:
  - 지지 않는 꽃들로 가득 차 있었습니다
  - 시들지 않는 꽃으로 가득했습니다
  lexicon: Payne Smith
  rationale: ‘unfading’의 지속성을 살려 종말론적 환상의 풍성함을 보존했습니다.
theological_decisions:
- issue: 본문이 실제 사건 서술인지, 환상 종료와 각성 서술인지
  chosen_reading: 시각적 환상이 끝나고 바룩이 깨어나는 장면으로 읽었습니다.
  alternative_readings:
  - 단순히 풍경을 계속 묘사하는 문장으로 읽기
  - 앞선 알레고리 해석을 이어받아 상징 의미를 직접 풀어 쓰기
  rationale: 시리아어 본문과 영어 POB 모두 마지막에 ‘깨어 일어났다’는 종결 동사를 두어 환상 종료를 분명히 합니다. 해석을 덧붙이지 않고 장면 전환만 드러냈습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
