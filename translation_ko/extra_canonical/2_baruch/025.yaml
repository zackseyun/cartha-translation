base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/025.yaml
  text: Then I answered and said to him[a], “I too have been shaken in my heart because of this. Therefore, O Mighty One, because of the evils that are coming upon the earth, and because of the great tribulations that are coming, when they see your judgment, the inhabitants of the earth will fall into many afflictions and into great distresses. And they will forget the strength that was given to them, and in their thoughts they will hope and say[c][b], ‘The Mighty One does not remember the earth.’
  footnotes:
  - marker: a
    text: The present Ceriani bucket is textually unstable at the chapter edge. The raw OCR on the supplied page does not align smoothly with the traditional sense here; this draft follows Ceriani as base but uses the control-witness trajectory to recover the chapter's probable sense rather than pretending the damaged edge is certain.
    reason: textual_variant
  - marker: b
    text: The opening and closing edges of this chapter are especially vulnerable to segmentation drift in the current substrate; the final clause also leads directly into the next chapter's question about the duration of the coming distress.
    reason: alternative_reading
  - marker: c
    text: '''Remembers the earth'' preserves the idiom of divine remembrance rather than replacing it with a smoother interpretive paraphrase.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 내가 그에게 대답하여 말했습니다. “저도 이 일 때문에 마음이 흔들렸습니다. 그러므로, 오 전능하신 이여, 땅 위에 닥쳐올 악들과 앞으로 닥쳐올 큰 환난들 때문에, 그들이 당신의 심판을 볼 때 땅의 주민들은 많은 고난과 큰 괴로움에 빠질 것입니다. 또 그들에게 주어진 힘을 잊어버리고, 마음속으로는 희망하며 이렇게 말할 것입니다. ‘전능하신 이는 땅을 기억하지 않으십니다.’”[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܪܝܡܢܐ
  english_pob_choice: the Mighty One
  chosen_korean: 전능하신 이
  alternatives_korean:
  - 전능하신 분
  - 능력자
  lexicon: Payne Smith
  rationale: 호칭의 장중함을 살리면서도 한국어에서 자연스럽고 신적 호칭으로 읽히게 하기 위해 ‘전능하신 이’로 옮겼습니다.
- source_word: ܐܘܠܨܢܐ
  english_pob_choice: afflictions
  chosen_korean: 고난
  alternatives_korean:
  - 환난
  - 괴로움
  - 압박
  lexicon: Payne Smith
  rationale: 문맥상 단순한 심리적 괴로움보다 실제로 닥쳐오는 압박과 고통의 누적을 가리키므로 ‘고난’이 가장 안정적으로 대응합니다.
- source_word: ܡܬܕܟܪ
  english_pob_choice: remembers
  chosen_korean: 기억하십니다
  alternatives_korean:
  - 돌보십니다
  - 살피십니다
  lexicon: Payne Smith
  rationale: 하나님의 ‘기억’은 성경적 관용구로서 단순한 인지보다 언약적 주의를 포함하므로, 직설적으로 ‘기억하십니다’를 택했습니다.
- source_word: ܚܙܝܢ
  english_pob_choice: see
  chosen_korean: 볼 때
  alternatives_korean:
  - 목격할 때
  - 보게 될 때
  lexicon: Payne Smith
  rationale: 심판/질서가 눈앞에 드러나는 순간을 평이하게 전달하기 위해 ‘볼 때’로 렌더링했습니다.
theological_decisions:
- issue: 땅을 기억하지 않는다는 절망적 발화를 완화할지 여부
  chosen_reading: 그대로 유지하여 ‘전능하신 이는 땅을 기억하지 않으십니다’라고 옮겼습니다.
  alternative_readings:
  - 전능하신 이는 땅을 돌보지 않으십니다
  - 전능하신 이는 땅을 더 이상 돌아보지 않으십니다
  rationale: 본문은 종말적 고난 앞에서 터져 나오는 인간의 절망을 그대로 드러내므로, 의미를 부드럽게 바꾸지 않고 ‘기억’의 성경적 어법을 유지했습니다.
  doctrine_reference: lament / divine remembrance
