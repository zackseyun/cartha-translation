- source_word: ܥܠ ܚܙܝܬܐ ܕܐܬܬ / ܩܐܡ ܗܘܝܬ ܥܠ ܨܝܕܐ ܕܢܗܪܐ
  english_pob_choice: by the bank of the river
  chosen_korean: 강가에 서 있었습니다
  alternatives_korean:
