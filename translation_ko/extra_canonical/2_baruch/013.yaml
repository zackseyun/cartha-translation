  - 강의 물가에 서 있었습니다
  lexicon: Payne Smith
  rationale: Ceriani의 시리아어 본문은 강가/강둑의 위치를 가리키므로, 본문 흐름을 따라 Zion 지명으로 바꾸지 않고 자연스러운 현대 한국어로 옮겼습니다.
- source_word: ܐܬܬܙܝܥܘ
  english_pob_choice: were shaken
  chosen_korean: 흔들렸으므로
  alternatives_korean:
  - 동요했으므로
  - 충격을 받았으므로
  lexicon: Payne Smith
  rationale: 내적 동요를 드러내는 동사이므로, 단순한 놀람보다 강한 ‘흔들리다’가 문맥의 긴장과 심판 오라클의 힘을 살립니다.
- source_word: ܦܘܪܥܢܐ
  english_pob_choice: the punishment / retribution
  chosen_korean: 벌
  alternatives_korean:
  - 보응
  - 응보
  - 재앙
  lexicon: Payne Smith
  rationale: 문맥상 도덕적·사법적 판단을 가리키지만, 한국어 본문에서는 반복되는 오라클의 직설성을 살려 ‘벌’로 두고, 해석의 무게는 문맥 전체로 유지했습니다.
- source_word: ܚܡܪܐ ܡܕܝܠܢܐ / ܕܡܐ
  english_pob_choice: choice wine / blood
  chosen_korean: 좋은 포도주 / 피
  alternatives_korean:
  - 정제한 포도주 / 피
  - 선택된 포도주 / 피
  lexicon: Payne Smith
  rationale: 포도주와 피의 대조는 심판 비유의 핵심이므로, 음주-피의 이미지가 즉시 드러나도록 직역에 가깝게 유지했습니다.
theological_decisions:
- issue: 13:1의 장소 표현
  chosen_reading: 시리아어 본문과 POB 수정 이력을 따라 ‘강가’로 유지했습니다.
  alternative_readings:
  - 시온 산
  - 강의 옆
  rationale: 통제 라틴 본문은 Zion을 전하지만, 본문 기반 원칙상 Ceriani 시리아어를 우선해야 하므로 지명 조화보다 원문 증거를 보존했습니다.
  doctrine_reference: Translation philosophy / textual transparency
- issue: 13:11-12의 ‘자기 생명’과 ‘탐냄’
  chosen_reading: 그들은 죽음에 이르기까지 자기 생명을 아끼지 않았고, 오히려 내주었습니다 — 그 이유는 탐냈기 때문입니다.
  alternative_readings:
  - 그들은 자기 생명을 불쌍히 여기지 않았다
  - 그들이 탐낸 것 때문에 그 생명을 내주었다
  rationale: 본문의 도덕적 반전은 단순한 자기희생이 아니라, 탐욕과 폭력의 결과로 생명을 내준 행위에 있습니다. 이를 완화하지 않고 유지했습니다.
  doctrine_reference: God's judgment is morally ordered and exposed by human greed
