  yaml_path: translation/extra_canonical/2_baruch/083/001.yaml
  text: '… into dust where it was born. And the possession of wealth will no longer turn back, but will seek death in its craving. And the snatchers of wages will bring forth death before its time, and the death that is the wage of sufferings will be taken away. And no matter of joy will remain for delight. And the realm of change will be turned into accomplished conflict, and there will be no hearing for sinners in Sheol.


    Since, then, all these things now come to pass, do you think they are not requited? One day, therefore, the inhabitants of the earth … If, then, I have made these things known to you while I still live—for great is the burden of guilt for those who belong to falsehood, and I set forth its full measure, because from falsehood they were begotten from the beginning, unto death—and I have said that you ought to be instructed: hear, and do, and say.


    "If you transgress the law, you will be scattered, and you will be removed from your land." Jeremiah also spoke to you while he was with you, when your fathers were forty years in the wilderness. And after the death of Joshua, and after Moses had been taken from you, your tribes still remained established. Moses told you beforehand that these things would come upon you; and when they did come upon you, know that it was according to the law.


    So now I also say to you, after what you have seen: do not go astray after those things that have come upon you. You will receive from the Mighty One the kingdom that endures, and what has been laid up for you. But know, children, that you were not handed over to emptiness when the commandments of the Mighty One were given to you; and no one goes forth by the spirit before the place of judgment. Rather, turn back to acknowledge his will and his law, and the holy people, and the assemblies, and his sanctuaries, and the beautiful works. Do not go astray …'
translation:
  language: ko
  text: '……태어난 곳인 흙으로 돌아갈 것입니다. 부의 소유도 더는 되돌아오지 않고, 그 욕망 때문에 죽음을 찾을 것입니다. 삯을 빼앗는 자들은 때가 이르기 전에 죽음을 불러올 것이며, 고난의 삯으로 마련된 죽음은 거두어질 것입니다. 기쁨의 어떤 것도 즐거움을 위해 남지 않을 것입니다. 변화의 세계는 이루어진 싸움으로 바뀌고, 스올에서는 죄인들의 말이 들리지 않을 것입니다.


    그러므로 이 모든 일이 이제 일어나는데도, 당신은 그것들이 보응을 받지 않는다고 생각합니까? 그러므로 어느 날 땅에 사는 이들이 …'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܥܦܪܐ ܝܠܝܕ
  english_pob_choice: into dust where it was born
  chosen_korean: 흙으로 돌아가 그곳에서 났습니다
  alternatives_korean:
  - 흙으로 태어났습니다
  - 흙에서 난 곳으로 돌아갑니다
  lexicon: ܥܦܪܐ / dust, earth
  rationale: ‘into dust’와 ‘where it was born’의 두 요소를 모두 살려, 기원과 귀환을 함께 드러내는 표현으로 옮겼습니다.
- source_word: ܚܛܘ̈ܦܝ ܕܐܓܪܐ
  english_pob_choice: the snatchers of wages
  chosen_korean: 삯을 빼앗는 자들
  alternatives_korean:
  - 임금을 훔치는 자들
  - 보수를 탈취하는 자들
  lexicon: ܚܛܘ̈ܦܝ / snatchers, ܐܓܪܐ / wage, reward
  rationale: 직역하면 ‘삯을 낚아채는 자들’에 가까우며, 고용된 삯의 부당한 강탈이라는 의미를 유지하기 위해 ‘빼앗는 자들’로 옮겼습니다.
- source_word: ܕܚ̈ܫܐ ܢܗܘܐ ܥܒܝܕܐ. ܕܢܬܢܣܒ
  english_pob_choice: the death that is the wage of sufferings will be taken away
  chosen_korean: 고난의 삯인 그 죽음은 거두어질 것입니다
  alternatives_korean:
  - 고난의 대가인 죽음은 제거될 것입니다
  - 고난의 삯인 죽음은 옮겨질 것입니다
  lexicon: ܚܫܐ / sufferings, ܥܒܝܕܐ / made, ܢܬܢܣܒ / be taken away
  rationale: 문장 구조상 ‘고난의 삯’이 ‘죽음’과 동격으로 이어지므로, 보상으로 주어지는 죽음이라는 역설을 그대로 드러내도록 다듬었습니다.
- source_word: ܕܡ̈ܫܢܝܐ ... ܡܠܚܡܘܬܐ
  english_pob_choice: the realm of change will be turned into accomplished conflict
  chosen_korean: 변동의 영역은 완성된 충돌로 바뀌고
  alternatives_korean:
  - 변화의 세계는 이루어진 전쟁으로 바뀌고
  - 변전의 세계는 성취된 싸움이 될 것이며
  lexicon: ܡ̈ܫܢܝܐ / changing things, ܡܠܚܡܘܬܐ / conflict, battle
  rationale: 추상명사들의 대립을 살리기 위해 ‘변동’과 ‘충돌’을 사용했고, 종말론적 긴장감을 유지했습니다.
- source_word: ܒܫܝܘܠ
  english_pob_choice: in Sheol
  chosen_korean: 스올에서
  alternatives_korean:
  - 음부에서
  - 저승에서
  lexicon: ܫܝܘܠ / Sheol
  rationale: 고유명사적 지시를 유지하기 위해 음역형 ‘스올’을 사용했습니다.
- source_word: ܐܝܟܢܐ ܕܫ̈ܒ̣ܛܝܟܘܢ ܗ̈ܘܝ ܐܡܝܢ
  english_pob_choice: your tribes still remained established
  chosen_korean: 당신들의 지파는 여전히 굳게 서 있었습니다
  alternatives_korean:
  - 당신들의 지파는 여전히 확고했습니다
  - 당신들의 지파는 그대로 남아 있었습니다
  lexicon: ܫܒ̣ܛܐ / tribe, ܐܡܝܢ / established, lasting
  rationale: ‘remain established’의 지속성과 안정성을 자연스럽게 전달하는 표현으로 옮겼습니다.
theological_decisions:
- issue: 보응 여부에 대한 수사적 질문
  chosen_reading: ‘그것이 보응되지 않는다’가 아니라, 지금 일어나는 일들이 이미 보응의 성격을 띤다는 논지를 드러내는 반문으로 옮겼습니다.
  alternative_readings:
  - ‘갚음이 없다’는 단순 진술로 옮김
  - ‘심판이 없다’로 완화함
  rationale: 문맥 전체가 앞선 재난들을 언약적 보응으로 해석하도록 이끄므로, 질문의 논박성을 유지해야 합니다.
  doctrine_reference: 언약적 보응/심판
