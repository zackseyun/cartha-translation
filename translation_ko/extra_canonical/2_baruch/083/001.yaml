revisions:
- from: '……흙으로 돌아가 그곳에서 났습니다. 부와 재산의 소유도 더는 되돌아가지 않고, 그 욕심 속에서 죽음을 찾을 것입니다. 삯을 빼앗는 자들은 때 이르게 죽음을 불러올 것이며, 고난의 삯인 그 죽음은 거두어질 것입니다. 또한 기쁨과 관련된 어떤 일도 즐거움으로 남지 않을 것입니다. 변동의 영역은 완성된 충돌로 바뀌고, 스올에서 죄인들의 말을 들을 수는 없을 것입니다.


    그러므로 이 모든 일이 지금 일어나고 있으니, 당신은 그것이 보응되지 않는다고 생각합니까? 그러므로 하루는 땅의 주민들이 …[a][b]'
  to: '……태어난 곳인 흙으로 돌아갈 것입니다. 부의 소유도 더는 되돌아오지 않고, 그 욕망 때문에 죽음을 찾을 것입니다. 삯을 빼앗는 자들은 때가 이르기 전에 죽음을 불러올 것이며, 고난의 삯으로 마련된 죽음은 거두어질 것입니다. 기쁨의 어떤 것도 즐거움을 위해 남지 않을 것입니다. 변화의 세계는 이루어진 싸움으로 바뀌고, 스올에서는 죄인들의 말이 들리지 않을 것입니다.


    그러므로 이 모든 일이 이제 일어나는데도, 당신은 그것들이 보응을 받지 않는다고 생각합니까? 그러므로 어느 날 땅에 사는 이들이 …'
  rationale: 본문이 제공하는 범위 안에서만 수정했습니다. 시작과 끝의 전승/인용 단절은 말줄임표로 유지했고, 출생지와 흙의 관계, 죽음의 시기, 스올에서의 ‘들림 없음’, 보응에 관한 수사적 질문을 더 충실하고 자연스러운 합쇼체로 다듬었습니다. 불명확한 종말론적 표현은 특정 교리나 해석으로 풀어쓰지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:05Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 문장의 미완성 앞부분과 마지막의 단절은 말줄임표로 보존해야 합니다. 현 초안의 ‘흙으로 돌아가 그곳에서 났습니다’는 원문의 귀환과 출생지의 관계를 어색한 과거 서술로 바꾸며, ‘스올에서 죄인들의 말을 들을 수는 없을 것입니다’는 원문의 ‘들림’보다 능력·가능성을 부가합니다. 또한 ‘지금 일어나고 있으니’는 원문의 현재 진행/성취의 수사적 힘을 다소 약화합니다.
  naturalness: 합쇼체는 대체로 유지되었으나, ‘부와 재산의 소유’, ‘기쁨과 관련된 어떤 일’, ‘완성된 충돌’은 현대 한국어에서 부자연스럽거나 의미 관계가 불명확합니다. ‘태어난 곳인 흙’, ‘기쁨의 어떤 것도’, ‘이루어진 싸움’으로 최소 조정하면 더 자연스럽습니다.
  terminology: ‘삯’, ‘고난’, ‘스올’, ‘보응’은 적절합니다. ܐܓܪܐ의 ‘삯’은 임금과 보응의 어감을 함께 지니므로 유지했습니다. ܡ̈ܫܢܝܐ와 ܡܠܚܡܘܬܐ의 추상적이고 다소 난해한 대비는 해석적으로 구체화하지 않고 ‘변화의 세계’와 ‘이루어진 싸움’으로 보존했습니다.
  issues:
  - severity: medium
    issue: 첫 문장이 귀환을 과거의 출생 서술로 처리함
    rationale: ‘흙으로 돌아가 그곳에서 났습니다’는 문법적으로 주어와 시제가 불안정하며, 영어 감사본과 원문의 ‘태어난 곳인 흙으로’라는 관계를 충분히 드러내지 못합니다.
  - severity: low
    issue: ‘죄인들의 말을 들을 수는 없을 것입니다’가 가능 의미를 부가함
    rationale: 원문과 영어 감사본은 스올에서 죄인들의 ‘들림’이 없다고 말합니다. ‘죄인들의 말이 들리지 않을 것입니다’가 더 직접적입니다.
  - severity: low
    issue: 정의되지 않은 [a][b] 앵커
    rationale: 초안에는 해당 앵커의 주석이 없으며, 본문 단절은 말줄임표 자체로 충분히 표시됩니다. 앵커는 제거합니다.
