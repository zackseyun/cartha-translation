  text: 그 후에 네 번째 나라가 일어날 것인데, 그 나라의 세력은 이전보다 더 강하고 더 악할 것입니다. 그것은 평지의 숲과 같이 여러 때 동안 다스리며 시대를 붙잡고 레바논의 백향목보다 더 높이 솟아오를 것입니다.
