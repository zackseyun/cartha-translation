  source_fidelity: 초안의 ‘더 강하고’는 시리아어의 ‘강하고/가혹한’이라는 서술 및 영어 감사본의 ‘harsher’를 충분히 반영하지 못합니다. 또한 ‘이전보다’는 선행 왕국들과의 비교임을 명시하는 편이 정확합니다. 나머지 왕국의 흥기, 장기간 통치, 시대들을 장악함, 레바논의 백향목보다 높아짐이라는 비유적 서술은 유지할 수 있습니다.
