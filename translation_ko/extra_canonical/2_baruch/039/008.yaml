  to: '그리고 그것이 드러날 때에, 그것은 자기 무리의 많은 이들을 뿌리째 뽑을 것입니다. 네가 본 그 숲에서 남아 있던 키 큰 백향목과, 네가 들은 그와 나눈 포도나무의 말—그 뜻은 이렇습니다:'
