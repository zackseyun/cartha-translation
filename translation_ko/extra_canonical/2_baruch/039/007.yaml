  source_fidelity: 시리아어 본문은 그 왕국의 '완성/종말의 때'가 가까워져 그것이 무너지게 될 때를 말한 뒤, '내 메시아의 시작'(ܪܝܫܝܬܗ ܕܡܫܝܚܝ)이 드러난다고 합니다. 초안은 이를 '내 메시아의 통치'로 바꾸고, 샘과 포도나무의 비유를 앞선 왕국에 연결하여 본문의 지시 대상을 바꾸었습니다.
  naturalness: 초안의 '그 나라가 완성될 때가 가까워지면 그 나라가 무너질 그 때에'는 시간 표현이 중복되어 다소 부자연스럽습니다. 수정문은 원문의 복합 시간절을 현대 한국어로 명료하게 옮겼습니다.
  terminology: '''메시아''는 원문의 핵심 용어를 적절히 보존합니다. 다만 ''통치''는 원문에 없는 해석이므로 ''시작''으로 번역해야 합니다.'
