  revised_text: '먼저, 장차 일어날 일을 아십시오.[a] 바빌론 왕 느부갓네살이 그것을 마음에 품었습니다…. 그러나 우리는 당신의 입에서 나온 어떤 명령도 헛되이 나가지 않으며, 당신께서 미리 명하신 것과 다르게 되는 일도 없음을 알고 있었습니다. 미리 정해진 일이 공개적으로 드러났기 때문입니다. 또 그 성을 대적하여 천사들이 활동하고 있다는 것이 나에게도 계시되었습니다. 그들은 성벽을 흔들고 뽑아냈으며, 견고한 철 모퉁이가 있는 큰 성벽도 무너뜨렸습니다. 그러나 그때 그들은 거룩한 기물들을 숨겨 원수들의 눈에 보이지 않게 하였습니다.[b]


    그들이 이 일을 마치자, 원수들에게 부서진 성벽과 약탈당한 집과 불탄 성전과, 정복당하여 끌려가고 있던 백성을 넘겨주었습니다. 이는 원수들이 자랑하며 이렇게 말하지 못하게 하려는 것이었습니다. “우리가 지극히 높으신 분의 집까지 에워쌌고, 전투에서 그것을 무너뜨렸다.”


    그들은 또한 여러분의 형제들을 묶어 바빌론으로 끌고 갔고, 거기에서 살게 하였습니다. 그러나 우리와 우리 자손은 여기 남겨졌으니, 수가 적고 보잘것없습니다. 이것이 내가 여러분에게 쓴 그 백성의 환난입니다. 여러분은 시온의 굴욕이 여러분을 무겁게 짓눌렀다는 것을 분명히 아십니다. 여러분이 그곳에서 섬긴 이들이었고 우리는 돕는 이들이었기 때문에, 시온에 관한 여러분의 지식이 백성의 지식보다 더 컸기 때문입니다.'
