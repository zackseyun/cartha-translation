base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/080/001.yaml
  text: 'Knowing first what was to happen, that Nebuchadnezzar king of Babylon set it in his heart... But we knew that no command from his mouth would go forth in vain, nor otherwise than he had appointed beforehand. For what had been determined beforehand was shown openly. And it was also revealed to me that angels were engaged against the city: they shook its walls and uprooted them, and the mighty wall with its strong iron corners they cast down. But at that time they hid the holy vessels, so that they might not be seen by the enemies.


    And when they had done these things, then they handed over to the enemies the broken wall, the plundered house, the burned temple, and the people who had been overcome and were being carried away, so that the enemies might not boast and say, ‘We have surrounded even the house of the Most High, and in battle we have thrown it down.’


    They also bound your brothers and led them away to Babylon, and there they made them dwell. But we and our seed were left here, few and small. This is the affliction of the people about which I wrote to you. For you surely know that the humiliation of Zion has weighed heavily upon you, because your knowledge of her was greater than that of the people, since you were those who served there, while we were helping.'
  footnotes:
  - marker: a
    text: Or 'Now, my brothers, learn first what was to happen. Nebuchadnezzar king of Babylon had set it in his heart to come up against the city.'.
    reason: previous_rendering
translation:
  language: ko
  text: '먼저 장차 일어날 일을 아셨습니다. 바빌론 왕 느부갓네살이 그것을 자기 마음에 품었습니다… 그러나 우리는 그의 입에서 나온 어떤 명령도 헛되이 나오지 않을 것과, 그가 미리 정해 둔 것과 다르게는 되지 않을 것을 알았습니다. 미리 정해진 것이 공개적으로 드러났기 때문입니다. 또 그 성에 대하여 천사들이 맞서 움직이고 있다는 것이 나에게도 계시되었습니다. 그들이 성벽을 흔들어 무너뜨리고, 튼튼한 철 모퉁이가 있는 큰 성벽도 허물어 버렸습니다. 그러나 그때 그들은 거룩한 기물들을 숨겨서 원수들의 눈에 보이지 않게 하였습니다.


    그들이 이 일을 마치자, 원수들에게 부서진 성벽과 약탈당한 집과 불탄 성전과 — 정복당하여 끌려가고 있던 — 백성을 넘겨주었습니다. 그리하여 원수들이 자랑하며 말하지 못하게 하려는 것이었습니다. “우리가 지극히 높으신 분의 집까지 에워쌌고, 전투에서 그것을 무너뜨렸다.”


    그들은 또한 당신의 형제들을 묶어 바빌론으로 끌고 갔고, 거기에서 그들이 살게 하였습니다. 그러나 우리와 우리 자손은 여기 남겨졌으니, 수가 적고 보잘것없습니다. 이것이 제가 당신에게 쓴 그 백성의 환난입니다. 당신은 시온의 수치가 자신에게 얼마나 무겁게 다가왔는지 분명히 아십니다. 왜냐하면 당신은 거기에서 섬겼고, 우리는 도왔기 때문에 그분에 대한 당신의 지식이 백성보다 더 컸기 때문입니다.[a]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܠܐܟ̈ܐ
  english_pob_choice: angels
  chosen_korean: 천사들
  alternatives_korean:
  - 사자들
  - 메신저들
  lexicon: Payne Smith
  rationale: 이 문맥에서는 성의 붕괴를 주도하는 존재가 인간 사자가 아니라 초월적 존재이므로, ‘천사들’이 사역적·신학적 힘을 가장 잘 보존합니다.
- source_word: ܫܘܪ̈ܝܗ̇ / ܫܘܪܝܐ
  english_pob_choice: its walls … the mighty wall
  chosen_korean: 성벽 … 큰 성벽
  alternatives_korean:
  - 방벽
  - 요새벽
  lexicon: Payne Smith
  rationale: 시의 진행이 성의 방어 구조를 파괴하는 장면이므로 기본값은 ‘성벽’으로 두되, 뒤의 강한 표현은 ‘큰 성벽’으로 살렸습니다.
- source_word: ܐܫܠܡܘ
  english_pob_choice: they handed over
  chosen_korean: 넘겨주었습니다
  alternatives_korean:
  - 내주었습니다
  - 양도했습니다
  lexicon: Payne Smith
  rationale: ‘상대의 권한 아래로 넘김’이라는 뉘앙스를 살리면서, 서술체 한국어에서 자연스러운 표현을 택했습니다.
- source_word: ܚܘܪܐ
  english_pob_choice: the plundered house
  chosen_korean: 약탈당한 집
  alternatives_korean:
  - 벗겨진 집
  - 약탈된 집
  lexicon: Payne Smith
  rationale: 본문이 다소 손상되어 있지만, 성벽·성전과 병렬되는 파괴된 건물로 읽히므로 ‘약탈당한 집’이 문맥에 가장 잘 맞습니다.
- source_word: ܡܟܝܟ
  english_pob_choice: humiliation
  chosen_korean: 수치
  alternatives_korean:
  - 비천함
  - 낮아짐
  lexicon: Payne Smith
  rationale: 마지막 문단의 핵심은 시온이 공개적으로 낮아진 상태이므로, 감정과 사회적 체면을 함께 담는 ‘수치’를 선택했습니다.
theological_decisions:
- issue: 천사들의 역할을 얼마나 분명히 드러낼 것인가
  chosen_reading: 성의 파괴는 원수의 군사행동만이 아니라, 먼저 천사들의 작용 아래에서 이루어진 것으로 분명히 드러냅니다.
  alternative_readings:
  - 천사들은 상징적 표현일 뿐입니다.
  - 실제 파괴 주체는 바빌로니아 군대뿐입니다.
  rationale: 제공된 시리아어는 성의 붕괴를 천사들의 개입과 연결하므로, 그 신학적 구조를 흐리지 않고 본문 그대로 살렸습니다.
  doctrine_reference: 섭리와 심판의 매개적 천사론
- issue: 거룩한 기물들을 숨긴 이유
  chosen_reading: 원수들이 지극히 높으신 분의 것을 자기들 손으로 정복했다고 자랑하지 못하도록 숨긴 것으로 읽습니다.
  alternative_readings:
  - 단순한 전시 약탈 방지입니다.
  - 가치 있는 물품을 보호하려는 실용적 조치입니다.
  rationale: 앞뒤 문맥이 원수의 자랑을 막는 데 초점을 두므로, 보호 행위의 목적을 신학적으로 번역했습니다.
  doctrine_reference: 성전과 하나님의 영광 보호
