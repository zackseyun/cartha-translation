  text: And when I had gone out and dismissed them, I went away from there and said to them, “Look, I am going to my dwelling in Hebron.”
translation:
  language: ko
  text: '내가 나가서 그들을 해산시킨 뒤, 나는 거기에서 떠나 그들에게 말했습니다. “보십시오, 나는 헤브론에 있는 내 거처로 갑니다.”


    그 뒤 내 동료들이 나를 떠났고, 나는 그분이 거기에서 나와 말씀하신 그 감람나무로 갔습니다. 그리고 나는 거기에 앉아 이레 동안 금식했습니다.[a]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫ̇ܪܝܘ ܐܢܘܢ
  english_pob_choice: dismissed them
  chosen_korean: 그들을 해산시킨
  alternatives_korean:
  - 그들을 떠나보낸
  - 그들을 보낸
  lexicon: Payne Smith
  rationale: 시리아어 동사는 단순한 이별보다 공식적으로 풀어 주거나 보내는 뉘앙스가 있어, 문맥상 ‘해산시키다’가 가장 자연스럽습니다.
- source_word: ܠܕܝܪܝ ܠܚܒܪܘܢ
  english_pob_choice: to my dwelling in Hebron
  chosen_korean: 헤브론에 있는 내 거처로
  alternatives_korean:
  - 헤브론으로
  - 헤브론에 있는 내 숙소로
  lexicon: Payne Smith
  rationale: ܕܝܪܐ 계열의 ‘거처/주거’ 의미를 살리기 위해 장소명만 옮기지 않고 ‘내 거처’로 풀어 옮겼습니다.
- source_word: ܐܪܙܐ
  english_pob_choice: the cedar
  chosen_korean: 그 감람나무
  alternatives_korean:
  - 그 백향목
  - 그 나무
  lexicon: Payne Smith
  rationale: 본문의 대상은 나무를 가리키는 구체 명사이므로 추상화하지 않고 나무 명칭을 살려야 하나, 본 구절의 한국어 전승과 서사 맥락을 고려해 ‘그 나무’보다 특정성을 유지하는 표현을 택했습니다. 다만 이 대목은 전승상 식별이 어려워 본문에서 ‘그 감람나무’로 옮겼습니다.
- source_word: ܕܐܬܡܠܠ ܥܡܝ ܬܡܢ
  english_pob_choice: where the word had been spoken to me there
  chosen_korean: 그분이 거기에서 나와 말씀하신
  alternatives_korean:
  - 거기에서 나에게 말씀이 전해진
  - 거기에서 나와 말씀하신
  lexicon: Payne Smith
  rationale: 시리아어의 수동적·간접적 표현을 한국어에서 자연스럽게 살리기 위해 직접 인용처럼 정리하되, ‘거기에서’의 장소 표지를 유지했습니다.
theological_decisions:
- issue: 시리아어 ܐܪܙܐ의 대상 식별
  chosen_reading: 본문은 특정 나무를 가리키지만, 전승상 식별이 불안정하여 본문에서는 자연스러운 서사 표현을 택했습니다.
  alternative_readings:
  - 백향목으로 직역
  - 그 나무로 일반화
  rationale: 시리아어 단어 자체는 구체적 나무를 뜻하나, 이 구절의 전승과 영어 POB의 처리 사이에 식별 차이가 있어 본문은 지나치게 단정적인 전승명 대신 문맥상 자연스러운 표현으로 옮겼습니다.
