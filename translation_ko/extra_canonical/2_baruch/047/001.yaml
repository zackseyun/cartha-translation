  rationale: 원문과 영어 POB의 공통 증거에 따라 나무 이름을 ‘감람나무’에서 ‘백향목’으로 바로잡았습니다. 또한 원문에 명시되지 않은 선행사 없는 ‘그분’을 제거하여 번역이 불필요하게 주체를 특정하지 않도록 했습니다. 나머지 표현은 현대 한국어 합쇼체를 유지하면서 원문의 서사 흐름과 어휘적 세부를 보존했습니다.
