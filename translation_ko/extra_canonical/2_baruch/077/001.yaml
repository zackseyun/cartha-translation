  text: And I, Baruch, went from there and came to the people, and I gathered them from the great to the small. 2 And I said to them, “Hear, children of Israel. See how few of you are left from the twelve tribes of Israel. 3 Yet to you and to your fathers the Lord gave the law more than to all the nations. 4 And because your brothers transgressed the commandments of the Most High, he brought upon them what you have seen. 5 But you also, if you do not do what is right, as your brothers did, 6 the righteous one will judge his works, because he is the Mighty One whom you seek, and he is the Mighty One in whom you hope. 7 And he sees to preserve, not to forsake. 8 Have you not seen what happened to Zion? 9 Or do you think that the place sinned, and for this it was overthrown? Or that the land did some wrong, and for this it was handed over? 10 And do you not know that because of you those things that did not sin were destroyed, and because of what you did, that which did no wrong was delivered
    up? 11 And all the people answered and said to me, “Because we remember the good testimonies that the Mighty One did with you, 12 as we have seen, and also those that we have not seen, the Anointed One will come. 13 But now, ask on our behalf from above, and write also to our brothers in Babylon a letter of instruction and a writing of hope, 14 that you may show them also that which has not departed from you. 15 For the counsels of Israel have perished, and the lamps that gave light are extinguished, and the springs from which we used to drink have ceased. 16 And we are left in darkness, and in the thicket of the forest, and in the thirst of the wilderness.”
  footnotes:
  - marker: a
    text: Or 'he is the Anointed One.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나는 바룩이 거기서 떠나 백성에게 와서, 큰 자부터 작은 자까지 그들을 모았습니다. 그리고 나는 그들에게 말했습니다. 「이스라엘 자손들아, 들으십시오. 이스라엘의 열두 지파에서 얼마나 적게 남았는지 보십시오. 주님께서는 너희와 너희 조상들에게 모든 민족보다 더 율법을 주셨습니다. 지극히 높으신 이의 명령을 너희 형제들이 어겼기 때문에, 그분은 너희가 본 일을 그들에게 가져오셨습니다. 그러나 너희도, 형제들이 한 것처럼 옳은 일을 하지 않으면, 의로운 분이 그분의 행위를 심판하실 것입니다. 그분은 너희가 찾는 그분이시며, 너희가 희망을 두는 그분이시기 때문입니다. 그분은 버리기보다 보존하시는 것을 보십니다. 너희는 시온에 일어난 일을 보지 못했습니까? 혹은 그곳이 죄를 지었기 때문에 무너졌다고 생각합니까? 또는 그 땅이 어떤 잘못을 저질렀기 때문에 넘겨졌다고 생각합니까? 너희가 죄를 지었기 때문에 죄짓지 않은 것이 무너졌고, 너희가 악을 행했기 때문에 아무 잘못도 없는 것이 넘겨졌다는 것을 알지 못합니까?」[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܡܘܣܐ
  english_pob_choice: the law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 가르침
  lexicon: Payne Smith
  rationale: 바울계 전통어인 율법이 여기서는 언약적 권위와 규범성을 가장 직접적으로 살리며, 단순한 ‘법’이나 약한 ‘가르침’보다 원문의 무게를 잘 보존합니다.
- source_word: ܡܪܝܐ
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 하나님
  lexicon: 표준 성서 한국어 용례
  rationale: 문맥상 야훼를 가리키는 주어로서, 본문이 전하는 권위와 친밀성을 함께 살릴 수 있는 자연스러운 합쇼체 표현을 택했습니다.
- source_word: ܡܪܝܡܐ
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 이
  alternatives_korean:
  - 가장 높으신 분
  - 지존자
  lexicon: Payne Smith
  rationale: 추상명사보다 인격적 호칭을 살려, apocalyptic 문맥의 고양된 신칭을 한국어에서 자연스럽게 옮겼습니다.
- source_word: ܙܕܝܩ
  english_pob_choice: the righteous one
  chosen_korean: 의로운 분
  alternatives_korean:
  - 의인
  - 의로우신 이
  lexicon: Payne Smith
  rationale: 심판의 주체로서 신적 인격을 드러내기 위해 ‘의로운 분’을 택했고, 단순 명사형 ‘의인’보다 문맥 적합성이 높습니다.
- source_word: ܪ̈ܥܘܬܐ
  english_pob_choice: counsels
  chosen_korean: 지략
  alternatives_korean:
  - 조언
  - 목자들
  lexicon: Payne Smith + Kmosko control reading
  rationale: 통제 본문에서 ‘목자들’이 아니라 ‘생각/지략’ 계열을 지지하므로, 이 절의 삼중구조(지략/등불/샘)에 맞게 추상 명사로 옮겼습니다.
theological_decisions:
- issue: 시온과 땅의 책임 소재
  chosen_reading: 무너짐의 원인은 시온이나 땅의 죄가 아니라 백성의 죄입니다.
  alternative_readings:
  - 장소 자체도 어떤 방식으로든 공동 책임을 진다는 읽기
  rationale: 본문의 수사학적 질문은 거룩한 장소와 땅을 변호하고, 책임을 사람들의 죄로 돌립니다.
  doctrine_reference: 성전/거룩한 땅의 무죄성에 대한 본문 내 논리
- issue: ‘의로운 분’의 행위 판단
  chosen_reading: 의로운 분이 각 행위를 심판하신다고 옮겼습니다.
  alternative_readings:
  - ‘그분의 일’을 더 일반적으로 ‘행위’가 아니라 ‘일들’로 옮기는 읽기
  rationale: 문맥상 심판 대상은 사람의 행위이며, 원문의 단수 표현도 한국어에서는 자연스럽게 집약하는 것이 적합합니다.
  doctrine_reference: 공의로운 심판 주제
