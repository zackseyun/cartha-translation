  - 셈
  lexicon: Payne Smith
  rationale: ‘많은 해/적은 해’를 하나님 앞에서 따지는 관념이므로, 산술적이면서도 판단적 뉘앙스를 가진 ‘계산’이 적절합니다.
- source_word: ܡܘܬܪܐ
  english_pob_choice: profit / benefit
  chosen_korean: 유익
  alternatives_korean:
  - 이익
  - 도움
  lexicon: Payne Smith
  rationale: 아담의 긴 생애가 아무런 가치도 없었다는 수사적 질문이므로, 상업적 뉘앙스가 너무 강한 ‘이익’보다 문맥상 더 넓은 ‘유익’을 택했습니다.
- source_word: ܢܣܘܒܘܬ ܒܪܢܫܐ ܕܒܣܘܪ
  english_pob_choice: the people of Israel
  chosen_korean: 이스라엘 백성
  alternatives_korean:
  - 이스라엘의 후손
  - 이스라엘 사람들
  lexicon: Payne Smith
  rationale: 문맥이 집단적·민족적 대상이므로 자연스러운 공동체 표현인 ‘이스라엘 백성’으로 옮겼습니다.
theological_decisions:
- issue: 지극히 높으신 분 앞에서의 시간 평가
  chosen_reading: 하나님 앞에서는 장수 자체가 공로도 손실도 아니며, 순종 여부가 핵심이라는 논지를 드러내도록 번역했습니다.
  alternative_readings:
  - 단순히 아담과 모세의 생애 길이를 비교하는 진술로만 읽을 수 있습니다.
  rationale: 본문은 아담과 모세를 대비시키지만, 아담의 불순종과 모세의 율법 전달을 연결해 시간의 가치가 순종에 달려 있음을 주장합니다.
  doctrine_reference: 창 3장; 신 34장; 바룩서의 지혜-교훈적 문맥
