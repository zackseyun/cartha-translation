  text: And the Lord answered and said to me, “With the Most High there is no reckoning of many years or few years. For what did it profit Adam that he lived nine hundred and thirty years, yet transgressed what had been commanded him? So the multitude of time that he lived did not benefit him, but brought death and cut short the years of those born from him. And what did Moses lack because he lived only one hundred and twenty years? Because he was subject to the one who formed him, he brought the law near to the offspring of Jacob and kindled a lamp for the people of Israel.”
  footnotes:
  - marker: a
    text: Or 'And the Lord said to me'.
    reason: previous_rendering
translation:
  language: ko
  text: 주님께서 대답하여 말씀하셨습니다. “지극히 높으신 분께는 많은 해와 적은 해를 따지는 계산이 없습니다. 아담이 그에게 명령된 것을 어겼으면서도 구백삼십 년을 산 것이 무슨 유익이 있었겠습니까? 그러므로 그가 산 긴 세월은 그에게 유익이 되지 못하고, 오히려 죽음을 가져와 그에게서 난 이들의 해를 단축시켰습니다. 모세가 단지 백이십 년을 산 것이 그에게 무엇이 부족하다는 뜻이겠습니까? 그는 자신을 지으신 이에게 속한 사람이었기에, 야곱의 자손에게 율법을 가까이 가져왔고 이스라엘 백성에게 등불을 밝혔습니다.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܢܐ ... ܘܐܡܪ
  english_pob_choice: answered and said
  chosen_korean: 대답하여 말씀하셨습니다
  alternatives_korean:
  - 말씀하셨습니다
  - 대답하셨습니다
  lexicon: Payne Smith
  rationale: 서두의 이중 동사를 자연스러운 한국어로 옮기되, 단순 발화가 아니라 응답의 성격을 살리기 위해 ‘대답하여 말씀하셨습니다’로 처리했습니다.
- source_word: ܡܢܝܗܝ
  english_pob_choice: reckoning
  chosen_korean: 계산
  alternatives_korean:
