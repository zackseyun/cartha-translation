  yaml_path: translation/extra_canonical/2_baruch/017/001.yaml
  text: And the Lord answered and said to me, “With the Most High there is no reckoning of many years or few years. For what did it profit Adam that he lived nine hundred and thirty years, yet transgressed what had been commanded him? So the multitude of time that he lived did not benefit him, but brought death and cut short the years of those born from him. And what did Moses lack because he lived only one hundred and twenty years? Because he was subject to the one who formed him, he brought the law near to the offspring of Jacob and kindled a lamp for the people of Israel.”
  footnotes:
  - marker: a
    text: Or 'And the Lord said to me'.
    reason: previous_rendering
translation:
  language: ko
  text: 주님께서 대답하여 말씀하셨습니다. “지극히 높으신 분께서는 많은 해나 적은 해를 헤아리지 않으십니다. 아담은 자신에게 명령된 것을 어겼는데도 구백삼십 년을 살았습니다. 그것이 그에게 무슨 유익이 있었겠습니까? 그러므로 그가 산 긴 세월은 그에게 유익이 되지 못하고, 오히려 죽음을 가져와 그에게서 태어난 이들의 수명을 단축시켰습니다. 모세가 겨우 백이십 년을 살았다고 해서 무엇이 부족했겠습니까? 그는 자기를 지으신 분께 복종했기 때문에 야곱의 자손에게 율법을 가까이 가져왔고, 이스라엘 백성을 위해 등불을 밝혔습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “주님께서 내게 말씀하셨습니다.”
    reason: 일부 번역 전통은 서두의 ‘대답하여’를 생략합니다.
lexical_decisions:
- source_word: ܥܢܐ ... ܘܐܡܪ
  english_pob_choice: answered and said
  chosen_korean: 대답하여 말씀하셨습니다
  alternatives_korean:
  - 말씀하셨습니다
  - 대답하셨습니다
  lexicon: Payne Smith
  rationale: 서두의 이중 동사를 자연스러운 한국어로 옮기되, 단순 발화가 아니라 응답의 성격을 살리기 위해 ‘대답하여 말씀하셨습니다’로 처리했습니다.
- source_word: ܡܢܝܗܝ
  english_pob_choice: reckoning
  chosen_korean: 계산
  alternatives_korean:
  - 헤아림
  - 셈
  lexicon: Payne Smith
  rationale: ‘많은 해/적은 해’를 하나님 앞에서 따지는 관념이므로, 산술적이면서도 판단적 뉘앙스를 가진 ‘계산’이 적절합니다.
- source_word: ܡܘܬܪܐ
  english_pob_choice: profit / benefit
  chosen_korean: 유익
  alternatives_korean:
  - 이익
  - 도움
  lexicon: Payne Smith
  rationale: 아담의 긴 생애가 아무런 가치도 없었다는 수사적 질문이므로, 상업적 뉘앙스가 너무 강한 ‘이익’보다 문맥상 더 넓은 ‘유익’을 택했습니다.
- source_word: ܢܣܘܒܘܬ ܒܪܢܫܐ ܕܒܣܘܪ
  english_pob_choice: the people of Israel
  chosen_korean: 이스라엘 백성
  alternatives_korean:
  - 이스라엘의 후손
  - 이스라엘 사람들
  lexicon: Payne Smith
  rationale: 문맥이 집단적·민족적 대상이므로 자연스러운 공동체 표현인 ‘이스라엘 백성’으로 옮겼습니다.
theological_decisions:
- issue: 지극히 높으신 분 앞에서의 시간 평가
  chosen_reading: 하나님 앞에서는 장수 자체가 공로도 손실도 아니며, 순종 여부가 핵심이라는 논지를 드러내도록 번역했습니다.
  alternative_readings:
  - 단순히 아담과 모세의 생애 길이를 비교하는 진술로만 읽을 수 있습니다.
  rationale: 본문은 아담과 모세를 대비시키지만, 아담의 불순종과 모세의 율법 전달을 연결해 시간의 가치가 순종에 달려 있음을 주장합니다.
  doctrine_reference: 창 3장; 신 34장; 바룩서의 지혜-교훈적 문맥
