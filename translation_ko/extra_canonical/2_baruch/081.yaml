base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/081.yaml
  text: 'But also hear a word concerning consolation[a]. For I was mourning over Zion, and I sought mercy from the Most High, and I said, “Will these things remain for us until the end? And will these afflictions come upon us at every time?” And the Mighty One acted according to the abundance of his mercies, and he spared according to the greatness of his grace. And he revealed a word to me, that I might be strengthened, and he gave me visions, that I might not again be shaken; and he made known to me the mysteries of the times, and showed me the coming of the ages.


    Therefore, my brothers, I have written to you so that you may be comforted because of the multitude of your tribulations. For know that our Maker will require vengeance from all our enemies for all the evil things they have done against us, and that the consummation which the Most High has prepared is near, and his mercy is coming, and the completion of his judgment is not far away.


    For now we see the abundance of the prosperity of the nations while they act wickedly, but they will be reckoned like a drop. And we look at the strength of their power, but it will be accounted as spittle. We think on the glory of their greatness, while they do not keep the commandments of the Mighty One, but have treated them with contempt. And we think on the beauty that is seen, though it is shaken in afflictions, and they will be sought out like flesh in pain. And we reckon only the confidence in which they trust, though it is shaken before our eyes; but they will be crushed like a wave. And we seek only the hope of their strength, when it flourishes in the good things that God gave them; but it will be laid away[d][c][b], and lamentation will overtake it.'
  footnotes:
  - marker: a
    text: The opening clause on Ceriani p. 171 is OCR-rough. Kmosko’s control witness supports the sense, ‘But also hear a word concerning consolation.’
    reason: textual_variant
  - marker: b
    text: The final comparison sequence on Ceriani p. 172 (roughly lines 42–55) is textually unstable in this bucket. The rendering stays intentionally close to the Syriac sense, but later control-witness review may refine the wording.
    reason: textual_variant
  - marker: c
    text: A visible ‘83’ marker appears immediately after this section on Ceriani p. 172, suggesting a nearby chapter boundary; this bucket’s edge may still need later verification.
    reason: alternative_reading
  - marker: d
    text: Or 'but they will be reckoned like spittle. And we look at the strength of their power, but it will be accounted as nothing.'.
    reason: previous_rendering
translation:
  language: ko
  text: '그러므로 내 형제들아, 너희가 많은 환난으로 말미암아 위로를 받도록 나는 너희에게 이 말을 써 보냅니다. 우리를 지으신 이가 우리의 모든 원수에게, 그들이 우리에게 행한 모든 악에 대해 보복을 요구하실 것이며, 지극히 높으신 이가 예비하신 끝이 가까이 왔고 그의 긍휼이 오고 있으며, 그의 심판의 완성도 멀지 않다는 것을 알기 때문입니다.


    지금 우리는 악을 행하는 민족들의 풍성한 번영을 보지만, 그들은 물방울처럼 여겨질 것입니다. 우리는 그들의 권세의 힘을 바라보지만, 그것은 침처럼 간주될 것입니다. 우리는 그들의 위대함의 영광을 생각하지만, 그들은 전능하신 이의 명령을 지키지 않고 오히려 그것을 멸시하였으므로, 고통받는 살처럼 찾아질 것입니다. 우리는 그들이 신뢰하는 확신만을 헤아리지만, 그것은 우리 눈앞에서 흔들릴 것이며, 결국 그들은 파도처럼 꺾일 것입니다. 그리고 우리는 하나님께서 그들에게 주신 좋은 것들 속에서 피어나던 그들의 힘의 희망만을 찾지만, 그것은 치워질 것이며 애통이 그것을 뒤따를 것입니다.[a][b][c][d]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܪܝܡܐ
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 이
  alternatives_korean:
  - 가장 높으신 분
  - 지존자
  lexicon: Payne Smith
  rationale: 아포칼립스적 신칭을 한국어로 자연스럽게 옮기되, 존칭을 유지하면서도 초월성을 드러내기 위해 ‘지극히 높으신 이’를 택했습니다.
- source_word: ܚܝܠܬܐ
  english_pob_choice: the Mighty One
  chosen_korean: 전능하신 이
  alternatives_korean:
  - 능하신 이
  - 강하신 이
  lexicon: Payne Smith
  rationale: 문맥상 하나님을 가리키는 힘의 칭호이므로, 한국어 독자에게 가장 분명한 신칭인 ‘전능하신 이’로 옮겼습니다.
- source_word: ܪ̈ܚܡܘܗܝ / ܚܢܢܗ
  english_pob_choice: his mercies / his grace
  chosen_korean: 긍휼 / 은혜
  alternatives_korean:
  - 자비 / 호의
  - 측은히 여기심 / 은총
  lexicon: Payne Smith
  rationale: 서로 구별되는 두 항을 살려, 반복되는 자비의 의미는 ‘긍휼’로, 베푸시는 호의는 ‘은혜’로 구분했습니다.
- source_word: ܢܘܛܦܬܐ
  english_pob_choice: reckoned like a drop
  chosen_korean: 물방울처럼 여겨질 것입니다
  alternatives_korean:
  - 한 방울처럼 계산될 것입니다
  - 이슬방울처럼 셈해질 것입니다
  lexicon: Payne Smith
  rationale: 시리아어의 비하적 소멸 이미지를 살리면서, 한국어에서 자연스러운 비교 표현으로 옮겼습니다.
- source_word: ܪܘܩܐ
  english_pob_choice: spittle
  chosen_korean: 침처럼 간주될 것입니다
  alternatives_korean:
  - 타액처럼 여겨질 것입니다
  - 침방울처럼 셈해질 것입니다
  lexicon: Payne Smith
  rationale: 이사야 40:15 계열의 모욕적 비교를 약화시키지 않기 위해 직설적인 ‘침’ 이미지를 유지했습니다.
theological_decisions:
- issue: 보복/심판의 성격
  chosen_reading: 보복을 요구하실 것이며
  alternative_readings:
  - 원수를 갚으실 것이며
  - 공의를 집행하실 것이며
  rationale: 본문은 사적인 복수보다 하나님이 악행에 대해 책임을 물으시는 사법적 응답을 말하므로, 강한 종말론적 어조를 살리면서도 ‘요구하실’로 옮겼습니다.
  doctrine_reference: 신적 심판과 보응
- issue: '''끝/완성''의 종말론적 표현'
  chosen_reading: 예비하신 끝
  alternative_readings:
  - 예비하신 종말
  - 예비하신 완성
  rationale: 문맥이 단순한 시간의 종료가 아니라 종말론적 결말을 가리키지만, 한국어 본문에서는 과도하게 해설적으로 만들지 않기 위해 ‘끝’으로 두고, 뒤의 ‘심판의 완성’으로 의미를 보강했습니다.
  doctrine_reference: 종말론
