  yaml_path: translation/extra_canonical/2_baruch/040/001.yaml
  text: The last ruler of that time will be left alive, when the multitude of his hosts has been struck down by the sword; and he will be bound, and they will bring him up to Mount Zion. And my Messiah will convict him of all his impieties, and will set before him all the wicked deeds of his hosts.
translation:
  language: ko
  text: 그 시대의 마지막 통치자는 그의 군대의 무리가 칼에 맞아 쓰러진 뒤에도 살아 남아 있을 것이며, 그는 결박되어 그들이 그를 시온 산으로 끌어올릴 것입니다. 그리고 내 메시아가 그의 모든 불경함을 그에게 드러내어 책망하고, 그의 군대가 행한 모든 악한 행위를 그 앞에 놓을 것입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܪܝܫܝܬܗ / the last ruler
  english_pob_choice: The last ruler of that time
  chosen_korean: 그 시대의 마지막 통치자
  alternatives_korean:
  - 그때의 마지막 지배자
  - 마지막 군주
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 시리아어의 종말론적 ‘마지막 통치자’라는 시간 표지를 살리되, 한국어에서는 정치적·서사적 맥락이 드러나는 ‘통치자’가 가장 자연스럽습니다.
- source_word: ܒܝܫܘܬܗ
  english_pob_choice: impieties
  chosen_korean: 불경함
  alternatives_korean:
  - 악행
  - 경건치 않음
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 단순한 도덕적 악보다 하나님을 향한 불경과 불경건의 뉘앙스가 강하므로, ‘불경함’이 POB의 구분을 가장 잘 반영합니다.
- source_word: ܨܗܝܘܢ
  english_pob_choice: Mount Zion
  chosen_korean: 시온 산
  alternatives_korean:
  - 시온의 산
  - 시온
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 고유지명으로서 관용적인 성서 한국어를 따르되, 지리적 장소성을 분명히 하기 위해 ‘산’을 유지했습니다.
- source_word: ܥܒ̈ܕܝܗܘܢ / the wicked deeds of his hosts
  english_pob_choice: the wicked deeds of his hosts
  chosen_korean: 그의 군대가 행한 모든 악한 행위
  alternatives_korean:
  - 그 군대의 악한 행위들
  - 그 부하들의 악한 일들
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 시리아어의 복수 행위와 집단적 책임을 살리기 위해 ‘군대’와 ‘행한 모든 악한 행위’를 함께 살렸습니다.
theological_decisions:
- issue: ‘my Messiah’의 칭호를 한국어에서 어떻게 드러낼지
  chosen_reading: ‘내 메시아’로 직접 옮겨, 화자가 소유격으로 지칭하는 개인적이고 종말론적인 메시아를 분명히 했습니다.
  alternative_readings:
  - ‘내 그리스도’
  - ‘내 기름부음 받은 이’
  rationale: POB의 기본 용례와 본문의 직접성을 따라, 교회적 전통어보다 원문이 드러내는 칭호를 우선했습니다.
  doctrine_reference: DOCTRINE.md translation philosophy §3
- issue: 결박과 인도, 책망과 진술의 연속을 어떻게 처리할지
  chosen_reading: 한 문장 안에서 결박-이송-책망-진술의 순서를 유지해 재판적 장면을 분명히 했습니다.
  alternative_readings:
  - 두 문장으로 분리
  - ‘정죄하다’로 축약
  rationale: 원문은 심판 장면의 진행을 단계적으로 보여 주므로, 서술의 긴장을 유지하는 편이 더 원문에 가깝습니다.
  doctrine_reference: DOCTRINE.md translation philosophy §3
