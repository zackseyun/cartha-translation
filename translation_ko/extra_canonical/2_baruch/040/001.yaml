revisions:
- from: 그 시대의 마지막 통치자는 그의 군대의 무리가 칼에 맞아 쓰러진 뒤에도 살아 남아 있을 것이며, 그는 결박되어 그들이 그를 시온 산으로 끌어올릴 것입니다. 그리고 내 메시아가 그의 모든 불경함을 그에게 드러내어 책망하고, 그의 군대가 행한 모든 악한 행위를 그 앞에 놓을 것입니다.[a][b]
  to: 그 시대의 마지막 통치자는 그의 군대의 무리가 칼에 쓰러진 뒤에도 살아남아 있을 것이며, 그는 결박되어 그들이 그를 시온 산으로 데리고 올라갈 것입니다. 그리고 내 메시아가 그의 모든 불경함 때문에 그를 책망하고, 그의 군대가 저지른 모든 악행을 그의 앞에 제시할 것입니다.
  rationale: ‘불경함을 그에게 드러내어 책망하다’를 ‘그의 모든 불경함 때문에 그를 책망하다’로 고쳐 심판의 대상과 사유를 분명히 했습니다. 또한 불필요하고 내용이 제공되지 않은 각주 표지를 삭제했습니다. 그 밖의 시간적·재판적 전개와 메시아 칭호는 유지했습니다.
