  text: '1 And I went away from there and sat in the valley of Kidron[a], in a cave of the earth. And I sanctified my soul there. I ate no bread, yet I was not hungry; and I drank no water, yet I was not thirsty. And I remained there until the seventh day, as he had commanded me.

    2 And afterward I came to the place where he had spoken with me.

    3 And I said from there:

    4 “Woe to my heart, for it is cut open at the spring of grief, and tears flow from my eyes there, and I am not satisfied with weeping.

    5 My tears do not cease, and sleep does not come to me there, as you commanded me.

    6 And I came to the place where you spoke with me there, and I sat in the cave of the earth.

    7 You know the number of sinful men, he whose words are full of wrath.

    8 And the hosts of heaven know by the Spirit.

    9 You call from the beginning of the world those things that do not yet exist, and they listen to you.

    10 You command the lightning by your signal, and you have seen the things that are to come, like the things that you do.

    11 In great reckoning you remember before yourself the offenses of those before you.

    12 Even the former offenses that have passed away are not distant from you, with all their possessors and their remembrance.

    13 Those that stand near one another are yours, remembered in their times.

    14 To you alone it belongs to search out the origin of the whole order.

    15 You do not speak rain and flood except concerning sinful man.

    16 The instruction of the times you alone know, without being shaken.

    17 Look, for you alone are able to bear the petition of those before you, and of those who have passed, and of those who are to come,

    18 of those who live, and of those who are as nothing. For life that is not gladdened is no life.

    19 The one who lives while his life endures is not gladdened. And I considered the sons of men, and I saw that they are not many; and others were the vanity of Adam.

    20 And I saw that because of one man those who live came to be, and also the dwelling of those who are to come.

    21 For if only this life had been given to the sons of men, nothing would be more bitter than this.

    22 For what is seen in them? Or what visible hope is there? Or what visible dwelling is not vanity?

    23 For in his kingdom the death of the sons of men is seen. And what is there that truly is, whose end is not known?

    24 And how was it revealed, if afterward they do not understand?

    25 If there were not in them that which was laid up for the world, they would be comforted by their hope.

    26 But because the earth was created from dust, whatever passes departs from it to its own place.

    27 And what is preserved remains for what is made new.

    28 And what is preserved for its times continues.

    29 And because the world was created for time, and they are sustained in it with much[b], command concerning evil,

    30 so that it may not again appear that man’s ruin as if he had not been created.

    31 The multitude of the world is the spirit of man, yet they do not know what belongs to it.

    32 They see what exists, but not what is to be.

    33 [Have regard to] the love of your name before you, above all.

    34 Therefore from now on show your greatness, and do not overlook what is brought to nothing under the kingdom of death.

    35 Let your glory be seen, and let the greatness of your goodness be known.

    36 Let Sheol be stirred up, so that from now on it may not hold the dead.

    37 And let the treasuries of the souls that are shut up in them restore them to the sons of men, as you commanded from of old, and let them be gathered in the assembly.

    38 And let it be known to those who are with them, who are like them, that this is the time.

    39 Bring near those who are sought, and let what began in toil rejoice in the arrival of your glory.

    40 And let nothing boast that reigns[g][f][e][d][c], that has become king and grown proud through the pride of man.”'
  footnotes:
  - marker: a
    text: The opening of chapter 21 is textually awkward in the Ceriani bucket because the chapter boundary overlaps with adjacent pages and the transition line is partially damaged. The opening sentence follows Ceriani where legible, with Kmosko page 560 used as a control witness for the Kidron/Cedron setting and fasting notice.
    reason: textual_variant
  - marker: b
    text: Several clauses in the central prayer section remain difficult because the Ceriani substrate for this bucket is medium-confidence at the chapter edge. The English keeps the imagery as literally as possible and avoids forcing false precision where the Syriac is rough.
    reason: alternative_reading
  - marker: c
    text: Or 'storehouses of the souls.' The Syriac image is of souls kept in guarded repositories until the appointed time.
    reason: lexical_alternative
  - marker: d
    text: Or 'and I saw not a few'.
    reason: previous_rendering
  - marker: e
    text: Or 'and there were nothing more bitter than this, there would be nothing more grievous'.
    reason: previous_rendering
  - marker: f
    text: Or 'was something created for nothing'.
    reason: previous_rendering
  - marker: g
    text: Or 'become glorious in your stillness'.
    reason: previous_rendering
translation:
  language: ko
  text: '1 나는 그곳에서 떠나 기드론 골짜기, 곧 땅의 한 동굴에 앉았습니다. 나는 거기서 내 영혼을 거룩하게 하였고, 빵을 먹지 않았으나 배고프지 않았으며, 물을 마시지 않았으나 목마르지 않았습니다. 그리고 그가 내게 명령한 대로, 일곱째 날까지 거기에 머물렀습니다.


    2 그 뒤에 나는 그가 나와 함께 말씀하신 곳으로 갔습니다.


    3 그리고 나는 거기서 말했습니다:


    4 “슬프도다, 내 마음이여. 슬픔의 샘에서 찢겨 열렸고, 거기서 내 눈에서 눈물이 흘러나오며, 나는 울음으로도 만족하지 못합니다.


    5 내 눈물은 그치지 않고, 잠도 그곳에 내게 오지 않습니다. 당신께서 내게 명령하신 대로입니다.


    6 나는 당신께서 나와 말씀하신 그곳으로 가서, 땅의 동굴에 앉았습니다.


    7 당신은 죄인들의 수를 아십니다. 그분의 말은 진노로 가득합니다.


    8 하늘의 군대는 영으로 압니다.


    9 당신은 세상의 시작부터 아직 존재하지 않는 것들을 부르시고, 그것들이 당신께 듣습니다.


    10 당신은 당신의 신호로 번개를 명령하시며, 장차 올 일들을, 당신이 행하시는 일들과 같이 보셨습니다.


    11 큰 셈으로 당신 앞에서 당신 이전의 사람들의 잘못을 기억하십니다.


    12 이미 지나간 옛 잘못들도, 그것을 소유한 모든 이와 그 기억과 함께, 당신에게서 멀지 않습니다.


    13 서로 가까이 서 있는 것들도 당신의 것이며, 그들의 때에 따라 기억됩니다.


    14 모든 질서의 기원을 찾아내는 일은 오직 당신께만 속합니다.


    15 당신은 죄인 된 사람에 대해서만 비와 홍수를 말씀하십니다.


    16 당신만이 때들의 가르침을 흔들림 없이 아십니다.


    17 보십시오. 당신만이 당신 앞에 있는 자들, 지나간 자들, 그리고 장차 올 자들의 청원을 감당하실 수 있습니다.


    18 살아 있는 자들과 아무것도 아닌 자들의 청원도 그렇습니다. 기뻐하지 않는 삶은 삶이 아니기 때문입니다.


    19 살면서도 자기 생명이 지속되는 자는 기뻐하지 않습니다. 나는 사람의 아들들을 살펴보았고, 그들이 많지 않음을 보았습니다. 또 다른 이들은 아담의 허무였습니다.


    20 나는 한 사람 때문에 살아 있는 자들이 생겨났고, 또한 장차 올 자들의 거처도 있다는 것을 보았습니다.


    21 만일 이 생명만 사람의 아들들에게 주어졌다면, 이것보다 더 쓰라린 것은 없을 것입니다.


    22 그들 안에서 무엇이 보입니까? 혹은 보이는 소망이 무엇입니까? 혹은 보이는 거처 가운데 무엇이 허무가 아니겠습니까?


    23 그분의 나라에서 사람의 아들들의 죽음이 보입니다. 그런데 실제로 존재하면서도 끝이 알려지지 않은 것이 무엇이 있습니까?


    24 그리고 그 뒤에 그들이 이해하지 못한다면, 그것이 어떻게 드러났습니까?


    25 만일 그들 안에 세상을 위해 예비된 것이 없었다면, 그들은 자기 소망으로 위로를 받았을 것입니다.


    26 그러나 땅은 흙에서 지어졌으므로, 지나가는 것은 무엇이든 그 땅에서 자기 자리로 떠나갑니다.


    27 보존된 것은 새로워질 것을 위하여 남아 있습니다.


    28 그리고 그때를 위해 보존된 것은 계속됩니다.


    29 세상이 때를 위하여 지어졌고, 그들이 그 안에서 많은 것과 함께 유지되므로, 악에 대한 명령을 내리셔서


    30 사람이 창조되지 않은 것처럼 그의 파멸이 다시 나타나지 않게 하소서.


    31 세상의 충만함은 사람의 영이지만, 그들은 그것에 속한 것이 무엇인지 알지 못합니다.


    32 그들은 있는 것은 보지만, 장차 있을 것은 보지 못합니다.


    33 당신 이름의 사랑을 당신 앞에서, 무엇보다 기억해 주십시오.


    34 그러므로 이제 당신의 크심을 나타내시고, 죽음의 나라 아래서 아무것도 아닌 것으로 되도록 내버려 두지 마십시오.


    35 당신의 영광이 드러나게 하시고, 당신의 선하심의 위대함이 알려지게 하소서.


    36 스올이 흔들리게 하셔서, 이제부터는 죽은 자들을 붙들지 못하게 하소서.


    37 그리고 그 안에 갇힌 영혼들의 저장고가, 당신께서 옛부터 명령하신 대로, 그것들을 사람의 아들들에게 돌려보내게 하시고, 그것들이 회중 가운데 모이게 하소서.


    38 또 그들과 함께 있는 이들, 그들과 같은 이들에게 이것이 그때임을 알게 하소서.


    39 찾는 이들을 가까이 불러오시고, 수고 가운데 시작된 것이 당신의 영광이 도래하는 때에 기뻐하게 하소서.


    40 그리고 인간의 교만으로 왕이 되어 권세를 잡고 오만해진 그 어떤 것도 자랑하지 못하게 하소서.”[a]'
