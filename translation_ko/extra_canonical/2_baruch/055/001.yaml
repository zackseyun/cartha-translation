theological_decisions:
- issue: “before you were created…before you came forth”의 의미
  chosen_reading: 예언자 소명 공식으로 과도하게 특정하지 않고, 화자가 하나님께 선재적으로 알려지고 맡겨진 존재였다는 진술로 직역했습니다.
  alternative_readings:
  - 예레미야 1:5의 직접적 반향
  - 단순한 문학적 과장
  rationale: 시리아어 문맥이 예언자적 소명을 연상시키지만, 본문 자체의 주장 이상을 덧씌우지 않는 것이 더 안전합니다.
  doctrine_reference: 신적 예지와 부르심
- issue: “not in the body, and I did not know it”의 비신체성
  chosen_reading: 몸으로의 이동이 아니라는 부연을 그대로 살려, 환시적 이동으로 읽히게 했습니다.
  alternative_readings:
  - 실제 육체적 승천
  - 단순한 꿈
  rationale: 본문이 직접 비신체성을 말하므로, 체험의 성격을 축소하거나 과장하지 않았습니다.
  doctrine_reference: 묵시 문학의 환시/들림 이해
