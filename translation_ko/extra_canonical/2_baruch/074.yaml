translation:
  language: ko
  text: 그날들에, 추수하는 이들은 지치지 않고, 짓는 이들은 수고하지 않을 것입니다. 그들의 일은 그것을 하는 이들과 함께 저절로 이루어질 것이며, 큰 평안 가운데 있을 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: the reapers
  english_pob_choice: the reapers
  chosen_korean: 추수하는 이들
  alternatives_korean:
  - 추수꾼들
  - 거두는 이들
  lexicon: Payne Smith
  rationale: 밭일의 구체적 이미지를 살리되, 한국어에서 가장 자연스러운 표준 표현으로 옮겼습니다.
- source_word: will not grow weary / will not toil
  english_pob_choice: will not grow weary ... will not toil
  chosen_korean: 지치지 않고 ... 수고하지 않을 것입니다
  alternatives_korean:
  - 피곤해하지 않고 ... 애쓰지 않을 것입니다
  - 지치지 않고 ... 일하지 않을 것입니다
  lexicon: Payne Smith
  rationale: 두 동사를 구분해 병렬 구조를 보존하고, 각각 신체적 피로와 노동의 수고를 드러내도록 했습니다.
- source_word: the works will be accomplished of themselves with those who do them
  english_pob_choice: the works will be accomplished of themselves with those who do them
  chosen_korean: 그들의 일은 그것을 하는 이들과 함께 저절로 이루어질 것이며
  alternatives_korean:
  - 그들의 일은 스스로 이루어질 것이며
  - 그들이 하는 일은 함께 저절로 완성될 것이며
  lexicon: Payne Smith
  rationale: 자동화된 느낌보다 비상한 평안 속의 자연스러운 성취를 나타내기 위해 ‘저절로 이루어질’로 옮겼습니다.
- source_word: in much tranquility
  english_pob_choice: in much tranquility
  chosen_korean: 큰 평안 가운데
  alternatives_korean:
  - 많은 고요 속에
  - 큰 평화 가운데
  lexicon: Payne Smith
  rationale: ‘tranquility’의 정서적·종말론적 안정감을 한국어에서 공시적으로 읽히는 ‘평안’으로 살렸습니다.
theological_decisions:
- issue: 종말론적 노동의 성격을 어떻게 드러낼 것인가
  chosen_reading: 노동의 중단이 아니라, 피로와 갈등이 제거된 평안한 성취로 표현했습니다.
  alternative_readings:
  - 일이 쉬워진다는 의미로 약화할 수 있습니다.
  - 일이 자동으로 진행된다는 인상을 줄 수 있습니다.
  rationale: 본문은 단순한 효율이 아니라 새 시대의 질서와 평안 속에서 일의 성취를 말하므로, 과도한 기계적 이미지를 피하면서도 초월적 수월함을 보존했습니다.
  doctrine_reference: 묵시적 회복 이미지의 보존
- issue: ‘많은 평안/고요’의 어조
  chosen_reading: ‘큰 평안 가운데’로 마무리했습니다.
  alternative_readings:
  - ‘큰 고요 가운데’
  - ‘풍성한 평화 가운데’
  rationale: 문맥의 회복과 안식을 함께 드러내는 표현으로, 단순한 침묵보다 관계적·종말론적 평안을 강조했습니다.
  doctrine_reference: 종말론적 평강의 보존
