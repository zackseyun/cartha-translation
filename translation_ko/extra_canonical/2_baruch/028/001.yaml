translation:
  language: ko
  text: 그러므로 이해하는 사람은 그때에 지혜로울 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܐ ܚܿܕܐ
  english_pob_choice: whoever understands
  chosen_korean: 이해하는 사람
  alternatives_korean:
  - 깨닫는 사람
  - 알아듣는 사람
  lexicon: Payne Smith
  rationale: 이 분사구는 단순 지식이 아니라 문맥을 분별해 알아차리는 의미이므로, 지나치게 추상적인 표현보다 ‘이해하는 사람’이 가장 자연스럽고 원문 기능을 잘 살립니다.
- source_word: ܐܢܬ
  english_pob_choice: shall then be wise
  chosen_korean: 지혜로울 것입니다
  alternatives_korean:
  - 지혜롭게 될 것입니다
  - 지혜를 얻게 될 것입니다
  lexicon: Payne Smith
  rationale: 서술형 미래로 단정하지 않고, 조건을 갖춘 사람의 상태를 나타내는 형식에 맞춰 ‘지혜로울 것입니다’로 옮겼습니다.
- source_word: ܡܢܝܢܗ / ܡܫܘܚܬܗ
  english_pob_choice: measure / reckoning
  chosen_korean: 그러므로
  alternatives_korean:
  - 그리하여
  - 이와 같이
  lexicon: Contextual Syriac reading
  rationale: 이 절의 핵심 연결은 앞선 계산된 시기의 설명 이후에 나오는 결론이므로, 문맥상 귀결을 드러내는 접속어 ‘그러므로’가 가장 적절합니다.
theological_decisions:
- issue: 지혜의 성격을 도덕 교훈으로 완화할지 여부
  chosen_reading: 원문의 짧은 격언적 선언을 유지해, 분별하는 자가 ‘지혜로울 것입니다’라고 직설적으로 옮겼습니다.
  alternative_readings:
  - 현명하게 행동할 것입니다
  - 참된 지혜를 가질 것입니다
  rationale: 이 절은 설명문이 아니라 종결 격언에 가까우므로, 의미를 풀어쓴 교훈형 문장보다 원문의 압축된 선언성을 보존하는 편이 더 충실합니다.
  doctrine_reference: 지혜문학적 진술의 형식 보존
