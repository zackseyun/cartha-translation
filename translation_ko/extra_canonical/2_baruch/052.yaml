  text: '1 For the earth will then certainly give back the dead whom it now receives[a], just as they are, changing nothing in their form; as it received them, so it will restore them, and as I delivered them to it, so it will raise them.

    2 For this is required: that it may be shown to the living that the dead have come to life, and that those who had departed have returned.

    3 And it shall be, when they have recognized one another—those who now know one another—that then the appearance of those who are now condemned will become more dreadful.

    4 And it shall be, after that appointed day has passed, that afterward the forms of those who are condemned will be changed, and also the glory of those who are justified.

    5 For the appearance of those who now act wickedly will become worse than it is now, as they suffer torment.

    6 But the glory of those who were justified in their time, and those who had understanding in their life, and those who planted in their heart the root of wisdom—

    7 then their splendors will awake, and the form of their faces will shine with the light of their beauty, so that they may acquire and receive the world that does not die, which is promised to them.

    8 But they will especially be confounded—those who rejected the law and stopped their ears so as not to hear wisdom and not to receive understanding—

    9 when they see that those whom they now count as nothing are at rest and glorified with the angels,

    10 while they themselves are reckoned among the heaps of sins, and the evil of their forms wastes away still more. For first they see, and afterward they go away to be tormented.

    11 But for those who were delivered by their works, and for whom the law was hope, and understanding expectation, and wisdom confidence, and endurance strength,

    12 wonders will appear to them in their time. For they will see that world which is now invisible to them, and that time which is now hidden from them.

    13 And that time will no longer grow old for them. For the expanses of Paradise will be spread out before them, and the beauty of the majesty of the living beings beneath the throne will be shown to them, and all the companies of the angels, who are now restrained by my word so that they are not seen, and are kept by command to stand in their places until their appointed coming.

    14 Then the excellence of the righteous will be greater than that of the angels.

    15 For the first will receive the last, whom they were expecting, and the last those of whom they had heard that they had passed away.

    16 For they have been delivered from this world of affliction and have laid down the burden of distresses.

    17 By what, then, did people lose their life, and for what did those who were on the earth exchange their soul?

    18 For they chose for themselves this present time, which cannot pass apart from anguish, and they chose for themselves that time whose outcomes are full of groanings and evils; and they rejected the world that does not grow old for those who come to it, and they rejected the time of glory[c][b], so that they might not come to the honor of which I told you before.'
  footnotes:
  - marker: a
    text: The chapter opening likely overlaps a preceding unit at the page boundary. The first lines are translated as part of this chapter's received bucket, but the exact chapter-edge remains slightly uncertain.
    reason: textual_variant
  - marker: b
    text: '''The living beings beneath the throne'' likely refers to throne attendants in apocalyptic imagery, not to human beings in general.'
    reason: cross_reference
  - marker: c
    text: The cluster 'law ... hope ... understanding ... expectation ... wisdom ... confidence ... endurance ... strength' is textually awkward in the Syriac lineation, but the overall sense is confirmed by the control witness and is rendered transparently rather than smoothed away.
    reason: alternative_reading
translation:
  language: ko
  text: '1. 그러면 땅이 이제 받는 그 죽은 자들을 반드시 되돌려 줄 것입니다. 그들이 받은 그대로, 그들의 형체를 조금도 바꾸지 않고서 말입니다. 땅이 그들을 받은 것처럼 그렇게 그들을 다시 돌려줄 것이며, 내가 그들을 그것에게 넘겨준 것처럼 그렇게 그것이 그들을 일으킬 것입니다.


    2. 이는 이렇게 되어야 하기 때문입니다. 살아 있는 이들에게 죽은 자들이 살아나고, 떠나갔던 이들이 돌아왔음을 보여 주어야 하기 때문입니다.


    3. 그리고 그들이 서로를 알아볼 때 — 지금 서로를 알고 있는 이들이 그러하듯이 — 그때에는 지금 정죄된 자들의 모습이 더 두려워질 것입니다.


    4. 또한 그 정해진 날이 지나간 뒤에는, 정죄된 자들의 모습이 바뀔 것이며, 의롭다 하심을 받은 이들의 영광도 바뀔 것입니다.


    5. 지금 악을 행하는 자들의 모습은 지금보다 더 나빠질 것이니, 그들이 고통을 당하고 있기 때문입니다.


    6. 그러나 자기 시대에 의롭다 하심을 받은 이들과, 자기 삶에서 분별력을 가진 이들과, 자기 마음속에 지혜의 뿌리를 심은 이들의 영광은 —


    7. 그들의 광채가 깨어날 것이며, 그들의 얼굴 형체가 아름다움의 빛으로 빛날 것입니다. 그래서 그들은 죽지 않는 세상을 얻고, 또 그것을 받을 수 있을 것입니다. 그 세상은 그들에게 약속된 것입니다.


    8. 그러나 율법을 버리고 지혜를 듣지 않으려고, 또 분별력을 받지 않으려고 자기 귀를 닫은 이들은 특히 수치를 당할 것입니다 —


    9. 그들이 지금은 아무것도 아닌 것으로 여기는 이들이 안식하며 천사들과 함께 영광을 누리는 것을 볼 때,


    10. 자신들은 죄의 더미 가운데로 계산되고, 그들의 형체의 악은 더욱 쇠해 가고 있음을 보게 될 것입니다. 처음에는 보고, 그 뒤에는 가서 고통을 당하게 될 것입니다.


    11. 그러나 자기 행위로 구원받았고, 그들에게 율법은 소망이었으며, 분별력은 기대였고, 지혜는 확신이었으며, 인내는 힘이었던 이들에게는 —


    12. 그들의 때에 놀라운 일들이 나타날 것입니다. 그들은 지금은 보이지 않는 그 세상과, 지금은 그들에게 감추어진 그 시간을 보게 될 것입니다.


    13. 그리고 그 시간은 더 이상 그들에게 늙지 않을 것입니다. 그들에게는 낙원의 넓은 지대가 펼쳐질 것이며, 보좌 아래의 살아 있는 존재들의 위엄의 아름다움도 보여 줄 것입니다. 또한 지금은 내 말로 억제되어 보여지지 않고, 정해진 때가 올 때까지 명령으로 자기 자리에 서 있도록 붙들려 있는 모든 천사들의 무리도 보여 줄 것입니다.


    14. 그러면 의인들의 탁월함은 천사들의 것보다 더 클 것입니다.


    15. 첫째는 그들이 기다리던 마지막 자들을 맞이하고, 마지막 자들은 이미 세상을 떠났다고 들었던 이들을 맞이할 것입니다.


    16. 그들은 이 고난의 세상에서 구원받았고, 고통의 짐을 내려놓았기 때문입니다.


    17. 그렇다면 사람들은 무엇 때문에 자기 생명을 잃었으며, 땅에 있는 이들은 무엇 때문에 자기 영혼을 바꾸었습니까?


    18. 그들은 스스로 이 현재의 시간을 택했는데, 이 시간은 고뇌 없이는 지나갈 수 없으며, 그 결과가 탄식과 악으로 가득한 그 시간을 스스로 택했습니다. 또 그들은 그들에게 오는 이들에게는 늙지 않는 세상과, 영광의 시간을 버렸으니, 내가 앞서 여러분에게 말한 그 영예에 이르지 않기 위함이었습니다.[a]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܦܩܢܗ / ܡܩܝܡܐ
  english_pob_choice: give back / restore / raise
  chosen_korean: 되돌려 주다 / 다시 돌려주다 / 일으키다
  alternatives_korean:
  - 돌려주다 / 회복시키다 / 세우다
  - 내어주다 / 복원하다 / 일으키다
  lexicon: Payne Smith
  rationale: 죽은 자를 땅이 받아 두었다가 다시 돌려주는 흐름과 부활의 ‘일으키다’ 뉘앙스를 함께 살리기 위해 삼중 표현을 유지했습니다.
- source_word: ܒܨܘܪܬܗܘܢ
  english_pob_choice: in their form
  chosen_korean: 그들의 형체
  alternatives_korean:
  - 그들의 모습
  - 그들의 형상
  lexicon: Payne Smith
  rationale: 뒤의 변화 대비를 위해 외형적·개체적 연속성을 모두 포괄하는 ‘형체’를 택했습니다.
- source_word: ܐܙܕܩܘ
  english_pob_choice: were justified
  chosen_korean: 의롭다 하심을 받은
  alternatives_korean:
  - 의롭다 인정받은
  - 의롭다 함을 입은
  lexicon: Payne Smith
  rationale: 재판적·종말론적 대조를 살리되, 한국어에서 자연스럽고 신학적으로도 익숙한 수동형을 사용했습니다.
- source_word: ܥܠܡܐ ܕܠܐ ܡܐ̇ܬ
  english_pob_choice: the world that does not die
  chosen_korean: 죽지 않는 세상
  alternatives_korean:
  - 죽지 않는 세계
  - 썩지 않는 세상
  lexicon: Payne Smith
  rationale: 시리아어의 직유적 표현을 너무 추상화하지 않고, 현재의 죽어 가는 세계와 대비되는 종말론적 실재를 한국어로 직역에 가깝게 살렸습니다.
- source_word: ܫܘܒܠܐ
  english_pob_choice: understanding
  chosen_korean: 분별력
  alternatives_korean:
  - 이해
  - 통찰
  lexicon: Payne Smith
  rationale: 지혜 목록 안에서 단순 지적 이해보다 삶의 판단 능력을 가리키므로, ‘분별력’이 가장 적절합니다.
theological_decisions:
- issue: 부활의 연속성과 동일성
  chosen_reading: 죽은 자는 땅이 받은 그대로 다시 돌려받으며, 형체의 동일성과 인물 인식이 유지된 뒤에야 영광과 정죄의 차이가 드러납니다.
  alternative_readings:
  - 완전히 비물질적인 부활
  - 상징적 재현
  rationale: ‘받다/돌려주다/일으키다’의 반복과 서로를 알아본다는 문맥이 인물의 연속성을 강하게 요구합니다.
  doctrine_reference: 종말론적 부활의 인격적 연속성
- issue: 의인과 천사의 비교
  chosen_reading: 의인들은 최종적으로 천사들보다 더 큰 탁월함을 누립니다.
