  - 죽은 자들의 세계
  - 저승
  lexicon: Payne Smith
  rationale: 지하세계의 고유 명칭을 유지하여, 본문의 유대 묵시 문맥을 흐리지 않도록 했습니다.
- source_word: ܪܘܚܝ
  english_pob_choice: my Spirit
  chosen_korean: 내 영
  alternatives_korean:
  - 나의 영
  - 내 숨
  - 내 호흡
  lexicon: Payne Smith
  rationale: 영의 생명 부여 기능을 살리되, 본문이 요구하는 직접적인 신적 소유 표현을 유지했습니다.
theological_decisions:
- issue: 아담의 죄와 죽음의 선고가 후속 인류 전체에 미치는 범위
  chosen_reading: ‘태어날 자들을 위한 죽음이 정해졌을 때’로 집단적·미래 인류 전체에 대한 선언으로 옮겼습니다.
  alternative_readings:
  - 인류에게 죽음이 선고되었다
  - 아담의 후손에게 죽음이 정해졌다
  rationale: 시리아어 본문의 묵시적 집단 논리를 유지하면서, 후대 교리 용어를 과도하게 끌어오지 않았습니다.
  doctrine_reference: DOCTRINE.md §§ Theological stance; Translation philosophy §3
- issue: ‘내 영은 생명을 주는 이’와 스올의 대비
  chosen_reading: 영을 단순한 생기나 호흡이 아니라 생명을 주는 신적 주체로 표현했습니다.
  alternative_readings:
  - 내 영은 생명을 만든다
  - 내 호흡은 생명을 준다
  rationale: 문맥상 생명/죽음의 대조가 핵심이므로, 생명 부여의 능동성을 보존했습니다.
  doctrine_reference: DOCTRINE.md §§ Theological stance; Translation philosophy §1
