  yaml_path: translation/extra_canonical/2_baruch/023.yaml
  text: And I answered and said[a], “No, Lord, my Lord.” And he answered and said to me, “Why are you troubled about what you do not know, and why are you disturbed over matters of which you are ignorant? For just as you have not forgotten those who now exist and those who have passed away, so I remember those who are to come. For when Adam sinned and death was decreed for those who would be born, then the multitude of those who would be born was numbered, and for that number a place was prepared, where the living might dwell and the dead might be kept. Unless, therefore, that number which was appointed beforehand is completed, the creature will not live again. For my Spirit is the giver of life, and Sheol receives the dead. Moreover, it has been granted to you to hear what will come after these times. For my salvation has truly drawn near[b], and is not as far off as it was before.”
  footnotes:
  - marker: a
    text: The chapter boundary here is somewhat uncertain in the current Ceriani bucket. The standard chapter-23 sense is preserved, but nearby lines overlap with adjacent chapter material in the provisional segmentation.
    reason: textual_variant
  - marker: b
    text: Sheol is retained rather than replaced with a smoother English term so the apocalyptic imagery of the text remains visible.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 대답하여 말했습니다[a]. 「아닙니다, 주님, 나의 주님이시여.」 그러자 그가 내게 대답하여 말했습니다. 「네가 알지 못하는 것 때문에 어찌하여 마음이 어지럽고, 네가 모르는 일들 때문에 어찌하여 동요하느냐? 지금 존재하는 자들과 이미 지나간 자들을 네가 잊지 않은 것처럼, 나도 장차 올 자들을 기억한다. 아담이 죄를 지었고 태어날 자들을 위한 죽음이 정해졌을 때, 태어날 자들의 무리가 수를 셌고, 그 수를 위해 살아 있는 자들이 거하고 죽은 자들이 머물 곳이 마련되었다. 그러므로 전에 정해진 그 수가 채워지지 않는 한, 피조물은 다시 살지 못할 것이다. 내 영은 생명을 주는 이이며, 스올은 죽은 자들을 받는다[b]. 더욱이 이 시대들 뒤에 일어날 일을 네가 들을 수 있도록 허락을 받았다. 참으로 나의 구원이 가까이 왔으며, 전보다 멀리 있지 않다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܥܝܪ
  english_pob_choice: troubled / disturbed
