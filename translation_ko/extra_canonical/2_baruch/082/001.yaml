    서 있던 것이나 만들어진 것이나 다툼 가운데 있다가 사라져 간 것은 무엇이든 이것을 보여 줍니다. 악은 영원히 악으로 남지 않으며, 선도 영원히 선으로 남지 않습니다. 모든 건강은 병으로 바뀌고, 모든 힘은 약함으로 바뀌며, 모든 아름다움은 추함으로 바뀌고, 젊음의 모든 꽃피움은 짐스러운 노년으로 바뀝니다. 여러분이 보았던 모든 아름다움은 어둠과 썩어 감으로 바뀌고, 여러분이 만든 모든 황폐는 평화와 즐거움으로 바뀝니다. 주어졌던 모든 어둠은 진리의 빛으로 바뀝니다. 모든 오류와 약함은 고요한 낮아짐으로 바뀝니다. 모든 보복과 진노는 쉼과 힘으로 바뀝니다. 깨어 있는 이들의 모든 소리는 흙에서 난 침묵으로 바뀝니다.


