  revised_text: '지금 우리는 민족들의 풍성한 번영을 봅니다. 그들이 악을 행하지만, 그들은 한 방울에 비유됩니다. 우리는 그들의 권세의 힘을 바라보지만, 그들은 침으로 여겨질 것입니다. 우리는 그들의 위대함의 영광을 헤아립니다. 그러나 그들은 전능자의 계명을 지키지 않고 그것들을 업신여겼습니다. 또 우리는 눈에 보이는 아름다움을 봅니다. 그것은 환난 속에서 흔들리지만, 그들은 고통받는 육체처럼 찾아내어질 것입니다. 우리는 그들이 의지하는 확신을 생각합니다. 그것은 우리 눈앞에서 흔들리지만, 그들은 파도처럼 부서질 것입니다. 우리는 오직 그들의 힘에 대한 희망을 찾습니다. 그것은 하나님께서 그들에게 주신 좋은 것들 가운데서 번성하지만, 감추어질 것이며 그 위에 통곡이 임할 것입니다.


