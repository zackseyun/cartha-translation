  text: And he answered and said to me, “Because of this, at that time it was said …”
translation:
  language: ko
  text: 그가 내게 대답하여 말했습니다. 「이러므로, 그때에 말해졌습니다…」[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܥܢܐ
  english_pob_choice: And he answered
  chosen_korean: 그가 내게 대답하여 말했습니다
  alternatives_korean:
  - 그가 내게 대답했습니다
  - 그가 내게 답하여 말했습니다
  lexicon: Payne Smith
  rationale: 서사적 대답 공식을 자연스럽게 옮기되, 대화 상대가 분명히 드러나도록 ‘내게’를 살렸습니다.
- source_word: ܡܛܠ ܗܢܐ
  english_pob_choice: Because of this
  chosen_korean: 이러므로
  alternatives_korean:
  - 이 때문에
  - 그러므로
  lexicon: Payne Smith
  rationale: 앞 문맥의 인과를 받는 연결어로서 간결하고 문어적인 ‘이러므로’를 택했습니다.
- source_word: ܒܗܘ ܙܒܢܐ
  english_pob_choice: at that time
  chosen_korean: 그때에
  alternatives_korean:
  - 그 시기에
  - 그때
  lexicon: Payne Smith
  rationale: 묵시적 문맥에 맞게 시간을 특정하면서도, 과도하게 역사화하지 않도록 ‘그때에’로 옮겼습니다.
- source_word: ܐܡܝܪ
  english_pob_choice: it was said
  chosen_korean: 말해졌습니다
  alternatives_korean:
  - 말했습니다
  - 전해졌습니다
  lexicon: Payne Smith
  rationale: 시리아어 수동형을 살려 발화 주체를 앞당겨 특정하지 않고, 본문이 유지하는 간접성을 보존했습니다.
theological_decisions:
- issue: 열린 끝맺음과 발화 주체의 미특정성
  chosen_reading: 마지막 절은 ‘말해졌습니다…’로 열어 두어, 본문이 아직 밝히지 않은 발화 내용을 미리 채워 넣지 않았습니다.
  alternative_readings:
  - ‘말했습니다…’로 매끄럽게 완결할 수 있습니다.
  - 예언적 선언으로 확장해 옮길 수 있습니다.
  rationale: English POB도 절단된 개시 구절의 긴장을 유지하며, 원문이 드러내지 않은 내용을 해석적으로 보강하지 않습니다.
  doctrine_reference: 본문 비약 금지 및 미완결 화법 보존
- issue: 인용부호 시작과 끝의 처리
  chosen_reading: 시리아어가 곧 이어질 직접화법의 도입만 보여 주므로, 한국어도 인용부호를 열고 생략부호로 끝냈습니다.
  alternative_readings:
  - 인용부호 없이 서술문으로 풀 수 있습니다.
  - 생략부호 없이 문장 종결을 할 수 있습니다.
  rationale: 독자가 이후 문맥으로 이어지는 발화를 예상하도록 하여, 단절된 원문 구조를 최대한 투명하게 드러냅니다.
  doctrine_reference: 원문 구조 보존
