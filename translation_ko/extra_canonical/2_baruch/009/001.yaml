translation:
  language: ko
  text: 그리고 나 바룩은 마음이 죄에서 깨끗하다고 드러났고 성이 함락될 때 사로잡히지 않았던 예레미야와 함께 갔습니다. 우리는 옷을 찢고 울며 애도하고 일곱 날 동안 금식했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܒܥ
  english_pob_choice: came
  chosen_korean: 갔습니다
  alternatives_korean:
  - 왔습니다
  - 들어갔습니다
  lexicon: Payne Smith
  rationale: 문맥상 단순 이동 동사로 읽는 것이 가장 무난하며, 한국어에서는 화자가 사건 현장으로 이동하는 서술을 자연스럽게 ‘갔습니다’로 옮길 수 있습니다.
- source_word: ܕܟܝ ... ܡܢ ܚܛܝ̈ܗ̣ܐ
  english_pob_choice: whose heart had been found pure from sins
  chosen_korean: 죄들에서 깨끗하다고 드러난 마음
  alternatives_korean:
  - 죄들에서 깨끗한 마음
  - 죄들에서 무죄하다고 드러난 마음
  lexicon: Payne Smith
  rationale: 본문의 평가는 예레미야의 마음이 재난과 관련된 죄책에서 깨끗하다는 뜻을 살리므로, 절대적 무죄 선언으로 굳히지 않고 ‘드러난’으로 판단의 뉘앙스를 유지했습니다.
- source_word: ܒܥܒܕܘܗܝ ܕܡܕܝܢܬܐ
  english_pob_choice: in the capture of the city
  chosen_korean: 성이 함락될 때 붙잡히지 않았습니다
  alternatives_korean:
  - 성이 점령될 때
  - 성의 함락 때
  lexicon: Smith Syriac Dictionary
  rationale: 도시가 무력으로 함락되는 뜻을 살리되, 예레미야가 그 포로 집단에 포함되지 않았다는 대비를 한국어에서 분명히 드러내기 위해 ‘붙잡히지 않았습니다’로 옮겼습니다.
- source_word: ܘܐܡܪ... ܘܐܬܩܒܠ... ܘܘܒܩ̈ܝ
  english_pob_choice: And we rent our garments, wept, mourned, and fasted seven days
  chosen_korean: 우리는 옷을 찢고, 울고, 애도하며, 일곱 날 동안 금식했습니다
  alternatives_korean:
  - 우리는 옷을 찢고 울며 애도하고 일곱 날 동안 금식했습니다
  - 우리는 옷을 찢고, 통곡하고, 애도하며, 일곱 날 동안 금식했습니다
  lexicon: Payne Smith
  rationale: 옷을 찢는 행위, 울음, 애도, 금식의 네 동작을 빠뜨리지 않도록 병렬 구조를 유지했고, ‘울고’와 ‘애도하며’는 서로 다른 슬픔의 동작으로 구분했습니다.
theological_decisions:
- issue: 예레미야가 ‘죄들에서 깨끗하다’는 평가의 범위
  chosen_reading: 절대적 무죄나 완전무결 선언이 아니라, 예루살렘 멸망과 포로 사건에 대한 책임에서 깨끗하다는 맥락적 평가로 읽었습니다.
  alternative_readings:
  - 예레미야가 본질적으로 무죄하다는 선언
  - 정결 의례와 관련된 표현
  rationale: 영어 POB도 이를 절대적 죄없음이 아니라 ‘재난과 관련된 순결’로 보존하고 있으므로, 한국어에서도 그 긴장을 풀어버리지 않도록 했습니다.
