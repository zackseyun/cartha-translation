  - 구원자
  lexicon: Payne Smith
  rationale: 본문의 역사적-상징적 전개에서 титular 의미를 살리기 위해 프로젝트 기본어인 ‘메시아’를 사용했습니다.
theological_decisions:
- issue: ‘the Mighty One’의 신칭을 한국어에서 어떻게 유지할지
  chosen_reading: 전능하신 분
  alternative_readings:
  - 능하신 분
  - 하나님
  rationale: 2바룩의 신적 칭호를 관용적 교회어로 평면화하지 않고, 본문의 장엄한 호칭감을 살리기 위해 ‘전능하신 분’으로 옮겼습니다.
  doctrine_reference: Divine title preservation; consistency with 2 Baruch diction
- issue: 시온과 다윗-솔로몬 시대의 관계를 종말론적으로 과도하게 밀지 않을지
  chosen_reading: 다윗과 솔로몬 시대의 역사-전형적 고점으로 읽음
  alternative_readings:
  - 직접적인 메시아 통치 진술
  - 순수한 영적 은유
  rationale: 문맥이 여섯째 밝은 물을 다윗과 솔로몬의 탄생 및 그 시대에 연결하므로, 이후의 메시아적 성취를 미리 덧씌우지 않고 역사적-전형적 의미를 유지했습니다.
  doctrine_reference: Historical-typological reading in apocalyptic symbolism
