base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/061.yaml
  text: '1. And the sixth bright waters that you saw—these are the time in which David and Solomon were born.a


    2. And at that time there came the building of Zion[a], and the dedication of the sanctuary, and the shedding of much blood of the nations that sinned then, and many offerings that were offered then at the dedication of the sanctuary.


    3. And peace and tranquility existed at that time.


    4. And wisdom was heard in the assembly, and the riches of understanding were magnified in the congregations.


    5. And the holy festivals were fulfilled with goodness and with much joy.


    6. And the judgment of the rulers was then seen to be without deceit, and the righteousness of the commandments of the Mighty One was accomplished in truth.


    7. And the land, because it then received mercy, and because its inhabitants did not sin, was glorified above all lands; and the city Zion ruled over all lands and regions.


    8. These are the bright waters that you saw.'
  footnotes:
  - marker: a
    text: The Ceriani bucket for this chapter overlaps adjacent material and does not preserve a clean chapter edge on its own. This draft follows the control-backed identification of 2 Baruch 61 as the David-and-Solomon 'sixth bright waters' section, especially from the Kmosko checkpoint and chapter numbering tradition.
    reason: textual_variant
translation:
  language: ko
  text: '1. 네가 본 여섯째 밝은 물은 다윗과 솔로몬이 태어난 때입니다.


    2. 그리고 그때 시온의 건축이 시작되고, 성소의 봉헌과 함께, 그때 죄를 지은 민족들의 많은 피 흘림과 성소 봉헌 때에 드려진 많은 제물이 있었습니다.


    3. 그때에는 평강과 안온함이 있었습니다.


    4. 지혜는 회중 가운데서 들렸고, 통찰의 부요함은 모임들 가운데서 크게 되었습니다.


    5. 거룩한 절기들은 선함과 많은 기쁨으로 성취되었습니다.


    6. 그리고 그때 통치자들의 심판은 속임이 없는 것으로 드러났고, 전능하신 분의 계명의 의는 진리 안에서 이루어졌습니다.


    7. 그 땅은 그때 긍휼을 받았고, 그 주민들이 죄를 짓지 않았으므로 모든 땅보다 높임을 받았으며, 시온 성은 모든 땅과 지역들을 다스렸습니다.


    8. 이것들이 네가 본 밝은 물들입니다.[a]'
