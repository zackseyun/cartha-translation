base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/064.yaml
  text: '1[a]. And the ninth black waters that you saw—these are the wickedness that was in the days of Manasseh son of Hezekiah.


    2. For he committed much impiety: he killed the righteous, twisted judgment, shed innocent blood, violated married women by force[b], overturned altars, abolished their offerings, and drove out the priests so that they could not minister in the sanctuary.


    3. And he made an image with five faces: four looked toward the four winds, and the fifth was above the image, as though in opposition to the zeal of the Mighty One.


    4. Then wrath went out from before the Mighty One, that Zion should be uprooted—as it also happened in your days.


    5. And a decree also went out against the two and a half tribes, that they too should be led away captive, as you have now seen.


    6. And the impiety of Manasseh grew so great that the glory of the Most High was removed from the sanctuary.


    7. Therefore at that time Manasseh was called the impious one, and in the end his dwelling was in the fire.


    8. For although his prayer was heard by the Most High, yet at last, when he was cast into the bronze horse and the bronze horse melted, it became a sign for him concerning the hour.


    9. Not because he had lived blamelessly, for he was not worthy, but so that from then on he might know by whom he would finally be punished.


    10[f][e][d][c]. For he who is able to benefit is also able to torment.'
  footnotes:
  - marker: a
    text: The supplied Ceriani bucket begins on a page that still overlaps with the close of chapter 63; the chapter opening here is structurally secure by content, but the edge remains a medium-confidence boundary in the current substrate.
    reason: textual_variant
  - marker: b
    text: '''Bronze horse'' reflects the transmitted wording as preserved in the Syriac tradition, but the image is obscure and may represent a difficult or corrupt expression; ''brazen horse'' is the traditional English equivalent.'
    reason: lexical_alternative
  - marker: c
    text: The sanctuary clause in verse 6 is difficult; some control-oriented renderings take the key term as 'praise,' but the main text adopts 'glory' because the context suggests withdrawal of divine presence.
    reason: alternative_reading
  - marker: d
    text: Or 'as though to provoke the zeal'.
    reason: previous_rendering
  - marker: e
    text: Or 'withdrew from the sanctuary'.
    reason: previous_rendering
  - marker: f
    text: Or 'help is also able to punish'.
    reason: previous_rendering
translation:
  language: ko
  text: '네가 본 아홉째 검은 물들은 히스기야의 아들 므낫세의 시대에 있던 악행들입니다.


    그는 많은 불경을 행하였습니다. 곧 의인들을 죽이고, 재판을 굽게 하고, 무고한 피를 흘리며, 아내 있는 여자들을 폭력으로 더럽히고, 제단들을 뒤엎고, 그들의 제물들을 폐지하고, 제사장들을 몰아내어 성소에서 섬길 수 없게 하였습니다.


    또 그는 다섯 얼굴을 가진 형상을 만들었는데, 넷은 네 바람을 향하고 있었고, 다섯째는 형상 위에 있었으니, 마치 전능하신 분의 열심에 맞서는 것 같았습니다.


    그러자 전능하신 분 앞에서 진노가 나와 시온이 뿌리째 뽑히도록 하였으니—그것이 바로 너희 시대에도 일어난 일입니다.


    또 두 지파와 반 지파에 대해서도 그들이 포로로 끌려가도록 하는 명령이 나왔으니, 너희가 지금 본 것과 같습니다.


    므낫세의 불경이 너무 커져서 지극히 높으신 분의 영광이 성소에서 옮겨졌습니다[a].


    그러므로 그때 그는 불경한 자라고 불렸고, 끝내 그의 거처는 불이었습니다.


    그의 기도는 지극히 높으신 분께 들렸지만, 결국 그가 놋 말에 던져졌고 그 놋 말이 녹아버렸을 때, 그것은 그에게 그 때를 알리는 표징이 되었습니다[b].


    그것은 그가 흠 없이 살았기 때문도 아니고, 그가 합당했기 때문도 아닙니다. 다만 그로 하여금, 마침내 자신을 벌할 분이 누구인지 그때부터 알게 하려는 것이었습니다.


    왜냐하면 유익을 베풀 수 있는 분은 고통을 가할 수도 있기 때문입니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܫ̈ܟܐ ܣ̈ܓܝܐܐ
  english_pob_choice: black waters
  chosen_korean: 검은 물들
  alternatives_korean:
  - 어두운 물들
  lexicon: Payne Smith
  rationale: 시각적 대조가 있는 환상어를 살려 ‘검은’으로 직역했고, 단순히 분위기만 어둡다는 뜻으로 완화하지 않았습니다.
- source_word: ܚܒܠܐ
  english_pob_choice: wickedness
  chosen_korean: 악행
  alternatives_korean:
  - 불경
  - 부패
  - 파괴
  lexicon: Payne Smith
  rationale: 문맥이 므낫세의 도덕적·종교적 죄목 나열이므로, 결과보다 행위의 악을 드러내는 ‘악행’이 가장 자연스럽습니다.
- source_word: ܪ̈ܘܚܐ
  english_pob_choice: winds
  chosen_korean: 바람
  alternatives_korean:
  - 영
  - 바람들
  lexicon: Payne Smith
  rationale: 다섯 얼굴의 형상 설명에서는 방향 개념이 핵심이므로, 영적 존재보다 ‘바람’을 택해 사방을 가리키는 뜻을 보존했습니다.
- source_word: ܬܫܒܘܚܬܐ / sanctuary-presence term
  english_pob_choice: glory
  chosen_korean: 영광
  alternatives_korean:
  - 찬양
  - 광채
  lexicon: Payne Smith
  rationale: 성소에서 옮겨진 것은 인간의 찬양이 아니라 하나님의 임재를 가리키는 ‘영광’이므로, 그 신학적 무게를 유지했습니다.
- source_word: ܒܐܝܕܝܬܐ / obscure transmitted image
  english_pob_choice: bronze horse
  chosen_korean: 놋 말
  alternatives_korean:
  - 놋쇠 말
  - 구리 말
  lexicon: Payne Smith
  rationale: 전승된 난해한 형상을 한국어로 가장 직접적으로 옮기되, 문맥상 이미지의 모호함은 그대로 남겨 두었습니다.
- source_word: ܫܢܩ
  english_pob_choice: torment
  chosen_korean: 고통을 가하다
  alternatives_korean:
  - 벌하다
  - 괴롭히다
  - 고문하다
  lexicon: Payne Smith
  rationale: 마지막 대조문의 강한 동사를 살리기 위해 ‘벌하다’보다 더 직접적인 ‘고통을 가하다’를 택했습니다.
theological_decisions:
- issue: 성소에서 옮겨진 대상의 의미
  chosen_reading: 지극히 높으신 분의 영광이 성소에서 옮겨졌습니다
  alternative_readings:
  - 지극히 높으신 분의 찬양이 성소에서 옮겨졌습니다
  - 지극히 높으신 분의 광채가 성소에서 옮겨졌습니다
  rationale: 문맥은 예배 행위의 이동이 아니라 신적 임재의 철수를 말하므로, ‘영광’으로 번역해 성소 버림의 신학적 긴장을 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: 마지막 절의 대조
  chosen_reading: 유익을 베풀 수 있는 분은 고통을 가할 수도 있기 때문입니다
  alternative_readings:
  - 도움을 줄 수 있는 분은 벌할 수도 있기 때문입니다
  - 선을 행할 수 있는 분은 고문할 수도 있기 때문입니다
  rationale: 본문은 동일한 주체 안에 유익과 고통을 함께 두어 하나님의 주권적 이중 가능성을 강조하므로, 한쪽으로 완화하지 않고 병렬을 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
