base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/044.yaml
  text: '1 And I[a], Baruch, went from there and came to the people. And I called the firstborn of its mighty ones, and its nobles, and the lowly from the elders of the people, and I said to them,

    2 “Hear, I am with you[a], as a small one with a great people, though you know that I am about to leave you.

    3 But guard and watch over the people who remain[b][c][d][e], that they may not depart from the commandments of God.”'
  footnotes:
  - marker: a
    text: The Syriac description of those summoned is uncertain in this bucket and may preserve civic ranks rather than personal names. A later control-witness check could refine the line.
    reason: textual_variant
    anchor_ref: '44:1'
  - marker: a
    text: This chapter bucket still overlaps with the end of chapter 43 on the same Ceriani page. The translation begins only at the inline chapter marker “44.”
    reason: textual_variant
    anchor_ref: '44:1'
  - marker: e
    text: The surviving bucket breaks off mid-sentence after “for we also …”; the English therefore ends with suspension points rather than a falsely complete clause.
    reason: textual_variant
    anchor_ref: '44:3'
  - marker: d
    text: Or 'the leading ones among its inhabitants, and the elders of its great men, and the lowly from the elders of the people'.
    reason: previous_rendering
  - marker: c
    text: Or 'Hear me. I am one small among the people, not as a great man. You know that it is not my desire to leave you and so have it be.'.
    reason: previous_rendering
  - marker: b
    text: Or 'keep watch over the people who remain, that they may not depart from the commandments of God. Rejoice, for we also …'.
    reason: previous_rendering
translation:
  language: ko
  text: '1 나는 그곳에서 떠나 백성에게 갔습니다. 그리고 그들의 첫째되는 유력한 자들과 그들의 귀족들, 그리고 백성의 장로들 가운데서 낮은 이들을 불러 그들에게 말했습니다.

    2 “들으십시오. 나는 여러분과 함께 있습니다. 작은 자로서 큰 백성과 함께 있는 것과 같습니다. 여러분은 내가 여러분을 떠나려 한다는 것을 알고 있습니다.

    3 그러나 남아 있는 백성을 지키고 살피십시오. 그들이 하나님의 계명에서 떠나지 않게 하십시오.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܘܟܪܝ
  english_pob_choice: the firstborn of its mighty ones
  chosen_korean: 그들의 첫째되는 유력한 자들
  alternatives_korean:
  - 그들의 첫아들
  - 그들의 처음 난 자들
  - 그들의 우두머리들
  lexicon: Payne Smith
  rationale: 직역인 ‘첫아들/처음 난 자들’은 이 문맥에서 자연스러운 시민적 호명 대상을 잘 드러내지 못하므로, POB의 보수적 사회적 해석을 따라 유력한 자들로 옮겼습니다.
- source_word: ܡܟܝܟܐ
  english_pob_choice: the lowly
  chosen_korean: 낮은 이들
  alternatives_korean:
  - 겸손한 이들
  - 천한 이들
  - 낮은 자들
  lexicon: Payne Smith
  rationale: 사회적 낮은 지위를 가리키는 뜻을 살려 ‘낮은 이들’로 옮겨, 앞의 귀족·유력한 자들과 대조를 유지했습니다.
- source_word: ܢ̇ܛܪܘ
  english_pob_choice: keep watch over
  chosen_korean: 지키고 살피십시오
  alternatives_korean:
  - 감시하십시오
  - 보호하십시오
  - 지키십시오
  lexicon: Payne Smith
  rationale: 동사는 단순 보유보다 적극적 돌봄과 경계를 포함하므로, ‘지키고 살피십시오’로 두 요소를 함께 드러냈습니다.
- source_word: ܥܡܐ ܕܐܫܬܚܪ
  english_pob_choice: the people who remain
  chosen_korean: 남아 있는 백성
  alternatives_korean:
  - 남은 백성
  - 남아 있는 사람들
  - 남겨진 백성
  lexicon: Payne Smith
  rationale: 잔존자 의미를 분명히 하면서도 후대의 기술용어처럼 과도하게 굳히지 않기 위해 자연스러운 서술형 표현을 택했습니다.
- source_word: ܦܘܩ̈ܕܢܘܗܝ ܕܐܠܗܐ
  english_pob_choice: the commandments of God
  chosen_korean: 하나님의 계명
  alternatives_korean:
  - 하나님의 명령
  - 하나님의 법
  - 하나님의 규례
  lexicon: Payne Smith
  rationale: 시리아어의 직접적인 ‘명령들’ 의미를 살리되, 한국어 성서 문체에서 가장 곧고 분명한 ‘계명’을 택했습니다.
theological_decisions:
- issue: 44장 2–3절의 남은 백성 보존 강조
  chosen_reading: 남아 있는 백성
  alternative_readings:
  - 남은 자들
  - 남은 무리
  - 남은 백성 곧 남은 자
  rationale: 본문은 심판 이후 공동체의 잔존자를 보호하라는 권면이므로, 기술적 용어인 ‘남은 자’보다 직접적이고 문맥에 맞는 ‘남아 있는 백성’을 유지했습니다.
  doctrine_reference: remnant theology
- issue: 호칭과 명령문의 어조
  chosen_reading: 들으십시오 ... 하십시오
  alternative_readings:
  - 들어라 ... 지켜라
  - 들으소서 ... 지키소서
  rationale: 본문의 공개적 권면과 합쇼체 문체를 맞추기 위해 정중한 명령형을 사용했습니다. 인용문 안에서도 청중에게 하는 발화이므로 같은 등록을 유지했습니다.
  doctrine_reference: register and discourse level
