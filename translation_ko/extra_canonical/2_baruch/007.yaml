base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/007.yaml
  text: And after these things I heard that angel saying to those angels who were holding the torches[a], “Now pull down the supports of its walls and overthrow them, lest the enemies boast and say, ‘We ourselves have cast down the wall of Zion[c][b], and we have burned the place of the mighty God.’” And I was set there in the place where I had been standing before.
  footnotes:
  - marker: a
    text: The Ceriani bucket overlaps with adjacent chapter material. This draft follows the usual chapter-7 division in which the command to overthrow Zion's wall belongs here, while the voice from within the temple begins chapter 8.
    reason: textual_variant
  - marker: b
    text: The architectural phrase rendered 'the supports of its walls' is somewhat uncertain in the OCR substrate; 'foundations' is a plausible alternative.
    reason: lexical_alternative
  - marker: c
    text: Or 'I left that angel who had spoken with me—the one who had spoken to those angels who were holding the torches. 2 And he said,'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이 일들 뒤에 나는 그 횃불을 들고 있던 천사들에게 말하는 그 천사의 소리를 들었습니다. 「이제 그 성벽의 지지대들을 허물고 그것들을 무너뜨리십시오. 적들이 자랑하며 ‘우리가 시온의 성벽을 무너뜨렸고, 전능하신 하나님의 자리를 불태웠다’라고 말하지 못하게 하려는 것입니다.」 그러고 나서 나는 전에 서 있던 바로 그 자리에 서 있었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܦܐܕ̈ܐ / ܡܦܝܕܐ
  english_pob_choice: torches
  chosen_korean: 횃불
  alternatives_korean:
  - 등불
  - 불붙은 횃불
  lexicon: Smith Syriac Dictionary
  rationale: 불길이 드러나는 전투적·파괴적 장면이므로 일반적인 등불보다 횃불이 문맥의 긴박함을 더 잘 살립니다.
- source_word: ܣܡܝܟܘܬ ܫܘܪ̈ܝܗ
  english_pob_choice: the supports of its walls
  chosen_korean: 그 성벽의 지지대들
  alternatives_korean:
  - 그 성벽의 기초들
  - 그 성벽의 버팀대들
  lexicon: Payne Smith
  rationale: 표현 자체가 구조물의 받침을 가리키지만 정확한 건축 용어를 단정하기 어려워, 지지대들로 옮겨 구조적 의미를 유지했습니다.
- source_word: ܣܚܦܢܝܗܝ
  english_pob_choice: have cast down
  chosen_korean: 무너뜨렸고
  alternatives_korean:
  - 헐어버렸고
  - 뒤엎었고
  lexicon: Smith Syriac Dictionary
  rationale: 강한 파괴 동사를 한국어로 자연스럽게 살리되, 조롱의 직접화법에 맞게 과격한 어감을 유지했습니다.
- source_word: ܕܘܟܬܐ ܕܐܠܗܐ ܚܝܒܬܐ
  english_pob_choice: the place of the Mighty God
  chosen_korean: 전능하신 하나님의 자리
  alternatives_korean:
  - 능하신 하나님의 자리
  - 강하신 하나님의 자리
  lexicon: Payne Smith
  rationale: 문맥상 예루살렘/성전의 성소를 가리키는 경멸적 조롱이므로, ‘하나님의 자리’로 옮겨 장소성을 살리고, ܚܝܒܬܐ는 여기서 위엄을 드러내는 칭호로 처리했습니다.
- source_word: ܘܐܬܩܝܡܘܬ
  english_pob_choice: I was set there
  chosen_korean: 나는 ... 서 있었습니다
  alternatives_korean:
  - 나는 그곳에 놓였습니다
  - 나는 그곳에 세워졌습니다
  lexicon: Smith Syriac Dictionary
  rationale: 수동형 뉘앙스가 바르쑥이 스스로가 아니라 어떤 힘에 의해 위치가 정해졌음을 암시하지만, 한국어에서는 본문 흐름에 맞는 자연스러운 서술로 ‘서 있었습니다’를 택했습니다.
theological_decisions:
- issue: 천사들을 통한 심판의 대리성
  chosen_reading: 성벽의 붕괴는 적들의 공로가 아니라, 천사들에게 내린 명령을 통한 하늘의 심판으로 제시했습니다.
  alternative_readings:
  - 적군의 군사적 파괴로 읽는 해석
  - 단순한 역사적 붕괴 묘사로 읽는 해석
  rationale: 본문은 파괴의 주체를 적이 아니라 천사들과 그 명령에 둡니다. 그래서 적들의 자랑을 차단하는 목적을 분명히 드러내야 합니다.
  doctrine_reference: 섭리와 심판의 대리적 집행
