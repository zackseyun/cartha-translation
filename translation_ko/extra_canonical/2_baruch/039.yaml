base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/039.yaml
  text: '1[a]. And he answered and said to me, “But this is the interpretation of the vision that you saw.


    2. As for the great forest that you saw[b], with the many clouds that were destroying it, this is the kingdom that will arise in the last days.


    3. And this kingdom that once destroyed Zion will be destroyed, and it will be subjected to the one that comes after it.


    4. And that one too will remain for a longer time than the former ones, and it will rule for many times, like the forests of the plain.


    5. And it will hold the times and will exalt itself more than the cedars of Lebanon. And security will be established in it, and all those who are defiled with iniquity will flee to it, just as wild beasts and creeping things flee into the forest.


    6. And it will come to pass that, at the time of its completion, even then the beginning of my Messiah will be revealed, who is like a fountain and like a vine.


    7. And when he is revealed, he will uproot the multitude of it. And as for the tall cedar that you saw left from that forest[g][f][e][d][c], and the words that the vine spoke with it which you heard—'
  footnotes:
  - marker: a
    text: Verse 4 is weak in the Ceriani OCR, but the Kmosko Latin control clearly preserves the sense that a second kingdom is destroyed and then a third arises and rules for its time.
    reason: textual_variant
  - marker: b
    text: The Syriac line rendered 'security will be established in it' may also be taken more literally as 'truth' or 'firmness' will be established in it. The context of the lawless fleeing to that kingdom favors a stability/security nuance.
    reason: lexical_alternative
  - marker: c
    text: At verse 7 Ceriani's OCR looks like 'the beginning of my Messiah,' but the Kmosko Syriac control supports a term meaning headship or reign; this draft follows that control-backed reading.
    reason: textual_variant
  - marker: d
    text: The closing clause is a real chapter-edge problem. Ceriani breaks off after introducing the cedar and the vine's speech, and the fuller explanation continues in the next chapter's material.
    reason: textual_variant
  - marker: e
    text: Or 'this is the word:\n\n3. Behold, days are coming when this kingdom that once destroyed Zion will be destroyed'.
    reason: previous_rendering
  - marker: f
    text: Or 'he who is like the fountain and like the vine'.
    reason: previous_rendering
  - marker: g
    text: Or 'And when he is revealed, he will uproot'.
    reason: previous_rendering
translation:
  language: ko
  text: '1. 그가 나에게 대답하며 말했습니다. “그러나 이것은 네가 본 환상의 해석입니다.


    2. 네가 본 그 큰 숲은 — 많은 구름이 그것을 무너뜨리고 있었는데 — 이는 마지막 날들에 일어날 나라입니다.


    3. 그리고 한때 시온을 무너뜨렸던 이 나라는 무너질 것이며, 그 뒤에 오는 이에게 종속될 것입니다.


    4. 그 이 또한 앞선 것들보다 더 오래 머물 것이며, 평원의 숲들처럼 여러 때 동안 다스릴 것입니다.


    5. 그리고 그것은 때를 붙들고 레바논의 백향목들보다 더 스스로 높일 것입니다. 그 안에는 안정이 세워질 것이며, 불의로 더럽혀진 자들은 모두 그리로 달아날 것입니다. 마치 들짐승과 기어다니는 것들이 숲으로 달아나듯이 말입니다.


    6. 그리고 그 완성의 때가 이를 때, 그제야 나의 메시아의 시작이 드러날 것이니, 그는 샘과 같고 포도나무와 같습니다.


    7. 그리고 그가 드러나면, 그가 그 무리의 무리를 뿌리째 뽑을 것입니다. 그리고 네가 그 숲에서 남겨진 키 큰 백향목과, 네가 들은 포도나무가 그와 함께 말한 그 말은—”,[a][b]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܠܟܘܬܐ
  english_pob_choice: kingdom
  chosen_korean: 나라
  alternatives_korean:
  - 왕국
  - 통치 영역
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 이 단락은 연속되는 역사적 세력을 상징적으로 설명하므로, 한국어에서는 ‘나라’가 가장 자연스럽고 문맥상 정치적 실체를 살릴 수 있습니다.
- source_word: ܫܪܪܐ
  english_pob_choice: security
  chosen_korean: 안정
  alternatives_korean:
  - 진리
  - 견고함
  - 굳건함
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 원어는 ‘진리/견고함’도 가능하지만, 여기서는 불의한 자들이 그 나라로 피신하는 문맥이어서 ‘안정’이 더 적절합니다.
- source_word: ܪܝܫܝܬܗ / control-backed ܪܝܫܢܘܬܗ
  english_pob_choice: reign / beginning of my Messiah
  chosen_korean: 시작
  alternatives_korean:
  - 통치
  - 머리 됨
  - 재위
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 제어 사본 전통은 단순한 ‘시작’보다 왕권적·수위적 의미를 시사하지만, 한국어 본문에서는 과도한 해석을 피하면서도 문맥을 살려 ‘메시아의 시작’으로 옮겼습니다.
- source_word: ܬܥܩܘܪ
  english_pob_choice: will uproot
  chosen_korean: 뿌리째 뽑을 것입니다
  alternatives_korean:
  - 뽑아낼 것입니다
  - 뿌리를 뽑을 것입니다
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 심판과 제거의 강한 이미지를 살리기 위해 관용적으로 자연스러운 ‘뿌리째 뽑다’를 선택했습니다.
theological_decisions:
- issue: ‘my Messiah’의 번역과 그 직설성 유지
  chosen_reading: ‘나의 메시아’로 옮겨, 본문이 가진 소유격과 종말론적 계시를 그대로 드러냈습니다.
  alternative_readings:
  - ‘그리스도’
  - ‘내 메시아’
  rationale: 전통 교회어인 ‘그리스도’로 바꾸면 원문의 표지어 성격이 약해지므로, 메시아라는 직역을 유지했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
- issue: ‘security’의 의미 선택
  chosen_reading: 불의한 자들이 도망쳐 들어가는 피난처적 문맥을 따라 ‘안정’으로 옮겼습니다.
  alternative_readings:
  - 진리
  - 견고함
  rationale: 문맥상 윤리적 ‘진리’보다, 질서가 세워져 사람들이 몰려드는 상태를 가리키는 뜻이 더 강합니다.
  doctrine_reference: Translation philosophy §1 (Original-language primacy over translation tradition)
