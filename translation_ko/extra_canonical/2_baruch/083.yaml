translation:
  language: ko
  text: '흙에서 난 것은 흙으로 돌아가고, 재물의 소유는 더는 되돌아오지 않으며, 그 갈망 속에서 죽음을 구합니다. 품삯을 강탈하는 자들은 때 이르게 죽음을 불러오며, 고난의 삯인 죽음은 거두어집니다. 기쁨의 어떤 것도 즐거움을 위해 남아 있지 않으며, 변동의 영역은 완성된 싸움으로 바뀌고, 스올에는 죄인들을 위한 들음이 없습니다.


    그러므로 이제 이 모든 일이 일어나고 있는데도, 여러분은 그것들이 갚아지지 않는다고 생각합니까? 그러므로 어느 날, 땅의 주민들은 …


    그러니 제가 아직 살아 있는 동안 이 일들을 여러분에게 알려 주었다면 — 거짓에 속한 이들의 죄책은 크며, 그들의 완전한 분량을 제가 드러냈기 때문입니다. 그들은 처음부터 거짓에서 나서 죽음에 이르도록 태어났기 때문입니다 — 또 제가 여러분은 가르침을 받아야 한다고 말하였다면: 들으십시오, 행하십시오, 그리고 말하십시오.


    「율법을 어기면 너희는 흩어지고, 너희 땅에서 옮겨질 것이다.」 예레미야도 여러분 곁에 있을 때 여러분에게 말하였는데, 그때 여러분의 조상들은 광야에서 사십 년 동안 있었습니다. 그리고 여호수아가 죽은 뒤, 그리고 모세가 여러분에게서 취해진 뒤에도, 여러분의 지파들은 여전히 굳게 서 있었습니다. 모세는 이 일들이 여러분에게 닥칠 것을 미리 말하였습니다. 그리고 그것들이 실제로 닥쳤을 때, 그것이 율법에 따른 것임을 아십시오.


    그러므로 이제 제가 여러분이 본 뒤에 또 말합니다. 여러분에게 닥친 것들을 따라 그릇된 길로 가지 마십시오. 여러분은 전능하신 분께서 주신 영원한 나라와, 여러분을 위해 예비된 것을 받게 될 것입니다. 그러나 자녀들아, 전능하신 분의 명령들이 여러분에게 주어졌을 때 여러분이 헛된 데 넘겨진 것이 아님을 아십시오. 아무도 심판의 자리 앞에서 영으로 나아가지 못합니다. 오히려 돌이켜 그의 뜻과 그의 율법, 그리고 거룩한 백성과 회중들과 그의 성소들과 아름다운 일들을 인정하십시오. 그릇된 길로 가지 마십시오 …[a][b][c]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܦܪܐ
  english_pob_choice: into dust where it was born
  chosen_korean: 흙에서 난 것은 흙으로 돌아가고
  alternatives_korean:
  - 먼지로 돌아가고
  - 태어난 곳인 흙으로 돌아가고
  lexicon: Payne Smith
  rationale: 출생-귀속의 대조를 살리기 위해 단순한 ‘먼지’보다 ‘흙’과 ‘돌아가고’를 사용해, 피조물의 유한성과 기원성을 함께 드러냈습니다.
- source_word: ܚܛܘ̈ܦܝ ܕܐܓܪܐ
  english_pob_choice: the snatchers of wages
  chosen_korean: 품삯을 강탈하는 자들
  alternatives_korean:
  - 임금을 빼앗는 자들
  - 품삯을 낚아채는 자들
  lexicon: Payne Smith
  rationale: Syriac의 ܚܛܘܦܐ는 ‘강탈자/약탈자’의 뜻이므로, POB의 윤리·사법적 뉘앙스를 살려 ‘강탈하는 자들’로 옮겼습니다.
- source_word: ܡܘܬܐ ܕܐܓܪܐ ܕܚ̈ܫܐ
  english_pob_choice: the death that is the wage of sufferings
  chosen_korean: 고난의 삯인 죽음
  alternatives_korean:
  - 고난의 대가인 죽음
  - 고난이 받는 삯인 죽음
  lexicon: Payne Smith
  rationale: ‘삯/품삯’의 보응 구조를 유지하면서, 수동형 ‘거두어집니다’와 연결되도록 간결하게 구성했습니다.
- source_word: ܡܠܚܡܘܬܐ
  english_pob_choice: accomplished conflict
  chosen_korean: 완성된 싸움
  alternatives_korean:
  - 성립된 전투
  - 실현된 충돌
  lexicon: Payne Smith
  rationale: 원문은 ‘made conflict’의 이상한 결합을 보존해야 하므로, 완결된 상태의 충돌성을 살려 직역 쪽으로 유지했습니다.
- source_word: ܫܝܘܠ
  english_pob_choice: Sheol
  chosen_korean: 스올
  alternatives_korean:
  - 무덤
  - 음부
  lexicon: Payne Smith
  rationale: 문맥이 단순한 무덤이 아니라 사후 세계를 가리키므로, 교회 전통의 ‘음부’보다 음역어 ‘스올’이 원문 범주를 더 정확히 보존합니다.
- source_word: ܚܝܠܬܐ
  english_pob_choice: the Mighty One
  chosen_korean: 전능하신 분
  alternatives_korean:
  - 능하신 분
  - 강하신 분
  lexicon: Payne Smith
  rationale: 2 Baruch의 고유한 신칭을 한국어에서 자연스럽고 장엄하게 살리기 위해 ‘전능하신 분’으로 옮겼습니다.
theological_decisions:
- issue: ‘hearing’ in Sheol / presence of postmortem judgment
  chosen_reading: 스올에는 죄인들을 위한 들음이 없습니다.
  alternative_readings:
  - 스올에는 죄인들을 위한 응답이 없습니다.
  - 스올에서는 죄인들을 들을 수 없습니다.
  rationale: 시리아어의 ‘듣다/들음’은 단순 청각이 아니라 심판 앞에서 더는 호소가 통하지 않는 상태를 가리키므로, 그 긴장을 유지했습니다.
  doctrine_reference: apocalyptic judgment imagery
- issue: ‘realm of change’ and ‘accomplished conflict’
  chosen_reading: 변동의 영역은 완성된 싸움으로 바뀌고
  alternative_readings:
  - 변화의 영역은 완결된 분쟁이 되고
  - 변전의 영역은 이루어진 충돌이 됩니다
  rationale: 본문은 질서의 붕괴와 종말적 대립을 병렬로 그리므로, 의미를 완화하지 않고 이상한 결합을 한국어에서도 드러냈습니다.
  doctrine_reference: textual fidelity to apocalyptic rhetoric
