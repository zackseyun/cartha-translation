  text: 'submit_2baruch_chapter_draft({"english_text":"… into dust where it was born[a]. And the possession of wealth will no longer turn back, but will seek death in its craving. And the snatchers of wages will bring forth death before its time, and the death that is the wage of sufferings will be taken away. And no matter of joy will remain for delight. And the realm of change will be turned into accomplished conflict, and there will be no hearing for sinners in Sheol.\n\nSince, then, all these things now come to pass, do you think they are not requited? One day, therefore, the inhabitants of the earth … If, then, I have made these things known to you while I still live—for great is the burden of guilt for those who belong to falsehood, and I set forth its full measure, because from falsehood they were begotten from the beginning, unto death—and I have said that you ought to be instructed: hear, and do, and say.\n\n\"If you transgress the law, you will be scattered, and you will be removed
    from your land.\" Jeremiah also spoke to you while he was with you, when your fathers were forty years in the wilderness. And after the death of Joshua, and after Moses had been taken from you, your tribes still remained established. Moses told you beforehand that these things would come upon you; and when they did come upon you, know that it was according to the law.\n\nSo now I also say to you, after what you have seen: do not go astray after those things that have come upon you. You will receive from the Mighty One the kingdom that endures, and what has been laid up for you. But know, children, that you were not handed over to emptiness when the commandments of the Mighty One were given to you; and no one goes forth by the spirit before the place of judgment. Rather, turn back to acknowledge his will and his law, and the holy people, and the assemblies, and his sanctuaries, and the beautiful works. Do not go astray …","translation_philosophy":"optimal-equivalence","lexical_decisions":[{"source_word":"ܫܝܘܠ","chosen":"Sheol","alternatives":["the
    grave","the underworld"],"lexicon":"Payne Smith","entry":null,"rationale":"I retained the Semitic term rather than flattening it to ''grave,'' because the line carries more than mere burial; it evokes the postmortem realm in an apocalyptic-judicial setting."},{"source_word":"ܫܘܩܪܐ / ܫܘܩܪܝܗ","chosen":"falsehood / the love of falsehood","alternatives":["lying","deceit"],"lexicon":"Payne Smith","entry":null,"rationale":"The repeated root points to moral falsity rather than a single spoken lie, so ''falsehood'' better preserves the broader ethical force."},{"source_word":"ܚܝܒܘܬܐ","chosen":"the burden of guilt","alternatives":["culpability","indebtedness"],"lexicon":"Payne Smith","entry":null,"rationale":"The context is judicial and accusatory; ''burden of guilt'' keeps the weight of liability without sounding overly technical."},{"source_word":"ܢܡܘܣܐ","chosen":"law","alternatives":["instruction","Torah"],"lexicon":"Payne Smith","entry":null,"rationale":"''Law'' is the most natural covenantal
    rendering in this exhortational context, especially with the Moses reference. I did not use ''Torah'' because the chapter''s English register elsewhere remains translated rather than transliterated."},{"source_word":"ܚܝܠܬܐ","chosen":"the Mighty One","alternatives":["the Strong One","God"],"lexicon":"Payne Smith","entry":null,"rationale":"This is a recurring divine title in 2 Baruch. Keeping ''the Mighty One'' preserves the book''s characteristic diction and avoids flattening the epithet into a generic divine name."},{"source_word":"ܡܠܟܘܬܐ ܕܩܝܡܐ","chosen":"the kingdom that endures","alternatives":["the abiding kingdom","the lasting kingdom"],"lexicon":"Payne Smith","entry":null,"rationale":"I rendered the phrase with explicit durative force, since the contrast is with present instability and exile."},{"source_word":"ܦܘܩ̈ܕܢܘܗܝ","chosen":"his commandments","alternatives":["his charges","his ordinances"],"lexicon":"Payne Smith","entry":null,"rationale":"''Commandments'' best fits the paraenetic
    tone and keeps continuity with covenant obedience language."},{"source_word":"ܡܬܬܒܥܝܢ","chosen":"are requited","alternatives":["are avenged","are sought out"],"lexicon":"Payne Smith","entry":null,"rationale":"The Syriac has a judicial sense of being called to account. ''Requited'' keeps that moral-legal force without over-narrowing it to vengeance alone."}],"theological_decisions":[{"issue":"Rendering of ܫܝܘܠ","chosen_reading":"The text retains ''Sheol'' in the main line.","alternative_readings":["the grave","hell"],"rationale":"Neither ''grave'' nor ''hell'' cleanly fits the Syriac. ''Sheol'' preserves the text''s underworld imagery without importing a later doctrinal system.","doctrine_reference":null},{"issue":"Divine title ܚܝܠܬܐ","chosen_reading":"The divine epithet is rendered ''the Mighty One.''","alternative_readings":["God","the Strong One"],"rationale":"This preserves a marked title used throughout the book and keeps the elevated covenantal-apocalyptic register.","doctrine_reference":null}],"footnotes":[{"marker":"a","text":"The
    supplied Ceriani bucket opens mid-sequence on printed p. 175, so the English begins with an ellipsis rather than pretending the chapter starts cleanly here.","reason":"textual_variant"},{"marker":"b","text":"The lines around ''If, then, I have made these things known to you while I still live'' are textually rough in this bucket and may sit near a chapter edge; the rendering stays cautious and close to the Syriac sense.","reason":"textual_variant"},{"marker":"c","text":"The exhortation that cites Moses and Jeremiah likely overlaps the opening of the next chapter in standard numbering[c][b]. It is translated here in Ceriani page order and not forced into false chapter precision.","reason":"alternative_reading"}]})'
