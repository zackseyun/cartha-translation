  text: '1 But I will speak as I understand[a], and I will speak against you, land that prospers.


    2 The noonday blaze does not burn forever, nor do the rays of the sun keep giving light.


    3 Do not expect, and do not hope, that you will always have prosperity and joy. Do not lift yourself up too high, and do not oppress.


    4 For surely wrath will awaken against you in its appointed season; for now it is restrained by longsuffering, as by a bridle.


    5 And after I had spoken these things[b], I fasted seven days.'
  footnotes:
  - marker: a
    text: The Ceriani chapter bucket crosses an unstable page boundary here. This draft stops at ‘And when I had spoken these things, I fasted seven days,’ since the following lines on p0221 begin the next chapter’s scene.
    reason: textual_variant
  - marker: b
    text: The clause behind ‘lifted up and left unpunished’ is textually rough in the present Ceriani/OCR state; the rendering is cautious and keeps the warning sense without claiming perfect certainty for each verb nuance.
    reason: alternative_reading
translation:
  language: ko
  text: '1 그러나 나는 내가 이해하는 대로 말하고, 번성하는 땅이여, 너를 대적하여 말하겠습니다.


    2 정오의 불꽃은 영원히 타지 않으며, 해의 광선도 계속 빛을 주지는 않습니다.


    3 항상 번영과 기쁨이 있을 것이라고 기대하지도, 바라지도 마십시오. 스스로를 너무 높이지도 말고, 억누르지도 마십시오.


    4 정해진 때에 진노가 반드시 너를 향해 깨어날 것이기 때문입니다. 지금은 오래 참으심으로—마치 굴레를 씌운 것처럼—억제되어 있습니다.


    5 그리고 내가 이 말들을 한 뒤에, 나는 일곱 날 동안 금식했습니다.[a][b]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܝܟ ܕܡܫܬܡܥ ܐܢܐ
  english_pob_choice: as I understand
  chosen_korean: 내가 이해하는 대로
  alternatives_korean:
  - 내가 듣는 대로
  - 내게는 그렇게 여겨지는 대로
  lexicon: Payne Smith
  rationale: 반성적 독백의 문맥에서 단순 청취보다 ‘이해’의 뉘앙스가 자연스럽고, 영어 POB의 판단도 그 방향을 따릅니다.
- source_word: ܦܠܓܗ ܕܝܘܡܐ / ܡܫܬܘܙܒ
  english_pob_choice: the blaze of noon does not burn forever
  chosen_korean: 정오의 불꽃은 영원히 타지 않으며
  alternatives_korean:
  - 한낮의 더위는 항상 타지 않으며
  - 정오의 열기는 끝없이 지속되지 않으며
  lexicon: Payne Smith
  rationale: 시적 이미지인 ‘타는 불꽃/열기’를 구체적으로 살려, 단순한 추상적 번영이 아니라 지나가는 강한 열의 비유를 유지했습니다.
- source_word: ܬܬܢܣܒ ܘܬܫܬܒܩܝܢ
  english_pob_choice: be lifted up and left unpunished
  chosen_korean: 스스로를 너무 높이지도 말고, 억누르지도 마십시오
  alternatives_korean:
  - 높아지고 벌받지 않으리라고 여기지도 마십시오
  - 들려 올려지고 처벌받지 않으리라 기대하지도 마십시오
  lexicon: Payne Smith
  rationale: 본문의 다소 거친 Syriac는 ‘들려 올려짐’과 ‘면책/놓여남’의 경고를 담지만, 영어 POB처럼 경고의 핵심을 살리되 한국어에서는 자연스러운 금령형으로 풀었습니다.
- source_word: ܡܬܬܒܪܐ ܒܥܝܢܝ ܚܛܝ̈ܐ
  english_pob_choice: wrath will awaken
  chosen_korean: 진노가 반드시 … 깨어날 것이기 때문입니다
  alternatives_korean:
  - 진노가 일어날 것이기 때문입니다
  - 진노가 분명히 솟구칠 것이기 때문입니다
  lexicon: Payne Smith
  rationale: 잠들어 있다가 깨어나는 이미지로, 예정된 시점에 숨겨져 있던 진노가 분명히 드러난다는 뜻을 살렸습니다.
theological_decisions:
- issue: 진노의 성격
  chosen_reading: 진노는 단순한 사회적 역전이 아니라 죄에 대한 실제적이고 예정된 도덕-신학적 응답으로 읽었습니다.
  alternative_readings:
  - 운명의 반전이나 정치적 쇠락에 대한 일반적 경고
  rationale: 시리아어는 ‘정해진 때’와 ‘진노’의 결합으로 경고를 신학적으로 구성하므로, 이를 약화하지 않았습니다.
