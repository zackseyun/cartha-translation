  yaml_path: translation/extra_canonical/2_baruch/078.yaml
  text: 7 For he is merciful[a], he whom you seek, and he is gracious, he in whom you hope. And he sees to it that he preserves and does not forsake. 8 Or have you not seen what happened to Zion? 9 Or did you think that the cedar sinned, and therefore was laid waste, or that the people acted foolishly, and therefore were handed over? 10 And do you not know that because of you, those who did not sin were overthrown, and because of those things that you did, those who were not foolish were delivered up? 11 And all the people answered and said to me, “As for all that we are able to say before you of the good things that the Mighty One did with you, we will make them known to you. 12 But now, ask on our behalf from above. And you also, before you depart from us, write a letter of instruction and of hope to our brothers, 13 so that you may show them also that what has gone from us has not gone from them. For the shepherds of Israel have perished, and the lamps that gave light are extinguished[b],
    and the springs from which we used to drink have been stopped. 14 And we are left in darkness and in the thick forest and in the thirst of the wilderness.” 15 And I answered and said to them, “The former fathers and the prophets were taken from us, 16 but we were left with the law. Therefore, if you look in the law and are intent in wisdom, what is more than these will not be lacking. And the shepherd will not flee, and the spring will not fail. 17 But as you said to me, I will go to Babylon, to your brothers, and I will send encouragement by the hand of scribes[c][b][a][c]. And I will make a letter and send it by an eagle.”
  footnotes:
  - marker: a
    text: This Ceriani page-bucket overlaps the close of the preceding scene. In the standard chapter division reflected in Kmosko and Charles, most of this material belongs to 2 Baruch 77, and the epistle proper begins after the eagle commission.
    reason: textual_variant
  - marker: b
    text: The Ceriani OCR in this clause is corrupt and includes a nonsensical reading; the English follows the sense secured by the Kmosko control witness and the broader passage logic.
    reason: textual_variant
  - marker: c
    text: The triad 'lamp / shepherd / spring' is restored with help from Kmosko page 613, where the Ceriani bucket is visibly unstable at this edge.
    reason: textual_variant
  - marker: a
    text: Or 'whom you seek, and gracious is he in whom you hope; he watches'.
    reason: previous_rendering
  - marker: b
    text: Or 'that what has departed from us has not wholly departed'.
    reason: previous_rendering
  - marker: c
    text: Or 'the lamp will not fail, and the shepherd will not be lacking'.
    reason: previous_rendering
translation:
  language: ko
  text: 7 그분은 여러분이 찾는 분이시며, 자비로우시고, 여러분이 바라는 분이시며, 은혜로우십니다. 그분은 보존하시고 버리지 않으신다는 것을 보살피십니다. 8 여러분은 시온에게 일어난 일을 보지 못하였습니까? 9 아니면 삼나무가 죄를 지어서 황폐해졌다고, 혹은 백성이 어리석게 행해서 넘겨졌다고 생각하였습니까? 10 여러분 때문에 죄짓지 않은 이들이 뒤엎어졌고, 여러분이 한 일 때문에 어리석지 않은 이들이 넘겨졌다는 것을 알지 못합니까? 11 그러자 온 백성이 나에게 대답하여 말하였습니다. “전능하신 분이 당신과 함께 행하신 좋은 일들에 대하여 우리가 당신 앞에서 말할 수 있는 만큼은, 우리가 당신에게 알려 드리겠습니다. 12 그러나 이제 우리를 위하여 높은 곳에서 간구해 주십시오. 그리고 당신도 우리를 떠나시기 전에, 우리 형제들에게 교훈과 희망의 편지를 써 주십시오. 13 그래서 우리에게서 지나간 것이 그들에게서도 지나가지 않았다는 것을 그들에게도 보여 주십시오. 이스라엘의 목자들이 사라졌고, 빛을 비추던 등불들은 꺼졌으며, 우리가 마시던 샘들은 막혔습니다. 14 우리는 어둠과 짙은 숲과 광야의 목마름 속에 남겨졌습니다.” 15 나는 그들에게 대답하여 말하였습니다. “옛 조상들과 예언자들은 우리에게서 거두어졌지만, 우리는 율법과 함께 남겨졌습니다. 그러므로 율법을 살피고 지혜에 전념하면, 이것들보다 더한 것은 부족하지 않을 것입니다. 목자는 도망하지 않을 것이며, 샘은 끊어지지 않을 것입니다. 17 그러나 당신이 내게 말한 대로, 나는 바빌론으로 가서 당신들의 형제들에게 가고, 서기관들의 손을 통해 격려를 보낼 것입니다. 그리고 나는 편지를 써서 독수리를 통해 보낼 것입니다.”[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܚܣܢܢܐ
  english_pob_choice: merciful / gracious
  chosen_korean: 자비로우시고 / 은혜로우십니다
  alternatives_korean:
  - 긍휼하시고 / 은혜로우십니다
  - 자애로우시고 / 은혜로우십니다
  lexicon: Payne Smith
  rationale: 반복 병렬을 살리기 위해 첫 항은 자비, 둘째 항은 은혜로 옮겼습니다. 두 표현 모두 관계적 호의와 베풂의 의미를 담되 한국어 합쇼체에서 자연스럽습니다.
- source_word: ܕܒܥܝܢ ܐܢܬܘܢ ܠܗ / ܕܡܣܒܪܝܢ ܐܢܬܘܢ ܒܗ
  english_pob_choice: he whom you seek / he in whom you hope
  chosen_korean: 여러분이 찾는 분 / 여러분이 바라는 분
  alternatives_korean:
  - 여러분이 구하는 분 / 여러분이 믿고 바라는 분
  - 여러분이 찾는 이 / 여러분이 기대하는 이
  lexicon: Payne Smith
  rationale: 동사의 대응을 살리되, 본문이 단순한 종교적 '예배'가 아니라 실제로 찾고 바라는 대상을 말하므로 '찾다/바라다'로 직역에 가깝게 옮겼습니다.
- source_word: ܪ̈ܥܘܬܐ / ܡܒܘ̈ܥܐ
  english_pob_choice: shepherds / springs
  chosen_korean: 목자들 / 샘들
  alternatives_korean:
  - 목자들 / 원천들
  - 목자들 / 샘물들
  lexicon: Payne Smith
  rationale: 비유를 보존하기 위해 사람은 목자, 생명 공급의 이미지는 샘으로 유지했습니다. 이어지는 '마시다'와도 잘 맞습니다.
- source_word: ܝܘܠܦܢܐ
  english_pob_choice: instruction
  chosen_korean: 교훈
  alternatives_korean:
  - 가르침
  - 훈계
  lexicon: Payne Smith
  rationale: 편지의 기능이 단순 정보 전달이 아니라 형제들을 세우는 권면이므로, 한국어 교회 문맥에서 이해 가능한 '교훈'을 택했습니다.
theological_decisions:
- issue: '''버리지 않으신다''와 ''보존하신다''의 병렬을 어떻게 살릴지'
  chosen_reading: 그분은 보존하시고 버리지 않으신다는 것을 보살피십니다.
  alternative_readings:
  - 그분은 지키시고 버리지 않으십니다.
  - 그분은 보존하시고 떠나지 않으십니다.
  rationale: 시리아어는 보존과 버리지 않음의 이중 진술을 담고 있어 둘 다 드러냈습니다. '보살피십니다'는 전치사구의 결과적 뉘앙스를 살리려는 보조 표현입니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: 17절의 '서기관들의 손을 통해'를 어떻게 처리할지
  chosen_reading: 서기관들의 손을 통해 격려를 보낼 것입니다.
  alternative_readings:
  - 서기관들의 손을 빌려 격려를 보낼 것입니다.
  - 서기관들을 통해 격려를 보낼 것입니다.
  rationale: 수단 표지를 그대로 살려, 기록된 편지와 전달 행위를 함께 보이게 했습니다. 본문의 문학적 장치가 '손'에 강조점을 두므로 이를 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 2
