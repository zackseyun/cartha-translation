  to: 사라지지 않는 때가 오고 그 시기가 이르면, 그 때는 자기 행위를 정돈하고 자기 죄를 살핍니다. 그 때에 속한 사람들은 멸망에 고통을 더하지 않습니다.
  rationale: ‘징계하다’를 원문의 조사 의미를 반영하는 ‘살피다’로 바로잡고, 주어를 ‘그 때’로 명확히 했습니다. ‘그 때에 속한 사람들’은 영어 감사 번역의 관계 표현을 따르되, 난해한 원문의 관계를 교리적으로 확정하지 않습니다.
