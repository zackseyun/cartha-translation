    rationale: 요청된 현대 표준어 합쇼체에 맞추어 ‘사라지지 않는 때’ 및 ‘-습니다’로 고칩니다.
  revised_text: 사라지지 않는 때가 오고 그 시기가 이르면, 그 때는 자기 행위를 정돈하고 자기 죄를 살핍니다. 그 때에 속한 사람들은 멸망에 고통을 더하지 않습니다.
