  naturalness: ‘지나가지 아니하는 때’와 ‘아니하느니라’는 현대 표준 한국어 합쇼체에 비해 부자연스럽고 문체가 고어적입니다. ‘사라지지 않는 때’와 종결형 ‘-습니다’가 자연스럽습니다.
  terminology: ‘멸망’은 destruction에 적절합니다. ‘고통’은 anguish를 무리 없이 반영합니다. 원문의 다소 난해한 소유·지시 관계는 해석적으로 과도하게 보충하지 않고 유지했습니다.
