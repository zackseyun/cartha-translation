translation:
  language: ko
  text: 만일 그 일을 하도록 임명된 사람이 있으면, 그 사람에게서는 제외되지 않습니다. 그리고 그 안에 사는 사람들은 멸망으로 인도되지 않을 것입니다.
  philosophy: optimal-equivalence
