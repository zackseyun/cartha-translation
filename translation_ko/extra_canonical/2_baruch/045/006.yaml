review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘그 일을 하도록 임명된’은 시리아어와 영어 감사본의 ‘그것을 위해 정해진/지정된’보다 의미를 지나치게 특정합니다. 또한 ‘그 안에 사는’의 선행사는 본문의 모호성을 유지해야 합니다.
  naturalness: ‘그 사람에게서는 제외되지 않습니다’는 무엇에서 제외되는지가 불명확하고 원문의 ‘withheld’에 맞지 않습니다. ‘그들에게서 거두어지지 않으며’가 더 자연스럽고 충실합니다.
  terminology: ‘멸망’은 ܐܒܕܢܐ에 적절합니다. 수동 표현 ‘멸망으로 끌려가지 않을 것입니다’는 원문의 표현과 영어 감사본의 의미를 보존합니다.
  issues:
  - severity: medium
    issue: ‘그 일을 하도록 임명된’
    rationale: 원문은 ‘그것을 위해 정해진/지정된 이들’이라는 표현으로 이해되며, 특정 과업을 수행하도록 임명되었다는 뜻으로 한정하지 않습니다.
  - severity: medium
    issue: ‘그 사람에게서는 제외되지 않습니다’
    rationale: 원문의 ‘그들에게서 거두어지지 않는다/보류되지 않는다’를 ‘제외’로 옮겨 의미가 달라지고, 지시 대상도 불명확해집니다.
  revised_text: 그리고 그것을 위해 정해진 사람들이 있다면, 그것은 그들에게서 거두어지지 않으며, 그 안에서 사는 사람들은 멸망으로 끌려가지 않을 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘그 안에서 사는 사람들에게는 멸망으로 끌려감이 없습니다.’
    reason: 시리아어의 비인칭적으로도 읽힐 수 있는 마지막 절을 자연스러운 한국어 수동문으로 번역하되, 영어 감사본에 보존된 대안적 표현을 제시합니다.
  revision_rationale: 지시어의 선행사가 본문상 명시되지 않은 점을 유지하면서, ‘appointed for it’의 의미를 과도하게 ‘어떤 일을 하도록 임명됨’으로 한정하지 않았습니다. 또한 ‘withheld’를 ‘거두어지지 않다’로 옮겨 원문의 의미 관계를 회복했습니다.
