  naturalness: ‘썩어졌던 것’, ‘손에서 지나간 것’, 그리고 문장 끝의 ‘때문입니다’는 현대 표준 한국어 합쇼체 성경 문체로 어색합니다. 병렬 진술은 ‘-고/-며’로 연결하고, 수동적 일반 진술은 ‘-집니다’로 옮기는 편이 자연스럽습니다.
