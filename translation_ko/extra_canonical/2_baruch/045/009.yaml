  source_fidelity: 초안은 핵심 대조(‘숨은 고뇌/고난’, ‘많은 사람이 의롭게 됨’, ‘보지 못함’)를 대체로 반영합니다. 그러나 Syriac의 ‘앞으로 올 백성/사람들’과 ‘그 일에 대한 방문·감찰(심판적 조사)’의 관계를 더 분명히 해야 하며, 끝맺음의 문체도 현대 합쇼체에 맞추어야 합니다.
  naturalness: ‘알아보고 싶어합니다’는 원문의 의지·추구를 다소 심리적 희망으로 약화합니다. ‘살피려 합니다’가 자연스럽고 가깝습니다. 또한 ‘보지 못하리라’는 현대 합쇼체와 일관되지 않습니다.
  terminology: ܡܒܩܪܐ(방문, 감찰, 조사)는 문맥상 단순한 ‘문제’ 자체가 아니라 그 일에 대한 심판적 감찰을 가리킵니다. 교파적 해석을 덧붙이지 않으면서 ‘심판’으로 옮겨 이 기능을 드러냅니다. ‘의롭다 하심을 얻다’는 가능하나, 수동 표현인 ‘의롭게 되다’가 원문의 간결성을 보존합니다.
  issues:
