    issue: ‘그 문제에 대하여’가 원문의 ‘그 일에 대한 방문/감찰’을 누락합니다.
    rationale: 본문은 많은 사람이 의롭게 된 ‘그 일’ 자체가 아니라 그 일에 대한 방문·감찰을 보지 못한다고 말합니다.
  - severity: low
    issue: ‘보지 못하리라’가 지정된 현대 합쇼체와 맞지 않습니다.
    rationale: ‘보지 못할 것입니다’로 통일하는 것이 현대 표준 한국어의 격식체에 적합합니다.
