  to: 그러므로 그것을 보고자 하는 이들이 언급된 때를 조심하고 환난의 때의 짐을 지나가게 하십시오.
  rationale: 원문의 대상과 ‘언급된 때’, 환난의 시기와 그 짐이라는 이미지를 유지하면서, 부자연스러운 ‘말한 때’와 ‘초월하게 하라’를 현대 한국어의 자연스러운 권고형으로 고쳤습니다. ‘그것’은 선행사가 본문 단위에서 확정되지 않으므로 그대로 두었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:27Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 ‘보고자 하는 자들’, ‘말한 때’, ‘고난의 때의 짐’이라는 주요 요소를 대체로 보존합니다. 그러나 시리아어의 권고/허용형(‘그들이 … 하게 하라’)과 ‘말해진/언급된 때’의 의미를 한국어에서 더 분명하고 자연스럽게 드러낼 필요가 있습니다. ‘초월하게 하라’는 원문의 ‘지나가다/넘어가다’보다 추상적이며, 목적어와의 결합도 부자연스럽습니다.
  naturalness: ‘말한 때를 주의하고’와 ‘짐을 초월하게 하라’는 현대 표준 한국어에서 어색합니다. ‘언급된 때를 조심하고’ 및 ‘… 지나가게 하십시오’가 자연스럽고 합쇼체 권고 형식을 유지합니다.
  terminology: ‘환난의 때’는 원문의 ‘괴롭고/험난한 때’를 충실하게 옮기며 묵시문학적 문맥에도 적합합니다. ‘짐’은 그대로 유지합니다. ‘그것’의 선행사는 본 절만으로 특정하지 않아 원문의 모호성을 보존합니다.
  issues:
  - severity: medium
    issue: ‘말한 때’와 ‘짐을 초월하게 하라’의 표현
    rationale: ‘말한 때’는 수식 관계가 부자연스럽고, ‘초월하다’는 원문의 공간적·비유적 ‘지나가다/넘어가다’보다 철학적으로 추상적입니다. 또한 ‘짐을 초월하다’는 한국어 결합이 자연스럽지 않습니다.
  - severity: low
    issue: 권고형의 표지 부족
    rationale: 원문은 ‘그들이 조심하게 하고/지나가게 하라’라는 권고·허용의 뉘앙스를 지닙니다. ‘…하게 하십시오’로 이를 드러낼 수 있습니다.
  revised_text: 그러므로 그것을 보고자 하는 이들이 언급된 때를 조심하고 환난의 때의 짐을 지나가게 하십시오.
