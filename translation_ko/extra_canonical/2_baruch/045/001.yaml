    reason: previous_rendering
translation:
  language: ko
  text: …부패에 속한 것들과 그 길들, 곧 어떠한 길들이든 찾아낼 수 없는 길들입니다.[a] 그러나 여러분이 견디고 그분을 경외하며 굳게 서서 그분의 율법에서 벗어나지 않으면, 때들이 정해진 때에 좋은 것으로 바뀔 것이며, 여러분은 시온의 위로를 보게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “찾아낼 수 없는 길들.”
    reason: 본문은 시리아어의 난해한 잔여 표현(직역하면 ‘그것들이 그것들이며’)을 ‘어떠한 길들이든’으로 보존합니다. 이 주는 그 표현을 생략한 간결한 번역 가능성을 제시합니다.
lexical_decisions:
- source_word: ܡܬܚܠܦܝܢ ... ܙܒ̈ܢܐ ܠܛܒܬܐ
  english_pob_choice: the times will be changed ... for good
  chosen_korean: 때가 제때에 맞게 좋은 것으로 바뀔 것이며
  alternatives_korean:
  - 시대가 좋은 때로 바뀔 것이며
  - 때들이 선한 것으로 변할 것이며
  lexicon: Payne Smith
  rationale: 시리아어의 ‘변하다/바뀌다’와 ‘좋은 것’을 살리되, 종말론적 문맥에 맞게 ‘때’의 질서가 전환된다는 뜻을 자연스럽게 옮겼습니다.
- source_word: ܒܘܝܐܐ
  english_pob_choice: consolation
  chosen_korean: 위로
  alternatives_korean:
  - 위안
  - 자위
  lexicon: Payne Smith
  rationale: ‘시온의 위로’라는 고정된 예언적 울림을 유지하면서, 한국어에서도 공동체적·종말론적 회복의 뉘앙스를 살릴 수 있어 ‘위로’를 택했습니다.
- source_word: ܢܡܘܣܗ
  english_pob_choice: his law
  chosen_korean: 그의 율법
  alternatives_korean:
  - 그의 법
  - 그의 가르침
  lexicon: Payne Smith
  rationale: 시리아어가 하나님의 규범적 명령을 가리키므로, 공적·성경적 용례에 맞는 ‘율법’을 유지했습니다.
- source_word: ܠܐ ܬܛܥܘܢ
  english_pob_choice: do not go astray
  chosen_korean: 벗어나지 않으면
  alternatives_korean:
  - 길을 잃지 않으면
  - 어긋나지 않으면
  lexicon: Payne Smith
  rationale: 단순한 지리적 오차가 아니라 규범에서 이탈하는 뜻이므로, 문맥에 맞게 ‘벗어나다’로 옮겼습니다.
- source_word: ܕܠܐ ܡܬܒ̈ܩܥܢ ܘܐ̈ܢܝܢ ܐ̈ܢܝܢ
  english_pob_choice: ways that cannot be searched out, whatever they may be
  chosen_korean: 찾아낼 수 없는 길들, 그것들이 무엇이든지
  alternatives_korean:
  - 찾아낼 수 없는 길들, 어떤 것이든지
  - 헤아릴 수 없는 길들, 무엇이든지
  lexicon: Payne Smith
  rationale: 영문 본문의 ‘searched out’보다 더 직접적으로, 시리아어의 ‘무엇이든/그것들이 무엇이든’이라는 잔여 구문을 한국어에 반영해 의미를 보존했습니다.
theological_decisions:
- issue: 시온의 회복을 개인적 위안이 아니라 종말론적 공동체 회복으로 유지할 것인가
  chosen_reading: ‘시온의 위로’를 보게 될 것입니다
  alternative_readings:
  - 시온의 위안을 얻게 될 것입니다
  - 시온이 위로받는 것을 보게 될 것입니다
  rationale: 본문은 시온을 회복의 중심으로 두므로, 단순 심리적 위안이 아니라 공동체와 성소/도성의 회복을 암시하는 표현을 유지했습니다.
  doctrine_reference: Zion restoration motif in apocalyptic literature
