- from: …썩어짐에 속한 것들과 그 길들, 곧 찾아낼 수 없는 길들, 그것들이 무엇이든지. 그러나 여러분이 견디며 그의 두려움 안에 서고 그의 율법에서 벗어나지 않으면, 때가 제때에 맞게 좋은 것으로 바뀔 것이며, 여러분은 시온의 위로를 보게 될 것입니다.[a]
  to: …부패에 속한 것들과 그 길들, 곧 어떠한 길들이든 찾아낼 수 없는 길들입니다.[a] 그러나 여러분이 견디고 그분을 경외하며 굳게 서서 그분의 율법에서 벗어나지 않으면, 때들이 정해진 때에 좋은 것으로 바뀔 것이며, 여러분은 시온의 위로를 보게 될 것입니다.
  rationale: 직역투를 줄이되 시리아어의 조건절, 경외의 의미, ‘굳게 서다’의 동작, 정해진 때에 일어나는 시대의 전환, 그리고 ‘무엇이든지’라는 난해한 잔여 표현을 모두 보존했습니다. 시온의 위로와 율법이라는 핵심 용어는 유지했습니다.
