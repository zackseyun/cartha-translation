  text: 'submit_2baruch_chapter_draft({"english_text":"Now[a], my brothers, learn first what was to happen. Nebuchadnezzar king of Babylon had set it in his heart to come up against the city. But we knew that no command from his mouth would go forth in vain, nor otherwise than he had appointed beforehand. For what had been determined beforehand was shown openly. And it was also revealed to me that angels were engaged against the city: they shook its walls and uprooted them, and the mighty wall with its strong iron corners they cast down. But at that time they hid the holy vessels, so that they might not be seen by the enemies.\n\nAnd when they had done these things, then they handed over to the enemies the broken wall, the plundered house, the burned temple, and the people who had been overcome and were being carried away, so that the enemies might not boast and say, ‘We have surrounded even the house of the Most High, and in battle we have thrown it down.’\n\nThey also bound your brothers
    and led them away to Babylon, and there they made them dwell. But we and our seed were left here, few and small. This is the affliction of the people about which I wrote to you. For you surely know that the humiliation of Zion has weighed heavily upon you, because your knowledge of her was greater than that of the people, since you were those who served there, while we were helping.","translation_philosophy":"optimal-equivalence","lexical_decisions":[{"source_word":"ܡܠܐܟ̈ܐ","chosen":"angels","alternatives":["messengers"],"lexicon":"Payne Smith","entry":null,"rationale":"In this apocalyptic setting the agents who dismantle the city are best understood as heavenly beings, not merely human envoys, so ‘angels’ preserves the theological force."},{"source_word":"ܫܘܪ̈ܝܗ̇ / ܫܘܪܝܐ ܕܒܪܝܬܐ","chosen":"its walls … the mighty wall","alternatives":["fortifications","ramparts"],"lexicon":"Payne Smith","entry":null,"rationale":"The Syriac points to the city’s defensive structures; ‘walls’ is the plain
    rendering, while ‘mighty wall’ preserves the intensified description in the damaged line."},{"source_word":"ܡܐ ܛܒܝ̈ܢ","chosen":"the holy vessels","alternatives":["the good things","the precious things"],"lexicon":"Payne Smith","entry":null,"rationale":"Literally the phrase can mean ‘good things,’ but in the immediate temple context it most naturally refers to the sanctuary vessels hidden before the city’s fall."},{"source_word":"ܐܫܠܡܘ","chosen":"they handed over","alternatives":["they delivered up","they surrendered"],"lexicon":"Payne Smith","entry":null,"rationale":"The verb carries the sense of giving over into another’s power. ‘Handed over’ keeps both the judicial and narrative force."},{"source_word":"ܚܘܪܐ","chosen":"the plundered house","alternatives":["the stripped house","the despoiled house"],"lexicon":"Payne Smith","entry":null,"rationale":"The line is textually rough, but the context pairs ruined wall, damaged house, and burned temple. ‘Plundered’ best fits that sequence."},{"source_word":"ܡܟܝܟ","chosen":"humiliation","alternatives":["abasement","lowliness"],"lexicon":"Payne
    Smith","entry":null,"rationale":"Near the close of the chapter the concern is Zion brought low[d][c][b]. ‘Humiliation’ preserves both the emotional and public-shame aspect."}],"theological_decisions":[{"issue":"Who truly brought down the city’s defenses","chosen_reading":"The city is portrayed as being given over only after heavenly agents act first.'
  footnotes:
  - marker: a
    text: The supplied Ceriani bucket overlaps the end of chapter 79 on p. 168 and the opening of chapter 81 on p. 171. This draft follows the chapter 80 core centered on the city’s surrender and the hidden sanctuary vessels.
    reason: alternative_reading
  - marker: b
    text: The lines describing the wall, its strong corners, and the ‘house’ are textually rough in Ceriani. The English keeps close to the likely sense without pretending every damaged detail is certain.
    reason: textual_variant
  - marker: c
    text: The final lines after ‘This is the affliction of the people’ are also rough. The rendering reflects the probable sense that the exiles’ grief was sharpened by their prior knowledge of and service in Zion.
    reason: textual_variant
  - marker: d
    text: Or 'from your mouth would go forth in vain, nor otherwise than you had appointed'.
    reason: previous_rendering
translation:
  language: ko
  text: '이제, 내 형제들아, 먼저 일어날 일을 알아야 합니다. 바빌론의 왕 느부갓네살은 그 성에 맞서 올라오기로 마음먹었습니다. 그러나 우리는 그의 입에서 나오는 명령이 헛되이 나가지도, 그가 미리 정한 것과 다르게도 되지 않으리라는 것을 알았습니다. 미리 정해진 것이 드러났고, 나에게도 그 성을 향해 천사들이 움직이고 있다는 것이 계시되었습니다. 그들은 성벽을 흔들어 무너뜨리고, 강한 철 모서리가 있는 큰 성벽도 허물어뜨렸습니다. 그러나 그때 그들은 거룩한 그릇들을 숨겨서 적들이 그것들을 보지 못하게 했습니다.


    그들이 이런 일을 하고 나서, 그들은 적들에게 무너진 성벽과 약탈당한 집과 불탄 성전과, 제압되어 끌려가고 있던 백성을 넘겨주었습니다. 이는 적들이 자랑하며 “우리가 지극히 높으신 분의 집까지 둘러쌌고, 전쟁에서 그것을 무너뜨렸다” 하고 말하지 못하게 하려는 것이었습니다.


    그들은 또한 여러분의 형제들을 묶어 바빌론으로 끌고 갔고, 거기에서 그들이 살게 했습니다. 그러나 우리와 우리 후손은 여기 남겨졌으니, 적고 미미합니다. 이것이 제가 여러분에게 쓴 그 백성의 환난입니다. 시온의 굴욕이 여러분에게 크게 무거웠다는 것을 여러분은 분명 알고 계십니다. 여러분은 그 백성보다 그것을 더 많이 알고 있었기 때문입니다. 여러분은 거기에서 섬기던 사람들이었고, 우리는 돕고 있었기 때문입니다.[a][b][c][d]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܘܪ̈ܝܗ̇ / ܫܘܪܝܐ ܕܒܪܝܬܐ
  english_pob_choice: its walls … the mighty wall
  chosen_korean: 성벽 … 큰 성벽
  alternatives_korean:
  - 요새
  - 방어 성벽
  - 성곽
  lexicon: Payne Smith
  rationale: 파괴되는 대상이 도시의 방어 구조물이라는 점을 살려 ‘성벽’으로 옮기고, 뒤의 강조 표현은 ‘큰 성벽’으로 두어 중복이지만 강세를 유지했습니다.
- source_word: ܡܐ ܛܒܝ̈ܢ
  english_pob_choice: the holy vessels
  chosen_korean: 거룩한 그릇들
  alternatives_korean:
  - 성전 기물들
  - 성소의 기물들
  - 거룩한 물건들
  lexicon: Payne Smith
  rationale: 직역하면 ‘좋은 것들’이 될 수 있으나, 성전 문맥에서는 숨겨지는 성전 기물/그릇을 가리키는 것으로 보는 해석이 가장 자연스러워 POB의 ‘holy vessels’를 따랐습니다.
- source_word: ܐܫܠܡܘ
  english_pob_choice: they handed over
  chosen_korean: 넘겨주었습니다
  alternatives_korean:
  - 건네주었습니다
  - 내주었습니다
  - 전달했습니다
  lexicon: Payne Smith
  rationale: 단순 전달보다 적의 손에 맡겨진 뉘앙스를 살리기 위해 ‘넘겨주었습니다’를 선택했습니다.
- source_word: ܚܘܪܐ
  english_pob_choice: the plundered house
  chosen_korean: 약탈당한 집
  alternatives_korean:
  - 약탈된 집
  - 노략당한 집
  - 털린 집
  lexicon: Payne Smith
  rationale: 문맥상 무너진 성벽, 불탄 성전과 나란히 놓인 파괴된 건물을 가리키므로, 약탈의 결과를 드러내는 ‘약탈당한 집’이 가장 잘 맞습니다.
- source_word: ܡܟܝܟ
  english_pob_choice: humiliation
  chosen_korean: 굴욕
  alternatives_korean:
  - 낮아짐
  - 비천함
  - 수치
  lexicon: Payne Smith
  rationale: 시온이 낮아지고 수치를 당한 상태를 공적 수치와 감정적 아픔을 함께 드러내는 ‘굴욕’으로 옮겼습니다.
theological_decisions:
- issue: 천사들의 역할을 어떻게 드러낼지
  chosen_reading: 성의 함락은 적의 힘만이 아니라, 먼저 하늘의 천사들이 მოქმედ한 하나님의 심판으로 제시됩니다.
  alternative_readings:
