  text: And it shall be, after he has brought low all that is in the world, and has sat down in peace forever on the throne of his kingdom, then joy will be revealed, and rest will appear.[a]
translation:
  language: ko
  text: 그가 세상의 모든 것을 낮추고, 자기 왕국의 왕좌에 영원히 평안히 앉으신 뒤에, 기쁨이 드러나고 안식이 나타날 것입니다.[a]
  philosophy: formal
lexical_decisions:
- source_word: “after he has brought low all that is in the world”
  english_pob_choice: after he has brought low all that is in the world
  chosen_korean: 세상의 모든 것을 낮추고
  alternatives_korean:
  - 세상에 있는 모든 것을 낮추고
  - 세상의 모든 것을 굴복시키고
  lexicon: 낮추다
  rationale: 시리아어 문맥의 ‘낮춤/굴복’ 동작을 간결하게 살리되, POB의 ‘brought low’를 과장된 정복 용어보다 중립적인 동사로 옮겼습니다.
- source_word: “sat down in peace forever on the throne of his kingdom”
  english_pob_choice: sat down in peace forever on the throne of his kingdom
  chosen_korean: 자기 왕국의 왕좌에 영원히 평안히 앉으신 뒤에
  alternatives_korean:
  - 그의 왕국의 보좌에 영원히 평안히 앉으신 뒤에
  - 그의 나라의 왕좌에 영원히 평화롭게 앉으신 뒤에
  lexicon: 앉다 / 왕좌 / 평안히
  rationale: ‘왕좌’는 통치의 좌위를, ‘평안히’는 평강의 상태를 살리며, 동사 ‘앉으신 뒤에’로 완료 뒤의 순서를 분명히 했습니다.
- source_word: “joy” / “rest”
  english_pob_choice: joy will be revealed, and rest will appear
  chosen_korean: 기쁨이 드러나고 안식이 나타날 것입니다
  alternatives_korean:
  - 기쁨이 나타나고 안식이 드러날 것입니다
  - 기쁨이 밝혀지고 안식이 나타날 것입니다
  lexicon: 기쁨 / 안식
  rationale: 영어 POB의 대비를 유지하면서, ‘드러나고/나타날’의 병렬로 종말적 현시를 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 왕국과 왕좌의 종말론적 통치 이미지
  chosen_reading: 메시아적 왕권이 완성된 뒤 기쁨과 안식이 공개적으로 드러난다는 시간적 순서를 따라 번역했습니다.
  alternative_readings:
  - 일반적인 평화 시대의 묘사로 완화하여 번역
  - ‘왕좌’를 비유적으로만 처리
  rationale: 본문은 통치 완료 뒤에 이어지는 결과를 말하므로, 통치-현시-안식의 순서를 흐리지 않도록 직역에 가깝게 유지했습니다.
  doctrine_reference: 종말론적 왕권과 새 질서의 현시
