base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/024.yaml
  text: '1 For look[a], days are coming when the books will be opened, in which are written the sins of all who have sinned, and also the storehouses in which the righteousness of all who have been righteous in creation is gathered.

    2 And at that time you will see—and many who are with you—the forbearance of the Most High, how he has been patient through all generations with those who are born, both with those who sin and with the righteous.

    3 And I answered and said, “But behold, Lord, who knows the number of those things that have passed, or of those things that are to come?

    4 For I know what has befallen us, but what will happen to our enemies I do not know[c][b], or when you will visit your works.”'
  footnotes:
  - marker: a
    text: The opening of this chapter falls near a tentative bucket edge in the current Ceriani segmentation. The main sense is clear, but exact verse-edge alignment may be refined after later control-witness review.
    reason: textual_variant
  - marker: b
    text: '''Storehouses'' could also be rendered ''treasuries''; the image is of righteousness being kept in reserve before the time of judgment.'
    reason: lexical_alternative
  - marker: c
    text: The final clause literally preserves the idiom of God 'visiting' his works, which may carry the sense of intervening in or calling to account the work of his hands.
    reason: lexical_alternative
translation:
  language: ko
  text: '1 보십시오, 날들이 와서 책들이 펼쳐질 것이며, 그 안에는 죄를 지은 모든 이들의 죄가 기록되어 있고, 또한 창조 때부터 의로웠던 모든 이의 의가 모여 있는 곳도 있습니다.


    2 그때에 여러분은—그리고 여러분과 함께 있는 많은 이들도—지극히 높으신 분의 오래 참으심을 보게 될 것입니다. 곧 그분께서 태어난 모든 이들, 죄를 짓는 이들과 의로운 이들에게 걸쳐 모든 세대에 걸쳐 참으신 것을 보게 될 것입니다.


    3 내가 대답하여 말했습니다. “그러나 보십시오, 주님, 지나간 것들의 수를 누가 알겠습니까, 또는 장차 올 것들의 수를 누가 알겠습니까?


    4 저는 우리에게 일어난 일은 압니다. 그러나 우리의 적들에게 무슨 일이 일어날지는 알지 못합니다. 또한 언제 주님께서 주님의 일들을 찾아오실지도 알지 못합니다.”[a][b]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܟܬܒ̈ܐ
  english_pob_choice: books
  chosen_korean: 책들이
  alternatives_korean:
  - 기록들이
  - 두루마리들이
  lexicon: Payne Smith
  rationale: 심판적 공개라는 이미지를 살리면서도 원문의 복수 명사를 자연스러운 한국어로 옮기기 위해 ‘책들이’를 택했습니다.
- source_word: ܓܙ̈ܐ
  english_pob_choice: storehouses
  chosen_korean: 모여 있는 곳
  alternatives_korean:
  - 창고들
  - 보관소들
  - 보물창고들
  lexicon: Payne Smith
  rationale: 본문은 의가 저장된 장소의 비유를 말하므로, 한국어에서 과도하게 물질적인 ‘창고’보다 기능을 드러내는 ‘모여 있는 곳’이 문맥에 더 자연스럽습니다.
- source_word: ܡܓܪܬ ܪܘܚܗ ܐܪܝܟܬܐ
  english_pob_choice: forbearance
  chosen_korean: 오래 참으심
  alternatives_korean:
  - 인내
  - 참으심
  - 오래 참으시는 인내
  lexicon: Payne Smith
  rationale: 단순한 지연이 아니라 세대를 걸친 하나님의 지속적인 절제를 나타내므로, ‘오래 참으심’이 그 무게를 가장 잘 반영합니다.
- source_word: ܦܩܕ ܒܥܒ̈ܕܝܟ
  english_pob_choice: visit your works
  chosen_korean: 주님의 일들을 찾아오실
  alternatives_korean:
  - 주님의 일들을 방문하실
  - 주님의 일에 개입하실
  - 주님의 일의 책임을 물으실
  lexicon: Payne Smith
  rationale: 시리아어 관용구가 하나님의 ‘방문’ 곧 개입/심판의 의미를 가질 수 있으므로, 문맥을 살려 ‘찾아오실’을 사용해 열린 의미를 유지했습니다.
theological_decisions:
- issue: ‘의’가 저장되는 장소의 성격
  chosen_reading: 본문은 의로운 행위만이 아니라 의로운 자의 상태와 행위가 함께 간직된다는 넓은 뜻을 살리도록 번역했습니다.
  alternative_readings:
  - 의로운 행위
  - 공로
  - 의로운 삶의 기록
  rationale: 원문과 POB가 모두 심판적 저장 이미지의 폭을 유지하므로, 한국어도 한 항목으로 좁히지 않고 ‘의’와 ‘모여 있는 곳’으로 보존했습니다.
  doctrine_reference: Translation philosophy §1 (Original-language primacy over translation tradition)
- issue: ‘오래 참으심’의 신학적 뉘앙스
  chosen_reading: 하나님의 인내를 단순한 호의가 아니라 세대를 넘어 죄인과 의인 모두에게 미치는 절제와 유예로 번역했습니다.
  alternative_readings:
  - 일반적인 자비
  - 느린 분노
  - 관용
  rationale: 본문은 하나님의 인내가 죄에 대한 승인 없이도 역사 전반에 걸쳐 지속된다는 긴장을 유지합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
