base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/065.yaml
  text: '1. And after Manasseh, Amon acted impiously, and in his own time he thought that the Mighty One would not call these things to account.


    2. These are the ninth black waters that you saw.'
translation:
  language: ko
  text: '1. 므낫세 다음에 아몬은 불경스럽게 행동했고, 자기 때에 전능하신 분이 이러한 일들을 심문하실 리 없다고 생각했습니다.


    2. 이것들은 네가 본 아홉 번째 검은 물입니다.[a][b]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܒܕ ... ܒܠܚܘܕܘܗܝ / acted impiously
  english_pob_choice: acted impiously
  chosen_korean: 불경스럽게 행동했습니다
  alternatives_korean:
  - 경건치 않게 행동했습니다
  - 불의하게 행했습니다
  lexicon: impious
  rationale: 아몬의 행위를 단순한 정치적 실책이 아니라 하나님을 향한 불경으로 나타내므로, 현대 한국어에서 의미가 분명한 ‘불경스럽게’로 옮겼습니다.
- source_word: ܒܙܒܢܗ / in his own time
  english_pob_choice: in his own time
  chosen_korean: 자기 때에
  alternatives_korean:
  - 그의 시대에
  - 그때에
  lexicon: time
  rationale: 행동 시점을 가리키는 표현으로, POB의 ‘in his own time’ 뉘앙스를 간결하게 살려 ‘자기 때에’로 렌더링했습니다.
- source_word: ܡܪܐ ... / the Mighty One
  english_pob_choice: the Mighty One
  chosen_korean: 전능하신 분
  alternatives_korean:
  - 능력자
  - 힘센 분
  lexicon: divine epithet
  rationale: 하나님을 가리키는 칭호로서 인격적·존칭적 울림을 유지하면서도, 원문의 ‘Mighty’ 의미를 한국어에서 자연스럽게 드러내기 위해 ‘전능하신 분’을 택했습니다.
- source_word: ܢܩܘܒ / call to account
  english_pob_choice: call these things to account
  chosen_korean: 이러한 일들을 심문하실 리 없다고
  alternatives_korean:
  - 이러한 일들을 따져 물으실 리 없다고
  - 이러한 일들을 벌하실 리 없다고
  lexicon: accountability
  rationale: 문맥상 단순한 ‘조사’가 아니라 악행에 대한 책임 추궁을 뜻하므로, 도덕적·사법적 책임을 드러내는 ‘심문하다’ 계열로 옮겼습니다.
- source_word: ܡ̈ܠܐ / These are
  english_pob_choice: These are
  chosen_korean: 이것들은
  alternatives_korean:
  - 이것이
  - 이것들은 바로
  lexicon: demonstrative
  rationale: 계시적 해설 문장으로서 지시 대상을 분명히 하는 복수 지시형을 유지했습니다.
theological_decisions:
- issue: 아몬의 평가를 역사적 서술이 아니라 신학적 판정으로 제시하는 방식
  chosen_reading: ‘불경스럽게 행동했고’로 번역해 행위의 신학적 성격을 직접 드러냈습니다.
  alternative_readings:
  - ‘악하게 행동했고’
  - ‘경건하지 않게 행동했고’
  rationale: 본문은 단순한 도덕 평가보다 하나님께 대한 불경을 강조하므로, 독자가 그 신학적 판단을 놓치지 않도록 더 직접적인 표현을 선택했습니다.
  doctrine_reference: 2 Baruch의 예언적 역사 해석
- issue: ‘전능하신 분’이 요구하는 책임 추궁의 어조
  chosen_reading: ‘심문하실 리 없다고 생각했습니다’로 번역해, 하나님이 악행을 그냥 넘어가실 것이라는 오만을 드러냈습니다.
  alternative_readings:
  - ‘묻지 않으실 것이라고 생각했습니다’
  - ‘벌하지 않으실 것이라고 생각했습니다’
  rationale: 원문은 아몬의 자기기만을 강조하므로, 책임을 묻는 하나님의 심판 개념이 드러나도록 했습니다.
  doctrine_reference: 하나님의 심판과 인간 책임
- issue: POB의 ‘black waters’ 이미지 보존
  chosen_reading: ‘검은 물’로 직역해 상징성을 보존했습니다.
  alternative_readings:
  - ‘흑수’
  - ‘검은 강물’
  rationale: 이 절은 앞선 환상 해설의 표지이므로 이미지의 이질감을 줄이지 않고 그대로 살리는 것이 적절합니다.
  doctrine_reference: 환상 해석의 상징어 유지
