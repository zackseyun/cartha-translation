  source_fidelity: 초안의 ‘선지자를 받았느냐’는 수혜자를 주어로 삼아 ‘예언자들이 주어졌다’라는 수동 표현인 원문 및 영어 감사본의 의미를 바꾸므로 수정이 필요합니다. 또한 원문의 ‘선한 일/선의 수고’가 ‘구하다’와 연결된 표현을 유지해야 합니다.
  naturalness: ‘누구를 위하여 … 구해졌으며, 누구를 위하여 … 주어졌습니까?’는 현대 표준 한국어 합쇼체의 문어적 성경 번역 문맥에서 자연스럽습니다.
  terminology: ‘예언자’는 현대 한국어 성경·학술 문맥에서 자연스럽고, 수동형 ‘주어졌습니까’가 원문의 주어와 논항 관계를 보존합니다. ‘선한 일들’은 영어 감사본의 복수 표현을 반영하되, 각주로 ‘선의 수고’라는 대안을 제시합니다.
  issues:
  - severity: high
    issue: ‘선지자를 받았느냐’
    rationale: 원문/영어 감사본은 ‘예언자들이 누구를 위하여 주어졌는가’를 묻습니다. 초안은 ‘누가 예언자를 받았는가’로 바꾸어 문장 초점과 수동 관계를 변경합니다.
  - severity: medium
    issue: ‘선한 일을 구하며’의 시제·병렬
    rationale: 영어 감사본의 두 수동 의문절을 반영하여 ‘구해졌으며’로 하고, 뒤 절과 병렬을 이루게 해야 합니다.
  revised_text: 누구를 위하여 선한 일들이 구해졌으며, 누구를 위하여 예언자들이 주어졌습니까?
  revised_footnotes:
