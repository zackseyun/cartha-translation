  revision_rationale: 원문의 수동 의문 형식과 영어 POB 감사본의 ‘were ... sought / were ... given’을 보존했습니다. 초안의 ‘받았느냐’는 의미 역할을 바꾸므로 ‘주어졌습니까’로 고쳤고, 합쇼체 의문문으로 통일했습니다.
