translation:
  language: ko
  text: 그때 내가 대답하여 말했습니다. “보십시오, 당신은 저에게 시대의 흐름과 이 일들 뒤에 일어날 일을 보여 주셨고, 당신이 말씀하신 재앙이 민족들에게 닥칠 것이라고 저에게 말씀하셨습니다.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܘܪܚܐ
  english_pob_choice: course
  chosen_korean: 흐름
  alternatives_korean:
  - 길
  - 진행
  - 순서
  lexicon: Payne Smith
  rationale: 이 문맥에서는 단순한 ‘길’보다 시대가 진행되는 질서와 전개를 가리키므로, 자연스럽게 ‘시대의 흐름’으로 옮겼습니다.
- source_word: ܦܘܪܥܢܐ
  english_pob_choice: retribution
  chosen_korean: 재앙
  alternatives_korean:
  - 보응
  - 응보
  - 징벌
  lexicon: Payne Smith
  rationale: 본문 전체가 심판적 맥락이지만, 이 절의 핵심은 이미 말해진 것이 앞으로 ‘닥친다’는 점이어서 한국어에서는 결과의 임박성과 타격성을 살려 ‘재앙’으로 옮겼습니다.
- source_word: ܕܐܡܝܪ ܡܢܟ
  english_pob_choice: which was spoken of by you
  chosen_korean: 당신이 말씀하신
  alternatives_korean:
  - 당신에게서 말해진
  - 당신에 의해 언급된
  lexicon: Payne Smith
  rationale: 능동적 관점의 수동 구문을 살려, ‘당신이 말씀하신’으로 옮겨 발화 주체와 선포의 무게를 보존했습니다.
- source_word: ܥܠ ܥܡܡ̈ܐ
  english_pob_choice: upon the nations
  chosen_korean: 민족들에게
  alternatives_korean:
  - 나라들 위에
  - 이방 민족들 위에
  - 열방에
  lexicon: Payne Smith
  rationale: 시리아어 전치사구의 대상성을 자연스럽게 드러내면서도, 독자가 심판의 범위를 이해할 수 있게 ‘민족들에게’로 번역했습니다.
theological_decisions:
- issue: ܦܘܪܥܢܐ의 한국어 강도 선택
  chosen_reading: ‘재앙’으로 옮겨, 단순한 일반적 결과가 아니라 선포된 심판의 현실적 도래를 드러냈습니다.
  alternative_readings:
  - 보응
  - 징벌
  - 응보
  rationale: 이 절은 ‘당신이 말씀하신 것’이 실제로 ‘민족들 위에’ 임한다는 구조를 가지므로, 한국어에서도 심판의 도래성과 위협성을 분명히 해야 합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
