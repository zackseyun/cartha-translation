  source_fidelity: 현 초안의 ‘이 말씀을 받을 수 있는 사람’은 시리아어의 ‘말해진 말씀들이 그들/그 때들 안에서 이루어짐’이라는 성취 표현을 ‘말씀을 받음’으로 바꾸어 놓았습니다. 또한 ‘죄를 짓고 살았으며’는 죄를 지으면서 살아간다는 뜻으로도 읽힐 수 있어, 죄를 지은 뒤에도 살아남았다는 대조를 더 분명히 하는 편이 안전합니다.
  naturalness: 수정안은 현대 표준 한국어의 합쇼체 문체를 유지하면서, ‘그 시대’와 ‘이 말씀’의 단수 표현을 원문의 복수적·성취 지향적 표현에 맞추었습니다.
  terminology: ‘말씀’은 종교 문맥에 적절하나, 여기서는 단순히 수여·수용되는 말씀이 아니라 이미 말해진 말씀의 성취를 가리키므로 ‘말씀들이 이루어질’로 옮겼습니다. 교파적 해석은 추가하지 않았습니다.
