  text: And the Lord said to me, “This city will be delivered up for a time, and the people will be led away into captivity, but the world will not be forgotten.
translation:
  language: ko
  text: 주님께서 내게 말씀하셨습니다. 「이 도시는 한때 넘겨질 것이며, 이 백성은 포로로 끌려갈 것이지만, 세상은 잊히지 않을 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܗܘܬ ܦܬܓܡܗ ܕܡܪܝܐ
  english_pob_choice: And the Lord said to me
  chosen_korean: 주님께서 내게 말씀하셨습니다
  alternatives_korean:
  - 주님이 내게 말씀하셨습니다
  - 야훼께서 내게 말씀하셨습니다
  lexicon: 주님 / 말씀하다
  rationale: 서술체 합쇼체로 옮기되, 1인칭 화자에게 직접 주시는 신적 발화라는 점을 살려 주님께서 말씀하셨습니다로 자연스럽게 처리했습니다.
- source_word: ܬܬܝܗܒ ... ܠܙܒܢܐ
  english_pob_choice: will be delivered up for a time
  chosen_korean: 한때 넘겨질 것이며
  alternatives_korean:
  - 잠시 넘겨질 것이며
  - 일정 기간 넘겨질 것이며
  lexicon: 넘겨지다 / 잠시
  rationale: 수동적 ‘넘겨지다’가 도시가 다른 권세에 맡겨지는 의미를 잘 살리고, ܠܙܒܢܐ의 시간적 제한은 한때로 간결하게 반영했습니다.
- source_word: ܘܥܡܐ ܡܬܕܒܪ ܫܒܝܐ
  english_pob_choice: and the people will be led away into captivity
  chosen_korean: 이 백성은 포로로 끌려갈 것이지만
  alternatives_korean:
  - 이 백성은 사로잡혀 갈 것이지만
  - 이 백성은 포로 생활로 끌려갈 것이지만
  lexicon: 포로 / 끌려가다
  rationale: English POB의 captivity를 본문 경고의 강도를 살려 포로로 옮기고, ‘끌려가다’로 강제 이송의 뉘앙스를 유지했습니다.
- source_word: ܘܥܠܡܐ ܠܐ ܡܬܬܢܫܐ
  english_pob_choice: but the world will not be forgotten
  chosen_korean: 세상은 잊히지 않을 것입니다
  alternatives_korean:
  - 세상은 기억에서 사라지지 않을 것입니다
  - 세상은 잊혀지지 않을 것입니다
  lexicon: 세상 / 잊히다
  rationale: ܥܠܡܐ를 여기서는 피조 세계 전체를 가리키는 ‘세상’으로 옮기고, 수동형을 자연스러운 현대 한국어로 풀었습니다.
theological_decisions:
- issue: ‘this city’와 ‘the world’의 대비
  chosen_reading: 도시는 징계와 포로의 대상이지만, 세상은 하나님 기억 밖으로 밀려나지 않는다는 대비를 유지했습니다.
  alternative_readings:
  - 도시와 세계를 단순한 장소 대비로 완화하는 번역
  - 세상을 인류 전체로만 좁히는 번역
  rationale: 문맥상 예루살렘의 운명과 더 넓은 창조 세계에 대한 하나님의 보존 의도가 대조됩니다. 이를 약화하지 않기 위해 ‘세상은 잊히지 않을 것입니다’를 직설적으로 유지했습니다.
  doctrine_reference: 섭리와 기억의 보존
- issue: 주님 호칭의 처리
  chosen_reading: 본문의 ‘Lord’는 기본값에 따라 주님으로 번역하고, 본문 내부의 화자-청자 관계를 우선했습니다.
  alternative_readings:
  - 야훼로 표기
  - 전통적 여호와 표기
  rationale: 이 구절은 서술적 인용문 안에서 주님의 발화를 전달하는 형식이므로, 고유명 표기보다 문맥상 호칭을 우선하는 것이 자연스럽습니다.
  doctrine_reference: 신적 호칭과 인용문 처리
