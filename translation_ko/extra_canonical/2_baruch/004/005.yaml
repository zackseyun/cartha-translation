    rationale: 시리아어 ܦܓܪ̈ܐ는 복수이며, 영어 감사 번역도 ‘between the pieces of the sacrifice’로 이를 반영합니다. ‘제물의 조각들 사이에서’가 더 정확합니다.
  - severity: low
