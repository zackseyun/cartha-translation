  source_fidelity: 시리아어 본문은 ‘이 일들 후에’(ܘܡܢ ܒܬܪ ܗܟܝܢ), ‘밤에’, ‘제물의 몸체들/조각들 사이에서’(ܒܝܢܬ ܦܓܪ̈ܐ ܕܕܒܚܐ), 그리고 ‘그것을 내 종 아브라함에게 보여 주었다’고 말합니다. 초안은 전체 구조와 ‘그것’의 선행 대상을 보존하지만, ‘제물 사이’는 복수의 나뉜 제물 부분이라는 원문의 표현을 다소 약화합니다.
