  terminology: ‘내 종 아브라함’은 원문의 호칭을 충실히 반영합니다. ‘제물의 조각들’은 영어 POB 감사 문구의 ‘pieces of the sacrifice’ 및 시리아어의 복수 ‘몸체들’에 맞으며, 창세기의 언약 제의 장면을 불필요하게 해석적으로 확대하지 않습니다.
