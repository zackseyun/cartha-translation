revisions:
- from: 이는 사람의 손으로 하는 것이 아니니라. 그것은 장래에 나타날 일이요, 내가 낙원을 만들기로 결심하고 아담이 범죄하기 전에 미리 예비하여 그에게 보이던 것이니라.
  to: 이는 사람의 손으로 만든 것이 아닙니다. 그것은 장차 나타날 것이며, 내가 낙원을 만들기로 뜻한 때부터 미리 마련해 두었고, 아담이 죄를 짓기 전에 그것을 그에게 보여 준 것입니다.
  rationale: 원문의 대조, 미래의 나타남, 낙원 창조를 뜻한 때부터의 사전 마련, 아담의 범죄 이전에 이루어진 계시를 유지했습니다. ‘나타날 것’은 원문의 미래 수동적 표현을 불필요하게 해석하지 않으며, ‘그것을 그에게’는 지시 대상과 수여 대상을 명확히 합니다.
  reviewer_model: gpt-5.6-terra
