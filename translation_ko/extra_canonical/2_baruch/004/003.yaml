  language: ko
  text: 이는 사람의 손으로 만든 것이 아닙니다. 그것은 장차 나타날 것이며, 내가 낙원을 만들기로 뜻한 때부터 미리 마련해 두었고, 아담이 죄를 짓기 전에 그것을 그에게 보여 준 것입니다.
