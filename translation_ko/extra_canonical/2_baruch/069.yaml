base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/069.yaml
  text: '1. For the last waters that you saw, which were blacker than all those before them—these are for the whole world.[a]


    2. For the Most High made division from the beginning, because he alone knows what is going to happen.


    3. For the evil deeds of impiety that were going to come into his sight, he foresaw six kinds;[b]


    4. and the good works of the righteous, which were going to be accomplished before him, he likewise foresaw six kinds, besides what he is going to do at the consummation of the age.


    5. Therefore the black waters are not counted with the black, nor the bright with the bright.'
translation:
  language: ko
  text: '1. 마지막 물들이라고 보신 것, 곧 이전의 모든 물보다 더 검었던 것들은 온 세상을 위한 것입니다.[a]


    2. 지극히 높으신 분께서는 처음부터 구별하셨으니, 그분만이 앞으로 일어날 일을 아시기 때문입니다.


    3. 그분의 눈앞에 올 불경의 악한 행위들은 여섯 종류로 미리 보셨고,[b]


    4. 의인들의 선한 일들, 곧 그분 앞에서 이루어질 것들도 그와 같이 여섯 종류로 미리 보셨습니다. 그리고 시대의 종결 때에 그분이 하실 일 외에도 그러합니다.


    5. 그러므로 검은 물들은 검은 것들과 함께 세어지지 않고, 밝은 것들은 밝은 것들과 함께 세어지지 않습니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܩܕܡܘܗܝ / ܠܘܬ ܚܝܠܬܢܐ
  english_pob_choice: before him / the Most High
  chosen_korean: 그분 앞에서 / 지극히 높으신 분
  alternatives_korean:
  - 그분 앞에
  - 높으신 분
  lexicon: 출 0:0-0
  rationale: 문맥상 심판자 앞에서 드러나는 행위를 가리키므로 ‘그분 앞에서’로 옮기고, 2절의 주어는 POB 관례에 따라 ‘지극히 높으신 분’으로 정리했습니다.
- source_word: ܬܪܥܝܬܐ ... ܬܫܒܘܚܬܐ ܡܩܘܝܬܐ
  english_pob_choice: the good works of the righteous
  chosen_korean: 의인들의 선한 일들
  alternatives_korean:
  - 의인들의 선행
  - 의인들의 의로운 행위들
  lexicon: 출 0:0-0
  rationale: 히브리식 평행에서 ‘행위/일들’이 보존되어야 하므로 추상명사 ‘선행’보다 구체적 복수형 ‘선한 일들’을 택했습니다.
- source_word: ܒܙܒܢ ܙܒܢܐ ... ܒܚܪ̈ܝܬܐ
  english_pob_choice: at the consummation of the age
  chosen_korean: 시대의 종결 때에
  alternatives_korean:
  - 세상의 끝에
  - 시대의 완성 때에
  lexicon: 출 0:0-0
  rationale: 종말론적 종결을 뜻하지만 교리적 과장을 피하기 위해 ‘종결 때에’로 옮겨, POB의 의미를 유지하면서도 한국어 흐름을 자연스럽게 했습니다.
- source_word: ܐܘܟܡ̈ܐ / ܢܗܝܪܐ
  english_pob_choice: the black waters / the bright
  chosen_korean: 검은 물들 / 밝은 것들
  alternatives_korean:
  - 검은 물들 / 빛나는 것들
  - 흑수 / 광명한 것들
  lexicon: 출 0:0-0
  rationale: POB의 대조를 따라 색채 형용사를 유지하되, 마지막 절은 물이 아니라 범주를 가리키는 말이어서 ‘것들’로 받아 문법과 대비를 살렸습니다.
