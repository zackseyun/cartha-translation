revisions:
- from: '그러나 당신들아, 마음을 예비하여 그 안에 율법의 열매를 뿌리면, 전능자가 온 창조를 흔드실 그때에 그것이 당신들을 지켜 줄 것입니다.


    잠시 뒤 시온의 건물이 흔들려 다시 세워질 것이지만, 그 건물 자체는 남아 있지 않을 것입니다. 오히려 때가 이를 때까지 다시 뿌리째 뽑혀 황폐한 채로 있을 것이며, 그 뒤에는 영광 가운데 새롭게 되어 영원히 굳게 세워질 것입니다.


    그러므로 지금 닥친 악 때문에, 앞으로 닥칠 것만큼 크게 슬퍼해서는 안 됩니다.[a][b]'
  to: '그러나 여러분은 마음을 준비하여 그 안에 율법의 열매들[b]을 뿌리십시오. 그러면 전능하신 분께서 온 창조를 뒤흔드실 그때에 그 열매들이 여러분을 지켜 줄 것입니다.[a]


    얼마 후 시온의 건축물은 다시 세워지기 위해 흔들릴 것입니다. 그러나 바로 그 건축물은 남아 있지 않을 것이며, 다시 뿌리째 뽑혀 그때까지 황폐한 채로 있을 것입니다. 그 뒤에는 영광 가운데 새롭게 되어 영원히 굳게 세워질 것입니다.


    그러므로 우리는 지금 닥친 악 때문에, 앞으로 닥칠 일만큼 크게 슬퍼해서는 안 됩니다.'
  rationale: 번역투 호격을 현대 합쇼체로 고치고, 원문의 농경 비유와 능동적 보호 표현을 보존했습니다. 시온의 중간적 흔들림·재건·황폐·영광스러운 갱신이라는 순서를 유지했으며, 두 각주를 의미상 대응하는 어구에 각각 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:32Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미와 종말론적 전개는 대체로 충실합니다. 다만 보호의 능동적 주체가 가리키는 바를 더 명료하게 하고, ‘다시 세워지기 위해’라는 목적 관계를 드러내며, 영어 감사 기록의 각주 위치를 해당 어구에 맞추어 바로잡는 것이 필요합니다.
  naturalness: ‘그러나 당신들아’는 현대 표준 한국어 합쇼체에서 어색합니다. ‘그러나 여러분은’이 자연스럽습니다. ‘시온의 건물’도 다소 부자연스러우므로, 특정 성소로 해석을 좁히지 않는 ‘시온의 건축물’이 더 적절합니다.
  terminology: ‘율법’, ‘시온’, ‘전능하신 분’, ‘영광’, ‘악’은 문맥과 격식에 적합합니다. 원문의 복수형을 반영하여 ‘율법의 열매들’로 하고, 보호의 주체를 ‘그 열매들’로 명시했습니다.
  issues:
  - severity: medium
    issue: 현대 한국어 호격 및 문체
    rationale: ‘그러나 당신들아’는 번역투이며 합쇼체 본문에 자연스럽지 않습니다. ‘그러나 여러분은’으로 고쳐야 합니다.
  - severity: medium
    issue: 각주 앵커가 관련 어구에서 분리됨
