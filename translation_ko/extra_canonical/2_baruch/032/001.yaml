base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/032/001.yaml
  text: 'But you, if you prepare your hearts so as to sow in them the fruits of the law, it will protect you in that time when the Mighty One shakes the whole creation.


    For after a little time the building of Zion will be shaken, so that it may be rebuilt again. Yet that very building will not remain; rather, after a time it will again be uprooted and will remain desolate until the time. And afterward it must be renewed in glory and be established forever.


    Therefore we should not grieve so greatly over the evil that has come now, as over that which is to come.'
  footnotes:
  - marker: a
    text: Or 'you will be protected'.
    reason: previous_rendering
  - marker: b
    text: Or 'fruit'.
    reason: previous_rendering
translation:
  language: ko
  text: '그러나 여러분은 마음을 준비하여 그 안에 율법의 열매들[b]을 뿌리십시오. 그러면 전능하신 분께서 온 창조를 뒤흔드실 그때에 그 열매들이 여러분을 지켜 줄 것입니다.[a]


    얼마 후 시온의 건축물은 다시 세워지기 위해 흔들릴 것입니다. 그러나 바로 그 건축물은 남아 있지 않을 것이며, 다시 뿌리째 뽑혀 그때까지 황폐한 채로 있을 것입니다. 그 뒤에는 영광 가운데 새롭게 되어 영원히 굳게 세워질 것입니다.


    그러므로 우리는 지금 닥친 악 때문에, 앞으로 닥칠 일만큼 크게 슬퍼해서는 안 됩니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분은 보호받을 것입니다.’
    reason: 영어 POB 감사 기록의 수동태 대안을 보호 절 바로 뒤에 연결했습니다.
  - marker: b
    text: 또는 ‘열매’.
    reason: 영어 POB 감사 기록의 단수 대안을 ‘열매들’ 바로 뒤에 연결했습니다.
lexical_decisions:
- source_word: ܬܥܒܕ ... ܬܥܒܕ
  english_pob_choice: prepare your hearts / sow in them
  chosen_korean: 마음을 예비하여 ... 그 안에 뿌리면
  alternatives_korean:
  - 마음을 준비하여 ... 심으면
  - 마음을 갖추어 ... 뿌리면
  lexicon: Syriac text; English POB audit trail
  rationale: 마음의 예비와 그 안에 ‘뿌리는’ 농경 은유를 함께 살리기 위해, 준비 동사와 파종 동사를 분리해 옮겼습니다.
- source_word: ܦܐܪ̈ܐ ܕܣܡܝܐ
  english_pob_choice: the fruit(s) of the law
  chosen_korean: 율법의 열매
  alternatives_korean:
  - 율법의 열매들
  - 율법의 소산
  lexicon: Syriac text; English POB audit trail
  rationale: 사본의 복수형 뉘앙스는 살리되, 한국어에서는 집합명사처럼 자연스러운 ‘열매’로 옮겨 핵심 이미지를 유지했습니다.
- source_word: ܢܚܙܘܢ ... ܢܬܡܠܟܘܢ ܥܕܡܐ ܠܙܒܢܐ
  english_pob_choice: shakes the whole creation / be established forever
  chosen_korean: 온 창조를 흔드실 ... 영원히 굳게 세워질
  alternatives_korean:
  - 온 피조 세계를 흔드실 ... 영원히 세워질
  - 모든 피조물을 흔드실 ... 영원히 확립될
  lexicon: Syriac text; English POB audit trail
  rationale: apocalyptic 우주적 흔들림은 ‘창조’로, 최종적 안정은 ‘굳게 세워지다’로 옮겨 원문의 대비를 보존했습니다.
- source_word: ܡܫܝܚܐ
  english_pob_choice: Messiah
  chosen_korean: 메시아
  alternatives_korean:
  - 그리스도
  lexicon: POB glossary default
  rationale: 프로젝트 기본 용례에 따라 칭호적 의미를 살려 ‘메시아’로 옮겼습니다.
theological_decisions:
- issue: 율법의 열매가 보호하는 주체와 능동성
  chosen_reading: 보호의 주체를 법이 아니라 ‘그 열매’를 담은 삶의 준비로 드러내기 위해 ‘그것이 당신들을 지켜 줄 것입니다’로 옮겼습니다.
  alternative_readings:
  - 당신들은 보호받을 것입니다
  - 그가 당신들을 지켜 주실 것입니다
  rationale: 시리아어와 영어 POB는 보호를 수동화하지 않고, 율법의 열매를 마음에 심는 행위가 재난 속 보존과 연결됨을 드러냅니다.
  doctrine_reference: 원문 주체 보존과 문맥적 인과성 유지
- issue: 시온 건물의 반복적 흔들림과 최종적 영광
  chosen_reading: ‘다시 세워짐-다시 뿌리째 뽑힘-영광 가운데 새로워짐-영원히 세워짐’의 긴장을 그대로 남겼습니다.
  alternative_readings:
  - 중간 단계를 생략하고 최종 회복만 제시
  - 한 번의 재건만 말하는 것으로 완화
  rationale: 본문은 단순한 회복담이 아니라, 반복된 붕괴와 최종적 영광 사이의 종말론적 긴장을 의도적으로 드러냅니다.
  doctrine_reference: 종말론적 심판과 회복의 긴장 보존
