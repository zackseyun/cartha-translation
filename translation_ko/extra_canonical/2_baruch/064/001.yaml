translation:
  language: ko
  text: 그리고 보신 아홉째 검은 물은, 곧 므낫세가 히스기야의 아들로 있던 때에 있었던 모든 악입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܫ̈ܟܐ
  english_pob_choice: black waters
  chosen_korean: 검은 물
  alternatives_korean:
  - 어두운 물
  lexicon: Payne Smith
  rationale: 상징 연속에서 색채 대비가 핵심이므로, 일반적인 ‘어두운’보다 ‘검은’으로 색을 분명히 살렸습니다.
- source_word: ܟܠܗ / ܚܒܠܐ
  english_pob_choice: this is all the wickedness
  chosen_korean: 모든 악입니다
  alternatives_korean:
  - 온갖 악입니다
  - 그 악 전체입니다
  lexicon: Payne Smith
  rationale: 시리아어의 ‘all’(ܟܠܗ)을 반영해 총괄성을 살렸고, 여기서는 도덕적 악을 가리키므로 ‘악’이 가장 자연스럽습니다.
- source_word: ܒܝܘܡ̈ܬܐ ܕܡܢܘ
  english_pob_choice: in the days of Manasseh son of Hezekiah
  chosen_korean: 므낫세가 히스기야의 아들로 있던 때
  alternatives_korean:
  - 히스기야의 아들 므낫세의 시대
  - 히스기야의 아들 므낫세의 날들
  lexicon: SBLGNT/Syriac proper-name conventions
  rationale: 본문의 역사적 배경을 현대 한국어에서 자연스럽게 풀어, ‘날들’보다 ‘때’로 시대적 맥락을 전달했습니다.
theological_decisions:
- issue: 상징 해석문의 지시 대상을 어떻게 처리할지
  chosen_reading: ‘아홉째 검은 물’은 환상 속 상징을 그대로 두고, 뒤의 설명문으로 그 의미를 풀이했습니다.
  alternative_readings:
  - 상징을 풀어 ‘아홉째 흑암의 물결’처럼 의역한다
  - 설명문을 앞세워 상징성을 약화한다
  rationale: 이 절은 환상 요소와 해석 절이 결합된 구조이므로, 상징과 해설의 긴장을 유지하는 편이 원문에 더 가깝습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
