  naturalness: ‘전능하신 분 앞에서 진노가 나와’는 문맥상 가능하나, ‘나아가’와 결과절을 사용하면 현대 한국어 합쇼체에서 더 자연스럽고 원문의 엄숙한 문체도 유지됩니다.
  terminology: ‘전능하신 분’은 Mighty One에 대한 무리 없는 존칭 표현이며, ‘시온’도 고유명사 표기가 적절합니다. ‘뿌리째 뽑혀 나가다’는 uprooted의 비유를 보존합니다.
  issues:
