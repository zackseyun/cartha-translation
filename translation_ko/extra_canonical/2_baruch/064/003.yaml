  text: 그리고 그는 다섯 개의 얼굴을 가진 형상을 만들었습니다. 넷은 사방의 바람을 향하고 있었고, 다섯째는 그 형상 위에 있었는데, 전능하신 분의 열심에 맞서는 경쟁자였습니다.
