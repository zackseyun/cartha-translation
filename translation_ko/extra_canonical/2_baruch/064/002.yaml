  text: 그는 크게 불경건을 저질러 의인을 죽이고, 재판을 왜곡하며, 무죄한 피를 흘리고, 유부녀들을 강제로 범하고, 제단들을 무너뜨리며, 제사를 폐하고, 제사장들을 내쫓아 그들이 성소에서 섬기지 못하게 하였습니다.
