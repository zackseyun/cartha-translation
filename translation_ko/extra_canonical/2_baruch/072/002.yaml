revisions:
- from: 이 말이니라. 전에 너희에게 말한 이적들이 나타난 후에 민족들이 혼란에 빠지고 내 메시아의 때가 이르리라. 그가 모든 민족을 불러서 그 중에 더러는 살리고 더러는 죽이리라.
  to: 말씀은 이러합니다. 전에 너희에게 말해 준 이적들이 나타난 뒤에 민족들이 혼란에 빠지고, 내 메시아의 때가 이를 것입니다. 그가 모든 민족을 부르실 것이며, 그들 가운데 더러는 살려 두시고 더러는 죽이실 것입니다.
  rationale: 의미와 미래적 예언의 흐름, ‘내 메시아’라는 표현을 보존하면서, 고전적 종결을 현대 표준어 합쇼체로 바꾸었습니다. ‘keep alive’는 단순한 생존이 아니라 죽이지 않고 살려 둔다는 대조를 드러내도록 ‘살려 두시고’로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
