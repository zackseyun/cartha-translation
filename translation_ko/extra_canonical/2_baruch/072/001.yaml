    text: 또는 ‘그 어두운 물들’.
    reason: 시리아어 지시사는 바로 앞의 물들을 가리키며 ‘이’가 더 적절하지만, 기존 번역의 ‘그/저’ 계열 표현을 대안으로 기록합니다.
