  terminology: ‘might’는 여기서 ‘능력’으로, ‘ways’는 하나님의 행하심/처신의 길이라는 비유를 보존하여 ‘길들’로 옮겼습니다. ‘심판’은 원문의 판단·심판 개념을 유지합니다.
