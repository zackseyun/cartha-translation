  to: 그 후에 이곳으로 오십시오. 내가 այնտեղ서 네게 나타나 참된 일들을 네게 말하고, 시대들의 질서를 네게 가르치겠습니다. 그 때들이 다가오고 있으며 지체하지 않을 것이기 때문입니다.
