  terminology: ‘시온’은 유지합니다. 원문의 ‘visit’가 심판적 방문을 함의할 수 있으나, 영어 감사 문구도 이를 명시적으로 ‘심판하다’로 풀이하지 않으므로 ‘찾아가다’로 번역하여 모호성을 보존합니다.
