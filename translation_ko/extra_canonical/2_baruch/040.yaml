base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/040.yaml
  text: '1[a]. The last ruler of that time will be left alive, when the multitude of his hosts has been struck down by the sword; and he will be bound, and they will bring him up to Mount Zion. And my Messiah will convict him of all his impieties[b], and will set before him all the wicked deeds of his hosts.


    2. And afterward he will put him to death, and he will protect the rest of my people, those who are found in the place that I have chosen.


    3. And his dominion will stand forever, until the world of corruption comes to its end, and until the times spoken of before are fulfilled.


    4. This is the vision[c], and this is its interpretation.”'
  footnotes:
  - marker: a
    text: The Ceriani page is textually rough here and overlaps quickly into the next chapter. 'The place that I have chosen' follows the control tradition rather than forcing false precision from the damaged line.
    reason: textual_variant
    anchor_ref: '40:2'
  - marker: b
    text: '''The world of corruption'' could also be rendered ''the corruptible world.'' I kept the more concrete apocalyptic wording.'
    reason: lexical_alternative
    anchor_ref: '40:3'
  - marker: c
    text: Or 'This is your vision'.
    reason: previous_rendering
translation:
  language: ko
  text: '1[a]. 그때의 마지막 통치자는 그의 군대의 무리가 칼에 쓰러진 뒤에도 살아남아 있을 것이며, 그는 결박되어 사람들이 그를 시온 산으로 데려갈 것입니다. 그리고 나의 메시아는 그의 모든 불경건함을 정죄하고[b] 그의 군대가 행한 모든 악한 일들을 그 앞에 드러낼 것입니다.


    2. 그 뒤에 그는 그를 죽이고, 내가 택한 곳에 있는 내 백성의 남은 자를 보호할 것입니다.


    3. 그리고 그의 통치는 영원히 서 있을 것이며, 부패한 세상이 끝날 때까지, 또 전에 말해진 때들이 이루어질 때까지 그러할 것입니다.


    4. 이것이 그 환상이며[c], 이것이 그것의 해석입니다.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܠܟܘܬܐ / ܫܘܠܛܢܐ sense
  english_pob_choice: dominion
  chosen_korean: 통치
  alternatives_korean:
  - 다스림
  - 권세
  - 주권
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 여기서는 메시아의 지속적인 왕적 지배를 가리키므로, 정치·종말론적 의미를 살리면서도 자연스러운 현대 한국어인 ‘통치’를 택했습니다.
- source_word: ܒܝܫܘܬܗ
  english_pob_choice: impieties
  chosen_korean: 불경건함
  alternatives_korean:
  - 악행
  - 경건치 않음
  - 불의
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 단순한 도덕적 악보다 하나님에 대한 불경건과 반역의 뉘앙스가 강하므로, 직접적인 종교적 책임을 드러내는 ‘불경건함’이 가장 가깝습니다.
- source_word: ܥܒ̈ܕܝܗܘܢ ܕܒܝܫܘܬܗܘܢ
  english_pob_choice: the wicked deeds of his hosts
  chosen_korean: 그의 군대가 행한 모든 악한 일들
  alternatives_korean:
  - 그의 군대의 악한 행위들
  - 그 무리의 사악한 일들
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 원문은 행위(works/deeds)와 그에 붙은 악성 모두를 담고 있으므로, 군대의 집단적 책임을 살린 표현으로 옮겼습니다.
- source_word: ܥܠܡܐ ܕܚܒܠܐ
  english_pob_choice: the world of corruption
  chosen_korean: 부패한 세상
  alternatives_korean:
  - 부패의 세상
  - 썩어 가는 세상
  - 부패한 세계
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 영구한 메시아 통치와 대비되는 종말론적 현세를 간결하게 살리되, ‘world’를 일상적 ‘세상’으로 자연스럽게 옮겼습니다.
- source_word: ܚܙܘܐ
  english_pob_choice: the vision
  chosen_korean: 그 환상
  alternatives_korean:
  - 그 이상
  - 그 예언적 환상
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 시리아어 정관적 형태에 따라 ‘the vision’을 반영했고, 한국어에서는 문맥상 자연스러운 ‘환상’이 가장 적합합니다.
theological_decisions:
- issue: ‘my Messiah’의 인격적·재판적 역할을 어떻게 드러낼지
  chosen_reading: 메시아를 추상적 시대가 아니라 시온 산에서 마지막 통치자를 심판하는 개인적 왕적 인물로 보이게 했습니다.
  alternative_readings:
  - 상징적인 메시아 시대
  - 기름부음 받은 대리자 정도로 약화된 표현
  rationale: 원문은 ‘나의 메시아’가 직접 정죄하고 죽이는 행위를 하므로, 인격적 메시아성과 사법적 권위를 분명히 남겨야 합니다.
  doctrine_reference: DOCTRINE.md translation philosophy §3
- issue: 영원한 통치와 종말론적 ‘부패한 세상’의 관계
  chosen_reading: 메시아의 통치는 ‘영원히’ 서지만, 그 문맥 안에서 부패한 세상의 종말이라는 제한도 함께 보존했습니다.
  alternative_readings:
  - 무조건적인 현세적 무한 통치
  - 단지 과장된 긴 통치
  rationale: 본문의 긴장—영원성 선언과 종말 조건—을 풀어버리지 않고 그대로 유지하는 것이 더 충실합니다.
  doctrine_reference: DOCTRINE.md translation philosophy §3
