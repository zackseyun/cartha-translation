translation:
  language: ko
  text: '주께서 대답하여 제게 말씀하셨습니다. 「너는 사람의 지나감[a]에 대해 놀라는 것이 옳습니다. 그러나 죄인들에게 닥치는 악들에 대해 너의 판단은 옳지 않습니다.


    그리고 네가 말한 것처럼, 의인들이 거두어지고 악인들이 형통하는 것에 대해, 그리고 사람이 주님의 판단을 알지 못한다고 한 것에 대해, 이제 들으십시오. 내가 당신에게 말하겠습니다. 주의 깊게 들으십시오. 내가 내 말을 들리게 하겠습니다.


    참으로 사람이 율법을 받지 않았더라면, 또 그에게 이해력이 알려지지 않았더라면, 그는 내 판단을 알지 못했을 것입니다. 그러나 이제 그는 이해를 가지고도 범법하였으므로, 그 이해 때문에 반드시 벌을 받을 것입니다.


    그리고 당신이 말한 의인들에 대해서는, 세상이 그들을 위해 왔다고 한 그들에 대해서는, 오고 있는 것 또한 그들을 위해 옵니다. 이 세상은 그들에게 큰 환난과 수고가 있는 싸움이지만, 장차 올 것은 큰 영광이 있는 면류관입니다」'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܐܬܡܗܬ / astonished
  english_pob_choice: to be astonished
  chosen_korean: 놀라는 것이 옳습니다
  alternatives_korean:
  - 경탄하는 것이 옳습니다
  - 깜짝 놀라는 것이 옳습니다
  lexicon: Payne Smith
  rationale: 여기서는 인간의 죽음과 하나님의 판단 앞에서의 충격적 인식이므로, 단순한 호기심보다 ‘놀람’을 살리되 판단의 정당성을 함께 드러내는 표현으로 옮겼습니다.
- source_word: ܢܡܘܣܐ
  english_pob_choice: the Law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 토라
  lexicon: Project default
  rationale: 문맥상 언약적 규범을 가리키므로 POB의 ‘the Law’에 맞춰 ‘율법’으로 옮겼습니다.
- source_word: ܚܟܡܬܐ / understanding
  english_pob_choice: understanding
  chosen_korean: 이해력
  alternatives_korean:
  - 지혜
  - 분별
  lexicon: Payne Smith
  rationale: 이 대목은 책임과 연결된 도덕적 인지 능력을 말하므로, ‘지혜’보다 직접적인 ‘이해력’이 문맥을 더 분명히 드러냅니다.
- source_word: ܟܐܢܘܬܐ
  english_pob_choice: the righteous
  chosen_korean: 의인들
  alternatives_korean:
  - 의로운 사람들
  - 공의로운 자들
  lexicon: Project default
  rationale: 서사 전체에서 의인과 악인의 대비가 반복되므로, POB 관례에 맞는 ‘의인들’을 사용했습니다.
theological_decisions:
- issue: 지식과 책임의 관계
  chosen_reading: 율법과 이해력을 받은 뒤의 범법은 더 분명한 책임을 낳는다고 옮겼습니다.
  alternative_readings:
  - 지식은 죄를 설명할 뿐 책임을 더하지 않는다
  - 이해력은 단지 유익한 정보일 뿐이다
  rationale: 본문은 ‘율법’과 ‘이해력’을 받은 사람이 그 이해를 가지고도 범법했기 때문에 벌을 받는다고 논증하므로, 책임의 증대를 분명히 드러내야 합니다.
  doctrine_reference: 신 30:15-20; 눅 12:47-48
- issue: 의인의 현재와 장차 올 것
  chosen_reading: 의인에게 현재 세계는 큰 환난과 수고의 싸움이지만, 장차 올 것은 영광의 면류관이라고 옮겼습니다.
  alternative_readings:
  - 현재 세상만 강조한다
  - 장차 올 보상은 상징적일 뿐이다
  rationale: 본문은 현재의 고난과 미래의 보상을 병렬로 제시하므로, 두 시계를 모두 살려 번역해야 합니다.
  doctrine_reference: 롬 8:18; 약 1:12
