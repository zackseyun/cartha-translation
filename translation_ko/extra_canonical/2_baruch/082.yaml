  text: 'For now we see the abundance of the prosperity of the nations while they act wickedly[a], but they are compared to spittle. We look on the force of their power, but they will be reckoned as a passing vapor. We consider the glory of their greatness, though they do not keep the commandments of the Mighty One, but have treated them with contempt. And we consider the beauty that is seen, though it is shaken in afflictions; but they will be sought out like flesh in pain. We think on the confidence in which they trust, though before our eyes it is shaken; but they will be crushed like a wave. And we seek only the hope of their strength, though it flourishes in the good things God gave them; but it will be laid away, and lamentation will come upon it.


    For the Most High is indeed hastening his times and bringing near his hours. He will judge those who oppress, and the heraldings of the age will go forth. The hidden things of all their sins will be revealed, and the quiet thoughts of what is right will spring forth. Those who now think they can escape will not be able to save themselves, nor will anyone make a covenant with famine by abundance of food. The humble will not place their hope in prosperity; rather, their heart will be one in those things that endure. Instead, they will hope all the more because that fearsome end has arrived. They will not look on the delights of the present age, and they will know only that they are being brought to the end. But the consummation of the world will show the great strength of his governance, when everything enters what is inward and returns to what from the beginning had been appointed. Then it will be seen that what has been found was not established by men, but has truly reached its completion.


    For whatever stood, or was made, or came in conflict and passed away, shows this: evil is not forever evil, and good is not forever good. Every health is turned into sickness, every strength into weakness, every beauty into deformity, and all the bloom of youth into burdened old age. All the beauty you saw turns into darkness and corruption, and every ruin you made turns into peace and pleasantness. Every darkness that had been given turns into the light of truth. Every error and weakness turns into the lowliness of stillness. Every vengeance and wrath turns into rest and strength. And every voice of the wakeful turns into dust-born silence.


    And no possession will again be a return to death for those who seek it. Those who snatch wages will no longer bring forth death before its time, and the death that is the wage of sufferings will be taken away. There will no longer be any occasion of joy merely for delight. The realm of change will be turned into accomplished conflict, and the sound of sinners in Sheol will no longer be heard.


    So when all these things happen, do you think they will not be required from the inhabitants of the earth on one day? If then their own disclosures show that they live, their guilt itself teaches the falsehood that is in them. I have set down its full measure, because they were begotten from falsehood before I die. And I said that they were putting their trust in evil[g][f][e][d][c][b]. Moses'
  footnotes:
  - marker: a
    text: The opening paragraph overlaps materially with the end of the preceding bucket, and Ceriani shows a nearby chapter marker; the present draft keeps the overlap visible rather than pretending the boundary is certain.
    reason: textual_variant
  - marker: b
    text: The lines beginning with the Most High 'hastening his times' are chapter-relevant but textually rough in Ceriani. Kmosko supports the broad apocalyptic sense, though some individual clauses remain medium-confidence.
    reason: alternative_reading
  - marker: c
    text: The closing lines on printed p. 175 are especially difficult. The rendering stays cautious and aims to preserve the thrust of exposure, guilt, falsehood, and evil delusion without claiming false precision.
    reason: textual_variant
  - marker: d
    text: Or 'He will judge those who mock'.
    reason: previous_rendering
  - marker: e
    text: Or 'There is no further turning back to death in its season.'.
    reason: previous_rendering
  - marker: f
    text: Or 'because from the beginning they were begotten from falsehood, from death.'.
    reason: previous_rendering
  - marker: g
    text: Or 'in an evil delusion.'.
    reason: previous_rendering
translation:
  language: ko
  text: '지금 우리는 민족들의 번영의 풍성함을 그들이 악을 행하는 동안 보지만[a], 그것은 침이라 여겨집니다. 우리는 그 권세의 힘을 바라보지만, 그것은 지나가는 수증기처럼 간주될 것입니다. 우리는 그 위대함의 영광을 헤아리지만, 그들이 전능자의 명령을 지키지 않고 그것을 멸시하였으므로, 그것은 고통받는 육체처럼 찾아질 것입니다. 우리는 눈에 보이는 그 아름다움을 생각하지만, 그것은 환난 가운데 흔들립니다. 그러나 그들은 고통받는 살처럼 찾아질 것입니다. 우리는 그들이 신뢰하는 그 확신을 생각하지만, 우리 눈앞에서 그것은 흔들립니다. 그러나 그것은 파도처럼 부서질 것입니다. 그리고 우리는 오직 그 힘의 희망만을 찾습니다. 그것은 하나님께서 그들에게 주신 좋은 것들 가운데서 번성하지만, 결국 치워질 것이며 그 위에 애도가 임할 것입니다.


    지극히 높으신 분은 참으로 자기 때를 서두르시며 자기 시각들을 가까이 오게 하십니다. 그는 압제하는 자들을 심판하시고, 시대의 선포들이 나갈 것입니다[b]. 모든 그들의 죄의 숨은 것들이 드러나고, 옳은 것에 대한 조용한 생각들이 솟아날 것입니다. 지금 도망할 수 있다고 생각하는 자들은 스스로를 구할 수 없고, 아무도 풍성한 음식으로 기근과 언약을 맺을 수 없습니다. 겸손한 자는 번영에 희망을 두지 않을 것이며, 오히려 그들의 마음은 변하지 않는 것들 안에서 하나가 될 것입니다. 그들은 그 두려운 끝이 이미 왔기 때문에, 오히려 더욱 소망할 것입니다. 그들은 지금의 세상의 즐거움을 바라보지 않을 것이며, 자기들이 끝으로 이끌리고 있다는 것만 알게 될 것입니다. 그러나 세상의 완성은 그의 다스리심의 큰 힘을 보여 줄 것입니다. 그때 모든 것은 내면으로 들어가고, 처음부터 정해졌던 것으로 돌아갈 것입니다. 그리하여 무엇이 발견되었든 그것이 사람들에 의해 세워진 것이 아니라, 참으로 완성에 이르렀음이 드러날 것입니다.


    무엇이 서 있었든지, 만들어졌든지, 충돌하여 사라졌든지는 이것을 보여 줍니다. 악은 영원히 악이 아니며, 선도 영원히 선이 아닙니다. 모든 건강은 병으로 바뀌고, 모든 힘은 약함으로, 모든 아름다움은 추함으로, 그리고 젊음의 모든 꽃은 무거운 노년으로 바뀝니다. 여러분이 보았던 모든 아름다움은 어둠과 부패로 바뀌고, 여러분이 만들어 낸 모든 황폐는 평화와 기쁨으로 바뀝니다. 주어졌던 모든 어둠은 진리의 빛으로 바뀝니다. 모든 오류와 약함은 고요의 낮아짐으로 바뀝니다. 모든 복수와 진노는 안식과 힘으로 바뀝니다. 그리고 깨어 있는 자의 모든 목소리는 흙에서 난 침묵으로 바뀝니다.


    또한 어떤 소유도 그것을 찾는 자들에게 다시는 죽음으로 돌아가는 것이 되지 않을 것입니다. 삯을 빼앗는 자들은 더 이상 때아닌 죽음을 불러내지 않을 것이며, 고난의 삯이 되는 죽음도 제거될 것입니다. 기쁨을 위한 단순한 즐거움의 자리는 더 이상 없을 것입니다. 변동의 영역은 이루어진 संघर्ष로 바뀔 것이며, 스올에서 죄인들의 소리는 더 이상 들리지 않을 것입니다.


    그러므로 이 모든 일이 일어날 때, 여러분은 그것들이 하루에 땅의 주민들에게 요구되지 않겠다고 생각합니까? 그러면 그들의 자기 드러냄이 그들이 살아 있음을 보여 준다면, 그들 자신의 죄책이 그들 안에 있는 거짓을 가르칩니다. 나는 그것의 완전한 분량을 기록해 두었습니다. 그들이 내가 죽기 전에 거짓에서 태어났기 때문입니다[c]. 그리고 나는 그들이 악 속에 있노라며 믿고 있었다고 말했습니다[d]. 모세'
  philosophy: optimal-equivalence
