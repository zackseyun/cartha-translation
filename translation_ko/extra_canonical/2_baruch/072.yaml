base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/072.yaml
  text: 'But hear also about the bright waters that are to come at the end[a], after those dark waters.


    This is the word: after the signs have come which were told to you before, the nations will be thrown into confusion, and the time of my Messiah will come. He will summon all the nations, and some of them he will spare, but others of them he will put to death.


    These, then, are the things that shall happen to those nations which are to be spared by him.


    Every people that has not known Israel and has not trampled the seed of Jacob—these are the ones that shall be spared.


    And this is because they shall be subjected, from among all the nations, to your people.


    But all those who have ruled over you, or have known you[b], all these shall be delivered to the sword.'
  footnotes:
  - marker: a
    text: The chapter edge is textually awkward in the current Ceriani bucket. This draft follows the standard Syriac/Latin control division for chapter 72 and preserves some wording with caution where the local boundary remains medium-confidence.
    reason: textual_variant
  - marker: b
    text: '''Bright waters'' continues the vision-symbolism of alternating waters; the expression is kept literal rather than reduced to a plain statement about times or eras.'
    reason: cultural_note
translation:
  language: ko
  text: '그러나 끝에 오게 될 밝은 물들에 대해서도 들으십시오[a] — 그 어두운 물들 뒤에 올 것들입니다.


    이것이 그 말씀입니다. 전에 당신에게 미리 말해 준 표징들이 일어난 뒤에는 민족들이 혼란에 빠질 것이며, 나의 메시아의 때가 올 것입니다. 그는 모든 민족을 소집하실 것이며, 그들 가운데 어떤 이들은 살려 두시고, 다른 이들은 죽이실 것입니다.


    그러면 그가 살려 두기로 된 민족들에게 일어날 일은 이러합니다.


    이스라엘을 알지 못하고 야곱의 씨를 짓밟지 않은 모든 민족들—그들이 살려 두어질 자들입니다.


    그것은 그들이 모든 민족 가운데서 당신의 백성에게 복종하게 될 것이기 때문입니다.


    그러나 당신을 다스렸던 모든 사람들, 또는 당신을 알았던 모든 사람들은 칼에 넘겨질 것입니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܝ̈ܐ ܒܗܝܪ̈ܐ / 'bright waters'
  english_pob_choice: bright waters
  chosen_korean: 밝은 물들
  alternatives_korean:
  - 맑은 물들
  - 빛나는 물들
  lexicon: Payne Smith
  rationale: 대조되는 ‘어두운 물들’과 함께 종말론적 상징을 살리기 위해 직역에 가깝게 ‘밝은 물들’로 옮겼습니다.
- source_word: tempus Messiae mei / 'my Messiah'
  english_pob_choice: my Messiah
  chosen_korean: 나의 메시아
  alternatives_korean:
  - 나의 그리스도
  - 나의 기름부음 받은 이
  lexicon: Payne Smith
  rationale: 본문의 종말론적·메시아적 표지를 분명히 드러내기 위해 ‘메시아’를 유지했습니다.
- source_word: advocabit omnes gentes / implied summon-all-nations clause
  english_pob_choice: will summon all the nations
  chosen_korean: 모든 민족을 소집하실 것입니다
  alternatives_korean:
  - 모든 민족을 부르실 것입니다
  - 모든 민족을 모으실 것입니다
  lexicon: Payne Smith
  rationale: 심판 장면의 왕적·재판적 강도를 살리기 위해 단순한 ‘모으다’보다 ‘소집하다’가 더 적절합니다.
- source_word: subiicientur ... populo tuo / 'shall be subjected ... to your people'
  english_pob_choice: shall be subjected ... to your people
  chosen_korean: 당신의 백성에게 복종하게 될 것입니다
  alternatives_korean:
  - 당신의 백성 아래에 복종하게 될 것입니다
  - 당신의 백성에게 예속될 것입니다
  lexicon: Payne Smith
  rationale: 본문이 말하는 것은 자발적 수용이 아니라 종말론적 질서 아래의 종속이므로 ‘복종하다’로 옮겼습니다.
theological_decisions:
- issue: ‘살려 두다/살려 두어지다’가 의미하는 범위
  chosen_reading: 심판 가운데서 일부 민족이 죽음 대신 보존되는 뜻으로 이해합니다.
  alternative_readings:
  - 영적 생명 부여
  - 구원론적 완전 구원
  rationale: 문맥에서 대조는 곧바로 ‘죽이실’과 연결되므로, 우선은 생물학적 생존/보존의 뜻을 유지하는 것이 과도한 신학적 확대를 피합니다.
  doctrine_reference: 종말 심판 문맥에서 서술 범위를 넘겨 구원론을 단정하지 않음
