base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/014.yaml
  text: '1 Then I answered and said[a], “Behold, you have shown me the course of the times, and what is to happen after these things, and you have told me of the retribution that is to come.


    2 Yet I said in my thoughts, ‘Many are those who have sinned and have lived, and only a few will remain in those times to whom these words may be spoken.


    3 For what profit is there in this, or what is worse than these things which we have seen, that we should desire to expect to see?’


    4 But I will speak before you: What more have those gained who knew you and did not walk in vanity like the rest,


    5 who did not seek the dead, but desired you, and did not turn their hearts to what is small and passing,


    6 and for whom the labor of good was sought, and for whom the prophets were found?


    7 Or who is there, O Lord, that knows what is not known to you? Or who can search out your way?


    8 Or who can learn your judgment, or comprehend your counsel which cannot be grasped?


    9 Or who among mortals can trace the beginning and the end of your wisdom?


    10 For we have all become like a breath.


    11 For as a breath rises without intention and vanishes, so is the nature of men: they go not by their own will, and they do not know what will happen to them in the end.


    12 But the righteous may rightly hope for the end, and they depart from this dwelling without fear, because they have with you a store of works kept in treasuries.


    13 Therefore they leave this world without fear, and, trusting in gladness[b][c][d][e][f][g], wait to receive the world that you promised them …'
  footnotes:
  - marker: a
    text: The middle of Baruch’s reply is locally rough in the present Ceriani/OCR state. The draft follows Ceriani as primary and uses the Kmosko control trajectory to keep the complaint’s sequence without claiming false precision in every clause.
    reason: alternative_reading
    anchor_ref: 14:1-6
  - marker: g
    text: The breath image is kept literal because the chapter’s lament depends on human frailty and transience, not merely on an abstract statement about mortality.
    reason: cultural_note
    anchor_ref: 14:10-11
  - marker: f
    text: The source bucket ends at a page edge and overlaps with the adjacent chapter bucket. The closing line here is therefore translated as an incomplete continuation rather than forced into false completeness.
    reason: textual_variant
    anchor_ref: '14:13'
  - marker: e
    text: Or 'What gain, then, is there in seeing the end of the times after the miseries of those times?’'.
    reason: previous_rendering
  - marker: d
    text: Or 'apart from the heart'.
    reason: previous_rendering
  - marker: c
    text: Or 'because with you the store of their works is kept.'.
    reason: previous_rendering
  - marker: b
    text: Or 'and trust with gladness that they will receive'.
    reason: previous_rendering
translation:
  language: ko
  text: '1 나는 대답하여 말했습니다[a]. 「보십시오, 주께서는 내게 시대의 흐름과 이 일들 뒤에 일어날 일들을 보여 주셨고, 오실 보응에 대해서도 말씀하셨습니다.


    2 그러나 나는 마음속으로 말했습니다. ‘죄를 지었고 또 살아남은 사람이 많고, 이 말들이 전해질 그때에 남아 있을 사람은 겨우 얼마 되지 않을 것입니다.


    3 그러니 이것이 무슨 유익이 있겠습니까? 아니면 우리가 보고자 기대하는 것이 무엇이기에, 우리가 본 이 일들보다 더 나쁜 것이 무엇이겠습니까?’


    4 그러나 제가 주님 앞에서 말하겠습니다. 당신을 알고도 나머지 사람들처럼 헛된 길로 걷지 않은 사람들은 무엇을 더 얻었습니까?


    5 죽은 자들을 찾지 않고 당신을 사모했으며, 작고 지나가는 것에 마음을 돌리지 않았고,


    6 선한 일의 수고가 그들에게 요구되었으며, 예언자들이 그들에게서 발견되었던 사람들 말입니다.


    7 주님, 당신께 알려지지 않은 것을 아는 이가 누구입니까? 아니면 누가 당신의 길을 찾아낼 수 있습니까?


    8 누가 당신의 판단을 배울 수 있으며, 누가 붙잡을 수 없는 당신의 계획을 깨달을 수 있습니까?


    9 죽을 자들 가운데 누가 당신의 지혜의 시작과 끝을 더듬어 찾을 수 있습니까?


    10 우리는 모두 한숨과 같아졌습니다.


    11 한숨이 아무 뜻 없이 올라왔다가 사라지듯, 사람의 본성도 그렇습니다. 그들은 자기 뜻대로 가지 않으며, 끝에 자신에게 무슨 일이 일어날지도 알지 못합니다.


    12 그러나 의인들은 마땅히 끝을 바랄 수 있으며, 당신과 함께 창고들에 간직된 일의 보화가 있으므로 두려움 없이 이 거처에서 떠납니다.


    13 그러므로 그들은 두려움 없이 이 세상을 떠나며, 기쁨 안에서 기다리며 당신께서 약속하신 세상을 받게 될 것을 기대합니다 …」'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܦܘܪܥܢܐ
  english_pob_choice: retribution
  chosen_korean: 보응
  alternatives_korean:
  - 응보
  - 심판의 갚음
  lexicon: Payne Smith
  rationale: 시리아어의 재판적·보상적 뉘앙스를 살리기 위해 단순한 ‘처벌’보다 ‘보응’을 택했습니다. 이는 문맥의 의인/악인 대비와도 잘 맞습니다.
- source_word: ܗܒܠܐ
  english_pob_choice: breath
  chosen_korean: 한숨
  alternatives_korean:
  - 숨결
  - 입김
  lexicon: Payne Smith
  rationale: 본문의 비유는 인간의 덧없음과 의존성을 강조하므로, 한국어에서는 짧게 올라왔다가 사라지는 이미지가 살아나는 ‘한숨’으로 옮겼습니다.
- source_word: ܕܠܐ ܡܢ ܠܒܐ
  english_pob_choice: without intention
  chosen_korean: 아무 뜻 없이
  alternatives_korean:
  - 무심코
  - 의도 없이
  lexicon: Payne Smith
  rationale: 직역의 ‘마음 없이’는 어색하므로, 시리아어 관용구가 말하는 ‘의도 없이/자기 뜻 없이’를 자연스럽게 드러내는 표현을 택했습니다.
- source_word: ܒܓܙ̈ܐ
  english_pob_choice: in treasuries
  chosen_korean: 창고들에 간직된 일의 보화
  alternatives_korean:
  - 보물창고에 보관된 행위들
  - 곳간에 쌓인 행위의 보물
  lexicon: Payne Smith
  rationale: ‘창고들’의 다수형과 보관 이미지를 살리면서, 의인들의 행위가 하나님께 저장된다는 종말론적 축복을 한국어로 분명히 했습니다.
- source_word: ܡܣܟܝܢ
  english_pob_choice: wait to receive
  chosen_korean: 기다리며 … 받을 것을 기대합니다
  alternatives_korean:
  - 받기를 바라며 기다립니다
  - 받을 것을 기다립니다
  lexicon: Payne Smith
  rationale: 이 동사는 단순한 신뢰보다 기다림·기대의 동작을 뜻하므로, 종말론적 대기 자세를 살리는 방향으로 옮겼습니다.
theological_decisions:
- issue: 의인의 ‘일’이 하나님께 저장된다는 이미지
  chosen_reading: 의인들의 행위는 단순한 기억이 아니라, 하나님과 함께 ‘창고들’에 간직된 보화로 제시됩니다.
  alternative_readings:
  - 그들의 선행이 단지 기억된다
  - 보상 언어를 약화시켜 일반적 위로로 처리한다
  rationale: 본문은 미래의 보상과 현재의 행위를 연결하는 묵시적 도식을 갖고 있으므로, 저장·보화 이미지를 약화하지 않고 보존해야 합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1
- issue: 인간의 유한성을 나타내는 비유
  chosen_reading: 인간은 ‘한숨’처럼 덧없고, 자기 뜻대로 움직이지 못하는 존재로 유지했습니다.
  alternative_readings:
  - 완곡하게 ‘숨결’로 처리한다
  - 단순히 죽음을 예고하는 은유로만 축소한다
  rationale: 문맥은 존재론적 허무보다 피조물의 취약성과 통제 불능성을 말합니다. 따라서 비유의 감각을 그대로 살렸습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 5
