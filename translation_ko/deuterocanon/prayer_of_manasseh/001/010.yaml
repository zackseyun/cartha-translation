base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/010.yaml
  text: I am bent down with many iron bonds[a], so that I cannot lift up my head, and there is no relief for me; because I provoked your wrath and did what is evil before you[b], setting up abominations and multiplying offenses.
  footnotes:
  - marker: a
    text: Or 'so that I cannot recover myself' or 'so that I cannot look up again'; the Greek infinitive may denote regaining composure or physically raising oneself.
    reason: lexical_alternative
  - marker: b
    text: '''Abominations'' likely refers to detestable, especially idolatrous, acts or objects.'
    reason: cultural_note
translation:
  language: ko
  text: 저는 많은 철의 결박[a]에 눌려 몸을 굽히고 있어, 머리를 들 수 없습니다. 저에게는 안식이 없습니다. 이는 제가 주님의 분노를 일으켰고, 주님 앞에서 악한 일을 행하여 가증한 것들을 세우고 미움을 사는 것들을 많이 늘렸기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정신을 차릴 수 없도록’, ‘다시 고개를 들 수 없도록’의 뜻일 수 있습니다. 그리스어 부정사구는 원기를 되찾는 것과 실제로 몸을 일으켜 고개를 드는 것을 모두 함축할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘가증한 것들’은 특히 우상숭배적이고 하나님이 혐오하시는 행위나 대상을 가리킬 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
- source_word: κατακαμπτόμενος
  english_pob_choice: I am bent down
  chosen_korean: 몸을 굽히고 있어
  alternatives_korean:
  - 굽혀져 있습니다
  - 눌려 있습니다
  - 몸이 굽은 채 있습니다
  lexicon: LSJ
  rationale: 압박 아래에서 몸이 아래로 굽는 이미지를 살리면서, 현대 한국어에서 자연스럽고 형상성이 유지되는 표현으로 옮겼습니다.
- source_word: πολλῷ δεσμῷ σιδηρῷ
  english_pob_choice: with many iron bonds
  chosen_korean: 많은 철의 결박
  alternatives_korean:
  - 많은 철사슬
  - 많은 철족쇄
  - 무거운 철의 사슬
  lexicon: LSJ
  rationale: δεσμός의 ‘결박’ 의미와 σιδηρῷ의 ‘철’ 이미지를 함께 보존했습니다. POB의 ‘iron bonds’에 맞추되, 결박의 압박감을 드러내는 쪽을 택했습니다.
- source_word: ἄνεσις
  english_pob_choice: relief
  chosen_korean: 안식
  alternatives_korean:
  - 위로
  - 휴식
  - 풀림
  lexicon: BDAG
  rationale: 이 문맥에서는 단순한 휴식보다 고통과 속박에서 풀려나는 상태가 핵심이어서, ‘안식’으로 옮겨 결핍의 뉘앙스를 살렸습니다.
- source_word: πληθύνας προσοχθίσματα
  english_pob_choice: multiplying offenses
  chosen_korean: 미움을 사는 것들을 많이 늘렸
  alternatives_korean:
  - 악행을 많이 늘렸
  - 가증한 일들을 많이 더했습니다
  - 역겨운 것들을 많이 늘렸
  lexicon: LSJ
  rationale: προσοχθίσματα는 하나님 앞에서 혐오를 불러일으키는 것들을 가리킬 수 있어, ‘오프펜스’보다 원뜻을 더 살린 완곡하지 않은 표현을 택했습니다.
theological_decisions:
- issue: βδελύγματα와 προσοχθίσματα의 도덕·우상숭배적 성격
  chosen_reading: 가증한 것들 / 미움을 사는 것들
  alternative_readings:
  - 우상들
  - 혐오스러운 것들
  - 역겨운 일들
  rationale: 본문의 회개의 고백 문맥에서 단순한 일반 악행보다, 하나님 앞에서 혐오스러운 가증함과 미움을 사는 행위를 함께 드러내는 것이 원문에 더 가깝습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
