  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: charles-1913-apot-vol1
  text: κατακαμπτόμενος πολλῷ δεσμῷ σιδηρῷ εἰς τὸ ἀνανεῦσαί με, καὶ οὐκ ἔστιν μοι ἄνεσις· διότι παρώργισα τὸν θυμόν σου καὶ τὸ πονηρὸν ἐνώπιόν σου ἐποίησα, στήσας βδελύγματα καὶ πληθύνας προσοχθίσματα.
