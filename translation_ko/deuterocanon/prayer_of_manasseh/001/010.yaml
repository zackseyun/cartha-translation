    issue: πολλῷ δεσμῷ σιδηρῷ를 ‘많은 철의 결박’으로 번역함
    rationale: 원문의 δεσμῷ는 단수이고 πολλῷ는 이 문맥에서 수량의 ‘많은’보다 크기·강도의 ‘큰/무거운’으로 이해하는 것이 자연스럽습니다.
  - severity: medium
    issue: ἄνεσις를 ‘안식’으로 번역함
    rationale: 이 단어는 고난과 압박에서의 완화, 안도, 풀림을 뜻합니다. ‘안식’은 한국어 성경 문체에서 종교적·궁극적 안식의 의미를 덧씌울 수 있습니다.
