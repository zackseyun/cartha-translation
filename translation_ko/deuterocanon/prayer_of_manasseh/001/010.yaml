revisions:
- from: 저는 많은 철의 결박[a]에 눌려 몸을 굽히고 있어, 머리를 들 수 없습니다. 저에게는 안식이 없습니다. 이는 제가 주님의 분노를 일으켰고, 주님 앞에서 악한 일을 행하여 가증한 것들을 세우고 미움을 사는 것들을 많이 늘렸기 때문입니다[b].
  to: 저는 무거운 철사슬에 짓눌려 몸을 일으킬 수 없으며, 숨 돌릴 여유도 없습니다. 제가 주님의 분노를 일으키고 주님 앞에서 악을 행했으며, 가증한 것들[b]을 세우고 혐오를 일으키는 것들을 많이 늘렸기 때문입니다[a].
  rationale: 원문의 단수 ‘무거운 철 결박’의 뜻을 반영하고, ἄνεσις를 문맥에 맞게 ‘숨 돌릴 여유’로 수정했습니다. 또한 προσοχθίσματα의 불확실한 범위를 유지하면서 자연스러운 한국어로 다듬고, 문화 주석의 앵커를 설명 대상인 βδελύγματα 직후로 옮겼습니다.
