base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/013.yaml
  text: 'I beg you[a], pleading with you: forgive me, Lord, forgive me, and do not destroy me along with my lawless deeds, nor, being angry forever, keep my evils against me, nor condemn me in the lowest parts of the earth; for you, Lord[b], are the God of those who repent[c],'
  footnotes:
  - marker: a
    text: Or 'hold my evils against me.' The Greek phrase can be rendered more idiomatically this way.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the depths of the earth.' The expression refers to the lowest regions beneath the earth.
    reason: lexical_alternative
  - marker: c
    text: Or 'condemn me in the lowest parts'.
    reason: previous_rendering
translation:
  language: ko
  text: 제가 간청하오니, 간절히 빕니다. 저를 용서하소서, 주님, 저를 용서하소서. 저를 제 불법한 행위들과 함께 멸하지 마시고, 영원히 분노하신 채 제 악을 제게 불리하게 간직해 두지도[a] 마시며, 땅의 가장 낮은 곳에서[b] 저를 정죄하지도 마소서. 주님은 회개하는 이들의 하나님이시기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 악을 제게 불리하게 기억해 두지도’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘땅의 가장 깊은 곳에서’로 옮길 수 있습니다. 그리스어는 땅 아래의 가장 낮은 영역을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτοῦμαι δεόμενός σου
  english_pob_choice: I beg you, pleading with you
  chosen_korean: 제가 간청하오니, 당신께 애원합니다
  alternatives_korean:
  - 제가 빌고 또 빕니다
  - 간절히 청합니다
  lexicon: BDAG
  rationale: 두 동사의 중첩된 간구를 합쇼체 기도문으로 자연스럽게 살리면서, 단순한 요청보다 절박한 청원을 드러내기 위해 ‘간청하다’와 ‘애원하다’를 함께 썼습니다.
- source_word: ἄνες μοι
  english_pob_choice: forgive me
  chosen_korean: 저를 용서하소서
  alternatives_korean:
  - 저를 사하소서
  - 저를 용납하소서
  lexicon: BDAG
  rationale: 회개의 기도 문맥에서 죄책의 해제를 뜻하므로, 현대 한국어에서 가장 분명한 ‘용서하다’를 택했습니다.
- source_word: ταῖς ἀνομίαις μου
  english_pob_choice: my lawless deeds
  chosen_korean: 제 불법한 행위들
  alternatives_korean:
  - 제 불법들
  - 제 무법한 행위들
  - 제 죄악들
  lexicon: BDAG
  rationale: ἀνομία의 강한 ‘율법 없음/불법’ 뉘앙스를 유지하기 위해 ‘죄들’로 완화하지 않고, 행위성을 살린 ‘불법한 행위들’로 옮겼습니다.
- source_word: μηδὲ εἰς τὸν αἰῶνα μηνίσας τηρήσῃς τὰ κακά μοι
  english_pob_choice: nor, being angry forever, keep my evils against me
  chosen_korean: 영원히 분노하신 채 제 악을 제게 남겨 두지도 마시며
  alternatives_korean:
  - 영원히 노하신 채 제 악을 저에게 간직하지도 마시며
  - 영원히 진노하신 채 제 악을 저에게 붙들어 두지도 마시며
  lexicon: LSJ
  rationale: 분사 μηνίσας의 지속적 분노 상태와 τηρήσῃς τὰ κακά μοι의 ‘악을 보관해 두다/기억해 두다’는 의미를 한국어 관용에 맞게 ‘남겨 두다’로 옮겼습니다.
- source_word: ἐν τοῖς κατωτάτοις τῆς γῆς
  english_pob_choice: in the lowest parts of the earth
  chosen_korean: 땅의 가장 낮은 곳에서
  alternatives_korean:
  - 땅의 가장 깊은 곳에서
  - 땅의 가장 낮은 지하에서
  lexicon: LSJ
  rationale: κατωτάτοις의 최상급을 그대로 살리면서, 자연스러운 한국어 어순으로 ‘땅의 가장 낮은 곳’을 택했습니다.
- source_word: τῶν μετανοούντων
  english_pob_choice: those who repent
  chosen_korean: 회개하는 이들
  alternatives_korean:
  - 회개하는 사람들
  - 회개자들
  lexicon: BDAG
  rationale: 현재분사의 지속적 성격을 살려, 회개의 상태에 있는 사람들을 현대 한국어로 간결하게 표현했습니다.
theological_decisions:
- issue: κύριε의 호칭과 기도체 처리
  chosen_reading: 주님으로 옮기되, 직접 호소와 명령형 청원은 합쇼체 기도문 어법으로 유지했습니다.
  alternative_readings:
  - 주로 옮기기
  - 하나님으로 풀어쓰기
  rationale: 본문의 κύριε는 하나님께 드리는 직접 호칭이므로 ‘주님’이 가장 자연스럽고, 한국어 기도문답게 청원형 종결을 유지하는 것이 원문의 긴박함을 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → 주님'
- issue: 정죄 표현의 강도
  chosen_reading: ‘정죄하지도 마소서’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘벌하지도 마소서’
  - ‘심판하지도 마소서’
  rationale: καταδικάσῃς는 단순한 징계보다 법정적 정죄를 뜻하므로, 회개 기도에서의 법정적 긴장을 흐리지 않기 위해 ‘정죄하다’를 택했습니다.
  doctrine_reference: Translation philosophy §1, §5
