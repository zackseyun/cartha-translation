base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/005.yaml
  text: before whom all things shudder and tremble at the presence of your power[a], for the majesty of your glory is unendurable, and the wrath of your threat against sinners is unbearable[d][c][b],
  footnotes:
  - marker: a
    text: Or 'at the presence of your power'; literally, 'from the face/presence of your power.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the majesty of your glory cannot be withstood.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the wrath of your threatening against sinners is insupportable.'
    reason: lexical_alternative
  - marker: d
    text: Or "because of your power's presence, because".
    reason: previous_rendering
translation:
  language: ko
  text: 그분의 위엄 있는 영광의 모습 앞에서는 만물이 다 떨며 흔들립니다. 당신의 영광의 위엄은 견딜 수 없고, 죄인들을 향한 당신의 위협의 진노는 감당할 수 없습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '당신의 능력의 임재 앞에서'; 문자적으로는 '당신의 능력의 얼굴/임재로부터'입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 '당신의 영광의 위엄은 견딜 수 없습니다.'
    reason: alternative_reading
  - marker: c
    text: 또는 '죄인들을 향한 당신의 위협의 진노는 감당할 수 없습니다.'
    reason: alternative_reading
  - marker: d
    text: 이 번역은 '당신의 능력의 임재 앞에서, 왜냐하면'에 해당하는 이전식 표현을 피하고 더 자연스러운 문장을 따랐습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ὃν
  english_pob_choice: before whom
  chosen_korean: 그분의
  alternatives_korean:
  - 그 누구 앞에
  - 그분 앞에
  lexicon: LSJ
  rationale: 관계대명사가 앞선 하나님을 가리키므로, 한국어에서는 문두의 주어를 자연스럽게 연결하는 소유격 구조로 풀어 fearful presence의 관계를 드러냈습니다.
- source_word: πάντα φρίσσει καὶ τρέμει
  english_pob_choice: all things shudder and tremble
  chosen_korean: 만물이 다 떨며 흔들립니다
  alternatives_korean:
  - 모든 것이 떨며 떱니다
  - 만물이 몸서리치며 떨립니다
  lexicon: LSJ
  rationale: πάντα의 우주적 범위를 살려 '만물'로 옮기고, φρίσσει/τρέμει의 병렬을 '떨며 흔들리다'로 자연스럽게 재현했습니다.
- source_word: ἀπὸ προσώπου τῆς δυνάμεώς σου
  english_pob_choice: at the presence of your power
  chosen_korean: 그분의 위엄 있는 영광의 모습 앞에서는
  alternatives_korean:
  - 당신의 능력의 얼굴 앞에서
  - 당신의 능력 앞에
  lexicon: LSJ
  rationale: 직역적 '얼굴/임재' 이미지는 보존하되, 한국어에서 어색하지 않도록 '앞에서는'으로 풀어 존재 앞에서의 두려움을 드러냈습니다.
- source_word: ἄστεκτος ἡ μεγαλοπρεπία τῆς δόξης σου
  english_pob_choice: the majesty of your glory is unendurable
  chosen_korean: 당신의 영광의 위엄은 견딜 수 없고
  alternatives_korean:
  - 당신의 영광의 위엄은 감당할 수 없고
  - 당신의 영광의 장엄함은 참을 수 없고
  lexicon: LSJ
  rationale: μεγαλοπρεπία를 '위엄'으로, ἄστεκτος를 '견딜 수 없고'로 옮겨, 신적 장엄함의 압도성을 과장 없이 유지했습니다.
- source_word: ἀνυπόστατος ἡ ὀργὴ τῆς ἐπὶ ἁμαρτωλοὺς ἀπειλῆς σου
  english_pob_choice: the wrath of your threat against sinners is unbearable
  chosen_korean: 죄인들을 향한 당신의 위협의 진노는 감당할 수 없습니다
  alternatives_korean:
  - 죄인들을 향한 당신의 경고의 진노는 견딜 수 없습니다
  - 죄인들에 대한 당신의 엄포의 진노는 참을 수 없습니다
  lexicon: LSJ
  rationale: ὀργή와 ἀπειλή의 결합을 약화하지 않기 위해 '위협의 진노'로 직역적 긴장을 살렸고, ἀνυπόστατος는 ἄστεκτος와 구별해 '감당할 수 없습니다'로 옮겼습니다.
theological_decisions:
- issue: 하나님의 진노와 위협을 완화하지 않을지 여부
  chosen_reading: '''죄인들을 향한 당신의 위협의 진노는 감당할 수 없습니다''로, 진노와 위협의 인격적·심판적 언어를 그대로 유지했습니다.'
  alternative_readings:
  - 죄인들에 대한 경고는 너무 강합니다
  - 죄인들을 향한 심판은 견딜 수 없습니다
  rationale: 원문은 하나님의 ὀργή와 ἀπειλή를 직접 말하므로, 이를 비인격적 결과나 일반적 경고로 완화하지 않고 그대로 보존하는 것이 문맥과 일치합니다.
  doctrine_reference: 하나님의 심판 언어를 원문 수준에서 보존
- issue: ἀπὸ προσώπου의 이미지 처리
  chosen_reading: '''앞에서는''으로 옮겨 문자적 ''얼굴/임재'' 이미지를 살리되 한국어 문장으로는 자연스럽게 만들었습니다.'
  alternative_readings:
  - 능력의 얼굴에서
  - 능력의 임재로부터
  rationale: 히브리식 관용구의 배경을 반영하면서도, 한국어 독자가 즉시 이해할 수 있는 공경체 문장을 우선했습니다.
  doctrine_reference: 원문 관용구의 이미지와 가독성의 균형
