- source_word: ἐν ταῖς ἡμέραις τῆς ζωῆς μου
  english_pob_choice: all the days of my life
  chosen_korean: 제 생명의 날들 동안
  alternatives_korean:
  - 제 삶의 모든 날 동안
  - 제 생애의 날들 동안
  lexicon: BDAG
  rationale: 개정판식 관용구를 그대로 덧씌우지 않고, ‘생명의 날들’이라는 원문의 시간 표지를 비교적 직접적으로 살렸습니다.
- source_word: πᾶσα ἡ δύναμις τῶν οὐρανῶν
  english_pob_choice: all the host of the heavens
  chosen_korean: 하늘들의 모든 군대
  alternatives_korean:
