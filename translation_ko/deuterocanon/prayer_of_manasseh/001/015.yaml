theological_decisions:
- issue: πᾶσα ἡ δύναμις τῶν οὐρανῶν의 범주
  chosen_reading: 추상적 ‘권능’보다 하늘의 천상 존재들/군대로 이해했습니다.
  alternative_readings:
  - 하늘의 총권능이 하나님을 찬양한다
  - 모든 천사적 권세를 뜻한다
  rationale: 문맥이 명백히 송영적이므로, 추상적 힘보다 공동체적·인격적 천상 존재들의 찬양으로 읽는 편이 본문 효과를 더 잘 보존합니다.
  doctrine_reference: 의도적으로 천상 존재의 성격을 과도하게 특정하지 않고 긴장을 유지합니다.
