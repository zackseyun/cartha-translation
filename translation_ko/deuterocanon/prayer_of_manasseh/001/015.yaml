  text: And I will praise you continually all the days of my life[a], for all the host of the heavens sings praise to you, and yours is the glory forever[c][b]. Amen.
  footnotes:
  - marker: a
    text: Or 'all the heavenly host' or 'every power of heaven.' The Greek phrase can denote the heavenly hosts/beings rather than abstract cosmic power.
    reason: lexical_alternative
  - marker: b
    text: Or 'all the days of my life'.
    reason: previous_rendering
  - marker: c
    text: Or 'because'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 저는 제 생명의 날들 동안 끊임없이 주님을 찬양하겠습니다. 하늘들의 모든 군대가 주님을 찬양하니, 영광은 영원히 주님의 것입니다. 아멘.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘들의 군대’ 혹은 ‘하늘의 모든 권능’. 이 그리스어 표현은 추상적 능력보다 천상 존재들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘제 생명의 모든 날 동안’.
    reason: previous_rendering
  - marker: c
    text: 또는 ‘이는/왜냐하면’.
    reason: previous_rendering
lexical_decisions:
- source_word: αἰνέσω
  english_pob_choice: I will praise
  chosen_korean: 찬양하겠습니다
  alternatives_korean:
  - 기리겠습니다
  - 찬미하겠습니다
  lexicon: BDAG
  rationale: 미래형의 결심을 살리면서도 예배 문맥에 어울리는 표준적인 동사를 택했습니다.
- source_word: διὰ παντὸς
