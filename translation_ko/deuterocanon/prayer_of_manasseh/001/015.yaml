  - 하늘들의 모든 권능
  lexicon: LEH
  rationale: 하늘의 존재들을 가리키는 집합적 표현으로 보고, ‘군대’로 옮겨 찬양의 주체가 된 천상 존재들의 집합성을 드러냈습니다.
- source_word: σοῦ ἐστιν ἡ δόξα
  english_pob_choice: yours is the glory
  chosen_korean: 영광은 영원히 주님의 것입니다
  alternatives_korean:
  - 주님의 것이 영광입니다
  - 영광은 주님께 있습니다
  lexicon: BDAG
  rationale: 소유를 나타내는 도식과 종결의 영광송 어조를 살려, 한국어에서 가장 자연스러운 소유 진술로 옮겼습니다.
theological_decisions:
- issue: πᾶσα ἡ δύναμις τῶν οὐρανῶν의 범주
  chosen_reading: 추상적 ‘권능’보다 하늘의 천상 존재들/군대로 이해했습니다.
  alternative_readings:
  - 하늘의 총권능이 하나님을 찬양한다
  - 모든 천사적 권세를 뜻한다
  rationale: 문맥이 명백히 송영적이므로, 추상적 힘보다 공동체적·인격적 천상 존재들의 찬양으로 읽는 편이 본문 효과를 더 잘 보존합니다.
  doctrine_reference: 의도적으로 천상 존재의 성격을 과도하게 특정하지 않고 긴장을 유지합니다.
