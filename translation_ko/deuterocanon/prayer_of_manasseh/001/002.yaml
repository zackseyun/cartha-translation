translation:
  language: ko
  text: 하늘과 땅과 그 모든 질서를 만드신 분[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 장식’, ‘그들의 배열’로도 옮길 수 있습니다. 여기서 헬라어 κόσμος는 두 번째로 ‘세상’을 말하기보다, 하늘과 땅에 속한 정돈된 전체를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ποιήσας
  english_pob_choice: the one who made
  chosen_korean: 만드신 분
  alternatives_korean:
  - 만드신 이
  - 창조하신 분
  lexicon: BDAG
  rationale: 관계절을 수식하는 분사형을 자연스러운 명사구로 옮기되, ποιέω의 직접적 의미를 살려 ‘만드신’으로 표현했습니다. ‘창조하신’은 신학적 해석을 덧붙일 수 있어 피했습니다.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  english_pob_choice: heaven and earth
  chosen_korean: 하늘과 땅
  alternatives_korean:
  - 하늘과 땅들
  - 천지
  lexicon: LSJ
  rationale: 고정된 우주론적 대구를 표준적 현대 한국어로 자연스럽게 옮겼습니다. ‘천지’는 전통적이지만 다소 관용어화되어 있어 직역성과 가독성의 균형상 ‘하늘과 땅’을 택했습니다.
- source_word: σὺν παντὶ τῷ κόσμῳ αὐτῶν
  english_pob_choice: with all their host
  chosen_korean: 그 모든 질서
  alternatives_korean:
  - 그 모든 배열
  - 그 모든 장식
  - 그 안에 있는 모든 것
  lexicon: LSJ
  rationale: κόσμος는 여기서 ‘세상’이라기보다 하늘과 땅에 속한 정돈된 전체를 가리키므로, ‘질서’로 옮겨 중복을 피하고 원문의 의미 범위를 살렸습니다. 소유 대명사 αὐτῶν은 ‘그들의’로 반영했습니다.
theological_decisions:
- issue: κόσμος의 의미를 ‘세계’가 아니라 질서로 옮길지 여부
  chosen_reading: 하늘과 땅에 속한 정돈된 전체를 가리키는 표현으로 이해하여 ‘그 모든 질서’로 번역했습니다.
  alternative_readings:
  - 그 모든 장식
  - 그 안에 있는 모든 것
  - 그 모든 배열
  rationale: 이미 ‘하늘과 땅’이 언급되었으므로 κόσμος를 다시 ‘세상’으로 옮기면 의미가 겹칩니다. 창조 맥락에서는 우주 안의 정돈된 전체라는 뜻이 더 적합하므로, 해석을 과도하게 확장하지 않는 범위에서 ‘질서’를 택했습니다.
  doctrine_reference: 원어 우선 원칙; 창조 진술에서의 어휘 의미 구분
