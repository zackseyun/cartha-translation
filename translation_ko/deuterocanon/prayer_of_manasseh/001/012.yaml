  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/012.yaml
  text: I have sinned, Lord, I have sinned, and I myself know my lawless deeds;
  footnotes:
  - marker: a
    text: Or 'my iniquities.' The Greek term denotes acts of lawlessness or violation of God's law.
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 죄를 지었습니다, 주님, 제가 죄를 지었습니다. 그리고 제가 저의 불법 행위를 압니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “저의 죄과들.” 그리스어 ἀνομία는 단순한 일반 죄보다 하나님의 법을 어기는 불법성을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμάρτηκα
  english_pob_choice: I have sinned
  chosen_korean: 제가 죄를 지었습니다
  alternatives_korean:
  - 제가 죄를 지었었습니다
  - 제가 범죄하였습니다
  lexicon: BDAG
  rationale: 완료 시상의 고백을 한국어에서는 현재 관련성을 살리는 완료형 표현으로 옮기되, 문맥상 자연스러운 합쇼체 고백문으로 다듬었습니다.
- source_word: κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 오 주님
  lexicon: BDAG
  rationale: 기도문의 직접 호칭으로서 한국어 교회 언어에서 가장 자연스럽고, 합쇼체 본문과도 잘 맞습니다.
- source_word: τὰς ἀνομίας μου
  english_pob_choice: my lawless deeds
  chosen_korean: 저의 불법 행위
  alternatives_korean:
  - 저의 불법한 일들
  - 저의 죄악들
  - 저의 불법 행위들
  lexicon: BDAG
  rationale: ἀνομία의 핵심 의미인 율법/법에 대한 위반을 살리기 위해 전통적 '죄악'보다 직역성이 높은 '불법 행위'를 선택했습니다.
- source_word: ἐγώ γινώσκω
  english_pob_choice: I myself know
  chosen_korean: 제가 압니다
  alternatives_korean:
  - 제가 스스로 압니다
  - 저 자신이 압니다
  - 제가 알고 있습니다
  lexicon: BDAG
  rationale: 문장에서는 강조된 ἐγώ를 한국어 어순으로 크게 부각하지 않아도 되지만, 주어를 반복해 화자를 분명히 했습니다.
theological_decisions:
- issue: ἀνομία의 한국어 처리
  chosen_reading: 불법 행위
  alternative_readings:
  - 죄악
  - 죄과
  - 불의한 일
  rationale: 이 기도문은 단순한 일반적 악이 아니라 하나님의 법을 어긴 사실을 자복하므로, 법 위반의 뉘앙스를 드러내는 번역이 본문 긴장을 더 정확히 보존합니다.
  doctrine_reference: 'DOCTRINE.md: original-language primacy; key-term consistency'
- issue: 회개의 직접 고백문에서의 문체
  chosen_reading: 현대 합쇼체의 직접적인 자복 형식
  alternative_readings:
  - 더 전통적인 교회 문어체
  - 감탄형 기도문조
  rationale: 원문은 반복된 죄 고백이 중심이므로, 과도한 예전적 수사를 덜어내고도 회개의 절박함이 드러나도록 간결하게 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: source-direct, readable contemporary Korean'
