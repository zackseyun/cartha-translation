translation:
  language: ko
  text: 이제 저는 마음의 무릎을 굽히고, 주님께로부터 오는 친절을 간구합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘마음의 무릎’입니다. 그리스어는 내적 겸손을 생생한 신체 은유로 표현합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘주님께로부터 오는’에 해당하는 그리스어 표현은 문자적으로 ‘당신으로부터’를 포함하며, 이 친절이 하나님에게서 나온다는 점을 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κλίνω γόνυ καρδίας
  english_pob_choice: I bend the knee of my heart
  chosen_korean: 마음의 무릎을 굽혀
  alternatives_korean:
  - 마음의 무릎을 꿇어
  - 마음의 무릎을 숙여
  lexicon: BDAG
  rationale: 그리스어의 충격적인 은유를 그대로 살리되, 한국어에서는 자연스럽게 읽히는 동작 동사 ‘굽히다’를 택해 내적 겸손의 형상을 유지했습니다.
- source_word: δεόμενος
  english_pob_choice: imploring
  chosen_korean: 간구합니다
  alternatives_korean:
  - 애원합니다
  - 간청합니다
  - 구합니다
  lexicon: BDAG
  rationale: 현재형 분사 δεόμενος의 간절한 청원을 합쇼체에 맞게 압축해 옮겼습니다. ‘간구합니다’가 공손하면서도 절박한 뉘앙스를 가장 안정적으로 전달합니다.
- source_word: τῆς παρὰ σοῦ χρηστότητος
  english_pob_choice: the kindness from you
  chosen_korean: 주님의 친절을
  alternatives_korean:
  - 주님의 선하심을
  - 주님의 인자하심을
  - 주님께로부터 오는 친절을
  lexicon: BDAG
  rationale: χρηστότης의 기본 의미인 ‘친절/선함/호의’ 가운데, 현대 한국어에서 문맥상 가장 직접적이고 읽기 쉬운 ‘친절’을 채택했습니다. παρὰ σοῦ의 ‘from you’는 소유격 관용으로 자연스럽게 녹였습니다.
theological_decisions:
- issue: γόνυ καρδίας의 내적 무릎 꿇음 은유
  chosen_reading: 직역에 가깝게 ‘마음의 무릎’을 유지해, 회개의 몸짓을 내면화한 이미지로 드러냈습니다.
  alternative_readings:
  - 마음으로 무릎을 꿇어
  - 마음으로 굴복하여
  rationale: 본문은 단순한 태도 진술이 아니라, 마음의 깊은 자리에서 드리는 굴복을 시각적으로 표현합니다. 은유를 보존해야 본문의 경건성과 수사적 힘이 살아납니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
