- source_word: οὐκ ἔθου / ἔθου μετάνοιαν
  english_pob_choice: did not appoint repentance / appointed repentance
  chosen_korean: 회개를 두지 않으셨지만 … 회개를 두셨습니다
  alternatives_korean:
  - 회개를 정하지 않으셨지만 … 회개를 정하셨습니다
  - 회개를 베풀지 않으셨지만 … 회개를 베푸셨습니다
  lexicon: LSJ
  rationale: τίθημι의 ‘두다/정하다’ 의미를 살리면서, μετάνοιαν과의 결합을 한국어로 자연스럽게 옮겼습니다.
- source_word: τοῖς οὐχ ἡμαρτηκόσιν σοι
  english_pob_choice: who did not sin against you
  chosen_korean: 당신께 죄를 짓지 않은
  alternatives_korean:
