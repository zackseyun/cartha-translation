  text: σὺ οὖν, κύριε ὁ θεὸς τῶν δικαίων, οὐκ ἔθου μετάνοιαν δικαίοις, τῷ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ τοῖς οὐχ ἡμαρτηκόσιν σοι, ἀλλ' ἔθου μετάνοιαν ἐμοὶ τῷ ἁμαρτωλῷ,
