base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/008.yaml
  text: So you[a], Lord, God of the righteous, did not appoint repentance for the righteous—for Abraham and Isaac and Jacob, who did not sin against you—but you appointed repentance for me, the sinner,
  footnotes:
  - marker: a
    text: Or 'did not set repentance before the righteous.' The verb can mean 'set' or 'appoint'; 'appoint' was chosen for clearer English with 'repentance.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 주님, 의인들의 하나님이시여, 당신께 죄를 짓지 않은 아브라함과 이삭과 야곱 같은 의인들에게는 회개를 두지 않으셨지만, 죄인인 저에게는 회개를 두셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘의인들 앞에 회개를 두지 않으셨다’. 동사 τίθημι는 ‘두다’ 또는 ‘정하다’를 뜻할 수 있으며, 여기서는 ‘회개’와의 결합을 분명히 하기 위해 ‘두다’를 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ οὖν
  english_pob_choice: So you
  chosen_korean: 그러므로 주님
  alternatives_korean:
  - 그래서 주님
  - 그러니 주님
  lexicon: LSJ
  rationale: οὖν의 추론·연결 기능을 한국어 담화 표지로 자연스럽게 살리되, 기도문의 직접 호소를 유지했습니다.
- source_word: ὁ θεὸς τῶν δικαίων
  english_pob_choice: God of the righteous
  chosen_korean: 의인들의 하나님
  alternatives_korean:
  - 의로운 이들의 하나님
  - 의인의 하나님
  lexicon: LSJ
  rationale: γενitival 구문을 그대로 살려 ‘의인들’과 ‘하나님’의 소속 관계를 분명히 했습니다.
- source_word: οὐκ ἔθου / ἔθου μετάνοιαν
  english_pob_choice: did not appoint repentance / appointed repentance
  chosen_korean: 회개를 두지 않으셨지만 … 회개를 두셨습니다
  alternatives_korean:
  - 회개를 정하지 않으셨지만 … 회개를 정하셨습니다
  - 회개를 베풀지 않으셨지만 … 회개를 베푸셨습니다
  lexicon: LSJ
  rationale: τίθημι의 ‘두다/정하다’ 의미를 살리면서, μετάνοιαν과의 결합을 한국어로 자연스럽게 옮겼습니다.
- source_word: τοῖς οὐχ ἡμαρτηκόσιν σοι
  english_pob_choice: who did not sin against you
  chosen_korean: 당신께 죄를 짓지 않은
  alternatives_korean:
  - 당신께 죄를 범하지 않은
  - 당신께 죄를 짓지 않았던
  lexicon: LSJ
  rationale: σοι를 ‘당신께’로 받아 직접적인 대상을 드러내고, ἁμαρτάνω의 통상적 의미를 간결하게 옮겼습니다.
- source_word: τῷ ἁμαρτωλῷ
  english_pob_choice: the sinner
  chosen_korean: 죄인인 저
  alternatives_korean:
  - 죄인인 저에게
  - 이 죄인에게
  lexicon: LSJ
  rationale: 아포지션적 자기 규정을 한국어에서 자연스럽게 살리기 위해 1인칭 강조를 유지했습니다.
theological_decisions:
- issue: 아브라함·이삭·야곱이 ‘당신께 죄를 짓지 않았다’는 직접 진술의 긴장
  chosen_reading: '그대로 유지했습니다: ‘당신께 죄를 짓지 않은 아브라함과 이삭과 야곱’'
  alternative_readings:
  - 큰 죄를 짓지 않은
  - 이 일에서 죄를 짓지 않은
  rationale: 그리스어 원문이 한정 없이 단정하므로, 다른 성경 본문과 조화시키기보다 기도의 수사와 대조를 보존했습니다.
  doctrine_reference: 본문의 긴장을 보존하고 조화시키지 않음
