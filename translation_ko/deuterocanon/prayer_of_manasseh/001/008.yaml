base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/008.yaml
  text: So you[a], Lord, God of the righteous, did not appoint repentance for the righteous—for Abraham and Isaac and Jacob, who did not sin against you—but you appointed repentance for me, the sinner,
  footnotes:
  - marker: a
    text: Or 'did not set repentance before the righteous.' The verb can mean 'set' or 'appoint'; 'appoint' was chosen for clearer English with 'repentance.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 주님, 의인들의 하나님이시여, 의인들, 곧 주님께 죄를 짓지 않은 아브라함과 이삭과 야곱에게는 회개를 두지 않으셨으나, 죄인인 저에게는 회개를 두셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘의인들 앞에 회개를 두지 않으셨다’. 동사 τίθημι는 ‘두다’ 또는 ‘정하다’를 뜻할 수 있으며, 여기서는 원문의 반복과 표현을 살려 ‘두다’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ οὖν
  english_pob_choice: So you
  chosen_korean: 그러므로 주님
  alternatives_korean:
  - 그래서 주님
  - 그러니 주님
  lexicon: LSJ
  rationale: οὖν의 추론·연결 기능을 한국어 담화 표지로 자연스럽게 살리되, 기도문의 직접 호소를 유지했습니다.
- source_word: ὁ θεὸς τῶν δικαίων
  english_pob_choice: God of the righteous
  chosen_korean: 의인들의 하나님
  alternatives_korean:
