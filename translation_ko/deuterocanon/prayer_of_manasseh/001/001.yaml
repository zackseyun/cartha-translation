review_pass:
  verdict: revise
  source_fidelity: 그리스어 παντοκράτωρ는 ‘만군의’(צבאות/Sabaoth 계열)가 아니라 하나님의 전능한 주권을 뜻하므로 ‘전능하신’으로 옮겨야 합니다. 또한 원문은 하나님께 직접 부르는 호격이므로 종결 평서형 ‘하나님이십니다’보다 ‘하나님이시여’가 충실합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체의 기도문 호격으로 자연스럽습니다. 원문의 긴 속격 연쇄는 한국어에서 ‘하나님이시여’를 한 번 더 밝혀 자연스럽고 분명하게 재구성했습니다.
  terminology: ‘전능하신 주님’은 Κύριε παντοκράτωρ의 통상적이고 정확한 번역입니다. ‘조상들’은 여기서 언약 전승의 관용적 표현으로 자연스럽게 λειτουργ하며, ‘의로운 자손’은 τοῦ δικαίου σπέρματος의 집합적 혈통 의미를 보존합니다.
  issues:
  - severity: high
    issue: παντοκράτωρ를 ‘만군의’로 번역함
    rationale: ‘만군의’는 통상 히브리어 ‘여호와 체바오트’ 및 그 번역어에 해당하며, παντοκράτωρ의 ‘전능한/모든 것을 다스리는’ 의미와 동일하지 않습니다.
  - severity: medium
    issue: 직접 기도 호격을 평서 종결 ‘하나님이십니다’로 처리함
    rationale: Κύριε는 호격이며, 이 구절은 하나님께 드리는 기도의 호명입니다. 한국어에서도 ‘하나님이시여’로 직접 부르는 형식이 원문의 화행과 문체를 보존합니다.
  revised_text: 전능하신 주님, 우리 조상들의 하나님이시여, 아브라함과 이삭과 야곱과 그들의 의로운 자손의 하나님이시여,
  revised_footnotes:
