translation:
  language: ko
  text: 주 만군의 하나님, 우리 조상들의 하나님, 곧 아브라함과 이삭과 야곱의 하나님이시며 그들의 의로운 자손의 하나님이십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '씨'. 이 그리스어는 언약적 혈통 문맥에서는 더 문자적으로 '씨'로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주
  alternatives_korean:
  - 주님
  - 주인이신 이
  lexicon: BDAG
  rationale: 하나님께 드리는 호칭이므로 직접 주소는 '주'로 간결하고 경건하게 살렸습니다. '주님'도 가능하지만, 본문의 호격과 병렬되는 호칭 구조에는 '주'가 더 직접적입니다.
- source_word: παντοκράτωρ
  english_pob_choice: Almighty
  chosen_korean: 만군의
  alternatives_korean:
  - 전능하신
  - 모든 것을 다스리시는
  lexicon: LEH
  rationale: 그리스어 제목의 장엄한 신적 칭호를 한국어 성경 전통의 '만군의 하나님' 표현으로 옮겨, 단순한 능력 강조보다 통치 주권의 무게를 살렸습니다.
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  english_pob_choice: God of our fathers
  chosen_korean: 우리 조상들의 하나님
  alternatives_korean:
  - 우리 조상들의 하나님
  - 우리 아버지들의 하나님
  lexicon: LEH
  rationale: 관례적 언약 공식의 의미를 유지하되, 한국어에서는 '조상들'이 혈통과 언약 계승을 더 자연스럽게 드러냅니다. 원문의 복수성을 보존하기 위해 단수화하지 않았습니다.
- source_word: σπέρματος
  english_pob_choice: offspring
  chosen_korean: 자손
  alternatives_korean:
  - 씨
  - 후손
  lexicon: LEH
  rationale: 문맥상 혈통 계승을 가리키므로 '자손'이 가장 자연스럽고, 영어 POB의 'offspring'이 가진 집합적 의미도 잘 반영합니다.
theological_decisions:
- issue: παντοκράτωρ의 한국어 신학적 어감
  chosen_reading: 만군의 하나님
  alternative_readings:
  - 전능하신 하나님
  - 모든 것을 다스리시는 하나님
  rationale: 이 기도문은 하나님의 절대 권능뿐 아니라 언약 공동체의 왕적 통치를 호명합니다. '만군의 하나님'은 한국어 성경에서 이러한 위엄과 통치를 함께 전달하는 익숙한 신학적 표현입니다.
  doctrine_reference: 'POB translation philosophy: source-faithful, ecclesial readability'
- issue: τοῦ δικαίου의 처리
  chosen_reading: 의로운 자손
  alternative_readings:
  - 의로운 씨
  - 의로운 후손
  rationale: γραμμαatically 'δικαίου'는 'σπέρματος'를 수식하므로, 품격을 유지하면서도 집합적 의미를 살리는 '의로운 자손'이 가장 자연스럽습니다. '씨'는 원문 연결은 강하지만 한국어 가독성이 떨어집니다.
  doctrine_reference: 'POB glossary: σπέρμα in covenant-lineage contexts'
