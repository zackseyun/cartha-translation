  text: Lord Almighty[a], God of our fathers, of Abraham and Isaac and Jacob and of their righteous offspring,
  footnotes:
  - marker: a
    text: Or 'seed.' The Greek term can also be rendered more literally as 'seed,' especially in covenant-lineage contexts.
