    text: 또는 ‘씨’. 이 그리스어 단어는 언약적 혈통의 문맥에서 더 문자적으로 ‘씨’로 옮길 수도 있습니다.
    reason: lexical_alternative
  revision_rationale: ‘만군의’를 παντοκράτωρ에 충실한 ‘전능하신’으로 바로잡고, 기도문의 직접 호격을 ‘하나님이시여’로 복원했습니다. ‘자손’과 그 대안 ‘씨’는 σπέρμα의 혈통적·집합적 의미를 유지합니다.
