    rationale: 기존 각주 ‘또는 두렵고 영광스러운 이름’은 본문 표현에서 ‘주님의’만 생략한 것으로, φοβερός에 대한 대체 번역을 제공하지 않습니다. ‘경외롭고’는 원문의 경외를 일으키는 의미를 반영하는 유효한 대안입니다.
  revised_text: 심연을 닫으시고, 그것을 주님의 두렵고 영광스러운 이름으로 봉인하신 분이십니다.[a]
