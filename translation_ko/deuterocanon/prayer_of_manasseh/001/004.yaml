lexical_decisions:
- source_word: ὁ κλείσας
  english_pob_choice: who shut up
  chosen_korean: 닫으시고
  alternatives_korean:
  - 가두신
  - 막으신
  - 닫아 두신
  lexicon: LSJ
  rationale: κλείω의 핵심은 ‘닫다/잠그다’이므로, 문맥상 ‘깊음’을 제어하신 행위를 간결하게 살려 ‘닫으시고’로 옮겼습니다.
- source_word: τὴν ἄβυσσον
  english_pob_choice: the abyss
  chosen_korean: 깊음
  alternatives_korean:
  - 심연
  - 무저갱
  - abyss
  lexicon: LSJ
  rationale: 이 경구적 기도문에서는 우주적 ‘심연’의 이미지를 가리키지만, 한국어 성경어휘에서는 ‘깊음’이 가장 자연스럽고 원문의 고대 우주론적 울림도 유지합니다.
- source_word: σφραγισάμενος αὐτὴν
  english_pob_choice: sealed it
  chosen_korean: 그것을 ... 봉인하신
  alternatives_korean:
  - 그것에 인을 치신
  - 그것을 인치신
  - 그것을 봉인하신
  lexicon: LSJ
  rationale: σφραγίζω의 핵심은 확실히 ‘봉인하다/인을 치다’인데, 현대 한국어에서는 ‘봉인하다’가 의미를 분명하게 전달합니다.
- source_word: τῷ φοβερῷ καὶ ἐνδόξῳ ὀνόματί σου
  english_pob_choice: with your fearful and glorious name
  chosen_korean: 주님의 두렵고 영광스러운 이름으로
  alternatives_korean:
  - 주님의 두렵고 영광스러운 이름으로
  - 주님의 경외롭게도 영광스러운 이름으로
  - 주님의 두려운 이름과 영광스러운 이름으로
  lexicon: LSJ
  rationale: φοβερός는 단순한 ‘무서운’이 아니라 경외를 불러일으키는 성격이므로 ‘두렵고’로, ἐνδόξος는 ‘영광스러운’으로 옮겨 대칭을 살렸습니다.
theological_decisions:
- issue: 하나님의 이름의 성격을 어떻게 드러낼 것인가
  chosen_reading: ‘두렵고 영광스러운’으로 유지하여 경외와 찬양의 긴장을 살렸습니다.
  alternative_readings:
  - ‘경외로운’으로 완화
  - ‘무서운’으로 직역
  rationale: 원문은 하나님의 이름이 단지 아름답다는 뜻이 아니라, 두려움과 영광을 함께 일으키는 거룩한 권위를 말합니다. 이를 완화하지 않고 보존하는 것이 본문 의도에 가깝습니다.
  doctrine_reference: 성호(聖號)와 하나님의 거룩한 권위에 대한 경외의 표현
