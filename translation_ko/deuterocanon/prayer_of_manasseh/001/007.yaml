base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/007.yaml
  text: For you are the Lord Most High[a], compassionate, patient, and abounding in mercy[b], and relenting concerning the evils of men.
  footnotes:
  - marker: a
    text: Or 'relenting concerning the evils of men'; the Greek verb can also be rendered 'repenting,' but here it refers to God turning from judgment, not to moral repentance.
    reason: lexical_alternative
  - marker: b
    text: '''Men'' here is representative language for human beings generally.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님은 지극히 높으신 분이시며, 자비로우시고, 오래 참으시며, 자비가 풍성하시고, 사람들의 악[a]에 대하여 뜻을 돌이키시는 분이십니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사람들’은 여기서 인류 전체를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘뜻을 돌이키시는’으로 옮긴 그리스어는 문맥에 따라 ‘마음을 바꾸시다’ 또는 ‘뉘우치다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주인
  lexicon: BDAG
  rationale: 하나님을 가리키는 κύριος의 기본 경칭으로, 한국어 합쇼체에서 가장 자연스럽고 예배적 뉘앙스를 유지합니다.
- source_word: ὕψιστος
  english_pob_choice: Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 가장 높으신 분
  - 지존하신 분
  lexicon: LSJ
  rationale: 하나님 칭호로서의 높으심을 살리되, 한국어에서 직역투를 줄이고 존칭 구조로 자연스럽게 옮겼습니다.
- source_word: εὔσπλαγχνος
  english_pob_choice: compassionate
  chosen_korean: 자비로우시고
  alternatives_korean:
  - 긍휼이 많으시고
  - 동정이 깊으시고
  lexicon: LSJ
  rationale: 내장/심정의 깊은 긍휼을 가리키는 말로, 뒤의 πολυέλεος와 중복을 피하면서도 하나님의 정서적 자비를 살렸습니다.
- source_word: πολυέλεος
  english_pob_choice: abounding in mercy
  chosen_korean: 은혜가 풍성하시고
  alternatives_korean:
  - 자비가 풍성하시고
  - 긍휼이 많으시고
  lexicon: LSJ
  rationale: ‘많은/풍성한 자비’의 뜻을 한국어 관용에 맞게 풀어, 앞의 자비로우심과 구별되면서도 중첩된 강조를 유지했습니다.
- source_word: μετανοῶν ἐπὶ κακίαις ἀνθρώπων
  english_pob_choice: relenting concerning the evils of men
  chosen_korean: 사람들의 악에 대하여 뜻을 돌이키시는
  alternatives_korean:
  - 사람들의 악 때문에 마음을 바꾸시는
  - 사람들의 악을 보시고 진노를 거두시는
  lexicon: LSJ
  rationale: 하나님께 ‘repenting’라는 도덕적 회개를 돌리는 오해를 피하고, 심판을 거두시는 의미의 ‘뜻을 돌이키다’로 옮겼습니다.
theological_decisions:
- issue: ὕψιστος와 κύριος의 결합을 어떻게 예배적 호칭으로 살릴지
  chosen_reading: ‘지극히 높으신 분이시며’로 하나님의 주권적 칭호를 유지했습니다.
  alternative_readings:
  - ‘가장 높으신 주님’
  - ‘지존하신 주님’
  rationale: 본문은 하나님을 ‘주’이면서 동시에 ‘지극히 높으신 분’으로 병렬 묘사하므로, 두 칭호의 긴장을 유지하는 쪽이 더 충실합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: μετανοῶν의 신학적 함의
  chosen_reading: 하나님의 도덕적 회개가 아니라 심판을 거두시는 방향 전환으로 읽었습니다.
  alternative_readings:
  - 하나님이 회개하시는
  - 하나님이 마음을 바꾸시는
  rationale: 본문의 문맥은 인간의 악에 대해 하나님이 벌하시는 길에서 돌이키시는 것을 말하며, ‘회개’는 하나님의 무죄성을 해칠 수 있습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
