id: MAN.1.7
reference: Prayer of Manasseh 1:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: charles-1913-apot-vol1
  text: ὅτι σὺ εἶ κύριος ὕψιστος, εὔσπλαγχνος, μακρόθυμος καὶ πολυέλεος, καὶ μετανοῶν ἐπὶ κακίαις ἀνθρώπων.
  language: Greek
