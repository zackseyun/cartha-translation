lexical_decisions:
- source_word: ὁ πεδήσας
  english_pob_choice: the one who bound
  chosen_korean: 묶으신 분
  alternatives_korean:
  - 속박하신 분
  - 족쇄를 채우신 분
  - 가두신 분
  lexicon: LSJ
  rationale: πεδήσας의 핵심 이미지는 물리적으로 묶거나 족쇄를 채우는 행위이므로, 한국어에서도 구체적 이미지가 살아 있는 ‘묶다’를 택했습니다. ‘가두다’는 의미를 넓히고, ‘속박하다’는 다소 추상적입니다.
- source_word: τὴν θάλασσαν
  english_pob_choice: the sea
  chosen_korean: 바다
  alternatives_korean:
  - 바다를
  - 물결을
  - 물들을
  lexicon: LSJ
  rationale: θάλασσα는 직접적으로 ‘바다’를 가리키므로, 의미를 넓히는 ‘물들’보다 기본어를 그대로 살렸습니다.
- source_word: τῷ λόγῳ
  english_pob_choice: by the word
  chosen_korean: 말씀으로
  alternatives_korean:
  - 말로
  - 선언으로
  - 명령으로
  lexicon: BDAG
  rationale: λόγος는 여기서 창조적·권위 있는 발화를 가리키므로, 한국어 성서 문맥에서 자연스럽고 격조 있는 ‘말씀’이 적절합니다.
- source_word: τοῦ προστάγματός σου
  english_pob_choice: of your command
  chosen_korean: 주님의 명령
  alternatives_korean:
  - 주님의 명령의
  - 주님의 칙령의
  - 주님의 법령의
  lexicon: LSJ
  rationale: πρόσταγμα은 명령·지시의 뜻이므로, 제도적 뉘앙스가 강한 ‘법령’보다 직접적인 ‘명령’이 원문에 가깝습니다.
theological_decisions:
- issue: 하나님의 창조 주권을 나타내는 생생한 ‘묶다’ 은유 보존
  chosen_reading: 바다를 ‘묶으신’ 표현을 유지하여, 하나님의 권위가 혼돈의 바다를 제어하는 장면을 직설적으로 드러냈습니다.
  alternative_readings:
  - 바다를 제한하신 분
  - 바다를 다스리신 분
  - 바다의 경계를 정하신 분
  rationale: 원문은 설명적 풀어쓰기가 아니라 구체적 결박 이미지를 사용합니다. 이를 완화하면 본문의 힘이 줄어들기 때문에 은유를 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
