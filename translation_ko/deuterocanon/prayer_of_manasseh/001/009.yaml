base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/009.yaml
  text: For I have sinned beyond the number of the sand of the sea. My lawless deeds have multiplied[a], Lord; my lawless deeds have multiplied, and I am not worthy to look up and see the height of heaven because of the multitude of my unrighteous acts.
  footnotes:
  - marker: a
    text: Or 'to gaze intently and see the height of heaven.' The Greek verb can emphasize fixed or intent looking, not merely upward direction.
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 바다의 모래 수보다 더 많이 죄를 지었습니다. 주님, 제 불법 행위들이 많아졌습니다. 제 불법 행위들이 많아졌고, 제 불의한 행위들이 너무 많아서 저는 하늘의 높이를 응시하여[a] 볼 자격이 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘응시하여’는 단순히 바라보는 것뿐 아니라 시선을 고정하여 자세히 바라본다는 뜻으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥμαρτον
  english_pob_choice: I have sinned
  chosen_korean: 죄를 지었습니다
  alternatives_korean:
  - 죄를 지었습니다
  - 죄지었습니다
  lexicon: BDAG
  rationale: 회개 고백의 현재적 효력을 살리되, 한국어에서는 단순 과거보다 자연스러운 완결형으로 표현했습니다.
- source_word: ὑπὲρ ἀριθμὸν ψάμμου θαλάσσης
  english_pob_choice: beyond the number of the sand of the sea
  chosen_korean: 바다의 모래보다도 더 많이
  alternatives_korean:
  - 바다 모래의 수를 넘어
  - 바다의 모래 수보다 많아
  lexicon: LSJ
  rationale: 직역보다 한국어 관용에 맞게 무수함을 드러내면서도, 성경적 상투 이미지를 유지했습니다.
- source_word: ἀνομίαι
  english_pob_choice: lawless deeds
  chosen_korean: 불법 행위
  alternatives_korean:
  - 불법 행위
  - 율법 없는 행위
  - 불법들
  lexicon: BDAG
  rationale: ἀνομία의 율법/질서 위반이라는 법적-도덕적 뉘앙스를 살리기 위해 ‘불법 행위’로 옮겼습니다.
- source_word: ἀδικιῶν
  english_pob_choice: unrighteous acts
  chosen_korean: 불의한 행위
  alternatives_korean:
  - 불의한 행위
  - 부정한 행위
  - 잘못된 행위
  lexicon: BDAG
  rationale: 앞의 ἀνομίαι와 구별되도록 같은 ‘죄’로 뭉개지 않고, 의/불의의 대비를 드러냈습니다.
- source_word: ἀτενίσαι καὶ ἰδεῖν
  english_pob_choice: to look up and see
  chosen_korean: 하늘의 높이를 바라보고 볼
  alternatives_korean:
  - 올려다보고 볼
  - 응시하여 볼
  - 우러러 보고 볼
  lexicon: BDAG
  rationale: ἀτενίσαι의 ‘시선을 고정하여 바라보다’는 뉘앙스를 살리기 위해 단순 ‘보다’보다 ‘바라보다’로 옮겼습니다.
theological_decisions:
- issue: 두 개의 죄어휘를 구분해 번역할지 여부
  chosen_reading: ἀνομίαι는 ‘불법 행위’, ἀδικιῶν은 ‘불의한 행위’로 구별했습니다.
  alternative_readings:
  - 둘 다 ‘죄’로 통일
  - 둘 다 ‘불의’로 통일
  rationale: 원문은 유사하지만 다른 도덕 어휘를 병치해 고백의 밀도를 높이므로, 한국어에서도 의미 차이를 보존하는 편이 본문 충실성에 더 부합합니다.
  doctrine_reference: DOCTRINE.md §5 Consistency of key terms, or documented exception
- issue: κύριε의 호칭 톤
  chosen_reading: ‘주님’으로 직접 호명했습니다.
  alternative_readings:
  - ‘주여’
  - ‘오 주님’
  rationale: 합쇼체 서술 속에서 하나님께 직접 말하는 호소를 자연스럽게 유지하면서도, 고어적 예전 문체로 기울지 않도록 했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → Lord'
