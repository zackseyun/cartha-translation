  source_fidelity: 초안은 죄의 헤아릴 수 없는 많음, ἀνομίαι와 ἀδικίαι의 구별, 그리고 불의가 하늘을 바라볼 자격 없음의 원인이라는 핵심 뜻을 대체로 보존합니다. 그러나 ‘바라보고 볼 만한 사람’은 원문의 ‘~할 자격이 없다’를 부정확하고 어색하게 바꾸며, ‘사람’을 불필요하게 보탭니다. ‘응시하여 볼 자격이 없습니다’로 고쳐 두 동사의 결합과 ἄξιος의 뜻을 자연스럽게 반영했습니다.
