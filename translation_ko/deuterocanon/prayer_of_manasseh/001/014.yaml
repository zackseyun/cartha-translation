base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/014.yaml
  text: and in me you will show your kindness[a]; for you will save me, though I am unworthy, according to your abundant mercy[b],
  footnotes:
  - marker: a
    text: Or 'to me' or 'through me'; Greek 'in me.'
    reason: lexical_alternative
  - marker: b
    text: Or 'goodness'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 제 안에서 당신의 친절을[a] 나타내실 것이니, 제가 합당하지 않은 자임에도 당신의 풍성한 자비[b]에 따라 저를 구원하실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저에게’ 혹은 ‘저를 통해’; 헬라어는 ‘제 안에서’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘선하심’.
    reason: previous_rendering
lexical_decisions:
- source_word: ἐν ἐμοί
  english_pob_choice: in me
  chosen_korean: 제 안에서
  alternatives_korean:
  - 저에게
  - 저를 통해
  - 저와 함께
  lexicon: BDAG
  rationale: ἐν ἐμοί는 가장 직접적으로 ‘안에/안에서’라는 뜻이므로, 하나님의 자비가 단지 대상에게 주어지는 것이 아니라 제 안에서 드러난다는 힘을 살려 ‘제 안에서’로 옮겼습니다.
- source_word: χρηστότητά
  english_pob_choice: kindness
  chosen_korean: 친절
  alternatives_korean:
  - 선하심
  - 은혜로움
  - 자비로움
  lexicon: BDAG
  rationale: 영어 POB가 verse 11과의 연계를 따라 kindness를 택하므로, 한국어도 그 연결을 살리기 위해 ‘친절’로 옮겼습니다. 문맥상 하나님의 성품을 가리키는 말이지만, 뒤의 ‘자비’와 구별도 유지합니다.
- source_word: ἀνάξιον ὄντα
  english_pob_choice: though I am unworthy
  chosen_korean: 제가 합당하지 않은 자임에도
  alternatives_korean:
  - 부당한 자임에도
  - 자격 없는 자임에도
  - 제가 합당치 않음에도
  lexicon: BDAG
  rationale: 직역하면 ‘합당하지 않은 상태로’이므로, 기도의 겸손과 대비를 살리면서도 한국어 문장 흐름에 맞게 ‘…임에도’로 풀었습니다.
- source_word: κατὰ τὸ πολὺ ἔλεός σου
  english_pob_choice: according to your abundant mercy
  chosen_korean: 당신의 풍성한 자비에 따라
  alternatives_korean:
  - 당신의 큰 자비에 따라
  - 당신의 넘치는 자비에 따라
  - 당신의 풍부한 긍휼에 따라
  lexicon: BDAG
  rationale: κατά + 대격은 기준/척도를 나타내므로 ‘…에 따라’가 자연스럽습니다. πολὺ ἔλεος의 중량감을 살리기 위해 ‘풍성한 자비’로 옮겼습니다.
theological_decisions:
- issue: ἐν ἐμοί를 약화시켜 ‘저에게/저를 통해’로 풀 것인지, 직접적으로 유지할 것인지
  chosen_reading: 제 안에서
  alternative_readings:
  - 저에게
  - 저를 통해
  - 저와 함께
  rationale: 원문은 ἐν을 사용하므로, 하나님의 선하심이 단지 수혜자에게 주어지는 것이 아니라 회개한 왕의 삶과 처지 안에서 드러난다는 점을 보존하는 것이 좋습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
