base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/006.yaml
  text: and the mercy of your promise is immeasurable and unsearchable;[a]
  footnotes:
  - marker: a
    text: Or 'your promised mercy' or 'the mercy shown in your promise.' The Greek genitive can be understood in more than one closely related way.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 주님의 약속의 자비는 헤아릴 수 없고 찾아낼 수 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님이 약속하신 자비’ 또는 ‘주님의 약속으로 드러난 자비’입니다. 그리스어 속격은 여러 가지로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμέτρητόν
  english_pob_choice: immeasurable
  chosen_korean: 헤아릴 수 없고
  alternatives_korean:
  - 헤아릴 수 없으며
  - 측량할 수 없고
  - 무한하며
  lexicon: LSJ
  rationale: ‘측량할 수 없다’는 수량적으로 재어볼 수 없다는 뜻을 살리고, 문장 흐름상 한국어로는 ‘헤아릴 수 없고’가 가장 자연스럽습니다.
- source_word: ἀνεξιχνίαστον
  english_pob_choice: unsearchable
  chosen_korean: 찾아낼 수 없습니다
  alternatives_korean:
  - 다 찾아낼 수 없습니다
  - 추적할 수 없습니다
  - 헤아릴 수 없습니다
  lexicon: LSJ
  rationale: 이 단어는 끝까지 추적하거나 조사해도 밝혀내지 못한다는 뜻이므로, ‘찾아낼 수 없습니다’가 ‘unsearchable’의 조사·추적 불가능성을 잘 드러냅니다.
- source_word: τὸ ἔλεος
  english_pob_choice: mercy
  chosen_korean: 자비
  alternatives_korean:
  - 긍휼
  - 은혜
  - 자비와 긍휼
  lexicon: LSJ
  rationale: 기도문 문맥에서 ἔλεος는 단순한 제도적 ‘자비’보다 하나님이 베푸시는 구원적 긍휼을 가리키므로, 한국어로는 ‘자비’가 가장 간결하면서도 자연스럽습니다.
- source_word: τῆς ἐπαγγελίας σου
  english_pob_choice: your promise
  chosen_korean: 주님의 약속의
  alternatives_korean:
  - 주님의 약속에 속한
  - 주님의 약속으로 주어지는
  - 주님이 약속하신
  lexicon: LSJ
  rationale: 그리스어 속격은 ‘당신의 약속의 자비’처럼 약속과 자비의 관계를 다의적으로 열어 둡니다. 한국어도 이를 단선적으로 풀지 않고 ‘약속의 자비’로 남겨 구조를 보존했습니다.
- source_word: τε καὶ
  english_pob_choice: and
  chosen_korean: 그리고
  alternatives_korean:
  - 또
  - 그리고 또한
  - 뿐만 아니라
  lexicon: LSJ
  rationale: 두 형용사의 병렬을 자연스럽게 잇되, 과도한 강조를 피하기 위해 단순한 연결어 ‘그리고’를 사용했습니다.
theological_decisions:
- issue: τὸ ἔλεος τῆς ἐπαγγελίας σου의 관계 표현을 한국어에서 얼마나 풀어 쓸 것인지
  chosen_reading: ‘주님의 약속의 자비’로 직역 구조를 유지합니다.
  alternative_readings:
  - ‘주님이 약속하신 자비’
  - ‘주님의 약속으로 나타난 자비’
  - ‘약속하신 자비’
  rationale: 원문은 자비가 약속에 속하는지, 약속 안에서 드러나는지, 약속에 의해 보증되는지를 한 가지로 못박지 않습니다. 한국어에서도 이 긴장을 보존하기 위해 관계를 설명적으로 확정하지 않았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3, 5
