  rationale: The revision makes the Korean expression of ἀνεξιχνίαστον idiomatic and semantically precise by specifying that what cannot be found out is the mercy’s end or extent. It does not alter the open genitive relation between ‘promise’ and ‘mercy’; the footnote continues to identify the main viable readings.
