  to: 그들은 전쟁에 쫓기는 이들처럼 경건한 이들로부터 도망칠 것이나[a], 경건한 이들은 죄인들을 추격하여 따라잡을 것입니다. 또 불법을 행하는 이들은 주님의 심판[b]을 피하지 못하며, 노련한 적들에게 붙잡히듯이 사로잡힐 것입니다.
