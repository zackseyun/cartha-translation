  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: lxx-swete-1909
  text: φεύξονται γὰρ ὡς διωκόμενοι πολέμου ἀπὸ ὁσίων, καταδιώξονται δὲ ἁμαρτωλοὺς καὶ καταλήψονται· καὶ οὐκ ἐκφεύξονται οἱ ποιοῦντες ἀνομίαν τὸ κρίμα Κυρίου, ὡς ὑπὸ πολεμίων ἐμπείρων καταλημφθήσονται.
  language: Greek
  pages:
  - 804
  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/015/009.yaml
  text: For they will flee from the holy ones as those pursued by war[a], but they will pursue sinners and overtake them; and those who practice lawlessness will not escape the Lord’s judgment[c][b]; they will be captured like those seized by experienced enemies.
  footnotes:
  - marker: a
    text: Or 'from the godly' for 'from the holy ones.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'as those pursued by war' is compressed Greek and may also be understood more dynamically as 'like people driven off by war.'
    reason: alternative_reading
  - marker: c
    text: Or 'from the holy ones'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 전쟁에 쫓기는 사람들처럼 경건한 이들로부터 도망칠 것이나[a], 죄인들을 추격하여 따라잡을 것입니다. 또 불법을 행하는 이들은 주님의 심판[b]을 피하지 못하며, 숙련된 적들에게 붙잡히는 사람들처럼 사로잡힐 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경건한 이들로부터’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주님의 판결’.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ ὁσίων
  english_pob_choice: from the holy ones
  chosen_korean: 경건한 이들로부터
  alternatives_korean:
  - 거룩한 이들로부터
  - 성도들로부터
  lexicon: BDAG
  rationale: Psalms of Solomon에서는 ὅσιοι를 일반적인 ἅγιοι보다 사회적으로 더 특정된 ‘경건한 이들’로 옮기는 편이 한국어 독자에게도 자연스럽고, 본문 대비가 선명해집니다.
- source_word: ὡς διωκόμενοι πολέμου
  english_pob_choice: as those pursued by war
  chosen_korean: 전쟁에 쫓기는 사람들처럼
  alternatives_korean:
  - 전쟁에 추격당하는 사람들처럼
  - 전쟁으로 몰려 도망하는 사람들처럼
  lexicon: BDAG
  rationale: 압축된 비유를 너무 풀지 않고, 전쟁의 압박 아래 쫓겨나는 이미지를 자연스러운 한국어로 살렸습니다.
- source_word: τὸ κρίμα Κυρίου
  english_pob_choice: the Lord’s judgment
  chosen_korean: 주님의 심판
  alternatives_korean:
  - 주님의 판결
  - 주의 심판
  lexicon: BDAG
  rationale: κρίμα는 단순한 ‘벌’보다 공식적 심판/판결의 뉘앙스를 가지며, κύριος는 이 문맥에서 ‘주님’이 가장 자연스럽습니다.
- source_word: καταλήψονται
  english_pob_choice: overtake
  chosen_korean: 따라잡을 것입니다
  alternatives_korean:
  - 붙잡을 것입니다
  - 포위할 것입니다
  lexicon: BDAG
  rationale: 앞의 ‘추격하다’와 호응하도록, 결과 도달의 의미를 드러내는 ‘따라잡다’로 옮겼습니다.
theological_decisions:
- issue: ἀνομία를 한국어에서 어떻게 윤리적·법적 뉘앙스로 살릴지
  chosen_reading: ‘불법을 행하는 이들’로 번역했습니다.
  alternative_readings:
  - ‘악을 행하는 이들’
  - ‘법 없이 사는 자들’
  rationale: ἀνομία는 단순한 도덕적 악행보다 율법/질서에 대한 위반을 강조하므로, 프로젝트 기본어인 ‘불법’을 유지해 본문의 신학적 대조를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md contested terms: νόμος/ἀνομία'
- issue: κύριος를 야훼로 옮길지 여부
  chosen_reading: 이 절의 κύριος는 ‘주님’으로 두었습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 본문은 יהוה 인용 표지가 아니라 Κυρίου 일반 표현이므로, NT/구약 인용 규칙을 적용하지 않고 자연스러운 존칭인 ‘주님’을 사용했습니다.
  doctrine_reference: 'DOCTRINE.md contested terms: κύριος'
