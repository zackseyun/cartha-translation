review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the principal Greek terms, including ὁσίων as “경건한 이들,” ἀνομία as “불법,” and τὸ κρίμα Κυρίου as “주님의 심판.” However, the unmarked subject of καταδιώξονται is liable in Korean to be read as the initial “그들” (the sinners/lawless), whereas the contrast and context require the pious ones to pursue the sinners. The revision makes that subject explicit without adding interpretation beyond the Greek’s clear antithesis.
  naturalness: The Korean is generally fluent and appropriately formal-polite. Explicitly introducing “경건한 이들은” at the second clause prevents a misleading Korean anaphoric reading. “노련한 적들에게 붙잡히듯이” is a natural, compact way to retain the final military simile.
  terminology: “경건한 이들,” “죄인들,” “불법을 행하는 이들,” “주님의 심판,” and “노련한 적들” are suitable modern formal Korean renderings. The existing note a is not a genuine alternative because it repeats the text exactly; it should instead explain the compressed war image.
  issues:
  - severity: medium
    issue: The subject of “죄인들을 추격하여 따라잡을 것입니다” is not explicit.
    rationale: After “그들은 … 도망칠 것이나,” Korean most naturally maintains “그들” as subject. In the Greek contrast, those fleeing are sinners/lawless persons, while the pious ones are the pursuers. The subject must be made explicit to avoid reversing the action.
  - severity: low
    issue: Footnote a duplicates the main-text rendering rather than supplying an alternative or clarification.
    rationale: The note says “또는 ‘경건한 이들로부터’,” which is identical to the anchored wording. Replacing it with a note on the compressed phrase ὡς διωκόμενοι πολέμου makes the anchor meaningful.
  revised_text: 그들은 전쟁에 쫓기는 이들처럼 경건한 이들로부터 도망칠 것이나[a], 경건한 이들은 죄인들을 추격하여 따라잡을 것입니다. 또 불법을 행하는 이들은 주님의 심판[b]을 피하지 못하며, 노련한 적들에게 붙잡히듯이 사로잡힐 것입니다.
