lexical_decisions:
- source_word: τίς
  english_pob_choice: who
  chosen_korean: 누가
  alternatives_korean:
  - 어느 사람이
  - 어떤 이가
  lexicon: BDAG
  rationale: 수사적 질문을 자연스럽게 살리기 위해 가장 직접적인 의문 대명사인 ‘누가’를 사용했습니다.
- source_word: ἰσχύει
  english_pob_choice: is strong
  chosen_korean: 감사드릴 수 있습니까
  alternatives_korean:
  - 힘이 있습니까
  - 강합니까
  - 능히 할 수 있습니까
  lexicon: BDAG
  rationale: 문맥상 ἰσχύει는 단순한 상태 묘사보다 뒤따르는 부정사 절을 수행할 수 있는 능력을 가리키므로, 한국어에서는 전체 구조를 풀어 ‘감사드릴 수 있습니까’로 옮겨 의미를 드러냈습니다.
- source_word: ἐξομολογήσασθαί
  english_pob_choice: to give thanks
  chosen_korean: 감사드릴
  alternatives_korean:
  - 고백할
  - 인정할
  - 찬양할
  lexicon: BDAG
  rationale: PsSol의 평행 구조와 감사-찬양의 어휘 범위를 고려하면, 여기서는 죄 고백보다 하나님께 드리는 감사/찬양의 뜻이 우세하므로 ‘감사드리다’가 가장 적절합니다.
- source_word: ἐν ἀληθείᾳ
  english_pob_choice: in truth
  chosen_korean: 진리로
  alternatives_korean:
  - 진실로
  - 참되게
  - 진리 안에서
  lexicon: BDAG
  rationale: 부사적으로 기능하는 표현을 한국어에서도 짧고 엄정하게 살리기 위해 ‘진리로’를 택했습니다. 이는 단순한 형식적 진실성이 아니라 하나님 앞에서의 참됨을 강조합니다.
theological_decisions:
