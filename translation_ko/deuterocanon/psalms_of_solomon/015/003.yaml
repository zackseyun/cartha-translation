  chosen_reading: ‘하나님이여’로 직접 부르며, 문장 전체는 수사적 질문으로 유지했습니다.
  alternative_readings:
  - 하나님
  - 오 하나님
  rationale: 본문은 하나님께 직접 말을 거는 호격이므로, 한국어 기도·탄원 문맥에 맞는 직접 호칭을 사용해야 합니다. 동시에 과도하게 전통적 어투로 굳히지 않기 위해 합쇼체를 유지했습니다.
  doctrine_reference: 기도/찬양의 호격 사용과 시적 수사 유지
