  source_fidelity: 개정이 필요합니다. 초안의 ‘오직’은 εἰ μὴ(‘~하지 않으면/…이 아니면’)가 이루는 예외·조건 관계를 ‘오직 주께’라는 배타적 수식으로 바꾸어 버립니다. 또한 ἰσχύει의 ‘힘이 있다/강하다’라는 술어가 한국어 문장에 명시되지 않았습니다. ‘주께 진실하게 감사드릴 힘이 있는 이가 아니면 누가 강하겠습니까?’는 수사 의문문과 부정사에 연결된 능력의 의미를 보존합니다.
  naturalness: ‘하나님이여’라는 직접 호칭과 합쇼체 수사 의문문은 현대 표준 한국어의 경건한 문체에 자연스럽습니다. ἐν ἀληθείᾳ는 이 문맥에서 ‘진리로’보다 ‘진실하게’가 자연스럽고, 참됨/진실함이라는 의미 범위를 잘 전달합니다.
