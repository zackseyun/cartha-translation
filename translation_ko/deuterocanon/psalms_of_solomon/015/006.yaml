  - severity: medium
    issue: φλογὸς πυρός의 ‘불’ 요소가 본문에서 생략됨
    rationale: ‘불꽃’만으로는 πυρός를 명시적으로 반영하지 못합니다. ‘불의 불꽃’은 원문의 강조적 속격 표현을 보존합니다.
