base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/015/006.yaml
  text: The one who does these things will never be shaken by evil[d][c][b][a]; a flame of fire and the wrath of the unrighteous will not touch him.
  footnotes:
  - marker: a
    text: Or “will not be moved from evil” or “will not be shaken by harm.”
    reason: lexical_alternative
  - marker: b
    text: “Flame of fire” is a vivid Greek expression; alternatively, “fiery flame.”
    reason: lexical_alternative
  - marker: c
    text: Or “the anger of unjust men.”
    reason: lexical_alternative
  - marker: d
    text: Or 'by evil; flame of fire and the wrath of the unrighteous will not touch him.'.
    reason: previous_rendering
translation:
  language: ko
  text: 이것들을 행하는 사람은 결코 악으로 인해 흔들리지 않을 것입니다. 불꽃과 불의한 자들의 분노가 그를 건드리지 못할 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악에서 흔들리지 않을 것입니다’ 또는 ‘해로 인해 흔들리지 않을 것입니다’.
    reason: lexical_alternative
  - marker: b
    text: ‘불꽃’은 생생한 그리스어 표현입니다. 또는 ‘불의 불꽃’이라고 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘불의한 자들의 분노’입니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘악으로 인해; 불꽃과 불의한 자들의 분노가 그를 건드리지 못할 것입니다.’
    reason: previous_rendering
lexical_decisions:
- source_word: ὁ ποιῶν ταῦτα
  english_pob_choice: The one who does these things
  chosen_korean: 이것들을 행하는 사람
  alternatives_korean:
  - 이것들을 행하는 이
  - 이것들을 하는 자
  lexicon: BDAG
  rationale: 분사구를 한국어의 자연스러운 일반 주어로 옮기되, ‘이것들’이 문맥의 행위를 가리킨다는 점을 유지했습니다.
- source_word: οὐ σαλευθήσεται εἰς τὸν αἰῶνα
  english_pob_choice: will never be shaken
  chosen_korean: 결코 … 흔들리지 않을 것입니다
  alternatives_korean:
  - 영원히 흔들리지 않을 것입니다
  - 움직이지 않을 것입니다
  lexicon: BDAG
  rationale: σαλεύω의 ‘흔들리다/동요되다’ 의미를 살리고, εἰς τὸν αἰῶνα의 지속 부정을 ‘결코’로 자연스럽게 반영했습니다.
- source_word: ἀπὸ κακοῦ
  english_pob_choice: by evil
  chosen_korean: 악으로 인해
  alternatives_korean:
  - 악으로부터
  - 악 때문에
  lexicon: BDAG
  rationale: 문맥상 흔들림의 원인 또는 매개를 나타내므로, ‘악으로 인해’가 원문과 영어 주해 모두를 무리 없이 반영합니다.
- source_word: φλογὸς πυρὸς
  english_pob_choice: a flame of fire
  chosen_korean: 불꽃
  alternatives_korean:
  - 불의 불꽃
  - 불꽃과 불
  lexicon: BDAG
  rationale: 그리스어의 격구조가 강한 비유적 표현이므로, 한국어에서는 반복을 줄이면서도 강도를 살리는 ‘불꽃’으로 옮겼습니다.
- source_word: ὀργὴ ἀδίκων
  english_pob_choice: the wrath of the unrighteous
  chosen_korean: 불의한 자들의 분노
  alternatives_korean:
  - 불의한 자들의 진노
  - 의롭지 못한 자들의 분노
  lexicon: BDAG
  rationale: ἀδίκων을 ‘불의한 자들’로 직역하여 도덕적 대조를 분명히 했고, ὀργή는 ‘분노’로 옮겨 본문의 격렬한 감정을 유지했습니다.
- source_word: οὐχ ἅψεται αὐτοῦ
  english_pob_choice: will not touch him
  chosen_korean: 그를 건드리지 못할 것입니다
  alternatives_korean:
  - 그에게 닿지 못할 것입니다
  - 그를 만지지 못할 것입니다
  lexicon: BDAG
  rationale: ἅπτομαι의 직접적 접촉 의미를 살리면서도, 한국어에서 위협이 미치지 못함을 자연스럽게 나타내는 표현으로 옮겼습니다.
theological_decisions:
- issue: ἀπὸ κακοῦ의 관계를 ‘evil’의 직접적 원인으로 볼지, 더 일반적인 ‘harm’으로 완화할지
  chosen_reading: 악으로 인해
  alternative_readings:
  - 악으로부터
  - 해로 인해
  rationale: 뒤이어 불꽃과 분노라는 파괴적 심판 이미지가 이어지므로, 윤리적·파괴적 실재를 약화시키지 않는 ‘악’의 번역을 유지했습니다.
  doctrine_reference: 악과 심판의 보호 약속을 직접적으로 드러내는 시편적 경고 문맥
- issue: ὀργὴ ἀδίκων을 ‘불의한 자들의 분노’로 둘지, ‘불의한 자들에 대한 분노’로 볼지
  chosen_reading: 불의한 자들의 분노
  alternative_readings:
  - 불의한 자들에 대한 분노
  - 불의한 자들의 진노
  rationale: 문맥과 영어 주해의 최종 조정은 ἀδίκων을 소유/귀속의 격으로 읽으며, 심판의 주체가 아닌 ‘불의한 자들’에게 속한 분노라는 그림을 유지합니다.
  doctrine_reference: 최종 심판과 악인의 위협이 의인에게 미치지 못한다는 보호 약속
