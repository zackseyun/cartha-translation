revisions:
- from: 이것들을 행하는 사람은 결코 악으로 인해 흔들리지 않을 것입니다. 불꽃과 불의한 자들의 분노가 그를 건드리지 못할 것입니다.[a][b][c][d]
  to: 이것들을 행하는 사람은 악[a]과 불의 불꽃[b] 때문에 결코 흔들리지 않을 것이며[d], 불의한 자들에 대한 진노[c]는 그에게 닿지 않을 것입니다.
  rationale: 원문에서 ἀπὸ는 κακοῦ와 φλογὸς πυρός를 함께 지배하므로 이를 ‘악과 불의 불꽃 때문에’로 묶었습니다. 이어지는 ὀργὴ ἀδίκων은 οὐχ ἅψεται의 주어로 번역했습니다. ἀδίκων의 해석은 형식상 논의 가능성을 각주에 보존하되, 직후 문맥이 지지하는 목적격 해석을 본문에 채택했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:10:06Z'
