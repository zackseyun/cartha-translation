translation:
  language: ko
  text: 죄인들의 몫은 멸망과 어둠이며, 그들의 불법은 그들을 지옥[a]까지 뒤쫓을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
