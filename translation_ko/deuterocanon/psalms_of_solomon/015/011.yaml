review_pass:
  verdict: revise
  source_fidelity: ‘지옥’은 ᾅδης(하데스)를 게헨나적 ‘지옥’과 혼동하게 할 수 있어 원어의 지시 대상을 좁혀 버립니다. 또한 본문의 κάτω(‘아래/저 아래’)가 현 번역에서는 드러나지 않습니다. κληρονομία는 문맥상 ‘몫’도 가능하지만, 구체적인 ‘상속/유업’의 표현을 보존하는 편이 더 충실합니다.
  naturalness: ‘죄인들의 유업’과 ‘그들의 불법이 그들을 … 뒤쫓을 것입니다’는 현대 한국어의 격식 있는 성서 문체에서 자연스럽습니다. ‘아래 하데스’는 다소 문어적이지만 원문의 위치 수식을 간결하게 보존합니다.
  terminology: ᾅδης는 ‘하데스’로 옮겨 ‘지옥’과 구별합니다. ἀνομία는 율법·질서에 대한 위반이라는 뜻을 살려 ‘불법’으로 유지할 수 있습니다.
  issues:
  - severity: high
    issue: ᾅδης를 ‘지옥’으로 번역함
    rationale: 그리스어 ᾅδης는 하데스/죽은 자들의 영역을 가리키며, 게헨나와 동일시되는 ‘지옥’으로 번역하면 원문의 용어와 개념적 구별을 흐릴 수 있습니다.
  - severity: medium
    issue: κάτω(아래, 저 아래)의 의미가 누락됨
    rationale: ‘지옥까지’는 목적지와 ‘까지’는 나타내지만, 하데스가 아래에 있다는 위치적 강조를 반영하지 않습니다.
  - severity: low
    issue: κληρονομία의 상속 언어가 ‘몫’에서 약화됨
    rationale: ‘몫’은 문맥상 가능하나, κληρονομία가 지닌 유업·상속의 구체적 표현을 ‘유업’이 더 직접적으로 보존합니다.
  revised_text: 죄인들의 유업은 멸망과 어둠이며, 그들의 불법이 그들을 아래 하데스까지 뒤쫓을 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 “저 아래 하데스까지.”
    reason: ‘아래’는 그리스어 κάτω를 반영하며, 어순은 문맥에 따라 달리 옮길 수 있습니다.
  revision_rationale: ᾅδης를 음역한 ‘하데스’로 바로잡아 ‘지옥’이라는 해석적 등치를 피하고, κάτω의 위치적 강조를 ‘아래’로 반영했습니다. ‘유업’은 κληρονομία의 상속 이미지를 보존합니다. 각주 표지는 본문에서 ‘하데스[a]’ 뒤에 붙여야 합니다.
