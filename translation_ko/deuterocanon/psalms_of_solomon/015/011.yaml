    reason: lexical_alternative
lexical_decisions:
- source_word: κληρονομία
  english_pob_choice: inheritance
  chosen_korean: 몫
  alternatives_korean:
  - 유업
  - 상속
  - 유산
  lexicon: BDAG
  rationale: 여기서는 ‘죄인들이 결국 받게 되는 배당/분깃’이라는 대비가 핵심이므로, 소유 상속의 뉘앙스를 살리되 문맥상 자연스러운 ‘몫’으로 옮겼습니다.
- source_word: ἁμαρτωλῶν
  english_pob_choice: sinners
  chosen_korean: 죄인들의
  alternatives_korean:
  - 죄 많은 자들의
  - 죄악한 자들의
  lexicon: BDAG
  rationale: 서술적 확장 없이 명사적 복수의 직접 대응인 ‘죄인들’로 옮겼습니다.
- source_word: ἀπώλεια καὶ σκότος
  english_pob_choice: destruction and darkness
  chosen_korean: 멸망과 어둠
  alternatives_korean:
  - 파멸과 어둠
  - 파괴와 어둠
  lexicon: BDAG
  rationale: ‘멸망’은 ἀπώλεια의 종결적 파멸을 자연스럽게 드러내고, ‘어둠’은 도덕적·종말론적 이미지를 그대로 보존합니다.
- source_word: ἀνομία
  english_pob_choice: lawlessness
  chosen_korean: 불법
  alternatives_korean:
  - 무법
  - 율법 없음
  - 불의
  lexicon: BDAG
  rationale: ‘lawlessness’의 직역적 대응으로 ‘불법’을 택해, 단순한 악행 일반이 아니라 율법/질서에 대한 위반성을 살렸습니다.
- source_word: ἕως ᾅδου κάτω
  english_pob_choice: down to Hades
  chosen_korean: 지옥까지
  alternatives_korean:
  - 하데스까지
  - 음부까지
  - 아래 하데스까지
  lexicon: BDAG
  rationale: POB의 최종 영어판이 ‘Hades’ 대신 ‘down to Hades’로 정리된 점을 반영하되, 한국어에서는 독자에게 즉시 전달되는 하강·종착 이미지를 위해 ‘지옥까지’로 옮겼습니다.
theological_decisions:
- issue: ᾅδης를 한국어로 어떻게 처리할지
  chosen_reading: ‘지옥’으로 번역해 음부/사망의 처소를 가리키는 종말론적 형상을 전달했습니다.
  alternative_readings:
  - 하데스
  - 음부
  - 죽은 자들의 세계
  rationale: 이 시편에서는 죄인들의 최종 귀결을 경고하는 이미지가 강조되므로, 독자 이해를 위해 관용적 종말 표현을 사용했습니다. 다만 ‘지옥’이 신약의 게헨나와 완전히 동일하다는 뜻은 아닙니다.
  doctrine_reference: 종말론적 지리어/사후 세계 용례의 번역 관행
