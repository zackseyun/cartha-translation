base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/015/013.yaml
  text: For sins will lay waste the houses of sinners[b][a], and sinners will perish on the day of the Lord’s judgment forever.
  footnotes:
  - marker: a
    text: Or 'will devastate' or 'will make desolate.'
    reason: lexical_alternative
  - marker: b
    text: Lit. 'for the age'; here rendered 'forever.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 죄인들의 집을 황폐하게 할 것입니다. 죄인들은 주님의 심판의 날에 영원히 멸망할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘황폐하게 할 것입니다’는 원문의 ἐξερημώσουσιν이 가진 ‘황무하게 하다/황폐시키다’의 폭넓은 의미를 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘영원히’는 εἰς τὸν αἰῶνα를 자연스러운 현대 한국어로 옮긴 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτίαι
  english_pob_choice: sins
  chosen_korean: 죄
  alternatives_korean:
  - 죄들
  - 악행
  lexicon: BDAG
  rationale: 복수형이지만 문맥상 구체적 죄책과 그 결과를 가리키므로, 한국어에서는 자연스럽게 ‘죄’로 옮기되 문장 전체에서 집합적 의미를 살렸습니다.
- source_word: ἐξερημώσουσιν
  english_pob_choice: will lay waste
  chosen_korean: 황폐하게 할 것입니다
  alternatives_korean:
  - 황폐시킬 것입니다
  - 황무하게 할 것입니다
  - 초토화할 것입니다
  lexicon: LSJ
  rationale: ‘황폐하게 하다’는 파괴와 폐허화의 뜻을 분명히 하면서도 과도하게 현대적·구어적인 표현으로 치우치지 않습니다.
- source_word: οἴκους
  english_pob_choice: houses
  chosen_korean: 집
  alternatives_korean:
  - 가옥
  - 가정
  lexicon: LSJ
  rationale: 기본 뜻은 ‘집’이며, 본문에는 ‘가정’으로 확장할 근거가 없으므로 직접적으로 옮겼습니다.
- source_word: εἰς τὸν αἰῶνα
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 영원토록
  - 세세토록
  - 끝없이
  lexicon: BDAG
  rationale: 문장 끝에 놓인 부사구가 ‘멸망하다’를 수식하므로, ‘영원히’로 옮겨 멸망의 지속성을 분명히 했습니다.
theological_decisions:
- issue: ‘주님의 심판의 날’의 주체 표현
  chosen_reading: 본문의 Κυρίου를 ‘주님의’로 옮겨, 심판의 날이 주님께 속한 날임을 직접 드러냈습니다.
  alternative_readings:
  - ‘주 하나님의 심판의 날’
  - ‘주의 심판 날’
  rationale: 그리스어 속격은 심판의 날이 주님과 관련된 날임을 나타내므로, 한국어에서도 관계를 분명히 하되 불필요한 확장 없이 유지했습니다.
  doctrine_reference: 종말론적 심판 표현
