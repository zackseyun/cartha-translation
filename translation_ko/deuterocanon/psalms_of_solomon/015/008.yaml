base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/015/008.yaml
  text: For the sign of God is upon the righteous for salvation[e][d][c][b][a]; famine and sword and death are far from the righteous.
  footnotes:
  - marker: a
    text: Or "mark of God."
    reason: lexical_alternative
  - marker: b
    text: Or "the just."
    reason: lexical_alternative
  - marker: c
    text: θανάτος can sometimes carry the sense of pestilence in judgment lists, but here it is rendered more broadly as "death."
    reason: alternative_reading
  - marker: d
    text: Or 'sign'.
    reason: previous_rendering
  - marker: e
    text: Or 'death'.
    reason: previous_rendering
translation:
  language: ko
  text: 이는 하나님의 표가 의인들 위에 있어 구원에 이르게 하기 때문입니다. 기근과 칼과 죽음은 의인들에게서 멉니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '`σημεῖον`은 여기서 하나님의 보호를 나타내는 표지로 이해할 수 있으며, 문자적으로는 ‘표’나 ‘징표’의 뜻입니다.'
    reason: lexical_alternative
  - marker: b
    text: '`δικαίους`는 ‘의인들’로도, 더 직역하면 ‘의로운 이들’로도 옮길 수 있습니다.'
    reason: lexical_alternative
  - marker: c
    text: '`θάνατος`는 일부 심판 목록에서 ‘역병’의 뉘앙스를 띨 수 있지만, 이 절에서는 일반적인 ‘죽음’으로 번역했습니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: σημεῖον
  english_pob_choice: sign
  chosen_korean: 표
  alternatives_korean:
  - 징표
  - 표징
  - 표시
  lexicon: BDAG
  rationale: 의인들 위에 놓인 하나님의 `σημεῖον`을 눈에 보이거나 알아볼 수 있는 보호의 표지로 살리면서도, 문맥상 단순한 물리적 ‘표식’으로 좁히지 않기 위해 `표`를 택했습니다.
- source_word: δικαίους
  english_pob_choice: the righteous
  chosen_korean: 의인들
  alternatives_korean:
  - 의로운 사람들
  - 의로운 이들
  - 의인
  lexicon: BDAG
  rationale: 집합적 의미를 자연스럽게 살리기 위해 `의인들`로 옮겼습니다. 문맥상 특정 개인이 아니라 의인의 범주를 가리킵니다.
- source_word: εἰς σωτηρίαν
  english_pob_choice: for salvation
  chosen_korean: 구원에 이르게 하기 위해
  alternatives_korean:
  - 구원을 위해
  - 구원으로
  - 구원에 이르도록
  lexicon: BDAG
  rationale: '`εἰς`의 목적·도달 방향을 드러내면서, 한국어로는 결과 지향성을 자연스럽게 보여 주기 위해 `구원에 이르게 하기 위해`로 풀어 옮겼습니다.'
- source_word: θάνατος
  english_pob_choice: death
  chosen_korean: 죽음
  alternatives_korean:
  - 사망
  - 재앙
  - 죽임
  lexicon: BDAG
  rationale: 이 절의 그리스어 자체는 일반 명사 `죽음`이며, 본문에 따라 ‘역병’으로 좁히기보다 현재 본문의 직설적 의미를 유지하는 편이 더 적절합니다.
theological_decisions:
- issue: 악이 의인에게서 멀리한다는 보호 선언의 표현
  chosen_reading: 하나님의 표가 의인들 위에 있어, 기근과 칼과 죽음이 의인들에게서 멀다는 보호와 구원의 선언으로 읽었습니다.
  alternative_readings:
  - 단순한 운명적 보호 묘사
  - 징표를 통한 공동체적 구별 선언
  rationale: 문맥상 목록형 재앙들(기근, 칼, 죽음)과 대조되는 하나님의 표는 의인에 대한 보호를 강조합니다. 이를 약화하지 않고 직설적으로 드러냈습니다.
  doctrine_reference: 시편 솔로몬 15:8의 문맥상 보호/구원 모티프
- issue: θάνατος의 범위
  chosen_reading: θάνατος는 여기서 ‘죽음’으로 옮겼습니다.
  alternative_readings:
  - 역병
  - 전염병
  rationale: 공적 청원문이나 심판 목록에서 ‘죽음’이 역병을 포괄적으로 암시할 수 있지만, 이 절 자체에는 더 좁은 의미를 강제할 충분한 단서가 없으므로 본문 표면 의미를 유지했습니다.
  doctrine_reference: 헬라어 어휘의 문맥 우선 원칙
