translation:
  language: ko
  text: 그것이 주님의 얼굴 앞에서 죄인들을 향해 나아갈 때, 죄인들의 모든 소유를 멸망시키려는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘소유’는 여기서 재산, 소지품, 또는 삶을 떠받치는 기반까지 아우를 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  english_pob_choice: when
  chosen_korean: ~할 때
  alternatives_korean:
  - ~할 때마다
  - ~하면
  lexicon: BDAG
  rationale: 조건적·시간적 종속절로서 자연스러운 한국어 표현인 ‘~할 때’로 옮겨, 반복성을 과하게 넣지 않으면서도 사건의 시점을 분명히 했습니다.
- source_word: ἐξέλθῃ
  english_pob_choice: it goes out
  chosen_korean: 나아갈 때
  alternatives_korean:
  - 나갈 때
  - 나오게 될 때
  lexicon: BDAG
  rationale: 주어가 앞 문맥에서 암시되는 형태이므로, 한국어에서도 특정 주어를 보충하지 않고 중립적인 ‘나아가다’로 처리했습니다.
- source_word: ἀπὸ προσώπου Κυρίου
  english_pob_choice: from the presence of the Lord
  chosen_korean: 주님의 얼굴 앞에서
  alternatives_korean:
  - 주님의 임재로부터
  - 주님의 얼굴에서
  lexicon: LSJ
  rationale: 직역의 이미지를 살리면서도 한국어에서 자연스러운 관용으로 ‘얼굴 앞에서’를 택해, 출발점이 되는 하나님의 임재를 드러냈습니다.
- source_word: πᾶσαν ὑπόστασιν ἁμαρτωλῶν
  english_pob_choice: every possession of sinners
  chosen_korean: 죄인들의 모든 소유
  alternatives_korean:
  - 죄인들의 모든 재산
  - 죄인들의 모든 실체
  - 죄인들의 모든 기반
  lexicon: LSJ
  rationale: ὑπόστασις의 범위가 ‘소유/재산’ 쪽으로 읽히는 영어 최종 판단을 따라, 한국어에서는 가장 자연스럽고 문맥에 맞는 ‘소유’로 옮겼습니다.
theological_decisions:
- issue: 멸망 행위의 주체가 암시적으로 남아 있는 문제
  chosen_reading: 문장 구조를 유지해 ‘그것이 … 멸망시키려는 것입니다’로 처리했습니다.
  alternative_readings:
  - 그가 … 멸망시키려는 것입니다
  - 그것이 … 멸절하려는 것입니다
  rationale: 원문은 명시적 주어 없이 선행 문맥에 의존하므로, 한국어에서도 임의의 주어를 덧붙이지 않고 암시를 보존하는 편이 더 충실합니다.
  doctrine_reference: 문맥 의존 대명사/생략 주어 처리
- issue: κύριος의 번역
  chosen_reading: 주님
  alternative_readings:
  - 하나님
  - 주
  rationale: 본문의 ‘Κυρίου’는 하나님을 가리키는 존칭으로 읽히며, 한국어 합쇼체 문맥에서는 ‘주님’이 가장 자연스럽고 경건한 표현입니다.
  doctrine_reference: κύριος 번역 기본 원칙
