lexical_decisions:
- source_word: Ἐν τῷ θλίβεσθαί με
  english_pob_choice: When I was in distress
  chosen_korean: 제가 환난 중에
  alternatives_korean:
  - 제가 고난 중에
  - 제가 압박을 받을 때
  lexicon: BDAG
  rationale: ἐν + 예정사 구조의 시간적 용법을 살려 ‘~중에’로 옮기고, θλίβεσθαί의 압박·고통 의미는 성경적 문맥에 맞는 ‘환난’으로 자연스럽게 반영했습니다.
- source_word: ἐπεκαλεσάμην τὸ ὄνομα Κυρίου
  english_pob_choice: I called on the name of the Lord
  chosen_korean: 주님의 이름을 불렀으며
  alternatives_korean:
  - 주님의 이름을 불렀고
  - 주님의 이름을 호출하였으며
  lexicon: BDAG
  rationale: ‘name of the Lord’를 하나님 자신을 부르는 관용구로 보고, 현대 한국어에서 가장 자연스러운 신앙 표현인 ‘이름을 부르다’로 옮겼습니다.
- source_word: εἰς βοήθειαν ἤλπισα τοῦ θεοῦ Ἰακώβ
  english_pob_choice: I hoped for help from the God of Jacob
  chosen_korean: 야곱의 하나님께 도움을 바라였고
  alternatives_korean:
  - 야곱의 하나님께 도움을 희망하였고
  - 야곱의 하나님께 도움을 기대하였고
  lexicon: BDAG
  rationale: ἐλπίζω εἰς + 대격의 ‘희망을 두다/바라다’ 구조를 살려, βοήθεια를 목적어로 두기보다 ‘도움을 바라다’로 자연스럽게 재현했습니다.
- source_word: ἐσώθην
  english_pob_choice: I was saved
  chosen_korean: 구원을 받았습니다
  alternatives_korean:
  - 구원받았습니다
  - 구출되었습니다
  lexicon: BDAG
  rationale: σῴζω는 이 문맥에서 구출과 구원의 겹침이 있으나, 시편적 감사의 종결로서 ‘구원을 받다’가 가장 직설적이고 과도한 신학적 협소화를 피합니다.
theological_decisions:
- issue: ‘주님’과 ‘하나님’의 호칭 구분
  chosen_reading: κύριος는 ‘주님’으로, θεός는 ‘하나님’으로 일관되게 구분했습니다.
  alternative_readings:
  - 둘 다 ‘주’로 통일
  - 둘 다 ‘하나님’으로 완화
  rationale: 원문이 지닌 호칭 차이를 유지해야 독자가 ‘주의 이름’과 ‘야곱의 하나님’을 구별해 읽을 수 있습니다.
  doctrine_reference: 시편적 기도 언어와 구약의 신명 사용
