  rationale: ἐν + dative를 한국어의 수단/동반 표현으로 자연스럽게 풀면서, κρίμα의 사법적·판결적 성격을 ‘심판’으로 보존했습니다.
theological_decisions:
- issue: 하나님의 ‘방문’과 ‘심판’의 결합
  chosen_reading: ‘방문하실 때’와 ‘자기의 심판으로’를 함께 살려, 구원적 돌봄보다 재판적 개입이 강조되는 문맥을 유지했습니다.
  alternative_readings:
  - ‘찾아오실 때’로 완화
  - ‘임하실 때’로 종말론적으로 확대
  rationale: 본문은 단순한 돌봄의 방문이 아니라 심판 행위와 결합된 방문이므로, 두 요소를 분리하지 않고 함께 드러내는 번역이 필요합니다.
  doctrine_reference: 하나님의 공의로운 심판
