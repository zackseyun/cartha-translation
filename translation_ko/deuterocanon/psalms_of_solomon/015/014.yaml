  lexicon: LSJ
  rationale: 여기서는 특정 지역을 가리키는 지정보다 넓은 피조 세계 전체보다도, ‘땅’이 ελλην어 γῆ의 기본 의미를 간결하게 반영합니다.
- source_word: ἐν κρίματι αὐτοῦ
  english_pob_choice: with his judgment
