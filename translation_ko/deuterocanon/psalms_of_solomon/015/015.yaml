id: PSS.15.15
reference: Psalms of Solomon 15:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: lxx-swete-1909
  text: οἱ δὲ φοβούμενοι τὸν κύριον ἐλεηθήσονται ἐν αὐτῇ, καὶ ζήσονται ἐν τῇ ἐλεημοσύνῃ τοῦ θεοῦ αὐτῶν καὶ ἁμαρτωλοὶ ἀπολοῦνται εἰς τὸν αἰῶνα χρόνον.
  language: Greek
  pages:
  - 805
  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/015/015.yaml
  text: But those who fear the Lord will be shown mercy in it[a], and they will live by the mercy of their God, but sinners will perish forever.
  footnotes:
  - marker: a
    text: 'Greek: ''in it''; likely referring to the day of the Lord''s judgment just mentioned, though it may also echo the land/earth of the previous line.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 주를 두려워하는 이들은 그 가운데서[a] 자비를 받을 것이며, 그들의 하나님의 자비로 살아갈 것입니다. 그러나 죄인들은 영원히 멸망할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘그 안에서’입니다. 직전 문맥상 주의 심판의 날을 가리키는 것으로 볼 수 있지만, 앞 절의 ‘땅/지면’을 가리킬 가능성도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: φοβούμενοι
  english_pob_choice: those who fear
  chosen_korean: 주를 두려워하는 이들
  alternatives_korean:
  - 주를 경외하는 이들
  - 주님을 두려워하는 이들
  lexicon: BDAG
  rationale: 공동체적·신앙적 두려움을 드러내는 분사 용법을 살려 ‘두려워하는 이들’로 옮기되, 대상은 문맥에 맞게 ‘주’로 분명히 했습니다.
- source_word: ἐλεηθήσονται
  english_pob_choice: will be shown mercy
  chosen_korean: 자비를 받을 것입니다
  alternatives_korean:
  - 긍휼을 받을 것입니다
  - 자비를 입을 것입니다
  lexicon: BDAG
  rationale: 수동 미래의 의미를 살리면서, 하나님의 주도적 자비를 자연스러운 한국어로 표현했습니다.
- source_word: ἐν αὐτῇ
  english_pob_choice: in it
  chosen_korean: 그분 안에서
  alternatives_korean:
  - 그것 안에서
  - 그날에
  - 거기서
  lexicon: BDAG
  rationale: 직전 문맥의 ‘그날/심판의 때’를 가리키는 대명사로 이해하되, 본문에는 영어 POB가 유지한 지시성의 긴장을 담아 ‘그분 안에서’로 처리하고 주석으로 보완했습니다.
- source_word: ἐν τῇ ἐλεημοσύνῃ τοῦ θεοῦ αὐτῶν
  english_pob_choice: by the mercy of their God
  chosen_korean: 그들의 하나님이 베푸시는 자비로
  alternatives_korean:
  - 그들의 하나님의 자비로
  - 그들의 하나님께서 주시는 긍휼로
  lexicon: BDAG
  rationale: ἐλεημοσύνη의 구제행위 뉘앙스보다 여기서는 신적 자비가 핵심이므로, 수단을 나타내는 ‘-로’와 동사적 표현 ‘베푸시는’으로 의미를 분명히 했습니다.
- source_word: ἀπολοῦνται εἰς τὸν αἰῶνα χρόνον
  english_pob_choice: will perish forever
  chosen_korean: 영원히 멸망할 것입니다
  alternatives_korean:
  - 영원토록 망할 것입니다
  - 끝없이 멸망할 것입니다
  lexicon: BDAG
  rationale: 종말론적 심판의 결과를 담은 미래 중간/수동형을 한국어 관용에 맞게 ‘멸망할 것입니다’로 옮기고, διάρκεια를 ‘영원히’로 압축했습니다.
theological_decisions:
- issue: ἐν αὐτῇ의 지시 대상
  chosen_reading: 본문은 지시대상을 명시하지 않고 유지하되, 독자는 직전의 심판의 날을 염두에 둘 수 있습니다.
  alternative_readings:
  - ‘그날에’로 풀어 심판의 날을 명시하는 해석
  - ‘그 땅/그곳에서’로 받아들이는 해석
  rationale: 본문 자체의 대명사 모호성을 지우지 않기 위해 직역성을 보존하면서, 맥락상 가장 유력한 심판의 날 해석을 주석으로 안내합니다.
  doctrine_reference: 해석의 여지를 보존하고 본문이 가진 긴장을 유지합니다.
