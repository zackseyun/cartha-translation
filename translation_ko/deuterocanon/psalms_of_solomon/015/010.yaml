lexical_decisions:
- source_word: σημεῖον
  english_pob_choice: sign / mark
  chosen_korean: 표
  alternatives_korean:
  - 표시
  - 징표
  - 마크
  lexicon: BDAG
  rationale: 문맥상 이마에 붙어 있는 식별 표지를 가리키므로, ‘표’가 ‘sign’과 ‘mark’의 의미를 함께 살리면서도 한국어로 자연스럽습니다.
- source_word: ἀπωλείας
  english_pob_choice: of destruction
  chosen_korean: 멸망의
  alternatives_korean:
  - 파멸의
  - 파괴의
  - 멸절의
  lexicon: BDAG
  rationale: 표지가 가리키는 성격을 소유격으로 간결하게 나타내며, ‘멸망’이 단순한 파괴보다 종말론적 파괴의 뉘앙스를 잘 전달합니다.
- source_word: ἐπὶ τοῦ μετώπου αὐτῶν
  english_pob_choice: upon their foreheads
  chosen_korean: 그들의 이마 위에는
  alternatives_korean:
  - 그들의 이마에
  - 그들의 이마 위에
  lexicon: BDAG
  rationale: ἐπὶ + 속격의 위치감을 살려 ‘위에’를 유지했고, 한국어에서는 복수 대명사와 결합한 자연스러운 표현으로 풀었습니다.
theological_decisions:
- issue: σημεῖον의 반복적 상징성
  chosen_reading: ‘표’로 번역해 문맥상 의인의 ‘표’와 대비되는 멸망의 표지를 유지했습니다.
  alternative_readings:
  - ‘징표’로 번역
  - ‘표시’로 번역
  rationale: 본문은 동일 어휘를 반복하며 대조를 이루므로, 너무 약하거나 추상적인 표현보다 눈에 보이는 식별 표지를 드러내는 번역이 본문의 대비를 보존합니다.
  doctrine_reference: 성경 내 표징/인침의 대비
- issue: 멸망의 성격
  chosen_reading: ‘멸망’으로 번역해 단순한 물리적 파괴보다 종말적 심판의 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘파멸’로 번역
  - ‘폐망’으로 번역
  rationale: 문맥은 죄인에게 새겨진 표가 최종적 결과를 가리키므로, ‘멸망’이 가장 직접적이고 과도한 해석 없이도 무게를 전달합니다.
  doctrine_reference: 심판과 멸망의 표상
