- source_word: ἐλπὶς
  english_pob_choice: hope
  chosen_korean: 소망
  alternatives_korean:
  - 희망
  lexicon: BDAG
  rationale: 명사 ἐλπὶς의 기본 의미를 살리되, 시적·예배적 문맥에서 한국어 성경체에 자연스러운 '소망'을 택했습니다.
- source_word: καταφυγὴ
