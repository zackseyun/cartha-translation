  - 빈자의
  lexicon: BDAG
  rationale: πτωχοί의 사회경제적 빈곤을 직접 반영하기 위해 '가난한 자들'로 옮겼습니다.
- source_word: ὁ θεός
  english_pob_choice: O God
  chosen_korean: 오 하나님
  alternatives_korean:
  - 하나님
  - 오, 하나님
  lexicon: BDAG
  rationale: 문맥상 직접 호칭이므로 호격을 드러내는 '오 하나님'으로 번역했습니다.
theological_decisions:
- issue: 직접 호칭과 서술문 구조
  chosen_reading: 한국어에서는 서술명사구를 풀어 '...이시기 때문입니다'로 자연스럽게 만들고, 끝의 '오 하나님'으로 직접 호칭을 보존했습니다.
  alternative_readings:
  - '''가난한 자들의 소망이시며 피난처이신 하나님이시기 때문입니다'''
  - '''이는 가난한 자들의 소망과 피난처이신 분, 오 하나님이시기 때문입니다'''
  rationale: 그리스어는 명사 술어문이지만 한국어는 보통 '이시다'를 보충해야 자연스럽습니다. 동시에 호격 'ὁ θεός'의 직접 부름을 지워 버리지 않도록 호칭을 따로 살렸습니다.
