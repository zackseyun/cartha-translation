  lexicon: BDAG
  rationale: ‘refuge’에 해당하는 보호의 장소라는 뜻을 직접적으로 드러내는 말로 '피난처'가 가장 자연스럽습니다.
- source_word: τῶν πτωχῶν
  english_pob_choice: of the poor
  chosen_korean: 가난한 자들의
  alternatives_korean:
