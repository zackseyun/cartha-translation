base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/015/004.yaml
  text: And what is man able to do[a], except give thanks to your name?
  footnotes:
  - marker: a
    text: Or 'confess your name' or 'praise your name.' The Greek verb can carry any of these senses depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 사람이 무엇을 할 수 있습니까? 다만 주의 이름에 감사할 뿐입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주의 이름을 고백하다’, ‘주의 이름을 찬양하다’로도 옮길 수 있습니다. 그리스어 동사는 문맥에 따라 이런 뜻들을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  english_pob_choice: what
  chosen_korean: 무엇
  alternatives_korean:
  - 무슨 것
  - 어떤 것
  lexicon: LSJ
  rationale: 행위 가능성을 묻는 수사적 질문이므로, 대상이 아닌 ‘무엇’을 택해 문장의 기능을 살렸습니다.
- source_word: δυνατὸς
  english_pob_choice: able to do
  chosen_korean: 할 수 있습니까
  alternatives_korean:
  - 능히 할 수 있습니까
  - 해낼 수 있습니까
  lexicon: LSJ
  rationale: δυνατός의 능력 의미를 한국어의 자연스러운 가능 표현으로 옮겨, 동사적 함의를 드러냈습니다.
- source_word: ἐξομολογήσασθαι
  english_pob_choice: give thanks
  chosen_korean: 감사할 뿐입니다
  alternatives_korean:
  - 고백할 뿐입니다
  - 찬양할 뿐입니다
  lexicon: LSJ
  rationale: 하나님의 이름을 향한 경배·감사 문맥을 따라 ‘감사하다’를 본문으로 두고, 가능한 다른 의미는 주석에서 열어 두었습니다.
- source_word: τῷ ὀνόματί σου
  english_pob_choice: to your name
  chosen_korean: 주의 이름에
  alternatives_korean:
  - 주의 이름께
  - 주의 이름을
  lexicon: LSJ
  rationale: 여격 관계를 한국어의 ‘~에’로 살려, 감사가 향하는 대상이 하나님의 이름임을 분명히 했습니다.
theological_decisions:
- issue: ἐξομολογήσασθαι의 다의성
  chosen_reading: 본문에는 ‘감사하다’를 채택하되, 의미 범위상 고백·찬양 가능성은 각주로 열어 둡니다.
  alternative_readings:
  - 고백하다
  - 찬양하다
  rationale: 시편적 경배 문맥에서는 감사의 의미가 가장 자연스럽지만, 동사의 의미 폭을 지워 버리면 원문의 긴장과 해석 가능성을 잃게 됩니다.
  doctrine_reference: 시편적 찬양 언어의 다의성; 번역 투명성 원칙
