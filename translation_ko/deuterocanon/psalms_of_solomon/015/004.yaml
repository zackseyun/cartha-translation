    issue: 문두의 ‘그러면’
    rationale: καί는 단순 접속사이며, 본문에는 ‘그러므로/그러면’이라는 추론 관계를 표시하는 근거가 없습니다.
  - severity: medium
    issue: 수사 의문문을 평서문으로 분리함
    rationale: ‘무엇을 할 수 있습니까? ...뿐입니다’도 뜻은 전달하지만, εἰ μὴ가 이끄는 예외 절을 질문 안에 두는 원문의 구조와 강조를 더 충실히 살릴 수 있습니다.
