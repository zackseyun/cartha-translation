  rationale: εὐφροσύνη의 핵심은 내면의 기쁨이며, ‘마음의 기쁨 가운데’가 원문의 내적 원천을 간결하게 드러냅니다.
- source_word: καρπὸν χειλέων / ἀπαρχὴν χειλέων
  english_pob_choice: the fruit of lips / the firstfruits of lips
  chosen_korean: 입술의 열매 / 입술의 첫 열매
  alternatives_korean:
