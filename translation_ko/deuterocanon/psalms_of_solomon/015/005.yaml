  - 입술의 결실 / 입술의 첫 몫
  lexicon: LSJ
  rationale: 두 표현은 말 자체가 아니라 ‘드려지는 산물’의 이미지를 보존하므로, 한국어에서도 직역에 가까운 ‘입술의 열매’, ‘입술의 첫 열매’를 유지했습니다.
- source_word: ἐν ὀργάνῳ ἤρμοσμένῳ γλώσσης
  english_pob_choice: with the well-tuned instrument of the tongue
  chosen_korean: 혀의 잘 맞는 악기와 함께
  alternatives_korean:
  - 혀의 잘 조율된 악기와 함께
  - 혀에 맞게 조율된 악기로
  lexicon: LSJ
  rationale: ὀργανον과 ἡρμοσμένος의 결합은 ‘잘 맞춰진/조율된 악기’의 뜻을 담으므로, 한국어에서는 시적 구조를 살려 ‘혀의 잘 맞는 악기’로 옮겼습니다.
theological_decisions:
