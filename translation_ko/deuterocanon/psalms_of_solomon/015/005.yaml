  text: a new psalm with song[a], in the joy of the heart; the fruit of lips with the well-tuned instrument of the tongue[c][b]; the firstfruits of lips from a holy and righteous heart.
  footnotes:
  - marker: a
    text: Or, more formally, 'the fruit of lips with an instrument fitted to the tongue.' The Greek phrase is compact and somewhat difficult, so the main text gives its most natural sense in English.
    reason: lexical_alternative
  - marker: b
    text: The expressions 'fruit of lips' and 'firstfruits of lips' preserve the poem's offering imagery rather than paraphrasing it as mere speech or praise.
    reason: cultural_note
  - marker: c
    text: Or 'with the tongue as a well-tuned instrument'.
    reason: previous_rendering
translation:
  language: ko
  text: 새 노래를, 마음의 기쁨 가운데, 입술의 열매를 — 혀의 잘 맞는 악기와 함께; 거룩하고 의로운 마음에서 나오는 입술의 첫 열매를.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 압축된 표현을 살려, ‘혀의 잘 맞는 악기’로 옮겼습니다. 영어 POB가 덧붙인 ‘well-tuned instrument’는 이 이미지를 해명합니다.
    reason: source_note
  - marker: b
    text: ‘입술의 열매’와 ‘입술의 첫 열매’는 단순한 말이 아니라, 제물과 첫열매의 이미지를 보존합니다.
    reason: cultural_note
lexical_decisions:
- source_word: ψαλμὸν καινόν
  english_pob_choice: a new psalm
  chosen_korean: 새 노래
  alternatives_korean:
  - 새 시편
  - 새 찬송
  lexicon: LSJ
  rationale: ψαλμός는 노래로 불리는 시편적 찬가를 가리키며, 한국어에서는 ‘새 노래’가 시편적·찬양적 뉘앙스를 자연스럽게 살립니다.
- source_word: ᾠδῆς
  english_pob_choice: song
  chosen_korean: 노래
  alternatives_korean:
  - 노래의 형식
  - 가락
  lexicon: LSJ
  rationale: ᾠδή는 일반적인 ‘노래’이므로, 현대 한국어에서도 가장 सीधे하고 자연스러운 ‘노래’로 옮겼습니다.
- source_word: ἐν εὐφροσύνῃ καρδίας
  english_pob_choice: in the joy of the heart
  chosen_korean: 마음의 기쁨 가운데
  alternatives_korean:
  - 마음의 즐거움 가운데
  - 마음에 깃든 기쁨 속에서
  lexicon: LSJ
  rationale: εὐφροσύνη의 핵심은 내면의 기쁨이며, ‘마음의 기쁨 가운데’가 원문의 내적 원천을 간결하게 드러냅니다.
- source_word: καρπὸν χειλέων / ἀπαρχὴν χειλέων
  english_pob_choice: the fruit of lips / the firstfruits of lips
  chosen_korean: 입술의 열매 / 입술의 첫 열매
  alternatives_korean:
  - 입술에서 나는 열매 / 입술의 첫 소산
  - 입술의 결실 / 입술의 첫 몫
  lexicon: LSJ
  rationale: 두 표현은 말 자체가 아니라 ‘드려지는 산물’의 이미지를 보존하므로, 한국어에서도 직역에 가까운 ‘입술의 열매’, ‘입술의 첫 열매’를 유지했습니다.
- source_word: ἐν ὀργάνῳ ἤρμοσμένῳ γλώσσης
  english_pob_choice: with the well-tuned instrument of the tongue
  chosen_korean: 혀의 잘 맞는 악기와 함께
  alternatives_korean:
  - 혀의 잘 조율된 악기와 함께
  - 혀에 맞게 조율된 악기로
  lexicon: LSJ
  rationale: ὀργανον과 ἡρμοσμένος의 결합은 ‘잘 맞춰진/조율된 악기’의 뜻을 담으므로, 한국어에서는 시적 구조를 살려 ‘혀의 잘 맞는 악기’로 옮겼습니다.
theological_decisions:
- issue: 제사적 이미지의 보존
  chosen_reading: ‘입술의 열매’와 ‘입술의 첫 열매’를 그대로 유지해, 말과 찬양을 하나님께 드리는 예물의 이미지로 읽히게 했습니다.
  alternative_readings:
  - ‘입술의 말’로 완화하기
  - ‘찬양’으로 의미를 평탄화하기
  rationale: 원문은 단순한 발화가 아니라 제물/첫열매 어휘를 통해 드려짐의 이미지를 형성하므로, 이를 약화시키지 않는 것이 중요합니다.
  doctrine_reference: 시편적 제사 언어, 히브리성 성찬/예배 비유
