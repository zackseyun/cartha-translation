  yaml_path: translation/deuterocanon/psalms_of_solomon/015/005.yaml
  text: a new psalm with song[a], in the joy of the heart; the fruit of lips with the well-tuned instrument of the tongue[c][b]; the firstfruits of lips from a holy and righteous heart.
  footnotes:
  - marker: a
    text: Or, more formally, 'the fruit of lips with an instrument fitted to the tongue.' The Greek phrase is compact and somewhat difficult, so the main text gives its most natural sense in English.
    reason: lexical_alternative
  - marker: b
    text: The expressions 'fruit of lips' and 'firstfruits of lips' preserve the poem's offering imagery rather than paraphrasing it as mere speech or praise.
    reason: cultural_note
  - marker: c
    text: Or 'with the tongue as a well-tuned instrument'.
    reason: previous_rendering
translation:
  language: ko
  text: 마음의 기쁨으로 노래와 함께 새 시편을, 혀의 잘 조율된 악기로 입술의 열매를, 거룩하고 의로운 마음에서 나온 입술의 첫 열매를.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 직역하면 ‘혀의 잘 조율된 악기로’에 가까운 압축된 표현입니다. ‘악기’와 ‘혀’의 관계는 문법적으로 다소 난해하므로, 본문은 그 시적 이미지를 보존합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘입술의 열매’와 ‘입술의 첫 열매’는 단순한 말이나 찬양으로 바꾸지 않고, 제물과 첫열매의 이미지를 보존한 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ψαλμὸν καινόν
  english_pob_choice: a new psalm
