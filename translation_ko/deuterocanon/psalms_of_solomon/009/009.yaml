base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/009/009.yaml
  text: The one who does righteousness stores up life for himself with the Lord[e][d][c][b][a], and the one who does unrighteousness is himself responsible for his soul in destruction.
  footnotes:
  - marker: a
    text: Or “does justice.”
    reason: lexical_alternative
  - marker: b
    text: Or “stores up life for himself before the Lord” or “from the Lord.”
    reason: lexical_alternative
  - marker: c
    text: “Soul” may also be understood as “life” or “self.”
    reason: lexical_alternative
  - marker: d
    text: Or “is guilty for his soul unto destruction” or “is responsible for himself in ruin.”
    reason: alternative_reading
  - marker: e
    text: Or 'is himself responsible for his soul in destruction'.
    reason: previous_rendering
translation:
  language: ko
  text: 의를 행하는 사람은 주님과 함께 생명을 쌓아 두며, 불의를 행하는 사람은 자기 영혼을 멸망 가운데 두는 책임을 집니다.[a][b][c][d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘의를 행하다’는 ‘정의를 행하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘주님과 함께’는 ‘주님 앞에’ 또는 ‘주님으로부터’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘영혼’은 여기서 ‘생명’ 또는 ‘자기 자신’의 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 뒤의 절은 ‘자기 영혼의 멸망에 책임이 있습니다’ 또는 ‘자기 자신에게 대해 멸망의 책임이 있습니다’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: e
    text: 원문의 표현은 불의한 사람이 자기 자신에게 파멸을 초래한다는 뜻을 간결하게 전합니다.
    reason: theological_note
lexical_decisions:
- source_word: ὁ ποιῶν δικαιοσύνην
  english_pob_choice: the one who does righteousness
  chosen_korean: 의를 행하는 사람
  alternatives_korean:
  - 의를 행하는 자
  - 정의를 행하는 사람
  - 의를 실천하는 사람
  lexicon: BDAG
  rationale: δικαιοσύνην은 기본적으로 ‘의’로 옮기되, 문장 구조상 행위 주어를 자연스럽게 드러내기 위해 ‘의를 행하는 사람’으로 처리했습니다.
- source_word: θησαυρίζει ζωὴν αὐτῷ
  english_pob_choice: stores up life for himself
  chosen_korean: 생명을 쌓아 두며
  alternatives_korean:
  - 자기에게 생명을 저장하며
  - 자신을 위해 생명을 쌓으며
  - 자기를 위해 생명을 간직하며
  lexicon: BDAG
  rationale: θησαυρίζω의 축적 이미지를 살리되 현대 한국어에서 자연스럽게 들리도록 ‘쌓아 두다’로 옮겼습니다.
- source_word: παρὰ Κυρίῳ
  english_pob_choice: with the Lord
  chosen_korean: 주님과 함께
  alternatives_korean:
  - 주님 앞에
  - 주님으로부터
  - 주님 곁에
  lexicon: BDAG
  rationale: παρά + 여격의 관계적·근접적 의미를 반영하면서도, 생명이 주님과의 관계 안에 보관된다는 뜻을 자연스럽게 드러내기 위해 ‘주님과 함께’를 선택했습니다.
- source_word: ἀδικίαν ... αἴτιος τῆς ψυχῆς ἐν ἀπωλείᾳ
  english_pob_choice: is himself responsible for his soul in destruction
  chosen_korean: 자기 영혼을 멸망 가운데 두는 책임을 집니다
  alternatives_korean:
  - 자기 영혼의 멸망에 책임이 있습니다
  - 자기 영혼을 멸망에 이르게 한 책임이 있습니다
  - 자기 영혼에 대해 멸망의 책임이 있습니다
  lexicon: BDAG
  rationale: αἴτιος와 ἐν ἀπωλείᾳ의 긴장을 살리기 위해 단순한 ‘죄책’보다 ‘책임을 집니다’로 옮겼고, ψυχή는 이 문맥에서 ‘영혼’으로 유지했습니다.
theological_decisions:
- issue: καὶ의 연결 방식
  chosen_reading: 두 절을 ‘그리고’로 연결해 대조를 유지했습니다.
  alternative_readings:
  - 그러나로 번역해 강한 대조를 드러내는 방식
  - 반면으로 옮기는 방식
  rationale: 원문은 καὶ를 사용하므로, 한국어에서도 기본 연결을 유지하되 의미상 대비는 동사의 상반성으로 드러나게 했습니다.
  doctrine_reference: 원문 접속사 존중 원칙
- issue: ψυχή의 번역
  chosen_reading: 주요 본문에는 ‘영혼’을 사용했습니다.
  alternative_readings:
  - 생명
  - 자기 자신
  rationale: 경고의 종교적·종말론적 무게를 보존하기 위해 ‘영혼’을 택했습니다. 다만 이 단어는 넓게는 생명이나 자기를 가리킬 수 있습니다.
  doctrine_reference: ψυχή의 의미 범위
