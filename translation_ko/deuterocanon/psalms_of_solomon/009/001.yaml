  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ἐν ἀποικεσίᾳ는 포로 신분 자체보다 ‘유배/추방의 상태’를 가리키므로, ‘포로로’는 가능하지만 다소 좁힐 수 있습니다. 또한 본문은 다음 구절로 이어지는 두 시간절이므로 한국어에서도 이를 열어 둔 형태가 적절합니다.
  naturalness: 현 번역의 ‘때입니다’는 뒤따를 주절이 없는 이 절을 독립 진술로 바꾸어 어색합니다. 시간절 종결 ‘때,’로 두어 원문의 미완결 구문과 연결성을 보존하는 편이 자연스럽고 정확합니다.
  terminology: ‘이방 땅’, ‘주님’, ‘구속하신’은 성경적 문맥과 합쇼체 문체에 적절합니다. 대명사 αὐτούς는 ‘자기들’보다 선행사인 이스라엘을 명료하게 받는 ‘그들’을 쓰는 것이 현대 문어에서 더 자연스럽습니다.
