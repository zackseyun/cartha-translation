id: PSS.9.1
reference: Psalms of Solomon 9:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: lxx-swete-1909
  text: Ἐν τῷ ἀπαχθῆναι Ἰσραὴλ ἐν ἀποικεσίᾳ εἰς γῆν ἀλλοτρίαν, ἐν τῷ ἀποστῆναι αὐτοὺς ἀπὸ Κυρίου τοῦ λυτρωσαμένου αὐτούς,
  language: Greek
  pages:
