base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/009/001.yaml
  text: When Israel was carried away into exile to a foreign land[a], when they departed from the Lord who had redeemed them,
  footnotes:
  - marker: a
    text: Or 'fell away from' or 'apostatized from' the Lord.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘이 이방 땅으로 포로로 끌려가고, 자기들을 구속하신 주님에게서 떠나갔을 때입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님에게서 떨어져 나갔을 때’ 또는 ‘주님에게서 배교했을 때’.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῷ ἀπαχθῆναι
  english_pob_choice: was carried away
  chosen_korean: 포로로 끌려가고
  alternatives_korean:
  - 끌려가고
  - 옮겨져 가고
  - 붙잡혀 가고
  lexicon: BDAG
  rationale: 수동적 강제 이송의 의미를 살리기 위해 ‘포로로 끌려가다’로 옮겼습니다. 단순한 이동이 아니라 강제 유배를 드러냅니다.
- source_word: ἐν ἀποικεσίᾳ
  english_pob_choice: in exile
  chosen_korean: 포로로
  alternatives_korean:
  - 유배 중에
  - 포로 상태에서
  - 유배지에서
  lexicon: LSJ
  rationale: 문맥상 이스라엘의 추방된 상태를 가리키므로, 한국어에서는 앞의 동작과 결합해 자연스럽게 ‘포로로’로 풀어 주었습니다.
- source_word: γῆν ἀλλοτρίαν
  english_pob_choice: a foreign land
  chosen_korean: 이방 땅
  alternatives_korean:
  - 낯선 땅
  - 외국 땅
  - 남의 땅
  lexicon: LSJ
  rationale: ‘자기 땅이 아닌, 다른 이들의 땅’이라는 뜻을 간결하게 살리는 표현으로 ‘이방 땅’을 선택했습니다.
- source_word: ἀποστῆναι
  english_pob_choice: turned away
  chosen_korean: 떠나갔을 때입니다
  alternatives_korean:
  - 돌이켜 떠났을 때입니다
  - 배반하고 떠났을 때입니다
  - 주님에게서 돌아섰을 때입니다
  lexicon: BDAG
  rationale: 동사가 단순한 이동보다 관계적 이탈과 결별을 포함하므로, POB의 의미를 따라 ‘주님에게서 떠나가다’로 번역했습니다.
- source_word: τοῦ λυτρωσαμένου αὐτούς
  english_pob_choice: who had redeemed them
  chosen_korean: 자기들을 구속하신
  alternatives_korean:
  - 자기들을 속량하신
  - 자기들을 구원하신
  - 자기들을 건져 주신
  lexicon: BDAG
  rationale: 구속의 대가를 지불해 건져 내는 뉘앙스를 살리기 위해 ‘구속하신’을 택했습니다. 본문의 구속자-백성 관계를 분명히 드러냅니다.
theological_decisions:
- issue: ἀποστῆναι의 관계적·언약적 이탈 표현
  chosen_reading: ‘주님에게서 떠나갔을 때입니다’로 번역해 단순한 지리적 이동이 아니라 언약적 이탈을 드러냈습니다.
  alternative_readings:
  - 주님에게서 돌아섰을 때입니다
  - 주님을 배반하고 떠났을 때입니다
  - 주님에게서 떨어져 나갔을 때입니다
  rationale: 이 동사는 이 본문에서 구속하신 주님에 대한 관계 파기를 포함하므로, 의미를 약화시키지 않으면서도 현대 한국어로 자연스럽게 옮겼습니다.
  doctrine_reference: 언약적 배교/이탈의 언어
- issue: λυτρόω 계열의 구속 언어
  chosen_reading: ‘구속하신’으로 번역해 하나님의 구원 행위를 법적·해방적 의미를 함께 갖는 구속으로 표현했습니다.
  alternative_readings:
  - 구원하신
  - 건져 주신
  - 속량하신
  rationale: 본문은 단순한 도움보다 이스라엘을 값 치르고 되찾는 구속의 뉘앙스를 갖기 때문에, 전통적이되 의미가 분명한 ‘구속’이 적합합니다.
  doctrine_reference: 구속/속량의 성경적 표현
