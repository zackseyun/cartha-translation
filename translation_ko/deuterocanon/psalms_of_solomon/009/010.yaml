base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/009/010.yaml
  text: For the judgments of the Lord are in righteousness toward each man and household[a][b][c].
  footnotes:
  - marker: a
    text: 'Greek literally, “according to man and house,” likely with a distributive sense: applied to each individual and household.'
    reason: lexical_alternative
  - marker: b
    text: “Righteous” could also be rendered “just” here, since the phrase concerns the Lord’s judgments.
    reason: lexical_alternative
  - marker: c
    text: Or 'are righteous'.
    reason: previous_rendering
translation:
  language: ko
  text: 이는 주님의 심판이 각 사람과 집안에 대하여 의롭게 이루어지기 때문입니다[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어는 문자적으로 “사람 한 사람과 집안 하나하나에 따라”입니다. 여기서는 각 개인과 각 집안에 분배적으로 적용되는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘의롭게’는 헬라어 ἐν δικαιοσύνῃ(문자적으로 “의 안에서”)를 한국어 문장에 맞게 옮긴 것입니다. “의 안에서 이루어집니다”로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “주님의 심판은 각 사람과 집안에 대하여 의 안에서 이루어집니다.”
    reason: previous_rendering
lexical_decisions:
- source_word: κρίματα
  english_pob_choice: judgments
  chosen_korean: 심판
  alternatives_korean:
  - 판결
  - 심판들
  - 판정
  lexicon: LSJ
  rationale: κρίματα는 법정적 판단과 심판 행위를 가리키므로, 문맥의 משפט적 힘을 살리기 위해 ‘심판’으로 옮겼습니다.
- source_word: Κυρίου
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주인
  lexicon: LSJ
  rationale: κύριος의 통상적 POB 대응을 따라 ‘주님’으로 번역해 존칭과 신적 호칭을 유지했습니다.
- source_word: ἐν δικαιοσύνῃ
  english_pob_choice: are in righteousness
  chosen_korean: 의롭습니다
  alternatives_korean:
  - 의 안에 있습니다
  - 의로우십니다
  - 의 안에서 행하십니다
  lexicon: LSJ
  rationale: 본문의 ἐν δικαιοσύνῃ는 하나님의 심판의 성격을 나타내므로, 한국어에서는 자연스럽게 그 심판의 상태를 ‘의롭습니다’로 풀어 lexical chain인 δικαιοσύνη의 뜻을 살렸습니다.
- source_word: κατʼ ἄνδρα καὶ οἶκον
  english_pob_choice: according to each man and household
  chosen_korean: 각 사람과 집안에 대하여
  alternatives_korean:
  - 각 사람과 가문에 따라
  - 각 사람과 집에 따라
  - 각 사람과 집안대로
  lexicon: LSJ
  rationale: κατά + 대격의 분배적 용법을 반영해 ‘각 사람과 집안에 대하여’로 옮겼으며, οἶκος는 여기서 개별 가정/가문 단위를 가리키므로 ‘집안’이 가장 자연스럽습니다.
theological_decisions:
- issue: 분배적 판단의 범위
  chosen_reading: 주님의 심판이 사람과 가정 단위에 따라 개별적으로 미칩니다.
  alternative_readings:
  - 모든 사람과 가정에 대해 일반적으로 미친다
  - 각 사람에게만 개별적으로 미친다
  rationale: κατʼ ἄνδρα καὶ οἶκον은 분배적으로 읽는 것이 가장 자연스럽고, 본문이 개인과 집안 모두를 포괄하는 심판의 공정성을 강조합니다.
  doctrine_reference: 하나님의 공의와 개별적 심판
- issue: δικαιοσύνη의 표현 방식
  chosen_reading: ‘의롭습니다’로 옮겨 심판의 성격을 진술했습니다.
  alternative_readings:
  - ‘의 안에 있습니다’
  - ‘의로우십니다’
  rationale: 명사 δικαιοσύνη를 한국어에서 어색한 전치사구로 유지하기보다, 심판의 성격을 직접 진술하는 방식이 본문의 신학적 의미를 더 분명히 전달합니다.
  doctrine_reference: 하나님의 의
