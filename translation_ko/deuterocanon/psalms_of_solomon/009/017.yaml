translation:
  language: ko
  text: 이는 주님께서 모든 민족들보다 아브라함의 씨를 택하셨기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡρέτισω
  english_pob_choice: chose
  chosen_korean: 택하셨기
  alternatives_korean:
  - 선택하셨기
  - 고르셨기
  lexicon: LSJ
  rationale: 선택 행위를 분명히 드러내면서, 언약적·주권적 뉘앙스를 자연스럽게 담기 위해 ‘택하다’를 썼습니다.
- source_word: τὸ σπέρμα Ἀβραὰμ
  english_pob_choice: offspring
  chosen_korean: 아브라함의 씨
  alternatives_korean:
  - 아브라함의 후손
  - 아브라함의 자손들
  - 아브라함의 자손
  lexicon: LSJ
  rationale: σπέρμα의 집합적·문자적 힘을 살리기 위해 ‘씨’를 유지했습니다. 한국어에서는 다소 직역적이지만, POB의 소스-직결성을 보존하는 쪽이 더 적합합니다.
- source_word: παρὰ πάντα τὰ ἔθνη
  english_pob_choice: above all the nations
  chosen_korean: 모든 민족들보다
  alternatives_korean:
  - 모든 민족들 위에
  - 모든 민족들보다 더
  - 모든 민족들 너머로
  lexicon: LSJ
  rationale: παρά + 대격의 비교 의미를 한국어 비교격 ‘-보다’로 가장 직접적으로 옮겼습니다. ‘민족들’은 ἔθνη의 중립적 의미를 유지합니다.
theological_decisions:
- issue: 아브라함의 씨에 대한 선택/우선성 표현
  chosen_reading: 하나님이 아브라함의 씨를 모든 민족들보다 택하셨다고 직설적으로 옮겼습니다.
  alternative_readings:
  - 아브라함의 씨를 모든 민족들 가운데 구별하셨다고 옮길 수 있습니다.
  - 아브라함의 씨를 다른 민족들보다 우선하여 택하셨다고 옮길 수 있습니다.
  rationale: 본문은 단순한 구별보다 분명한 선택과 우선성을 말하므로, 이를 약화하지 않고 그대로 드러냈습니다.
  doctrine_reference: 언약적 선택과 하나님의 주권
- issue: 시편의 직접 진술에서 주어 명시
  chosen_reading: 원문의 2인칭 주어 ‘σὺ’를 한국어에서 ‘주님께서’로 풀어 주어를 명시했습니다.
  alternative_readings:
  - ‘당신이’로 직역할 수 있습니다.
  - 주어를 생략해 ‘모든 민족들보다 아브라함의 씨를 택하셨기 때문입니다’로 둘 수 있습니다.
  rationale: 합쇼체의 자연스러움과 예배적 문맥을 고려해, 독자가 하나님을 바로 지시하도록 주어를 분명히 했습니다.
  doctrine_reference: 예배적 직접 호칭과 번역의 명시성
