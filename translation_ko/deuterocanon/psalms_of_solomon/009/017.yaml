  source_fidelity: 핵심 의미는 대체로 충실합니다. ἡρέτισω의 선택, σπέρμα의 집합적 계보 의미, παρὰ ...의 비교·우선 의미가 유지되었습니다. 다만 현대 표준어에서 ‘아브라함의 씨’는 문자적 표현이면서 다소 부자연스럽고 다른 연상을 낳을 수 있으므로, 집합 단수의 뜻을 보존하는 ‘아브라함의 자손’이 더 적절합니다.
  naturalness: 합쇼체 문장 구조는 자연스럽습니다. ‘모든 민족들’보다 ‘모든 민족’이 현대 한국어에서 더 간결하고 자연스럽습니다. ‘주님께서’는 본문의 2인칭 신적 수신자를 문맥상 자연스럽게 드러내며, 의미를 실질적으로 확장하지 않습니다.
  terminology: ‘택하셨다’는 선택의 의미를 정확하고 자연스럽게 전달합니다. ‘아브라함의 자손’은 σπέρμα의 집합적 의미를 자연스럽게 옮기며, ‘민족’은 ἔθνη에 대한 중립적 번역입니다.
  issues:
