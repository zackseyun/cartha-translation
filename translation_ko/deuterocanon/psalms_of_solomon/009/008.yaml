lexical_decisions:
- source_word: ἐπεσκέπτῃ
  english_pob_choice: visit
  chosen_korean: 방문하십니다
  alternatives_korean:
  - 돌보십니다
  - 살피십니다
  - 찾아오십니다
  lexicon: BDAG
  rationale: 이 동사는 문맥에 따라 ‘방문하다, 살피다, 돌보다’의 의미를 가질 수 있으나, 영어 POB의 최종 판정처럼 본문 표면 의미를 살려 ‘방문하십니다’로 옮기되, 심판적 맥락을 과도하게 해석하지 않도록 했습니다.
- source_word: δικαιοσύνῃ
  english_pob_choice: righteousness
  chosen_korean: 의로우심
  alternatives_korean:
  - 의
  - 공의
  lexicon: BDAG
  rationale: 하나님의 성품과 행위를 나타내는 표현이므로, 프로젝트 기본값에 따라 ‘의’의 개념을 담되 자연스러운 한국어 신학 문체로 ‘의로우심’이라 하였습니다.
- source_word: υἱοὺς ἀνθρώπων
  english_pob_choice: the sons of men
  chosen_korean: 사람의 아들들
  alternatives_korean:
  - 인간들
  - 사람의 자녀들
  - 인자들
  lexicon: BDAG
  rationale: 문구의 관용적·셈어적 색채를 유지하기 위해 남성형 표지를 지운 완전 중립어보다 직역에 가까운 ‘사람의 아들들’을 택했습니다.
theological_decisions:
- issue: ἐπισκέπτομαι의 의미 범위와 하나님의 행위 방식
  chosen_reading: 주님이 의로우심으로 사람을 ‘방문하신다’는 표면 의미를 유지했습니다.
  alternative_readings:
  - 사람을 살피신다
  - 사람을 돌보신다
  - 사람을 심문하신다
  rationale: 이 구절은 하나님의 의로운 행위가 인간에게 미치는 사실을 말하지만, 현재 절만으로 ‘심문’처럼 판정적 의미를 한국어 본문에 직접 확정하기에는 영어 POB와 최종 개정 이력이 더 보수적입니다. 따라서 원문 동사의 기본 의미를 살리면서도 해석을 과도하게 확장하지 않았습니다.
  doctrine_reference: 본문 맥락의 심판성은 과도한 주해 없이 보존하고, 직역 우선 원칙을 따름
