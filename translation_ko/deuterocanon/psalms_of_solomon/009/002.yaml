  chosen_reading: ‘이스라엘의 흩어짐’이라는 명사구를 유지했습니다.
  alternative_readings:
  - 이스라엘이 모든 민족 가운데 흩어졌습니다
  - 이스라엘은 모든 민족 가운데 흩어져 있습니다
  rationale: 그리스어가 명사구를 사용하므로, 상태와 현실을 압축한 표현을 보존하는 편이 원문 구조와 신학적 긴장을 더 잘 드러냅니다.
  doctrine_reference: 원문 구조 보존과 이스라엘의 분산 상태를 명시하는 해석
