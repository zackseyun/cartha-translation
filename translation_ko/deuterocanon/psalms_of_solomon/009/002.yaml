  - marker: a
    text: Or 'Israel is scattered among every nation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 주님께서 그들에게 주신 기업에서 쫓겨났습니다. 하나님의 말씀대로 이스라엘의 흩어짐은 모든 민족 가운데 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이스라엘이 모든 민족 가운데 흩어져 있습니다.”
    reason: 원문의 명사구 ‘이스라엘의 흩어짐’을 동사절로 풀어 옮긴 대안입니다.
lexical_decisions:
- source_word: ἀπερρίφησαν
  english_pob_choice: were cast out
  chosen_korean: 쫓겨났습니다
  alternatives_korean:
  - 내쫓겼습니다
  - 버림받았습니다
  lexicon: BDAG
  rationale: 수동형의 강한 배제와 강제 이탈을 살리기 위해, 단순한 거절보다 외적으로 밀려난 느낌이 드러나는 ‘쫓겨났습니다’를 택했습니다.
- source_word: κληρονομίας
  english_pob_choice: inheritance
  chosen_korean: 기업
  alternatives_korean:
  - 상속
  - 유업
  lexicon: BDAG
  rationale: 성경 문맥에서 하나님이 주시는 분깃·땅·언약적 소유를 가리키는 정착된 한국어 표현으로 ‘기업’이 가장 자연스럽고 신학적 무게도 유지합니다.
- source_word: διασπορὰ
  english_pob_choice: dispersion
  chosen_korean: 흩어짐
  alternatives_korean:
  - 디아스포라
  - 흩어져 있음
  - 산재함
  lexicon: BDAG
  rationale: 명사형을 살리면서도 현대 한국어에서 이해 가능한 표현으로 ‘흩어짐’을 사용해, 이스라엘이 민족들 가운데 분산된 상태를 드러냈습니다.
- source_word: κατὰ τὸ ῥῆμα τοῦ θεοῦ
  english_pob_choice: according to the word of God
  chosen_korean: 하나님의 말씀에 따른 것입니다
  alternatives_korean:
  - 하나님의 말씀대로입니다
  - 하나님의 선포에 따른 것입니다
  lexicon: BDAG
  rationale: ῥῆμα를 ‘말씀’으로 옮겨 하나님의 발화·선언의 폭을 열어 두었고, ‘따른 것입니다’로 원인의 종속 관계를 자연스럽게 표현했습니다.
theological_decisions:
