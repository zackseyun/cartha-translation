  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/009/019.yaml
  text: In a covenant you appointed to our fathers concerning us[b][a], and we will hope in you in the turning back of our soul.
  footnotes:
  - marker: a
    text: Or 'when we repent'; the Greek is literally 'in the turning back/return of our soul.'
    reason: lexical_alternative
  - marker: b
    text: Or 'In covenant you made'.
    reason: previous_rendering
translation:
  language: ko
  text: 주께서는 우리를 두고 우리 조상들과 언약을 맺으셨으니, 우리는 우리 영혼이 돌아올 때 주님께 소망을 두겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리 영혼이 회개할 때’입니다. 그리스어는 문자적으로 ‘우리 영혼의 돌아섬/돌아옴’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘언약으로 맺으셨습니다’입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ἐν διαθήκῃ διέθου
  english_pob_choice: In a covenant you appointed
  chosen_korean: 언약을 맺으셨으니
  alternatives_korean:
  - 언약 안에서 정하셨으니
  - 언약으로 세우셨으니
  lexicon: BDAG / LSJ
  rationale: ἐν διαθήκῃ διέθου는 헬라어의 히브리식 관용구로, 한국어에서는 부자연스러운 전치사구보다 ‘언약을 맺다’로 자연스럽게 옮기되 언약적 행위를 분명히 살렸습니다.
- source_word: τοῖς πατράσιν ἡμῶν
  english_pob_choice: with our fathers
  chosen_korean: 우리 조상들과
  alternatives_korean:
  - 우리 아버지들과
  - 우리 조상들
  lexicon: BDAG
  rationale: 직역상 ‘우리 아버지들’이지만, 문맥상 족장적/언약적 선조를 가리키므로 한국어에서는 의미를 분명히 하는 ‘우리 조상들’이 적절합니다.
- source_word: περὶ ἡμῶν
  english_pob_choice: concerning us
  chosen_korean: 우리를 두고
  alternatives_korean:
  - 우리에 관하여
  - 우리를 위하여
  lexicon: BDAG
  rationale: περὶ + 속격의 ‘관하여/대하여’ 의미를 살리면서도, 언약의 대상이 우리임을 자연스럽게 드러내기 위해 ‘우리를 두고’로 옮겼습니다.
- source_word: ἐπιστροφῇ ψυχῆς ἡμῶν
  english_pob_choice: in the turning back of our soul
  chosen_korean: 우리 영혼이 돌아올 때
  alternatives_korean:
  - 우리 영혼의 돌아옴 안에서
  - 우리 영혼의 돌아섬에서
  lexicon: BDAG
  rationale: ἐπιστροφή는 ‘돌아옴/돌이킴’의 뜻을 가지며 회개 뉘앙스도 있으나, 본문이 그 의미를 직접 규정하지 않으므로 ‘우리 영혼이 돌아올 때’로 옮겨 해석의 여지를 남겼습니다.
- source_word: ἐλπιοῦμεν ἐπὶ σὲ
  english_pob_choice: we will hope in you
  chosen_korean: 우리는 ... 주님께 소망을 두겠습니다
  alternatives_korean:
  - 우리는 주님을 바라겠습니다
  - 우리는 주님께 희망을 두겠습니다
  lexicon: BDAG
  rationale: ἐλπίζω의 미래형을 반영해 장래의 태도를 분명히 하고, 한국어 성경 문체에서 자연스러운 ‘소망을 두다’로 옮겼습니다.
theological_decisions:
- issue: ἐπιστροφῇ ψυχῆς ἡμῶν을 회개로 명시할지 여부
  chosen_reading: ‘우리 영혼이 돌아올 때’로 유지하여 회개 의미를 암시하되 명시하지 않았습니다.
  alternative_readings:
  - 우리의 회개 때에
  - 우리 영혼의 회심에서
  rationale: 본문은 ‘돌아섬/돌아옴’이라는 이미지는 분명하지만, 회개로 단정하는 표현은 해석을 앞세울 수 있으므로 의미의 긴장을 보존했습니다.
  doctrine_reference: 해석을 단정하지 않고 본문의 어휘적 긴장을 유지합니다.
