- from: 주님은 모든 땅의 모든 백성 위에 계신 의로운 재판장이십니다.[a]
  to: 이는 주님께서 온 땅의 모든 민족의 의로운 재판장이시기 때문입니다.[a]
  rationale: ‘온 땅의 모든 민족’으로 τῆς γῆς가 λαούς를 수식하는 관계와 복수 집단의 범위를 바로잡았습니다. ‘모든 민족의 ... 재판장’은 ἐπί가 나타내는 재판 권한의 범위를 자연스러운 한국어로 전달합니다. 또한 문장 첫머리에 ‘이는 ... 때문입니다’를 두어 ὅτι의 인과적 연결을 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:09:39Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 ὅτι가 나타내는 근거·이유의 관계와 πάντας τοὺς λαοὺς τῆς γῆς의 범위는 살려야 합니다. 초안의 ‘모든 땅의 모든 백성’은 τῆς γῆς(땅)의 수와 수식 관계를 부정확하게 처리했습니다.
  naturalness: ‘모든 백성 위에 계신 재판장’은 한국어에서 공간적 의미가 강하고 다소 어색합니다. ‘온 땅의 모든 민족의 ... 재판장’으로 하면 관할과 대상의 뜻을 자연스럽게 전달합니다.
  terminology: κρίτης δίκαιος는 ‘의로운 재판장’으로 유지할 수 있습니다. λαοί의 복수 집단성을 본문에서는 ‘민족’으로, 각주에서는 ‘백성’으로 제시합니다. 호칭 ‘주님’은 문맥상 허용되며 원문의 2인칭을 ‘주님께서’로 반영합니다.
  issues:
