    rationale: 원문은 ‘땅들의 모든 백성’이 아니라 ‘땅의 모든 백성/민족’입니다. 또한 영어 감사 기록의 ‘all the peoples of the earth’와도 맞지 않습니다.
  - severity: medium
    issue: ὅτι의 인과적 기능 누락
    rationale: ὅτι는 앞 문맥에 대한 근거나 이유를 도입하므로 ‘이는 ... 때문입니다’로 반영하는 것이 안전합니다.
  - severity: low
    issue: ‘위에 계신’의 공간적·비자연적 표현
    rationale: ἐπί의 관할·권위 의미를 한국어 소유격 구성으로 자연스럽게 나타낼 수 있습니다.
  revised_text: 이는 주님께서 온 땅의 모든 민족의 의로운 재판장이시기 때문입니다.[a]
