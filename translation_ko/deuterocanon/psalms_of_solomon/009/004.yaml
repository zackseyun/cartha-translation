lexical_decisions:
- source_word: κριτὴς
  english_pob_choice: judge
  chosen_korean: 재판장
  alternatives_korean:
  - 심판자
  - 판사
  lexicon: BDAG
  rationale: 하나님의 사법적 권위를 드러내기 위해 일반적인 ‘판사’보다 위엄 있는 ‘재판장’을 택했습니다. 다만 기능상으로는 ‘judge’를 직접 반영합니다.
- source_word: δίκαιος
  english_pob_choice: righteous
  chosen_korean: 의로운
  alternatives_korean:
  - 의인한
  - 의로운 분
  - 공의로운
  lexicon: BDAG
  rationale: 하나님의 성품을 묘사하는 말이므로 도덕적·신학적 무게를 살려 ‘의로운’으로 옮겼습니다.
- source_word: πάντας τοὺς λαοὺς
  english_pob_choice: all the peoples
  chosen_korean: 모든 백성
  alternatives_korean:
  - 모든 민족들
  - 모든 ժողովուրդ들
  - 모든 사람들
  lexicon: BDAG
  rationale: 원문 복수형 λαοὺς의 집합성을 살리면서도 한국어에서 자연스럽게 읽히도록 ‘백성’으로 옮겼습니다.
- source_word: ἐπὶ
  english_pob_choice: over
  chosen_korean: 위에 계신
  alternatives_korean:
  - 위에
  - 다스리시는
  - 통치하시는
  lexicon: BDAG
  rationale: 지배·관할의 의미를 한국어의 위치 표현으로 풀어 ‘위에 계신’이라 했습니다. 단순한 공간적 ‘위’가 아니라 통치권을 암시합니다.
theological_decisions:
- issue: 하나님의 보편적 통치와 재판의 범위
  chosen_reading: ‘모든 땅의 모든 백성 위에 계신’으로 하나님의 재판 권한이 지리적으로나 민족적으로 제한되지 않음을 드러냈습니다.
  alternative_readings:
  - ‘온 땅의 모든 민족에게’
  - ‘땅 위의 모든 사람에게’
  rationale: 원문은 πάντας τοὺς λαοὺς τῆς γῆς로 보편적 범위를 강조하므로, 이를 약화시키지 않고 하나님의 주권적 심판권을 분명히 했습니다.
  doctrine_reference: 하나님의 주권과 보편 심판
