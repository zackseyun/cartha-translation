  source_fidelity: 첫 절은 ἔθου를 과거 사건으로 옮긴 점과 ἐφʼ ἡμᾶς의 위치 이미지를 보존한 점이 적절합니다. 그러나 οὐ καταπαύσεις τὸν αἰῶνα에는 ‘이름’을 가리키는 목적어가 없으므로, ‘그것을 거두지 않으실 것입니다’는 원문에 없는 대상을 보충하고 καταπαύω를 ‘거두다’로 특정합니다. 원문의 표현은 주님이 ‘영원토록 그치지 않으실 것’이라는 형태를 유지하는 것이 안전합니다.
  naturalness: ‘주님, 주님께서는’은 호격 뒤에 주어를 다시 밝혀 현대 한국어에서 자연스럽고, ‘우리 위에 두셨고’와 ‘영원토록 그치지 않으실 것입니다’도 합쇼체 문맥에 맞습니다.
  terminology: Κύριε는 ‘주님’으로 일관되게 옮겼습니다. ‘이름’과 ‘우리 위에’는 원문의 핵심 어휘와 공간 은유를 보존합니다. 해석적 각주는 원문이 명시하지 않는 ‘소유와 보호’를 덧붙이므로 삭제하는 것이 좋습니다.
