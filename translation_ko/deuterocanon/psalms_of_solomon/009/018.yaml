  text: And you set your name upon us, O Lord; and you will never remove it.
translation:
  language: ko
  text: 주님, 주님께서는 주님의 이름을 우리 위에 두셨고, 영원토록 그치지 않으실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθου
  english_pob_choice: you set
  chosen_korean: 두셨으며
  alternatives_korean:
  - 놓으셨으며
  - 두셨습니다
  lexicon: τίθημι
  rationale: 과거 완료적 뉘앙스를 살리되, 한국어에서는 자연스럽게 ‘이름을 우리 위에 두다’로 옮기는 것이 원문의 은유를 가장 직접적으로 전달합니다.
- source_word: τὸ ὄνομά σου ἐφʼ ἡμᾶς
  english_pob_choice: your name upon us
  chosen_korean: 주님의 이름을 우리 위에
  alternatives_korean:
  - 주님의 이름을 우리에게
  - 주님의 이름을 우리 위에 얹어
  lexicon: ὄνομα + ἐπί
  rationale: ἐφʼ ἡμᾶς는 단순 소유가 아니라 ‘우리 위에’라는 위치적 이미지를 주므로, POB의 의미를 유지해 직역에 가깝게 옮겼습니다.
- source_word: οὐ καταπαύσεις τὸν αἰῶνα
  english_pob_choice: you will never remove it
  chosen_korean: 영원히 그것을 거두지 않으실 것입니다
  alternatives_korean:
  - 영원히 그것을 멈추지 않으실 것입니다
  - 영원히 그것을 떼지 않으실 것입니다
  lexicon: καταπαύω + τὸν αἰῶνα
  rationale: 문맥상 ‘멈추다’보다 이름을 ‘거두다/치우다’가 더 자연스럽고, αἰῶνα는 한국어 성경 관용을 고려해 ‘영원히’로 풀었습니다.
theological_decisions:
- issue: 하나님의 이름이 ‘우리 위에’ 놓이는 표상
  chosen_reading: 언약적 소속과 보호의 표상으로 이해해 직설적으로 번역했습니다.
  alternative_readings:
  - 상징적 호칭 부여로 완화해 번역
  - ‘우리 안에’처럼 내면화하여 번역
  rationale: 원문은 신적 이름의 부착/표식을 말하므로, 전통적 완화보다 표상의 강도를 살리는 것이 더 충실합니다.
  doctrine_reference: 언약 표지와 하나님의 소유권 표상
