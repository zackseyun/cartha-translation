  to: 그가 죄를 지은 이들이 아니라면 누구에게 죄를 용서하겠습니까?
  rationale: 여격 τίνι를 ‘누구에게’로, 미래 능동형 ἀφήσει를 ‘용서하겠습니까’로 반영하여 원문의 주어와 용서의 대상을 바로잡았습니다. εἰ μὴ의 배타적 수사 조건은 ‘죄를 지은 이들이 아니라면’으로 유지했고, 불필요한 번역 메타 각주는 삭제했습니다.
