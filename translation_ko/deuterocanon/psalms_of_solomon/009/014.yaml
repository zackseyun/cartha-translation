  source_fidelity: 초안은 첫 질문을 ‘죄를 용서하실 분이 누구입니까?’로 옮겨, 원문의 여격 의문사 τίνι(‘누구에게’)와 동사의 주어인 생략된 ‘그’를 뒤바꾸었습니다. 원문은 용서하는 이가 누구인지를 묻는 것이 아니라, 그가 죄를 지은 사람들 외에 누구에게 죄를 용서하겠느냐고 묻습니다. 수정문은 이 관계를 보존합니다.
  naturalness: ‘그가 죄를 지은 이들이 아니라면 누구에게 죄를 용서하겠습니까?’는 현대 표준 한국어의 자연스러운 합쇼체 수사 의문문입니다. ‘죄를 지은 이들’은 완료분사의 의미를 무리 없이 드러냅니다.
  terminology: ἁμαρτίας는 ‘죄를’, ἀφήσει는 문맥상 ‘용서하겠습니까’로 옮겼습니다. τοῖς ἡμαρτηκόσι는 명사화하여 ‘죄를 지은 이들’로 번역했으며, 단순한 범주 명칭인 ‘죄인들’보다 원문의 분사적 표현에 가깝습니다.
