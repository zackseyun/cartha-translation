  text: 그가 죄를 지은 이들이 아니라면 누구에게 죄를 용서하겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφήσει
  english_pob_choice: will he forgive
  chosen_korean: 용서하실
  alternatives_korean:
  - 사하실
  - 용서하시겠
  lexicon: BDAG
  rationale: 죄와 결합된 ἀφίημι의 미래형은 관계적·인격적 의미의 ‘용서하다’로 옮기는 것이 가장 자연스럽고, 한국어 합쇼체에서도 직접적입니다.
- source_word: τίνι
  english_pob_choice: to whom
  chosen_korean: 누구입니까
  alternatives_korean:
  - 누구에게입니까
  - 누구에게
  lexicon: BDAG
  rationale: 뒤의 ‘용서하다’와 함께 한국어에서는 ‘누구에게 용서하십니까’보다 ‘누구입니까’로 물으면 더 자연스럽게 도치된 수사 의문문을 살릴 수 있습니다.
- source_word: τοῖς ἡμαρτηκόσι
  english_pob_choice: to those who have sinned
  chosen_korean: 죄를 지은 이들
  alternatives_korean:
  - 죄인들에게
  - 죄를 범한 이들에게
  lexicon: BDAG
  rationale: 완료분사 ἡμαρτηκόσι의 행위 결과를 살리면서도, 단순 호칭인 ‘죄인들’보다 ‘죄를 지은 이들’이 동작성과 시제를 더 잘 드러냅니다.
theological_decisions:
- issue: 수사 의문문의 힘
  chosen_reading: 용서가 실제로 죄를 지은 사람들에게 향한다는 수사적 질문으로 옮겼습니다.
  alternative_readings:
  - 단순 정보 질문처럼 평이하게 옮기는 해석
  - 더 직접적인 선언문 형태로 바꾸는 해석
  rationale: 본문은 대답을 요구하기보다 자명한 논리를 강조하는 수사 의문문이므로, 한국어에서도 그 긴장과 강조를 유지해야 합니다.
  doctrine_reference: 본문 차원의 수사법 보존
- issue: 죄의 대상 표현
  chosen_reading: ‘죄를 지은 이들’로 구체화했습니다.
  alternative_readings:
  - ‘죄인들’
  - ‘죄를 범한 자들’
  rationale: 원문의 완료분사는 단순 범주보다 행위 이력을 드러내므로, 용서의 대상이 실제로 죄를 지은 사람들임을 분명히 하면서도 과도한 교리화를 피합니다.
  doctrine_reference: 완료분사 해석
