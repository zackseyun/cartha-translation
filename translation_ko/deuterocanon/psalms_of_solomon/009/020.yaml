  source_fidelity: ‘주님의 자비’는 τοῦ κυρίου ἐλεημοσύνη를 정확히 옮깁니다. 그러나 εἰς τὸν αἰῶνα καὶ ἔτι의 καὶ ἔτι가 ‘영원히’에 흡수되어 본문의 추가 강조가 본문에서 사라집니다. ‘영원히, 그 너머까지’는 그 강조를 보존하면서도 단정적인 신학적 해석을 더하지 않습니다.
  naturalness: ‘이스라엘 집 위에 … 있습니다’는 그리스어 전치사 이미지를 지나치게 직역하여 현대 표준 한국어에서는 다소 어색합니다. ‘이스라엘 집에 … 임합니다’가 자비가 이스라엘에게 미치고 머문다는 뜻을 자연스럽고 격식 있게 전달합니다.
  terminology: ‘주님’, ‘자비’, ‘이스라엘 집’은 적절합니다. ‘임합니다’는 ἐπʼ의 공간적·방향적 이미지를 유지하는 안전한 한국어 표현입니다.
