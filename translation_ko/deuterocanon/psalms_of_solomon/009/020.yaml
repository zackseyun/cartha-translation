  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/009/020.yaml
  text: The Lord's mercy is upon the house of Israel forevermore.
  footnotes:
  - marker: a
    text: Or 'forever and beyond,' preserving the fuller force of the Greek phrase.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님의 자비가 이스라엘 집 위에 영원히 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘영원과 그 이상’의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ κυρίου
  english_pob_choice: The Lord's
  chosen_korean: 주님의
  alternatives_korean:
  - 주님의 것인
  - 주의
  lexicon: BDAG
  rationale: 소유격 관계를 자연스럽게 살리면서 κύριος의 기본 대응인 ‘주님’을 사용했습니다.
- source_word: ἐλεημοσύνη
  english_pob_choice: mercy
  chosen_korean: 자비
  alternatives_korean:
  - 긍휼
  - 은혜
  - 친절
  lexicon: BDAG
  rationale: 이 단어는 단순한 친절보다 하나님의 자비로운 태도와 행위를 가리키므로, 한국어에서는 ‘자비’가 가장 직접적이고 신학적 무게도 잘 드러냅니다.
- source_word: ἡ ἐπʼ οἶκον Ἰσραὴλ
  english_pob_choice: is upon the house of Israel
  chosen_korean: 이스라엘 집 위에
  alternatives_korean:
  - 이스라엘 집에 임하여
  - 이스라엘 집에
  - 이스라엘의 집 위에
  lexicon: BDAG
  rationale: 전치사 ἐπʼ의 위에/향하여의 이미지를 살려, 언약적 대상인 ‘이스라엘 집’ 위에 머무는 복을 표현했습니다.
- source_word: εἰς τὸν αἰῶνα καὶ ἔτι
  english_pob_choice: forevermore
  chosen_korean: 영원히
  alternatives_korean:
  - 영원히 그리고 더
  - 영원하고 또
  - 영원히, 그 이상까지
  lexicon: BDAG
  rationale: 그리스어는 단순한 영속을 넘어 ‘그리고 더’의 강조가 있으나, 한국어에서는 문맥상 자연스러운 ‘영원히’로 그 지속성을 충분히 전달했습니다.
theological_decisions:
- issue: ‘하나님의 언약적 자비’의 지속성 표현
  chosen_reading: 이스라엘 집 위에 머무는 주님의 자비가 끝없이 계속된다는 뜻으로 읽었습니다.
  alternative_readings:
  - 이스라엘을 향한 주님의 호의가 지속된다는 일반적 의미
  - 이스라엘 집에 대한 보호와 돌보심의 지속
  rationale: 본문은 단순한 감정이 아니라 주님의 지속적이고 언약적인 자비를 말하므로, 이를 약화시키지 않도록 ‘자비’와 ‘위에’를 함께 살렸습니다.
  doctrine_reference: 하나님의 신실하심과 언약적 긍휼
