  - marker: b
    text: δικαιοσύνη는 여기서 ‘의’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘우리의 불법한 행위와 관련하여/대하여’라는 뜻으로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  english_pob_choice: so that
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 그리하여
  - ~하도록
  lexicon: BDAG
  rationale: 목적/결과를 나타내는 ἵνα의 흐름을 한국어에서는 문맥상 자연스러운 결과 도입어로 옮겼습니다.
- source_word: δικαιωθῇς
  english_pob_choice: may be vindicated
  chosen_korean: 의로우심이 입증되게 하십시오
  alternatives_korean:
  - 변호되게 하십시오
  - 정당하심이 인정되게 하십시오
  - 의롭다 하심을 받게 하십시오
  lexicon: BDAG
  rationale: 하나님이 변화되는 것이 아니라 드러나고 인정되는 의미이므로, ‘입증되다’로 옮겨 사법적·증거적 뉘앙스를 살렸습니다.
- source_word: ἐν ταῖς ἀνομίαις ἡμῶν
  english_pob_choice: amid our lawless deeds
  chosen_korean: 우리의 불법한 행위 가운데서도
  alternatives_korean:
  - 우리의 불법 속에서
  - 우리의 무법한 행위 가운데
  - 우리의 죄악 가운데
  lexicon: BDAG
  rationale: ἀνομίαι는 단순한 일반적 죄보다 ‘불법/무법’의 성격이 강하므로 이를 살렸고, ἐν의 위치 관계를 ‘가운데서도’로 자연스럽게 반영했습니다.
theological_decisions:
- issue: 하나님을 향한 직설적 청원에서의 호칭과 어조
  chosen_reading: ‘주 하나님’과 명령형 청원 ‘하십시오’를 사용해 기도문체를 유지했습니다.
  alternative_readings:
  - ‘오 하나님’
  - ‘드러나게 하소서’
  rationale: 본문은 하나님께 직접 말하는 탄원시이므로 존칭적 청원 어조가 적절합니다. 동시에 현대 합쇼체를 유지해 공적 낭독에도 자연스럽게 했습니다.
  doctrine_reference: 기도·시편 번역의 문체 보존 원칙
