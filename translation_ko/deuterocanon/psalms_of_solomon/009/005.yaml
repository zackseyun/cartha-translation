lexical_decisions:
- source_word: κρυβήσεται
  english_pob_choice: will be hidden
  chosen_korean: 숨겨지지 않을 것입니다
  alternatives_korean:
  - 감춰지지 않을 것입니다
  - 은폐되지 않을 것입니다
  lexicon: BDAG
  rationale: 수동 미래의 ‘숨겨지다’ 의미를 그대로 살리되, 하나님 앞에서 드러남/숨김의 이미지를 자연스러운 한국어로 옮겼습니다.
- source_word: ἀπὸ τῆς γνώσεώς σου
  english_pob_choice: from your knowledge
  chosen_korean: 주님의 지식에서
  alternatives_korean:
  - 주님의 아심에서
  - 주님의 인식에서
  lexicon: BDAG
  rationale: γνῶσις의 기본 의미인 ‘지식’을 유지해 원문의 인지적 범위를 보존했습니다. 문맥상 하나님 자신의 아심을 가리키므로 ‘주님의’로 옮겼습니다.
- source_word: πᾶς ποιῶν ἄδικα
  english_pob_choice: everyone who does unjust deeds
  chosen_korean: 불의한 행위를 하는 사람은 아무도
  alternatives_korean:
  - 불의한 일을 하는 사람은 누구도
  - 불의를 행하는 자는 누구도
  lexicon: BDAG
  rationale: πᾶς ποιῶν의 보편성을 ‘아무도’로 살리고, ἄδικα를 ‘불의한 행위’로 옮겨 이 장 전체의 δίκαιος/ἄδικος 어휘 연계를 유지했습니다.
- source_word: ἄδικα
  english_pob_choice: unjust deeds
  chosen_korean: 불의한 행위
  alternatives_korean:
  - 불의한 일
  - 부정한 행위
  lexicon: BDAG
  rationale: 이 절의 주제어가 ‘의/불의’ 대조이므로 일반적인 ‘잘못’보다 ‘불의한 행위’가 원문의 משפט적·언약적 뉘앙스를 더 잘 보존합니다.
theological_decisions:
- issue: πᾶς ποιῶν ἄδικα의 보편성과 문맥적 긴장
  chosen_reading: ‘아무도 숨겨지지 않을 것입니다’로 보편적 부정을 살리면서, 불의 행위자 전체가 하나님의 지식 앞에서 드러난다는 뜻을 분명히 했습니다.
  alternative_readings:
  - ‘불의한 행위를 하는 모든 사람은 숨겨지지 않을 것입니다’
  - ‘불의를 행하는 자는 누구도 숨을 수 없습니다’
  rationale: 원문의 보편 표현을 약화하지 않으면서도 한국어에서 자연스러운 부정 문장으로 정리했습니다.
  doctrine_reference: 하나님의 전지와 심판의 보편성
