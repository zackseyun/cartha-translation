  text: He will cleanse a soul in sins by confession, by open acknowledgment.
translation:
  language: ko
  text: 그는 죄 가운데 있는 한 영혼을 고백으로, 곧 드러내어 인정함으로 깨끗하게 하실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘드러내어 인정함’은 ἐξαγορίαις의 공개적·표출적 뉘앙스를 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθαρίσει
  english_pob_choice: He will cleanse
  chosen_korean: 깨끗하게 하실 것입니다
  alternatives_korean:
  - 정결하게 하실 것입니다
  - 씻어 주실 것입니다
  lexicon: καθαρίζω
  rationale: 미래 능동의 정화 행위를 자연스러운 현대 한국어로 옮기되, 죄와 연결된 정결의 뜻이 사라지지 않도록 했습니다.
- source_word: ἐν ἁμαρτίαις
  english_pob_choice: in sins
  chosen_korean: 죄 가운데 있는
  alternatives_korean:
  - 죄들 안에 있는
  - 죄 속에 있는
  lexicon: ἁμαρτία
  rationale: 영어 POB의 ‘in sins’를 따라, 죄에서 벗어난 상태가 아니라 죄의 영역/상태 안에 있음을 드러내는 표현으로 옮겼습니다.
- source_word: ἐν ἐξομολογήσει
  english_pob_choice: by confession
  chosen_korean: 고백으로
  alternatives_korean:
  - 시인함으로
  - 자백으로
  lexicon: ἐξομολόγησις
  rationale: 죄를 인정하고 시인하는 행위를 한국어에서 가장 직접적으로 드러내는 ‘고백’이 문맥상 적절합니다.
- source_word: ἐν ἐξαγορίαις
  english_pob_choice: by open acknowledgment
  chosen_korean: 드러내어 인정함으로
  alternatives_korean:
  - 공개적인 인정으로
  - 분명히 시인함으로
  lexicon: ἐξαγορεύω
  rationale: 단순한 내적 고백보다 더 공개적으로 밖으로 드러내는 뉘앙스를 살리기 위해 ‘드러내어 인정함’으로 풀었습니다.
theological_decisions:
- issue: 죄 가운데 있는 상태와 고백의 관계
  chosen_reading: 정화는 죄가 제거된 상태에서가 아니라 죄 가운데 있는 자가 죄를 고백하고 드러내어 인정할 때 이루어집니다.
  alternative_readings:
  - 죄에서 벗어나기 위한 일반적 회개 교훈으로 완화하는 읽기
  - ‘죄에서’로 옮겨 정화의 대상을 죄 자체로 돌리는 읽기
  rationale: 헬라어 본문과 영어 POB는 정화의 장소/상태를 ‘in sins’로 유지하므로, 그 긴장을 보존하는 번역이 필요합니다.
  doctrine_reference: 회개와 고백에 관한 시편적/지혜문학적 표현의 문맥 보존
- issue: 두 개의 전치사구 병렬
  chosen_reading: ‘고백으로, 곧 드러내어 인정함으로’로 병렬을 살려 두 표현이 서로 보강하는 구조로 제시했습니다.
  alternative_readings:
  - 두 표현을 하나로 합쳐 단일 의미로 처리하는 읽기
  - 둘 사이의 차이를 약화시키는 번역
  rationale: ἐν ἐξομολογήσει와 ἐν ἐξαγορίαις는 의미가 겹치지만 동일하지 않으므로, 반복을 살린 병렬 번역이 본문의 수사와 의미를 더 잘 보존합니다.
  doctrine_reference: 본문의 수사 구조 보존
