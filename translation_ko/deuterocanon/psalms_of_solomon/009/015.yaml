    rationale: 문맥상 죄지은 일에 대해 답변을 요구하거나 책임을 묻지 않는다는 뜻이므로 ‘책임을 묻지 않으십니다’가 더 충실합니다.
  - severity: high
    issue: ‘회개하며 죄짓는 자들’은 회개하면서 계속 죄를 짓는다는 의미로 읽힐 수 있습니다.
