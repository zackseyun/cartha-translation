  verdict: revise
  source_fidelity: 첫 동사 εὐλογήσεις는 미래형이므로 현행 ‘복 주십니다’는 미래의 축복이라는 시제 정보를 잃습니다. οὐκ εὐθύνεις는 현재형이며, 여기서는 단순한 ‘책망’보다 죄에 관하여 책임을 추궁하거나 답변을 요구한다는 사법적 의미가 적절합니다. 마지막 구는 하나님의 선하심이 μεταμέλεια(회개/후회)와 관련된 죄인들에게 향한다는 뜻으로 보존해야 하며, ‘회개하며 죄짓는’은 회개하는 동안 죄를 짓는다는 부자연스러운 뜻을 낳습니다.
  naturalness: 합쇼체와 현대 표준어에 맞추어 미래형은 ‘복을 주실 것입니다’로, 책임 추궁은 ‘책임을 묻지 않으십니다’로 옮기는 것이 자연스럽습니다. ‘회개하는 죄인들’은 원문의 긴밀한 결합을 한국어에서 오해 없이 전달합니다.
  terminology: δικαίους는 ‘의인들’, εὐλογήσεις는 ‘복을 주실 것입니다’, εὐθύνεις는 ‘책임을 묻지 않으십니다’가 적절합니다. μεταμέλεια의 회개와 후회의 의미 범위는 각주에서 유지합니다.
  issues:
  - severity: medium
    issue: εὐλογήσεις의 미래형이 ‘복 주십니다’라는 현재형으로 번역되었습니다.
