- from: 의인들을 복 주십니다. 그리고 그들이 죄지은 일에 대하여는 그들을 책망하지 않으십니다. 그리고 당신의 선하심은 회개하며 죄짓는 자들에게 있습니다.[a][b]
  to: 당신께서는 의인들에게 복을 주실 것입니다. 또 그들이 죄를 지은 일에 관하여 그들에게 책임을 묻지 않으십니다. 당신의 선하심은 회개하는 죄인들에게 미칩니다.[a][b]
  rationale: 미래형 εὐλογήσεις와 현재형 οὐκ εὐθύνεις의 시제 대비를 보존하고, εὐθύνω의 문책·책임 추궁 의미를 정확히 반영했습니다. 마지막 구는 한국어에서 발생하는 ‘회개하며 죄짓는’이라는 의미상 충돌을 피하면서도, μεταμέλεια의 회개/후회 범위는 각주로 남겼습니다.
