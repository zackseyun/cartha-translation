base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/009/015.yaml
  text: You will bless the righteous[a], and you do not call them to account for the things in which they sinned[c][b]; and your goodness is toward those who sin in repentance.
  footnotes:
  - marker: a
    text: Or 'with repentance'; the phrase may also carry the sense of remorse or regret.
    reason: lexical_alternative
  - marker: b
    text: Or 'you will not call them to account'.
    reason: previous_rendering
  - marker: c
    text: Or 'for the things they sinned in; and your goodness is toward those who sin in repentance.'.
    reason: previous_rendering
translation:
  language: ko
  text: 당신께서는 의인들에게 복을 주실 것입니다. 또 그들이 죄를 지은 일에 관하여 그들에게 책임을 묻지 않으십니다. 당신의 선하심은 회개하는 죄인들에게 미칩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “회개 가운데서”입니다. μεταμέλεια는 회개뿐 아니라 후회나 뉘우침의 뉘앙스도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 첫 동사 “복을 주실 것입니다”는 미래형이지만, “책임을 묻지 않으십니다”에 해당하는 동사는 현재형입니다.
    reason: source_note
lexical_decisions:
- source_word: δικαίους
  english_pob_choice: the righteous
  chosen_korean: 의인들
  alternatives_korean:
  - 의로운 사람들
  - 의롭다 함을 받은 사람들
  lexicon: BDAG
  rationale: 본문에서는 형용사가 명사처럼 쓰여 의인 집단을 가리키므로, 한국어에서도 간명한 명사형인 「의인들」이 가장 자연스럽습니다.
- source_word: εὐλογήσεις
  english_pob_choice: you will bless
  chosen_korean: 복 주십니다
  alternatives_korean:
  - 복을 주실 것입니다
  - 축복하십니다
  lexicon: BDAG
  rationale: 미래형의 약속을 살리면서도 한국어 합쇼체에 맞게 현재형 존대 서술로 옮겼습니다. 「복 주십니다」는 언약적 축복의 뉘앙스를 유지합니다.
- source_word: οὐκ εὐθύνεις
  english_pob_choice: you do not call them to account
  chosen_korean: 그들을 책망하지 않으십니다
  alternatives_korean:
  - 그들을 심문하지 않으십니다
  - 그들을 حساب에 올리지 않으십니다
  - 그들을 따져 묻지 않으십니다
  lexicon: BDAG
  rationale: 여기서는 ‘곧게 하다’의 직역보다 죄에 대해 책임을 묻지 않는다는 사법적 뉘앙스가 중요하므로, 자연스러운 한국어로 「책망하지 않으십니다」를 택했습니다.
- source_word: ἐν μεταμελείᾳ
  english_pob_choice: in repentance
  chosen_korean: 회개하며
  alternatives_korean:
  - 회개의 마음으로
  - 후회하며
  - 유감 속에서
  lexicon: BDAG
  rationale: μεταμέλεια는 후회/회심의 뉘앙스를 함께 가질 수 있으므로, 한국어에서는 회개 동작을 드러내되 ‘후회’의 여운도 남는 「회개하며」로 옮겼습니다.
theological_decisions:
- issue: 죄와 회개의 관계를 어떻게 드러낼지
  chosen_reading: 하나님의 선하심은 죄를 짓는 자들 가운데서도 회개하는 이들에게 향합니다.
  alternative_readings:
  - 하나님의 선하심은 회개한 죄인들에게 있습니다
  - 하나님의 선하심은 회개 속에 죄짓는 자들에게 있습니다
  rationale: 본문의 마지막 구는 죄를 가볍게 여기지 않으면서도, 회개와 연결된 죄인에게 향하는 하나님의 선하심을 말합니다. 한국어에서는 ‘회개하며 죄짓는 자들’로 연결해 그 긴장을 살렸습니다.
  doctrine_reference: 회개와 자비의 병행, 시적-지혜적 문맥의 죄책 처리
- issue: εὐθύνεις의 시제/의미 처리
  chosen_reading: 현재형의 지속적 진술로 옮겨, 하나님이 죄를 묻지 않으시는 지속적 성품을 드러냈습니다.
  alternative_readings:
  - 미래형으로 옮겨 ‘그들을 책망하지 않을 것입니다’라고 할 수 있음
  - 단회적 선언으로 볼 수 있음
  rationale: 본문은 εὐλογήσεις는 미래형이지만 εὐθύνεις는 현재형이어서, 축복의 약속과 책임 추궁의 부정이 대조됩니다. 한국어에서도 현재 존대형으로 그 대비를 보존했습니다.
  doctrine_reference: 헬라어 시제-상 대비와 하나님의 지속적 성품
