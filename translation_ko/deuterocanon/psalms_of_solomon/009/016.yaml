base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/009/016.yaml
  text: And now you are God, and we are your people whom you loved. Look and have compassion, O God of Israel, because we are yours; and do not withdraw your mercy from us, lest they attack us.
translation:
  language: ko
  text: 이제 주님, 주는 하나님이시며 우리는 주께서 사랑하신 주의 백성입니다. 보시고 불쌍히 여기십시오, 이스라엘의 하나님이시여. 우리는 주의 것이니, 주의 자비를 우리에게서 거두지 마십시오. 그러면 그들이 우리를 공격할 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “이제”이며, 시작부의 전환 표지를 드러냅니다.
    reason: source_note
  - marker: b
    text: 원문의 ἀφʼ ἡμῶν은 “우리에게서/우로부터”의 분리를 뜻합니다.
    reason: source_note
  - marker: c
    text: 영어 POB의 개정 전 표현에는 “come against us”가 있었지만, 최종 확정본은 “attack us”입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: σύ ὁ θεός
  english_pob_choice: you are God
  chosen_korean: 주는 하나님이십니다
  alternatives_korean:
  - 당신은 하나님이십니다
  - 주께서 하나님이십니다
  lexicon: θεός → 하나님
  rationale: 직설적 신앙고백을 자연스러운 합쇼체로 옮기되, 선언적 문장 구조를 유지했습니다.
- source_word: λαὸς σοῦ ὃν ἠγάπησας
  english_pob_choice: your people whom you loved
  chosen_korean: 주께서 사랑하신 주의 백성
  alternatives_korean:
  - 주께서 사랑하신 당신의 백성
  - 주께서 사랑하신 주의 ժողովուրդ
  lexicon: λαός → 백성; ἀγαπάω → 사랑하다
  rationale: λαός는 집단 정체성을 드러내는 ‘백성’이 가장 직접적이며, ἠγάπησας는 하나님의 선행적 사랑을 분명히 드러내도록 옮겼습니다.
- source_word: ἴδε καὶ οἰκτείρησον
  english_pob_choice: Look and have compassion
  chosen_korean: 보시고 불쌍히 여기십시오
  alternatives_korean:
  - 보시고 긍휼히 여기십시오
  - 살피시고 불쌍히 여기십시오
  lexicon: οἰκτείρω → 불쌍히 여기다
  rationale: 호소문맥을 살리면서도 ‘compassion’을 한국어에서 가장 직관적으로 드러내는 표현을 택했습니다.
- source_word: ἐπιθῶνται ἡμῖν
  english_pob_choice: they attack us
  chosen_korean: 그들이 우리를 공격할 것입니다
  alternatives_korean:
  - 그들이 우리를 덮칠 것입니다
  - 그들이 우리에게 달려들 것입니다
  lexicon: ἐπιτίθημι → 공격하다
  rationale: POB의 최종 확정어인 ‘attack’을 따라, 적대적 침공/습격의 의미를 분명하게 전달했습니다.
theological_decisions:
- issue: 이스라엘의 하나님에 대한 호칭과 직접 호소의 존칭
  chosen_reading: ‘이스라엘의 하나님이시여’로 직접 호칭을 살리고, 이어지는 청원은 합쇼체 명령형으로 유지했습니다.
  alternative_readings:
  - ‘이스라엘의 하나님’
  - ‘오 하나님, 이스라엘의 하나님’
  rationale: 원문의 호격적 부름과 간구의 긴박성을 보존하면서도 한국어 기도문체의 자연스러움을 살렸습니다.
  doctrine_reference: 예배적 호칭의 문체 유지
- issue: ‘주의 자비’를 거두지 말라는 청원
  chosen_reading: ἔλεός σου를 ‘주의 자비’로 두고 ‘거두지 마십시오’로 번역했습니다.
  alternative_readings:
  - ‘주의 긍휼’
  - ‘주의 인자하심’
  rationale: 자비의 지속적 임재가 위협 상황의 생존 조건이라는 점을 드러내기 위해, 자비를 단순 감정이 아니라 실제적 보호로 이해하는 표현을 택했습니다.
  doctrine_reference: 하나님의 자비와 보존
