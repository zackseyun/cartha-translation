  naturalness: 수정문은 현대 표준어 합쇼체 기도문으로 자연스럽습니다. 호격을 문두에 두어 ‘보시고 불쌍히 여기십시오’의 직접 호소도 매끄럽게 했습니다.
  terminology: θεός는 ‘하나님’, λαός는 ‘백성’, ἔλεος는 ‘자비’, ἐπιτίθημι는 문맥상 ‘공격하다’로 옮겼습니다. 원문에 없는 ‘주님’ 호칭은 제거했습니다.
