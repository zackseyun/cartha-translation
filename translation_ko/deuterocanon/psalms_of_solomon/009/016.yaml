    rationale: ‘그러면 그들이 우리를 공격할 것입니다’는 조건의 결과를 말하지만, 원문은 자비를 거두지 말라는 청원의 목적 또는 우려, 곧 ‘그들이 공격하지 않도록/공격할까 하여’를 나타냅니다.
