  chosen_korean: 선택
  alternatives_korean:
  - 선정
  - 결정
  lexicon: LSJ
  rationale: 문맥상 예정론적 ‘택하심’이 아니라 인간의 도덕적 선택을 가리키므로, 가장 직접적인 ‘선택’으로 옮겼습니다.
- source_word: ἐξουσίᾳ
