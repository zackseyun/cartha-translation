base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/009/007.yaml
  text: Our deeds are within the choice and power of our soul[d][c][b][a], to do righteousness and unrighteousness with the works of our hands.
  footnotes:
  - marker: a
    text: Or 'authority' instead of 'power.'
    reason: lexical_alternative
  - marker: b
    text: Or 'justice' instead of 'righteousness.'
    reason: lexical_alternative
  - marker: c
    text: Literally, 'by the works of our hands.'
    reason: lexical_alternative
  - marker: d
    text: Or 'and also injustice'.
    reason: previous_rendering
translation:
  language: ko
  text: 우리의 행위는 우리 영혼의 선택과 권한 안에 있으니, 곧 우리 손의 행위로 의를 행하고 불의를 행할 수 있습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘권한’은 여기서 ‘권세’보다 내적 행위 가능성과 주도권을 더 분명히 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘불의’는 δικαιοσύνην과의 대칭을 살린 번역이며, ‘불의함’보다 간결합니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘우리 손의 행위로’입니다.
    reason: source_note
lexical_decisions:
- source_word: ἔργα
  english_pob_choice: deeds
  chosen_korean: 행위
  alternatives_korean:
  - 일
  - 행동
  - 업적
  lexicon: BDAG
  rationale: 도덕적 의미를 지닌 구체적 행동을 자연스러운 한국어로 옮기되, 단순한 결과물보다 책임 있는 행위를 드러내기 위해 선택했습니다.
- source_word: ἐκλογῇ
  english_pob_choice: choice
  chosen_korean: 선택
  alternatives_korean:
  - 선정
  - 결정
  lexicon: LSJ
  rationale: 문맥상 예정론적 ‘택하심’이 아니라 인간의 도덕적 선택을 가리키므로, 가장 직접적인 ‘선택’으로 옮겼습니다.
- source_word: ἐξουσίᾳ
  english_pob_choice: power
  chosen_korean: 권한
  alternatives_korean:
  - 권세
  - 힘
  - 통제
  lexicon: BDAG
  rationale: 단순한 능력보다 실제로 행할 수 있는 내적 주도권과 허용된 작동 범위를 함께 담기 위해 ‘권한’을 택했습니다.
- source_word: ψυχῆς
  english_pob_choice: soul
  chosen_korean: 영혼
  alternatives_korean:
  - 자기
  - 생명
  - 마음
  lexicon: BDAG
  rationale: 원문이 분명히 ψυχή를 사용하므로, 내적 도덕 주체를 드러내는 ‘영혼’으로 비교적 직역했습니다.
- source_word: ἔργοις χειρῶν ἡμῶν
  english_pob_choice: by the works of our hands
  chosen_korean: 우리 손의 행위로
  alternatives_korean:
  - 우리 손으로 하는 일로
  - 우리 손의 일로
  lexicon: LSJ
  rationale: 손의 구체적 이미지를 살리면서 한국어 문장 흐름에 맞게 도구격으로 풀어, 인간 행위의 물질적·실천적 측면을 유지했습니다.
- source_word: ἀδικίαν
  english_pob_choice: unrighteousness
  chosen_korean: 불의
  alternatives_korean:
  - 불의함
  - 불의한 일
  - 의롭지 않음
  lexicon: BDAG
  rationale: δικαιοσύνην과의 대응을 살리면서도 한국어에서 더 자연스럽고 무게감 있는 반대말로 ‘불의’를 선택했습니다.
theological_decisions:
- issue: 인간의 도덕적 책임과 능동성이 매우 강하게 강조됩니다.
  chosen_reading: ‘선택과 권한’으로 ἐκλογῇ καὶ ἐξουσίᾳ를 옮겨, 영혼이 의와 불의를 실제로 행할 수 있는 주체적 능력을 드러냈습니다.
  alternative_readings:
  - 선택과 힘
  - 선택과 권세
  - 결정과 통제
  rationale: 본문은 허용만이 아니라 인간의 실제 도덕 행위 능력을 말하므로, 그 긴장을 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 인간 책임과 도덕적 행위 능력
