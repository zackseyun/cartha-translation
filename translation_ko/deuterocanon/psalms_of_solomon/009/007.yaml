  source_fidelity: 원문의 핵심 대구인 ἐκλογῇ καὶ ἐξουσίᾳ 및 δικαιοσύνην/ἀδικίαν은 대체로 충실히 반영되었습니다. 그러나 ἐξουσίᾳ를 ‘권한’으로만 옮기면 외부에서 부여된 허가·직권이라는 뜻이 강해져, 본문이 말하는 도덕적 행위의 실제 능력 또는 통제력을 충분히 나타내지 못합니다. 또한 ‘우리 손의 행위로 … 행하다’는 원문의 반복을 기계적으로 재현하여 한국어에서 부자연스럽습니다.
  naturalness: ‘우리 영혼의 선택과 능력에 달려 있으니’와 ‘우리 손으로 의와 불의를 행할 수 있습니다’는 합쇼체의 현대 표준 한국어로 자연스럽고, 원문의 인간 도덕 행위 주체성도 보존합니다.
  terminology: ψυχή는 ‘영혼’, δικαιοσύνη/ἀδικία의 대구는 ‘의/불의’로 유지하는 것이 적절합니다. ἐξουσία는 이 문맥에서 ‘능력’이 가장 자연스럽고, ‘권한’은 가능한 어휘 범주를 각주에서 제시할 수 있습니다.
