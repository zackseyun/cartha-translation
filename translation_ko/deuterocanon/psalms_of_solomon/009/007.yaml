lexical_decisions:
- source_word: ἔργα
  english_pob_choice: deeds
  chosen_korean: 행위
  alternatives_korean:
  - 일
  - 행동
  - 업적
  lexicon: BDAG
  rationale: 도덕적 의미를 지닌 구체적 행동을 자연스러운 한국어로 옮기되, 단순한 결과물보다 책임 있는 행위를 드러내기 위해 선택했습니다.
- source_word: ἐκλογῇ
