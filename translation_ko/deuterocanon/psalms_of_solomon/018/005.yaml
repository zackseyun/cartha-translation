base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/018/005.yaml
  text: to turn a teachable soul away from foolishness in ignorance[a][b][c].
  footnotes:
  - marker: a
    text: Or “an obedient soul” or “a soul ready to listen.”
    reason: lexical_alternative
  - marker: b
    text: The Greek distinguishes ἀμαθία and ἀγνοία; the line combines the ideas of foolishness and ignorance rather than merely repeating the same word.
    reason: lexical_alternative
  - marker: c
