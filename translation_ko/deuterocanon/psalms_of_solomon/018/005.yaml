    reason: previous_rendering
translation:
  language: ko
  text: 어리석음에서 지각이 없는 상태로부터 벗어나도록 가르치려는, 가르침을 잘 받는 영혼을 향하여[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “순종하는 영혼” 혹은 “잘 들으려는 영혼”으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ἀμαθία와 ἀγνοία를 구별하므로, 이 행은 단순 반복이 아니라 ‘어리석음’과 ‘무지’를 함께 말합니다.
    reason: theological_note
  - marker: c
    text: 또는 “받아들이기 쉬운”으로도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ἀποστρέψαι
  english_pob_choice: to turn away
  chosen_korean: 벗어나도록 가르치려는
  alternatives_korean:
  - 돌이키려는
  - 돌려놓으려는
  - 멀어지게 하려는
  lexicon: LSJ
  rationale: ἀπό의 방향성을 살려 어떤 상태에서 떨어져 나가게 하는 뜻을 반영했습니다. 한국어에서는 목적/의도 표현으로 자연스럽게 풀어 쓰는 편이 원문의 동작성을 잘 보존합니다.
- source_word: ψυχὴν εὔκοον
  english_pob_choice: a teachable soul
  chosen_korean: 가르침을 잘 받는 영혼
  alternatives_korean:
  - 순종하는 영혼
  - 받아들이기 쉬운 영혼
  - 가르침에 열려 있는 영혼
  lexicon: LSJ
  rationale: εὔκοος의 핵심은 ‘잘 듣는, 가르침을 잘 받는’ 태도이므로, 한국어에서는 ‘가르침을 잘 받는’으로 옮겨 수동적 감수성이 아니라 교육 가능한 내적 태도를 살렸습니다.
- source_word: ἀμαθίας
  english_pob_choice: foolishness
  chosen_korean: 어리석음
  alternatives_korean:
  - 무지
  - 어리석은 상태
  - 무분별
  lexicon: LSJ
  rationale: 이 절에는 이미 ἀγνοίᾳ(무지/모름)가 함께 있으므로 ἀμαθία를 다시 ‘무지’로 옮기면 구별이 사라집니다. 따라서 도덕적·지적 결핍을 함께 담는 ‘어리석음’이 가장 적절합니다.
- source_word: ἐν ἀγνοίᾳ
  english_pob_choice: in ignorance
  chosen_korean: 지각이 없는 상태로부터
  alternatives_korean:
  - 무지 가운데
  - 모른 채
  - 지식이 없는 가운데
  lexicon: LSJ
  rationale: ἐν ἀγνοίᾳ를 단순히 ‘무지 가운데’로 옮기면 ἀμαθίας와의 차이가 약해질 수 있어, ‘지각이 없는 상태’로 풀어 두 어휘의 중첩을 드러냈습니다.
theological_decisions:
- issue: ἀμαθία와 ἀγνοία의 이중 표현을 한국어에서 어떻게 유지할지
  chosen_reading: ‘어리석음’과 ‘지각이 없는 상태’로 나누어, 단순 반복이 아니라 도덕적 어리석음과 인지적 무지를 함께 드러냈습니다.
  alternative_readings:
  - ‘무지’와 ‘무지’로 평행하게 옮김
  - ‘어리석음 가운데 무지’처럼 더 직역함
  rationale: 영문 POB 주석이 지적하듯 그리스어는 두 개념을 구별합니다. 한국어도 같은 차이를 보존해야 원문의 수사와 의미 긴장이 살아납니다.
  doctrine_reference: 지혜문학적/윤리적 인간 이해
- issue: εὔκοον의 태도 뉘앙스
  chosen_reading: ‘가르침을 잘 받는’으로 옮겨, 단순한 순종보다 훈련 가능성과 수용성을 함께 살렸습니다.
  alternative_readings:
  - ‘순종하는’
  - ‘받아들이기 쉬운’
  rationale: 본문의 목적은 영혼을 교정하고 돌이키는 것이므로, 단어가 지닌 ‘잘 듣는’ 의미를 살리되 한국어에서 과도한 종교적 관용구로 굳어지지 않게 했습니다.
  doctrine_reference: 지혜와 훈계에 대한 성서적 인간론
