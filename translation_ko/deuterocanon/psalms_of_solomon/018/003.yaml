source:
  edition: lxx-swete-1909
  text: τὰ ὦτά σου ἐπακούει εἰς δέησιν πτωχοῦ ἐν ἐλπίδι· τὰ κρίματά σου ἐπὶ πᾶσαν τὴν γῆν μετὰ ἐλέους,
  language: Greek
  pages:
