translation:
  language: ko
  text: 그분은 광명들을 그들의 행로 안에, 시간의 정해진 때들을 위하여, 날마다에서 날마다로 두셨으며, 그들은 그분이 그들에게 명하신 길에서 벗어나지 않았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διατάξας
  english_pob_choice: appointed
  chosen_korean: 두셨으며
  alternatives_korean:
  - 배치하셨으며
  - 정하셨으며
  - 임명하셨으며
  lexicon: BDAG
  rationale: 별과 광명체를 질서 있게 정해 놓은 뜻을 살리면서도, 천체 배열 문맥에 맞게 자연스러운 동사로 옮겼습니다.
- source_word: φωστῆρας
  english_pob_choice: the luminaries
  chosen_korean: 광명들
  alternatives_korean:
  - 빛들
  - 천체들
  - 광명체들
  lexicon: LSJ
  rationale: 시적·우주론적 문맥에서 하늘의 빛나는 존재들을 가리키는 표현으로, 직역성과 문체를 함께 살렸습니다.
- source_word: ἐν πορείᾳ
  english_pob_choice: in their course
  chosen_korean: 그들의 행로 안에
  alternatives_korean:
  - 그들의 진행 속에
  - 그들의 순행 안에
  - 그들의 행진 속에
  lexicon: LSJ
  rationale: 별들의 정해진 이동 경로라는 뜻을 반영하되, 현대 한국어에서 지나치게 기술적으로 들리지 않도록 했습니다.
- source_word: καιροὺς ὡρῶν
  english_pob_choice: the appointed times of the hours
  chosen_korean: 시간의 정해진 때들
  alternatives_korean:
  - 시각들의 정한 때들
  - 시간들의 계절들
  - 때맞춘 시간들
  lexicon: LSJ
  rationale: 직역하면 다소 어색하지만, ὡρῶν과 καιροὺς의 결합이 ‘정해진 시점들/시기들’의 질서를 말하므로 그 반복성과 정해짐을 드러냈습니다.
- source_word: παρέβησαν
  english_pob_choice: have not departed
  chosen_korean: 벗어나지 않았습니다
  alternatives_korean:
  - 떠나지 않았습니다
  - 일탈하지 않았습니다
  - 어기지 않았습니다
  lexicon: BDAG
  rationale: 천체가 길에서 ‘이탈하지 않았다’는 공간적·비유적 의미를 살려, 영문 POB의 현재완료 뉘앙스에 맞게 지속적 상태로 옮겼습니다.
