  yaml_path: translation/deuterocanon/psalms_of_solomon/018/011.yaml
  text: Great and glorious is our God[a], dwelling in the heights;
  footnotes:
  - marker: a
    text: Or "dwelling in the highest places" or "dwelling in the highest heavens."
