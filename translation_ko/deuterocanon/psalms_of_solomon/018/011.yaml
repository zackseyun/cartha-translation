lexical_decisions:
- source_word: μέγας
  english_pob_choice: great
  chosen_korean: 크고
  alternatives_korean:
  - 위대하고
  - 강대하고
  lexicon: BDAG
  rationale: 기본 의미인 ‘큰’의 차원을 살리되, 예배적 문맥에서 자연스럽게 읽히도록 ‘크고’로 옮겼습니다. ‘위대하고’는 평가를 더 강하게, ‘강대하고’는 힘의 뉘앙스를 더해 원문의 중립적 크기를 좁힐 수 있습니다.
- source_word: ἔνδοξος
  english_pob_choice: glorious
  chosen_korean: 영광스러우시며
  alternatives_korean:
  - 영광이 충만하시며
  - 존귀하시며
  lexicon: BDAG
  rationale: 찬양 문맥에서 하나님의 영광을 직접 드러내는 형용사로 이해하여 ‘영광스러우시며’로 옮겼습니다. ‘존귀하시며’도 가능하지만, 원문의 영광-찬양 연결이 약해질 수 있습니다.
- source_word: ἐν ὑψίστοις
  english_pob_choice: in the heights
  chosen_korean: 지극히 높은 곳에
  alternatives_korean:
  - 높은 곳에
  - 가장 높은 하늘들에
  lexicon: BDAG
  rationale: 영어 POB의 ‘in the heights’에 대응하되, 한국어에서는 자연스러운 공간 표현인 ‘지극히 높은 곳에’를 택했습니다. ‘가장 높은 하늘들에’는 해석을 더 앞세워 원문의 공간 이미지를 좁힐 수 있습니다.
- source_word: κατοικῶν
  english_pob_choice: dwelling
  chosen_korean: 거하십니다
  alternatives_korean:
  - 사십니다
  - 머무르십니다
  lexicon: BDAG
  rationale: 하나님의 지속적 거주를 나타내는 현재 분사로 이해하여, 한국어 성경에서 익숙하면서도 영속성을 담는 ‘거하십니다’를 사용했습니다.
theological_decisions:
- issue: 하나님을 지칭하는 관형 표현의 존대와 시제 감각
  chosen_reading: ‘우리의 하나님은 … 거하십니다’로 서술하되, 하나님께 대한 직접 존대는 종결어미 ‘-십니다’로 유지했습니다.
  alternative_readings:
  - ‘우리 하나님은 … 거하십니다’
  - ‘우리의 하나님은 … 계십니다’
  rationale: 원문의 찬양 진술을 현대 합쇼체로 자연스럽게 전달하면서, 하나님을 향한 경외를 문법적으로 분명히 했습니다. ‘계십니다’는 가능하지만, κατοικῶν의 ‘거주/거함’ 이미지를 덜 직접적으로 드러낼 수 있습니다.
  doctrine_reference: 하나님의 초월성과 임재
- issue: ὑψίστοις의 공간 이미지
  chosen_reading: ‘지극히 높은 곳’으로 처리해, 원문이 명시적으로 말하는 높음의 공간성을 보존했습니다.
  alternative_readings:
  - ‘하늘나라’
  - ‘하늘들’
  rationale: 원문은 ‘하늘’(οὐρανός)을 직접 말하지 않으므로, 특정 교리 용어로 미리 좁히지 않고 공간적 고양을 살렸습니다.
  doctrine_reference: 원문 우선 번역 원칙
