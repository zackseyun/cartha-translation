  yaml_path: translation/deuterocanon/psalms_of_solomon/018/002.yaml
  text: Your kindness is upon Israel like a rich gift[a]; your eyes look upon them[c][b], and none of them will be lacking.
  footnotes:
  - marker: a
    text: Or “like an abundant shelter over Israel.” The Greek image in “rich roof-covering” is somewhat compressed and poetic.
    reason: lexical_alternative
  - marker: b
    text: Or “there will be no lack among them.”
    reason: alternative_reading
  - marker: c
    text: Or 'like a rich roof-covering'.
    reason: previous_rendering
translation:
  language: ko
  text: 주의 인자하심이 풍성한 선물처럼 이스라엘 위에 있습니다. 주의 눈은 그들을 살피시며, 그들 가운데 하나도 부족함이 없을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들 가운데 부족함이 없을 것입니다.”
    reason: alternative_reading
lexical_decisions:
- source_word: χρηστότης
  english_pob_choice: kindness
  chosen_korean: 풍성한 은혜
  alternatives_korean:
  - 친절
  - 인자하심
  - 호의
  lexicon: BDAG
  rationale: χρηστότης는 단순한 성품 묘사보다 실제로 베푸는 선의와 자비를 가리키므로, 문맥상 ‘풍성한 은혜’가 가장 자연스럽고 신학적으로도 어긋나지 않습니다.
- source_word: ἐπὶ δόματος πλουσίου
  english_pob_choice: like a rich gift
  chosen_korean: 풍성한 선물처럼
  alternatives_korean:
  - 풍성한 선물 위에
  - 풍성한 선물로
  - 넉넉한 선물처럼
  lexicon: LSJ
  rationale: δόμα는 ‘선물’이므로 ‘선물’로 옮기고, ἐπὶ의 비유적 용법을 살려 ‘처럼’을 두어 압축된 시적 비교를 한국어로 풀었습니다.
- source_word: ἐπιβλέποντες
  english_pob_choice: look upon
  chosen_korean: 살피시며
  alternatives_korean:
  - 보시며
  - 주시하며
  - 돌보시며
  lexicon: BDAG
  rationale: 동사는 단순 응시보다 주의 깊게 바라보는 의미가 강하므로, 시적 문맥에서 ‘살피시며’가 눈의 attentive looking을 잘 살립니다.
- source_word: οὐχ ὑστερήσει ἐξ αὐτῶν
  english_pob_choice: none of them will be lacking
  chosen_korean: 그들 가운데 하나도 부족함이 없을 것입니다
  alternatives_korean:
  - 그들 가운데 아무도 모자라지 않을 것입니다
  - 그들 중 누구도 결핍되지 않을 것입니다
  lexicon: BDAG
  rationale: ὑστερέω는 ‘부족하다, 결핍되다’의 뜻이므로, 집합 전체에 결핍이 없다는 의미를 한국어로 직접 드러냈습니다.
theological_decisions:
- issue: ‘주의 눈’의 보호적 함의
  chosen_reading: ‘주의 눈은 그들을 살피시며’로 옮겨, 단순한 시선이 아니라 돌보심과 감찰의 의미를 함께 살렸습니다.
  alternative_readings:
  - ‘주의 눈은 그들을 바라보시며’
  - ‘주의 눈은 그들을 지켜보시며’
  rationale: 본문은 하나님이 이스라엘을 향해 적극적으로 응시하시는 장면을 그리므로, 한국어에서 보호적 뉘앙스가 자연스럽게 드러나도록 했습니다.
  doctrine_reference: 하나님의 섭리와 돌보심
