  to: 주의 인자하심이 풍성한 선물처럼 이스라엘 위에 있습니다. 주의 눈은 그들을 살피시며, 그들 가운데 하나도 부족함이 없을 것입니다.[a]
  rationale: The revision removes the erroneous roof/covering alternative, preserves the poetic comparison involving a rich gift, and renders χρηστότης without importing the abundance that belongs grammatically to πλουσίου. The remaining note records the impersonal Korean alternative for the compact final Greek clause. The footnote markers are renumbered after removal of the invalid note.
