  to: 그리고 주님의 사랑은 아브라함의 후손, 곧 이스라엘의 아들들 위에 있습니다. 주님의 징계는 우리 위에 있으며, 마치 맏아들이며 외아들인 아들에게 하듯이 임합니다.
  rationale: 현대 한국어의 자연스러움을 위해 집합 명사 σπέρμα를 ‘후손’으로 옮기고, 비교 구문을 ‘아들에게 하듯이’로 명료화했습니다. ‘맏아들’과 ‘외아들’의 두 표현은 모두 보존했으며, 사랑과 징계가 ‘위에’ 있다는 원문의 반복도 유지했습니다.
