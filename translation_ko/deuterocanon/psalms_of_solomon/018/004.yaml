  text: And your love is upon the offspring of Abraham, the sons of Israel. Your discipline is upon us as upon a firstborn, an only son,
translation:
  language: ko
  text: 그리고 주님의 사랑은 아브라함의 후손, 곧 이스라엘의 아들들 위에 있습니다. 주님의 징계는 우리 위에 있으며, 마치 맏아들이며 외아들인 아들에게 하듯이 임합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγάπη σου
  english_pob_choice: your love
  chosen_korean: 주님의 사랑
  alternatives_korean:
  - 당신의 사랑
  - 주의 사랑
  lexicon: LSJ
  rationale: ἀγάπη는 이 문맥에서 언약적 애정의 의미를 담으므로 ‘사랑’이 가장 자연스럽고, 2인칭 소유는 직접 호칭을 피한 문맥상 ‘주님의’로 옮겼습니다.
- source_word: σπέρμα Ἀβραάμ
  english_pob_choice: the offspring of Abraham
  chosen_korean: 아브라함의 씨
  alternatives_korean:
  - 아브라함의 후손
  - 아브라함의 자손
  lexicon: LSJ
  rationale: σπέρμα는 단수이면서 집합적이므로 ‘씨’가 혈통과 언약 계승의 이미지를 가장 직접적으로 보존합니다.
- source_word: υἱοὺς Ἰσραήλ
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
  - 이스라엘 자손
  - 이스라엘 사람들
  lexicon: LSJ
  rationale: 원문이 명시적으로 ‘아들들’이라고 하므로, 뒤의 ‘맏아들, 외아들’ 이미지와의 연결을 살리기 위해 직역에 가깝게 옮겼습니다.
- source_word: ἡ παιδία σου
  english_pob_choice: your discipline
  chosen_korean: 주님의 징계
  alternatives_korean:
  - 주님의 훈육
  - 주님의 훈련
  lexicon: LSJ
  rationale: 이 단어는 단순한 가르침보다 교정과 형성의 뜻을 띠며, 여기서는 공동체 위에 임하는 교정적 조치를 드러내는 ‘징계’가 적절합니다.
- source_word: ὡς υἱὸν πρωτότοκον μονογενῆ
  english_pob_choice: as upon a firstborn, an only son
  chosen_korean: 마치 맏아들, 외아들 위에 있듯이
  alternatives_korean:
  - 마치 맏아들이자 외아들 위에 있듯이
  - 마치 첫째이자 외아들 위에 있듯이
  lexicon: LSJ
  rationale: πρωτότοκον과 μονογενῆ를 겹쳐 말하는 구조를 각각 살리기 위해 ‘맏아들, 외아들’로 병렬 처리했습니다.
theological_decisions:
- issue: 2인칭 소유와 직접 호칭의 처리
  chosen_reading: 주님의 사랑 / 주님의 징계
  alternative_readings:
