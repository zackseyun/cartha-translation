  - marker: b
    text: ‘인터루드’는 διάψαλμα를 옮긴 말로, 전통적으로는 ‘셀라’라고도 합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “좋은 세대는 긍휼의 날들에 삽니다”라고 옮길 수 있습니다.
