lexical_decisions:
- source_word: γενεὰ
  english_pob_choice: generation
  chosen_korean: 세대
  alternatives_korean:
  - 세대
  - 사람들
  - 족속
  lexicon: BDAG
  rationale: γενεά는 여기서 특정한 성격을 지닌 집단을 가리키므로, 문맥을 과도하게 풀지 않는 ‘세대’가 가장 자연스럽습니다.
- source_word: ἀγαθὴ
