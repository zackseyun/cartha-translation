  lexicon: BDAG
  rationale: ‘fear of God’의 성경적 관용구를 살리되, 한국어에서는 상태표현보다 행위/태도의 지속을 나타내는 ‘두려워하며’가 가장 자연스럽습니다.
- source_word: ἐν ἡμέραις ἐλέους
  english_pob_choice: in days of mercy
  chosen_korean: 긍휼의 날들에
  alternatives_korean:
  - 자비의 날들에
  - 긍휼의 때에
  - 긍휼한 날들에
  lexicon: BDAG
  rationale: ἔλεος의 핵심 의미인 ‘긍휼’을 유지하면서, 복수 표현도 그대로 반영해 ‘날들에’로 옮겼습니다.
- source_word: διάψαλμα
  english_pob_choice: Interlude
  chosen_korean: 인터루드
  alternatives_korean:
  - 간주
  - 휴지
  - 셀라
  lexicon: LSJ
  rationale: 의례적·음악적 표지를 가리키므로, 기능을 전달하는 음역형인 ‘인터루드’가 가장 중립적입니다.
theological_decisions:
- issue: φόβος θεοῦ의 신학적 뉘앙스
  chosen_reading: ‘하나님을 두려워하며’로 유지하여 경외와 순종을 함께 암시했습니다.
  alternative_readings:
  - 하나님을 경외하며
  - 하나님에 대한 경외 가운데
  rationale: 이 표현은 단순한 감정이 아니라 성경적 삶의 태도를 뜻하므로, 의미를 약화시키지 않도록 직역에 가까운 형태를 택했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
