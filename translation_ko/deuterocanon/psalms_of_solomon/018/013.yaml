lexical_decisions:
- source_word: ἐν φόβῳ θεοῦ
  english_pob_choice: in the fear of God
  chosen_korean: 하나님을 두려워하는 가운데
  alternatives_korean:
  - 하나님에 대한 경외 가운데
  - 하나님을 경외하며
  lexicon: BDAG
  rationale: φόβος θεοῦ는 단순 공포보다 하나님께 대한 경외와 경건을 포함하므로, 원문의 긴장을 살리면서도 한국어에서 자연스러운 ‘하나님을 두려워하는 가운데’로 옮겼습니다.
- source_word: ὁδὸς
  english_pob_choice: way
  chosen_korean: 길
  alternatives_korean:
  - 길
  - 행실
  - 삶의 길
  lexicon: BDAG
  rationale: ‘길’은 삶의 진행과 태도를 함께 가리키는 비유를 비교적 직접적으로 살리며, 문맥상 ‘행실’보다 원문에 가깝습니다.
- source_word: καθʼ ἑκάστην ἡμέραν
  english_pob_choice: every day
  chosen_korean: 매일
  alternatives_korean:
  - 날마다
  - 각 날마다
  lexicon: BDAG
  rationale: 반복성과 지속성을 가장 간결하게 전달하는 한국어 표현으로 ‘매일’을 택했습니다.
- source_word: ἔκτισεν
  english_pob_choice: created
  chosen_korean: 지으신
  alternatives_korean:
  - 창조하신
  - 만드신
  lexicon: BDAG
  rationale: 하나님이 사람을 존재하게 하신 창조 행위를 드러내기 위해 ‘지으신’을 사용했습니다. 한국어에서는 다소 포괄적이지만 여기서는 창조 의미를 자연스럽게 담습니다.
theological_decisions:
- issue: φόβος θεοῦ의 신학적 뉘앙스
  chosen_reading: ‘하나님을 두려워하는’은 경외를 포함하되, 경건한 삶의 긴장감도 유지합니다.
  alternative_readings:
  - ‘하나님을 경외하는’으로 완화
  - ‘하나님에 대한 경외’로 명사화
  rationale: 시편적·지혜문학적 표현의 도덕적 무게를 약화시키지 않기 위해, 지나치게 부드러운 표현보다 원문의 경외-두려움의 중첩을 보존했습니다.
  doctrine_reference: '경외와 두려움의 결합: 시 111:10, 잠 1:7'
