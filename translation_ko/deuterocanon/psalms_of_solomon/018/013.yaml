base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/018/013.yaml
  text: Their way is in the fear of God every day[b][a], from the day God created them and forever.
  footnotes:
  - marker: a
    text: Or 'Their path' or 'Their conduct' for 'Their way.'
    reason: lexical_alternative
  - marker: b
