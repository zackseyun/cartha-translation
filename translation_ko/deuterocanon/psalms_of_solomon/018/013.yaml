  to: 그들의 길[a]은 날마다 하나님을 경외하는 가운데[b] 있으며, 하나님께서 그들을 창조하신 날부터 영원토록 이어집니다.
  rationale: 원문의 ‘길’ 비유와 ‘하나님에 대한 두려움/경외’의 경건한 의미를 유지하되, 한국어에서 불명확한 ‘그러하다’의 반복을 제거했습니다. ‘창조하신 날부터 영원토록’은 ἀφʼ ἧς ἡμέρας … καὶ ἕως αἰῶνος의 시작점과 지속 범위를 보존합니다. 각주 표지는 해당 어구 바로 뒤로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
