    reason: previous_rendering
translation:
  language: ko
  text: 훈육의 막대 아래에서, 그분의 하나님을 경외하며, 영의 지혜와 의와 힘 안에서입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주님의 메시아’는 압축된 소유격 연쇄를 풀어 옮긴 것으로, 원문의 관계를 자연스럽게 드러내기 위한 번역입니다.
    reason: source_note
lexical_decisions:
- source_word: ῥάβδον παιδείας
  english_pob_choice: rod of discipline
  chosen_korean: 훈육의 막대
  alternatives_korean:
  - 징계의 막대
  - 훈련의 막대
  - 훈육의 지팡이
  lexicon: LSJ / BDAG
  rationale: ῥάβδος의 ‘막대’와 παιδεία의 ‘훈육·교정’ 의미를 함께 살리되, 한국어에서 자연스럽고 과도하게 형벌적으로 들리지 않도록 ‘훈육의 막대’로 옮겼습니다.
- source_word: χριστοῦ κυρίου
  english_pob_choice: the Lord's Messiah
  chosen_korean: 주님의 메시아
  alternatives_korean:
  - 주님의 그리스도
  - 야훼의 기름부음 받은 이
  - 메시아 주님
  lexicon: BDAG
  rationale: Χριστός를 титular하게 ‘메시아’로 옮기고, κύριος와의 관계를 소유격으로 드러내어 ‘주님의 메시아’로 표현했습니다.
- source_word: φόβῳ θεοῦ αὐτοῦ
  english_pob_choice: in the fear of his God
  chosen_korean: 그분의 하나님을 경외하며
  alternatives_korean:
  - 그분의 하나님에 대한 두려움 안에서
  - 그분의 하나님을 두려워하며
  - 그분의 하나님을 경외하는 가운데
  lexicon: BDAG
  rationale: φόβος의 하나님을 향한 경외 의미를 살리기 위해 ‘경외하다’를 택했고, αὐτοῦ는 관계를 분명히 하도록 ‘그분의 하나님’으로 반영했습니다.
- source_word: σοφίᾳ πνεύματος καὶ δικαιοσύνης καὶ ἰσχύος
  english_pob_choice: in wisdom of spirit and righteousness and strength
  chosen_korean: 영의 지혜와 의와 힘 안에서
  alternatives_korean:
  - 영과 의와 힘의 지혜 안에서
  - 성령의 지혜와 의와 힘 안에서
  - 영의 지혜와 정의와 힘 안에서
  lexicon: BDAG
  rationale: πνεύματος는 문맥상 영/성령 가능성이 남아 있으므로 본문에서는 중립적으로 ‘영’으로 두었고, δικαιοσύνης는 기본값인 ‘의’, ἰσχύος는 과장되지 않은 ‘힘’으로 옮겼습니다.
theological_decisions:
- issue: πνεύματος의 번역 범위
  chosen_reading: 본문에서는 ‘영’으로 유지하여 인간의 영 또는 하나님의 영 가능성을 열어 둡니다.
  alternative_readings:
  - 성령
  - 영혼
  rationale: 명시적 관사가 없고 미덕 열거처럼 읽히므로, 성령을 단정하기보다 원문의 긴장을 보존하는 것이 더 안전합니다.
  doctrine_reference: 'DOCTRINE.md contested terms: πνεῦμα → 영 / 성령'
- issue: χριστοῦ의 호칭성
  chosen_reading: ‘메시아’로 번역해 유대-메시아적 호칭성을 드러냅니다.
  alternative_readings:
  - 그리스도
  - 기름부음 받은 이
  rationale: 이 문맥에서 Χριστός는 고유명사보다 титular한 칭호로 기능하므로, 프로젝트 기본값에 따라 ‘메시아’가 가장 적절합니다.
  doctrine_reference: 'DOCTRINE.md contested terms: Χριστός → 메시아'
