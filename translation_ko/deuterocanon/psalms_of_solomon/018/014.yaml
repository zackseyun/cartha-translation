source:
  edition: lxx-swete-1909
  text: καὶ οὐκ ἐπλανήθησαν ἀφʼ ἧς ἡμέρας ἔκτισεν αὐτούς. ἀπὸ γενεῶν ἀρχαίων οὐκ ἀπέστησαν ὁδῶν αὐτῶν, εἰ μὴ ὁ θεὸς ἐνετείλατο αὐτοῖς ἐν ἐπιταγῇ δούλων αὐτοῦ.
  language: Greek
  pages:
  - 810
  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/018/014.yaml
  text: And they have not gone astray since the day he created them[a]. From ancient generations they have not departed from their ways[d][c][b], unless God commanded them by the command of his slaves.
  footnotes:
  - marker: a
    text: Or 'have not wandered.'
    reason: lexical_alternative
  - marker: b
    text: '''Their ways'' may mean their appointed courses or patterns.'
    reason: lexical_alternative
  - marker: c
    text: 'Or ''through his servants.'' Greek: ''slaves.'''
    reason: lexical_alternative
  - marker: d
    text: Or 'by an ordinance through his slaves'.
    reason: previous_rendering
translation:
  language: ko
  text: 그분이 그들을 창조하신 날부터 그들은 길을 벗어나지 않았습니다[a]. 옛 세대들로부터 그들은 자기들의 길을 떠나지 않았습니다[d][c][b]. 다만 하나님께서 자기 종들의 명령으로 그들에게 명령하신 경우는 예외입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘길을 헤매지 않았습니다’.
    reason: lexical_alternative
  - marker: b
    text: ‘자기들의 길’은 정해진 행로나 패턴을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그의 종들을 통해’. 그리스어는 ‘slaves’입니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘그의 종들을 통한 명령에 의하여’.
    reason: previous_rendering
lexical_decisions:
- source_word: ἐπλανήθησαν
  english_pob_choice: have not gone astray
  chosen_korean: 길을 벗어나지 않았습니다
  alternatives_korean:
  - 방황하지 않았습니다
  - 길에서 벗어나지 않았습니다
  lexicon: BDAG
  rationale: 도덕적·종교적 일탈의 뉘앙스를 살리면서도 한국어로 자연스럽게 들리도록 ‘길을 벗어나다’로 옮겼습니다.
- source_word: ἔκτισεν
  english_pob_choice: created
  chosen_korean: 창조하신
  alternatives_korean:
  - 만드신
  - 지으신
  lexicon: BDAG
  rationale: κτίζω의 기본 의미를 따라 하나님의 창조 행위를 직접 드러내는 ‘창조하신’이 가장 분명합니다.
- source_word: ὁδῶν αὐτῶν
  english_pob_choice: their ways
  chosen_korean: 자기들의 길
  alternatives_korean:
  - 자기들의 방식
  - 자기들의 경로
  lexicon: BDAG
  rationale: 여기서는 문자적 도로보다 정해진 삶의 행로·패턴을 가리키므로, ‘길’이 의미 범위를 가장 잘 보존합니다.
- source_word: ἐν ἐπιταγῇ δούλων αὐτοῦ
  english_pob_choice: by the command of his slaves
  chosen_korean: 자기 종들의 명령으로
  alternatives_korean:
  - 자기 노예들의 명령으로
  - 자기 종들을 통한 명령으로
  lexicon: BDAG
  rationale: ἐπιταγή의 권위적 명령성을 살리면서, δοῦλοι는 문맥상 종속성과 소속이 강조되므로 기본값인 ‘종’을 사용하되 명령 주체성은 ‘명령으로’로 유지했습니다.
theological_decisions:
- issue: δοῦλοι의 한국어 처리와 하나님의 권위 구조
  chosen_reading: 본문의 직설성을 살려 ‘종’으로 번역하되, 명령의 발화 주체는 하나님으로 유지했습니다.
  alternative_readings:
  - 노예
  - 섬기는 자
  rationale: 한국어 교회어의 ‘노예’는 지나치게 물질적 종속을 환기하고, ‘섬기는 자’는 본문의 급진성을 약화시킬 수 있어, 기본값 ‘종’이 가장 균형적입니다.
  doctrine_reference: '용어 정책: δοῦλος 기본값은 ‘종’, 특히 bonded status가 핵심일 때만 ‘노예’ 사용'
