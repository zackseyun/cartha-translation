revisions:
- from: 그분이 그들을 창조하신 날부터 그들은 길을 벗어나지 않았습니다[a]. 옛 세대들로부터 그들은 자기들의 길을 떠나지 않았습니다[d][c][b]. 다만 하나님께서 자기 종들의 명령으로 그들에게 명령하신 경우는 예외입니다.
  to: 그분이 그들을 창조하신 날부터 그들은 길을 벗어나지 않았습니다[a]. 아주 먼 옛날부터 그들은 그들의 길을 떠나지 않았습니다. 하나님께서 그분의 종들[c]의 명령으로 그들에게 명령하신 경우를 제외하고는[d][b].
  rationale: 예외를 나타내는 εἰ μὴ를 앞 문장의 부정 진술에 연결하여 원문의 논리와 문장 구조를 보존했습니다. ‘그분의 종들의 명령으로’는 ἐν ἐπιταγῇ δούλων αὐτοῦ의 명령적·도구적 표현을 반영하며, ‘종’은 본문 문체와 용어 정책에 맞춰 유지했습니다. 다만 이 구문의 정확한 관계는 다소 압축되어 있으므로, 대안 번역을 각주로 남겨 과도한 해석을 피했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:10:01Z'
review_pass:
  verdict: revise
  source_fidelity: 전반적으로 원문의 부정·지속 표현과 두 절의 병행 구조를 잘 반영합니다. 그러나 마지막 절은 원문의 εἰ μὴ(“~하신 경우가 아니라면/제외하고는”)에 맞추어 앞 문장에 직접 연결하는 편이 더 정확합니다. 또한 ἐν ἐπιταγῇ δούλων αὐτοῦ는 ‘그분의 종들의 명령으로’로 옮겨, 명령의 주체가 하나님이면서도 그 명령이 그의 종들의 명령에 의해 매개됨을 보존해야 합니다.
  naturalness: ‘옛 세대들로부터’는 현대 한국어에서 다소 직역투이므로 ‘아주 먼 옛날부터’로 다듬었습니다. ‘자기들의’는 하나님을 가리키는 ‘자기’와 혼동될 여지가 있어, 피지시 대상의 소유를 분명히 하는 ‘그들의 길’로 수정했습니다. 마지막 절도 별도 선언문보다 ‘~경우를 제외하고는’으로 연결하면 합쇼체 문장으로 자연스럽습니다.
  terminology: κτίζω는 ‘창조하다’, ὁδός는 문맥의 넓이를 보존하는 ‘길’, δοῦλοι는 본 번역의 용어 방침 및 한국어 성서 문체에 맞는 ‘종’으로 유지했습니다. 각주에서는 원어의 더 강한 사회적 의미를 ‘노예들’로 밝혔습니다.
  issues:
  - severity: medium
    issue: 마지막 절이 독립문 ‘다만 … 경우는 예외입니다’로 처리되어 εἰ μὴ가 앞선 ‘떠나지 않았다’를 제한하는 원문 연결이 약해집니다.
    rationale: ‘하나님께서 … 명령하신 경우를 제외하고는’으로 앞 문장에 연결하면 원문의 예외 조건과 통사 관계를 직접 반영합니다.
  - severity: low
    issue: ‘옛 세대들로부터’와 ‘자기들의 길’이 각각 직역투 및 지시 대상 혼동 가능성을 보입니다.
    rationale: γενεῶν ἀρχαίων의 장구한 시간은 ‘아주 먼 옛날부터’가 자연스럽고, αὐτῶν은 ‘그들의’로 명시하는 편이 안전합니다.
  - severity: low
    issue: 각주 c의 ‘그리스어는 slaves입니다’는 한국어 독자에게 부자연스럽고, 본문에 연결된 표지가 없습니다.
    rationale: ‘그리스어는 “노예들”입니다’로 한국어화하고 ‘종들’에 표지를 붙여야 각주의 기능이 분명해집니다.
