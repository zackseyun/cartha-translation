  chosen_reading: ‘주님의 손의 일들’로 직역적 이미지를 유지했습니다.
  alternative_readings:
  - 주님의 손으로 지으신 것들
  - 주님의 손이 만든 것들
  - 주님의 손의 작품
  rationale: 본문은 하나님의 창조 행위를 강하게 암시하지만, 그 의미를 매끈한 의역으로 확정하기보다 손-일의 이미지를 보존하는 것이 원문의 표현력을 더 잘 살립니다.
