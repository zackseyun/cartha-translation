lexical_decisions:
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주여
  - 오 주님
  lexicon: κύριος
  rationale: 호격으로 하나님을 부르는 표현이므로 한국어에서는 자연스럽고 경건한 직접 호칭인 ‘주님’을 택했습니다. ‘오’는 현대 합쇼체에서는 불필요하게 문어적이어서 넣지 않았습니다.
- source_word: τὸ ἔλεός σου
  english_pob_choice: your mercy
  chosen_korean: 주님의 자비
  alternatives_korean:
  - 주님의 긍휼
  - 주님의 인자
  lexicon: ἔλεος
  rationale: ἔλεος는 하나님의 긍휼한 은총을 가리키지만, 본문이 청원문이 아니라 선언문이므로 ‘자비’가 가장 자연스럽고 간결합니다. ‘긍휼’이나 ‘인자’는 더 전통적이거나 어감이 달라 본문의 평이한 진술을 덜 잘 드러냅니다.
- source_word: τὰ ἔργα τῶν χειρῶν σου
  english_pob_choice: the works of your hands
  chosen_korean: 주님의 손의 일들
  alternatives_korean:
  - 주님의 손으로 하신 일들
  - 주님의 손이 만든 것들
  - 주님의 손으로 지으신 것들
  lexicon: ἔργα / χειρῶν
  rationale: 영어 POB처럼 해석을 ‘손으로 지으신 것들’로 미리 풀지 않고, 그리스어의 이미지인 ‘손의 일들’을 유지했습니다. 이는 창조를 암시하지만 본문이 요구하는 범위를 넘지 않게 합니다.
- source_word: εἰς τὸν αἰῶνα
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 끝없이
  - 영원까지
  lexicon: αἰών
  rationale: 지속 기간을 나타내는 표준적 현대어로 ‘영원히’가 가장 자연스럽고, 시적 문맥에서도 무난합니다.
