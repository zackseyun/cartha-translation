translation:
  language: ko
  text: 주님, 주님의 손의 일들 위에 주님의 자비가 영원히 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 자비가 주님의 손의 일들 위에 머물러 있습니다.’
    reason: alternative_reading
  - marker: b
    text: ‘주님의 손의 일들’은 ‘주님의 손으로 지으신 것들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주여
  - 오 주님
  lexicon: κύριος
  rationale: 호격으로 하나님을 부르는 표현이므로 한국어에서는 자연스럽고 경건한 직접 호칭인 ‘주님’을 택했습니다. ‘오’는 현대 합쇼체에서는 불필요하게 문어적이어서 넣지 않았습니다.
- source_word: τὸ ἔλεός σου
  english_pob_choice: your mercy
  chosen_korean: 주님의 자비
  alternatives_korean:
  - 주님의 긍휼
  - 주님의 인자
  lexicon: ἔλεος
  rationale: ἔλεος는 하나님의 긍휼한 은총을 가리키지만, 본문이 청원문이 아니라 선언문이므로 ‘자비’가 가장 자연스럽고 간결합니다. ‘긍휼’이나 ‘인자’는 더 전통적이거나 어감이 달라 본문의 평이한 진술을 덜 잘 드러냅니다.
- source_word: τὰ ἔργα τῶν χειρῶν σου
  english_pob_choice: the works of your hands
  chosen_korean: 주님의 손의 일들
  alternatives_korean:
  - 주님의 손으로 하신 일들
  - 주님의 손이 만든 것들
  - 주님의 손으로 지으신 것들
  lexicon: ἔργα / χειρῶν
  rationale: 영어 POB처럼 해석을 ‘손으로 지으신 것들’로 미리 풀지 않고, 그리스어의 이미지인 ‘손의 일들’을 유지했습니다. 이는 창조를 암시하지만 본문이 요구하는 범위를 넘지 않게 합니다.
- source_word: εἰς τὸν αἰῶνα
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 끝없이
  - 영원까지
  lexicon: αἰών
  rationale: 지속 기간을 나타내는 표준적 현대어로 ‘영원히’가 가장 자연스럽고, 시적 문맥에서도 무난합니다.
theological_decisions:
- issue: τὰ ἔργα τῶν χειρῶν σου의 번역을 ‘손으로 지으신 것들/손으로 만드신 것들’로 풀어 쓰지 않을지 여부
  chosen_reading: ‘주님의 손의 일들’로 직역적 이미지를 유지했습니다.
  alternative_readings:
  - 주님의 손으로 지으신 것들
  - 주님의 손이 만든 것들
  - 주님의 손의 작품
  rationale: 본문은 하나님의 창조 행위를 강하게 암시하지만, 그 의미를 매끈한 의역으로 확정하기보다 손-일의 이미지를 보존하는 것이 원문의 표현력을 더 잘 살립니다.
  doctrine_reference: 원문 이미지 보존 우선; 해석적 확장은 최소화
