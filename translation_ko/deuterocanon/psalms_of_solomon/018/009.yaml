lexical_decisions:
- source_word: κατευθῦναι
  english_pob_choice: to guide
  chosen_korean: 인도하고
  alternatives_korean:
  - 지도하고
  - 바르게 이끌고
  lexicon: LSJ
  rationale: 목적 있는 도덕적 방향 제시라는 뜻을 살려, 현대 한국어에서 자연스러운 ‘인도하다’를 택했습니다.
- source_word: ἄνδρας
  english_pob_choice: men
  chosen_korean: 남자들을
  alternatives_korean:
  - 사람들을
  - 남성들을
  lexicon: LSJ
  rationale: 그리스어 남성 복수형을 반영해 성별 표지를 유지했으며, 본문이 일반적 인류를 가리키는 중성 표현을 쓰지 않았습니다.
- source_word: ἐν ἔργοις δικαιοσύνης
  english_pob_choice: in works of righteousness
  chosen_korean: 의의 일들로
  alternatives_korean:
  - 의로운 행실로
  - 의의 행위들로
  - 정의의 일들로
  lexicon: LSJ
  rationale: POB의 ‘righteousness’를 따라 δικαιοσύνη는 ‘의’로 옮기고, ‘works’는 ‘일들’로 유지해 문구의 구체성을 살렸습니다.
- source_word: φόβῳ θεοῦ
  english_pob_choice: in the fear of God
  chosen_korean: 하나님 경외함 안에서
  alternatives_korean:
  - 하나님을 두려워함 안에서
  - 하나님을 경외하는 가운데
  lexicon: LSJ
  rationale: 단순 감정인 ‘두려움’보다 성경적 관용구인 ‘경외함’을 살렸고, 전치적 의미를 한국어의 ‘안에서’로 자연스럽게 표현했습니다.
- source_word: ἐνώπιον Κυρίου
  english_pob_choice: before the Lord
  chosen_korean: 주님 앞에
  alternatives_korean:
  - 주님 앞에서
  - 주님의 면전 앞에
  lexicon: LSJ
  rationale: ‘before the Lord’의 직설적 대응으로 ‘주님 앞에’를 택해, 위치·관계의 공적 성격을 간결하게 드러냈습니다.
theological_decisions:
- issue: δικαιοσύνη의 의미 범위
  chosen_reading: ‘의’로 번역하되, 문맥상 의로운 행실/의의 일들을 뜻하는 흐름을 유지했습니다.
  alternative_readings:
  - 정의
  - 의로움
  rationale: 이 문맥은 윤리적 삶의 방식에 초점이 있어, POB의 기본값인 ‘righteousness’에 대응하는 ‘의’를 중심 의미로 두는 것이 가장 투명합니다.
  doctrine_reference: DOCTRINE.md contested terms table
- issue: φόβος θεοῦ의 한국어 톤
  chosen_reading: ‘하나님 경외함’으로 옮겨, 단순한 공포가 아니라 신앙적 경외를 나타내게 했습니다.
  alternative_readings:
  - 하나님 두려움
  - 하나님을 두려워함
  rationale: 성경적 ‘fear of God’는 공포보다 경외를 포함하므로, 표준적 교회어를 쓰되 원문의 엄중함을 약화시키지 않도록 했습니다.
  doctrine_reference: Korean biblical idiom / wisdom-ethical register
