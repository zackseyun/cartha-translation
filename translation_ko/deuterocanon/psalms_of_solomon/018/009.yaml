  source_fidelity: 원문의 두 부정사(κατευθῦναι, καταστῆσαι)는 앞 문맥에 매인 목적·내용의 병렬 표현입니다. 초안의 ‘세우게 하십시오’는 명령 및 사역의 뉘앙스를 더하므로 이를 피했습니다. ἄνδρας의 남성 표지는 유지했고, φόβῳ θεοῦ는 하나님을 향한 경외의 방식/영역으로 옮겼습니다.
  naturalness: ‘하나님 경외함 안에서’, ‘의의 일들’은 현대 표준 한국어에서 다소 번역투입니다. ‘하나님을 경외하는 가운데’와 ‘의의 행위들’을 사용해 의미와 격조를 유지하면서 자연스럽게 다듬었습니다. 부정사적 절의 성격을 보존하기 위해 ‘…하는 것입니다’로 처리했습니다.
  terminology: δικαιοσύνη는 POB의 기본 선택을 따라 ‘의’로 유지했습니다. κύριος는 ‘주님’, φόβος θεοῦ는 성경적 용례에 맞게 ‘하나님을 경외하는 가운데’로 번역했습니다. ‘의로운 행실’과 ‘정의의 행위들’은 각주 대안으로 남겼습니다.
