  text: μακάριοι οἱ γενόμενοι ἐν ἡμέραις ἐκείναις, ἰδεῖν τὰ ἀγαθὰ Κυρίου, ἃ ποιήσει γενεᾷ τῇ ἐρχομένῃ
  language: Greek
