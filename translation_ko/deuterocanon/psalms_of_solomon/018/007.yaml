base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/018/007.yaml
  text: Blessed are those who come to be in those days[b][a], to see the good things of the Lord that he will do for the generation to come.
  footnotes:
  - marker: a
    text: Or 'those who come to be in those days,' that is, 'those living' or 'those born' then.
    reason: lexical_alternative
  - marker: b
    text: Or 'the blessings of the Lord.'
    reason: lexical_alternative
translation:
  language: ko
  text: 복된 사람들은 그날들에 있게 된 이들이니, 주님의 좋은 것들을 보며, 그가 올 세대에게 행하실 것을 보게 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그날들에 있게 된 이들’, 곧 ‘그때 살아 있는 이들’ 또는 ‘그때 태어난 이들’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주님의 복들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  english_pob_choice: Blessed
  chosen_korean: 복된
  alternatives_korean:
  - 행복한
  - 복이 있는
  lexicon: BDAG
  rationale: 축복과 언약적 복의 뉘앙스를 살리면서도 현대 한국어에서 자연스럽게 읽히는 형용사로 옮겼습니다.
- source_word: οἱ γενόμενοι
  english_pob_choice: those who come to be
  chosen_korean: 그날들에 있게 된 이들
  alternatives_korean:
  - 그날들에 태어난 이들
  - 그날들에 생겨난 이들
  lexicon: BDAG
  rationale: γένoμαι의 넓은 의미를 따라 단순한 ‘출생’으로 좁히지 않고, 그 시기에 존재하게 된 사람들을 가리키도록 옮겼습니다.
- source_word: τὰ ἀγαθὰ Κυρίου
  english_pob_choice: the good things of the Lord
  chosen_korean: 주님의 좋은 것들
  alternatives_korean:
  - 주님의 복들
  - 주님의 선한 것들
  lexicon: BDAG
  rationale: 본문이 특정한 ‘복들’로 한정하지 않으므로, ‘좋은 것들’로 넓게 유지했습니다.
- source_word: γενεᾷ τῇ ἐρχομένῃ
  english_pob_choice: the generation to come
  chosen_korean: 올 세대
  alternatives_korean:
  - 다가올 세대
  - 오는 세대
  lexicon: BDAG
  rationale: 미래 지향적 의미를 한국어의 간결한 표현으로 살렸고, 직역투를 피하면서도 다음 세대를 분명히 드러냈습니다.
theological_decisions:
- issue: 본문의 복된 대상과 미래 세대의 시점 관계
  chosen_reading: ‘그날들에 있게 된 이들’이 ‘주님의 좋은 것들’을 보고, 그 행위를 ‘올 세대’에 대해 보게 되는 미래적 복으로 읽었습니다.
  alternative_readings:
  - 단순히 과거의 특정 시대에 태어난 자들로만 좁혀 읽는 해석
  - ‘좋은 것들’을 곧바로 ‘복들’로 좁혀 읽는 해석
  rationale: 그리스어 γενόμενοι와 τὰ ἀγαθά의 범위를 너무 좁히지 않고, 시편 형태의 축복 선언이 지닌 미래 전망을 유지했습니다.
  doctrine_reference: 시적 축복 선언과 종말론적 전망
