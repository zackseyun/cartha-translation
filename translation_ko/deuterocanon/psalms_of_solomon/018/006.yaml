base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/018/006.yaml
  text: May God purify Israel for a day of mercy in blessing[e][d][c][b][a], for a day of choosing in the raising up of his Messiah.
  footnotes:
  - marker: a
    text: Greek leaves the object of “purify” unstated; “us” is supplied from the corporate Israel context.
    reason: alternative_reading
  - marker: b
    text: Or “for a day of election.”
    reason: lexical_alternative
  - marker: c
    text: Or “in the exaltation of his Messiah.”
    reason: lexical_alternative
  - marker: d
    text: A manuscript variant reflected in Swete’s apparatus has a finite verb (“may cleanse”), which is close in sense to the prayer-like rendering adopted here.
    reason: textual_variant
  - marker: e
    text: Or 'May the God of Israel purify us'.
    reason: previous_rendering
translation:
  language: ko
  text: 하나님께서 이스라엘을, 축복 가운데 자비의 날을 위하여 그리고 그분의 메시아를 높이 세우심 가운데 선택의 날을 위하여, 정결하게 하시기를 바랍니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘선택의 날’은 ‘선발의 날’ 또는 ‘택하심의 날’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘높이 세우심’은 문자적으로 ‘들어 올림’의 뜻이며, ‘고양’ 또는 ‘높임’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘메시아’는 ‘기름부음 받은 이’를 뜻하는 칭호입니다.
    reason: theological_note
