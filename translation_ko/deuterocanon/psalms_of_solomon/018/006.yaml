- from: 하나님께서 기름부으신 이를 높이 세우시는 날에, 자비의 날을 위해 이스라엘을 정결하게 하시고, 축복 가운데 선택의 날을 위해 하시기를 바라나이다.[a][b][c][d]
  to: 하나님께서 이스라엘을, 축복 가운데 자비의 날을 위하여 그리고 그분의 메시아를 높이 세우심 가운데 선택의 날을 위하여, 정결하게 하시기를 바랍니다.[a][b][c]
  rationale: 원문의 소원형(καθαρίσαι)은 ‘…하시기를 바랍니다’로 살리고, Ἰσραήλ은 목적어 ‘이스라엘을’로 분명히 했습니다. 두 개의 ‘…날을 위하여’ 구절과 각각에 딸린 ‘축복 가운데’ 및 ‘메시아를 높이 세우심 가운데’를 병렬로 유지했습니다. 원문에 없는 ‘날에’나 동사의 중복을 피했으며, 목적어가 생략되었다고 하는 부정확한 각주는 제거했습니다.
