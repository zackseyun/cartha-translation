  - 그의 메시아
  rationale: 본문은 유대적 종말론 문맥에서 하나님의 기름부으신 이를 가리키므로, 단순 음역보다 의미를 드러내는 표현이 독자 이해에 더 직접적입니다.
  doctrine_reference: Χριστός의 칭호적 의미를 보존하면서도 현대 한국어에서 자연스럽게 읽히는 메시아 번역 원칙
- issue: 원문의 기도/소원형 어조를 한국어에서 어떻게 살릴지
  chosen_reading: 종결을 ‘바라나이다’로 처리해 청원·기원 체감을 유지했습니다.
  alternative_readings:
  - 기원합니다
  - 되게 하소서
  rationale: 원문은 aorist optative의 소원적 뉘앙스를 가지므로, 한국어에서는 직접적 명령보다 기도적 소망을 나타내는 종결이 더 적합합니다.
  doctrine_reference: 시적 기원문에서의 합쇼체·청원 어조 보존
