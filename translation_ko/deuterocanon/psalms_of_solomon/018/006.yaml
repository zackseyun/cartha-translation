  terminology: ‘정결하게 하다’, ‘메시아’, ‘높이 세우심’, ‘선택’은 각각 καθαρίσαι, χριστός, ἀνάξει, ἐκλογῆς의 의미를 무리 없이 보존합니다. χριστοῦ αὐτοῦ의 소유 관계는 ‘그분의 메시아’로 명시했습니다.
