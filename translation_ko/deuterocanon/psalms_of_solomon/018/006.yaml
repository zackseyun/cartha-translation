source:
  edition: lxx-swete-1909
  text: καθαρίσαι ὁ θεὸς Ἰσραὴλ εἰς ἡμέραν ἐλέους ἐν εὐλογίᾳ, εἰς ἡμέραν ἐκλογῆς ἐν ἀνάξει χριστοῦ αὐτοῦ.
  language: Greek
  pages:
  - 810
  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/018/006.yaml
  text: May God purify Israel for a day of mercy in blessing[e][d][c][b][a], for a day of choosing in the raising up of his Messiah.
  footnotes:
  - marker: a
    text: Greek leaves the object of “purify” unstated; “us” is supplied from the corporate Israel context.
    reason: alternative_reading
  - marker: b
    text: Or “for a day of election.”
    reason: lexical_alternative
  - marker: c
    text: Or “in the exaltation of his Messiah.”
    reason: lexical_alternative
  - marker: d
    text: A manuscript variant reflected in Swete’s apparatus has a finite verb (“may cleanse”), which is close in sense to the prayer-like rendering adopted here.
    reason: textual_variant
  - marker: e
    text: Or 'May the God of Israel purify us'.
    reason: previous_rendering
translation:
  language: ko
  text: 하나님께서 기름부으신 이를 높이 세우시는 날에, 자비의 날을 위해 이스라엘을 정결하게 하시고, 축복 가운데 선택의 날을 위해 하시기를 바라나이다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ‘정결하게 하다’의 목적어를 직접 표명하므로, 문맥상 이스라엘을 가리킵니다.
    reason: source_note
  - marker: b
    text: ἐκλογῆς는 ‘선택’ 또는 ‘선발’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ἀνάξει는 문자적으로는 ‘올려 세움/들어 올림’의 뜻을 지닙니다.
    reason: lexical_alternative
  - marker: d
    text: χριστοῦ는 여기서 고유명사가 아니라 ‘기름부음 받은 이’, 곧 메시아를 가리키는 칭호입니다.
    reason: theological_note
lexical_decisions:
- source_word: καθαρίσαι
  english_pob_choice: purify
  chosen_korean: 정결하게 하시고
  alternatives_korean:
  - 깨끗하게 하시고
  - 깨끗이 하시고
  lexicon: LSJ
  rationale: 종교적·도덕적 정화의 뜻을 살리면서도 현대 한국어에서 자연스러운 동작 결과를 나타내기 위해 ‘정결하게 하시고’를 택했습니다.
- source_word: Ἰσραήλ
  english_pob_choice: Israel
  chosen_korean: 이스라엘
  alternatives_korean:
  - 이스라엘 백성
  - 이스라엘을
  lexicon: LSJ
  rationale: 원문에서 Ἰσραήλ은 καθαρίσαι의 직접 목적어이므로, ‘이스라엘을’로 처리해 문법 관계를 분명히 했습니다.
- source_word: ἐν εὐλογίᾳ
  english_pob_choice: in blessing
  chosen_korean: 축복 가운데
  alternatives_korean:
  - 축복 안에서
  - 복된 가운데
  lexicon: LSJ
  rationale: 전치사 ἐν의 동반·상태 의미를 살려, ‘축복 가운데’로 자연스럽게 옮겼습니다.
- source_word: ἐκλογῆς
  english_pob_choice: choosing
  chosen_korean: 선택
  alternatives_korean:
  - 선발
  - 택하심
  lexicon: LSJ
  rationale: 하나님의 선별적 선택을 가리키는 명사로 보고, 교회 전통적 어휘이면서도 원문의 의미를 직접 반영하는 ‘선택’을 사용했습니다.
- source_word: ἀνάξει
  english_pob_choice: in the raising up
  chosen_korean: 높이 세우시는
  alternatives_korean:
  - 들어 올리시는
  - 고양하시는
  lexicon: LSJ
  rationale: ἀνάξις의 위로 올림/들어 올림의 감각을 살리되, 한국어에서 예언적·왕적 문맥에 어울리게 ‘높이 세우시는’으로 풀었습니다.
- source_word: χριστοῦ αὐτοῦ
  english_pob_choice: his Messiah
  chosen_korean: 기름부으신 이
  alternatives_korean:
  - 그의 메시아
  - 그의 그리스도
  lexicon: LSJ
  rationale: Χριστός를 титular meaning으로 읽되, 한국어에서 예언적 호칭을 자연스럽게 드러내기 위해 ‘기름부으신 이’로 의역했습니다.
theological_decisions:
- issue: χριστοῦ αὐτοῦ의 번역을 직역형 칭호로 둘지, 서술형으로 풀지
  chosen_reading: ‘기름부으신 이’로 풀어 메시아적 칭호를 드러냈습니다.
  alternative_readings:
  - 메시아
  - 그의 메시아
  rationale: 본문은 유대적 종말론 문맥에서 하나님의 기름부으신 이를 가리키므로, 단순 음역보다 의미를 드러내는 표현이 독자 이해에 더 직접적입니다.
  doctrine_reference: Χριστός의 칭호적 의미를 보존하면서도 현대 한국어에서 자연스럽게 읽히는 메시아 번역 원칙
- issue: 원문의 기도/소원형 어조를 한국어에서 어떻게 살릴지
  chosen_reading: 종결을 ‘바라나이다’로 처리해 청원·기원 체감을 유지했습니다.
  alternative_readings:
  - 기원합니다
  - 되게 하소서
  rationale: 원문은 aorist optative의 소원적 뉘앙스를 가지므로, 한국어에서는 직접적 명령보다 기도적 소망을 나타내는 종결이 더 적합합니다.
  doctrine_reference: 시적 기원문에서의 합쇼체·청원 어조 보존
