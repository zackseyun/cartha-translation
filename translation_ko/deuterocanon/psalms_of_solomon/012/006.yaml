  to: 주님께서 불의한 자들을 미워하는 고요한 영혼[a]을 지키시기를 바랍니다. 또 주님께서 집에서[c] 평화를 이루는 사람을 인도하시기를[b] 바랍니다.
  rationale: 분사구를 ‘불의한 자들을 미워하는’이라는 관계절로 복원하여 ψυχὴν을 직접 수식하게 했습니다. 두 희구법은 각각 ‘-시기를 바랍니다’로 번역하여 축원적 기능을 보존했습니다. ‘고요한’은 ἡσύχιον의 차분하고 평온한 성격을 자연스러운 현대 한국어로 드러냅니다. 각주 표지는 설명 대상 표현 바로 뒤로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:09:47Z'
