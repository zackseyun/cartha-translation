base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/012/006.yaml
  text: May the Lord protect a quiet soul that hates the unjust[c][b][a], and may the Lord guide a man who makes peace in the house.
  footnotes:
  - marker: a
    text: Or 'life' or 'self' for 'soul.'
    reason: lexical_alternative
  - marker: b
    text: Or 'direct' for 'guide.'
    reason: lexical_alternative
  - marker: c
    text: Or 'in the house' or 'in the household.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서 불의한 자들을 미워하는 고요한 영혼[a]을 지키시기를 바랍니다. 또 주님께서 집에서[c] 평화를 이루는 사람을 인도하시기를[b] 바랍니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영혼’은 ‘목숨’이나 ‘자아’로도 옮길 수 있습니다.
    reason: ψυχή의 어휘적 대안입니다.
  - marker: b
    text: 또는 ‘인도하시기를’은 ‘곧게 하시기를’로도 옮길 수 있습니다.
    reason: κατευθύναι의 어휘적 대안입니다.
  - marker: c
    text: 또는 ‘집에서’는 ‘가정에서’나 ‘집 안에서’로도 옮길 수 있습니다.
    reason: ἐν οἴκῳ의 어휘적 대안입니다.
lexical_decisions:
- source_word: φυλάξαι
  english_pob_choice: protect
  chosen_korean: 지키시기를
  alternatives_korean:
  - 보호하시기를
  - 지키시길
  lexicon: Swete Greek text / POB English audit trail
  rationale: aorist optative의 소원을 한국어 기원형으로 옮기되, 현대 합쇼체에 자연스러운 '지키시기를'로 보존했습니다.
- source_word: ψυχὴν
  english_pob_choice: soul
  chosen_korean: 영혼
  alternatives_korean:
  - 목숨
  - 자아
  lexicon: BDAG / POB English audit trail
  rationale: 이 문맥에서는 내면의 인격을 가리키므로 '영혼'이 가장 직접적이며, '목숨'은 생명에, '자아'는 현대적 해석에 치우칩니다.
- source_word: μισοῦσαν ἀδίκους
  english_pob_choice: that hates the unjust
  chosen_korean: 불의한 자들을 미워합니다
  alternatives_korean:
  - 불의를 미워합니다
  - 부당한 사람들을 미워합니다
  lexicon: BDAG / POB English audit trail
  rationale: ἀδίκους를 단순 추상명사인 '불의'로 돌리면 대상성이 약해지므로, 인격적 대상을 살려 '불의한 자들'로 옮겼습니다.
- source_word: κατευθύναι
  english_pob_choice: guide
  chosen_korean: 인도하시기를
  alternatives_korean:
  - 지도하시기를
  - 곧게 하시기를
  lexicon: BDAG / POB English audit trail
  rationale: '''guide''의 방향 설정과 돌봄의 의미를 합쇼체 기원형인 ''인도하시기를''로 자연스럽게 살렸습니다.'
- source_word: ἐν οἴκῳ
  english_pob_choice: in the house
  chosen_korean: 집에서
  alternatives_korean:
  - 집 안에서
  - 가정에서
  lexicon: BDAG / POB English audit trail
  rationale: οἶκος의 가장 직접적인 공간 의미를 유지하되, 한국어에서는 '집에서'가 가장 간명하고 문장 흐름에 맞습니다.
theological_decisions:
- issue: 기도문체의 기원형 처리
  chosen_reading: 두 동사를 모두 '-시기를 바랍니다'로 옮겨, 본문의 소원/축원적 성격을 드러냈습니다.
  alternative_readings:
  - 명령형으로 처리
  - 직설법 미래로 처리
  rationale: 헬라어 aorist optative는 진술보다 소원·축원에 가깝기 때문에, 한국어에서도 기도적 기원문으로 유지하는 것이 본문 기능에 더 충실합니다.
  doctrine_reference: Psalmic prayer/register
- issue: οἶκος의 의미 범위
  chosen_reading: '''집''으로 번역해 물리적 공간을 우선 드러냈습니다.'
  alternative_readings:
  - 가정
  - 집안/가족 공동체
  rationale: 영어 POB가 'house'를 채택한 audit trail을 따라, 이 구절에서는 공동체 일반화보다 집/거처의 직접 의미를 먼저 살리는 편이 원문에 가깝습니다.
  doctrine_reference: lexical semantics
