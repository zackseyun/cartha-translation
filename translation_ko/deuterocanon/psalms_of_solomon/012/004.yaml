- from: 하나님께서 전쟁 가운데서 훼방하는 입술로[a] 불법한 집들을 혼란에 빠뜨리시기를 바라며, 하나님께서 곤경에 있는 무죄한 자들에게서 불법한 자들의 입술을[b][c] 멀리하시고, 주님을 경외하는 이들로부터 수군거리는 자들의 뼈가 흩어지게 하시기를 바랍니다.
