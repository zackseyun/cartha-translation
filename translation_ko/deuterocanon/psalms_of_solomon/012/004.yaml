id: PSS.12.4
reference: Psalms of Solomon 12:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: lxx-swete-1909
  text: συνταράξαι οἴκους παρανόμους ἐν πολέμῳ χείλεσι ψιθυροῖς. μακρύναι ὁ θεὸς ἀπὸ ἀκάκων χείλη παρανόμων ἐν ἀπορίᾳ, καὶ σκορπισθείησαν ὀστᾶ ψιθύρων ἀπὸ φοβουμένων Κύριον
  language: Greek
  pages:
  - 802
  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/012/004.yaml
  text: May God throw lawless houses into turmoil in war by whispering lips[a]; may God remove from the innocent the lips of the lawless in distress[c][b], and may the bones of whisperers be scattered away from those who fear the Lord.
  footnotes:
  - marker: a
    text: Or 'by slanderous lips' / 'the bones of slanderers.' The Greek ψιθυρος-word group can denote secretive malicious speech, not mere quiet speaking.
    reason: lexical_alternative
  - marker: b
    text: '''Houses'' may also imply households or family establishments, not only physical buildings.'
    reason: lexical_alternative
  - marker: c
    text: Or 'remove from the innocent the lips of lawless men in distress'.
    reason: previous_rendering
translation:
  language: ko
  text: 하나님께서 전쟁 가운데서 훼방하는 입술로[a] 불법한 집들을 혼란에 빠뜨리시기를 바라며, 하나님께서 곤경에 있는 무죄한 자들에게서 불법한 자들의 입술을[b][c] 멀리하시고, 주님을 경외하는 이들로부터 수군거리는 자들의 뼈가 흩어지게 하시기를 바랍니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘중상하는 입술’ / ‘중상자들의 뼈’. 그리스어 ψιθυρ- 어군은 단순히 조용히 말하는 것이 아니라 은밀한 해로운 말을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘집들’은 물리적 건물뿐 아니라 가문이나 가정 체계를 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘곤경에 있는 무죄한 자들에게서 불법한 자들의 입술을 멀리하시고’.
    reason: previous_rendering
lexical_decisions:
- source_word: συνταράξαι
  english_pob_choice: throw ... into turmoil
  chosen_korean: 혼란에 빠뜨리시기를 바랍니다
  alternatives_korean:
  - 뒤흔드시기를 바랍니다
  - 소란에 빠뜨리시기를 바랍니다
  lexicon: LSJ
  rationale: 청원의 어조를 살리면서도 전쟁 심판의 격렬한 흔들림을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: οἴκους
  english_pob_choice: houses
  chosen_korean: 집들
  alternatives_korean:
  - 가정들
  - 집안들
  lexicon: LSJ
  rationale: 직역 이미지를 유지하되, 한국어에서 물리적 건물과 가문/가정을 함께 떠올릴 수 있는 가장 중립적인 표현을 택했습니다.
- source_word: χείλεσι ψιθυροῖς / ψιθύρων
  english_pob_choice: by whispering lips / whisperers
  chosen_korean: 훼방하는 입술 / 수군거리는 자들
  alternatives_korean:
  - 속삭이는 입술 / 속삭이는 자들
  - 중상하는 입술 / 중상자들
  lexicon: LSJ
  rationale: ψιθυρ- 어군이 단순한 낮은 목소리보다 은밀한 해코지성 언어를 가리킬 수 있으므로, 본문에는 이미지를 살리고 각주로 중상 가능성을 열어 두었습니다.
- source_word: ἀκάκων
  english_pob_choice: the innocent
  chosen_korean: 무죄한 자들
  alternatives_korean:
  - 순결한 자들
  - 흠 없는 자들
  lexicon: LSJ
  rationale: 도덕적 해가 없다는 뜻을 분명히 드러내기 위해 '무죄한 자들'로 옮겼습니다.
- source_word: φοβουμένων Κύριον
  english_pob_choice: those who fear the Lord
  chosen_korean: 주님을 경외하는 이들
  alternatives_korean:
  - 주님을 두려워하는 이들
  - 주님을 공경하는 이들
  lexicon: LSJ
  rationale: 성경적 관용구의 의미를 살리면서, 현대 한국어에서 경외의 종교적 뉘앙스를 분명하게 전했습니다.
theological_decisions:
- issue: 예언적/저주적 청원의 문체
  chosen_reading: 본문의 세 구문을 모두 '—하시기를 바랍니다' 형태의 청원으로 처리했습니다.
  alternative_readings:
  - 직설형 진술로 완화
  - 기원문형 '원하옵나이다' 사용
  rationale: 그리스어 옵타티브가 담는 간구·저주의 어조를 유지하되, 현대 합쇼체에 맞는 공적 기원문으로 옮겼습니다.
  doctrine_reference: 시편적 탄원과 심판 청원 문체
- issue: ψιθυροῖς의 윤리적 강도
  chosen_reading: '''훼방하는 입술''로 본문을 옮기고, 각주에 ''중상하는 입술'' 가능성을 남겼습니다.'
  alternative_readings:
  - '''속삭이는 입술''로 중립화'
  - '''중상하는 입술''을 본문에 반영'
  rationale: 문맥상 은밀하고 해로운 말의 뉘앙스가 강하므로, 단순한 속삭임으로 약화하지 않고도 해석 여지를 보존했습니다.
  doctrine_reference: 악한 말과 의인의 보호를 구하는 시편적 신학
