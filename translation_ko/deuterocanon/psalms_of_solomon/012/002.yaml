  source_fidelity: 원문의 두 절반, 곧 악인의 혀의 말이 ‘굽이침의 다양성’으로 특징지어지고 그의 καλλονή가 백성 가운데 붙어 가는 불에 비유된다는 구조는 대체로 보존되었습니다. 다만 ‘온갖 뒤틀린 굽음이 있으며’는 한국어 서술 연결이 부자연스럽고, ἀνάπτον의 진행상을 반영하는 주석 표기가 더 자연스럽게 다듬어질 필요가 있습니다.
  naturalness: ‘굽음’은 현대 표준어 성경 문체에서 매우 어색하며, ‘…이 있으며’도 말 자체의 성격을 나타내는 원문에 비해 느슨합니다. ‘온갖 뒤틀린 굽이침으로 가득하며’가 자연스럽고 원문의 비유적 굴곡 이미지를 유지합니다. 각주 표지는 해당 어휘 뒤에 배치하는 것이 독해와 표지 연결 면에서 적절합니다.
  terminology: ‘악한 사람’, ‘혀에서 나오는 말’, ‘아름다움’, ‘한 백성 가운데서’는 원문에 충실합니다. καλλονή는 ‘아름다움’으로 본문에 두고 ‘매력’을 각주 대안으로 제시하여 의미 범위를 보존할 수 있습니다. πῦρ ἀνάπτον은 수동의 ‘붙여진 불’이 아니라 현재 진행의 불이므로 ‘타오르는 불’ 및 ‘붙어 가는 불’이라는 대안이 적절합니다.
