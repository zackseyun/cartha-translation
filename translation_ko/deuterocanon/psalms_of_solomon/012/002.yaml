  text: ἐν ποικιλίᾳ στροφῆς οἱ λόγοι τῆς γλώσσης ἀνδρὸς πονηροῦ. ὥσπερ ἐν λαῷ πῦρ ἀνάπτον καλλονὴ αὐτοῦ·
