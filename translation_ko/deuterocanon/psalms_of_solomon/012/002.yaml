translation:
  language: ko
  text: 악한 사람의 혀에서 나오는 말은 온갖 뒤틀린 굽이침으로 가득하며[a], 그의 아름다움은 한 백성 가운데서 타오르는 불과 같습니다.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘굽이침의 다양성’으로 옮길 수 있습니다. 그리스어는 말이 이리저리 바뀌고 굽어지는 모습을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘매력’으로 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘붙어 가는 불’로 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ἐν ποικιλίᾳ στροφῆς
  english_pob_choice: full of twisted turns
  chosen_korean: 온갖 뒤틀린 굽음이 있으며
  alternatives_korean:
  - 뒤틀린 굽음으로 가득하며
  - 다양한 굽이침이 있으며
  - 이리저리 뒤틀린 말투를 지니며
  lexicon: LSJ
  rationale: ποικιλία와 στροφή의 결합은 단순한 ‘다양성’이 아니라 말의 변형·굴곡·교묘한 궤변을 가리키므로, 한국어에서는 의미를 풀어 ‘온갖 뒤틀린 굽음’으로 옮겨 변칙성과 왜곡의 이미지를 살렸습니다.
- source_word: οἱ λόγοι τῆς γλώσσης
  english_pob_choice: The words on the tongue
  chosen_korean: 혀에서 나오는 말은
  alternatives_korean:
  - 혀의 말은
  - 혀에 있는 말은
  - 혀가 내는 말은
  lexicon: LSJ
  rationale: 직역의 해부학적 이미지를 살리되 한국어로 자연스럽게 읽히도록 ‘혀에서 나오는 말’로 옮겼습니다. POB의 구체성을 유지하면서도 어색한 소유격 구조를 피했습니다.
- source_word: ἀνδρὸς πονηροῦ
  english_pob_choice: of an evil man
  chosen_korean: 악한 사람의
  alternatives_korean:
  - 악한 남자의
  - 사악한 사람의
  - 못된 사람의
  lexicon: LSJ
  rationale: πονηρός는 도덕적 악을 뜻하므로 ‘악한’이 가장 직접적입니다. 그리스어 남성 단수는 한국어에서 성별을 굳이 드러낼 필요가 없어 ‘사람’으로 옮겼습니다.
- source_word: καλλονὴ
  english_pob_choice: beauty / charm
  chosen_korean: 그 아름다움
  alternatives_korean:
  - 그 매력
  - 그 고움
  - 그 아름다워 보임
  lexicon: LSJ
  rationale: καλλονή는 외형적 아름다움만이 아니라 사람을 끌어당기는 매력성을 가리킬 수 있으나, 이 구절에서는 그 위장된 매혹이 위험의 통로가 되는 점이 중요하므로 ‘아름다움’으로 두고 문맥상 부정적 효과를 살렸습니다.
- source_word: πῦρ ἀνάπτον
  english_pob_choice: a fire kindling
  chosen_korean: 타오르는 불
  alternatives_korean:
  - 붙어가는 불
  - 붙기 시작하는 불
  - 점점 붙는 불
  lexicon: LSJ
  rationale: ἀνάπτον은 이미 붙은 불이 아니라 스스로 붙어가며 번지는 진행상을 나타내므로, 자연스러운 한국어 관용에 맞추어 ‘타오르는 불’로 옮겨 확산과 위험성을 드러냈습니다.
- source_word: ἐν λαῷ
  english_pob_choice: among a people
  chosen_korean: 한 백성 가운데서
  alternatives_korean:
  - 사람들 가운데서
  - 무리 가운데서
  - 백성 가운데서
  lexicon: LSJ
  rationale: anarthrous λαῷ의 집합적·일반적 성격을 살리기 위해 ‘한 백성’으로 두었고, 전치사 ἐν의 공간적 확산 이미지는 ‘가운데서’로 옮겼습니다.
theological_decisions:
- issue: 비교문의 이미지가 단순 비유인지, 공동체적 해악을 강조하는 경고인지
  chosen_reading: ‘한 백성 가운데서 타오르는 불’로 옮겨, 악인의 말이 공동체 전체에 번지는 위험을 강조했습니다.
  alternative_readings:
  - ‘사람들 가운데서 붙는 불’
  - ‘무리 가운데서 번지는 불’
  rationale: 원문은 개인의 언어가 집단 안에서 확산되는 파괴성을 묘사하므로, 한국어에서도 단순한 수사보다 사회적 피해의 긴장을 드러내는 방향이 본문의 힘을 더 잘 보존합니다.
  doctrine_reference: 잠언적 지혜문학의 경고 기능
- issue: καλλονή를 긍정적 ‘아름다움’으로 둘지 부정적 ‘매력/매혹’으로 둘지
  chosen_reading: 본문은 악인의 외양적 매혹이 불처럼 번지는 역설을 말하므로, ‘아름다움’을 쓰되 문맥 전체로 부정적 함의를 유지했습니다.
  alternative_readings:
  - ‘매력’
  - ‘아름다움 대신 매혹’
  rationale: POB의 audit trail이 ‘beauty/charm’의 긴장을 보존하고 있어, 어느 한쪽으로 고정하기보다 한국어에서는 ‘아름다움’으로 두어 문자적 대응을 확보하고 문맥으로 평가를 맡겼습니다.
  doctrine_reference: 지혜문학의 역설적 이미지
