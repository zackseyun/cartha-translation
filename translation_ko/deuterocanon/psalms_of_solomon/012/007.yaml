base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/012/007.yaml
  text: The Lord’s salvation be upon Israel[a], his servant[b], forever.
  footnotes:
  - marker: a
    text: Or “Israel, his child/son.” The Greek παῖδα can carry either sense, but “servant” best fits the covenantal context here.
    reason: lexical_alternative
  - marker: b
    text: Or 'is upon'.
    reason: previous_rendering
translation:
  language: ko
  text: 주님의 구원이 이스라엘[a], 그의 종[b] 위에 있기를, 영원히.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이스라엘, 그의 자녀/아들.” 그리스어 παῖς는 두 뜻을 가질 수 있지만, 여기서는 ‘종’이 언약적 문맥에 더 잘 맞습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “위에 있다/있습니다.” 문맥상 축원형으로 이해하는 것이 더 자연스럽습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: κυρίου
  english_pob_choice: the Lord’s
  chosen_korean: 주님의
  alternatives_korean:
  - 주께서의
  - 주의
  lexicon: BDAG
  rationale: γενitive를 소유·기원 관계로 자연스럽게 살려, 구원이 주님께 속하고 주님에게서 온다는 뜻을 유지했습니다.
- source_word: σωτηρία
  english_pob_choice: salvation
  chosen_korean: 구원
  alternatives_korean:
  - 구출
  - 구원의 은혜
  lexicon: BDAG
  rationale: 본문의 σωτηρία는 단순한 구조나 도움보다 넓은 종말론적·언약적 의미를 가지므로, 한국어에서도 가장 직접적인 ‘구원’으로 옮겼습니다.
- source_word: παῖδα
  english_pob_choice: servant
  chosen_korean: 종
  alternatives_korean:
  - 섬기는 자
  - 아들
  - 자녀
  lexicon: BDAG
  rationale: 영어 POB의 해석을 따르되, 이스라엘을 하나님의 언약 백성으로 부르는 문맥에서 ‘종’이 종속성과 섬김을 가장 분명하게 드러냅니다.
- source_word: ἐπὶ
  english_pob_choice: be upon
  chosen_korean: 위에 있기를
  alternatives_korean:
  - 위에 있습니다
  - 위에 임하기를
  lexicon: BDAG
  rationale: 주변 절들이 기원/소망 어조이므로, 한국어에서도 명시적 현재진술보다 축원형을 살려 ‘있기를’로 옮겼습니다.
theological_decisions:
- issue: 이스라엘에 대한 παῖς의 의미
  chosen_reading: 언약적 맥락에서 ‘이스라엘, 그의 종’으로 읽습니다.
  alternative_readings:
  - ‘이스라엘, 그의 자녀/아들’
  rationale: 영어 POB의 주해처럼 παῖς는 ‘자녀/아들’도 가능하지만, 이 문맥에서는 하나님께 대한 이스라엘의 의존과 봉사라는 언약적 뉘앙스가 더 강해 ‘종’을 택했습니다.
  doctrine_reference: 언약 백성/하나님의 종 표상
- issue: 문장 어조
  chosen_reading: 서술문이 아니라 축원·소망의 뉘앙스로 읽습니다.
  alternative_readings:
  - '단순한 진술: ‘주님의 구원이 이스라엘 위에 있습니다’'
  rationale: 주변 절들이 모두 optative 분위기의 기도문이므로, 이 절도 동일한 기원 어조로 이해해야 문맥의 흐름이 보존됩니다.
  doctrine_reference: 문맥적 화행(기도/축원)
