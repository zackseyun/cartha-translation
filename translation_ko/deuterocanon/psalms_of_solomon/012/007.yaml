  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: lxx-swete-1909
  text: τοῦ κυρίου ἡ σωτηρία ἐπὶ Ἰσραὴλ παῖδα αὐτοῦ εἰς τὸν αἰῶνα,
  language: Greek
  pages:
