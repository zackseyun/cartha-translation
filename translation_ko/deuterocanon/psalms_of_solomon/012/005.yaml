lexical_decisions:
- source_word: γλῶττα
  english_pob_choice: tongue
  chosen_korean: 혀
  alternatives_korean:
  - 말
  - 언어
  lexicon: 표준국어대사전
  rationale: 그리스어의 구체적 신체 이미지와 시적 압박을 살리기 위해 추상명사보다 ‘혀’를 택했습니다.
- source_word: ψιθύρων
  english_pob_choice: whisperers
  chosen_korean: 아첨꾼
  alternatives_korean:
  - 속삭이는 자들
  - 중상하는 자들
  - 수군거리는 자들
  lexicon: LSJ
  rationale: 문맥상 은밀히 사람을 해치는 말을 가리키므로, 한국어에서 함축이 살아 있는 ‘아첨꾼’을 택해 부정적 성격을 드러냈습니다. 영어 POB의 ‘whisperers’에 대한 대안적 독해는 각주로 남겼습니다.
- source_word: ἐν πυρὶ φλογός
  english_pob_choice: in flaming fire
  chosen_korean: 불꽃의 화염 속에서
  alternatives_korean:
  - 타오르는 불 속에서
  - 불타는 불 가운데서
  - 화염 속에서
  lexicon: LSJ
  rationale: 이중적 불 이미지(불/화염)를 한국어에서도 중첩되게 살려, 단순한 ‘불’보다 강한 시적 긴장을 유지했습니다.
- source_word: ὁσίων
  english_pob_choice: away from the devout
  chosen_korean: 경건한 이들로부터
  alternatives_korean:
  - 거룩한 이들로부터
  - 성도들로부터
  - 경건한 자들로부터
  lexicon: LSJ
  rationale: Psalms of Solomon에서 ὅσιοι는 ‘경건한/신실한 이들’의 집단을 가리키므로, ‘거룩한 이들’보다 사회적·종교적 의미가 더 분명한 ‘경건한 이들’을 택했습니다.
theological_decisions:
- issue: 저주형 기도문의 명령/청원 어조
  chosen_reading: 하나님께 드리는 청원형으로 처리해 ‘멸망하게 하시고… 멀리하게 하소서’라고 옮겼습니다.
  alternative_readings:
  - 직설적 저주문으로 ‘멸망하라’로 옮김
  - 간접화법으로 완화함
  rationale: 시편적 저주 기도의 기능을 보존하되, 한국어 예배체에서 자연스러운 청원형으로 재현했습니다.
  doctrine_reference: 시편적 탄원과 심판 청원 전통
- issue: ὁσίων의 집단 정체성
  chosen_reading: ‘경건한 이들’로 옮겨, 단순한 윤리적 ‘선한 사람들’이 아니라 언약적·종교적 충성 집단임을 드러냈습니다.
  alternative_readings:
  - ‘거룩한 이들’
  - ‘성도들’
  rationale: 이 책의 용례와 기존 POB audit trail에 따라 ὅσιοι를 ἅγιοι와 구별되는 범주로 유지했습니다.
  doctrine_reference: Psalms of Solomon lexical profile
