  source_fidelity: 수정이 필요합니다. ψιθύρων는 은밀히 속삭이거나 수군대며 헐뜯는 이들을 뜻하므로 ‘아첨꾼’은 어휘적으로 맞지 않습니다. 또한 ἀπὸ ὁσίων은 ‘경건한 이들에게서 멀리/떨어져’라는 범위를 이루며, 이를 별도의 ‘멀리하게 하소서’로 병렬 처리하면 원문의 통사 관계가 흐려집니다. ὅσιοι를 ‘경건한 이들’로 옮긴 선택은 적절합니다.
  naturalness: ‘불꽃이 이는 불 속에서’는 πυρὶ φλογός의 중첩된 불 이미지를 살리면서도 ‘불꽃의 화염’보다 자연스러운 현대 한국어입니다. ‘경건한 이들에게서 멀리 떨어져 멸망하게 하소서’는 저주 기도의 청원 어조와 ἀπό의 분리 의미를 자연스럽게 드러냅니다.
  terminology: γλῶττα는 비유적이면서도 구체적인 ‘혀’로 유지했습니다. ψιθύρων는 ‘수군거리는 자들’로 옮기고 ‘중상하는 자들’을 각주 대안으로 제시했습니다. ὁσίων는 이 문맥에서 ‘경건한 이들’이 적절하며, ‘거룩한 이들’은 어휘적 대안으로만 각주에 남깁니다.
