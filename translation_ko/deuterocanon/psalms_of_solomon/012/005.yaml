revisions:
- from: 아첨꾼의 혀가 불꽃의 화염 속에서 멸망하게 하시고, 경건한 이들로부터 멀리하게 하소서.[a][b][c]
  to: 수군거리는 자들[a]의 혀가 불꽃이 이는 불 속에서 경건한 이들[b]에게서 멀리 떨어져 멸망하게 하소서.
  rationale: ‘아첨꾼’을 ψιθύρων의 기본 의미에 맞는 ‘수군거리는 자들’로 바로잡았습니다. ‘불꽃이 이는 불’은 πυρὶ φλογός의 강조된 불 이미지를 보존합니다. ἀπὸ ὁσίων은 ‘경건한 이들에게서 멀리 떨어져’로 연결하여 원문의 분리 의미를 유지했고, 근거 없이 본문 전통을 주장하던 각주 c는 삭제했습니다.
