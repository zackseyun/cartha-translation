id: PSS.12.8
reference: Psalms of Solomon 12:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: lxx-swete-1909
  text: καὶ ἀπόλοιντο οἱ ἁμαρτωλοὶ ἀπὸ προσώπου Κυρίου ἅπαξ, καὶ ὅσιοι Κυρίου κληρονομήσαισαν ἐπαγγελίας.
  language: Greek
  pages:
  - 802
  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/012/008.yaml
  text: May the sinners perish from the presence of the Lord once for all[c][b][a], and may the devout of the Lord inherit the promises.
  footnotes:
  - marker: a
    text: Or 'the holy ones of the Lord' or 'the faithful of the Lord.'
    reason: lexical_alternative
  - marker: b
    text: Or simply 'once'; the Greek may emphasize either singular occurrence or finality.
    reason: lexical_alternative
  - marker: c
    text: Or 'May sinners perish'.
    reason: previous_rendering
translation:
  language: ko
  text: 죄인들이 주님 앞에서 단번에 멸망하게 하시고, 주님의 경건한 이들이 약속을 유업으로 받게 하소서.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '주님의 거룩한 이들' 혹은 '주님의 신실한 이들'입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 단순히 '한 번'입니다. 그리스어는 단회성이나 최종성을 모두 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '죄인들이 멸망하게 하소서'입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: οἱ ἁμαρτωλοὶ
  english_pob_choice: the sinners
  chosen_korean: 죄인들
  alternatives_korean:
  - 악인들
  - 죄인들 무리
  lexicon: BDAG
  rationale: 단순한 도덕적 추상어보다 정관사 있는 집단 표지를 살려, 특정한 대립 집단을 가리키는 뉘앙스를 유지했습니다.
- source_word: ἀπὸ προσώπου Κυρίου
  english_pob_choice: from the presence of the Lord
  chosen_korean: 주님의 앞에서
  alternatives_korean:
  - 주님의 임재에서
  - 주님의 얼굴 앞에서
  lexicon: BDAG
  rationale: 직역의 '얼굴'보다 현대 한국어에서는 '앞에서'가 자연스럽고, 심판적 대면의 의미를 과도하게 풀지 않으면서 보존합니다.
- source_word: ἅπαξ
  english_pob_choice: once for all
  chosen_korean: 한 번에
  alternatives_korean:
  - 한 번만
  - 영원히
  lexicon: BDAG
  rationale: 문맥상 단순한 일회성보다 종결성과 단호함이 중요하므로, '한 번에'로 압축해 최종성을 살렸습니다.
- source_word: ὅσιοι Κυρίου
  english_pob_choice: the devout of the Lord
  chosen_korean: 주님의 경건한 이들
  alternatives_korean:
  - 주님의 거룩한 이들
  - 주님의 신실한 이들
  lexicon: BDAG
  rationale: '''ὅσιοι''의 경건/경외의 성격을 살리되, ''성도''처럼 교회적 용어로 고정하지 않고 문맥의 대조를 드러냈습니다.'
- source_word: κληρονομήσαισαν ἐπαγγελίας
  english_pob_choice: may inherit the promises
  chosen_korean: 약속을 유업으로 받게 하소서
  alternatives_korean:
  - 약속들을 상속받게 하소서
  - 약속을 받게 하소서
  lexicon: BDAG
  rationale: κληρονομέω의 유업/상속 이미지를 한국어의 '유업으로 받다'로 살려, 단순한 수령보다 언약적 계승을 드러냈습니다.
theological_decisions:
- issue: ἁμαρτωλοὶ를 일반적 '죄인'으로 옮길지, 특정 집단 표지를 살릴지
  chosen_reading: '''죄인들''로 옮기되, 정관사로 집단성을 드러내는 방식으로 유지했습니다.'
  alternative_readings:
  - '''죄 있는 사람들'''
  - '''죄인 무리'''
  rationale: 시의 문맥상 도덕적 범주이면서도 집단적 공격어로 기능하므로, 의미를 약화시키지 않는 선에서 가장 직설적인 표현을 택했습니다.
  doctrine_reference: 본문의 시적·정치적 저주 시편 문맥
- issue: ἅπαξ의 의미를 단순 일회성으로 볼지, 최종적 종결로 볼지
  chosen_reading: '''한 번에''로 번역해 단회성과 종결성을 함께 암시했습니다.'
  alternative_readings:
  - '''한 번만'''
  - '''한 번뿐'''
  rationale: 영어 POB가 'once for all'을 택한 이유처럼, 여기서는 단순 수량보다 최종 판결의 뉘앙스가 강하므로 그 힘을 한국어에서도 유지했습니다.
  doctrine_reference: 저주/탄원 시의 종결적 심판 표현
