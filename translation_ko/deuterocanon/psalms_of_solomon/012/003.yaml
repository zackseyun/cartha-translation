  rationale: παροικία는 단순한 ‘집’이 아니라 머무름·거처·나그네로서의 체류를 가리킬 수 있어, 문맥상 자연스러운 ‘거처’로 옮기되 원문의 명사구 구조를 살렸습니다.
- source_word: ἐμπλῆσαι οἴκους
