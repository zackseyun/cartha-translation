base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/012/003.yaml
  text: His dwelling is to fill houses with a lying tongue[a], to cut down trees of gladness[d][c][b], flaming against the lawless.
  footnotes:
  - marker: a
    text: Or 'his sojourning' or 'his lodging'; the Greek noun speaks of dwelling or residing, often as a stranger.
    reason: lexical_alternative
  - marker: b
    text: Literally 'trees of gladness'; the image is likely metaphorical for what makes a household flourish or rejoice.
    reason: cultural_note
  - marker: c
    text: The final phrase is compressed in Greek; 'inflaming the lawless' could also be rendered 'setting the lawless ablaze.'
    reason: alternative_reading
  - marker: d
    text: Or 'Where he lodges, he fills houses with a lying tongue, cutting down trees of gladness and inflaming the lawless.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그의 거처는 거짓된 혀로 집들을 채우고, 기쁨의 나무들을 찍어 내리며, 율법 없는 자들을 향해 타오릅니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거처’는 여기서 단순한 주거지보다, 낯선 이로서 머무는 체류의 뉘앙스까지 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘기쁨의 나무들’은 문자적 표현이지만, 집안의 번영이나 기쁨을 상징하는 비유일 가능성이 큽니다.
    reason: cultural_note
  - marker: c
    text: 마지막 구는 그리스어가 압축되어 있어, ‘율법 없는 자들을 향해 타오르다’처럼 옮길 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἡ παροικία αὐτοῦ
  english_pob_choice: His dwelling
  chosen_korean: 그의 거처는
  alternatives_korean:
  - 그의 체류는
  - 그의 나그네살이는
  - 그의 거주지는
  lexicon: LSJ
  rationale: παροικία는 단순한 ‘집’이 아니라 머무름·거처·나그네로서의 체류를 가리킬 수 있어, 문맥상 자연스러운 ‘거처’로 옮기되 원문의 명사구 구조를 살렸습니다.
- source_word: ἐμπλῆσαι οἴκους
  english_pob_choice: to fill houses
  chosen_korean: 집들을 채우고
  alternatives_korean:
  - 가옥들을 채우고
  - 가정들을 채우고
  lexicon: LSJ
  rationale: οἴκους는 문자적으로 ‘집들’이지만 가정 공동체까지 포함할 수 있습니다. 본문이 구체적 이미지로 말하므로 ‘집들’을 유지했습니다.
- source_word: ἐν γλώσσῃ ψεύδει
  english_pob_choice: with a lying tongue
  chosen_korean: 거짓된 혀로
  alternatives_korean:
  - 거짓말하는 혀로
  - 속이는 혀로
  - 거짓된 말로
  lexicon: LSJ
  rationale: 혀라는 신체 이미지를 보존해, 속임수의 도구가 말 자체보다 ‘혀’임을 드러냈습니다.
- source_word: ἐκκόψαι δένδρα εὐφροσύνης
  english_pob_choice: cutting down trees of gladness
  chosen_korean: 기쁨의 나무들을 찍어 내리며
  alternatives_korean:
  - 기쁨의 나무들을 베어 내리며
  - 즐거움의 나무들을 찍어 내리며
  lexicon: LSJ
  rationale: ἐκκόψαι의 강한 절단 의미를 살려 ‘찍어 내리다’로 옮겼고, δένδρα를 상징적 표현이더라도 ‘나무들’로 남겨 원문 이미지를 보존했습니다.
- source_word: φλογίζούσης παρανόμους
  english_pob_choice: flaming against the lawless
  chosen_korean: 율법 없는 자들을 향해 타오릅니다
  alternatives_korean:
  - 율법 없는 자들을 불태우며
  - 율법 없는 자들을 향해 불타오릅니다
  lexicon: LSJ
  rationale: 전승된 그리스어에서 φλογίζούσης는 앞의 여성 단수 속격 명사구에 종속되는 분사로 보아야 하므로, 주어의 또 다른 동작으로 풀지 않고 ‘~을 향해 타오르다’로 압축된 종속성을 살렸습니다.
theological_decisions:
- issue: φλογίζούσης의 문법적 종속성
  chosen_reading: ‘타오릅니다’는 주어의 별도 행위가 아니라, 앞의 표현 전체가 만들어 내는 파괴적 이미지의 종결로 이해했습니다.
  alternative_readings:
  - ‘율법 없는 자들을 불태우며’처럼 분사구를 직접 연결
  - ‘율법 없는 자들에게 불을 지르며’처럼 더 강하게 의역
  rationale: 그리스어 형태상 φλογίζούσης는 앞의 여성 속격 명사구에 걸리는 분사이므로, 주체의 병렬 동작으로 오해하지 않도록 번역해야 합니다.
  doctrine_reference: 문법-구문 해석
- issue: 파괴적 비유의 보존
  chosen_reading: ‘기쁨의 나무들’은 해설로 환원하지 않고 상징적 이미지를 그대로 유지했습니다.
  alternative_readings:
  - ‘가정의 번영을 무너뜨리며’처럼 의미를 풀어 쓰기
  - ‘기쁨을 주는 것들을 베어 내리며’처럼 완화하기
  rationale: 원문은 구체적 이미지로 악인의 파괴성을 묘사하므로, 독자가 그 긴장을 느낄 수 있도록 은유를 보존하는 편이 source-direct합니다.
  doctrine_reference: 시적 은유 보존
