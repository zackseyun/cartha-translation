base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/012/003.yaml
  text: His dwelling is to fill houses with a lying tongue[a], to cut down trees of gladness[d][c][b], flaming against the lawless.
  footnotes:
  - marker: a
    text: Or 'his sojourning' or 'his lodging'; the Greek noun speaks of dwelling or residing, often as a stranger.
    reason: lexical_alternative
  - marker: b
    text: Literally 'trees of gladness'; the image is likely metaphorical for what makes a household flourish or rejoice.
    reason: cultural_note
  - marker: c
    text: The final phrase is compressed in Greek; 'inflaming the lawless' could also be rendered 'setting the lawless ablaze.'
    reason: alternative_reading
  - marker: d
    text: Or 'Where he lodges, he fills houses with a lying tongue, cutting down trees of gladness and inflaming the lawless.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그의 체류란 거짓된 혀로 집들을 채우고, 율법 없는 자들을 불태우는 기쁨의 나무들을 베어 내는 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘체류’는 단순한 주거지보다, 낯선 이로서 머무르거나 거주하는 뉘앙스도 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘기쁨의 나무들’은 문자적 표현입니다. 집안의 번영이나 기쁨을 상징하는 비유일 가능성이 있지만, 본문은 그 이미지를 그대로 사용합니다.
    reason: cultural_note
  - marker: c
    text: 마지막 표현은 전승된 그리스어에서 압축되고 다소 난해합니다. 여성 단수 속격 분사는 문법상 ‘기쁨’에 연결되어 ‘율법 없는 자들을 불태우는 기쁨’으로 읽는 것이 가장 직접적입니다. ‘불을 붙이는’ 또는 ‘불길로 휩싸는’으로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἡ παροικία αὐτοῦ
  english_pob_choice: His dwelling
  chosen_korean: 그의 거처는
  alternatives_korean:
