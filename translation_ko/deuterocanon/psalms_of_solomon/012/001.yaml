base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/012/001.yaml
  text: Lord[a], deliver my soul from a lawless and wicked man, from a lawless and whispering tongue, speaking falsehood and deceit[c][b];
  footnotes:
  - marker: a
    text: Or 'from the tongue of a lawless slanderer.'
    reason: lexical_alternative
  - marker: b
    text: '''My soul'' could also be rendered ''my life'' or simply ''me.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'from the tongue of a lawless whisperer'.
    reason: previous_rendering
translation:
  language: ko
  text: 주님, 불법한 자와 악한 자에게서, 불법하고 속삭이는 혀에게서, 거짓과 속임을 말하는 혀에게서 제 영혼을 건져 주십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 "법 없는/불법한 사람"입니다.
    reason: lexical_alternative
  - marker: b
    text: '"제 영혼"은 "제 생명" 또는 단순히 "저를"로도 옮길 수 있습니다.'
    reason: lexical_alternative
  - marker: c
    text: 또는 "불법한 속삭임꾼의 혀에게서"로도 볼 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주여
  - 주
  lexicon: κύριος
  rationale: 하나님께 드리는 직접 호칭이므로 한국어 기도문에서 자연스럽고 공경적인 "주님"으로 옮겼습니다.
- source_word: ῥῦσαι
  english_pob_choice: deliver
  chosen_korean: 건져 주십시오
  alternatives_korean:
  - 구해 주십시오
  - 구원해 주십시오
  lexicon: ῥύομαι
  rationale: 위험한 상황에서 건져 내 달라는 간구이므로, 현대 한국어 기도체에서 간결하고 생생한 "건져 주십시오"가 적절합니다.
- source_word: τὴν ψυχήν μου
  english_pob_choice: my soul
  chosen_korean: 제 영혼
  alternatives_korean:
  - 제 생명
  - 저를
  lexicon: ψυχή
  rationale: ψυχή의 영적·내적 무게를 살리기 위해 기본값인 "영혼"을 유지하되, 한국어 문맥에 맞게 소유 표현은 공손하게 처리했습니다.
- source_word: ἀπὸ γλώσσης παρανόμου καὶ ψιθυροῦ καὶ λαλούσης ψευδῆ καὶ δόλια
  english_pob_choice: from a lawless and whispering tongue, speaking falsehood and deceit
  chosen_korean: 불법하고 속삭이는 혀에게서, 거짓과 속임을 말하는 혀에게서
  alternatives_korean:
  - 불법하고 수군거리는 혀에게서, 거짓과 속임을 말하는 혀에게서
  - 불법하고 비방하는 혀에게서, 거짓과 속임을 말하는 혀에게서
  lexicon: γλῶσσα / ψιθυρός / ψευδῆ / δόλια
  rationale: 원문의 구체적 신체 이미지인 "혀"를 살리고, παρανόμου와 ψιθυροῦ를 혀를 꾸미는 형용사로 처리했습니다. ψιθυροῦ는 주해상 "속삭이는"이 문맥과 구문을 가장 सीधे하게 반영하며, ψευδῆ καὶ δόλια는 "거짓과 속임"으로 간결하게 옮겼습니다.
theological_decisions:
- issue: 호칭의 공손한 기도체 처리
  chosen_reading: 직접 호소하는 기도이므로 하나님께 대한 한국어 공손체 청원을 사용했습니다.
  alternative_readings:
  - 주여, ...
  - 오 주님, ...
  rationale: 원문은 간구형 명령문이지만, 한국어 합쇼체에서는 "주님... 주십시오"가 자연스럽고 경건한 기도문 톤을 유지합니다.
  doctrine_reference: 기도 언어와 신적 호칭의 화용론
