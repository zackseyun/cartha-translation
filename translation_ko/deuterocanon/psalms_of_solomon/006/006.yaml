  lexicon: ἐξανίστημι / ὕπνος
  rationale: 영어 POB의 ‘woke’를 따라 수면 상태에서 깨어난 동작을 자연스럽게 살리되, 단순히 자리를 ‘일어났다’보다 원문의 의미를 더 직접적으로 드러냈습니다.
- source_word: ἐυλόγησεν
  english_pob_choice: blessed
  chosen_korean: 찬양했습니다
  alternatives_korean:
  - 축복했습니다
  - 복을 빌었습니다
  - 찬송했습니다
  lexicon: εὐλογέω
  rationale: 문맥상 ‘주님의 이름’에 대한 인간의 응답으로서 축복/찬양의 의미가 있으므로, 한국어에서 자연스럽고 예배적 함의를 살리는 ‘찬양했습니다’를 택했습니다.
- source_word: τῷ ὀνόματι Κυρίου
  english_pob_choice: the name of the Lord
  chosen_korean: 주님의 이름
  alternatives_korean:
  - 주님의 이름을
  - 야훼의 이름
  - 주 이름
  lexicon: ὄνομα / κύριος
  rationale: 소유격 구조를 한국어로 자연스럽게 옮겨 ‘주님의 이름’으로 표현했으며, 여기서 κύριος는 본문 전승상 일반 호칭이므로 문맥상 ‘주님’으로 렌더링했습니다.
theological_decisions:
- issue: εὐλόγησεν의 의미를 ‘복을 빌다’로 좁힐지, 더 넓은 예배적 반응으로 옮길지
  chosen_reading: 이 절에서는 하나님께 드리는 언어행위로서 ‘찬양했습니다’로 옮겼습니다.
  alternative_readings:
  - 축복했습니다
  - 복을 빌었습니다
  rationale: 대상은 ‘주님의 이름’이며, 한국어에서 인간이 하나님을 향해 ‘축복하다’는 표현은 다소 어색할 수 있어, 원문의 경배적 방향을 유지하는 번역을 선택했습니다.
  doctrine_reference: 시 103:1의 찬송/복되심 어휘와 일반적인 예배 언어의 관용
