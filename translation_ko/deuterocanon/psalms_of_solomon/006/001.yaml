base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/006/001.yaml
  text: Blessed is the man whose heart is ready to call on the name of the Lord[a][b].
  footnotes:
  - marker: a
    text: Or 'ready to invoke the name of the Lord.'
    reason: lexical_alternative
  - marker: b
    text: '''Man'' renders a masculine singular Greek form used here in a representative sense; alternatively, ''person.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 복되도다, 그의 마음이 주님의 이름을 부르기에 준비된 사람은[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '주님의 이름을 불러내기에 준비된'으로 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 남성 단수형은 대표적 용법으로 쓰였으므로, '사람'으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριος
  english_pob_choice: Blessed
  chosen_korean: 복되도다
  alternatives_korean:
  - 복이 있습니다
  - 복된 사람은
  lexicon: BDAG
  rationale: 지혜문학적·축복 선언의 어조를 살리기 위해 감탄형으로 옮겼습니다. 현대 문장에서도 자연스럽고, 단순한 상태 묘사보다 선언적 힘을 유지합니다.
- source_word: ἀνὴρ
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 남자
  - 인간
  lexicon: BDAG
  rationale: 영어 POB가 대표적 남성형을 주석으로 처리한 것처럼, 한국어 본문에서는 표지 언어보다 대표성을 우선해 '사람'으로 옮기고 성별 뉘앙스는 각주로 보완했습니다.
- source_word: ἐπικαλέσασθαι
  english_pob_choice: to call on
  chosen_korean: 부르기에
  alternatives_korean:
  - 부르짖기에
  - 호명하기에
  - 호소하기에
  lexicon: BDAG
  rationale: 문맥상 주님의 이름을 향한 예배적·신앙적 호명을 가리키므로, 한국어에서는 자연스럽고 간결한 '부르다' 계열로 처리했습니다.
- source_word: τὸ ὄνομα Κυρίου
  english_pob_choice: the name of the Lord
  chosen_korean: 주님의 이름
  alternatives_korean:
  - 주님의 이름을
  - 주님의 명칭
  - 주님의 권위
  lexicon: BDAG
  rationale: '''이름''을 ''권위'' 등으로 풀지 않고 그대로 유지해, 본문의 신학적 밀도를 보존했습니다. Κυρίου는 프로젝트 관례에 따라 ''주님''으로 번역했습니다.'
theological_decisions:
- issue: 복 선언의 문체
  chosen_reading: 첫 어절을 '복되도다'로 옮겨, 선언적 축복 문장의 성격을 살렸습니다.
  alternative_readings:
  - 복된 사람은
  - 복이 있습니다
  rationale: 히브리적 지혜문학/시편적 축복 공식의 어조를 살리기 위해, 단순 설명문보다 선언형이 더 적합합니다.
  doctrine_reference: 시편 1:1 계열의 복 선언 문체
- issue: 대표적 남성형 ἀνήρ의 처리
  chosen_reading: 본문은 '사람'으로 번역하고, 남성 단수형의 대표성은 각주로 밝힙니다.
  alternative_readings:
  - 남자는
  - 한 남자는
  rationale: 영어 POB의 주석을 따라 성별 표지보다 대표적 일반성을 우선하되, 원문의 문법적 형태는 지워지지 않도록 주석으로 보존했습니다.
  doctrine_reference: 대표적 남성형 언어의 번역 원칙
