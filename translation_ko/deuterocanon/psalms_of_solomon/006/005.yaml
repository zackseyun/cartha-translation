base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/006/005.yaml
  text: His soul will not be terrified at the crossing of rivers and the tossing of seas[a][b][c].
  footnotes:
  - marker: a
    text: Or 'His life' or 'His very self' for 'His soul.'
    reason: lexical_alternative
  - marker: b
