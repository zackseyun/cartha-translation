    reason: lexical_alternative
  - marker: b
    text: ‘바다의 요동’은 ‘바다의 출렁임’ 또는 ‘바다의 격랑’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘두려움에 떨지 않을 것입니다’는 ‘겁에 질리지 않을 것입니다’로도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ψυχή
  english_pob_choice: soul
  chosen_korean: 영혼
  alternatives_korean:
  - 목숨
  - 생명
  - 자기
  lexicon: BDAG
  rationale: ψυχή는 문맥상 내면의 생명 또는 인격 전체를 가리킬 수 있으므로, 시적 문맥의 높임과 깊이를 살리기 위해 ‘영혼’으로 옮겼습니다.
- source_word: διαβάσει
  english_pob_choice: crossing
  chosen_korean: 강을 건너는 일
  alternatives_korean:
  - 건넘
  - 도하
  - 나루
  lexicon: LSJ
  rationale: διάβασις는 강을 건너는 행위나 통과를 뜻하므로, 자연스럽고 현대적인 표현인 ‘강을 건너는 일’로 풀었습니다.
- source_word: σάλῳ
  english_pob_choice: tossing
  chosen_korean: 요동
  alternatives_korean:
  - 뒤흔들림
  - 출렁임
  - 일렁임
  lexicon: LSJ
  rationale: σάλος는 바다의 거친 흔들림과 동요를 가리키므로, 물결의 불안정한 움직임을 담는 ‘요동’을 택했습니다.
- source_word: πτοηθήσεται
  english_pob_choice: will not be terrified
  chosen_korean: 두려워하지 않을 것입니다
  alternatives_korean:
  - 겁내지 않을 것입니다
  - 무서워하지 않을 것입니다
  - 떨지 않을 것입니다
  lexicon: LSJ
  rationale: πτοέω는 단순한 두려움보다 더 강한 겁먹음·동요의 뉘앙스가 있지만, 한국어에서는 과도하게 중첩된 표현보다 예측 가능한 시적 문장으로 ‘두려워하지 않을 것입니다’를 사용했습니다.
theological_decisions:
- issue: 시편적 평행법에서 위험의 이미지와 인물의 내적 확신을 어떻게 살릴지
  chosen_reading: ‘강을 건너는 일과 바다의 요동’이라는 외적 위험과 ‘두려워하지 않을 것입니다’라는 내적 확신을 대비시켰습니다.
  alternative_readings:
  - ‘강의 건넘과 바다의 출렁임’
  - ‘강을 지나는 것과 바다의 격랑’
  rationale: 본문은 여행의 위험을 병렬적으로 제시하고 그 앞에서도 두려움이 없음(οὐ πτοηθήσεται)을 강조하므로, 의미 대비가 분명한 문장 구조를 유지했습니다.
  doctrine_reference: 시적 신뢰와 보호의 주제
