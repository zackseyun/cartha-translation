source:
  edition: lxx-swete-1909
  text: καὶ Κύριος εἰσήκουσεν προσευχὴν παντὸς ἐν φόβῳ θεοῦ, καὶ πᾶν αἴτημα ψυχῆς ἐλπιζούσης πρὸς αὐτὸν ἐπιτελεῖ ὁ κύριος.
  language: Greek
  pages:
