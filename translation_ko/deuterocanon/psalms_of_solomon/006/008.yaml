base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/006/008.yaml
  text: And the Lord hears the prayer of everyone in the fear of God[b][a], and the Lord fulfills every request of a soul that hopes in him.
  footnotes:
  - marker: a
    text: 'Or ''every request of a person that hopes in him.'' Greek: ''of a soul.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'has heard the prayer of everyone who fears God'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 주님께서는 하나님을 경외하는 사람의 기도를 들으시며, 자신을 향해 소망을 두는 영의 모든 요청을 주님께서 이루십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “영혼”의 요청으로 옮길 수 있습니다. 헬라어는 ‘영혼/영/생명’을 뜻할 수 있는 ψυχή를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “하나님을 경외하는 모든 사람의 기도를 들으십니다”로 옮길 수 있습니다. 헬라어는 격언적 현재로 읽히기도 합니다.
    reason: previous_rendering
lexical_decisions:
- source_word: Κύριος / ὁ κύριος
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주인
  lexicon: LEH, LSJ
  rationale: κύρι리는 본문에서 하나님의 주권적 칭호로 쓰였으므로 한국어에서는 경배적 호칭인 주님으로 옮겼습니다. 두 절에서 반복되는 주어를 그대로 살려 강조를 유지했습니다.
- source_word: εἰσήκουσεν
  english_pob_choice: hears
  chosen_korean: 들으시며
  alternatives_korean:
  - 들으십니다
  - 들으셨습니다
  lexicon: LEH, LSJ
  rationale: 영문 개정본이 지적한 바와 같이 이 aorist는 지시적 완료보다 격언적 현재로 읽는 것이 자연스러워, 한국어도 현재적 서술인 들으시며로 처리했습니다.
- source_word: παντὸς ἐν φόβῳ θεοῦ
  english_pob_choice: everyone in the fear of God
  chosen_korean: 하나님을 경외하는 사람
  alternatives_korean:
  - 하나님을 두려워하는 사람
  - 하나님 경외 안에 있는 사람
  lexicon: LEH, LSJ
  rationale: 직역하면 '하나님 경외 안에 있는'이지만 한국어에서 자연스럽지 않아, 문맥의 뜻을 살려 경외의 자세를 지닌 사람으로 옮겼습니다. '경외하다'는 두려움과 경배를 함께 담을 수 있습니다.
- source_word: ψυχῆς
  english_pob_choice: soul
  chosen_korean: 영
  alternatives_korean:
  - 혼
  - 목숨
  - 사람
  lexicon: LEH, LSJ
  rationale: 영어 본문은 'soul'을 유지하고 대안으로 'person'을 제시하지만, 한국어에서는 본문의 내적·신앙적 실재를 드러내는 영이 가장 직접적입니다. 다만 이 선택은 해석을 수반하므로 본문 의미를 해치지 않는 범위에서 유지했습니다.
- source_word: ἐλπιζούσης πρὸς αὐτόν
  english_pob_choice: that hopes in him
  chosen_korean: 자신을 향해 소망을 두는
  alternatives_korean:
  - 그를 바라는
  - 그에게 소망하는
  lexicon: LEH, LSJ
  rationale: πρὸς αὐτόν의 방향성을 살려 단순한 믿음보다 향해 소망을 두는으로 옮겼습니다. 이는 지속적인 의존과 기대를 드러냅니다.
- source_word: ἐπιτελεῖ
  english_pob_choice: fulfills
  chosen_korean: 이루십니다
  alternatives_korean:
  - 성취하십니다
  - 완성하십니다
  lexicon: LEH, LSJ
  rationale: 요청을 대상으로 하는 동사이므로 '이루다'가 한국어에서 가장 자연스럽고도 결과성을 잘 드러냅니다. '성취하다'보다 기도 응답의 문맥에 더 직접적입니다.
theological_decisions:
- issue: ‘주님’ 반복과 격언적 현재의 신학적 어조
  chosen_reading: 본 절은 특정 사건의 회상이 아니라 하나님이 언제나 그러하심을 말하는 격언적 진술로 읽어, 두 동사를 현재형으로 두고 주님을 반복했습니다.
  alternative_readings:
  - 과거 완료적 진술로 읽기
  - 첫 절과 둘째 절의 주어 반복을 줄여 매끈하게 처리하기
  rationale: 히브리적 지혜 문장과 평행 구조를 보존하려면 시간상을 일반화하고 반복을 살리는 편이 본문의 신학적 무게를 더 정확히 전달합니다.
  doctrine_reference: 시편적 격언 문체, 하나님의 지속적 섭리
