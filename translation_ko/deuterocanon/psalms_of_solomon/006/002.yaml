translation:
  language: ko
  text: 그가 주님의 이름을 기억할 때에 구원을 받을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῷ μνημονεύειν
  english_pob_choice: When he remembers
  chosen_korean: …을 기억할 때에
  alternatives_korean:
  - …을 기억하면서
  - …을 기억함으로
  lexicon: BDAG
  rationale: ἐν τῷ + 부정사는 여기서 시간적 의미가 자연스러우므로, 한국어도 ‘~할 때에’로 옮겨 원문의 시점을 분명하게 살렸습니다.
- source_word: αὐτὸν
  english_pob_choice: he
  chosen_korean: 그가
  alternatives_korean:
  - 그를
  lexicon: Greek grammar / BDAG
  rationale: αὐτόν은 단순 목적어가 아니라 부정사의 행위자(주어)로 보는 것이 문맥상 자연스러우므로, 한국어 주어로 처리했습니다.
- source_word: τὸ ὄνομα Κυρίου
  english_pob_choice: the name of the Lord
  chosen_korean: 주님의 이름
  alternatives_korean:
  - 주님의 이름을
  - 주님의 명성
  lexicon: BDAG
  rationale: ‘이름’의 직역을 유지하되, 한국어에서는 소유격 구조인 ‘주님의 이름’이 가장 자연스럽고 본문의 신학적 무게도 잘 보존합니다.
- source_word: σωθήσεται
  english_pob_choice: will be saved
  chosen_korean: 구원을 받을 것입니다
  alternatives_korean:
  - 구원받을 것입니다
  - 구출될 것입니다
  - 보전될 것입니다
  lexicon: BDAG
  rationale: σῴζω의 미래 수동은 ‘구원받다/구원을 받다’가 가장 넓고도 본문의 종교적 의미를 살립니다. ‘구출’은 다소 협소합니다.
theological_decisions:
- issue: σωθήσεται의 구원/구출 뉘앙스
  chosen_reading: ‘구원을 받을 것입니다’로 번역해 구원의 종교적·언약적 의미를 유지했습니다.
  alternative_readings:
  - ‘구출될 것입니다’
  - ‘보전될 것입니다’
  rationale: 시편 솔로몬의 문맥에서 σῴζω는 단순한 물리적 구출보다 하나님이 주시는 구원의 완결을 가리키는 말로 읽는 것이 더 적절합니다.
  doctrine_reference: 구원론 / 성경어휘의 문맥적 의미
