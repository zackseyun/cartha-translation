    text: 직역하면 ‘주님의 얼굴’로, 여기서는 하나님의 호의와 임재를 가리키는 관용구입니다.
    reason: source_note
lexical_decisions:
- source_word: ἐν εὐφρίᾳ καρδίας αὐτοῦ
  english_pob_choice: With gladness in his heart
  chosen_korean: 그의 마음에 기쁨이 가득하여
  alternatives_korean:
  - 그의 마음에 즐거움이 있어
  - 그의 마음에 환희가 있어
  lexicon: BDAG
  rationale: εὐφρίᾳ는 단순 감정보다 밝은 기쁨의 상태를 가리키므로, 한국어에서는 자연스럽고 격조 있는 ‘기쁨이 가득하여’로 풀어 원문의 분위기를 살렸습니다.
- source_word: ἐξύμνησεν
  english_pob_choice: sang praise
  chosen_korean: 찬양하였고
  alternatives_korean:
  - 노래로 찬양하였고
  - 찬미하였고
  - 송축하였고
  lexicon: BDAG
  rationale: 동사는 단순한 ‘칭찬’보다 찬양 행위를 뜻하므로, 한국어에서는 간결한 ‘찬양하다’를 택하되, 원문의 높임과 예배적 성격을 유지했습니다.
- source_word: τῷ ὀνόματι τοῦ θεοῦ
  english_pob_choice: to the name of God
  chosen_korean: 하나님의 이름을
  alternatives_korean:
  - 하나님의 이름에
  - 하나님의 이름을
  lexicon: BDAG
  rationale: 원문은 하나님 자체가 아니라 ‘이름’을 분명히 말하므로, 한국어에서도 ‘하나님의 이름’을 유지해 경외의 대상과 표현을 보존했습니다.
- source_word: τοῦ προσώπου Κυρίου
  english_pob_choice: the Lord / the face of the Lord
  chosen_korean: 주께
  alternatives_korean:
  - 주님의 얼굴을
  - 주님의 임재 앞에
  lexicon: BDAG
  rationale: δοέομαι가 요구하는 목적어 구조와 히브리식 관용구를 살리되, 본문에서는 자연스러운 한국어로 ‘주께 간구하다’로 옮겼습니다.
theological_decisions:
- issue: τοῦ προσώπου Κυρίου의 관용구 처리
  chosen_reading: ‘주께 간구하였습니다’로 자연스럽게 옮기고, 본문 안에서는 ‘얼굴’ 표현을 반복하지 않았습니다.
  alternative_readings:
  - ‘주님의 얼굴을 간구하였습니다’
  - ‘주님의 임재 앞에서 간구하였습니다’
  rationale: 그리스어는 문자적으로 ‘주의 얼굴’을 뜻하지만, 여기서는 히브리식으로 하나님의 호의를 구한다는 의미가 핵심입니다. 한국어 본문은 의미를 자연스럽게 전달하고, 관용구의 직역 가능성은 번역 검토에서 보존합니다.
  doctrine_reference: κύριος의 경외적 호칭 처리와 히브리적 관용구(‘하나님의 얼굴을 구하다’)
