base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/006/009.yaml
  text: Blessed is the Lord[a], who shows mercy to those who love him in truth.
  footnotes:
  - marker: a
    text: Or “truly,” “with sincerity,” or “faithfully.”
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼는 진리 안에서 그분을 사랑하는 이들에게 자비를 베푸시는 분은 복되십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘진리 안에서’는 ‘진실로’, ‘성실하게’, ‘충실하게’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογητὸς
  english_pob_choice: Blessed
  chosen_korean: 복되십니다
  alternatives_korean:
  - 찬양받으십니다
  - 복됩니다
  lexicon: BDAG
  rationale: 도xology의 선언형 형용사로서, 하나님께 적용되는 전형적 축복 선언을 현대 한국어의 존대 형식으로 자연스럽게 살렸습니다.
- source_word: Κύριος
  english_pob_choice: Lord
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 주
  lexicon: POB glossary / LXX citation practice
  rationale: 시편의 그리스어 본문에서 Κύριος가 하나님의 고유 호칭으로 쓰이므로, 프로젝트 기본값에 따라 야훼로 옮겼습니다.
- source_word: ὁ ποιῶν ἔλεος
  english_pob_choice: who shows mercy
  chosen_korean: 자비를 베푸시는 분은
  alternatives_korean:
  - 긍휼을 행하시는 분은
  - 자비를 행하시는 분은
  lexicon: BDAG
  rationale: ποιέω + ἔλεος의 관용적 결합을 ‘자비를 베풀다’로 옮겨, 행위의 지속성과 관계적 은혜를 한국어로 분명히 드러냈습니다.
- source_word: ἐν ἀληθείᾳ
  english_pob_choice: in truth
  chosen_korean: 진리 안에서
  alternatives_korean:
  - 진실로
  - 성실하게
  - 충실하게
  lexicon: BDAG
  rationale: POB의 영어 주석이 밝혀 둔 의미 범위를 좁히지 않기 위해, 단순 부사화보다 ‘진리 안에서’로 옮겨 진리/성실/신실함의 긴장을 보존했습니다.
theological_decisions:
- issue: Κύριος의 번역을 야훼로 둘지, 일반적인 ‘주님’으로 둘지
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 주
  rationale: 문맥이 찬양 공식이며 히브리어 배경의 하나님의 호칭을 가리키므로, LXX 인용·호칭 관행에 맞추어 야훼를 채택했습니다.
  doctrine_reference: LXX/OT divine-name rendering policy
