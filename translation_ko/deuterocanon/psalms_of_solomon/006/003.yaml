  text: His ways are directed by the Lord, and the works of his hands are guarded by the Lord his God.
translation:
  language: ko
  text: 그의 길들은 주님에 의해 바르게 인도되며, 그의 손의 일들도 그의 하나님이신 주님에 의해 지켜집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 "곧게 되며" 또는 "바르게 되며"로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁδοὶ
  english_pob_choice: ways
  chosen_korean: 길들
  alternatives_korean:
  - 길
  - 행실
  - 삶의 길
  lexicon: BDAG
  rationale: 사람의 삶의 진행이나 행로를 가리키는 복수 표현으로, 영어 POB의 'ways'를 자연스럽게 옮기되 구체적 의미를 과도하게 한정하지 않기 위해 '길들'로 렌더링했습니다.
- source_word: κατευθύνονται
  english_pob_choice: are directed
  chosen_korean: 바르게 인도되며
  alternatives_korean:
  - 인도되며
  - 곧게 되며
  - 바로잡히며
  lexicon: BDAG
  rationale: 수동형의 '곧게 하다/바르게 하다' 뉘앙스를 살리면서 현대 한국어에서 자연스러운 표현으로 '바르게 인도되다'를 택했습니다.
- source_word: πεφυλαγμένα
  english_pob_choice: are guarded
  chosen_korean: 지켜집니다
  alternatives_korean:
  - 보호됩니다
  - 보존됩니다
  - 간수됩니다
  lexicon: BDAG
  rationale: 완료 분사의 상태성을 반영해 계속적으로 보호 아래 놓여 있음을 나타내기 위해 '지켜집니다'를 사용했습니다.
- source_word: ὑπὸ Κυρίου θεοῦ αὐτοῦ
  english_pob_choice: by the Lord his God
  chosen_korean: 그의 하나님이신 주님에 의해
  alternatives_korean:
  - 그의 하나님이신 주님이
  - 주님 곧 그의 하나님에 의해
  - 그의 하나님이신 주님께
  lexicon: BDAG
  rationale: 두 번째 절의 '주님 그의 하나님' 관계를 유지해 소유격과 호칭을 모두 드러내고, ὑπό의 행위 주체를 분명히 하기 위해 이 순서를 택했습니다.
theological_decisions:
- issue: 반복되는 주님의 주권적 행위
  chosen_reading: 사람의 길과 손의 일들이 모두 주님의 직접적 주권 아래 놓여 있다는 강한 진술을 그대로 보존했습니다.
  alternative_readings:
  - 일반적인 축복이나 성공의 표현으로 완화하는 읽기
  rationale: 두 수동문이 모두 ὑπό + Κυρίου를 통해 행위 주체를 명시하므로, 이를 완화하지 않고 섭리적 주권의 진술로 유지했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
