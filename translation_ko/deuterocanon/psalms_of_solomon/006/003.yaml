  text: His ways are directed by the Lord, and the works of his hands are guarded by the Lord his God.
translation:
  language: ko
  text: 그의 길은 주님께서 바르게 이끄십니다.[a] 그의 손으로 한 일들은 그의 하나님이신 주님께 보호받고 있습니다.
  philosophy: optimal-equivalence
  footnotes:
