  text: 의로운 사람이 이런 일들 속에서 견디면, 주님께 긍휼을 입을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '이런 일을 견디는 것으로, 의로운 사람은 주님께 긍휼을 입을 것입니다.'
    reason: lexical_alternative
  - marker: b
    text: 또는 '의로운 사람'의 뜻입니다. 그리스어는 대표적 의미로 쓰일 수 있는 단수 남성형을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ ὑπομεῖναι
  english_pob_choice: When ... endures
  chosen_korean: 견디면
  alternatives_korean:
  - 견뎌내면
  - 참으면
  lexicon: BDAG
  rationale: 전치사 ἐν과 관사형 부정사의 결합은 여기서 시간적 의미로 읽는 것이 자연스러우므로, 결과절을 여는 조건·시점 표현으로 간결하게 옮겼습니다.
- source_word: δίκαιον
  english_pob_choice: the righteous one
  chosen_korean: 의로운 사람
  alternatives_korean:
  - 의로운 이
  - 의로운 자
  lexicon: BDAG
  rationale: 단수 남성형의 명사적 용법을 한국어에서 자연스럽게 살리면서도 대표적 인물을 가리키는 뉘앙스를 유지하기 위해 '의로운 사람'으로 옮겼습니다.
- source_word: ἐν τούτοις
  english_pob_choice: in these things
  chosen_korean: 이런 일들 속에서
  alternatives_korean:
  - 이런 것들 가운데
  - 이런 상황에서
  lexicon: BDAG
  rationale: 직전 문맥의 고난과 시험을 가리키는 대명사이므로, 범위를 조금 풀어 한국어에서 무엇을 가리키는지 드러나게 했습니다.
- source_word: ἐλεηθήσεται
  english_pob_choice: will be shown mercy
  chosen_korean: 긍휼을 입을 것입니다
  alternatives_korean:
  - 자비를 입을 것입니다
  - 긍휼을 받게 될 것입니다
  lexicon: BDAG
  rationale: 수동태의 'mercy shown'을 한국어에서 자연스럽게 수동적 은혜 경험으로 옮기기 위해 '긍휼을 입다'를 택했습니다.
theological_decisions:
- issue: κύριος의 번역
  chosen_reading: 주님
  alternative_readings:
