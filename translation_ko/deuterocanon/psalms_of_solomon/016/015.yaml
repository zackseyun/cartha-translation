  - 하나님
  rationale: 본문의 κύριος는 경배 문맥의 주격 호칭으로 쓰이므로, 한국어 합쇼체에서 가장 자연스럽고 프로젝트 용례에도 맞는 '주님'으로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → Lord'
