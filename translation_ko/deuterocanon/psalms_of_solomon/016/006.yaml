  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: lxx-swete-1909
  text: μὴ ἀποστήσῃς τὸ ἔλεός σου ἀπʼ ἐμοῦ, ὁ θεός, μηδὲ τὴν μνήμην περὶ σοῦ ἀπὸ καρδίας ἕως θανάτου.
  language: Greek
  pages:
  - 805
  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/016/006.yaml
  text: Do not withdraw your mercy from me[a], O God[c][b], nor the remembrance of you from my heart until death.
  footnotes:
  - marker: a
    text: Literally, “nor the remembrance concerning you from my heart until death.”
    reason: lexical_alternative
  - marker: b
    text: “Mercy” could also be rendered “compassion” or, more interpretively, “steadfast love.”
    reason: lexical_alternative
  - marker: c
    text: Or 'and do not take the remembrance of you from my heart'.
    reason: previous_rendering
translation:
  language: ko
  text: 하나님, 주의 긍휼을 제게서 거두지 마시고, 주를 향한 기억을 제 마음에서 죽음에 이르기까지 거두지 마십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “죽음에 이르기까지 제 마음에서 주를 향한 기억을 거두지 마십시오”입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘긍휼’은 ‘자비’ 또는 더 해석적으로는 ‘한결같은 사랑’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “주를 향한 기억을 제 마음에서 거두지 마십시오”라고도 할 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: μὴ ἀποστήσῃς
  english_pob_choice: Do not withdraw
  chosen_korean: 거두지 마시고
  alternatives_korean:
  - 물러나지 마시고
  - 떠나지 마시고
  - 거두어 가지 마시고
  lexicon: BDAG; LEH
  rationale: ἀποστήσῃς는 여기서 하나님께서 무엇인가를 떠나게 하지 않으시라는 요청이므로, 한국어로는 자연스럽게 ‘거두다’로 옮겨 제거/철수를 함께 담았습니다.
- source_word: τὸ ἔλεός σου
  english_pob_choice: your mercy
  chosen_korean: 주의 긍휼
  alternatives_korean:
  - 주의 자비
  - 주의 은혜로운 긍휼
  - 주의 인자
  lexicon: LEH
  rationale: ἔλεος의 기본값은 ‘긍휼/자비’이므로, 시편 기도문 어조를 살리면서도 원문의 직접성을 유지하는 ‘긍휼’을 택했습니다.
- source_word: μνήμην περὶ σοῦ
  english_pob_choice: the remembrance of you
  chosen_korean: 주를 향한 기억
  alternatives_korean:
  - 주의 기억
  - 주에 대한 기억
  - 주를 기억함
  lexicon: LEH
  rationale: περὶ σοῦ는 단순한 소유격 기억보다 ‘~을 향한/에 대한’ 방향성을 띠므로, 한국어에서는 ‘주를 향한 기억’으로 그 지향성을 드러냈습니다.
- source_word: ἕως θανάτου
  english_pob_choice: until death
  chosen_korean: 죽음에 이르기까지
  alternatives_korean:
  - 죽을 때까지
  - 죽음까지
  - 죽기까지
  lexicon: LEH
  rationale: 시간적 종결을 분명히 하면서도 기도문 문체에 어울리는 표현으로 옮겼습니다.
theological_decisions:
- issue: 하나님께 직접 드리는 간구의 높임말 처리
  chosen_reading: 하나님과 주를 향한 직접 호칭에는 높임말을 사용해 ‘거두지 마시고’, ‘거두지 마십시오’로 정리했습니다.
  alternative_readings:
  - 평서형으로 중립화
  - 더 전통적인 기도체 어미 사용
  rationale: 원문은 탄원형 기도이므로, 현대 합쇼체를 유지하되 하나님께 드리는 직접 청원은 존대 종결로 처리하는 것이 한국어 기도문으로 가장 자연스럽습니다.
  doctrine_reference: 기도의 직접성 및 경외 표현
- issue: 첫 절의 병렬 구조 보존
  chosen_reading: 두 대상(긍휼, 기억)을 하나의 ‘거두다’ 요청 아래 병렬로 두었습니다.
  alternative_readings:
  - 두 번째 절에 별도 동사를 보충
  - 두 문장을 완전히 분리
  rationale: 그리스어는 하나의 동사 ἀποστήσῃς가 두 목적어를 지배하므로, 한국어도 이 병렬성을 유지해 시편적 긴장을 보존했습니다.
  doctrine_reference: 원문 병렬구문 보존
