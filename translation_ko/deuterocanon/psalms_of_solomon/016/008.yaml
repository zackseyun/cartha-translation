translation:
  language: ko
  text: 법 없는 여인의 아름다움이 저를 속이지 못하게 하시고, 또 쓸모없는 죄가 제 앞에 놓인 그 어떤 것의 아름다움도 그러하지 못하게 하소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '다른 번역 가능성: ‘제 앞에 놓인 것’.'
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ ἀπατησάτω με
  english_pob_choice: do not let ... deceive me
  chosen_korean: 저를 속이지 못하게 하시고
  alternatives_korean:
  - 저를 미혹하지 못하게 하시고
  - 저를 기만하지 못하게 하시고
  lexicon: LSJ
  rationale: ἀπατάω의 핵심은 ‘속이다/기만하다’이므로, 기도문 맥락에서 자연스러운 합쇼체로 옮겼습니다.
- source_word: κάλλος γυναικὸς παρανόμου
  english_pob_choice: the beauty of a lawless woman
  chosen_korean: 법 없는 여인의 아름다움
  alternatives_korean:
  - 율법 없는 여인의 아름다움
  - 불법한 여인의 아름다움
  - 법을 어기는 여인의 아름다움
  lexicon: LSJ
  rationale: παράνομος는 단순한 사회적 무례보다 ‘율법/법 질서 밖에 있는, 법 없는’이라는 도덕적·종교적 무게를 가지므로 ‘법 없는’으로 직역 성격을 살렸습니다.
- source_word: παντὸς ὑποκειμένου
  english_pob_choice: anything laid before me
  chosen_korean: 제 앞에 놓인 그 어떤 것
  alternatives_korean:
  - 제 앞에 놓인 어떤 것
  - 제 앞에 제시된 그 어떤 것
  - 제게 놓여 있는 그 어떤 것
  lexicon: LSJ
  rationale: ὑποκείμενον은 ‘놓이다/제시되다’의 감각을 가지며, POB의 문맥상 유혹의 대상이 ‘제 앞에 놓인 것’이라는 의미를 드러내는 표현이 가장 자연스럽습니다.
- source_word: ἀπὸ ἁμαρτίας ἀνωφελοῦς
  english_pob_choice: by worthless sin
  chosen_korean: 쓸모없는 죄
  alternatives_korean:
  - 무익한 죄
  - 헛된 죄
  - 소용없는 죄
  lexicon: LSJ
  rationale: ἀνωφελής는 ‘무익한, 소용없는, 쓸모없는’의 뜻이므로 현대 한국어에서 의미가 즉각 전달되는 ‘쓸모없는’으로 옮겼습니다. 앞의 ἀπό는 여기서 유혹의 근원/출처를 나타내는 것으로 이해했습니다.
theological_decisions:
- issue: 기도문에서의 호소형 명령문 처리
  chosen_reading: 직접적인 간청형으로 ‘— 못하게 하소서’ 구조를 사용했습니다.
  alternative_readings:
  - 부정 청유형 ‘— 하지 마시옵소서’
  - 완곡한 소망형 ‘— 하지 않게 하소서’
  rationale: 원문의 부정 명령/간청을 한국어 기도체로 가장 직접적으로 재현하기 위해, 하나님께 드리는 호소를 분명한 간청형으로 옮겼습니다.
  doctrine_reference: 시편적 기도 문체
