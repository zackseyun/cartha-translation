base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/016/001.yaml
  text: When my soul was departing from the Lord[c][b][a], I almost slipped in the descent of sleep.
  footnotes:
  - marker: a
    text: Or 'When my soul was apart from the Lord.'
    reason: alternative_reading
  - marker: b
    text: The phrase rendered 'the downward plunge of sleep' may also mean 'the heaviness' or 'stupor of sleep.'
    reason: lexical_alternative
  - marker: c
    text: Or 'When my soul gathered itself'.
    reason: previous_rendering
translation:
  language: ko
  text: 내 영혼이 주님에게서 떠나려 할 때, 나는 잠의 내리막길에서 거의 미끄러질 뻔했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내 영혼이 주님과 떨어져 있을 때.”
    reason: alternative_reading
  - marker: b
    text: ‘잠의 내리막길’은 ‘잠의 무거움’ 또는 ‘몽롱함’을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “내 영혼이 스스로 가라앉을 때.”
    reason: previous_rendering
lexical_decisions:
- source_word: Ἐν τῷ συστάξαι
  english_pob_choice: When ... was departing
  chosen_korean: “~하려 할 때”로 시작해 영혼의 이탈이 진행되는 순간을 표현했습니다.
  alternatives_korean:
  - 떠날 때
  - 기울 때
  - 흩어질 때
  lexicon: LSJ
  rationale: 주어진 영어 POB는 이 구절을 시간절로 읽으며 떠남의 진행을 나타냅니다. 한국어에서는 동작의 순간성과 경계를 살려 ‘~하려 할 때’로 옮기는 것이 자연스럽습니다.
- source_word: ψυχήν μου
  english_pob_choice: my soul
  chosen_korean: 내 영혼
  alternatives_korean:
  - 내 생명
  - 내 자아
  lexicon: LSJ
  rationale: 시적·경건한 문맥에서 ψυχή는 내면의 영적 중심을 가리키므로 ‘영혼’이 가장 직접적입니다.
- source_word: ἀπὸ Κυρίου
  english_pob_choice: away from the Lord
  chosen_korean: 주님에게서 떠나
  alternatives_korean:
  - 주님으로부터
  - 주님과 떨어져
  lexicon: LSJ
  rationale: ἀπό는 단순 출처보다 분리·이탈을 강하게 나타내므로, 관계적 거리감을 드러내는 ‘~에게서 떠나’가 더 잘 맞습니다. POB의 ‘away from’도 이 긴장을 유지합니다.
- source_word: ἐν καταφορᾷ ὕπνου
  english_pob_choice: in the descent of sleep
  chosen_korean: 잠의 내리막길
  alternatives_korean:
  - 잠의 하강
  - 잠의 깊은 침잠
  - 잠의 내림
  lexicon: LSJ
  rationale: καταφορά는 아래로 내려감, 가라앉음의 이미지를 가지므로, 한국어에서도 운동감을 살린 표현이 필요합니다. ‘내리막길’은 비유를 보존하면서도 현대 한국어로 읽히는 방식입니다.
theological_decisions:
- issue: ἀπὸ Κυρίου의 분리 감각을 단순한 출처로 완화할지 여부
  chosen_reading: 관계적 이탈로 읽어 ‘주님에게서 떠나’로 옮겼습니다.
  alternative_readings:
  - 주님으로부터
  - 주님에게서
  rationale: 문맥은 단순한 기원이 아니라 주님과의 거리감이 영적 위험과 연결됨을 보여 줍니다. 이를 풀어써도 교리를 덧붙이지 않으면서 원문의 긴장을 유지할 수 있습니다.
  doctrine_reference: 원문 우선 원칙; 관계적 분리의 보존
