  rationale: περίστειλον은 단순히 ‘막다’보다 감싸고 입히는 구체적 이미지를 지니므로, 한국어에서는 ‘입히다’가 시적 은유를 가장 자연스럽게 살립니다.
- source_word: γλῶσσάν μου καὶ τὰ χείλη μου
