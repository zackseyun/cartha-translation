translation:
  language: ko
  text: 제 혀와 입술을 진리의 말씀으로 입히시고, 분노와 어리석은 진노를 저에게서 멀리 두십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘둘러싸시고’, ‘지키시고’, ‘억제하시고’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘비이성적인 진노’, ‘무분별한 분노’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘제 혀와 입술을 진리의 말씀으로 에워싸시고’로 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: περίστειλον
  english_pob_choice: Clothe
  chosen_korean: 입히시고
  alternatives_korean:
  - 둘러싸시고
  - 감싸시고
  - 두르시고
  lexicon: LSJ
  rationale: περίστειλον은 단순히 ‘막다’보다 감싸고 입히는 구체적 이미지를 지니므로, 한국어에서는 ‘입히다’가 시적 은유를 가장 자연스럽게 살립니다.
- source_word: γλῶσσάν μου καὶ τὰ χείλη μου
  english_pob_choice: my tongue and my lips
  chosen_korean: 제 혀와 입술
  alternatives_korean:
  - 제 혀와 제 입술
  - 제 말과 입술
  lexicon: LSJ
  rationale: ‘혀’와 ‘입술’의 신체적 병행을 살려 직역에 가깝게 옮겼습니다. 1인칭 소유는 한국어에서 자연스럽게 한 번만 드러내도 충분합니다.
- source_word: ἐν λόγοις ἀληθείας
  english_pob_choice: with words of truth
  chosen_korean: 진리의 말씀으로
  alternatives_korean:
  - 진리의 말로
  - 참된 말로
  - 진실의 말로
  lexicon: LSJ
  rationale: 직역하면 ‘진리의 말들’이지만, 한국어에서는 복수성을 과도하게 드러내기보다 ‘진리의 말씀’으로 묶어 주는 편이 시적이며 의미도 유지합니다.
- source_word: ὀργὴν καὶ θυμὸν ἄλογον
  english_pob_choice: anger and senseless wrath
  chosen_korean: 분노와 어리석은 진노
  alternatives_korean:
  - 분노와 무분별한 진노
  - 분노와 이성 없는 진노
  - 분노와 어리석은 분노
  lexicon: LSJ
  rationale: ὀργή와 θυμός는 서로 겹치지만 같은 말은 아니므로 두 겹의 분노를 유지했습니다. ἄλογον은 ‘이성 없는/무분별한’의 뜻을 살리되, 한국어 관용에 맞게 ‘어리석은’으로 옮겼습니다.
- source_word: μακρὰν ποίησον ἀπʼ ἐμοῦ
  english_pob_choice: keep ... far from me
  chosen_korean: 저에게서 멀리 두십시오
  alternatives_korean:
  - 저에게서 멀리 하십시오
  - 저에게서 멀리 치우십시오
  - 저에게서 떨어뜨려 주십시오
  lexicon: LSJ
  rationale: 원문의 관용구는 ‘멀리 떨어져 있게 하다’의 뜻이므로, 한국어에서는 요청형으로 자연스럽게 ‘멀리 두십시오’라고 옮겼습니다.
theological_decisions:
- issue: 기도문에서의 직접 청원 어조
  chosen_reading: 하나님께 드리는 간청으로서 공손한 명령형 ‘입히시고…두십시오’를 사용했습니다.
  alternative_readings:
  - ‘입혀 주십시오…멀리해 주십시오’처럼 완곡하게 표현
  - ‘입혀 주시고…멀리해 주시옵소서’처럼 더 전통적인 기도체 사용
  rationale: 본문은 간구형 기도이므로 요청의 긴박함을 살리되, 현대 합쇼체에 맞게 공손한 명령형을 택했습니다.
  doctrine_reference: 시편적 간구의 문체
- issue: ἀληθείας의 번역
  chosen_reading: ‘진리’로 옮겨 단순한 사실성보다 하나님의 참됨에 속한 말이라는 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘진실’로 번역
  - ‘참됨’으로 번역
  rationale: 이 구절은 단지 사실을 말하라는 뜻보다, 하나님 앞에서 참되고 바른 말을 입혀 달라는 기도에 가깝기 때문에 ‘진리’가 가장 안정적입니다.
  doctrine_reference: 성경적 진리 개념
