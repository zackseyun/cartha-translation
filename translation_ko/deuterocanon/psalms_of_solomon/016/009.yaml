translation:
  language: ko
  text: 제 손으로 한 일들을 주님의 자리에서 바로 세워 주시고, 제 발걸음들을 주님을 기억함 가운데 지켜 주십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεύθυνον
  english_pob_choice: Direct
  chosen_korean: 바로 세워 주시고
  alternatives_korean:
  - 인도해 주시고
  - 곧게 하시고
  - 이끌어 주시고
  lexicon: BDAG
  rationale: 명령형 청원이므로 단순한 ‘인도’보다, 행위와 삶의 진행을 바로잡아 달라는 뜻을 살려 자연스럽게 옮겼습니다.
- source_word: τὰ ἔργα τῶν χειρῶν μου
  english_pob_choice: the works of my hands
  chosen_korean: 제 손으로 한 일들
  alternatives_korean:
  - 제 손의 일들
  - 제 손의 행위들
  - 제 수고
  lexicon: BDAG
  rationale: 히브리식 관용구를 한국어에서 너무 직역하면 부자연스러워져, 손으로 한 구체적 행위를 뜻하는 표현으로 옮기되 ‘손’의 구체성을 유지했습니다.
- source_word: ἐν τόπῳ σου
  english_pob_choice: in your place
  chosen_korean: 주님의 자리에서
  alternatives_korean:
  - 주님의 임재 안에서
  - 주님의 곳에서
  - 주님의 앞에서
  lexicon: BDAG
  rationale: POB의 본문 선택인 ‘place’를 따르면서도 한국어에서는 ‘자리’가 문맥상 가장 투명하게 대응되어 선택했습니다.
- source_word: τὰ διαβήματά μου
  english_pob_choice: my steps
  chosen_korean: 제 발걸음들
  alternatives_korean:
  - 제 걸음들
  - 제 행보
  - 제 발자취
  lexicon: BDAG
  rationale: 삶의 진행과 실제 움직임을 함께 드러내는 말로, 시적 문맥에 맞게 ‘발걸음들’로 옮겼습니다.
- source_word: ἐν τῇ μνήμῃ σου
  english_pob_choice: in the remembrance of you
  chosen_korean: 주님을 기억함 가운데
  alternatives_korean:
  - 주님을 기억하는 가운데
  - 주님에 대한 기억 안에서
  - 주님을 기억하는 동안
  lexicon: BDAG
  rationale: 여기서 μνήμη는 ‘주님이 나를 기억하심’이 아니라 화자의 하나님 기억을 가리키므로, 목적격 관계를 드러내는 한국어로 옮겼습니다.
theological_decisions:
- issue: ἐν τόπῳ σου의 의미 범위
  chosen_reading: ‘주님의 자리에서’로 번역해 본문의 직역성을 유지하되, 예배적/관계적 함의를 과도하게 확장하지 않았습니다.
  alternative_readings:
  - ‘주님의 임재 안에서’
  - ‘주님의 앞에서’
  rationale: 영어 POB가 본문상 ‘place’를 채택한 뒤 관련 주해를 각주로 분리한 흐름을 따라, 본문에는 더 직접적인 표현을 두었습니다.
  doctrine_reference: 시적 기도문에서의 하나님의 현존 표현과 장소 표지의 구분
- issue: ἐν τῇ μνήμῃ σου의 소유격 관계
  chosen_reading: ‘주님을 기억함 가운데’로 하여, 기억의 주체가 화자임을 분명히 했습니다.
  alternative_readings:
  - ‘주님의 기억 가운데’
  - ‘주님의 기억 안에서’
  rationale: 주해상 본절은 하나님이 기억하시는 것이 아니라 시편 화자가 하나님을 기억하는 상태를 말하므로, 신학적 주체를 흐리지 않도록 처리했습니다.
  doctrine_reference: 경건한 기억/묵상의 주체성
