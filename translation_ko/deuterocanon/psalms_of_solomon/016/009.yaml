review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the two imperatives, “the works of my hands,” “my steps,” and the objective sense of “the remembrance of you.” However, “바로 세워 주시고” can suggest repairing or establishing already completed works rather than directing the speaker’s activity, and “주님의 자리” can evoke a seat, office, or throne more readily than τόπος (“place”).
  naturalness: The prayer register is appropriately modern formal-polite. A small recasting produces more idiomatic Korean while retaining the source’s concrete wording and syntax.
  terminology: “주님을 기억함 가운데” properly expresses that the speaker remembers the Lord, rather than that the Lord remembers the speaker. “주님의 곳” is less misleading than “주님의 자리” while retaining the lexical concreteness of τόπος.
  issues:
  - severity: medium
    issue: “주님의 자리에서” is semantically over-specific in Korean.
    rationale: 자리 commonly denotes a seat, position, or office. The Greek τόπος is simply “place”; “주님의 곳” better preserves that broad, potentially spatial sense without interpreting it as “presence.”
  - severity: low
    issue: “바로 세워 주시고” is not the most natural rendering with “제 손으로 한 일들.”
    rationale: It can imply correction or establishment of completed works. “바르게 이끌어 주시고” naturally conveys the petition that God direct the speaker’s work.
  revised_text: 제 손으로 하는 일들을 주님의 곳에서 바르게 이끌어 주시고, 제 발걸음들을 주님을 기억함 가운데 지켜 주십시오.
  revised_footnotes:
  - marker: a
    text: 또는 “주님의 임재 안에서.”
    reason: ἐν τόπῳ σου(“주님의 곳에서”)는 문맥상 하나님의 임재를 가리킬 수도 있으나, 본문은 τόπος의 기본 의미인 “곳”을 유지합니다.
  - marker: b
    text: 또는 “제 발걸음을 주님에 대한 기억 안에서 보존해 주십시오.”
    reason: διαφύλαξον은 “지키다, 보존하다”라는 뜻이며, ἐν τῇ μνήμῃ σου는 화자가 주님을 기억하는 것을 가리키는 것으로 이해됩니다.
  revision_rationale: ‘주님의 자리’를 보다 넓고 직접적인 ‘주님의 곳’으로 바꾸고, 첫 청원을 한국어에서 자연스럽게 ‘일들을 … 바르게 이끌어 주시고’로 다듬었습니다. 후반부는 σου를 목적 관계로 이해하는 현 번역의 장점을 유지했습니다.
  requires_human_review: false
