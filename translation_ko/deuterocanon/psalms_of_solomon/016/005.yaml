  source_fidelity: 현 번역의 ‘저를 멸망에 들지 않으셨기’는 ἐλογίσω με…εἰς ἀπώλειαν(‘멸망을 위하여/멸망에 이르도록 나를 …로 간주하지 않으셨다’)의 판단·분류 표현을 ‘멸망에 들게 하지 않다’라는 사역 표현으로 바꾸어 놓습니다. 또한 미래형 ἐξομολογήσομαι는 ‘감사드리겠습니다’로 옮기는 것이 적절합니다. ἀντελάβου는 이 문맥에서 ‘도우셨다’가 자연스럽고, 앞 절들의 어휘 연결도 살립니다.
  naturalness: ‘제가 당신께 감사드립니다, 오 하나님’은 기도문으로 다소 직역투이며, 하나님을 향한 표준 현대 한국어의 공손한 기도체에서는 ‘하나님, 제가 주께 감사드리겠습니다’가 더 자연스럽습니다. ‘멸망에 들지 않으셨기’도 한국어 문법과 의미 양쪽에서 부자연스럽습니다.
  terminology: σωτηρία는 ‘구원’으로 유지했습니다. τῶν ἁμαρτωλῶν은 문맥상 대조되는 범주·집단을 가리키므로 ‘그 죄인들과 함께’로 그 한정성을 드러냈습니다. λογίζομαι의 평가·법정적 뉘앙스는 ‘간주하다’로 옮겼습니다.
  issues:
