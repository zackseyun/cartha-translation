lexical_decisions:
- source_word: ἐξομολογήσομαί
  english_pob_choice: I will give thanks
  chosen_korean: 제가 당신께 감사드립니다
  alternatives_korean:
  - 제가 당신을 찬양하겠습니다
  - 제가 당신께 고백하겠습니다
  lexicon: BDAG
  rationale: 이 문맥에서는 죄 고백보다 하나님께 드리는 감사와 찬양의 뜻이 더 자연스럽기 때문에, 현대 한국어의 직접적이고 공손한 표현인 ‘감사드립니다’를 택했습니다.
- source_word: ἀντελάβου
  english_pob_choice: you took hold of
  chosen_korean: 붙드셨고
  alternatives_korean:
  - 도우셨고
  - 지탱하셨고
  lexicon: BDAG
  rationale: 동사의 핵심 이미지인 ‘붙잡아 도움을 주다’는 감각을 살리면서도 한국어로 자연스럽게 들리도록 ‘붙드셨고’로 옮겼습니다.
- source_word: εἰς σωτηρίαν
  english_pob_choice: for salvation
  chosen_korean: 구원을 위하여
  alternatives_korean:
  - 구원에 이르도록
  - 구원을 위해
  lexicon: BDAG
  rationale: σωτηρίαν의 종교적·구원론적 무게를 보존하기 위해 ‘구원’으로 옮기고, 목적/결과의 뉘앙스를 살려 ‘위하여’를 붙였습니다.
- source_word: μετὰ τῶν ἁμαρτωλῶν
  english_pob_choice: with sinners
  chosen_korean: 죄인들과 함께
  alternatives_korean:
  - 죄인들 가운데
  - 죄인들과
  lexicon: BDAG
  rationale: 전치사구의 동반 의미를 자연스럽게 드러내면서도, 본문의 분류 대조를 살리기 위해 ‘함께’를 사용했습니다.
theological_decisions:
- issue: ‘죄인들’의 집단성 유지
  chosen_reading: 죄인들과 함께
  alternative_readings:
  - 죄인들과
  - 죄인들 가운데
  rationale: 본문의 ‘τῶν ἁμαρτωλῶν’은 단순한 일반적 도덕 범주라기보다 특정 집단과의 대조를 형성하므로, 그 집단성을 흐리지 않도록 복수 표지를 분명히 했습니다.
  doctrine_reference: 본문-역사적 문맥 주석 원칙
