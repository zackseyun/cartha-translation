    rationale: 원문은 하나님이 화자를 죄인들과 한데 묶어 멸망의 대상으로 계산/간주하지 않으셨다는 뜻입니다. 현 문구는 하나님이 화자를 멸망에 들어가지 못하게 하셨다는 뜻으로 읽혀 ‘계산하다’의 핵심 의미가 사라집니다.
