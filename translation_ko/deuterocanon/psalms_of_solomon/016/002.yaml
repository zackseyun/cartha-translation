base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/016/002.yaml
  text: When I was far from God[a], my soul was almost poured out to death[c][b], near the gates of Hades with a sinner.
  footnotes:
  - marker: a
    text: Or "my life was almost poured out to death."
    reason: lexical_alternative
  - marker: b
    text: Or "near the gates of the grave" or "near the gates of the realm of the dead." The Greek reads "Hades."
    reason: lexical_alternative
  - marker: c
    text: Or 'with a sinner'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 하나님에게서 멀리 있었을 때, 내 영혼은 죽음으로 거의 쏟아져 나갔고, 나는 스올의 문들 가까이에서 한 죄인과 함께 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내 생명이 죽음으로 거의 쏟아져 나갔습니다.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “하데스의 문들 가까이에서” 또는 “무덤의 문들 가까이에서”. 그리스어는 “하데스”라고 읽습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “한 죄인과 함께”.
    reason: previous_rendering
lexical_decisions:
- source_word: τῷ μακρὰν ἀπὸ θεοῦ
  english_pob_choice: When I was far from God
  chosen_korean: 내가 하나님에게서 멀리 있었을 때
  alternatives_korean:
  - 하나님에게서 멀리 있을 때
  - 하나님에게서 멀어진 상태에서
  lexicon: LSJ
  rationale: 그리스어의 압축된 시공간 표현을 한국어에서는 자연스러운 시간절로 풀어, 원문의 상황적 의미를 살리면서도 과도한 해석을 피했습니다.
- source_word: παρʼ ὀλίγον
  english_pob_choice: almost
  chosen_korean: 거의
  alternatives_korean:
  - 하마터면
  - 간신히
  lexicon: LSJ
  rationale: 이 관용구는 ‘거의/간신히’의 뜻이므로, 현대 한국어에서 가장 직접적이고 자연스러운 ‘거의’로 옮겼습니다.
- source_word: ἐξεχύθη ἡ ψυχή μου εἰς θάνατον
  english_pob_choice: my soul was almost poured out to death
  chosen_korean: 내 영혼은 죽음으로 거의 쏟아져 나갔고
  alternatives_korean:
  - 내 혼은 죽음에 이르도록 거의 쏟아져 나갔고
  - 내 생명은 죽음으로 거의 빠져나갔고
  lexicon: LSJ
  rationale: ἐκχέω의 ‘쏟아 내다’ 이미지를 살리되, 한국어에서는 수동적·시적 표현을 자연스럽게 구성했습니다. ψυχή는 여기서 개인의 내적 자아를 가리키므로 ‘영혼’을 택했습니다.
- source_word: σύνεγγυς πυλῶν ᾅδου
  english_pob_choice: near the gates of Hades
  chosen_korean: 스올의 문들 가까이에서
  alternatives_korean:
  - 하데스의 문들 가까이에서
  - 죽음의 문들 가까이에서
  - 무덤의 문들 가까이에서
  lexicon: LSJ
  rationale: ᾅδης는 본문 용어를 보존하는 것이 중요하므로, 한국어 성경 전통과 본문의 사후 세계 이미지를 함께 반영하는 음역 ‘스올’을 사용했습니다. ‘문들 가까이’는 공간적 긴박성을 그대로 유지합니다.
- source_word: μετὰ ἁμαρτωλοῦ
  english_pob_choice: with a sinner
  chosen_korean: 한 죄인과 함께
  alternatives_korean:
  - 죄인과 함께
  - 그 죄인과 함께
  - 한 죄와 함께
  lexicon: LSJ
  rationale: 그리스어 단수 무관사 ἁμαρτωλοῦ는 특정 개인보다 죄인의 범주를 가리키는 일반적 표현으로 보이므로, 한국어에서는 부정관사적 느낌을 살린 ‘한 죄인’을 택했습니다.
theological_decisions:
- issue: ᾅδης의 음역 처리
  chosen_reading: 스올
  alternative_readings:
  - 하데스
  - 무덤
  - 죽은 자들의 세계
  rationale: 원문의 사후 세계 용어를 평탄화하지 않고 보존하면서, 한국어 독자가 성경적·전통적 상징성을 이해할 수 있는 음역을 택했습니다.
  doctrine_reference: 원문 우선 원칙; 사후 세계 용어의 긴장 보존
- issue: ψυχή의 한국어 대응
  chosen_reading: 영혼
  alternative_readings:
  - 생명
  - 목숨
  rationale: 이 구절은 기도적 1인칭 표현과 ‘죽음으로 쏟아져 나감’의 이미지 속에서 자기 존재 전체를 가리키므로, ‘영혼’이 가장 직접적으로 원문의 뉘앙스를 전달합니다.
  doctrine_reference: 원문 의미 범위 보존; 다의성의 과잉 해소 금지
