  naturalness: 초안의 ‘내 영혼은 죽음으로 거의 쏟아져 나갔고’는 한국어 결합이 다소 부자연스럽습니다. ‘내 영혼은 죽음에 이르도록 거의 쏟아져 나갔으며’가 더 자연스럽고 시적 이미지도 보존합니다. ‘한 죄인과 함께’는 그리스어의 단수 무관사 표현을 무리 없이 반영합니다.
  terminology: ᾅδης는 본문에서 ‘하데스’로 음역하는 것이 안전합니다. ‘스올’은 관련된 사후 세계 표상일 수 있으나 서로 다른 원어 용어이므로 여기서 대체어로 쓰지 않습니다. ψυχή는 본문에서는 ‘영혼’으로 두고, 가능한 ‘생명/목숨’ 의미는 각주로 보존합니다.
