- source_word: μετὰ ἁμαρτωλοῦ
  english_pob_choice: with a sinner
  chosen_korean: 한 죄인과 함께
  alternatives_korean:
  - 죄인과 함께
  - 그 죄인과 함께
  - 한 죄와 함께
  lexicon: LSJ
  rationale: 그리스어 단수 무관사 ἁμαρτωλοῦ는 특정 개인보다 죄인의 범주를 가리키는 일반적 표현으로 보이므로, 한국어에서는 부정관사적 느낌을 살린 ‘한 죄인’을 택했습니다.
