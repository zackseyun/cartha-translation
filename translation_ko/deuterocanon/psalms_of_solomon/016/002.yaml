  lexicon: LSJ
  rationale: ἐκχέω의 ‘쏟아 내다’ 이미지를 살리되, 한국어에서는 수동적·시적 표현을 자연스럽게 구성했습니다. ψυχή는 여기서 개인의 내적 자아를 가리키므로 ‘영혼’을 택했습니다.
- source_word: σύνεγγυς πυλῶν ᾅδου
  english_pob_choice: near the gates of Hades
  chosen_korean: 스올의 문들 가까이에서
  alternatives_korean:
