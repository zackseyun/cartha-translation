source:
  edition: lxx-swete-1909
  text: τῷ μακρὰν ἀπὸ θεοῦ παρʼ ὀλίγον ἐξεχύθη ἡ ψυχή μου εἰς θάνατον, σύνεγγυς πυλῶν ᾅδου μετὰ ἁμαρτωλοῦ·
