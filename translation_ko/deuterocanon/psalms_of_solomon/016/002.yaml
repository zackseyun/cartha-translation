translation:
  language: ko
  text: 내가 하나님에게서 멀리 있었을 때, 내 영혼은 죽음에 이르도록 거의 쏟아져 나갔으며, 나는 한 죄인과 함께 하데스의 문들 가까이에 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내 생명이 죽음에 이르도록 거의 쏟아져 나갔습니다.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “무덤의 문들 가까이에” 또는 “죽은 자들의 세계의 문들 가까이에”. 그리스어는 “하데스”라고 읽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ μακρὰν ἀπὸ θεοῦ
  english_pob_choice: When I was far from God
  chosen_korean: 내가 하나님에게서 멀리 있었을 때
