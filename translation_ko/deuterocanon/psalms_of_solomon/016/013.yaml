  to: 참으로 주께서 힘을 주지 않으시면[b], 누가 가난 속에서 징계[a]를 견디겠습니까?
  rationale: ὅτι의 이유 제시 기능을 ‘참으로’로 처리하고, ἐνισχύσῃς를 ‘힘을 주지 않으시면’으로 옮겨 원문의 목적어 생략을 보존했습니다. 각주 표지를 해당 어휘에 붙여 어휘 대안과 목적어 생략에 관한 설명의 범위를 명확히 했습니다. ‘징계’와 ‘가난 속에서 징계를 견디다’는 원문의 의미와 수사적 질문을 유지합니다.
