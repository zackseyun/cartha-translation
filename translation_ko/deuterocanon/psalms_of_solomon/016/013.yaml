translation:
  language: ko
  text: 참으로 주께서 힘을 주지 않으시면[b], 누가 가난 속에서 징계[a]를 견디겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘교훈’으로도 옮길 수 있습니다(παιδείαν).
    reason: lexical_alternative
  - marker: b
    text: 헬라어는 ‘힘을 주다’의 대상이 무엇인지 밝히지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἐνισχύσῃς
  english_pob_choice: give strength / strengthen
  chosen_korean: 강하게 하시지 않으면
  alternatives_korean:
  - 힘을 주시지 않으면
  - 강건하게 하시지 않으면
  - 버티게 하시지 않으면
  lexicon: BDAG
  rationale: 동사는 상대를 강하게 하거나 힘을 보태는 뜻이므로, 한국어로는 ‘강하게 하시다’가 가장 자연스럽고 원문의 의미를 직접 반영합니다.
- source_word: ὑφέξεται
  english_pob_choice: will endure
  chosen_korean: 견디겠습니까
  alternatives_korean:
  - 버티겠습니까
  - 감당하겠습니까
  - 참아 내겠습니까
  lexicon: LSJ
  rationale: 질문의 초점은 짐을 끝까지 감당하는 능력에 있으므로, ‘견디다’가 가장 간결하게 대응합니다.
- source_word: παιδείαν
  english_pob_choice: discipline
  chosen_korean: 징계
  alternatives_korean:
  - 훈육
  - 훈련
  - 교훈
  lexicon: BDAG
  rationale: 문맥상 가난 속에서 받는 엄중한 형성/교정의 의미가 강하므로, 교훈보다 직접적인 ‘징계’가 더 잘 맞습니다. 영어 주석의 ‘instruction’ 가능성은 본문 의미의 긴장을 보존합니다.
- source_word: ἐν πενίᾳ
  english_pob_choice: in poverty
  chosen_korean: 가난 속에서
  alternatives_korean:
  - 가난 가운데
  - 궁핍 속에서
  - 빈궁 가운데
  lexicon: LSJ
  rationale: πενία는 단순한 결핍이 아니라 실제 가난을 가리키므로, ‘가난 속에서’가 가장 직설적이고 한국어로도 자연스럽습니다.
theological_decisions:
- issue: 수사적 질문의 압박감 유지
  chosen_reading: 반문형을 살려, 하나님의 능력 없이는 아무도 가난 속의 징계를 감당할 수 없다는 긴박한 고백으로 옮겼습니다.
  alternative_readings:
  - 평서문으로 완화
  - 보다 설명적인 문장으로 풀어쓰기
  rationale: 원문은 조건절과 수사적 질문으로 절대적 의존을 강조하므로, 이를 약화시키지 않는 것이 중요합니다.
  doctrine_reference: 하나님의 능력에 대한 의존과 인간의 한계
- issue: ‘징계’와 ‘교훈’의 긴장 보존
  chosen_reading: 본문에는 교정적 훈련과 훈계의 뉘앙스가 함께 있으나, 한국어 본문은 ‘징계’를 택하고 해석 여지를 남겼습니다.
  alternative_readings:
  - 교훈
  - 훈련
  rationale: 영어 POB 주석이 παιδείαν의 어휘적 여지를 분명히 표시하므로, 한쪽 의미로 지나치게 고정하지 않고 본문을 간결하게 유지했습니다.
  doctrine_reference: 형성적 고난과 교정의 의미
