    issue: 접속 표현 ‘그러니’
    rationale: ὅτι는 일반적으로 이유·근거를 나타내며, ‘그러니’는 결론을 표시합니다. 단독 구절에서는 ‘참으로’가 원문의 논리 기능을 더 무리 없이 반영합니다.
  - severity: low
    issue: 본문 선택어와 각주 b의 불일치 및 각주 표지 위치
    rationale: 본문은 ‘강하게 하시지 않으면’인데 각주 b는 ‘힘을 주다’를 설명합니다. 또한 a와 b가 모두 문장 끝에 있어 해당 어휘와의 연결이 약합니다. 본문을 ‘힘을 주지 않으시면’으로 하고 각 표지를 해당 말 뒤에 배치하면 원문의 목적어 생략과 주석의 기능이 분명해집니다.
  revised_text: 참으로 주께서 힘을 주지 않으시면[b], 누가 가난 속에서 징계[a]를 견디겠습니까?
  revised_footnotes:
