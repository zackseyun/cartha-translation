base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/016/013.yaml
  text: For if you do not strengthen[b][a], who will endure discipline in poverty?
  footnotes:
  - marker: a
    text: Or 'instruction' for 'discipline' (παιδείαν).
    reason: lexical_alternative
