base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/016/003.yaml
  text: When my soul was being torn away from the Lord[d][c][b][a], the God of Israel—had not the Lord helped me by his mercy forever.
  footnotes:
  - marker: a
    text: Or 'when my soul was being carried away from the Lord, the God of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'had not the Lord come to my aid by his mercy.'
    reason: lexical_alternative
  - marker: c
    text: The phrase 'forever' may qualify either 'his mercy' or the whole saving action.
    reason: alternative_reading
  - marker: d
    text: Or 'When my soul was being torn away from the Lord, the God of Israel, had not the Lord helped me with his mercy forever,'.
    reason: previous_rendering
translation:
  language: ko
  text: 내 영혼이 이스라엘의 하나님이신 주님에게서 떼어져 나가고 있을 때, 주님께서 자신의 자비로 나를 도와주지 않으셨더라면—영원히.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 영혼이 이스라엘의 하나님이신 주님에게서 끌려가고 있을 때’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘주님께서 자신의 자비로 나를 도우셨더라면’이라는 뜻으로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: ‘영원히’는 ‘자비’만을 꾸밀 수도 있고, 구원하신 행위 전체를 꾸밀 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ διενεχθῆναι
  english_pob_choice: when ... was being torn away
  chosen_korean: …하고 있을 때
  alternatives_korean:
  - …으로 끌려가고 있을 때
  - …에서 떼어져 나가고 있을 때
  - …으로부터 분리되고 있을 때
  lexicon: LSJ
  rationale: 시간적 articular infinitive를 한국어의 자연스러운 종속절로 옮겼고, διενεχθῆναι의 고통스러운 수동성을 ‘떼어져 나가다’로 살렸습니다.
- source_word: ψυχήν μου
  english_pob_choice: my soul
  chosen_korean: 내 영혼
  alternatives_korean:
  - 내 생명
  - 나 자신
  lexicon: LSJ
  rationale: 이 탄원 문맥에서는 ψυχή가 인격적·영적 실재를 가리키므로, 의미의 무게를 살리는 ‘영혼’을 택했습니다.
- source_word: ἀπὸ Κυρίου θεοῦ Ἰσραήλ
  english_pob_choice: from the Lord, the God of Israel
  chosen_korean: 이스라엘의 하나님이신 주님에게서
  alternatives_korean:
  - 이스라엘의 하나님이신 주님으로부터
  - 주 하나님 이스라엘에게서
  lexicon: LSJ
  rationale: κύριος를 프로젝트 기본값인 ‘주님’으로 옮기고, 동격 구조를 ‘이스라엘의 하나님이신’으로 풀어 관계를 분명히 했습니다.
- source_word: ἀντελάβετό μου
  english_pob_choice: helped me
  chosen_korean: 나를 도와주지 않으셨더라면
  alternatives_korean:
  - 나를 붙들어 주지 않으셨더라면
  - 나를 도와주지 않으셨더라면
  - 나를 붙잡아 주지 않으셨더라면
  lexicon: LSJ
  rationale: ‘붙들다/붙잡다’도 가능하지만, 여기서는 구원의 도움이라는 의미가 가장 분명하므로 자연스러운 ‘도와주다’로 옮겼습니다.
- source_word: τῷ ἐλέει αὐτοῦ
  english_pob_choice: by his mercy
  chosen_korean: 자신의 자비로
  alternatives_korean:
  - 그의 자비로
  - 자비를 통해
  - 자비로
  lexicon: LSJ
  rationale: 여격의 도구적 의미를 한국어 조사 ‘-로’로 반영했고, 소유 대명사 αὐτοῦ는 앞선 주어를 가리키는 것으로 ‘자신의’로 자연화했습니다.
theological_decisions:
- issue: 여호와/κύριος의 표기
  chosen_reading: 주님
  alternative_readings:
  - 야훼
  - 주
  rationale: 이 절의 κύριος는 이미 ‘Lord’로 정리된 호칭이며, 본문 자체가 인용구 맥락 없이 일반 호칭으로 쓰이므로 한국어 표준 번역 관행에 맞춰 ‘주님’으로 두었습니다.
  doctrine_reference: DOCTRINE.md contested terms
- issue: εἰς τὸν αἰῶνα의 수식 범위
  chosen_reading: 문장 끝의 ‘영원히’로 남김
  alternative_readings:
  - ‘자비’만을 수식해 ‘그의 영원한 자비로’
  - 구원 행위 전체를 수식
  rationale: 그리스어의 위치상 ‘영원히’가 자비의 지속인지 구원의 결과인지 완전히 고정되지 않으므로, 한국어에서도 해석을 닫지 않고 문장 끝에 남겨 긴장을 보존했습니다.
  doctrine_reference: DOCTRINE.md principle 3
