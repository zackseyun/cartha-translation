review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘의 대응은 대체로 적절합니다. ψυχήν을 문맥상 ‘사람’으로 처리하고, ἐλέγχηται를 ‘책망을 받다’로 옮긴 것은 자연스럽습니다. 다만 ἐν χειρὶ ἀπωλίας αὐτοῦ는 난해한 도구적/권세적 표현인데, 본문의 ‘때문에’는 이를 다소 단정적인 인과로 좁힙니다. ‘…으로 말미암아’는 한국어에서 더 넓게 작용 수단·매개를 나타내며, 원문의 불확실성을 덜 해소합니다.
  naturalness: ‘그의 육체와 가난 가운데 있습니다’도 이해 가능하지만, 추상명사 ‘시험’과 결합할 때 ‘가난 속에 있습니다’가 현대 표준 한국어에서 더 자연스럽습니다. 조건절과 합쇼체 종결은 적절합니다.
  terminology: ‘멸망’, ‘책망’, ‘시험’, ‘육체’는 각각 ἀπώλεια, ἐλέγχω, δοκιμασία, σάρξ에 충실합니다. ‘영혼’과 ‘생명’은 각주에서 가능한 대안으로만 남겨, 본문의 ψυχή를 비물질적 실체로 한정하지 않는 처리가 적절합니다.
  issues:
