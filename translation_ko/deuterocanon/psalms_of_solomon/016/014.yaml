    rationale: ἐν χειρί는 ‘손에 의해’, ‘권세 아래에서’, ‘…을 통하여’ 등 행위 주체·수단·지배의 폭을 지닐 수 있습니다. ‘자기의 멸망으로 말미암아’는 문맥상 도구성을 살리면서도 단정적 해석을 줄입니다.
