base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/016/014.yaml
  text: If a person is rebuked by means of his ruin[b][a], your testing is in his flesh and in poverty.
  footnotes:
  - marker: a
    text: Or 'If a life is reproved in the power of his ruin.' The Greek of this clause is difficult.
    reason: alternative_reading
  - marker: b
    text: Or 'If a soul is rebuked by the hand of his destruction, your testing is in his flesh'.
    reason: previous_rendering
translation:
  language: ko
  text: 사람이 자기의 멸망 때문에 책망을 받는다면, 당신의 시험은 그의 육체와 가난 가운데 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 생명이 그의 멸망의 권세 아래에서 책망을 받는다면’. 이 그리스어 구절은 난해합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘한 영혼이 그의 멸망의 손에 의해 책망을 받는다면, 당신의 시험은 그의 육체에 있습니다’.
    reason: previous_rendering
lexical_decisions:
- source_word: ψυχήν
  english_pob_choice: a person / a soul
  chosen_korean: 사람이
  alternatives_korean:
  - 한 영혼이
  - 한 생명이
  lexicon: BDAG
  rationale: 이 문맥에서는 ψυχή가 개인 전체를 가리키는 뜻으로 쓰이므로, 한국어로는 자연스럽고 주어 호응도 맞는 ‘사람’이 가장 투명합니다. ‘영혼’은 독자에게 비물질적 실체를 강하게 떠올리게 해 본문이 요구하는 의미보다 좁아질 수 있습니다.
- source_word: ἐλέγχηται
  english_pob_choice: is rebuked
  chosen_korean: 책망을 받는다면
  alternatives_korean:
  - 꾸지람을 받는다면
  - 책망을 받는 경우라면
  - 드러나게 된다면
  lexicon: BDAG
  rationale: ἐλέγχω의 교정·질책의 뉘앙스를 살리되, 시적 문맥에서 법정적 ‘정죄’로 과도하게 굳히지 않도록 ‘책망을 받다’로 옮겼습니다.
- source_word: ἐν χειρὶ ἀπωλίας αὐτοῦ
  english_pob_choice: by means of his ruin
  chosen_korean: 자기의 멸망 때문에
  alternatives_korean:
  - 그의 멸망의 손으로
  - 그의 멸망의 권세 아래에서
  - 그의 파멸의 손에 의해
  lexicon: BDAG
  rationale: 직역의 ‘손’ 이미지는 한국어에서 다소 불투명하므로, POB의 문맥 판단에 따라 원인의 도구성을 드러내는 ‘때문에’를 택했습니다. 동시에 ‘멸망’은 ἀπώλεια의 직접적 대응어로 유지했습니다.
- source_word: δοκιμασία
  english_pob_choice: testing
  chosen_korean: 시험
  alternatives_korean:
  - 검증
  - 연단
  - 증명
  lexicon: BDAG
  rationale: δοκιμασία는 성질을 드러내는 검증·시험을 뜻하므로, 현대 한국어에서 의미가 가장 분명한 ‘시험’으로 옮겼습니다. ‘연단’은 신앙적 해석을 앞서게 할 수 있어 피했습니다.
theological_decisions:
- issue: 이 문장의 난해한 전치사구 ἐν χειρὶ ἀπωλίας αὐτοῦ를 어떻게 처리할지
  chosen_reading: POB의 최신 판단을 따라 ‘자기의 멸망 때문에’로 번역해, 본문의 난해함을 과도하게 매끈하게 만들지 않으면서도 한국어 독자가 이해할 수 있게 했습니다.
  alternative_readings:
  - 그의 멸망의 손에 의해
  - 그의 멸망의 권세 아래에서
  - 멸망의 손으로
  rationale: 그리스어는 히브리어식 표현이 겹친 난해한 구절이어서, 손(χείρ)의 은유를 한국어에서 그대로 유지하면 오히려 의미가 흐려질 수 있습니다. POB의 주해 전통에 맞추어 도구성/원인성을 드러내는 방향을 취했습니다.
  doctrine_reference: 시적 지혜문학의 난해 구절 처리 원칙
