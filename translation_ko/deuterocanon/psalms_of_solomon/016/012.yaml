id: PSS.16.12
reference: Psalms of Solomon 16:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: lxx-swete-1909
  text: εὐδοκία δὲ μετὰ ἱλαρότητος στήρισον τὴν ψυχήν μου· ἐν τῷ ἐνισχῦσαί σε τὴν ψυχήν μου ἀρκέσει μοι τὸ δοθέν.
  language: Greek
  pages:
  - 806
  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/016/012.yaml
  text: But establish my soul with favor and gladness[a]; when you strengthen my soul[b], what has been given will be enough for me.
  footnotes:
  - marker: a
    text: Or 'goodwill' or 'good pleasure' for 'favor.'
    reason: lexical_alternative
  - marker: b
    text: Or 'will suffice for me' for 'will be enough for me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 은총과 기쁨으로 제 영혼을 굳게 세워 주십시오[a]. 주님께서 제 영혼을 힘 있게 하실 때, 주어진 것이 제게 충분할 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘호의’, ‘선의’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘제게 충분할 것입니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδοκία
  english_pob_choice: favor
  chosen_korean: 은총
  alternatives_korean:
  - 호의
  - 은혜로운 호의
  lexicon: BDAG
  rationale: 문맥상 ‘기꺼이 베푸는 호의/선의’의 뜻이므로, 기도문에 어울리면서도 하나님의 긍정적 태도를 드러내는 ‘은총’으로 옮겼습니다.
- source_word: ἱλαρότητος
  english_pob_choice: gladness
  chosen_korean: 기쁨
  alternatives_korean:
  - 즐거움
  - 명랑함
  lexicon: LSJ
  rationale: ‘밝고 즐거운 상태’를 가리키므로, 현대 한국어에서 자연스럽고 예배문체에도 맞는 ‘기쁨’을 택했습니다.
- source_word: στήρισον τὴν ψυχήν μου
  english_pob_choice: establish my soul
  chosen_korean: 제 영혼을 굳게 세워 주십시오
  alternatives_korean:
  - 제 영혼을 세워 주십시오
  - 제 영혼을 견고하게 하십시오
  lexicon: LSJ
  rationale: στήρισον의 핵심은 ‘흔들리지 않게 굳게 함’이므로, 단순히 ‘강하게’보다 안정성과 확립을 살리는 ‘굳게 세워 주십시오’로 옮겼습니다.
- source_word: τὸ δοθέν
  english_pob_choice: what has been given
  chosen_korean: 주어진 것
  alternatives_korean:
  - 주신 것
  - 받은 것
  lexicon: BDAG
  rationale: 정관사+분사 구조의 열린 의미를 살려, 특정 물건으로 좁히지 않는 중성적 표현인 ‘주어진 것’으로 옮겼습니다.
theological_decisions:
- issue: 후반부의 주체를 어떻게 드러낼지
  chosen_reading: “주님께서 제 영혼을 힘 있게 하실 때”로 옮겨, 원문의 ἐνισχῦσαί σε에서 ‘당신께서’ 하시는 강건케 하심을 분명히 했습니다.
  alternative_readings:
  - “주님을 힘 있게 하실 때”
  - “주님이 제 영혼을 강하게 하실 때”
  rationale: 원문은 하나님께서 기도자의 영혼을 강하게 하시는 행위를 말하므로, 주체와 객체를 분명히 드러내는 번역이 필요합니다.
  doctrine_reference: 시편/지혜문학의 기도 언어에서 하나님의 능동적 돌보심을 분명히 표현
