lexical_decisions:
- source_word: ἐπικράτησόν μου
  english_pob_choice: Restrain me
  chosen_korean: 저를 막아 주십시오
  alternatives_korean:
  - 저를 억제해 주십시오
  - 저를 제어해 주십시오
  - 저를 다스려 주십시오
  lexicon: LSJ
  rationale: ἐπικρατέω는 ‘지배하다/억제하다/붙들다’의 힘을 지니며, 여기서는 죄와 유혹에서 멀어지게 해 달라는 간구이므로 한국어로는 자연스러운 ‘막아 주십시오’가 가장 직접적입니다.
- source_word: ἀπὸ ἁμαρτίας πονηρᾶς
  english_pob_choice: from evil sin
  chosen_korean: 악한 죄에서
  alternatives_korean:
  - 악한 죄로부터
  - 악한 죄로부터 멀리
  - 사악한 죄에서
  lexicon: LSJ
  rationale: ἀπό는 분리와 이탈을 나타내므로 ‘~에서’로 옮겨 거리감을 살렸고, πονηρᾶς는 죄의 도덕적 악함을 강조하므로 ‘악한’으로 직역에 가깝게 반영했습니다.
- source_word: σκανδαλιζούσης
  english_pob_choice: who causes ... to stumble
  chosen_korean: 넘어지게 하는
  alternatives_korean:
  - 실족하게 하는
  - 걸려 넘어지게 하는
  - 함정에 빠뜨리는
  lexicon: LSJ
  rationale: σκανδαλίζω는 문자적으로 ‘걸려 넘어지게 하다’는 뜻이므로, 한국어 본문에서는 이미지가 살아 있는 ‘넘어지게 하는’으로 옮겼습니다.
theological_decisions:
- issue: 원문이 지시하는 보호 청원의 강도
  chosen_reading: 하나님께서 화자를 죄와 유혹으로부터 적극적으로 막아 주시는 보호의 간구로 번역했습니다.
  alternative_readings:
  - 하나님이 화자 위에 군림하신다는 뉘앙스
  - 단순히 죄를 멀리하게 해 달라는 완화된 표현
  rationale: 문맥의 초점은 지배권 자체보다 보호와 억제에 있으므로, 원문의 힘을 유지하면서도 한국어 기도문으로 자연스럽게 읽히는 표현을 택했습니다.
  doctrine_reference: 시편 19:13의 ‘고의 죄에서 벗어나게 하소서’와 유사한 보호 청원 전통
- issue: 성별이 표기된 ἄφρονα의 처리
  chosen_reading: ‘어리석은 사람’으로 옮기고, 문맥상 일반적 인간을 가리킬 수 있는 폭을 열어 두었습니다.
  alternative_readings:
  - ‘어리석은 남자’
  - ‘어리석은 자’
  rationale: 그리스어는 남성 단수형이지만, 한국어에서 이 표현은 일반적으로 사람 전체를 가리키는 경구적 의미도 가능하므로 과도하게 성별을 고정하지 않되 원문의 의미를 유지했습니다.
  doctrine_reference: 문법적 성별과 의미 범위의 구분 원칙
