base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/016/011.yaml
  text: Keep grumbling and faintheartedness in affliction far from me[a], when I sin, as you discipline me for repentance.
  footnotes:
  - marker: a
    text: Or 'if you should err while disciplining me'.
    reason: previous_rendering
translation:
  language: ko
  text: 원망과 낙심을, 환난 가운데서 제게서 멀리하여 주십시오[a]. 제가 죄를 지을 때, 주께서 저를 징계하사 회개에 이르게 하실 때에.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ἁμαρτήσῃς로 전해지지만, 문맥과 본문 교정에 따라 ‘제가 죄를 지을 때’로 읽는 것이 적절합니다.
    reason: textual_variant
lexical_decisions:
- source_word: γογγυσμὸν
  english_pob_choice: grumbling
  chosen_korean: 원망
  alternatives_korean:
  - 불평
  - 투덜거림
  - 원망 섞인 불평
  lexicon: LSJ
  rationale: γογγυσμός는 불평이나 투덜거림의 뉘앙스를 가지며, 시적 기도문 맥락에서는 내면의 원망을 드러내므로 ‘원망’이 자연스럽고 간결합니다.
- source_word: ὀλιγοψυχίαν
  english_pob_choice: faintheartedness
  chosen_korean: 낙심
  alternatives_korean:
  - 겁약함
  - 의기소침
  - 마음이 약해짐
  lexicon: LSJ
  rationale: 직역하면 ‘마음이 작아짐’에 가까워, 두려움과 기력 상실을 아우르는 ‘낙심’이 현대 한국어에서 가장 적절합니다.
- source_word: ἐν θλίψει
  english_pob_choice: in affliction
  chosen_korean: 환난 가운데서
  alternatives_korean:
  - 고난 중에
  - 고통 속에서
  - 압박 가운데서
  lexicon: LSJ
  rationale: θλῖψις의 기본 뜻은 압박·환난·고난이며, 기도문 문체에서는 ‘환난 가운데서’가 격조를 유지하면서도 자연스럽습니다.
- source_word: ἐὰν ἁμαρτήσῃς
  english_pob_choice: when I sin
  chosen_korean: 제가 죄를 지을 때
  alternatives_korean:
  - 내가 죄를 지을 때
  - 제가 범죄할 때
  - 제가 허물질 때
  lexicon: LSJ
  rationale: 문맥과 본문의 교정 취지를 따라 화자는 자신을 가리키는 것으로 이해해야 하므로, 주어를 명시해 ‘제가 죄를 지을 때’로 옮겼습니다.
- source_word: ἐν τῷ σε παιδεύειν
  english_pob_choice: as you discipline me
  chosen_korean: 주께서 저를 징계하사
  alternatives_korean:
  - 주께서 저를 징계하실 때
  - 주께서 저를 훈련하시며
  - 주께서 저를 책망하실 때
  lexicon: LSJ
  rationale: παιδεύω는 단순 처벌보다 교정·훈육의 뜻이 강하므로 ‘징계하사’가 문맥상 더 정확합니다.
- source_word: εἰς ἐπιστροφήν
  english_pob_choice: for repentance
  chosen_korean: 회개에 이르게 하실 때
  alternatives_korean:
  - 회개를 위하여
  - 돌이킴에 이르게 하실 때
  - 회복으로
  lexicon: LSJ
  rationale: ἐπιστροφή는 돌이킴/회개를 뜻하며, εἰς의 방향성을 살려 ‘회개에 이르게’로 표현했습니다.
theological_decisions:
- issue: 본문의 주어와 신학적 일관성
  chosen_reading: ‘제가 죄를 지을 때’로 읽어, 하나님이 죄를 짓는다는 불가능한 의미를 피했습니다.
  alternative_readings:
  - ‘주께서 죄를 지으실 때’
  - ‘주께서 어긋나실 때’
  rationale: 전승상 ἁμαρτήσῃς는 문맥과 신학에 맞지 않으므로, 저자의 분명한 의도에 따라 화자 자신이 죄를 짓는 것으로 이해하는 것이 타당합니다.
  doctrine_reference: 하나님의 무죄성과 기도문 문맥
- issue: 징계의 성격
  chosen_reading: ‘주께서 저를 징계하사 회개에 이르게 하실 때’로, 징계를 파괴가 아닌 회개의 목적을 가진 교정으로 표현했습니다.
  alternative_readings:
  - ‘주께서 저를 벌하실 때’
  - ‘주께서 저를 다루실 때’
  rationale: παιδεύω와 εἰς ἐπιστροφήν은 교정과 회복의 방향을 함께 가지므로, 한국어에서도 그 교육적·회복적 성격을 드러내는 것이 좋습니다.
  doctrine_reference: 징계와 회개에 관한 성경적 교훈
