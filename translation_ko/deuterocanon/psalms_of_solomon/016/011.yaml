    text: 직역하면, “당신이 돌이킴을 위하여 징계하는 동안 잘못한다면”입니다. 전승된 그리스어는 ‘잘못한다’와 ‘징계하는’의 주어를 모두 2인칭 단수로 나타내며, 징계의 목적어도 명시하지 않습니다. 이 난해한 본문을 ‘내가 죄를 지을 때, 주께서 나를 징계하실 때’로 고쳐 읽는 제안이 있으나, 본문에는 그 추정 교정을 반영하지 않았습니다.
