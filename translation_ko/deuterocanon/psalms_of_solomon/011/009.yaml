  text: ποιήσαι Κύριος ἃ ἐλάλησεν ἐπὶ Ἰσραὴλ καὶ Ἰερουσαλήμ· ἀναστήσαι Κύριος τὸν Ἰσραὴλ ἐν ὀνόματι δόξης αὐτοῦ. τοῦ κυρίου τὸ ἔλεος ἐπὶ τὸν Ἰσραὴλ εἰς τὸν αἰῶνα καὶ ἔτι.
  language: Greek
