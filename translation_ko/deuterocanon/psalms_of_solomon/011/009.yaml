base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/011/009.yaml
  text: May the Lord do what he has spoken concerning Israel and Jerusalem[a]; may the Lord raise up Israel in the name of his glory[d][c][b]. The Lord’s mercy be upon Israel forever and ever.
  footnotes:
  - marker: a
    text: Or 'fulfill what he has spoken concerning Israel and Jerusalem.'
    reason: lexical_alternative
  - marker: b
    text: Or 'restore Israel' for 'raise up Israel.'
    reason: alternative_reading
  - marker: c
    text: Literally, 'forever and still/further.'
    reason: lexical_alternative
  - marker: d
    text: Or 'forevermore'.
    reason: previous_rendering
translation:
  language: ko
  text: 주님께서 이스라엘과 예루살렘에 관해 말씀하신 것을 이루시기를 바랍니다[a]. 주님께서 그분의 영광의 이름으로 이스라엘을 일으키시기를 바랍니다[b]. 주님의 자비가 이스라엘 위에 영원토록, 또 그 너머까지 있기를 바랍니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘과 예루살렘에 관해 말씀하신 대로 행하시기를.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이스라엘을 회복하시기를.’
    reason: alternative_reading
  - marker: c
    text: 직역하면 ‘영원토록, 그리고 더’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσαι
  english_pob_choice: do
  chosen_korean: 이루시기를 바랍니다
  alternatives_korean:
  - 하시기를 바랍니다
  - 행하시기를 바랍니다
  - 실행하시기를 바랍니다
  lexicon: LSJ
  rationale: 희구형 용법을 살려 ‘바라다’ 구문으로 옮기되, 단순한 행위보다 선포된 말씀의 성취를 자연스럽게 드러내는 ‘이루시다’를 택했습니다.
- source_word: ἐλάλησεν ἐπὶ Ἰσραὴλ καὶ Ἰερουσαλήμ
  english_pob_choice: has spoken concerning Israel and Jerusalem
  chosen_korean: 이스라엘과 예루살렘에 관해 말씀하신
  alternatives_korean:
  - 이스라엘과 예루살렘에 대하여 말씀하신
  - 이스라엘과 예루살렘을 두고 말씀하신
  lexicon: LSJ
  rationale: ἐπί + 목적격의 참조 대상을 자연스러운 한국어로 옮기기 위해 ‘관해’로 처리했고, 예언적 뉘앙스를 지나치게 좁히지 않았습니다.
- source_word: ἀναστήσαι
  english_pob_choice: raise up
  chosen_korean: 일으키시기를 바랍니다
  alternatives_korean:
  - 회복하시기를 바랍니다
  - 다시 세우시기를 바랍니다
  - 일으켜 세우시기를 바랍니다
  lexicon: LSJ
  rationale: 영어 POB가 보존한 넓은 의미를 따라 ‘회복’으로 한정하지 않고, 신체적·역사적 비유를 함께 담을 수 있는 ‘일으키다’를 택했습니다.
- source_word: ἐν ὀνόματι δόξης αὐτοῦ
  english_pob_choice: in the name of his glory
  chosen_korean: 자기 영광의 이름으로
  alternatives_korean:
  - 그의 영광의 이름으로
  - 그 영광스러운 이름으로
  - 자기의 영광을 드러내는 이름으로
  lexicon: LSJ
  rationale: ‘이름’과 ‘영광’의 병치를 유지하기 위해 구조를 보존했습니다. 한국어에서는 ‘자기 영광의 이름으로’가 가장 직접적으로 대응합니다.
- source_word: εἰς τὸν αἰῶνα καὶ ἔτι
  english_pob_choice: forever and ever
  chosen_korean: 영원히, 또 그 이후에도
  alternatives_korean:
  - 영원토록, 그리고 더
  - 영원히, 또 계속하여
  - 영원히, 더 나아가
  lexicon: LSJ
  rationale: 반복적 종결 공식의 압력을 살리면서도 현대 한국어에서 자연스럽게 읽히도록, 단순한 ‘영원히’보다 확장감을 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘raise up Israel’의 범위
  chosen_reading: 이스라엘을 ‘일으키시다’로 두어 회복, 재세움, 높이심의 폭을 열어 두었습니다.
  alternative_readings:
  - 이스라엘을 회복하시다
  - 이스라엘을 다시 세우시다
  rationale: 그리스어 동사는 문맥상 하나로 단정하기 어려운 폭을 가지므로, 해석을 좁히지 않고 본문의 소망을 그대로 보존했습니다.
  doctrine_reference: 해석의 폭을 유지하고 신학적 긴장을 보존합니다.
