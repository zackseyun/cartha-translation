  - marker: a
    text: Or 'in the oversight/care of the glory of their God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님은 그들에게 향기로운 모든 나무를 자라나게 하셨습니다[a]. 그리하여 이스라엘이 그들의 하나님 영광의 방문 가운데 지나가게 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 하나님 영광의 돌보심/감독 가운데’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ξύλον εὐωδίας
  english_pob_choice: every fragrant tree
  chosen_korean: 향기로운 모든 나무
  alternatives_korean:
  - 모든 향기로운 나무
  - 향내 나는 모든 나무
  lexicon: LSJ
  rationale: πᾶν은 단수 ξύλον과 함께 분배적으로 읽히므로 ‘모든’으로 살리고, εὐωδίας는 나무의 성질을 수식하는 표현이므로 ‘향기로운’이 가장 자연스럽습니다.
- source_word: ἀνέτειλεν
  english_pob_choice: made spring up
  chosen_korean: 자라나게 하셨습니다
  alternatives_korean:
  - 솟아나게 하셨습니다
  - 돋아나게 하셨습니다
  lexicon: LSJ
  rationale: 식물의 돋아남과 하나님의 능동적 행위를 함께 살리기 위해 ‘자라나게 하셨습니다’로 옮겼습니다.
- source_word: παρέλθῃ
  english_pob_choice: might pass through
  chosen_korean: 지나가게 하셨습니다
  alternatives_korean:
  - 지나가도록 하셨습니다
  - 통과하게 하셨습니다
  lexicon: LSJ
  rationale: 이스라엘의 이동을 자연스럽게 드러내면서도, 준비된 공간을 따라 ‘지나가다’는 동작을 분명히 했습니다.
- source_word: ἐν ἐπισκοπῇ δόξης θεοῦ αὐτῶν
  english_pob_choice: in the visitation of the glory of their God
  chosen_korean: 그들의 하나님 영광의 방문 가운데
  alternatives_korean:
  - 그들의 하나님 영광의 돌보심 가운데
  - 그들의 하나님 영광의 감독 아래
  lexicon: LSJ
  rationale: ἐπισκοπή는 여기서 행정적 ‘감독’보다 신적 임재의 ‘방문’이 더 적절하므로, POB의 해석을 따라 ‘방문’으로 옮겼습니다.
theological_decisions:
- issue: ἐπισκοπῇ δόξης θεοῦ αὐτῶν의 신학적 뉘앙스
  chosen_reading: 이스라엘은 하나님의 영광이 임하여 돌보는 가운데를 지나가게 됩니다.
  alternative_readings:
  - 이스라엘이 그들의 하나님 영광의 돌보심 아래 지나가게 됩니다.
  - 이스라엘이 그들의 하나님 영광의 감독 아래 지나가게 됩니다.
  rationale: 이 구절은 하나님의 영광스러운 임재가 백성의 길을 동행하고 지키는 장면을 가리키므로, 단순한 행정적 관리가 아니라 신적 방문과 현존의 뜻을 보존해야 합니다.
  doctrine_reference: 하나님의 임재와 섭리
