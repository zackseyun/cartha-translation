  text: πᾶν ξύλον εὐωδίας ἀνέτειλεν αὐτοῖς ὁ θεός, ἵνα παρέλθῃ Ἰσραὴλ ἐν ἐπισκοπῇ δόξης θεοῦ αὐτῶν,
