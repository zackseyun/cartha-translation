base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/011/006.yaml
  text: The hills fled from their approach[c][b][a]; the forests gave them shade along their way.
  footnotes:
  - marker: a
    text: Or 'at their coming in.' The Greek phrase ἀπὸ εἰσόδου αὐτῶν is compact and may be rendered slightly differently in English.
