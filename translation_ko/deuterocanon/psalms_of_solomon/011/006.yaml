    reason: previous_rendering
translation:
  language: ko
  text: 산들이 그들의 접근 앞에서 달아났고, 숲들은 그들의 길가에서 그들에게 그늘을 드리웠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ βουνοὶ
  english_pob_choice: The hills
  chosen_korean: 산들
  alternatives_korean:
  - 언덕들
  - 산들
  lexicon: LSJ
  rationale: βουνοί는 보통 ‘hill’ 계열의 낮은 지형을 가리키지만, 한국어에서는 ‘산들’이 자연스러운 지형 이미지로서 시적 병행을 살리기 쉽습니다.
- source_word: ἔφυγον ἀπὸ εἰσόδου αὐτῶν
  english_pob_choice: fled from their approach
  chosen_korean: 그들의 접근 앞에서 달아났고
  alternatives_korean:
  - 그들의 들어옴 앞에서 달아났고
  - 그들이 들어오는 것을 피해 달아났고
  lexicon: LSJ
  rationale: ἀπὸ εἰσόδου αὐτῶν은 ‘들어옴/도착’의 순간을 가리키는 압축된 표현이므로, 단순한 ‘들어옴’보다 ‘접근’이 원문의 활발한 도착감을 더 자연스럽게 드러냅니다.
- source_word: δρυμοὶ
  english_pob_choice: forests
  chosen_korean: 숲들
  alternatives_korean:
  - 산림들
  - 수풀들
  lexicon: LSJ
  rationale: δρυμοί는 숲이나 우거진 나무 지역을 뜻하므로, ‘숲들’이 가장 직접적이며 한국어 시적 문맥에서도 무리 없이 읽힙니다.
- source_word: ἐσκίασαν αὐτοῖς ἐν τῇ παρόδῳ αὐτῶν
  english_pob_choice: gave them shade along their way
  chosen_korean: 그들의 길가에서 그들에게 그늘을 드리웠습니다
  alternatives_korean:
  - 그들의 길을 따라 그들에게 그늘을 드리웠습니다
  - 그들이 지나가는 동안 그들에게 그늘을 드리웠습니다
  lexicon: LSJ
  rationale: ἐσκίασαν αὐτοῖς는 ‘그들에게 그늘을 주다’라는 수혜적 뉘앙스를 가지므로 ‘그늘을 드리웠습니다’가 가장 자연스럽고, ἐν τῇ παρόδῳ αὐτῶν은 ‘길가/지나는 길’의 경로 감각을 유지합니다.
