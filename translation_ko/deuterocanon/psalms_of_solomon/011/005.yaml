translation:
  language: ko
  text: 높은 산들을 그들에게 평탄한 땅으로 낮추셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὄρη
  english_pob_choice: mountains
  chosen_korean: 산들
  alternatives_korean:
  - 산
  - 높은 산들
  - 봉우리들
  lexicon: LSJ
  rationale: ὄρη는 보통 산들을 가리키므로, 한국어에서도 자연스럽고 규모감이 살아 있는 복수형 ‘산들’로 옮겼습니다.
- source_word: ὑψηλά
  english_pob_choice: high
  chosen_korean: 높은
  alternatives_korean:
  - 높이 솟은
  - 고산의
  - 숭고한
  lexicon: LSJ
  rationale: 지형의 물리적 높이를 가리키는 형용사이므로, 과도한 문어체를 피하고 직접적인 ‘높은’으로 렌더링했습니다.
- source_word: ἐταπείνωσεν
  english_pob_choice: brought low
  chosen_korean: 낮추셨습니다
  alternatives_korean:
  - 겸손하게 하셨습니다
  - 비하하셨습니다
  - 내리셨습니다
  lexicon: LSJ
  rationale: 산을 대상으로 할 때는 윤리적 ‘겸손하게 하다’보다 물리적 낮춤이 핵심이므로, 결과를 분명히 드러내는 ‘낮추셨습니다’가 적절합니다.
- source_word: εἰς ὁμαλισμὸν
  english_pob_choice: into level ground
  chosen_korean: 평탄한 땅으로
  alternatives_korean:
  - 평지로
  - 평평한 곳으로
  - 평야로
  lexicon: LSJ
  rationale: ‘평탄함/평평함’의 결과 상태를 한국어로 자연스럽게 표현하기 위해 목적·결과를 나타내는 ‘~으로’와 함께 ‘평탄한 땅’으로 옮겼습니다.
theological_decisions:
- issue: 산을 낮추는 표현의 해석
  chosen_reading: 시적 과장보다 실제로 지형을 평평하게 하시는 하나님의 능력을 드러내는 자연적 이미지로 읽고 옮겼습니다.
  alternative_readings:
  - 도덕적으로 교만한 자들을 낮추는 은유로 읽기
  - 단순한 시적 수사로 완화하여 번역하기
  rationale: 문맥상 대상이 ‘산들’이므로, 은유를 과잉 해석하지 않고 창조 질서를 바꾸시는 하나님의 주권적 행위를 직접적으로 드러내는 쪽이 원문에 가깝습니다.
  doctrine_reference: 하나님의 주권과 창조 세계에 대한 통치
- issue: dative αὐτοῖς의 처리
  chosen_reading: ‘그들에게’는 유익/대상의 뉘앙스를 살린 간접목적어로 처리했습니다.
  alternative_readings:
  - 그것들을 위해
  - 그들에게로
  rationale: 본문의 dative는 결과가 그들의 편익을 위한 것임을 나타내므로, 한국어에서는 ‘그들에게’가 가장 간결하고 오해가 적습니다.
  doctrine_reference: 문법적 여격의 수혜/이익 의미
