  - severity: low
    issue: ‘평탄한 땅으로’의 표현
    rationale: 의미는 맞지만 ‘평지로’가 εἰς ὁμαλισμόν의 평탄화 결과를 더 자연스럽고 간결하게 나타냅니다.
