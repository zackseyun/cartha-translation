  naturalness: ‘그들에게 평탄한 땅으로 낮추셨습니다’는 수식 관계가 다소 걸립니다. 수혜자를 앞에 두고 ‘평지로’라고 하면 현대 표준 한국어에서 더 자연스럽고 원문의 결과 표현도 잘 살아납니다.
  terminology: ‘높은 산들’, ‘낮추셨습니다’, ‘평지’는 지형을 물리적으로 낮추어 평탄하게 한다는 문맥에 적합합니다. 원문은 이 한 절에서 행위자를 명시하지 않으므로 번역문에도 별도의 신학적 해석을 덧붙이지 않았습니다.
  issues:
