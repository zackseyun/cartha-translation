translation:
  language: ko
  text: 예루살렘아, 높은 곳에 서서 동쪽과 서쪽에서 모여든 네 자녀를 보아라—주께서 모으신 자들이다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
