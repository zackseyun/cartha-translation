  - marker: b
    text: ‘모여든’은 εἰς ἅπαξ의 동시성·함께 모임의 뉘앙스를 반영한 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: στῆθι
  english_pob_choice: Stand
  chosen_korean: 서서
  alternatives_korean:
  - 서라
  - 일어서라
  - 자리를 잡아라
  lexicon: LSJ
  rationale: 도시 예루살렘을 향한 직접 명령을 한국어에서 자연스럽게 살리기 위해 ‘서서’로 옮겼습니다. 이어지는 ‘보아라’와도 동작이 잘 이어집니다.
- source_word: ἐφʼ ὑψηλοῦ
  english_pob_choice: on high
  chosen_korean: 높은 곳에
  alternatives_korean:
  - 높이
  - 산 위에
  - 높은 자리에서
  lexicon: LSJ
  rationale: 여기서는 추상적 ‘하늘 위’가 아니라 실제로 내려다볼 수 있는 높은 지점을 가리키므로, 공간성을 분명하게 드러내는 ‘높은 곳에’를 택했습니다.
- source_word: τέκνα σου
  english_pob_choice: your children
  chosen_korean: 네 자녀를
  alternatives_korean:
  - 네 아이들을
  - 네 자손을
  - 네 자녀들
  lexicon: LSJ
  rationale: τέκνα는 혈연적 ‘자식들’보다 넓은 공동체적 후손을 포함할 수 있어, 예루살렘의 백성을 가리키는 뜻을 살려 ‘자녀’를 사용했습니다.
- source_word: συνηγμένα εἰς ἅπαξ
  english_pob_choice: gathered ... all at once
  chosen_korean: 모여든
  alternatives_korean:
  - 한데 모인
  - 함께 모인
  - 일시에 모인
  lexicon: LSJ
  rationale: εἰς ἅπαξ는 단순한 ‘한 번에’보다 함께 모임/동시성을 띨 수 있어, 한국어에서는 매끄럽게 읽히는 ‘모여든’으로 압축해 그 뉘앙스를 담았습니다.
theological_decisions:
- issue: ‘주께서’의 행위 주체 표현
  chosen_reading: ‘주께서 모으신 자들이다’로 마무리하여, 모임의 주체가 사람의 귀환이 아니라 주님의 행위임을 분명히 했습니다.
  alternative_readings:
  - ‘주님이’
  - ‘주로부터’
  - ‘주님에 의해’
  rationale: 그리스어 ἀπὸ Κυρίου는 단순 출처를 넘어 모으시는 주님의 주도성을 드러낼 수 있어, 한국어에서 자연스러운 수동적 종결로 그 의미를 살렸습니다.
  doctrine_reference: 하나님의 주권적 회복
- issue: 예루살렘에 대한 직접 호명과 명령형
  chosen_reading: ‘예루살렘아’와 ‘보아라’를 사용해 예언적 호출의 긴박함과 생생함을 유지했습니다.
  alternative_readings:
  - ‘예루살렘이여’
  - ‘살펴보아라’
  - ‘봐라’
  rationale: 본문은 성읍을 인격적으로 부르며 회복 장면을 보게 하는 예언적 어조이므로, 현대 한국어에서도 직접적인 호명과 명령을 유지하는 것이 원문 효과를 가장 잘 전달합니다.
  doctrine_reference: 예언적 환호와 회복의 소망
