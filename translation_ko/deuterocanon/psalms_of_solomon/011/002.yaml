base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/011/002.yaml
  text: 'Proclaim in Jerusalem the voice of one bringing good news: for God has shown mercy to Israel in their visitation[a][b][c].'
  footnotes:
  - marker: a
    text: Or 'the sound/voice of one announcing good news.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in their oversight' or 'in their intervention'; the Greek term can denote a visitation or attentive act of care.
    reason: lexical_alternative
  - marker: c
    text: Or 'in their visitation.'.
    reason: previous_rendering
translation:
  language: ko
  text: 예루살렘에서 복음 전하는 이의 소리를 선포하십시오. 이는 하나님께서 이스라엘을 그들의 돌보심[a] 가운데서 긍휼히 여기셨기 때문입니다.
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 ‘그들의 방문하심’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρύξατε
  english_pob_choice: Proclaim
  chosen_korean: 선포하십시오
  alternatives_korean:
  - 선언하십시오
  - 외치십시오
  - 전하십시오
  lexicon: BDAG
  rationale: 공적이고 권위 있는 명령형을 살리면서도 현대 한국어에서 지나치게 경직되지 않게 옮겼습니다.
- source_word: φωνὴν εὐαγγελιζομένου
  english_pob_choice: the voice of one bringing good news
  chosen_korean: 복음 전하는 이의 소리
  alternatives_korean:
  - 좋은 소식을 전하는 이의 소리
  - 복음을 전하는 자의 소리
  - 기쁜 소식을 전하는 이의 소리
  lexicon: BDAG
  rationale: φωνή와 participle의 결합을 ‘소리’와 ‘전하는 이’로 분리해, 단순한 내용이 아니라 선포되는 음성의 이미지를 유지했습니다.
- source_word: ἐπισκοπῇ
  english_pob_choice: visitation
  chosen_korean: 돌보심
  alternatives_korean:
  - 방문하심
  - 감찰
  - 찾아오심
  - 돌보아 주심
  lexicon: BDAG
  rationale: 이 문맥에서는 하나님의 자비로운 개입과 돌봄이 핵심이므로, 교회 직분 용어가 아닌 일반적 의미의 ‘돌보심’으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: ἐπισκοπῇ αὐτῶν의 의미
  chosen_reading: 하나님의 자비로운 돌보심/방문이 이스라엘에게 임한 것으로 이해했습니다.
  alternative_readings:
  - 감독
  - 개입
  - 방문
  rationale: 문맥의 초점이 회복과 복음 선포에 있으므로, 중립적 행정 행위가 아니라 구원사적 긍휼의 행동으로 읽는 것이 적절합니다.
  doctrine_reference: 하나님의 긍휼과 구원적 돌보심
