translation:
  language: ko
  text: 그들은 북쪽에서 그들의 하나님[a]의 기쁨 안에 옵니다. 먼 섬들에서 하나님이 그들을 모으셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘해안지방들’로 볼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ βορρᾶ
  english_pob_choice: from the north
  chosen_korean: 북쪽에서
  alternatives_korean:
  - 북에서
  - 북쪽으로부터
  lexicon: BDAG
  rationale: ἀπό+속격은 출처를 나타내므로 ‘~에서’로 옮기고, βορρᾶ는 ‘북쪽’을 뜻하므로 방향성을 자연스럽게 살렸습니다.
- source_word: τῇ εὐφροσύνῃ
  english_pob_choice: in the joy
  chosen_korean: 기쁨 안에
  alternatives_korean:
  - 기쁨 가운데
  - 즐거움 속에
  - 기쁨으로
  lexicon: BDAG
  rationale: 여격의 방식/상태를 살려 명사형 ‘기쁨’을 유지하고, 한국어에서도 상태를 드러내는 ‘안에’로 번역해 원문의 문법적 밀도를 보존했습니다.
- source_word: ἐκ νήσων μακρόθεν
  english_pob_choice: from distant islands
  chosen_korean: 먼 섬들에서
  alternatives_korean:
  - 멀리 있는 섬들에서
  - 먼 해안지방에서
  lexicon: BDAG
  rationale: νῆσοι의 기본값인 ‘섬들’을 따르되, μακρόθεν의 거리감을 ‘먼’으로 간결하게 반영했습니다. 영어 주석의 ‘coastlands’ 가능성은 본문에 넣지 않고 각주로만 처리했습니다.
- source_word: συνήγαγεν
  english_pob_choice: has gathered
  chosen_korean: 모으셨습니다
  alternatives_korean:
  - 모으셨습니다
  - 모았습니다
  - 한데 모으셨습니다
  lexicon: BDAG
  rationale: 완료된 하나님의 행위를 한국어 완료형으로 옮겨 문맥의 성취감을 살렸고, 문장 흐름상 동사의 주체를 분명히 하기 위해 존칭 형태를 사용했습니다.
theological_decisions:
- issue: 하나님을 지칭하는 표현과 주어의 반복
  chosen_reading: 본문의 θεός는 두 절 모두 ‘하나님’으로 일관되게 옮기고, 마지막 절의 명시적 주어도 그대로 살렸습니다.
  alternative_readings:
  - 마지막 절의 주어를 생략하여 더 매끈하게 옮김
  - 첫 절의 ‘그들의 하나님’을 ‘하나님’만으로 단순화
  rationale: 시편적 병행 구조에서 하나님의 소속성과 행위 주체를 모두 분명히 드러내는 것이 중요하므로, 원문의 강조를 약화시키지 않도록 반복을 유지했습니다.
  doctrine_reference: 시편적 병행법과 하나님의 구원 행위의 명시성
- issue: ‘기쁨 안에’라는 다소 직역적인 구조
  chosen_reading: 한국어에서도 원문의 상태·방식 표현을 살려 ‘기쁨 안에’로 두었습니다.
  alternative_readings:
  - ‘기쁨으로’
  - ‘즐거워하며’
  rationale: 행동의 분위기만이 아니라 그들이 처한 상태를 드러내는 εὐφροσύνῃ의 뉘앙스를 보존하기 위해, 자연성보다 원문 구조의 가시성을 우선했습니다.
  doctrine_reference: 원문 수사와 감정 상태의 보존
