  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: lxx-swete-1909
  text: ἀπὸ βορρᾶ ἔρχονται τῇ εὐφροσύνῃ τοῦ θεοῦ αὐτῶν· ἐκ νήσων μακρόθεν συνήγαγεν αὐτοὺς ὁ θεός.
  language: Greek
