  alternatives_korean:
  - 시온 안에서
  - 시온에
  lexicon: LSJ
  rationale: ἐν의 장소적 의미를 그대로 살려, 예배적·공적 중심지인 시온이라는 배경을 보존했습니다.
- source_word: ἐν σάλπιγγι σημασίας
  english_pob_choice: with the trumpet of the holy signal
  chosen_korean: 거룩한 신호의 나팔로
  alternatives_korean:
  - 신호 나팔로
  - 소집의 나팔로
  - 거룩한 소집의 나팔로
  lexicon: LSJ
  rationale: σάλπιγγι σημασίας를 한국어의 소유격보다 용도·기능을 드러내는 구성으로 옮겨, ‘신호를 위한 나팔’이라는 의미를 살렸습니다.
- source_word: ἁγίων
  english_pob_choice: the holy ones
  chosen_korean: 거룩한
  alternatives_korean:
  - 성도들의
  - 거룩한 자들의
  - 성별된
  lexicon: LSJ
  rationale: 영어 POB의 최신 수정처럼 ἁγίων을 노골적으로 특정 집단명으로 좁히지 않고, 형용사적으로 처리해 원문의 개방성을 남겼습니다.
theological_decisions:
- issue: ἁγίων의 지시 대상
  chosen_reading: ‘거룩한’으로 처리해, 나팔의 대상이 제사장인지, 성별된 백성인지, 혹은 거룩한 이들 일반인지 확정하지 않았습니다.
  alternative_readings:
  - 성도들의
  - 거룩한 자들의
  - 제사장들의
  rationale: 그리스어 자체가 지시 대상을 명시적으로 한정하지 않으므로, 해석의 긴장을 보존하는 쪽이 본문에 더 충실합니다.
  doctrine_reference: 해석의 불확정성 보존
