  - severity: low
    issue: 불필요한 첫 각주 및 각주 위치
    rationale: ‘네 영광의 옷들’은 본문과 사실상 같은 표현이므로 어휘 대안 각주가 필요하지 않습니다. 의미상 쟁점인 ἁγίασμα 및 εἰς τὸν αἰῶνα καὶ ἔτι에만 본문 직후 각주를 붙이는 것이 명료합니다.
