revisions:
- from: 예루살렘아, 네 영광의 옷들을 입고 네 성스러운 겉옷을 갖추어라. 이는 하나님께서 이스라엘에게 영원무궁토록 좋은 일들을 말씀하셨기 때문입니다.[a][b][c]
  to: 예루살렘아, 네 영광의 옷들을 입으십시오. 네 성스러운 예복을 갖추십시오.[a] 하나님께서 이스라엘에게 좋은 것들을 영원토록 말씀하셨기 때문입니다.[b]
  rationale: 합쇼체로 명령형을 통일하고, στολή의 격식 있는 성격을 ‘예복’으로 옮겼습니다. ἀγαθά는 ‘좋은 것들’로 번역하여 하나님이 좋은 일을 약속하셨다는 해석을 본문에 덧붙이지 않았습니다. 종결 표현의 관용적 영속성은 ‘영원토록’으로 번역하되, καὶ ἔτι의 추가 뉘앙스는 각주에서 보존했습니다.
