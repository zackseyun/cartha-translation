  source_fidelity: 그리스어의 두 명령형(ἔνδυσαι, ἑτοίμασον), 예루살렘을 향한 호격, 그리고 하나님이 이스라엘에게 좋은 것을 말씀하셨다는 근거절은 대체로 반영되었습니다. 그러나 본문이 현대 합쇼체를 표방하면서 명령형이 해라체(‘입고’, ‘갖추어라’)로 되어 있어 문체상 일관되지 않습니다. 또한 εἰς τὸν αἰῶνα καὶ ἔτι의 추가 강조는 본문에서는 ‘영원토록’으로 자연스럽게 처리하고 각주에서 밝혀야 합니다.
  naturalness: ‘네 영광의 옷들’과 ‘성스러운 겉옷’은 시적 문맥에서 이해 가능하지만, ‘겉옷’은 στολή의 격식 있고 의례적인 옷차림을 다소 협소하게 만들 수 있습니다. ‘성스러운 예복’ 및 ‘갖추십시오’가 현대 문어체와 합쇼체에 더 자연스럽습니다.
  terminology: ‘영광’, ‘성스러운’, ‘하나님’, ‘이스라엘’은 적절합니다. ἁγίασμα는 거룩함·성별됨·성소를 가리킬 수 있으므로 주석에서 대안을 보존합니다. ‘좋은 것들’은 ἀγαθά의 중성 복수와 ‘말씀하셨다’의 직접성을 유지합니다.
  issues:
