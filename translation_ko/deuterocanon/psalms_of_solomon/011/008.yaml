base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/011/008.yaml
  text: Put on[a], Jerusalem, the garments of your glory; make ready your sacred robe[c][b], for God has spoken good things to Israel forever and ever.
  footnotes:
  - marker: a
    text: Or 'the robe of your holiness' or 'the robe of your sanctuary.'
    reason: lexical_alternative
  - marker: b
    text: 'Greek: ''has spoken good things to Israel forever and still further.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'forever and beyond'.
    reason: previous_rendering
translation:
  language: ko
  text: 예루살렘아, 네 영광의 옷들을 입고 네 성스러운 겉옷을 갖추어라. 이는 하나님께서 이스라엘에게 영원무궁토록 좋은 일들을 말씀하셨기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘네 영광의 옷들’은 문자적으로는 ‘네 영광의 의복들’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘성스러운 겉옷’은 ‘네 거룩함의 옷’ 또는 ‘네 성소의 옷’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 구절은 직역하면 ‘영원과 더’의 뜻으로, 영속성에 추가 강조가 있는 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: ἔνδυσαι
  english_pob_choice: Put on
  chosen_korean: 입고
  alternatives_korean:
  - 둘러입고
  - 옷 입어라
  lexicon: BDAG
  rationale: 예루살렘을 향한 직접 명령으로서 ‘put on’의 동작성을 살리면서도 현대 한국어에서 자연스럽게 들리도록 옮겼습니다.
- source_word: τὰ ἱμάτια τῆς δόξης σου
  english_pob_choice: the garments of your glory
  chosen_korean: 네 영광의 옷들
  alternatives_korean:
  - 네 영광의 의복
  - 네 영광의 옷
  lexicon: BDAG
  rationale: ἱμάτια의 복수성과 δόξα의 강한 찬란함을 함께 살리기 위해 ‘옷들’과 ‘영광’을 유지했습니다.
- source_word: ἑτοίμασον τὴν στολὴν τοῦ ἁγιάσματός σου
  english_pob_choice: make ready your sacred robe
  chosen_korean: 네 성스러운 겉옷을 갖추어라
  alternatives_korean:
  - 네 거룩한 옷차림을 마련하라
  - 네 성소의 옷을 준비하라
  lexicon: BDAG
  rationale: στολή는 단순한 옷보다 격식 있는 겉옷에 가깝고, τοῦ ἁγιάσματός σου는 거룩하게 구별된 상태를 가리킬 수 있어 ‘성스러운 겉옷’으로 옮겼습니다.
- source_word: ἐλάλησεν ἀγαθὰ
  english_pob_choice: has spoken good things
  chosen_korean: 좋은 일들을 말씀하셨기
  alternatives_korean:
  - 복된 일들을 말씀하셨기
  - 선한 것들을 말씀하셨기
  lexicon: BDAG
  rationale: ‘spoke good things’를 너무 해석적으로 풀지 않고, 약속의 뉘앙스를 지나치게 덧씌우지 않도록 ‘좋은 일들’을 유지했습니다.
theological_decisions:
- issue: εἰς τὸν αἰῶνα καὶ ἔτι의 종결 뉘앙스
  chosen_reading: ‘영원무궁토록’으로 한 번에 압축해, 지속성과 ‘더 있음’의 강조를 함께 살렸습니다.
  alternative_readings:
  - 영원히 그리고 더
  - 영원토록 또 그 이상
  rationale: 이 표현은 단순한 영속성보다 더 강한 종결 불가능성을 내포하므로, 한국어 관용구 중 가장 압축적이고 예배문맥에 어울리는 표현을 선택했습니다.
  doctrine_reference: 시적 축복/약속의 영속성
