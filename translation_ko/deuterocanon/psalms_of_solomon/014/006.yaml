review_pass:
  verdict: revise
  source_fidelity: 본문은 전반적으로 그리스어의 대조와 미래 표현을 잘 옮겼습니다. 그러나 κληρονομία와 κληρονομήσουσιν의 의도적인 어근 반복을 첫 절의 ‘몫’이 약화하므로 ‘유업’으로 통일하는 것이 더 충실합니다. ὅσιοι는 ἅγιοι와 구별되는 경건·신심의 성격을 지니므로 ‘경건한 이들’이 안전합니다.
  naturalness: ‘그러므로’, ‘발견되지 않을 것입니다’, ‘기쁨 가운데’는 현대 표준어 합쇼체에서 자연스럽습니다. ‘유업’은 다소 문어적이지만, 본문의 상속 은유와 반복을 보존하는 데 적절합니다.
  terminology: ᾅδης는 ‘하데스’로 음역하고 문화 주석을 붙이는 것이 적절합니다. 현 초안은 각주 표지가 가리키는 본문 위치와 각주 내용이 서로 맞지 않으며, c 각주는 본문과 같은 표현을 ‘또는’으로 반복합니다. 이를 바로잡아야 합니다.
  issues:
  - severity: medium
    issue: 각주 표지와 각주 내용이 불일치합니다.
    rationale: a는 ‘몫’ 뒤에 있으나 ‘의인들의 긍휼의 날’의 대안 해석을 설명하고, b는 ‘의인들의 긍휼의 날’ 뒤에 있으나 하데스 문화 주석이며, c는 ‘거룩한 이들’ 뒤에 있으나 본문과 동일한 말을 대안으로 제시합니다. 각주를 해당 어구에 다시 연결해야 합니다.
  - severity: low
    issue: κληρονομία의 반복이 ‘몫’으로 약화됩니다.
    rationale: 첫 절의 κληρονομία와 둘째 절의 κληρονομήσουσιν은 유업/상속 어휘를 통해 대조를 이룹니다. ‘유업’으로 통일하면 원문의 연결을 보존합니다.
  - severity: low
    issue: ὅσιοι를 ‘거룩한 이들’로 옮기면 ἅγιοι와의 어휘상 구별이 흐려질 수 있습니다.
    rationale: 이 단어는 특히 경건하고 신심 깊은 사람들을 가리킬 수 있으므로 ‘경건한 이들’이 더 구체적이고 자연스러운 대응입니다.
