base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/014/006.yaml
  text: Therefore Hades and darkness and destruction are their inheritance[a], and they will not be found in the day of mercy for the righteous[d][c][b]. But the holy ones of the Lord will inherit life in gladness.
  footnotes:
  - marker: a
    text: Or, 'in the day of the righteous ones’ mercy.' The Greek construction can be read more than one way.
    reason: alternative_reading
  - marker: b
    text: '''Hades'' refers to the realm of the dead; it is not necessarily identical to the later, fuller sense often conveyed by ''hell.'''
    reason: cultural_note
  - marker: c
    text: Or, 'the godly ones of the Lord.'
    reason: lexical_alternative
  - marker: d
    text: Or 'the holy ones'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 그들의 몫은 하데스와 어둠과 멸망입니다[a]. 그들은 의인들의 긍휼의 날에 발견되지 않을 것입니다[b]. 그러나 주의 거룩한 이들은 기쁨 가운데 생명을 유업으로 받을 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘의인들의 긍휼의 날에.’ 이 그리스어 구문은 둘 이상으로 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘하데스’는 죽은 자들의 영역을 가리키며, 후대의 더 넓은 의미로 쓰이는 ‘지옥’과 반드시 같지는 않습니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘주의 거룩한 이들’
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 따라서
  - 이 때문에
  lexicon: BDAG
  rationale: 앞선 진술로부터의 결론을 자연스러운 한국어 인과 접속으로 살리기 위해 ‘그러므로’를 택했습니다.
- source_word: κληρονομία
  english_pob_choice: inheritance
  chosen_korean: 몫
  alternatives_korean:
  - 유업
  - 상속
  lexicon: BDAG
  rationale: 이 구절에서는 악인의 ‘유업’과 의인의 ‘유업’이 대조되므로, 더 직설적인 ‘몫’으로 첫 절을 옮겨 심판적 배분의 뉘앙스를 살렸습니다.
- source_word: ᾅδης
  english_pob_choice: Hades
  chosen_korean: 하데스
  alternatives_korean:
  - 음부
  - 죽은 자들의 세계
  lexicon: BDAG
  rationale: POB의 영어 선택을 따라 음부나 지옥으로 풀지 않고 음역하여, 후대적 ‘지옥’ 의미를 덧씌우지 않도록 했습니다.
- source_word: ὅσιοι
  english_pob_choice: the holy ones
  chosen_korean: 거룩한 이들
  alternatives_korean:
  - 경건한 이들
  - 신실한 이들
  lexicon: BDAG
  rationale: English audit trail의 최신 수정처럼 ‘holy ones’를 반영하되, 한국어에서는 집단 명사형 ‘거룩한 이들’이 가장 자연스럽고 원어의 구별성을 유지합니다.
theological_decisions:
- issue: ἐν ἡμέρᾳ ἐλέους δικαίων의 소유격 해석
  chosen_reading: ‘의인들의 긍휼의 날’로 옮겨, 의인과 관련된 긍휼의 날이라는 중의성을 열어 두었습니다.
  alternative_readings:
  - 의인들을 위한 긍휼의 날
  - 의인들의 긍휼이 있는 날
  rationale: 영어 POB도 이 구문의 다중 해석 가능성을 주석으로 남기고 있으므로, 한국어 본문은 한쪽으로 과도하게 결정하지 않고 문법적 긴장을 보존했습니다.
  doctrine_reference: preserve ambiguity
