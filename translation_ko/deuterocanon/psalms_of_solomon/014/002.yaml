base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/014/002.yaml
  text: The holy ones of the Lord will live in him forever[a]; the paradise of the Lord, the trees of life[c][b], are his holy ones.
  footnotes:
  - marker: a
    text: Or 'saints' or 'devout ones' for 'holy ones.'
    reason: lexical_alternative
  - marker: b
    text: Greek 'the trees of life' is plural.
    reason: lexical_alternative
  - marker: c
    text: Or 'will live in him'.
    reason: previous_rendering
translation:
  language: ko
  text: 주님의 거룩한 이들은 그 안에서[a] 영원히 살 것입니다. 주님의 낙원, 곧 생명의 나무들은 그의 거룩한 이들입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 안에서’는 원문의 ἐν αὐτῷ를 옮긴 것입니다. 문맥상 앞절의 ‘그의 율법’을 가리킬 가능성도 있습니다.
    reason: contextual_ambiguity
  - marker: b
    text: 헬라어의 ‘생명의 나무들’은 복수입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσιοι
  english_pob_choice: holy ones
  chosen_korean: 거룩한 사람들
  alternatives_korean:
  - 성도들
  - 경건한 사람들
  lexicon: LSJ
  rationale: ὅσιος는 경건함과 거룩함을 띠는 사람들을 가리키므로, 교회 제도 용어를 덧씌우지 않으면서 의미를 살려 ‘거룩한 사람들’로 옮겼습니다.
- source_word: ἐν αὐτῷ
  english_pob_choice: in him
  chosen_korean: 그 안에서
  alternatives_korean:
  - 그와 함께
  - 그 안에
  lexicon: LSJ
  rationale: 본문의 전치사 ἐν을 공간적·관계적으로 보존해 ‘그 안에서’로 옮겼습니다. 영어 주석의 선택을 따라, 단순한 동반보다 내적 참여의 뉘앙스를 남깁니다.
- source_word: εἰς τὸν αἰῶνα
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 세세토록
  - 한 시대 동안
  lexicon: LSJ
  rationale: 관용적으로 가장 자연스러운 한국어 부사형인 ‘영원히’가 문장 흐름을 살리면서도 지속성을 분명히 드러냅니다.
- source_word: τὰ ξύλα τῆς ζωῆς
  english_pob_choice: the trees of life
  chosen_korean: 생명의 나무들
  alternatives_korean:
  - 생명의 나무
  - 생명의 목재들
  lexicon: LSJ
  rationale: ξύλα가 분명히 복수이므로 단수를 피하고 ‘나무들’로 반영했습니다. 영어 POB의 복수 주석도 그대로 반영했습니다.
theological_decisions:
- issue: 둘째 절의 병렬 구조와 등치 관계
  chosen_reading: 둘째 절은 소유나 장소 설명으로 풀지 않고, ‘주님의 낙원, 곧 생명의 나무들은 그의 거룩한 사람들입니다’라는 등치적 표현으로 보존했습니다.
  alternative_readings:
  - 주님의 낙원은 그의 거룩한 사람들에게 속합니다
  - 주님의 낙원 안에 있는 생명의 나무들은 그의 거룩한 사람들입니다
  rationale: 헬라어는 명시적 동사 없이 명사구들이 병렬되는 구조이므로, 해석을 과도하게 정리하기보다 시적 동일시를 드러내는 쪽이 본문의 긴장을 더 잘 보존합니다.
  doctrine_reference: 본문의 시적 은유와 등치 구조를 보존
- issue: ἐν αὐτῷ의 지시 대상
  chosen_reading: 문맥상 지시 대상이 앞절의 ‘그의 율법’이더라도, 이 절의 독립된 문장으로서는 원문 형식을 따라 ‘그 안에서’로 유지했습니다.
  alternative_readings:
  - 그 율법 안에서
  - 그에게서
  rationale: 인접 문맥은 중요하지만, 제시된 절 단독의 번역은 현재 절의 그리스어 형태를 우선해야 합니다. 따라서 문맥 해설을 번역문에 과잉 주입하지 않았습니다.
  doctrine_reference: 문맥 연계를 주석으로 남기되 본문은 절 형태를 우선
