  to: 그러나 죄인들과 불법을 행하는 자들은 그렇지 않습니다. 그들은 자기들의 죄에 참여하는 하루를 사랑하였으며, 그들의 욕망은 부패의 덧없음[a]에 있었습니다.
  rationale: 참여를 뜻하는 μετοχή를 자연스럽고 직접적으로 ‘죄에 참여하는’으로 고쳤습니다. παράνομοι는 ‘불법을 행하는 자들’로 옮겨 법·도덕적 위반의 뜻을 보존했습니다. ‘부패의 덧없음’은 문맥상 가능한 해석으로 유지하되, 논쟁 가능한 μικρότης의 문자적 가능성은 각주에서 보존하고 표지를 해당 어구에 배치했습니다.
