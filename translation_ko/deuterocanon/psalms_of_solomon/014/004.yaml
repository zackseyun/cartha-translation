  verdict: revise
  source_fidelity: 대조를 나타내는 ‘그러나 … 그렇지 않습니다’와 ἁμαρτωλοί/παράνομοι의 두 범주는 대체로 충실합니다. 다만 ‘자기 죄에 함께하는 하루’는 μετοχή(참여·동참)를 한국어로 부자연스럽고 다소 불명확하게 표현합니다. ‘자기들의 죄에 참여하는 하루’가 원문의 압축되고 다소 낯선 표현을 불필요하게 해설하지 않으면서 더 직접적으로 반영합니다. ἐν μικρότητι σαπρίας는 문맥상 ‘부패의 덧없음’으로 옮길 수 있으나, 작은/짧은 것이라는 어휘적 폭이 있으므로 각주는 그 대안을 정확히 제시해야 합니다.
  naturalness: ‘불법자들’과 특히 ‘자기 죄에 함께하는 하루’는 현대 표준 한국어에서 어색합니다. ‘불법을 행하는 자들’ 및 ‘자기들의 죄에 참여하는 하루’가 합쇼체 문장 안에서 자연스럽습니다. 각주 표지는 대안이 적용되는 ‘덧없음’ 바로 뒤에 두는 편이 명확합니다.
