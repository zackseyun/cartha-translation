id: PSS.14.4
reference: Psalms of Solomon 14:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: lxx-swete-1909
  text: καὶ οὐχ οὕτως οἱ ἁμαρτωλοὶ καὶ παράνομοι, οἱ ἠγάπησαν ἡμέραν ἐν μετοχῇ ἁμαρτίας αὐτῶν· ἐν μικρότητι σαπρίας ἡ ἐπιθυμία αὐτῶν,
  language: Greek
  pages:
  - 803
  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/014/004.yaml
  text: But not so the sinners and the lawless[a], who loved a day of sharing in their sin; their desire lay in the brevity of corruption,
  footnotes:
  - marker: a
    text: Or 'petty corruption'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 죄인들과 불법을 행하는 자들은 그렇지 않습니다. 그들은 자기들의 죄에 참여하는 하루를 사랑하였으며, 그들의 욕망은 부패의 덧없음[a]에 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘부패의 작음’.
    reason: μικρότης는 문맥상 ‘덧없음’ 또는 ‘짧음’으로 이해될 수 있으나, ‘작음’이라는 어휘적 가능성도 남아 있습니다.
lexical_decisions:
- source_word: καὶ οὐχ οὕτως
  english_pob_choice: But not so
  chosen_korean: 그러나 … 그렇지 않습니다
  alternatives_korean:
  - 그렇지 않습니다
  - 하지만 그렇지 않습니다
  lexicon: LSJ
  rationale: 앞선 의인들의 상태와의 강한 대조를 한국어에서도 자연스럽게 살리기 위해 역접을 두었고, 문맥상 단정적 대조를 나타내는 표현으로 옮겼습니다.
- source_word: οἱ ἁμαρτωλοὶ καὶ παράνομοι
  english_pob_choice: the sinners and the lawless
  chosen_korean: 죄인들과 불법자들
  alternatives_korean:
  - 악인들과 불법자들
  - 죄인들과 율법 없는 자들
  lexicon: BDAG
  rationale: 두 명칭을 분리해 유지했습니다. ἁμαρτωλοί는 ‘죄인들’, παράνομοι는 법과 질서를 무시하는 자들을 가리키므로 ‘불법자들’이 가장 직접적입니다.
- source_word: ἡμέραν ἐν μετοχῇ ἁμαρτίας αὐτῶν
  english_pob_choice: a day of sharing in their sin
  chosen_korean: 자기 죄에 함께하는 하루
  alternatives_korean:
  - 자기 죄에 참여하는 하루
  - 자기 죄를 나누는 하루
  lexicon: BDAG
  rationale: μετοχή의 ‘참여/공유’ 의미를 살려 ‘함께하는’으로 옮겼고, singular ‘ἡμέραν’을 그대로 반영해 ‘하루’로 유지했습니다.
- source_word: ἐν μικρότητι σαπρίας
  english_pob_choice: in the brevity of corruption
  chosen_korean: 부패의 덧없음에
  alternatives_korean:
  - 부패의 짧음에
  - 썩어짐의 짧은 기간에
  lexicon: LSJ
  rationale: μικρότης는 단순한 ‘작음’보다 시간적 짧음/덧없음을 가리킬 수 있으므로, 문맥의 대조를 살려 ‘덧없음’으로 옮겼습니다. σαπρία는 부패·썩어짐의 의미를 유지합니다.
- source_word: ἡ ἐπιθυμία αὐτῶν
  english_pob_choice: their desire
  chosen_korean: 그들의 욕망
  alternatives_korean:
  - 그들의 갈망
  - 그들의 정욕
  lexicon: BDAG
  rationale: ἐπιθυμία는 여기서 일반적 욕구를 넘어 잘못된 열망을 포함하는 말이므로, 문맥상 도덕적 뉘앙스를 살려 ‘욕망’으로 옮겼습니다.
theological_decisions:
- issue: 죄인들의 삶의 방향을 시간성으로 표현하는지, 도덕성으로만 평탄화하는지
  chosen_reading: 본문은 그들의 죄가 ‘하루’와 ‘부패의 덧없음’에 묶여 있음을 말해, 죄의 쾌락이 본질적으로 짧고 썩어 가는 것임을 드러냅니다.
  alternative_readings:
  - 단순히 죄의 정도가 ‘작다’는 뜻으로 읽기
  - 추상적으로 ‘부패’만 강조해 시간적 대비를 약화시키기
  rationale: 앞문맥의 영원성 대비를 고려하면 μικρότης는 도덕적 소규모가 아니라 잠깐 스쳐 가는 덧없음을 가리키는 쪽이 더 강합니다.
  doctrine_reference: 시편 솔로몬의 의인/악인 대비와 종말론적 시간성
- issue: ‘자기 죄에 함께하는’의 참여성을 유지할지, 단순 소속으로 완화할지
  chosen_reading: 참여성은 유지하되 ‘함께하는’이라는 자연스러운 한국어로 표현했습니다.
  alternative_readings:
  - ‘자기 죄를 가진’으로 완화하기
  - ‘죄 가운데 있는’으로 일반화하기
  rationale: μετοχή는 단순 소속보다 참여와 동참의 의미가 강하므로, 죄를 적극적으로 나누는 태도를 드러내는 번역이 필요합니다.
  doctrine_reference: 죄에 대한 능동적 동참과 책임
