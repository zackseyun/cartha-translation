  source_fidelity: 핵심 의미는 잘 보존합니다. 그러나 γνωσταὶ ἐνώπιον αὐτοῦ의 지속적인 상태는 ‘그분 앞에 늘 알려져 있다’보다 ‘그분 앞에 언제나 드러나 있다’가 한국어에서 더 자연스럽고, 원문의 공개성도 잘 나타냅니다. 마지막 절은 마음의 비밀을 받는 대명사 ‘그것’이 어색하므로 선행사를 직접 밝혀야 합니다.
  naturalness: 현 번역의 ‘마음의 비밀도 그것이 생기기 전에 아십니다’는 ‘그것’의 지시 대상과 수가 불분명하여 부자연스럽습니다. ‘마음의 비밀이 생기기 전에도 아십니다’로 고치면 현대 표준 한국어 합쇼체에서 자연스럽습니다. 각주 표지도 해당 어구 바로 뒤에 배치했습니다.
  terminology: ‘하나님’, ‘사람들의 길’, ‘마음의 비밀’은 적절합니다. ταμεῖα καρδίας는 문맥상 ‘마음의 비밀’로 번역하는 것이 안전하며, 직역적 대안은 각주에 보존할 수 있습니다.
