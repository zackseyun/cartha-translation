id: PSS.14.5
reference: Psalms of Solomon 14:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: lxx-swete-1909
  text: καὶ οὐκ ἐμνήσθησαν τοῦ θεοῦ, ὅτι ὁδοὶ ἀνθρώπων γνωσταὶ ἐνώπιον αὐτοῦ διὰ παντός, καὶ ταμεῖα καρδίας ἐπίσταται πρὸ τοῦ γενέσθαι.
  language: Greek
  pages:
  - 804
  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/014/005.yaml
  text: And they did not remember God[a], that the ways of men are known before him continually[c][b], and he knows the secrets of the heart before they come to be.
  footnotes:
  - marker: a
    text: Or 'the inner rooms of the heart'; more interpretively, 'the secrets of the heart.'
    reason: lexical_alternative
  - marker: b
    text: 'Or ''before they happen'' or ''before they arise.'' The Greek is broad: ''before they come to be.'''
    reason: alternative_reading
  - marker: c
    text: Or 'the hidden chambers of the heart before they come to be'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 하나님을 기억하지 않았습니다. 사람들의 길은 언제나 그분 앞에 드러나 있고, 그분께서는 마음의 비밀[a]이 생기기 전에도 아십니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마음의 숨은 방’. 더 해석하면 ‘마음의 비밀’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 일이 일어나기 전에’ 또는 ‘그것이 생기기 전에’. 그리스어는 폭넓게 ‘생기기 전에’를 뜻합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθησαν
  english_pob_choice: did not remember
  chosen_korean: 기억하지 않았습니다
  alternatives_korean:
  - 마음에 두지 않았습니다
  - 떠올리지 않았습니다
  lexicon: BDAG
  rationale: 하나님을 기억하지 않은 도덕적 책임을 자연스럽게 드러내면서도, 단순한 인지 실패보다 더 강한 관계적 외면을 보존합니다.
- source_word: ὁδοὶ
  english_pob_choice: ways
  chosen_korean: 길
  alternatives_korean:
  - 행실
  - 길들
  lexicon: BDAG
  rationale: 인간의 삶의 방식이라는 비유를 살리기 위해 ‘길’로 옮겼습니다. ‘행실’은 의미를 좁히고, 복수형을 드러내기 위해 ‘길들’은 한국어에서 부자연스럽습니다.
- source_word: ἐνώπιον αὐτοῦ
  english_pob_choice: before him
  chosen_korean: 그분 앞에
  alternatives_korean:
  - 그분의 시야에서
  - 그분의 면전에서
  lexicon: BDAG
  rationale: 하나님 앞에서 드러나 있는 상태를 간결하게 살리기 위해 ‘그분 앞에’를 택했습니다.
- source_word: ταμεῖα καρδίας
  english_pob_choice: the secrets of the heart
  chosen_korean: 마음의 비밀
  alternatives_korean:
  - 마음의 숨은 방
  - 마음의 내실
  lexicon: BDAG
  rationale: POB의 최종 판정처럼 ταμεῖα를 물리적 ‘방’보다 마음에 감춰진 내용으로 이해하는 것이 문맥과 더 잘 맞아, ‘마음의 비밀’로 옮겼습니다.
- source_word: πρὸ τοῦ γενέσθαι
  english_pob_choice: before they come to be
  chosen_korean: 그것이 생기기 전에
  alternatives_korean:
  - 그것이 일어나기 전에
  - 그것이 존재하기 전에
  lexicon: BDAG
  rationale: ‘come to be’의 생성/발생 범위를 한국어에서 자연스럽게 살리면서도, 생각·의도·비밀이 드러나기 전이라는 폭넓은 뜻을 유지했습니다.
theological_decisions:
- issue: 하나님의 전지와 마음의 비밀에 대한 진술
  chosen_reading: 이 구절은 하나님이 인간의 길과 마음의 숨은 내용까지, 그것이 드러나기 전에 이미 아신다고 말합니다.
  alternative_readings:
  - 하나님이 아직 행동으로 나타나지 않은 생각만 아신다는 뜻으로 좁혀 읽을 수 있습니다
  - 하나님이 단지 외적 행위만 미리 아신다는 뜻으로 읽을 수 있습니다
  rationale: 그리스어는 마음의 비밀과 그것이 ‘생기기 전’에 대한 포괄적 지식을 말하므로, 특정 교리 체계로 좁히지 않고 원문의 폭을 유지했습니다.
  doctrine_reference: 시 139편의 하나님의 전지, 잠 15:3의 하나님 앞에서의 인간 삶
