  source_fidelity: 원문의 φυτεία는 식재/심어진 것을 가리키는 식물 은유이며, ‘그들의 심는 것’은 현대 한국어에서 부자연스럽습니다. ἐκλήξουσιν은 ‘무너지다’보다는 ‘그치다, 끝나다, 없어지다’의 의미에 가깝기에 ‘무너지지 않을 것입니다’는 지나치게 구체적인 붕괴 이미지를 더합니다. 또한 τοῦ θεοῦ는 단순 소유 관계이므로 ‘하나님께서 차지하신’은 원문에 없는 행위를 보탭니다.
  naturalness: ‘그들이 심은 것’과 ‘영원히 뿌리내려 있습니다’는 식물 비유와 완료형이 나타내는 지속 상태를 자연스럽게 전달합니다. ‘없어지지 않을 것입니다’는 사람들을 가리키는 복수 주어와도 자연스럽게 결합하면서 원문의 존속 의미를 유지합니다.
  terminology: μερὶς καὶ κληρονομία는 ‘몫이요 유업’으로 유지할 수 있습니다. ‘하나님의 몫이요 유업’은 소유격을 직접 보존하며, 신학적 의미를 덧붙이지 않습니다. 각주 표지는 해당 어구에 맞게 재배치합니다.
