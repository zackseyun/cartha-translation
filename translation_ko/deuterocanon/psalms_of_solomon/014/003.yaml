  alternative_readings:
  - 이스라엘은 하나님의 몫이요 유업입니다
  - 이스라엘은 하나님께 속한 몫과 유업입니다
  rationale: 원문의 술어구조는 이스라엘을 ‘하나님의 몫’이자 ‘유업’으로 진술하므로, 소유 관계를 드러내되 문장을 과도하게 해설하지 않는 방향을 택했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.
