base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/014/003.yaml
  text: Their planting is rooted forever[a]; they will not fail all the days of heaven[d][c][b], because Israel is the portion and inheritance of God.
  footnotes:
  - marker: a
    text: Or “they will not be cut off” / “they will not come to an end.” The verb is rare, and the sense is enduring stability.
    reason: lexical_alternative
  - marker: b
    text: “All the days of heaven” is a literal expression for the full duration of the present heavenly order.
    reason: cultural_note
  - marker: c
    text: Or “Israel is God's portion and inheritance.”
    reason: alternative_reading
  - marker: d
    text: Or 'they will not fail'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들이 심은 것은 영원히 뿌리내려 있습니다. 그들은 하늘의 모든 날 동안[b] 없어지지 않을 것입니다[a][d]. 이는 이스라엘이 하나님의 몫이요 유업이기 때문입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들은 끊어지지 않을 것입니다” / “그들은 끝나지 않을 것입니다.” 이 동사는 드물게 쓰이며, 지속적인 안정과 존속의 뜻을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: “하늘의 모든 날”은 현재 하늘 질서가 지속되는 온전한 기간을 가리키는 문자적 표현입니다.
    reason: cultural_note
  - marker: c
    text: 또는 “이스라엘은 하나님의 몫이요 유업입니다.”
    reason: alternative_reading
  - marker: d
    text: 또는 “그들은 실패하지 않을 것입니다.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἡ φυτεία
  english_pob_choice: Their planting
  chosen_korean: 그들의 심는 것
  alternatives_korean:
  - 그들의 심기
  - 그들의 식재
  - 그들이 심어진 것
  lexicon: LSJ
  rationale: φυτεία는 ‘심어진 것/심는 일’의 뜻을 가지므로, 식물 은유를 살리면서도 대상이 사람인지 토지인지 과도하게 특정하지 않는 표현을 택했습니다.
- source_word: ἐρριζωμένη
  english_pob_choice: rooted
  chosen_korean: 뿌리를 내렸습니다
  alternatives_korean:
  - 뿌리내린
  - 굳게 뿌리내렸습니다
  - 뿌리박혔습니다
  lexicon: LSJ
  rationale: 완료 수동 분사는 지속된 상태를 나타내므로, 한국어에서는 결과 상태를 분명히 보이는 ‘뿌리를 내렸습니다’로 옮겨 지속성과 안정성을 살렸습니다.
- source_word: οὐκ ἐκλήξουσιν
  english_pob_choice: they will not fail
  chosen_korean: 무너지지 않을 것입니다
  alternatives_korean:
  - 실패하지 않을 것입니다
  - 끝나지 않을 것입니다
  - 끊어지지 않을 것입니다
  lexicon: LSJ
  rationale: 이 희귀 동사는 ‘그치다/중단되다/끝나다’의 의미 범위를 가지므로, 현대 한국어에서 ‘fail’보다 오해가 적고 지속적 존속을 드러내는 ‘무너지지 않다’를 택했습니다.
- source_word: πάσας τὰς ἡμέρας τοῦ οὐρανοῦ
  english_pob_choice: all the days of heaven
  chosen_korean: 하늘의 모든 날 동안
  alternatives_korean:
  - 하늘 아래의 모든 날 동안
  - 하늘의 날들 모두 동안
  - 하늘이 있는 모든 날 동안
  lexicon: LSJ
  rationale: 직역적 이미지를 유지하면서도 한국어 문장으로 자연스럽게 읽히도록 ‘하늘의 모든 날 동안’으로 옮겼습니다.
- source_word: μερὶς καὶ κληρονομία
  english_pob_choice: the portion and inheritance
  chosen_korean: 몫이요 유업
  alternatives_korean:
  - 분깃이요 유업
  - 몫과 유업
  - 분배받은 몫이요 유업
  lexicon: LSJ
  rationale: ‘몫’은 μερὶς의 기본 의미를, ‘유업’은 κληρονομία의 언약적 상속 의미를 잘 살리므로 병렬로 두어 관계를 분명히 했습니다.
theological_decisions:
