base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/014/001.yaml
  text: The Lord is faithful to those who love him in truth[a], to those who endure his discipline, to those who walk in the righteousness of his commandments[b], in the law that he commanded us for our life.
  footnotes:
  - marker: a
    text: Or 'instruction' for 'discipline.' The Greek παιδεία can include training, correction, and teaching.
    reason: lexical_alternative
  - marker: b
    text: Or 'justice' for 'righteousness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님은 진리 안에서 그분을 사랑하는 이들, 그분의 훈계를 견디는 이들, 그분의 명령들의 의로움 안에서 걷는 이들, 곧 우리에게 우리 생명을 위해 명하신 율법 안에서 신실하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''훈계''는 여기서 교정, 훈련, 가르침을 포함할 수 있습니다.'
    reason: lexical_alternative
  - marker: b
    text: '''의로움''은 문맥상 ''의'' 또는 ''정의''로도 옮길 수 있습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πιστὸς
  english_pob_choice: faithful
  chosen_korean: 신실하십니다
  alternatives_korean:
  - 충실하십니다
  - 믿을 만하십니다
  lexicon: BDAG
  rationale: 주어가 κύριος일 때 단순한 성격 묘사보다 언약적 신실성을 드러내므로, 한국어에서는 '신실하다'가 가장 자연스럽고 신학적으로도 밀도가 높습니다.
- source_word: ἐν ἀληθείᾳ
  english_pob_choice: in truth
  chosen_korean: 진리 안에서
  alternatives_korean:
  - 진리로
  - 참되게
  lexicon: BDAG
  rationale: 전치사구의 형식을 살려 '진리 안에서'로 옮겨, 단순한 부사화보다 관계적·윤리적 범위를 유지했습니다.
- source_word: παιδείαν
  english_pob_choice: discipline
  chosen_korean: 훈계
  alternatives_korean:
  - 징계
  - 교육
  - 훈련
  lexicon: BDAG
  rationale: 문맥상 하나님이 주시는 교정과 형성을 함께 포함하므로, 지나치게 처벌적으로 들리지 않으면서도 교정적 의미를 담는 '훈계'를 택했습니다.
- source_word: προσταγμάτων
  english_pob_choice: commandments
  chosen_korean: 명령들의
  alternatives_korean:
  - 계명들의
  - 명령의
  lexicon: BDAG
  rationale: 소유격 관계를 보존하면서, 법적·권위적 뉘앙스를 드러내기 위해 '명령들'을 사용했습니다. 문맥상 전통적 '계명'도 가능하지만, 원문의 명령성은 '명령'이 더 직접적입니다.
theological_decisions:
- issue: δικαιοσύνῃ의 처리
  chosen_reading: '''의로움''으로 옮기되, 행위의 상태가 아니라 하나님의 명령에 합당한 바른 행실을 가리키는 것으로 읽었습니다.'
  alternative_readings:
  - 의
  - 정의
  rationale: 이 구절은 개인의 내면적 의로움보다 하나님의 명령을 따라 걷는 삶의 방식에 초점이 있으므로, 한국어에서는 '의로움'이 문맥을 가장 잘 드러냅니다.
  doctrine_reference: 성도의 순종과 언약적 의
- issue: Κύριος의 호칭 처리
  chosen_reading: 주님으로 번역했습니다.
  alternative_readings:
  - 주
  - 주인
  rationale: 시편적 경배 문맥에서 한국어 독자는 '주님'을 통해 예배적 호칭과 인격적 관계를 자연스럽게 이해하므로, 본문의 경건한 어조를 유지합니다.
  doctrine_reference: 하나님의 주권과 언약적 신실성
