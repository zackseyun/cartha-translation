base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/006.yaml
  text: Sons and daughters were in evil captivity[a], their necks in a seal[b], with a mark among the nations.
  footnotes:
  - marker: a
    text: Literally, “their neck in a seal, in a mark among the nations.” The Greek imagery is compressed; it may evoke captives being publicly marked or treated as slaves.
    reason: lexical_alternative
  - marker: b
    text: “Branded” could also be rendered more generally as “marked” or “made conspicuous.”
    reason: lexical_alternative
translation:
  language: ko
  text: 아들들과 딸들은 악한 포로 상태에 있었고, 그들의 목은 인장 속에 있었으며, 민족들 가운데서 표식이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “그들의 목이 인장 안에, 민족들 가운데서 표식이 있었다”에 가깝습니다. 그리스어는 압축된 표현이어서, 포로들이 공적으로 표시되거나 노예처럼 취급되었음을 암시할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘표식’은 더 넓게는 ‘표시됨’ 또는 ‘눈에 띄게 됨’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱοὶ καὶ θυγατέρες
  english_pob_choice: Sons and daughters
  chosen_korean: 아들들과 딸들
  alternatives_korean:
  - 자녀들
  - 아들들과 딸들이
  lexicon: LSJ
  rationale: 남녀를 구분해 병렬로 제시하는 그리스어를 그대로 살려, ‘자녀들’처럼 일반화하지 않았습니다.
- source_word: ἐν αἰχμαλωσίᾳ πονηρᾷ
  english_pob_choice: in evil captivity
  chosen_korean: 악한 포로 상태에
  alternatives_korean:
  - 잔혹한 포로 상태에
  - 혹독한 포로 상태에
  - 비참한 포로 상태에
  lexicon: LSJ
  rationale: αἰχμαλωσία는 포로 됨/포로 상태이고, πονηρᾷ는 단순히 도덕적 ‘악’이라기보다 그 포로 상태의 비참하고 해로운 성격을 드러내므로 ‘악한’으로 옮겼습니다.
- source_word: ἐν σφραγῖδι
  english_pob_choice: in a seal
  chosen_korean: 인장 속에
  alternatives_korean:
  - 인장 아래에
  - 인장으로
  - 봉인 아래에
  lexicon: LSJ
  rationale: 직역에 가깝게 ‘인장’을 살리되, 한국어에서 자연스럽게 상태를 나타내는 ‘속에’를 보태 압축된 이미지를 유지했습니다.
- source_word: ἐν ἐπισήμῳ
  english_pob_choice: with a mark
  chosen_korean: 표식이었습니다
  alternatives_korean:
  - 드러난 표식이었습니다
  - 낙인이 찍혀 있었습니다
  - 표시가 있었습니다
  lexicon: LSJ
  rationale: ἐπίσημος/ἐπίσημον의 ‘표시된, 눈에 띄는, 표식이 된’ 의미를 따라, 과도하게 해석적인 ‘낙인’보다는 중립적인 ‘표식’으로 옮겼습니다.
- source_word: ἐν τοῖς ἔθνεσιν
  english_pob_choice: among the nations
  chosen_korean: 민족들 가운데서
  alternatives_korean:
  - 열방 가운데서
  - 나라들 가운데서
  - 이방 민족들 가운데서
  lexicon: LSJ
  rationale: ἔθνη는 문맥상 민족들/열방을 가리키므로, 한국어에서 폭넓고 자연스러운 ‘민족들’로 옮겼습니다.
theological_decisions:
- issue: ‘악한 포로 상태’의 의미
  chosen_reading: 여기서 ‘악한’은 포로 상태의 도덕적 악이라기보다, 수치와 고통을 동반한 비참한 억압 상태를 가리키는 것으로 읽었습니다.
  alternative_readings:
  - 도덕적으로 악한 포로 상태
  - 잔혹하고 비참한 포로 상태
  rationale: 문맥상 감정적·사회적 압제를 묘사하는 표현으로 보는 것이 자연스럽고, πονηρᾷ를 한국어로 과도하게 윤리화하지 않도록 했습니다.
  doctrine_reference: 시편적 애가/포로 묘사 문맥
- issue: 압축된 표상의 보존
  chosen_reading: ‘목은 인장 속에’와 ‘표식’은 원문의 압축된 이미지—공적 표시와 굴욕의 표상—를 그대로 드러내는 방향으로 유지했습니다.
  alternative_readings:
  - ‘목이 봉인되어’
  - ‘브랜드가 찍혀’
  rationale: 이 구절은 해석보다 이미지 자체가 중요하므로, 후대 독자가 원문 비유를 추적할 수 있도록 설명적 의역을 최소화했습니다.
  doctrine_reference: 문학적 표상 보존 원칙
