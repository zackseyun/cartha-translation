base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/015.yaml
  text: Because they themselves defiled what was pure in the filth of illicit mingling[c][b][a]. My belly and my inward parts ache over these things.
  footnotes:
  - marker: a
    text: Or 'holy things' for 'pure things.'
    reason: lexical_alternative
  - marker: b
    text: The Greek says 'mingling' literally; the phrase likely carries a morally charged or sexual sense here.
    reason: cultural_note
  - marker: c
    text: Or 'in a street'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들이 스스로 깨끗한 것을 더러운 혼합의 오물 속에서 더럽혔기 때문입니다. 내 배와 내 창자들이 이 일들로 아픕니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘깨끗한 것’은 문자적으로는 ‘순수한 것’이며, 경우에 따라 ‘거룩한 것’으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘혼합’은 문자적으로는 ‘섞임’이지만, 문맥상 도덕적으로 부정한 섞임을 가리키는 것으로 보입니다.
    reason: cultural_note
  - marker: c
    text: 본문 전승의 흔적에 따라 이 표현은 ‘거리’로도 오독될 수 있으나, 여기서는 ‘더러움/오물’로 읽었습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἀνθ' ὧν
  english_pob_choice: Because
  chosen_korean: ~기 때문입니다
  alternatives_korean:
  - 그러므로
  - 그 까닭에
  lexicon: BDAG
  rationale: 원인-결과 관계를 자연스러운 한국어 인과 표현으로 옮기되, 결론을 과도하게 논리화하지 않았습니다.
- source_word: αὐταὶ
  english_pob_choice: they themselves
  chosen_korean: 그들이 스스로
  alternatives_korean:
  - 그들이
  - 그 여자들이 스스로
  lexicon: BDAG
  rationale: 여성형 강조를 살리면서도 원문에 없는 명시적 명사를 덧붙이지 않기 위해 ‘스스로’를 살렸습니다.
- source_word: ἁγνὰ
  english_pob_choice: pure things
  chosen_korean: 깨끗한 것
  alternatives_korean:
  - 거룩한 것
  - 순결한 것
  lexicon: LSJ
  rationale: ἁγνὰ를 문자적으로는 ‘깨끗한/순수한 것’으로 이해하는 것이 가장 직접적이어서 이를 택했고, ‘거룩한 것’은 의미를 더 좁힐 수 있어 배제했습니다.
- source_word: ἐν ῥύμῳ ἀναμίξεως
  english_pob_choice: in the filth of illicit mingling
  chosen_korean: 더러운 혼합의 오물 속에서
  alternatives_korean:
  - 부정한 섞임의 더러움 속에서
  - 혼합의 오물 속에서
  lexicon: LSJ
  rationale: 주어진 수정 반영에 따라 ῥύμῳ를 ‘거리’가 아니라 ‘더러움/오물’ 계열로 이해했고, ἀναμίξεως는 단순한 섞임보다 도덕적으로 오염된 혼합의 뉘앙스를 살렸습니다.
- source_word: τὴν κοιλίαν μου καὶ τὰ σπλάγχνα μου
  english_pob_choice: My belly and my inward parts
  chosen_korean: 내 배와 내 창자들
  alternatives_korean:
  - 내 배와 내 내장
  - 내 배와 내 속
  - 내 배와 내 깊은 속
  lexicon: BDAG
  rationale: 몸의 통증을 가리키는 구체적 신체어를 보존해 애통의 육체성을 드러냈습니다.
theological_decisions:
- issue: 감정 표현의 신체성
  chosen_reading: ‘내 배와 내 창자들이 … 아픕니다’로 옮겨, 단순한 비유가 아니라 실제 육체적 고통처럼 울리는 탄식을 살렸습니다.
  alternative_readings:
  - ‘내 속이 아픕니다’
  - ‘내 마음이 아픕니다’
  rationale: 본문은 정서와 몸을 분리하지 않고, 애통을 내장 언어로 표현합니다. 이를 심리어로 완화하면 원문의 강도가 약해집니다.
  doctrine_reference: 성서의 인간 이해와 탄식의 언어
