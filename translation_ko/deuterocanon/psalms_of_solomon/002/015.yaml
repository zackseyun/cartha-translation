  - marker: b
    text: The Greek says 'mingling' literally; the phrase likely carries a morally charged or sexual sense here.
    reason: cultural_note
  - marker: c
    text: Or 'in a street'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들이 스스로 순결한 것들을 섞임의 더러움 속에서[a][b][c] 더럽혔기 때문입니다. 이 일들로 내 배와 내 창자가 아픕니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘순결한 것들’은 문맥에 따라 ‘거룩한 것들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘섞임’은 그리스어의 문자적 뜻입니다. 여기서는 문맥상 도덕적으로, 어쩌면 성적으로 부정한 섞임을 암시할 수 있습니다.
    reason: cultural_note
  - marker: c
    text: 제시된 본문의 ‘거리’로 읽힐 수 있는 형태와 달리, 문맥 및 형태상 여기서는 ‘더러움/오물’을 뜻하는 읽기가 유력합니다.
    reason: textual_variant
