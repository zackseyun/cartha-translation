base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/008.yaml
  text: For he turned his face away from mercy toward them—young and old and their children[b][a], all at once.
  footnotes:
  - marker: a
    text: Or 'turned his face away from pitying them.'
    reason: lexical_alternative
  - marker: b
    text: '''Young and old'' renders singular Greek forms used collectively.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 젊은이와 늙은이와 그들의 자녀에게서까지 자비를 거두어 그의 얼굴을 돌리셨습니다. — 모두 한꺼번에.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자비를 거두어’는 ἀπὸ ἐλέους αὐτῶν의 압축된 구조를 따라, 그들에게 자비를 베풀지 않는다는 뜻을 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘젊은이와 늙은이’는 헬라어의 단수형을 집합적으로 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστρεψεν
  english_pob_choice: turned ... away
  chosen_korean: 돌리셨습니다
  alternatives_korean:
  - 외면하셨습니다
  - 돌아서셨습니다
  lexicon: BDAG
  rationale: 동사 ἀποστρέφω의 핵심인 ‘돌이켜 멀어지다/외면하다’의 이미지를 살리되, 한국어 문장에서는 ‘얼굴을 돌리다’가 자연스럽고 성경적 비유를 보존합니다.
- source_word: τὸ πρόσωπον αὐτοῦ
  english_pob_choice: his face
  chosen_korean: 그의 얼굴
  alternatives_korean:
  - 그의 낯
  - 그의 존재
  lexicon: BDAG
  rationale: 직역적인 신체 이미지를 유지하는 것이 원문의 관계적·인격적 뉘앙스를 가장 잘 드러내므로 ‘얼굴’을 택했습니다.
- source_word: ἀπὸ ἐλέους αὐτῶν
  english_pob_choice: from mercy toward them / from showing them mercy
  chosen_korean: 자비를 거두어
  alternatives_korean:
  - 그들에게 자비를 베풀지 않고
  - 그들에 대한 자비에서
  lexicon: BDAG
  rationale: 문맥상 단순한 정서가 아니라 자비의 행위를 거두는 뜻이므로, 영어 POB의 긴장을 반영해 ‘자비를 거두어’로 압축했습니다.
- source_word: νέον καὶ πρεσβύτην καὶ τέκνα αὐτῶν
  english_pob_choice: young and old and their children
  chosen_korean: 젊은이와 늙은이와 그들의 자녀
  alternatives_korean:
  - 젊은 남자와 늙은 남자와 그들의 자녀
  - 젊은이와 노인과 그들의 자녀
  lexicon: BDAG
  rationale: 두 형용사의 단수형이 집합적으로 쓰인 점을 한국어에서도 자연스럽게 살려 ‘젊은이와 늙은이’로 옮겼습니다.
- source_word: εἰς ἅπαξ
  english_pob_choice: all at once
  chosen_korean: 모두 한꺼번에
  alternatives_korean:
  - 일시에
  - 한순간에
  lexicon: BDAG
  rationale: 총체성과 동시성을 함께 전달하는 현대 한국어 표현으로 ‘모두 한꺼번에’를 선택했습니다.
theological_decisions:
- issue: 하나님이 ‘얼굴을 돌리신다’는 의인화 표현
  chosen_reading: 추상화하지 않고 ‘그의 얼굴을 돌리셨습니다’라는 구체적 이미지를 보존했습니다.
  alternative_readings:
  - 자비를 거두셨습니다
  - 긍휼을 거두셨습니다
  rationale: 원문은 관계적·신체적 비유를 사용하므로, 이를 풀어 설명하기보다 그대로 살려 심판과 거절의 긴장을 유지하는 것이 본문에 충실합니다.
  doctrine_reference: 의인화된 신적 행위를 평탄화하지 말고 원문 긴장을 보존
