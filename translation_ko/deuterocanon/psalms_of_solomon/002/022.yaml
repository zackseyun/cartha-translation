  source_fidelity: 그리스어 περιείλατο는 여성이 스스로 머리에 쓴 것을 벗는 행위를 가리키며, ‘벗었습니다’가 이를 충실하게 옮깁니다. 초안의 ‘벗어 버렸습니다’는 원문에 없는 단호함·완결감을 다소 보탭니다. μίτραν δόξης는 ‘영광의 머리장식’으로 자연스럽고 문맥에 적절하며, 하나님이 그것을 그녀에게 씌우셨다는 관계도 보존됩니다.
  naturalness: ‘하나님께서 그녀에게 씌워 주신 영광의 머리장식’은 현대 표준 한국어 합쇼체 문장으로 자연스럽습니다. ‘그녀’는 본문의 여성 단수 지시를 유지합니다.
