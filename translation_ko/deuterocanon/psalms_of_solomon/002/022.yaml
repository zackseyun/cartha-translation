lexical_decisions:
- source_word: περιείλατο
  english_pob_choice: removed
  chosen_korean: 벗어 버렸습니다
  alternatives_korean:
  - 벗었습니다
  - 치웠습니다
  - 내려놓았습니다
  lexicon: LSJ
  rationale: 중간태 aorist의 자발적 행위를 살리면서도, 머리에 쓰는 물건을 스스로 내리는 동작을 한국어로 자연스럽게 나타냅니다.
- source_word: μίτραν δόξης
  english_pob_choice: headdress of glory
  chosen_korean: 영광의 머리장식
  alternatives_korean:
  - 영광의 관
  - 영광의 두건
  - 영광의 터번
  lexicon: LSJ
  rationale: μίτρα는 문맥상 여성의 머리장식/머리띠 계열이므로, ‘터번’보다 중립적이고 이미지에 맞는 ‘머리장식’으로 옮기되, δόξης의 명예·영예 뉘앙스를 ‘영광’으로 유지합니다.
- source_word: περιέθηκεν αὐτῇ
  english_pob_choice: had placed on her
  chosen_korean: 그녀에게 씌워 주신
  alternatives_korean:
  - 그녀에게 얹으신
  - 그녀에게 두르신
  - 그녀에게 주신
  lexicon: LSJ
  rationale: 하나님이 직접 수여하신 장식이라는 점을 살리면서, 머리에 ‘씌우다’는 한국어 관용으로 원문의 ‘위에 두다/둘러 주다’ 의미를 자연스럽게 전달합니다.
- source_word: ὁ θεός
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 주님
  - 신
  lexicon: LSJ
  rationale: 문맥상 일반적인 신격이 아니라 성서적 표준 호칭이 가장 적절하므로 ‘하나님’을 사용합니다.
theological_decisions:
- issue: 여성 인격화된 예루살렘이 스스로 영광의 표식을 벗는 장면의 주체성
  chosen_reading: ‘그녀는 … 벗어 버렸습니다’로 옮겨, 수치와 상실의 자발적/표상적 행위를 드러냅니다.
  alternative_readings:
  - ‘그것을 빼앗겼습니다’처럼 수동적으로 옮길 수 있음
  - ‘벗었습니다’로 더 중립적으로 옮길 수 있음
  rationale: 그리스어 중간태와 문맥의 애도·수치 이미지가 함께 작동하므로, 단순한 강탈보다 스스로 내려놓는/벗는 뉘앙스를 살리는 편이 원문에 가깝습니다.
  doctrine_reference: 문학적 의인화와 심판-애도 이미지
- issue: 미트라의 문화적 이미지
  chosen_reading: ‘머리장식’으로 두어 여성의 장식품 이미지를 유지합니다.
  alternative_readings:
  - ‘터번’으로 옮기면 구체성은 살지만 현대 한국어에서 남성적·이국적 뉘앙스가 강해집니다.
  - ‘관’은 왕권 이미지를 과도하게 불러올 수 있습니다.
  rationale: 여기서는 제의복이나 남성용 터번보다, 영광을 상징하는 여성의 머리 장식이라는 문맥적 기능이 더 중요합니다.
  doctrine_reference: 문맥 우선의 이미지 보존
