base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/025.yaml
  text: For they mocked and did not spare, in anger and wrath with fierce indignation.
  footnotes:
  - marker: a
    text: Or 'with resentment' or 'with vengeful anger' for 'with fierce indignation' (μετὰ μηνίσεως).
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 조롱하고도 아끼지 않았습니다 — 분노와 격노와 격한 분개로.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘격한 분개’는 μήνις의 강한, 오래 지속되는 분노를 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  english_pob_choice: mocked
  chosen_korean: 조롱하고도
  alternatives_korean:
  - 비웃고도
  - 조롱했으며
  lexicon: LSJ
  rationale: ἐνέπαιξαν은 단순한 웃음이 아니라 경멸 섞인 조롱을 뜻하므로, 한국어에서는 동작성을 살린 ‘조롱하고도’가 가장 직접적입니다.
- source_word: οὐκ ἐφείσαντο
  english_pob_choice: did not spare
  chosen_korean: 아끼지 않았습니다
  alternatives_korean:
  - 불쌍히 여기지 않았습니다
  - 봐주지 않았습니다
  lexicon: LSJ
  rationale: φείδομαι는 ‘아끼다/삼가다/봐주다’의 폭을 가지지만, 여기서는 가해를 멈추지 않은 뜻이므로 문맥상 ‘아끼지 않았습니다’가 자연스럽습니다.
- source_word: ἐν ὀργῇ καὶ θυμῷ
  english_pob_choice: in anger and wrath
  chosen_korean: 분노와 격노로
  alternatives_korean:
  - 분노와 진노로
  - 분노와 분개로
  lexicon: LSJ
  rationale: ὀργή와 θυμός는 서로 겹치면서도 강도가 올라가는 이중어구이므로, 각각을 ‘분노’와 더 강한 ‘격노’로 살렸습니다.
- source_word: μετὰ μηνίσεως
  english_pob_choice: with fierce indignation
  chosen_korean: 격한 분개로
  alternatives_korean:
  - 원한을 품고
  - 분개하여
  lexicon: LSJ
  rationale: μήνις는 단순한 불쾌감이 아니라 지속적이고 응축된 분개를 가리키므로, 전통적 교회어보다 직접적인 ‘격한 분개’가 원문 긴장을 잘 드러냅니다.
theological_decisions:
- issue: 세 겹의 분노 표현을 어떻게 살릴지
  chosen_reading: ‘분노와 격노와 격한 분개로’처럼 누적 구조를 유지했습니다.
  alternative_readings:
  - 세 표현을 하나로 묶어 ‘몹시 화를 내며’로 완화함
  - ‘진노와 분노로’처럼 순서를 단순화함
  rationale: 원문은 동의 반복을 통해 감정의 고조를 형성하므로, 이를 평탄화하지 않고 한국어에서도 점층 효과를 보존했습니다.
  doctrine_reference: 시적-수사적 강조의 보존 원칙
