  yaml_path: translation/deuterocanon/psalms_of_solomon/002/012.yaml
  text: And the earth will know all your righteous judgments[a], O God.
  footnotes:
  - marker: a
    text: Or "all your just judgments."
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 땅은 주님의 모든 의로운 심판을 알게 될 것입니다, 오 하나님.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “주님의 모든 공의로운 심판.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γνώσεται
  english_pob_choice: will know
  chosen_korean: 알게 될 것입니다
  alternatives_korean:
  - 알 것입니다
  - 인식하게 될 것입니다
  - 깨닫게 될 것입니다
  lexicon: BDAG
  rationale: 미래형 γινώσκω의 핵심 의미를 자연스럽게 살려, 장차 있게 될 인식·인지의 도달을 가장 პირდაპირ적으로 표현했습니다.
- source_word: ἡ γῆ
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 땅이
  - 세상
  - 온 땅
  lexicon: BDAG
  rationale: 문맥상 רחב한 범위를 가리키므로 '땅'이 가장 무난하며, 한국어에서 시적·우주적 대상도 자연스럽게 담습니다.
- source_word: τὰ κρίματά σου πάντα τὰ δίκαια
  english_pob_choice: all your righteous judgments
  chosen_korean: 주님의 모든 의로운 심판
  alternatives_korean:
  - 주님의 모든 공의로운 심판
  - 주님의 모든 의로운 판결
  - 주님의 모든 옳은 심판
  lexicon: BDAG
  rationale: κρίματα는 심판/판결의 법정적 의미를 유지하고, δίκαια는 그 심판의 성격을 '의로운'으로 살려 도덕적·신적 정당성을 보존했습니다.
- source_word: ὁ θεός
  english_pob_choice: O God
  chosen_korean: 오 하나님
  alternatives_korean:
  - 하나님이시여
  - 오, 하나님
  lexicon: BDAG
  rationale: 주격 관사와 함께 쓰인 호격적 직접 호소를 한국어의 기도체 '오 하나님'으로 옮겨, 문장의 기도적 어조를 유지했습니다.
theological_decisions:
- issue: 심판의 성격을 '의로운'으로 보존할지 '공의로운/옳은'으로 완화할지
  chosen_reading: 하나님의 심판이 단순한 판정이 아니라 도덕적·언약적 정당성을 가진 심판이라는 점을 드러내기 위해 '의로운 심판'으로 유지했습니다.
  alternative_readings:
  - 공의로운 심판
  - 옳은 심판
  rationale: δίκαια의 형용사적 기능을 살려, 하나님의 κρίματα를 중립적 행정 결정이 아니라 의에 합치하는 판단으로 읽게 합니다.
  doctrine_reference: 하나님의 의와 심판의 정당성
