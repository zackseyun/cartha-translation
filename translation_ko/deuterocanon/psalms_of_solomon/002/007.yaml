translation:
  language: ko
  text: 그들의 죄에 따라 그들을 대하셨습니다. 이는 그들을 압도하는 자들의 손에 버려두셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들을 압도하는 자들’은 ‘그들보다 강한 자들’ 또는 ‘그들을 이기는 자들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὰς ἁμαρτίας αὐτῶν
  english_pob_choice: according to their sins
  chosen_korean: 그들의 죄에 따라
  alternatives_korean:
  - 그들의 죄대로
  - 그들의 죄에 맞게
  lexicon: BDAG
  rationale: κατά는 여기서 기준·상응의 의미로 쓰였으므로, 한국어에서는 ‘죄에 따라’로 옮겨 심판이 죄에 상응함을 드러냈습니다.
- source_word: ἐποίησεν αὐτοῖς
  english_pob_choice: he dealt with them
  chosen_korean: 그들에게 행하셨습니다
  alternatives_korean:
  - 그들을 대하셨습니다
  - 그들에게 하셨습니다
  lexicon: BDAG
  rationale: 직역하면 ‘그들에게 하셨다’이지만, 한국어에서는 행위된 판단의 뉘앙스를 살려 ‘행하셨습니다’로 자연스럽게 표현했습니다.
- source_word: ἐγκατέλειπεν αὐτοὺς
  english_pob_choice: he abandoned them
  chosen_korean: 그들을 버려두셨기 때문입니다
  alternatives_korean:
  - 그들을 떠나셨기 때문입니다
  - 그들을 버리셨기 때문입니다
  lexicon: BDAG
  rationale: ἐγκαταλείπω는 보호를 거두고 내버려 두는 뜻이 강하므로, 단순한 ‘떠나셨다’보다 ‘버려두셨다’가 더 정확합니다.
- source_word: εἰς χεῖρας κατισχυόντων
  english_pob_choice: into the hands of those who prevailed over them
  chosen_korean: 그들을 압도하는 자들의 손에
  alternatives_korean:
  - 그들보다 강한 자들의 손에
  - 그들을 이기는 자들의 손에
  lexicon: BDAG
  rationale: ‘손에’는 권력 아래 넘겨짐을 나타내는 관용구이므로 살렸고, κατισχυόντων은 ‘압도하는/우세한’ 능동성을 드러내기 위해 ‘압도하는 자들’로 옮겼습니다.
theological_decisions:
- issue: ὅτι의 논리 관계
  chosen_reading: ‘이는 … 때문입니다’로 옮겨, 앞 절의 행위가 심판의 근거를 설명하는 문맥으로 읽었습니다.
  alternative_readings:
  - ‘for’에 해당하는 설명적 연결
  - 단순 인과로 ‘왜냐하면’이라고 옮김
  rationale: 여기서 ὅτι는 단순 원인 제시라기보다 앞선 진술을 설명·정당화하는 연결로 읽히므로, 한국어에서는 자연스러운 설명적 인과 표현을 택했습니다.
  doctrine_reference: 시편의 보응 사상과 심판의 정당성
