base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/024.yaml
  text: And I saw[a], and I entreated the face of the Lord and said, “Enough, Lord[d][c][b], of your hand weighing heavily on Israel by the attack of the nations.”
  footnotes:
  - marker: a
    text: Or 'Be satisfied, Lord,' or 'Let it suffice, Lord.' The Greek imperative Ἱκάνωσον can be read more literally than the concise rendering 'Enough.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'of your hands being heavy upon Israel,' preserving a common biblical image of divine pressure or judgment.
    reason: cultural_note
  - marker: c
    text: Or 'through the invasion of nations.' The noun ἐπαγωγή can suggest either the bringing-on of nations or their assault.
    reason: alternative_reading
  - marker: d
    text: Or 'I implored before the Lord'.
    reason: previous_rendering
translation:
  language: ko
  text: 저는 보고, 주님의 얼굴 앞에 간구하며 말했습니다. “이제 그만하소서, 주님, 민족들의 공격으로 이스라엘 위에 무겁게 내리누르시는 주님의 손을.”[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님, 만족하소서’ 또는 ‘주님, 이제 충분합니다’로도 옮길 수 있습니다. Ἱκάνωσον은 보다 직역적으로 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘주님의 손들이 이스라엘 위에 무겁게 있는 것’으로, 하나님의 징계가 무겁게 임하는 성서적 이미지를 보존합니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘민족들의 침공으로’로도 옮길 수 있습니다. ἐπαγωγή는 민족들의 몰려옴과 그들의 공격을 함께 시사할 수 있습니다.
    reason: alternative_reading
  - marker: d
    text: 또는 ‘주님 앞에서 간구하며’로도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: καὶ ἐγὼ εἶδον
  english_pob_choice: And I saw
  chosen_korean: 저는 보고
  alternatives_korean:
  - 그리고 저는 보았습니다
