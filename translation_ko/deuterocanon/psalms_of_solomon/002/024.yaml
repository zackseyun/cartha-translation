  lexicon: SBLGNT/헬라어 구문
  rationale: 첫 동사의 단순 완료를 자연스러운 서술로 살리되, 문맥의 연결을 위해 접속을 유지했습니다.
- source_word: ἐδεήθην τοῦ προσώπου Κυρίου
  english_pob_choice: I entreated the face of the Lord
  chosen_korean: 주님의 얼굴 앞에 간구하며
  alternatives_korean:
  - 주님의 얼굴을 간구하며
  - 주님 앞에 간청하며
  lexicon: LSJ
  rationale: τοῦ προσώπου Κυρίου는 ‘주님의 얼굴/임재’라는 셈어적 관용구이므로, 단순히 ‘주님께’로 풀기보다 ‘얼굴 앞에’로 그 관계적 이미지를 살렸습니다.
- source_word: Ἱκάνωσον
  english_pob_choice: Enough
  chosen_korean: 이제 그만하소서
  alternatives_korean:
  - 충분하소서
  - 그만해 주십시오
  - 족하나이다
  lexicon: LSJ
  rationale: 이 명령형은 중단과 충분함을 구하는 간구이므로, 한국어에서는 압박이 멈추기를 비는 호소로 ‘이제 그만하소서’가 가장 자연스럽습니다.
- source_word: τοῦ βαρύνεσθαι χεῖράς σου ἐπʼ Ἰσραήλ
  english_pob_choice: of your hands weighing heavily on Israel
  chosen_korean: 주님의 손을 … 이스라엘 위에 무겁게 내리누르시는
  alternatives_korean:
  - 주님의 손들이 이스라엘 위에 무겁게 하시는
  - 이스라엘 위에 무겁게 얹으시는 주님의 손을
  lexicon: LSJ
  rationale: 복수 ‘손들’과 ‘무겁게 하다’라는 성서적 심판 이미지를 그대로 반영하되, 한국어에서는 ‘내리누르다’로 압박의 감각을 살렸습니다.
- source_word: ἐν ἐπαγωγῇ ἐθνῶν
  english_pob_choice: by the attack of the nations
  chosen_korean: 민족들의 공격으로
  alternatives_korean:
  - 민족들의 침공으로
  - 민족들을 불러오심으로
  lexicon: LSJ
  rationale: ἐπαγωγή는 ‘가져옴/불러옴’과 ‘공격·침략’의 뉘앙스를 모두 가질 수 있으나, 이 문맥에서는 이스라엘에 대한 외세의 압박으로 이해하여 ‘공격’으로 옮겼습니다.
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주여
  - 주
  lexicon: LSJ
  rationale: 하나님께 드리는 직접 호칭이므로 프로젝트 기본어인 ‘주님’을 사용했습니다.
theological_decisions:
- issue: 주님의 ‘얼굴’ 표현 유지 여부
  chosen_reading: 셈어적 관용구를 살려 ‘주님의 얼굴 앞에’로 번역했습니다.
  alternative_readings:
  - 단순히 ‘주님께’로 완화할 수 있음
  - ‘주님의 임재 앞에’로 해석할 수 있음
  rationale: 본문은 단순 청원이 아니라 하나님의 얼굴/은총을 구하는 관계적 이미지이므로, 이를 평준화하지 않고 드러내는 것이 source-direct합니다.
