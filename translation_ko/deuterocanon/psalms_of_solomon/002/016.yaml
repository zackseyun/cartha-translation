base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/016.yaml
  text: I will declare you righteous[a], O God, with an upright heart; for in your judgments is your righteousness[b], O God.
  footnotes:
  - marker: a
    text: Or 'I will justify you' or 'I will vindicate you.'
    reason: lexical_alternative
  - marker: b
    text: Or 'justice' for 'righteousness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 하나님을 의로운 분으로 선포하겠습니다[a], 마음이 올바르게 하여. 당신의 심판들 가운데에 당신의 의가 있기 때문입니다[b], 하나님이여.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님을 의롭게 하겠습니다’, ‘하나님을 변호하겠습니다’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘정의’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιώσω
  english_pob_choice: I will declare you righteous
  chosen_korean: 하나님을 의로운 분으로 선포하겠습니다
  alternatives_korean:
  - 하나님을 의롭게 하겠습니다
  - 하나님을 변호하겠습니다
  lexicon: BDAG
  rationale: 화자가 하나님을 의롭게 만든다는 뜻이 아니라, 하나님이 의로우심을 선언하는 뜻이므로 ‘의로운 분으로 선포하다’가 forensic한 힘을 가장 분명하게 살립니다.
- source_word: ἐν εὐθύτητι καρδίας
  english_pob_choice: with an upright heart
  chosen_korean: 마음이 올바르게 하여
  alternatives_korean:
  - 마음의 바름으로
  - 마음의 정직함으로
  lexicon: LSJ
  rationale: ‘εὐθύτης’의 직선성·정직성을 한국어로 자연스럽게 옮기되, 행위의 방식이 마음의 내적 상태에서 나온다는 점을 살렸습니다.
- source_word: κρίμασιν
  english_pob_choice: judgments
  chosen_korean: 심판들
  alternatives_korean:
  - 판결들
  - 재판적 결정들
  lexicon: BDAG
  rationale: 하나님의 여러 심판 행위를 가리키는 복수형이므로, 가장 직접적인 ‘심판들’이 적절합니다.
- source_word: δικαιοσύνη
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 정의
  lexicon: BDAG
  rationale: 프로젝트 기본값에 따라 δικαιοσύνη는 문맥상 사회적 정의보다 하나님의 도덕적 의로움을 가리키므로 ‘의’로 옮겼습니다.
theological_decisions:
- issue: δικαιώσω의 신학적 방향성
  chosen_reading: 화자가 하나님을 ‘의로운 분으로 선포’하는 고백으로 이해했습니다.
  alternative_readings:
  - 하나님을 의롭게 하겠습니다
  - 하나님을 변호하겠습니다
  rationale: 본문의 목적어가 하나님이므로, 하나님을 개선시키는 의미가 아니라 하나님의 의를 공적으로 인정하는 선언으로 읽는 것이 문맥과 일치합니다.
  doctrine_reference: 하나님의 의와 인간의 증언적 고백
- issue: ‘심판들’과 ‘의’의 관계
  chosen_reading: 하나님의 심판 안에 하나님의 의가 드러난다는 진술로 옮겼습니다.
  alternative_readings:
  - 당신의 판결 안에 당신의 공의가 있다
  - 당신의 재판적 결정들 속에 당신의 정의가 있다
  rationale: 원문은 하나님의 κρίμασιν 안에 있는 δικαιοσύνη를 말하므로, 심판을 통해 드러나는 하나님의 의라는 의미를 보존했습니다.
  doctrine_reference: 하나님의 न्याय/의의 계시
