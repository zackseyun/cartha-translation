  verdict: revise
  source_fidelity: 첫 절의 ‘모욕했습니다’는 본문 전승과 문맥상 συνείδισαν을 ὀνειδίζω 계열(모욕하다/비난하다)로 이해하는 현행 POB 감사 기록에 부합합니다. 그러나 ‘그 짓밟힘 가운데서’는 한국어로 부자연스럽고, [c]의 ‘보았습니다’ 대안은 해당 본문 읽기와 맞지 않아 삭제해야 합니다. δεύτε 절의 두 ‘그’는 지시 대상이 불명확하므로 예루살렘을 명시하는 편이 안전합니다.
  naturalness: ‘민족들은 예루살렘이 짓밟히는 가운데 예루살렘을 모욕했습니다’는 반복이 있지만 고대 시가의 강조를 보존하면서도 명확합니다. ‘찬란함’은 κάλλος가 이 문맥에서 지닌 공적 아름다움과 영화의 뉘앙스를 자연스럽게 전달합니다.
  terminology: ‘영광의 보좌’는 δόξης의 속격을 보존하는 적절한 표현입니다. ‘모욕했습니다’와 ‘끌어내렸습니다’는 합쇼체 문체와 본문의 격조에 맞습니다.
