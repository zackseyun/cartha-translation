base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/020.yaml
  text: For the nations insulted Jerusalem in her trampling[c][b][a]; they pulled her splendor down from the throne of glory.
  footnotes:
  - marker: a
    text: Or 'her beauty' instead of 'her splendor.'
    reason: lexical_alternative
  - marker: b
    text: The Greek literally says 'from the throne of glory'; this may also be understood as 'from a glorious throne.'
    reason: lexical_alternative
  - marker: c
    text: Or 'For the nations saw Jerusalem trampled down;'.
    reason: previous_rendering
translation:
  language: ko
  text: 민족들은 예루살렘이 짓밟히는 가운데 예루살렘을 모욕했습니다. 그들은 예루살렘의 찬란함을 영광의 보좌에서 끌어내렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예루살렘의 아름다움’이라고 할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 문자적으로 ‘영광의 보좌에서’라고 되어 있습니다. 이는 ‘영광스러운 보좌에서’로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνείδισαν
  english_pob_choice: insulted
  chosen_korean: 모욕했습니다
  alternatives_korean:
  - 비난했습니다
  - 욕했습니다
  - 조롱했습니다
  lexicon: LSJ
  rationale: 이 동사는 단순한 ‘보기’가 아니라 수치와 공격을 가하는 말로 이해하는 것이 맞으므로, 자연스럽고 직접적인 ‘모욕했습니다’로 옮겼습니다.
- source_word: ἔθνη
  english_pob_choice: the nations
  chosen_korean: 그 민족들은
  alternatives_korean:
  - 열방은
  - 민족들은
  - 나라들은
  lexicon: LSJ
  rationale: 시편 전통의 평행법에서 ἔθνη는 주변 열방을 가리키는 말이지만, 한국어에서는 문맥을 유지하면서도 자연스럽게 ‘그 민족들’로 옮길 수 있습니다.
- source_word: ἐν καταπατήσει
  english_pob_choice: in her trampling
  chosen_korean: 그 짓밟힘 가운데서
  alternatives_korean:
  - 짓밟히는 가운데
  - 그 짓밟힘 속에서
  - 밟혀 짓눌린 상태에서
  lexicon: LSJ
  rationale: 명사구를 살려 예루살렘이 당한 상태를 나타내도록 했습니다. 동사적으로 풀어 쓰면 앞절의 동작과 섞이므로, 수난의 상태를 드러내는 표현을 택했습니다.
- source_word: τὸ κάλλος αὐτῆς
  english_pob_choice: her splendor
  chosen_korean: 그 아름다움을
  alternatives_korean:
  - 그 영광을
  - 그 찬란함을
  - 그 위엄을
  lexicon: LSJ
  rationale: κάλλος는 외형적 아름다움뿐 아니라 눈에 보이는 품위와 광채를 가리킬 수 있어, 예루살렘의 격하된 이전 지위를 고려해 ‘아름다움’으로 옮겼습니다.
- source_word: ἀπὸ θρόνου δόξης
  english_pob_choice: from the throne of glory
  chosen_korean: 그 영광의 보좌에서
  alternatives_korean:
  - 영광의 보좌에서
  - 영광스러운 보좌에서
  - 그 영광의 자리에서
  lexicon: LSJ
  rationale: 헬라어의 소유격 구조를 비교적 직역해 ‘영광의 보좌’로 유지했습니다. 이는 예루살렘의 이전 영화로운 지위를 압축적으로 드러냅니다.
theological_decisions:
- issue: συνείδισαν의 의미는 ‘보다’가 아니라 ‘모욕하다/욕되게 하다’ 계열로 보는 것이 맞는가
  chosen_reading: 문맥과 교정된 본문 전승을 따라 ‘모욕했습니다’로 읽었습니다.
  alternative_readings:
  - 봤습니다
  - 주목했습니다
  - 인식했습니다
  rationale: 이 절은 예루살렘의 수치를 말하는 구절이며, 문법적으로도 ‘보다’ 해석은 성립하기 어렵습니다. 따라서 수치와 조롱의 의미를 드러내는 읽기가 본문 흐름에 더 잘 맞습니다.
  doctrine_reference: 본문비평 및 어휘 선택
