  rationale: 철회된 ‘보다’ 해석을 담은 [c]를 삭제하고, 무효한 중복 어휘 각주를 유효한 대안으로 정정했습니다. 또한 ‘짓밟힘’의 상태를 자연스러운 한국어 절로 풀고, 예루살렘을 명시하여 소유·지시 관계를 분명히 했습니다. 본문이 허용하는 ‘영광의 보좌’/‘영광스러운 보좌’의 모호성은 [b]에 보존했습니다.
