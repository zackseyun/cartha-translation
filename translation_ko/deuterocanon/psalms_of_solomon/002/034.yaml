base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/034.yaml
  text: He himself is king over the heavens[a], and judges kings and rulers;
  footnotes:
  - marker: a
    text: Or 'judging kings and princes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 하늘들 위의 왕이시며, 왕들과 통치자들을 심판하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '하늘들 위에'입니다. 그리스어 복수형을 보존한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  english_pob_choice: he himself
  chosen_korean: 그분은
  alternatives_korean:
  - 그분 자신은
  - 그분이 친히
  lexicon: BDAG
  rationale: 그리스어의 강조는 문맥상 주어의 고유한 왕권을 드러내므로, 별도의 재귀 표현을 더하지 않고도 문장 첫머리의 주어 강조로 살렸습니다.
- source_word: βασιλεὺς
  english_pob_choice: king
  chosen_korean: 왕
  alternatives_korean:
  - 임금
  - 통치자
  lexicon: BDAG
  rationale: 왕권 선언을 직접적으로 드러내는 기본어로 옮겼으며, '통치자'보다 더 분명하게 군왕적 함의를 유지합니다.
- source_word: ἐπὶ τῶν οὐρανῶν
  english_pob_choice: over the heavens
  chosen_korean: 하늘들 위의
  alternatives_korean:
  - 하늘들 위에 계신
  - 하늘에 있는
  lexicon: BDAG
  rationale: ἐπί + 속격의 지배·우위 의미를 반영해 단순한 위치가 아니라 위에 있는 주권을 나타냈고, 그리스어 복수형도 '하늘들'로 살렸습니다.
- source_word: κρίνων
  english_pob_choice: he judges
  chosen_korean: 심판하십니다
  alternatives_korean:
  - 판단하십니다
  - 재판하십니다
  lexicon: BDAG
  rationale: 현재분사의 지속적 행위를 한국어 현재 서술로 옮기되, 왕들과 통치자들에 대한 행위는 법정적 판단보다 통치적·신적 심판이 더 적절하므로 '심판하다'를 택했습니다.
- source_word: ἀρχάς
  english_pob_choice: rulers
  chosen_korean: 통치자들
  alternatives_korean:
  - 지도자들
  - 권세자들
  - 방백들
  lexicon: BDAG
  rationale: '''왕들''과 병렬되는 정치 권력자들을 가리키므로, 현대 독자가 이해하기 쉬우면서도 직책적 위계를 보존하는 ''통치자들''로 옮겼습니다.'
theological_decisions:
- issue: 하늘들(the heavens)의 복수형 처리
  chosen_reading: 그리스어 복수형을 반영해 '하늘들'로 옮기되, 하나님의 초월적 왕권이 하늘들 위에 있음을 강조했습니다.
  alternative_readings:
  - '''하늘''로 단수화'
  - '''하늘 나라들''로 의역'
  rationale: 본문은 단순한 장소가 아니라 우위와 통치를 말하므로 복수형을 보존하는 편이 원문 긴장을 더 잘 드러냅니다.
  doctrine_reference: 시적/지혜문학적 하나님 주권 표현
