source:
  edition: lxx-swete-1909
  text: Ἐν τῷ ὑπερηφανεύεσθαι τὸν ἁμαρτωλὸν ἐν κριοῖς κατέβαλλε τείχη ὀχυρά, καὶ οὐκ ἐκώλυας.
