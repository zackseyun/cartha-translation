base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/001.yaml
  text: When the sinner acted arrogantly[a], he tore down fortified walls with battering rams[b], and you did not stop him.
  footnotes:
  - marker: a
    text: Or 'with rams'; the Greek word can mean literal rams, but here likely refers to siege engines.
    reason: lexical_alternative
  - marker: b
    text: Or 'While the sinner was acting arrogantly with battering-rams, he was tearing down'.
    reason: previous_rendering
translation:
  language: ko
  text: 죄인이 교만하게 행동할 때, 그는 공성망치로 견고한 성벽을 허물고 있었는데, 주께서는 그를 막지 않으셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ἐν τῷ + 부정사 구문은 여기서 시간 관계를 나타내므로 ‘~할 때’로 옮겼습니다.
    reason: source_note
  - marker: b
    text: ἐν κριοῖς는 문자적으로 ‘숫양들로’도 가능하지만, 성벽을 파괴하는 문맥에서는 공성 장비, 곧 공성망치를 가리키는 것으로 이해했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῷ ὑπερηφανεύεσθαι
  english_pob_choice: When the sinner acted arrogantly
  chosen_korean: 죄인이 교만해질 때
  alternatives_korean:
  - 죄인이 교만하게 행동할 때
  - 죄인이 스스로 높아질 때
  - 죄인이 자만할 때
  lexicon: LSJ
  rationale: ἐν τῷ + 부정사 구문을 시간 부사절로 옮겼고, ὑπερηφανεύεσθαι는 도덕적 뉘앙스를 살려 ‘교만해질 때’로 간명하게 표현했습니다.
- source_word: ἐν κριοῖς
  english_pob_choice: with battering rams
  chosen_korean: 공성망치로
  alternatives_korean:
  - 도끼로
  - 숫양으로
  - 공성추로
  lexicon: LSJ
  rationale: 문맥이 성벽을 무너뜨리는 포위전 장면이므로, 문자적 ‘숫양’보다 한국어에서 더 자연스럽고 기능을 드러내는 ‘공성망치’로 옮겼습니다.
- source_word: κατέβαλλε τείχη ὀχυρά
  english_pob_choice: he tore down fortified walls
  chosen_korean: 견고한 성벽을 허물었으나
  alternatives_korean:
  - 튼튼한 성벽을 무너뜨렸으나
  - 견고한 성벽을 헐었으나
  - 강한 성벽을 무너뜨렸으나
  lexicon: LSJ
  rationale: κατέβαλλε의 진행성을 살리되 한국어에서 자연스럽게 읽히도록 ‘허물었으나’로 옮겼고, τείχη ὀχυρά는 ‘견고한 성벽’으로 간결하게 처리했습니다.
- source_word: οὐκ ἐκώλυας
  english_pob_choice: you did not stop him
  chosen_korean: 주께서는 그를 막지 않으셨습니다
  alternatives_korean:
  - 주께서는 그를 저지하지 않으셨습니다
  - 주께서는 그를 제지하지 않으셨습니다
  - 주께서는 그를 멈추게 하지 않으셨습니다
  lexicon: LSJ
  rationale: 문맥상 암묵적 목적어를 자연스럽게 보충해 주어를 2인칭으로 유지했고, ‘막다’가 가장 직접적이고 현대적인 대응입니다.
theological_decisions:
- issue: 2인칭 화자와 하나님 호칭의 존대 처리
  chosen_reading: 직접 신적 호칭은 ‘주께서는’으로, 동사는 존대형 ‘막지 않으셨습니다’로 처리했습니다.
  alternative_readings:
  - ‘하나님께서는’
  - ‘주님께서는’
  rationale: 본문의 2인칭 화자가 하나님을 향해 말하는 구조를 살리면서, 한국어 합쇼체에서 신적 대상에 대한 존대 표현을 유지했습니다.
  doctrine_reference: 기도/시편적 직접 화법의 한국어 존대 규범
- issue: ἐν κριοῖς의 의미 범위
  chosen_reading: 포위전 도구를 가리키는 군사적 의미로 이해해 ‘공성망치’로 번역했습니다.
  alternative_readings:
  - ‘숫양들로’
  - ‘공성추로’
  rationale: 성벽 파괴와 결합될 때 문자적 동물 의미보다 포위 장비 의미가 더 분명하므로, 본문의 역사적·문맥적 의미를 드러내는 번역을 택했습니다.
  doctrine_reference: 본문 문맥 우선 원칙
