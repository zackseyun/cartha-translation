base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/002.yaml
  text: Foreign nations went up onto your altar[b][a]; they trampled it with their sandals in arrogance.
  footnotes:
  - marker: a
    text: Or 'Gentiles'; ἔθνη can mean 'nations' generally or, in a Jewish cultic context, non-Israelite peoples specifically.
    reason: lexical_alternative
  - marker: b
    text: Or 'alien' or 'strange' nations, preserving the added sense of otherness in ἀλλότρια.
    reason: lexical_alternative
translation:
  language: ko
  text: 낯선 나라들이 당신의 제단에 올라와, 그들의 샌들로 그것을 밟아 짓밟았습니다 — 오만하게.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이방 나라들’로도 옮길 수 있습니다. ἔθνη는 일반적으로 ‘나라들’이지만, 유대교적 예배 문맥에서는 비이스라엘 민족을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이질적인’이나 ‘외부의’ 나라들로도 옮길 수 있습니다. ἀλλότρια는 단순한 외국성뿐 아니라 ‘남의 것’, ‘낯선’의 느낌을 더합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβησαν ἐπὶ τὸ θυσιαστήριόν σου
  english_pob_choice: went up onto your altar
  chosen_korean: 당신의 제단에 올라와
  alternatives_korean:
  - 당신의 제단으로 올라가
  - 당신의 제단 위로 올라와
  lexicon: BDAG
  rationale: ἀνέβησαν의 ‘올라가다’와 ἐπὶ의 공간적 방향을 살려, 제단으로의 침범 동작을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: ἔθνη ἀλλότρια
  english_pob_choice: Foreign nations
  chosen_korean: 낯선 나라들
  alternatives_korean:
  - 외국 나라들
  - 이방 민족들
  - 낯선 민족들
  lexicon: BDAG
  rationale: ἔθνη의 기본 의미인 ‘나라들/민족들’과 ἀλλότρια의 ‘낯선, 이질적인’ 뉘앙스를 함께 담기 위해 ‘낯선 나라들’을 택했습니다.
- source_word: κατεπάτησαν ἐν ὑποδήμασιν αὐτῶν
  english_pob_choice: they trampled it with their sandals
  chosen_korean: 그들의 샌들로 그것을 밟아 짓밟았습니다
  alternatives_korean:
  - 그들의 샌들로 그것을 짓밟았습니다
  - 그들의 신으로 그것을 밟았습니다
  lexicon: BDAG
  rationale: κατεπάτησαν의 강한 훼손감을 ‘밟아 짓밟았습니다’로 살리고, ὑποδήμασιν은 문화적 배경을 보존하는 ‘샌들’로 옮겼습니다.
- source_word: ἐν ὑπερηφανίᾳ
  english_pob_choice: in arrogance
  chosen_korean: 오만하게
  alternatives_korean:
  - 교만하게
  - 거만하게
  - 오만한 태도로
  lexicon: BDAG
  rationale: 부사적 용법을 살려 행위의 태도를 간결하게 드러내는 ‘오만하게’가 가장 자연스럽고, sacrilege의 경멸적 톤도 유지합니다.
theological_decisions:
- issue: 성소 모독의 강도와 서술 톤
  chosen_reading: 단순한 침입이 아니라 제단을 짓밟는 모독 행위로 읽어, 동작의 물리성과 경멸을 함께 드러냈습니다.
  alternative_readings:
  - 제단을 밟았습니다
  - 제단을 더럽혔습니다
  rationale: 문맥상 예배 공간의 훼손과 오만한 모욕이 핵심이므로, ‘짓밟다’를 통해 강도를 분명히 해야 합니다.
  doctrine_reference: 성전/성소의 거룩함과 모독 금지에 대한 성경적 주제
