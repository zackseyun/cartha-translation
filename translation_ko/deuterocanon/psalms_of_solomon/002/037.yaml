base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/037.yaml
  text: Bless God[a], you who fear the Lord with understanding, because the mercy of the Lord is upon those who fear him[b], with judgment.
  footnotes:
  - marker: a
    text: Or “with knowledge” or “with discernment.”
    reason: lexical_alternative
  - marker: b
    text: Or “with justice”; the Greek leaves the relation between mercy and judgment compressed.
    reason: alternative_reading
translation:
  language: ko
  text: 하나님을 찬양하십시오, 분별을 가지고 주님을 경외하는 이들이여.[a] 주님의 긍휼은 주님을 경외하는 이들 위에, 심판과 함께 있습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “지식으로” 혹은 “이해를 가지고”로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “정의와 함께”로도 옮길 수 있습니다. 그리스어는 긍휼과 심판의 관계를 압축적으로 제시합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐλογεῖτε
  english_pob_choice: Bless
  chosen_korean: 찬양하십시오
  alternatives_korean:
  - 복을 빌어 드리십시오
  - 축복하십시오
  lexicon: BDAG
  rationale: 여기서는 하나님을 향한 직접적인 예배적 호응이므로, 한국어로는 자연스럽고 문맥에 맞는 ‘찬양하십시오’가 가장 분명합니다. ‘축복하다’는 한국어 교회용례상 방향이 어긋나기 쉬워 피했습니다.
- source_word: ἐν ἐπιστήμῃ
  english_pob_choice: with understanding
  chosen_korean: 지각을 가지고
  alternatives_korean:
  - 지식으로
  - 분별로
  - 이해를 가지고
  lexicon: BDAG
  rationale: ἐπιστήμῃ는 단순한 정보 지식보다 알고 분별하는 태도를 가리키므로, ‘지각을 가지고’가 가장 압축적으로 그 뜻을 살립니다.
- source_word: ἔλεος
  english_pob_choice: mercy
  chosen_korean: 긍휼
  alternatives_korean:
  - 자비
  - 인자하심
  lexicon: BDAG
  rationale: 하나님의 covenant적 mercy를 한국어에서 가장 직접적으로 드러내는 표현은 ‘긍휼’입니다. 문맥상 경건한 어조도 잘 맞습니다.
- source_word: μετὰ κρίματος
  english_pob_choice: with judgment
  chosen_korean: 심판과 함께
  alternatives_korean:
  - 심판과 더불어
  - 정의와 함께
  - 재판과 함께
  lexicon: BDAG
  rationale: POB가 지적한 대로 κρίμα는 ‘심판/정의’의 긴장을 압축합니다. ‘심판과 함께’는 그 긴장을 그대로 두면서도 한국어로 자연스럽게 읽힙니다.
theological_decisions:
- issue: 긍휼과 κρίμα의 관계
  chosen_reading: 하나님의 긍휼은 그분을 경외하는 자들에게 주어지되, 심판의 차원과 분리되지 않은 채 함께 있습니다.
  alternative_readings:
  - 긍휼은 정의와 함께 있습니다
  - 긍휼은 심판과 결합되어 있습니다
  rationale: 본문은 긍휼과 κρίμα의 관계를 해소하지 않습니다. 따라서 한국어도 둘 사이의 긴장을 보존하여, 자비가 공의/심판을 무화하지 않는다는 점을 드러냅니다.
  doctrine_reference: 하나님의 자비와 공의의 긴장
