source:
  edition: lxx-swete-1909
  text: εὐλογεῖτε τὸν θεόν, οἱ φοβούμενοι τὸν κύριον ἐν ἐπιστήμῃ, ὅτι τὸ ἔλεος Κυρίου ἐπὶ τοὺς φοβουμένους αὐτόν, μετὰ κρίματος,
  language: Greek
  pages:
