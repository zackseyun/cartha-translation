  verdict: revise
  source_fidelity: 첫 동사 ἐμίαναν은 ‘더럽혔습니다’로 적절히 옮겼으나, 둘째 동사 ἐβεβήλωσαν도 동일하게 ‘더럽혔습니다’로 번역하여 원문의 의도적인 어휘 구별과 ‘속되게 하다/모독하다’라는 뜻이 사라졌습니다. 또한 ἀνθ’ ὧν이 이끄는 인과절은 두 동작 모두를 포괄하도록 한 문장으로 연결하는 편이 분명합니다.
  naturalness: ‘예루살렘의 아들들’은 원문의 남성 복수를 보존하며 문맥상 가능합니다. ‘성물들’과 ‘하나님께 드리는 예물들’은 현대 한국어에서 제의 문맥을 자연스럽고 명료하게 전달합니다. 한 문장으로 정리해도 합쇼체의 격식 있는 문체를 유지합니다.
  terminology: τὰ ἅγια는 ‘성물들’로, τὰ δῶρα τοῦ θεοῦ는 하나님께 바쳐지는 제의적 예물이라는 문맥을 드러내어 ‘하나님께 드리는 예물들’로 옮겼습니다. ἐβεβήλωσαν은 제의적 신성 훼손을 나타내므로 ‘속되게 하였습니다’로 ἐμίαναν과 구별했습니다.
  issues:
