  text: ἀνθ' ὧν οἱ υἱοὶ Ἱερουσαλὴμ ἐμίαναν τὰ ἅγια Κυρίου, ἐβεβήλωσαν τὰ δῶρα τοῦ θεοῦ ἐν ἀνομίαις.
