  yaml_path: translation/deuterocanon/psalms_of_solomon/002/003.yaml
  text: because the sons of Jerusalem defiled the holy things of the Lord; they profaned the offerings of God with their lawless acts.
  footnotes:
  - marker: a
    text: Or 'children of Jerusalem.' The Greek reads 'sons,' which is retained in the main text.
