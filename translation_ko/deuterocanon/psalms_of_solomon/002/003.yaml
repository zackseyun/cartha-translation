translation:
  language: ko
  text: 이는 예루살렘의 아들들이 주님의 성물들을 더럽히고, 하나님의 예물들을 그들의 불법한 행위로 속되게 하였기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνθ' ὧν
  english_pob_choice: because
  chosen_korean: 때문입니다
  alternatives_korean:
  - 그래서입니다
  - 그 까닭입니다
  - 이에 대해
  lexicon: BDAG
  rationale: 원문의 원인-결과 관계를 한국어에서 가장 자연스럽게 드러내는 표현으로 처리했습니다.
- source_word: οἱ υἱοὶ Ἱερουσαλήμ
  english_pob_choice: the sons of Jerusalem
  chosen_korean: 예루살렘의 아들들
  alternatives_korean:
  - 예루살렘의 자녀들
  - 예루살렘 사람들
  lexicon: BDAG
  rationale: 그리스어의 남성 복수 형태를 살려 ‘아들들’로 옮겨, 성별 표지를 지우지 않았습니다.
- source_word: ἐμίαναν / ἐβεβήλωσαν
  english_pob_choice: defiled / profaned
  chosen_korean: 더럽혔습니다
  alternatives_korean:
  - 속되게 했습니다
  - 모독했습니다
  - 더럽히고 속되게 했습니다
  lexicon: BDAG
  rationale: 두 동사는 모두 성스러운 대상을 부정하게 만드는 뜻이므로, 한국어에서는 중첩을 피하면서도 제의적 오염의 강도를 살려 ‘더럽혔습니다’로 통일했습니다.
- source_word: τὰ ἅγια Κυρίου / τὰ δῶρα τοῦ θεοῦ
  english_pob_choice: the holy things of the Lord / the offerings of God
  chosen_korean: 주님의 거룩한 것들 / 하나님의 제물들
  alternatives_korean:
  - 주님의 성물들 / 하나님의 제사 제물들
  - 주님의 거룩한 것들 / 하나님께 바쳐진 예물들
  lexicon: BDAG
  rationale: τὰ ἅγια는 단일 성소보다 넓은 ‘거룩한 것들’이 적절하고, δῶρα는 문맥상 하나님께 드려지는 제의적 제물로 이해되어 ‘제물들’로 옮겼습니다.
- source_word: ἐν ἀνομίαις
  english_pob_choice: with their lawless acts
  chosen_korean: 자기들의 불법한 행위로
  alternatives_korean:
  - 불법한 행위들로
  - 불법으로
  - 불법한 행위 가운데서
  lexicon: BDAG
  rationale: ἐν은 여기서 수단/동반의 뉘앙스를 띠므로 한국어 조사 ‘-로’로 자연스럽게 반영했고, ἀνομίαις는 추상명사보다 구체적 행위로 풀었습니다.
theological_decisions:
- issue: δῶρα τοῦ θεοῦ의 제의적 의미
  chosen_reading: 하나님의 제물들로 이해했습니다.
  alternative_readings:
  - 하나님의 선물들
  - 하나님의 예물들
  rationale: 성전 문맥에서 δῶρα는 하나님께 드리는 제물로 읽는 것이 원문 청중의 이해를 가장 잘 보존합니다.
  doctrine_reference: 성전 예배와 제사 용어의 문맥적 해석
