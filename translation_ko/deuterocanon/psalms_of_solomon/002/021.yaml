translation:
  language: ko
  text: 그녀는 아름다운 옷 대신 굵은 베옷을 두르고, 화관 대신 머리에 끈을 둘렀습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘화관’은 머리를 장식하는 관이나 화환을 가리킵니다. ‘왕관’으로도 옮길 수 있으나, 여기서는 왕권보다 장식물이라는 뜻이 두드러집니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아름다운 옷’은 ‘고운 옷’, ‘단정하고 품위 있는 옷’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιέζωσατο
  english_pob_choice: wrapped herself
  chosen_korean: 두르고
  alternatives_korean:
  - 감싸고
  - 입고
  lexicon: BDAG
  rationale: 중간태의 ‘자기 몸에 둘러 매다’는 동작을 현대 한국어에서 자연스럽게 드러내기 위해 ‘두르다’를 선택했습니다.
- source_word: σάκκον
  english_pob_choice: sackcloth
  chosen_korean: 굵은 베옷
  alternatives_korean:
