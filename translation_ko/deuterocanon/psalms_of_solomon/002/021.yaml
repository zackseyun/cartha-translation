theological_decisions:
- issue: 여성의 애곡/겸비 묘사와 장식의 대조 표현
  chosen_reading: 수치나 도덕적 평가를 덧붙이지 않고, 외적 장식 대신 애곡의 표지를 취한 대비 자체를 살렸습니다.
  alternative_readings:
  - ‘슬픔에 잠겨’ 등 감정 상태를 직접 덧붙이는 번역
  - ‘겸손하게’처럼 해석을 앞세우는 번역
  rationale: 본문은 행위와 의복의 상징적 대조를 제시하므로, 해석을 과잉 주입하기보다 서술된 이미지 자체를 보존하는 편이 원문 의미를 더 정확히 드러냅니다.
  doctrine_reference: 문학적-상징적 본문 해석 원칙
