  - 굵은 베
  lexicon: BDAG
  rationale: 애곡과 겸비의 옷이라는 표지를 살리면서 한국어로도 즉시 이해되도록 ‘베옷’을 쓰고, 질감의 거칠음을 ‘굵은’으로 보완했습니다.
- source_word: ἐνδύματος εὐπρεπείας
  english_pob_choice: splendid clothing
  chosen_korean: 화려한 옷
  alternatives_korean:
  - 아름다운 옷
  - 고운 옷
  - 값진 옷
  lexicon: BDAG
  rationale: 대조 구조에서 장식성과 품위를 함께 띠는 옷을 가리키므로, 과장되지 않으면서도 눈에 띄는 ‘화려한 옷’이 적절합니다.
- source_word: στεφάνου
  english_pob_choice: wreath
  chosen_korean: 관
  alternatives_korean:
