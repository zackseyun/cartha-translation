translation:
  language: ko
  text: 그녀는 화려한 옷 대신에 굵은 베옷을 두르고, 관 대신에 머리에 끈을 둘렀습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘관’은 여기서 왕권을 뜻하는 ‘왕관’보다 장식용 머리장식을 더 직접적으로 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘화려한 옷’은 ‘아름다운 옷’ 또는 ‘고운 옷’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘두르고’는 앞의 ‘굵은 베옷’과 뒤의 ‘머리에 끈’이 같은 동작 아래 놓이는 그리스어 구조를 반영합니다.
    reason: source_note
lexical_decisions:
- source_word: περιέζωσατο
  english_pob_choice: wrapped herself
  chosen_korean: 두르고
