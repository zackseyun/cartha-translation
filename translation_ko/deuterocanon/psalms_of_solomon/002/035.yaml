  verdict: revise
  source_fidelity: 핵심 동사 κομίζων은 제공된 그리스어 본문대로 ‘데려가다/가져가다’로 유지되어야 하며, 현 번역의 ‘데려가시는’은 문맥상 수용 가능합니다. 다만 εἰς ἀπωλίαν은 목적지인 ‘멸망으로’를, ἐν ἀτιμίᾳ는 상태·방식인 ‘수치 가운데’를 나타내므로, ‘영원한 멸망 가운데 수치로’는 두 전치사구의 관계를 바꾸어 놓습니다. 이를 바로잡았습니다. αἰῶνος의 문자적 대안은 ‘세대’가 아니라 ‘시대’입니다.
  naturalness: ‘영원한 멸망으로 데려가시며, 수치 가운데’라는 배열이 현대 한국어에서 목적지와 수치의 상태를 자연스럽고 분명하게 드러냅니다. ‘그분’을 사용하여 αὐτόν의 지시 대상을 존중하는 문체에 맞게 표현했습니다.
  terminology: ‘영광’, ‘교만한 자들’, ‘영원한 멸망’, ‘수치’는 원문의 의미 영역과 현대적인 성서 문체에 적합합니다. ‘알지 못하였기’는 ἔγνωσαν의 인식·관계 양면을 특정하지 않고 보존합니다.
