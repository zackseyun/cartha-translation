lexical_decisions:
- source_word: ὁ ἀνιστῶν ἐμέ εἰς δόξαν
  english_pob_choice: the one who raises me to glory
  chosen_korean: 저를 영광으로 일으키시는 분
  alternatives_korean:
  - 저를 영광으로 높이시는 분
  - 저를 영광에 이르게 하시는 분
  lexicon: BDAG
  rationale: ἀνιστῶν의 상승/일으킴 이미지를 살리기 위해 ‘일으키다’를 택했고, εἰς δόξαν은 결과 목적을 드러내는 ‘영광으로’로 옮겼습니다.
- source_word: κομίζων ὑπερηφάνους
  english_pob_choice: brings the proud
  chosen_korean: 교만한 자들을 … 데려가시는
  alternatives_korean:
  - 교만한 자들을 이끄시는
  - 교만한 자들에게 가져오시는
  lexicon: BDAG
  rationale: 코미조의 핵심인 ‘데려오다/가져오다’의 이동감을 살리되, 문맥상 심판의 방향을 드러내는 자연스러운 한국어로 풀었습니다.
- source_word: ἀπωλίαν αἰῶνος
  english_pob_choice: everlasting destruction
  chosen_korean: 영원한 멸망
  alternatives_korean:
  - 영속하는 멸망
  - 세대의 멸망
  lexicon: BDAG
  rationale: POB의 문맥 판단을 따라 지속성을 분명히 하는 ‘영원한 멸망’을 사용했고, 더 문자적인 ‘세대의 멸망’은 각주로만 열어 두었습니다.
- source_word: ἐν ἀτιμίᾳ
  english_pob_choice: in disgrace
  chosen_korean: 수치로
  alternatives_korean:
  - 불명예 가운데
  - 치욕 속에서
  lexicon: BDAG
  rationale: ἀτιμία의 공적 수치/불명예를 한국어로 간결하게 전달하기 위해 ‘수치로’라고 옮겼습니다.
- source_word: οὐκ ἔγνωσαν αὐτόν
  english_pob_choice: they did not know him
  chosen_korean: 그를 알지 못하였기 때문입니다
  alternatives_korean:
  - 그를 알아보지 못하였기 때문입니다
  - 그를 인정하지 않았기 때문입니다
  lexicon: BDAG
  rationale: ἔγνωσαν의 넓은 의미를 유지하기 위해 기본적으로 ‘알다’를 택했고, 관계적/인지적 거부를 과도하게 특정하지 않았습니다.
theological_decisions:
- issue: ‘교만한 자들’의 심판 동사 처리
  chosen_reading: ‘데려가시는’으로 옮겨, 원문의 운동감과 심판의 결과를 유지했습니다.
  alternative_readings:
  - ‘멸망에 이르게 하시는’
  - ‘멸망으로 끌고 가시는’
  rationale: '원문은 교만한 자들을 멸망 쪽으로 옮기는 동작을 보이므로, 심판의 방향을 드러내되 과도한 해석(예: 운명론적 뉘앙스)은 피했습니다.'
  doctrine_reference: 시편적 심판 언어의 직설적 보존
- issue: ‘그를 알지 못하였다’의 인식/관계 의미
  chosen_reading: ‘알지 못하였기 때문입니다’로 평이하게 두었습니다.
  alternative_readings:
  - ‘알아보지 못하였기 때문입니다’
  - ‘인정하지 않았기 때문입니다’
  rationale: 문맥상 인지 실패와 관계적 무지 모두 가능하지만, 본문이 요구하는 최소 의미를 넘지 않도록 가장 넓은 표현을 유지했습니다.
  doctrine_reference: 인지와 언약적 인식의 중첩
