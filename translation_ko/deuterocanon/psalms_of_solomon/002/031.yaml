translation:
  language: ko
  text: 그의 몸은 큰 모욕을 당한 채[b] 파도 위에서 떠밀려 가고 있었고[a], 그를 장사 지낼 사람은 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘떠밀려 가고 있었고’는 외력에 의해 계속 실려 가는 뜻을 나타냅니다. 달리 ‘실려 가고 있었고’ 또는 ‘끌려 가고 있었고’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘큰 모욕을 당한 채’는 큰 수치와 모욕적인 처우를 뜻합니다. 달리 ‘큰 치욕 가운데’ 또는 ‘심한 학대를 받으며’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ σῶμα
  english_pob_choice: body
  chosen_korean: 몸
  alternatives_korean:
  - 시신
  - 육체
  lexicon: BDAG
  rationale: σῶμα는 여기서 사람의 몸을 가리키는 일반어이므로, 해석을 덧붙이는 ‘시신’보다 구체적이면서도 중립적인 ‘몸’이 원문의 감각을 잘 살립니다.
- source_word: διαφερόμενον
  english_pob_choice: being carried along
  chosen_korean: 떠밀려 갔고
  alternatives_korean:
  - 실려 갔고
  - 운반되었고
  - 떠다니며
  lexicon: BDAG
  rationale: 외력에 의해 이리저리 끌려가는 상태를 나타내므로, 수동성과 비극성을 살린 ‘떠밀려 갔고’가 가장 자연스럽습니다.
- source_word: ἐν ὕβρει πολλῇ
  english_pob_choice: with great indignity
  chosen_korean: 큰 모욕 속에서
  alternatives_korean:
  - 큰 치욕 속에서
  - 심한 모욕으로
  - 큰 폭행 속에서
  lexicon: BDAG
  rationale: ὕβρις는 단순한 무례를 넘어 수치스럽고 모욕적인 학대를 포함하므로, ‘큰 모욕 속에서’가 본문의 수치를 잘 전달합니다.
- source_word: ὁ θάπτων
  english_pob_choice: bury him
  chosen_korean: 장사할 사람
  alternatives_korean:
  - 묻을 사람
  - 매장할 사람
  - 장례를 치를 사람
  lexicon: LSJ
  rationale: θάπτων은 장사를 집행하는 사람을 뜻하므로, 한국어에서 자연스럽고 장례의 결핍을 드러내는 ‘장사할 사람’으로 옮겼습니다.
theological_decisions:
- issue: 무덤 없는 죽음의 수치 표현
  chosen_reading: 원문이 강조하는 것은 단순한 죽음이 아니라, 바다 위에서 떠밀리며 장사도 받지 못하는 수치와 버려짐입니다.
  alternative_readings:
  - 단순히 ‘죽은 몸’으로 완화할 수 있음
  - ‘장사할 사람도 없었습니다’를 일반적 장례 부재로 약화시킬 수 있음
  rationale: ὕβρις와 ὁ θάπτων의 결합은 고대 근동/유대 문맥에서 장례 거부가 지닌 수치와 모욕을 드러내므로, 이를 약화하지 않고 보존했습니다.
  doctrine_reference: 장례와 수치의 사회적 의미에 대한 성경적 맥락
- issue: 동사의 시상과 장면성
  chosen_reading: ‘떠밀려 갔고’로 과거 사건의 진행성과 결과를 함께 살렸습니다.
  alternative_readings:
  - ‘떠밀려 있었습니다’처럼 상태로만 처리
  - ‘떠밀려 가고 있었습니다’처럼 진행만 강조
  rationale: 분사 διαφερόμενον의 지속적 장면과 뒤이은 결과를 함께 보여 주기 위해, 한국어에서는 완료형과 연결형을 조합해 옮겼습니다.
  doctrine_reference: 서사적 시상 표현
