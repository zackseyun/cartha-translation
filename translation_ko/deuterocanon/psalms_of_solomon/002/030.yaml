source:
  edition: lxx-swete-1909
  text: καὶ οὐκ ἐχρόνισα ἕως ἔδειξέ μοι ὁ θεὸς τὴν ὕβριν αὐτοῦ, ἐκκενεκεντημένον ἐπὶ τῶν ὀρέων Αἰγύπτου, ὑπὲρ ἐλάχιστον ἐξουδενωμένον ἐπὶ γῆς καὶ θαλάσσης·
  language: Greek
  pages:
  - 790
  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/030.yaml
  text: And I did not delay until God showed me his insolence[a], pierced through on the mountains of Egypt[d][c][b], utterly despised on land and sea.
  footnotes:
  - marker: a
    text: Or 'his insolence' or 'his outrage' for 'his arrogance' (τὴν ὕβριν αὐτοῦ).
    reason: lexical_alternative
  - marker: b
    text: Literally 'pierced through on the mountains of Egypt'; the line vividly depicts the oppressor's violent downfall.
    reason: lexical_alternative
  - marker: c
    text: 'The Greek is compressed: ''made more despised than the least on land and sea.'' ''Person'' is supplied in English for clarity.'
    reason: lexical_alternative
  - marker: d
    text: Or 'And I did not have to wait long until God showed me his arrogance, pierced through on the mountains of Egypt, made more despised than the least person on land and sea.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 하나님께서 내게 그의 오만을 보여 주실 때까지 나는 지체하지 않았습니다. 그는 이집트의 산들에서 꿰뚫린 채로, 땅과 바다에서 가장 작은 자보다도 더 멸시를 받았습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ὕβρις는 단순한 ‘무례함’보다 더 강한 ‘오만’ 또는 ‘인간을 짓밟는 교만’을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘이집트의 산들 위에서 꿰뚫린 채로’입니다.
    reason: source_note
  - marker: c
    text: 그리스어는 압축되어 있어 ‘가장 작은 자보다도 더’라는 비교를 드러냅니다.
    reason: lexical_alternative
  - marker: d
    text: 이 문장은 공개적 수치와 폭력적 몰락을 함께 그려, 대적에 대한 하나님의 심판을 강조합니다.
    reason: theological_note
lexical_decisions:
- source_word: οὐκ ἐχρόνισα
  english_pob_choice: I did not delay
  chosen_korean: 나는 지체하지 않았습니다
  alternatives_korean:
  - 나는 오래 기다리지 않았습니다
  - 나는 머뭇거리지 않았습니다
  lexicon: LSJ
  rationale: 동사의 기본 뜻인 ‘지체하다, 늦어지다’를 살려 자연스러운 현대문으로 옮겼습니다.
- source_word: τὴν ὕβριν αὐτοῦ
  english_pob_choice: his insolence / his arrogance
  chosen_korean: 그의 오만
  alternatives_korean:
  - 그의 불손
  - 그의 무례함
  - 그의 교만
  lexicon: LSJ
  rationale: ὕβρις의 핵심은 과도한 자기과시와 타인을 짓밟는 오만에 있으므로, 문맥상 가장 직접적인 한국어로 ‘오만’을 택했습니다.
- source_word: ἐκκενεκεντημένον
  english_pob_choice: pierced through
  chosen_korean: 꿰뚫린 채로
  alternatives_korean:
  - 찔린 채로
  - 관통된 채로
  - 창에 꿰뚫린 채로
  lexicon: LSJ
  rationale: 폭력적 피격을 분명히 하되, 원문이 도구를 특정하지 않으므로 ‘꿰뚫린 채로’로 옮겼습니다.
- source_word: ὑπὲρ ἐλάχιστον ἐξουδενωμένον
  english_pob_choice: utterly despised / made more despised than the least person
  chosen_korean: 가장 작은 자보다도 더 멸시를 받았습니다
  alternatives_korean:
  - 최소한의 자보다도 더 천대를 받았습니다
  - 아무보다도 더 멸시를 받았습니다
  lexicon: LSJ
  rationale: 그리스어의 비교 표현을 살려 ‘가장 작은 자보다도 더’로 옮기고, ἐξουδενωμένον은 ‘멸시를 받다’로 처리해 수치를 드러냈습니다.
theological_decisions:
- issue: 폭력적 심판 이미지의 보존
  chosen_reading: 원문의 ‘꿰뚫린 채로’와 ‘멸시를 받았습니다’를 유지하여, 하나님이 대적의 몰락을 드러내시는 강한 심판 이미지를 살렸습니다.
  alternative_readings:
  - 완곡하게 ‘무너진 채로’로 약화시키는 읽기
  - 단순히 ‘죽은 채로’로 일반화하는 읽기
  rationale: 본문은 단순한 패배가 아니라 공개적 수치와 폭력적 몰락을 함께 제시하므로, 이미지의 강도를 보존하는 것이 source-faithful 합니다.
  doctrine_reference: 시편적 심판 표상 / 원수의 공개적 수치
- issue: ‘가장 작은 자보다도 더’의 비교 구조
  chosen_reading: 비교 대상을 한국어로 명시해, 원문의 압축된 비교를 해명하되 의미를 축소하지 않았습니다.
  alternative_readings:
  - ‘지극히 멸시를 받아’처럼 비교를 풀어 없애는 읽기
  - ‘아주 천대받아’로 일반화하는 읽기
  rationale: 그리스어의 압축을 그대로 두면 의미가 흐려지므로, 비교 구조를 드러내는 방식이 가장 정확합니다.
  doctrine_reference: 문법-의미 보존 원칙
