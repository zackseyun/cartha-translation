  text: and to show mercy to the righteous from the humiliation of the sinner[c][b][a], and to repay the sinner for what he did to the righteous.
  footnotes:
  - marker: a
    text: Or 'to have mercy on the righteous from the humiliation of the sinner.' The Greek is compressed; the main text makes explicit the likely sense of deliverance implied by the construction.
    reason: lexical_alternative
  - marker: b
    text: '''Humiliation'' may also be rendered ''affliction,'' ''abasement,'' or ''oppression.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'and to show mercy to the righteous by rescuing him from the humiliation inflicted by the sinner, and to repay the sinner for what he did to the righteous.'.
    reason: previous_rendering
translation:
  language: ko
  text: 또 죄인의 굴욕에서 의인에게 긍휼을 베푸시고, 죄인이 의인에게 행한 일에 따라 그 죄인에게 갚으십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘죄인의 굴욕’은 문맥상 죄인이 의인에게 가한 굴욕을 가리킬 수 있습니다. ‘굴욕’은 ‘낮아짐’, ‘비천하게 됨’, 또는 ‘압박’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
