  lexicon: BDAG
  rationale: 재보응의 의미를 살리되, 한국어에서 문맥상 이해하기 쉬운 ‘갚아 주다’로 옮겼습니다.
theological_decisions:
- issue: 죄인과 의인의 대조적 보응 구조
  chosen_reading: 하나님이 의인을 죄인의 수치로부터 긍휼히 여기시고, 죄인에게는 의인에게 행한 바에 따라 갚으신다는 재보응의 평행 구조를 그대로 드러냈습니다.
  alternative_readings:
  - 의인을 죄인의 굴욕에서 구원하시는 뜻으로 풀어 쓰는 해석
  - 보다 완곡하게 ‘불쌍히 여기다’보다 ‘자비를 베풀다’로 일반화하는 해석
  rationale: 헬라어 본문은 압축된 평행법으로 심판과 긍휼을 함께 말하므로, 해석적 확장을 최소화하고 양쪽 대구를 보존했습니다.
  doctrine_reference: 시편적 보응/심판 전통, 잠언적 의인-악인 대조
