  text: 또 의인을 죄인의 수치로부터 불쌍히 여기시고, 죄인이 의인에게 행한 것에 따라 죄인에게 갚아 주시는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘수치’는 여기서 단순한 감정보다, 죄인이 의인을 낮추고 모욕한 상태를 가리킬 수 있습니다.
