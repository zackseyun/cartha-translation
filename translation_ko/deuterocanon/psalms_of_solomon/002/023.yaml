translation:
  language: ko
  text: 그녀의 아름다움은 치욕 속에서 땅에 내던져졌습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불명예 속에서’, ‘수치 가운데서’.
    reason: lexical_alternative
  - marker: b
    text: 여성형 ‘그녀’는 문맥의 여성형 선행사, 아마도 의인화된 도시를 가리키는 것으로 보입니다.
    reason: cross_reference
  - marker: c
    text: 또는 ‘그녀의 아름다움은 내던져졌습니다’.
    reason: previous_rendering
lexical_decisions:
- source_word: ἐν ἀτιμίᾳ
  english_pob_choice: in disgrace
  chosen_korean: 치욕 속에서
  alternatives_korean:
  - 불명예 속에서
  - 수치 가운데서
  - 치욕 가운데서
  lexicon: BDAG
  rationale: ἀτιμία는 공개적 수치와 불명예를 가리키므로, '치욕'이 그 사회적 수치감을 자연스럽게 드러냅니다.
- source_word: τὸ κάλλος αὐτῆς
  english_pob_choice: beauty
  chosen_korean: 그녀의 아름다움
  alternatives_korean:
  - 그녀의 미
  - 그녀의 화려함
  - 그녀의 영광
  lexicon: LSJ
  rationale: κάλλος의 직접적인 의미는 아름다움이며, 한국어에서는 '아름다움'이 가장 직역에 가깝고 문맥상 도시의 의인화된 상태도 살릴 수 있습니다.
- source_word: ἀπερρίφη
  english_pob_choice: was thrown / was cast
  chosen_korean: 내던져졌습니다
  alternatives_korean:
  - 던져졌습니다
  - 내팽개쳐졌습니다
  - 내리던져졌습니다
  lexicon: LSJ
  rationale: 수동형의 ‘던져짐’을 살리되, 시편적 문맥의 강한 굴욕감을 표현하기 위해 '내던져졌습니다'를 택했습니다.
- source_word: ἐπὶ τὴν γῆν
  english_pob_choice: to the ground
  chosen_korean: 땅에
  alternatives_korean:
  - 땅으로
  - 땅바닥에
  - 지면에
  lexicon: BDAG
  rationale: 도착·이동을 나타내는 전치사구이므로 한국어에서는 자연스럽게 '땅에'로 옮겼습니다.
theological_decisions:
- issue: 의인화된 여성 지시 대상
  chosen_reading: 여성 대명사 '그녀'를 유지해 도시가 의인화된 대상임을 드러냈습니다.
  alternative_readings:
  - '''그것의 아름다움''처럼 비인칭화하기'
  - 도시명으로 바꿔 번역하기
  rationale: 영어 POB 주석이 여성형 선행사를 가리키며 아마도 의인화된 도시라고 설명하므로, 한국어에서도 인칭 의인화를 유지하는 편이 본문의 수사와 감정선을 보존합니다.
  doctrine_reference: 문학적 의인화와 시적 수사
