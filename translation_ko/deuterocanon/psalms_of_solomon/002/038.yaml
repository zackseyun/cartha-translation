translation:
  language: ko
  text: 의인과 죄인을 구별하고, 죄인들에게 그들의 행위에 따라 영원히 갚아 주시려는 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구별하고’는 “나누고” 또는 “분별하고”로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: “영원히”는 문자적으로는 “한 시대/한 세대(=for the age)”에 가까우며, 여기서는 지속적·영구적 의미로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ διαστεῖλαι ἀνὰ μέσον
  english_pob_choice: to distinguish between
  chosen_korean: 구별하고
  alternatives_korean:
  - 나누고
  - 분별하고
  - 구별하여
  lexicon: BDAG
  rationale: 판결적 맥락에서 두 부류를 명확히 가려내는 의미이므로, 공간적 분리를 강하게 드러내는 표현보다 ‘구별하다’가 원문의 판별·구분 의미를 자연스럽게 살립니다.
- source_word: δικαίου καὶ ἁμαρτωλοῦ
  english_pob_choice: the righteous and the sinner
  chosen_korean: 의인과 죄인
  alternatives_korean:
  - 의로운 사람과 죄인
  - 의인과 악인
  lexicon: BDAG
  rationale: 헬라어 단수는 대표적·보편적 범주를 가리키므로, 한국어에서도 개인 한 사람보다 범주 대비를 살린 ‘의인과 죄인’이 원문에 가장 가깝습니다.
- source_word: ἀποδοῦναι
  english_pob_choice: repay
  chosen_korean: 갚아 주시려는
  alternatives_korean:
  - 보응하시려는
  - 되갚으시려는
  - 갚으려는
  lexicon: BDAG
  rationale: 심판 맥락에서 행위에 상응하는 보상을 뜻하므로 ‘갚다’가 핵심을 살리고, 문맥상 주어를 보충해 한국어 문장을 자연스럽게 만들었습니다.
- source_word: εἰς τὸν αἰῶνα
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 한 세대 동안
  - 그 시대까지
  - 영세토록
  lexicon: BDAG
  rationale: 이 구는 지속성을 나타내며, POB의 ‘forever’에 대응하는 현대 한국어로는 ‘영원히’가 가장 직관적입니다.
theological_decisions:
- issue: 보응의 성격
  chosen_reading: 죄인들에게 그들의 행위에 따라 영원히 갚아 주시는 심판적 보응으로 옮겼습니다.
  alternative_readings:
  - 단순한 상벌의 원리로 완화하여 번역
  - ‘보상하다’로 중립화
  rationale: 문맥이 의인과 죄인을 가르는 판단 장면이므로, 단순 보상보다 죄에 대한 재판적 응답이라는 긴장을 유지하는 것이 원문에 충실합니다.
  doctrine_reference: 심판과 행위에 따른 보응
- issue: 단수 범주의 처리
  chosen_reading: ‘의인’과 ‘죄인’을 개인 남성 1인으로 읽지 않고 범주적 대비로 번역했습니다.
  alternative_readings:
  - 의로운 사람과 죄인
  - 의로운 자와 죄인
  rationale: 원문의 단수는 일반화된 유형을 가리키므로, 한국어에서도 성별·개별성을 부각하지 않고 범주적 대비를 유지하는 편이 원뜻을 더 정확히 전달합니다.
  doctrine_reference: 대표적 단수와 범주적 표현
