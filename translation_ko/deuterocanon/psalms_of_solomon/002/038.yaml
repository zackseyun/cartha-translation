  text: τοῦ διαστεῖλαι ἀνὰ μέσον δικαίου καὶ ἁμαρτωλοῦ, ἀποδοῦναι ἁμαρτωλοῖς εἰς τὸν αἰῶνα κατὰ τὰ ἔργα αὐτῶν·
