theological_decisions:
- issue: 첫 절의 난해한 동사 δηλόω를 어떻게 처리할지
  chosen_reading: 본문의 표면적 의미인 ‘알려 주셨습니다’를 유지하되, 전체 문맥상 다소 이례적인 표현이라는 긴장을 그대로 남겼습니다.
  alternative_readings:
  - 그들의 기억을 없애셨습니다
  - 그들의 기억을 드러내셨습니다
  rationale: 본문은 명백한 소거 표현이 아니라 ‘알리다/드러내다’ 계열의 동사를 사용하므로, 문맥적 추정을 앞세워 의미를 바꾸기보다 원문의 난해함을 보존하는 쪽이 적절합니다.
  doctrine_reference: 'Translation philosophy #3 (preserve theological tension rather than resolve it)'
- issue: 하나님의 공정한 심판을 어떻게 표현할지
  chosen_reading: ‘의로운 재판관’과 ‘사람의 낯을 보아 주지 않으십니다’로 옮겨, 공평한 심판과 편파 없음의 뜻을 분명히 했습니다.
  alternative_readings:
  - 의로운 판관
  - 편파하지 않으십니다
  rationale: 문맥상 하나님의 न्याय적 성격을 드러내는 진술이므로, 현대 한국어에서 바로 이해되는 법정 언어를 사용했습니다.
