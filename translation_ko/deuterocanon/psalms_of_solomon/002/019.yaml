translation:
  language: ko
  text: 당신은 그들의 기억을 땅에서 알려 주셨습니다[a]. 하나님은 의로운 재판관이시며, 사람의 낯을 보아 주지 않으십니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 동사 ἐδήλωσας는 문자적으로는 ‘알리셨습니다/드러내셨습니다’에 가깝습니다. 본문은 이례적이어서 번역상 긴장이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 헬라어 γῆ는 ‘땅’ 또는 ‘땅, 곧 땅의 영역/세상’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘낯을 놀라워하지 않다’는 관용구로, 재판에서 편파를 보이지 않는다는 뜻입니다.
    reason: lexical_alternative
