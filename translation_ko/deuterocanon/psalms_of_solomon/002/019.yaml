    reason: lexical_alternative
  - marker: b
    text: 헬라어 γῆ는 ‘땅’ 또는 ‘세상/땅의 영역’을 뜻할 수 있습니다. 전치사 ἀπό는 문자적으로 ‘~로부터’를 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘얼굴을 놀라워하지 않으실 것이다’입니다. 이는 재판에서 사람의 외모나 지위를 따라 편파적으로 대하지 않는다는 뜻의 관용구입니다.
