translation:
  language: ko
  text: 그들의 분노를 우리에게 약탈 속에서 쏟아 내시고, 하나님, 지체하지 마시고 그들에게 그들의 머리 위로 갚아 주십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘약탈 속에서’는 직역을 풀어 옮긴 것으로, 헬라어의 압축된 표현은 ‘약탈하며/약탈로’라는 뜻도 될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘그들의 머리 위로’는 보복이 가해자 자신에게 되돌아간다는 관용구입니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἐκχέαι
  english_pob_choice: to pour out
  chosen_korean: 쏟아 내시고
  alternatives_korean:
  - 부어 내시고
  - 쏟으시고
  lexicon: BDAG
  rationale: 그림처럼 ‘쏟아 붓는’ 동작을 살리면서, 한국어에서도 분노가 대상 위에 강하게 덮치는 이미지를 자연스럽게 전달합니다.
- source_word: ὀργὴ
  english_pob_choice: wrath
  chosen_korean: 분노
  alternatives_korean:
  - 진노
  - 노여움
  lexicon: BDAG
  rationale: 여기서는 심판적 격노를 가리키지만, 시적 기도문 맥락에서 ‘분노’가 과도한 교회어조를 덜고 원문의 강도를 충분히 보존합니다.
- source_word: ἐν ἁρπάγματι
  english_pob_choice: in plundering
  chosen_korean: 약탈 속에서
  alternatives_korean:
  - 약탈하며
  - 약탈로
  - 노략질 속에서
  lexicon: LSJ
  rationale: 직역하면 난해한 구절이므로, POB의 ‘plundering’ 해석을 따라 그들의 분노가 ‘약탈 행위 가운데’ 드러난다는 뜻을 살려 자연스럽게 옮겼습니다.
- source_word: χρονίσῃς
  english_pob_choice: do not delay
  chosen_korean: 지체하지 마시고
  alternatives_korean:
  - 늦추지 마시고
  - 머뭇거리지 마시고
  lexicon: BDAG
  rationale: 하나님께 드리는 간구로서 현대 한국어의 공손한 부정 명령형을 사용해 ‘지체 없이’ 응답해 달라는 의미를 분명히 했습니다.
- source_word: ἀποδοῦναι αὐτοῖς εἰς κεφαλάς
  english_pob_choice: to repay them on their own heads
  chosen_korean: 그들에게 그들의 머리 위로 갚아 주십시오
  alternatives_korean:
  - 그들의 머리로 보응해 주십시오
  - 그 머리 위에 되갚아 주십시오
  lexicon: BDAG
  rationale: ‘머리 위로’는 히브리-헬라어의 보복 관용구를 살린 표현이며, POB의 retribution sense를 유지하면서도 한국어로 자연스럽게 읽히도록 했습니다.
theological_decisions:
- issue: 보복 관용구의 직설성
  chosen_reading: 원문의 ‘머리 위로’ 관용구를 유지해, 악인에게 되돌아가는 응보를 분명하게 표현했습니다.
  alternative_readings:
  - ‘그들에게 벌을 내려 주십시오’처럼 완화할 수 있습니다.
  - ‘그들 위에 갚아 주십시오’로 더 일반화할 수 있습니다.
  rationale: 이 구절은 공격자에게 돌아가는 응보를 기도하는 문맥이므로, 이를 도덕적 일반론으로 완화하지 않고 원문의 강한 재보응 이미지를 살렸습니다.
  doctrine_reference: 시편적 탄원과 응보 기도 전통
