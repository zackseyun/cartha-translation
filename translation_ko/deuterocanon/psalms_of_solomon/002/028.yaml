  yaml_path: translation/deuterocanon/psalms_of_solomon/002/028.yaml
  text: to pour out their wrath on us in plundering[a]. And do not delay, O God, to repay them on their own heads[b],
  footnotes:
  - marker: a
    text: Or 'with plundering'; the Greek phrase is compact and may describe violent despoiling.
    reason: lexical_alternative
  - marker: b
