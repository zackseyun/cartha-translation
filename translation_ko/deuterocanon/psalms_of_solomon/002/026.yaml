base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/026.yaml
  text: And they will be brought to an end[a], unless you, Lord[b], rebuke them in your wrath.
  footnotes:
  - marker: a
    text: Or 'will be finished off' or 'will be destroyed' for 'will be brought to an end' (συντελεσθήσονται).
    reason: lexical_alternative
  - marker: b
    text: Or 'And they will be brought to an end, unless you, Lord, rebuke them'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그들은 끝장날 것입니다[a]. 주님, 당신께서 진노 가운데 그들을 꾸짖지 않으시면 그렇게 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘끝이 날 것입니다’나 ‘멸망할 것입니다’로도 옮길 수 있습니다(συντελεσθήσονται).
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  english_pob_choice: And
  chosen_korean: 그리고
  alternatives_korean:
  - 그리고 나서
  - 또
  lexicon: LSJ
  rationale: 앞 절과의 단순 연결을 살려 불필요한 시간적·논리적 추가 의미를 넣지 않기 위해 ‘그리고’로 옮겼습니다.
- source_word: συντελεσθήσονται
  english_pob_choice: will be brought to an end
  chosen_korean: 끝장날 것입니다
  alternatives_korean:
  - 끝이 날 것입니다
  - 마감될 것입니다
  - 멸망할 것입니다
  lexicon: LSJ
  rationale: 완결/종결의 수동적 뜻을 살리면서도 이 문맥의 심판적·파국적 뉘앙스를 한국어로 자연스럽게 드러내기 위해 선택했습니다.
- source_word: ἐπιτιμήσεις
  english_pob_choice: rebuke
  chosen_korean: 꾸짖지 않으시면
  alternatives_korean:
  - 꾸짖지 않으시면
  - 책망하지 않으시면
  - 엄히 꾸짖지 않으시면
  lexicon: LSJ
  rationale: 하나님의 권위 있는 책망을 나타내는 동사로 ‘꾸짖다’가 가장 직접적이며, 조건절의 부정형으로 자연스럽게 구성했습니다.
- source_word: ἐν ὀργῇ σου
  english_pob_choice: in your wrath
  chosen_korean: 진노 가운데
  alternatives_korean:
  - 당신의 진노 가운데
  - 분노 가운데
  - 진노로
  lexicon: LSJ
  rationale: ὀργή의 사법적·엄중한 성격을 살리기 위해 ‘진노’를 유지했고, 한국어 표현으로는 ‘~가운데’가 상태·영역을 무리 없이 전달합니다.
theological_decisions:
- issue: 문장 속 주어가 헬라어에 명시되지 않은 점
  chosen_reading: 주어를 덧붙이지 않고 ‘그들은’으로 두어 본문이 말하는 불특정/전후 문맥 의존의 대상을 그대로 살렸습니다.
  alternative_readings:
  - ‘이스라엘은’으로 명시
  - ‘그 민족들은’로 명시
  rationale: 이 절의 헬라어는 명시적 주어가 없으므로, 본문 자체보다 앞선 해석을 본문에 삽입하지 않도록 했습니다. 전후 문맥에서 지시 대상을 추적하게 두는 편이 원문에 가깝습니다.
  doctrine_reference: 문맥 우선 원칙, 본문 충실성
- issue: 직설적 경고문의 어조
  chosen_reading: ‘끝장날 것입니다… 꾸짖지 않으시면’으로 심판적 긴장감을 유지했습니다.
  alternative_readings:
  - ‘끝이 날 것입니다…’
  - ‘멸망할 것입니다…’
  rationale: 시편의 탄원/심판 언어를 약화시키지 않기 위해 완곡화를 피하고, 원문의 단호한 경고성을 살렸습니다.
  doctrine_reference: 심판 선언의 수위 보존
