revisions:
- from: 그리고 그들은 끝장날 것입니다[a]. 주님, 당신께서 진노 가운데 그들을 꾸짖지 않으시면 그렇게 됩니다.
  to: 그리고 주님께서 진노하여 그들을 꾸짖지 않으시면, 그들은 끝을 맞게 될 것입니다[a].
  rationale: 명시되지 않은 주어는 ‘그들은’으로 보존하여 선행 문맥에 따른 지시의 여지를 남겼습니다. συντελεσθήσονται는 ‘끝을 맞게 될 것입니다’로 옮겨 종결의 의미와 파국적 문맥을 유지하되 ‘끝장나다’의 구어적 과장을 피했습니다. ἐν ὀργῇ σου는 ‘진노하여’로 자연스럽게 반영했고, 조건절과 결과절을 한 문장으로 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:09:40Z'
review_pass:
  verdict: revise
  source_fidelity: 그리스어의 무표지 주어를 ‘그들은’으로 유지한 점과 ἐὰν μὴ의 조건·예외 관계를 살린 점은 적절합니다. 다만 ‘끝장나다’는 συντελεσθήσονται의 수동적 종결 의미보다 구어적이고 단정적인 파국의 뉘앙스를 더하며, ‘진노 가운데’는 한국어로 다소 부자연스럽습니다.
  naturalness: 현대 한국어 합쇼체에서 조건절을 앞에 두고 ‘진노하여 … 꾸짖지 않으시면’으로 표현하면 자연스럽고, 한 문장으로 원문의 긴밀한 조건 관계도 드러납니다.
  terminology: ‘주님’, ‘진노’, ‘꾸짖다’는 기도·심판 문맥 및 핵심 용어에 적합합니다. ‘끝을 맞게 될 것입니다’는 과도하게 구어적인 ‘끝장날 것입니다’보다 문어적이고 절제된 표현입니다.
  issues:
  - severity: medium
    issue: ‘끝장날 것입니다’의 어조
    rationale: ‘끝장나다’는 현대 구어에서 매우 강하고 다소 속된 종결 표현입니다. συντελεσθήσονται는 ‘끝에 이르게 되다/종결되다’라는 수동적 의미이므로, 원문의 의미를 보존하면서 문체를 맞추려면 더 중립적인 표현이 적절합니다.
  - severity: low
