    rationale: ἐν ὀργῇ σου는 하나님의 진노 속에서 혹은 진노하여 행하는 꾸짖음을 뜻합니다. ‘진노하여’가 한국어에서 이 방식·상태를 더 자연스럽게 전달합니다.
  - severity: low
    issue: 조건절을 별도 문장으로 분리함
    rationale: 초안도 의미는 전달하지만, 원문은 ‘그들이 끝에 이르게 됨’과 ‘주님의 진노 어린 꾸짖음’의 조건 관계를 한 문장 안에 결속합니다. 이를 유지하는 편이 더 직접적입니다.
  revised_text: 그리고 주님께서 진노하여 그들을 꾸짖지 않으시면, 그들은 끝을 맞게 될 것입니다[a].
