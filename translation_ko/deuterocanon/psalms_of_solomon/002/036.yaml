id: PSS.2.36
reference: Psalms of Solomon 2:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: lxx-swete-1909
  text: καὶ νῦν ἴδετε, οἱ μεγιστᾶνες τῆς γῆς, τὸ κρίμα τοῦ κυρίου ὅτι μέγας βασιλεὺς καὶ δίκαιος, κρίνων τὴν ὑπʼ οὐρανόν.
  language: Greek
  pages:
  - 791
  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/036.yaml
  text: And now see[a], you nobles of the earth, the judgment of the Lord, that he is a great and righteous king[b], judging what is under heaven.
  footnotes:
  - marker: a
    text: Or "great men," "magnates," or "rulers."
    reason: lexical_alternative
  - marker: b
    text: More literally, "judging the under-heaven [realm]"; alternatively, "judging the earth under heaven" or "the world under heaven."
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 보십시오, 땅의 귀인들아[a], 주님의 심판을. 주님은 위대하고 의로운 왕이시며, 하늘 아래 있는 것을[b] 심판하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘귀인들’, ‘권세자들’, ‘유력자들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 더 문자적으로는 ‘하늘 아래 있는 것[들]을 심판하시는’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μεγιστᾶνες τῆς γῆς
  english_pob_choice: you nobles of the earth
  chosen_korean: 땅의 귀인들아
  alternatives_korean:
  - 땅의 권세자들아
  - 땅의 유력자들아
  - 땅의 윗사람들아
  lexicon: BDAG
  rationale: μεγιστᾶνες는 지위가 높은 지도층을 가리키므로, 직접 호소형을 살리면서도 사회적 위상을 드러내는 ‘귀인들’이 가장 자연스럽습니다.
- source_word: ἴδετε
  english_pob_choice: see
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 살펴보십시오
  - 보아라
  lexicon: BDAG
  rationale: 청자에게 즉시 주의를 돌리라는 명령형이므로, 현대 합쇼체에서 직접적이고 자연스러운 ‘보십시오’로 옮겼습니다.
- source_word: τὸ κρίμα τοῦ κυρίου
  english_pob_choice: the judgment of the Lord
  chosen_korean: 주님의 심판
  alternatives_korean:
  - 주님의 판결
  - 주님의 재판
  - 주님의 판단
  lexicon: BDAG
  rationale: κρίμα는 여기서 주님의 사법적 행위와 선고를 가리키므로, 가장 넓고 분명한 ‘심판’이 적절합니다.
- source_word: μέγας βασιλεὺς καὶ δίκαιος
  english_pob_choice: a great and righteous king
  chosen_korean: 위대하고 의로운 왕이시며
  alternatives_korean:
  - 크고 의로운 왕이시며
  - 위대하신 의로운 왕이시며
  - 위대하고 공의로운 왕이시며
  lexicon: BDAG
  rationale: 두 형용사가 βασιλεύς를 수식하므로, 한국어에서도 병렬로 살려 왕의 위엄과 도덕적 정당성을 함께 드러냈습니다.
- source_word: κρίνων τὴν ὑπʼ οὐρανόν
  english_pob_choice: judging what is under heaven
  chosen_korean: 하늘 아래 있는 것을 심판하십니다
  alternatives_korean:
  - 하늘 아래 있는 세상을 심판하십니다
  - 하늘 아래 있는 땅을 심판하십니다
  - 하늘 아래 있는 세계를 심판하십니다
  lexicon: BDAG
  rationale: τὴν ὑπʼ οὐρανόν은 생략된 영역 표현이므로, 본문의 범위를 유지하면서도 문맥상 자연한 ‘하늘 아래 있는 것’으로 옮겼습니다.
theological_decisions:
- issue: ὅτι 절의 관계를 한국어로 어떻게 드러낼지
  chosen_reading: ‘그분은 … 왕이시며’로 옮겨, 앞절의 ‘주님의 심판’을 근거로 이어지게 했습니다.
  alternative_readings:
  - ‘그분이 … 왕이시라는 것입니다’
  - ‘왜냐하면 그분은 … 왕이시기 때문입니다’
  rationale: ὅτι의 설명적·내용적 기능을 살리되, 한국어 문맥에서는 진술문으로 자연스럽게 이어 주는 편이 더 직접적입니다.
  doctrine_reference: 문맥 연속성과 원문의 설명 관계를 보존하는 번역 원칙
- issue: ‘하늘 아래 있는 것’의 범위를 얼마나 구체화할지
  chosen_reading: 구체 명사 없이 ‘하늘 아래 있는 것’을 유지했습니다.
  alternative_readings:
  - ‘하늘 아래 있는 땅’
  - ‘하늘 아래 있는 세상’
  rationale: 그리스어는 범위 표현이지 ‘땅/세상’이라는 명시적 단어를 쓰지 않으므로, 과도한 구체화를 피했습니다.
  doctrine_reference: 원문이 허용하는 범위를 넘지 않는 번역 원칙
