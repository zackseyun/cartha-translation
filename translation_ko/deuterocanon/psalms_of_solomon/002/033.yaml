  to: 그는 “나는 육지와 바다의 주인이 되겠습니다”라고 말하였으나, 하나님께서 위대하시고 그분의 큰 힘으로 강하신 것을 알지 못하였습니다.[a][b]
  rationale: 인간 화자의 지배 주장을 ‘주인’으로 자연스럽게 표현하고, 육지와 바다의 대조를 명확히 했습니다. 또한 하나님의 힘을 가리키는 소유 표현을 분명히 하여 의미상 혼동을 제거했습니다. 각주는 각각 해당 어휘 선택에 실제 대안을 제공하도록 정리했습니다.
