  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: lxx-swete-1909
  text: εἶπεν Ἐγὼ κύριος γῆς καὶ θαλάσσης ἔσομαι· καὶ οὐκ ἔγνω ὅτι ὁ θεὸς μέγας, κραταιὸς ἐν ἰσχύϊ αὐτοῦ τῇ μεγάλῃ.
  language: Greek
