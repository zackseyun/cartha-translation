base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/033.yaml
  text: He said[a], "I will be lord of land and sea," and he did not know that God is great[b], mighty in his great strength.
  footnotes:
  - marker: a
    text: Or "earth and sea."
    reason: lexical_alternative
  - marker: b
    text: Or "mighty in his great power."
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 “나는 육지와 바다의 주인이 되겠습니다”라고 말하였으나, 하나님께서 위대하시고 그분의 큰 힘으로 강하신 것을 알지 못하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “땅과 바다의 주인.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “그분의 큰 능력으로 강하신.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν Ἐγὼ κύριος
  english_pob_choice: He said, "I will be lord"
  chosen_korean: “나는 …의 주가 되겠습니다”
  alternatives_korean:
  - “나는 …의 주님이 되겠습니다”
  - “나는 …의 군주가 되겠습니다”
  lexicon: BDAG
  rationale: κύριος가 여기서는 하나님의 호칭이 아니라 인간의 오만한 지배 선언이므로, 위계적 지배를 드러내는 ‘주’로 옮겼습니다. 동사구는 한국어에서 자연스럽게 야망의 발화로 읽히도록 ‘되겠습니다’로 풀었습니다.
- source_word: γῆς καὶ θαλάσσης
  english_pob_choice: land and sea
  chosen_korean: 땅과 바다
  alternatives_korean:
  - 땅과 바다
  - 땅과 해양
  - 지상과 바다
  lexicon: BDAG
  rationale: 영어 POB의 각주가 보여주듯 γῆς는 ‘land/earth’의 여지가 있지만, 여기서는 바다와 대구를 이루는 지리적 표현이므로 한국어에서는 가장 직접적인 ‘땅과 바다’로 옮겼습니다.
- source_word: οὐκ ἔγνω
  english_pob_choice: he did not know
  chosen_korean: 그는 …을 알지 못하였습니다
  alternatives_korean:
  - 그는 …을 깨닫지 못하였습니다
  - 그는 …을 알지 못했습니다
  lexicon: BDAG
  rationale: 직역적이면서도 현대 한국어에서 자연스러운 부정 인식 표현인 ‘알지 못하였습니다’를 사용해, 단순한 무지가 아니라 오만 속의 영적 무지를 드러내도록 했습니다.
- source_word: κραταιὸς ἐν ἰσχύϊ αὐτοῦ τῇ μεγάλῃ
  english_pob_choice: mighty in his great strength
  chosen_korean: 자기의 큰 힘으로 능하시다는
  alternatives_korean:
  - 그의 큰 능력으로 강하시다는
  - 자기의 큰 권능으로 강하시다는
  - 자기의 큰 힘으로 힘이 세시다는
  lexicon: BDAG
  rationale: κραταιός와 ἰσχύς의 반복적 강세를 살리기 위해 ‘능하시다/큰 힘’의 조합을 택했습니다. 영어 POB의 ‘great strength’에 맞추어 ‘큰 힘’으로 유지하되, 한국어 술어로는 ‘능하시다’가 가장 품위 있고 자연스럽습니다.
theological_decisions:
- issue: ὁ θεὸς μέγας의 문법적 성격과 번역 톤
  chosen_reading: 하나님이 크시며
  alternative_readings:
  - 하나님은 크시며
  - 그 하나님이 크시며
  - 하나님이 위대하시며
  rationale: 본문은 하나님의 위대함을 단정하는 평서문이므로, 한국어에서도 과장 없이 직접적인 진술로 옮겼습니다. ‘크시며’는 이어지는 능력 묘사와도 연결됩니다.
  doctrine_reference: 시편적/지혜문학적 신정론 진술
- issue: ‘land and sea’의 번역을 ‘땅과 바다’로 둘지 ‘땅과 해’로 둘지
  chosen_reading: 땅과 바다
  alternative_readings:
  - 땅과 해
  - 땅과 해양
  - 지상과 바다
  rationale: 영어 POB 각주가 허용하는 ‘earth and sea’보다, 여기서는 통치 영역의 대조가 핵심이므로 한국어 독자는 ‘땅과 바다’를 가장 즉시 이해합니다.
  doctrine_reference: 시적 병행법
