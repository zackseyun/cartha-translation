  - marker: b
    text: A manuscript variant reads 'her' instead of 'his' ('the beauty of her glory').
    reason: textual_variant
  - marker: c
    text: Or '“Throw them far away from me; his glorious beauty did them no good.”'.
    reason: previous_rendering
translation:
  language: ko
  text: 이런 일들 때문에 그가 말했습니다. “그것들을 내게서 멀리 던져 버리십시오.” 그의 영광의 아름다움은 그들에게 아무 유익이 되지 못했습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘그의 영광의 아름다움은 그들에게 유익하지 않았습니다.’
    reason: lexical_alternative
  - marker: b
    text: 한 사본 변이는 남성/중성 소유대명사 대신 여성형 소유대명사를 읽어, ‘그녀의 영광의 아름다움’으로 번역할 수 있습니다.
    reason: textual_variant
