  yaml_path: translation/deuterocanon/psalms_of_solomon/002/004.yaml
  text: Because of these things he said[a], “Cast them far away from me[c][b]; the beauty of his glory did not prosper them.”
  footnotes:
  - marker: a
    text: Or, more literally, 'the beauty of his glory did not benefit them.'
    reason: lexical_alternative
  - marker: b
    text: A manuscript variant reads 'her' instead of 'his' ('the beauty of her glory').
    reason: textual_variant
  - marker: c
    text: Or '“Throw them far away from me; his glorious beauty did them no good.”'.
    reason: previous_rendering
translation:
  language: ko
  text: 이런 일들 때문에 그가 말했습니다[a]. “그것들을 내게서 멀리 던져 버리십시오.” 그의 영광의 아름다움은 그것들에게 아무 유익도 주지 못했습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘그의 영광의 아름다움은 그것들에게 유익을 주지 못했습니다.’
    reason: lexical_alternative
  - marker: b
    text: 사본 변이로 ‘her’가 있어 ‘그녀의 영광의 아름다움’으로 읽을 수 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἕνεκεν τούτων
  english_pob_choice: Because of these things
  chosen_korean: 이런 일들 때문에
  alternatives_korean:
  - 이 일들 때문에
  - 이러한 것들 때문에
  lexicon: BDAG
  rationale: 앞선 3절의 더러움과 연결되는 지시 표현이므로, 원문의 되짚어 가리키는 힘을 살려 자연스럽게 옮겼습니다.
- source_word: εἶπεν
  english_pob_choice: he said
  chosen_korean: 그가 말했습니다
  alternatives_korean:
  - 그가 선언했습니다
  - 그가 이르셨습니다
  lexicon: BDAG
  rationale: 평이한 발화 동사이므로 과장하지 않고 보존했습니다. 다만 한국어 서술체에 맞게 공손한 종결을 사용했습니다.
- source_word: Ἀπορρίψατε αὐτὰ μακρὰν ἀπ' ἐμοῦ
  english_pob_choice: Cast them far away from me
  chosen_korean: 그것들을 내게서 멀리 던져 버리십시오
  alternatives_korean:
  - 그것들을 내게서 멀리 내버리십시오
  - 그것들을 내게서 멀리 내쳐 버리십시오
  lexicon: BDAG
  rationale: ἀπορρίπτω의 ‘던져 버리다/내던지다’의 거절적 뉘앙스와 μακράν의 거리감을 함께 살렸습니다.
- source_word: τὸ κάλλος τῆς δόξης αὐτοῦ
  english_pob_choice: the beauty of his glory
  chosen_korean: 그의 영광의 아름다움
  alternatives_korean:
  - 그의 영광의 아름다움
  - 그 영광의 아름다움
  lexicon: BDAG
  rationale: κάλλος와 δόξα의 이중 미적·영광 표현을 한국어의 소유격 중첩으로 최대한 직역에 가깝게 보존했습니다.
theological_decisions:
- issue: 인용문의 범위와 뒤따르는 서술의 처리
  chosen_reading: “그것들을 내게서 멀리 던져 버리십시오.”로 인용을 끝내고, 뒤의 ‘그의 영광의 아름다움은…’은 서술로 처리했습니다.
  alternative_readings:
  - 뒤의 문장까지 모두 인용문 안에 포함
  - 인용을 더 짧게 끊어 번역
  rationale: 원문에서 명령문은 ἀπ' ἐμοῦ에서 끝나고, 그 뒤 절은 화자의 발화를 설명하는 서술로 읽는 것이 가장 자연스럽습니다. 영어 POB의 개정 취지도 이를 반영합니다.
  doctrine_reference: 문맥/화자 구분
