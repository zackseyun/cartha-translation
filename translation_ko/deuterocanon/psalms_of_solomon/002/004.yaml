theological_decisions:
- issue: 인용문의 범위와 뒤따르는 서술의 처리
  chosen_reading: “그것들을 내게서 멀리 던져 버리십시오.”로 인용을 끝내고, 뒤의 ‘그의 영광의 아름다움은…’은 서술로 처리했습니다.
  alternative_readings:
  - 뒤의 문장까지 모두 인용문 안에 포함
  - 인용을 더 짧게 끊어 번역
  rationale: 원문에서 명령문은 ἀπ' ἐμοῦ에서 끝나고, 그 뒤 절은 화자의 발화를 설명하는 서술로 읽는 것이 가장 자연스럽습니다. 영어 POB의 개정 취지도 이를 반영합니다.
  doctrine_reference: 문맥/화자 구분
