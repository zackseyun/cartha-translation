  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ἐν ἀτιμίᾳ의 부사적 용법은 ‘수치 가운데서’보다 ‘수치스럽게’가 한국어에서 더 자연스럽고, τὸ ὕστερον에 관한 각주 표지는 해당 표현 뒤에 있어야 합니다.
  naturalness: 합쇼체 문장은 자연스럽지만, ‘수치 가운데서 업신여겼습니다’는 현대 한국어에서 다소 어색하며 수치의 상태가 누구에게 속하는지 불필요하게 흐릴 수 있습니다. ‘수치스럽게 업신여겼습니다’가 간결하고 자연스럽습니다.
  terminology: ‘업신여겼습니다’는 ἐξουδένωσεν의 경멸적 의미를 잘 살립니다. ἄνθρωπος는 여기서 인간적·유한한 존재라는 함의를 지닐 수 있으므로 ‘한 사람’도 가능하나, ‘사람’이 더 자연스러운 현대 한국어입니다. τὸ ὕστερον은 해석을 확정하지 않도록 ‘그 뒤의 일’로 유지할 수 있습니다.
