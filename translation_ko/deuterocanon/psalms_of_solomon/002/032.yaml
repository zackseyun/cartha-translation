    reason: previous_rendering
lexical_decisions:
- source_word: ἐξουδένωσεν
  english_pob_choice: despised
  chosen_korean: 업신여겼습니다
  alternatives_korean:
  - 멸시했습니다
  - 하찮게 여겼습니다
  - 무시했습니다
  lexicon: BDAG
  rationale: 이 동사는 단순한 감정보다 상대를 낮추어 대하는 행위를 가리키므로, ‘업신여기다’가 ‘despised’의 경멸적 힘을 자연스럽게 살립니다.
- source_word: ἐν ἀτιμίᾳ
  english_pob_choice: with dishonor
  chosen_korean: 수치 가운데서
  alternatives_korean:
  - 불명예 가운데서
  - 치욕 가운데서
  - 수치스럽게
  lexicon: BDAG
  rationale: ἀτιμία는 ‘불명예’와 ‘수치’를 함께 떠올리게 하므로, 한국어에서는 관계를 부드럽게 풀어 ‘수치 가운데서’로 옮겨 경멸의 상태를 나타냈습니다.
- source_word: ἄνθρωπός ἐστιν
  english_pob_choice: that he was a man
  chosen_korean: 그가 한 사람임을
  alternatives_korean:
  - 그가 사람임을
  - 그가 인간임을
  lexicon: BDAG
  rationale: ἄνθρωπος의 단수형을 살리되, 한국어에서는 수사적 뉘앙스를 유지하면서도 현대 독자가 이해하기 쉬운 ‘한 사람’으로 옮겼습니다.
- source_word: τὸ ὕστερον
  english_pob_choice: the outcome
  chosen_korean: 그 뒤의 일
  alternatives_korean:
  - 그 이후
  - 마지막 결과
  - 결말
  lexicon: BDAG
  rationale: 이 표현은 뒤이어 일어날 사태나 결과를 가리킬 수 있어, 과도하게 해석하지 않고 시간적·결과적 여지를 남기는 ‘그 뒤의 일’로 번역했습니다.
