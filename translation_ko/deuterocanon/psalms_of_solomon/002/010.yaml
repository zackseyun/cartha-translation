base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/010.yaml
  text: And heaven was weighed down[a], and the earth abhorred them[b],
  footnotes:
  - marker: a
    text: The Zone 1 transcription reads ἐβαρύνθησενσεν, which appears to contain a duplicated ending; the translation follows the evident underlying form ἐβαρύνθησεν.
    reason: textual_variant
  - marker: b
    text: Or 'the sky grew heavy'.
    reason: previous_rendering
translation:
  language: ko
  text: 하늘은 무거워졌고[a], 땅은 그들을 혐오하였습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 어휘상 ‘무거워졌습니다’는 ‘무거워지다’의 직역에 가깝고, POB의 “was weighed down”에 해당합니다.
    reason: textual_variant
  - marker: b
    text: 다른 번역으로는 ‘그들을 미워하였습니다’가 가능하지만, ἐβδελύξατο의 더 강한 혐오감을 살리기 위해 ‘혐오하였습니다’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐρανός
  english_pob_choice: heaven
  chosen_korean: 하늘
  alternatives_korean:
  - 천
  - 천공
  lexicon: LSJ
  rationale: 시적 병행구에서 οὐρανός는 창조 세계의 한 축을 가리키므로, 한국어에서는 자연스러운 ‘하늘’로 옮기되 ‘땅’과의 대응을 살렸습니다.
- source_word: ἐβαρύνθησεν
  english_pob_choice: was weighed down
  chosen_korean: 무거워졌습니다
  alternatives_korean:
  - 무겁게 되었습니다
  - 눌렸습니다
  lexicon: LSJ
  rationale: ‘무거워지다’는 중량감이 더해지는 이미지를 직접 살리면서도, 영문 POB의 ‘weighed down’이 지닌 부담/침잠의 뉘앙스를 비교적 자연스럽게 반영합니다.
- source_word: ἐβδελύξατο
  english_pob_choice: abhorred
  chosen_korean: 혐오하였습니다
  alternatives_korean:
  - 역겨워하였습니다
  - 가증히 여겼습니다
  lexicon: LSJ
  rationale: 이 동사는 단순한 싫어함보다 강한 혐오·혐오감의 반응을 뜻하므로, 문학적이면서도 강도를 유지하는 ‘혐오하다’를 택했습니다.
theological_decisions:
- issue: ‘하늘과 땅’의 병행이 만드는 우주적/도덕적 반응의 유지
  chosen_reading: 자연 현상 묘사가 아니라, 죄에 대한 창조 세계의 도덕적 반응으로 읽히도록 ‘하늘은 무거워졌고, 땅은 그들을 혐오하였습니다’로 옮겼습니다.
  alternative_readings:
  - ‘하늘은 눌렸고, 땅은 그들을 미워하였습니다’처럼 완화된 번역
  - 기상 변화처럼 들리게 하는 번역
  rationale: 영문 POB의 수정 이력도 기상 암시를 피하고 ‘heaven and earth’의 관용적 병행을 보존하도록 이끕니다. 한국어에서도 동일한 우주적 심판 이미지를 유지하는 것이 본문 의도에 부합합니다.
  doctrine_reference: 창조 세계의 증언과 심판의 시적 의인화(시편적 표현)
