  text: καθὰ ἐποίουν αὐτοί, ἀπέναντι τοῦ ἡλίου παρεδειγμάτισαν ἀδικίας αὐτῶν. καὶ θυγατέρες Ἱερουσαλὴμ βέβηλοι κατὰ τὸ κρίμα σου,
  language: Greek
  pages:
  - 789
  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/014.yaml
  text: Just as they themselves used to do[a], they displayed their iniquities before the sun, and the daughters of Jerusalem were profane according to your judgment[d][c][b],
  footnotes:
  - marker: a
    text: Literally, 'before the sun'—that is, openly and publicly.
    reason: lexical_alternative
  - marker: b
    text: Or 'were defiled according to your judgment.'
    reason: lexical_alternative
  - marker: c
    text: Or 'As they did,'.
    reason: previous_rendering
  - marker: d
    text: Or 'injustices'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들이 자기들이 하던 것처럼, 자기들의 불의를 해처럼 앞에 드러냈습니다. 그리고 예루살렘의 딸들은 주님의 심판에 따라 더럽혀졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘해 앞에’입니다. 곧 드러나고 공개적인 상태라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주님의 판결에 따라 더럽혀졌습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὰ ἐποίουν αὐτοί
  english_pob_choice: As they themselves used to do
  chosen_korean: 그들이 자기들이 하던 것처럼
  alternatives_korean:
  - 그들 자신이 하던 대로
  - 그들이 하던 것과 같이
  lexicon: LSJ
  rationale: 비교 접속과 반복된 행위를 자연스러운 한국어로 살리되, 문장의 연결을 과도하게 풀지 않았습니다.
- source_word: παρεδειγμάτισαν
  english_pob_choice: put their iniquities on display
  chosen_korean: 불의를 ... 드러냈습니다
  alternatives_korean:
  - 불의를 ... 전시했습니다
  - 불의를 ... 공개했습니다
  lexicon: LSJ
  rationale: 공적인 노출과 수치를 드러내는 동사의 뉘앙스를 살리기 위해 ‘드러내다’를 택했습니다.
- source_word: ἀπέναντι τοῦ ἡλίου
  english_pob_choice: before the sun
  chosen_korean: 해처럼 앞에
  alternatives_korean:
  - 해 앞에
  - 해가 보는 앞에서
  lexicon: LSJ
  rationale: 문자적으로는 ‘해 앞에’이지만, 한국어에서는 공개적·가시적 의미를 살리기 위해 앞에 배치된 공개성 표현으로 옮겼습니다.
- source_word: βέβηλοι
  english_pob_choice: profane
  chosen_korean: 더럽혀졌습니다
  alternatives_korean:
  - 속되게 되었습니다
  - 속되게 취급되었습니다
  lexicon: LSJ
  rationale: 성스러움의 훼손과 부정함을 드러내는 말로 옮겼고, POB의 ‘profane’가 가리키는 종교적·도덕적 오염을 반영했습니다.
theological_decisions:
- issue: κατὰ τὸ κρίμα σου의 의미
  chosen_reading: ‘주님의 심판에 따라’로 옮겨, 그 상태가 하나님의 판결/심판과 연결된다는 점을 분명히 했습니다.
  alternative_readings:
  - ‘주님의 판결에 따라’
  - ‘주님의 정죄에 따라’
  rationale: κρίμα는 단순한 일반 판단보다 재판적·심판적 함의를 가지므로, 문맥상 심판을 선택하는 것이 자연스럽습니다.
  doctrine_reference: 하나님의 न्याय/심판 개념
