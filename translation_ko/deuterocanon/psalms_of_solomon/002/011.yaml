  terminology: ‘행하다’는 원문의 일반 동사 ἐποίησεν/ἐποίησαν을 문맥상 과도하게 해석하지 않고 일관되게 옮깁니다. 신학적 전문 용어 또는 고유명사 관련 문제는 없습니다.
