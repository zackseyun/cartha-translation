    reason: previous_rendering
translation:
  language: ko
  text: 이는 땅 위에서 어떤 사람도 그들이 행한 것과 같은 일을 행하지 않았기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면 …
  - …입니다
  lexicon: BDAG
  rationale: 앞절의 이유를 밝히는 접속으로 자연스럽게 옮기되, 문맥상 설명형 어조를 유지했습니다.
- source_word: οὐκ ἐποίησεν πᾶς ἄνθρωπος
  english_pob_choice: no man has done
  chosen_korean: 어떤 사람도 … 행하지 않았습니다
  alternatives_korean:
  - 아무도 … 하지 않았습니다
  - 모든 사람이 … 하지 않았습니다
  lexicon: BDAG
  rationale: 보편 부정의 뜻을 한국어에서 가장 자연스럽게 드러내면서도, 그리스어의 단수 일반명사 표현을 살렸습니다.
- source_word: ἐπ' αὐτῆς
  english_pob_choice: on it
  chosen_korean: 땅 위에서
  alternatives_korean:
  - 그 위에
  - 그것 위에서
  lexicon: BDAG
  rationale: 전례 문맥상 αὐτῆς가 앞절의 ἡ γῆ를 가리키므로, 자연스러운 공간적 의미인 '땅 위에서'로 풀었습니다.
- source_word: ὅσα ἐποίησαν
  english_pob_choice: what they did
  chosen_korean: 그들이 행한 것과 같은 일
  alternatives_korean:
  - 그들이 한 것
  - 그들이 행한 일들
  lexicon: BDAG
  rationale: 비교 구문이므로 단순한 '그들이 한 것'보다 대응되는 행위의 성격을 드러내는 표현이 더 정확합니다.
theological_decisions:
- issue: ἐπ' αὐτῆς의 지시 대상
  chosen_reading: αὐτῆς는 직전 구절의 '땅'을 가리키는 것으로 보고, 침해 대상이 아니라 공간적 위치를 나타내는 '땅 위에서'로 번역했습니다.
  alternative_readings:
  - '''그녀 위에''로 이해하는 해석'
  - '''그것에 대하여''라는 적대적 이해'
  rationale: 본문의 가장 가까운 선행어가 ἡ γῆ이므로, 문맥상 적대 의미를 앞세우지 않고 직접적인 지시 대상을 따랐습니다.
  doctrine_reference: 문맥 우선의 대명사 지시 해석
