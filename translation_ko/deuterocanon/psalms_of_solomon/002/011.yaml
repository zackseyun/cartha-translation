  yaml_path: translation/deuterocanon/psalms_of_solomon/002/011.yaml
  text: For no man has done on it what they did[a][b].
  footnotes:
  - marker: a
    text: Or 'upon her' / 'on her' for ἐπ' αὐτῆς; the main text renders the phrase idiomatically in a hostile sense.
