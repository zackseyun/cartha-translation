  source_fidelity: 그리스어의 인과 접속사 ὅτι, 보편 부정(οὐκ ... πᾶς ἄνθρωπος), 공간적 ἐπ' αὐτῆς, 그리고 ὅσα ἐποίησαν의 비교 내용을 모두 충실히 반영합니다. αὐτῆς를 직전 문맥의 ‘땅’으로 이해한 ‘땅 위에서’는 영어 POB의 현행 본문 및 감사 이력과도 일치합니다.
