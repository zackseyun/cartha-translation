  yaml_path: translation/deuterocanon/psalms_of_solomon/002/040.yaml
  text: For the Lord is kind to those who call on him with endurance[a], to act according to his mercy toward his holy ones[c][b], to stand continually before him in strength.
  footnotes:
  - marker: a
    text: Or 'his faithful ones' or 'his devout ones.'
    reason: lexical_alternative
  - marker: b
    text: Or 'with patience' for 'with endurance.'
    reason: lexical_alternative
  - marker: c
    text: Or 'his holy ones'.
    reason: previous_rendering
translation:
  language: ko
  text: 이는 야훼께서 자신을 부르는 이들에게 인자하시며 — 인내 가운데 그를 부르는 이들에게 — 그의 자비에 따라 그의 경건한 이들을 대하시어, 그들이 언제나 그의 앞에 능력 가운데 서게 하시기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자신을 부르는’은 기도와 간구의 의미를 드러냅니다.
    reason: source_note
  - marker: b
    text: ‘인내 가운데’는 ‘with endurance’에 해당합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘경건한 이들’은 이 책에서 ὅσιοι가 가리키는 집단적 표현을 반영합니다.
    reason: theological_note
lexical_decisions:
- source_word: χρηστὸς
  english_pob_choice: kind
  chosen_korean: 인자하시며
  alternatives_korean:
  - 친절하시며
  - 좋으시며
  - 은혜로우시며
  lexicon: BDAG
  rationale: χρηστός의 관계적·성품적 뉘앙스를 살리면서, 하나님에 대해 자연스럽고 공경적인 합쇼체로 옮기기 위해 ‘인자하시며’를 택했습니다.
- source_word: τοῖς ἐπικαλουμένοις αὐτὸν
  english_pob_choice: those who call on him
  chosen_korean: 자신을 부르는 이들에게
  alternatives_korean:
  - 그를 부르는 이들에게
  - 그에게 부르짖는 이들에게
  - 그를 호출하는 이들에게
  lexicon: BDAG
  rationale: 기도와 간구의 행위를 가리키므로 ‘부르는’으로 옮기되, 한국어에서 자연스러운 대상을 분명히 하기 위해 ‘자신을’(그분 자신을)로 풀었습니다.
- source_word: ἐν ὑπομονῇ
  english_pob_choice: with endurance
  chosen_korean: 인내 가운데
  alternatives_korean:
  - 참음 가운데
  - 지속함 가운데
  - 인내로
  lexicon: BDAG
  rationale: ὑπομονή는 단순한 참음보다 견디며 버티는 지속성을 포함하므로, 전치사구의 상태를 살리는 ‘인내 가운데’가 가장 무난합니다.
- source_word: τοῖς ὁσίοις αὐτοῦ
  english_pob_choice: his holy ones
  chosen_korean: 그의 경건한 이들
  alternatives_korean:
  - 그의 거룩한 이들
  - 그의 성도들
  - 그의 신실한 이들
  lexicon: BDAG
  rationale: 이 문맥의 ὅσιοι는 POB의 영어 개정 경향처럼 ‘holy ones’로 단순화하기보다, 시편 솔로몬에서 보이는 언약적·사회적 집단성을 드러내는 ‘경건한 이들’이 한국어에서 가장 잘 구분해 줍니다.
- source_word: παρεστᾶναι διὰ παντὸς ἐνώπιον αὐτοῦ ἐν ἰσχύι
  english_pob_choice: to stand continually before him in strength
  chosen_korean: 그들이 언제나 그의 앞에 능력 가운데 서게 하시기
  alternatives_korean:
  - 언제나 그의 앞에 능력으로 서도록
  - 끊임없이 그의 앞에 힘 있게 서게 하시기
  - 항상 그의 앞에 힘 가운데 서 있게 하시기
  lexicon: BDAG
  rationale: παρεστᾶναι와 διὰ παντὸς를 살려 지속적 ‘서 있음’을 표현하고, ἐν ἰσχύι는 문맥상 허약함이 아닌 견고한 존재 상태를 가리키므로 ‘능력 가운데’로 옮겼습니다.
theological_decisions:
- issue: ὁσίοις의 한국어 대응
  chosen_reading: ‘경건한 이들’로 옮겨, 단순한 도덕적 ‘거룩함’보다 하나님께 헌신된 공동체의 정체성을 드러냈습니다.
  alternative_readings:
  - ‘거룩한 이들’
  - ‘신실한 이들’
  - ‘성도들’
  rationale: Psalms of Solomon의 문맥에서는 ὅσιοι가 특수한 경건 집단을 가리키는 색채가 있어, 교회 전통어 ‘성도’로 평탄화하기보다 본문이 가진 사회·종교적 긴장을 보존하는 번역이 적절합니다.
  doctrine_reference: 시편 솔로몬의 집단 정체성 및 ὅσιος/ἅγιος 구분
