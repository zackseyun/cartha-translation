  text: ὅτι χρηστὸς ὁ κύριος τοῖς ἐπικαλουμένοις αὐτὸν ἐν ὑπομονῇ, ποιῆσαι κατὰ τὸ ἔλεος αὐτοῦ τοῖς ὁσίοις αὐτοῦ, παρεστᾶναι διὰ παντὸς ἐνώπιον αὐτοῦ ἐν ἰσχύι.
