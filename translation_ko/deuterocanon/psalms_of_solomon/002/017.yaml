base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/017.yaml
  text: For you repaid the sinners according to their deeds[c][b][a], and according to their exceedingly evil sins.
  footnotes:
  - marker: a
    text: Or 'works' instead of 'deeds.'
