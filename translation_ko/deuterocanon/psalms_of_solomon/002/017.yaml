lexical_decisions:
- source_word: ἀπέδωκας
  english_pob_choice: repaid
  chosen_korean: 갚으셨고
  alternatives_korean:
  - 되갚으셨고
  - 보상하셨고
  - 되돌려 주셨고
  lexicon: BDAG
  rationale: δώ- 계열의 보응 의미를 살려, 단순한 '주다'보다 보상·응보의 뉘앙스를 드러내는 ‘갚다’를 택했습니다.
- source_word: τοῖς ἁμαρτωλοῖς
  english_pob_choice: the sinners
  chosen_korean: 죄인들에게
  alternatives_korean:
  - 그 죄인들에게
  - 죄인들에게
  - 악인들에게
  lexicon: BDAG
  rationale: 문맥상 특정 집단을 가리키는 정관사 의미를 살리기 위해 ‘그’를 보류하고도 대상성을 분명히 하는 복수 여격으로 옮겼습니다.
- source_word: ἔργα
  english_pob_choice: deeds
  chosen_korean: 행위
  alternatives_korean:
  - 일들
  - 행동들
  - 공적
  lexicon: BDAG
  rationale: ‘works’에 해당하는 행위의 결과를 가리키는 말로, 한국어에서는 법정·윤리적 보응 문맥에 자연스러운 ‘행위’가 가장 적절합니다.
- source_word: ἁμαρτίας ... πονηρὰς σφόδρα
  english_pob_choice: exceedingly evil sins
  chosen_korean: 심히 악한 죄들
  alternatives_korean:
  - 매우 악한 죄들
  - 지극히 악한 죄들
  - 몹시 악한 죄들
  lexicon: BDAG
  rationale: σφόδρα의 강한 강조와 πονηράς의 질적 악함을 함께 살리기 위해 ‘심히 악한’으로 옮겼습니다.
theological_decisions:
- issue: 반복되는 보응 문장 구조
  chosen_reading: 첫 절과 둘째 절 모두 동일하게 ‘갚으셨고’로 처리해, 보응의 반복과 강조를 드러냈습니다.
  alternative_readings:
  - 첫 절만 ‘갚으셨고’, 둘째 절은 ‘따라서 심판하셨고’
  - 둘째 절을 단순 병렬로 약화시키는 번역
  rationale: 원문의 καὶ ... καὶ 구문은 두 기준 모두에 따른 보응을 강조하므로, 동일 동사를 반복해 구조적 평행을 보존했습니다.
  doctrine_reference: 시편/지혜문학의 보응-심판 표현
- issue: ‘죄인들’의 집단성
  chosen_reading: ‘죄인들’을 일반적 도덕 범주로 희석하지 않고, 문맥이 지시하는 특정 집단 지칭을 유지하는 방식으로 번역했습니다.
  alternative_readings:
  - ‘악인들’처럼 일반화
  - 주석 없이 단순한 도덕적 비난으로 처리
  rationale: 영어 POB의 수정 기록이 보여 주듯, 이 표현은 단순한 추상적 죄인이 아니라 특정 집단 표지이므로 집합적 지칭을 보존해야 합니다.
  doctrine_reference: 역사적-사회적 지시 대상 보존
