  naturalness: ‘그들의 행위에 따라, 또 그들의 지극히 악한 죄들에 따라 갚으셨습니다’는 원문의 병렬을 유지하면서 현대 표준 한국어 합쇼체에서 자연스럽습니다. ‘지극히’는 σφόδρα의 강한 정도를 자연스럽고 격식 있게 전달합니다.
  terminology: ‘죄’, ‘행위’, ‘갚으셨습니다’는 도덕적·사법적 보응 문맥과 원문의 어휘를 적절히 보존합니다. ‘그 죄인들’은 특정 지칭을 단정적으로 역사 해설화하지 않으면서도 그리스어 정관사의 표지를 반영합니다.
