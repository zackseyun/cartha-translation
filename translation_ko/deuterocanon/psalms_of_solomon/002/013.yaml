  text: ἔστησαν τοὺς υἱοὺς Ἱερουσαλὴμ εἰς ἐμπαιγμόν, ἀντὶ πορνῶν ἐν αὐτῇ· πᾶς ὁ πορευόμενος εἰσεπορεύετο κατέναντι τοῦ ἡλίου· ἐνέπαιζον ταῖς ἀνομίαις αὐτῶν.
