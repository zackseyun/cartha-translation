  - ‘공공연히’로만 완화하는 방식
  rationale: 본문은 단순한 비난이 아니라 공개적 모욕과 성적 수치의 이미지를 함께 사용합니다. 이를 약화하지 않고 보존하는 것이 원문 효과를 더 충실히 전달합니다.
