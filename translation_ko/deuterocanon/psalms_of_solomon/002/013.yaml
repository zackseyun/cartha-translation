base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/013.yaml
  text: They made the sons of Jerusalem a mockery[a], like prostitutes within her; everyone passing by would enter in broad daylight[c][b]; they mocked them with their lawless deeds.
  footnotes:
  - marker: a
    text: Literally, 'before the sun' — that is, openly or publicly.
    reason: lexical_alternative
  - marker: b
    text: Or 'as prostitutes'; the Greek phrase may be read more literally as 'instead of prostitutes,' but the contextual sense is comparative humiliation.
    reason: alternative_reading
  - marker: c
    text: Or 'would go in openly, in broad daylight'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 예루살렘의 아들들을 조롱거리로 삼았습니다. 그 성 안에 있는 창녀들처럼 말입니다[b] 지나가는 사람마다 대낮에 그 성으로 들어가곤 했습니다[a][c]. 그들은 그들의 불법한 행위를 조롱했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘해 앞에서’로, 공개적으로 또는 드러나게라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 더 문자적으로 ‘창녀들 대신’으로도 읽을 수 있지만, 문맥상 비교적 수치의 의미가 더 분명합니다.
    reason: alternative_reading
  - marker: c
    text: ‘대낮에’는 ‘공개적으로, 드러나게’라는 관용적 의미를 살린 번역입니다.
    reason: previous_rendering
lexical_decisions:
