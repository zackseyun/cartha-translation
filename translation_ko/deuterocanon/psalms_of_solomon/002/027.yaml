base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/027.yaml
  text: For they did not act out of zeal[a], but out of the desire of their soul[b],
  footnotes:
  - marker: a
    text: Or, more literally, 'but in desire of soul' or 'but in the desire of their soul.'
    reason: lexical_alternative
  - marker: b
    text: Or 'out of their own desire'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 열심으로 행한 것이 아니라, 자기 영의 욕망으로 행하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, '영의 욕망으로' 또는 '그들의 영의 욕망으로'.
    reason: lexical_alternative
  - marker: b
    text: ψυχῆς는 '영/혼'의 의미를 지닐 수 있어, 본문은 '자기 영의 욕망'이라는 더 문자적인 독해도 가능합니다.
    reason: source_note
lexical_decisions:
- source_word: οὐκ ἐν ζήλῳ ἐποίησαν
  english_pob_choice: did not act out of zeal
  chosen_korean: 열심으로 행한 것이 아니라
  alternatives_korean:
  - 질투로 행한 것이 아니라
  - 열심에서 행한 것이 아니라
  lexicon: LSJ
  rationale: ζήλῳ는 이 문맥에서 종교적·윤리적 동기를 가리키는 '열심'이 자연스럽고, 부정문 구조를 살려 행위의 동기를 분명히 드러냅니다.
- source_word: ἐν ἐπιθυμίᾳ
  english_pob_choice: out of the desire
  chosen_korean: 자기 영의 욕망으로
  alternatives_korean:
  - 영의 욕망으로
  - 마음의 욕망으로
  - 갈망으로
  lexicon: LSJ
  rationale: ἐπιθυμία는 단순한 바람보다 더 강한 욕구를 뜻하므로 '욕망'이 적절하며, 전치사 ἐν은 한국어에서 원인·동기의 '으로'로 옮기는 것이 자연스럽습니다.
- source_word: ψυχῆς
  english_pob_choice: their own / of their soul
  chosen_korean: 자기 영의
  alternatives_korean:
  - 그들의 혼의
  - 그들의 영혼의
  - 자기 마음의
  lexicon: LSJ
  rationale: ψυχή는 이 구절에서 히브리어식 'nefesh' 배경을 반영하는 말로 보이며, 단순한 '자기 자신의'보다 '영'을 살리는 편이 원문의 심리적·시적 무게를 유지합니다.
theological_decisions:
- issue: 동기의 대비를 어떻게 살릴 것인가
  chosen_reading: 겉보기의 종교적 열심과 내면의 자기 욕망을 대조하는 문장으로 읽었습니다.
  alternative_readings:
  - 단순히 '질투'와 '욕망'의 대비로 읽을 수 있음
  - 중립적인 행위 묘사로 약화시킬 수 있음
  rationale: ζήλος를 '열심'으로, ἐπιθυμία를 '욕망'으로 대비해 본문의 도덕적 긴장을 유지하는 것이 가장 자연스럽습니다.
  doctrine_reference: 문맥 중심의 윤리적 판단
- issue: ψυχῆς의 번역 범위
  chosen_reading: ψυχῆς는 여기서 '영/혼의 깊은 욕구'를 가리키는 표현으로 보아, '자기 영의 욕망'으로 옮겼습니다.
  alternative_readings:
  - '''자기 마음의 욕망'''
  - '''그들의 욕망'''
  rationale: 문자적으로는 '영혼/생명/자기'의 범위를 가지지만, 시편적·히브리적 배경을 살리려면 내면의 깊은 욕구를 드러내는 표현이 필요합니다.
  doctrine_reference: 히브리적 인간 이해(네페쉬 배경)
