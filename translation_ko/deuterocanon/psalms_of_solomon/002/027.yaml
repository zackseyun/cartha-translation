  source_fidelity: ζήλῳ는 문맥상 ‘열심’으로, ἐπιθυμίᾳ ψυχῆς는 ‘영혼의 욕망’으로 옮기는 것이 적절합니다. 초안의 ‘자기 영’은 ψυχή를 πνεῦμα(영)처럼 좁히며, 원문에 없는 ‘자기’를 더한 표현과 결합되어 원문의 시적·인간론적 어감을 충분히 보존하지 못합니다.
