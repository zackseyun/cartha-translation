  yaml_path: translation/deuterocanon/psalms_of_solomon/004/002.yaml
  text: Excessive in speech, excessive in outward show above all others, the one harsh in speech to condemn sinners in judgment.
translation:
  language: ko
  text: 말이 지나치고, 외적 과시도 누구보다 지나치며, 말이 거친 자는 재판에서 죄인들을 정죄합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περισσὸς ἐν λόγοις
  english_pob_choice: Excessive in speech
  chosen_korean: 말이 지나치고
  alternatives_korean:
  - 말이 넘치고
  - 말에 과한
  lexicon: λόγοις
  rationale: 영어 POB의 ‘speech’를 따라 단순한 ‘말들’보다 발화 태도와 분량이 드러나는 ‘말이 지나치고’로 옮겨, 원문의 과도함을 간결하게 살렸습니다.
- source_word: περισσὸς ἐν σημειώσει
  english_pob_choice: excessive in outward show
  chosen_korean: 외적 과시도
  alternatives_korean:
  - 겉치레도
  - 드러내는 행동도
  lexicon: σημειώσει
  rationale: σημείωσις는 단순한 ‘표시’보다 눈에 보이는 과장된 드러냄을 가리키므로, 영어 POB의 ‘outward show’를 반영해 ‘외적 과시’로 옮겼습니다.
- source_word: ὁ σκληρὸς ἐν λόγοις
  english_pob_choice: the one harsh in speech
  chosen_korean: 말이 거친 자는
  alternatives_korean:
  - 말이 모진 사람은
  - 말이 험한 자는
  lexicon: σκληρὸς
  rationale: σκληρός의 강한 कठ함을 ‘거친’으로 옮겨, 단순한 무례함보다 언어의 공격성을 드러냈습니다.
- source_word: κατακρῖναι ἁμαρτωλοὺς ἐν κρίσει
  english_pob_choice: to condemn sinners in judgment
  chosen_korean: 재판에서 죄인들을 정죄합니다
  alternatives_korean:
  - 심판에서 죄인들을 정죄합니다
  - 판결 가운데 죄인들을 유죄로 합니다
  lexicon: κατακρῖναι / κρίσει
  rationale: κρίσις는 문맥상 종교적 추상보다 법정적 판단이 자연스러워 ‘재판’으로 옮겼고, κατακρῖναι는 결과를 분명히 하는 ‘정죄합니다’로 번역했습니다.
theological_decisions:
- issue: 법정적 ‘judgment’의 표현 방식
  chosen_reading: ‘재판’으로 옮겨 행위의 장면을 구체화했습니다.
  alternative_readings:
  - ‘심판’으로 옮길 수 있습니다.
  - ‘판결’로도 옮길 수 있습니다.
  rationale: 이 절은 말의 과시와 거침을 비판하면서 죄인을 ‘judgment’에서 정죄하는 자를 말하므로, 종말론적 심판보다 재판 장면의 법정성을 드러내는 것이 원문과 영어 POB의 흐름에 더 가깝습니다.
  doctrine_reference: 문맥 우선의 법정적 κρίσις 해석
