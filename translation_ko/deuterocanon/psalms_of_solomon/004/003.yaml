  source_fidelity: 수정이 필요합니다. 본문의 δεύτε καί는 대조 접속사 ‘하지만’이 아니라 병렬의 ‘그리고/또한’이며, χείρ가 ‘달려들다’의 주어가 되는 현행 표현은 원문의 ‘그를 대적하는 데 앞장서는 손’이라는 비유를 다소 부자연스럽게 만듭니다. 또한 각주 c의 ‘죄인들의 것들’은 최신 영어 POB의 중성 복수 실질적 용법(‘죄된 것들/행위들’) 판단과 맞지 않습니다.
  naturalness: ‘그의 손은 … 달려들지만’보다 ‘그의 손은 … 그를 대적하는 일에 앞장서고’가 한국어에서 자연스럽고, ἐν πρώτοις의 우선성도 잘 보존합니다. ‘열심을 내는 듯이’는 ὡς의 외양·가장 가능성을 자연스럽게 나타냅니다.
  terminology: ἔνοχος는 ‘유죄입니다’로 유지할 수 있습니다. ἀκρασίαις는 ‘자제하지 못한 일들’로 옮겨 복수의 구체적 행위와 절제 결여의 의미를 함께 보존했습니다. ποικιλίᾳ ἁμαρτωλῶν은 문맥 및 최신 POB 판정에 따라 ‘여러 가지 죄된 행위’로 옮깁니다.
