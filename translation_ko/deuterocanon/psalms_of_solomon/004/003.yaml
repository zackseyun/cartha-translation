  lexicon: LSJ
  rationale: POB의 최신 판단처럼 ἁμαρτωλῶν을 ‘죄인들’이 아니라 죄된 것들의 성격으로 읽어, ‘여러 가지 죄된 행위’로 옮겼습니다.
- source_word: ἀκρασίαις
  english_pob_choice: acts of self-indulgence
  chosen_korean: 자제하지 못하는 일들
  alternatives_korean:
  - 방종한 행위들
  - 절제 없음의 행위들
  - 자기방종
  lexicon: BDAG
  rationale: 이 단어는 절제의 결여와 방종을 뜻하므로, 현대 한국어에서 의미를 분명히 드러내는 ‘자제하지 못하는 일들’로 번역했습니다.
theological_decisions:
- issue: οἱ 죄책 진술의 도덕적·법정적 성격
  chosen_reading: 그는 실제로 ‘유죄’인 사람으로 제시됩니다.
  alternative_readings:
  - 책임이 있다
  - 허물이 있다
  - 비난받을 만하다
  rationale: ἔνοχος는 단순한 도덕적 흠보다 법정적 유죄를 강하게 띠므로, 고발의 힘을 살리는 ‘유죄’가 원문의 긴장을 가장 잘 보존합니다.
  doctrine_reference: 성서의 죄책/책임 진술
