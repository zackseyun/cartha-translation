    rationale: 그리스어는 καὶ … καὶ로 두 행동·상태를 병렬합니다. 문맥상 위선을 드러내는 긴장은 있으나, 역접을 명시하는 것은 원문보다 해석을 강화합니다.
  - severity: medium
    issue: ‘손은 … 달려들지만’
    rationale: χείρ의 비유를 보존하려면 손이 ‘그를 대적하는 일에 앞장선다’고 표현하는 편이 자연스럽고, ἐν πρώτοις의 우선성도 더 정확히 드러납니다.
