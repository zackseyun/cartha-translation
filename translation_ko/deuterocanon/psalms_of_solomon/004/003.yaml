- source_word: ποικιλίᾳ ἁμαρτωλῶν
  english_pob_choice: in a variety of sinful deeds
  chosen_korean: 여러 가지 죄된 행위
  alternatives_korean:
  - 다양한 죄의 행위
  - 여러 종류의 죄들
