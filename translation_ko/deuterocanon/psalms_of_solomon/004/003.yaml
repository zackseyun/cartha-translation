    rationale: ἁμαρτωλῶν을 중성 복수 실질명사로 읽는 최신 영어 POB의 판정과 충돌합니다. 각주는 ‘여러 가지 죄된 것들/행위들’이라는 압축된 표현임을 설명해야 합니다.
