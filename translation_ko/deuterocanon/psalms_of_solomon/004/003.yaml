id: PSS.4.3
reference: Psalms of Solomon 4:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: lxx-swete-1909
  text: καὶ ἡ χείρ αὐτοῦ ἐν πρώτοις ἐπʼ αὐτὸν ὡς ἐν ζήλει, καὶ αὐτὸς ἔνοχος ἐν ποικιλίᾳ ἁμαρτωλῶν, ἐν ἀκρασίαις·
  language: Greek
  pages:
  - 792
  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/004/003.yaml
  text: And his hand is among the first against him[a], as if in zeal, but he himself is guilty in a variety of sinful deeds[d][c][b], in acts of self-indulgence.
  footnotes:
  - marker: a
    text: Or “his hand is at first upon him,” taking ἐν πρώτοις temporally rather than as priority among accusers.
    reason: alternative_reading
  - marker: b
    text: Or “as in zeal”; the phrase may describe apparent zeal or a claimed posture of zeal.
    reason: lexical_alternative
  - marker: c
    text: Literally “guilty in a variety of sinners, in self-indulgences”; the Greek is compressed, and “the manifold ways of sinners” is an idiomatic rendering of the sense.
    reason: lexical_alternative
  - marker: d
    text: Or 'in the manifold ways of sinners'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그의 손은 마치 열심인 듯이 그에게 먼저 달려들지만[a][b], 그는 여러 가지 죄된 행위[c]와 자제하지 못하는 일들로 유죄입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 손이 처음에 그에게 닿는다”로도 옮길 수 있는데, ἐν πρώτοις를 우선성보다 시간적으로 읽는 경우입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “마치 열심으로”로도 옮길 수 있으며, 이 표현은 실제 열심이라기보다 열심을 내세운 태도를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 “여러 가지 죄인들의 것들”에 가깝지만, 문맥상 죄된 행위들의 다양성을 가리키는 것으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: χείρ
  english_pob_choice: hand
  chosen_korean: 손
  alternatives_korean:
  - 손길
  - 행동
  - 권세
  lexicon: BDAG
  rationale: 원문은 신체 이미지인 ‘손’을 통해 그가 누구를 향해 움직이는지 생생하게 보여 주므로, 한국어도 직역에 가까운 ‘손’으로 살렸습니다.
- source_word: ἐν πρώτοις
  english_pob_choice: among the first
  chosen_korean: 먼저
  alternatives_korean:
  - 맨 먼저
  - 가장 앞서
  - 우선
  lexicon: LSJ
  rationale: 문맥상 단순한 시간 순서보다 그 사람의 적극적·선봉적 행동을 가리키므로, 자연스러운 한국어로는 ‘먼저’가 가장 무난합니다.
- source_word: ὡς ἐν ζήλει
  english_pob_choice: as if in zeal
  chosen_korean: 마치 열심인 듯이
  alternatives_korean:
  - 열심으로
  - 열심인 양
  - 마치 열심으로
  lexicon: BDAG
  rationale: ἡ κίνησις가 실제 열심인지 가장한 열심인지 애매하므로, 영어 POB의 뉘앙스를 따라 ‘마치 … 듯이’로 표지하여 표면상의 열심을 드러냈습니다.
- source_word: ποικιλίᾳ ἁμαρτωλῶν
  english_pob_choice: in a variety of sinful deeds
  chosen_korean: 여러 가지 죄된 행위
  alternatives_korean:
  - 다양한 죄의 행위
  - 여러 종류의 죄들
  - 다채로운 죄의 일들
  lexicon: LSJ
  rationale: POB의 최신 판단처럼 ἁμαρτωλῶν을 ‘죄인들’이 아니라 죄된 것들의 성격으로 읽어, ‘여러 가지 죄된 행위’로 옮겼습니다.
- source_word: ἀκρασίαις
  english_pob_choice: acts of self-indulgence
  chosen_korean: 자제하지 못하는 일들
  alternatives_korean:
  - 방종한 행위들
  - 절제 없음의 행위들
  - 자기방종
  lexicon: BDAG
  rationale: 이 단어는 절제의 결여와 방종을 뜻하므로, 현대 한국어에서 의미를 분명히 드러내는 ‘자제하지 못하는 일들’로 번역했습니다.
theological_decisions:
- issue: οἱ 죄책 진술의 도덕적·법정적 성격
  chosen_reading: 그는 실제로 ‘유죄’인 사람으로 제시됩니다.
  alternative_readings:
  - 책임이 있다
  - 허물이 있다
  - 비난받을 만하다
  rationale: ἔνοχος는 단순한 도덕적 흠보다 법정적 유죄를 강하게 띠므로, 고발의 힘을 살리는 ‘유죄’가 원문의 긴장을 가장 잘 보존합니다.
  doctrine_reference: 성서의 죄책/책임 진술
