reference: Psalms of Solomon 4:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: lxx-swete-1909
  text: ἐπλήσθη ἐν παρανομίᾳ ἐν ταύτῃ· καὶ οἱ ὀφθαλμοὶ αὐτοῦ ἐπʼ οἶκον ἕτερον ὀλοθρεύσαι ἐν λόγοις ἀνυπερθέσεως· οὐκ ἐμπίπλαται ἡ ψυχὴ αὐτοῦ, ὡς ᾅδης, ἐν πᾶσι τούτοις.
  language: Greek
  pages:
  - 793
  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/004/015.yaml
  text: He was filled with this lawlessness[a], and his eyes were set on another household to destroy it with relentless words; his soul is not satisfied, like Hades[c][b], with all these things.
  footnotes:
  - marker: a
    text: Or 'another house.' The Greek οἶκος can refer either to a physical house or to a household/family sphere.
    reason: lexical_alternative
  - marker: b
    text: The phrase rendered 'with relentless words' is difficult; it may also mean 'with unhesitating words' or 'with words without delay.'
    reason: alternative_reading
  - marker: c
    text: '''Like Hades'' expresses insatiability; ''the grave'' or ''Sheol'' would be interpretive alternatives.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 이 무법으로 가득 찼고, 그의 눈은 다른 집안을 노리고 있었으며, 거침없는 말로 그 집안을 멸하려 했습니다.[a] 그의 영혼은 하데스처럼 이 모든 것으로도 만족하지 못합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거침없는 말’에 해당하는 그리스어 표현은 난해합니다. ‘주저함 없는 말’ 또는 ‘지체하지 않는 말’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘하데스처럼’은 끝없이 만족하지 못함을 비유합니다. ‘스올처럼’ 또는 ‘무덤처럼’은 해석적 대안입니다. 또한 ‘집안’(οἶκος)은 ‘집’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθη ἐν παρανομίᾳ ἐν ταύτῃ
  english_pob_choice: was filled with this lawlessness
  chosen_korean: 이 불법으로 가득 찼고
  alternatives_korean:
  - 이 법lessness로 가득 찼고
  - 이 죄악으로 가득 찼고
  - 이 불의로 가득 찼고
  lexicon: BDAG
  rationale: παρανομίᾳ는 단순한 일반 악보다 법/질서에 대한 위반을 가리키므로, 한국어에서는 ‘불법’이 가장 직접적으로 대응합니다.
- source_word: οἱ ὀφθαλμοὶ αὐτοῦ ἐπʼ οἶκον ἕτερον
  english_pob_choice: his eyes were set on another household
  chosen_korean: 그의 눈은 다른 집안을 향해 있었으며
  alternatives_korean:
  - 그의 눈은 다른 집을 향해 있었으며
  - 그의 눈은 다른 가문을 향해 있었으며
  - 그의 시선은 다른 집안을 향해 있었으며
  lexicon: BDAG
  rationale: οἶκος는 여기서 단순 건물보다 가정/가문/가정권을 포함하는 ‘집안’이 자연스럽고, ‘향해 있었다’는 탐욕적 집착의 뉘앙스를 살립니다.
- source_word: ὀλοθρεύσαι ἐν λόγοις ἀνυπερθέσεως
  english_pob_choice: to destroy it with relentless words
  chosen_korean: 그것을 무자비한 말로 무너뜨리려 했으며
  alternatives_korean:
  - 그것을 단호한 말로 무너뜨리려 했으며
  - 그것을 지체 없는 말로 무너뜨리려 했으며
  - 그것을 멈추지 않는 말로 무너뜨리려 했으며
  lexicon: LSJ
  rationale: ἀνυπερθέσεως는 의미가 난해하지만, POB의 audit trail대로 말을 멈추지 않거나 물러서지 않는 강압성을 살려 ‘무자비한 말’로 옮겼습니다.
- source_word: ὡς ᾅδης
  english_pob_choice: like Hades
  chosen_korean: 하데스처럼
  alternatives_korean:
  - 스올처럼
  - 무덤처럼
  - 음부처럼
  lexicon: BDAG
  rationale: 그리스어 본문이 ᾅδης를 직접 쓰므로, 원문 투명성을 위해 ‘하데스’로 옮기고 관용적 종교어를 피했습니다.
theological_decisions:
- issue: insatiability comparison
  chosen_reading: ‘하데스처럼’은 단순한 장소 표지가 아니라 끝없이 삼키는 불만족/탐욕의 비유로 이해했습니다.
  alternative_readings:
  - 무덤처럼의 단순 비유
  - 스올에 대한 유대적 관용 표현
  rationale: 문맥이 ‘이 모든 것에 만족하지 못한다’는 진술과 연결되므로, 비교의 기능은 죽음/저승의 끝없는 탐식성을 드러내는 데 있습니다.
  doctrine_reference: 시편적 비유와 지혜문학의 상징 용법
