translation:
  language: ko
  text: 그의 눈은 아무 구별 없이 모든 여자에게 향하고, 그의 혀는 맹세를 담은 거래에서 거짓됩니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구별 없이’. 그리스어 표현은 그가 모든 여자를 무분별하게 바라본다는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘절제 없이’.
    reason: previous_rendering
  - marker: c
    text: 또는 ‘거래에서, 맹세와 함께’.
    reason: previous_rendering
lexical_decisions:
- source_word: οἱ ὀφθαλμοὶ αὐτοῦ ἐπὶ πᾶσαν γυναῖκα
  english_pob_choice: His eyes are on every woman
  chosen_korean: 그의 눈은 아무 구별 없이 모든 여자에게 향하고
  alternatives_korean:
  - 그의 눈은 모든 여자에게 향하고
  - 그의 시선은 모든 여자에게 향하고
  lexicon: LSJ
  rationale: ἐπί + 대격은 방향·집중을 나타내므로 ‘향하고’로 시선을 유지했고, πᾶσαν γυναῖκα는 범위를 살려 ‘모든 여자’로 옮겼습니다.
- source_word: ἄνευ διαστολῆς
  english_pob_choice: without distinction / without restraint
  chosen_korean: 아무 구별 없이
  alternatives_korean:
  - 구별 없이
  - 절제 없이
  - 제한 없이
  lexicon: LSJ
  rationale: διαστολή는 구별·분별을 뜻할 수 있으므로, 본문 문맥에서는 분별 없이 모든 여자에게 시선을 두는 의미를 살려 ‘아무 구별 없이’로 번역했습니다.
- source_word: ἡ γλῶσσα ψευδὴς
  english_pob_choice: his tongue is deceitful / false
  chosen_korean: 그의 혀는 거짓됩니다
  alternatives_korean:
  - 그의 혀는 속입니다
  - 그의 혀는 거짓말합니다
  lexicon: LSJ
  rationale: ψευδής의 성격을 한국어에서 자연스럽게 드러내기 위해 형용사적 표현을 살렸고, 혀를 거짓의 도구로 보는 비유를 유지했습니다.
- source_word: ἐν συναλλάγματι μεθʼ ὅρκου
  english_pob_choice: in a transaction with an oath
  chosen_korean: 맹세를 담은 거래에서
  alternatives_korean:
  - 맹세가 붙은 거래에서
  - 맹세를 곁들인 거래에서
  - 맹세를 동반한 거래에서
  lexicon: LSJ
  rationale: συνάλλαγμα는 단순한 ‘사업’보다 특정한 거래·교섭을 가리키므로 ‘거래’로 옮겼고, ὅρκου는 그 거래에 맹세가 결부된 상황을 드러내기 위해 ‘맹세를 담은’으로 자연화했습니다.
theological_decisions:
- issue: 도덕적 비난의 수위와 성적 시선의 묘사
  chosen_reading: 본문의 ‘모든 여자에게 향하는 눈’은 단순한 관찰이 아니라 분별 없는 탐욕적 시선을 지적하는 표현으로 읽었습니다.
  alternative_readings:
  - 중립적인 ‘바라봄’
  - 단순한 호기심의 시선
  rationale: ἄνευ διαστολῆς가 구별 없는 태도를 뜻하므로, 문맥상 윤리적 비판을 희석하지 않도록 했습니다.
  doctrine_reference: 지혜문학/도덕 훈계의 문맥
