- source_word: ἐπιθυμίᾳ
  english_pob_choice: lust
  chosen_korean: 정욕
  alternatives_korean:
  - 욕망
  - 욕구
  - 탐욕
  lexicon: BDAG
  rationale: 문맥의 불명예·파괴와 결합될 때 이 단어는 중립적 ‘욕망’보다 부정적 성격이 분명하므로, 한국어 성서에서 널리 통하는 ‘정욕’을 택했습니다.
