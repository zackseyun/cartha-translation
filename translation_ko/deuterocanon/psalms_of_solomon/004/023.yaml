- source_word: οἴκους
  english_pob_choice: households
  chosen_korean: 집
  alternatives_korean:
  - 가정
  - 집안
  - 가구
  lexicon: BDAG
  rationale: 직역하면 ‘집’이지만 문맥상 건물만이 아니라 가족 단위의 생활공간과 집안을 함께 가리킬 수 있어, 본문에는 짧게 ‘집’이라 두고 영어 주석과 같은 의미 폭을 보존했습니다.
- source_word: ἐν ἀτιμίᾳ
