  rationale: 여기서 ἀδίκων은 사람을 가리키는 속격으로 읽기보다, 욕망 자체의 성격을 규정하는 표현으로 보아 ‘불의한 욕망’으로 압축했습니다.
theological_decisions:
- issue: ἀδίκων의 속격 관계
  chosen_reading: ‘불의한 사람들’이라는 주격적 이해보다, 욕망의 성격을 규정하는 표현으로 읽어 ‘불의한 욕망’으로 번역했습니다.
  alternative_readings:
  - 불의한 사람들의 욕망
  - 불의한 것들을 향한 욕망
  rationale: 문맥상 화자는 단수이며, 앞 구문이 그의 말이 욕망의 실행을 돕는다고 설명하므로, 욕망의 대상/성격을 나타내는 압축된 표현으로 보는 편이 자연스럽습니다.
  doctrine_reference: 문맥적 속격 해석
- issue: παραλογισμοί의 도덕·인지적 중첩
  chosen_reading: ‘허위의 이성적 궤변’으로 옮겨, 단순한 거짓뿐 아니라 잘못된 추론을 통해 악을 정당화하는 의미를 살렸습니다.
  alternative_readings:
  - 거짓된 추론
  - 허위 진술
  rationale: 본문은 말의 내용이 지적 왜곡이면서 동시에 도덕적 기만이라는 점을 드러내므로, 두 층위를 함께 보존하는 번역이 적절합니다.
  doctrine_reference: 지혜문학적 경고
