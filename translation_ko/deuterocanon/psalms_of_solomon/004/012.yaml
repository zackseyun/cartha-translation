  source_fidelity: ἀδίκων은 복수 속격으로서 ‘불의한 자들’(명사화된 남성/공통 성) 또는 문맥에 따라 ‘불의한 것들’을 가리킬 수 있습니다. 본문과 영어 POB의 기본 해석에 따라 ‘불의한 자들의 욕망’을 본문으로 택하되, 다른 가능한 이해는 주석으로 보존해야 합니다. 또한 ‘욕망을 실행하다’는 한국어에서 다소 부자연스럽고, πρᾶξιν ἐπιθυμίας의 행위 지향성을 ‘욕망을 이루기 위한’으로 자연스럽게 나타낼 수 있습니다.
  naturalness: ‘허위의 이성적 궤변’은 ‘허위’, ‘이성적’, ‘궤변’이 중복되어 현대 한국어 문장으로 무겁습니다. παραλογισμοί의 잘못되거나 기만적인 논증이라는 뜻은 ‘그릇된 논리’가 자연스럽고 충분히 보존합니다.
  terminology: λόγοι는 ‘말’, παραλογισμοί는 ‘그릇된 논리’, ἐπιθυμία는 넓은 의미의 ‘욕망’으로 옮기는 것이 적절합니다. ‘불의한 자들’은 ἄδικοι의 윤리적 의미를 보존하며 특정 교리적 의미를 덧붙이지 않습니다.
