  rationale: 본문은 영어 POB의 기본 해석과 원문의 가장 자연스러운 명사화된 복수 속격 이해를 따라 ‘불의한 자들의 욕망’으로 옮겼습니다. 동시에 ἀδίκων의 성(性)과 지시 대상이 문법적으로 완전히 확정되지 않는 점은 주석으로 보존했습니다. ‘그릇된 논리’와 ‘욕망을 이루기 위한’은 원문의 기만적 추론 및 목적적 행동의 뜻을 유지하면서 현대 표준 한국어로 다듬은 표현입니다.
