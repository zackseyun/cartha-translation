translation:
  language: ko
  text: 그의 집이 그의 영혼을 채워 줄 모든 것에서 부족하게 되기를 바랍니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλλιπὴς
  english_pob_choice: lack
  chosen_korean: 부족하게 되기를 바랍니다
  alternatives_korean:
  - 결핍되기를 바랍니다
  - 모자라기를 바랍니다
  lexicon: LSJ
  rationale: 형용사적 상태를 한국어에서는 임precatory 맥락에 맞게 소망형으로 풀어, 결과가 ‘부족한 상태가 되다’는 뜻을 자연스럽게 살렸습니다.
- source_word: ὁ οἶκος αὐτοῦ
  english_pob_choice: his house
  chosen_korean: 그의 집
  alternatives_korean:
  - 그의 가문
  - 그의 가정
  lexicon: LSJ
  rationale: οἶκος의 기본적인 ‘집’ 의미를 살리되, 한국어에서도 물리적 집과 생계의 자리라는 넓은 함의를 함께 들을 수 있게 했습니다.
- source_word: ἀπὸ παντὸς
  english_pob_choice: everything
  chosen_korean: 모든 것에서
  alternatives_korean:
  - 모든 것으로부터
  - 그 어떤 것에서도
  lexicon: LSJ
  rationale: ‘~에서 부족하다’는 한국어 구문으로 옮겨, 전반적 결핍의 범위를 자연스럽게 표현했습니다.
- source_word: ψυχὴν αὐτοῦ
  english_pob_choice: his soul
  chosen_korean: 그의 영혼
  alternatives_korean:
  - 그의 생명
  - 그의 자신
  lexicon: LSJ
  rationale: ψυχή의 핵심 이미지를 보존해 ‘영혼’으로 옮겼고, 내적 욕구나 생명까지 포괄할 여지를 남겼습니다.
theological_decisions:
- issue: 저주의 소망형 표현의 처리
  chosen_reading: 원문의 명령문이 아니라 저주/기원의 문맥이므로 ‘... 되기를 바랍니다’로 옮겼습니다.
  alternative_readings:
  - 평서문으로 ‘그의 집은 부족합니다’
  - 직설적으로 ‘... 되게 하십시오’
  rationale: 시편류 기도의 문맥에서 화자의 저주적 소망을 한국어로 드러내되, 원문의 상태 서술성을 유지했습니다.
  doctrine_reference: 임precatory psalm/curse diction
