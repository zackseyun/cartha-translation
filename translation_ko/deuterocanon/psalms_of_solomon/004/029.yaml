  yaml_path: translation/deuterocanon/psalms_of_solomon/004/029.yaml
  text: May your mercy, O Lord, be upon all who love you.
translation:
  language: ko
  text: 주님, 주님의 긍휼이 주님을 사랑하는 모든 이에게 임하게 하소서.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γένοιτο
  english_pob_choice: may ... be
  chosen_korean: 임하게 하소서
  alternatives_korean:
  - 있게 하소서
  - 일어나게 하소서
  lexicon: BDAG
  rationale: 기도의 소망/간구를 나타내는 optative이므로, 현대 한국어에서는 청원형인 ‘임하게 하소서’가 가장 자연스럽고 기도문체도 유지합니다.
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주인이시여
  lexicon: BDAG
  rationale: 하나님께 드리는 직접 호칭이므로 POB의 ‘Lord’를 따라 ‘주님’으로 옮겨, 경외적 호칭과 자연스러운 합쇼체 기도문체를 살렸습니다.
- source_word: ἔλεός
  english_pob_choice: mercy
  chosen_korean: 긍휼
  alternatives_korean:
  - 자비
  - 은혜
  lexicon: BDAG
  rationale: ἔλεος는 단순한 감정이 아니라 자비로운 구제와 돌보심의 의미를 지니므로, 한국어에서는 ‘긍휼’이 문맥상 가장 밀착된 표현입니다.
- source_word: ἐπὶ πάντας τοὺς ἀγαπῶντάς σε
  english_pob_choice: upon all who love you
  chosen_korean: 주님을 사랑하는 모든 이에게
  alternatives_korean:
  - 주님을 사랑하는 모든 사람에게
  - 주님을 사랑하는 자들 위에
  lexicon: BDAG
  rationale: ἐπί의 기도적 ‘위에/임하여’라는 뉘앙스를 한국어에서는 ‘에게 임하게’로 자연스럽게 풀어, POB의 ‘upon’을 과도하게 직역하지 않으면서도 덮임의 방향성을 보존했습니다.
theological_decisions:
- issue: 하나님께 대한 직접 청원에서의 한국어 높임법
  chosen_reading: ‘하소서’ 체의 간구로 옮겼습니다.
  alternative_readings:
  - ‘임하게 되기를 바랍니다’
  - ‘있게 해주십시오’
  rationale: 원문의 optative 기도문은 단순 진술이 아니라 경건한 청원입니다. 한국어 합쇼체 기도문에서는 ‘하소서’가 가장 충실하게 간구의 기능을 드러냅니다.
  doctrine_reference: '기도문 register: direct divine address in Korean formal-polite style'
