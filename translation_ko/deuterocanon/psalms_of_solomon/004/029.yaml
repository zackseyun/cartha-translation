  source_fidelity: 원문의 청원적 aorist optative(γένοιτο)를 ‘임하게 하소서’로 적절히 옮겼습니다. ‘주님’은 Κύριε의 호격을, ‘주님의 긍휼’은 τὸ ἔλεός σου를, ‘주님을 사랑하는 모든 이에게’는 πάντας τοὺς ἀγαπῶντάς σε를 충실히 반영합니다. ἐπί의 대상·방향 관계도 ‘…에게 임하게’라는 자연스러운 한국어 기도 표현으로 보존되었습니다.
  naturalness: 현대 표준어 합쇼체 기도문으로 자연스럽습니다. ‘긍휼’은 다소 문어적이지만 성서·기도 문맥에서 정착된 어휘이며, 이 짧은 청원문의 경건한 문체와 잘 어울립니다.
  terminology: ‘주님’과 ‘긍휼’은 각각 Lord와 mercy의 의미 및 기도문적 격조를 적절히 전달합니다. 특정 교리적 해석을 덧붙이지 않습니다.
