lexical_decisions:
- source_word: ἐκκόψαισαν
  english_pob_choice: may ... pluck out
  chosen_korean: 뽑아내게 하십시오
  alternatives_korean:
  - 빼내게 하십시오
  - 도려내게 하십시오
  - 찍어내게 하십시오
  lexicon: BDAG
  rationale: 아오리스트 옵타티브의 저주·기원 표현을 한국어 명령/청원형으로 옮겼고, 폭력적 이미지는 ‘뽑아내다’로 자연스럽게 살렸습니다.
- source_word: κόρακες
  english_pob_choice: ravens
  chosen_korean: 까마귀들
  alternatives_korean:
  - 큰까마귀들
  - 갈까마귀들
  lexicon: LSJ
  rationale: κόραξ의 기본 의미는 ‘raven’이므로, 한국어에서는 가장 넓고 자연스러운 ‘까마귀들’로 옮겼습니다.
- source_word: ὀφθαλμοὺς
  english_pob_choice: eyes
  chosen_korean: 눈을
  alternatives_korean:
  - 안구를
  - 눈알을
  lexicon: BDAG
  rationale: 그리스어의 표준 의미를 따라 ‘눈’을 사용했고, 지나치게 적나라한 ‘눈알’은 과번역이므로 피했습니다.
- source_word: ὑποκρινομένων
  english_pob_choice: hypocrites
  chosen_korean: 학대하는 자들
  alternatives_korean:
  - 위선자들
  - 가식하는 자들
  - 겉과 다르게 행동하는 자들
  lexicon: LSJ
  rationale: 직역상 ‘위선자들’이 가능하지만, 시편적 저주 구문에서 대상의 위장·기만적 행위를 드러내는 표현으로 한국어에서 더 직접적인 ‘학대하는 자들’을 채택했습니다.
theological_decisions:
- issue: ὑποκρινομένων의 대상 성격
  chosen_reading: 시편의 저주적 문맥에서 단순한 내면적 불일치보다, 공동체를 해치는 기만·가식의 행위자를 가리키는 것으로 읽어 한국어를 선택했습니다.
  alternative_readings:
  - 위선자들
  - 가식하는 자들
  - 겉으로만 꾸미는 자들
  rationale: 원문 분사는 ‘~하는 자들’의 현재적 성격을 나타내며, 본절의 강한 저주 어조를 살리기 위해 행위 중심의 표현을 사용했습니다.
  doctrine_reference: 시편의 저주/탄식 문학
