    rationale: 원문은 특정 청자에게 하는 명령이 아니라 ‘까마귀들이 ... 뽑아 내기를’이라는 기원입니다. ‘바랍니다’를 사용하면 한국어 합쇼체를 유지하면서도 원문의 문법적 힘을 더 가깝게 재현합니다.
