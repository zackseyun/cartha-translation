  source_fidelity: 원문의 ὑποκρινομένων은 ‘위선자들/가식하는 자들/가장하는 자들’을 뜻하며, 초안의 ‘학대하는 자들’은 어휘적으로 뒷받침되지 않습니다. ἐκκόψαισαν은 저주·기원의 아오리스트 옵타티브이므로 ‘...하기를 바랍니다’가 그 기원법의 힘을 자연스럽게 나타냅니다. κόρακες와 ὀφθαλμοὺς는 각각 ‘까마귀들’과 ‘눈’으로 적절합니다.
