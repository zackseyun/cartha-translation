  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: lxx-swete-1909
  text: καὶ ὁ κύριος ῥύσεται αὐτοὺς ἀπὸ ἀνθρώπων δολίων καὶ ἁμαρτωλῶν. καὶ ῥύσεται ἡμᾶς ἀπὸ παντὸς σκανδάλου παρανόμου.
  language: Greek
  pages:
