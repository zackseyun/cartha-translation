base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/004/027.yaml
  text: And the Lord will rescue them from deceitful and sinful people[b][a], and he will rescue us from every lawless snare.
  footnotes:
  - marker: a
    text: Or “every lawless snare” or “every cause of stumbling from the lawless one/ones.”
    reason: lexical_alternative
  - marker: b
    text: Or 'deceitful and sinful people'.
    reason: previous_rendering
translation:
  language: ko
  text: 주님께서는 속이는 사람들과 죄인들로부터 그들을 구원하실 것입니다. 그리고 그분은 우리를 모든 불법한 걸림돌에서 구원하실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “불법한 걸림돌”
    reason: lexical_alternative
  - marker: b
    text: 또는 “속이는 사람들과 죄인들”
    reason: previous_rendering
lexical_decisions:
- source_word: κύριος
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주인
  lexicon: BDAG
  rationale: 하나님의 주권적 칭호로 쓰인 κύριος를 한국어 합쇼체에서 자연스럽고 경건하게 드러내는 기본 대응으로 주님을 택했습니다.
- source_word: ῥύσεται
  english_pob_choice: will rescue
  chosen_korean: 구원하실 것입니다
  alternatives_korean:
  - 구해 주실 것입니다
  - 건져 주실 것입니다
  - 구출하실 것입니다
  lexicon: BDAG
  rationale: 위험에서 건져내는 뜻을 현대 한국어로 분명하게 전하면서도, 시편적·구원론적 문맥에 맞게 '구원하다'를 유지했습니다.
- source_word: δολίων
  english_pob_choice: deceitful
  chosen_korean: 속이는
  alternatives_korean:
  - 기만하는
  - 간교한
  - 속임수의
  lexicon: BDAG
  rationale: 형용사적 의미를 살려 사람을 수식하는 직접적 표현으로 옮겼고, 도덕적 평가를 과장하지 않도록 '속이는'을 택했습니다.
- source_word: ἁμαρτωλῶν
  english_pob_choice: sinful people / sinners
  chosen_korean: 죄인들
  alternatives_korean:
  - 죄 많은 사람들
  - 죄 많은 자들
  - 죄인
  lexicon: BDAG
  rationale: 이 표현은 단순한 형용사보다 특정 집단명으로 기능하므로, '죄인들'로 옮겨 영어 수정 이력에서 지적된 사회집단적 의미를 반영했습니다.
- source_word: σκανδάλου παρανόμου
  english_pob_choice: lawless stumbling block / lawless snare
  chosen_korean: 불법한 걸림돌
  alternatives_korean:
  - 불법한 덫
  - 불법한 장애물
  - 법 없는 함정
  lexicon: BDAG
  rationale: σκανδάλου의 핵심 이미지는 넘어지게 하는 '걸림돌'이므로 이를 살리고, παρανόμου는 그 성격을 '불법한'으로 드러내어 원문의 결합을 유지했습니다.
theological_decisions:
- issue: 두 번째 절반의 ἡμᾶς와 첫 절반의 αὐτούς의 대상 구분
  chosen_reading: 첫 절반은 '그들', 둘째 절반은 '우리'로 구분하여, 공동체 안팎의 두 대상을 병렬로 유지했습니다.
  alternative_readings:
  - 두 구절 모두 동일 집단을 가리키는 것으로 평준화하기
  - 첫 절반도 '우리'로 바꾸기
  rationale: 원문이 대명사를 분명히 구분하므로, 공동체적 대조를 흐리지 않도록 대상 구분을 보존했습니다.
  doctrine_reference: 본문 문맥의 서술 구조와 대명사 지시 대상
