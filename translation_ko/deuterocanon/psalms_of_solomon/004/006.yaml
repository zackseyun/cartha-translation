- source_word: ταχὺς εἰσόδῳ
  english_pob_choice: quick to enter
  chosen_korean: 재빨리 들어가며
  alternatives_korean:
  - 빨리 들어가며
  - 서둘러 들어가며
  lexicon: ταχὺς + εἰσόδῳ
  rationale: 형용사적 표현과 입장 동작을 자연스러운 한국어 동사구로 옮기되, 속도감 있는 행위성을 살렸습니다.
- source_word: εἰς πᾶσαν οἰκίαν
  english_pob_choice: every house
  chosen_korean: 모든 집에
  alternatives_korean:
  - 모든 가정에
  - 각 집마다
  lexicon: πᾶς + οἰκία
  rationale: οἰκία를 ‘가정’보다 더 직접적인 ‘집’으로 옮겨, 모든 거처를 두루 다닌다는 범위를 보존했습니다.
- source_word: ἱλαρότητι
  english_pob_choice: with cheerfulness
  chosen_korean: 기뻐합니다
  alternatives_korean:
  - 명랑하게
  - 즐거움으로
  lexicon: ἱλαρότης
  rationale: 부사구를 ‘기뻐하다’로 풀어, 단순한 태도 묘사보다 내적 즐거움의 뉘앙스를 자연스럽게 드러냈습니다.
- source_word: ὡς ἄκακος
  english_pob_choice: as if innocent
  chosen_korean: 마치 죄 없는 사람처럼
  alternatives_korean:
  - 무죄한 듯
  - 순결한 것처럼
  lexicon: ὡς + ἄκακος
  rationale: ἄκακος를 도덕적 순수함을 드러내는 ‘죄 없는 사람’으로 옮기고, POB의 ‘as if’에 맞게 비교 표지를 유지했습니다.
theological_decisions:
- issue: ὡς ἄκακος의 비교적/가식적 뉘앙스
  chosen_reading: ‘마치 …처럼’으로 옮겨 실제 무죄 선언이 아니라 외양 또는 태도에 대한 비교를 유지했습니다.
  alternative_readings:
  - ‘무죄한 사람으로’
  - ‘순진한 사람처럼’
  rationale: 영문 POB가 ‘as if innocent’로 정정한 점을 따라, 본문의 비교적 성격과 도덕적 긴장을 약화시키지 않았습니다.
