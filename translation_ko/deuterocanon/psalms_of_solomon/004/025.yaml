    reason: alternative_reading
translation:
  language: ko
  text: 그들은 하나님을 노하게 했고, 그들을 땅[a]에서 제거하시도록 그분을 부추겼습니다. 이는 그들이 속임수로 무고한 이들[b]인 체했기[c] 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘땅’은 ‘토지’ 또는 ‘세상’을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘무고한 이들의 혼’입니다. ‘무고한 이들의 생명’ 또는 ‘무고한 이들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘무고한 이들인 체했다’ 또는 ‘무고한 이들의 역할을 했다’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: παρώργυσαν
  english_pob_choice: provoked
  chosen_korean: 분노하게 했고
  alternatives_korean:
  - 노하게 했고
  - 분개하게 했고
  lexicon: BDAG
  rationale: 하나님을 향한 도발적 분노 유발을 자연스러운 현대 한국어로 옮기되, 강한 도덕적 비난을 유지하기 위해 ‘분노하게 하다’를 택했습니다.
- source_word: παρώξυναν
  english_pob_choice: stirred him up
  chosen_korean: 격동시켰습니다
  alternatives_korean:
  - 부추겼습니다
  - 선동했습니다
  - 자극했습니다
  lexicon: LSJ
  rationale: 앞 절의 ‘분노하게 하다’를 강화하는 동작으로서, 하나님을 심판 행동으로 몰아가는 뉘앙스를 살리기 위해 ‘격동시키다’를 사용했습니다.
- source_word: ἐξᾶραι αὐτοὺς ἀπὸ τῆς γῆς
  english_pob_choice: to remove them from the land
  chosen_korean: 그들을 땅에서 제거하시도록
  alternatives_korean:
  - 그들을 그 땅에서 없애시도록
  - 그들을 땅에서 쫓아내시도록
  - 그들을 땅에서 뽑아내시도록
  lexicon: BDAG
  rationale: 문자적으로는 ‘땅/땅에서’이지만, 문맥상 심판 행위의 결과를 분명히 하도록 ‘제거하다’를 택하고, 땅은 본문 그대로 유지했습니다.
- source_word: ὑπεκρίνοντο
  english_pob_choice: pretended to be innocent people
  chosen_korean: 무죄한 사람들인 체했기 때문입니다
  alternatives_korean:
  - 무죄한 사람들인 척했기 때문입니다
  - 무죄한 사람들로 가장했기 때문입니다
  - 무죄한 사람들처럼 행세했기 때문입니다
  lexicon: LSJ
  rationale: 위선적 가장/연기를 뜻하는 동사이므로, ‘체하다’로 외형상 무죄를 가장한 의미를 간결하게 살렸습니다.
theological_decisions:
- issue: ‘땅’의 범위
  chosen_reading: ‘땅’으로 직역해 보존하되, 인간 거주지로서의 ‘그 땅’과 우주적 ‘땅/지면’의 중의성을 그대로 남겼습니다.
  alternative_readings:
  - ‘땅’ 대신 ‘나라’로 좁히기
  - ‘세상’으로 일반화하기
  rationale: 히브리/헬라 문맥에서 γῆ는 토지와 땅 일반을 모두 가리킬 수 있으므로, 본문이 허용하는 범위를 좁히지 않는 것이 더 충실합니다.
  doctrine_reference: 성경어휘의 다의성 보존
- issue: 무죄한 자에 대한 위선
  chosen_reading: ‘무죄한 사람들인 체했다’로 번역해 행위의 위선을 드러냈습니다.
  alternative_readings:
  - ‘무죄한 사람들로 가장했다’
  - ‘무죄한 사람들처럼 보이려 했다’
  rationale: 본문은 단순한 오해가 아니라 의도적 위장을 고발하므로, 위선적 자기연출의 도덕적 성격을 분명히 했습니다.
  doctrine_reference: 위선과 의인성 모방에 대한 성경의 윤리적 평가
