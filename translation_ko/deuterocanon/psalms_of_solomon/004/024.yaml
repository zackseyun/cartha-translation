  yaml_path: translation/deuterocanon/psalms_of_solomon/004/024.yaml
  text: And they did not remember God, and they did not fear God amid all these things.
translation:
  language: ko
  text: 그들은 하나님을 기억하지 않았고, 이 모든 일 가운데 하나님을 두려워하지도 않았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμνήσθησαν
  english_pob_choice: did not remember
  chosen_korean: 기억하지 않았고
  alternatives_korean:
  - 떠올리지 않았고
  - 마음에 두지 않았고
  lexicon: BDAG
  rationale: μιμνῄσκομαι 계열의 의미를 가장 직접적으로 살려, 하나님을 ذهن/마음에서 떠나게 한 태도를 ‘기억하다’로 옮겼습니다.
- source_word: θεοῦ / τὸν θεόν
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신
  - 하느님
  lexicon: 표준 번역 관례
  rationale: 본문의 두 용례 모두 일반 명사 θεός이므로 한국어 성경의 표준 관례에 따라 ‘하나님’으로 일관되게 옮겼습니다.
- source_word: ἐφοβήθησαν
  english_pob_choice: did not fear
  chosen_korean: 두려워하지도 않았습니다
  alternatives_korean:
  - 경외하지도 않았습니다
  - 무서워하지도 않았습니다
  lexicon: BDAG
  rationale: 하나님을 목적어로 한 φοβέομαι는 단순 공포보다 두려움과 경외를 포함하지만, 원문의 직접성을 살려 기본 표현인 ‘두려워하다’를 유지했습니다.
- source_word: ἐν πᾶσι τούτοις
  english_pob_choice: in all these things
  chosen_korean: 이 모든 일 가운데
  alternatives_korean:
  - 이 모든 것 속에서
  - 이 모든 상황 가운데
  lexicon: BDAG
  rationale: 이 구는 앞서 열거된 전체 상황을 배경으로 그들의 실패를 위치시키므로, 한국어로는 문맥적 포괄성을 살린 ‘이 모든 일 가운데’가 자연스럽습니다.
theological_decisions:
- issue: θεόν을 두 번 반복하는 구조의 보존
  chosen_reading: ‘하나님을 기억하지 않았고… 하나님을 두려워하지도 않았습니다’로 반복을 유지했습니다.
  alternative_readings:
  - 두 번째 ‘하나님’을 생략해 자연스럽게 정리하는 방식
  rationale: 원문은 목적어를 반복해 기억의 부재와 두려움의 부재를 병렬로 강조하므로, 한국어에서도 반복을 보존해 도덕적 강도를 살렸습니다.
  doctrine_reference: 본문 수사 구조 보존
