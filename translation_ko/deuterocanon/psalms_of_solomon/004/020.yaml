translation:
  language: ko
  text: 그의 노년이 자녀 없는 외로움[a] 속에, 그가 옮겨질 때까지[b] 있게 하소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘외로움’은 μονίᾳ의 정서적 고립을 살린 번역입니다. 더 중립적으로는 ‘고독’ 또는 ‘외딴 상태’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그가 옮겨질 때까지’는 εἰς ἀνάλημψιν을 문맥상 풀어 옮긴 것입니다. 문자적으로는 ‘제거/옮겨짐을 향하여(위하여)’이며, ‘들려감’ 또는 ‘제거됨’으로도 옮길 수 있습니다.
    reason: alternative_reading
