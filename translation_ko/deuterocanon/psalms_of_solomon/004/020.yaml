- from: 그의 노년이 자녀 없음의 외로움 가운데 있게 하시고, 제거될 때까지이게 하소서.[a][b]
  to: 그의 노년이 자녀 없는 외로움[a] 속에, 그가 옮겨질 때까지[b] 있게 하소서.
  rationale: 문법적으로 불가능한 ‘제거될 때까지이게’를 정상적인 기원문 구조로 바로잡았습니다. ‘그가 옮겨질 때까지’는 영어 감사 기록의 시간적 해석을 따르되, 본문의 ἀνάλημψις가 가질 수 있는 ‘취함/옮겨짐/제거’의 모호성을 주석으로 보존합니다. ‘자녀 없는 외로움’으로 표현을 다듬어 ἀτεκνίας와 μονίᾳ의 결합을 자연스러운 현대 한국어로 전달했습니다.
  reviewer_model: gpt-5.6-terra
