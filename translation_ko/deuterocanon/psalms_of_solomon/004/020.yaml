  rationale: 주변 문맥이 판단을 구하는 연속된 기원문이므로, 무표지 절의 화행을 한국어에서도 유지하는 것이 본문 기능을 가장 잘 드러냅니다.
  doctrine_reference: 본문의 저주적 기세를 약화시키지 않음
- issue: εἰς ἀνάλημψιν의 시간성 여부
  chosen_reading: 명시적 시간 부가 없이 ‘제거될 때까지’로 옮겼습니다.
  alternative_readings:
  - ‘제거를 위하여’
  - ‘옮겨짐을 위하여’
  rationale: 그리스어 자체가 ‘~을 위하여’보다 ‘~로/까지의 방향성’을 강하게 띠므로, 불필요한 해석을 덧붙이지 않도록 했습니다.
  doctrine_reference: source-directed rendering
