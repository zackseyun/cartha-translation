translation:
  language: ko
  text: 그의 노년이 자녀 없음의 외로움 가운데 있게 하시고, 제거될 때까지이게 하소서.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘외로움’은 μονίᾳ의 정서적 고립을 살린 번역이며, 더 중립적인 ‘고독’도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘제거될 때까지’는 εἰς ἀνάλημψιν을 풀어 옮긴 것으로, 문자적으로는 ‘제거를 위하여’ 또는 ‘들려감/옮겨짐을 위하여’입니다.
    reason: alternative_reading
