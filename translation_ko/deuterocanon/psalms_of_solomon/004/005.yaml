  yaml_path: translation/deuterocanon/psalms_of_solomon/004/005.yaml
  text: At night and in secret places he sins as though unseen[c][b][a]; with his eyes he speaks to every woman in a scheme of evil.
  footnotes:
  - marker: a
    text: Or 'in hidden places.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'with his eyes he speaks'—an image of silent, suggestive signaling.
    reason: cultural_note
  - marker: c
    text: Or 'in an evil plot' / 'in a conspiracy of evil.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 밤에, 또 숨은 곳에서[a] 보이지 않는 듯이 죄를 짓습니다. 그는 눈으로[b] 모든 여자에게 악한 계책을 꾸미며[c] 말합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘감추어진 곳에서’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 눈으로 말합니다’입니다. 말 없이 암시적으로 신호하는 모습을 나타냅니다.
    reason: cultural_note
  - marker: c
    text: 직역하면 ‘악의 계획 안에서’입니다. 또는 ‘악한 음모를 꾸미며’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν νυκτὶ καὶ ἐν ἀποκρύφοις
  english_pob_choice: At night / in secret places
  chosen_korean: 밤에 그리고 숨은 곳에서
  alternatives_korean:
  - 밤에 그리고 비밀한 곳에서
  - 밤에 그리고 감추어진 곳에서
  lexicon: BDAG
  rationale: νυκτί는 시간 표현으로, ἀποκρύφοις는 추상적인 '몰래'보다 실제로 숨겨진 장소들을 가리키므로 '숨은 곳에서'가 구체성을 살립니다.
- source_word: ἁμαρτάνει
  english_pob_choice: he sins
  chosen_korean: 죄를 짓습니다
  alternatives_korean:
  - 죄를 범합니다
  - 죄를 저지릅니다
  lexicon: BDAG
  rationale: 동사의 직접적 의미를 살려 도덕적 무게를 분명히 하되, 현대 한국어의 자연스러운 종결로 옮겼습니다.
- source_word: ὡς οὐχ ὁρώμενος
  english_pob_choice: as though unseen
  chosen_korean: 사람의 눈에 띄지 않는 듯이
  alternatives_korean:
  - 보이지 않는 듯이
  - 보지 못하는 듯이
  lexicon: BDAG
  rationale: 그가 남의 시선을 피한다고 여기는 상태를 드러내기 위해 '눈에 띄지 않는 듯이'로 풀어, 비교적(ὡς)의 뉘앙스를 보존했습니다.
- source_word: ἐν ὀφθαλμοῖς αὐτοῦ λαλεῖ
  english_pob_choice: with his eyes he speaks
  chosen_korean: 눈으로는 … 말합니다
  alternatives_korean:
  - 눈으로 말합니다
  - 눈짓으로 말합니다
  lexicon: BDAG
  rationale: 직역형 이미지를 유지하되 한국어에서 자연스럽게 읽히도록 '눈으로는'을 써서 무언의 신호라는 감각을 살렸습니다.
- source_word: ἐν συνταγῇ κακίας
  english_pob_choice: in a scheme of evil
  chosen_korean: 악의 계책 속에서
  alternatives_korean:
  - 악한 음모 속에서
  - 악의 음모 가운데
  lexicon: LSJ
  rationale: συνταγή는 단순한 '악'보다 계획·편성의 뉘앙스가 있어 '계책'으로 옮기고, 그 구조를 '속에서'로 반영했습니다.
theological_decisions:
- issue: 빛/어둠과 은밀한 죄의 묘사
  chosen_reading: '''밤에''와 ''숨은 곳에서''를 모두 살려, 죄가 드러나지 않는다고 여기는 인간의 자기기만을 그대로 드러냈습니다.'
  alternative_readings:
  - '''몰래''로 압축해 자연스럽게 옮기는 방식'
  - '''비밀한 곳에서''로 더 일반화하는 방식'
  rationale: 시적 경구의 이미지와 도덕적 경고를 약화시키지 않기 위해, 장소성과 은폐성을 함께 유지했습니다.
  doctrine_reference: 인간의 숨은 죄와 하나님의 전지에 대한 성경적 주제
- issue: 은밀한 음행의 의도적 신호
  chosen_reading: '''눈으로는 … 말합니다''를 유지해, 말 없이 유혹을 전달하는 몸짓의 죄성을 직접 보이게 했습니다.'
  alternative_readings:
  - '''눈짓으로 말합니다''로 설명적으로 바꾸는 방식'
  - '''눈으로 신호를 보냅니다''로 완화하는 방식'
  rationale: 원문의 시각적·도발적 이미지를 약화시키지 않도록, 은유를 너무 평이하게 풀지 않았습니다.
  doctrine_reference: 정결과 탐욕에 대한 지혜문학적 경계
