source:
  edition: lxx-swete-1909
  text: οὐκ ἀπέστη ἕως ἐνίκησεν σκορπίσαι ὡς ἐν ὀρφανίᾳ. καὶ ἠρήμωσεν οἶκον ἕνεκεν ἐπιθυμίας παρανόμου.
  language: Greek
  pages:
  - 793
  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/004/013.yaml
  text: He did not stop until he had succeeded in scattering them as in orphanhood[c][b][a], and he made a house desolate because of lawless desire.
  footnotes:
  - marker: a
    text: Or 'as in bereavement' / 'as among the fatherless' for ὡς ἐν ὀρφανίᾳ.
    reason: lexical_alternative
  - marker: b
    text: '''House'' likely carries the broader sense of ''household'' here, given the surrounding context of destroying families.'
    reason: cultural_note
  - marker: c
    text: Or 'scattering the household'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 그들을 고아 상태처럼[a] 흩어버리는 데 성공할 때까지 멈추지 않았고, 법 없는 욕망 때문에 한 집안을 황폐하게 만들었습니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘고아가 된 것처럼’, ‘부모를 잃은 것처럼’으로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘집안’은 여기서 주변 문맥에 비추어 ‘가정/가계’의 뜻을 포함할 가능성이 큽니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘한 집안을 흩어버리는’으로도 볼 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: οὐκ ἀπέστη
  english_pob_choice: He did not stop
  chosen_korean: 멈추지 않았고
  alternatives_korean:
  - 그만두지 않았고
  - 중단하지 않았고
  - 쉬지 않았고
  lexicon: LSJ
  rationale: 지속적인 가해 행위를 자연스러운 현대 한국어로 옮기되, 단순한 물리적 ‘떠남’이 아니라 행위의 중지를 가리키는 힘을 살렸습니다.
- source_word: ἐνίκησεν σκορπίσαι
  english_pob_choice: had succeeded in scattering
  chosen_korean: 흩어버리는 데 성공할 때까지
  alternatives_korean:
  - 흩어지게 하는 데 이길 때까지
  - 흩어버리려 이길 때까지
  - 흩어버리도록 이겨
  lexicon: LSJ
  rationale: ἐνίκησεν은 여기서 군사적 ‘승리’보다 목적 달성의 성공을 가리키므로 ‘성공하다’로 옮겨, 뒤의 부정사 σκορπίσαι의 결과 목적을 살렸습니다.
- source_word: ὡς ἐν ὀρφανίᾳ
  english_pob_choice: as in orphanhood
  chosen_korean: 고아 상태처럼
  alternatives_korean:
  - 고아 됨처럼
  - 부모를 잃은 것처럼
  - 고아들 가운데 있는 듯이
  lexicon: LSJ
  rationale: 낯선 비유를 완화하지 않고, 가족이 끊겨 보호받지 못하는 상태를 드러내는 ‘고아 상태’로 간결하게 살렸습니다.
- source_word: ἠρήμωσεν οἶκον
  english_pob_choice: he made a house desolate
  chosen_korean: 한 집안을 황폐하게 만들었습니다
  alternatives_korean:
  - 한 집을 황폐하게 했습니다
  - 한 가문을 황폐하게 했습니다
  - 한 집안을 폐허로 만들었습니다
  lexicon: LSJ
  rationale: οἶκον은 문맥상 단순 건물보다 가족 단위를 가리키므로 ‘집안’으로 옮겼고, ἠρήμωσεν의 파괴적 뉘앙스는 ‘황폐하게 만들다’로 살렸습니다.
- source_word: ἕνεκεν ἐπιθυμίας παρανόμου
  english_pob_choice: because of lawless desire
  chosen_korean: 법 없는 욕망 때문에
  alternatives_korean:
  - 불법한 욕망 때문에
  - 율법을 어기는 욕망 때문에
  - 무법한 정욕 때문에
  lexicon: LSJ
  rationale: παράνομος의 도덕적·법적 어감을 살리면서도, 성경적 문맥에서 너무 기술적이지 않은 ‘법 없는 욕망’으로 옮겼습니다.
theological_decisions:
- issue: οἶκον의 범위
  chosen_reading: ‘집안’으로 옮겨, 단순한 건물 파괴가 아니라 가족·가계의 붕괴를 드러냈습니다.
  alternative_readings:
  - ‘집’으로 직역
  - ‘가정’으로 순화
  rationale: 주석이 지적하듯 문맥상 broader sense가 ‘household’이므로, 한국어에서도 가족 공동체의 파괴를 분명히 하는 번역이 더 स्रोत에 가깝습니다.
  doctrine_reference: 성경적 ‘집/가문’ 이미지와 가정 파괴의 문맥적 의미
