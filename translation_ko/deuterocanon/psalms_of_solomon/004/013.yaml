review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. σκορπίσαι의 목적어는 그리스어에 명시되지 않았으므로 문맥상 ‘그들을’은 보충할 수 있으나, 이를 ‘집안’으로 확정하여 본문에 넣어서는 안 됩니다. 현행 본문은 이 점을 지키고 있습니다. 다만 ὡς ἐν ὀρφανίᾳ의 비유는 ‘고아 상태처럼’보다 ‘고아가 된 것처럼’이 현대 한국어에서 더 자연스럽고, 원문의 상실·보호 부재의 이미지를 더 직접적으로 전달합니다. παράνομος는 단순히 ‘법 없는’ 상태라기보다 법을 거스르는 성격을 뜻하므로 ‘법을 어기는 욕망’으로 바로잡는 것이 낫습니다.
  naturalness: ‘고아 상태처럼 흩어버리다’와 ‘법 없는 욕망’은 현대 표준 한국어에서 다소 어색하거나 의미 관계가 불분명합니다. ‘고아가 된 것처럼 흩어버리다’, ‘법을 어기는 욕망’은 합쇼체의 문체를 유지하면서 자연스럽습니다. 각주 표지도 해당 어구 가까이에 재배치해야 합니다.
  terminology: οἶκος는 건물만이 아니라 집안·가정·가계를 포함할 수 있으므로 ‘한 집안’을 유지할 수 있습니다. ἠρημόω의 황폐화 의미도 ‘황폐하게 만들었습니다’에 보존되어 있습니다. ‘법을 어기는 욕망’은 παράνομος의 윤리적·법적 의미를 보존하되 특정 교리적 의미를 덧씌우지 않습니다.
  issues:
  - severity: medium
    issue: ‘법 없는 욕망’은 παράνομος의 수식 관계와 한국어 관용을 충분히 드러내지 못합니다.
    rationale: παράνομος는 ‘법이 존재하지 않는’이라는 뜻보다 ‘법을 거스르는/불법한’이라는 성격을 나타냅니다. ‘법을 어기는 욕망’이 의미를 명료하게 전달합니다.
  - severity: medium
    issue: 각주 c가 문장 끝에 놓여 있고, 그 내용이 σκορπίσαι의 무명시적 목적어와 다음 절의 οἶκον을 혼동할 소지가 있습니다.
    rationale: ‘한 집안을 흩어버리는’은 본문 그리스어의 명시적 목적어가 아니라 문맥적 해석입니다. σκορπίσαι 바로 뒤에 각주를 두고 목적어가 본문에 명시되지 않았음을 밝혀야 원문의 모호성을 보존합니다.
  - severity: low
    issue: ‘고아 상태처럼’은 비유의 표현으로 다소 딱딱하고 수식 범위가 불분명합니다.
    rationale: ‘고아가 된 것처럼’은 ὀρφανία의 상실과 취약함의 이미지를 더 자연스럽게 재현하며, 대안 번역은 각주에서 보존할 수 있습니다.
