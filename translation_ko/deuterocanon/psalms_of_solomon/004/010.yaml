  - marker: b
    text: '''House'' may also carry the sense of household or estate, not merely the building itself.'
    reason: lexical_alternative
  - marker: c
    text: Or 'to destroy' or 'to overthrow one another's wisdom.'
    reason: lexical_alternative
  - marker: d
    text: Or 'with lawless words'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그들의 눈은 번영을 누리는 한 사람의 집을 뱀처럼 노려보며, 무법한 자들의 말로 서로의 지혜를 무너뜨리려 합니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집’은 건물뿐 아니라 가정, 가산, 또는 집안 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ἐν εὐσταθείᾳ는 ‘안정’, ‘안전’, ‘평안한 형편’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: διαλῦσαι는 ‘무너뜨리다’ 외에도 ‘파괴하다’, ‘뒤엎다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: παρανόμων은 속격 복수로 쓰인 ‘무법한 자들의’라는 뜻이므로, ‘무법한 말’로 이해하지 않습니다.
    reason: grammatical_explanation
