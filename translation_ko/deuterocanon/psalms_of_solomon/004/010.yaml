base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/004/010.yaml
  text: And their eyes are on a man's house in prosperity[a], like a snake[d][c][b], to undo one another's wisdom with lawless words.
  footnotes:
  - marker: a
    text: Or 'in stability,' 'in security,' or 'in well-being.' The Greek term can denote firmness or settled prosperity.
    reason: lexical_alternative
  - marker: b
    text: '''House'' may also carry the sense of household or estate, not merely the building itself.'
    reason: lexical_alternative
  - marker: c
    text: Or 'to destroy' or 'to overthrow one another's wisdom.'
    reason: lexical_alternative
  - marker: d
    text: Or 'with lawless words'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그들의 눈은 한 사람의 집의 번영에, 마치 뱀처럼, 서로의 지혜를 무법한 자들의 말로 무너뜨리려 합니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집’은 건물뿐 아니라 가정, 가산, 또는 집안 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ἐν εὐσταθείᾳ는 ‘안정’, ‘안전’, ‘평안한 형편’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: διαλῦσαι는 ‘무너뜨리다’ 외에도 ‘파괴하다’, ‘뒤엎다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: παρανόμων은 ‘무법한 자들의’라는 뜻으로, ‘무법한 말’이라는 뜻이 아닙니다.
    reason: textual_variant
lexical_decisions:
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  english_pob_choice: their eyes
  chosen_korean: 그들의 눈
  alternatives_korean:
  - 그들의 시선
  - 그들의 눈길
  lexicon: LSJ
  rationale: 몸의 이미지와 비난의 어조를 살리기 위해 직역에 가깝게 옮겼습니다.
- source_word: ἐπʼ οἶκον ἀνδρὸς
  english_pob_choice: on a man's house
  chosen_korean: 한 사람의 집의
  alternatives_korean:
  - 한 사람의 집을 향해
  - 한 사람의 집안에
  lexicon: LSJ
  rationale: house를 기본적으로 ‘집’으로 두되, 문맥상 가정·가산의 뜻도 열어 두었습니다.
- source_word: ἐν εὐσταθείᾳ
  english_pob_choice: in prosperity
  chosen_korean: 번영에
  alternatives_korean:
  - 안정에
  - 안전함에
  - 잘됨에
  lexicon: LSJ
  rationale: 이 구절에서는 안정된 형편과 형통함의 뉘앙스를 함께 담는 말로 ‘번영’을 택했습니다.
- source_word: ἐν λόγοις παρανόμων
  english_pob_choice: with lawless words
  chosen_korean: 무법한 자들의 말로
  alternatives_korean:
  - 불법한 말로
  - 법을 어기는 자들의 말로
  lexicon: LSJ
  rationale: παρανόμων이 형용사가 아니라 속격 복수 실질명사이므로, ‘법 없는 말’보다 ‘무법한 자들의 말’이 원문의 문법과 의미를 더 잘 반영합니다.
theological_decisions:
- issue: 비유적 동작의 방향
  chosen_reading: ‘to undo’의 파괴적 목적을 ‘무너뜨리려 합니다’로 옮겨, 지혜를 해체·전복하려는 의도를 드러냈습니다.
  alternative_readings:
  - 파괴하려 합니다
  - 뒤엎으려 합니다
  rationale: διαλῦσαι는 단순 훼손보다 분해·해체의 느낌이 있어, 결과를 과장하지 않으면서도 공격성을 살렸습니다.
  doctrine_reference: 본문 해석
