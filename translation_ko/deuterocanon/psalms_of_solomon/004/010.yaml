  text: And their eyes are on a man's house in prosperity[a], like a snake[d][c][b], to undo one another's wisdom with lawless words.
  footnotes:
  - marker: a
    text: Or 'in stability,' 'in security,' or 'in well-being.' The Greek term can denote firmness or settled prosperity.
