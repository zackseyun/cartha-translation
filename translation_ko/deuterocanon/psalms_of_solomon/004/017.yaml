  text: May his life be in pains and poverty and want[a], O Lord; his sleep in griefs[b], and his waking in distresses.
  footnotes:
  - marker: a
    text: Or "in distress" / "in want" for both occurrences of ἀπορία; the Greek term can denote severe lack, helplessness, or distress depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'His life is in pains and poverty and want, O Lord; his sleep is in griefs, and his waking in distress.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그의 삶이 고통과 가난과 궁핍 속에 있게 하소서, 주님. 그의 잠은 슬픔 속에, 그의 깨어남은 궁핍 속에 있게 하소서.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ἀπορία를 두 곳 모두 ‘곤궁’ 또는 ‘곤란’으로 옮길 수 있습니다. 이 말은 문맥에 따라 심한 결핍, 무력한 처지, 또는 곤경을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 평서문으로, ‘그의 삶은 고통과 가난과 궁핍 속에 있습니다, 주님. 그의 잠은 슬픔 속에 있고, 그의 깨어남은 궁핍 속에 있습니다’로 옮길 수 있습니다. 그러나 앞뒤의 기원적 저주 문맥에서는 본문의 ‘있게 하소서’가 더 적절합니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ἐν ὀδύναις
  english_pob_choice: in pains
  chosen_korean: 고통 속에
  alternatives_korean:
  - 아픔 속에
  - 괴로움 속에
  - 통증들 속에
  lexicon: BDAG
  rationale: ἐν + 여격은 상태/영역을 나타내므로, 삶 전체가 고통의 영역에 놓이는 뜻을 살려 ‘고통 속에’로 옮겼습니다.
- source_word: πενίᾳ
  english_pob_choice: poverty
  chosen_korean: 가난
  alternatives_korean:
  - 빈곤
  - 궁핍
  - 결핍
  lexicon: LSJ
  rationale: 물질적 부족을 가리키는 말로서, 현대 한국어에서 가장 직접적인 대응은 ‘가난’입니다.
- source_word: ἀπορίᾳ / ἀπορίαις
  english_pob_choice: want / distresses
  chosen_korean: 궁핍 / 곤궁들
  alternatives_korean:
  - 결핍 / 고난들
  - 궁핍 / 어려움들
  - 곤란 / 곤궁들
  lexicon: LSJ
  rationale: 같은 어근이 반복되므로 의미 연속성을 살리되, 첫째는 상태 전체를 ‘궁핍’으로, 둘째는 복수형 뉘앙스를 드러내기 위해 ‘곤궁들’로 옮겼습니다.
- source_word: ὕπνος
  english_pob_choice: sleep
  chosen_korean: 잠
  alternatives_korean:
  - 수면
  - 잠잠함
  lexicon: BDAG
  rationale: 자연스러운 현대 한국어로 수면 상태를 가리키는 기본어이므로 ‘잠’이 가장 직접적입니다.
- source_word: ἐξέγερσις
  english_pob_choice: waking
  chosen_korean: 깨어남
  alternatives_korean:
  - 일어남
  - 각성
  - 기상
  lexicon: LSJ
  rationale: 잠에서 벗어나는 상태를 가리키므로, ‘sleep’과 대응되는 자연스러운 명사형으로 ‘깨어남’을 택했습니다.
theological_decisions:
- issue: '문장의 서법: 평서문이 아니라 저주/기원문'
  chosen_reading: ‘그의 삶이 … 있게 하소서’처럼 소망·저주의 기원문으로 번역했습니다.
  alternative_readings:
