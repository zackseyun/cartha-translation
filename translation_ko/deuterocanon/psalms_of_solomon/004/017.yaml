  rationale: 그리스어는 서술어가 생략된 연속적 기원문 맥락에 있으므로, 한국어에서도 단순 진술이 아니라 저주적 기원으로 드러내야 합니다.
  doctrine_reference: 시적 저주 형식의 서법 보존
