  - severity: low
    issue: 각주 b가 본문을 그대로 반복함
    rationale: 각주는 이전 평서문 번역이라는 영어 감사 기록상의 대안을 실제로 제시해야 하며, 본문과 같은 문장을 ‘직역’이라고 반복해서는 안 됩니다.
