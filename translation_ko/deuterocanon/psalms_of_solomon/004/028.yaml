- source_word: τοὺς ποιοῦντας ἐν ὑπερηφανίᾳ πᾶσαν ἀδικίαν
  english_pob_choice: those who do every kind of unrighteousness in arrogance
  chosen_korean: 교만 가운데서 모든 불의를 행하는 자들
