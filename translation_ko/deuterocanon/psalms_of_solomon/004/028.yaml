base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/004/028.yaml
  text: May God remove those who do every kind of unrighteousness in arrogance[c][b][a], for the Lord our God is a great and mighty judge in righteousness.
  footnotes:
  - marker: a
    text: Or 'every injustice' for 'every kind of unrighteousness.'
    reason: lexical_alternative
  - marker: b
    text: 'The opening Greek form can also be understood more literally as ''God to remove,'' expressing a wish or imprecation: ''May God remove ...'''
    reason: alternative_reading
  - marker: c
    text: Or 'in justice' for 'in righteousness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서 교만 가운데서 모든 불의를 행하는 자들을 없애 주시기를 바랍니다. 우리 하나님 주님은 의로우신 큰 심판자이시며 능력이 크십니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 불의’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 개시형은 더 문자적으로 ‘하나님께서 제거하시기를’로도 이해될 수 있으며, 기원이나 저주의 뜻을 나타냅니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘의로’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξᾶραι
  english_pob_choice: May God remove
  chosen_korean: 하나님께서 … 없애 주시기를 바랍니다
  alternatives_korean:
  - 제거하시기를 바랍니다
  - 끊어 버리시기를 바랍니다
  - 치워 버리시기를 바랍니다
  lexicon: LSJ
  rationale: 부정과 탄원의 뉘앙스를 살리면서도, 한국어에서 자연스러운 기원문으로 옮기기 위해 ‘없애 주시기를 바랍니다’를 택했습니다.
- source_word: τοὺς ποιοῦντας ἐν ὑπερηφανίᾳ πᾶσαν ἀδικίαν
  english_pob_choice: those who do every kind of unrighteousness in arrogance
  chosen_korean: 교만 가운데서 모든 불의를 행하는 자들
  alternatives_korean:
  - 교만하게 모든 불의를 행하는 자들
  - 오만 가운데서 온갖 불의를 행하는 자들
  lexicon: BDAG
  rationale: 행위의 지속성을 드러내는 분사구를 ‘행하는 자들’로 옮기고, ἐν ὑπερηφανίᾳ는 태도와 영역을 살려 ‘교만 가운데서’로 표현했습니다.
- source_word: Κύριος ὁ θεὸς ἡμῶν
  english_pob_choice: the Lord our God
  chosen_korean: 우리 하나님 주님
  alternatives_korean:
  - 우리 주 하나님
  - 우리의 주 하나님
  lexicon: BDAG
  rationale: κύριος는 이 문맥에서 신적 칭호이므로 ‘주님’으로 옮기되, 앞의 ‘하나님’과 결합해 문장의 호칭 구조를 보존했습니다.
- source_word: ἐν δικαιοσύνῃ
  english_pob_choice: in righteousness
  chosen_korean: 의로우신
  alternatives_korean:
  - 의 가운데서
  - 의 안에서
  - 의롭게
  lexicon: BDAG
  rationale: 심판의 방식과 인격적 성품을 함께 드러내는 문맥이므로, ‘의로우신’으로 풀어 자연스럽게 압축했습니다.
theological_decisions:
- issue: 임precatory(저주/탄원) 구문의 한국어 어조
  chosen_reading: 직설적 저주보다 기원형을 유지했습니다.
  alternative_readings:
  - 하나님께서 … 제거해 버리소서
  - 하나님께서 … 멸하시기를 바랍니다
  rationale: 원문은 기도문 형태의 탄원이며, 한국어에서는 합쇼체 기원형이 이 문맥의 간구성과 공적 낭송성을 가장 잘 살립니다.
  doctrine_reference: Psalms of Solomon의 탄원/심판 기도 어조
