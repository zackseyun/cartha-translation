  yaml_path: translation/deuterocanon/psalms_of_solomon/004/008.yaml
  text: May God expose the deeds of the man-pleaser[a], his deeds with ridicule and derision.
  footnotes:
  - marker: a
    text: Or 'the one who pleases people; may his deeds be for ridicule and derision.'.
    reason: previous_rendering
translation:
  language: ko
  text: 하나님께서 사람을 기쁘게 하는 자의 행위를 드러내시어, 그의 행위가 조롱과 조소 가운데 있게 하소서.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνακαλύψαι ὁ θεὸς
  english_pob_choice: May God expose
  chosen_korean: 하나님께서 … 드러내시어
  alternatives_korean:
  - 하나님께서 … 폭로하시어
  - 하나님께서 … 드러내게 하소서
  lexicon: LSJ
  rationale: 부정과시적/간구적 용법을 한국어에서는 목적절형의 기원문으로 자연스럽게 옮기되, 단순 미래형이 아니라 ‘드러내시어’로 심판적 폭로의 뉘앙스를 살렸습니다.
- source_word: τὰ ἔργα
  english_pob_choice: the deeds
  chosen_korean: 행위를
  alternatives_korean:
  - 일들을
  - 행동들을
  - 행적을
  lexicon: LSJ
  rationale: 여기서 ἔργα는 도덕적으로 드러날 수 있는 구체적 행위를 가리키므로, 중립적인 ‘일’보다 ‘행위’가 문맥상 더 적합합니다.
- source_word: ἀνθρώπων ἀρεσκόν
  english_pob_choice: the man-pleaser
  chosen_korean: 사람을 기쁘게 하는 자
  alternatives_korean:
  - 사람비위를 맞추는 자
  - 사람을 기쁘게 하는 사람
  - 사람들에게 잘 보이려는 자
  lexicon: LSJ
  rationale: 영어 POB의 ‘man-pleaser’는 한국어에서 직역 투의 ‘사람비위꾼’보다, 소스가 가리키는 윤리적 범주를 분명하게 하는 ‘사람을 기쁘게 하는 자’가 더 정확하고 읽기 자연스럽습니다.
- source_word: ἐν καταγέλωτι καὶ μυκτηρισμῷ
  english_pob_choice: with ridicule and derision
  chosen_korean: 조롱과 조소 가운데
  alternatives_korean:
  - 조롱과 비웃음 가운데
  - 조롱과 멸시 가운데
  - 비웃음과 조소 속에
  lexicon: LSJ
  rationale: 두 명사구는 노출된 행위가 받는 공개적 수치와 경멸을 함께 나타내므로, ‘조롱과 조소 가운데’로 병렬성과 분위기를 보존했습니다.
- source_word: τὰ ἔργα αὐτοῦ
  english_pob_choice: his deeds
  chosen_korean: 그의 행위
  alternatives_korean:
  - 그의 일들
  - 그의 행동들
  - 그의 행적
  lexicon: LSJ
  rationale: 반복되는 ἔργα를 한국어에서도 반복해 연결성을 살리되, 문장 유창성을 위해 동일한 단어 ‘행위’를 유지했습니다.
theological_decisions:
- issue: 간구형 동사의 한국어 재현
  chosen_reading: 직설 미래가 아니라 하나님께 대한 기원문으로 읽히도록 ‘드러내시어 … 있게 하소서’로 옮겼습니다.
  alternative_readings:
  - 하나님께서 드러내십니다
  - 하나님께서 드러내실 것입니다
  rationale: 원문 ἀνακαλύψαι는 문법적으로 부정과시형이지만, 문맥상 저주/간구의 힘을 가지므로 한국어도 기원문 형식을 유지해야 합니다.
  doctrine_reference: 시편적 저주-간구의 수사, 원문 담화 기능
