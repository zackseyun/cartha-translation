  source_fidelity: ‘회중’은 συνεδρίῳ(앉아서 심의·의결하는 모임, 곧 council)의 제도적 의미를 충분히 드러내지 못합니다. 또한 ἐν παροιμίαις의 뜻 범위는 본문의 ‘속담’과 각주로 적절히 보존할 수 있습니다. 완료형 ἀφέστηκεν은 마음이 이미 주님에게서 멀리 떠나 있는 상태를 나타내므로 이를 더 분명히 반영했습니다.
  naturalness: ‘거룩한 공의회’는 이 문맥에서 ‘거룩한 회중’보다 원문의 심의체 의미를 자연스럽게 전달합니다. ‘마음은 주님에게서 멀리 떠나 버렸으면서도’는 완료의 결과 상태와 대조를 자연스러운 현대 한국어 합쇼체로 표현합니다.
  terminology: βέβηλε는 ‘불경한 자여’로 유지할 수 있으며, κύριος는 문맥상 ‘주님’이 적절합니다. ὅσιος는 ‘거룩한’ 또는 ‘경건한’으로 논의될 수 있으나, 원문의 성스러운 모임이라는 대조를 보존하는 ‘거룩한 공의회’를 채택합니다. 특정 집단이나 교리적 해석은 부과하지 않습니다.
