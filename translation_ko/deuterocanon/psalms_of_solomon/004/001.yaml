lexical_decisions:
- source_word: βέβηλε
  english_pob_choice: profane one
  chosen_korean: 불경한 자
  alternatives_korean:
  - 더러운 자
  - 속된 자
  - 하나님을 모독하는 자
  lexicon: LSJ
  rationale: vocative의 날카로운 비난을 살리면서도 현대 한국어에서 자연스럽고 직접적인 표현으로 옮겼습니다.
- source_word: συνεδρίῳ ὁσίῳ
  english_pob_choice: holy council
  chosen_korean: 거룩한 회중
  alternatives_korean:
  - 거룩한 شورا(공의회)
  - 거룩한 의회
  - 성결한 회중
  lexicon: LSJ
  rationale: συνεδρίον은 모인 심의체를 가리키므로 ‘회중’이 자연스럽고, ὅσιος의 공의성/경건성을 ‘거룩한’으로 압축해 반영했습니다.
- source_word: ἐν παροιμίαις
  english_pob_choice: with proverbs
  chosen_korean: 속담으로
  alternatives_korean:
  - 속담들과 함께
  - 잠언으로
  - 수수께끼 같은 말로
  lexicon: LSJ
  rationale: 문맥상 단순한 ‘잠언’보다 비난적·비꼬는 말의 뉘앙스가 있어, 한국어에서 더 자연스럽게 들리는 ‘속담으로’를 본문에 두었습니다.
- source_word: παροργίζων
  english_pob_choice: provoking
  chosen_korean: 격노하게 합니까
  alternatives_korean:
  - 분노하게 합니까
  - 노하게 합니까
  - 화나게 합니까
  lexicon: LSJ
  rationale: 동사의 결과를 분명히 드러내기 위해 ‘격노하게 하다’를 사용해, 하나님을 향한 도발적 성격을 살렸습니다.
