translation:
  language: ko
  text: 하나님께서 위선 가운데 사는 자들을 경건한 이들 가운데서 제거하시기를, 그들의 육체의 부패와 그들의 삶의 빈곤 가운데서.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “뽑아내시기를”, “없애시기를”.
    reason: lexical_alternative
  - marker: b
    text: 그리스어의 ‘그의 육체’와 ‘그의 삶’은 집단을 가리키는 분포적 단수입니다.
    reason: source_note
  - marker: c
    text: 또는 “경건한 이들 가운데서”.
    reason: lexical_alternative
  - marker: d
    text: 또는 “그의 육체의 부패와 그의 삶의 빈곤 가운데서”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξάραι
  english_pob_choice: remove
  chosen_korean: 제거하시기를
  alternatives_korean:
  - 없애시기를
  - 뽑아내시기를
  - 치워 주시기를
  lexicon: LSJ
  rationale: 청원형 문맥에서 ἐξάραι의 제거·제외 의미를 살리면서, 단순한 물리적 이동보다 단호한 추방감을 전합니다.
- source_word: ἐν ὑποκρίσει
  english_pob_choice: hypocrisy
  chosen_korean: 위선 가운데
  alternatives_korean:
  - 위선 속에서
  - 가식 가운데
  - 속임수 가운데
  lexicon: LSJ
  rationale: ὑποκρίσει의 윤리적·종교적 비난 강도를 살리되, 한국어로 자연스러운 상태 표현인 ‘가운데’를 택했습니다.
- source_word: ὁσίων
  english_pob_choice: the pious
  chosen_korean: 경건한 이들
  alternatives_korean:
  - 경건한 자들
  - 신실한 이들
  - 거룩한 이들
  lexicon: LSJ
  rationale: 이 책의 문맥상 ὅσιοι는 일반적 ‘거룩한’보다 특정 공동체적 범주의 ‘경건한 이들’이 더 정확하여, 해당 구분을 유지했습니다.
- source_word: ἐν φθορᾷ σαρκός αὐτοῦ
  english_pob_choice: in the corruption of his flesh
  chosen_korean: 그들의 육체의 부패와
  alternatives_korean:
  - 그의 육체의 부패 가운데
  - 육체의 부패 가운데
  - 그의 살의 부패와
  lexicon: LSJ
  rationale: φθορά를 추상적 ‘부패’로, σάρξ를 문자적으로 ‘육체’로 옮겨 육체적 쇠락이라는 감각을 유지했습니다.
- source_word: τὴν ζωὴν αὐτοῦ
  english_pob_choice: his life
  chosen_korean: 그들의 삶의 빈곤
  alternatives_korean:
  - 그의 삶의 빈곤
  - 그들의 생명의 빈곤
  - 그들의 삶을
  lexicon: LSJ
  rationale: 본문의 분포적 단수 대명사를 한국어에서는 문맥상 복수 집단에 걸리는 표현으로 처리하되, ‘빈곤’으로 πενίᾳ와의 대응을 살렸습니다.
theological_decisions:
