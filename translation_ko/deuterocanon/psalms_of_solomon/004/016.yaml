theological_decisions:
- issue: 저주 시(imprecatory wish)의 문체 유지
  chosen_reading: 문장을 평서가 아니라 주님께 드리는 직접적인 저주적 소원으로 옮겼습니다.
  alternative_readings:
  - 예언적 진술처럼 평탄하게 옮김
  - 완곡한 바람 표현으로 약화함
  rationale: γένοιτο와 Κύριε의 결합은 단순한 묘사보다 간구·저주 성격이 강하므로, 그 긴장을 약화하지 않도록 기도체를 유지했습니다.
  doctrine_reference: imprecatory prayer
- issue: ‘주님 앞에서’의 방향성 보존
  chosen_reading: πρὸς/ἐνώπιόν σου 계열의 의미를 ‘주님 앞에서’로 유지했습니다.
  alternative_readings:
  - 주님 보시기에
  - 주님 앞에
  - 주님 면전에서
  rationale: 하나님 앞에서의 공개적·법정적 상태를 드러내기 위해 친숙하지만 소스에 충실한 ‘주님 앞에서’를 택했습니다.
  doctrine_reference: divine presence and judgment
