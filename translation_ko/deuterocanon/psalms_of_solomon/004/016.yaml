translation:
  language: ko
  text: 주님, 그의 몫이 주님 앞에서 불명예가 되게 하시고, 그의 나감은 탄식 가운데, 그의 들어옴은 저주 가운데 있게 하소서.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘몫’은 여기서 ‘분깃’ 또는 ‘배당된 몫’으로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나감’과 ‘들어옴’은 한 사람의 삶 전체의 움직임을 가리키는 성경적 병행 표현일 가능성이 큽니다.
    reason: cultural_note
  - marker: c
    text: ‘저주 가운데’는 헬라어로 문자적으로 ‘저주 안에’에 가깝습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘주님, 그의 몫이 주님 앞에서 불명예 가운데 있게 하시고, 그의 나감은 탄식 가운데, 그의 들어옴은 저주 가운데 있게 하소서.’
    reason: previous_rendering
