base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/004/016.yaml
  text: May his portion[a], O Lord, be in dishonor before you[d][c][b], his going out in groanings and his coming in in a curse.
  footnotes:
  - marker: a
    text: Or 'lot' instead of 'portion.'
    reason: lexical_alternative
  - marker: b
    text: '''Going out'' and ''coming in'' likely form a paired biblical expression for the whole course of a person''s movements or life.'
    reason: cultural_note
  - marker: c
    text: Or 'in a curse'; the Greek expression is literally 'in curse.'
    reason: lexical_alternative
  - marker: d
    text: Or 'May his portion, O Lord, be in dishonor before you; his going out in groanings and his coming in under a curse.'.
    reason: previous_rendering
translation:
  language: ko
  text: 원하오니, 주님, 그의 몫이 주님 앞에서 불명예 가운데 있게 하시고, 그의 나감은 탄식 가운데, 그의 들어옴은 저주 가운데 있게 하소서.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘몫’은 여기서 ‘분깃’ 또는 ‘운명’의 뜻일 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나감’과 ‘들어옴’은 한 사람의 삶 전체의 움직임을 가리키는 성경적 병행 표현일 가능성이 큽니다.
    reason: cultural_note
  - marker: c
    text: ‘저주 가운데’는 헬라어의 문자적으로는 ‘저주 안에’에 가깝습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘원하오니, 주님, 그의 몫이 주님 앞에서 불명예 가운데 있고, 그의 나감은 탄식 가운데, 그의 들어옴은 저주 가운데 있게 하소서.’
    reason: previous_rendering
lexical_decisions:
- source_word: γένοιτο
  english_pob_choice: May ... be
  chosen_korean: 원하오니 ... 있게 하소서
  alternatives_korean:
  - '...가 되게 하소서'
  - '...이게 하소서'
  lexicon: LSJ
  rationale: 옵타티브 γένοιτο의 간구·저주적 소원을 한국어 기도체로 살리기 위해 ‘원하오니 … 있게 하소서’로 옮겼습니다.
- source_word: μερὶς
  english_pob_choice: portion
  chosen_korean: 몫
  alternatives_korean:
  - 부분
  - 분깃
  - 운명
  lexicon: LSJ
  rationale: 배당된 몫이나 운명의 의미를 살리면서, 문맥의 심판적 어조에 자연스럽게 맞는 말로 ‘몫’을 택했습니다.
- source_word: ἀτιμίᾳ
  english_pob_choice: dishonor
  chosen_korean: 불명예
  alternatives_korean:
  - 수치
  - 치욕
  - 욕됨
  lexicon: LSJ
  rationale: 추상 명사로서의 ‘dishonor’를 비교적 직역적으로 살리되, 법정적·도덕적 어조를 유지하기 위해 ‘불명예’로 옮겼습니다.
- source_word: ἔξοδος / εἴσοδος
  english_pob_choice: going out / coming in
  chosen_korean: 나감 / 들어옴
  alternatives_korean:
  - 나가고 들어오는 일
  - 출입
  - 외출과 입장
  lexicon: LSJ
  rationale: 상투적인 성경적 병행구를 보존하기 위해 동작명사형인 ‘나감’과 ‘들어옴’을 선택했습니다.
- source_word: ἀρᾷ
  english_pob_choice: under a curse / in a curse
  chosen_korean: 저주 가운데
  alternatives_korean:
  - 저주 안에
  - 저주 아래
  - 저주 속에
  lexicon: LSJ
  rationale: ἐν + 여격의 형식을 과도하게 풀지 않으면서, 한국어로 자연스럽게 상태를 나타내는 표현으로 ‘저주 가운데’를 사용했습니다.
theological_decisions:
- issue: 저주 시(imprecatory wish)의 문체 유지
  chosen_reading: 문장을 평서가 아니라 주님께 드리는 직접적인 저주적 소원으로 옮겼습니다.
  alternative_readings:
  - 예언적 진술처럼 평탄하게 옮김
  - 완곡한 바람 표현으로 약화함
  rationale: γένοιτο와 Κύριε의 결합은 단순한 묘사보다 간구·저주 성격이 강하므로, 그 긴장을 약화하지 않도록 기도체를 유지했습니다.
  doctrine_reference: imprecatory prayer
- issue: ‘주님 앞에서’의 방향성 보존
  chosen_reading: πρὸς/ἐνώπιόν σου 계열의 의미를 ‘주님 앞에서’로 유지했습니다.
  alternative_readings:
  - 주님 보시기에
  - 주님 앞에
  - 주님 면전에서
  rationale: 하나님 앞에서의 공개적·법정적 상태를 드러내기 위해 친숙하지만 소스에 충실한 ‘주님 앞에서’를 택했습니다.
  doctrine_reference: divine presence and judgment
