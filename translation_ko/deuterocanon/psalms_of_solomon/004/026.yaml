translation:
  language: ko
  text: 마음에 속임이 없는 가운데 주님을 경외하는 이들은 복이 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 "순수한 가운데" 혹은 "흠 없는 가운데"로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 '경외하다'는 단순한 두려움이 아니라 경건한 경외를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  english_pob_choice: Blessed
  chosen_korean: 복이 있습니다
  alternatives_korean:
  - 행복합니다
  - 복됩니다
  lexicon: BDAG
  rationale: 축복 선언형의 뉘앙스를 살리면서 현대 한국어에서 자연스러운 합쇼체로 옮겼습니다.
- source_word: φοβούμενοι
  english_pob_choice: fear
  chosen_korean: 경외하는
  alternatives_korean:
  - 두려워하는
  - 무서워하는
  - 공경하는
  lexicon: BDAG
  rationale: 영어 POB의 설명대로 단순한 공포가 아니라 경외의 의미가 핵심이므로, 한국어에서는 그 긴장을 살리는 '경외하다'를 택했습니다.
- source_word: κύριον
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주인
  lexicon: BDAG
  rationale: 하나님을 가리키는 호칭으로서 POB의 기본 대응을 따랐습니다.
- source_word: ἐν ἀκακίᾳ αὐτῶν
  english_pob_choice: in their innocence
  chosen_korean: 마음에 속임이 없는 가운데
  alternatives_korean:
  - 그들의 무구함 가운데
  - 그들의 흠 없음 가운데
  - 그들의 순수함 가운데
  lexicon: BDAG
  rationale: ἀκακία는 악의나 속임이 없는 상태를 가리키므로, 한국어에서는 '속임이 없는'으로 의미를 드러내고 '마음에'를 보태 문맥상 내적 상태임을 자연스럽게 표현했습니다.
theological_decisions:
- issue: 마카리오스형 축복 선언의 한국어 어조
  chosen_reading: '''복이 있습니다''로 선언형 축복을 살렸습니다.'
  alternative_readings:
  - 행복합니다
  - 복되십니다
  rationale: 지혜문학/축복문맥의 선언성을 유지하면서도, 독자에게 자연스럽고 공적인 문체를 확보하기 위해 합쇼체 선언형을 택했습니다.
  doctrine_reference: 시편·지혜문학의 복 선언 형식
- issue: φοβέομαι의 의미 범위
  chosen_reading: 주님을 '경외하는'으로 옮겨 경건한 두려움의 의미를 보존했습니다.
  alternative_readings:
  - 주님을 두려워하는
  - 주님을 무서워하는
  rationale: 본문은 단순 공포가 아니라 경건한 경외를 뜻하므로, 한국어에서도 그 신학적 긴장을 유지해야 합니다.
  doctrine_reference: 경외(טִרְאָה/φόβος)의 신앙적 의미
