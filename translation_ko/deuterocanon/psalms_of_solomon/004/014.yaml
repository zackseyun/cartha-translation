  source_fidelity: παρελογίσατο는 잘못되거나 기만적인 추론을 나타내며, ‘그릇되게 추론하였습니다’는 그 인지적 의미를 보존합니다. ἐν λόγοις는 ‘말로’로 자연스럽게 옮길 수 있습니다. ὁρῶν καὶ κρίνων은 한 관사 아래 병렬된 분사이므로, ‘보고 심판하는 이’처럼 한 존재의 두 행동으로 표현하는 것이 더 충실합니다.
  naturalness: ‘말들로’는 현대 표준 한국어에서 다소 부자연스럽고, ‘보는 이도, 심판하는 이도’는 원문의 한 병렬 주체를 둘로 나누어 들리게 할 수 있습니다. ‘말로 그릇되게 추론하였습니다’ 및 ‘보고 심판하는 이는 없습니다’가 현대적이고 문어적인 합쇼체에 적합합니다.
  terminology: ‘심판하다’는 κρίνων의 도덕적·재판적 무게를 무리 없이 유지합니다. 하나님을 본문에 명시적으로 삽입하지 않고 ‘이’라는 일반적 지시를 유지합니다.
