base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/004/014.yaml
  text: He reasoned falsely in words[a], “There is no one who sees and judges.”
  footnotes:
  - marker: a
    text: Or “He deceived himself by words.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 말들로 잘못 추론하였습니다[a] — “보는 이도, 심판하는 이도 없습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그는 말로 자신을 속였습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρελογίσατο
  english_pob_choice: reasoned falsely
  chosen_korean: 잘못 추론하였습니다
  alternatives_korean:
  - 거짓으로 추론하였습니다
  - 속아넘어갔습니다
  - 잘못 판단하였습니다
  lexicon: LEH, LSJ
  rationale: 사고 과정의 왜곡을 살리면서도 한국어로 자연스럽게 옮기기 위해 ‘잘못 추론하다’를 택했습니다. 단순한 속임수보다 ‘논리/판단의 오류’에 초점을 둡니다.
- source_word: ἐν λόγοις
  english_pob_choice: in words
  chosen_korean: 말들로
  alternatives_korean:
  - 말로
  - 언어로
  - 말 속에서
  lexicon: LSJ
  rationale: 전치사구의 도구·매개 느낌을 살리면서도 한국어에서 어색하지 않게 옮겼습니다. 복수형의 느낌도 약하게 반영합니다.
- source_word: ὁρῶν
  english_pob_choice: sees
  chosen_korean: 보는 이
  alternatives_korean:
  - 보는 자
  - 보고 있는 이
  - 보는 사람
  lexicon: LEH, LSJ
  rationale: 분사구를 한국어의 관용적 명사화로 옮겨, ‘보는 자/사람’의 일반적 의미를 유지했습니다.
- source_word: κρίνων
  english_pob_choice: judges
  chosen_korean: 심판하는 이
  alternatives_korean:
  - 판단하는 이
  - 심판하는 자
  - 재판하는 이
  lexicon: LEH, LSJ
  rationale: 문맥상 도덕적·재판적 판단을 함께 포괄하므로, 한국어에서는 ‘심판하는 이’가 가장 무게감 있게 대응합니다.
theological_decisions:
- issue: 부정문의 대상이 특정한 하나님인지, 일반적 관찰자/재판자인지
  chosen_reading: “보는 이도, 심판하는 이도 없습니다.”로 옮겨, 그리스어가 직접 말하지 않는 명시적 신적 주어를 보태지 않았습니다.
  alternative_readings:
  - “하나님은 보시지도, 심판하지도 않으십니다.”
  - “보는 자도 심판하는 자도 없습니다.”
  rationale: 원문은 일반 진술 형태로 ‘보는/심판하는 존재’의 부재를 말하며, 본문에 없는 신적 주어를 삽입하지 않는 것이 출발 텍스트에 더 충실합니다.
  doctrine_reference: 본문의 문법적 평행과 암시적 주어 유지
- issue: ‘말들로’의 부정적 뉘앙스
  chosen_reading: ‘말들로 잘못 추론하였습니다’로, 발화가 사고를 왜곡하는 점을 드러내되 과도한 도덕 판단은 피했습니다.
  alternative_readings:
  - ‘말로 거짓되게 생각했습니다’
  - ‘말로 자신을 속였습니다’
  rationale: EN POB의 ‘reasoned falsely’가 허용하는 범위 안에서, 자가기만과 대외적 기만을 모두 열어 두는 표현을 택했습니다.
  doctrine_reference: 의도/인식의 왜곡을 드러내는 일반적 지혜 표현
