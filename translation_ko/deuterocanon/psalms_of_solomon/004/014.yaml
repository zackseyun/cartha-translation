    rationale: 그리스어는 ὁρῶν καὶ κρίνων에서 단수 관사와 병렬 분사로 ‘보고 심판하는 한 이’를 가리킵니다. 한국어에서도 이를 한 명사구로 유지하는 편이 정확합니다.
