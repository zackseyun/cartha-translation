revisions:
- from: 사람을 기쁘게 하는 이들의 살이 들짐승에게 흩어지기를 바라며, 율법 없는 자들의 뼈가 해 앞에 수치 가운데 놓이기를 바랍니다.[a]
  to: 사람을 기쁘게 하는 자들의 살이 들짐승들에게 흩어지게 하시고, 율법 없는 자들의 뼈가 해 앞에서 수치를 당한 채 놓이게 하소서.
  rationale: 두 수동 옵티타티브의 저주·기원 어조를 한국어의 병렬 청원형 ‘-게 하시고, -게 하소서’로 일관되게 재현했습니다. 이는 심판의 행위자를 본문보다 더 특정하지 않으면서도 시편적 기원 문체를 자연스럽게 유지합니다. 불필요하고 부정확한 각주는 삭제했습니다.
