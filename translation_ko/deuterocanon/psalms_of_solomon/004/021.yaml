base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/004/021.yaml
  text: May the flesh of people-pleasers be scattered by wild beasts[a], and the bones of the lawless lie before the sun in dishonor.
  footnotes:
  - marker: a
    text: Or 'the remains'.
    reason: previous_rendering
translation:
  language: ko
  text: 사람을 기쁘게 하는 자들의 살이 들짐승들에게 흩어지게 하시고, 율법 없는 자들의 뼈가 해 앞에서 수치를 당한 채 놓이게 하소서.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκορπισθείησαν
  english_pob_choice: May ... be scattered
  chosen_korean: 흩어지기를 바라며
  alternatives_korean:
  - 흩어지게 하소서
  - 흩어지기를 원하며
  lexicon: LSJ
  rationale: aorist passive optative의 저주/기원 어조를 살리되, 한국어에서는 문장 전체를 자연스러운 소망형으로 옮겼습니다.
- source_word: ἀνθρωπαρέσκων
  english_pob_choice: people-pleasers
  chosen_korean: 사람을 기쁘게 하는 이들
  alternatives_korean:
  - 사람을 기쁘게 하는 자들
  - 사람비위를 맞추는 자들
  lexicon: LSJ
  rationale: 사람을 향한 호의 추구를 직역에 가깝게 드러내면서도, 한국어에서 다소 구어적인 '사람비위를 맞추는'보다 중립적인 표현을 택했습니다.
- source_word: θηρίων
  english_pob_choice: wild beasts
  chosen_korean: 들짐승
  alternatives_korean:
  - 야생 짐승
  - 야수
  lexicon: LSJ
  rationale: 사나운 동물을 뜻하는 이미지를 간결하고 자연스럽게 살리기 위해 '들짐승'으로 옮겼습니다.
- source_word: παρανόμων
  english_pob_choice: of the lawless
  chosen_korean: 율법 없는 자들
  alternatives_korean:
  - 불법한 자들
  - 법 없는 자들
  lexicon: LSJ
  rationale: παράνομος의 법적·도덕적 반항성을 살리기 위해 '율법 없는 자들'을 택했습니다. 이 본문은 일반적 '불법자'보다 율법 기준을 배반한 자라는 뉘앙스가 더 분명합니다.
- source_word: κατέναντι τοῦ ἡλίου
  english_pob_choice: before the sun
  chosen_korean: 해 앞에
  alternatives_korean:
  - 태양 앞에
  - 해 아래
  lexicon: LSJ
  rationale: 공개적 노출과 수치를 나타내는 전치사구를 직설적으로 살리기 위해 '해 앞에'로 옮겼습니다.
- source_word: ἐν ἀτιμίᾳ
  english_pob_choice: in dishonor
  chosen_korean: 수치 가운데
  alternatives_korean:
  - 불명예 가운데
  - 치욕 가운데
  lexicon: LSJ
  rationale: ἀτιμία의 핵심인 수치·불명예를 한국어의 자연스러운 관용인 '수치 가운데'로 풀어냈습니다.
theological_decisions:
- issue: 시편 형태의 저주 기원 어조
  chosen_reading: 원문의 기원형을 그대로 살려, 윤리적 판단이 아니라 심판을 구하는 저주적 소망으로 번역했습니다.
  alternative_readings:
  - 선언문처럼 단정적으로 옮김
  - 완화하여 단순한 예언으로 옮김
  rationale: aorist passive optative와 병렬 구조가 청원/저주의 뉘앙스를 강하게 띠므로, 어조를 약화하지 않았습니다.
  doctrine_reference: 성서 본문 장르와 화행 보존
- issue: ‘율법 없는 자들’의 법-윤리 강조
  chosen_reading: παράνομος를 '율법 없는 자들'로 옮겨, 단순한 사회적 무법이 아니라 하나님의 기준을 거스르는 상태를 드러냈습니다.
  alternative_readings:
  - 불법한 자들
  - 악인들
  rationale: 본문의 도덕적 비난이 일반적 범죄자보다 더 신학적·언약적 성격을 띠므로, 율법과의 관계를 보존하는 번역이 더 적절합니다.
  doctrine_reference: 율법/의의 언어 보존
