    issue: 기원형의 병렬 구조가 불균형함
    rationale: σκορπισθείησαν과 (생략된) 놓이기를 바라는 병렬 기원은 모두 저주·소망의 범위에 있습니다. ‘바라며’는 첫 절을 종속적 화자의 행위로 처리하여 문법적·문체적 어색함을 낳습니다.
  - severity: low
