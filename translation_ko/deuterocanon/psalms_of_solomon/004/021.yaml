    rationale: ‘사람을 기쁘게 하는 이들’은 이미 본문 번역과 실질적으로 동일하며, 이를 ‘직역’으로 제시할 필요가 없습니다. 또한 현 본문에 각주가 필요한 본문상 불확실성은 없습니다.
  - severity: low
