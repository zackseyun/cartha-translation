  text: And may the devout vindicate the judgment of their God when sinners are removed from before the righteous man—even the one speaking what pleases a man, only with deceit.
  footnotes:
  - marker: a
    text: The Greek shifts from plural “sinners” to a singular participial description (“one speaking…”), likely characterizing the sinner generically; the wording is syntactically awkward in the transmitted text.
    reason: alternative_reading
  - marker: b
    text: Or “from the presence of the righteous one.”
    reason: lexical_alternative
  - marker: c
    text: Or 'And let the devout vindicate the judgment of their God when sinners are removed from before the righteous man, one speaking only to please a man with deceit.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 경건한 자들은 자기 하나님의 심판을 변호하게 하십시오. 죄인들이 의로운 자의 앞에서 제거될 때, 곧 사람을 기쁘게 하려고 말하지만 속임수로만 말하는 그 자를 두고 그렇게 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ἁμαρτωλοὺς(복수 ‘죄인들’) 뒤에 단수 분사적 표현이 이어져 문법이 다소 거칩니다. 영어 POB처럼 의미를 풀되, 싱글-플러스 구조의 긴장을 평탄화하지 않았습니다.
    reason: source_note
  - marker: b
    text: ἀπὸ προσώπου δικαίου는 문자적으로 ‘의로운 자의 얼굴/앞에서’이며, 영어 POB의 ‘from before the righteous man’을 따랐습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσιοι
  english_pob_choice: the devout
  chosen_korean: 경건한 자들
  alternatives_korean:
  - 경건한 이들
  - 거룩한 자들
  - 신실한 자들
  lexicon: LSJ
  rationale: 이 문맥에서는 제의적 ‘거룩함’보다 하나님께 충실한 사람들의 성격이 강조되므로, 자연스러운 표준어로 ‘경건한 자들’이 적절합니다.
- source_word: δικαιώσαισαν
  english_pob_choice: vindicate
  chosen_korean: 변호하게 하십시오
  alternatives_korean:
  - 옳다고 입증하게 하십시오
  - 정당함을 밝히게 하십시오
  - 의롭다고 하게 하십시오
  lexicon: LSJ
  rationale: 목적어가 κρίμα(심판)인 점을 살려, 하나님의 판단이 옳음을 드러내고 옹호하는 뜻으로 옮겼습니다.
- source_word: ἀπὸ προσώπου δικαίου
  english_pob_choice: from before the righteous man
  chosen_korean: 의로운 자의 앞에서
  alternatives_korean:
  - 의로운 자의 얼굴에서
  - 의로운 이의 앞에서
  - 의로운 자의 임재에서
  lexicon: LSJ
  rationale: 관용구 ἀπὸ προσώπου를 한국어에서 가장 자연스럽게 살리기 위해 ‘앞에서’로 옮겼고, δικαίου의 단수성을 유지했습니다.
- source_word: ἀνθρώπῳ ἀρέσκον λαλοῦντα μόνον μετὰ δόλου
  english_pob_choice: one speaking what pleases a man, only with deceit
  chosen_korean: 사람을 기쁘게 하려고 말하지만 속임수로만 말하는 그 자
  alternatives_korean:
  - 사람에게 맞는 말만 하며 속임수로 말하는 자
  - 사람을 기쁘게 하는 말만 하며 속임수로 말하는 자
  - 사람에게 기분 좋게 들리도록 속임수로 말하는 자
  lexicon: LSJ
  rationale: 전달이 어색한 그리스어 구문을 과도하게 매끈하게 만들지 않으면서, ‘ἀρέσκον’의 ‘기쁘게 함’과 ‘μετὰ δόλου’의 ‘속임수’를 함께 드러내도록 했습니다.
theological_decisions:
- issue: aorist optative δικαιώσαισαν의 뉘앙스
  chosen_reading: ‘변호하게 하십시오’로 번역해 공동체를 향한 권고/기원적 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘변호할 것입니다’
  - ‘변호하길 바랍니다’
  rationale: 여기서는 서술이 아니라 경건한 자들을 향한 기원형 표현이므로, 합쇼체 명령/권고형이 문맥에 가장 맞습니다.
  doctrine_reference: 시적·지혜적 기원문법
