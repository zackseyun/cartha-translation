    rationale: ἀνθρώπῳ ἀρέσκον은 제공된 원문·감사 기록의 분석상 λαλοῦντα의 목적어인 중성 실체화 분사이며, ‘두고 그렇게 하십시오’에 해당하는 표현은 그리스어에 없습니다.
