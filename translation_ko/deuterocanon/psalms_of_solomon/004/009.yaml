revisions:
- from: 그리고 경건한 자들은 자기 하나님의 심판을 변호하게 하십시오. 죄인들이 의로운 자의 앞에서 제거될 때, 곧 사람을 기쁘게 하려고 말하지만 속임수로만 말하는 그 자를 두고 그렇게 하십시오.[a][b]
  to: 또 경건한 이들이, 죄인들이 의로운 자 앞에서[a] 제거될 때, 곧 사람을 기쁘게 하는 것을 오직 속임수로 말하는 자를 두고, 그들의 하나님의 심판이 옳음을 드러내게 하소서.[b]
  rationale: 기원형 동사를 ‘…하게 하소서’로 바로잡고, 하나님의 심판을 ‘변호’한다는 법정적 뜻은 ‘심판이 옳음을 드러내다’로 자연스럽고 정확하게 표현했습니다. 제거의 대상인 복수 죄인들과 그 뒤의 단수 ‘말하는 자’ 사이의 원문상 긴장은 유지했으며, 사람을 기쁘게 하는 ‘것’을 말한다는 구문을 목적 표현으로 평탄화하지 않았습니다. 어휘 각주 표지도 해당 표현에 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:09:51Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘변호하게 하십시오’는 직설적인 청자 명령으로 들려, δικαιώσαισαν의 기원적 아오리스트 옵티미티브를 충분히 반영하지 못합니다. 또한 마지막 절의 ‘사람을 기쁘게 하려고’는 ἀρέσκον을 목적의 뜻으로 바꾸며, ‘두고 그렇게 하십시오’는 원문에 없는 지시·반복을 더합니다. 단수 λαλοῦντα는 복수 ἁμαρτωλούς 뒤에 이어지는 전달상의 불규칙성을 보존하여 옮겨야 합니다.
  naturalness: ‘하소서’는 시편적 기원문에 맞는 현대 한국어 합쇼체입니다. ‘의로운 자 앞에서 제거될 때’는 다소 문어적이지만 ἀπὸ προσώπου의 공간적 표현과 원문의 문체를 자연스럽게 유지합니다. 마지막 단수 수식어는 ‘곧 … 자’로 연결하여 이해 가능하게 하되, 원문의 수 불일치를 각주로 밝혔습니다.
  terminology: ὅσιοι는 ‘경건한 이들’, κρίμα는 ‘심판’, δικαιώσαισαν은 문맥상 ‘심판이 옳음을 드러내다’로 옮겼습니다. ἀνθρώπῳ ἀρέσκον은 영어 감사 기록의 분석에 따라 ‘사람을 기쁘게 하는 것을’으로 번역했으며, 목적 표현인 ‘…하려고’로 해석하지 않았습니다.
