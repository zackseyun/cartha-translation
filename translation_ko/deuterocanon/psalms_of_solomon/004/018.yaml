  text: May sleep be taken from his temples in the night; may they fall away from every work of his hands.
translation:
  language: ko
  text: 밤에 그의 관자놀이에서 잠이 거두어지게 하시며, 그의 손의 모든 일에서 그들이 떨어져 나가게 하소서.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφαιρεθείη ὕπνος
  english_pob_choice: May sleep be taken
  chosen_korean: 잠이 거두어지게 하시며
  alternatives_korean:
  - 잠이 빼앗기게 하시며
  - 잠이 제거되게 하시며
  lexicon: ἀφαιρέω; ὕπνος
  rationale: 수동적 소원형을 살리면서도 한국어로 자연스럽게 들리도록 ‘거두어지다’를 택했습니다.
- source_word: ἀπὸ κροτάφων αὐτοῦ
  english_pob_choice: from his temples
  chosen_korean: 그의 관자놀이에서
  alternatives_korean:
  - 그의 눈에서
  - 그의 잠자리에서
  lexicon: κρόταφος
  rationale: 영어 POB의 ‘temples’는 원문의 κρόταφος를 직접 반영하므로, 문맥상 눈이 아니라 관자놀이로 옮겼습니다.
- source_word: ἐν νυκτί
  english_pob_choice: in the night
  chosen_korean: 밤에
  alternatives_korean:
  - 밤중에
  - 한밤중에
  lexicon: νύξ
  rationale: 짧은 시구의 시간 부사를 간결한 표준어로 처리했습니다.
- source_word: ἀποπέσοιεν
  english_pob_choice: may they fall away
  chosen_korean: 떨어져 나가게 하소서
  alternatives_korean:
  - 떨어지게 하소서
  - 사라지게 하소서
  lexicon: ἀποπίπτω
  rationale: ‘fall away’의 분리·이탈 뉘앙스를 살리기 위해 ‘떨어져 나가다’로 옮겼습니다.
theological_decisions:
- issue: 시적 저주/탄원 문장의 청유형 처리
  chosen_reading: 두 동사 모두 간구형으로 유지해, 화자의 저주적 탄원을 현대 한국어에서도 분명히 드러냈습니다.
  alternative_readings:
  - 평서형으로 완화하여 번역하기
  - 직설적 저주 표현으로 강화하기
  rationale: 원문은 소원법으로 구성되어 있어, 이를 약화시키거나 과장하지 않고 그대로 옮기는 것이 가장 충실합니다.
