lexical_decisions:
- source_word: ἐὰν γὰρ πεινάσω
  english_pob_choice: For if I am hungry
  chosen_korean: 그런데 제가 배고프게 되면
  alternatives_korean:
  - 제가 배고프면
  - 만일 제가 굶주리면
  - 제가 굶주리게 되면
  lexicon: LEH; LSJ
  rationale: πεινάσω는 조건절에서 미래의 상황을 가리키는 aorist subjunctive이므로, 한국어에서도 단순 상태보다 ‘배고프게 되면’처럼 발생하는 상황을 드러내는 표현이 원문에 더 가깝습니다.
- source_word: πρὸς σὲ κεκράξομαι
  english_pob_choice: I will cry out to you
  chosen_korean: 제가 당신께 부르짖을 것이며
  alternatives_korean:
  - 제가 당신께 외칠 것이며
  - 제가 당신께 소리칠 것이며
  - 제가 당신을 향해 부르짖을 것이며
  lexicon: LEH; LSJ
  rationale: κράζω 계열의 강한 호소는 단순한 ‘부르다’보다 ‘부르짖다’가 더 잘 살리며, πρὸς σέ의 대상을 자연스럽게 한국어로 옮기기 위해 ‘당신께’로 처리했습니다.
- source_word: ὁ θεός
  english_pob_choice: O God
  chosen_korean: 하나님
  alternatives_korean:
  - 오 하나님
  - 하나님이시여
  lexicon: LEH; LSJ
  rationale: 여기서 ὁ θεός는 호격 기능의 직접 호칭이므로 ‘하나님’으로 두되, 한국어 문맥상 이미 앞의 호소 동사와 결합하여 직접 부름이 드러납니다.
- source_word: δώσεις μοι
  english_pob_choice: you will give to me
  chosen_korean: 당신은 제게 주실 것입니다
  alternatives_korean:
  - 당신은 제게 주실 것입니다
  - 당신은 제게 주시게 될 것입니다
  - 당신은 제게 주실 것입니다
  lexicon: LEH; LSJ
  rationale: δώσεις μοι는 목적어가 생략된 단순한 ‘주다’이므로, 영어 POB의 해석을 좇아 ‘공급하다’로 확장하지 않고 ‘주실 것입니다’로 직역했습니다.
theological_decisions:
- issue: 하나님 직접 호칭의 한국어 처리
  chosen_reading: ‘하나님’으로 두고, 문장 안에서 직접 대화의 맥락을 살립니다.
  alternative_readings:
  - ‘오 하나님’
  - ‘하나님이시여’
  rationale: 원문은 문법적으로는 정관사 있는 주격이지만 기능상 호격이므로, 과도한 교회식 화법보다 직접 호소의 긴장을 살리는 쪽이 원문 효과를 더 잘 보존합니다.
  doctrine_reference: 시적 기도문에서의 호격 사용
- issue: 배고픔과 응답의 관계
  chosen_reading: ‘배고프게 되면’과 ‘주실 것입니다’로 조건과 응답을 단순하게 연결합니다.
  alternative_readings:
  - ‘배고프면’
  - ‘공급해 주실 것입니다’
  rationale: 원문은 배고픔이라는 필요와 하나님의 응답을 직접 연결할 뿐, 응답의 내용은 특정하지 않으므로 한국어도 그 여백을 유지해야 합니다.
  doctrine_reference: 시편적 탄원/신뢰의 표현
