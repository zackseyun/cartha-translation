translation:
  language: ko
  text: 만일 제가 배고프게 되면, 하나님, 제가 하나님께 부르짖을 것이며, 하나님께서는 제게 주실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어에는 ‘주실 것입니다’의 목적어가 명시되어 있지 않습니다.
