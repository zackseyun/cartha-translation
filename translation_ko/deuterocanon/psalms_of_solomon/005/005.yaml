  text: And who will take from all that you have made, unless you give it?
translation:
  language: ko
  text: 그리고 주님께서 지으신 모든 것 가운데서 누가 무엇을 받겠습니까? 주님께서 주시지 않으시면 받을 수 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘가지다/취하다’에 가깝지만, 여기서는 ‘받다’가 문맥상 더 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘지으신’은 δημιουργω 계열의 일반적 창조 표현을 반영한 번역입니다.
    reason: source_note
lexical_decisions:
- source_word: τίς λήψεται
  english_pob_choice: who will take
  chosen_korean: 누가 무엇을 받겠습니까?
  alternatives_korean:
  - 누가 받겠습니까?
  - 누가 가져가겠습니까?
  lexicon: λήμψομαι/λαμβάνω
  rationale: λήψεται는 단순히 ‘취하다’보다 ‘받다/얻다’의 뜻이 자연스럽고, 문맥상 소유권 주장보다 수혜의 가능성을 묻는 질문이어서 ‘받겠습니까’로 옮겼습니다.
- source_word: ἀπὸ πάντων ὧν ἐποίησας
  english_pob_choice: from all that you have made
  chosen_korean: 주님께서 지으신 모든 것 가운데서
  alternatives_korean:
  - 주님께서 만드신 모든 것 가운데서
  - 주님께서 행하신 모든 것 가운데서
  lexicon: πάντων / ἐποίησας
  rationale: ἐποίησας는 여기서 ‘만드신/지으신’의 창조 행위를 가리키므로, ‘행하신’보다 피조물 맥락이 분명한 ‘지으신’이 더 적절합니다.
- source_word: ἐὰν μὴ σὺ δῷς
  english_pob_choice: unless you give it
  chosen_korean: 주님께서 주시지 않으시면 받을 수 없습니다
  alternatives_korean:
  - 주님께서 주시지 않으면 받을 수 없습니다
  - 주님께서 주지 않으시면 받을 수 없습니다
  lexicon: δίδωμι
  rationale: 조건절의 의미를 한국어에서 자연스럽게 풀어, 허락 없이는 아무도 받을 수 없다는 종속 관계를 분명히 했습니다.
theological_decisions:
- issue: 하나님의 주권과 수여권
  chosen_reading: 피조물은 하나님이 주시지 않으면 아무도 받을 수 없다는 주권적 진술로 옮겼습니다.
  alternative_readings:
  - 중립적인 소유 진술로 약화할 수 있음
  - 단순한 감사 표현으로만 읽을 수 있음
  rationale: 문장은 인간의 취득 가능성을 배제하고 주시는 분만이 궁극적 수여자임을 강조하므로, 이를 한국어에서도 분명히 드러내는 것이 본문의 힘을 보존합니다.
  doctrine_reference: 하나님의 주권, 창조와 섭리
- issue: 직접 호칭의 일관성
  chosen_reading: 문맥의 2인칭 단수는 합쇼체로 처리하고, ‘주님’은 문맥상 하나님을 가리키는 경어 호칭으로 사용했습니다.
  alternative_readings:
  - ‘당신’
  - ‘야훼’
  rationale: 시적 기도/탄원 문맥에서는 현대 한국어의 경어가 자연스럽고, 본문이 직접적인 신학적 표상을 약화하지 않도록 호칭을 정돈했습니다.
  doctrine_reference: 경어 사용, 예배 언어
