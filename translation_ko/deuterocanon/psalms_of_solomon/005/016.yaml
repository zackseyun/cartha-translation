base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/005/016.yaml
  text: But your gift is abundant in kindness and rich[b][a], and the hope in you will not be disappointed in the gift.
  footnotes:
  - marker: a
    text: Or 'there is no one whose hope is in you who will be sparing in giving.' The Greek is compressed and somewhat elliptical.
    reason: lexical_alternative
  - marker: b
    text: Or 'whoever hopes in you will not be sparing in giving.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 주님의 선물은 선하심으로 매우 크고 풍성하며, 주님께 소망을 두는 이는 선물을 베푸는 데 인색하지 않습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ δὲ δόμα σου
  english_pob_choice: your gift
  chosen_korean: 주님의 선물
  alternatives_korean:
  - 주님의 선물
  - 당신의 선물
  - 주님의 주심
  lexicon: LSJ
  rationale: δόμα는 ‘주는 것/선물’의 구체적 의미이므로, 문맥의 베풂을 살려 ‘선물’로 옮겼습니다. 2인칭 소유는 한국어에서 자연스러운 존칭 맥락상 ‘주님의’로 처리했습니다.
- source_word: μετὰ χρηστότητος
  english_pob_choice: with kindness
  chosen_korean: 자비로
  alternatives_korean:
  - 친절로
  - 선함으로
  - 은혜로
  lexicon: LSJ
  rationale: χρηστότης는 단순한 친절보다 선하고 호의적인 성격을 가리키므로, 하나님의 베풂에 어울리는 ‘자비로’가 가장 자연스럽습니다.
- source_word: πολὺ … καὶ πλούσιον
  english_pob_choice: abundant … rich
  chosen_korean: 풍성하며
  alternatives_korean:
  - 충만하며
  - 넉넉하며
  - 부요하며
  lexicon: LSJ
  rationale: 두 형용사가 선물의 크기와 풍부함을 압축적으로 강조하므로, 한국어에서는 중복을 피하면서도 의미를 살리는 ‘풍성하며’로 묶었습니다.
- source_word: ἡ ἐλπὶς ἐπὶ σέ
  english_pob_choice: the hope in you
  chosen_korean: 주님께 바라는 희망
  alternatives_korean:
  - 주님 안의 희망
  - 주님께 소망을 두는 사람
  - 주님께 있는 희망
  lexicon: LSJ
  rationale: 그리스어는 희망을 가진 사람을 압축적으로 가리키지만, 한국어에서는 그 뜻을 풀어 ‘주님께 바라는 희망’으로 옮겨 엘립시스를 살렸습니다.
- source_word: οὐ φείσεται ἐν δόματι
  english_pob_choice: will not be treated sparingly in a gift
  chosen_korean: 그 선물에서 박대되지 않습니다
  alternatives_korean:
  - 그 선물에서 아끼임을 당하지 않습니다
  - 그 선물로 인색하게 대접받지 않습니다
  - 그 선물 안에서 아끼지 않습니다
  lexicon: LSJ
  rationale: φείδομαι는 ‘아끼다/절약하다/사양하다’의 뜻이지만, 이 문맥에서는 희망하는 자가 선물에서 인색하게 대우받지 않는다는 뉘앙스가 핵심이므로 ‘박대되지 않습니다’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 선물과 인간의 희망 사이의 관계
  chosen_reading: 하나님의 선물은 풍성하며, 하나님께 바라는 희망은 그 선물 안에서 결코 배척되거나 인색하게 대우받지 않습니다.
  alternative_readings:
  - 하나님의 선물을 바라는 사람은 결코 인색하지 않게 대우받지 않습니다.
  - 그분께 희망을 둔 사람은 선물에서 아끼임을 당하지 않습니다.
  rationale: 본문의 압축된 문장은 희망하는 자를 수혜자로 두며, 하나님의 후한 베풂과 대조되는 인간의 인색함을 넘어서는 확신을 말합니다. 따라서 수혜자-선물 관계가 흐려지지 않도록 해석했습니다.
  doctrine_reference: 시편 솔로몬 5:13-16의 문맥적 대비—인간의 절약적 자비와 하나님의 풍성한 베풂
