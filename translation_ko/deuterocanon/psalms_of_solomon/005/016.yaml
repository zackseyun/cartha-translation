revisions:
- from: 그러나 주님의 선물은 자비로 충만하고 풍성하며, 주님께 바라는 희망은 그 선물에서 박대되지 않습니다.[a][b]
  to: 그러나 주님의 선물은 선하심으로 매우 크고 풍성하며, 주님께 소망을 두는 이는 선물을 베푸는 데 인색하지 않습니다.
  rationale: 원문의 압축된 후반절을 한국어에서 필요한 만큼만 풀어, 소망을 두는 사람을 주어로 제시했습니다. 이는 그 사람이 수혜자로서 ‘박대받지 않는다’는 해석을 본문에 덧붙이지 않고, φείδομαι와 ἐν δόματι의 통상적 의미를 보존합니다. 첫 절도 ‘매우 크고’와 ‘풍성하다’의 병렬 강조를 유지했습니다.
