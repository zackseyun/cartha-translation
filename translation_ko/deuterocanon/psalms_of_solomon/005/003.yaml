    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  english_pob_choice: But if
  chosen_korean: 그러나 ... 때에는
  alternatives_korean:
  - 그리고 만일
  - 만일
  lexicon: BDAG
  rationale: δέ의 약한 대조를 살려 앞 문맥과 이어 주는 ‘그러나’로 옮기고, ἐὰν의 조건성을 ‘때에는’으로 자연스럽게 표현했습니다.
- source_word: κεκραγέναι με πρὸς σὲ
  english_pob_choice: I cry out to you
  chosen_korean: 제가 주님께 부르짖을 때
  alternatives_korean:
  - 제가 주님께 외칠 때
  - 제가 주님께 부르짖어 왔을 때
  lexicon: BDAG
  rationale: 완료 부정사 형태라도 기도문 맥락에서 행위의 지속된 호소로 읽히므로, 한국어에서는 어색한 완료감보다 현재적 기도 행위를 드러내는 ‘부르짖을 때’로 옮겼습니다.
- source_word: μὴ παρασιωπήσῃς ἀπʼ ἐμοῦ
  english_pob_choice: do not be silent to me
  chosen_korean: 저에게 잠잠하지 마십시오
  alternatives_korean:
  - 저를 외면하지 마십시오
  - 제게 침묵하지 마십시오
  lexicon: BDAG
  rationale: παρασιωπέω의 핵심인 ‘침묵하다/지나쳐 침묵하다’를 살려, 관계적 기도 언어에 맞는 ‘잠잠하지 마십시오’로 번역했습니다.
theological_decisions:
- issue: 기도자의 직접 호소에 대한 신적 응답 요청
  chosen_reading: 주님께서 들으시고 응답하셔야 한다는 간청을, 직설적 명령형의 기도체로 유지했습니다.
  alternative_readings:
  - 부드러운 간청형으로 완화
  - 문장 전체를 설명문처럼 처리
  rationale: 이 절은 단순 정보 전달이 아니라 하나님께 드리는 탄원으로서, 원문의 긴박한 청원을 한국어에서도 약화시키지 않는 것이 중요합니다.
  doctrine_reference: 탄원시편의 기도 수사
