  yaml_path: translation/deuterocanon/psalms_of_solomon/005/001.yaml
  text: O Lord God[a], I will praise your name with exultation, in the midst of those who know your righteous judgments.
  footnotes:
  - marker: a
    text: Or 'among those who understand your just judgments.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주 하나님이여, 제가 주의 이름을 환호하며 찬양하겠습니다. 주의 의로운 판단을 아는 이들 가운데서 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 "주의 의로운 판단을 이해하는 이들 가운데서".
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε ὁ θεός
  english_pob_choice: O Lord God
  chosen_korean: 주 하나님이여
  alternatives_korean:
  - 주님 하나님이여
  - 주여, 하나님이여
  lexicon: κύριος, θεός
  rationale: 직접 호칭 구조를 살려 2격적 부름말로 옮기되, 한국어 예배체에서 자연스러운 "주 하나님이여"를 택했습니다.
- source_word: αἰνέσω
  english_pob_choice: I will praise
  chosen_korean: 찬양하겠습니다
  alternatives_korean:
  - 찬송하겠습니다
  - 기리겠습니다
  lexicon: αἰνέω
  rationale: 미래형의 결심을 보존하면서, 시편적 문맥에 맞는 예배 언어로 자연스럽게 옮겼습니다.
- source_word: ἐν ἀγαλλιάσει
  english_pob_choice: with exultation
  chosen_korean: 환호하며
  alternatives_korean:
  - 기쁨으로
  - 격하게 기뻐하며
  lexicon: ἀγαλλίασις
  rationale: 단순한 내적 기쁨보다 더 강한 환희의 표정을 드러내기 위해 "환호하며"를 선택했습니다.
- source_word: τὰ κρίματά σου τὰ δίκαια
  english_pob_choice: your righteous judgments
  chosen_korean: 주의 의로운 판단
  alternatives_korean:
  - 주의 의로운 심판
  - 주의 의로운 판결
  lexicon: κρίμα, δίκαιος
  rationale: κρίματα를 하나님의 사법적 결정/판단으로 보고, 영어 POB의 "judgments"를 따라 "판단"으로 옮겼습니다. "의로운"은 δίκαια의 도덕적·신학적 뉘앙스를 반영합니다.
theological_decisions:
- issue: 말하는 주체가 공동체 앞에서 하나님을 찬양하겠다고 서원하는 시적 화행
  chosen_reading: 미래형을 단순 예언이 아니라 결심/서원으로 살려 "찬양하겠습니다"로 옮겼습니다.
  alternative_readings:
  - 찬양할 것입니다
  - 찬양하리이다
  rationale: 문맥상 선언적 서원에 가깝고, 합쇼체로도 자연스럽게 공적 결단을 드러냅니다.
  doctrine_reference: 시편적 서원/찬양 화행
