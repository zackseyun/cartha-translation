translation:
  language: ko
  text: 그러므로 아무도 강한 자에게서 노획물을 빼앗지 못합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λήψεται
  english_pob_choice: will take
  chosen_korean: 빼앗지 못합니다
  alternatives_korean:
  - 취하지 못합니다
  - 가져가지 못합니다
  lexicon: BDAG
  rationale: 문맥상 단순한 ‘받다’보다 전리품을 힘으로 가져가는 뜻이므로, 부정문과 함께 ‘빼앗지 못합니다’로 옮겨 원문의 불가능성을 분명히 드러냈습니다.
- source_word: σκῦλα
  english_pob_choice: plunder
  chosen_korean: 노획물
  alternatives_korean:
  - 전리품
  - 약탈물
  lexicon: BDAG
  rationale: σκῦλα는 전투에서 얻은 전리품을 가리키므로, 현대 한국어에서 의미가 분명한 ‘노획물’이 적절하며 ‘전리품’도 가능한 대안입니다.
- source_word: ἀνδρὸς δυνατοῦ
  english_pob_choice: a mighty man
  chosen_korean: 강한 자
  alternatives_korean:
  - 힘센 사람
  - 유력한 사람
  lexicon: BDAG
  rationale: ἀνήρ의 성별 표지는 한국어에서 ‘자’로 자연스럽게 포괄할 수 있고, δυνατός의 힘/강함을 간결하게 살리기 위해 ‘강한 자’로 옮겼습니다.
theological_decisions:
- issue: λήψεται의 주어를 영어 POB의 수정처럼 비인칭적으로 이해할지 여부
  chosen_reading: 주어를 특정 인물로 두지 않고 ‘아무도 … 못합니다’로 처리했습니다.
  alternative_readings:
  - 그가 빼앗지 못합니다
  - 사람은 빼앗지 못합니다
  rationale: 그리스어 동사형은 명시 주어가 없어 일반적 진술로 읽는 것이 자연스럽고, 다음 절의 논리를 위해서도 비인칭/일반화 표현이 더 정확합니다.
  doctrine_reference: 문맥 해석
