  source_fidelity: 개정이 필요합니다. γάρ는 앞선 진술의 근거를 잇는 접속사이므로 ‘그러므로’가 아니라 ‘왜냐하면/이는 … 때문입니다’로 옮겨야 합니다. 또한 οὐ λήψεται는 미래 직설법의 단순 부정(‘취하지 않을 것입니다’)이며, ‘못합니다’가 암시하는 능력·가능의 불가를 원문보다 강하게 만들지 않는 편이 좋습니다. 명시되지 않은 주어는 영어 POB의 감사 이력처럼 일반화하여 ‘아무도’로 처리할 수 있습니다.
  naturalness: ‘왜냐하면 아무도 힘센 사람에게서 노획물을 가져가지 않을 것이기 때문입니다’는 현대 표준어 합쇼체로 자연스럽고, 단독 절에서도 γάρ의 논리적 연결을 보존합니다. ‘강한 자’보다 ‘힘센 사람’이 현대 한국어에서 덜 문어적입니다.
  terminology: σκῦλα는 ‘노획물’로 적절합니다. ἀνδρὸς δυνατοῦ의 남성 단수와 힘의 의미는 ‘힘센 사람’으로 무리 없이 반영됩니다. λαμβάνω에는 ‘빼앗다’보다 중립적인 ‘가져가다’를 사용하여 원문의 기본 의미를 보존합니다.
