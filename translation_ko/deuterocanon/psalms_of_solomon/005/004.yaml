  chosen_korean: 강한 자
  alternatives_korean:
  - 힘센 사람
  - 유력한 사람
  lexicon: BDAG
  rationale: ἀνήρ의 성별 표지는 한국어에서 ‘자’로 자연스럽게 포괄할 수 있고, δυνατός의 힘/강함을 간결하게 살리기 위해 ‘강한 자’로 옮겼습니다.
