base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/005/007.yaml
  text: When we are afflicted[a], we will call for help, and you will not turn away our plea[b], for you are our God.
  footnotes:
  - marker: a
    text: Or 'In our affliction, we will call upon you for help.'
