base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/005/007.yaml
  text: When we are afflicted[a], we will call for help, and you will not turn away our plea[b], for you are our God.
  footnotes:
  - marker: a
    text: Or 'In our affliction, we will call upon you for help.'
    reason: lexical_alternative
  - marker: b
    text: '''Our plea'' could also be rendered ''our supplication'' or ''our petition.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 우리가 환난을 당할 때에는 도움을 청하겠습니다. 그러면 주께서는 우리의 간구를 외면하지 않으실 것입니다. 주께서 우리의 하나님이시기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리가 환난 가운데 있을 때 도움을 청하겠습니다.’
    reason: lexical_alternative
  - marker: b
    text: ‘간구’는 ‘탄원’이나 ‘간청’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ θλίβεσθαι ἡμᾶς
  english_pob_choice: When we are afflicted
  chosen_korean: 우리가 환난을 당할 때에는
  alternatives_korean:
  - 우리의 환난 가운데
  - 우리가 압박을 받을 때에는
  - 우리가 고난을 당할 때에는
  lexicon: BDAG
  rationale: ἐν + articular infinitive는 시간적 의미를 가지므로 자연스러운 한국어로 ‘~할 때’로 옮겼고, θλίβεσθαι의 압박·고난 뉘앙스는 ‘환난을 당하다’로 비교적 중립적으로 살렸습니다.
- source_word: ἐπικαλεσόμεθα εἰς βοήθειαν
  english_pob_choice: we will call for help
  chosen_korean: 도움을 청하겠습니다
  alternatives_korean:
  - 도움을 부르겠습니다
  - 도움을 요청하겠습니다
  - 도움을 구하겠습니다
  lexicon: BDAG
  rationale: 하나님께 직접 호소하는 미래형 표현이므로 ‘청하다’가 한국어로 가장 자연스럽고, εἰς βοήθειαν의 목적성을 ‘도움’으로 간결하게 반영했습니다.
- source_word: τὴν δέησιν ἡμῶν
  english_pob_choice: our plea
  chosen_korean: 우리의 간구
  alternatives_korean:
  - 우리의 탄원
  - 우리의 간청
  - 우리의 청원
  lexicon: BDAG
  rationale: δέησις는 일반적 ‘기도’보다 절박한 요청을 가리키므로, 교회적 상투어보다 source-direct하게 ‘간구’로 옮겼습니다.
- source_word: οὐκ ἀποστρέψῃ
  english_pob_choice: you will not turn away
  chosen_korean: 외면하지 않으실 것입니다
  alternatives_korean:
  - 돌이키지 않으실 것입니다
  - 돌아서지 않으실 것입니다
  - 외면하지 않으실 것입니다
  lexicon: BDAG
  rationale: 직역적 이미지인 ‘돌이키다/돌아서다’도 가능하지만, 기도 응답의 관계적 거절을 더 분명히 드러내는 한국어로 ‘외면하지 않다’를 채택했습니다.
- source_word: ὅτι σὺ ὁ θεὸς ἡμῶν εἶ
  english_pob_choice: for you are our God
  chosen_korean: 주께서 우리의 하나님이시기 때문입니다
  alternatives_korean:
  - 주께서 우리의 하나님이시기 때문입니다
  - 당신은 우리의 하나님이시기 때문입니다
  - 주님은 우리의 하나님이시기 때문입니다
  lexicon: BDAG
  rationale: ὅτι는 이유를 제시하므로 ‘때문입니다’로 옮겼고, 2인칭 호칭은 문맥상 기도체인 ‘주께서’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 하나님 호칭의 표현 방식
  chosen_reading: σὺ ὁ θεὸς ἡμῶν εἶ를 ‘주께서 우리의 하나님이시기 때문입니다’로 옮겨, 직접 호칭의 경건한 기도체를 유지했습니다.
  alternative_readings:
  - 당신은 우리의 하나님이십니다
  - 주님은 우리의 하나님이십니다
  rationale: 시편적 기도문에서는 2인칭 직접 호칭이 핵심이므로, 현대 한국어에서도 하나님께 드리는 존대형 종결을 유지하면서 문맥의 친밀성과 공적 고백성을 함께 살렸습니다.
  doctrine_reference: 기도문에서의 직접 호칭과 하나님의 언약적 관계 표현
- issue: ἀποστρέφω의 관계적 의미
  chosen_reading: ‘turn away’를 단순한 방향 전환보다 응답 거절의 관계적 의미로 읽어 ‘외면하지 않으실 것입니다’로 번역했습니다.
  alternative_readings:
  - 돌이키지 않으실 것입니다
  - 돌아서지 않으실 것입니다
  rationale: 간구를 받아들이지 않는다는 의미가 분명해야 하므로, 한국어에서 자연스럽고 신학적으로도 기도 응답의 거절을 전달하는 표현을 선택했습니다.
  doctrine_reference: 하나님의 응답과 기도의 수용성
