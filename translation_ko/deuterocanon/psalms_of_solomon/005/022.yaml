lexical_decisions:
- source_word: εὐλογημένη
  english_pob_choice: Blessed be
  chosen_korean: 복되십니다
  alternatives_korean:
  - 복되시기를
  - 찬송받으십니다
  lexicon: BDAG
  rationale: 감탄적 축복 선언의 힘을 살리면서 한국어 합쇼체에서 자연스럽게 들리도록 ‘복되십니다’로 옮겼습니다.
- source_word: δόξα
  english_pob_choice: glory
  chosen_korean: 영광
  alternatives_korean:
  - 위엄
  - 존귀
  lexicon: BDAG
  rationale: 하나님의 현현과 찬양을 함께 담는 가장 직접적인 대응어이므로 ‘영광’을 택했습니다.
- source_word: Κυρίου
  english_pob_choice: the Lord
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 주
  lexicon: BDAG; project glossary
  rationale: 그리스어 κύριος가 여기서는 하나님의 호칭으로 쓰였으므로, 프로젝트 기본 방침에 따라 신명 대응어인 ‘야훼’로 옮겼습니다.
- source_word: αὐτὸς
  english_pob_choice: he himself
  chosen_korean: 그분 자신이
  alternatives_korean:
  - 그분이
  - 바로 그분이
  lexicon: BDAG
  rationale: 강조된 인칭대명사의 중의적 강세를 살려 단순한 ‘그분이’보다 ‘그분 자신이’로 옮겼습니다.
theological_decisions:
- issue: κύριος의 대상이 하나님인지 메시아인지
  chosen_reading: 문맥상 ‘야훼의 영광’ 다음에 오는 왕권 진술이므로, κύριος는 야훼를 가리키는 것으로 읽었습니다.
  alternative_readings:
  - 일반적인 ‘주님’ 호칭
  - 메시아적 왕을 암시하는 호칭
  rationale: 앞절의 병렬 구조와 본문의 doxological 성격이 하나님 자신을 지시하게 하므로, 번역에서도 신명 대응을 유지하는 것이 더 투명합니다.
