  source_fidelity: 그리스어 Κυρίου는 본문상 ‘주님’으로 옮기는 것이 직접적이며, 영어 감사 기록도 ‘the Lord’를 채택합니다. 이를 ‘야훼’로 특정하면 그리스어 본문에 없는 신명 식별을 추가합니다. εὐλογημένη는 송영적 축복 공식이므로 단순 서술인 ‘복되십니다’보다 기원·찬양의 힘을 나타내는 표현이 적절합니다. αὐτός의 강조와 ‘우리의 왕’은 초안에 충실히 반영되어 있습니다.
  naturalness: ‘주님의 영광은 찬송을 받으소서’는 한국어 성서 문체에서 자연스럽고 현대 합쇼체에도 맞는 송영 표현입니다. 이어지는 인과절도 매끄럽습니다.
  terminology: δόξα는 ‘영광’, Κύριος는 ‘주님’, βασιλεύς는 ‘왕’으로 옮깁니다. ‘야훼’는 원문의 κύριος보다 더 좁고 해석적인 특정화이므로 사용하지 않습니다.
