  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: lxx-swete-1909
  text: μακάριος οὗ μνημονεύει ὁ θεὸς ἐν συμμετρίᾳ αὐταρκίας·
  language: Greek
  pages:
  - 795
  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/005/018.yaml
  text: Blessed is the one whom God remembers with measured sufficiency[a][b].
  footnotes:
  - marker: a
    text: Or 'Blessed is he of whom God is mindful in due measure of contentment.'
    reason: lexical_alternative
  - marker: b
    text: αὐταρκία can also mean 'contentment' or, more literally, 'self-sufficiency.'
    reason: alternative_reading
translation:
  language: ko
  text: 행복합니다, 하나님께서 적절한 분량의 만족으로 기억하시는 이여.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님께서 알맞은 분량으로 만족하게 하시는 이에게 복이 있습니다.’
    reason: alternative_reading
  - marker: b
    text: αὐτάρκεια는 ‘만족’ 또는 더 문자적으로는 ‘충분함, 자족’으로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριος
  english_pob_choice: Blessed
  chosen_korean: 행복합니다
  alternatives_korean:
  - 복됩니다
  - 복이 있습니다
  lexicon: LSJ
  rationale: 축복 선언의 형식을 살리면서도 현대 합쇼체에 자연스럽게 들리도록 옮겼습니다. ‘복됩니다’도 가능하지만, 형용사적 선언의 직접성을 위해 ‘행복합니다’를 택했습니다.
- source_word: μνημονεύει
  english_pob_choice: remembers
  chosen_korean: 기억하시는
  alternatives_korean:
  - 마음에 두시는
  - 기억하고 계시는
  lexicon: LSJ
  rationale: 하나님의 돌보는 기억이라는 뉘앙스를 살리기 위해 ‘기억하시는’으로 옮겼습니다. 단순한 인지보다 언약적 관심을 함께 드러냅니다.
- source_word: ἐν συμμετρίᾳ αὐταρκίας
  english_pob_choice: with measured sufficiency
  chosen_korean: 적절한 분량의 만족으로
  alternatives_korean:
  - 절제된 충분함으로
  - 알맞은 분량의 충분함으로
  - 적절한 충분함으로
  lexicon: LSJ
  rationale: συμμετρία의 ‘비례, 알맞은 분량’과 αὐτάρκεια의 ‘충분함/만족’을 함께 살리되, 한국어에서 자연스러운 구로 풀었습니다. ‘만족’은 내적 감정만이 아니라 주어지는 넉넉함에 따른 충족 상태를 함께 담습니다.
theological_decisions:
- issue: αὐταρκία를 인간의 자족이 아니라 하나님의 공급으로 이해하는 문제
  chosen_reading: 이 표현은 하나님께서 사람에게 알맞게 충분한 몫을 주시는 뜻으로 옮겼습니다.
  alternative_readings:
  - 인내적 만족을 강조하는 읽기
  - 독립적 자족을 강조하는 읽기
  rationale: 행위 주어가 하나님이므로, ‘자족’처럼 들리면 인간의 자립을 암시할 수 있습니다. 문맥에 맞게 하나님의 기억과 공급이 초점이 되도록 했습니다.
  doctrine_reference: 섭리와 하나님의 공급
