    issue: ‘행복합니다’가 μακάριος의 복 선언을 ‘행복’이라는 주관적 상태로 좁힙니다.
    rationale: 원문과 영어 감사 번역 모두 통상적 beatitude 용어인 ‘Blessed’를 택합니다. 한국어에서는 ‘복이 있습니다’가 이 선언의 성서적 용법과 현대적 자연스러움을 함께 살립니다.
