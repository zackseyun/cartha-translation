  lexicon: LSJ
  rationale: 헬라어가 간결하고 생략적인 표현이므로, 지연의 함의를 살리면서도 한국어에서 자연스러운 ‘내일을 위해’로 표현했습니다.
- source_word: δευτερώσῃ
  english_pob_choice: repeats it
  chosen_korean: 그것을 다시 해도
  alternatives_korean:
