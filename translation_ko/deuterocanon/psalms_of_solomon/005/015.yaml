  yaml_path: translation/deuterocanon/psalms_of_solomon/005/015.yaml
  text: A man's kindness is sparing and for tomorrow; and if he repeats it without grumbling[a], even at this you will marvel.
  footnotes:
  - marker: a
    text: Or 'is given sparingly and put off till tomorrow.' The Greek around 'for tomorrow' is terse and elliptical, so the sense of delay may be implied rather than fully expressed.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람의 친절은 아껴 베풀고 내일로 미루는 것이며[a], 그가 그것을 다시 하면서 불평하지 않는다면, 이것조차 놀랄 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아껴 베풀며 내일을 위해 둔다’로 옮길 수 있습니다. ‘내일’(αὔριον) 전후의 표현은 매우 압축적이고 타원적이므로, 내일로 미룬다는 뜻은 암시되지만 명시적으로 풀어 쓰이지는 않았습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: χρηστότης
  english_pob_choice: kindness
