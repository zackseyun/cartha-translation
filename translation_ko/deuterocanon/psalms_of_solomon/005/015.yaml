  - 두 번째로 해도
  - 다시 행해도
  lexicon: LSJ
  rationale: ‘두 번째로 하다’의 의미를 직접 드러내면서도, 앞절의 행위가 반복됨을 한국어에서 가장 자연스럽게 보이도록 했습니다.
theological_decisions:
- issue: 마지막 절의 두 번째 인칭 단수 미래형 해석
  chosen_reading: ‘당신은 놀라게 될 것입니다’로 직역해, 격언적 경고/감탄의 직접적 효과를 유지했습니다.
  alternative_readings:
  - ‘너는 놀랄 것입니다’
  - ‘그것도 당신을 놀라게 할 것입니다’
  rationale: 원문은 δεύτερον 절의 조건에 이어 θαυμάσεις의 2인칭 단수 미래를 직접 말하므로, 격언적 직접 호소를 살려 한국어도 2인칭으로 유지했습니다.
  doctrine_reference: 문학적-수사적 직역 원칙
