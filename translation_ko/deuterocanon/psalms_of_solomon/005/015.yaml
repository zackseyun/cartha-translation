  text: A man's kindness is sparing and for tomorrow; and if he repeats it without grumbling[a], even at this you will marvel.
  footnotes:
  - marker: a
    text: Or 'is given sparingly and put off till tomorrow.' The Greek around 'for tomorrow' is terse and elliptical, so the sense of delay may be implied rather than fully expressed.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람의 친절은 아껴서, 내일을 위해 두며, 그가 그것을 다시 해도 불평 없이 한다면, 이 일에도 당신은 놀라게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아껴서 주며 내일까지 미룬다’로도 옮길 수 있습니다. ‘내일’(αὔριον) 앞뒤가 매우 압축되어 있어, 지연의 뜻이 암시되지만 문장에 완전히 풀어 쓰이지는 않습니다.
    reason: alternative_reading
lexical_decisions:
