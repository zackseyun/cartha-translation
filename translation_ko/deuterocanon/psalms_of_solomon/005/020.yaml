  source_fidelity: 초안의 ‘적은 몫’은 μέτριον(알맞은, 절제된, 알맞은 정도의)을 ‘작은’이라는 양적 의미로 좁혀 옮긴 것이므로 수정이 필요합니다. 또한 πλησμονή는 ‘만족’보다 ‘충만, 가득 참’에 더 직접적으로 해당합니다. 두 차례의 ἐν δικαιοσύνῃ도 모두 ‘의 안에서’로 유지하는 편이 원문의 반복과 범위를 충실히 반영합니다.
  naturalness: ‘의 안에서 알맞은 몫이면 충분합니다’는 현대 한국어에서 자연스럽고, 격조를 유지합니다. 마지막 목적/결과 구는 한국어에서 서술 관계를 드러내기 위해 ‘이르게 합니다’로 연결했습니다.
  terminology: δικαιοσύνη는 신학적으로 과도하게 해석하지 않고 ‘의’로, εὐλογία Κυρίου는 관용적이고 적절한 ‘주님의 복’으로 유지했습니다. πλησμονή는 ‘충만함’으로 번역했습니다.
