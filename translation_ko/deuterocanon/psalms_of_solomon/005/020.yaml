  yaml_path: translation/deuterocanon/psalms_of_solomon/005/020.yaml
  text: Enough is a modest portion with righteousness, and in this is the Lord’s blessing—Enough is a modest portion with righteousness, and in this is the Lord’s blessing, for satisfaction in righteousness. in righteousness.
translation:
  language: ko
  text: 의 안에서 알맞은 몫이면 충분합니다. 그 안에 주님의 복이 있어 의 안에서 충만함에 이르게 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱκανὸν τὸ μέτριον
  english_pob_choice: Enough is a modest portion
  chosen_korean: 적은 몫이면 충분합니다
  alternatives_korean:
  - 절제된 몫이면 충분합니다
  - 적당한 몫이면 족합니다
  lexicon: ἱκανός / μέτριος
  rationale: ἱκανόν은 ‘충분한’, μέτριον은 ‘적절한/절제된’의 뜻이므로, 자연스러운 현대 한국어로 ‘적은 몫이면 충분합니다’라고 옮겨 절제된 소유의 의미를 살렸습니다.
- source_word: ἐν δικαιοσύνῃ
  english_pob_choice: with righteousness / in righteousness
  chosen_korean: 의로움과 함께
  alternatives_korean:
  - 의 가운데
  - 의 안에서
  lexicon: δικαιοσύνη
  rationale: 여기서는 삶의 상태를 수식하는 전치사구로 보아 ‘의로움과 함께’라고 풀어, 단순한 추상명사가 아니라 동반되는 삶의 성격을 드러냈습니다.
- source_word: ἡ εὐλογία Κυρίου
  english_pob_choice: the Lord’s blessing
  chosen_korean: 주님의 복
  alternatives_korean:
  - 주님의 축복
  - 주님의 복된 은혜
  lexicon: εὐλογία / κύριος
  rationale: εὐλογία는 ‘복’이 가장 간결하고 직접적이며, Κυρίου는 주님으로 옮겨 시편적 경건 언어를 유지했습니다.
- source_word: εἰς πλησμονὴν
  english_pob_choice: for satisfaction / abundance
  chosen_korean: 만족함이 있습니다
  alternatives_korean:
  - 충족이 있습니다
  - 배부름이 있습니다
  lexicon: πλησμονή
  rationale: πλησμονή는 ‘가득 참, 만족, 충족’의 뜻이므로 ‘만족함’으로 옮겨 단순한 양적 충만보다 필요가 채워지는 의미를 살렸습니다.
theological_decisions:
- issue: 두 번째 절반의 반복 구조와 결말 처리
  chosen_reading: 마지막 구를 독립적인 설명처럼 분리하지 않고, ‘이 안에 주님의 복이 있습니다’ 뒤에 ‘의로움 안에서 만족함이 있습니다’로 이어지는 병렬 구조를 살렸습니다.
  alternative_readings:
  - 쉼표 없이 한 문장으로 길게 연결하는 읽기
  - ‘의로움 안에서’만 결말부로 보는 읽기
  rationale: 헬라어는 ‘그리고 이 안에 주님의 복이 있다, 의로움 안에서의 충만/만족을 위해’라는 식의 병렬적, 목적/결과적 여운을 지니므로, 한국어에서도 반복을 과도하게 다듬지 않고 원문의 긴장을 유지했습니다.
  doctrine_reference: 시편적 지혜 전통의 절제와 의의 복됨
- issue: ‘야훼’가 아닌 ‘주님’ 사용
  chosen_reading: 본문의 Κυρίου는 시편적 경건 표현으로 ‘주님의’라고 번역했습니다.
  alternative_readings:
  - 야훼의 복
  - 주 하나님의 복
  rationale: 이 구절은 직접적인 YHWH 표기 대신 Κυρίου를 사용하며, POB의 기본 원칙상 야훼 표기는 히브리어 YHWH 또는 그 LXX 인용 대응이 분명할 때 주로 적용되므로, 여기서는 ‘주님’이 더 적절합니다.
  doctrine_reference: κύριος 표기 원칙
