theological_decisions:
- issue: ὑπερπλεονάσῃ를 단순한 재산의 많음으로 완화할지 여부
  chosen_reading: ‘지나치게 넘치면’으로 옮겨, 과잉 자체가 죄와 연결된다는 진술을 유지했습니다.
  alternative_readings:
  - 풍족하면
  - 너무 많으면
  rationale: 본문은 탐욕이나 물욕을 직접 명명하지 않고 ‘과도함’과 ‘죄’를 병치하므로, 해석을 좁히지 않고 긴장을 그대로 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
