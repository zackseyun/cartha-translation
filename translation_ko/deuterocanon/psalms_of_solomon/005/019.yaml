  - 너무 많으면
  rationale: 본문은 탐욕이나 물욕을 직접 명명하지 않고 ‘과도함’과 ‘죄’를 병치하므로, 해석을 좁히지 않고 긴장을 그대로 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
