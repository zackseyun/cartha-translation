lexical_decisions:
- source_word: ἄνθρωπος
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 인류
  lexicon: BDAG
  rationale: 여기서는 대표적 인간 한 사람을 가리키는 단수 표현이므로, 성별을 과도하게 좁히지 않되 단수성을 살려 ‘사람’으로 옮겼습니다.
- source_word: ἡ μερὶς αὐτοῦ
  english_pob_choice: portion
  chosen_korean: 그의 몫
  alternatives_korean:
  - 그의 분깃
  - 그의 سهم(몫)
  - 그의 سهم
  lexicon: LSJ
  rationale: 배정된 할당분이라는 뜻을 살리기 위해, 분배·측량의 뉘앙스가 있는 ‘몫’을 택했습니다.
- source_word: παρὰ σοῦ
  english_pob_choice: from you
  chosen_korean: 주님께서 주신 것으로서
  alternatives_korean:
  - 주님으로부터
  - 주님께서 주신
  - 주님 앞에서
  lexicon: BDAG
  rationale: 전치사 παρά + 속격은 ‘~으로부터’의 뜻이므로, 단순 위치 표현이 아니라 하나님께서 몫을 주신 출처를 드러내도록 풀어 옮겼습니다.
- source_word: ἐν σταθμῷ
  english_pob_choice: in the balance / on a balance
  chosen_korean: 저울 위에
  alternatives_korean:
  - 저울에
  - 저울판 위에
  - 저울 속에
  lexicon: LSJ
  rationale: 저울질의 구체적 이미지를 한국어로 자연스럽게 살리기 위해 ‘저울 위에’로 옮겼습니다.
- source_word: οὐ προσθήσει τοῦ πλεονάσαι
  english_pob_choice: he will not add so as to exceed
  chosen_korean: 더하지 못합니다
  alternatives_korean:
  - 더하여 넘어서지 못합니다
  - 더 보태어 넘치게 하지 못합니다
  - 더하여 초과하지 못합니다
  lexicon: BDAG
  rationale: 문맥상 ‘더하다’는 행위가 기준을 넘는 증대를 가리키므로, 결과를 간결하게 드러내는 ‘더하지 못합니다’로 옮겼습니다.
- source_word: κρίμα
  english_pob_choice: judgment
  chosen_korean: 심판
  alternatives_korean:
  - 판결
  - 판단
  - 심사
  lexicon: BDAG
  rationale: 하나님의 평가적 판정이라는 법정적·종말론적 뉘앙스를 살리기 위해 ‘심판’으로 옮겼습니다.
theological_decisions:
- issue: παρὰ σοῦ의 방향성 처리
  chosen_reading: 몫이 하나님께로부터 주어졌다는 출처성을 본문에 반영했습니다.
  alternative_readings:
  - 주님 앞에/주님 앞에서라는 위치성으로 이해
  - 주님 보시기에라는 관계성으로 이해
  rationale: 문법적으로는 παρά + 속격이 ‘~으로부터’이므로, 하나님이 몫을 저울질하시는 주체이자 주시는 분이라는 연결을 유지하는 쪽이 원문에 더 가깝습니다.
  doctrine_reference: DOCTRINE.md §2
