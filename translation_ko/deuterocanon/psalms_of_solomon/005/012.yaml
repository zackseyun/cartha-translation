base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/005/012.yaml
  text: And if they are hungry[a], they will lift up their faces to you.
  footnotes:
  - marker: a
    text: Lit. 'lift up their face to you,' a Greek expression for turning to God in appeal or dependence.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 만일 그들이 배고프면, 그들은 당신을 향해 얼굴을 들어 올릴 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들의 얼굴을 당신께 들어 올리다’이며, 하나님께 호소하고 의지하는 관용적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἐὰν πεινάσωσιν
  english_pob_choice: if they are hungry
  chosen_korean: 만일 그들이 배고프면
  alternatives_korean:
  - 그들이 배고프면
  - 만일 그들이 굶주리면
  lexicon: LSJ
  rationale: 조건절의 일반적 미래 의미를 살려 ‘배고프면’으로 자연스럽게 옮기되, 더 강한 ‘굶주리면’은 원문의 강도를 넘어설 수 있어 기본 본문에서는 쓰지 않았습니다.
- source_word: ἀροῦσιν πρόσωπον αὐτῶν
  english_pob_choice: will lift up their faces
  chosen_korean: 얼굴을 들어 올릴 것입니다
  alternatives_korean:
  - 얼굴을 들 것입니다
  - 얼굴을 들어 올리겠습니다
  lexicon: LSJ
  rationale: 직역 가능한 동작 이미지를 유지해 청원·의존의 관용구를 드러내기 위해 ‘들다’보다 ‘들어 올리다’를 택했습니다.
- source_word: πρὸς σὲ
  english_pob_choice: to you
  chosen_korean: 당신을 향해
  alternatives_korean:
  - 당신에게
  - 당신 앞에
  lexicon: LSJ
  rationale: πρός의 방향성을 살리기 위해 ‘-을 향해’로 옮겼고, 문맥상 하나님께 대한 직접 호소이므로 존칭 대명사 ‘당신’을 사용했습니다.
theological_decisions:
- issue: ‘얼굴을 들어 올리다’의 관용적 의미
  chosen_reading: 단순한 신체 동작이 아니라 하나님께 호소하고 의지하는 태도를 나타내는 표현으로 보존했습니다.
  alternative_readings:
  - ‘당신께로 돌이키다’처럼 의미를 풀어 쓰는 번역
  - ‘하늘을 향해 바라보다’처럼 해석을 덧붙이는 번역
  rationale: 영어 POB 주석이 지적하듯 이 표현은 청원과 의존의 관용구이므로, 해설로 평탄화하지 않고 이미지 자체를 유지하는 것이 원문 효과를 더 정확히 전달합니다.
  doctrine_reference: 시적/관용 표현 보존 원칙
