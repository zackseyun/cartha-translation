base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/005/013.yaml
  text: You feed kings and rulers and peoples, O God; and You sustain kings and rulers and peoples, O God; and who is the hope of the poor and needy, if not you, Lord?
translation:
  language: ko
  text: 주님, 당신은 왕들과 통치자들과 백성들을 먹이십니다. 그리고 가난한 자와 궁핍한 자의 희망은 당신이 아니면 누구이겠습니까, 주님?[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: 영어 POB는 이 절의 τρέφεις를 ‘feed’로 유지합니다. 본문은 하나님의 공급 행위를 나타내며, ‘먹이십니다’가 그 직접성을 가장 잘 반영합니다.
    reason: source_note
  - marker: b
    text: πτωχοῦ καὶ πένητος는 둘 다 가난을 뜻하지만, δεύτερος 항목 πένητος는 궁핍과 결핍의 더 절박한 상태를 강조합니다.
    reason: source_note
lexical_decisions:
- source_word: τοὺς βασιλεῖς καὶ ἄρχοντας καὶ λαοὺς
  english_pob_choice: kings and rulers and peoples
  chosen_korean: 왕들과 통치자들과 백성들
  alternatives_korean:
  - 임금들과 지배자들과 백성들
  - 왕들과 관원들과 사람들
  lexicon: βασιλεῖς / ἄρχοντας / λαοὺς
  rationale: 기본 대칭 구조를 살리면서 βασιλεῖς는 ‘왕들’, ἄρχοντας는 권위를 가진 ‘통치자들’, λαοὺς는 집단적 의미의 ‘백성들’로 옮겼습니다.
- source_word: σὺ τρέφεις
  english_pob_choice: You feed
  chosen_korean: 당신은 ... 먹이십니다
  alternatives_korean:
  - 당신은 ... 기르십니다
  - 당신은 ... 양육하십니다
  lexicon: τρέφω
  rationale: τρέφω는 단순히 ‘먹이다’보다 ‘먹여 살리다/기르다’의 뜻을 포함하지만, 시적 병행에서 하나님의 공급 행위를 직접적으로 드러내기 위해 ‘먹이십니다’를 택했습니다.
- source_word: πτωχοῦ καὶ πένητος
  english_pob_choice: the poor and needy
  chosen_korean: 가난한 자와 궁핍한 자
  alternatives_korean:
  - 가난한 자와 빈궁한 자
  - 빈곤한 자와 궁핍한 자
  lexicon: πτωχός / πένης
  rationale: 두 형용사의 미묘한 차이를 살려 πτωχός는 ‘가난한 자’, πένης는 ‘궁핍한 자’로 구분해, 단순한 중복이 아니라 절박함의 강도를 드러냈습니다.
- source_word: ἡ ἐλπὶς τίς ἐστιν εἰ μὴ σύ, Κύριε;
  english_pob_choice: who is the hope ... if not you, Lord?
  chosen_korean: '... 희망은 당신이 아니면 누구이겠습니까, 주님?'
  alternatives_korean:
  - '... 소망은 당신이 아니면 누구이겠습니까, 주님?'
  - '... 희망은 주님밖에 누구이겠습니까?'
  lexicon: ἐλπίς / Κύριε
  rationale: ἐλπίς는 한국 교회어 ‘소망’도 가능하지만, 문맥상 의문문 속 직접적 숭앙을 살리기 위해 ‘희망’을 택했고, Κύριε는 직접 호칭이므로 ‘주님’으로 옮겼습니다.
theological_decisions:
- issue: 하나님 호칭의 병렬과 직접 호칭 처리
  chosen_reading: 앞부분의 ὁ θεός와 끝의 Κύριε를 모두 한국어 독자에게 자연스러운 직접 호칭으로 처리하여, 전반부는 ‘당신은’으로, 종결부는 ‘주님’으로 유지했습니다.
  alternative_readings:
  - 전반부를 모두 ‘하나님’으로 반복
  - 종결부를 ‘주여’로 옮김
  rationale: 본문은 하나님을 2인칭으로 부르면서도 명시적으로 호칭을 반복하므로, 시적 평행을 보존하되 한국어에서는 어색한 명사 반복을 줄였습니다.
  doctrine_reference: 시편적 기도체의 직접 호칭 관례
