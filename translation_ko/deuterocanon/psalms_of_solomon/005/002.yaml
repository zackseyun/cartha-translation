translation:
  language: ko
  text: 이는 주님께서 선하시고 자비로우시며, 가난한 이들의 피난처이시기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 구절은 문법상 ‘가난한 이들의 피난처’가 하나님을 덧붙여 설명하는 표현입니다. 영어 POB의 이전 각주처럼, 문맥상 “가난한 이들의 피난처가 선하고 자비롭다”로도 읽힐 수 있는 배열입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면
  - For
  lexicon: BDAG
  rationale: 접속사 ὅτι는 앞말의 근거를 제시하므로, 합쇼체 문맥에서 자연스러운 설명 연결인 “이는 … 때문입니다”로 옮겼습니다.
- source_word: ἐχρηστὸς
  english_pob_choice: kind
  chosen_korean: 선하시고
  alternatives_korean:
  - 친절하시고
  - 인자하시고
  - 좋으시고
  lexicon: BDAG
  rationale: χρηστός는 관계적이고 호의적인 성품을 가리키므로, 한국어에서는 문맥상 자연스럽고 신학적으로도 무난한 “선하시고”로 반영했습니다.
- source_word: ἐλεήμων
  english_pob_choice: merciful
  chosen_korean: 자비로우시며
  alternatives_korean:
  - 긍휼이 많으시며
  - 은혜로우시며
  - 불쌍히 여기시는
  lexicon: BDAG
  rationale: ἐλεήμων은 자비를 베푸는 성품을 직접 가리키므로, 하나님께 드리는 서술로 가장 자연스러운 “자비로우시며”를 선택했습니다.
- source_word: ἡ καταφυγὴ τοῦ πτωχοῦ
  english_pob_choice: the refuge of the poor
  chosen_korean: 가난한 이들의 피난처이시기
  alternatives_korean:
  - 가난한 이들의 피난처이시기
  - 가난한 자의 피난처이시기
  - 가난한 이들의 도피처이시기
  lexicon: LSJ
  rationale: καταφυγή는 ‘피난처/도피처’의 뜻이므로 메타포를 살리기 위해 “피난처”를 택했고, τοῦ πτωχοῦ는 공동체적이고 현대적인 한국어 감각을 고려해 “가난한 이들의”로 옮겼습니다.
theological_decisions:
- issue: 주어와 보어의 관계(‘the refuge of the poor’의 처리)
  chosen_reading: ‘가난한 이들의 피난처’는 주어를 바꾸지 않고 하나님을 설명하는 동격적 보어로 처리했습니다.
  alternative_readings:
  - ‘가난한 이들의 피난처는 선하시고 자비로우시다’
  - ‘가난한 이들의 피난처는 하나님이시다’
  rationale: 원문에서는 형용사들이 하나님을 수식하고, ‘피난처’는 그분의 성격을 덧붙여 설명하는 표현이므로, 영어 감사본의 수정 방향을 반영해 주어 혼동을 피했습니다.
  doctrine_reference: 시편적 신적 호칭과 수식 관계
- issue: 신적 호칭의 존칭 처리
  chosen_reading: 직접 하나님께 드리는 서술이므로 ‘선하시고 자비로우시며’처럼 합쇼체 존칭을 유지했습니다.
  alternative_readings:
  - 비존칭 서술
  - 기도체 어미 강화
  rationale: 시편적 찬양 문맥에서 하나님을 향한 존칭은 의미적 요구에 해당하므로, 한국어 종교 문체의 자연스러움과 공손함을 함께 유지했습니다.
  doctrine_reference: 예배 언어와 신적 존대
