  to: 그리고 만일 주께서 우리를 돌이키지 않으시면, 우리는 물러서지 않고 도리어 주께 나아갈 것입니다.[a][b][c]
  rationale: 원문의 조건-결과 구조와 대조를 유지하면서, 한국어에서 부자연스러운 ‘멀리하지 않을 것이나’를 ‘물러서지 않고’로 바로잡았습니다. ‘돌이키다’는 원문의 전환 의미를 보존하되 교리적으로 특정한 뜻을 강요하지 않았습니다. ἐπὶ σέ의 해석상 여지는 본문을 과도하게 결정하지 않고 각주에 남겼습니다.
