    issue: ‘우리는 멀리하지 않을 것이나’는 비자연스럽고 의미가 불명확합니다.
    rationale: ἀφέξομαι의 여기서의 절대적 미래 중간태는 ‘거리를 두다, 물러서다, 자제하다’의 뜻입니다. 한국어 ‘멀리하다’는 통상 목적어를 요구하므로, ‘물러서지 않고’로 고쳐야 자연스럽고 대조도 살아납니다.
