translation:
  language: ko
  text: 그리고 만일 주께서 우리를 돌이키지 않으시면, 우리는 멀리하지 않을 것이나 — 오히려 주께 나아갈 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘우리를 돌이키지’는 문자적으로 ‘우리를 되돌리지/돌려주지’에 해당할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘우리는 멀리하지 않을 것이나’는 ‘우리는 자제하지 않겠다’ 또는 ‘우리는 머물러 있지 않겠다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘주께 나아갈 것입니다’는 ‘주께 갈 것입니다’ 또는 ‘주께로 올 것입니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν μὴ
  english_pob_choice: if ... not
  chosen_korean: 만일 ... 않으시면
  alternatives_korean:
  - '...하지 않으시면'
  - '...하지 않으면'
  lexicon: BDAG
  rationale: 직접적인 조건문 구조를 살리면서, 하나님께 드리는 간구에 맞게 공손한 종결형을 유지했습니다.
- source_word: ἐπιστρέψῃς
  english_pob_choice: turn us back
  chosen_korean: 우리를 돌이키지
  alternatives_korean:
  - 우리를 돌아오게 하지
  - 우리를 회복시키지
  - 우리를 돌려보내지
  lexicon: BDAG
  rationale: 인칭 목적어를 가진 ἐπιστρέφω의 방향성을 살려 ‘돌이키다’로 옮겼고, 문맥상 필요 이상의 신학적 확장을 피했습니다.
- source_word: οὐκ ἀφεξόμεθα
  english_pob_choice: we will not keep away
  chosen_korean: 우리는 멀리하지 않을 것이나
  alternatives_korean:
  - 우리는 물러서지 않을 것이나
  - 우리는 떨어져 있지 않을 것이나
  - 우리는 머물지 않을 것이나
  lexicon: LSJ
  rationale: ‘떠나 있지 않다/멀리하다’는 뜻을 자연스러운 현대 한국어로 옮기되, 다음 절의 ‘주께 나아갈 것입니다’와 대조가 드러나게 했습니다.
- source_word: ἐπὶ σὲ ἥξομεν
  english_pob_choice: we will come to you
  chosen_korean: 주께 나아갈 것입니다
  alternatives_korean:
  - 주께 갈 것입니다
  - 주께 올 것입니다
  - 주께 다가갈 것입니다
  lexicon: BDAG
  rationale: ἥκω의 도착·도달 뉘앙스를 반영해 ‘나아가다’로 옮겨, 단순 이동보다 간절한 접근의 느낌을 살렸습니다.
theological_decisions:
- issue: 하나님이 우리를 ‘돌이키신다’는 표현의 신학적 범위
  chosen_reading: 회개/개종으로 단정하지 않고, 하나님이 우리를 다시 자신께로 향하게 하시는 간구로 읽었습니다.
  alternative_readings:
  - 우리를 회복시키신다
  - 우리를 회개하게 하신다
  - 우리를 개종시키신다
  rationale: 본문의 동사 자체는 귀환·전환의 의미를 가지지만, 여기서는 시편적 탄원으로서의 관계 회복을 유지하는 것이 더 정확합니다.
  doctrine_reference: 본문이 요구하는 표현 이상으로 교리를 확정하지 않음
