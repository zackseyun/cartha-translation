translation:
  language: ko
  text: 그리고 만일 주께서 우리를 돌이키지 않으시면, 우리는 물러서지 않고 도리어 주께 나아갈 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘우리를 돌이키지’는 ‘우리를 되돌리지’ 또는 ‘우리가 돌아오게 하지’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘우리는 물러서지 않고’는 ‘우리는 자제하지 않고’ 또는 ‘우리는 거리를 두지 않고’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘주께 나아갈 것입니다’는 ‘주께 갈 것입니다’으로도 옮길 수 있습니다. 전치사의 뉘앙스에 따라서는 ‘주를 향해 닥쳐갈 것입니다’라는 뜻으로 이해될 수도 있습니다.
    reason: lexical_alternative
