  source_fidelity: 조건문과 미래 시제, 그리고 ἀλλʼ의 대조는 대체로 반영되어 있습니다. 다만 οὐκ ἀφεξόμεθα를 옮긴 ‘우리는 멀리하지 않을 것이나’는 한국어에서 목적어 없이 자연스럽지 않고, ‘멀리하다’는 원문의 ‘물러서다/자제하다/거리를 두다’라는 절대적 용법을 정확히 드러내지 못합니다. ἐπὶ σέ는 기본 번역에서 ‘주께’로 두되, 문맥에 따라 ‘주를 향해/주께 닥쳐’라는 방향·대항의 뉘앙스도 가능한 만큼 각주에서 보존했습니다.
  naturalness: ‘우리는 물러서지 않고 도리어’가 현대 표준어 합쇼체에서 자연스럽고, 뒤의 ‘주께 나아갈 것입니다’와의 대조도 분명합니다. 대시와 어색한 ‘것이나’ 연결을 제거했습니다.
  terminology: ‘돌이키다’는 ἐπιστρέψῃς의 핵심적인 전환·귀환 의미를 유지하며, ‘회개시키다’나 ‘회복시키다’처럼 신학적 의미를 단정하지 않습니다. 본문에 명시된 호칭은 아니지만, 기존 번역의 문맥상 신적 수신자 지시인 ‘주’를 유지했습니다.
  issues:
