  source_fidelity: 첫머리의 καὶ σὺ는 ‘그러면’이 아니라 ‘그리고 주님께서는/주님은’이며, ἐπακούσῃ는 미래의 응답적 들음을 나타냅니다. 또한 εὐφρᾶναι는 ‘기쁘게 하다’라는 부정사로, 수사 의문문의 행위를 이룹니다. ψυχὴν ταπεινὸν이라는 제시 본문의 형태에는 성·격 불일치가 있으나, 영어 감사 기록이 지적하듯 ταπεινοῦ(‘겸손한 이의’)라는 전승/판독을 반영한 번역이 문맥과 문법에 가장 잘 맞습니다.
  naturalness: 원문의 수사 의문문을 한 문장으로 유지하고, ‘손을 펴다’라는 자연스러운 한국어 관용 표현으로 베푸심의 이미지를 보존했습니다. ‘친절하다’는 하나님을 향한 찬양 문맥에서는 다소 일상적이므로 ‘선하시고 온유하시다’로 다듬었습니다.
  terminology: ‘긍휼’은 가능하지만 ἐν ἐλέει에는 현대적인 문어 표현인 ‘자비로’가 자연스럽습니다. ‘겸손한 이’는 ταπεινός의 낮아짐을 유지하며, ‘영혼’은 ψυχή의 시적·경건한 어조를 보존합니다.
