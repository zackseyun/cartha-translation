base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/005/014.yaml
  text: And you will hear[a], for who is kind and gentle but you[c][b], to gladden the soul of the humble when you open your hand in mercy?
  footnotes:
  - marker: a
    text: Or 'you will hear favorably' or 'you will answer'; the verb can imply responsive hearing, especially in prayer.
    reason: lexical_alternative
  - marker: b
    text: '''Open your hand'' is an idiom for generous giving or provision.'
    reason: cultural_note
  - marker: c
    text: Or 'making glad a humble soul'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 주님께서는 들으실 것입니다.[a] 주님 외에 누가 선하시고 온유하여 자비로 손을 펴실 때[b] 겸손한 이의 영혼을 기쁘게 하겠습니까?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἐπακούσῃ는 단순히 ‘듣다’보다 기도에 호의적으로 귀 기울여 응답한다는 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘손을 펴다’는 넉넉히 베풀고 공급한다는 뜻의 관용적 이미지입니다.
    reason: cultural_note
  - marker: c
    text: 그리스어는 ‘기쁘게 하다’라는 부정사를 사용합니다. 제시 본문의 ταπεινὸν은 앞의 ‘영혼’과 성·격이 맞지 않으며, 문맥과 영어 감사 기록은 ‘겸손한 이의 영혼’을 뜻하는 ταπεινοῦ 판독을 뒷받침합니다.
    reason: textual_note
lexical_decisions:
- source_word: ἐπακούσῃ
  english_pob_choice: you will hear
  chosen_korean: 들으십니다
  alternatives_korean:
  - 잘 들으십니다
  - 응답하십니다
  lexicon: LSJ
  rationale: ἐπακούω는 단순 청취보다 응답적·호의적 ‘들음’을 포함할 수 있어, 문맥상 기도에 대한 응답 뉘앙스를 살리면서도 자연스러운 합쇼체로 옮겼습니다.
- source_word: χρηστός
  english_pob_choice: kind
  chosen_korean: 친절하고
  alternatives_korean:
  - 선하고
  - 자비롭고
  lexicon: LSJ
  rationale: 하나님의 선하심을 인격적이고 베푸시는 성격으로 드러내기 위해 ‘친절하고’를 택했습니다.
- source_word: ἐπιεικής
  english_pob_choice: gentle
  chosen_korean: 온유하시겠습니까
  alternatives_korean:
  - 관대하시겠습니까
  - 부드러우시겠습니까
  lexicon: LSJ
  rationale: χρηστός와 짝을 이루는 절제된 부드러움을 ‘온유하다’로 살렸고, 수사적 질문 구조에 맞춰 종결을 자연스럽게 구성했습니다.
- source_word: ἐν τῷ ἀνοῖξαι χεῖρά σου
  english_pob_choice: when you open your hand
  chosen_korean: 손을 여실 때
  alternatives_korean:
  - 손을 펴실 때
  - 손을 여셔서
  lexicon: LSJ
  rationale: ‘손을 열다’는 히브리적 관용구로서 베푸심과 공급을 뜻하므로, 한국어에서도 그 이미지를 직역에 가깝게 유지했습니다.
theological_decisions:
- issue: 문장 전체의 수사적 형식
  chosen_reading: 두 번째 절반을 ‘누가 주님 외에…겠습니까?’라는 수사적 질문으로 처리해 하나님의 유일성을 강조했습니다.
  alternative_readings:
  - 직설적 평서문으로 ‘주님만이 친절하고 온유하십니다’
  - 감탄문으로 처리
  rationale: 원문 τίς χρηστὸς καὶ ἐπιεικὴς ἀλλʼ ἢ σύ는 대조를 통한 수사적 질문이므로, 평서문으로 약화하지 않고 질문 구조를 유지했습니다.
  doctrine_reference: 하나님의 유일한 선하심과 자비로움에 대한 찬양
- issue: ψυχὴν ταπεινόν의 의미
  chosen_reading: ‘겸손한 사람의 영혼’으로 옮겨, humble을 도덕적·영적 낮아짐으로 이해했습니다.
  alternative_readings:
  - ‘낮은 영혼’
  - ‘겸손한 영혼’
  rationale: 주어진 그리스어와 영어 POB의 판단을 따라, 단순 심리 상태보다 하나님 앞의 낮아짐을 드러내는 표현이 더 적절합니다.
  doctrine_reference: 겸손한 자를 돌보시는 하나님의 성품
