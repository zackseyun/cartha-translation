revisions:
- from: 그러면 주님께서 들으십니다. 왜냐하면 누가 주님 외에 친절하고 온유하시겠습니까? 주님께서 긍휼로 손을 여실 때, 겸손한 사람의 영혼을 기쁘게 하십니다.[a][b][c]
  to: 그리고 주님께서는 들으실 것입니다.[a] 주님 외에 누가 선하시고 온유하여 자비로 손을 펴실 때[b] 겸손한 이의 영혼을 기쁘게 하겠습니까?[c]
  rationale: 접속사와 2인칭 주어를 바로잡고, ‘누가 ... 하겠습니까?’라는 원문의 수사 의문문 안에 부정사 ‘기쁘게 하다’를 복원했습니다. 손을 여는 이미지는 한국어에서 자연스러운 ‘손을 펴다’로 옮겼습니다. ψυχὴν ταπεινὸν의 형태상 난점은 번역문을 불필요하게 훼손하지 않도록 문맥상 가장 개연적인 ‘겸손한 이의 영혼’으로 번역하고, 각주에서 투명하게 밝혔습니다.
  reviewer_model: gpt-5.6-terra
