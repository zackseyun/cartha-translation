lexical_decisions:
- source_word: μὴ βαρύνῃς
  english_pob_choice: Do not lay your hand heavily
  chosen_korean: 당신의 손을 우리 위에 무겁게 하지 마십시오
  alternatives_korean:
  - 당신의 손으로 우리를 누르지 마십시오
  - 당신의 손을 우리에게 무겁게 하지 마십시오
  - 당신의 손을 우리 위에 가중하지 마십시오
  lexicon: LSJ / Swete context
  rationale: βαρύνῃς의 ‘무겁게 하다’라는 기본 이미지를 살리면서, 한국어에서는 ‘손을 무겁게 하다’보다 ‘손을 우리 위에 무겁게 하지 마십시오’가 자연스럽고 압박의 비유를 보존합니다.
- source_word: χεῖρά σου
  english_pob_choice: your hand
  chosen_korean: 당신의 손
  alternatives_korean:
  - 주님의 손
  - 손길
  lexicon: BDAG / LXX usage
  rationale: 본문은 구체적으로 ‘손’을 말하므로, 추상화된 ‘손길’이나 해석적 ‘주님의 손’보다 직접적으로 옮겼습니다.
- source_word: ἐφʼ ἡμᾶς
  english_pob_choice: upon us
  chosen_korean: 우리 위에
  alternatives_korean:
  - 우리에게
  - 우리에게 대하여
  - 우리에게 임하게
  lexicon: BDAG
  rationale: ἐπί + 목적격의 위에/위로라는 공간적 이미지를 따라, 압박이 ‘우리 위에’ 놓이는 느낌을 유지했습니다.
- source_word: διʼ ἀνάγκην ἁμάρτωμεν
  english_pob_choice: we may not sin under compulsion
  chosen_korean: 우리가 억지로 죄를 짓지 않게 됩니다
  alternatives_korean:
  - 우리가 강제로 죄를 짓지 않게 됩니다
  - 우리가 필요에 따라 죄짓지 않게 됩니다
  - 우리가 어쩔 수 없이 죄를 짓지 않게 됩니다
  lexicon: BDAG
  rationale: ἀνάγκη는 단순한 필요가 아니라 강제·압박의 뜻이 강하므로, ‘억지로’로 옮겨 외적 압력 아래 죄로 몰리는 상황을 드러냈습니다.
theological_decisions:
- issue: ἵνα μὴ의 종속 목적/결과 절 처리
  chosen_reading: ‘그렇게 하시면’으로 앞절과 뒤절을 연결해, 압박의 결과로 죄에 이르지 않게 해 달라는 간구를 드러냈습니다.
  alternative_readings:
  - ‘그래서 우리가 죄를 짓지 않도록’
  - ‘죄를 짓지 않게 하시려는 뜻으로’
  rationale: ἵνα μὴ는 목적과 결과를 함께 띨 수 있으므로, 한국어에서는 기도문답의 자연스러운 흐름 속에 결과적 의도를 살렸습니다.
  doctrine_reference: 문법/담화 기능
- issue: 기도체의 공손한 직접 호칭
  chosen_reading: 하나님께 드리는 간구로 보고, 합쇼체 명령·청유형을 사용했습니다.
  alternative_readings:
  - 더 직설적인 명령형
  - 더 전통적인 하옵소서체
  rationale: 본문의 청원적 성격을 현대 예배 문체에 맞게 공손하게 옮기되, 원문의 간절한 요청성을 약화시키지 않도록 했습니다.
  doctrine_reference: 문체/화행
