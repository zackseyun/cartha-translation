  source_fidelity: ‘인자하심’은 문맥상 가능하나, ἔλεος의 직접적이고 비언약적으로 특정되지 않은 의미인 ‘mercy’를 옮기기에는 ‘자비’가 더 정확합니다. 또한 원문의 ἐπὶ πᾶσαν τὴν γῆν은 온 땅에 미치는 넓은 범위를 나타내며, 한국어에서는 ‘미칩니다’로 자연스럽게 표현할 수 있습니다. χρηστότητι는 하나님의 선한 성품 또는 그 성품에 따른 방식을 나타내므로 ‘선하심으로’를 유지할 수 있습니다.
  naturalness: 초안의 ‘온 땅 위에 있습니다, 주님, 선하심으로’는 한국어 어순상 종결 뒤에 호격과 부사구가 이어져 다소 부자연스럽고, ‘자비가 땅 위에 있다’라는 표현도 범위의 뜻을 충분히 자연스럽게 드러내지 못합니다. 호격을 앞에 두고 ‘온 땅에 미칩니다’로 옮기면 현대 표준어 합쇼체의 시적·격식 있는 문장이 됩니다.
