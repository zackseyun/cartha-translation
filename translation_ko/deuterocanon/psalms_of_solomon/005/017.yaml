  text: Your mercy is over all the earth, O Lord, in kindness.
translation:
  language: ko
  text: 주의 인자하심이 온 땅 위에 있습니다, 주님, 선하심으로.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεός
  english_pob_choice: mercy
  chosen_korean: 인자하심
  alternatives_korean:
  - 긍휼
  - 자비
  lexicon: BDAG
  rationale: ἔλεος의 핵심은 자비로운 긍휼이지만, 시적 문맥에서는 관계적 따뜻함을 살리는 ‘인자하심’이 한국어에서 가장 자연스럽고 무게도 유지합니다.
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  english_pob_choice: over all the earth
  chosen_korean: 온 땅 위에
  alternatives_korean:
  - 온 땅에
  - 온 땅 전체에
  lexicon: BDAG
  rationale: ἐπί+대격은 ‘~위에/~에 걸쳐’의 확장성을 가지므로, 범위를 넓게 덮는 이미지를 살려 ‘온 땅 위에’로 옮겼습니다.
- source_word: Κύριε
  english_pob_choice: O Lord
  chosen_korean: 주님
  alternatives_korean:
  - 오 주님
  - 주여
  lexicon: BDAG
  rationale: 호격의 직접 호소는 문맥상 한국어 어순과 쉼표로 드러낼 수 있어, 과도한 번역어 삽입 없이 ‘주님’으로 자연스럽게 처리했습니다.
- source_word: χρηστότητι
  english_pob_choice: kindness
  chosen_korean: 선하심으로
  alternatives_korean:
  - 친절함으로
  - 은혜로
  lexicon: BDAG
  rationale: χρηστότης는 ‘친절’보다 품성적 선함을 가리키는 경우가 많아, 문장의 종결 수단을 나타내는 조사 ‘-으로’와 함께 ‘선하심으로’가 가장 간결합니다.
theological_decisions:
- issue: 주의 인자하심이 땅 전체를 덮는다는 우주적 범위의 진술
  chosen_reading: 하나님의 인자하심이 온 땅 전체에 미친다는 보편적 선언으로 옮겼습니다.
  alternative_readings:
  - 개인적 호의의 표현으로 좁게 읽기
  - 언약적 사랑(헤세드)로 특수화하기
  rationale: 본문은 특정 대상보다 ‘온 땅’이라는 범위를 강조하므로, 신학적으로도 보편적 통치와 자비의 넓이를 드러내는 방향이 원문에 충실합니다.
  doctrine_reference: 시가문학의 보편적 찬양 표현
