  alternatives_korean:
  - 긍휼
  - 자비
  lexicon: BDAG
  rationale: ἔλεος의 핵심은 자비로운 긍휼이지만, 시적 문맥에서는 관계적 따뜻함을 살리는 ‘인자하심’이 한국어에서 가장 자연스럽고 무게도 유지합니다.
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  english_pob_choice: over all the earth
  chosen_korean: 온 땅 위에
  alternatives_korean:
  - 온 땅에
  - 온 땅 전체에
  lexicon: BDAG
  rationale: ἐπί+대격은 ‘~위에/~에 걸쳐’의 확장성을 가지므로, 범위를 넓게 덮는 이미지를 살려 ‘온 땅 위에’로 옮겼습니다.
- source_word: Κύριε
  english_pob_choice: O Lord
  chosen_korean: 주님
  alternatives_korean:
  - 오 주님
  - 주여
  lexicon: BDAG
  rationale: 호격의 직접 호소는 문맥상 한국어 어순과 쉼표로 드러낼 수 있어, 과도한 번역어 삽입 없이 ‘주님’으로 자연스럽게 처리했습니다.
- source_word: χρηστότητι
  english_pob_choice: kindness
  chosen_korean: 선하심으로
  alternatives_korean:
  - 친절함으로
  - 은혜로
  lexicon: BDAG
  rationale: χρηστότης는 ‘친절’보다 품성적 선함을 가리키는 경우가 많아, 문장의 종결 수단을 나타내는 조사 ‘-으로’와 함께 ‘선하심으로’가 가장 간결합니다.
