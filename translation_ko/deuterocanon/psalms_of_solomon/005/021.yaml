  rationale: ἐν적 경외의 대상이 여호와 인용 맥락이므로 ‘야훼’를 쓰고, 단순 공포보다 reverence를 살리는 ‘경외하다’를 택했습니다.
- source_word: ἐν ἀγαθοῖς
