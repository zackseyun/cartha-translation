  rationale: 시편 계열의 야훼 지칭을 직접 드러내는 프로젝트 기본값을 따르되, 마지막 소유격은 문맥상 주님의 호칭으로 처리해 가독성을 유지했습니다.
  doctrine_reference: YHWH rendering policy / divine-name consistency
- issue: τῇ βασιλείᾳ σου의 관계
  chosen_reading: ‘이스라엘 위에, 주님의 나라입니다’로 옮겨, ‘이스라엘’과 ‘주님의 나라’의 병치적 긴장을 살렸습니다.
  alternative_readings:
  - 이스라엘, 주님의 나라입니다
  - 이스라엘 안에서 주님의 나라입니다
  rationale: 영어 POB와 최신 개정이 지적하듯 단순한 위치 표현보다, 이스라엘이 하나님께 속한 영역이라는 함의를 암시하는 읽기가 문맥에 더 잘 맞습니다.
  doctrine_reference: syntax/semantic relation of apposition-like genitive-dative construction
