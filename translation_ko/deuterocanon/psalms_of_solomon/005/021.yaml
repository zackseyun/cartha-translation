translation:
  language: ko
  text: 야훼를 경외하는 이들은 좋은 것들 가운데서 기뻐하였고, 주님의 선하심은 이스라엘 위에, 주님의 나라입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘복들 가운데서 기뻐하게 되었다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이스라엘, 주님의 나라’는 이스라엘을 하나님께 속한 백성 또는 영역으로 이해한 번역일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ηὐφράνθησαν
  english_pob_choice: rejoiced
