  source_fidelity: 개정이 필요합니다. τῇ βασιλείᾳ σου는 여성 단수 여격이며, ἐπʼ Ἰσραήλ의 목적어와 문법적으로 동격일 수 없습니다. 따라서 이를 ‘이스라엘, 주님의 나라’로 처리하기보다 ‘주님의 나라 안에서’라는 영역·장소의 여격으로 옮기는 것이 그리스어 형태를 더 충실히 반영합니다. ηὐφράνθησαν의 수동 뉘앙스는 한국어에서 ‘기뻐하였습니다’로 무리 없이 표현됩니다.
  naturalness: 초안의 ‘이스라엘 위에, 주님의 나라입니다’는 서술 구조가 불완전하고 현대 한국어로도 부자연스럽습니다. ‘주님의 선하심은 주님의 나라 안에서 이스라엘 위에 있습니다’는 원문의 어순 관계를 유지하면서 완결된 합쇼체 문장입니다.
  terminology: Κύριον과 σου를 각각 ‘야훼’와 ‘주님’으로 달리 옮긴 것은 근거 없이 호칭을 혼용한 것입니다. 원문이 일관되게 κύριος 계열 표현을 사용하므로 본 절에서는 ‘주님’으로 통일합니다. χρηστότης의 ‘선하심’과 οἱ φοβούμενοι의 ‘경외하는 이들’은 적절합니다.
