lexical_decisions:
- source_word: τρέφεις
  english_pob_choice: feed
  chosen_korean: 먹이십니다
  alternatives_korean:
  - 기르십니다
  - 양육하십니다
  - 먹여 살리십니다
  lexicon: LSJ / BDAG
  rationale: τρέφω는 실제로 먹을 것을 공급해 생명을 유지하게 하는 뜻이므로, 자연스럽고 직접적인 한국어로 ‘먹이십니다’가 가장 잘 맞습니다.
- source_word: πετεινὰ καὶ τοὺς ἰχθύας
  english_pob_choice: the birds and the fish
  chosen_korean: 새들을… 물고기들도
  alternatives_korean:
  - 새들과 물고기들을
  - 날짐승들과 물고기들을
  lexicon: LSJ
  rationale: πετεινά는 일반적인 ‘새들’이고 ἰχθύας는 ‘물고기들’이므로, 과도한 설명 없이 자연스러운 복수 표현으로 옮겼습니다.
- source_word: ἐρήμοις / ἐν ἐρήμῳ
  english_pob_choice: the desolate places / the wilderness
  chosen_korean: 광야들… 광야에서
  alternatives_korean:
  - 메마른 곳들… 광야에서
  - 사막들… 사막에서
  lexicon: LSJ
  rationale: 두 표현은 모두 황폐하고 사람이 살기 어려운 땅을 가리키므로, 한국어 성서 어휘에서 널리 이해되는 ‘광야’로 통일하되 복수형과 단수형의 차이는 살렸습니다.
- source_word: εἰς ἀνατολὴν χλόης
  english_pob_choice: for the sprouting of grass
  chosen_korean: 풀이 돋아나게
  alternatives_korean:
  - 풀의 돋음에
  - 풀의 솟아남을 위해
  lexicon: LSJ
  rationale: ἀνατολή는 문자적으로 ‘돋아남/솟아오름’이어서, χλόη와 함께 풀의 생겨남을 뜻합니다. 한국어에서는 동작성을 살려 ‘풀이 돋아나게’로 옮겼습니다.
- source_word: χορτάσματα
  english_pob_choice: fodder
  chosen_korean: 먹을 것
  alternatives_korean:
  - 사료
  - 꼴
  lexicon: LSJ
  rationale: χορτάσματα는 본래 ‘먹이, 사료, 양식’의 뜻이지만, 본절은 모든 살아 있는 것의 보편적 공급을 말하므로 ‘먹을 것’이 가장 무난하고 포괄적입니다.
theological_decisions:
- issue: 하나님의 보편적 섭리를 나타내는 표현
  chosen_reading: 하나님이 새와 물고기만이 아니라 광야의 모든 살아 있는 것까지 먹이시고 먹을 것을 마련하신다는 보편적 공급의 뜻을 분명히 드러냈습니다.
  alternative_readings:
  - 문장 구조를 더 압축해 일반적인 자연 섭리로 약화시킬 수 있음
  - ‘먹을 것’ 대신 ‘사료’로 좁혀 동물 중심으로 읽힐 수 있음
  rationale: 본문의 핵심은 하나님이 황폐한 땅에서도 생명체를 돌보시는 주권적 공급입니다. 이를 축소하지 않도록 ‘모든 살아 있는 것’과 ‘먹을 것을 마련하십니다’를 유지했습니다.
  doctrine_reference: 창세기 1:29-30; 시편 104:27-28
