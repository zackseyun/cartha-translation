base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/013/011.yaml
  text: But upon the godly is the mercy of the Lord[c][b][a], and upon those who fear him is his mercy.
  footnotes:
  - marker: a
    text: Or 'devout ones' or 'saints.'
    reason: lexical_alternative
  - marker: b
    text: '''Fear him'' can also be expressed as ''revere him,'' but the Greek keeps the stronger biblical language of fearing God.'
    reason: lexical_alternative
  - marker: c
    text: Or 'holy ones'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 경건한 이들에게는 주님의 자비가 있으며, 그분을 두려워하는 이들에게는 그분의 자비가 있습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘경건한 이들’은 ὅσιοι의 자연스러운 번역이지만, 문맥에 따라 ‘경건한 사람들’로도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그분을 두려워하는 이들’은 ‘그분을 경외하는 이들’로도 옮길 수 있으나, 원문의 성경적 두려움 언어를 살렸습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘주님’은 직역상 단순히 ‘주’일 수 있으나, 한국어 문맥의 자연스러움을 위해 보편적 예배 호칭을 사용했습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ὁσίους
  english_pob_choice: godly
  chosen_korean: 경건한 이들
  alternatives_korean:
  - 경건한 사람들
  - 의로운 이들
  - 성도들
  lexicon: LSJ
  rationale: Psalms of Solomon에서 ὅσιοι는 단순히 제도적 ‘성도’보다 경건함과 신실함이 있는 집단을 가리키므로, English POB의 ‘godly’를 따라 한국어도 ‘경건한 이들’로 옮겨 사회적·종교적 뉘앙스를 살렸습니다.
- source_word: ἔλεος
  english_pob_choice: mercy
  chosen_korean: 자비
  alternatives_korean:
  - 긍휼
  - 은혜
  lexicon: LSJ
  rationale: 두 번 반복되는 ἔλεος를 한국어에서도 동일하게 살려야 하므로, 문맥상 자연스럽고 전통적이면서도 과도하게 신학화되지 않는 ‘자비’를 선택했습니다.
- source_word: Κυρίου
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 야훼
  lexicon: LSJ
  rationale: 이 구절은 시편적 경구로서 Κυρίου가 하나님의 주권적 호칭을 가리키므로, 한국어 합쇼체에서 자연스럽고 예배적 울림이 있는 ‘주님’을 택했습니다.
- source_word: φοβουμένους
  english_pob_choice: those who fear him
  chosen_korean: 그분을 두려워하는 이들
  alternatives_korean:
  - 그분을 경외하는 이들
  - 그분을 무서워하는 이들
  lexicon: LSJ
  rationale: English POB가 ‘fear’의 성경적 긴장을 보존했으므로, 이를 완화한 ‘경외하다’보다 원문의 강한 표현을 살린 ‘두려워하는’으로 옮겼습니다.
theological_decisions:
- issue: ‘fear him’를 한국어에서 ‘경외하다’로 완화할지 여부
  chosen_reading: ‘그분을 두려워하는 이들’로 유지했습니다.
  alternative_readings:
  - ‘그분을 경외하는 이들’
  - ‘그분을 공경하는 이들’
  rationale: 본문은 하나님 앞의 두려움과 경외를 함께 담는 성경적 언어를 유지합니다. 이를 ‘경외’로만 정리하면 긴장이 약해질 수 있어, 원문의 강도를 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
