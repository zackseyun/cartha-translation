translation:
  language: ko
  text: 그러나 죄인들은 멸망으로 끌려갈 것이며, 그들에 대한 기억은 더 이상 발견되지 않을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἁμαρτωλοὶ
  english_pob_choice: sinners
  chosen_korean: 죄인들
  alternatives_korean:
  - 악인들
  - 죄를 지은 자들
  lexicon: BDAG
  rationale: 직역적 의미는 ‘죄인들’이며, 원문이 도덕적 평가어인 ‘악인들’보다 죄로 규정되는 사람들을 직접 가리키므로 이를 따랐습니다.
- source_word: ἀρθήσονται
  english_pob_choice: will be taken away
  chosen_korean: 끌려가고
  alternatives_korean:
  - 데려가질 것이며
  - 치워질 것이며
  - 제거될 것이며
  lexicon: BDAG
  rationale: 미래 수동형의 ‘옮겨져 제거됨’이라는 뜻을 한국어에서 자연스럽게 살리기 위해, 심판 맥락에서의 강한 제거 감각을 담아 ‘끌려가다’로 옮겼습니다.
- source_word: εἰς ἀπώλειαν
  english_pob_choice: to destruction
  chosen_korean: 멸망으로
  alternatives_korean:
  - 파멸로
  - 파괴로
  - 멸망에 이르러
  lexicon: BDAG
  rationale: ἀπώλεια는 단순 소실보다 종말적 파멸을 뜻하므로, 문맥에 맞는 표준어 ‘멸망’으로 처리했습니다.
- source_word: μνημόσυνον
  english_pob_choice: remembrance
  chosen_korean: 기억
  alternatives_korean:
  - 기념
  - 추억
  - 기억나는 흔적
  lexicon: BDAG
  rationale: 시적 병행에서 사람의 존재를 보존하는 ‘기억됨’의 의미를 자연스럽게 전달하기 위해 ‘기억’을 택했습니다.
