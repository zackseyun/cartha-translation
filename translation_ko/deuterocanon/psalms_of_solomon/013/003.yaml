  text: Savage beasts rushed at them; with their teeth they tore at their flesh, and with their molars they crushed their bones; and from all these things the Lord rescued us. rushed at them; with their teeth they tore at their flesh, and with their molars they crushed their bones; and from all these things the Lord rescued us.
translation:
  language: ko
  text: 사나운 짐승들이 그들에게 달려들었습니다. 짐승들은 이빨로 그들의 살을 뜯고, 어금니로 그들의 뼈를 으깼으며, 주님께서는 이 모든 것에서 우리를 건져 주셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θηρία ἐπέδραμοσαν
  english_pob_choice: Savage beasts rushed at them
  chosen_korean: 사나운 짐승들이 그들에게 달려들었습니다
  alternatives_korean:
  - 야생 짐승들이 그들에게 달려들었습니다
  - 흉포한 짐승들이 그들에게 달려들었습니다
  lexicon: θηρίον
  rationale: θηρία는 단순한 동물보다 위협적·야성적인 맥락이 강해, POB의 Savage beasts를 살려 ‘사나운 짐승들’로 옮겼습니다.
- source_word: ἔτιλλον σάρκας αὐτῶν
  english_pob_choice: they tore at their flesh
  chosen_korean: 그들은 이빨로 그들의 살을 찢었고
  alternatives_korean:
  - 그들은 그들의 살을 뜯었고
  - 그들은 그들의 살을 찢어 놓았고
  lexicon: τίλλω
  rationale: POB가 단순 ‘tore their flesh’가 아니라 ‘tore at their flesh’로 긴박한 공격성을 드러내므로, 지속적·폭력적 접촉을 살린 ‘찢었고’로 옮겼습니다.
- source_word: ἐν ταῖς μυλαῖς ἔθλων ὀστᾶ αὐτῶν
  english_pob_choice: with their molars they crushed their bones
  chosen_korean: 어금니로 그들의 뼈를 부쉈으며
  alternatives_korean:
  - 큰 어금니로 그들의 뼈를 으깨며
  - 어금니로 그들의 뼈를 가루 내며
  lexicon: μύλη
  rationale: μύλαι는 ‘갈리는 어금니/맷돌니’라는 이미지지만 한국어 문맥에서는 해부학적 표현인 ‘어금니’가 자연스럽고, POB의 ‘molars’와 대응됩니다.
- source_word: ἐρρύσατο ἡμᾶς Κύριος
  english_pob_choice: the Lord rescued us
  chosen_korean: 주님께서 우리를 구해 주셨습니다
  alternatives_korean:
  - 주님께서 우리를 건져 주셨습니다
  - 주님께서 우리를 구원하셨습니다
  lexicon: ῥύομαι / Κύριος
  rationale: Κύριος는 여기서 야훼를 직접 가리키는 구약적 호칭이므로 ‘주님’으로 옮기되, 구출의 동작은 POB의 rescued를 따라 ‘구해 주셨습니다’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: Κύριος의 표기와 구약적 함의
  chosen_reading: 본문의 Κύριος는 하나님의 구원 행위를 가리키는 호칭으로 ‘주님’으로 번역했습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 이 절은 시편적 문맥에서 하나님의 구원 행위를 회상하므로, 본문에는 한국어 경건 문체에 맞는 ‘주님’을 두고 지나친 표지화를 피했습니다.
  doctrine_reference: 구약 신명칭 번역 원칙
