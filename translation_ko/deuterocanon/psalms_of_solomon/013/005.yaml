lexical_decisions:
- source_word: δεινή
  english_pob_choice: dreadful
  chosen_korean: 두렵습니다
  alternatives_korean:
  - 무섭습니다
  - 끔찍합니다
  - 두려운 일입니다
  lexicon: LSJ
  rationale: 멸망의 성격을 단순한 크기보다 사람을 떨게 하는 위협성으로 살려, 'dreadful'의 강한 정서를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: καταστροφή
  english_pob_choice: destruction
  chosen_korean: 멸망
  alternatives_korean:
  - 파괴
  - 파멸
  - 파산
  lexicon: LSJ
  rationale: 여기서는 단순한 붕괴보다 심판적이고 총체적인 붕괴를 가리키므로, 한국어에서 더 포괄적이고 성경적인 '멸망'을 택했습니다.
- source_word: ἅψεται
  english_pob_choice: will touch
  chosen_korean: 닿지 않을 것입니다
  alternatives_korean:
  - 건드리지 않을 것입니다
  - 미치지 않을 것입니다
  - 접하지 않을 것입니다
  lexicon: LSJ
  rationale: 원문의 접촉 이미지를 보존하면서, 재앙이 의인에게 이르지 않는다는 뜻을 자연스럽게 드러내기 위해 '닿다'를 사용했습니다.
- source_word: οὐδὲν ἐκ πάντων τούτων
  english_pob_choice: none of all these things
  chosen_korean: 이 모든 것 가운데서 아무것도
  alternatives_korean:
  - 이 모든 것 중 아무것도
  - 그 모든 것 가운데 아무것도
  - 그 가운데 어느 것도
  lexicon: LSJ
  rationale: πάντων의 '모든'을 놓치지 않으면서, 한국어에서는 전치사적 표현을 풀어 '가운데서 아무것도'로 옮겨 총체성을 드러냈습니다.
theological_decisions:
- issue: δικαίου의 대표적 단수 표현
  chosen_reading: 의인에게
  alternative_readings:
  - 의로운 사람에게
  - 의로운 자에게
  - 의인에게는
  rationale: 여기서는 특정 개인이 아니라 의인의 범주 전체를 가리키므로, 한국어에서 가장 간결하고 성경적인 대표명사 표현인 '의인'을 유지했습니다.
  doctrine_reference: 의인의 보호와 악인의 심판이라는 시편적 대비
