  source_fidelity: 현 초안의 ‘무지 가운데 있는 일에 대한 것이라도’는 ἐν ἀγνοίᾳ에 없는 ‘일에 대한’과 양보의 ‘-라도’를 보태어 뜻을 과도하게 특정합니다. 원문은 의인의 징계와 죄인의 멸망이 같지 않다는 대비를 말하며, ἐν ἀγνοίᾳ의 정확한 결속 범위는 다소 압축되어 있습니다.
  naturalness: ‘의인이 알지 못하는 가운데 받는 징계’는 현대 표준 한국어에서 자연스럽고, 원문의 압축된 표현을 불필요하게 ‘무지 중에 한 일’로 풀어쓰지 않습니다. 합쇼체 종결도 유지합니다.
  terminology: παιδεία는 문맥의 교정적 성격을 살려 ‘징계’로, καταστροφή는 ‘멸망’으로, ἁμαρτωλός는 ‘죄인’으로 옮기는 것이 적절합니다. 사본 변이 각주의 ‘의인들’은 원문의 단수와 맞지 않으므로 ‘의인’으로 고쳐야 합니다.
