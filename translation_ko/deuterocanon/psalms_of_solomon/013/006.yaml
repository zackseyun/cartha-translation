translation:
  language: ko
  text: 의인의 징계는 무지 가운데 있는 일에 대한 것이라도 죄인의 멸망과 같지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘무지 가운데 있는 의인의 징계’입니다.
    reason: lexical_alternative
  - marker: b
    text: 사본 변이로 ‘의인들’ 대신 ‘죄인들’이라고 읽는 전승이 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: οὐχ ὁμοία
  english_pob_choice: is not like
  chosen_korean: 같지 않습니다
  alternatives_korean:
  - 다르지 않습니다
  - 같지 않습니까
  lexicon: LSJ
  rationale: 비교 대비를 자연스러운 현대 한국어로 옮기되, 두 결과의 성격 차이를 분명히 살리기 위해 ‘같지 않습니다’를 택했습니다.
- source_word: παιδεία
  english_pob_choice: discipline
  chosen_korean: 징계
  alternatives_korean:
  - 훈련
  - 교정
  - 교육
  lexicon: LSJ
  rationale: 여기서는 단순한 교육보다 교정적·징계적 의미가 강하므로, 시련 속의 바로잡음을 드러내는 ‘징계’가 가장 적절합니다.
- source_word: ἐν ἀγνοίᾳ
  english_pob_choice: in ignorance
  chosen_korean: 무지 가운데 있는 일에 대한 것이라도
  alternatives_korean:
  - 무지 가운데서
  - 알지 못한 채 한 일에 대한
  - 부지중에 한 죄에 대한
  lexicon: LSJ
  rationale: 직역의 ‘무지 가운데’만으로는 대상이 분명하지 않아, 영어 POB의 해석을 따르되 과도한 확장은 피하면서 ‘무지 가운데 있는 일’로 분명하게 했습니다.
- source_word: τοῦ ἁμαρτωλοῦ
  english_pob_choice: of the sinner
  chosen_korean: 죄인의
  alternatives_korean:
  - 악인의
  - 죄지은 자의
  lexicon: LSJ
  rationale: 대표적 단수 명사로서의 대조를 살려 ‘죄인’으로 옮겼습니다. 문맥상 보편적 범주의 사람을 가리키므로 자연스럽습니다.
theological_decisions:
- issue: 의인의 징계와 죄인의 멸망의 대비
  chosen_reading: 의인의 경험은 파괴적 심판이 아니라 교정적 징계이며, 죄인의 결말은 멸망이라는 대비를 분명히 드러냈습니다.
  alternative_readings:
  - 보다 직역적으로 ‘무지 가운데 있는 의인의 징계’라고만 둘 수 있습니다.
  rationale: 문맥상 바로 뒤의 대비를 고려하면, 두 결과의 성격 차이를 한국어에서도 분명히 보여 주는 편이 본문의 의도를 더 잘 전달합니다.
  doctrine_reference: Preserve theological tension rather than smooth it away.
