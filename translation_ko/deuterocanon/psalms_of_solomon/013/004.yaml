  yaml_path: translation/deuterocanon/psalms_of_solomon/013/004.yaml
  text: The ungodly was troubled because of his transgressions[b][a], lest he be taken away with sinners.
  footnotes:
  - marker: a
    text: 'Or, ''not when he is taken away with sinners.'' The Greek clause μὴ ὅτε συμπαραληφθῇ is syntactically difficult; the main text takes it in a preventive sense: ''lest he be taken away.'''
    reason: alternative_reading
  - marker: b
    text: '''Taken away'' could also be rendered ''swept away'' or ''taken along together,'' highlighting shared judgment with sinners.'
    reason: lexical_alternative
translation:
  language: ko
  text: 불경한 자는 자기의 허물들 때문에 동요했습니다. 그가 죄인들과 함께 데려가질까 하여서입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그가 죄인들과 함께 데려가질까 하여서입니다’는 μὴ ὅτε συμπαραληφθῇ를 예방적 의미로 이해하여 옮긴 것입니다. 이 압축된 그리스어 절은 ‘그가 죄인들과 함께 데려가질 때가 아니라면’ 또는 ‘그가 죄인들과 함께 데려가질까’로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘불경한 자’는 ἀσεβής의 기본 뜻을 살린 말입니다. 이 말은 단순히 도덕적으로 악한 사람뿐 아니라 하나님을 향한 경건이 없는 사람을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐταράχθη
  english_pob_choice: was troubled
  chosen_korean: 불안해졌습니다
  alternatives_korean:
  - 괴로워했습니다
  - 동요했습니다
  - 불안했습니다
  lexicon: BDAG
  rationale: passive 형태의 내적 동요를 한국어로 자연스럽게 옮기되, 단순 감정보다 위기 앞의 불안과 흔들림을 함께 드러내기 위해 ‘불안해졌습니다’를 택했습니다.
- source_word: ὁ ἀσεβής
  english_pob_choice: the ungodly
  chosen_korean: 불경한 자
  alternatives_korean:
  - 경건하지 않은 자
  - 악인
  - 불의한 자
  lexicon: BDAG
  rationale: ἀσεβής의 핵심은 단순한 도덕적 악함보다 하나님을 향한 경건 없음이므로, 그 종교·윤리적 뉘앙스를 살려 ‘불경한 자’로 옮겼습니다.
- source_word: διὰ παραπτώματα αὐτοῦ
  english_pob_choice: because of his transgressions
  chosen_korean: 자기의 범죄들 때문에
  alternatives_korean:
  - 자기의 허물들 때문에
  - 자기의 죄과들 때문에
  - 자기의 잘못들 때문에
  lexicon: BDAG
  rationale: διά + 대격의 인과관계를 ‘때문에’로 풀고, παραπτώματα의 실제적 위반성을 드러내기 위해 ‘범죄들’로 번역했습니다.
- source_word: μὴ ὅτε συμπαραληφθῇ μετὰ τῶν ἁμαρτωλῶν
  english_pob_choice: lest he be taken away with sinners
  chosen_korean: 그가 죄인들과 함께 붙잡혀 갈까 두려워서입니다
  alternatives_korean:
  - 그가 죄인들과 함께 데려가질까 두려워서입니다
  - 죄인들과 함께 휩쓸려 갈까 두려워서입니다
  - 죄인들과 함께 함께 끌려갈까 두려워서입니다
  lexicon: BDAG
  rationale: 문장이 압축되어 있어 예방적 의미의 ‘lest’를 한국어 이유절로 풀었고, συμπαραληφθῇ의 ‘함께 붙잡혀/데려가짐’의 공동 심판 뉘앙스를 살리기 위해 ‘붙잡혀 갈’로 옮겼습니다.
theological_decisions:
- issue: 공동 심판의 뉘앙스
  chosen_reading: ‘죄인들과 함께 붙잡혀 갈까’로 옮겨, 단순한 이동이 아니라 죄인들과 함께 동일한 심판에 포함되는 뜻을 드러냈습니다.
  alternative_readings:
  - ‘죄인들과 함께 휩쓸려 갈까’
  - ‘죄인들과 함께 데려가질까’
  rationale: ἁμαρτωλοί와 συμπαραληφθῇ의 결합은 함께 묶여 판정받는 상황을 시사하므로, 공동 심판성을 흐리지 않는 표현을 선택했습니다.
  doctrine_reference: 시편지혜문학/심판 이미지
