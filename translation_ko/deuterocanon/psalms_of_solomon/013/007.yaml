lexical_decisions:
- source_word: ἐν περιστολῇ
  english_pob_choice: in secret
  chosen_korean: 은밀히
  alternatives_korean:
  - 비밀리에
  - 숨은 가운데
  - 절제 속에서
  lexicon: LSJ / 주석된 POB 개정
  rationale: pob 영어 본문은 최신 판정에 따라 περιστολή를 ‘in secret’으로 읽고 있으므로, 징계의 방식이 ‘보이지 않게/숨은 상태에서’ 이루어진다는 의미를 한국어 부사로 간결하게 살렸습니다.
- source_word: παιδεύεται
  english_pob_choice: is disciplined
  chosen_korean: 징계받으니
  alternatives_korean:
  - 훈련받으니
  - 교정받으니
  - 가르침을 받으니
  lexicon: BDAG
  rationale: 문맥이 교육보다 교정적 처분에 가깝기 때문에 ‘징계받다’가 가장 직접적으로 맞습니다.
- source_word: δίκαιος
  english_pob_choice: a righteous man
  chosen_korean: 의인
  alternatives_korean:
  - 의로운 사람
  - 한 의인
  - 그 의인
  lexicon: BDAG
  rationale: 그리스어의 대표적 단수는 한국어에서 자연스럽고 압축적인 ‘의인’으로 옮기되, 일반 명제로 읽히도록 했습니다.
- source_word: ἐπιχαρῇ
  english_pob_choice: may gloat over
  chosen_korean: 기뻐하지 못하게 하려는 것입니다
  alternatives_korean:
  - 희희낙락하지 못하게 하려는 것입니다
  - 우쭐해하지 못하게 하려는 것입니다
  - 그 의인을 두고 기뻐하지 못하게 하려는 것입니다
  lexicon: LSJ
  rationale: POB 영어의 핵심은 단순한 기쁨이 아니라 남의 불행을 보고 우쭐해하는 뉘앙스이며, 한국어에서는 이를 자연스럽게 풀어 ‘기뻐하지 못하게’로 번역했습니다.
theological_decisions:
- issue: ‘은밀히’와 ‘징계’의 결합이 주는 의미
  chosen_reading: 하나님은 의인의 징계를 공개적 수치가 아니라 숨은 방식으로 두어, 죄인의 조롱이 의인에게 미치지 않게 하십니다.
  alternative_readings:
  - 단순히 절제된 징계로 이해함
  - 징계의 강도를 낮추는 표현으로 이해함
  rationale: 본문의 목적절(‘죄인이 … 하지 못하게 하려는’)이 드러내는 것은 징계의 ‘비밀성’이며, 이것을 부드러운 완곡어로 약화시키지 않는 것이 문맥에 더 충실합니다.
  doctrine_reference: 문맥 우선 해석; 징계와 보호의 목적
