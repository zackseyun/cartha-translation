  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: lxx-swete-1909
  text: ὅτι φείσεται Κύριος τῶν ὁσίων αὐτοῦ, καὶ τὰ παραπτώματα αὐτῶν ἐξαλείψει ἐν παιδείᾳ. ἡ γὰρ ζωὴ τῶν δικαίων εἰς τὸν αἰῶνα·
  language: Greek
  pages:
  - 803
  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/013/009.yaml
  text: For the Lord will spare his faithful ones[a], and he will wipe away their trespasses by discipline[c][b]; for the life of the righteous is forever.
  footnotes:
  - marker: a
    text: Or 'godly ones' or 'faithful ones.'
    reason: lexical_alternative
  - marker: b
    text: Or 'will blot out their trespasses through discipline' or 'with chastening.'
    reason: lexical_alternative
  - marker: c
    text: Or 'his holy ones'.
    reason: previous_rendering
translation:
  language: ko
  text: 주님은 그의 신실한 이들을[a] 아끼시며, 훈육으로[c] 그들의 허물을[b] 지워 버리실 것이니, 의인들의 생명은 영원합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경건한 이들’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘범과’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘징계로’, ‘교정으로’.
    reason: alternative_reading
lexical_decisions:
- source_word: Κύριος
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  lexicon: κύριος
  rationale: 여기서는 하나님을 가리키는 호칭이므로, 한국어 합쇼체에서 자연스럽고 경외를 살리는 ‘주님’으로 옮겼습니다.
- source_word: ὁσίων
  english_pob_choice: his faithful ones
  chosen_korean: 그의 신실한 이들
  alternatives_korean:
  - 그의 거룩한 이들
  - 그의 경건한 이들
  - 그의 성도들
  lexicon: ὅσιος
  rationale: 이 단어는 이 책의 용례상 단순한 ‘거룩한 자들’보다 언약에 충실한 ‘신실한 이들’의 뉘앙스가 강하므로 그 의미를 살렸습니다.
- source_word: παραπτώματα
  english_pob_choice: trespasses
  chosen_korean: 허물
  alternatives_korean:
  - 범죄
  - 죄과
  - 잘못
  lexicon: παράπτωμα
  rationale: 도덕적 일탈과 범과의 의미를 한국어 성경에서 널리 쓰는 ‘허물’로 간결하게 전달했습니다.
- source_word: ἐξαλείψει
  english_pob_choice: will wipe away
  chosen_korean: 지워 버리실
  alternatives_korean:
  - 지우실
  - 말소하실
  - 닦아 없애실
  lexicon: ἐξαλείφω
  rationale: 완전히 제거한다는 이미지를 유지하되, 현대 한국어에서 자연스러운 표현으로 ‘지워 버리실’로 옮겼습니다.
- source_word: ἐν παιδείᾳ
  english_pob_choice: by discipline
  chosen_korean: 훈계로
  alternatives_korean:
  - 훈련으로
  - 징계로
  - 교정으로
  lexicon: παιδεία
  rationale: 이 표현은 단순한 처벌보다 교정과 훈육의 수단을 가리키므로, 문맥상 가장 간결한 ‘훈계로’를 선택했습니다.
- source_word: δικαίων
  english_pob_choice: the righteous
  chosen_korean: 의인
  alternatives_korean:
  - 의로운 자
  - 의로운 이들
  lexicon: δίκαιος
  rationale: 의인과 의의 표준적 성경 용례를 따르되, 문장의 종결을 자연스럽게 하기 위해 단수형 집합명사처럼 ‘의인’으로 옮겼습니다.
theological_decisions:
- issue: 공의와 징계의 관계
  chosen_reading: 주님이 신실한 이들을 아끼시는 방식은 허물을 완전히 제거하되 훈계라는 교정적 수단을 통해 이루어집니다.
  alternative_readings:
  - 아끼심과 허물의 삭제를 서로 다른 두 행위로 분리해 읽을 수 있습니다.
  - 훈계를 주로 형벌적 징계로 이해할 수도 있습니다.
  rationale: 원문은 긍휼과 훈계가 서로 맞물려 있습니다. 이를 분리하지 않고, 자비가 도덕적 교정을 통해 나타난다는 긴장을 유지했습니다.
  doctrine_reference: 징계와 성화, 하나님의 자비와 거룩의 결합
