revisions:
- from: 주님은 그의 신실한 이들을[a] 아끼시고, 그들의 허물을[b] 훈계로[c] 지워 버리실 것이니, 의인의 생명은 영원합니다.
  to: 주님은 그의 신실한 이들을[a] 아끼시며, 훈육으로[c] 그들의 허물을[b] 지워 버리실 것이니, 의인들의 생명은 영원합니다.
  rationale: 원문의 복수형 δικαίων을 ‘의인들의’로 반영하고, παιδεία의 교정적 훈련 의미를 ‘훈육’으로 더 넓게 보존했습니다. 각주 b는 구조와 문체를 정리했으며, 의미나 신학적 해석을 추가하지 않았습니다.
