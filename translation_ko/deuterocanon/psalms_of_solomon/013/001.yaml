  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/013/001.yaml
  text: The right hand of the Lord sheltered me[b][a]; the right hand of the Lord spared us.
  footnotes:
  - marker: a
    text: Or 'covered me' for 'sheltered me.'
    reason: lexical_alternative
  - marker: b
    text: Or 'had mercy on us' for 'spared us.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님의 오른손이 저를 덮어 주셨고, 주님의 오른손이 우리를 아끼셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘덮으셨다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘불쌍히 여기셨다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεξιὰ
  english_pob_choice: right hand
  chosen_korean: 오른손
  alternatives_korean:
  - 오른쪽 손
  - 오른편
  lexicon: LSJ
  rationale: 서술된 보호와 능력의 상징을 한국어 성경 문맥에서 자연스럽게 드러내는 표현은 ‘오른손’입니다.
- source_word: ἐσκέπασέν
  english_pob_choice: sheltered
  chosen_korean: 덮어 주셨고
  alternatives_korean:
  - 보호하셨고
  - 가려 주셨고
  - 덮으셨고
  lexicon: LSJ
  rationale: 기본 의미인 ‘덮다/가리다’와 보호의 뉘앙스를 함께 살리되, 한국어에서는 ‘덮어 주다’가 가장 자연스럽게 보호의 함의를 전달합니다.
- source_word: ἐφείσατο
  english_pob_choice: spared
  chosen_korean: 아끼셨습니다
  alternatives_korean:
  - 살려 두셨습니다
  - 용서하셨습니다
  - 불쌍히 여기셨습니다
  lexicon: LSJ
  rationale: 단순한 감정 표현이 아니라 해치지 않고 보존하신 뜻을 살리기 위해, ‘아끼다’의 절제·유보 의미를 채택했습니다.
- source_word: Κυρίου
  english_pob_choice: of the Lord
  chosen_korean: 주님의
  alternatives_korean:
  - 주의
  - 주께서의
  lexicon: LSJ
  rationale: κύριος는 이 프로젝트의 기본값에 따라 ‘주님’으로 옮기며, 소유격은 한국어의 자연스러운 속격 ‘-님의’로 처리했습니다.
theological_decisions:
- issue: 첫 절과 후반 절의 주어-목적어 관계를 한국어로 유지하는 방식
  chosen_reading: 두 절 모두 동일하게 ‘주님의 오른손’이 주체가 되어 보호와 유보의 행위를 하도록 직역적 대칭을 유지했습니다.
  alternative_readings:
  - ‘주님의 오른손이 저를 지키셨고…’로 의미를 완화하는 방식
  - ‘주님의 오른손이 우리를 불쌍히 여기셨습니다’로 정서 중심으로 옮기는 방식
  rationale: 본문은 동일한 신적 행위자를 반복해 강조하므로, 한국어에서도 반복을 유지해 보호와 절제의 병행을 보존하는 것이 좋습니다.
  doctrine_reference: 시편적 병행법과 신적 보호의 표현
