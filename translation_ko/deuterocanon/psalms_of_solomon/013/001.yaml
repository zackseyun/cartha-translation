  source_fidelity: 첫 동사 ἐσκέπασεν은 ‘덮다/가리다’의 보호적 용법으로, ‘덮어 주셨고’도 가능하나 수혜를 덧붙입니다. δεύτε 동사 ἐφείσατο는 ‘아끼다’가 현대 한국어에서 애정·소중히 여김으로도 넓게 이해될 수 있어, ‘살려 두셨습니다’가 ‘해치거나 멸하지 않고 남겨 두다’라는 핵심을 더 분명히 드러냅니다. 두 목적어의 단수 ‘저’와 복수 ‘우리’ 및 반복된 주어는 유지해야 합니다.
  naturalness: ‘주님의 오른손’의 반복은 원문의 병행을 자연스럽게 보존합니다. ‘저를 덮으셨고’는 시적·성경적 문맥에서 무리 없이 이해되며, 합쇼체 종결도 일관됩니다. 각주 표지는 해당 낱말 바로 뒤에 두는 편이 독자에게 명확합니다.
  terminology: κύριος의 ‘주님’, δεξιά의 ‘오른손’은 적절합니다. ἐφείσατο에는 ‘불쌍히 여기셨다’만으로는 감정적 자비가 앞서므로, ‘용서하셨다’ 또는 ‘해치지 않으셨다’ 같은 대안을 병기하는 것이 더 중립적입니다.
