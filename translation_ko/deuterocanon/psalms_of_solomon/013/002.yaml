translation:
  language: ko
  text: 주님의 팔이 우리를 칼의 지나감을[a]에서, 기근과 죄인들의 죽음에서 구하셨습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지나가는 칼’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘죄인들을 위한 죽음’이나 ‘죄인들로 말미암은 죽음’일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: βραχίων
  english_pob_choice: arm
  chosen_korean: 팔
  alternatives_korean:
  - 팔뚝
  - 능력
  - 권능
  lexicon: LSJ
  rationale: 신체 이미지인 βραχίων을 추상화하지 않고 한국어 성경에서 자연스러운 ‘팔’로 옮겨, 주님의 구원 능력이 구체적 상으로 드러나게 했습니다.
- source_word: Κυρίου
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 야훼
  - 주인
  lexicon: LSJ
  rationale: 여기서는 κύριος가 신적 호칭으로 쓰이므로, 한국어 합쇼체 문맥에 맞는 ‘주님’으로 옮겼습니다.
- source_word: διαπορευομένης
  english_pob_choice: passing through
  chosen_korean: 지나감
  alternatives_korean:
  - 지나가는
  - 통과하는
  - 휩쓸고 지나가는
  lexicon: LSJ
  rationale: 분사는 재앙이 ‘지나가는’ 상태를 가리키므로, 지나가는 동작을 명사화한 ‘지나감’으로 압축해 원문의 직접성을 살렸습니다.
- source_word: ἁμαρτωλῶν
  english_pob_choice: of sinners
  chosen_korean: 죄인들의
  alternatives_korean:
  - 죄인들을 위한
  - 죄인들로 인한
  - 죄인들의 것으로
  lexicon: LSJ
  rationale: 속격의 기본 형태를 그대로 살려 ‘죄인들의’로 옮겼고, 관계를 과도하게 해석하지 않았습니다.
theological_decisions:
- issue: θανάτου ἁμαρτωλῶν의 속격 관계
  chosen_reading: ‘죄인들의 죽음’으로 직역해 관계를 열어 둡니다.
  alternative_readings:
  - 죄인들을 위한 죽음
  - 죄인들로 말미암은 죽음
  rationale: 그리스어는 이 관계를 명확히 규정하지 않으므로, 본문은 해석을 확정하지 않고 긴장을 유지해야 합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
