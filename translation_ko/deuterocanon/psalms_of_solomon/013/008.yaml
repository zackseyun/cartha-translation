  source_fidelity: νουθετήσει를 ‘훈계하실 것이다’로, δίκαιον을 단수의 ‘의로운 사람’으로 옮긴 것은 적절합니다. υἱὸν ἀγαπήσεως의 ‘사랑받는 아들’도 자연스럽고 충실합니다. 다만 ‘맏아들의 것’은 한국어에서 무엇을 뜻하는지 불분명하므로, 생략된 παιδεία를 보완하여 비교의 대상을 분명히 하는 편이 좋습니다. αὐτοῦ의 선행사는 문맥상 주어를 가리킬 가능성이 크지만 문법적으로는 다소 여지가 있으므로 ‘그의’로 유지합니다.
