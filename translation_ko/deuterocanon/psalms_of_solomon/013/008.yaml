translation:
  language: ko
  text: 그가 의로운 사람을[c] 사랑받는 아들처럼[a] 훈계하실 것이며, 그의 훈육[b]은 맏아들에게 베푸는 훈육과 같습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사랑의 아들처럼’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 가르침’ 또는 ‘그의 훈련’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘의인을’.
    reason: previous_rendering
lexical_decisions:
- source_word: νουθετήσει
  english_pob_choice: will admonish
  chosen_korean: 훈계하실 것이며
  alternatives_korean:
  - 권면하실 것이며
  - 경고하실 것이며
  - 교정하실 것이며
  lexicon: BDAG
  rationale: νουθετέω는 단순 정보 전달이 아니라 바르게 하도록 타이르는 의미를 가지므로, 문맥의 아버지적 징계와 어울리는 ‘훈계하다’로 옮겼습니다.
- source_word: δίκαιον
  english_pob_choice: a righteous man
  chosen_korean: 의로운 사람을
  alternatives_korean:
  - 의로운 이를
  - 의인 한 사람을
  - 의로운 자를
  lexicon: BDAG
  rationale: 그리스어 단수·무관사 형식을 살려, 보편 집합명사보다 한 사람을 가리키는 한국어 표현으로 옮겼습니다.
- source_word: υἱὸν ἀγαπήσεως
  english_pob_choice: a beloved son
  chosen_korean: 사랑받는 아들처럼
  alternatives_korean:
  - 사랑의 아들처럼
  - 사랑스러운 아들처럼
  - 사랑하는 아들처럼
  lexicon: BDAG
  rationale: ἀγάπη-계열의 소유격은 자연스럽게 ‘사랑받는’의 수동적 의미를 띠므로, 관계의 친밀함과 선호를 분명히 드러내는 표현을 택했습니다.
- source_word: παιδεία
  english_pob_choice: discipline
  chosen_korean: 훈육
  alternatives_korean:
  - 징계
  - 교육
  - 교훈
  lexicon: BDAG
  rationale: παιδεία는 단순 처벌보다 아들을 길들이고 형성하는 교육적 훈련을 포함하므로, ‘훈육’이 본문의 아버지적 형성 의미를 가장 잘 살립니다.
- source_word: πρωτοτόκου
  english_pob_choice: firstborn
  chosen_korean: 맏아들의 것
  alternatives_korean:
  - 장자의 것
  - 첫째 아들의 것
  - 맏아들처럼
  lexicon: BDAG
  rationale: 형용사적 명사를 한국어에서 자연스럽게 받기 위해 ‘맏아들의 것’으로 풀어, 특권적 지위와 비교 구조를 유지했습니다.
theological_decisions:
- issue: 의로운 사람에 대한 하나님의 훈계와 훈육의 성격
  chosen_reading: 본문은 하나님이 의인을 사랑하는 아들로 대하듯 훈계하고, 장자의 지위에 준하는 훈육을 하신다는 뜻으로 읽었습니다.
  alternative_readings:
  - 의로운 자에 대한 단순한 도덕적 경고
  - 법정적 심판만을 가리키는 읽기
  rationale: νουθετήσει와 παιδεία의 병행은 단순 경고가 아니라 관계적·형성적 징계를 가리키므로, 아버지가 아들을 기르는 이미지를 보존했습니다.
  doctrine_reference: 하나님의 아버지 되심과 징계의 교훈적 성격
- issue: ἀγαπήσεως의 관계 표현
  chosen_reading: ‘사랑받는’으로 옮겨, 아들이 사랑의 대상이자 특별한 호의의 대상임을 드러냈습니다.
  alternative_readings:
  - ‘사랑의 아들’
  - ‘사랑하는 아들’
  rationale: 소유격 구조를 한국어에서 자연스럽게 살리면서, 사랑의 근원이 아들 자신이 아니라 아버지의 애정임을 분명히 했습니다.
  doctrine_reference: 하나님의 선하신 애정과 선택
