  yaml_path: translation/deuterocanon/psalms_of_solomon/003/011.yaml
  text: A sinner stumbled[a], and he curses his life, the day of his birth and his mother’s labor pains.
  footnotes:
  - marker: a
    text: Or 'came to ruin' for 'stumbled.' The Greek verb can suggest either literal stumbling or a figurative fall into disaster.
    reason: lexical_alternative
translation:
  language: ko
  text: 죄인이 넘어졌습니다[a]. 그는 자기 생명과 자기의 탄생일, 그리고 어머니의 해산의 고통을 저주합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘파멸했습니다’로도 옮길 수 있습니다. 이 동사는 문자적 ‘걸려 넘어짐’과 비유적 ‘재난에 빠짐’을 모두 시사할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέκοψεν
  english_pob_choice: stumbled
  chosen_korean: 넘어졌습니다
  alternatives_korean:
  - 비틀렸습니다
  - 걸려 넘어졌습니다
  - 파멸했습니다
  lexicon: BDAG
  rationale: προσκόπτω는 문자적으로 ‘걸려 넘어지다’와 ‘부딪치다’의 뜻을 가지며, 문맥상 단순한 물리적 넘어짐보다 재앙적 몰락까지 넓게 읽힐 수 있습니다. 한국어에서는 비유적 함의를 살리되 과도하게 확장하지 않는 ‘넘어졌습니다’가 가장 자연스럽습니다.
- source_word: ἁμαρτωλός
  english_pob_choice: sinner
  chosen_korean: 죄인
  alternatives_korean:
  - 죄인된 사람
  - 죄 많은 사람
  - 악인
  lexicon: BDAG
  rationale: 명사 ἁμαρτωλός는 직접적으로 ‘죄인’을 뜻하므로, 한국어에서도 일반적이고 가장 직설적인 대응인 ‘죄인’이 적절합니다.
- source_word: καταρᾶται
  english_pob_choice: curses
  chosen_korean: 저주합니다
  alternatives_korean:
  - 저주를 퍼붓습니다
  - 저주를 내립니다
  - 저주합니다
  lexicon: BDAG
  rationale: 동사는 단순히 ‘저주하다’의 강한 행위를 나타내므로, 불필요한 설명 없이 ‘저주합니다’로 옮겨 원문의 힘을 보존했습니다.
- source_word: ὠδῖνας μητρός
  english_pob_choice: his mother’s labor pains
  chosen_korean: 어머니의 해산의 고통
  alternatives_korean:
  - 어머니의 산통
  - 어머니의 진통
  - 어머니의 출산 고통
  lexicon: BDAG
  rationale: ὠδῖνες는 ‘진통/산고’ 계열의 출산 고통을 가리키며, ‘해산의 고통’은 문어적이면서도 원문의 출산 이미지와 비장한 어조를 잘 살립니다.
theological_decisions:
- issue: 저주의 대상과 배열
  chosen_reading: 죄인은 자기 생명, 탄생일, 어머니의 해산의 고통까지 저주하는 것으로 옮겼습니다.
  alternative_readings:
  - 자기 생명과 탄생일, 어머니의 해산의 고통을 함께 저주한다
  - 자기 생명과 태어난 날, 그리고 어머니의 진통을 저주한다
  rationale: 헬라어는 목적어들을 병렬로 나열하여 삶 전체와 출생 자체를 거부하는 극단적 정서를 드러냅니다. 한국어도 이를 분리해 주어 죄인의 자기부정이 강하게 드러나도록 했습니다.
  doctrine_reference: 본문의 시적·지혜문학적 진술로서, 인간의 죄가 존재 전체와 출생까지 저주하게 만드는 비극을 강조합니다.
