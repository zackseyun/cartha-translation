  yaml_path: translation/deuterocanon/psalms_of_solomon/003/008.yaml
  text: The righteous continually watches over his house[b][a], to remove wrongdoing in his transgression.
  footnotes:
  - marker: a
    text: Or “in his trespass” or “because of his trespass.”
    reason: lexical_alternative
  - marker: b
    text: The verse presents the righteous man as actively examining his own household and dealing with sin, not as morally careless.
    reason: cross_reference
translation:
  language: ko
  text: 의인은 자기 집안을 늘 살피며, 자기의 허물과 관련하여 악을 없애려고 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “자기의 허물 안에서”입니다. 또는 “자기의 허물 가운데서” 또는 “자기의 허물 때문에”로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 구절은 의인을 도덕적으로 무심한 사람이 아니라, 자기 집안과 자기의 죄를 적극적으로 살피는 사람으로 제시합니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισκέπτεται
  english_pob_choice: continually watches over / inspects
  chosen_korean: 늘 살펴서
  alternatives_korean:
  - 계속 감독해서
  - 끊임없이 점검해서
  - 항상 돌보아
  lexicon: LSJ
  rationale: 가정에 대한 단순한 ‘방문’이 아니라 능동적 감시·점검의 뜻이므로, 자연스러운 합쇼체로 ‘늘 살펴서’가 가장 잘 맞습니다.
- source_word: διὰ παντός
  english_pob_choice: continually
  chosen_korean: 늘
  alternatives_korean:
  - 항상
  - 끊임없이
  - 계속
  lexicon: LSJ
  rationale: 행위의 지속성과 습관성을 간결하게 살리기 위해 ‘늘’을 택했습니다.
- source_word: τοῦ ἐξᾶραι ἀδικίαν
  english_pob_choice: to remove wrongdoing
  chosen_korean: 악을 제거합니다
  alternatives_korean:
  - 잘못을 없앱니다
  - 불의를 없앱니다
  - 악을 없앱니다
  lexicon: LSJ
  rationale: 가정과 자기 성찰의 문맥에서 ἀδικίαν은 사회정의보다 도덕적 악행을 가리키므로, 직관적인 ‘악을 제거합니다’가 가장 적절합니다.
- source_word: ἐν παραπτώματι αὐτοῦ
  english_pob_choice: in his transgression
  chosen_korean: 자기의 허물 속에서
  alternatives_korean:
  - 자기의 허물 가운데
  - 자기의 허물 때문에
  - 자기가 허물에 빠졌을 때
  lexicon: LSJ
  rationale: 소유격이 의인 자신을 가리킬 가능성을 살리면서도, 한국어에서 자연스럽게 상황의 안팎을 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 의인이 자기의 허물을 전제하는지 여부
  chosen_reading: 의인이 자기 집을 살피다가 자기의 허물 속에서 악을 제거하는 모습으로 옮겼습니다.
  alternative_readings:
  - 의인은 죄와 무관한 완전한 사람으로만 읽는 해석
  - 허물의 주체를 다른 사람으로 돌리는 해석
  rationale: 문맥상 ἐν παραπτώματι αὐτοῦ는 의인 자신의 허물을 가장 자연스럽게 가리키므로, 죄책과 회개의 긴장을 지우지 않도록 유지했습니다.
  doctrine_reference: 회개와 의인의 도덕적 긴장 보존
