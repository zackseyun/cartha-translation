review_pass:
  verdict: revise
  source_fidelity: 초안은 ἐπισκέπτεται와 διὰ παντός를 ‘늘 살펴서’로 대체로 충실하게 옮기고, 목적을 나타내는 τοῦ ἐξᾶραι도 보존합니다. 그러나 ‘자기의 허물 속에서 악을 제거합니다’는 ἐν παραπτώματι αὐτοῦ를 한국어에서 부자연스럽고 뜻이 불명확하게 만들며, ‘집’은 여기서 가리키는 집안/가정을 충분히 드러내지 못합니다.
  naturalness: ‘자기 집안을 늘 살피며’는 현대 표준어 합쇼체에서 능동적 감독·점검의 의미를 자연스럽게 전달합니다. ‘자기의 허물과 관련하여’는 전치사 ἐν의 정확한 관계가 논쟁적이라는 점을 과도하게 확정하지 않으면서 한국어 문장으로도 자연스럽습니다.
  terminology: ὁ δίκαιος는 ‘의인’, ἀδικία는 이 문맥에서 ‘악’으로 유지할 수 있습니다. οἶκος는 물리적 건물보다 자신의 가정 또는 집안을 가리키므로 ‘집안’이 더 적절합니다. 주석은 ἐν παραπτώματι αὐτοῦ의 가능한 ‘가운데서/때문에’ 의미를 명시해야 합니다.
  issues:
  - severity: medium
    issue: ‘자기의 허물 속에서’가 한국어로 어색하고 구문의 관계를 불명료하게 합니다.
    rationale: ἐν παραπτώματι αὐτοῦ는 문자적으로는 ‘그의 허물 안에서’이지만, 문맥상 ‘그의 허물과 관련하여’, ‘그의 허물 가운데서’, 또는 ‘그의 허물 때문에’로 이해될 수 있습니다. ‘허물 속에서 악을 제거하다’는 한국어에서 자연스럽지 않습니다.
