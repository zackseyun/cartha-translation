  to: 의인은 자기 집안을 늘 살피며, 자기의 허물과 관련하여 악을 없애려고 합니다.[a][b]
  rationale: 본문을 ‘자기의 허물과 관련하여’로 고쳐 ἐν παραπτώματι αὐτοῦ의 관계를 한국어에서 자연스럽게 표현하되, 이를 시간적·인과적으로 단정하지 않았습니다. ‘집안’은 οἶκος의 household 의미를 반영합니다. 주석은 본문이 보존한 전치사구의 해석 범위를 밝혀, 의인 자신의 허물이라는 긴장과 구문상의 모호성을 함께 유지합니다.
