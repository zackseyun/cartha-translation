  terminology: ‘의인’, ‘주님’, ‘하나님’, ‘의로우시다’는 문맥과 한국어 성서 번역 관습에 잘 맞습니다. ‘주님을 의롭다고 선언하다’보다 ‘주님께서 의로우시다고 선언하다’가 하나님께 의로움을 부여한다는 오해를 더 자연스럽게 피합니다.
