  text: 의인은 주의를 기울이고 주님께서 의로우시다고 선언할 것입니다. 그는 넘어지고, 하나님께서 그에게 무엇을 하실지 지켜봅니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
