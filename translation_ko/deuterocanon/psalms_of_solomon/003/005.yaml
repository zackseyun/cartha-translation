- source_word: δικαιώσει τὸν κύριον
  english_pob_choice: will vindicate the Lord
  chosen_korean: 주님을 의롭다고 선언합니다
  alternatives_korean:
  - 주님을 옳다고 합니다
  - 주님을 변호합니다
