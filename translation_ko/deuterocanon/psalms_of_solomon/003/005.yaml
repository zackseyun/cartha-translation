translation:
  language: ko
  text: 의인은 주님을 의롭다고 선언하며 주의를 기울입니다. 그는 넘어졌고, 하나님께서 그에게 무엇을 하실지 지켜봅니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “주님을 의롭다고 할 것입니다.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “그에게(혹은 그를 향해) 하나님께서 무엇을 하실지.”
    reason: alternative_reading
lexical_decisions:
- source_word: προσέχων
  english_pob_choice: is attentive
  chosen_korean: 주의를 기울입니다
  alternatives_korean:
  - 주의 깊게 살핍니다
  - 유의합니다
  - 귀를 기울입니다
  lexicon: BDAG
  rationale: 현재진행적 상태와 경계하는 자세를 함께 살리면서, 현대 한국어에서 자연스러운 표현으로 옮겼습니다.
- source_word: ὁ δίκαιος
  english_pob_choice: the righteous man
  chosen_korean: 의인
  alternatives_korean:
  - 의로운 사람
  - 의로운 자
  lexicon: BDAG
  rationale: 단수 실질형용사의 대표적 인물을 한국어에서 간결하게 드러내는 표준적 번역으로 처리했습니다.
- source_word: δικαιώσει τὸν κύριον
  english_pob_choice: will vindicate the Lord
  chosen_korean: 주님을 의롭다고 선언합니다
  alternatives_korean:
  - 주님을 옳다고 합니다
  - 주님을 변호합니다
  - 주님을 의롭게 합니다
  lexicon: BDAG
  rationale: 여기서는 하나님을 ‘의롭게 만드는’ 뜻이 아니라, 그분이 옳으심을 인정하고 선언하는 의미이므로 한국어로는 ‘의롭다고 선언하다’가 가장 직접적입니다.
- source_word: ἔπεσεν
  english_pob_choice: he falls
  chosen_korean: 그는 넘어졌고
  alternatives_korean:
  - 그는 떨어졌고
  - 그는 넘어집니다
  lexicon: BDAG
  rationale: 본문의 관습적 현재적 진술을 살리되, 한국어에서는 이미 일어난 상태를 묘사하는 과거형 연결이 더 자연스러워 문맥상 결과를 드러내는 방식으로 옮겼습니다.
- source_word: τί ποιήσει αὐτῷ ὁ θεός
  english_pob_choice: what God will do for him
  chosen_korean: 하나님께서 그에게 무엇을 하실지
  alternatives_korean:
  - 하나님께서 그에게 무엇을 해 주실지
  - 하나님께서 그에게 무엇을 하실지
  - 하나님께서 그에게 무엇을 행하실지
  lexicon: BDAG
  rationale: dative αὐτῷ의 유익적 가능성을 본문 문맥에 따라 살리면서도, ‘to/for him’의 긴장을 너무 빨리 단정하지 않도록 중립적으로 옮겼습니다.
theological_decisions:
- issue: δικαιώσει τὸν κύριον의 신학적 방향성
  chosen_reading: 의인은 주님을 옳으심/의로우심으로 인정하며 그분 편에 섭니다.
  alternative_readings:
  - 의인이 주님을 의롭게 합니다
  - 의인이 주님을 변호합니다
  rationale: 의인이 하나님께 도덕적 상태를 부여한다는 뜻이 아니므로, 인간의 선언 행위로서 하나님의 옳으심을 인정하는 방향으로 번역했습니다.
  doctrine_reference: 하나님의 의와 인간의 증언을 구분하되, 본문이 가진 긴장은 유지합니다.
