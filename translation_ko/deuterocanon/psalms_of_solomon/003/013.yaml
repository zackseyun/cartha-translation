revisions:
- from: 그는 넘어졌습니다. 그의 넘어짐이 악하기 때문이며, 그는 다시 일어나지 못할 것입니다. 죄인의 멸망은 영원합니다.[a][b]
  to: 그의 넘어짐이 참혹하므로[a][b] 그는 넘어졌으며, 일어나지 못할 것입니다. 죄인의 멸망은 영원합니다.
  rationale: The revision follows the Greek causal sequence while making it idiomatic in modern formal Korean. ‘참혹하므로’ represents πονηρόν contextually, without flattening the severity of the judgment or importing a moral category inappropriate to ‘fall.’ The unnecessary ‘다시’ is removed. Footnotes retain the lexical ambiguity of πτῶμα and the supplied prior rendering, but their Korean wording and anchors are corrected.
