translation:
  language: ko
  text: 그는 넘어졌습니다. 그의 넘어짐이 악하기 때문이며, 그는 다시 일어나지 못할 것입니다. 죄인의 멸망은 영원합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 넘어짐이 심각합니다’ 혹은 ‘그의 시체가 천합니다’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 몰락은 악합니다’.
    reason: previous_rendering
lexical_decisions:
- source_word: ἔπεσεν
  english_pob_choice: He has fallen
  chosen_korean: 넘어졌습니다
  alternatives_korean:
  - 쓰러졌습니다
  - 떨어졌습니다
  lexicon: BDAG
  rationale: 과거 사건이면서 현재 결과를 지닌 단호한 판결문맥을 살려 자연스러운 완료형으로 옮겼습니다.
- source_word: πτῶμα
  english_pob_choice: downfall
  chosen_korean: 넘어짐
  alternatives_korean:
  - 몰락
  - 패망
  - 타락
  lexicon: BDAG
  rationale: 직전의 ‘넘어졌습니다’와 같은 어근 감각을 살리면서, 실제로는 치명적 추락/몰락이라는 의미를 한국어로 담았습니다.
- source_word: πονηρόν
  english_pob_choice: evil
  chosen_korean: 악하기
  alternatives_korean:
  - 흉하기
  - 비참하기
  - 심각하기
  lexicon: BDAG
  rationale: 문자적 대응을 유지하되, 한국어에서는 ‘넘어짐이 악하다’보다 서술어형 ‘악하기’가 원문의 강한 평가를 더 직접적으로 드러냅니다.
- source_word: ἀπώλεια τοῦ ἁμαρτωλοῦ
  english_pob_choice: The destruction of the sinner
  chosen_korean: 죄인의 멸망
  alternatives_korean:
  - 죄인의 파멸
  - 죄인의 파괴
  lexicon: BDAG
  rationale: ἀπώλεια의 심판적 무게를 살려 ‘멸망’으로 옮겼고, ἁμαρτωλοῦ는 문맥상 일반적인 ‘죄인’으로 충분합니다.
theological_decisions:
- issue: εἰς τὸν αἰῶνα의 종말적 지속성
  chosen_reading: ‘영원합니다’로 옮겨, 심판의 지속성과 최종성을 분명히 했습니다.
  alternative_readings:
  - ‘한 시대 동안입니다’
  - ‘영원토록입니다’
  rationale: 이 문맥에서는 단순한 시간 경과보다 끝나지 않는 멸망을 강조하므로, 한국어로도 종말론적 지속을 분명히 드러내는 표현이 적절합니다.
  doctrine_reference: 심판의 영속성 / 종말론적 판결
