  yaml_path: translation/deuterocanon/psalms_of_solomon/003/007.yaml
  text: The truth of the righteous is from God their savior[b][a]; sin upon sin does not lodge in the house of a righteous man.
  footnotes:
  - marker: a
    text: Or “The truth of the righteous is from God,” with ἀλήθεια taken more abstractly; “truthfulness” brings out the ethical sense in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'The truthfulness'.
    reason: previous_rendering
translation:
  language: ko
  text: 의인들의 진실함은 그들의 구원자이신 하나님에게서 나옵니다. 죄가 죄 위에 더해지는 일은 의인의 집에 머무르지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘의인의 진실함/진리’가 될 수 있습니다. 여기서는 문맥상 윤리적 성품을 드러내기 위해 ‘진실함’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλήθεια
  english_pob_choice: truth
  chosen_korean: 진실함
  alternatives_korean:
  - 진리
  - 진실
  - 성실함
  lexicon: LSJ
  rationale: 이 문맥의 ἀλήθεια는 단순한 명제적 ‘진리’보다 의인의 윤리적 성품을 가리키므로, 한국어에서는 ‘진실함’으로 옮겨 그 성격을 살렸습니다.
- source_word: παρὰ θεοῦ σωτῆρος αὐτῶν
  english_pob_choice: is from God their savior
  chosen_korean: 그들의 구원자이신 하나님에게서 나옵니다
  alternatives_korean:
  - 그들의 구원자이신 하나님으로부터 옵니다
  - 그들의 구원자 하나님에게서 나옵니다
  lexicon: LSJ
  rationale: παρά + 속격의 출처 의미를 ‘-에게서 나옵니다’로 자연스럽게 살렸고, σωτήρ는 이 문맥에서 ‘구원자’가 가장 직접적입니다.
- source_word: αὐλίζεται
  english_pob_choice: does not lodge
  chosen_korean: 머무르지 못합니다
  alternatives_korean:
  - 거처하지 못합니다
  - 잠들지 못합니다
  - 머물지 못합니다
  lexicon: LSJ
  rationale: 동사는 ‘머물다/숙박하다’의 구체적 이미지를 가지므로, 죄가 의인의 집에 자리 잡지 못한다는 뜻을 간결하게 살려 ‘머무르지 못합니다’로 옮겼습니다.
- source_word: ἐφʼ ἁμαρτίαν
  english_pob_choice: sin upon sin
  chosen_korean: 죄가 죄 위에 더해지는 일
  alternatives_korean:
  - 죄 위에 죄
  - 죄가 죄에 덧붙는 일
  - 죄와 죄가 쌓이는 일
  lexicon: LSJ
  rationale: 반복과 중첩의 수사적 힘을 보존하기 위해 직역에 가깝게 처리했습니다. ‘더해지는 일’은 축적되는 뉘앙스를 드러냅니다.
theological_decisions:
- issue: ἀλήθεια의 윤리적 의미 범위
  chosen_reading: 의인의 내적·윤리적 ‘진실함’으로 읽되, 하나님께서 주시는 성격임을 함께 드러냈습니다.
  alternative_readings:
  - 객관적 ‘진리’
  - 언약적 ‘신실함’
  rationale: 이 구절은 의인의 성품과 죄의 거주 불가능성을 대조하므로, 단순 정보의 진리보다 삶으로 드러나는 진실성을 강조하는 번역이 문맥에 더 적합합니다.
  doctrine_reference: 문맥적 어휘 선택; 시편적 의인/악인 대조
- issue: ‘의인의 집’ 이미지
  chosen_reading: 죄가 의인의 삶/공동체 안에 정착하지 못한다는 주거 은유를 유지했습니다.
  alternative_readings:
  - 의인의 집안에 들어오지 못합니다
  - 의인의 집에 살지 못합니다
  rationale: αὐλίζεται의 거처 이미지를 유지해야 반절의 대조가 살아나므로, 한국어에서도 주거 은유를 보존했습니다.
  doctrine_reference: 시편적 수사와 비유 보존
