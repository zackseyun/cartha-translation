lexical_decisions:
- source_word: Ἵνα τί
  english_pob_choice: Why
  chosen_korean: 어찌하여
  alternatives_korean:
  - 왜
  - 무슨 까닭으로
  lexicon: BDAG
  rationale: 수사적 책망과 깨우침의 뉘앙스를 살리기에 ‘어찌하여’가 가장 자연스럽고 격조도 맞습니다.
- source_word: ὑπνοῖς
  english_pob_choice: do you sleep
  chosen_korean: 자느냐
  alternatives_korean:
  - 잠자느냐
  - 자는 것이냐
  lexicon: BDAG
  rationale: 현재형 직접 질문으로서 한국어에서는 간결한 ‘자느냐’가 원문의 책망조를 잘 드러냅니다.
- source_word: ψυχή
  english_pob_choice: O soul
  chosen_korean: 내 영혼아
  alternatives_korean:
  - 영혼아
  - 오 영혼아
  lexicon: BDAG
  rationale: 원문은 영혼을 직접 호격으로 부르지만, 한국어 시편 전통의 자연스러운 직접호칭을 따라 ‘내’는 문맥상 화자 자신의 영혼임을 드러내는 보충으로 이해했습니다.
- source_word: εὐλογεῖς
  english_pob_choice: bless
  chosen_korean: 찬송하지 않느냐
  alternatives_korean:
  - 복을 빌지 않느냐
  - 축복하지 않느냐
  lexicon: BDAG
  rationale: 하나님께 드리는 doxological 문맥에서 ‘찬송하다’가 한국어 예배 언어로 가장 자연스럽고, ‘복을 빌다’는 뉘앙스를 벗어납니다.
- source_word: τὸν κύριον
  english_pob_choice: the Lord
  chosen_korean: 주님을
  alternatives_korean:
  - 주를
  - 주 하나님을
  lexicon: BDAG
  rationale: κύριος의 기본값은 한국어 경건 문맥에서 ‘주님’으로 옮기되, 여기서는 직접 찬송의 대상임을 분명히 했습니다.
theological_decisions:
- issue: ψυχή에 대한 직접 호격을 한국어에서 어떻게 드러낼지
  chosen_reading: 영혼을 독립된 인격적 자기-호칭으로 옮겨, 자아를 책망하는 시편적 수사를 보존했습니다.
  alternative_readings:
  - ‘왜 자느냐, 영혼아’처럼 더 직역하는 방법
  - ‘내 마음아’로 심리화하는 방법
  rationale: 이 구절은 단순한 내면 묘사가 아니라 자기 자신을 향한 각성 촉구이므로, 호격성과 책망의 힘을 유지하는 번역이 필요합니다.
  doctrine_reference: 시편적 자기 권면과 인격적 영혼 개념
