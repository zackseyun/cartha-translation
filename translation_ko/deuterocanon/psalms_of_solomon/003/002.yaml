  source_fidelity: 첫 명령의 ψάλλετε와 δεύτε 번째 ψάλλε는 모두 노래/찬송하라는 명령인데, 초안의 첫 ‘드리십시오’는 이를 일반적인 헌정 행위로 넓힙니다. 또한 γρηγόρησον과 γρηγόρησιν의 어근 반복은 ‘지키다’가 아니라 ‘깨어 있다/깨어 지키다’ 계열로 유지되어야 합니다. 마지막 문장은 ἀγαθός의 반복을 보존하되, ‘시편’이 하나님께 드려지는 노래라는 관계를 자연스럽게 드러낼 수 있습니다.
  naturalness: ‘그의 지키심을 지키십시오’는 현대 한국어에서 부자연스럽고 원문의 ‘깨어 있음’ 의미도 전달하지 못합니다. ‘그분의 깨어 지키심을 바라보며 깨어 있으십시오’는 난해한 원문의 결속을 보존하면서도 자연스럽습니다. ‘찬양받으실 하나님께’는 두 여격 명사의 동격 관계를 한국어로 매끄럽게 표현합니다.
  terminology: ‘하나님’, ‘찬송’, ‘찬양’, ‘시편’, ‘좋은 마음’은 문맥과 현대 합쇼체에 적절합니다. αἰνετός는 ‘찬양받으실’로 옮길 수 있으나, 각주에서 ‘찬양할 만한’ 및 ‘찬양받는’이라는 가능성을 밝혀 수동형/형용사적 여지를 남깁니다.
