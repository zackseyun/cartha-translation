  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: lxx-swete-1909
  text: ὕμνον καὶ αἶνον ψάλλετε τῷ θεῷ τῷ αἰνετῷ. ψάλλε καὶ γρηγόρησον ἐπὶ τὴν γρηγόρησιν αὐτοῦ· ὅτι ἀγαθὸς ψαλμὸς τῷ θεῷ ἐξ ἀγαθῆς καρδίας.
  language: Greek
  pages:
  - 791
  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/003/002.yaml
  text: Sing a hymn and praise to God[a], the One worthy of praise. Sing, and keep watch for his watching[c][b], for a psalm to God from a good heart is good.
  footnotes:
  - marker: a
    text: Or “the praiseworthy One” or “God who is praised.”
    reason: lexical_alternative
  - marker: b
    text: The Greek phrase rendered “keep watch for his watchfulness” is unusual and may also be understood as “be vigilant for his vigilance” or similarly.
    reason: lexical_alternative
  - marker: c
    text: Or 'Sing a hymn and praise to God'.
    reason: previous_rendering
translation:
  language: ko
  text: 찬송과 찬양을 하나님께 드리십시오[a], 찬양받으실 분께. 노래하십시오, 그리고 그의 지키심[b][c]을 지키십시오. 좋은 마음으로 하나님께 드리는 시편은 좋기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘찬양받으실 분’ 혹은 ‘찬양받는 하나님’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 표현은 매우 특이하며, ‘그의 감시하심을 위해’ 또는 ‘그의 지키심에 대하여’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘노래하십시오, 그리고 그의 지키심을 지키십시오’.
    reason: previous_rendering
lexical_decisions:
- source_word: ὕμνον καὶ αἶνον
  english_pob_choice: a hymn and praise
  chosen_korean: 찬송과 찬양
  alternatives_korean:
  - 한 찬송과 한 찬양
  - 찬송가와 찬양
  lexicon: LSJ
  rationale: 두 명사를 함께 살려 병렬 구조를 유지했고, 예배적 어감을 가진 표준어로 자연스럽게 옮겼습니다.
- source_word: ψάλλετε / ψάλλε
  english_pob_choice: Sing
  chosen_korean: 드리십시오 / 노래하십시오
  alternatives_korean:
  - 노래하십시오
  - 찬송하십시오
  lexicon: LSJ
  rationale: 앞의 구문에서는 찬양의 내용을 하나님께 드리는 행위로 풀어 자연스럽게 했고, 뒤의 명령형은 직접적인 ‘노래하십시오’로 옮겨 반복 명령을 살렸습니다.
- source_word: τῷ θεῷ τῷ αἰνετῷ
  english_pob_choice: to God, the One worthy of praise
  chosen_korean: 하나님께… 찬양받으실 분께
  alternatives_korean:
  - 하나님께… 찬양할 만한 분께
  - 하나님께… 찬양받는 분께
  lexicon: LSJ
  rationale: αἰνετός의 수동적/형용사적 뉘앙스를 살려 ‘찬양받으실 분’으로 옮겨, 하나님의 성품이 아니라 마땅히 찬양받는 분임을 드러냈습니다.
- source_word: ἐπὶ τὴν γρηγόρησιν αὐτοῦ
  english_pob_choice: for his watchfulness
  chosen_korean: 그의 지키심
  alternatives_korean:
  - 그의 깨어 지키심
  - 그의 감찰하심
  lexicon: LSJ
  rationale: 중복 어근을 살리면서도 한국어에서 자연스러운 대응으로 ‘지키심’을 선택해, 하나님의 경계/감시적 행위를 과도하게 해석하지 않게 했습니다.
- source_word: ἐξ ἀγαθῆς καρδίας
  english_pob_choice: from a good heart
  chosen_korean: 좋은 마음으로
  alternatives_korean:
  - 좋은 হৃদ심에서
  - 선한 마음으로
  lexicon: LSJ
  rationale: ‘καρδία’를 현대 한국어의 ‘마음’으로 옮겨 이해 가능하게 하되, 원문의 단순한 윤리적 평가인 ἀγαθός를 ‘좋은’으로 유지했습니다.
theological_decisions:
- issue: 하나님 이름 표기
  chosen_reading: 본문의 θεός는 전통적 기독교 한국어에 맞게 ‘하나님’으로 옮겼습니다.
  alternative_readings:
  - 하느님
  - 신
  rationale: 이 시편은 하나님께 드리는 찬양을 말하므로, 한국 독자에게 즉시 인식되는 표준 신학 어휘를 유지하는 것이 적절합니다.
  doctrine_reference: 기독교 한국어 신역본의 일반적 신명 표기 관행
