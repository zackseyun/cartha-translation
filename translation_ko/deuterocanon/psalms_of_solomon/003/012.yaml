  alternative_readings:
  - ‘죄를 거듭했습니다’
  - ‘죄에 죄를 보탰습니다’
  rationale: 본문의 복수형 ἁμαρτίας ἐφʼ ἁμαρτίαις는 의도적 강화이므로, 이를 약화시키지 않는 직역적 이미지가 필요합니다.
  doctrine_reference: 시편 솔로몬 3:12의 문맥상 인간의 반복적 죄성과 심판의 정당성을 드러냅니다.
