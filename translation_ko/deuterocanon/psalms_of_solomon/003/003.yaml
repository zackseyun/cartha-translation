  lexicon: BDAG
  rationale: 목적어가 주님의 판단들인 점을 고려하면, ‘판단을 의롭다 하다’라는 뜻으로 이해하는 것이 가장 자연스럽고, 단순한 설명보다 원문 동사를 직접 반영합니다.
- source_word: τὰ κρίματα τοῦ κυρίου
  english_pob_choice: the Lord’s judgments
  chosen_korean: 주님의 심판
  alternatives_korean:
  - 주님의 판단들
  - 주님의 판결들
  lexicon: BDAG
  rationale: κρίματα는 법정적·심판적 판단을 가리키므로, 복수의 ‘심판들’로 옮겨 주님의 결정과 판정의 무게를 살렸습니다.
theological_decisions:
- issue: ἐξομολόγησις의 의미 범위
  chosen_reading: ‘감사’로 옮기되, 단순한 예의상의 감사가 아니라 하나님께 드리는 감사의 고백으로 이해합니다.
  alternative_readings:
  - 찬양
  - 고백
  rationale: 문맥상 경건한 응답의 어휘이며, 바로 앞절의 찬양 표현과 구별됩니다. 따라서 감사의 요소를 중심으로 하되, 고백적 뉘앙스를 배제하지 않도록 했습니다.
  doctrine_reference: 시편적 감사와 고백의 언어 사용
- issue: δικαιώσει와 κρίματα의 관계
  chosen_reading: 의인들이 주님의 심판을 ‘의롭다 한다’는 뜻으로 이해했습니다.
  alternative_readings:
  - 주님의 심판을 변호한다
  - 주님의 심판을 옳다고 인정한다
  rationale: 문장 구조상 의인들이 주님의 결정을 평가하는 진술이며, 주님의 심판이 의롭다는 것을 공개적으로 인정하는 의미가 자연스럽습니다.
  doctrine_reference: 하나님의 공의와 심판의 정당성
