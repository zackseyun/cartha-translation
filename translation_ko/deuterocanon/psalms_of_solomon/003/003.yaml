translation:
  language: ko
  text: 의인들은 언제나 주님을 기억할 것이며,[c] 감사드리며,[a] 주님의 심판들을 의롭다고 인정할 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘찬양하며’. 여기서 ἐξομολόγησις는 문맥에 따라 찬양, 감사 또는 고백을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주님의 심판들이 정당하다고 인정할 것입니다.’ δικαιόω 계열 표현은 정당하다고 여기거나 의롭다고 인정하는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘항상’. διὰ παντός는 끊임없이, 언제나라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιοι
  english_pob_choice: the righteous
