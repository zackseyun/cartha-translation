base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/003/003.yaml
  text: The righteous will remember the Lord continually[c][b][a], with thanksgiving and vindicating the judgments of the Lord.
  footnotes:
  - marker: a
    text: Or 'with thanksgiving'; the Greek ἐξομολόγησις can denote praise, thanksgiving, or confession depending on context.
    reason: lexical_alternative
  - marker: b
    text: Literally 'in justification/vindication of the Lord’s judgments.'
    reason: lexical_alternative
  - marker: c
    text: Or 'with praise'.
    reason: previous_rendering
translation:
  language: ko
  text: 의인들은 항상 주님을 기억하며, 감사와 함께 주님의 심판을 의롭다 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘찬양과 함께’. 여기서 ἐξομολόγησις는 문맥에 따라 찬양, 감사, 고백을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘주님의 심판들을 의롭다 함으로’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘기억할 것입니다’. 미래형 동사의 지속적 의미를 반영한 번역입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: δίκαιοι
  english_pob_choice: the righteous
  chosen_korean: 의인들
  alternatives_korean:
  - 의로운 사람들
  - 의로운 자들
  lexicon: BDAG
  rationale: 실질적 명사 용법의 형용사로서, 이 문맥에서는 단순한 성품 묘사보다 하나님 앞에서 의로운 사람들을 가리키므로 ‘의인들’이 가장 간결하고 자연스럽습니다.
- source_word: μνημονεύσουσιν
  english_pob_choice: will remember
  chosen_korean: 기억하며
  alternatives_korean:
  - 기억할 것입니다
  - 떠올리며
  - 말할 것입니다
  lexicon: BDAG
  rationale: 미래형이지만 여기서는 지속적 태도를 나타내므로, 한국어에서는 진행·반복의 뉘앙스를 살려 ‘기억하며’로 옮기는 것이 문맥에 맞습니다.
- source_word: ἐξομολογήσει
  english_pob_choice: with thanksgiving
  chosen_korean: 감사와 함께
  alternatives_korean:
  - 찬양과 함께
  - 고백과 함께
  lexicon: BDAG
  rationale: 이 단어는 문맥에 따라 찬양, 감사, 고백을 뜻할 수 있으나, 앞절의 일반적 ‘찬양’과 구별되고 감사의 신학적 무게를 살리기 위해 ‘감사’로 옮겼습니다.
- source_word: δικαιώσει
  english_pob_choice: vindicating
  chosen_korean: 의롭다 합니다
  alternatives_korean:
  - 옳다고 인정합니다
  - 정당함을 드러냅니다
  - 정당하다고 변호합니다
  lexicon: BDAG
  rationale: 목적어가 주님의 판단들인 점을 고려하면, ‘판단을 의롭다 하다’라는 뜻으로 이해하는 것이 가장 자연스럽고, 단순한 설명보다 원문 동사를 직접 반영합니다.
- source_word: τὰ κρίματα τοῦ κυρίου
  english_pob_choice: the Lord’s judgments
  chosen_korean: 주님의 심판
  alternatives_korean:
  - 주님의 판단들
  - 주님의 판결들
  lexicon: BDAG
  rationale: κρίματα는 법정적·심판적 판단을 가리키므로, 복수의 ‘심판들’로 옮겨 주님의 결정과 판정의 무게를 살렸습니다.
theological_decisions:
- issue: ἐξομολόγησις의 의미 범위
  chosen_reading: ‘감사’로 옮기되, 단순한 예의상의 감사가 아니라 하나님께 드리는 감사의 고백으로 이해합니다.
  alternative_readings:
  - 찬양
  - 고백
  rationale: 문맥상 경건한 응답의 어휘이며, 바로 앞절의 찬양 표현과 구별됩니다. 따라서 감사의 요소를 중심으로 하되, 고백적 뉘앙스를 배제하지 않도록 했습니다.
  doctrine_reference: 시편적 감사와 고백의 언어 사용
- issue: δικαιώσει와 κρίματα의 관계
  chosen_reading: 의인들이 주님의 심판을 ‘의롭다 한다’는 뜻으로 이해했습니다.
  alternative_readings:
  - 주님의 심판을 변호한다
  - 주님의 심판을 옳다고 인정한다
  rationale: 문장 구조상 의인들이 주님의 결정을 평가하는 진술이며, 주님의 심판이 의롭다는 것을 공개적으로 인정하는 의미가 자연스럽습니다.
  doctrine_reference: 하나님의 공의와 심판의 정당성
