translation:
  language: ko
  text: 그리고 그가 의인들을 찾아오실 때에는 반드시 기억되지 않을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는: 앞의 행위자를 죄인으로 보면, ‘의인들을 찾아오실 때에는 그가 반드시 기억되지 않을 것입니다.’'
    reason: alternative_reading
  - marker: b
    text: ‘찾아오시다’는 여기서 ‘돌보시다’, ‘살피시다’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ
  english_pob_choice: will certainly not
  chosen_korean: 반드시 … 않을 것입니다
  alternatives_korean:
  - 결코 … 않을 것입니다
  - 절대로 … 않을 것입니다
  lexicon: BDAG
  rationale: 이중 부정을 한국어의 자연스러운 강한 부정으로 살리되, 현대 합쇼체에서 과도하게 구어적이지 않게 ‘반드시’로 강조를 보완했습니다.
- source_word: μνησθήσεται
  english_pob_choice: be remembered
  chosen_korean: 기억되지 않을 것입니다
  alternatives_korean:
  - 떠올려지지 않을 것입니다
  - 기억에 남지 않을 것입니다
  lexicon: BDAG
  rationale: 수동형의 핵심 의미를 직접 살려 ‘기억되다’로 옮겼고, 대상이 사라져 잊히는 뉘앙스를 유지했습니다.
- source_word: ἐπισκέπτηται
  english_pob_choice: visits
  chosen_korean: 찾아오실 때에는
  alternatives_korean:
  - 돌보실 때에는
  - 살피실 때에는
  lexicon: BDAG
  rationale: 이 동사는 단순 방문보다 ‘돌아보며 임함’의 함의가 있어, 문맥상 신적 임재/방문을 자연스럽게 드러내는 ‘찾아오다’를 택했습니다.
- source_word: δικαίους
  english_pob_choice: the righteous
  chosen_korean: 의인들
  alternatives_korean:
  - 의로운 사람들을
  - 의로운 이들을
  lexicon: BDAG
  rationale: 윤리·종교적 범주를 가진 복수 명사를 한국어 성경어법에 맞게 ‘의인들’로 옮겼습니다.
theological_decisions:
- issue: ἐπισκέπτηται의 주체와 방문의 성격
  chosen_reading: 본문의 ‘찾아오실 때’는 단순한 사회적 방문이 아니라, 의인들에게 임하는 심판/돌보심의 신적 방문으로 읽을 수 있게 했습니다.
  alternative_readings:
  - ‘방문하실 때’처럼 더 중립적으로 옮기는 읽기
  - ‘돌보실 때’처럼 보호·배려를 더 강하게 드러내는 읽기
  rationale: 시편 솔로몬의 문맥에서 ἐπισκέπτεσθαι는 하나님의 행위와 연관된 방문/돌봄의 어감을 가지므로, 의미를 과도하게 축소하지 않는 범위에서 한국어로 신적 방문의 긴장을 살렸습니다.
  doctrine_reference: 문맥주의적 어휘 선택; 신적 visitation motif
- issue: 문장의 주어 생략과 이어짐
  chosen_reading: 앞절의 악인에 대한 진술을 이어받아, ‘그가’는 악인/죄인을 가리키는 것으로 두었습니다.
  alternative_readings:
  - 앞선 명사에 맞춰 비인칭적으로 처리하는 읽기
  - ‘그의 멸망’ 같은 추상 명사를 주어처럼 살리는 읽기
  rationale: 영어 POB의 최종 수정이 보여주듯, 그리스어 흐름에서는 죄인의 운명이 계속되므로 인칭 주어를 유지하는 편이 문맥과 수사에 더 충실합니다.
  doctrine_reference: 문맥 연속성; 인칭 대명사 해석
