  text: But those who fear the Lord will rise to eternal life, and their life in the light of the Lord will never cease.
translation:
  language: ko
  text: 그러나 주님을 두려워하는 이들은 영원한 생명으로 일어날 것이며, 그들의 생명은 주님의 빛 안에서 다시는 끊어지지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘두려워하는’이지만, 여기서는 하나님을 향한 지속적 경외의 태도를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβούμενοι
  english_pob_choice: those who fear
  chosen_korean: 주님을 두려워하는 이들
  alternatives_korean:
  - 주님을 경외하는 이들
  - 주님을 공경하는 이들
  lexicon: BDAG
  rationale: 분사구를 집합명사처럼 처리해 행위보다 지속적 태도를 드러냈고, '두려워하는'은 'fear'의 신학적 긴장을 약화시키지 않으면서도 자연스럽습니다.
- source_word: κύριον / Κυρίου
  english_pob_choice: the Lord / the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주 되시는 분
  - 야훼
  lexicon: BDAG
  rationale: 이 절의 κύριος는 그리스어 본문 안에서 일반적인 '주님' 칭호로 기능하며, 히브리어 YHWH 인용이 아니므로 기본값인 '주님'을 유지했습니다.
- source_word: ἀναστήσονται
  english_pob_choice: will rise
  chosen_korean: 일어날 것이며
  alternatives_korean:
  - 다시 살아날 것이며
  - 부활할 것이며
  lexicon: BDAG
  rationale: 미래 중간형의 ‘rise’ 이미지를 살리되, 이 절의 종말론적 문맥을 훼손하지 않는 범위에서 ‘일어날 것이며’로 옮겼습니다.
- source_word: εἰς ζωὴν αἰώνιον
  english_pob_choice: to eternal life
  chosen_korean: 영원한 생명으로
  alternatives_korean:
  - 영생으로
  - 영원한 삶으로
  lexicon: BDAG
  rationale: εἰς의 목적지/결과 뉘앙스를 살려 ‘-으로’로 처리했고, 문맥상 생명의 지속을 분명히 하는 ‘영원한 생명’을 택했습니다.
- source_word: ἐν φωτὶ Κυρίου
  english_pob_choice: in the light of the Lord
  chosen_korean: 주님의 빛 안에서
  alternatives_korean:
  - 주님의 빛 가운데
  - 주님의 빛 속에서
  lexicon: BDAG
  rationale: 전치사 ἐν의 장소적 이미지를 보존하면서도 한국어에서 자연스러운 ‘안에서’로 옮겨, 생명이 주님의 빛 영역 안에 있음을 드러냈습니다.
- source_word: οὐκ ἐκλείψει ἔτι
  english_pob_choice: will never cease
  chosen_korean: 다시는 끊어지지 않을 것입니다
  alternatives_korean:
  - 더 이상 사라지지 않을 것입니다
  - 결코 끝나지 않을 것입니다
  lexicon: BDAG
  rationale: ἐκλείπω의 ‘끊기다/사라지다/끝나다’ 범위를 고려해, 생명의 지속성을 가장 자연스럽게 전달하는 ‘끊어지지 않다’로 번역했습니다.
theological_decisions:
- issue: ἀναστήσονται εἰς ζωὴν αἰώνιον의 종말론적 의미
  chosen_reading: 미래의 부활적 일어남이 영원한 생명으로 귀결된다는 뜻을 본문에서 직접 살렸습니다.
  alternative_readings:
  - 도덕적·영적 갱신을 가리키는 일반적 '일어남'으로만 읽는 해석
  rationale: 동사 ἀναστήσονται와 목적구 εἰς ζωὴν αἰώνιον이 결합되어 있어, 단순한 비유적 회복보다 미래적 생명 참여를 더 강하게 시사합니다.
  doctrine_reference: 부활과 영생
