  text: The righteous man will not disdain being disciplined by the Lord[c][b][a]; his delight is continually before the Lord.
  footnotes:
  - marker: a
    text: Greek has an unusual form, δίκαιας, before the participle παιδευόμενους; the clause is translated by sense as 'the righteous.'
