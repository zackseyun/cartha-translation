lexical_decisions:
- source_word: δίκαιας παιδευόμενους / δίκαιος παιδευόμενος
  english_pob_choice: the righteous man / being disciplined
  chosen_korean: 의인은 / 징계받는 것
  alternatives_korean:
  - 의로운 사람은 / 훈육받는 것
  - 의인들이 / 교훈받는 것
  lexicon: δίκαιος, παιδεύω
  rationale: 제공된 본문은 OCR로 형태가 흔들려 있으나, POB 감사 기록에 따라 뜻은 ‘의인’과 ‘징계받다’의 결합으로 읽는 것이 타당합니다. 한국어는 자연스럽게 ‘의인’과 ‘징계받는 것’으로 옮겼습니다.
- source_word: ὀλιγωρήσει
  english_pob_choice: will not disdain
  chosen_korean: 업신여기지 않을 것입니다
  alternatives_korean:
  - 가볍게 여기지 않을 것입니다
  - 무시하지 않을 것입니다
  lexicon: ὀλιγωρέω
  rationale: ὀλιγωρέω는 ‘가볍게 여기다, 업신여기다’의 뜻이므로, 현대 한국어에서는 관계적 뉘앙스가 살아 있는 ‘업신여기지 않다’가 가장 직접적입니다.
- source_word: εὐδοκία
  english_pob_choice: delight
  chosen_korean: 기쁨
  alternatives_korean:
  - 선한 뜻
  - 호의
  lexicon: εὐδοκία
  rationale: 여기서는 하나님의 ‘호의’라기보다 인물의 내적 태도/즐거움이 뒤따르므로, POB의 최신 선택인 ‘delight’에 맞춰 ‘기쁨’으로 옮겼습니다.
- source_word: ἔναντι Κυρίου
  english_pob_choice: before the Lord
  chosen_korean: 주 앞에
  alternatives_korean:
  - 주님 앞에
  - 주님의 면전에서
  lexicon: ἔναντι, κύριος
  rationale: 직역적 공간 이미지인 ‘before the Lord’를 한국어 성경 문체에 맞게 간결하게 ‘주 앞에’로 유지했습니다.
theological_decisions:
- issue: 문장의 주어와 OCR 흔적 처리
  chosen_reading: 의인을 주가 징계하시는 것을 의인이 업신여기지 않으며, 그의 기쁨은 주 앞에 늘 있습니다.
  alternative_readings:
  - 의인은 주의 징계를 업신여기지 않으며, 그의 기쁨은 주 앞에 늘 있습니다.
  - 의인은 징계받는 것을 업신여기지 않으며, 그의 기쁨은 주 앞에 늘 있습니다.
  rationale: 제공 본문은 형태가 손상되어 있으므로, 감사 기록이 지시하는 의미를 따라 ‘의인’이 징계를 받는 장면으로 읽었습니다. ‘그의 기쁨’은 이어지는 δεύτερον 절의 주어를 유지해 해석상의 긴장을 풀지 않았습니다.
