  yaml_path: translation/deuterocanon/psalms_of_solomon/003/009.yaml
  text: He makes atonement for unintentional sin by fasting and humbling his soul[c][b][a];
  footnotes:
  - marker: a
    text: Or 'for unintentional sin' / 'for error done in ignorance.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'humbling his soul,' a biblical idiom for self-denial or self-affliction.
    reason: cultural_note
  - marker: c
    text: Or 'He made atonement for ignorance'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 금식과 자기 영혼을 낮춤으로 부지중의 죄를 속죄합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '부지중의 죄를 위해' / '무지로 행한 잘못을 위해'.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 '자기 영혼을 낮춤'으로, 자기부인이나 자기고행을 가리키는 성경적 관용구입니다.
    reason: cultural_note
  - marker: c
    text: 또는 '무지 때문에 속죄합니다'.
    reason: previous_rendering
lexical_decisions:
- source_word: ἐξιλάσατο
  english_pob_choice: makes atonement
  chosen_korean: 속죄합니다
  alternatives_korean:
  - 속죄를 합니다
  - 속죄하게 합니다
  - 화목하게 합니다
  lexicon: BDAG
  rationale: 제의적·속죄적 의미를 살리면서도 현대 한국어에서 자연스럽고, POB의 'made atonement' 계열 의미를 직접 반영합니다.
- source_word: περὶ ἀγνοίας
  english_pob_choice: for unintentional sin
  chosen_korean: 부지중의 죄를
  alternatives_korean:
  - 무지 때문에
  - 알지 못한 죄를
  - 부주의로 인한 죄를
  lexicon: BDAG
  rationale: 문맥상 단순한 '무지'가 아니라 제의적 용례의 '부지중의 죄/의도하지 않은 죄'가 핵심이므로 이를 드러냈습니다.
- source_word: ἐν νηστείᾳ
  english_pob_choice: by fasting
  chosen_korean: 금식으로
  alternatives_korean:
  - 금식하며
  - 금식으로써
  - 금식 가운데
  lexicon: BDAG
  rationale: ἐν의 도구적 용법을 살려, 행위의 수단을 분명히 하는 한국어 표현으로 옮겼습니다.
- source_word: καὶ ταπεινώσει ψυχὴν αὐτοῦ
  english_pob_choice: and humbling his soul
  chosen_korean: 자기 영혼을 낮춤으로
  alternatives_korean:
  - 자기 영혼을 겸손하게 함으로
  - 자신을 낮춤으로
  - 자기 영혼을 괴롭게 함으로
  lexicon: BDAG
  rationale: 히브리식 관용구인 '영혼을 낮추다'를 보존해, 단순한 자기비하보다 금욕·자기부인의 뉘앙스를 살렸습니다.
