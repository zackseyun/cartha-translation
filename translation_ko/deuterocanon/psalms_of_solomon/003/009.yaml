  - 금식 가운데
  lexicon: BDAG
  rationale: ἐν의 도구적 용법을 살려, 행위의 수단을 분명히 하는 한국어 표현으로 옮겼습니다.
- source_word: καὶ ταπεινώσει ψυχὴν αὐτοῦ
  english_pob_choice: and humbling his soul
  chosen_korean: 자기 영혼을 낮춤으로
  alternatives_korean:
  - 자기 영혼을 겸손하게 함으로
  - 자신을 낮춤으로
  - 자기 영혼을 괴롭게 함으로
  lexicon: BDAG
  rationale: 히브리식 관용구인 '영혼을 낮추다'를 보존해, 단순한 자기비하보다 금욕·자기부인의 뉘앙스를 살렸습니다.
