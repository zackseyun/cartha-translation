  terminology: ὅσιον은 ‘경건한’으로 적절하며, κύριος는 경건 문맥에서 ‘주님’으로 자연스럽습니다. οἶκος는 앞 절들과의 어휘 반복을 보존하여 ‘집’으로 유지합니다. 각주 a에는 본문 선택어 자체를 대안으로 반복하지 않고 실제 대안을 제시하며, b는 한국어 표현상 가능한 대안을 명시하도록 정리합니다.
