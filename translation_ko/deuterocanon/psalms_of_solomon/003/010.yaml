lexical_decisions:
- source_word: καθαρίζει
  english_pob_choice: cleanses
  chosen_korean: 깨끗하게 하십니다
  alternatives_korean:
  - 정결하게 하십니다
  - 깨끗하게 만드십니다
  lexicon: BDAG
  rationale: 현재형 동사 καθαρίζει의 지속적 행위를 살리면서, 의례적·도덕적 정화의 의미를 함께 드러내기 위해 ‘깨끗하게 하십니다’를 택했습니다.
- source_word: πᾶν ἄνδρα
  english_pob_choice: every devout man
  chosen_korean: 경건한 사람마다
  alternatives_korean:
  - 경건한 남자마다
  - 모든 경건한 사람
  lexicon: BDAG
  rationale: 그리스어는 분명히 남성형이지만, 한국어에서는 ‘사람마다’가 분배적 의미를 자연스럽게 살리면서도 성별 지시를 과도하게 강조하지 않습니다.
- source_word: ὅσιον
  english_pob_choice: devout
  chosen_korean: 경건한
  alternatives_korean:
  - 거룩한
  - 신실한
  - 경건한 사람
  lexicon: BDAG
  rationale: ὅσιον은 단순한 제의적 ‘거룩함’보다 하나님께 대한 경건과 신앙적 정결을 가리키므로, 현대 한국어에서는 ‘경건한’이 가장 자연스럽습니다.
- source_word: οἶκον
  english_pob_choice: house
  chosen_korean: 집
  alternatives_korean:
  - 가정
  - 집안
  - 집과 가족
  lexicon: BDAG
  rationale: 본문의 οἶκος 반복을 살리기 위해 POB의 수정안을 따라 ‘집’으로 일관되게 옮겼습니다. ‘가정’은 의미를 넓히지만 반복되는 어휘 연결을 약화시킬 수 있습니다.
theological_decisions:
- issue: κύριος의 번역과 경배적 호칭
  chosen_reading: ‘주님’으로 옮겨, 문장 전체에서 하나님을 향한 존칭을 유지했습니다.
  alternative_readings:
  - 주님
  - 주
  - 야훼
  rationale: 이 절은 시편성 경건 문맥에서 주어가 하나님이므로, 한국어 합쇼체와 호응하는 존칭형 ‘주님’이 가장 자연스럽습니다. 본문이 YHWH 직접 표기나 인용 구조를 갖지 않으므로 ‘야훼’로 전환하지 않았습니다.
  doctrine_reference: Divine title usage; Psalms of Solomon devotional register
