  source_fidelity: 그리스어의 현재형 καθαρίζει, 분배적 πᾶν ἄνδρα, ὅσιον, 그리고 반복되는 οἶκον을 전반적으로 잘 반영하려 했습니다. 그러나 ‘경건한 사람마다와’는 한국어 문법상 성립하지 않아 ‘모든 경건한 사람과 그의 집’으로 고쳐야 합니다. ‘정결하게 하십니다’는 καθαρίζω의 도덕적·의례적 정화의 뉘앙스를 ‘깨끗하게 하십니다’보다 더 충실히 전달합니다.
