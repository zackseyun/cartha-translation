revisions:
- from: 그의 날들에는 그들 가운데 불의가 없을 것입니다. 왜냐하면 그들은 모두 거룩하고, 그들의 왕은 주 메시아이기 때문입니다.[a]
  to: 그의 시대에는 그들 가운데 불의가 없을 것입니다. 그들 모두가 거룩하며, 그들의 왕은 주 메시아이기 때문입니다.[a]
  rationale: 문맥상 미래의 메시아 통치를 가리키는 진술을 ‘없을 것입니다’로 유지했습니다. 시간 표현만 자연스러운 현대 한국어로 다듬었고, χριστὸς κύριος의 소유격 없는 본문 표현은 ‘주 메시아’로 보존했습니다. 각주는 중복된 문구를 실제로 구별되는 두 대안으로 교체했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:09:56Z'
