base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/036.yaml
  text: And there will be no injustice in his days among them[a], because all are holy[b], and their king is the Lord Messiah.
  footnotes:
  - marker: a
    text: Or, “their king is the Messiah, the Lord”; alternatively, “their king is the Lord’s Messiah.”
    reason: alternative_reading
  - marker: b
    text: Or 'And there is no injustice'.
    reason: previous_rendering
translation:
  language: ko
  text: 그의 날들에는 그들 가운데 불의가 없을 것입니다. 왜냐하면 그들은 모두 거룩하고, 그들의 왕은 주 메시아이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 다른 번역으로는 “그들의 왕은 주 메시아이다” 또는 “그들의 왕은 주님의 메시아이다”가 가능합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδικία
  english_pob_choice: injustice
  chosen_korean: 불의
  alternatives_korean:
  - 부정의
  - 불법
  - 잘못
  lexicon: BDAG
  rationale: 공동체 안에서 제거되는 도덕적·사회적 그릇됨을 가장 직접적으로 드러내는 표현으로 ‘불의’를 택했습니다.
- source_word: ἐν ταῖς ἡμέραις αὐτοῦ
  english_pob_choice: in his days
  chosen_korean: 그의 날들에는
  alternatives_korean:
  - 그의 시대에는
  - 그가 다스리는 동안
  lexicon: BDAG
  rationale: 메시아의 시대를 가리키는 시간표현을 비교적 직역에 가깝게 살리되, 한국어 어순에 맞게 자연스럽게 옮겼습니다.
- source_word: ἅγιοι
  english_pob_choice: holy
  chosen_korean: 거룩하고
  alternatives_korean:
  - 성결하고
  - 성도이며
  - 성스럽고
  lexicon: BDAG
  rationale: 형용사적 의미를 유지해 공동체의 상태를 나타내는 ‘거룩하다’를 사용했습니다. ‘성도’는 명사적 뉘앙스가 강해 여기서는 적합하지 않습니다.
- source_word: χριστὸς κύριος
  english_pob_choice: the Lord Messiah
  chosen_korean: 주 메시아
  alternatives_korean:
  - 메시아 주님
  - 주님의 메시아
  - 주 그리스도
  lexicon: BDAG
  rationale: χριστός를 ‘메시아’로, κύριος를 ‘주’로 옮겨 두 호칭을 모두 보존했습니다. 본문에는 소유격이 없으므로 ‘주님의 메시아’로 풀지 않았습니다.
theological_decisions:
- issue: χριστὸς κύριος의 호칭 결합
  chosen_reading: 주 메시아
  alternative_readings:
  - 메시아이신 주
  - 주님의 메시아
  - 메시아 주님
  rationale: 그리스어는 소유격 없이 두 호칭을 나란히 두고 있으므로, 한국어에서도 관계를 과도하게 해석하지 않고 두 요소를 함께 살렸습니다. 이렇게 하면 왕의 칭호와 주권 언어 사이의 긴장을 보존할 수 있습니다.
  doctrine_reference: 호칭 번역과 본문 긴장 보존
