  - severity: medium
    issue: 현 각주 첫 대안은 본문과 실질적으로 동일합니다.
    rationale: 본문의 ‘그들의 왕은 주 메시아이기 때문입니다’와 각주의 ‘그들의 왕은 주 메시아이다’는 문장 종결형만 다를 뿐 번역 대안이 아닙니다. χριστὸς κύριος의 다른 가능한 연결 방식인 ‘메시아이신 주님’과 해석적 가능성인 ‘주님의 메시아’를 구별하여 제시해야 합니다.
