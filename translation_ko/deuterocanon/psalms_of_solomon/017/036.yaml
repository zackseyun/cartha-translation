  source_fidelity: 그리스어의 핵심 요소인 ‘그의 날들’, ‘그들 가운데’, ‘불의’, ‘모두 거룩함’, 그리고 소유격을 보태지 않은 χριστὸς κύριος를 대체로 충실히 반영했습니다. 다만 ‘주 메시아’라는 다소 낯선 호칭 결합은 본문에 유지하되, 각주에서 실제로 구별되는 대안들을 제시해야 합니다.
