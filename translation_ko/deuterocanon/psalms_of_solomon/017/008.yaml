  text: They laid waste the throne of David in arrogant usurpation[a]. But you, O God, will cast them down and remove their offspring from the earth[b],
  footnotes:
  - marker: a
    text: Or 'in the arrogance of change/replacement.' The Greek phrase is compressed; 'usurpation' makes explicit the likely political sense.
