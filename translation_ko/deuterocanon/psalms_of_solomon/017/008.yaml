- from: 그들은 다윗의 왕좌를 오만한 찬탈로 황폐하게 만들었습니다[a]. 그러나 주 하나님, 주께서는 그들을 내리치시고 그들의 자손을 땅에서 없애실 것입니다[b].
  to: 그들은 다윗의 보좌를 오만한 찬탈로 황폐하게 만들었습니다[a]. 그러나 하나님, 주께서는 그들을 무너뜨리시고 그들의 자손을 땅에서 없애실 것입니다[b].
