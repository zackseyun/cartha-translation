  verdict: revise
  source_fidelity: 두 미래형 동사 καταβαλεῖς와 ἀρεῖς는 한국어 미래형 ‘...실 것입니다’로 유지한 점이 원문에 충실합니다. 다만 ὁ θεός는 ‘하나님’이며, 본문의 호격에 없는 ‘주’를 더한 ‘주 하나님’은 삭제하는 것이 안전합니다. ἐν ὑπερηφανίᾳ ἀλλάγματος는 압축되고 다소 불명확한 표현이므로, 본문에서 문맥상 ‘찬탈’로 옮기되 주석에서 ‘교체/변화’라는 어휘적 가능성을 밝혀야 합니다.
  naturalness: ‘다윗의 보좌’, ‘무너뜨리시고’, ‘자손을 땅에서 없애실 것입니다’는 현대 표준어의 격식 있는 성경 문체에서 자연스럽습니다. ‘하나님, 주께서는’은 원문의 호격과 한국어 높임 표현을 자연스럽게 살립니다.
  terminology: θρόνος는 왕조와 통치의 함의를 지닌 ‘보좌’로 옮겼습니다. σπέρμα는 현대어에서 세대적 의미가 분명한 ‘자손’으로 번역했습니다. ‘찬탈’은 문맥상 가능한 해석이지만 ἀλλάγματος 자체의 기본 뜻을 확정하지 않도록 각주에서 대안을 보존했습니다.
