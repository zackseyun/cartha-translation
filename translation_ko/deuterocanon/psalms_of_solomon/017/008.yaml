  - marker: b
    text: Or 'will cast them down and remove'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 다윗의 보좌를 오만한 찬탈로 황폐하게 만들었습니다[a]. 그러나 하나님, 주께서는 그들을 무너뜨리시고 그들의 자손을 땅에서 없애실 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘교체의 오만 가운데’입니다. ‘교체’로도 이해될 수 있으나, 문맥상 부당한 왕조 교체를 가리켜 ‘찬탈’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들의 씨를 땅에서 거두어 가실 것입니다’입니다. ‘자손’은 그 세대적 의미를 드러낸 번역입니다.
    reason: lexical_alternative
