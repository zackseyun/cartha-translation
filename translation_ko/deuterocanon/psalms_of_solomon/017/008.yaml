  lexicon: BDAG
  rationale: 왕조적·통치적 의미를 분명히 하면서도 한국어에서 즉시 이해되는 표현을 택했습니다.
- source_word: ἐν ὑπερηφανίᾳ ἀλλάγματος
  english_pob_choice: in arrogant usurpation
  chosen_korean: 오만한 찬탈로
  alternatives_korean:
  - 교만한 교체로
  - 오만한 대체로
  - 자만한 대치로
  lexicon: LSJ
  rationale: ὑπερηφανία의 ‘오만함’과 ἀλλάγματος의 정치적·부당한 ‘교체/대체’ 뉘앙스를 함께 살려, 단순한 변화가 아니라 정당하지 않은 찬탈이라는 뜻이 드러나게 했습니다.
- source_word: καταβαλεῖς
  english_pob_choice: will cast them down
  chosen_korean: 내리치시고
  alternatives_korean:
  - 끌어내리시고
  - 무너뜨리시고
  - 쓰러뜨리시고
  lexicon: BDAG
  rationale: 하나님의 निर्ण정적 심판 행위를 강하게 드러내면서 한국어 어감이 자연스럽도록 했습니다.
- source_word: ἀρεῖς σπέρμα αὐτῶν
  english_pob_choice: remove their offspring
  chosen_korean: 그들의 자손을 ... 없애실 것입니다
  alternatives_korean:
  - 그들의 후손을 ... 제거하실 것입니다
  - 그들의 씨를 ... 없애실 것입니다
  - 그들의 자손을 ... 거두어 가실 것입니다
  lexicon: BDAG
  rationale: σπέρμα를 ‘자손’으로 옮겨 세대적 의미를 분명히 하고, ἀρεῖς의 제거·철거 의미는 ‘없애다’로 풀어 자연스럽게 표현했습니다.
theological_decisions:
- issue: ἀλλά의 대조
  chosen_reading: 앞절의 인간적 찬탈과 대조되는 하나님의 심판을 ‘그러나’로 살렸습니다.
  alternative_readings:
  - 그리고
  - 또한
  rationale: 문맥상 단순 연결이 아니라 대조가 핵심이므로 한국어에서도 역접을 분명히 해야 합니다.
  doctrine_reference: 시편적 심판/신적 역전 모티프
- issue: 동사의 시제와 문맥
  chosen_reading: 한국어에서는 미래형으로 옮겨, 원문의 미래형 동사가 지닌 선언적 심판의 힘을 살렸습니다.
  alternative_readings:
  - 과거형으로 옮김
  - 현재형 선언문으로 옮김
  rationale: 원문 형태는 미래형이며, 이 시편적 기도는 하나님의 확정된 심판을 예언적으로 선포하는 성격을 가지므로 미래형이 가장 적절합니다.
  doctrine_reference: 예언적 선언의 문체
