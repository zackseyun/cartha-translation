    reason: previous_rendering
translation:
  language: ko
  text: 그들은 다윗의 왕좌를 오만한 찬탈로 황폐하게 만들었습니다[a]. 그러나 주 하나님, 주께서는 그들을 내리치시고 그들의 자손을 땅에서 없애실 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘변화/교체의 오만 가운데’에 가깝습니다. 여기서는 정치적 맥락을 분명히 하기 위해 ‘찬탈’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들을 내리치시고 없애실 것입니다’로도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ἠρήμωσαν
  english_pob_choice: laid waste
  chosen_korean: 황폐하게 만들었습니다
  alternatives_korean:
  - 폐허로 만들었습니다
  - 쓸어버렸습니다
