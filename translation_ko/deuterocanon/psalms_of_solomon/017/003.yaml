  yaml_path: translation/deuterocanon/psalms_of_solomon/017/003.yaml
  text: But we will hope in God our savior, because the dominion of our God is forever with mercy, and the kingdom of our God is forever over the nations.
translation:
  language: ko
  text: 그러나 우리는 우리 하나님, 우리 구원자에게서 소망을 품을 것입니다. 왜냐하면 우리 하나님의 권세는 자비와 함께 영원하며, 우리 하나님의 나라는 영원히 민족들 위에 있기 때문입니다.
  philosophy: formal
lexical_decisions:
- source_word: ἐλπιοῦμεν
  english_pob_choice: we will hope
  chosen_korean: 소망을 품을 것입니다
  alternatives_korean:
  - 희망할 것입니다
  - 바랄 것입니다
  lexicon: ἐλπίζω
  rationale: 미래형의 기대를 살리면서도 단순 감정이 아니라 신뢰에 근거한 소망이라는 점을 드러내기 위해 ‘소망을 품다’로 옮겼습니다.
- source_word: σωτῆρα
  english_pob_choice: savior
  chosen_korean: 구원자
  alternatives_korean:
  - 구주
  - 구세주
  lexicon: σωτήρ
  rationale: 원문의 기능적 호칭을 직접 살려 ‘구원자’로 옮겼고, POB의 ‘savior’ 선택도 이 방향과 일치합니다.
- source_word: κράτος
  english_pob_choice: dominion
  chosen_korean: 권세
  alternatives_korean:
  - 통치
  - 지배
  - 주권
  lexicon: κράτος
  rationale: 여기서는 단순 권위보다 실제로 행사되는 지배력과 능력을 함께 가리키므로 ‘권세’가 가장 무난합니다.
- source_word: μετʼ ἐλέους
  english_pob_choice: with mercy
  chosen_korean: 자비와 함께
  alternatives_korean:
  - 긍휼과 함께
  - 은혜와 함께
  lexicon: ἔλεος
  rationale: 부사적 결합을 살려 ‘~와 함께’로 처리했고, ἔλεος의 핵심 뉘앙스는 전통적 ‘긍휼’보다 현대 독자에게 자연스러운 ‘자비’로 옮겼습니다.
- source_word: ἐπὶ τὰ ἔθνη
  english_pob_choice: over the nations
  chosen_korean: 민족들 위에
  alternatives_korean:
  - 민족들에 대해
  - 민족들 위로
  lexicon: ἔθνη
  rationale: ἐπί + 대격의 지배/상위 관계를 반영해 ‘위에’로 옮겨, 나라의 보편적 통치 범위를 분명히 했습니다.
theological_decisions:
- issue: 하나님을 ‘savior’로 부르는 호칭 처리
  chosen_reading: ‘우리 구원자’로 직역해 하나님의 구원 행위를 호칭 자체에 반영했습니다.
  alternative_readings:
  - ‘우리 구주’
  - ‘우리의 구원자’
  rationale: 문맥이 하나님의 구원자 되심을 선언하므로, 교회적 칭호보다 의미가 직접 드러나는 표현을 택했습니다.
  doctrine_reference: 구원론, 신적 칭호
- issue: ‘권세’와 ‘나라’의 병렬 구조
  chosen_reading: 하나님의 통치가 ‘권세’와 ‘나라’로 병렬되며 둘 다 영원하다는 점을 유지했습니다.
  alternative_readings:
  - ‘주권’과 ‘왕국’
  - ‘통치’와 ‘나라’
  rationale: 원문은 통치의 능력과 영역을 함께 말하므로 두 요소를 분리해 번역해야 긴장이 사라지지 않습니다.
  doctrine_reference: 하나님의 주권
