theological_decisions:
- issue: 마음의 말씀과 정죄의 관계
  chosen_reading: 이 구절은 메시아의 말씀이 외부의 적뿐 아니라 내면의 죄까지 판별하고 정죄하는 방식으로 작동함을 보여줍니다.
  alternative_readings:
  - 단순히 마음속 생각을 비유적으로 표현한 것
  - ‘드러내다’로 완화하여 법정적 의미를 약화하는 읽기
  rationale: 헬라어의 압축된 표현과 POB의 주석을 따라, 내적 언어가 심판의 근거가 된다는 긴장을 유지했습니다.
