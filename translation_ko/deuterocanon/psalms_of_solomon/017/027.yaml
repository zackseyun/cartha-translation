translation:
  language: ko
  text: 그는 그의 입의 말씀으로 무법한 나라들을 멸하시고, 그의 위협으로 나라들이 그의 앞에서 달아나게 하시며, 그들의 마음의 말로 죄인들을 유죄로 판명하실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들의 마음의 말로 죄인들을 드러내실 것입니다.” 헬라어 구문은 압축되어 있어, 죄인들의 내면의 말이나 의도가 그들의 죄를 드러내고 유죄를 입증한다는 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
