translation:
  language: ko
  text: 그의 입의 말씀으로 무법한 나라들을 멸하고, 그의 위협으로 나라들로 하여금 그의 앞에서 도망하게 하며, 그들의 마음의 말씀으로 죄인들을 정죄하십니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들의 마음의 말씀으로 죄인들을 정죄하십니다.” 헬라어 구문은 압축되어 있어, 죄를 드러내는 것과 정죄하는 것을 함께 암시할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “나라들을 도망하게 하며.”
    reason: previous_rendering
  - marker: c
    text: 또는 “그의 위협으로”
    reason: previous_rendering
