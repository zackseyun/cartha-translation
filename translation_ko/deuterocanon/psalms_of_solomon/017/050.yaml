translation:
  language: ko
  text: 그 날들에 살아 있어 이스라엘의 좋은 것들을 지파들의 모임 가운데서 보게 될 사람들은 복됩니다[a]. 하나님께서 이를 이루시기를 바랍니다!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 날들에 있게 될 사람들’입니다. ‘그 날들에 태어날 사람들’로 이해할 수도 있습니다.
    reason: γενόμενοι는 문자적으로 ‘있게 되다/생겨나다’라는 뜻이며, 문맥상 그날을 살아서 맞이할 사람들을 가리키는 것으로 이해할 수 있습니다.
lexical_decisions:
- source_word: μακάριοι
  english_pob_choice: Blessed are
