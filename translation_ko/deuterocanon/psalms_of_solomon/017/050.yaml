translation:
  language: ko
  text: 그 날들에 살아 있게 될 사람들은 복된 자들입니다[a]. 이스라엘의 좋은 것들을 지파들의 모임 가운데서 보게 될 것이기 때문입니다. 하나님이 그렇게 이루시기를 바랍니다!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 날들에 살아 있게 될 사람들’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  english_pob_choice: Blessed are
  chosen_korean: 복된 자들입니다
  alternatives_korean:
  - 복이 있습니다
  - 복됩니다
  lexicon: BDAG / LSJ
  rationale: 축복받은 상태를 나타내는 팔복 어조를 살리면서도 현대 한국어에서 자연스럽게 읽히는 표현으로 옮겼습니다.
- source_word: οἱ γενόμενοι ἐν ταῖς ἡμέραις ἐκείναις
  english_pob_choice: those who are alive in those days
  chosen_korean: 그 날들에 살아 있게 될 사람들은
  alternatives_korean:
  - 그 날들에 태어날 사람들은
  - 그 날들에 있게 될 사람들은
  lexicon: BDAG / LSJ
  rationale: γενόμενοι의 문자성보다 미래 시점에 그 날을 실제로 맞이하는 사람들을 가리키는 관용적 의미를 반영했습니다.
- source_word: ἐν συναγωγῇ φυλῶν
  english_pob_choice: in the gathering of the tribes
  chosen_korean: 지파들의 모임 가운데서
  alternatives_korean:
  - 지파들의 집회 가운데서
  - 지파들의 회중 가운데서
  lexicon: BDAG / LSJ
  rationale: συναγωγή의 핵심인 ‘모임/집합’을 살리되, 한국어에서 ‘회중’은 교회적 뉘앙스가 강하므로 더 중립적인 ‘모임’으로 옮겼습니다.
- source_word: ποιῆσαι ὁ θεός
  english_pob_choice: May God bring it to pass!
  chosen_korean: 하나님이 그렇게 이루시기를 바랍니다!
  alternatives_korean:
  - 하나님이 그렇게 하시기를 바랍니다!
  - 하나님이 그것을 이루시기를 바랍니다!
  lexicon: BDAG / LSJ
  rationale: 독립된 소망/기원 문장으로 읽어, 단순한 관계절이 아니라 하나님께 드리는 간구로 옮겼습니다.
theological_decisions:
- issue: 문장 종결의 화행
  chosen_reading: ποιῆσαι ὁ θεός를 독립된 소망의 표현으로 보고 기원문으로 번역했습니다.
  alternative_readings:
  - ‘하나님이 이루실 것’이라는 진술문
  - ‘하나님이 이루실 것인데’라는 종속절
  rationale: 그리스어의 마침표 성격과 문맥상 기도하는 어조를 살려, 예언적 기대를 단순 서술로 평면화하지 않았습니다.
  doctrine_reference: 성경의 종말론적 소망과 기원 표현
