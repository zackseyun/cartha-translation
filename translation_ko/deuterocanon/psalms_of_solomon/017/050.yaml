  - 하나님이 그렇게 하시기를 바랍니다!
  - 하나님이 그것을 이루시기를 바랍니다!
  lexicon: BDAG / LSJ
  rationale: 독립된 소망/기원 문장으로 읽어, 단순한 관계절이 아니라 하나님께 드리는 간구로 옮겼습니다.
theological_decisions:
- issue: 문장 종결의 화행
  chosen_reading: ποιῆσαι ὁ θεός를 독립된 소망의 표현으로 보고 기원문으로 번역했습니다.
  alternative_readings:
  - ‘하나님이 이루실 것’이라는 진술문
  - ‘하나님이 이루실 것인데’라는 종속절
  rationale: 그리스어의 마침표 성격과 문맥상 기도하는 어조를 살려, 예언적 기대를 단순 서술로 평면화하지 않았습니다.
  doctrine_reference: 성경의 종말론적 소망과 기원 표현
