  source_fidelity: 첫 절의 ‘공평하게’와 ‘그들 모두를 이끄실 것입니다’는 ἐν ἰσότητι πάντας αὐτοὺς ἄξει를 충실히 옮깁니다. 그러나 현행 본문의 ‘아무도 다른 이를 억압하려는 교만이’는 문법적으로 부자연스럽고, 형식상 수동인 καταδυναστευθῆναι를 능동으로 확정하여 원문의 난해함과 중의성을 지나치게 해소합니다. 수정문은 수동적 결과의 가능성과 반복되는 ‘그들 가운데서’를 보존합니다.
  naturalness: ‘그들 가운데에는 … 교만이 없을 것입니다’로 주어와 서술어의 호응을 바로잡았습니다. ‘억압당하는 일이 생길 정도의’는 원문의 어색한 수동 부정사 구문을 현대 표준 한국어로 이해 가능하게 표현하면서도, 능동적 가해 주체를 본문에서 단정하지 않습니다.
  terminology: ἰσότης는 통치 문맥에서 ‘공평하게’로 적절하며, ὑπερηφανία는 ‘교만’으로 유지할 수 있습니다. καταδυναστευθῆναι의 수동 형태는 본문과 주석에서 보존해야 합니다.
