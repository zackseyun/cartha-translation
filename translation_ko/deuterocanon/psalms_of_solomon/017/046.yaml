base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/046.yaml
  text: With equity he will lead them all[b][a], and there will be no arrogance among them to oppress one another.
  footnotes:
  - marker: a
    text: 'Literally “and there will not be among them arrogance of being oppressed among them.” The Greek infinitive is formally passive and difficult; the main text gives the likely sense in context: no one among them will act arrogantly so as to oppress another.'
    reason: alternative_reading
  - marker: b
    text: Or 'for one to oppress another.'.
    reason: previous_rendering
translation:
  language: ko
  text: 공평하게 그가 그들 모두를 이끄실 것이며, 그들 가운데는 아무도 다른 이를 억압하려는 교만이 없을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “그들 가운데는 그들 가운데서 억압당함의 교만이 없을 것이다”입니다. 그리스어 부정사 구문은 형식상 수동형으로 다소 난해하므로, 본문은 문맥상 자연스러운 뜻을 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “서로를 억압하려는”으로 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ἐν ἰσότητι
  english_pob_choice: with equity
  chosen_korean: 공평하게
  alternatives_korean:
  - 공의롭게
  - 평등하게
  - 공정하게
  lexicon: LSJ
  rationale: ἰσότης는 평등/공평의 뜻을 가지므로, 통치의 문맥에서 현대 한국어로는 ‘공평하게’가 가장 자연스럽고 본문의 윤리적 뉘앙스를 잘 살립니다.
- source_word: ἄξει
  english_pob_choice: he will lead
  chosen_korean: 이끄실 것이며
  alternatives_korean:
  - 인도하실 것이며
  - 가이실 것이며
  - 통치하실 것이며
  lexicon: LSJ
  rationale: ἄγω의 기본 의미는 ‘이끌다’이므로, 목자적·통치적 문맥을 반영해 ‘이끄실 것입니다’로 옮겼습니다.
- source_word: ὑπερηφανία
  english_pob_choice: arrogance
  chosen_korean: 교만
  alternatives_korean:
  - 오만
  - 자만
  - 거만
  lexicon: LSJ
  rationale: 이 단어는 남을 억누르는 우월적 태도를 가리키므로, 한국어로는 공동체적 갈등을 드러내는 ‘교만’이 가장 적절합니다.
- source_word: τοῦ καταδυναστευθῆναι ἐν αὐτοῖς
  english_pob_choice: to oppress one another
  chosen_korean: 다른 이를 억압하려는
  alternatives_korean:
  - 서로를 억압하려는
  - 누군가에게 압제하려는
  - 그들 가운데 누가 억압당하는
  lexicon: LSJ
  rationale: 본문은 형식상 수동 부정사지만 문맥상 공동체 안에서의 가해를 가리키므로, 한국어에서는 자연스럽게 ‘다른 이를 억압하려는’으로 풀어 뜻을 드러냈습니다.
theological_decisions:
- issue: 문장 말미의 수동 부정사와 공동체 내 상호 억압의 의미
  chosen_reading: ‘억압하려는 교만이 없을 것입니다’로, 공동체 내부에서 어떤 이도 다른 이를 짓누르려 하지 않는 상태를 말합니다.
  alternative_readings:
  - ‘누군가가 억압당하지 않을 것입니다’라는 더 직역적인 읽기
  - ‘서로를 억누르지 않을 것입니다’라는 상호적 읽기
  rationale: 그리스어는 수동형이지만 문맥상 교만이 억압으로 이어지는 행위를 가리키므로, 한국어 본문은 주체적 행위의 부재를 자연스럽게 표현했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
