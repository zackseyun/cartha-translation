  source_fidelity: ὑψώσον은 ‘높이다/드높이다’이고, ἰσχύν은 방식 또는 수반된 능력을 나타내는 다소 압축적인 표현으로 보입니다. 현 번역의 ‘능력으로 높이셔서’는 이를 대체로 충실히 반영합니다. 다만 θραῦσαι는 단순히 정치적으로 ‘무너뜨리다’보다 ‘부수다, 산산이 깨뜨리다’의 강한 파괴 의미를 지니므로, 그 힘을 더 직접적으로 나타내는 편이 좋습니다.
  naturalness: ‘그를 능력으로 높이시어 … 하소서’는 현대 한국어의 격식 있는 기도체로 자연스럽습니다. 문두의 ‘그리고’도 καὶ를 반영하지만, 기도문 문맥에서는 ‘또’가 더 자연스럽고 간결합니다.
