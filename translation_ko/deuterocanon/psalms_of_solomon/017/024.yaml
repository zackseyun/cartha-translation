    rationale: θραύω는 깨뜨리다, 부수다, 산산이 부수다라는 뜻입니다. 통치자들을 목적어로 하는 비유적·적대적 표현이므로 한국어에서도 ‘부수게’가 원문의 강한 어감을 더 잘 보존합니다.
  - severity: low
