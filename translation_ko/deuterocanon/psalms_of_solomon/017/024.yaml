lexical_decisions:
- source_word: ὑψώσον
  english_pob_choice: exalt ... in strength
  chosen_korean: 능력으로 높이셔서
  alternatives_korean:
  - 높이셔서
  - 들어 올리셔서
  lexicon: BDAG
  rationale: 동사는 단순한 상승보다 지위와 능력의 부여를 함께 암시하므로, ‘능력으로 높이셔서’로 옮겨 상승과 권능의 결합을 살렸습니다.
- source_word: ἰσχὺν
  english_pob_choice: in strength
  chosen_korean: 능력으로
  alternatives_korean:
  - 힘으로
  - 강하게
  lexicon: BDAG
  rationale: 여기서는 격이 방식 또는 수단처럼 기능하므로, 한국어에서는 자연스러운 도구격 표현인 ‘-으로’로 힘의 부여를 나타냈습니다.
- source_word: θραῦσαι
  english_pob_choice: to shatter
  chosen_korean: 무너뜨리게 하소서
  alternatives_korean:
  - 산산이 부수게 하소서
  - 깨뜨리게 하소서
  lexicon: BDAG
  rationale: 파괴적 목적을 살리면서도 한국어에서 과도하게 잔혹하게 들리지 않도록, 강한 정치적 붕괴를 암시하는 ‘무너뜨리다’를 택했습니다.
- source_word: ἄρχοντας ἀδίκους
  english_pob_choice: unjust rulers
  chosen_korean: 불의한 통치자들
  alternatives_korean:
  - 불의한 지배자들
  - 부정한 통치자들
  lexicon: BDAG
  rationale: ἄρχοντας는 통치 권력을 가진 자들이므로 ‘통치자들’이 적절하고, ἀδίκους는 사법·공적 불의를 가리키므로 ‘불의한’이 자연스럽습니다.
theological_decisions:
- issue: 문두 접속사와 기도문 어조
  chosen_reading: ‘그리고 … 하소서’로 시작하는 간구체를 유지했습니다.
  alternative_readings:
  - 직설적 서술형으로 옮김
  - 더 장엄한 옛 기도체 사용
  rationale: 본문은 하나님께 드리는 간구이므로 한국어에서도 청원 어조를 보존하는 것이 원문의 의도와 문맥에 가장 가깝습니다.
  doctrine_reference: 시편적 간구 문맥
