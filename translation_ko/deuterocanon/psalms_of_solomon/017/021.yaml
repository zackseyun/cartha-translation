theological_decisions:
- issue: δικαιοσύνη καὶ κρίμα의 이중 표현 보존
  chosen_reading: ‘의와 정의’로 나누어 번역했습니다.
  alternative_readings:
  - ‘의와 심판’
  - ‘의와 공의’
  rationale: δικαιοσύνη는 기본적으로 ‘의’로, κρίμα는 여기서 법정적·판결적 요소를 드러내는 ‘정의’로 분리하여, 두 낱말의 결합이 주는 윤리-사법적 긴장을 유지했습니다.
