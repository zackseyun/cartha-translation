  - severity: low
    issue: ‘가장 작은 백성’의 사회적 의미가 불분명합니다.
    rationale: ἐλαχίστου는 이 대조에서 백성 가운데 가장 낮은/미천한 사람을 뜻하므로, 크기를 뜻하기 쉬운 ‘작은’보다 사회적 최하층을 드러내는 표현이 낫습니다.
  - severity: low
    issue: 각주 b는 본문과 실질적으로 동일한 문구를 대안으로 제시하며, 원문의 수식 관계를 해소하지 못합니다.
    rationale: 불필요한 각주를 제거하고, αἰώνιοι의 실제 어휘 대안만 각주로 남기는 것이 앵커와 내용의 대응을 명확히 합니다.
