- source_word: ἀπὸ ἄρχοντος αὐτῶν καὶ λαοῦ ἐλαχίστου
  english_pob_choice: from their ruler to the least of the people
  chosen_korean: 그들의 통치자에게서부터 가장 작은 백성에 이르기까지
