  text: 깊은 곳과 높은 산들에서 솟는 영원한 샘들이 막혔습니다. 이는 그들 가운데 의와 정의를 행하는 사람이 없었기 때문입니다. 그들의 통치자부터 백성 가운데 가장 낮은 자에 이르기까지, 모두 온갖 죄에 빠져 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
