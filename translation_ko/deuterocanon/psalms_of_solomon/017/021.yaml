revisions:
- from: 영원한 샘들이 깊은 곳에서, 높은 산들에서, 막혔습니다. 왜냐하면 그들 가운데에는 의와 정의를 행하는 이가 없었기 때문입니다. 그들의 통치자에게서부터 가장 작은 백성에 이르기까지, 모두가 온갖 죄 가운데 있었습니다.[a][b]
  to: 깊은 곳과 높은 산들에서 솟는 영원한 샘들이 막혔습니다. 이는 그들 가운데 의와 정의를 행하는 사람이 없었기 때문입니다. 그들의 통치자부터 백성 가운데 가장 낮은 자에 이르기까지, 모두 온갖 죄에 빠져 있었습니다.[a]
  rationale: 첫 절의 발원 관계를 ‘깊은 곳과 높은 산들에서 솟는’으로 명시하여 원문의 두 전치사구가 ‘샘들’을 수식함을 보존했습니다. 사회적 최하층을 뜻하는 ἐλαχίστου는 ‘백성 가운데 가장 낮은 자’로 다듬었습니다. 중복되고 유익하지 않은 각주 b는 삭제하고, αἰώνιοι에 대한 실제 어휘 대안만 남겼습니다.
