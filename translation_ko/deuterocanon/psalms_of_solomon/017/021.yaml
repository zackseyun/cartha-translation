  lexicon: LSJ
  rationale: 출발점과 도착점을 나타내는 범위를 한국어에서 자연스럽게 드러내기 위해 ‘…에게서부터 …에 이르기까지’를 사용했습니다.
- source_word: ἐν πάσῃ ἁμαρτίᾳ
  english_pob_choice: in every kind of sin
  chosen_korean: 온갖 죄 가운데
  alternatives_korean:
