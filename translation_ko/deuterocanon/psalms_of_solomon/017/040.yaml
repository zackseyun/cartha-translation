translation:
  language: ko
  text: 주님의 백성을 지혜로, 기쁨과 함께 복주십니다.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: 직역하면 '지혜 안에서'도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: μετʼ εὐφροσύνης는 '기쁨으로' 또는 '즐거움과 함께'로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογήσει
  english_pob_choice: He will bless
  chosen_korean: 복주십니다
  alternatives_korean:
  - 축복하십니다
  - 복을 주십니다
  lexicon: BDAG
  rationale: 미래 능동의 εὐλογέω를 간결하고 자연스럽게 옮기되, 단순한 선언보다 하나님/주님의 은혜로운 베풂을 드러내는 동사로 처리했습니다.
- source_word: λαὸν Κυρίου
  english_pob_choice: the Lord's people
  chosen_korean: 주님의 백성
  alternatives_korean:
  - 주님의 사람들
  - 주님의 민족
  lexicon: BDAG
  rationale: λαός는 언약 공동체로서의 '백성'이 가장 적절하며, Κυρίου의 속격은 소유/소속 관계를 살려 '주님의'로 옮겼습니다.
- source_word: ἐν σοφίᾳ
  english_pob_choice: in wisdom
  chosen_korean: 지혜로
  alternatives_korean:
  - 지혜 안에서
  - 지혜 가운데
  lexicon: BDAG
  rationale: ἐν이 여기서 수단·영역의 뉘앙스를 가지므로, 한국어에서는 행위 방식에 맞는 '-로'를 사용해 지혜에 근거한 축복임을 자연스럽게 나타냈습니다.
- source_word: μετʼ εὐφροσύνης
  english_pob_choice: with gladness
  chosen_korean: 기쁨과 함께
  alternatives_korean:
  - 즐거움과 함께
  - 기뻐하며
  lexicon: BDAG
  rationale: μετά+속격의 동반 관계를 살려 '함께'로 옮겼고, εὐφροσύνη는 기쁨/즐거움을 뜻하므로 예배적 문맥에서 무난한 '기쁨'을 택했습니다.
theological_decisions:
- issue: 하나님/주님의 칭호 처리
  chosen_reading: Κυρίου를 '주님'으로 번역해 소속적 표현인 '주님의 백성'을 유지했습니다.
  alternative_readings:
  - 하나님의 백성
  - 주(主)의 백성
  rationale: 본문은 소유격 구조로 백성이 주께 속함을 말하므로, 한국어에서도 관계를 분명히 드러내는 소유격 표현이 가장 직접적입니다.
  doctrine_reference: 시편과 유사한 찬양 문맥에서의 주권적 소속 표현
