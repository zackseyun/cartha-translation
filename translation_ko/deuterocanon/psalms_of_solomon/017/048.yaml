base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/048.yaml
  text: His words are refined beyond the finest precious gold[a]; in the assemblies he will judge the people[d][c][b], the tribes of the sanctified.
  footnotes:
  - marker: a
    text: Or 'His words are purified/tested by fire beyond the finest gold.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in the assemblies he will distinguish' or 'separate' the people.
    reason: alternative_reading
  - marker: c
    text: The phrase 'the tribes of the sanctified one' is syntactically compressed in Greek; 'the holy one' or 'the consecrated one' are also possible.
    reason: alternative_reading
  - marker: d
    text: Or 'the sanctified one'.
    reason: previous_rendering
translation:
  language: ko
  text: 그의 말씀은 가장 귀한 첫째 금보다 더 정련되었으며[a], 회중들 가운데에서 그는 백성을 심판하시고[b], 성별된 자의 지파들을 심판하십니다[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 말씀은 불로 시험받아/정련되어 가장 귀한 금보다 더하다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘회중들 가운데에서 그는 백성을 구별하십니다’ 또는 ‘가르십니다.’
    reason: alternative_reading
  - marker: c
    text: 그리스어는 압축되어 있어 ‘성별된 자의 지파들’은 집합적 표현일 수 있습니다.
    reason: alternative_reading
  - marker: d
    text: 또는 ‘성별된 자의 지파들’ 대신 ‘거룩하게 된 자의 지파들’로 이해할 수도 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: τὰ ῥήματα αὐτοῦ
  english_pob_choice: His words
  chosen_korean: 그의 말씀은
  alternatives_korean:
  - 그의 말들은
  - 그의 말씀들은
  lexicon: BDAG
  rationale: ῥήματα는 말해진 내용들을 가리키며, 한국어에서는 복수성을 과도하게 드러내지 않는 ‘말씀’이 자연스럽고 압축적입니다.
- source_word: πεπυρωμένα
  english_pob_choice: refined
  chosen_korean: 정련되었으며
  alternatives_korean:
  - 불로 시험받았으며
  - 순화되었으며
  lexicon: BDAG
  rationale: 금속을 불로 다듬는 이미지를 살리기 위해 ‘정련되다’를 택해, POB의 ‘refined’와 같은 금속 공정의 뉘앙스를 유지했습니다.
- source_word: ὑπὲρ χρυσίον τὸ πρῶτον τίμιον
  english_pob_choice: beyond the finest precious gold
  chosen_korean: 가장 귀한 첫째 금보다
  alternatives_korean:
  - 최상급 귀금보다
  - 선택된 금보다
  lexicon: BDAG
  rationale: τὸ πρῶτον τίμιον의 최상급 가치를 한국어로 직역에 가깝게 풀어, 단순한 ‘금’이 아니라 가장 뛰어난 가치의 금과의 비교임을 보존했습니다.
- source_word: διακρινεῖ
  english_pob_choice: will judge
  chosen_korean: 심판하시고
  alternatives_korean:
  - 분별하시고
  - 가르시고
  lexicon: BDAG
  rationale: 문맥상 공동체 집회 안에서의 왕적/재판적 행위를 가리키므로, ‘judge’에 맞춰 ‘심판하다’를 기본으로 두되 대안적 의미도 열어 두었습니다.
- source_word: ἡγιασμένου
  english_pob_choice: the sanctified
  chosen_korean: 성별된 자의
  alternatives_korean:
  - 거룩하게 된 자의
  - 성화된 자의
  lexicon: BDAG
  rationale: 문맥과 수정 이력을 반영해 단수 ‘one’으로 좁히지 않고, 공동체적·집합적 의미를 살리는 ‘성별된 자의’로 옮겼습니다.
theological_decisions:
- issue: ἐν συναγωγαῖς와 διακρινεῖ의 결합이 드러내는 공동체적 심판/분별의 성격
  chosen_reading: ‘회중들 가운데에서 그는 백성을 심판하시고’로 옮겨, 공적 자리에서의 판결과 분별을 함께 드러냈습니다.
  alternative_readings:
  - ‘회당들에서 그는 백성을 구별하십니다’
  - ‘모임들에서 그는 백성을 가르십니다’
  rationale: 본문은 단순한 정보 전달보다 메시아적 통치의 공적·법정적 성격을 암시하므로, 심판의 의미를 살리되 분별/구분의 여지도 남겼습니다.
  doctrine_reference: 메시아의 왕적 심판과 공동체 정화라는 성서적 주제
- issue: ἡγιασμένου의 집합적 의미
  chosen_reading: ‘성별된 자의 지파들’로 번역해, 개인 1인보다는 구별된 백성 전체를 가리키는 집합적 의미를 유지했습니다.
  alternative_readings:
  - ‘성별된 자의 지파들’
  - ‘거룩한 자의 지파들’
  rationale: 최근 수정 지적처럼 단수 개인화는 문맥을 흐릴 수 있으므로, 집합적 성격을 유지하는 쪽이 본문과 더 잘 맞습니다.
  doctrine_reference: 이스라엘/하나님 백성의 성별됨과 공동체 정체성
