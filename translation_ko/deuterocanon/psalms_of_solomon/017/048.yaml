translation:
  language: ko
  text: 그의 말씀은 최상급의 금보다도 더 정련되어 있으며[a], 회중들 가운데에서 그는 성별된 백성의 지파들을 심판하실 것입니다[b][c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 말씀은 불로 시험받아 정련되었으며, 최상급의 금보다도 더하다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘회중들 가운데에서 그는 성별된 백성의 지파들을 구별하실 것입니다’ 또는 ‘가르실 것입니다.’
    reason: alternative_reading
  - marker: c
    text: 그리스어 구문은 압축되어 있습니다. ‘성별된 백성의 지파들’은 성별된 이들을 집합적으로 가리키는 표현으로 이해할 수 있습니다.
    reason: alternative_reading
  - marker: d
    text: 또는 ἡγιασμένου를 단수적으로 이해하여 ‘성별된 이의 지파들’, ‘거룩하게 된 이의 지파들’로 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: τὰ ῥήματα αὐτοῦ
  english_pob_choice: His words
