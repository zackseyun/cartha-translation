    text: 또는 ‘그들에게서 우세를 보였습니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπεκρατοῦσαν
  english_pob_choice: prevailed over
  chosen_korean: 우세했습니다
  alternatives_korean:
  - 압도했습니다
  - 지배했습니다
  - 우세를 보였습니다
  lexicon: BDAG
  rationale: 이 동사는 단순한 정치적 통치보다 ‘~보다 더 강하여 앞섬/우세함’의 뉘앙스를 가지므로, 상황을 과도하게 군사화하지 않으면서도 영어 POB의 ‘prevailed over’와 원문의 힘을 살렸습니다.
- source_word: υἱοὶ τῆς διαθήκης
  english_pob_choice: sons of the covenant
  chosen_korean: 언약의 아들들
  alternatives_korean:
  - 언약의 자손들
  - 언약의 자녀들
  - 언약 백성
  lexicon: BDAG
  rationale: 헬라어 복수 남성형을 그대로 살려 언약 정체성을 드러냈습니다. 성중립화보다 원문의 형태를 보존하는 쪽이 이 구절의 호칭적 효과를 더 잘 전달합니다.
- source_word: ἐν μέσῳ ἐθνῶν συμμίκτων
  english_pob_choice: in the midst of the mixed nations
  chosen_korean: 섞인 민족들 가운데서
  alternatives_korean:
  - 뒤섞인 민족들 가운데서
  - 혼합된 민족들 가운데서
  - 섞여 있는 민족들 한가운데서
  lexicon: LSJ
  rationale: συμμίκτων의 ‘섞임/뒤섞임’이라는 의미를 직접 반영해, 민족들 사이의 혼합 상태를 간결하게 전달했습니다.
- source_word: ἔλεος καὶ ἀλήθειαν
  english_pob_choice: mercy and truth
  chosen_korean: 자비와 진리
  alternatives_korean:
  - 자비와 진실
  - 자비와 신실함
  - 긍휼과 진리
  lexicon: BDAG
  rationale: 영어 POB의 직역적 짝을 한국어 성경 어휘로 옮기되, ἀλήθεια를 단순한 사실성보다 윤리적·언약적 진실성까지 포괄하는 ‘진리’로 유지했습니다.
theological_decisions:
- issue: ἔλεος καὶ ἀλήθειαν의 의미 범위
  chosen_reading: 자비와 진리
  alternative_readings:
  - 자비와 신실함
  - 자비와 긍휼과 신실함
  rationale: 이 표현은 셈어적 언약 윤리의 관용구를 반영할 가능성이 있으나, 본문에서는 그 긴장을 풀어 쓰지 않고 표면형을 유지했습니다. 의미의 확장은 독자가 문맥에서 읽도록 두는 편이 원문에 더 충실합니다.
  doctrine_reference: 의미의 긴장 보존
