translation:
  language: ko
  text: 그리고 언약의 아들들은 섞인 민족들 가운데서 그들보다 우세했습니다[a]. 그들 가운데, 곧 예루살렘에서는, 자비와 진리를 행하는 이가 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
