  to: 그리고 언약의 아들들은 뒤섞인 민족들 가운데서 그들보다 우세했습니다. 그들 가운데, 곧 예루살렘에서는 자비와 진리를 행하는 이가 없었습니다.
  rationale: 'The revision makes only safe stylistic corrections: it replaces the less natural description of the mixed nations and removes an inaccurate, unidiomatic alternative footnote. It preserves the Greek ambiguity of ἐπεκρατοῦσαν without recasting it as explicit political domination or adding a contextual judgment not stated in the verse.'
