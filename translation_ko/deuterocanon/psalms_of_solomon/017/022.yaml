base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/022.yaml
  text: The king was in lawlessness[a], and the judge in disobedience[c][b], and the people in sin.
  footnotes:
  - marker: a
    text: Greek is a verbless clause; 'is' is supplied in English for clarity.
    reason: lexical_alternative
  - marker: b
    text: Or 'rebellion' for 'disobedience' (ἀπειθείᾳ).
    reason: lexical_alternative
  - marker: c
    text: Or 'The king is in lawlessness, and the judge in disobedience, and the people in sin.'.
    reason: previous_rendering
translation:
  language: ko
  text: 왕은 불법 가운데 있었고, 재판관은 불순종 가운데 있었으며, 백성은 죄 가운데 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 계사 없는 절이므로, 한국어에서는 의미 보전을 위해 ‘있었습니다’를 보충했습니다.
    reason: lexical_alternative
  - marker: b
    text: ἀπειθείᾳ는 ‘불순종’ 외에 ‘반역’으로도 옮길 수 있으나, 이 문맥에서는 권위 거부의 일반적 의미가 더 적절합니다.
    reason: lexical_alternative
  - marker: c
    text: 문맥상 과거 서술이므로, 현재형 ‘있습니다’보다 ‘있었습니다’가 더 잘 맞습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ὁ βασιλεὺς
  english_pob_choice: the king
  chosen_korean: 왕
  alternatives_korean:
  - 임금
  - 통치자
  lexicon: BDAG
  rationale: 직함을 자연스럽고 직접적으로 옮기기 위해 ‘왕’을 사용했습니다. 본문은 넓은 의미의 통치자보다 구체적 왕권을 가리킵니다.
- source_word: ἐν παρανομίᾳ / ἐν ἀπειθείᾳ / ἐν ἁμαρτίᾳ
  english_pob_choice: in lawlessness / in disobedience / in sin
  chosen_korean: 불법 가운데 / 불순종 가운데 / 죄 가운데
  alternatives_korean:
  - 불법 속에 / 불순종 속에 / 죄 속에
  - 불법 안에 / 불순종 안에 / 죄 안에
  lexicon: BDAG
  rationale: 반복되는 ἐν의 병렬 구조를 살리면서, 상태·영역을 나타내는 한국어로 ‘가운데’를 택해 문장의 리듬과 누적된 비난의 구조를 유지했습니다.
- source_word: ἀπειθείᾳ
  english_pob_choice: disobedience
  chosen_korean: 불순종
  alternatives_korean:
  - 불복종
  - 반역
  lexicon: BDAG
  rationale: 이 문맥은 단순한 행정적 위반보다 권위에 대한 거부를 가리키므로, ‘불순종’이 가장 직접적이고 과도한 신학적 확대를 피합니다.
- source_word: ἁμαρτίᾳ
  english_pob_choice: sin
  chosen_korean: 죄
  alternatives_korean:
  - 죄악
  - 죄됨
  lexicon: BDAG
  rationale: 마지막 항목의 짧고 단정한 어조를 살리기 위해 기본어 ‘죄’를 유지했습니다.
theological_decisions:
- issue: 서술 시제의 보강
  chosen_reading: 과거 서술로 옮겨 ‘있었습니다’를 사용했습니다.
  alternative_readings:
  - ‘있습니다’로 현재적 일반 진술처럼 옮김
  - 시제를 드러내지 않고 ‘왕은 불법 가운데, 재판관은 불순종 가운데…’처럼 처리
  rationale: 그리스어는 계사 없는 절이지만, 앞 문맥의 과거 서술 흐름을 따라 역사적 부패를 묘사하는 것으로 읽어야 하므로 과거형이 더 적절합니다.
  doctrine_reference: 문맥-기반 해석 원칙
