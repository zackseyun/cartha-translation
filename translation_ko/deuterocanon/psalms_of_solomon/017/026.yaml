  source_fidelity: 수정이 필요합니다. 초안의 ‘하려 하십니다’는 그리스어 부정사 연쇄가 나타내는 시행/목적의 뜻을 단순한 의향으로 약화합니다. 또한 ῥάβδος는 ‘몽둥이’보다 ‘지팡이/막대기’가 정확하고, συντρίψαι는 ‘꺾다’보다 ‘부수다/산산이 부수다’가 적합합니다. σκεύη는 복수이므로 본문에도 ‘그릇들’을 반영했습니다.
  naturalness: ‘유산에서’, ‘모든 실체’, ‘철 몽둥이로 꺾으려 하십니다’는 이 문맥에서 다소 부자연스럽거나 의미가 불명확합니다. ‘기업에서’, ‘그들의 모든 기반’, ‘쇠 지팡이로 산산이 부수실 것입니다’가 현대 표준 한국어의 격식 있는 성경 문체에 더 자연스럽습니다.
  terminology: κληρονομία는 이스라엘의 몫·유업이라는 문맥을 살려 ‘기업’으로 옮겼습니다. ὑπόστασις는 존재론적 ‘실체’로 오해될 수 있으므로, 문맥상 가능한 넓은 뜻을 유지하는 ‘기반’으로 옮기고 대안을 각주에 제시했습니다. ἁμαρτωλοῦ의 단수는 ‘그 죄인’으로 보존했으며, 관련 각주 표지도 해당 어구에 배치했습니다.
