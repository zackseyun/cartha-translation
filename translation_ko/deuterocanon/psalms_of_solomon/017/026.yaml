  lexicon: BDAG
  rationale: ὑπόστασις의 의미 범위를 단순 소유로 좁히지 않기 위해, 문맥상 그들을 지탱하는 기반 전체를 암시할 수 있는 ‘실체’를 택했습니다.
theological_decisions:
- issue: 고난의 심판 이미지와 동사의 연쇄를 어떻게 처리할지
  chosen_reading: 세 개의 부정적 목적 부정사 연쇄를 한국어에서도 동사 병렬로 유지해, 죄인 추방·교만 파괴·실체 붕괴라는 누적적 심판 이미지를 드러냈습니다.
