base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/026.yaml
  text: to drive sinners out from the inheritance[a], to wipe out the pride of the sinner like a potter's vessels[d][c][b], to crush all their substance with an iron rod.
  footnotes:
  - marker: a
    text: Or 'heritage' for 'inheritance.'
    reason: lexical_alternative
  - marker: b
    text: '''Of the sinner'' is singular in Greek and may function as a representative singular.'
    reason: lexical_alternative
  - marker: c
    text: '''All their substance'' may also be understood as ''their whole standing'' or ''their possessions.'''
    reason: lexical_alternative
  - marker: d
    text: Or 'like a potter’s vessels'.
    reason: previous_rendering
translation:
  language: ko
  text: 죄인들을 유산에서 몰아내고[a], 죄인의 교만을 토기장이의 그릇처럼[b][d] 부수며, 그들의 모든 실체를[c] 철 몽둥이로 꺾으려 하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기업’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 단수형이지만, 한국어에서는 자연스러운 비유를 위해 복수적 이미지로 읽힐 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘모든 실체’는 ‘그들의 전체 기반’ 또는 ‘그들의 소유 전체’로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘토기장이의 그릇들처럼’으로도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ἐξῶσαι
  english_pob_choice: to drive ... out
  chosen_korean: 몰아내고
  alternatives_korean:
  - 내쫓고
  - 몰아내고
  - 축출하고
  lexicon: BDAG
  rationale: 강한 배제와 추방의 뉘앙스를 자연스러운 현대 한국어로 살리면서, 단순한 이동이 아니라 강제로 내보내는 힘을 반영했습니다.
- source_word: κληρονομίας
  english_pob_choice: inheritance
  chosen_korean: 유산
  alternatives_korean:
  - 상속
  - 기업
  - 상속 재산
  lexicon: BDAG
  rationale: 문맥상 공동체가 받은 몫·상속분을 가리킬 수 있어, 한국어에서 covenantal inheritance의 범위를 넓게 담는 ‘유산’으로 옮겼습니다.
- source_word: σκεύη κεραμέως
  english_pob_choice: potter's vessels
  chosen_korean: 토기장이의 그릇
  alternatives_korean:
  - 옹기장이의 그릇
  - 토기 그릇
  - 토기장이의 질그릇
  lexicon: BDAG
  rationale: 비유의 구체성을 유지하기 위해 직역에 가깝게 옮겼고, ‘그릇’으로 파편화·파괴의 이미지를 자연스럽게 전달했습니다.
- source_word: πᾶσαν ὑπόστασιν αὐτῶν
  english_pob_choice: all their substance
  chosen_korean: 그들의 모든 실체
  alternatives_korean:
  - 그들의 모든 소유
  - 그들의 온갖 기반
  - 그들의 모든 존재 기반
  lexicon: BDAG
  rationale: ὑπόστασις의 의미 범위를 단순 소유로 좁히지 않기 위해, 문맥상 그들을 지탱하는 기반 전체를 암시할 수 있는 ‘실체’를 택했습니다.
theological_decisions:
- issue: 고난의 심판 이미지와 동사의 연쇄를 어떻게 처리할지
  chosen_reading: 세 개의 부정적 목적 부정사 연쇄를 한국어에서도 동사 병렬로 유지해, 죄인 추방·교만 파괴·실체 붕괴라는 누적적 심판 이미지를 드러냈습니다.
  alternative_readings:
  - 문장을 하나의 해설적 표현으로 풀어 쓰기
  - 심판 이미지를 완화해 덜 폭력적으로 표현하기
  rationale: 원문은 시적 병렬 구조로 강한 심판 선언을 누적시키므로, 이를 완화하거나 설명적으로 바꾸면 본문의 힘이 약해집니다.
  doctrine_reference: 시편 솔로몬의 시가적 심판 신학, 원문 수사 구조 보존
- issue: ἁμαρτωλοῦ의 단수 처리
  chosen_reading: ‘죄인’의 단수를 유지해 대표적 단수로 읽히게 했습니다.
  alternative_readings:
  - 복수형 ‘죄인들’로 통일하기
  - ‘한 죄인’처럼 명시적으로 단수화하기
  rationale: 그리스어 단수는 대표적 단수로 기능할 수 있으므로, 한국어에서도 단수형을 유지하되 전체 문맥의 복수 대상과 충돌하지 않도록 했습니다.
  doctrine_reference: 대표적 단수(representative singular)
