  doctrine_reference: 시편 솔로몬의 시가적 심판 신학, 원문 수사 구조 보존
- issue: ἁμαρτωλοῦ의 단수 처리
  chosen_reading: ‘죄인’의 단수를 유지해 대표적 단수로 읽히게 했습니다.
  alternative_readings:
  - 복수형 ‘죄인들’로 통일하기
  - ‘한 죄인’처럼 명시적으로 단수화하기
  rationale: 그리스어 단수는 대표적 단수로 기능할 수 있으므로, 한국어에서도 단수형을 유지하되 전체 문맥의 복수 대상과 충돌하지 않도록 했습니다.
