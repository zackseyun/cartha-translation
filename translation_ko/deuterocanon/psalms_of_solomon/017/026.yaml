  - marker: c
    text: '''All their substance'' may also be understood as ''their whole standing'' or ''their possessions.'''
    reason: lexical_alternative
  - marker: d
    text: Or 'like a potter’s vessels'.
    reason: previous_rendering
translation:
  language: ko
  text: 죄인들을 기업에서 몰아내시고[a], 그 죄인의[b] 교만을 토기장이의 그릇들처럼[d] 산산이 부수시며, 그들의 모든 기반을[c] 쇠 지팡이로 산산이 부수실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유산’ 또는 ‘상속받은 몫’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 ‘죄인’은 단수형이며, 대표적으로 한 부류 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘모든 기반’은 ‘그들의 모든 소유’, ‘그들의 전체 지위’ 또는 ‘그들의 모든 실체’로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 직역하면 ‘토기장이의 그릇들처럼’입니다. 비유는 깨지기 쉬운 그릇이 산산이 부서지는 모습을 가리킵니다.
    reason: previous_rendering
