  naturalness: ‘낯선 자로서 교만하게 행동했으며’와 ‘우리 하나님과는 낯설었습니다’는 현대 표준 한국어의 문어적 합쇼체 안에서 자연스럽습니다. ‘적대자’보다 성경 문맥에서 일반적인 ‘원수’가 간결하고 자연스럽습니다.
