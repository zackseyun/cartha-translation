translation:
  language: ko
  text: 적대자는 낯선 자로서 행동했으며, 교만 가운데 있었고, 그의 마음은 우리 하나님에게서 멀어져 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ἀλλοτριότητι
  english_pob_choice: in estrangement
  chosen_korean: 낯선 자로서
  alternatives_korean:
  - 소외 가운데
  - 이방인으로서
  - 낯선 상태에서
  lexicon: LSJ
  rationale: ἀλλοτριότης는 단순한 감정적 소외보다 ‘남의 것/낯섦/외인 됨’의 상태를 가리키므로, 본문 맥락의 외부자·이방인 뉘앙스를 살려 ‘낯선 자로서’로 옮겼습니다.
- source_word: ὁ ἐχθρὸς
  english_pob_choice: the enemy
  chosen_korean: 적대자
  alternatives_korean:
  - 원수
  - 적
  lexicon: LSJ
  rationale: 직역상 ‘원수’도 가능하지만, 이 시편의 정치·집단적 대적 맥락에서는 인격적 적대 행위를 보이는 ‘적대자’가 더 설명적이며, 문체상도 과도하게 종교화하지 않습니다.
- source_word: ἐποίησεν
  english_pob_choice: acted
  chosen_korean: 행동했습니다
  alternatives_korean:
  - 행했습니다
  - 행동했습니다
  - 일했습니다
  lexicon: LSJ
  rationale: 목적어가 없는 절대용법이므로 단순히 ‘하였다’보다 행위의 태도를 드러내는 ‘행동했습니다’가 자연스럽고, 이어지는 ‘교만 가운데’와도 잘 맞습니다.
- source_word: ὑπερηφανίᾳ
  english_pob_choice: in pride
  chosen_korean: 교만 가운데
  alternatives_korean:
  - 오만 가운데
  - 교만함으로
  - 거만함 가운데
  lexicon: LSJ
  rationale: ὑπερηφανία는 단순한 자부심이 아니라 하나님 앞에서의 과도한 자고를 뜻하므로, 부정적 도덕성을 분명히 하는 ‘교만’이 적절합니다.
- source_word: ἀπὸ τοῦ θεοῦ ἡμῶν
  english_pob_choice: from our God
  chosen_korean: 우리 하나님에게서 멀어져 있었습니다
  alternatives_korean:
  - 우리 하나님에게서 떨어져 있었습니다
  - 우리 하나님으로부터 멀었습니다
  - 우리 하나님과는 다른 상태였습니다
  lexicon: LSJ
  rationale: ἀπό는 단순 출처보다 분리·이격을 나타내며, καρδία αὐτοῦ ἀλλοτρία와 결합해 관계적 분리를 강조하므로 ‘멀어져 있었습니다’로 의미를 풀어 자연스럽게 표현했습니다.
theological_decisions:
- issue: ἀλλοτριότης / ἀλλοτρία의 관계적 분리와 민족적 외부자 의미
  chosen_reading: 본문은 단순히 신앙이 식은 내부자를 말하기보다, 이스라엘 공동체의 관점에서 ‘낯선 자/외부자’의 대적을 묘사하는 것으로 읽었습니다.
  alternative_readings:
  - 영적 소외 상태를 강조하는 읽기
  - 언약에서 이탈한 자를 가리키는 읽기
  rationale: 주어진 주석 전개와 문맥상 이 구절은 정체성상의 외부성과 적대 행위를 함께 강조합니다. 그래서 ‘소외’만으로 좁히지 않고 외부자성을 살렸습니다.
  doctrine_reference: 문맥 주해
