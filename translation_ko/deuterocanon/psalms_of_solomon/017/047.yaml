  source_fidelity: 개정이 필요합니다. 초안은 부정과거 부정사 ἀναστῆσαι와 παιδεῦσαι를 각각 과거의 직설법인 “세우시며…징계하셨습니다”로 바꾸어, 본문이 제시하는 설명적/목적적 부정사 구문을 완료된 사건으로 만들었습니다. 또한 ἔγνω의 목적어인 관계대명사 ἣν은 ‘영화’를 가리키는데, 각주 a의 표지가 ‘영화’ 뒤에 놓여 있어 해당 어휘와 맞지 않습니다. 개정문은 ‘하나님께서 아신 것은 곧 …하는 것입니다’라는 형태로 다소 압축된 원문의 관계절과 부정사 설명을 한국어로 보존합니다.
  naturalness: ‘이스라엘 집 위에’는 현대 일상어로는 다소 낯설지만 οἶκος Ἰσραήλ의 집합적 성서 표현과 ἐπί의 통치 관계를 보존하는 문맥상 허용됩니다. 문장을 둘로 나누고 ‘곧’으로 부정사 내용을 풀어 현대 표준어 합쇼체에서 자연스럽게 했습니다.
  terminology: εὐπρέπεια는 왕적 위엄과 빛남을 포함하는 ‘영화’로 유지할 수 있습니다. ἔγνω는 교리적으로 ‘미리 아셨다’나 ‘택하셨다’로 확정하지 않고 ‘아신’으로 옮겼습니다. παιδεῦσαι는 ‘징계하시는’으로 유지하되, 교육·훈육의 가능성을 각주로 밝혔습니다. ‘이스라엘 집’은 ‘이스라엘 백성’으로 평준화하지 않아 원문의 표현을 보존합니다.
