  - marker: b
    text: Or “disciplining him” or “instructing him.”
    reason: lexical_alternative
  - marker: c
    text: Or 'recognized in raising him up over the house of Israel and training him'.
    reason: previous_rendering
translation:
  language: ko
  text: 이것이 이스라엘 왕의 영화입니다[a]. 하나님께서 아셨고, 그를 이스라엘 집 위에 세우시며[b], 그를 징계하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님께서 아셨다”는 뜻으로, 경우에 따라 “미리 아셨다” 또는 “인정하셨다”는 뉘앙스가 있을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “이스라엘 집을 다스리게 하시며”로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐπρέπεια
  english_pob_choice: splendor
  chosen_korean: 영화
  alternatives_korean:
  - 아름다움
  - 위엄
  - 광채
  lexicon: LSJ
  rationale: 왕의 품위와 드러나는 탁월함을 함께 살릴 수 있는 표현으로, 문맥상 단순한 미적 아름다움보다 영화가 더 자연스럽습니다.
- source_word: ἔγνω
  english_pob_choice: knew
  chosen_korean: 아셨고
  alternatives_korean:
  - 알으셨고
  - 미리 아셨고
  - 인정하셨고
  lexicon: LSJ
  rationale: 하나님이 왕을 단순히 정보적으로 아신 것이 아니라 뜻 안에서 아신다는 뉘앙스를 살리되, 과도한 교리화는 피했습니다.
- source_word: ἀναστῆσαι αὐτὸν ἐπʼ οἶκον Ἰσραήλ
  english_pob_choice: to raise him up over the house of Israel
  chosen_korean: 그를 이스라엘 집 위에 세우시며
  alternatives_korean:
  - 그를 이스라엘 집 위에 일으키시며
  - 그를 이스라엘 집을 다스리게 하시며
  - 그를 이스라엘 집 위에 세워 두시며
  lexicon: LSJ
  rationale: ‘세우다’는 왕권 부여와 공적 배치를 함께 드러내며, ‘위에’는 ἐπʼ의 지배/권위 관계를 보존합니다.
- source_word: παιδεῦσαι
  english_pob_choice: to discipline him
  chosen_korean: 그를 징계하셨습니다
  alternatives_korean:
  - 그를 훈련하셨습니다
  - 그를 가르치셨습니다
  - 그를 훈육하셨습니다
  lexicon: LSJ
  rationale: 문맥상 단순 교육보다 형성·교정의 의미가 강하므로, ‘징계’가 가장 직접적입니다.
theological_decisions:
- issue: 하나님이 왕을 '아셨다'는 표현의 신학적 뉘앙스
  chosen_reading: 하나님의 주권적 아심을 살리되, 이를 별도의 예언론 용어로 확대하지 않고 본문 그대로 '아셨고'로 옮깁니다.
  alternative_readings:
  - 미리 아셨고
  - 인정하셨고
  - 택하셨고
  rationale: γινώσκω 계열은 히브리적 '앎'의 선택적·관계적 뉘앙스를 가질 수 있지만, 본문이 그 이상을 명시하지 않으므로 긴장을 유지합니다.
  doctrine_reference: 하나님의 인식과 선택의 긴장 보존
