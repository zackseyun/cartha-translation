  - severity: medium
    issue: 각주 a의 표지 위치가 대상 어휘와 불일치함
    rationale: 각주 a는 ἔγνω(‘아셨다’)의 번역 대안을 설명하지만 초안에서는 εὐπρέπεια(‘영화’) 뒤에 붙어 있습니다. ‘아신’에 붙여야 합니다.
  - severity: medium
    issue: παιδεῦσαι의 번역 대안 각주가 누락됨
    rationale: ‘징계’는 가능한 번역이지만 훈육·가르침의 의미 범위도 있으므로, 영어 감사 기록의 어휘 대안을 한국어 각주로 보존하는 것이 적절합니다.
