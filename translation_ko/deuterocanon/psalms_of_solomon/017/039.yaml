  - severity: low
    issue: 각주 b의 이사야 11:4 설명이 다소 부정확함
    rationale: 이사야 11:4는 가난한 이를 공의로 판결하는 일과 입의 막대기로 땅을 치는 이미지를 함께 담습니다. ‘입의 말씀으로 판단하고 치는’보다 본 절과의 반향을 더 정확하게 설명하도록 다듬는 것이 좋습니다.
