    issue: κατάξει를 ‘다스리실 것입니다’로 번역함
    rationale: Swete의 κατάξει는 ‘부수다, 산산이 깨뜨리다’의 뜻으로 읽어야 합니다. ‘다스리다’는 영어 감사 기록의 최신 표현을 따라간 것이지만, 그 자체가 인쇄된 그리스어 본문과 맞지 않으며 원문의 강한 동작을 통치 개념으로 바꿉니다.
