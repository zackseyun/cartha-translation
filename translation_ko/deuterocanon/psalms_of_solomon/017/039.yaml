    reason: previous_rendering
translation:
  language: ko
  text: 그분은 그의 입의 말씀으로 세상을 영원히 다스리실 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “땅”으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 행은 이사야 11:4—입의 말씀으로 판단하고 치는 이상적 통치자—를 반향하는 것으로 보입니다.
    reason: cross_reference
  - marker: c
    text: 또는 “그의 입의 말씀으로 영원히 세상을 치실 것입니다”로도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: κατάξει
  english_pob_choice: will subdue
  chosen_korean: 다스리실 것입니다
  alternatives_korean:
  - 정복하실 것입니다
  - 누르실 것입니다
  - 제압하실 것입니다
  lexicon: LSJ
  rationale: Swete의 κατάξει는 판독상 무력 타격보다 통치·굴복의 결과를 가리키는 방향으로 처리하는 것이 자연스럽고, 한국어에서는 ‘다스리다’가 왕적 권위와 제압의 뉘앙스를 함께 담아 과도한 폭력성을 덜어 주면서도 원문의 힘을 유지합니다.
- source_word: γῆν
  english_pob_choice: earth
  chosen_korean: 세상
  alternatives_korean:
  - 땅
  - 지구
  - 온 땅
  lexicon: LSJ
  rationale: γῆ는 ‘땅/나라/세상’ 모두 가능하지만, 이 절의 왕적·보편적 범위를 살리기 위해 한국어에서는 ‘세상’이 가장 자연스럽고 포괄적입니다.
- source_word: τῷ λόγῳ τοῦ στόματος αὐτοῦ
  english_pob_choice: with the word of his mouth
  chosen_korean: 그의 입의 말씀으로
  alternatives_korean:
  - 그의 입의 말로
  - 입의 말씀으로
  - 그 입에서 나온 말씀으로
  lexicon: LSJ
  rationale: ‘λόγος’와 ‘στόμα’의 결합을 직역하되, 한국어에서는 ‘입의 말씀’이 권위 있는 선포를 간결하게 드러내며, 수단을 나타내는 ‘-로’도 자연스럽게 반영합니다.
- source_word: εἰς αἰῶνα
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 영원토록
  - 끝없이
  lexicon: LSJ
  rationale: εἰς αἰῶνα의 지속성을 현대 한국어의 표준적 종결 표현인 ‘영원히’로 옮겨, 문장의 종말 강조를 유지합니다.
theological_decisions:
- issue: 시편 솔로몬 17:39의 표현이 이사야 11:4의 왕적 심판 이미지를 반향하는지 여부
  chosen_reading: 본문의 직접 이미지를 살려, 말씀이 곧 통치와 심판의 수단이라는 점을 드러내는 번역을 유지했습니다.
  alternative_readings:
  - ‘그의 명령으로 세상을 다스리실 것입니다’처럼 완화된 의역
  - ‘그의 입의 말씀으로 세상을 치실 것입니다’처럼 폭력성을 더 강하게 드러내는 번역
  rationale: 그리스어는 물리적 무기보다 권위 있는 선포에 의한 심판을 보여 주므로, 그 긴장을 유지하는 것이 문맥과 이사야 반향을 함께 보존합니다.
  doctrine_reference: 메시아의 왕적 심판과 말씀의 권위
