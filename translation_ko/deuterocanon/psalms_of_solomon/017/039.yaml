  source_fidelity: 본문의 κατάξει는 인쇄된 Swete 본문대로 κατάγνυμι의 미래형으로 이해하는 것이 우선입니다. 따라서 ‘다스리실 것입니다’는 원문의 파괴적·강제적 동작을 왕적 통치로 완화하여 옮긴 것이며, 충실하지 않습니다. ‘산산이 부수실 것입니다’가 이 형태의 의미를 더 정확히 반영합니다. γῆν은 ‘땅’으로 옮겨 어휘적 범위를 보존합니다.
  naturalness: ‘그분은 입에서 나오는 말씀으로 땅을 영원히 산산이 부수실 것입니다’는 현대 표준어 합쇼체로 자연스럽습니다. ‘입에서 나오는 말씀’은 직역적인 ‘입의 말씀’보다 한국어에서 더 자연스럽지만, 원문의 입/말씀 이미지를 유지합니다.
  terminology: ‘그분’과 ‘말씀’은 존중되고 문학적인 종교 문맥의 어조에 적합합니다. 본문은 특정 교리적 해석인 ‘다스리다’를 피하고, 말에 의한 파괴/심판의 이미지를 보존해야 합니다.
  issues:
