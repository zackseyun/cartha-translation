  chosen_reading: 본문의 직접 이미지를 살려, 말씀이 곧 통치와 심판의 수단이라는 점을 드러내는 번역을 유지했습니다.
  alternative_readings:
  - ‘그의 명령으로 세상을 다스리실 것입니다’처럼 완화된 의역
  - ‘그의 입의 말씀으로 세상을 치실 것입니다’처럼 폭력성을 더 강하게 드러내는 번역
  rationale: 그리스어는 물리적 무기보다 권위 있는 선포에 의한 심판을 보여 주므로, 그 긴장을 유지하는 것이 문맥과 이사야 반향을 함께 보존합니다.
  doctrine_reference: 메시아의 왕적 심판과 말씀의 권위
