lexical_decisions:
- source_word: κατάξει
  english_pob_choice: will subdue
  chosen_korean: 다스리실 것입니다
  alternatives_korean:
  - 정복하실 것입니다
  - 누르실 것입니다
  - 제압하실 것입니다
  lexicon: LSJ
  rationale: Swete의 κατάξει는 판독상 무력 타격보다 통치·굴복의 결과를 가리키는 방향으로 처리하는 것이 자연스럽고, 한국어에서는 ‘다스리다’가 왕적 권위와 제압의 뉘앙스를 함께 담아 과도한 폭력성을 덜어 주면서도 원문의 힘을 유지합니다.
- source_word: γῆν
  english_pob_choice: earth
  chosen_korean: 세상
  alternatives_korean:
  - 땅
  - 지구
  - 온 땅
  lexicon: LSJ
  rationale: γῆ는 ‘땅/나라/세상’ 모두 가능하지만, 이 절의 왕적·보편적 범위를 살리기 위해 한국어에서는 ‘세상’이 가장 자연스럽고 포괄적입니다.
- source_word: τῷ λόγῳ τοῦ στόματος αὐτοῦ
  english_pob_choice: with the word of his mouth
  chosen_korean: 그의 입의 말씀으로
  alternatives_korean:
  - 그의 입의 말로
  - 입의 말씀으로
  - 그 입에서 나온 말씀으로
  lexicon: LSJ
  rationale: ‘λόγος’와 ‘στόμα’의 결합을 직역하되, 한국어에서는 ‘입의 말씀’이 권위 있는 선포를 간결하게 드러내며, 수단을 나타내는 ‘-로’도 자연스럽게 반영합니다.
- source_word: εἰς αἰῶνα
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 영원토록
  - 끝없이
  lexicon: LSJ
  rationale: εἰς αἰῶνα의 지속성을 현대 한국어의 표준적 종결 표현인 ‘영원히’로 옮겨, 문장의 종말 강조를 유지합니다.
theological_decisions:
