base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/039.yaml
  text: For he will subdue the earth forever with the word of his mouth[c][b][a],
  footnotes:
  - marker: a
    text: Or “land” for “earth.”
    reason: lexical_alternative
  - marker: b
    text: This line likely echoes Isaiah 11:4, where the ideal ruler judges and strikes by the word of his mouth.
