    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὰ ἁμαρτήματα αὐτῶν
  english_pob_choice: According to their sins
  chosen_korean: 그들의 죄에 따라
  alternatives_korean:
  - 그들의 죄대로
  - 그들의 죄에 상응하여
  lexicon: BDAG
  rationale: κατά + 대격은 기준·비례를 나타내므로, ‘-에 따라’로 비례성을 살렸습니다.
- source_word: ἀποδώσεις
  english_pob_choice: you will repay
  chosen_korean: 당신께서 ... 갚으실 것입니다
  alternatives_korean:
  - 보상하실 것입니다
  - 되갚으실 것입니다
  lexicon: BDAG
  rationale: 심판적 보응의 미래형이므로 ‘갚다’가 가장 자연스럽고 직접적입니다.
- source_word: ὁ θεός
  english_pob_choice: O God
  chosen_korean: 하나님이시여
  alternatives_korean:
  - 오 하나님
  - 하나님
  lexicon: BDAG
  rationale: 형식상 주격이지만 직접 호소로 기능하므로 한국어 기도체 호격을 살렸습니다.
- source_word: εὑρεθείη
  english_pob_choice: may they be found
  chosen_korean: 그들이 그렇게 판명되게 하십시오
  alternatives_korean:
  - 그들에게서 그렇게 발견되게 하십시오
  - 그들이 그렇게 드러나게 하십시오
  lexicon: BDAG
  rationale: 직역상 ‘그들에게서 발견되다’이지만, 관용적 의미인 ‘그렇게 판명되다/드러나다’를 현대 한국어로 옮겼습니다.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  english_pob_choice: according to their works
  chosen_korean: 그들의 행위에 따라
  alternatives_korean:
  - 그들의 일에 따라
  - 그들의 행실에 따라
  lexicon: BDAG
  rationale: ἔργα를 ‘행위’로 옮겨 보응 공식의 대응 구조를 앞절의 ‘죄’와 평행하게 유지했습니다.
theological_decisions:
- issue: 보응의 비례성과 심판 문맥
  chosen_reading: 죄와 행위에 따라 상응하는 갚음이 주어지는 보응의 진술로 읽었습니다.
  alternative_readings:
  - 단순한 도덕적 원칙 진술
  - 일반적 결과론 진술
  rationale: 두 개의 κατά + 대격이 모두 기준·비례를 나타내어, 문맥상 신적 심판의 공정한 보응을 강조합니다.
  doctrine_reference: 성경의 응보/심판 진술
