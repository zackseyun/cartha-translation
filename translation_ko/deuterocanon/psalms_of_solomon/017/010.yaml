translation:
  language: ko
  text: 그들의 죄에 따라 당신께서 그들에게 갚으실 것입니다, 하나님이시여 — 그들의 행위에 따라 그들이 그렇게 판명되게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
