    rationale: 영어 POB의 판단과 문맥 모두 통치자의 신뢰할 만한 행위를 가리키는 ‘신실함’을 지지합니다. ‘믿음으로’는 각주에서 가능한 대안으로 남길 수 있습니다.
  - severity: low
