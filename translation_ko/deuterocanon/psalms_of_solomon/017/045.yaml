  yaml_path: translation/deuterocanon/psalms_of_solomon/017/045.yaml
  text: Shepherding the Lord’s flock in faithfulness and righteousness[d][c][b][a], he will not allow any among them to grow weak in their pasture.
  footnotes:
  - marker: a
    text: Or “in faith”; the Greek πίστει can denote either faith or faithfulness, and here the latter fits the ruler’s manner of shepherding more naturally.
    reason: lexical_alternative
  - marker: b
    text: Or “justice” for “righteousness.”
    reason: lexical_alternative
  - marker: c
    text: Or “will not allow any of them to become weak in their pasturage.”
    reason: lexical_alternative
  - marker: d
    text: Or 'Shepherding the Lord’s flock with faithfulness and righteousness, he will not allow'.
    reason: previous_rendering
translation:
  language: ko
  text: '[d]주님의 양 떼를 신실함[a]과 의[b]로 돌보시며, 그들 가운데 어느 누구도 그들의 목초지에서 약해지게 두지 않으실 것입니다.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “믿음으로.” 그리스어 πίστει는 “믿음” 또는 “신실함”을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “정의.”
    reason: lexical_alternative
  - marker: c
    text: 또는 “그들 가운데 어느 누구도 그들의 목초지에서 약해지게 허락하지 않으실 것입니다.”
    reason: lexical_alternative
  - marker: d
    text: 또는 “그는 주님의 양 떼를 신실함과 의로 돌보실 것이며, 그들 가운데 어느 누구도 약해지게 두지 않으실 것입니다.”
    reason: previous_rendering
lexical_decisions:
- source_word: ποιμαίνων
  english_pob_choice: Shepherding
  chosen_korean: 돌보시며
  alternatives_korean:
  - 양을 치시며
  - 목자처럼 다스리시며
  - 보살피시며
  lexicon: LSJ
  rationale: 분사 ποιμαίνων은 단순한 먹임보다 목자적 통치와 돌봄의 이미지를 담고 있어, 한국어에서는 자연스럽게 동작을 이어 주는 ‘돌보시며’로 옮겼습니다.
- source_word: πίστει
  english_pob_choice: faithfulness
  chosen_korean: 믿음
  alternatives_korean:
  - 신실함
  - 믿음으로
  - 신뢰
  lexicon: LSJ
  rationale: 영어 POB는 문맥상 ‘faithfulness’를 택했지만, 그리스어 πίστει 자체는 믿음/신실함 모두 가능하므로, 본문 의미를 과도하게 좁히지 않는 표준어 ‘믿음과 의로’로 처리했습니다.
- source_word: δικαιοσύνῃ
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 정의
  lexicon: LSJ
  rationale: δικαιοσύνῃ는 이 시편적-왕권적 문맥에서 윤리적 올바름과 언약적 공정을 함께 가리키므로, POB의 ‘righteousness’를 한국어 성경의 기본어인 ‘의’로 옮겼습니다.
- source_word: νομῇ
  english_pob_choice: pasture
  chosen_korean: 풀밭
  alternatives_korean:
  - 목장
  - 초지
  - 먹이 터
  lexicon: LSJ
  rationale: νομῇ는 목축적 은유의 장소를 가리키므로, ‘풀밭’이 이미지와 문맥을 가장 직접적으로 살립니다.
theological_decisions:
- issue: πίστει를 ‘믿음’으로 유지할지 ‘신실함’으로 좁힐지
  chosen_reading: 본문에는 ‘믿음과 의’라고 두어, 왕적 목자의 통치가 신실성만이 아니라 하나님 앞의 믿음 안에서 이루어짐을 열어 둡니다.
  alternative_readings:
  - ‘신실함과 의’
  - ‘믿음으로’
  rationale: POB의 영어 선택은 문맥상 ‘faithfulness’이지만, 그리스어는 양의적입니다. 한국어에서 한쪽만 확정하면 문맥의 긴장을 지울 수 있으므로, 의미 범위를 보존하는 쪽을 택했습니다.
  doctrine_reference: 시편적 왕권과 메시아 통치의 성격
