  - severity: medium
    issue: ἐν ἐπισήμῳ의 장소성이 ‘온 땅이 보는 앞에서’에서 약화됨
    rationale: 원문은 ἐν(‘~에서’)과 명사화된 ἐπισήμῳ를 사용합니다. 공개성을 나타내되 ‘곳’이라는 장소 지시를 보존하는 것이 안전합니다.
