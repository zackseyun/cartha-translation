  text: And he will have peoples of the nations serve him under his yoke[d][c][b][a], and he will glorify the Lord in a place conspicuous to all the earth.
  footnotes:
  - marker: a
    text: Or 'in a place renowned in all the earth.' The Greek phrase with ἐπισήμῳ can emphasize notable prominence or renown.
