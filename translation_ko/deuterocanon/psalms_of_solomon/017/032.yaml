base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/032.yaml
  text: And he will have peoples of the nations serve him under his yoke[d][c][b][a], and he will glorify the Lord in a place conspicuous to all the earth.
  footnotes:
  - marker: a
    text: Or 'in a place renowned in all the earth.' The Greek phrase with ἐπισήμῳ can emphasize notable prominence or renown.
    reason: lexical_alternative
  - marker: b
    text: Or 'have the peoples of the nations serve as subjects under his yoke.'
    reason: lexical_alternative
  - marker: c
    text: Or 'have the peoples of the nations serve him'.
    reason: previous_rendering
  - marker: d
    text: Or 'in a place distinguished above all the earth'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그분은 여러 민족의 백성들을 자기의 멍에 아래에서 섬기게 하시고, 온 땅이 보는 앞에서 주님을 영화롭게 하실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “온 땅에 유명한 곳에서.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “여러 민족의 백성들을 그의 멍에 아래에서 섬기게 하시고.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕξει
  english_pob_choice: he will have
  chosen_korean: 그분은 ... 하실 것입니다
  alternatives_korean:
  - 그분은 ... 가지실 것입니다
  - 그분은 ... 두실 것입니다
  lexicon: LSJ
  rationale: ἔχω의 미래로서 ‘가지다/두다’의 소유 개념을 살리되, 뒤의 목적보어 구조를 한국어로 자연스럽게 풀어 ‘...하게 하시고’로 옮겼습니다.
- source_word: λαοὺς ἐθνῶν
  english_pob_choice: peoples of the nations
  chosen_korean: 여러 민족의 백성들
  alternatives_korean:
  - 민족들의 백성들
  - 이방 민족들의 백성들
  lexicon: LSJ
  rationale: λαοὺς와 ἐθνῶν의 이중 표현을 둘 다 살려, 민족성과 집단성을 함께 드러내는 ‘여러 민족의 백성들’로 옮겼습니다.
- source_word: δουλεύειν
  english_pob_choice: serve
  chosen_korean: 섬기게 하시고
  alternatives_korean:
  - 노예가 되게 하시고
  - 종속되게 하시고
  - 복종하게 하시고
  lexicon: LSJ
  rationale: 동사는 단순 봉사보다 지배 아래의 종속을 포함하므로, 멍에 이미지와 결합된 강한 복종성을 살리면서도 본문 전체의 문체를 과도하게 무겁게 하지 않도록 ‘섬기게 하다’로 옮겼습니다.
- source_word: ἐν ἐπισήμῳ πάσης τῆς γῆς
  english_pob_choice: in a place conspicuous to all the earth
  chosen_korean: 온 땅이 보는 앞에서
  alternatives_korean:
  - 온 땅에 알려진 곳에서
  - 온 땅에 드러난 곳에서
  - 온 땅에 유명한 곳에서
  lexicon: LSJ
  rationale: ἐπίσημος의 핵심인 ‘드러남/두드러짐’을 공간적으로 자연스럽게 풀어, ‘온 땅’에 대하여 눈앞에 선명히 드러나는 장면을 표현했습니다.
theological_decisions:
- issue: κύριος의 호칭 처리
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 주인
  rationale: 본문의 κύριος는 하나님을 가리키는 존칭이므로, 한국어 독자에게도 예배적·경칭적 뉘앙스를 유지하는 ‘주님’이 가장 적절합니다.
  doctrine_reference: 하나님 호칭의 경외성 유지
