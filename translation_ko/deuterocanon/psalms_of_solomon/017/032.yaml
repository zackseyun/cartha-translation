revisions:
- from: 그리고 그분은 여러 민족의 백성들을 자기의 멍에 아래에서 섬기게 하시고, 온 땅이 보는 앞에서 주님을 영화롭게 하실 것입니다.[a][b]
  to: 그리고 그분은 여러 민족의 백성을 그분의 멍에 아래에서 그분을 섬기게 하실 것이며, 온 땅에 널리 드러난 곳에서 주님을 영화롭게 하실 것입니다.[a][b]
  rationale: αὐτῷ의 수혜·대상 관계를 ‘그분을’으로 명시하고, ἐν ἐπισήμῳ πάσης τῆς γῆς의 장소성과 두드러짐을 ‘온 땅에 널리 드러난 곳에서’로 보존했습니다. 원문의 미래 시제, 멍에의 비유, 주님이라는 호칭은 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:09:57Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 절의 αὐτῷ(‘그분을/그에게’)가 한국어 본문에서 명시되지 않아 ‘섬기다’의 대상이 불분명합니다. 또한 ἐν ἐπισήμῳ는 장소를 가리키는 명사화된 표현이므로, ‘온 땅이 보는 앞에서’보다 장소성을 보존하는 번역이 더 충실합니다.
  naturalness: ‘온 땅에 널리 드러난 곳에서’는 현대 표준 한국어에서 자연스럽고, 원문의 두드러짐과 공공성을 함께 나타냅니다. ‘그분을 섬기게 하실 것이며’는 한국어에서 지배·복속의 문맥을 자연스럽게 표현합니다.
  terminology: κύριον은 ‘주님’으로 적절히 옮겼습니다. ζυγός의 비유는 ‘멍에’로 유지했습니다. λαοὺς ἐθνῶν은 ‘여러 민족의 백성’을 사용하여 복수 집단의 의미를 보존했습니다.
  issues:
