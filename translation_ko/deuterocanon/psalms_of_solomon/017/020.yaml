revisions:
- from: 경건한 자들의 모임을 사랑하던 자들은 그들로부터 도망하였고, 불법한 자들로 말미암아 그들의 흩어짐은 온 땅에 퍼졌습니다. 하늘이 땅에 비를 떨어뜨리는 것을 멈추었기 때문입니다.[a][b][c][d][e]
  to: 경건한 자들의 모임[a][b]을 사랑하던 자들은 그 모임들로부터 도망하였고, 무법한 자들 때문에 그들은 온 땅에 흩어졌습니다[c][e]. 하늘이 땅에 비를 내리기를 그쳤기 때문입니다[d].
  rationale: ‘경건한 자들’과 ‘모임’은 유지했습니다. 행위자 관계와 현대 한국어의 자연스러움을 위해 ‘무법한 자들 때문에 그들은 … 흩어졌습니다’로 고쳤고, 강우 억제의 의미는 ‘비를 내리기를 그쳤기’로 옮겼습니다. 각주 표지는 해당 번역어에 직접 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:09:58Z'
