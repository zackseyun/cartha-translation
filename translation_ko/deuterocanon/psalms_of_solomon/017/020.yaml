translation:
  language: ko
  text: 경건한 자들의 모임[a][b]을 사랑하던 자들은 그 모임들로부터 도망하였고, 무법한 자들 때문에 그들은 온 땅에 흩어졌습니다[c][e]. 하늘이 땅에 비를 내리기를 그쳤기 때문입니다[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘회집’이나 ‘집회’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘거룩한 자들’, ‘성도들’, 또는 ‘신실한 이들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘그들의 흩어짐’입니다. 또는 ‘분산’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 직역하면 ‘비를 방울져 내리게 하는 것을’입니다.
    reason: lexical_alternative
  - marker: e
    text: 본문은 그들이 무법한 자들의 행위 때문에 흩어졌다고 말합니다.
    reason: source_note
lexical_decisions:
- source_word: συναγωγὰς
  english_pob_choice: assemblies
  chosen_korean: 모임
  alternatives_korean:
  - 회집
  - 모임들
  - 집회
  lexicon: LSJ
  rationale: ὁσίων과 결합된 집합적 장소/공동체를 한국어에서 자연스럽게 살리면서, 후대 제도적 의미가 강한 '회당'은 피했습니다.
- source_word: ὁσίων
  english_pob_choice: the pious
  chosen_korean: 경건한 자들
  alternatives_korean:
  - 거룩한 자들
  - 성도들
  - 신실한 이들
  lexicon: LSJ
  rationale: 이 문맥의 ὅσιοι는 공동체적·윤리적 의미의 '경건한 이들'을 가리키므로, 전통적 '성도'보다 직접적으로 옮겼습니다.
- source_word: σκορπισμὸς
  english_pob_choice: scattering
  chosen_korean: 흩어짐
  alternatives_korean:
  - 분산
  - 디아스포라
  - 흩어짐의 상태
  lexicon: LSJ
  rationale: 사람들이 흩어진 상태를 간결하게 드러내는 말로 '흩어짐'을 택했고, 기술적인 음차식 표현은 피했습니다.
- source_word: ἀνόμων
  english_pob_choice: lawless men
  chosen_korean: 불법한 자들
  alternatives_korean:
  - 법 없는 자들
  - 무법한 자들
  - 악한 자들
  lexicon: LSJ
  rationale: 주어는 사람들을 가리키므로 '자들'을 살렸고, ἄνομος의 법적·도덕적 대립을 '불법한'으로 유지했습니다.
- source_word: στάξαι ὑετὸν
  english_pob_choice: from dripping rain
  chosen_korean: 비를 떨어뜨리는 것
  alternatives_korean:
  - 비를 흘리는 것
  - 비를 내리는 것
  - 비가 떨어지게 하는 것
  lexicon: LSJ
  rationale: στάζω의 구체적 이미지인 '떨어뜨리다/방울지게 하다'를 보존하되, 한국어에서는 문맥상 자연스러운 '비를 떨어뜨리는 것'으로 옮겼습니다.
theological_decisions:
- issue: ὅσιοι의 공동체 정체성
  chosen_reading: '''경건한 자들''로 옮겨, 단순한 일반적 도덕성보다 특정 공동체의 경건성과 충성의 뉘앙스를 드러냈습니다.'
  alternative_readings:
  - 거룩한 자들
  - 성도들
  - 신실한 이들
  rationale: Psalms of Solomon에서 ὅσιοι는 특정 종교·사회적 집단을 가리키는 용법이므로, 한국어에서도 그 집단성을 유지하는 번역이 필요합니다.
  doctrine_reference: 문맥 주석상 용례 구분(ὅσιοι vs ἅγιοι)
