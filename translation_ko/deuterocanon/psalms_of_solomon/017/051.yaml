  text: May God hasten his mercy upon Israel[a]. He will rescue us from the uncleanness of profane enemies[c][b]. The Lord himself is our king forever and ever.
  footnotes:
  - marker: a
    text: 'The opening Greek uses an infinitive (''to hasten''), which is rendered idiomatically here as a prayer-like wish: ''May God hasten...'''
