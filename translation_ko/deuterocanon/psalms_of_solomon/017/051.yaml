base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/051.yaml
  text: May God hasten his mercy upon Israel[a]. He will rescue us from the uncleanness of profane enemies[c][b]. The Lord himself is our king forever and ever.
  footnotes:
  - marker: a
    text: 'The opening Greek uses an infinitive (''to hasten''), which is rendered idiomatically here as a prayer-like wish: ''May God hasten...'''
    reason: alternative_reading
  - marker: b
    text: Or 'defilement' instead of 'uncleanness.'
    reason: lexical_alternative
  - marker: c
    text: Or 'impious enemies' instead of 'profane enemies.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서 이스라엘에게 그의 긍휼을 속히 베푸시기를 바랍니다[a]. 그분은 우리를 불경한 원수들의 더러움에서 건져 주실 것입니다[b][c]. 주님 자신이 우리의 왕이시니, 영원히, 또 그 이상까지 그러하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 머리말 ταχύναι는 직설적 서술보다 기원/청원의 뉘앙스를 띠므로, 한국어에서는 자연스러운 기원문으로 옮겼습니다.
    reason: source_note
  - marker: b
    text: ἀκαθαρσία는 ‘더러움’뿐 아니라 정결-부정의 ‘부정함/부정예’도 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: βεβήλων은 ‘불경한’ 외에 ‘속된, 신성모독적인, 경건하지 않은’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταχύναι
  english_pob_choice: May God hasten
  chosen_korean: 하나님께서 … 속히 베푸시기를 바랍니다
  alternatives_korean:
  - 하나님께서 … 서둘러 베푸시기를 바랍니다
  - 하나님께서 … 속히 하시기를 바랍니다
  lexicon: LSJ / contextual idiom
  rationale: 머리의 부정사형 기원을 한국어로 그대로 옮기면 어색하므로, 기원문형으로 풀되 ‘속히’로 긴급성을 살렸습니다.
- source_word: ἔλεος
  english_pob_choice: mercy
  chosen_korean: 긍휼
  alternatives_korean:
  - 자비
  - 은혜
  lexicon: BDAG / LXX usage
  rationale: 하나님의 구원적 호의를 가리키는 문맥이므로, 단순한 감정적 ‘자비’보다 성서적 용례가 선명한 ‘긍휼’이 더 적절합니다.
- source_word: ἀκαθαρσίας ἐχθρῶν βεβήλων
  english_pob_choice: the uncleanness of profane enemies
  chosen_korean: 불경한 원수들의 더러움
  alternatives_korean:
  - 불경한 원수들의 부정함
  - 속된 원수들의 더러움
  lexicon: BDAG / LXX purity language
  rationale: ἀκαθαρσία의 정결-부정 어휘를 살리면서도 현대 한국어에서 자연스럽게 읽히도록 ‘더러움’으로 옮겼습니다.
- source_word: Κύριος αὐτὸς βασιλεὺς ἡμῶν
  english_pob_choice: The Lord himself is our king
  chosen_korean: 주님 자신이 우리의 왕이시니
  alternatives_korean:
  - 주님 그분이 우리의 왕이시니
  - 주님은 친히 우리의 왕이십니다
  lexicon: BDAG
  rationale: αὐτὸς의 강조를 ‘자신이/친히’로 살렸고, 왕권 진술은 선언문체에 맞게 합쇼체로 처리했습니다.
theological_decisions:
- issue: κύριος의 신학적 호칭 처리
  chosen_reading: 문맥상 하나님을 가리키는 κύριος를 ‘주님’으로 번역해 하나님의 왕권 고백을 분명히 했습니다.
  alternative_readings:
  - ‘주’로 단순화
  - ‘주인’으로 직역
  rationale: 시편적 찬양·고백 문맥에서는 예수 호칭과 구별되는 하나님의 주권 고백이므로, 한국어 교회 용례와 문맥을 함께 고려해 ‘주님’이 가장 자연스럽습니다.
  doctrine_reference: 하나님 주권 / 시편적 왕권 고백
- issue: ἔτι의 종결 강도
  chosen_reading: ‘영원히, 또 그 이상까지’로 옮겨 αἰῶνα를 넘어서는 지속성을 드러냈습니다.
  alternative_readings:
  - ‘영원히’
  - ‘영원하고 또 영원히’
  rationale: εἰς τὸν αἰῶνα καὶ ἔτι는 단순한 무기한 지속보다 더 강한 확장성을 갖기 때문에, 한국어에서도 그 중첩 강도를 보존했습니다.
  doctrine_reference: 하나님의 영원한 통치
