  source_fidelity: 첫 문장의 기원적 부정사와 미래형 ῥύσεται, αὐτός의 강조, 그리고 지속을 강화하는 εἰς τὸν αἰῶνα καὶ ἔτι를 전반적으로 반영하려는 방향은 적절합니다. 그러나 ‘바랍니다’는 번역자의 개인적 희망을 표지하여 본문의 기원적 외침보다 한 단계 약하고, 마지막 ‘또 그 이상까지 그러하십니다’는 원문의 왕권 선언을 불필요하게 우회하며 ‘그 이상’이라는 공간적·개념적 확장을 덧붙입니다.
  naturalness: ‘하나님께서 … 베푸시기를!’은 현대 한국어의 격식 있는 기원문으로 자연스럽고, ‘주님 친히 우리의 왕이십니다’는 강조와 합쇼체를 모두 살립니다. 정결 어휘인 ἀκαθαρσία에는 ‘더러움’보다 ‘부정함’이 더 정확하면서도 현대 독자에게 이해 가능합니다.
  terminology: ἔλεος는 ‘긍휼’, Κύριος는 ‘주님’으로 유지할 수 있습니다. ἀκαθαρσία는 정결/부정의 의미장을 보존하도록 ‘부정함’으로, βεβήλων은 문맥상 ‘불경한’으로 옮깁니다. 각주 b의 ‘부정예’는 명백한 오기이므로 ‘부정함’으로 바로잡아야 합니다.
