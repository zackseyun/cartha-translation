    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서 이스라엘 위에 그의 긍휼을 속히 베푸시기를![a] 그분은 우리를 불경한 원수들의 부정함에서 건져 주실 것입니다.[b][c] 주님 친히 우리의 왕이십니다, 영원히 또 영원히.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 문두의 ταχύναι는 부정사이지만, 여기서는 직설적 서술보다 기원 또는 청원의 뉘앙스를 띠므로 한국어에서 기원문으로 옮겼습니다.
    reason: source_note
  - marker: b
    text: ἀκαθαρσία는 ‘부정함’ 외에 ‘더러움’ 또는 ‘불결함’으로도 옮길 수 있으며, 정결과 부정의 의미를 지닙니다.
    reason: lexical_alternative
  - marker: c
    text: βεβήλων은 ‘불경한’ 외에 ‘속된’, ‘신성모독적인’, 또는 ‘경건하지 않은’으로도 옮길 수 있습니다.
    reason: lexical_alternative
