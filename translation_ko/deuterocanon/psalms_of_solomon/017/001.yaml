base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/001.yaml
  text: O Lord[a], you are our King forever and ever; for in you, our God[b], our soul will boast.
  footnotes:
  - marker: a
    text: Or 'forevermore' or more literally 'for the age and further.'
    reason: lexical_alternative
  - marker: b
    text: Or 'will glory' or 'will exult in you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 주님은 영원무궁토록 우리의 왕이십니다. 우리의 하나님, 주님 안에서 우리의 영혼이 자랑할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영원무궁토록’의 더 문자적인 표현으로는 ‘그 세대와 그 이후까지’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자랑할 것입니다’의 의미로 ‘영광을 돌릴 것입니다’, ‘주님 안에서 기뻐뛸 것입니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  english_pob_choice: O Lord
  chosen_korean: 주님
  alternatives_korean:
  - 오 주님
  - 주여
  lexicon: BDAG
  rationale: 하나님께 직접 부르는 호격이므로 ‘주님’으로 옮기고, 현대 합쇼체에서 자연스러운 직접 호소는 따로 감탄형 ‘오’를 덧붙이지 않는 편이 더 간결합니다.
- source_word: Βασιλεὺς ἡμῶν
  english_pob_choice: our King
  chosen_korean: 우리의 왕
  alternatives_korean:
  - 우리의 통치자
  - 우리의 주권자
  lexicon: BDAG
  rationale: 왕권 고백을 직접 살리는 기본 의미를 따라 ‘왕’으로 옮겼습니다. 더 넓은 표현은 본문의 왕권 이미지를 약화시킵니다.
- source_word: εἰς τὸν αἰῶνα καὶ ἔτι
  english_pob_choice: forever and ever
  chosen_korean: 영원무궁토록
  alternatives_korean:
  - 영원히 그리고 더
  - 세세토록
  lexicon: BDAG
  rationale: ‘세상 끝까지’가 아니라 지속의 강조이므로, καὶ ἔτι의 증강을 살리는 한국어 관용 ‘영원무궁토록’이 가장 자연스럽고 힘이 있습니다.
- source_word: καυχήσεται
  english_pob_choice: will boast
  chosen_korean: 자랑할 것입니다
  alternatives_korean:
  - 자부할 것입니다
  - 기뻐하며 자랑할 것입니다
  lexicon: BDAG
  rationale: 이 동사는 단순한 자기평가가 아니라 ‘자랑하다/뽐내다’의 의미를 가지므로, 본문의 신앙적 자긍심을 살려 ‘자랑하다’로 옮겼습니다.
theological_decisions:
- issue: ‘우리의 영혼’의 집합적 단수 표현
  chosen_reading: ‘우리의 영혼’으로 직역해 공동체적 단수의 이미지를 유지했습니다.
  alternative_readings:
  - ‘우리가’
  - ‘우리의 삶’
  rationale: 히브리/헬라어에서 흔한 집합적 단수의 수사이므로, 주체를 평탄화하지 않고 본문의 시적 긴장과 공동체성을 보존합니다.
  doctrine_reference: 시편적 집합체 발화의 시적 수사
