    reason: source_note
lexical_decisions:
- source_word: ἔθνη
  english_pob_choice: nations
  chosen_korean: 민족들
  alternatives_korean:
  - 나라들
  - 이방 민족들
  lexicon: BDAG
  rationale: ἔθνη는 여기서 이스라엘 바깥의 여러 집단을 가리키므로, 문맥상 자연스럽고 신학적 대비를 과도하게 좁히지 않는 ‘민족들’이 적절합니다.
- source_word: ἀπ’ ἄκρου τῆς γῆς
  english_pob_choice: from the end of the earth
  chosen_korean: 땅 끝에서
  alternatives_korean:
  - 땅의 끝에서
  - 땅 끝까지에서
  lexicon: BDAG
  rationale: 지리적 극한 거리를 나타내는 관용구이므로, 한국어에서도 압축적이고 관용적인 ‘땅 끝에서’로 옮기면 원문의 효과를 살릴 수 있습니다.
- source_word: φέροντες δῶρα
  english_pob_choice: bringing her weakened sons as gifts
  chosen_korean: …를 예물로 바치는
  alternatives_korean:
  - …를 예물로 가져오는
  - …를 선물로 드리는
  lexicon: BDAG
  rationale: δῶρα가 단순히 동반되는 것이 아니라 바쳐지는 대상처럼 보이므로, ‘예물로 바치는’이 행위의 헌납성을 가장 잘 드러냅니다.
- source_word: τοὺς ἐξησθενηκότας υἱοὺς αὐτῆς
  english_pob_choice: her weakened sons
  chosen_korean: 연약해진 그의 아들들
  alternatives_korean:
  - 힘이 쇠한 그의 아들들
  - 지쳐버린 그의 아들들
  lexicon: BDAG
  rationale: 완료 분사는 이미 그렇게 된 상태를 나타내므로, 결과 상태를 보존하는 ‘연약해진’이 적절하며, υἱοὺς는 남성 복수형을 살려 ‘아들들’로 옮깁니다.
theological_decisions:
- issue: '문장 구조: 목적/결과 부정사 ἔρχεσθαι와 ἰδεῖν의 처리'
  chosen_reading: 한국어에서는 독립 예언문보다 목적/결과를 나타내는 부정사 구조를 살려 ‘와서 … 보고’로 옮겼습니다.
  alternative_readings:
  - ‘민족들이 올 것이며 … 볼 것이다’
  - ‘민족들이 와서 … 보게 될 것이다’
  rationale: 본문은 앞 절과 연결되는 부정사 구문이므로, 서술적 미래형으로 바꾸면 문법적 연쇄가 약해집니다. ‘와서 … 보고’는 원문의 종속성을 유지합니다.
  doctrine_reference: 헬라어 통사론
