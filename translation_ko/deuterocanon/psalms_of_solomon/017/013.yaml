translation:
  language: ko
  text: 법을 저버린 자가 우리 땅을 주민이 없도록 황폐하게 하였으며, 그들은 젊은이와 노인과 그 자녀들을 함께 없애 버렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 앞부분에서 단수 동사(‘황폐하게 하였다’)를 쓰다가, 뒷부분에서 복수 동사(‘그들은 없애 버렸다’)로 바뀝니다. 번역은 이 전환을 그대로 나타냅니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἠρήμωσεν
  english_pob_choice: laid waste
  chosen_korean: 황폐하게 하여
  alternatives_korean:
  - 폐허로 만들며
  - 황무지로 만들며
  lexicon: BDAG
  rationale: 땅을 사람이 살 수 없게 파괴하는 강한 뜻을 자연스러운 현대 한국어로 옮기면서, 결과 상태인 황폐함을 분명히 드러냅니다.
- source_word: ὁ ἄνομος
  english_pob_choice: the lawless one
  chosen_korean: 불법한 자
  alternatives_korean:
  - 율법 없는 자
  - 악한 자
  lexicon: BDAG
  rationale: 단수 관사와 함께 쓰인 ἄνομος의 인격화된 뉘앙스를 살리되, ‘법/율법을 무시하는 자’라는 직접성을 유지합니다.
- source_word: ἀπὸ ἐνοικούντων αὐτὴν
  english_pob_choice: emptying it of its inhabitants
  chosen_korean: 거주자들이 없게 하였으며
  alternatives_korean:
  - 그 땅에 사는 사람들을 몰아내며
  - 그 안에 거주하던 자들을 비워
  lexicon: BDAG
  rationale: 직역하면 어색하므로, 땅에서 주민이 사라지게 된 결과를 한국어로 분명하고 간결하게 표현했습니다.
- source_word: ἠφάνισαν
  english_pob_choice: wiped out
  chosen_korean: 멸망시켰습니다
  alternatives_korean:
  - 지워 버렸습니다
  - 없애 버렸습니다
  lexicon: BDAG
  rationale: 사람들을 완전히 파괴했다는 강한 의미를 담되, 번역 전체의 격식에 맞는 문체를 유지합니다.
theological_decisions:
- issue: ἠρήμωσεν은 단순한 ‘파괴’보다 땅의 황폐화와 주민 축출을 함께 포함합니다.
  chosen_reading: ‘황폐하게 하여, 거주자들이 없게 하였으며’로 두 동작을 나누어 결과를 드러냈습니다.
  alternative_readings:
  - ‘폐허로 만들고 주민을 없앴습니다’처럼 한 문장으로 압축
  - ‘황폐하게 했습니다’만으로 단순화
  rationale: 시편의 평행적이고 묘사적인 힘을 살리기 위해, 파괴와 무주화(無住化)를 분리해 읽는 것이 본문의 의도를 더 잘 전달합니다.
  doctrine_reference: 본문 의미 보존과 시적 병행성
- issue: ἠφάνισαν의 주어가 복수로 전환되지만 한국어는 이를 표면에 드러내지 않았습니다.
  chosen_reading: 한국어 본문은 ‘멸망시켰습니다’로 처리하되, 문장 전체의 주어 일관성을 유지했습니다.
  alternative_readings:
  - 영문 POB처럼 ‘그들은…’으로 복수 전환을 강조
  - 주어 변화를 각주로 표시
  rationale: 원문에는 주어 전환이 있지만, 한국어에서는 반복 주어를 넣지 않아도 의미가 전달되므로 본문 가독성을 우선했습니다.
  doctrine_reference: 본문 문법 재현과 한국어 자연성
