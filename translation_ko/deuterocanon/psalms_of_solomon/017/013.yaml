  text: The lawless one laid waste our land, emptying it of its inhabitants; they wiped out young and old, and their children together.
  footnotes:
  - marker: a
    text: The Greek shifts from singular ('the lawless one') to a plural verb ('they wiped out'). The translation preserves this change rather than smoothing it away.
