  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: lxx-swete-1909
  text: καὶ οὐκ ἐδόξασαν τὸ ὄνομά σου τὸ ἔντιμον· ἐν δόξῃ ἔθεντο βασίλειον ἀντὶ ὕψους αὐτῶν,
  language: Greek
