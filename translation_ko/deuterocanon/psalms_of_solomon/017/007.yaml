    rationale: ἐν δόξῃ의 외적 위세·화려함의 뉘앙스를 ‘화려하게’로 옮기면 자연스럽고 신적 영광과의 불필요한 연상을 줄일 수 있습니다.
  revised_text: 그들은 주님의 존귀한 이름을 영화롭게 하지 않았습니다. 그들은 화려하게 자신들의 높아짐 대신 왕국을 세웠습니다[a].
