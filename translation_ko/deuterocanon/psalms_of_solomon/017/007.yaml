base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/007.yaml
  text: And they did not glorify your honored name[a]; in splendor they set up a kingdom because of their arrogance,
  footnotes:
  - marker: a
    text: Or 'in place of their own exaltation'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 주님의 존귀한 이름을 영화롭게 하지 않았습니다. 그들은 화려하게 자신들의 높아짐 대신 왕국을 세웠습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 교만 때문에’.
    reason: ἀντὶ ὕψους αὐτῶν은 직역하면 ‘그들의 높아짐 대신’이며, 문맥에 따라 그들의 자기고양 또는 교만을 가리켜 인과적으로 이해하기도 합니다.
lexical_decisions:
- source_word: οὐκ ἐδόξασαν
  english_pob_choice: did not glorify
  chosen_korean: 영화롭게 하지 않았습니다
  alternatives_korean:
  - 존귀하게 여기지 않았습니다
  - 영광을 돌리지 않았습니다
  lexicon: LSJ
  rationale: δοξάζω는 영광과 존귀를 돌리는 행위를 가리키므로, 현대 한국어에서 자연스럽고 행위의 강도를 살리는 ‘영화롭게 하다’를 택했습니다.
- source_word: τὸ ὄνομά σου τὸ ἔντιμον
  english_pob_choice: your honored name
  chosen_korean: 주님의 존귀한 이름
  alternatives_korean:
  - 주님의 명예로운 이름
  - 주님의 귀히 여김받는 이름
  lexicon: LSJ
  rationale: ἔντιμος는 ‘존귀한, 귀히 여겨지는’의 뜻이므로 ‘존귀한 이름’이 가장 सीधे이며, 2인칭 대명사는 문맥상 하나님께 대한 호칭으로 풀었습니다.
- source_word: ἐν δόξῃ
  english_pob_choice: in splendor
  chosen_korean: 영광 가운데
  alternatives_korean:
  - 화려하게
  - 영화 속에
  lexicon: LSJ
  rationale: δόξα는 여기서 외적 위세와 찬란함의 뉘앙스를 가지므로, 하나님의 영광과 혼동하지 않도록 ‘영광 가운데’로 옮겼습니다.
- source_word: ἀντὶ ὕψους αὐτῶν
  english_pob_choice: because of their arrogance
  chosen_korean: 교만 때문에
  alternatives_korean:
  - 그들의 높아짐 대신
  - 그들의 높음으로 인해
  lexicon: LSJ
  rationale: 이 구절은 단순한 ‘대신’보다 원인·동기의 의미가 살아 있어야 하므로, 문맥상 ‘교만’으로 풀어 원인 관계를 분명히 했습니다.
theological_decisions:
- issue: ὕψος의 의미를 ‘높아짐’으로 직역할지 ‘교만’으로 해석할지
  chosen_reading: 문맥상 지배자들의 자기고양을 가리키는 ‘교만’으로 옮겼습니다.
  alternative_readings:
  - 그들의 높아짐
  - 그들의 고양됨
  rationale: 앞뒤 문맥이 폭력적 찬탈을 말하므로, 단순한 신체적/지위적 ‘높음’보다 윤리적·신학적 함의인 교만이 더 분명합니다.
  doctrine_reference: 시편과 지혜문학의 교만-낮아짐 주제
- issue: ‘왕국을 세웠습니다’의 주체적 뉘앙스
  chosen_reading: 불법적 자치권의 설정을 드러내는 표현으로 유지했습니다.
  alternative_readings:
  - 왕권을 세웠습니다
  - 왕권을 확립했습니다
  rationale: βασίλειον은 추상적 왕권보다 실제적인 왕국/통치 체제를 가리킬 수 있어, 역사적 찬탈의 의미를 살려 ‘왕국’을 택했습니다.
  doctrine_reference: 메시아적 왕권과 불의한 찬탈 대비
