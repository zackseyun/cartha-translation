    issue: ἀντὶ ὕψους αὐτῶν을 ‘교만 때문에’로 확정함
    rationale: 그리스어 ἀντί는 기본적으로 대치·대신의 관계를 나타내며, ὕψος도 ‘높이, 고양됨, 높은 지위’의 범위를 지닙니다. 인과적 ‘때문에’와 윤리적 ‘교만’은 문맥상 가능한 해석일 수 있으나 본문 번역에서 확정하면 원문의 모호성을 잃습니다.
