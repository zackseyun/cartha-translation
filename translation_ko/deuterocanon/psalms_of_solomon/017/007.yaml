  source_fidelity: 현 번역의 ‘교만 때문에’는 ἀντὶ(‘~ 대신에, ~에 맞서’)를 인과로 바꾸고 ὕψος를 ‘교만’으로 확정합니다. 이는 제시된 그리스어 본문 자체의 압축적·다의적인 표현을 넘어선 해석입니다. ‘자신들의 높아짐 대신’으로 옮기고, 인과적 해석은 각주로 보존하는 편이 안전합니다.
  naturalness: ‘영광 가운데’는 한국어에서 다소 부자연스럽고 신적 영광을 연상시킬 수 있습니다. 여기서는 외적 위세를 나타내는 ‘화려하게’가 자연스럽습니다. ‘영화롭게 하지 않았습니다’는 문어적이지만 현대 정중체 성경 문체에서 자연스럽습니다.
  terminology: ‘주님의 존귀한 이름’, ‘영화롭게 하다’, ‘왕국’은 적절합니다. ὕψος는 본문상 ‘높아짐/고양됨’으로 남기며, ‘교만’은 가능한 해석으로만 각주 처리해야 합니다.
  issues:
