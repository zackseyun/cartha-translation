base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/006.yaml
  text: And in our sins sinners rose up against us[a]; they attacked us and drove us out[c][b]. Those to whom you had not promised it took it away by force.
  footnotes:
  - marker: a
    text: Greek has first-person singular, literally 'to whom I did not promise'; the speaker is unstated in the verse itself.
    reason: textual_variant
  - marker: b
    text: The object of 'took away by force' is not expressed in the Greek and is therefore left implicit in the translation.
    reason: lexical_alternative
  - marker: c
    text: Or 'What I had not promised to them, they took away by force.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 우리의 죄들 가운데서 죄인들이 우리에게 일어나 우리를 공격하고 우리를 몰아냈습니다[a][b]. 당신께서 그들에게 약속하지 않으신 것을 그들은 폭력으로 빼앗아 갔습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어의 ἐπηγγείλω는 2인칭 단수로, 하나님께 계속 드리는 직접 호소를 나타냅니다.
    reason: source_note
  - marker: b
    text: ἐπέθεντο와 ἐξώσαντο는 연속된 폭력 행위를 가리키므로, 한국어에서는 ‘공격하고’와 ‘몰아냈습니다’로 나누어 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 한국어는 헬라어의 미표시 목적어를 드러내기 위해 최소한의 보충을 했지만, 구체적인 대상은 원문처럼 특정하지 않았습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπανέστησαν
  english_pob_choice: rose up against
  chosen_korean: 일어나 … 공격하고
  alternatives_korean:
  - 일어나 우리를 대적하고
  - 반기를 들어 우리를 치고
  lexicon: BDAG
  rationale: 상대에게 적대적으로 봉기하는 힘을 살리되, 한국어로는 뒤의 ἐπέθεντο와의 중복을 피하려고 ‘일어나다’와 ‘공격하다’를 분리해 자연스럽게 옮겼습니다.
- source_word: ἐξώσαντο
  english_pob_choice: drove us out
  chosen_korean: 우리를 몰아냈습니다
  alternatives_korean:
  - 우리에게서 쫓아냈습니다
  - 우리를 내쫓았습니다
  lexicon: BDAG
  rationale: 강제로 내보내는 뉘앙스를 살리면서도 현대 한국어에서 가장 직접적이고 읽기 쉬운 표현을 택했습니다.
- source_word: ἐπηγγείλω
  english_pob_choice: you had not promised
  chosen_korean: 당신께서 약속하지 않으신
  alternatives_korean:
  - 당신께서 약속하지 않으셨던
  - 당신께서 미리 약속하지 않으신
  lexicon: BDAG
  rationale: 개정된 영어 주석처럼 2인칭 단수 직접화법을 반영해 ‘당신께서’로 옮기고, 과거 완료의 선행성을 한국어 관용으로 처리했습니다.
- source_word: μετὰ βίας
  english_pob_choice: by force
  chosen_korean: 폭력으로
  alternatives_korean:
  - 힘으로
  - 강제로
  lexicon: BDAG
  rationale: 반복되는 폭력성을 더 분명히 드러내기 위해 단순한 ‘힘으로’보다 ‘폭력으로’를 선택했습니다.
theological_decisions:
- issue: 직접 호칭의 지속(verse 5에서 이어지는 하나님께의 2인칭 호소)
  chosen_reading: 본문의 ‘당신께서’는 시편 화자가 하나님께 계속 말하는 2인칭 직접 호소로 유지했습니다.
  alternative_readings:
  - 제3인칭으로 일반화해 ‘그분께서’로 바꾸기
  - 무인칭으로 ‘약속받지 못한 것을’처럼 흐리기
  rationale: 주석이 지적하듯 ἐπηγγείλω는 2인칭 단수이므로, 화자-하나님 관계를 희석하지 않고 직접 호칭을 유지하는 것이 원문에 충실합니다.
  doctrine_reference: 시편의 기도체 화법과 직설적 탄원
- issue: 미표시된 목적어 유지
  chosen_reading: ‘그들에게 약속하지 않으신 것을’로 목적어를 보충해 두되, 구체 명사는 넣지 않았습니다.
  alternative_readings:
  - ‘유산을’ 같은 해석적 목적어를 추가하기
  - 목적어를 완전히 생략하기
  rationale: 헬라어가 목적어를 명시하지 않으므로, 한국어에서도 해석을 과도하게 특정하지 않으면서 문장을 성립시키는 최소한의 보충만 했습니다.
  doctrine_reference: 원문의 생략(ellipsis) 보존
