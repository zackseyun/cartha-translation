  text: καὶ ἐν ταῖς ἁμαρτίαις ἡμῶν ἐπανέστησαν ἡμῖν ἁμαρτωλοί, ἐπέθεντο ἡμῖν καὶ ἐξώσαντο ἡμᾶς· οἷς οὐκ ἐπηγγείλω, μετὰ βίας ἀφείλαντο,
