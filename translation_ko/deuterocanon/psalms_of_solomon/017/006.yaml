  text: And in our sins sinners rose up against us[a]; they attacked us and drove us out[c][b]. Those to whom you had not promised it took it away by force.
  footnotes:
  - marker: a
    text: Greek has first-person singular, literally 'to whom I did not promise'; the speaker is unstated in the verse itself.
    reason: textual_variant
  - marker: b
    text: The object of 'took away by force' is not expressed in the Greek and is therefore left implicit in the translation.
    reason: lexical_alternative
  - marker: c
    text: Or 'What I had not promised to them, they took away by force.'.
    reason: previous_rendering
translation:
  language: ko
  text: 우리가 죄를 지을 때, 죄인들이 우리에게 맞서 일어나 우리를 공격하고 몰아냈습니다[b]. 주님께서[a] 그들에게 약속하지 않으신 것을 그들이 강제로 빼앗아 갔습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어의 ἐπηγγείλω는 2인칭 단수로, 앞 절에서 이어지는 하나님께 대한 직접 호소를 나타냅니다.
    reason: source_note
  - marker: b
    text: ἐπανέστησαν, ἐπέθεντο, ἐξώσαντο는 각각 적대적으로 맞서 일어남, 공격함, 강제로 몰아냄을 나타내는 연속된 행위입니다.
    reason: lexical_alternative
  - marker: c
    text: 헬라어에서 ‘빼앗아 갔다’의 목적어는 명시되지 않습니다. 한국어의 ‘것’은 문장을 위해 최소한으로 보충한 표현이며, 그 대상은 특정하지 않습니다.
    reason: lexical_alternative
