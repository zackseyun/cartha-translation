  lexicon: BDAG
  rationale: 개정된 영어 주석처럼 2인칭 단수 직접화법을 반영해 ‘당신께서’로 옮기고, 과거 완료의 선행성을 한국어 관용으로 처리했습니다.
- source_word: μετὰ βίας
  english_pob_choice: by force
  chosen_korean: 폭력으로
  alternatives_korean:
  - 힘으로
  - 강제로
  lexicon: BDAG
