theological_decisions:
- issue: Ἰερουσαλήμ과 여러 나라의 도시들 사이의 비교 구조
  chosen_reading: 예루살렘에서 한 일과 나라들이 자기 도시들에서 자기 신들에게 행하는 일을 직접 비교하는 문장으로 읽었습니다.
  alternative_readings:
  - 예루살렘에서 한 일이 나라들이 자기들의 신들과 함께 도시들에서 행하는 것과 같다는 뜻
  - ‘행하다’보다 더 강한 우상숭배 비난으로 완화하여 읽는 방식
  rationale: 헬라어 비교문은 생략된 연결을 포함하므로, 문맥이 요구하는 비교의 직접성을 유지하되 우상숭배 암시를 본문보다 더 강하게 확정하지 않았습니다.
  doctrine_reference: 본문 해석 원칙 및 우상숭배 비난의 간접 비교
