base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/016.yaml
  text: And everything that he did in Jerusalem was just as the nations do to their gods in their cities[a][b].
  footnotes:
  - marker: a
    text: The Greek comparison is elliptical; the implied sense may also be, 'just as the nations do with their gods in their cities.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the Gentiles' instead of 'the nations.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 예루살렘에서 행한 모든 것은, 나라들이 자기들의 신들에게 자기들의 도시에서 행하는 것과 같았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 비교는 생략형이어서, 뜻은 ‘나라들이 자기 신들과 함께/자기 신들에게 자기 도시들에서 행하는 것처럼’으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: τὰ ἔθνη는 문맥에 따라 ‘나라들’ 또는 ‘이방인들’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ὅσα
  english_pob_choice: everything that
  chosen_korean: 모든 것은
  alternatives_korean:
  - 그가 행한 모든 것
  - 그가 한 모든 일
  lexicon: LSJ
  rationale: 포괄적 관계절의 의미를 살려 사건 전체를 넓게 가리키는 표현으로 옮겼습니다.
- source_word: ἐποίησεν
  english_pob_choice: did
  chosen_korean: 행한
  alternatives_korean:
  - 한
  - 했던
  - 수행한
  lexicon: LSJ
  rationale: 동사의 범위를 좁히지 않기 위해 특정 행위로 한정하지 않는 ‘행하다’를 택했습니다.
- source_word: τὰ ἔθνη
  english_pob_choice: the nations
  chosen_korean: 나라들이
  alternatives_korean:
  - 민족들이
  - 이방인들이
  lexicon: LSJ
  rationale: 직역성을 유지하면서도 문맥의 비교 대상을 자연스럽게 드러내는 표준어 표현으로 옮겼습니다.
- source_word: τοὺς θεοὺς αὐτῶν
  english_pob_choice: their gods
  chosen_korean: 자기들의 신들에게
  alternatives_korean:
  - 그들의 신들에게
  - 그들의 우상에게
  lexicon: LSJ
  rationale: 본문의 ‘신들’이라는 직접 표현을 살리고, 여격 관계를 한국어에서 자연스럽게 표시했습니다.
theological_decisions:
- issue: Ἰερουσαλήμ과 여러 나라의 도시들 사이의 비교 구조
  chosen_reading: 예루살렘에서 한 일과 나라들이 자기 도시들에서 자기 신들에게 행하는 일을 직접 비교하는 문장으로 읽었습니다.
  alternative_readings:
  - 예루살렘에서 한 일이 나라들이 자기들의 신들과 함께 도시들에서 행하는 것과 같다는 뜻
  - ‘행하다’보다 더 강한 우상숭배 비난으로 완화하여 읽는 방식
  rationale: 헬라어 비교문은 생략된 연결을 포함하므로, 문맥이 요구하는 비교의 직접성을 유지하되 우상숭배 암시를 본문보다 더 강하게 확정하지 않았습니다.
  doctrine_reference: 본문 해석 원칙 및 우상숭배 비난의 간접 비교
