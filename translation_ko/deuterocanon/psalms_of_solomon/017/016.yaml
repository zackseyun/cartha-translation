  text: 그가 예루살렘에서 한 모든 일은, 나라들이 자기들의 도시에서 자기들의 신들에게 하는 일과 같았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어의 비교 구문은 동사가 생략되어 있습니다. ‘나라들이 자기들의 도시에서 자기들의 신들과 함께 하는 일처럼’으로 이해할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: τὰ ἔθνη는 문맥에 따라 ‘나라들’ 또는 ‘이방인들’로 옮길 수 있습니다.
    reason: lexical_alternative
