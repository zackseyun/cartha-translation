    reason: lexical_alternative
  - marker: c
    text: ‘셀라’는 예배적·음악적 쉼을 가리키는 표지로 보이며, 정확한 기능은 분명하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: πάροικος
  english_pob_choice: sojourner
  chosen_korean: 나그네
  alternatives_korean:
  - 객
  - 이방 거주자
  - 거류민
  lexicon: LSJ
  rationale: πάροικος는 공동체 안팎에 잠시 머무는 외부인을 가리키므로, 현대 한국어에서는 문어적이면서도 시편 문맥에 맞는 ‘나그네’가 가장 자연스럽습니다.
- source_word: ἀλλογενής
  english_pob_choice: foreigner
  chosen_korean: 이방인
  alternatives_korean:
  - 외국인
  - 타민족 사람
  - 외지인
  lexicon: LSJ
  rationale: ἀλλογενής는 출신이 다른 사람을 뜻하므로, 여기서는 ‘이방인’이 의미를 분명히 전하면서 ‘나그네’와 구별을 유지합니다.
- source_word: παροικήσει
  english_pob_choice: shall sojourn among them
  chosen_korean: 머물지 못할 것입니다
  alternatives_korean:
  - 거주하지 못할 것입니다
  - 그들 가운데 살지 못할 것입니다
  - 그들 가운데 기거하지 못할 것입니다
  lexicon: LSJ
  rationale: 동사 어근이 앞의 πάροικος와 연결되지만, 한국어에서는 반복을 과하게 살리기보다 ‘더 이상 머물지 못하다’로 자연스럽게 옮겨 거주 금지의 의미를 분명히 했습니다.
- source_word: σοφίᾳ δικαιοσύνης
  english_pob_choice: in the wisdom of his righteousness
  chosen_korean: 지혜와 그의 의로
  alternatives_korean:
  - 그의 의의 지혜로
  - 그의 의로우신 지혜로
  - 그의 의의 지혜 안에서
  lexicon: LSJ
  rationale: 그리스어는 ‘지혜’와 ‘의’의 결합구로 읽히므로, 두 요소를 함께 드러내되 한국어에서는 ‘지혜와 그의 의로’로 간결하게 처리했습니다.
theological_decisions:
- issue: δικαιοσύνη의 번역 선택
  chosen_reading: 의
  alternative_readings:
  - 의로움
  - 정의
  rationale: 이 절은 왕의 심판을 말하지만, 프로젝트 기본값에 따라 δικαιοσύνη는 ‘의’로 옮기고, 심판의 도덕적 성격을 과도하게 법정적 용어로 좁히지 않았습니다.
