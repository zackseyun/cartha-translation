  text: 이방인도, 나그네도 더 이상 그들 가운데 머물지 못할 것입니다. 그는 지혜와 그의 의로 백성과 민족들을 심판할 것입니다. 셀라.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
