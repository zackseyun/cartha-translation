base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/014.yaml
  text: In the wrath of his splendor he sent them away as far as the west[a], and the rulers of the land to mockery[c][b]; and he did not spare.
  footnotes:
  - marker: a
    text: Literally, 'in the wrath of his beauty.'
    reason: lexical_alternative
  - marker: b
    text: Or 'made the rulers of the land an object of ridicule.'
    reason: lexical_alternative
  - marker: c
    text: Or 'In the wrath of his splendor he sent them away as far as the west, and made the rulers of the land a mockery; he did not spare them.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그의 아름다움의 진노 가운데서 그들을 서쪽까지 보내셨고, 그 땅의 통치자들을 조롱거리로 삼으셨으며, 그가 그들을 아끼지 않으셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 아름다움의 진노’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 땅의 통치자들을 비웃음거리로 만들었다’일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그의 아름다움의 진노 가운데서 그들을 서쪽까지 보내고, 그 땅의 통치자들을 조롱거리로 삼으셨으며, 그들을 아끼지 않으셨습니다’입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ὀργῇ
  english_pob_choice: wrath
  chosen_korean: 진노
  alternatives_korean:
  - 분노
  - 노여움
  lexicon: BDAG
  rationale: ὀργή의 강한 심판적 분노를 살리기 위해, 격하지만 성경적 문맥에 잘 맞는 ‘진노’를 택했습니다.
- source_word: κάλλους
  english_pob_choice: splendor
  chosen_korean: 아름다움
  alternatives_korean:
  - 광휘
  - 아름다움
  - 위엄
  lexicon: BDAG
  rationale: 본문의 ελλην어는 문자적으로 ‘아름다움’이며, 그 소유격 구조를 그대로 살려 ‘그의 아름다움의 진노’로 옮겼습니다.
- source_word: ἐμπαιγμόν
  english_pob_choice: a mockery
  chosen_korean: 조롱거리
  alternatives_korean:
  - 조롱
  - 비웃음거리
  - 희롱거리
  lexicon: BDAG
  rationale: 명사형의 수치·조롱 의미를 자연스러운 한국어로 옮기기 위해 ‘조롱거리로 삼다’라는 표현을 사용했습니다.
- source_word: οὐκ ἐφείσατο
  english_pob_choice: he did not spare
  chosen_korean: 아끼지 않으셨습니다
  alternatives_korean:
  - 용서하지 않으셨습니다
  - 불쌍히 여기지 않으셨습니다
  - 사면하지 않으셨습니다
  lexicon: BDAG
  rationale: ἐφείσατο는 ‘아끼다/유보하다/사랑해서 면해 주다’의 뉘앙스를 가지므로, 심판을 거두지 않으셨다는 뜻을 살려 ‘아끼지 않으셨습니다’로 옮겼습니다.
theological_decisions:
- issue: 주어의 역사적 지시 대상과 서술 방식
  chosen_reading: 문맥상 이 절은 하나님이 아니라 앞선 절의 ‘무법자’가 행한 파괴를 서술하므로, 인칭 대명사의 존대를 쓰지 않고 서술적 문체로 옮겼습니다.
  alternative_readings:
  - 하나님을 주어로 읽는 경건화된 번역
  - 직역하여 중립적 동사만 나열하는 번역
  rationale: 본문 흐름과 영어 POB 감사 경로가 가리키는 역사적 주체를 유지해야 하므로, 신학적으로 경건화하지 않고 사건 서술을 보존했습니다.
  doctrine_reference: 본문 문맥 해석; Pss. Sol. 17:13-14 연속 서술
- issue: ‘서쪽’ 표현의 지리적 방향성
  chosen_reading: ἕως ἐπὶ δυσμῶν은 ‘서쪽까지’로 옮겨, 멀리 추방되는 방향성을 분명히 했습니다.
  alternative_readings:
  - 서방으로
  - 석양의 곳으로
  rationale: dυσμαί의 기본 의미인 서쪽/해지는 방향을 직접 드러내어, 추방과 멸시의 공간적 대비를 보존했습니다.
  doctrine_reference: 지리적 이미지의 보존
