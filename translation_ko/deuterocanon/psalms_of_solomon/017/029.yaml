translation:
  language: ko
  text: 그리고 그분은 불의를 더는 그들 가운데 머물게 하지 않으실 것이며, 악을 아는 사람은 그들과 함께 살지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 전승 본문은 ‘그들 가운데’에 해당하는 부분의 문장이 다소 어색하지만, 전체 뜻은 분명합니다. 불의는 더 이상 공동체 안에 남아 있지 않을 것입니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἀφήσει
  english_pob_choice: will not allow
  chosen_korean: 머물게 하지 않으시며
  alternatives_korean:
  - 허용하지 않으시며
  - 두지 않으시며
  lexicon: BDAG
  rationale: 허락/허용의 금지를 자연스럽게 살리면서, 뒤의 ‘남아 있다’와 결합된 지속 금지의 뜻을 한국어로 분명히 전달합니다.
- source_word: ἀδικίαν
  english_pob_choice: unrighteousness
  chosen_korean: 불의
  alternatives_korean:
  - 불의함
  - 부정
  lexicon: BDAG
  rationale: 시편적·도덕적 문맥에서 ἀδικία는 단순한 법적 불법보다 하나님 앞의 ‘불의’가 더 직접적입니다.
- source_word: ἐν αὐτῶν
  english_pob_choice: among them
  chosen_korean: 그들 가운데
  alternatives_korean:
  - 그들 안에
  - 그들 한가운데
  lexicon: BDAG
  rationale: 본문이 약간 어색하지만 공동체적 범위를 가리키므로 ‘그들 가운데’가 가장 자연스럽고 원문의 집단성을 보존합니다.
- source_word: κατοικήσει
  english_pob_choice: will dwell
  chosen_korean: 살지 못할 것입니다
  alternatives_korean:
  - 거하지 못할 것입니다
  - 머무르지 못할 것입니다
  lexicon: BDAG
  rationale: ‘거하다’보다 현대 독자에게는 ‘살다’가 더 자연스럽지만, 정착하여 함께 거주한다는 의미는 유지합니다.
- source_word: εἰδὼς κακίαν
  english_pob_choice: who knows wickedness
  chosen_korean: 악을 아는 자
  alternatives_korean:
  - 악을 아는 사람
  - 악에 익숙한 자
  lexicon: BDAG
  rationale: 분사구를 명사화해 사람을 가리키는 표현으로 옮기되, 단순 인지가 아니라 악과 친숙한 상태를 함축하도록 했습니다.
- source_word: κακίαν
  english_pob_choice: wickedness
  chosen_korean: 악
  alternatives_korean:
  - 악함
  - 간악함
  lexicon: BDAG
  rationale: 여기서는 구체적 ‘악의’보다 포괄적 도덕적 악이 핵심이므로, 압축된 한국어 ‘악’이 문맥에 잘 맞습니다.
theological_decisions:
- issue: 공동체 정화와 배제의 표현
  chosen_reading: 불의와 악을 아는 자의 동거 불가를 통해, 회복된 공동체에서 도덕적 악이 제거된다는 뜻을 그대로 유지했습니다.
  alternative_readings:
  - ‘불의’보다 ‘부정’이나 ‘부당함’으로 완화할 수 있습니다.
  - ‘함께 살지 못할 것입니다’를 ‘함께 있지 못할 것입니다’로 더 약하게 옮길 수 있습니다.
  rationale: 문맥은 형식적 선언이 아니라 정화된 공동체의 질서를 말하므로, 배제의 강도를 약화시키지 않고 직설적으로 살리는 편이 원문에 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.
