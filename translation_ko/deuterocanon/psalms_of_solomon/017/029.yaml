  - severity: low
    issue: 첫 절의 미래 표현과 둘째 절의 미래 표현의 형식 불균형
    rationale: ‘머물게 하지 않으시며’도 문맥상 미래로 이해될 수 있으나, 명시적 미래형 ‘않으실 것이며’를 사용하면 ἀφήσει와 κατοικήσει의 병렬된 미래 진술을 더 분명히 드러냅니다.
