  text: And he will not allow unrighteousness to remain among them any longer[a], and no one who knows wickedness will dwell with them.
  footnotes:
  - marker: a
    text: 'The Greek line in this witness is textually awkward around ''among them,'' but the overall sense is clear: unrighteousness will no longer remain within the community.'
