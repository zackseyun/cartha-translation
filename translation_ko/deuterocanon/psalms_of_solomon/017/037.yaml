  text: For he will not put his hope in horse and rider and bow[a], nor will he multiply gold or silver for himself for war[b], nor will he gather hopes from many for the day of battle.
  footnotes:
  - marker: a
    text: Literally, 'nor will he gather hopes with many for the day of war'; the Greek likely refers to relying on large numbers or a large force.
    reason: lexical_alternative
  - marker: b
    text: Or 'gold and silver'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 말과 기수와 활에 희망을 두지 않을 것입니다. 또한 전쟁을 위하여 자신을 위해 금이나 은을 많이 모으지 않을 것이며, 많은 이들과 함께 전쟁의 날을 위한 희망들을 모으지도 않을 것입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘많은 이들과 함께 희망들을 모으지 않을 것입니다’입니다. 여기서 ‘많은 이들’은 큰 병력이나 다수의 지원을 가리켜, 그것들에 의지하지 않는다는 뜻일 수 있습니다.
    reason: lexical_alternative
