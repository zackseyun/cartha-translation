  to: 그는 말과 기수와 활에 희망을 두지 않을 것입니다. 또한 전쟁을 위하여 자신을 위해 금이나 은을 많이 모으지 않을 것이며, 많은 이들과 함께 전쟁의 날을 위한 희망들을 모으지도 않을 것입니다[a].
  rationale: 마지막 절의 여격 πολλοῖς를 ‘많은 이들과 함께’로 옮겨 원문의 문법적 압축과 해석 가능성을 보존했습니다. ‘많은 수로부터’라는 부자연스러운 표현은 피하고, 군사적 규모라는 문맥적 이해는 각주에 한정했습니다. 금·은을 ‘많이 모으다’로 고쳐 자연스러운 현대 한국어를 사용했으며, 설명 대상에 맞게 각주 a의 위치를 마지막 절로 옮겼습니다. 기존 각주 b는 본문에서 ‘금이나 은’이라는 번역을 이미 채택하므로 중복되어 삭제했습니다.
