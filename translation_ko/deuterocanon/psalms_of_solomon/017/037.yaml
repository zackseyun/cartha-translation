    rationale: πολλοῖς는 문맥상 큰 수의 사람들/병력을 가리킬 수 있는 여격이며, ‘로부터’로 단정하기보다 ‘많은 이들과 함께’로 보존하고 주석으로 문맥적 해석을 밝혀야 합니다.
  - severity: low
    issue: ‘자기에게 금이나 은을 늘리다’가 한국어 관용에 맞지 않습니다.
    rationale: 금·은에는 ‘많이 모으다’ 또는 ‘축적하다’가 자연스럽고, 원문의 ‘많게 하다’의 의미도 충분히 보존합니다.
