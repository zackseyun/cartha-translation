base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/037.yaml
  text: For he will not put his hope in horse and rider and bow[a], nor will he multiply gold or silver for himself for war[b], nor will he gather hopes from many for the day of battle.
  footnotes:
  - marker: a
    text: Literally, 'nor will he gather hopes with many for the day of war'; the Greek likely refers to relying on large numbers or a large force.
    reason: lexical_alternative
  - marker: b
    text: Or 'gold and silver'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 말과 기수와 활에 희망을 두지 않을 것입니다[a], 전쟁을 위해 자기에게 금이나 은을 늘리지도 않을 것이며[b], 많은 수로부터 전쟁의 날을 위한 희망들을 모으지도 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘많은 수와 함께 희망들을 모으지 않을 것입니다’로, 여기서는 큰 병력이나 다수의 지원에 의지하지 않는다는 뜻일 가능성이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘금과 은’.
    reason: previous_rendering
lexical_decisions:
- source_word: ἐλπιεῖ
  english_pob_choice: will not put his hope
  chosen_korean: 희망을 두지 않을 것입니다
  alternatives_korean:
  - 희망하지 않을 것입니다
  - 신뢰하지 않을 것입니다
  lexicon: BDAG
  rationale: ἐλπίζω의 기본 의미인 ‘희망하다’를 살리되, 군사적 문맥에서의 의존·기대의 뉘앙스를 한국어로 자연스럽게 옮겼습니다.
- source_word: ἵππον καὶ ἀναβάτην καὶ τόξον
  english_pob_choice: horse and rider and bow
  chosen_korean: 말과 기수와 활
  alternatives_korean:
  - 말과 탄 자와 활
  - 말과 승마자와 활
  lexicon: LSJ
  rationale: 세 단어의 구체적 군사 이미지를 그대로 살려, 전통적 완곡어인 ‘전쟁 무기’처럼 일반화하지 않았습니다.
- source_word: χρυσίον οὐδὲ ἀργύριον
  english_pob_choice: gold or silver
  chosen_korean: 금이나 은
  alternatives_korean:
  - 금과 은
  - 황금이나 은
  lexicon: LSJ
  rationale: οὐδὲ가 이어지는 부정 구조를 반영해 ‘이나’로 처리했고, 본문의 물질명 자체를 직접적으로 옮겼습니다.
- source_word: πολλοῖς ... ἐλπίδας
  english_pob_choice: hopes from many
  chosen_korean: 많은 수로부터 ... 희망들을
  alternatives_korean:
  - 많은 사람들로부터 ... 희망들을
  - 큰 군세로부터 ... 희망들을
  lexicon: BDAG
  rationale: 복수형 ἐλπίδας를 ‘희망들’로 살리고, πολλοῖς는 문맥상 ‘많은 수’로 이해되는 군사적 규모를 드러내었습니다.
theological_decisions:
- issue: 전쟁 의존의 대상 나열을 어떻게 한국어로 보존할지
  chosen_reading: 말과 기수와 활, 그리고 금·은과 많은 수를 전쟁의 भरो? 아닌 희망의 근거로 삼지 않는다는 구조를 직설적으로 유지했습니다.
  alternative_readings:
  - 의지하지 않을 것입니다
  - 믿지 않을 것입니다
  rationale: 본문은 군사력·재정·병력에 대한 의존을 대조적으로 비판하므로, ‘희망을 두다’라는 표현이 ἐλπίζω의 의미와 본문의 신학적 초점을 함께 보존합니다.
  doctrine_reference: 시편 솔로몬 17편의 메시아적 왕상 이미지와 인간 군사력 비판
