    rationale: ἐπανίστημι는 여격의 상대방을 향해/맞서 일어나는 뜻으로 쓰였습니다. ‘그들에게 맞서 일어났을 때’로 명시해야 원문의 관계와 영어 POB의 ‘rose up against them’을 보존합니다.
