  source_fidelity: 수정이 필요합니다. ἐπανίστημι와 여격 αὐτοῖς는 여기서 ‘그들에게 맞서 일어나다’라는 대립 관계를 나타내므로, 단순히 ‘그들에게 일어섰다’라고 하면 관계가 부자연스럽고 의미가 약화됩니다. ἀλλότριον γένους ἡμῶν은 ‘우리 민족에 속하지 않은’으로 충실하게 옮길 수 있습니다.
  naturalness: ‘우리 민족과 다른 출신의 한 사람이 그들에게 일어섰을 때입니다’는 ‘출신’의 수식 범위와 ‘그들에게 일어서다’의 결합이 자연스럽지 않습니다. ‘우리 민족에 속하지 않은 한 사람이 그들에게 맞서 일어났을 때입니다’가 현대 표준 한국어와 합쇼체 문장 종결에 더 자연스럽습니다.
  terminology: γένος는 이 문맥에서 공동체의 혈통·민족적 소속을 가리키므로 ‘우리 민족’이 적절합니다. ἀλλότριος를 ‘우리 민족에 속하지 않은’으로 풀어, 불필요하게 현대 정치·법률 용어로 들릴 수 있는 표현을 피하면서 원문의 소속 대조를 보존했습니다.
