lexical_decisions:
- source_word: ἐν τῷ ἐπαναστῆναι
  english_pob_choice: when ... rose up
  chosen_korean: …일어섰을 때
  alternatives_korean:
  - …일어났을 때
  - …맞서 일어났을 때
  lexicon: LSJ
  rationale: ἐν + 관사적 부정사는 시간 부사절로 옮기는 것이 자연스러우며, ἐπανίστημι의 동작성을 살려 ‘일어섰다’로 표현했습니다.
- source_word: αὐτοῖς
  english_pob_choice: against them
  chosen_korean: 그들에게
  alternatives_korean:
  - 그들에 맞서
  - 그들에 대하여
  lexicon: LSJ
  rationale: 동사 ἐπανίστημι가 이미 대립·저항의 뉘앙스를 담고 있으므로, 한국어에서는 불필요한 중복을 피하고 목적어 관계를 유지했습니다.
- source_word: ἀλλότριον
  english_pob_choice: foreign
  chosen_korean: 다른 출신의
  alternatives_korean:
  - 이방의
  - 낯선
  - 외국 출신의
  lexicon: LSJ
  rationale: 혈통·집단적 타자성을 가리키는 말이므로, 현대 한국어에서 의미가 과도하게 정치화되지 않는 ‘다른 출신의’로 옮겼습니다.
- source_word: γένους ἡμῶν
  english_pob_choice: our race
  chosen_korean: 우리 민족
  alternatives_korean:
  - 우리 사람들
  - 우리 종족
  - 우리 혈통
  lexicon: LSJ
  rationale: γένους는 단순 개인보다 집단적 혈연·민족 정체성을 가리키므로, 한국어에서는 문맥상 자연스럽고 오해를 줄이는 ‘우리 민족’으로 옮겼습니다.
theological_decisions:
- issue: 집단 정체성 표현의 현대어 대응
  chosen_reading: γένους ἡμῶν을 ‘우리 민족’으로 옮겨, 본문의 공동체적/민족적 대립을 분명히 드러냈습니다.
  alternative_readings:
  - 우리 사람들
  - 우리 혈통
  - 우리 종족
  rationale: 이 구절은 개인 대 개인의 대립이 아니라 집단적 소속과 외부자의 부상을 말하므로, 현대 독자가 이해하기 쉬운 민족 범주를 사용했습니다.
  doctrine_reference: 공동체 정체성 및 민족-언약적 서술
