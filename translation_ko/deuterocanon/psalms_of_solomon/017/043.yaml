lexical_decisions:
- source_word: εὐλογία
  english_pob_choice: blessing
  chosen_korean: 복
  alternatives_korean:
  - 축복
  - 은혜로운 복
  lexicon: BDAG
  rationale: εὐλογία는 여기서 일반적인 ‘축복/복’의 뜻으로 쓰였으므로, 자연스럽고 소박한 한국어 ‘복’으로 옮겼습니다.
- source_word: Κυρίου
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 야훼
  lexicon: BDAG
  rationale: 문맥상 일반적 호칭으로 읽히는 κύριος를 한국어 경어형인 ‘주님’으로 옮겨, 관계적 의미를 살렸습니다.
- source_word: μετʼ αὐτοῦ
  english_pob_choice: with him
  chosen_korean: 그와 함께
  alternatives_korean:
  - 그와
  - 그에게
  lexicon: BDAG
  rationale: μετά+속격의 동반 의미를 한국어 관용 표현 ‘~와 함께’로 옮겨, 단순한 존재 동반을 분명히 했습니다.
- source_word: ἐν ἰσχύϊ
  english_pob_choice: in strength
  chosen_korean: 힘 가운데
  alternatives_korean:
  - 힘 안에서
  - 능력 가운데
  - 강함 가운데
  lexicon: BDAG
  rationale: ἰσχύς의 기본 의미인 ‘힘/강함’을 살리되, 전치사구의 문장 흐름을 한국어답게 하기 위해 ‘힘 가운데’로 옮겼습니다.
theological_decisions:
- issue: κύριος의 한국어 처리
  chosen_reading: 여기서는 시편 솔로몬의 문맥에 맞게 ‘주님’으로 번역하고, 야훼 표기는 쓰지 않았습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 본문이 직접 인용된 YHWH 표지로 보이지 않고 일반적인 주어적 호칭으로 기능하므로, 프로젝트 기본값인 ‘주님’을 유지하는 것이 가장 덜 해석적입니다.
  doctrine_reference: 'project glossary: κύριος (of Jesus) / general Lord usage'
- issue: εὐλογία와 ἰσχύς의 결합
  chosen_reading: ‘주님의 복’이 ‘힘 가운데’와 결합된 구조를 그대로 살려, 복이 동반되는 상태와 그 강도를 모두 드러냈습니다.
  alternative_readings:
  - 주님의 축복이 그와 함께 있습니다
  - 주님의 복이 능력과 함께 있습니다
  rationale: 원문의 간결한 병렬을 풀어 지나치게 설명하지 않고, 복과 힘의 결합을 자연스럽게 보존했습니다.
  doctrine_reference: source-language syntax preservation
