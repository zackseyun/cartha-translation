lexical_decisions:
- source_word: οἱ λόγοι αὐτοῦ
  english_pob_choice: His words
  chosen_korean: 그분의 말은
  alternatives_korean:
  - 그분의 말씀은
  - 그의 말은
  lexicon: LSJ / BDAG
  rationale: λόγοι는 여기서 개별 발화나 말들을 가리키므로, 한국어에서는 가장 자연스럽고 직접적인 ‘말’로 옮겼습니다.
- source_word: λόγοι ἁγίων
  english_pob_choice: the words of holy ones
  chosen_korean: 거룩한 이들의 말
  alternatives_korean:
  - 성도의 말
  - 거룩한 사람들의 말
  lexicon: LSJ / BDAG
  rationale: ἁγίων은 형용사적 ‘거룩한 말’보다 사람을 가리키는 실질명사로 보는 편이 자연스러워, 교회 용어를 과도하게 고정하지 않는 ‘거룩한 이들’로 옮겼습니다.
- source_word: ἐν μέσῳ
  english_pob_choice: in the midst of
  chosen_korean: 가운데 있는
  alternatives_korean:
  - 한가운데 있는
  - 가운데서
  lexicon: LSJ
  rationale: 직역의 어감을 살리되 한국어 문장 흐름을 자연스럽게 하기 위해 ‘가운데 있는’으로 풀었습니다.
- source_word: λαῶν ἡγιασμένων
  english_pob_choice: sanctified peoples
  chosen_korean: 성별된 민족들
  alternatives_korean:
  - 거룩하게 된 민족들
  - 성화된 백성들
  lexicon: LSJ / BDAG
  rationale: λαῶν은 복수이므로 단수 ‘백성’으로 줄이지 않고 복수 ‘민족들’로 유지했습니다. ἡγιασμένων은 완료된 성별의 상태를 나타내므로 ‘거룩한’보다 동사적 뉘앙스를 살리는 ‘성별된’이 더 가깝습니다.
theological_decisions:
- issue: ἁγίων과 ἡγιασμένων의 구별
  chosen_reading: ‘거룩한 이들’과 ‘성별된 민족들’을 구분해 번역했습니다.
  alternative_readings:
  - 둘 다 ‘성도들’로 통일
  - 둘 다 ‘거룩한’으로 평면화
  rationale: 본문은 사람 쪽의 거룩함과 공동체 쪽의 성별 상태를 각각 말하므로, 한국어에서도 동일한 어휘로 뭉개지지 않게 했습니다.
  doctrine_reference: 성별/거룩의 어휘 구별
- issue: 복수 λαῶν의 보존
  chosen_reading: ‘민족들’로 복수성을 살렸습니다.
  alternative_readings:
  - ‘백성’으로 단수화
  - ‘백성들’
  rationale: 원문 복수는 단순한 집합명사가 아니라 여러 민족/백성 집단을 가리키므로, 한국어에서도 복수성을 드러내는 것이 source-grounded합니다.
  doctrine_reference: 본문 형태론 보존
