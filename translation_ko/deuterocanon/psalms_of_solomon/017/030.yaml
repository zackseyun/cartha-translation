source:
  edition: lxx-swete-1909
  text: γνώσεται γὰρ αὐτοὺς ὅτι πάντες υἱοὶ θεοῦ εἰσιν αὐτῶν, καὶ καταμερίσει αὐτοὺς ἐν ταῖς φυλαῖς αὐτῶν ἐπὶ τῆς γῆς.
  language: Greek
  pages:
  - 808
  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/030.yaml
  text: For he will recognize them[a], that they all are sons of their God[c][b], and he will apportion them among their tribes upon the land.
  footnotes:
  - marker: a
    text: 'Or: “children of their God.” The Greek more literally says “sons.”'
    reason: lexical_alternative
  - marker: b
    text: 'Or: “in the land,” if γῆ is taken in a more local sense.'
    reason: alternative_reading
  - marker: c
    text: Or 'among their tribes upon the earth'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 그들을 알아보실 것입니다. 그들은 모두 그들의 하나님의 아들들이며, 그들을 그들의 지파들 사이에, 땅 위에서 나누어 주실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들의 하나님의 자녀들”입니다. 헬라어는 더 문자적으로 “아들들”이라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그 땅에서”로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: γνώσεται
  english_pob_choice: will recognize
  chosen_korean: 알아보실 것입니다
  alternatives_korean:
  - 아실 것입니다
  - 인정하실 것입니다
  lexicon: BDAG
  rationale: 관계적·판별적 의미를 살려 단순한 정보 인지보다 ‘알아보다’가 더 자연스럽고, 주어가 신적 행위자이므로 높임을 반영했습니다.
- source_word: υἱοὶ
  english_pob_choice: sons
  chosen_korean: 아들들
  alternatives_korean:
  - 자녀들
  lexicon: BDAG
  rationale: 헬라어가 남성 복수 명사이므로 성별을 지운 ‘자녀들’보다 직역성 있는 ‘아들들’이 원문을 더 정확히 보존합니다.
- source_word: καταμερίσει
  english_pob_choice: will apportion
  chosen_korean: 나누어 주실 것입니다
  alternatives_korean:
  - 분배하실 것입니다
  - 배정하실 것입니다
  lexicon: BDAG
  rationale: 지파별 분깃 배분의 맥락을 살리면서, 한국어에서는 ‘나누어 주다’가 가장 자연스럽고 분할·배정의 뉘앙스를 함께 전달합니다.
- source_word: ἐν ταῖς φυλαῖς αὐτῶν
  english_pob_choice: among their tribes
  chosen_korean: 그들의 지파들 사이에
  alternatives_korean:
  - 그들의 지파들 가운데
  - 그들의 지파들에 따라
  lexicon: BDAG
  rationale: φυλαί를 이스라엘의 ‘지파들’로 옮기고, 분배의 범위를 나타내는 전치사구는 ‘사이에/가운데’가 문맥상 가장 자연스럽습니다.
theological_decisions:
- issue: γῆς의 범위
  chosen_reading: 땅 위에서
  alternative_readings:
  - 땅에서
  - 그 땅에서
  rationale: 본문은 γῆ가 일반적 ‘땅’인지, 특정한 ‘땅/토지’인지 완전히 소거하지 않으므로, 지리적·언약적 양쪽 가능성을 열어 두는 표현을 유지했습니다.
  doctrine_reference: 해석상의 긴장 보존
