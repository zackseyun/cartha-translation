  source_fidelity: 초안은 γνώσεται를 ‘알아보다’, υἱοὶ를 ‘아들들’, καταμερίσει를 분배·배정의 뜻으로 옮긴 점에서 대체로 충실합니다. 그러나 ὅτι가 이끄는 내용을 앞 문장과 분리하여 ‘그들은 … 아들들이며’라고 독립 서술한 것은 원문의 ‘그들이 모두 … 아들들임을 알아볼 것이다’라는 문장 구조를 약화합니다. 또한 ‘그들의 지파들 사이에, 땅 위에서’는 수식 관계와 동작의 범위가 어색하게 분리됩니다.
