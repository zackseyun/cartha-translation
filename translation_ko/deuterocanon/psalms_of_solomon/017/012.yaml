  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주인
  lexicon: BDAG
  rationale: 시편 전통의 κύριος는 존칭을 살린 ‘주님’이 적절합니다.
- source_word: κρίμασιν
  english_pob_choice: judgments
  chosen_korean: 심판
  alternatives_korean:
  - 판결
  - 재판
  lexicon: BDAG
  rationale: 여기서는 하나님의 구체적 사법 행위를 가리키므로 ‘심판’이 가장 직접적입니다.
- source_word: ἐπὶ τὴν γῆν
  english_pob_choice: on the earth
  chosen_korean: 땅 위에서
  alternatives_korean:
  - 땅에서
  - 온 땅 위에
  lexicon: BDAG
  rationale: 문맥상 하나님의 심판이 미치는 영역을 넓게 가리키므로, 자연스러운 한국어로 ‘땅 위에서’라고 옮겼습니다.
theological_decisions:
- issue: πιστός를 하나님의 성품으로 둘지, 심판의 정당성으로 돌릴지
  chosen_reading: 주님 자신이 신실하시며, 그 신실함이 그의 심판들에서 드러난다는 구도를 유지했습니다.
  alternative_readings:
  - 주님은 그의 모든 심판에서 의로우십니다
  - 주님은 그의 모든 결정에서 신뢰할 만하십니다
  rationale: 원문은 πιστός를 주어 술어로 두고, 뒤의 κρίμασιν으로 그 신실함의 발현 영역을 제시합니다. ‘의로우십니다’는 다른 어휘를 도입하므로 피했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.
