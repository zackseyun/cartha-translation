lexical_decisions:
- source_word: πιστός
  english_pob_choice: faithful
  chosen_korean: 신실하십니다
  alternatives_korean:
  - 충실하십니다
  - 신뢰할 만하십니다
  lexicon: BDAG
  rationale: πιστός는 주님의 성품을 나타내는 술어로, ‘신실하다’가 가장 자연스럽고 언약적 충실성을 잘 드러냅니다.
- source_word: κύριος
