base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/002.yaml
  text: And what is the span of a man's life on the earth? According to his span[b][a], so also is his hope upon him.
  footnotes:
  - marker: a
    text: Or “his hope rests on him,” taking the final pronoun to refer to the man rather than to his span of life.
    reason: alternative_reading
  - marker: b
    text: Or 'As long as that span lasts, so also his hope rests on it.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 사람이 땅 위에서 사는 기간이 얼마나 됩니까? 그의 생애의 기간에 따라, 그에게 거는 희망도 그러합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 생애의 기간에 따라, 그의 희망도 그 기간에 달려 있습니다.” 마지막 대명사는 사람 대신 그의 생애의 기간을 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: χρόνος ζωῆς ἀνθρώπου
  english_pob_choice: span of a man's life
  chosen_korean: 사람의 생명의 기간
  alternatives_korean:
  - 사람의 삶의 기간
  - 인생의 기간
  - 사람의 생애의 범위
  lexicon: BDAG
  rationale: χρόνος는 추상적 ‘시간’보다 측정된 생애의 길이를 가리키므로, 한국어에서는 자연스럽게 ‘생명의 기간’으로 옮겨 인생의 유한성을 드러냈습니다.
- source_word: ἐπὶ τῆς γῆς
  english_pob_choice: on the earth
  chosen_korean: 땅에서
  alternatives_korean:
  - 지상에서
  - 이 땅에서
  - 땅 위에서
  lexicon: BDAG
  rationale: 지상의 삶을 가리키는 위치 표현이므로, 문맥상 가장 간결하고 자연스러운 ‘땅에서’를 선택했습니다.
- source_word: κατὰ τὸν χρόνον αὐτοῦ
  english_pob_choice: According to his span
  chosen_korean: 그의 기간에 따라
  alternatives_korean:
  - 그의 생애의 길이에 따라
  - 그의 기간을 따라
  - 그의 생명의 기간에 맞추어
  lexicon: BDAG
  rationale: 직역하면 어색해질 수 있어, 생애의 길이에 ‘비례하여/따라’라는 대응 관계를 살리는 표현으로 옮겼습니다.
- source_word: ἡ ἐλπὶς αὐτοῦ ἐπʼ αὐτόν
  english_pob_choice: so also is his hope upon him
  chosen_korean: 그의 희망도 그에게 있습니다
  alternatives_korean:
  - 그의 희망도 그 위에 있습니다
  - 그의 희망도 그에게 달려 있습니다
  - 그의 희망도 그에게 놓입니다
  lexicon: BDAG
  rationale: ἐπʼ αὐτόν은 여기서 사람을 향한 기대/희망이 그 사람 위에 놓여 있음을 뜻하므로, 한국어에서는 ‘그에게 있습니다’로 자연스럽게 풀었습니다.
theological_decisions:
- issue: ἐπʼ αὐτόν의 지시 대상
  chosen_reading: 희망이 ‘그 사람’에게 놓여 있다는 뜻으로 읽었습니다.
  alternative_readings:
  - 희망이 ‘그의 기간(생애의 기간)’ 위에 놓여 있다는 뜻으로 읽을 수 있습니다.
  rationale: 문맥상 3절의 ‘그러나 우리는 하나님께 소망을 둡니다’와 대비되므로, 희망의 대상이 인간임을 드러내는 읽음이 가장 적합합니다.
  doctrine_reference: 본문 대비 구조(인간의 유한한 생애에 대한 희망 vs 하나님께 두는 희망)
