revisions:
- from: 그리고 사람의 생명의 기간이 땅에서 얼마나 됩니까? 그의 기간에 따라, 그의 희망도 그에게 있습니다.[a][b]
  to: 그리고 사람이 땅 위에서 사는 기간이 얼마나 됩니까? 그의 생애의 기간에 따라, 그에게 거는 희망도 그러합니다.[a]
  rationale: 문장을 현대 표준 한국어 합쇼체로 다듬고, ‘희망’이 사람을 향한다는 본문 읽음을 명료하게 했습니다. 동시에 마지막 대명사의 선행사가 생애 기간일 가능성은 각주에 보존했습니다. 기존 각주 b는 동일한 대안을 반복하면서 상응 관계를 단순 지속으로 바꾸므로 삭제했습니다.
