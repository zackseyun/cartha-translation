translation:
  language: ko
  text: 그의 날들 동안 그는 그의 하나님 안에서 약해지지 않을 것입니다[a]. 왜냐하면 하나님께서 그를 성령 안에서 능력 있게 하시고, 이해의 조언 안에서 지혜롭게 하셨기 때문입니다[c][b]. 그는 힘과 의를 지닙니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성령으로’ / ‘성령 안에서’.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘의로움’이 아닌 ‘정의’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘거룩한 영 안에서’.
    reason: previous_rendering
lexical_decisions:
- source_word: ἀσθενήσει
  english_pob_choice: will not grow weak
  chosen_korean: 약해지지 않을 것입니다
  alternatives_korean:
  - 쇠하지 않을 것입니다
  - 기운이 꺾이지 않을 것입니다
  lexicon: BDAG / LSJ
  rationale: 미래형 동사의 약화·쇠약의 의미를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: ἐπὶ θεῷ αὐτοῦ
  english_pob_choice: in his God
  chosen_korean: 그의 하나님 안에서
  alternatives_korean:
  - 그의 하나님 위에
  - 그의 하나님을 의지하여
  lexicon: BDAG / LSJ
  rationale: ἐπί + 여격의 관계를 위치적이기보다 의존·기반의 뉘앙스로 읽되, 원문의 구조를 해치지 않도록 직역에 가깝게 살렸습니다.
- source_word: πνεύματι ἁγίῳ
  english_pob_choice: in holy spirit
  chosen_korean: 성령 안에서
  alternatives_korean:
  - 거룩한 영 안에서
  - 성령으로
  lexicon: BDAG / LSJ
  rationale: 문맥상 하나님의 특별한 능력 부여를 가리키므로, 한국어 성경 용례에 맞추어 ‘성령’으로 옮겼습니다.
- source_word: σοφὸν ἐν βουλῇ συνέσεως
  english_pob_choice: wise in the counsel of understanding
  chosen_korean: 이해의 조언 안에서 지혜롭게
  alternatives_korean:
  - 분별의 조언 가운데 지혜롭게
  - 통찰의 계획 속에서 지혜롭게
  lexicon: BDAG / LSJ
  rationale: βουλή와 σύνεσις의 결합을 ‘조언’과 ‘이해’로 대응시켜, 지혜의 내용이 분별 있는 계획/조언임을 드러냈습니다.
- source_word: δικαιοσύνης
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 정의
  - 의로움
  lexicon: BDAG
  rationale: 프로젝트 기본어휘에 따라 δικαιοσύνη는 본문에서 ‘의’로 옮겼습니다.
theological_decisions:
- issue: πνεύματι ἁγίῳ의 신학적 명시성
  chosen_reading: ‘성령 안에서’로 옮겨, 단순한 질적 표현보다 하나님의 능력 부여를 가리키는 성령의 의미를 드러냈습니다.
  alternative_readings:
  - 거룩한 영 안에서
  - 성령으로
  rationale: 본문은 메시아적 능력 부여를 말하며, 문맥과 유대교적 배경상 성령을 가리키는 읽기가 가장 자연스럽습니다. 다만 ‘안에서’라는 관계 표현은 유지하여 매개/영역의 뉘앙스를 보존했습니다.
  doctrine_reference: 성령의 사역과 메시아의 능력 부여
