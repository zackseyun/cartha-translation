  yaml_path: translation/deuterocanon/psalms_of_solomon/017/028.yaml
  text: And he will gather a holy people[a], whom he will lead in righteousness[d][c][b]; and he will judge the tribes of the people sanctified by the Lord his God.
  footnotes:
  - marker: a
    text: Or “in justice.”
    reason: lexical_alternative
  - marker: b
    text: Or “sanctified by the Lord his God.”
    reason: lexical_alternative
  - marker: c
    text: “Judge” may also carry the broader sense “rule” or “govern” in this royal context.
    reason: lexical_alternative
  - marker: d
    text: Or 'the tribes of the people made holy'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그분은 거룩한 백성을 모으시고, 그들을 의로 이끄시며, 주 하나님께서 거룩하게 하신 백성의 지파들을 심판하실 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “정의로.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “주 하나님께서 거룩하게 하신.”
    reason: lexical_alternative
  - marker: c
    text: “심판하다”는 이 왕적 문맥에서 더 넓게 “다스리다”, “통치하다”의 뜻을 띨 수도 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 “거룩하게 된 백성의 지파들.”
    reason: previous_rendering
lexical_decisions:
- source_word: συνάξει
  english_pob_choice: will gather
  chosen_korean: 모으시고
  alternatives_korean:
