  rationale: 완료 수동의 결과 상태를 반영하되, 한국어에서 더 읽기 자연스러운 능동형 표현으로 옮겼습니다.
theological_decisions:
- issue: κρίνειν의 왕적·사법적 의미
  chosen_reading: 심판하실 것입니다
  alternative_readings:
