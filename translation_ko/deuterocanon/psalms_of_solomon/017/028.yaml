  rationale: 문맥상 왕적 शासन이 배경이지만, κρινεῖ의 기본 의미를 살려 ‘심판하다’를 본문에 두고 통치적 함의는 독자가 읽어내도록 했습니다.
  doctrine_reference: POB contested-terms handling for κρίνω
