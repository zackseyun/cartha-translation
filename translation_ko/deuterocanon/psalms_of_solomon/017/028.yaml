  rationale: ἅγιος의 종교적·언약적 뉘앙스를 살리면서도 한국어에서 자연스러운 표현으로 옮겼습니다.
- source_word: ἀφήγήσεται ἐν δικαιοσύνῃ
  english_pob_choice: he will lead in righteousness
  chosen_korean: 의로 이끄시며
