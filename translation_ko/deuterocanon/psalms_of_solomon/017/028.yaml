translation:
  language: ko
  text: 그리고 그분께서는 거룩한 백성을 모으시고, 그 백성을 의로[a] 인도하시며, 그분의 주 하나님께서 거룩하게 하신[b][d] 백성의 지파들을 심판하실[c] 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “정의로.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “그분의 주 하나님께서 성별하신.”
    reason: lexical_alternative
  - marker: c
    text: “심판하다”는 이 왕적 문맥에서 더 넓게 “다스리다” 또는 “통치하다”를 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 “거룩하게 된 백성의 지파들.”
    reason: previous_rendering
