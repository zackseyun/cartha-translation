translation:
  language: ko
  text: 그분은 친히 죄에서 깨끗하시며,[a] 큰 민족들을 다스리시고, 통치자들을 책망하시며, 그분의 말씀의 능력으로 죄인들을 제거하실 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죄 없이 순결하신’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘죄인들을 몰아내실’.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθαρὸς ἀπὸ ἁμαρτίας
  english_pob_choice: pure from sin
  chosen_korean: 죄 없이 순결하여
  alternatives_korean:
  - 죄에서 자유로워
  - 죄로부터 깨끗하여
  - 무죄하여
  lexicon: BDAG
  rationale: καθαρὸς는 ‘깨끗한/순결한’의 의미이므로, 죄와의 분리를 분명히 하면서도 ‘순결하여’로 moral purity를 자연스럽게 살렸습니다.
- source_word: ἄρχειν
  english_pob_choice: to rule
  chosen_korean: 다스리고
  alternatives_korean:
  - 통치하고
  - 다스리며
  - 군림하고
  lexicon: BDAG
  rationale: 왕적 권위를 행사한다는 뜻이므로, 한국어에서 가장 직접적이고 문맥에 맞는 ‘다스리다’를 선택했습니다.
- source_word: λαοὺς μεγάλους
  english_pob_choice: great peoples
  chosen_korean: 큰 백성들을
  alternatives_korean:
  - 위대한 민족들을
  - 큰 민족들을
  - 많은 백성들을
  lexicon: BDAG
  rationale: λαοί는 ‘민족들/백성들’의 복수 공동체를 가리키므로 ‘백성들’로 살리고, μεγάλους는 규모를 나타내는 ‘큰’으로 옮겼습니다.
- source_word: ἐξᾶραι
  english_pob_choice: to remove
  chosen_korean: 제거하실
  alternatives_korean:
  - 없애실
  - 쫓아내실
  - 몰아내실
  lexicon: LSJ
  rationale: 문맥상 죄인들을 심판적으로 제거하는 힘을 나타내므로, 넓은 의미를 유지하는 ‘제거하다’를 택했습니다.
- source_word: ἐν ἰσχύϊ λόγου
  english_pob_choice: by the strength of his word
  chosen_korean: 그의 말씀의 힘으로
  alternatives_korean:
  - 말씀의 능력으로
  - 그 말의 힘으로
  - 말씀의 권세로
  lexicon: BDAG
  rationale: ἰσχύς는 ‘힘/능력’이고 λόγος는 여기서 권위 있는 발화를 가리키므로, 자연스러운 한국어로 ‘그의 말씀의 힘’이라 옮겼습니다.
theological_decisions:
- issue: 메시아의 무죄/순결 진술
  chosen_reading: 죄 없이 순결하여
  alternative_readings:
  - 죄에서 자유로워
  - 죄 없는
  - 깨끗하여
  rationale: 본문은 메시아가 죄와 무관한 도덕적 순결을 직접 진술합니다. ‘죄 없이 순결하여’는 그 강도를 유지하면서도 한국어로 과장 없이 전달합니다.
  doctrine_reference: 메시아의 도덕적 무흠성
- issue: 통치와 심판의 병렬
  chosen_reading: 다스리고, 통치자들을 꾸짖으며, 그의 말씀의 힘으로 죄인들을 제거하실 것입니다
  alternative_readings:
  - 다스리며 … 꾸짖고 … 없애실 것입니다
  - 다스리고 … 책망하며 … 몰아내실 것입니다
  rationale: 세 동사는 왕적 통치, 권위 있는 책망, 그리고 심판적 제거라는 점층 구조를 이룹니다. 이를 분명히 드러내기 위해 동사를 병렬로 살렸습니다.
  doctrine_reference: 메시아의 왕권과 심판권
