  to: 그분은 친히 죄에서 깨끗하시며,[a] 큰 민족들을 다스리시고, 통치자들을 책망하시며, 그분의 말씀의 능력으로 죄인들을 제거하실 것입니다.[b]
  rationale: 그리스어의 강조된 주어 αὐτός는 ‘그분은 친히’로 반영했습니다. καθαρὸς ἀπὸ ἁμαρτίας는 도덕적 정결을 직접 나타내도록 ‘죄에서 깨끗하시며’로, λαοὺς μεγάλους는 복수 공동체의 의미를 자연스럽게 드러내도록 ‘큰 민족들’로 옮겼습니다. 세 부정사의 병렬은 일관된 합쇼체로 유지했습니다. ‘죄에서 자유로우신’은 καθαρὸς의 적절한 어휘 대안이 아니므로 각주에서 제외했으며, 각주 표지는 해당 표현에 붙였습니다.
