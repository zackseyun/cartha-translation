  source_fidelity: 개정이 필요합니다. καθαρὸς ἀπὸ ἁμαρτίας는 죄로부터의 도덕적 깨끗함을 말하므로 ‘죄에서 깨끗하시며’가 자연스럽고 충실합니다. ἄρχειν, ἐλέγξαι, ἐξᾶραι의 세 부정사는 통치·책망·제거의 병렬 행위로 옮겼습니다. ἐν ἰσχύϊ λόγου는 주어의 권위 있는 말의 능력을 뜻하므로 ‘그분의 말씀의 능력으로’로 번역했습니다.
  naturalness: 초안의 ‘그 자신은’은 현대 표준 한국어에서 부자연스럽고, ‘죄 없이 순결하여’는 다소 중복적으로 들립니다. 또한 ‘큰 백성들’보다 복수의 정치·민족 집단을 가리키는 문맥에서는 ‘큰 민족들’이 더 자연스럽습니다. 존대 종결과 서술어를 일관되게 정리했습니다.
  terminology: ‘순결’ 자체는 가능하지만, καθαρὸς의 깨끗함 비유와 ἀπὸ ἁμαρτίας의 분리 관계를 ‘죄에서 깨끗하시며’로 직접 나타냈습니다. ‘말씀’은 λόγος의 권위 있는 발화라는 문맥에 적절하며, ‘제거하다’는 ἐξᾶραι의 넓은 제거 의미를 보존합니다.
