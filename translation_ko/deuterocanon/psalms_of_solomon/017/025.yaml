translation:
  language: ko
  text: 지혜와 의로써, 예루살렘을 멸망으로 짓밟는 민족들로부터 깨끗하게 하소서.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘민족들’은 ‘이방인들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘의로’는 여기서 ‘정의로’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘지혜와 의로써’는 원문의 간결한 전치사구를 방식/수단으로 옮긴 것입니다.
    reason: source_note
lexical_decisions:
- source_word: καθάρισον
  english_pob_choice: Cleanse
  chosen_korean: 깨끗하게 하소서
  alternatives_korean:
  - 정결하게 하소서
  - 씻어 내소서
  lexicon: BDAG
  rationale: 단호한 명령형의 정화 요청을 살리면서, 제의적·도덕적 불결을 함께 담을 수 있는 한국어로 옮겼습니다.
- source_word: ἐθνῶν
  english_pob_choice: nations
  chosen_korean: 민족들
  alternatives_korean:
  - 나라들
  - 이방인들
  lexicon: BDAG
  rationale: 문맥상 예루살렘을 짓누르는 외세 집단을 가리키므로, 종교적 대조를 앞세우는 ‘이방인들’보다 중립적인 ‘민족들’이 원문에 가깝습니다.
- source_word: καταπατούντων
  english_pob_choice: that trample
  chosen_korean: 짓밟는
  alternatives_korean:
  - 밟아 짓누르는
  - 유린하는
  lexicon: BDAG
  rationale: 적대적 억압의 동작을 한국어에서 가장 직접적으로 드러내는 표현으로, 폭력성과 경멸의 뉘앙스를 유지합니다.
- source_word: ἐν ἀπωλείᾳ
  english_pob_choice: in destruction / to ruin
  chosen_korean: 멸망으로
  alternatives_korean:
  - 파멸로
  - 파괴 속에
  lexicon: BDAG
  rationale: 결과를 나타내는 ἐν + 명사구를 한국어 목적격적 방향 표현으로 자연스럽게 옮겨, 짓밟음의 귀결이 파멸임을 살렸습니다.
theological_decisions:
- issue: ἐν σοφίᾳ, ἐν δικαιοσύνῃ를 어디에 연결할지
  chosen_reading: 정화 행위인 ‘깨끗하게 하소서’를 수식하는 방식으로 두어, ‘지혜와 의로써’라는 수단/방식의 요청으로 읽었습니다.
  alternative_readings:
  - 짓밟는 민족들의 행위를 규정하는 말로 읽을 수 있음
  - 심판의 기준을 표시하는 말로 읽을 수 있음
  rationale: 그리스어는 압축적이어서 연결이 다소 유동적이지만, POB의 영어도 청원 동사에 붙여 읽고 있으므로 한국어에서도 같은 구조가 가장 분명합니다.
  doctrine_reference: 시적 청원 문맥의 문법적 결속
