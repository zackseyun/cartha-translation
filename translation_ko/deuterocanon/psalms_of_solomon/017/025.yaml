review_pass:
  verdict: revise
  source_fidelity: The imperative καθάρισον is appropriately rendered as a formal-polite petition, and ‘민족들’ faithfully represents ἐθνῶν without prematurely narrowing it to ‘이방인들.’ The initial ‘지혜와 의로써’ reasonably attaches the final two prepositional phrases to the cleansing, consistent with the stated audit-trail reading. ‘멸망으로 짓밟는,’ however, is not idiomatic Korean and leaves the semantic relation of ἐν ἀπωλείᾳ unclear; ‘멸망에 이르도록 짓밟는’ naturally conveys the destructive-result sense adopted in the English audit trail.
  naturalness: The sentence is otherwise clear and maintains an appropriately elevated prayer register. Recasting only the destructive phrase improves modern Korean idiom while retaining the vivid image of trampling.
  terminology: ‘예루살렘,’ ‘민족들,’ ‘지혜,’ and ‘의’ are suitable. ‘깨끗하게 하소서’ preserves the broad cleansing sense without imposing a specifically ritual interpretation. The lexical-alternative notes for ‘이방인들’ and ‘정의로’ remain appropriate.
  issues:
  - severity: medium
    issue: ‘멸망으로 짓밟는’ is an awkward and semantically imprecise Korean collocation.
    rationale: Korean does not naturally use ‘멸망으로’ to modify ‘짓밟다’ in this way. ‘멸망에 이르도록’ expresses the destructive result of the trampling and reflects the audit trail’s ‘to ruin’/destructive reading of ἐν ἀπωλείᾳ.
