  source_fidelity: 첫 두 절은 주님의 왕권과 난해한 소망 구절을 각각 독립된 진술로 처리하여, 전승 본문의 큰 구분과 불규칙한 명사구를 비교적 충실히 반영합니다. 그러나 마지막 절의 ἐνώπιον αὐτοῦ ἐν φόβῳ는 ‘모든 민족’이 그분 앞에서 두려움/경외 가운데 있는 অবস্থ을 나타내는 것으로 두는 편이 자연스럽습니다. 초안의 ‘두려움 가운데 있는 모든 민족에게’는 ‘그분 앞에서’라는 요소를 빠뜨립니다.
  naturalness: ‘힘 있는 이의 소망은 하나님 안에 있는 소망입니다’는 난해한 원문의 반복을 보존하면서도 현대 한국어 문장으로 읽힙니다. 마지막 절은 ‘그분 앞에서 두려워하는 모든 민족에게’로 하면 수식 관계가 분명하고 합쇼체도 유지됩니다.
  terminology: ‘주님’, ‘왕’, ‘소망’, ‘하나님’, ‘자비를 베푸시다’는 일관되고 적절합니다. φόβος의 의미 범위는 본문에서 ‘두려워하는’으로 보존하고 각주에서 ‘경외’ 가능성을 제시합니다. 각주의 영어 단어 fear는 그리스어 φόβος로 고쳐야 합니다.
