base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/038.yaml
  text: The Lord himself is their king[a], the hope of the mighty one in God[d][c][b]; and he will have mercy on all the nations before him in fear.
  footnotes:
  - marker: a
    text: Some witnesses read 'his king' instead of 'their king,' which would make the line refer more directly to the Davidic ruler's subordination to the Lord.
    reason: textual_variant
  - marker: b
    text: The Greek clause behind 'the hope of the mighty one whose hope is in God' is difficult as transmitted in Swete and may reflect an irregular or uncertain reading.
    reason: textual_variant
  - marker: c
    text: Or 'before him with reverence'; the phrase 'in fear' may denote awe as well as fear.
    reason: lexical_alternative
  - marker: d
    text: Or 'their king—the hope of the mighty one whose hope is in God—and'.
    reason: previous_rendering
translation:
  language: ko
  text: 주님 자신이 그들의 왕이십니다.[a] 힘 있는 이의 소망은 하나님 안에 있는 소망입니다.[b] 그분께서는 그분 앞에서 두려워하는 모든 민족에게 자비를 베푸실 것입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본은 ‘그들의 왕’ 대신 ‘그의 왕’으로 읽습니다. 그러면 이 행은 다윗계 통치자가 주님께 종속된다는 점을 더 직접적으로 드러냅니다.
    reason: textual_variant
  - marker: b
    text: 전승된 그리스어 구절은 난해하며, ‘소망’이 반복되는 불규칙하거나 불확실한 형태를 반영한 것일 수 있습니다.
    reason: textual_variant
  - marker: c
    text: ‘그분 앞에서 두려워하는’은 ‘그분 앞에서 경외하는’으로도 옮길 수 있습니다. 여기서 그리스어 φόβος는 두려움과 경외를 함께 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριος
  english_pob_choice: The Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주인
  lexicon: BDAG
  rationale: κύριος를 하나님 지칭으로 읽어 POB의 ‘Lord’를 살리되, 한국어에서는 직접 호칭에 가까운 ‘주님’이 가장 자연스럽습니다.
- source_word: βασιλεὺς αὐτῶν
  english_pob_choice: their king
  chosen_korean: 그들의 왕
  alternatives_korean:
  - 그분의 왕
  - 그의 왕
  lexicon: LSJ
  rationale: 본문의 복수 대명사를 따라 ‘그들의 왕’으로 옮겨, 하나님이 최종 통치자라는 긴장을 보존했습니다.
- source_word: ἐλπὶς τοῦ δυνατοῦ ἐλπὶθ θεοῦ
  english_pob_choice: the hope of the mighty one in God
  chosen_korean: 힘 있는 자의 소망은 하나님 안에 있습니다
  alternatives_korean:
  - 힘 있는 자의 소망은 하나님입니다
  - 힘 있는 자의 소망, 하나님 안에 있는 소망입니다
  lexicon: LSJ
  rationale: 전승된 그리스어는 어려운 명사구이므로, POB의 최신 정리처럼 문장을 진술형으로 풀어 ‘소망’과 ‘하나님 안에’의 관계를 드러냈습니다.
- source_word: ἐλεήσει
  english_pob_choice: he will have mercy on
  chosen_korean: 자비를 베푸실 것입니다
  alternatives_korean:
  - 긍휼을 베푸실 것입니다
  - 불쌍히 여기실 것입니다
  lexicon: BDAG
  rationale: 자비 행위를 나타내는 표준 동사로, 한국어에서는 ‘자비를 베풀다’가 가장 자연스럽고 신학적으로도 적절합니다.
- source_word: ἐν φόβῳ
  english_pob_choice: in fear
  chosen_korean: 두려움 가운데
  alternatives_korean:
  - 경외함 가운데
  - 두려움으로
  lexicon: BDAG
  rationale: POB가 유지한 ‘fear’의 양가성—두려움과 경외—을 살리기 위해 본문에는 ‘두려움 가운데’로 두고, 경외의 뉘앙스는 너무 일찍 해소하지 않았습니다.
theological_decisions:
- issue: 주님의 왕권과 대상 공동체의 왕권이 어떻게 공존하는가
  chosen_reading: 주님 자신이 그들의 왕이십니다
  alternative_readings:
  - 주님 자신이 그의 왕이십니다
  rationale: 복수 대명사를 본문대로 살려 주님의 최종 주권을 보존하면서, 주변 문맥의 다윗계 통치자와의 관계는 해소하지 않고 남겨 두었습니다.
  doctrine_reference: 타이틀은 본문대로 번역하고, 해석적 긴장은 본문 안에 보존합니다.
