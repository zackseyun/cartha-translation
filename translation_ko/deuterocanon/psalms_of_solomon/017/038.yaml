- from: 주님 자신이 그들의 왕이십니다. 힘 있는 자의 소망은 하나님 안에 있습니다. 그리고 그분께서는 두려움 가운데 있는 모든 민족에게 자비를 베푸실 것입니다.[a][b][c]
  to: 주님 자신이 그들의 왕이십니다.[a] 힘 있는 이의 소망은 하나님 안에 있는 소망입니다.[b] 그분께서는 그분 앞에서 두려워하는 모든 민족에게 자비를 베푸실 것입니다.[c]
  rationale: 큰 구분 뒤의 난해한 소망 구절을 진술문으로 유지하되, 반복된 ‘소망’을 삭제하거나 해석적 관계절로 바꾸지 않았습니다. 또한 ἐνώπιον αὐτοῦ와 ἐν φόβῳ를 모두 번역하여, 민족들이 그분 앞에서 두려움 또는 경외 가운데 있다는 수식 관계를 보존했습니다.
