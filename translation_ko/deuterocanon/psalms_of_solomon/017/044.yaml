  source_fidelity: 첫 절의 ἐπὶ Κύριον은 주님을 향한/주님께 둔 의탁의 방향을 나타냅니다. 초안의 ‘주님 안에서’도 문맥상 이해되지만, 공간적·영역적 의미로 읽힐 수 있어 ‘주님께 두는’이 더 직접적이고 정확합니다. 나머지 대적의 수사 의문문과 ‘행위’ 및 ‘하나님을 경외함’의 의미는 보존됩니다.
  naturalness: ‘그의 희망은 주님 안에서’와 ‘자기 행위에서 강하고 … 강력합니다’는 현대 한국어에서 다소 어색하고 중복적으로 들립니다. ‘그가 주님께 두는 소망’ 및 ‘그가 하는 일에 능하고 … 강합니다’로 고치면 합쇼체의 자연스러움과 원문의 병렬 구조를 함께 살립니다.
  terminology: Κύριος는 ‘주님’, φόβος θεοῦ는 성서적 관용을 보존하여 ‘하나님을 경외함’으로 유지하는 것이 적절합니다. ἔργα는 여기서 ‘그가 하는 일’로 옮겨 자연스럽게 하되 의미를 넓히지 않았습니다.
