  yaml_path: translation/deuterocanon/psalms_of_solomon/017/044.yaml
  text: And his hope in the Lord will not grow weak; and who can stand against him? He is strong in his deeds and mighty in the fear of God,
translation:
  language: ko
  text: 그리고 그가 주님께 두는 소망은 약해지지 않을 것이며, 누가 그에게 맞설 수 있겠습니까? 그는 그가 하는 일에 능하고 하나님을 경외함에 강합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἀσθενήσει
  english_pob_choice: will not grow weak
  chosen_korean: 약해지지 않을 것이며
  alternatives_korean:
  - 쇠하지 않을 것이며
  - 힘을 잃지 않을 것이며
  lexicon: BDAG / LSJ
  rationale: 미래 시상의 부정으로 ‘희망’이 약해지지 않는다는 뜻을 자연스러운 현대 한국어로 옮기면서, 단순한 소멸보다 ‘약화’의 뉘앙스를 살렸습니다.
- source_word: ἡ ἐλπὶς αὐτοῦ ἐπὶ Κύριον
  english_pob_choice: his hope in the Lord
  chosen_korean: 그의 희망은 주님 안에서
  alternatives_korean:
  - 그의 희망은 주님께
  - 그의 희망은 주님 위에
  lexicon: BDAG / LSJ
  rationale: ἐπὶ + 대격의 지향·의지 의미를 한국어의 ‘안에서/께’ 계열로 풀어, 단순한 공간이 아니라 신뢰의 대상에 대한 의탁을 드러냈습니다.
- source_word: τίς δύναται πρὸς αὐτόν;
  english_pob_choice: who can stand against him?
  chosen_korean: 누가 그에게 맞설 수 있겠습니까?
  alternatives_korean:
  - 누가 그를 대적할 수 있겠습니까?
  - 누가 그 앞에 설 수 있겠습니까?
  lexicon: BDAG / LSJ
  rationale: πρός + 대격이 나타내는 대항·대립의 의미를 살려, 승산 없는 대적을 뜻하는 한국어로 옮겼습니다.
- source_word: ἰσχυρὸς ἐν ἔργοις αὐτοῦ καὶ κραταιὸς ἐν φόβῳ θεοῦ
  english_pob_choice: He is strong in his deeds and mighty in the fear of God
  chosen_korean: 그는 자기 행위에서 강하고 하나님을 경외함에서 강력합니다
  alternatives_korean:
  - 그는 자기 일에서 강하고 하나님을 두려워함에서 강력합니다
  - 그는 자기 행위에 강하고 하나님을 경외하는 데에 강력합니다
  lexicon: BDAG / LSJ
  rationale: ἐν + 명사는 근거·영역을 나타내므로 ‘~에서’로 살렸고, ἔργα는 여기서 그의 행위/일을 가리켜 ‘행위’로 옮겼습니다. κραταιός는 단순한 강함보다 더 강한 힘을 가리켜 ‘강력합니다’로 표현했습니다.
theological_decisions:
- issue: φόβος θεοῦ의 번역 강도
  chosen_reading: ‘하나님을 경외함’으로 옮겨, 단순한 존경이 아니라 하나님 앞에서의 경외와 두려움이 함께 있는 성격을 보존했습니다.
  alternative_readings:
  - 하나님을 두려워함
  - 하나님께 대한 경외
  rationale: 문맥상 의로운 통치자의 강함을 묘사하는 종교적 idiom이므로, 의미를 약화시키는 ‘존경’보다 성서적 표현인 경외를 유지하는 것이 더 정확합니다.
  doctrine_reference: 성경의 ‘하나님을 경외함’ 모티프
