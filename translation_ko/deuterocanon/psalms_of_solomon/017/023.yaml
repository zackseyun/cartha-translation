  text: Look, Lord, and raise up for them their king, Look, Lord, and raise up for them their king, the son of David, at the time you chose, O God, for him to reign over Israel your servant., at the time Look, Lord, and raise up for them their king, a son of David, at the time you chose, O God, for him to reign over Israel your servant., O God, for him to reign over Israel your servant.
translation:
  language: ko
  text: 보십시오, 주님, 그들에게 그들의 왕, 다윗의 아들을 세워 주십시오. 하나님, 당신께서 정하신 때에 그가 이스라엘—당신의 종—을 다스리게 하소서.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴδε
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보소서
  - 보아 주십시오
  lexicon: ἴδε
  rationale: 직접 호소하는 감탄형 명령을 현대 합쇼체로 살려, 간절한 청원을 자연스럽게 드러냈습니다.
- source_word: ἀνάστησον
  english_pob_choice: raise up
  chosen_korean: 세워 주십시오
  alternatives_korean:
  - 일으켜 주십시오
  - 세워 주소서
  lexicon: ἀνίστημι
  rationale: 왕을 ‘일으키다’보다 왕권을 부여해 세우는 뜻이 문맥상 분명하므로, 청원적 뉘앙스를 살려 번역했습니다.
- source_word: υἱὸν Δαυίδ
  english_pob_choice: the son of David / a son of David
  chosen_korean: 다윗의 아들
  alternatives_korean:
  - 다윗의 자손
  - 다윗의 아들 한 분
  lexicon: υἱός + Δαυίδ
  rationale: 메시아적 혈통 표지를 직역하여 유지하되, 한국어에서 가장 자연스럽고 분명한 관용 표현을 택했습니다.
- source_word: παῖδά σου
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 주의 종
  - 당신의 일꾼
  lexicon: παῖς
  rationale: 지배-소속 관계를 드러내는 표현이므로 ‘종’으로 옮겨 원문의 종속성과 충성의 의미를 보존했습니다.
theological_decisions:
- issue: 메시아적 왕의 요청을 ‘다윗의 아들’로 보존할지, 보다 해설적으로 풀어쓸지
  chosen_reading: 본문의 왕청원과 다윗 계열 표지를 그대로 유지했습니다.
  alternative_readings:
  - 메시아적 왕으로 풀어씀
  - 다윗의 후손으로 완화
  rationale: 시편 솔로몬의 문맥에서 왕권 회복 청원과 다윗 언약 기대가 핵심이므로, 해설을 덧붙여 희석하지 않고 원문 표지를 보존했습니다.
  doctrine_reference: 메시아 소망 / 다윗 언약
