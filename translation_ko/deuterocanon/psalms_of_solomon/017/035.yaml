revisions:
- from: 그리고 주님의 영광과 하나님께서 그것에 부여하신 영광을 보게 되며, 그 자신이 하나님께서 가르치신 의로운 왕이 되어 그들 위에 있게 될 것입니다.[a][b][c]
  to: 그리고 하나님께서 그녀에게 영광을 입혀 주신 주님의 영광을 보게 될 것이며,[a] 그 자신은 하나님께 가르침을 받은 의로운 왕으로서 그들을 다스리게 될 것입니다.[b][c]
  rationale: 원문의 여성 인칭 목적어를 ‘그녀’로 보존하고, δόξα와 ἐδόξασεν의 연결을 ‘영광을 입혀 주신’으로 반영했습니다. 그리스어의 무동사 왕권 구문은 미래 지향 문맥에 따라 한국어에서 ‘다스리게 될 것입니다’로 최소한으로 보충하되, ἐπ’ αὐτούς의 통치 의미를 명확히 했습니다. 각주 표지는 해당 어구에 맞추어 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:10:00Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. αὐτήν은 문맥상 인격화된 예루살렘을 가리키는 여성 단수 목적어이므로 ‘그것에’는 원문의 인칭적 지시를 약화합니다. 또한 ‘그들 위에 있게 되다’는 왕이 백성을 다스린다는 ἐπ’ αὐτούς의 통치 관계를 한국어에서 부자연스럽고 불명확하게 만듭니다.
  naturalness: ‘하나님께 가르침을 받은’과 ‘그들을 다스리게 될 것입니다’가 현대 표준 한국어 합쇼체에서 더 자연스럽고 의미가 분명합니다. ‘그녀’는 한국어에서 다소 표지된 표현이지만, 원문의 여성 인칭 지시와 예루살렘의 인격화를 보존하는 데 필요합니다.
  terminology: ‘주님의 영광’, ‘의로운 왕’은 적절합니다. δόξα/ἐδόξασεν의 동어근 관계는 ‘영광을 입혀 주신’으로 유지할 수 있으며, διδακτὸς ὑπὸ θεοῦ는 ‘하나님께 가르침을 받은’으로 정확히 옮깁니다.
  issues:
