translation:
  language: ko
  text: 그리고 주님의 영광과 하나님께서 그것에 부여하신 영광을 보게 되며, 그 자신이 하나님께서 가르치신 의로운 왕이 되어 그들 위에 있게 될 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “주님의 영광, 곧 하나님께서 그것에 영광을 부여하신 영광”입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “하나님께서 가르치신”.
    reason: alternative_reading
  - marker: c
    text: 또는 “하나님께서 가르치신 의로운 왕, 그들 위에”.
    reason: previous_rendering
lexical_decisions:
- source_word: δόξαν Κυρίου
  english_pob_choice: the glory of the Lord
  chosen_korean: 주님의 영광
  alternatives_korean:
  - 주님의 광채
  - 주님의 존귀
  lexicon: LSJ
  rationale: δόξα는 여기서 외적 영예와 드러난 영광을 함께 가리키므로, 한국어에서는 교회적이면서도 직역에 가까운 “영광”이 가장 균형이 좋습니다.
- source_word: ἐδόξασεν
  english_pob_choice: glorified
  chosen_korean: 영광을 부여하신
  alternatives_korean:
  - 영화롭게 하신
  - 영광스럽게 하신
  lexicon: LSJ
  rationale: 동사 ἐδοξασεν은 단순한 칭찬보다 영광을 주는 행위를 뜻하므로, “영광을 부여하신”으로 δόξα/δοξάζω의 연관을 살렸습니다.
- source_word: αὐτὴν
  english_pob_choice: her
  chosen_korean: 그것에
  alternatives_korean:
  - 그녀에게
  - 그것을
  lexicon: LSJ
  rationale: 문맥상 예루살렘을 가리키는 여성형 지시이지만, 한국어 본문에서는 도시를 인격화한 표현을 과도하게 부각하기보다 문맥에 맞는 중립적 대명사로 처리했습니다.
- source_word: βασιλεὺς δίκαιος
  english_pob_choice: a righteous king
  chosen_korean: 의로운 왕
  alternatives_korean:
  - 공의로운 왕
  - 정의로운 왕
  lexicon: LSJ
  rationale: δικ- 계열은 본 프로젝트 기본값에 따라 “의”로 옮기며, “의로운 왕”이 종교적·메시아적 뉘앙스를 가장 자연스럽게 전달합니다.
- source_word: διδακτὸς ὑπὸ θεοῦ
  english_pob_choice: taught by God
  chosen_korean: 하나님께서 가르치신
  alternatives_korean:
  - 하나님께 배운
  - 하나님이 가르치신
  lexicon: LSJ
  rationale: διδακτός는 수동형 형용사로 “가르침을 받은/가르치신”을 뜻하므로, 한국어에서는 주어적 수동성을 살려 “하나님께서 가르치신”으로 옮겼습니다.
- source_word: ἐπ’ αὐτούς
  english_pob_choice: over them
  chosen_korean: 그들 위에
  alternatives_korean:
  - 그들 위에 군림하여
  - 그들 위에서
  lexicon: LSJ
  rationale: ἐπί + 대격은 통치의 방향성을 드러내므로, 왕권의 위치관계를 자연스럽게 드러내는 “그들 위에”가 적절합니다.
theological_decisions:
- issue: 둘째 절의 서술어 보충
  chosen_reading: 그 자신이 하나님께서 가르치신 의로운 왕이 되어 그들 위에 있게 될 것입니다.
  alternative_readings:
  - 그 자신, 하나님께서 가르치신 의로운 왕이 되어 그들 위에 있을 것입니다.
  - 그 자신이 하나님께서 가르치신 의로운 왕, 그들 위에 있게 될 것입니다.
  rationale: 그리스어 원문은 서술어가 생략된 구문이므로, 한국어에서는 미래 지향의 메시아적 문맥에 맞게 “되다/있다”를 보충하되 원문의 압축성을 과도하게 풀지 않았습니다.
  doctrine_reference: 메시아적 왕권에 대한 묵시적 표현
