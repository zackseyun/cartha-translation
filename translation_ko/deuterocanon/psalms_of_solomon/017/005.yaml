  text: σύ, Κύριε, ᾑρέτισω τὸν Δαυὶδ βασιλέα ἐπʼ Ἰσραήλ, καὶ σύ ὤμοσας αὐτῷ περὶ τοῦ σπέρματος εἰς τὸν αἰῶνα, τοῦ μὴ ἐκλείπειν ἀπέναντί σου βασίλειον αὐτοῦ.
