base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/005.yaml
  text: You[a], Lord, chose David as king over Israel, and you swore to him concerning his offspring forever[b], that his kingdom would not fail before you.
  footnotes:
  - marker: a
    text: Or “seed,” that is, his descendants.
    reason: lexical_alternative
  - marker: b
    text: Or “his dynasty would not cease before you.”
    reason: alternative_reading
translation:
  language: ko
  text: 주님, 주님께서는 다윗을 이스라엘의 왕으로 택하셨고, 그의 자손[a]에 관하여 영원히 그에게 맹세하셨습니다. 그의 왕국이 주님 앞에서 끊어지지 않을 것이라고 하셨습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “씨,” 곧 그의 후손들.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그의 왕조가 주님 앞에서 끊어지지 않을 것이라고.”
    reason: alternative_reading
lexical_decisions:
- source_word: ᾑρέτισω
  english_pob_choice: chose
  chosen_korean: 택하셨고
  alternatives_korean:
  - 선택하셨고
  - 세우셨고
  lexicon: LSJ
  rationale: 하나님의 주권적 선정을 드러내면서도 한국어에서 가장 자연스럽고 성경적인 표현을 유지합니다.
- source_word: σπέρματος
  english_pob_choice: offspring
  chosen_korean: 자손
  alternatives_korean:
  - 씨
  - 후손
  lexicon: LSJ
  rationale: 문맥상 혈통과 계승을 가리키므로 ‘자손’이 가장 분명합니다. 영어 주석의 ‘seed’ 대안은 본문보다 덜 자연스러워 각주로만 보완합니다.
- source_word: εἰς τὸν αἰῶνα
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 끝없이
  - 영원토록
  lexicon: LSJ
  rationale: 언약적 지속을 나타내는 관용구로서 ‘영원히’가 가장 직접적입니다.
- source_word: ἀπέναντί σου
  english_pob_choice: before you
  chosen_korean: 주님 앞에서
  alternatives_korean:
  - 주님 앞에
  - 주님의 면전에서
  lexicon: LSJ
  rationale: 하나님 앞에서의 존속 여부를 나타내는 표현이므로, 존칭을 살린 ‘주님 앞에서’가 문맥에 맞습니다.
- source_word: βασίλειον αὐτοῦ
  english_pob_choice: his kingdom
  chosen_korean: 그의 왕국
  alternatives_korean:
  - 그의 왕권
  - 그의 왕조
  - 그의 나라
  lexicon: LSJ
  rationale: 직역에 가까운 ‘왕국’을 택하되, 뒤의 망하지 않음이라는 내용은 왕조적 지속까지 함축하도록 두었습니다.
theological_decisions:
- issue: 다윗 언약의 왕조적 함의
  chosen_reading: ‘그의 왕국이 주님 앞에서 무너지지 않게 하시려는 것’으로 옮겨, 왕국과 자손 언어를 함께 살렸습니다.
  alternative_readings:
  - 그의 왕조가 주님 앞에서 끊어지지 않게 하시려는 것
  - 그의 통치가 주님 앞에서 사라지지 않게 하시려는 것
  rationale: 그리스어는 σπέρμα(자손)와 βασίλειον(왕국)을 함께 사용하므로, 한국어에서도 왕조적 지속의 의미가 보이도록 하되 ‘왕국’ 본문을 유지했습니다.
  doctrine_reference: 다윗 언약 / 왕조 보존
- issue: 직접 호칭의 호격 처리
  chosen_reading: Κύριε는 ‘주님’으로 옮기고, 반복 호격은 한국어에서는 한 번만 드러내어 문장을 자연스럽게 했습니다.
  alternative_readings:
  - 주님이여
  - 주여
  rationale: 본절은 하나님께 직접 말하는 기도체이므로 존칭을 유지해야 하며, 현대 합쇼체 성경 문체에 맞추어 ‘주님’이 가장 자연스럽습니다.
  doctrine_reference: 기도체 / 하나님의 직접 호칭
