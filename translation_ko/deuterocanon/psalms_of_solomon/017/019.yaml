base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/019.yaml
  text: They wandered in wildernesses[a], that their lives might be saved from evil, and in the eyes of the sojourning community[d][c][b], a life saved from among them was precious.
  footnotes:
  - marker: a
    text: Or 'deserts' instead of 'wildernesses.'
    reason: lexical_alternative
  - marker: b
    text: Greek ψυχή can mean 'life' or 'soul'; here 'life' fits the survival context best.
    reason: lexical_alternative
  - marker: c
    text: Or 'in the eyes of the exile' / 'diaspora'; the Greek παροικία denotes a community living away from its homeland.
    reason: lexical_alternative
  - marker: d
    text: Or 'to save their lives'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 광야들에서 헤매었습니다. 그것은 그들의 생명이 악에서 구원받게 하려는 것이었습니다. 그리고 나그네 공동체의 눈에는 그들 가운데서 구원받은 한 생명이 귀하게 여겨졌습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘광야들’은 복수형을 살린 번역입니다. 단수로 넓게 묶어 ‘광야’라 해도 뜻은 통하지만, 본문은 여러 황량한 장소를 암시합니다.
    reason: source_note
  - marker: b
    text: 여기서 ψυχή는 ‘영혼’보다 ‘생명’이 더 자연스럽습니다.
    reason: lexical_alternative
  - marker: c
    text: παροικία는 고향을 떠나 머무는 사람들의 공동체를 뜻합니다.
    reason: cultural_note
  - marker: d
    text: 직역하면 ‘그들의 생명을 구원받게 하려는’이 될 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ἐπλανῶντο
  english_pob_choice: they wandered
  chosen_korean: 헤매었습니다
  alternatives_korean:
  - 방황했습니다
  - 떠돌았습니다
  lexicon: BDAG
  rationale: ἐπλανῶντο는 이 문맥에서 도덕적 오도보다 실제로 이곳저곳을 떠도는 움직임을 가리키므로, 자연스럽고 구체적인 ‘헤매었습니다’로 옮겼습니다.
- source_word: ἐν ἐρήμοις
  english_pob_choice: in wildernesses
  chosen_korean: 광야들에서
  alternatives_korean:
  - 사막들에서
  - 황무지들에서
  lexicon: BDAG
  rationale: 복수형 ἐρήμοις는 한 군데가 아니라 여러 황량한 장소들을 가리킬 수 있으므로, 의미를 넓게 보존하는 ‘광야들’로 처리했습니다.
- source_word: ψυχὰς αὐτῶν / ψυχὴ
  english_pob_choice: their lives / a life
  chosen_korean: 생명 / 한 생명
  alternatives_korean:
  - 목숨 / 목숨 하나
  - 영혼 / 한 영혼
  lexicon: BDAG
  rationale: 여기서 ψυχή는 생존의 맥락에서 ‘생명’의 뜻이 분명하므로, ‘영혼’보다 구체적인 ‘생명’으로 일관되게 옮겼습니다.
- source_word: παροικίας
  english_pob_choice: the sojourning community
  chosen_korean: 나그네 공동체
  alternatives_korean:
  - 거류 공동체
  - 이주 공동체
  - 디아스포라 공동체
  lexicon: BDAG
  rationale: παροικία는 고향을 떠나 임시로 머무는 공동체를 뜻하므로, 본문의 공동체적·유랑적 뉘앙스를 살려 ‘나그네 공동체’로 옮겼습니다.
theological_decisions:
- issue: σωθῆναι의 목적·수동 의미
  chosen_reading: ‘구원받게 하려는 것이었습니다’로 목적절과 수동성을 함께 살렸습니다.
  alternative_readings:
  - ‘구원하려고’
  - ‘구원되기 위해’
  rationale: 그들이 스스로 구원하는 것이 아니라 구원받는 상태를 가리키는 수동 부정사이므로, 주체를 흐리지 않도록 ‘구원받게 하려는 것’으로 표현했습니다.
  doctrine_reference: '본문 문법 보존: aorist passive infinitive σωθῆναι'
