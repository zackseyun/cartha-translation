base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/019.yaml
  text: They wandered in wildernesses[a], that their lives might be saved from evil, and in the eyes of the sojourning community[d][c][b], a life saved from among them was precious.
  footnotes:
  - marker: a
    text: Or 'deserts' instead of 'wildernesses.'
    reason: lexical_alternative
  - marker: b
    text: Greek ψυχή can mean 'life' or 'soul'; here 'life' fits the survival context best.
    reason: lexical_alternative
  - marker: c
    text: Or 'in the eyes of the exile' / 'diaspora'; the Greek παροικία denotes a community living away from its homeland.
    reason: lexical_alternative
  - marker: d
    text: Or 'to save their lives'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 자기 생명이 악에서 구원받을 수 있도록 여러 광야를 떠돌았습니다. 타향에 머무는 공동체가 보기에, 그들 가운데서 구원받은 한 생명은 귀하였습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘광야/황량한 곳’을 뜻하는 말을 복수로 사용합니다. 한국어에서는 ‘여러 광야’로 자연스럽게 옮겼습니다.
    reason: source_note
  - marker: b
    text: 여기서 ψυχή는 ‘영혼’으로도 옮길 수 있으나, 위험에서 벗어나 생존하는 문맥에서는 ‘생명’이 더 알맞습니다.
    reason: lexical_alternative
  - marker: c
    text: παροικία는 고향을 떠나 타향에 머무는 이들의 공동체를 가리킬 수 있습니다. ‘거류 공동체’ 또는 ‘디아스포라’로도 이해될 수 있습니다.
    reason: cultural_note
  - marker: d
    text: 그리스어의 ‘구원받을’은 수동형입니다. 따라서 그들이 자기 생명을 스스로 구원했다는 뜻으로 한정하지 않았습니다.
    reason: grammar_note
