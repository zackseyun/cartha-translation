  rationale: 목적을 나타내는 수동 부정사 σωθῆναι를 ‘구원받을 수 있도록’으로 옮겨 문법적 수동성과 목적 관계를 보존했습니다. 한국어에 부자연스러운 기계적 복수형과 분리된 설명문을 고치고, παροικία의 의미 범위는 번역과 각주에서 모두 보존했습니다.
