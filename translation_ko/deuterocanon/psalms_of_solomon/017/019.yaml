  source_fidelity: 수동 부정사 σωθῆναι의 의미를 살리려 한 점과 ψυχή를 생존 맥락의 ‘생명’으로 옮긴 점은 적절합니다. 다만 ‘그것은 … 것이었습니다’는 그리스어의 목적 관계를 부자연스럽게 분리하며, ‘광야들’은 복수형을 지나치게 기계적으로 드러낸 표현입니다.
  naturalness: ‘그들은 자기 생명이 악에서 구원받을 수 있도록 여러 광야를 떠돌았습니다’가 현대 표준 한국어의 자연스러운 합쇼체이면서 목적과 수동 의미를 모두 보존합니다. ‘나그네 공동체의 눈에는’보다 ‘타향에 머무는 공동체가 보기에’가 παροικία의 공동체적 거류 의미를 더 자연스럽게 전달합니다.
  terminology: ‘생명’은 두 ψυχή에 일관되게 적합합니다. παροικία는 특정한 역사·신학 용어인 ‘디아스포라’로 단정하지 않고 ‘타향에 머무는 공동체’로 번역하여 원문의 폭을 보존합니다. ‘악’은 κακόν의 폭을 유지합니다.
