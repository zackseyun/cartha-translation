translation:
  language: ko
  text: 하나님께서는 그들에게 자비를 베풀지 않으셨습니다.[b] 그들의 씨[a]를 찾아내시고, 그들 가운데 하나도 남겨 두지 않으셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 후손’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하나님께서 그들을 아끼지 않으셨습니다.’
    reason: previous_rendering
lexical_decisions:
- source_word: ἐλέησεν
  english_pob_choice: did not have mercy on
  chosen_korean: 자비를 베풀지 않으셨습니다
  alternatives_korean:
  - 불쌍히 여기지 않으셨습니다
  - 긍휼을 베풀지 않으셨습니다
  - 용서하지 않으셨습니다
  lexicon: BDAG
  rationale: 이 동사는 단순한 처벌보다 ‘자비/긍휼을 베풂’의 부재를 뜻하므로, POB의 판단처럼 심판 문맥을 유지하면서도 ‘베풀지 않으셨습니다’로 다듬었습니다.
- source_word: ἐξερεύνησεν
  english_pob_choice: searched out
  chosen_korean: 찾아내시고
  alternatives_korean:
  - 샅샅이 찾아내시고
  - 조사하시고
  - 수색하시고
  lexicon: BDAG
  rationale: 철저한 탐색의 뉘앙스를 살리되 한국어에서 자연스럽게 읽히도록 ‘찾아내시고’로 옮겼습니다.
- source_word: τὸ σπέρμα αὐτῶν
  english_pob_choice: their offspring
  chosen_korean: 그들의 씨
  alternatives_korean:
  - 그들의 후손
  - 그들의 자손
  - 그들의 씨앗
  lexicon: BDAG
  rationale: 각주가 제시하듯 이 표현은 문자적 씨앗보다 혈통/후손을 가리킬 수 있으므로, 원문 이미지와 모호성을 함께 보존하는 ‘씨’를 본문에 두고, 의미를 풀 수 있게 했습니다.
- source_word: οὐκ ἀφῆκεν αὐτῶν ἕνα
  english_pob_choice: did not leave one of them
  chosen_korean: 그들 가운데 하나도 남겨 두지 않으셨습니다
  alternatives_korean:
  - 그들 중 하나도 남기지 않으셨습니다
  - 한 사람도 남겨 두지 않으셨습니다
  - 그들 하나도 남겨 두지 않으셨습니다
  lexicon: BDAG
  rationale: 원문의 총체적 부정을 한국어로 자연스럽게 살리기 위해 ‘하나도 남겨 두지 않으셨습니다’로 옮겼습니다.
theological_decisions:
- issue: 심판 문맥에서의 ἐλέησεν 해석
  chosen_reading: 하나님의 행위를 ‘자비를 베풀지 않으셨습니다’로 번역해, 단순한 형벌 집행이 아니라 자비의 거절이라는 점을 드러냈습니다.
  alternative_readings:
  - 그들에게 불쌍히 여기지 않으셨습니다
  - 그들을 용서하지 않으셨습니다
  - 그들을 아끼지 않으셨습니다
  rationale: 이 문맥에서는 ἐλεέω의 언약적·자비적 의미가 핵심이므로, ‘사면/아낌’과 혼동되지 않도록 별도의 어휘로 구분했습니다.
  doctrine_reference: divine mercy in judgment
