lexical_decisions:
- source_word: αἱ ἁμαρτίαι
  english_pob_choice: sins
  chosen_korean: 죄
  alternatives_korean:
  - 죄악들
  - 죄들
  lexicon: LSJ
  rationale: 복수형 명사로서 구체적인 잘못들을 가리키므로, 자연스럽고 직접적인 한국어 대응인 ‘죄’를 택했습니다.
- source_word: ἐν ἀποκρύφοις
