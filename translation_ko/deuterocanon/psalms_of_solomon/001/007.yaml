  lexicon: LSJ
  rationale: 미완료 과거형의 인식 부재를 가장 평이하고 문맥에 맞게 나타내는 표현으로 선택했습니다.
theological_decisions:
- issue: ‘은밀한 곳’의 범위
  chosen_reading: 죄가 물리적인 ‘장소’에 있었다기보다 숨겨진 방식으로 드러나지 않았다는 뜻을 열어 둡니다.
  alternative_readings:
  - 죄를 비밀 장소에 숨겼다는 뜻
  - 죄가 은폐된 상태였다는 뜻
  rationale: ἐν ἀποκρύφοις는 간결하고 다의적이어서, 문맥을 넘어서 특정한 신학적·공간적 결론으로 좁히지 않는 것이 POB의 원문 충실성에 맞습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
