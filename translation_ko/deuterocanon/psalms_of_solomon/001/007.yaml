  lexicon: LSJ
  rationale: 이 표현은 ‘숨겨진 것들/장소들’의 뉘앙스를 지니므로, 한국어에서는 장소감과 은폐성을 함께 살리는 ‘은밀한 곳에’로 옮겼습니다.
- source_word: καὶ ἐγώ
  english_pob_choice: and I
  chosen_korean: 그리고 나는
  alternatives_korean:
  - 하지만 나는
  - 나도
