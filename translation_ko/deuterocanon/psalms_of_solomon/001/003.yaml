base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/001/003.yaml
  text: I thought in my heart that I was filled with righteousness when I prospered and became great in children[a][b][c].
  footnotes:
  - marker: a
    text: Or 'justice.' The Greek word can mean either, but here it most likely refers to perceived righteousness.
    reason: lexical_alternative
  - marker: b
    text: Literally 'and to become much in children,' that is, 'to have many children' or 'to increase in offspring.'
    reason: lexical_alternative
  - marker: c
    text: Or 'I had been filled with righteousness, when I prospered and became abundant'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 내 마음속으로, 내가 의로움으로 가득 찼다고 생각했습니다. 내가 번성하고 자녀가 많아졌을 때 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉 ‘자녀가 많아졌다’는 뜻입니다. Greek의 ἐν τέκνοις는 직역하면 ‘자녀들 가운데/안에서’이지만, 문맥상 자녀의 많아짐을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλογισάμην ἐν καρδίᾳ μου
  english_pob_choice: I thought in my heart
  chosen_korean: 나는 내 마음속으로 생각했습니다
  alternatives_korean:
  - 나는 내 마음에 생각했습니다
  - 나는 속으로 생각했습니다
  lexicon: LSJ
  rationale: λογίζομαι는 내적 숙고를 가리키므로, 한국어에서는 자연스러운 내면 독백 표현으로 옮기되 ‘마음속으로’로 내부 판단을 살렸습니다.
- source_word: ἐπλήσθην δικαιοσύνης
  english_pob_choice: I was filled with righteousness
  chosen_korean: 의로움으로 가득 찼다고
  alternatives_korean:
  - 의로움으로 충만했다고
  - 의로움으로 채워졌다고
  - 정의로 가득 찼다고
  lexicon: LSJ
  rationale: δικαιοσύνη는 기본적으로 ‘의’이지만, 이 절의 자기평가 문맥에서는 ‘의로움’이 한국어로 더 자연스럽게 내적 도덕 상태를 드러냅니다.
- source_word: ἐν τῷ εὐθηνῆσαί με καὶ πολλὴν γενέσθαι ἐν τέκνοις
  english_pob_choice: when I prospered and became great in children
  chosen_korean: 내가 번성하고 자녀가 많아졌을 때
  alternatives_korean:
  - 내가 형통하고 자녀가 많아졌을 때
  - 내가 번성하여 자녀가 풍성해졌을 때
  - 내가 번성하고 자녀들 가운데 크게 되었을 때
  lexicon: LSJ
  rationale: εὐθηνέω는 번성·형통의 의미가 있어 ‘번성하다’로, πολλὴν γενέσθαι ἐν τέκνοις는 직역의 어색함을 줄이면서 ‘자녀가 많아지다’로 옮겼습니다.
theological_decisions:
- issue: δικαιοσύνη의 의미 범위
  chosen_reading: 문맥상 ‘의로움’으로 옮기되, 개념상 ‘의/정의’의 여지를 남깁니다.
  alternative_readings:
  - 정의
  - 의
  rationale: 화자가 자신의 번영을 근거로 도덕적 상태를 평가하는 내적 독백이므로, ‘정의’보다 ‘의로움’이 자기인식의 뉘앙스를 더 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md contested terms: δικαιοσύνη → righteousness'
