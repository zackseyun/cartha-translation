translation:
  language: ko
  text: 그들의 불법 행위는 그들보다 앞선 민족들의 불법 행위보다 더 심했으며, 그들은 주님의 거룩한 것들을 모독하여 더럽혔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 성소’ 또는 ‘주님의 거룩한 곳들’. 그리스어 ‘주님의 거룩한 것들’은 복수형이며, 넓게는 성스러운 것들이나 성소를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἱ ἀνομίαι
  english_pob_choice: Their lawless deeds
  chosen_korean: 그들의 불법
  alternatives_korean:
  - 그들의 불법 행위
  - 그들의 죄악
  - 그들의 불법적인 행실
  lexicon: LSJ
  rationale: 복수형 추상명사 αἱ ἀνομίαι는 개별 행위와 상태를 함께 가리킬 수 있어, 한국어에서는 간결하게 ‘불법’으로 옮기되 문맥상 행위성은 뒤의 동사 구조가 보완합니다.
- source_word: ὑπὲρ τὰ πρὸ αὐτῶν ἔθνη
  english_pob_choice: surpassed those of the nations before them
  chosen_korean: 그들보다 앞선 민족들의 것보다 더 심했으며
  alternatives_korean:
  - 그들보다 먼저 있던 민족들의 것보다 더 컸으며
  - 그들 앞선 민족들의 것보다 더 넘쳤으며
  - 그들 이전의 민족들보다 더 심했으며
  lexicon: LSJ
  rationale: ὑπέρ + 대격 비교는 단순 비교를 넘어 ‘더 심하다/더 크다’의 우월 비교를 담으므로, 자연스러운 한국어로는 ‘더 심했으며’가 가장 직접적입니다.
- source_word: ἐβεβήλωσαν τὰ ἅγια Κυρίου
  english_pob_choice: they profaned the holy things of the Lord
  chosen_korean: 주님의 거룩한 것들을 모독으로 더럽혔습니다
  alternatives_korean:
  - 주님의 성소를 모독했습니다
  - 주님의 거룩한 것들을 더럽혔습니다
  - 주님의 성물을 모독했습니다
  lexicon: LSJ
  rationale: τὰ ἅγια는 문맥에 따라 성소/거룩한 것들로 갈릴 수 있으나, 여기서는 plural을 살려 ‘거룩한 것들’로 두고, βεβηλόω는 ‘모독하다/더럽히다’의 결합으로 강한 경멸과 훼손의 뉘앙스를 보존했습니다.
- source_word: ἐν βεβηλώσει
  english_pob_choice: with profanation
  chosen_korean: 모독으로
  alternatives_korean:
  - 더럽힘으로
  - 모독 가운데
  - 부정으로
  lexicon: LSJ
  rationale: 동족어 반복이 강조하는 수단·양태를 한국어 조사구로 간단히 살려, ‘모독으로’가 원문의 중첩 효과를 가장 압축적으로 반영합니다.
theological_decisions:
- issue: τὰ ἅγια Κυρίου를 성소로 좁힐지, 거룩한 것들로 넓힐지
  chosen_reading: 거룩한 것들
  alternative_readings:
  - 성소
  - 주님의 성물
  - 주님의 거룩한 곳들
  rationale: 그리스어 중성 복수는 특정 건물 하나만이 아니라 성전 관련 거룩한 대상 전반을 가리킬 수 있으므로, 문장 자체가 허용하는 범위를 유지해 더 넓은 ‘거룩한 것들’을 택했습니다.
  doctrine_reference: Second Temple cultic terminology; lexical scope of τὰ ἅγια
