    text: 또는 ‘주님의 성소’ 또는 ‘주님의 거룩한 곳들’. 그리스어 ‘주님의 거룩한 것들’은 복수형이며, 넓게는 성스러운 것들이나 성소를 가리킬 수 있습니다.
    reason: lexical_alternative
