base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/001/004.yaml
  text: Their wealth was spread throughout all the land[c][b][a], and their glory reached to the end of the earth.
  footnotes:
  - marker: a
    text: Or 'Their wealth was spread throughout all the earth.' The Greek γῆ can mean either 'land' or 'earth.'
    reason: lexical_alternative
  - marker: b
    text: Or 'their renown' for 'their glory.' Greek δόξα can refer to honor or reputation as well as splendor.
    reason: lexical_alternative
  - marker: c
    text: Or 'and their glory reached to the end of the earth.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들의 재물은 온 땅에 퍼졌고, 그들의 영광은 땅 끝에까지 이르렀습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 재물은 온 세상에 퍼졌습니다.’ 여기서 그리스어 γῆ는 ‘땅’이나 ‘세상/지구’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 명성’으로도 옮길 수 있습니다. 그리스어 δόξα는 영광뿐 아니라 명예나 평판을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그들의 영광은 땅 끝에까지 이르렀습니다.’
    reason: previous_rendering
lexical_decisions:
- source_word: ὁ πλοῦτος
  english_pob_choice: wealth
  chosen_korean: 재물
  alternatives_korean:
  - 부
  - 부유함
  - 재산
  lexicon: LSJ
  rationale: πλοῦτος는 문맥상 축적된 물질적 소유를 가리키므로, 현대 한국어에서 자연스럽고 격조 있는 ‘재물’이 적절합니다.
- source_word: διεδόθη
  english_pob_choice: was spread
  chosen_korean: 퍼졌습니다
  alternatives_korean:
  - 전해졌습니다
  - 흩어졌습니다
  - 퍼져 나갔습니다
  lexicon: LSJ
  rationale: διαδίδωμι의 수동은 널리 퍼져 확산된 뜻이므로, 이어지는 ‘온 땅에’와 잘 맞는 ‘퍼졌습니다’로 옮겼습니다.
- source_word: εἰς πᾶσαν τὴν γῆν
  english_pob_choice: throughout all the land
  chosen_korean: 온 땅에
  alternatives_korean:
  - 온 땅으로
  - 온 나라에
  - 온 세상에
  lexicon: LSJ
  rationale: γῆ는 여기서 첫 번째 절에서는 지역적 확산의 범위를 가리키므로, POB의 구분을 살려 ‘온 땅’으로 옮겼습니다.
- source_word: ἡ δόξα
  english_pob_choice: glory
  chosen_korean: 영광
  alternatives_korean:
  - 명예
  - 명성
  - 평판
  lexicon: LSJ
  rationale: δόξα는 영예와 위광, 명성을 아우르지만, 시적 병행을 살리면서도 격조를 유지하는 표준 번역어는 ‘영광’입니다.
theological_decisions:
- issue: 두 번째 절의 동사 생략(시적 생략)
  chosen_reading: ‘그들의 영광은 땅 끝에까지 이르렀습니다’로 보완해 한국어 문장을 자연스럽게 하되, 의미는 과하게 확장하지 않았습니다.
  alternative_readings:
  - 동사를 보충하지 않고 ‘그들의 영광, 땅 끝에까지’처럼 직역하기
  - ‘그들의 영광은 땅 끝까지’로 압축하기
  rationale: 그리스어는 두 번째 절에서 동사를 생략한 병행구조이므로, 한국어에서는 자연성을 위해 최소한의 동사를 보충하되 시적 압축성을 유지했습니다.
  doctrine_reference: 시편적 평행법과 시적 생략
