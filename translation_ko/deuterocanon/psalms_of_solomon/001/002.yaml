  yaml_path: translation/deuterocanon/psalms_of_solomon/001/002.yaml
  text: Suddenly[a], a cry of war was silenced before me; he will hear me[c][b], because I am filled with righteousness.
  footnotes:
  - marker: a
    text: Or 'battle cry' for 'cry of war.'
    reason: lexical_alternative
  - marker: b
