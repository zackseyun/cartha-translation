    reason: lexical_alternative
  - marker: c
    text: Or 'a deafening cry of war was before me'.
    reason: previous_rendering
translation:
  language: ko
  text: 갑자기 전쟁의 외침[a][c]이 제 앞에서 잠잠해졌습니다. 그분은 제 말을 들으실 것입니다. 이는 제가 의[b]로 가득 차 있기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘전쟁의 외침’은 ‘전쟁의 함성’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘의’는 여기서 ‘의로움’ 또는 ‘정의’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 구절은 ‘전쟁의 외침이 제 앞에서 귀청이 먹먹할 만큼 울렸습니다’로 이해하는 번역도 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ἐξάπινα
  english_pob_choice: Suddenly
  chosen_korean: 갑자기
  alternatives_korean:
  - 순식간에
  - 문득
  lexicon: LSJ
  rationale: 갑작스러운 발화를 나타내는 부사로, 현대 한국어에서 가장 자연스럽고 원문의 돌발성을 잘 살립니다.
- source_word: κωφωθὴ
  english_pob_choice: was silenced
  chosen_korean: 잠잠해졌습니다
  alternatives_korean:
  - 귀먹게 되었습니다
  - 묵묵해졌습니다
  - 잠재워졌습니다
  lexicon: LSJ
  rationale: 본문의 핵심은 전쟁의 외침이 들리지 않게 된 상태이며, 한국어에서는 ‘잠잠해지다’가 그 효과를 자연스럽게 전달합니다.
- source_word: κραυγὴ πολέμου
  english_pob_choice: cry of war
  chosen_korean: 전쟁의 외침
  alternatives_korean:
  - 전쟁의 함성
  - 전투의 외침
  lexicon: LSJ
  rationale: 직역 구조를 유지하되, 한국어에서는 ‘외침’이 가장 무난하게 원문의 호소적·폭력적 소리를 전달합니다.
- source_word: ἐπλήσθην δικαιοσύνης
  english_pob_choice: I am filled with righteousness
  chosen_korean: 제가 의로움으로 가득 차 있기 때문입니다
  alternatives_korean:
  - 제가 의로 충만하기 때문입니다
  - 제가 의로움으로 채워졌기 때문입니다
  lexicon: LSJ
  rationale: aorist 수동형의 결과 상태를 살리면서도, 문맥상 원인이 되는 상태를 한국어 자연문으로 표현했습니다. δικαιοσύνη는 기본값인 ‘의’에 더해 시적 문맥상 ‘의로움’도 가능해 보이지만, 여기서는 상태적 울림을 위해 ‘의로움’으로 옮겼습니다.
- source_word: ἐπακούσεταί μου
  english_pob_choice: he will hear me
  chosen_korean: 그는 저를 들으실 것이니
  alternatives_korean:
  - 그는 제 말을 들으실 것이니
  - 그는 제게 응답하실 것이니
  lexicon: LSJ
  rationale: 직접적인 신적 응답을 너무 앞당겨 넣지 않고, 원문의 ‘듣다’ 의미를 살리면서 기도문 맥락에 맞는 존대 종결을 사용했습니다.
theological_decisions:
- issue: ἠ/κωφωθὴ 관련 의미를 ‘잠잠해졌다’로 볼지, ‘들렸다/들려졌다’로 볼지
  chosen_reading: 전쟁의 외침이 앞에서 잠잠해진 상태로 이해했습니다.
  alternative_readings:
  - 전쟁의 외침이 제 앞에서 들렸습니다
  - 전쟁의 외침이 제 앞에서 귀청이 떨어질 듯했습니다
  rationale: 제공된 그리스어 형태와 POB의 수정 이력을 함께 고려할 때, 단순 청각 인지가 아니라 소리의 힘이 꺾이거나 잠잠해진 효과를 번역하는 것이 가장 적절합니다.
  doctrine_reference: 본문의 시적 이미지 보존
