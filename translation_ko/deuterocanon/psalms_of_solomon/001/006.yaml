translation:
  language: ko
  text: 그리고 그들은 자기들의 풍요[a][c] 속에서 오만하게 행동했으며, 견디지 못했습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기들의 좋은 것들 가운데서’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘견디지 못했다’, ‘버티지 못했다’로도 옮길 수 있습니다. 그리스어는 무엇을 견디지 못했는지 목적어를 밝히지 않습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘자기들의 번영 가운데서’.
    reason: previous_rendering
lexical_decisions:
- source_word: ἐξύβρισαν
  english_pob_choice: acted arrogantly / were insolent
  chosen_korean: 거만해졌으며
  alternatives_korean:
  - 오만하게 행동했으며
  - 무례하게 굴었으며
  - 횡포를 부렸으며
  lexicon: LSJ
  rationale: ὑβρίζω 계열의 동사는 단순한 예의 없음보다 과도한 오만과 거만함을 가리키므로, 현대 한국어에서 그 힘을 가장 자연스럽게 드러내는 ‘거만해지다’를 선택했습니다.
- source_word: ἐν τοῖς ἀγαθοῖς αὐτῶν
  english_pob_choice: in their prosperity / amid their good things
  chosen_korean: 자기들의 풍요로움 속에서
  alternatives_korean:
  - 자기들의 번영 속에서
  - 자기들의 좋은 것들 가운데서
  - 자기들의 재물 속에서
  lexicon: LSJ
  rationale: 복수형 ἀγαθά는 단순한 ‘좋은 것들’보다 재산·번영·안락을 포함하는 풍요의 영역을 가리킬 수 있으므로, 문맥에 맞게 ‘풍요로움’으로 옮겼습니다.
- source_word: οὐκ ἤνεγκαν
  english_pob_choice: they did not endure
  chosen_korean: 끝내 견디지 못했습니다
  alternatives_korean:
  - 견디지 못했습니다
  - 버티지 못했습니다
  - 감당하지 못했습니다
  lexicon: LSJ
  rationale: 동사 φέρω의 이 형태는 목적어가 생략된 채 ‘견디다/버티다’의 뜻으로 쓰일 수 있어, 간결하면서도 한국어에서 자연스러운 ‘견디지 못했습니다’로 옮겼습니다.
