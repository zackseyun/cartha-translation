base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/001/001.yaml
  text: I cried out to the Lord when I was afflicted to the end[c][b][a], to God when sinners attacked.
  footnotes:
  - marker: a
    text: Or possibly 'when I was afflicted completely/continually'; the phrase 'to the end' translates Greek εἰς τέλος quite literally and may function idiomatically as an intensifier.
    reason: lexical_alternative
  - marker: b
    text: The Greek expression behind 'when sinners attacked' is difficult. The verb may carry a different nuance such as 'came upon' or another hostile action; the translation reflects the probable sense in this lament context.
    reason: alternative_reading
  - marker: c
    text: Or 'in my being afflicted'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 크게 부르짖어 주님께 외쳤습니다. 내가 끝까지 고통받을 때에 하나님께, 죄인들이 덮쳐 왔을 때에.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘끝까지’는 εἰς τέλος의 비교적 문자적인 옮김으로, ‘완전히/지속적으로’라는 강조로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘덮쳐 왔을 때에’는 ἐπιδέσθαι의 난해한 뜻을 문맥상 적대적 행동으로 풀어 옮긴 것입니다. ‘다가왔을 때에’ 또는 ‘공격했을 때에’로도 볼 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἘΒΟΗΣΑ
  english_pob_choice: I cried out
  chosen_korean: 크게 부르짖어 … 외쳤습니다
  alternatives_korean:
  - 외쳤습니다
  - 불렀습니다
  lexicon: LSJ
  rationale: 보아오의 강한 호소를 살리기 위해 단순한 '불렀습니다'보다 '크게 부르짖어'를 보강해, 시편적 탄원문맥의 급박함을 드러냈습니다.
- source_word: πρὸς Κύριον / πρὸς τὸν θεόν
  english_pob_choice: to the Lord / to God
  chosen_korean: 주님께 / 하나님께
  alternatives_korean:
  - 주께 / 하나님께
  - 주님에게 / 하나님에게
  lexicon: LSJ
  rationale: πρός+대격의 방향성을 한국어 조사 '-께'로 자연스럽게 옮기면서, κύριος는 프로젝트 기본어인 '주님', θεός는 '하나님'으로 유지했습니다.
- source_word: ἐν τῷ θλίβεσθαί με
  english_pob_choice: when I was afflicted
  chosen_korean: 내가 … 고통받을 때에
  alternatives_korean:
  - 내가 괴로움을 당할 때에
  - 내가 압제를 당할 때에
  lexicon: LSJ
  rationale: 작은사전식 추상명사화보다, 수동적 현재분사적 뉘앙스를 살려 '고통받다'로 옮겨 시간적 의미를 분명히 했습니다.
- source_word: εἰς τέλος
  english_pob_choice: to the end
  chosen_korean: 끝까지
  alternatives_korean:
  - 완전히
  - 철저히
  - 끝에 이르도록
  lexicon: LSJ
  rationale: 직역의 'to the end'를 한국어에서는 관용적으로 자연스러운 '끝까지'로 옮겨, 강도 또는 지속의 강조를 보존했습니다.
- source_word: ἐν τῷ ἐπιδέσθαι ἁμαρτωλοῦς
  english_pob_choice: when sinners attacked
  chosen_korean: 죄인들이 덮쳐 왔을 때에
  alternatives_korean:
  - 죄인들이 공격했을 때에
  - 죄인들이 다가왔을 때에
  - 죄인들이 몰려왔을 때에
  lexicon: LSJ
  rationale: ἐπιδέσθαι의 의미가 난해하므로, 문맥상 적대적 행동을 나타내는 '덮쳐 오다'를 택해 침해·위협의 뉘앙스를 살렸습니다.
- source_word: ἁμαρτωλοῦς
  english_pob_choice: sinners
  chosen_korean: 죄인들
  alternatives_korean:
  - 악인들
  - 죄 많은 사람들
  lexicon: LSJ
  rationale: ἁμαρτωλούς의 직접적 대응으로 '죄인들'을 유지해, 도덕적·신학적 분류를 흐리지 않았습니다.
theological_decisions:
- issue: 두 번의 신적 호칭을 평행 구조로 유지할지 여부
  chosen_reading: 주님께 … 하나님께를 병렬로 유지했습니다.
  alternative_readings:
  - 한 번의 호칭으로 합쳐 표현함
  - 주님께만 두고 뒤 절을 생략함
  rationale: 그리스어는 동일한 탄원 행위를 두 대상에게 병렬적으로 배치하므로, 중복을 줄이지 않고 반복 구조를 보존하는 편이 시의 압박감과 절규의 강화 효과를 더 잘 드러냅니다.
  doctrine_reference: 시적 평행법 보존 원칙
