base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/001/001.yaml
  text: I cried out to the Lord when I was afflicted to the end[c][b][a], to God when sinners attacked.
  footnotes:
  - marker: a
    text: Or possibly 'when I was afflicted completely/continually'; the phrase 'to the end' translates Greek εἰς τέλος quite literally and may function idiomatically as an intensifier.
    reason: lexical_alternative
  - marker: b
    text: The Greek expression behind 'when sinners attacked' is difficult. The verb may carry a different nuance such as 'came upon' or another hostile action; the translation reflects the probable sense in this lament context.
    reason: alternative_reading
  - marker: c
    text: Or 'in my being afflicted'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 끝까지[a] 고통을 당할 때에 주님께, 죄인들이 덮쳐 왔을 때에[b] 하나님께 부르짖었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘끝까지’는 εἰς τέλος의 비교적 문자적인 옮김으로, ‘완전히’ 또는 ‘지속적으로’라는 강조로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘덮쳐 왔을 때에’는 ἐπιδέσθαι의 난해한 뜻을 문맥상 적대적 행동으로 풀어 옮긴 것입니다. ‘다가왔을 때에’ 또는 ‘공격했을 때에’로도 볼 수 있습니다.
    reason: alternative_reading
