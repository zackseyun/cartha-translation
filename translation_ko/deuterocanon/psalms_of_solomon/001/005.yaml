translation:
  language: ko
  text: 그들은 별들에 이르기까지 높아졌습니다. 그들은 말했습니다. “우리는 결코 넘어지지 않을 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑψώθησαν
  english_pob_choice: were exalted
  chosen_korean: 높아졌습니다
  alternatives_korean:
  - 들려 올려졌습니다
  - 고양되었습니다
  - 높이 올려졌습니다
  lexicon: BDAG; LSJ
  rationale: 수동형 ὑψόω의 공간적·비유적 상승을 살리면서도, v. 4의 자랑스러운 맥락에서 과도한 해석어인 ‘고양되다’보다 자연스럽게 높아진 상태를 나타냅니다.
- source_word: ἕως τῶν ἄστρων
  english_pob_choice: to the stars
  chosen_korean: 별들에 이르기까지
  alternatives_korean:
  - 별들까지
  - 별들로부터 별들까지
  - 별들에 이르러
  lexicon: LSJ
  rationale: ἕως + 속격의 범위를 한국어의 ‘-에 이르기까지’로 옮겨, 과장된 높이의 이미지를 직접적으로 전달합니다.
- source_word: εἶπαν
  english_pob_choice: they said
  chosen_korean: 그들은 말했습니다
  alternatives_korean:
  - 그들은 선언했습니다
  - 그들은 이르기를
  lexicon: BDAG
  rationale: 단순한 서술 동사이므로 가장 직접적인 ‘말했습니다’가 적절합니다.
- source_word: Οὐ μὴ πέσωσιν
  english_pob_choice: We will certainly not fall
  chosen_korean: 우리는 결코 넘어지지 않을 것입니다
  alternatives_korean:
  - 우리는 절대로 넘어지지 않을 것입니다
  - 우리는 결코 쓰러지지 않을 것입니다
  lexicon: BDAG
  rationale: οὐ μή의 강한 부정을 ‘결코’로 살려 단순한 안정감이 아니라 단호하고 자만적인 확신의 어조를 드러냅니다. 한국어 주어는 문맥상 직접화법의 내용으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 절의 마지막 부정문을 어떤 어조로 옮길지
  chosen_reading: 자만에 찬 확언으로 읽히도록 ‘우리는 결코 넘어지지 않을 것입니다’로 옮겼습니다.
  alternative_readings:
  - 중립적인 안정 진술로 ‘우리는 넘어지지 않을 것입니다’로 옮길 수 있습니다.
  rationale: 문맥과 οὐ μή의 강한 부정은 단순한 보존 선언보다 교만한 자기확신을 가리키므로, 그 뉘앙스를 한국어에서도 보존했습니다.
  doctrine_reference: 시적·문학적 문맥의 화자 태도와 수사학적 강세
