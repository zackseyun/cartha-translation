  to: 그들은 별들에 이를 만큼 높이 올려졌습니다. 그들은 자신들이 결코 넘어지지 않을 것이라고 말했습니다.
  rationale: The revision corrects the person of πέσωσιν by using third-person indirect speech, while retaining οὐ μή’s emphatic force with ‘결코.’ It also renders ὑψώθησαν with an explicit Korean passive and preserves the hyperbolic extent ‘to/as far as the stars.’
  reviewer_model: gpt-5.6-terra
