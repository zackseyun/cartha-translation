revisions:
- from: 우리의 주님은 그의 심판들 안에서 영원히 의로우시고 거룩하십니다. 그리고 이스라엘은 기쁨으로 주님의 이름을 찬양할 것입니다.[a]
  to: 우리 주님은 그분의 심판에서 영원토록 의로우시고 거룩하십니다. 이스라엘은 기쁨으로 주님의 이름을 찬양할 것입니다.
  rationale: 본문을 자연스러운 현대 합쇼체로 다듬되, 주님의 의로움과 거룩함, 그분의 심판, 영속성, 이스라엘의 미래의 기쁜 찬양이라는 그리스어의 모든 핵심 요소를 보존했습니다. 한국어에서 부자연스러운 복수 표지와 ‘안에서’를 피하면서 κρίμασιν의 집합적 의미는 ‘심판’으로 유지했습니다. 실질적 번역 정보를 주지 않는 각주는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:09:48Z'
review_pass:
  verdict: revise
  source_fidelity: 그리스어의 κρίμασιν αὐτοῦ는 ‘그분의 심판들/심판에 있어서’이며, 초안의 ‘심판들 안에서’는 직역투로 부자연스럽습니다. 또한 εἰς τὸν αἰῶνα의 지속성을 ‘영원토록’으로 명확히 옮기는 편이 적절합니다. 두 번째 절의 미래형과 찬양의 기쁨은 잘 반영되어 있습니다.
  naturalness: ‘그의 심판들 안에서’는 현대 표준 한국어에서 부자연스럽고, ‘우리의 주님’도 가능하나 성서적 높임말 문맥에서는 ‘우리 주님’이 더 자연스럽습니다. 문두 술어 강조는 한국어에서 무리하게 재현하기보다 자연스러운 문장 안에서 보존하는 것이 좋습니다.
  terminology: δίκαιος와 ὅσιος는 각각 ‘의로우시고’와 ‘거룩하십니다’로 적절합니다. κύριος는 일관되게 ‘주님’으로, αἰνέσει는 ‘찬양할 것입니다’로 옮기는 것이 적합합니다. 영어 감사 이력의 대안 번역을 그대로 옮긴 현 각주는 한국어 본문에 의미 있는 대안을 제공하지 않고 앵커도 해당 절과 떨어져 있으므로 삭제하는 것이 좋습니다.
  issues:
