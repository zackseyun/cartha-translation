translation:
  language: ko
  text: 우리의 주님은 그의 심판들 안에서 영원히 의로우시고 거룩하십니다. 그리고 이스라엘은 기쁨으로 주님의 이름을 찬양할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리의 주님은 의로우시고 거룩하십니다’.
    reason: previous_rendering
lexical_decisions:
- source_word: δίκαιος
  english_pob_choice: righteous
  chosen_korean: 의로우시고
  alternatives_korean:
  - 의로우시며
  - 공의로우시고
  lexicon: BDAG
  rationale: 하나님에 대한 서술어로서 moral rightness와 신적 정당성을 함께 살리기 위해 '의롭다'를 택했습니다.
- source_word: ὅσιος
  english_pob_choice: holy
  chosen_korean: 거룩하십니다
  alternatives_korean:
  - 경건하십니다
  - 신실하십니다
  lexicon: BDAG
  rationale: δίκαιος와 구별되는 성스러움의 차원을 살리기 위해 '거룩하다'로 옮겼습니다.
- source_word: Κύριος ἡμῶν
  english_pob_choice: our Lord
  chosen_korean: 우리의 주님
  alternatives_korean:
  - 우리 주님
  - 우리의 주
  lexicon: BDAG
  rationale: κύριος를 주님으로 옮기되, 인칭대명사 '우리의'를 유지하여 공동체의 고백적 어감을 살렸습니다.
- source_word: κρίμασιν αὐτοῦ
  english_pob_choice: in his judgments
  chosen_korean: 그의 심판들 안에서
  alternatives_korean:
  - 그의 심판들 가운데
  - 그의 판결들 안에서
  lexicon: BDAG
  rationale: 복수형 κρίμασιν의 반복적·포괄적 심판 행위를 드러내기 위해 단수적 추상보다 복수형 표현을 유지했습니다.
- source_word: αἰνέσει
  english_pob_choice: will praise
  chosen_korean: 찬양할 것입니다
  alternatives_korean:
  - 찬송할 것입니다
  - 기릴 것입니다
  lexicon: BDAG
  rationale: 예배적 찬가의 문맥에서 단순한 칭찬보다 예배적 찬양의 뉘앙스를 더 잘 살립니다.
- source_word: ἐν εὐφροσύνῃ
  english_pob_choice: with gladness
  chosen_korean: 기쁨으로
  alternatives_korean:
  - 즐거움으로
  - 환희로
  lexicon: BDAG
  rationale: 명사 εὐφροσύνη의 정서적 의미를 자연스러운 한국어 부사구로 압축해 찬양의 태도를 드러냈습니다.
theological_decisions:
- issue: Greek predicate-first structure for emphasis (δίκαιος καὶ ὅσιος before Κύριος ἡμῶν).
  chosen_reading: 문두에 '의로우시고 거룩하십니다'를 두어 하나님의 속성을 먼저 강조했습니다.
  alternative_readings:
  - '''우리의 주님은 의로우시고 거룩하십니다''처럼 주어를 먼저 두는 방식'
  - '''우리의 주님은 의롭고 거룩하십니다''처럼 형용사 어미를 단순화하는 방식'
  rationale: 시편적 평행법에서 술어형 형용사의 전면 배치는 강조 기능이 있으므로, 한국어에서도 같은 수사적 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.
