    rationale: ἐν παιδείᾳ는 우선 ‘징계 가운데서/징계 안에서’이며, ‘-에서도’는 원문에 명시되지 않은 ‘심지어 그 경우에도’의 뉘앙스를 더할 수 있습니다.
