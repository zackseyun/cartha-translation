translation:
  language: ko
  text: 그분께서는 의인들의 길을 곧게 하셨으니, 징계 속에서도 그것을 비뚤게 하지 않으실 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘길’ 대신 ‘길들(들)’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘징계로’ 혹은 ‘교정으로’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘왜곡하다’, ‘뒤틀다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤρθωσε
  english_pob_choice: has made straight
  chosen_korean: 곧게 하셨으니
  alternatives_korean:
  - 바로잡으셨으니
  - 곧게 만드셨으니
  - 반듯하게 하셨으니
  lexicon: LSJ
  rationale: ὤρθωσε는 길을 ‘곧게 하다/바로잡다’는 뜻이므로, 한국어에서도 길의 직선 이미지를 살리는 ‘곧게 하셨으니’로 옮겼습니다.
- source_word: ὁδοὺς
  english_pob_choice: ways
  chosen_korean: 길
  alternatives_korean:
  - 길들
  - 길들(들)
  - paths
  lexicon: LSJ
  rationale: ὁδοὺς는 실제 길의 이미지를 지니므로, 한국어에서도 가장 자연스러운 ‘길’로 두어 의인의 행로라는 비유를 살렸습니다.
- source_word: δικαίων
  english_pob_choice: the righteous
  chosen_korean: 의인들
  alternatives_korean:
  - 의로운 사람들
  - 의인
  lexicon: LSJ
  rationale: δικαίων은 실체적 복수이므로 ‘의인들’이 간결하면서도 집합적 의미를 잘 드러냅니다.
- source_word: διαστρέψει
  english_pob_choice: will not pervert them
  chosen_korean: 비뚤게 하지 않으실 것입니다
  alternatives_korean:
  - 왜곡하지 않으실 것입니다
  - 굽게 하지 않으실 것입니다
  - 뒤틀지 않으실 것입니다
  lexicon: LSJ
  rationale: διαστρέψει는 ‘비틀다, 왜곡하다, 굽게 하다’의 뜻이므로, 앞의 ‘곧게 하다’와 대조되는 공간적 이미지를 살려 ‘비뚤게 하지 않다’로 옮겼습니다.
- source_word: ἐν παιδείᾳ
  english_pob_choice: in discipline
  chosen_korean: 징계 속에서도
  alternatives_korean:
  - 훈련 가운데서도
  - 교정 속에서도
  - 징계 가운데
  lexicon: LSJ
  rationale: παιδεία는 단순한 처벌보다 훈육·교정·훈련을 포함하므로, 문맥상 다소 엄중한 ‘징계’로 옮기되 ‘속에서도’로 예외 없는 보존을 드러냈습니다.
theological_decisions:
- issue: 징계와 의인의 길의 관계
  chosen_reading: 하나님께서는 의인의 길을 곧게 하시며, 징계의 과정에서도 그 길을 비뚤게 하지 않으십니다.
  alternative_readings:
  - 징계로 인해 의인 자신을 곁길로 보내지 않으십니다.
  - 징계하실 때에도 불의하게 대하지 않으십니다.
  rationale: 문장의 앞뒤가 ‘길’의 직선/왜곡 이미지를 이루므로, 추상적 교리화보다 앞 절의 길 비유를 유지하는 해석이 본문에 가장 가깝습니다.
  doctrine_reference: 하나님의 징계와 의인의 보존
