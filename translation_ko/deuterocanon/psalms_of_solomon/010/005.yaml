base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/010/005.yaml
  text: For the testimony is in the law of the everlasting covenant[a]; the testimony of the Lord is upon the ways of men in visitation.
  footnotes:
  - marker: a
    text: Or "For the testimony in the law of the everlasting covenant is the Lord's testimony concerning people's ways when he visits.".
    reason: previous_rendering
translation:
  language: ko
  text: 이는 곧 영원한 언약의 율법 안에 있는 증언이며, 주님의 증언은 사람들의 길 위에 — 심방 때에 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이는 곧 영원한 언약의 율법 안에 있는 증언이며, 사람들의 길에 대한 주님의 증언은 그가 방문하실 때에 있다.”
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρία
  english_pob_choice: testimony
  chosen_korean: 증언
  alternatives_korean:
  - 증거
  - 증언의 말
  lexicon: BDAG
  rationale: 법적·언약적 문맥에서 μαρτυρία는 단순한 ‘증거’보다 선언적이고 공적인 ‘증언’이 더 잘 맞습니다. 반복된 어휘를 살려 두 절의 평행을 유지했습니다.
- source_word: ἐν νόμῳ διαθήκης αἰωνίου
  english_pob_choice: in the law of the everlasting covenant
  chosen_korean: 영원한 언약의 율법 안에
  alternatives_korean:
  - 영원한 언약의 법 안에
  - 영원한 언약의 율법 속에
  lexicon: BDAG
  rationale: ἐν의 장소적 관계를 살려 ‘안에’로 옮기고, νόμος는 이 문맥에서 ‘법’보다 토라적·언약적 뉘앙스가 있는 ‘율법’이 더 적절합니다. διαθήκη는 ‘언약’, αἰώνιος는 ‘영원한’으로 자연스럽게 대응했습니다.
- source_word: Κυρίου
  english_pob_choice: the Lord
  chosen_korean: 주님의
  alternatives_korean:
  - 주의
  - 주님의
  lexicon: BDAG
  rationale: κύριος는 본문에서 신적 호칭이므로 한국어에서는 ‘주님’ 계열이 가장 자연스럽습니다. 반복되는 μαρτυρία와의 관계를 살려 소유격을 ‘주님의 증언’으로 처리했습니다.
- source_word: ἐπὶ ὁδοὺς ἀνθρώπων
  english_pob_choice: upon the ways of men
  chosen_korean: 사람들의 길 위에
  alternatives_korean:
  - 사람들의 길에
  - 사람의 길 위에
  lexicon: BDAG
  rationale: ἐπί + 대격의 ‘위에’라는 공간 이미지를 유지하되, ‘사람들’로 옮겨 ἀνθρώπων의 일반 인간성을 살렸습니다. 이는 단순한 방향 표현보다 삶의 행로 위에 놓인 증언이라는 감각을 줍니다.
- source_word: ἐν ἐπισκοπῇ
  english_pob_choice: in visitation
  chosen_korean: 심방 때에
  alternatives_korean:
  - 방문 때에
  - 감찰 중에
  - 심방 가운데
  lexicon: BDAG
  rationale: ἐπισκοπή는 ‘방문/감찰/돌봄’의 의미를 가질 수 있으나, 여기서는 신적 임재와 조사라는 성격이 강합니다. 교회적 어감의 ‘심방’은 어색할 수 있지만, 본문의 ‘방문하여 살피는’ 의미를 현대 한국어로 압축해 보여 주기 위해 채택했습니다.
theological_decisions:
- issue: ἐπισκοπῇ의 신적 '방문/감찰' 의미
  chosen_reading: ‘심방 때에’로 옮겨, 주님의 증언이 사람의 행위를 방문하여 살피는 심판적·조사적 성격을 드러냈습니다.
  alternative_readings:
  - ‘방문 때에’
  - ‘감찰 중에’
  - ‘돌보심 가운데’
  rationale: 본문은 단순한 우호적 방문이 아니라 인간의 길 위에 놓이는 하나님의 공적 조사라는 뉘앙스를 가집니다. 따라서 ‘방문/감찰’ 계열의 의미를 유지하되, 현대 독자가 이해할 수 있도록 압축했습니다.
  doctrine_reference: LXX의 ἐπισκοπή 용례와 하나님의 심판적 방문 모티프
- issue: 두 개의 평행 절 유지
  chosen_reading: 쉼표와 대시로 두 평행 진술을 분리해, ‘증언’의 반복과 병렬 구조를 보이게 했습니다.
  alternative_readings:
  - 단일 문장으로 연결
  - 세미콜론만 사용
  rationale: 그리스어는 반복된 ἡ μαρτυρία를 가진 평행 구조이므로, 한국어에서도 그 형식을 최대한 보존하는 것이 의미와 수사 효과를 살립니다.
  doctrine_reference: 히브리적 평행법과 그리스어 시적 문체
