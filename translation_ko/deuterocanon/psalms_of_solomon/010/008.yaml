  naturalness: 수정문은 현대 표준어 합쇼체로 자연스럽고, 인과 접속사 ὅτι를 ‘이는 … 때문입니다’로 분명하게 반영합니다.
  terminology: χρηστός는 ‘선하시고’, ἐλεήμων은 ‘자비로우시고’, κύριος는 ‘주님’으로 옮긴 것이 문맥상 적절합니다. ‘회중들’은 συναγωγαί의 공동체적 의미를 무리 없이 전달합니다.
