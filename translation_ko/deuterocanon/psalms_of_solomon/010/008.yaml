  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/010/008.yaml
  text: For God is kind and merciful forever[b][a], and the assemblies of Israel will glorify the name of the Lord.
  footnotes:
  - marker: a
    text: Or 'congregations' for 'assemblies.'
    reason: lexical_alternative
  - marker: b
    text: Or 'good' for 'kind.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 하나님께서 영원히 선하시고[a] 자비로우시기 때문입니다. 이스라엘의 회중들[b]은 주님의 이름에 영광을 돌릴 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘좋으시고’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘모임들’ 또는 ‘집회들’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηστὸς
  english_pob_choice: kind
  chosen_korean: 선하시고
  alternatives_korean:
  - 좋으시고
  - 친절하시고
  lexicon: BDAG
  rationale: 영어 POB의 kind는 하나님 성품의 선함과 인자함을 함께 가리키므로, 한국어에서는 ‘선하시고’로 옮겨 본문이 말하는 긍정적 성품을 자연스럽게 살렸습니다.
- source_word: ἐλεήμων
  english_pob_choice: merciful
  chosen_korean: 자비로우시기
  alternatives_korean:
  - 긍휼이 많으시기
  - 은혜로우시기
  lexicon: BDAG
  rationale: 하나님의 자비를 직접적으로 드러내는 표현으로 ‘자비로우시기’가 가장 곧고 현대적인 대응입니다.
- source_word: συναγωγαὶ
  english_pob_choice: assemblies
  chosen_korean: 회중들
  alternatives_korean:
  - 모임들
  - 집회들
  lexicon: BDAG
  rationale: 이스라엘의 모인 공동체를 가리키므로, later institution 연상을 덜어 주는 ‘회중들’이 원뜻을 잘 드러냅니다.
- source_word: δοξάσουσιν
  english_pob_choice: will glorify
  chosen_korean: 찬양할 것입니다
  alternatives_korean:
  - 영광을 돌릴 것입니다
  - 영화롭게 할 것입니다
  lexicon: BDAG
  rationale: 동사의 doxological force를 살리면서 한국어 성경 문맥에서 자연스럽게 읽히는 동적 대응으로 ‘찬양할 것입니다’를 택했습니다.
theological_decisions:
- issue: κύριος의 한국어 처리
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 주 하나님
  rationale: 본문의 Κυρίου는 영어 POB의 the Lord에 따라 하나님을 가리키는 호칭으로 읽히므로, 합쇼체 본문에서는 예배적·관계적 뉘앙스가 있는 ‘주님’이 자연스럽습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → Lord'
- issue: εἰς τὸν αἰῶνα의 지속성 표현
  chosen_reading: 영원히
  alternative_readings:
  - 영원토록
  - 세세토록
  rationale: ‘forever’의 현대 한국어 대응으로서, 시적이면서도 의미를 과장하지 않는 ‘영원히’가 가장 직접적입니다.
  doctrine_reference: BDAG αἰών idiom
