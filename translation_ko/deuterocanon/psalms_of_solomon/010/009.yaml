    text: 또는 무동사 절을 축복 또는 기원의 뜻으로 읽어, ‘주님의 구원이 이스라엘 집 위에 있기를 바랍니다’로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: σωφροσύνην은 ‘절제’ 외에 ‘신중함’, ‘건전한 정신’, ‘자제’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 εἰς를 목적이나 결과로 이해하여 ‘영원한 절제를 위하여’ 또는 ‘영원한 절제로’라고 옮길 수 있습니다.
    reason: previous_rendering
