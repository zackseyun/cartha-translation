base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/010/009.yaml
  text: The Lord’s salvation is upon the house of Israel for everlasting self-control[a][b][c].
  footnotes:
  - marker: a
    text: Or 'The Lord’s salvation be upon the house of Israel,' taking the verbless clause with an implied blessing-like force.
    reason: alternative_reading
  - marker: b
    text: Or 'prudence,' 'sound-mindedness,' or 'sobriety' for 'self-control.'
    reason: lexical_alternative
  - marker: c
    text: Or 'for everlasting self-control.'.
    reason: previous_rendering
translation:
  language: ko
  text: 주님의 구원이 이스라엘 집 위에 있어, 영원한 절제가 되게 하소서.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 무동사 절을 축복처럼 읽어 ‘주님의 구원이 이스라엘 집 위에 있습니다’로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: σωφροσύνην은 ‘절제’ 외에 ‘신중함’, ‘건전한 정신’, ‘자제’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 본문의 ελλην어는 제공된 원문에 따라 σωφροσύνην이지만, 주석 전통에는 εὐφροσύνην(‘기쁨/즐거움’)으로 보는 논의가 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: τοῦ κυρίου
  english_pob_choice: The Lord’s
  chosen_korean: 주님의
  alternatives_korean:
  - 주님의 것인
  - 주께서 베푸시는
  lexicon: BDAG
  rationale: 속격은 소유·관련의 의미로 가장 자연스럽게 읽히므로, 한국어에서는 보유격 ‘주님의’로 간결하게 옮겼습니다.
- source_word: ἡ σωτηρία
  english_pob_choice: salvation
  chosen_korean: 구원
  alternatives_korean:
  - 구속
  - 구제
  lexicon: BDAG
  rationale: 문맥의 종교적·구원론적 무게를 살리기 위해 ‘구원’으로 옮겼습니다.
- source_word: ἐπὶ οἶκον Ἰσραήλ
  english_pob_choice: is upon the house of Israel
  chosen_korean: 이스라엘 집 위에 있어
  alternatives_korean:
  - 이스라엘 집 위에
  - 이스라엘 집에 임하여
  lexicon: BDAG
  rationale: ‘ἐπὶ + 대격’의 상징적 부재/임함을 한국어로는 ‘위에 있어’로 표현해, 축복이 임해 있는 상태를 살렸습니다. ‘집’은 원문의 οἶκον을 유지합니다.
- source_word: σωφροσύνην
  english_pob_choice: self-control
  chosen_korean: 절제
  alternatives_korean:
  - 자제
  - 신중함
  - 건전한 정신
  lexicon: LSJ
  rationale: 한국어에서 σωφροσύνη의 윤리적 자기통제 의미를 가장 직접적으로 전달하는 말은 ‘절제’입니다. ‘신중함’은 지적 성향으로 좁아질 수 있어 배제했습니다.
theological_decisions:
- issue: 무동사 절의 번역과 축복적 뉘앙스
  chosen_reading: 명령형 기도체로 옮겨 ‘주님의 구원이 … 되게 하소서’라고 번역했습니다.
  alternative_readings:
  - '서술형: ‘주님의 구원이 이스라엘 집 위에 있습니다.’'
  - '희구형: ‘주님의 구원이 이스라엘 집 위에 있기를 바랍니다.’'
  rationale: 원문은 동사가 없는 절이라, POB 주해에 따라 축복문/기원문처럼 읽을 수 있습니다. 한국어에서는 그 힘을 살리기 위해 기도체 희구형을 택했습니다.
  doctrine_reference: Psalms of Solomon 10:9 주해의 무동사 절·축복적 읽기
