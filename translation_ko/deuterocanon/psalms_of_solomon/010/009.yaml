  source_fidelity: 원문의 무동사 절은 서술문 또는 축복·기원문으로 해석될 수 있습니다. 초안의 ‘되게 하소서’는 가능한 해석이지만, 영어 POB 본문의 서술적 선택과는 달리 기도체를 본문으로 확정하며, ‘구원이 … 절제가 되게’라는 관계도 εἰς의 목적·결과 용법을 부정확하게 처리합니다. 제공된 그리스어 σωφροσύνην에 따라 ‘절제’를 유지합니다.
  naturalness: ‘이스라엘 집 위에 있어, 영원한 절제가 되게 하소서’는 현대 한국어에서 연결 관계가 어색하고, ‘구원’이 ‘절제’로 변한다는 뜻으로 들릴 수 있습니다. 목적·결과를 ‘영원한 절제를 이루게 합니다’로 명시하면 자연스럽습니다.
  terminology: ‘주님’, ‘구원’, ‘이스라엘 집’, ‘절제’는 적절합니다. 각주 a는 본문과 대안의 관계를 뒤집었고, 각주 c의 ‘εὐφροσύνην’ 텍스트 이슈는 제공된 원문 및 영어 POB 각주 c의 기능과 일치하지 않으므로 삭제·교체해야 합니다.
