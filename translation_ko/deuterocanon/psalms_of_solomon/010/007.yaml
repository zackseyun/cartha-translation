  - marker: d
    text: 또는 ‘이스라엘의 즐거움 속에서’.
    reason: previous_rendering
lexical_decisions:
- source_word: ὅσιοι
  english_pob_choice: the pious
  chosen_korean: 경건한 이들
  alternatives_korean:
  - 신실한 이들
  - 거룩한 이들
  lexicon: LSJ
  rationale: 이 단어는 단순한 ‘거룩한’보다 경건과 언약적 충성을 드러내므로, POB의 ‘pious’를 따라 ‘경건한 이들’로 옮겼습니다.
- source_word: ἐξομολογήσονται
  english_pob_choice: will give thanks
  chosen_korean: 감사드릴 것입니다
  alternatives_korean:
  - 찬양할 것입니다
  - 고백할 것입니다
  lexicon: LSJ
  rationale: 시적·예배적 문맥에서 이 동사는 단순 고백보다 공적 감사의 뜻이 강하므로, ‘감사드리다’가 가장 자연스럽고 의미도 가깝습니다.
- source_word: ἐκκλησίᾳ λαοῦ
  english_pob_choice: the assembly of the people
  chosen_korean: 백성의 회중
  alternatives_korean:
  - 백성의 모임
  - 백성의 집회
  lexicon: LSJ
  rationale: 공적으로 모인 공동체를 가리키므로 ‘회중’이 적합하며, ‘백성의’로 소속 관계를 분명히 했습니다.
- source_word: ἐν εὐφροσύνῃ Ἰσραήλ
  english_pob_choice: in the gladness of Israel
  chosen_korean: 이스라엘의 기쁨 속에서
  alternatives_korean:
  - 이스라엘의 즐거움 안에서
  - 이스라엘의 기쁨 가운데
  lexicon: LSJ
  rationale: 여기서 ἐν은 장소라기보다 분위기·상태를 나타내므로, ‘기쁨 속에서’가 POB의 ‘gladness’와 본문의 장면성을 함께 살립니다.
- source_word: ἐλεήσει
  english_pob_choice: will have mercy on
  chosen_korean: 자비를 베푸실 것입니다
  alternatives_korean:
  - 긍휼을 베푸실 것입니다
  - 불쌍히 여기실 것입니다
  lexicon: LSJ
  rationale: 하나님의 적극적 자비 행위를 나타내므로, 현대 한국어에서 직접적이고 공손한 ‘자비를 베푸시다’가 적절합니다.
theological_decisions:
- issue: ὅσιοι의 공동체적 성격
  chosen_reading: ‘경건한 이들’은 개인적 도덕성만이 아니라 하나님께 충성하는 언약 공동체를 가리키는 표현으로 읽었습니다.
  alternative_readings:
  - ‘거룩한 이들’로 읽는 방식
  - ‘신실한 이들’로 읽는 방식
  rationale: Psalms of Solomon의 이 용례는 일반적 성결보다 특정한 경건한 집단을 가리키는 뉘앙스가 강하므로, ‘경건한 이들’이 가장 균형 잡힌 선택입니다.
  doctrine_reference: 시편 솔로몬 10편 문맥과 ὅσιοι 용례
