  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/010/001.yaml
  text: Blessed is the man whom the Lord remembered with rebuke[a], and who was turned away from an evil way by a scourge, to be cleansed from sin[e][d][c][b], so that it might not increase.
  footnotes:
  - marker: a
    text: Or 'with reproof' for 'with rebuke.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'was encircled'; the sense is that he was constrained or fenced off from an evil way.
    reason: lexical_alternative
  - marker: c
    text: The final clause may also be understood as 'so as not to increase [sin]' or 'so that he might not multiply it.'
    reason: alternative_reading
  - marker: d
    text: Or 'was hemmed in from'.
    reason: previous_rendering
  - marker: e
    text: Or 'by a scourge'.
    reason: previous_rendering
translation:
  language: ko
  text: 야훼께서 책망으로 기억하신 사람은 복되며, 악한 길에서 매질로 둘러싸여 죄에서 깨끗하게 되도록 하셨으니, 그것이 더 늘어나지 않게 하십니다.[a][b][c][d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘책망으로’이며, 여기서는 교정적 징계를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘둘러싸였다’이며, 뜻은 악한 길에서 억제되거나 에워싸여 벗어나게 되었다는 것입니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 절은 ‘죄가 더 늘어나지 않게’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: d
    text: 또는 ‘에워싸여’로 옮길 수 있습니다.
    reason: previous_rendering
  - marker: e
    text: 또는 ‘매질로’입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: Μακάριος
  english_pob_choice: Blessed
  chosen_korean: 복되며
  alternatives_korean:
  - 행복한
  - 복 있는
  lexicon: LSJ
  rationale: 축복 선언의 무게를 살리기 위해 단순한 감정 상태보다 ‘복되다’의 선언형을 택했습니다.
- source_word: ἐμνήσθη ἐν ἐλεγμῷ
  english_pob_choice: remembered with rebuke
  chosen_korean: 책망으로 기억하신
  alternatives_korean:
  - 꾸짖음으로 기억하신
  - 책망 가운데 기억하신
  - 책망과 함께 기억하신
  lexicon: LSJ
  rationale: ἐν ἐλεγμῷ의 징계적 뉘앙스를 ‘책망’으로 살리고, 기억하심이 단순 회상이 아니라 돌보심과 교정의 행위임을 드러냈습니다.
- source_word: ἐκυκλώθη ἀπὸ ὁδοῦ πονηρᾶς ἐν μάστιγι
  english_pob_choice: was turned away from an evil way by a scourge
  chosen_korean: 악한 길에서 매질로 둘러싸여
  alternatives_korean:
  - 악한 길에서 채찍으로 둘러싸여
  - 악한 길에서 채찍질로 둘러싸여
  - 악한 길에서 매로 둘러싸여
  lexicon: LSJ
  rationale: ἐκυκλώθη의 ‘둘러싸이다/에워싸이다’ 이미지를 살리되, 의미상 ‘제지되다’의 효과가 드러나도록 했고, μάστιξ는 행위의 고통을 분명히 하는 ‘매질’로 옮겼습니다.
- source_word: καθαρισθῆναι ἀπὸ ἁμαρτίας
  english_pob_choice: to be cleansed from sin
  chosen_korean: 죄에서 깨끗하게 되도록 하셨으니
  alternatives_korean:
  - 죄에서 정결하게 되도록 하셨으니
  - 죄에서 씻어 내도록 하셨으니
  - 죄로부터 깨끗하게 되도록 하셨으니
  lexicon: LSJ
  rationale: 부정적 상태의 제거를 한국어 자연문으로 전달하기 위해 ‘깨끗하게 되다’를 택했고, 수동적 목적을 살리기 위해 ‘되도록 하셨으니’로 연결했습니다.
- source_word: τοῦ μὴ πληθῦναι
  english_pob_choice: so that it might not increase
  chosen_korean: 그것이 더 늘어나지 않게 하십니다
  alternatives_korean:
  - 죄가 더 늘지 않게 하십니다
  - 그 죄가 번성하지 않게 하십니다
  - 그것이 더 많아지지 않게 하십니다
  lexicon: LSJ
  rationale: 문맥상 앞의 ‘죄’를 가리키는 것으로 이해되는 목적절을 한국어로 풀어, ‘더 늘어나지 않게’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 징계의 목적과 주체
  chosen_reading: 주께서 책망과 매질을 통해 사람을 죄에서 돌이키시고 정결하게 하시는 것으로 읽었습니다.
  alternative_readings:
  - 단순한 처벌 선언으로 읽기
  - 도덕적 자기수양의 결과로 읽기
  rationale: 본문은 고통 자체가 아니라 죄를 줄이고 정결하게 하는 목적을 분명히 하므로, 하나님의 교정적 주권을 드러내는 쪽이 문맥에 맞습니다.
  doctrine_reference: 징계와 성화, 신적 교정
- issue: ‘야훼’ 표기
  chosen_reading: 주어 κύριος를 문맥상 야훼로 옮겼습니다.
  alternative_readings:
  - 주님
  - 주
  rationale: 이 시편은 하나님을 가리키는 κύριος가 히브리 성호를 배경으로 하는 호칭이므로, 본 프로젝트의 원칙에 따라 야훼로 표기했습니다.
  doctrine_reference: LXX의 신명사 대치 원칙
