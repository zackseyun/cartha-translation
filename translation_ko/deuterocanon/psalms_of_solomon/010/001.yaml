  source_fidelity: 현 초안은 수동태인 ἐκυκλώθη와 καθαρισθῆναι를 ‘하셨으니/하십니다’로 풀어 주님의 직접적 행위와 현재 시제를 덧붙입니다. 또한 마지막 부정사절의 주어가 명시되지 않은 원문의 압축성과, 죄를 가리킬 가능성을 적절히 보존하지 못합니다. 수정안은 수동 표현과 목적 관계를 유지합니다.
