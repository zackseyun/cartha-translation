    reason: previous_rendering
translation:
  language: ko
  text: 매질을 위한 등을 준비하는 자는 깨끗하게 될 것입니다[a][b][c][d]. 주님은 징계를 견디는 이들에게 선하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정결하게 될 것입니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘매질을 위한’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘교정’ 혹은 ‘징계’.
    reason: lexical_alternative
  - marker: d
    text: 앞절과 같은 말로 ‘채찍’이라고도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ὁ ἑτοιμάζων
  english_pob_choice: The one who prepares
  chosen_korean: 등을 준비하는 자
  alternatives_korean:
  - 등을 마련하는 자
  - 등을 갖추는 자
  - 준비하는 자
  lexicon: BDAG
  rationale: 관사+현재분사 구조의 일반적 사람 지칭을 살려, 징계를 받을 태세를 스스로 갖추는 사람이라는 뜻이 드러나도록 옮겼습니다.
- source_word: νῶτον
  english_pob_choice: his back
  chosen_korean: 등
  alternatives_korean:
  - 등판
  - 등쪽
  lexicon: LSJ
  rationale: 직역하면 ‘등’이며, 한국어에서는 문맥상 소유를 굳이 덧붙이지 않아도 자연스럽습니다.
- source_word: εἰς μάστιγας
  english_pob_choice: for scourges
  chosen_korean: 매질을 위한
  alternatives_korean:
  - 채찍질을 위한
  - 채찍을 위한
  - 회초리를 위한
  lexicon: LSJ
  rationale: 뒤의 10:1과 같은 어근 μάστιξ와의 연결을 살리기 위해 ‘매질’로 통일했고, 소리나 도구보다 징계 행위를 직접 드러냈습니다.
- source_word: καθαρισθήσεται
  english_pob_choice: will be cleansed
  chosen_korean: 깨끗하게 될 것입니다
  alternatives_korean:
  - 정결하게 될 것입니다
  - 정화될 것입니다
  - 깨끗해질 것입니다
  lexicon: BDAG
  rationale: 청결/정결의 결과를 담되, 도덕적·교정적 정화의 폭을 너무 좁히지 않기 위해 가장 자연스러운 현대 한국어 표현을 선택했습니다.
- source_word: παιδείαν
  english_pob_choice: discipline
  chosen_korean: 징계
  alternatives_korean:
  - 훈육
  - 교정
  - 훈련
  lexicon: BDAG
  rationale: 여기서는 교육보다 교정적 징계의 의미가 강하므로, 한국어 성경 독자가 즉시 이해할 수 있는 ‘징계’로 옮겼습니다.
theological_decisions:
- issue: 징계를 통한 깨끗하게 됨의 의미
  chosen_reading: 수용된 징계가 사람을 정결하고 교정된 상태로 이끈다는 뜻으로 읽었습니다.
  alternative_readings:
  - 의식적 정결을 가리키는 이미지로만 읽을 수 있습니다.
  - 고난을 통한 변호/정당화의 의미로 넓게 읽을 수 있습니다.
  rationale: καθαρισθήσεται와 παιδείαν의 병행은 단순 고통이 아니라 교정적 징계가 낳는 정화의 결과를 시사합니다. 본문이 허용하는 범위 안에서 도덕적 정결을 중심으로 유지했습니다.
  doctrine_reference: 성화와 징계에 대한 성경적 이해
- issue: 주님의 성품 진술
  chosen_reading: 주님은 징계를 견디는 이들에게 선하십니다.
  alternative_readings:
  - 주님은 징계를 견디는 이들에게 친절하십니다.
  - 주님은 징계를 참는 이들에게 은혜로우십니다.
  rationale: χρηστός는 ‘선하다/친절하다’의 범위를 가지지만, 지혜문맥의 일반 진술로서 하나님의 선하심을 가장 직접적으로 전달하는 ‘선하십니다’를 선택했습니다.
  doctrine_reference: 하나님의 선하심
- issue: ‘매질’ 표현과 앞절의 어휘 연속성
  chosen_reading: 10:1의 μάστιξ와 10:2의 μάστιγας를 같은 한국어 계열로 처리했습니다.
  alternative_readings:
  - 앞절과 달리 ‘채찍’ 또는 ‘회초리’로 바꿀 수 있습니다.
  rationale: 저본이 동일 어휘를 반복해 징계의 연속성을 형성하므로, 한국어도 같은 의미장을 유지해 본문의 결속을 보존했습니다.
  doctrine_reference: 본문 내 어휘 반복 보존
