source:
  edition: lxx-swete-1909
  text: ὁ ἑτοιμάζων νῶτον εἰς μάστιγας, καὶ καθαρισθήσεται· χρηστὸς γὰρ ὁ κύριος τοῖς ὑπομένουσιν παιδείαν.
  language: Greek
  pages:
  - 800
  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/010/002.yaml
  text: The one who prepares his back for scourges will be cleansed[d][c][b][a], for the Lord is good to those who endure discipline.
  footnotes:
  - marker: a
    text: Or 'will be purified.'
    reason: lexical_alternative
  - marker: b
    text: Or 'for scourges.'
    reason: lexical_alternative
  - marker: c
    text: Or 'correction' or 'chastening.'
    reason: lexical_alternative
