base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/010/004.yaml
  text: And the mercy of the Lord is upon those who love him in truth[b][a], and the Lord will remember his servants with mercy.
  footnotes:
  - marker: a
    text: Or "faithfully" or "with sincerity" for "in truth."
    reason: lexical_alternative
  - marker: b
    text: Or "slaves" for "servants."
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 주님의 자비가 그분을 진리 안에서 사랑하는 이들 위에 있으며, 주님은 자비로 그분의 종들을 기억하실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “충실히”나 “성실하게”로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “노예들”로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεος
  english_pob_choice: mercy
  chosen_korean: 자비
  alternatives_korean:
  - 긍휼
  - 은혜
  lexicon: BDAG
  rationale: 하나님의 호의와 compassionate mercy를 함께 살리되, 시편적 문맥에서 자연스럽고 경건한 한국어로는 ‘자비’가 가장 무난합니다.
- source_word: ἐν ἀληθείᾳ
  english_pob_choice: in truth
  chosen_korean: 진리 안에서
  alternatives_korean:
  - 진실로
  - 충실히
  - 성실하게
  lexicon: BDAG
  rationale: ‘in truth’의 형식과 내용을 함께 살리기 위해 단순 부사가 아니라 구문적으로 ‘진리 안에서’로 옮겼습니다.
- source_word: δούλων
  english_pob_choice: servants
  chosen_korean: 종들
  alternatives_korean:
  - 종
  - 노예
  - 섬기는 이들
  lexicon: BDAG
  rationale: POB가 ‘servants’로 번역했지만, δοῦλος의 종속 상태를 흐리지 않기 위해 복수 ‘종들’을 택했습니다. 여기서는 노예까지 강하게 드러내기보다 고대 예배적/언약적 종속을 반영합니다.
- source_word: μνήσεται
  english_pob_choice: will remember
  chosen_korean: 기억하실 것입니다
  alternatives_korean:
  - 기억해 주실 것입니다
  - 마음에 두실 것입니다
  lexicon: BDAG
  rationale: 미래의 적극적이고 호의적인 기억을 직역에 가깝게 살리기 위해 ‘기억하실 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 주님의 긍휼/자비가 누구에게 임하는지
  chosen_reading: 주님의 자비가 그분을 진리 안에서 사랑하는 이들 위에 있습니다
  alternative_readings:
  - 주님의 자비가 그분을 진실로 사랑하는 이들 위에 있습니다
  - 주님의 자비가 그분을 충실히 사랑하는 이들 위에 있습니다
  rationale: ἐν ἀληθείᾳ는 단순한 태도보다 진리 안에서의 참된 언약적 사랑을 포함하므로, ‘진리 안에서’가 의미 범위를 가장 넓고 정확하게 보존합니다.
  doctrine_reference: 용례상 ἀλήθεια는 도덕적 진실성뿐 아니라 하나님 앞의 참됨/진리성을 포함할 수 있음
- issue: δοῦλος의 한국어 강도
  chosen_reading: 종들
  alternative_readings:
  - 노예들
  - 섬기는 이들
  rationale: 이 절은 종의 신분보다 주님의 자비로운 기억에 초점이 있으므로, 지나치게 현대적 사회제도 이미지를 강하게 불러오는 ‘노예들’은 피하되, 소유-속박의 뉘앙스는 ‘종들’로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: δοῦλος = servant / slave (context-dependent)'
