lexical_decisions:
- source_word: ἐν καταγώγαις κρυφίοις
  english_pob_choice: in secret chambers
  chosen_korean: 비밀한 방들에
  alternatives_korean:
  - 숨은 곳들에
  - 은밀한 골방들에
  - 숨겨진 방들에
  lexicon: LSJ
  rationale: κρυφίοις와 καταγώγαις의 결합은 감춰진 장소를 가리키므로, 직역에 가깝되 한국어로 자연스러운 ‘비밀한 방들’로 옮겼습니다.
- source_word: αἱ παρανομίαι αὐτῶν
  english_pob_choice: their lawless deeds
  chosen_korean: 그들의 불법 행위는
  alternatives_korean:
  - 그들의 법 없는 행위는
  - 그들의 불법한 짓은
  - 그들의 무법한 행동은
  lexicon: LSJ
  rationale: παρανομίαι는 율법과 질서를 거스르는 구체적 행위를 뜻하므로, 추상적인 ‘불법’보다 행위성을 살린 ‘불법 행위’로 번역했습니다.
- source_word: ἐν παροργισμῷ
  english_pob_choice: in provocation
  chosen_korean: 도발 가운데 있었습니다
  alternatives_korean:
  - 분노를 돋우는 가운데 있었습니다
  - 격노케 함 가운데 있었습니다
  - 도발 안에 있었습니다
  lexicon: LSJ
  rationale: 이 표현은 단순한 감정이 아니라 ‘노하게 함/도발’의 상태를 나타내므로, ‘도발’로 옮겨 원문의 신학적 긴장을 보존했습니다.
theological_decisions:
- issue: ἐν παροργισμῷ의 대상이 그리스어에 명시되지 않음
  chosen_reading: 대상을 덧붙이지 않고 ‘도발’이라는 상태 표현으로 유지했습니다.
  alternative_readings:
  - 하나님을 노하게 하는 가운데
  - 그분을 격노케 하는 가운데
  rationale: 문맥상 하나님의 진노를 암시할 수 있으나, 본문 자체에는 목적어가 없으므로 해석을 과도하게 확정하지 않도록 했습니다.
  doctrine_reference: 본문 충실성 및 최소추론 원칙
