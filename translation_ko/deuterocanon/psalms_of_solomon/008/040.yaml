translation:
  language: ko
  text: 주님은 그분의 심판들 가운데서 경건한 이들의 입에서 찬양받으십니다. 이스라엘은 주님께 영원히 복을 받습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘경건한 이들’은 ὁσίων의 번역입니다. ‘신실한 이들’ 또는 ‘거룩한 이들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘주님께 영원히 복을 받습니다’는 원문의 수동적 선언을 반영합니다. ‘이스라엘은 주님께 영원히 복됩니다’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: αἰνετὸς
  english_pob_choice: Praised is
  chosen_korean: 찬양받으십니다
  alternatives_korean:
  - 찬송받으십니다
  - 찬양받으실 분이십니다
  lexicon: BDAG
  rationale: 형용사적 선언을 한국어에서는 능동적 서술보다 수동 서술로 자연스럽게 옮겨, 주님의 마땅한 찬양성을 분명히 드러냈습니다.
- source_word: ἐν τοῖς κρίμασιν αὐτοῦ
  english_pob_choice: in his judgments
  chosen_korean: 자기의 심판들에서
  alternatives_korean:
  - 그의 심판들 안에서
  - 그의 판결들에서
  lexicon: BDAG
  rationale: κρίματα의 다의성을 살려 하나님의 심판 행위들을 가리키는 표현으로 옮겼고, 단수화해 의미를 좁히지 않았습니다.
- source_word: ἐν στόματι ὁσίων
  english_pob_choice: on the lips of the holy ones / the pious / the faithful
  chosen_korean: 경건한 이들의 입에서
  alternatives_korean:
  - 거룩한 이들의 입에서
  - 신실한 이들의 입에서
  lexicon: BDAG
  rationale: Psalms of Solomon의 ὅσιοι는 단순한 '거룩한 이들'보다 경건과 언약적 충성의 뉘앙스를 가지므로, POB 개정 취지에 따라 '경건한 이들'로 옮겼습니다.
- source_word: εὐλογημένος
  english_pob_choice: blessed is
  chosen_korean: 복됩니다
  alternatives_korean:
  - 복받습니다
  - 복되십니다
  lexicon: BDAG
  rationale: 평행구조를 유지하면서도 한국어에서 예언적 선언처럼 들리도록 현재형 서술어로 처리했습니다.
theological_decisions:
- issue: ὁσίων의 의미 범위
  chosen_reading: 경건한 이들
  alternative_readings:
  - 거룩한 이들
  - 성도들
  - 신실한 이들
  rationale: 이 문맥의 ὅσιοι는 제도적 '성도'보다 하나님께 충성하는 경건한 집단을 가리키므로, 전통 교회 용어보다 원문 의미를 더 직접적으로 반영했습니다.
  doctrine_reference: 언약적 경건과 공동체적 충성의 표지
- issue: 축복 진술의 형태
  chosen_reading: 이스라엘은 주님으로 말미암아 영원히 복됩니다
  alternative_readings:
  - 주님께서 이스라엘을 영원히 복하십니다
  - 이스라엘은 주님께 복을 받습니다
  rationale: εὐλογημένος + ὑπὸ Κυρίου + εἰς τὸν αἰῶνα의 선언적 구조를 살려, 축복의 지속성과 주체를 함께 보이도록 했습니다.
  doctrine_reference: 하나님의 주권적 축복 선언
