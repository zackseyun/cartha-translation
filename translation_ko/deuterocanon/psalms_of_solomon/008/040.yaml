  source_fidelity: 본문은 αἰνετός와 εὐλογημένος의 선언적·수동적 성격, ὁσίων을 ‘경건한 이들’로 옮긴 점, ὑπὸ Κυρίου의 행위자 표지를 대체로 잘 반영합니다. 그러나 ‘자기의 심판들에서’는 현대 한국어에서 부자연스럽고, ‘복됩니다’는 ‘복된 상태이다’라는 선언보다 ‘복된 상태가 된다’는 변화의 뜻으로 들릴 수 있습니다. 각주 c의 ‘직역하면’은 원문의 수동 형용사 구문을 능동문으로 바꾸므로 정확하지 않습니다.
  naturalness: ‘그분의 심판들 가운데서’와 ‘주님께 영원히 복을 받습니다’가 현대 표준어 합쇼체에서 더 자연스럽습니다. 문장 내 쉼표는 불필요하므로 제거했습니다.
  terminology: κύριος는 ‘주님’, κρίματα는 의미를 과도하게 좁히지 않는 ‘심판들’, ὅσιοι는 이 문맥에서 교회 제도어를 피한 ‘경건한 이들’로 유지합니다. εὐλογημένος는 ‘복을 받습니다’로 옮겨 수동성과 ὑπὸ Κυρίου의 행위자 관계를 자연스럽게 드러냅니다.
