revisions:
- from: 주님은 자기의 심판들에서, 경건한 이들의 입에서 찬양받으십니다. 그리고 이스라엘은 주님으로 말미암아 영원히 복됩니다.[a][b][c][d]
  to: 주님은 그분의 심판들 가운데서 경건한 이들의 입에서 찬양받으십니다. 이스라엘은 주님께 영원히 복을 받습니다.[a][b]
  rationale: 본문의 의미는 유지하면서, 소유 표현을 현대 한국어에 맞게 ‘그분의’로 고치고, 두 ἐν 구문의 공간·영역적 표현을 ‘심판들 가운데서’와 ‘입에서’로 보존했습니다. 마지막 절은 원문의 수동 형용사와 주님의 행위자 역할을 더 분명하게 반영하도록 수정했습니다. 각주는 실제 번역 대안만 남기고, 부정확한 ‘직역’ 표기와 영어 혼입 설명을 제거했습니다.
  reviewer_model: gpt-5.6-terra
