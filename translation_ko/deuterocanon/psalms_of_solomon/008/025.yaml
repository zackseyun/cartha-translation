  source_fidelity: 그리스어 ἐποίησαν κατὰ τὰς ἀκαθαρσίας αὐτῶν를 ‘자기들의 부정함에 따라 행했습니다’로 충실히 옮겼습니다. 한국어의 ‘부정함’ 단수 추상명사는 원문의 복수형이 나타내는 여러 부정·불결의 상태를 자연스럽게 포괄할 수 있습니다. καθὼς 이하의 비교와 행위의 세대적 반복도 보존되었습니다.
  naturalness: 문장은 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘자기들의 조상들이 그랬던 것처럼 말입니다’는 비교를 분명히 하며, 문맥상 ‘조상들’은 직계 부친만이 아니라 앞선 세대를 가리키는 οἱ πατέρες의 관용적 의미를 적절히 전달합니다.
  terminology: ‘부정함’은 ἀκαθαρσία의 도덕적·의례적 불결 양쪽의 여지를 유지하는 적절한 표현입니다. ‘조상들’도 본문의 집단적 역사적 지시 대상에 적합합니다. 각주 ‘그들의 부정들’은 원문의 복수형을 확인하는 유효한 어휘 대안입니다.
