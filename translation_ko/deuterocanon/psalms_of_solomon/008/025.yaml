translation:
  language: ko
  text: 그들은 자기들의 부정함에 따라 행했습니다[a] — 자기들의 조상들이 그랬던 것처럼 말입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 부정들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν
  english_pob_choice: acted
  chosen_korean: 행했습니다
  alternatives_korean:
  - 했습니다
  - 행하였습니다
  - 행동했습니다
  lexicon: BDAG
  rationale: 행동의 일반성을 살리면서도 뒤의 기준구문(‘~에 따라’)과 자연스럽게 어울리므로 ‘행했습니다’로 옮겼습니다.
- source_word: κατὰ τὰς ἀκαθαρσίας αὐτῶν
  english_pob_choice: according to their uncleannesses
  chosen_korean: 자기들의 부정함에 따라
  alternatives_korean:
  - 자기들의 더러움에 따라
  - 자기들의 불결함에 따라
  - 자기들의 부정한 일들에 따라
  lexicon: BDAG
  rationale: 복수형 ἀκαθαρσίας는 단순한 추상명사보다 누적된 부정/오염의 상태를 가리키므로, 한국어에서는 자연스러운 추상명사 ‘부정함’으로 살리되 ‘에 따라’로 기준·일치의 뜻을 반영했습니다.
- source_word: καθὼς
  english_pob_choice: just as
  chosen_korean: — 자기들의 조상들이 그랬던 것처럼 말입니다
  alternatives_korean:
  - — 자기들의 조상들처럼 말입니다
  - — 그들의 조상들이 한 것처럼 말입니다
  lexicon: BDAG
  rationale: ‘just as’의 비교와 연속성을 분명히 드러내기 위해 ‘— … 것처럼’으로 처리했습니다.
- source_word: οἱ πατέρες αὐτῶν
  english_pob_choice: their fathers
  chosen_korean: 자기들의 조상들
  alternatives_korean:
  - 그들의 아버지들
  - 그들의 선조들
  lexicon: BDAG
  rationale: 직역하면 ‘아버지들’이지만, 한국어에서는 혈연적 아버지보다 세대적·역사적 선조를 가리키는 의미가 분명하므로 ‘조상들’로 옮겼습니다.
theological_decisions:
- issue: 반복되는 죄의 계승을 어떻게 드러낼지
  chosen_reading: 현재 세대의 행위가 조상들의 행위와 동일한 패턴을 따른다는 점을 문장 구조로 보존했습니다.
  alternative_readings:
  - 단순히 과거의 습관을 말하는 표현
  - 개별 행위만을 지시하는 표현
  rationale: 본문은 도덕적 행위의 반복성과 세대적 연속성을 함께 말하므로, ‘자기들의 조상들이 그랬던 것처럼’이라는 비교구를 유지해 그 긴장을 살렸습니다.
  doctrine_reference: 세대적 죄의 반복과 공동체적 책임
