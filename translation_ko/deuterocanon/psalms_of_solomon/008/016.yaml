lexical_decisions:
- source_word: ἤγαγεν
  english_pob_choice: He brought
  chosen_korean: 데려오셨습니다
  alternatives_korean:
  - 가져오셨습니다
  - 이끌어오셨습니다
  lexicon: BDAG
  rationale: ἄγω의 서술적 aorist로서 대상을 장면 안으로 들여오는 움직임을 나타내므로, 자연스러운 한국어로는 ‘데려오셨습니다’가 가장 직접적입니다.
- source_word: τὸν ἀπʼ ἐσχάτου τῆς γῆς
  english_pob_choice: the one from the end of the earth
  chosen_korean: 땅 끝에서 온 사람
  alternatives_korean:
  - 세상의 끝에서 온 사람
  - 땅의 가장 먼 곳에서 온 사람
  lexicon: BDAG
  rationale: ἐσχάτου τῆς γῆς의 지리적 극단성을 살리면서도 현대 한국어에서 자연스럽게 읽히도록 ‘땅 끝’으로 옮겼습니다.
- source_word: παίοντα
  english_pob_choice: the one who strikes
  chosen_korean: 힘 있게 치는 사람
  alternatives_korean:
  - 치는 사람
  - 때리는 사람
  lexicon: BDAG
  rationale: παίω는 단순한 접촉이 아니라 강한 타격을 뜻하므로, 문맥상 무게를 살려 ‘힘 있게 치는 사람’으로 옮겼습니다.
- source_word: κραταιῶς
  english_pob_choice: mightily
  chosen_korean: 힘 있게
  alternatives_korean:
  - 강하게
  - 맹렬히
  lexicon: LSJ
  rationale: κραταιῶς의 강한 힘과 압도적 성격을 한국어 부사 ‘힘 있게’로 간결하게 전달했습니다.
theological_decisions:
- issue: 시적 병렬에서 동일 동사의 반복을 어떻게 처리할지
  chosen_reading: 두 절구를 모두 ‘데려오셨습니다’로 맞춰, 원문의 반복적 병렬과 장중한 선언성을 유지했습니다.
  alternative_readings:
  - 첫 절구를 ‘이끌어오셨습니다’, 둘째를 ‘데려오셨습니다’로 달리함
  - 둘째 절구를 생략적 병렬로 다듬음
  rationale: 원문은 동일한 동사 ἤγαγεν의 반복을 통해 두 대상을 나란히 제시하므로, 한국어에서도 같은 동사를 반복하는 편이 구조와 강조를 더 잘 보존합니다.
  doctrine_reference: 시적 평행법 보존
