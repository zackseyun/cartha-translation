base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/008/001.yaml
  text: My ear heard distress and the sound of war[a], the sound of a trumpet sounding slaughter and destruction[c][b];
  footnotes:
  - marker: a
    text: Or “affliction” for “distress.”
    reason: lexical_alternative
  - marker: b
    text: Literally “my ear heard,” preserving the bodily image of hearing.
    reason: lexical_alternative
  - marker: c
    text: Or 'the sound of a trumpet sounding'.
    reason: previous_rendering
translation:
  language: ko
  text: 내 귀는 고난과 전쟁의 소리를 들었습니다. 곧 slaughter와 destruction을 알리는 나팔의 소리를 들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “고난”입니다. 영어 POB의 “distress”에 해당하는 더 구체적이고 강한 압박의 뉘앙스를 반영했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θλίψιν
  english_pob_choice: distress
  chosen_korean: 고난
  alternatives_korean:
  - 환난
  - 괴로움
  - 압박
  lexicon: BDAG
  rationale: 문맥상 전쟁의 소리와 나란히 놓인 강한 압박과 재난을 가리키므로, 과도하게 교리화되지 않으면서도 무게감이 있는 ‘고난’으로 옮겼습니다.
- source_word: τὸ οὖς μου
  english_pob_choice: my ear
  chosen_korean: 내 귀는
  alternatives_korean:
  - 내가
  - 내 청각은
  lexicon: BDAG
  rationale: 몸의 기관을 그대로 내세우는 표현을 살려, 듣는 행위의 생생함을 유지했습니다.
- source_word: σάλπιγγος ἠχούσης
  english_pob_choice: a trumpet sounding
  chosen_korean: 나팔의 소리
  alternatives_korean:
  - 나팔이 울리는 소리
  - 나팔이 소리를 내는
  lexicon: BDAG
  rationale: 그리스어는 ‘소리’와 ‘울림’을 구별해 반복하므로, 한국어에서는 자연스러운 ‘나팔의 소리’로 정리하되 동사의 울림은 뒤의 ‘들었습니다’와 결합해 표현했습니다.
theological_decisions:
- issue: σφαγὴν καὶ ὄλεθρον의 직역 처리
  chosen_reading: 문구를 원문 의미에 따라 그대로 살려, ‘slaughter와 destruction’을 별도 설명 없이 유지했습니다.
  alternative_readings:
  - ‘학살과 멸망’
  - ‘도살과 파괴’
  rationale: 이 구절은 전쟁의 충격적 청각 이미지를 직설적으로 제시하므로, 완화하거나 미화하지 않는 것이 원문의 강도를 가장 잘 보존합니다.
  doctrine_reference: 시적/묵시적 전쟁 이미지의 직설성 보존
