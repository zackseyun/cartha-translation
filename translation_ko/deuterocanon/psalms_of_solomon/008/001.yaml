source:
  edition: lxx-swete-1909
  text: Θλίψιν καὶ φωνὴν πολέμου ἤκουσεν τὸ οὖς μου, φωνὴν σάλπιγγος ἠχούσης σφαγὴν καὶ ὄλεθρον·
