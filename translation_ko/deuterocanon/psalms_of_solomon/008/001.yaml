  rationale: 영어가 남아 있던 두 핵심 명사를 ‘학살과 멸망’으로 번역하고, 나팔의 울림이 이를 알리는 원문의 연결을 ‘알리는’으로 표현했습니다. 불필요하고 부정확한 각주는 삭제했으며, 원문의 병렬 목적어를 한 문장으로 유지했습니다.
