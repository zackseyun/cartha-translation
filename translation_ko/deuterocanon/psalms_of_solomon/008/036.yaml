base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/008/036.yaml
  text: Do not overlook us[a], our God[b], lest the nations swallow us up as though there were no one to redeem.
  footnotes:
  - marker: a
    text: Or, 'as if there were no redeemer' or 'as though no one were delivering.'
    reason: lexical_alternative
  - marker: b
    text: Or 'lest nations swallow us up, as though there were no one to redeem.'.
    reason: previous_rendering
translation:
  language: ko
  text: 우리 하나님이여, 우리를 못 본 체하지 마소서. 민족들이 우리를 집어삼켜서, 마치 구원할 사람이 없는 것처럼 되지 않게 하소서.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 ‘못 본 체하지 마소서’는 ‘외면하지 마소서’, ‘간과하지 마소서’의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘마치 구원할 사람이 없는 것처럼’은 ‘마치 속량할 이가 없는 것처럼’의 뜻입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ ὑπερίδῃς
  english_pob_choice: Do not overlook
  chosen_korean: 못 본 체하지 마소서
  alternatives_korean:
  - 우리를 외면하지 마소서
  - 우리를 간과하지 마소서
  - 우리를 무시하지 마소서
  lexicon: LSJ
  rationale: 하나님께 드리는 간구의 뉘앙스를 살리면서, 단순한 인지의 실패가 아니라 ‘시선을 돌려 버리는’ 태도를 한국어로 자연스럽게 옮겼습니다.
- source_word: ἔθνη
  english_pob_choice: the nations
  chosen_korean: 민족들이
  alternatives_korean:
  - 나라들이
  - 열방이
  - 이방 민족들이
  lexicon: LSJ
  rationale: 유대 공동체의 기도 맥락에서 외부 세력을 가리키므로, 지나치게 교회적·전통적 용어인 ‘열방’보다 직설적인 ‘민족들’이 원문을 더 투명하게 드러냅니다.
- source_word: ὡς μὴ ὄντος λυτρουμένου
  english_pob_choice: as though there were no one to redeem
  chosen_korean: 마치 구원할 사람이 없는 것처럼
  alternatives_korean:
  - 마치 속량할 이가 없는 것처럼
  - 마치 구속할 자가 없는 것처럼
  - 마치 구해 줄 이가 없는 것처럼
  lexicon: LSJ
  rationale: 분사형 표현의 ‘구원/속량’ 가능성을 보존하면서도, 한국어 문장으로는 목적어가 생략된 ‘구원할 사람이 없는’이 가장 자연스럽고 원문의 결핍 진술을 잘 반영합니다.
theological_decisions:
- issue: λυτρουμένου의 구속/구원 어감 유지
  chosen_reading: ‘구원할 사람’으로 옮겨, 분사형이 지닌 행위성은 살리되 고정된 칭호로 굳히지 않았습니다.
  alternative_readings:
  - ‘속량하는 이’
  - ‘구속자’
  - ‘구원자’
  rationale: 원문은 명사적 칭호가 아니라 ‘구원/속량하는 중인 이’라는 상태를 암시하므로, 지나친 신학적 확정을 피하고 기도문의 절박함을 유지하는 것이 적절합니다.
  doctrine_reference: 본문의 긴장 보존; 명칭화보다 행위성 우선
