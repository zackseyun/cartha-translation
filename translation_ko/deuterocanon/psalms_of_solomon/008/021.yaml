  yaml_path: translation/deuterocanon/psalms_of_solomon/008/021.yaml
  text: He seized her fortified towers and the wall of Jerusalem[c][b][a],
  footnotes:
  - marker: a
    text: The rare Greek word rendered 'bastions' may also be understood as 'citadels,' 'fortified towers,' or 'ramparts.'
    reason: lexical_alternative
  - marker: b
    text: '''Her'' refers to Jerusalem, which is treated as a feminine city figure in the surrounding poetic style.'
    reason: cultural_note
  - marker: c
    text: Or 'He captured her bastions'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 그 성의 견고한 탑들과 예루살렘의 성벽을 점령했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 희귀어 πυργοβάρεις는 ‘견고한 탑들’ 외에도 ‘성채들’, ‘요새화된 탑들’, ‘성벽 바깥 방어시설’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘그 성’은 주변 시적 문맥에서 여성형 도시로 의인화된 예루살렘을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: κατελάβετο
  english_pob_choice: seized
  chosen_korean: 점령했습니다
  alternatives_korean:
  - 붙잡았습니다
  - 빼앗았습니다
  - 차지했습니다
  lexicon: LSJ
  rationale: 군사적 맥락에서 καταλαμβάνω의 중간태는 단순히 ‘붙잡다’보다 ‘점령하다/장악하다’의 점유·장악 의미를 살리는 편이 자연스럽고, 영어 POB의 최종 판단인 seize와도 맞습니다.
- source_word: τὰς πυργοβάρεις
  english_pob_choice: fortified towers
  chosen_korean: 견고한 탑들
  alternatives_korean:
  - 요새화된 탑들
  - 방어 탑들
  - 성채들
  lexicon: Suda; LSJ
  rationale: 희귀어 πυργοβάρεις는 방어 시설을 가리키므로, 한국어에서는 ‘탑들’에 ‘견고한’을 붙여 요새화된 구조물이라는 뜻을 드러내면서도 문맥을 과장하지 않게 옮겼습니다.
- source_word: τὸ τεῖχος Ἰερουσαλήμ
  english_pob_choice: the wall of Jerusalem
  chosen_korean: 예루살렘의 성벽
  alternatives_korean:
  - 예루살렘 성벽
  - 예루살렘의 벽
  lexicon: LSJ
  rationale: τεῖχος는 단순한 벽이 아니라 성곽의 방어벽이므로 ‘성벽’이 가장 적절하며, 지명은 소유격으로 풀어 원문 구조를 분명히 했습니다.
theological_decisions:
- issue: 예루살렘을 여성형 인격화된 도시로 보는가
  chosen_reading: ‘그 성’으로 시작해 뒤의 ‘예루살렘’과 연결하되, 한국어에서는 과도한 의인화를 피했습니다.
  alternative_readings:
  - ‘그녀’
  - ‘그 도시’
  rationale: 헬라어 αὐτῆς는 문학적 관습상 예루살렘을 여성형 도시로 가리키지만, 한국어 본문에서는 직역형 ‘그녀’보다 ‘그 성’이 자연스럽고 본문 흐름도 유지합니다.
  doctrine_reference: 시편의 의인화된 시적 표현
