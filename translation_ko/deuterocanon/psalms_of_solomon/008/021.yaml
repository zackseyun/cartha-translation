  yaml_path: translation/deuterocanon/psalms_of_solomon/008/021.yaml
  text: He seized her fortified towers and the wall of Jerusalem[c][b][a],
  footnotes:
  - marker: a
    text: The rare Greek word rendered 'bastions' may also be understood as 'citadels,' 'fortified towers,' or 'ramparts.'
