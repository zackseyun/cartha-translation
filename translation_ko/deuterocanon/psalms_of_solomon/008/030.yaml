review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘 대응은 대체로 적절합니다. 그러나 δή는 독립 호격처럼 ‘이제여’로 옮길 수 없으며, ἰδοὺ δή 전체의 강조·환기 기능을 자연스럽게 처리해야 합니다. 또한 ‘주의 의로’는 ἐν의 영역/방식 관계를 ‘의 안에서’보다 다소 도구적으로 좁힐 수 있습니다.
  naturalness: ‘보십시오, 이제여, 하나님이여’는 현대 표준 한국어 합쇼체 기도·호소 문체로 부자연스럽습니다. 특히 ‘이제여’는 현대 한국어에서 이 문맥에 쓰이지 않습니다. ‘보소서’는 공적 기도체로 자연스럽고, 직접 호칭과도 잘 결합합니다.
  terminology: ὁ θεός의 직접 호칭은 ‘하나님이여’로 유지할 수 있습니다. κρῖμα는 ‘심판’이 적절합니다. δικαιοσύνη는 기본 대응어 ‘의’를 유지하되, 본문에서는 ‘주의 의 안에서’가 전치사구의 의미를 더 보존합니다. 대안 ‘공의’는 각주에 유지합니다.
  issues:
  - severity: medium
    issue: ‘이제여’가 δή의 강조를 잘못 처리함
    rationale: δή는 ἰδοὺ와 결합하여 ‘보십시오/보소서, 이제’와 같은 주의 환기 및 강조를 이루며, ‘이제여’처럼 호격화할 근거가 없습니다. 이 표현은 현대 한국어에서도 부자연스럽습니다.
  - severity: low
    issue: ‘주의 의로’가 ἐν τῇ δικαιοσύνῃ σου의 관계를 다소 도구적으로 한정함
    rationale: ἐν은 ‘안에서’라는 영역·상황 또는 방식의 여지를 지닙니다. ‘주의 의 안에서’는 원문의 개방성을 더 잘 보존하며, ‘공의’는 가능한 어휘 대안으로 각주에 남길 수 있습니다.
  revised_text: 보소서, 하나님이여, 주께서 주의 의 안에서 우리에게 주의 심판을 보여 주셨습니다.[a]
