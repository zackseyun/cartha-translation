lexical_decisions:
- source_word: ἰδοὺ δή
  english_pob_choice: Behold now
  chosen_korean: 보십시오, 이제여
  alternatives_korean:
  - 보라, 이제
  - 보십시오, 지금
  - 보십시오
  lexicon: BDAG
  rationale: 감탄과 주의를 끄는 결합 표현이므로, 단순한 정보 전달보다 청중의 시선을 환기하는 말투로 살렸습니다. '이제여'는 δή의 강조를 반영합니다.
- source_word: ὁ θεός
  english_pob_choice: O God
  chosen_korean: 하나님이여
  alternatives_korean:
  - 하나님
  - 오 하나님
  lexicon: BDAG
  rationale: 문맥상 직접 호칭이므로 호격을 분명히 드러냈습니다. 한국어 기도체에서는 '하나님이여'가 자연스럽고 공적 호소의 톤을 유지합니다.
- source_word: τὸ κρῖμά σου
  english_pob_choice: your judgment
  chosen_korean: 주의 심판
  alternatives_korean:
  - 주의 판단
  - 주의 판결
  - 주의 결정
  lexicon: BDAG
  rationale: κρῖμα는 여기서 하나님의 사법적 행위와 판결을 가리키므로 '심판'이 가장 직접적입니다. '판단'은 약하고, '판결'은 지나치게 법정적입니다.
- source_word: ἐν τῇ δικαιοσύνῃ σου
  english_pob_choice: in your righteousness
  chosen_korean: 주의 의로
  alternatives_korean:
  - 주의 공의로
  - 주의 정의 안에서
  - 주의 의 안에서
  lexicon: BDAG
  rationale: δικαιοσύνη의 기본값인 '의'를 따르되, 한국어에서 부사격으로 자연스럽게 연결되도록 '…로'를 사용했습니다. '공의'는 의미가 가능하지만 본문의 기본 어휘를 바꾸지는 않았습니다.
theological_decisions:
- issue: δικαιοσύνη를 '의'로 유지할지 '공의/정의'로 옮길지
  chosen_reading: 주의 의로
  alternative_readings:
  - 주의 공의로
  - 주의 정의로
  rationale: POB의 기본 원칙대로 δικαιοσύνη는 '의'를 우선 유지해 본문 어휘의 긴장을 보존했습니다. 심판 문맥이지만 '공의'로 흡수하면 용어가 평탄화될 수 있어 본문은 '의'를 유지하고, 해석적 여지는 남겨 둡니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table (δικαιοσύνη → righteousness; alternative: justice)'
