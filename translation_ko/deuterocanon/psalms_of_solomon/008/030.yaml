  to: 보소서, 하나님이여, 주께서 주의 의 안에서 우리에게 주의 심판을 보여 주셨습니다.[a]
  rationale: ‘보소서’로 ἰδοὺ δή의 강조된 호소를 자연스러운 현대 한국어 기도체로 옮기고, 불가능한 ‘이제여’를 제거했습니다. ‘하나님이여’, ‘주의 심판’, ‘주의 의’는 유지했습니다. ἐν의 의미 범위를 보존하기 위해 ‘주의 의 안에서’로 조정했으며, δικαιοσύνη의 문맥적 대안인 ‘공의’를 각주로 제시했습니다.
  reviewer_model: gpt-5.6-terra
