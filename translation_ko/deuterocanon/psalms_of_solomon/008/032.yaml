lexical_decisions:
- source_word: ὅτι
  english_pob_choice: For
  chosen_korean: 주님,
  alternatives_korean:
  - 이는
  - 왜냐하면
  lexicon: BDAG
  rationale: 앞선 고백이나 기도의 근거를 잇는 연결이므로, 한국어에서는 자연스러운 호격 전환으로 시작해 문맥의 이유 제시 기능을 살렸습니다.
- source_word: τῆς δικαιοσύνης
  english_pob_choice: righteousness
  chosen_korean: 의의
  alternatives_korean:
  - 정의의
  - 의로우심의
  lexicon: BDAG
  rationale: δικαιοσύνη는 기본적으로 ‘의’로 옮기되, 하나님의 성품을 가리키는 속격이므로 ‘의의 하나님’으로 간결하게 표현했습니다.
- source_word: κρίνων
  english_pob_choice: judging
  chosen_korean: 심판하십니다
  alternatives_korean:
  - 판단하십니다
  - 재판하십니다
  lexicon: BDAG
  rationale: 현재 분사는 지속적 행위를 나타내므로 동사형으로 풀어 주되, 하나님이 이스라엘을 다스리며 판정하시는 뜻을 살려 ‘심판하십니다’로 옮겼습니다.
- source_word: ἐν παιδείᾳ
  english_pob_choice: with discipline
  chosen_korean: 징계로
  alternatives_korean:
  - 훈육으로
  - 교정으로
  - 훈련으로
  lexicon: BDAG
  rationale: παιδεία는 단순 교육이 아니라 교정적 징계의 뉘앙스가 강하므로, 전치사 ἐν의 수단·방식을 살려 ‘징계로’가 가장 직접적입니다.
theological_decisions:
- issue: 하나님의 성품을 나타내는 δικαιοσύνη의 번역
  chosen_reading: ‘의’로 번역해 하나님의 도덕적 성품과 공의로운 통치를 함께 드러냈습니다.
  alternative_readings:
  - ‘정의’
  - ‘의로움’
  rationale: 시편적 찬양 문맥에서 δικαιοσύνη는 단순한 법정적 정의보다 하나님 자신의 신실하고 올바른 성품을 함께 가리키므로, 표준적인 POB 용례대로 ‘의’가 더 적절합니다.
  doctrine_reference: 하나님의 의와 공의
- issue: ἐν παιδείᾳ의 뉘앙스
  chosen_reading: 이스라엘에 대한 하나님의 심판을 ‘징계’의 성격으로 유지했습니다.
  alternative_readings:
  - ‘교정’
  - ‘훈련’
  rationale: 본문은 단순 처벌이 아니라 언약 백성을 바로잡는 교정적 심판을 말하므로, 한국어에서도 ‘징계’가 긴장과 목적성을 함께 보존합니다.
  doctrine_reference: 언약적 징계
