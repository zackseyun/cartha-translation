translation:
  language: ko
  text: 그는 예루살렘과 그 땅에 전쟁을 선포하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “예루살렘과 그 영토에 전쟁을 선포하셨습니다.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “전쟁을 판단하셨습니다.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἔκρινεν
  english_pob_choice: decreed
  chosen_korean: 선포하셨습니다
  alternatives_korean:
  - 결정하셨습니다
  - 판결하셨습니다
  - 전쟁을 정하셨습니다
  lexicon: BDAG κρίνω 4.b
  rationale: 문맥에서 κρίνω는 단순한 ‘판단하다’보다 권위 있게 전쟁을 결정·공포하는 뜻이 강하므로, 한국어로는 ‘선포하다’가 그 결단성과 공적 선언성을 가장 자연스럽게 드러냅니다.
- source_word: τὸν πόλεμον
  english_pob_choice: war
  chosen_korean: 전쟁
  alternatives_korean:
  - 전투
  - 분쟁
  lexicon: BDAG πόλεμος
  rationale: πόλεμος는 단일 교전보다 ‘전쟁’이 기본 의미이므로, 중대성과 총체성을 살려 그대로 옮겼습니다.
- source_word: ἐπὶ Ἰερουσαλήμ
  english_pob_choice: against Jerusalem
  chosen_korean: 예루살렘에
  alternatives_korean:
  - 예루살렘을 향해
  - 예루살렘을 상대로
  lexicon: BDAG ἐπί
  rationale: 적대 방향을 보이는 ἐπί는 한국어에서 목적어 표지보다 ‘~에’로도 충분히 자연스럽게 드러나며, 여기서는 ‘예루살렘에 전쟁을 선포하셨습니다’가 원문의 공격 대상성을 유지합니다.
- source_word: τὴν γῆν αὐτῆς
  english_pob_choice: her land
  chosen_korean: 그 땅
  alternatives_korean:
  - 그 영토
  - 그 땅과 영토
  lexicon: BDAG γῆ
  rationale: γῆ는 지리적 ‘땅’이 기본이므로, 예루살렘의 주변 영역을 과도하게 정치화하지 않으면서도 도시의 귀속성을 살렸습니다.
theological_decisions:
- issue: κρίνω의 재현 방식
  chosen_reading: ‘판단’보다 ‘선포’로 옮겨, 심판적 결정이 실제 전쟁의 공적 선언으로 이어지는 뉘앙스를 드러냈습니다.
  alternative_readings:
  - 그는 전쟁을 판단하셨습니다
  - 그는 전쟁을 결정하셨습니다
  rationale: 영어 POB의 최종 채택인 ‘decreed war’는 단순한 평가가 아니라 권위 있는 결정입니다. 한국어 ‘선포’는 그 선언성·집행성을 함께 살립니다.
  doctrine_reference: 신적 주권과 역사에 대한 하나님의 통치
