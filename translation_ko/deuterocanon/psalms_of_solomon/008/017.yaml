base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/008/017.yaml
  text: He decreed war against Jerusalem and her land[a][b].
  footnotes:
  - marker: a
    text: Or 'He decreed war against Jerusalem and her territory.'
    reason: lexical_alternative
  - marker: b
    text: Or 'He judged war'.
