review_pass:
  verdict: revise
  source_fidelity: 그리스어 ἔκρινεν은 여기서 전쟁을 권위 있게 결정하거나 명한 행위를 가리킵니다. 초안의 ‘전쟁을 선포하셨습니다’는 δημόσια proclamation(공적 선포)라는 원문에 없는 요소를 더합니다. ‘예루살렘과 그 땅을 향한 전쟁을 결정하셨습니다’는 κρίνω의 결정·재정 의미와 ἐπί의 적대적 방향을 충실히 반영합니다.
  naturalness: ‘예루살렘에 전쟁을 선포하다’도 이해되지만, 한국어에서 전쟁의 개시를 공표하는 뜻으로 구체화됩니다. ‘~을 향한 전쟁을 결정하셨습니다’는 현대 표준어 합쇼체로 자연스럽고 원문의 표현 범위를 보존합니다.
  terminology: ‘예루살렘’, ‘땅’, ‘전쟁’은 적절합니다. γῆ는 본문에서 ‘땅’으로 유지하고, ‘영토’는 각주 대안으로 제시할 수 있습니다. 이전 번역을 알리는 각주는 ‘판단’보다 κρίνω의 재판적 어감을 살린 ‘판결’로 하되, 이것이 문맥상 덜 자연스러운 직역적 대안임을 표시합니다.
  issues:
  - severity: medium
    issue: ‘선포하셨습니다’는 ἔκρινεν의 의미를 ‘공적으로 선언하다’로 과도하게 구체화합니다.
    rationale: κρίνω는 결정·판정·재정을 뜻하며, 본문에는 선포 행위를 나타내는 동사가 없습니다. ‘결정하셨습니다’가 원문의 의미 범위를 더 안전하게 보존합니다.
  - severity: low
    issue: 각주 b의 ‘전쟁을 판단하셨습니다’는 한국어에서 전쟁을 평가했다는 뜻으로 쉽게 읽힙니다.
    rationale: 이전 번역의 가능성을 기록하려면 재판적 비유를 더 드러내는 ‘전쟁을 판결하셨습니다’가 낫지만, 문맥상 본문 채택어는 ‘결정하셨습니다’가 자연스럽습니다.
  revised_text: 그는 예루살렘과 그 땅을 향한 전쟁을 결정하셨습니다.[a][b]
  revised_footnotes:
