- from: 그는 예루살렘과 그 땅에 전쟁을 선포하셨습니다.[a][b]
  to: 그는 예루살렘과 그 땅을 향한 전쟁을 결정하셨습니다.[a][b]
  rationale: ‘선포’는 원문에 없는 공적 선언의 뉘앙스를 더하므로, ἔκρινεν의 문맥상 의미인 권위 있는 결정으로 수정했습니다. ‘예루살렘과 그 땅을 향한’은 ἐπὶ Ἰερουσαλήμ καὶ τὴν γῆν αὐτῆς의 적대적 방향과 병렬 대상을 자연스럽게 재현합니다.
