translation:
  language: ko
  text: 그들은 그의 입성을 앞두고[a] 거친 길들을 평탄하게 만들었으며, 예루살렘을 향해[b] 문들을 열었고, 그 성벽에 관을 씌웠습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “그의 입성으로부터” 또는 “그의 입성에서부터”가 될 수 있으나, 문맥상 그의 입성을 준비하는 때라는 뜻으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 ἐπὶ Ἰερουσαλήμ은 “예루살렘을 위해” 또는 “예루살렘 위에”로도 이해될 수 있으나, 여기서는 문이 향한 방향을 나타내는 것으로 보아 번역했습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “그 성벽을 화관으로 장식했습니다.”
    reason: lexical_alternative
