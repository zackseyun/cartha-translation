  yaml_path: translation/deuterocanon/psalms_of_solomon/008/019.yaml
  text: They made rough roads smooth before his entrance; they opened gates toward Jerusalem; they crowned her walls.
  footnotes:
  - marker: a
    text: Or 'from his entrance'; the Greek phrase is awkward, and the translation takes it as expressing preparation for his entry.
    reason: lexical_alternative
  - marker: b
    text: Or 'garlanded her walls.'
    reason: lexical_alternative
  - marker: c
    text: Or 'They made rough roads smooth for his entrance; they opened gates toward Jerusalem; they crowned her walls.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 그의 입성을 앞두고 거친 길들을 평탄하게 만들었으며, 예루살렘을 향해 문들을 열었고, 그 성벽에 관을 씌웠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “그의 입성으로부터/그의 입성에서부터”가 될 수 있으나, 문맥상 ‘그의 입성을 앞두고’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ἐπὶ Ἰερουσαλήμ은 여기서 방향을 나타내어 “예루살렘을 향해”로 번역했습니다.
    reason: lexical_alternative
  - marker: c
    text: ἤνοιξαν πύλας는 정관사를 요구하지 않으므로 “문들”로 옮겼습니다.
    reason: lexical_alternative
