lexical_decisions:
- source_word: φωνήν
  english_pob_choice: a voice / a sound
  chosen_korean: 한 음성
  alternatives_korean:
  - 한 소리
  - 한 목소리
  lexicon: BDAG
  rationale: φωνή는 문맥에 따라 목소리나 소리를 뜻할 수 있는데, 앞선 반복 구조를 살리면서도 문맥상 들려온 경고성의 울림을 자연스럽게 담기 위해 ‘한 음성’으로 옮겼습니다.
- source_word: ἤκουσα
  english_pob_choice: I heard
  chosen_korean: 들었습니다
  alternatives_korean:
  - 들었습니다
  - 들어보았습니다
  lexicon: BDAG
  rationale: 아오리스트의 단순한 지각 보고이므로, 과장 없이 직접적인 서술인 ‘들었습니다’가 적절합니다.
- source_word: εἰς Ἰερουσαλήμ
  english_pob_choice: in Jerusalem
  chosen_korean: 예루살렘에서
  alternatives_korean:
  - 예루살렘 안에서
  - 예루살렘에
  lexicon: BDAG
  rationale: 여기서는 εἰς가 장소적 의미로 쓰인 것으로 보이며, 한국어에서는 자연스럽게 ‘~에서’로 옮기는 것이 문맥에 맞습니다.
- source_word: πόλιν ἁγιάσματος
  english_pob_choice: the holy city / a city of holiness
  chosen_korean: 거룩한 성
  alternatives_korean:
  - 거룩함의 성
  - 성결의 성
  - 거룩한 도시
  lexicon: BDAG
  rationale: 직역하면 ‘거룩함의 성’이지만, 한국어에서는 ‘거룩한 성’이 원뜻을 유지하면서도 가장 자연스럽고 압축적으로 의미를 전달합니다.
theological_decisions:
- issue: 예루살렘의 칭호 표현
  chosen_reading: ‘거룩한 성’으로 번역해 예루살렘의 성별된 정체성을 드러냈습니다.
  alternative_readings:
  - ‘거룩함의 성’
  - ‘성결의 성’
  rationale: 이 구절은 지리 정보보다 예루살렘의 신학적 표지를 강조하므로, 단순한 지명보다 성스러운 지위를 드러내는 표현을 유지하는 것이 적절합니다.
  doctrine_reference: 성전/성도성의 언어와 예루살렘의 거룩함
