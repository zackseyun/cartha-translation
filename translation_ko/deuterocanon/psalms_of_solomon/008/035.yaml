translation:
  language: ko
  text: 주님의 신실하심[a]이 우리와 함께 있고, 우리는 목을 곧게 하였습니다[b][c]. 주님은 우리를 징계하시는 분이십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 믿음이 우리와 함께 있습니다’.
    reason: lexical_alternative
  - marker: b
    text: ‘목을 곧게 하다’는 완고해짐을 뜻하는 관용구입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘그리고 우리는 목을 곧게 하였습니다’.
    reason: previous_rendering
lexical_decisions:
- source_word: πίστις σου
  english_pob_choice: your faithfulness
  chosen_korean: 주님의 신실하심
  alternatives_korean:
  - 주님의 믿음
  - 주님의 믿음성
  - 주님의 신앙
  lexicon: BDAG
  rationale: 하나님께 돌려진 πίστις는 여기서 ‘믿음’보다 언약적·지속적 충실성을 가리키는 ‘신실하심’이 자연스럽습니다. ‘주님의 믿음’은 한국어에서 의미가 어색하고, 본문이 하나님의 신실한 대응을 강조하므로 이를 반영했습니다.
- source_word: μεθʼ ἡμῶν
  english_pob_choice: is with us
  chosen_korean: 우리와 함께 있는데
  alternatives_korean:
  - 우리와 함께 있습니다
  - 우리 가운데 있습니다
  lexicon: BDAG
  rationale: μετά + 속격의 동반 관계를 직역하되, 앞절과 뒤절의 대비를 살리기 위해 연결형으로 자연스럽게 다듬었습니다.
- source_word: ἐσκληρύναμεν τράχηλον ἡμῶν
  english_pob_choice: we stiffened our necks
  chosen_korean: 우리는 목을 굳게 했습니다
  alternatives_korean:
  - 우리는 목을 뻣뻣하게 했습니다
  - 우리는 목을 곧게 세웠습니다
  - 우리는 완고해졌습니다
  lexicon: BDAG
  rationale: ‘목을 굳게 하다’는 한국어에서 성경적 완고함의 비유를 비교적 직접적으로 보존합니다. 영어 주석이 지적한 관용구의 뜻은 유지하되, 본문 이미지 자체를 살렸습니다.
- source_word: παιδευτής
  english_pob_choice: our disciplinarian
  chosen_korean: 우리의 징계자이십니다
  alternatives_korean:
  - 우리의 훈육자이십니다
  - 우리를 징계하시는 분이십니다
  - 우리의 교훈자이십니다
  lexicon: LSJ
  rationale: παιδευτής는 단순한 교사보다 훈련·교정의 뉘앙스를 함께 지니므로, 하나님께 대한 진술에서는 ‘징계자’가 가장 직접적입니다. ‘훈육자’보다 더 강하게 본문의 책망·교정성을 드러냅니다.
theological_decisions:
- issue: 첫 번째 καὶ의 연결 의미
  chosen_reading: ‘그리고’로 유지하되, 앞절의 신실하심과 뒤절의 완고함 사이의 대비가 드러나도록 문장을 구성했습니다.
  alternative_readings:
  - ‘그러나’로 옮겨 대비를 더 강하게 드러내는 방식
  rationale: 그리스어 표면형은 καὶ이지만, 본문의 전체 의미는 하나님의 신실하심과 인간의 완고함을 병치합니다. 한국어에서는 ‘그리고’로 본문 형식을 보존하면서도, 어순과 절 구성을 통해 대비가 읽히도록 했습니다.
  doctrine_reference: 문맥적 대조 표현
- issue: 하나님께 대한 παιδευτής의 지위
  chosen_reading: 직업명칭처럼 들릴 수 있는 ‘징계자’로 옮겨, 하나님이 백성을 교정하고 훈련하시는 분이라는 뜻을 보존했습니다.
  alternative_readings:
  - ‘교사’ 또는 ‘훈육자’
  rationale: 이 본문은 하나님을 단순한 지식 전달자가 아니라, 백성을 다루어 바로잡는 분으로 부릅니다. 한국어 교회 전통의 완곡한 표현보다 원문의 기능을 살리는 번역이 필요합니다.
  doctrine_reference: 하나님의 징계와 훈육
