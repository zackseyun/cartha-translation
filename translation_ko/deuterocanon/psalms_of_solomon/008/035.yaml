revisions:
- from: 주님의 신실하심이 우리와 함께 있는데, 우리는 목을 굳게 했습니다. 그리고 주님은 우리의 징계자이십니다.[a][b][c]
  to: 주님의 신실하심[a]이 우리와 함께 있고, 우리는 목을 곧게 하였습니다[b][c]. 주님은 우리를 징계하시는 분이십니다.
  rationale: 그리스어의 접속사 καί를 본문에서 ‘-고/-며’의 접속으로 유지하여 명시되지 않은 대조를 강제하지 않았습니다. 완고함의 은유는 더 관용적인 한국어 표현으로 바로잡고, παιδευτής는 교정·징계의 기능을 보존하는 자연스러운 관계절로 옮겼습니다. 각주 a, b, c는 각각 신실하심, 목을 곧게 함, 접속 표현의 대안에 직접 연결되도록 재배치·정비했습니다.
  reviewer_model: gpt-5.6-terra
