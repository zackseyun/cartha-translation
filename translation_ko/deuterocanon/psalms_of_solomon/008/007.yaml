revisions:
- from: 제가 말하기를, 「그들은 자기들의 길을 의로움 가운데 곧게 합니다」라고 하였습니다. 저는 하늘과 땅이 창조된 때부터 하나님의 심판들을 생각해 보았고, 옛적부터 있는 그의 심판들에서 하나님을 의롭다고 하였습니다.[a][b][c][d]
  to: 저는 말하였습니다. “그들은 의로움 안에서 자기들의 길을 곧게 합니다[a].” 저는 하늘과 땅의 창조 때부터 하나님의 심판들을 숙고하였고, 하나님의 옛적부터 있는 심판들을 두고 하나님께서 의로우시다고 선언하였습니다[b][c][d].
  rationale: 문장의 직접 인용 형식을 현대 한국어 합쇼체에 맞게 다듬고, ‘의로움 안에서’와 ‘숙고하였고’로 원문의 의미를 자연스럽게 반영했습니다. 마지막 전치사구는 ‘심판들을 두고’로 옮겨 하나님의 심판을 근거 또는 관련 영역으로 하여 그분의 의로우심을 선언했다는 뜻을 분명히 했습니다. ‘옛적부터 있는’은 원문의 시간적 모호성을 유지하며, ‘영원부터’ 해석은 각주로 남겼습니다. 각주 표지도 각각의 해당 어구에 재배치하고 동일 반복을 실제 대안 번역으로 교정했습니다.
