  - severity: low
    issue: 직접 인용을 도입하는 ‘제가 말하기를 …라고 하였습니다’
    rationale: 문법적으로 가능하나 중복적이고 부자연스럽습니다. 원문의 εἶπα는 ‘저는 말하였습니다’로 직접 인용을 도입할 수 있습니다.
  - severity: low
    issue: 각주 a와 c가 본문을 실질적으로 반복함
    rationale: a는 본문과 동일하며, c는 본문의 ‘옛적부터 있는’과 사실상 같은 표현입니다. 각주는 실제 대안 번역을 제시해야 합니다.
