translation:
  language: ko
  text: 저는 말하였습니다. “그들은 의로움 안에서 자기들의 길을 곧게 합니다[a].” 저는 하늘과 땅의 창조 때부터 하나님의 심판들을 숙고하였고, 하나님의 옛적부터 있는 심판들을 두고 하나님께서 의로우시다고 선언하였습니다[b][c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들은 자기들의 길을 바르게 인도합니다.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “하나님을 그의 심판들에서 의롭다고 하였습니다.”
    reason: lexical_alternative
  - marker: c
    text: 또는 “하나님의 영원부터 있는 심판들을 두고.”
    reason: alternative_reading
  - marker: d
    text: 또는 “하나님을 변호하였습니다.”
    reason: previous_rendering
lexical_decisions:
- source_word: Κατευθύνουσιν ὁδοὺς αὐτῶν
  english_pob_choice: They direct their ways
  chosen_korean: 그들은 자기들의 길을 곧게 합니다
  alternatives_korean:
  - 그들은 자기들의 길을 인도합니다
  - 그들은 자기들의 길을 바로잡습니다
  lexicon: LSJ
  rationale: κατευθύνουσιν은 길을 바르게 하고 곧게 한다는 뜻이므로, 한국어에서는 “곧게 합니다”로 길-의 도덕적 방향성을 살렸습니다.
- source_word: ἐν δικαιοσύνῃ
  english_pob_choice: in righteousness
  chosen_korean: 의로움 가운데
  alternatives_korean:
  - 의 안에서
  - 의롭게
  lexicon: LSJ
  rationale: δικαιοσύνη는 여기서 행위의 성격을 나타내므로 “의로움”을 택해 문장 전체가 도덕적 정직함을 말한다는 점을 드러냈습니다.
- source_word: ἀνελογισάμην τὰ κρίματα τοῦ θεοῦ
  english_pob_choice: I considered the judgments of God
  chosen_korean: 하나님의 심판들을 생각해 보았고
  alternatives_korean:
  - 하나님의 판단들을 헤아려 보았고
  - 하나님의 판결들을 숙고하였고
  lexicon: LSJ
  rationale: ἀνελογισάμην은 숙고하며 헤아리는 반성적 동작이므로 “생각해 보았고”로 자연스럽게 옮기되, κρίματα는 하나님의 판단/심판의 의미를 살려 “심판들”로 옮겼습니다.
- source_word: ἐδικαίωσα τὸν θεὸν
  english_pob_choice: I declared God righteous
  chosen_korean: 하나님을 의롭다고 하였습니다
  alternatives_korean:
  - 하나님을 의롭다 하였습니다
  - 하나님을 옳다고 인정하였습니다
  lexicon: LSJ
  rationale: 동사 δικαιόω의 선언적 성격을 살리면서, “하나님을 의롭다고 하였습니다”로 하나님이 옳으시다고 공적으로 인정하는 뜻을 분명히 했습니다.
- source_word: τοῖς κρίμασιν αὐτοῦ τοῖς ἀπʼ αἰῶνος
  english_pob_choice: his judgments from of old
  chosen_korean: 옛적부터 있는 그의 심판들에서
  alternatives_korean:
  - 영원부터 있는 그의 심판들에서
  - 옛날부터 있는 그의 심판들에서
  lexicon: LSJ
  rationale: ἀπʼ αἰῶνος는 ‘오래전부터’ 또는 ‘영원부터’로 읽힐 수 있어, 과도하게 단정하지 않고 “옛적부터 있는”으로 시간의 오래됨을 보존했습니다.
theological_decisions:
- issue: ἐδικαίωσα τὸν θεόν의 신학적 뉘앙스
  chosen_reading: 화자가 하나님을 ‘의롭다고’ 선포하여 그의 심판이 옳음을 인정하는 뜻으로 옮겼습니다.
  alternative_readings:
  - 하나님을 변호하였습니다
  - 하나님을 의롭게 하였습니다
  rationale: 이 구절은 하나님께 의를 부여하는 것이 아니라, 그의 심판이 참으로 의롭다는 사실을 인정하는 고백입니다. 따라서 선언적·증언적 의미를 살렸습니다.
  doctrine_reference: 하나님의 न्याय/의로움과 인간의 평가 고백을 구분함
- issue: τοῖς ἀπʼ αἰῶνος의 시간 범위
  chosen_reading: ‘옛적부터 있는’으로 옮겨 고대성의 여지를 남겼습니다.
  alternative_readings:
  - 영원부터 있는
  - 태초부터 있는
  rationale: 문맥상 창조 언급과 결합하지만, 표현 자체는 반드시 형이상학적 ‘영원성’만을 뜻하지 않을 수 있으므로 해석을 과잉 확정하지 않았습니다.
  doctrine_reference: 해석적 긴장을 보존함
