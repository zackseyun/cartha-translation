lexical_decisions:
- source_word: ἐπίστρεψον
  english_pob_choice: Turn
  chosen_korean: 돌리시고
  alternatives_korean:
  - 향하소서
  - 돌이키소서
  lexicon: BDAG
  rationale: 명령형으로 하나님께 자비를 우리 쪽으로 ‘돌려 달라’는 방향성을 살리면서, 한국어 기도문으로도 자연스럽게 들리도록 옮겼습니다.
- source_word: τὸ ἔλεός σου
  english_pob_choice: your mercy
  chosen_korean: 주님의 자비를
  alternatives_korean:
  - 주님의 긍휼을
  - 주님의 은혜를
  lexicon: BDAG
  rationale: ἔλεος는 여기서 자비/긍휼의 청원을 가리키므로, POB의 ‘mercy’에 맞추어 ‘자비’를 선택했습니다.
- source_word: ἐφʼ ἡμᾶς
  english_pob_choice: toward us
  chosen_korean: 우리에게
  alternatives_korean:
  - 우리 위에
  - 우리에게로
  lexicon: BDAG
  rationale: 전치사 ἐπί의 방향성을 한국어 조사로 간결하게 살려, 자비가 우리 쪽을 향하도록 해 달라는 뜻을 반영했습니다.
- source_word: οἰκτείρησον
  english_pob_choice: have compassion on
  chosen_korean: 불쌍히 여겨 주십시오
  alternatives_korean:
  - 긍휼히 여겨 주십시오
  - 가엾게 여겨 주십시오
  lexicon: BDAG
  rationale: 두 번째 청원은 단순 반복이 아니라 연민의 정서를 강화하는 동사이므로, 경건한 기도체로 ‘불쌍히 여겨 주십시오’라고 옮겼습니다.
theological_decisions:
- issue: 하나님께 드리는 직접 청원문의 높임말 사용
  chosen_reading: ‘주님… 주십시오’로 하나님께 직접 호소하는 기도체를 유지했습니다.
  alternative_readings:
  - 평서체로 완화
  - 전통적 종결형 ‘-옵소서’ 사용
  rationale: 본문이 간구문이므로 현대 합쇼체 기도체가 가장 자연스럽고, 청원 강도도 충분히 살립니다.
  doctrine_reference: 기도문 문체와 번역 관례
