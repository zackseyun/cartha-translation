lexical_decisions:
- source_word: συντριβὴ ἡ ὀσφύς μου
  english_pob_choice: My loins were crushed
  chosen_korean: 내 허리는 부서졌고
  alternatives_korean:
  - 내 허벅지/허리 통이 부서졌고
  - 내 허리가 짓눌렸고
  - 내 허리가 산산이 부서졌고
  lexicon: BDAG
  rationale: ὀσφύς는 신체 중심부를 가리키는 말이지만, 한국어에서는 직역어인 ‘허리’가 가장 자연스럽고 본문의 육체적 충격을 잘 살립니다. συντριβὴ는 ‘부서지다/짓눌리다’의 강한 파괴감을 담아 ‘부서졌고’로 옮겼습니다.
- source_word: ἀπὸ ἀκοῆς
  english_pob_choice: from the report
  chosen_korean: 들은 소식 때문에
  alternatives_korean:
  - 보고를 듣고
  - 소식을 듣고
  - 듣는 것 때문에
  lexicon: BDAG
  rationale: ἀκοή는 ‘듣는 것, 보고, 소식’의 범위를 가지므로, 문맥상 원인을 나타내는 한국어 표현인 ‘들은 소식 때문에’가 가장 자연스럽고 의미를 과도하게 좁히지 않습니다.
- source_word: παρελύθη
  english_pob_choice: my knees gave way
  chosen_korean: 내 무릎은 힘이 풀렸습니다
  alternatives_korean:
  - 내 무릎은 주저앉았습니다
  - 내 무릎은 마비된 듯했습니다
  - 내 무릎은 무너졌습니다
  lexicon: BDAG
  rationale: παρελύθη는 약해지다, 무너지다, 기능을 잃다의 뜻을 담으므로, 한국어 관용구 ‘힘이 풀리다’가 무릎의 신체적 무력감을 자연스럽게 전달합니다.
theological_decisions:
- issue: 시편적 탄식에서 과장된 신체 반응의 표현
  chosen_reading: 문자적이되 관용적인 한국어로 옮겨, 극심한 두려움과 충격이 몸에 미친 효과를 그대로 드러냈습니다.
  alternative_readings:
  - 정서적으로 완화하여 ‘몹시 두려웠습니다’로 풀어쓰기
  - 해부학적 직역으로 ‘허벅지뼈/허리뼈가 부서졌습니다’로 옮기기
  rationale: 본문은 들은 소식이 화자에게 미친 전신적 충격을 시적으로 진술합니다. 한국어에서도 과장을 줄여 도덕적 감정으로 바꾸기보다, 몸의 붕괴 이미지를 보존하는 것이 원문의 힘에 더 가깝습니다.
  doctrine_reference: 시적 탄식의 수사와 신체 은유
