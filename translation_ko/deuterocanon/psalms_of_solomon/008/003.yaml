lexical_decisions:
- source_word: εἶπα τῇ καρδίᾳ μου
  english_pob_choice: I said in my heart
  chosen_korean: 나는 내 마음에 말했습니다
  alternatives_korean:
  - 나는 내 마음속에 말했습니다
  - 나는 스스로에게 말했습니다
  lexicon: BDAG
  rationale: 직역의 ‘내 마음에’라는 내적 자기대화를 살리면서도, 한국어로 자연스러운 합쇼체 문장을 유지했습니다. ‘스스로에게’는 뜻은 분명하지만 원문의 ‘마음’ 이미지를 약화합니다.
- source_word: Ποῦ ἄρα
  english_pob_choice: Where then
  chosen_korean: 그러면 … 어디에서
  alternatives_korean:
  - 그런데 … 어디에서
  - 도대체 … 어디에서
  lexicon: BDAG
  rationale: ἄρα의 추론적·반성적 뉘앙스를 한국어의 ‘그러면’으로 옮겨, 단순한 위치 질문이 아니라 앞말에서 이어지는 판단 질문임을 드러냈습니다.
- source_word: κρινεῖ
  english_pob_choice: will judge
  chosen_korean: 심판하십니까
  alternatives_korean:
  - 판단하십니까
  - 재판하십니까
  lexicon: BDAG
  rationale: 문맥상 하나님의 최종 판결을 묻는 표현이므로 ‘심판하다’가 가장 직접적입니다. ‘판단하다’는 약하고, ‘재판하다’는 현대 한국어에서 부자연스럽습니다.
- source_word: ὁ θεός
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하느님
  lexicon: 표준 번역 관행
  rationale: POB 기본 용례에 따라 Θεός는 ‘하나님’으로 옮겼습니다. 문장 전체의 존칭 종결과도 일관됩니다.
theological_decisions:
- issue: 하나님의 심판을 묻는 간접 의문문의 종결
  chosen_reading: 직접 인용문 안에서 하나님을 향한 존칭형 의문 종결 ‘심판하십니까’로 처리했습니다.
  alternative_readings:
  - 심판하실까요
  - 심판하실 것입니다
  rationale: 원문은 미래형 의문문으로, 사건의 가능성을 묻는 반성적 질문입니다. 한국어에서는 존칭 의문문이 가장 자연스럽고, 단정적 예언으로 세지지 않게 합니다.
  doctrine_reference: 하나님의 주권적 심판에 대한 경외의 표현
