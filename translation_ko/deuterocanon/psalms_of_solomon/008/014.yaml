  chosen_reading: ‘죄를 하나도 남기지 않았다’로 옮겨, 단순히 죄가 많았다는 뜻이 아니라 죄를 빠짐없이 저질렀다는 과장된 총체성을 드러냈습니다.
  alternative_readings:
  - ‘아무 죄도 빠뜨리지 않았다’
