  naturalness: ‘저지르지 않은 죄가 하나도 없었습니다’는 현대 표준 한국어에서 자연스럽고, 합쇼체 문체에도 맞습니다. 비교 부사구 뒤 쉼표를 유지하여 원문의 비교적 수식 관계를 드러냅니다.
