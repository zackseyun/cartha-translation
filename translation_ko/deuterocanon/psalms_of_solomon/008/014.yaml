    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ παρέλειπον
  english_pob_choice: left / omitted no
  chosen_korean: 하나도 남기지 않았습니다
  alternatives_korean:
  - 빠뜨리지 않았습니다
  - 생략하지 않았습니다
  lexicon: LSJ
  rationale: 부정과 함께 쓰여 ‘남겨 두지 않다/빠뜨리지 않다’는 총체적 부정을 드러내는 표현으로 옮겼습니다.
- source_word: ἁμαρτίαν
  english_pob_choice: sin
  chosen_korean: 죄
  alternatives_korean:
  - 허물
  - 악행
  lexicon: LSJ
  rationale: 도덕·종교적 책임을 뜻하는 기본 의미를 살려 표준적인 ‘죄’로 옮겼습니다.
- source_word: ἐποίησαν
  english_pob_choice: committed
  chosen_korean: 저지르지 않았습니다
  alternatives_korean:
  - 하지 않았습니다
  - 행하지 않았습니다
  lexicon: LSJ
  rationale: 직역하면 ‘했다’이지만, 죄와 결합할 때 한국어에서는 ‘저지르다’가 자연스럽고 의미도 분명합니다.
- source_word: ὑπὲρ τὰ ἔθνη
  english_pob_choice: beyond the nations
  chosen_korean: 이방 민족들보다 더 나아가
  alternatives_korean:
  - 민족들보다 더
  - 나라들보다 더
  lexicon: LSJ
  rationale: ὑπέρ의 초과·우월 비교를 살려 ‘~보다 더 나아가’로 옮겼고, ἔθνη는 후대 교회 용어보다 중립적인 ‘이방 민족들’로 처리했습니다.
theological_decisions:
- issue: 죄의 총체성과 비교 구문
  chosen_reading: ‘죄를 하나도 남기지 않았다’로 옮겨, 단순히 죄가 많았다는 뜻이 아니라 죄를 빠짐없이 저질렀다는 과장된 총체성을 드러냈습니다.
  alternative_readings:
  - ‘아무 죄도 빠뜨리지 않았다’
  - ‘한 가지 죄도 남기지 않았다’
  rationale: 시편의 수사적 과장을 한국어에서도 보존해야 원문의 강도를 유지할 수 있습니다.
  doctrine_reference: 시적 과장과 총체적 묘사에 대한 일반 해석 원칙
