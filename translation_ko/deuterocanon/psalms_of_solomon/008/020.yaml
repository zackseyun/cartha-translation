translation:
  language: ko
  text: 그는 아버지가 자기 아들들의 집에 평안히 들어가듯이 들어가, 큰 안전 가운데 자기 발을 굳게 디뎠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 아들들의 집’입니다. 한국어에서는 ‘자기 아들들의 집’으로 옮겨 소유 관계를 자연스럽게 드러냈습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘큰 안전으로’ 또는 ‘아주 안전하게’로 옮길 수 있습니다. ἀσφάλεια는 안전하고 확고한 상태를 가리킵니다.
    reason: lexical_alternative
