  lexicon: BDAG
  rationale: ἀσφάλεια의 명사적 의미를 살려 ‘안전함’으로 옮기고, πολλῆς는 ‘큰’으로 반영했습니다.
theological_decisions:
- issue: ἔστησεν τοὺς πόδας αὐτοῦ의 동작상
  chosen_reading: ‘자기 발을 세웠습니다’로 옮겨, 발을 ‘놓다/딛다’보다 정지와 안정의 이미지를 더 직접적으로 드러냈습니다.
  alternative_readings:
  - 자기 발을 놓았습니다
  - 자기 발을 굳게 디뎠습니다
  rationale: 이 절의 초점은 이동이 아니라 안정된 자리잡음에 있으므로, ‘세우다’가 본문의 자리-확정 이미지를 가장 잘 보존합니다.
  doctrine_reference: 시편적 이미지의 서술적 의미 보존
