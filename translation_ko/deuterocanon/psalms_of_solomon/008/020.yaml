  text: εἰσῆλθεν ὡς πατὴρ εἰς οἶκον υἱῶν αὐτοῦ μετʼ εἰρήνης, ἔστησεν τοὺς πόδας αὐτοῦ μετὰ ἀσφαλείας πολλῆς.
