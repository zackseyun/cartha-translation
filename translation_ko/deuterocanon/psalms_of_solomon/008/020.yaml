base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/008/020.yaml
  text: He entered like a father into the house of his sons in peace[b][a]; he set his feet with great security.
  footnotes:
  - marker: a
    text: Or 'his sons’ house.' The Greek can be read either as a formally literal 'the house of his sons' or a more idiomatic possessive.
    reason: lexical_alternative
  - marker: b
    text: Or 'he planted his feet with great safety.' The clause likely conveys secure establishment or unhindered footing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 마치 아버지가 자기 아들들의 집으로 평안 가운데 들어가듯 들어왔고, 큰 안전함 가운데 자기 발을 세웠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 아들들의 집’으로도 읽을 수 있습니다. 헬라어는 문법적으로 ‘아들들의 집’과 ‘그의 아들들의 집’ 모두 가능하게 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘큰 안전으로’ 혹은 ‘아주 안전하게’로도 옮길 수 있습니다. ἀσφάλεια는 안전함/확실함의 상태를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  english_pob_choice: entered
  chosen_korean: 들어왔고
  alternatives_korean:
  - 들어갔고
  - 들어오셨고
  lexicon: BDAG
  rationale: 과거 완료된 प्रवेश 동작을 자연스럽게 살리되, 서술 흐름상 합쇼체로 무리 없이 읽히게 했습니다.
- source_word: ὡς πατὴρ
  english_pob_choice: like a father
  chosen_korean: 마치 아버지가
  alternatives_korean:
  - 아버지처럼
  - 아버지로서
  lexicon: BDAG
  rationale: 비유 표지 ὡς를 유지해 동일성이나 역할 과잉을 피하고, 비교의 느낌을 분명히 했습니다.
- source_word: οἶκον υἱῶν αὐτοῦ
  english_pob_choice: the house of his sons
  chosen_korean: 자기 아들들의 집
  alternatives_korean:
  - 그의 아들들의 집
  - 아들들의 가문
  lexicon: BDAG
  rationale: 그리스어의 직역적 이미지인 ‘집’을 살리면서도 한국어에서 소유 관계가 자연스럽게 들리도록 정리했습니다.
- source_word: μετὰ ἀσφαλείας πολλῆς
  english_pob_choice: with great security
  chosen_korean: 큰 안전함 가운데
  alternatives_korean:
