  yaml_path: translation/deuterocanon/psalms_of_solomon/008/038.yaml
  text: And we will not turn away from you[b][a], because your judgments toward us are good.
  footnotes:
  - marker: a
    text: Or 'we will not keep away from you' or 'we will not depart from you.'
    reason: lexical_alternative
  - marker: b
    text: Or 'your judgments toward us are kind.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 우리는 주님에게서 돌아서지 않을 것입니다. 주님의 우리를 향한 판단은 선하기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님에게서 멀어지지 않을 것입니다’, ‘주님을 떠나지 않을 것입니다’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주님의 우리를 향한 판단은 친절합니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφεξόμεθά
  english_pob_choice: will not turn away
  chosen_korean: 돌아서지 않을 것입니다
  alternatives_korean:
  - 멀어지지 않을 것입니다
  - 떠나지 않을 것입니다
  - 물러서지 않을 것입니다
  lexicon: BDAG
  rationale: 관계적으로 하나님에게서 등을 돌리거나 거리를 두지 않겠다는 뜻을 자연스러운 현대 한국어로 옮겼습니다. '돌아서다'는 단순한 위치 이동보다 관계적 이탈을 잘 드러냅니다.
- source_word: χρηστὰ
  english_pob_choice: good
  chosen_korean: 선하기 때문입니다
  alternatives_korean:
  - 좋기 때문입니다
  - 친절하기 때문입니다
  - 은혜롭기 때문입니다
  lexicon: BDAG
  rationale: 하나님의 κρίματα를 수식하는 χρηστά의 넓은 긍정성을 살리면서도, 판단/심판 문맥에 맞게 도덕적·신학적 울림이 있는 '선하다'를 택했습니다.
- source_word: κρίματά
  english_pob_choice: judgments
  chosen_korean: 판단은
  alternatives_korean:
  - 심판은
  - 판결은
  - 결정은
  lexicon: BDAG
  rationale: 하나님의 행위와 평가를 가리키는 공식적 표현을 유지하기 위해 '판단'을 사용했습니다. '심판'보다 덜 종말론적으로 좁고, 문맥상 하나님의 처분과 평가를 함께 담을 수 있습니다.
- source_word: εἰς ἡμᾶς
  english_pob_choice: toward us
  chosen_korean: 우리를 향한
  alternatives_korean:
  - 우리에게 대한
  - 우리 쪽으로의
  - 우리에게 향한
  lexicon: BDAG
  rationale: εἰς의 방향·관계적 뉘앙스를 한국어 관용에 맞게 '을/를 향한'으로 살렸습니다. 이는 판단이 우리와 무관하지 않고 우리를 대상으로 한다는 점을 분명히 합니다.
theological_decisions:
- issue: 하나님에 대한 직접 서술의 어조
  chosen_reading: 직접 호칭 없이도 3인칭 서술을 유지하되, 한국어에서는 존칭 주어를 쓰지 않고 '주님'으로 자연스럽게 지칭했습니다.
  alternative_readings:
  - 하나님에게서 돌아서지 않을 것입니다
  - 주님께서 우리를 향해 하시는 판단은 선합니다
  rationale: 원문은 공동체의 결단과 하나님의 판단을 평서문으로 말하므로, 기도체로 과도하게 올리지 않고 선포적 톤을 유지했습니다.
  doctrine_reference: 시편적 공동체 고백의 서술 어조
