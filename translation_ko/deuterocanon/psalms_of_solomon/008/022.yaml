translation:
  language: ko
  text: 이는 하나님께서 그를 그들의 방황 속에서도 안전하게 인도하셨기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원어 πλάνησις는 문맥에 따라 ‘오류’ 또는 ‘기만’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이곳의 의미는 단순한 길 잃음보다 어리석은 방황/빗나감에 더 가깝습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ὁ θεὸς
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하느님
  lexicon: POB glossary
  rationale: 프로젝트 기본 용례에 따라 Θεός는 ‘하나님’으로 옮겨, 본문이 말하는 주체가 하나님이심을 직접적으로 드러냈습니다.
- source_word: ἤγαγεν
  english_pob_choice: led
  chosen_korean: 인도하셨습니다
  alternatives_korean:
  - 이끄셨습니다
  - 데려가셨습니다
  lexicon: BDAG
  rationale: ἄγω의 aorist는 여기서 단순 이동보다 방향을 잡아 주는 인도의 의미가 강하므로, ‘인도하셨습니다’가 자연스럽고 의미를 잘 살립니다.
- source_word: μετὰ ἀσφαλείας
  english_pob_choice: safely
  chosen_korean: 안전하게
  alternatives_korean:
  - 평안하게
  - 확실하게
  lexicon: LSJ
  rationale: 전치사구가 결과적 상태를 나타내므로, 한국어에서는 부사적으로 ‘안전하게’가 가장 간결하고 정확합니다.
- source_word: πλανήσει
  english_pob_choice: wandering
  chosen_korean: 방황
  alternatives_korean:
  - 오류
  - 기만
  - 잘못
  lexicon: BDAG
  rationale: POB의 최신 영어본은 ‘wandering’을 유지하지만, 본문 문맥상 이는 단순한 물리적 이동이 아니라 어리석은 방황/빗나감의 상태를 가리키므로 ‘방황’이 가장 균형 잡힌 대응입니다.
theological_decisions:
- issue: πλάνησις의 의미 범위
  chosen_reading: 이들의 ‘방황’은 단순한 위치 이동이 아니라, 성읍 주민들의 어리석은 판단과 빗나감까지 포괄하는 표현으로 이해하고 번역했습니다.
  alternative_readings:
  - 그들의 오류 속에서
  - 그들의 기만 속에서
  rationale: 주변 문맥이 예루살렘 주민들이 폼페이우스를 받아들인 상황을 말하므로, 이 구절은 물리적 이동보다 인지적·도덕적 빗나감을 함께 드러내는 쪽이 더 적합합니다.
  doctrine_reference: 문맥적 해석
