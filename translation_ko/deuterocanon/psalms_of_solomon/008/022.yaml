  source_fidelity: ‘속에서도’는 그리스어 ἐν(‘~안에/가운데’)에 없는 양보의 뉘앙스를 더합니다. 이를 ‘가운데서’로 고치면 전치사구의 관계를 더 직접적으로 반영합니다. πλάνησις는 방황, 빗나감, 오류, 기만/미혹의 의미 범위를 지니므로, 본문은 한 의미로 과도하게 좁히지 않고 각주로 대안을 보존하는 것이 적절합니다.
  naturalness: ‘그들의 방황 가운데서 그를 안전하게 이끄셨기 때문입니다’는 표준어 현대 한국어 합쇼체로 자연스럽습니다. ‘가운데서’는 문맥상 ‘그들의 방황 속에서’보다 매끄러우며 불필요한 ‘~도’의 대조를 피합니다.
  terminology: ‘하나님’과 ‘인도하셨습니다/이끄셨습니다’는 적절합니다. 여기서는 ἄγω의 단순한 이끌음을 자연스럽게 살려 ‘이끄셨습니다’를 사용했습니다. πλάνησις의 주된 번역어는 영어 POB의 ‘wandering’에 맞추어 ‘방황’으로 유지하되, 오류·기만 및 빗나감의 가능성은 각주에서 밝혔습니다.
