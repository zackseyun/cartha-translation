  yaml_path: translation/deuterocanon/psalms_of_solomon/008/022.yaml
  text: For God led him safely through their wandering[a][b].
  footnotes:
  - marker: a
    text: Or 'in their error' or 'in their deception.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in their wandering.'.
