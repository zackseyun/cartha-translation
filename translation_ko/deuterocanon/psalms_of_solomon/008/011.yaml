  lexicon: BDAG
  rationale: 공식적이고 구속력 있는 약정을 가리키므로, 직역적 ‘합의’와 보다 강한 ‘언약을 맺다’를 함께 써서 어감을 살렸습니다.
- source_word: μετὰ ὅρκου
  english_pob_choice: under oath
  chosen_korean: 맹세 아래
  alternatives_korean:
