translation:
  language: ko
  text: 각 사람은 자기 이웃의 아내와 간음하고 있었습니다. 그들은 이 일들에 관하여 서로 언약을 맺고 맹세 아래 합의했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들 사이에 맹세로 약속을 맺었습니다’로도 옮길 수 있습니다. 그리스어 여격 αὐτοῖς는 더 문자적으로 ‘그들과’로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοιχῶντο
  english_pob_choice: was committing adultery
  chosen_korean: 간음하고 있었습니다
  alternatives_korean:
  - 간음했습니다
  - 간음하던 중이었습니다
  lexicon: BDAG
  rationale: 미완료 시제의 지속·반복성을 한국어 진행형으로 살려, 단발 사건보다 계속된 행위를 드러냈습니다.
- source_word: ἕκαστος
  english_pob_choice: Each one
  chosen_korean: 각 사람은
