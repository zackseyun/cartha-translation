  - 모든 사람은
  lexicon: BDAG
  rationale: 분배적 뉘앙스를 살리면서도 한국어 문장에서는 자연스럽게 주체를 분명히 하는 표현으로 옮겼습니다.
- source_word: συνθήκας
  english_pob_choice: agreements
  chosen_korean: 언약을 맺고 … 합의했습니다
  alternatives_korean:
  - 합의를 했습니다
  - 계약을 맺었습니다
