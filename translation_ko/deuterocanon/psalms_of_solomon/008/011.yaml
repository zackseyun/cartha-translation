  - 맹세와 함께
  - 맹세를 하며
  lexicon: BDAG
  rationale: ‘맹세’가 결합된 엄숙한 확약의 상태를 간결하게 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: συνθήκας의 강도와 종교적 색채
  chosen_reading: 여기서는 일반적 ‘합의’보다 더 엄숙하고 구속력 있는 ‘언약’의 어감을 살리되, 문맥상 인간들 사이의 불의한 공모임을 분명히 했습니다.
  alternative_readings:
  - 합의
  - 계약
  - 동맹
  rationale: 본문은 간음 행위를 뒷받침하는 비윤리적 약속을 말하므로, 한국어 독자가 그 심각성을 즉시 느끼도록 ‘언약을 맺다’라는 강한 표현을 사용했습니다.
  doctrine_reference: 문맥적 윤리 강조; 언약어휘의 수사적 사용
