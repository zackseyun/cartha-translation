  yaml_path: translation/deuterocanon/psalms_of_solomon/008/011.yaml
  text: Each one was committing adultery with his neighbor’s wife[a]; they made covenants with one another under oath about these things.
  footnotes:
  - marker: a
    text: Or 'they made agreements with them by oath concerning these things.' The dative αὐτοῖς can be taken more literally as 'with them.'
