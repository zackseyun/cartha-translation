  source_fidelity: 그리스어 명령법 συνάγαγε를 기도·간구 문맥에 맞게 ‘모으소서’로 옮겼고, τὴν διασπορὰν Ἰσραήλ의 집합적 인간 지시를 ‘이스라엘의 흩어진 자들’로 자연스럽게 드러냈습니다. ‘자비와 친절로’도 μετὰ ἐλέους καὶ χρηστότητος의 동반/수단 관계와 두 명사의 병렬을 충실히 반영합니다.
  naturalness: ‘자비와 친절로 이스라엘의 흩어진 자들을 모으소서’는 현대 표준어 합쇼체 기도문으로 자연스럽습니다. ‘친절’은 다소 일상적인 어감을 가질 수 있으나, 여기서는 χρηστότης의 호의롭고 선한 태도를 이해 가능한 한국어로 무리 없이 전달합니다.
  terminology: ‘이스라엘’과 ‘자비’는 적절하며, ‘흩어진 자들’은 διασπορά의 공동체적 의미를 보존하는 자연스러운 번역입니다. 각주 a는 명사의 문자적 대안을, b는 χρηστότης의 가능한 의미 범위를, c는 사람 중심의 대체 표현을 적절히 제시합니다.
