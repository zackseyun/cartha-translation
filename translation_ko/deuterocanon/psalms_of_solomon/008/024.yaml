review_pass:
  verdict: revise
  source_fidelity: 원문의 ἀπήγαγεν은 단순 과거의 ‘데려갔다’이며, 본문 자체로는 주어에 대한 높임을 요구하지 않습니다. 또한 ἐν βεβηλώσει는 종교적·도덕적 부정 또는 속됨/모독의 상태를 가리키므로 ‘부정 가운데서’가 ‘더럽힘 가운데서’보다 명사 βεβήλωσις의 뜻을 더 정확히 전달합니다.
  naturalness: 대시로 삽입한 ‘곧 … 자들을’은 관계절의 대상을 불필요하게 되풀이하여 다소 무겁습니다. 관계절을 앞에 두어 자연스럽고 간결하게 정리했습니다.
  terminology: ‘데려갔습니다’는 ἀπάγω의 이송·연행 의미를 보존하면서 강제적 폭력을 과도하게 명시하지 않습니다. ‘부정’은 βεβήλωσις의 종교적 오염/훼손의 의미를 적절히 담으며, 각주에서 ‘모독’이라는 대안을 제시합니다. 원문에 성소가 명시되지 않았으므로 각주에서 ‘성소 훼손’으로 한정하지 않았습니다.
