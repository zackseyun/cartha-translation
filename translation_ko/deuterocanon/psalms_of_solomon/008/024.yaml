  text: He led away their sons and their daughters[a], whom they had begotten in defilement.
  footnotes:
  - marker: a
    text: Or 'in profanation.' The Greek noun can denote desecration or defilement.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그들의 아들들과 딸들을—곧 그들이 더럽힘 가운데서 낳은 자들을—데려가셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모독 가운데서’. 헬라어 명사는 성소 훼손과 부정을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγαγεν
  english_pob_choice: led away
  chosen_korean: 데려가셨습니다
  alternatives_korean:
  - 끌고 가셨습니다
  - 데리고 가셨습니다
  - 끌어가셨습니다
  lexicon: LSJ
  rationale: ἀπάγω의 핵심은 ‘이끌어 옮기다/데리고 가다’이므로, 포로의 강제성을 과도하게 덧씌우지 않으면서도 이동·이송의 구체성을 살려 옮겼습니다.
- source_word: τοὺς υἱοὺς καὶ τὰς θυγατέρας
  english_pob_choice: their sons and their daughters
  chosen_korean: 그들의 아들들과 딸들
  alternatives_korean:
  - 그들의 자녀들과 딸들
  - 그들의 아들과 딸들
  lexicon: LSJ
  rationale: υἱούς와 θυγατέρας가 성별을 구분해 병렬로 제시되므로, 이를 각각 ‘아들들’과 ‘딸들’로 살렸습니다.
- source_word: ἃ ἐγέννησαν
  english_pob_choice: whom they had begotten
  chosen_korean: 곧 그들이 낳은 자들
  alternatives_korean:
  - 곧 그들이 낳은 이들
  - 곧 그들이 출생시킨 자들
  lexicon: LSJ
  rationale: γεννάω는 출생/생육의 의미를 가지므로 ‘낳다’로 자연스럽게 옮기되, 관계절이 자녀들을 수식한다는 점을 분명히 했습니다.
- source_word: ἐν βεβηλώσει
  english_pob_choice: in defilement
  chosen_korean: 더럽힘 가운데서
  alternatives_korean:
  - 부정 가운데서
  - 속됨 가운데서
  - 모독 가운데서
  lexicon: LSJ
  rationale: βεβήλωσις는 ‘부정’과 ‘모독/속됨’의 의미장을 가지므로, 도덕·종교적 오염을 함께 드러내는 ‘더럽힘’으로 옮겼습니다.
theological_decisions:
- issue: ἐν βεβηλώσει의 평가적 뉘앙스
  chosen_reading: 아이들의 출생을 단순한 사실이 아니라, 부정·모독의 상태와 결부된 것으로 평가하는 표현으로 읽었습니다.
  alternative_readings:
  - 부정 가운데서
  - 모독 가운데서
  - 속됨 가운데서
  rationale: 본문은 생물학적 출생만 말하는 것이 아니라, 그 출생에 대한 도덕·종교적 판단을 담고 있으므로 그 긴장을 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 출 19:10-15; 레 10:10; 시 51:5
