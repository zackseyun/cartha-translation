  lexicon: 일반 어휘
  rationale: 대표적 단수 명사로서 관계의 역전을 드러내는 간결한 명사형이 적절합니다.
- source_word: μετὰ μητρὸς καὶ πατὴρ μετὰ θυγατρὸς
