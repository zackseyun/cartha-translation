theological_decisions:
- issue: 근친 관계의 금지된 결합을 본문에서 얼마나 직접 드러낼지
  chosen_reading: ‘뒤섞였습니다’로 유지하여 혼합/결합의 이미지를 살리되, 한국어 본문 자체에 해설적 성적 용어를 덧붙이지 않았습니다.
  alternative_readings:
  - 성적으로 뒤섞였습니다
  - 부적절하게 섞였습니다
  rationale: 헬라어 동사 συνεφύροντο는 문자적으로는 ‘섞이다/뒤섞이다’의 이미지를 가지며, 문맥상 근친적·성적 부정행위를 함축합니다. 본문은 그 함축을 유지하는 것이 적절합니다.
  doctrine_reference: 원문이 허용하는 범위를 넘지 않으면서도 문맥의 도덕적 충격을 보존합니다.
