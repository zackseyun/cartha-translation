  text: ἠπάντησαν αὐτῷ οἱ ἄρχοντες τῆς γῆς μετὰ χαρᾶς, εἶπαν αὐτῷ Εὐκτὴ ἡ ὁδός σου· δεῦτε εἰσέλθατε μετʼ εἰρήνης,
