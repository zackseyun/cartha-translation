base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/008/018.yaml
  text: The rulers of the land met him with joy[a]; they said to him, “Blessed is your way. Come[c][b], enter with peace.”
  footnotes:
  - marker: a
    text: Or “Blessed is your way” or “Welcome is your way/path.”
    reason: lexical_alternative
  - marker: b
    text: “Of the land” may also be understood more broadly as “of the earth,” but the local-political sense fits the context better.
    reason: lexical_alternative
  - marker: c
    text: Or 'Prosperous is your way. Come, enter in peace,”'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 땅의 통치자들은 기쁨으로 그를 맞이했습니다[a]. 그들은 그에게 말했습니다. “당신의 길은 복된 길입니다. 오십시오[c][b], 평안 가운데 들어오십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “그 땅의 통치자들”입니다. 문맥상 지역 정치 권력을 가리키므로 ‘그 땅’으로 옮겼습니다.
    reason: source_note
  - marker: b
    text: ‘땅’은 여기서 더 넓게는 ‘땅/세상’으로도 이해될 수 있지만, 문맥상 지역 정치적 의미가 더 적절합니다.
    reason: alternative_reading
  - marker: c
    text: Εὐκτή는 ‘복된’ 외에 ‘환영받는’ 또는 ‘바람직한’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠπάντησαν
  english_pob_choice: met
  chosen_korean: 맞이했습니다
  alternatives_korean:
  - 만났습니다
  - 마중 나가 맞이했습니다
  lexicon: LSJ
  rationale: 환영의 장면이므로 단순한 ‘만났다’보다 ‘맞이하다’가 встреч/환대를 더 자연스럽게 살립니다.
- source_word: οἱ ἄρχοντες
  english_pob_choice: the rulers
  chosen_korean: 통치자들
  alternatives_korean:
  - 지도자들
  - 지배자들
  lexicon: LSJ
  rationale: ἄρχοντες의 정치적·공적 권위를 살리기 위해 ‘통치자들’로 옮겼습니다.
- source_word: τῆς γῆς
  english_pob_choice: of the land
  chosen_korean: 그 땅의
  alternatives_korean:
  - 땅의
  - 나라의
  - 세상의
  lexicon: LSJ
  rationale: 문맥상 지역·정치적 범위를 가리키므로 ‘그 땅의’가 가장 직접적입니다.
- source_word: Εὐκτὴ
  english_pob_choice: Blessed is your way / Welcome is your way
  chosen_korean: 복된
  alternatives_korean:
  - 축복받은
  - 환영받는
  - 바람직한
  lexicon: LSJ
  rationale: εὐκτός 계열의 ‘바람직하고 기원된’ 뜻을 살리되, 한국어에서 길을 수식하는 자연스러운 형용사로 ‘복된’을 택했습니다.
- source_word: μετʼ εἰρήνης
  english_pob_choice: in peace
  chosen_korean: 평안 가운데
  alternatives_korean:
  - 평화 가운데
  - 평안히
  - 평화를 가지고
  lexicon: LSJ
  rationale: 동반·상태를 나타내는 표현으로서 ‘평안 가운데’가 ‘with peace/in peace’의 의미를 자연스럽게 전달합니다.
theological_decisions:
- issue: 축복 진술의 어조
  chosen_reading: “복된 길입니다”로 비교적 직접적인 축복/환영의 선언을 유지했습니다.
  alternative_readings:
  - “복이 있습니다”
  - “환영받는 길입니다”
  rationale: 원문의 Εὐκτή는 단순한 인사 이상으로 ‘바람직하게 여겨지는’ 상태를 말하므로, 축복성과 환영성을 함께 남기는 표현이 가장 균형적입니다.
  doctrine_reference: source-semantic nuance
- issue: 평안 표현의 범위
  chosen_reading: “평안 가운데 들어오십시오”로 안전한 입장과 환대의 뉘앙스를 함께 살렸습니다.
  alternative_readings:
  - “평화롭게 들어오십시오”
  - “평안히 들어오십시오”
  rationale: μετʼ εἰρήνης는 단지 내면 상태가 아니라 환대의 방식까지 포함할 수 있어, 문맥상 ‘가운데’가 보다 넓은 의미를 보존합니다.
  doctrine_reference: source-context reading
