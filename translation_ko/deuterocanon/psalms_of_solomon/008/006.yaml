  - marker: c
    text: Or 'were troubled'.
    reason: previous_rendering
translation:
  language: ko
  text: 내 마음은 두려워졌고[a], 내 뼈들은 아마(亞麻) 섬유처럼[b] 흔들렸습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 마음이 두려워했습니다’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 뼈들은 아마포처럼 흔들렸습니다’. 원문의 비유는 난해하지만, 헬라어 λίνον은 가장 문자적으로 ‘아마(亞麻), 아마 섬유’를 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘동요되었습니다’.
    reason: previous_rendering
lexical_decisions:
- source_word: ἐφοβήθη
  english_pob_choice: was afraid
  chosen_korean: 두려워졌고
  alternatives_korean:
  - 두려웠고
  - 무서워했고
  lexicon: BDAG
  rationale: aorist deponent가 두려움의 발생을 나타내므로, 단순 상태보다 감정의 발생을 드러내는 ‘두려워졌고’가 자연스럽습니다.
- source_word: καρδία
  english_pob_choice: heart
  chosen_korean: 마음
  alternatives_korean:
  - 심장
  - 속마음
  lexicon: BDAG
  rationale: 히브리적 인체-정서 표현을 한국어에서 가장 자연스럽게 살리기 위해 ‘마음’을 택했습니다.
- source_word: ἐταράχθη … ὀστᾶ
  english_pob_choice: my bones were shaken
  chosen_korean: 제 뼈들은 … 흔들렸습니다
  alternatives_korean:
  - 제 뼈들은 … 동요되었습니다
  - 제 뼈들은 … 떨렸습니다
  lexicon: BDAG
  rationale: 뼈를 주어로 한 ταράσσω는 심리적 ‘혼란’보다 신체적 동요/떨림이 핵심이어서, ‘흔들렸습니다’가 원문의 체감적 이미지를 가장 잘 반영합니다.
- source_word: ὡς λίνον
  english_pob_choice: like flax
  chosen_korean: 아마 섬유처럼
  alternatives_korean:
  - 삼처럼
  - 린넨처럼
  lexicon: LSJ
  rationale: λίνον의 가장 직접적인 물질 이미지를 살리되, 한국어에서 ‘flax’의 생소함을 줄이기 위해 ‘아마 섬유’로 옮겼습니다.
theological_decisions:
- issue: 시적 비유의 난해성 보존
  chosen_reading: ‘아마 섬유처럼’으로 직역에 가까운 비유를 유지해, 본문이 의도한 낯선 감각을 약화하지 않았습니다.
  alternative_readings:
  - ‘천처럼’
  - ‘린넨처럼’
  rationale: 원문은 완제품 천이 아니라 원재료인 flax를 가리키므로, 비유를 매끈하게 만들기보다 원문의 거친 이미지를 보존하는 편이 source-direct합니다.
  doctrine_reference: 시편적 탄식의 시어 보존 원칙
- issue: 동사의 시제감
  chosen_reading: 과거 서술로 ‘두려워졌고… 흔들렸습니다’를 택했습니다.
  alternative_readings:
  - ‘두려웠고… 흔들렸습니다’
  rationale: 둘 다 가능하지만, aorist의 사건적 발생을 드러내기 위해 변화의 발생을 더 분명히 하는 표현을 선택했습니다.
  doctrine_reference: 헬라어 aorist 서술 관례
