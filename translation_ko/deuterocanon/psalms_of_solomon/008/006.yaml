base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/008/006.yaml
  text: My heart was afraid[c][b][a]; my bones were shaken like flax.
  footnotes:
  - marker: a
    text: Or 'my heart feared.'
    reason: lexical_alternative
  - marker: b
    text: Or 'my bones were shaken/disturbed like linen.' The image is difficult, but the Greek most literally reads 'like flax.'
