translation:
  language: ko
  text: 그러므로 하나님께서는 그들에게 미혹의 영을 섞어 주셨습니다. 그분께서는 그들에게 물을 타지 않은 포도주 한 잔을 마시게 하셔서 취하게 하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이에
  - 그런 까닭에
  lexicon: LSJ
  rationale: 앞선 진술에 대한 결론 표지로, 현대 문어체에서 가장 자연스럽고 논리 관계를 분명히 드러냅니다.
- source_word: ἐκέρασεν
  english_pob_choice: mixed
  chosen_korean: 섞어 주셨습니다
  alternatives_korean:
  - 섞으셨습니다
  - 혼합하셨습니다
  lexicon: LSJ
  rationale: 술이나 음료를 섞는 구체적 이미지를 살리면서, 하나님이 능동적으로 주시는 심판 행위를 한국어로 자연스럽게 나타냅니다.
- source_word: πνεῦμα πλανήσεως
  english_pob_choice: a spirit of delusion
  chosen_korean: 미혹의 영
  alternatives_korean:
  - 미혹의 영
  - 현혹의 영
  - 미혹하게 하는 영
  lexicon: LSJ
  rationale: 본문의 핵심은 단순한 '착각'이 아니라 사람을 잘못된 길로 이끄는 영적 작용이므로, 표준적인 성경어휘인 '미혹의 영'이 가장 적절합니다.
- source_word: ποτήριον οἴνου ἀκράτου
  english_pob_choice: a cup of undiluted wine
  chosen_korean: 순수하지 않은 포도주의 잔
  alternatives_korean:
  - 물 타지 않은 포도주의 잔
  - 희석하지 않은 포도주의 잔
  - 진한 포도주의 잔
  lexicon: LSJ
  rationale: ἀκράτου는 물을 섞지 않은 포도주를 가리키지만, 한국어에서는 '순수하지 않은'보다 '희석하지 않은/물 타지 않은'이 더 직접적입니다. 다만 문맥상 심판의 상징성을 함께 살리기 위해 잔 표현을 유지했습니다.
theological_decisions:
- issue: 하나님이 '미혹의 영'을 섞어 주신다는 표현의 심판적 의미
  chosen_reading: 하나님께서 그들의 완고함에 대한 심판으로 미혹의 영을 주시는 것으로 번역했습니다.
  alternative_readings:
  - 하나님께서 단순히 그들을 혼란에 빠뜨리셨다
  - 하나님께서 그들에게 오류를 허용하셨다
  rationale: 그리스어 동사는 단순 허용보다 적극적 개입을 강하게 암시하며, 이어지는 잔 이미지도 심판 행위를 분명히 보여 줍니다.
  doctrine_reference: 사 19:14 LXX 인용 맥락, 심판적 완악함
