translation:
  language: ko
  text: 그러므로 하나님께서 그들에게 미혹의 영을 섞어 주셨습니다. 그분은 그들에게 순수하지 않은 포도주의 잔을 마시게 하셔서 취하게 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
