  - 정당하심이 드러나셨습니다
  rationale: 본문은 하나님의 성품 변화가 아니라 역사 속 심판을 통해 드러난 하나님의 의를 말하므로, 기술적 ‘칭의’ 표현보다 공개적 입증의 의미를 살리는 것이 적절합니다.
