lexical_decisions:
- source_word: ἔδοσαν οἱ ὀφθαλμοὶ ἡμῶν
  english_pob_choice: Our eyes have seen
  chosen_korean: 우리의 눈이 ... 보았습니다
  alternatives_korean:
  - 우리의 눈이 ... 주었습니다
  - 우리의 눈이 ... 받았습니다
  - 우리의 눈이 ... 알아보았습니다
  lexicon: LSJ
  rationale: 직역하면 ‘주었습니다’가 되지만, ‘눈’이 주체이고 ‘심판들’이 목적어인 문맥상 인식·목격의 뜻이 가장 자연스럽습니다. 그래서 POB의 해석을 따라 ‘보았습니다’로 옮겼습니다.
- source_word: τὰ κρίματά σου
  english_pob_choice: your judgments
  chosen_korean: 주님의 심판들을
  alternatives_korean:
  - 주님의 판단들을
  - 주님의 판결들을
  - 주님의 재판 행위들을
  lexicon: LSJ
  rationale: κρίματα는 하나님의 심판 행위와 판결을 가리킬 수 있으므로, 문맥에 맞게 ‘심판들’로 옮겼습니다. 복수도 반영하여 개별적 행위들의 뉘앙스를 살렸습니다.
- source_word: ἐδικαιώσαμεν τὸ ὄνομά σου τὸ ἔντιμον
  english_pob_choice: we have justified your honored name
  chosen_korean: 우리는 주님의 존귀한 이름을 영원히 의롭게 하였습니다
  alternatives_korean:
  - 우리는 주님의 존귀한 이름을 영원히 옳다고 하였습니다
  - 우리는 주님의 존귀한 이름을 영원히 변호하였습니다
  - 우리는 주님의 존귀한 이름을 영원히 인정하였습니다
  lexicon: LSJ
  rationale: ἐδικαιώσαμεν은 문자적으로 ‘의롭게 하다/의롭다 하다’이지만, 여기서는 인간이 하나님의 이름을 ‘정당하다고 인정하며 옳다고 입증한다’는 뜻입니다. POB의 문맥 판단을 살려 ‘의롭게 하였습니다’로 유지하되, 한국어에서 어색한 목적어 관계를 최소화했습니다.
- source_word: τὸ ἔντιμον
  english_pob_choice: your honored name
  chosen_korean: 존귀한 이름
  alternatives_korean:
  - 존경받는 이름
  - 영예로운 이름
  - 귀한 이름
  lexicon: LSJ
  rationale: ἔντιμος는 ‘존귀한, 높이 여김받는’의 뜻이므로, 예배적·격식적 뉘앙스를 살리는 ‘존귀한’이 가장 적절합니다.
theological_decisions:
- issue: ἐδικαιώσαμεν을 하나님의 이름에 적용할 때의 신학적 뉘앙스
  chosen_reading: ‘의롭게 하였습니다’로 직역성을 살리되, 의미는 하나님의 이름의 정당성과 공의를 인정하고 공적으로 입증하는 것으로 이해합니다.
  alternative_readings:
  - ‘정당하다고 인정하였습니다’
  - ‘옳다고 변호하였습니다’
  - ‘의롭다고 선언하였습니다’
  rationale: 본문은 사람이 하나님을 의롭게 만든다는 뜻이 아니라, 드러난 심판을 보고 하나님의 이름의 옳음을 인정하는 고백입니다. 따라서 표현은 유지하되 의미를 오해하지 않도록 문맥적 읽기를 보존합니다.
  doctrine_reference: 하나님의 의와 인간의 증언
- issue: ‘영원히’의 위치와 지속성 강조
  chosen_reading: εἰς αἰῶνας를 ‘영원히’로 옮겨, 이름에 대한 지속적 고백의 기간을 분명히 드러냅니다.
  alternative_readings:
  - ‘세세토록’
  - ‘영원까지’
  - ‘영원한 세월 동안’
  rationale: 한국어에서 가장 자연스럽고 지속성을 분명히 하는 표현은 ‘영원히’입니다. 이는 시적 병행 구조도 해치지 않습니다.
  doctrine_reference: 종말론적 지속성
