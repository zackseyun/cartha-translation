translation:
  language: ko
  text: 우리의 눈이 주님의 심판들을 보았습니다, 하나님이여. 우리는 주님의 존귀한 이름을 영원히 의롭게 하였습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어는 문자적으로 ‘우리의 눈이 당신의 심판들을 주었습니다’에 가깝지만, 문맥상 ‘보았습니다’가 뜻에 더 잘 맞습니다.
