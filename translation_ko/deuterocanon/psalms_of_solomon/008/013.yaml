  lexicon: LSJ
  rationale: ἄφεδρος는 LXX에서 월경 부정을 가리키는 기술적 표현이므로, 충격적인 제의적 위반을 드러내기 위해 ‘월경 혈’로 옮겼습니다.
- source_word: κρέα βέβηλα
  english_pob_choice: profane meat
  chosen_korean: 속된 고기처럼
