translation:
  language: ko
  text: 그들은 주님의 제단을 모든 부정함으로 짓밟고, 월경 혈로 제물을 더럽혀, 그것을 속된 고기처럼 만들었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 첫 동사형은 전승상 난해하지만, 문맥과 관련 전승을 따르면 ‘그들은 주님의 제단을 짓밟았습니다’라는 뜻으로 읽을 수 있습니다.
    reason: textual_variant
  - marker: b
    text: 더 분명하게 말하면 ‘월경 부정과 같은 피의 부정으로’라는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘피가 흐르는 부정한 고기처럼’이라고도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ἐπίπουσαν
