  - 거룩하지 않은 고기처럼
  - 범속한 고기처럼
  lexicon: LSJ
  rationale: βέβηλα는 거룩한 것과 대비되는 ‘속된/범속한’ 뜻이므로, 제물의 성별됨이 훼손되었음을 드러내는 ‘속된 고기처럼’이 가장 자연스럽습니다.
theological_decisions:
- issue: 성소 모독의 강도 표현
  chosen_reading: ‘주님의 제단을 모든 부정함으로 짓밟고’로 옮겨, 단순 오염이 아니라 의도적이고 폭력적인 성소 모독을 드러냈습니다.
  alternative_readings:
  - ‘주님의 제단에 모든 부정함을 가져와’
  - ‘주님의 제단을 더럽혔습니다’
  rationale: 헬라어 동사와 전체 문맥은 희생제와 제단에 대한 적극적 훼손을 나타내므로, 약화된 표현보다 가시적인 모독 행위를 살리는 번역이 더 충실합니다.
  doctrine_reference: 성소 정결, 제의적 부정, 모독의 강조
- issue: 월경 부정의 노골성
  chosen_reading: ‘월경 혈’로 명시하여 제의적 부정의 구체성을 유지했습니다.
  alternative_readings:
  - ‘혈의 부정’
  - ‘피가 섞인 부정’
  rationale: 본문의 기술적 표현 ἄφεδρος는 단순한 출혈이 아니라 월경 부정을 가리키므로, 본문의 충격과 예배 훼손의 구체성을 지우지 않는 쪽이 원문에 더 가깝습니다.
  doctrine_reference: 레위기적 정결 규정의 배경
- issue: 제물의 상태
  chosen_reading: ‘속된 고기처럼’으로 번역해 거룩한 제물과 일반 육류의 대비를 살렸습니다.
  alternative_readings:
  - ‘더러운 고기처럼’
  - ‘보통 고기처럼’
  rationale: βέβηλα는 단순한 오염보다 ‘거룩하지 않음/속됨’의 반대말이므로, 제물의 성별이 무효화된 느낌을 주는 표현이 적절합니다.
  doctrine_reference: 거룩/속됨의 대비
