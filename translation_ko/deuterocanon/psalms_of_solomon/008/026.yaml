translation:
  language: ko
  text: 그는 예루살렘과 하나님의 이름에 바쳐진 것들을 더럽혔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “거룩한 것들” 혹은 “성별된 것들”.
