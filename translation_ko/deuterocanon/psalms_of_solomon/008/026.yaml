lexical_decisions:
- source_word: ἐμίανεν
  english_pob_choice: defiled
  chosen_korean: 더럽혔습니다
  alternatives_korean:
  - 오염시켰습니다
  - 부정하게 했습니다
  - 모독했습니다
  lexicon: BDAG
  rationale: μίανω는 의식적·도덕적 부정을 가리키므로, ‘더럽혔습니다’가 그 부정의 의미를 가장 직접적으로 살리면서도 지나치게 해석적인 ‘모독했습니다’는 피합니다.
- source_word: Ἰερουσαλήμ
  english_pob_choice: Jerusalem
  chosen_korean: 예루살렘
  alternatives_korean:
  - 예루살렘 성
  lexicon: 표준 외래어 표기
  rationale: 고유명사는 통용되는 성경 표기인 ‘예루살렘’을 사용합니다.
- source_word: τὰ ἡγιασμένα
  english_pob_choice: the things sanctified
  chosen_korean: 바쳐진 것들
  alternatives_korean:
  - 거룩하게 된 것들
  - 성별된 것들
  - 거룩한 것들
  lexicon: BDAG
  rationale: 완료 수동 분사로 된 중성 복수 명사구는 ‘거룩한 것들’보다 ‘바쳐진 것들’이 헌납·성별의 결과를 더 분명히 드러내며, 제의적 대상을 자연스럽게 표현합니다.
- source_word: τῷ ὀνόματι τοῦ θεοῦ
  english_pob_choice: in the name of God
  chosen_korean: 하나님의 이름에
  alternatives_korean:
  - 하나님의 이름으로
  - 하나님의 이름 안에
  - 하나님의 이름을 위해
  lexicon: BDAG
  rationale: 여격은 헌납의 방향을 나타내므로 ‘~에’가 가장 자연스럽고, ‘하나님의 이름에 바쳐진’으로 원문의 헌납 관계를 한국어에서 유지합니다.
theological_decisions:
- issue: 성별/헌납된 대상을 가리키는 표현의 처리
  chosen_reading: ‘바쳐진 것들’로 옮겨 제의적으로 하나님께 속한 물건이 더럽혀졌다는 의미를 드러냈습니다.
  alternative_readings:
  - ‘거룩하게 된 것들’
  - ‘성별된 것들’
  rationale: 문맥상 단순한 일반적 ‘거룩함’보다 예루살렘과 연관된 성전적·제의적 대상의 헌납성이 중요하므로, 한국어에서 그 긴장을 가장 분명히 보여 주는 표현을 택했습니다.
  doctrine_reference: 제의적 성결과 헌납의 개념(레위기적 성별 언어)
