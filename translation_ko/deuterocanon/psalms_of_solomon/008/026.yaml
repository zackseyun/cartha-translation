  source_fidelity: ‘더럽혔습니다’는 ἐμίανεν의 제의적 부정 의미를 적절히 전달하며, ‘예루살렘’도 정확합니다. 그러나 τὰ ἡγιασμένα는 ‘거룩하게 하다/성별하다’의 완료 수동 분사이므로, 본문의 ‘바쳐진 것들’은 헌납의 한 측면은 나타내지만 성별·거룩함이라는 핵심 의미를 약화합니다. ‘하나님의 이름에’는 이 문맥에서 헌정의 대상을 나타내는 여격으로 무리 없이 유지할 수 있습니다.
  naturalness: ‘하나님의 이름에 성별된 것들’은 현대 표준 한국어의 격식 있는 성경 문체에서 자연스럽고, 합쇼체 문장과도 잘 어울립니다. 기존 각주 b의 ‘하나님의 이름 안에 바쳐진’은 한국어로 부자연스럽고 의미 관계도 불명확합니다.
  terminology: ἡγιασμένα에는 ‘성별된 것들’을 사용하여 제의적 거룩함과 수동 결과 상태를 보존했습니다. ‘더럽혔습니다’와 ‘성별된’의 대비도 원문의 제의 언어를 충실히 반영합니다.
