id: PSS.8.23
reference: Psalms of Solomon 8:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: lxx-swete-1909
  text: ἀπώλεσεν ἄρχοντας αὐτῶν καὶ πᾶν σοφὸν ἐν βουλῇ, ἐξέχεεν τὸ αἷμα τῶν οἰκούντων Ἰερουσαλὴμ ὡς ὕδωρ ἀκαθαρσίας.
  language: Greek
  pages:
  - 798
  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/008/023.yaml
  text: He destroyed their rulers and everyone wise in counsel[c][b][a]; he poured out the blood of those dwelling in Jerusalem like unclean water.
  footnotes:
  - marker: a
    text: Or 'every wise counselor' / 'all who were wise in counsel.' The Greek phrase is compressed and collective.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'like water of uncleanness' or 'like water of impurity.'
    reason: lexical_alternative
  - marker: c
    text: Or 'like unclean water'.
    reason: previous_rendering
translation:
  language: ko
  text: 그분은 그들의 통치자들과 의논에 지혜로운 모든 사람을 멸하셨고, 예루살렘에 거주하는 사람들의 피를 부정한 물처럼 쏟으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘부정의 물’ 또는 ‘불결의 물’입니다. ἀκαθαρσίας는 단순한 물리적 더러움뿐 아니라 의례적 부정의 뉘앙스를 지닐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώλεσεν ἄρχοντας αὐτῶν
  english_pob_choice: He destroyed their rulers
  chosen_korean: 그들의 통치자들을 멸하셨고
  alternatives_korean:
  - 그들의 지도자들을 파괴하셨고
  - 그들의 지도자들을 죽이셨고
  lexicon: LSJ
  rationale: ἄρχοντας는 단순한 지도자보다 권력을 가진 통치자들이라는 정치적 함의를 가지므로, ‘통치자들’이 가장 직접적입니다. ἀπώλεσεν은 ‘멸하다/파멸시키다’의 넓은 파괴 의미를 살렸습니다.
- source_word: πᾶν σοφὸν ἐν βουλῇ
  english_pob_choice: everyone wise in counsel
  chosen_korean: 조언에 능한 사람들 모두를
  alternatives_korean:
  - 모든 조언에 지혜로운 자를
  - 조언에 현명한 모든 사람을
  lexicon: LSJ
  rationale: 그리스어 구문은 압축되어 있어 개인 칭호라기보다 ‘상담/의논에서 지혜로운 사람들’ 전체를 가리킵니다. 이를 한국어에서도 집합적으로 풀어 읽히도록 했습니다.
- source_word: ὡς ὕδωρ ἀκαθαρσίας
  english_pob_choice: like unclean water
  chosen_korean: 더러운 물처럼
  alternatives_korean:
  - 부정한 물처럼
  - 불결한 물처럼
  - 부정의 물처럼
  lexicon: LSJ
  rationale: 명사 ἀκαθαρσίας는 문자적으로 ‘부정/더러움의 것’이라는 뜻이므로, 문맥상 자연스럽고 이미지가 분명한 ‘더러운 물처럼’을 택했습니다. 다만 cultic(의례적) 부정의 뉘앙스는 다음 각주로 보존합니다.
theological_decisions:
- issue: ἀκαθαρσίας의 부정/의례적 불결성 뉘앙스
  chosen_reading: ‘더러운 물’로 옮기되, 원문의 ἀκαθαρσίας가 단순한 시각적 더러움이 아니라 부정/오염의 의미를 가진다는 점을 각주로 밝혔습니다.
  alternative_readings:
  - ‘부정한 물처럼’
  - ‘오염의 물처럼’
  - ‘부정의 물처럼’
  rationale: 시의적이고 읽기 쉬운 표현을 유지하면서도, 원문의 cultic 어휘가 지닌 신학적 강도를 지우지 않기 위해서입니다.
  doctrine_reference: 정결/부정 관념과 제의적 오염
- issue: 혈액을 ‘쏟아부으셨습니다’로 표현한 이미지
  chosen_reading: ἐξέχεεν의 구체적이고 폭력적인 이미지를 살려 ‘쏟아부으셨습니다’로 옮겼습니다.
  alternative_readings:
  - ‘흘리셨습니다’
  - ‘쏟으셨습니다’
  rationale: 단순히 ‘흘리다’로 완화하면 원문의 충격성이 약해지므로, 피가 물처럼 흘러넘치는 장면을 보존했습니다.
  doctrine_reference: 심판의 폭력적 표상
