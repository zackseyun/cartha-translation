lexical_decisions:
- source_word: ἀνεκάλυψεν
  english_pob_choice: exposed
  chosen_korean: 드러내셨습니다
  alternatives_korean:
  - 폭로하셨습니다
  - 드러내셨다
  - 드러내셨습니다
  lexicon: BDAG
  rationale: 숨겨진 것을 공적으로 보이게 한다는 뜻을 살리면서도, 문맥의 수치를 강조하는 ‘폭로하다’보다 본문 어감에 더 중립적이고 자연스럽습니다.
- source_word: ἐναντίον τοῦ ἡλίου
  english_pob_choice: before the sun
  chosen_korean: 해처럼
  alternatives_korean:
  - 해 앞에서
  - 해 앞에
  - 태양 앞에서
  lexicon: BDAG
  rationale: 직역형 ‘해 앞에서’도 가능하지만, 공개성과 드러남의 이미지를 한국어에서 간결하게 살리기 위해 비유적 표현으로 옮겼습니다.
- source_word: κρίματα τοῦ θεοῦ τὰ δίκαια
  english_pob_choice: righteous judgments
  chosen_korean: 하나님의 의로운 심판들
  alternatives_korean:
  - 하나님의 의로운 판단들
  - 하나님의 공의로운 심판들
  - 하나님의 의로운 재판들
  lexicon: BDAG
  rationale: κρίματα는 단순한 ‘판단’보다 하나님의 공적 판결을 가리키므로 ‘심판들’이 더 직접적입니다. δίκαια는 ‘의로운’으로 옮겨 하나님 심판의 도덕적 정당성을 살렸습니다.
theological_decisions:
- issue: δίκαια를 ‘의로운’으로 둘지 ‘공의로운/옳은’으로 둘지
  chosen_reading: 하나님의 의로운 심판들
  alternative_readings:
  - 하나님의 공의로운 심판들
  - 하나님의 옳은 심판들
  rationale: 본문은 하나님의 판결이 단지 절차적으로 공정하다는 뜻을 넘어서, 그의 성품에 합당한 도덕적 정당성을 강조합니다. 그래서 ‘의로운’이 가장 균형 있게 그 긴장을 보존합니다.
  doctrine_reference: 하나님의 의와 심판의 정당성
