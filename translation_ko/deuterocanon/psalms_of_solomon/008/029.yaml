lexical_decisions:
- source_word: αἰνετὸς
  english_pob_choice: Praised be
  chosen_korean: 찬양받으실
  alternatives_korean:
  - 찬양받으소서
  - 찬양받을 만하신
  lexicon: LSJ
  rationale: 형용사 αἰνετὸς는 ‘찬양받는/찬양받을 만한’ 뜻이므로, 축복형의 ‘복되신’이 아니라 찬양의 대상임을 드러내는 표현으로 옮겼습니다.
- source_word: Κύριος
  english_pob_choice: the Lord
  chosen_korean: 주
  alternatives_korean:
  - 주님
  - 야훼
  lexicon: LSJ
  rationale: 본문의 Κύριος는 정관적 호칭이므로 POB 기본값에 따라 ‘주’로 옮겼고, 이 절은 LXX 인용 표지가 아니라서 야훼로 바꾸지 않았습니다.
- source_word: ἐν δικαιοσύνῃ αὐτοῦ
  english_pob_choice: in his righteousness
  chosen_korean: 의로우심으로
  alternatives_korean:
  - 그의 의 안에서
  - 그의 정의로
  - 공의로
  lexicon: LSJ
  rationale: ἐν + 여격은 여기서 심판의 방식/기준을 나타내므로 ‘의로우심으로’가 자연스럽고, δικαιοσύνη의 도덕적·언약적 뉘앙스를 살립니다.
theological_decisions:
- issue: πᾶσαν τὴν γῆν의 범위
  chosen_reading: ‘온 땅’으로 옮겨 보편적 심판의 범위를 분명히 했습니다.
  alternative_readings:
  - ‘이 땅 전체’
  - ‘모든 땅’
  rationale: γῆ는 문맥상 특정 지역이 아니라 전 지면/세계를 가리키므로, 제한적 ‘땅’보다 보편성을 드러내는 표현이 적절합니다.
  doctrine_reference: 하나님의 सार्व/보편 심판
