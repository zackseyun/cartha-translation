base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/008/012.yaml
  text: The holy things of God were being plundered[b][a], as though there were no heir to redeem them.
  footnotes:
  - marker: a
    text: Or 'as though there were no heir redeeming them'; the Greek participle may be rendered more directly.
    reason: alternative_reading
  - marker: b
    text: '''The holy things'' could also be understood more specifically as ''the sacred things'' or, less likely here, ''the sanctuary.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님의 거룩한 것들이 약탈당하고 있었으며, 마치 그것들을 속량할 상속자가 없는 것처럼 그랬습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마치 그것들을 속량하는 상속자가 없는 것처럼’으로 더 직접 옮길 수 있습니다. 그리스어 분사는 주절에 더 밀착될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘하나님의 거룩한 것들’은 더 구체적으로는 ‘거룩한 것들’, 드물게는 ‘성소’로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἅγια
  english_pob_choice: the holy things
  chosen_korean: 하나님의 거룩한 것들
  alternatives_korean:
  - 거룩한 것들
  - 성소
  lexicon: BDAG
  rationale: 중성 복수는 장소인 ‘성소’보다 하나님의 거룩한 소유물·거룩한 대상들을 가리키는 뜻이 더 자연스러우므로, 문맥을 살려 ‘하나님의 거룩한 것들’로 옮겼습니다.
- source_word: διηρπάζοντο
  english_pob_choice: were being plundered
  chosen_korean: 약탈당하고 있었으며
  alternatives_korean:
  - 빼앗기고 있었으며
  - 유린당하고 있었으며
  lexicon: LSJ
  rationale: 미완료 수동태의 지속적·반복적 폭력성을 살리기 위해 진행형으로 ‘약탈당하고 있었으며’라고 번역했습니다.
- source_word: ὡς μὴ ὄντος κληρονόμου
  english_pob_choice: as though there were no heir
  chosen_korean: 마치 그것들을 속량할 상속자가 없는 것처럼
  alternatives_korean:
  - 마치 상속자가 없는 것처럼
  - 마치 그들을 구속할 상속자가 없는 것처럼
  lexicon: BDAG
  rationale: ‘상속자’의 기본 의미를 유지하면서, 이어지는 분사 λυτρουμένου의 구속적 기능을 한국어에서 자연스럽게 드러내기 위해 ‘그것들을 속량할 상속자’로 처리했습니다.
- source_word: λυτρουμένου
  english_pob_choice: to redeem them
  chosen_korean: 속량할
  alternatives_korean:
  - 구속할
  - 되찾을
  lexicon: BDAG
  rationale: 이 분사는 단순한 구조보다 구속·대가의 뉘앙스를 포함하므로, 교회적이면서도 원문의 힘을 살리는 ‘속량할’을 선택했습니다.
theological_decisions:
- issue: κληρονόμου λυτρουμένου의 결합을 어떻게 살릴 것인가
  chosen_reading: 상속자가 그것들을 속량하는 역할을 전제로 한 표현으로 보되, 본문 표면의 ‘상속자’와 ‘속량’의 긴장을 그대로 유지했습니다.
  alternative_readings:
  - ‘속량하는 상속자’로 더 직접적으로 합쳐 번역
  - ‘구속자’로 의미를 풀어 번역
  rationale: 그리스어는 상속자와 구속 행위를 함께 제시하지만, 어휘 자체는 분리되어 있습니다. 한국어에서도 두 요소를 모두 보이게 하여 해석을 과도하게 평탄화하지 않았습니다.
  doctrine_reference: 본문 주해 원칙; 어휘-신학 긴장 보존
