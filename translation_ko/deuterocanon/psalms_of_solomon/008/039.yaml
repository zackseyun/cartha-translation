translation:
  language: ko
  text: 우리와 우리 자녀에게 영원히 호의가 있기를[a] 바랍니다. 주님, 우리의 구원자시여, 우리는 다시는 영원토록 흔들리지 않을 것입니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: εὐδοκία는 여기서 ‘호의’, ‘선의’, 또는 ‘좋은 뜻’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 직역하면 ‘우리는 더 이상 영원한 시간 동안 흔들리지 않을 것이다’에 가까우며, 지속되는 안정성을 강하게 강조합니다.
    reason: lexical_alternative
  - marker: c
    text: '다른 옮김: ‘우리와 우리 자녀에게는 호의가 영원히 있습니다. 주님, 우리의 구원자시여.’'
    reason: previous_rendering
lexical_decisions:
- source_word: ἡμῖν καὶ τοῖς τέκνοις ἡμῶν
  english_pob_choice: May favor be upon us and our children forever
  chosen_korean: 우리와 우리 자녀에게 영원히 호의가 있기를 바랍니다
  alternatives_korean:
  - 우리와 우리 자녀에게 영원한 은혜가 있기를 바랍니다
  - 우리와 우리 자녀 위에 영원히 호의가 있기를 바랍니다
  lexicon: BDAG
  rationale: ἡμῖν…τέκνοις ἡμῶν은 수혜자 표지로 자연스럽게 옮겼고, τέκνα는 성별 제한 없는 ‘자녀’로 번역했습니다. εὐδοκία는 전례적 문맥에서 하나님의 호의/은총의 뜻을 살려 ‘호의’로 했습니다.
- source_word: Κύριε
  english_pob_choice: O Lord
  chosen_korean: 오 주
  alternatives_korean:
  - 주님이여
  - 오 주님
  lexicon: BDAG
  rationale: 하나님께 직접 부르는 호격이므로 예전적 호소를 살리되, 현대 합쇼체에 맞게 간결한 ‘오 주’로 옮겼습니다.
- source_word: σωτὴρ ἡμῶν
  english_pob_choice: our Savior
  chosen_korean: 우리 구원자여
  alternatives_korean:
  - 우리의 구원자여
  - 우리 구주여
  lexicon: BDAG
  rationale: σωτήρ의 호칭성을 유지하기 위해 ‘구원자’로 옮겼고, 호격을 드러내기 위해 ‘-여’를 붙였습니다. 교회 전통어 ‘구주’보다 원어의 직설성을 살렸습니다.
- source_word: οὐ σαλευθησόμεθα ἔτι τὸν αἰῶνα χρόνον
  english_pob_choice: we shall never again be shaken forever
  chosen_korean: 우리는 다시는 영원히 흔들리지 않을 것입니다
  alternatives_korean:
  - 우리는 더 이상 영원히 흔들리지 않을 것입니다
  - 우리는 다시는 흔들리지 않을 것입니다
  lexicon: BDAG
  rationale: σαλευθησόμεθα는 ‘흔들리다/요동하다/동요되다’의 수동 미래로, 안정성의 상실을 그대로 드러내는 ‘흔들리지 않을 것입니다’로 옮겼습니다. τὸν αἰῶνα χρόνον의 중첩된 지속 표현은 ‘영원히’로 압축했습니다.
theological_decisions:
- issue: εὐδοκία의 시편적 기도/선언 뉘앙스
  chosen_reading: 본문은 공동체를 향한 하나님의 호의를 간구하거나 확언하는 전례적 문장으로 읽고, ‘호의가 있기를 바랍니다’라고 옮겼습니다.
  alternative_readings:
  - ‘호의가 있습니다’라는 선언문
  - ‘좋은 뜻/기쁨’이라는 추상적 번역
  rationale: 그리스어 무서술절은 요청과 확언 두 가능성을 모두 허용하지만, 한국어에서는 기도체가 문맥에 가장 자연스럽습니다. 동시에 εὐδοκία의 ‘좋은 뜻’보다 공동체에 임하는 긍정적 은혜를 분명히 드러냅니다.
  doctrine_reference: 시편적 축복/간구의 문체
- issue: τὸν αἰῶνα χρόνον의 중첩 강조
  chosen_reading: ‘영원히’로 번역하되, ‘다시는’과 결합해 부정의 지속성을 강조했습니다.
  alternative_readings:
  - ‘for all time’을 따라 ‘모든 때 동안’
  - ‘영원토록’
  rationale: 그리스어의 중첩은 단순한 장기가 아니라 강한 지속 부정을 강조하므로, 한국어에서도 ‘다시는…영원히’로 강도를 보존했습니다.
  doctrine_reference: 종말론적 보존/견인 표현
