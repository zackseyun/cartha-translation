translation:
  language: ko
  text: 그리고 하나님의 거룩한 이들은 양들처럼 순결 가운데 그들 한가운데 있었습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ὅσιοι는 문맥상 ‘경건한 이들’ 또는 ‘신실한 이들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ἐν ἀκακίᾳ는 직역하면 ‘무해함 가운데’이며, ‘순결 가운데’는 이를 자연스럽게 다듬은 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그들 한가운데’는 ‘그들 가운데’ 또는 ‘그들 사이에’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 이 절은 앞선 서술 시제를 이어 받아 ‘있었습니다’로 옮겼습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: οἱ ὅσιοι
  english_pob_choice: holy ones
  chosen_korean: 거룩한 이들
  alternatives_korean:
  - 경건한 이들
  - 신실한 이들
  - 성도들
  lexicon: BDAG
  rationale: ὅσιοι는 단순한 제도적 ‘성도’보다 하나님께 속한 경건하고 구별된 사람들을 가리키므로, ‘거룩한 이들’이 어감과 의미를 가장 무리 없이 살립니다.
- source_word: ἀρνία
  english_pob_choice: lambs
  chosen_korean: 양들
  alternatives_korean:
  - 어린 양들
  - 어린 양
  - 양새끼들
  lexicon: LSJ
  rationale: 원문은 복수의 ‘lambs’이므로 복수형 ‘양들’로 옮기되, 한국어에서 자연스러운 표현을 우선했습니다.
- source_word: ἐν ἀκακίᾳ
  english_pob_choice: in innocence
  chosen_korean: 순결 가운데
  alternatives_korean:
  - 무죄 가운데
  - 순진함 가운데
  - 순결 속에
  lexicon: BDAG
  rationale: ἀκακία는 해함이 없고 악의가 없는 상태를 가리키므로, 문어체로는 ‘순결 가운데’가 무고함과 결백성을 함께 살립니다.
- source_word: ἐν μέσῳ αὐτῶν
  english_pob_choice: in their midst
  chosen_korean: 그들 한가운데
  alternatives_korean:
  - 그들 가운데
  - 그들 한복판에
  - 그들 사이에
  lexicon: BDAG
  rationale: 공간적 위치를 직접 드러내는 표현이므로 ‘그들 한가운데’가 원문의 장면성을 가장 잘 보존합니다.
theological_decisions:
- issue: ὅσιοι의 한국어 종교어휘 선택
  chosen_reading: ‘거룩한 이들’로 번역해, 후대 교회제도적 뉘앙스가 강한 ‘성도들’보다 본문의 경건한 공동체성을 더 직접적으로 드러냈습니다.
  alternative_readings:
  - 성도들
  - 경건한 이들
  - 신실한 이들
  rationale: 이 문맥은 특정 교회 직분이나 일반적 신자 집단을 말하기보다 하나님께 구별된 사람들의 품성을 강조하므로, 표어적이면서도 본문 친화적인 표현을 택했습니다.
  doctrine_reference: 성화/경건한 남은 자 이해
- issue: ἐν ἀκακίᾳ의 상태 표현
  chosen_reading: ‘순결 가운데’로 상태를 살려, 단순한 형용사 ‘순결한’보다 무해함과 결백의 분위기를 보존했습니다.
  alternative_readings:
  - 순결한
  - 무죄한
  - 순진한
  rationale: 원문은 명사구를 통해 양들의 성격을 묘사하므로, 상태를 나타내는 한국어 구문이 구조를 더 잘 반영합니다.
  doctrine_reference: 본문의 묘사적 수사
