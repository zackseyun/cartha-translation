lexical_decisions:
- source_word: φωνὴ λαοῦ πολλοῦ
  english_pob_choice: The sound of a great multitude
  chosen_korean: 큰 무리의 소리
  alternatives_korean:
  - 많은 사람들의 목소리
  - 큰 백성의 소리
  - 거대한 군중의 소리
  lexicon: LSJ
  rationale: φωνὴ는 여기서 한 사람의 ‘목소리’보다 집합적으로 들리는 ‘소리’가 자연스럽고, λαοῦ πολλοῦ는 수적 규모가 큰 무리를 가리키므로 ‘큰 무리의 소리’가 가장 직접적입니다.
- source_word: ὡς ἀνέμου πολλοῦ σφόδρα
  english_pob_choice: like a very strong wind
  chosen_korean: 매우 강한 바람 같고
  alternatives_korean:
  - 매우 센 바람 같고
  - 대단히 강한 바람 같고
  - 극도로 거센 바람 같고
  lexicon: LSJ
  rationale: πολλοῦ와 σφόδρα의 이중 강화를 한국어에서 자연스럽게 살리기 위해 ‘매우 강한 바람’으로 옮겼습니다.
- source_word: καταιγὶς πυρὸς πολλοῦ
  english_pob_choice: a storm of great fire
  chosen_korean: 큰 불의 폭풍
  alternatives_korean:
  - 큰 불의 소용돌이
  - 거센 불의 폭풍
  - 큰 화염의 폭풍
  lexicon: LSJ
  rationale: καταιγίς는 단순한 ‘비바람’보다 파괴적으로 밀어닥치는 ‘폭풍’의 이미지가 강하고, πυρὸς πολλοῦ는 ‘큰 불’로 직역하면 이미지가 선명해집니다.
- source_word: φερομένου διʼ ἐρήμου
  english_pob_choice: sweeping through the wilderness
  chosen_korean: 광야를 가로질러 나아가는
  alternatives_korean:
  - 광야를 휩쓸며 가는
  - 광야를 지나 몰려가는
  - 광야를 통과하며 밀려가는
  lexicon: LSJ
  rationale: φερομένου는 ‘운반되다/몰리다’의 수동적 진행을 띠므로, 불길이 강하게 전진하는 모습을 ‘가로질러 나아가는’으로 자연스럽게 표현했습니다. ἔρημος는 문맥상 ‘광야’가 적절합니다.
