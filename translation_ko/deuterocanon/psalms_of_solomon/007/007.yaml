lexical_decisions:
- source_word: ἐπικαλεσόμεθαί
  english_pob_choice: will call upon
  chosen_korean: 부르짖을 것이며
  alternatives_korean:
  - 부를 것이며
  - 호소할 것이며
  - 간구할 것이며
  lexicon: BDAG
  rationale: 기도 문맥의 ἐπικαλέω는 단순한 호출보다 하나님께 간구하며 부르는 의미가 강하므로, 한국어에서는 자연스럽고 경건한 “부르짖다”로 옮겨 그 기도적 뉘앙스를 살렸습니다.
- source_word: σὺ
  english_pob_choice: you
  chosen_korean: 주께서는
  alternatives_korean:
  - 당신은
  - 주님은
  lexicon: 인칭대명사/문맥
  rationale: 문맥상 하나님께 드리는 직접 호소이므로 존칭을 사용하되, 평서적 진술 흐름을 유지하기 위해 주어 표지를 살렸습니다.
- source_word: ἐπακούσει
  english_pob_choice: will hear
  chosen_korean: 귀 기울이실 것입니다
  alternatives_korean:
  - 들으실 것입니다
  - 들어주실 것입니다
  - 유의하실 것입니다
  lexicon: BDAG
  rationale: ἐπακούω는 단순 청취보다 호의적으로 들어 응답하는 뉘앙스를 가질 수 있어, “귀 기울이시다”로 옮겨 원문의 관계적 의미를 드러냈습니다.
- source_word: ἡμῶν
  english_pob_choice: us
  chosen_korean: 우리에게
  alternatives_korean:
  - 우리를
  - 우리의 기도를
  lexicon: 문맥/한국어 구문
  rationale: 한국어에서는 ἐπακούω의 목적 관계를 “우리에게 귀 기울이시다”로 자연스럽게 표현할 수 있으므로, 원문에 없는 “기도”를 덧붙이지 않았습니다.
theological_decisions:
- issue: 하나님께 드리는 직접 호소의 어조
  chosen_reading: “부르짖을 것이며”와 “귀 기울이실 것입니다”로 기도 응답의 기대를 분명히 드러냈습니다.
  alternative_readings:
  - “부를 것이며 … 들으실 것입니다”
  - “간구할 것이며 … 들어주실 것입니다”
  rationale: 시편적 기도 문맥에서는 단순 정보 전달보다 탄원과 응답의 관계가 중요하므로, 현대 한국어에서 그 긴장을 가장 분명히 전달하는 표현을 택했습니다.
  doctrine_reference: 기도와 하나님의 응답에 대한 성경적 증언
