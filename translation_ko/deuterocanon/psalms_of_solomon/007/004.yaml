  source_fidelity: 현 초안의 ‘그 일에 관하여 우리에게 명령하실 것입니다’는 ἐντελῇ αὐτῷ περὶ ἡμῶν의 논항 관계를 뒤바꿉니다. 명령을 받는 대상은 죽음(αὐτῷ)이며, 명령의 관련 대상은 우리(περὶ ἡμῶν)입니다. 또한 γάρ는 앞 절의 근거를 제시하므로 ‘그러므로’보다 ‘왜냐하면’이 적절합니다.
  naturalness: ‘끝장내시도록 진노하시지 않기 때문입니다’는 다소 구어적이고 문장 종결의 인과 관계가 겹칩니다. ‘우리를 완전히 멸하실 만큼 진노하지 않으실 것입니다’는 결과·정도의 의미를 자연스러운 현대 합쇼체로 드러냅니다.
  terminology: θάνατον은 특정하게 ‘전염병’으로 한정하지 않고 ‘죽음’으로 옮기는 것이 안전합니다. αὐτῷ의 남성 문법성은 한국어에서 대명사 성별로 재현할 수 없으나, ‘죽음에게’라고 하여 죽음을 명령받는 인격화된 대상으로 표현할 수 있습니다. ἐλεήμων은 ‘자비로우시다’가 적절합니다.
