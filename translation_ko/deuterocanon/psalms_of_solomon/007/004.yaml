  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/007/004.yaml
  text: For if you send death[a], you will command it concerning us; for you are merciful[c][b], and you will not be angry so as to bring us to an end.
  footnotes:
  - marker: a
    text: Or 'you will not be angry to destroy us utterly.'
    reason: lexical_alternative
  - marker: b
    text: The Greek personifies death with the masculine pronoun 'him.'
    reason: cultural_note
  - marker: c
    text: Or 'death, you will command him concerning us; for you are merciful, and you will not be angry enough to'.
    reason: previous_rendering
translation:
  language: ko
  text: 왜냐하면 주께서 죽음을 보내신다면, 죽음에게 우리에 관하여 명하실 것이기 때문입니다. 주께서는 자비로우시므로, 우리를 완전히 멸하실 만큼 진노하지 않으실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘죽음’(θάνατον)은 여기서 특정한 재앙이나 전염병으로 한정되지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 ‘죽음’을 남성형 대명사로 받아, 죽음을 명령을 받을 수 있는 대상으로 인격화합니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἐὰν γὰρ ἀποστείλῃς θάνατον
  english_pob_choice: For if you send death
  chosen_korean: 그러므로 만일 주께서 죽음을 보내시면
  alternatives_korean:
  - 만일 주께서 죽음을 보내신다면
  - 그러니 만일 주께서 죽음을 파견하시면
  lexicon: BDAG
  rationale: ἀποστείλῃς는 여기서 단순히 ‘보내다’의 뜻이므로 이를 직접 살렸고, θάνατον은 영어 POB의 수정 이력과 달리 원어에 맞게 ‘죽음’으로 옮겼습니다.
- source_word: ἐντελῇ αὐτῷ περὶ ἡμῶν
  english_pob_choice: you will command it concerning us
  chosen_korean: 주께서 그 일에 관하여 우리에게 명령하실 것입니다
  alternatives_korean:
  - 그에게 우리에 대하여 명령하실 것입니다
  - 우리에 관하여 그에게 명령하실 것입니다
  lexicon: BDAG
  rationale: ἐντελῇ는 권위를 가진 ‘명령하다’이고, περὶ ἡμῶν은 ‘우리에게 관하여/대하여’의 관계를 보이므로 한국어에서는 자연스럽게 ‘우리에게 명령하실 것입니다’로 풀었습니다.
- source_word: οὐκ ὀργισθήσῃ τοῦ συντελέσαι ἡμᾶς
  english_pob_choice: you will not be angry so as to bring us to an end
  chosen_korean: 우리를 끝장내시도록 진노하시지 않기 때문입니다
  alternatives_korean:
  - 우리를 끝내시도록 진노하시지 않기 때문입니다
  - 우리를 완전히 멸하시도록 분노하시지 않기 때문입니다
  lexicon: BDAG
  rationale: τοῦ συντελέσαι ἡμᾶς는 결과를 나타내는 구조이므로 ‘~하시도록’으로 옮겨 원인의 종속관계를 보존했고, συντελέσαι의 완결성을 ‘끝장내시다’로 압축해 표현했습니다.
- source_word: ἐλεήμων
  english_pob_choice: merciful
  chosen_korean: 자비로우시고
  alternatives_korean:
  - 긍휼이 많으시고
  - 은혜로우시고
  lexicon: BDAG
  rationale: ἐλεήμων은 하나님께 대한 전형적 속성인 ‘자비로우시다’가 가장 직접적이며, 문맥상 뒤의 진노와 대비를 이룹니다.
theological_decisions:
- issue: 문장 첫머리의 ἐὰν γὰρ 처리
  chosen_reading: ‘그러므로 만일’로 시작해 앞선 호소와의 논리적 연결을 드러냈습니다.
  alternative_readings:
  - ‘이는 만일’
  - ‘왜냐하면 만일’
  rationale: γάρ은 앞 절의 근거 제시이므로 한국어에서는 자연스러운 담화 연결어를 택해 문맥 흐름을 살렸습니다.
  doctrine_reference: 문맥 연결과 담화 기능
- issue: ‘진노하시지 않기 때문입니다’의 종속구문
  chosen_reading: 진노와 멸망의 관계를 분리하지 않고, 진노가 우리를 끝장내는 결과로 나아가지 않는다는 뜻을 유지했습니다.
  alternative_readings:
  - ‘진노하지 않으시기 때문입니다’
  - ‘우리를 멸하려 하시지 않기 때문입니다’
  rationale: 원문은 단순한 무진노가 아니라 ‘우리의 완전한 종결에 이르도록’이라는 결과 제한을 포함하므로 이를 합쇼체로 분명히 드러냈습니다.
  doctrine_reference: 하나님의 자비와 절제된 진노
