  - 우리 중심에
  - 우리 한복판에
  lexicon: BDAG
  rationale: 공동체 한가운데 계신다는 뉘앙스를 자연스러운 현대 한국어로 살렸습니다.
- source_word: ἐλεηθησόμεθα
  english_pob_choice: we will be shown mercy
  chosen_korean: 긍휼을 입을 것입니다
  alternatives_korean:
  - 긍휼을 받을 것입니다
