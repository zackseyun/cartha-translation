  - 당신의 이름
  - 주님의 이름
  - 그 이름
  lexicon: BDAG
  rationale: ‘이름’을 그대로 유지하여 하나님의 현존과 명성을 함께 시사하는 성경적 표현을 보존했습니다.
- source_word: ἐν μέσῳ ἡμῶν
  english_pob_choice: in our midst
  chosen_korean: 우리 한가운데
  alternatives_korean:
