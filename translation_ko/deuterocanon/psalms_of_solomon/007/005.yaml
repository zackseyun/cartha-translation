  - 우리 가운데 거주하실 때
  lexicon: BDAG
  rationale: 부정사구를 시간 의미로 읽어 '...할 때'로 옮기되, κατασκηνόω의 거함/장막침 이미지는 '거하실'로 간결하게 살렸습니다.
- source_word: τὸ ὄνομά σου
