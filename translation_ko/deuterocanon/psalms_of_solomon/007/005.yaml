  - 긍휼을 얻을 것입니다
  lexicon: BDAG
  rationale: 수동 미래를 한국어 관용 표현인 '긍휼을 입다'로 옮겨, 수동성과 은혜의 주도권을 함께 드러냈습니다.
theological_decisions:
- issue: 하나님의 임재를 가리키는 '이름' 표현
  chosen_reading: '''주의 이름''을 문자 그대로 유지해, 이름이 곧 임재와 현존을 나타내는 성경적 함의를 열어 둡니다.'
  alternative_readings:
  - '''주의 임재''로 풀어 쓰기'
  - '''주님''으로 의역하기'
  rationale: 원문과 영어 POB가 모두 'name'을 유지하므로, 해석을 과도하게 닫지 않고 상징적 표현을 보존하는 것이 적절합니다.
  doctrine_reference: 하나님의 이름과 임재에 대한 성경적 표상
