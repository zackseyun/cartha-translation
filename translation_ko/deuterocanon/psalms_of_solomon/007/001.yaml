base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/007/001.yaml
  text: Do not depart from us[a], O God[c][b], lest those who hate us without cause attack us.
  footnotes:
  - marker: a
    text: Or “lest those who hate us attack us for nothing”; the adverb “without cause” could be heard with the attack rather than with the hatred.
    reason: lexical_alternative
  - marker: b
    text: The Greek verb rendered “depart” is more literally related to moving one’s tent or encampment away, a vivid image of withdrawn presence.
    reason: cultural_note
  - marker: c
    text: Or 'Do not depart from us'.
    reason: previous_rendering
translation:
  language: ko
  text: 하나님, 우리에게서 떠나지 마소서. 까닭 없이 우리를 미워하는 자들이 우리에게 달려들지 못하게 하소서.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리를 까닭 없이 공격하는 자들이 우리를 미워하지 못하게 하소서”로 들릴 수 있습니다. 여기서 ‘까닭 없이’는 ‘미워하다’보다 ‘달려들다’에 걸릴 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 동사는 문자적으로는 장막을 옮기거나 철수하는 이미지를 지니며, 떠난 임재를 생생하게 보여 줍니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποσκηνώσῃς ἀφʼ ἡμῶν
  english_pob_choice: depart from us
  chosen_korean: 우리에게서 떠나지 마소서
  alternatives_korean:
  - 우리에게서 장막을 거두지 마소서
  - 우리에게서 떠나 주지 마소서
  lexicon: LSJ
  rationale: ἀποσκηνόω는 문자적으로 ‘장막을 옮기다/철수하다’의 이미지가 있으나, 한국어 본문에서는 관계적·기도문적 의미를 살려 ‘떠나지 마소서’로 자연스럽게 옮겼습니다.
- source_word: οἱ μισοῦντα ἡμᾶς
  english_pob_choice: those who hate us
  chosen_korean: 우리를 미워하는 자들
  alternatives_korean:
  - 우리의 미움받는 자들
  - 우리를 미워하는 이들
  lexicon: BDAG
  rationale: 분사구를 한국어에서는 수식절로 풀어 ‘우리를 미워하는 자들’로 옮겨 의미를 분명히 했습니다.
- source_word: ἐπιθῶνται ἡμῖν
  english_pob_choice: attack us
  chosen_korean: 우리에게 달려들지 못하게 하소서
  alternatives_korean:
  - 우리를 공격하지 못하게 하소서
  - 우리를 덮치지 못하게 하소서
  lexicon: LSJ
  rationale: ἐπιτίθημι 계열의 공격적 뉘앙스를 살리되, 기도문 맥락에서 ‘달려들다’가 더 생생하고 한국어로도 자연스럽습니다.
- source_word: δωρεάν
  english_pob_choice: without cause
  chosen_korean: 까닭 없이
  alternatives_korean:
  - 아무 이유 없이
  - 헛되이
  lexicon: BDAG
  rationale: δωρεάν은 근거 없는 적대라는 뜻이므로, ‘까닭 없이’가 문맥상 가장 간결하고 정확합니다.
theological_decisions:
- issue: 하나님의 임재를 ‘떠남’으로 표현하는 방식
  chosen_reading: ‘우리에게서 떠나지 마소서’로 옮겨, 단순한 이동이 아니라 백성 가운데서의 임재 철수를 기도하는 뜻을 살렸습니다.
  alternative_readings:
  - ‘우리에게서 장막을 옮기지 마소서’
  - ‘우리에게서 거두어지지 마소서’
  rationale: 본문의 동사는 장막을 걷고 떠나는 이미지를 지니지만, 이 시편의 간구는 하나님 임재의 상실을 두려워하는 기도이므로 한국어에서는 그 신학적 의미를 분명히 드러냈습니다.
  doctrine_reference: 하나님의 임재와 언약적 보호
- issue: ‘미워하는 자들이’의 행위와 ‘까닭 없이’의 수식 범위
  chosen_reading: ‘까닭 없이’는 ‘미워하는’보다 ‘달려들다’에 더 직접 연결되도록 배치했습니다.
  alternative_readings:
  - ‘까닭 없이 우리를 미워하는 자들’
  - ‘우리에게 까닭 없이 달려드는 자들’
  rationale: 영어 POB의 각주가 지적하듯 부사의 연결이 다소 열려 있으므로, 한국어도 공격 행위에 붙여 독자가 문맥상 가장 자연스럽게 읽도록 했습니다.
  doctrine_reference: 무고한 박해와 부당한 적대에 대한 탄원
