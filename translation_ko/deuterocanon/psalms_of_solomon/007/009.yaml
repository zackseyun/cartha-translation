theological_decisions:
- issue: ‘house of Jacob’의 범위를 한국어에서 어떻게 보존할지
  chosen_reading: ‘야곱의 집’으로 유지했습니다.
  alternative_readings:
  - 이스라엘
  - 이스라엘 백성
  rationale: 본문이 구체적으로 ‘야곱의 집’을 말하므로, 문학적·언약적 결을 유지하기 위해 보다 해석적인 ‘이스라엘’로 바꾸지 않았습니다.
  doctrine_reference: 원문 우선 원칙; 핵심 용어의 일관성 유지
- issue: ἐπηγγείλω αὐτοῖς의 인칭 불일치가 드러내는 본문 난점을 어떻게 처리할지
  chosen_reading: ‘그들에게 약속하신’으로 처리했습니다.
  alternative_readings:
  - 내가 그들에게 약속한
  - 그들에게 약속했던
  rationale: 영어 POB의 판단처럼 문맥상 하나님께 드리는 직접 호칭이므로 2인칭으로 이해하는 것이 자연스럽습니다. 한국어 본문에서는 난점을 과도하게 부각하지 않되, 약속의 주체를 하나님으로 분명히 했습니다.
  doctrine_reference: 본문비평적 난점의 문맥 해결; 기도문의 직접 호칭 일관성
