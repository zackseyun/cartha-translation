  - 원조
  - 구원
  lexicon: BDAG
  rationale: 문맥상 하나님의 도움/붙드심을 뜻하므로, 신학적으로 과도하게 특정하지 않는 ‘도움’이 가장 직접적입니다.
- source_word: τὸν οἶκον Ἰακώβ
  english_pob_choice: the house of Jacob
  chosen_korean: 야곱의 집
  alternatives_korean:
  - 야곱의 가문
  - 야곱의 집안
  - 이스라엘
  lexicon: BDAG
  rationale: 그리스어의 언약적 집합 표현을 보존하기 위해 ‘이스라엘’로 풀지 않고 직역에 가깝게 옮겼습니다.
- source_word: ἐλεῆσαι
  english_pob_choice: to show mercy
  chosen_korean: 자비를 베푸시기 위함이며
  alternatives_korean:
  - 긍휼을 베푸시기 위함이며
  - 불쌍히 여기시기 위함이며
  - 자비하시기 위함이며
  lexicon: BDAG
  rationale: 목적 부정사를 한국어 목적 표현으로 옮기고, 전통적 ‘긍휼’보다 현대 한국어에서 더 투명한 ‘자비’를 선택했습니다.
- source_word: εἰς ἡμέραν ἐν ᾗ
  english_pob_choice: for the day that
  chosen_korean: 그들에게 약속하신 날을 위함입니다
  alternatives_korean:
  - 그들에게 약속하신 그 날을 위함입니다
  - 그들에게 약속하신 날에
  - 그날을 향하여
  lexicon: BDAG
  rationale: 전치사구의 종착/지향성을 한국어 목적 구조로 풀어, ‘for the day’의 기대하는 종말론적 방향성을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: ‘house of Jacob’의 범위를 한국어에서 어떻게 보존할지
  chosen_reading: ‘야곱의 집’으로 유지했습니다.
  alternative_readings:
  - 이스라엘
  - 이스라엘 백성
  rationale: 본문이 구체적으로 ‘야곱의 집’을 말하므로, 문학적·언약적 결을 유지하기 위해 보다 해석적인 ‘이스라엘’로 바꾸지 않았습니다.
  doctrine_reference: 원문 우선 원칙; 핵심 용어의 일관성 유지
- issue: ἐπηγγείλω αὐτοῖς의 인칭 불일치가 드러내는 본문 난점을 어떻게 처리할지
  chosen_reading: ‘그들에게 약속하신’으로 처리했습니다.
  alternative_readings:
  - 내가 그들에게 약속한
  - 그들에게 약속했던
  rationale: 영어 POB의 판단처럼 문맥상 하나님께 드리는 직접 호칭이므로 2인칭으로 이해하는 것이 자연스럽습니다. 한국어 본문에서는 난점을 과도하게 부각하지 않되, 약속의 주체를 하나님으로 분명히 했습니다.
  doctrine_reference: 본문비평적 난점의 문맥 해결; 기도문의 직접 호칭 일관성
