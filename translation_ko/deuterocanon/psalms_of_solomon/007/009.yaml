base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/007/009.yaml
  text: You will guide us at the time of your help[b][a], to show mercy to the house of Jacob for the day that you promised them.
  footnotes:
  - marker: a
    text: Or 'You will direct us.' The Greek verb can carry the sense of making one's path straight or directing one's course.
    reason: lexical_alternative
  - marker: b
    text: The final verb form is textually difficult; it is understood here in context as 'you promised them.' A more literal but less fitting possibility would be 'I promised them.'
    reason: textual_variant
translation:
  language: ko
  text: 당신께서는 당신의 도움의 때에 우리를 인도하실 것이니, 야곱의 집에 자비를 베푸시기 위함이며, 그들에게 약속하신 날을 위함입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘당신께서는 우리를 당신의 도움의 때에 바로잡으실 것입니다’ 또는 ‘이끄실 것입니다’라는 뜻도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 동사형은 본문상 난점이 있어, 문맥에 따라 ‘그들에게 약속하신’으로 이해했습니다. 더 문자적으로는 ‘내가 그들에게 약속한’으로도 읽힐 수 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: κατευθυνεῖς
  english_pob_choice: you will guide
  chosen_korean: 인도하실 것이니
  alternatives_korean:
  - 이끄실 것이니
  - 바로잡으실 것이니
  - 지도하실 것이니
  lexicon: BDAG
  rationale: 미래형의 신적 인도를 자연스러운 합쇼체로 살리면서, ‘guide’의 관계적 이끎을 과도하게 행정적이지 않게 옮겼습니다.
- source_word: ἐν καιρῷ
  english_pob_choice: at the time of
  chosen_korean: '...의 때에'
  alternatives_korean:
  - '...의 시간에'
  - '...의 시기에'
  lexicon: BDAG
  rationale: καιρός의 정해진 때라는 뉘앙스를 한국어의 ‘때’로 간결하게 살렸습니다.
- source_word: ἀντιλήψεως
  english_pob_choice: help
  chosen_korean: 도움
  alternatives_korean:
