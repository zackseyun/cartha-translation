    rationale: κατευθύνω의 ‘곧게 하다’라는 어휘 가능성을 설명할 수 있으나, 사람을 목적어로 삼는 본문에서는 ‘길을 곧게 하시다’라고 보충해야 한국어 의미가 자연스럽습니다.
  revised_text: 당신께서는 당신께서 도우시는 때에 우리를 인도하시어, 야곱의 집에 자비를 베푸시도록 그들에게 약속하신 날을 향하게 하실 것입니다.[a][b]
  revised_footnotes:
