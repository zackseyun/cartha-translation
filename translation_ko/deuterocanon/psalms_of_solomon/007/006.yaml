  text: and no nation will prevail against us, because you are our defender.
translation:
  language: ko
  text: 어느 나라라도 우리를 이기지 못할 것입니다. 주께서 우리의 수호자이시기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἰσχύσει
  english_pob_choice: will prevail
  chosen_korean: 이기지 못할 것입니다
  alternatives_korean:
  - 우세하지 못할 것입니다
  - 힘을 발휘하지 못할 것입니다
  - 승리하지 못할 것입니다
  lexicon: LSJ
  rationale: ἰσχύω는 여기서 단순한 ‘강하다’보다 대적하여 우세를 점하지 못한다는 뜻이므로, 한국어에서는 자연스럽게 ‘이기다/이기지 못하다’로 옮겼습니다.
- source_word: ἔθνος
  english_pob_choice: nation
  chosen_korean: 어느 나라
  alternatives_korean:
  - 민족
  - 나라
  - 이방 민족
  lexicon: LSJ
  rationale: 단수형 ἔθνος를 집합적으로 받아 ‘어느 나라’로 옮기면 직역의 딱딱함을 줄이면서도 특정 대상을 한정하지 않는 원문의 범위를 유지할 수 있습니다.
- source_word: ὑπερασπιστής
  english_pob_choice: defender
  chosen_korean: 수호자
  alternatives_korean:
  - 보호자
  - 방패
  - 지키시는 이
  lexicon: LSJ
  rationale: 명사적 칭호로서 하나님의 방어적 역할을 압축해 말하므로, 한국어에서는 ‘우리의 수호자’가 가장 간결하게 대응합니다.
theological_decisions:
- issue: 하나님을 지칭하는 ὑπερασπιστής의 칭호성
  chosen_reading: 주께서 우리의 수호자이시기 때문입니다
  alternative_readings:
  - 주께서 우리를 지키시는 분이기 때문입니다
  - 주께서 우리의 보호자이시기 때문입니다
  rationale: 헬라어는 서술적 동사구보다 칭호처럼 하나님을 규정하므로, ‘수호자’로 명사화해 고백적 뉘앙스를 살렸습니다.
  doctrine_reference: Divine protection / covenant confidence
