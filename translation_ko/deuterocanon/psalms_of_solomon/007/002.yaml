base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/007/002.yaml
  text: For you have rejected them[a], O God[c][b]; let not their foot trample the inheritance of your sanctuary.
  footnotes:
  - marker: a
    text: The Greek verb form here is unusual in Swete and could be taken as 'for you will drive them back, O God'; the prayer context favors the imperative-like sense in the main text.
    reason: alternative_reading
  - marker: b
    text: Or possibly, 'your holy inheritance,' if the final phrase is taken more attributively than as 'the inheritance of your sanctuary.'
    reason: lexical_alternative
  - marker: c
    text: Or 'For drive them back, O God, lest their feet trample'.
    reason: previous_rendering
translation:
  language: ko
  text: 하나님, 주님께서 그들을 내치셨으니, 그들의 발이 주님의 성소의 기업을 짓밟지 못하게 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ἀπώσω는 ‘내치셨다’ 외에 ‘거절하셨다’ 또는 ‘물리치셨다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘주님의 성소의 기업’은 문법적으로 ‘주님의 거룩한 기업’으로 이해할 가능성도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώσω
  english_pob_choice: you have rejected
  chosen_korean: 주님께서 그들을 물리치셨으니
  alternatives_korean:
  - 주님께서 그들을 거절하셨으니
  - 주님께서 그들을 내치셨으니
  - 주님께서 그들을 밀쳐내셨으니
  lexicon: BDAG / LSJ
  rationale: 문맥상 단순한 관계적 ‘거절’보다 공격자를 밖으로 밀어내는 적극적 배제를 나타내므로, 한국어에서는 ‘물리치셨으니’가 가장 자연스럽고 힘이 있습니다.
- source_word: πατήσαι
  english_pob_choice: trample
  chosen_korean: 짓밟지 못하게 하십시오
  alternatives_korean:
  - 밟지 못하게 하십시오
  - 밟아 해치지 못하게 하십시오
  - 짓밟아서는 안 됩니다
  lexicon: BDAG / LSJ
  rationale: 해당 동사는 단순 접촉이 아니라 모독적 훼손을 뜻하므로 ‘짓밟다’가 그 강도를 잘 살립니다.
- source_word: ὁ ποὺς αὐτῶν
  english_pob_choice: their foot
  chosen_korean: 그들의 발
  alternatives_korean:
  - 그들의 한 발
  - 그들의 발걸음
  - 그 발
  lexicon: BDAG / LSJ
  rationale: 그리스어는 단수지만 집합적으로 쓰였으므로, 한국어에서는 자연스러운 복수 표현 ‘그들의 발’로 옮기되 의미를 유지했습니다.
- source_word: ἁγιάσματός σου
  english_pob_choice: the inheritance of your sanctuary
  chosen_korean: 주님의 성소의 기업
  alternatives_korean:
  - 주님의 거룩한 기업
  - 주님의 성스러운 유산
  - 주님의 성소에 속한 기업
  lexicon: BDAG / LSJ
  rationale: ἁγίασμα은 이 문맥에서 거룩한 대상 일반보다 예배 공간을 가리키는 말로 보이므로 ‘성소’가 더 직접적입니다. κληρονομίαν은 ‘기업’이 언약적 소유를 잘 드러냅니다.
theological_decisions:
- issue: μὴ πατήσαι의 문법과 기도문 분위기
  chosen_reading: 소망/금지의 청원으로 읽어 ‘짓밟지 못하게 하십시오’로 옮겼습니다.
  alternative_readings:
  - ‘그래서 그들의 발이 짓밟지 않도록’이라는 목적절식 해석
  - ‘그들의 발이 짓밟을까 봐’라는 경계적 해석
  rationale: 그리스어는 종속적인 ‘lest’가 아니라 독립적인 금지/청원의 뉘앙스를 띠므로, 기도문의 형태를 살려 한국어 명령형 청원으로 표현했습니다.
  doctrine_reference: 히브리 시편적 탄원 기도의 형식
- issue: ‘주님의 백성’을 본문에 분명히 드러낼지 여부
  chosen_reading: 직접적인 소유격 대신 문맥상 대상이 되는 하나님의 백성을 앞에 제시했습니다.
  alternative_readings:
  - ‘그들의 발이 주님의 성소의 기업을 짓밟지 못하게 하십시오’만 둘
  - ‘주님의 거룩한 기업’을 본문에 넣기
  rationale: 본문의 첫 절반은 앞선 ‘그들을’이 무엇을 향하는지 암시하므로, 한국어에서 오해를 줄이기 위해 대상이 되는 공동체를 앞쪽에 보강해도 원의미를 훼손하지 않습니다.
  doctrine_reference: 시편적 공동체 탄원
