  chosen_reading: '''do not give us over to the nations''에 맞추어 한국어 본문에 ''우리''를 분명히 넣었습니다.'
  alternative_readings:
  - 우리 없이 '민족들에게 넘기지 마소서'처럼 목적어를 생략하는 방식
