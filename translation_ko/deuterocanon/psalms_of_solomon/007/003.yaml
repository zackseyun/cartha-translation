  text: 주님, 주님의 뜻에 따라 우리를 징계하셔서, 우리를 민족들에게 넘기지 마소서.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 동사 παιδεύω는 교정, 징계, 훈련의 뜻을 함께 가질 수 있습니다.
