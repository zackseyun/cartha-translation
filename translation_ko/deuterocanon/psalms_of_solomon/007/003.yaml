  rationale: 그리스어는 동사 뒤 목적어가 생략되어 있으나 문맥상 '우리'가 요구되므로, 의미를 명확히 하되 과도한 확대 없이 복원했습니다.
  doctrine_reference: 문맥 보충에 의한 생략 목적어 복원
