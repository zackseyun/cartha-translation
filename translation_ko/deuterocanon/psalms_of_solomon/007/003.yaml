  text: 주님, 주님의 뜻에 따라 우리를 징계하소서[a][c], 우리를 민족들에게 넘기지 마소서.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 동사 παιδεύω는 교정, 징계, 훈련의 뜻을 함께 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 문자적으로 '민족들에게 주지 마소서'이며, '우리'는 문맥상 보충된 것입니다.
