  - marker: b
    text: 그리스어는 문자적으로 '민족들에게 주지 마소서'이며, '우리'는 문맥상 보충된 것입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '주님의 뜻에 따라 우리를 징계하소서'.
    reason: previous_rendering
lexical_decisions:
- source_word: σὺ
  english_pob_choice: you
  chosen_korean: 주님
  alternatives_korean:
  - 주님 자신이
  - 주님께서
  lexicon: SBLGNT / 문맥
  rationale: 주어를 강조하는 σὺ는 한국어에서 직접적 호격인 '주님'으로 자연스럽게 살리되, 본절의 기도체 문맥에 맞게 주님께 드리는 간구로 표현했습니다.
- source_word: ἐν θελήματί σου
  english_pob_choice: according to your will
  chosen_korean: 주님의 뜻에 따라
  alternatives_korean:
  - 주님의 뜻 안에서
  - 주님의 뜻대로
  lexicon: BDAG
  rationale: 전치사구는 단순한 장소적 '안에'보다 일치·부합의 의미가 핵심이므로, 현대 한국어에서 가장 자연스럽고 source-grounded한 '뜻에 따라'로 옮겼습니다.
- source_word: παιδεύσον
  english_pob_choice: discipline
  chosen_korean: 징계하셔서
  alternatives_korean:
  - 훈련하셔서
  - 교훈하셔서
  - 가르치셔서
  lexicon: BDAG
  rationale: παιδεύω는 교정과 형성의 의미를 함께 가지므로, 징계의 교정적 의미를 살리면서도 기도문 흐름에 맞게 동사 연결형으로 처리했습니다.
- source_word: ἔθνεσιν
  english_pob_choice: the nations
  chosen_korean: 민족들에게
  alternatives_korean:
  - 나라들에게
  - 이방 민족들에게
  lexicon: BDAG
  rationale: 유대인의 기도라는 문맥에서 ἔθνη는 이방 '민족들'을 가리키므로, 교회적 관용어인 '이방인'보다 대상 집단을 직접 드러내는 '민족들'이 더 투명합니다.
theological_decisions:
- issue: 문맥상 생략된 목적어 처리
  chosen_reading: '''do not give us over to the nations''에 맞추어 한국어 본문에 ''우리''를 분명히 넣었습니다.'
  alternative_readings:
  - 우리 없이 '민족들에게 넘기지 마소서'처럼 목적어를 생략하는 방식
  - '''우리를 민족들 손에 넘기지 마소서''처럼 보강하는 방식'
  rationale: 그리스어는 동사 뒤 목적어가 생략되어 있으나 문맥상 '우리'가 요구되므로, 의미를 명확히 하되 과도한 확대 없이 복원했습니다.
  doctrine_reference: 문맥 보충에 의한 생략 목적어 복원
