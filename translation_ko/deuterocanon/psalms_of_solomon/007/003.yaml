  rationale: 전치사구는 단순한 장소적 '안에'보다 일치·부합의 의미가 핵심이므로, 현대 한국어에서 가장 자연스럽고 source-grounded한 '뜻에 따라'로 옮겼습니다.
- source_word: παιδεύσον
  english_pob_choice: discipline
  chosen_korean: 징계하셔서
  alternatives_korean:
  - 훈련하셔서
  - 교훈하셔서
  - 가르치셔서
  lexicon: BDAG
  rationale: παιδεύω는 교정과 형성의 의미를 함께 가지므로, 징계의 교정적 의미를 살리면서도 기도문 흐름에 맞게 동사 연결형으로 처리했습니다.
- source_word: ἔθνεσιν
  english_pob_choice: the nations
  chosen_korean: 민족들에게
  alternatives_korean:
  - 나라들에게
  - 이방 민족들에게
  lexicon: BDAG
  rationale: 유대인의 기도라는 문맥에서 ἔθνη는 이방 '민족들'을 가리키므로, 교회적 관용어인 '이방인'보다 대상 집단을 직접 드러내는 '민족들'이 더 투명합니다.
