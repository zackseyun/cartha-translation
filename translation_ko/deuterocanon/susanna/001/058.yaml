translation:
  language: ko
  text: “이제 말해 보아라. 어느 나무 아래에서 그들이 서로 이야기하는 것을 붙잡았느냐?” 그가 말했습니다. “홀름참나무 아래입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 πρῖνος는 특정한 참나무 종류를 가리키므로, 더 넓게는 “참나무”로도 옮길 수 있습니다.
