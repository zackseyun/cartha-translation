  text: 'Now then[a], tell me: under what tree did you catch them talking with one another? And he said, “Under a holm oak.”'
  footnotes:
  - marker: a
    text: Or simply, “oak.” The Greek names a specific kind of oak (πρῖνος), and the more precise rendering is kept in the main text because the exact tree matters in Daniel’s interrogation.
