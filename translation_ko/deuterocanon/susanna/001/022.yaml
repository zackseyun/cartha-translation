base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/022.yaml
  text: And they said[a], “Look, the doors of the garden are shut, and no one sees us, and we are filled with desire for you. Therefore consent to us, and be with us.”
  footnotes:
  - marker: a
    text: Greek παράδεισος, here meaning an enclosed garden or park, not 'Paradise' in the later theological sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 말했습니다. 「보십시오, 동산의 문들은 닫혀 있고 아무도 우리를 보지 못하며, 우리는 당신을 향한 욕망으로 가득합니다. 그러므로 우리에게 동의하시고 우리와 함께 있으십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 παράδεισος는 후대의 신학적 의미인 ‘낙원’이 아니라 울타리 친 동산/정원을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: BDAG
  rationale: 주의를 끌어 상황을 지시하는 감탄사로, 현대 한국어에서는 「보십시오」가 가장 자연스럽고 문맥의 직접성을 살립니다.
- source_word: αἱ θύραι τοῦ παραδείσου
  english_pob_choice: the doors of the garden
  chosen_korean: 동산의 문들은
  alternatives_korean:
  - 낙원의 문들은
  - 정원의 문들은
  - 동산의 문들은 닫혀 있습니다
  lexicon: LSJ
  rationale: παράδεισος는 여기서 종말론적 ‘낙원’이 아니라 봉쇄된 정원/동산을 가리키므로, 문맥에 맞는 「동산」으로 옮겼습니다.
- source_word: ἐν ἐπιθυμίᾳ σού ἐσμεν
  english_pob_choice: we are filled with desire for you
  chosen_korean: 우리는 당신을 향한 욕망으로 가득합니다
  alternatives_korean:
  - 우리는 당신을 매우 원합니다
  - 우리는 당신을 향한 갈망으로 가득합니다
  - 우리는 당신을 향한 정욕으로 가득합니다
  lexicon: BDAG
  rationale: ἐπιθυμία는 여기서 성적 욕망의 강한 뉘앙스를 가지므로, 완곡화하지 않되 현대 한국어에서 의미가 분명한 「욕망으로 가득합니다」를 택했습니다.
- source_word: συγκατάθου ἡμῖν
  english_pob_choice: consent to us
  chosen_korean: 우리에게 동의하시고
  alternatives_korean:
  - 우리에게 응해 주시고
  - 우리에게 승낙하시고
  - 우리 뜻에 따르시고
  lexicon: LSJ
  rationale: 명령형 중간태의 강한 요구를 반영하면서도, 상대에게 강압적으로 수용을 요구하는 의미를 가장 직접적으로 드러내는 표현으로 보았습니다.
- source_word: γενοῦ μεθ᾿ ἡμῶν
  english_pob_choice: be with us
  chosen_korean: 우리와 함께 있으십시오
  alternatives_korean:
  - 우리와 함께 되십시오
  - 우리와 함께 오십시오
  - 우리와 함께 있으시기 바랍니다
  lexicon: BDAG
  rationale: 직역하면 ‘우리와 함께 되라’이지만 한국어에서는 부자연스러우므로, 관계적·성적 제안을 드러내는 범위 안에서 「우리와 함께 있으십시오」로 옮겼습니다.
theological_decisions:
- issue: παράδεισος의 번역을 ‘낙원’으로 둘지 ‘동산’으로 둘지
  chosen_reading: ‘동산’은 서사적 공간을 가리키는 번역이고, 종말론적·신학적 ‘낙원’은 의도하지 않았습니다.
  alternative_readings:
  - 낙원
  - 정원
  rationale: 문맥상 수산나 이야기의 폐쇄된 정원 공간을 말하므로, 후대 신학적 연상을 불러오는 ‘낙원’을 피했습니다.
  doctrine_reference: original-language primacy over translation tradition
