review_pass:
  verdict: revise
  source_fidelity: ‘하인들이’ is gender-neutral, but τὰ κοράσια denotes girls/young females and, in this household setting, most plausibly female attendants. The draft should retain that feminine reference. Its rendering of ἐπέδραμον as ‘달려들었습니다’ appropriately conveys a sudden, aggressive movement without specifying an action not yet stated.
  naturalness: The sentence is natural in modern formal-polite Korean. ‘여종들이 나가자’ is concise and idiomatic; preserving the narrative-transition formula with ‘그런데’ is natural without an overly literal rendering of καὶ ἐγένετο.
  terminology: ‘두 장로’ suitably reflects πρεσβῦται as a recognized social/judicial role rather than merely old men. ‘여종들’ is preferable to the gender-neutral ‘하인들’; a footnote preserves the lexical range of κοράσια.
  issues:
  - severity: medium
    issue: ‘하인들이’ obscures the feminine reference of τὰ κοράσια.
    rationale: The Greek neuter plural noun refers to young females. Although the context supports female household attendants, the translation should not use a term that could equally refer to male servants.
  - severity: low
    issue: The lexical ambiguity of τὰ κοράσια is not documented.
    rationale: A note allows ‘girls’ or ‘young women’ as alternatives while explaining why ‘여종들’ fits the immediate household context.
  revised_text: 그런데 여종들이 나가자, 두 장로가 일어나 그녀에게 달려들었습니다.
  revised_footnotes:
  - marker: a
    text: ‘여종들’은 ‘소녀들’, ‘젊은 여성들’로도 옮길 수 있습니다. 그리스어 τὰ κοράσια는 일반적으로 젊은 여성을 가리킬 수 있으나, 여기서는 집안의 여성 시중드를 가리키는 것으로 보입니다.
    reason: τὰ κοράσια의 의미 범위와 문맥상 선택을 밝혀, 여성 지시를 보존하면서도 어휘적 불확실성을 드러냅니다.
  revision_rationale: 여성 지시를 잃게 하는 ‘하인들’을 ‘여종들’로 바로잡고, 해당 어휘의 범위를 각주로 제시했습니다. ‘그런데’는 καὶ ἐγένετο의 서사적 전환 기능을 자연스러운 한국어로 반영하며, ‘달려들었습니다’는 ἐπέδραμον의 공격적 돌진을 과장 없이 전달합니다.
