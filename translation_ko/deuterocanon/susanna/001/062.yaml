  - 모세의 율법대로 행하게
  - 모세의 율법에 따라 행하도록
  lexicon: LSJ
  rationale: ποιῆσαι의 일반적 ‘행하다/하다’ 의미와 법적 관용구를 살려, 명시적으로 법에 따른 실행이라는 점이 드러나게 했습니다.
- source_word: ἀπέκτειναν αὐτούς
  english_pob_choice: they put them to death
  chosen_korean: 그들을 죽였고
  alternatives_korean:
  - 그들을 사형에 처했고
  - 그들을 죽였습니다
