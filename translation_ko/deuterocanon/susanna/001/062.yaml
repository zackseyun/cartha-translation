review_pass:
  verdict: revise
  source_fidelity: 현 번역의 ‘그들의 이웃에게’는 원문의 정관사 단수 여격(τῷ πλησίον)에 없는 소유를 더하며, ‘그렇게 하게 하였으며’는 ποιῆσαι를 사역으로 바꾸어 의미를 흐립니다. 이 구절은 앞절의 ‘그 이웃에게 하려고 했던 대로’라는 내용을 이어 받으므로, 이를 한국어에서 보충하여 법에 따라 두 장로에게 그 행위를 되돌려 행했다는 뜻을 드러내야 합니다.
  naturalness: ‘무죄한 피’와 ‘보전되었습니다’는 이해 가능하지만 현대 표준 한국어 성서 문맥에서는 ‘무고한 피’와 ‘보존되었습니다’가 더 자연스럽습니다. 문장을 둘로 나누고 합쇼체 종결을 일관되게 적용했습니다.
  terminology: ‘모세의 율법’은 적절합니다. ἀπέκτειναν은 재판적 맥락을 가진 ‘죽였습니다’로 옮겨 원문보다 절차를 더 특정하는 ‘처형했습니다’를 피했습니다. αἷμα ἀναίτιον은 ‘무고한 피’로 옮겼습니다.
  issues:
  - severity: high
    issue: ‘그렇게 하게 하였으며’가 ποιῆσαι를 사역 표현으로 바꿈
    rationale: 원문은 앞절에 연결되어 그들이 이웃에게 하려고 했던 일을 피고들에게 행했다는 뜻이지, 피고들이 어떤 일을 하도록 시켰다는 뜻이 아닙니다.
  - severity: medium
    issue: ‘그들의 이웃’의 소유 표현 추가
    rationale: τῷ πλησίον은 ‘그 이웃에게/이웃에게’이며, 원문에는 ‘그들의’에 해당하는 소유 대명사가 없습니다.
  - severity: medium
    issue: 각주 표지가 설명 대상과 떨어져 있음
    rationale: 각주는 앞절에 의존하는 첫 구절의 통사 문제를 설명하므로 ‘그 이웃에게 하려고 했던 대로’에 붙어야 합니다.
