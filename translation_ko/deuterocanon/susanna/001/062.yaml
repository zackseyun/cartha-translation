  lexicon: LSJ
  rationale: 본문은 사법적 판결 맥락이지만, 한국어에서는 지나치게 기술적인 ‘처형’보다 직접적이면서도 충분히 법적 맥락을 유지하는 ‘죽였다’가 본문 강도를 잘 드러냅니다.
- source_word: ἐσώθη αἷμα ἀναίτιον
  english_pob_choice: innocent blood was spared
  chosen_korean: 무죄한 피가 보전되었습니다
  alternatives_korean:
  - 무죄한 피가 보존되었습니다
  - 무죄한 피가 구해졌습니다
  - 무죄한 피가 면하게 되었습니다
  lexicon: LSJ
  rationale: ‘피가 spared’는 한국어에서 ‘보전되다/보존되다’가 가장 자연스럽고, 불의한 유혈이 실제로 막혔다는 의미를 살립니다.
theological_decisions:
- issue: 무죄한 피의 idiom을 어떻게 한국어로 드러낼 것인가
  chosen_reading: 무죄한 피가 보전되었습니다
  alternative_readings:
  - 무죄한 피가 구해졌습니다
  - 무죄한 피가 보존되었습니다
  rationale: 본문의 핵심은 무고한 유혈이 발생하지 않았다는 점이므로, 단순한 ‘살리다’보다 성서적·법적 뉘앙스가 있는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §5, §6
- issue: 법적 판결의 강도를 얼마나 직접적으로 옮길 것인가
  chosen_reading: 그들을 죽였고
  alternative_readings:
  - 그들을 사형에 처했고
  - 그들을 처형했고
  rationale: 그리스어 ἀπέκτειναν은 단순 살해가 아니라 판결에 따른 사형 집행을 포함할 수 있으나, 본문 자체는 절차를 설명하지 않으므로 과도한 기술어를 피했습니다.
  doctrine_reference: Translation philosophy §1, §6
