translation:
  language: ko
  text: 그들의 이웃에게, 모세의 율법에 따라 그렇게 하게 하였으며, 그들을 죽였고, 그날에 무죄한 피가 보전되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 문장 흐름을 더 자연스럽게 옮기면 ‘그들의 이웃에게 모세의 율법에 따라 그렇게 하게 하였으며’입니다. 그리스어는 앞절과 통사적으로 이어집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ πλησίον
