  text: to the neighbor[a], to do according to the law of Moses; and they put them to death. And innocent blood was spared on that day.
  footnotes:
  - marker: a
    text: Or, more idiomatically from the sentence flow, 'to do to their neighbor according to the law of Moses.' The Greek wording here is syntactically tied to the previous verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 이웃에게 하려고 했던 대로[a] 모세의 율법에 따라 그들에게 행하였고, 그들을 죽였습니다. 그날 무고한 피가 보존되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 이웃에게, 모세의 율법에 따라 행하려고’입니다. 이 그리스어 구절은 앞절의 ‘그들이 하려고 했던 대로’라는 내용과 통사적으로 이어집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ πλησίον
  english_pob_choice: to the neighbor
  chosen_korean: 그들의 이웃에게
  alternatives_korean:
  - 이웃에게
  - 그 이웃에게
  - 이웃을 향해
  lexicon: LSJ
  rationale: 앞절과 문맥적으로 이어지는 여격을 한국어에서는 대상 표현으로 풀어, 다음 법적 행위를 이웃을 상대로 한 것으로 읽히게 했습니다.
- source_word: ποιῆσαι κατὰ τὸν νόμον Μωϋσῆ
  english_pob_choice: to do according to the law of Moses
  chosen_korean: 모세의 율법에 따라 그렇게 하게
  alternatives_korean:
