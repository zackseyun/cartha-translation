base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/043.yaml
  text: You know that they testified falsely against me; and behold[a], I am dying, having done none of the things that these men wickedly contrived against me.
  footnotes:
  - marker: a
    text: Or 'without having done anything of what these men plotted against me.' The Greek verb can emphasize wicked scheming or malicious action directed against Susanna.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 그들이 제게 거짓으로 증언한 것을 아십니다. 보십시오, 저는 죽어 가고 있습니다. 이 사람들이 저를 상대로 악하게 꾸민 일은 아무것도 하지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 사람들이 저를 상대로 꾸민 악한 일은 아무것도 하지 않은 채로.’ 그리스어 동사는 악한 꾀와 가해 의도를 함께 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίστασαι
  english_pob_choice: You know
  chosen_korean: 아십니다
  alternatives_korean:
  - 알고 계십니다
  - 아십니까
  lexicon: BDAG
  rationale: 직접 호칭의 상황에서 단순한 인지보다 분명한 인식·확인을 나타내므로, 격식 있는 합쇼체로 ‘아십니다’를 택했습니다.
- source_word: ψευδῆ μου κατεμαρτύρησαν
  english_pob_choice: they testified falsely against me
  chosen_korean: 제게 거짓으로 증언한 것을
  alternatives_korean:
  - 제게 거짓 증언한 것을
  - 제게 거짓으로 증언하였음을
  lexicon: BDAG
  rationale: 법정적 맥락을 살려 ‘증언하다’를 유지했고, ψευδῆ의 부사적 힘은 ‘거짓으로’로 옮겼습니다.
- source_word: ἰδοὺ
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보십시오,
  - 보라
  lexicon: BDAG
  rationale: 주의 환기 기능을 현대 한국어에서 자연스럽게 드러내기 위해 ‘보십시오’를 선택했습니다.
- source_word: μὴ ποιήσασα μηδὲν ὧν οὗτοι ἐπονηρεύσαντο κατ᾽ ἐμοῦ
  english_pob_choice: having done none of the things that these men wickedly contrived against me
  chosen_korean: 이 사람들이 저를 상대로 악하게 꾸민 일은 아무것도 하지 않았습니다
  alternatives_korean:
  - 이 사람들이 저에게 악하게 꾸민 일은 아무것도 하지 않았습니다
  - 이 사람들이 저를 향해 악하게 꾸민 것 가운데 아무것도 하지 않았습니다
  lexicon: BDAG/LSJ
  rationale: 동사 ἐπονηρεύσαντο의 ‘악하게 꾸미다/해치려 꾸미다’의 뉘앙스를 살려 ‘악하게 꾸민’으로 옮기고, κατά+속격의 대립 방향을 ‘저를 상대로’로 분명히 했습니다.
theological_decisions:
- issue: 무죄 주장과 억울한 죽음의 대비
  chosen_reading: ‘죽어 가고 있습니다’와 ‘아무것도 하지 않았습니다’의 병치를 유지했습니다.
  alternative_readings:
  - ‘죽습니다’로 단순 현재화
  - ‘곧 죽게 됩니다’로 완화
  rationale: 그리스어 현재형 ἀποθνῄσκω는 임박하고 진행 중인 죽음을 드러내므로, 수사적 긴박함과 무죄의 대비를 함께 살리기 위해 진행형으로 옮겼습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
