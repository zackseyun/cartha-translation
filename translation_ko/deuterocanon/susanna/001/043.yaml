- from: 당신은 그들이 제게 거짓으로 증언한 것을 아십니다. 보십시오, 저는 죽어 가고 있습니다. 이 사람들이 저를 상대로 악하게 꾸민 일은 아무것도 하지 않았습니다.[a]
  to: 당신은 그들이 저를 거슬러 거짓으로 증언한 것을 아십니다. 보십시오, 저는 이 사람들이 저를 해하려고 악하게 꾸며 낸 그 어떤 일도 하지 않은 채 죽어 가고 있습니다.[a]
  rationale: ‘저를 거슬러’로 거짓 증언의 법정적·적대적 방향을 드러냈습니다. 마지막 절은 원문의 분사 구조를 ‘하지 않은 채’로 보존하고, 고발자들이 악하게 꾸민 내용이 수산나에게 거짓으로 돌려진 행위임을 ‘꾸며 낸’으로 자연스럽게 밝혔습니다. 이는 원문의 무죄 주장과 고발자들의 악의적 모략의 대비를 유지하며 특정 교리적 해석을 더하지 않습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:28:07Z'
review_pass:
  verdict: revise
  source_fidelity: 그리스어의 법정적 표현 κατεμαρτύρησαν 및 현재형 ἀποθνῄσκω는 대체로 충실히 반영되었습니다. 그러나 ‘제게 거짓으로 증언한’은 ‘나를 거슬러 거짓 증언한’이라는 고발의 방향을 충분히 드러내지 못하며, 마지막 절은 ‘이 사람들이 저를 상대로 악하게 꾸민 일’을 수산나가 행했다는 어색한 의미 관계를 낳습니다.
  naturalness: 현 초안은 합쇼체를 일관되게 사용하지만, 마지막 문장이 한국어로 다소 부자연스럽고 의미상 혼동을 줍니다. ‘하지 않은 채 죽어 가고 있습니다’로 participial 관계를 자연스럽게 살릴 수 있습니다.
  terminology: ‘거짓으로 증언하다’, ‘죽어 가고 있습니다’는 적절합니다. κατά + 속격의 적대적 방향은 ‘저를 거슬러’로, ἐπονηρεύσαντο의 악의적 조작은 문맥상 ‘저를 해하려고 악하게 꾸며 낸’으로 명료하게 옮기는 것이 좋습니다.
