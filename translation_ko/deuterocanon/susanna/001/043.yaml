    rationale: μου 및 κατά의 문맥은 단순히 수산나에게 한 증언이 아니라 수산나를 거슬러 제기한 거짓 증언을 가리킵니다.
  - severity: high
    issue: ‘이 사람들이 저를 상대로 악하게 꾸민 일은 아무것도 하지 않았습니다’는 수산나가 타인들이 꾸민 일을 실행했다는 부자연스럽고 혼동되는 의미를 만듭니다.
    rationale: 원문의 부정 분사는 수산나의 무죄를, ἐπονηρεύσαντο는 고발자들의 악의적 행위·모략을 대조합니다. 한국어에서는 ‘꾸며 낸’ 내용을 수산나가 하지 않았다고 명시해야 이 관계가 전달됩니다.
