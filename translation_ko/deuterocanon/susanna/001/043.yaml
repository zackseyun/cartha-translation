  yaml_path: translation/deuterocanon/susanna/001/043.yaml
  text: You know that they testified falsely against me; and behold[a], I am dying, having done none of the things that these men wickedly contrived against me.
  footnotes:
  - marker: a
    text: Or 'without having done anything of what these men plotted against me.' The Greek verb can emphasize wicked scheming or malicious action directed against Susanna.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 그들이 저를 거슬러 거짓으로 증언한 것을 아십니다. 보십시오, 저는 이 사람들이 저를 해하려고 악하게 꾸며 낸 그 어떤 일도 하지 않은 채 죽어 가고 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 사람들이 저를 거슬러 악하게 꾸민 것 가운데 아무것도 하지 않은 채로.’ 그리스어 동사는 수산나를 향한 악의적인 모략 또는 해로운 행위를 가리킬 수 있습니다.
    reason: lexical_alternative
