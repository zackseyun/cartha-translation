translation:
  language: ko
  text: 이전에는, 불의한 판결을 내리고 무죄한 사람을 정죄하며, 유죄한 사람은 풀어 주면서, 주님께서 말씀하십니다. ‘무죄하고 의로운 사람을 죽여서는 안 된다.’[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘불의한 판결들을 판결하다’에 가까운 동족 목적격 표현을 써서, 반복을 통해 심판의 왜곡을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 이 인용은 그리스어 성경 전통의 출애굽기 23:7을 떠올리게 하는 법적 언어를 반영합니다.
    reason: cross_reference
lexical_decisions:
- source_word: πρότερον
  english_pob_choice: formerly
  chosen_korean: 이전에는
  alternatives_korean:
  - 전에
  - 먼저
  lexicon: LSJ
  rationale: 시간적으로 앞선 때를 가리키는 부사로, 한국어에서는 간결한 ‘이전에는’이 자연스럽고 회고적 뉘앙스를 잘 살립니다.
- source_word: κρίνων κρίσεις ἀδίκους
  english_pob_choice: while you were rendering unjust judgments
  chosen_korean: 불의한 판결을 내리고
  alternatives_korean:
