  text: formerly[a], while you were rendering unjust judgments and condemning the innocent, but releasing the guilty, though the Lord says[b], ‘You shall not put to death the innocent and righteous.’
  footnotes:
  - marker: a
    text: Or, more literally, “while judging unjust judgments.” The Greek uses a cognate expression for emphasis.
    reason: lexical_alternative
  - marker: b
    text: 'The closing quotation echoes the legal language of Exod 23:7 in the Greek tradition: do not put to death the innocent and righteous.'
