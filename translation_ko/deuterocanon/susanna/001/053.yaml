base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/053.yaml
  text: formerly[a], while you were rendering unjust judgments and condemning the innocent, but releasing the guilty, though the Lord says[b], ‘You shall not put to death the innocent and righteous.’
  footnotes:
  - marker: a
    text: Or, more literally, “while judging unjust judgments.” The Greek uses a cognate expression for emphasis.
    reason: lexical_alternative
  - marker: b
    text: 'The closing quotation echoes the legal language of Exod 23:7 in the Greek tradition: do not put to death the innocent and righteous.'
    reason: cross_reference
translation:
  language: ko
  text: 너는 이전에 불의한 판결을 내리고[a] 무죄한 사람들을 정죄하며 유죄한 사람들은 풀어 주면서도, 주님께서 ‘무죄하고 의로운 사람을 죽여서는 안 된다’라고 말씀하시는데도 그렇게 하였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘불의한 판결들을 판결하다’에 가까운 동족 목적격 표현을 써서, 반복을 통해 심판의 왜곡을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 이 인용은 그리스어 성경 전통의 출애굽기 23:7을 떠올리게 하는 법적 언어를 반영합니다.
    reason: cross_reference
lexical_decisions:
- source_word: πρότερον
  english_pob_choice: formerly
  chosen_korean: 이전에는
  alternatives_korean:
  - 전에
  - 먼저
  lexicon: LSJ
  rationale: 시간적으로 앞선 때를 가리키는 부사로, 한국어에서는 간결한 ‘이전에는’이 자연스럽고 회고적 뉘앙스를 잘 살립니다.
- source_word: κρίνων κρίσεις ἀδίκους
  english_pob_choice: while you were rendering unjust judgments
  chosen_korean: 불의한 판결을 내리고
  alternatives_korean:
  - 불의한 판결들을 내리며
  - 불의한 판단을 하며
  lexicon: LSJ
  rationale: 동족 목적격의 반복을 한국어에서 그대로 중첩하면 어색해질 수 있어, 법정 문맥을 살리면서도 의미를 보존하는 ‘불의한 판결을 내리고’로 옮겼습니다.
- source_word: τοὺς μὲν ἀθῴους κατακρί- νων, ἀπολύων δὲ τοὺς αἰτίους
  english_pob_choice: condemning the innocent, but releasing the guilty
  chosen_korean: 무죄한 사람을 정죄하며, 유죄한 사람은 풀어 주면서
  alternatives_korean:
  - 무죄한 사람을 유죄로 판결하며, 유죄한 사람은 석방하면서
  - 결백한 사람은 정죄하고, 책임 있는 사람은 풀어 주면서
  lexicon: LSJ
  rationale: ἀθῷος와 αἴτιος의 대조를 한국어 법정 용어로 분명히 하되, κατακρίνω/ἀπολύω의 법적 대비를 ‘정죄하다 / 풀어 주다’로 살렸습니다.
- source_word: Ἀθῷον καὶ δίκαιον
  english_pob_choice: the innocent and righteous
  chosen_korean: 무죄하고 의로운 사람
  alternatives_korean:
  - 무죄하고 의로운 자
  - 결백하고 의로운 사람
  lexicon: LSJ
  rationale: 인용구 안의 두 형용사를 하나의 대상에 결합된 표현으로 자연스럽게 옮겼고, δίκαιος는 여기서 윤리적·법적 의미를 모두 포괄하는 ‘의로운’이 적절합니다.
theological_decisions:
