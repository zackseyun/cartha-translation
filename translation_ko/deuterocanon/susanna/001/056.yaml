  source_fidelity: 그리스어의 절차적 흐름과 책망의 핵심 의미는 대체로 충실합니다. 다만 τὸν ἕτερον은 둘 중 ‘다른 한 사람’임을 드러내는 편이 정확하며, Σπέρμα Χανάαν καὶ οὐκ Ἰούδα의 생략된 혈통 대조는 한국어에서 ‘유다의 씨가 아닌’으로 보충해야 뜻이 분명하고 자연스럽습니다.
  naturalness: ‘다른 사람을 앞으로 나오게 하라고’도 이해되지만, 심문 장면에서 누군가에게 그를 데려오도록 명하는 προσαγαγεῖν에는 ‘다른 한 사람을 데려오라고’가 더 자연스럽습니다. ‘마음을 비틀었습니다’는 직역적 이미지는 있으나 다소 어색하므로 ‘마음을 뒤틀었습니다’가 현대 한국어에서 더 자연스럽습니다.
  terminology: ‘가나안의 씨’는 σπέρμα의 혈통 비난이라는 수사성을 보존합니다. ἐπιθυμία는 문맥상 성적 욕망을 가리키지만 원어의 폭을 유지하여 ‘욕망’으로 둡니다. διέστρεψεν의 왜곡·전도의 이미지는 ‘뒤틀었습니다’로 살렸습니다.
