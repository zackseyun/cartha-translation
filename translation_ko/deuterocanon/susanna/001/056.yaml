    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그를 물러나게 한 뒤, 다른 한 사람을 데려오라고 명령했습니다. 그리고 그에게 말했습니다. “가나안의 씨요 유다의 씨가 아닌 자여, 아름다움이 너를 속였고 욕망이 네 마음을 뒤틀었습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεταστήσας αὐτόν
  english_pob_choice: after removing him
  chosen_korean: 그를 물러나게 한 뒤
  alternatives_korean:
  - 그를 치워 놓은 뒤
  - 그를 옮긴 뒤
  lexicon: LSJ
  rationale: 재판 장면의 흐름을 살리면서, 상대를 잠시 자리에서 떼어 놓는 절차적 의미를 자연스럽게 표현했습니다.
- source_word: ἐκέλευσεν προσαγαγεῖν τὸν ἕτερον
  english_pob_choice: he ordered the other one to be brought forward
  chosen_korean: 다른 사람을 앞으로 나오게 하라고 명령했습니다
  alternatives_korean:
  - 다른 한 사람을 데려오라고 명령했습니다
  - 다른 이를 앞으로 데려오게 했습니다
  lexicon: LSJ
  rationale: προσαγαγεῖν의 ‘가까이 데려와 제시하다’는 의미를 살려, 심문/판결 맥락의 ‘앞으로 나오게 하다’로 옮겼습니다.
- source_word: Σπέρμα Χανάαν καὶ οὐκ Ἰούδα
  english_pob_choice: Offspring of Canaan and not Judah
  chosen_korean: 가나안의 씨요 유다가 아닌 자여
  alternatives_korean:
  - 가나안의 후손이요 유다가 아닌 자여
  - 가나안의 씨, 유다가 아니라
  lexicon: LSJ
  rationale: σπέρμα의 직설적 혈통 비난을 살리기 위해 ‘씨’를 유지했고, vocative의 질책을 한국어 문장으로 자연스럽게 묶었습니다.
- source_word: τὸ κάλλος ἐξηπάτησέν σε
  english_pob_choice: beauty has deceived you
  chosen_korean: 아름다움이 너를 속였고
  alternatives_korean:
  - 아름다움이 너를 기만했고
  - 아름다움이 너를 미혹했고
  lexicon: LSJ
  rationale: κάλλος는 외적 매력/아름다움을 뜻하므로 과도한 해석 없이 ‘아름다움’으로, ἐξηπάτησέν σε는 직접적인 ‘속이다’로 옮겼습니다.
- source_word: ἐπιθυμία διέστρεψεν τὴν καρδίαν σου
  english_pob_choice: desire has corrupted your heart
  chosen_korean: 욕망이 네 마음을 비틀었습니다
  alternatives_korean:
  - 욕망이 네 마음을 타락시켰습니다
  - 정욕이 네 마음을 왜곡했습니다
  lexicon: LSJ
  rationale: POB의 재검토 취지에 맞춰 διέστρεψεν의 ‘비틀다/뒤틀다’ 이미지를 보존했습니다. ἐπιθυμία는 문맥상 성적 욕망이지만, 원어의 폭을 남기기 위해 ‘욕망’으로 두었습니다.
theological_decisions:
- issue: 유다와 가나안의 혈통 대조를 직설적으로 유지할지 여부
  chosen_reading: ‘가나안의 씨요 유다가 아닌 자여’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘가나안 사람처럼 굴었구나’로 완화
  - ‘가나안의 후손이지만 유다는 아니다’로 풀이
  rationale: 본문은 도덕적 비난을 혈통 언어로 강하게 표상하므로, 그 수사적·언약적 대조를 약화시키지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 5
- issue: ἐπιθυμία의 강도를 ‘욕망’으로 유지할지 ‘정욕/정욕심’으로 좁힐지 여부
  chosen_reading: 본문은 ‘욕망’으로 두고, 문맥이 그 부정적 성격을 드러내게 했습니다.
  alternative_readings:
  - 정욕
  - 음욕
  rationale: 원어 자체는 더 넓은 의미를 가지므로, 문맥의 책망이 성적·도덕적 왜곡을 충분히 드러낸다고 보아 과도하게 좁히지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 6
