  verdict: revise
  source_fidelity: 개정이 필요합니다. οἱ ἐκ τῆς οἰκίας는 특정한 ‘집안 사람들’이라는 신분·소속을 명시하지 않으므로 ‘집에 있던 사람들’이 더 넓고 충실합니다. 또한 εἰσεπήδησαν은 실제로 급히 안으로 들어간 행동이므로 ‘뛰어 들어가 … 보려고 했습니다’보다 ‘… 보려고 … 뛰어 들어갔습니다’가 완료된 행동과 목적을 더 정확히 드러냅니다.
  naturalness: ‘집에 있던 사람들’, ‘뜰에서 들리는 외침’, ‘옆문으로 뛰어 들어갔습니다’는 현대 표준어 합쇼체에서 자연스럽습니다. 목적절과 본동사의 순서를 조정하여 ‘보려고 했습니다’가 줄 수 있는 미수·시도 뉘앙스를 피했습니다.
  terminology: παράδεισος의 문맥적 의미로 ‘뜰’을 유지할 수 있습니다. κραυγή는 ‘외침’으로 적절합니다. πλαγία θύρα의 본문 번역 ‘옆문’은 가능하나, 기존 각주는 본문과 동일한 표현을 ‘또는’으로 제시하여 기능하지 않으므로 대안을 ‘옆 출입구’로 바로잡아야 합니다.
  issues:
  - severity: medium
    issue: οἱ ἐκ τῆς οἰκίας를 ‘집안 사람들’로 번역함
    rationale: 그리스어는 집에서 나온/집에 속한 사람들을 넓게 가리키며 가족이나 특정 household 구성원을 확정하지 않습니다. ‘집에 있던 사람들’이 불필요한 특정화를 피합니다.
  - severity: medium
    issue: ‘뛰어 들어가 … 보려고 했습니다’의 상·양태 표현
    rationale: εἰσεπήδησαν은 실제로 일어난 급작스러운 진입입니다. 한국어 ‘-려고 했습니다’는 시도에 그쳤다는 뉘앙스를 낼 수 있으므로, 완료된 주동작을 ‘뛰어 들어갔습니다’로 표현하는 편이 낫습니다.
  - severity: medium
    issue: 각주가 본문 표현 ‘옆문’을 대안으로 반복함
    rationale: ‘또는 옆문’은 본문과 동일하여 어휘 대안 각주로 기능하지 않습니다. θύρα의 건축적 지시 대상이 확정되지 않는다는 점은 ‘옆 출입구’라는 대안으로 제시할 수 있습니다.
  revised_text: 그런데 집에 있던 사람들은 뜰에서 들리는 외침을 듣고, 그녀에게 무슨 일이 일어났는지 보려고 옆문으로 뛰어 들어갔습니다.[a]
