  rationale: εἰσεπήδησαν은 단순 진입보다 갑작스럽고 힘 있는 돌입을 뜻하므로, 장면의 긴박함을 보존하기 위해 '뛰어 들어가'를 택했습니다.
  doctrine_reference: 서사 문맥 보존
