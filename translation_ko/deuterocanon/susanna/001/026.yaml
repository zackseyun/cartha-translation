  yaml_path: translation/deuterocanon/susanna/001/026.yaml
  text: But when those from the house heard the outcry in the garden[a], they rushed in through the side door to see what had happened to her.
  footnotes:
  - marker: a
    text: Or 'through the side gate'; the Greek πλαγία θύρα can denote a side entrance, and the exact architectural sense is not explicit.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 집안 사람들은 뜰에서 나는 외침을 듣고, 옆문으로 뛰어 들어가 그녀에게 무슨 일이 일어났는지 보려고 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '옆문'으로도 옮길 수 있습니다. πλαγία θύρα는 정확한 건축적 형태가 분명하지 않아, 옆쪽 출입구를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κραυγή
  english_pob_choice: outcry
  chosen_korean: 외침
  alternatives_korean:
  - 부르짖음
  - 소리침
  lexicon: BDAG
  rationale: κραυγή는 단순한 '소리'보다 급박한 큰 외침을 가리키므로, POB의 'outcry'에 맞춰 자연스러운 현대 한국어인 '외침'으로 옮겼습니다.
- source_word: παράδεισος
  english_pob_choice: garden
  chosen_korean: 뜰
  alternatives_korean:
  - 정원
  - 동산
  - 낙원
  lexicon: LSJ
  rationale: 이 장면의 παράδεισος는 신학적 '낙원'이 아니라 집에 딸린 실제 뜰/정원을 뜻하므로, 주거 맥락을 살리는 '뜰'을 선택했습니다.
- source_word: πλαγία θύρα
  english_pob_choice: side door
  chosen_korean: 옆문
  alternatives_korean:
  - 측문
  - 옆문
  - 옆문
  lexicon: LSJ
  rationale: θύρα는 문/출입구를 뜻하고 πλαγία는 옆쪽을 가리키므로, 주거 공간에 자연스러운 '옆문'이 가장 직접적입니다.
- source_word: τὸ συμβεβηκὸς αὐτῇ
  english_pob_choice: what had happened to her
  chosen_korean: 그녀에게 무슨 일이 일어났는지
  alternatives_korean:
  - 그녀에게 일어난 일이 무엇인지
  - 그녀에게 무슨 일이 있었는지
  lexicon: BDAG
  rationale: 완료 분사 συμβεβηκός의 결과 상태를 한국어 자연문으로 풀어, 사건의 발생과 그 대상(그녀)을 함께 드러냈습니다.
