  text: 두 사람이 서로 갈라졌을 때에 그는 그들 중 하나를 불러 그에게 말했습니다. 「악한 날들에 늙어 버린 자야, 이제 네가 전에 저지르던 죄들이 네게 닥쳤다.」[a]
  philosophy: optimal-equivalence
