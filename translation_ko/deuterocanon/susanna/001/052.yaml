    text: 그리스어 본문은 여기서 ‘τὸ’로 끝납니다. 이는 아마 다음 구절로 이어지는 표현(‘전에/이전에’)의 일부로 보이며, 본문은 그 가능성 있는 뜻을 반영했습니다.
    reason: textual_variant
