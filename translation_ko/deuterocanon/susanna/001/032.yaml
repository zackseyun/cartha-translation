  verdict: revise
  source_fidelity: ‘법 없는 자들’은 παράνομος의 법적·도덕적 뉘앙스를 다소 어색하게 전달하며, ‘그녀를 벗겨 보이게’는 한국어에서 원문이 명시하지 않은 전면적 탈의의 뜻으로 쉽게 읽힙니다. 또한 ‘욕망으로 가득 차려고’는 한국어 결합이 부자연스럽고, 원문의 욕망을 채우려는 목적을 충분히 드러내지 못합니다.
  naturalness: ‘불법한 자들’, ‘가리개를 벗기도록 명령했습니다’, ‘욕망을 채우려 했습니다’가 현대 표준어 합쇼체에서 더 자연스럽고 명료합니다.
  terminology: παράνομοι는 ‘불법한 자들’로 옮겨 법을 거스르는 성격을 보존했습니다. ἐπιθυμία는 문맥상 부정한 성적 욕망을 가리키지만, 본문에서는 과도한 해석을 피하여 ‘욕망’으로 유지했습니다. ἀποκαλύψαι는 덮개/가리개를 제거하는 뜻으로 처리하되, 원문에 없는 신체 부위나 탈의 범위를 덧붙이지 않았습니다.
