translation:
  language: ko
  text: 그 불법한 자들은 그녀의 가리개를 벗기도록 명령했습니다[a]. 이는 그들이 그녀의 아름다움을 향한 욕망을 채우려는 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 그녀의 아름다움에 대한 욕망으로 가득 차게 하려고.’ 헬라어는 문자적으로 욕망과 관련하여 ‘채워지다’라고 표현합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ παράνομοι
  english_pob_choice: the lawless men
  chosen_korean: 그 법 없는 자들은
  alternatives_korean:
  - 그 악한 자들은
  - 그 불법한 사람들은
  lexicon: LSJ
  rationale: παράνομος의 핵심은 단순한 도덕적 악함보다 ‘율법/법을 거스름’에 있으므로, 이를 살린 ‘법 없는 자들’로 옮겼습니다.
- source_word: ἀποκαλύψαι αὐτήν
  english_pob_choice: her to be uncovered
  chosen_korean: 그녀를 벗겨 보이게 하라고
  alternatives_korean:
  - 그녀를 드러내게 하라고
  - 그녀를 가리개 없이 하라고
  lexicon: BDAG
  rationale: 여기서는 단순한 ‘revealed’가 아니라 공개석상에서 덮개를 벗기게 하라는 뜻이므로, 한국어로는 자연스럽게 ‘벗겨 보이게 하다’로 옮겼습니다.
- source_word: ἐμπλησθῶσιν
  english_pob_choice: so that they might satisfy
  chosen_korean: 가득 차려고 했습니다
  alternatives_korean:
  - 만족하려고 했습니다
  - 채워지려고 했습니다
  lexicon: BDAG
  rationale: 동사는 문자적으로 ‘채우다/가득 채우다’이므로, 성적 욕망의 포만을 드러내는 ‘가득 차다’로 옮겨 원문의 이미지를 살렸습니다.
- source_word: τοῦ κάλλους ἐπιθυμίας αὐτῆς
  english_pob_choice: their desire for her beauty
  chosen_korean: 그녀의 아름다움에 대한 욕망
  alternatives_korean:
  - 그녀의 아름다움을 향한 욕망
  - 그녀의 아름다움에 대한 탐욕
  lexicon: BDAG
  rationale: κάλλος는 외적 아름다움을 뜻하므로 ‘아름다움’이 적절하고, ἐπιθυμία는 이 문맥에서 성적 욕망의 뉘앙스가 강해 ‘욕망’으로 옮겼습니다.
