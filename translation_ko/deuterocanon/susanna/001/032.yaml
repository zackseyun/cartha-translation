  text: And the lawless men ordered her to be uncovered[a], so that they might satisfy their desire for her beauty.
  footnotes:
  - marker: a
    text: Or 'so that they might have their fill of desire for her beauty'; the Greek literally speaks of being 'filled' with desire in relation to her beauty.
