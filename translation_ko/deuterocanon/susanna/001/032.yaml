    rationale: ἐμπλησθῶσιν은 문자적으로 ‘채워지다’이지만 이 문맥에서는 그녀의 아름다움을 향한 욕망을 충족하려는 뜻입니다. ‘욕망을 채우려 했습니다’가 자연스럽고 목적절의 의미를 명확히 전달합니다.
