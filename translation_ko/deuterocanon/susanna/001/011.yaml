  yaml_path: translation/deuterocanon/susanna/001/011.yaml
  text: And when dawn came[a], they would come, stealing away from one another in haste, to see which of them would appear to her first and speak with her.
  footnotes:
  - marker: a
    text: Greek literally, 'they were stealing one another.' The expression is idiomatic and likely means they were furtively slipping in separately, each trying to get to Susanna before the other.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 새벽이 되면, 그들은 서로를 피해 서둘러 와서, 누가 먼저 그 여자에게 나타나 그 여자에게 말할지를 보았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 표현은 문자적으로는 '서로를 훔치고 있었다'에 가깝습니다. 여기서는 서로를 눈치 채지 못하게 따로 움직이려는 뜻의 관용적 표현으로 이해했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐγίνετο ὄρθρος
  english_pob_choice: when dawn came
  chosen_korean: 새벽이 되면
  alternatives_korean:
  - 동이 틀 때
  - 날이 밝아 오면
  - 아침이 되면
  lexicon: LSJ
  rationale: ὄρθρος는 새벽/동틀 무렵을 가리키므로, 서술의 시간 배경을 자연스럽게 살려 '새벽이 되면'으로 옮겼습니다.
- source_word: ἔκλεπτον ἀλλήλους
  english_pob_choice: stealing away from one another
  chosen_korean: 서로를 피해
  alternatives_korean:
  - 서로를 숨기며
  - 서로 몰래 지나며
  - 서로를 속이며
  lexicon: LSJ
  rationale: 직역하면 '서로를 훔치다'로 낯설지만, 문맥상 서로 눈치 채지 못하게 따로따로 움직이는 뉘앙스이므로 '서로를 피해'로 idiomatic하게 옮겼습니다.
- source_word: σπεύδοντες
  english_pob_choice: in haste
  chosen_korean: 서둘러
  alternatives_korean:
  - 급히
  - 다급하게
  - 바삐
  lexicon: BDAG
  rationale: σπεύδω의 서두름/재촉하는 뜻을 살려, 부사적으로 자연스러운 '서둘러'를 선택했습니다.
- source_word: τίς φανήσεται αὐτῇ πρότερος καὶ λαλήσει πρὸς αὐτήν
  english_pob_choice: which of them would appear to her first and speak with her
  chosen_korean: 누가 먼저 그 여자에게 나타나 그 여자에게 말할지를
  alternatives_korean:
  - 누가 먼저 그 여자 앞에 나타나 그 여자에게 말할지를
  - 누가 먼저 그 여자에게 보이고 그 여자와 말할지를
  - 누가 먼저 그 여자에게 나아가 말할지를
  lexicon: LSJ; BDAG
  rationale: φανήσεται는 '나타나다/드러나다'의 의미를 살려 '나타나'로, πρός αὐτήν은 관계 방향을 유지하면서도 한국어에서 자연스러운 '그 여자에게 말하다'로 옮겼습니다.
