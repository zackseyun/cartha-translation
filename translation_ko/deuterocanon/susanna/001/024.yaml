base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/024.yaml
  text: And Susanna groaned and said[a], “I am hemmed in on every side. For if I do this, it is death for me; but if I do not do it[b], I will not escape your hands.”
  footnotes:
  - marker: a
    text: Or, “I am hard pressed from every side.”
    reason: lexical_alternative
  - marker: b
    text: Literally, “I will not escape your hands,” an idiom for remaining in your power.
    reason: lexical_alternative
translation:
  language: ko
  text: 수산나가 탄식하며 말했습니다[a]. 「사방이 나를 옥죄고 있습니다. 이 일을 하면 내게는 죽음입니다. 그러나 내가 하지 않으면 여러분의 손에서 벗어나지 못할 것입니다[b].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “나는 사방에서 몹시 압박받고 있습니다.”
    reason: lexical_alternative
  - marker: b
    text: 직역하면, “여러분의 손에서 벗어나지 못할 것입니다.” 이 표현은 그들의 권세 아래 남아 있음을 뜻하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεστέναξεν
  english_pob_choice: groaned
  chosen_korean: 탄식하며
  alternatives_korean:
  - 신음하며
  - 깊이 한숨 쉬며
  lexicon: LSJ
  rationale: 깊은 고통과 압박을 드러내는 동사로, 한국어에서는 자연스러운 ‘탄식하며’가 감정의 무게를 잘 살립니다.
- source_word: Στενά μοι πάντοθεν
  english_pob_choice: I am hemmed in on every side
  chosen_korean: 사방이 나를 옥죄고 있습니다
  alternatives_korean:
  - 사방에서 압박받고 있습니다
  - 사면이 막혀 있습니다
  lexicon: LSJ
  rationale: ‘둘러싸여 빠져나갈 길이 없음’이라는 압박의 관용적 의미를 살리면서, 현대 한국어로도 긴박감이 분명하게 전달되도록 했습니다.
- source_word: θάνατός μοί ἐστιν
  english_pob_choice: it is death for me
  chosen_korean: 내게는 죽음입니다
  alternatives_korean:
  - 내게는 죽음이 됩니다
  - 나는 죽게 됩니다
  lexicon: LSJ
  rationale: 원문의 명사구적이고 단호한 표현을 유지하되, 한국어에서는 자연스러운 서술로 옮겼습니다.
- source_word: οὐκ ἐκφεύξομαι τὰς χεῖρας ὑμῶν
  english_pob_choice: I will not escape your hands
  chosen_korean: 여러분의 손에서 벗어나지 못할 것입니다
  alternatives_korean:
  - 여러분의 손을 피하지 못할 것입니다
  - 여러분의 손에서 빠져나가지 못할 것입니다
  lexicon: LSJ
  rationale: 직역의 ‘손’은 보존하되, 한국어에서는 ‘손에서 벗어나지 못하다’가 ‘여러분의 권세/통제 아래 남아 있다’는 관용적 의미를 더 자연스럽게 드러냅니다.
theological_decisions:
- issue: 수산나의 절박한 양자택일을 완화하지 않는 번역
  chosen_reading: 원문의 협박성과 양자택일의 압박을 그대로 드러내어, ‘사방이 나를 옥죄고 있습니다’와 ‘죽음입니다’의 강한 표현을 유지했습니다.
  alternative_readings:
  - 사회적 수치나 법적 위험으로 완곡하게 풀어 쓰는 번역
  rationale: 그리스어는 타협도 도피도 허용되지 않는 강제적 상황을 직접적으로 제시하므로, 서사를 약화시키는 완곡어법을 피했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
