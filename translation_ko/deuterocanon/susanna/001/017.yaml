    issue: ‘어떤 날 한 번’ 및 ‘들어가서는’의 어색한 서술
    rationale: ποτε는 특정한 한 때를 가리키므로 ‘어느 날’이 자연스럽습니다. εἰσῆλθεν은 단순 과거의 ‘들어갔습니다’로 충분하며, ‘-가서는’은 원문에 없는 연결·강조를 더합니다.
  - severity: low
    issue: ‘뜨거웠기 때문에’의 비인칭적·모호한 표현
    rationale: καῦμα ἦν은 더위가 있었다는 뜻이므로 ‘날씨가 더웠기 때문에’가 원인의 내용을 분명히 합니다.
