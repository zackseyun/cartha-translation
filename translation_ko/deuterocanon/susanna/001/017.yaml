  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ποτε는 ‘어떤 날 한 번’보다 ‘어느 날’이 자연스럽고, καῦμα ἦν은 ‘뜨거웠기 때문에’보다 날씨의 더위를 명시하는 편이 정확합니다. 비교구는 본문의 다소 특이한 시간 표현을 보존하되 각주로 관용적 의미를 밝혀야 합니다.
  naturalness: 초안의 ‘어떤 날 한 번’과 ‘들어가서는’은 현대 한국어 문장으로 어색합니다. 또한 비교구에 대한 각주는 문장 끝보다 해당 표현 바로 뒤에 붙이는 것이 독자의 이해에 적절합니다.
  terminology: ‘알맞은 날을 노리다’는 ἡμέραν εὔθετον을 기다리며 살피는 문맥을 자연스럽게 전달합니다. κοράσια는 본문 상황에서 ‘하녀’로 옮길 수 있으며, λούσασθαι는 ‘목욕을 하다’가 적절합니다.
