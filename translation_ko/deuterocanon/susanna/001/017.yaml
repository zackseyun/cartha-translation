  yaml_path: translation/deuterocanon/susanna/001/017.yaml
  text: And it happened[a], while they were watching for an opportune day, that she once entered, as yesterday and the third day before, with only two young maids, and desired to bathe in the garden, because it was hot.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'as on the previous days.' The Greek phrase literally compares this visit with 'yesterday and the third day before.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들이 알맞은 날을 엿보는 동안, 그녀는 어떤 날 한 번, 어제와 사흘 전과 같이, 두 하녀만 데리고 들어가서는, 뜨거웠기 때문에 정원에서 목욕하고 싶어 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘어제와 사흘 전’이라는 비교 표현입니다. POB의 영어는 이를 보다 관용적으로 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρατηρεῖν
  english_pob_choice: were watching
  chosen_korean: 엿보는 동안
  alternatives_korean:
  - 지켜보는 동안
  - 감시하는 동안
  lexicon: BDAG
  rationale: 단순한 관찰보다 호시탐탐 때를 노리는 뉘앙스가 있어, 문맥의 긴장감을 살려 ‘엿보다’를 택했습니다.
- source_word: ἡμέραν εὔθετον
  english_pob_choice: an opportune day
  chosen_korean: 알맞은 날
  alternatives_korean:
  - 적절한 날
  - 기회가 되는 날
  - 때맞은 날
  lexicon: LSJ
  rationale: 그들이 의도한 목적에 맞는 날이라는 뜻이므로, 한국어에서 자연스럽고 의미를 보존하는 ‘알맞은 날’로 옮겼습니다.
- source_word: καθὼς ἐχθὲς καὶ τρίτης ἡμέρας
  english_pob_choice: as yesterday and the third day before
  chosen_korean: 어제와 사흘 전과 같이
  alternatives_korean:
  - 어제와 그 전날처럼
  - 어제와 이틀 전처럼
  - 지난날들과 같이
  lexicon: LSJ
  rationale: 직역을 유지하되 한국어로 이해 가능하도록 ‘사흘 전’으로 풀어, 이전 방문들과의 비교라는 점을 살렸습니다.
- source_word: μετὰ δύο μόνων κορασίων
  english_pob_choice: with only two young maids
  chosen_korean: 두 하녀만 데리고
  alternatives_korean:
  - 두 젊은 하녀만 데리고
  - 두 소녀만 데리고
  - 두 시녀만 데리고
  lexicon: BDAG
  rationale: κορασίαι는 여기서 수행원 역할을 하는 젊은 여자들을 가리키므로, 계층적 관계까지 드러나는 ‘하녀’가 가장 자연스럽습니다.
