base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/017.yaml
  text: And it happened[a], while they were watching for an opportune day, that she once entered, as yesterday and the third day before, with only two young maids, and desired to bathe in the garden, because it was hot.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'as on the previous days.' The Greek phrase literally compares this visit with 'yesterday and the third day before.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들이 알맞은 날을 노리고 있던 때에, 그녀는 어느 날 어제와 사흘 전처럼[a] 하녀 둘만 데리고 들어갔습니다. 날씨가 더웠기 때문에 정원에서 목욕을 하고 싶어 했습니다.
  philosophy: optimal-equivalence
  footnotes:
