  text: After seizing her[a], we questioned her, ‘Who was the man?’ But she did not tell us who he was. These things we testify.
  footnotes:
  - marker: a
    text: Or, 'These things we bear witness to.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 그녀를 붙잡아 놓고 ‘그 남자가 누구였습니까?’ 하고 캐물었습니다. 그러나 그녀는 그가 누구인지 우리에게 말하지 않았습니다. 우리는 이 일들을 증언합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαβόμενοι
  english_pob_choice: after seizing
  chosen_korean: 붙잡고
  alternatives_korean:
  - 붙들고
  - 잡아두고
  lexicon: BDAG
  rationale: 법정적 체포·제압의 뉘앙스를 살리면서도 한국어에서 자연스럽게 읽히는 동사를 택했습니다.
- source_word: ἐπηρώτωμεν
  english_pob_choice: we questioned
  chosen_korean: 물었습니다
  alternatives_korean:
  - 질문했습니다
  - 추궁했습니다
  lexicon: BDAG
  rationale: 단순한 물음보다 강하지만 과도하게 형사적이지 않은 질문의 흐름을 한국어로 자연스럽게 옮겼습니다.
- source_word: τίς ὁ ἄνθρωπος;
  english_pob_choice: Who was the man?
  chosen_korean: 그 남자가 누구였습니까?
  alternatives_korean:
  - 그 사람은 누구였습니까?
  - 그 남자는 누구였습니까?
  lexicon: BDAG
  rationale: 관사 ὁ가 가리키는 특정 남성을 살리기 위해 ‘그 남자’로 옮기고, 서술 시점을 반영해 과거형으로 두었습니다.
- source_word: ταῦτα μαρτυροῦμεν
  english_pob_choice: These things we testify
  chosen_korean: 이것들이 우리가 증언하는 바입니다
  alternatives_korean:
  - 이것들이 우리의 증언입니다
  - 우리는 이것들을 증언합니다
  lexicon: BDAG
  rationale: μαρτυρέω의 법정적 증언 어감을 유지하면서도 한국어 문장으로는 가장 자연스럽게 정리했습니다.
theological_decisions:
- issue: 증언/진술의 법정적 register 보존
  chosen_reading: 마지막 절을 ‘증언하는 바’로 옮겨 단순 서술이 아니라 공식 증언임을 드러냈습니다.
  alternative_readings:
  - ‘이것이 우리의 증언입니다’처럼 더 매끈하게 정리할 수 있습니다.
  rationale: 문맥이 고발과 심문을 포함한 법정 진술이므로, ‘증언’의 형식을 살려 원문의 책임 있는 진술 톤을 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
