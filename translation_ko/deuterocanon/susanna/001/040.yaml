revisions:
- from: 우리가 그녀를 붙잡고 "그 남자가 누구였습니까?" 하고 물었습니다. 그러나 그녀는 그가 누구인지 우리에게 말하지 않았습니다. 이것들이 우리가 증언하는 바입니다.[a]
  to: 우리는 그녀를 붙잡아 놓고 ‘그 남자가 누구였습니까?’ 하고 캐물었습니다. 그러나 그녀는 그가 누구인지 우리에게 말하지 않았습니다. 우리는 이 일들을 증언합니다.
  rationale: ἐπιλαβόμενοι의 물리적 제압을 ‘붙잡아 놓고’로, 법정 맥락의 ἐπηρώτωμεν을 ‘캐물었습니다’로 옮겼습니다. 마지막 절은 ταῦτα의 복수 대상을 ‘이 일들’로 유지하면서 μαρτυροῦμεν의 법정적 증언 행위를 직접적으로 표현했습니다. 의미상 필요한 모호성이나 본문 이문이 없으므로 중복적인 각주는 삭제했습니다.
