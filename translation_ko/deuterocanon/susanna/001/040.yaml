translation:
  language: ko
  text: 우리가 그녀를 붙잡고 "그 남자가 누구였습니까?" 하고 물었습니다. 그러나 그녀는 그가 누구인지 우리에게 말하지 않았습니다. 이것들이 우리가 증언하는 바입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘이것들이 우리가 증언하는 것입니다.’
