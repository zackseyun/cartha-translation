lexical_decisions:
- source_word: οἱ δὲ ἀπέστειλαν
  english_pob_choice: So they sent for her
  chosen_korean: 그들이 그녀를 불러오게 하자
  alternatives_korean:
  - 그래서 그들이 그녀를 보냈습니다
  - 그들이 그녀를 보냈습니다
  - 그래서 그들이 그녀를 불러왔습니다
  lexicon: BDAG
  rationale: ἀπέστειλαν은 단순히 ‘보내다’보다 이 문맥에서 그녀를 출석시키기 위해 불러들이는 뜻으로 읽히므로, 한국어에서는 자연스럽게 ‘불러오게 하다’로 옮겼습니다.
- source_word: ἦλθεν
