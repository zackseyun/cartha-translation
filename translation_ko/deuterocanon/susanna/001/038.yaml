  yaml_path: translation/deuterocanon/susanna/001/038.yaml
  text: And they did not know that we were standing there. Then we rushed together[a], saying, 'Let us find out who these men are.'
  footnotes:
  - marker: a
    text: Greek literally, 'who these are'; 'men' is supplied from the immediate context, where the speakers refer to the two young men.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 우리가 거기에 서 있었다는 것을 알지 못했습니다. 그러자 우리는 서로에게[a] 달려들면서, “이 사람들이 누구인지 알아봅시다.”라고 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어에는 문자적으로 ‘서로에게’라는 상호 표현이 있습니다. 이 행동이 관련된 이들 사이에서 정확히 어떻게 이루어졌는지는 문맥상 다소 어색하므로, 본문은 그 상호성을 보존했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ᾔδεισαν
  english_pob_choice: did not know
  chosen_korean: 알지 못했습니다
  alternatives_korean:
  - 몰랐습니다
  - 알지 못하였습니다
  lexicon: BDAG
  rationale: 서술문의 단순 과거 인식 부정을 자연스럽게 옮겼습니다. ‘몰랐습니다’도 가능하지만, 본문이 정보 인지의 부정을 말하므로 ‘알지 못했습니다’가 더 직접적입니다.
- source_word: εἰστήκειμεν
  english_pob_choice: we were standing there
  chosen_korean: 우리가 거기 서 있는 줄
  alternatives_korean:
  - 우리가 거기 서 있었다는 것을
  - 우리가 거기 서 있던 것을
  lexicon: LSJ
  rationale: 완료 이전의 ‘서 있던 상태/자세’를 살리되 한국어에서는 ‘-는 줄’ 구문이 자연스러워, 그들이 우리 존재를 알아차리지 못했다는 뉘앙스를 함께 담았습니다.
- source_word: συνεπιτάμεθα
  english_pob_choice: we rushed together
  chosen_korean: 우리는 함께 급히 달려들며
  alternatives_korean:
  - 우리는 함께 달려들며
  - 우리는 함께 돌진하며
  lexicon: LSJ
  rationale: 복합 동사의 급작스러운 움직임을 살리되, 문맥상 단순한 이동이 아니라 상대를 향한 돌입이므로 ‘급히 달려들다’로 옮겼습니다.
- source_word: Μάθωμεν τίνες εἰσὶν οὗτοι
  english_pob_choice: Let us find out who these men are
  chosen_korean: “이 사람들이 누구인지 알아봅시다.”
  alternatives_korean:
  - “이 사람들이 누구인지 알아봅시다.”
  - “이들이 누구인지 알아봅시다.”
  lexicon: BDAG
  rationale: hortatory subjunctive는 권유형으로 자연스럽게 처리했고, 문맥상 남성 지시 대상이 드러나지만 한국어 본문에서는 과도한 보충을 피하기 위해 ‘이 사람들’로 두었습니다.
