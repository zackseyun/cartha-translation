  source_fidelity: 첫 문장은 εἰστήκειμεν의 이미 서 있던 상태를 대체로 잘 전달합니다. 그러나 συνεπιτάμεθα ἀλλήλοις에서 명시된 상호성(ἀλλήλοις)이 본문에서는 ‘함께’로 바뀌어 사라졌습니다. 문맥상 행동의 정확한 대상 관계가 다소 어색하고 논쟁적이므로, 이를 일방적인 공동 행동으로 해소하지 않고 상호 표현을 보존하는 편이 안전합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체에 맞습니다. ‘서로에게 달려들면서’는 다소 긴장된 원문의 상호 표현을 자연스럽게 드러내며, 말하는 행동과 동시성을 ‘-면서’로 나타냅니다.
