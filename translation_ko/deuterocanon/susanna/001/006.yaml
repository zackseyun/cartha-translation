  yaml_path: translation/deuterocanon/susanna/001/006.yaml
  text: and legal cases came to them from other cities[a].
  footnotes:
  - marker: a
    text: Or 'judgments were coming to them from other cities.' The Greek κρίσεις can denote judicial decisions or the cases brought for judgment; here it is rendered 'legal cases' to make the courtroom sense explicit.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 다른 성읍들에서 재판 사건들이 그들에게로 오고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다른 성읍들에서 판결들이 그들에게로 오고 있었습니다.’ κρίσεις는 법적 판결 자체나, 여기처럼 재판을 위해 제기된 사건들을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρχοντο
  english_pob_choice: were coming
  chosen_korean: 와서
  alternatives_korean:
  - 오고 있었고
  - 왔습니다
  lexicon: BDAG
  rationale: 미완료 과거의 지속·반복 뉘앙스를 한국어에서 가장 자연스럽게 살리기 위해 연결형 ‘와서’를 택했습니다.
- source_word: κρίσεις
  english_pob_choice: legal cases
  chosen_korean: 소송들
  alternatives_korean:
  - 판결들
  - 재판 사건들
  - 법적 사건들
  lexicon: LSJ
  rationale: 여기서는 ‘판결’ 자체보다 심판을 받기 위해 들어오는 재판 사안이 핵심이므로, 현대 한국어의 법정 맥락을 드러내는 ‘소송들’이 가장 직접적입니다.
- source_word: ἐξ ἄλλων πόλεων
  english_pob_choice: from other cities
  chosen_korean: 다른 성읍들에서
  alternatives_korean:
  - 다른 도시들에서
  - 다른 마을들에서
  lexicon: LSJ
  rationale: πόλεων은 일반적으로 ‘성읍/도시’로 옮길 수 있으나, 고전적 행정·재판 문맥을 반영해 ‘성읍들’을 사용했습니다.
- source_word: πρὸς αὐτούς
  english_pob_choice: to them
  chosen_korean: 그들에게로
  alternatives_korean:
  - 그들 앞에
  - 그들에게
  lexicon: BDAG
  rationale: πρός + 대격의 이동 방향을 살려 사건이 그들에게 향해 도착하는 느낌을 주기 위해 ‘그들에게로’로 옮겼습니다.
theological_decisions:
- issue: κρίσεις의 법정적 의미를 어떻게 드러낼지
  chosen_reading: ‘소송들’로 옮겨, 중립적 ‘판결’보다 심리 대상이 되는 법적 사안을 분명히 했습니다.
  alternative_readings:
  - 판결들
  - 재판들
  - 법적 사건들
  rationale: 문맥상 장로/재판관에게 외부 성읍들의 분쟁이 들어오는 장면이므로, 사안 자체가 이동해 오는 법정성을 드러내는 번역이 필요합니다.
  doctrine_reference: 공적 재판과 판단의 문맥
- issue: 미완료 과거의 지속성 처리
  chosen_reading: ‘와서’로 흐름을 살리되, 한국어에서 과도한 시제 표지 없이 반복적 유입을 암시했습니다.
  alternative_readings:
  - 오고 있었고
  - 왔습니다
  rationale: 그리스어 미완료 시제의 지속·습관적 성격을 완전히 잃지 않으면서도 문장 전체를 간결하게 유지하기 위해 연결형을 사용했습니다.
  doctrine_reference: 서사 시제와 문맥적 뉘앙스
