  naturalness: ‘장로들이 자기들의 말을 하자’는 한국어에서 다소 중복되고 어색합니다. 주어가 분명하므로 ‘장로들이 말하자’가 자연스럽고 의미 손실도 없습니다. ‘그런 말이 … 나온 적이 없었다’는 현대 표준어 합쇼체 문맥에서 자연스럽습니다.
