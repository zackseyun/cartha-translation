  yaml_path: translation/deuterocanon/susanna/001/027.yaml
  text: But when the elders spoke their words[a], the servants were greatly ashamed, because never had such a thing been said about Susanna.
  footnotes:
  - marker: a
    text: Or 'such a statement' or 'such an accusation' about Susanna.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 장로들이 자기들의 말을 하자, 종들이 몹시 부끄러워하였습니다. 왜냐하면 그런 말은 지금껏 수산나에 관해 한 번도 들려온 적이 없었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘수산나에 대한 그런 말/그런 고발’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πρεσβῦται
  english_pob_choice: the elders
  chosen_korean: 장로들
  alternatives_korean:
  - 어른들
  - 노인들
  lexicon: LSJ
  rationale: πρεσβῦται는 단순한 고령자가 아니라 공동체에서 지위가 있는 ‘장로들’을 가리키므로, 한국어로도 그 직분적·사회적 무게를 살렸습니다.
- source_word: τοὺς λόγους αὐτῶν
  english_pob_choice: their words
  chosen_korean: 자기들의 말
  alternatives_korean:
  - 그들의 말
  - 그들의 진술
  - 그들의 주장
  lexicon: LSJ
  rationale: λόγοι는 여기서 길게 꾸민 진술보다 장로들이 실제로 한 ‘말’ 자체를 가리키므로, 너무 해석을 덧붙이지 않는 쪽으로 옮겼습니다.
- source_word: κατῃσχύνθησαν ... σφόδρα
  english_pob_choice: were greatly ashamed
  chosen_korean: 몹시 부끄러워하였습니다
  alternatives_korean:
  - 크게 수치스러워하였습니다
  - 몹시 수치를 당하였습니다
  lexicon: LSJ
  rationale: 수동형의 수치를 당함과 내적 부끄러움을 함께 담되, 현대 한국어에서 자연스러운 감정 반응으로 읽히도록 옮겼습니다.
- source_word: ὅτι πώποτε οὐκ ἐρρέθη λόγος τοιοῦτος περὶ Σουσάννης
  english_pob_choice: because never had such a thing been said about Susanna
  chosen_korean: 왜냐하면 그런 말은 지금껏 수산나에 관해 한 번도 들려온 적이 없었기 때문입니다
  alternatives_korean:
  - 왜냐하면 그런 말은 수산나에 대해 한 번도 말해진 적이 없었기 때문입니다
  - 왜냐하면 수산나에 관해 그런 말은 일찍이 들린 적이 없었기 때문입니다
  lexicon: LSJ
  rationale: πώποτε οὐκ은 ‘한 번도 … 없었다’는 강한 부정을 담으므로 ‘지금껏 한 번도’로 살렸고, ἐρρέθη는 ‘말해졌다’의 수동 의미를 한국어 관용에 맞게 ‘들려온 적이 없었다’로 풀었습니다.
