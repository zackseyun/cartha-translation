  rationale: 눈을 ‘돌리다’는 의도적 회피의 동작을 간결하게 드러내며, 시선의 방향 전환이라는 본문의 구체적 이미지를 보존합니다.
- source_word: τοῦ μὴ βλέπειν εἰς τὸν οὐρανόν
  english_pob_choice: so as not to look to heaven
  chosen_korean: 하늘을 보지 않으려 했으며
