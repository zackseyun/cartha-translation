  lexicon: BDAG
  rationale: 목적을 나타내는 구조를 한국어의 의도 표현으로 옮겨, 단순한 행위가 아니라 고의적 회피였음을 드러냈습니다.
- source_word: κριμάτων δικαίων
  english_pob_choice: righteous judgments
  chosen_korean: 의로운 판결을
  alternatives_korean:
  - 의로운 심판을
  - 공의로운 판결을
  lexicon: BDAG
  rationale: κρίματα는 판결·결정의 뉘앙스가 강하므로 ‘판결’이 적절하며, δίκαια의 도덕적 성격은 ‘의로운’으로 살렸습니다.
theological_decisions:
- issue: ‘하늘’과 ‘의로운 판결’의 신학적 지시 대상
  chosen_reading: 본문이 직접 말하는 범위를 유지하여 ‘하늘’과 ‘의로운 판결’로 옮기고, 하나님을 명시적으로 덧붙이지 않았습니다.
  alternative_readings:
  - 하나님을 바라보지 않으려 했으며, 하나님의 의로운 판결을 기억하지 않으려 했습니다.
  rationale: 헬라어는 ‘하늘’과 ‘의로운 판결’만을 말하며 소유격으로 하나님을 명시하지 않습니다. 문맥상 하나님을 강하게 암시하더라도, 본문이 말하는 긴장을 그대로 두는 것이 더 충실합니다.
  doctrine_reference: '번역 원칙: 본문이 직접 말하지 않는 신학적 요소를 보태지 않고, 암시만 있는 경우는 암시로 남겨 둡니다.'
