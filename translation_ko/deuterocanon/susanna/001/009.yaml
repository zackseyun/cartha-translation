base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/009.yaml
  text: They twisted their minds and turned away their eyes so as not to look to heaven or remember righteous judgments[a][b].
  footnotes:
  - marker: a
    text: Or 'perverted their minds.' The Greek verb can carry the sense of moral corruption as well as distortion.
    reason: lexical_alternative
  - marker: b
    text: '''Righteous judgments'' may also be rendered ''just judgments.'' The phrase likely refers to God''s just acts or standards, though the Greek does not state the possessive explicitly.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 자기들의 마음을 왜곡하고 자기들의 눈을 돌려, 하늘을 바라보지도 않고 의로운 판결들을 기억하지도 않으려 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘왜곡하고’는 ‘비뚤어지게 하다’ 또는 ‘도덕적으로 타락시키다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘의로운 판결들’은 ‘공의로운 판결들’로도 옮길 수 있으며, 헬라어는 이것들이 하나님의 것임을 소유격으로 직접 밝히지 않습니다.
    reason: lexical_alternative
