base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/004.yaml
  text: And Joakim was exceedingly rich[a], and he had a garden adjoining his house[c][b]; and the Jews would come to him because he was more esteemed than all of them.
  footnotes:
  - marker: a
    text: Or 'park' or 'orchard' for 'garden'; the Greek denotes a cultivated estate or enclosed pleasure-garden.
    reason: lexical_alternative
  - marker: b
    text: Or 'the Judeans' if taken geographically rather than ethnically/religiously.
    reason: alternative_reading
  - marker: c
    text: Traditional English often has 'Joachim.' The Greek form here is Ἰωακείμ.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 요아킴[c]은 매우 부유했으며[a], 그의 집 곁에는 정원이 있었습니다. 유대인들[b]은 그가 모든 사람보다 더 존경받았기 때문에 그에게 찾아왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘공원’ 또는 ‘과수원’으로 옮길 수 있습니다. 여기서 그리스어는 가꾸어진 부지나 울타리 친 정원을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 문맥에 따라 지리적 의미의 ‘유대 사람들’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 그리스어 이름은 Ἰωακείμ입니다. 전통적인 서구 표기에는 ‘Joachim’이 쓰이기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλούσιος σφόδρα
  english_pob_choice: exceedingly rich
  chosen_korean: 매우 부유하였으며
  alternatives_korean:
  - 극도로 부유하였으며
  - 대단히 부유하였으며
  lexicon: BDAG
  rationale: πλούσιος의 기본 의미인 ‘부유하다’에 σφόδρα의 강한 강조를 자연스러운 현대 한국어 부사로 옮겼습니다.
- source_word: παράδεισος
  english_pob_choice: garden
  chosen_korean: 정원
  alternatives_korean:
  - 공원
  - 과수원
  - 낙원
  lexicon: LSJ
  rationale: 문맥상 왕성한 부자의 주택에 딸린 조성된 부지이므로, 신학적 ‘낙원’이 아니라 가꾸어진 ‘정원’이 가장 무리 없습니다.
- source_word: γειτνιῶν τῷ οἴκῳ αὐτοῦ
  english_pob_choice: adjoining his house
  chosen_korean: 그의 집에 붙어 있는
  alternatives_korean:
  - 그의 집과 이웃한
  - 그의 집 옆에 있는
  lexicon: LSJ
  rationale: γειτνιῶν은 단순한 근접이 아니라 맞닿아 있는 관계를 나타내므로, ‘붙어 있는’으로 구체성을 살렸습니다.
- source_word: ἐνδοξότερον πάντων
  english_pob_choice: more honored than all of them
  chosen_korean: 그들 모두보다 더 존중받는 사람이었기 때문에
  alternatives_korean:
  - 그들 모두보다 더 명망이 높았기 때문에
  - 그들 모두보다 더 유명했기 때문에
  lexicon: BDAG
  rationale: 이 표현은 도덕적 우월성보다 사회적 평판과 존중을 가리키므로, ‘존중받는’으로 옮겨 이유절의 기능을 살렸습니다.
theological_decisions:
- issue: οἱ Ἰουδαῖοι의 집단 지칭
  chosen_reading: ‘유대인들’로 옮겨 공동체적 집단을 가리키되, 지리적 의미로 축소하지 않았습니다.
  alternative_readings:
  - 유대 사람들
  - 유대 지역 사람들
  rationale: 이 장르의 서술에서는 민족/종교 공동체를 가리키는 일반적 용법이 자연스럽고, 이 절만으로 지리적 한정은 강하지 않습니다.
  doctrine_reference: 집단 명칭은 본문 용례에 따라 번역하고, 불필요한 역사적 재구성을 피합니다.
