base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/055.yaml
  text: Then Daniel said[a], “You have lied rightly against your own head; for already an angel of God, having received a sentence from God[b], will split you in two.”
  footnotes:
  - marker: a
    text: 'Or “You have lied well/rightly against your own head.” The wording is likely ironic: the false testimony has brought judgment back on the speaker himself.'
    reason: lexical_alternative
  - marker: b
    text: Or “having received a decision/order from God.” The Greek term can denote a spoken declaration or judicial pronouncement; here the judicial sense fits the context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 다니엘이 말했습니다. 「당신은 자기 자신의 머리 위로 제대로[a] 거짓말을 했습니다. 이미 하나님의 한 천사가 하나님에게서 선고[b]를 받아 당신을 둘로 가를 것입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘제대로’는 여기서 칭찬이 아니라 아이러니입니다. 그 거짓말이 말한 사람 자신에게 심판으로 되돌아왔다는 뜻을 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘선고’는 헬라어 φάσις를 사법적 선언으로 이해한 번역입니다. ‘결정’ 또는 ‘명령’으로도 옮길 수 있으나, 이 문맥에서는 심판의 선언이라는 뜻이 잘 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀρθῶς ἔψευσαι
  english_pob_choice: You have lied rightly / correctly
  chosen_korean: 제대로 거짓말을 했습니다
  alternatives_korean:
  - 옳게 거짓말을 했습니다
  - 정확히 거짓말을 했습니다
  - 올바르게 거짓말을 했습니다
  lexicon: LSJ
  rationale: Ὀρθῶς의 역설적 뉘앙스를 살리되, 한국어에서는 ‘제대로’가 어색한 칭찬이 아니라 판결이 되돌아온 아이러니를 가장 자연스럽게 드러냅니다.
- source_word: εἰς τὴν σεαυτοῦ κεφαλήν
  english_pob_choice: against your own head
  chosen_korean: 자기 머리 위에 대하여
  alternatives_korean:
  - 자기 머리 위에
  - 자기 머리에
  - 자기 머리 위로
  lexicon: LSJ
  rationale: 직역하면 ‘자기 머리 위에’지만, 한국어에서는 ‘대하여’를 보태어 스스로에게 돌아오는 화를 뜻하는 관용적 힘을 살렸습니다.
- source_word: λαβὼν φάσιν
  english_pob_choice: having received a sentence
  chosen_korean: 받은 선고를 가지고
  alternatives_korean:
  - 결정을 받은
  - 명령을 받은
  - 판결을 받은
  lexicon: LSJ
  rationale: φάσις는 문맥상 단순한 말이 아니라 사법적 선언을 가리키므로 ‘선고’가 가장 적절하며, 현재분사 뉘앙스를 ‘가지고’로 연결했습니다.
- source_word: ἄγγελος τοῦ θεοῦ
  english_pob_choice: an angel of God
  chosen_korean: 하나님의 천사
  alternatives_korean:
  - 하나님의 사자
  - 하나님의 천사
  - 천사 하나
  lexicon: LSJ
  rationale: 무관사 표현이지만 한국어에서는 자연스럽게 ‘하나님의 천사’로 옮겨, 하나님께 속한 집행 주체라는 점을 분명히 했습니다.
- source_word: σχίσει σε μέσον
  english_pob_choice: will split you in two
  chosen_korean: 당신을 둘로 가를 것입니다
  alternatives_korean:
  - 당신을 둘로 쪼갤 것입니다
  - 당신을 가운데서 가를 것입니다
  - 당신을 반으로 가를 것입니다
  lexicon: LSJ
  rationale: σχίζω와 μέσον의 폭력적 이미지를 과장 없이 전달하기 위해 ‘둘로 가르다’를 택했습니다.
theological_decisions:
- issue: 천사의 역할을 추상화하지 않을 것인가
  chosen_reading: 하나님의 천사가 하나님으로부터 받은 선고를 집행하는 구체적 행위자로 보존했습니다.
  alternative_readings:
  - 단지 하나님의 심판이 임한다는 식의 추상적 표현
  - 천사는 언급하되 집행의 구체성을 약화하는 표현
  rationale: 헬라어는 ‘하나님의 천사’와 ‘하나님으로부터 받은 φάσις’를 함께 제시하므로, 본문이 말하는 실제적 심판 집행의 긴장을 흐리지 않는 것이 중요합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
