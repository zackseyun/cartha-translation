translation:
  language: ko
  text: 한 남자가 바빌론에 살고 있었는데, 그의 이름은 요아킴이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 Ἰωακείμ입니다. 여기서는 이를 더 직접적으로 반영하여 ‘요아킴’으로 음역했습니다.
    reason: korean_style_note
