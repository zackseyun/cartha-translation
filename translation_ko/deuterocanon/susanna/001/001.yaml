- source_word: ὄνομα αὐτῷ Ἰωακείμ
  english_pob_choice: his name was Joakim
  chosen_korean: 그의 이름은 요아킴이었습니다
  alternatives_korean:
  - 그 이름은 요아킴이었습니다
