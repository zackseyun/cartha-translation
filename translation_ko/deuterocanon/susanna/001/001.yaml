  - 한 남자가 거주하고 있었는데
  lexicon: BDAG
  rationale: ‘ἀνήρ’는 이 문맥에서 성인 남성을 소개하는 표현이므로 ‘남자’로, παρουσία 구문은 한국어 서술 관용에 맞게 ‘있었는데’로 처리했습니다.
- source_word: ἐν Βαβυλῶνι
  english_pob_choice: in Babylon
  chosen_korean: 바빌론에
  alternatives_korean:
