translation:
  language: ko
  text: 이제 바빌론에 사는 한 남자가 있었는데, 그의 이름은 요아킴이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통 한글 성서에서는 ‘요아킴/요아힘’의 표기가 갈릴 수 있으나, 여기서는 그리스어 Ἰωακείμ을 더 직접적으로 반영했습니다.
    reason: korean_style_note
lexical_decisions:
- source_word: ΚΑΙ
  english_pob_choice: Now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고
  - 그때
  lexicon: LSJ
  rationale: 문장 첫 καί의 서술 진입 기능을 한국어 서술 시작어 ‘이제’로 자연스럽게 옮겨, 단순 접속 이상의 이야기 시작감을 살렸습니다.
- source_word: ἦν ἀνὴρ οἰκῶν
