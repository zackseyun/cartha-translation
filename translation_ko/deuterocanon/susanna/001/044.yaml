  alternative_readings:
  - 응답하셨습니다
  - 그녀의 기도에 귀 기울이셨습니다
  rationale: 그리스어는 단지 ‘들었다’고 말하며 응답의 방식은 아직 밝히지 않으므로, 서술의 절제를 보존했습니다.
