  rationale: φωνή는 문자적으로 ‘음성/목소리’를 뜻하므로, 탄원 뉘앙스를 과도하게 해석하는 ‘외침’보다 본문 표면에 가까운 ‘음성’을 택했습니다.
theological_decisions:
- issue: 하나님이 그녀의 기도를 ‘들으셨다’는 표현의 범위
