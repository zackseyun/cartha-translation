review_pass:
  verdict: revise
  source_fidelity: 명령형 ἀναστρέψατε와 재판 맥락의 κριτήριον은 대체로 반영되었으나, ‘소송 자리’는 소송(특히 민사 소송)을 연상시켜 법정적 심판 장소라는 뜻에 비해 좁고 어색합니다. 또한 ‘그녀에게 거짓 증언을’은 한국어에서 증언의 불리한 대상이라는 관계가 충분히 자연스럽거나 명확하지 않습니다.
  naturalness: ‘법정으로 돌아가십시오’가 현대 표준 한국어에서 간결하고 자연스럽습니다. ‘그 여인에게 불리한 거짓 증언을 하였습니다’는 법적 맥락과 대항적 의미를 명료하게 전달합니다.
  terminology: κριτήριον은 ‘법정’, κατεμαρτύρησαν αὐτῆς는 ‘그 여인에게 불리한 … 증언을 하였습니다’로 옮겨 재판 및 불리한 증언의 의미를 유지했습니다. ‘그 여인’은 선행 문맥의 여성 지시 대상을 존중하면서 현대 서사 문체에도 적합합니다.
  issues:
  - severity: medium
    issue: ‘소송 자리’
    rationale: κρίτήριον은 재판·심판의 장소 또는 법정이며, ‘소송’은 현대 한국어에서 특정 법적 절차, 흔히 민사 절차를 뜻할 수 있습니다. ‘법정’이 더 정확하고 자연스럽습니다.
  - severity: medium
    issue: ‘그녀에게 거짓 증언을 하였습니다’
    rationale: καταμαρτυρέω의 속격은 그 여인을 상대로 한 불리한 증언을 나타냅니다. ‘그녀에게’는 한국어에서 수혜자·상대방으로도 읽혀 관계가 부자연스럽습니다. ‘그 여인에게 불리한’이 법적 방향성을 분명히 합니다.
  revised_text: 법정으로 돌아가십시오. 이 사람들이 그 여인에게 불리한 거짓 증언을 하였기 때문입니다.
