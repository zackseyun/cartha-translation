  text: And the whole assembly cried out with a loud voice[a], and they blessed God, who saves those who hope in him.
  footnotes:
  - marker: a
    text: Or 'those who trust in him.' The Greek verb more literally refers to hoping, but in biblical usage it can overlap with trusting reliance on God.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 온 회중이 큰 소리로 외치고, 하나님께서 그분을 바라는 이들을 구원하시는 분이심을 찬송했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 ἐλπίζω는 기본적으로 ‘바라다/소망하다’를 뜻하지만, 성경적 문맥에서는 ‘신뢰하다’의 의미와 겹칠 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ἡ συναγωγή
  english_pob_choice: the whole assembly
  chosen_korean: 온 회중
  alternatives_korean:
  - 온 모임
  - 온 공동체
  lexicon: LSJ
  rationale: 이 문맥의 συναγωγή는 후대 제도명칭이 아니라 모인 무리를 가리키므로, 집합성을 살리는 ‘회중’이 가장 자연스럽습니다.
- source_word: ἀνεβόησεν ... φωνῇ μεγάλῃ
  english_pob_choice: cried out with a loud voice
  chosen_korean: 큰 소리로 외치고
  alternatives_korean:
  - 크게 소리치고
  - 큰 음성으로 외치고
  lexicon: LSJ
  rationale: 그리스어의 강한 외침을 현대 한국어로 자연스럽게 옮기되, ‘큰 소리로’로 음성의 크기를 분명히 보존했습니다.
- source_word: εὐλόγησαν τῷ θεῷ
  english_pob_choice: they blessed God
  chosen_korean: 하나님께서 ... 찬송했습니다
  alternatives_korean:
  - 하나님을 축복했습니다
  - 하나님을 찬양했습니다
  lexicon: LSJ
  rationale: ‘bless God’의 직역은 한국어에서 어색하므로, 하나님을 높여 말하는 성경적 용례를 살려 ‘찬송하다’로 옮겼습니다.
- source_word: τῷ σώζοντι τοὺς ἐλπίζοντας ἐπ’ αὐτόν
  english_pob_choice: who saves those who hope in him
  chosen_korean: 그분을 바라는 이들을 구원하시는 분
  alternatives_korean:
  - 그분께 소망을 두는 이들을 구원하시는 분
  - 그분을 신뢰하는 이들을 구원하시는 분
  lexicon: LSJ
  rationale: ἐλπίζω의 기본값인 ‘hope’를 따라 ‘바라다’로 살리면서, 구원하시는 분에 대한 수식 구조를 한국어 관용에 맞게 정리했습니다.
theological_decisions:
- issue: ἐλπίζοντας의 ‘hope’와 ‘trust’ 뉘앙스
  chosen_reading: ‘바라는 이들’로 번역해 희망의 어휘를 유지했습니다.
  alternative_readings:
  - ‘신뢰하는 이들’
  - ‘소망을 두는 이들’
  rationale: 본문은 신뢰어가 아니라 희망어를 사용하므로, 주된 의미를 ‘바라다’로 유지하되 신뢰의 함의는 문맥상 함께 전달되도록 했습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: εὐλόγησαν τῷ θεῷ의 한국어 관용
  chosen_reading: 하나님을 향한 응답을 ‘찬송했습니다’로 자연스럽게 풀었습니다.
  alternative_readings:
  - ‘하나님을 축복했습니다’
  - ‘하나님을 찬양했습니다’
  rationale: 인간이 하나님을 ‘축복하다’는 성경적 표현은 가능하지만 한국어에서는 오해 소지가 있어, 원문의 찬양 행위를 분명히 드러내는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §1, §5
