lexical_decisions:
- source_word: σφόδρα
  english_pob_choice: greatly
  chosen_korean: 매우
  alternatives_korean:
  - 크게
  - 지극히
  lexicon: LSJ
  rationale: 앞절의 서술을 강하게 강조하는 부사이므로, 자연스러운 현대 한국어로는 ‘매우’가 가장 간결하고 과장 없이 힘을 살립니다.
- source_word: φοβουμένη τὸν κύριον
  english_pob_choice: fearing the Lord
  chosen_korean: 주님을 경외하였고
  alternatives_korean:
  - 주님을 두려워하였고
  - 주님을 무서워하였고
  - 주님을 경외하며
  lexicon: BDAG
  rationale: φοβέομαι는 단순 공포보다 하나님에 대한 경외를 포함하므로, 한국어에서는 ‘경외하다’가 문맥상 가장 정확합니다.
- source_word: δίκαιοι
  english_pob_choice: righteous
  chosen_korean: 의로운 사람들이었으며
  alternatives_korean:
  - 의인들이었으며
  - 올바른 사람들이었으며
  - 정의로운 사람들이었으며
  lexicon: BDAG
  rationale: 부모의 도덕적·종교적 성품을 묘사하므로 ‘의로운’이 성경적 의미를 가장 잘 보존합니다.
- source_word: κατὰ τὸν νόμον Μωυσῆ
  english_pob_choice: according to the law of Moses
  chosen_korean: 모세의 율법에 따라
  alternatives_korean:
  - 모세의 율법대로
  - 모세의 율법을 따라
  - 모세의 법에 따라
  lexicon: BDAG
  rationale: κατά + 대격은 기준/준거를 나타내므로, 한국어에서는 ‘~에 따라’가 가장 직역적이면서도 자연스럽습니다.
theological_decisions:
- issue: τὸν κύριον의 한국어 경칭과 경외 표현
  chosen_reading: ‘주님을 경외하였고’로 번역해, 단순 감정 공포가 아니라 신앙적 경외를 드러냈습니다.
  alternative_readings:
  - ‘주님을 두려워하였고’
  - ‘주님을 무서워하였고’
  rationale: 그리스어 participle φοβουμένη는 하나님을 향한 경외를 뜻하는 경우가 많아, 한국어 신앙 문체에서 ‘경외하다’가 의미를 더 정확히 전달합니다.
  doctrine_reference: BDAG φοβέομαι; POB glossary κύριος → 주님
