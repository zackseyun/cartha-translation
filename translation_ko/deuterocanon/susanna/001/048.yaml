  rationale: 원문은 공개석상에서의 날카로운 반문입니다. 이를 완화하면 재판적 불의에 대한 책망이 약해집니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: 성별 표지 보존
  chosen_reading: ‘이스라엘의 아들들아 / 이스라엘의 딸’의 대조를 유지했습니다.
  alternative_readings:
  - ‘이스라엘 사람들아 / 이스라엘 여인’으로 중성화하기
  rationale: 본문의 수사적 대조는 공동체 전체를 향한 책망과 수산나의 특정한 위치를 함께 드러냅니다. 이를 중성화하면 원문의 강조가 약해집니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
