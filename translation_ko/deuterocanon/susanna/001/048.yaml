  rationale: 원문의 남성 복수 호칭을 유지해 수사적 대조를 보존했습니다. '이스라엘 사람들'은 성별 표지를 약화시키므로 채택하지 않았습니다.
- source_word: ἀνακρίναντες
  english_pob_choice: examining the matter
  chosen_korean: 사건을 조사하지도 않고
  alternatives_korean:
