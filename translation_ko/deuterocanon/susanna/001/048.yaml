  rationale: 직설적 책망의 강도를 살리되, 한국어에서 자연스러운 질책 표현으로 옮겼습니다. 영어 POB의 'fools'와 'foolish'의 긴장을 반영해 명사적 호칭과 형용사적 의미를 함께 담았습니다.
- source_word: οἱ υἱοὶ Ἰσραήλ
  english_pob_choice: sons of Israel
  chosen_korean: 이스라엘의 아들들아
  alternatives_korean:
