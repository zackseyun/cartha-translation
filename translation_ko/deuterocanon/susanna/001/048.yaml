  lexicon: LSJ
  rationale: 원문의 여성 단수 표지를 살려 Susanna를 covenant people의 한 딸로 지칭하는 대비를 유지했습니다.
theological_decisions:
- issue: 수사적 책망의 강도
  chosen_reading: 질문 형식의 공개적 질책으로 처리해, 무분별한 정죄를 꾸짖는 법정적 긴장을 살렸습니다.
  alternative_readings:
  - 단순한 설명문으로 완화하기
