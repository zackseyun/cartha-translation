base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/048.yaml
  text: But he stood in their midst and said[a], “Are you such fools, sons of Israel? Without examining the matter or even learning the facts clearly[b], have you condemned a daughter of Israel?”
  footnotes:
  - marker: a
    text: Or “Are you so foolish, sons of Israel?” The Greek rebuke Οὕτως μωροί can be rendered either with the noun “fools” or the adjective “foolish.”
    reason: lexical_alternative
  - marker: b
    text: Or “without investigating and without ascertaining the plain facts.” The Greek wording is judicial in tone, stressing failure to examine the case properly before condemning Susanna.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그는 그들 가운데에 서서 말했습니다. 「이런 어리석은 사람들아, 이스라엘의 아들들아! 사건을 조사하지도 않고, 또 분명한 사실을 알아내지도 않은 채 이스라엘의 딸을 정죄하였습니까?」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “이런 어리석은 사람들아” 또는 “너희는 참으로 어리석구나”입니다. 원문의 Οὕτως μωροί는 명사적 책망과 형용사적 책망의 성격을 함께 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “사건을 조사하지도 않고, 분명한 사실을 확인하지도 않은 채”입니다. 원문은 판결 전에 제대로 심리하지 않았다는 법정적 어감을 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: στὰς ἐν μέσῳ αὐτῶν
  english_pob_choice: he stood in their midst
  chosen_korean: 그들 가운데에 서서
  alternatives_korean:
  - 그들 한가운데에 서서
  - 그들 사이에 서서
  lexicon: LSJ
  rationale: 행동의 구체성과 공개적 대면의 뉘앙스를 살리면서, 현대 한국어에서 자연스럽고 간결하게 옮겼습니다.
- source_word: Οὕτως μωροί
  english_pob_choice: Are you such fools
  chosen_korean: 이런 어리석은 사람들아
  alternatives_korean:
  - 너희는 참으로 어리석구나
  - 너희 같은 어리석은 자들아
  lexicon: LSJ
  rationale: 직설적 책망의 강도를 살리되, 한국어에서 자연스러운 질책 표현으로 옮겼습니다. 영어 POB의 'fools'와 'foolish'의 긴장을 반영해 명사적 호칭과 형용사적 의미를 함께 담았습니다.
- source_word: οἱ υἱοὶ Ἰσραήλ
  english_pob_choice: sons of Israel
  chosen_korean: 이스라엘의 아들들아
  alternatives_korean:
  - 이스라엘 사람들아
  - 이스라엘의 자손들아
  lexicon: LSJ
  rationale: 원문의 남성 복수 호칭을 유지해 수사적 대조를 보존했습니다. '이스라엘 사람들'은 성별 표지를 약화시키므로 채택하지 않았습니다.
- source_word: ἀνακρίναντες
  english_pob_choice: examining the matter
  chosen_korean: 사건을 조사하지도 않고
  alternatives_korean:
  - 문제를 심문하지도 않고
  - 사실을 심사하지도 않고
  lexicon: LSJ
  rationale: 법정적·심문적 어감이 있는 동사를 한국어의 '조사하다'로 옮겨 재판 맥락을 분명히 했습니다.
- source_word: τὸ σαφὲς ἐπιγνόντες
  english_pob_choice: learning the facts clearly
  chosen_korean: 분명한 사실을 알아내지도 않은 채
  alternatives_korean:
  - 명백한 사실을 확인하지도 않고
  - 분명한 진실을 깨닫지도 않고
  lexicon: LSJ
  rationale: σαφές의 '분명함'과 ἐπιγινώσκω의 '확인하여 알아냄'을 함께 반영해, 충분한 사실 확인 실패라는 의미를 드러냈습니다.
- source_word: θυγατέρα Ἰσραήλ
  english_pob_choice: a daughter of Israel
  chosen_korean: 이스라엘의 딸을
  alternatives_korean:
  - 이스라엘의 여인을
  - 이스라엘 딸을
  lexicon: LSJ
  rationale: 원문의 여성 단수 표지를 살려 Susanna를 covenant people의 한 딸로 지칭하는 대비를 유지했습니다.
theological_decisions:
- issue: 수사적 책망의 강도
  chosen_reading: 질문 형식의 공개적 질책으로 처리해, 무분별한 정죄를 꾸짖는 법정적 긴장을 살렸습니다.
  alternative_readings:
  - 단순한 설명문으로 완화하기
  - 더 완곡한 경고문으로 바꾸기
  rationale: 원문은 공개석상에서의 날카로운 반문입니다. 이를 완화하면 재판적 불의에 대한 책망이 약해집니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: 성별 표지 보존
  chosen_reading: ‘이스라엘의 아들들아 / 이스라엘의 딸’의 대조를 유지했습니다.
  alternative_readings:
  - ‘이스라엘 사람들아 / 이스라엘 여인’으로 중성화하기
  rationale: 본문의 수사적 대조는 공동체 전체를 향한 책망과 수산나의 특정한 위치를 함께 드러냅니다. 이를 중성화하면 원문의 강조가 약해집니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
