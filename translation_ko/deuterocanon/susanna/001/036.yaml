base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/036.yaml
  text: But the two elders said[a], “We were walking in the garden of her husband,”
  footnotes:
  - marker: a
    text: Greek παράδεισος can also denote an orchard or enclosed park; here it refers to the private garden attached to her husband's household.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 그 두 장로가 말했습니다. “우리는 그녀의 남편이 소유한 정원[a]에서 걷고 있었습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 παράδεισος는 과수원이나 울타리로 둘러싸인 뜰을 뜻할 수도 있습니다. 여기서는 그녀의 남편 집에 딸린 사적인 정원을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ δύο πρεσβύτεροι
  english_pob_choice: But the two elders
  chosen_korean: 그런데 그 두 장로가
  alternatives_korean:
  - 그리고 그 두 장로가
  - 그 두 원로가
  lexicon: BDAG
  rationale: πρεσβύτεροι는 단순한 연장자가 아니라 공동체 안에서 권위를 지닌 장로를 가리키므로 ‘장로’가 적절합니다. δέ는 서술 전환을 표시하는 ‘그런데’로 옮겼습니다.
- source_word: εἶπαν
  english_pob_choice: said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 대답했습니다
  - 선언했습니다
  lexicon: BDAG
  rationale: 직접화법 도입의 평이한 동사이므로, 문맥에 가장 자연스럽고 과도한 해석이 없는 ‘말했습니다’로 옮겼습니다.
- source_word: περιεπατοῦμεν
  english_pob_choice: were walking
  chosen_korean: 거닐고 있었습니다
  alternatives_korean:
  - 걷고 있었습니다
  - 산책하고 있었습니다
  lexicon: BDAG
  rationale: 미완료 과거의 지속성을 살리면서도, 수상한 정황 속에서 드러나는 행동의 흐름을 자연스럽게 전달하기 위해 ‘거닐고 있었습니다’를 택했습니다.
- source_word: ἐν τῷ παραδείσῳ
  english_pob_choice: in the garden
  chosen_korean: 정원에서
  alternatives_korean:
  - 과수원에서
  - 울타리 친 뜰에서
  lexicon: BDAG
  rationale: παράδεισος는 이 본문에서 부유한 가정에 딸린 폐쇄된 정원/과수원을 뜻하므로, 자연스럽고 오해가 적은 ‘정원’으로 옮겼습니다.
- source_word: τοῦ ἀνδρὸς αὐτῆς
  english_pob_choice: of her husband
  chosen_korean: 그녀의 남편의
  alternatives_korean:
  - 그녀의 남편에게 속한
  - 그녀의 남편인 사람의
  lexicon: BDAG
  rationale: ἀνήρ의 속격은 여기서 ‘남자’보다 ‘남편’을 뜻하므로, 소유 관계를 분명히 하는 ‘그녀의 남편의’로 옮겼습니다.
