  text: And no one was there except the two elders[a], hidden and watching her.
  footnotes:
  - marker: a
    text: Or 'spying on her.' The Greek verb can imply close, hostile, or furtive watching; the main text keeps the more literal 'watching her.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 거기에는 숨어서 그녀를 지켜보고 있던 두 장로 외에는 아무도 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀를 엿보고 있던’. 그리스어 동사는 가까이에서, 적대적으로, 또는 은밀하게 지켜보는 뜻을 띨 수 있습니다. 본문은 더 문자적인 ‘지켜보고 있던’을 따릅니다.
    reason: lexical_alternative
