  text: And they did as she said[a], and they shut the doors of the garden and went out by the side doors to bring what had been ordered for them, and they did not see the elders, because they were hidden.
  footnotes:
  - marker: a
    text: Greek παράδεισος here means an enclosed garden or park, not 'paradise' in the later theological sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그녀가 말한 대로 하고[a], 동산의 문들을 닫고, 옆문들로 나가 그들에게 지시된 것들을 가져오러 갔습니다. 그들은 장로들을 보지 못했는데, 장로들이 숨어 있었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 παράδεισος는 여기서 후대의 신학적 의미인 ‘낙원’이 아니라 울타리로 둘러싸인 동산이나 공원을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐποίησαν καθὼς εἶπεν
  english_pob_choice: And they did as she said
  chosen_korean: 그들은 그녀가 말한 대로 했고
  alternatives_korean:
  - 그들은 그녀가 말한 그대로 행했고
  - 그들은 그녀가 시키는 대로 했고
  lexicon: BDAG
  rationale: ἐποίησαν의 단순한 행위를 자연스럽게 살리고, καθὼς εἶπεν의 순응 관계를 한국어 관용구로 옮겼습니다.
- source_word: τὰς θύρας τοῦ παραδείσου
  english_pob_choice: the doors of the garden
  chosen_korean: 동산의 문들을
  alternatives_korean:
  - 정원의 문들을
  - 낙원의 문들을
  lexicon: BDAG
  rationale: παράδεισος는 여기서 종말론적 ‘낙원’이 아니라 울타리 친 동산/정원을 가리키므로 ‘동산’으로 옮겼습니다.
- source_word: κατὰ τὰς πλαγίας θύρας
  english_pob_choice: by the side doors
  chosen_korean: 옆문으로
  alternatives_korean:
  - 옆문들을 통해
  - 측문으로
  lexicon: BDAG
  rationale: κατά + 대격의 경로 의미를 자연스럽게 반영하면서, 본문의 대조를 위해 ‘주문’이 아닌 보조 출입구라는 점을 살렸습니다.
- source_word: τὰ προστεταγμένα αὐταῖς
  english_pob_choice: what had been ordered for them
  chosen_korean: 자기들에게 맡겨진 것
  alternatives_korean:
  - 그들에게 명령된 것
  - 그들을 위해 지시된 것
  lexicon: BDAG
  rationale: 과거에 이미 내려진 지시를 담되, 한국어에서는 ‘가져오도록 맡겨진 것’이라는 기능적 의미가 가장 자연스럽습니다.
- source_word: τοὺς πρεσβυτέρους
  english_pob_choice: the elders
  chosen_korean: 장로들을
  alternatives_korean:
  - 늙은 사람들을
  - 노인들을
  lexicon: BDAG
  rationale: Susanna의 법정적 서사 맥락에서 단순한 연령보다 사회적 직분/지위를 드러내는 ‘장로들’이 적절합니다.
