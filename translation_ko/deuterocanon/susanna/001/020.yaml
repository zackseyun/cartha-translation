  rationale: 영어 POB 주석과 그리스어 문맥이 모두 물리적 정원을 가리키므로, 독자가 종말론적 의미로 오해하지 않도록 했습니다.
  doctrine_reference: 문맥 우선 원칙; 어휘 의미론
