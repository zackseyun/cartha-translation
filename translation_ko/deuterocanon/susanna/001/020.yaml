review_pass:
  verdict: revise
  source_fidelity: 초안은 전체 사건 순서와 핵심 어휘를 대체로 충실히 옮겼습니다. 그러나 ‘닫은 뒤’는 그리스어의 단순 병렬 접속을 시간적 선후 관계로 다소 강화하며, ‘자기들에게 맡겨진 것’은 προστεταγμένα(그들에게 지시된 것)의 지시·명령 의미를 ‘맡김’으로 바꿉니다. 또한 복수형 ‘옆문들’을 보존하는 편이 안전합니다.
  naturalness: 합쇼체 서술은 자연스럽습니다. 다만 ‘그들이 숨어 있었기 때문입니다’는 선행하는 ‘그들’(하녀들)과 장로들을 잠시 혼동시킬 수 있으므로 명사를 반복하는 편이 더 분명합니다. ‘가져오러 나갔습니다’는 목적 부정사 ἐνέγκαι를 자연스럽고 정확하게 반영합니다.
  terminology: ‘동산’, ‘장로들’은 문맥과 사회적 역할을 잘 반영합니다. παράδεισος가 후대 신학적 의미의 ‘낙원’이 아니라 물리적 장소라는 주석도 적절합니다.
  issues:
  - severity: low
    issue: ‘닫은 뒤’가 접속 관계를 시간적 선후로 강화합니다.
    rationale: καὶ ἀπέκλεισαν은 앞뒤 동작과 병렬로 연결될 뿐, ‘뒤’라는 명시적 시간 관계를 요구하지 않습니다.
  - severity: medium
    issue: ‘자기들에게 맡겨진 것’이 προστεταγμένα의 의미를 약화·변경합니다.
    rationale: προστάσσω의 완료 수동 분사는 그들에게 이전에 내려진 지시 또는 명령을 가리킵니다. ‘맡겨진’은 위탁받은 물건이라는 뜻을 불필요하게 덧붙입니다.
  - severity: low
    issue: ‘옆문으로’가 그리스어 복수형 θύρας를 단수화합니다.
    rationale: 한국어에서 집합 단수도 가능하지만, 이 절에서는 동산의 문들 및 옆문들이 모두 복수이므로 복수를 보존할 수 있습니다.
  - severity: low
    issue: 마지막 ‘그들이’의 지시 대상이 잠시 모호합니다.
    rationale: 직전 절의 주어도 ‘그들’이므로, 숨은 이들이 장로들임을 명시하면 한국어 문장이 더 명료합니다.
  revised_text: 그들은 그녀가 말한 대로 하고[a], 동산의 문들을 닫고, 옆문들로 나가 그들에게 지시된 것들을 가져오러 갔습니다. 그들은 장로들을 보지 못했는데, 장로들이 숨어 있었기 때문입니다.
