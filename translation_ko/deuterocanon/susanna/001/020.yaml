- from: 그들은 그녀가 말한 대로 했고[a], 동산의 문들을 닫은 뒤 옆문으로 나가서 자기들에게 맡겨진 것을 가져왔습니다. 그러나 그들은 장로들을 보지 못했는데, 그들이 숨어 있었기 때문입니다.
  to: 그들은 그녀가 말한 대로 하고[a], 동산의 문들을 닫고, 옆문들로 나가 그들에게 지시된 것들을 가져오러 갔습니다. 그들은 장로들을 보지 못했는데, 장로들이 숨어 있었기 때문입니다.
