  yaml_path: translation/deuterocanon/susanna/001/061.yaml
  text: And they rose up against the two elders, because Daniel had convicted them from their own mouth of being false witnesses, and they did to them as they had maliciously planned to do.
  footnotes:
  - marker: a
    text: Or 'had exposed them from their own testimony as false witnesses.'
    reason: lexical_alternative
  - marker: b
    text: 'The final clause expresses retaliatory justice: the elders received the penalty they had wickedly intended for Susanna.'
    reason: cross_reference
translation:
  language: ko
  text: 그들은 두 장로에게 맞섰습니다. 다니엘이 그들을 자기 입으로 거짓 증인임을 입증했기 때문입니다. 그리고 그들은 자기들이 악하게 꾸민 그대로 그들에게 행했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들 자신의 증언으로 그들이 거짓 증인임을 드러냈기 때문입니다.’
    reason: alternative_reading
  - marker: b
    text: 마지막 절은 장로들이 악하게 의도한 벌이 그들에게 되돌아간 보복적 공의를 나타냅니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἀνέστησαν ἐπὶ τοὺς δύο πρεσβύτας
  english_pob_choice: rose up against the two elders
  chosen_korean: 두 장로에게 맞섰습니다
  alternatives_korean:
  - 두 장로를 향해 일어섰습니다
  - 두 장로에게 일어났습니다
  lexicon: LSJ
  rationale: ἐπί가 지닌 적대적 대항의 뜻을 살려, 단순한 기립이 아니라 공적·법정적 반전을 드러내는 표현으로 옮겼습니다.
- source_word: συνέστησεν αὐτοὺς ... ψευδομάρτυρας ὄντας
  english_pob_choice: had convicted them ... of being false witnesses
  chosen_korean: 그들을 ... 거짓 증인임을 입증했습니다
  alternatives_korean:
  - 그들을 ... 거짓 증인으로 드러냈습니다
  - 그들을 ... 거짓 증인임을 폭로했습니다
  lexicon: LSJ
  rationale: 법정 문맥에서 단순 폭로보다 유죄 입증의 뉘앙스가 강하므로 ‘입증했습니다’로 옮겼습니다.
- source_word: ἐκ τοῦ στόματος αὐτῶν
  english_pob_choice: from their own mouth
  chosen_korean: 자기 입으로
  alternatives_korean:
  - 그들의 입에서
  - 자기들의 증언으로
  lexicon: LSJ
  rationale: 원문의 관용적 법정 표현을 한국어 자연어로 압축해, 자기 말이 곧 유죄의 근거가 되었다는 뜻을 살렸습니다.
- source_word: ἐπονηρεύσαντο
  english_pob_choice: had maliciously planned to do
  chosen_korean: 자기들이 악하게 꾸민 그대로
  alternatives_korean:
  - 자기들이 악하게 계획한 그대로
  - 자기들이 사악하게 꾸민 바대로
  lexicon: LSJ
  rationale: 행위 이전의 악한 의도와 보복적 대응의 대응관계를 함께 드러내기 위해 ‘꾸민 그대로’로 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 보복적 공의 표현
  chosen_reading: 번역문이 장로들에게 그들이 악하게 꾸민 형벌이 그대로 되돌아갔음을 드러내도록 했습니다.
  alternative_readings:
  - 보다 직역하면 ‘그들에게 그들이 악하게 행한 방식대로 행했습니다’가 가능합니다.
  rationale: 문맥상 이는 무고한 이를 해치려 한 자들이 자신들이 의도한 벌을 받는 보복적 공의를 나타내므로, 의미를 분명히 드러내는 쪽을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
