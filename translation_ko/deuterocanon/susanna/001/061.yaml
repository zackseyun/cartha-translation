  source_fidelity: 수정안은 ἀνέστησαν ἐπὶ의 적대적·공적 대항, πρεσβύτας의 직분적 의미인 ‘장로’, 그리고 다니엘이 장로들 자신의 발언을 근거로 그들이 거짓 증인임을 입증한 법정 문맥을 보존합니다. 마지막 절도 장로들이 악하게 꾀한 대로 그들에게 시행되었다는 대응 관계를 유지합니다.
  naturalness: 초안의 ‘다니엘이 그들을 자기 입으로’는 ‘자기’가 다니엘을 가리키는 것으로 읽힐 수 있고, ‘그들’이 연속되어 지시 대상도 흐려집니다. ‘두 장로 자신의 말로’라고 명시하면 현대 표준 한국어에서 자연스럽고 법정 장면의 뜻도 분명해집니다. 또한 각주 표지를 해당 절에 붙여 참조 범위를 명확히 했습니다.
