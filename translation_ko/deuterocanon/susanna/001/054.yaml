  text: 이제, 네가 이것을 보았다면 말하십시오. 어느 나무 아래에서 그들이 서로 이야기하는 것을 보았습니까? 그가 대답했습니다. “피스타치오 나무 아래였습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: σχῖνος는 마스틱(mastic) 또는 렌티스크(lentisk) 나무를 가리킵니다.
