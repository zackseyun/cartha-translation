  text: And when we came near, we saw her; but the young man fled, being covered.
translation:
  language: ko
  text: 우리가 가까이 가서 그녀를 알아보았으나, 그 젊은이는 가려진 채 도망쳤습니다.
  philosophy: formal
lexical_decisions:
- source_word: ἐπέγνωμεν αὐτήν
  english_pob_choice: we saw her
  chosen_korean: 그녀를 알아보았으나
  alternatives_korean:
  - 그녀를 보았으나
  - 그녀를 알아차렸으나
  lexicon: ἐπιγινώσκω
  rationale: 문자적으로는 ‘알아보다/알아차리다’가 가능하지만, 이 문맥에서는 가까이 가서 그녀를 식별했다는 흐름을 살려 POB의 ‘we saw her’에 맞춰 자연스럽게 옮겼습니다.
- source_word: ὁ δὲ νεανίσκος
  english_pob_choice: the young man
  chosen_korean: 그 젊은이는
  alternatives_korean:
  - 그 청년은
  - 그 소년은
  lexicon: νεανίσκος
  rationale: νεανίσκος는 나이가 젊은 남자를 가리키므로 ‘젊은이’가 가장 무난하며, 지나치게 아동화하지 않기 위해 ‘소년’은 피했습니다.
- source_word: ἔφυγε συγκεκαλυμμένος
  english_pob_choice: fled, being covered
  chosen_korean: 가려진 채 도망쳤습니다
  alternatives_korean:
  - 가린 채 도망쳤습니다
  - 덮인 채 도망쳤습니다
  lexicon: συγκεκαλυμμένος
  rationale: 분사 συγκεκαλυμμένος의 수동적 상태를 살려 ‘가려진 채’로 옮겨, 단순히 무엇을 ‘가린’ 행위가 아니라 ‘가려진 상태’였음을 드러냈습니다.
theological_decisions:
- issue: 알아보았다/보았다의 의미 차이
  chosen_reading: 본문의 동사는 ‘식별하다/알아보다’ 뉘앙스를 가지지만, POB는 사건 전개를 간명하게 ‘보았다’로 정리했습니다. 한국어는 본문 의미를 유지하되 과도한 해석을 피하는 방향으로 ‘알아보았으나’로 처리했습니다.
  alternative_readings:
  - 그녀를 보았으나
  - 그녀를 알아차렸으나
  rationale: 지식의 획득보다 현장 식별을 강조하는 동사이므로, 단순 시각보다 약간 강한 인지를 나타내되 본문을 과장하지 않는 균형이 필요합니다.
  doctrine_reference: 서사 문맥의 인식 동사 해석
