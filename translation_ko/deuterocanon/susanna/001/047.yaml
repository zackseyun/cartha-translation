- from: 그때 모든 백성이 그에게 돌아서서 말했습니다. 「이 무슨 말씀이십니까? 당신이 하신 말씀이 무엇입니까?」[a]
  to: 그러자 온 백성이 그에게 돌아서서 말했습니다. “당신이 한 이 말[a]은 무슨 뜻입니까?”
  rationale: 그리스어의 단일 의문문 구조를 복원하고, λόγος와 λαλέω에 원문상 없는 존대 의미를 부여하지 않도록 ‘말’과 ‘한’으로 조정했습니다. ‘무슨 뜻입니까?’는 ‘이 말이 무엇인가’라는 한국어의 자연스러운 반문 표현으로, λόγος의 의미 범위는 각주에서 보존했습니다.
