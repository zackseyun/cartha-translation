translation:
  language: ko
  text: 그때 모든 백성이 그에게 돌아서서 말했습니다. 「이 무슨 말씀이십니까? 당신이 하신 말씀이 무엇입니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘말씀’은 여기서 λόγος의 가능한 뜻 가운데 하나입니다. ‘말/진술/사건’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέστρεψεν
  english_pob_choice: turned
  chosen_korean: 돌아서서
  alternatives_korean:
  - 돌아와서
  - 돌아섰습니다
  lexicon: BDAG
  rationale: ἀλλ᾽/δὲ와 함께 사람들의 시선과 반응이 다니엘 쪽으로 전환되는 장면이므로, 단순한 재도착보다 방향 전환을 드러내는 ‘돌아서서’가 가장 자연스럽습니다.
- source_word: πᾶς ὁ λαός
  english_pob_choice: all the people
  chosen_korean: 모든 백성
  alternatives_korean:
  - 온 백성
  - 모든 사람들
  lexicon: LEH
  rationale: 집합적으로 모인 군중 전체를 가리키므로 ‘모든 백성’이 총체성을 살리면서도 현대 한국어에서 자연스럽습니다.
- source_word: Τίς ὁ λόγος οὗτος
  english_pob_choice: What is this word
  chosen_korean: 이 무슨 말씀입니까
  alternatives_korean:
  - 이 무슨 말입니까
  - 이 무슨 말씀이십니까
  lexicon: BDAG
  rationale: λόγος는 여기서 ‘말/말씀/진술’ 범위를 가질 수 있어, 직전의 다니엘 발언을 가리키는 점을 살려 ‘말씀’으로 옮기되, 존대 의문형을 써서 공개적 응답의 공손함을 유지했습니다.
- source_word: λελάληκας
  english_pob_choice: you have spoken
  chosen_korean: 당신이 하신 말씀
  alternatives_korean:
  - 당신이 말씀하신 것
  - 당신이 말한 것
  lexicon: BDAG
  rationale: 완료형은 방금 한 발언이 현재 질문의 초점임을 드러내므로 ‘하신 말씀’으로 현재 관련성을 반영했습니다. 직역보다 자연스러운 한국어 질의문을 위해 재구성했습니다.
theological_decisions:
- issue: 공동체의 공개 반응을 나타내는 호칭과 존대 수준
  chosen_reading: ‘모든 백성’과 공손한 질문형을 사용해, 다니엘의 발언에 대한 공적 경청과 반응을 드러냈습니다.
  alternative_readings:
  - 평이한 ‘모든 사람’
  - 더 직설적인 반말형 질문
  rationale: 이 장면은 군중이 한 사람에게 일제히 답하는 공개적 대화이므로, 서술은 합쇼체를 유지하고 질문은 공손한 공개 응답의 뉘앙스를 살리는 편이 본문 기능에 부합합니다.
  doctrine_reference: 서술체/대화체 등록 일치 원칙
