  source_fidelity: 그리스어의 대조 구조와 ‘두려워하여 … 어울렸다’라는 완곡한 표현은 대체로 충실합니다. 다만 두 미완료 과거(ἐποιεῖτε, ὡμίλουν)가 시사하는 반복적 행위를 한국어 본문에서 더 분명히 드러내는 것이 좋습니다. 또한 각주가 설명하는 어휘인 ‘어울렸습니다’에 직접 붙어야 합니다.
  naturalness: ‘유다의 딸 한 사람’은 한국어에서 다소 부자연스럽고 원문의 대표적 단수를 필요 이상으로 개별화합니다. ‘유다의 딸은’이 자연스러우면서도 원문의 단수와 수사적 대조를 보존합니다. 각주의 ‘그들과’는 청자가 아닌 장로들을 가리키는 듯해 지시 대상도 바로잡아야 합니다.
  terminology: ‘이스라엘의 딸들’, ‘유다의 딸’, ‘불법’은 원문의 성서적·법적 도덕 어감을 적절히 보존합니다. ‘어울리다’는 ὡμίλουν을 성적으로 과도하게 특정하지 않는 안전한 번역입니다.
