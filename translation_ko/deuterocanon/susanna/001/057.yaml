  yaml_path: translation/deuterocanon/susanna/001/057.yaml
  text: This is how you acted toward the daughters of Israel[a], and they, out of fear, associated with you; but a daughter of Judah did not endure your lawlessness.
  footnotes:
  - marker: a
    text: Or 'kept company with you' or 'consorted with you.' The Greek says they associated with the elders because they were afraid; the coercive setting suggests more than ordinary social contact, but the wording itself is less explicit than a direct sexual verb.
    reason: lexical_alternative
translation:
  language: ko
  text: 이렇게 너희가 이스라엘의 딸들에게 행하였으니, 그들은 두려워하여 너희와 어울렸습니다. 그러나 유다의 딸 한 사람은 너희의 불법을 견디지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희와 함께 지냈습니다’, ‘너희와 교제했습니다’. 그리스어는 그들이 두려움 때문에 그들과 관계를 맺었다고만 말하며, 강요된 상황은 분명하지만 동사 자체는 직접적인 성적 표현보다 덜 노골적입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως ἐποιεῖτε
  english_pob_choice: This is how you acted
  chosen_korean: 이렇게 너희가 행하였으니
  alternatives_korean:
  - 이렇게 너희가 하였으니
  - 이와 같이 너희가 행하였으니
  - 너희가 이런 식으로 행하였으니
  lexicon: BDAG
  rationale: οὕτως의 방식·정도를 살려 ‘이렇게’로 옮기고, 반복적 행위를 드러내는 ἐποιεῖτε는 평서형 ‘행하였으니’로 자연스럽게 담았습니다.
- source_word: θυγατράσιν Ἰσραήλ
  english_pob_choice: the daughters of Israel
  chosen_korean: 이스라엘의 딸들
  alternatives_korean:
  - 이스라엘의 여자들
  - 이스라엘의 딸들에
  lexicon: LEH
  rationale: 직역에 가깝게 ‘딸들’을 유지해 뒤의 ‘유다의 딸’과의 대조를 보존했습니다.
- source_word: φοβούμεναι ὡμίλουν ὑμῖν
  english_pob_choice: out of fear, associated with you
  chosen_korean: 두려워하여 너희와 어울렸습니다
  alternatives_korean:
  - 두려워하여 너희와 함께 지냈습니다
  - 두려워하여 너희와 교제했습니다
  - 두려움 때문에 너희와 어울렸습니다
  lexicon: BDAG
  rationale: ὡμιλέω는 문맥상 강요된 관계를 암시하지만 직접적인 성적 동사는 아니므로, 영어 POB처럼 과도하게 구체화하지 않고 ‘어울렸습니다’로 완곡하게 옮겼습니다.
- source_word: τὴν ἀνομίαν ὑμῶν
  english_pob_choice: your lawlessness
  chosen_korean: 너희의 불법
  alternatives_korean:
  - 너희의 법lessness
  - 너희의 악행
  - 너희의 불의
  lexicon: BDAG
  rationale: ἀνομία의 법적·도덕적 무게를 살리되 한국어에서 자연스러운 법률·윤리 어감을 위해 ‘불법’을 택했습니다.
theological_decisions:
- issue: 대표적 단수 표현 ‘유다의 딸’
  chosen_reading: ‘유다의 딸 한 사람’으로 옮겨 단수성과 대표성을 함께 살렸습니다.
  alternative_readings:
  - ‘유다의 딸은’
  - ‘유다의 딸들 가운데 한 사람은’
  rationale: 그리스어 단수는 개별 인물을 가리키면서도 대표적 대비를 이루므로, 이를 한국어에서 과장하지 않고 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve source wording unless context requires expansion.'
- issue: φοβούμεναι의 원인 관계
  chosen_reading: ‘두려워하여’로 원인-결과를 분명히 했습니다.
  alternative_readings:
  - ‘두려워하면서’
  - ‘두려움 때문에’
  rationale: 분사구가 뒤 동사의 이유를 설명하므로, 한국어에서도 인과를 드러내는 것이 본문 의미를 가장 분명하게 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Maintain source-sense over word-for-word form when grammar differs.'
