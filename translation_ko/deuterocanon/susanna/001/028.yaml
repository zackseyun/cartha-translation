base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/028.yaml
  text: But the lawless men turned back[a], threatening among themselves and lying in wait so that they might put her to death. And when they came to the assembly of the city, they did not stay away[b], and all the sons of Israel who were there gathered together.
  footnotes:
  - marker: a
    text: 'Or, ''the Israelites.'' Greek: ''the sons of Israel.'''
    reason: lexical_alternative
  - marker: b
    text: The clause rendered 'they did not stay away' is difficult; the Greek likely indicates that they were present at the city assembly rather than absent from it.
    reason: textual_variant
translation:
  language: ko
  text: 그러나 법을 어기는 그 남자들은 돌아가서, 그들끼리 위협을 주고받으며 그녀를 죽이려고 숨어 기다렸습니다. 그들이 도시의 집회에 왔을 때, 그들은 자리를 비우지 않았고[b], 거기에 있던 모든 이스라엘의 아들들이 함께 모였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이스라엘 사람들.” 그리스어는 “이스라엘의 아들들”이라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절의 표현은 어렵습니다. 그리스어는 그들이 도시의 집회에 실제로 참석했다는 뜻일 가능성이 큽니다.
    reason: textual_variant
lexical_decisions:
- source_word: παράνομοι
  english_pob_choice: lawless
  chosen_korean: 불법한
  alternatives_korean:
  - 법 없는
  - 악한
  lexicon: BDAG
  rationale: ἄνδρες를 수식하는 παράνομοι의 법-위반 성격을 살리기 위해 ‘불법한’을 택했습니다. ‘악한’은 도덕적 평가는 전하지만 법적 뉘앙스가 약합니다.
- source_word: ἀπέστρεψαν
  english_pob_choice: turned back
  chosen_korean: 돌아서서
  alternatives_korean:
  - 되돌아가서
  - 돌아가
  lexicon: BDAG
  rationale: 서사 흐름상 단순한 방향 전환을 나타내므로 과도한 해석 없이 ‘돌아서서’로 옮겼습니다.
- source_word: ἀπειλοῦντες ἐν ἑαυτοῖς
  english_pob_choice: threatening among themselves
  chosen_korean: 서로를 협박하며
  alternatives_korean:
  - 서로 위협하며
  - 속으로 협박하며
  lexicon: BDAG
  rationale: 문맥상 공개적 발언이 아니라 내부의 공모와 위협을 가리키므로, 상호 행위를 드러내는 ‘서로를 협박하며’로 자연스럽게 옮겼습니다.
- source_word: ἐνεδρεύοντες
  english_pob_choice: lying in wait
  chosen_korean: 숨어 지켜보고 있었습니다
  alternatives_korean:
  - 매복하고 있었습니다
  - 기다리고 있었습니다
  lexicon: BDAG
  rationale: 살해 의도를 가진 은밀한 매복의 뉘앙스를 살리되, 한국어에서 지나치게 군사적으로 들릴 수 있는 표현은 피했습니다.
theological_decisions:
- issue: οὐ παρῴκουν의 난해한 의미
  chosen_reading: 그들은 자리를 비우지 않았고
  alternative_readings:
  - 그들은 결석하지 않았고
  - 그들은 머물러 있었습니다
  rationale: POB의 ‘they did not stay away’에 따라, 도시 회중에 실제로 참석했다는 뜻을 살려 ‘자리를 비우지 않았다’로 옮겼습니다. 이는 본문이 그들의 현장 참여를 강조하는 흐름과 맞습니다.
  doctrine_reference: 본문 비평/번역 판단
- issue: οἱ υἱοὶ Ἰσραήλ의 성중립화 여부
  chosen_reading: 이스라엘의 아들들
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘인들
  rationale: 그리스어의 남성 친족 표현을 그대로 유지해 원문 idiom을 보존했습니다. 본문은 특정 집단 지칭의 형식을 지우지 않는 것이 더 정확합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
