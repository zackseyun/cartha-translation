revisions:
- from: 그런데 그 불법한 남자들은 돌아서서, 서로를 협박하며, 그녀를 죽이려고 숨어 지켜보고 있었습니다. 그리고 그들이 도시의 회중에 이르렀을 때, 그들은 자리를 비우지 않았고, 거기에 있던 모든 이스라엘의 아들들이 함께 모였습니다.[a][b]
  to: 그러나 법을 어기는 그 남자들은 돌아가서, 그들끼리 위협을 주고받으며 그녀를 죽이려고 숨어 기다렸습니다. 그들이 도시의 집회에 왔을 때, 그들은 자리를 비우지 않았고[b], 거기에 있던 모든 이스라엘의 아들들이 함께 모였습니다.[a]
  rationale: 'The revision improves modern formal Korean and more closely reflects the Greek: it avoids an unwarranted directly reciprocal object for the threatening phrase, restores the concealed waiting/ambush nuance, renders the civic συναγωγή as “집회,” and moves each note marker to the clause it explains. The difficult οὐ παρῴκουν remains conservatively rendered and explicitly noted.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:27:10Z'
review_pass:
  verdict: revise
  source_fidelity: The draft generally follows the Greek sequence and retains the difficult clause οὐ παρῴκουν with an explanatory note. However, “서로를 협박하며” implies that the men threatened one another directly, whereas ἐν ἑαυτοῖς is better left as internal/shared plotting. “숨어 지켜보고 있었습니다” weakens ἐνεδρεύοντες (“lying in wait/ambushing”) and introduces an imperfect ongoing perspective not expressed by the Greek.
  naturalness: “불법한 남자들” is awkward in contemporary formal Korean, and “도시의 회중” can misleadingly suggest an ecclesial congregation. “법을 어기는 남자들” and “도시의 집회” are more natural while preserving the legal and civic senses. The footnote markers should be placed at their respective anchors, not both at the end of the verse.
  terminology: “이스라엘의 아들들” appropriately preserves οἱ υἱοὶ Ἰσραήλ; its lexical alternative should remain in a footnote. “집회” is preferable to “회중” for συναγωγή in this civic/judicial context. “법을 어기는” naturally conveys παράνομοι without reducing it to general moral evil.
  issues:
  - severity: medium
    issue: “서로를 협박하며” overstates the reciprocal object of ἀπειλοῦντες ἐν ἑαυτοῖς.
    rationale: The phrase concerns threats/internal hostile deliberation among the men, not necessarily threats they addressed to each other. “그들끼리 위협을 주고받으며” better preserves the internal collective sense without specifying an external target.
  - severity: medium
    issue: “숨어 지켜보고 있었습니다” does not adequately render ἐνεδρεύοντες.
    rationale: ἐνεδρεύω has the force of lying in wait or setting an ambush. “숨어 기다리며” retains the secret, hostile waiting sense more directly.
  - severity: low
    issue: “도시의 회중” is potentially misleading and the footnote anchors are misplaced.
    rationale: In this context συναγωγή denotes a civic assembly, not a Christian congregation. Also, note a belongs with “이스라엘의 아들들,” while note b belongs with the difficult non-absence clause.
  revised_text: 그러나 법을 어기는 그 남자들은 돌아가서, 그들끼리 위협을 주고받으며 그녀를 죽이려고 숨어 기다렸습니다. 그들이 도시의 집회에 왔을 때, 그들은 자리를 비우지 않았고[b], 거기에 있던 모든 이스라엘의 아들들이 함께 모였습니다.[a]
  revised_footnotes:
  - marker: a
    text: 또는 “이스라엘 사람들.” 그리스어는 “이스라엘의 아들들”이라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절의 표현은 어렵습니다. 그리스어는 그들이 도시의 집회에 실제로 참석했다는 뜻일 가능성이 큽니다.
    reason: textual_variant
  revision_rationale: 'The revision improves modern formal Korean and more closely reflects the Greek: it avoids an unwarranted directly reciprocal object for the threatening phrase, restores the concealed waiting/ambush nuance, renders the civic συναγωγή as “집회,” and moves each note marker to the clause it explains. The difficult οὐ παρῴκουν remains conservatively rendered and explicitly noted.'
