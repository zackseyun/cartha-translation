  source_fidelity: 초안은 인물, 혈통, 혼인 관계, 남편의 동산, 저녁이라는 핵심 요소를 대체로 충실히 옮겼습니다. 그러나 난해한 구절 γυναῖκα ἀδελφοῦ αὐτῶν ἐκ τῶν υἱῶν Ἰσραήλ를 ‘자기들의 형제들 가운데 이스라엘 자손의 한 사람의 아내’로 옮긴 것은 원문의 단수 ἀδελφοῦ와 ἐκ τῶν υἱῶν Ἰσραήλ의 결합을 부정확하고 지나치게 해소합니다. 또한 원문에서 ‘걷고 있는’ 여자를 보았다는 연결을 더 분명히 해야 합니다.
  naturalness: 초안의 해당 친족 구절은 현대 한국어 문장으로도 구조가 불안정하며, ‘이름은 수산나요’는 뒤의 과거 서술과 호응이 매끄럽지 않습니다. 단수 ‘형제 한 사람’을 유지하고, 각 수식 관계를 정돈하면 합쇼체 서사문으로 자연스럽습니다.
  terminology: ‘수산나’, ‘힐기야’, ‘요아킴’, ‘동산’, ‘해 질 무렵’은 적절합니다. ‘외모가 아름다운’도 ἀστεῖαν τῷ εἴδει의 외적 아름다움을 자연스럽게 반영합니다. 각주에는 원문의 불편한 단수 친족 표현과 해석상 불확실성을 정확히 밝혀야 합니다.
