  to: 이 사람들은 외모가 아름다운 한 여자, 곧 이스라엘 자손 가운데 있는 자기들의 형제 한 사람의 아내[a]이며 이름은 수산나이고 힐기야의 딸이자 요아킴의 아내인 여자가 해 질 무렵 남편의 동산을 거닐고 있는 것을 보았습니다.
