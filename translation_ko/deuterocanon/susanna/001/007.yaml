  yaml_path: translation/deuterocanon/susanna/001/007.yaml
  text: These men saw a woman beautiful in appearance[a], a wife of one of their brothers from the sons of Israel, whose name was Susanna, daughter of Hilkiah, wife of Joakim, walking in her husband's garden in the evening.
  footnotes:
  - marker: a
    text: Greek literally, 'a wife of their brother from the sons of Israel.' The wording is awkward; the translation preserves the sense that she was the wife of a fellow Israelite within their own people.
    reason: alternative_reading
translation:
  language: ko
  text: 이 사람들은 외모가 아름다운 여자[a], 곧 자기들의 형제들 가운데 이스라엘 자손의 한 사람의 아내였으니, 이름은 수산나요, 힐기야의 딸이며, 요아킴의 아내였습니다. 그녀는 해 질 무렵에 남편의 동산에서 거닐고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어는 문자적으로 ‘그들의 형제들 가운데서 온 아내’라는 어색한 표현입니다. 번역은 그녀가 자기 민족 공동체 안의 이스라엘 여인이었다는 뜻을 살립니다.
    reason: alternative_reading
lexical_decisions:
- source_word: γυναῖκα ἀστεῖαν τῷ εἴδει
  english_pob_choice: a woman beautiful in appearance
  chosen_korean: 외모가 아름다운 여자
  alternatives_korean:
  - 아름다운 외모의 여자
  - 보기 좋은 여자
  lexicon: LSJ
  rationale: ἀστεῖαν τῷ εἴδει는 외적인 아름다움을 가리키므로, 자연스러운 현대 한국어로 ‘외모가 아름다운’이라고 옮겨 형태와 품위를 함께 살렸습니다.
- source_word: γυναῖκα ἀδελφοῦ αὐτῶν
  english_pob_choice: a wife of one of their brothers
  chosen_korean: 자기들의 형제들 가운데 이스라엘 자손의 한 사람의 아내
  alternatives_korean:
  - 그들의 형제의 아내
  - 이스라엘 자손 가운데 한 사람의 아내
  lexicon: LSJ
  rationale: 전해진 그리스어는 문법적으로 어색하므로, POB처럼 친족 표현을 유지하되 한국어에서는 ‘형제들 가운데’로 완화하여 공동체 내부의 이스라엘 여인이라는 뜻을 드러냈습니다.
- source_word: ὄνομα Σουσάνναν
  english_pob_choice: whose name was Susanna
  chosen_korean: 이름은 수산나요
  alternatives_korean:
  - 수산나라 하였으며
  - 이름이 수산나인
  lexicon: LSJ
  rationale: 서술적 명명 공식을 한국어 서사체에 맞게 풀어, 인물 소개의 흐름을 살렸습니다.
- source_word: ἐν τῷ παραδείσῳ τοῦ ἀνδρὸς αὐτῆς
  english_pob_choice: in her husband's garden
  chosen_korean: 남편의 동산에서
  alternatives_korean:
  - 남편의 정원에서
  - 남편의 과수원에서
  lexicon: LSJ
  rationale: παράδεισος는 여기서 신학적 ‘낙원’이 아니라 울타리 친 동산/과수원을 뜻하므로, 문맥상 가장 분명한 ‘동산’으로 옮겼습니다.
- source_word: τὸ δειλινόν
  english_pob_choice: in the evening
  chosen_korean: 해 질 무렵에
  alternatives_korean:
  - 저녁에
  - 해질녘에
  lexicon: LSJ
  rationale: 저녁 무렵의 시간대를 자연스럽게 나타내면서, 원문의 분위기와 장면 전환을 살리는 표현을 택했습니다.
theological_decisions:
- issue: 문법적으로 난해한 친족 구절(γυναῖκα ἀδελφοῦ αὐτῶν ἐκ τῶν υἱῶν Ἰσραήλ)의 처리
  chosen_reading: 공동체 내부의 이스라엘 사람의 아내라는 점을 드러내되, 어색한 친족 표지를 그대로 살려 ‘자기들의 형제들 가운데 이스라엘 자손의 한 사람의 아내’로 옮겼습니다.
  alternative_readings:
  - 그들의 형제의 아내
  - 이스라엘 여인의 아내
  rationale: 본문이 가진 난해함을 해소해 버리기보다, POB의 주석 취지를 따라 번역문 안에서 긴장을 보존하는 것이 더 투명합니다.
  doctrine_reference: 문법적 난점은 매끈하게 평준화하지 않고, 본문의 불명료성을 그대로 드러내는 번역 원칙
