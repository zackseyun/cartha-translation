base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/016.yaml
  text: And after turning back[a], they came to the same place, and when they questioned one another about the reason, they confessed their desire[b]; then together they arranged a time when they would be able to find her alone.
  footnotes:
  - marker: a
    text: Or 'they came together'; the Greek phrase ἐπὶ τὸ αὐτό can sometimes emphasize gathering together rather than specifically returning to the same place.
    reason: lexical_alternative
  - marker: b
    text: '''Their desire'' here carries the sense of illicit sexual desire in the narrative context; ''their lust'' is a possible more explicit rendering.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들이 돌아와 같은 곳에 이르렀으며, 서로 그 까닭을 묻다가 자기들의 욕망을 고백하였습니다. 그리고 그들은 함께 그녀를 홀로 찾아낼 수 있는 때를 정하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘같은 곳에’는 단순히 함께 모였다는 뜻도 될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘욕망’은 이 문맥에서 불법적 성적 욕구를 가리키며, 더 직접적으로는 ‘정욕’으로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακάμψαντες
  english_pob_choice: after turning back
  chosen_korean: 돌아와
  alternatives_korean:
  - 되돌아와
  - 돌아간 뒤
  lexicon: LSJ
  rationale: 참여사적 전개를 살리면서 물리적으로 방향을 바꾸어 돌아온 움직임을 자연스럽게 옮겼습니다.
- source_word: ἐπὶ τὸ αὐτό
  english_pob_choice: to the same place
  chosen_korean: 같은 곳에
  alternatives_korean:
  - 같은 곳으로
  - 함께
  lexicon: BDAG
  rationale: 이 구절은 단순한 동시 행동보다 장소의 재집결을 드러내므로, 한국어에서는 ‘같은 곳에’로 풀어 주는 편이 분명합니다.
- source_word: τὴν αἰτίαν / τὴν ἐπιθυμίαν αὐτῶν
  english_pob_choice: the reason / their desire
  chosen_korean: 그 까닭 / 자기들의 욕망
  alternatives_korean:
  - 그 이유 / 자기들의 욕심
  - 그 원인 / 자기들의 정욕
  lexicon: BDAG
  rationale: ‘까닭’은 질문의 대상인 이유를, ‘욕망’은 본문 맥락상 불순한 성적 욕구를 비교적 직접적으로 드러내면서도 원문 표현을 과도하게 바꾸지 않습니다.
- source_word: κοινῇ συνετάξαντο καιρὸν
  english_pob_choice: together they arranged a time
  chosen_korean: 함께 … 때를 정하였습니다
  alternatives_korean:
  - 공동으로 … 시간을 정하였습니다
  - 함께 … 기회를 정하였습니다
  lexicon: LSJ
  rationale: κοινῇ의 공동성을 ‘함께’로, συνετάξαντο καιρόν의 계획성을 ‘때를 정하다’로 옮겨 공모의 뉘앙스를 살렸습니다.
- source_word: μόνην
  english_pob_choice: alone
  chosen_korean: 홀로
  alternatives_korean:
  - 혼자
  - 단둘이 없는
  lexicon: BDAG
  rationale: ‘홀로’는 동반자 없이 있는 상태를 간결하게 전하며, 뒤의 계획 목적과도 잘 맞습니다.
theological_decisions:
- issue: τὴν ἐπιθυμίαν αὐτῶν의 윤리적 강도
  chosen_reading: 본문의 ‘욕망’은 단순한 선호가 아니라 이야기 문맥상 불륜적 성적 욕구를 가리키는 것으로 읽었습니다.
  alternative_readings:
  - 중립적인 ‘소원/바람’으로 완화
  - 더 노골적인 ‘정욕’으로 직역
  rationale: 이 장면은 두 사람의 죄책을 드러내는 서사이므로, 의미를 약화시키지 않되 한국어 성경 문체에서 과도하게 해설적이지 않은 ‘욕망’이 적절합니다.
  doctrine_reference: 인간의 타락과 정욕에 대한 성서적 증언(약 1:14-15; 갈 5:19-21)
- issue: ‘그녀’의 대명사 처리
  chosen_reading: 직접 인칭대명사 ‘그녀’를 유지해 대상의 성별과 특정성을 드러냈습니다.
  alternative_readings:
  - ‘그를’처럼 일반화
  - 이름을 반복
  rationale: 원문은 목적 대상을 분명히 가리키며, 서사적 긴장을 유지하기 위해 지시 대명사를 보존했습니다.
  doctrine_reference: 서사 내 지시 대상의 명료성 유지
