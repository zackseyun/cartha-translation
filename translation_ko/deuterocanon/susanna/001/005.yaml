  to: 그리고 그 해에 백성 가운데서 두 장로가 재판관으로 임명되었습니다. 그들에 관하여 주권자께서[a] 말씀하셨습니다. “불법이 바빌론에서 나왔습니다. 곧 백성을 다스린다고 여겨지던[b] 장로들인 재판관들에게서 말입니다.”
  rationale: ‘주권자’로 δεσπότης의 독자적 칭호를 자연스럽게 옮기고, 인용문을 두 문장으로 나누어 원문의 ‘바빌론에서, 장로들인 재판관들에게서’라는 중첩된 출처 표현과 압축된 구문을 한국어로 명료하게 재현했습니다. ‘장로들인 재판관들’은 두 명사가 동일 집단을 가리킨다는 원문을 보존하며, ἐδόκουν의 거리감은 ‘여겨지던’으로 유지했습니다.
