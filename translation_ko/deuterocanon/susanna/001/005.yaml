base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/005.yaml
  text: 'And in that year two elders from the people were appointed as judges[a], concerning whom the Master had spoken: “Lawlessness came out from Babylon, from elders who were judges[b], who seemed to govern the people.”'
  footnotes:
  - marker: a
    text: Or “the Lord” or “the Sovereign” for Greek δεσπότης; the main text uses “the Master” to preserve the distinction from κύριος.
    reason: lexical_alternative
  - marker: b
    text: The Greek wording is syntactically compressed at the end of the verse; “who seemed to govern the people” may also be understood as “who were thought to govern the people.”
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그 해에 백성 가운데서 두 장로가 재판관으로 세워졌는데, 그들에 관하여 주인께서 말씀하시기를 “불법이 바빌론에서 나왔으니, 곧 백성을 다스리는 것으로 여겨지던 장로들, 재판관들이라” 하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “주님”이나 “주권자”. 그리스어 δεσπότης는 κύριος와 다른 칭호이므로 본문에서는 “주인”을 사용했습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 표현은 끝부분이 압축되어 있어, “백성을 다스리는 것으로 여겨지던”은 “백성을 다스린다고 여겨지던”으로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεδείχθησαν
  english_pob_choice: were appointed
  chosen_korean: 재판관으로 세워졌는데
  alternatives_korean:
  - 임명되었는데
  - 지정되었는데
  - 세움을 받았는데
  lexicon: LSJ
  rationale: 공적 직분과 판결 역할을 함께 드러내기 위해 ‘세워지다’를 택했고, ‘재판관으로’로 κριταί의 기능을 분명히 했습니다.
- source_word: πρεσβύτεροι
  english_pob_choice: elders
  chosen_korean: 장로
  alternatives_korean:
  - 연장자
  - 노인들
  lexicon: LSJ
  rationale: 단순한 나이 많음을 넘어서 공동체의 지도층을 가리키므로 ‘장로’가 가장 자연스럽습니다.
- source_word: δεσπότης
  english_pob_choice: the Master
  chosen_korean: 주인
  alternatives_korean:
  - 주님
  - 주인님
  - 지배자
  lexicon: LSJ
  rationale: κύριος와 구별되는 δεσπότης의 어휘적 차이를 살리기 위해, 존칭이지만 다른 칭호인 ‘주인’을 사용했습니다.
- source_word: οἱ ἐδόκουν κυβερνᾷν τὸν λαόν
  english_pob_choice: who seemed to govern the people
  chosen_korean: 백성을 다스리는 것으로 여겨지던
  alternatives_korean:
  - 백성을 다스리는 듯 보이던
  - 백성을 다스리는 줄로 여겨지던
  - 백성을 통치하던 것으로 보이던
  lexicon: LSJ
  rationale: ἐδόκουν의 ‘~로 여겨지다/보이다’와 뒤의 κυβερνᾷν의 통치 이미지를 함께 살려, 겉보기의 권위와 실제 부패 사이의 거리를 유지했습니다.
theological_decisions:
- issue: δεσπότης의 번역에서 κύριος와의 구별 유지
  chosen_reading: ‘주인’으로 번역해, 본문이 말하는 분명한 신적 발화이면서도 κύριος와는 다른 호칭임을 드러냈습니다.
  alternative_readings:
  - 주님
  - 주권자
  rationale: 이 구절은 인용형 발화 속에서 δεσπότης를 사용하므로, 교회 전통의 일반적 ‘주님’보다 어휘 차이를 보존하는 것이 본문 구조를 더 잘 반영합니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; preserve source meaning rather than translation tradition.'
