    rationale: ἐκ πρεσβυτέρων κριτῶν은 ‘장로들인 재판관들에게서’라는 뜻인데, 현 번역의 ‘장로들, 재판관들이라’는 전치사 ἐκ의 관계를 잃고 문장도 어색합니다.
