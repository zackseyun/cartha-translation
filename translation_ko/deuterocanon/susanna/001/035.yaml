  alternative_readings:
  - 단순히 감정적으로 울고 있는 장면
  - 기도적 시선과 신앙의 확신을 분리한 장면
  rationale: 본문은 외적 애통과 내적 신뢰를 병치하므로, 둘을 모두 살려 수잔나의 의존과 신뢰를 함께 드러내는 번역이 필요합니다.
