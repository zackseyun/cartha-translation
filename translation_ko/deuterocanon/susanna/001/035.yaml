  language: ko
  text: 그런데 울고 있던 그녀는 하늘을 올려다보았습니다. 왜냐하면 그녀의 마음이 주님께 확신하고 있었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
