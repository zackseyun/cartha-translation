  terminology: Κυρίῳ는 프로젝트 기본 용어를 따라 ‘주님’으로 유지합니다. πεποιθυῖα는 ‘확신’보다 관계적 신뢰를 나타내는 ‘신뢰하다’로 옮기는 것이 적절합니다.
