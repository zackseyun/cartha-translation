    reason: lexical_alternative
lexical_decisions:
- source_word: κλαίουσα
  english_pob_choice: weeping
  chosen_korean: 울고 있던
  alternatives_korean:
  - 울며
  - 우는
  lexicon: BDAG
  rationale: 현재분사로서 지속적인 상태를 나타내므로, 동작을 진행형으로 보이게 하는 ‘울고 있던’이 자연스럽고 문맥에도 맞습니다.
- source_word: ἀνέβλεψεν εἰς τὸν οὐρανόν
