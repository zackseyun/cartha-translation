  lexicon: BDAG
  rationale: 동사 자체의 ‘올려다보다’ 의미와 목적어 ‘하늘’을 함께 살려, 기도적 정서를 유지하면서도 직역에 치우치지 않게 옮겼습니다.
- source_word: ἦν ἡ καρδία αὐτῆς πεποιθυῖα ἐπὶ Κυρίῳ
  english_pob_choice: her heart had trusted in the Lord
  chosen_korean: 그녀의 마음이 주님께 확신하고 있었기 때문입니다
  alternatives_korean:
  - 그녀의 마음이 주님을 신뢰하고 있었기 때문입니다
  - 그녀의 마음이 주님께 믿음을 두고 있었기 때문입니다
  lexicon: BDAG
  rationale: πεποιθυῖα는 단순한 감정이 아니라 이미 형성되어 지속되는 신뢰 상태를 가리키므로, ‘확신하고 있었습니다’로 상태성을 살렸습니다. ἐπὶ + 여격은 관계의 대상이 되는 방향성을 드러내어 ‘주님께’로 처리했습니다.
- source_word: Κυρίῳ
