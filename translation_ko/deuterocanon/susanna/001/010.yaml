  - 고백하지 않았으며
  lexicon: LSJ
  rationale: 여기서는 ‘거짓으로 꾸미다’가 아니라 비밀을 밖으로 내놓지 않는 뜻이므로, 서술의 비밀성에 맞게 ‘드러내지 않다’로 옮겼습니다.
- source_word: τὸ κακὸν τὸ ἔχον αὐτοὺς
  english_pob_choice: the wicked passion that held them
  chosen_korean: 그들을 붙잡고 있던 악한 욕망
  alternatives_korean:
  - 그들을 사로잡고 있던 악한 욕망
  - 그들을 지배하던 악한 욕망
