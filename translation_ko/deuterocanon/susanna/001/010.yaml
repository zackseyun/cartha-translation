base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/010.yaml
  text: And both of them were inflamed with desire for her[a], and neither one disclosed to the other the wicked passion that held them concerning her[b], nor did the woman know this matter.
  footnotes:
  - marker: a
    text: Greek literally, 'were pierced concerning her,' an idiom here for being deeply smitten or inflamed with desire for her.
    reason: lexical_alternative
  - marker: b
    text: Or 'the evil desire that possessed them concerning her.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들 둘 다 그녀를 향해 마음이 사로잡혀 있었고, 한 사람도 다른 사람에게 그녀와 관련하여 그들을 붙잡고 있던 악한 욕망을 드러내지 않았으며, 그 여인도 이 일을 알지 못했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘그녀에 관하여 찔린/꿰뚫린 상태였다’는 뜻이며, 여기서는 그녀를 향한 깊은 욕망을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들을 사로잡고 있던 악한 욕망’으로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμφότεροι
  english_pob_choice: both of them
  chosen_korean: 그들 둘 다
  alternatives_korean:
  - 둘 다
  - 두 사람 모두
  lexicon: LSJ
  rationale: 이미 앞서 지칭된 두 장로를 분명히 가리키므로, 한국어에서는 ‘그들 둘 다’로 자연스럽게 dual reference를 살렸습니다.
- source_word: κατανενυγμένοι
  english_pob_choice: inflamed with desire
  chosen_korean: 마음이 사로잡혀 있었고
  alternatives_korean:
  - 욕망으로 마음이 불타 있었고
  - 마음이 찔려 있었고
  - 깊이 매혹되어 있었고
  lexicon: LSJ
  rationale: 직역하면 ‘찔린/꿰뚫린’ 이미지가 있으나, 문맥상 Susanna에 대한 성적 집착이므로 한국어에서는 의미를 드러내는 관용적 표현으로 옮겼습니다.
- source_word: οὐ προσεποιεῖτο
  english_pob_choice: disclosed
  chosen_korean: 드러내지 않았으며
  alternatives_korean:
  - 알리지 않았으며
  - 말하지 않았으며
  - 고백하지 않았으며
  lexicon: LSJ
  rationale: 여기서는 ‘거짓으로 꾸미다’가 아니라 비밀을 밖으로 내놓지 않는 뜻이므로, 서술의 비밀성에 맞게 ‘드러내지 않다’로 옮겼습니다.
- source_word: τὸ κακὸν τὸ ἔχον αὐτοὺς
  english_pob_choice: the wicked passion that held them
  chosen_korean: 그들을 붙잡고 있던 악한 욕망
  alternatives_korean:
  - 그들을 사로잡고 있던 악한 욕망
  - 그들을 지배하던 악한 욕망
  - 그들을 붙들고 있던 악한 정욕
  lexicon: BDAG
  rationale: κακόν의 도덕적 평가를 살리면서, ἔχον의 ‘붙잡다/사로잡다’ 의미를 한국어로 자연스럽게 표현했습니다.
- source_word: ἡ γυνή
  english_pob_choice: the woman
  chosen_korean: 그 여인
  alternatives_korean:
  - 그 여자
  - 그 여자 사람
  - 그 부인
  lexicon: LSJ
  rationale: 원문은 Susanna를 외부 시점에서 ‘그 여자/그 여인’이라 부르므로, 서술적 거리감을 유지하는 ‘그 여인’을 택했습니다.
- source_word: τὸ πρᾶγμα τοῦτο
  english_pob_choice: this matter
  chosen_korean: 이 일
  alternatives_korean:
  - 이 사건
  - 이 문제
  - 이 사정
  lexicon: BDAG
  rationale: 아직 구체적 음모를 완전히 드러내지 않은 단계이므로, 과도하게 특정하지 않는 ‘이 일’이 가장 무난합니다.
theological_decisions:
- issue: 악한 욕망의 도덕적 규정
  chosen_reading: τὸ κακὸν을 단순한 ‘악’보다 ‘악한 욕망’으로 구체화했습니다.
  alternative_readings:
  - 악
  - 악한 것
  - 악한 정욕
  rationale: 본문은 두 사람을 지배하는 내적 욕망을 가리키며, 그 욕망 자체를 도덕적으로 판단합니다. 한국어에서도 그 대상이 분명히 보이도록 했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: κατανενυγμένοι의 은유적 강도
  chosen_reading: 직역 이미지보다 ‘마음이 사로잡혀 있었다’로 의미 중심 번역을 택했습니다.
  alternative_readings:
  - 그녀 때문에 찔려 있었다
  - 그녀를 향해 꿰뚫려 있었다
  - 그녀에게 깊이 사로잡혀 있었다
  rationale: 원뜻의 ‘찌름/꿰뚫림’ 이미지는 유지할 수 있으나 현대 한국어에서는 오해를 낳기 쉬워, 문맥상 분명한 집착의 강도를 우선했습니다.
  doctrine_reference: Translation philosophy §1, §6
