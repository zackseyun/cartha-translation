base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/010.yaml
  text: And both of them were inflamed with desire for her[a], and neither one disclosed to the other the wicked passion that held them concerning her[b], nor did the woman know this matter.
  footnotes:
  - marker: a
    text: Greek literally, 'were pierced concerning her,' an idiom here for being deeply smitten or inflamed with desire for her.
    reason: lexical_alternative
  - marker: b
    text: Or 'the evil desire that possessed them concerning her.'
    reason: alternative_reading
translation:
  language: ko
  text: 두 사람 모두 그녀를 향한 욕망에 불타 있었고[a], 어느 누구도 다른 사람에게 그녀를 두고 그들을 사로잡고 있던 악한 욕망을[b] 드러내지 않았으며, 그 여인도 이 일을 알지 못했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘그녀에 관하여 찔려 있었다’라는 뜻이며, 여기서는 그녀를 향한 깊고 강렬한 욕망을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그녀를 두고 그들을 붙잡고 있던 악한 욕망’으로 옮길 수 있습니다.
    reason: alternative_reading
