theological_decisions:
- issue: 악한 욕망의 도덕적 규정
  chosen_reading: τὸ κακὸν을 단순한 ‘악’보다 ‘악한 욕망’으로 구체화했습니다.
  alternative_readings:
  - 악
  - 악한 것
  - 악한 정욕
  rationale: 본문은 두 사람을 지배하는 내적 욕망을 가리키며, 그 욕망 자체를 도덕적으로 판단합니다. 한국어에서도 그 대상이 분명히 보이도록 했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: κατανενυγμένοι의 은유적 강도
  chosen_reading: 직역 이미지보다 ‘마음이 사로잡혀 있었다’로 의미 중심 번역을 택했습니다.
  alternative_readings:
  - 그녀 때문에 찔려 있었다
  - 그녀를 향해 꿰뚫려 있었다
  - 그녀에게 깊이 사로잡혀 있었다
  rationale: 원뜻의 ‘찌름/꿰뚫림’ 이미지는 유지할 수 있으나 현대 한국어에서는 오해를 낳기 쉬워, 문맥상 분명한 집착의 강도를 우선했습니다.
  doctrine_reference: Translation philosophy §1, §6
