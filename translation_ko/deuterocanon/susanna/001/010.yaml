  rationale: 직역하면 ‘찔린/꿰뚫린’ 이미지가 있으나, 문맥상 Susanna에 대한 성적 집착이므로 한국어에서는 의미를 드러내는 관용적 표현으로 옮겼습니다.
- source_word: οὐ προσεποιεῖτο
  english_pob_choice: disclosed
  chosen_korean: 드러내지 않았으며
  alternatives_korean:
  - 알리지 않았으며
