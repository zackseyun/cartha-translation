  lexicon: LSJ
  rationale: 원문은 Susanna를 외부 시점에서 ‘그 여자/그 여인’이라 부르므로, 서술적 거리감을 유지하는 ‘그 여인’을 택했습니다.
- source_word: τὸ πρᾶγμα τοῦτο
