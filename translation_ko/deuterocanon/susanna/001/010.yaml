  lexicon: BDAG
  rationale: κακόν의 도덕적 평가를 살리면서, ἔχον의 ‘붙잡다/사로잡다’ 의미를 한국어로 자연스럽게 표현했습니다.
- source_word: ἡ γυνή
  english_pob_choice: the woman
  chosen_korean: 그 여인
  alternatives_korean:
