translation:
  language: ko
  text: 그리고 힐기야와 그의 아내는 그들의 딸에 관하여, 그 딸의 남편 요아킴과 그들의 모든 친족과 함께 찬양했습니다[a]. 그녀에게서는 부끄러운 일이 하나도 발견되지 않았기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 찬양의 대상을 직접 밝히지 않습니다. 본문은 그들이 딸에 관하여 찬양했다고만 말합니다.
    reason: source_note
