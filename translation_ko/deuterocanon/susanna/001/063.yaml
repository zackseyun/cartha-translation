- source_word: περὶ τῆς θυγατρὸς αὐτῶν
  english_pob_choice: concerning their daughter
  chosen_korean: 자기 딸에 관하여
  alternatives_korean:
  - 그들의 딸을 두고
  - 그들의 딸을 위하여
  - 그들의 딸에 대해
  lexicon: BDAG
  rationale: περί + 속격은 ‘~에 관하여/대해’가 기본이므로, 딸을 직접 목적어처럼 칭찬했다고 단정하지 않고 관계를 그대로 살렸습니다.
- source_word: μετὰ Ἰωακεὶμ τοῦ ἀνδρὸς αὐτῆς
  english_pob_choice: along with Joakim her husband
  chosen_korean: 요아킴 곧 그의 남편과 함께
