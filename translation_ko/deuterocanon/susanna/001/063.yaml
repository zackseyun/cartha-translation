  - 모든 가족
  lexicon: BDAG
  rationale: συγγενεῖς는 혈연·혼인 친족을 아우르는 표현이므로, 현대어로 가장 포괄적이고 중립적인 ‘친족’을 택했습니다.
- source_word: αἰσχρὸν πρᾶγμα
  english_pob_choice: shameful deed
  chosen_korean: 부끄러운 일
  alternatives_korean:
  - 수치스러운 행위
  - 음란한 일
  - 치욕스러운 일
  lexicon: BDAG
  rationale: αἰσχρός와 πρᾶγμα의 결합은 도덕적·법적 수치를 가리키며, 한국어에서는 직역보다 자연스러운 관용 표현인 ‘부끄러운 일’이 그 판단을 잘 보존합니다.
theological_decisions:
- issue: ᾔνεσαν의 칭찬 대상이 본문에 직접 나오지 않는 점
  chosen_reading: 본문 의미를 살려 ‘자기 딸에 관하여 … 그를 칭찬했습니다’로 옮기고, 칭찬의 대상을 한국어 본문에 따로 보태지 않았습니다.
  alternative_readings:
  - ‘하나님을 칭찬했습니다’로 명시
  - ‘딸을 칭찬했습니다’로 직접화
  rationale: 그리스어 본문은 칭찬의 직접 목적어를 주지 않으므로, 영어 POB의 해설적 보충을 따라 신학적 대상을 본문에 삽입하기보다 관계 표현만 유지하는 편이 원문 충실도가 높습니다.
  doctrine_reference: original-language primacy; lexical restraint in implicit-object construction
