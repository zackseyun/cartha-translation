translation:
  language: ko
  text: 그리고 힐기야와 그의 아내는 자기 딸에 관하여, 요아킴 곧 그의 남편과 그들의 모든 친족과 함께 그를 칭찬했습니다. 그에게서 부끄러운 일이 하나도 발견되지 않았기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 칭찬의 대상을 직접 말하지 않습니다. 본문은 다만 그들이 딸에 관하여 칭찬했다는 관계만을 드러냅니다.
    reason: source_note
lexical_decisions:
- source_word: ᾔνεσαν
  english_pob_choice: praised
  chosen_korean: 칭찬했습니다
  alternatives_korean:
  - 찬양했습니다
  - 칭송했습니다
  - 찬미했습니다
  lexicon: BDAG
  rationale: 이 동사는 단순한 감정 표현보다 공식적·공적 찬사를 뜻하므로, 한국어에서는 의미를 과장하지 않으면서도 긍정적 평가를 드러내는 ‘칭찬했습니다’가 가장 무난합니다.
- source_word: περὶ τῆς θυγατρὸς αὐτῶν
  english_pob_choice: concerning their daughter
  chosen_korean: 자기 딸에 관하여
  alternatives_korean:
  - 그들의 딸을 두고
  - 그들의 딸을 위하여
  - 그들의 딸에 대해
  lexicon: BDAG
  rationale: περί + 속격은 ‘~에 관하여/대해’가 기본이므로, 딸을 직접 목적어처럼 칭찬했다고 단정하지 않고 관계를 그대로 살렸습니다.
- source_word: μετὰ Ἰωακεὶμ τοῦ ἀνδρὸς αὐτῆς
  english_pob_choice: along with Joakim her husband
  chosen_korean: 요아킴 곧 그의 남편과 함께
  alternatives_korean:
  - 요아킴 그 남편과 함께
  - 요아킴 그녀의 남편과 함께
  lexicon: BDAG
  rationale: μετά는 동반의 뜻이므로 ‘함께’로 옮겼고, ‘곧’은 동격 관계를 분명히 하여 요아킴이 그 딸의 남편임을 자연스럽게 드러냅니다.
- source_word: τῶν συγγενῶν πάντων
  english_pob_choice: all their relatives
  chosen_korean: 그들의 모든 친족
  alternatives_korean:
  - 모든 친척
