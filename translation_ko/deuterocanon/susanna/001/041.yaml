translation:
  language: ko
  text: 그리고 온 회중이 그들을 믿었습니다[a]. 그들이 백성의 장로이며 재판관이었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘온 집회’. 여기서 그리스어는 모인 공동체를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίστευσεν αὐτοῖς
  english_pob_choice: believed them
  chosen_korean: 그들을 믿었습니다
  alternatives_korean:
  - 그 말을 믿었습니다
  - 그들에게 믿음을 두었습니다
  lexicon: BDAG
  rationale: 여기서는 단순한 신뢰보다 그들의 진술을 사실로 받아들인 의미가 핵심이므로, 가장 직접적인 ‘믿었습니다’로 옮겼습니다.
- source_word: ἡ συναγωγὴ πᾶσα
  english_pob_choice: the whole assembly
  chosen_korean: 온 회중
  alternatives_korean:
  - 온 집회
  - 온 공동체
  - 온 회집
  lexicon: LSJ
  rationale: 이 문맥의 συναγωγή는 제도적 ‘회당’이 아니라 모인 공동체 전체를 가리키므로, 자연스러운 한국어로 ‘온 회중’이라 옮겼습니다.
- source_word: πρεσβυτέρων
  english_pob_choice: elders
  chosen_korean: 장로
  alternatives_korean:
  - 원로
  - 어른들
  - 늙은이
  lexicon: LSJ
  rationale: 단순한 연장자가 아니라 공동체의 공적 지도층을 가리키므로, 역할을 드러내는 ‘장로’가 가장 적절합니다.
- source_word: κριτῶν
  english_pob_choice: judges
  chosen_korean: 재판관
  alternatives_korean:
  - 판관
  - 판사
  - 재판하는 사람들
  lexicon: LSJ
  rationale: 법적 판단 권한을 가진 사람이라는 뜻을 분명히 살리기 위해, 현대 한국어에서 공적 직분 뉘앙스가 있는 ‘재판관’을 택했습니다.
theological_decisions:
- issue: συναγωγή의 한국어 처리
  chosen_reading: 회당이 아니라 공동체의 모임으로 이해하여 ‘회중’으로 번역했습니다.
  alternative_readings:
  - 회당
  - 회중
  - 집회
  rationale: 본문은 유대교 예배당을 가리키지 않고, 판단을 듣는 백성의 모인 자리를 뜻하므로 제도명보다 집합체 의미를 살렸습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; avoid anachronistic ecclesial terminology.'
