  source_fidelity: 그리스어 καὶ ἐπίστευσεν αὐτοῖς ἡ συναγωγὴ πᾶσα를 ‘그리고 온 회중이 그들을 믿었습니다’로 충실히 옮겼습니다. ὡς는 이들이 장로와 백성의 재판관이라는 사실을 믿은 이유로 제시하며, 이어지는 ‘그들이 백성의 장로이며 재판관이었기 때문입니다’가 그 인과관계를 자연스럽게 전달합니다.
