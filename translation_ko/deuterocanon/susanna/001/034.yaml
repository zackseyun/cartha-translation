  text: Then the elders and judges stood up and laid their hands on her head.
translation:
  language: ko
  text: 그때 원로들과 재판관들이 일어나 그녀의 머리에 자기들의 손을 얹었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστάντες
  english_pob_choice: stood up
  chosen_korean: 일어나
  alternatives_korean:
  - 일어서고
  - 일어나서
  lexicon: BDAG
  rationale: 문맥상 다음 행위를 이끄는 부수 동작이므로, 자연스러운 서술형으로 ‘일어나’라고 옮겨 기립 동작을 분명히 했습니다.
- source_word: οἱ πρεσβύτεροι
  english_pob_choice: the elders
  chosen_korean: 원로들
  alternatives_korean:
  - 장로들
  - 나이 많은 사람들
  lexicon: BDAG
  rationale: 이 서사는 단순 연장자가 아니라 공동체의 권위 있는 지도층을 가리키므로, 역할을 드러내는 ‘원로들’이 가장 적절합니다.
- source_word: κριταὶ
  english_pob_choice: judges
  chosen_korean: 재판관들
  alternatives_korean:
  - 판사들
  - 심판하는 이들
  lexicon: BDAG
  rationale: 법정적 기능을 직접 드러내면서 현대 한국어 독자에게도 자연스러운 표현이어서 ‘재판관들’로 옮겼습니다.
- source_word: ἐπέθηκαν τὰς χεῖρας αὐτῶν ἐπὶ τῆς κεφαλῆς αὐτῆς
  english_pob_choice: laid their hands on her head
  chosen_korean: 그녀의 머리에 자기들의 손을 얹었습니다
  alternatives_korean:
  - 그녀의 머리에 손을 얹었습니다
  - 그녀의 머리 위에 손을 올렸습니다
  lexicon: BDAG
  rationale: ‘손을 얹다’는 χειροθεσία의 후대 종교적 용례를 불러올 수 있지만, 여기서는 실제 행위를 묘사하는 법정적 제스처이므로 그 동작만 담담하게 살렸습니다.
theological_decisions:
- issue: 손을 얹는 행위의 종교적·의식적 뉘앙스 처리
  chosen_reading: 후대 교회적 안수 의미를 부기하지 않고, 고발/재판 장면의 물리적 제스처로만 제시했습니다.
  alternative_readings:
  - 의식적 안수처럼 번역하기
  - 그냥 ‘손을 얹다’로만 처리하기
  rationale: 원문은 법정 절차의 구체적 행동을 말할 뿐이므로, 본문이 보장하지 않는 성례적 의미를 덧씌우지 않는 것이 स्रोत에 충실합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
