base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/023.yaml
  text: But if not[a], we will testify against you that a young man was with you[b], and for this reason you sent the servant girls away from you.
  footnotes:
  - marker: a
    text: Or, 'we will bear witness against you.' The Greek is forensic in tone.
    reason: lexical_alternative
  - marker: b
    text: '''Servant girls'' translates a term that can mean ''girls,'' but here it refers to Susanna''s female attendants.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그렇지 않다면, 우리는 네 곁에 젊은 남자가 있었다고 네게 불리한 증언을 하겠습니다[a]. 그래서 네가 네 곁에서 여자 종들을 내보낸 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리는 네게 불리하게 증언하겠습니다.’ 그리스어는 법정적 어조를 띱니다.
    reason: lexical_alternative
  - marker: b
    text: ‘여자 종들’은 문자적으로는 ‘소녀들’이 될 수 있지만, 여기서는 수산나의 여성 시종들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ μή
  english_pob_choice: But if not
  chosen_korean: 그러나 그렇지 않다면
  alternatives_korean:
