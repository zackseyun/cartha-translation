base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/023.yaml
  text: But if not[a], we will testify against you that a young man was with you[b], and for this reason you sent the servant girls away from you.
  footnotes:
  - marker: a
    text: Or, 'we will bear witness against you.' The Greek is forensic in tone.
    reason: lexical_alternative
  - marker: b
    text: '''Servant girls'' translates a term that can mean ''girls,'' but here it refers to Susanna''s female attendants.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그렇지 않으면, 우리는 젊은 남자가 너와 함께 있었고 네가 그 때문에 여자 시종들을 네 곁에서 내보냈다고 너에게 불리한 증언을 하겠습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리는 너에게 불리하게 증언하겠습니다.’ 그리스어는 법정적 어조를 띱니다.
    reason: lexical_alternative
  - marker: b
    text: ‘여자 시종들’로 옮긴 말은 문자적으로 ‘소녀들’을 뜻할 수도 있으나, 여기서는 수산나의 여성 시종들을 가리킵니다.
    reason: lexical_alternative
