  lexicon: BDAG
  rationale: 앞 절의 요구에 대한 조건적 위협을 한국어로 자연스럽게 살리되, 단순한 대조보다 강한 압박감을 유지했습니다.
- source_word: καταμαρτυρήσομέν
  english_pob_choice: we will testify against
  chosen_korean: 우리는 … 네게 불리한 증언을 하겠습니다
  alternatives_korean:
  - 우리는 네게 불리하게 증언하겠습니다
  - 우리는 네게 불리한 증언을 하겠습니다
  lexicon: BDAG
  rationale: 법정적·적대적 뉘앙스를 살리기 위해 ‘증언하다’를 유지하고, ‘불리한’을 덧붙여 반대 증언의 성격을 드러냈습니다.
- source_word: τὰ κοράσια
  english_pob_choice: the servant girls
  chosen_korean: 여자 종들
  alternatives_korean:
  - 시녀들
  - 여종들
  lexicon: BDAG
  rationale: 문맥상 수산나의 곁에 있던 여성 시종들을 가리키므로, 단순한 ‘소녀들’보다 종속된 신분을 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 거짓 고발의 법정적 성격 보존
  chosen_reading: ‘불리한 증언을 하겠습니다’로 옮겨 법정적 위협을 분명히 했습니다.
  alternative_readings:
  - ‘우리는 너를 고발하겠습니다’로 일반화할 수 있습니다.
  rationale: 본문의 καταμαρτυρήσομεν은 단순한 비난보다 적대적 증언의 법정 언어이므로, 서사를 약화하지 않도록 직접적인 증언 표현을 유지했습니다.
  doctrine_reference: 번역 원칙 §1, §5
- issue: 문맥상 의미를 드러내는 ‘여자 종들’
  chosen_reading: τὰ κοράσια를 수산나의 시종들을 가리키는 표현으로 이해했습니다.
  alternative_readings:
  - 중립적으로 ‘소녀들’로 옮길 수 있습니다.
  rationale: 영문 POB의 주석처럼 여기서는 일반적인 ‘소녀들’보다 수산나의 여성 시종이라는 문맥적 식별이 중요합니다.
  doctrine_reference: 번역 원칙 §2
