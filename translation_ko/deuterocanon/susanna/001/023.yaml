  alternative_readings:
  - ‘우리는 너를 고발하겠습니다’로 일반화할 수 있습니다.
  rationale: 본문의 καταμαρτυρήσομεν은 단순한 비난보다 적대적 증언의 법정 언어이므로, 서사를 약화하지 않도록 직접적인 증언 표현을 유지했습니다.
  doctrine_reference: 번역 원칙 §1, §5
- issue: 문맥상 의미를 드러내는 ‘여자 종들’
  chosen_reading: τὰ κοράσια를 수산나의 시종들을 가리키는 표현으로 이해했습니다.
  alternative_readings:
  - 중립적으로 ‘소녀들’로 옮길 수 있습니다.
  rationale: 영문 POB의 주석처럼 여기서는 일반적인 ‘소녀들’보다 수산나의 여성 시종이라는 문맥적 식별이 중요합니다.
  doctrine_reference: 번역 원칙 §2
