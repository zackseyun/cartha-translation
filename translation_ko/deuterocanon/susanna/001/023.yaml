  source_fidelity: 그리스어의 법정적 위협(καταμαρτυρήσομεν)과 고발 내용은 대체로 잘 반영했습니다. 그러나 현 번역의 둘째 문장인 “그래서 네가 … 내보낸 것입니다”는 그들이 장차 할 증언의 내용이라는 종속 관계가 약해지고, 독립적인 서술처럼 들립니다. 두 고발 절을 모두 ‘증언하겠습니다’의 내용으로 묶어야 합니다.
  naturalness: ‘그러나 그렇지 않다면’보다 앞 절의 요구를 받는 ‘그렇지 않으면’이 현대 한국어에서 더 자연스럽습니다. 또한 ‘네 곁에 젊은 남자가 있었다고’는 가능하지만, ‘젊은 남자가 너와 함께 있었다고’가 μετὰ σοῦ를 더 매끄럽게 옮깁니다.
