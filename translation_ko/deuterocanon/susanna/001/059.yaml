    rationale: εἰς τὴν σεαυτοῦ κεφαλήν은 결과가 자신에게 돌아온다는 성서적 관용 표현입니다. ‘머리 위에 대하여’는 한국어 문법·관용상 어색하며, ‘자신의 머리 위에’가 더 적절합니다.
