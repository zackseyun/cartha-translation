  naturalness: 요구된 현대 표준어 합쇼체에 맞추어 비격식 종결형 ‘했구나’와 반말 대명사 ‘너/네/너희’를 ‘당신/당신들’ 및 ‘-습니다’로 통일해야 합니다. ‘자기 머리 위에’는 성서적 책임·심판의 비유를 유지하면서도 ‘대하여’를 제거하여 자연스럽게 했습니다.
  terminology: ‘하나님의 천사’, ‘칼’, ‘멸하다’는 적절합니다. πρίσαι μέσον은 ‘두 동강 내다’로 유지할 수 있습니다. 마지막 복수형은 본문에서 ‘당신들을’로 드러내고 해당 어구에 각주를 연결합니다.
