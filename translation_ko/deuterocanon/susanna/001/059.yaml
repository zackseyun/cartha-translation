  rationale: 원문의 반어적 Ὀρθῶς는 ‘제대로’로, 자기 자신에게 돌아오는 심판의 이미지는 ‘자신의 머리 위에’로 유지했습니다. 단수 목적어 ‘당신을’과 마지막 복수 목적어 ‘당신들을’을 구별하여 원문의 수 전환을 보존했으며, 복수의 문맥상 범위는 각주로 밝혔습니다. 전체 문체는 현대 표준어 합쇼체로 통일했습니다.
