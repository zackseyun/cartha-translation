- from: 그러자 다니엘이 그에게 말했습니다. 「너도 네 머리 위에 대하여 제대로 거짓말을 했구나. 하나님의 천사가 칼을 들고 서서 너를 두 동강 내려 하여 너희를 멸하려고 기다리고 있기 때문이다.」[a]
