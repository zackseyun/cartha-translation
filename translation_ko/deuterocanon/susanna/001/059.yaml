  text: Then Daniel said to him[a], “You also have lied rightly against your own head; for the angel of God stands by, holding the sword to split you in two, so that he may destroy you.”
  footnotes:
  - marker: a
    text: The final 'you' is plural in Greek, indicating that the threatened destruction extends to both elders, not only the one presently addressed.
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 다니엘이 그에게 말했습니다. 「너도 네 머리 위에 대하여 제대로 거짓말을 했구나. 하나님의 천사가 칼을 들고 서서 너를 두 동강 내려 하여 너희를 멸하려고 기다리고 있기 때문이다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마지막 ‘너희를’은 헬라어 복수형으로, 지금 직접 꾸짖는 사람만이 아니라 두 장로 모두에게 멸망이 미친다는 뜻입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὀρθῶς ἔψευσαι
  english_pob_choice: have lied rightly
  chosen_korean: 제대로 거짓말을 했구나
  alternatives_korean:
  - 옳게 거짓말을 했구나
  - 바르게 거짓말을 했구나
  - 참으로 거짓말을 했구나
  lexicon: LSJ / BDAG
  rationale: ὀρθῶς의 반어적 뉘앙스를 살리되 한국어에서 자연스러운 조롱/판결 표현으로 옮겼습니다. ‘제대로’는 표면상 칭찬처럼 들리면서도 실제로는 심판 선언의 역설을 드러냅니다.
- source_word: εἰς τὴν σεαυτοῦ κεφαλήν
  english_pob_choice: against your own head
  chosen_korean: 네 머리 위에 대하여
  alternatives_korean:
  - 네 머리 위에
  - 네 머리 위로
  - 네 머리로
  lexicon: LSJ
  rationale: 자기에게 돌아오는 책임과 재앙의 관용구로 보고, 직역의 물리적 이미지와 한국어의 자연스러움을 함께 살리기 위해 ‘머리 위에 대하여’로 옮겼습니다.
- source_word: μένει
  english_pob_choice: stands by
  chosen_korean: 서서 기다리고 있기 때문이다
  alternatives_korean:
  - 서 있기 때문이다
  - 대기하고 있기 때문이다
  - 곁에 있기 때문이다
  lexicon: BDAG
  rationale: μένω의 ‘머무르다/서 있다’와 임박한 집행 상황을 함께 살려, 판결 수행 직전의 긴장을 한국어로 드러냈습니다.
- source_word: πρίσαι σε μέσον
  english_pob_choice: to split you in two
  chosen_korean: 너를 두 동강 내려 하여
  alternatives_korean:
  - 너를 둘로 가르려 하여
  - 너를 둘로 쪼개려 하여
  - 너를 반으로 가르려 하여
  lexicon: LSJ
  rationale: πρίζω의 ‘톱질하여 가르다’는 폭력성을 자연스러운 한국어 관용으로 옮기되, 과도한 완곡화를 피했습니다.
- source_word: ὑμᾶς
  english_pob_choice: you
  chosen_korean: 너희를
  alternatives_korean:
  - 너를
  - 당신들을
  - 두 사람을
  lexicon: BDAG
  rationale: 마지막 복수 대명사가 두 장로 모두를 가리킨다는 점을 본문 안에서 드러내기 위해 복수형 ‘너희를’를 사용했습니다.
theological_decisions:
- issue: 복수 대명사 ὑμᾶς의 범위
  chosen_reading: 본문에서 ‘너희를’로 옮겨 두 장로 모두에게 미치는 멸망 선언을 분명히 했습니다.
  alternative_readings:
  - 너를
  - 너희 모두를
