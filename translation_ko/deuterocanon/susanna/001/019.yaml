  text: And she said to the servant girls[a], “Bring me oil and ointments, and shut the doors of the garden, so that I may bathe.”
  footnotes:
  - marker: a
    text: Or “maidservants” for “servant girls.” The Greek term can denote girls or young female attendants; the context favors household attendants.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그녀가 하녀들에게[a] 말했습니다. “제게 기름과 향유를 가져오고, 제가 목욕할 수 있도록 정원 문들을 닫으십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시녀들’. 그리스어 κορασίοις는 소녀나 젊은 여성 시종을 가리킬 수 있으며, 이 문맥에서는 집안의 여성 시종을 뜻하는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κορασίοις
  english_pob_choice: servant girls
  chosen_korean: 하녀들
  alternatives_korean:
