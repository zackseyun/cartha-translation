  lexicon: LSJ
  rationale: δή가 붙은 직접적 요청을 한국어의 자연스러운 명령형으로 옮기되, 고전적 ‘데려오라’보다 현대어 ‘가져오다’가 물건에 더 적절합니다.
- source_word: σμήγματα
  english_pob_choice: ointments
  chosen_korean: 향유
  alternatives_korean:
