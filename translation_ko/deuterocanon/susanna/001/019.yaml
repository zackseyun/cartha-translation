  - 비누
  - 향료
  lexicon: LSJ
  rationale: σμήγματα는 몸을 문지르거나 바를 때 쓰는 준비물을 가리키므로, 목욕 장면에서 쓰이는 문맥을 살려 ‘향유’로 옮겼습니다. 다만 일반적 ‘기름’과 구별되도록 별도 항목으로 두었습니다.
- source_word: θύρας τοῦ παραδείσου
