  text: And she said to the servant girls[a], “Bring me oil and ointments, and shut the doors of the garden, so that I may bathe.”
  footnotes:
  - marker: a
    text: Or “maidservants” for “servant girls.” The Greek term can denote girls or young female attendants; the context favors household attendants.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 하녀들에게 말했습니다. 「제게 기름과 향유를 가져오고, 정원의 문들을 닫아 두십시오. 그러면 제가 목욕하겠습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시녀들’. 그리스어 κορασίοις는 소녀나 젊은 여자 종들을 가리킬 수 있으며, 이 문맥에서는 하녀로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κορασίοις
  english_pob_choice: servant girls
  chosen_korean: 하녀들
  alternatives_korean:
  - 여자아이들
  - 시녀들
  - 젊은 여자들
  lexicon: LSJ
  rationale: κοράσιον은 소녀/젊은 여성을 뜻할 수 있지만, 이 문맥에서는 수산나에게 시중드는 여성 종들이므로 기능을 드러내는 ‘하녀들’이 가장 자연스럽습니다.
- source_word: Ἐνέγκατε δή μοι
  english_pob_choice: Bring me
  chosen_korean: 제게 ... 가져오고
  alternatives_korean:
  - 제게 ... 가져다 주고
  - 제게 ... 가져오십시오
  lexicon: LSJ
  rationale: δή가 붙은 직접적 요청을 한국어의 자연스러운 명령형으로 옮기되, 고전적 ‘데려오라’보다 현대어 ‘가져오다’가 물건에 더 적절합니다.
- source_word: σμήγματα
  english_pob_choice: ointments
  chosen_korean: 향유
  alternatives_korean:
  - 연고
  - 비누
  - 향료
  lexicon: LSJ
  rationale: σμήγματα는 몸을 문지르거나 바를 때 쓰는 준비물을 가리키므로, 목욕 장면에서 쓰이는 문맥을 살려 ‘향유’로 옮겼습니다. 다만 일반적 ‘기름’과 구별되도록 별도 항목으로 두었습니다.
- source_word: θύρας τοῦ παραδείσου
  english_pob_choice: the doors of the garden
  chosen_korean: 정원의 문들
  alternatives_korean:
  - 정원의 대문
  - 동산의 문들
  - 정원의 문
  lexicon: LSJ
  rationale: παράδεισος는 이 문맥에서 울타리로 둘러싸인 정원/공원을 뜻하므로 ‘정원’이 적절하고, θύρας는 복수형을 살려 ‘문들’로 옮겼습니다.
theological_decisions:
- issue: 문을 닫는 목적절의 뉘앙스
  chosen_reading: ‘그러면 제가 목욕하겠습니다’로 목적절 ὅπως λούσωμαι를 자연스럽게 연결했습니다.
  alternative_readings:
  - ‘제가 씻겠습니다’
  - ‘제가 목욕할 수 있도록’
  rationale: λούομαι는 단순히 ‘씻다’보다 몸을 씻는/목욕하는 행위를 가리키므로, 장면의 구체성을 살려 ‘목욕하겠습니다’가 가장 직접적입니다.
  doctrine_reference: 서사 문맥과 동사 의미 보존
