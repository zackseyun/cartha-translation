  source_fidelity: 그리스어의 화자는 여성인 수산나인데 초안의 ‘그가’는 남성 대명사로 되어 있어 원문 및 문맥과 어긋납니다. 또한 ὅπως λούσωμαι는 목욕의 목적을 나타내므로 ‘그러면’보다 ‘제가 목욕할 수 있도록’으로 옮겨야 합니다.
  naturalness: ‘그녀가 하녀들에게 말했습니다’와 직접화법의 합쇼체 명령은 현대 표준 한국어에 자연스럽습니다. 목적절을 ‘정원 문들을 닫으십시오’에 직접 연결하면 논리 관계도 분명해집니다.
  terminology: κορασίοις의 문맥상 의미는 ‘하녀들’로 적절하며, 대안인 ‘시녀들’을 각주로 제시할 수 있습니다. σμήγματα는 목욕 때 몸에 바르거나 문지르는 물품이므로 ‘향유’는 가능한 번역입니다. ἔλαιον과 구별되는 복수 물품이라는 점도 유지됩니다.
