  text: And all the people returned with haste. And the elders said to him[a], “Come, sit in our midst and tell us, for God has given you eldership.”
  footnotes:
  - marker: a
    text: Or “God has given you eldership,” “God has given you preeminence,” or “God has given you the rank of an elder.” The Greek τὸ πρεσβεῖον denotes seniority or honored rank; here it refers to recognized authority rather than literal age.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 모든 백성이 서둘러 돌아갔습니다. 장로들이 그에게 말했습니다. 「이리 오십시오. 우리 가운데 앉으시고, 우리에게 알려 주십시오. 하나님께서 당신에게 장로의 지위를 주셨기 때문입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: τὸ πρεσβεῖον은 문자적으로는 ‘장로직’ 또는 ‘장로의 지위’를 뜻하며, 여기서는 나이보다 인정된 권위와 명예로운 지위를 가리킵니다.
    reason: lexical_alternative
