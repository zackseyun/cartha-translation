base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/050.yaml
  text: And all the people returned with haste. And the elders said to him[a], “Come, sit in our midst and tell us, for God has given you eldership.”
  footnotes:
  - marker: a
    text: Or “God has given you eldership,” “God has given you preeminence,” or “God has given you the rank of an elder.” The Greek τὸ πρεσβεῖον denotes seniority or honored rank; here it refers to recognized authority rather than literal age.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 모든 백성이 서둘러 돌아갔습니다. 장로들이 그에게 말했습니다. 「이리 오십시오. 우리 가운데 앉으시고, 우리에게 알려 주십시오. 하나님께서 당신에게 장로의 지위를 주셨기 때문입니다[a].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: τὸ πρεσβεῖον은 ‘장로의 지위’, ‘연장자나 원로의 지위’, 또는 ‘우선되는 명예로운 지위’를 뜻할 수 있습니다. 여기서는 실제 나이보다 공동체가 인정한 권위와 지위를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέστρεψεν πᾶς ὁ λαὸς
  english_pob_choice: all the people returned
  chosen_korean: 모든 백성이 서둘러 돌아갔습니다
  alternatives_korean:
  - 모든 백성이 돌아갔습니다
  - 온 백성이 돌아섰습니다
  lexicon: LSJ
  rationale: ἀνέστρεψεν은 여기서 단순한 방향 전환이 아니라 사람들의 복귀를 뜻하므로 ‘돌아갔습니다’가 자연스럽고, πᾶς ὁ λαὸς는 ‘모든 백성’으로 옮겼습니다.
- source_word: μετὰ σπουδῆς
  english_pob_choice: with haste
  chosen_korean: 서둘러
  alternatives_korean:
  - 급히
  - 간절히
  - 열심히
  lexicon: LSJ
  rationale: 이 문맥에서는 움직임의 신속성이 핵심이므로 ‘서둘러’가 가장 직접적으로 σπουδή의 속도 의미를 살립니다.
- source_word: οἱ πρεσβύτεροι
  english_pob_choice: the elders
  chosen_korean: 장로들이
  alternatives_korean:
  - 노인들이
  - 연장자들이
  lexicon: LSJ
  rationale: 이 단어는 단순한 나이보다 공동체 안에서 인정된 지도자들을 가리키므로, 한국어에서도 관용적인 공동체 직함인 ‘장로들’이 적절합니다.
- source_word: τὸ πρεσβεῖον
  english_pob_choice: eldership / senior standing / rank of an elder
  chosen_korean: 장로의 지위
  alternatives_korean:
  - 장로직
  - 연장자의 지위
  - 우선되는 지위
  lexicon: LSJ
  rationale: Greek의 πρεσβεῖον은 나이 자체가 아니라 인정된 지위와 권위를 뜻하므로, ‘장로의 지위’가 본문의 사회적·법정적 함의를 비교적 직접적으로 살립니다.
theological_decisions:
- issue: τὸ πρεσβεῖον의 의미가 다니엘의 실제 연령이 아니라 부여된 권위라는 점
  chosen_reading: 하나님께서 다니엘에게 장로로서의 인정된 지위를 주신 것으로 옮겼습니다.
  alternative_readings:
  - 하나님께서 당신에게 장로직을 주셨습니다
  - 하나님께서 당신에게 장로의 권위를 주셨습니다
  rationale: 수산나 본문에서는 다니엘이 젊은 인물로 제시되므로, ‘장로의 지위’는 나이가 아니라 하나님이 부여하신 공적 권위를 드러내어 원문의 긴장을 보존합니다.
  doctrine_reference: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.
