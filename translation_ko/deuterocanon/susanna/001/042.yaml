  yaml_path: translation/deuterocanon/susanna/001/042.yaml
  text: And Susanna cried out with a loud voice and said, “O eternal God, knower of the hidden things, who knows all things before they come to be,”
  footnotes:
  - marker: a
    text: Or 'knower of secrets' for 'knower of the hidden things.'
    reason: lexical_alternative
  - marker: b
    text: Or 'before their existence' or 'before they happen.' The Greek can refer broadly to things before they come into being.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 수산나는 큰 소리로 외쳐 말했습니다. 「오 영원하신 하나님, 숨은 것들의 아시는 이시여, 모든 것을 그것들이 생겨나기 전에 아시는 분이시여,」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘비밀들의 아시는 이’. κρυπτά는 넓게 ‘숨은 것들’을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것들이 존재하기 전에’ 혹은 ‘그것들이 일어나기 전에’. ελλην어는 사물의 발생 이전을 넓게 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνεβόησεν δὲ φωνῇ μεγάλῃ
  english_pob_choice: cried out with a loud voice
  chosen_korean: 큰 소리로 외쳐
  alternatives_korean:
  - 큰 목소리로 외쳐
  - 소리 높여 외쳐
  lexicon: LSJ
  rationale: ἀνεβόησεν과 φωνῇ μεγάλῃ의 강한 외침과 음성의 크기를 자연스러운 한국어로 살렸습니다.
- source_word: Ὁ θεὸς ὁ αἰώνιος
  english_pob_choice: O eternal God
  chosen_korean: 오 영원하신 하나님
  alternatives_korean:
  - 오 영원한 하나님
  - 오 영세하신 하나님
  lexicon: LSJ
  rationale: 직접 부르는 기도문이므로 호격 감탄을 살렸고, αἰώνιος는 ‘영원하신’으로 옮겨 직접 주소의 격식을 유지했습니다.
- source_word: ὁ τῶν κρυπτῶν γνώστης
  english_pob_choice: knower of the hidden things
  chosen_korean: 숨은 것들의 아시는 이
  alternatives_korean:
  - 비밀들을 아시는 이
  - 은밀한 것들을 아시는 이
  lexicon: LSJ
  rationale: κρυπτά를 단순히 ‘비밀’로 좁히기보다, 영어 POB의 ‘hidden things’에 맞춰 ‘숨은 것들’로 두어 더 넓은 의미를 보존했습니다.
- source_word: πρὶν γενέσεως αὐτῶν
  english_pob_choice: before they come to be
  chosen_korean: 그것들이 생겨나기 전에
  alternatives_korean:
  - 그것들이 존재하기 전에
  - 그것들이 일어나기 전에
  lexicon: LSJ
  rationale: γενέσεως는 ‘존재’보다 ‘생겨남/생김’의 뉘앙스가 더 직접적이므로, 사물이 아직 생겨나기 전이라는 의미를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 하나님의 선재적 지식 표현
  chosen_reading: ‘모든 것을 그것들이 생겨나기 전에 아시는 분’으로 옮겨, 본문이 말하는 창조 이전/발생 이전의 지식을 그대로 유지했습니다.
  alternative_readings:
  - ‘모든 것을 존재하기 전에 아시는 분’
  - ‘모든 일을 일어나기 전에 아시는 분’
  rationale: 본문은 하나님의 전지와 선재적 인지를 분명히 말하지만, 그 범위를 체계적으로 확장하기보다 본문 자체의 긴장을 보존하는 쪽이 더 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
