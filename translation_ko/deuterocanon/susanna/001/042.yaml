    rationale: αὐτῶν은 τὰ πάντα를 받습니다. ‘모든 것이 생겨나기 전에 모든 것을 아시는’은 원문의 선재적 지식과 ‘모든 것’의 포괄성을 유지하면서 자연스럽습니다.
  - severity: low
    issue: 각주 b의 ‘ελλην어’ 표기가 부정확합니다.
    rationale: 한국어 각주에서는 ‘그리스어’로 표기하는 것이 정확하고 자연스럽습니다.
