translation:
  language: ko
  text: 그러자 수산나는 큰 소리로 외쳐 말했습니다. “오 영원하신 하나님, 숨은 것들을 아시는 분이시며[a], 모든 것이 생겨나기 전에 모든 것을 아시는 분이시여,[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘비밀을 아시는 분’. κρυπτά는 넓게 ‘숨은 것들’을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것들이 존재하기 전에’ 혹은 ‘그것들이 일어나기 전에’. 그리스어는 사물이나 일이 생겨나기 이전을 넓게 가리킬 수 있습니다.
    reason: alternative_reading
