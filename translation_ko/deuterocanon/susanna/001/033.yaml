  text: And all those with her were weeping[a], and all who knew her were weeping.
  footnotes:
  - marker: a
    text: Or, 'all who were with her' for 'all those with her'; the Greek phrase can refer broadly to those in her company or household.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그와 함께 있던 모든 사람이 울었고, 그를 알던 모든 사람도 모두 울었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그와 함께 있던 사람들’로도 옮길 수 있습니다. 그리스어 구문은 그녀와 동행한 사람들뿐 아니라 그녀의 주변/가정 사람들까지 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκλαιον
  english_pob_choice: were weeping
  chosen_korean: 울었습니다
  alternatives_korean:
  - 울고 있었습니다
  - 통곡했습니다
  lexicon: BDAG
  rationale: 미완료 시제로 지속적 슬픔을 나타내지만, 한국어에서는 반복·지속의 뉘앙스를 자연스럽게 담는 서술형 과거가 가장 읽기 좋습니다.
- source_word: οἱ παρ᾽ αὐτῆς πάντες
  english_pob_choice: all those with her
  chosen_korean: 그와 함께 있던 모든 사람
  alternatives_korean:
  - 그의 곁에 있던 모든 사람
  - 그와 함께한 모든 이
  lexicon: LSJ
  rationale: παρ᾽ αὐτῆς는 문자적으로는 ‘그녀 곁에/그녀와 함께’의 범위이므로, English POB의 해석을 따라 관계를 드러내되 과도한 신분 추정은 피했습니다.
- source_word: ὅσοι αὐτὴν ᾔδεισαν πάντες
  english_pob_choice: all who knew her
  chosen_korean: 그를 알던 모든 사람도 모두
  alternatives_korean:
  - 그를 아는 모든 사람도 모두
  - 그와 친분이 있던 모든 사람도 모두
  lexicon: BDAG
  rationale: ὅσοι + ᾔδεισαν은 ‘아는/알던 사람들’을 뜻하므로, ‘알던’으로 자연스럽게 옮기고 반복된 πάντες를 ‘모두’로 살렸습니다.
- source_word: πάντες ... πάντες
  english_pob_choice: all ... all
  chosen_korean: 모든 ... 모두
  alternatives_korean:
  - 다 ... 다
  - 온전히 ... 온전히
  lexicon: LSJ
  rationale: 두 절의 πάντες 반복은 공동체적 애도의 범위를 강조하므로, 한국어에서도 ‘모든/모두’의 반복으로 강조를 유지했습니다.
