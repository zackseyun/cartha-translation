  text: And all those with her were weeping[a], and all who knew her were weeping.
  footnotes:
  - marker: a
    text: Or, 'all who were with her' for 'all those with her'; the Greek phrase can refer broadly to those in her company or household.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그녀와 함께 있던 사람들은[a] 모두 울고 있었고, 그녀를 아는 사람들도 모두 울고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀 곁에 있던 모든 사람들’로 옮길 수 있습니다. 그리스어 구문은 그녀와 함께 있던 사람들뿐 아니라 그녀의 주변 사람들 또는 가정 사람들을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκλαιον
  english_pob_choice: were weeping
  chosen_korean: 울었습니다
  alternatives_korean:
  - 울고 있었습니다
