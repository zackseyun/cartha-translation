base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/025.yaml
  text: It is preferable for me to fall into your hands without doing it rather than to sin before the Lord[a].
  footnotes:
  - marker: a
    text: Literally, 'not having done [it].' The Greek leaves the act implicit, referring back to the elders' demand.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 일을 하지 않고 너희 손에 넘어가는 것이 주님 앞에서 죄를 짓는 것보다 내게는 더 낫습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘그것을 하지 않은 채’입니다. 헬라어는 그 행위를 직접 말하지 않고, 장로들의 요구를 가리켜 암시합니다.
    reason: source_note
lexical_decisions:
- source_word: αἱρετόν
  english_pob_choice: preferable
  chosen_korean: 더 낫습니다
  alternatives_korean:
  - 차라리 좋습니다
  - 선택할 만합니다
  lexicon: LSJ
  rationale: 비교 우위의 의미를 자연스러운 현대 한국어로 옮기되, 도덕적 선택의 강한 대비를 살리기 위해 ‘차라리 … 더 낫습니다’로 렌더링했습니다.
- source_word: μὴ πράξασαν
  english_pob_choice: without doing it
  chosen_korean: 그것을 행하지 않은 채
  alternatives_korean:
  - 그것을 하지 않고
  - 그 일을 하지 않은 채
  lexicon: BDAG
  rationale: 헬라어가 요구된 행위를 암시적으로 가리키므로, 본문이 요구하는 최소한의 명시만 더해 ‘그것’을 보존했습니다.
- source_word: ἐμπεσεῖν εἰς τὰς χεῖρας ὑμῶν
  english_pob_choice: to fall into your hands
  chosen_korean: 너희의 손에 떨어지느니보다
  alternatives_korean:
  - 너희의 손에 들어가느니보다
  - 너희의 권세 아래 들어가느니보다
  lexicon: LSJ
  rationale: ‘손에 떨어지다’는 관용적 표현을 살려 상대의 지배와 위험을 함께 드러냈습니다.
- source_word: ἁμαρτεῖν ἐνώπιον Κυρίου
  english_pob_choice: to sin before the Lord
  chosen_korean: 주님 앞에서 죄를 짓는 것
  alternatives_korean:
  - 주님 앞에서 죄짓는 것
  - 주님 앞에서 범죄하는 것
  lexicon: BDAG
  rationale: ‘ἐνώπιον’의 전면성과 책임성을 ‘앞에서’로 살리고, ‘죄를 짓다’로 직접적인 윤리적 의미를 유지했습니다.
theological_decisions:
- issue: Κυρίου의 번역 대상
  chosen_reading: 주님
  alternative_readings:
  - 하나님
  - 주
  rationale: 이 문맥에서 Κυρίου는 신적 권위 앞에서의 죄책을 가리키므로, 한국어에서 친숙하면서도 경외를 담는 ‘주님’으로 옮겼습니다.
  doctrine_reference: 야훼/κύριος 번역 원칙
- issue: 말하는 이의 긴박한 자기방어와 도덕적 선택
  chosen_reading: 수치와 폭력보다 죄를 피하려는 비교를 직설적으로 유지
  alternative_readings:
  - 완곡하게 표현
  - ‘그것’의 내용을 명시
  rationale: 본문은 행위의 구체적 내용을 직접 말하지 않고 암시하므로, 그 긴장을 해소하지 않고 비교 구조를 그대로 살렸습니다.
  doctrine_reference: source-text restraint / preserve tension
