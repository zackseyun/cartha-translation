  lexicon: BDAG
  rationale: 반복되는 담화 표지로서 अचानक 눈에 띄는 장면 전환을 살리되, 현대 한국어에서 자연스럽고 격식을 지킬 수 있는 표현으로 옮겼습니다.
- source_word: κατὰ τὸ εἰωθὸς
