  rationale: 습관적·상례적 행동을 가리키는 관용구이므로, 지나치게 설명적이지 않으면서도 일상적인 반복성을 드러내는 표현을 택했습니다.
- source_word: πρεσβυτέρων
  english_pob_choice: elders
  chosen_korean: 장로들
  alternatives_korean:
  - 어른들
  - 노인들
  lexicon: BDAG
  rationale: 이 책에서는 나이 든 남성들이면서 공동체 내 역할을 가진 인물들이므로, 단순한 연장자가 아니라 지위까지 함께 드러내는 ‘장로들’이 적절합니다.
- source_word: ὄρθρου
  english_pob_choice: so early in the morning
  chosen_korean: 그렇게 일찍
  alternatives_korean:
  - 새벽에
  - 이른 아침에
  lexicon: BDAG
  rationale: 시간 부사를 직접적으로 옮기면서도 한국어 문장에서 자연스럽게 들리도록 하였고, 영어 POB의 완화된 표현처럼 과도하게 설명하지 않았습니다.
- source_word: παραλαβὼν με
  english_pob_choice: without taking me along
  chosen_korean: 나를 데려가지 않고
  alternatives_korean:
  - 나를 데리고 가지 않고
  - 나를 함께 데려가지 않고
  lexicon: BDAG
  rationale: 함께 동행시키지 않았다는 뜻을 직설적으로 살려, 화자의 원망 섞인 질문이 드러나도록 했습니다.
theological_decisions:
- issue: 장면의 급작스러운 전환과 두 장로의 엇갈린 등장 순서
  chosen_reading: 문장을 매끄럽게 정리하지 않고, ‘이미 와 있었고’와 ‘다른 한 사람이 도착하였습니다’를 병렬로 두어 원문의 급한 전개를 유지했습니다.
  alternative_readings:
  - 문맥을 부드럽게 정리한 순차적 서술
  - 두 인물의 등장 순서를 재배열한 번역
  rationale: 영문 POB가 지적한 것처럼 이 절은 서술이 다소 어색하므로, 그 어색함을 제거하면 원문의 서술 효과와 긴장감이 약해집니다.
  doctrine_reference: 문학적 정직성 및 원문-기반 번역 원칙
