revisions:
- from: 그리고 보십시오[a], 그 여인은 평소처럼 걸어다니고 있었습니다. 그때 장로들 가운데 한 사람이 이미 와 있었고, 보십시오, 다른 한 사람이 도착하였습니다[b]. 그리고 그가 다른 사람에게 따져 말했습니다. 「왜 나를 데려가지 않고 그렇게 일찍 나갔습니까?」
  to: 그리고 보십시오[a], 그 여인은 평소처럼 걸어 다니고 있었습니다. 장로들 가운데 한 사람이 와 있었고, 보십시오, 다른 한 사람이 도착하였으며, 그는 다른 한 사람에게[b] 이렇게 물었습니다. 「왜 나를 데리고 가지 않고 그렇게 이른 아침에 나갔습니까?」
  rationale: 원문의 연속적인 장면 전개와 두 장로에 관한 다소 어색한 지시 관계는 보존하되, 한국어에서 부자연스럽고 의미를 과도하게 강화하는 ‘따져 말했습니다’를 직접 발화를 도입하는 ‘이렇게 물었습니다’로 고쳤습니다. 또한 ὄρθρου의 ‘이른 아침’이라는 시간 정보를 명시했습니다. 주석 표지는 문제의 지시 전환이 실제로 드러나는 두 번째 ‘다른 한 사람’에 연결했습니다.
  reviewer_model: gpt-5.6-terra
