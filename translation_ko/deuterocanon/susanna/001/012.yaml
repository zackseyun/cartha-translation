base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/012.yaml
  text: And behold[a], she was walking about as usual, and one of the elders had come, and behold, the other arrived, and he questioned the other, saying[b], “Why did you go out so early without taking me along?”
  footnotes:
  - marker: a
    text: Or “behold” for each occurrence of the Greek discourse marker ἰδοὺ.
    reason: lexical_alternative
  - marker: b
    text: The Greek text in this verse is narratively awkward, with rapid shifts between the two elders (“one” and “the other”). The translation preserves the sequence without smoothing away the source’s abruptness.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 보십시오[a], 그 여인은 평소처럼 걸어다니고 있었습니다. 그때 장로들 가운데 한 사람이 이미 와 있었고, 보십시오, 다른 한 사람이 도착하였습니다[b]. 그리고 그가 다른 사람에게 따져 말했습니다. 「왜 나를 데려가지 않고 그렇게 일찍 나갔습니까?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 담화 표지 ἰδοὺ는 여기서도 반복되어, 단순한 정보 전달보다 ‘보십시오’라는 주의 환기를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 본문은 두 장로(‘한 사람’과 ‘다른 한 사람’)의 호칭이 급하게 바뀌어 다소 어색합니다. 번역은 그 순서를 매끄럽게 다듬지 않고 그대로 살렸습니다.
    reason: textual_variant
lexical_decisions:
