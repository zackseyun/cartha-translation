    rationale: 이 동사는 이 문맥에서 상대에게 질문하는 행위를 나타냅니다. ‘따지다’는 원문에 없는 비난·추궁의 정서를 추가할 수 있으므로 ‘물었습니다’가 더 충실합니다.
  - severity: low
    issue: 두 번째 ‘다른 한 사람’에 대한 주석 표지가 도착 장면에만 붙어 있어 지시 대상의 급격한 전환을 가리키기에 덜 명확합니다.
    rationale: 주석은 ‘그는 다른 한 사람에게’라는 표현에도 직접 연결하는 편이 그리스어 서술의 어색한 지시 전환을 더 정확히 안내합니다.
