  source_fidelity: 핵심 사건 순서와 인물 식별은 대체로 충실합니다. 다만 현재 번역은 ‘불법한 의도’와 ‘수산나를 죽이려는 마음’을 겹쳐 표현하여 πλήρεις τῆς ἀνόμου ἐννοίας 및 목적 부정사 τοῦ θανατῶσαι αὐτήν의 관계를 다소 중복적으로 만듭니다. 이를 ‘수산나를 죽이려는 불법한 의도’로 통합하면 수산나를 겨냥한 적대성과 죽이려는 목적을 자연스럽게 보존합니다.
  naturalness: ‘이튿날에’는 가능하지만 현대 서술에서는 ‘이튿날’이 더 매끄럽습니다. 또한 ‘수산나, 곧 … 그 여인을’은 그리스어의 공식 신원 확인을 한국어에서 다소 부자연스럽게 반복합니다. ‘힐기야의 딸이며 요아킴의 아내인 수산나’가 자연스럽고 명료합니다.
  terminology: πρεσβῦται는 이 문맥에서 ‘장로’가 적절합니다. ἄνομος ἐννοία는 ‘불법한 의도’로 유지할 수 있으며, ‘불러오십시오’는 공개 소환 명령 Ἀποστείλατε ἐπὶ Σουσάνναν을 현대 합쇼체로 적절히 옮깁니다. 힐기야, 요아킴, 수산나의 표기도 일관되고 적절합니다.
