    rationale: 두 표현 모두 내적 의도/마음을 나타내어 ἐννοία를 중복 번역합니다. ‘수산나를 죽이려는 불법한 의도’로 통합하면 원문의 적대 방향과 목적을 보존하면서도 자연스럽습니다.
