  yaml_path: translation/deuterocanon/susanna/001/029.yaml
  text: And it happened on the next day[a], when the people had gathered to her husband Joakim, that the two elders came, full of their lawless intent against Susanna to put her to death, and they said before the people, “Send for Susanna daughter of Hilkiah, who is the wife of Joakim.”
  footnotes:
  - marker: a
    text: Or 'full of lawless purpose' or 'filled with unlawful design.' The Greek emphasizes an inward plan or intention that is contrary to law.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이튿날에 백성이 그의 남편 요아킴에게 모였을 때, 그 두 장로가 그들의 불법한 의도를 품고 수산나를 죽이려는 마음으로 와서 백성 앞에서 말했습니다. “수산나, 곧 힐기야의 딸이며 요아킴의 아내인 그 여인을 불러오십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘불법한 의도’는 단순한 악의가 아니라, 율법에 어긋나는 내적 계획이라는 뜻을 살립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ ἐπαύριον
  english_pob_choice: on the next day
  chosen_korean: 이튿날에
  alternatives_korean:
  - 다음 날에
  - 그 다음 날에
  lexicon: LSJ
  rationale: 자연스러운 현대 서술로 시간 순서를 분명히 하면서, 고어적인 느낌을 피했습니다.
- source_word: οἱ δύο πρεσβῦται
  english_pob_choice: the two elders
  chosen_korean: 그 두 장로
  alternatives_korean:
  - 그 두 노인
  - 그 두 원로
  lexicon: LSJ
  rationale: 단순한 연령이 아니라 공동체의 권위 있는 인물로 제시되므로 ‘장로’가 문맥을 가장 잘 살립니다.
- source_word: πλήρεις τῆς ἀνόμου ἐννοίας
  english_pob_choice: full of their lawless intent
  chosen_korean: 그들의 불법한 의도를 품고
  alternatives_korean:
  - 불법한 의도로 가득 차서
  - 그들의 불법한 계획으로 가득하여
  lexicon: BDAG
  rationale: ἐννοία의 내적 ‘생각/의도’와 ἄνομος의 ‘율법에 어긋나는’ 성격을 함께 살리기 위해, 단순 상태보다 ‘품고’로 옮겼습니다.
- source_word: κατὰ Σουσάννης
  english_pob_choice: against Susanna
  chosen_korean: 수산나를 죽이려는 마음으로
  alternatives_korean:
  - 수산나에 대하여
  - 수산나를 향해
  lexicon: BDAG
  rationale: κατά+속격의 적대 방향을 문맥상 자연스럽게 드러내기 위해 ‘죽이려는 마음으로’와 결합해 적대성을 명시했습니다.
- source_word: Ἀποστείλατε ἐπὶ Σουσάνναν
  english_pob_choice: Send for Susanna
  chosen_korean: 수산나… 그 여인을 불러오십시오
  alternatives_korean:
  - 수산나를 보내어 데려오십시오
  - 수산나를 데려오십시오
  lexicon: LSJ
  rationale: 공개 석상에서의 소환 명령이라는 점을 살려, 한국어로는 자연스러운 공적 명령인 ‘불러오십시오’로 옮겼습니다.
theological_decisions:
- issue: 공적 발화에서의 명령형 존대
  chosen_reading: 백성 앞에서의 공개 소환 명령은 합쇼체 명령으로 옮기되, 인용문 내부도 동일한 공적 말투를 유지했습니다.
  alternative_readings:
  - 반말형 명령
  - 더 완곡한 요청형 표현
  rationale: 이 장면은 사적인 대화가 아니라 군중 앞의 공식적 지시이므로, 한국어에서도 권위와 공적 성격이 드러나도록 했습니다.
  doctrine_reference: Translation philosophy §5 (문맥에 따른 문체 일관성)
