base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/010/023.yaml
  text: But I myself came forward of my own accord[a], so that by killing me also, you may incur punishment from heavenly justice for still more acts of wrongdoing.
  footnotes:
  - marker: a
    text: Or 'the justice of heaven' or 'heavenly judgment.' The Greek does not explicitly name God here, but refers to transcendent justice associated with heaven.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 저 자신은 자청해서 나아갔습니다[a]. 그래서 저를 죽이게 되더라도, 당신은 더 많은 불의한 행위들로 인해 하늘의 정의로부터 형벌을 받게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘의 정의’ 혹은 ‘하늘의 심판’입니다. 헬라어는 여기서 하나님을 직접 이름하지 않고, 하늘과 관련된 초월적 정의를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρῆλθον
  english_pob_choice: came forward
  chosen_korean: 자청해서 나아갔습니다
  alternatives_korean:
  - 나아갔습니다
  - 앞으로 나왔습니다
  - 나섰습니다
  lexicon: BDAG
  rationale: 자기 의사로 스스로를 내세운다는 문맥을 살리기 위해, 단순한 이동보다 자발적 결단을 드러내는 표현을 택했습니다.
- source_word: ἀπʼ ἐμαυτοῦ
  english_pob_choice: of my own accord
  chosen_korean: 자청해서
  alternatives_korean:
  - 내 뜻으로
  - 스스로
  - 자발적으로
  lexicon: BDAG
  rationale: 관용적으로 ‘스스로의 의사로’라는 뜻이므로, 한국어에서 자연스럽고 자기주도성을 분명히 하는 ‘자청해서’로 옮겼습니다.
- source_word: τῇ οὐρανίᾳ δίκῃ
  english_pob_choice: heavenly justice
  chosen_korean: 하늘의 정의
  alternatives_korean:
  - 하늘의 न्याय
  - 하늘의 공의
  - 천상의 정의
  lexicon: LSJ
  rationale: 본문은 하나님을 직접 명시하지 않고 하늘과 연결된 초월적 정의를 말하므로, ‘정의’로 기본 의미를 살리되 종교적 해석을 과도하게 좁히지 않았습니다.
- source_word: τιμωρίαν
  english_pob_choice: punishment
  chosen_korean: 형벌
  alternatives_korean:
  - 벌
  - 처벌
  - 응보
  lexicon: BDAG
  rationale: 법적·보응적 결과를 가리키는 말이므로, 현대 한국어에서 엄정한 응보를 드러내는 ‘형벌’이 가장 적절합니다.
theological_decisions:
- issue: τῇ οὐρανίᾳ δίκῃ의 신학적 절제된 번역
