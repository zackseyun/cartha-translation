  yaml_path: translation/deuterocanon/4_maccabees/010/023.yaml
  text: But I myself came forward of my own accord[a], so that by killing me also, you may incur punishment from heavenly justice for still more acts of wrongdoing.
  footnotes:
  - marker: a
    text: Or 'the justice of heaven' or 'heavenly judgment.' The Greek does not explicitly name God here, but refers to transcendent justice associated with heaven.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 저는 스스로 나아왔습니다. 당신이 저까지 죽여 더 많은 불의한 행위에 대하여 하늘의 정의[a]로부터 형벌을 받도록 하려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘의 정의’ 혹은 ‘하늘의 심판’입니다. 헬라어는 여기서 하나님을 직접 이름하지 않고, 하늘과 관련된 초월적 정의를 가리킵니다.
    reason: lexical_alternative
