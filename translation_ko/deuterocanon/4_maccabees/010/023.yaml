  rationale: 헬라어는 하나님을 직접 부르지 않고 초월적 정의를 암시하므로, 의미를 분명히 하되 본문의 절제를 유지하는 번역을 택했습니다.
  doctrine_reference: 원문 우선 원칙; 명시되지 않은 신적 명칭을 번역이 앞서 단정하지 않음
