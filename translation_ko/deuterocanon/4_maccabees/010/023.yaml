  source_fidelity: 목적을 나타내는 ὅπως와 수단/수반 상황을 나타내는 κατακτείνας의 관계를 더 분명히 드러낼 필요가 있습니다. 초안의 ‘죽이게 되더라도’는 양보·가정의 뜻을 더하여 원문의 ‘나까지 죽임으로써’라는 뜻을 약화합니다. 또한 περὶ πλειόνων ἀδικημάτων은 형벌의 근거가 되는 더 많은 불의한 행위를 가리킵니다.
