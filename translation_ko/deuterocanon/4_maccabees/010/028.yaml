  text: Now look[a], being alien to God[c][b], you are making war against those who are reverent toward God.
  footnotes:
  - marker: a
    text: Or, 'being alien to God' or 'being foreign to God.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'you fight against' or 'you wage war against.'
    reason: lexical_alternative
  - marker: c
    text: Literally, 'those acting reverently toward God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 보십시오. 하나님에게서 멀어진 채로, 당신은 하나님을 경외하는 이들과 전쟁하고 있습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '하나님에게서 멀어진 채로', '하나님에게서 소외된 채로'.
    reason: lexical_alternative
  - marker: b
    text: 또는 '전쟁하고 있습니다', '싸우고 있습니다', '대적하고 있습니다'.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 '하나님을 향하여 경외를 행하는 이들'입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν ἰδὲ
  english_pob_choice: Now look
  chosen_korean: 이제 보십시오
  alternatives_korean:
  - 이제 보십시오
  - 자, 보십시오
  - 이제 보라
  lexicon: LSJ
  rationale: νῦν은 논지를 꺾어 현재의 결론을 제시하고, ἰδὲ는 주의를 끄는 명령이므로 현대 한국어의 공손한 호소형으로 옮겼습니다.
- source_word: ἀλλότριος ὢν θεοῦ
  english_pob_choice: being alien to God
  chosen_korean: 하나님에게서 멀어진 채로
  alternatives_korean:
  - 하나님에게서 소외된 채로
  - 하나님에게서 낯선 자로
  - 하나님에게서 멀리 떨어진 채로
  lexicon: LSJ
  rationale: ἀλλότριος는 단순한 이방성보다 관계적 소외를 뜻하므로, 본문의 정죄적 긴장을 살리면서도 자연스러운 한국어로 '멀어진 채로'를 택했습니다.
- source_word: πολεμεῖς
  english_pob_choice: you are making war against
  chosen_korean: 전쟁하고 있습니다
  alternatives_korean:
  - 싸우고 있습니다
  - 대적하고 있습니다
  - 전쟁을 벌이고 있습니다
  lexicon: LSJ
  rationale: πολεμέω는 단순한 반대가 아니라 적대적 전쟁 행위를 뜻하므로, 현재진행의 공격성을 살려 '전쟁하고 있습니다'로 옮겼습니다.
- source_word: τοὺς εὐσεβοῦντας εἰς τὸν θεόν
  english_pob_choice: those who are reverent toward God
  chosen_korean: 하나님을 경외하는 이들
  alternatives_korean:
  - 하나님을 경외하는 사람들
  - 하나님께 경건한 이들
  - 하나님께 경외를 드리는 이들
  lexicon: LSJ
  rationale: εὐσεβοῦντας는 단순한 윤리적 선함보다 하나님을 향한 경외와 경건의 행위를 가리키므로, '경외하는 이들'이 문맥의 예배적 방향을 가장 직접적으로 드러냅니다.
