  lexicon: LSJ
  rationale: κολαστήριον의 구체적 도구성은 살리되, POB의 ‘instrument of punishment’에 맞춰 지나치게 특정한 고문 기구로 좁히지 않았습니다.
- source_word: τῷ σώματί μου
