base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/010/004.yaml
  text: In response to this[a], if you have any instrument of punishment, bring it against my body; for my soul, even if you wish it[b], you will not touch.
  footnotes:
  - marker: a
    text: Or 'if you have any means of punishment' or 'if you have any torture device'; the Greek term refers concretely to an instrument or means of punishing.
    reason: lexical_alternative
  - marker: b
    text: Or 'my life'; the Greek ψυχή can mean 'life' as well as 'soul,' but here 'soul' best matches the contrast with 'body.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이에 대하여, 만일 너희에게 어떤 형벌의 도구가 있다면 내 몸에 대십시오. 그러나 내 영혼은, 원하더라도, 너희가 건드릴 수 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형벌의 도구’는 그리스어 κολαστήριον의 구체적·도구적 의미를 반영한 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘영혼’은 여기서 σώμα와 대조되는 ψυχή를 따른 번역이며, 문맥상 ‘목숨/생명’으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ταῦτα
  english_pob_choice: In response to this
  chosen_korean: 이에 대하여
  alternatives_korean:
  - 이 일에 대해
  - 이에 응하여
  lexicon: LSJ
  rationale: 대화의 응답을 여는 담화 표지로서, 문맥의 반응성을 살리되 한국어를 자연스럽고 간결하게 만들었습니다.
- source_word: εἴ τι ἔχετε κολαστήριον
  english_pob_choice: if you have any instrument of punishment
  chosen_korean: 어떤 형벌의 도구가 있다면
