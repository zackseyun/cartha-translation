review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the concrete punitive instrument (κολαστήριον), the body/soul contrast, and the concessive force of οὐδʼ ἂν θέλητε. However, the final Korean clause shifts awkwardly from ‘my soul’ as grammatical subject to ‘you’ as the actor and renders the future assertion less directly than the Greek.
  naturalness: ‘내 영혼은, 원하더라도, 너희가 건드릴 수 없습니다’ is grammatically strained in modern Korean. Recasting it with 너희 as subject and ‘손대지 못할 것입니다’ produces natural formal-polite Korean while retaining the force of the statement.
  terminology: ‘형벌의 도구,’ ‘몸,’ and ‘영혼’ are appropriate. ‘영혼’ rightly preserves ψυχή’s contrast with σώμα; the note responsibly records ‘목숨/생명’ as a possible lexical sense without displacing the contextual rendering.
  issues:
  - severity: medium
    issue: The final clause has awkward subject construction and does not clearly preserve the Greek future.
    rationale: The Greek explicitly states that the persecutors will not touch the speaker’s ψυχή, even if they wish to. In Korean, ‘너희는 내 영혼에 손대지 못할 것입니다’ directly expresses this relation and future force.
  - severity: low
    issue: Footnote anchors are both placed at the end rather than next to the terms they explain.
    rationale: Placing [a] immediately after ‘형벌의 도구’ and [b] immediately after ‘영혼’ makes each note’s scope clear.
  revised_text: 이에 대하여, 너희에게 어떤 형벌의 도구가 있다면 그것을 내 몸에 대십시오.[a] 너희가 원한다 해도 내 영혼에는 손대지 못할 것입니다.[b]
