translation:
  language: ko
  text: 그러나 우리는, 오 가장 더러운 폭군이여, 하나님의 훈련과 덕을 위해 이 일들을 겪고 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἡμεῖς μέν
  english_pob_choice: But we
  chosen_korean: 그러나 우리는
  alternatives_korean:
  - 우리는
  - 우리로서는
  lexicon: LSJ
  rationale: μέν은 앞뒤를 대조하는 표지이므로, 한국어에서는 자연스러운 역접인 ‘그러나’로 앞의 상황과 대비를 드러냈습니다.
- source_word: ὦ μιαρώτατε τύραννε
  english_pob_choice: O most defiled tyrant
  chosen_korean: 오 가장 더러운 폭군이여
  alternatives_korean:
  - 오 가장 더럽혀진 폭군이여
  - 오 가장 추악한 폭군이여
  lexicon: LSJ
  rationale: μιαρώτατε는 도덕적 비난을 담은 ‘더럽다/더럽혀지다’의 최상급이므로, 격앙된 직접 호칭을 살려 ‘오 …이여’로 옮겼습니다.
- source_word: διὰ παιδείαν καὶ ἀρετὴν θεοῦ
  english_pob_choice: for the sake of the discipline and virtue of God
  chosen_korean: 하나님의 훈련과 덕을 위해
  alternatives_korean:
  - 하나님의 징계와 덕을 위해
  - 하나님의 교육과 덕을 위해
  - 하나님의 훈육과 탁월함을 위해
  lexicon: LSJ
  rationale: παιδεία는 단순한 교육이 아니라 형성·훈련·훈육의 뜻을 가지므로 ‘훈련’이 가장 무난하며, ἀρετή는 윤리적 탁월함을 가리켜 ‘덕’으로 옮겼습니다.
- source_word: θεοῦ
  english_pob_choice: of God
  chosen_korean: 하나님의
  alternatives_korean:
  - 하나님께 속한
  - 하나님으로부터 오는
  lexicon: LSJ
  rationale: θεοῦ는 뒤의 두 명사 모두를 수식하는 속격이므로, 한국어에서는 반복을 피하면서도 하나님과의 관계를 분명히 하는 관형격 ‘하나님의’로 처리했습니다.
theological_decisions:
- issue: διὰ + 목적어의 의미 범위
  chosen_reading: 이 일들을 ‘위하여’ 겪는다는 목적·원인적 뉘앙스를 살리되, 문맥상 순교적 인내를 강조하는 표현으로 정리했습니다.
  alternative_readings:
  - ~때문에 이 일들을 겪고 있습니다
  - 하나님의 훈련과 덕 때문에 이 일들을 겪고 있습니다
  rationale: διὰ는 문맥상 ‘~때문에/위하여’의 범위를 가질 수 있으나, 여기서는 자기 희생의 의미가 두드러져 ‘~을 위해’가 가장 자연스럽고도 원문에 가깝습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve the martyr’s explanatory claim without flattening the Greek preposition.'
