  text: Do not be as insane as your brothers with the same madness, but be persuaded by the king and save yourself.
translation:
  language: ko
  text: “너희 형제들과 똑같은 이 미친 짓에 너도 빠지지 말고, 왕에게 설득당하여 너 자신을 구하십시오.”[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 직역하면 ‘같은 광기’이지만, 한국어에서는 강한 비난의 뉘앙스를 살려 ‘미친 짓’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ μανῇς ... τὴν αὐτὴν μανίαν
  english_pob_choice: Do not be as insane ... with the same madness
  chosen_korean: “... 이 미친 짓에 너도 빠지지 말고”
  alternatives_korean:
  - “... 같은 광기에 너도 휩쓸리지 말고”
  - “... 같은 미친 짓을 너도 하지 말고”
  lexicon: μανίᾳ / μανῇς
  rationale: μανία의 강한 비이성·광기 성격을 살리되, 한국어에서는 자연스럽고 직설적인 ‘미친 짓’으로 옮겨 경고의 날카로움을 유지했습니다.
- source_word: πεισθεὶς τῷ βασιλεῖ
  english_pob_choice: be persuaded by the king
  chosen_korean: “왕에게 설득당하여”
  alternatives_korean:
  - “왕의 말을 받아들여”
  - “왕의 설득에 굴복하여”
  lexicon: πείθω
  rationale: 수동 분사형의 의미를 살려 ‘설득당하다’로 옮겼고, 단순한 순종보다 외부의 설득에 의해 방향을 바꾸는 뉘앙스를 드러냈습니다.
- source_word: σῶζε σεαυτόν
  english_pob_choice: save yourself
  chosen_korean: “너 자신을 구하십시오”
  alternatives_korean:
  - “스스로를 구하십시오”
  - “자신의 목숨을 구하십시오”
  lexicon: σῴζω
  rationale: 직접대상 명령을 유지하면서도 현대 한국어의 자연스러운 공식체로 옮겼습니다. 인칭대명사 σεαυτόν은 ‘너 자신’으로 분명히 했습니다.
theological_decisions:
- issue: 형제들과 같은 ‘광기’에 참여하지 말라는 경고의 수위
  chosen_reading: 도덕적·종교적 충돌을 완화하지 않고, 강한 비난어인 ‘미친 짓’으로 남겼습니다.
  alternative_readings:
  - ‘무모함’으로 순화
  - ‘어리석음’으로 완화
  rationale: 본문의 μανία는 단순한 실수가 아니라 집단적 광기/광란을 가리키므로, 경고의 긴장감을 보존하는 번역이 더 적절합니다.
  doctrine_reference: 본문의 수사적 강도 보존
