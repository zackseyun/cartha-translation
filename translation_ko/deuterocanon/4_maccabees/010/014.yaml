  text: But he said to them[a], “The fire you have against me is not so scorching as to make me a coward.”
  footnotes:
  - marker: a
    text: Or, “as to make me act like a coward,” or more literally, “as to make me unmanly.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들에게 말했습니다. “너희가 나를 향해 가진 불은 나를 겁쟁이로 만들 만큼 그렇게 더 맹렬하지는 않습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘겁쟁이처럼 행동하게 만들’, 혹은 더 문자적으로는 ‘남자답지 않게 만들’이라는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καυστικώτερον
  english_pob_choice: so scorching
  chosen_korean: 그렇게 더 맹렬한
  alternatives_korean:
  - 그렇게 더 타는
  - 그렇게 더 불타는
  - 그렇게 더 격렬한
  lexicon: LSJ
  rationale: καυστικός의 비교급으로서 불의 강도와 뜨거움을 가리키므로, 한국어에서는 화염의 세기를 자연스럽게 드러내는 ‘더 맹렬한’을 택했습니다.
- source_word: ἔχετε ... κατʼ ἐμοῦ τὸ πῦρ
  english_pob_choice: the fire you have against me
  chosen_korean: 나를 향해 가진 불
  alternatives_korean:
  - 나를 향한 불
  - 나에게 대적하는 불
  - 나를 겨눈 불
  lexicon: LSJ
  rationale: τὸ πῦρ의 구체적 이미지를 살리면서 κατʼ ἐμοῦ의 대항 방향을 한국어에서 자연스럽게 ‘향해’로 나타냈습니다.
- source_word: δειλανδρῆσαι
  english_pob_choice: make me a coward
  chosen_korean: 나를 겁쟁이로 만들
  alternatives_korean:
  - 나를 비겁하게 만들
  - 나를 겁쟁이 되게 만들
  - 나를 약하게 만들
  lexicon: LSJ
  rationale: 동사는 용기 상실을 뜻하므로, 본문 맥락에 맞게 ‘겁쟁이로 만들’로 옮겨 인격적 상태를 분명히 했습니다.
- source_word: οὐχ οὕτω ... ὥστε
  english_pob_choice: not so ... as to
  chosen_korean: 그렇게 더 ... 만큼
  alternatives_korean:
  - 그 정도로 ... 해서
  - 그리 ... 하여
  - 그만큼 ... 하여
  lexicon: LSJ
  rationale: 비교-결과 구문이므로 과장 없이 정도와 결과를 함께 살릴 수 있는 ‘... 만큼’ 구조를 사용했습니다.
theological_decisions:
- issue: δειλανδρῆσαι의 의미를 ‘cowardly’로 자연화할지, ‘unmanly’의 어감을 드러낼지
  chosen_reading: ‘겁쟁이로 만들’로 옮겨, 용기와 인내의 문제로 읽히게 했습니다.
  alternative_readings:
  - ‘비겁하게 만들’
  - ‘남자답지 않게 만들’
  rationale: 문맥은 순교 앞에서의 담대함에 관한 것으로, 성별적 뉘앙스보다 도덕적 용기 상실을 앞세우는 번역이 독자 이해에 더 정확합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy
