  text: But he said[a], “Even if you take away the instrument of speech, God hears those who are silent.”
  footnotes:
  - marker: a
    text: Literally, 'the instrument of the voice.' The phrase likely refers to the bodily organ(s) used for speaking.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다[a]. 「설령 당신이 말의 도구를 빼앗는다 해도, 하나님은 침묵하는 이들을 들으십니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘말의 도구’입니다. 여기서는 말하거나 소리 내는 신체적 기관을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἂν ἀφέλῃς
  english_pob_choice: Even if you take away
  chosen_korean: 설령 당신이 빼앗는다 해도
  alternatives_korean:
  - 비록 당신이 제거하더라도
  - 설사 당신이 없애더라도
  lexicon: LSJ
  rationale: Κἂν의 양보 조건을 한국어의 ‘설령 … 해도’로 살려, 단순한 조건문보다 더 강한 양보의 뉘앙스를 유지했습니다. ἀφέλῃς는 ‘빼앗다/떼어내다’의 뜻이 있어 ‘빼앗는다’로 옮겼습니다.
- source_word: τὸ τῆς φωνῆς ὄργανον
  english_pob_choice: the instrument of speech
  chosen_korean: 말의 도구
  alternatives_korean:
  - 음성의 기관
  - 목소리의 기관
  - 말하기의 기관
  lexicon: LSJ
  rationale: ὄργανον의 ‘도구/기구’라는 비유를 살리면서, φωνή를 단순한 ‘소리’가 아니라 말하기의 능력으로 이해해 ‘말의 도구’로 자연스럽게 옮겼습니다. 지나치게 해부학적으로 특정하지 않아 원문의 비유성을 보존합니다.
- source_word: σιωπώντων
  english_pob_choice: those who are silent
  chosen_korean: 침묵하는 이들
  alternatives_korean:
  - 잠잠한 이들
  - 말없이 있는 이들
  - 침묵하고 있는 이들
  lexicon: LSJ
  rationale: σίωπάω의 분사적 의미를 substantival하게 살려 ‘침묵하는 이들’로 번역해, 하나님이 말 없는 사람들을 들으신다는 역설을 간결하게 드러냈습니다.
- source_word: ἀκούει
  english_pob_choice: God hears those who are silent
  chosen_korean: 들으십니다
  alternatives_korean:
  - 귀 기울이십니다
  - 들으십니다, 침묵하는 이들을
  - 침묵하는 이들을 들으십니다
  lexicon: LSJ
  rationale: 직역적 대상 표시는 한국어 문맥상 문장 뒤에 ‘침묵하는 이들’을 두어 자연스럽게 처리했고, 하나님 주어에 맞춰 존칭 종결 ‘들으십니다’를 사용했습니다.
theological_decisions:
- issue: 하나님이 ‘침묵하는 이들’을 들으신다는 진술의 직접성
  chosen_reading: 하나님은 말 없는 사람들의 존재와 호소를 실제로 들으십니다.
  alternative_readings:
  - 하나님은 침묵 가운데 드리는 기도를 들으십니다
  - 하나님은 들리지 않는 기도를 들으십니다
  rationale: 원문은 ‘기도’가 아니라 ‘침묵하는 이들’을 말하므로, 해석을 덧붙여 범위를 좁히지 않고 직접 진술을 유지했습니다. 이로써 하나님이 소리 없는 상태를 넘어 이해하고 응답하신다는 신학적 긴장을 보존합니다.
  doctrine_reference: 원문 우선, 해석적 구체화 자제
