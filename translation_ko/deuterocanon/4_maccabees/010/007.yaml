translation:
  language: ko
  text: 그리고 그들이 그를 목 졸라 죽일 수가 전혀 없자, 손가락 끝의 끝마디까지 피부를 잡아당겨 벗기고 그를 가죽을 벗겼으며, 곧바로 그를 바퀴에 끌고 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘손가락 끝의 끝마디까지’는 그리스어의 비정상적으로 생생한 표현을 따라, 피부가 손가락 끝까지 벗겨졌음을 나타내는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ κατὰ μηδένὰ τρόπον ἰσχύοντες
  english_pob_choice: since they were in no way able
  chosen_korean: 그들이 그를 목 졸라 죽일 수가 전혀 없자
  alternatives_korean:
  - 그들이 도무지 그를 질식시킬 수 없자
  - 그들이 어떤 방법으로도 그를 목 졸라 죽일 수 없자
  lexicon: LSJ
  rationale: 부정적 불능을 자연스러운 합쇼체로 옮기되, 뒤의 ἄγξαι를 살려 ‘목 졸라 죽이다’로 구체화했습니다.
- source_word: περισύραντες τὸ δέρμα
  english_pob_choice: dragged off the skin
  chosen_korean: 피부를 잡아당겨 벗기고
  alternatives_korean:
  - 살갗을 잡아떼고
  - 피부를 끌어당겨 벗기고
  lexicon: LSJ
  rationale: περισύραντες의 강한 끌어당김과 벗김을 살려, 과도한 의역 없이 폭력성을 드러냈습니다.
- source_word: σὺν ἄκραις ταῖς τῶν δακτύλων κορυφαῖς
  english_pob_choice: with the very tips of his fingers
  chosen_korean: 손가락 끝의 끝마디까지
  alternatives_korean:
  - 손가락 끝까지
  - 손가락 끝부분까지
  lexicon: LSJ
  rationale: 그리스어의 비정상적으로 생생한 표현을 반영해, 피부가 손가락 끝까지 벗겨지는 극단성을 드러냈습니다.
- source_word: ἀπεσκύθισον
  english_pob_choice: flayed him
  chosen_korean: 그를 가죽을 벗겼으며
  alternatives_korean:
  - 그를 살갗 벗겼으며
  - 그를 박피했으며
  lexicon: LSJ
  rationale: 학술적으로는 ‘가죽을 벗기다/박피하다’가 가깝지만, 한국어 본문에서는 고통의 의미가 즉시 전달되도록 ‘가죽을 벗겼다’로 옮겼습니다.
- source_word: εὐθέως ἦγον ἐπὶ τὸν τροχόν
  english_pob_choice: immediately they led him to the wheel
  chosen_korean: 곧바로 그를 바퀴에 끌고 갔습니다
  alternatives_korean:
  - 즉시 그를 바퀴로 데려갔습니다
  - 바로 그를 바퀴로 끌고 갔습니다
  lexicon: LSJ
  rationale: εὐθέως의 신속성을 살리고, ἦγον의 이동 동사를 자연스럽게 현대 한국어로 옮겼습니다.
theological_decisions:
- issue: 본문의 고문 묘사 강도 유지
  chosen_reading: 본문의 직접적이고 잔혹한 묘사를 완화하지 않고 그대로 드러냈습니다.
  alternative_readings:
  - 더 완곡하게 ‘심하게 해쳤으며’ 정도로 완화
  - 일반적 고통 표현으로 바꿈
  rationale: 원문은 순교 서사의 폭력을 의도적으로 노출하므로, 윤문으로 약화시키지 않는 것이 본문의 힘을 보존합니다.
  doctrine_reference: 순교 서사와 본문 충실성
- issue: 주어와 동사의 연쇄를 보존
  chosen_reading: ‘…할 수가 전혀 없자, …하고, …하며, 곧바로 …’의 연쇄로 원문의 사건 진행을 따라갔습니다.
  alternative_readings:
  - 문장을 두세 개로 강하게 분절
  - 서술을 더 매끄럽게 재배열
  rationale: 그리스어의 서사적 긴박감을 보존하기 위해 사건의 순차성을 유지했습니다.
  doctrine_reference: 본문-형식 일치
