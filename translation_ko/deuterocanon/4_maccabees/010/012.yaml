  text: And when this one had died in a manner worthy of his brothers[a], they dragged forward the fourth, saying,
  footnotes:
  - marker: a
    text: Or, more literally, 'having died brother-worthily.' The phrase means he died in a way fitting for one of the brothers.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이 사람이 형제들에게 어울리게 죽은 뒤, 그들은 넷째 사람을 끌어내며 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “형제들에게 어울리게 죽은 뒤”입니다. 이 표현은 앞선 형제들 가운데 한 사람에게 걸맞은 방식으로 죽었다는 뜻입니다.
    reason: lexical_alternative
