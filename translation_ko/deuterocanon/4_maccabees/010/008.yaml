  text: 그를 둘러싼 곳에서는, 그의 몸이 척추뼈에서부터 빠져나가듯 찢겨 나가는 동안, 그는 자기 살이 사방으로 찢기고 피방울이 내장 쪽으로 흘러내리는 것을 보았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘척추뼈에서부터’는 ἐκ σφονδύλων을 해부학적으로 옮긴 것이며, 문맥상 ‘관절에서’ 또는 ‘몸이 비틀려 빠져나감’의 뉘앙스를 함께 가질 수 있습니다.
    reason: lexical_alternative
