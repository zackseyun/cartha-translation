translation:
  language: ko
  text: 그 수레바퀴 둘레에서, 그는 척추뼈 마디에서부터 탈구되면서 자기 살이 사방에서 찢기고 피방울이 내장을 따라 흘러내리는 것을 보았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 수레바퀴 둘레에서’는 περὶ ὃν을 앞 문맥의 고문 수레바퀴를 가리키는 말로 이해한 번역입니다. ἐκ σφονδύλων은 직역하면 ‘척추뼈 마디들에서부터’이며, ‘관절들에서부터’ 또는 고문 도구의 마디·바퀴 부분을 가리킨다는 해석도 가능합니다.
    reason: lexical_alternative
