  lexicon: LSJ
  rationale: θείων을 '하나님의'로 옮겨 찬가의 대상과 성격을 분명히 하되, '찬가'로 높임의 어조를 유지했습니다.
- source_word: μελῳδὸν γλῶτταν
  english_pob_choice: the tongue that sings the melodies
  chosen_korean: 선율을 노래하는 혀
  alternatives_korean:
  - 노래의 선율을 내는 혀
  - 선율을 부르는 혀
  - 노래하는 혀
  lexicon: LSJ
  rationale: 형용사적 표현을 한국어의 관형절로 풀어, 혀가 실제로 찬가를 노래하는 기능을 하고 있음을 자연스럽게 살렸습니다.
- source_word: ἐκτέμνεις
  english_pob_choice: you are cutting out
  chosen_korean: 잘라 내고 있기 때문입니다
  alternatives_korean:
  - 도려내고 있기 때문입니다
  - 잘라 버리고 있기 때문입니다
  - 베어 내고 있기 때문입니다
  lexicon: LSJ
  rationale: 혀에 가해지는 물리적 절단을 분명히 하면서도, 현재 진행의 즉각성을 유지했습니다.
