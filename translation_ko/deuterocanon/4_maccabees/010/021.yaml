translation:
  language: ko
  text: 그러나 하나님께서 곧 너를 뒤쫓으실 것입니다[a]. 이는 네가 신성한 찬가를 노래하는 혀를 잘라 내고 있기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '하나님께서 곧 너를 벌하실 것입니다' / '하나님께서 곧 너를 뒤쫓아 오실 것입니다.' 이 그리스어 동사는 '뒤쫓다, 따라가다'라는 뜻을 지니며, 여기서는 하나님의 심판이라는 맥락에서 쓰였습니다.
    reason: alternative_reading
