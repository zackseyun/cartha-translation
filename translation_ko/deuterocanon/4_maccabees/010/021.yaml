  rationale: 이 동사는 단순한 '처벌'보다 따라가며 추적하는 이미지를 담으므로, 본문이 가진 추격 은유를 살려 번역했습니다.
- source_word: τῶν θείων ὕμνων
  english_pob_choice: of divine hymns
  chosen_korean: 하나님의 찬가들의
  alternatives_korean:
