  text: But God will swiftly pursue you[a], for you are cutting out the tongue that sings the melodies of divine hymns.
  footnotes:
  - marker: a
    text: Or 'God will swiftly punish you' / 'God will swiftly come after you.' The Greek verb carries the sense of pursuing or going after, here in a context of divine judgment.
