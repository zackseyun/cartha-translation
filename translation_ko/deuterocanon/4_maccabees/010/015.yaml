  text: By the blessed death of my brothers[a], and by the tyrant’s eternal destruction, and by the everlasting life of the godly[b], I will not renounce my noble brotherhood.
  footnotes:
  - marker: a
    text: Or 'the noble brotherhood.' The Greek phrase may be taken more generally, but in context it refers to the speaker's bond with his brothers.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek uses two near-synonymous adjectives for enduring duration: ''everlasting'' for the tyrant''s destruction and ''eternal'' for the godly''s life.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 형제들의 복된 죽음과 폭군의 영원한 멸망과 경건한 이들의 영원한 생명을 두고 맹세하건대, 나는 내 형제들과의 고귀한 유대를 저버리지 않겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 형제들과의 고귀한 유대’는 직역하면 ‘고귀한 형제 관계’입니다. 원문의 표현은 더 일반적으로 이해될 수도 있으나, 문맥상 화자와 그의 형제들 사이의 결속을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 지속성을 나타내는 서로 가까운 두 형용사를 사용합니다. 하나는 폭군의 멸망에, 다른 하나는 경건한 이들의 생명에 쓰였으며, 한국어에서는 둘 다 ‘영원한’으로 옮겼습니다.
    reason: lexical_alternative
