  to: 그러나 여러분이 하는 이런 일들은 고문이라 부를 가치조차 없습니다.[a]
  rationale: ὑμῶν의 압축된 속격은 ‘여러분이 하는’으로 자연스럽게 풀되, 각주에서 ‘여러분의/여러분에게서 나온/여러분 쪽의’라는 가능한 범위를 보존했습니다. βασάνων ἄξια의 수사적 평가를 ‘고문이라 부를 가치조차 없다’로 옮겨, 원문의 경멸적 강조를 살리고 ‘고문을 당하다’라는 불필요한 의미 특정은 피했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:03:55Z'
