lexical_decisions:
- source_word: ἀσέβειαν
  english_pob_choice: ungodliness
  chosen_korean: 불경
  alternatives_korean:
  - 경건 없음
  - 하나님을 경외하지 않음
  - 불신앙
  lexicon: BDAG
  rationale: ἀσέβεια는 하나님을 향한 경외와 경건의 결여를 가리키므로, ‘불경’이 짧고도 종교적·도덕적 무게를 살립니다.
- source_word: μιαιφονίαν
  english_pob_choice: blood-guilt / blood-pollution
  chosen_korean: 피를 더럽힌 죄
  alternatives_korean:
  - 피흘림의 죄
  - 피의 더러움
  - 피를 흘려 더럽힌 죄
  lexicon: LSJ
  rationale: 이 합성어는 살해/유혈과 그로 인한 오염을 함께 내포하므로, ‘피를 더럽힌 죄’가 유혈과 오염의 긴장을 함께 드러냅니다.
- source_word: ἀκαταλύτους
  english_pob_choice: unending
  chosen_korean: 끝없는
  alternatives_korean:
  - 끊이지 않는
  - 중단되지 않는
  - 영원한
  lexicon: LSJ
  rationale: ‘해소되지 않음, 끝나지 않음’의 뜻을 간결하게 살리면서, 형벌의 지속성을 자연스러운 한국어로 전달합니다.
- source_word: καρτερήσεις βασάνους
  english_pob_choice: you will endure torments
  chosen_korean: 고통을 견딜 것이다
  alternatives_korean:
  - 고초를 견딜 것이다
  - 고문을 받게 될 것이다
  - 형벌을 견딜 것이다
  lexicon: BDAG
  rationale: καρτερέω의 ‘견디다, 버티다’와 βασάνος의 가혹한 처벌적 고통을 함께 반영하되, ‘고통’이 의미를 넓게 유지합니다.
theological_decisions:
- issue: μιαιφονίαν의 도덕적·정결적 중첩
  chosen_reading: ‘피를 더럽힌 죄’로 옮겨 유혈 행위의 법적 책임뿐 아니라 그 오염성을 함께 드러냈습니다.
  alternative_readings:
  - ‘피흘림의 죄’
  - ‘혈죄’
  rationale: 본문은 단순 범죄 진술을 넘어 하나님 앞에서의 더러움까지 함께 고발하므로, 오염의 뉘앙스를 살리는 번역이 필요합니다.
  doctrine_reference: 'DOCTRINE.md: Original-language primacy over translation tradition; Preserve theological tension rather than resolve it'
