  source_fidelity: 원문의 미래 동사 καρτερήσεις와 ‘~ 때문에’(διὰ)의 인과 관계, 그리고 ἀκαταλύτους βασάνους의 지속되는 가혹한 고통이라는 뜻은 대체로 반영되어 있습니다. 다만 μιαιφονίαν을 ‘피를 더럽힌 죄’로 옮기면 피 자체를 더럽힌다는 인상이 강하여, 유혈 살해가 낳는 오염이라는 합성어의 뜻을 부정확하고 어색하게 만듭니다.
  naturalness: 초안의 종결형 ‘견딜 것이다’는 지정된 현대 합쇼체와 맞지 않습니다. ‘견디게 될 것입니다’로 고치고, μιαιφονίαν은 자연스러운 한국어 표현인 ‘유혈로 인한 더러움’으로 옮기는 것이 좋습니다.
  terminology: ἀσέβεια에는 하나님을 향한 불경건의 뜻이 있으므로 ‘불경건’이 현대 한국어에서 ‘불경’보다 더 분명합니다. μιαιφονίαν은 유혈과 그로 말미암는 정결·도덕적 오염을 함께 가리키므로 본문과 주석에서 그 두 요소를 유지했습니다.
