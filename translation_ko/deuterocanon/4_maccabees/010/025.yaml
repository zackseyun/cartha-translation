base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/010/025.yaml
  text: Or does it not seem evil to you that we worship the Creator of all and live according to his virtuous law?[a]
  footnotes:
  - marker: a
    text: Or, more literally, 'Or does it not seem evil...?' The Greek rhetorical question may be understood as challenging the opponent's moral judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 아니면 우리가 만물을 지으신 분을 예배하고, 그의 덕스러운 율법에 따라 살아가는 것이 악한 일로 보이지 않습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “...이 악한 일로 보이지 않습니까?”입니다. 이 그리스어 수사 의문문은 상대방의 도덕적 판단에 이의를 제기하는 말로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κακὸν
  english_pob_choice: evil
  chosen_korean: 악하게
  alternatives_korean:
  - 나쁘게
  - 잘못된 일로
  lexicon: BDAG
  rationale: 도덕적 비난의 강도를 살리기 위해 형용사적 “악한”의 부사형인 “악하게”를 택했습니다.
- source_word: τὸν πάντων κτίστην
  english_pob_choice: the Creator of all
  chosen_korean: 만물을 지으신 분
  alternatives_korean:
  - 모든 것의 창조자
  - 만물의 창조주
  lexicon: BDAG
  rationale: ‘창조주’도 가능하지만, 한국어에서 더 자연스럽고 하나님의 행위를 분명히 드러내는 “만물을 지으신 분”으로 옮겼습니다.
- source_word: εὐσεβοῦμεν
  english_pob_choice: we worship
  chosen_korean: 예배하고
  alternatives_korean:
  - 경건히 섬기고
  - 경배하고
  lexicon: BDAG
  rationale: 동사가 가리키는 경건한 하나님 공경을 예배 행위로 옮겨 문맥상 직접성을 살렸습니다.
- source_word: τὸν ἔναρετον αὐτοῦ νόμον
  english_pob_choice: his virtuous law
  chosen_korean: 그의 덕스러운 율법
  alternatives_korean:
  - 그의 훌륭한 율법
  - 그의 고결한 율법
  lexicon: LSJ
  rationale: ἔναρετος의 도덕적 탁월성을 “덕스러운”으로 반영하되, νόμον은 문맥상 토라/율법이므로 “율법”을 유지했습니다.
theological_decisions:
- issue: 수사적 질문의 대상과 뉘앙스
  chosen_reading: 명시적 2인칭을 보완해 “...보이지 않습니까?”로 옮겨, 상대의 도덕적 판단을 겨누는 반어적 질문으로 읽히게 했습니다.
  alternative_readings:
  - “...보이지 않습니까?” 대신 더 직설적으로 “...악한 일로 여기지 않습니까?”
  rationale: 그리스어는 직설적 2인칭 대명사를 두지 않지만, 수사적 문맥상 상대를 겨누는 질문이므로 한국어에서는 자연스러운 대화적 형태로 풀었습니다.
  doctrine_reference: 수사적 비난의 힘을 보존하면서도 문맥을 과도하게 해석하지 않음
