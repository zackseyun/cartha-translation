  text: Look[a], my tongue has been broken; cut it off[b]. For not even by this will you cut out our reasoned judgment.
  footnotes:
  - marker: a
    text: Greek reads 'our reasoned judgment,' not 'my'; the plural may express solidarity with the speaker's brothers, though some readers may expect a singular from the immediate context.
    reason: alternative_reading
  - marker: b
    text: 'The final verb is a vivid tongue-cutting term used figuratively: the speaker says that mutilating his tongue cannot remove or silence their rational resolve.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 내 혀가 이미 부러졌습니다. 잘라 버리십시오[b]. 왜냐하면 이것으로도 우리의 이성적 판단[a]을 잘라 없애지는 못할 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 단수 화자의 말인데도 복수형 ‘우리의’를 사용합니다. 이 복수는 그의 형제들과의 연대를 나타낼 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 마지막 동사는 문자적으로 ‘혀를 자르다’라는 생생한 복합동사입니다. 여기서는 혀를 절단하더라도 그들의 이성적 판단을 제거할 수 없다는 비유를 드러냅니다.
    reason: lexical_alternative
