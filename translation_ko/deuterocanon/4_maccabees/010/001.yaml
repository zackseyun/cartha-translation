base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/010/001.yaml
  text: And after he had endured this death[a], worthy to be sung of, the third was led in[b], being urged much by many to save himself by tasting it.
  footnotes:
  - marker: a
    text: Or 'his celebrated death' or 'his renowned death.' The Greek adjective literally suggests a death 'sung of' or commemorated in praise.
    reason: lexical_alternative
  - marker: b
    text: That is, by tasting the forbidden food and so preserving his life.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그가 이 노래로 기릴 만한 죽음을 견뎌 낸 뒤, 셋째 사람이 이끌려 들어왔습니다. 그는 많은 사람에게서 여러 차례, 그것을 맛보아 목숨을 보전하라는 권유를 받았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘노래로 기릴 만한’은 그리스어 ἀοίδιμον의 문자적 뉘앙스, 곧 ‘노래로 불리거나 찬양될 만한’을 살린 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그것’은 문맥상 금지된 음식을 가리킵니다. 맛보기만 하면 생명을 보전할 수 있다고 권유한 것입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἀοίδιμον
  english_pob_choice: worthy to be sung of
  chosen_korean: 칭송받을 만한
  alternatives_korean:
  - 기억할 만한
  - 명예로운
  - 찬양받을 만한
  lexicon: LSJ
  rationale: ἀοίδιμον은 문자적으로 ‘노래로 불릴 만한, 칭송될 만한’ 뉘앙스를 가지므로, 한국어에서는 과장되지만 않는 높임의 표현으로 옮겨 원문의 찬가적 어조를 살렸습니다.
- source_word: καρτερήσαντος
  english_pob_choice: had endured
  chosen_korean: 견뎌 낸
  alternatives_korean:
  - 참아 낸
  - 버텨 낸
  - 견디어 낸
  lexicon: LSJ
  rationale: 이 분사형은 고난 속에서도 굳게 버틴 행위를 가리키므로, 결과를 강조하는 ‘견뎌 낸’이 가장 자연스럽고 문맥에 맞습니다.
- source_word: ὁ τρίτος ἤγετο
  english_pob_choice: the third was led in
  chosen_korean: 셋째 사람이 끌려 들어왔습니다
  alternatives_korean:
  - 셋째가 인도되었습니다
  - 셋째 사람이 끌려 나왔습니다
  lexicon: LSJ
  rationale: 문맥상 심문이나 처형의 장으로 이끌려 들어오는 동작이므로, 단순한 ‘인도되다’보다 수동적 강제를 드러내는 ‘끌려 들어오다’가 적절합니다.
- source_word: παρακαλούμενος πολλὰ ὑπὸ πολλῶν
  english_pob_choice: being urged repeatedly by many
  chosen_korean: 많은 사람에게서 여러 차례 권유를 받으며
  alternatives_korean:
  - 많은 사람에게서 거듭 권면을 받으며
  - 많은 이들로부터 간청을 받으며
  lexicon: LSJ
  rationale: πολλὰ ὑπὸ πολλῶν의 중복 강조를 한국어에서 ‘여러 차례’와 ‘많은 사람’으로 살려, 단순한 한 번의 권고가 아니라 반복적 압박이라는 점을 드러냈습니다.
- source_word: ἀπογευσάμενος σώζοιτο
  english_pob_choice: to save himself by tasting it
  chosen_korean: 맛보아서 자신을 구하라는 말을 들었습니다
  alternatives_korean:
  - 맛을 보아 목숨을 건지라는 말을 들었습니다
  - 맛보아서 살아남으라는 말을 들었습니다
  lexicon: LSJ
  rationale: ἀπογευσάμενος는 금지된 음식을 ‘맛보는’ 행위이고, σώζοιτο는 생명을 보존한다는 뜻이므로, 한국어에서는 그 제안을 직접화법으로 풀어 의미를 분명히 했습니다.
theological_decisions:
- issue: 순교자의 죽음에 대한 찬양적 표현
  chosen_reading: ‘칭송받을 만한 죽음’으로 높임을 살리되, 후대 신학 용어를 덧입히지 않았습니다.
  alternative_readings:
  - ‘영광스러운 죽음’
  - ‘명예로운 죽음’
  rationale: 본문은 앞선 인물의 죽음을 수사적으로 기리는 표현을 쓰지만, 교리적 개념을 더하지는 않습니다. 따라서 찬가적 어조는 유지하되 범위를 과장하지 않는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 6
- issue: ἀπογευσάμενος의 의미를 한국어에서 풀어낸 방식
  chosen_reading: ‘맛보아서 자신을 구하라’는 권유로 옮겨, 독자가 금지된 음식을 먹으라는 유혹임을 이해하도록 했습니다.
  alternative_readings:
  - 직역하여 ‘그것을 맛보아 구원되라’
  - ‘한 점 먹어 목숨을 보전하라’
  rationale: 한국어는 목적어가 생략되면 뜻이 흐려질 수 있어, 문맥상 대상이 금지된 음식임을 풀어 주는 것이 오해를 줄입니다. 다만 원문의 압박감을 유지하기 위해 지나친 해석은 피했습니다.
  doctrine_reference: Translation philosophy §§1, 6
