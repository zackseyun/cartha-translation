  source_fidelity: 원문의 속격절대구문은 앞선 인물이 그 죽음을 견뎌 낸 뒤의 상황을 나타내며, 이어 셋째 사람이 이끌려 옵니다. 초안은 이 큰 구조를 충실히 반영합니다. 다만 ἤγετο는 단지 ‘이끌려 오다’이지 ‘끌려 오다’가 함의할 수 있는 물리적 강제까지 명시하지 않으며, σώζοιτο는 이 문맥에서 ‘자신을 구하다’보다 ‘목숨을 보전하다’가 더 정확합니다. 또한 ὅπως의 목적절은 명령을 직접 인용하기보다 권유의 내용으로 처리하는 편이 원문에 가깝습니다.
  naturalness: ‘맛보아서 자신을 구하라는 말을 들었습니다’는 다소 장황하고 ‘자신을 구하다’가 종교적 구원의 의미로도 들릴 수 있습니다. ‘그것을 맛보아 목숨을 보전하라는 권유를 받았습니다’가 현대 한국어의 격식 있는 서술로 자연스럽고 분명합니다.
