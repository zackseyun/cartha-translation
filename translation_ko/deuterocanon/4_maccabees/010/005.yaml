  yaml_path: translation/deuterocanon/4_maccabees/010/005.yaml
  text: But bitterly resenting the man's boldness[a], they dislocated his hands and feet with joint-wrenching instruments, and prying them out of their sockets[b], they dismembered him.
  footnotes:
  - marker: a
    text: Or, more literally, 'having bitterly borne the man's boldness'—that is, they reacted with bitter resentment to his fearless speech.
    reason: lexical_alternative
  - marker: b
    text: The Greek uses rare language for instruments used on the joints and for tearing limbs apart, emphasizing the brutality of the torture.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 그들은 그 남자의 담대함을 쓰라리게 받아들여, 관절을 꺾는 도구로 그의 손과 발을 탈구시키고, 그것들을 관절에서 지레로 들어 올려 결국 사지를 분해해 버렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ‘관절을 겨냥한 고문 도구’와 ‘지레로 들어 올림’에 해당하는 희귀한 어휘를 사용하여, 고문의 잔혹성을 매우 구체적으로 강조합니다.
    reason: source_note
lexical_decisions:
- source_word: πικρῶς ἐνέγκαντες
  english_pob_choice: bitterly resenting
  chosen_korean: 쓰라리게 받아들여
  alternatives_korean:
  - 쓰라리게 원망하며
  - 몹시 못마땅해하며
  lexicon: LSJ
  rationale: ἐνέγκαντες는 문자적으로는 ‘견디다/받아들이다’이지만, 문맥상 παρρησία를 향한 거친 반감과 분노를 나타내므로 한국어에서는 감정 반응을 드러내는 표현이 필요합니다.
- source_word: παρρησίαν
  english_pob_choice: boldness
  chosen_korean: 담대함
  alternatives_korean:
  - 대담한 발언
  - 숨김없는 말함
  lexicon: BDAG
  rationale: 이 단어는 두려움 없이 드러내는 말함을 뜻하므로, 한국어에서는 단순한 성격 묘사보다 발화의 용기와 공개성을 함께 살리는 ‘담대함’이 적절합니다.
- source_word: ἀρθρεμβόλοις ὀργάνοις
  english_pob_choice: with joint-wrenching instruments
  chosen_korean: 관절을 꺾는 도구로
  alternatives_korean:
  - 관절을 뒤트는 기구로
  - 마디를 비트는 형틀로
  lexicon: LSJ
  rationale: 희귀한 복합 표현으로 관절을 겨냥한 고문 도구를 가리키므로, 직역식이면서도 현대 한국어에서 뜻이 전달되는 표현으로 옮겼습니다.
- source_word: ἐξήρθρουν
  english_pob_choice: they dislocated
  chosen_korean: 탈구시키고
  alternatives_korean:
  - 관절을 빼고
  - 뒤틀어 빼고
  lexicon: LSJ
  rationale: 손과 발을 관절에서 빼내는 동작을 나타내므로 의학적으로도 정확한 ‘탈구시키다’를 택했습니다.
- source_word: ἐξ ἁρμῶν ἀναμοχλεύοντες ἐξέμελιζον
  english_pob_choice: prying them out of their sockets ... they dismembered him
  chosen_korean: 그것들을 관절에서 지레로 들어 올려 결국 사지를 분해해 버렸습니다
  alternatives_korean:
  - 그것들을 소켓에서 들어내어 결국 그를 사지로부터 찢어냈습니다
  - 그것들을 관절에서 비집어 올려 결국 사지를 절단해 버렸습니다
  lexicon: LSJ
  rationale: 연속 동사들이 고문의 잔혹성을 점층적으로 드러내므로, ‘지레로 들어 올려’와 ‘분해해 버렸습니다’로 기계적 폭력을 살렸습니다.
theological_decisions:
- issue: 잔혹한 신체 훼손 묘사의 직설성
  chosen_reading: ‘탈구시키고’, ‘지레로 들어 올려’, ‘사지를 분해해 버렸습니다’처럼 신체 훼손을 완곡하게 돌리지 않고 직접적으로 표현했습니다.
  alternative_readings:
  - ‘상하게 하고’처럼 일반화하기
  - ‘훼손했다’로 완곡화하기
  rationale: 원문은 관절, 손과 발, 분리 동작을 구체적으로 제시하므로, 고문의 공포와 순교 서사의 강도를 약화시키지 않는 것이 번역 원칙에 부합합니다.
  doctrine_reference: Translation philosophy §§1, 6
