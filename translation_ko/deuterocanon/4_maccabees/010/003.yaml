  naturalness: ‘우리 형제 사이의 고귀한 혈연의 유대’는 현대 표준 한국어에서 자연스럽고, 실제 형제들 사이의 가족적 연대를 분명히 합니다. ‘저버리지 않겠습니다’는 합쇼체에 맞으며, 관계를 부인하거나 포기하지 않는다는 ἐξόμνυμαι의 문맥적 의미를 과도하게 한정하지 않습니다.
  terminology: ‘형제’는 ἀδελφότης의 성별화된 가족 용어를 유지합니다. ‘혈연의 유대’는 συγγένεια의 친족성을 살리되, 원문의 추상명사 연쇄를 한국어답게 풀어 낸 것입니다. ‘고귀한’은 εὐγενής가 지닌 혈통과 품위의 함의를 보존합니다.
