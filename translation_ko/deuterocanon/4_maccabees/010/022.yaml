lexical_decisions:
- source_word: Οὐ μέλλω
  english_pob_choice: I am not about to
  chosen_korean: 나는 … 거절하지 않겠습니다
  alternatives_korean:
  - 나는 … 하지 않겠습니다
  - 나는 … 할 생각이 없습니다
  lexicon: BDAG
  rationale: μέλλω의 임박성·결의가 있는 현재 태도를 한국어의 미래 부정으로 자연스럽게 살리되, 단순한 예정보다 강한 거절 의지로 표현했습니다.
- source_word: τύραννε
  english_pob_choice: tyrant
  chosen_korean: 폭군이여
  alternatives_korean:
  - 폭군이여
  - 전제군주여
  lexicon: LSJ
  rationale: 직접 호격으로 부르며, 상대의 폭압성을 드러내는 표준적 대응어인 ‘폭군’이 가장 분명합니다.
- source_word: πρὸς τὸν ... βασανισμόν
  english_pob_choice: the torture
  chosen_korean: 고문을
  alternatives_korean:
  - 고통을
  - 가혹한 고문을
  lexicon: LSJ
  rationale: βασανισμός는 단순한 고통보다 실제적인 심문·형벌의 ‘고문’에 더 가깝고, 한국어에서도 자연스럽게 목적격으로 처리했습니다.
- source_word: ὑπὲρ τῆς ἀρετῆς
  english_pob_choice: for the sake of virtue
  chosen_korean: 덕을 위한
  alternatives_korean:
  - 덕 때문에
  - 덕을 위하여
  lexicon: LSJ
  rationale: ὑπέρ의 원인/목적 관계를 드러내기 위해 ‘…을 위한’으로 옮겨, 수난이 덕을 지키기 위한 것임을 분명히 했습니다.
- source_word: παραιτεῖσθαι
  english_pob_choice: refuse
  chosen_korean: 거절하지 않겠습니다
  alternatives_korean:
  - 사양하지 않겠습니다
  - 물러서지 않겠습니다
  lexicon: BDAG
  rationale: 중간태의 ‘거절하다/사양하다’ 의미를 살리되, 문맥상 고문을 앞두고 도피하지 않겠다는 결연함을 드러내는 표현으로 다듬었습니다.
theological_decisions:
- issue: 수난에 대한 화자 태도의 강조
  chosen_reading: 화자는 폭군 앞에서 덕을 위한 고문을 피하거나 회피하지 않겠다고 단호히 선언합니다.
  alternative_readings:
  - 단순히 미래 시제의 예고로 읽을 수 있음
  - ‘사양하다’로 더 완곡하게 읽을 수 있음
  rationale: 본문은 순교적 결의를 드러내므로, 한국어에서도 의지와 결단이 살아나도록 부정 미래형을 사용했습니다.
  doctrine_reference: 순교/인내의 증언
