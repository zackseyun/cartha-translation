  text: But he cried out and said[a], “Do you not know that the same father sowed me among those who die, and the same mother gave birth to me, and I was brought up in the same principles?”
  footnotes:
  - marker: a
    text: Or “sowed me among the dying.” The Greek keeps an agricultural metaphor for human generation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 큰 소리로 외치며 말했습니다. “같은 아버지가 나를 죽을 자들 가운데 씨 뿌리듯 낳았고, 같은 어머니가 나를 낳았으며, 나는 같은 원리들 속에서 자랐다는 것을 알지 못합니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘씨를 뿌렸다’는 뜻으로, 인간의 출생을 농경적 은유로 말한 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβοήσας
  english_pob_choice: cried out
  chosen_korean: 큰 소리로 외치며
  alternatives_korean:
  - 외치며
  - 소리치며
  lexicon: LSJ
  rationale: 급작스럽고 강한 발화를 나타내므로, 단순한 ‘말하다’보다 강도를 살린 표현을 택했습니다.
- source_word: ἔσπειρεν
  english_pob_choice: sowed
  chosen_korean: 씨 뿌리듯 낳았고
  alternatives_korean:
