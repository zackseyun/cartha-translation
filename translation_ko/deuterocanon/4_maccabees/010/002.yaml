translation:
  language: ko
  text: 그가 큰 소리로 외쳐 말했습니다. “같은 아버지께서 죽은 이들과 함께 씨를 뿌려[a] 나를 낳으셨고, 같은 어머니께서 나를 낳으셨으며, 나도 같은 가르침을 받으며 자랐다는 것을 알지 못합니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘씨를 뿌려’입니다. 아버지의 생성 행위를 농경의 은유로 표현한 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβοήσας
  english_pob_choice: cried out
  chosen_korean: 큰 소리로 외치며
  alternatives_korean:
