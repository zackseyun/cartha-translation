  - 낳았고
  - 생기게 했고
  lexicon: LSJ
  rationale: 동사의 농경적 은유를 한국어에서도 보존하되, 문맥상 인간 출생을 가리키므로 ‘낳다’를 결합해 의미를 분명히 했습니다.
- source_word: τοῖς ἀποθανοῦσιν
  english_pob_choice: among those who die
  chosen_korean: 죽을 자들 가운데
  alternatives_korean:
  - 죽어 가는 자들 가운데
  - 죽은 자들 가운데
  - 죽는 자들 가운데
  lexicon: LSJ
  rationale: 현재분사는 이미 죽은 이들이 아니라 죽음 아래 있는 인간의 범주를 가리키므로, ‘죽을 자들’로 자연스럽게 옮겼습니다.
- source_word: δόγμασιν
  english_pob_choice: principles
  chosen_korean: 원리들
  alternatives_korean:
  - 가르침들
  - 교훈들
  - 규범들
  lexicon: LSJ
  rationale: 문맥상 법적 ‘명령’보다 형성된 삶의 기준과 원칙을 뜻하므로, POB의 선택을 따라 ‘원리들’로 옮겼습니다.
theological_decisions:
- issue: 농경 은유를 한국어에서 어떻게 처리할지
  chosen_reading: ‘씨 뿌리듯’으로 은유를 살리면서도, 전체 문장에서는 출생 의미가 드러나도록 구성했습니다.
  alternative_readings:
  - ‘씨 뿌렸고’로 직역
  - 은유를 풀어 ‘낳았고’만 사용
  rationale: 본문은 인간의 공통된 생성과 죽을 운명을 강조하므로, 은유를 지우지 않으면서도 독자가 의미를 놓치지 않게 해야 합니다.
  doctrine_reference: Translation philosophy §1, §6
