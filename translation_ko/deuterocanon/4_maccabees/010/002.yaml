  text: But he cried out and said[a], “Do you not know that the same father sowed me among those who die, and the same mother gave birth to me, and I was brought up in the same principles?”
  footnotes:
  - marker: a
    text: Or “sowed me among the dying.” The Greek keeps an agricultural metaphor for human generation.
