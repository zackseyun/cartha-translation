  text: Go on[a], tyrant, with your tortures, so that even through these you may learn that I am a brother of those who have been tortured before.
  footnotes:
  - marker: a
    text: Or, 'of those previously tortured.' The Greek participle includes the idea that they were tortured earlier than the speaker.
    reason: lexical_alternative
translation:
  language: ko
  text: 고문을 계속해 보시오, 폭군이여. 그리하면 이 고문들을 통해서도 내가 앞서 고문당한 이들의 형제임을 알게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘앞서 고문당한 이들’은 그리스어의 접두사 προ-가 이들이 화자보다 먼저 고문당했음을 나타내는 표현입니다.
    reason: lexical_alternative
