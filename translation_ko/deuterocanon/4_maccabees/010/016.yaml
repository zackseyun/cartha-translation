  source_fidelity: 헬라어의 도전적 명령(ἔπιθι), 직접 호칭(τύραννε), 고문을 수단으로 삼는 표현(βασάνοις), 그리고 앞서 고문당한 형제들과의 혈연적 연대를 대체로 충실히 반영합니다. 다만 ‘그러면’과 ‘이 일들을 통해서라도’는 원문의 목적절과 지시 대상(현재의 고문)을 다소 느슨하고 부자연스럽게 만듭니다.
  naturalness: ‘계속하시오, 폭군이여, 네 고문으로’는 한국어에서 ‘계속하다’의 대상과 ‘고문으로’의 연결이 어색합니다. ‘고문을 계속해 보시오’라고 하면 폭군에게 던지는 담대한 도전의 어조와 현대 표준 한국어의 자연스러운 문장을 함께 살릴 수 있습니다.
