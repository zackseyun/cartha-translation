translation:
  language: ko
  text: 계속하시오, 폭군이여, 네 고문으로. 그러면 이 일들을 통해서라도 네가 내가 먼저 고문당한 이들의 형제임을 알게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
