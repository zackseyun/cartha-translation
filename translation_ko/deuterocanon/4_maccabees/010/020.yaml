lexical_decisions:
- source_word: ἡδέως
  english_pob_choice: gladly
  chosen_korean: 기꺼이
  alternatives_korean:
  - 즐겁게
  - 마음으로 기쁘게
  - 자원하여
  lexicon: LSJ
  rationale: ἡδέως는 단순한 감정이 아니라 자발적이고 적극적인 수용을 나타내므로, 한국어에서는 자연스럽고 문어적인 ‘기꺼이’가 가장 가깝습니다.
- source_word: ὑπὲρ τοῦ θεοῦ
  english_pob_choice: for the sake of God
  chosen_korean: 하나님 때문에
  alternatives_korean:
  - 하나님을 위하여
  - 하나님을 위해
  - 하나님을 위해서
  lexicon: LSJ
  rationale: ὑπέρ + 속격은 ‘~을 위하여/위해서’의 헌신적 의미를 담을 수 있지만, 이 문맥은 순교적 고난의 이유를 분명히 하므로 ‘하나님 때문에’가 동기를 가장 직접적으로 드러냅니다.
- source_word: τὰ τοῦ σώματος μέλη
  english_pob_choice: the limbs of our body
  chosen_korean: 몸의 지체들이
  alternatives_korean:
  - 몸의 팔다리들이
  - 육체의 지체들이
  - 몸의 구성원들이
  lexicon: LSJ
  rationale: μέλη는 문자적으로 ‘지체/팔다리’이지만, 여기서는 절단과 연결된 신체 부위를 가리키므로 ‘지체들’이 본문 이미지와 어휘를 함께 살립니다.
- source_word: ἀκρωτηριαζόμεθα
  english_pob_choice: have ... mutilated
  chosen_korean: 절단됩니다
  alternatives_korean:
  - 절단당합니다
  - 잘려 나갑니다
  - 불구가 됩니다
  lexicon: LSJ
  rationale: 동사는 절단·절손의 수동 의미를 가지므로, 한국어에서는 충격을 과장하지 않으면서도 신체 훼손의 강도를 유지하는 ‘절단됩니다’가 적절합니다.
theological_decisions:
- issue: 순교적 고난의 동기 표현
  chosen_reading: ‘하나님 때문에’는 대리나 속죄가 아니라, 하나님께 대한 충성 때문에 당하는 고난을 뜻합니다.
  alternative_readings:
  - ‘하나님을 위해’
  - ‘하나님을 대신하여’
  rationale: 본문의 ὑπέρ는 순교자의 헌신과 원인 관계를 나타내며, 대속적 의미를 더하지 않는 것이 문맥에 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
