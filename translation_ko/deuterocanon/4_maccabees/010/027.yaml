  text: if indeed you had human feelings, and had hope from God for deliverance.
  footnotes:
  - marker: a
    text: Or 'human longings' or 'human affections.' The Greek phrase is compressed and appeals to ordinary human attachment.
    reason: lexical_alternative
  - marker: b
    text: Or 'salvation.' The Greek can denote either immediate deliverance or broader salvation; 'deliverance' is chosen for the immediate context.
