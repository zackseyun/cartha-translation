translation:
  language: ko
  text: 만일 참으로 인간적인 애정을 느끼고[a], 하나님께로부터 오는 구출에 대한 희망을 품고 있었다면.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인간의 갈망들’ 또는 ‘인간적 정서’. 그리스어의 압축된 표현은 보통 인간에게 있는 애정과 유대를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘구원’. 그리스어는 즉각적인 구출과 더 넓은 의미의 구원을 모두 뜻할 수 있습니다. 당면한 위험의 문맥을 따라 본문에서는 ‘구출’로 옮겼습니다.
    reason: alternative_reading
