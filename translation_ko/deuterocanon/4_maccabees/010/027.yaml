revisions:
- from: 만일 정말로 당신에게 사람의 정서가 있었고, 하나님께서 주시는 구원을 바라는 희망이 있었다면.[a][b]
  to: 만일 참으로 인간적인 애정을 느끼고[a], 하나님께로부터 오는 구출에 대한 희망을 품고 있었다면.[b]
  rationale: 동사 ἠσθάνου가 나타내는 ‘느끼다’를 회복하고, ἀνθρώπους πόθων의 애정·유대의 뉘앙스를 ‘인간적인 애정’으로 자연스럽게 반영했습니다. παρὰ θεῷ는 영어 POB 감사 기록의 기원적 해석을 따라 ‘하나님께로부터 오는’으로 옮기되, 하나님이 직접 ‘주신다’는 추가 서술은 피했습니다. σωτηρίου의 즉각적 의미는 ‘구출’로 번역하고 더 넓은 ‘구원’의 가능성은 각주에 보존했습니다.
