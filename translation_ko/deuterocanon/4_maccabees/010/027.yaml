  source_fidelity: 개정이 필요합니다. ἠσθάνου는 단순히 ‘정서가 있었다’기보다 ‘애정/갈망을 느끼고 있었다’를 뜻하므로, 현재 번역은 동사의 의미를 소유 표현으로 약화합니다. 또한 παρὰ θεῷ의 기원적 이해를 따르더라도 ‘하나님께서 주시는 구원’은 동사 ‘주시는’를 보태어 원문의 관계를 다소 과도하게 확정합니다.
  naturalness: ‘사람의 정서가 있었고’는 현대 한국어에서 다소 추상적이고 부자연스럽습니다. ‘인간적인 애정을 느끼고’와 ‘희망을 품고 있었다면’은 압축된 그리스어 구문과 조건문의 수사적 미완결성을 자연스럽게 살립니다.
  terminology: πόθων은 이 문맥에서 ‘애정’으로 옮길 수 있으며, 각주에서 ‘갈망’과 ‘정서’를 대안으로 제시하는 것이 적절합니다. σωτηρίου는 당면한 위협의 문맥을 반영해 ‘구출’로 옮기되, ‘구원’이라는 가능한 폭을 각주로 보존합니다. 하나님을 가리키는 표현과 문체는 표준어 현대 문어체에 맞습니다.
  issues:
