  - severity: low
    issue: 각주 b가 본문 선택 및 대안의 관계를 불명확하게 제시함
    rationale: 본문이 ‘구원’인데 각주는 ‘구출/구원’의 긴장만 말합니다. 본문에 ‘구출’을 택하고 ‘구원’을 대안으로 명시하면 선택의 근거와 어휘 범위가 분명해집니다.
