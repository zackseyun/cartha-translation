translation:
  language: ko
  text: 만일 정말로 당신에게 사람의 정서가 있었고, 하나님께서 주시는 구원을 바라는 희망이 있었다면.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인간의 갈망들’ 혹은 ‘인간의 애정들’. 그리스어 표현은 압축되어 있으며, 보통의 인간적 유대를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘구원’. 그리스어는 여기서 즉각적 구출이나 더 넓은 구원의 뜻을 모두 가질 수 있습니다. 문맥상 ‘구출/구원’의 긴장 가운데 본문은 즉각성을 강하게 띱니다.
    reason: alternative_reading
lexical_decisions:
- source_word: εἴπερ
  english_pob_choice: if indeed
  chosen_korean: 만일 정말로
  alternatives_korean:
  - 만일 참으로
  - 정말로 만일
  lexicon: LSJ
  rationale: 조건을 유지하되 εἴπερ의 강조를 살리기 위해 ‘정말로’를 넣어, 단순한 가정이 아니라 강한 반문적 전제를 드러냈습니다.
- source_word: ἀνθρώπους πόθων
  english_pob_choice: human feelings
  chosen_korean: 사람의 정서
  alternatives_korean:
  - 인간적 정서
  - 사람의 애정
  - 사람의 감정
  lexicon: LSJ
  rationale: 압축된 표현으로서 πόθων의 ‘갈망/애정’ 뉘앙스를 한국어의 ‘정서’로 자연스럽게 옮기되, 문자 그대로의 감정 묘사보다 인간적 유대 능력을 살렸습니다.
- source_word: παρὰ θεῷ
  english_pob_choice: from God
  chosen_korean: 하나님께서 주시는
  alternatives_korean:
  - 하나님에게서
  - 하나님으로부터
  - 하나님께
  lexicon: LSJ
  rationale: παρά + 여격이 가리키는 기원성을 한국어로 분명히 하기 위해 ‘주시는’을 보태어, 희망의 근원이 하나님임을 드러냈습니다.
- source_word: σωτηρίου
  english_pob_choice: for deliverance
  chosen_korean: 구원을 바라는
  alternatives_korean:
  - 구원을 위한
  - 구출을 바라는
  - 해방을 바라는
  lexicon: LSJ
  rationale: 문맥상 즉각적 구조/구출의 의미가 강하지만, 4 마카베오스의 순교 문맥을 고려해 ‘구원’을 택하되 희망의 대상임을 드러내는 서술형으로 자연화했습니다.
theological_decisions:
- issue: σωτηρίου의 번역 범위
  chosen_reading: 구원
  alternative_readings:
  - 구출
  - 해방
  rationale: 이 절은 고난 속에서의 즉각적 구원을 가리키지만, 순교 서사의 더 넓은 신학적 울림도 살아 있으므로 ‘구원’이 문맥적 긴장과 신학적 중층성을 함께 보존합니다.
  doctrine_reference: '번역 원칙: 본문 우선, 문맥상 즉시 의미와 더 넓은 구원 어휘의 긴장 보존'
- issue: εἴπερ의 수사적 강세
  chosen_reading: 만일 정말로
  alternative_readings:
  - 만일 참으로
  - 정말 만일
  rationale: 화자가 상대의 감정 능력을 강하게 따지는 반어적 문맥이므로, 한국어에서도 조건문보다 도전적 뉘앙스가 드러나도록 했습니다.
  doctrine_reference: 문맥 수사 유지
