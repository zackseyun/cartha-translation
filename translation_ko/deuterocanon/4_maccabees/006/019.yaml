  - 먹지 말아야 할 것을 먹는 일
  lexicon: LSJ
  rationale: 복합어의 직역적 구조를 살리되, 문맥상 금지된 음식을 가리키는 의미를 자연스럽게 드러내기 위해 ‘더러운 것을 먹는 일’로 처리했습니다.
