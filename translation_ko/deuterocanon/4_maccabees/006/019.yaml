review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the twofold concern about becoming a negative model for younger people and an example of defiled eating. However, ‘되려고 합니다’ expresses intention (‘intend to become’), whereas the Greek subjunctives express a potential/consequential becoming, not a purpose the speakers embrace. The religious-purity sense of μιαροφαγίας is better represented by ‘부정한 것을 먹는 일’ than the more general ‘더러운 것을 먹는 일.’
  naturalness: ‘경건치 않음’ is understandable but somewhat dated and awkward as a genitive-like modifier in modern formal Korean. ‘불경건의 본보기’ is more idiomatic. Replacing the intentional construction with a consequential future makes the sentence natural and coherent.
  terminology: ‘불경건’ appropriately renders ἀσεβεία. ‘본보기’ for τύπος and ‘예’ for παράδειγμα preserve a modest distinction without unnatural repetition. ‘부정한 것을 먹는 일’ conveys defiled/unclean eating in this ritual and moral context without specifying the food beyond the Greek.
  issues:
  - severity: high
    issue: ‘되려고 합니다’ misrenders the force of γενώμεθα.
    rationale: 'This Korean expression means that the speakers intend or plan to become such an example. The Greek construction presents the feared/potential result: they would become a pattern and example.'
  - severity: medium
    issue: ‘더러운 것을 먹는 일’ is too general for μιαροφαγία in context.
    rationale: The term concerns defiled or unclean eating, with a religious-purity dimension. ‘부정한 것을 먹는 일’ better conveys this while retaining the source’s breadth.
  - severity: low
    issue: ‘경건치 않음’ is less natural in contemporary formal Korean.
    rationale: ‘불경건’ is standard, concise, and maintains the religious-moral force of ἀσεβεία.
  revised_text: 그리고 우리 자신이 젊은이들에게 불경건의 본보기가 되어, 부정한 것을 먹는 일의 예가 될 것입니다.[a]
  revised_footnotes:
  - marker: a
    text: 또는 “더러운 것을 먹는 일의 예가 될 것입니다”라고 옮길 수 있습니다.
    reason: lexical_alternative
  revision_rationale: The revision removes an unintended sense of deliberate purpose, uses natural modern formal Korean, and renders the defilement/purity force of μιαροφαγίας more precisely. It retains the rhetorical distinction between τύπος (‘본보기’) and παράδειγμα (‘예’).
