revisions:
- from: 그리고 우리 자신이 젊은이들에게 경건치 않음의 본보기가 되어, 우리가 더러운 것을 먹는 일의 본이 되려고 합니다.[a]
  to: 그리고 우리 자신이 젊은이들에게 불경건의 본보기가 되어, 부정한 것을 먹는 일의 예가 될 것입니다.[a]
  rationale: The revision removes an unintended sense of deliberate purpose, uses natural modern formal Korean, and renders the defilement/purity force of μιαροφαγίας more precisely. It retains the rhetorical distinction between τύπος (‘본보기’) and παράδειγμα (‘예’).
  reviewer_model: gpt-5.6-terra
