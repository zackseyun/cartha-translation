  text: But the noble-minded and truly well-born Eleazar[a], as though being tortured in a dream, was not turned aside in any way.
  footnotes:
  - marker: a
    text: Or, 'as if in a dream.' The Greek uses a simile, not a literal claim that Eleazar was dreaming.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 참으로 고결한 마음과 훌륭한 출신의 엘르아살은 — 마치 꿈속에서 고문을 당하는 듯했지만 — 결코 조금도 흔들리지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘꿈속인 듯이’. 그리스어는 비유를 사용하며, 엘르아살이 실제로 꿈을 꾸었다고 말하는 것은 아닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγαλόφρων
  english_pob_choice: noble-minded
  chosen_korean: 고결한 마음
  alternatives_korean:
  - 고상한 마음
  - 고귀한 마음
  lexicon: LSJ
  rationale: 정신적·도덕적 고귀함을 가리키므로, 한국어에서는 자연스러운 표현인 ‘고결한 마음’으로 옮겨 인격적 품격을 살렸습니다.
- source_word: εὐγενής
  english_pob_choice: well-born
  chosen_korean: 훌륭한 출신
  alternatives_korean:
  - 명문 출신
  - 귀족 출신
  lexicon: LSJ
  rationale: 앞의 μεγαλόφρων이 내적 고귀함을 나타내므로, εὐγενής는 혈통·출신의 뉘앙스를 살려 ‘훌륭한 출신’으로 구분했습니다.
- source_word: ὥσπερ ἐν ὀνείρῳ
  english_pob_choice: as though being tortured in a dream
  chosen_korean: 마치 꿈속에서 고문을 당하는 듯했지만
  alternatives_korean:
  - 꿈속에서 고문을 당하는 것처럼
  - 꿈을 꾸는 듯 고문을 당하면서
  lexicon: LSJ
  rationale: 비유 표현이므로 실제로 꿈을 꾸었다는 뜻으로 오해되지 않게 ‘마치 … 듯’ 구조를 사용했습니다.
- source_word: μετετρέπετο
  english_pob_choice: was not turned aside
  chosen_korean: 결코 조금도 흔들리지 않았습니다
  alternatives_korean:
  - 결코 돌이키지 않았습니다
  - 결코 빗나가지 않았습니다
  lexicon: LSJ
  rationale: 수동형의 ‘돌려지다/꺾이다’ 의미를 한국어의 자연스러운 저항·불굴 표현으로 살려, 압박 아래서도 의지가 꺾이지 않았음을 전달했습니다.
theological_decisions:
- issue: 비유의 성격(꿈속의 실제 체험 여부)
  chosen_reading: ‘꿈속에서 고문을 당하는 듯’이라는 비유로 처리해, 실제 꿈을 꾸었다는 진술로 만들지 않았습니다.
  alternative_readings:
  - ‘꿈처럼’이라는 완화된 비유
  - 꿈과 같은 비현실감을 강조하는 해석
  rationale: 그리스어 ὥσπερ ἐν ὀνείρῳ는 비교 구문이므로, 순교 장면의 묘사적 효과를 살리되 사실 진술로 과장하지 않는 것이 본문에 충실합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
