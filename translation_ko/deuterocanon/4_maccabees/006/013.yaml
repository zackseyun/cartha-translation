  source_fidelity: 수정이 필요합니다. 원문의 τινες τῶν τοῦ βασιλέως는 뒤따르는 두 부류 모두를 포괄하는 ‘왕에게 속한 사람들 가운데 몇몇’을 가리킵니다. 초안은 첫 부류만 ‘왕의 사람들’로 한정하고, 둘째 부류를 별도의 사람들처럼 제시하여 범위가 흐려집니다. 또한 τῆς συνηθείας는 문맥상 그와의 오랜 알고 지냄을 뜻하므로 이를 명시하는 편이 충실합니다.
  naturalness: ‘몇몇은 왕의 사람들이었는데’는 어색하고 대조 병렬의 구조를 충분히 드러내지 못합니다. ‘왕의 사람들 가운데 몇몇은 … 또 몇몇은 …’이 현대 표준 한국어의 합쇼체 서술에서 자연스럽고 명료합니다. καρτερία에 대해서는 단순한 놀라움보다 긍정적 경탄을 나타내는 ‘감탄하여’가 θαυμαστός 계열의 문맥에 더 알맞습니다.
  terminology: ‘동정심’, ‘인내’는 적절합니다. ‘오래 알고 지낸 까닭에’는 친숙함/오랜 교제를 과장하지 않으면서 관계적 의미를 자연스럽게 전달합니다. 각주 표지는 해당 어구에 직접 붙여야 합니다.
  issues:
