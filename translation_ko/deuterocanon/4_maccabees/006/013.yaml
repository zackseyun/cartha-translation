translation:
  language: ko
  text: 왕의 사람들 가운데 몇몇은 그와 오래 알고 지낸 까닭에[a] 동정심을 품고, 또 몇몇은 그의 인내에[b] 감탄하여 그에게 다가와 말하고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그와 친숙했기 때문에’입니다. 그리스어 τῆς συνηθείας는 오랜 교제나 친숙함을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 굳센 견딤을 경탄하여’입니다. 그리스어 καρτερία는 고난 가운데서 보이는 인내와 굳센 견딤을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν συμπαθείᾳ τῆς συνηθείας
  english_pob_choice: being moved by sympathy because of their long acquaintance with him
  chosen_korean: 오랜 친숙함 때문에 동정심을 느꼈고
  alternatives_korean:
  - 친밀함 때문에 동정심을 느꼈고
  - 오랜 교분 때문에 측은한 마음이 들었고
  - 오랫동안 알고 지낸 탓에 동정심을 품었고
  lexicon: LSJ
  rationale: συμπάθεια의 정서적 뉘앙스는 ‘동정심’으로, τῆς συνηθείας는 단순한 지식이 아니라 오래된 친숙함/교제 관계를 가리켜 ‘오랜 친숙함’으로 옮겼습니다.
- source_word: ἐν θαυμαστῷ τῆς καρτερίας
  english_pob_choice: in admiration of his endurance
  chosen_korean: 그의 인내에 놀라며
  alternatives_korean:
  - 그의 인내를 경탄하며
  - 그의 굳센 버팀에 감탄하며
  - 그의 인내를 보고 놀라며
  lexicon: LSJ
  rationale: θαυμαστῷ는 놀라움과 경탄의 태도를, καρτερία는 고난 아래의 인내·버팀을 뜻하므로 ‘놀라며’와 ‘인내’의 결합이 핵심 의미를 압축합니다.
- source_word: προσίοντες αὐτῷ
  english_pob_choice: approaching him
  chosen_korean: 그에게 다가와
  alternatives_korean:
  - 그에게 가까이 와
  - 그에게 접근하며
  - 그에게 나아와
  lexicon: LSJ
  rationale: 현재 분사 προσίοντες는 동작의 진행성을 살리는 것이 자연스러워 ‘다가와’로 옮겼습니다.
- source_word: τινες τῶν τοῦ βασιλέως
  english_pob_choice: some of the king’s men
  chosen_korean: 몇몇은 왕의 사람들이었는데
  alternatives_korean:
  - 왕의 신하들 가운데 몇몇은
  - 왕에게 속한 사람들 가운데 몇몇은
  - 몇몇 왕의 부하들은
  lexicon: LSJ
  rationale: τού βασιλέως는 왕에 딸린 사람들/측근들을 가리키므로 지나친 직함을 더하지 않고 ‘왕의 사람들’로 자연스럽게 처리했습니다.
