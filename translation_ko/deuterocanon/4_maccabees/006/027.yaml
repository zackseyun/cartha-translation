  chosen_korean: 당신께서는 ... 아십니다
  alternatives_korean:
  - 하나님, ... 알고 계십니다
  - 하나님, ... 아십니다
  lexicon: LSJ
  rationale: 직접 호소하는 기도문이므로 ‘당신께서는’으로 대상을 분명히 하고, 현재형 ‘아십니다’로 간결한 호소의 힘을 살렸습니다.
- source_word: παρὸν μοι σῴζεσθαι
  english_pob_choice: though it is possible for me to be saved
  chosen_korean: 제가 구원받을 수 있음
  alternatives_korean:
  - 제가 살 길이 열려 있음
  - 제가 안전하게 벗어날 수 있음
  - 제가 구출될 수 있음
  lexicon: LSJ
  rationale: 문맥상 현재 가능한 육체적 구출/보존을 가리키므로, 구속사적 ‘구원’으로 좁히지 않으면서도 ‘구원받을 수 있음’으로 원문의 σῴζεσθαι를 살렸습니다.
- source_word: βασάνοις καυστικαῖς
  english_pob_choice: in burning torments
  chosen_korean: 뜨거운 고문 속에서
  alternatives_korean:
  - 불타는 고통 속에서
  - 화끈거리는 형벌 속에서
  - 불같은 고문 속에서
  lexicon: LSJ
  rationale: βασάνοις는 고문/고통, καυστικαῖς는 태우는 성격을 더하므로, ‘뜨거운 고문’으로 자연스럽게 옮겨 시적 과장을 피하면서도 의미를 유지했습니다.
- source_word: διὰ τὸν νόμον
  english_pob_choice: because of the law
  chosen_korean: 율법 때문에
  alternatives_korean:
  - 율법을 위해
