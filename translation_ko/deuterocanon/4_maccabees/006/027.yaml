  text: You know[a], O God, that though it is possible for me to be saved[b], I am dying in burning torments because of the law.
  footnotes:
  - marker: a
    text: Or 'to escape safely' or 'to be delivered'; here the sense is that a way of physical rescue remains open to him.
    reason: lexical_alternative
  - marker: b
    text: Or 'for the sake of the law.' The reference is to steadfast fidelity to the Mosaic law under persecution.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님, 당신께서는 제가 구원받을 수 있음을 아십니다[a]. 그러나 저는 율법 때문에 뜨거운 고문 속에서 죽어 가고 있습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘안전하게 벗어날 수 있음’, ‘구출될 수 있음’. 여기서는 육체적으로 구제될 길이 아직 열려 있다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘율법을 위하여’. 여기서는 모세 율법에 대한 흔들림 없는 충성을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ οἶσθα
