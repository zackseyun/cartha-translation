  lexicon: LSJ
  rationale: 원문은 원인 관계를 말하므로 ‘때문에’가 가장 직접적입니다. 여기서 νόμος는 토라/모세 율법을 가리키므로 ‘율법’으로 번역했습니다.
theological_decisions:
- issue: σῴζεσθαι의 범위
  chosen_reading: 문맥상 육체적 구출 가능성을 뜻하는 것으로 읽되, 한국어는 ‘구원받을 수 있음’으로 원문 어휘와 긴장을 보존했습니다.
  alternative_readings:
  - 살아남을 수 있음
  - 도망칠 수 있음
  - 구출될 수 있음
  rationale: 앞뒤 문맥이 순교 상황의 회피 가능성과 실제 고통스러운 죽음을 대비하므로, 영적 구원으로 단정하지 않고 물리적 보존의 의미를 우선했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve theological tension rather than resolve it'
