  text: You know[a], O God, that though it is possible for me to be saved[b], I am dying in burning torments because of the law.
  footnotes:
  - marker: a
    text: Or 'to escape safely' or 'to be delivered'; here the sense is that a way of physical rescue remains open to him.
    reason: lexical_alternative
  - marker: b
    text: Or 'for the sake of the law.' The reference is to steadfast fidelity to the Mosaic law under persecution.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님, 주님께서는 제가 구원받을 수 있는데도[a], 제가 율법 때문에[b] 불타는 고문을 당하며 죽어 가는 것을 아십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘안전하게 벗어날 수 있는데도’, ‘구출될 수 있는데도’. 여기서는 육체적으로 구제될 길이 아직 열려 있다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘율법을 위하여’. 여기서는 모세 율법에 대한 흔들림 없는 충성을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ οἶσθα
  english_pob_choice: You know
  chosen_korean: 당신께서는 ... 아십니다
  alternatives_korean:
  - 하나님, ... 알고 계십니다
  - 하나님, ... 아십니다
  lexicon: LSJ
  rationale: 직접 호소하는 기도문이므로 ‘당신께서는’으로 대상을 분명히 하고, 현재형 ‘아십니다’로 간결한 호소의 힘을 살렸습니다.
- source_word: παρὸν μοι σῴζεσθαι
  english_pob_choice: though it is possible for me to be saved
  chosen_korean: 제가 구원받을 수 있음
  alternatives_korean:
  - 제가 살 길이 열려 있음
  - 제가 안전하게 벗어날 수 있음
  - 제가 구출될 수 있음
  lexicon: LSJ
  rationale: 문맥상 현재 가능한 육체적 구출/보존을 가리키므로, 구속사적 ‘구원’으로 좁히지 않으면서도 ‘구원받을 수 있음’으로 원문의 σῴζεσθαι를 살렸습니다.
- source_word: βασάνοις καυστικαῖς
  english_pob_choice: in burning torments
  chosen_korean: 뜨거운 고문 속에서
  alternatives_korean:
  - 불타는 고통 속에서
  - 화끈거리는 형벌 속에서
  - 불같은 고문 속에서
  lexicon: LSJ
  rationale: βασάνοις는 고문/고통, καυστικαῖς는 태우는 성격을 더하므로, ‘뜨거운 고문’으로 자연스럽게 옮겨 시적 과장을 피하면서도 의미를 유지했습니다.
- source_word: διὰ τὸν νόμον
  english_pob_choice: because of the law
  chosen_korean: 율법 때문에
  alternatives_korean:
  - 율법을 위해
  - 율법으로 말미암아
  - 율법을 지키려다
  lexicon: LSJ
  rationale: 원문은 원인 관계를 말하므로 ‘때문에’가 가장 직접적입니다. 여기서 νόμος는 토라/모세 율법을 가리키므로 ‘율법’으로 번역했습니다.
theological_decisions:
- issue: σῴζεσθαι의 범위
  chosen_reading: 문맥상 육체적 구출 가능성을 뜻하는 것으로 읽되, 한국어는 ‘구원받을 수 있음’으로 원문 어휘와 긴장을 보존했습니다.
  alternative_readings:
  - 살아남을 수 있음
  - 도망칠 수 있음
  - 구출될 수 있음
  rationale: 앞뒤 문맥이 순교 상황의 회피 가능성과 실제 고통스러운 죽음을 대비하므로, 영적 구원으로 단정하지 않고 물리적 보존의 의미를 우선했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve theological tension rather than resolve it'
