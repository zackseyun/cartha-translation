  text: Let us not think so badly, we who are Abraham’s children, as to become fainthearted and act out a disgraceful scene unworthy of us.
translation:
  language: ko
  text: 우리는 아브라함의 자손으로서 이렇게 악하게 생각하여 기운이 꺾인 채 우리에게 어울리지 않는 수치스러운 장면을 연기해서는 안 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘연기하다/가장하다’의 뉘앙스가 강하므로, POB의 ‘act out’에 맞춰 ‘연기하다’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ οὕτως κακῶς φρονήσαιμεν
  english_pob_choice: Let us not think so badly
  chosen_korean: 우리는 이렇게 악하게 생각해서는 안 됩니다
  alternatives_korean:
  - 우리는 그렇게 나쁘게 생각해서는 안 됩니다
  - 우리는 이처럼 악한 마음을 품어서는 안 됩니다
  lexicon: φρονέω
  rationale: φρονέω는 단순한 의견보다 태도·사고방식을 가리키므로, 도덕적 완곡화 없이 ‘악하게 생각하다’로 옮겨 경고의 강도를 살렸습니다.
- source_word: οἱ Ἀβραὰμ παῖδες
  english_pob_choice: we who are Abraham’s children
  chosen_korean: 우리는 아브라함의 자손으로서
  alternatives_korean:
  - 우리는 아브라함의 자녀로서
  - 우리는 아브라함의 아이들로서
  lexicon: παῖς
  rationale: παῖδες는 혈통적·언약적 소속을 드러내므로, 한국어에서는 자연스러운 성경 문체의 ‘자손’으로 풀어 소속감을 살렸습니다.
- source_word: μαλακοψυχήσαντας
  english_pob_choice: become fainthearted
  chosen_korean: 기운이 꺾인 채
  alternatives_korean:
  - 낙심한 채
  - 마음이 약해진 채
  lexicon: μαλακοψυχέω
  rationale: 이 동사는 ‘약한 영혼/기운이 빠진 상태’를 뜻하므로, 내면의 용기 상실을 드러내는 표현으로 옮겼습니다.
- source_word: ἀπρεπὲς ἡμῖν δρᾶμα ὑποκρίνασθαι
  english_pob_choice: act out a disgraceful scene unworthy of us
  chosen_korean: 우리에게 어울리지 않는 수치스러운 장면을 연기해서는 안 됩니다
  alternatives_korean:
  - 우리답지 않은 수치스러운 연극을 해서는 안 됩니다
  - 우리에게 합당하지 않은 치욕스러운 장면을 꾸며서는 안 됩니다
  lexicon: δρᾶμα, ὑποκρίνομαι
  rationale: δρᾶμα는 ‘장면/드라마’, ὑποκρίνασθαι는 ‘연기하다’이므로, POB의 ‘scene / act out’을 따라 ‘장면을 연기하다’로 직역성을 살렸습니다.
theological_decisions:
- issue: 아브라함의 자손 정체성의 윤리적 기능
  chosen_reading: 혈통적 표현을 단순 호칭이 아니라, 수치스러운 행동을 거부해야 하는 언약적 정체성의 근거로 읽었습니다.
  alternative_readings:
  - 단순히 유대인이라는 민족적 자기호칭으로만 읽기
  - 신앙적 후손이라는 영적 의미로만 넓혀 읽기
  rationale: 문맥상 이 표현은 조상 아브라함에 대한 소속이 현재의 태도와 행동을 규정한다는 논증에 쓰이므로, 정체성과 윤리의 연결을 살렸습니다.
  doctrine_reference: 정체성 윤리 / 언약 공동체의 책임
