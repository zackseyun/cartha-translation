review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the inclusive exhortation, Abrahamic descent, loss of courage, and the theatrical metaphor. However, ‘악하게 생각하여’ sounds like morally evil thinking and is awkward in Korean; in this context κακῶς φρονεῖν is better conveyed as cowardly/base-minded thinking. ‘기운이 꺾인 채’ is less precise than a direct expression of becoming fainthearted. The double wording ‘우리에게 어울리지 않는 수치스러운’ somewhat overstates and duplicates ἀπρεπές (‘unseemly/unfitting’).
  naturalness: The proposed revision uses natural modern formal Korean while preserving the rhetorical and theatrical force of the Greek. ‘부끄러운 연극을 벌이다’ is an idiomatic Korean rendering of performing an unworthy drama, without the ambiguity that ‘연기하다’ can have in Korean (‘postpone’).
  terminology: ‘아브라함의 자손’ is appropriate for οἱ Ἀβραὰμ παῖδες in this setting. ‘마음이 약해져’ suitably renders μαλακοψυχήσαντας. No doctrinal expansion is introduced.
  issues:
  - severity: medium
    issue: ‘이렇게 악하게 생각하여’ is semantically and stylistically unsuitable.
    rationale: κακῶς in this exhortative context concerns an unworthy, cowardly, or base disposition, not chiefly the commission of moral evil. ‘악하게 생각하다’ is unnatural Korean and can misdirect the sense.
  - severity: low
    issue: ‘기운이 꺾인 채’ weakens the specific sense of becoming fainthearted.
    rationale: μαλακοψυχήσαντας denotes losing courage or becoming fainthearted; ‘마음이 약해져’ is more direct and idiomatic.
  - severity: low
    issue: The phrase ‘우리에게 어울리지 않는 수치스러운 장면’ is redundant and ‘장면을 연기하다’ is less natural Korean.
    rationale: ἀπρεπές already means unfitting or unseemly. The Greek theatrical image is naturally preserved in Korean with ‘부끄러운 연극을 벌이다.’
  revised_text: 아브라함의 자손인 우리가 그처럼 비겁한 생각을 품어, 마음이 약해져 우리에게 어울리지 않는 부끄러운 연극을 벌여서는 안 됩니다.[a]
  revised_footnotes:
