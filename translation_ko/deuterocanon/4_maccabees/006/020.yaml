  text: For it would be shameful if we should live on for a little while, and that while being mocked by everyone for cowardice.
translation:
  language: ko
  text: 우리가 잠시라도 살아남는다면 부끄러운 일입니다. 더구나 모두에게 겁쟁이로 조롱받는 처지라면 더욱 그렇습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰσχρὸν
  english_pob_choice: shameful
  chosen_korean: 부끄러운 일
  alternatives_korean:
  - 수치스러운 일
  - 치욕스러운 일
  lexicon: LSJ
  rationale: 공적 수치와 명예의 손상을 함께 드러내는 표현으로, 마카베오의 맥락에 맞는 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: ἐπιβιώσομεν
  english_pob_choice: we should live on
  chosen_korean: 살아남는다면
  alternatives_korean:
  - 계속 살아간다면
  - 조금 더 산다면
  lexicon: LSJ
  rationale: 단순 생존이 아니라 위협 속에서 목숨을 이어 가는 뉘앙스를 살리기 위해 ‘살아남다’를 택했습니다.
- source_word: καταγελώμενοι
  english_pob_choice: being mocked
  chosen_korean: 조롱받는
  alternatives_korean:
  - 웃음거리가 되는
  - 비웃음을 받는
  lexicon: LSJ
  rationale: 공개적이고 지속적인 경멸을 나타내므로, ‘조롱받는’이 가장 직접적으로 대응합니다.
- source_word: ἐπὶ δειλίᾳ
  english_pob_choice: for cowardice
  chosen_korean: 겁쟁이로
  alternatives_korean:
  - 비겁함 때문에
  - 겁이 많아서
  lexicon: LSJ
  rationale: 원인의 ‘~로/때문에’를 한국어에서 자연스럽게 풀어, 조롱의 이유가 비겁함이라는 점을 강하게 드러냈습니다.
theological_decisions:
