  terminology: ‘부끄러운 일’은 αἰσχρόν의 공적 불명예를 자연스럽게 옮깁니다. ‘비겁하다는 이유로’는 ἐπὶ δειλίᾳ의 조롱 근거를, ‘모두에게 조롱을 받는’은 πρὸς ἀπάντων καταγελώμενοι를 충실히 반영합니다.
