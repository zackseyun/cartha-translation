  rationale: 이 절은 순교적 결의의 수사로서 명예-수치 구도를 전면에 두므로, 완곡하게 누그러뜨리지 않고 직접적으로 번역했습니다.
  doctrine_reference: 마카베오서의 순교 윤리와 공동체적 명예 개념
