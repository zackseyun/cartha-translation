  source_fidelity: 개정이 필요합니다. 초안은 αἰσχρόν, ἐπιβιώσομεν, καταγελώμενοι, πρὸς ἀπάντων, ἐπὶ δειλίᾳ의 기본 뜻을 대체로 잘 반영하지만, ‘잠시라도’는 ὀλίγον χρόνον의 단순한 짧은 기간에 ‘설령 잠시라도’라는 양보적 강조를 더합니다. 또한 ‘더구나’와 ‘더욱 그렇습니다’는 그리스어의 단순 접속 καί 및 τοῦτον(‘그 기간을’)보다 강한 추가적·점층적 논리를 도입합니다.
