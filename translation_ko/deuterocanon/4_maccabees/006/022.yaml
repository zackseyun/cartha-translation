  - 너희는 물론
  lexicon: BDAG
  rationale: μέν의 대비·강조는 한국어 어순과 주제표지로 충분히 살릴 수 있어, 불필요한 확대 없이 직접 호격 뒤에 주어를 놓았습니다.
- source_word: ὦ Ἀβραὰμ παῖδες
  english_pob_choice: O children of Abraham
  chosen_korean: 아브라함의 자손들아
  alternatives_korean:
  - 아브라함의 자녀들아
  - 아브라함의 아들들아
  - 아브라함의 후손들아
  lexicon: BDAG
  rationale: vocative의 호소성을 살리되, παῖδες의 친족·언약적 뉘앙스를 ‘자손들아’로 옮겨 남녀를 지나치게 한정하지 않았습니다.
- source_word: ὑπὲρ τῆς εὐσεβείας
  english_pob_choice: for the sake of godliness
  chosen_korean: 경건을 위하여
  alternatives_korean:
  - 경건을 위해
  - 하나님께 대한 경건을 위하여
  - 경건한 삶을 위하여
  lexicon: BDAG
  rationale: εὐσέβεια의 유대-헬라적 의미를 반영해 ‘경건’으로 옮기고, ὑπέρ의 목적·대가 뉘앙스를 한국어 조사구 ‘위하여’로 담았습니다.
- source_word: τελευτᾶτε
  english_pob_choice: die
  chosen_korean: 죽습니다
  alternatives_korean:
  - 숨을 거둡니다
  - 죽어 갑니다
  - 마지막을 맞습니다
  lexicon: BDAG
  rationale: 문맥상 순교적 죽음을 가리키므로, 과장하지 않으면서도 직접적인 ‘죽습니다’가 가장 분명합니다.
theological_decisions:
