  language: ko
  text: 이 일에 대하여, 너희는, 아브라함의 자손들아, 경건을 위하여 고귀하게 죽습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경건을 위하여.’ 그리스어 εὐσέβεια는 하나님께 대한 경외가 신실한 행실로 드러나는 태도를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ταῦτα
  english_pob_choice: In response to this
  chosen_korean: 이 일에 대하여
  alternatives_korean:
  - 이것에 대하여
  - 이에 응하여
  - 이 말에 대한 답으로
  lexicon: LSJ
  rationale: 직전 발언에 대한 반응을 나타내는 연결구로 보고, 현대 한국어에서 자연스러운 담화 연결인 ‘이 일에 대하여’로 옮겼습니다.
- source_word: ὑμεῖς μέν
  english_pob_choice: you
  chosen_korean: 너희는
  alternatives_korean:
  - 너희는 참으로
