  text: There[a], while burning him with instruments devised for torture[c][b], they flung themselves upon him and poured foul-smelling broths into his nostrils.
  footnotes:
  - marker: a
    text: Or 'with cruelly contrived instruments.' The Greek phrase emphasizes devices skillfully made for harmful use.
    reason: lexical_alternative
  - marker: b
    text: Or 'they rushed upon him.' The verb can suggest a violent springing or assaulting movement.
    reason: lexical_alternative
  - marker: c
