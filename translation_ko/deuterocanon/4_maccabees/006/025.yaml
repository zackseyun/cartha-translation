    reason: lexical_alternative
  - marker: c
    text: χυλούς는 여기서 반드시 ‘국물’로만 좁히지 않고, 코에 부을 수 있는 액체성 혼합물을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
