  text: There[a], while burning him with instruments devised for torture[c][b], they flung themselves upon him and poured foul-smelling broths into his nostrils.
  footnotes:
  - marker: a
    text: Or 'with cruelly contrived instruments.' The Greek phrase emphasizes devices skillfully made for harmful use.
    reason: lexical_alternative
  - marker: b
    text: Or 'they rushed upon him.' The verb can suggest a violent springing or assaulting movement.
    reason: lexical_alternative
  - marker: c
    text: Or 'fetid liquids' for 'foul-smelling broths.' The noun may denote a liquid mixture rather than a thick porridge.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때, 고문용으로 고안된 도구로 그를 태우면서 그들[a][b]은 그에게 달려들어 악취 나는 액체[c]를 그의 콧구멍에 부어 넣었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들’은 원문의 복수 주어를 그대로 살린 표현입니다.
    reason: source_note
  - marker: b
    text: ‘달려들어’는 ὑπερίπτοσαν의 폭력적인 돌진·습격 뉘앙스를 살린 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: χυλούς는 여기서 반드시 ‘국물’로만 좁히지 않고, 코에 부을 수 있는 액체성 혼합물을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
