translation:
  language: ko
  text: 우리는 몇 가지 삶은 음식을 내놓겠습니다. 그러나 당신은 돼지고기를 맛보는 체하여 목숨을 구하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘돼지의 고기’. 그리스어는 돼지에서 나온 음식, 곧 돼지고기를 구체적으로 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  english_pob_choice: we
  chosen_korean: 우리는
  alternatives_korean:
  - 저희는
  lexicon: SBLGNT
  rationale: 원문의 화자는 복수 주어를 직접 제시하므로 평이한 1인칭 복수인 ‘우리는’이 가장 자연스럽습니다.
- source_word: τῶν ἡψημένων βρωμάτων
  english_pob_choice: roasted foods
  chosen_korean: 익힌 음식들
  alternatives_korean:
  - 구운 음식들
  - 조리한 음식들
  - 익힌 것들
  lexicon: LSJ
  rationale: βρωμάτων은 일반적인 ‘음식들’이고, ἡψημένων은 조리된 상태를 가리키므로 과도하게 육류로 좁히지 않으면서도 식탁에 올릴 준비가 된 음식을 살리는 ‘익힌 음식들’로 옮겼습니다.
- source_word: ὑποκρινόμενος
  english_pob_choice: by pretending
  chosen_korean: 맛보는 척하면서
  alternatives_korean:
  - 가장하여
  - 흉내 내며
  - pretending to taste
  lexicon: LSJ
  rationale: 단순한 외형적 연기가 아니라 ‘맛보는 시늉’이라는 구체적 행동을 드러내기 위해 한국어 자연성에 맞게 풀어 옮겼습니다.
- source_word: τῶν ὑείων
  english_pob_choice: pork
  chosen_korean: 돼지고기
  alternatives_korean:
  - 돼지의 고기
  - 돼지 살코기
  - 돼지고기
  lexicon: LSJ
  rationale: 원문은 돼지에서 나온 음식, 곧 금지된 식물을 가리키므로 현대 한국어에서 직관적인 ‘돼지고기’가 적절합니다.
- source_word: σώθητι
  english_pob_choice: save yourself
  chosen_korean: 자기 목숨을 구하십시오
  alternatives_korean:
  - 구원받으십시오
  - 살아남으십시오
  - 목숨을 건지십시오
  lexicon: SBLGNT
  rationale: 문맥상 종교적 ‘구원’보다 즉각적인 생명 보존의 권면이므로, 도덕적 압박을 살리면서도 오해를 줄이는 표현으로 옮겼습니다.
theological_decisions:
- issue: σώθητι의 의미 범위
  chosen_reading: 즉각적인 생존을 권하는 말로 이해해 ‘자기 목숨을 구하십시오’로 번역했습니다.
  alternative_readings:
  - 구원받으십시오
  - 살아남으십시오
  rationale: 이 장면은 순교 상황에서 식사를 가장해 위기를 모면하라는 제안이므로, 구속사적 ‘구원’보다 물리적 생존이 핵심입니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 돼지 고기 금지의 압박감
  chosen_reading: ‘돼지고기’로 직접 옮겨 유대 율법상의 금기와 서사의 긴장감을 분명히 했습니다.
  alternative_readings:
  - 부정한 고기
  - 돼지의 살
  rationale: 원문의 도덕적 시험은 특정한 금지 식물에 달려 있으므로, 완곡하게 돌리지 않고 현대 독자가 즉시 이해할 수 있게 했습니다.
  doctrine_reference: Translation philosophy §§1, 6
