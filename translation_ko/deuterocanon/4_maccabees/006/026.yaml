  text: But he, already burned down to his bones and about to faint, lifted his eyes to God and said,
translation:
  language: ko
  text: 그러나 그는 이미 뼛속까지 타 버렸고 기절하려 하고 있었지만, 하나님을 향해 눈을 들어 말했습니다.
  philosophy: formal
lexical_decisions:
- source_word: μέχρι ὀστέων ἤδη κατακεκαυμένος
  english_pob_choice: already burned down to his bones
  chosen_korean: 이미 뼛속까지 타 버렸고
  alternatives_korean:
  - 이미 뼈까지 타 버렸고
  - 이미 뼛속까지 불탔고
  lexicon: κατακαίω
  rationale: English POB의 ‘down to his bones’를 그대로 반영하되, 한국어에서는 상태의 완결성과 극단성을 살려 ‘뼛속까지 타 버렸고’로 자연스럽게 옮겼습니다.
- source_word: μέλλων λιποθυμεῖν
  english_pob_choice: about to faint
  chosen_korean: 기절하려 하고 있었지만
  alternatives_korean:
  - 쓰러지려 하고 있었지만
  - 정신을 잃으려 하고 있었지만
  lexicon: λιποθυμέω
  rationale: 곧 의식을 잃는 상태를 표준어로 분명하게 드러내기 위해 ‘기절하다’를 사용했습니다.
- source_word: ἀνέτεινεν τὰ ὄμματα πρὸς τὸν θεόν
  english_pob_choice: lifted his eyes to God
  chosen_korean: 하나님을 향해 눈을 들어
  alternatives_korean:
  - 하나님께 눈을 들어
  - 하나님을 바라보며 눈을 들어
  lexicon: ἀνατείνω + ὄμματα
  rationale: 직역하면 ‘눈을 들어’이지만, 목적어 방향을 한국어 조사로 자연화해 행위의 방향성을 유지했습니다.
theological_decisions:
- issue: θɛός의 표기
  chosen_reading: 하나님
  alternative_readings:
  - 신
  - 주님
  rationale: 본문의 θεός는 일반적으로 유일신을 가리키므로 프로젝트 기본어인 ‘하나님’을 사용했습니다.
  doctrine_reference: 표준 한국어 성경 용례 및 프로젝트 용어집
- issue: 서술의 긴박성
  chosen_reading: ‘기절하려 하고 있었지만’으로 생리적 한계를 드러내되, 다음 행위(하나님을 향해 눈을 듦)를 끊지 않고 연결했습니다.
  alternative_readings:
  - ‘기절 직전이었지만’
  - ‘쓰러지기 일보 직전이었지만’
  rationale: 이 절은 순교자의 육체적 극한과 그럼에도 하나님을 향한 의지를 대비시키므로, 긴박성을 과장하지 않으면서도 힘을 유지하는 쪽이 본문 의도에 가깝습니다.
  doctrine_reference: 4 Maccabees의 순교 서술 맥락
