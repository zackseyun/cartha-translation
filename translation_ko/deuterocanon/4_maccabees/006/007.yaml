  text: And falling to the ground because his body could not bear the pains[a], he kept his reason upright and unbending.
  footnotes:
  - marker: a
    text: Or 'his rational judgment' for 'his reason'; the Greek term carries a philosophical sense of reasoned moral judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 땅에 쓰러지면서도, 그의 몸이 그 고통들을 견디지 못하였으므로, 그는 자신의 이성을 곧고 흔들림 없이 지니고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이성적 판단’으로 옮길 수 있습니다. 여기의 그리스어는 철학적으로 ‘이성’ 또는 ‘이성적 판단’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίπτων
  english_pob_choice: falling
  chosen_korean: 쓰러지면서도
  alternatives_korean:
  - 넘어지면서도
  - 땅에 떨어지면서도
  lexicon: LSJ
  rationale: 현재분사로 이어지는 동시적 동작과 역접의 뉘앙스를 살려, 육체는 무너져도 뒤따르는 내적 태도를 대비시키는 표현으로 옮겼습니다.
- source_word: ἀπὸ τοῦ μὴ φέρειν
