  chosen_korean: 그의 몸이 ... 견디지 못하였으므로
  alternatives_korean:
  - '... 감당하지 못했기 때문에'
  - '... 참아 내지 못하였으므로'
  lexicon: LSJ
  rationale: 원인 표시를 분명히 하면서, 고통의 육체적 감내 불가능성을 자연스러운 한국어로 드러냈습니다.
- source_word: ὀρθὸν εἶχεν καὶ ἀκλινῆ
  english_pob_choice: he kept ... upright and unbending
  chosen_korean: 곧고 흔들림 없이 지니고 있었습니다
  alternatives_korean:
  - 곧게 그리고 굽힘 없이 유지하고 있었습니다
  - 바르고 꺾이지 않게 간직하고 있었습니다
  lexicon: LSJ
  rationale: ‘upright’와 ‘unbending’의 병치를 한국어의 도덕·지적 안정성 표현으로 옮기되, 과도하게 물리화하지 않도록 했습니다.
- source_word: τὸν λογισμόν
  english_pob_choice: his reason
  chosen_korean: 자신의 이성
  alternatives_korean:
  - 자신의 판단
  - 자신의 이성적 판단
  lexicon: LSJ
  rationale: 4 마카베오서에서 λογισμός가 지닌 철학적·윤리적 ‘이성/이성적 판단’의 의미를 살려, 단순한 ‘마음’보다 ‘이성’을 택했습니다.
theological_decisions:
- issue: 육체적 고통과 이성의 대조를 어떻게 보존할 것인가
  chosen_reading: 몸은 고통을 견디지 못했지만, 그는 이성을 곧고 흔들림 없이 지니고 있었다는 대비로 살렸습니다.
  alternative_readings:
  - 몸은 고통을 이기지 못했으나 생각은 굳건했다
  - 육체는 무너졌지만 판단은 흔들리지 않았다
  rationale: 이 구절의 핵심은 육체의 붕괴와 이성의 불굴성을 대비하는 데 있으므로, ‘이성’이라는 철학적 용어를 유지해 본문의 사상적 긴장을 보존했습니다.
  doctrine_reference: 4 Maccabees의 덕 윤리와 이성-정념 대조
