  - 대신하여
  - 대속으로
  lexicon: LSJ
  rationale: 복합어가 생명과 생명의 맞교환, 곧 대체·교환의 뜻을 담고 있으므로 ‘맞바꾸어’가 가장 자연스럽고, ‘대속으로’는 더 신학적 해석을 덧붙입니다.
- source_word: ψυχήν
  english_pob_choice: life
  chosen_korean: 생명
  alternatives_korean:
  - 혼
  - 목숨
  lexicon: LSJ
  rationale: 이 문맥에서 ψυχή는 영혼보다는 내어주는 생명을 가리키므로 ‘생명’이 적절합니다. ‘목숨’도 가능하지만 반복되는 대칭 구조를 살리기에는 ‘생명’이 더 온전합니다.
- source_word: λάβε
  english_pob_choice: take
  chosen_korean: 받아 주십시오
  alternatives_korean:
  - 취하여 주십시오
  - 받으십시오
  lexicon: LSJ
  rationale: 문맥상 하나님께 드리는 간구이므로, 단순 명령형보다 청원형을 살린 ‘받아 주십시오’가 한국어로 더 자연스럽고 경건한 호소를 전달합니다.
theological_decisions:
- issue: 제의적 정결과 대체적 생명 교환의 긴장 보존
  chosen_reading: ‘정결’과 ‘맞바꾸어’의 표현을 유지해, 본문의 제의적·대체적 의미를 풀어 쓰지 않고 드러냈습니다.
  alternative_readings:
  - 내 피로 그들을 깨끗하게 해 주시고, 내 생명을 그들 대신 받아 주십시오
  - 내 피를 그들의 속죄로 삼아 주시고, 내 생명을 그들의 대가로 받아 주십시오
  rationale: 그리스어는 정결 언어와 생명 교환 언어를 함께 사용하므로, 이를 후대 교리 용어로 평탄화하지 않고 그대로 드러내는 것이 본문의 긴장을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
