  terminology: ‘피’ and ‘생명’ appropriately render αἷμα and ψυχή in this martyrdom context. ‘맞바꾸어’ preserves the exchange/substitution force of ἀντίψυχον without the additional commercial or doctrinal specificity of ‘대속물.’ ‘정결하게 하는 것’ preserves καθαρσόν’s purification sense without overtranslating it as ‘속죄.’
