  text: Make my blood their purification[b][a], and take my life in exchange for theirs.
  footnotes:
  - marker: a
    text: Or 'Make my blood their cleansing.' The Greek καθαρσόν can denote purification/cleansing in a cultic sense.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'take my life as an exchange for theirs'; the phrase expresses substitution of life for life. 'As a ransom for theirs' is a possible but more interpretive rendering.
    reason: alternative_reading
translation:
  language: ko
  text: 내 피를 그들을 정결하게 하는 것으로 삼아 주시고[a], 내 생명을 그들의 생명과 맞바꾸어 받아 주십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 피를 그들의 정결로 삼아 주십시오.’ καθαρσόν은 제의적 의미에서 ‘정결하게 함’ 또는 ‘정화’를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘내 생명을 그들의 생명과 맞바꾸어 받아 주십시오’입니다. 이 표현은 생명과 생명의 교환, 곧 대체를 나타냅니다. ‘그들의 대속물로’라고 옮길 수도 있지만, 이는 더 해석적인 표현입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: καθαρσὸν
  english_pob_choice: purification
  chosen_korean: 정결
  alternatives_korean:
  - 깨끗하게 함
  - 정화
  - 속죄
  lexicon: LSJ
  rationale: ποίησον과 함께 쓰인 말로서 제의적·정결적 의미를 살려야 하므로, 한국어에서는 ‘정결’이 가장 직접적입니다. ‘속죄’는 해석을 더 앞세우는 반면, ‘깨끗하게 함’은 다소 약해집니다.
- source_word: αἷμα
  english_pob_choice: blood
  chosen_korean: 피
  alternatives_korean:
