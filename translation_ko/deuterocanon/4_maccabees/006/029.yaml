  source_fidelity: 'The draft correctly retains the two principal images: the speaker''s blood is made a purification for others, and the speaker''s life is taken in life-for-life exchange. However, ‘그들의 정결을 이루어’ weakens the Greek predicative construction, which specifically asks that the blood itself be made a purification. The revision makes that relationship explicit without importing ‘속죄’ or other later doctrinal terminology.'
