  source_fidelity: 개정이 필요합니다. 초안의 ‘지키지 않겠습니까?’는 προασπίσαιμεν의 ‘방패가 되어 방어하다/수호하다’라는 뜻을 충분히 드러내지 못하고, 율법을 준수한다는 의미로도 읽힐 수 있습니다. ‘수호하지 않겠습니까?’가 원문의 비유적·대결적 뜻을 더 정확히 보존합니다. 또한 주어를 명시하고 ‘…이라고 멸시를 당하고서도’로 옮기면 수동 접속법의 수사 의문과 ὡς의 평가 내용을 자연스럽게 반영합니다.
  naturalness: ‘우리가 폭군에게 남자답지 못한 자들이라고 멸시를 당하고서도’는 현대 표준 한국어의 문어적 합쇼체에 자연스럽고, 원문의 대조적 수사 의문을 유지합니다.
  terminology: ‘폭군’, ‘신성한 율법’, ‘죽음에 이르기까지’는 각각 τύραννος, θεῖος νόμος, μέχρι θανάτου에 충실합니다. ἄνανδροι의 성별화된 모욕은 본문에서 유지하되, 각주에서 ‘겁쟁이들’이라는 의미상 대안을 밝혀야 합니다.
