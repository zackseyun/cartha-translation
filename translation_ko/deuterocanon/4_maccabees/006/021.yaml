  yaml_path: translation/deuterocanon/4_maccabees/006/021.yaml
  text: and shall we be despised by the tyrant as unmanly[a], yet not defend our divine law even to death?
  footnotes:
  - marker: a
    text: Or 'cowardly.' The Greek term is literally gendered ('unmanly') and denotes lack of courage.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리가 폭군에게 남자답지 못한 자들이라고 멸시를 당하고서도, 우리의 신성한 율법을 죽음에 이르기까지 수호하지 않겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘남자답지 못한 자들’은 그리스어 ἄνανδροι를 반영합니다. 이 말은 문자적으로 남성적 용기가 없다는 성별화된 조롱이며, 문맥상 ‘겁쟁이들’이라는 뜻에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταφρονηθῶμεν
  english_pob_choice: be despised
  chosen_korean: 업신여김을 당하다
  alternatives_korean:
  - 멸시를 당하다
  - 경멸을 당하다
  lexicon: BDAG
  rationale: 수동적 뉘앙스와 수치를 주는 뉘앙스를 함께 살리기 위해 ‘업신여김을 당하다’를 택했습니다. ‘멸시’도 가능하지만, 문맥의 조롱·경시의 압박을 한국어에서 더 자연스럽게 드러냅니다.
- source_word: τύραννος
  english_pob_choice: tyrant
  chosen_korean: 폭군
  alternatives_korean:
  - 독재자
  - 군주
  lexicon: LSJ
  rationale: 그리스어가 단순한 통치자가 아니라 폭력적이고 전제적인 지배자를 가리키므로, 가치판단을 보존하는 ‘폭군’이 가장 적절합니다.
- source_word: ἄνανδροι
  english_pob_choice: unmanly
  chosen_korean: 남자답지 못한 자들
  alternatives_korean:
  - 겁쟁이들
  - 용기 없는 자들
  lexicon: LSJ
  rationale: 원문은 문자적으로 ‘남자다움이 없는’이라는 성별화된 비난을 담고 있어, 그 수사적 성격을 살리기 위해 직역에 가까운 표현을 택했습니다. ‘겁쟁이들’은 뜻은 분명하지만 성별화된 형식을 약화시킵니다.
- source_word: θεῖον ἡμῶν νόμον
  english_pob_choice: our divine law
  chosen_korean: 우리의 신성한 율법
  alternatives_korean:
  - 우리의 하늘 법
  - 우리의 거룩한 율법
  lexicon: LSJ
  rationale: ἡμῶν을 포함한 소유 관계를 살리면서, 이 유대적 문맥의 νόμος를 관습적으로 ‘율법’으로 옮겼습니다. θεῖον은 ‘신성한’이 가장 간결하고 원문의 종교적 성격을 분명히 드러냅니다.
- source_word: μέχρι θανάτου
  english_pob_choice: even to death
  chosen_korean: 죽음에 이르기까지
  alternatives_korean:
  - 죽기까지
  - 죽음에까지
  lexicon: BDAG
  rationale: 한계점을 나타내는 μέχρι를 한국어에서 자연스럽게 풀어, 순교적 결단의 강도를 분명히 했습니다.
theological_decisions:
- issue: 원문의 성별화된 조롱(ἄνανδροι)을 어떻게 처리할지
  chosen_reading: 성별화된 비난을 유지하되 한국어에서 지나치게 낯설지 않게 ‘남자답지 못한 자들’로 옮겼습니다.
  alternative_readings:
  - 겁쟁이들로 업신여김을 당하면서도
  - 용기 없는 자들로 업신여김을 당하면서도
  rationale: 이 표현은 단순한 비겁함이 아니라 남성성 결핍을 겨냥한 모욕이므로, 윤리적 비난과 수사적 성격을 함께 보존해야 합니다. 한국어 합쇼체 본문에서는 의미 전달을 우선하되, 성별화된 형식도 어느 정도 드러나게 했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
