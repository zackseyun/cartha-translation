translation:
  language: ko
  text: 그의 얼굴에는 땀이 나고, 숨은 몹시 가빴으며[a], 그를 고문하던 바로 그 사람들조차도[b] 그의 용기에 감탄하고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘몹시 가빴으며’는 ἐπασθμαίνων σφοδρῶς를 옮긴 것으로, ‘몹시 헐떡였으며’ 또는 ‘숨을 매우 거칠게 쉬었으며’로도 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘바로 그 사람들조차도’는 αὐτῶν τῶν βασανιζόντων의 강조를 반영합니다. 그를 고문하던 당사자들 자신도 감탄하였다는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: ἱδρῶν γέ τοι τὸ πρόσωπον
  english_pob_choice: His face indeed was sweating
  chosen_korean: 그의 얼굴에서는 땀이 났고
  alternatives_korean:
  - 그의 얼굴이 정말로 땀에 젖어 있었고
  - 그의 얼굴에서는 땀이 흐르고 있었고
  lexicon: LSJ
  rationale: ἱδρῶν은 진행 중인 발한을 나타내며, ‘얼굴에서는 땀이 났고’는 자연스러운 한국어로 원문의 상태를 전달합니다. γέ τοι의 강조는 ‘정말로/참으로’보다 문맥상 연결을 해치지 않는 서술 리듬으로 충분히 살렸습니다.
- source_word: ἐπασθμαίνων σφοδρῶς
  english_pob_choice: was breathing very hard
  chosen_korean: 숨은 몹시 가빴으며
  alternatives_korean:
  - 몹시 헐떡였으며
  - 숨을 매우 거칠게 쉬었으며
  lexicon: LSJ
  rationale: ἐπασθμαίνων은 숨이 가쁘게 몰아쉬는 상태를 가리키므로, ‘숨은 몹시 가빴으며’가 현대 한국어로 가장 자연스럽고 과장되지 않습니다.
- source_word: ὑπʼ αὐτῶν τῶν βασανιζόντων
  english_pob_choice: even by the very men who were torturing him
  chosen_korean: 그를 고문하던 바로 그 사람들조차도
  alternatives_korean:
  - 그를 고문하던 그들 자신조차도
  - 고문하던 바로 그 자들까지도
  lexicon: LSJ
  rationale: αὐτῶν τῶν βασανιζόντων의 강조 구조를 ‘바로 그 사람들조차도’로 옮겨, 단순한 주어 지시가 아니라 ‘고문하던 당사자들’의 놀라움을 드러냈습니다.
- source_word: ἐθαυμάζετο ἐπὶ τῇ εὐψυχίᾳ
  english_pob_choice: was being admired because of his courage
  chosen_korean: 그를 감탄하였습니다
  alternatives_korean:
  - 그의 용기 때문에 그를 칭찬하였습니다
  - 그의 담대함 때문에 그를 놀라워하였습니다
  lexicon: LSJ
  rationale: ἐθαυμάζετο는 수동으로 ‘감탄을 받다/감탄하다’의 뜻이므로, 한국어에서는 수동성을 살리되 문장이 매끄럽도록 정리했습니다. εὐψυχία는 단순한 용맹보다 ‘용기’가 가장 직접적입니다.
theological_decisions:
- issue: 고문자조차 놀라워하는 인내의 묘사
  chosen_reading: 이 구절은 육체적 고통 속에서도 드러나는 담대함이 원수에게조차 인상적이었다는 점을 강조합니다.
  alternative_readings:
  - 단순한 신체 묘사로만 읽는 해석
  - 도덕적 미화로 약화시키는 해석
  rationale: 원문의 수동형 ἐθαυμάζετο와 강조 표현은 고통의 사실성과 그 속에서 빛나는 용기를 함께 드러내므로, 둘 중 하나를 지우지 않고 유지했습니다.
  doctrine_reference: 순교/인내의 증언에 관한 성경적 주제
- issue: 합쇼체 서술 유지
  chosen_reading: 지문은 서술문이므로 합쇼체로 일관하되, 직접 대화가 없으므로 별도의 어조 전환은 두지 않았습니다.
  alternative_readings:
  - 문어체 고어
  - 더 구어적인 해설체
  rationale: 본문은 서사적 진술이어서 현대 표준어의 격식을 유지하는 것이 원문에 가장 충실합니다.
  doctrine_reference: 번역체계/문체 원칙
