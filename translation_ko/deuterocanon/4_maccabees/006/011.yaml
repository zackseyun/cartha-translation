  text: 그의 얼굴에서는 땀이 났고, 숨은 몹시 가빴으며, 그를 고문하던 바로 그 사람들조차도 그의 용기 때문에 그를 감탄하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
