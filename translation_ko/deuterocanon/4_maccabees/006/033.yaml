lexical_decisions:
- source_word: νυνὶ δέ
  english_pob_choice: But now
  chosen_korean: 하지만 이제
  alternatives_korean:
  - 이제
  - 그리고 이제
  lexicon: LSJ
  rationale: 전환과 약한 대조를 함께 드러내므로, 단순한 ‘이제’보다 ‘하지만 이제’가 논증의 흐름을 더 잘 살립니다.
- source_word: λογισμοῦ
  english_pob_choice: reason
  chosen_korean: 이성
  alternatives_korean:
  - 이성적 판단
  - 이성적 사고
  - 이성
  lexicon: LSJ
  rationale: 4마카베오기에서 λογισμός는 감정과 대비되는 윤리적·철학적 이성의 기능을 가리키므로, 한국어로는 간결한 ‘이성’이 가장 자연스럽습니다.
- source_word: τὰ πάθη
  english_pob_choice: the passions
  chosen_korean: 정념
  alternatives_korean:
  - 욕정
  - 감정
  - 정욕
  lexicon: LSJ
  rationale: πάθη는 여기서 ‘고난들’이 아니라 이성에 대립하는 정념/욕구를 뜻하므로, 철학적 대비를 살리는 ‘정념’을 선택했습니다.
- source_word: τὴν τῆς ἡγεμονίας προσνέμομεν ἐξουσίαν
  english_pob_choice: the authority of leadership
  chosen_korean: 통치의 권위
  alternatives_korean:
  - 다스림의 권위
  - 지배의 권위
  - 통치권
  lexicon: LSJ
  rationale: ἡγεμονία와 ἐξουσία의 이중 구조를 한국어에서 간결하게 살리기 위해, ‘통치’와 ‘권위’의 결합으로 옮겼습니다.
theological_decisions:
- issue: 이성(λογισμός)과 정념(πάθη)의 철학적 인간 이해
  chosen_reading: 이성/정념의 대비를 유지하고, 이를 죄-은혜의 신학 용어로 바꾸지 않았습니다.
  alternative_readings:
  - 이성적 판단/감정
  - 이성/감정
  rationale: 본문은 4마카베오기 특유의 윤리철학적 논증을 전개하므로, 후대 신학 범주로 평준화하지 않고 원문의 긴장을 보존하는 것이 적절합니다.
