  rationale: 부사의 ‘공적으로 인정됨/동의됨’이라는 의미를 자연스러운 현대 한국어로 옮기되, 단정적 서술보다 합의된 판단이라는 뉘앙스를 살렸습니다.
- source_word: δεσπότης
