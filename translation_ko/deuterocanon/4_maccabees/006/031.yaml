  rationale: 4 마카베오서는 πάθη를 이성의 통제를 받는 내적 충동으로 쓰므로, 한국어 철학·윤리어휘인 ‘정념’이 가장 가깝습니다.
- source_word: ὁ εὐσεβὴς λογισμός
  english_pob_choice: godly reason
  chosen_korean: 경건한 이성
  alternatives_korean:
  - 경건한 생각
  - 신실한 이성
  - 경건한 판단
  lexicon: LSJ
  rationale: λογισμός는 단순한 ‘생각’보다 이성적 판단·사유를 가리키므로 ‘이성’으로 옮기고, εὐσεβής는 신앙적 경외를 드러내는 ‘경건한’으로 옮겼습니다.
theological_decisions:
- issue: εὐσεβής의 신앙적 뉘앙스
  chosen_reading: 경건한
  alternative_readings:
  - 경외하는
  - 신앙적인
  - 경건한 마음의
  rationale: 본문은 자율적 이성이 아니라 하나님을 향한 경외 안에서 형성된 이성을 말하므로, ‘경건한’이 그 종교적·윤리적 긴장을 가장 잘 보존합니다.
