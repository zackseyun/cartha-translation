base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/006/034.yaml
  text: And it is right for us to acknowledge that reason is sovereign[b][a], since it even prevails over outward pains.
  footnotes:
  - marker: a
    text: Or 'reason has mastery' or 'the power belongs to reason.' The Greek phrase emphasizes the ruling strength of reason.
    reason: lexical_alternative
  - marker: b
    text: Or 'external pains.' The expression refers to pains coming from outside the self, likely including bodily suffering.
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 이성이 지배력을[a] 지니고 있음을 우리가 인정하는 것은 옳습니다. 이성이 외부의 고통들[b]마저 이기기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이성이 주도권을 가진다’, ‘지배력은 이성에게 있다’. 그리스어 표현은 이성이 지닌 지배하는 힘을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘외적인 고통들’, ‘밖에서 오는 고통들’. 이 표현은 자신 외부에서 오는 고통을 가리키며, 육체적 고통을 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιόν ἐστιν
  english_pob_choice: it is right
  chosen_korean: 옳습니다
  alternatives_korean:
  - 마땅합니다
  - 옳은 일입니다
  - 정당합니다
  lexicon: LSJ
  rationale: 무인칭 판단 표현을 현대 한국어에서 가장 자연스럽고 분명한 합쇼체로 옮겼습니다. '정당합니다'보다 도덕적 판단의 직접성이 덜하고, '마땅합니다'보다 문맥상 논증적 결론에 더 잘 맞습니다.
- source_word: ὁμολογεῖν
  english_pob_choice: to acknowledge
  chosen_korean: 인정하는 것
  alternatives_korean:
  - 고백하는 것
  - 시인하는 것
  - 받아들이는 것
  lexicon: LSJ
  rationale: 여기서는 죄의 고백이 아니라 논증의 결론을 공개적으로 받아들이는 뜻이므로 '인정하는 것'이 가장 적절합니다.
- source_word: τὸ κράτος εἶναι τοῦ λογισμοῦ
  english_pob_choice: reason is sovereign
  chosen_korean: 이성의 힘이 지배적이라고
  alternatives_korean:
  - 이성의 권세가 있다고
  - 이성이 주권을 가진다고
  - 이성의 힘이 주도한다고
  lexicon: LSJ
  rationale: κράτος의 핵심은 단순한 능력이 아니라 지배·우세의 힘이므로, '지배적'으로 옮겨 이성이 고통 위에 군림하는 논지를 살렸습니다. '이성'은 λογισμός의 철학적 의미를 현대 독자가 이해하기 쉽게 전달합니다.
- source_word: τῶν ἔξωθεν ἀλγηδόνων
  english_pob_choice: outward pains
  chosen_korean: 바깥의 고통들
  alternatives_korean:
  - 외적인 고통들
  - 밖에서 오는 고통들
  - 육체의 고통들
  lexicon: LSJ
  rationale: ἔξωθεν의 '바깥에서/외부로부터'와 ἀλγηδόνες의 '고통들'을 그대로 드러냈습니다. '육체의 고통들'은 해석을 더한 표현이어서 본문 수준에서는 피했습니다.
- source_word: ἐπικρατεῖ
  english_pob_choice: prevails over
  chosen_korean: 제압하기 때문입니다
  alternatives_korean:
  - 압도하기 때문입니다
  - 이기기 때문입니다
  - 능가하기 때문입니다
  lexicon: LSJ
  rationale: ἐπικρατέω는 '우세를 점하다, 제압하다'의 뜻이 있으므로, 고통 위에서 이성이 실제로 우세를 행사한다는 점을 살려 '제압하기 때문입니다'로 옮겼습니다.
theological_decisions:
- issue: 4 마카베오스에서 λογισμός의 철학적 의미
  chosen_reading: λογισμός를 인간의 이성/이성적 판단으로 이해하여 '이성'으로 번역했습니다.
  alternative_readings:
  - '''이성적 판단'''
  - '''사유'''
  - '''이성의 판단력'''
  rationale: 이 구절은 순교 서사의 논증 속에서 이성이 고통을 지배할 수 있다는 철학적 주장입니다. 따라서 후대 신학 용어를 덧씌우기보다, 본문의 사상적 무게를 살리는 '이성'이 가장 정확합니다.
  doctrine_reference: 'translation philosophy: preserve source meaning and argumentative force'
