  source_fidelity: 초안의 핵심 의미는 대체로 원문을 따르지만, ἐναντεθάνει를 ‘고문들 속으로 들어갔다’로 옮긴 것은 한국어에서 원문의 대결·대면의 뉘앙스를 충분히 드러내지 못합니다. 또한 ‘그러했습니다’는 원문에 없는 지시적 반복이며, 앞의 ‘맞섰고’의 대상도 불분명하게 만듭니다. 수정문은 희귀 동사의 불확실성을 각주로 보존하면서, 고문을 정면으로 맞이하고 죽음에 이르는 고문까지 저항했다는 문맥과 구문을 반영합니다.
  naturalness: ‘고문들 속으로 들어갔으며’와 문장 끝의 ‘그러했습니다’는 현대 표준 한국어 성경 문체로 부자연스럽습니다. ‘고문들을 정면으로 맞이했으며’ 및 ‘고문들에 이르기까지 맞섰습니다’는 합쇼체에서 자연스럽고, 반복되는 βάσανοι도 유지합니다.
  terminology: ἱερὸς ἀνήρ는 기존의 ‘그 거룩한 사람’을 유지할 수 있습니다. λογισμός는 이 책의 핵심 철학·윤리 용어이므로 ‘이성으로’를 유지합니다. διὰ τὸν νόμον은 목적·동기의 의미를 드러내도록 ‘율법을 위하여’로 옮겼습니다. θανάτου βασάνων은 ‘죽음에 이르는 고문들’로 번역하여 과도한 교리적 해석 없이 강도를 보존했습니다.
