  text: And after saying these things[a], the holy man nobly gave himself over to the tortures, and he stood firm by reason for the law, even to the tortures of death.
  footnotes:
  - marker: a
    text: The Greek verb rendered 'gave himself over to the tortures' is rare and difficult; it may also suggest that he met death or the ordeal in direct confrontation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이 말을 한 뒤, 그 거룩한 사람은 고귀하게 고문들을 정면으로 맞이했으며[a], 율법을 위하여 이성으로 죽음에 이르는 고문들에 이르기까지 맞섰습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 동사 ἐναντεθάνει는 드물고 해석이 어렵습니다. 여기서 ‘고문들을 정면으로 맞이했다’로 옮겼으나, ‘고문에 맞서 죽었다’ 또는 ‘죽음의 시련을 대면했다’는 뉘앙스를 나타낼 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἱερὸς ἀνὴρ
  english_pob_choice: the holy man
  chosen_korean: 그 거룩한 사람
  alternatives_korean:
  - 그 성스러운 사람
  - 그 거룩한 남자
  lexicon: LSJ
  rationale: ἱερός의 성결한 성격을 살리되, ἀνήρ의 남성 표지를 한국어에서 과도하게 강조하지 않고 자연스럽게 옮겼습니다.
- source_word: εὐγενῶς
