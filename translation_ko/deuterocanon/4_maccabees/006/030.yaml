  - 아름답게
  - 용맹하게
  lexicon: LSJ
  rationale: 행위의 도덕적·귀족적 품격을 드러내는 부사로서 ‘고귀하게’가 가장 직접적으로 대응합니다.
- source_word: ταῖς βασάνοις
  english_pob_choice: to the tortures
  chosen_korean: 고문들 속으로
  alternatives_korean:
  - 고문들에
  - 고통들에
  - 고문에
  lexicon: LSJ
  rationale: βάσανοι가 순교 맥락에서 고문/고통의 경험을 가리키므로, 단순 상태보다 그 안으로 들어가는 동적 이미지를 살렸습니다.
- source_word: τῷ λογισμῷ
  english_pob_choice: by reason
  chosen_korean: 이성으로
  alternatives_korean:
  - 이성 안에서
  - 합리적 판단으로
  - 생각으로
  lexicon: LSJ
  rationale: 4 마카베오스의 핵심 개념인 λογισμός를 ‘이성’으로 옮겨, 감정이 아니라 이성의 지배 아래 서는 의미를 보존했습니다.
theological_decisions:
- issue: λογισμός의 철학적·윤리적 뉘앙스
  chosen_reading: 이성
  alternative_readings:
  - 이유
  - 이성적 판단
  - 합리성
  rationale: 이 문맥은 단순한 ‘이유’보다 인간 내면을 다스리는 이성의 원리를 강조하므로, 4 마카베오스의 수사와 사상을 더 잘 드러내는 ‘이성’이 적절합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 5, 6
- issue: ταῖς βασάνοις / θανάτου βασάνων의 반복 효과
  chosen_reading: 고문들 / 죽음의 고문들
  alternative_readings:
  - 고통들 / 죽음의 고통들
  - 형벌들 / 죽음의 형벌들
  rationale: 반복되는 βάσανοι는 단순한 고통보다 ‘고문’의 물리적·순교적 강도를 드러내므로, 동일 어근의 반복을 한국어에서도 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
