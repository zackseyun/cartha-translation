base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/006/035.yaml
  text: Even if it is ridiculous, I demonstrate not only that reason has gained mastery over pains, but also that it rules over pleasures and does not yield to them.
translation:
  language: ko
  text: 설령 그것이 우스운 일이라 해도, 나는 이성[b]이 고통들[a]을 이겨 냈을 뿐만 아니라 쾌락도 다스리며 쾌락에 굴복하지 않는다는 것을 보여 줍니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 ἀλγηδόνων은 기본적으로 ‘고통들’이며, 문맥상 순교의 극심한 고난을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 원문 λογισμόν은 4 마카베오스에서 감정을 다스리는 ‘이성/이성적 판단’의 개념어입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ καὶ γελοῖον
  english_pob_choice: Even if it is ridiculous
  chosen_korean: 설령 그것이 우스운 일이라 해도
  alternatives_korean:
  - 비록 그것이 웃기는 일일지라도
  - 설령 그것이 터무니없다 해도
  lexicon: LSJ
  rationale: γελοῖον의 기본 의미는 ‘우스운, 우스꽝스러운’이므로, 과도하게 약화하거나 설명적으로 풀지 않고 양보절을 자연스럽게 살렸습니다.
- source_word: ἀλγηδόνων
  english_pob_choice: pains
  chosen_korean: 고통들
  alternatives_korean:
  - 통증들
  - 아픔들
  lexicon: LSJ
  rationale: 이 명사는 육체적·정신적 고통을 가리킬 수 있으므로, 순교 맥락을 반영하면서도 영어 POB의 ‘pains’처럼 원뜻을 넘지 않게 ‘고통들’로 옮겼습니다.
- source_word: λογισμόν
  english_pob_choice: reason
  chosen_korean: 이성
  alternatives_korean:
  - 이성적 판단
  - 사유
  lexicon: LSJ
  rationale: 4 마카베오서는 λογισμός를 감정에 대립하는 이성적 판단의 능력으로 쓰므로, 단순히 ‘생각’보다 개념적 무게를 살리는 ‘이성’이 적절합니다.
- source_word: κρατεῖν / κεκρατηκέναι
  english_pob_choice: has gained mastery / rules over
  chosen_korean: 이겨냈을 뿐 아니라, 쾌락도 다스리고
  alternatives_korean:
  - 주도권을 잡았을 뿐 아니라, 쾌락도 지배하고
  - 장악했을 뿐 아니라, 쾌락도 통제하고
  lexicon: LSJ
  rationale: κρατέω 계열의 반복은 ‘지배/우세/주권’의 의미를 가지므로, 첫 절은 완료된 승리를, 둘째 절은 지속적 지배를 드러내는 ‘이겨내다/다스리다’로 구분했습니다.
- source_word: ὑπείκειν
  english_pob_choice: does not yield to them
  chosen_korean: 굴복하지 않음
  alternatives_korean:
  - 양보하지 않음
  - 물러서지 않음
  lexicon: LSJ
  rationale: ὑπείκω는 ‘양보하다, 굴복하다, 물러서다’의 의미가 있어, 쾌락 앞에서의 내적 항복을 분명히 드러내는 ‘굴복하지 않음’이 가장 직접적입니다.
theological_decisions:
- issue: 4 마카베오스의 λογισμός를 철학적 용어로 어떻게 처리할지
  chosen_reading: 이성
  alternative_readings:
  - 이성적 판단
  - 사유
  rationale: 본문은 순교자의 금욕을 철학적으로 해설하므로, ‘이성’은 독자가 본문의 논지를 즉시 파악하게 하면서도 과도한 철학적 전문용어를 덧씌우지 않습니다.
  doctrine_reference: Translation philosophy 5
- issue: 고통과 쾌락을 대조하는 수사에서 의미를 약화하지 않을지
  chosen_reading: 고통들 / 쾌락
  alternative_readings:
  - 아픔들 / 즐거움
  - 고난 / 쾌락
  rationale: 본문은 이성이 고통과 쾌락 양쪽을 모두 제어한다는 점을 강조하므로, 두 항을 모두 보존해 금욕적·윤리적 긴장을 유지했습니다.
  doctrine_reference: Translation philosophy 1
