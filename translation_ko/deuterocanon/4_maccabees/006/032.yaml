lexical_decisions:
- source_word: πάθη
  english_pob_choice: the passions
  chosen_korean: 정념들
  alternatives_korean:
  - 열정들
  - 욕망들
  - 정욕들
  lexicon: LSJ
  rationale: 철학적·윤리적 문맥에서 πάθη는 외적 고난이 아니라 이성에 대립하는 정서적 충동을 가리키므로, 비교적 중립적이고 전문적인 ‘정념들’이 적절합니다.
- source_word: λογισμοῦ
  english_pob_choice: reason
  chosen_korean: 이성
  alternatives_korean:
  - 판단
  - 사고
  - 이성적 판단
  lexicon: LSJ
  rationale: 여기서 λογισμός는 정념과 대비되는 합리적 판단 능력을 뜻하므로, 간결하게 ‘이성’으로 옮겨 대조를 분명히 했습니다.
- source_word: κεκράτηκει
  english_pob_choice: had gained mastery over
  chosen_korean: 우세했더라면
  alternatives_korean:
  - 지배했더라면
  - 승리했더라면
  - 이겨버렸더라면
  lexicon: LSJ
  rationale: κρατέω의 지배·우세 의미와 완료된 가정을 살리기 위해, 한국어에서는 결과 상태를 드러내는 ‘우세했더라면’을 택했습니다.
- source_word: ἐπικρατίας
  english_pob_choice: my self-control
  chosen_korean: 내 절제
  alternatives_korean:
  - 내 자제
  - 내 자기통제
  - 내 자제력
  lexicon: LSJ
  rationale: ἐπικράτεια는 도덕적 문맥에서 자기 절제·자기 통치를 뜻하므로, 고전적이면서도 자연스러운 ‘절제’로 옮겼습니다.
theological_decisions:
- issue: 정념과 이성의 대비를 어떻게 한국어로 유지할지
  chosen_reading: 도덕철학적 대조를 그대로 살려, 정념과 이성의 긴장을 해소하지 않고 유지했습니다.
  alternative_readings:
  - ‘내 욕망이 더 나은 판단을 이겼다면’처럼 의역하기
  rationale: 4 마카베오서는 신학적 용어로 환원하기보다 인물의 윤리적 자기통제 논리를 드러내므로, 본문의 철학적 범주를 보존하는 번역이 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: 해소되지 않은 긴장을 보존하고, 원문 범주의 대조를 유지할 것.'
