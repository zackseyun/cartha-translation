  yaml_path: translation/deuterocanon/4_maccabees/006/006.yaml
  text: But no—no—no! Lifting his eyes high toward heaven[a], the old man was exposing his flesh to the whips, and was streaming with blood[c][b], and his sides were being pierced.
  footnotes:
  - marker: a
    text: Or 'the old man was displaying his flesh under the whips.' The Greek verb can be understood as making his flesh visible or manifest through the scourging.
    reason: lexical_alternative
  - marker: b
    text: Or 'was streaming with blood.' The Greek expression emphasizes the ongoing outflow or covering of blood.
    reason: lexical_alternative
  - marker: c
    text: Or 'his ribs were being wounded.' The Greek term for 'sides' can also refer more specifically to the rib area.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나, 아니, 아니, 아니! 하늘을 향해 높이 눈을 들어 올린 그 늙은이는 채찍 아래에서 자기의 살을 드러내고 있었고, 피를 흘리고 있었으며, 그의 옆구리는 찔리고 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 늙은이가 채찍 아래에서 자기의 살을 드러내고 있었다’로도 옮길 수 있습니다. 그리스어 동사는 채찍질로 살이 노출되는 상태를 보이게 하는 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘피가 흘러내리고 있었다’로도 옮길 수 있습니다. 그리스어 표현은 피가 계속해서 흘러나오는 모습을 강조합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그의 옆구리가 상처를 입고 있었다’로도 옮길 수 있습니다. πλευρά는 ‘옆구리’보다 더 좁게 ‘갈비뼈 부위’를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ ἀλλὰ ἀλλὰ
  english_pob_choice: But no—no—no!
  chosen_korean: 그러나, 아니, 아니, 아니!
  alternatives_korean:
  - 하지만, 아니, 아니, 아니!
  - 아니, 아니, 아니!
  - 그러나, 그러나, 그러나!
  lexicon: LSJ
  rationale: 삼중 ἀλλὰ의 급박하고 강한 반전을 살리되, 한국어에서는 ‘그러나’로 첫 전환을 보이고 뒤의 반복을 ‘아니, 아니, 아니!’로 옮겨 거친 저항감을 자연스럽게 드러냈습니다.
- source_word: ὑψηλοὺς ἀντείνας εἰς τὸν οὐρανὸν τοὺς ὀφθαλμούς
  english_pob_choice: Lifting his eyes high toward heaven
  chosen_korean: 하늘을 향해 높이 눈을 들어 올린
  alternatives_korean:
  - 눈을 높이 들어 하늘을 바라본
  - 눈을 들어 높이 하늘을 향한
  - 눈을 높이 치켜든
  lexicon: LSJ
  rationale: ‘눈을 들어 올리다’는 상향 시선을 자연스럽게 옮기며, ‘높이’와 ‘하늘을 향해’로 원문의 상방 제스처와 종교적 방향성을 함께 보존했습니다.
- source_word: ἀπέφαινετο ταῖς μάστιξιν τὰς σάρκας
  english_pob_choice: was exposing his flesh to the whips
  chosen_korean: 채찍 아래에서 자기의 살을 드러내고 있었고
  alternatives_korean:
  - 채찍에 자기의 살을 드러내고 있었고
  - 채찍 아래 자신의 살을 드러내고 있었고
  - 채찍에 살이 드러나고 있었고
  lexicon: LSJ
  rationale: ἀπέφαινετο의 ‘드러나게 되다/드러내다’는 의미를 따라, 단순히 맞는 장면이 아니라 채찍질로 살이 노출되는 모습을 살렸습니다. ‘살’은 σάρκας의 문자적 육체성을 유지합니다.
- source_word: κατερρεῖτο τῷ αἵματι
  english_pob_choice: was streaming with blood
  chosen_korean: 피를 흘리고 있었으며
  alternatives_korean:
  - 피로 흘러내리고 있었으며
  - 피에 젖어 있었으며
  - 피가 흐르고 있었으며
  lexicon: LSJ
  rationale: 원문의 진행형적 표현을 한국어의 ‘피를 흘리고 있었다’로 옮겨 지속적으로 흐르는 모습을 살렸습니다. 과장된 관용어보다 직접적이고 서술적인 표현을 택했습니다.
- source_word: τὰ πλευρὰ κατετιτρώσκετο
  english_pob_choice: and his sides were being pierced
  chosen_korean: 그의 옆구리는 찔리고 있었습니다
  alternatives_korean:
  - 그의 옆구리는 뚫리고 있었습니다
  - 그의 옆구리는 상처를 입고 있었습니다
  - 그의 옆구리는 찔려 들어가고 있었습니다
  lexicon: LSJ
  rationale: πλευρά를 문맥상 ‘옆구리’로 옮기면 신체 부위가 더 분명해지고, κατετιτρώσκετο의 지속적 수난을 ‘찔리고 있었습니다’로 자연스럽게 전달할 수 있습니다.
theological_decisions:
- issue: ‘하늘을 향해’의 방향성과 순교 장면의 의미
  chosen_reading: 하늘을 향해 높이 눈을 든 자세를, 고통 속에서도 하나님께 향하는 정서적·종교적 제스처로 읽어 본문에 반영했습니다.
  alternative_readings:
  - 단순한 위쪽 시선의 묘사
  - 하늘(천정) 방향의 물리적 동작만 강조
  rationale: 이 장면은 육체적 고통의 묘사이면서도 순교 문맥에서 상향 시선이 신앙적 긴장을 드러냅니다. 그래서 ‘하늘을 향해’를 유지하되 과도한 해석은 덧붙이지 않았습니다.
  doctrine_reference: 4 Maccabees의 순교 신학과 경건한 인내의 묘사
