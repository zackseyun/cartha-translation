  yaml_path: translation/deuterocanon/4_maccabees/006/028.yaml
  text: Be merciful to your nation[b][a], being satisfied with our punishment on their behalf.
  footnotes:
  - marker: a
    text: Or 'being content with our penalty for them.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'on their behalf' preserves the representative sense of the Greek without specifying a later doctrinal model of atonement.
    reason: cultural_note
translation:
  language: ko
  text: 주의 백성에게 자비를 베푸시고, 그들을 위하여 우리가 받는 형벌로 충분히 여기소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들을 위하여’로 옮긴 헬라어 표현은 ‘그들에 관하여’로도 이해될 수 있으나, 이 문맥에서는 우리의 형벌이 백성을 위한 것으로 받아들여지기를 구하는 뜻으로 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵλεως γενοῦ
  english_pob_choice: Be merciful
  chosen_korean: 자비를 베푸시고
  alternatives_korean:
  - 긍휼히 여기소서
  - 호의를 베푸소서
  - 유화롭게 여기소서
  lexicon: BDAG
  rationale: ἵλεως γενοῦ는 관용적 간구로서 하나님의 호의와 자비를 구하는 표현이므로, 현대 한국어에서는 ‘자비를 베푸시고’가 자연스럽고 간구의 뉘앙스를 살립니다.
- source_word: τῷ ἔθνει σου
  english_pob_choice: to your nation
  chosen_korean: 당신의 백성에게
  alternatives_korean:
  - 당신의 민족에게
  - 당신의 나라에게
  lexicon: BDAG
  rationale: ἔθνος는 여기서 언약 공동체 전체를 가리키는 집합적 표현이므로, 한국어에서는 종교적·민족적 의미를 함께 담을 수 있는 ‘백성’이 가장 적절합니다.
- source_word: ἀρκεσθεὶς τῇ ἡμετέρᾳ περὶ αὐτῶν δίκῃ
  english_pob_choice: being satisfied with our punishment on their behalf
  chosen_korean: 그들을 대신한 우리의 형벌에 만족하소서
  alternatives_korean:
  - 그들을 위한 우리의 형벌로 충분하다고 여기소서
  - 그들에 대한 우리의 벌에 만족하소서
  lexicon: BDAG
  rationale: ἀρκεσθεὶς는 ‘충분하다/족하다’의 뉘앙스지만, 간구문에서는 하나님께서 이미 충분한 것으로 받아들이시기를 비는 뜻이므로 ‘만족하소서’로 옮겼습니다. δίκη는 이 순교 문맥에서 ‘의’가 아니라 징벌적 의미의 ‘형벌’이 적절합니다.
- source_word: περὶ αὐτῶν
  english_pob_choice: on their behalf
  chosen_korean: 그들을 대신한
  alternatives_korean:
  - 그들에 대한
  - 그들을 위하여
  lexicon: BDAG
  rationale: περί + 속격은 단순한 ‘관련하여’보다 대표적·대리적 의미를 띨 수 있으므로, 영문 POB의 의도를 따라 ‘그들을 대신한’으로 표현해 대표성은 살리되 과도한 속죄 교리는 덧붙이지 않았습니다.
theological_decisions:
- issue: 대표적 고난의 의미를 어디까지 드러낼 것인가
  chosen_reading: 이 절은 순교자들의 형벌이 백성을 대신하는 성격을 지니지만, 후대의 완전한 속죄론으로 확장하지 않고 대표적·중보적 의미만 드러냅니다.
  alternative_readings:
  - 단순히 ‘그들을 위하여’라는 비특정적 의미
  - 속죄 교리를 전제한 대속 표현
  rationale: 원문과 영문 POB 모두 대리성을 보이지만, 그 범위를 신학적으로 과잉 규정하지 않도록 조심해야 합니다.
  doctrine_reference: 대표성은 보존하되 속죄 교리는 확정하지 않음
