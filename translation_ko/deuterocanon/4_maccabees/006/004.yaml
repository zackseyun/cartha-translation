translation:
  language: ko
  text: “왕의 명령들에 순종하십시오.” 그러자 다른 곳에서 한 전령이 외쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘다른 쪽에서 외치고 있는 전령’입니다. 그리스어는 외침이 다른 편에서, 곧 다른 전령을 통해 들려왔음을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πείσθητι
  english_pob_choice: Obey
  chosen_korean: 순종하십시오
  alternatives_korean:
  - 복종하십시오
  - 들으십시오
  lexicon: LSJ
  rationale: aorist passive imperative of πείθω는 문자적으로는 ‘설득되다’이지만, 왕의 명령에 대한 문맥에서는 권위에 응하여 따르는 뜻이므로 ‘순종하십시오’가 가장 자연스럽고 정확합니다.
- source_word: ταῖς τοῦ βασιλέως ἐντολαῖς
  english_pob_choice: the king’s commands
  chosen_korean: 왕의 명령들
  alternatives_korean:
  - 왕의 지시들
  - 왕의 칙령들
  lexicon: LSJ
  rationale: ἐντολαί는 단순한 조언이 아니라 권위를 지닌 명령이므로, 한국어에서도 ‘명령들’이 힘을 가장 잘 보존합니다.
- source_word: ἑτέρωθεν
  english_pob_choice: another herald
  chosen_korean: 다른 곳에서
  alternatives_korean:
  - 다른 쪽에서
  - 다른 방향에서
  lexicon: LSJ
  rationale: 부사는 본래 ‘다른 편/반대편에서’라는 공간적 뉘앙스를 가지므로, 영어 POB의 해석을 따라 한국어 본문에는 공간적 어감을 살리되 의미는 다음 어구로 연결되게 했습니다.
- source_word: κῆρυκος ἐπιβοῶντος
  english_pob_choice: another herald cried out
  chosen_korean: 한 전령이 외쳤습니다
  alternatives_korean:
  - 한 선포자가 외쳤습니다
  - 한 사자가 외쳤습니다
  lexicon: LSJ
  rationale: κῆρυξ는 공식 발표를 전하는 전령/공고자로서, 현대 한국어에서는 ‘전령’이 가장 정확합니다. ἐπιβοῶντος는 큰 소리로 외치는 공적 선포를 가리키므로 ‘외쳤습니다’가 적절합니다.
theological_decisions:
- issue: 명령문 직역과 문맥적 자연스러움의 균형
  chosen_reading: 직설적인 왕의 명령에 대한 즉각적 복종 요청으로 읽었습니다.
  alternative_readings:
  - ‘설득되십시오’로 더 문자적으로 옮김
  - ‘왕에게 굴복하십시오’로 더 강하게 옮김
  rationale: 본문은 왕명에 대한 공적 호응을 요구하는 장면이므로, 문자적 어형보다 문맥상 기능을 드러내는 ‘순종하십시오’가 가장 적절합니다.
  doctrine_reference: 문맥중심 번역 원리
- issue: ἑτέρωθεν의 처리
  chosen_reading: ‘다른 곳에서’로 옮겨, 소리가 다른 방향에서 이어졌다는 공간적 긴장을 보존했습니다.
  alternative_readings:
  - ‘또 다른 전령이’로 의미를 해석해 본문에 반영
  - ‘다른 쪽에서’로 더 직역
  rationale: 영어 POB도 다른 전령의 외침으로 해석하지만, 그 해석의 바탕이 되는 본문의 공간 표현을 한국어에서도 감출 필요가 없습니다.
  doctrine_reference: 본문 비평/어휘 해석
