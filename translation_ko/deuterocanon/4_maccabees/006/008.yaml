  text: Then indeed one of the cruel guards[a], leaping at his sides, kept striking him so that, when he fell[b], he might rise again.
  footnotes:
  - marker: a
    text: Or 'one of the harsh bodyguards.' The Greek literally refers to one of the ruler's spear-bearing guards.
    reason: lexical_alternative
  - marker: b
    text: '''Rise again'' here means ''get back up'' physically after falling, not resurrection.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 정말로 잔인한 경호원들 가운데 한 사람이 그의 옆구리들을 향해 뛰어들어, 그가 넘어질 때 다시 일어나게 하려고 계속 그를 때렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘창을 든 자들’이며, 여기서는 통치자의 무장 경호원을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 여기의 ‘다시 일어나다’는 부활이 아니라, 쓰러진 뒤 몸을 다시 세우는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λάξ γέ τοι
  english_pob_choice: Then indeed
  chosen_korean: 그러자 정말로
  alternatives_korean:
  - 그때 정말
  - 그런즉 과연
  - 그러고는 참으로
  lexicon: LSJ
  rationale: 문장 전환을 강하게 밀어 주는 감탄적·강조적 입자로 보고, 한국어에서는 서술 흐름을 자연스럽게 여는 ‘그러자’와 강조 부사 ‘정말로’로 옮겼습니다.
- source_word: τῶν πικρῶν δορυφόρων
  english_pob_choice: one of the cruel guards
  chosen_korean: 잔인한 경호원들 가운데 한 사람
  alternatives_korean:
  - 가혹한 경호원들 가운데 한 사람
  - 사나운 호위병들 가운데 한 사람
  - 잔혹한 시종들 가운데 한 사람
  lexicon: LSJ
  rationale: πικρός의 인체·인물 수식에서의 ‘가혹함/잔인함’을 살리고, δορυφόρος는 문자적으로는 ‘창을 드는 자’이지만 이 장면에서 역할을 분명히 드러내는 ‘경호원’으로 옮겼습니다.
- source_word: εἰς τοὺς κενεῶνας
  english_pob_choice: leaping at his sides
  chosen_korean: 그의 옆구리들을 향해 뛰어들어
  alternatives_korean:
  - 그의 옆구리로 뛰어들어
  - 그의 옆구리 쪽으로 달려들어
  - 그의 옆구리를 향해 덮쳐
  lexicon: LSJ
  rationale: κενεῶνας는 몸의 빈 부분, 특히 옆구리/갈빗대 아래를 가리키므로, 복수형의 감각을 살려 ‘옆구리들’로 옮기되 한국어에서는 자연스럽게 ‘옆구리들을 향해’로 처리했습니다.
- source_word: ὅπως ἐξανίσταιτο πίπτων
  english_pob_choice: so that, when he fell, he might rise again
  chosen_korean: 그가 넘어질 때 다시 일어나게 하려고
  alternatives_korean:
  - 그가 넘어졌을 때 다시 일어나게 하려고
  - 그가 쓰러질 때 다시 일어서게 하려고
  - 그가 넘어질 때 다시 일어서게 하려고
  lexicon: LSJ
  rationale: ἐξανίσταιτο는 여기서 부활이 아니라 넘어져 쓰러진 뒤 몸을 다시 일으키는 뜻이므로, 오해를 피하도록 ‘다시 일어나게 하려고’로 풀었습니다.
theological_decisions:
- issue: ‘다시 일어나다’의 의미가 부활 언어로 오해될 가능성
  chosen_reading: 폭력 속에서 쓰러진 뒤 몸을 다시 세우게 하려는 물리적 기립
  alternative_readings:
  - 부활을 암시하는 종교적 ‘다시 일어남’
  - 단순한 반복 동작 표현
  rationale: 문맥은 고문 장면이므로, 본문의 목적절은 부활 신학이 아니라 물리적으로 다시 일어서게 하려는 의도를 가리킵니다. 한국어에서도 그 의미를 분명히 드러내야 합니다.
  doctrine_reference: 문맥 우선 해석; 본문에 없는 신학적 의미를 덧씌우지 않음
