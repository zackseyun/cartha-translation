  source_fidelity: 수정이 필요합니다. λάξ는 이 문맥에서 단순한 담화 강조사로 보기보다 ‘발로, 발차기로’라는 뜻의 부사로 이해하는 것이 자연스럽습니다. 따라서 초안의 ‘그러자 정말로’는 이 구체적 폭력 행위를 누락합니다. ἐναλλόμενος는 옆구리 쪽으로 몸을 던지거나 달려드는 동작을, ἔτυπτεν은 지속·반복적인 구타를 나타냅니다. πίπτων은 쓰러지는 중이라는 동시성을 지니므로 ‘쓰러지면서도’가 이를 잘 살립니다.
  naturalness: ‘옆구리들을’은 한국어에서 부자연스럽습니다. 신체 부위의 그리스어 복수는 한국어에서 통상 단수 ‘옆구리’로 처리하는 것이 자연스럽습니다. 또한 ‘발로 차며 옆구리 쪽으로 달려들어’는 폭력의 방식과 방향을 현대 표준어 합쇼체로 명료하게 전달합니다.
  terminology: δορυφόροι를 ‘경호원들’로 옮긴 것은 문맥상 적절하며, 각주에서 문자적 의미와 무장 호위대라는 함의를 보완할 수 있습니다. ἐξανίσταιτο는 부활이 아니라 신체적으로 다시 일어서는 뜻이므로 ‘다시 일어서게’와 해당 각주가 적절합니다.
