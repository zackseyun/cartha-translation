lexical_decisions:
- source_word: ὑπέμενεν τοὺς πόνους
  english_pob_choice: he endured the pains
  chosen_korean: 고통을 견디고
  alternatives_korean:
  - 고통을 참으며
  - 아픔을 견디고
  lexicon: ὑπομένω; πόνος
  rationale: ὑπέμενεν은 단순한 참고 넘김보다 지속적 인내를 가리키므로 ‘견디고’로 옮기고, πόνοι는 문맥상 육체적 고통을 포함한 일반적 ‘고통’으로 처리했습니다.
- source_word: περιεφρόνει τῆς ἀνάγκης
  english_pob_choice: he scorned the compulsion
  chosen_korean: 강요를 가벼이 여기며
  alternatives_korean:
  - 강요를 업신여기며
  - 강요를 멸시하며
  lexicon: περιφρονέω; ἀνάγκη
  rationale: POB의 ‘scorned’를 반영하되, ἀνάγκη의 핵심인 강제·압박을 한국어 ‘강요’로 풀어 문맥의 의미를 살렸습니다.
- source_word: διεκαρτέρει τοὺς αἰκισμούς
  english_pob_choice: he persevered through the tortures
  chosen_korean: 고문을 끝까지 참아 냈습니다
  alternatives_korean:
  - 고문을 견뎌 냈습니다
  - 고문 속에서도 인내했습니다
  lexicon: διακαρτερέω; αἰκισμός
  rationale: διακαρτερέω는 단순 지속이 아니라 끝까지 버팀을 뜻하므로 ‘끝까지 참아 냈습니다’로 옮기고, αἰκισμούς는 잔혹한 신체적 학대를 나타내는 ‘고문’으로 번역했습니다.
