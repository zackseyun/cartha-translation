  terminology: μεγαλοφρονοῦντα의 ‘고결한 마음을 지니고’는 유지할 수 있습니다. οἰκτιρμός는 여기서 용서나 긍휼의 교리적 개념으로 확대하지 않고 ‘연민’으로 옮겼습니다.
