  - 긍휼히 여기는 쪽으로
  - 동정하는 쪽으로
  lexicon: LSJ
  rationale: οἰκτιρμὸν은 감정적 불쌍함/연민을 뜻하므로, 대상인 ‘그들’을 향한 태도 변화로 자연스럽게 읽히도록 풀어 옮겼습니다.
- source_word: ἦγον
  english_pob_choice: they led him
  chosen_korean: 그를 ... 끌고 갔습니다
  alternatives_korean:
  - 그를 데리고 갔습니다
