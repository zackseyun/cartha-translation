  rationale: ἀνάγκας는 단순한 필요가 아니라 그에게 가해진 강제적 압박을 가리키므로, 한국어에서는 자연스럽고 문맥에 맞는 ‘압박들’로 옮겼습니다.
- source_word: μεγαλοφρονοῦντα
