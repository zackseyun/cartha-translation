translation:
  language: ko
  text: 그들이 그가 이러한 강압 앞에서도 그토록 고결한 마음을 지니고, 그들의 연민에도 전혀 마음을 바꾸지 않는 것을 보고는, 그를 불로 끌고 갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρὸς τὰς ἀνάγκας
  english_pob_choice: in the face of these compulsions
  chosen_korean: 이런 압박들 앞에서
  alternatives_korean:
  - 이런 강요들 앞에서
  - 이런 강제들 앞에서
  - 이런 제약들 앞에서
  lexicon: LSJ
  rationale: ἀνάγκας는 단순한 필요가 아니라 그에게 가해진 강제적 압박을 가리키므로, 한국어에서는 자연스럽고 문맥에 맞는 ‘압박들’로 옮겼습니다.
- source_word: μεγαλοφρονοῦντα
  english_pob_choice: noble-minded
  chosen_korean: 고결한 마음을 지니고
  alternatives_korean:
  - 고상한 마음을 지니고
  - 너그러운 마음을 지니고
  - 대담한 마음을 지니고
  lexicon: LSJ
  rationale: 이 분사형은 마음의 위대함, 고결함, 도덕적 기품을 나타내므로, 단순한 용기보다 내면의 품격을 드러내는 표현을 택했습니다.
- source_word: οἰκτιρμὸν
  english_pob_choice: pity
  chosen_korean: 불쌍히 여기는 쪽으로
  alternatives_korean:
  - 연민을 품는 쪽으로
  - 긍휼히 여기는 쪽으로
  - 동정하는 쪽으로
  lexicon: LSJ
  rationale: οἰκτιρμὸν은 감정적 불쌍함/연민을 뜻하므로, 대상인 ‘그들’을 향한 태도 변화로 자연스럽게 읽히도록 풀어 옮겼습니다.
- source_word: ἦγον
  english_pob_choice: they led him
  chosen_korean: 그를 ... 끌고 갔습니다
  alternatives_korean:
  - 그를 데리고 갔습니다
  - 그를 끌어갔습니다
  - 그를 인도했습니다
  lexicon: LSJ
  rationale: ἦγον은 단순 이동이 아니라 포박·처형 맥락의 강제적 인도를 포함하므로, 한국어에서는 강압성을 드러내는 ‘끌고 갔습니다’가 적절합니다.
theological_decisions:
- issue: 순교 서술에서의 정서 표현
  chosen_reading: ‘그들을 불쌍히 여기는 쪽으로도 전혀 바뀌지’라고 옮겨, 순교자가 가해자에 대한 연민으로 기울지 않는 점을 유지했습니다.
  alternative_readings:
  - ‘그들에게 긍휼을 베푸는 쪽으로도’
  - ‘그들을 용서하는 쪽으로도’
  rationale: 본문은 용서나 긍휼의 실행이 아니라 감정/태도의 변화 부재를 말하므로, 그 미묘한 긴장을 보존했습니다.
  doctrine_reference: martyrdom ethics / narrative psychology
