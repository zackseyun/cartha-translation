  text: When they saw that he was so noble-minded in the face of these compulsions, and that he was not even changing toward pity for them, they led him to the fire.
  footnotes:
  - marker: a
    text: Or 'constraints' or 'pressures' for 'compulsions' (ἀνάγκας). The Greek refers to coercive pressures brought to bear on him, not ordinary necessities.
    reason: lexical_alternative
  - marker: b
    text: '''Noble-minded'' renders μεγαλoφρονοῦντα, a term for greatness of spirit or magnanimity.'
