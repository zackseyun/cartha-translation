  yaml_path: translation/deuterocanon/4_maccabees/006/001.yaml
  text: After he had spoken against the tyrant’s persuasions in this way[c][b][a], the bodyguards came forward and harshly dragged Eleazar to the tortures.
  footnotes:
  - marker: a
    text: Or 'appeals' for 'persuasions'; the Greek term can denote exhortation or encouragement, but here it refers to the tyrant's attempts to induce compliance.
    reason: lexical_alternative
  - marker: b
    text: Literally 'spear-bearers,' a term used for armed royal attendants; 'bodyguards' gives the sense in context.
    reason: lexical_alternative
  - marker: c
    text: Or 'harshly'/'cruelly' for 'bitterly'; the adverb emphasizes the severity of their treatment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 이렇게 폭군의 권유에 맞서 말하자, 호위병들은 앞으로 나와 엘레아자르를 가혹하게 고문이 행해지는 곳으로 끌고 갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τοῦτον τὸν τρόπον
  english_pob_choice: in this way
  chosen_korean: 이렇게
  alternatives_korean:
  - 이런 방식으로
  - 그와 같이
  lexicon: LSJ
  rationale: 지시적 부사구의 방식성을 간결한 현대 한국어로 살리기 위해 ‘이렇게’로 옮겼습니다.
- source_word: ἀντιρρητορεύσαντα
  english_pob_choice: had spoken against
  chosen_korean: 맞서 말하자
  alternatives_korean:
  - 반박하자
  - 대항하여 말하자
  - 반대하여 말하자
  lexicon: LSJ
  rationale: 엘레아자르의 항변적 발화를 자연스럽게 드러내면서도, 단순한 논쟁이 아니라 대항하는 말이라는 점을 살렸습니다.
- source_word: παρηγορίαις
  english_pob_choice: persuasions
  chosen_korean: 권유들
  alternatives_korean:
  - 설득들
  - 회유들
  - 권고들
  lexicon: LSJ
  rationale: 여기서는 위로가 아니라 폭군이 복종을 유도하는 시도이므로, 긍정적 뉘앙스의 ‘격려’보다 설득·회유의 성격을 가진 ‘권유들’이 더 적합합니다.
- source_word: δορυφόροι
  english_pob_choice: bodyguards
  chosen_korean: 호위병들
  alternatives_korean:
  - 경호병들
  - 근위병들
  - 창병들
  lexicon: LSJ
  rationale: 문맥상 왕권을 수행하는 무장 수행원들을 가리키므로, 기능을 드러내는 ‘호위병들’이 가장 자연스럽습니다.
- source_word: πικρῶς
  english_pob_choice: harshly
  chosen_korean: 심한
  alternatives_korean:
  - 가혹한
  - 잔혹한
  - 매서운
  lexicon: LSJ
  rationale: 부사의 강한 정도와 폭력적 처우를 한국어 관용에 맞게 ‘심한’으로 풀어 ‘고문’과 결합시켰습니다.
