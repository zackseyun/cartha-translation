    rationale: 원문의 ἐπὶ τὰ βασανιστήρια는 엘레아자르를 고문 쪽으로/고문이 있는 곳으로 끌고 갔다는 뜻입니다. 현 번역의 ‘고문으로’는 수단·방법으로도 해석되어 방향 관계가 불분명합니다.
  - severity: low
    issue: ‘권유들’의 부자연스러운 복수
    rationale: παρηγορίαις의 복수는 한국어에서 반드시 복수 명사로 재현할 필요가 없습니다. ‘폭군의 권유’가 현대 표준어 문맥에서 더 자연스럽습니다.
  revised_text: 그가 이렇게 폭군의 권유에 맞서 말하자, 호위병들은 앞으로 나와 엘레아자르를 가혹하게 고문이 행해지는 곳으로 끌고 갔습니다.
