  yaml_path: translation/deuterocanon/4_maccabees/006/001.yaml
  text: After he had spoken against the tyrant’s persuasions in this way[c][b][a], the bodyguards came forward and harshly dragged Eleazar to the tortures.
  footnotes:
  - marker: a
    text: Or 'appeals' for 'persuasions'; the Greek term can denote exhortation or encouragement, but here it refers to the tyrant's attempts to induce compliance.
    reason: lexical_alternative
  - marker: b
    text: Literally 'spear-bearers,' a term used for armed royal attendants; 'bodyguards' gives the sense in context.
    reason: lexical_alternative
  - marker: c
    text: Or 'harshly'/'cruelly' for 'bitterly'; the adverb emphasizes the severity of their treatment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 이렇게 폭군의 권유들에 맞서 말하자, 호위병들은 앞으로 나와 엘레아자르를 심한 고문으로 끌고 갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τοῦτον τὸν τρόπον
  english_pob_choice: in this way
