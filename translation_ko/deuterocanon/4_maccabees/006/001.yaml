  source_fidelity: ‘심한 고문으로 끌고 갔습니다’는 조사 ‘으로’ 때문에 호위병들이 고문을 수단으로 사용해 끌고 간 듯 읽힐 수 있으며, ἐπὶ τὰ βασανιστήρια가 나타내는 목적지·대상 방향을 충분히 반영하지 못합니다. πικρῶς는 ‘가혹하게’로 자연스럽게 살릴 수 있습니다.
  naturalness: ‘권유들’은 한국어에서 다소 부자연스러운 복수 표현입니다. 문맥상 집합적 단수인 ‘권유’가 자연스럽습니다. 그 밖의 서술과 합쇼체는 자연스럽습니다.
