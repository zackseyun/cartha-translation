lexical_decisions:
- source_word: πρῶτον μὲν
  english_pob_choice: And first
  chosen_korean: 그리고 먼저
  alternatives_korean:
  - 먼저
  - 그리고 첫째로
  lexicon: LSJ
  rationale: 서술의 첫 단계라는 순차성을 살리면서, καὶ의 연결감도 자연스럽게 반영했습니다.
- source_word: περιέδυσαν
  english_pob_choice: they stripped
  chosen_korean: 벗겼습니다
  alternatives_korean:
  - 옷을 벗겼습니다
  - 벗겨 버렸습니다
  lexicon: LSJ
  rationale: 대상을 강제로 옷 벗기는 수치 행위로 보여 주는 동사를 택했습니다. 한국어에서는 ‘벗기다’가 가장 직접적입니다.
- source_word: τὸν γεραιὸν
  english_pob_choice: the old man
  chosen_korean: 노인을
  alternatives_korean:
  - 늙은이를
  - 연로한 사람을
  lexicon: LSJ
  rationale: γεραιός의 연령 의미를 자연스럽게 옮겼습니다. 문맥상 단순한 노인이 아니라 학대받는 인물을 가리킵니다.
- source_word: τὴν περὶ τὴν εὐσέβειαν εὐσχημοσύνην
  english_pob_choice: the dignity of godliness
  chosen_korean: 경건함에 관련된 그 품위
  alternatives_korean:
  - 경건의 품위
  - 경건과 관련된 단정한 품격
  - 경건함의 품위
  lexicon: LSJ
  rationale: εὐσχημοσύνη를 ‘품위’로, περὶ τὴν εὐσέβειαν을 ‘경건함에 관련된’으로 풀어 원문의 압축된 구조를 드러냈습니다. 영어 POB의 ‘dignity of godliness’보다 한국어에서는 관계를 명시하는 편이 더 분명합니다.
- source_word: εὐσέβειαν
  english_pob_choice: godliness
  chosen_korean: 경건함
  alternatives_korean:
  - 경건
  - 경외
  - 신앙의 절도
  lexicon: LSJ
  rationale: 4마카베오스에서 핵심 덕목인 εὐσέβεια를 한국어 독자가 바로 이해할 수 있는 ‘경건함’으로 옮겼습니다. ‘경건’보다 약간 풀어 쓰되, 신앙적 충성을 가리키는 무게를 유지했습니다.
theological_decisions:
- issue: εὐσέβεια의 신학적 뉘앙스
  chosen_reading: ‘경건함’은 단순한 내적 경건이 아니라 하나님께 대한 충실한 삶의 자세를 가리키는 것으로 읽었습니다.
  alternative_readings:
  - ‘경건’으로 더 압축해 옮기기
  - ‘신심’으로 옮기기
  rationale: 이 책에서 εὐσέβεια는 중심 덕목이므로, 한국어에서도 일상적 종교성보다 하나님께 대한 충성의 성격이 드러나야 합니다.
  doctrine_reference: 'DOCTRINE.md: 핵심 신학어는 현대적이되 의미의 무게를 보존할 것.'
