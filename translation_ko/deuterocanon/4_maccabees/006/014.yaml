  lexicon: LSJ
  rationale: 단순한 감정적 비난이 아니라 이성과 계산의 결여를 가리키므로, 4마카베오스의 ‘이성 대 열정’ 주제를 드러내는 표현으로 옮겼습니다.
- source_word: ἀπόλλυες
