  lexicon: LSJ
  rationale: 단순한 감정적 비난이 아니라 이성과 계산의 결여를 가리키므로, 4마카베오스의 ‘이성 대 열정’ 주제를 드러내는 표현으로 옮겼습니다.
- source_word: ἀπόλλυες
  english_pob_choice: are ... destroying
  chosen_korean: 멸하고 있습니까
  alternatives_korean:
  - 망하게 하고 있습니까
  - 파괴하고 있습니까
  - 잃고 있습니까
  lexicon: LSJ
  rationale: 현재형의 진행적 비난을 살리면서, 자기를 향한 파멸적 행위를 직접 드러내는 ‘멸하다’가 문맥상 가장 강하고도 자연스럽습니다.
