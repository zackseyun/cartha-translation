  rationale: 책망하는 수사의문문이므로 단순한 ‘무엇’보다 원인·동기를 묻는 ‘어찌하여’가 영어 POB의 Why를 가장 자연스럽게 살립니다.
- source_word: τοῖς κακοῖς τούτοις
  english_pob_choice: with these evils
  chosen_korean: 이 악들로 말미암아
  alternatives_korean:
