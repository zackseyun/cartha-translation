  - 형벌들
  rationale: 그리스어 κακοῖς는 이 장면의 고통스러운 가해를 가리키지만, 본문 자체는 기술 용어로 한정하지 않으므로 더 좁은 해석을 본문에 직접 넣지 않았습니다.
  doctrine_reference: 원문 우선 원칙; 번역은 해석을 과도하게 확대하지 않습니다.
