  chosen_korean: 멸하고 있습니까
  alternatives_korean:
  - 망하게 하고 있습니까
  - 파괴하고 있습니까
  - 잃고 있습니까
  lexicon: LSJ
  rationale: 현재형의 진행적 비난을 살리면서, 자기를 향한 파멸적 행위를 직접 드러내는 ‘멸하다’가 문맥상 가장 강하고도 자연스럽습니다.
