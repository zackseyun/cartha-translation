  rationale: 여기서는 고난의 수단/상황을 나타낼 수 있는 여격의 힘을 살려, 본문의 폭넓은 κακά를 좁히지 않으면서도 한국어로는 원인·상황을 드러내는 ‘말미암아’를 택했습니다.
- source_word: ἀλογίστως
