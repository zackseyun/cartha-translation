lexical_decisions:
- source_word: οἱ δὲ τοῦ τυράννου δορυφόροι
  english_pob_choice: But you, the tyrant’s bodyguards
  chosen_korean: 그렇지만 폭군의 창병들아
  alternatives_korean:
  - 그렇지만 폭군의 경호병들아
  - 그렇지만 폭군의 호위병들아
  - 그렇지만 폭군의 근위병들아
  lexicon: LSJ
  rationale: δρυφόροι는 문자적으로 ‘창을 든 자들’이지만, 이 장면에서는 폭군의 무장 수행원/호위대를 가리키므로 기능과 거친 분위기를 살려 ‘창병들’로 옮겼습니다.
- source_word: τοῦ τυράννου
  english_pob_choice: the tyrant’s
  chosen_korean: 폭군의
  alternatives_korean:
  - 독재자의
  - 참주의
  lexicon: LSJ
  rationale: τύραννος의 정치적·도덕적 강도를 살리기 위해 중립적인 ‘통치자’가 아니라 ‘폭군’을 선택했습니다.
- source_word: τί μέλλετε;
  english_pob_choice: why do you delay?
  chosen_korean: 왜 지체합니까?
  alternatives_korean:
  - 왜 머뭇거립니까?
  - 무엇을 망설입니까?
  - 왜 기다립니까?
  lexicon: BDAG/LSJ
  rationale: μέλλω가 여기서는 단순한 ‘곧 ~할 것이다’가 아니라 행동을 미루는 꾸짖음으로 쓰였으므로, 한국어에서는 ‘지체하다’가 가장 직접적으로 대응합니다.
theological_decisions:
- issue: 직접 호명과 수사적 질책의 어조
  chosen_reading: ‘그렇지만 … 아’로 시작해 대상자를 직접 부르며, 질문은 합쇼체의 질책형으로 유지했습니다.
  alternative_readings:
  - ‘하지만 … 왜 망설입니까?’
  - ‘그런데 … 왜 머뭇거리십니까?’
  rationale: 원문은 서술에서 곧바로 직접 대면으로 전환하는 강한 압박을 가지므로, 이를 완화하지 않고 한국어에서도 곧장 호명과 질책의 힘을 드러냈습니다.
  doctrine_reference: 담화·수사 장르 보존
