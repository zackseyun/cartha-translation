  yaml_path: translation/deuterocanon/4_maccabees/002/009.yaml
  text: 'And even if someone is stingy[a], he is restrained by the law through reason, neither gleaning the unharvested crops nor going over the vineyards again. And in other matters as well it is possible to recognize this: that reason is the master over the passions.'
  footnotes:
  - marker: a
    text: Or, more literally, 'picking over the vineyards'—that is, gathering what remains after the first harvest pass.
    reason: lexical_alternative
translation:
  language: ko
  text: 설령 어떤 사람이 인색하다 해도, 그는 이성으로 말미암아 율법 아래에서 제어됩니다. 그는 아직 수확하지 않은 곡식을 주워 모으지도 않고, 포도밭을 다시 훑어보지도 않습니다.[a] 또한 다른 경우들에서도 이 사실을 알아볼 수 있습니다. 곧 이성이 정념들을 지배한다는 사실입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘포도밭을 다시 훑어 모으는 것’에 가깝습니다. 첫 수확 뒤에 남은 것을 거두는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: φειδωλός
  english_pob_choice: stingy
  chosen_korean: 인색하다
  alternatives_korean:
  - 구두쇠스럽다
  - 짠돌이 같다
  - 탐욕스럽다
  lexicon: LSJ
  rationale: 여기서는 절약의 미덕이 아니라 움켜쥐고 내주지 않으려는 부정적 성향을 가리키므로, 중립적·긍정적으로 들릴 수 있는 절약 관련 표현보다 ‘인색하다’가 가장 잘 맞습니다.
- source_word: κρατεῖται
  english_pob_choice: is restrained
  chosen_korean: 제어됩니다
  alternatives_korean:
  - 억제됩니다
  - 붙들려 있습니다
  - 통제됩니다
  lexicon: LSJ
  rationale: 수동형으로서 율법이 그 사람을 붙들어 두는 뉘앙스를 살리되, 한국어에서 자연스러운 윤리·철학 문맥의 표현인 ‘제어됩니다’로 옮겼습니다.
- source_word: διὰ τὸν λογισμόν
  english_pob_choice: through reason
  chosen_korean: 이성 때문에
  alternatives_korean:
  - 이성으로
  - 이성에 의해
  - 합리적 판단을 통해
  lexicon: LSJ
  rationale: 4마카베오스에서 λογισμός는 단순한 계산이 아니라 정념을 다스리는 이성적 판단을 가리키므로, 핵심어를 ‘이성’으로 옮겨 책의 사유 구조를 살렸습니다.
- source_word: παθῶν
  english_pob_choice: the passions
  chosen_korean: 정념들
  alternatives_korean:
  - 욕정들
  - 감정들
  - 욕망들
  lexicon: LSJ
  rationale: πάθη는 이 책의 철학적·윤리적 문맥에서 단순 감정보다 이성이 다스려야 할 격정과 충동을 뜻하므로, ‘정념들’이 가장 정확합니다.
theological_decisions:
- issue: 율법과 이성의 관계
  chosen_reading: 율법 아래에서 이성이 사람을 제어한다는 진술로 이해했습니다.
  alternative_readings:
  - 율법이 인색함을 외적으로 억누른다
  - 이성이 율법을 통해 작동한다
  rationale: 본문은 율법의 외적 규제와 이성의 내적 지배를 함께 말하므로, 둘 중 하나로 환원하지 않고 ‘율법 아래에서’와 ‘이성 때문에’를 함께 살렸습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 5
- issue: παθῶν의 윤리적 무게
  chosen_reading: 정념들로 옮겨, 단순한 감정 일반이 아니라 다스려져야 할 충동을 가리키게 했습니다.
  alternative_readings:
  - 감정들
  - 욕망들
  rationale: 이 구절은 심리 묘사가 아니라 덕 윤리 논증이므로, 한국어에서도 철학적 긴장을 유지하는 표현이 필요합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 5
