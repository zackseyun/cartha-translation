  verdict: revise
  source_fidelity: 그리스어는 ‘아내에 대한 애정’을 이기거나 지배하고, 아내가 법을 어긴 일 때문에 그녀를 책망한다는 뜻입니다. 초안의 ‘이겨 내고’는 가능하나, ‘무법함’은 παρανομία의 ‘법을 어김/법에 어긋난 행위’라는 의미를 현대 한국어로 자연스럽게 전달하지 못합니다. 또한 ‘그 여자’는 γαμετήν(아내)을 불필요하게 낮추어 부르는 표현입니다.
  naturalness: ‘아내에 대한 애정도 제어하고’ 및 ‘아내가 법을 어겼기 때문에 아내를 책망합니다’가 현대 표준어 합쇼체로 자연스럽고, 원문의 논리 관계도 분명히 드러냅니다.
  terminology: γαμετή는 일관되게 ‘아내’로, φιλία는 ‘애정’으로 옮겼습니다. παρανομία는 문맥상 ‘법을 어김’으로 풀어, 단순한 무질서나 ‘무법함’보다 정확하게 표현했습니다. ἐπικρατεῖ의 강한 통제 의미는 ‘제어하다’로 유지했습니다.
  issues:
  - severity: medium
    issue: ‘그 여자’
    rationale: αὐτήν은 앞선 γαμετήν, 곧 ‘아내’를 가리킵니다. 한국어에서 ‘그 여자’는 지시가 불필요하게 거칠고 낮추어 들릴 수 있으므로 ‘아내’로 되풀이하는 편이 정확하고 자연스럽습니다.
  - severity: medium
    issue: ‘무법함 때문에’
    rationale: ‘무법함’은 현대 한국어에서 자연스럽지 않으며, παρανομία가 가리키는 법에 어긋난 행위 또는 법을 어김을 충분히 전달하지 못합니다.
  revised_text: 또한 그는 아내에 대한 애정도 제어하고, 아내가 법을 어겼기 때문에 아내를 책망합니다.[a]
