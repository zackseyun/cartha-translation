  rationale: 이성이 적대심을 이기는 근거가 율법에 대한 충성이라는 점을 유지하되, 기계적 원인이라기보다 동기와 이유를 드러내는 표현으로 처리했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1
