translation:
  language: ko
  text: 그리고 율법 때문에 이성이 적대심마저 이길 수 있다는 것을 이상하게 여기지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘역설적이라고 여기지 마십시오’. 그리스어 형용사는 ‘예상 밖의’ 또는 ‘놀라운’ 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘율법 때문에 이성이 적대심을 이길 수 있는 곳에서’라는 뜻입니다. 그리스어 문장은 압축되어 있어, 번역에서는 자연스러운 한국어로 풀었습니다.
    reason: lexical_alternative
