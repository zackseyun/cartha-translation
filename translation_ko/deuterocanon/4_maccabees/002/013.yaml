base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/013.yaml
  text: And do not think it strange that reason can prevail even over hostility for the sake of the law[b][a],
  footnotes:
  - marker: a
    text: Or 'do not consider it paradoxical'—the Greek adjective can mean 'contrary to expectation' or 'surprising.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'where also reason is able to prevail over hostility because of the law.' The Greek construction is somewhat compressed; the translation renders the sense in natural English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 율법 때문에 이성이 적대심마저 이길 수 있다는 것을 이상하게 여기지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘역설적이라고 여기지 마십시오’. 그리스어 형용사는 ‘예상 밖의’ 또는 ‘놀라운’ 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘율법 때문에 이성이 적대심을 이길 수 있는 곳에서’라는 뜻입니다. 그리스어 문장은 압축되어 있어, 번역에서는 자연스러운 한국어로 풀었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ νομίσητε
  english_pob_choice: do not think
  chosen_korean: 이상하게 여기지 마십시오
  alternatives_korean:
  - 그렇게 생각하지 마십시오
  - 그렇게 여기지 마십시오
  - 생각하지 마십시오
  lexicon: BDAG
  rationale: 부정 명령의 평가적 뉘앙스를 살리면서, 뒤의 παράδοξον과 자연스럽게 이어지도록 한국어에서는 ‘이상하게 여기다’가 가장 관용적입니다.
- source_word: παράδοξον
  english_pob_choice: strange
  chosen_korean: 이상하게
  alternatives_korean:
  - 기이하게
  - 놀랍게
  - 역설적으로
  lexicon: LSJ
  rationale: 원문의 ‘예상 밖’/‘놀라움’의 뜻을 살려, 학술적 ‘역설적’보다 독자가 바로 이해하는 ‘이상하게’로 옮겼습니다.
- source_word: ὁ λογισμός
  english_pob_choice: reason
  chosen_korean: 이성
  alternatives_korean:
  - 이성적 판단
  - 사고
  - 이성력
  lexicon: LSJ
  rationale: 4 마카베오스의 핵심 개념인 합리적 판단 능력을 한국어에서 가장 간결하게 드러내는 말은 ‘이성’입니다.
- source_word: ἔχθραν
  english_pob_choice: hostility
  chosen_korean: 적대심
  alternatives_korean:
  - 적대
  - 원한
  - 적개심
  lexicon: BDAG
  rationale: 단순한 감정보다 대립 상태를 포함하는 어감을 살려 ‘적대심’으로 옮겼습니다.
- source_word: ἐπικρατεῖν δύναται
  english_pob_choice: can prevail even over
  chosen_korean: 이길 수 있다는
  alternatives_korean:
  - 제압할 수 있다는
  - 지배할 수 있다는
  - 능히 이긴다는
  lexicon: BDAG
  rationale: 능력 표현을 살리되 한국어 문맥에서 자연스럽게, ‘prevail over’의 승리/우위 의미를 ‘이기다’로 풀었습니다.
- source_word: διὰ τὸν νόμον
  english_pob_choice: for the sake of the law
  chosen_korean: 율법 때문에
  alternatives_korean:
  - 율법을 위하여
  - 율법으로 말미암아
  - 율법을 위해
  lexicon: BDAG
  rationale: διά + 목적격의 동기/이유 성격을 살리면서, 본문이 이성의 승리가 율법에 대한 헌신과 연결됨을 간명하게 드러냅니다.
theological_decisions:
- issue: 4 마카베오스에서 λογισμός의 철학적 무게
  chosen_reading: 이성
  alternative_readings:
  - 이성적 판단
  - 이성력
  - 사유
  rationale: 이 책의 핵심 논지를 이루는 ‘합리적 통제력’의 개념을 한국어 독자가 가장 자연스럽게 읽도록 하면서도, 단순한 감정 대비를 넘는 철학적 무게를 유지합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 5
- issue: διὰ τὸν νόμον의 인과/동기 표현
  chosen_reading: 율법 때문에
  alternative_readings:
  - 율법을 위하여
  - 율법으로 말미암아
  rationale: 이성이 적대심을 이기는 근거가 율법에 대한 충성이라는 점을 유지하되, 기계적 원인이라기보다 동기와 이유를 드러내는 표현으로 처리했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1
