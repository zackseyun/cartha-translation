  text: For when God constructed man, he implanted both his passions and his dispositions.
translation:
  language: ko
  text: 왜냐하면 하나님이 사람을 지으실 때, 그의 정욕들과 성향들을 함께 심어 두셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지으실’은 English POB의 ‘constructed’를 반영해, 단순한 창조보다 의도적 구성의 뉘앙스를 살린 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁπηνίκα
  english_pob_choice: when
  chosen_korean: 때
  alternatives_korean:
  - 때문에
  - …할 때
  lexicon: LSJ
  rationale: 시간을 여는 종속절이므로 한국어에서는 간결하게 ‘~할 때’의 구조로 옮기는 것이 자연스럽습니다.
- source_word: κατεσκεύασεν
  english_pob_choice: constructed
  chosen_korean: 지으실
  alternatives_korean:
  - 만드실
  - 창조하실
  - 형성하실
  lexicon: LSJ
  rationale: 동사는 단순한 ‘만들다’보다 의도적으로 빚어 내는 뉘앙스를 가지므로, 일반적인 ‘지으시다’가 가장 가깝습니다.
- source_word: τὰ πάθη
  english_pob_choice: passions
  chosen_korean: 정욕들
  alternatives_korean:
  - 감정들
  - 정서들
  - 열정들
  lexicon: LSJ
  rationale: 철학적·윤리적 문맥에서 πάθη는 인간 안에 있는 정념을 가리키므로, 그 긴장을 살리는 ‘정욕들’이 적절합니다.
- source_word: τὰ ἤθη
  english_pob_choice: dispositions
  chosen_korean: 성향들
  alternatives_korean:
  - 습성들
  - 성격들
  - 기질들
  lexicon: LSJ
  rationale: ἤθη는 고정된 성격적 경향이나 성향을 뜻하므로, 너무 일상적인 ‘습성’보다 ‘성향들’이 의미 범위를 잘 보존합니다.
- source_word: περιεφύτευσεν
  english_pob_choice: implanted
  chosen_korean: 심어 두셨기
  alternatives_korean:
  - 심으셨기
  - 내재시키셨기
  - 불어넣으셨기
  lexicon: LSJ
  rationale: 문자적으로는 ‘주변에/안에 심다’의 비유이므로, 하나님이 인간 안에 이것들을 넣어 두셨다는 이미지를 살리는 ‘심어 두셨다’가 가장 자연스럽습니다.
theological_decisions:
- issue: 하나님이 사람 안에 ‘정욕들’과 ‘성향들’을 심어 두셨다는 진술을 어떻게 보존할지
  chosen_reading: 본문의 직접 진술을 약화하지 않고, 하나님이 인간의 정념과 성향을 창조 질서 안에 두셨다고 그대로 옮깁니다.
  alternative_readings:
  - ‘정욕’의 강한 윤리적 함의를 완화하여 중립적 능력으로만 옮김
  - 해석을 덧붙여 ‘절제해야 할 것’으로 미리 규정함
  rationale: 그리스어는 두 요소 모두를 하나님이 심어 두셨다고 분명히 말하므로, 논증의 긴장을 유지하는 번역이 필요합니다.
  doctrine_reference: 본문이 제시하는 인간론의 긴장을 보존
