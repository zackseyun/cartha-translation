  source_fidelity: 그리스어의 과거 부정과거 동사들(κατεσκεύασεν, περιεφύτευσεν)은 완료된 과거 행위를 가리키는데, 초안의 ‘지으실 때’는 미래/의지형으로 되어 시제가 맞지 않습니다. 또한 αὐτοῦ는 ‘사람’에게 연결되므로 ‘그 안에’로 명시하는 것이 한국어에서 안전합니다. πάθη는 이 철학적 문맥에서 성적 욕망으로 좁아지기 쉬운 ‘정욕’보다 ‘정념’이 더 정확합니다.
