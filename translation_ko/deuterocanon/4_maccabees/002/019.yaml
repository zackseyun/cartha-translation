base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/019.yaml
  text: For why does our all-wise father Jacob blame those around Simeon and Levi for slaughtering the Shechemites en masse[a], not with reason, saying[b], “Cursed be their anger”?
  footnotes:
  - marker: a
    text: Or, 'without reason,' if the phrase μὴ λογισμῷ is taken more idiomatically; the sense in context is that Jacob's condemnation was justified, not irrational.
    reason: lexical_alternative
  - marker: b
    text: The quotation echoes Genesis 49:7.
    reason: cross_reference
translation:
  language: ko
  text: 그러면 우리의 지극히 지혜로운 조상 야곱이 왜 시므온과 레위 편에 있던 이들이 세겜 사람들을 한 민족으로서 학살한 일을 나무라면서, “그들의 분노는 저주를 받을지어다”라고 말했습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: μὴ λογισμῷ는 문맥상 ‘이성 없이’라기보다, 야곱의 책망이 합리적 근거를 가진 것으로 읽힐 수 있는 압축된 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 구절은 창세기 49:7의 인용을 반영합니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπεὶ διὰ τί
  english_pob_choice: For why
  chosen_korean: 그러면 ... 왜
  alternatives_korean:
  - 왜
  - 그러므로 왜
  lexicon: LSJ
  rationale: 앞선 논지를 이어 묻는 설명적 수사 의문이므로, 연결감과 질문성을 함께 살리기 위해 ‘그러면 … 왜’로 옮겼습니다.
- source_word: ὁ πάνσοφος ἡμῶν πατὴρ Ἰακώβ
  english_pob_choice: our all-wise father Jacob
  chosen_korean: 우리의 지극히 지혜로운 조상 야곱
  alternatives_korean:
  - 우리의 매우 지혜로운 아버지 야곱
  - 우리의 온전히 지혜로운 조상 야곱
  lexicon: LSJ
  rationale: πάνσοφος의 과장된 찬양 어조를 살리되, 한국어에서는 ‘지극히 지혜로운’이 자연스럽고 격조도 유지합니다.
- source_word: τοὺς περὶ Συμεὼν καὶ Λευεὶν
  english_pob_choice: those around Simeon and Levi
  chosen_korean: 시므온과 레위 편에 있던 이들
  alternatives_korean:
  - 시므온과 레위 주위에 있던 이들
  - 시므온과 레위 무리에 속한 이들
  lexicon: LSJ
  rationale: περὶ + 인명은 단순한 동반자 관계를 가리킬 수 있어, 과도하게 특정하지 않으면서도 문맥상 ‘편에 있던 이들’로 묶음의 의미를 살렸습니다.
- source_word: μὴ λογισμῷ
  english_pob_choice: not with reason
  chosen_korean: '... 나무라면서'
  alternatives_korean:
  - 이성 없이
  - 분별 없이
  lexicon: LSJ
  rationale: 이 구문은 야곱의 책망이 무리하지 않았음을 암시하는 압축된 표현이므로, 본문에는 자연스럽게 반영하고 주석적 뉘앙스는 문장 전체의 흐름으로 보존했습니다.
- source_word: τοὺς Σικιμίτας
  english_pob_choice: the Shechemites
  chosen_korean: 세겜 사람들
  alternatives_korean:
  - 세겜 주민들
  - 세겜 족속
  lexicon: LSJ
  rationale: Σικιμίται는 창세기의 세겜 거주민들을 가리키므로, 한국어 성서문맥에서 익숙한 ‘세겜 사람들’이 가장 직접적입니다.
- source_word: ἐθνηδόν
  english_pob_choice: as a nation
  chosen_korean: 한 민족으로서
  alternatives_korean:
  - 집단으로
  - 민족 전체로
  lexicon: LSJ
  rationale: 단순히 흩어진 개인이 아니라 집단 전체를 대상으로 한 행위를 나타내므로, POB의 집합적 의미를 ‘한 민족으로서’로 옮겼습니다.
- source_word: Ἐπικατάρατος ὁ θυμὸς αὐτῶν
  english_pob_choice: Cursed be their anger
  chosen_korean: “그들의 분노는 저주를 받을지어다”
  alternatives_korean:
  - “그들의 노여움은 저주를 받을지어다”
  - “그들의 분노가 저주를 받을지어다”
  lexicon: LSJ
  rationale: 창세기 49:7의 인용을 살려, θυμός를 문맥상 ‘분노’로 옮기고 저주 선언의 형식을 한국어 경어체 문장 안에 유지했습니다.
theological_decisions:
- issue: 수사 의문과 본문의 판정 논리
  chosen_reading: 문장 전체를 ‘야곱이 그들을 책망한 이유가 무엇인가’라는 수사 의문으로 읽고, μὴ λογισμῷ의 압축성을 해치지 않도록 본문은 자연스러운 한국어로 유지했습니다.
  alternative_readings:
  - ‘이성 없이’라는 부정을 더 노골적으로 드러내는 읽기
  - 야곱의 책망이 정당하다는 해석을 본문에 직접 풀어 쓰는 읽기
  rationale: 문맥상 이 책망은 이성적 판단에 근거한 것이라는 점을 드러내지만, 번역문은 해석을 과잉 확대하지 않고 원문의 압축을 보존하는 편이 더 충실합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3, 5
