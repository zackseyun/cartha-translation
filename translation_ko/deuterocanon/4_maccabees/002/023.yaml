  rationale: 문맥상 다스려지는 영역을 가리키므로 ‘나라’가 가장 자연스럽습니다. 필요 시 ‘왕국’도 가능하지만 한국어 독서감에서는 ‘나라’가 더 유려합니다.
- source_word: ἀνδρείαν
