  lexicon: LSJ
  rationale: 여기서는 단순한 일반법보다 통치 기준으로 주어진 권위 있는 규범의 성격이 강하므로, 한국어에서는 ‘율법’이 원문의 무게를 더 잘 드러냅니다.
- source_word: πολιτευόμενος
