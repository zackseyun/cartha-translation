  yaml_path: translation/deuterocanon/4_maccabees/002/023.yaml
  text: And to him he gave a law[a], according to which, by conducting himself as a citizen[b], he would rule a kingdom that was self-controlled and just and good and courageous.
  footnotes:
  - marker: a
    text: Or 'by which, living his civic life,' preserving the political sense of the Greek participle.
    reason: lexical_alternative
  - marker: b
    text: '''A kingdom'' could also be rendered ''a kingship'' or ''realm''; the Greek term can denote either the domain ruled or royal rule itself.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그에게 법을 주셨으니, 그가 그 법에 따라 시민으로서 살아가며[a] 절제하고 정의로우며 선하고 용감한 나라[b]를 다스릴 수 있도록 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘시민으로서 살아가며’는 그리스어 πολιτευόμενος의 정치적·시민적 뉘앙스를 살린 번역입니다. ‘공적 삶을 살아가며’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나라’는 그리스어 βασιλείαν을 옮긴 것입니다. 문맥에 따라 ‘왕국’, ‘왕권’ 또는 ‘통치’로도 번역할 수 있습니다.
    reason: lexical_alternative
