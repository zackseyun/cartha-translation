theological_decisions:
- issue: 지배 행위와 시민적 삶의 결합 표현
  chosen_reading: ‘시민으로서 살아가면서’라는 표현으로 통치의 정당성이 율법 아래의 공적 삶과 연결됨을 드러냈습니다.
  alternative_readings:
  - 다스리면서
  - 나라를 경영하면서
  - 법에 따라 통치하면서
  rationale: 원문은 왕의 통치가 단순한 권력 행사가 아니라 시민적 질서와 규범 아래 있는 삶임을 강조하므로, 그 긴장을 유지하는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
- issue: δικαίαν의 정치적 덕목 의미
  chosen_reading: ‘의롭고’로 옮겨 공적 정의와 도덕적 정당성을 함께 살렸습니다.
  alternative_readings:
  - 정의로운
  - 옳은
  rationale: 이 구절은 왕국의 성격을 묘사하는 덕목 목록이므로, 한국어에서는 ‘의롭고’가 단순한 법정적 정의와 윤리적 선함을 함께 전달합니다.
  doctrine_reference: Translation philosophy §5; Contested terms table (δικαιοσύνη)
