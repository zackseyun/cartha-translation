base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/001.yaml
  text: And what is surprising if the desires of the soul are nullified in relation to participation in beauty?[a]
  footnotes:
  - marker: a
    text: Or 'with respect to sharing in what is beautiful.' The phrase πρὸς τὴν τοῦ κάλλους μετουσίαν is somewhat abstract and can be rendered more explicitly.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 아름다움에 참여하는 일에 대하여 영혼의 욕구들이 효력을 잃는다 해도, 무엇이 놀랍겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아름다운 것에 참여하는 일에 대하여.’ πρὸς τὴν τοῦ κάλλους μετουσίαν은 다소 추상적인 표현이므로, 더 분명하게 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί θαυμαστόν
  english_pob_choice: what is surprising
  chosen_korean: 무엇이 놀랍습니까
  alternatives_korean:
  - 무엇이 이상합니까
  - 무엇이 놀랍겠습니까
  - 무엇이 신기합니까
  lexicon: LSJ
  rationale: 수사적 질문의 힘을 살리면서 현대 한국어에서 자연스럽게 들리는 표현으로 옮겼습니다.
- source_word: ἐπιθυμίαι
  english_pob_choice: desires
  chosen_korean: 욕구들
  alternatives_korean:
  - 욕망들
  - 갈망들
  - 정욕들
  lexicon: LSJ
  rationale: 영혼의 내적 충동을 가리키는 일반적 복수 명사로서, 지나치게 도덕화하거나 성적 의미로 좁히지 않기 위해 '욕구들'로 옮겼습니다.
- source_word: μετουσίαν
  english_pob_choice: participation
  chosen_korean: 참여하는 것
  alternatives_korean:
  - 참여
  - 나눔
  - 몫을 얻는 것
  lexicon: LSJ
  rationale: 철학적·추상적 결합을 보존하되 한국어 문장에서는 '참여하는 것'이 가장 자연스럽게 의미를 드러냅니다.
- source_word: ἀκυροῦνται πρὸς
  english_pob_choice: are nullified in relation to
  chosen_korean: 무효화된다면 … 관련하여
  alternatives_korean:
  - 무력화된다면 … 대하여
  - 효력을 잃는다면 … 관련하여
  - 없어지다면 … 대하여
  lexicon: LSJ
  rationale: ἀκυρόω의 '무효로 만들다/효력을 없애다'를 살리면서, πρὸς가 만든 관계를 '…과 관련하여'로 옮겨 원문의 추상적 연결을 유지했습니다.
- source_word: τοῦ κάλλους
  english_pob_choice: beauty
  chosen_korean: 아름다움
  alternatives_korean:
  - 아름다운 것
  - 미
  - 아름다움의
  lexicon: LSJ
  rationale: κάλλος의 기본 의미를 직접 살려 '아름다움'으로 옮겼습니다. 철학적 뉘앙스가 있으나 본문이 더 구체적으로 '선'이나 '고귀함'을 말하지는 않습니다.
theological_decisions:
- issue: ψυχή의 한국어 표기
  chosen_reading: 영혼
  alternative_readings:
  - 혼
  - 생명
  - 내면
  rationale: 헬레니즘-유대적 인간 이해에서 ψυχή는 'soul'에 해당하며, 본문 논증의 심리-윤리적 층위를 보존하기 위해 '영혼'을 택했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 추상명사구 πρὸς τὴν τοῦ κάλλους μετουσίαν의 처리
  chosen_reading: 아름다움에 참여하는 것과 관련하여
  alternative_readings:
  - 아름다움에 참여함에 관하여
  - 아름다움의 참여에 대해
  - 아름다움과의 나눔에 대하여
  rationale: 원문은 매우 추상적이므로, 의미를 과도하게 풀이하지 않으면서도 한국어 독자가 문장 관계를 따라갈 수 있게 최소한의 설명성을 부여했습니다.
  doctrine_reference: Translation philosophy §1, §3
