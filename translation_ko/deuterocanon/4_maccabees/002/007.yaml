  lexicon: LSJ
  rationale: 동사는 단순한 도덕적 ‘개선’보다 교육·훈련에 의한 재형성을 뜻하므로, 수동성과 과정성을 살린 ‘다시 훈련을 받다’로 옮겼습니다.
- source_word: κύριός ἐστιν τῶν παθῶν ὁ λογισμός
  english_pob_choice: reason is master of the passions
  chosen_korean: 이성이 정념들을 지배한다
  alternatives_korean:
  - 이성이 감정들을 다스린다
  - 이성이 욕망들을 지배한다
  - 이성이 정념의 주인이다
  lexicon: LSJ
  rationale: λογισμός는 이 문맥에서 철학적 ‘이성’이며, παθῶν은 단순 감정보다 질서 잃은 정념을 뜻하므로, 관계를 분명히 하는 ‘지배한다’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: κύριος의 비신학적 용법
  chosen_reading: ‘주’가 아니라 ‘지배한다’로 처리하여 권위 호칭으로 오해되지 않게 했습니다.
  alternative_readings:
  - 주이다
  - 주인이다
  - 통치한다
  rationale: 문맥상 κύριος는 하나님/주님 호칭이 아니라 이성이 정념 위에 갖는 통제력을 말하므로, 한국어에서도 비종교적 지배 관계로 번역하는 것이 소스에 충실합니다.
  doctrine_reference: 'Contested terms table for κύριος: context-sensitive rendering rather than default honorific title.'
- issue: 남성 단수 일반 예시의 처리
  chosen_reading: ‘사람’보다 ‘사람’의 일반성을 유지하되, 한국어에서 남성 지시가 과도하게 드러나지 않도록 무표지 표현을 택했습니다.
  alternative_readings:
  - 한 남자가
  - 어떤 사람이
  - 한 사람
  rationale: 그리스어 τις ὢν은 일반적 사례를 드는 표현이므로, 한국어에서는 성별을 전면화하지 않고도 사례적 의미를 유지하는 방식이 적절합니다.
  doctrine_reference: Gender-accurate rendering principle applied in Korean with natural generic reference.
