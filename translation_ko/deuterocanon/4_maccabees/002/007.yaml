  yaml_path: translation/deuterocanon/4_maccabees/002/007.yaml
  text: For how is a man who is by habit eating only one kind of food[a], and is a glutton and a drunkard, retrained, if it is not clear that reason is master of the passions?
  footnotes:
  - marker: a
    text: Or 'fastidious about food' or 'one who craves special dishes' for the rare Greek word translated 'greedy for delicacies.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왜냐하면 이성이 정념들을 지배한다는 것이 분명하지 않다면, 한 가지 음식만 먹는 버릇이 있고 탐식가이며 술꾼인 사람이 어떻게 다시 훈련을 받겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘한 가지 음식만 먹는 버릇이 있는’으로 옮긴 μονοφάγος는 희귀어입니다. 문자적으로는 ‘한 가지 음식만 먹는 사람’이며, 문맥에 따라 식성을 가리는 사람 또는 특정한 음식을 찾는 사람을 뜻할 수도 있습니다.
    reason: lexical_alternative
