  source_fidelity: 그리스어의 1인칭 ἔφην(‘내가 말했듯이’)을 초안의 비인칭 ‘앞서 말한 것처럼’이 충분히 드러내지 못합니다. 또한 σώφρων νοῦς는 이 문맥에서 절제 자체보다는 건전하고 분별력 있는 이성적 판단을 가리키므로 ‘분별 있는 이성’이 더 정확합니다. 나머지 정념의 일부를 전환하고 다른 일부를 무효화한다는 대조는 잘 보존되었습니다.
  naturalness: ‘그중 어떤 것들은 방향을 바꾸고’도 이해되지만, 이성이 정념에 수행하는 작용을 더 분명하고 자연스럽게 나타내도록 ‘그중 일부는 전환하며’으로 다듬었습니다. ‘내가 말했듯이’는 현대 한국어 합쇼체 문맥에서도 자연스럽습니다.
  terminology: πάθη를 ‘정념들’로 옮긴 것은 이 책의 철학적 용례에 적절합니다. νοῦς는 일관되게 ‘이성’으로 유지하되, σώφρων의 수식 의미는 ‘분별 있는’으로 반영했습니다. ‘무효로 만들다’는 ἀκυρῶσαι의 효력을 없앤다는 의미를 보존합니다.
