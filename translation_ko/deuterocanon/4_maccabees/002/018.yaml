  text: For, as I said, prudent reason is able to triumph over the passions, and to redirect some of them, and even to nullify others.
translation:
  language: ko
  text: 앞서 말한 것처럼, 절제된 이성은 정념들을 상대로 승리할 수 있으며, 그중 어떤 것들은 방향을 바꾸고, 또 어떤 것들은 아예 무효화할 수도 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘정념들’은 문맥상 πάθη의 철학적 의미를 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνατὸς ... ἀριστεῦσαι
  english_pob_choice: able to triumph
  chosen_korean: 승리할 수 있으며
  alternatives_korean:
  - 이길 수 있으며
  - 능히 뛰어날 수 있으며
  - 제압할 수 있으며
  lexicon: LSJ
  rationale: δυνατός의 가능성과 ἀριστεῦσαι의 우세·승리 뉘앙스를 함께 살려, 단순한 ‘이기다’보다 논지의 힘을 드러내는 ‘승리하다’를 택했습니다.
- source_word: σώφρων νοῦς
  english_pob_choice: prudent reason
  chosen_korean: 절제된 이성
  alternatives_korean:
  - 신중한 이성
  - 분별 있는 이성
  - 절제 있는 마음
  lexicon: LSJ
  rationale: σώφρων이 수사적·철학적으로 노ῦς를 수식하므로, 감정 억제보다 이성의 절제성과 분별성을 드러내는 표현으로 옮겼습니다.
- source_word: παθῶν
  english_pob_choice: the passions
  chosen_korean: 정념들
  alternatives_korean:
  - 열정들
  - 감정들
  - 욕정들
  lexicon: LSJ
  rationale: 이 문맥의 πάθη는 단순한 감정이 아니라 이성을 거스르는 정념·충동을 가리키므로, 철학적 용례를 살린 ‘정념들’로 옮겼습니다.
- source_word: μεταθεῖναι ... ἀκυρῶσαι
  english_pob_choice: to redirect ... to nullify
  chosen_korean: 방향을 바꾸고 ... 아예 무효화할 수도 있습니다
  alternatives_korean:
  - 전환하고 ... 무력화할 수도 있습니다
  - 바꾸고 ... 없앨 수도 있습니다
  - 돌려놓고 ... 폐기할 수도 있습니다
  lexicon: LSJ
  rationale: μεταθεῖναι는 완전 제거가 아니라 방향 전환의 뜻이 강하고, ἀκυρῶσαι는 효력을 없애는 뜻이므로 두 동사의 강약 차이를 살렸습니다.
theological_decisions:
- issue: 헬라스 유대 사상에서의 νοῦς와 πάθη
  chosen_reading: 이 절은 인간의 이성이 정념을 다스린다는 철학적 논지를 그대로 살리고, 후대 신학 용어를 덧씌우지 않았습니다.
  alternative_readings:
  - ‘이성’을 ‘마음’으로 완화하기
  - πάθη를 ‘감정’으로 일반화하기
  rationale: 4마카베오서는 헬라스적 윤리·철학 어휘로 논증하므로, 사상적 긴장을 보존하는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
