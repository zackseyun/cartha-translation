  text: 그리고 그것은 자녀에 대한 사랑을 지배합니다[a]—그들의 악행 때문에 그들을 벌하며; 또한 그것은 친구들에 대한 친밀함을 다스려, 그들의 악함 때문에 그들을 책망합니다.
  philosophy: optimal-equivalence
  footnotes:
