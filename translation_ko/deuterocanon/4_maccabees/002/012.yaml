translation:
  language: ko
  text: 그리고 그것은 자녀에 대한 사랑을 지배합니다[a]—그들의 악행 때문에 그들을 벌하며; 또한 그것은 친구들에 대한 친밀함을 다스려, 그들의 악함 때문에 그들을 책망합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘자녀들의 사랑’이며, 여기서는 자녀에게 향하는 애정, 곧 자녀 사랑의 뜻입니다.
    reason: lexical_alternative
