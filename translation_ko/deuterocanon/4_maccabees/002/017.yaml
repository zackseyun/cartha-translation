lexical_decisions:
- source_word: θυμούμενος
  english_pob_choice: was angered
  chosen_korean: 분노하였지만
  alternatives_korean:
  - 화를 냈지만
  - 격분하였지만
  lexicon: LSJ
  rationale: θυμόω 계열은 실제 분노 상태를 뜻하므로, 완곡하게 희석하지 않고 행위 전의 감정 상태를 드러내는 표현으로 옮겼습니다.
- source_word: κατὰ Δαθὰν καὶ Ἀβειρών
  english_pob_choice: against Dathan and Abiron
  chosen_korean: 다단과 아비론을 향해
  alternatives_korean:
  - 다단과 아비론에 대하여
  - 다단과 아비론을 상대로
  lexicon: LSJ
  rationale: κατά + 대격은 여기서 적대적 방향을 나타내므로, 대상에 대한 공격적 방향성을 자연스럽게 드러냈습니다. Ἀβειρών의 그리스어형을 따라 아비론으로 옮겼습니다.
- source_word: οὐ θυμῷ τι κατ᾽ αὐτῶν ἐποίησεν
  english_pob_choice: he did nothing against them in anger
  chosen_korean: 그들에 대해 분노로 아무 일도 하지 않았고
  alternatives_korean:
  - 그들에게 분노로 행동하지 않았고
  - 그들에게 화난 마음으로 아무것도 하지 않았고
  lexicon: LSJ
  rationale: 여기서 θυμῷ는 수단/양태로 쓰여 ‘분노로 인해, 분노 가운데’의 뜻을 띠므로, 행위의 방식이 분노에 지배되지 않았다는 점을 살렸습니다.
- source_word: λογισμῷ τὸν θυμὸν διήτησεν
  english_pob_choice: with reason he restrained anger
  chosen_korean: 이성으로 분노를 제어하였습니다
  alternatives_korean:
  - 이성으로 분노를 다스리셨습니다
  - 이성으로 분노를 억제하였습니다
  lexicon: LSJ
  rationale: 4 마카베오서는 λογισμός를 이성의 지배라는 주제어로 사용하므로, 문맥상 ‘reason’의 능동적 통제력을 드러내는 ‘제어하다’를 택했습니다.
theological_decisions:
- issue: 4 마카베오서의 핵심 주제인 이성과 정념의 대조를 한국어에서 어떻게 드러낼지
  chosen_reading: ‘이성으로 분노를 제어하였습니다’로 옮겨, 단순한 감정 억제가 아니라 이성이 정념을 다스리는 대비를 살렸습니다.
  alternative_readings:
  - ‘이성으로 분노를 다스리셨습니다’
  - ‘이성으로 분노를 억제하였습니다’
  rationale: 본문은 모세의 분노 자체를 부정하지 않으면서도, 그 분노가 행동을 지배하지 못하게 한 점을 강조합니다. 따라서 이성의 주도권을 분명히 보이는 번역이 필요합니다.
  doctrine_reference: 4 Maccabees의 덕 윤리와 정념 통제 주제
- issue: 모세에 대한 경어 사용 여부
  chosen_reading: 서술문은 합쇼체로 유지하되, 본문 인물 모세에 대한 별도 경어는 두지 않았습니다.
  alternative_readings:
  - ‘다스리셨습니다’처럼 모세에게 경어를 사용
  - 중립적 서술 유지
  rationale: 한국어 성경 문체에서는 인물에게 일관된 경어를 강제하기보다 문장 전체의 서술 체계를 우선하는 것이 자연스럽습니다.
  doctrine_reference: 한국어 성경 문체 관례
