  text: For although Moses was angered against Dathan and Abiron, he did nothing against them in anger, but with reason he restrained anger.
  footnotes:
  - marker: a
    text: Greek Ἀβειρών; traditionally 'Abiram.'
    reason: lexical_alternative
  - marker: b
    text: Or 'by rational judgment he governed his anger.' The Greek highlights reason's mastery over passion, a central theme in 4 Maccabees.
