  - ‘금욕’으로 의역하기
  rationale: 이 단락은 철학적 자기지배를 강조하므로, 후대 교리적 용어로 바꾸지 않고 본문의 윤리적 구조를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy §§1, 5, 6'
