  text: Accordingly[a], the self-controlled Joseph is praised[b], because by reason he mastered love of pleasure.
  footnotes:
  - marker: a
    text: The Greek phrase behind 'by reason' is somewhat awkward in this witness (literally, 'by reason, mind/thought'). The translation renders the combined sense idiomatically as the exercise of rational control.
    reason: lexical_alternative
  - marker: b
    text: Or 'love of pleasure' for 'the desire for pleasure.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 절제하는 요셉은 칭찬을 받습니다. 그는 이성으로 쾌락에 대한 욕구를 이겨냈기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이성으로’는 원문의 τῷ λογισμῷ διανοίᾳ를 한국어로 자연스럽게 통합한 표현입니다.
    reason: source_note
  - marker: b
    text: ἡδυπάθεια는 단순한 ‘즐거움’보다 쾌락 추구 또는 쾌락에 대한 욕구를 가리킵니다.
    reason: lexical_alternative
