  rationale: γάρ를 ‘…기 때문입니다’로 반영하고, καί를 ‘도’로 살렸습니다. ‘애정’은 부모를 향한 εὔνοια의 관계적 정서를 자연스럽게 나타내며, 가능한 더 넓은 뜻은 주석으로 남겼습니다. a는 ‘애정’에, b는 ‘그들 때문에’에 직접 연결했습니다. ‘그들 때문에’는 διά+대격의 동기·이유를 보존하고, ‘덕을 저버리다’는 καταπροδίδωμι의 강한 포기·배반의 의미를 자연스러운 한국어로 표현합니다.
