  source_fidelity: 개정이 필요합니다. γάρ의 인과적 연결은 현 초안의 ‘또한’만으로는 충분히 드러나지 않습니다. 또한 καί는 ‘도’로, κρατεῖ는 ‘우세하다’로 자연스럽게 살릴 수 있습니다. μὴ καταπροδιδοὺς τὴν ἀρετήν은 율법이 부모를 이유로 덕을 저버리지 않는다는 뜻이므로 ‘덕을 저버리지’가 한국어 관용과 원문의 강한 부정적 의미를 모두 잘 반영합니다.
