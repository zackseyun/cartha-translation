  - 우선합니다
  - 이깁니다
  lexicon: LSJ
  rationale: κρατέω는 우세함과 지배력을 나타내므로, 법이 부모에 대한 호의보다 우위에 있다는 관계를 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: ἀρετήν
