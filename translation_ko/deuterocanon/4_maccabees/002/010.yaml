  lexicon: LSJ
  rationale: 4 마카베오스의 윤리적·철학적 어휘에서 ἀρετή는 '덕/미덕'의 핵심어이므로, 간결하고 고전적인 한국어 대응인 '덕'을 택했습니다.
theological_decisions:
- issue: 율법과 가족 정서의 우선순위
  chosen_reading: 이 절은 율법이 부모에 대한 호의보다 우선하며, 그 때문에 덕을 배반해서는 안 된다고 말합니다.
  alternative_readings:
  - 율법이 부모 공경을 전면적으로 부정한다는 뜻
  - 단지 일반적 원칙으로서만 율법의 중요성을 말한다는 뜻
  rationale: κρατεῖ와 부정 분사 구조는 실제로 충돌 상황에서 율법의 우위를 말하므로, 그 긴장을 약화하지 않고 그대로 살렸습니다.
  doctrine_reference: 'DOCTRINE.md: 원문이 드러내는 긴장 보존, 원어 우선'
