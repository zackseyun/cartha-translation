  lexicon: BDAG
  rationale: πλησίον은 여기서 공동체의 이웃을 가리키며, γυναῖκα는 문맥상 분명히 배우자인 ‘아내’입니다.
- source_word: οὐδὲ ὅσα τῷ πλησίον σού ἐστιν
  english_pob_choice: nor anything that belongs to your neighbor
  chosen_korean: 네 이웃에게 속한 것도 아무것도
  alternatives_korean:
  - 네 이웃의 것도 아무것도
  - 네 이웃의 모든 것
  lexicon: BDAG / LSJ
  rationale: 중성 복수 관계절을 포괄적 표현으로 풀어 ‘아무것도’로 옮겼고, ἐστίν의 소유 관계는 ‘속한’으로 자연스럽게 나타냈습니다.
