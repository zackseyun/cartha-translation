  rationale: γοῦν의 추론적·확인적 연결을 ‘그러므로’로 살렸고, ὁ νόμος는 여기서 모세 율법의 인용 표지이므로 ‘율법’으로 옮겼습니다.
- source_word: Οὐκ ἐπιθυμήσεις
