  rationale: ἐπιθυμέω는 단순한 소망보다 타인의 것을 향한 강한 욕망을 뜻하므로, 윤리적 금지를 분명히 드러내는 ‘탐내다’가 가장 자연스럽습니다.
- source_word: τὴν γυναῖκα τοῦ πλησίον σου
  english_pob_choice: your neighbor’s wife
