    issue: 조건절의 시제가 반사실 과거를 충분히 나타내지 못함
    rationale: ἐδύνατο와 οὐκ ἂν εἶπεν의 결합은 ‘이성이 정념들을 다스릴 수 없었다면, 그는 그렇게 말하지 않았을 것이다’라는 반사실 조건을 이룹니다. ‘없다면’은 이 과거 반사실성을 흐릴 수 있습니다.
  - severity: low
    issue: ‘욕정들’의 의미 범위가 현대 한국어에서 지나치게 좁아질 수 있음
    rationale: θυμοί는 여기서 성적 욕망에 한정되지 않는 정서적·충동적 정념들을 뜻합니다. ‘정념들’이 철학적 문맥과 의미 범위를 더 잘 보존합니다.
  revised_text: 이성이 정념들을 다스릴 수 없었다면, 그는 이렇게 말하지 않았을 것입니다.
