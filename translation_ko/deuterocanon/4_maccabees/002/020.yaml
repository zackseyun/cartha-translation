  text: For if reason were not able to master the passions, he would not have spoken in this way.
translation:
  language: ko
  text: 이성이 정념들을 다스릴 수 없었다면, 그는 이렇게 말하지 않았을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδύνατο
  english_pob_choice: were able
  chosen_korean: 지배할 수 없다면
  alternatives_korean:
  - 할 수 없다면
  - 능력이 없다면
  lexicon: LSJ
  rationale: δύναμαι의 능력 가능성을 반영하되, 한국어에서는 앞 조건절에서 자연스럽게 이어지도록 ‘지배할 수 없다면’으로 옮겼습니다.
- source_word: τῶν θυμῶν
  english_pob_choice: the passions
  chosen_korean: 욕정들
  alternatives_korean:
  - 정념들
  - 감정들
  - 분노들
  lexicon: LSJ
  rationale: θυμός는 단순한 ‘분노’보다 더 넓은 정서적·충동적 동인을 가리키므로, 철학적 논지에 맞는 복수형 ‘욕정들’로 옮겼습니다.
- source_word: ὁ λογισμός
  english_pob_choice: reason
  chosen_korean: 이성(理性)
  alternatives_korean:
  - 이성
  - 합리적 판단
  - 사고
  lexicon: LSJ
  rationale: 4 마카베오서에서 λογισμός는 인간의 이성적 판단 능력을 가리키는 핵심 용어이므로, 문맥을 살리면서도 현대 한국어에서 분명한 ‘이성(理性)’으로 번역했습니다.
- source_word: κρατεῖν
  english_pob_choice: to master
  chosen_korean: 지배할
  alternatives_korean:
  - 제어할
  - 다스릴
  - 통제할
  lexicon: LSJ
  rationale: κρατέω는 단순한 절제가 아니라 우세와 지배를 뜻하므로, 논지의 강도를 살려 ‘지배하다’를 택했습니다.
- source_word: οὕτως
  english_pob_choice: in this way
  chosen_korean: 이런 식으로
  alternatives_korean:
  - 이렇게
  - 그와 같이
  - 그런 식으로
  lexicon: LSJ
  rationale: 앞선 발화를 가리키는 말로서, 한국어에서는 지시 관계가 분명한 ‘이런 식으로’가 가장 자연스럽습니다.
theological_decisions:
- issue: 이성(λογισμός)과 욕정(θυμοί)의 대비를 한국어에서 얼마나 철학적으로 유지할지
  chosen_reading: ‘이성(理性)’과 ‘욕정들’의 대비를 유지해, 4 마카베오서의 수양·이성 지배 논지를 분명히 드러냈습니다.
  alternative_readings:
  - ‘이성’과 ‘정념들’
  - ‘합리적 판단’과 ‘감정들’
  rationale: 이 절은 단순한 감정 통제가 아니라 이성이 욕정 위에 군림할 수 있는가를 묻는 문장이므로, 철학적 대조가 흐려지지 않도록 번역했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1
