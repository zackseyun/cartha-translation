translation:
  language: ko
  text: 그때에도 또한 그는 감각 기관들을 통해 거룩한 통치하는 마음을 모든 것 위에 앉히셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '거룩한 통치 이성'. 그리스어 νοῦς는 좁은 현대적 의미의 지성만이 아니라 이성적 기능 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τηνικαῦτα
  english_pob_choice: at that time
  chosen_korean: 그때에도
  alternatives_korean:
