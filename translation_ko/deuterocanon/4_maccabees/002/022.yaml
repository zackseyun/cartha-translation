  rationale: νοῦς는 단순한 지능보다 도덕적·이성적 기능을 가리키므로 '마음'으로 옮기되, ἡγεμόνα의 지배적 의미는 '통치하는'으로 살렸습니다.
- source_word: διὰ τῶν αἰσθητηρίων
