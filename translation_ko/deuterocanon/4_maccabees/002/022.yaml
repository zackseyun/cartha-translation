  yaml_path: translation/deuterocanon/4_maccabees/002/022.yaml
  text: And at that time he also enthroned the holy ruling mind over all things through the senses;[a]
  footnotes:
  - marker: a
    text: Or 'the holy governing reason.' The Greek νοῦς can denote the rational faculty, not merely intellect in a narrow modern sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에도 그는 감각 기관들을 통해 거룩하고 통치하는 이성을 모든 것 위에 왕좌에 앉히셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거룩한 통치 이성’. 그리스어 νοῦς는 좁은 현대적 의미의 지성만이 아니라, 이성적으로 판단하고 다스리는 기능을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τηνικαῦτα
  english_pob_choice: at that time
  chosen_korean: 그때에도
