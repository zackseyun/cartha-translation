  - 그 당시에도
  lexicon: LSJ
  rationale: 시간의 흐름 속에서 앞뒤 문맥을 잇는 부사로 읽어, 자연스러운 서술형 합쇼체로 옮겼습니다.
- source_word: τὸν ἱερὸν ἡγεμόνα νοῦν
  english_pob_choice: the holy ruling mind
  chosen_korean: 거룩한 통치하는 마음
