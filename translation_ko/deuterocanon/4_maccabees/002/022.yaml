  rationale: νοῦς는 단순한 지능보다 도덕적·이성적 기능을 가리키므로 '마음'으로 옮기되, ἡγεμόνα의 지배적 의미는 '통치하는'으로 살렸습니다.
- source_word: διὰ τῶν αἰσθητηρίων
  english_pob_choice: through the senses
  chosen_korean: 감각 기관들을 통해
  alternatives_korean:
  - 감각을 통해
  - 지각 기관들을 통해
  - 감각 작용들을 통해
  lexicon: LSJ
  rationale: αἰσθητήρια는 감각의 기관 또는 기능을 가리키므로, POB의 의미를 살리면서도 한국어에서 명확한 표현으로 번역했습니다.
- source_word: ἐνεθρόνισεν
  english_pob_choice: enthroned
  chosen_korean: 앉히셨습니다
  alternatives_korean:
  - 왕좌에 앉히셨습니다
  - 보좌에 앉히셨습니다
  - 즉위시키셨습니다
  lexicon: LSJ
  rationale: 왕권적 비유를 직접 살리면서도, 한국어에서 'enthrone'의 동작성을 드러내기 위해 '앉히셨습니다'를 택했습니다.
theological_decisions:
- issue: νοῦς의 철학적 뉘앙스와 한국어 대응
  chosen_reading: '''마음''으로 옮기되, 주석 없이도 통치·도덕적 기능이 드러나도록 ''통치하는''을 결합했습니다.'
  alternative_readings:
  - '''이성'''
  - '''정신'''
  rationale: 이 책의 νοῦς는 단순한 지성보다 인간 내부의 통치 원리라는 점이 중요하므로, 너무 철학적이거나 추상적인 '이성'보다 서술 맥락에 맞는 '마음'을 선택했습니다.
