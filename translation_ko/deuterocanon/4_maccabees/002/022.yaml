  - '''정신'''
  rationale: 이 책의 νοῦς는 단순한 지성보다 인간 내부의 통치 원리라는 점이 중요하므로, 너무 철학적이거나 추상적인 '이성'보다 서술 맥락에 맞는 '마음'을 선택했습니다.
