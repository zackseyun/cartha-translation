  lexicon: LSJ
  rationale: 왕권적 비유를 직접 살리면서도, 한국어에서 'enthrone'의 동작성을 드러내기 위해 '앉히셨습니다'를 택했습니다.
theological_decisions:
- issue: νοῦς의 철학적 뉘앙스와 한국어 대응
  chosen_reading: '''마음''으로 옮기되, 주석 없이도 통치·도덕적 기능이 드러나도록 ''통치하는''을 결합했습니다.'
  alternative_readings:
