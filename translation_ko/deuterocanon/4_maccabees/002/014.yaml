  source_fidelity: 수정이 필요합니다. ἀπολέσασιν은 주어진 스웨테 본문에서 능동 부정과거 분사(여격 복수)이며, ‘파멸당한 자들’이라는 수동 표현으로 단정할 수 없습니다. 또한 원문의 대조(베어 쓰러뜨리지 않음 / 보존함 / 다시 일으켜 세움)가 현 초안의 ‘…보존하며, …일으켜 세우지도 않습니다’에서는 문법적으로도 의미상으로도 무너집니다.
  naturalness: ‘길들여진 식물’은 사람이나 동물에 더 흔히 쓰여 농경 문맥에서 부자연스럽습니다. ‘재배한 식물’ 또는 ‘가꾼 식물’이 자연스럽습니다. 수정문은 현대 표준어 합쇼체로 자연스럽게 연결됩니다.
  terminology: ‘적들’과 ‘원수들’은 원문의 πολεμίων/ἐχθρῶν의 어휘상 구별을 한국어에서 억지로 달리할 필요가 없습니다. τὰ ἥμερα φυτά는 ‘재배한 식물’로, δενδροτομῶν은 그 식물을 ‘베어 쓰러뜨리다’로 옮깁니다. ἀπολέσασιν의 생략된 목적어와 정확한 의미는 불명확하므로, 본문에서는 능동성을 살린 ‘잃은 이들’을 사용하고 각주에서 가능한 대안을 밝혔습니다.
