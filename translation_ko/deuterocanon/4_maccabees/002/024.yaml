  text: How then, someone might say, if reason rules over the passions, does it not also rule over forgetfulness and ignorance?
translation:
  language: ko
  text: 그러면 누군가 이렇게 말할 수 있습니다. “이성이 정념들을 지배한다면, 어찌 망각과 무지도 지배하지 않습니까?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πῶς οὖν
  english_pob_choice: How then
  chosen_korean: 그러면 어떤 이가 말할 수 있습니다
  alternatives_korean:
  - 그러면 어떻게 됩니까
  - 그러면
  lexicon: LSJ
  rationale: 논증의 반문을 한국어에서 자연스럽게 살리기 위해 직역형 질문보다 ‘어떤 이가 말할 수 있습니다’로 도입해, 이어지는 가상 반론의 화법을 드러냈습니다.
- source_word: εἴποι τις ἄν
  english_pob_choice: someone might say
  chosen_korean: 어떤 이가 말할 수 있습니다
  alternatives_korean:
  - 누군가 말할 수 있습니다
  - 사람들이 말할 수 있습니다
  lexicon: LSJ
  rationale: 가정적 발화를 나타내는 표현이므로, 중립적인 ‘어떤 이가 말할 수 있습니다’로 옮겨 반론 제기의 구조를 유지했습니다.
- source_word: ὁ λογισμὸς
  english_pob_choice: reason
  chosen_korean: 이성
  alternatives_korean:
  - 이성적 판단
  - 사고
  lexicon: LSJ
  rationale: 4 Maccabees의 철학적 어휘에서 λογισμός는 이성적 판단 능력을 가리키므로, 간결하면서도 개념을 보존하는 ‘이성’을 택했습니다.
- source_word: τῶν παθῶν
  english_pob_choice: the passions
  chosen_korean: 정념들을
  alternatives_korean:
  - 욕정들을
  - 감정들을
  - 열정들을
  lexicon: LSJ
  rationale: πάθη는 단순 감정보다 이성이 제어해야 할 정념·충동의 범주이므로, 철학적 대비를 살리기 위해 ‘정념들’로 옮겼습니다.
- source_word: λήθης καὶ ἀγνοίας
  english_pob_choice: forgetfulness and ignorance
  chosen_korean: 망각과 무지
  alternatives_korean:
  - 잊어버림과 무지
  - 기억 상실과 무지
  lexicon: LSJ
  rationale: 두 추상명사의 병렬을 간결하게 살리면서, λήθη의 ‘망각’과 ἀγνοίας의 ‘무지’라는 핵심 의미를 보존했습니다.
theological_decisions:
- issue: 4 Maccabees의 철학-윤리적 대조 구조
  chosen_reading: ‘이성’과 ‘정념들’의 대조를 유지하여, 이성이 정념을 지배한다는 본문의 논증 구조를 드러냈습니다.
  alternative_readings:
  - ‘이성적 판단’과 ‘감정들’로 완화해 옮기기
  - ‘마음’과 ‘욕망들’로 일반화하기
  rationale: 이 구절은 감정 일반이 아니라 철학적-윤리적 범주인 πάθη와 λογισμός의 대립을 다루므로, 한국어에서도 그 긴장을 희석하지 않는 표현이 필요합니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy §§1, 5, 6'
