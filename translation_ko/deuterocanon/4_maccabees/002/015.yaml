  text: 'And reason is seen to prevail even over the more violent passions: love of power[a], empty glory, boastfulness, arrogance[b], and envy.'
  footnotes:
  - marker: a
    text: Or 'vainglory' for 'empty glory.' The Greek literally means 'empty glory.'
    reason: lexical_alternative
  - marker: b
    text: '''Envy'' may also carry the sense of malicious ill-will or ''the evil eye.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 더 거센 감정들조차도 이성이 지배하는 것이 드러납니다. 곧 권력 사랑, 빈 영광, 자랑함, 오만, 질투입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘빈 영광’은 문자적으로 ‘empty glory’를 따른 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘질투’는 경우에 따라 악의적 악감정이나 ‘악한 눈’의 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τῶν βιαιοτέρων δὲ παθῶν
  english_pob_choice: over the more violent passions
  chosen_korean: 더 거센 감정들조차도
  alternatives_korean:
  - 더 폭력적인 정념들을
  - 더 거친 감정들을
  lexicon: LSJ
  rationale: διά와 κρατεῖν의 결합은 ‘~을 통해서’보다 ‘~을 넘어서/~에 대해 우세함’의 뜻이 자연스럽고, πάθη는 여기서 ‘고통’보다 감정·정념의 의미가 분명합니다.
- source_word: κρατεῖν
  english_pob_choice: to prevail
  chosen_korean: 지배하는
  alternatives_korean:
  - 우세하는
  - 이기는
  - 장악하는
  lexicon: LSJ
  rationale: 이 동사는 이성이 감정들 위에 우위를 가지는 상태를 말하므로, ‘지배하다’가 ‘prevail’의 힘과 관계를 가장 분명하게 드러냅니다.
- source_word: ὁ λογισμός
  english_pob_choice: reason
  chosen_korean: 이성
  alternatives_korean:
  - 분별
  - 이성적 판단
  - 사유
  lexicon: LSJ
  rationale: 4 마카베오서는 λογισμός를 인간의 합리적 판단 능력으로 핵심적으로 사용하므로, 간결하고 철학적 맥락에 맞는 ‘이성’이 적절합니다.
- source_word: κενοδοξίας
  english_pob_choice: empty glory
  chosen_korean: 빈 영광
  alternatives_korean:
  - 헛된 영광
  - 허영
  - 헛된 명예
  lexicon: LSJ
  rationale: 직역에 가까운 ‘빈 영광’이 영어 본문의 ‘empty glory’를 그대로 반영하면서도, 전통적 교회어 ‘허영’보다 원어의 이미지가 더 분명합니다.
