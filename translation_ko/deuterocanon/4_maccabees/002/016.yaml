  text: For prudent reason drives away all these vicious passions[a], just as it also drives away anger; for it is master even over this.
  footnotes:
  - marker: a
    text: Or 'the self-controlled mind' for 'prudent reason.' The Greek phrase ὁ σώφρων νοῦς combines the ideas of rational faculty and disciplined self-mastery.
    reason: lexical_alternative
translation:
  language: ko
  text: 절제하는 이성은 이 모든 악한 정념을 물리치며, 분노도 물리칩니다. 왜냐하면 이성은 분노도 다스리기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 ὁ σώφρων νοῦς는 ‘절제하는 이성’ 외에 ‘자기 절제하는 마음’으로도 옮길 수 있습니다. 이 표현은 이성적 기능과 절제·자기 통제의 성품을 함께 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
