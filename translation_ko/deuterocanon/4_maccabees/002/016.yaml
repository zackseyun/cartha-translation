  source_fidelity: 수정이 필요합니다. 초안은 ὁ σώφρων νοῦς와 ἀπωθεῖται의 기본 의미를 대체로 반영하지만, ‘분노도 그렇게 합니다’는 분노가 행위의 주체인 것처럼 읽혀 원문의 생략된 동사(‘[이성이] 분노도 물리친다’)를 잘못 처리합니다. 또한 ‘그분조차’는 무생물·추상 명사인 θυμός를 인칭으로 지시하고 ‘even/also’의 대상도 불명확하게 하므로 원문에 맞지 않습니다.
  naturalness: ‘사실 모든 이러한’은 현대 한국어에서 부자연스럽고, ‘절제 있는 이성’보다 ‘절제하는 이성’이 간결하고 자연스럽습니다. ‘정념’은 이 문맥의 철학적·윤리적 πάθη를 정확히 나타내며, 필요한 경우 각주에서 대안 표현을 제시할 수 있습니다.
  terminology: πάθη는 단순한 일반 감정이나 정서보다 통제되어야 할 정서적 충동을 뜻하므로 ‘정념’이 적합합니다. κακόηθη는 ‘악한’으로, δεσπόζει는 ‘다스리다’로 옮겨 강한 통제 관계를 유지했습니다. ὁ σώφρων νοῦς는 ‘절제하는 이성’으로 번역하여 이성과 자기 절제의 뜻을 함께 보존했습니다.
