translation:
  language: ko
  text: 사실 모든 이러한 악한 정서들을 절제 있는 이성은 몰아냅니다. 분노도 그렇게 합니다. 사실 이성은 그분조차 다스립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 ὁ σώφρων νοῦς는 ‘절제 있는 이성’보다 넓게 ‘자기 절제하는 마음’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κακόηθη πάθη
  english_pob_choice: vicious passions
  chosen_korean: 악한 정서들
  alternatives_korean:
  - 악질적인 정욕들
  - 비뚤어진 감정들
  - 해로운 열정들
  lexicon: LSJ
  rationale: πάθη는 이 문맥에서 단순한 ‘고통’이 아니라 통제되지 않은 정서적 충동을 가리키므로, 자연스러운 현대 한국어인 ‘정서들’로 옮기되 κακόηθη의 도덕적 악성은 ‘악한’으로 살렸습니다.
- source_word: ὁ σώφρων νοῦς
  english_pob_choice: prudent reason
  chosen_korean: 절제 있는 이성
  alternatives_korean:
  - 신중한 이성
  - 자기 절제하는 마음
  - 절제된 마음
  lexicon: LSJ
  rationale: νοῦς의 지적·이성적 기능을 ‘이성’으로 살리고, σώφρων의 절제·자제 의미를 ‘절제 있는’으로 반영해 POB의 ‘prudent reason’과 대응시켰습니다.
- source_word: ἀπωθεῖται
  english_pob_choice: drives away
  chosen_korean: 몰아냅니다
  alternatives_korean:
  - 물리쳐 버립니다
  - 밀어냅니다
  - 쫓아냅니다
  lexicon: LSJ
  rationale: 능동적으로 내쫓고 배격하는 의미를 자연스럽게 드러내는 한국어로 ‘몰아냅니다’를 택했습니다.
- source_word: δεσπόζει
  english_pob_choice: is master even over this
  chosen_korean: 다스립니다
  alternatives_korean:
  - 주권을 행사합니다
  - 주인으로 군림합니다
  - 지배합니다
  lexicon: LSJ
  rationale: δεσπόζει의 지배·통치 의미를 과장된 어감 없이 살리면서, 본문이 말하는 이성의 통제력을 한국어로 분명하게 전달했습니다.
theological_decisions:
- issue: ἀπωθεῖται와 δεσπόζει가 함께 그리는 이성의 통제력
  chosen_reading: 이성은 정서와 분노를 적극적으로 밀어내며, 그 위에 군림하는 통제 권한까지 가진 것으로 번역했습니다.
  alternative_readings:
  - 단순히 감정을 억제한다
  - 분노를 참아낸다
  rationale: 본문은 소극적 억제보다 적극적 배격과 지배를 말하므로, ‘몰아냅니다’와 ‘다스립니다’로 힘의 관계를 분명히 했습니다.
  doctrine_reference: '4 Maccabees의 윤리철학적 인식론: 훈련된 이성이 정서 위에 서는 구조를 보존합니다.'
