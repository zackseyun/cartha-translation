base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/008.yaml
  text: Therefore[a], even if someone is money-loving, by living under the law he compels his own way of life, lending to those in need without interest, and when the seventh year arrives[b], canceling the debt.
  footnotes:
  - marker: a
    text: Literally, 'when the sevens/weeks arrive,' an allusion to the law's cycle of debt release in the seventh year.
    reason: cross_reference
  - marker: b
    text: Or 'suffering loss on the loan'; the Greek participle can emphasize bearing the financial loss involved in remitting the debt.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 비록 어떤 사람이 돈을 사랑하더라도, 율법에 따라 살아가면서 자기의 방식을 억누르고, 도움이 필요한 이들에게 이자 없이 빌려 주며, 일곱째 해가 오면[a] 빚을 탕감합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘일곱들’ 또는 ‘주간들’이 도래할 때에 가깝습니다. 여기서는 율법에 규정된 일곱째 해의 채무 면제 주기를 가리킵니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘그 대출로 인한 손실을 감수하며’로 옮길 수 있습니다. 그리스어 분사는 탕감에 따르는 재정적 손실을 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτίκα γοῦν
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
