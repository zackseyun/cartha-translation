  text: Therefore[a], even if someone is money-loving, by living under the law he compels his own way of life, lending to those in need without interest, and when the seventh year arrives[b], canceling the debt.
  footnotes:
  - marker: a
    text: Literally, 'when the sevens/weeks arrive,' an allusion to the law's cycle of debt release in the seventh year.
    reason: cross_reference
  - marker: b
    text: Or 'suffering loss on the loan'; the Greek participle can emphasize bearing the financial loss involved in remitting the debt.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로[a] 비록 어떤 사람이 돈을 사랑하더라도, 율법에 따라 살아가면 자기의 방식을 억누르게 되어, 필요로 하는 사람들에게 이자 없이 빌려주고, 일곱째 해가 오면[b] 빚을 탕감합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘일곱들이/주간들이 도래할 때’에 가깝지만, 여기서는 빚 탕감의 안식년 순환을 가리키는 말입니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘그 대출에서 손해를 감수하며’라는 뜻일 수 있습니다. 그리스어 분사는 탕감을 통해 발생하는 재정적 손실을 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτίκα γοῦν
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이에
  - 그리하여
  - 그러니
  lexicon: LSJ
  rationale: 논리적 귀결을 나타내는 연결어이므로, 현대 한국어에서 가장 자연스럽게 인과를 표시하는 ‘그러므로’로 옮겼습니다.
- source_word: τῷ νόμῳ πολιτευόμενος
  english_pob_choice: by living under the law
  chosen_korean: 율법에 따라 살아가면
  alternatives_korean:
  - 율법 아래서 살아가면
  - 율법으로 자신의 삶을 다스리면
  - 율법에 따라 행실을 세우면
  lexicon: LSJ
  rationale: πολιτεύομαι의 ‘삶의 방식/시민적 행실’ 의미를 살려, 법 아래의 추상적 상태보다 실제 삶의 규범을 따른다는 뜻이 드러나도록 옮겼습니다.
- source_word: βιάζεται τὸν ἑαυτοῦ τρόπον
  english_pob_choice: he compels his own way of life
  chosen_korean: 자기의 방식을 억누르게 되어
  alternatives_korean:
  - 자기의 성향을 강제로 다스리게 되어
  - 자기의 삶의 방식을 굴복시키게 되어
  - 자기의 습관을 억제하게 되어
  lexicon: LSJ
  rationale: βιάζομαι의 강한 ‘강제/억제’ 의미를 살리되, 한국어에서는 ‘억누르다’가 자기 욕구를 제어하는 뉘앙스를 가장 자연스럽게 전달합니다.
- source_word: τῶν ἑβδομάδων ἐνστασῶν χρεοκοπούμενος
  english_pob_choice: when the seventh year arrives, canceling the debt
  chosen_korean: 일곱째 해가 오면 빚을 탕감합니다
  alternatives_korean:
  - 칠년째 때가 오면 빚을 면제합니다
  - 안식년이 오면 빚을 탕감합니다
  - 일곱이 차면 빚을 탕감합니다
  lexicon: LSJ
  rationale: 문맥상 율법의 안식년 부채 탕감 규정을 가리키므로, 영어 POB의 해석을 따라 의미를 분명히 하되 ‘탕감하다’로 법적 해제를 표현했습니다.
