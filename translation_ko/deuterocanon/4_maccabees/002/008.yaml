  lexicon: LSJ
  rationale: πολιτεύομαι의 ‘삶의 방식/시민적 행실’ 의미를 살려, 법 아래의 추상적 상태보다 실제 삶의 규범을 따른다는 뜻이 드러나도록 옮겼습니다.
- source_word: βιάζεται τὸν ἑαυτοῦ τρόπον
  english_pob_choice: he compels his own way of life
  chosen_korean: 자기의 방식을 억누르게 되어
  alternatives_korean:
  - 자기의 성향을 강제로 다스리게 되어
