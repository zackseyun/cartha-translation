    rationale: ἀκμάζων은 πρὸς συνουσιασμόν에 관하여 신체적으로 한창임, 곧 성적 결합을 할 수 있는 전성기를 뜻합니다. 수정문은 이 관계를 자연스럽게 명시합니다.
