  text: For while he was still young and in the prime of life for sexual union[a], he nullified by reason the sting of the passions.
  footnotes:
  - marker: a
    text: Or 'the goad of the passions' or 'the frenzy of the passions.' The Greek metaphor in οἶστρον can suggest a sharp incitement or driving impulse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 아직 젊고 성적 결합에 알맞게 한창이었으나, 이성으로 정욕의 충동을 무력화했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정욕의 고삐’ 또는 ‘정욕의 광분’으로도 옮길 수 있습니다. ελλην어 οἶστρον의 비유는 날카로운 자극이나 몰아붙이는 충동을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: νέος ... ὢν καὶ ἀκμάζων
  english_pob_choice: while he was still young and in the prime of life
  chosen_korean: 아직 젊고 … 한창이었으나
  alternatives_korean:
  - 젊은 나이였고 기운이 한창이었으나
  - 아직 젊고 활력이 절정이었으나
  lexicon: LSJ
  rationale: νέος와 ἀκμάζων의 결합은 단순한 나이뿐 아니라 신체적 전성기를 가리키므로, 한국어에서는 자연스럽게 ‘젊고 한창’으로 압축해 살렸습니다.
- source_word: πρὸς συνουσιασμόν
  english_pob_choice: for sexual union
  chosen_korean: 성적 결합에 알맞게
  alternatives_korean:
  - 성적 결합을 위해
  - 성교에 적합하게
  - 성적 교제에
  lexicon: LSJ
  rationale: 문맥상 단순한 동거가 아니라 성적 능력/적합성을 말하므로, 직설적이되 과도하게 의학적이지 않은 표현으로 옮겼습니다.
- source_word: ἠκύρωσεν
  english_pob_choice: he nullified
  chosen_korean: 무력화했습니다
  alternatives_korean:
  - 무효화했습니다
  - 소멸시켰습니다
  - 효력을 없앴습니다
  lexicon: LSJ
  rationale: ἀκυρόω 계열의 핵심은 ‘효력을 없애다’이므로, 여기서는 이유를 통해 정욕의 작동을 제압한다는 뜻이 드러나는 ‘무력화했습니다’를 택했습니다.
- source_word: τῷ λογισμῷ
  english_pob_choice: by reason
  chosen_korean: 이성으로
  alternatives_korean:
  - 이성으로써
  - 이성의 판단으로
  - 사유로
  lexicon: LSJ
  rationale: 4 마카베오스의 핵심 대립축인 λόγισμος를 한국어 독자가 바로 이해할 수 있게 ‘이성’으로 옮기되, 문장 전체의 흐름은 간결하게 유지했습니다.
- source_word: οἶστρον τῶν παθῶν
  english_pob_choice: the sting of the passions
  chosen_korean: 정욕의 충동
  alternatives_korean:
  - 정욕의 독침
  - 격정의 쏘는 자극
  - 정욕의 고삐 풀린 충동
  lexicon: LSJ
  rationale: οἶστρον의 비유는 벌레의 쏘는 자극이나 몰아붙이는 충동을 가리키므로, 한국어에서는 이미지와 의미를 함께 살리는 ‘충동’으로 옮겼습니다.
theological_decisions:
- issue: 4 마카베오스 2:3의 핵심 윤리 개념인 λόγισμος와 πάθη의 대비를 어떻게 한국어로 드러낼지
  chosen_reading: ‘이성’이 정욕의 충동을 무력화한다는 대비로 제시했습니다.
  alternative_readings:
  - ‘이성적 판단’이 정욕의 고삐 풀린 충동을 제압한다
  - ‘사유’가 열정의 자극을 꺾었다
  rationale: 이 본문은 지혜문학적·윤리철학적 문맥에서 이성이 정욕을 다스린다는 주제를 전면에 두므로, 독자가 즉시 대비를 파악할 수 있는 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy, points 1 and 6
