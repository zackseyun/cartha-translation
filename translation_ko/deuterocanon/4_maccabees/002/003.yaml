  source_fidelity: 그리스어의 핵심 구조와 의미는 대체로 반영되어 있습니다. 그러나 ‘성적 결합에 알맞게 한창이었으나’는 ἀκμάζων πρὸς συνουσιασμόν의 ‘성적 결합을 할 수 있는 전성기/한창인 때’라는 뜻을 한국어로 부자연스럽게 전달합니다. οἶστρον의 자극적 비유도 본문에서 더 분명히 드러내는 것이 좋습니다.
  naturalness: ‘성적 결합에 알맞게 한창’은 현대 표준 한국어에서 결합 관계가 어색합니다. ‘성적 결합을 할 수 있는 한창의 나이’로 고치면 의미와 문체가 모두 자연스럽습니다. ‘정욕의 자극’은 고전적 윤리·철학 문맥에도 맞으면서 자연스럽습니다.
  terminology: λόγισμος를 ‘이성’으로, πάθη를 ‘정욕’으로 옮긴 것은 이 책의 이성과 정념의 대립을 잘 보존합니다. οἶστρον은 ‘자극’으로 옮기고 각주에서 ‘독침’과 ‘몰아붙이는 충동’의 비유를 밝혀 어휘의 폭을 보존합니다. 각주의 ‘ελλην어’는 ‘그리스어’로 바로잡아야 합니다.
