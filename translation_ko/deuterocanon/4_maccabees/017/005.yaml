  naturalness: ‘별들처럼 같은 값어치의’는 현대 표준 한국어에서 부자연스럽고, 사람의 존엄을 가격·가치로 표현하는 듯한 부적절한 뉘앙스를 냅니다. 비교 구문을 ‘달이 … 서 있는 것보다’로 명료하게 제시하고, 수식 관계를 정리한 문장이 합쇼체 문체에서 자연스럽습니다.
