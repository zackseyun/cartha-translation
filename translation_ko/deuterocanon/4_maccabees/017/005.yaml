base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/017/005.yaml
  text: Not so does the moon stand in majesty in heaven with the stars[a], as you, having guided your seven sons, equal to the stars, toward godliness[b], have come to stand honored before God and have been established in heaven with them.
  footnotes:
  - marker: a
    text: Or 'having enlightened your seven sons, equal to the stars, toward piety.' The participle φωταγωγήσασα can be rendered more explicitly as 'having enlightened' or 'having led to the light.'
    reason: lexical_alternative
  - marker: b
    text: The final phrase may also be understood more literally as 'have been established in the sky with them,' but in context it likely refers to heavenly honor with her sons.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 달이 하늘에서 별들과 함께 위엄 있게 서 있는 것만은 아닙니다. 오히려 당신은 별들처럼 같은 값어치의 일곱 아들을 경건함으로 이끌어, 하나님 앞에서 존귀하게 서게 되었고, 그들과 함께 하늘에 세워졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘별들처럼 같은 값어치의’는 ἰσαστέρους의 문자적 ‘별과 동등한’ 뉘앙스를 살린 번역입니다.
    reason: source_note
lexical_decisions:
- source_word: σελήνη ... σὺν ἄστροις σεμνὴ καθεστήκεν
  english_pob_choice: the moon stands in majesty in heaven with the stars
  chosen_korean: 달이 하늘에서 별들과 함께 위엄 있게 서 있는 것
  alternatives_korean:
  - 달이 별들과 함께 장엄하게 서 있는 것
  - 달이 하늘의 별들과 함께 존귀하게 서 있는 것
  lexicon: LSJ
  rationale: σελήνη와 ἄστροις의 천체 이미지를 그대로 살리고, σεμνὴ는 한국어의 ‘위엄 있게’로 옮겨 달과 별의 장엄한 대비를 자연스럽게 드러냈습니다.
- source_word: ἰσαστέρους ἑπτὰ παῖδας
  english_pob_choice: your seven sons, equal to the stars
  chosen_korean: 별들처럼 같은 값어치의 일곱 아들
  alternatives_korean:
  - 별과 같은 일곱 아들
  - 별들에 견줄 만한 일곱 아들
  lexicon: LSJ
  rationale: ἰσαστέρους의 ‘별과 동등함’을 단순 비유로 약화시키지 않기 위해 ‘같은 값어치의’로 옮겼고, παῖδας는 문맥상 남성 자녀이므로 ‘아들’이 정확합니다.
- source_word: φωταγωγήσασα πρὸς τὴν εὐσέβειαν
  english_pob_choice: having guided ... toward godliness
  chosen_korean: 경건함으로 이끌어
  alternatives_korean:
  - 빛으로 인도하여
  - 경건으로 이끄신
  lexicon: LSJ
  rationale: φωταγωγήσασα는 문자적으로 빛으로 데려간다는 뜻을 담지만, 문맥상 아들들을 경건으로 이끈 행위를 가리키므로 ‘경건함으로 이끌어’로 압축해 빛의 이미지는 앞뒤 천체 비유가 유지하도록 두었습니다.
- source_word: ἔντιμος καθεστήκας θεῷ ... ἐστήρισαι
  english_pob_choice: have come to stand honored before God ... have been established in heaven with them
  chosen_korean: 하나님 앞에서 존귀하게 서게 되었고, 그들과 함께 하늘에 세워졌습니다
  alternatives_korean:
  - 하나님 앞에서 존귀하게 되셨고, 그들과 함께 하늘에 굳게 서게 되었습니다
  - 하나님께 귀히 여김을 받아 그들과 함께 하늘에 정착하셨습니다
  lexicon: LSJ
  rationale: ἔντιμος는 ‘존귀하게/존귀한 위치에’의 의미를 담고, καθεστήκας·ἐστήρισαι는 ‘서다/세워지다’의 상태를 살려 종결했습니다. 후자의 οὐρανῷ는 최종 보상 문맥상 ‘하늘’이 자연스럽습니다.
theological_decisions:
- issue: 마지막 οὐρανῷ의 의미를 ‘하늘’로 둘지 ‘하늘 나라/천상’으로 풀지
  chosen_reading: 그들과 함께 하늘에 세워졌습니다
  alternative_readings:
  - 그들과 함께 천상에 세워졌습니다
  - 그들과 함께 하늘 나라에 세워졌습니다
  rationale: 이 절은 앞부분의 문자적 천체 비교에서 끝부분의 영예 선포로 이동하므로, 공간적 이미지와 종말론적 높임을 함께 살리는 ‘하늘’이 가장 무리 없습니다. 문맥이 천상적 보상을 가리키지만, 본문이 그 의미를 과잉 해설하지 않도록 유지했습니다.
  doctrine_reference: 문맥에 따른 의미 범위 보존
