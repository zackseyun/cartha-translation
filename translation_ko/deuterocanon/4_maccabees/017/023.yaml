  lexicon: LSJ
  rationale: 그리스어의 성별이 드러나는 뉘앙스를 한국어로도 살리기 위해 단순한 ‘용기’보다 ‘남성적 용기’로 옮겼습니다. ‘남자다움’은 현대 한국어에서 평가적·문화적 뉘앙스가 강해 문맥상 덜 적합합니다.
