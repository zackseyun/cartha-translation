  text: For when the tyrant Antiochus saw their courage and virtue and their endurance in tortures[a], he proclaimed their endurance as an example to his soldiers.
  footnotes:
  - marker: a
    text: Or 'courage' or 'bravery' for 'manliness' (ἀνδρίαν). The Greek term is explicitly gendered and refers to manly courage or fortitude.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 폭군 안티오코스는 그들의 남성적 용기와 덕성과, 고문 속에서의 인내를 보고, 자기 군사들에게 그들의 인내를 본보기로 선포했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘남성적 용기’는 ἀνδρίαν의 성별화된 뉘앙스를 살린 번역입니다. 단순히 ‘용기’로도 옮길 수 있습니다.
    reason: lexical_alternative
