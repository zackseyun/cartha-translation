  text: 이는 폭군 안티오코스가 그들의 남성적 용기와 덕성, 그리고 고문 가운데서 보인 인내를 보고, 그들의 인내를 자기 병사들에게 본보기로 선포했기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘남성적 용기’는 ἀνδρίαν의 성별화된 뉘앙스를 살린 번역입니다. 단순히 ‘용기’로도 옮길 수 있습니다.
    reason: lexical_alternative
