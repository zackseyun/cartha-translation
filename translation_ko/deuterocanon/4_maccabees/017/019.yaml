    rationale: 각주는 ‘하나님으로 말미암아’ 직후에 두어 διά + 속격에 대한 설명임을 직접 표시하는 것이 좋습니다.
  revised_text: 그러므로 이들도 하나님으로 말미암아[a] 거룩하게 되어, 이 영예뿐 아니라 그들 때문에 우리 민족이 원수들을 이기지 못한 일로도 영예를 받았습니다.
  revised_footnotes:
