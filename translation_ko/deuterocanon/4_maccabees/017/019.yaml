translation:
  language: ko
  text: 이렇게 이 사람들도 하나님으로 말미암아 거룩하게 되어 이 영예를 받았으니, 곧 이 영예뿐만 아니라 그들로 말미암아 우리 민족이 원수들에게 굴복하지 않게 된 일로도 그렇습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하나님으로 말미암아’는 διά + 속격의 의미를 살린 번역이며, 문맥상 ‘하나님에 의해’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁγιασθέντες
  english_pob_choice: having been made holy
  chosen_korean: 거룩하게 되어
  alternatives_korean:
  - 성별되어
  - 성화되어
  - 거룩하게 되셨으니
  lexicon: BDAG
  rationale: 수동 분사의 결과 상태를 자연스럽게 살리면서, 문맥상 순교자들의 거룩한 상태를 현대 한국어로 분명하게 드러내기 위해 ‘거룩하게 되어’를 택했습니다.
- source_word: διὰ θεοῦ
  english_pob_choice: through God
  chosen_korean: 하나님으로 말미암아
  alternatives_korean:
  - 하나님을 통하여
  - 하나님에 의해
  - 하나님으로
  lexicon: BDAG
  rationale: διά + 속격의 매개/원인 의미를 살리기 위해 ‘말미암아’를 사용했습니다. ‘에 의해’보다 문맥상 더 자연스럽고, POB의 ‘through God’가 가진 중개성을 유지합니다.
- source_word: τετίμηνται / ταύτῃ τῇ τιμῇ
  english_pob_choice: have been honored / with this honor
  chosen_korean: 이 영예를 받았으니 / 이 영예뿐만 아니라
  alternatives_korean:
  - 이 존귀를 받았으니
  - 이 명예를 받았을 뿐 아니라
  - 이 존귀뿐만 아니라
  lexicon: BDAG
  rationale: τιμή 계열의 반복을 살리되 한국어에서는 ‘영예’가 가장 직접적으로 대응합니다. 동사와 명사를 각각 ‘받다’와 ‘영예’로 옮겨 수동성과 결과 상태를 함께 드러냈습니다.
- source_word: τὸ ἔθνος ἡμῶν
  english_pob_choice: our nation
  chosen_korean: 우리 민족
  alternatives_korean:
  - 우리 나라
  - 우리 백성
  - 우리 민족 공동체
  lexicon: BDAG
  rationale: ἔθνος의 집단적·민족적 의미를 반영하여 ‘민족’으로 옮겼습니다. 이 책의 유대 공동체 맥락에서 ‘백성’도 가능하지만, 원문의 정치·민족적 뉘앙스를 더 분명히 드러냅니다.
- source_word: μὴ ἐπικρατῆσαι
  english_pob_choice: did not let the enemies prevail
  chosen_korean: 원수들에게 굴복하지 않게 된
  alternatives_korean:
  - 원수들이 이기지 못하게 된
  - 원수들이 우세하지 못하게 된
  - 원수들이 세력을 잡지 못하게 된
  lexicon: BDAG
  rationale: ἐπικρατέω의 ‘우세하다/이기다/지배하다’ 뜻을 한국어에서 자연스럽게 풀어 ‘굴복하지 않게 되다’로 옮겼습니다. 인과절 전체의 의미를 살리면서도 지나치게 전투적이거나 관용적인 표현으로 흐르지 않게 했습니다.
theological_decisions:
- issue: διά + 속격의 신적 중개 표현
  chosen_reading: ‘하나님으로 말미암아’로 옮겨, 하나님이 거룩하게 하시는 근원적 원인임을 드러냈습니다.
  alternative_readings:
  - ‘하나님에 의해’로 더 직접적으로 옮길 수 있음
  - ‘하나님을 통하여’로 중개성을 더 강조할 수 있음
  rationale: 원문은 단순한 수동 주어 표시가 아니라 하나님을 통한 원인/매개를 암시합니다. 한국어에서는 ‘말미암아’가 이 긴장을 가장 잘 보존합니다.
  doctrine_reference: 원문 우선 원칙; 번역 전통보다 헬라어 전치사 의미 보존
- issue: 순교자들의 영예와 민족 보전의 관계
  chosen_reading: 이 절은 순교자들의 거룩함과 그들을 통한 민족의 보존을 함께 한 문장 안에서 연결합니다.
  alternative_readings:
  - 순전히 윤리적 칭찬으로만 읽을 수 있음
  - 기적적 구원 서술로만 제한할 수 있음
  rationale: 원문은 순교자들의 상태와 민족적 결과를 병렬적으로 제시합니다. 둘 중 하나로 축소하지 않고, 두 진술을 함께 유지했습니다.
  doctrine_reference: 문맥의 긴장 보존; 의미 과잉 해석 금지
