    text: ‘하나님으로 말미암아’는 διά와 속격의 의미를 살린 번역이며, 문맥상 ‘하나님에 의해’로도 옮길 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 영어 POB의 ‘적들이 이기지 못했다’라는 해석은 따르지 않고, 제시된 헬라어의 주어·대상 관계를 우선하여 ‘우리 민족이 원수들을 이기지 못했다’로 고쳤습니다. 문맥상 어려운 표현을 조화시키기 위해 의미를 반전하거나 보충하지 않았습니다. 또한 영예의 두 근거를 한국어 문장에서 명료하게 병렬로 표현하고 각주 앵커를 해당 전치사구로 옮겼습니다.
