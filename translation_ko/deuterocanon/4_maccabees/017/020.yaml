lexical_decisions:
- source_word: τύραννον
  english_pob_choice: the tyrant
  chosen_korean: 폭군
  alternatives_korean:
  - 그 폭군
  - 전제자
  lexicon: LSJ
  rationale: τύραννος는 단순한 통치자보다 압제적이고 부정적으로 평가된 지배자를 가리키므로, 한국어에서도 평가적 뉘앙스를 살리는 ‘폭군’이 가장 가깝습니다.
- source_word: τιμωρηθῆναι
  english_pob_choice: should be punished
  chosen_korean: 벌을 받다
  alternatives_korean:
  - 징벌을 받다
  - 응징되다
  lexicon: LSJ
  rationale: 수동 부정사로서 폭군이 처벌의 대상이 된다는 뜻을 담고 있으므로, ‘벌을 받다’가 문맥상 자연스럽고 재판적·보응적 의미를 무리 없이 보존합니다.
- source_word: πατρίδα
  english_pob_choice: the homeland
  chosen_korean: 조국
  alternatives_korean:
  - 고향 땅
  - 본토
  lexicon: LSJ
  rationale: πατρίς는 출생지·조상들의 땅이라는 애국적 함의를 지니므로, 현대 한국어에서 그 정서와 공적 의미를 함께 살리는 ‘조국’이 적절합니다.
- source_word: καθαρισθῆναι
  english_pob_choice: should be purified
  chosen_korean: 정결하게 되다
  alternatives_korean:
  - 깨끗하게 되다
  - 정화되다
  lexicon: LSJ
  rationale: καθαρίζω는 의례적·도덕적·민족적 정화 모두를 열어 두므로, 종교적 울림을 유지하면서도 의미를 좁히지 않는 ‘정결하게 되다’로 옮겼습니다.
theological_decisions:
- issue: 나라/민족의 정화 의미 범위
  chosen_reading: ‘정결하게 되다’로 옮겨 의례적 정화, 도덕적 정화, 민족적 회복의 가능성을 함께 열어 둡니다.
  alternative_readings:
  - ‘깨끗하게 되다’로 단순화
  - ‘오염에서 씻기다’로 구체화
  rationale: 4 마카베오서는 순교와 속죄의 문맥에서 정화 언어를 사용하므로, 의미를 하나로 고정하지 않고 본문의 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
