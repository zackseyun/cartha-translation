  - marker: b
    text: Literally, 'live the blessed age'; this likely refers to a blessed eternal state.
    reason: lexical_alternative
translation:
  language: ko
  text: 참으로 그 폭군 자신과 그들의 의회 전체는 그들의 인내를 보고 놀랐습니다. 그 인내 때문에 그들은 지금 하나님의 보좌 곁에 서 있으며[a], 복된 시대를 살고 있습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어의 완료형과 여격 구문은 보좌 ‘곁에’ 서 있는 상태를 나타내며, ‘보좌 앞에’ 또는 ‘보좌 면전에’ 서 있는 것으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘복된 시대를 살고 있습니다’입니다. 문맥상 복된 영원한 상태를 가리키는 표현으로 이해될 수 있습니다.
    reason: lexical_alternative
