  source_fidelity: ‘회중’은 συνέδριον이 가리키는 통치자의 협의·심의 기구와 맞지 않으므로 ‘의회’ 또는 ‘회의’로 고쳐야 합니다. 또한 θείῳ는 직역상 ‘신적인’이지만 이 문맥의 보좌는 하나님께 속한 보좌를 가리키므로 ‘하나님의 보좌’는 자연스럽고 의미상 안전합니다. παρεστήκασιν은 완료형이 나타내는 현재의 상태를 살려 ‘서 있습니다’로 옮기되, 위치 관계는 ‘곁에’로 본문에 유지하고 ‘앞에’의 가능성은 주석에 남기는 것이 원문의 여지를 보존합니다.
  naturalness: ‘그들의 온 회중’은 현대 한국어에서 종교 공동체를 연상시키며 통치 기구의 뜻도 불분명합니다. ‘그들의 의회 전체’가 더 자연스럽고 정확합니다. 각주 표지는 해당 표현 바로 뒤에 배치해야 독자가 주석의 대상을 분명히 알 수 있습니다.
