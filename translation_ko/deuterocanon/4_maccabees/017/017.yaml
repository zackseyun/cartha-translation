  text: Indeed, the tyrant himself and all their council marveled at their endurance, because of which they now stand beside the divine throne and live the blessed age.
  footnotes:
  - marker: a
    text: Or 'stand before the divine throne.' The Greek verb and dative phrase can be understood as attendance in the presence of the throne or close station beside it.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'live the blessed age'; this likely refers to a blessed eternal state.
    reason: lexical_alternative
translation:
  language: ko
  text: 참으로 그 폭군 자신과 그들의 온 회중은 그들의 인내를 보고 놀랐습니다. 그 인내 때문에 그들은 지금 하나님의 보좌 앞에 서 있으며, 복된 시대를 살고 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘복된 시대를 살고 있습니다’이며, 문맥상 복된 영원한 상태를 가리키는 표현으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어의 완료형과 여격 구문은 보좌 ‘앞에/면전에’ 서 있는 존귀한 대기 상태로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτός γέ τοι
  english_pob_choice: Indeed, ... himself
  chosen_korean: 참으로 ... 자신
  alternatives_korean:
  - 정녕 ... 자신
  - 실로 ... 자신
  lexicon: LSJ
  rationale: 강조를 나타내는 입자 묶음의 힘을 자연스러운 한국어로 살려, 문두에는 ‘참으로’를 두고 ‘자신’을 더해 폭군 개인을 강조했습니다.
- source_word: ὁ τύραννος
  english_pob_choice: the tyrant
  chosen_korean: 그 폭군
  alternatives_korean:
  - 그 통치자
  - 그 왕
  lexicon: LSJ
  rationale: 중립적 호칭보다 적대적 평가가 분명한 ‘폭군’이 문맥에 맞으며, 본문의 비판적 어조를 유지합니다.
- source_word: συνέδριον
  english_pob_choice: council
  chosen_korean: 회중
  alternatives_korean:
  - 의회
  - 공의회
  lexicon: LSJ
  rationale: 정치적 정식 기관명으로 확정하기보다, 폭군과 함께 있던 집단이라는 넓은 의미를 살려 ‘회중’으로 옮겼습니다.
- source_word: παρεστήκασιν
  english_pob_choice: stand beside
  chosen_korean: 보좌 앞에 서 있으며
  alternatives_korean:
  - 보좌 곁에 서 있으며
  - 보좌 앞에 서 있습니다
  lexicon: LSJ
  rationale: 완료형이 나타내는 현재의 서 있는 상태를 살리면서, 문맥상 존귀한 면전/접근의 뉘앙스를 한국어 관용에 맞게 표현했습니다.
- source_word: τὸν μακάριον βιοῦσιν αἰῶνα
  english_pob_choice: live the blessed age
  chosen_korean: 복된 시대를 살고 있습니다
  alternatives_korean:
  - 복된 세기를 살고 있습니다
  - 복된 영원을 누리고 있습니다
  lexicon: LSJ
  rationale: 직역의 ‘시대/세기’와 문맥의 복된 최종 상태 사이의 긴장을 유지하기 위해 ‘복된 시대’를 택했고, ‘살고 있습니다’로 현재성을 살렸습니다.
theological_decisions:
- issue: 죽은 자들의 현재적 보상 묘사
  chosen_reading: 그들은 지금 하나님의 보좌 앞에 서 있으며, 복된 시대를 살고 있다고 현재형으로 묘사합니다.
  alternative_readings:
  - 미래의 보상에 대한 예고로 완화할 수 있습니다
  - ‘영원한 복’으로 신학적으로 정리할 수 있습니다
  rationale: 그리스어 현재형과 서술의 직설성을 보존해, 본문이 제시하는 현재적 영광의 이미지를 교리적으로 과도하게 정리하지 않았습니다.
  doctrine_reference: 본문의 종말론적 이미지와 현재 서술을 그대로 유지
