translation:
  language: ko
  text: 참으로 이 말들까지도 그의 바로 그 비문에 새겨, 그 민족에게 기념으로 전하는 것이 마땅하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 비문 자체에’. 그리스어 ἐπιτάφιον은 장례 비문이나 그 비문이 새겨진 기념물을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄξιον ἦν
  english_pob_choice: it would indeed have been fitting
  chosen_korean: 마땅하였습니다
  alternatives_korean:
  - 합당하였습니다
  - 옳았습니다
  lexicon: LSJ
  rationale: 비인칭적 평가를 자연스러운 한국어로 옮기되, 단순한 과거 사실보다 ‘그렇게 하는 것이 적절했음’을 드러내기 위해 ‘마땅하였습니다’를 택했습니다.
- source_word: ἐπὶ αὐτοῦ τοῦ ἐπιταφίου
  english_pob_choice: on his very tombstone
  chosen_korean: 그의 바로 그 비문에
  alternatives_korean:
  - 그의 바로 그 묘비에
  - 그의 장례 비문 자체에
  lexicon: LSJ
  rationale: ἐπιτάφιον은 장례용 비문이나 그 비문이 새겨진 기념물까지 가리킬 수 있어, 새기다(ἀναγράψαι)와의 결합을 살려 ‘비문’으로 넓게 옮겼습니다.
- source_word: καὶ ταῦτα
  english_pob_choice: even these words
  chosen_korean: 이 말들까지도
  alternatives_korean:
  - 이것들까지도
  - 이 말들도
  lexicon: LSJ
  rationale: 앞뒤 문맥에서 기념문구를 가리키므로, 한국어에서는 ‘말들’로 분명히 하되 강조의 καὶ를 ‘까지도’로 반영했습니다.
- source_word: τοῖς ἀπὸ τοῦ ἔθνους
  english_pob_choice: for those of the nation
  chosen_korean: 그 민족에게
  alternatives_korean:
  - 그 나라의 사람들에게
  - 그 백성에게
  lexicon: LSJ
  rationale: 4 Maccabees에서 ἔθνος은 유대 민족을 가리키는 집합명사로 쓰이므로, 수신 대상을 자연스럽게 드러내는 ‘그 민족에게’로 옮겼습니다.
- source_word: εἰς μνείαν λεγόμενα
  english_pob_choice: spoken as a memorial
  chosen_korean: 기념으로 전하는
  alternatives_korean:
  - 기념으로 말하는
  - 기억을 위한 것으로 말하는
  lexicon: LSJ
  rationale: εἰς μνείαν의 목적성을 살리고, λεγόμενα의 ‘말해지는/전해지는’ 뉘앙스를 한국어의 현재적 전승 표현으로 압축했습니다.
theological_decisions:
- issue: 장례 기념물 표현의 구체성
  chosen_reading: ἐπιτάφιον을 ‘비문’으로, 새기다(ἀναγράψαι)와 결합되는 장례 기념문구로 이해했습니다.
  alternative_readings:
  - ‘묘비’로 좁혀 이해
  - ‘묘비문’으로 직역
  rationale: 본문은 단순한 돌 자체보다 새겨질 텍스트와 그 기념 기능을 강조하므로, 물리적 기념물과 글자를 함께 포괄하는 표현이 더 안전합니다.
  doctrine_reference: 문맥 해석/표현의 정확성
