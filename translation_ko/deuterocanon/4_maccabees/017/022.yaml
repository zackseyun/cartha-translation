  source_fidelity: ‘화목제물 같은 죽음’은 ἱλαστηρίου θανάτου에 원문에 없는 비교 표현(‘같은’)을 더하고, 죽음 자체를 제물에 비유하는 듯한 의미가 됩니다. 여기서는 순교자들의 죽음이 속죄적/화목적 효력을 지닌다는 수식 관계를 직접 옮기는 편이 더 충실합니다. προκακωθέντα는 진행 중인 ‘학대를 당하던’보다 앞선 고난·학대를 나타내므로 완료된 과거 표현이 적절합니다.
  naturalness: ‘신적 섭리’와 ‘보전하였습니다’는 현대의 격식 있는 한국어에서도 사용할 수 있습니다. 다만 ‘또’보다 ‘그리고’가 문장의 두 수단을 연결하는 καὶ에 더 자연스럽고, ‘전에 고난을 겪었던’이 한국어 문맥에서 매끄럽습니다.
  terminology: ἀντίψυχον은 ‘속전’으로 적절하며, 대안은 ‘대속 생명’ 및 ‘맞바꾼 생명’으로 보존합니다. ἱλαστήριον은 문맥상 ‘속죄의’로 번역하고, 화목적 및 어휘적으로 가능한 ‘속죄소’를 각주에서 대안으로 제시합니다. θεία πρόνοια는 교단적으로 특정하지 않는 ‘신적 섭리’를 유지합니다.
