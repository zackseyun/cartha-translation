translation:
  language: ko
  text: 마치 그들이 민족의 죄를 위한 속전이 된 것처럼, 또 그 경건한 이들의 피와 그들의 화목제물 같은 죽음을 통해 신적 섭리가 이전에 학대를 당하던 이스라엘을 보존하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘민족의 죄를 위한 대속 생명’이나 ‘민족의 죄와 맞바꾼 생명’이라는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘화목제물’은 그리스어 ἱλαστήριον을 옮긴 말입니다. 문맥에 따라 ‘속죄소’나 ‘화목적’으로도 이해될 수 있습니다.
    reason: alternative_reading
