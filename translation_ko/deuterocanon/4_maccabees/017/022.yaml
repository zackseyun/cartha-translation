  text: 마치 그들이 민족의 죄를 위한 속전[a]이 된 것처럼, 그리고 그 경건한 이들의 피와 그들의 속죄의 죽음[b]을 통하여 신적 섭리가 전에 고난을 겪었던 이스라엘을 보전하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘민족의 죄를 위한 대속 생명’이나 ‘민족의 죄와 맞바꾼 생명’이라는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘속죄의’는 그리스어 ἱλαστήριον을 옮긴 말입니다. 문맥에 따라 ‘화목적’으로도 번역할 수 있으며, 다른 문맥에서는 더 문자적으로 ‘속죄소’를 가리킬 수도 있습니다.
    reason: alternative_reading
