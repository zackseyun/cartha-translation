- source_word: τοὺς τῆς ἀληθείας νομοθεσίας
  english_pob_choice: the athletes of the law of truth
  chosen_korean: 진리의 율법의 선수들
  alternatives_korean:
  - 진리의 율법의 운동선수들
  - 진리의 율법의 투사들
  lexicon: LSJ
  rationale: ἀθλητάς의 경기 비유를 지우지 않기 위해 ‘선수들’을 택했고, τῆς ἀληθείας νομοθεσίας는 영어 주석의 ‘law of truth’를 따라 ‘진리의 율법’으로 유지했습니다.
- source_word: ἐξεπλάγησαν
  english_pob_choice: was not astonished
  chosen_korean: 놀라지 않았겠습니까
  alternatives_korean:
  - 경악하지 않았겠습니까
  - 놀라지 않았습니까
  lexicon: BDAG
  rationale: 앞 절의 ‘감탄’과 병렬을 이루는 더 강한 반응으로, 놀람의 절정을 드러내는 ‘놀라다’를 사용했습니다.
theological_decisions:
- issue: ἀθλητάς(경기 선수) 비유의 보존
  chosen_reading: ‘선수들’로 직역해 순교자들을 영적 경주/경기의 참가자로 제시합니다.
  alternative_readings:
  - ‘용사들’로 의역
  - ‘투사들’로 해석
  rationale: 이 단락은 순교자들의 인내를 경기 은유로 찬양하므로, 비유를 평탄화하지 않고 남기는 편이 저자의 수사를 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy 1, 5
- issue: τῆς ἀληθείας νομοθεσίας의 관계
  chosen_reading: ‘진리의 율법’으로 유지해 율법을 진리와 연결된 것으로 표현합니다.
  alternative_readings:
  - ‘진실한 율법’
  - ‘진리의 법’
  rationale: 그리스어는 속격 관계와 형용사적 의미를 모두 허용하지만, 한국어에서는 ‘진리의 율법’이 구조를 비교적 충실히 보존하면서도 자연스럽습니다.
  doctrine_reference: Translation philosophy 3, 5
