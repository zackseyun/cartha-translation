translation:
  language: ko
  text: 누가 진리의 율법을 위한 경기 선수들을 보고 경탄하지 않았겠습니까? 누가 크게 놀라지 않았겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘참된 율법’. 그리스어 구문은 속격 표현인 ‘진리의 율법’으로도, 율법을 ‘참된’ 것으로 묘사하는 표현으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνες
  english_pob_choice: Who
  chosen_korean: 누가
  alternatives_korean:
