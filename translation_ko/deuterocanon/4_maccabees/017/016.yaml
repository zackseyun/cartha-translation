  - 무엇이
  lexicon: BDAG
  rationale: 반복되는 수사 의문문에서는 한국어도 간결한 ‘누가’가 보편적 질문의 힘을 가장 자연스럽게 살립니다.
- source_word: ἐθαύμασαν
  english_pob_choice: did not marvel
