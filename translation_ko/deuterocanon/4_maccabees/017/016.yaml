  rationale: 원문의 ἀθλητάς에 담긴 경기 은유를 ‘경기 선수들’로 분명히 유지하되, 한국어에서 부자연스러운 중첩 속격을 ‘진리의 율법을 위한’으로 풀었습니다. 이 표현은 원문 속격의 정확한 관계를 과도하게 단정하지 않으면서 문맥상 헌신의 대상을 자연스럽게 나타냅니다. δεύτερη 동사의 강화된 놀라움은 ‘크게’로 반영했고, 각주는 ‘진리의’와 ‘참된’이라는 가능한 이해를 보존합니다.
