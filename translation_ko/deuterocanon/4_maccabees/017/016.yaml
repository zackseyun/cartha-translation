  yaml_path: translation/deuterocanon/4_maccabees/017/016.yaml
  text: Who did not marvel at the athletes of the law of truth? Who was not astonished?[a]
  footnotes:
  - marker: a
    text: Or, 'the true law.' The Greek phrase can be understood either as a genitive expression ('the law of truth') or as describing the law as true.
    reason: lexical_alternative
translation:
  language: ko
  text: 누가 진리의 율법의 선수들을 보고 감탄하지 않았겠습니까? 누가 놀라지 않았겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘진리인 율법’. 그리스어 구문은 속격 표현인 ‘진리의 율법’으로도, 율법을 ‘참된’ 것으로 묘사하는 표현으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνες
  english_pob_choice: Who
  chosen_korean: 누가
  alternatives_korean:
  - 어떤 사람들이
  - 무엇이
  lexicon: BDAG
  rationale: 반복되는 수사 의문문에서는 한국어도 간결한 ‘누가’가 보편적 질문의 힘을 가장 자연스럽게 살립니다.
- source_word: ἐθαύμασαν
  english_pob_choice: did not marvel
  chosen_korean: 감탄하지 않았겠습니까
  alternatives_korean:
  - 경탄하지 않았겠습니까
  - 놀라지 않았겠습니까
  lexicon: BDAG
  rationale: 첫 번째 절의 강한 놀람·찬탄을 살리면서도 한국어에서 고전적 수사문에 어울리는 표현으로 옮겼습니다.
- source_word: τοὺς τῆς ἀληθείας νομοθεσίας
  english_pob_choice: the athletes of the law of truth
  chosen_korean: 진리의 율법의 선수들
  alternatives_korean:
  - 진리의 율법의 운동선수들
  - 진리의 율법의 투사들
  lexicon: LSJ
  rationale: ἀθλητάς의 경기 비유를 지우지 않기 위해 ‘선수들’을 택했고, τῆς ἀληθείας νομοθεσίας는 영어 주석의 ‘law of truth’를 따라 ‘진리의 율법’으로 유지했습니다.
- source_word: ἐξεπλάγησαν
  english_pob_choice: was not astonished
  chosen_korean: 놀라지 않았겠습니까
  alternatives_korean:
  - 경악하지 않았겠습니까
  - 놀라지 않았습니까
  lexicon: BDAG
  rationale: 앞 절의 ‘감탄’과 병렬을 이루는 더 강한 반응으로, 놀람의 절정을 드러내는 ‘놀라다’를 사용했습니다.
theological_decisions:
- issue: ἀθλητάς(경기 선수) 비유의 보존
  chosen_reading: ‘선수들’로 직역해 순교자들을 영적 경주/경기의 참가자로 제시합니다.
  alternative_readings:
  - ‘용사들’로 의역
  - ‘투사들’로 해석
  rationale: 이 단락은 순교자들의 인내를 경기 은유로 찬양하므로, 비유를 평탄화하지 않고 남기는 편이 저자의 수사를 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy 1, 5
- issue: τῆς ἀληθείας νομοθεσίας의 관계
  chosen_reading: ‘진리의 율법’으로 유지해 율법을 진리와 연결된 것으로 표현합니다.
  alternative_readings:
  - ‘진실한 율법’
  - ‘진리의 법’
  rationale: 그리스어는 속격 관계와 형용사적 의미를 모두 허용하지만, 한국어에서는 ‘진리의 율법’이 구조를 비교적 충실히 보존하면서도 자연스럽습니다.
  doctrine_reference: Translation philosophy 3, 5
