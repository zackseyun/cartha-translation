  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안은 핵심 어휘를 대체로 반영하지만, ἔχουσα(‘가지고/간직하며’)라는 분사를 별도의 강한 명령 ‘굳게 붙드십시오’로 바꾸고, 원문에 없는 ‘굳게’를 더했습니다. 또한 πρὸς θεόν의 지향은 ‘하나님을 향한 소망’으로 연결하는 편이 한국어 문장 안에서 더 분명하면서도 원문의 관계를 보존합니다.
  naturalness: ‘거룩한 영혼을 지닌 어머니님’은 부름말로 다소 부자연스럽고, ‘하나님을 향하여 … 고상한 용기로 굳게 붙드십시오’는 수식 관계와 동작이 과도하게 겹칩니다. ‘거룩한 영혼을 지닌 어머니여’와 ‘… 소망을 고귀하게 간직하십시오’가 현대의 격식 있는 합쇼체에 더 자연스럽습니다.
  terminology: ‘거룩한 영혼’은 ἱερόψυχε의 종교적 함의를 적절히 보존합니다. γενναίως는 ‘고상한 용기로’보다 부사형 ‘고귀하게’로 옮겨 원문의 부사 기능을 살렸습니다. ‘인내의 소망’은 ἐλπίδα τῆς ὑπομονῆς의 압축된 관계를 유지합니다.
  issues:
  - severity: medium
    issue: ἔχουσα를 ‘굳게 붙드십시오’로 번역함
    rationale: ἔχουσα는 ‘가지고/간직하며’라는 현재분사이며, ‘굳게’ 및 ‘붙들다’의 강화된 지속·고수 의미는 원문에 명시되지 않습니다. 한국어에서는 주명령에 결합된 ‘간직하십시오’로 옮기는 것이 안전합니다.
  - severity: low
    issue: 부름말 ‘어머니님’ 및 문장 수식 관계
    rationale: ‘어머니님’은 이 맥락의 엄숙한 호격으로 다소 어색하며, ‘하나님을 향하여’가 어느 요소를 수식하는지 불분명합니다. 호격 ‘어머니여’와 ‘하나님을 향한 소망’이 더 자연스럽고 명료합니다.
  - severity: low
    issue: 각주 대안 ‘거룩한 영혼의 어머니’
    rationale: 이는 한국어에서 ‘거룩한 영혼을 둔 어머니’ 또는 ‘거룩한 영혼의 어머니’로 오해될 수 있어, 원문의 형용사가 어머니를 수식한다는 점을 분명히 하는 대안으로 교체하는 것이 좋습니다.
  revised_text: 그러므로 용기를 내십시오, 거룩한 영혼을 지닌 어머니여. 하나님을 향한 인내의 소망을 고귀하게 간직하십시오.[a]
