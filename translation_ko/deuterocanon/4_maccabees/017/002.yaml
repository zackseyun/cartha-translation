  yaml_path: translation/deuterocanon/4_maccabees/017/002.yaml
  text: O mother[a], who with your seven children brought down the tyrant’s violence, and nullified his evil schemes, and displayed the nobility of faith.
  footnotes:
  - marker: a
    text: Or 'the courage of faith' or 'faithfulness'; the Greek phrase can emphasize either the nobility shown by faith or the noble steadfastness of faithful devotion.
    reason: lexical_alternative
translation:
  language: ko
  text: 오, 어머니여, 일곱 자녀와 함께 폭군의 폭력을 무너뜨리시고, 그의 악한 계략들을 무력화하시며, 믿음의 고귀함을 드러내셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘믿음의 용기’로 옮길 수 있습니다. 그리스어 구절은 믿음이 드러내는 고귀함을 뜻할 수도 있고, 신실한 헌신에서 나타나는 고결한 용기를 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ μήτηρ
  english_pob_choice: O mother
  chosen_korean: 오 어머니여
  alternatives_korean:
  - 어머니!
  - 오, 어머니여!
  lexicon: LSJ
  rationale: 그리스어의 직접 호격과 높인 수사적 호소를 살리되, 현대 한국어 합쇼체에 맞게 다듬었습니다.
- source_word: σὺν ἑπτὰ παισίν
  english_pob_choice: with your seven children
  chosen_korean: 일곱 자녀와 함께
  alternatives_korean:
  - 일곱 아이들과 함께
  - 일곱 아들들과 함께
  lexicon: LSJ
  rationale: παῖς는 문맥상 아들들을 가리키지만, 본문이 직접 쓰는 일반적 의미를 살려 ‘자녀’로 옮겼습니다. 호격의 어머니 주소는 소유를 자연스럽게 드러내므로 별도의 ‘당신의’를 덧붙이지 않았습니다.
- source_word: καταλύσασα / ἀκυρώσασα
  english_pob_choice: brought down / nullified
  chosen_korean: 무너뜨리시고, ... 무효로 만드시며
  alternatives_korean:
  - 무너뜨리시고, ... 좌절시키시며
  - 무너뜨리시고, ... 폐기하시며
  lexicon: LSJ
  rationale: 두 분사는 폭군의 힘을 약화시키고 계획을 무력화하는 연속 동작을 나타내므로, 앞뒤를 각각 ‘무너뜨리다’와 ‘무효로 만들다’로 나누어 대응했습니다.
- source_word: τὴν τῆς πίστεως γενναιότητα
  english_pob_choice: the nobility of faith
  chosen_korean: 믿음의 고귀함
  alternatives_korean:
  - 믿음의 용기
  - 믿음의 기개
  - 믿음의 고상함
  lexicon: LSJ
  rationale: γενναιότης는 고귀함과 용기 둘 다의 뉘앙스를 지니므로, POB의 본문 선택을 따라 ‘고귀함’을 본문에 두고, ‘믿음’은 πίστις의 기본 대응으로 유지했습니다.
theological_decisions:
- issue: πίστις의 의미 범위
  chosen_reading: 믿음
  alternative_readings:
  - 신실함
  - 믿음의 용기
  rationale: 이 구절은 박해 속에서 드러난 신앙의 품격을 말하므로, 본문에는 ‘믿음’을 유지하고 그 품격을 ‘고귀함’으로 표현하는 것이 가장 균형적입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — πίστις → faith'
