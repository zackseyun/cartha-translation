  chosen_korean: 이기고
  alternatives_korean:
  - 승리하고
  - 이겼습니다
  - 이겨
  lexicon: LSJ
  rationale: 서사 흐름에서 현재 진행형의 승리를 나타내는 동사로, 인격화된 경합 이미지에 맞게 ‘이기고’로 옮겼습니다.
- source_word: ἀθλητάς
