lexical_decisions:
- source_word: θεοσέβεια
  english_pob_choice: godliness
  chosen_korean: 경건함
  alternatives_korean:
  - 경건
  - 하나님께 대한 경외
  lexicon: LSJ
  rationale: θεοσέβεια는 하나님을 향한 경건과 신심을 가리키므로, 한국어에서는 자연스럽고 의미 범위도 보존되는 ‘경건함’이 가장 적절합니다.
- source_word: ἐνίκα
