  lexicon: LSJ
  rationale: 서사 흐름에서 현재 진행형의 승리를 나타내는 동사로, 인격화된 경합 이미지에 맞게 ‘이기고’로 옮겼습니다.
- source_word: ἀθλητάς
  english_pob_choice: athletes
  chosen_korean: 선수들
  alternatives_korean:
  - 경기자들
  - 운동선수들
  - 경쟁자들
  lexicon: LSJ
  rationale: 원문의 운동 경기 비유를 살리면서도 한국어에서 자연스럽게 읽히는 표현으로 ‘선수들’을 택했습니다.
- source_word: στεφανοῦσα
  english_pob_choice: crowning
  chosen_korean: 관을 씌웠습니다
  alternatives_korean:
  - 월계관을 씌웠습니다
  - 승리의 관을 주었습니다
  - 관을 수여했습니다
  lexicon: LSJ
  rationale: στεφανοῦσα는 승리자의 관 씌움을 뜻하므로, 메타포를 유지하면서도 직접적인 동작이 드러나는 ‘관을 씌웠습니다’로 번역했습니다.
theological_decisions:
- issue: 여성형 인격화된 ‘θεοσέβεια’의 처리
  chosen_reading: 한국어에서는 여성 대명사 없이 ‘경건함’으로 인격화를 살리고, 행위인 ‘관을 씌웠습니다’로 승리를 드러냈습니다.
  alternative_readings:
  - ‘경건이 이기고, 그가 자기의 선수들에게 관을 씌웠습니다’
  - ‘경건이 승리하여 자기의 선수들을 관 씌우셨습니다’
  rationale: 원문은 문법상 여성형 인격화를 사용하지만, 한국어에서는 성별 대명사보다 추상명사와 동작을 통해 그 인격화를 충분히 보존할 수 있습니다.
  doctrine_reference: Translation philosophy §§3, 6
