  text: For Moses says[b][a], “And all the holy ones are under your hands.”
  footnotes:
  - marker: a
    text: Or 'the sanctified ones' or 'the holy ones.' The Greek participle denotes those who have been made holy or set apart.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'under your hands,' an image that can imply being under God's power, care, or authority.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 말합니다. 「그리고 모든 성별된 이들이 당신의 손 아래 있습니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성별된 이들’은 ‘성별된 자들’, ‘거룩한 이들’로도 옮길 수 있습니다. 그리스어 분사는 거룩하게 되었거나 따로 구별된 사람들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘당신의 손 아래’는 문자적으로는 손 아래라는 뜻이며, 하나님의 권세, 돌보심, 또는 주권 아래 있다는 이미지를 담을 수 있습니다.
    reason: lexical_alternative
