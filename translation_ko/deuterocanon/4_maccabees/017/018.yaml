  - marker: b
    text: Literally, 'under your hands,' an image that can imply being under God's power, care, or authority.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 실제로 이렇게 말합니다. 「그리고 성별된 이들은[a] 모두 당신의 두 손 아래에 있습니다[b].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성별된 이들’은 ‘성별된 자들’이나 ‘거룩한 이들’로도 옮길 수 있습니다. 그리스어 완료수동분사는 거룩하게 되었거나 따로 구별된 사람들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘당신의 두 손 아래’는 문자적으로 손 아래라는 뜻이며, 하나님의 권세, 돌보심, 또는 주권 아래 있다는 이미지를 담을 수 있습니다.
    reason: lexical_alternative
