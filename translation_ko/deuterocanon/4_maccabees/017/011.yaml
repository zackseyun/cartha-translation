theological_decisions:
- issue: διʼ αὐτῶν의 주체성과 신성의 긴장
  chosen_reading: 경기는 신성하지만, 동시에 그들의 증언과 인내를 통하여 이루어진 것으로 표현합니다.
  alternative_readings:
  - 경기가 그들에 의해 성취되었다
  - 그들의 경우에 일어난 신성한 경기였다
  rationale: 원문은 경기의 신성함을 약화하지 않으면서도 그 사건이 순교자들의 행위를 통하여 현현되었음을 함께 말합니다. 이 긴장을 해소하지 않고 유지하는 것이 본문에 더 충실합니다.
  doctrine_reference: 본문 의미의 긴장 보존
