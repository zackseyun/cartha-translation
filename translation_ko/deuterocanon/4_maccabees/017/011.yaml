- source_word: θεῖος
  english_pob_choice: divine
  chosen_korean: 신성한
  alternatives_korean:
  - 하나님의
  - 거룩한
  - 신적인
  lexicon: LSJ
  rationale: 여기서 형용사는 경기가 신에게 속하거나 신적 성격을 지닌다는 점을 나타내므로, 직접적이면서도 자연스러운 「신성한」이 적절합니다.
- source_word: ὁ διʼ αὐτῶν γεγενημένος
  english_pob_choice: brought about through them / that came about through them
  chosen_korean: 그들을 통하여 이루어진
  alternatives_korean:
  - 그들로 말미암아 생겨난
  - 그들을 통해 이루어진
  - 그들에 의해 성취된
  lexicon: BDAG
  rationale: διά + 속격은 매개·도구성을 나타내므로, 그들의 행위가 원인이자 통로가 되었음을 드러내는 「그들을 통하여 이루어진」으로 옮겼습니다.
theological_decisions:
- issue: διʼ αὐτῶν의 주체성과 신성의 긴장
  chosen_reading: 경기는 신성하지만, 동시에 그들의 증언과 인내를 통하여 이루어진 것으로 표현합니다.
  alternative_readings:
  - 경기가 그들에 의해 성취되었다
  - 그들의 경우에 일어난 신성한 경기였다
  rationale: 원문은 경기의 신성함을 약화하지 않으면서도 그 사건이 순교자들의 행위를 통하여 현현되었음을 함께 말합니다. 이 긴장을 해소하지 않고 유지하는 것이 본문에 더 충실합니다.
  doctrine_reference: 본문 의미의 긴장 보존
