translation:
  language: ko
  text: 참으로 그들을 통하여 이루어진 경기는 신성한 것이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들에 의해 이루어진 신성한 경기’라고 할 수 있습니다. 헬라어 구문은 경기가 그들을 통하여 생겨났다는 뜻 또는 그들이 이를 이루는 데 행위자로 참여했다는 뜻을 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀληθῶς
  english_pob_choice: truly
  chosen_korean: 정말로
  alternatives_korean:
  - 진실로
  - 참으로
  lexicon: BDAG
  rationale: 서술 전체를 강하게 확언하는 부사이므로, 합쇼체 문맥에서 자연스럽고도 단정적인 「정말로」로 옮겼습니다.
- source_word: ἀγών
