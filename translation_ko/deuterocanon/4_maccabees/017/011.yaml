  text: 정말로 그들을 통하여 이루어진 그 경기는 신성한 것이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들에 의해 성취된 신성한 경기’라는 뜻일 수 있습니다. 헬라어 구문은 경기가 그들의 행위를 통해 이루어졌다는 점과, 그들 안에서 실현되었다는 점을 함께 암시할 수 있습니다.
    reason: lexical_alternative
