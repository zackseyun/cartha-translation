base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/017/024.yaml
  text: And it made them noble and courageous in infantry combat and siege warfare[a], and after sacking them[c][b], he conquered all the enemies.
  footnotes:
  - marker: a
    text: Or 'for infantry battle'; the Greek literally refers to fighting on foot.
    reason: lexical_alternative
  - marker: b
    text: The Greek participle means 'after sacking' or 'after devastating' and commonly has cities or strongholds in view.
    reason: lexical_alternative
  - marker: c
    text: The Greek leaves the subject compressed and somewhat implicit in this clause; the English preserves that abruptness rather than specifying a subject from the wider context.
    reason: alternative_reading
translation:
  language: ko
  text: 그것은 그들을 보병 전투와 포위 전쟁에 용감하고 기개 있는 자들로 만들었으며[a], 그들을 초토화한 뒤[b] 모든 적을 정복하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 '보병 전투'를 가리키며, 실제로는 '걸어서 하는 전투'라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 분사는 흔히 도시나 요새를 초토화하는 뜻으로 쓰이며, 여기서는 대상이 압축되어 생략되어 있습니다.
    reason: source_note
lexical_decisions:
- source_word: ἔσχεν
  english_pob_choice: it made
  chosen_korean: 그것은 ... 만들었으며
  alternatives_korean:
  - 그것은 ... 지니게 하였으며
  - 그것은 ... 유지하게 하였으며
  lexicon: BDAG
  rationale: ἔχω의 사역적·결과적 용법을 따라, 앞의 두 형용사를 그 상태로 '만들었다'는 뜻을 자연스럽게 살렸습니다.
- source_word: γενναίους καὶ ἀνδρείους
  english_pob_choice: noble and courageous
  chosen_korean: 용감하고 기개 있는 자들
  alternatives_korean:
  - 고귀하고 용감한 자들
  - 고결하고 담대한 자들
  lexicon: LSJ
  rationale: γενναῖος의 품격/고결함과 ἀνδρεῖος의 용맹함을 둘 다 살리기 위해, 의미를 겹치지 않도록 '기개 있는'을 택했습니다.
- source_word: εἰς πεζομαχίαν
  english_pob_choice: in infantry combat
  chosen_korean: 보병 전투
  alternatives_korean:
  - 도보 전투
  - 보병 싸움
  lexicon: LSJ
  rationale: 직역하면 '걸어서 하는 전투'이지만, 문맥상 군사 용어로서 보병이 맞붙는 전투를 가리키므로 '보병 전투'로 옮겼습니다.
- source_word: ἐκπορθήσας
  english_pob_choice: after sacking
  chosen_korean: 초토화한 뒤
  alternatives_korean:
  - 파괴한 뒤
  - 약탈한 뒤
  - 도륙한 뒤
  lexicon: LSJ
  rationale: ἐκπορθέω는 도시나 요새를 완전히 파괴·유린하는 뜻이므로, 대상이 생략된 압축된 그리스어의 폭력을 살려 '초토화한 뒤'로 번역했습니다.
theological_decisions:
- issue: 마지막 절의 주어와 시제 압축을 얼마나 풀어 쓸 것인가
  chosen_reading: 그리스어의 압축을 따라, 앞절의 '그것'과 뒤의 단수 동사 흐름을 완전히 해소하지 않고 그대로 두었습니다.
  alternative_readings:
  - 명시적 주어를 넣어 의미를 정리한다
  - 문장을 하나의 명시적 주어로 매끈하게 통일한다
  rationale: 본문은 주어를 완전히 밝히지 않은 채 수사적으로 압축된 진술을 제시하므로, 해석을 본문 안에서 과도하게 확정하지 않았습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
