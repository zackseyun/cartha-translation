  naturalness: ‘하나님을 바라보며 죽음에 이르기까지 고문을 견디며 민족의 정당함을 입증했습니다’는 현대 표준 한국어 합쇼체로 자연스럽습니다. 두 연결 표현이 연속되지만, 그리스어의 두 분사와 주절의 관계를 명료하게 유지합니다.
  terminology: ‘하나님’, ‘민족’, ‘죽음에 이르기까지’는 적절합니다. ‘민족의 정당함을 입증했습니다’는 여기서 ἐξεδίκησαν의 문맥상 의미를 나타내며, ‘원수를 갚다/정의를 얻다’ 계열의 가능한 어휘적 의미는 주석에서 밝혀야 합니다.
