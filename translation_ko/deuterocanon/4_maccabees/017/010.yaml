  chosen_korean: 견디면서
  alternatives_korean:
  - 참아내며
  - 인내하며
  - 버티면서
  lexicon: LSJ
  rationale: 분사형의 지속적 인내를 한국어 연결어미로 자연스럽게 살리기 위해 ‘견디면서’를 선택했습니다.
theological_decisions:
- issue: ἐξεδίκησαν의 보복성 여부
  chosen_reading: 본문은 폭력적 복수보다, 순교적 충성이 민족의 정당성을 하나님 앞에서 드러내는 ‘정의의 확립’으로 읽었습니다.
  alternative_readings:
  - 민족을 복수하였다
  - 민족을 위해 보복하였다
  - 민족의 원한을 갚았다
  rationale: 직전 문맥이 비폭력적 순교와 하나님을 향한 신실함이므로, 보복 뉘앙스를 전면화하면 문맥을 왜곡합니다. POB의 vindicated 취지를 따라 ‘정의를 세웠습니다’로 처리했습니다.
  doctrine_reference: 'Translation philosophy: preserve source sense over traditional inertia; avoid importing retaliatory violence into martyrdom language.'
