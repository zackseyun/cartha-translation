  text: These also vindicated the nation[a], looking to God and enduring torments even to death.
  footnotes:
  - marker: a
    text: Or 'avenged the nation' or 'won justice for the nation.' The Greek verb can carry judicial or retributive force; here the context of martyrdom favors the sense of vindication before God.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 또한 하나님을 바라보며 죽음에 이르기까지 고문을 견디며 민족의 정당함을 입증했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘민족의 원한을 갚았다’, ‘민족을 위해 정의를 얻었다’. 그리스어 동사는 법적 또는 보복적 의미를 지닐 수 있습니다. 여기서는 순교의 문맥상, 하나님을 바라보며 견딘 이들이 민족의 정당함을 드러냈다는 뜻으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεδίκησαν
  english_pob_choice: vindicated
  chosen_korean: 정의를 세웠습니다
  alternatives_korean:
  - 민족을 위해 복수를 했습니다
  - 민족을 위해 정의를 얻었습니다
  - 민족을 변호했습니다
  lexicon: LSJ
  rationale: 본문의 문맥은 순교적 인내를 통해 민족이 하나님 앞에서 옳음으로 드러나는 의미이므로, 직접적 보복보다 ‘정의를 세우다’로 옮겨 POB의 vindicated를 자연스럽게 반영했습니다.
- source_word: τὸ ἔθνος
  english_pob_choice: the nation
  chosen_korean: 민족
  alternatives_korean:
  - 나라
  - 백성
  - 국민
  lexicon: LSJ
  rationale: ἔθνος는 여기서 유대 민족 전체를 가리키므로, 현대 한국어에서 집단적·민족적 뉘앙스를 살리는 ‘민족’이 가장 적절합니다.
- source_word: εἰς θεὸν ἀφορῶντες
  english_pob_choice: looking to God
  chosen_korean: 하나님을 바라보며
  alternatives_korean:
  - 하나님을 주목하며
  - 하나님께 시선을 고정하며
  - 하나님을 향해 바라보며
  lexicon: LSJ
  rationale: ἀφορῶντες는 주의를 하나님께 향하는 태도를 나타내므로, 합쇼체 서술에서 자연스러운 ‘바라보며’로 렌더링했습니다.
- source_word: τὰς βασάνους
  english_pob_choice: torments
  chosen_korean: 고통
  alternatives_korean:
  - 고문
  - 형벌
  - 고통의 시련
  lexicon: LSJ
  rationale: βάσανοι는 순교 문맥에서 가해진 가혹한 고통을 가리키지만, 한국어에서는 복수 개념을 살리면서도 과도하게 해석적이지 않은 ‘고통’이 읽기 좋습니다.
- source_word: ὑπομείναντες
  english_pob_choice: enduring
  chosen_korean: 견디면서
  alternatives_korean:
  - 참아내며
  - 인내하며
  - 버티면서
  lexicon: LSJ
  rationale: 분사형의 지속적 인내를 한국어 연결어미로 자연스럽게 살리기 위해 ‘견디면서’를 선택했습니다.
theological_decisions:
- issue: ἐξεδίκησαν의 보복성 여부
  chosen_reading: 본문은 폭력적 복수보다, 순교적 충성이 민족의 정당성을 하나님 앞에서 드러내는 ‘정의의 확립’으로 읽었습니다.
  alternative_readings:
  - 민족을 복수하였다
  - 민족을 위해 보복하였다
  - 민족의 원한을 갚았다
  rationale: 직전 문맥이 비폭력적 순교와 하나님을 향한 신실함이므로, 보복 뉘앙스를 전면화하면 문맥을 왜곡합니다. POB의 vindicated 취지를 따라 ‘정의를 세웠습니다’로 처리했습니다.
  doctrine_reference: 'Translation philosophy: preserve source sense over traditional inertia; avoid importing retaliatory violence into martyrdom language.'
