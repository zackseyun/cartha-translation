  - 깨끗해지기를
  - 정화되기를
  lexicon: BDAG/LSJ
  rationale: 정결과 씻김의 종교적·도덕적 함의를 함께 살리기 위해 ‘깨끗하게 정결해지기를’로 옮겨, 단순한 물리적 청소로 축소되지 않게 했습니다.
