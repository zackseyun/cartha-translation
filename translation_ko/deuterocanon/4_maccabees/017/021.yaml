- source_word: πατρίδα
  english_pob_choice: the homeland
  chosen_korean: 조국
  alternatives_korean:
  - 고향 땅
  - 본토
  - 고국
  lexicon: LSJ
  rationale: πατρίς는 혈연적·민족적 연관이 있는 본토/조국을 뜻하므로, 현대 한국어에서 그 결속과 공동체성을 잘 드러내는 ‘조국’이 적절합니다.
- source_word: καθαρισθῆναι
