base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/017/012.yaml
  text: For virtue was then presiding over the contest for those being tested through endurance; the victory was in incorruptibility[a], in long-lasting life.
  footnotes:
  - marker: a
    text: Or 'in eternal life.' The Greek literally says 'in life of long duration,' and the surrounding phrase 'in incorruptibility' may suggest an everlasting sense.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 덕은 인내를 통하여 시험받는 이들을 위한 경기를 주재하였습니다. 승리는 썩지 않음 안에, 오래 지속되는 생명[a] 안에 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영원한 생명 안에.’ 그리스어는 문자적으로 ‘오래 지속되는 생명 안에’라고 말하며, 앞의 ‘썩지 않음’은 이를 영원한 의미로 이해하게 할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀθλοθέτει
  english_pob_choice: was presiding over the contest
  chosen_korean: 경기의 주재자였습니다
  alternatives_korean:
  - 경기를 주재하고 있었습니다
  - 경기의 심판이었습니다
  - 경기의 상을 맡고 있었습니다
  lexicon: LSJ
  rationale: 희귀한 경기·경쟁 은유를 살리되, 한국어에서는 ‘주재자’가 진행과 판정의 권위를 함께 드러내어 문맥에 가장 잘 맞습니다.
- source_word: ἀρετή
  english_pob_choice: virtue
  chosen_korean: 덕
  alternatives_korean:
  - 미덕
  - 덕성
  lexicon: LSJ
  rationale: 4 마카베오스의 ἀρετή는 도덕적 탁월성을 가리키므로 ‘덕’이 가장 자연스럽고 간결합니다.
- source_word: δοκιμάζουσι
  english_pob_choice: to those being tested
  chosen_korean: 단련을 받는 이들을 위해
  alternatives_korean:
  - 시험을 받는 이들을 위해
  - 검증을 받는 이들을 위해
  - 시련을 겪는 이들을 위해
  lexicon: BDAG
  rationale: 수동적 의미를 살려 고난 속에서 ‘단련을 받는’ 상태를 드러냈습니다. 마카베오스 순교 맥락에서 시련의 성격이 분명하기 때문입니다.
- source_word: ἐν ἀφθαρσίᾳ
  english_pob_choice: in incorruptibility
  chosen_korean: 썩지 않음 안에
  alternatives_korean:
  - 불멸 안에
  - 썩지 않음 가운데
  - 부패하지 않음 안에
  lexicon: BDAG
  rationale: ἀφθαρσία를 한국어 성경어로도 자주 쓰는 ‘썩지 않음’으로 옮겨, 본문의 비부패성·비소멸성을 직접적으로 보존했습니다.
- source_word: ἐν ζωῇ πολυχρονίῳ
  english_pob_choice: in long-lasting life
  chosen_korean: 오래 지속되는 생명 안에
  alternatives_korean:
  - 장구한 생명 안에
  - 오래 사는 생명 안에
  - 영원한 생명 안에
  lexicon: LSJ
  rationale: πολυχρόνιος는 문자적으로 ‘오래 지속되는’이므로, 신학적으로 더 강한 ‘영원한’은 본문이 직접 말하는 것 이상을 덧입힐 수 있어 피했습니다.
theological_decisions:
- issue: τὸ νῖκος와 두 개의 ἐν 구문을 어떻게 한국어에서 관계시키는가
  chosen_reading: 승리는 두 가지 영역, 곧 썩지 않음과 오래 지속되는 생명 안에 있다고 풀었습니다.
  alternative_readings:
  - 승리는 썩지 않음과 오래 지속되는 생명입니다
  - 승리는 썩지 않음 안에 있으며 오래 지속되는 생명 안에 있습니다
  rationale: 그리스어의 병렬 구조를 유지하면서도, 승리의 내용이 품는 두 범주를 한국어에서 분명히 드러내기 위해 ‘안에’ 구조를 반복했습니다.
  doctrine_reference: 시학적 병렬성과 종말론적 보상 언어
- issue: ζωῇ πολυχρονίῳ를 ‘영원한 생명’으로 강화할지 여부
  chosen_reading: ‘오래 지속되는 생명’으로 유지했습니다.
  alternative_readings:
  - 영원한 생명
  - 장구한 생명
  rationale: 본문은 표준적인 ‘영생’ 어휘가 아니라 지속 기간을 말하는 표현을 쓰므로, 종말론적 의미 가능성은 남기되 본문 자체의 수위를 넘지 않도록 했습니다.
  doctrine_reference: 번역 철학 §§1, 3, 6
