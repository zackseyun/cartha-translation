  source_fidelity: 그리스어의 건축 및 지진 은유와 ‘고문을 통하여’라는 수단 표현은 대체로 충실합니다. 그러나 καθάπερ γὰρ의 연결·비교 구문을 ‘마치 … 때문입니다’로 옮기면 한국어에서 인과 관계가 부자연스럽고, 뒤따르는 문맥에 기대는 미완의 비교절이라는 원문의 성격도 충분히 드러나지 않습니다.
  naturalness: ‘마치 당신이’와 문장 끝의 ‘때문입니다’의 결합은 현대 한국어 합쇼체에서 어색합니다. ‘참으로 … 것처럼’으로 비교를 분명히 하고, 원문의 문장 미완결성을 보존하는 편이 자연스럽습니다. ‘지진을 견뎌 내다’는 의도적인 은유로 수용 가능하며, 어순을 다듬으면 더 매끄럽습니다.
  terminology: ‘지붕’, ‘기둥’, ‘지진’, ‘고문’은 각각 στέγη, στῦλος, σεισμός, βάσανοι의 강한 비유와 문맥상 의미를 잘 보존합니다. παῖδες는 이 이야기에서는 실제로 아들들을 가리키므로 본문을 ‘아들들’로 명시하고, 어휘적 대안은 각주에서 보존하는 것이 한국어 독자에게 더 정확합니다.
