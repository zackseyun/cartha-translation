  rationale: ἅ παῖδες의 범위가 넓어 문맥상 아들들이지만, 원어의 탄력성을 남기기 위해 보다 포괄적인 ‘자녀들’을 사용했습니다.
- source_word: ἀκλινῶς ὑπήνεγκας
  english_pob_choice: without wavering ... bore
  chosen_korean: 흔들림 없이 ... 견뎌 냈습니다
  alternatives_korean:
  - 흔들리지 않고 ... 버텨 냈습니다
  - 굽힘 없이 ... 감당하셨습니다
  lexicon: LSJ
  rationale: ‘without wavering’의 비유적 안정성과 ‘bore/endured’의 인내 의미를 함께 살리기 위해 ‘흔들림 없이’와 ‘견뎌 냈습니다’를 대응시켰습니다.
- source_word: διὰ τῶν βασάνων
  english_pob_choice: through tortures
  chosen_korean: 고문을 통해
  alternatives_korean:
  - 고통을 통해
  - 형벌을 통해
  lexicon: LSJ
  rationale: 순교 문맥에서 βασάνων은 단순한 시험보다 육체적 고문이 더 직접적이므로 ‘고문’이 가장 정확합니다.
- source_word: σεισμόν
  english_pob_choice: earthquake
  chosen_korean: 지진
  alternatives_korean:
  - 흔들림
  - 격동
  lexicon: LSJ
  rationale: 원문의 강한 지진 이미지를 유지하기 위해 자연재해로서의 ‘지진’을 그대로 옮겼습니다.
theological_decisions:
- issue: 비유적 건축 이미지의 보존
  chosen_reading: ‘지붕 / 기둥 / 지진’의 이미지를 해석해 풀지 않고 그대로 유지했습니다.
  alternative_readings:
  - ‘자녀들을 보호하며 고난을 견뎠습니다’로 평이하게 풀기
  rationale: 원문은 어머니를 자녀를 받치는 구조물로 묘사하는 수사적 압축이 핵심이므로, 의미를 평탄화하지 않고 독자가 이미지를 직접 보게 하는 편이 더 충실합니다.
  doctrine_reference: Translation philosophy §§1, 6
- issue: τῶν παίδων의 범위
  chosen_reading: 문맥상 ‘아들들’이지만 본문은 ‘자녀들’로 옮겼습니다.
  alternative_readings:
  - ‘아들들’
  - ‘소년들’
  rationale: 순교 이야기의 실제 대상은 아들들이지만, 원어 παῖδες의 어휘 범위가 더 넓어 한국어에서도 지나치게 협소하게 고정하지 않았습니다.
  doctrine_reference: Translation philosophy §4
