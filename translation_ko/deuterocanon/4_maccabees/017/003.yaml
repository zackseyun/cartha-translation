base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/017/003.yaml
  text: For just as you[a], like a roof firmly established upon the pillar of the children, bravely bore the earthquake through tortures without wavering,
  footnotes:
  - marker: a
    text: Or 'of the sons.' The Greek παῖδες can mean 'children,' 'sons,' or 'boys' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 마치 당신이, 자녀들의 기둥 위에 견고히 세워진 지붕처럼, 고문을 통해 일어난 그 지진을 흔들림 없이 용감하게 견뎌 냈기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아들들의’. 그리스어 παῖδες는 문맥에 따라 ‘자녀들’, ‘아들들’, ‘소년들’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: στέγη
  english_pob_choice: roof
  chosen_korean: 지붕
  alternatives_korean:
