  rationale: ζωγραφῆσαι의 시각적 비유를 살려 ‘그려내다’로 옮겼고, ὥσπερ τινός의 생략된 대상을 한국어에서는 ‘어떤 화가에게 하듯이’로 풀어 자연스럽게 했습니다.
- source_word: τὴν τῆς ἱστορίας σου εὐσέβειαν
  english_pob_choice: the godliness of your story
  chosen_korean: 당신 이야기의 경건함
  alternatives_korean:
  - 당신 이야기의 경건
