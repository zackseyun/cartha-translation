translation:
  language: ko
  text: 그러나 만일 우리에게, 마치 어떤 화가에게 하듯이, 당신 이야기의 경건함을 그려낼 수 있다면, 그것을 보는 이들이 경건 때문에 여러 가지 고문을 죽음에 이르기까지 견뎌 내는 일곱 자녀의 어머니를 보고 떨지 않겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경건’으로도 옮길 수 있습니다. 여기서 εὐσέβεια는 두 번 모두 같은 핵심 덕목을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ δὲ ἔξον ἡμῖν ἦν
  english_pob_choice: But if it were possible for us
  chosen_korean: 그러나 만일 우리에게 … 할 수 있다면
  alternatives_korean:
