  source_fidelity: 핵심 의미와 수사 의문문의 구조, ‘일곱 자녀’, 여러 종류의 고문, 죽음에 이를 때까지의 인내는 대체로 충실합니다. 다만 ὥσπερ τινός, ζωγραφῆσαι를 ‘어떤 화가에게 하듯이’로 옮긴 것은 비교의 대상을 부자연스럽게 여격 관계로 바꾸므로, ‘화가처럼’으로 고쳐야 합니다. 또한 οἱ θεωροῦντες는 어머니를 보는 사람들인데, 초안의 ‘그것을 보는 이들’은 선행사를 모호하게 만듭니다.
  naturalness: ‘마치 어떤 화가에게 하듯이’는 현대 한국어에서 자연스럽지 않고 뜻도 불분명합니다. ‘당신 이야기의 경건함’도 다소 직역투이므로 ‘당신의 이야기에 드러난 경건함’으로 풀면 자연스럽고 원문의 소유·관계 표현을 보존합니다. ‘그것을 보는 이들이 … 어머니를 보고’의 중복 및 지시 대상의 모호성은 ‘그 어머니를 보는 이들이’로 해소할 수 있습니다.
  terminology: εὐσέβεια를 두 번 모두 ‘경건함’으로 일관되게 옮긴 것은 적절합니다. βάσανοι를 ‘고문’, μέχρι θανάτου ὑπομενούσαν을 ‘죽음에 이르기까지 견뎌 내는’으로 옮긴 것도 문맥과 어휘에 부합합니다. τέκνα는 성별을 특정하지 않는 ‘자녀’로 유지합니다.
