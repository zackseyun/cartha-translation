  rationale: βάσανοι는 순교 맥락에서 단순한 고통보다 ‘고문’이 더 직접적이며, ποικίλας는 종류의 다양성을 나타내므로 ‘여러 가지’로 살렸습니다.
- source_word: μέχρι θανάτου ὑπομενούσαν
  english_pob_choice: enduring ... all the way to death
  chosen_korean: 죽음에 이르기까지 견뎌 내는
  alternatives_korean:
  - 죽을 때까지 견디는
  - 죽음에 이르도록 인내하는
  lexicon: LSJ
  rationale: ὑπομένω는 고난 아래에서 끝까지 버티는 인내를 뜻하므로 ‘견뎌 내다’로 옮겼고, μέχρι θανάτου의 종결 강도를 살려 ‘죽음에 이르기까지’로 표현했습니다.
