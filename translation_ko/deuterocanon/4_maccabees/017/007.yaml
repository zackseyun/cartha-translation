  lexicon: LSJ
  rationale: εὐσέβεια는 여기서 하나님께 대한 경건한 신실함을 뜻하므로 ‘경건함’으로 옮겼고, ἱστορία는 기술적 ‘역사’보다 ‘이야기’가 더 적절합니다.
- source_word: ποικίλας βασάνους
  english_pob_choice: varied tortures
  chosen_korean: 여러 가지 고문
