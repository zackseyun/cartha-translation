translation:
  language: ko
  text: 그러나 만일 우리가 마치 화가처럼 당신의 이야기에 드러난 경건함을 그려 낼 수 있다면, 경건함 때문에 여러 가지 고문을 죽음에 이르기까지 견뎌 내는 일곱 자녀의 어머니를 보는 이들이 떨지 않겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경건’으로 옮길 수 있습니다. 여기서 εὐσέβεια는 두 번 모두 같은 핵심 덕목을 가리킵니다.
    reason: lexical_alternative
