translation:
  language: ko
  text: 엘레아살은 경기에서 앞장서고 있었으며[a], 일곱 아들의 어머니는 운동 경기의 선수처럼 겨루고 있었고, 형제들은 맞서 싸우고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 경기와 투쟁에 관한 세 동사를 연속하여 사용합니다. 엘레아살은 ‘경기에서 앞장서고’, 어머니는 ‘운동 경기의 선수처럼 겨루며’, 형제들은 ‘맞서 싸웁니다’. 번역은 반복되는 경기·투쟁의 이미지를 살리면서 한국어에서는 조금씩 다르게 옮겼습니다.
    reason: lexical_alternative
