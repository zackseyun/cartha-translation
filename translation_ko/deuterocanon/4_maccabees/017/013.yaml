  source_fidelity: 첫 절의 ‘경기에서 앞장서고 있었습니다’는 προηγωνίζετο의 선도적 경기/투쟁 이미지를 잘 반영합니다. 그러나 ἐνήθλει는 단순히 경기에 ‘참가하다’보다 실제로 운동선수처럼 겨루다/경기하다를 뜻하므로, 현행 ‘선수처럼 경기에 참가하고’는 경쟁 행위를 약화시키고 표현도 중복됩니다. ἠγωνίζοντο를 ‘맞서 싸우고 있었습니다’로 옮긴 것은 문맥상 가능한 넓은 투쟁 의미를 보존합니다.
  naturalness: ‘선수처럼 경기에 참가하고’는 한국어에서 다소 중복적이며, ‘운동 경기의 선수처럼 겨루고’가 현대 표준어로 더 자연스럽고 원문의 비유도 선명합니다. 세 절을 한 문장으로 연결하면 원문의 병렬 구조가 더 잘 드러납니다.
