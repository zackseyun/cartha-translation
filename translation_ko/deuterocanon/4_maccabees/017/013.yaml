  text: Eleazar was taking the lead in the contest[a]; the mother of the seven sons was competing like an athlete; and the brothers were contending.
  footnotes:
  - marker: a
    text: 'Greek uses a sequence of contest verbs: Eleazar ''went before in the contest,'' the mother ''competed athletically,'' and the brothers ''contended.'' The translation preserves the shared struggle imagery with slightly varied English phrasing.'
