translation:
  language: ko
  text: 엘레아살은 경기에서 앞장서고 있었습니다[a]. 그리고 일곱 아들의 어머니는 선수처럼 경기에 참가하고 있었고, 형제들은 맞서 싸우고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 세 개의 경기·투쟁 동사를 연속해 사용합니다. 엘레아살은 ‘경기에서 앞서 나가고’, 어머니는 ‘선수처럼 겨루며’, 형제들은 ‘맞서 싸웁니다’. 이 번역은 반복되는 투쟁 이미지를 살리되 한국어에서는 약간씩 다르게 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προηγωνίζετο
