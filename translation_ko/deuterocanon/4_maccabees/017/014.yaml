translation:
  language: ko
  text: 폭군은 계속 맞서 싸우고 있었습니다. 그러나 세상과 인류의 삶은 지켜보고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘폭군이 맞서 싸우고 있었다’에 가깝습니다. 대상은 앞뒤 문맥에서 암시됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τύραννος
  english_pob_choice: the tyrant
  chosen_korean: 폭군
  alternatives_korean:
  - 독재자
  - 통치자
  lexicon: LSJ
  rationale: τύραννος는 단순한 ‘통치자’보다 압제적이고 부정적인 뉘앙스가 강하므로, 그 도덕적 평가를 드러내는 ‘폭군’이 가장 가깝습니다.
- source_word: ἀντηγωνίζετο
  english_pob_choice: kept struggling
  chosen_korean: 계속 맞서 싸우고 있었습니다
  alternatives_korean:
  - 계속 투쟁하고 있었습니다
  - 계속 대항하고 있었습니다
  - 계속 다투고 있었습니다
  lexicon: LSJ
  rationale: 미완료 과거는 지속적·반복적 진행을 나타내므로 ‘계속 … 하고 있었습니다’로 살리고, 대립성을 분명히 하기 위해 ‘맞서 싸우다’를 택했습니다.
- source_word: ὁ δὲ κόσμος
  english_pob_choice: but the world
  chosen_korean: 그러나 세상
  alternatives_korean:
  - 그리고 세상
  - 또 세상
  - 세상
  lexicon: LSJ
  rationale: δέ의 대비를 살리기 위해 ‘그러나’로 옮겼고, κόσμος는 이 문맥에서 인간 사회 전체를 가리키는 폭넓은 ‘세상’이 자연스럽습니다.
- source_word: ὁ τῶν ἀνθρώπων βίος
  english_pob_choice: the life of mankind
  chosen_korean: 인류의 삶
  alternatives_korean:
  - 사람들의 삶
  - 인간의 삶
  - 인류의 생활
  lexicon: LSJ
  rationale: βίος의 포괄적이고 집합적인 뜻을 살리면서도 한국어로 가장 자연스럽게 들리는 표현은 ‘인류의 삶’입니다.
- source_word: ἐθεώρει
  english_pob_choice: were watching
  chosen_korean: 지켜보고 있었습니다
  alternatives_korean:
  - 보고 있었습니다
  - 관찰하고 있었습니다
  - 바라보고 있었습니다
  lexicon: LSJ
  rationale: θεωρέω의 지속적 관람·주시의 의미를 살려 단순한 시각 행위보다 ‘지켜보다’가 더 적절합니다.
theological_decisions:
- issue: ‘세계’와 ‘인류의 삶’의 의인화 유지
  chosen_reading: 세상과 인류의 삶이 실제 관객처럼 지켜보는 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 세상의 인간사 전체가 지켜보았습니다
  - 세상과 인간 사회가 관망했습니다
  rationale: 본문은 폭군의 행위를 하나의 공적·우주적 장면으로 제시하므로, 의인화된 관찰 구도를 유지하는 편이 수사적 힘을 더 잘 전달합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3, 6
