  source_fidelity: 그리스어의 미완료 동사들(ἀντηγωνίζετο, ἐθεώρει)을 ‘계속 … 하고 있었습니다’와 ‘지켜보고 있었습니다’로 지속적으로 잘 옮겼습니다. ὁ τύραννος는 ‘폭군’, δέ는 ‘그러나’, κόσμος와 ὁ τῶν ἀνθρώπων βίος의 의인화된 병치는 ‘세상과 인류의 삶’으로 충실히 보존되었습니다. ἀντηγωνίζετο의 대상을 본문에 추가하지 않은 점도 원문의 무목적어 표현을 존중합니다.
  naturalness: ‘세상과 인류의 삶은 지켜보고 있었습니다’는 일상적 산문이라기보다 원문의 의인화와 수사성을 반영하는 문학적 표현이지만, 현대 한국어 합쇼체 안에서 이해 가능하고 어색함이 의미 전달을 해치지 않습니다. ‘계속 맞서 싸우고 있었습니다’도 자연스럽습니다.
  terminology: ‘폭군’은 문맥상 τύραννος의 압제적·부정적 함의를 적절히 전달합니다. ‘인류의 삶’은 τῶν ἀνθρώπων βίος의 집합적이고 다소 고양된 표현을 잘 반영하며, 신학적 해석을 덧붙이지 않습니다.
