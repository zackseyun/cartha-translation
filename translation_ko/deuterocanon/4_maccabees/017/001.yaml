    rationale: πυρά는 장례나 처형에 쓰이는 불붙은 장작더미를 가리킵니다. ‘화형대’는 일반적으로 사람을 묶거나 세우는 처형 구조물을 연상시킬 수 있습니다.
  - severity: high
    issue: 각주의 ‘왕의 몸종들’이라는 대안
    rationale: δορυφόρος는 본래 창을 든 사람, 문맥상 왕실 호위·경비 인력을 뜻하며 ‘몸종’은 의미상 부정확합니다.
