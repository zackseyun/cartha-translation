translation:
  language: ko
  text: 또 왕의 경호병들 가운데 몇 사람은 그녀도 죽임을 당하기 위해 잡히게 되었을 때, 그들이 그녀의 몸의 어떤 부분도 만지지 못하게 하려고 스스로 화형대 위로 몸을 던졌다고 말했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕의 몸종들’, 더 문자적으로는 ‘창병들’입니다. 이 그리스어는 왕실 경호병을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절은 전지적 서술이 아니라 일부 경호병의 보고로 제시됩니다.
    reason: alternative_reading
