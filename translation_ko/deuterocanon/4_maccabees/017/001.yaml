  verdict: revise
  source_fidelity: 그리스어의 보고 형식(ἔλεγον ... τινές)은 잘 보존되어 있습니다. 그러나 ἵνα μὴ ψαύσειέν τι τοῦ σώματος αὐτῆς는 특정한 ‘그들’이 아니라 ‘아무도 그녀의 몸에 조금이라도 손대지 못하도록’이라는 뜻으로 옮기는 것이 더 충실합니다. 또한 πυρά는 ‘화형대’(처형용 구조물)보다 불붙은 장작더미/화장용 장작더미를 뜻합니다.
  naturalness: 합쇼체 문장과 전반적 흐름은 자연스럽습니다. 다만 ‘그녀의 몸의 어떤 부분도’는 다소 번역투이므로 ‘그녀의 몸에 조금도’가 더 자연스럽고, ‘화장용 장작더미’는 문맥상 구체성과 자연스러움을 함께 갖춥니다.
  terminology: ‘왕의 경호병들’은 δορυφόρων의 문맥상 의미에 적절합니다. 각주 대안인 ‘왕의 몸종들’은 어휘 의미와 맞지 않으므로 삭제해야 합니다. ‘화형대’도 πυρά의 핵심 의미를 충분히 반영하지 못하므로 바꾸는 것이 안전합니다.
  issues:
  - severity: medium
    issue: ἵνα절의 주체를 ‘그들이’로 한정함
    rationale: ψαύσειεν은 부정칭 주어를 수반하는 단수 표현으로, 아무도 그녀의 몸에 손대지 못하게 하려 했다는 뜻입니다. ‘그들이’라고 하면 경호병들만을 문법적으로 특정합니다.
  - severity: medium
