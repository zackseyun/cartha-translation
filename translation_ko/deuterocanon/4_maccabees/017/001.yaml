  text: Some of the king’s guards also said that when she too was about to be seized for death[b][a], she threw herself onto the pyre so that they might not touch any part of her body.
  footnotes:
  - marker: a
    text: Or 'bodyguards' or more literally 'spearmen.' The Greek term refers to royal guards.
    reason: lexical_alternative
  - marker: b
    text: The verse presents this as a report from some of the guards, not as an unqualified narrator statement.
    reason: alternative_reading
translation:
  language: ko
  text: 또 왕의 경호병들 가운데 몇 사람은, 그녀도 죽임을 당하려고 붙잡히게 되었을 때 아무도 그녀의 몸에 조금도 손대지 못하게 하려고 스스로 화장용 장작더미 위로 몸을 던졌다고 말했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕의 호위병들’, 더 문자적으로는 ‘창병들’입니다. 이 그리스어는 왕실 경호병을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절은 서술자의 단정이 아니라 일부 경호병의 보고로 제시됩니다.
    reason: alternative_reading
