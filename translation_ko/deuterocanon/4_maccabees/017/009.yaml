  text: Here lie buried an aged priest[a], and an aged woman, and seven children, because of a tyrant’s violence, who wanted to abolish the commonwealth of the Hebrews.
  footnotes:
  - marker: a
    text: Or 'the way of life of the Hebrews' or 'the constitution of the Hebrews.' The Greek term includes the idea of a people's ordered communal life, not merely private belief.
    reason: lexical_alternative
translation:
  language: ko
  text: 여기에는 늙은 제사장과 늙은 여자와 일곱 자녀가 한 폭군의 폭력 때문에 묻혀 있습니다. 그는 히브리 사람들의 공동체 질서를 폐지하려 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘히브리 사람들의 생활 방식’이나 ‘히브리 사람들의 헌정’으로 옮길 수 있습니다. 그리스어 πολιτεία는 개인적 믿음만이 아니라 한 ժողովրդի의 조직된 공동체 삶을 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐντάφθα
  english_pob_choice: Here
  chosen_korean: 여기에는
  alternatives_korean:
  - 여기에
  - 이곳에는
  lexicon: LSJ
  rationale: 묘비문처럼 무덤의 위치를 가리키는 지시어이므로, 짧고 자연스러운 ‘여기에는’으로 시작해 현장감을 살렸습니다.
- source_word: γέρων ἱερεύς
