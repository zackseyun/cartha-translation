  rationale: 본문은 폭군이 파괴하려 한 대상이 개인적 신앙이 아니라 히브리 ժողովրդի의 공동체적·법질서적 삶임을 드러냅니다. 그래서 축소하지 않고 넓은 사회적 의미를 보존했습니다.
  doctrine_reference: Translation philosophy §1, §5
