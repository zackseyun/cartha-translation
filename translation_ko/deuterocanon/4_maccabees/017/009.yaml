  lexicon: LSJ
  rationale: γέρων의 나이 든 상태와 ἱερεύς의 제사장 직분을 직접 살렸습니다. ‘제사장’은 성경적 직함으로 자연스럽고, 장중한 묘비문 톤을 유지합니다.
- source_word: ἑπτὰ παῖδες
  english_pob_choice: seven sons
  chosen_korean: 일곱 자녀
  alternatives_korean:
  - 일곱 아들
