  lexicon: LSJ
  rationale: παῖδες는 문맥상 자녀/아이를 아우를 수 있으므로, 본문과 주석 전통의 긴장을 그대로 두면서도 한국어에서는 가장 중립적인 ‘자녀’를 택했습니다.
- source_word: τὴν Ἑβραίων πολιτίαν
