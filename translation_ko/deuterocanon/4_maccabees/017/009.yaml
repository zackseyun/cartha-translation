review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 이 문맥의 παῖδες는 앞선 순교 서술에 나오는 일곱 남자 자녀를 가리키므로 ‘일곱 아들’이 더 정확합니다. 또한 θέλοντος는 폭군을 수식하므로 이를 ‘폐지하려 한 폭군’으로 명시하면 한국어의 대명사 지시가 더 분명해집니다.
  naturalness: ‘늙은 제사장’, 특히 ‘늙은 여자’는 현대의 장중한 추모 문맥에서 거칠고 부자연스럽습니다. ‘연로한 제사장’과 ‘연로한 여인’이 현대 표준어 합쇼체의 격조와 자연스러움에 맞습니다.
  terminology: ‘제사장’과 ‘히브리 사람들의 공동체 질서’는 적절합니다. πολιτεία의 폭넓은 공동체적·헌정적 의미를 설명하는 각주는 유지하되, 본문 해당 어구에 표지를 붙이고 각주 안의 비한국어 문자 오류를 바로잡아야 합니다.
  issues:
  - severity: medium
    issue: ‘늙은 여자’라는 표현
    rationale: γυνὴ γεραιά는 연로한 여성을 뜻하지만, ‘늙은 여자’는 현대 한국어에서 존중과 추모의 문체에 맞지 않는 거친 표현입니다.
  - severity: medium
    issue: ‘일곱 자녀’
    rationale: παῖδες 자체는 넓게 자녀를 뜻할 수 있으나, 4마카베오서의 직접 문맥에서는 그 여인의 일곱 아들을 가리킵니다. 문맥상 성별이 특정되므로 ‘일곱 아들’이 더 충실합니다.
  - severity: low
    issue: 각주의 ‘한 ժողովրդի’
    rationale: 한국어 문장 안에 비한국어 단어가 남아 있는 편집 오류입니다. ‘한 민족의’로 고쳐야 합니다.
  - severity: low
    issue: 폭군을 받는 관계절의 지시
    rationale: ‘그는’도 해석 가능하지만, 바로 앞에 매장된 이들이 열거되어 있어 ‘폐지하려 한 폭군’으로 수식 관계를 직접 드러내는 편이 원문의 θέλοντος와 한국어 문장 흐름을 더 잘 보존합니다.
  revised_text: 여기에 연로한 제사장과 연로한 여인과 일곱 아들이 히브리 사람들의 공동체 질서[a]를 폐지하려 한 한 폭군의 폭력 때문에 묻혀 있습니다.
