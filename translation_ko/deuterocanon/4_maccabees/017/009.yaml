  text: Here lie buried an aged priest[a], and an aged woman, and seven children, because of a tyrant’s violence, who wanted to abolish the commonwealth of the Hebrews.
  footnotes:
  - marker: a
    text: Or 'the way of life of the Hebrews' or 'the constitution of the Hebrews.' The Greek term includes the idea of a people's ordered communal life, not merely private belief.
    reason: lexical_alternative
translation:
  language: ko
  text: 여기에 연로한 제사장과 연로한 여인과 일곱 아들이 히브리 사람들의 공동체 질서[a]를 폐지하려 한 한 폭군의 폭력 때문에 묻혀 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘히브리 사람들의 생활 방식’이나 ‘히브리 사람들의 헌정’으로 옮길 수 있습니다. 그리스어 πολιτεία는 개인적 믿음만이 아니라 한 민족의 조직된 공동체 삶을 포함합니다.
    reason: lexical_alternative
