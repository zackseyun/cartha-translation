  - 일곱 소년들
  lexicon: LSJ
  rationale: παῖδες는 문맥상 자녀/아이를 아우를 수 있으므로, 본문과 주석 전통의 긴장을 그대로 두면서도 한국어에서는 가장 중립적인 ‘자녀’를 택했습니다.
- source_word: τὴν Ἑβραίων πολιτίαν
  english_pob_choice: the commonwealth of the Hebrews
  chosen_korean: 히브리 사람들의 공동체 질서
  alternatives_korean:
  - 히브리 사람들의 공화국
  - 히브리 사람들의 정치 질서
  - 히브리 사람들의 생활 방식
  lexicon: LSJ
  rationale: πολιτεία는 단순한 ‘종교’가 아니라 공동체의 조직된 삶, 헌정적 질서를 가리키므로, 한국어에서는 그 범위를 살린 ‘공동체 질서’로 옮겼습니다.
theological_decisions:
- issue: 'πολιτεία의 범위: 종교적 신앙 vs 공동체적 삶의 질서'
  chosen_reading: 히브리 사람들의 공동체 질서
  alternative_readings:
