    rationale: τιθηνίαι와 γαλακτοτροφίαι는 모두 유아 양육과 관련되지만 원문은 서로 다른 명사를 병렬합니다. 한국어에서도 ‘젖먹임’과 ‘젖으로 기름’으로 구별하여 원문의 어휘적 반복과 뉘앙스를 보존할 수 있습니다.
  - severity: low
