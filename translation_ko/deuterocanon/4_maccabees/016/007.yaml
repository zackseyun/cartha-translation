  text: 아, 헛된 일곱 번의 잉태여, 무익한 일곱 번의 열 달 임신이여[a], 결실 없는 젖먹임이여, 고달픈 젖으로 기름이여![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본 절의 ‘열 달’은 고대의 산달 계산을 반영하는 표현입니다.
