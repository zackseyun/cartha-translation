  yaml_path: translation/deuterocanon/4_maccabees/016/003.yaml
  text: And the lions around Daniel were not so savage[a], nor the blazing furnace with its fiercest fire against Mishael, as that mother's own nature was inflamed by love for her children when she saw her seven sons being tortured.
  footnotes:
  - marker: a
    text: Or 'was burning more fiercely because of love for her children.' The Greek verb uses fire imagery for the mother's inner anguish.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 다니엘의 사자들이 그랬던 것만큼도 사납지 않았고, 미사엘의 타오르는 풀무가 가장 맹렬한 불로 그랬던 것만큼도 아니었으니, 그 어머니의 본성은 자녀들에 대한 사랑으로 불타올랐습니다. 그녀가 자기의 일곱 아들이 고문당하는 것을 보았기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '자녀들에 대한 사랑 때문에 더 맹렬히 타오르고 있었다.' 여기서 그리스어 동사는 어머니의 내적 고통을 불의 이미지로 표현합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ περὶ Δανιὴλ λέοντες
  english_pob_choice: the lions around Daniel
  chosen_korean: 다니엘의 사자들
  alternatives_korean:
  - 다니엘 주변의 사자들
  - 다니엘을 둘러싼 사자들
  lexicon: LSJ
  rationale: Greek idiom points to the lions in Daniel’s episode; Korean에서는 자연스럽고 간명하게 소유 관계로 옮기되, 문맥상 Daniel 6장을 가리키는 연결을 살렸습니다.
- source_word: ἄγριοι
  english_pob_choice: savage
  chosen_korean: 사납지 않았고
  alternatives_korean:
  - 거칠지 않았고
  - 야생적이지 않았고
  lexicon: LSJ
  rationale: 사자들의 위험한 포악성을 드러내는 말로 '사납다'가 가장 직접적입니다.
- source_word: ἐκφλεγομένη κάμινος
  english_pob_choice: the blazing furnace
  chosen_korean: 타오르는 풀무
  alternatives_korean:
  - 불타오르는 풀무
  - 활활 타는 풀무
  lexicon: LSJ
  rationale: κάμινος는 단순한 'furnace'보다 제련용 풀무/용광로의 이미지가 강해 '풀무'로 옮겼고, 현재분사 이미지는 '타오르는'으로 살렸습니다.
- source_word: λαβροτάτῳ πυρί
  english_pob_choice: with its fiercest fire
  chosen_korean: 가장 맹렬한 불
  alternatives_korean:
  - 가장 격렬한 불
  - 가장 거센 불
  lexicon: LSJ
  rationale: 라브로타토이의 최상급 강세를 한국어에서 가장 자연스럽게 드러내는 표현으로 '가장 맹렬한'을 택했습니다.
- source_word: φιλοτεκνίας
  english_pob_choice: love for her children
  chosen_korean: 자녀들에 대한 사랑
  alternatives_korean:
  - 자식 사랑
  - 자녀 사랑
  lexicon: LSJ
  rationale: 어머니의 정서와 연결된 명사형을 직역에 가깝게 옮기되, 현대 한국어에서 자연한 '자녀들에 대한 사랑'으로 풀었습니다.
- source_word: πειράλειεν
  english_pob_choice: was being inflamed
  chosen_korean: 불타올랐습니다
  alternatives_korean:
  - 불타고 있었습니다
  - 더 뜨겁게 달아올랐습니다
  lexicon: LSJ
  rationale: 희귀 동사의 불 이미지가 핵심이므로 정서적 완화보다 연소 은유를 유지하는 방향으로 옮겼습니다.
- source_word: ὁρῶσα αὐτῆς τοὺς ἑπτὰ υἱοὺς βασανιζομένους
  english_pob_choice: when she saw her seven sons being tortured
  chosen_korean: 그녀가 자기의 일곱 아들이 고문당하는 것을 보았기 때문입니다
  alternatives_korean:
  - 그녀가 자기의 일곱 아들이 고문받는 것을 보았기 때문입니다
  - 그녀가 자기의 일곱 아들이 고문당하는 것을 보면서
  lexicon: LSJ
  rationale: ὁρῶσα는 상황을 설명하는 분사이므로 한국어에서는 원인-상황을 자연스럽게 드러내는 '...보았기 때문입니다'로 처리했습니다.
theological_decisions:
- issue: 비교 구조 속 과장된 수사와 불 은유를 유지할지 여부
  chosen_reading: 사자와 풀무의 비교를 그대로 살리고, 어머니 내부의 상태도 '불타올랐습니다'로 번역해 은유를 보존했습니다.
  alternative_readings:
  - 감정적으로 격앙되었다
  - 자녀 사랑 때문에 괴로워했다
  rationale: 본문은 외부의 잔혹함보다 더 강한 내적 고통을 대비시키며 불 이미지를 반복하므로, 이를 약화하면 수사의 힘이 사라집니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3, 6
