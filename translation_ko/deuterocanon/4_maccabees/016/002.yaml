translation:
  language: ko
  text: 그러므로 나는 남자들만이 고통들[a]을 이겨 냈을 뿐 아니라, 한 여인도 가장 큰 고문들을 하찮게 여겼음을 보였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정념들’을 이겼다, 혹은 ‘고통들’을 가벼이 여겼다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέδειξα
  english_pob_choice: I have shown
  chosen_korean: 나는 ... 보였습니다
  alternatives_korean:
  - 나는 ... 증명했습니다
  - 나는 ... 입증했습니다
  lexicon: BDAG
  rationale: 결론을 맺는 논지 전개이므로 현대 한국어에서 자연스러운 ‘보였습니다’로, 단정적 법정 어조의 ‘증명했습니다’보다 완곡하게 유지했습니다.
- source_word: τῶν παθῶν
  english_pob_choice: the passions
  chosen_korean: 고통들
  alternatives_korean:
  - 정념들
  - 열정들
  - 욕망들
  lexicon: BDAG
  rationale: 이 문맥의 πάθη는 4 마카베오스 전체의 윤리적 정념보다도 맥락상 ‘겪는 고통/고난’에 가깝게 읽히므로, 한국어로는 ‘고통들’이 가장 직접적입니다.
- source_word: ἐπεκράτησαν
  english_pob_choice: master
  chosen_korean: 이겨 냈을
  alternatives_korean:
  - 다스렸을
  - 제압했을
  - 지배했을
  lexicon: BDAG
  rationale: ‘master’의 지배·통제 의미를 살리면서도 한국어에서 자연스럽게 읽히는 능동적 승리 표현으로 옮겼습니다.
- source_word: ὑπερεφρόνησεν
  english_pob_choice: despised / thought little of
  chosen_korean: 하찮게 여겼음을
  alternatives_korean:
  - 업신여겼음을
  - 경시했음을
  - 경멸했음을
  lexicon: BDAG
  rationale: ‘매우 큰 고문’을 가치 없게 여겼다는 뜻을 드러내기 위해 ‘하찮게 여겼음’을 택해, 단순 감정 표현보다 태도의 경시를 살렸습니다.
theological_decisions:
- issue: πάθη의 한국어 의미 범위
  chosen_reading: 여기서는 일반적 ‘정념’보다 문맥상 ‘고통들’로 옮겼습니다.
  alternative_readings:
  - 정념들
  - 감정들
  - 고난
  rationale: 본문은 남자들이 πάθη를 ‘이겼다’고 말한 뒤 곧바로 여인이 ‘가장 큰 고문들’을 하찮게 여겼다고 이어지므로, 여기서는 내적 정념보다 외적 고통의 맥락이 더 강합니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 1, 5
- issue: 남자들 / 한 여인의 대비
  chosen_reading: ‘남자들만이 ... 한 여인도 ...’로 성별 대비를 보존했습니다.
  alternative_readings:
  - 사람들만이 ... 한 사람도 ...
  rationale: 본문의 수사적 대비는 남성과 여성을 직접 대조하는 데 있으므로, 이를 일반화하지 않고 그대로 유지했습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 4
