  verdict: revise
  source_fidelity: 첫 문장의 그리스어는 관계대명사 ἣ로 앞선 ‘어머니’를 받으면서도 ἀποθάνω에서 갑자기 1인칭 단수로 전환됩니다. 초안은 이 전환을 보존한 점은 좋습니다. 그러나 ‘묻어야 할 것입니다’는 의무의 뉘앙스를 더하며, θάπτοντα의 결과적 행위를 더 중립적으로 ‘묻게 될’로 옮기는 편이 안전합니다. 또한 ὀλοφύρετο는 단순한 ‘슬퍼하다’보다 애곡/통곡의 뜻이 강하므로 ‘애곡하지 않았습니다’가 적절합니다.
  naturalness: ‘그녀는, 내가’의 쉼표는 한국어에서 부자연스럽고, 관계절을 ‘그 여인은 … 묻게 되더라도’로 처리하면 원문의 인칭 급전환을 유지하면서도 문장이 자연스러워집니다. ‘그들 가운데 아무도’보다 ‘아들들 가운데 누구도’가 지시 대상이 더 분명합니다.
  terminology: ‘거룩하고 하나님을 경외하는 어머니’는 ἱερὰ καὶ θεοσεβὴς μήτηρ를 충실하고 현대 한국어 성서 문체에 맞게 옮깁니다. ‘애곡하다’는 ὀλοφύρομαι의 강도를 보존합니다.
