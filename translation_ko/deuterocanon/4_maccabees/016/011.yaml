  - 내가 죽지 않는 한
  lexicon: LSJ
  rationale: ἂν이 붙은 가정적 조건을 한국어의 반사실적 표현으로 옮기되, 영어 주석이 지적한 1인칭 형태를 과도하게 매끈하게 만들지 않았습니다.
- source_word: θάπτοντα τῶν υἱῶν ἕξω τινά
  english_pob_choice: would bury some one of my sons
  chosen_korean: 내 아들들 가운데 하나를 묻어야 할 것입니다
  alternatives_korean:
  - 내 아들들 중 한 사람을 묻게 될 것입니다
  - 내 아들들 가운데 누구 하나를 장사해야 할 것입니다
  lexicon: LSJ
  rationale: θάπτοντα의 장례 행위를 한국어에서 자연스러운 동사구로 풀어 주면서, ἕξω τινά의 ‘하나’를 분명히 드러냈습니다.
- source_word: ἡ ἱερὰ καὶ θεοσεβὴς μήτηρ
  english_pob_choice: the holy and God-fearing mother
  chosen_korean: 거룩하고 하나님을 경외하는 어머니
  alternatives_korean:
  - 신성하고 경건한 어머니
  - 거룩하며 하나님을 두려워하는 어머니
  lexicon: LSJ
  rationale: ἱερά는 도덕적·종교적 높임의 의미로 ‘거룩하고’로, θεοσεβής는 단순한 경건보다 하나님을 향한 경외를 드러내는 표현으로 옮겼습니다.
- source_word: ὀλοφύρετο
  english_pob_choice: bewailed
  chosen_korean: 슬퍼하지 않았습니다
  alternatives_korean:
  - 통곡하지 않았습니다
  - 애곡하지 않았습니다
  lexicon: LSJ
  rationale: ὀλοφύρομαι의 통곡·비탄의 강도를 살리되, 본문이 말하는 부정은 ‘어느 누구도 애통해하지 않았다’는 점을 한국어에서 간결하게 표현했습니다.
theological_decisions:
- issue: θεοσεβής의 신앙적 뉘앙스
  chosen_reading: ‘하나님을 경외하는’으로 옮겨, 단순한 도덕성보다 하나님 중심의 경외를 드러냈습니다.
  alternative_readings:
  - 경건한
  - 신실한
  rationale: 이 단어는 일반적 종교성보다 하나님에 대한 경외를 강조하므로, 본문의 신앙적 색채를 분명히 하는 번역이 더 적절합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
- issue: 1인칭 급전환의 보존
  chosen_reading: ‘내가 죽지 않더라도’로 1인칭 가정을 유지했습니다.
  alternative_readings:
  - 그녀가 죽지 않더라도
  - 만일 그녀가 죽지 않는다면
  rationale: 그리스어 본문의 급격한 1인칭 전환을 완화하지 않고, 공인된 주석상의 긴장을 한국어에도 남겼습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
