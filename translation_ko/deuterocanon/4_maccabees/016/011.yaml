    issue: ‘그녀는, 내가’라는 구두점과 연결이 한국어에서 어색합니다.
    rationale: 관계대명사와 갑작스러운 1인칭을 한국어 문장 안에서 자연스럽게 연결하되, 인칭 전환 자체는 보존할 수 있습니다.
