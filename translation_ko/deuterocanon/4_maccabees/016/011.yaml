- from: 그녀는, 내가 죽지 않더라도 내 아들들 가운데 하나를 묻어야 할 것입니다. 그러나 이 통곡으로 거룩하고 하나님을 경외하는 어머니는 그들 가운데 아무도 슬퍼하지 않았습니다.[a]
  to: 그 여인은, 내가 죽지 않더라도 내 아들들 가운데 한 사람을 묻게 되더라도 그러했을 것입니다. 그러나 거룩하고 하나님을 경외하는 그 어머니는 이 애곡으로 아들들 가운데 누구도 애곡하지 않았습니다.[a]
  rationale: 원문의 갑작스러운 1인칭을 유지하되, 한국어에서 관계대명사절의 기능을 ‘그러했을 것입니다’로 보완하여 문장을 완결했습니다. 의무를 함축하는 ‘묻어야 할’은 결과적 상황을 나타내는 ‘묻게 되더라도’로 고쳤고, ὀλοφύρετο의 강도를 ‘애곡하다’로 회복했습니다. ‘이 애곡으로’는 τούτῳ τῷ θρήνῳ를 보존합니다.
