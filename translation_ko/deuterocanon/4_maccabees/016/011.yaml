  text: 그녀는, 내가 죽지 않더라도 내 아들들 가운데 하나를 묻어야 할 것입니다. 그러나 이 통곡으로 거룩하고 하나님을 경외하는 어머니는 그들 가운데 아무도 슬퍼하지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
