  lexicon: LSJ
  rationale: 앞선 문맥의 어머니를 가리키는 관계대명사를 한국어에서는 자연스럽게 주어로 풀어 옮겼습니다.
- source_word: οὐδʼ ἂν ἀποθάνω
  english_pob_choice: even if I were not to die
  chosen_korean: 내가 죽지 않더라도
  alternatives_korean:
