translation:
  language: ko
  text: 그 여인은, 내가 죽지 않더라도 내 아들들 가운데 한 사람을 묻게 되더라도 그러했을 것입니다. 그러나 거룩하고 하나님을 경외하는 그 어머니는 이 애곡으로 아들들 가운데 누구도 애곡하지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 여기서 갑자기 1인칭 단수(‘내가 죽지 않더라도’)로 전환됩니다. 이는 어머니 자신의 말이나 압축된 인용과 같은 표현을 반영할 수 있습니다. 일부 번역은 뜻을 매끈하게 하려고 3인칭으로 완화하지만, 여기서는 본문의 긴장을 보존했습니다.
    reason: lexical_alternative
