    text: 그리스어는 여기서 갑자기 1인칭 단수로 전환됩니다. 일부 번역은 뜻을 매끈하게 하려고 3인칭으로 완화하지만, 본문 증거의 긴장을 보존했습니다.
    reason: lexical_alternative
