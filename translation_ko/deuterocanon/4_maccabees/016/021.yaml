  yaml_path: translation/deuterocanon/4_maccabees/016/021.yaml
  text: And Daniel the righteous man was thrown to the lions[a]; and Hananiah and Azariah and Mishael were hurled into a furnace of fire[b], and they endured because of God.
  footnotes:
  - marker: a
    text: Traditional English often has 'into a fiery furnace.' The Greek reads more literally, 'into a furnace of fire.'
    reason: lexical_alternative
  - marker: b
    text: These are the Hebrew names of the three youths, more commonly known in English as Shadrach, Meshach, and Abednego.
    reason: alternative_reading
translation:
  language: ko
  text: 또 의로운 다니엘은 사자들에게 던져졌고[a], 하나냐와 아사랴와 미사엘은 불의 풀무 속에 내던져졌으며[b], 하나님 때문에 견뎌 냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘사자들로’에 가깝습니다. 한국어에서는 ‘사자들에게 던져졌고’가 자연스럽고 원문의 공격성을 잘 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 관용적인 ‘불타는 풀무’보다 더 직접적으로 ‘불의 풀무’를 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δίκαιος
  english_pob_choice: the righteous man
  chosen_korean: 의로운 다니엘
  alternatives_korean:
  - 의로운 사람 다니엘
  - 의인 다니엘
  lexicon: LSJ
  rationale: 기사(ὁ)와 형용사 δίκαιος가 결합해 다니엘을 수식하는 표현이므로, 서술적 평가를 살린 ‘의로운’이 가장 직접적입니다. ‘의인’은 명사화가 강하고, ‘사람’은 원문의 간결함을 약간 풀어냅니다.
- source_word: εἰς λέοντας ἐβλήθη
  english_pob_choice: was thrown to the lions
  chosen_korean: 사자들에게 던져졌고
  alternatives_korean:
  - 사자들 속으로 던져졌고
  - 사자 우리로 던져졌고
  lexicon: LSJ
  rationale: ἐβλήθη는 수동으로 ‘던져지다’의 강한 폭력성을 담고 있으며, εἰς λέοντας는 구체적 ‘우리’보다 대상인 사자들에게 던져진 이미지를 앞세우는 것이 원문에 가깝습니다.
- source_word: εἰς κάμινον πυρὸς ἀπεσφενδονήθησαν
  english_pob_choice: were hurled into a furnace of fire
  chosen_korean: 불의 풀무 속에 내던져졌으며
  alternatives_korean:
  - 불타는 풀무 속에 던져졌으며
  - 불로 된 풀무 속에 내던져졌으며
  lexicon: LSJ
  rationale: κάμινος는 전통적으로 ‘풀무’로 옮길 수 있고, πυρὸς는 ‘불의’로 직접 반영할 수 있습니다. ἀπεσφενδονήθησαν의 과격함은 ‘내던져졌다’로 살렸습니다.
- source_word: ὑπέμειναν διὰ τὸν θεόν
  english_pob_choice: they endured because of God
  chosen_korean: 하나님 때문에 견뎌 냈습니다
  alternatives_korean:
  - 하나님으로 인해 견뎌 냈습니다
  - 하나님을 위해 견뎌 냈습니다
  lexicon: LSJ
  rationale: διὰ τὸν θεόν은 원인/동기를 나타내므로 ‘때문에’가 가장 자연스럽습니다. ὑπέμειναν은 단순히 버티다보다 인내의 지속성을 드러내는 ‘견뎌 냈습니다’가 적절합니다.
- source_word: Ἀνανίας καὶ Ἀζαρίας καὶ Μισαὴλ
  english_pob_choice: Hananiah and Azariah and Mishael
  chosen_korean: 하나냐와 아자리야와 미사엘
  alternatives_korean:
  - 사드락과 메삭과 아벳느고
  - 하나냐, 아자리야, 미사엘
  lexicon: 현대 외래어 표기법
  rationale: 그리스어 본문은 히브리어 이름을 사용하므로, 익숙한 바빌론식 이름보다 원문 고유명을 보존하는 것이 source-grounded합니다.
theological_decisions:
- issue: ‘사자들에게’와 ‘불의 풀무 속에’의 이미지 강도 유지
  chosen_reading: 원문의 폭력적·심판적 이미지를 약화하지 않고 그대로 살렸습니다.
  alternative_readings:
  - ‘사자 우리에’로 완곡하게 옮기기
  - ‘불타는 풀무’로 관용구화하기
  rationale: 이 구절은 순교적 인내를 예시하는 서술이므로, 장소를 설명적으로 덧붙이기보다 행위의 폭력성과 고난의 실재를 드러내는 번역이 문맥상 더 적절합니다.
  doctrine_reference: 번역 원칙 §1, §2
