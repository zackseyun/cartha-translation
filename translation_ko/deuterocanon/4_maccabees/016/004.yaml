translation:
  language: ko
  text: 그러나 경건의 이성으로 그 어머니는 그처럼 많고 그처럼 큰 정념들을 꺼뜨렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 자연스럽게, ‘그처럼 많은 정념들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘경건’은 여기서 단순한 도덕심이 아니라 하나님을 향한 신심과 경외를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ λογισμῷ
  english_pob_choice: by the reasoning
  chosen_korean: 경건의 이성으로
  alternatives_korean:
  - 경건의 판단으로
  - 경건한 사유로
  - 이성으로
  lexicon: LSJ
  rationale: λογισμός의 핵심인 ‘이성적 판단/숙고’를 살리되, 4마카베오기의 종교적 긴장을 반영해 εὐσεβείας를 앞에 두고 ‘경건의 이성’으로 옮겼습니다.
- source_word: τῆς εὐσεβείας
  english_pob_choice: of godliness
  chosen_korean: 경건의
  alternatives_korean:
  - 경건의
  - 경외의
  - 신심의
  lexicon: BDAG
  rationale: εὐσέβεια는 단순한 감정이 아니라 하나님을 향한 경건과 신심을 뜻하므로, 현대 한국어에서 가장 가까운 표준어인 ‘경건’으로 옮겼습니다.
- source_word: τοσαῦτα καὶ τηλικαῦτα πάθη
  english_pob_choice: such many and such great passions
  chosen_korean: 그처럼 많고 그처럼 큰 정념들을
  alternatives_korean:
  - 그처럼 많고 그처럼 큰 열정을
  - 그처럼 많고 그처럼 큰 감정들을
  - 그처럼 많은 정념과 그처럼 큰 정념들을
  lexicon: LSJ
  rationale: πάθη는 4마카베오기에서 이성에 대항하는 ‘정념/감정의 충동’을 가리키므로, 철학적 색채를 살려 ‘정념들’로 옮기고, 두 개의 강조 표현은 한국어로 자연스럽게 반복했습니다.
- source_word: κατεσβεσε
  english_pob_choice: extinguished
  chosen_korean: 꺼뜨렸습니다
  alternatives_korean:
  - 끊어버렸습니다
  - 꺼버렸습니다
  - 진압했습니다
  lexicon: LSJ
  rationale: 원뜻의 ‘불을 끄다/소멸시키다’라는 강한 비유를 살리기 위해 ‘꺼뜨리다’를 선택했습니다.
theological_decisions:
- issue: λογισμῷ τῆς εὐσεβείας의 관계를 한국어에서 어떻게 유지할지
  chosen_reading: ‘경건의 이성’으로 번역해 이성이 경건에 의해 규정된다는 점을 드러냈습니다.
  alternative_readings:
  - ‘경건한 이성’
  - ‘경건한 판단’
  - ‘경건의 판단’
  rationale: 본문은 단순한 عقل성 칭찬이 아니라, 하나님을 향한 경건이 이성적 판단을 이끈다는 4마카베오기의 핵심 주장을 담고 있습니다. 그래서 두 요소를 분리하지 않고 결합해 옮겼습니다.
