- issue: λογισμῷ τῆς εὐσεβείας의 관계를 한국어에서 어떻게 유지할지
  chosen_reading: ‘경건의 이성’으로 번역해 이성이 경건에 의해 규정된다는 점을 드러냈습니다.
  alternative_readings:
