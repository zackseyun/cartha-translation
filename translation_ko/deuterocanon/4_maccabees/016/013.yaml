translation:
  language: ko
  text: 그러나 그녀는 금강석처럼 단단한 마음을 지니고서, 아들들의 수를 불멸을 향해 되울리며[a], 경건을 위하여 그들을 죽음으로 더욱 권하면서 그들에게 간청하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문자적으로는 ‘아들들의 수를 불멸을 향해 되울리며’입니다. 그리스어 동사는 매우 이례적이고 은유적이어서, 정확한 이미지를 확정하기 어렵습니다. ‘불멸 안으로 아들들의 수를 메아리치게 하며’로도 이해될 수 있습니다.
    reason: lexical_alternative
