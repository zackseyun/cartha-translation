  text: But[a], having a mind like adamant, and sending the number of her sons on to immortality, she was all the more urging them toward death for the sake of godliness, pleading with them.
  footnotes:
  - marker: a
    text: Or 'echoing back the number of her sons into immortality.' The Greek participle is unusual and metaphorical, so the exact image is difficult to reproduce in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그녀는 쇠처럼 굳센 마음을 지니고서, 아들들의 수를 불멸을 향해 되받아치며, 경건함을 위해 그들을 죽음으로 더욱 권하였고, 그들에게 간청하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문자적으로는 ‘아들들의 수를 불멸로 되울리며/되받아치며’에 가까운 난해한 은유입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδάμαντινον ἔχουσα τὸν νοῦν
  english_pob_choice: having a mind like adamant
  chosen_korean: 쇠처럼 굳센 마음을 지니고서
  alternatives_korean:
  - 다이아몬드처럼 단단한 마음을 지니고서
  - 아다만틴 같은 마음을 지니고서
  - 굳센 뜻을 지니고서
  lexicon: LSJ
  rationale: ἀδάμαντινον은 극도의 단단함과 부서지지 않음을 가리키므로, 한국어에서는 자연스럽고 강한 이미지인 '쇠처럼 굳센'으로 옮겨 비유를 유지했습니다.
- source_word: ἀντικτυποῦσα
  english_pob_choice: sending the number of her sons on to immortality
  chosen_korean: 아들들의 수를 불멸을 향해 되받아치며
  alternatives_korean:
  - 아들들의 수를 불멸로 메아리치며
  - 아들들의 수를 불멸로 울려 보내며
  - 아들들의 수를 불멸로 되울리며
  lexicon: LSJ
  rationale: 동사는 매우 이례적이고 은유적이어서, 단순한 설명으로 풀기보다 '되받아치다'로 응답적·격투적 이미지를 살려 원문의 난해함을 보존했습니다.
- source_word: εἰς ἀθανασίαν
  english_pob_choice: toward immortality
  chosen_korean: 불멸을 향해
  alternatives_korean:
  - 불멸로
  - 불멸 안으로
  - 불멸을 위해
  lexicon: LSJ
  rationale: εἰς는 목표·방향을 나타내므로, '향해'로 목적지성을 유지했습니다.
- source_word: τὸν τῶν υἱῶν ἀριθμόν
  english_pob_choice: the number of her sons
  chosen_korean: 아들들의 수
  alternatives_korean:
  - 아들들의 숫자
  - 그 아들들의 수
  - 아들 수
  lexicon: LSJ
  rationale: 그녀의 아들들에 대한 수를 비교적 직역하되, 한국어에서는 소유 관계를 문맥상 자연스럽게 처리했습니다.
- source_word: μᾶλλον ὑπὲρ τῆς εὐσεβείας ἐπὶ τὸν θάνατον αὐτοὺς προετρέπετο ἱκετεύουσα
  english_pob_choice: she was all the more urging them toward death for the sake of godliness, pleading with them
  chosen_korean: 경건함을 위해 그들을 죽음으로 더욱 권하였고, 그들에게 간청하였습니다
  alternatives_korean:
  - 경건을 위하여 그들을 죽음으로 더욱 재촉하였고, 그들에게 애원하였습니다
  - 하나님 경외를 위해 그들을 죽음으로 더욱 권면하였고, 그들에게 간청하였습니다
  - 경건을 위해 그들을 죽음 쪽으로 더욱 밀어붙였고, 그들에게 간청하였습니다
  lexicon: LSJ
  rationale: εὐσέβεια는 4마카베오에서 하나님께 대한 충실한 경건을 뜻하므로 '경건함'으로 옮겼고, προετρέπετο와 ἱκετεύουσα는 각각 권함과 간청의 강도를 살렸습니다.
