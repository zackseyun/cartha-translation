  text: But[a], having a mind like adamant, and sending the number of her sons on to immortality, she was all the more urging them toward death for the sake of godliness, pleading with them.
  footnotes:
  - marker: a
    text: Or 'echoing back the number of her sons into immortality.' The Greek participle is unusual and metaphorical, so the exact image is difficult to reproduce in English.
