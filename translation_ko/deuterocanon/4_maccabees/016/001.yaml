  rationale: 단순한 ‘여인’ 위에 노년을 덧붙이는 병렬 구조를 살리되, 현대 한국어에서 덜 거칠고 격식 있는 표현으로 옮겼습니다.
- source_word: τὰς μέχρι θανάτου βασάνους
  english_pob_choice: the tortures unto death
  chosen_korean: 죽음에 이르기까지의 고문
  alternatives_korean:
  - 죽기까지의 고문
  - 죽음에 이르는 고문
  lexicon: LSJ
  rationale: βασάνοι는 단순한 ‘고난’보다 가해지는 고문·형벌의 뉘앙스가 강하므로 ‘고문’으로 옮기고, μέχρι θανάτου의 한계를 ‘죽음에 이르기까지’로 보존했습니다.
- source_word: ὁ εὐσεβὴς λογισμός
  english_pob_choice: godly reason
  chosen_korean: 경건한 이성
