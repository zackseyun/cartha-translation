  - 경건한 이치
  lexicon: LSJ
  rationale: 4 마카베오서의 프로그램적 용어인 λογισμός를 단순 감정이 아닌 이성적 판단의 차원으로 살리기 위해 ‘이성’으로 옮겼습니다.
