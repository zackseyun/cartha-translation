  source_fidelity: 초안은 고문을 죽음에 이를 때까지 견딘다는 핵심과 경건한 이성이 정욕을 지배한다는 결론을 대체로 보존합니다. 그러나 Εἰ δὲ τοίνυν의 조건·추론 구조를 ‘그러므로’만으로 옮겨 ‘…견뎌냈다면’과 결합한 것은 문법적으로 부정확합니다. 또한 ὁρῶσα τῶν τέκνων ὁλολυγμένων은 압축되고 다소 난해하지만, 본문에서는 ‘자녀들이 울부짖는 것을 보면서’로 직접 옮기고 주석에서 다른 문맥적 이해를 제시하는 편이 원문의 표현을 더 충실히 보존합니다.
  naturalness: ‘여인이었고 나이가 많았으며 자녀들의 어머니였던 그 여인도’는 동일 명사의 반복과 서술 연결이 다소 무겁습니다. ‘한 여인, 곧 나이 많은 자녀들의 어머니까지도’는 원문의 누적적 강조를 자연스러운 현대 한국어로 나타냅니다. ‘고문을 견뎌 냈다면’과 ‘정욕들을 지배합니다’는 합쇼체 문맥에서 자연스럽습니다.
  terminology: ‘경건한 이성’은 εὐσεβὴς λογισμός의 프로그램적 철학·종교 용어를 적절히 반영하며, ‘정욕들’은 τῶν παθῶν을 중립적 감정으로 약화하지 않습니다. ‘고문’은 βάσανοι에 적합합니다.
