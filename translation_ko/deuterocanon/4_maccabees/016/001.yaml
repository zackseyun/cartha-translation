  yaml_path: translation/deuterocanon/4_maccabees/016/001.yaml
  text: If[a], then, even a woman—an old woman and a mother of children—endured the tortures up to death while seeing the sufferings of her children, godly reason is master of the passions.
  footnotes:
  - marker: a
    text: Or more literally, 'while seeing her children wailing/crying aloud.' The Greek syntax in this clause is compressed, and the wording may emphasize the mother's witnessing of her children's cries amid their torture.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로, 여인이었고 나이가 많았으며 자녀들의 어머니였던 그 여인도 자기 자녀들의 고통을 보면서 죽음에 이르기까지의 고문을 견뎌냈다면, 경건한 이성은 정욕들을 지배합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로는 ‘자녀들이 울부짖는 것을 보면서’입니다. 그리스어 구문이 압축되어 있어, 이 절은 어머니가 자녀들의 고문 속 울부짖음을 목격하는 장면을 강조하는 것으로도 읽을 수 있습니다.
    reason: lexical_alternative
