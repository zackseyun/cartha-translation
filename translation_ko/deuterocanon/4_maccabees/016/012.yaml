  text: Nor did she try to turn any of them away so that they might not die, nor did she grieve as they were dying.
translation:
  language: ko
  text: 그러나 그녀는 그들 가운데 아무도 죽지 않도록 돌이키려 하지 않았고, 그들이 죽어 가는 것을 보며 슬퍼하지도 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘돌이키려 하지 않았고’는 ἀπέτρεπεν의 반복적·지속적 시도를 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들 가운데 아무도’는 αὐτῶν τινα의 분배적 의미를 현대 한국어로 자연스럽게 옮긴 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέτρεπεν
  english_pob_choice: try to turn ... away
  chosen_korean: 돌이키려 하지 않았고
  alternatives_korean:
  - 말리려 하지 않았고
  - 돌려세우려 하지 않았고
  - 단념시키려 하지 않았고
  lexicon: BDAG
  rationale: 미완료시상은 반복적·지속적 시도를 드러내므로, 단순한 ‘막았다’보다 ‘돌이키려 하지 않았다’가 소극적 설득의 의미를 잘 살립니다.
- source_word: αὐτῶν τινα
  english_pob_choice: any of them
  chosen_korean: 그들 가운데 아무도
  alternatives_korean:
  - 그들 중 누구도
  - 그들 중 한 사람도
  - 그들 가운데 어떤 한 사람도
  lexicon: BDAG
  rationale: 분배적 의미를 자연스러운 현대 한국어로 옮기기 위해 ‘아무도’ 구조를 사용해, 개별 아들을 하나씩 지칭하는 뉘앙스를 살렸습니다.
- source_word: ἵνα μὴ ἀποθάνωσιν
  english_pob_choice: so that they might not die
  chosen_korean: 죽지 않도록
  alternatives_korean:
  - 죽지 않게 하려고
  - 죽지 않도록 하여
  - 죽음을 면하게 하려고
  lexicon: BDAG
  rationale: 목적절을 한국어의 결과·목적 표현인 ‘-지 않도록’으로 간결하게 옮겨, 본문의 목적성을 유지했습니다.
- source_word: ἐλυπήθη
  english_pob_choice: grieve
  chosen_korean: 슬퍼하지도 않았습니다
  alternatives_korean:
  - 근심하지도 않았습니다
  - 괴로워하지도 않았습니다
  - 애통해하지도 않았습니다
  lexicon: BDAG
  rationale: 동사의 정서적 고통을 지나치게 장례적 어감으로 좁히지 않도록 ‘슬퍼하다’를 택했고, 부정과 함께 원문의 대조를 살렸습니다.
theological_decisions:
- issue: 암시된 주어의 명시화
  chosen_reading: 한국어에서는 문맥상 어머니를 주어로 분명히 드러내기 위해 ‘그녀는’으로 옮겼습니다.
  alternative_readings:
  - 주어를 생략한 채 번역하기
  - ‘어머니는’으로 직접 명시하기
  rationale: 헬라어는 주어를 생략하지만, 바로 앞뒤 문맥이 어머니를 가리키므로 한국어 가독성을 위해 인칭대명사를 보충하되, 본문이 허용하는 범위를 넘지 않았습니다.
  doctrine_reference: 문맥에 따른 명시화 원칙
- issue: 죽음 앞에서의 태도 표현
  chosen_reading: ‘그들이 죽어 가는 것을 보며 슬퍼하지도 않았다’로 옮겨, 감정의 부재를 단순한 무관심이 아니라 의도적 비탄의 결여로 표현했습니다.
  alternative_readings:
  - ‘그들이 죽어 가는 것을 보며 애통해하지도 않았다’
  - ‘그들이 죽어 가는 동안 괴로워하지도 않았다’
  rationale: 원문은 죽음 자체보다 그 과정에 대한 정서적 반응을 말하므로, 한국어에서도 ‘죽어 가는 것을 보며’라는 상황성과 ‘슬퍼하지도 않았다’의 정서 대조를 유지했습니다.
  doctrine_reference: 본문의 수사적 대조 보존
