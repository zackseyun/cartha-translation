  source_fidelity: 첫 절의 목적절과 αὐτῶν τινα의 분배적 부정은 대체로 잘 반영되었습니다. 그러나 ‘그들이 죽어 가는 것을 보며’는 원문의 ὡς ἀποθνῃσκόντων에 없는 ‘보며’(목격 행위)를 보충합니다. 원문은 그들이 죽어 가는 동안이라는 상황을 나타냅니다.
  naturalness: 현대 표준어 합쇼체로 자연스럽습니다. 다만 ‘그들 가운데 아무도 죽지 않도록 돌이키려 하지 않았고’는 누가 누구를 돌이키는지 잠시 불분명할 수 있으므로, ‘말리려 하지 않았고’가 더 명료하고 자연스럽습니다.
