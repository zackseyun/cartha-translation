  text: O my children—some unmarried[a], and others married but childless—I will not see your children, nor will I be counted blessed when I am called grandmother.
  footnotes:
  - marker: a
    text: Greek ἄνοιντοι likely means 'childless' or 'without offspring'; the sense is that even those who had married would leave her no grandchildren.
    reason: lexical_alternative
translation:
  language: ko
  text: 오, 내 자녀들아—너희 가운데에는 결혼하지 않은 이들도 있고, 결혼했으나 자녀가 없는 이들도 있습니다.[a] 저는 너희의 자녀를 보지 못할 것이며, 할머니라고 불리어 복되다 칭함을 받지도 못할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ἄνοιντοι는 ‘자녀가 없는’ 또는 ‘후손이 없는’이라는 뜻일 수 있습니다. 여기서는 결혼한 자녀들조차 어머니에게 손주를 남기지 못한다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὦ τῶν ἐμῶν παίδων
  english_pob_choice: O my children
  chosen_korean: 오, 내 자녀들아
  alternatives_korean:
  - 오, 내 자식들아
  - 오, 내 아이들아
  lexicon: LSJ
  rationale: παῖδες는 문맥상 어머니가 부르는 자녀들을 가리키므로, 현대 한국어에서 가장 자연스럽고 포괄적인 ‘자녀들’로 옮겼습니다.
- source_word: ἄγαμοι
