  verdict: revise
  source_fidelity: The draft correctly conveys the distinction between unmarried and married-but-childless children and the speaker's inability to see descendants. However, it replaces μάμμη κληθεῖσα (‘being called grandmother’) with ‘손주를 보면서’ (‘while seeing grandchildren’), which duplicates the preceding idea and omits the explicit kinship-title element of the Greek.
  naturalness: ‘손주를 보면서 복되다고 불리다’ is not a natural or accurate way to express the final Greek clause. A rendering that explicitly says ‘할머니라고 불리며’ is both natural and source-faithful. The revision also uses the requested modern formal-polite 합쇼체 consistently.
  terminology: ‘자녀’ appropriately renders both παίδων and τέκνα in this context. ‘자녀가 없는’ is a sound contextual rendering of the disputed ἄνοιντοι; the lexical note should remain anchored directly to that expression. ‘복되다 칭함을 받다’ preserves the passive, socially declarative force of μακαρισθήσομαι without implying a specific doctrinal concept of receiving blessing.
  issues:
  - severity: high
    issue: The explicit reference to being called grandmother is omitted.
    rationale: μάμμη κληθεῖσα means ‘when/being called grandmother.’ The draft instead says ‘손주를 보면서’ (‘while seeing grandchildren’), an idea already covered by ‘나는 너희의 자녀를 보지 못하겠고,’ and therefore fails to translate a distinct source element.
  - severity: medium
    issue: The footnote anchor is placed at the end of the whole sentence rather than at the rendering of ἄνοιντοι.
    rationale: The note concerns only ‘자녀가 없는,’ so its marker should immediately follow that phrase for clear anchoring.
  - severity: medium
    issue: The draft's final verbal endings are not consistently in the requested 합쇼체.
    rationale: ‘못하겠고’ and ‘못하겠구나’ are not modern formal-polite 합쇼체. The revised wording uses ‘못할 것이며’ and ‘못할 것입니다.’
  revised_text: 오, 내 자녀들아—너희 가운데에는 결혼하지 않은 이들도 있고, 결혼했으나 자녀가 없는 이들도 있습니다.[a] 저는 너희의 자녀를 보지 못할 것이며, 할머니라고 불리어 복되다 칭함을 받지도 못할 것입니다.
