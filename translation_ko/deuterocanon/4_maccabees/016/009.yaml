  text: O my children—some unmarried[a], and others married but childless—I will not see your children, nor will I be counted blessed when I am called grandmother.
  footnotes:
  - marker: a
    text: Greek ἄνοιντοι likely means 'childless' or 'without offspring'; the sense is that even those who had married would leave her no grandchildren.
    reason: lexical_alternative
translation:
  language: ko
  text: 오, 내 자녀들아—그들 가운데는 결혼하지 않은 이들도 있고, 결혼했으나 자녀가 없는 이들도 있다—나는 너희의 자녀를 보지 못하겠고, 손주를 보면서 복되다고 불리지도 못하겠구나.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἄνοιντοι는 이 문맥에서 ‘자녀가 없는’ 또는 ‘후손이 없는’ 뜻으로 이해할 수 있으며, 결혼한 자녀들도 손주를 남기지 못한다는 점을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὦ τῶν ἐμῶν παίδων
  english_pob_choice: O my children
  chosen_korean: 오, 내 자녀들아
  alternatives_korean:
  - 오, 내 자식들아
  - 오, 내 아이들아
  lexicon: LSJ
  rationale: παῖδες는 문맥상 어머니가 부르는 자녀들을 가리키므로, 현대 한국어에서 가장 자연스럽고 포괄적인 ‘자녀들’로 옮겼습니다.
- source_word: ἄγαμοι
  english_pob_choice: unmarried
  chosen_korean: 결혼하지 않은 이들
  alternatives_korean:
  - 미혼인 이들
  - 시집/장가가지 않은 이들
  lexicon: LSJ
  rationale: ἄγαμος는 단순히 혼인 상태가 없음을 뜻하므로, 현대적이고 직설적인 ‘결혼하지 않은’이 가장 투명합니다.
- source_word: ἄνοιντοι
  english_pob_choice: childless
  chosen_korean: 자녀가 없는 이들
  alternatives_korean:
  - 자식이 없는 이들
  - 후손이 없는 이들
  lexicon: LSJ
  rationale: 문맥상 이미 결혼한 자녀들이 후손을 남기지 못한다는 뜻이므로, ‘자녀가 없는’으로 옮겨 다음 절의 ‘너희의 자녀’를 자연스럽게 받게 했습니다.
- source_word: οὐκ ὄψομαι ὑμῶν τέκνα
  english_pob_choice: I will not see your children
  chosen_korean: 나는 너희의 자녀를 보지 못하겠고
  alternatives_korean:
  - 나는 너희의 자녀를 보지 못할 것이고
  - 나는 너희의 후손을 보지 못하겠고
  lexicon: LSJ
  rationale: ὄψομαι의 미래적 단정과 τέκνα의 직접적 가족 의미를 살려, 직역보다 자연스러운 서술형으로 표현했습니다.
- source_word: μάμμη κληθεῖσα μακαρισθήσομαι
  english_pob_choice: will I be blessed when I am called grandmother
  chosen_korean: 손주를 보면서 복되다고 불리지도 못하겠구나
  alternatives_korean:
  - 할머니라 불리며 복되다고 여겨지지도 못하겠구나
  - 할머니라 불릴 때 복되다고 불리지도 못하겠구나
  lexicon: LSJ
  rationale: μάμμη는 ‘할머니/외할머니’ 계열의 친근한 호칭이지만, 한국어에서 ‘할머니’는 충분히 자연스럽고, μακαρισθήσομαι의 ‘복되다고 칭해지다’는 뜻을 보존하기 위해 ‘복되다고 불리다’로 처리했습니다.
theological_decisions:
- issue: μακαρισθήσομαι의 수동 미래와 감정적 탄식의 톤
  chosen_reading: ‘복되다고 불리지도 못하겠구나’로 옮겨, 스스로의 평가가 아니라 타인의 인정으로 ‘복됨’이 선언되는 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘복을 받지도 못하겠구나’
  - ‘복되다고 여겨지지도 못하겠구나’
  rationale: 이 구절은 신학적 논쟁보다 애도와 상실의 정서를 전면에 두므로, ‘called blessed’의 사회적·평가적 의미를 살리는 것이 원문에 더 가깝습니다.
  doctrine_reference: LSJ / 문맥상 탄식 발화
- issue: 가족 호칭의 문화적 환산
  chosen_reading: μάμμη를 한국어의 ‘할머니’ 대신 ‘손주를 보면서…’라는 문맥으로 풀어, 손주를 보게 될 기대의 상실을 강조했습니다.
  alternative_readings:
  - ‘할머니라 불리며’
  - ‘외할머니라 불리며’
  rationale: 원문은 특정 친족 호칭 자체보다 후손을 보지 못하는 비극을 말하므로, 한국어에서 가장 자연스럽게 의미를 전달하는 쪽을 선택했습니다.
  doctrine_reference: 문맥적 의미 전달
