review_pass:
  verdict: revise
  source_fidelity: 원문의 호격과 비유적 ‘군사’ 이미지는 대체로 보존되었습니다. 다만 εὑρέθης ἄν은 ἄν을 동반한 가능법 표현이므로 단정적 과거 ‘드러나셨습니다’보다 ‘드러나실 것입니다’처럼 그 양태를 드러내는 편이 더 가깝습니다. ‘여자’/‘남자’의 명시적 대비도 유지해야 합니다.
  naturalness: 초안은 전반적으로 자연스럽고 합쇼체를 지켰습니다. 그러나 ‘나이가 많고 여자이면서도’는 높임말 호격 문맥에서 다소 어색하므로 ‘연로하시고 여자이시면서도’로 다듬는 것이 더 자연스럽습니다.
  terminology: ‘하나님께 대한 경건’은 εὐσέβεια θεοῦ의 가능한 의미를 충실히 전달합니다. ‘경건의 군사’는 원문의 군사 비유를 보존하는 표현입니다. ‘폭군’과 ‘행위와 말’도 적절합니다.
  issues:
  - severity: medium
    issue: 마지막 절의 ἄν이 번역에서 탈락했습니다.
    rationale: εὑρέθης ἄν은 가능법적 뉘앙스를 지니므로, ‘더 강한 분으로 드러나셨습니다’라는 단정적 과거형은 이를 평평하게 만듭니다.
  - severity: low
    issue: ‘나이가 많고 여자이면서도’의 높임말 및 연결이 다소 어색합니다.
    rationale: 직접 호격하여 높임말을 쓰는 문맥에서는 ‘연로하시고 여자이시면서도’가 더 자연스럽고, 원문의 연령 및 성별 대비도 보존합니다.
  revised_text: 오, 어머니여, 하나님께 대한 경건의 군사이시며, 연로하시고 여자이시면서도, 인내로 폭군까지 이기셨고, 행위와 말에서 남자보다 더 강한 분으로 드러나실 것입니다.
