translation:
  language: ko
  text: 오, 어머니여, 하나님께 대한 경건의 군사이시며, 나이가 많고 여자이면서도, 인내로 폭군까지 이기셨고, 행위와 말에서 남자보다 더 강한 분으로 드러나셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐσέβειαν θεοῦ
  english_pob_choice: devotion to God
  chosen_korean: 하나님께 대한 경건
  alternatives_korean:
  - 하나님께 대한 경외
  - 하나님을 향한 경건
  - 하나님께 대한 신심
  lexicon: LSJ
  rationale: εὐσέβεια는 경건, 경외, 신심의 뜻을 가지며, θεοῦ와 결합되어 하나님께 향한 태도를 나타내므로 ‘하나님께 대한 경건’이 원문의 방향을 가장 सीधे하게 살립니다.
- source_word: στρατιῶτι
  english_pob_choice: soldier
  chosen_korean: 군사
  alternatives_korean:
  - 병사
  - 전사
  - 군인
  lexicon: LSJ
  rationale: 여기서는 경건의 싸움 속에서 어머니를 비유적으로 부르는 말이므로, 전투적 이미지를 유지하면서도 문맥상 자연스러운 ‘군사’를 택했습니다.
- source_word: πρεσβῦτι
  english_pob_choice: though old
  chosen_korean: 나이가 많고
  alternatives_korean:
  - 늙었으나
  - 고령이지만
  - 연세가 많고
  lexicon: LSJ
  rationale: 노년을 지시하는 형용사로, 뒤의 ‘여자이면서도’와 함께 역경 속 승리를 부각하는 양보적 뉘앙스를 살리기 위해 ‘나이가 많고’로 옮겼습니다.
- source_word: τύραννον ἐνίκησας
  english_pob_choice: you conquered even a tyrant
  chosen_korean: 폭군까지 이기셨고
  alternatives_korean:
  - 폭군을 정복하셨고
  - 폭군을 무찌르셨고
  - 폭군마저 이기셨고
  lexicon: LSJ
  rationale: ἐνίκησας의 승리/정복 의미를 살리되, 한국어에서 자연스럽고 간결한 동사 ‘이기셨고’를 사용했고, 강조는 ‘까지’로 처리했습니다.
- source_word: ἔργοις δυνατωτέρα καὶ λόγοις
  english_pob_choice: in deeds and words you were found stronger
  chosen_korean: 행위와 말에서 더 강한 분으로 드러나셨습니다
  alternatives_korean:
  - 행동과 말에서 더 강하신 것으로 드러나셨습니다
  - 일과 말에서 더 강하신 분으로 드러나셨습니다
  - 행위와 말에서 남자보다 더 강한 분으로 드러나셨습니다
  lexicon: LSJ
  rationale: ἔργοις/λόγοις의 병렬 대비를 ‘행위와 말’로 보존하고, δυνατωτέρα/εὑρέθης의 결과를 ‘더 강한 분으로 드러나셨습니다’로 자연스럽게 재현했습니다.
theological_decisions:
- issue: 성별 대비의 보존
  chosen_reading: ‘여자이면서도’와 ‘남자보다’의 대비를 그대로 유지했습니다.
  alternative_readings:
  - 성별 대비를 완화하여 ‘한 사람보다’로 옮김
  - ‘여성으로서’ 정도로 순화함
  rationale: 본문은 나이와 성별이라는 사회적 약함의 표지를 함께 대비시키므로, 이를 중화하지 않고 원문의 수사적 긴장을 보존하는 편이 바릅니다.
  doctrine_reference: DOCTRINE.md §4 Gender-accurate over gender-neutral
- issue: εὐσέβεια의 의미
  chosen_reading: ‘하나님께 대한 경건’으로 옮겨, 단순 도덕성보다 하나님을 향한 종교적 충성을 드러냈습니다.
  alternative_readings:
  - 하나님께 대한 경외
  - 신심
  - 경건
  rationale: 이 단어는 여기서 신학적 논쟁어라기보다 하나님께 속한 삶의 태도를 가리키므로, 현대 한국어에서 직접적이고도 과도하게 추상적이지 않은 표현이 적절합니다.
  doctrine_reference: DOCTRINE.md §6 Readable modern English, not archaic or academic
