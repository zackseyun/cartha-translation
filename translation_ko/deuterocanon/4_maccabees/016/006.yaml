base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/016/006.yaml
  text: Alas for me indeed[a], thrice-wretched many times over[b]! Though I bore seven children[c], I have become the mother of none.
  footnotes:
  - marker: a
    text: Or, 'O miserable woman' or 'O wretched one.' The Greek exclamation is a self-lament.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'thrice-wretched many times over,' an intensified expression of grief.
    reason: lexical_alternative
  - marker: c
    text: Or, 'seven sons.' The Greek word can mean 'children' or 'sons'; the context indicates male offspring.
    reason: lexical_alternative
translation:
  language: ko
  text: 오, 나여, 참으로 비참하고 여러 번이나 세상에나 비참한 여자여! 내가 일곱 자녀를 낳았지만, 나는 아무의 어머니도 되지 못하였구나.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오, 비참한 여자여’, ‘오, 불쌍한 자여’. 이 감탄은 자기 탄식입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘여러 번에 걸쳐 세 번이나 비참한’이라는 뜻으로, 비탄을 극도로 강조하는 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘일곱 아들’. 그리스어는 ‘자녀’ 또는 ‘아들들’을 뜻할 수 있으나, 문맥은 남자 자녀를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ μελέα ἔγωγε
  english_pob_choice: Alas for me indeed
  chosen_korean: 오, 나여
  alternatives_korean:
  - 아, 비참한 나여
  - 슬프도다, 나여
  lexicon: LSJ
  rationale: Ὦ는 감탄사이고 μελέα는 자탄의 표현이므로, 한국어에서는 자연스러운 자기 탄식인 ‘나여’로 살렸습니다.
- source_word: πολλάκις τρισαθλία
  english_pob_choice: thrice-wretched many times over
  chosen_korean: 참으로 비참하고 여러 번이나 세상에나 비참한
  alternatives_korean:
  - 몇 번이고 지독히 비참한
  - 여러 번이나 삼중으로 비참한
  lexicon: LSJ
  rationale: πολλάκις의 반복·증폭과 τρισαθλία의 강한 비참함을 함께 살리기 위해, 중복된 강조를 한국어의 누적된 비탄 표현으로 옮겼습니다.
- source_word: ἑπτὰ παῖδας
  english_pob_choice: seven children
  chosen_korean: 일곱 자녀를
  alternatives_korean:
  - 일곱 아들을
  - 일곱 아이를
  lexicon: LSJ
  rationale: παῖδας는 문맥상 남자 자녀를 가리키지만, 한국어 본문에서는 폭넓은 어휘값을 유지하는 ‘자녀’를 택했고, 성별 구체화는 주석에 맡겼습니다.
- source_word: οὐδενὸς μήτηρ γεγένημαι
  english_pob_choice: I have become the mother of none
  chosen_korean: 나는 아무의 어머니도 되지 못하였구나
  alternatives_korean:
  - 나는 아무의 어머니도 아니다
  - 나는 아무도 잃지 않은 어머니가 되지 못하였구나
  lexicon: LSJ
  rationale: γεγένημαι의 결과 상태를 살려, 낳았으나 지금은 자식들을 잃어 ‘어머니가 되지 못한’ 역설을 한국어로 보존했습니다.
theological_decisions:
- issue: 출산과 상실의 역설을 어떻게 유지할지
  chosen_reading: ‘일곱 자녀를 낳았지만… 아무의 어머니도 되지 못하였구나’로 번역해, 낳았음에도 지금은 모두 잃은 비애를 그대로 드러냈습니다.
  alternative_readings:
  - ‘나는 아무 자녀의 어머니도 아니다’로 평이하게 처리할 수 있음
  rationale: 본문의 완성된 과거 상태 γεγένημαι가 만드는 비탄의 역설을 약화하지 않는 것이 더 충실합니다.
  doctrine_reference: 원문 수사와 정서 보존
