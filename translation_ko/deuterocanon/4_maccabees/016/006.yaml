  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오, 비참한 여자여’, ‘오, 불쌍한 자여’. 그리스어의 감탄은 자신을 향한 탄식입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘몇 번이고 세 겹으로 비참한’이라는 뜻입니다. 비탄을 거듭, 강하게 강조하는 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘일곱 아들’. 그리스어는 ‘자녀’ 또는 ‘아들들’을 뜻할 수 있으나, 문맥에서는 남자 자녀를 가리킵니다.
    reason: lexical_alternative
