translation:
  language: ko
  text: 이러한 말로 일곱 자녀의 어머니는 아들 한 사람 한 사람을 격려하며, 하나님의 계명을 어기기보다는 차라리 죽는 편을 택하도록 설득했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τούτων τῶν λόγων
  english_pob_choice: By these words
  chosen_korean: 이 말로
  alternatives_korean:
  - 이러한 말로
  - 이 말들을 통해
  lexicon: LSJ
  rationale: διά + 속격은 수단·매개를 나타낼 수 있으므로, 한국어에서는 자연스러운 수단 부사구인 ‘이 말로’가 원문의 도구적 힘을 간결하게 살립니다.
- source_word: ἡ ἑπτάμητωρ
  english_pob_choice: the mother of seven
  chosen_korean: 그 일곱 자녀의 어머니
  alternatives_korean:
  - 일곱 번의 어머니
  - 일곱 아들의 어머니
  lexicon: LSJ
  rationale: 합성어의 핵심은 ‘일곱 아이를 둔 어머니’라는 칭호이므로, 원문의 압축된 별칭을 살려 ‘그 일곱 자녀의 어머니’로 옮겼습니다. 여기서 ‘아들’은 뒤의 τῶν υἱῶν에서 이미 분명해집니다.
- source_word: παρακαλοῦσα
  english_pob_choice: encouraging
  chosen_korean: 격려하며
  alternatives_korean:
  - 권면하며
  - 재촉하며
  - 위로하며
  lexicon: LSJ
  rationale: παρακαλέω는 이 문맥에서 단순한 위로가 아니라 고난 속에서 끝까지 견디도록 북돋우는 뜻이므로, ‘격려하며’가 가장 균형 있게 대응합니다.
- source_word: μᾶλλον ἀποθανεῖν, ἢ παραβῆναι
  english_pob_choice: rather to die than to transgress
  chosen_korean: 차라리 죽는 편을 택하게 했습니다
  alternatives_korean:
  - 차라리 죽는 것이 낫다고 설득했습니다
  - 죽는 편이 낫고 어기는 것은 아니라고 했습니다
  lexicon: LSJ
  rationale: μᾶλλον…ἢ의 비교 구조를 한국어의 ‘차라리 … 편을 택하다’로 자연스럽게 옮겨, 죽음과 불복종 사이의 선명한 대비를 유지했습니다.
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  english_pob_choice: the commandment of God
  chosen_korean: 하나님의 명령
  alternatives_korean:
  - 하나님의 계명
  - 하나님의 명령을
  lexicon: LSJ
  rationale: ἐντολή는 문맥상 종교적·윤리적 ‘명령’을 뜻하므로, 한국어에서도 일상적인 ‘명령’보다 다소 격식 있는 ‘하나님의 명령’이 원문의 중량감을 잘 보존합니다.
theological_decisions:
- issue: ‘each one of her sons’의 개별성 강조를 한국어에서 어떻게 살릴지
  chosen_reading: 각 아들을 격려하며
  alternative_readings:
  - 아들마다 격려하며
  - 각각의 아들을 격려하며
  rationale: ἕνα ἕκαστον τῶν υἱῶν의 분배적 강조를 ‘각 아들’로 간결하게 반영해, 어머니가 한 사람씩 설득했다는 점을 드러냈습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: ‘rather to die than to transgress’의 윤리적 긴장을 한국어에서 어떻게 유지할지
  chosen_reading: 하나님의 명령을 어기느니 차라리 죽는 편을 택하게 했습니다
  alternative_readings:
  - 하나님의 명령을 어기느니 차라리 죽도록 권했습니다
  - 하나님의 명령을 어기느니 죽는 편이 낫다고 설득했습니다
  rationale: 이 구절은 신앙적 충성의 우선순위를 강조하므로, 완곡화하지 않고 죽음과 불복종의 대비를 분명히 살렸습니다.
  doctrine_reference: Translation philosophy §6
