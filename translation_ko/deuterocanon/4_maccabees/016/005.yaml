  chosen_reading: ‘비록 어머니라 할지라도’로 옮겨, 어머니라는 자연스러운 정서와 실제 행동의 대비를 그대로 드러냈습니다.
  alternative_readings:
  - ‘어머니였음에도’로 더 압축해 옮김
  - ‘어머니였지만’으로 단순 대조로 처리
  rationale: 본문은 모성애를 지우지 않고 오히려 그 강한 기대를 전제한 뒤, 실제로는 그렇지 않았을 가능성을 가정하는 수사이므로 양보 관계를 분명히 했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
