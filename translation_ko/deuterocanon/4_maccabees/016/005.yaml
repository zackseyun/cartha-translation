  text: 'For consider this also: if the woman had been fainthearted, though she was a mother, she would have wailed over them; and perhaps she would have spoken like this:'
translation:
  language: ko
  text: 그리고 이것도 생각해 보십시오. 그 여인이 비겁한 마음을 가진 사람이었다면, 비록 어머니라 할지라도 그들 때문에 통곡했을 것이며, 아마 이렇게 말했을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλογίσασθαι
  english_pob_choice: consider
  chosen_korean: 생각해 보십시오
  alternatives_korean:
  - 고려하십시오
  - 헤아려 보십시오
  - 생각하십시오
  lexicon: LSJ
  rationale: 청중에게 한 가지를 더 따져 보게 하는 도입이므로, 자연스러운 권면형 표현인 ‘생각해 보십시오’로 옮겨 추가 논지를 분명히 했습니다.
- source_word: δειλόψυχος
  english_pob_choice: fainthearted
  chosen_korean: 비겁한 마음을 가진 사람
  alternatives_korean:
  - 겁 많은
  - 소심한
  - 약한 마음의
  lexicon: LSJ
  rationale: 단순한 소심함보다 용기 결핍을 드러내는 복합적 성격이어서, 문맥상 도덕·심리적 약함을 분명히 하는 표현을 택했습니다.
- source_word: ὠλοφύρετο ἂν ἐπʼ αὐτοῖς
  english_pob_choice: would have wailed over them
  chosen_korean: 그들 때문에 통곡했을 것이며
  alternatives_korean:
  - 그들 위에 통곡했을 것이며
  - 그들을 두고 애곡했을 것이며
  - 그들을 향해 울부짖었을 것이며
  lexicon: LSJ
  rationale: 동사의 핵심은 큰 소리의 애통이므로 ‘통곡하다’가 가장 자연스럽고 강한 한국어 대응입니다. ἐπʼ αὐτοῖς는 대상에 대한 애도의 방향을 나타내어 ‘그들 때문에’로 풀었습니다.
- source_word: ἴσως ἂν ταῦτα οὕτως εἶπεν
  english_pob_choice: perhaps she would have spoken like this
  chosen_korean: 아마 이렇게 말했을 것입니다
  alternatives_korean:
  - 어쩌면 이렇게 말했을 것입니다
  - 아마도 이런 식으로 말했을 것입니다
  - 아마 이렇게 말했을 터입니다
  lexicon: LSJ
  rationale: 뒤이어 나오는 가상 발화를 여는 완곡한 추정이므로 ‘아마’로 ἴσως의 유보성을 살렸고, ‘이렇게 말했을 것입니다’로 도입 기능을 유지했습니다.
theological_decisions:
