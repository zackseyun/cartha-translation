translation:
  language: ko
  text: 조상의 율법을 위하여 기꺼이. 왜냐하면 이 노인이 경건[a] 때문에 겪는 고통을 견뎌 내는데, 너희가— 하는 것은 부끄러운 일이기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “경건함 때문에.” 여기서 εὐσέβεια는 하나님께 대한 경외와 충실한 헌신을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 문장은 이 절에서 끝나지 않고 다음 절로 이어집니다.
    reason: cross_reference
