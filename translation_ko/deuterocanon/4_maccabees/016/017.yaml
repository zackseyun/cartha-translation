  lexicon: LSJ
  rationale: 이 단어는 육체적·정서적 고통을 아우를 수 있어, 순교 문맥의 강도를 반영하는 일반어 ‘고통’이 적절합니다.
theological_decisions:
- issue: εὐσέβεια의 번역을 ‘경건함’으로 할지 ‘경건’으로 할지
  chosen_reading: 경건함
  alternative_readings:
  - 경건
  - 신앙적 경외
  rationale: 이 문맥에서 εὐσέβεια는 단순한 내면 태도보다 하나님께 대한 충실한 삶을 가리키므로, 명사형 ‘경건함’이 의미를 가장 분명하게 드러냅니다.
  doctrine_reference: Translation philosophy §6; martyrdom and covenant faithfulness
