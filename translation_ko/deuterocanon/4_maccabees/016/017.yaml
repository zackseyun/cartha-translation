  source_fidelity: 핵심 어휘는 대체로 충실합니다. 다만 γὰρ의 논증적 연결과 αἰσχρόν의 ‘부끄러운 일’이라는 판단을 더 분명히 드러내야 하며, εὐσέβεια 관련 각주는 해당 낱말에 직접 붙어야 합니다.
  naturalness: ‘조상의 율법을 위해 기꺼이’는 앞 절에서 이어지는 의도적인 절 단편으로 유지할 수 있으나, 어순을 ‘조상의 율법을 위하여 기꺼이’로 하면 한국어에서 조금 더 자연스럽습니다. 후반은 원문의 미완 문장을 보존하면서도 ‘부끄러운 일’의 판단이 드러나도록 다듬는 것이 좋습니다.
