  lexicon: LSJ
  rationale: patrios는 조상에게서 전해 내려온 것을 가리키므로, Maccabees 문맥에서 전승된 언약적 율법이라는 뜻을 살려 ‘조상의 율법’으로 옮겼습니다.
- source_word: διὰ τὴν εὐσέβειαν
