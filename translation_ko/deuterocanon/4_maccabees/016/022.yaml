base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/016/022.yaml
  text: So you also[a], having the same faith toward God[b], do not be distressed.
  footnotes:
  - marker: a
    text: Or 'the same trust toward God.' The Greek πίστις can also carry the sense of trust or faithfulness depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'do not be embittered' or 'do not be upset.' The verb can denote being pained, vexed, or angered.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 너희도 같은 믿음을 하나님께 두고 있으니, 괴로워하지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘같은 신뢰’로도 옮길 수 있습니다. 그리스어 πίστις는 문맥에 따라 신뢰나 신실함의 뜻을 띨 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘괴로워하지 마십시오’, ‘분개하지 마십시오’, ‘상심하지 마십시오’로도 옮길 수 있습니다. 동사는 마음이 상하거나 몹시 못마땅해하는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὑμεῖς οὖν
  english_pob_choice: So you also
  chosen_korean: 그러므로 너희도
  alternatives_korean:
  - 그래서 너희도
  - 그러니 너희도
  lexicon: LSJ
  rationale: καὶ, ὑμεῖς, οὖν의 결합을 한국어에서 자연스럽게 옮기되, 앞선 권면에 잇는 추론·강조를 ‘그러므로’와 ‘너희도’로 살렸습니다.
- source_word: τὴν αὐτὴν πίστιν
  english_pob_choice: the same faith
  chosen_korean: 같은 믿음
  alternatives_korean:
  - 같은 신뢰
  - 같은 믿음의 자세
  lexicon: BDAG
  rationale: πίστις의 기본값인 ‘믿음’을 따르되, 문맥상 하나님을 향한 동일한 태도를 가리키므로 ‘같은 믿음’이 가장 सीधे하고 넓게 대응합니다.
- source_word: πρὸς τὸν θεόν
  english_pob_choice: toward God
  chosen_korean: 하나님께
  alternatives_korean:
  - 하나님을 향해
  - 하나님을 향하여
  lexicon: LSJ
  rationale: πρός + 대격의 방향성·지향성을 한국어 조사로 자연스럽게 옮겨, 믿음의 대상이 하나님임을 분명히 했습니다.
- source_word: μὴ χαλεπαίνητε
  english_pob_choice: do not be distressed
  chosen_korean: 괴로워하지 마십시오
  alternatives_korean:
  - 마음 아파하지 마십시오
  - 분개하지 마십시오
  - 상심하지 마십시오
  lexicon: LSJ
  rationale: χαλεπαίνω의 ‘괴로워하다, 화가 나다, 상하다’라는 정서적 폭을 살리면서도, 이 위로와 권면의 문맥에서 가장 자연스러운 한국어로 옮겼습니다.
theological_decisions:
- issue: πίστις의 번역
  chosen_reading: 믿음
  alternative_readings:
  - 신뢰
  - 신실함
  rationale: 이 프로젝트의 기본 용례를 따르며, 본문은 순교자들과 동일한 하나님을 향한 태도를 권면하므로 ‘믿음’이 가장 적절합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: πίστις → 믿음'
