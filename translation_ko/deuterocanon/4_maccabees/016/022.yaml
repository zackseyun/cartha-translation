  text: So you also[a], having the same faith toward God[b], do not be distressed.
  footnotes:
  - marker: a
    text: Or 'the same trust toward God.' The Greek πίστις can also carry the sense of trust or faithfulness depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'do not be embittered' or 'do not be upset.' The verb can denote being pained, vexed, or angered.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 너희도 하나님을 향한 같은 믿음[a]을 가지고 있으니, 괴로워하지 마십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘같은 신뢰’로도 옮길 수 있습니다. 그리스어 πίστις는 문맥에 따라 신뢰나 신실함을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘분개하지 마십시오’ 또는 ‘상심하지 마십시오’로도 옮길 수 있습니다. 이 동사는 마음 아파하거나 몹시 못마땅해하는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὑμεῖς οὖν
