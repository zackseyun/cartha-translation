    text: 직역하면 ‘세상의 하나님’입니다. 이 표현은 문맥상 세상을 다스리시는 하나님을 가리키는 것으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς νεωτέρους
  english_pob_choice: the younger men
  chosen_korean: 젊은이들
  alternatives_korean:
  - 젊은 남자들
  - 나이가 어린 이들
  lexicon: LSJ
  rationale: 문맥상 박해와 고문 앞에서 흔들릴 수 있는 연소한 남성 집단을 가리키므로, 자연스러운 현대어로는 ‘젊은이들’이 가장 간결하고 적절합니다.
- source_word: καταπλαγῆναι τὰς βασάνους
  english_pob_choice: be terrified by the tortures
  chosen_korean: 고문에 놀라지 않게 하십시오
  alternatives_korean:
  - 고문에 겁먹지 않게 하십시오
  - 고문에 두려워하지 않게 하십시오
  - 고문에 압도되지 않게 하십시오
  lexicon: LSJ
  rationale: καταπλάσσομαι는 두려움과 충격으로 얼어붙는 뉘앙스가 있어, ‘놀라다’가 과도한 해석 없이 현대 한국어에서 가장 자연스럽게 대응합니다.
- source_word: διὰ τὸν θεὸν τοῦ κόσμου
  english_pob_choice: for the sake of the God of the world
  chosen_korean: 세계의 하나님을 위해
  alternatives_korean:
  - 세상의 하나님 때문에
  - 세계를 다스리시는 하나님을 위해
  - 세계의 하나님께
  lexicon: LSJ
  rationale: διὰ + 대격은 여기서 목적/원인을 나타내므로 ‘~을 위해’가 적절하며, τοῦ κόσμου는 ‘세계’의 소유격으로 직역해 원문 구조를 보존했습니다.
- source_word: μετελάβετε
  english_pob_choice: you have partaken of this
  chosen_korean: 여러분은 이것에 참여하였고
  alternatives_korean:
  - 여러분은 이것을 함께 나누었고
  - 여러분은 이것에 동참하였고
  - 여러분은 이것을 받았고
  lexicon: LSJ
  rationale: μεταλαμβάνω는 어떤 것에 몫을 함께 갖다/참여하다의 뜻이므로, 대상이 생략된 상태를 살려 ‘이것에 참여하다’로 옮겼습니다.
- source_word: τοῦ βίου ἀπελαύσατε
  english_pob_choice: have enjoyed life
  chosen_korean: 생명을 누렸음을
  alternatives_korean:
  - 삶을 즐겼음을
  - 인생의 유익을 누렸음을
  - 생명의 기쁨을 누렸음을
  lexicon: LSJ
  rationale: ἀπολαύω는 ‘누리다, 즐기다’의 뜻이지만 여기서는 단순한 향락보다 주어진 생애의 몫을 누렸다는 의미가 강하므로 ‘생명을 누리다’가 가장 무난합니다.
theological_decisions:
- issue: θεὸν τοῦ κόσμου의 의미
  chosen_reading: ‘세계의 하나님’으로 옮겨, 하나님이 세계의 주권자이심을 드러내었습니다.
  alternative_readings:
  - ‘세상의 하나님’
  - ‘세계를 다스리시는 하나님’
  rationale: 원문은 ‘세계의 하나님’이라는 소유격 구조를 유지하면서도, 헬라어 표현이 다신론적 소유관계를 뜻하지 않음을 한국어에서도 오해 없이 전달해야 합니다.
  doctrine_reference: 원문 구조 보존과 단어-의미의 과도한 신학적 완곡화 방지
- issue: 본문의 권면 어조
  chosen_reading: 직접 권면문으로 합쇼체를 유지하되, ‘하십시오/기억하십시오’로 마무리했습니다.
  alternative_readings:
  - 보다 중립적인 서술체
  - 보다 전통적인 경어체
  rationale: 서간/권면의 힘을 살리기 위해 청중에게 직접 말하는 형식을 유지하는 것이 원문의 수행적 기능을 가장 잘 반영합니다.
  doctrine_reference: 화행 보존 및 독자 직접 호소
