  rationale: 원문은 ‘하나님을 위하여 죽은 사람들’이 ‘하나님께 살아 있다’고 말하지만, 그 생명의 형식을 설명하지는 않습니다. 따라서 문장의 신학적 긴장을 유지했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
