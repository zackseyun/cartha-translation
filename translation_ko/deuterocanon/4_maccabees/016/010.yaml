  text: O I[a], the mother of many and of beautiful children, a widow and alone[b], much-lamenting woman!
  footnotes:
  - marker: a
    text: Or 'of beautiful children.' The Greek καλλίπαις can refer to beauty or excellence; here 'noble children' was chosen because the context honors the children's virtue and courage.
    reason: lexical_alternative
  - marker: b
    text: The Greek opens with a lamenting interjection (ὦ); 'Alas for me' expresses its mournful force more explicitly than a simple 'Oh.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아[b], 자녀가 많고 아름다운 자녀를 둔 나[a], 과부이며 홀로 있는, 몹시 애도하는 여자입니다!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: καλλίπαις는 ‘아름다운 자녀를 둔’ 또는 ‘뛰어난 자녀를 둔’으로도 옮길 수 있습니다. 여기서는 어휘의 표면적 의미를 보존해 ‘아름다운 자녀를 둔’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ὦ는 단순한 ‘오’보다 통곡의 탄식을 강하게 드러냅니다. 한국어에서도 짧은 감탄사로 그 비탄의 시작을 살렸습니다.
    reason: lexical_alternative
