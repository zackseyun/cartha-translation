  source_fidelity: The draft accurately conveys the exhortation, moral obligation (ὀφίλετε), comprehensive suffering (πάντα πόνον), and motive of loyalty to God (διὰ τὸν θεόν). However, ‘하나님을 위해서라면’ introduces a conditional nuance (‘if it is for God’) not expressed in the Greek.
  naturalness: ‘그리고 이 때문에’ is understandable but redundant and less idiomatic for the inferential transition. ‘그러므로’ is concise, natural modern formal Korean.
  terminology: ‘하나님,’ ‘모든 고통,’ and ‘견뎌야 합니다’ are appropriate standard-Korean renderings in a formal-polite register. ‘하나님을 위하여’ renders the motivational sense without adding conditionality.
  issues:
  - severity: medium
    issue: ‘하나님을 위해서라면’ adds a conditional framing.
    rationale: διὰ τὸν θεόν expresses purpose, motive, or loyalty (‘for the sake of God’), not a conditional proposition. ‘하나님을 위하여’ preserves the source relation directly.
  - severity: low
    issue: ‘그리고 이 때문에’ is stylistically redundant.
    rationale: καὶ διὰ τοῦτο functions as an inferential continuation. ‘그러므로’ naturally conveys this in Korean without the slightly awkward additive-plus-causal combination.
  revised_text: 그러므로 여러분은 하나님을 위하여 모든 고통을 견뎌야 합니다.
