  source_fidelity: 핵심 의미는 대체로 충실합니다. μάτην의 헛됨, ἐφʼ ὑμῖν의 자녀들과 관련된 고난, ὠδῖνες의 출산 고통, 그리고 양육의 염려가 더 어렵다는 비교급을 보존합니다. 다만 원문의 직접 호격과 문장 관계를 한국어답게 다듬을 필요가 있습니다.
  naturalness: ‘너희에게 헛되이, 오 자녀들아’는 현대 표준 한국어의 어순과 호격 관습에 맞지 않으며, ‘오’와 ‘자녀들아’의 결합도 부자연스럽습니다. ‘자녀들아, 내가 너희를 위해 … 헛되이 견뎌 냈습니다’가 현대적이면서도 엄숙한 문맥에 알맞습니다.
  terminology: ‘산고’는 ὠδῖνας의 구체적인 출산 고통을 자연스럽게 나타냅니다. ‘너희를 양육하면서 겪은 더 큰 걱정’은 ἀνατροφῆς를 실제 자녀 양육의 문맥으로 명확히 하고, χαλεπωτέρας의 비교 의미를 유지합니다.
  issues:
