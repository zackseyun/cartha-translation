    issue: 직접 호격과 문장 어순이 부자연스러움
    rationale: ‘너희에게 헛되이, 오 자녀들아’는 그리스어 어순을 지나치게 따른 표현입니다. 한국어에서는 호격을 문두에 두고 ‘너희를 위해’ 또는 ‘너희 때문에’로 관계를 표현하는 편이 자연스럽습니다.
