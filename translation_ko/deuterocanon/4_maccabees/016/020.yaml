  terminology: ‘민족의 시조’는 ἐθνοπάτωρ의 의미를 적절히 전달합니다. σφαγιάσαι는 직접적인 살해 표현인 ‘죽이려고’로 유지하되, 제의적 표현을 본문에 덧붙이지 않았습니다. ‘아버지의 손’은 πατρῴαν의 문맥상 의미를 반영합니다.
