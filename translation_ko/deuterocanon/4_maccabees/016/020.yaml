  yaml_path: translation/deuterocanon/4_maccabees/016/020.yaml
  text: for whose sake even our father Abraham hurried to slaughter Isaac[a], his son, the ancestor of the nation, and, seeing the ancestral hand bearing the sword descending upon him[b], did not shrink back.
  footnotes:
  - marker: a
    text: Or 'his son, who would become the father of the nation.' The Greek compound ἐθνοπάτωρ denotes an ancestor or progenitor of a people.
    reason: lexical_alternative
  - marker: b
    text: Or 'did not flinch' / 'did not cower.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분을 위하여 우리 조상 아브라함은 그의 아들, 곧 민족의 시조인 이삭을 죽이려고 서둘렀으며, 칼을 든 조상들의 손이 그에게로 내려오는 것을 보고도 물러서지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘민족의 시조인’은 ἐθνοπάτωρ(한 민족의 아버지/시조)라는 합성어의 뜻을 풀어 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘물러서지 않았습니다’는 ‘주춤하지 않았습니다’, ‘겁내지 않았습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διʼ ὃν
  english_pob_choice: for whose sake
  chosen_korean: 그분을 위하여
  alternatives_korean:
  - 그 때문에
  - 그를 위하여
  - 그분 때문에
  lexicon: LSJ
  rationale: 앞선 문맥의 대상을 가리키는 관계대명사구로, 한국어에서는 원인보다 동기·목적의 뉘앙스를 살린 ‘그분을 위하여’가 가장 자연스럽고 본문의 수사적 힘도 유지합니다.
- source_word: ἔσπευδεν
  english_pob_choice: hurried
  chosen_korean: 서둘렀으며
  alternatives_korean:
  - 급히 하였으며
  - 재촉하였으며
  - 서두르셨으며
  lexicon: LSJ
  rationale: 동작의 빠름과 결연함을 함께 살리기 위해 ‘서둘렀으며’로 옮겼습니다.
- source_word: σφαγιάσαι
  english_pob_choice: to slaughter
  chosen_korean: 죽이려고
  alternatives_korean:
  - 도살하려고
  - 학살하려고
  - 희생제물로 바치려고
  lexicon: LSJ
  rationale: 그리스어는 제의적 완곡어보다 더 직접적이고 거친 살해 행위를 가리키므로, 한국어도 의미를 과잉 신학화하지 않는 범위에서 강한 표현으로 옮겼습니다.
- source_word: τὸν ἐθνοπάτορα υἱόν
  english_pob_choice: his son, the ancestor of the nation
  chosen_korean: 그의 아들, 곧 민족의 시조인
  alternatives_korean:
  - 그의 아들, 곧 민족의 조상인
  - 그의 아들, 곧 민족의 아버지인
  - 그의 아들, 곧 한 민족의 조상이 될
  lexicon: LSJ
  rationale: ἐθνοπάτωρ는 ‘민족의 아버지/시조’라는 뜻이지만 여기서는 이삭을 설명하는 동격이므로, ‘민족의 시조인’으로 처리해 문맥상 의미를 분명히 했습니다.
- source_word: πατρῴαν χεῖρα ξιφηφόρον
  english_pob_choice: the ancestral hand bearing the sword
  chosen_korean: 칼을 든 조상들의 손이
  alternatives_korean:
  - 칼을 든 아버지의 손이
  - 조상들의 검 든 손이
  - 칼을 든 선조의 손이
  lexicon: LSJ
  rationale: πατρῴαν은 ‘아버지의’보다 ‘조상들의/선조의’에 가까운 뜻이라서 ‘조상들의 손’으로 옮겼고, ξιφηφόρον은 ‘칼을 든’으로 자연스럽게 풀었습니다.
- source_word: οὐκ ἔπτηξεν
  english_pob_choice: did not shrink back
  chosen_korean: 물러서지 않았습니다
  alternatives_korean:
  - 주춤하지 않았습니다
  - 겁내지 않았습니다
  - 뒤로 물러서지 않았습니다
  lexicon: LSJ
  rationale: 이 동사는 두려움 때문에 주춤하거나 움츠러드는 뜻을 담으므로, 한국어에서는 결의의 뉘앙스를 살린 ‘물러서지 않았습니다’가 가장 적절합니다.
theological_decisions:
- issue: 아브라함-이삭 전승을 어떤 수준으로 직역할지
  chosen_reading: ‘죽이려고 서둘렀으며’로 직접적이고 날카롭게 유지했습니다.
  alternative_readings:
  - 희생제물로 바치려고 서둘렀으며
  - 바치려고 서둘렀으며
  - 제물로 드리려고 서둘렀으며
  rationale: 이 절은 창세기식 완곡어보다 ‘slaughter’의 폭력성과 결연함을 강조하므로, 전통적 예배 언어로 부드럽게 바꾸지 않았습니다.
  doctrine_reference: 번역 원칙 §§1, 6
- issue: ‘διʼ ὃν’의 지시 대상을 본문에서 얼마나 구체화할지
  chosen_reading: 문맥에 맡기고 ‘그분을 위하여’로만 처리했습니다.
  alternative_readings:
  - 아브라함을 위하여
  - 이삭을 위하여
  - 그 이유로
  rationale: 헬라어는 앞 문맥의 대상을 의존하므로, 한국어 본문에서 특정 명사를 덧붙여 의미를 과잉 결정하지 않았습니다.
  doctrine_reference: 번역 원칙 §3
