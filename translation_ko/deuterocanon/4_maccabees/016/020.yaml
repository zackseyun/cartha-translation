  source_fidelity: 수정이 필요합니다. πατρῴαν χεῖρα는 여기서 복수의 ‘조상들의 손’이 아니라, 이삭을 향해 내려오는 아브라함의 ‘아버지의 손/부친의 손’을 가리킵니다. 또한 διʼ ὃν의 선행사는 본 절만으로 확정되지 않으므로, 원문에 없는 높임과 인격성을 강하게 부여하는 ‘그분’은 피하는 편이 안전합니다.
