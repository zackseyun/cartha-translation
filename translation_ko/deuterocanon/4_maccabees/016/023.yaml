  text: For[a], though they knew that reverence toward God is not irrational, they did not shrink back from the pains.
  footnotes:
  - marker: a
    text: Or, more formally, 'knowing that to be pious is not irrational, not to resist the pains.' The Greek is compressed, and the clause can be represented more literally this way.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 경건하게 사는 것이 비이성적이지 않다는 것을 알고 있었지만, 고통에 맞서 물러서지는 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 문자적으로는 ‘경건하게 사는 것이 비이성적이지 않다는 것을 알고서, 고통에 맞서지 않는 것’으로 옮길 수 있습니다. 헬라어는 매우 압축되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλόγιστον
  english_pob_choice: not irrational
  chosen_korean: 비이성적이지 않다
  alternatives_korean:
  - 무분별하지 않다
  - 비합리적이지 않다
  - 이성이 없는 것이 아니다
  lexicon: LSJ
  rationale: ἀλόγιστον은 ‘이성이 없는, 비이성적인’ 뜻이므로, 한국어에서는 부정형으로 옮겨 원문의 판단을 그대로 살렸습니다.
- source_word: εὐσεβεῖν
  english_pob_choice: reverence toward God
  chosen_korean: 경건하게 살다
  alternatives_korean:
  - 하나님을 경외하다
  - 경건하다
  - 신앙적으로 살다
  lexicon: BDAG
  rationale: 이 동사는 단순한 내면 감정보다 하나님께 대한 경건한 삶을 가리키므로, 한국어에서 자연스럽고 직접적인 ‘경건하게 살다’로 옮겼습니다.
- source_word: μὴ ἀνθίστασθαι
  english_pob_choice: did not shrink back from
  chosen_korean: 물러서지 않다
  alternatives_korean:
  - 맞서지 않다
  - 저항하지 않다
  - 뒤로 물러나지 않다
  lexicon: BDAG
  rationale: 문맥상 고통 앞에서 겁내어 물러서지 않는 태도를 가리키므로, ‘물러서지 않다’가 비유적이면서도 원문의 대항/후퇴의 뉘앙스를 살립니다.
- source_word: τοῖς πόνοις
  english_pob_choice: the pains
  chosen_korean: 고통
  alternatives_korean:
  - 고난
  - 통증들
  - 고통들
  lexicon: BDAG
  rationale: 순교 문맥에서 πόνοι는 단순한 신체 통증보다 가해지는 고통과 고난을 포괄하므로, 한국어에서는 자연스럽게 ‘고통’으로 옮겼습니다.
theological_decisions:
- issue: 경건과 이성의 관계
  chosen_reading: 본문은 경건이 비이성적이지 않다고 말하며, 그 인식을 가진 사람들이 고통 앞에서도 물러서지 않았다고 읽었습니다.
  alternative_readings:
  - 경건한 것이 비이성적이라는 뜻으로 읽는 해석
  - ‘경건하게 살다’와 ‘고통에 맞서지 않다’를 따로 분리하는 해석
  rationale: 4마카베오스 전체의 논지는 경건한 이성이 정념을 다스린다는 데 있으므로, 문장의 압축성을 유지하면서도 그 핵심을 한국어로 분명하게 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Maintain theological tension; do not flatten the source''s argument'
