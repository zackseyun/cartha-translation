  naturalness: 현 문장은 현대 한국어로 대체로 자연스럽지만, 원문의 부정사 구문을 과거의 서술 사건(‘알고 있었지만 … 물러서지 않았습니다’)으로 바꾸었습니다. 수정문은 원문의 일반적 판단을 자연스럽고 격식 있는 합쇼체로 보존합니다.
  terminology: ‘경건하게 살다’는 εὐσεβεῖν에 적절합니다. τοῖς πόνοις는 ‘고통’, ἀνθίστασθαι는 문맥상 ‘고통에 맞서 버티다’로 옮겨 대항과 인내의 뜻을 함께 살렸습니다. ‘비이성적인 일’은 ἀλόγιστον의 판단을 자연스럽게 나타냅니다.
