translation:
  language: ko
  text: 당신은 히브리어로 그 아들들에게 말씀하고 계셨습니다[a]. “아들들아, 너희가 민족의 증언을 위하여 부름받은 이 싸움은 고귀하니, 힘써 싸우십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “히브리 말로.” ἐν τῇ Ἑβραΐδι φωνῇ는 사용된 언어를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγες
  english_pob_choice: you were saying
  chosen_korean: 말씀하고 있었습니다
  alternatives_korean:
  - 말하고 있었습니다
  - 계속 말씀하셨습니다
  lexicon: LSJ
  rationale: 미완료과거의 진행·반복 뉘앙스를 한국어로 자연스럽게 살리면서, 회상 장면의 직접화법에 맞게 정중한 표현을 택했습니다.
- source_word: ἐν τῇ Ἑβραΐδι φωνῇ
  english_pob_choice: in the Hebrew language
  chosen_korean: 히브리어로
  alternatives_korean:
  - 히브리 언어로
  - 히브리 말로
  lexicon: LSJ
  rationale: 언어를 가리키는 표현이므로 현대 한국어에서는 간결한 ‘히브리어로’가 가장 자연스럽고 원문의 기능을 잘 드러냅니다.
- source_word: τοῖς παισὶν / Ὦ παῖδες
  english_pob_choice: to the children / O children
  chosen_korean: 그 아이들 / 아이들아
  alternatives_korean:
  - 그 아들들 / 아들들아
  - 그 자녀들 / 자녀들아
  lexicon: LSJ
  rationale: 여기서는 어머니가 아들들에게 직접 호소하는 장면이지만, 그리스어 παις/παῖδες의 직접 호칭을 한국어에서 지나치게 성별화하지 않고 자연스럽게 살리기 위해 ‘아이들’로 옮겼습니다.
- source_word: γενναῖος ὁ ἀγών
  english_pob_choice: noble is the contest
  chosen_korean: 이 경기는 고귀하니
  alternatives_korean:
  - 이 경기는 장하니
  - 이 싸움은 고귀하니
  - 이 경기는 위대하니
  lexicon: LSJ
  rationale: ἀγών의 경합·투쟁 이미지를 살리면서도, 4마카베오스의 영웅적 시험이라는 문맥에 맞게 ‘경기’로 옮기고 γενναῖος는 도덕적·고상한 가치를 드러내는 ‘고귀하다’로 처리했습니다.
- source_word: ὑπὲρ τῆς διαμαρτυρίας τοῦ ἔθνους
  english_pob_choice: for the witness of the nation
  chosen_korean: 민족의 증언을 위하여
  alternatives_korean:
  - 민족의 증거를 위하여
  - 민족의 증언 때문에
  - 민족을 위한 증언으로
  lexicon: LSJ
  rationale: διαμαρτυρία는 ‘증언/증거’의 공적 진술 성격을 지니므로, 공동체의 공개적 신앙 고백이라는 뜻이 드러나도록 ‘증언’을 택했습니다.
- source_word: ἐναγωνίσασθε
  english_pob_choice: you must struggle earnestly
  chosen_korean: 힘써 싸우십시오
  alternatives_korean:
  - 간절히 싸우십시오
  - 열심히 պայք하십시오
  - 힘써 분투하십시오
  lexicon: LSJ
  rationale: 명령형의 긴박성과 ἀγών 어근의 투쟁성을 살리되, 한국어 합쇼체에서 자연스럽고 강한 권면이 되도록 ‘힘써 싸우십시오’로 옮겼습니다.
theological_decisions:
- issue: 4 Maccabees 16:16의 호칭을 한국어로 어떻게 살릴 것인가
  chosen_reading: ‘아이들아’로 직접 부르면서도 문장 전체는 정중한 합쇼체로 유지했습니다.
  alternative_readings:
  - ‘아들들아’로 성별을 분명히 하기
  - ‘자녀들아’로 더 포괄적으로 옮기기
  rationale: 원문은 어머니가 아들들에게 말하는 장면이지만, 한국어 본문에서 지나친 성별화보다 직접 호소의 힘과 문맥의 긴박성을 살리는 것이 더 중요하다고 보았습니다. 따라서 호칭은 자연스럽게 두고, 본문은 정중한 권면체로 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 4
- issue: διαμαρτυρία를 ‘증언’으로 옮길지 ‘증거/증언’으로 옮길지
  chosen_reading: ‘민족의 증언’으로 옮겼습니다.
  alternative_readings:
  - ‘민족의 증거’
  - ‘민족의 증거와 증언’
  rationale: 이 단어는 법정적·공적 증언의 뉘앙스를 지니며, 본문 전체의 순교적 증언 주제를 가장 잘 드러내므로 ‘증언’이 적절합니다. 후기 기독교의 기술용어를 덧씌우지 않으면서도 공동체적 고백의 의미를 보존합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
