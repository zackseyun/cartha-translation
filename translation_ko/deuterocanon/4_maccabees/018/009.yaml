revisions:
- from: 그러나 이 아들들이 장성했을 때 그들의 아버지는 죽었습니다. 그 사람은 복됩니다. 좋은 자식들의 삶을 누린 뒤에, 자식 없음의 때를 겪지 않았기 때문입니다.[a][b]
  to: 이 아들들이 장성한 뒤에 그들의 아버지가 죽었습니다. 그 사람은 복된 사람이었습니다. 훌륭한 자녀를 둔 삶을 살아 본 뒤에[a], 자녀가 없는 때를 고통스럽게 겪지 않았기 때문입니다.[b]
  rationale: εὐτεκνίας의 수식 관계를 바로잡아 아버지가 누린 ‘훌륭한 자녀를 둔 삶’으로 표현했습니다. μακάριος의 과거 서술상 평가를 자연스러운 합쇼체로 조정했고, ὠδυνήθη의 고통의 의미를 드러냈습니다. 각주 b는 문맥적 이해를 제시하되 ‘가리킬 수 있습니다’라고 하여 본문이 허용하는 여지를 보존했습니다.
  reviewer_model: gpt-5.6-terra
