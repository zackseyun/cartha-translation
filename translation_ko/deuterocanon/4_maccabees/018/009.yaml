base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/009.yaml
  text: But when these sons had reached adulthood[a], their father died. Blessed was that man, for after experiencing the life of having good children[b], he did not suffer the season of childlessness.
  footnotes:
  - marker: a
    text: Or, 'after knowing the life of fruitful offspring.' The Greek εὐτεκνία can emphasize being blessed with children, even many children, and carries a positive evaluative sense.
    reason: lexical_alternative
  - marker: b
    text: That is, he died before he had to endure the anguish of being left childless after the deaths of his sons.
    reason: cross_reference
translation:
  language: ko
  text: 이 아들들이 장성한 뒤에 그들의 아버지가 죽었습니다. 그 사람은 복된 사람이었습니다. 훌륭한 자녀를 둔 삶을 살아 본 뒤에[a], 자녀가 없는 때를 고통스럽게 겪지 않았기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자녀 복을 누린 삶을 알고 난 뒤에’로 옮길 수 있습니다. εὐτεκνία는 훌륭한 자녀를 두거나 자녀를 풍성히 얻은 복된 상태를 긍정적으로 표현합니다.
    reason: lexical_alternative
  - marker: b
    text: 문맥상, 아들들이 죽은 뒤 자녀 없는 비통한 상태를 겪게 되는 일을 가리킬 수 있습니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἐνηλίκων γενομένων
  english_pob_choice: had reached adulthood
  chosen_korean: 장성했을 때
  alternatives_korean:
  - 성인이 되었을 때
  - 어른이 되었을 때
  - 장년이 되었을 때
  lexicon: LSJ
  rationale: ἐνηλίκων γενομένων은 ‘성년/장성’에 이른 상태를 가리키므로, 간결하고 자연스러운 ‘장성했을 때’가 시간적 완료를 잘 살립니다.
- source_word: ἐτελεύτησεν
  english_pob_choice: died
  chosen_korean: 죽었습니다
  alternatives_korean:
  - 세상을 떠났습니다
  - 숨을 거두었습니다
  - 돌아가셨습니다
  lexicon: BDAG
  rationale: 이 동사는 죽음을 직접적으로 말하므로, 완곡화하지 않고 현대적인 서술에 맞는 ‘죽었습니다’를 택했습니다.
- source_word: μακάριος
  english_pob_choice: Blessed
  chosen_korean: 복됩니다
  alternatives_korean:
  - 복된 사람입니다
  - 복이 있습니다
  - 행복합니다
  lexicon: BDAG
  rationale: 원문은 단순한 감정이 아니라 신적 호의 아래 있는 상태를 나타내므로, 종교적 뉘앙스를 유지하는 ‘복됩니다’가 적절합니다.
- source_word: εὐτεκνίας βίον ἐπιστήσας
  english_pob_choice: after experiencing the life of having good children
  chosen_korean: 좋은 자식들의 삶을 누린 뒤에
  alternatives_korean:
  - 자녀 복 있는 삶을 알고 난 뒤에
  - 많은 자식을 둔 삶을 겪은 뒤에
  - 좋은 자녀를 둔 삶을 경험한 뒤에
  lexicon: LSJ
  rationale: εὐτεκνία는 단순한 출산이 아니라 자녀가 잘 주어진 상태를 가리키므로, POB의 의미를 따라 ‘좋은 자식들의 삶’으로 옮기되 한국어로는 ‘누린 뒤에’가 가장 자연스럽습니다.
- source_word: τὸν τῆς ἀτεκνίας οὐκ ὠδυνήθη καιρόν
  english_pob_choice: he did not suffer the season of childlessness
  chosen_korean: 자식 없음의 때를 겪지 않았기 때문입니다
  alternatives_korean:
  - 자식 없음의 시기를 고통으로 맞지 않았기 때문입니다
  - 자식 없는 기간의 아픔을 당하지 않았기 때문입니다
  - 무자식의 때를 괴로워하지 않았기 때문입니다
  lexicon: BDAG
  rationale: ἀτεκνία는 ‘자식 없음/무자식 상태’를 뜻하고, καιρός는 단순한 시간보다 특정한 때를 가리키므로 ‘자식 없음의 때’로 살렸습니다.
theological_decisions:
- issue: 아버지의 ‘복됨’이 무엇에 근거하는지
  chosen_reading: 그는 아들들의 죽음으로 인한 자식 없음의 상태를 겪기 전에 죽었기 때문에 복된 사람으로 불립니다.
  alternative_readings:
  - 단순히 자녀를 둔 삶 자체가 복되다는 일반 진술로 읽을 수 있습니다.
  - 불임이나 자녀 부재 자체에 대한 일반론으로 읽을 수 있습니다.
  rationale: 문맥상 이 절은 아들들의 죽음 이후에 남겨질 상실을 대비시키므로, ‘자식 없음’은 추상적 불임이 아니라 그 비통한 상태를 가리키는 것으로 읽는 것이 가장 자연스럽습니다.
  doctrine_reference: 문맥 우선 해석; 원문이 지닌 서사적 긴장을 보존
