base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/023.yaml
  text: But the children of Abraham[a], together with their victory-bearing mother, are gathered to the place of their fathers[b], having received pure and immortal souls from God.
  footnotes:
  - marker: a
    text: Or 'join the company of their fathers'; the Greek verb can emphasize being in company together, not only being gathered.
    reason: lexical_alternative
  - marker: b
    text: '''Victory-bearing mother'' preserves the Greek athletic imagery of contest and prize; alternatively, ''prize-winning mother.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 아브라함의 아들들은[a] 승리의 상을 받은 어머니와 함께[b] 조상들의 처소에 함께 모여 있으며, 하나님에게서 깨끗하고 불멸하는 영혼들을 받았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아브라함의 자녀들’. 그러나 여기서는 순교한 남성 형제들을 가리키므로 ‘아들들’로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: ‘승리의 상을 받은 어머니’는 경기와 상에 관한 ἀθλοφόρος의 비유를 살린 표현입니다. ‘상을 받은 어머니’ 또는 ‘승리한 어머니’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀβραμιαῖοι ... παῖδες
  english_pob_choice: the sons of Abraham
  chosen_korean: 아브라함의 아들들
  alternatives_korean:
