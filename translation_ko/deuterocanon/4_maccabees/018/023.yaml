  lexicon: LSJ
  rationale: ἀθλοφόρος의 경기·상징을 살리면서도 한국어에서 자연스럽게 읽히도록 ‘승리를 지닌’으로 옮겼습니다.
- source_word: εἰς πατέρων χῶρον
  english_pob_choice: to the place of their fathers
  chosen_korean: 조상들의 자리로
  alternatives_korean:
  - 조상들의 곳으로
  - 아버지들의 장소로
  - 조상들의 땅으로
  lexicon: LSJ
  rationale: χῶρος의 ‘장소/자리’ 의미를 살리되, 한국어에서는 인물적·관계적 뉘앙스가 강한 ‘조상들의 자리’가 가장 자연스럽습니다.
- source_word: συναγελιᾶζονται
  english_pob_choice: are gathered
  chosen_korean: 모여들었습니다
  alternatives_korean:
  - 함께 모였습니다
  - 한데 모였습니다
  - 모여 있습니다
  lexicon: LSJ
  rationale: 함께 속하게 되는 움직임을 살리면서, 단순한 정적 집합보다 공동체적 귀속을 드러내는 표현으로 옮겼습니다.
- source_word: ψυχὰς ἁγνὰς καὶ ἀθανάτους
  english_pob_choice: pure and immortal souls
  chosen_korean: 깨끗하고 불멸하는 영혼들
  alternatives_korean:
  - 순결하고 불멸하는 영혼들
  - 거룩하고 불멸하는 영혼들
  - 깨끗하고 죽지 않는 영혼들
  lexicon: LSJ
  rationale: ἁγνός는 윤리적·제의적 ‘깨끗함’이 적절하고, ἀθάνατος는 ‘불멸하는’으로 직접 살렸습니다. ‘영혼’은 사후 보상을 말하는 문맥을 반영합니다.
- source_word: ἀπειληφότες παρὰ τοῦ θεοῦ
  english_pob_choice: having received ... from God
  chosen_korean: 하나님에게서 ... 받았기 때문입니다
  alternatives_korean:
  - 하나님으로부터 ... 받았기 때문입니다
  - 하나님께로부터 ... 받았기 때문입니다
  lexicon: LSJ
  rationale: παρά with genitive의 출처 의미를 ‘하나님에게서’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 사후 도착지인 εἰς πατέρων χῶρον의 범위
  chosen_reading: ‘조상들의 자리로’라고 옮겨, 특정한 후대 교리 용어(천국, 낙원, 아브라함의 품)를 덧붙이지 않았습니다.
  alternative_readings:
  - 천국으로
  - 낙원으로
  - 아브라함의 품으로
  rationale: 원문은 조상들의 거처/공동체를 말하지만, 구체적 사후 장소를 명시하지 않으므로 번역도 그 긴장을 보존해야 합니다.
  doctrine_reference: theological restraint
- issue: ψυχὰς ἁγνὰς καὶ ἀθανάτους의 존재론적 표현
  chosen_reading: ‘깨끗하고 불멸하는 영혼들’로 번역해, 순교자들이 하나님에게서 받은 사후적 생명 상태를 드러냈습니다.
  alternative_readings:
  - 깨끗하고 불멸하는 삶
  - 순결하고 죽지 않는 삶
  rationale: 문맥상 단순한 생애 연장이 아니라 하나님께서 주시는 사후 보상을 말하므로 ‘영혼들’이 가장 적절합니다.
  doctrine_reference: anthropology and eschatology
