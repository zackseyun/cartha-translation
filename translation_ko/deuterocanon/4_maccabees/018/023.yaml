  source_fidelity: 핵심 어휘와 사후 세계의 절제된 표현은 대체로 잘 반영되었습니다. 다만 συναγελιᾶζονται는 단순히 ‘모여들다’보다 함께 한 무리를 이루고 있는 뜻을 지니며, 현재 시제입니다. 또한 완료분사 ἀπειληφότες는 이유를 나타내는 ‘받았기 때문입니다’가 아니라 ‘받고서/받은 이들로서’라는 동반 상황으로 옮기는 것이 정확합니다.
  naturalness: ‘승리를 지닌 어머니’는 한국어에서 다소 부자연스럽고 ἀθλοφόρος의 경기 및 상의 이미지를 충분히 전달하지 못합니다. ‘승리의 상을 받은 어머니’가 현대 표준어 합쇼체에서 더 자연스럽고 원문의 비유를 보존합니다. ‘조상들의 처소에 함께 모여 있습니다’는 목적지와 공동체성을 자연스럽게 나타냅니다.
  terminology: ‘아브라함의 아들들’, ‘조상들의 처소’, ‘깨끗하고 불멸하는 영혼들’, ‘하나님’은 문맥과 원어에 적절합니다. ‘처소’는 χῶρον을 천국 등 특정 교리적 장소로 과도하게 규정하지 않습니다.
