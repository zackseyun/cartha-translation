  yaml_path: translation/deuterocanon/4_maccabees/018/002.yaml
  text: knowing that godly reason is master of the passions[b][a], and not only of inward sufferings but also of outward pains.
  footnotes:
  - marker: a
    text: Or 'pious reason.' The Greek phrase is a key expression in 4 Maccabees for reason shaped by reverence toward God.
    reason: lexical_alternative
  - marker: b
    text: The Greek distinguishes inner πάθη ('passions') from outward πόνοι ('pains' or 'sufferings').
    reason: lexical_alternative
translation:
  language: ko
  text: 경건한 이성[^[a]]이 정념들의 지배자이며, 안에서의 고통들뿐 아니라 밖에서의 고통들도 다스린다는 것을 알고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '경건한 이성적 판단'. 이 구절은 하나님을 경외하는 태도에 의해 빚어진 이성이 정념과 고통을 다스린다는 4마카베오스의 핵심 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκοντες
  english_pob_choice: knowing
  chosen_korean: 알고 있었습니다
  alternatives_korean:
  - 알면서
  - 깨닫고 있었습니다
  lexicon: BDAG
  rationale: 분사로 앞 문장의 근거를 제시하므로, 과도한 해석 없이 배경 인식의 뉘앙스를 살린 과거 진행형으로 옮겼습니다.
- source_word: ὁ εὐσεβὴς λογισμός
  english_pob_choice: godly reason
  chosen_korean: 경건한 이성
  alternatives_korean:
  - 경건한 사고
  - 경건한 이성적 판단
  - 경건한 이성력
  lexicon: LSJ
  rationale: 4마카베오스의 핵심 개념인 λογισμός의 이성·판단의 의미를 살리되, εὐσεβής의 종교적 성격은 '경건한'으로 반영했습니다.
- source_word: τῶν παθῶν
  english_pob_choice: the passions
  chosen_korean: 정념들
  alternatives_korean:
  - 열정들
  - 욕망들
  - 수동적 감정들
  lexicon: LSJ
  rationale: 파토스 계열의 철학적 용어로서 단순한 '고통'이 아니라 내적 충동·정념을 가리키므로, 외적 고통과의 대조를 유지하는 '정념들'을 택했습니다.
- source_word: τῶν ἔνδοθεν ... τῶν ἔξωθεν πόνων
  english_pob_choice: inward sufferings ... outward pains
  chosen_korean: 안에서의 고통들뿐 아니라 밖에서의 고통들
  alternatives_korean:
  - 내적인 고통들뿐 아니라 외적인 고통들
  - 내면의 고통들뿐 아니라 바깥의 고통들
  lexicon: LSJ
  rationale: ἔνδοθεν/ἔξωθεν의 대조를 한국어의 '안/밖'으로 자연스럽게 살려, 내적·외적 고통의 구분을 유지했습니다.
theological_decisions:
- issue: εὐσεβὴς λογισμός의 신학·철학적 핵심을 한국어로 어떻게 보존할지
  chosen_reading: 경건한 이성
  alternative_readings:
