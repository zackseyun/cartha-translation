base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/007.yaml
  text: For I remained a pure virgin[a], and I did not go beyond my father's house; rather[b], I guarded the rib that had been built.
  footnotes:
  - marker: a
    text: Or 'I did not transgress the bounds of my father's house.' The Greek expression may imply both literal remaining within the paternal household and moral restraint.
    reason: alternative_reading
  - marker: b
    text: Or 'the side that had been built.' The phrase likely echoes the creation of woman from Adam's side/rib in Genesis, here used as a modest metaphor for preserved chastity.
    reason: lexical_alternative
translation:
  language: ko
  text: 저는 순결한 처녀였고, 제 아버지의 집을 넘어서지 않았습니다.[a] 오히려 저는 지어진 갈비뼈를 지켰습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 아버지 집의 경계를 넘지 않았다.’ 이 그리스어 표현은 아버지의 집안에 물리적으로 머문다는 뜻과 도덕적 절제를 함께 함의할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘지어진 옆구리.’ 이 표현은 아담의 옆구리/갈비뼈로부터 여자를 지으신 창세기 장면을 메아리치며, 여기서는 정숙을 보존한 상태를 은유적으로 나타내는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενήθην
  english_pob_choice: remained
  chosen_korean: 되었고
  alternatives_korean:
  - 머물렀고
  - 남아 있었고
  lexicon: BDAG
  rationale: 직역하면 ‘되었다’이지만, 문맥상 처녀성을 획득했다는 뜻이 아니라 그 상태를 유지했다는 고백이므로 한국어에서는 자연스러운 서술형으로 옮기되, 단정적 변화처럼 읽히지 않게 처리했습니다.
- source_word: παρθένος ἁγνή
  english_pob_choice: a pure virgin
  chosen_korean: 순결한 처녀
  alternatives_korean:
  - 깨끗한 처녀
  - 정결한 처녀
  lexicon: BDAG
  rationale: παρθένος의 핵심은 ‘처녀’이고, ἁγνή는 성적 순결의 의미가 강하므로 ‘순결한’이 두 요소를 가장 직접적으로 반영합니다.
- source_word: οὐχ ὑπερέβην πατρικὸν οἶκον
  english_pob_choice: I did not go beyond my father's house
  chosen_korean: 내 아버지의 집을 넘어서지 않았습니다
  alternatives_korean:
  - 내 아버지의 집을 떠나지 않았습니다
  - 아버지 집의 경계를 넘지 않았습니다
  lexicon: BDAG
  rationale: ὑπερβαίνω의 ‘넘다/넘어가다’라는 이미지를 살려, 물리적 거처와 규범적 경계를 동시에 떠올리게 하는 표현을 유지했습니다.
- source_word: τὴν ᾠκοδομημένην πλευράν
  english_pob_choice: the rib that had been built
  chosen_korean: 지어진 갈비뼈
  alternatives_korean:
  - 지어진 옆구리
  - 만들어진 갈비뼈
  lexicon: LSJ
  rationale: πλευρά는 ‘옆구리/갈비뼈’ 모두 가능하지만, 창세기 인유를 살리면서 한국어 성경 독자가 알아듣기 쉬운 쪽으로 ‘갈비뼈’를 택했습니다. ᾠκοδομημένην의 ‘지어진’은 그 형상과 창조 언어를 보존합니다.
theological_decisions:
- issue: ‘아버지의 집을 넘어서지 않았다’의 의미 범위
  chosen_reading: 주거적 의미와 도덕적 경계의 이중 가능성을 본문에서 열어 둡니다.
  alternative_readings:
  - 아버지의 집을 떠나지 않았다
  - 아버지의 집의 경계를 범하지 않았다
  rationale: 그리스어 표현은 단순한 외출 금지인지, 가부장적 집안의 경계 안에 머묾인지, 혹은 순결의 비유인지 한쪽으로만 고정되지 않습니다. 번역도 그 긴장을 유지해야 합니다.
  doctrine_reference: Translation philosophy §3
- issue: ‘지어진 갈비뼈’의 창세기 인유
  chosen_reading: 직설적 성적 설명으로 풀지 않고 비유를 그대로 둡니다.
  alternative_readings:
  - 순결을 지켰다
  - 남자의 갈비뼈로 지음 받은 그 부분
  rationale: 본문은 노골적 설명보다 창세기 2장의 창조 언어를 빌린 문학적 표현을 사용합니다. 이를 보존하는 편이 원문 효과를 더 정확히 전달합니다.
  doctrine_reference: Translation philosophy §§1, 6
