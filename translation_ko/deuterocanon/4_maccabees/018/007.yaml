  source_fidelity: 핵심 의미와 창세기 2장의 ‘지어진 πλευρά’ 인유를 대체로 보존했습니다. 다만 ἐγενήθην을 ‘처녀가 되었고’로 옮기면 한국어에서 처녀성이 새로 획득된 상태처럼 들릴 수 있어, 문맥상 상태를 진술하는 자연스러운 표현으로 고쳐야 합니다. ὑπερέβην의 의도적으로 열려 있는 ‘넘다’의 비유도 유지하는 것이 적절합니다.
  naturalness: ‘순결한 처녀가 되었고’는 현대 한국어에서 부자연스럽고 문맥에 맞지 않는 변화의 뉘앙스를 냅니다. ‘순결한 처녀였고’가 자연스럽습니다. 또한 각주 표지는 해당 어구 바로 뒤에 두어 참조 대상이 분명하도록 조정해야 합니다.
  terminology: ‘순결한 처녀’, ‘아버지의 집을 넘어서지 않았습니다’, ‘지어진 갈비뼈’는 각각 ἁγνή παρθένος, πατρικὸν οἶκον을 넘지 않음, ᾠκοδομημένην πλευράν의 문학적·창세기적 어감을 적절히 보존합니다. ‘갈비뼈’는 가능한 번역이며, ‘옆구리’라는 대안은 각주에 유지합니다.
