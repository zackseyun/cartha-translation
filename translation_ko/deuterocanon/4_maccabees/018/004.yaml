  - 더 넓은 속죄론을 이 절 자체에 곧바로 덧씌우는 읽기
  rationale: 원문은 분명한 인과성을 말하지만, 이 절 하나만으로 더 넓은 속죄 신학을 확정할 필요는 없습니다. 본문이 말하는 범위 안에서 공헌의 실재를 그대로 살렸습니다.
  doctrine_reference: 문맥에 따른 인과성 유지, 과도한 신학적 확대 해석 보류
