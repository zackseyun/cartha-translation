theological_decisions:
- issue: martyrs의 국가적 구원에 대한 인과성
  chosen_reading: 이 절은 그들 때문에 민족이 평화를 누리고 질서가 회복되었다고 직접 말하며, 그들의 공헌을 약화시키지 않습니다.
