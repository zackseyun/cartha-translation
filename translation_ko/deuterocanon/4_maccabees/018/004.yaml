  yaml_path: translation/deuterocanon/4_maccabees/018/004.yaml
  text: And because of them the nation was at peace[a], and, having renewed good order in the homeland[b], it has besieged the enemies completely.
  footnotes:
  - marker: a
    text: Or 'through them'; the Greek can express causation or instrumentality.
    reason: lexical_alternative
  - marker: b
    text: The Greek verb behind 'has driven completely out by siege' is intensive and built on 'besiege'; it may also be understood more literally as 'has utterly besieged the enemies.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들 때문에 민족은 평화를 누렸습니다[a]. 또한 고향의 좋은 질서를 새롭게 회복한 뒤[b], 그는 원수들을 완전히 포위하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 통하여’. 헬라어 διά + 대격은 원인과 매개 둘 다를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 헬라어 동사는 ‘포위하다’에서 강화된 형태로, 단순한 ‘몰아내다’보다 포위의 이미지를 더 강하게 전할 수 있습니다.
    reason: lexical_alternative
