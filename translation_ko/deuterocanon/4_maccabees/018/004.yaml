  - severity: medium
    issue: 각주 b의 표지가 ‘새롭게 회복한 뒤’에 붙어 있으나, 각주 내용은 마지막 동사 ἐκπεπολιόρκηκε에 관한 것입니다.
    rationale: 각주는 해당 어휘인 ‘철저히 포위하였습니다’에 붙여야 독자가 주석의 적용 대상을 정확히 알 수 있습니다.
