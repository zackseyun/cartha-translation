  lexicon: BDAG
  rationale: 인용을 이끄는 현재분사이므로 한국어에서는 직역형 관계절보다 종결 표현으로 처리해, 인용문의 자연스러운 도입을 살렸습니다.
- source_word: Εἰ ζήσεται τὰ ὀστᾶ τὰ ξηρὰ ταῦτα
  english_pob_choice: Will these dry bones live?
  chosen_korean: 이 마른 뼈들이 살아나겠습니까?
  alternatives_korean:
  - 이 마른 뼈들이 살겠습니까?
  - 이 마른 뼈들이 살아날 수 있겠습니까?
  lexicon: BDAG; LXX Ezk 37:3
  rationale: LXX의 에스겔 37:3 질문형 표현을 한국어의 자연스러운 의문문으로 옮기되, ‘마른 뼈들’이라는 예언적 이미지가 바로 드러나도록 했습니다.
theological_decisions:
- issue: 에제키엘 37장의 인용과 부활 암시를 어떻게 처리할지
  chosen_reading: 본문은 에제키엘의 증언을 근거로 삼는 수사적 인용으로 옮기고, 그 이상의 교리를 본문 안에 미리 확정하지 않았습니다.
  alternative_readings:
  - 부활을 확정하는 선언으로 번역하기
  - 단순한 문학적 비유로만 약화하기
  rationale: 영어 POB가 유지한 긴장을 따라, 본문이 에제키엘 37장의 소망과 생명 회복 이미지를 호출하지만 그 신학적 결론은 독자가 문맥에서 판단하도록 남겨 두었습니다.
  doctrine_reference: Preserve theological tension rather than resolve it; original-language primacy over translation tradition.
