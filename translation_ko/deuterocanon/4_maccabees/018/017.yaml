  yaml_path: translation/deuterocanon/4_maccabees/018/017.yaml
  text: He bore witness to Ezekiel[a], who says[b], “Will these dry bones live?”
  footnotes:
  - marker: a
    text: Allusion to Ezekiel 37:3. The Greek wording echoes the prophet's question about the valley of dry bones.
    reason: cross_reference
  - marker: b
    text: Or 'confirmed Ezekiel' / 'appealed to Ezekiel as witness.' The Greek verb carries a testimonial sense and is somewhat difficult to render with a single English expression.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 「이 마른 뼈들이 살겠습니까?」라고 말한 에스겔을 증인으로 내세웠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 에스겔 37:3을 가리키는 암시입니다. 헬라어 표현은 마른 뼈들의 골짜기에 관한 예언자의 질문을 반향합니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘에스겔의 증언에 호소했습니다’, ‘에스겔을 확증했습니다’. 헬라어 동사는 증언을 원용하거나 증인으로 내세우는 뜻을 지니며, 한 한국어 표현으로 모두 담기 어렵습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστοποιεῖτο
  english_pob_choice: bore witness to
  chosen_korean: 증언을 받아들여
  alternatives_korean:
