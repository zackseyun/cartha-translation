  yaml_path: translation/deuterocanon/4_maccabees/018/017.yaml
  text: He bore witness to Ezekiel[a], who says[b], “Will these dry bones live?”
  footnotes:
  - marker: a
    text: Allusion to Ezekiel 37:3. The Greek wording echoes the prophet's question about the valley of dry bones.
    reason: cross_reference
  - marker: b
    text: Or 'confirmed Ezekiel' / 'appealed to Ezekiel as witness.' The Greek verb carries a testimonial sense and is somewhat difficult to render with a single English expression.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 에제키엘의 증언을 받아들여 「이 마른 뼈들이 살아나겠습니까?」라고 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 에제키엘 37:3을 가리키는 암시입니다. 헬라어 표현은 마른 뼈 골짜기에 대한 예언자의 질문을 반향합니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘에제키엘을 확증하였습니다’, ‘에제키엘의 증언을 근거로 삼았습니다’. 헬라어 동사는 한 단어로 옮기기 어려운 증언적 의미를 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστοποιεῖτο
  english_pob_choice: bore witness to
  chosen_korean: 증언을 받아들여
  alternatives_korean:
  - 증언하였습니다
  - 증인으로 내세웠습니다
  - 증언을 확인하였습니다
  lexicon: LSJ
  rationale: 중간태/수동태의 증언적 뉘앙스를 살리되, 한국어에서는 ‘증언하다’보다 ‘증언을 받아들여’가 문맥상 선지자 에제키엘의 말을 근거로 삼는 뜻을 자연스럽게 드러냅니다.
- source_word: τὸν Ἰεζεκιὴλ
  english_pob_choice: Ezekiel
  chosen_korean: 에제키엘
  alternatives_korean:
  - 에스겔
  lexicon: 고유명사 표기
  rationale: 본문의 히브리 예언자 이름은 현대 학술식 음역에 맞춰 ‘에제키엘’로 옮겨, 원어 기반의 직접성을 유지했습니다.
- source_word: τὸν λέγοντα
  english_pob_choice: who says
  chosen_korean: 라고 하였습니다
  alternatives_korean:
  - 라고 말하는
  - 라고 말하였습니다
  - 말하기를
  lexicon: BDAG
  rationale: 인용을 이끄는 현재분사이므로 한국어에서는 직역형 관계절보다 종결 표현으로 처리해, 인용문의 자연스러운 도입을 살렸습니다.
- source_word: Εἰ ζήσεται τὰ ὀστᾶ τὰ ξηρὰ ταῦτα
  english_pob_choice: Will these dry bones live?
  chosen_korean: 이 마른 뼈들이 살아나겠습니까?
  alternatives_korean:
  - 이 마른 뼈들이 살겠습니까?
  - 이 마른 뼈들이 살아날 수 있겠습니까?
  lexicon: BDAG; LXX Ezk 37:3
  rationale: LXX의 에스겔 37:3 질문형 표현을 한국어의 자연스러운 의문문으로 옮기되, ‘마른 뼈들’이라는 예언적 이미지가 바로 드러나도록 했습니다.
theological_decisions:
- issue: 에제키엘 37장의 인용과 부활 암시를 어떻게 처리할지
  chosen_reading: 본문은 에제키엘의 증언을 근거로 삼는 수사적 인용으로 옮기고, 그 이상의 교리를 본문 안에 미리 확정하지 않았습니다.
  alternative_readings:
  - 부활을 확정하는 선언으로 번역하기
  - 단순한 문학적 비유로만 약화하기
  rationale: 영어 POB가 유지한 긴장을 따라, 본문이 에제키엘 37장의 소망과 생명 회복 이미지를 호출하지만 그 신학적 결론은 독자가 문맥에서 판단하도록 남겨 두었습니다.
  doctrine_reference: Preserve theological tension rather than resolve it; original-language primacy over translation tradition.
