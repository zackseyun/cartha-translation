  rationale: 중간태/수동태의 증언적 뉘앙스를 살리되, 한국어에서는 ‘증언하다’보다 ‘증언을 받아들여’가 문맥상 선지자 에제키엘의 말을 근거로 삼는 뜻을 자연스럽게 드러냅니다.
