  text: He mutilated the pupils of their eyes, cut out their tongues, and killed them with various tortures.
translation:
  language: ko
  text: 그는 그들의 눈동자를 훼손하고, 그들의 혀를 잘라 내고, 여러 가지 고문으로 그들을 죽였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰς τῶν ὀμμάτων κόρας
  english_pob_choice: the pupils of their eyes
  chosen_korean: 눈동자
  alternatives_korean:
  - 동공
  - 눈의 동공
  - 눈의 중심
  lexicon: LSJ
  rationale: κόραι는 이 해부학적 문맥에서 눈의 동공을 가리키므로, 한국어에서는 자연스럽고 정확한 ‘눈동자’로 옮겼습니다.
- source_word: ἐπήρωσεν
  english_pob_choice: mutilated
  chosen_korean: 훼손하고
  alternatives_korean:
  - 무력하게 하고
  - 상하게 하고
  - 실명하게 하고
  lexicon: LSJ
  rationale: ἐπήρωσεν은 단순히 ‘장님이 되게 하다’보다 더 넓게 ‘훼손하다, 불구로 만들다’의 뜻이 있어, POB의 ‘mutilated’를 살려 ‘훼손하고’로 옮겼습니다.
- source_word: γλώσσας ἐξέτεμεν
  english_pob_choice: cut out their tongues
  chosen_korean: 그들의 혀를 잘라 내고
  alternatives_korean:
  - 그들의 혀를 도려내고
  - 그들의 혀를 잘라 버리고
  lexicon: LSJ
  rationale: ἐξέτεμεν은 잘라 내다, 도려내다의 뜻이므로, 신체 절단의 폭력을 직접 드러내는 ‘잘라 내고’를 선택했습니다.
- source_word: βασάνοις ποικίλαις
  english_pob_choice: with various tortures
  chosen_korean: 여러 가지 고문으로
  alternatives_korean:
  - 다양한 고문으로
  - 온갖 고문으로
  - 여러 가지 형벌로
  lexicon: LSJ
  rationale: βάσανοι는 고문/고통을 뜻하고 ποικίλαις는 여러 가지라는 뜻이므로, 한국어에서는 가장 자연스러운 ‘여러 가지 고문으로’가 적절합니다.
theological_decisions:
- issue: 폭력 서술의 강도 유지
  chosen_reading: 본문의 신체 훼손과 고문을 완화하지 않고 직설적으로 옮겼습니다.
  alternative_readings:
  - 완곡하게 ‘해쳤다’로 약화하기
  - 법적 처형처럼 중화하기
  rationale: 4마카베오서는 박해의 잔혹함을 드러내는 서술이므로, 독자가 본문의 잔혹성을 그대로 이해하도록 유지했습니다.
  doctrine_reference: 본문 서술의 정직성
