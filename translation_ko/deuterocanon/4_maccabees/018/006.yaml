    reason: source_note
lexical_decisions:
- source_word: τότε δὴ
  english_pob_choice: Then indeed
  chosen_korean: 그때
  alternatives_korean:
  - 그때 참으로
  - 그때 정말
  lexicon: LSJ
  rationale: τότε δὴ의 순차적 흐름은 앞뒤 문맥으로 충분히 드러나므로, 한국어에서는 과도한 부사를 덧붙이지 않고 자연스럽게 옮겼습니다.
- source_word: ὑπάρας
