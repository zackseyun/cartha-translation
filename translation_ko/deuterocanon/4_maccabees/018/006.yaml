  alternatives_korean:
  - 출발하여
  - 길을 떠나
  lexicon: LSJ
  rationale: 부사적 선행 동작을 한국어 분사형으로 직접 살리기보다, 문맥상 자연스러운 ‘떠나’로 옮겨 주동작인 진치기에 연결했습니다.
- source_word: ἐστρατοπέδευσεν ἐπὶ Πέρσας
  english_pob_choice: he encamped against the Persians
  chosen_korean: 페르시아 사람들에 맞서 진을 쳤습니다
  alternatives_korean:
  - 페르시아 사람들에 대하여 진을 쳤습니다
  - 페르시아 사람들을 향해 진을 쳤습니다
  lexicon: LSJ
  rationale: 군사적 동작과 적대 방향을 함께 드러내기 위해 ‘진을 쳤습니다’와 ‘맞서’를 결합했습니다.
- source_word: ἡ μήτηρ τῶν ἑπτὰ παίδων
  english_pob_choice: the mother of the seven boys
  chosen_korean: 일곱 아들의 어머니
  alternatives_korean:
  - 일곱 소년의 어머니
  - 일곱 아이의 어머니
  lexicon: LSJ
  rationale: παῖδες를 문맥상 남성 자녀로 이해하되, 한국어에서는 자연스럽고 간결한 친족 표현인 ‘아들들’로 옮겼습니다.
- source_word: τοῖς τέκνοις
  english_pob_choice: her children
  chosen_korean: 자기 자녀들
  alternatives_korean:
