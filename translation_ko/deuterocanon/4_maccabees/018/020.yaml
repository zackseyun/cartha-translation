  source_fidelity: 수정이 필요합니다. 현 초안은 원문의 미완결 구문을 ‘때였습니다’로 종결하여, 이 절만으로는 끝나지 않는 그리스어 문장을 완결된 문장으로 바꾸었습니다. 또한 καταπέλτης와 역설에 관한 각주 표지가 해당 어구가 아닌 곳에 붙어 있습니다. 수정안은 원문의 미완결성을 쉼표로 보존하고, πικρ-의 반복과 ‘καὶ οὐ πικρᾶς’의 역설을 유지합니다.
  naturalness: ‘쓰라린’의 반복은 한국어에서 다소 강하지만 원문의 의도적인 어근 반복을 반영하므로 유지할 수 있습니다. 다만 ‘그의 고문들로’는 한국어에서 약간 경직되어도, 원문의 복수형과 ‘그의’를 보존하는 범위에서 허용됩니다. 문장 끝을 쉼표로 처리한 것은 원문이 절 중간에서 끝나는 점을 정확히 드러냅니다.
  terminology: λέβησι는 ‘가마솥들’, ὠμοῖς는 문맥상 ‘잔혹한’, καταπέλτης는 본문에서 ‘투석기’로 유지하고 문맥상 고문 장치일 수 있음을 각주에 밝혔습니다. παῖδες는 ‘소년들’로 옮겼습니다. ‘그리스인들의 … 폭군’은 Ἑλλήνων의 속격을 보존하는 번역입니다.
