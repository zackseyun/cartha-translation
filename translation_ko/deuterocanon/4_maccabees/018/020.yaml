  yaml_path: translation/deuterocanon/4_maccabees/018/020.yaml
  text: How bitter was that day—and yet not bitter—when the bitter Greek tyrant[a], after kindling fire in the cruel cauldrons and, in boiling rage, bringing the seven boys to the catapult and again to his tortures[b],
  footnotes:
  - marker: a
    text: Or 'to the rack' or 'to an engine of torture.' The Greek word normally denotes a catapult or similar engine, but here it likely refers to a device used in torment.
    reason: lexical_alternative
  - marker: b
    text: 'The phrase ''and yet not bitter'' preserves the Greek paradox: the day was bitter in suffering, yet not bitter in the honor and faithfulness associated with the martyrs'' endurance.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그날은 얼마나 쓰라렸습니까—그러나 또 쓰라리지만은 않았습니다—그때 그리스인들의 쓰라린 폭군[a]이 잔혹한 가마솥들에 불을 지피고, 끓어오르는 분노로 일곱 소년을 투석기와 그의 고문들[b]로 다시 끌고 갔을 때였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘형틀’ 혹은 ‘고문 기계’로 옮길 수 있습니다. 이 그리스어는 보통 투석기나 유사한 공성 기계를 뜻하지만, 여기서는 고문에 쓰인 장치를 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘또 쓰라리지만은 않았다’는 그리스어의 역설을 살린 표현입니다. 이 날은 고난에서는 쓰라렸지만, 순교자들의 인내와 충실함이라는 점에서는 쓰라리지만은 않았습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πικρᾶς / πικρός
  english_pob_choice: bitter
  chosen_korean: 쓰라린
  alternatives_korean:
  - 비통한
  - 쓴
  lexicon: LSJ
  rationale: 반복되는 πικρ- 어근의 수사적 중첩을 살리기 위해 '쓰라린'을 택했습니다. '쓰라리지만은 않았다'는 역설도 함께 보존합니다.
- source_word: ὁ πικρὸς Ἑλλήνων τύραννος
  english_pob_choice: the bitter tyrant of the Greeks
  chosen_korean: 그리스인들의 쓰라린 폭군
  alternatives_korean:
  - 그리스의 쓰라린 폭군
  - 그리스인들의 잔혹한 폭군
  lexicon: LSJ
  rationale: Ἑλλήνων의 속격을 '그리스인들의'로 옮겨 원문의 관계를 살렸고, πικρός는 앞의 '쓰라린'과 연결해 반복 효과를 유지했습니다.
- source_word: λέβησι ὠμοῖς
  english_pob_choice: in his cruel cauldrons
  chosen_korean: 잔혹한 가마솥들
  alternatives_korean:
  - 사나운 가마솥들
  - 잔인한 솥들
  lexicon: LSJ
  rationale: λέβης는 가마솥/솥의 뜻이므로 '가마솥들'로 옮겼고, ὠμοῖς는 기구의 성격을 나타내는 '잔혹한'으로 처리했습니다.
- source_word: ἐπὶ τὸν καταπέλτην
  english_pob_choice: to the catapult
  chosen_korean: 투석기
  alternatives_korean:
  - 포격기
  - 형틀
  lexicon: LSJ
  rationale: 기본 어휘값을 따라 '투석기'로 옮겼습니다. 이 본문이 고문 기구를 가리킬 가능성은 주석으로만 남기고, 본문은 원어의 표면형을 보존했습니다.
theological_decisions:
- issue: καὶ οὐ πικρᾶς의 역설
  chosen_reading: 그러나 또 쓰라리지만은 않았습니다
  alternative_readings:
  - 그리고 쓰라리지 않았습니다
  - 그러나 쓰라리지 않았습니다
  rationale: 고난의 쓰라림과 순교의 영예가 함께 있는 역설을 단순화하지 않고 유지하기 위해 '그러나 또 쓰라리지만은 않았습니다'로 옮겼습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
- issue: καταπέλτης의 문맥상 의미
  chosen_reading: 투석기
  alternative_readings:
  - 고문틀
  - 고문 기계
  rationale: 원어의 기본 의미를 본문에 남기되, 문맥상 고문 기구일 가능성은 주석으로 처리해 과도한 해석을 피했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1
