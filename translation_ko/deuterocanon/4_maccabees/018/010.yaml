  - marker: b
    text: The expression 'the law and the prophets' refers to Israel's sacred Scriptures, especially the Torah and the prophetic writings.
    reason: cross_reference
translation:
  language: ko
  text: 그는 아직 우리와 함께 있을 때, 여러분에게 율법과 예언서를 가르치던 분입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 미완료과거는 한국어에서 단순 과거보다 '가르치던'처럼 지속·습관적 뉘앙스로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '''율법과 예언서''는 이스라엘의 성경, 곧 토라와 예언서들을 가리키는 표현입니다.'
    reason: cross_reference
