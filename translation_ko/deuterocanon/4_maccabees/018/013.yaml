  chosen_reading: 본문의 과장된 찬양 어휘를 약화하지 않고, 인간 대상에 대한 높은 평가로 그대로 옮겼습니다.
  alternative_readings:
  - ‘존귀하게 하셨다’처럼 더 완곡하게 처리할 수 있습니다.
  rationale: 이 구절은 다니엘을 영예로운 증인들의 목록에 두는 수사이므로, 본문의 고양된 표현을 보존하는 편이 원문 의도를 더 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: 본문이 가진 수사적 긴장을 보존하고, 원어의 강도를 번역에서 평준화하지 않음.'
