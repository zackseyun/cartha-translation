  chosen_korean: 사자 구덩이에 있는
  alternatives_korean:
  - 사자 굴에 있는
  - 사자 우리에 있는
  - 사자 덫 속에 있는
  lexicon: LSJ
  rationale: λάκκος는 문자적으로 ‘구덩이’이므로, 익숙한 관용구 ‘사자 굴’보다 원어의 물리적 이미지를 더 직접적으로 반영했습니다.
- source_word: ἐμακάριζεν
