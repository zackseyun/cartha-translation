    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόξαζεν
  english_pob_choice: glorified
  chosen_korean: 영화롭게 하셨으며
  alternatives_korean:
  - 영광스럽게 하셨으며
  - 존귀하게 하셨으며
  - 기리셨으며
  lexicon: BDAG
  rationale: δόξαζω의 높은 찬양·영화의 어감을 살리면서, 하나님께 돌리는 용법과 구별되도록 인간 다니엘에 대한 고양된 평가로 유지했습니다.
- source_word: ἐν λάκκῳ λεόντων
  english_pob_choice: in the lions’ pit
  chosen_korean: 사자 구덩이에 있는
  alternatives_korean:
  - 사자 굴에 있는
  - 사자 우리에 있는
  - 사자 덫 속에 있는
  lexicon: LSJ
  rationale: λάκκος는 문자적으로 ‘구덩이’이므로, 익숙한 관용구 ‘사자 굴’보다 원어의 물리적 이미지를 더 직접적으로 반영했습니다.
- source_word: ἐμακάριζεν
  english_pob_choice: called blessed
  chosen_korean: 복되다 하셨습니다
  alternatives_korean:
  - 복되다 일컬으셨습니다
  - 복된 자라 하셨습니다
  - 복되다고 말씀하셨습니다
  lexicon: BDAG
  rationale: μακαρίζω의 ‘복되다/행복하다고 선포하다’라는 동사를 한국어에서 자연스럽게 살리기 위해 서술형 표현을 택했습니다.
theological_decisions:
- issue: 다니엘에게 사용된 영예 언어의 강도
  chosen_reading: 본문의 과장된 찬양 어휘를 약화하지 않고, 인간 대상에 대한 높은 평가로 그대로 옮겼습니다.
  alternative_readings:
  - ‘존귀하게 하셨다’처럼 더 완곡하게 처리할 수 있습니다.
  rationale: 이 구절은 다니엘을 영예로운 증인들의 목록에 두는 수사이므로, 본문의 고양된 표현을 보존하는 편이 원문 의도를 더 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: 본문이 가진 수사적 긴장을 보존하고, 원어의 강도를 번역에서 평준화하지 않음.'
