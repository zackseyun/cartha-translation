  chosen_korean: 복되다 하셨습니다
  alternatives_korean:
  - 복되다 일컬으셨습니다
  - 복된 자라 하셨습니다
  - 복되다고 말씀하셨습니다
  lexicon: BDAG
  rationale: μακαρίζω의 ‘복되다/행복하다고 선포하다’라는 동사를 한국어에서 자연스럽게 살리기 위해 서술형 표현을 택했습니다.
theological_decisions:
