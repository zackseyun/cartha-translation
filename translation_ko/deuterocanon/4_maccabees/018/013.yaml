  source_fidelity: 개정이 필요합니다. 그리스어의 미완료 과거형(ἐδόξαζεν, ἐμακάριζεν)에 맞추어 과거 서술로 옮기고, 다니엘을 ‘영화롭게 하다’라는 사역 의미로 만들기보다 그를 영광스럽게 여기는 찬양 행위로 표현해야 합니다. 문맥상 이 절의 주어는 어머니이므로 ‘그녀는’으로 밝혔습니다.
  naturalness: 초안의 ‘영화롭게 하셨으며’는 현대 한국어에서 다니엘을 실제로 영화롭게 만든다는 뜻으로 읽히기 쉽고, 존대 과거와 문장 시제도 원문의 서술 흐름에 맞지 않습니다. ‘영광스럽게 여겼으며, 복되다고 일컬었습니다’가 자연스럽고 격식 있는 합쇼체 서술입니다.
  terminology: λάκκος의 물리적 뜻은 ‘구덩이’로 유지하되, 복수 속격 λεόντων을 ‘사자들의’로 반영했습니다. μακαρίζω는 단순히 복을 비는 말이 아니라 ‘복되다고 일컫다’이므로 그렇게 번역했습니다. δοξάζω의 고양된 찬양의 강도는 ‘영광스럽게 여기다’로 보존하되, 예배나 신적 영광 부여를 뜻하도록 만들지 않았습니다.
