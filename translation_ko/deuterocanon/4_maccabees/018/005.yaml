translation:
  language: ko
  text: 그리고 폭군 안티오코스는 땅에서도 벌을 받았고, 영원한 것들로 벌을 받고 있습니다[a]. 그가 예루살렘 사람들에게 이방인의 풍속을 따르게 하고 조상 대대로 이어 온 민족의 관습을 버리도록 강요할 수 없었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영원히 벌을 받고 있습니다’ 또는 ‘영원한 형벌을 받고 있습니다’. 헬라어는 ‘영원한’이라는 형용사만 사용하고 명사를 생략합니다.
    reason: lexical_alternative
