  text: 그리고 폭군 안티오코스는 땅에서도 벌을 받았고, 영원히 벌을 받고 있습니다[a]. 그가 예루살렘 사람들을 강제로 이방인의 풍속을 따르게 하고 조상들의 관습에서 떠나게 하려 했지만, 그는 도무지 그렇게 할 수 없었기 때문입니다.
