base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/015.yaml
  text: David sang to us[a], the hymn-writer, saying[b], “Many are the afflictions of the righteous.”
  footnotes:
  - marker: a
    text: Or, more idiomatically, “David the psalmist sang to us, saying, ‘Many are the afflictions of the righteous.’”
    reason: lexical_alternative
  - marker: b
    text: The quotation echoes Ps 33:20 LXX (Ps 34:19 in many English versifications).
    reason: cross_reference
translation:
  language: ko
  text: 다윗이, 그 찬송시를 지은 이가, 우리에게 노래하며 말했습니다. 「의인들의 고난은 많습니다」.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 찬송시를 지은 이’이지만, 자연스럽게는 ‘시편 기자’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 인용은 시편 33:20 LXX(많은 영어 성경의 시편 34:19)와 호응합니다.
    reason: cross_reference
lexical_decisions:
- source_word: τὸν ὑμνογράφον
  english_pob_choice: the hymn-writer
  chosen_korean: 그 찬송시를 지은 이가
  alternatives_korean:
  - 그 시편 기자가
  - 그 찬송을 지은 이가
  lexicon: LSJ
  rationale: ὑμνογράφος는 문자적으로 찬송을 짓는 사람을 가리키므로, 전통적 해석어인 ‘시편 기자’보다 원뜻을 살린 표현을 택했습니다.
- source_word: ἐμελῴδει
  english_pob_choice: sang
  chosen_korean: 노래하며
  alternatives_korean:
  - 불렀습니다
  - 창가하며
  lexicon: LSJ
  rationale: 동사는 노래하거나 선율에 맞춰 읊는 행위를 나타내므로, 문맥상 자연스럽고 격식 있는 ‘노래하며’로 옮겼습니다.
- source_word: ἡμῖν
  english_pob_choice: to us
  chosen_korean: 우리에게
  alternatives_korean:
  - 우리를 위해
  - 우리에게로
  lexicon: BDAG
  rationale: 여격은 이 구절에서 청자 또는 수혜자를 가리키므로 ‘우리에게’가 가장 직접적입니다.
- source_word: Πολλαὶ αἱ θλίψεις τῶν δικαίων
  english_pob_choice: Many are the afflictions of the righteous
  chosen_korean: 의인들의 고난은 많습니다
  alternatives_korean:
  - 의인들의 환난은 많습니다
  - 의로운 자들의 괴로움은 많습니다
  lexicon: BDAG
  rationale: θλίψεις는 압박·환난·고난의 뜻을 가지며, 시편 인용의 장중한 어조를 살려 ‘고난’으로 번역했습니다.
theological_decisions:
- issue: 다윗과 ‘그 찬송시를 지은 이’의 관계
  chosen_reading: 원문의 압축된 동격 구조를 살려, 다윗이 곧 그 찬송시를 지은 이라는 뜻으로 옮겼습니다.
  alternative_readings:
  - 다윗, 곧 시편 기자가 우리에게 노래하며 말했습니다
  rationale: 영어 POB의 수정 메모가 지적하듯, 이 표현은 다윗을 수식하는 말이지 ‘다윗이 누구에게 노래했다’는 뜻이 아닙니다. 한국어도 그 관계를 분명히 드러냈습니다.
  doctrine_reference: Translation philosophy §§1, 5
