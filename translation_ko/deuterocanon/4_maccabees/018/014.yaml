- from: 그리고 그는 이사야의 그 성경 말씀, 곧 이렇게 말하는 말씀을 여러분에게 계속 상기시켰습니다. 「비록 불을 통과할지라도, 불꽃이 너를 태우지 못할 것이다.」[a]
  to: 그리고 그는 이사야의 성경 말씀, 곧 이렇게 말하는 말씀을 여러분에게 계속 상기시켰습니다. 「비록 네가 불 가운데를 지나갈지라도, 불꽃이 너를 태우지 않을 것이다.」[a]
  rationale: 미완료시제 ὑπεμίμνησκεν의 지속·반복 의미는 ‘계속 상기시켰습니다’로 유지했습니다. γραφή를 수식하는 λέγουσαν은 ‘곧 이렇게 말하는’으로 자연스럽게 처리하되 명사 반복을 줄였습니다. 인용문은 4 마카베오서의 헬라어 어순과 표현을 따르고, 친숙한 이사야 번역으로 조화시키지 않았습니다.
