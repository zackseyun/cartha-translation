    issue: ‘태우지 못할 것이다’의 양태 추가
    rationale: οὐ κατακαύσει는 미래 사실의 부정(‘태우지 않을 것이다’)이며, ‘못하다’는 능력·가능의 뉘앙스를 추가할 수 있습니다.
  - severity: low
    issue: 인용 도입부의 중복된 표현
    rationale: ‘그 성경 말씀, 곧 이렇게 말하는 말씀’은 γραφή와 이를 수식하는 λέγουσαν을 번역하면서 같은 명사를 불필요하게 반복합니다.
  - severity: low
    issue: ‘불을 통과하다’의 어색한 결합
    rationale: διὰ πυρός의 공간적 이미지는 ‘불 가운데를 지나가다’가 표준 한국어에서 더 자연스럽게 전달합니다.
