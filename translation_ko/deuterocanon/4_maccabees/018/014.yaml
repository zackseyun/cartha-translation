translation:
  language: ko
  text: 그리고 그는 이사야의 성경 말씀, 곧 이렇게 말하는 말씀을 여러분에게 계속 상기시켰습니다. 「비록 네가 불 가운데를 지나갈지라도, 불꽃이 너를 태우지 않을 것이다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 인용은 이사야 43:2를 반향합니다. 그러나 여기서는 4 마카베오서의 헬라어 표현을 따라 옮겼습니다. 본문은 ‘불꽃이 너를 태우지 않을 것이다’라고 말합니다.
    reason: cross_reference
