review_pass:
  verdict: revise
  source_fidelity: 핵심 의미와 인용의 독자적 4 마카베오서 본문을 따르려는 방향은 적절합니다. 다만 οὐ κατακαύσει의 단순 미래 부정은 ‘태우지 못할 것이다’보다 ‘태우지 않을 것이다’가 더 정확합니다. 전자는 불꽃이 태울 능력이 없다는 양태를 덧붙일 수 있습니다.
  naturalness: ‘이사야의 그 성경 말씀, 곧 이렇게 말하는 말씀’은 ‘말씀’이 반복되어 현대 한국어로 부자연스럽습니다. 또한 ‘불을 통과하다’보다 ‘불 가운데를 지나가다’가 이 비유적 장면에서 더 자연스럽습니다.
  terminology: γραφή는 이 문맥에서 ‘성경 말씀’으로 옮길 수 있으며, ‘불꽃’과 ‘태우다’는 φλόξ와 κατακαίω의 대비를 잘 보존합니다. 인용문 안의 단수 ‘너’도 원문의 단수를 유지합니다.
  issues:
