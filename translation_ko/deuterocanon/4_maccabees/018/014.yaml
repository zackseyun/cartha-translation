translation:
  language: ko
  text: 그리고 그는 이사야의 그 성경 말씀, 곧 이렇게 말하는 말씀을 여러분에게 계속 상기시켰습니다. 「비록 불을 통과할지라도, 불꽃이 너를 태우지 못할 것이다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 인용은 이사야 43:2를 반향하지만, 여기서는 4 마카베오서의 헬라어 표현을 따른 것입니다. 본문은 ‘불꽃’과 ‘태우다’로 더 직접적으로 말합니다.
    reason: cross_reference
