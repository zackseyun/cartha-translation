  source_fidelity: Αὕτη는 앞선 내용을 가리키는 포괄적 지시로 ‘이것이’가 적절합니다. ζωὴ는 여기서 생물학적 ‘생명’보다 삶 전체를 뜻하므로 ‘삶’이 더 정확합니다. μακαριότης는 ‘복됨’으로 옮겨 원문의 고양된 추상명사와 의미를 보존했습니다. ἡμερῶν의 복수와 소유 관계도 유지했습니다.
