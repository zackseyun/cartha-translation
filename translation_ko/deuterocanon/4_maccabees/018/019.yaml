  - 복락
  - 행복
  lexicon: LSJ
  rationale: ‘blessedness’의 종교적·도덕적 고양감을 살리면서도, 한국어에서 지나치게 교회 용어화된 표현을 피하기 위해 상태를 풀어 옮겼습니다.
- source_word: ἡμερῶν
