  terminology: ‘복됨’은 μακαριότης의 복되다는 성격을 유지하며, 특정 교파의 해석을 덧붙이지 않습니다. ‘삶’은 ζωὴ의 넓은 의미를 자연스럽게 반영합니다.
  issues:
