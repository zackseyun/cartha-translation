- source_word: Αὕτη
  english_pob_choice: This
  chosen_korean: 이것이
  alternatives_korean:
  - 이것은
  - 이 일은
  lexicon: LSJ
  rationale: 짧은 지시대명사의 압축성을 살리면서, 앞선 문맥을 가리키는 포괄적 지시로 자연스럽게 옮겼습니다.
- source_word: ζωὴ
  english_pob_choice: life
  chosen_korean: 생명
