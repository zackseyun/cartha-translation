  - 삶
  - 목숨
  lexicon: LSJ
  rationale: 문맥상 단순한 생존보다 삶 전체의 가치와 상태를 가리키므로, 한국어에서는 더 폭넓고 격조 있는 ‘생명’이 적절합니다.
- source_word: μακαριότης
  english_pob_choice: blessedness
  chosen_korean: 복된 상태
