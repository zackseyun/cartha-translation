  chosen_korean: 날들의
  alternatives_korean:
  - 날의
  - 생애의
  - 평생의
  lexicon: LSJ
  rationale: 원문의 복수 생명-시간 표현을 보존하기 위해 ‘날들’의 복수를 유지했고, 속격 관계는 한국어 관형형으로 처리했습니다.
theological_decisions:
- issue: ‘복된 상태’로 옮긴 μακαριότης의 종교적 뉘앙스
  chosen_reading: 행복한 기분이 아니라 하나님 앞에서 인정되는 복된 삶의 상태를 가리키는 표현으로 이해했습니다.
  alternative_readings:
  - 행복
  - 축복
  rationale: 문맥상 정서적 행복보다 삶 전체의 복된 성격을 말하므로, 의미를 약화하지 않는 범위에서 상태 표현을 택했습니다.
