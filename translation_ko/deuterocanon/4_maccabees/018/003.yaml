  lexicon: BDAG
  rationale: εὐσέβεια의 핵심은 하나님께 대한 경외와 신실한 경건이므로, 교회용어에만 기대지 않으면서도 본문의 종교적 의미를 분명히 하는 ‘경건함’이 적절합니다.
- source_word: τοῖς πόνοις ἐκείνοι
  english_pob_choice: to those sufferings
  chosen_korean: 그 고난들에
  alternatives_korean:
  - 그 고통들에
  - 그 환난들에
  lexicon: BDAG
  rationale: πόνοι는 단순한 육체적 통증보다 더 넓게 ‘고난/수고/고통’을 가리킬 수 있어, 순교적 문맥에 맞는 ‘고난들’로 옮겼습니다. 지시대명사 ἐκείνοι의 되짚음을 ‘그’로 살렸습니다.
- source_word: θείας μερίδος
  english_pob_choice: a divine share
  chosen_korean: 신적 몫
  alternatives_korean:
  - 하나님의 몫
  - 신성한 몫
  - 신적 분깃
  lexicon: LSJ
  rationale: 이 구절은 하나님께서 주시는 몫인지, 신적 영역에 참여하는 몫인지가 압축적으로 열려 있으므로, 의미를 과도하게 규정하지 않는 ‘신적 몫’을 택했습니다.
