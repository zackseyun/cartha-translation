translation:
  language: ko
  text: 이러한 이유로, 그들의 경건함 때문에 그 사람들은 자기들의 몸을 그 고난들에 내어주었으며, 사람들에게만 감탄을 받은 것이 아니라, 신적 몫을 받을 자격이 있는 것으로 여겨졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘신적 몫’은 문맥상 하나님이 주시는 분깃일 수도 있고, 신적 영역에 참여하는 몫일 수도 있습니다.
    reason: alternative_reading
