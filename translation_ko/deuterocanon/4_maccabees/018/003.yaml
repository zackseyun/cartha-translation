  text: For this reason[a], because of their godliness, when those men gave up their bodies to those sufferings, they were not only admired by men, but were also counted worthy of a divine share.
  footnotes:
  - marker: a
    text: Or 'a portion from God' or 'a share in the divine.' The Greek phrase is concise and may refer either to a reward allotted by God or to participation in a divine portion.
