  yaml_path: translation/deuterocanon/4_maccabees/018/003.yaml
  text: For this reason[a], because of their godliness, when those men gave up their bodies to those sufferings, they were not only admired by men, but were also counted worthy of a divine share.
  footnotes:
  - marker: a
    text: Or 'a portion from God' or 'a share in the divine.' The Greek phrase is concise and may refer either to a reward allotted by God or to participation in a divine portion.
    reason: alternative_reading
translation:
  language: ko
  text: 이러한 이유로, 그들은 경건함 때문에 자기 몸을 그 고난에 내맡겼으므로, 사람들에게 감탄을 받았을 뿐만 아니라 신적인 몫을 받을 자격이 있는 이들로 여겨졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘신적인 몫’은 문맥상 하나님께서 주시는 분깃일 수도 있고, 신적인 것에 참여하는 몫일 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνθʼ ὧν
  english_pob_choice: For this reason
  chosen_korean: 이러한 이유로
  alternatives_korean:
