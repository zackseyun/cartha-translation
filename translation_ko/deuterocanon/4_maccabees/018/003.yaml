  lexicon: LSJ
  rationale: 앞선 서술을 근거로 한 결과를 이끄는 관용구이므로, 한국어에서도 원인-결과의 연결을 자연스럽게 드러내는 표현을 택했습니다.
- source_word: διὰ τὴν εὐσέβειαν
  english_pob_choice: because of their godliness
  chosen_korean: 그들의 경건함 때문에
  alternatives_korean:
