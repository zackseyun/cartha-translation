  text: No destroyer in the desolate wilderness ruined me in the open field[a], nor did the serpent, destroyer through deceit, violate the purity of my virginity; but I remained with my husband through the time of my prime.
  footnotes:
  - marker: a
    text: Or 'snake, destroyer by deceit.' The Greek stacks several destructive terms around 'serpent,' producing a compressed image of the deceiving serpent as a ravager.
    reason: lexical_alternative
translation:
  language: ko
  text: 광야의 파괴자도, 들판의 파괴자도 나를 무너뜨리지 못하였고[a], 속임수의 뱀도 내 처녀성의 순결을 더럽히지 못하였습니다. 그러나 나는 내 젊은 시절 내내 남편과 함께 지냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘속임수로 파괴하는 뱀.’ 그리스어는 뱀 주변에 여러 파괴 어휘를 겹쳐 놓아, 기만하는 뱀을 파괴자로 압축해서 그립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυμεὼν τῆς ἐρημίας φθορεὺς ἐν πεδίῳ
  english_pob_choice: No destroyer in the desolate wilderness ruined me in the open field
  chosen_korean: 광야의 파괴자도, 들판의 파괴자도 나를 무너뜨리지 못하였고
  alternatives_korean:
  - 광야의 해코지꾼도 들판의 해코지꾼도 나를 해치지 못하였고
  - 사막의 파괴자도 평원의 파괴자도 나를 파괴하지 못하였고
  lexicon: LSJ
  rationale: λυμεών과 φθορεύς의 겹친 파괴 이미지를 한국어에서 두 번의 ‘파괴자’로 살리되, 동사 ‘무너뜨리다’로 결과를 자연스럽게 정리했습니다.
- source_word: τὰ ἁγνὰ τῆς παρθενίας
  english_pob_choice: the purity of my virginity
  chosen_korean: 내 처녀성의 순결
  alternatives_korean:
  - 내 처녀성의 정결
  - 내 동정의 순결
  lexicon: LSJ
  rationale: ἁγνά의 ‘순결/정결’과 παρθενία의 ‘처녀성’을 함께 드러내기 위해 소유격 구조를 유지했습니다.
- source_word: ἀπάτης ὄφις
  english_pob_choice: the serpent, destroyer through deceit
  chosen_korean: 속임수의 뱀
  alternatives_korean:
  - 속임수로 파괴하는 뱀
  - 기만의 뱀
  lexicon: LSJ
  rationale: ἀπάτης와 ὄφις의 결합을 압축된 수식구로 옮겨, 뱀의 정체가 ‘속임수’와 연결된다는 점을 유지했습니다.
- source_word: ἔμεινα δὲ χρόνον ἀκμῆς
  english_pob_choice: I remained with my husband through the time of my prime
  chosen_korean: 그러나 나는 내 젊은 시절 내내
  alternatives_korean:
  - 그러나 나는 내 전성기 동안
  - 그러나 나는 내 한창때 내내
  lexicon: LSJ
  rationale: χρόνον ἀκμῆς를 ‘젊은 시절/한창때’로 자연스럽게 풀어, 성적 성숙의 절정을 암시하는 문맥을 보존했습니다.
- source_word: σὺν ἀνδρί
  english_pob_choice: with my husband
  chosen_korean: 남편과 함께 지냈습니다
  alternatives_korean:
  - 남자와 함께 있었습니다
  - 남편과 함께 있었습니다
  lexicon: LSJ
  rationale: ἀνδρί는 이 자전적 문맥에서 ‘남편’이 가장 분명하므로, 관계의 지속성을 드러내는 ‘함께 지냈습니다’로 옮겼습니다.
theological_decisions:
- issue: 뱀의 에덴적·신학적 함의
  chosen_reading: ‘속임수의 뱀’으로 직역에 가깝게 유지하되, 추가 해석은 덧붙이지 않았습니다.
  alternative_readings:
  - ‘뱀’으로만 단순화하여 상징성을 약화시키는 읽기
  - 에덴의 유혹자라는 해석을 본문 밖으로 확장하는 읽기
  rationale: 그리스어의 ὄφις와 ἀπάτης가 이미 속임수의 뱀 이미지를 충분히 제공하므로, 본문이 지닌 문학적·신학적 긴장을 그대로 두었습니다.
  doctrine_reference: 본문의 상징성을 보존하되 과잉해석을 피함
