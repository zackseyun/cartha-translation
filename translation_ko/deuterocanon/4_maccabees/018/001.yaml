    text: 직역하면 ‘아브라함에게 속한 씨들(자손들)의 후손들’입니다. 원문은 혈통을 가리키는 표현을 겹쳐 사용하여 조상과의 연속성을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘경건을 실천하십시오’, ‘경건하게 살아가십시오’라고 옮길 수 있습니다. 이 말은 하나님을 공경하는 삶과 행위를 가리킵니다.
