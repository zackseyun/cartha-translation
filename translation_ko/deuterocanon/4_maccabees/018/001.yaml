  text: O children[a], descendants of the seed of Abraham, Israelites, obey this law[b], and be godly in every way.
  footnotes:
  - marker: a
    text: Or 'descendants of Abraham’s seed.' The Greek expression is unusually layered and emphatic in its appeal to ancestral identity.
    reason: lexical_alternative
  - marker: b
    text: Or 'show piety' / 'live devoutly.' The verb denotes reverent, God-honoring conduct.
    reason: lexical_alternative
translation:
  language: ko
  text: 오, 아브라함의 씨의 후손이요 이스라엘 사람들아, 이 율법을 따르십시오. 그리고 모든 면에서 경건하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘아브라함의 씨의 후손’이며, 원문의 겹겹이 쌓인 혈통 호소를 살린 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘경건하십시오’는 ‘경건하게 사십시오’ 또는 ‘경외하십시오’로도 옮길 수 있으며, 여기서는 행위 전반을 포괄하는 의미를 살렸습니다.
    reason: lexical_alternative
