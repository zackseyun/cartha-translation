  yaml_path: translation/deuterocanon/4_maccabees/018/016.yaml
  text: He held up Solomon before us as a proverb, the one who says, “It is a tree of life for all who do his will.”
  footnotes:
  - marker: a
    text: Or, “It is a tree of life for all who do its will.” The Greek pronoun can be read with an impersonal referent, though the context favors reference to God.
    reason: alternative_reading
  - marker: b
    text: The saying echoes Proverbs 3:18 in adapted form.
    reason: cross_reference
translation:
  language: ko
  text: 그는 솔로몬의 다음 말을 격언으로 들어 우리에게 말해 주었습니다. “그분의 뜻을 행하는 모든 이에게는 생명 나무입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그것의 뜻을 행하는 모든 이에게는 생명 나무입니다.” 그리스어 대명사는 비인칭적 지시로도 읽을 수 있으나, 문맥상 하나님을 가리키는 것으로 이해하는 편이 더 자연스럽습니다.
    reason: alternative_reading
  - marker: b
    text: 이 말은 잠언 3:18을 변형하여 반영합니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπαροιμίαζεν
  english_pob_choice: held up ... as a proverb
  chosen_korean: 속담처럼 내세웠습니다
  alternatives_korean:
  - 속담으로 말했습니다
  - 속담으로 제시했습니다
  - 비유로 들었습니다
  lexicon: LSJ
  rationale: 동사는 어떤 대상을 속담 형식으로 언급하는 뜻이므로, 솔로몬을 대상으로 한 수사적 제시를 살려 ‘속담처럼 내세웠습니다’로 옮겼습니다.
- source_word: τὸν Σαλομῶντα
  english_pob_choice: Solomon
  chosen_korean: 솔로몬
  alternatives_korean:
  - 솔로몬 왕
  - 솔로몬 자신
  lexicon: 고유명사 표기
  rationale: 고유명사는 현대 외래어 표기 관행에 따라 ‘솔로몬’으로 옮겼습니다.
- source_word: πᾶσιν τοῖς ποιοῦσιν
  english_pob_choice: for all who do
  chosen_korean: 행하는 모든 이에게는
  alternatives_korean:
  - 행하는 모든 사람에게
  - 실행하는 모든 이에게는
  - 하는 모든 이에게는
  lexicon: LSJ
  rationale: 행위 참여자를 가리키는 분사구이므로 ‘행하는 모든 이’로 자연스럽고도 직접적으로 옮겼습니다.
- source_word: αὐτοῦ τὸ θέλημα
  english_pob_choice: his will
  chosen_korean: 그분의 뜻
  alternatives_korean:
  - 그의 뜻
  - 그것의 뜻
  - 그분이 원하시는 것
  lexicon: LSJ
  rationale: 문맥상 지혜 자체보다 하나님을 가리키는 방향이 더 강하므로, 인격적 지시를 살린 ‘그분의 뜻’으로 번역했습니다.
theological_decisions:
- issue: αὐτοῦ의 지시 대상
  chosen_reading: 그분의 뜻
  alternative_readings:
  - 그것의 뜻
  rationale: 잠언 3:18을 변형하여 인용한 표현이지만, 이 문맥은 순교 신학 속에서 하나님의 뜻에 대한 충성을 말하므로 인칭적 지시를 본문 본뜻으로 보았습니다. 다만 그리스어 형태상 비인칭적 독해 가능성은 남아 있습니다.
  doctrine_reference: 본문의 신학적 긴장을 해소하기보다, 문맥상 가장 설득력 있는 독해를 본문에 반영합니다.
