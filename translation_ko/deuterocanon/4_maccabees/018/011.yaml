  text: And he recounted to us Abel[a], who was slain by Cain, and Isaac being offered up as a whole burnt offering, and Joseph in prison.
  footnotes:
  - marker: a
    text: Or, more literally, 'Isaac being offered as a whole burnt offering.' The Greek uses sacrificial language to evoke Genesis 22.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 우리에게 가인에게 죽임을 당한 아벨, 온전히 번제물로 바쳐지던 이삭, 그리고 감옥에 있던 요셉을 들려주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘온전히 번제물로 바쳐지던 이삭’. 그리스어는 창세기 22장을 떠올리게 하는 희생 제의적 언어를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεγίνωσκεν
  english_pob_choice: he recounted to us
  chosen_korean: 우리에게 들려주었습니다
  alternatives_korean:
  - 우리에게 읽어 주었습니다
  - 우리에게 전해 주었습니다
  - 우리에게 상기시켜 주었습니다
  lexicon: LSJ
  rationale: 문맥상 단순한 ‘읽다’보다 선조들의 본을 상기시키며 서술하는 뜻이므로, 자연스럽게 ‘들려주었습니다’로 옮겼습니다.
- source_word: τὸν ἀναιρεθέντα
  english_pob_choice: who was slain
  chosen_korean: 죽임을 당한
  alternatives_korean:
  - 죽은
  - 살해된
  - 목숨을 잃은
  lexicon: BDAG
  rationale: ἀναιρέω의 폭력적 살해 뉘앙스를 살리기 위해, 평범한 ‘죽은’보다 더 강한 ‘죽임을 당한’을 택했습니다.
- source_word: ὁλοκαυτούμενον
  english_pob_choice: being offered up as a whole burnt offering
  chosen_korean: 온전히 번제물로 바쳐지던
  alternatives_korean:
  - 번제물로 바쳐지던
  - 온전한 번제물로 드려지던
  - 완전한 번제로 올려지던
  lexicon: LSJ
  rationale: 이삭이 실제로 희생된 것은 아니므로 ‘태워졌다’는 인상을 피하면서도, ὁλοκαυτούμενον의 제의적 표현과 창세기 22장의 암시를 보존했습니다.
- source_word: ἐν φυλακῇ
  english_pob_choice: in prison
  chosen_korean: 감옥에 있던
  alternatives_korean:
  - 옥에 있던
  - 감옥에 갇혀 있던
  - 감옥 안에 있던
  lexicon: BDAG
  rationale: 요셉의 수감 상태를 가장 분명하고 현대적으로 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 이삭에 대한 희생 제의적 표현 보존
  chosen_reading: ‘온전히 번제물로 바쳐지던’으로 번제적 언어를 살리되, 실제로 이삭이 희생되었다고 오해되지는 않게 했습니다.
  alternative_readings:
  - ‘번제물로 바쳐지던’
  - ‘번제로 드려지던’
  - ‘온전한 번제물로 바쳐지던’
  rationale: 그리스어는 창세기 22장의 제의 언어를 의도적으로 불러오므로, 이를 약화시키지 않으면서도 서사적 사실과 충돌하지 않게 번역해야 합니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy §§1, 3, 6'
