  yaml_path: translation/deuterocanon/4_maccabees/018/018.yaml
  text: For she did not forget the song that Moses taught[a], which teaches, ‘I kill, and I make alive.’
  footnotes:
  - marker: a
    text: 'This line echoes the Song of Moses in Deuteronomy 32:39. Some English renderings of that passage read, ''I kill and I make alive''; here the Greek wording is future: ''I will kill, and I will make alive.'''
    reason: cross_reference
translation:
  language: ko
  text: 이는 그녀가 모세가 가르친 노래, 곧 ‘내가 죽일 것이며, 살릴 것이다’라고 가르치는 그 노래를 잊지 않았기 때문입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 말은 신명기 32:39에 나오는 모세의 노래를 반영합니다. 신명기 그리스어 본문과 이 구절 모두 ‘내가 죽일 것이며, 살릴 것이다’라는 미래형을 사용합니다.
    reason: cross_reference
lexical_decisions:
- source_word: ᾠδὴν
  english_pob_choice: song
  chosen_korean: 노래
  alternatives_korean:
  - 시
  - 찬가
  lexicon: LSJ
  rationale: 일반적인 의미는 ‘노래’이므로, 본문의 단순한 장르를 가장 직접적으로 살렸습니다.
- source_word: ἐδίδαξεν
  english_pob_choice: taught
  chosen_korean: 가르친
  alternatives_korean:
