  - 훈계한
  lexicon: LSJ
  rationale: 모세가 그 노래를 ‘가르쳤다’는 교육적 행위를 그대로 반영하는 자연스러운 표현입니다.
- source_word: οὐκ ἐπελάθετο
  english_pob_choice: did not forget
  chosen_korean: 잊지 않았습니다
  alternatives_korean:
  - 기억에서 놓치지 않았습니다
  - 잊어버리지 않았습니다
  lexicon: LSJ
  rationale: 기억의 지속을 나타내는 동사로, 문맥상 가장 직접적인 한국어 대응은 ‘잊지 않았습니다’입니다.
- source_word: Ἐγὼ ἀποκτενῶ, καὶ ζῆν ποιήσω
  english_pob_choice: I will kill, and I will make alive
  chosen_korean: 내가 죽이고, 내가 살립니다
  alternatives_korean:
  - 내가 죽일 것이고, 내가 살릴 것입니다
  - 내가 죽이고, 내가 생명을 줍니다
  lexicon: LSJ
  rationale: 인용된 신적 자기선언의 현재/장차적 힘을 살리기 위해 단순하고 단호한 직설형으로 옮겼습니다. ‘살립니다’는 ζῆν ποιήσω의 생명 부여를 자연스럽게 표현합니다.
theological_decisions:
- issue: 모세의 노래가 인용하는 하나님의 주권적 자기선언의 시제 처리
  chosen_reading: 직설형 현재로 ‘내가 죽이고, 내가 살립니다’라고 옮겨, 인용문이 지닌 단정성과 즉시성을 살렸습니다.
  alternative_readings:
  - ‘내가 죽일 것이고, 내가 살릴 것입니다’
  - ‘내가 죽이고, 내가 생명을 줍니다’
  rationale: 그리스어는 미래형이지만, 한국어에서는 현재형 직설이 인용문의 격언적·선언적 성격을 더 자연스럽게 전달합니다. 동시에 ‘살립니다’로 생명 부여의 강한 의미를 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
