  text: And Phinehas the zealot was speaking to us[b][a], and Hananiah and Azariah and Mishael in the fire were teaching you.
  footnotes:
  - marker: a
    text: Or 'Phinehas the zealous one.' The Greek term highlights his exemplary zeal.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'Hananiah and Azariah and Mishael, those in the fire.' The phrase identifies the three youths by their ordeal in the furnace.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 야훼의 열심 있는 사람 피느하스가 우리에게 말하였고, 불 가운데 있던 하나냐와 아자리아와 미사엘이 너희를 가르쳤습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘열심 있는 피느하스’ 또는 ‘열성적인 피느하스’입니다. 본문은 그의 본보기적 열심을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘불 가운데 있는 하나냐와 아자리아와 미사엘’입니다. 이 표현은 세 청년을 풀무불 시련으로 식별합니다.
    reason: lexical_alternative
