  terminology: λογισμός은 ‘이성’, πάθος는 철학적 대립항으로서 ‘정념’이 적절합니다. ‘이 모든 정념’은 ἐπικρατεῖ τούτων의 대상이 정념임을 명시할 뿐 의미를 과도하게 해석하지 않습니다.
