  source_fidelity: ‘먼저’는 그리스어 본문에 없는 시간적 한정을 더하므로 삭제해야 합니다. 또한 τούτων은 앞서 언급한 정념들을 가리키므로 ‘이 모든 것’보다 ‘이 모든 정념’을 써서 지시 대상을 분명히 하는 편이 충실합니다. 나머지 문항의 병렬 구조와 λογισμός/πάθος의 철학적 대비는 잘 반영되어 있습니다.
