base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/014.yaml
  text: But let us determine what reason is[a], and what passion is, and how many kinds of passions there are[c][b], and whether reason rules over all these.
  footnotes:
  - marker: a
    text: Or 'let us distinguish' or 'let us examine.' The Greek verb can emphasize separating categories as well as determining them.
    reason: lexical_alternative
  - marker: b
    text: Or 'reasoning' or 'rational judgment' for 'reason.'
    reason: lexical_alternative
  - marker: c
    text: Or 'emotions' or 'impulses' for 'passions,' though the Greek term carries a philosophical sense of affective drives.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 우리가 먼저 무엇이 이성인지, 무엇이 정념인지, 그리고 정념의 종류가 얼마나 많은지, 또 이성은 이 모든 것을 지배하는지 알아보도록 합시다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구별합시다’, ‘살펴봅시다’로도 옮길 수 있습니다. 그리스어 동사는 범주를 나누는 뜻과 판정하는 뜻을 함께 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이성적 판단’, ‘사유’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘감정’, ‘충동’으로도 옮길 수 있으나, 여기서는 철학적 의미의 내적 동인을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διακρίνωμεν
  english_pob_choice: let us determine
  chosen_korean: 알아보도록 합시다
  alternatives_korean:
  - 구별해 봅시다
  - 판별해 봅시다
  - 살펴봅시다
  lexicon: LSJ
  rationale: 호소형 접속법의 권유를 살리면서, 이 문맥의 철학적 탐구 성격에 맞게 단순한 분리보다 ‘무엇인지 밝혀 나가자’는 뜻을 자연스럽게 담았습니다.
- source_word: λογισμός
  english_pob_choice: reason
  chosen_korean: 이성
  alternatives_korean:
  - 이성적 판단
  - 사유
  - 판단력
  lexicon: LSJ
  rationale: 4 마카베오서는 인간의 이성적 판단 능력을 핵심 주제로 다루므로, 현대 한국어에서 가장 간결하고 개념적으로 대응하는 ‘이성’을 선택했습니다.
- source_word: πάθος
  english_pob_choice: passion
  chosen_korean: 정념
  alternatives_korean:
  - 열정
  - 감정
  - 욕정
  lexicon: LSJ
  rationale: 철학적·윤리적 대비를 유지하려면 단순한 감정보다, 이성에 대립하는 내적 충동을 뜻하는 ‘정념’이 가장 적절합니다.
- source_word: πόσα παθῶν εἰδέα
  english_pob_choice: how many kinds of passions there are
  chosen_korean: 정념의 종류가 얼마나 많은지
  alternatives_korean:
  - 정념의 여러 유형이 얼마나 있는지
  - 정념의 형식이 얼마나 많은지
  lexicon: LSJ
  rationale: εἰδέα의 분류적 의미를 살려 ‘종류’로 옮기고, 수량 질문 구조를 한국어로 자연스럽게 정리했습니다.
- source_word: ἐπικρατεῖ
  english_pob_choice: rules over
  chosen_korean: 지배하는지
  alternatives_korean:
  - 다스리는지
  - 우세한지
  - 주관하는지
  lexicon: LSJ
  rationale: 지배·우위의 의미를 분명히 하되, 문장 전체의 철학적 논지를 살리는 데 가장 직접적인 동사로 옮겼습니다.
theological_decisions:
- issue: 이성(λογισμός)과 정념(πάθος)의 대비를 어떻게 한국어로 살릴 것인가
  chosen_reading: 이성 ... 정념
  alternative_readings:
  - 이성적 판단 ... 감정
  - 사유 ... 충동
  rationale: 이 절은 4 마카베오서의 핵심 논지인 ‘이성이 정념을 다스린다’는 철학적 긴장을 예고하므로, 현대 심리학적 표현으로 완화하지 않고 고전적 대비를 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
