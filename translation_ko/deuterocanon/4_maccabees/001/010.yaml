  lexicon: LSJ
  rationale: καλοκἀγαθία의 결합된 도덕 이상을 ‘고귀함과 선함’으로 분해해, POB의 병렬 의미를 한국어에서 분명하게 드러냈습니다.
- source_word: μακαρισμῷ ὤν
  english_pob_choice: to pronounce them blessed
  chosen_korean: 그들을 복되다고 선언합니다
  alternatives_korean:
  - 그들을 복되다고 칭합니다
  - 그들을 복을 받은 이들로 선포합니다
  - 그들을 복되다고 말합니다
  lexicon: LSJ
  rationale: 마지막 압축 구문은 단순한 칭찬보다 ‘복됨’을 공적으로 선언하는 의미이므로, ‘복되다고 선언합니다’로 옮겨 beatitude의 강도를 살렸습니다.
- source_word: μετὰ τῆς μητρός
  english_pob_choice: with their mother
  chosen_korean: 어머니와 함께
  alternatives_korean:
  - 그들의 어머니와 함께
  - 어머니와 더불어
  lexicon: LSJ
  rationale: 동반 관계를 자연스럽게 살리되, 순교 문맥에서 같은 죽음을 함께한 의미가 드러나도록 했습니다.
theological_decisions:
- issue: καλοκἀγαθία의 도덕적 이상을 어떻게 보존할 것인가
  chosen_reading: ‘고귀함과 선함’으로 분해해 병렬적 도덕 이상을 드러냄
  alternative_readings:
  - ‘덕’
  - ‘도덕적 탁월함’
  - ‘고결함’
  rationale: 이 단어는 단일 미덕이 아니라 명예-도덕 복합 이상을 담으므로, 한 단어로 축소하지 않고 두 요소를 함께 보존했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 마지막 μακαρισμός를 단순 감탄이 아니라 공적 축복 선언으로 볼 것인가
  chosen_reading: ‘복되다고 선언합니다’
  alternative_readings:
  - ‘축복합니다’
  - ‘복되다고 칭합니다’
  - ‘행복하다고 말합니다’
  rationale: 본문은 그들의 덕을 칭찬하는 데서 나아가 그들을 ‘복된 자’로 인정하는 결말이므로, 공적 선언의 성격을 유지했습니다.
  doctrine_reference: Translation philosophy §6
