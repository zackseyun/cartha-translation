theological_decisions:
- issue: καλοκἀγαθία의 도덕적 이상을 어떻게 보존할 것인가
  chosen_reading: ‘고귀함과 선함’으로 분해해 병렬적 도덕 이상을 드러냄
  alternative_readings:
  - ‘덕’
  - ‘도덕적 탁월함’
  - ‘고결함’
  rationale: 이 단어는 단일 미덕이 아니라 명예-도덕 복합 이상을 담으므로, 한 단어로 축소하지 않고 두 요소를 함께 보존했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 마지막 μακαρισμός를 단순 감탄이 아니라 공적 축복 선언으로 볼 것인가
  chosen_reading: ‘복되다고 선언합니다’
  alternative_readings:
  - ‘축복합니다’
  - ‘복되다고 칭합니다’
  - ‘행복하다고 말합니다’
  rationale: 본문은 그들의 덕을 칭찬하는 데서 나아가 그들을 ‘복된 자’로 인정하는 결말이므로, 공적 선언의 성격을 유지했습니다.
  doctrine_reference: Translation philosophy §6
