    reason: lexical_alternative
  - marker: b
    text: 마지막 그리스어 구문은 압축되어 있습니다. 뜻은 그들의 덕을 칭찬할 뿐 아니라, 영예를 더하여 그들을 복되다고 칭한다는 것입니다.
    reason: alternative_reading
  - marker: c
    text: ‘고귀함과 선함을 위하여’는 그리스어 καλοκἀγαθία를 옮긴 말입니다. 이 말은 고귀함과 선함 또는 도덕적 탁월함을 함께 가리키며, ‘덕을 위하여’로도 옮길 수 있습니다.
