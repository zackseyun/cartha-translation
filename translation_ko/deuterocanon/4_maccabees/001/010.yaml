  yaml_path: translation/deuterocanon/4_maccabees/001/010.yaml
  text: Therefore[a], it is incumbent on me to praise the men who, at this time, died with their mother for the sake of nobility and goodness; and, as for honors[b], to pronounce them blessed.
  footnotes:
  - marker: a
    text: Or 'for the sake of virtue.' The Greek καλοκἀγαθία combines the ideas of nobility and goodness/moral excellence.
    reason: lexical_alternative
  - marker: b
    text: The closing Greek phrase is compressed; the sense is that, beyond praising their virtues, the speaker also accords them the honor of calling them blessed.
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로[a], 지금 이때에 어머니와 함께 죽은 그 남자들을 그들의 고귀함과 선함을 위해 칭찬하는 것이 내 몫입니다. 그리고 그들의 영예에 관해서는 그들을 복되다고 선언합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘덕을 위해’. 그리스어 καλοκἀγαθία는 고귀함과 선함/도덕적 탁월함을 함께 담습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 그리스어 구문은 압축되어 있으며, 의미는 덕을 칭찬하는 데 그치지 않고 그들을 복되다고 부르는 영예를 더한다는 것입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπεστί μοι
  english_pob_choice: it is incumbent on me
  chosen_korean: 내 몫입니다
  alternatives_korean:
  - 제게 달려 있습니다
  - 제가 해야 할 의무입니다
  - 저에게 맡겨졌습니다
  lexicon: LSJ
  rationale: 임무와 책임이 주어진 공적 서술을 자연스러운 합쇼체로 옮기되, 단순 가능성이 아니라 ‘마땅히 맡은 바’라는 뉘앙스를 살렸습니다.
- source_word: ὑπὲρ τῆς καλοκἀγαθίας
  english_pob_choice: for the sake of nobility and goodness
  chosen_korean: 고귀함과 선함을 위해
  alternatives_korean:
  - 덕을 위해
  - 고귀하고 선한 삶을 위해
