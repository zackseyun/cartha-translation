  text: For the passions of desires are held in check[a], being turned back by the self-controlled mind; and all the body's impulses are governed by reason.
  footnotes:
  - marker: a
    text: Or 'all the movements of the body are directed toward honor by reason.' The Greek verb here is unusual and carries the idea of aspiring eagerly or loving honor.
    reason: lexical_alternative
translation:
  language: ko
  text: 욕망의 정념들은 절제된 마음에 의해 되돌려져 억제되기 때문이며, 몸의 모든 충동은 이성에 의해 다스려집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘몸의 모든 움직임이 이성에 의해 명예를 향해 지향됩니다.’ 여기의 그리스어 동사는 비정상적으로 쓰였으며, 열심히 지향하거나 명예를 사랑한다는 뜻을 띱니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντέχεται ... ὑπὸ τοῦ σώφρονος νοὸς ἀνακαμπτόμενα
  english_pob_choice: are held in check ... being turned back by the self-controlled mind
  chosen_korean: 되돌려져 억제되기 때문이며
  alternatives_korean:
  - 거슬러져 억제되기 때문이며
  - 막혀 억눌리기 때문이며
  - 되받아 억제되기 때문이며
  lexicon: LSJ
  rationale: ἀντέχεται와 ἀνακαμπτόμενα가 함께 만드는 ‘맞서서 되돌림/억제’의 그림을 살려, 단순한 제지보다 ‘되돌려져 억제되다’로 옮겼습니다.
- source_word: πάθη τῶν ὀρέξεων
  english_pob_choice: the passions of desires
  chosen_korean: 욕망의 정념들
  alternatives_korean:
  - 욕구의 정념들
  - 욕망의 열정들
  - 욕구의 충동들
  lexicon: LSJ
  rationale: πάθη는 Hellenistic moral discourse에서 정념/격정의 뜻이 강하므로 ‘정념들’로, ὀρέξεων은 기본 욕구보다 도덕 심리학적 뉘앙스를 살려 ‘욕망’으로 옮겼습니다.
- source_word: σώφρονος νοὸς
  english_pob_choice: the self-controlled mind
  chosen_korean: 절제된 마음
  alternatives_korean:
  - 자기 절제한 마음
  - 신중한 마음
  - 절도 있는 마음
  lexicon: LSJ
  rationale: σώφρων의 핵심을 ‘절제’로 잡되, νοῦς의 인지적 측면을 살리기 위해 ‘마음’으로 자연스럽게 표현했습니다.
- source_word: φιλοτιμοῦνται πάντα τὰ τοῦ σώματος κινήματα ὑπὸ τοῦ λογισμοῦ
  english_pob_choice: all the body's impulses are governed by reason
  chosen_korean: 몸의 모든 충동은 이성에 의해 다스려집니다
  alternatives_korean:
  - 몸의 모든 움직임은 이성에 의해 고상한 방향으로 이끌립니다
  - 몸의 모든 움직임은 이성에 의해 다스려집니다
  - 몸의 모든 충동은 이성에 의해 조정됩니다
  lexicon: LSJ
  rationale: φιλοτιμοῦνται는 직역하면 ‘명예를 사랑하다/열망하다’ 계열이라 문맥상 다소 특이하지만, 한국어 본문은 자연스러운 독해를 위해 ‘다스려집니다’로 처리하고, 그 특이성은 각주로 보존했습니다.
theological_decisions:
- issue: 4 Maccabees의 도덕 심리학을 어떻게 옮길지
  chosen_reading: 이 절은 죄성이나 성화 교리 용어를 덧입히지 않고, 이성/절제가 정념과 몸의 충동을 제어하는 헬라즘-유대 윤리 언어로 옮겼습니다.
  alternative_readings:
  - 정념을 ‘죄된 욕망’으로 풀어 더 신학적으로 만들 수 있음
  - ‘움직임’을 그대로 살려 더 기계적으로 옮길 수 있음
  rationale: 원문은 later doctrinal category보다 인간 내면의 질서에 관한 철학적 표현이므로, 의미를 과장하지 않고 본문의 사유 틀을 보존하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
