  yaml_path: translation/deuterocanon/4_maccabees/001/035.yaml
  text: For the passions of desires are held in check[a], being turned back by the self-controlled mind; and all the body's impulses are governed by reason.
  footnotes:
  - marker: a
    text: Or 'all the movements of the body are directed toward honor by reason.' The Greek verb here is unusual and carries the idea of aspiring eagerly or loving honor.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 욕망의 정념들이 절제하는 마음에 의해 되돌려져 억제되고, 몸의 모든 움직임이 이성에 의해 명예를 지향하도록 이끌리기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘몸의 모든 움직임은 이성에 의해 다스려집니다.’ 여기의 그리스어 동사는 이 문맥에서 특이하게 쓰였으며, 열심히 지향하거나 명예를 사랑한다는 뜻을 띱니다.
    reason: lexical_alternative
