  source_fidelity: 첫 절의 ‘되돌려져 억제’는 ἀντέχεται와 ἀνακαμπτόμενα의 억제·되돌림의 이미지를 대체로 잘 반영합니다. 그러나 φιλοτιμοῦνται를 본문에서 단순히 ‘다스려집니다’로 처리하면 ‘명예를 사랑하다/명예를 향해 열망하다’라는 특이한 어휘의 핵심이 사라집니다. 본문에서 그 방향성을 드러내고, 더 평이한 해석은 각주로 돌리는 편이 원문에 더 충실합니다.
  naturalness: 현행 ‘억제되기 때문이며’는 문장 연결이 다소 부자연스럽습니다. ‘이는 … 때문입니다’ 구조로 두 절을 함께 제시하면 현대 표준 한국어 합쇼체에서 자연스럽고, γάρ의 설명 기능도 살릴 수 있습니다. κινήματα는 여기서 ‘충동’으로 해석할 수 있으나, 본문에는 보다 넓은 ‘움직임’을 사용하여 원문의 범위를 보존했습니다.
