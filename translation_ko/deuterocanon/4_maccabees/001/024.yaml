  text: Anger is a passion shared by pleasure and pain, if one reflects on the occasion when it came upon him.
translation:
  language: ko
  text: 분노는 쾌락과 고통에 공통된 정서이니, 그것이 자신에게 닥쳤던 때를 누군가 곰곰이 생각한다면 그렇습니다.
  philosophy: formal
lexical_decisions:
- source_word: θυμὸς
  english_pob_choice: Anger
  chosen_korean: 분노
  alternatives_korean:
  - 노여움
  - 화
  lexicon: θυμός
  rationale: 문맥상 감정 상태를 가리키므로, 현대 한국어에서 가장 직접적이고 강한 대응인 ‘분노’를 택했습니다.
- source_word: κοινὸν
  english_pob_choice: shared
  chosen_korean: 공통된
  alternatives_korean:
  - 공유된
  - 함께하는
  lexicon: κοινός
  rationale: ‘shared by’의 관계를 한국어로 자연스럽게 풀어, 분노가 쾌락과 고통에 함께 속하는 성격임을 드러냈습니다.
- source_word: ἡδονῆς καὶ πόνου
  english_pob_choice: pleasure and pain
  chosen_korean: 쾌락과 고통
  alternatives_korean:
  - 즐거움과 고통
  - 기쁨과 아픔
  lexicon: ἡδονή / πόνος
  rationale: 대조 구조를 유지하면서도 그리스어의 철학적 어감에 가까운 ‘쾌락과 고통’을 사용했습니다.
- source_word: ἐὰν ἐννοηθῇ τις
  english_pob_choice: if one reflects
  chosen_korean: 누군가 곰곰이 생각한다면
  alternatives_korean:
  - 사람이 생각해 본다면
  - 깊이 숙고한다면
  lexicon: ἐννοέω
  rationale: ἐννοηθῇ의 ‘마음에 떠올려 숙고하다’는 뜻을 살려 반성적 사고를 분명히 했습니다.
theological_decisions:
- issue: ἀὐτῷ περιέπεσεν의 지시 대상과 수동적 체험성
  chosen_reading: “그것이 자신에게 닥쳤던 때”로 옮겨, 분노가 우연히/겪어지게 임한 사건성을 보존했습니다.
  alternative_readings:
  - “그에게 일어났던 때”
  - “그가 그것을 겪었을 때”
  rationale: 동사의 수동적 뉘앙스와 사건의 도래를 살리되, 본문의 철학적 일반화를 해치지 않도록 했습니다.
  doctrine_reference: 인간 정서의 형성에 대한 일반 진술로서, 교리적 명제를 덧붙이지 않고 본문의 관찰을 유지합니다.
