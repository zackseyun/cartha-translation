translation:
  language: ko
  text: 만일 그러하다면, 이성이 절제를 방해하는 정념들, 곧 식탐과 욕망을 이기는 것으로 분명히 드러납니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘만일 참으로 이성이 절제하는 이들의 방해가 되는 정념들을 이기는 것으로 보인다면’이라고 옮길 수 있습니다. 그리스어의 τῶν σωφρονούντων은 압축된 표현이어서 더 형식적으로 번역할 수도 있지만, 의미 관계는 다소 덜 분명해집니다.
    reason: lexical_alternative
