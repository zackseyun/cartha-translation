translation:
  language: ko
  text: 만일 그렇다면, 절제하는 이들을 방해하는 정욕과 식탐에 대해서도 이성은 분명히 이길 수 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘만일 참으로 이성이 절제하는 이들을 방해하는 정념들 위에 이기는 것으로 보인다면’이라고도 옮길 수 있습니다. 그리스어의 τῶν σωφρονούντων은 압축되어 있어 더 형식적으로는 번역할 수 있지만, 의미는 다소 덜 분명해집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ ἄρα
  english_pob_choice: if, then
  chosen_korean: 만일 그렇다면
  alternatives_korean:
  - 만일
  - 그렇다면
  - 만일 그러하다면
  lexicon: LSJ
  rationale: 조건과 추론의 뉘앙스를 함께 살려, 앞뒤 논증 관계를 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: τῶν σωφρονούντων κωλυτικῶν παθῶν
  english_pob_choice: the passions that hinder self-control
  chosen_korean: 절제하는 이들을 방해하는 정욕
  alternatives_korean:
  - 자제하는 이들을 막는 감정
  - 절제에 방해가 되는 욕망들
  - 절제하는 사람들의 길을 막는 정념
  lexicon: LSJ
  rationale: 압축된 그리스어 구문을 한국어에서는 관계를 풀어, παθῶν의 ‘정념/정욕’ 성격과 κωλυτικῶν의 ‘방해하는’ 의미를 함께 살렸습니다.
- source_word: ὁ λογισμὸς
  english_pob_choice: reason
  chosen_korean: 이성
  alternatives_korean:
  - 이성적 판단
  - 논리
  - 이성 판단
  lexicon: LSJ
  rationale: 4 마카베오스의 철학적 문맥에서 λογισμός는 단순한 생각보다 통제된 이성의 기능을 가리키므로, 간결하고 개념적인 ‘이성’으로 옮겼습니다.
- source_word: γαστριμαργίας τε καὶ ἐπιθυμίας
  english_pob_choice: both gluttony and desire
  chosen_korean: 정욕과 식탐
  alternatives_korean:
  - 탐식과 욕망
  - 식탐과 욕망
  - 탐식과 정욕
  lexicon: LSJ
  rationale: γαστριμαργία는 식욕의 과잉, 곧 식탐을 뜻하고, ἐπιθυμία는 여기서 일반적 욕망보다 더 강한 정욕/욕구의 범주로 읽을 수 있어 병렬적으로 간결하게 옮겼습니다.
theological_decisions:
- issue: 4 마카베오스 1:3의 철학적 인간 이해에서 λογισμός의 성격
  chosen_reading: 이성을 인간 안의 절제와 우위의 원리로 제시하는 표현으로 번역했습니다.
  alternative_readings:
  - 이성적 판단
  - 이성적 능력
  rationale: 본문은 정념을 제어하는 논증을 펼치므로, λογισμός를 단순한 인지 작용보다 통치하는 이성의 원리로 드러내는 것이 문맥상 적절합니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: τῶν σωφρονούντων의 압축된 관계를 한국어로 풀어 쓰는 방식
  chosen_reading: ‘절제하는 이들을 방해하는’으로 풀어, 문법적 압축을 해소했습니다.
  alternative_readings:
  - ‘절제하는 자들의’로 더 직역
  - ‘절제한 사람들의’
  rationale: 그리스어는 수식 관계가 압축되어 있어 직역하면 모호해질 수 있으므로, POB의 영어 해석처럼 의미 관계를 명시하여 오해를 줄였습니다.
  doctrine_reference: Translation philosophy §6
