  source_fidelity: 초안은 λογισμός을 ‘이성’으로 옮기고, γαστριμαργία와 ἐπιθυμία를 식탐 및 욕망의 범주로 이해한 점은 대체로 적절합니다. 그러나 원문의 병렬 예시인 ‘식탐과 욕망’이 초안에서는 앞에 놓이고, ‘정욕’은 ἐπιθυμία의 넓은 의미를 불필요하게 성적 의미로 좁힐 수 있습니다. 또한 φαίνεται ἐπικρατεῖν의 ‘~인 것으로 드러나다/보이다’라는 양태를 더 직접적으로 반영하는 편이 안전합니다.
  naturalness: ‘절제하는 이들을 방해하는 정욕과 식탐에 대해서도’는 수식 관계와 병렬 관계가 다소 불분명하고, ‘정욕과 식탐’의 순서도 원문과 다릅니다. ‘절제를 방해하는 정념들, 곧 식탐과 욕망을’로 풀면 현대 표준 한국어의 문장 흐름이 자연스럽고 의미 관계도 명확합니다.
  terminology: λογισμός은 ‘이성’으로 유지합니다. πάθη는 문맥상 포괄적인 ‘정념들’로, ἐπιθυμία는 성적 욕망으로 한정하지 않은 ‘욕망’으로 옮깁니다. σωφρονούντων이 포함된 압축적이고 논쟁적인 구문은 본문에서 ‘절제를 방해하는’으로 기능적으로 풀고, 대안적 직역 가능성은 각주에 보존합니다.
