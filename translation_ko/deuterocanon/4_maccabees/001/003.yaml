  text: if[a], then, reason is evidently able to prevail over the passions that hinder self-control, both gluttony and desire,
  footnotes:
  - marker: a
    text: Or 'if indeed reason appears to prevail over the passions that obstruct those who are self-controlled.' The Greek phrase with σωφρονούντων is compressed and can be rendered more formally, though less clearly in English.
