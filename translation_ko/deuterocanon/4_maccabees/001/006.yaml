    reason: lexical_alternative
translation:
  language: ko
  text: 이성은 자신의 정념들을 지배하는 것이 아니라, 정의[a]와 용기와 절제와 신중함에 반대되는 것들을 지배합니다. 이성은 그것들을 없애기 위해서가 아니라 그것들에게 굴복하지 않기 위해 그것들을 지배합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘의’로 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λογισμός
  english_pob_choice: reason
  chosen_korean: 이성
  alternatives_korean:
  - 이성적 판단
  - 사고
  lexicon: LSJ
  rationale: 4 마카베오 1장에서 λογισμός은 철학적 문맥의 이성적 판단 능력을 가리키므로, 현대 한국어에서 가장 자연스럽고 간결한 ‘이성’으로 옮겼습니다.
- source_word: κρατεῖ
  english_pob_choice: does not rule over
  chosen_korean: 지배하지 못하고
  alternatives_korean:
  - 다스리지 못하고
  - 통치하지 못하고
  lexicon: LSJ
  rationale: κρατέω는 지배·주권의 의미를 가지므로, ‘지배하다’로 옮겨 통치의 비유를 살렸습니다.
- source_word: τῶν τῆς δικαιοσύνης καὶ ἀνδρείας καὶ σωφροσύνης καὶ φρονήσεως ἐναντίων
  english_pob_choice: those things opposed to justice and courage and self-control and prudence
  chosen_korean: 의와 용기와 절제와 신중함에 반대되는 것들
  alternatives_korean:
  - 의와 용기와 절제와 지혜에 반대되는 것들
  - 정의와 담대함과 절제와 실천적 지혜에 қарсы되는 것들
  lexicon: LSJ
  rationale: 네 가지 덕목의 대립항이라는 수사 구조를 한국어에서도 그대로 드러내기 위해 ‘반대되는 것들’로 옮겼고, 각 덕목은 문맥에 맞는 표준어로 처리했습니다.
- source_word: καταλῦσαι
  english_pob_choice: to destroy them
  chosen_korean: 없애려는 것이 아니라
  alternatives_korean:
  - 무너뜨리려는 것이 아니라
  - 파괴하려는 것이 아니라
  lexicon: LSJ
  rationale: καταλύω는 제거·무너뜨리다의 뜻이 있으나, 여기서는 대립항을 ‘없애다’는 의미가 가장 자연스럽고 문맥의 대비를 분명히 합니다.
- source_word: μὴ εἴξαι
  english_pob_choice: not to yield to them
  chosen_korean: 그것들에게 굴복하지 않기 위해서입니다
  alternatives_korean:
  - 그것들에게 양보하지 않기 위해서입니다
  - 그것들에게 굴하지 않기 위해서입니다
  lexicon: LSJ
  rationale: εἴκω는 양보하다, 굴복하다의 의미이므로, 인격적 충돌보다 도덕적 타협을 가리키는 뉘앙스를 살려 ‘굴복하다’로 옮겼습니다.
