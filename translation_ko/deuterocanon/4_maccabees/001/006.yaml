  rationale: 이 구절은 신학적 논증보다 헬라 윤리의 덕목 목록에 속하므로, 성경적·전통적 관용어인 ‘의’를 택해 문맥의 품격과 폭넓은 의미를 함께 살렸습니다.
  doctrine_reference: 'DOCTRINE.md: δικαιοσύνη의 문맥별 번역 원칙; 덕목 목록에서는 ‘의’가 우선'
