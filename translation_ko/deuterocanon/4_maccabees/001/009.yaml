lexical_decisions:
- source_word: ἅπαντες γὰρ οὗτοι
  english_pob_choice: For all these
  chosen_korean: 사실 모든 이들은
  alternatives_korean:
  - 이 모든 사람들은
  - 그들 모두는
  lexicon: LSJ
  rationale: ἅπαντες의 포괄성과 οὗτοι의 지시성을 함께 살리되, 한국어에서는 자연스럽게 ‘모든 이들’로 묶어 주어가 분명하게 드러나도록 했습니다.
- source_word: ὑπεριδόντες
  english_pob_choice: having disregarded / having looked down on
  chosen_korean: 마다하고
  alternatives_korean:
  - 외면하고
  - 무시하고
  - 깔보고
  lexicon: LSJ
  rationale: 직역의 ‘쳐다보고 내려보다’보다 한국어에서는 고통을 대수롭지 않게 여기고 넘긴 태도를 ‘마다하다’로 자연스럽게 옮길 수 있어, 경멸과 무시의 뉘앙스를 함께 살렸습니다.
- source_word: ἕως θανάτου πόνον
  english_pob_choice: the pain even unto death
  chosen_korean: 죽음에 이르기까지의 고통
  alternatives_korean:
  - 죽기까지의 고통
  - 죽음에 이를 만큼의 고통
  - 죽음에 이르는 고통
  lexicon: LSJ
  rationale: ἕως θανάτου의 한계를 한국어의 ‘~에 이르기까지’로 옮겨, 단순한 ‘극심한 고통’이 아니라 죽음의 경계까지 간 고통임을 보존했습니다.
- source_word: λογισμός
  english_pob_choice: reason
  chosen_korean: 이성
  alternatives_korean:
  - 이성적 판단
  - 합리적 판단
  - 이해
  lexicon: LSJ
  rationale: 4 마카베오스의 철학적 논지에서 λογισμός는 통제된 이성/이성적 판단을 가리키므로, 핵심 대비인 πάθη와의 관계를 살리는 ‘이성’이 가장 간결합니다.
- source_word: τῶν παθῶν
  english_pob_choice: the passions
  chosen_korean: 정념들을
  alternatives_korean:
  - 열정들을
  - 감정들을
  - 욕정들을
  lexicon: LSJ
  rationale: πάθη는 단순 감정보다 이성을 거스르는 정서적 충동을 가리키므로, 철학적 대비를 살릴 수 있는 ‘정념’이 적절합니다.
theological_decisions:
- issue: 4 마카베오스 1:9의 논증 구조를 한국어에서 어떻게 드러낼지
  chosen_reading: 고통을 마다한 이들의 행동이 이성이 정념을 지배함을 드러내는 논증으로 옮겼습니다.
  alternative_readings:
  - 고통을 무시한 결과를 진술하는 방식
  - 순교적 신앙의 승리를 전면에 내세우는 방식
  rationale: 이 구절은 신앙 고백보다 헬라 철학적 논증을 전개하므로, ‘이성이 정념들을 지배한다’는 원인-증거 구조가 드러나도록 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
