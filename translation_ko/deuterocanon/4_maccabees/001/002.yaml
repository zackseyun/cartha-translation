base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/002.yaml
  text: For the discourse is indeed necessary for understanding[b][a], and it contains praise of the greatest virtue—I mean prudence.
  footnotes:
  - marker: a
    text: Or 'for knowledge.' The Greek εἰς ἐπιστήμην can be rendered either way.
    reason: lexical_alternative
  - marker: b
    text: Or 'practical wisdom.' The Greek φρόνησις denotes prudent moral judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 담론은 이해를 위해 참으로 필요하며, 가장 큰 덕, 곧 분별[ [a] ]의 찬사를 담고 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지식을 위해’. 그리스어 εἰς ἐπιστήμην은 ‘이해를 위해’와 ‘지식을 위해’로 모두 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγκαῖος εἰς ἐπιστήμην
  english_pob_choice: necessary for understanding
  chosen_korean: 이해를 위해 참으로 필요하다
  alternatives_korean:
  - 지식을 위해 필요하다
  - 학식을 위해 필요하다
  lexicon: LSJ
  rationale: ἀναγκαῖος는 필요성을, εἰς ἐπιστήμην은 지향 대상을 나타내므로 한국어로는 ‘이해를 위해 필요하다’가 가장 자연스럽고, 지식·학식으로 좁히지 않으면서도 인지적 목적을 살립니다.
- source_word: λόγος
  english_pob_choice: discourse
  chosen_korean: 담론
  alternatives_korean:
  - 논변
  - 말
  - 강론
  lexicon: LSJ
  rationale: 여기서 λόγος는 한 마디 ‘말’이 아니라 앞뒤 문맥을 가진 사유의 전개를 가리키므로, 철학적·수사학적 뉘앙스를 살리는 ‘담론’이 적절합니다.
- source_word: τῆς μεγίστης ἀρετῆς
  english_pob_choice: the greatest virtue
  chosen_korean: 가장 큰 덕
  alternatives_korean:
  - 가장 큰 미덕
  - 가장 높은 탁월성
  lexicon: LSJ
  rationale: ἀρετή는 이 문맥에서 도덕적 탁월성/덕을 뜻하므로, 표준적이면서도 의미를 직접 살리는 ‘덕’으로 옮겼습니다.
- source_word: φρονήσεως
  english_pob_choice: prudence
  chosen_korean: 분별
  alternatives_korean:
  - 신중
  - 실천적 지혜
  - 신중한 판단
  lexicon: LSJ
  rationale: φρόνησις는 단순한 조심성이 아니라 도덕적 판단과 실천적 분별을 포함하므로, 한국어에서는 ‘분별’이 가장 간결하게 그 핵심을 드러냅니다.
- source_word: περιέχει ἔπαινον
  english_pob_choice: contains praise
  chosen_korean: 찬사를 담고 있습니다
  alternatives_korean:
  - 칭송을 포함합니다
  - 찬양을 담고 있습니다
  lexicon: LSJ
  rationale: περιέχει는 ‘담다/포함하다’의 뜻을 가지며, ἔπαινος는 단순한 언급보다 칭송의 의미가 강하므로 ‘찬사를 담고 있습니다’가 문맥상 자연스럽습니다.
theological_decisions:
- issue: 4 Maccabees의 철학적 덕목 어휘를 한국어에서 교회적·신학적 용어로 과도하게 치환할지 여부
  chosen_reading: ‘덕’과 ‘분별’을 사용해 헬라 철학적 윤리어휘를 그대로 살렸습니다.
  alternative_readings:
  - ‘미덕’과 ‘실천적 지혜’를 사용
  - ‘의로운 삶의 지혜’로 풀어씀
  rationale: 본문은 기독교 교리어보다 헬라 윤리철학의 어휘를 사용하므로, 후대 신학 범주를 덧씌우지 않고 저자의 개념 세계를 보존하는 편이 더 충실합니다.
  doctrine_reference: Translation philosophy §§1, 6
