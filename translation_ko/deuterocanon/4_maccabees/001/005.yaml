base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/005.yaml
  text: How then[a], perhaps some might say, if reason rules over the passions, does it not also master forgetfulness and ignorance? In attempting to say this, they are being ridiculous.
  footnotes:
  - marker: a
    text: Or, 'it is ridiculous to attempt to say this.' The Greek γελοῖον ἐπιχειροῦντες λέγειν can be taken impersonally or as referring to the objectors themselves.
    reason: alternative_reading
translation:
  language: ko
  text: 그러면 아마 어떤 이들은 이렇게 말할 것입니다. “이성이 정념들을 지배한다면, 어떻게 망각과 무지까지 지배하지 않겠습니까?” 이렇게 말하려 드는 이들은 우스꽝스럽습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이렇게 말하려 드는 것은 우스꽝스럽습니다.” 그리스어 γελοῖον ἐπιχειροῦντες λέγειν은 무인칭으로도, 이의를 제기하는 이들을 가리키는 말로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: πῶς οὖν
  english_pob_choice: How then
  chosen_korean: 그렇다면
  alternatives_korean:
  - 그렇다면 어떻게
  - 그런즉
  lexicon: LSJ
  rationale: 앞선 주장에 대한 반문과 이의 제기를 자연스럽게 이어 주는 한국어 연결어로 옮겼습니다.
- source_word: ἴσως εἴποιεν ἄν τινες
  english_pob_choice: perhaps some might say
  chosen_korean: 아마 어떤 이들은 말할 것입니다
  alternatives_korean:
  - 어쩌면 몇몇은 말할 것입니다
  - 혹 어떤 사람들은 말할 것입니다
  lexicon: LSJ
  rationale: 불특정한 반대자들의 잠정적 발화를 나타내는 표현으로, ‘어떤 이들은’과 ‘아마’가 잠정성과 익명성을 함께 살립니다.
- source_word: τῶν παθῶν
  english_pob_choice: the passions
  chosen_korean: 정념들
  alternatives_korean:
  - 열정들
  - 감정들
  - 욕정들
  lexicon: LSJ
  rationale: 4마카베오기에서 이성에 의해 다스려져야 할 심리적 충동을 가리키므로, 철학적 문맥을 살려 ‘정념들’로 옮겼습니다.
- source_word: ὁ λογισμὸς
  english_pob_choice: reason
  chosen_korean: 이성
  alternatives_korean:
  - 이성적 판단
  - 사고
  - 이성의 판단
  lexicon: LSJ
  rationale: 책 전체의 윤리-철학적 논지에서 λογισμός는 단순한 마음보다 이성의 기능을 뜻하므로, 간결하고 개념적인 ‘이성’을 택했습니다.
- source_word: οὐ δεσπόζει
  english_pob_choice: does it not also master
  chosen_korean: 또 지배하지 않습니까
  alternatives_korean:
  - 또 지배하지 않습니까
  - 또 주재하지 않습니까
  - 또 다스리지 않습니까
  lexicon: LSJ
  rationale: δεσπόζω의 지배/지배력 의미를 살리되, 한국어에서 자연스러운 반문형으로 옮겼습니다.
- source_word: γελοῖον ἐπιχειροῦντες λέγειν
  english_pob_choice: they are being ridiculous
  chosen_korean: 그렇게 말하려고 시도하는 그들은 우스꽝스럽습니다
  alternatives_korean:
  - 그렇게 말하려 드는 그들은 우스꽝스럽습니다
  - 그렇게 말하려 애쓰는 그들은 우습습니다
  lexicon: LSJ
  rationale: 분사구를 반대자들에게 직접 연결하는 영어 POB의 해석을 따라, 시도 자체보다 그들의 태도를 ‘우스꽝스럽습니다’로 드러냈습니다.
theological_decisions:
- issue: τῶν παθῶν의 철학적-윤리적 의미
  chosen_reading: ‘정념들’로 옮겨 이성에 의해 다스려져야 할 내적 충동이라는 의미를 유지했습니다.
  alternative_readings:
  - ‘감정들’
  - ‘욕망들’
  rationale: 이 구절은 4마카베오기 전체의 핵심 주제인 이성과 정념의 대립을 다루므로, 감정 일반보다 더 기술적인 ‘정념들’이 문맥에 맞습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
- issue: γελοῖον ἐπιχειροῦντες λέγειν의 귀속
  chosen_reading: 모호한 무인칭 가능성보다 반대자들에게 직접 비난이 돌아가도록 읽었습니다.
  alternative_readings:
  - ‘그것을 말하려 시도하는 것은 우스꽝스럽습니다’
  - ‘말하려는 시도 자체가 우스꽝스럽습니다’
  rationale: 그리스어는 무인칭 또는 발화자 귀속 둘 다 가능하지만, 문맥상 논박의 날카로움을 살리는 쪽이 더 자연스럽습니다.
  doctrine_reference: Translation philosophy §§3, 6
