  text: But even about this it will now be possible to speak at once[a], beginning with the subject, as I am accustomed to do, and thus I will turn to the discourse about them[b], giving glory to the all-wise God.
  footnotes:
  - marker: a
    text: Or, 'it will now be permitted to speak at once about this'; the Greek ἐξέσται can carry a nuance of permission as well as possibility.
    reason: lexical_alternative
  - marker: b
    text: The pronoun 'them' may refer to the persons to be discussed in the following argument, though 'these matters' is also possible from the immediate wording.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 이 일에 관해서도 이제는 곧바로 말할 수 있을 것이니, 내가 늘 하듯이 주제를 먼저 시작한 뒤에, 나는 그들에 관한 이야기로 돌이켜 전능하시고 지극히 지혜로우신 하나님께 영광을 돌리겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἐξέσται는 여기서 ‘말할 수 있을 것이다’라는 가능성뿐 아니라 ‘말하도록 허용될 것이다’라는 허용의 뉘앙스도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들’은 이어질 논의의 인물들을 가리킬 수도 있고, 바로 앞의 논제들을 가리킬 수도 있습니다.
    reason: alternative_reading
