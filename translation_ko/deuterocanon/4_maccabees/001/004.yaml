  rationale: 4 마카베오의 헬라어 윤리 담론에서는 δικαιοσύνη가 ‘의’와 ‘정의’ 사이의 긴장을 가질 수 있어, 본문은 프로젝트 기본어 ‘의’를 따르되 대안 독해를 보존하는 편이 소스 충실합니다.
