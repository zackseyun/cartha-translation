theological_decisions:
- issue: δικαιοσύνη의 한국어 대응 선택
  chosen_reading: ‘의’로 번역하되, 덕목 목록이라는 문맥을 살려 윤리적 의미를 전면에 두었습니다.
  alternative_readings:
  - 의로움
  - 정의
  rationale: 본문은 언약적 칭의 논의가 아니라 철학적 덕목 목록이므로, 영어 POB가 ‘justice’를 택한 취지를 따르면서도 한국어에서는 ‘의’가 지닌 성경적·윤리적 폭을 활용했습니다. 필요하면 주석에서 ‘정의’ 가능성을 보완할 수 있습니다.
