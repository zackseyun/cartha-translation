  text: Therefore[a], reason is a mind that, with right living, gives preference to the word of wisdom.
  footnotes:
  - marker: a
    text: Or 'the principle of wisdom' or 'the discourse of wisdom.' Greek λόγος can mean 'word,' 'speech,' 'account,' or 'principle.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로[a] 이성은 바른 삶과 함께 지혜의 말을 선호하는 마음입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지혜의 원리’나 ‘지혜의 담화’로 옮길 수 있습니다. 그리스어 λόγος는 ‘말’, ‘말씀’, ‘진술’, ‘원리’를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λογισμός
  english_pob_choice: reason
  chosen_korean: 이성
  alternatives_korean:
  - 이성적 판단
  - 사고
  lexicon: LSJ
  rationale: 철학적 정의문에서 λογισμός의 개념적 핵심은 인간의 합리적 판단 능력이므로, 한국어에서는 추상적 기능을 살린 ‘이성’이 가장 자연스럽고 간결합니다.
- source_word: νοῦς
  english_pob_choice: mind
  chosen_korean: 마음
  alternatives_korean:
  - 정신
  - 지성
  lexicon: LSJ
  rationale: νοῦς는 사고의 주체이자 내적 능력을 가리키므로 ‘마음’이 현대 한국어에서 가장 넓고 무리 없는 대응입니다.
- source_word: μετὰ ὀρθοῦ βίου
  english_pob_choice: with right living
  chosen_korean: 바른 삶과 함께
  alternatives_korean:
  - 올바른 생활과 함께
  - 정직한 삶과 함께
  lexicon: LSJ
  rationale: ὀρθός와 βίος의 결합은 단순한 행위가 아니라 삶의 방식 전체를 뜻하므로, ‘바른 삶’으로 옮겨 윤리적·생활적 의미를 함께 살렸습니다.
- source_word: προτιμῶν
  english_pob_choice: gives preference to
  chosen_korean: 선호하는
  alternatives_korean:
  - 우선하는
  - 더 귀하게 여기는
  lexicon: LSJ
  rationale: 분사 προτιμῶν은 한 항목을 다른 것보다 앞세우는 지속적 태도를 나타내므로, 한국어에서는 문맥상 ‘선호하는’이 가장 자연스럽습니다.
- source_word: τὸν σοφίας λόγον
  english_pob_choice: the word of wisdom
  chosen_korean: 지혜의 말
  alternatives_korean:
  - 지혜의 말씀
  - 지혜의 담화
  - 지혜의 원리
  lexicon: LSJ
  rationale: λόγος의 폭이 ‘말/말씀/담화/원리’까지 걸치지만, 이 절의 정의적 문맥에서는 지혜가 말해지는 내용을 가리키므로 ‘지혜의 말’이 구조와 열린 의미를 함께 보존합니다.
theological_decisions:
- issue: 철학적 정의문에서 λόγος의 범위를 지나치게 축소하지 않는 문제
  chosen_reading: ‘지혜의 말’로 유지해 λόγος의 발화·교훈·내용성을 함께 남겼습니다.
  alternative_readings:
  - ‘지혜의 말씀’
  - ‘지혜의 원리’
  - ‘지혜의 담화’
  rationale: 이 절은 경건과 이성의 관계를 개념적으로 정의하므로, 특정 교리 용어로 굳히기보다 원문의 의미 범위를 드러내는 번역이 더 적합합니다.
  doctrine_reference: 번역 원칙 §§1, 3, 6
