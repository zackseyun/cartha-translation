base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/029.yaml
  text: Each of these the all-working reason[a], thoroughly purifying and pruning and entwining and raising up and transforming in every way[b], tames the raw materials of character and passions.
  footnotes:
  - marker: a
    text: Or 'reason that works in every way.' The Greek adjective for 'all-working' is rare and emphasizes reason's comprehensive effectiveness.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek piles up a series of participles with craft-like imagery: purifying, cutting away, entwining, raising, and transforming. The sequence portrays reason as shaping the inner material of a person.'
    reason: cultural_note
translation:
  language: ko
  text: 이들 각각은 모든 면에서 작용하는 이성[a]이 철저히 정화하고, 다듬고, 엮고, 들어 올리고, 모든 방식으로 변형하여[b] 성품과 정념의 원재료를 길들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 방식으로 작용하는 이성’. 그리스어 형용사 πανεγώργος는 희귀하며, 이성의 포괄적 유효성을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 다듬고, 깎아내고, 엮고, 들어 올리고, 변형하는 일련의 분사들을 겹쳐 써서, 이성이 사람 안의 재료를 빚어 가는 모습을 그립니다.
    reason: cultural_note
lexical_decisions:
- source_word: ὧν ἕκαστος
  english_pob_choice: Each of these
  chosen_korean: 이들 각각은
  alternatives_korean:
  - 그것들 각각은
  - 이것들 각각은
  lexicon: LSJ
  rationale: 앞선 항목들을 가리키는 분배적 표현이므로, 자연스러운 현대 한국어로 간결하게 살렸습니다.
- source_word: ὁ πανεγώργος λογισμός
  english_pob_choice: all-working reason
  chosen_korean: 모든 면에서 작용하는 이성
  alternatives_korean:
  - 전면적으로 작용하는 이성
  - 모든 일을 하는 이성
  - 모든 방식으로 작동하는 이성
  lexicon: LSJ
  rationale: λογισμός는 여기서 인간 내면을 이끄는 이성/이성적 판단을 가리키고, πανεγώργος의 희귀한 포괄적 활동성을 한국어로 풀어 옮겼습니다.
- source_word: τὰς τῶν ἠθῶν καὶ παθῶν ὕλας
  english_pob_choice: the raw materials of character and passions
  chosen_korean: 성품과 정념의 원재료
  alternatives_korean:
  - 성품과 정념의 재료
  - 성격과 감정의 원재료
  - 성품과 욕망의 재료
  lexicon: LSJ
  rationale: ὕλη의 ‘물질/재료’ 비유를 살리기 위해 원재료로 옮겼고, ἤθη와 πάθη는 각각 성품과 정념으로 구분해 인격 형성과 내적 충동의 구별을 유지했습니다.
- source_word: ἐξημεροῖ
  english_pob_choice: tames
  chosen_korean: 길들입니다
  alternatives_korean:
  - 순하게 합니다
  - 다스립니다
  - 유순하게 합니다
  lexicon: LSJ
  rationale: 거칠고 통제되지 않은 내적 재료를 이성의 작용 아래 복종시키는 의미를 살려 ‘길들입니다’로 옮겼습니다.
theological_decisions:
- issue: λογισμός의 철학적·윤리적 의미
  chosen_reading: 이성
  alternative_readings:
  - 이성적 판단
  - 사고력
  - 합리성
  rationale: 이 책에서 λογισμός는 정념을 제어하는 핵심 내적 능력이므로, 한국어 독자가 철학적 무게를 이해하기 쉬운 ‘이성’이 가장 적절합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 5
- issue: πάθη의 번역
  chosen_reading: 정념
  alternative_readings:
  - 감정
  - 욕정
  - 감각
  rationale: 여기서는 외적 고통이 아니라 내면의 격정과 충동을 뜻하므로, 윤리철학적 용례를 살리는 ‘정념’이 적합합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 5
