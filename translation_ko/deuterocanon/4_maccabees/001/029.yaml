  - severity: low
    issue: ἀποκνίζων의 의미가 본문과 각주에서 불일치
    rationale: 본문의 ‘다듬고’는 폭넓게 해석될 수 있으나, 각주는 ‘깎아내고’로 설명합니다. 이 동사는 불필요하거나 거친 부분을 깎아 제거하는 이미지를 지니므로 본문도 ‘깎아 내고’로 통일하는 편이 낫습니다.
