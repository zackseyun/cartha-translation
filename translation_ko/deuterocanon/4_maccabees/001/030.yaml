  text: For reason is the guide of the virtues and the master of the passions. Therefore, I will first demonstrate through the restraining works of self-control that reason is self-governing over the passions.
translation:
  language: ko
  text: 실로 이성은 덕들의 인도자이며 정념들의 주인입니다. 그러므로 저는 먼저 절제의 억제하는 행위들을 통해 이성이 정념들에 대해 스스로를 다스린다는 것을 보여 드리겠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λογισμός
  english_pob_choice: reason
  chosen_korean: 이성
  alternatives_korean:
  - 이치
  - 사유
  - 판단력
  lexicon: λογισμός
  rationale: 여기서는 단순한 계산이나 의견이 아니라 덕과 정념을 다스리는 내적 이성/판단 기능을 가리키므로, 현대 한국어에서 가장 자연스럽고 폭넓게 대응하는 ‘이성’을 택했습니다.
- source_word: ἡγεμών
  english_pob_choice: guide
  chosen_korean: 인도자
  alternatives_korean:
  - 안내자
  - 지도자
  - 선도자
  lexicon: ἡγεμών
  rationale: 덕들을 ‘이끄는’ 비유를 살리기 위해 ‘인도자’를 썼습니다. ‘지도자’는 현대 정치적 뉘앙스가 강해 문맥의 비유성을 덜 드러냅니다.
- source_word: αὐτοκράτωρ
  english_pob_choice: master
  chosen_korean: 주인
  alternatives_korean:
  - 지배자
  - 군주
  - 통치자
  lexicon: αὐτοκράτωρ
  rationale: 정념들에 대한 지배/주권을 강하게 보이게 하되, ‘자기-다스림’이라는 다음 절과 연결되도록 ‘주인’으로 옮겼습니다.
- source_word: αὐτοδέσποτός ἐστιν
  english_pob_choice: self-governing
  chosen_korean: 스스로를 다스린다는
  alternatives_korean:
  - 자기 지배적이라는
  - 자기 주권적이라는
  - 스스로의 주인이라는
  lexicon: αὐτοδέσποτός
  rationale: English POB의 ‘self-governing’은 단순한 권력보다 자기 통제와 자기 지배를 강조하므로, 한국어에서도 자연스럽게 ‘스스로를 다스리다’로 풀어 source의 윤리적 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 정념(παθήματα)과 절제(σωφροσύνη)의 윤리적 대비를 어떻게 한국어로 드러낼지
  chosen_reading: ‘정념들’과 ‘절제의 억제하는 행위들’로 옮겨, 내적 욕구를 통제하는 금욕적·도덕적 논지를 보존했습니다.
  alternative_readings:
  - 감정들
  - 욕망들
  - 열정들
  rationale: 이 문맥의 παθήματα는 단순 감정보다 인간을 흔드는 정념/욕정에 가깝기 때문에, 한국어 독자가 본문의 도덕철학적 대비를 즉시 이해하도록 ‘정념’이 가장 적절합니다.
  doctrine_reference: 헬라스틱 유대 윤리와 지혜 전통의 자기절제 개념
