  source_fidelity: 핵심 어휘는 대체로 잘 반영했습니다. 그러나 αὐτοδέσποτός ἐστιν τῶν παθῶν은 이성이 ‘자기 자신을’ 다스린다는 뜻이 아니라 정념들에 대하여 독자적·절대적인 지배권을 가진다는 뜻입니다. 현행 ‘스스로를 다스린다’는 재귀 목적어를 보태어 정념들이라는 원문의 지배 대상을 흐립니다.
  naturalness: ‘절제의 억제하는 행위들’은 수식 관계가 겹쳐 현대 한국어로 다소 부자연스럽습니다. ‘절제의 억제 작용들’이 간결하면서도 κωλυτικῶν ... ἔργων의 기능적 의미를 보존합니다.
  terminology: ‘이성’, ‘덕들’, ‘정념들’, ‘절제’는 이 윤리철학적 문맥에서 적절합니다. αὐτοκράτωρ의 ‘주인’도 가능하나, 뒤 절의 αὐτοδέσποτος를 ‘독자적으로 지배하다’로 옮겨 두 표현의 강조를 구별했습니다.
  issues:
