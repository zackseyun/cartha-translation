- from: 실로 이성은 덕들의 인도자이며 정념들의 주인입니다. 그러므로 저는 먼저 절제의 억제하는 행위들을 통해 이성이 정념들에 대해 스스로를 다스린다는 것을 보여 드리겠습니다.
  to: 왜냐하면 이성은 덕들의 인도자이며 정념들의 주인입니다. 그러므로 저는 먼저 절제의 억제 작용들을 통하여, 이성이 정념들을 독자적으로 지배한다는 것을 보여 드리겠습니다.
  rationale: 문맥상 γάρ의 연결 기능을 ‘왜냐하면’으로 드러내고, 절제의 억제 기능을 자연스러운 한국어 명사구로 다듬었습니다. 특히 αὐτοδέσποτος를 재귀적 자기 통제로 해석하지 않고, 정념들에 대한 이성의 독자적 지배라는 원문의 통치 비유를 보존했습니다.
