  text: Now among desires, some are of the soul and others of the body; and over both of these, reason is evidently master.
  footnotes:
  - marker: a
    text: Or, 'reason evidently prevails over both of them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 욕망에는 영혼에 속한 것들도 있고 몸에 속한 것들도 있습니다. 이 두 종류 모두에 대해 이성이 우세해 보입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이성이 이 두 종류 모두를 지배하는 것으로 보입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμιῶν
  english_pob_choice: desires
  chosen_korean: 욕망들
  alternatives_korean:
  - 욕구들
  - 갈망들
  - 바람들
  lexicon: BDAG
  rationale: ἐπιθυμία는 넓게는 욕망/갈망을 뜻하므로, 철학적 분류를 살리면서도 한국어에서 자연스러운 ‘욕망들’로 옮겼습니다.
- source_word: ψυχικαί
  english_pob_choice: of the soul
  chosen_korean: 영혼에 속한
  alternatives_korean:
  - 영적인
  - 정신의
  - 혼의
  lexicon: LSJ
  rationale: ψυχικός과 σωματικός의 대조를 그대로 살리기 위해 ‘영혼에 속한’으로 옮겨, ‘정신의’처럼 심리학적으로 좁아지거나 ‘영적인’처럼 의미가 확장되는 것을 피했습니다.
- source_word: σωματικαί
  english_pob_choice: of the body
  chosen_korean: 몸에 속한
  alternatives_korean:
  - 육체에 속한
  - 신체적인
  - 육체적인
  lexicon: LSJ
  rationale: ψυχικαί와의 평행을 유지하면서도 현대 한국어에서 자연스럽게 들리도록 ‘몸에 속한’으로 번역했습니다.
- source_word: λογισμός
  english_pob_choice: reason
  chosen_korean: 이성
  alternatives_korean:
  - 이성적 판단
  - 이해
  - 생각
  lexicon: LSJ
  rationale: 4 마카베오서에서 λογισμός는 인간의 이성적 능력, 곧 절제된 판단을 가리키므로 짧고 현대적인 ‘이성’이 가장 적절합니다.
- source_word: ἐπικρατεῖ
  english_pob_choice: is master / prevails
  chosen_korean: 우세합니다
  alternatives_korean:
  - 지배합니다
  - 주도합니다
  - 승리합니다
  lexicon: LSJ
  rationale: 영어 POB의 ‘evidently master’와 ‘evidently prevails’의 의미를 모두 반영하되, 한국어에서 과도하게 군림하는 뉘앙스를 줄이고 본문의 논증적 우위감을 살리기 위해 ‘우세합니다’로 옮겼습니다.
theological_decisions:
- issue: ψυχικαί와 σωματικαί의 인류학적 구분
  chosen_reading: 욕망을 ‘영혼에 속한 것’과 ‘몸에 속한 것’으로 구분해, 본문의 철학적 분류를 그대로 드러냈습니다.
  alternative_readings:
  - 영적인 것과 육체적인 것
  - 정신적인 것과 신체적인 것
  rationale: 이 구절은 교리를 확정하는 이분법을 제시하기보다 욕망의 범주를 분류하므로, 후대 신학 용어로 평탄화하지 않고 원문의 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: λογισμός의 지배성 표현
  chosen_reading: ‘이성은 분명히 우세합니다’로 옮겨, reason의 우위가 논증적으로 드러나게 했습니다.
  alternative_readings:
  - 이성은 지배합니다
  - 이성은 분명히 주도합니다
  rationale: 본문은 절제된 이성의 우세를 말하므로, 도덕적 통제의 효과를 드러내되 지나치게 군주적 이미지를 덧씌우지 않는 표현을 택했습니다.
  doctrine_reference: Original-language primacy over translation tradition; readable modern Korean.
