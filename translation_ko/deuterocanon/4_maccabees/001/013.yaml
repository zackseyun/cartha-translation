translation:
  language: ko
  text: 그러므로 이제 우리가 살펴봅시다. 이성이 정념을 지배하는지 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이성적 판단이 정념을 지배하는지’입니다.
