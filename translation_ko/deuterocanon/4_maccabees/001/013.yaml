lexical_decisions:
- source_word: Ζητοῦμεν
  english_pob_choice: let us examine
  chosen_korean: 우리가 살펴봅시다
  alternatives_korean:
  - 우리가 조사해 봅시다
  - 우리가 알아봅시다
  - 우리가 탐구해 봅시다
  lexicon: LSJ
  rationale: 첫인칭 복수 현재형은 단순히 ‘우리가 구하다’보다 토론을 여는 권유로 기능하므로, 자연스러운 합쇼체로 ‘살펴봅시다’가 적절합니다.
- source_word: δὴ τοίνυν
  english_pob_choice: So then
  chosen_korean: 그러므로 이제
  alternatives_korean:
  - 그러니 이제
  - 그렇다면 이제
  - 자 그러면
  lexicon: LSJ
  rationale: 두 입자는 앞의 논의를 이어 결론으로 나아가는 전환을 표시하므로, 한국어에서는 ‘그러므로 이제’로 유도와 추론의 힘을 함께 살렸습니다.
- source_word: αὐτοκράτωρ
  english_pob_choice: master
  chosen_korean: 지배하는
  alternatives_korean:
  - 주인인
  - 주권을 가진
  - 자기지배하는
  lexicon: LSJ
  rationale: 철학적·윤리적 문맥에서 ‘master over’는 관계적 지배를 뜻하므로, 한국어에서는 ‘지배하는’이 가장 직접적으로 대응합니다.
- source_word: τῶν παθῶν
  english_pob_choice: the passions
  chosen_korean: 정념을
  alternatives_korean:
  - 감정을
  - 욕정들을
  - 열정을
  lexicon: LSJ
  rationale: πάθη는 단순 감정보다 철학적 인간론에서의 정념을 가리키므로, ‘정념’이 본문의 논지를 가장 잘 보존합니다.
- source_word: ὁ λογισμός
  english_pob_choice: reason
  chosen_korean: 이성
  alternatives_korean:
  - 이성적 판단
  - 생각
  - 이성의 판단
  lexicon: LSJ
  rationale: λογισμός는 이성적 사고 기능을 가리키며, 본문이 정념과 대비시키는 윤리적 원리를 살리기 위해 ‘이성’으로 옮겼습니다.
theological_decisions:
- issue: 철학적 인간론에서 λογισμός와 πάθη의 대비를 어떻게 살릴 것인가
  chosen_reading: 이성이 정념을 지배하는지라는 형태로, 이성의 통치와 정념의 대립을 그대로 드러냈습니다.
  alternative_readings:
  - 마음이 감정을 다스리는지
  - 이성적 판단이 정념을 지배하는지
  rationale: 본문은 구원론적 언어보다 헬라스적 윤리 철학의 핵심 명제를 제시하므로, 후대의 종교적 어휘로 완화하지 않고 긴장을 유지하는 번역이 필요합니다.
  doctrine_reference: 철학적-인간론적 명제의 source-direct 번역; πάθη를 정서 일반으로 축소하지 않음.
