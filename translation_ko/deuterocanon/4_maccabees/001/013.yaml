  verdict: revise
  source_fidelity: 원문의 권유형 Ζητοῦμεν과 논증 전환을 ‘살펴봅시다’로 옮긴 점, λογισμός/πάθη를 각각 ‘이성’/‘정념’으로 옮긴 점은 충실합니다. 다만 원문은 한 문장으로 ‘이성이 정념을 지배하는지 살펴보자’라는 물음을 제시하므로, 현 번역의 문장 분리와 종결 표현은 그 직접성을 다소 약화합니다.
  naturalness: ‘그러므로 이제 우리가 살펴봅시다. 이성이 정념을 지배하는지 말입니다.’는 현대 표준 합쇼체에서 다소 번역투이며, 특히 ‘말입니다’는 권유문 뒤에 붙어 부자연스럽습니다. 목적절을 ‘살펴봅시다’ 앞에 두어 한 문장으로 구성하는 편이 자연스럽습니다.
  terminology: ‘이성’과 ‘정념’은 이 구절의 철학적 대조를 적절히 보존합니다. ‘지배하다’도 αὐτοκράτωρ의 권위·통솔 의미를 무리 없이 전달합니다. 각주에서는 λογισμός의 대안뿐 아니라 αὐτοκράτωρ의 ‘주권적’ 뉘앙스를 드러낼 수 있습니다.
