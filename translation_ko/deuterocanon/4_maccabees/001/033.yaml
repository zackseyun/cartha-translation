base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/033.yaml
  text: For why is it that[a], when we are moved toward the forbidden foods, we turn away from the pleasures that come from them? Is it not because reason is able to prevail over desires? I think so.
  footnotes:
  - marker: a
    text: Or 'appetites' for 'desires'; the Greek term can emphasize bodily craving in this context of food.
    reason: lexical_alternative
translation:
  language: ko
  text: 왜냐하면 우리가 금지된 음식 쪽으로 이끌릴 때, 거기서 나오는 쾌락을 왜 물리칩니까? 그것은 이성([a])이 욕구를 이길 수 있기 때문이 아닙니까? 저는 그렇다고 생각합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘욕구들’. 여기서는 음식에 대한 몸의 갈망을 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  english_pob_choice: For why is it that
  chosen_korean: 왜냐하면
  alternatives_korean:
  - 왜냐하면… 왜냐하면
  - 왜 그런가 하면
  - 도대체 왜
  lexicon: LSJ
  rationale: 원문의 설명적 수사 질문을 자연스러운 현대 한국어로 풀어, 뒤의 두 질문이 이유를 묻는 논지임을 드러냈습니다.
- source_word: κινούμενοι
  english_pob_choice: we are moved toward
  chosen_korean: 우리가 … 쪽으로 이끌릴 때
  alternatives_korean:
  - 우리가 … 쪽으로 움직일 때
  - 우리가 … 쪽으로 자극을 받을 때
  - 우리가 … 쪽으로 끌릴 때
  lexicon: LSJ
  rationale: 수동/중간적 뉘앙스를 살리면서, 음식에 대한 내적 충동을 한국어의 ‘이끌리다’로 옮겼습니다.
- source_word: τὰς ἀπειρημένας τροφάς
  english_pob_choice: the forbidden foods
  chosen_korean: 금지된 음식
  alternatives_korean:
  - 금지된 식품
  - 금하여진 음식
  - 금지된 먹을거리
  lexicon: LSJ
  rationale: τροφάς는 일반적 ‘먹을 것’보다 구체적으로 음식류를 가리키므로, 간결하고 문맥에 맞는 ‘음식’으로 옮겼습니다.
- source_word: ὁ λογισμός
  english_pob_choice: reason
  chosen_korean: 이성
  alternatives_korean:
  - 이성적 판단
  - 합리성
  - 사고력
  lexicon: LSJ
  rationale: 4마카베오스에서 λογισμός는 욕망을 다스리는 이성적 능력을 가리키므로, 철학적 함의를 유지하는 ‘이성’이 적절합니다.
- source_word: τῶν ὀρέξεων ἐπικρατεῖν
  english_pob_choice: to prevail over desires
  chosen_korean: 욕구를 이길 수
  alternatives_korean:
  - 욕망을 제압할 수
  - 욕구를 다스릴 수
  - 욕망을 능가할 수
  lexicon: LSJ
  rationale: ἐπικρατεῖν의 ‘우세하다/이기다’는 의미를 살려, λογισμός이 욕구 위에 서는 대비를 분명히 했습니다.
theological_decisions:
- issue: 4마카베오스의 인간 이해에서 λογισμός와 ὀρέξεις의 관계
  chosen_reading: 이성은 욕구를 이길 수 있는 인간의 지배 능력으로 제시됩니다.
  alternative_readings:
  - 이성은 욕망을 완전히 제거하는 능력으로 이해할 수 있습니다.
  - 이성은 단지 충동을 조절하는 기능으로만 볼 수 있습니다.
  rationale: 본문은 욕구의 소멸이 아니라 이성이 욕구를 ‘이긴다’는 논증을 전개하므로, 긴장 관계를 그대로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; philosophical-anthropological language should remain source-transparent.'
