  source_fidelity: 마지막 절의 καθαρσθῆναι는 수동 부정과거이며, 원문에는 ‘정결하게 하신’ 주체가 명시되지 않습니다. 초안의 ‘정결하게 되도록 하셨습니다’는 불필요한 행위 주체를 도입하고, ὥστε의 결과 관계도 다소 흐립니다. 이를 수동 결과 표현으로 바로잡았습니다. 또한 θαυμαστότεροι의 비교급과 도덕적 찬탄의 뜻을 ‘더욱 감탄할 만한 이들’로 자연스럽게 반영했습니다.
  naturalness: ‘모든 사람에게서 … 자들에게서도’보다 ‘모든 사람에게뿐만 아니라 … 자들에게도’가 현대 한국어에서 더 자연스럽습니다. ‘그 결과’를 사용하여 앞선 인내와 폭정의 붕괴, 조국의 정결 사이의 결과 관계를 명료하게 했습니다.
  terminology: ἀνδρία와 ὑπομονή는 각각 ‘용기’와 ‘인내’로 유지했습니다. αἰκισαμένων은 폭력성을 보존하여 ‘고문한 자들’로, τυραννίς는 ‘폭정’으로, πατρίς는 격조와 영토적 의미를 살려 ‘조국’으로 옮겼습니다. ‘정결하게 되었습니다’는 καθαρσθῆναι의 정화·의례·회복 관련 함의를 특정 교리로 한정하지 않습니다.
