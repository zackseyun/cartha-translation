base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/011.yaml
  text: For those men became even more admirable[a], not only to all people for their courage and endurance, but also to those who tortured them; they became the cause of the overthrow of the tyranny against the nation, having conquered the tyrant by endurance[b], so that through them the fatherland was purified.
  footnotes:
  - marker: a
    text: Or 'the homeland.' The Greek πατρίς denotes one's native land; 'fatherland' was chosen to preserve the elevated rhetorical tone.
    reason: lexical_alternative
  - marker: b
    text: '''Was purified'' may also be understood as ''was cleansed,'' carrying possible moral, ritual, or national-restorative overtones.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들 남자들은 용기와 인내 때문에 모든 사람에게서뿐만 아니라 자신들을 고문하던 자들에게서도 더더욱 놀라운 사람들로 여겨졌습니다. 그들은 인내로 폭군을 이겨 민족을 거스르던 폭정이 무너지는 원인이 되었고, 그들로 말미암아 조국이 정결하게 되도록 하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘정결하게 되도록 하셨습니다’는 본문의 καθαρσθῆναι가 지닐 수 있는 정화, 회복, 혹은 의례적 뉘앙스를 모두 열어 둔 표현입니다.
    reason: theological_note
  - marker: b
    text: ‘폭정’은 τυραννίς의 정치적 폭압과 억압성을 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: θαυμαστότεροι
  english_pob_choice: even more admirable
  chosen_korean: 더더욱 놀라운 사람들로 여겨졌습니다
  alternatives_korean:
  - 더욱 감탄할 만한 사람들이었습니다
  - 더욱 뛰어난 사람들이었습니다
  lexicon: LSJ
  rationale: 비교급의 강조를 살리면서도, 문맥상 도덕적 평가를 드러내는 표현으로 옮겼습니다.
- source_word: ἀνδρίᾳ καὶ τῇ ὑπομονῇ
  english_pob_choice: for their courage and endurance
  chosen_korean: 용기와 인내 때문에
  alternatives_korean:
  - 담대함과 인내 때문에
  - 남자다움과 인내 때문에
  lexicon: LSJ
  rationale: ἀνδρία를 현대 한국어에서 자연스러운 덕목인 ‘용기’로 옮기고, ὑπομονή는 두 번 반복되므로 일관되게 ‘인내’로 유지했습니다.
- source_word: ὑπὸ τῶν αἰκισαμένων
  english_pob_choice: to those who tortured them
  chosen_korean: 자신들을 고문하던 자들에게서도
  alternatives_korean:
  - 자신들을 고문한 자들에게서도
  - 자신들을 학대하던 자들에게서도
  lexicon: LSJ
  rationale: 가해 행위의 폭력을 분명히 드러내기 위해 ‘고문하다’를 사용했고, ὑπό의 수동적 지배 관계를 ‘-에게서도’로 자연스럽게 살렸습니다.
- source_word: καταλυθῆναι τὴν κατὰ τοῦ ἔθνους τυραννίδα
  english_pob_choice: the overthrow of the tyranny against the nation
  chosen_korean: 민족을 거스르던 폭정이 무너지는
  alternatives_korean:
  - 민족에 대한 폭정이 전복되는
  - 민족을 향한 폭정이 무너지는
  lexicon: LSJ
  rationale: τυραννίς는 정치적 폭압을 뜻하므로 ‘폭정’으로 옮겼고, ἔθνος는 여기서 집단적 민족을 가리키므로 ‘민족’으로 유지했습니다.
- source_word: ὥστε καθαρσθῆναι διʼ αὐτῶν τὴν πατρίδα
  english_pob_choice: so that through them the fatherland was purified
  chosen_korean: 그들로 말미암아 조국이 정결하게 되도록 하셨습니다
  alternatives_korean:
  - 그들로 말미암아 조국이 깨끗해지도록 하셨습니다
  - 그들로 말미암아 조국이 정화되도록 하셨습니다
  lexicon: LSJ
  rationale: καθαίρω의 결과 의미를 살리되, 4 마카베오기의 순교 문맥에서 도덕적·종교적 뉘앙스를 포괄하는 ‘정결하게 되다’로 옮겼습니다.
theological_decisions:
- issue: ‘그들로 말미암아 조국이 정결하게 되었다’의 의미 범위
  chosen_reading: 문맥이 허용하는 정화·회복의 폭을 살리되, 이를 단순한 정치 해방으로 축소하지 않았습니다.
  alternative_readings:
  - 조국이 정치적으로 해방되었다
  - 조국이 의례적으로 정결하게 되었다
  - 순교자들의 고난에 속죄적 의미가 있다
  rationale: καθαρσθῆναι는 도덕적·의례적 정화와 더 넓은 회복을 모두 열어 두므로, 본문이 말하는 효과를 보존하면서도 그 기제를 단정하지 않았습니다.
  doctrine_reference: 본문의 긴장을 보존합니다.
