  lexicon: LSJ
  rationale: 두 부사가 중복되며 논증의 다면성과 다양성을 강조하므로, 한국어에서는 의미를 살리면서도 자연스러운 병렬 표현인 ‘여러 각도와 여러 방식으로’로 옮겼습니다.
- source_word: ἔχοιμʼ ἂν ὑμῖν ἐπιδεῖξαι
  english_pob_choice: I could show you
  chosen_korean: 저는 … 여러분에게 보여 줄 수 있습니다
  alternatives_korean:
  - 저는 … 여러분에게 증명할 수 있습니다
  - 저는 … 여러분에게 입증할 수 있습니다
  lexicon: BDAG
  rationale: 잠재 가능성을 나타내는 표현이므로 ‘할 수 있습니다’로 옮겼고, ἐπιδεῖξαι는 논증 맥락의 ‘보여 주다’가 가장 무난하여 과도한 ‘증명하다’보다 덜 단정적으로 처리했습니다.
- source_word: αὐτοκράτωρ ἐστὶν τῶν παθῶν
  english_pob_choice: is master of the passions
  chosen_korean: 욕정들을 지배하는 주인
  alternatives_korean:
  - 정욕들의 주인
  - 정념들을 지배하는 자
  - 정욕을 다스리는 주인
  lexicon: LSJ
  rationale: αὐτοκράτωρ의 지배적 권능을 살리기 위해 ‘주인’을 택했고, παθῶν은 4 마카베오스의 윤리적·심리적 맥락에서 단순한 감정보다 ‘욕정’이 더 정확해 기존 교회적 어휘의 완곡함을 피했습니다.
- source_word: ὁ εὐσεβὴς λογισμός
  english_pob_choice: devout reason
  chosen_korean: 경건한 이성
  alternatives_korean:
  - 경건한 이성적 판단
  - 경건한 이성 작용
  - 경건한 이성
  lexicon: BDAG
  rationale: λογισμός는 단순한 추론이 아니라 이성적 판단/사고 전체를 가리키므로 ‘이성’으로 핵심을 살렸고, εὐσεβής는 ‘경건한’으로 옮겨 하나님을 향한 경외가 스며든 판단이라는 의미를 유지했습니다.
theological_decisions:
- issue: ὁ εὐσεβὴς λογισμός의 성격
  chosen_reading: ‘경건한 이성’으로, 이성이 하나님 경외에 의해 규율되는 윤리적 힘으로 제시했습니다.
  alternative_readings:
  - ‘경건한 이성적 판단’
  - ‘경건한 사고’
  - ‘경건한 이성’보다 더 기술적인 철학 용어로 옮김
  rationale: 본문의 프로그램적 개념은 이성과 경건을 분리하지 않고 결합하므로, 너무 철학화하거나 지나치게 종교화하지 않는 균형이 필요합니다. ‘경건한 이성’은 그 긴장을 그대로 유지합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; represent source concepts without domesticating them.'
