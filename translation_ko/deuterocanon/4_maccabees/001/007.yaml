  text: 그러므로 저는 여러 각도에서 또 여러 방식으로[a] 경건한 이성[b]이 욕정들을 다스리는 주권자임을 여러분에게 보여 드릴 수 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러 측면에서 또 다른 여러 방면에서’. 짝을 이룬 그리스어 부사는 여러 갈래의 논증을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘경건한 이성적 판단’. 이 그리스어 표현은 4 마카베오스의 핵심 주제로서, 하나님을 경외함으로 규율되는 이성을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλαχόθεν μὲν οὖν καὶ ἀλλαχόθεν
  english_pob_choice: from many angles and in many ways
  chosen_korean: 여러 각도와 여러 방식으로
  alternatives_korean:
