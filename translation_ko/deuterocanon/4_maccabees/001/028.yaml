  yaml_path: translation/deuterocanon/4_maccabees/001/028.yaml
  text: Therefore[a], just as pleasure and pain are two growths of the body and the soul, many passions are offshoots of these[b];
  footnotes:
  - marker: a
    text: Or 'plants' or 'shoots' of the body and the soul; the Greek uses botanical imagery throughout the sentence.
    reason: lexical_alternative
  - marker: b
    text: Or 'emotions' or 'affections'; the Greek word can denote the passions or emotional impulses that reason must govern in this work.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로, 몸과 영혼의 두 뿌리인 쾌락과 고통이 있듯이, 많은 정념은 그것들의 곁가지입니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘식물들’ 또는 ‘싹들’일 수 있으며, 이 문장 전체에서 식물 비유가 이어집니다.
    reason: lexical_alternative
  - marker: b
    text: ‘정념’은 이 저작에서 이성이 다스려야 하는 감정적 충동을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ οὖν
  english_pob_choice: Therefore, just as
  chosen_korean: 그러므로, … 있듯이
  alternatives_korean:
  - 그러므로, 마치 …처럼
  - 따라서, …와 같이
  lexicon: LSJ
  rationale: οὖν의 논리적 연결을 ‘그러므로’로, καθάπερ의 비교를 ‘~있듯이’로 살려 자연스러운 한국어 비교문으로 옮겼습니다.
- source_word: φυτῶν
  english_pob_choice: growths
  chosen_korean: 뿌리
  alternatives_korean:
  - 식물
  - 싹
  - 자람
  lexicon: LSJ
  rationale: 본문 전체가 식물 비유를 쓰지만, 한국어에서 ‘growths’의 비유적 기능을 가장 간결하게 드러내기 위해 ‘뿌리’로 옮겼습니다. 다만 이는 직역보다 해석성이 있으므로 문맥상 원뜻을 덧붙이는 방식으로만 사용했습니다.
- source_word: ἡδονῆς τε καὶ πόνου
  english_pob_choice: pleasure and pain
  chosen_korean: 쾌락과 고통
  alternatives_korean:
  - 즐거움과 아픔
  - 기쁨과 고통
  lexicon: LSJ
  rationale: 철학적·수사학적 문맥에서 ἡδονή/πόνος의 대립을 한국어로도 분명히 드러내기 위해 ‘쾌락과 고통’을 택했습니다.
- source_word: παραφυάδες
  english_pob_choice: offshoots
  chosen_korean: 곁가지
  alternatives_korean:
  - 새순
  - 파생물
  - 가지치기된 가지
  lexicon: LSJ
  rationale: παραφυάδες의 식물적 이미지를 유지하면서, 앞선 ‘뿌리’ 이미지와 짝을 이루는 자연스러운 한국어로 ‘곁가지’를 선택했습니다.
- source_word: πάθη
  english_pob_choice: passions
  chosen_korean: 정념
  alternatives_korean:
  - 감정
  - 정서
  - 수난
  lexicon: LSJ
  rationale: 이 책의 철학적 논증에서 πάθη는 단순한 감정보다 이성이 다스려야 하는 정념을 가리키므로, 전문성이 있는 ‘정념’이 가장 적합합니다.
theological_decisions:
- issue: ψυχή의 번역에서 ‘영혼’ 유지 여부
  chosen_reading: ‘영혼’으로 옮겨 σώματος καὶ τῆς ψυχῆς의 인간론적 대구를 보존했습니다.
  alternative_readings:
  - 몸과 생명
  - 육체와 내면
  rationale: 여기서는 헬라 철학적 대비가 분명하므로 ψυχή를 ‘생명’으로 풀기보다 ‘영혼’으로 번역해 본문의 사유 틀을 그대로 드러내는 것이 더 충실합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, original-language primacy; preserve theological tension rather than resolve it
