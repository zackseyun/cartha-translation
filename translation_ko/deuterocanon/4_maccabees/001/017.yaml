  text: This[a], then, is the instruction of the law[b], by which we learn divine matters reverently and human matters profitably.
  footnotes:
  - marker: a
    text: Or 'the discipline of the law' or 'the instruction of the law.' The Greek παιδεία includes the sense of formative moral education.
    reason: lexical_alternative
  - marker: b
    text: Or 'divine things ... human affairs.' The Greek contrasts τὰ θεῖα with τὰ ἀνθρώπινα in broad categories.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것이 바로 율법의 훈육[a]이니, 그것으로 우리는 신적인 것들은 경건하게, 인간적인 것들은 유익하게 배웁니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘율법의 교육’, ‘율법의 교훈’. 그리스어 παιδεία에는 형성적 도덕 교육의 뜻이 포함됩니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘신적인 것들 … 인간사’. 그리스어는 τὰ θεῖα와 τὰ ἀνθρώπινα를 넓은 범주로 대조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ τοῦ νόμου παιδεία
  english_pob_choice: the instruction of the law / the training of the law
  chosen_korean: 율법의 훈육
  alternatives_korean:
  - 율법의 교육
  - 율법의 교훈
  - 율법의 훈련
  lexicon: LSJ
  rationale: παιδεία는 단순한 지식 전달보다 형성적·규범적 ‘훈육/교육’의 뜻이 있어, 합쇼체 문맥에서 ‘훈육’이 가장 압축적으로 그 뉘앙스를 살립니다.
- source_word: τὰ θεῖα
  english_pob_choice: divine matters
  chosen_korean: 신적인 것들
  alternatives_korean:
  - 신성한 일들
  - 하나님의 일들
  - 거룩한 것들
  lexicon: LSJ
  rationale: 그리스어는 광범위한 중성 복수로 ‘신적인 범주’를 가리키므로, 특정화된 ‘하나님의 일들’보다 더 넓은 ‘신적인 것들’이 원문 범위를 잘 보존합니다.
- source_word: σεμνῶς
  english_pob_choice: reverently
  chosen_korean: 경건하게
  alternatives_korean:
  - 공경하여
  - 엄숙하게
  - 존귀하게
  lexicon: LSJ
  rationale: 신적인 것들에 대응하는 부사로, 단순한 태도보다 경외와 경건의 뉘앙스를 담는 ‘경건하게’가 자연스럽습니다.
- source_word: τὰ ἀνθρώπινα συμφερόντως
  english_pob_choice: human matters profitably
  chosen_korean: 인간적인 것들은 유익하게
  alternatives_korean:
  - 인간적인 일들은 이롭게
  - 인간사에는 유익하게
  - 인간적인 일들은 도움되게
  lexicon: LSJ
  rationale: τὰ ἀνθρώπινα는 넓은 범주의 ‘인간적인 것들’이고, συμφερόντως는 ‘유익하게/이롭게’의 실용적·도움이 되는 뜻이므로 이를 직설적으로 옮겼습니다.
theological_decisions:
- issue: 율법(νόμος)의 지시 대상
  chosen_reading: 여기서는 모세오경/토라를 가리키는 ‘율법’으로 옮기되, 원문의 일반 명사 형태를 따라 대문자화나 해설적 확장을 하지 않았습니다.
  alternative_readings:
  - 율법을 ‘율법서’로 구체화
  - ‘하나님의 법’으로 신학적 확장
  rationale: 4마카베오스의 문맥상 유대 율법을 뜻하지만, 원문에는 추가 표지가 없으므로 한국어도 간결하게 ‘율법’으로 유지하는 것이 원문 충실성에 맞습니다.
  doctrine_reference: 원문 우선 원칙; 명시되지 않은 신학적 확장 지양
