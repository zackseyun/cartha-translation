  rationale: 4마카베오스의 문맥상 유대 율법을 뜻하지만, 원문에는 추가 표지가 없으므로 한국어도 간결하게 ‘율법’으로 유지하는 것이 원문 충실성에 맞습니다.
  doctrine_reference: 원문 우선 원칙; 명시되지 않은 신학적 확장 지양
