  text: This[a], then, is the instruction of the law[b], by which we learn divine matters reverently and human matters profitably.
  footnotes:
  - marker: a
    text: Or 'the discipline of the law' or 'the instruction of the law.' The Greek παιδεία includes the sense of formative moral education.
