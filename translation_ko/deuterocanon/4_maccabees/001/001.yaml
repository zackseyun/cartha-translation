  text: Since I am about to demonstrate a most philosophical argument—whether devout reason is master of the passions—I would rightly advise you to give eager attention to philosophy[a].
  footnotes:
  - marker: a
    text: Or, 'whether pious reason is absolute master of the passions.'
    reason: lexical_alternative
translation:
  language: ko
  text: 더없이 철학적인 논증—곧 경건한 이성이 정념들의 주인인지에 관한 논증—을 제시하려는 저는, 여러분께서 철학에 열심히 주의를 기울이시도록 마땅히 권하고 싶습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정념들의 절대적인 주인인지’.
    reason: αὐτόδεσποτός의 독립적·절대적인 지배의 뉘앙스를 드러내는 어휘적 대안입니다.
lexical_decisions:
- source_word: ΦΙΛΟΣΟΦΩΤΑΤΟΝ λόγον
  english_pob_choice: a most philosophical argument
  chosen_korean: 가장 철학적인 논증
  alternatives_korean:
  - 매우 철학적인 논설
  - 지극히 철학적인 말
  lexicon: LSJ
  rationale: λόγος는 단순한 ‘말’보다 저자가 제시할 논증·담론을 가리키므로 ‘논증’으로 옮겼고, φιλοσοφώτατον의 최상급 뉘앙스를 ‘가장 철학적인’으로 살렸습니다.
- source_word: ἐπιδείκνυσθαι μέλλων
  english_pob_choice: I am about to demonstrate
  chosen_korean: 제시하려는 저는
  alternatives_korean:
  - 보여 주려는 저는
  - 증명하려는 저는
  lexicon: LSJ
  rationale: μέλλων의 임박한 의도와 ἐπιδείκνυσθαι의 공개적 제시·입증의 뜻을 함께 담기 위해 현재진행형이 아닌 의도 표현으로 옮겼습니다.
- source_word: αὐτόδεσποτός ἐστιν τῶν παθῶν
  english_pob_choice: is master of the passions
  chosen_korean: 정욕들을 다스리는 주인인지
  alternatives_korean:
  - 정욕들을 주관하는지
  - 정념들의 절대적 주인인지
  lexicon: LSJ
  rationale: αὐτόδεσποτός의 자기 지배·자율적 지배를 ‘주인’으로 살리고, πάθη는 이 책의 철학적 문맥에 맞게 ‘정욕들’로 옮겼습니다.
- source_word: ὁ εὐσεβὴς λογισμός
  english_pob_choice: devout reason
  chosen_korean: 경건한 이성
  alternatives_korean:
  - 경건한 추론
  - 신앙 깊은 이성
  lexicon: LSJ
  rationale: λογισμός는 사유 작용이 아니라 이성적 판단/이성을 가리키므로 ‘이성’으로 두었고, εὐσεβής의 종교적 결을 ‘경건한’으로 보존했습니다.
- source_word: ὅπως προθύμως προσέχητε τῇ φιλοσοφίᾳ
  english_pob_choice: to give eager attention to philosophy
  chosen_korean: 이 철학에 기꺼이 주의를 기울이도록
  alternatives_korean:
  - 철학에 열심히 귀 기울이도록
  - 철학에 간절히 주의를 기울이도록
  lexicon: LSJ
  rationale: προθύμως의 자발적·열성적 태도를 ‘기꺼이’로, προσέχητε의 주의 집중을 ‘주의를 기울이다’로 옮겨 자연스러운 합쇼체 한국어로 다듬었습니다.
theological_decisions:
- issue: εὐσεβὴς λογισμός의 신학적-철학적 긴장 보존
  chosen_reading: ‘경건한 이성’으로 옮겨, 이성이 단순한 세속적 합리가 아니라 하나님을 향한 경건과 결합된 능력임을 드러냈습니다.
  alternative_readings:
  - ‘경건한 추론’
  - ‘신앙 깊은 이성’
  rationale: 4 마카베오서는 이성과 경건의 결합을 논하므로 둘 중 하나로 축소하지 않고, 현대 한국어에서 가장 직접적으로 긴장을 보존하는 표현을 선택했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; readable modern Korean, not archaic or over-churchified.'
