theological_decisions:
- issue: μονοφαγία의 의미 범위
  chosen_reading: 문맥에서는 사회적으로 혼자 먹는 행위를 가리키는 것으로 본문에 반영하되, 형태상 가능한 ‘한 가지 음식만 먹는 식사’ 가능성은 각주로 남깁니다.
  alternative_readings:
  - 한 가지 음식만 먹는 일
  - 단일 음식 식사
  rationale: 이 구절은 악덕 목록의 일부이므로 사회적·윤리적 뉘앙스가 자연스럽지만, 그리스어 형태 자체가 단일 음식 섭식을 시사할 수 있어 해석의 긴장을 보존해야 합니다.
  doctrine_reference: 해석상 애매함을 해소하지 말고 각주로 보존합니다.
