  rationale: 지나친 먹는 행위를 가리키는 표준적 덕목/악덕 대립어로 ‘탐식’이 가장 간결하고 본문 성격에 맞습니다.
- source_word: μονοφαγία
  english_pob_choice: eating alone
  chosen_korean: 혼자 먹는 일
  alternatives_korean:
  - 홀로 먹는 일
  - 한 가지 음식만 먹는 일
  - 단일 음식 식사
  lexicon: LSJ
  rationale: 영문 POB처럼 문맥상 사회적 고립의 뉘앙스를 살려 ‘혼자 먹는 일’로 옮겼으며, 형태상 가능한 더 문자적인 뜻은 각주로 보존했습니다.
theological_decisions:
- issue: μονοφαγία의 의미 범위
  chosen_reading: 문맥에서는 사회적으로 혼자 먹는 행위를 가리키는 것으로 본문에 반영하되, 형태상 가능한 ‘한 가지 음식만 먹는 식사’ 가능성은 각주로 남깁니다.
  alternative_readings:
  - 한 가지 음식만 먹는 일
