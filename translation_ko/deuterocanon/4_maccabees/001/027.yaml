  lexicon: LSJ
  rationale: κατά + 대격은 여기서 대조되는 범주나 적용 영역을 나타내므로, 한국어로는 자연스럽게 ‘~에 관해서는’으로 옮겨 분류적 의미를 살렸습니다.
