  - 잡식
  lexicon: LSJ
  rationale: 직역하면 ‘모든 것을 먹음’이지만, 악덕 목록의 압축성을 살리기 위해 조어적이면서도 의미가 드러나는 ‘만물식’으로 옮겼습니다.
