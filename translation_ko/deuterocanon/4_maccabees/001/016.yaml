  text: Wisdom[a], then, is knowledge of divine and human matters, and of their causes.
  footnotes:
  - marker: a
    text: Or, more formally, 'the causes of these things.' The Greek τούτων points back to the divine and human matters just mentioned.
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜란 곧 신적이며 인간적인 일들을 알고, 또 그것들의 원인을 아는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하면, ‘이것들의 원인’입니다. 여기서 τούτων은 바로 앞의 신적·인간적 일들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφία
  english_pob_choice: Wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 지혜(대문자화 없음)
  - 지혜됨
  lexicon: LSJ
  rationale: 명사적 정의문이므로 표준적인 추상명사 ‘지혜’로 옮기며, 고유명사화나 인격화는 하지 않았습니다.
- source_word: γνῶσις
  english_pob_choice: knowledge
  chosen_korean: 아는 것
  alternatives_korean:
  - 지식
  - 앎
  lexicon: LSJ
  rationale: 정의 문장에서 ‘knowledge’의 명사성을 살리면서도 한국어에서는 자연스러운 ‘아는 것’으로 풀었습니다.
- source_word: θείων καὶ ἀνθρωπίνων πραγμάτων
  english_pob_choice: divine and human matters
  chosen_korean: 신적이며 인간적인 일들
  alternatives_korean:
  - 신적인 일과 인간적인 일
  - 하나님과 사람에 관한 일들
  lexicon: LSJ
  rationale: θείων과 ἀνθρωπίνων의 대구를 살려 ‘신적이며 인간적인’으로 대응했고, πραγμάτων은 철학적 정의문 맥락에 맞게 ‘일들’로 옮겼습니다.
- source_word: τῶν τούτων αἰτίων
  english_pob_choice: their causes
  chosen_korean: 그것들의 원인
  alternatives_korean:
  - 이것들의 원인
  - 그 일들의 원인
  - 그것들의 까닭
  lexicon: LSJ
  rationale: τούτων이 직전에 나온 ‘신적·인간적 일들’을 가리키므로, 문맥 지시를 분명히 하는 ‘그것들의’로 옮기고 αἰτίων은 철학적 의미의 ‘원인’으로 번역했습니다.
theological_decisions:
- issue: 지혜의 정의문에서 본문을 인격화할지 여부
  chosen_reading: 지혜를 추상적 덕목으로 유지하고 인격화하지 않았습니다.
  alternative_readings:
  - 지혜를 의인화해 ‘지혜는…입니다’로 처리
  - ‘지혜’에 별도 신학적 칭호를 부여
  rationale: 본문은 헬라 철학적 정의문 형식으로 지혜의 개념을 설명하므로, 신학적 의인화보다 개념 정의를 그대로 보존하는 편이 원문 의도에 가깝습니다.
  doctrine_reference: 4마카베오 1:16의 철학적-윤리적 정의 형식
- issue: ‘원인’(αἰτίων)의 해석 범위
  chosen_reading: 인과적 의미의 ‘원인’으로 옮기되, 직전 항목들에 대한 지시를 문장 안에서 드러냈습니다.
  alternative_readings:
  - ‘설명’
  - ‘근거’
  - ‘이유’
  rationale: αἰτίων은 단순한 설명이나 이유보다 더 철학적인 인과 개념을 가리키므로, ‘원인’이 가장 직접적입니다.
  doctrine_reference: 헬라 철학 용어 αἰτία/αἴτιον의 인과 개념
