  yaml_path: translation/deuterocanon/4_maccabees/001/026.yaml
  text: Against the soul are arrogance and love of money and love of honor and contentiousness and envy;[a]
  footnotes:
  - marker: a
    text: Or 'the evil eye' for βασκανία, a term that can carry the sense of envious or malign ill will.
    reason: lexical_alternative
translation:
  language: ko
  text: 영혼을 거슬러 일어나는 것은 교만과 돈을 사랑함과 명예를 사랑함과 다툼을 일삼음과 시기입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악한 눈’으로 옮길 수 있습니다. βασκανία는 시기 또는 해로운 악의의 뜻을 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ μὲν
  english_pob_choice: Against
  chosen_korean: 향합니다
  alternatives_korean:
  - 반대합니다
  - 대항합니다
  - 거슬러 있습니다
  lexicon: LSJ
  rationale: κατά + 속격이 이 목록 문맥에서는 무엇이 영혼을 향해 작용하는지를 나타내므로, 한국어에서는 ‘향하다’를 써서 대립 방향을 자연스럽게 살렸습니다.
- source_word: ψυχῆς
  english_pob_choice: the soul
  chosen_korean: 영혼
  alternatives_korean:
  - 혼
  - 생명
  - 내면
  lexicon: LSJ
  rationale: ψυχή는 여기서 인간의 내적 주체를 가리키므로, 교리적·인간론적 뉘앙스를 보존하는 ‘영혼’이 적절합니다.
- source_word: φιλαργυρία
  english_pob_choice: love of money
  chosen_korean: 돈 사랑
  alternatives_korean:
  - 재물 사랑
  - 돈을 사랑함
  - 탐욕
  lexicon: LSJ
  rationale: 직역상 ‘돈/은 사랑’이지만 현대 한국어에서 자연스럽고 노골적인 결합을 위해 ‘돈 사랑’으로 옮기되, 소유 집착의 도덕적 비판을 유지했습니다.
- source_word: φιλοδοξία
  english_pob_choice: love of honor
  chosen_korean: 명예 사랑
  alternatives_korean:
  - 인정 사랑
  - 영광 사랑
  - 출세욕
  lexicon: LSJ
  rationale: φιλο-의 반복을 살리면서도, 단순한 야망보다 ‘명예’에 대한 애착이라는 어감을 드러내는 표현으로 옮겼습니다.
- source_word: βασκανία
  english_pob_choice: envy
  chosen_korean: 시기심
  alternatives_korean:
  - 시기
  - 악한 눈
  - 질투
  lexicon: LSJ
  rationale: 본문의 기본 의미인 envy를 한국어의 심리 상태로 가장 직접 드러내는 말은 ‘시기심’이며, 영어 각주가 제시한 ‘evil eye’ 뉘앙스는 본문이 아니라 주석으로 처리하는 것이 적절합니다.
