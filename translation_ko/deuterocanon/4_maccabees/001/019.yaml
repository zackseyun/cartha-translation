  source_fidelity: φρόνησις는 여기서 ‘절제’ 자체가 아니라 신중한 판단력/분별( prudence )을 뜻합니다. 또한 ἐξ ἧς는 이성이 정념을 이기는 근거 또는 수단이 이 덕목에서 나온다는 뜻이며, ‘그것으로부터’보다 ‘그것을 통해’가 한국어에서 자연스럽게 이를 전달합니다.
  naturalness: ‘가장 주권적입니다’는 한국어 덕목 논의에서 부자연스럽고, ‘그리고’로 문장을 새로 시작한 연결도 다소 번역투입니다. ‘가장 큰 권위를 지니며’와 ‘이겨 냅니다’가 현대 표준어 합쇼체로 자연스럽습니다.
  terminology: φρόνησις는 ‘신중함’으로 바로잡았습니다. λογισμός의 ‘이성’과 πάθη의 철학적 용어 ‘정념들’은 유지할 수 있습니다. κυριωτάτη는 통치적 우위의 뉘앙스를 살려 ‘가장 큰 권위를 지니며’로 옮겼습니다.
