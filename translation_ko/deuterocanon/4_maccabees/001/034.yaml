  text: Therefore[a], though we desire creatures from the water, birds[b], and four-footed animals—all kinds of food forbidden to us by the law—we abstain because of the mastery of reason.
  footnotes:
  - marker: a
    text: Or 'aquatic creatures' for 'creatures from the water.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'because of the supremacy/mastery of reason.' The phrase reflects the book's central claim that disciplined reason, shaped by the law, rules bodily desires.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 우리는 물에 사는 것들과 새들과 네 발 달린 짐승들을 원하지만—율법에 따라 우리에게 금지된 모든 종류의 음식을—이성의 지배 때문에 절제합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘물속의 생물들’이 될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이성의 지배’는 본문의 핵심 표현인 ‘reason의 우위/통제’를 한국어로 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιγαροῦν
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 따라서
  - 그러니
  lexicon: LSJ
  rationale: 앞선 논지를 받아 결론을 이끄는 추론 접속사이므로, 현대 한국어에서 자연스럽고 논증적 흐름을 살리는 ‘그러므로’가 적절합니다.
- source_word: ἐνύδρων
  english_pob_choice: creatures from the water
  chosen_korean: 물에 사는 것들
  alternatives_korean:
  - 수생 생물들
  - 물속 생물들
  lexicon: LSJ
  rationale: 직역보다 한국어로 자연스럽고, 물에서 사는 동물 전체를 포괄하는 표현으로 원문의 범위를 보존합니다.
- source_word: παντοίων βρωμάτων
  english_pob_choice: all kinds of food
  chosen_korean: 모든 종류의 음식
  alternatives_korean:
  - 온갖 음식
  - 각종 음식
  lexicon: LSJ
  rationale: παντοίων의 포괄성을 살려 ‘모든 종류의’로 옮기고, βρωμάτων은 문맥상 식용을 뜻하는 일반적 ‘음식’이 가장 무난합니다.
- source_word: διὰ τὴν τοῦ λογισμοῦ ἐπικράτειαν
  english_pob_choice: because of the mastery of reason
  chosen_korean: 이성의 지배 때문에
  alternatives_korean:
  - 이성의 우위 때문에
  - 이성의 통제 때문에
  - 이성의 주권 때문에
  lexicon: LSJ
  rationale: λογισμός의 핵심을 ‘이성’으로, ἐπικράτεια의 지배적 힘을 ‘지배’로 옮겨, 4 마카베오서의 금욕적·철학적 논지를 한국어로 분명하게 드러냅니다.
theological_decisions:
- issue: 율법에 따른 음식 금지와 철학적 이성의 결합 표현
  chosen_reading: ‘율법에 따라 우리에게 금지된 모든 종류의 음식’을 유지하고, 절제의 근거를 ‘이성의 지배’로 분명히 옮겼습니다.
  alternative_readings:
  - 율법 아래에서 금지된 음식
  - 법으로 금지된 음식
  rationale: 본문은 단순한 식이 규범이 아니라 율법과 이성의 질서가 함께 작동하는 논지를 전개하므로, 금지의 근거를 율법으로 보존하면서 절제의 이유는 이성의 통제로 드러내는 것이 문맥에 가장 충실합니다.
  doctrine_reference: 4 Maccabees 1:34의 금욕-이성 논증 맥락
- issue: λογισμός의 번역 범위
  chosen_reading: ‘이성’으로 옮기되, 주석적 설명 없이도 ‘지배’와 결합해 통치적 의미를 드러냈습니다.
  alternative_readings:
  - 이성적 판단
  - 이성의 힘
  - 이성의 원리
  rationale: 이 단락에서 λογισμός은 단순한 사고능력보다 욕망을 제어하는 합리적 원리를 뜻하므로, 한국어 독자가 즉시 이해할 수 있는 ‘이성’이 본문어로 적합합니다.
  doctrine_reference: 번역 철학 §5 (핵심 용어 일관성 또는 문서화된 예외)
