  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘악한 성향’은 단일한 악한 행위가 아니라 악의나 사악한 기질 같은 좋지 못한 도덕적 성향을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘잘라 낼 수 없다’입니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘그 악한 성향에 굽혀지지 않도록’입니다. 곧 그 성향에 굴복하거나 휘어지지 않도록이라는 뜻입니다.
    reason: lexical_alternative
