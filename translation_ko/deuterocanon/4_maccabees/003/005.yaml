  text: For reason is not the uprooter of the passions[b][a], but their adversary.
  footnotes:
  - marker: a
    text: Or 'the destroyer of the passions' or 'the one who roots out the passions.' The Greek keeps the image of uprooting.
    reason: lexical_alternative
  - marker: b
    text: That is, reason does not eliminate the passions entirely, but contends against them.
    reason: cross_reference
translation:
  language: ko
  text: 그 이유는 이성이 정념을 뿌리째 뽑는 자가 아니라, 그에 맞서 싸우는 자이기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정념을 뿌리째 뽑는 자’ 또는 ‘정념을 뿌리 뽑는 자’라는 뜻일 수 있습니다. 그리스어는 뿌리째 뽑는 이미지를 유지합니다.
    reason: lexical_alternative
  - marker: b
    text: 곧, 이성은 정념을 완전히 없애기보다 그것과 맞서 대항합니다.
    reason: cross_reference
lexical_decisions:
- source_word: λογισμός
  english_pob_choice: reason
  chosen_korean: 이성
  alternatives_korean:
  - 이해
  - 사유
  - 이성적 판단
  lexicon: LSJ
  rationale: 4 마카베오서는 λογισμός를 인간의 합리적·윤리적 판단 능력으로 사용하므로, 한국어에서는 짧고 철학적 뉘앙스를 살리는 ‘이성’이 가장 자연스럽습니다.
- source_word: ἐκριζωτὴς
