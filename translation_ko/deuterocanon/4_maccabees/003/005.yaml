  - 제거하는 자
  lexicon: LSJ
  rationale: 원어는 ‘뿌리째 뽑다’의 이미지를 가진 명사이므로, 동작을 풀어 ‘뿌리째 뽑는 자’로 옮겨 식물의 뿌리 뽑기 비유를 보존했습니다.
- source_word: τῶν παθῶν
  english_pob_choice: of the passions
  chosen_korean: 정념
  alternatives_korean:
  - 감정들
  - 욕정들
  - 열정
  lexicon: LSJ
  rationale: 여기서 πάθη는 단순한 감정보다 윤리적으로 다스려야 할 정념을 가리키므로, 철학적 용례를 살린 ‘정념’이 적절합니다.
- source_word: ἀνταγωνιστής
  english_pob_choice: adversary
  chosen_korean: 맞서 싸우는 자
  alternatives_korean:
  - 대적하는 자
  - 적수
  - 상대
  lexicon: LSJ
  rationale: ἀνταγωνιστής는 단순한 적보다 ‘맞서 겨루고 싸우는 자’를 뜻하므로, 대립의 역동성을 살려 동사구로 풀어 옮겼습니다.
theological_decisions:
- issue: 이성의 역할과 정념의 관계
  chosen_reading: 이성은 정념을 완전히 제거하는 것이 아니라, 그것에 대항하여 싸우는 역할을 합니다.
  alternative_readings:
  - 이성은 정념의 뿌리를 완전히 뽑아버리지 못하고 맞서 싸웁니다.
  - 이성은 정념의 파괴자가 아니라 경쟁자입니다.
  rationale: 본문은 이성이 정념을 소멸시키는 것이 아니라 대립 관계 속에서 다룬다고 말하므로, 과장 없이 그 긴장을 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
