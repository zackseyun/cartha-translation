  text: Therefore[a], setting reason against desire, he poured out the drink as a libation to God.
  footnotes:
  - marker: a
    text: Or, more literally, 'he poured out the drink to God.' The Greek verb implies a libation or drink offering.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그는 욕망에 이성을 맞세워, 그 술을 하나님께 전제로 부었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘그 술을 하나님께 부었습니다.’ 그리스어 동사는 전제, 곧 음료 제사를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 따라서
  - 그런 까닭에
  lexicon: LSJ
  rationale: 앞선 논지를 이어 주는 추론 표지이므로, 현대 한국어에서 가장 자연스럽고 명시적인 연결어인 ‘그러므로’로 옮겼습니다.
- source_word: ἀντιθεὶς τῇ ἐπιθυμίᾳ τὸν λογισμόν
  english_pob_choice: setting reason against desire
  chosen_korean: 욕망에 이성을 맞세워
  alternatives_korean:
  - 욕망에 이성을 대항시켜
  - 욕망에 판단을 맞세워
  lexicon: LSJ
  rationale: ἀντιτίθημι의 대립 구도를 살려 ‘맞세워’로 옮겼고, λογισμός는 여기서 4마카베오스의 핵심 철학 용어인 이성/이성적 판단을 가리키므로 ‘이성’이 가장 간결합니다.
- source_word: ἔσπεισεν τὸ πόμα
  english_pob_choice: poured out the drink as a libation
  chosen_korean: 그 술을 … 전제로 부었습니다
  alternatives_korean:
  - 그 술을 부었습니다
  - 그 음료를 전제로 드렸습니다
  lexicon: LSJ
  rationale: σπένδω의 제의적 ‘전제/전제하다’ 의미를 드러내되, 한국어에서 자연스럽게 읽히도록 ‘전제로 부었습니다’로 처리했습니다. ‘술’은 πόμα의 직역으로 남기고, 제의적 행위는 동사구에서 드러냈습니다.
- source_word: τῷ θεῷ
  english_pob_choice: to God
  chosen_korean: 하나님께
  alternatives_korean:
  - 하나님에게
  - 하느님께
  lexicon: LSJ
  rationale: 본문의 수신자를 직접 표기하므로, 프로젝트 기본어휘에 따라 ‘하나님께’로 옮겼습니다.
theological_decisions:
- issue: σπένδω의 제의적 뉘앙스
  chosen_reading: 단순히 ‘붓다’가 아니라 하나님께 드리는 전제 행위로 읽히도록 옮겼습니다.
  alternative_readings:
  - 그 술을 하나님께 붓습니다
  - 그 술을 하나님께 바칩니다
  rationale: 그리스어 동사는 일반적인 액체 투여보다 제의적 전제(libation)를 가리키므로, 문맥의 종교적 강도를 약화하지 않기 위해 ‘전제로 부었습니다’라고 번역했습니다.
  doctrine_reference: '번역 원리: 원문이 드러내는 제의적 행위를 평이하게 보존'
