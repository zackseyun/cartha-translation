  source_fidelity: 그리스어의 대조 구조와 λογισμός의 주어는 대체로 충실히 옮겼습니다. 다만 δουλωθῆναι는 ‘종속되다’보다 더 직접적인 노예화 은유이므로 이를 명시하는 편이 원문의 강도를 보존합니다. 또한 δεύτε 번째 절의 ‘여러분이’를 밝혀, 욕망에 노예가 되는 주체가 사람임을 분명히 했습니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘끊어 낼’은 보조 용언 띄어쓰기를 적용했으며, 반복된 ‘이성은’은 원문의 후치 주어와 대조를 한국어에서 분명하게 합니다.
  terminology: λογισμός는 이 문맥에서 ‘이성’으로 적절합니다. ἐπιθυμία는 ‘욕망’, ἐκκόψαι는 비유적 절단의 힘을 지닌 ‘끊어 내다’로 유지했습니다. δουλωθῆναι는 ‘욕망의 노예가 되다’로 옮겨 노예화 비유를 보존했습니다.
