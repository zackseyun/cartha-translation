  text: and to wrestle down the pains of the body[a], though they are extreme, and by the nobility and goodness of reason to spurn all the dominion of the passions.
  footnotes:
  - marker: a
    text: Or 'to reject with contempt all the mastery of the passions.' The Greek verb is literally vivid ('to spit away') and may be taken figuratively as disdainful rejection.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 몸의 고통들이 아무리 극심할지라도 그것을 제압하고, 이성의 고귀함과 선함으로 모든 정욕의 지배를 뱉어 버리라는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정욕의 모든 통치력을 경멸하며 뱉어 버리라는 것입니다.’ 그리스어 동사는 문자적으로는 ‘뱉어 내다’는 뜻으로, 경멸적 거절을 비유적으로 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰς τῶν σωμάτων ἀλγηδόνας
  english_pob_choice: the pains of the body
  chosen_korean: 몸의 고통들
  alternatives_korean:
  - 육체의 고통들
  - 몸의 아픔들
  lexicon: LSJ
  rationale: ἀλγηδών은 신체적 고통이나 아픔을 가리키므로, 문맥에 맞게 자연스러운 현대 한국어로 ‘몸의 고통들’이라 옮겼습니다.
- source_word: καθʼ ὑπερβολὴν οὔσας
  english_pob_choice: though they are extreme
  chosen_korean: 아무리 극심할지라도
  alternatives_korean:
  - 지나치게 크더라도
  - 극도로 심하더라도
  lexicon: LSJ
  rationale: 문장의 양보적 힘을 살리면서 고통의 강도를 분명히 드러내기 위해 ‘아무리 극심할지라도’로 옮겼습니다.
- source_word: καταπαλαῖσαι
  english_pob_choice: to wrestle down
  chosen_korean: 제압하고
  alternatives_korean:
  - 씨름하여 꺾고
  - 굴복시키고
  lexicon: LSJ
  rationale: 원문의 씨름/격투 이미지를 완전히 평준화하지 않으면서도 한국어에서 읽기 자연스럽게 ‘제압하다’로 옮겼습니다.
- source_word: καλοκἀγαθίας τοῦ λογισμοῦ
  english_pob_choice: the nobility and goodness of reason
  chosen_korean: 이성의 고귀함과 선함
  alternatives_korean:
  - 이성의 고상함과 선함
  - 이성의 고귀하고 선한 성품
  lexicon: LSJ
  rationale: καλοκἀγαθία의 압축된 이상을 ‘고귀함과 선함’으로 풀어, 하나의 추상어로 뭉개지지 않게 했습니다. λογισμός는 이 작품의 핵심 개념이므로 ‘이성’으로 일관성 있게 옮겼습니다.
- source_word: ἀποπτύσαι
  english_pob_choice: to spurn / to spit away
  chosen_korean: 뱉어 버리라는 것입니다
  alternatives_korean:
  - 경멸하며 뱉어 버리라는 것입니다
  - 뱉어 내버리라는 것입니다
  lexicon: LSJ
  rationale: 동사는 문자적으로 ‘뱉어 내다/뱉어 버리다’의 강한 비유이므로, 혐오와 거절의 뉘앙스를 살려 직접적으로 옮겼습니다.
- source_word: πάσας τὰς τῶν παθῶν ἐπικρατείας
  english_pob_choice: all the dominion of the passions
  chosen_korean: 모든 정욕의 지배
  alternatives_korean:
  - 정욕의 모든 지배력
  - 모든 감정의 권세
  lexicon: LSJ
  rationale: ἐπικρατεία는 지배력·통치를 뜻하므로 ‘지배’로 옮겼고, παθή는 여기서 수동적 감정보다 사람을 끌고 가는 정욕적 충동의 의미가 강해 ‘정욕’으로 옮겼습니다.
