translation:
  language: ko
  text: 그리고 몸의 고통들이 아무리 극심하더라도 맞서 싸워 이기고, 이성의 고귀함과 선함으로 정욕이 행사하는 모든 지배력을 경멸하여 물리치는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘정욕이 행사하는 모든 지배력을 뱉어 내는 것입니다.’ 그리스어 동사는 문자적으로 ‘뱉어 내다’를 뜻하며, 여기서는 경멸하여 배척한다는 비유적 의미로 쓰였습니다.
    reason: lexical_alternative
