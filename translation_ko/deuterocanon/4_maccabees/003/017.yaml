    text: 또는 “마음” 또는 “이해”. 여기서 νοῦς는 이성적 능력이나 이해를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 “욕망”으로 옮긴 그리스어 οἴστρων은 성적 욕망만이 아니라, 더 넓게는 격렬한 충동이나 찌르는 듯한 욕구를 가리킬 수 있습니다.
