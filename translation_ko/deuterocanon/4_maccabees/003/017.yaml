  text: For the self-controlled mind is able to conquer the compulsions of the passions[b][a], and to extinguish the burnings of desires.
  footnotes:
  - marker: a
    text: 'Or ''reason'': the Greek νοῦς can denote the rational faculty or understanding.'
    reason: lexical_alternative
  - marker: b
    text: The Greek term rendered 'lusts' can also suggest frenzied impulses or stinging desires more broadly, not only sexual lust.
    reason: lexical_alternative
translation:
  language: ko
  text: 절제된 마음은 정념의 강요를 이겨 낼 수 있으며, 욕망의 불붙음을 끌 수 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이성”. 여기서 νοῦς는 이성적 능력이나 이해를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘정념’에 해당하는 그리스어는 성적 욕망만이 아니라 더 넓은 격렬한 충동이나 찌르는 듯한 욕구까지 포함할 수 있습니다.
    reason: lexical_alternative
