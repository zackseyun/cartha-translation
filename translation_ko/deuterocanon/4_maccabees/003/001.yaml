  rationale: λογισμός는 여기서 추상적 ‘이성’ 자체보다 비판받는 판단/논증을 가리키므로, 문맥에 맞게 ‘판단’으로 옮기되 γελοῖος의 강한 조롱 뉘앙스를 살렸습니다.
- source_word: τῶν ἑαυτοῦ παθῶν
  english_pob_choice: its own passions
