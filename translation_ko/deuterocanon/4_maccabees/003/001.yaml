translation:
  language: ko
  text: 그러나 이 판단은 지극히 우스꽝스럽습니다[a]. 왜냐하면 이성은 분명 자기 자신의 열정[b]에는 지배력을 행사하지 못하고, 오직 육체적인 것들에 대해서만 그러하기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘논거’. 그리스어 λογισμός는 추론 과정, 이성의 능력, 또는 제시되는 주장을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 몸의 열정이나 욕구를 뜻합니다. 그리스어는 ‘육체적인 것들’을 명사처럼 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστι δὲ κομιδῇ γελοῖος ὁ λογισμός
  english_pob_choice: But this line of reasoning is utterly ridiculous
  chosen_korean: 그러나 이 판단은 지극히 우스꽝스럽습니다
  alternatives_korean:
  - 이 논리는 완전히 우습습니다
  - 이 주장은 아주 어처구니없습니다
  - 이 논거는 지극히 가소롭습니다
  lexicon: LSJ
  rationale: λογισμός는 여기서 추상적 ‘이성’ 자체보다 비판받는 판단/논증을 가리키므로, 문맥에 맞게 ‘판단’으로 옮기되 γελοῖος의 강한 조롱 뉘앙스를 살렸습니다.
- source_word: τῶν ἑαυτοῦ παθῶν
  english_pob_choice: its own passions
  chosen_korean: 자기 자신의 열정
  alternatives_korean:
  - 자기 자신의 정념
  - 자기 자신의 욕구
  - 자기 자신의 감정
  lexicon: LSJ
  rationale: πάθη는 4마카베오스에서 단순한 감정보다 욕구·정념의 뜻이 강하므로, 한국어에서는 자연스럽고도 강한 ‘열정’으로 옮겼습니다.
- source_word: ἐπικρατεῖν
  english_pob_choice: to prevail over
  chosen_korean: 지배력을 행사하지 못하고
  alternatives_korean:
  - 이기지 못하고
  - 제압하지 못하고
  - 주도하지 못하고
  lexicon: LSJ
  rationale: ἐπικρατεῖν의 ‘우세를 점하다/제압하다’는 뜻을 살리면서, 현대 한국어에서 대상 위에 힘을 미치지 못한다는 의미가 분명하게 드러나도록 했습니다.
- source_word: τῶν σωματικῶν
  english_pob_choice: bodily ones
  chosen_korean: 육체적인 것들
  alternatives_korean:
  - 몸에 속한 것들
  - 육체의 것들
  - 육체적 정념
  lexicon: LSJ
  rationale: 형용사 σωματικῶν이 명사적으로 쓰였으므로, 단순히 ‘육체적’이라고만 하지 않고 문맥상 대비되는 대상을 살려 ‘육체적인 것들’로 처리했습니다.
theological_decisions:
- issue: 이성 vs. 열정의 철학적 대비를 한국어에서 어떻게 드러낼지
  chosen_reading: λογισμός는 비판받는 ‘판단’으로, 뒤의 ὁ λογισμός는 ‘이성’의 작용으로 구분해 번역했습니다.
  alternative_readings:
  - 두 곳 모두 ‘이성’으로 통일
  - 두 곳 모두 ‘논리’로 통일
  rationale: 본문은 ‘이성 그 자체’에 대한 진술과 그 이성의 실제 지배 범위를 대비하므로, 한국어에서도 같은 단어를 무리하게 반복하기보다 기능 차이를 드러내는 편이 원문의 수사와 논점을 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
