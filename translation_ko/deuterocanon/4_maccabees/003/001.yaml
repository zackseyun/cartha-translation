translation:
  language: ko
  text: 그러나 이 논증은 참으로 터무니없습니다[a]. 이성은 자신의 정념을 지배하는 것이 아니라, 육체에 속한 정념을 지배하는 것으로 보이기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘논거’ 또는 ‘추론’. 그리스어 λογισμός는 추론 과정, 이성의 능력, 또는 제시되는 주장을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘육체적인’이라는 형용사를 명사처럼 사용합니다. 문맥상 육체에 속한 정념이나 욕구를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστι δὲ κομιδῇ γελοῖος ὁ λογισμός
  english_pob_choice: But this line of reasoning is utterly ridiculous
  chosen_korean: 그러나 이 판단은 지극히 우스꽝스럽습니다
  alternatives_korean:
  - 이 논리는 완전히 우습습니다
