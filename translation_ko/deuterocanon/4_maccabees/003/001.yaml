- source_word: τῶν σωματικῶν
  english_pob_choice: bodily ones
  chosen_korean: 육체적인 것들
  alternatives_korean:
  - 몸에 속한 것들
  - 육체의 것들
  - 육체적 정념
  lexicon: LSJ
  rationale: 형용사 σωματικῶν이 명사적으로 쓰였으므로, 단순히 ‘육체적’이라고만 하지 않고 문맥상 대비되는 대상을 살려 ‘육체적인 것들’로 처리했습니다.
theological_decisions:
- issue: 이성 vs. 열정의 철학적 대비를 한국어에서 어떻게 드러낼지
  chosen_reading: λογισμός는 비판받는 ‘판단’으로, 뒤의 ὁ λογισμός는 ‘이성’의 작용으로 구분해 번역했습니다.
  alternative_readings:
  - 두 곳 모두 ‘이성’으로 통일
  - 두 곳 모두 ‘논리’로 통일
  rationale: 본문은 ‘이성 그 자체’에 대한 진술과 그 이성의 실제 지배 범위를 대비하므로, 한국어에서도 같은 단어를 무리하게 반복하기보다 기능 차이를 드러내는 편이 원문의 수사와 논점을 더 잘 보존합니다.
