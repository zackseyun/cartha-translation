  - 자기 자신의 감정
  lexicon: LSJ
  rationale: πάθη는 4마카베오스에서 단순한 감정보다 욕구·정념의 뜻이 강하므로, 한국어에서는 자연스럽고도 강한 ‘열정’으로 옮겼습니다.
- source_word: ἐπικρατεῖν
  english_pob_choice: to prevail over
  chosen_korean: 지배력을 행사하지 못하고
  alternatives_korean:
