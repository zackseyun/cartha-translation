  text: Then[a], when evening had come, sweating and very exhausted, he came to the royal tent[b], around which the whole army of his forefathers had encamped.
  footnotes:
  - marker: a
    text: Or 'to the king's tent.' The Greek adjective means 'royal' and may refer specifically to the ruler's tent in the camp.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'the whole army of his ancestors' is compressed in Greek and may also be understood as 'all the army of his forefathers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때, 저녁이 되자 땀을 흘리고 몹시 지친 채, 그는 왕의 장막[b]으로 갔습니다. 그 장막은 조상들의 온 군대가 둘러 진쳤던 곳입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 ‘왕의 장막’으로도 옮길 수 있습니다. 그리스어 형용사는 ‘왕실의/왕의’라는 뜻이며, 진영 안의 통치자 장막을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε δὴ γενομένης ἑσπέρας
  english_pob_choice: Then, when evening had come
  chosen_korean: 그때, 저녁이 되자
  alternatives_korean:
  - 저녁이 되었을 때
  - 이윽고 저녁이 되자
  lexicon: LSJ
  rationale: 시간적 배경을 나타내는 속격 독립구문을 자연스러운 현대 한국어로 옮기되, ‘되자’로 저녁의 도래와 뒤이은 행동의 순서를 드러냈습니다.
- source_word: ἱδρῶν καὶ σφόδρα κεκμηκώς
  english_pob_choice: sweating and very exhausted
  chosen_korean: 땀을 흘리고 몹시 지친 채
  alternatives_korean:
  - 땀 범벅이 되고 몹시 지친 채
  - 땀을 흘리며 매우 지친 채
  lexicon: LSJ
  rationale: 분사들이 그의 상태를 묘사하므로, 진행과 상태를 함께 살리는 ‘-고 … -한 채’ 구문으로 옮겼습니다.
- source_word: ἐπὶ τὴν βασίλειον σκηνήν
  english_pob_choice: to the royal tent
  chosen_korean: 왕의 장막
  alternatives_korean:
  - 왕실의 장막
  - 왕의 천막
  lexicon: LSJ
  rationale: βασίλειον은 직역하면 ‘왕의/왕실의’이지만, 전쟁 진영의 σκηνή는 한국어에서 ‘장막’이 더 자연스럽고 문맥에도 맞습니다. 영어 POB의 대안처럼 ‘king’s tent’ 가능성을 살려 소유격으로 옮겼습니다.
- source_word: ὁ πᾶς τῶν προγόνων στρατός
  english_pob_choice: the whole army of his ancestors
  chosen_korean: 조상들의 온 군대
  alternatives_korean:
  - 조상들의 모든 군대
  - 선조들의 온 군대
  lexicon: LSJ
  rationale: ‘ὁ πᾶς … στρατός’의 압축된 표현을 풀어 ‘온 군대’로 옮기고, προγόνων은 혈연·계승의 뉘앙스를 살려 ‘조상들’로 번역했습니다.
theological_decisions:
- issue: βασίλειον의 의미 범위
  chosen_reading: ‘왕의 장막’으로 옮겨, 진영 한가운데 있는 통치자의 천막이라는 군사적·왕권적 뉘앙스를 드러냈습니다.
  alternative_readings:
  - ‘왕실의 장막’으로 더 제도적·궁정적인 느낌을 살리는 읽기
  - ‘왕의 천막’으로 더 직역하는 읽기
  rationale: 문맥상 궁전이 아니라 야영지의 장막이므로, ‘장막/천막’ 의미를 유지하면서도 βασίλειος의 왕권성을 보존하는 표현을 택했습니다.
  doctrine_reference: 4 Maccabees 3:8 문맥 및 βασίλειος-σκηνή 결합의 서술적 의미
