  text: Then[a], when evening had come, sweating and very exhausted, he came to the royal tent[b], around which the whole army of his forefathers had encamped.
  footnotes:
  - marker: a
    text: Or 'to the king's tent.' The Greek adjective means 'royal' and may refer specifically to the ruler's tent in the camp.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'the whole army of his ancestors' is compressed in Greek and may also be understood as 'all the army of his forefathers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 저녁이 되자, 그는 땀을 흘리고 몹시 지친 채 왕의 장막[b]으로 갔습니다. 그 둘레에는 조상들의 온 군대가 진을 치고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 ‘왕실의 장막’으로 옮길 수 있습니다. 그리스어 형용사는 ‘왕의/왕실의’라는 뜻이며, 진영 안의 통치자 장막을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε δὴ γενομένης ἑσπέρας
  english_pob_choice: Then, when evening had come
  chosen_korean: 그때, 저녁이 되자
  alternatives_korean:
  - 저녁이 되었을 때
  - 이윽고 저녁이 되자
  lexicon: LSJ
  rationale: 시간적 배경을 나타내는 속격 독립구문을 자연스러운 현대 한국어로 옮기되, ‘되자’로 저녁의 도래와 뒤이은 행동의 순서를 드러냈습니다.
- source_word: ἱδρῶν καὶ σφόδρα κεκμηκώς
  english_pob_choice: sweating and very exhausted
  chosen_korean: 땀을 흘리고 몹시 지친 채
  alternatives_korean:
