  rationale: πανοπλία는 ‘전신 무장/완전한 갑옷’을 가리키므로, ‘온 갑옷’으로 군사적 완전성을 간결하게 살렸습니다.
- source_word: κάλπιν
  english_pob_choice: a water jar
  chosen_korean: 물항아리 하나
