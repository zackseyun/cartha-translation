  text: Therefore, while the defenders were indignant at the king’s desire, two young soldiers, steadfast men, ashamed by the king’s desire, armed themselves with full armor, and, taking a water jar, went over the enemy stockades.
  footnotes:
  - marker: a
    text: Or 'two young men, soldiers of endurance' or 'two young, steadfast soldiers'; the Greek groups νεανίσκοι and στρατιῶται καρτεροί closely, allowing slightly different English structuring.
    reason: lexical_alternative
  - marker: b
    text: The Greek κάλπιν denotes a jar or pitcher, likely for water.
    reason: cultural_note
  - marker: c
    text: The source text is syntactically compressed in this clause sequence; 'ashamed by the king’s desire' reflects the Greek closely, though the precise nuance may also be 'moved by shame at the king’s desire.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 수비병들이 왕의 욕망에 격분하고 있을 때, 두 젊은 군사, 곧 굳센 사람들이 왕의 욕망을 부끄러워하여 온 갑옷을 갖추고, 물항아리 하나를 가지고 적의 목책을 넘어갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅθεν
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그리하여
  - 따라서
  - 이로써
  lexicon: LSJ
  rationale: 앞 문맥에서 이어지는 결론·전개를 자연스러운 한국어 연결어로 옮겼습니다.
- source_word: ὑπερασπιστῶν
  english_pob_choice: defenders
  chosen_korean: 수비병들
  alternatives_korean:
  - 방어자들
  - 수호자들
  - 호위병들
  lexicon: LSJ
  rationale: 군사적 문맥에서 ‘방어하는 사람들’이라는 뜻을 살리되, 병력이 동원된 상황을 드러내는 표현으로 옮겼습니다.
- source_word: δύο νεανίσκοι στρατιῶται καρτεροί
  english_pob_choice: two young soldiers, steadfast men
  chosen_korean: 두 젊은 군사, 곧 굳센 사람들
  alternatives_korean:
  - 두 젊은 군인, 곧 인내하는 사람들
  - 두 젊은 병사, 곧 굳센 병사들
  - 두 젊은 군사, 곧 강인한 사람들
  lexicon: LSJ
  rationale: νεανίσκοι와 στρατιῶται καρτεροί가 밀착된 병렬 구조이므로, ‘젊은’과 ‘굳센’이라는 두 정보를 함께 살리면서 한국어의 자연스러움을 유지했습니다.
- source_word: καταιδεσθέντες τὴν τοῦ βασιλέως ἐπιθυμίαν
  english_pob_choice: ashamed by the king’s desire
  chosen_korean: 왕의 욕망을 부끄러워하여
  alternatives_korean:
  - 왕의 욕망으로 부끄러움을 느껴
  - 왕의 욕망에 수치를 느껴
  - 왕의 욕망을 수치스러워하여
  lexicon: LSJ
  rationale: καταιδεσθέντες는 수치·부끄러움의 반응을 뜻하므로, 영어 POB의 의미를 따라 ‘부끄러워하여’로 간결하게 옮겼습니다.
- source_word: τὰς πανοπλίας καθωπλίσαντο
  english_pob_choice: armed themselves with full armor
  chosen_korean: 온 갑옷을 갖추고
  alternatives_korean:
  - 완전무장을 하고
  - 전신 갑옷을 입고
  - 온갖 무장을 갖추고
  lexicon: LSJ
  rationale: πανοπλία는 ‘전신 무장/완전한 갑옷’을 가리키므로, ‘온 갑옷’으로 군사적 완전성을 간결하게 살렸습니다.
- source_word: κάλπιν
  english_pob_choice: a water jar
  chosen_korean: 물항아리 하나
  alternatives_korean:
  - 물동이 하나
  - 물주전자 하나
  - 항아리 하나
  lexicon: LSJ
  rationale: κάλπις는 물을 담는 항아리/주전자를 가리킬 가능성이 높아, 문맥상 가장 구체적인 ‘물항아리’로 옮겼습니다.
- source_word: χάρακας
  english_pob_choice: stockades
  chosen_korean: 적의 목책
  alternatives_korean:
  - 적의 울타리 방책
  - 적의 말뚝 방어선
  - 적의 팔리세이드
  lexicon: LSJ
  rationale: χάραξ의 복수형은 말뚝으로 만든 군사 방벽을 뜻하므로, 한국어 군사어로 통하는 ‘목책’을 사용했습니다.
theological_decisions:
- issue: 이 구절의 수치/부끄러움 표현(καταιδεσθέντες)
  chosen_reading: 행동의 동기가 단순한 감정이 아니라 왕의 욕망을 수치스럽게 여기는 도덕적 반응임을 드러내는 ‘부끄러워하여’로 옮겼습니다.
  alternative_readings:
  - ‘수치스러워하여’
  - ‘부끄러움을 느껴’
  - ‘수치를 당하여’
  rationale: 문맥상 이들은 왕의 욕망에 대해 도덕적 수치 반응을 보이며 무장하고 나아가므로, 감정과 평가가 함께 드러나야 합니다.
  doctrine_reference: 헬라어 감정동사 번역 원칙; 본문 문맥의 도덕적 평가 유지
- issue: ‘수비병들’과 ‘군사들’의 구분
  chosen_reading: ὑπερασπιστῶν은 전반적 수비 집단으로, στρατιῶται는 개별 전투 병사로 구분해 번역했습니다.
  alternative_readings:
  - 둘 다 ‘병사들’로 통일
  - 둘 다 ‘군인들’로 통일
  rationale: 원문은 일반 수비자 집단과 특정 젊은 병사 둘을 구분하므로, 같은 한국어를 반복하기보다 역할 차이를 유지했습니다.
  doctrine_reference: 본문의 서술 구조 보존 원칙
