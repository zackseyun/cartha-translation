base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/003/012.yaml
  text: Therefore, while the defenders were indignant at the king’s desire, two young soldiers, steadfast men, ashamed by the king’s desire, armed themselves with full armor, and, taking a water jar, went over the enemy stockades.
  footnotes:
  - marker: a
    text: Or 'two young men, soldiers of endurance' or 'two young, steadfast soldiers'; the Greek groups νεανίσκοι and στρατιῶται καρτεροί closely, allowing slightly different English structuring.
    reason: lexical_alternative
  - marker: b
    text: The Greek κάλπιν denotes a jar or pitcher, likely for water.
    reason: cultural_note
  - marker: c
    text: The source text is syntactically compressed in this clause sequence; 'ashamed by the king’s desire' reflects the Greek closely, though the precise nuance may also be 'moved by shame at the king’s desire.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 수비병들이 왕의 바람에 격분하고 있을 때, 두 젊고 굳센 병사는 왕의 바람에 부끄러움을 느껴[a] 완전무장을 하고, 물항아리 하나를 들고[b] 적의 목책을 넘어갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 καταιδεσθέντες는 ‘부끄러움을 느껴’라는 뜻입니다. 문맥상 ‘왕의 바람을 부끄럽게 여겨’ 또는 ‘왕의 바람 때문에 수치를 느껴’로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어 κάλπις는 항아리 또는 물주전자를 가리키며, 여기서는 물을 담는 그릇일 가능성이 높습니다.
    reason: cultural_note
