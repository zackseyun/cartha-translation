  text: No one can cut anger out of your soul[a], but it is possible to help with anger.
  footnotes:
  - marker: a
    text: Or, more interpretively, 'it is possible to make use of anger' or 'to direct anger to good ends.' The Greek literally says 'to help anger.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아무도 여러분의 영혼에서 분노를 도려낼 수는 없지만, 분노를 돕는 것은 가능합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘분노를 돕는 것이 가능하다’입니다. 더 해석적으로는 ‘분노를 유익하게 사용하다’ 또는 ‘분노를 선한 데로 돌리다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: θυμόν
  english_pob_choice: anger
  chosen_korean: 분노
  alternatives_korean:
  - 노여움
  - 격노
  - 성급한 격정
  lexicon: LSJ
  rationale: θύμος는 분노, 격정, 격한 감정을 가리킬 수 있지만, 이 윤리적 문맥에서는 가장 직접적이고 넓게 통하는 ‘분노’가 적절합니다.
- source_word: ἐκκόψαι
  english_pob_choice: cut ... out
  chosen_korean: 도려낼 수는 없지만
  alternatives_korean:
  - 잘라낼 수는 없지만
  - 제거할 수는 없지만
  - 뿌리 뽑을 수는 없지만
  lexicon: LSJ
  rationale: 동사는 문자적으로 ‘잘라 밖으로 내다’는 뜻이므로, 영혼에서 무언가를 절제·절단하는 강한 이미지를 살리기 위해 ‘도려내다’를 택했습니다.
- source_word: ψυχῆς
  english_pob_choice: soul
  chosen_korean: 영혼
  alternatives_korean:
  - 생명
  - 자아
  - 속사람
  lexicon: LSJ
  rationale: 여기서 ψυχή는 내면의 인격과 정서가 자리한 ‘영혼’을 뜻하므로, 윤리적·심리적 문맥을 살려 직역에 가깝게 옮겼습니다.
- source_word: τῷ θυμῷ δυνατὸν βοηθῆσαι
  english_pob_choice: it is possible to help with anger
  chosen_korean: 분노를 돕는 것은 가능합니다
  alternatives_korean:
  - 분노를 도울 수는 있습니다
  - 분노를 유익하게 사용할 수 있습니다
  - 분노를 선한 데로 돌릴 수 있습니다
  lexicon: LSJ
  rationale: 보조 동사 βοηθέω의 기본 뜻인 ‘돕다, 도와주다’를 유지하되, 그 목적어를 분명히 드러내어 한국어에서 자연스럽게 읽히도록 했습니다.
theological_decisions:
- issue: τῷ θυμῷ δυνατὸν βοηθῆσαι의 해석 범위
  chosen_reading: 직역에 가까운 ‘분노를 돕다’의 긴장을 유지하고, 그 의미를 ‘분노를 유익하게 사용하다’로 미리 풀어 쓰지 않았습니다.
  alternative_readings:
  - 분노를 조절할 수 있다
  - 분노를 선한 목적에 사용할 수 있다
  - 분노를 다스리는 데 도움이 될 수 있다
  rationale: 본문은 분노를 단순히 제거할 수 없지만 어떤 방식으로는 ‘돕는’ 것이 가능하다고 말해, 의도적인 수사적 긴장을 남깁니다. 이 긴장을 해소해 버리면 원문의 표현력을 약화시킵니다.
  doctrine_reference: 본문의 수사적 긴장을 보존
