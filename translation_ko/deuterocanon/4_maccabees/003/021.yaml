  source_fidelity: 본문의 핵심 의미는 대체로 충실합니다. νεωτερίσαντες를 ‘반란을 일으켜’로 옮긴 것은 공동체의 ὁμόνοια에 대항하는 정치·사회적 교란의 뉘앙스를 적절히 반영하며, συμφοραῖς를 ‘재난’으로 옮긴 것도 가능합니다. 다만 τότε δὴ에는 단순한 접속적 ‘그러고는’보다 시간적 전환을 드러내는 ‘그때 참으로’가 더 직접적입니다.
  naturalness: ‘공동의 조화’는 이해되지만 현대 표준 한국어에서는 공동체적 concord를 나타내는 ‘공동의 화합’이 더 자연스럽습니다. τινες는 실제 수가 ‘몇 사람’이라는 인상을 줄 수 있으므로 불특정 복수를 보존하는 ‘어떤 이들이’가 더 적절합니다.
  terminology: ‘반란을 일으켜’와 ‘재난을 이용했습니다’는 본문에 맞습니다. 각주 표지는 해당 어휘인 νεωτερίσαντες 및 ἐχρήσαντο συμφοραῖς에 붙어야 하는데, 현 초안에서는 각각 ‘몇 사람’ 및 ‘공동의 조화’에 잘못 연결되어 있습니다.
