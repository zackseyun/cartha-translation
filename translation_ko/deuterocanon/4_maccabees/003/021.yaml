base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/003/021.yaml
  text: Then indeed some[a], having stirred up revolt against the common harmony[b], made use of calamities in many ways.
  footnotes:
  - marker: a
    text: Or 'having stirred up revolution against the common concord.' The participle νεωτερίσαντες can carry a stronger political sense than 'rebelled.'
    reason: lexical_alternative
  - marker: b
    text: Or 'exploited misfortunes in many ways.' The Greek literally says 'made use of disasters.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러고는 참으로 몇 사람[a]이 공동의 조화[b]에 맞서 반란을 일으켜, 여러 가지로 재난을 이용했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '공동의 조화에 맞서 혁명을 일으켜'로 옮길 수 있습니다. νεωτερίσαντες는 단순한 '반란'보다 더 강한 정치적 의미를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '여러 방식으로 불행을 이용했습니다.' 그리스어는 문자적으로 '재난들을 사용했다'는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε δὴ
  english_pob_choice: Then indeed
  chosen_korean: 그러고는 참으로
  alternatives_korean:
  - 그때 참으로
  - 그리하여 참으로
  lexicon: LSJ
  rationale: 시간 전환과 강조를 함께 담기 위해 '그러고는 참으로'로 옮겼습니다. 자연스러운 문장 흐름을 유지하면서 δὴ의 강조도 살렸습니다.
- source_word: τινες
  english_pob_choice: some
  chosen_korean: 몇 사람
  alternatives_korean:
  - 어떤 이들
  - 몇몇 사람들
  lexicon: LSJ
  rationale: 불특정 다수를 가리키는 표현이므로 간결한 '몇 사람'이 한국어로 자연스럽고, 지시의 모호성도 유지합니다.
- source_word: τὴν κοινὴν ... ὁμόνοιαν
  english_pob_choice: the common harmony
  chosen_korean: 공동의 조화
  alternatives_korean:
  - 공동의 화합
  - 공통의 일치
  - 공동의 화목
  lexicon: LSJ
  rationale: ὁμόνοια는 단순한 일치보다 공동체적 조화·합의를 가리키므로, 교회적 용어로 굳히지 않고 '공동의 조화'로 옮겼습니다.
- source_word: νεωτερίσαντες
  english_pob_choice: having stirred up revolt
  chosen_korean: 반란을 일으켜
  alternatives_korean:
  - 반역하여
  - 혁명을 일으켜
  - 소요를 일으켜
  lexicon: LSJ
  rationale: 이 분사는 단순한 새로움이 아니라 공동체 질서를 거스르는 정치적·사회적 반란의 뉘앙스를 가지므로, 그 강도를 드러내는 '반란을 일으켜'를 택했습니다.
- source_word: πολυτρόπως
  english_pob_choice: in many ways
  chosen_korean: 여러 가지로
  alternatives_korean:
  - 다양한 방식으로
  - 온갖 방식으로
  lexicon: LSJ
  rationale: 방법의 다양성을 가리키므로 한국어 관용 표현인 '여러 가지로'가 가장 무리 없이 대응합니다.
- source_word: ἐχρήσαντο συμφοραῖς
  english_pob_choice: made use of disasters
  chosen_korean: 재난을 이용했습니다
  alternatives_korean:
  - 불행을 이용했습니다
  - 재난들을 악용했습니다
  - 재앙을 이용했습니다
  lexicon: LSJ
  rationale: χράομαι의 기본 의미인 '이용하다/사용하다'를 살리되, συμφοραί의 부정적 의미를 반영해 '재난'으로 옮겼습니다. '악용하다'는 해석을 과도하게 덧붙일 수 있어 피했습니다.
theological_decisions:
- issue: νεωτερίσαντες의 정치·사회적 강도
  chosen_reading: 단순한 새로움이 아니라 공동체 질서를 뒤흔드는 반란의 의미로 읽었습니다.
  alternative_readings:
  - 단순히 '새로운 시도를 했다'는 중립적 읽기
  - '''소요를 일으켰다''는 완화된 읽기'
  rationale: 문맥상 κοινὴ ὁμόνοια와 대조되므로, 이 분사는 질서 파괴와 집단적 저항을 가리키는 강한 표현으로 처리하는 것이 source-driven입니다.
  doctrine_reference: 공동체 윤리와 질서에 관한 본문 이해
