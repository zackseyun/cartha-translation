base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/003/020.yaml
  text: For since our fathers had deep peace because of their law-abidingness[a], and prospered, so that even Seleucus Nicanor, the king of Asia, set apart money for them for the sacred service and approved their polity[b],
  footnotes:
  - marker: a
    text: Or 'because of good order' or 'because of observance of the law.' The Greek term can denote orderly life under law and may implicitly include fidelity to the Jewish law.
    reason: lexical_alternative
  - marker: b
    text: Or 'their constitution' or 'their civic order.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리 조상들은 법질서[a] 때문에 깊은 평안을 누렸고 잘되었으므로, 아시아의 왕 셀레우코스 니카노르도 그들을 위해 거룩한 봉사를 위한 돈을 따로 떼어 주고 그들의 정치체[b]를 인정하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘좋은 질서’, ‘율법 준수’. 헬라어 εὐνομία는 법 아래의 질서와 바른 삶을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 공화체제’, ‘그들의 헌정’. 헬라어 πολιτεία는 시민적·정치적 체제를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: βαθεῖαν εἰρήνην
  english_pob_choice: deep peace
  chosen_korean: 깊은 평안
  alternatives_korean:
  - 깊은 평화
  - 큰 평안
  lexicon: LSJ
  rationale: βαθεῖαν의 감각을 살려 평안을 ‘깊은’ 것으로 표현했고, εἰρήνη는 문맥상 평화보다 평안이 자연스럽습니다.
- source_word: διὰ τὴν εὐνομίαν
  english_pob_choice: because of their law-abidingness
  chosen_korean: 법질서
  alternatives_korean:
  - 법을 잘 지킴
  - 좋은 질서
  - 법 준수
  lexicon: LSJ
  rationale: εὐνομία는 단순한 개인적 순종보다 법 아래의 바른 질서를 가리키므로, ‘법질서’로 옮겨 의미의 폭을 유지했습니다.
- source_word: ἔπραττον καλῶς
  english_pob_choice: prospered
  chosen_korean: 잘되었으므로
  alternatives_korean:
  - 형통했으므로
  - 번성했으므로
  - 잘 지냈으므로
  lexicon: LSJ
  rationale: 관용적 의미인 ‘잘되다/형통하다’를 한국어에서 자연스럽게 살려, 앞의 평안과 뒤의 왕의 호의로 이어지는 인과를 반영했습니다.
- source_word: τὴν πολιτίαν αὐτῶν
  english_pob_choice: their polity
  chosen_korean: 그들의 정치체
  alternatives_korean:
  - 그들의 공화체제
  - 그들의 국가 질서
  - 그들의 헌정
  lexicon: LSJ
  rationale: πολιτεία는 단순한 생활방식보다 공적·정치적 체제를 가리키므로, 교회적 용어로 좁히지 않고 ‘정치체’로 옮겼습니다.
theological_decisions:
- issue: εὐνομία의 범위
  chosen_reading: ‘법질서’로 번역해, 유대 율법 준수를 암시할 수 있으나 그보다 넓은 ‘법 아래의 바른 질서’라는 뜻을 유지했습니다.
  alternative_readings:
  - 율법 준수
  - 좋은 질서
  - 법을 잘 지킴
  rationale: 본문은 조상들의 삶을 긍정적으로 평가하지만, 헬라어 자체는 토라 준수로만 한정되지 않으므로 의미의 긴장을 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3, 5
- issue: πολιτία의 정치적 뉘앙스
  chosen_reading: ‘정치체’로 번역해, 공동체의 헌정·공적 질서를 왕이 승인했다는 의미를 드러냈습니다.
  alternative_readings:
  - 공화체제
  - 헌정
  - 시민 질서
  rationale: 문맥은 종교적 승인만이 아니라 통치 질서의 인정에 가깝기 때문에, 전통적 교회어보다 정치적 함의를 살렸습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 2, 4
