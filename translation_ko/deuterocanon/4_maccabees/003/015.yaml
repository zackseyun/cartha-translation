- from: 그는 목이 타오르는 갈증 속에서도, 마시는 것이 피와 동등한 것으로 여겨진다면 그것은 영에게 지극히 두려운 위험이라고 판단했습니다.[a]
  to: 그는 갈증으로 타오르면서도, 그 마실 것이 피와 동등한 것으로 여겨진다면 그것은 영혼에 지극히 끔찍한 위험이 될 것이라고 판단했습니다.[a]
