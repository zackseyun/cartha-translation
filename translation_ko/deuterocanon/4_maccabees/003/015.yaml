  text: And even while burning with thirst[b][a], he reasoned that it would be an utterly dreadful danger to the soul if the drink were regarded as equivalent to blood.
  footnotes:
  - marker: a
    text: Or, 'an utterly dreadful danger to the soul.' The Greek intensifier πάνδεινον strongly heightens 'danger.'
    reason: lexical_alternative
  - marker: b
    text: That is, he judged that taking the drink would amount to treating it as blood.
    reason: cultural_note
translation:
  language: ko
  text: 그는 갈증으로 타오르면서도, 그 마실 것이 피와 동등한 것으로 여겨진다면 그것은 영혼에 지극히 끔찍한 위험이 될 것이라고 판단했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧, 그 마실 것을 피와 동등한 것으로 여긴다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: διαπυρούμενος
  english_pob_choice: burning with thirst
  chosen_korean: 목이 타오르는 갈증 속에서도
  alternatives_korean:
  - 갈증에 불타면서도
  - 심한 갈증에 시달리면서도
  lexicon: LSJ
  rationale: 불타는 듯한 신체적 비유를 살리되 한국어에서는 ‘목이 타오르다’가 자연스럽고 강한 이미지를 전달합니다.
- source_word: ἐλογίσατο
  english_pob_choice: he reasoned
  chosen_korean: 판단했습니다
  alternatives_korean:
  - 이성적으로 생각했습니다
  - 헤아렸습니다
  - 결론지었습니다
  lexicon: LSJ
  rationale: 4 마카베오스의 이 단어는 단순한 감정이 아니라 이성적 숙고를 가리키므로, 문맥에 맞는 합쇼체로 ‘판단했습니다’를 택했습니다.
- source_word: πάνδεινον
  english_pob_choice: utterly dreadful
  chosen_korean: 지극히 두려운
  alternatives_korean:
  - 몹시 끔찍한
  - 극도로 무서운
  - 더없이 무서운
  lexicon: LSJ
  rationale: 강한 강조를 유지하면서도 한국어 문장 안에서 과도하게 부자연스럽지 않게 옮겼습니다.
- source_word: τῇ ψυχῇ
  english_pob_choice: to the soul
  chosen_korean: 영에게
  alternatives_korean:
  - 혼에게
  - 영혼에
  - 생명에게
  lexicon: LSJ
  rationale: 이 문맥의 ψυχή는 단순한 생명보다 도덕적·내적 자아를 가리키므로 ‘영’으로 옮겨 4 마카베오스의 윤리적 긴장을 살렸습니다.
- source_word: ἰσοδύναμον τὸ ποτὸν αἵματι
  english_pob_choice: the drink were regarded as equivalent to blood
  chosen_korean: 마시는 것이 피와 동등한 것으로 여겨진다면
  alternatives_korean:
  - 그 음료가 피와 같은 것으로 여겨진다면
  - 그 마실 것이 피와 같다고 간주된다면
  lexicon: LSJ
  rationale: 핵심은 ‘마시는 것’을 피로 간주하는 행위이며, 이를 직설적으로 풀어 주되 본문의 압축된 비교를 유지했습니다.
theological_decisions:
- issue: ψυχή의 의미 범위
  chosen_reading: 영
  alternative_readings:
  - 생명
  - 혼
  rationale: 이 구절은 육체적 생존만이 아니라 내적·도덕적 손상을 염두에 둔 판단이므로, ‘영’이 본문의 신학적 긴장을 가장 잘 보존합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
- issue: ‘피와 동등한’ 비교문의 해석
  chosen_reading: 음료를 피와 동등한 것으로 여기는 행위
  alternative_readings:
  - 마시는 것이 피 자체가 되는 것
  - 피와 같은 것으로 간주되는 것
  rationale: 본문은 마시는 행위가 혈액 금지와 충돌하는 상황을 가리키므로, 의미를 과잉설명하지 않으면서도 비교의 윤리적 무게를 분명히 했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
