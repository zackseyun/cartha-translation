  text: Therefore[a], this is possible to perceive more clearly through the thirst of David the king.
  footnotes:
  - marker: a
    text: Or, 'Therefore this can be considered more clearly through the thirst of David the king.' The Greek infinitive ἐπιλογίσασθαι can be rendered with a range of reflective senses such as 'consider,' 'infer,' or 'reason out.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 다윗 왕의 목마름을 통해 이 점을 더 분명하게 헤아릴 수 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘...을 더 분명하게 생각해 볼 수 있습니다.’ 그리스어 부정사 ἐπιλογίσασθαι는 ‘생각해 보다, 추론하다, 헤아리다’ 등으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστιν γοῦν
  english_pob_choice: Therefore ... is
  chosen_korean: 그러므로 ... 있습니다
  alternatives_korean:
  - 그러므로 ... 됩니다
  - 이에 ... 있습니다
  lexicon: LSJ
  rationale: γοῦν의 추론적 연결을 한국어 담화 표지 ‘그러므로’로 살렸고, 문장 전체의 판단 진술은 자연스러운 현재형으로 옮겼습니다.
- source_word: διὰ τῆς Δαυεὶδ τοῦ βασιλέως δίψης
  english_pob_choice: through the thirst of David the king
  chosen_korean: 다윗 왕의 목마름을 통해
  alternatives_korean:
  - 다윗 왕의 목마름으로
  - 다윗 왕의 목마름 때문에
  lexicon: LSJ
  rationale: διά + 속격의 수단/매개 의미를 살려 ‘통해’로 옮겼고, Δαυεὶδ τοῦ βασιλέως는 한국어에서 자연스러운 ‘다윗 왕’으로 처리했습니다.
- source_word: δίψης
  english_pob_choice: thirst
  chosen_korean: 목마름
  alternatives_korean:
  - 갈증
  - 목마름
  lexicon: LSJ
  rationale: 단순한 갈증 상태를 가리키므로 과도한 강조 없이 ‘목마름’으로 옮겼습니다.
- source_word: ἐπιλογίσασθαι
  english_pob_choice: to perceive more clearly / to reason out
  chosen_korean: 더 분명하게 헤아릴 수 있습니다
  alternatives_korean:
  - 더 분명하게 생각해 볼 수 있습니다
  - 더 분명하게 추론할 수 있습니다
  lexicon: LSJ
  rationale: 이 동사는 숙고·추론·판단을 아우르는 반성적 의미를 가지므로, 결과를 ‘헤아리다’로 풀어 쓰되 ‘더 분명하게’와 결합해 인식의 선명함을 살렸습니다.
