  yaml_path: translation/deuterocanon/4_maccabees/003/011.yaml
  text: But some irrational desire for the water among the enemies[a], tightening itself upon him, shriveled him, and while loosening him[b], burned him up.
  footnotes:
  - marker: a
    text: Or 'for the water in the enemies’ camp.' The Greek phrase literally refers to the water 'among/with the enemies.'
    reason: lexical_alternative
  - marker: b
    text: 'The imagery is compressed: desire is personified as both tightening and loosening him, then burning him up—depicting the contradictory bodily effects of intense thirst.'
    reason: cultural_note
translation:
  language: ko
  text: 그러나 적들 가운데 있는 물[a]에 대한 어떤 비이성적인 갈망이 그를 옥죄어 바싹 말리고, 그의 기력을 풀어 놓으면서[b] 그를 불태웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 παρὰ τοῖς πολεμίοις는 문자적으로 ‘적들 가운데/적들과 함께 있는’이라는 뜻입니다. 따라서 ‘적들의 진영에 있는 물’ 또는 ‘적들 가운데 있는 물’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 갈망이 동시에 그를 ‘옥죄고’ 그의 기력을 ‘풀어 놓는’ 듯한 표현은, 극심한 갈증이 몸에 미치는 상반되고도 역설적인 효과를 압축하여 그린 것입니다.
    reason: cultural_note
