  lexicon: LSJ
  rationale: 직역의 이미지보다 한국어에서 자연스럽게 신체적 압박과 조임을 드러내는 동사를 택해, 갈망이 가하는 비유적 압력을 보존했습니다.
- source_word: συνέφρυγε
  english_pob_choice: shriveled him
  chosen_korean: 그를 바싹 말려 버렸고
  alternatives_korean:
  - 그를 쪼그라들게 했고
  - 그를 메마르게 했고
  - 그를 수축시켰고
  lexicon: LSJ
  rationale: 갈증 때문에 몸이 마르고 위축되는 이미지를 살리되, 한국어로는 ‘바싹 말리다’가 가장 생생하고 이해하기 쉽습니다.
- source_word: λύουσα
  english_pob_choice: while loosening him
  chosen_korean: 그를 풀어 주면서
  alternatives_korean:
  - 그를 느슨하게 하면서
  - 그를 풀어 놓으면서
  - 그를 약하게 하면서
  lexicon: LSJ
  rationale: 문자적으로는 ‘풀다/느슨하게 하다’이지만, 본문에서는 힘이 풀리고 몸이 해체되는 느낌을 주므로 ‘풀어 주면서’로 옮겼습니다.
- source_word: κατέφλεγεν
  english_pob_choice: burned him up
  chosen_korean: 그를 불태워 버렸습니다
  alternatives_korean:
  - 그를 태워 버렸습니다
  - 그를 불로 삼켜 버렸습니다
  - 그를 완전히 태웠습니다
  lexicon: LSJ
  rationale: 강한 완료적·집약적 뉘앙스를 살리기 위해 단순한 ‘태우다’보다 더 강한 파괴감을 주는 표현을 택했습니다.
theological_decisions:
- issue: 정념의 의인화와 모순적 결합(죄책 묘사 아님)
  chosen_reading: 갈망이 그를 옥죄고, 풀어 주면서 동시에 불태우는 것으로 옮겨 원문의 역설적 신체 이미지를 유지했습니다.
  alternative_readings:
  - 갈망이 그를 압도하여
  - 갈망이 그를 약하게 하여
  rationale: 본문은 도덕적 평가를 직접 말하기보다 욕구의 신체적·수사학적 효과를 겹겹이 묘사하므로, 모순적 동작을 평탄화하지 않는 것이 원문의 힘에 더 가깝습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, items 1 and 5
