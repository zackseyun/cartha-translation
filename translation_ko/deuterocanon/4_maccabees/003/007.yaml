translation:
  language: ko
  text: 그런즉 다윗이 하루 종일 이방인들을 치며, 그 나라의 군사들과 함께 그들 가운데 많은 사람을 죽였습니다.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 ‘블레셋 사람들’로 옮길 수 있습니다. 그리스어는 ‘이방인들’(ἀλλόφυλοι)이라고 되어 있으며, 성경 그리스어에서 종종 블레셋 사람들을 가리키지만, 여기서는 고유 민족명이 직접 쓰이지는 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 나라의 군사들과 함께’가 아니라 ‘자기 백성의 군사들과 함께’로도 옮길 수 있습니다. 그리스어는 문자적으로 ‘그 나라의 군사들과 함께’라고 말합니다.
    reason: lexical_alternative
