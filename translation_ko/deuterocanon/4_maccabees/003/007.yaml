  text: For when David, attacking the foreigners throughout the whole day, killed many of them along with the soldiers of the nation,
  footnotes:
  - marker: a
    text: Or 'the Philistines.' The Greek reads 'the foreigners' (ἀλλόφυλοι), a term often used in biblical Greek for Philistines, but the wording here is not the proper ethnic name itself.
