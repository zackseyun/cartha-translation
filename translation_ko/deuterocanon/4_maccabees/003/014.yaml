translation:
  language: ko
  text: 그리고 그들은 용기 있게 샘을 찾아내어 그 물로 왕의 마실 것을 채웠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνευράμενοι
  english_pob_choice: after finding
  chosen_korean: 찾아내어
  alternatives_korean:
  - 찾은 뒤
  - 발견하여
  lexicon: LSJ
  rationale: 부사적 aorist 분사로서 앞선 동작을 나타내므로, 한국어에서는 결과를 드러내는 연결형 ‘찾아내어’로 순서를 자연스럽게 살렸습니다.
- source_word: θαρραλέως
  english_pob_choice: courageously
  chosen_korean: 용기 있게
  alternatives_korean:
  - 담대하게
  - 대담하게
  lexicon: LSJ
  rationale: 행동의 태도인 ‘담대함/용기’를 그대로 살리되, 현대 한국어에서 자연스러운 부사구로 옮겼습니다.
- source_word: τὴν πηγὴν
  english_pob_choice: the spring
  chosen_korean: 샘
  alternatives_korean:
  - 샘물 근원
  - 샘물
  lexicon: LSJ
  rationale: πηγή는 물이 솟는 샘을 가리키므로, 현대 한국어에서 가장 직관적인 ‘샘’으로 옮겼습니다.
- source_word: τῷ βασιλεῖ τὸ ποτόν
  english_pob_choice: the king’s drink / for the king
  chosen_korean: 왕의 마실 것
  alternatives_korean:
  - 왕을 위한 음료
  - 왕의 음료
  lexicon: LSJ
  rationale: 여격 τῷ βασιλεῖ의 ‘~을 위하여’라는 기능과 ποτόν의 ‘마실 것’을 함께 살려, 소유격처럼 보이는 영어의 의미를 한국어에서 오해 없이 표현했습니다.
