  text: But the king[a], though very thirsty, even though he had abundant springs, was not able through them to relieve his thirst.
  footnotes:
  - marker: a
    text: Or 'to quench his thirst.' The Greek uses a verb meaning 'to heal' or 'to cure,' likely preserving a deliberate medical metaphor.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 왕은 몹시 목이 말랐으며, 풍부한 샘들을 가지고 있었음에도 그것들로 갈증을 고칠 수 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘갈증을 고치다’는 그리스어 동사의 의료적 의미를 살린 번역입니다. 이 동사는 본래 ‘치유하다’ 또는 ‘낫게 하다’를 뜻하며, 여기서는 갈증에 적용된 의도적인 은유로 보입니다.
    reason: lexical_alternative
