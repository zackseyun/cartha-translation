  source_fidelity: 그리스어의 대조적 δέ, 강한 강조를 지닌 ὡς μάλιστα διψῶν, 양보를 나타내는 καίπερ, ‘풍부한 샘들’을 지닌 상태, 그리고 ἰάσασθαι의 의료적 은유를 대체로 충실히 반영했습니다. 다만 현 문장의 ‘-지만 … -음에도’는 양보 표현이 겹쳐 원문의 문장 관계를 한국어에서 다소 부자연스럽게 만듭니다.
  naturalness: ‘샘이 풍부하게 있었음에도’보다는 왕이 샘들을 ‘가지고 있었다’는 원문의 ἔχων을 드러내는 표현이 자연스럽습니다. 또한 ‘몹시 목이 말랐으며’와 ‘-음에도’를 조합하면 두 분사/양보 관계를 매끄럽게 재현할 수 있습니다.
  terminology: ‘갈증을 고치다’는 한국어에서 다소 의도적으로 낯선 표현이지만, ἰάσασθαι(치유하다)의 의학적 은유를 보존하는 안전한 번역입니다. 각주도 이 낯섦과 번역 근거를 명료하게 설명하도록 다듬었습니다.
