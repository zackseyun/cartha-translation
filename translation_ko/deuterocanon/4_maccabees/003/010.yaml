    text: ‘갈증을 고치다’는 뜻을 더 직접적으로 살린 번역입니다. 그리스어 동사는 본래 ‘치유하다/낫게 하다’의 의료적 의미를 가지며, 여기서는 갈증에 대한 의도적 은유로 보입니다.
