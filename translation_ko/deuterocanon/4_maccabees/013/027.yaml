  yaml_path: translation/deuterocanon/4_maccabees/013/027.yaml
  text: But likewise[a], although nature and custom and the dispositions of virtue were drawing together for them the affections of brotherhood, those who were left behind endured, because of piety, as they watched their brothers, being tortured to death, objects of pity[b].
  footnotes:
  - marker: a
    text: Or 'the bonds of brotherhood' for 'the affections of brotherhood.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'those remaining endured because of piety, seeing their brothers being tortured until death and being pitied.' The Greek packs several participles into a compressed sentence.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이와 같이, 본성과 관습과 덕의 성향이 그들에게 형제애의 유대를 이루게 하고 있었음에도, 남아 있던 형제들은 경건함 때문에, 자기 형제들이 가엾게 여김을 받으며 죽음에 이르기까지 고문당하는 것을 보면서도 견뎌 냈습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φύσεως καὶ τῆς συνηθείας καὶ τῶν τῆς ἀρετῆς ἠθῶν
  english_pob_choice: nature and custom and the dispositions/traits of virtue
  chosen_korean: 본성, 관습, 그리고 덕의 성향
