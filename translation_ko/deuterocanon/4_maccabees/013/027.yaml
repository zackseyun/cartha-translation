  lexicon: LSJ
  rationale: φίλτρα는 단순한 ‘사랑’보다 감정적 끌림과 친애의 힘을 담으므로, 문맥상 형제관계를 묶는 내적 끌림을 드러내는 표현을 택했습니다.
- source_word: ἀνέσχοντο
