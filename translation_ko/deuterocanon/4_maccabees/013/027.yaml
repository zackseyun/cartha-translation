  - 신심
  - 효성
  lexicon: LSJ
  rationale: 4마카베오스에서 εὐσέβεια는 하나님과 율법에 대한 신실한 경건을 가리키므로, 교회적 과도어휘보다 문맥상 직접적인 ‘경건함’이 적절합니다.
- source_word: κατοικτιζομένους
  english_pob_choice: objects of pity
  chosen_korean: 죽음에 이르기까지 고문당하는 모습
  alternatives_korean:
  - 불쌍히 여겨지는 모습
  - 측은함을 받는 모습
  - 가엾게 여겨지는 모습
  lexicon: LSJ
  rationale: 이 분사구는 형제들이 처한 상태를 압축적으로 묘사하므로, ‘측은히 여김’의 수동성을 살리면서도 본절의 핵심인 고문과 죽음의 진행을 분명히 했습니다.
