  rationale: 순교 서술의 맥락에서 ἀνέσχοντο는 단순한 참고 견딤보다 고통 아래서의 지속적 인내를 뜻하므로, 현대 한국어의 자연스러운 동사로 옮겼습니다.
- source_word: εὐσέβειαν
