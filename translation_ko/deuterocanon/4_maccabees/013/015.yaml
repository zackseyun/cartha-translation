  text: For great is the struggle of the soul and the danger laid up in eternal torment for those who transgress the commandment of God.
translation:
  language: ko
  text: 이는 영혼의 큰 싸움이며, 하나님의 명령을 어기는 자들에게는 영원한 고통 안에 놓여 있는 위험입니다.
  philosophy: formal
lexical_decisions:
- source_word: ψυχῆς ἀγὼν
  english_pob_choice: the struggle of the soul
  chosen_korean: 영혼의 큰 싸움
  alternatives_korean:
  - 영혼의 투쟁
  - 영혼의 격전
  lexicon: ἀγών
  rationale: ἀγών은 단순한 갈등보다 치열한 պայք움·경쟁을 가리키므로, 현대 한국어에서 자연스러운 ‘싸움’으로 옮기되 μεγας의 강도를 ‘큰’으로 드러냈습니다.
- source_word: κίνδυνος
  english_pob_choice: the danger
  chosen_korean: 위험
  alternatives_korean:
  - 위기
  - 재난
  lexicon: κίνδυνος
  rationale: 문맥상 경고의 대상이 되는 실제적 위험이므로, 과장되지 않으면서 직접적인 ‘위험’으로 번역했습니다.
- source_word: ἐν αἰωνίῳ βασάνῳ κείμενος
  english_pob_choice: laid up in eternal torment
  chosen_korean: 영원한 고통 안에 놓여 있는
  alternatives_korean:
  - 영원한 고문에 놓여 있는
  - 영원한 고통으로 예비된
  lexicon: βάσανος / κεῖμαι
  rationale: βασάνος는 고통·형벌의 상태를 가리키므로 ‘고통’으로 옮기고, κείμενος의 수동적 ‘놓여 있는’ 상태를 유지해 ‘laid up’의 보관/예정 뉘앙스를 살렸습니다.
- source_word: τοῖς παραβαίνουσι τὴν ἐντολὴν τοῦ θεοῦ
  english_pob_choice: for those who transgress the commandment of God
  chosen_korean: 하나님의 명령을 어기는 자들
  alternatives_korean:
  - 하나님의 계명을 어기는 자들
  - 하나님의 명령을 범하는 자들
  lexicon: παραβαίνω / ἐντολή
  rationale: παραβαίνω는 금지선을 넘어 어긴다는 뜻이어서 ‘어기는’이 가장 자연스럽고, ἐντολή는 여기서 율법 조항보다 넓은 ‘명령’으로 읽히므로 이를 반영했습니다.
theological_decisions:
- issue: αἰώνιος βασάνος의 형벌 성격
  chosen_reading: ‘영원한 고통’으로 직역에 가깝게 유지해 최종 심판의 실제적 형벌성을 분명히 했습니다.
  alternative_readings:
  - ‘영원한 고문’
  - ‘영원한 벌’
  rationale: 본문은 단순한 상징적 불편함이 아니라 죄에 대한 무거운 종말론적 결과를 강조하므로, 형벌의 실재성을 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 최종 심판과 형벌의 실재성
- issue: θεοῦ의 호칭
  chosen_reading: 문맥의 일반 호칭으로 ‘하나님’을 사용했습니다.
  alternative_readings:
  - ‘하느님’
  - ‘주님’
  rationale: POB 기본 용례에 따라 θεός는 ‘하나님’으로 통일하고, 본절에서는 YHWH 인용 문제가 아니므로 ‘야훼’로 옮기지 않았습니다.
  doctrine_reference: POB 용어 기준
