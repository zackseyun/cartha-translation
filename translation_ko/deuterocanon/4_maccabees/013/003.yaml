  yaml_path: translation/deuterocanon/4_maccabees/013/003.yaml
  text: But now it is not so; rather[a], by the reasoning that is praised by God, they overcame the passions.
  footnotes:
  - marker: a
    text: Or 'by the reason commended by God.' The Greek term can be rendered 'reason,' 'reasoning,' or 'rational judgment.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그렇지만 이제는 그렇지 않습니다. 오히려 하나님께 칭찬받는 이성적 판단으로 그들은 정념들을 이겨 냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님께서 칭찬하시는 이성적 판단으로.’ 그리스어 λογισμός는 ‘이성’, ‘이성적 판단’, ‘숙고’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  english_pob_choice: But now
  chosen_korean: 그렇지만 이제는
  alternatives_korean:
  - 하지만 지금은
  - 그런데 이제는
  lexicon: LSJ
  rationale: 앞선 상황과의 강한 대조를 자연스러운 현대 한국어로 살리면서, 현재의 전환을 분명히 드러냅니다.
- source_word: τῷ ἐπαινουμένῳ λογισμῷ
  english_pob_choice: the reasoning that is praised by God
  chosen_korean: 하나님께 칭찬받는 이성적 판단
  alternatives_korean:
  - 하나님께 칭찬받는 reasoning
  - 하나님이 칭찬하시는 판단
  - 하나님께 인정받는 이성적 판단
  lexicon: LSJ
  rationale: λόγισμος는 단순한 ‘이성’보다 숙고된 판단·추론의 활동을 가리키므로, 4 마카베오스의 철학적 문맥을 살려 ‘이성적 판단’으로 옮겼습니다.
- source_word: παρὰ θεῷ
  english_pob_choice: by God
  chosen_korean: 하나님께
  alternatives_korean:
  - 하나님 앞에서
  - 하나님 보시기에
  - 하나님으로부터
  lexicon: LSJ
  rationale: ἐπαινουμένῳ와 결합한 구조에서는 칭찬의 기준이 하나님께 있음을 가장 간결하게 드러내므로 ‘하나님께’가 적절합니다.
- source_word: περιεγένοντο τῶν παθῶν
  english_pob_choice: they overcame the passions
  chosen_korean: 그들은 정념들을 이겨 냈습니다
  alternatives_korean:
  - 그들은 열정을 이겨 냈습니다
  - 그들은 감정들을 이겨 냈습니다
  - 그들은 정념들을 극복했습니다
  lexicon: LSJ
  rationale: πάθη는 이 책의 사상적 어휘에서 외적 고난보다 절제해야 할 정념·욕망을 가리키므로, 철학적 뉘앙스를 살려 ‘정념들’로 옮겼습니다.
theological_decisions:
- issue: λόγισμος의 철학적·도덕적 의미
  chosen_reading: 이성적 판단
  alternative_readings:
  - 이성
  - 판단력
  - 합리적 판단
  rationale: 이 책의 핵심 대조는 정념을 다스리는 합리적 숙고와 그에 반하는 충동이므로, ‘이성적 판단’이 본문의 사상 구조를 가장 잘 드러냅니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 5
- issue: παρὰ θεῷ와 ἐπαινουμένῳ의 결합 의미
  chosen_reading: 하나님께 칭찬받는
  alternative_readings:
  - 하나님 보시기에 칭찬받는
  - 하나님이 인정하시는
  - 하나님께서 칭찬하시는
  rationale: 본문은 이성적 판단의 정당성을 하나님께서 평가하고 칭찬하신다는 뜻을 말하므로, 과도한 해석을 더하지 않으면서도 그 승인성을 분명히 하는 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1
