- from: 경건 때문에 이삭은 참았습니다[a]. 그리고 각 사람은 서로를 바라보며—모두 함께 즐거워하고 매우 용감하여—말했습니다[b], 「우리 온 마음으로 하나님께, 곧 우리의 생명을 주신 분께, 우리 자신을 바치고, 우리 몸으로 율법을 지키는 일에 힘쓰자」[c].
  to: 이삭은 경건 때문에 견뎠습니다[a]. 그들은 저마다 서로를 바라보며, 모두 밝은 표정으로 매우 용감하게 말했습니다. “우리의 생명을 주신 하나님께 온 마음을 다해 우리 자신을 바치고, 우리 몸을 율법을 지키는 데 씁시다[c].”[b]
  rationale: 원문의 어순과 의미 관계를 한국어답게 재구성하되, 이삭의 견딤, 형제들 사이의 상호 주시, 밝고 용감한 태도, 온 마음의 자기헌신, 생명을 주신 하나님, 그리고 율법을 지키는 경계의 이미지를 모두 유지했습니다. 각주 앵커도 εὐσέβεια, ψυχάς, φυλακή의 실제 번역 쟁점에 맞게 재배치했습니다.
