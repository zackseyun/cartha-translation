base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/013.yaml
  text: Because of godliness Isaac endured[a]. And each one, while looking at the others, all together cheerful and very courageous, said[c][b], “Let us dedicate ourselves to God with our whole heart—to the one who gave us our lives—and let us use our bodies to keep watch over the law.”
  footnotes:
  - marker: a
    text: Or 'Because of piety Isaac endured.' The Greek εὐσέβεια can be rendered 'godliness' or 'piety.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'to the one who gave [us] the souls/lives.' Greek ψυχή can mean either 'soul' or 'life'; here the sense is likely 'life.'
    reason: lexical_alternative
  - marker: c
    text: Or 'let us use our bodies for guarding the law.' The Greek keeps the imagery of watchful guarding rather than using a simpler term like 'obey.'
    reason: lexical_alternative
translation:
  language: ko
  text: 경건 때문에 이삭은 참았습니다[a]. 그리고 각 사람은 서로를 바라보며—모두 함께 즐거워하고 매우 용감하여—말했습니다[b], 「우리 온 마음으로 하나님께, 곧 우리의 생명을 주신 분께, 우리 자신을 바치고, 우리 몸으로 율법을 지키는 일에 힘쓰자」[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경건함 때문에 이삭은 참았습니다.’ 그리스어 εὐσέβεια는 ‘경건’ 또는 ‘경건함’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘서로를 바라보며’입니다. 그들은 서로를 보며 격려하는 모습을 보입니다.
    reason: source_note
  - marker: c
    text: 직역하면 ‘우리 몸을 율법을 지키는 감시에 사용하자’입니다. 본문은 단순한 ‘순종’보다 경계하며 지키는 이미지를 유지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὴν εὐσέβειαν
  english_pob_choice: Because of godliness
  chosen_korean: 경건 때문에
  alternatives_korean:
  - 경건함 때문에
  - 하나님을 향한 경건 때문에
  lexicon: LSJ
  rationale: εὐσέβεια는 4마카베오스에서 하나님께 대한 경외와 그에 따른 삶을 가리키므로, 한국어에서는 너무 교회화된 표현보다 직접적인 ‘경건’이 의미를 가장 잘 보존합니다.
- source_word: ὑπέμεινεν
  english_pob_choice: endured
  chosen_korean: 참았습니다
  alternatives_korean:
  - 견뎠습니다
  - 인내했습니다
  lexicon: LSJ
  rationale: 이 동사는 시련 아래에서 끝까지 버티는 뜻이므로, 마카베오스 순교 문맥에 자연스럽고 간명한 ‘참았습니다’가 적절합니다.
- source_word: τῷ δόντι τὰς ψυχάς
  english_pob_choice: to the one who gave us our lives
  chosen_korean: 우리의 생명을 주신 분께
  alternatives_korean:
  - 우리의 혼을 주신 분께
  - 우리의 영혼을 주신 분께
  lexicon: LSJ
  rationale: ψυχή는 여기서 신학적 ‘영혼’보다 하나님이 주신 ‘생명’의 뜻이 더 강하므로, 문맥상 한국어도 ‘생명’으로 옮기는 것이 가장 자연스럽습니다.
- source_word: τῇ περὶ τὸν νόμον φυλακῇ
  english_pob_choice: to keep watch over the law
  chosen_korean: 율법을 지키는 일에 힘쓰고
  alternatives_korean:
  - 율법을 지키는 데 경계하고
  - 율법을 지키는 감시에 몸을 쓰고
  lexicon: LSJ
  rationale: φυλακή는 단순한 순종보다 ‘지키기/감시하기’의 이미지를 담고 있어, 그 감각을 살리면서도 한국어로는 자연스럽게 ‘율법을 지키는 일에 힘쓰다’로 풀었습니다.
theological_decisions:
- issue: ψυχάς를 ‘영혼’으로 옮길지 ‘생명’으로 옮길지
  chosen_reading: 생명
  alternative_readings:
  - 영혼
  - 혼
  rationale: 이 구절은 하나님이 주신 것을 순교적 자기헌신으로 되돌려 드린다는 뜻이므로, 본문 문맥이 요구하는 핵심 의미는 ‘생명’입니다. ‘영혼’은 가능한 직역이지만 여기서는 현대 독자에게 불필요한 형이상학적 좁힘을 낳을 수 있습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
