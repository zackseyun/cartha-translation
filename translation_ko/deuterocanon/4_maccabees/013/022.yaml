base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/022.yaml
  text: The souls of brothers are affectionate in embraces[c][b][a], and they grow much stronger through living together and through daily familiarity and the rest of their upbringing.
  footnotes:
  - marker: a
    text: Or 'brotherly souls, affectionate in embraces.' The Greek phrase is compressed and allows slightly different ways of relating 'brother-loving' to 'souls.'
    reason: lexical_alternative
  - marker: b
    text: '''Through living together'' may also be understood as ''through companionship'' or ''through being reared together.'''
    reason: lexical_alternative
  - marker: c
    text: '''The rest of their upbringing'' could also be rendered ''their other education'' or ''their remaining training.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 형제들을 사랑하는 영혼들은 포옹 속에서 다정하며, 함께 살고 매일 익숙하게 지내며 그 밖의 양육을 통해 훨씬 더 강해집니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형제들을 사랑하는’은 압축된 그리스어 표현을 한국어로 풀어 옮긴 것입니다. 원문은 ‘형제적인 영혼들’처럼도 읽힙니다.
    reason: lexical_alternative
  - marker: b
    text: ‘함께 살고’는 ‘함께 지내며’ 또는 ‘동거하며’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그 밖의 양육’은 ‘나머지 교육’ 또는 ‘남은 훈련’으로도 옮길 수 있습니다.
    reason: lexical_alternative
