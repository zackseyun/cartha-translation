theological_decisions:
- issue: ψυχαί의 번역을 ‘영혼들’로 할지 ‘삶/사람들’로 할지
  chosen_reading: 영혼의 내적 친밀성과 결속을 드러내는 ‘영혼들’ 계열로 옮기되, 한국어 문장에서는 ‘형제들을 사랑하는 영혼들’로 풀어 썼습니다.
  alternative_readings:
  - 형제들의 삶
  - 형제들
  - 사람들
  rationale: 이 문맥의 ψυχαί는 단순한 ‘사람들’보다 내면적 정서와 관계성을 강조하므로, 높은 어조를 유지하는 ‘영혼들’ 계열이 원문 효과를 더 잘 반영합니다. 다만 한국어 어순상 문장을 매끈하게 하기 위해 소유격적 구성을 채택했습니다.
  doctrine_reference: 'POB translation philosophy: preserve anthropological weight without flattening elevated diction'
