  text: But he kept saying[a], “Remember from whom you come, and by what father's hand you are to be slaughtered.”
  footnotes:
  - marker: a
    text: Or, 'Remember where you are from.' The Greek expression can denote place of origin, but here likely points to family lineage.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그는 계속 말씀하셨습니다. 「여러분은 누구에게서 왔는지, 그리고 어떤 아버지의 손에 의해 도살되어야 하는지 기억하십시오」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘누구에게서 왔는지’는 문자적으로는 ‘어디에서 왔는지’도 가능하지만, 여기서는 가족적·혈통적 기원을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἔλεγεν
  english_pob_choice: But he kept saying
  chosen_korean: 그러나 그는 계속 말씀하셨습니다
  alternatives_korean:
  - 그러나 그는 말하셨습니다
  - 그러나 그는 계속 말했습니다
  lexicon: BDAG
  rationale: 미완료과거 ἔλεγεν의 반복·지속성을 살려 ‘계속’으로 옮기고, δέ의 대조를 ‘그러나’로 반영했습니다.
- source_word: Μνήσθητε
  english_pob_choice: Remember
  chosen_korean: 기억하십시오
  alternatives_korean:
  - 기억하세요
  - 기억하시오
  lexicon: BDAG
  rationale: 청중에게 주는 직접 명령으로서 단호하면서도 현대 문어체에 맞는 합쇼체 imperative를 택했습니다.
- source_word: πόθεν ἐστέ
  english_pob_choice: from whom you come
  chosen_korean: 누구에게서 왔는지
  alternatives_korean:
  - 어디에서 왔는지
  - 어디 출신인지
  lexicon: BDAG
  rationale: 문자적 위치보다 혈통·기원에 초점이 있으므로, English POB의 최종 판단을 따라 관계적 기원을 드러내는 표현을 선택했습니다.
- source_word: τίνος πατρὸς χειρὶ
  english_pob_choice: what father's hand
  chosen_korean: 어떤 아버지의 손에 의해
  alternatives_korean:
  - 누구의 아버지의 손에 의해
  - 어느 아버지의 손에 의해
  lexicon: BDAG
  rationale: τίνος의 수사적 물음을 ‘어떤’으로 살리고, χειρὶ를 한국어의 자연스러운 피동 표현 ‘손에 의해’로 옮겨 폭력의 매개를 보존했습니다.
- source_word: σφαγιασθῆναι
  english_pob_choice: to be slaughtered
  chosen_korean: 도살되어야 하는지
  alternatives_korean:
  - 죽임을 당해야 하는지
  - 학살되어야 하는지
  lexicon: BDAG
  rationale: 본문의 강한 살육 이미지를 약화시키지 않기 위해 ‘도살하다’ 계열을 택했고, 희생 제의적 의미를 덧붙이지 않고 어휘적 강도를 유지했습니다.
theological_decisions:
- issue: πόθεν ἐστέ의 의미 범위
  chosen_reading: 지리적 출처보다 혈통·가문 기원의 상기라는 점을 살려 ‘누구에게서 왔는지’로 옮겼습니다.
  alternative_readings:
  - 어디에서 왔는지
  rationale: 직전 문맥이 순교 상황에서 조상/가문 정체성을 상기시키는 호소이므로, 단순한 장소 정보로 축소하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: σφαγιασθῆναι의 강도
  chosen_reading: 일반적 ‘죽다’보다 강한 살육 이미지를 가진 ‘도살되다’를 사용했습니다.
  alternative_readings:
  - 죽임을 당하다
  - 학살되다
  rationale: 본문의 폭력성과 처형의 잔혹함을 보존하되, 본문에 없는 추가 신학적 함의를 덧붙이지 않기 위해 가장 직접적인 강도 표현을 택했습니다.
  doctrine_reference: Translation philosophy §1, §6
