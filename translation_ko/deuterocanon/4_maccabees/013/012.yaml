  source_fidelity: 핵심 의미는 대체로 충실합니다. ἔλεγεν의 지속성은 ‘계속’으로, πόθεν의 혈통적 해석은 ‘누구에게서 나왔는지’로 적절히 반영했습니다. 다만 σφαγιασθῆναι는 단순히 의무를 뜻하는 표현이 아니므로 ‘도살되어야 하는지’는 한국어에서 불필요하게 당위·강제의 뉘앙스를 낼 수 있습니다. ‘도살당하게 될 것인지’가 예정된 처형이라는 문맥을 더 정확히 드러냅니다.
  naturalness: ‘말씀하셨습니다’는 원문에 없는 높임을 화자에게 부여하며, 화자의 신분이 이 절만으로 확정되지 않는 상황에서 중립적인 서술체에 맞지 않습니다. ‘계속 말했습니다’가 현대 합쇼체 문체로 자연스럽고 안전합니다. 또한 각주 표지는 인용문과 문장부호 뒤에 붙이는 것이 자연스럽습니다.
  terminology: ‘도살당하다’는 σφαγιάζω의 강한 폭력성을 보존합니다. ‘손에 의해’는 χείρ의 도구적·행위 주체적 이미지를 유지합니다. ‘누구에게서 나왔는지’는 문맥상 혈통적 기원을 살리되, 각주에서 장소적 의미 가능성을 남겨 두는 것이 적절합니다.
