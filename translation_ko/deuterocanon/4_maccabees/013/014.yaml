lexical_decisions:
- source_word: μὴ φοβηθῶμεν
  english_pob_choice: Let us not fear
  chosen_korean: 두려워하지 맙시다
  alternatives_korean:
  - 무서워하지 맙시다
  - 겁내지 맙시다
  lexicon: BDAG
  rationale: μή + 1인칭 복수 권고법의 호소력을 살리면서, 현대 표준어에서 가장 자연스러운 금지 권면으로 옮겼습니다.
- source_word: τὸν δοκοῦντα
  english_pob_choice: the one who seems
  chosen_korean: 죽이려 하는 자
  alternatives_korean:
  - 죽일 듯 보이는 자
  - 죽일 수 있는 것처럼 보이는 자
  - 죽인다고 여겨지는 자
  lexicon: BDAG
  rationale: δοκέω의 ‘겉으로 그렇게 보이다/그렇게 여겨지다’라는 뉘앙스를 살리되, 한국어에서는 주어를 사람 중심으로 자연스럽게 구성해 ‘겉보기의 힘’이라는 문맥적 대비가 드러나게 했습니다.
- source_word: ἀποκτενεῖν
  english_pob_choice: to kill
  chosen_korean: 죽이려 하는
  alternatives_korean:
  - 죽이다
  - 죽이려고 하는
  lexicon: BDAG
  rationale: 부정사 ‘죽이다’의 기능을 문맥상 의도/기세를 드러내는 ‘죽이려 하는’으로 풀어, 실제 권세가 아니라 겉보기의 위협이라는 POB의 해석을 반영했습니다.
theological_decisions:
- issue: 박해자의 권세가 실제가 아니라 겉보기라는 대비
  chosen_reading: ‘죽이려 하는 자’를 두려워하지 말라는 권면으로, 살해의 위협은 있으나 최종 권세는 없다는 뜻을 드러냅니다.
  alternative_readings:
  - ‘죽이는 것처럼 보이는 자’
  - ‘죽일 수 있다고 여겨지는 자’
  rationale: 그리스어 δοκοῦντα는 단순한 오해보다 ‘겉보기의 능력’에 초점을 두므로, 본문이 말하는 실제와 외양의 긴장을 한국어에서도 짧고 분명하게 살렸습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
