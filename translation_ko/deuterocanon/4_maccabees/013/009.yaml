    text: 본문은 다니엘 3장의 세 젊은이를 가리키지만, 더 익숙한 ‘바빌론’이 아니라 이 본문에 있는 ‘시리아’라는 표현을 따릅니다.
    reason: cross_reference
  - marker: b
    text: 그리스어 ἰσοπαίδος는 매우 드물고 뜻이 확실하지 않습니다. 여기서는 풀무를 세 젊은이들과 비교하는 표현으로 옮겼지만, 비교의 정확한 뉘앙스는 분명하지 않습니다.
    reason: lexical_alternative
