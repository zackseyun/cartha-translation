  text: 형제들이여, 율법을 위하여 형제답게 죽읍시다. 시리아에 있던 그 세 젊은이들[a]을 본받읍시다. 그들은 그 세 젊은이들과 맞먹는 풀무[b]를 업신여겼습니다.
  philosophy: optimal-equivalence
  footnotes:
