translation:
  language: ko
  text: 마치 항만의 방파제 위에 있는 탑들이 파도의 위협을 막아 내어, 들어오는 이들에게 잔잔한 항구를 마련해 주듯이 말입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθάπερ γὰρ
  english_pob_choice: For just as
  chosen_korean: 마치 …듯이 말입니다
  alternatives_korean:
  - 이는 …와 같기 때문입니다
  - 곧 …와 같습니다
  lexicon: LSJ
  rationale: 비유를 도입하는 비교 표지와 연결 어감을 함께 살리기 위해 한국어에서도 ‘마치 …듯이’로 자연스럽게 옮겼습니다.
- source_word: προβλῆτες λιμένων πύργοι
  english_pob_choice: towers on harbor breakwaters
  chosen_korean: 항만의 방파제 위에 있는 탑들
  alternatives_korean:
  - 항만의 돌출 방벽 위 탑들
  - 항만 방파제의 탑들
  lexicon: LSJ
  rationale: προβλῆτες는 바깥으로 돌출한 구조물을 가리키므로, 현대 한국어의 ‘방파제’로 기능을 풀어 주면서도 πύργοι의 구체적 이미지인 ‘탑들’을 유지했습니다.
- source_word: τὰς κυμάτων ἀπειλάς
  english_pob_choice: the threats of the waves
  chosen_korean: 파도의 위협
  alternatives_korean:
  - 파도의 위협들
  - 파도의 공격
  lexicon: LSJ
  rationale: ἀπειλή의 직접 의미인 ‘위협’을 살리되, 한국어에서는 ‘파도의 위협’이 가장 자연스럽고 원문의 의인화된 긴장감을 보존합니다.
- source_word: γαληνὸν παρέχουσιν τοῖς εἰσπλέουσιν τὸν ὅρμον
  english_pob_choice: provide a calm harbor for those sailing in
  chosen_korean: 들어오는 이들에게 잔잔한 항구를 마련해 주듯이
  alternatives_korean:
  - 들어오는 이들에게 고요한 항구를 제공하듯이
  - 들어오는 이들에게 잔잔한 피난처를 마련해 주듯이
  lexicon: LSJ
  rationale: γαληνός는 바다의 ‘잔잔함’을 가리키므로 ‘잔잔한’으로 살렸고, ὅρμον은 항구/정박지의 뜻이지만 앞의 λιμένων을 고려해 중복을 피하면서도 항해 은유를 유지하는 ‘항구’로 옮겼습니다.
