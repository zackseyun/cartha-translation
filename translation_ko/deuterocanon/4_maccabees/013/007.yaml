theological_decisions:
- issue: ‘경건의 항구’를 둘러싼 은유를 어떻게 처리할 것인가
  chosen_reading: 은유를 풀어 쓰지 않고 ‘경건의 항구’를 유지했습니다.
  alternative_readings:
  - ‘경건의 피난처’
  - ‘하나님께 대한 경건의 안식처’
  rationale: 본문은 성곽과 항구의 이미지를 연쇄적으로 사용하므로, 이를 완화하면 수사적 긴장과 대조가 약해집니다. 따라서 원문의 비유 구조를 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
