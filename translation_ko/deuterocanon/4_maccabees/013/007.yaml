  text: Thus the seven-towered blessedness of the young men[a], having fortified the harbor of godliness, conquered the licentiousness of the passions.
  footnotes:
  - marker: a
    text: Or, 'the seven-bastioned nobility of the youths,' or more interpretively, 'the blessed resolve of the seven young men.' The Greek phrase is highly figurative.
