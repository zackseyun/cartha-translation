translation:
  language: ko
  text: 이렇게 젊은이들의 일곱 탑을 갖춘 고귀한 이성이 경건의 항구를 견고하게 하여 정념의 무절제를 이겼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘일곱 탑을 갖춘’은 직역에 가까운 비유적 표현입니다. 젊은이들의 고귀한 이성적 품성을 성채에 빗대어 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑπτάπυργος
  english_pob_choice: seven-towered
  chosen_korean: 일곱 탑 같은
  alternatives_korean:
  - 일곱 탑의
  - 일곱 성루의
  lexicon: LSJ
  rationale: 그리스어의 복합 형용사가 만드는 성채 이미지를 살리기 위해 ‘일곱 탑 같은’으로 옮겼습니다. 한국어에서 자연스러우면서도 비유성을 보존합니다.
