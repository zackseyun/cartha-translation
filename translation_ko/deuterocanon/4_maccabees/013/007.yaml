  lexicon: LSJ
  rationale: 그리스어의 복합 형용사가 만드는 성채 이미지를 살리기 위해 ‘일곱 탑 같은’으로 옮겼습니다. 한국어에서 자연스러우면서도 비유성을 보존합니다.
