revisions:
- from: 이렇게 젊은이들의 일곱 탑 같은 복된 지혜가 경건의 항구를 견고하게 하여, 정욕의 방탕함을 이겼습니다.[a]
  to: 이렇게 젊은이들의 일곱 탑을 갖춘 고귀한 이성이 경건의 항구를 견고하게 하여 정념의 무절제를 이겼습니다.[a]
  rationale: 원문의 복합 형용사 ἑπτάπυργος가 만드는 성채 이미지는 보존하되, εὐλογιστία를 ‘고귀한 이성’으로 옮겨 4마카베오에서 두드러지는 이성과 정념의 대조 및 칭송의 어조를 반영했습니다. ‘무절제’는 ἀκολασία의 넓은 윤리적 의미를 보존합니다. 각주는 영어 번역에 대한 언급을 제거하고 원어의 비유를 설명하도록 고쳤습니다.
