base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/005.yaml
  text: How then can one fail to acknowledge in these men the mastery over suffering that comes from blessedness[a], since they were not turned aside even by the pains of fire?
  footnotes:
  - marker: a
    text: Or, more formally, 'the mastery over the passions belonging to blessedness/piety.' The Greek phrase is rare and difficult, but it clearly praises the brothers' virtuous self-mastery.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이 사람들에게서 축복에서 비롯된 고난을 이겨 내는 지배력[a]을 인정하지 않을 수 있겠습니까? 그들은 불의 고통에도 조금도 돌아서지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 형식적으로, ‘축복/경건에 속한 정념(고난)에 대한 지배력’입니다. 이 희귀한 그리스어 구는 정확한 뉘앙스가 논쟁적이지만, 여기서는 형제들의 도덕적 자기지배를 분명히 칭찬합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς οὖν οὐκ ἔστιν ... ὁμολογεῖν
  english_pob_choice: How then can one fail to acknowledge
  chosen_korean: 그러므로 …을 인정하지 않을 수 있겠습니까?
  alternatives_korean:
  - 그러므로 …을 인정하지 않겠습니까?
  - 그러므로 …을 인정할 수 없겠습니까?
  lexicon: LSJ
  rationale: 의문형 수사법이 사실상 강한 당위를 나타내므로, 한국어에서는 ‘인정하지 않을 수 있겠습니까?’로 압박감 있는 수용을 살렸습니다.
- source_word: τούτοις
  english_pob_choice: in these men
  chosen_korean: 이 사람들에게서
  alternatives_korean:
  - 이 사람들 안에서
  - 이 사람들 가운데서
  lexicon: LSJ
  rationale: 이 인물을 향한 칭찬의 초점이 인물 자체에 있으므로, ‘이 사람들에게서’로 자연스럽게 풀어 인정의 대상을 드러냈습니다.
- source_word: τὴν τῆς εὐλογιστίας παθοκρατίαν
  english_pob_choice: the mastery over suffering that comes from blessedness
  chosen_korean: 축복에서 비롯된 고난을 이겨 내는 지배력
  alternatives_korean:
  - 복된 삶에서 오는 고난 통제력
  - 복된 성향에서 오는 고난 지배력
  - 축복에 속한 고난 지배력
  lexicon: LSJ
  rationale: παθοκρατία의 핵심은 ‘고난/정념에 대한 지배’이므로 ‘이겨 내는 지배력’으로 옮겼고, εὐλογιστία는 희귀어라 ‘축복에서 비롯된’으로 의미를 과도하게 좁히지 않으면서 출처를 표시했습니다.
- source_word: οὐκ ἐπεστράφησαν
  english_pob_choice: they were not turned aside
  chosen_korean: 조금도 돌아서지 않았습니다
  alternatives_korean:
  - 돌이켜지지 않았습니다
  - 옆길로 새지 않았습니다
  - 물러서지 않았습니다
  lexicon: LSJ
  rationale: 수동적 뉘앙스를 한국어에서 자연스럽게 살리기 위해 ‘돌아서다’의 방향 전환 이미지를 사용해, 압박 아래서도 꺾이지 않은 상태를 표현했습니다.
- source_word: διὰ πυρὸς ἀλγηδόνων
  english_pob_choice: by the pains of fire
  chosen_korean: 불의 고통
  alternatives_korean:
  - 불로 인한 고통
  - 불길의 아픔
  - 불의 아픈 고통
  lexicon: LSJ
  rationale: διὰ πυρός는 수단/매개를 나타내며 ἀλγηδόνες는 격심한 고통을 뜻하므로, 간결하게 ‘불의 고통’으로 번역해 의미를 보존했습니다.
theological_decisions:
- issue: 희귀한 철학적 복합어 τῆς εὐλογιστίας παθοκρατία의 처리
  chosen_reading: 순교적 고난 속에서도 축복에 뿌리를 둔 도덕적 자기지배를 칭찬하는 표현으로 읽고, 한국어에서는 ‘고난을 이겨 내는 지배력’으로 옮겼습니다.
  alternative_readings:
  - ‘정념을 다스리는 축복의 힘’
  - ‘경건에 속한 정념 통제력’
  - ‘복된 상태에서 나오는 고난 지배력’
  rationale: 문맥상 4마카베오서는 형제들의 인내를 이성적·도덕적 자기지배의 증거로 제시하므로, 모호한 희귀어를 특정 교리 용어로 단정하지 않고 핵심 의미를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: 모호한 신학·철학적 긴장은 해소하지 말고, 본문이 분명히 말하는 의미만 드러내기.'
