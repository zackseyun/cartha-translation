lexical_decisions:
- source_word: σὺν τῇ εὐσεβείᾳ
  english_pob_choice: along with godliness
  chosen_korean: 경건과 함께
  alternatives_korean:
  - 경건과 더불어
  - 경건과 함께하여
  lexicon: LSJ
  rationale: σὺν은 동반·동시의 뜻이므로, POB의 ‘along with’를 살려 경건이 형제 사랑과 함께 길러졌다는 구조를 자연스럽게 나타냈습니다.
- source_word: εὐσεβείᾳ
  english_pob_choice: godliness
  chosen_korean: 경건
  alternatives_korean:
  - 신앙심
  - 경건함
  - 경외
  lexicon: LSJ
  rationale: 4 마카베오기에서 εὐσέβεια는 하나님께 대한 충실한 경외를 가리키므로, 한국어에서는 신앙적 태도를 직접 드러내는 ‘경건’이 가장 적절합니다.
- source_word: ποθεινοτέραν
  english_pob_choice: even more desirable
  chosen_korean: 더욱 바람직하게
  alternatives_korean:
  - 더욱 갈망되게
  - 더욱 소중하게
  - 더욱 바랄 만하게
  lexicon: LSJ
  rationale: 비교급 ποθεινοτέραν은 ‘바라게 되는, 바람직한’의 강한 비교를 나타내므로, 문맥상 품성과 덕목을 형성하는 의미를 살려 ‘더욱 바람직하게’로 옮겼습니다.
- source_word: φιλαδελφίαν
  english_pob_choice: brotherly love
  chosen_korean: 형제 사랑
  alternatives_korean:
  - 형제애
  - 형제 간 사랑
  - 남매 사랑
  lexicon: LSJ
  rationale: φιλαδελφία는 혈연적 형제들 사이의 사랑을 뜻하므로, 이 장면의 직접적 문맥을 살려 ‘형제 사랑’으로 번역했습니다.
theological_decisions:
- issue: εὐσεβείᾳ의 덕목적·신학적 뉘앙스
