  naturalness: ‘그들의 형제들 가운데 한 사람 한 사람이 끌려갈 때마다’는 분배적 반복을 자연스럽게 나타냅니다. ‘거짓말한 이들로 만들지 마십시오’는 다소 관용적이지만, 앞서 죽은 이들의 증언과 모범을 거짓으로 입증하지 말라는 문맥을 한국어에서 명료하게 전달합니다.
