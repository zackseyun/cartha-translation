  lexicon: LSJ
  rationale: ψεύσῃ는 단순한 ‘거짓말하다’보다 앞선 순교자들의 증언을 무효로 만들지 말라는 뜻을 담으므로, 한국어로는 결과를 드러내는 ‘헛되게 하지 마십시오’가 가장 자연스럽습니다.
theological_decisions:
- issue: ‘야곱’과 ‘모든 조상들’의 사후 영예 장면
  chosen_reading: 족장 야곱과 선조들이 순교자들을 영예롭게 맞이하고 칭찬하는 장면으로 옮겼습니다.
  alternative_readings:
  - 야곱을 이스라엘 전체의 상징으로 보는 해석
  - 조상들을 단순한 과거 인물 집단으로 완화하는 번역
  rationale: 본문이 야곱과 ‘모든 조상들’을 병렬로 두므로, 개인 족장들과의 상봉이라는 직설적 이미지를 보존하는 것이 문맥에 가장 충실합니다.
  doctrine_reference: 사후 심판/영예에 대한 유대교 순교문학의 묘사
