  text: And Jacob will welcome you[a], and all the fathers will praise you. And as each one of their brothers was being taken away, those who remained were saying, “Do not disgrace us, brother[b], nor prove false to those who died before us.”
  footnotes:
  - marker: a
    text: Or 'receive you' or 'greet you' for 'welcome you.'
    reason: lexical_alternative
  - marker: b
    text: Or 'nor make false those who died before us,' i.e., do not betray the witness of the brothers who have already died.
    reason: lexical_alternative
translation:
  language: ko
  text: 야곱은 너희를 맞이할 것이며, 모든 조상들은 너희를 칭찬할 것입니다. 그리고 그들의 형제들 가운데 각 사람이 끌려갈 때마다, 남아 있던 이들은 말했습니다. “우리를 욕되게 하지 마십시오, 형제여, 또한 우리보다 먼저 죽은 이들을 헛되게 하지 마십시오.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘맞아들일 것입니다’, ‘영접할 것입니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리보다 먼저 죽은 이들을 거짓되게 하지 마십시오’, 곧 이미 죽은 형제들의 증언을 저버리지 마십시오라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰακὼβ
  english_pob_choice: Jacob
  chosen_korean: 야곱
  alternatives_korean:
  - 야코브
  lexicon: 고유명사 관행
  rationale: 본문의 족장 야곱을 가리키므로 한국어 성경 관용형인 ‘야곱’을 쓰는 것이 가장 직접적입니다.
- source_word: ὑποδέξονται
  english_pob_choice: will welcome
  chosen_korean: 맞이할 것입니다
  alternatives_korean:
  - 환영할 것입니다
  - 받아들일 것입니다
  - 영접할 것입니다
  lexicon: LSJ
  rationale: 환대의 뉘앙스를 살리면서도 장례/영예의 문맥에 자연스러운 ‘맞이하다’가 가장 적절합니다.
- source_word: οἱ πατέρες
  english_pob_choice: the fathers
  chosen_korean: 모든 조상들
  alternatives_korean:
  - 모든 아버지들
  - 열조들
  lexicon: LSJ
  rationale: 문맥상 개별 아버지들이 아니라 족장적 선조들을 가리키므로, ‘조상들’이 의미를 분명히 전달합니다.
- source_word: Μὴ καταισχύνῃς ἡμᾶς
  english_pob_choice: Do not disgrace us
  chosen_korean: 우리를 욕되게 하지 마십시오
  alternatives_korean:
  - 우리를 부끄럽게 하지 마십시오
  - 우리를 수치스럽게 하지 마십시오
  lexicon: LSJ
  rationale: καταισχύνῃς의 공개적 수치와 명예 훼손의 힘을 살려 ‘욕되게 하다’로 옮겼습니다.
- source_word: μηδὲ ψεύσῃ τοὺς προαποθανόντας
  english_pob_choice: nor prove false to those who died before us
  chosen_korean: 또한 우리보다 먼저 죽은 이들을 헛되게 하지 마십시오
  alternatives_korean:
  - 또한 우리보다 먼저 죽은 이들에게 거짓되지 마십시오
  - 또한 우리보다 먼저 죽은 이들을 저버리지 마십시오
  lexicon: LSJ
  rationale: ψεύσῃ는 단순한 ‘거짓말하다’보다 앞선 순교자들의 증언을 무효로 만들지 말라는 뜻을 담으므로, 한국어로는 결과를 드러내는 ‘헛되게 하지 마십시오’가 가장 자연스럽습니다.
theological_decisions:
- issue: ‘야곱’과 ‘모든 조상들’의 사후 영예 장면
  chosen_reading: 족장 야곱과 선조들이 순교자들을 영예롭게 맞이하고 칭찬하는 장면으로 옮겼습니다.
  alternative_readings:
  - 야곱을 이스라엘 전체의 상징으로 보는 해석
  - 조상들을 단순한 과거 인물 집단으로 완화하는 번역
  rationale: 본문이 야곱과 ‘모든 조상들’을 병렬로 두므로, 개인 족장들과의 상봉이라는 직설적 이미지를 보존하는 것이 문맥에 가장 충실합니다.
  doctrine_reference: 사후 심판/영예에 대한 유대교 순교문학의 묘사
