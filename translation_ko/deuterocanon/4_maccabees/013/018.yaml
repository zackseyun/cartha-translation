  rationale: καταισχύνῃς의 공개적 수치와 명예 훼손의 힘을 살려 ‘욕되게 하다’로 옮겼습니다.
- source_word: μηδὲ ψεύσῃ τοὺς προαποθανόντας
  english_pob_choice: nor prove false to those who died before us
  chosen_korean: 또한 우리보다 먼저 죽은 이들을 헛되게 하지 마십시오
