base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/019.yaml
  text: And you are not ignorant of the affections of human nature[a], which the divine and all-wise providence apportioned to those who are born through the fathers, having planted them through the mother's womb;
  footnotes:
  - marker: a
    text: Or 'the natural affections of humanity' or 'human attachments.' The Greek φίλτρα denotes powerful bonds of affection here, not literal magic charms.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 여러분은 인간 본성의 애정[a]을 모르지 않습니다. 신적이고 지극히 지혜로우신 섭리께서 아버지들을 통하여 태어나는 이들에게 그 애정을 나누어 주시고, 어머니의 자궁을 통하여 그것을 심어 놓으셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인간의 자연적 애정’, ‘인간의 유대’. 그리스어 φίλτρα는 여기서 문자 그대로 사랑을 일으키는 주술이나 매혹물이 아니라, 강한 애정의 유대를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ ἀγνοεῖτε
  english_pob_choice: you are not ignorant
  chosen_korean: 모르지 않습니다
  alternatives_korean:
  - 알지 못합니다
  - 모르지 않으십니다
  lexicon: BDAG
  rationale: 수사적 직설을 살리면서도 합쇼체에 맞게 자연스럽게 옮겼습니다. 영어의 'not ignorant'가 지닌 약한 책망·환기의 뉘앙스를 유지합니다.
- source_word: τὰ τῆς ἀνθρωπότητος φίλτρα
  english_pob_choice: the affections of human nature
  chosen_korean: 인간 본성의 애정들
  alternatives_korean:
  - 인간성의 애정들
  - 인류의 애착들
  - 자연적 인간 애정들
  lexicon: LSJ
  rationale: φίλτρα의 핵심은 단순한 감정이 아니라 강한 애정·유대이므로, '애정들'로 옮기되 ἀνθρωπότης의 관계성을 살려 '인간 본성'으로 표현했습니다.
- source_word: θεία καὶ πάνσοφος πρόνοια
  english_pob_choice: the divine and all-wise providence
  chosen_korean: 신적이고 지극히 지혜로우신 섭리
  alternatives_korean:
  - 하나님의 신적이고 지극히 지혜로우신 섭리
  - 신성하고 지극히 지혜로운 섭리
  lexicon: LSJ
  rationale: πρόνοια는 이 문맥에서 철학적·신학적 의미의 '섭리'가 가장 적절합니다. 원문에 없는 '하나님'을 덧붙이지 않고 형용사 두 개의 중첩을 살렸습니다.
- source_word: διὰ τῆς μητρῴας φυτεύσασα γαστρός
  english_pob_choice: having planted them through the mother's womb
  chosen_korean: 어머니의 자궁을 통해 그것들을 심으신 것입니다
  alternatives_korean:
  - 어머니의 자궁을 통해 심으신 것입니다
  - 어머니의 모태를 통해 그것들을 심으신 것입니다
  - 어머니의 자궁에 그것들을 심으신 것입니다
  lexicon: LSJ
  rationale: φυτεύσασα의 식재 은유를 '심으신'으로 살렸고, μητρῴας γαστρός는 직역에 가깝게 '어머니의 자궁'으로 옮겼습니다. 영어 POB의 'having planted them'을 반영해 목적어 '그것들'을 보존했습니다.
theological_decisions:
- issue: 지혜로운 섭리의 주체를 하나님으로 명시할지 여부
  chosen_reading: 원문이 직접적으로 '하나님'을 말하지 않으므로 '섭리'만 두고 주체를 확장하지 않았습니다.
  alternative_readings:
  - 하나님의 섭리
  - 하나님 되시는 섭리
  rationale: θεία와 πρόνοια는 신학적으로 하나님을 가리키지만, 원문 문법은 추상 명사 구성을 사용합니다. 한국어 본문에서 주체를 명시적으로 확대하면 원문의 절제된 표현을 넘어설 수 있습니다.
  doctrine_reference: Translation philosophy §§1, 4
- issue: 아버지들과 어머니의 자궁을 통한 생성 질서를 분리해 보존할지 여부
  chosen_reading: 아버지들을 통해 태어나는 이들, 어머니의 자궁을 통해 심으심을 분리해 표현했습니다.
  alternative_readings:
  - 부모를 통해
  - 부모의 몸을 통해
  rationale: 원문은 διὰ τῶν πατέρων과 διὰ τῆς μητρῴας ... γαστρός를 구별합니다. 이 대칭을 유지해야 본문이 말하는 생성의 질서와 수사적 균형이 살아납니다.
  doctrine_reference: Translation philosophy §§1, 5
