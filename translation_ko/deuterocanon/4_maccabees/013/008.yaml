  text: For[a], having formed a sacred chorus of piety, they kept encouraging one another, saying,
  footnotes:
  - marker: a
    text: Or 'a holy chorus of piety.' The Greek combines cultic imagery ('sacred chorus') with the book's key virtue term εὐσέβεια.
