translation:
  language: ko
  text: 거룩한 경건의 합창을 세우고 나서, 그들은 서로를 계속 격려하며 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거룩한 경건의 합창’으로 옮길 수 있습니다. 그리스어는 제의적 이미지(‘거룩한 합창’)와 4 마카베오서의 핵심 덕목어 εὐσέβεια를 함께 결합합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερὸν
  english_pob_choice: sacred
  chosen_korean: 거룩한
  alternatives_korean:
  - 성스러운
  - 신성한
  lexicon: LSJ
  rationale: ἱερός는 제의적·성스러운 성격을 가리키므로, 여기서는 ‘합창’과 결합된 신앙적 이미지가 드러나도록 ‘거룩한’으로 옮겼습니다.
- source_word: εὐσεβείας
  english_pob_choice: of piety
  chosen_korean: 경건의
  alternatives_korean:
  - 신앙의
  - 독실함의
  lexicon: LSJ
  rationale: 4 마카베오서는 εὐσέβεια를 핵심 미덕으로 사용하므로, 한국어에서는 교리적 무게를 살리면서도 자연스러운 ‘경건’이 가장 적절합니다.
- source_word: στήσαντες χορὸν
  english_pob_choice: having formed a chorus
  chosen_korean: 합창을 세우고 나서
  alternatives_korean:
  - 합창을 이루고
  - 합창대를 조직하고
  lexicon: LSJ
  rationale: στήσαντες는 문자적 ‘세우다’보다 여기서는 χορὸν을 ‘구성하다/형성하다’는 뜻이므로, 원문의 구성 이미지를 살려 ‘합창을 세우고 나서’로 옮겼습니다.
- source_word: παρεθάρσυνον ἀλλήλους
  english_pob_choice: they kept encouraging one another
  chosen_korean: 서로를 계속 격려하며
  alternatives_korean:
  - 서로를 계속 용기 주며
  - 서로를 계속 북돋우며
  lexicon: LSJ
  rationale: 미완료시상의 반복·지속성을 반영해 ‘계속’으로 옮겼고, παρεθαρσύνον의 의미는 자연스러운 현대 한국어로 ‘격려하다’가 가장 잘 드러냅니다.
theological_decisions:
- issue: εὐσέβεια의 한국어 신학 용어 선택
  chosen_reading: 경건
  alternative_readings:
  - 경외
  - 신실함
  rationale: 이 책에서 εὐσέβεια는 박해 가운데 드러나는 하나님께 대한 충실한 경외를 뜻하므로, 전통적이지만 의미가 두텁게 유지되는 ‘경건’이 가장 적절합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 5, 6
