  source_fidelity: 개정이 필요합니다. 원문의 접속사 γάρ(‘왜냐하면/이는’)가 초안에서 빠졌고, στήσαντες χορὸν은 문자적으로 ‘합창을 세우다’라기보다 한 무리의 합창을 이루거나 결성한다는 비유적 표현입니다. παρεθάρσυνον의 미완료상은 ‘계속’으로 잘 반영되어야 합니다.
  naturalness: ‘거룩한 경건의 합창을 세우고 나서’는 수식 관계와 한국어 결합이 다소 부자연스럽습니다. ‘경건의 성스러운 합창을 이루고’가 원문의 비유를 보존하면서 더 자연스럽습니다. 이어질 직접 발화를 도입하는 λέγοντες는 ‘이렇게 말했습니다’로 자연스럽게 옮길 수 있습니다.
  terminology: εὐσεβείας는 이 문맥에서 핵심 덕목인 ‘경건’으로 옮기는 것이 적절합니다. ἱερόν은 제의적 이미지를 살려 ‘성스러운’으로 옮기고, 대안으로 ‘거룩한’을 각주에 제시합니다. χορός를 ‘합창’으로 유지하여 원문의 합창/제의적 집단 이미지를 보존합니다.
