base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/001.yaml
  text: Therefore[a], since the seven brothers looked down on pains even to death[c][b], it is acknowledged from every side that godly reason is sovereign over the passions.
  footnotes:
  - marker: a
    text: Or 'despised pains up to death' or 'thought lightly of sufferings unto death.'
    reason: lexical_alternative
  - marker: b
    text: '''Godly reason'' could also be rendered ''pious reason'' or ''devout reason''; the Greek expression is a key theme in 4 Maccabees for reason shaped by reverence toward God.'
    reason: lexical_alternative
  - marker: c
    text: '''Passions'' refers to disordered drives or impulses in the book''s moral-philosophical argument, not merely feelings in general.'
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 일곱 형제는 죽음에 이르기까지의 고통을 가벼이 여겼고, 경건한 이성은 정념을 다스리는 주권자라는 것이 모든 면에서 인정됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘고통’은 여기서 단순한 감정적 아픔이 아니라 죽음에 이르기까지 견뎌야 했던 시련 전체를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: ‘경건한 이성’은 4 Maccabees에서 반복되는 핵심 표현으로, 하나님을 향한 경건에 의해 형성된 이성을 뜻합니다.
    reason: theological_note
