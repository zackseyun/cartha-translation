theological_decisions:
- issue: 4 Maccabees의 핵심 개념인 εὐσεβὴς λογισμός을 어떻게 철학적이면서도 신학적으로 번역할지
  chosen_reading: 경건한 이성
  alternative_readings:
  - 경건한 판단
  - 경건한 이성적 분별
  - 경외하는 이성
  rationale: 이 문맥은 단순한 합리성이 아니라 하나님을 향한 경건에 의해 형성된 이성을 말하므로, 철학적 핵심성과 종교적 방향성을 함께 살리는 번역을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: 원문 우선, 신학적 긴장은 평면화하지 않고 현대 한국어로 투명하게 제시.'
- issue: πάθη를 감정 일반이 아니라 윤리-철학적 의미로 옮길지
  chosen_reading: 정념
  alternative_readings:
  - 감정
  - 충동
  - 욕망
  rationale: 4 Maccabees에서 πάθη는 제어되어야 할 비이성적 욕구와 충동을 가리키므로, 감정보다 철학적 용례를 반영하는 ‘정념’이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: 원어의 개념망을 보존하고, 문맥이 요구하는 전문용어는 유지한다.'
