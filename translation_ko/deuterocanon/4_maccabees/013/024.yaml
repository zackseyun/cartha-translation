  naturalness: ‘서로에 대한 더 굳건한 조화’는 현대 한국어에서 다소 어색합니다. ‘서로 간에 더욱 굳건한 화합’이 관계성과 문체를 더 자연스럽게 살립니다. ‘상호 일치’도 주석 문체로는 다소 경직되어 더 평이하게 고쳤습니다.
