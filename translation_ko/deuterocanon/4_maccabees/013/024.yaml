  text: For they had a firmer harmony with one another[a]; for, having been trained by the same law, having practiced the same virtues, and having been brought up in a righteous way of life[b], they were drawn more closely together.
  footnotes:
  - marker: a
    text: Or 'a stronger concord with one another.'
    reason: lexical_alternative
  - marker: b
    text: The closing clause is compressed in Greek; the sense is that their shared formation in law, virtue, and righteous living drew them into closer mutual unity.
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 서로에 대한 더 굳건한 조화를 누렸습니다[a]. 같은 율법으로 교육을 받고, 같은 덕을 실천하며, 의로운 삶 속에서 자라났기 때문에[b], 그들은 서로에게 더욱 가까워졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘서로에 대한 더 강한 일치’.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 압축되어 있으며, 같은 율법과 덕, 의로운 삶으로 형성된 공통의 배경이 그들을 더 긴밀한 상호 일치로 이끌었다는 뜻입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: θέστερον / ὁμόνοιαν
  english_pob_choice: firmer harmony
  chosen_korean: 더 굳건한 조화
  alternatives_korean:
  - 더 강한 일치
  - 더 큰 화합
  - 더 굳은 화합
  lexicon: LSJ
  rationale: 비교급이 만드는 ‘더 견고한’ 뉘앙스를 살리면서, ὁμόνοια의 ‘마음의 일치/화목’을 현대 한국어에서 자연스럽게 드러내기 위해 ‘조화’를 택했습니다.
- source_word: νόμῳ
  english_pob_choice: law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 가르침
  lexicon: LSJ
  rationale: 4 마카베오에서 νόμος는 보통 조상들의 유대 율법을 가리키므로, 한국어에서도 그 구체성을 살려 ‘율법’으로 옮겼습니다.
- source_word: παιδευθέντες / ἐξασκήσαντες / συντραφέντες
  english_pob_choice: having been trained / having practiced / having been brought up
  chosen_korean: 교육을 받고 / 실천하며 / 자라났기 때문에
  alternatives_korean:
  - 훈련을 받고 / 연습하며 / 양육되었기 때문에
  - 가르침을 받고 / 익히며 / 길러졌기 때문에
  lexicon: LSJ
  rationale: 세 분사구가 법에 따른 형성, 덕의 훈련, 의로운 삶 속의 성장이라는 연속된 배경을 이루므로, 한국어에서는 병렬성과 흐름이 드러나도록 풀어 옮겼습니다.
- source_word: τῷ δικαίῳ ... βίῳ
  english_pob_choice: in a righteous way of life
  chosen_korean: 의로운 삶 속에서
  alternatives_korean:
  - 의로운 생활 가운데
  - 의로운 삶의 방식 안에서
  lexicon: LSJ
  rationale: βίος를 단순히 추상화하지 않고 ‘삶’으로 살리되, 전치사의 관계를 자연스럽게 드러내기 위해 ‘속에서’를 사용했습니다.
theological_decisions:
- issue: 공동 형성의 결과를 어떻게 드러낼 것인가
  chosen_reading: 같은 율법, 같은 덕, 의로운 삶이 그들을 서로에게 더 가까워지게 했다는 인과를 분명히 드러냈습니다.
  alternative_readings:
  - 단순히 그들은 더 친밀해졌습니다
  - 그들은 더 큰 일치를 가졌습니다
  rationale: 그리스어의 압축된 마지막 절은 앞선 분사구들이 낳는 결과를 말하므로, 인과 관계가 독자에게 분명히 보이도록 ‘기 때문에’와 ‘더 가까워졌습니다’로 풀어 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: source-grounded clarity; preserve causal force of participial constructions'
