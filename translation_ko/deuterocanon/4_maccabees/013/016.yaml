translation:
  language: ko
  text: 그러므로 이제 우리는 신적 이성의 열정 지배력으로 무장합시다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘신적 이성의 열정 지배력으로’로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθοπλισώμεθα
  english_pob_choice: let us arm ourselves
  chosen_korean: 무장합시다
  alternatives_korean:
  - 스스로 무장합시다
  - 무기를 갖춥시다
  lexicon: LSJ
  rationale: 첫째 인칭 복수 권유형으로, 도덕적 संघर्ष을 위한 군사적 은유를 자연스럽게 살려야 하므로 ‘무장합시다’로 옮겼습니다.
- source_word: τοιγαροῦν
  english_pob_choice: therefore
  chosen_korean: 그러므로 이제
  alternatives_korean:
  - 그러므로
  - 그런즉
  lexicon: LSJ
  rationale: 앞선 논지로부터의 결론을 나타내는 접속사이므로 ‘그러므로’가 적절하고, 문맥상 호소의 전환을 살리기 위해 ‘이제’를 덧붙였습니다.
- source_word: τῇ ... παθοκρατίᾳ
  english_pob_choice: with the mastery over passions
  chosen_korean: 열정 지배력으로
  alternatives_korean:
  - 감정 지배력으로
  - 정념을 제어하는 힘으로
  - 정념 지배로
  lexicon: LSJ
  rationale: 여기서 παθοκρατία는 단순 억압이 아니라 정념/열정을 다스리는 ‘지배력’이므로, 한국어에서는 합성어의 힘을 살려 ‘열정 지배력’으로 옮겼습니다.
- source_word: τοῦ θείου λογισμοῦ
  english_pob_choice: that comes from godly reason
  chosen_korean: 신적 이성의
  alternatives_korean:
  - 경건한 이성의
  - 하나님을 닮은 이성의
  - 신성한 이성의
  lexicon: LSJ
  rationale: θεῖος λογισμός는 이 책의 도덕철학적 핵심 개념이므로, ‘reason’을 ‘이성’으로, θεῖος를 ‘신적’으로 옮겨 철학적·종교적 뉘앙스를 함께 보존했습니다.
theological_decisions:
- issue: θεῖος λογισμός의 번역이 철학적 이성 개념으로 흐르지 않도록 하는 문제
  chosen_reading: 신적 이성
  alternative_readings:
  - 경건한 이성
  - 신성한 이성
  rationale: 4 마카베오서는 정념을 다스리는 합리적 판단을 강조하므로, ‘신적 이성’은 본문의 윤리적 호소를 유지하면서도 후대 기독교적 용어를 덧씌우지 않습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
