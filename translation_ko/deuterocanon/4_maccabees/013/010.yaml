review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 δειλανδρήσωμεν은 ‘겁쟁이가 되다’보다 ‘비겁하게 굴다’로 옮기는 편이 동사가 나타내는 행위적 권면과 더 정확히 맞습니다. 또한 그리스어에는 ‘우리의’에 해당하는 명시적 소유사가 없으므로 한국어에서는 생략하는 것이 더 절제되고 자연스럽습니다.
  naturalness: ‘경건을 드러내는 데서 겁쟁이가 되지 맙시다’는 명사 서술어 ‘겁쟁이가 되다’와 ‘-는 데서’의 결합이 다소 부자연스럽습니다. ‘경건을 드러내는 일에 비겁하게 굴지 맙시다’가 현대 표준어 합쇼체 권면으로 자연스럽습니다.
  terminology: εὐσέβεια를 ‘경건’으로 옮긴 것은 이 문맥의 하나님께 대한 충실한 헌신을 잘 전달합니다. ἀπόδειξις는 ‘드러내는 일’로 번역하여 공개적 실증·표명의 뜻을 유지할 수 있습니다.
  issues:
  - severity: medium
    issue: ‘겁쟁이가 되지 맙시다’
    rationale: δειλανδρέω는 ‘겁쟁이가 되다’라는 신분·상태 변화보다 ‘비겁하게 행동하다/굴다’를 뜻합니다. 원문의 권면적 행위 의미를 위해 ‘비겁하게 굴지 맙시다’가 적절합니다.
  - severity: low
    issue: 각주가 실질적인 번역 대안을 제공하지 않음
    rationale: 현 각주는 번역 선택의 메타 설명이며 영어 단어를 섞어 사용합니다. 영어 POB 감사 기록의 대안인 ‘용기를 잃다’를 한국어 대안으로 제시하는 편이 독자용 각주로 적합합니다.
  revised_text: 우리가 경건을 드러내는 일에 비겁하게 굴지 맙시다.[a]
