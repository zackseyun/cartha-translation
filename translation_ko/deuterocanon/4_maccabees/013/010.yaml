lexical_decisions:
- source_word: μὴ δειλανδρήσωμεν
  english_pob_choice: Let us not be cowardly
  chosen_korean: 겁쟁이가 되지 맙시다
  alternatives_korean:
  - 비겁해지지 맙시다
  - 용기를 잃지 맙시다
  - 겁내지 맙시다
  lexicon: LSJ
  rationale: 첫째 인칭 복수 권고법으로서 ‘비겁하게 굴다’는 뜻을 살리되, 현대 한국어에서 자연스럽고 강한 권면이 되도록 ‘겁쟁이가 되다’로 옮겼습니다.
- source_word: πρὸς τὴν ... ἀπόδειξιν
  english_pob_choice: in demonstrating
  chosen_korean: 드러내는 데서
  alternatives_korean:
  - 입증하는 데서
  - 증명하는 데서
  - 나타내는 데서
  lexicon: BDAG
  rationale: πρὸς + 대격이 관계·방향을 나타내므로, 행위의 영역을 자연스럽게 표현하는 ‘드러내는 데서’로 옮겼습니다. ‘증명하다’는 너무 논증적일 수 있습니다.
- source_word: τῆς εὐσεβίας
  english_pob_choice: our piety / our godliness
  chosen_korean: 우리의 경건
  alternatives_korean:
  - 우리의 경건함
  - 우리의 신앙
  - 우리의 경외
  lexicon: BDAG
  rationale: εὐσέβεια는 하나님께 대한 경건한 헌신을 가리키므로, 교회적·윤리적 뉘앙스를 함께 살리는 표준적 한국어인 ‘경건’이 가장 균형 잡힙니다.
theological_decisions:
- issue: εὐσέβεια의 번역어 선택
  chosen_reading: 경건
  alternative_readings:
  - 경건함
  - 경외
  - 신앙
  rationale: 4 마카베오서는 순교적 충실성과 하나님께 대한 헌신을 강조하므로, ‘경건’이 단순한 외적 예법보다 내적 헌신과 삶의 태도를 함께 전달합니다.
