base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/004.yaml
  text: It is impossible to overlook the rule of reason[a], for they prevailed over both passion and pains.
  footnotes:
  - marker: a
    text: Or 'the mind' for 'reason.' The Greek term can denote the mind or understanding; here it likely emphasizes rational judgment as governing the passions.
    reason: lexical_alternative
translation:
  language: ko
  text: 이성[a]의 지배력을 간과할 수 없습니다. 그들은 정념과 고통 모두를 이겼기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마음’ 또는 ‘이해력’. 여기서 διανοία는 철학적 의미의 ‘이성’을 가리키지만, 문맥에 따라 마음이나 이해력을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔστιν παριδεῖν
  english_pob_choice: It is impossible to overlook
  chosen_korean: 간과하는 것은 불가능합니다
  alternatives_korean:
  - 무시할 수 없습니다
  - 못 본 체할 수 없습니다
  lexicon: LSJ
  rationale: 무인칭 불가 구조를 한국어의 가능·불가능 표현으로 자연스럽게 옮겨, 단순한 인지 실패가 아니라 ‘그럴 수 없음’의 뜻을 살렸습니다.
- source_word: τὴν ἡγεμονίαν
  english_pob_choice: the rule
  chosen_korean: 통치
  alternatives_korean:
  - 지배
  - 주도권
  - 통솔
  lexicon: LSJ
  rationale: ἡγεμονία는 여기서 이성의 지배적 작용을 가리키므로, ‘통치’가 본문의 윤리철학적 뉘앙스를 가장 압축적으로 드러냅니다.
- source_word: τῆς διανοίας
  english_pob_choice: of reason
  chosen_korean: 이성의
  alternatives_korean:
  - 마음의
  - 이해의
  - 생각의
  lexicon: LSJ
  rationale: 4마카베오서는 정념을 제어하는 합리적 판단을 강조하므로, broad한 ‘마음’보다 ‘이성’이 문맥의 논지를 더 정확히 반영합니다.
- source_word: ἐπεκράτησαν γὰρ καὶ πάθους καὶ πόνων
  english_pob_choice: for they prevailed over both passion and pains
  chosen_korean: 그들은 정념과 고통 모두를 이겼기 때문입니다
  alternatives_korean:
  - 그들은 정념과 고통 모두를 이겼기 때문입니다
  - 그들은 정념과 고통 위에 서 있었기 때문입니다
  lexicon: LSJ
  rationale: ἐπεκράτησαν의 지배·우세 의미를 한국어의 ‘이기다’로 간결하게 전달했고, πάθος은 여기서 철학적·윤리적 용례이므로 ‘정념’이 적절합니다.
theological_decisions:
- issue: 4마카베오의 인간학적 논증을 ‘reason’과 ‘mind’ 중 어떻게 표기할지
  chosen_reading: ‘이성’으로 옮겨, 이성이 정념을 다스리는 본문의 논지를 드러냅니다.
  alternative_readings:
  - ‘마음’
  - ‘이해’
  rationale: 본문은 신학적 교리 용어보다 헬라 철학적 윤리 논증에 가깝기 때문에, ‘이성’이 독자가 저자의 주장을 오해 없이 읽도록 돕습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 5
