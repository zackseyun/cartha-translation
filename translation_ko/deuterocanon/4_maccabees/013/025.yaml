  naturalness: 초안의 ‘고귀한 선함에 대한 같은 마음’과 ‘서로에 대한 그들의 조화’는 한국어에서 다소 직역투입니다. ‘고귀함과 선함에 대한 뜻의 일치’ 및 ‘그들 사이의 화합’이 현대 표준어 합쇼체에서 더 자연스럽습니다.
  terminology: ‘뜻의 일치’는 ὁμόγνοια에, ‘화합’은 ὁμόνοια에 각각 대응하여 두 관련 어휘를 동일어로 평준화하지 않습니다. ‘고귀함과 선함’은 καλοκἀγαθία의 윤리적 이상을 교리적으로 과도하게 해석하지 않고 보존합니다.
