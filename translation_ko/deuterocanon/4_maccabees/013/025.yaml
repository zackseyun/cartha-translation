lexical_decisions:
- source_word: ὁμόγνοια
  english_pob_choice: shared commitment
  chosen_korean: 같은 마음
  alternatives_korean:
  - 한뜻
  - 동일한 지향
  - 뜻을 같이함
  lexicon: LSJ
  rationale: ὁμόγνοια는 단순한 외적 합의보다 내적 일치와 공통된 지향을 가리키므로, 한국어에서는 간결하게 ‘같은 마음’으로 살려 두 번째 명사 ὁμόνοια와의 구별도 유지했습니다.
- source_word: καλοκἀγαθίας
  english_pob_choice: noble goodness
  chosen_korean: 고귀한 선함
  alternatives_korean:
  - 고상한 선
  - 고귀함과 선함
  - 덕스러운 선함
  lexicon: LSJ
  rationale: 합성어가 지닌 ‘고상함/고귀함’과 ‘선함’을 함께 드러내기 위해 ‘고귀한 선함’으로 옮겼습니다.
- source_word: ἐπέτεινεν
  english_pob_choice: intensified
  chosen_korean: 더욱 깊게 했습니다
  alternatives_korean:
  - 강화했습니다
  - 더 강하게 했습니다
  - 증대시켰습니다
  lexicon: LSJ
  rationale: 문맥상 관계의 강화와 심화를 나타내므로, 단순한 증가보다 자연스러운 관계 심화 표현을 택했습니다.
- source_word: ὁμόνοιαν
  english_pob_choice: harmony
  chosen_korean: 조화
  alternatives_korean:
  - 화합
  - 화목
  - 일치
  lexicon: LSJ
  rationale: 앞의 ὁμόγνοια와 같은 단어를 반복하지 않으면서 상호 관계의 평화로운 합일을 드러내기 위해 ‘조화’를 선택했습니다.
theological_decisions:
- issue: 인간 덕목의 진술을 신학적으로 약화하지 않음
  chosen_reading: 이 절은 서로의 덕성에서 비롯된 공동의 내적 일치가 관계적 조화를 심화시킨다는 진술로 읽었습니다.
  alternative_readings:
  - 순전히 일반적인 우정의 진술로 축소하는 읽기
  - 도덕적 추상어로만 바꾸는 읽기
  rationale: 4마카베오서는 순교 서사를 통해 덕성과 공동체적 일치를 강조하므로, ‘고귀한 선함’과 ‘같은 마음’의 인과를 그대로 살렸습니다.
  doctrine_reference: 4 Maccabees의 순교·덕성 강조 맥락
