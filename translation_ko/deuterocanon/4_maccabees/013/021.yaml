  text: having been brought to full maturity in soul[a], and having been brought forth through equal periods of time, and drinking milk from the same springs, from which they are nourished[b],
  footnotes:
  - marker: a
    text: Or 'suckling from the same sources of milk'; the Greek keeps a vivid maternal image without explicitly naming the breasts.
    reason: lexical_alternative
  - marker: b
    text: The final clause may also be understood 'from which they are reared together,' not only 'from which they are nourished.'
    reason: alternative_reading
translation:
  language: ko
  text: 영혼에 있어 완전한 성숙에 이르렀고, 같은 기간 동안 태어났으며, 같은 젖의 샘들에서 젖을 먹고, 거기서 함께 양육되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘같은 젖의 샘들’입니다. 그리스어는 젖먹이의 생생한 모성 이미지를 살리면서도, 신체 부위를 직접 말하지는 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절의 마지막은 ‘거기서 함께 양육되었습니다’로도 옮길 수 있습니다. 그리스어 동사에는 ‘먹여 기르다’의 뜻이 함께 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ψυχῆς τελεσφορηθέντες
  english_pob_choice: having been brought to full maturity in soul
  chosen_korean: 영혼에 있어 완전한 성숙에 이르렀고
  alternatives_korean:
  - 영혼에서 성숙에 이르렀고
  - 영혼의 완성에 이르렀고
  lexicon: LSJ
  rationale: τελεσφορηθέντες는 단순한 성장보다 ‘완성에 이른 성숙’을 뜻하므로, ψυχῆς는 대상이 아니라 관련 부위를 나타내는 의미로 보아 ‘영혼에 있어’로 옮겼습니다.
- source_word: διὰ τῶν ἴσων ... χρόνων
  english_pob_choice: through equal periods of time
  chosen_korean: 같은 기간 동안
  alternatives_korean:
  - 동일한 기간을 거쳐
  - 같은 시간 동안
  lexicon: LSJ
  rationale: 문맥상 형제자매가 동일한 임신/발달 기간을 거쳤다는 점을 간결하게 살리기 위해 ‘같은 기간 동안’으로 옮겼습니다.
- source_word: ἀποτεχθέντες
  english_pob_choice: having been brought forth
  chosen_korean: 태어났으며
  alternatives_korean:
  - 세상에 나왔으며
  - 낳아졌으며
  lexicon: LSJ
  rationale: 수동 분사로서 ‘출생되다/세상에 나오다’의 뜻이지만, 한국어에서는 자연스러운 서술을 위해 ‘태어났으며’로 번역했습니다.
- source_word: γαλακτοποτοῦντες πηγῶν
  english_pob_choice: drinking milk from the same springs
  chosen_korean: 같은 젖의 샘들에서 젖을 먹고
  alternatives_korean:
  - 같은 젖샘에서 젖을 먹고
  - 같은 दूध의 샘에서 젖을 먹고
  lexicon: LSJ
  rationale: πηγῶν은 문자 그대로 ‘샘들’이지만, 여기서는 모유의 생생한 비유이므로 ‘젖의 샘들’로 옮겨 원문의 이미지를 유지했습니다.
- source_word: συντρέφονται
  english_pob_choice: they are nourished
  chosen_korean: 함께 양육되었습니다
  alternatives_korean:
  - 함께 길러졌습니다
  - 함께 자라났습니다
  lexicon: LSJ
  rationale: 영어 POB의 각주가 보이듯 이 동사는 ‘양육되다/함께 길러지다’까지 포함할 수 있으므로, 젖을 먹는 이미지와 맞물려 최종 절을 ‘함께 양육되었습니다’로 번역했습니다.
