translation:
  language: ko
  text: 영혼에 있어 완전히 성숙하게 되었고, 같은 기간을 거쳐 태어났으며, 같은 젖의 샘들[a]에서 젖을 먹고, 그 샘들에서 함께 길러집니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘같은 젖의 샘들’입니다. 그리스어는 젖먹이의 생생한 모성 이미지를 살리면서도 신체 부위를 직접 말하지는 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 ‘그 샘들에서 함께 양육됩니다’로도 옮길 수 있습니다. 그리스어 동사에는 ‘함께 길러지다’와 ‘먹여 기르다’의 뜻이 함께 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ψυχῆς τελεσφορηθέντες
  english_pob_choice: having been brought to full maturity in soul
  chosen_korean: 영혼에 있어 완전한 성숙에 이르렀고
  alternatives_korean:
