lexical_decisions:
- source_word: οὐκ ἐπέγνων
  english_pob_choice: I did not recognize
  chosen_korean: 나는 ... 알아보지 못했습니다
  alternatives_korean:
  - 나는 ... 알지 못했습니다
  - 나는 ... 깨닫지 못했습니다
  lexicon: BDAG
  rationale: ἐπιγινώσκω는 단순 지식 부재보다 ‘알아보고 알아차리다’의 뉘앙스가 있어, 한탄문 맥락에서 ‘알아보지 못했습니다’가 가장 자연스럽고 원문의 인식 실패를 살립니다.
- source_word: τὴν σώζουσαν ... σωτηρίαν
  english_pob_choice: the salvation that was saving
  chosen_korean: 그 구원을 ... 구원하던
  alternatives_korean:
  - 그 спас?
  - 그 구원을 ... 구해 주던
  - 그 구원을 ... 구원하고 있던
  lexicon: BDAG
  rationale: σωτηρίαν을 ‘구원’으로 두고, σώζουσαν의 현재 분사를 ‘구원하던’으로 옮겨 반복 구조를 살렸습니다. 영어 POB의 ‘saving’처럼 동사적 힘을 유지하면서도 한국어에서 어색한 직역을 피했습니다.
- source_word: ἑπτὰ υἱοὺς
  english_pob_choice: seven sons
  chosen_korean: 일곱 아들
  alternatives_korean:
  - 일곱 자녀
  - 일곱 아들들
  lexicon: BDAG
  rationale: υἱούς는 분명히 ‘아들들’이므로 성별을 중화하지 않고 ‘일곱 아들’로 옮겼습니다.
- source_word: πρὸς ὀλίγον χρόνον
  english_pob_choice: for a little while
  chosen_korean: 잠시 동안
  alternatives_korean:
  - 잠깐 동안
  - 짧은 시간 동안
  lexicon: BDAG
  rationale: 시간의 제한성을 자연스러운 현대 한국어로 살리기 위해 ‘잠시 동안’을 택했습니다. 원문의 ‘for a little while’과 가장 가까운 일상적 표현입니다.
theological_decisions:
- issue: σωτηρία의 의미 범위
  chosen_reading: 여기서는 영원한 구원보다는 일시적 보전/구출의 뜻이 전면에 있습니다.
  alternative_readings:
  - 종말론적 구원으로 읽기
  - 단순한 탈출로만 축소하기
  rationale: 문맥이 순교 직전의 아들들이 ‘잠시 동안’ 보전된 상황을 가리키므로, ‘구원’이라는 어휘는 유지하되 시간적 한계를 분명히 했습니다. 이렇게 해야 원문의 신학적 긴장—구원이지만 잠정적 보전이라는 점—이 보존됩니다.
  doctrine_reference: 4 Maccabees의 순교 서사에서 σωτηρία의 문맥적 의미
