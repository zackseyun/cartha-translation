  text: Because of her fear toward God[a], she disregarded the temporary safety of her children.
  footnotes:
  - marker: a
    text: Or 'the temporary deliverance of her children.' The Greek σωτηρία can mean 'deliverance' or 'preservation'; here it refers to short-term physical rescue, not eternal salvation.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님에 대한 두려움 때문에, 그녀는 자녀들의 일시적인 안전을 아랑곳하지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자녀들의 일시적인 구출’로 옮길 수 있습니다. 그리스어 σωτηρία는 ‘구원’ 또는 ‘구출/보전’을 뜻할 수 있으나, 여기서는 영원한 구원이 아니라 단기적인 물리적 보호를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸν πρὸς τὸν θεὸν φόβον
  english_pob_choice: Because of her fear toward God
  chosen_korean: 하나님을 향한 두려움 때문에
  alternatives_korean:
  - 하나님을 향한 경외 때문에
  - 하나님에 대한 두려움 때문에
  lexicon: BDAG
  rationale: διὰ + 대격은 원인을 나타내므로 ‘때문에’로 옮겼고, φόβος는 하나님 앞의 경건한 두려움을 가리키므로 ‘두려움’으로 살리되 ‘향한’으로 대상 방향을 분명히 했습니다.
- source_word: ὑπερεῖδεν
  english_pob_choice: disregarded
  chosen_korean: 아랑곳하지 않았습니다
  alternatives_korean:
  - 무시했습니다
  - 중요하지 않게 여겼습니다
  - 외면했습니다
  lexicon: LSJ
  rationale: 이 동사는 단순히 못 본 것이 아니라 어떤 것을 더 높은 충성 앞에서 제쳐 두는 뜻이므로, 평가적 뉘앙스를 담는 ‘아랑곳하지 않다’가 자연스럽습니다.
- source_word: τὴν τῶν τέκνων πρόσκαιρον σωτηρίαν
  english_pob_choice: the temporary safety of her children
  chosen_korean: 자녀들의 일시적인 안전
  alternatives_korean:
  - 자녀들의 일시적인 구원
  - 자녀들의 임시적인 구출
  - 자녀들의 잠시뿐인 보전
  lexicon: BDAG
  rationale: σωτηρία는 여기서 영원한 ‘구원’이 아니라 고문과 죽음에서 벗어나는 현실적 보호를 가리키므로 ‘안전’이 적절하고, πρόσκαιρον은 그 한시성을 드러내는 ‘일시적인’으로 옮겼습니다.
theological_decisions:
- issue: φόβος τοῦ θεοῦ의 신학적 뉘앙스
  chosen_reading: 하나님을 향한 경건한 두려움
  alternative_readings:
  - 하나님을 향한 경외
  - 하나님 앞의 두려움
  rationale: 본문은 공포가 아니라 하나님께 대한 충성의 동기를 말하므로, ‘두려움’을 유지해 강도를 살리되 방향 표현으로 경건성을 분명히 했습니다.
  doctrine_reference: 'DOCTRINE.md: 신학적 긴장을 약화시키지 말고, 원문이 가진 무게를 보존한다.'
- issue: σωτηρία의 의미 범위
  chosen_reading: 일시적인 물리적 안전
  alternative_readings:
  - 일시적인 구출
  - 일시적인 보전
  rationale: 수식어 πρόσκαιρον이 의미를 시간적으로 제한하므로, 이를 영적 구원으로 읽지 않고 단기적 생명 보존의 의미로 유지해야 합니다.
  doctrine_reference: 'DOCTRINE.md: 원어 우선 원칙, 문맥이 제시하는 의미 범위를 넘기지 않는다.'
