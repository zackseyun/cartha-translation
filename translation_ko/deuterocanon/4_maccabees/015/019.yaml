base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/019.yaml
  text: Nor[a], as a third son was breathing his last, did you weep when you saw the eyes of each one, bull-like, looking upon the tortures and the same torment[c][b], and their nostrils foretelling death.
  footnotes:
  - marker: a
    text: Or 'Nor, with a third dying, did you weep …' The Greek opening is elliptical and depends on the surrounding context about the mother's sons.
    reason: lexical_alternative
  - marker: b
    text: The expression 'like bulls' likely describes the fierce, steadfast way the sons looked at the tortures before them.
    reason: cultural_note
  - marker: c
    text: Or 'their nostrils foretelling death.' The Greek image is vivid and may refer to the visible breathing of those near death.
    reason: lexical_alternative
translation:
  language: ko
  text: 셋째가 숨을 거두는 중에도, 각 사람의 눈이 황소처럼 고문과 같은 고통을 바라보고, 그들의 콧구멍이 죽음을 미리 알리는 것을 보면서도, 당신은 울지 않으셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 시작은 생략적입니다. 문맥상 어머니의 아들들을 가리키므로, 한국어에서는 이를 드러내야 의미가 분명해집니다.
    reason: source_note
  - marker: b
    text: ‘황소처럼’은 단순한 묘사보다, 고문 앞에서도 굳센 시선을 드러내는 직유로 읽을 수 있습니다.
    reason: cultural_note
  - marker: c
    text: ‘콧구멍이 죽음을 미리 알리는 것’은 죽음이 가까운 이들의 호흡과 몸의 징후를 시적으로 묘사한 표현일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ τρίτος ἀποψύχων
  english_pob_choice: Nor, as a third son was breathing his last
  chosen_korean: 셋째가 숨을 거두는 중에도
  alternatives_korean:
  - 셋째가 죽어 가는 중에도
  - 셋째가 숨져 가는 동안에도
  lexicon: LSJ
  rationale: ἀποψύχω는 ‘숨을 거두다, 죽어 가다’의 뜻이므로 자연스러운 현대 한국어로 옮기되, 원문의 생생한 임종 이미지는 유지했습니다.
- source_word: ταυρηδὸν
  english_pob_choice: like bulls
  chosen_korean: 황소처럼
  alternatives_korean:
  - 황소같이
  - 황소처럼 사납게
  lexicon: LSJ
  rationale: 부사형의 직유를 그대로 살려, 눈빛의 강인함과 격렬함을 과장 없이 전달했습니다.
- source_word: τὸν αὐτὸν αἰκισμόν
  english_pob_choice: the same torment
  chosen_korean: 같은 고통
  alternatives_korean:
  - 같은 학대
  - 같은 고문
  lexicon: LSJ
  rationale: αἰκισμός의 의미 영역은 학대·고문·고통을 포함하지만, 앞의 βασάνων과 겹쳐져 반복되는 잔혹함을 가리키므로 한국어에서는 ‘같은 고통’이 가장 무난하고 자연스럽습니다.
- source_word: τοὺς μυκτῆρας προσημειουμένους αὐτῶν τὸν θάνατον
  english_pob_choice: their nostrils foretelling death
  chosen_korean: 그들의 콧구멍이 죽음을 미리 알리는 것을
  alternatives_korean:
  - 그들의 콧구멍이 죽음을 예고하는 것을
  - 그들의 숨결이 죽음을 알리는 것을
  lexicon: LSJ
  rationale: μυκτῆρες는 코끝/콧구멍을 가리키고, προσημειόω는 미리 알리다, 예고하다의 뜻이므로 원문의 기이하고 육체적인 이미지를 최대한 보존했습니다.
theological_decisions:
- issue: 직유의 대상과 강도
  chosen_reading: ‘황소처럼’은 눈의 바라봄에 직접 연결해, 고문 앞에서도 흔들리지 않는 응시를 강조했습니다.
  alternative_readings:
  - 온몸의 태도에 넓게 적용할 수 있습니다.
  - ‘사납게’로 풀어 강도를 더할 수 있습니다.
  rationale: 문법상 직유는 가장 가까운 시각 동작에 붙는 것이 자연스러우며, 원문이 주는 대담한 수사 이미지를 약화시키지 않습니다.
  doctrine_reference: Translation philosophy §1, §6
