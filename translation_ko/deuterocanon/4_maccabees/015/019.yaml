base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/019.yaml
  text: Nor[a], as a third son was breathing his last, did you weep when you saw the eyes of each one, bull-like, looking upon the tortures and the same torment[c][b], and their nostrils foretelling death.
  footnotes:
  - marker: a
    text: Or 'Nor, with a third dying, did you weep …' The Greek opening is elliptical and depends on the surrounding context about the mother's sons.
    reason: lexical_alternative
  - marker: b
    text: The expression 'like bulls' likely describes the fierce, steadfast way the sons looked at the tortures before them.
    reason: cultural_note
  - marker: c
    text: Or 'their nostrils foretelling death.' The Greek image is vivid and may refer to the visible breathing of those near death.
    reason: lexical_alternative
translation:
  language: ko
  text: 셋째 아들이 숨을 거두어 갈 때에도[a] 당신은 울지 않으셨고, 또 각 아들이 황소처럼[b] 고문과 그 같은 학대를 바라보는 눈과 그들의 콧구멍이 죽음을 예고하는 것을[c] 보면서도 울지 않으셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 시작은 생략적입니다. 문맥상 어머니의 아들들을 가리키므로, 한국어에서는 ‘아들’을 보충했습니다.
    reason: source_note
  - marker: b
    text: ‘황소처럼’은 고문 앞에서도 굳세고 사납게 응시하는 모습을 나타내는 직유입니다.
    reason: cultural_note
  - marker: c
    text: ‘콧구멍이 죽음을 예고한다’는 표현은 죽음이 가까운 이들의 호흡과 몸의 징후를 생생하게 묘사한 것일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ τρίτος ἀποψύχων
  english_pob_choice: Nor, as a third son was breathing his last
  chosen_korean: 셋째가 숨을 거두는 중에도
  alternatives_korean:
