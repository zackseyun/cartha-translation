  rationale: αἰκισμός의 의미 영역은 학대·고문·고통을 포함하지만, 앞의 βασάνων과 겹쳐져 반복되는 잔혹함을 가리키므로 한국어에서는 ‘같은 고통’이 가장 무난하고 자연스럽습니다.
- source_word: τοὺς μυκτῆρας προσημειουμένους αὐτῶν τὸν θάνατον
  english_pob_choice: their nostrils foretelling death
  chosen_korean: 그들의 콧구멍이 죽음을 미리 알리는 것을
  alternatives_korean:
  - 그들의 콧구멍이 죽음을 예고하는 것을
  - 그들의 숨결이 죽음을 알리는 것을
  lexicon: LSJ
  rationale: μυκτῆρες는 코끝/콧구멍을 가리키고, προσημειόω는 미리 알리다, 예고하다의 뜻이므로 원문의 기이하고 육체적인 이미지를 최대한 보존했습니다.
theological_decisions:
- issue: 직유의 대상과 강도
  chosen_reading: ‘황소처럼’은 눈의 바라봄에 직접 연결해, 고문 앞에서도 흔들리지 않는 응시를 강조했습니다.
  alternative_readings:
  - 온몸의 태도에 넓게 적용할 수 있습니다.
  - ‘사납게’로 풀어 강도를 더할 수 있습니다.
  rationale: 문법상 직유는 가장 가까운 시각 동작에 붙는 것이 자연스러우며, 원문이 주는 대담한 수사 이미지를 약화시키지 않습니다.
  doctrine_reference: Translation philosophy §1, §6
