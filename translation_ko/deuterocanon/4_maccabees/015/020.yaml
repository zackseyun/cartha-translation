translation:
  language: ko
  text: 자녀들의 살 위에 자녀들의 살이 잘려 나가는 것을 보고, 손 위에 손이 잘려 나가는 것을 보고, 머리 위에 머리가 목 베여 떨어지는 것을 보고, 죽은 자들 위에 죽은 자들이 쓰러지는 것을 보고, 그리고 자녀들의 공동묘지를 보고…[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘목 베여 떨어지는’은 희귀 동사 ἀποδειροτομουμένας의 강한 폭력성을 살린 번역입니다. 더 일반적으로는 ‘머리가 잘려 나가는’ 정도로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: πολυάνδριον은 문자적으로 ‘많은 사람들의 무덤’으로, 여기서는 ‘공동묘지/집단묘지’의 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 이 절은 의도적으로 반복적이고 압축된 표현을 사용하므로, 한국어 번역도 그 효과를 보존했습니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπὶ σαρξὶν τέκνων ... σάρκας τέκνων ἀποκεκομμένας
  english_pob_choice: the flesh of her children cut off upon the flesh of her children
  chosen_korean: 자녀들의 살 위에 자녀들의 살이 잘려 나가는 것
  alternatives_korean:
  - 자녀들의 살 위에 자녀들의 살이 베여 떨어지는 것
  - 자녀들의 살 위에 자녀들의 살이 잘려 있는 것
  lexicon: σάρξ
  rationale: 원문의 반복과 충돌감을 살리기 위해 ‘살’을 그대로 두고, ἀποκεκομμένας의 완료 수동적 상태를 자연스럽게 ‘잘려 나가는 것’으로 옮겼습니다.
- source_word: ἀποτεμνομένας
  english_pob_choice: hands severed upon hands
  chosen_korean: 손 위에 손이 잘려 나가는 것
  alternatives_korean:
  - 손 위에 손이 절단되는 것
  - 손 위에 손이 베어지는 것
  lexicon: ἀποτέμνω
  rationale: 손이 서로 겹쳐 잘려 나가는 장면의 압박을 유지하기 위해 직역에 가깝게 옮겼습니다.
- source_word: ἀποδειροτομουμένας
  english_pob_choice: heads struck off upon heads
  chosen_korean: 머리 위에 머리가 목 베여 떨어지는 것
  alternatives_korean:
  - 머리 위에 머리가 잘려 나가는 것
  - 머리 위에 머리가 목이 잘리는 것
  lexicon: ἀποδειροτομέω
  rationale: 이 희귀하고 폭력적인 동사는 ‘목 베다/목을 베어 떨어뜨리다’의 뜻을 살리는 것이 적절하여, 머리 자체가 떨어지는 극적 이미지를 보존했습니다.
- source_word: πολυάνδριον
  english_pob_choice: a mass grave of her children
  chosen_korean: 자녀들의 공동묘지
  alternatives_korean:
  - 자녀들의 합장묘
  - 자녀들의 대묘지
  - 자녀들의 집단묘지
  lexicon: πολυάνδριον
  rationale: 원문의 ‘많은 이들의 무덤’이라는 의미를 담되, 한국어에서 가장 이해가 쉬운 ‘공동묘지’로 옮겼습니다.
