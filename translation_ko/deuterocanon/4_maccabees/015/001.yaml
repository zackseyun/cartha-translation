  rationale: εὐσέβεια는 이 문맥에서 하나님께 대한 충실한 경외와 경건을 가리키므로, 교회 전통과도 맞닿는 ‘경건’을 택했습니다.
- source_word: ποθεινοτέρα
  english_pob_choice: more longed-for
  chosen_korean: 더 간절히 바라는
  alternatives_korean:
