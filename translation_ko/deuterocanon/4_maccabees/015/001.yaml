  text: O reasoning[a], tyrant over the passions of children! And godliness is to a mother more longed-for than children.
  footnotes:
  - marker: a
    text: The Greek is highly compressed and rhetorically abrupt. The opening exclamation may also be rendered, 'O reason, tyrant over the passions,' with 'of children' taken differently in the line's syntax.
    reason: alternative_reading
  - marker: b
    text: Or 'piety is more desirable to a mother than children.'
    reason: lexical_alternative
translation:
  language: ko
  text: 오, 이성아, 자녀들의 정념들에 대한 폭군이여! 그리고 경건은 어머니에게 자녀들보다 더 간절히 바라는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 매우 압축된 수사이므로, ‘이성’은 문두 호격으로도, ‘정념들’의 지배자라는 핵심 개념으로도 읽힐 수 있습니다.
    reason: alternative_reading
