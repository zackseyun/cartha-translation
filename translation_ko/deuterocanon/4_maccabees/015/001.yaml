base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/001.yaml
  text: O reasoning[a], tyrant over the passions of children! And godliness is to a mother more longed-for than children.
  footnotes:
  - marker: a
    text: The Greek is highly compressed and rhetorically abrupt. The opening exclamation may also be rendered, 'O reason, tyrant over the passions,' with 'of children' taken differently in the line's syntax.
    reason: alternative_reading
  - marker: b
    text: Or 'piety is more desirable to a mother than children.'
    reason: lexical_alternative
translation:
  language: ko
  text: 오 이성이여, 자녀들의 정념을 지배하는 폭군이여! 또 경건은 어머니에게 자녀들보다 더 간절히 바라는 대상입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 매우 압축되고 수사적으로 급격합니다. 첫 구절은 ‘오 이성이여, 정념을 지배하는 폭군이여’로도 옮길 수 있으며, ‘자녀들의’가 ‘정념’과 맺는 정확한 관계는 다르게 분석될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: λογισμέ
  english_pob_choice: reasoning
  chosen_korean: 이성
  alternatives_korean:
  - reason
  - 사유
  - 판단
  lexicon: LSJ
  rationale: 4 Maccabees의 λογισμός는 감정을 제어하는 이성적 능력을 가리키므로, 현대 한국어에서 가장 자연스럽고 기능도 살아 있는 ‘이성’으로 옮겼습니다.
- source_word: τύραννε
  english_pob_choice: tyrant over
  chosen_korean: 폭군이여
  alternatives_korean:
  - 군주여
  - 지배자여
  - 폭군처럼 다스리는 이여
  lexicon: LSJ
  rationale: 직역하면 ‘폭군’이지만, 수사적 호격으로 쓰인 역설적 표현이므로 한국어에서도 감탄적 호격을 살려 ‘폭군이여’로 옮겼습니다.
- source_word: παθῶν
  english_pob_choice: passions
  chosen_korean: 정념들
  alternatives_korean:
  - 열정들
  - 욕정들
  - 감정들
  lexicon: LSJ
  rationale: 4 Maccabees의 πάθη는 단순 감정보다 통제해야 할 내적 정념을 뜻하므로, 철학적 색채를 살려 ‘정념들’로 번역했습니다.
- source_word: εὐσέβεια
  english_pob_choice: godliness
  chosen_korean: 경건
  alternatives_korean:
  - 하나님 경외
  - 경건함
  - 신앙
  lexicon: LSJ
  rationale: εὐσέβεια는 이 문맥에서 하나님께 대한 충실한 경외와 경건을 가리키므로, 교회 전통과도 맞닿는 ‘경건’을 택했습니다.
- source_word: ποθεινοτέρα
  english_pob_choice: more longed-for
  chosen_korean: 더 간절히 바라는
  alternatives_korean:
  - 더 갈망되는
  - 더 원하는
  - 더 소중한
  lexicon: LSJ
  rationale: 비교급의 욕구·갈망 뉘앙스를 살리기 위해 ‘더 간절히 바라는’으로 옮겨, 단순 가치평가보다 정서적 긴장을 드러냈습니다.
theological_decisions:
- issue: εὐσέβεια의 종교적 뉘앙스
  chosen_reading: 경건
  alternative_readings:
  - 하나님 경외
  - 경외심
  - 신앙
  rationale: 이 절은 자녀 사랑과 하나님께 대한 충실을 대비하므로, 추상적 교리 용어보다 하나님을 향한 삶의 태도를 드러내는 ‘경건’이 문맥에 가장 적합합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 6
- issue: 첫 절의 수사적 압축과 역설
  chosen_reading: ‘이성아, … 폭군이여!’로 감탄적 호격을 유지
  alternative_readings:
  - 의역하여 ‘이성은 정념을 다스리는 왕이다’로 풀어씀
  - 호격을 완화하여 평서문처럼 번역
  rationale: 원문은 매우 압축적이고 수사적으로 급격하므로, 의미를 매끈하게 풀어버리기보다 역설적 호격과 긴장을 유지하는 편이 저자의 의도를 더 잘 전달합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 3
