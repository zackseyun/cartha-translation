  - 사유
  - 판단
  lexicon: LSJ
  rationale: 4 Maccabees의 λογισμός는 감정을 제어하는 이성적 능력을 가리키므로, 현대 한국어에서 가장 자연스럽고 기능도 살아 있는 ‘이성’으로 옮겼습니다.
