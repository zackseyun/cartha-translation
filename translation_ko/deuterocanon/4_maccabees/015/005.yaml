  source_fidelity: 수정이 필요합니다. ἀσθενόψυχοι는 영적 상태를 특별히 뜻하지 않고 ‘마음/정신이 약한, 소심한’ 범위의 표현이므로 ‘영적으로’는 원문보다 신학적·종교적 의미를 더합니다. 또한 γὰρ의 설명적 접속을 ‘그런데’로 옮긴 것은 대조를 암시하므로 ‘왜냐하면’으로 바로잡는 것이 적절합니다. 비교 구조와 πολυγονώτεραι 및 φιλοτεκνώτεραι의 비교급은 수정문에서 보존됩니다.
  naturalness: ‘마음이 더 약하고 자녀가 더 많을수록, 자녀를 더욱 사랑합니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 원문의 비례적 비교를 명료하게 전달합니다. 기존의 ‘사랑하는 마음도 더 큽니다’도 뜻은 통하지만, 원문의 술어 ‘더 자녀를 사랑하다’에서 한 단계 추상화됩니다.
  terminology: ‘마음이 더 약한’은 ἀσθενόψυχοι의 넓은 의미 범위를 보존하며, ‘자녀를 더욱 사랑합니다’는 φιλοτεκνώτεραι의 비교급 애정을 직접적으로 옮깁니다. 특정 교리적 의미를 함축할 수 있는 ‘영적으로’는 피하는 편이 좋습니다.
  issues:
