  text: For the more mothers are weak in spirit and have more children[b][a], the more they are devoted to their children.
  footnotes:
  - marker: a
    text: Or 'fainthearted' for 'weak in spirit' (ἀσθενόψυχοι). The Greek speaks of weakness of soul/spirit, and the exact nuance may range from emotional frailty to lack of courage.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'more child-loving' for 'more devoted to their children' (φιλοτεκνώτεραι).
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 어머니들이 영적으로 더 약하고 자녀도 더 많을수록, 그만큼 자녀를 더 사랑하는 마음도 더 큽니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '영이 약한' 또는 '마음이 약한'에 가깝습니다. ἀσθενόψυχοι의 뉘앙스는 정서적 허약함에서 용기 부족까지 넓게 걸칠 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 '더 자녀를 사랑하는'입니다. φιλοτεκνώτεραι는 자녀에 대한 강한 애정을 나타냅니다.
    reason: lexical_alternative
