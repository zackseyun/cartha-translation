    rationale: γὰρ는 앞 진술의 이유 또는 설명을 도입합니다. ‘왜냐하면’이 이 기능을 더 충실히 반영합니다.
  - severity: low
    issue: ‘사랑하는 마음도 더 큽니다’는 원문의 직접 술어를 추상 명사 구문으로 바꿉니다.
