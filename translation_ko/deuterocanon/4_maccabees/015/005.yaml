  rationale: γὰρ의 설명적 연결을 ‘왜냐하면’으로 반영하고, ἀσθενόψυχοι를 종교적 의미로 한정하지 않도록 ‘마음이 더 약하고’로 수정했습니다. 상관 비교 구문(‘더 …할수록, 더욱 …하다’)과 두 비교급(‘더 약하고’, ‘더 많고’, ‘더욱 사랑하다’)은 유지했습니다. 각주 표지는 해당 어휘가 포함된 문장 끝에 함께 두어 현 구조의 표지 체계를 보존했습니다.
