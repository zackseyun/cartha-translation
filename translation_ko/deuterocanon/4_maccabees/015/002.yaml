translation:
  language: ko
  text: 한 어머니 앞에는 경건[a]과 폭군의 약속에 따른 일곱 아들의 일시적 안전[b], 이 두 가지가 놓여 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님을 향한 경외’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘일시적 구출’이나 ‘잠시의 구원’으로 옮길 수 있습니다. 여기서는 폭군의 제안 아래 잠시 생명이 보존되는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μήτηρ
  english_pob_choice: a mother
  chosen_korean: 한 어머니
  alternatives_korean:
  - 어머니
  - 그 어머니
  lexicon: LSJ
  rationale: 무관사 명사로 제시되는 인물을 한국어에서는 자연스럽게 ‘한 어머니’로 옮겨, 상황 속 주어를 간결하게 드러냈습니다.
- source_word: εὐσεβείας
  english_pob_choice: piety
  chosen_korean: 경건
  alternatives_korean:
  - 경외
  - 하나님을 향한 경건
  lexicon: LSJ
  rationale: εὐσέβεια의 핵심인 하나님을 향한 경외와 신앙적 충실을 한국어의 간결한 종교어휘 ‘경건’으로 살렸습니다.
- source_word: σωτηρίας προσκαίρου
  english_pob_choice: the temporary safety
  chosen_korean: 일시적 안전
  alternatives_korean:
  - 잠시의 구원
  - 일시적 구원
  - 잠깐의 구출
  lexicon: LSJ
  rationale: 여기서 σωτηρία는 종말론적 ‘구원’이 아니라 폭군의 제안 아래 목숨이 잠시 보존되는 뜻이므로, 신학적 오해를 피하는 ‘일시적 안전’이 적절합니다.
- source_word: κατὰ τὴν τοῦ τυράννου ὑπόσχεσιν
  english_pob_choice: according to the tyrant’s promise
  chosen_korean: 폭군의 약속에 따른
  alternatives_korean:
  - 폭군의 약속대로의
  - 폭군의 제안에 따른
  lexicon: LSJ
  rationale: κατά+대격의 기준/부합 의미를 살려 ‘약속에 따른’으로 옮겼고, ὑπόσχεσις는 직접적으로 ‘약속’으로 번역했습니다.
theological_decisions:
- issue: εὐσέβεια의 종교적 뉘앙스
  chosen_reading: 경건
  alternative_readings:
  - 하나님께 대한 경외
  - 경건함
  rationale: 이 장면은 순교적 충성과 관련되지만, 본문 자체는 외형적 경건보다 하나님께 대한 충실을 대비합니다. 한국어에서는 과도하게 교회화된 표현보다 ‘경건’이 가장 간결하게 대응합니다.
  doctrine_reference: Translation philosophy §§1, 6
- issue: σωτηρία의 비신학적 용례
  chosen_reading: 일시적 안전
  alternative_readings:
  - 일시적 구원
  - 잠시의 구출
  rationale: 본문의 대비는 영원한 구원이 아니라 폭군이 제공하는 잠시의 생명 보존입니다. 따라서 구원론적 함의를 불필요하게 불러오는 표현은 피했습니다.
  doctrine_reference: Translation philosophy §§1, 6
