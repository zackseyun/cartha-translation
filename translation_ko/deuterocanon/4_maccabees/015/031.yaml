translation:
  language: ko
  text: 이는 마치 노아의 방주가[a] 온 세상을 뒤덮은 홍수 속에서 떠밀려 가면서도 굳건히 물결을 견뎌 냈듯이,
  philosophy: optimal-equivalence
  footnotes:
