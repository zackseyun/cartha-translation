lexical_decisions:
- source_word: καθάπερ
  english_pob_choice: just as
  chosen_korean: 마치 …듯이
  alternatives_korean:
  - 그와 같이
  - 정녕 …처럼
  lexicon: LSJ
  rationale: 비교 구문을 자연스러운 한국어로 옮기되, 본문의 유비적 힘을 살리기 위해 ‘마치 …듯이’를 택했습니다.
- source_word: Νῶε κιβωτός
  english_pob_choice: Noah’s ark
  chosen_korean: 노아의 방주
  alternatives_korean:
  - 노아의 궤
  - 노아의 상자
  lexicon: LSJ
  rationale: 노아 문맥에서 κιβωτός는 통상적이고 정확한 대응어인 ‘방주’가 가장 직접적이며, 한국어 독자에게도 즉시 이해됩니다.
- source_word: κοσμοπληθεῖ κατακλυσμῷ
  english_pob_choice: world-filling flood
  chosen_korean: 온 세상을 뒤덮은 홍수
  alternatives_korean:
  - 세상을 가득 채운 홍수
  - 세계를 뒤덮은 홍수
  lexicon: LSJ
  rationale: κοσμοπληθεῖ의 전면적 범위를 ‘온 세상을 뒤덮은’으로 옮겨, 단순한 큰 홍수가 아니라 세계 전체를 휩쓴 재앙이라는 강도를 드러냈습니다.
- source_word: κοσμοφορουμένη καρτερῶς ὑπήνεγκεν τοὺς κλύδωνας
  english_pob_choice: being borne along ... steadfastly endured the waves
  chosen_korean: 떠밀려 가면서도 굳게 견뎌 물결을 이겨 냈듯이
  alternatives_korean:
  - 실려 가면서도 굳게 견뎌 파도를 견뎠듯이
  - 옮겨져 가면서도 끝내 파도를 버텼듯이
  lexicon: LSJ
  rationale: κοσμοφορουμένη의 수동적 이동을 ‘떠밀려 가면서도’로, καρτερῶς와 ὑπήνεγκεν의 인내를 ‘굳게 견뎌’로, κλύδωνας를 ‘물결’로 옮겨 역동성과 인내를 함께 살렸습니다.
theological_decisions:
- issue: 노아 홍수 이미지를 어떤 수준의 상징으로 유지할지
  chosen_reading: 노아의 방주가 홍수 속에서 견뎌 낸 역사적 비유로만 유지하고, 마티어·구원론적 상징을 본문 밖으로 확장하지 않았습니다.
  alternative_readings:
  - 순교자의 인내를 직접 예표하는 신학적 상징으로 강화
  - 세례나 구원의 모형으로 확장
  rationale: 본문은 비교문으로서 방주의 견딤을 제시할 뿐이므로, 주어진 문장 범위를 넘어선 교리적 확장을 피하는 것이 원문 충실성에 맞습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
