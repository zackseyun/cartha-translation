review_pass:
  verdict: revise
  source_fidelity: The comparison and Noah imagery are retained, but the draft omits the explanatory γάρ ('for'), and '물결을 이겨 냈듯이' somewhat shifts 'endured the waves' toward overcoming them. The revision retains the passive motion and endurance more directly.
  naturalness: The revised wording is natural modern formal Korean while appropriately preserving this verse's unfinished comparative clause.
  terminology: ‘노아의 방주,’ ‘홍수,’ and ‘물결’ are standard and suitable. ‘굳건히 … 견뎌 냈듯이’ conveys καρτερῶς ὑπήνεγκεν without unnecessary interpretive expansion.
  issues:
  - severity: medium
    issue: γάρ is not represented in the draft.
    rationale: καθάπερ γὰρ introduces an explanatory comparison, approximately ‘for/for just as.’ ‘그러므로’ means ‘therefore’ and changes the connective force; ‘이는’ supplies the explanatory connection naturally.
  - severity: low
    issue: ‘물결을 이겨 냈듯이’ is stronger than the Greek verb.
    rationale: ὑπήνεγκεν means bore/endured/withstood. ‘물결을 견뎌 냈듯이’ preserves endurance rather than suggesting victory over the waves.
  - severity: low
    issue: The footnote does not provide a sufficiently distinct, source-oriented alternative.
    rationale: The revision gives a concise alternative for the participial phrase, distinguishing ‘실려 가면서도’ from the main rendering ‘떠밀려 가면서도.’
  revised_text: 이는 마치 노아의 방주가[a] 온 세상을 뒤덮은 홍수 속에서 떠밀려 가면서도 굳건히 물결을 견뎌 냈듯이,
