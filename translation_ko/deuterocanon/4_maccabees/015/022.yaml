  yaml_path: translation/deuterocanon/4_maccabees/015/022.yaml
  text: How greatly and how many times, then, was the mother tortured with torments while her sons were being tortured with wheels and cauteries?
  footnotes:
  - marker: a
    text: Or 'was tormented by tortures.' The Greek repeats cognate forms of the same root for rhetorical force.
    reason: lexical_alternative
  - marker: b
    text: '''Cauteries'' refers to burning instruments; alternatively, ''hot irons'' or ''branding irons.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 아들의 고문을 받는 동안에도 어머니는 얼마나 크게, 얼마나 자주 고통을 당했습니까? 아들들은 바퀴와 화기로 고문을 받았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 βασαν- 어근을 반복하여 수사적 강도를 높입니다.
    reason: source_note
  - marker: b
    text: καυτηρίοις는 불에 달군 고문 도구를 가리킬 수 있으며, 경우에 따라 '달군 쇠'나 '브랜딩 철'로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πηλίκοις
  english_pob_choice: how greatly
  chosen_korean: 얼마나 크게
  alternatives_korean:
  - 얼마나 심하게
  - 얼마나 크게나
  lexicon: LSJ
  rationale: 의문/감탄형이 고통의 정도를 강조하므로, 한국어에서는 자연스럽게 강도를 드러내는 '얼마나 크게'로 옮겼습니다.
- source_word: πόσαις
  english_pob_choice: how many times
  chosen_korean: 얼마나 자주
  alternatives_korean:
  - 몇 번이나
  - 얼마나 여러 번
  lexicon: LSJ
  rationale: 반복성과 빈도를 묻는 표현이므로, 문맥의 수사적 질문에 맞게 '얼마나 자주'로 자연스럽게 옮겼습니다.
- source_word: βασανιζομένων / ἐβασανίζετο / βασάνοις
  english_pob_choice: were being tortured / was tortured / with torments
  chosen_korean: 고문을 받는 / 고통을 당했습니까 / 고문을 받았습니다
  alternatives_korean:
  - 고문당하는 / 고문당했습니까 / 고문과 함께
  lexicon: LSJ
  rationale: 동족어 반복이 주는 수사적 강도를 살리되 한국어에서는 같은 어근을 기계적으로 반복하기보다 '고문'과 '고통을 당하다'를 병행해 어감과 의미를 함께 보존했습니다.
- source_word: τροχοῖς τε καὶ καυτηρίοις
  english_pob_choice: with wheels and cauteries
  chosen_korean: 바퀴와 화기로
  alternatives_korean:
  - 바퀴와 cauteries로
  - 바퀴와 달군 쇠로
  lexicon: LSJ
  rationale: τροχοῖς는 직역해 '바퀴'로, καυτηρίοις는 번역어의 전문성을 살리되 한국어 가독성을 위해 '화기'로 옮겼습니다. 이는 원문의 구체적 고문 도구를 유지하면서도 지나치게 생소한 음역을 피합니다.
theological_decisions:
- issue: 어머니의 고통과 아들의 고문 도구의 관계
  chosen_reading: 아들의 고문 도구는 아들들에게 직접 연결하고, 어머니의 고통은 그 장면을 지켜보며 겪는 실제적이고 극심한 고통으로 제시했습니다.
  alternative_readings:
  - 어머니도 같은 도구로 물리적 고문을 받았다고 단정하기
  - 어머니의 고통을 단지 감정적 슬픔으로만 약화시키기
  rationale: 그리스어 문법은 '아들들이 바퀴와 화기로 고문을 받는 동안'이라는 배경 속에서 어머니의 고통을 말하므로, 과도한 구체화나 약화를 피하고 본문이 말하는 긴장을 그대로 두었습니다.
  doctrine_reference: 본문의 문법과 수사 반복을 우선하여 의미를 보존
