  rationale: 헬라어 어휘와 문맥상 ‘표/표결’의 이미지는 남기되, 자녀들을 대신한 대표적 선택이라는 의미가 핵심이므로 이를 본문에 자연스럽게 반영했습니다.
  doctrine_reference: translation philosophy §1, §3
