  rationale: 현재 분사로서 어머니가 두 ψῆφους를 손에 쥔 상태를 그리므로, ‘쥐고 있는’이 물리적 이미지를 가장 직접적으로 드러냅니다.
- source_word: θανατηφόρον
  english_pob_choice: deadly
  chosen_korean: 죽음을 가져오는
  alternatives_korean:
  - 치명적인
  - 죽음의
  - 죽음에 이르는
  lexicon: LSJ
  rationale: 형용사적 의미를 유지하면서 다음의 σωτήριον과 대조되는 기능을 분명하게 하기 위해, 결과를 풀어쓴 ‘죽음을 가져오는’으로 옮겼습니다.
- source_word: σωτήριον
  english_pob_choice: saving
  chosen_korean: 구원을 가져오는
  alternatives_korean:
  - 구원하는
  - 살리는
  - 구제하는
  lexicon: LSJ
  rationale: 이 문맥에서는 즉각적 대비가 핵심이므로, 신학 용어를 과하게 좁히지 않으면서도 긍정적 결과를 드러내는 ‘구원을 가져오는’이 적절합니다.
theological_decisions:
- issue: 두 개의 ψῆφοι가 가리키는 비유적 의미
  chosen_reading: 어머니가 자녀들을 위해 죽음과 구원 중 하나를 선택해야 하는 결정의 이미지로 읽었습니다.
  alternative_readings:
  - 단순히 두 표를 물리적으로 쥔 장면
  - 법정적 판결의 이미지
  rationale: 헬라어 어휘와 문맥상 ‘표/표결’의 이미지는 남기되, 자녀들을 대신한 대표적 선택이라는 의미가 핵심이므로 이를 본문에 자연스럽게 반영했습니다.
  doctrine_reference: translation philosophy §1, §3
