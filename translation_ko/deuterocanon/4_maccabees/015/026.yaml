  - 투표
  - 표결
  lexicon: LSJ
  rationale: ψῆφος는 원래 투표에 쓰는 돌에서 나온 말이어서, 한국어로는 현대 독자가 이해할 수 있으면서도 선택을 가리키는 구체성을 살리는 ‘표’가 가장 자연합니다.
