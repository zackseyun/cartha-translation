theological_decisions:
- issue: 두 개의 ψῆφοι가 가리키는 비유적 의미
  chosen_reading: 어머니가 자녀들을 위해 죽음과 구원 중 하나를 선택해야 하는 결정의 이미지로 읽었습니다.
  alternative_readings:
  - 단순히 두 표를 물리적으로 쥔 장면
