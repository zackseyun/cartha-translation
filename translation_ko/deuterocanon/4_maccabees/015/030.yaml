  yaml_path: translation/deuterocanon/4_maccabees/015/030.yaml
  text: O more noble than males in courage[a], and more manly than men in endurance.
  footnotes:
  - marker: a
    text: Or “more courageous than men in endurance.” The Greek says “more manly than men,” preserving a deliberate rhetorical play on male-coded virtue.
    reason: lexical_alternative
translation:
  language: ko
  text: 오, 용기에서는 남성들보다 더 고귀하고, 인내에서는 남자들보다 더 남자다운 분이여.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 첫 비교에 ἀρρένων(남성들)을, 둘째 비교에 ἀνδρῶν(남자들)과 ἀνδρειοτέρα(더 남자다운)를 사용하여 의도적인 수사적 말놀이를 이룹니다. ‘더 남자다운’은 ‘더 용감한’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρρένων
  english_pob_choice: males
  chosen_korean: 남자들
  alternatives_korean:
  - 수컷들
  - 남성들
  lexicon: LSJ
  rationale: ἀρρήν은 기본적으로 남성 성별을 가리키므로, 여기서는 ἀνδρῶν과의 의도적 대비를 살려 표준적인 ‘남자들’로 옮겼습니다.
- source_word: πρὸς καρτερίαν
  english_pob_choice: in courage
  chosen_korean: 용기에서는
  alternatives_korean:
  - 용기를 두고
  - 인내심에서는
  - 굳센 버팀에서는
  lexicon: LSJ
  rationale: καρτερία는 굳센 용기와 버팀을 함께 담는 말이므로, 비교의 기준을 자연스럽게 드러내는 ‘용기에서는’로 처리했습니다.
- source_word: γενναιοτέρα
  english_pob_choice: more noble
  chosen_korean: 더 고귀하고
  alternatives_korean:
  - 더 고상하고
  - 더 고귀한
  - 더 씩씩하고
  lexicon: LSJ
  rationale: γενναῖος의 비교급은 고귀함과 기개를 함께 가리킬 수 있어, 의미의 폭을 살리는 ‘더 고귀하고’가 적절합니다.
- source_word: ἀνδρῶν ... ἀνδρειοτέρα
  english_pob_choice: men ... more manly
  chosen_korean: 남자들보다 더 남자다운
  alternatives_korean:
  - 남자들보다 더 용감한
  - 남자들보다 더 사내다운
  lexicon: LSJ
  rationale: ἀνδρεῖος는 ‘남자다움/사내다움’의 어감을 지니므로, 반복되는 ἀνήρ 계열의 수사를 살리기 위해 직설적인 ‘남자다운’으로 옮겼습니다.
theological_decisions:
- issue: 성별 대비를 통한 수사적 역전 보존
  chosen_reading: ‘남자들보다 더 고귀하고… 남자들보다 더 남자다운’으로, 여성 인물을 남성적 덕목의 비교 기준보다 높게 세우는 대조를 그대로 유지했습니다.
  alternative_readings:
  - 성별 대조를 완화해 ‘누구보다 더 용감하고… 누구보다 더 인내하며’로 옮기는 방식
  rationale: 본문은 단순한 칭찬이 아니라 성별로 코딩된 덕목을 역전시키는 수사이므로, 이를 중화하면 원문의 힘이 약해집니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
