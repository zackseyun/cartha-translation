revisions:
- from: 그러나 그녀의 내장된 정서들은, 바로 그 고난들 속에서 경건한 이성에 의해 용감해져, 자녀에 대한 일시적인 애정을 지나가게 하려고 애썼습니다.[a][b]
  to: 그러나 경건한 이성[a]은 바로 그 고난들 속에서[b] 그녀의 심정을 굳세게 하여, 자녀를 향한 일시적인 애정을 외면하도록 힘썼습니다.
  rationale: 원문의 통사 관계를 회복하여 ‘경건한 이성’을 문장의 주어로 삼았습니다. σπλάγχνα의 관용적 의미는 ‘심정’으로 자연스럽게 옮기고, ἀνδρειώσας의 용기와 강화를 ‘굳세게 하여’로 반영했습니다. φιλοτεκνία와 πρόσκαιρον의 대비는 ‘자녀를 향한 일시적인 애정’으로 유지했으며, παροδεῖν은 ‘외면하다’로 정확하게 옮겼습니다. 각주 표지도 각각 ‘경건한 이성’과 ‘바로 그 고난들’에 직접 연결했습니다.
