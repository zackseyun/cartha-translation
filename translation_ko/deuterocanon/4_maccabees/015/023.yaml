base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/023.yaml
  text: But devout reason[a], strengthening her inward affections even in those very sufferings[b], strained to disregard her temporary love for her children.
  footnotes:
  - marker: a
    text: Or 'pious reason.' The Greek phrase is a key expression in 4 Maccabees for reason governed by reverence toward God.
    reason: lexical_alternative
  - marker: b
    text: Literally 'her temporary love of children' or 'transient maternal affection.' The text contrasts natural maternal attachment with steadfast fidelity under suffering.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그녀의 내장된 정서들은, 바로 그 고난들 속에서 경건한 이성에 의해 용감해져, 자녀에 대한 일시적인 애정을 지나가게 하려고 애썼습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '경건한 이성'. 이 표현은 4 마카베오서에서 하나님을 향한 경외로 규정된 이성을 가리키는 핵심 구입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 '그 고난들 가운데서'입니다. 여기서는 단순한 감정이 아니라 실제 고난 속에서의 인내를 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλάγχνα
  english_pob_choice: inward affections
  chosen_korean: 내장된 정서들
  alternatives_korean:
  - 마음의 깊은 애정
  - 속마음
  - 심정
  lexicon: LSJ
  rationale: σπλάγχνα의 문자적 뜻은 내장/창자이지만, 이 문맥에서는 감정과 애정을 가리키는 관용적 용법이므로, 몸의 이미지를 살리되 현대 한국어에서 이해 가능한 표현으로 옮겼습니다.
- source_word: εὐσεβὴς λογισμός
  english_pob_choice: devout reason
  chosen_korean: 경건한 이성
  alternatives_korean:
  - 경건한 이성적 판단
  - 신앙에 기초한 이성
  - 경건한 사고
  lexicon: LSJ
  rationale: 4 마카베오서의 핵심 표현으로, 하나님을 향한 경외에 의해 형성된 이성을 뜻하므로, 종교성과 이성성을 함께 드러내는 직역형을 택했습니다.
- source_word: ἐν αὐτοῖς τοῖς πάθεσιν
  english_pob_choice: in the midst of those very sufferings
  chosen_korean: 바로 그 고난들 속에서
  alternatives_korean:
  - 그 고난들 가운데서
  - 그 바로 그 고난들 안에서
  - 그 고난들 한복판에서
  lexicon: LSJ
  rationale: πάθη는 여기서 내적 정념이 아니라 고난/고통을 뜻하므로 고난으로 옮겼고, αὐτοῖς τοῖς의 강조를 '바로 그'로 반영했습니다.
- source_word: τὴν πρόσκαιρον φιλοτεκνίαν
  english_pob_choice: her temporary love for her children
  chosen_korean: 자녀에 대한 일시적인 애정
  alternatives_korean:
  - 자녀를 향한 덧없는 사랑
  - 일시적인 모성애
  - 자녀를 사랑하는 잠시의 마음
  lexicon: LSJ
  rationale: φιλοτεκνία는 자녀를 향한 애정을 뜻하지만, πρόσκαιρον이 덧없는 성격을 부각하므로 '일시적인 애정'으로 옮겨 원문의 대비를 보존했습니다.
- source_word: παροδεῖν
  english_pob_choice: to disregard
  chosen_korean: 지나가게 하려고 애썼습니다
  alternatives_korean:
  - 무시하려고 했습니다
  - 지나치려 했습니다
  - 못 본 체하려고 했습니다
  lexicon: LSJ
  rationale: παροδεῖν은 '지나쳐 버리다/간과하다'의 뜻이므로, 단순 무시보다 노력과 의지의 뉘앙스를 담는 표현으로 처리했습니다.
theological_decisions:
- issue: εὐσεβὴς λογισμός의 신학적 뉘앙스를 어떻게 살릴지
  chosen_reading: 경건한 이성으로 번역하여, 이성이 경외와 신실함에 의해 형성된다는 점을 드러냈습니다.
  alternative_readings:
  - 경건한 판단
  - 신앙적인 이성
  rationale: 이 문맥은 철학적 이성과 신앙의 긴장을 드러내므로, 어느 한쪽으로 평평하게 만들지 않고 두 요소를 함께 보존하는 것이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: original-language primacy; preserve theological tension rather than resolve it'
