  - severity: high
    issue: ‘지나가게 하려고’는 παροδεῖν의 의미를 정확히 전달하지 못합니다.
    rationale: παροδεῖν은 의도적으로 지나쳐 보다, 간과하다, 외면하다의 뜻입니다. 여기서는 자연적 모성애를 외면한다는 긴장된 행위를 가리킵니다.
  - severity: medium
    issue: 각주 a가 본문의 ‘경건한 이성’을 그대로 ‘또는’으로 반복합니다.
