  verdict: revise
  source_fidelity: 개정이 필요합니다. 원문에서 주어는 ‘경건한 이성’(ὁ εὐσεβὴς λογισμός)이며, 이것이 그녀의 깊은 감정(τὰ σπλάγχνα)을 굳세게 하여 자녀 사랑을 외면하도록 힘쓴다는 구조입니다. 초안의 ‘그녀의 내장된 정서들은 … 애썼습니다’는 주어와 행위 주체를 바꾸며, ‘내장된 정서’는 σπλάγχνα의 관용적 감정 의미를 현대 한국어로 부자연스럽게 처리합니다. ‘지나가게 하다’도 παροδεῖν(외면하다, 간과하다)의 뜻에 맞지 않습니다.
  naturalness: ‘심정’을 사용하고 문장 주어를 ‘경건한 이성’으로 분명히 하면 현대 표준어 합쇼체에서 자연스럽고 읽기 쉽습니다. ‘바로 그 고난들’은 원문의 강조를 잘 반영합니다.
  terminology: εὐσεβὴς λογισμός은 일관되게 ‘경건한 이성’으로 유지하되, 각주에서는 대안으로 ‘신심 깊은 이성’을 제시합니다. σπλάγχνα는 문자적 신체 기관이 아니라 깊은 감정·애정의 관용적 용법이므로 ‘심정’으로 옮깁니다. φιλοτεκνία는 ‘자녀를 향한 … 애정’으로, παροδεῖν은 ‘외면하다’로 옮깁니다.
  issues:
  - severity: high
    issue: 문장의 주어가 ‘경건한 이성’에서 ‘그녀의 내장된 정서들’로 바뀌었습니다.
    rationale: ὁ εὐσεβὴς λογισμός이 주어이고, ἀνδρειώσας는 그 이성이 σπλάγχνα를 굳세게 한 행위를 나타냅니다.
  - severity: medium
    issue: ‘내장된 정서들’은 σπλάγχνα의 한국어 번역으로 부자연스럽습니다.
