  source_fidelity: 수정이 필요합니다. οὕτως는 결론을 이끄는 ‘그러므로’가 아니라 앞선 비유를 이어 받는 ‘이와 같이/그처럼’입니다. 또한 ‘자식들의 고문’은 자녀가 고문을 가했다는 뜻으로도 읽힐 수 있으므로, τῶν υἱῶν βασάνοις가 가리키는 아들들이 당한 고문임을 한국어에서 밝혀야 합니다.
  naturalness: ‘정념의 홍수에 사방에서 에워싸이고’ 및 ‘아들들이 당한 고문이라는 거센 바람에 짓눌리면서도’는 원문의 중첩된 폭풍 비유를 보존하면서 현대 한국어로 자연스럽습니다. ‘경건의 폭풍’은 다소 문어적이지만 εὐσεβείας의 압축된 속격을 보존하는 데 적절합니다.
  terminology: ‘율법의 수호자’, ‘정념’, ‘경건’은 문맥과 핵심 어휘에 잘 맞습니다. πάθη는 이 저작의 철학적 용례를 고려해 ‘정념’으로 유지하되, 각주에서 ‘감정’을 대안으로 제시할 수 있습니다.
  issues:
