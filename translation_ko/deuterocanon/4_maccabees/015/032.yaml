base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/032.yaml
  text: So you also[a], guardian of the law, though surrounded on every side by the flood of passions and pressed by the fierce winds of your sons’ torments[b], bravely endured the storms of godliness.
  footnotes:
  - marker: a
    text: Or 'the flood of passions.' The Greek πάθη is a key term in 4 Maccabees for the passions or emotions that reason must master.
    reason: lexical_alternative
  - marker: b
    text: Or 'the storms of piety.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 너도, 율법의 수호자여, 사방에서 정념의 홍수에 둘러싸이고, 자식들의 고문이라는 거센 바람에 눌리면서도, 경건의 폭풍을 용감하게 견뎌 냈습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정념의 홍수’입니다. 여기서 πάθη는 4 마카베오스에서 이성이 다스려야 할 정념/감정의 핵심 용어입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘경건의 폭풍’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: νομοφύλαξ
  english_pob_choice: guardian of the law
  chosen_korean: 율법의 수호자
  alternatives_korean:
  - 율법을 지키는 자
  - 율법의 파수꾼
  lexicon: LSJ
  rationale: 복합어의 보호·수호 의미를 살리면서도 한국어에서 자연스럽게 들리는 명사구로 옮겼습니다.
- source_word: παθῶν
  english_pob_choice: passions
  chosen_korean: 정념
  alternatives_korean:
  - 감정
  - 열정
  - 수난
  lexicon: LSJ
  rationale: 4 마카베오스의 철학적 문맥에서 πάθη는 단순한 감정보다 이성에 의해 제어되어야 할 정념을 가리키므로, 그 긴장을 살리는 표현을 택했습니다.
- source_word: κατακλυσμῷ
  english_pob_choice: flood
  chosen_korean: 홍수
  alternatives_korean:
  - 범람
  - 큰 물결
  - 물살
  lexicon: LSJ
  rationale: 비유적 이미지가 강하므로, 압도적으로 밀려오는 흐름을 드러내는 ‘홍수’가 적합합니다.
- source_word: χειμῶνας
  english_pob_choice: storms
  chosen_korean: 폭풍
  alternatives_korean:
  - 겨울
  - 폭풍우
  - 태풍
  lexicon: LSJ
  rationale: 직역의 ‘겨울’보다 문맥의 시련 비유를 직접 드러내는 ‘폭풍’이 더 자연스럽고 이미지도 보존합니다.
theological_decisions:
- issue: εὐσεβείας의 한국어 신학적 뉘앙스
  chosen_reading: 경건
  alternative_readings:
  - 경외
  - 신앙심
  - 신실함
  rationale: 이 책에서 εὐσέβεια는 하나님께 대한 경건한 충성과 실천을 뜻하므로, 교회 전통에서 익숙하면서도 의미 범위가 넓은 ‘경건’으로 옮겼습니다.
  doctrine_reference: Translation philosophy §6
- issue: 마지막 구절의 칭찬 어조
  chosen_reading: 용감하게 견뎌 냈습니다
  alternative_readings:
  - 굳게 참아 냈습니다
  - 담대히 견뎠습니다
  rationale: 수사학적 찬탄을 현대 한국어의 공손한 서술로 살리되, 원문의 칭찬성과 지속적 인내를 분명히 드러내도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 6
