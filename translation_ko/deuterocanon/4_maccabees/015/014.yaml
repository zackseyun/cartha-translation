review_pass:
  verdict: revise
  source_fidelity: The draft conveys the distributive sequence, the mother's witnessing, torture and burning, and her steadfastness grounded in εὐσέβεια. However, “그녀는 … 그 어머니는” redundantly introduces the subject twice, and “불타는” can suggest that the victims themselves are burning rather than being burned.
  naturalness: A single, unambiguous subject and the passive expression “불에 타는” produce natural modern formal Korean. “마음을 바꾸지 않았습니다” idiomatically expresses οὐ μετεβάλετο without adding a specific doctrinal interpretation.
  terminology: “경건함” is an appropriate consistent rendering for εὐσέβεια in this context. The footnote should use modern “그리스어” and be anchored directly to “고문을 당하고,” the rendering of στρεβλούμενον.
  issues:
  - severity: medium
    issue: 'Redundant and syntactically awkward subject expression: “그녀는 … 그 어머니는.”'
    rationale: The Greek has one subject, ὁρῶσα μήτηρ (“the mother, watching”). Korean should likewise identify the mother once.
  - severity: low
    issue: “불타는” is less clearly passive than the Greek participle φλεγόμενον in this context.
    rationale: “불에 타는” naturally conveys that each person was being burned.
  - severity: low
    issue: Footnote wording and anchor need refinement.
    rationale: The note concerns στρεβλούμενον, so its marker should follow “고문을 당하고”; “그리스어” is standard modern Korean usage.
  revised_text: 어머니는 자녀들이 한 사람씩 고문을 당하고[a] 불에 타는 것을 보면서도, 경건함 때문에 마음을 바꾸지 않았습니다.
  revised_footnotes:
