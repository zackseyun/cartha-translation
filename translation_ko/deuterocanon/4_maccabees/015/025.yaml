lexical_decisions:
- source_word: καθάπερ γὰρ
  english_pob_choice: For just as
  chosen_korean: 마치 …처럼
  alternatives_korean:
  - 왜냐하면 …처럼
  - 그야말로 …처럼
  lexicon: LSJ
  rationale: 비교를 여는 καθάπερ의 힘을 살리면서 한국어에서는 유연한 비유 표지 ‘마치 …처럼’이 가장 자연스럽습니다.
- source_word: ἐν βουλευτηρίῳ
  english_pob_choice: as in a council chamber
  chosen_korean: 회의장 안에 있는 것처럼
  alternatives_korean:
  - 의회당 안에 있는 것처럼
  - 숙의실 안에 있는 것처럼
  lexicon: LSJ
  rationale: βουλευτήριον은 숙의와 자문이 이루어지는 장소이므로, 현대 독자가 바로 이해할 수 있는 ‘회의장’으로 옮기되 비유적 장면성을 유지했습니다.
- source_word: τῇ ἑαυτῆς ψυχῇ
  english_pob_choice: in her own soul
  chosen_korean: 자신의 영 안에서
  alternatives_korean:
  - 자신의 마음 안에서
  - 자기 내면 안에서
  lexicon: LSJ
  rationale: ψυχή의 내면적·인격적 무게를 살리기 위해 ‘영’으로 옮겼고, 단순한 심리 상태보다 내적 존재 전체의 긴장을 드러내도록 했습니다.
- source_word: φιλοτεκνίαν
  english_pob_choice: love for her children
  chosen_korean: 자녀에 대한 사랑
  alternatives_korean:
  - 자녀 사랑
  - 아이들에 대한 애정
  lexicon: LSJ
  rationale: φιλοτεκνία는 자녀를 향한 사랑을 뜻하므로, 성별을 미리 덧씌우는 표현보다 원문의 일반적 의미를 직접 반영한 ‘자녀에 대한 사랑’이 적절합니다.
- source_word: τέκνων στρέβλαν
  english_pob_choice: the torture of her children
  chosen_korean: 자녀의 고통
  alternatives_korean:
  - 자녀의 고문
  - 자녀의 심한 고통
  lexicon: LSJ
  rationale: στρέβλα는 문맥상 고문 도구를 가리키지만 여기서는 자녀들이 겪는 고통을 가리키는 환유이므로, 본문 의미를 자연스럽게 드러내는 ‘자녀의 고통’으로 옮겼습니다.
theological_decisions:
- issue: ψυχή의 인격적 중심성
  chosen_reading: ‘영’으로 옮겨, 그녀의 내면에서 서로 충돌하는 힘들이 조언자들처럼 작용하는 심리·신학적 긴장을 보존했습니다.
  alternative_readings:
  - ‘마음’으로 옮겨 심리적 중심을 강조
  - ‘혼’으로 옮겨 전통적 종교어를 사용
  rationale: 이 절은 감정 묘사만이 아니라 내적 결단의 장을 보여 주므로, ψυχή를 단순 심리로 축소하지 않는 번역이 필요합니다.
  doctrine_reference: 인간론
