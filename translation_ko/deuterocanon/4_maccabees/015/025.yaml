  text: 그녀는 마치 자신의 영 안에서, 회의장 안에 있는 것처럼 두려운 조언자들—자연과 출생과 자녀에 대한 사랑과 자녀의 고통—을 보았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
