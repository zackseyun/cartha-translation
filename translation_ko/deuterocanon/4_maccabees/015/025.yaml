  source_fidelity: 개정이 필요합니다. τῇ ἑαυτῆς ψυχῇ는 여기서 숙의가 이루어지는 내적 장을 가리키므로 ‘자신의 영’보다 ‘자신의 내면’이 의미를 과도하게 신학화하지 않으면서 자연스럽습니다. γένεσις는 이 어머니의 맥락에서 단순한 ‘출생’보다 ‘출산’이 적절합니다. στρέβλα는 고문대/형틀을 뜻하며 자녀들이 받는 고문을 환유적으로 나타내므로, ‘고통’은 고문의 구체성을 약화합니다.
  naturalness: ‘자신의 내면이라는 회의장에서’은 원문의 숙의 장소 비유를 한국어에서 자연스럽게 재현합니다. ‘왜냐하면’과 ‘마치 … 듯했습니다’는 γάρ와 καθάπερ의 연결·비교 기능을 살리며, 본문 끝의 긴 대시는 다음 절로 이어지는 미완의 비교 구조를 보존합니다.
