  rationale: μᾶλλον의 비교 의미를 '더'로 살리고, ἠγάπησεν은 의미를 약화하지 않도록 '사랑하다'로 옮겼습니다.
- source_word: τὴν σώζουσαν
  english_pob_choice: which saves
  chosen_korean: 그것은 ... 이르게 하는 것이며
  alternatives_korean:
  - 그것은 ... 구원하는 것이며
