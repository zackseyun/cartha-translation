  lexicon: BDAG
  rationale: 현재분사 σώζουσαν의 속성적 의미를 한국어에서 자연스럽게 드러내기 위해, 뒤따르는 설명절을 붙여 '이르게 하는'으로 풀어 옮겼습니다.
- source_word: κατὰ θεόν
  english_pob_choice: according to God
  chosen_korean: 하나님에 따라
  alternatives_korean:
  - 하나님을 따라
  - 하나님의 뜻에 따라
  - 하나님께 합당하게
  lexicon: LSJ
  rationale: κατὰ θεόν의 압축된 표현을 너무 해석하지 않고, 하나님을 기준으로/따라라는 방향성을 살려 직역성 있게 옮겼습니다.
