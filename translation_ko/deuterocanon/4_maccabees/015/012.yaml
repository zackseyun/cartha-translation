  text: But the mother urged each son individually[a], and all of them together[b], toward death for the sake of godliness.
  footnotes:
  - marker: a
    text: Or 'one by one ... all together.' The Greek contrasts the mother's exhortation to each son individually with her exhortation to all of them as a group.
    reason: lexical_alternative
  - marker: b
    text: Or 'toward a death of godliness,' that is, death endured for the sake of piety or reverence toward God.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 어머니는 한 아이씩도, 또한 모두 함께도 경건의 죽음을 향하여 그들을 재촉하셨습니다.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 ‘한 사람씩 … 모두 함께’입니다. 그리스어는 어머니가 각 아들에게 개별적으로 한 권면과, 그들 모두에게 집단적으로 한 권면을 대비합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘경건의 죽음을 향하여’입니다. 곧 하나님을 향한 경외와 경건을 위해 감수하는 죽음이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθʼ ἕνα παῖδα
  english_pob_choice: each son individually
  chosen_korean: 한 아이씩도
  alternatives_korean:
  - 한 사람씩도
  - 각 아들마다
  - 하나씩 따로
  lexicon: καθʼ ἕνα + παῖς
  rationale: 각 개체를 따로 향한 행동임을 살리기 위해 ‘한 아이씩도’로 옮기고, 뒤의 ‘모두 함께도’와 대구를 이루게 했습니다.
- source_word: ὁμοῦ πάντας
  english_pob_choice: all of them together
  chosen_korean: 또한 모두 함께도
  alternatives_korean:
  - 그리고 모두 함께도
  - 한꺼번에 모두
  - 다 함께도
  lexicon: ὁμοῦ + πᾶς
  rationale: 개별 권면과 집단 권면의 대비를 선명히 드러내기 위해 ‘또한 … 함께도’로 처리했습니다.
- source_word: προέτρεπεν
  english_pob_choice: urged
  chosen_korean: 재촉하셨습니다
  alternatives_korean:
  - 권면하셨습니다
  - 독려하셨습니다
  - 부추기셨습니다
  lexicon: προτρέπω
  rationale: 단순한 설득보다 목표를 향해 강하게 밀어붙이는 뉘앙스를 살리되, 부정적 뉘앙스가 과도한 ‘부추기다’는 피했습니다.
- source_word: τὸν τῆς εὐσεβείας θάνατον
  english_pob_choice: death for the sake of godliness
  chosen_korean: 경건의 죽음
  alternatives_korean:
  - 경건을 위한 죽음
  - 경건을 위한 죽음에
  - 경건을 위한 순교의 죽음
  lexicon: εὐσέβεια
  rationale: 원문의 속격 결합을 직역해 ‘경건의 죽음’으로 두어, 죽음이 경건과 결합된 수식 구조를 유지했습니다.
theological_decisions:
- issue: 죽음의 성격을 지나치게 해석할지 여부
  chosen_reading: 본문 자체가 말하는 ‘경건의 죽음’이라는 표현을 유지했습니다.
  alternative_readings:
  - ‘경건을 위한 죽음’처럼 목적어를 분명히 하는 번역
  - ‘순교의 죽음’으로 신학적으로 풀어쓴 번역
  rationale: 4마카베오의 문맥상 순교를 가리키더라도, 이 절은 설명보다 원문의 압축된 표현을 보존하는 것이 더 적절합니다.
  doctrine_reference: 문맥적 순교 이해
