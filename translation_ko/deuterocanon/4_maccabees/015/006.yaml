  to: 그러나 모든 어머니 가운데서 그 일곱의 어머니는 자녀를 가장 사랑하는 어머니가 되었으니, 그녀는 일곱 번 임신함으로써 그들을 향한 다정한 애정이 자기 안에 깊이 심겨진 어머니였습니다.[a]
  rationale: 원문의 ‘모든 어머니 가운데서’라는 비교 범위, ‘일곱의 어머니’라는 표현, 일곱 번의 임신, 애정이 심겨지는 비유를 유지했습니다. 동시에 중복된 서술 구조를 제거하고 관계절을 자연스러운 합쇼체 문장으로 풀었습니다.
