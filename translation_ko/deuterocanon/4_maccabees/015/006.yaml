translation:
  language: ko
  text: 그런데 모든 어머니들 가운데서, 일곱의 어머니는 자기 자녀들을 가장 사랑하는 이가 되었으니, 곧 일곱 번의 임신을 통해 그들에게 대한 자신의 다정한 애정이 자기 안에 깊이 심겨졌던 그 사람이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
