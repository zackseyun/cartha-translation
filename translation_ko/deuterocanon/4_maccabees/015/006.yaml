    text: 직역하면 ‘일곱의 어머니’입니다. 문맥상 그 일곱은 그녀의 아들들입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλοτεκνωτέρα
  english_pob_choice: the most devoted to her children
  chosen_korean: 자기 자녀들을 가장 사랑하는 이
  alternatives_korean:
  - 자녀들에게 가장 애정이 깊은 이
  - 자녀들을 가장 헌신적으로 사랑하는 이
  - 자녀들을 가장 아끼는 이
  lexicon: LSJ
  rationale: 비교급/최상급 뉘앙스를 살리면서, ‘자녀를 향한 특별한 애정’을 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: ἡ τῶν ἑπτὰ μήτηρ
  english_pob_choice: the mother of the seven
  chosen_korean: 일곱의 어머니
  alternatives_korean:
  - 일곱 아들의 어머니
  - 일곱 형제의 어머니
  lexicon: LSJ
  rationale: 그리스어는 문자적으로 ‘일곱의 어머니’라고 말하므로 이를 유지하되, 문맥상 자녀들이 아들임은 주석으로 처리했습니다.
- source_word: κυοφορίαις
  english_pob_choice: through seven pregnancies
  chosen_korean: 일곱 번의 임신을 통해
  alternatives_korean:
  - 일곱 번의 잉태를 통해
  - 일곱 번의 태중 기간을 통해
  - 일곱 아이를 낳는 과정을 통해
  lexicon: LSJ
  rationale: κυοφορία는 임신/잉태의 과정을 가리키므로, 구체적이고 직설적인 ‘임신’을 택해 본문의 모성 경험을 살렸습니다.
- source_word: φιλοστοργίαν / ἐπιφυτευομένην
  english_pob_choice: had her affection for them deeply planted within her
  chosen_korean: 그들에게 대한 자신의 다정한 애정이 자기 안에 깊이 심겨졌던
  alternatives_korean:
  - 그들에 대한 자신의 친밀한 사랑이 자기 안에 깊이 뿌리내렸던
  - 그들을 향한 자신의 가족애가 자기 안에 깊이 심어진
  lexicon: LSJ
  rationale: φιλοστοργία의 ‘가족적/친족적 애정’을 ‘다정한 애정’으로 옮기고, ἐπιφυτευομένην의 심기 비유를 ‘깊이 심겨졌던’으로 보존했습니다.
