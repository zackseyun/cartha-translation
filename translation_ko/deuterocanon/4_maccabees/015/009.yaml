  alternatives_korean:
  - 고결함
  - 덕성
  - 고귀함
  lexicon: LSJ
  rationale: 이 말은 단순한 내적 선함보다 도덕적 탁월성과 품위가 함께 드러나는 말이므로, 문맥상 자연스럽게 보이는 '고귀한 품성'으로 옮겼습니다.
- source_word: εὐπείθειαν
  english_pob_choice: obedience
  chosen_korean: 순종
  alternatives_korean:
  - 복종
  - 잘 따름
  - 응함
  lexicon: LSJ
  rationale: πρὸς τὸν νόμον αὐτῶν과 결합해 자발적으로 법에 응답하는 뜻이므로, 한국어 성경에서 널리 쓰이는 '순종'이 가장 직접적입니다.
- source_word: φιλοστοργίαν
  english_pob_choice: motherly affection
  chosen_korean: 어머니의 사랑
  alternatives_korean:
