lexical_decisions:
- source_word: οὐ μὴν δέ, ἀλλὰ καὶ
  english_pob_choice: And not only that, but
  chosen_korean: 그리고 그것만이 아니라
  alternatives_korean:
  - 그뿐 아니라
  - 뿐만 아니라
  - 그런데도
  lexicon: LSJ
  rationale: 단순한 역접보다 내용을 덧붙이는 누적적 전개이므로, 한국어에서는 앞 절을 이어 받으며 강조를 더하는 표현으로 옮겼습니다.
- source_word: καλοκἀγαθίαν
  english_pob_choice: nobility
