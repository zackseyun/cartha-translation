  - 가족애
  - 정다운 사랑
  lexicon: LSJ
  rationale: 그리스어 자체는 가족적 애정을 가리키지만, 여기서는 화자가 어머니이고 대상이 아들이므로 모성적 뉘앙스를 분명히 살려 '어머니의 사랑'으로 번역했습니다.
