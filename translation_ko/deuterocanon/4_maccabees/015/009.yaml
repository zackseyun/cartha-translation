  text: And not only that, but because of the nobility of her sons and their obedience to the law, she had an even greater motherly affection for them.
translation:
  language: ko
  text: 그리고 그뿐 아니라, 아들들의 고귀한 품성과 그들이 율법에 순종한 것 때문에, 그녀는 그들에 대한 어머니로서의 사랑을 더욱 크게 품고 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ μὴν δέ, ἀλλὰ καὶ
  english_pob_choice: And not only that, but
  chosen_korean: 그리고 그것만이 아니라
  alternatives_korean:
  - 그뿐 아니라
  - 뿐만 아니라
  - 그런데도
  lexicon: LSJ
  rationale: 단순한 역접보다 내용을 덧붙이는 누적적 전개이므로, 한국어에서는 앞 절을 이어 받으며 강조를 더하는 표현으로 옮겼습니다.
- source_word: καλοκἀγαθίαν
  english_pob_choice: nobility
  chosen_korean: 고귀한 품성
  alternatives_korean:
  - 고결함
  - 덕성
  - 고귀함
  lexicon: LSJ
  rationale: 이 말은 단순한 내적 선함보다 도덕적 탁월성과 품위가 함께 드러나는 말이므로, 문맥상 자연스럽게 보이는 '고귀한 품성'으로 옮겼습니다.
- source_word: εὐπείθειαν
  english_pob_choice: obedience
  chosen_korean: 순종
  alternatives_korean:
  - 복종
  - 잘 따름
  - 응함
  lexicon: LSJ
  rationale: πρὸς τὸν νόμον αὐτῶν과 결합해 자발적으로 법에 응답하는 뜻이므로, 한국어 성경에서 널리 쓰이는 '순종'이 가장 직접적입니다.
- source_word: φιλοστοργίαν
  english_pob_choice: motherly affection
  chosen_korean: 어머니의 사랑
  alternatives_korean:
  - 모성의 사랑
  - 가족애
  - 정다운 사랑
  lexicon: LSJ
  rationale: 그리스어 자체는 가족적 애정을 가리키지만, 여기서는 화자가 어머니이고 대상이 아들이므로 모성적 뉘앙스를 분명히 살려 '어머니의 사랑'으로 번역했습니다.
theological_decisions:
- issue: νόμος의 지시 범위
  chosen_reading: '''그들의 율법''으로 번역해 유대인의 전승적 율법을 가리키는 문맥을 드러냈습니다.'
  alternative_readings:
  - 법
  - 교훈
  rationale: 문맥상 일반적 법률이 아니라 유대인의 규범적 토라를 가리키므로, 독자가 오해하지 않도록 '율법'을 유지했습니다.
  doctrine_reference: 유대교/4마카베오 문맥의 토라 이해
