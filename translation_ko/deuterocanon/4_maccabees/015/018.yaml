translation:
  language: ko
  text: 오, 오직 한 여성아, 온전한 경건을 낳아 주신 분이시여.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “오직 한 여성,” “홀로인 여성.” 그리스어는 이 여인이 여성들 가운데서 유일무이하다는 점을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “경건.” 그리스어 εὐσέβεια는 4 마카베오스에서 하나님께 대한 충실한 경건을 가리키는 핵심어입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὦ μόνη γύναι
  english_pob_choice: O only woman
  chosen_korean: 오, 오직 한 여성아
  alternatives_korean:
  - 오, 유일한 여성아
  - 오, 홀로인 여성아
  - 오직 그 한 여성아
  lexicon: LSJ
  rationale: 감탄사 ὦ와 호격 μόνη γύναι의 높고 수사적인 직접 호칭을 살리되, 현대 한국어에서는 “여성”이 가장 중립적이고 직접적인 호격 표현입니다. “오직 한”으로 μοναδικό함을 드러냈습니다.
- source_word: τὴν εὐσέβειαν
  english_pob_choice: godliness
  chosen_korean: 경건을
  alternatives_korean:
  - 경외를
  - 신앙심을
  - 하나님께 대한 경건을
  lexicon: LSJ
  rationale: 4 마카베오스에서 εὐσέβεια는 단순한 종교심보다 하나님께 대한 충실한 경건을 뜻하므로, 한국어 교회 전통과도 연결되는 “경건”을 택했습니다. 문맥상 목적어로도 자연스럽습니다.
- source_word: ὁλόκληρον
  english_pob_choice: in its fullness
  chosen_korean: 온전한
  alternatives_korean:
  - 완전한
  - 온전히 갖추어진
  - 전체적인
  lexicon: LSJ
  rationale: ὁλόκληρον은 분열되지 않은 완전성, 흠 없는 전체성을 가리키므로 “온전한”이 가장 압축적이면서도 의미를 보존합니다.
- source_word: ἀποκυήσασα
  english_pob_choice: gave birth to
  chosen_korean: 낳아 주신
  alternatives_korean:
  - 출산하신
  - 낳으신
  - 세상에 내신
  lexicon: LSJ
  rationale: 본문의 출산 은유를 그대로 살리기 위해 “낳다”를 유지했습니다. 종결 호격과 결합할 때 한국어에서는 공경의 뉘앙스를 위해 “낳아 주신”이 자연스럽습니다.
theological_decisions:
- issue: 경건(εὐσέβεια)을 추상화된 도덕성으로 약화시킬지 여부
  chosen_reading: “온전한 경건”으로 옮겨 하나님께 향한 충실성과 실천적 신앙의 무게를 유지했습니다.
  alternative_readings:
  - 온전한 신앙심
  - 완전한 경외심
  - 완전한 신실함
  rationale: 4 마카베오스의 εὐσέβεια는 단순한 내면 감정이 아니라 하나님께 대한 공적 충실성을 뜻하므로, 한국어의 “경건”이 가장 직접적으로 대응합니다.
  doctrine_reference: 4 Maccabees의 εὐσέβεια 용례; 번역 철학의 source-direct 원칙
- issue: 출산 은유를 완화할지 여부
  chosen_reading: “낳아 주신”으로 출산 이미지를 보존했습니다.
  alternative_readings:
  - 이끌어 내신
  - 드러내신
  - 낳으신
  rationale: 본문은 어머니를 통해 경건이 ‘출생’한 것처럼 말하는 수사적 장치가 핵심이므로, 이를 추상화하지 않고 유지해야 문맥의 힘이 살아납니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
