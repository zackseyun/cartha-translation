    text: 또는 “오직 한 여인”, “여인들 가운데 홀로 선 이.” 그리스어는 이 여인이 이러한 경건을 드러낸 여성들 가운데 유일무이함을 강조합니다.
    reason: lexical_alternative
  - marker: b
