  text: O sacred nature[a], and the affections of parents, and filial love toward parents, and nurture[b], and the unconquerable passions of mothers.
  footnotes:
  - marker: a
    text: Or 'the natural bond' for 'nature'; the Greek φύσις can point either to nature itself or to the natural order embodied in family affection.
