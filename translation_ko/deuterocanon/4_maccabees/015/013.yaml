  lexicon: LSJ
  rationale: πάθη는 단순한 욕망이 아니라 강렬한 정서와 충동을 가리킬 수 있으므로, 문맥에 맞게 ‘격정’으로 살리고 ‘정복되지 않는’으로 ἀδάμαστα의 강도를 보존했습니다.
