  yaml_path: translation/deuterocanon/4_maccabees/015/013.yaml
  text: O sacred nature[a], and the affections of parents, and filial love toward parents, and nurture[b], and the unconquerable passions of mothers.
  footnotes:
  - marker: a
    text: Or 'the natural bond' for 'nature'; the Greek φύσις can point either to nature itself or to the natural order embodied in family affection.
    reason: lexical_alternative
  - marker: b
    text: '''Passions'' here means powerful affections or emotions, not necessarily disordered desires.'
    reason: lexical_alternative
translation:
  language: ko
  text: 오, 거룩한 본성[a]이여, 부모의 애정과 부모를 향한 자녀의 사랑, 양육[b], 그리고 어머니들의 정복되지 않는 격정이여.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자연의 결속’. φύσις는 여기서 자연 자체를 가리키기보다 가족 애정으로 구현된 자연 질서를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘양육’은 단순한 양식 공급이 아니라 아이를 길러 내는 돌봄과 upbringing 전체를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: φύσις
  english_pob_choice: nature
  chosen_korean: 본성
  alternatives_korean:
  - 자연
  - 자연의 질서
  - 천성
  lexicon: LSJ
  rationale: 여기서는 가족 관계의 자연스러운 질서를 가리키는 높임의 탄식이므로, ‘본성’이 ‘nature’의 직접성을 살리면서도 문맥의 품위를 유지합니다.
- source_word: ἱερά
  english_pob_choice: sacred
  chosen_korean: 거룩한
  alternatives_korean:
  - 신성한
  - 거룩하신
  - 성스러운
  lexicon: LSJ
  rationale: 수식어로서 φύσις를 높이는 표현이므로, 한국어에서는 ‘거룩한’이 예배용 문체보다 지나친 교리적 뉘앙스를 덜고도 POB의 ‘sacred’를 잘 반영합니다.
- source_word: φίλτρα γονέων
  english_pob_choice: the affections of parents
  chosen_korean: 부모의 애정
  alternatives_korean:
  - 부모의 사랑
  - 부모의 정
  - 부모의 애착
  lexicon: LSJ
  rationale: φίλτρα는 친밀한 정과 애정을 가리키므로, ‘애정’이 마술적 뉘앙스를 피하면서도 부모의 정서적 유대를 자연스럽게 드러냅니다.
- source_word: γονεύσιν φιλοστόργε
  english_pob_choice: filial love toward parents
  chosen_korean: 부모를 향한 자녀의 사랑
  alternatives_korean:
  - 부모를 향한 효성
  - 부모를 사랑하는 사랑
  - 자녀의 다정한 사랑
  lexicon: LSJ
  rationale: φιλοστόργε는 혈연적 친애를 뜻하고 여기에 주어가 되는 관계가 부모를 향한 자녀의 정서이므로, ‘자녀의 사랑’으로 방향성을 분명히 했습니다.
- source_word: τροφεῖα
  english_pob_choice: nurture
  chosen_korean: 양육
  alternatives_korean:
  - 기르심
  - 길러 줌
  - 기육
  lexicon: LSJ
  rationale: 이 단어는 아이를 길러 내는 행위 전반을 뜻하므로, 현대 한국어에서 가장 자연스럽고 포괄적인 ‘양육’이 적절합니다.
- source_word: ἀδάμαστα πάθη
  english_pob_choice: the unconquerable passions of mothers
  chosen_korean: 정복되지 않는 격정
  alternatives_korean:
  - 길들일 수 없는 정열
  - 굴복하지 않는 감정
  - 억누를 수 없는 정념
  lexicon: LSJ
  rationale: πάθη는 단순한 욕망이 아니라 강렬한 정서와 충동을 가리킬 수 있으므로, 문맥에 맞게 ‘격정’으로 살리고 ‘정복되지 않는’으로 ἀδάμαστα의 강도를 보존했습니다.
theological_decisions:
- issue: 이 절의 전반적 어조를 신학적 진술로 볼지, 가족 사랑의 수사를 찬탄하는 탄식으로 볼지
  chosen_reading: 가족 결속의 거룩함과 강도를 높여 부르는 수사적 탄식으로 보았습니다.
  alternative_readings:
  - 부모와 자녀의 본성을 예찬하는 일반적 선언
  - 도덕적 교훈을 직접 제시하는 진술
  rationale: Ὦ와 나열된 호격적 구조가 교리 명제보다 감탄문에 가깝기 때문에, 한국어도 탄식의 형식을 살려 의미의 무게를 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
