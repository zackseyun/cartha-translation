translation:
  language: ko
  text: 오, 성스러운 자연[a]이여, 부모의 애정이여, 부모를 향한 자녀의 사랑이여, 양육이여, 어머니들의 억누를 수 없는 격정[b]이여.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자연의 결속’. φύσις는 자연 자체를 가리킬 수도 있고, 가족 애정으로 드러나는 자연 질서를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘격정’은 반드시 무질서한 욕망을 뜻하는 것이 아니라, 강렬한 애정이나 감정을 가리킵니다.
    reason: lexical_alternative
