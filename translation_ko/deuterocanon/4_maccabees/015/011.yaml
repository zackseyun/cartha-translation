  rationale: 이 문맥은 정념보다 이성이 우월하다는 4마카베오의 주제를 강조하므로, ‘이성’이 그 철학적 핵심을 가장 직접적으로 드러냅니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 5
