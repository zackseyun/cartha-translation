    rationale: συμπάθεια는 여기서 어머니가 자녀들에게 느끼도록 이끌리는 연민을 뜻하므로 「연민」이 더 자연스럽습니다. μετατρέψαι는 판단을 ‘바꾸다/돌이키다’라는 뜻이며 「돌려놓다」는 한국어에서 부자연스럽습니다.
  - severity: medium
