  text: Nevertheless[a], although so many impulses of motherly affection were drawing the mother toward sympathy, the all-varied tortures were not able, by any of them, to turn aside her reason.
  footnotes:
  - marker: a
    text: Or 'her rational judgment'; the Greek term highlights the faculty of reason, a major theme in 4 Maccabees.
    reason: lexical_alternative
translation:
  language: ko
  text: 그럼에도 자녀에 대한 사랑과 관련된 수많은 것들이 어머니를 연민으로 끌어당기고 있었지만, 온갖 고문도 그 어느 경우에도 그녀의 이성적 판단을 바꾸어 놓을 수 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀의 이성’. 여기서 그리스어 λογισμός는 이성의 기능 또는 이성적 판단을 강조하며, 4마카베오의 중요한 주제입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλʼ ὅμως
  english_pob_choice: Nevertheless
  chosen_korean: 그러나 그럼에도
  alternatives_korean:
  - 그럼에도
  - 그렇지만 그럼에도
  lexicon: LSJ
  rationale: 강한 양보 전환을 나타내므로, 앞뒤 대비를 선명하게 살리는 「그러나 그럼에도」로 옮겼습니다.
- source_word: τοσούτων ὄντων τῶν περὶ φιλοτεκνίαν
  english_pob_choice: although so many impulses of motherly affection
  chosen_korean: 자식에 대한 사랑이 많은 것들이
  alternatives_korean:
  - 어머니의 자식 사랑을 향한 많은 충동들이
  - 모성애로 이끄는 많은 것들이
  lexicon: LSJ
  rationale: φιλοτεκνία는 자녀에 대한 애착을 가리키며, 문맥상 어머니를 흔드는 감정적 동인을 뜻하므로 직역보다 의미를 살려 표현했습니다.
- source_word: εἰς συμπάθειαν ἑλκόντων
  english_pob_choice: were drawing ... toward sympathy
  chosen_korean: 동정으로 이끌고 있었지만
  alternatives_korean:
  - 연민으로 끌어당기고 있었지만
  - 공감 쪽으로 이끌고 있었지만
  lexicon: LSJ
  rationale: ἕλκω의 ‘끌다’와 συμπάθεια의 ‘함께 느끼는 마음’을 살려, 자연스러운 한국어로 방향성을 드러냈습니다.
- source_word: τὸν λογισμὸν αὐτῆς
  english_pob_choice: her reason
  chosen_korean: 그녀의 이성
  alternatives_korean:
  - 그녀의 판단력
  - 그녀의 이성적 판단
  lexicon: LSJ
  rationale: 4마카베오에서 λογισμός는 철학적으로 중요한 ‘이성/이성적 판단’을 뜻하므로, 핵심 용어를 분명히 드러내는 번역을 택했습니다.
- source_word: αἱ παντοίκιλοι βάσανοι
  english_pob_choice: the all-varied tortures
  chosen_korean: 그 모든 가지각색의 고문
  alternatives_korean:
  - 그 온갖 종류의 고문
  - 그 다종다양한 고문
  lexicon: LSJ
  rationale: παντοίκιλος의 ‘온갖 모양의 다양함’을 살려, 순교 문맥의 βάσανοι를 ‘고문’으로 옮겼습니다.
- source_word: ἴσχυσαν μετατρέψαι
  english_pob_choice: were not able ... to turn aside
  chosen_korean: 돌려놓을 수 없었습니다
  alternatives_korean:
  - 바꿔 놓을 수 없었습니다
  - 돌이켜 놓을 수 없었습니다
  lexicon: LSJ
  rationale: ἰσχύω + 부정사로 ‘능력이 없었다’는 뜻이며, μετατρέπω는 방향을 바꾸다이므로 ‘돌려놓다’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: λογισμός의 철학적 의미 보존
  chosen_reading: 이성
  alternative_readings:
