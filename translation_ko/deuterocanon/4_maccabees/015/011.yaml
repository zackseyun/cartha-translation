revisions:
- from: 그러나 그럼에도, 자식에 대한 사랑이 많은 것들이 어머니를 동정으로 이끌고 있었지만, 그 모든 가지각색의 고문도 그 어떤 것으로도 그녀의 이성을 돌려놓을 수 없었습니다.[a]
  to: 그럼에도 자녀에 대한 사랑과 관련된 수많은 것들이 어머니를 연민으로 끌어당기고 있었지만, 온갖 고문도 그 어느 경우에도 그녀의 이성적 판단을 바꾸어 놓을 수 없었습니다.[a]
  rationale: 원문의 양보 구조를 「그럼에도 … 있었지만」으로 간결하게 살렸습니다. φιλοτεκνία에 관련된 복수의 정서적 동인을 「자녀에 대한 사랑과 관련된 수많은 것들」로 정확히 표현했고, λογισμός의 철학적 의미는 「이성적 판단」 및 각주로 보존했습니다. ἐπʼ οὐδενὸς αὐτῶν의 지시 관계를 과도하게 단정하지 않도록 「그 어느 경우에도」로 옮겼습니다.
