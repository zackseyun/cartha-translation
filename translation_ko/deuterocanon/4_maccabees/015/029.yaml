review_pass:
  verdict: revise
  source_fidelity: ‘민족의 어머니’와 ‘경건의 수호자’는 각각 μήτηρ ἔθνους와 ὑπερασπίστεια τῆς εὐσεβείας를 충실히 옮깁니다. 그러나 ‘내장의 정서로 이루는 싸움’은 σπλάγχνα의 관용적 의미를 현대 한국어에서 부자연스럽게 신체 문자로 만들며, διὰ의 관계도 불명확하게 합니다. 이를 모성의 깊은 애정과 관련된/그것을 통과하는 도덕적 싸움이라는 압축된 비유를 보존하는 표현으로 고쳤습니다. ἔκδικε의 강한 ‘원한을 갚음, 권리를 되찾음’의 뜻은 ‘율법의 원한을 갚은 이’로 자연스럽게 살렸습니다.
  naturalness: 호격의 반복은 원문의 찬양적 수사와 현대 한국어의 격식 있는 문체에 잘 맞습니다. ‘내장의 정서’와 ‘보복자’는 현대 표준어 성경 문맥에서 어색하거나 의미가 불필요하게 거칠게 들리므로 수정이 필요합니다.
  terminology: εὐσέβεια는 ‘경건’으로 유지했습니다. σπλάγχνα는 여기서 해부학적 ‘내장’이 아니라 깊은 애정·연민을 뜻하므로 ‘모성의 깊은 애정’으로 옮겼습니다. ‘민족’은 ἔθνος의 공적·집단적 의미를 유지하며, 각주에서 ‘백성’ 등의 가능성을 밝혔습니다.
  issues:
