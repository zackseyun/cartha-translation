  - 효성
  rationale: 이 문맥의 εὐσέβεια는 하나님께 대한 경외와 그에 합당한 삶을 가리키므로, 역사적·윤리적 함의를 함께 지니는 ‘경건’이 적절합니다.
  doctrine_reference: 용어 일관성 지침 §5
- issue: διὰ σπλάγχνων ἀγῶνος의 이미지 보존
  chosen_reading: 내장의 정서로 이루는 싸움
  alternative_readings:
  - 모성의 사랑을 통한 싸움
  - 긍휼의 싸움
  rationale: σπλάγχνα의 직설적인 신체 이미지와 내적 정서를 함께 남겨, 어머니의 자연스러운 연민과 그에 대한 극복을 파라프레이즈 없이 드러냈습니다.
  doctrine_reference: 번역 원칙 §1, §3
