  text: O mother of the nation[a], avenger of the law, defender of godliness[b], and prizewinner in the struggle through motherly affections.
  footnotes:
  - marker: a
    text: Or 'mother of the people' or 'mother of the race'; the Greek ἔθνος can denote a nation, people, or ethnic group.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'prizewinner of the struggle of the inward affections'; the Greek evokes an athletic victory in a contest involving natural maternal compassion.
    reason: lexical_alternative
translation:
  language: ko
  text: 오 민족의 어머니[a]여, 율법의 원한을 갚은 이여, 경건의 수호자여, 모성의 깊은 애정으로 치르는 싸움의 승리자여.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ἔθνος는 ‘민족’, ‘백성’, 또는 ‘종족’을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘깊은 애정들을 통한 싸움의 상을 얻은 이’에 가깝습니다. 그리스어 σπλάγχνα는 문자적으로 ‘내장’을 뜻하지만, 여기서는 어머니의 자연스러운 깊은 애정 또는 연민을 비유적으로 가리킵니다.
    reason: lexical_alternative
