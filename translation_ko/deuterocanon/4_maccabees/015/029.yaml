  - severity: low
    issue: ‘율법의 보복자’는 ἔκδικε의 사법적·변호적 뉘앙스를 한국어에서 다소 부자연스럽고 개인적 보복처럼 들리게 합니다.
    rationale: ‘율법의 원한을 갚은 이’는 율법의 대의를 위하여 원한을 갚고 권리를 되찾는다는 칭송의 뜻을 더 자연스럽게 전달합니다.
