    issue: ‘내장의 정서로 이루는 싸움’은 σπλάγχνα의 관용적 의미를 부자연스럽게 문자화하고 한국어 문장으로도 불명확합니다.
    rationale: σπλάγχνα는 문자적으로 내장을 가리킬 수 있으나 이 문맥에서는 깊은 애정, 특히 모성적 연민을 비유적으로 가리킵니다. 또한 διὰ는 그러한 애정과 관련하여 치러지는 싸움의 긴장을 나타냅니다.
  - severity: medium
    issue: 각주 b에 한글 문맥 안의 데바나가리 문자 ‘संघर्ष’이 남아 있습니다.
    rationale: 이는 한국어 각주의 명백한 언어·편집 오류이므로 한국어로 바로잡아야 합니다.
  - severity: low
    issue: 각주 표지가 모두 문장 끝에 놓여 있어 각주 a의 ἔθνος 연결 대상이 불분명합니다.
