base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/004.yaml
  text: Oh[a], how can I describe the child-loving affections of parents, who imprint the likeness of soul and form in the small, marvelous character of a child[c][b], especially since mothers make fathers more sympathetic toward their children who have been born.
  footnotes:
  - marker: a
    text: Or 'portray' or 'set forth' for 'describe'; the Greek verb is rhetorically elevated.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the likeness of soul and form,' expressing resemblance in both inner disposition and outward appearance.
    reason: lexical_alternative
  - marker: c
    text: The Greek says 'those who have been born,' referring to the children/offspring.
    reason: lexical_alternative
translation:
  language: ko
  text: 오[a], 영혼과 모습의 닮음을 작고 놀라운 아이의 특질에 새겨 넣는 부모의 자녀를 사랑하는 정을 제가 어떻게 묘사할 수 있겠습니까?[b] 특히 어머니들이 태어난 자녀들에게 아버지들보다 더 깊이 공감하는 이들이 되어 있기 때문입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘묘사하다’는 ἠθολογήσαιμι의 수사적으로 격조 높은 표현을 옮긴 것입니다. ‘그려 내다’ 또는 ‘드러내다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 ‘영혼과 모습의 닮음’이라고 하여 내적 차원과 외적 형상의 유사성을 함께 말합니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘태어난 이들에게’이며 문맥상 자녀들을 가리킵니다. 원문은 어머니들이 자녀들에게 아버지들보다 더 공감하게 되어 있다는 비교 표현입니다.
    reason: lexical_alternative
