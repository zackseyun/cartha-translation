base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/004.yaml
  text: Oh[a], how can I describe the child-loving affections of parents, who imprint the likeness of soul and form in the small, marvelous character of a child[c][b], especially since mothers make fathers more sympathetic toward their children who have been born.
  footnotes:
  - marker: a
    text: Or 'portray' or 'set forth' for 'describe'; the Greek verb is rhetorically elevated.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the likeness of soul and form,' expressing resemblance in both inner disposition and outward appearance.
    reason: lexical_alternative
  - marker: c
    text: The Greek says 'those who have been born,' referring to the children/offspring.
    reason: lexical_alternative
translation:
  language: ko
  text: 오, 부모들의 자식 사랑하는 정을 어떻게 설명할 수 있겠습니까? 그들은 영과 모습의 닮음을 어린아이의 작은, 놀라운 특질에 새겨 넣습니다. 특히 어머니들이 아버지들을 그 낳은 자녀들에게 더 공감하게 만드시기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘설명하다’는 ἠθολογήσαιμι의 수사적으로 격조 높은 뜻을 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 ‘영과 모습의 닮음’이라고 하여 내면의 성향과 외적 형상을 함께 말합니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘태어난 이들’로, 문맥상 자녀들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠθολογήσαιμι
  english_pob_choice: describe
  chosen_korean: 설명할 수 있겠습니까
  alternatives_korean:
  - 묘사할 수 있겠습니까
  - 그려낼 수 있겠습니까
  - 표현할 수 있겠습니까
  lexicon: LSJ
  rationale: 수사적으로 격조 높은 ‘어떻게 …할 수 있겠습니까?’를 살리면서, 현대 한국어에서 자연스럽고 품위 있는 동사로 옮겼습니다.
- source_word: φιλότεκνα πάθη
  english_pob_choice: child-loving affections
  chosen_korean: 자식 사랑하는 정
  alternatives_korean:
  - 자녀를 사랑하는 애정
  - 자식에 대한 사랑
  - 자녀 사랑의 정
  lexicon: LSJ
  rationale: 부모의 깊은 정서적 애착을 드러내되, ‘정’으로 따뜻한 감정의 뉘앙스를 살렸습니다.
- source_word: ψυχῆς τε καὶ μορφῆς
  english_pob_choice: likeness of soul and form
  chosen_korean: 영과 모습의 닮음
  alternatives_korean:
  - 혼과 형체의 닮음
  - 영혼과 외형의 닮음
  - 내면과 겉모습의 닮음
  lexicon: LSJ
  rationale: 내적 요소와 외적 형상을 함께 가리키는 병렬을 보존하되, ‘영’과 ‘모습’으로 한국어에서 덜 낯설고도 원문의 긴장을 유지했습니다.
- source_word: παιδοχαρακτῆρα / ἐναποσφραγίζοντα
  english_pob_choice: the small, marvelous character of a child / imprint
  chosen_korean: 어린아이의 작은, 놀라운 특질에 새겨 넣습니다
  alternatives_korean:
  - 어린아이의 작은, 놀라운 인상에 찍어 넣습니다
  - 어린아이의 작은, 놀라운 표상에 새깁니다
  - 어린아이의 작은, 놀라운 특징에 각인합니다
