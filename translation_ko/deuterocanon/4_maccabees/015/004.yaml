  rationale: ‘χαρακτήρ/σφραγίζω’의 새김·각인 이미지를 살리면서도, ‘특질’로 χαρακτήρ의 성격과 개체성을 전달했습니다.
- source_word: συμπαθεστέρας
  english_pob_choice: more sympathetic
  chosen_korean: 더 공감하게 만드시기
  alternatives_korean:
  - 더 동정하게 만드시기
  - 더 마음이 움직이게 하시기
  - 더 연민을 느끼게 하시기
  lexicon: LSJ
  rationale: 문맥상 단순한 동정보다 자녀를 향한 정서적 응답성의 증대를 뜻하므로 ‘공감하게’가 가장 균형 잡힌 표현입니다.
- source_word: τοῖς γεννηθεῖσιν
  english_pob_choice: those who have been born
  chosen_korean: 그 낳은 자녀들
  alternatives_korean:
  - 태어난 자녀들
  - 나은 자녀들
  - 태어난 이들
  lexicon: LSJ
  rationale: 원문의 분사구를 지나치게 추상화하지 않으면서, 본문이 가리키는 자녀들을 한국어로 명확히 드러냈습니다.
