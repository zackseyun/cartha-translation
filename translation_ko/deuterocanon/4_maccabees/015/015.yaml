  text: she saw the flesh of her children melting in the fire[a], and the fingers of their feet and hands scattered on the ground, and the flesh of their heads down to the parts around their beards[b],
  footnotes:
  - marker: a
    text: The Greek text of this verse is syntactically abrupt at the end ('and the [flesh] of their heads down to the parts around their beards'), and the final clause may reflect a compressed or damaged description. The translation stays close to the surviving wording rather than reconstructing it more freely.
