  text: she saw the flesh of her children melting in the fire[a], and the fingers of their feet and hands scattered on the ground, and the flesh of their heads down to the parts around their beards[b],
  footnotes:
  - marker: a
    text: The Greek text of this verse is syntactically abrupt at the end ('and the [flesh] of their heads down to the parts around their beards'), and the final clause may reflect a compressed or damaged description. The translation stays close to the surviving wording rather than reconstructing it more freely.
    reason: textual_variant
  - marker: b
    text: The participle rendered 'scattered' can be understood differently; some may take it in a sense like 'quivering' or 'twitching.' Because the phrase also says the digits were 'on the ground,' the main text adopts the sense that they were strewn there.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 자기 자녀들의 살이 불 속에서 녹아 내리는 것을 보았고[a], 그들의 발과 손의 손가락들이 땅 위에 흩어져 있는 것을, 그리고 그들의 머리의 살이 수염 주변의 부분들에 이르기까지 보았습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 끝부분이 문법적으로 갑작스럽게 끊기는 듯하며, 마지막 절은 압축되었거나 손상된 묘사를 반영할 수 있습니다. 번역은 더 자유롭게 복원하지 않고 남아 있는 표현에 가깝게 유지합니다.
    reason: textual_variant
  - marker: b
    text: 여기서 ‘흩어져 있는’으로 옮긴 분사는 다른 뜻, 예를 들어 ‘경련하는’ 또는 ‘떨고 있는’으로도 이해될 수 있습니다. 그러나 바로 뒤에 ‘땅 위에’가 있으므로, 본문은 지면에 흩어진 상태를 가리키는 것으로 보았습니다.
    reason: lexical_alternative
