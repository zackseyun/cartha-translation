translation:
  language: ko
  text: 그녀는 자기 자녀들의 살이 불 주위에서 녹아내리는 것을 보았고, 그들의 발가락과 손가락이 땅 위에서 경련하는 것도 보았으며[a], 그들의 머리의 살이 수염 주변에 이르기까지…[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘경련하는’으로 옮긴 분사는 ‘움찔거리다’, ‘몸부림치다’ 또는 ‘떨다’라는 뜻으로도 이해될 수 있습니다. 바로 앞의 ‘땅 위에’는 이 손가락들과 발가락이 땅에 있음을 나타내지만, 분사 자체를 ‘흩어져 있는’이라는 뜻으로 확정하지는 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 본문은 여기에서 문법적으로 갑작스럽게 끝납니다(직역하면 ‘그리고 그들의 머리의 살이 수염 주변에 이르기까지’). 이 번역은 더 자유롭게 보충하거나 복원하지 않고, 남아 있는 본문의 불완전한 표현을 보존합니다.
    reason: textual_variant
