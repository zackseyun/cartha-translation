  chosen_korean: 백조의 목소리
  alternatives_korean:
  - 백조 같은 목소리
  - 백조의 소리
  lexicon: LSJ
  rationale: κύκνιοι는 형용사적 표현이지만, 한국어에서는 소유격 구조가 더 자연스러워 백조의 목소리로 옮겼습니다.
- source_word: πρὸς θηλυκίαν
  english_pob_choice: with feminine sound
  chosen_korean: 여성적인 울림으로
  alternatives_korean:
  - 여성적인 소리로
  - 여성스러운 울림으로
  lexicon: LSJ
  rationale: θῆλυ/θηλυκία의 감각을 지나치게 순화하지 않으면서도, 소리의 성격을 나타내는 표현으로 한국어의 음향적 어감을 살렸습니다.
- source_word: ἐφέλκονται
  english_pob_choice: draw
  chosen_korean: 끌어당기지 못합니다
  alternatives_korean:
  - 끌지 못합니다
  - 유혹하지 못합니다
  lexicon: LSJ
  rationale: 단순한 유혹보다 ‘끌어당김’의 물리적·청각적 이미지를 보존하는 쪽이 원문의 대비를 더 잘 드러냅니다.
- source_word: τέκνων φωναὶ ... μητέρα φωνούντων
  english_pob_choice: the voices of children calling to their mother
  chosen_korean: 어머니를 부르는 아이들의 목소리
  alternatives_korean:
  - 어머니에게 부르짖는 아이들의 목소리
  - 어머니를 향해 부르는 아이들의 목소리
  lexicon: LSJ
  rationale: φωνέω의 호출 의미를 살려 ‘부르는’으로 옮기되, 어린이의 절박한 호소를 한국어에서 자연스럽게 전달했습니다.
theological_decisions:
- issue: 수사적 대비의 보존
  chosen_reading: 세이렌·백조의 매혹적 소리와 고문당하는 아이들의 절규를 그대로 대비시켰습니다.
  alternative_readings:
  - 이미지를 일반화해 ‘아름다운 소리’로 완화함
  - 고문 상황을 완화해 정서적 표현으로 바꿈
  rationale: 이 절의 힘은 고전적 매혹 이미지와 순교적 고통의 목소리를 정면 대조하는 데 있으므로, 그 긴장을 약화시키지 않았습니다.
  doctrine_reference: '번역 원칙: 원문 수사와 정서 강도를 보존'
