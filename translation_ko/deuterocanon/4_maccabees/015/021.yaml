translation:
  language: ko
  text: 이런 식으로는 세이렌의 노래나 백조의 목소리도, 여성적인 울림으로 듣는 사람들을 끌어당기지 못합니다. 오히려 고문을 당하면서 어머니를 부르는 아이들의 목소리가 그렇습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘세이렌의 노래’와 ‘백조의 목소리’는 고전 문학의 매혹적 청각 이미지를 가리키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σειρήνιοι μελῳδίαι
  english_pob_choice: siren songs
  chosen_korean: 세이렌의 노래
  alternatives_korean:
  - 세이렌의 선율
  - 세이렌의 노래들
  lexicon: LSJ
  rationale: 그리스 신화의 세이렌을 직접 드러내는 표현으로, POB의 고전적 이미지를 살리면서 한국어에서도 자연스럽게 읽히도록 했습니다.
- source_word: κύκνιοι ... φωναὶ
