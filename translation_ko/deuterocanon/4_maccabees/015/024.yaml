  rationale: στρεβλά를 단순한 추상어로 약화시키지 않고 ‘고문/형벌’의 고통성을 살렸고, πολύπλοκον ποικιλίαν의 중첩된 복합성을 ‘복잡하고도 다양한’으로 옮겼습니다.
- source_word: ἀπάσασα
  english_pob_choice: after embracing them all
  chosen_korean: 모두를 끌어안은 뒤
  alternatives_korean:
  - 모두에게 인사한 뒤
  - 모두에게 작별한 뒤
  lexicon: LSJ
  rationale: 문맥상 어머니의 애정 어린 신체적 동작이 가장 자연스러워 ‘끌어안다’를 본문으로 삼되, 인사/작별의 가능성은 여지로 남겨 둡니다.
- source_word: διὰ τὴν πρὸς θεὸν πίστιν
  english_pob_choice: because of her faith toward God
  chosen_korean: 하나님을 향한 믿음 때문에
  alternatives_korean:
  - 하나님께 대한 믿음 때문에
  - 하나님을 향한 신실함 때문에
  lexicon: LSJ
  rationale: πίστις는 프로젝트 기준대로 ‘믿음’으로 두고, πρὸς θεόν의 관계 방향을 ‘향한’으로 살렸습니다. '때문에'는 διὰ + 대격의 원인 의미를 반영합니다.
theological_decisions:
