  text: Even while seeing the destruction of her seven children and the intricate variety of the tortures[a], the noble mother, after embracing them all[b], let them go because of her faith toward God.
  footnotes:
  - marker: a
    text: Or 'because of her trust in God' or 'because of her faithfulness toward God.'
    reason: lexical_alternative
  - marker: b
    text: The verb rendered 'embracing them all' can also mean 'greeting them all' or 'bidding them all farewell.'
    reason: lexical_alternative
translation:
  language: ko
  text: 일곱 자녀의 멸망과 고문의 복잡하고도 다양한 형벌을 보면서도, 그 고귀한 어머니는 모두를 끌어안은 뒤 하나님을 향한 믿음 때문에 그들을 놓아주었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καίπερ
  english_pob_choice: Even while
  chosen_korean: -면서도
  alternatives_korean:
  - 비록 ... 하지만
  - 그런데도
  lexicon: LSJ
  rationale: 양보 관계를 드러내되, 진행 중인 장면의 긴장감을 살리기 위해 부사절 어미 ‘-면서도’로 자연스럽게 옮겼습니다.
- source_word: τῶν στρεβλῶν πολύπλοκον ποικιλίαν
  english_pob_choice: the intricate variety of the tortures
  chosen_korean: 고문의 복잡하고도 다양한 형벌
  alternatives_korean:
  - 고문의 여러 가지 복잡한 방식
  - 고문의 다채롭고 복잡한 형벌들
  lexicon: LSJ
  rationale: στρεβλά를 단순한 추상어로 약화시키지 않고 ‘고문/형벌’의 고통성을 살렸고, πολύπλοκον ποικιλίαν의 중첩된 복합성을 ‘복잡하고도 다양한’으로 옮겼습니다.
- source_word: ἀπάσασα
  english_pob_choice: after embracing them all
  chosen_korean: 모두를 끌어안은 뒤
  alternatives_korean:
  - 모두에게 인사한 뒤
  - 모두에게 작별한 뒤
  lexicon: LSJ
  rationale: 문맥상 어머니의 애정 어린 신체적 동작이 가장 자연스러워 ‘끌어안다’를 본문으로 삼되, 인사/작별의 가능성은 여지로 남겨 둡니다.
- source_word: διὰ τὴν πρὸς θεὸν πίστιν
  english_pob_choice: because of her faith toward God
  chosen_korean: 하나님을 향한 믿음 때문에
  alternatives_korean:
  - 하나님께 대한 믿음 때문에
  - 하나님을 향한 신실함 때문에
  lexicon: LSJ
  rationale: πίστις는 프로젝트 기준대로 ‘믿음’으로 두고, πρὸς θεόν의 관계 방향을 ‘향한’으로 살렸습니다. '때문에'는 διὰ + 대격의 원인 의미를 반영합니다.
theological_decisions:
- issue: πίστις의 번역
  chosen_reading: 믿음
  alternative_readings:
  - 신뢰
  - 신실함
  rationale: 기본 용례를 따라 ‘믿음’을 본문에 두되, 이 장면이 하나님께 대한 신뢰와 끝까지 견디는 신실함을 함께 함축할 수 있음을 감안했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: πίστις → faith'
