  text: Even while seeing the destruction of her seven children and the intricate variety of the tortures[a], the noble mother, after embracing them all[b], let them go because of her faith toward God.
  footnotes:
  - marker: a
    text: Or 'because of her trust in God' or 'because of her faithfulness toward God.'
    reason: lexical_alternative
  - marker: b
    text: The verb rendered 'embracing them all' can also mean 'greeting them all' or 'bidding them all farewell.'
    reason: lexical_alternative
translation:
  language: ko
  text: 일곱 자녀의 죽음과 고문의 복잡하고 다양한 온갖 양상을 보면서도, 그 고귀한 어머니는 그들 모두를 끌어안은 뒤[b] 하나님을 향한 믿음[a] 때문에 그들을 놓아주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님께 대한 신뢰 때문에’ 또는 ‘하나님을 향한 신실함 때문에’.
    reason: πίστις는 여기서 ‘믿음’으로 옮겼으나, 문맥상 신뢰 또는 신실함의 뉘앙스도 가능합니다.
  - marker: b
    text: ‘그들 모두를 끌어안은 뒤’로 옮긴 말은 ‘그들 모두에게 인사한 뒤’ 또는 ‘그들 모두에게 작별을 고한 뒤’를 뜻할 수도 있습니다.
    reason: ἀπάσασα는 포옹하다 외에도 인사하다 또는 작별을 고하다를 뜻할 수 있습니다.
