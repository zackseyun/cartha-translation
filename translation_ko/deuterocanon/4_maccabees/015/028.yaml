translation:
  language: ko
  text: 그러나 그 딸은 하나님을 경외하는 아브라함의 굳건함을 기억하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  lexicon: LSJ
  rationale: 앞선 문맥과의 대조를 드러내는 역접으로, 문어적이면서도 현대 한국어에서 자연스러운 「그러나」가 가장 적절합니다.
- source_word: τῆς θεοσεβοῦς Ἀβραὰμ
  english_pob_choice: the steadfastness of God-fearing Abraham / Abraham, who feared God
  chosen_korean: 하나님을 경외한 아브라함
  alternatives_korean:
  - 경건한 아브라함
  - 하나님을 두려워한 아브라함
  - 하나님을 경외하는 아브라함
  lexicon: LSJ
  rationale: θεοσεβοῦς는 단순한 ‘경건한’보다 하나님을 향한 경외를 분명히 하므로, 한국어에서도 그 직접적 의미를 살려 「하나님을 경외한」으로 옮겼습니다.
- source_word: καρτερίας
  english_pob_choice: steadfastness
  chosen_korean: 굳건함
  alternatives_korean:
  - 인내
  - 견고함
  - 굳셈
  lexicon: LSJ
  rationale: 압박 아래에서도 흔들리지 않는 지속성과 결연함을 나타내므로, 덕목적 뉘앙스를 살린 「굳건함」이 가장 자연스럽습니다.
- source_word: ἐμνήσθη
  english_pob_choice: remembered
  chosen_korean: 기억하였습니다
  alternatives_korean:
  - 떠올렸습니다
  - 상기하였습니다
  - 기억했습니다
  lexicon: LSJ
  rationale: aorist 중간태의 단순한 ‘기억하다’에 해당하며, 서술문체에 맞는 공손한 과거형으로 옮겼습니다.
theological_decisions:
- issue: θεοσεβοῦς의 하나님-지향성을 한국어에서 어떻게 드러낼지
  chosen_reading: 「하나님을 경외한」으로 옮겨, Abraham의 덕목이 일반적 도덕성이 아니라 하나님 앞에서의 경외임을 드러냈습니다.
  alternative_readings:
  - 경건한
  - 하나님을 두려워한
  - 경외심 있는
  rationale: 본문의 θεο- 요소를 희석하지 않기 위해, ‘경건한’처럼 일반화된 표현보다 하나님에 대한 경외를 직접적으로 말하는 번역을 택했습니다.
  doctrine_reference: Translation philosophy §1, §6
