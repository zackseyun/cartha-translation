  text: For they were righteous and self-controlled[a], brave and noble-minded and loving their brothers, and so devoted to their mother that, even while keeping the law's requirements to the point of death[b], they obeyed her.
  footnotes:
  - marker: a
    text: Or 'loving their mother.' The Greek adjective can be rendered more literally, but 'devoted to their mother' brings out the sense of affectionate loyalty in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'the lawful ordinances' or 'the customs prescribed by the law' for 'the law's requirements.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 의롭고 절제했으며, 용감하고 고상한 마음을 지녔고, 형제들을 사랑했으며, 그렇게 어머니에게 헌신하여, 죽음에 이르기까지 율법의 요구를 지키면서도 어머니의 말에 순종했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '형제들을 사랑하는'. 형용사 φιλόμητρος는 문맥상 '어머니에게 헌신한' 뜻으로 풀 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '율법의 합법적 규례들'이나 '율법이 정한 관습들'. τὰ νόμιμα는 여기서 율법의 요구 사항을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιοι
  english_pob_choice: righteous
  chosen_korean: 의롭고
  alternatives_korean:
  - 정의롭고
  - 옳고
  lexicon: LSJ
  rationale: 이 열거문에서 δίκαιοι는 법적 '정의'보다 윤리적·종교적 바름을 가리키므로, POB의 'righteous'에 맞춰 '의롭고'로 옮겼습니다.
- source_word: σώφρονες
  english_pob_choice: self-controlled
  chosen_korean: 절제했으며
  alternatives_korean:
  - 자제했으며
  - 신중했으며
  lexicon: LSJ
  rationale: σωφρονες는 욕망을 다스리는 절제와 분별을 함께 내포하므로, 현대 한국어로 자연스러운 '절제하다'를 택했습니다.
- source_word: μεγαλόψυχοι
  english_pob_choice: noble-minded
  chosen_korean: 고상한 마음을 지녔고
  alternatives_korean:
  - 고결한 마음을 지녔고
  - 너그러운 마음을 지녔고
  - 대담한 마음을 지녔고
  lexicon: LSJ
  rationale: 직역형 '큰 영혼'보다 품격과 도덕적 위상을 드러내는 표현이 문맥에 맞으므로, '고상한 마음'으로 풀었습니다.
- source_word: φιλάδελφοι
  english_pob_choice: loving their brothers
  chosen_korean: 형제들을 사랑했으며
  alternatives_korean:
  - 형제애가 깊었으며
  - 형제들을 아끼며
  lexicon: LSJ
  rationale: 바로 앞·뒤 문맥이 일곱 형제들이므로, 성별을 흐리지 않고 literal하게 '형제들을 사랑했다'로 반영했습니다.
- source_word: φιλόμητρος
  english_pob_choice: devoted to their mother
  chosen_korean: 어머니에게 헌신하여
  alternatives_korean:
  - 어머니를 사랑하여
  - 어머니께 충실하여
  - 어머니께 애정과 충성을 바쳐
  lexicon: LSJ
  rationale: 단순한 정서적 애호보다 애정과 충성의 결합이 핵심이므로, POB의 해설 방향에 따라 '헌신하다'를 선택했습니다.
- source_word: τὰ νόμιμα φυλάσσοντας
  english_pob_choice: keeping the law's requirements
  chosen_korean: 율법의 요구를 지키면서도
  alternatives_korean:
  - 율법의 규례를 지키며
  - 율법의 명령을 지키면서
  lexicon: LSJ
  rationale: τὰ νόμιμα는 토라의 규정·요구를 가리키므로, '법'보다 POB 용례에 맞는 '율법'을 사용했고, φυλάσσω는 '지키다'로 옮겼습니다.
- source_word: πείθεσθαι αὐτῇ
  english_pob_choice: they obeyed her
  chosen_korean: 어머니의 말에 순종했습니다
  alternatives_korean:
  - 그녀에게 순종했습니다
  - 그녀의 말을 따랐습니다
  lexicon: LSJ
  rationale: πείθομαι는 여기서 단순 설득보다 권위에 대한 순종의 뉘앙스가 강하므로, 관계를 분명히 드러내는 '어머니의 말에 순종하다'로 옮겼습니다.
theological_decisions:
- issue: 율법 준수와 모성 순종의 병렬 관계
  chosen_reading: 형제들은 죽음에 이르기까지 율법의 요구를 지키면서도 어머니의 말에 순종했습니다.
  alternative_readings:
  - 죽음에 이르기까지 율법의 요구를 지키며 어머니에게 순종했습니다.
  rationale: 원문은 율법 준수와 어머니에게 대한 순종을 나란히 배치해, 두 충성이 충돌하지 않는 방식으로 제시합니다. 이를 한국어에서도 병렬 구조로 살려 문맥의 긴장을 보존했습니다.
  doctrine_reference: DOCTRINE.md §5 Consistency of key terms, or documented exception
