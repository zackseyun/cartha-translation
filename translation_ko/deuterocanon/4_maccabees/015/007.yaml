lexical_decisions:
- source_word: καὶ διὰ πολλὰς τὰς καθʼ ἕκαστον αὐτῶν ὠδῖνας
  english_pob_choice: because of the many pangs that each one of them suffered
  chosen_korean: 각 사람마다 겪는 많은 고통 때문에
  alternatives_korean:
  - 그들 각자가 겪는 여러 산고 때문에
  - 그들 각자의 많은 고통 때문에
  lexicon: ὠδῖνας
  rationale: ὠδῖνας는 단순한 통증보다 강한 ‘고통/산고’의 뜻이 있으나, 문맥상 과도하게 산모적 이미지를 고정하기보다 ‘많은 고통’으로 옮겨 각 사람에게 개별적으로 닥친 고통을 살렸습니다.
- source_word: ἠναγκασμένην ... ἔχειν συμπάθειαν
  english_pob_choice: she was compelled to feel sympathy for them
  chosen_korean: 그녀는 그들에게 연민을 느끼지 않을 수 없었습니다
  alternatives_korean:
  - 그녀는 그들에게 동정심을 갖도록 강요받았습니다
  - 그녀는 그들을 향한 공감을 억지로 품게 되었습니다
  lexicon: συμπάθεια
  rationale: συμπάθεια는 단순한 감정 이입보다 ‘함께 아파함’의 뉘앙스가 있어, 현대 한국어에서 자연스럽고 의미를 살리는 ‘연민’으로 옮겼습니다.
- source_word: εἰς αὐτούς
  english_pob_choice: for them
  chosen_korean: 그들에게
  alternatives_korean:
  - 그들에 대하여
  - 그들 편에서
  lexicon: εἰς + accusative
  rationale: 감정의 방향을 나타내는 전치사구이므로, 한국어에서는 대상 표지 ‘그들에게’로 자연스럽게 대응했습니다.
theological_decisions:
- issue: 4 Maccabees의 서술어 ‘compelled’와 감정의 도덕적 의미
  chosen_reading: 고통의 현실이 그녀의 마음을 움직여 연민을 피할 수 없게 되었다는 서술로 읽었습니다.
  alternative_readings:
  - 단순한 심리 묘사로 약화하여 읽기
  - 윤리적 모범 제시로 과장해 읽기
  rationale: 본문은 감정의 발생 원인을 열거된 고통에 두며, 서술 자체를 유지하는 것이 가장 직접적입니다.
  doctrine_reference: 인간 감정과 고난의 연관성에 대한 일반 서술
