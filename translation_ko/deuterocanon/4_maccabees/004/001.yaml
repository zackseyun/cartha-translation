  text: Σίμων γάρ τις πρὸς Ὀνίαν ἀντιπολιτευόμενος τὸν ποτε τὴν ἀρχιερωσύνην ἔχοντα διὰ βίου, καλὸν καὶ ἀγαθὸν ἄνδρα, ἐπειδὴ πάντα τρόπον διαβάλων ὑπὲρ τοῦ ἔθνους οὐκ ἴσχυεν κακῶσαι, φυγὰς ᾤχετο, τὴν πατρίδα προδώσων.
