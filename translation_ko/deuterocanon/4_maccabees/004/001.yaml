revisions:
- from: 그런데 어떤 시몬은 오니아스를 대적하였는데, 그는 한때 대제사직을 종신으로 지녔던 자로서, 고결하고 선한 사람이었습니다. 시몬은 그를 온갖 방식으로 비방했지만, 나라를 두고 그를 해치지 못하자 유배자로 떠나갔으며, 자기 고향을 배반하려고 했습니다.[a][b]
  to: 실제로 어떤 시몬이 한때 종신으로 대제사직을 맡았던 고결하고 선한 사람인 오니아스를 대적하였습니다. 그는 온갖 방법으로 그를 비방했지만, 민족과 관련된 일에서[b] 그를 해치지 못하자 유배자로[a] 떠났으며, 자기 조국을 배반하려고 했습니다.
  rationale: 오니아스를 수식하는 원문의 동격 설명을 ‘한때 종신으로 대제사직을 맡았던 고결하고 선한 사람인 오니아스’로 명시하여 지시 대상의 혼동을 제거했습니다. γάρ의 설명적 기능은 ‘실제로’로, ὑπὲρ τοῦ ἔθνους의 불확정적 관계는 ‘민족과 관련된 일에서’와 각주로 보존했습니다. 또한 πατρίς의 공적 의미를 ‘조국’으로 반영하고, 모든 각주 표지를 대응 어구에 배치했습니다.
