base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/001.yaml
  text: For a certain Simon[a], opposing Onias, who had once held the high priesthood for life, a noble and good man, when he was unable, though slandering him in every way, to harm him on behalf of the nation, went away as an exile[b], intending to betray his homeland.
  footnotes:
  - marker: a
    text: Or 'departed as a fugitive'; the Greek φυγάς can denote either an exile or one in flight.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'in matters concerning the nation' reflects a cautious rendering of the Greek ὑπὲρ τοῦ ἔθνους, which may also be understood more specifically as 'with respect to the nation' or, less likely in context, 'on behalf of the nation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 어떤 시몬은 오니아스를 대적하였는데, 그는 한때 대제사직을 종신으로 지녔던 자로서, 고결하고 선한 사람이었습니다. 시몬은 그를 온갖 방식으로 비방했지만, 나라를 두고 그를 해치지 못하자 유배자로 떠나갔으며, 자기 고향을 배반하려고 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘도망자로 떠나갔으며’로도 옮길 수 있습니다. φυγάς는 유배자와 도망자 둘 다 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나라와 관련하여’, ‘민족을 위하여’로도 이해할 수 있습니다. ὑπὲρ τοῦ ἔθνους의 의미는 문맥상 조심스럽게 열어 두었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιπολιτευόμενος
  english_pob_choice: opposing
  chosen_korean: 대적하였는데
  alternatives_korean:
  - 반대하였는데
  - 정치적으로 맞서는데
  - 적대하였는데
  lexicon: LSJ
  rationale: 단순한 반대보다 공개적·대립적 विरोध의 힘을 살려, 문맥상 오니아스를 향한 적대적 대치를 한국어로 자연스럽게 드러냅니다.
- source_word: τὸν ποτε τὴν ἀρχιερωσύνην ἔχοντα διὰ βίου
  english_pob_choice: the man who had formerly held the high priesthood for life
  chosen_korean: 한때 대제사직을 종신으로 지녔던 자
  alternatives_korean:
  - 한때 종신 대제사직을 지녔던 사람
  - 예전에 평생 대제사장이었던 자
  lexicon: LSJ
  rationale: ποτε의 ‘한때/이전에’와 διὰ βίου의 ‘종신’을 함께 살려, 직분의 성격과 시간성을 모두 드러냈습니다.
- source_word: καλὸν καὶ ἀγαθὸν ἄνδρα
  english_pob_choice: a noble and good man
  chosen_korean: 고결하고 선한 사람이었습니다
  alternatives_korean:
  - 고상하고 선한 사람이었습니다
  - 훌륭하고 선한 사람이었습니다
  lexicon: LSJ
  rationale: καλός καὶ ἀγαθός의 관용적 칭찬을 너무 평면적으로 만들지 않도록, 도덕적 품격을 담는 표현으로 옮겼습니다.
- source_word: ὑπὲρ τοῦ ἔθνους
  english_pob_choice: in matters concerning the nation
  chosen_korean: 나라를 두고
  alternatives_korean:
  - 민족을 위하여
  - 나라에 관하여
  - 민족에 대하여
  lexicon: LSJ
  rationale: ὑπέρ의 관계를 단정적으로 ‘위하여’로 못 박지 않고, 문맥상 공적·국가적 범위를 간결하게 표시했습니다.
- source_word: φυγὰς ᾤχετο
  english_pob_choice: went away as an exile
  chosen_korean: 유배자로 떠나갔으며
  alternatives_korean:
  - 망명자로 떠나갔으며
  - 도망자로 떠나갔으며
  - 추방당한 채 떠나갔으며
  lexicon: LSJ
  rationale: φυγάς가 ‘망명자/도망자’ 모두 가능하지만, 서술 흐름에서는 추방·유배의 상태를 나타내는 ‘유배자’가 가장 무난합니다.
- source_word: τὴν πατρίδα προδώσων
  english_pob_choice: intending to betray his homeland
  chosen_korean: 자기 고향을 배반하려고 했습니다
  alternatives_korean:
  - 자기 조국을 배반하려고 했습니다
  - 조국을 팔아넘기려 했습니다
  - 고향을 배반할 작정이었습니다
  lexicon: LSJ
  rationale: πατρίς의 애국적·혈연적 뉘앙스를 살리면서도, 현대 한국어에서 과도하게 고풍스럽지 않은 ‘고향’으로 옮겼습니다.
theological_decisions:
- issue: 오니아스와 시몬의 관계를 묘사하는 서술의 강도
  chosen_reading: 시몬의 행동을 공개적 대적과 비방, 그리고 배반 의도의 연쇄로 옮겨 인물의 도덕적 책임을 분명히 드러냈습니다.
  alternative_readings:
  - 보다 중립적으로 ‘반대하였는데’로 약화할 수 있음
  - ‘해치려 했으나’의 강도를 낮출 수 있음
  rationale: 본문은 단순한 정치적 견해 차이보다 악의적 공격과 배신 의도를 함께 제시하므로, 그 긴장을 약화하지 않는 쪽이 원문 의도에 가깝습니다.
  doctrine_reference: 서사적 윤리 평가
- issue: ὑπὲρ τοῦ ἔθνους의 방향성
  chosen_reading: ‘나라를 두고’로 옮겨, 목적어를 지나치게 ‘위하여’로 선해하지 않고 문맥적 범위를 남겨 두었습니다.
  alternative_readings:
  - ‘나라를 위하여’
  - ‘나라에 관하여’
  rationale: 영어 POB도 이 표현을 조심스럽게 처리하듯, 본문 자체가 시몬의 행위를 국가를 위한 것으로 정당화한다고 읽을 근거는 약하므로 의미의 여지를 보존했습니다.
  doctrine_reference: 역사서술의 문맥 보존
