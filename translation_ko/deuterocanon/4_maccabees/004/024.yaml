  text: 그리하여 여자들도, 자기 자녀들을 할례했기 때문에, 자기 아기들과 함께 머리째 내던져졌습니다. 그들은 이것을 미리 알고 있었습니다. 자신들이 이런 일을 당하리라는 것을 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
