  text: They were preventing him as much as they could[b][a]. But with threats Apollonius was going to the temple.
  footnotes:
  - marker: a
    text: Or 'They were hindering as much as they could.' The Greek idiom οἷόν τε ἦν can be rendered more explicitly in terms of ability.
    reason: lexical_alternative
  - marker: b
    text: '''Temple'' translates ἱερόν, which can refer to the temple precincts broadly, not only the inner sanctuary.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 할 수 있는 한[a] 그를 막고 있었습니다. 그러나 아폴로니오스는 위협을 가하면서 성전으로 가고 있었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘할 수 있는 한’은 οἷόν τε ἦν의 가능성·능력 관용구를 자연스럽게 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘성전’은 ἱερόν이 가리킬 수 있는 성전 구역 전체를 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷόν τε ἦν
  english_pob_choice: as much as they could / whatever was possible
  chosen_korean: 할 수 있는 한
  alternatives_korean:
  - 가능한 만큼
  - 그들이 할 수 있는 한껏
  lexicon: LSJ
  rationale: 가능성과 능력의 한계를 나타내는 관용구이므로, “할 수 있는 한”으로 자연스럽게 옮겨 원문의 제한된 가능성을 살렸습니다.
- source_word: ἐκώλυον
  english_pob_choice: they were preventing
  chosen_korean: 막고 있었습니다
  alternatives_korean:
  - 방해하고 있었습니다
  - 저지하고 있었습니다
  lexicon: BDAG
  rationale: 미완료 과거의 지속적 행위를 살리기 위해 진행형 표현을 사용했고, κωλύω의 직접적 의미를 드러내기 위해 “막다”를 택했습니다.
- source_word: μετὰ ἀπειλῆς
  english_pob_choice: with threats
  chosen_korean: 위협을 받으면서도
  alternatives_korean:
  - 위협하면서
  - 협박과 함께
  lexicon: LSJ
  rationale: 여기서는 단순한 수단보다 적대적 압박 아래 전진하는 상황이 강조되므로, 한국어에서 자연스럽게 긴장감을 살리는 표현으로 옮겼습니다.
- source_word: εἰς τὸ ἱερόν
  english_pob_choice: to the temple
  chosen_korean: 성전으로
  alternatives_korean:
  - 성전 뜰로
  - 성전 구역으로
  - 신전으로
  lexicon: BDAG
  rationale: ἱερόν은 성전 건물의 내실보다 성전 구역 전체를 가리킬 수 있으므로, 본문 맥락에 맞게 “성전”으로 옮겼습니다.
- source_word: ὁ Ἀπολλώνιος
  english_pob_choice: Apollonius
  chosen_korean: 아폴로니오스
  alternatives_korean:
  - 아폴로니우스
  lexicon: 고유명사 관행
  rationale: 현대 외래어 표기 관행에 따라 음역했습니다.
