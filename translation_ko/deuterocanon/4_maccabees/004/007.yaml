  source_fidelity: 핵심 의미는 대체로 충실하지만, παρακαταθήκας를 현대 금융 용어인 ‘예금’으로 옮기면 단순 은행 예금을 뜻하는 것으로 지나치게 좁혀집니다. 또한 원문의 ὡς가 이끄는 다음 절 계속 구조는 마침표 없이 보존하는 편이 더 정확합니다.
  naturalness: ‘민족이 … 말하였으며’보다 ‘백성이 … 말하자’가 한국어 문장 연결에서 더 자연스럽습니다. ‘지극히 끔찍한 일’도 가능하나 ‘참으로 끔찍한 일’이 현대 격식체에서 더 자연스럽습니다.
  terminology: ‘거룩한 보물고’는 가능하지만, ἱερός의 성전·성역 관련 성격에는 ‘성스러운 보물고’가 현대 한국어에서 더 중립적이고 자연스럽습니다. παρακαταθήκας는 ‘맡겨 둔 재산’으로 하여 위탁 보관물을 포괄하도록 수정합니다.
