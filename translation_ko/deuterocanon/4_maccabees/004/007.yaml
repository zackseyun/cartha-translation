translation:
  language: ko
  text: 그리고 민족이 그 제안에 격분하며 그것에 반대하여 말하였으며, 그들은 거룩한 보물고에 자기들의 예금을 맡긴 사람들이 그것을 빼앗기게 되면 지극히 끔찍한 일이라고 생각하였습니다. 이는[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 이 보물고는 예루살렘 성전과 연결된 보물고를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 이 절은 다음 절에서 이유가 이어지는 미완의 문장입니다.
    reason: cross_reference
lexical_decisions:
- source_word: τοῦ ἔθνους
  english_pob_choice: the nation
  chosen_korean: 민족
  alternatives_korean:
  - 백성
  - 그 나라 사람들
  lexicon: LSJ
  rationale: ἔθνος는 여기서 이스라엘 공동체 전체를 가리키므로, 정치·집단성을 살리면서도 현대 한국어에서 자연스러운 ‘민족’으로 옮겼습니다.
- source_word: πρὸς τὸν λόγον
  english_pob_choice: at the proposal
  chosen_korean: 그 제안에
  alternatives_korean:
  - 그 말에
  - 그 문제에
  - 그 계획에
  lexicon: LSJ
  rationale: λόγος는 이 문맥에서 단순한 ‘말’보다 특정한 제안이나 안건을 가리키므로, 사건의 성격을 드러내는 ‘제안’이 가장 적절합니다.
- source_word: τῷ ἱερῷ θησαυρῷ
  english_pob_choice: the sacred treasury
  chosen_korean: 거룩한 보물고
  alternatives_korean:
  - 성전 보물고
  - 성스러운 보물고
  - 거룩한 금고
  lexicon: LSJ
  rationale: ἱερός의 성격을 살리면서도 θησαυρός의 ‘보관 장소’ 의미를 반영해 ‘보물고’로 옮겼습니다. 문맥상 성전의 재정 저장소를 가리키지만, 원문의 표현을 과도하게 확장하지 않았습니다.
- source_word: στερηθήσονται
  english_pob_choice: should be deprived of them
  chosen_korean: 빼앗기게 되면
  alternatives_korean:
  - 빼앗기게 되리라고
  - 그것을 잃게 되면
  - 그것을 빼앗기게 되면
  lexicon: LSJ
  rationale: 수동 미래의 박탈 의미를 살려 ‘빼앗기게 되면’으로 옮겼습니다. 금전적 보관물의 상실이라는 문맥도 자연스럽게 드러납니다.
theological_decisions:
- issue: 문장이 4절 안에서 미완으로 끝나는 연결 구조
  chosen_reading: 마지막의 ‘이는’으로 다음 절의 이유 설명으로 이어지게 했습니다.
  alternative_readings:
  - 쉼표로 끊고 완결된 문장처럼 처리
  - 다음 절 내용을 괄호로 흡수
  rationale: 원문과 영어 POB 모두 ὡς가 다음 절로 이어지는 이유절의 시작임을 보여 주므로, 한국어에서도 미완 구조를 보존해야 합니다.
  doctrine_reference: 원문 구조 보존 원칙
