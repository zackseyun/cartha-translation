  source_fidelity: 초안에는 원문에 없는 대괄호 안의 중복 구절(“음식을 맛본 뒤에”)이 삽입되어 있으며, ‘온갖’은 βάσανοι에 없는 확대입니다. 또한 분사 ἀπογευομένους는 각 사람을 수식하므로, 그들이 더럽히는 음식을 맛본 뒤 유대교를 저버리도록 강요받는 순서를 분명히 하는 것이 좋습니다. 개정문은 δόγματα의 복수, 미완료 시제의 지속성, ἕνα ἕκαστον의 분배적 강조, 고문이라는 수단, 그리고 ἐξόμνυσθαι의 맹세 관련 뉘앙스를 보존합니다.
  naturalness: ‘억지로’와 ‘강요하다’의 중복을 피하고, 현대 표준어 합쇼체로 자연스럽게 다듬었습니다. ‘그 민족의 한 사람 한 사람’은 원문의 ‘각 사람’을 분명히 드러내면서도 문맥상 유대 민족을 부당하게 축소하거나 과도하게 보충하지 않습니다.
  terminology: μιερῶν τροφῶν은 위생적 의미로 오해될 수 있는 단순 ‘더러운 음식’ 대신 ‘더럽히는 음식’으로 옮기고 주석에서 의례적 부정의 뜻을 밝혔습니다. Ἰουδαϊσμός은 폭넓은 종교·공동체 정체성을 보존하기 위해 ‘유대교’로 유지했습니다. ἐξόμνυσθαι의 맹세의 함의는 주석으로 보완했습니다.
