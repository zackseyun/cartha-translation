- issue: τὸν Ἰουδαϊσμόν의 범위
  chosen_reading: '''유대교''로 옮겨 종교·공동체 정체성 전체를 포괄하게 했습니다.'
  alternative_readings:
  - 유대인의 삶
  - 유대인의 종교
  rationale: 문맥상 단순한 종교 체계만이 아니라, 박해받는 언약 공동체의 정체성을 포함합니다. 한국어에서는 '유대교'가 가장 직접적입니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
