  yaml_path: translation/deuterocanon/4_maccabees/004/026.yaml
  text: Therefore[a], since his decrees were being despised by the people, he himself was compelling each and every one of the nation, by tortures, after tasting defiling foods[b], to renounce Judaism.
  footnotes:
  - marker: a
    text: Or 'unclean foods' or 'polluted foods.' The Greek term emphasizes ritual defilement.
    reason: lexical_alternative
  - marker: b
    text: Or 'to forswear Judaism.' The Greek verb can carry the sense of renouncing under oath.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그의 칙령들이 백성에게 멸시를 받고 있었으므로, 그는 그 민족의 한 사람 한 사람에게 고문을 가하여 더럽히는 음식[a]을 맛본 뒤 유대교를 저버리도록[b] 강요하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘부정한 음식’, ‘오염된 음식’이라고 할 수 있습니다. 그리스어는 단순히 위생적으로 더러운 음식이 아니라 의례적으로 사람을 더럽히는 음식을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘맹세로 저버리도록’이라고 할 수 있습니다. 그리스어 동사는 맹세와 관련하여 부인하거나 정식으로 포기한다는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
