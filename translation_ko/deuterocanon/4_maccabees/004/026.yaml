  rationale: 원문에 없는 중복 삽입을 제거하고, ‘온갖’이라는 확대를 삭제했습니다. 분사구의 시간적 관계를 ‘맛본 뒤’로 자연스럽게 나타냈으며, 각주 표지를 해당 어휘에 배치했습니다. 의미상 논쟁의 여지가 있는 ἐξόμνυσθαι의 맹세 함의는 본문에 과도하게 강제하지 않고 각주에 보존했습니다.
