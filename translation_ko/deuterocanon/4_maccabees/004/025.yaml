  text: 그러므로 그의 조서들이 백성에게 업신여김을 받았으므로, 그는 그 나라의 각 사람을 고문으로 강요하여, 더럽혀진 음식을 맛본 뒤에 유대교를 부인하게 했습니다.[a]
  philosophy: optimal-equivalence
