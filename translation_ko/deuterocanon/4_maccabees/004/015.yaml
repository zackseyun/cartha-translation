    rationale: 속격 절대구의 부정과거 분사는 셀레우코스의 죽음이 승계보다 앞섰음을 나타냅니다. ‘죽은 뒤’는 이를 더 명료하게 전달하며, ‘죽자’가 줄 수 있는 즉시성의 뉘앙스를 피합니다.
  - severity: low
    issue: 각주 대안의 ‘두려운 사람’
    rationale: 한국어 ‘두려운 사람’은 문맥에 따라 두려움을 느끼는 사람으로도 읽힐 수 있습니다. δεινός의 ‘fearsome/terrible’ 의미는 ‘두려움을 주는 사람’으로 제시하는 편이 명확합니다.
