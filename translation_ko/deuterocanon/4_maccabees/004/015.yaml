  text: Now when Seleucus the king had died[a], his son Antiochus Epiphanes succeeded to the rule, a proud and formidable man;
  footnotes:
  - marker: a
    text: Or 'a proud and fearsome man.' The Greek δεινός can carry a range of senses including formidable, terrible, or fearsome.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 셀레우코스 왕이 죽자, 그의 아들 안티오쿠스 에피파네스가 그 통치를 이어받았습니다. 그는 교만하고 위협적인 사람이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘교만하고 두려운 사람’으로 옮길 수 있습니다. 그리스어 δεινός는 위협적인, 두려운, 무시무시한 등의 범위를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τελευτήσαντος
  english_pob_choice: had died
  chosen_korean: 죽자
  alternatives_korean:
  - 죽은 뒤
  - 죽었을 때
  lexicon: LSJ
  rationale: 분사형 속격 절대구의 선행 완료를 한국어 서술 흐름에 자연스럽게 옮기면서, 단순한 동시가 아니라 왕의 죽음이 먼저 있었음을 드러냅니다.
- source_word: διάδεχεται τὴν ἀρχήν
  english_pob_choice: succeeded to the rule
  chosen_korean: 그 통치를 이어받았습니다
  alternatives_korean:
  - 그 통치를 계승했습니다
  - 권력을 이어받았습니다
  - 통치권을 이어받았습니다
  lexicon: LSJ
  rationale: διάδεχομαι의 계승·승계 의미를 살려 왕위/권력의 정당한 승계를 드러내되, ἀρχή를 문맥에 맞게 ‘통치’로 자연스럽게 옮겼습니다.
- source_word: ὑπερήφανος
  english_pob_choice: proud
  chosen_korean: 교만하고
  alternatives_korean:
  - 오만하고
  - 자만한
  - 거만하고
  lexicon: LSJ
  rationale: 단순한 긍정적 ‘자랑스러운’이 아니라 부정적 성격 묘사이므로, 문맥상 강한 비난 뉘앙스를 지닌 ‘교만한’으로 옮겼습니다.
- source_word: δεινός
  english_pob_choice: formidable
  chosen_korean: 위협적인
  alternatives_korean:
  - 무시무시한
  - 두려운
  - 강력한
  lexicon: LSJ
  rationale: δεινός의 폭넓은 의미 가운데 이 문맥의 적대적 인물 묘사에 가장 잘 맞는 한국어로, 능력 자체보다 사람에게 주는 위압과 위협을 드러냈습니다.
theological_decisions:
- issue: 왕권 승계 서술의 표현
  chosen_reading: ‘통치를 이어받았습니다’로 왕권의 계승을 중립적으로 서술했습니다.
  alternative_readings:
  - ‘왕권을 물려받았습니다’
  - ‘나라를 차지했습니다’
  rationale: 본문은 안티오쿠스의 즉위 사실을 전할 뿐 평가를 직접 덧붙이지 않으므로, 승계의 사실과 속도를 유지하면서도 과도한 해석은 피했습니다.
  doctrine_reference: 서사 본문은 역사적 서술의 직접성을 우선해야 한다는 번역 원칙
- issue: 인물 평가의 강도
  chosen_reading: ‘교만하고 위협적인 사람’으로 원문의 부정적 평가를 유지했습니다.
  alternative_readings:
  - ‘교만하고 두려운 사람’
  - ‘오만하고 무서운 사람’
  rationale: δεινός의 의미 범위를 완전히 한쪽으로 고정하지 않으면서도, 본문이 안티오쿠스를 호의적으로 묘사하지 않는다는 점을 분명히 드러냈습니다.
  doctrine_reference: 어휘적 긴장을 지우지 않는 직역-의역 절충 원칙
