translation:
  language: ko
  text: 그리고 그는 어떤 방법으로도 명령들로 그 민족의 호의를 꺾을 수 없었고, 자기의 모든 위협과 형벌이 무력화되는 것을 보았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: δόγματα는 공식적인 칙령이나 명령을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 본문은 같은 동사 어근 καταλύω를 반복하여, 민족의 호의를 ‘꺾을’ 수 없었고 그의 위협과 형벌도 ‘무력화’되고 있음을 대조합니다.
    reason: lexical_alternative
