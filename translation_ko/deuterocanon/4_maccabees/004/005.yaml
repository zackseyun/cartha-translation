translation:
  language: ko
  text: 그들에 대한 권한을 손에 넣은 뒤, 그는 곧 우리 조국으로 들어왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존하는 이 절의 그리스어 본문은 ‘곧 우리 조국으로’ 뒤에 명시적인 정동사가 없이 끝납니다. 문맥상 뜻을 분명히 하기 위해 한국어 번역에서는 ‘그는 … 들어왔습니다’를 보충했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: λαβών
  english_pob_choice: after taking
  chosen_korean: 받았고
  alternatives_korean:
  - 취하고
  - 얻고
  - 받은 뒤
  lexicon: BDAG
  rationale: aorist 분사로서 앞선 행위를 나타내므로, 본절의 진행을 살려 ‘받았고’로 옮겼습니다. 영어 POB의 ‘after taking’처럼 선행 동작 관계를 자연스럽게 드러냅니다.
- source_word: τὴν περὶ αὐτῶν ἐξουσίαν
  english_pob_choice: authority over them
  chosen_korean: 그들에 대한 권한
  alternatives_korean:
  - 그들 위의 권위
  - 그들에 대한 권세
  - 그들에 대한 통치권
  lexicon: BDAG
  rationale: ἐξουσία는 문맥상 단순한 ‘힘’보다 실제적인 통치·지배 권한을 뜻하므로, 한국어에서는 행정적·정치적 뉘앙스를 살린 ‘권한’으로 옮겼습니다.
- source_word: ταχύ
  english_pob_choice: quickly
  chosen_korean: 곧장
  alternatives_korean:
  - 빨리
  - 신속히
  - 곧
  lexicon: BDAG
  rationale: 행동의 즉시성과 빠른 이동을 함께 담기 위해 ‘곧장’을 택했습니다. 단순한 시간 부사 ‘곧’보다 동작의 방향성과 속도를 조금 더 분명히 드러냅니다.
- source_word: εἰς τὴν πατρίδα ἡμῶν
  english_pob_choice: into our homeland
  chosen_korean: 우리 조국으로
  alternatives_korean:
  - 우리 고향으로
  - 우리의 본국으로
  - 우리의 조국 안으로
  lexicon: LSJ
  rationale: πατρίς는 개인의 고향이 아니라 공동체의 출신지·조국을 가리키므로, 현대 한국어에서 가장 자연스럽고 강한 정치적·민족적 울림을 지닌 ‘조국’으로 옮겼습니다.
theological_decisions:
- issue: 본문이 분사구만 남고 주절 동사가 불완전하게 보이는 점
  chosen_reading: 한국어 본문은 영어 POB처럼 생략된 서술을 보충하지 않고, 원문이 남긴 연결 구조를 최대한 유지했습니다.
  alternative_readings:
  - ‘…그리고 곧 우리 조국으로 들어왔습니다’처럼 보충 동사를 더 분명히 드러내는 번역
  - 분사구를 더 자유롭게 풀어 서술문으로 정리하는 번역
  rationale: 존재하는 그리스어 사본이 불완전하다는 주석 전제를 존중해야 하므로, 의미는 살리되 과도한 보충은 피했습니다.
  doctrine_reference: 본문 비평 및 번역 투명성
- issue: πατρίς의 문화적 무게
  chosen_reading: ‘조국’으로 번역해 개인적 향수보다 집단적·민족적 귀속감을 살렸습니다.
  alternative_readings:
  - 고향
  - 본국
  - 나라
  rationale: 문맥상 공동체의 정치적 귀향/이동을 가리키는 표현이므로, 정서적 축소를 피하고 본래의 사회적 무게를 유지했습니다.
  doctrine_reference: 본문 의미 보존
