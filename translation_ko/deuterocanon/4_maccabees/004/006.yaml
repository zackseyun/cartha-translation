base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/006.yaml
  text: with the accursed Simon and a very heavy force[a]. After coming forward, he said that he had come by the king’s commands[b], in order to take the private funds of the treasury.
  footnotes:
  - marker: a
    text: Or 'a very large army' or 'a most formidable force'; the Greek literally says 'a very heavy force/army,' using 'heavy' metaphorically for oppressive or formidable military strength.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'the private funds of the treasury' likely refers to monies regarded as private or deposited funds within the treasury, not necessarily the whole treasury itself.
    reason: cultural_note
translation:
  language: ko
  text: 저주받은 시몬과 매우 막강한 군대를 거느리고 있었습니다[a]. 그는 다가와서 왕의 명령을 받아 국고에 보관된 사적 자금을 가져가기 위해 왔다고 말했습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘매우 위압적인 군대’나 ‘매우 대규모의 군대’로 옮길 수 있습니다. 그리스어는 ‘무거운/중압적인’이라는 비유를 군사력에 적용합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘국고에 보관된 사적 자금’은 국고 전체라기보다, 그 안에 따로 보관된 사적 예치금이나 개인적 자금을 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: μετὰ τοῦ καταράτου Σίμωνος
  english_pob_choice: with the accursed Simon
  chosen_korean: 저주받은 시몬과 함께
  alternatives_korean:
  - 저주받은 시몬과 더불어
  - 저주에 걸린 시몬과 함께
  lexicon: LSJ
  rationale: κατάρατος는 단순한 부정이 아니라 저주 아래 있거나 저주받을 만한 자를 가리키므로, 강한 비난의 뉘앙스를 살려 「저주받은」으로 옮겼습니다.
- source_word: βαρυτάτου στρατοῦ
  english_pob_choice: a very heavy force
  chosen_korean: 매우 큰 군대
  alternatives_korean:
  - 매우 무거운 군대
  - 매우 위압적인 군대
  - 매우 대규모의 군대
  lexicon: LSJ
  rationale: βαρύς의 문자적 의미는 ‘무거운’이지만, στρατός와 함께 쓰일 때는 압도적·위압적 규모를 드러낼 수 있으므로 한국어에서는 자연스럽게 「매우 큰 군대」로 풀어, 힘의 압박감을 유지했습니다.
- source_word: ταῖς τοῦ βασιλέως ἐντολαῖς ἥκειν ἔλεγεν
  english_pob_choice: he said that he had come by the king’s commands
  chosen_korean: 왕의 명령으로 왔다고 말하며
  alternatives_korean:
  - 왕의 명령으로 왔다고 말하며
  - 왕의 명령을 받고 왔다고 말하며
  lexicon: LSJ
  rationale: ἐντολαῖς는 명령들의 수단/근거를 나타내므로 「왕의 명령으로」가 가장 간결하고 원문 구조를 잘 드러냅니다. ἥκειν은 ‘도착하다/오다’의 뉘앙스를 갖기 때문에 ‘왔다’로 자연스럽게 옮겼습니다.
- source_word: τὰ ἰδιωτικὰ τοῦ γαζοφυλακίου χρήματα
  english_pob_choice: the private funds of the treasury
  chosen_korean: 국고의 사적인 자금
  alternatives_korean:
  - 보물고의 사적인 자금
  - 보관된 사적 자금
  - 국고의 개인 자금
  lexicon: LSJ
  rationale: ἰδιωτικά는 공적·신성한 금고와 대비되는 ‘사적인’ 자금을 뜻하므로 이를 그대로 살렸습니다. γαζοφυλάκιον은 기본적으로 ‘보물고/금고/국고’로 옮길 수 있어, 문맥상 가장 직설적인 「국고」를 택했습니다.
theological_decisions:
- issue: γaζοφυλάκιον을 ‘temple treasury’로 구체화할지 여부
  chosen_reading: 문맥상 성전과 연관되더라도 본문은 단지 ‘국고’로 유지했습니다.
  alternative_readings:
  - 성전 국고
  - 성전 보물고
  rationale: 원문은 γαζοφυλακίου만 말하고 있어, 문맥적 추정은 가능하더라도 본문에 ‘성전’을 덧붙이면 어휘 자체를 넘어서게 됩니다. POB의 직역-검증 원칙에 따라 더 직접적인 표현을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §5
