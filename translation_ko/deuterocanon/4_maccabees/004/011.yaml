base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/011.yaml
  text: So Apollonius[a], having fallen half-dead upon the lifeless court of the sanctuary, stretched out his hands to heaven and with tears begged the Hebrews to pray for him[c][b], so that they might appease the heavenly host.
  footnotes:
  - marker: a
    text: Or 'the precinct of the sanctuary.' The Greek term refers to an enclosed sacred area.
    reason: lexical_alternative
  - marker: b
    text: Or 'to pray for him.' Literally, 'to pray concerning him.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the heavenly army' or 'the host of heaven.' The Greek leaves the precise referent somewhat open.
    reason: alternative_reading
translation:
  language: ko
  text: 그래서 아폴로니오스는 반쯤 죽은 채 성소의 생명 없는 경내[a]에 쓰러져, 두 손을 하늘로 뻗고 눈물을 흘리며 히브리인들에게 자신을 위하여 기도하여[b] 하늘의 군대[c]를 달래도록 간청하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성소의 뜰’ 또는 ‘성소의 둘러싸인 구역’입니다. 그리스어 περίβολος는 둘러싸인 신성한 공간을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자신에 관하여 기도하여’입니다. 직역하면 ‘그에 관하여 기도하며’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘하늘의 군세’ 또는 ‘하늘의 군대’입니다. 그리스어는 정확한 지시 대상을 다소 열어 둡니다.
    reason: alternative_reading
lexical_decisions:
- source_word: καταπεσὼν ... ἡμιθανὴς
  english_pob_choice: having fallen half-dead
  chosen_korean: 거의 죽은 사람처럼 … 쓰러져 있었고
  alternatives_korean:
  - 반쯤 죽은 채
  - 반쯤 죽어 쓰러져
  lexicon: LSJ
  rationale: καταπεσὼν의 선행 동작과 ἡμιθανὴς의 극적인 상태를 함께 살리기 위해, 현재 진행형보다 이미 쓰러져 있던 상태를 자연스럽게 드러냈습니다.
- source_word: ἐπὶ τὸν ἄψυχον τοῦ ἱεροῦ περίβολον
  english_pob_choice: upon the lifeless court of the sanctuary
  chosen_korean: 성소의 생기 없는 뜰에
  alternatives_korean:
  - 성소의 죽은 뜰에
  - 성소의 둘러막힌 뜰에
  lexicon: LSJ
  rationale: περίβολος는 둘러싸인 공간이지만 이 문맥에서는 성소 구역의 뜰/뜰마당이 가장 자연스럽고, ἄψυχον은 문자적 '죽은'보다 장소의 무생명성을 드러내는 '생기 없는'이 적절합니다.
- source_word: παρεκάλει ὅπως περὶ αὐτοῦ εὐξόμενοι
  english_pob_choice: begged the Hebrews to pray for him
  chosen_korean: 히브리인들에게 자기 때문에 기도해 달라고 간청하여
  alternatives_korean:
  - 자기를 위해 기도해 달라고 간청하여
  - 자기에 관해 기도해 달라고 간청하여
  lexicon: BDAG
  rationale: περὶ αὐτοῦ의 직역성은 살리되, 한국어에서는 '자기 때문에'가 문맥상 중보 기도의 목적을 자연스럽게 전달합니다. English audit trail의 'pray concerning him'과 'pray for him' 사이의 긴장을 과도하게 평준화하지 않았습니다.
- source_word: τὸν ἐπουράνιον ... στρατόν
  english_pob_choice: the heavenly host
  chosen_korean: 하늘의 군대를
  alternatives_korean:
  - 하늘의 군대
  - 하늘의 군세
  lexicon: LSJ
  rationale: στρατός의 기본 의미는 군대이며, ἐπουράνιος와 결합된 종교적 맥락에서 '군대'가 가장 직접적입니다. 다만 한국어에서는 '군세'보다 '군대'가 더 명료합니다.
theological_decisions:
- issue: τὸν ἐπουράνιον στρατόν의 정확한 지시 대상
  chosen_reading: 천사들로 한정하지 않고, 본문이 열어 둔 '하늘의 군대'로 유지했습니다.
  alternative_readings:
  - 천사 군대
  - 하늘의 권능 또는 하늘의 군세
  rationale: 그리스어는 지시 대상을 분명히 특정하지 않으므로, 번역에서도 해석을 덧씌우지 않고 열린 의미를 유지하는 것이 본문의 긴장을 보존합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
