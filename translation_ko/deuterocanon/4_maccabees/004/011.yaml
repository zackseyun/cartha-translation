revisions:
- from: 그래서 아폴로니오스는 거의 죽은 사람처럼 성소의 생기 없는 뜰에 쓰러져 있었고, 두 손을 하늘로 뻗은 채 눈물로 히브리인들에게 자기 때문에 기도해 달라고 간청하여, 하늘의 군대를 달래게 하려 하였습니다.[a][b][c]
  to: 그래서 아폴로니오스는 반쯤 죽은 채 성소의 생명 없는 경내[a]에 쓰러져, 두 손을 하늘로 뻗고 눈물을 흘리며 히브리인들에게 자신을 위하여 기도하여[b] 하늘의 군대[c]를 달래도록 간청하였습니다.
  rationale: ‘반쯤 죽은 채’로 ἡμιθανής의 직접적인 상태를 살리고, ‘자신을 위하여 기도하여’로 περὶ αὐτοῦ의 대상 관계를 보존했습니다. ‘달래도록 간청하였습니다’는 ὅπως 이하의 목적을 자연스럽게 반영합니다. ‘경내’는 περίβολος의 포괄적인 공간 의미를 유지하며, ‘하늘의 군대’는 원문의 의도적인 지시 대상의 모호성을 보존합니다. 각주 표지도 각각의 관련 표현 뒤로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:52:10Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 사건의 큰 흐름과 ‘하늘의 군대’의 지시 대상에 대한 개방성을 대체로 보존합니다. 그러나 ἡμιθανής는 ‘거의 죽은 사람처럼’보다 ‘반쯤 죽은 채’가 더 직접적이며, περὶ αὐτοῦ를 ‘자기 때문에’로 옮긴 것은 ‘그를 위하여/그에 관하여’라는 기도의 대상을 ‘그 때문에’라는 원인으로 바꾸므로 수정이 필요합니다. 또한 ὅπως 이하의 목적을 ‘하려 하였습니다’로 처리하면 아폴로니오스 자신의 의도에 무게가 옮겨집니다.
  naturalness: 수정문은 현대 표준어 합쇼체를 유지하면서, 연속된 분사 구문을 ‘쓰러져, … 뻗고 … 간청하였습니다’로 자연스럽게 재현합니다. ‘성소의 생명 없는 경내’는 다소 문어적이지만 원문의 의도적인 무생물성 표현과 장소의 대비를 보존하는 데 적절합니다.
  terminology: ‘성소’, ‘히브리인들’, ‘하늘의 군대’는 적절합니다. περίβολος는 단순한 ‘뜰’보다 ‘경내’가 포괄적이고, στρατός는 ‘군대’로 유지하여 천사 등으로 한정하지 않습니다.
