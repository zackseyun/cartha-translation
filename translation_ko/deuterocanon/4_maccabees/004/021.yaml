  text: For while he was waging war against Ptolemy in Egypt[a], he also heard that, when a report had spread that he was dead, the people of Jerusalem were rejoicing as much as possible; so he quickly marched up against them.
  footnotes:
  - marker: a
    text: Or 'when a rumor had spread that he had died.' The Greek φήμη can denote report, rumor, or public talk; 'report' is used in the main text as the more neutral rendering.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 그가 이집트에서 프톨레마이오스와 전쟁을 벌이고 있을 때, 자신이 죽었다는 소문이 퍼지자 예루살렘 사람들이 더할 나위 없이 기뻐한다는 말을 듣고, 곧 그들을 향해 진군했기 때문입니다.
  philosophy: optimal-equivalence
