  language: ko
  text: 그가 이집트에서 프톨레마이오스와 전쟁을 치르고 있을 때, 또 그가 죽었다는 소문이 퍼지자 예루살렘 사람들[a]이 크게 기뻐하고 있다는 말을 듣고, 그는 신속히 그들을 향해 진군했습니다.
  philosophy: optimal-equivalence
  footnotes:
