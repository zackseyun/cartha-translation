translation:
  language: ko
  text: 그 결과 그는 우리 조국의 바로 그 성채에 체육 교육 기관을 세웠을 뿐만 아니라, 성전을 보호하고 관리하는 제도도 폐지하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리 조국의 바로 그 아크라에’라고 옮길 수 있습니다. ἄκρα를 예루살렘의 특정 성채인 아크라로 볼 경우입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘성전을 돌보는 일’ 또는 ‘성전의 보호·관리’로 옮길 수 있습니다. 그리스어는 성전 건물 자체를 무너뜨렸다는 뜻이 아니라, 성전에 대한 보호·관리 제도를 폐지했다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπʼ αὐτῇ τῇ ἄκρᾳ
  english_pob_choice: at the very citadel
  chosen_korean: 우리 조국의 바로 그 성채에
  alternatives_korean:
