  text: so that he not only built a gymnasium at the very citadel of our homeland[b][a], but also abolished the guardianship of the temple.
  footnotes:
  - marker: a
    text: Or 'at the very Acra of our homeland,' if ἄκρα is taken as the specific Jerusalem citadel rather than a descriptive 'citadel.'
    reason: alternative_reading
  - marker: b
    text: Or 'the oversight/care of the temple.' The Greek speaks of abolishing its custodial administration, not of tearing down the temple itself.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 그는 우리 조국의 바로 그 성채에 체육관을 세울 뿐만 아니라, 성전의 감독권도 폐지하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리 조국의 바로 그 아크라에’라고 옮길 수 있습니다. ἄκρα를 예루살렘의 특정 성채명으로 볼 경우입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘성전의 감독/보호’를 뜻합니다. 그리스어는 성전 자체를 무너뜨린 것이 아니라 그 관리 체계를 없앴다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπʼ αὐτῇ τῇ ἄκρᾳ
  english_pob_choice: at the very citadel
  chosen_korean: 우리 조국의 바로 그 성채에
  alternatives_korean:
  - 우리 조국의 바로 그 아크라에
  - 우리 조국의 바로 그 높은 곳에
  lexicon: LSJ
  rationale: ἄκρα는 문맥상 성채/요새를 가리킬 수 있으므로, 한국어에서는 의미를 드러내는 ‘성채’로 옮기고 αὐτῇ의 강조는 ‘바로 그’로 살렸습니다.
- source_word: τῆς πατρίδος ἡμῶν
  english_pob_choice: of our homeland
  chosen_korean: 우리 조국의
  alternatives_korean:
  - 우리의 고향 땅의
  - 우리의 본토의
  lexicon: LSJ
  rationale: πατρίς의 애국적·고향적 뉘앙스를 현대 표준어로 자연스럽게 담기 위해 ‘조국’을 사용했습니다.
- source_word: γυμνάσιον
  english_pob_choice: gymnasium
  chosen_korean: 체육관
  alternatives_korean:
  - 김나시온
  - 훈련장
  lexicon: LSJ
  rationale: 문맥상 헬레니즘 시대의 γυμνάσιον 기관이지만, 한국어에서 기능상 가장 직접적인 대응은 ‘체육관’이며, 문화적 특수성은 본문 맥락이 보완합니다.
- source_word: καταλῦσαι τὴν ... κηδεμονίαν
  english_pob_choice: abolished the guardianship
  chosen_korean: 감독권도 폐지하였습니다
  alternatives_korean:
  - 보호 감독도 없애버렸습니다
  - 관리권도 해체하였습니다
  lexicon: LSJ
  rationale: κηδεμονία는 단순한 ‘돌봄’보다 제도적 감독·보호의 뜻이 강하므로, 행정적·제도적 의미를 살려 ‘감독권’으로 옮겼습니다.
- source_word: τοῦ ἱεροῦ
  english_pob_choice: the temple
  chosen_korean: 성전의
  alternatives_korean:
  - 성전의 건물의
  - 성소의
  lexicon: LSJ
  rationale: ἱερόν은 이 문맥에서 성전 परिसर 전체를 가리키므로, 한국어 성경 용례에 맞는 ‘성전’으로 번역했습니다.
theological_decisions:
- issue: ἄκρα의 지명 가능성과 일반명사 가능성
  chosen_reading: 일반명사적 의미를 살려 ‘성채’로 번역하되, 특정 지명 ‘아크라’는 본문에 직접 넣지 않았습니다.
  alternative_readings:
  - 아크라
  - 성곽
  rationale: 본문 자체가 지명 표기를 요구하지 않으므로, 의미를 우선하여 읽기 쉬운 서술형 표현을 택했습니다. 다만 역사적 배경상 아크라를 염두에 둘 수 있는 긴장은 유지됩니다.
  doctrine_reference: '번역 원칙: 본문이 말하는 것 이상을 단정하지 않고, 역사적 가능성은 주석으로 열어 둡니다.'
- issue: κηδεμονία τοῦ ἱεροῦ의 성격
  chosen_reading: 성전 자체의 파괴가 아니라 성전의 감독권·관리 체계를 없앤 것으로 옮겼습니다.
  alternative_readings:
  - 성전의 돌봄
  - 성전의 관리
  rationale: 그리스어는 건물 파괴보다 제도적 감독의 철폐를 말하므로, 그 긴장을 살려야 합니다.
  doctrine_reference: '번역 원칙: 텍스트가 지시하는 행정적·제도적 의미를 약화시키지 않습니다.'
