  - 성소의
  lexicon: LSJ
  rationale: ἱερόν은 이 문맥에서 성전 परिसर 전체를 가리키므로, 한국어 성경 용례에 맞는 ‘성전’으로 번역했습니다.
theological_decisions:
- issue: ἄκρα의 지명 가능성과 일반명사 가능성
  chosen_reading: 일반명사적 의미를 살려 ‘성채’로 번역하되, 특정 지명 ‘아크라’는 본문에 직접 넣지 않았습니다.
  alternative_readings:
  - 아크라
  - 성곽
  rationale: 본문 자체가 지명 표기를 요구하지 않으므로, 의미를 우선하여 읽기 쉬운 서술형 표현을 택했습니다. 다만 역사적 배경상 아크라를 염두에 둘 수 있는 긴장은 유지됩니다.
  doctrine_reference: '번역 원칙: 본문이 말하는 것 이상을 단정하지 않고, 역사적 가능성은 주석으로 열어 둡니다.'
- issue: κηδεμονία τοῦ ἱεροῦ의 성격
  chosen_reading: 성전 자체의 파괴가 아니라 성전의 감독권·관리 체계를 없앤 것으로 옮겼습니다.
  alternative_readings:
  - 성전의 돌봄
  - 성전의 관리
  rationale: 그리스어는 건물 파괴보다 제도적 감독의 철폐를 말하므로, 그 긴장을 살려야 합니다.
  doctrine_reference: '번역 원칙: 텍스트가 지시하는 행정적·제도적 의미를 약화시키지 않습니다.'
