  - 관리권도 해체하였습니다
  lexicon: LSJ
  rationale: κηδεμονία는 단순한 ‘돌봄’보다 제도적 감독·보호의 뜻이 강하므로, 행정적·제도적 의미를 살려 ‘감독권’으로 옮겼습니다.
- source_word: τοῦ ἱεροῦ
  english_pob_choice: the temple
  chosen_korean: 성전의
  alternatives_korean:
