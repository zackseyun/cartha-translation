  source_fidelity: ‘자기 형제인 야손’은 한국어에서 주절의 주어인 ‘그’의 형제로 읽히기 쉬우나, 그리스어의 αὐτοῦ는 오니아스를 가리켜 야손이 오니아스의 형제임을 나타냅니다. 또한 ‘야손은 … 약속한 뒤였습니다’는 문장으로 성립하지 않으며, 약속이 야손의 대제사장 임명과 연결되는 원문의 구문을 충실히 재구성할 필요가 있습니다.
  naturalness: ‘폐위하다’는 주로 군주를 왕위에서 물러나게 하는 데 쓰이므로 대제사장 직무의 박탈에는 ‘해임하다’가 현대 표준어에서 더 자연스럽습니다. 수정문은 조건절의 인물 지시도 명확히 하면서 합쇼체 문체를 유지합니다.
  terminology: ‘대제사장직’, ‘대제사장’, ‘달란트’는 적절합니다. ‘그 직위’는 τὴν ἀρχήν의 문맥상 직무/권한을 과도하게 좁히지 않으면서 영어 감사 기록의 ‘office’를 반영합니다. 본문에는 ‘뇌물’이나 ‘지불’ 같은 평가·해석어를 추가하지 않았습니다.
