  yaml_path: translation/deuterocanon/4_maccabees/004/016.yaml
  text: He deposed Onias from the high priesthood and appointed Jason[a], his brother, as high priest, after he promised to give, if he would grant him the office, three thousand six hundred sixty talents per year.
  footnotes:
  - marker: a
    text: Or 'promised to pay'; the Greek simply says 'promised to give,' leaving the corrupt character of the payment to be inferred from the context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 오니아스를 대제사장직에서 폐위하고, 자기 형제인 야손을 대제사장으로 세웠습니다. 야손은 그에게 그 직위를 허락해 준다면, 해마다 삼천육백육십 달란트를 주겠다고 약속한 뒤였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지급하겠다고 약속했다’일 수 있습니다. 그리스어는 단지 ‘주겠다고 약속했다’라고만 하며, 그 지급의 성격은 문맥에서 드러납니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλύσας
  english_pob_choice: deposed
  chosen_korean: 폐위하고
  alternatives_korean:
  - 물러나게 하고
  - 제거하고
  - 해임하고
  lexicon: BDAG
  rationale: 직분을 공식적으로 끝내게 했다는 뜻을 살려, 단순한 ‘제거’보다 공적·정치적 제거를 드러내는 ‘폐위하다’를 택했습니다.
- source_word: τὸν Ὀνίαν τῆς ἀρχιερωσύνης
  english_pob_choice: Onias from the high priesthood
  chosen_korean: 오니아스를 대제사장직에서
  alternatives_korean:
  - 오니아스를 대제사장직으로부터
  - 오니아스를 대제사장 신분에서
  lexicon: BDAG
  rationale: 속격은 오니아스가 그 직분에서 물러난 것이므로, 한국어에서는 ‘~에서’로 직분 상실을 자연스럽게 표현했습니다.
- source_word: κατέστησεν ἀρχιερέα
  english_pob_choice: appointed ... as high priest
  chosen_korean: 대제사장으로 세웠습니다
  alternatives_korean:
  - 대제사장으로 임명했습니다
  - 대제사장으로 만들었습니다
  lexicon: BDAG
  rationale: 공적 직임에 대한 임명을 뜻하므로, 현대 문어체에서 자연스럽고 공식적인 ‘세우다’를 사용했습니다.
- source_word: ὑποσχόμενον δώσειν
  english_pob_choice: after he promised to give
  chosen_korean: 약속한 뒤였습니다
  alternatives_korean:
  - 주겠다고 약속한 뒤였습니다
  - 주기로 약속한 뒤였습니다
  lexicon: BDAG
  rationale: 본문은 ‘주겠다고 약속하다’만 말하며 그 성격을 직접 규정하지 않으므로, 과도한 해석 없이 약속 행위 자체를 드러냈습니다.
theological_decisions:
- issue: 야손의 금전 약속에 대한 평가
  chosen_reading: 본문은 거래의 부정성을 암시하지만, 본문 자체에는 ‘뇌물’이라는 직접 표현이 없으므로 서술형으로 유지했습니다.
  alternative_readings:
  - ‘뇌물을 주기로’처럼 해석적으로 강화하기
  - ‘주겠다고’로만 더 중립적으로 옮기기
  rationale: 원문은 특정 액수의 연간 제공을 말할 뿐이므로, 도덕적 판단은 독자에게 드러나게 두되 본문에 없는 평가어는 덧붙이지 않았습니다.
  doctrine_reference: '번역 원칙: 본문이 말하는 것 이상을 덧붙이지 않고, 드러난 긴장과 암시는 유지합니다.'
