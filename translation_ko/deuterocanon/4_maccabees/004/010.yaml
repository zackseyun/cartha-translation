  rationale: 천사들의 '탑승한/기마의' 형상을 유지하면서 한국어에서 가장 자연스럽고 직관적인 표현으로 옮겼습니다.
theological_decisions:
- issue: οὐρανόθεν의 신학적 방향성
  chosen_reading: 하늘에서
  alternative_readings:
  - 하늘로부터
  - 하늘로부터 내려온
  rationale: 이 장면은 천상적 개입을 가리키므로, 지리적 '하늘'이 아니라 신적 영역으로서의 '하늘에서'를 택했습니다.
  doctrine_reference: Translation philosophy §6
- issue: ἔφιπποι ἄγγελοι의 이미지 보존
  chosen_reading: 말 탄 천사들
  alternative_readings:
  - 말 탄 천사들—
  - 기마 천사들
  rationale: 천사라는 정체성과 기마적 전투 이미지를 함께 드러내기 위해 apposition을 풀어 자연스럽게 서술했습니다.
  doctrine_reference: Translation philosophy §1
