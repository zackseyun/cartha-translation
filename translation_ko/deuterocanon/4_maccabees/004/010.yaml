  lexicon: LSJ
  rationale: ποὺ προς한 움직임을 자연스러운 한국어로 옮기되, 목표를 향해 접근하는 뉘앙스를 살렸습니다.
- source_word: καθωπλισμένης στρατιᾶς
  english_pob_choice: an armed force
  chosen_korean: 무장한 군대
  alternatives_korean:
