  verdict: revise
  source_fidelity: 원문의 γεν격 절대구문과 사건의 순서를 따라 아폴로니우스가 무장한 군대를 이끌고 재물을 빼앗으려 올라오는 때에 천사들이 하늘에서 나타난 것으로 옮겨야 합니다. προυφάνησαν의 ‘전에 앞서’는 한국어로 중복될 뿐 아니라 시간적으로 ‘미리’라는 뜻을 과도하게 확정합니다. περιαστράπτοντες τοῖς ὅπλοις는 천사들이 ‘무기에서’ 번쩍인다는 뜻이 아니라 무기들이 사방으로 번쩍이는 전투적 현상을 나타냅니다.
  naturalness: 초안의 ‘전에 앞서 나타난’은 비문에 가깝고, ‘무기에서 번쩍이며’는 자연스럽지 않으며 의미 관계도 불명확합니다. ‘무기를 사방으로 번쩍이게 하며’는 현대 표준어 합쇼체에서 자연스럽고 원문의 생생한 이미지를 보존합니다.
  terminology: ‘말 탄 천사들’은 ἔφιπποι ἄγγελοι를 정확하고 자연스럽게 반영합니다. ‘재물’은 χρήματα의 복수적·금전적 대상을 포괄하면서 ‘돈’보다 문맥상 격조를 유지합니다. ‘두려움과 공포’는 φόβον τε καὶ τρόμον의 강조된 이중 표현을 보존합니다.
