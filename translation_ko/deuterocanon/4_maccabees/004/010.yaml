  - severity: low
    issue: 각주 a의 부가 설명
    rationale: 각주는 어휘 대안에 집중해야 합니다. ‘하늘에서 무장한 모습’은 본문의 무기 묘사에 기대는 해설이지만 ἔφιπποι 자체의 어휘 대안은 아니므로 삭제하는 편이 적절합니다.
