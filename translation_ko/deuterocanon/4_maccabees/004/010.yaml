  text: And when Apollonius came up with an armed force to seize the money[a], horse-mounted angels appeared beforehand from heaven[b], flashing around with their weapons and putting great fear and terror into them.
  footnotes:
  - marker: a
    text: Or 'mounted angels' or 'angels on horseback.' The Greek literally identifies the heavenly figures as mounted angels.
    reason: lexical_alternative
  - marker: b
    text: Or 'instilling in them great fear and terror.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 아폴로니우스가 무장한 군대를 거느리고 돈을 탈취하러 올라올 때, 하늘에서 전에 앞서 나타난 말 탄 천사들이 무기에서 번쩍이며 그들에게 큰 두려움과 공포를 일으켰습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘말 탄 천사들’ 또는 ‘기마 천사들’입니다. 이 문맥에서 그 천사들은 하늘에서 무장한 모습으로 나타납니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들에게 큰 두려움과 공포를 불어넣으며’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνιόντος
  english_pob_choice: came up
  chosen_korean: 올라올 때
  alternatives_korean:
