  rationale: 군사 집단의 무장 상태를 분명히 하면서도 한국어로 과도하게 장황해지지 않게 옮겼습니다.
- source_word: πρὸς τὴν τῶν χρημάτων ἁρπαγήν
  english_pob_choice: to seize the money
  chosen_korean: 돈을 탈취하러
  alternatives_korean:
  - 돈을 빼앗으러
