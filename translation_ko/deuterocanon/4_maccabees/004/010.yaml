  lexicon: LSJ
  rationale: ἁρπαγή의 강한 강탈·약탈 의미를 살려 단순한 '가져가다'보다 강한 동사를 택했습니다.
- source_word: ἔφιπποι ἄγγελοι
  english_pob_choice: horse-mounted angels
  chosen_korean: 말 탄 천사들
  alternatives_korean:
  - 기마 천사들
