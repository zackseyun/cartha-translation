  naturalness: ‘그런데 그는 그에게’는 한국어에서 지시 대상이 불명확한 채 반복되어 다소 어색합니다. 원문의 대조 접속사 δέ는 문맥상 ‘그러나’ 또는 ‘그런데’로 가능하나, 이 절만으로는 ‘그러나’가 더 직접적입니다. ‘대제사장으로 섬기도록 허락하고 민족을 이끌도록 허락했습니다’는 허가 동사의 지배 범위를 명확히 하지만 반복이 다소 무겁습니다. ‘대제사장으로 섬기고 민족을 이끌도록 그에게 허락했습니다’가 자연스럽고 병렬도 보존합니다.
