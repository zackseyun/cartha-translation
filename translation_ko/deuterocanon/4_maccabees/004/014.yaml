  to: 그리고 뜻밖에 무사히 살아난 그 사람은 자기에게 일어난 일들을 왕에게 알리려고 떠났습니다.
  rationale: 원문의 목적을 나타내는 미래분사 δηλώσων을 ‘알리려고’로 유지하고, ᾤχετο를 단순히 ‘떠났습니다’로 옮겼습니다. ‘무사히 살아난’은 διασωθείς의 위험에서 안전히 벗어난 의미를 자연스럽게 드러내며, 본문에 없는 구출 주체를 특정하지 않습니다.
