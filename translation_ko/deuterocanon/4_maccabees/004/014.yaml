    rationale: 원문은 그가 왕에게 사건을 알릴 목적을 가지고 ‘떠났다’고 할 뿐, 왕에게 갔다가 다시 떠났다고 말하지 않습니다. 한국어 표현도 동작의 방향이 충돌합니다.
  revised_text: 그리고 뜻밖에 무사히 살아난 그 사람은 자기에게 일어난 일들을 왕에게 알리려고 떠났습니다.
