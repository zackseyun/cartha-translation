translation:
  language: ko
  text: 그리고 뜻밖에 무사히 살아난 그 사람은 자기에게 일어난 일들을 왕에게 알리려고 떠났습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραδόξως
  english_pob_choice: unexpectedly
  chosen_korean: 놀랍게도
  alternatives_korean:
  - 예상 밖으로
  - 뜻밖에도
  - 기이하게
  lexicon: LSJ
  rationale: 예상과 다른 상황에서 살아남은 놀라움을 자연스럽게 드러내며, 과도한 기적 강조나 어색한 직역을 피합니다.
- source_word: διασωθεὶς
  english_pob_choice: had been saved
  chosen_korean: 구출된
  alternatives_korean:
  - 무사히 살아난
  - 구해진
  - 보전된
  lexicon: BDAG
  rationale: 위험에서 건져져 살아남은 상태를 간결하게 나타내며, 문맥상 ‘살아남음’보다 더 적극적인 구출의 뉘앙스를 살립니다.
- source_word: δηλώσων
  english_pob_choice: to report
  chosen_korean: 알리려고
  alternatives_korean:
  - 보고하려고
  - 전하려고
  - 보고하기 위해
  lexicon: BDAG
  rationale: 왕에게 사실을 전하는 목적을 자연스럽게 표현하되, 공적인 보고의 성격도 유지합니다.
- source_word: τὰ συμβάντα αὐτῷ
  english_pob_choice: the things that had happened to him
  chosen_korean: 자기에게 일어난 일들
  alternatives_korean:
  - 그에게 닥친 일들
  - 그에게 생긴 일들
  - 그에게 일어난 사건들
  lexicon: BDAG
  rationale: 그에게 실제로 일어난 사건들을 평이하면서도 원문 구조에 가깝게 옮겼습니다.
theological_decisions:
- issue: 이 절의 구원 표현을 신학적으로 확장할지 여부
  chosen_reading: 문맥상 물리적 위험에서의 생존과 탈출을 가리키는 서술로 처리했습니다.
  alternative_readings:
  - 하나님의 구원 행위로 신학적으로 강하게 번역
  - 기적적 보존을 강조하는 번역
  rationale: 본문은 사후 해석보다 사건 서술에 초점이 있어, 과도한 신학적 확장을 피하는 것이 원문에 더 충실합니다.
  doctrine_reference: 문맥 우선의 서술 번역 원칙
