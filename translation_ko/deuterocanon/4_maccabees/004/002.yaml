lexical_decisions:
- source_word: ἥκων
  english_pob_choice: he came
  chosen_korean: 가서
  alternatives_korean:
  - 와서
  - 다가가서
  lexicon: ἥκω
  rationale: 이 문맥에서 ἥκων은 단순한 이동 완료를 나타내므로, POB의 확정된 본문처럼 'he came'에 맞춰 자연스럽게 '가서'로 옮겼습니다.
- source_word: πρὸς Ἀπολλώνιον
  english_pob_choice: to Apollonius
  chosen_korean: 아폴로니우스에게
  alternatives_korean:
  - 아폴로니우스에게로
  - 아폴로니우스를 향해
  lexicon: πρός + 대격
  rationale: 대상을 향한 이동/접근의 방향을 한국어 여격으로 자연스럽게 나타냈습니다.
- source_word: τὸν Συρίας τε καὶ Φοινίκης καὶ Κιλικίας στρατηγόν
  english_pob_choice: the governor of Syria and Phoenicia and Cilicia
  chosen_korean: 시리아와 페니키아와 길리기아의 총독
  alternatives_korean:
  - 시리아와 페니키아와 길리기아의 통치자
  - 시리아와 페니키아와 길리기아의 행정관
  lexicon: στρατηγός
  rationale: ἄρχων류의 일반적 행정권자를 뜻하는 문맥이므로, POB의 'governor'에 맞춰 관청적 뉘앙스가 분명한 '총독'을 사용했습니다.
