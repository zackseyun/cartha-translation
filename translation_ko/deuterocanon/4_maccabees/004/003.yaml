    rationale: ‘무리들’은 μυριάδες의 ‘만(10,000) 단위’라는 수량적 의미를 흐리며, ‘사유 재산’도 여기서는 저장된 화폐·자금의 뜻보다 넓습니다.
  - severity: medium
