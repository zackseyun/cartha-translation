  source_fidelity: 현 번역의 ‘왕의 일에 반대하는 처지에서’는 제시된 그리스어 ἥκω(‘와 있다/도착했다’)에서 나오지 않으며, 영어 POB의 ‘being hostile’도 이 어형의 통상적 의미와 부합하지 않습니다. 또한 ‘많은 사유 재산의 무리들’은 μυριάδες(만 단위들)의 수량 의미를 충분히 전달하지 못합니다. 본문은 ἥκω의 인칭과 Σίμων의 구문적 결합이 비정상적으로 보이므로, 적대성은 첨가하지 않고 ‘왕의 일과 관련하여 와서’로 최소한으로 옮겼습니다.
  naturalness: ‘보물 창고들’, ‘사유 자금이 수만 단위로 많이’, ‘성전과 공유되지 않는’은 현대 표준 한국어의 격식 있는 서술체에서 자연스럽고, 보관 장소·수량·성전 재산과의 비공동성을 각각 명료하게 나타냅니다.
  terminology: Σίμων은 ‘시몬’, Σελεύκῳ τῷ βασιλεῖ는 한국어 관례에 맞춰 ‘세레우코스 왕’으로 표기했습니다. ἰδιωτικῶν χρημάτων은 사적 소유의 성격을 보존하여 ‘사유 자금’으로, τῷ ἱερῷ μὴ ἐπικοινωνούσας는 단순한 관계 부재보다 공유·공동 소유의 함의를 살려 ‘성전과 공유되지 않는’으로 옮겼습니다.
  issues:
