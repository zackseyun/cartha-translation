theological_decisions:
- issue: 예루살렘의 금고들에 대한 소유 주장
  chosen_reading: 이 구절은 성전 재산과 사적 예금을 구별하며, 후자가 왕의 소유라고 주장하는 고발의 논리를 드러냅니다.
  alternative_readings:
  - 성전 사용이 아닌 단순 보관을 말한다고 볼 수 있습니다.
  - ‘무관하게’는 다소 느슨하게 성전과의 비공동성을 뜻할 수 있습니다.
  rationale: 그리스어는 ἰδιωτικῶν χρημάτων과 μὴ ἐπικοινωνούσας τῷ ἱερῷ를 함께 써서 사적 재산이 성전 소유가 아님을 분명히 하므로, 그 긴장을 약화시키지 않도록 옮겼습니다.
  doctrine_reference: 번역 철학 §§1, 5
