  yaml_path: translation/deuterocanon/4_maccabees/004/003.yaml
  text: Simon[a], being hostile to the king’s interests, reported that many tens of thousands of private funds had been stored in the treasuries of Jerusalem, not connected with the temple[c][b], but that these belonged to King Seleucus.
  footnotes:
  - marker: a
    text: Or 'the king’s affairs' or 'the king’s cause' for the phrase involving τοῖς τοῦ βασιλέως πράγμασιν; the Greek expression is somewhat compressed.
    reason: lexical_alternative
  - marker: b
    text: Literally 'many myriads of private monies/funds.'
    reason: lexical_alternative
  - marker: c
    text: Or 'not shared with the temple' or 'not belonging in common to the temple.'
    reason: lexical_alternative
translation:
  language: ko
  text: 시몬은 왕의 일에 반대하는 처지에서, 예루살렘의 금고들에 많은 사유 재산의 무리들이 성전과는 무관하게 저장되어 있다고 알리면서, 그것이 왕 세레우코스에게 속한다고 말했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘왕의 일에 반대하는 처지에서’는 τοῖς τοῦ βασιλέως πράγμασιν ἥκω의 압축을 풀어 옮긴 것으로, 문자적으로는 ‘왕의 일/사안/이해관계’에 관한 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: πολλὰς ἰδιωτικῶν χρημάτων μυριάδας는 문자적으로 ‘사유 재산/자금의 많은 만(萬) 단위들’입니다.
    reason: lexical_alternative
  - marker: c
    text: τῷ ἱερῷ μὴ ἐπικοινωνούσας는 ‘성전과 공동으로 나뉘지 않은’, ‘성전과 공유되지 않은’의 뜻도 가능합니다.
    reason: lexical_alternative
