base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/004.yaml
  text: When Apollonius learned each of these things[a], he praised Simon for his loyalty to the king, but went up to Seleucus and reported the treasury of funds;
  footnotes:
  - marker: a
    text: Or 'reported to him the money treasury.' The Greek verb can suggest reporting or informing, and the phrase for the treasury emphasizes stored funds.
    reason: lexical_alternative
translation:
  language: ko
  text: 아폴로니우스는 이 모든 것을 하나하나 알게 되자, 왕에 대한 시몬의 충성을 칭찬하고, 셀레우코스에게 올라가 그 돈 보물창고를 보고했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보고했습니다’는 κατήμηνυε의 비교적 직접적인 공적 전달 뉘앙스를 따른 번역입니다. 영어 POB는 ‘informed him about’라는 완화된 대안을 주었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτων ἕκαστα
  english_pob_choice: each of these things
  chosen_korean: 이 모든 것을 하나하나
  alternatives_korean:
  - 이 모든 일을 하나하나
  - 이것들 각각을
  lexicon: LSJ
  rationale: ἕκαστα의 분배적 뉘앙스를 살리기 위해 단순히 ‘모두’를 넘어서 ‘하나하나’로 옮겼습니다.
- source_word: γνοὺς
  english_pob_choice: learned
  chosen_korean: 알게 되자
  alternatives_korean:
  - 알고 나서
  - 알아차리자
  lexicon: LSJ
  rationale: 서술적 과거 진행을 자연스럽게 살리면서, 앞선 정황을 파악한 뒤의 행위를 한국어로 매끄럽게 표현했습니다.
- source_word: κηδεμονίας
  english_pob_choice: loyalty to the king
  chosen_korean: 왕에 대한 … 충성
  alternatives_korean:
  - 왕에 대한 관심
  - 왕에 대한 보호
  - 왕을 향한 신실함
  lexicon: LSJ
  rationale: 문맥상 시몬의 태도를 긍정적으로 평가하는 말이므로, POB의 문맥적 해석을 따라 ‘충성’으로 옮겼습니다.
- source_word: κατήμηνυε
  english_pob_choice: reported
  chosen_korean: 보고했습니다
  alternatives_korean:
  - 알렸습니다
  - 신고했습니다
  - 고발했습니다
  lexicon: LSJ
  rationale: 이 동사는 단순 전달보다 공식적 보고의 뉘앙스가 있어, 대상이 물건/재정인 문맥에 맞게 ‘보고했습니다’로 옮겼습니다.
- source_word: τὸν τῶν χρημάτων θησαυρόν
  english_pob_choice: the treasury of funds
  chosen_korean: 그 돈 보물창고
  alternatives_korean:
  - 그 재물 창고
  - 그 돈의 보물창고
  - 재정 창고
  lexicon: LSJ
  rationale: θησαυρός의 저장된 재산 이미지를 살리되, χρημάτων의 금전적 의미를 분명히 하기 위해 ‘돈 보물창고’로 직역했습니다.
- source_word: Σίμωνι / Σέλευκον / Ἀπολλώνιος
  english_pob_choice: Simon / Seleucus / Apollonius
  chosen_korean: 시몬 / 셀레우코스 / 아폴로니우스
  alternatives_korean:
  - 시몽 / 셀류코스 / 아폴로니오스
  lexicon: LSJ
  rationale: 고유명사는 프로젝트 방침에 따라 통용 음역을 따랐습니다.
theological_decisions:
- issue: κηδεμονίας의 의미를 ‘충성’으로 옮길지 여부
  chosen_reading: 시몬의 태도를 왕에 대한 충성으로 이해해 본문을 번역했습니다.
  alternative_readings:
  - 왕에 대한 관심
  - 왕을 돌보는 마음
  - 보호적 관심
  rationale: 문맥상 아폴로니우스가 시몬을 칭찬하는 대목이므로, 단순한 관심보다 정치적·윤리적 충성의 뉘앙스가 더 강하게 드러납니다.
  doctrine_reference: 문맥 해석(서사적 인물 평가)
