base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/013.yaml
  text: Distressed by these words[a], Onias the high priest, although otherwise being careful lest King Seleucus might ever think that Apollonius had been done away with by human plotting and not by divine justice[b], offered some prayer concerning him.
  footnotes:
  - marker: a
    text: Or 'had been killed by a human plot and not by divine judgment.'
    reason: lexical_alternative
  - marker: b
    text: The Greek says literally that Onias 'prayed something concerning him,' leaving somewhat open whether the prayer was for Apollonius or about the matter involving him.
    reason: alternative_reading
translation:
  language: ko
  text: 이 말들 때문에 마음이 괴로워진 오니아스 대제사장은, 그 밖의 일에서는 셀레우코스 왕이 아폴로니오스가 인간의 음모로 죽임을 당한 것이며 신의 정의에 의한 것은 아니라고 생각할까 염려하여 조심하였지만, 그에 관하여 어떤 기도를 드렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인간의 음모로 죽임을 당한 것이며 신의 심판에 의한 것은 아니라고.’
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 문자적으로 오니아스가 ‘그에 관하여 어떤 기도를 드렸다’고 하며, 그 기도가 아폴로니오스를 위한 것인지 그와 관련된 일에 대한 것인지를 다소 열어 둡니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαχθεὶς τοῖς λόγοις
  english_pob_choice: Distressed by these words
  chosen_korean: 이 말들 때문에 마음이 괴로워진
  alternatives_korean:
  - 이 말들에 눌린
  - 이 말들로 인해 괴로워한
  - 이 말들에 마음이 상한
  lexicon: LSJ
  rationale: ἐπαχθεὶς는 앞선 말들에 눌려 마음이 무거워진 상태를 가리키므로, 자연스러운 합쇼체로 ‘마음이 괴로워진’이 감정적 부담을 가장 잘 살립니다.
- source_word: εὐλαβηθεὶς μὴ ποτε νομίσειεν
  english_pob_choice: being careful lest ... might ever think
  chosen_korean: 비록 ...라고 언제든지 생각할까 염려하여 달리 조심하고 있었지만
  alternatives_korean:
  - '...라고 생각할까 봐 조심하고 있었지만'
  - '...라고 오해할까 염려하여'
  - '...라고 생각하지 않도록 주의했지만'
  lexicon: LSJ
  rationale: εὐλαβηθεὶς와 μὴ ποτε νομίσειεν의 경계·우려를 한국어의 ‘염려하여’로 옮기고, ποτε의 반복적 가능성을 ‘언제든지’로 살렸습니다.
- source_word: ἐξ ἀνθρωπίνης ἐπιβουλῆς καὶ μὴ θείας δίκης
  english_pob_choice: by human plotting and not by divine justice
  chosen_korean: 인간의 음모로 죽임을 당한 것이지 신의 정의로 죽임을 당한 것이 아니라고
  alternatives_korean:
  - 인간의 음모로가 아니라 신의 정의로
  - 사람의 계략 때문이지 신의 정의 때문이 아니라고
  - 인간의 음모에 의한 것이지 하나님의 정의에 의한 것이 아니라고
  lexicon: LSJ
  rationale: ἐπιβουλή는 단순한 계획보다 적대적 음모에 가깝고, δίκη는 여기서 ‘정의/심판’의 대비를 이룹니다. POB의 ‘divine justice’를 따라 ‘신의 정의’로 두어 원문 대비를 보존했습니다.
- source_word: ηὔξατό τι περὶ αὐτοῦ
  english_pob_choice: offered some prayer concerning him
  chosen_korean: 그에 관해 무언가 기도를 드렸습니다
  alternatives_korean:
  - 그를 위해 무언가 기도했습니다
  - 그에 대해 어떤 기도를 드렸습니다
  - 그와 관련하여 기도했습니다
  lexicon: LSJ
  rationale: τι가 만들어내는 불특정성을 살려, 기도의 내용과 방향을 단정하지 않는 ‘무언가 기도를 드렸습니다’로 옮겼습니다.
theological_decisions:
- issue: θείας δίκης의 신학적 표현을 한국어에서 어떻게 드러낼지
  chosen_reading: ‘신의 정의’로 옮겨 인간의 음모와의 대조를 유지했습니다.
  alternative_readings:
  - 하나님의 정의
  - 신적 심판
  - 하나님의 심판
  rationale: 원문은 θείας를 사용해 하나님의 직접 명칭보다 ‘신적/하늘의’ 차원을 열어 두며, δίκη는 단순 처벌보다 정의의 성격을 띱니다. POB의 ‘divine justice’를 따라 그 긴장을 유지했습니다.
  doctrine_reference: 원문 긴장 보존; θεός를 명시적으로 덧붙여 과도하게 해석하지 않음.
- issue: ηὔξατό τι περὶ αὐτοῦ의 기도 대상/방향의 모호성
  chosen_reading: ‘그에 관해 무언가 기도를 드렸습니다’로 두어, 그를 위한 기도인지 사건에 대한 기도인지 단정하지 않았습니다.
  alternative_readings:
  - 그를 위해 기도했습니다
  - 그 일에 관해 기도했습니다
  rationale: 그리스어는 περὶ αὐτοῦ 뒤의 τι 때문에 기도의 내용이 불분명합니다. 번역에서 그 모호성을 유지하는 편이 원문에 더 충실합니다.
  doctrine_reference: 해석을 좁히지 않고 원문이 허용하는 범위를 보존함.
