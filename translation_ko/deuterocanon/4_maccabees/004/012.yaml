  text: 그는 자신이 죄를 지어 죽어도 마땅하다고 말했으며, 구출된다면 모든 사람에게 그 거룩한 곳의 복됨을 찬양하겠다고[a] 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 사람에게 그 거룩한 곳의 복됨을 노래하겠다.’ ὑμνήσειεν은 문자적으로 노래하는 행위뿐 아니라 찬송하거나 찬양하는 것을 더 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
