  text: For he said that he had sinned, so that he was worthy even to die, and that, if he were saved, he would sing the blessedness of the holy place to all people.
  footnotes:
  - marker: a
    text: Or, 'he would praise the blessedness of the holy place to all people.' The Greek verb can denote hymn-like praise more generally, not only literal singing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 죄를 지었다고 말했으니, 죽어 마땅한 사람이며, 만일 구원받는다면 모든 사람에게 성스러운 곳의 복된 상태를 찬양할 것이라고 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 사람에게 성스러운 곳의 복된 상태를 노래할 것’이라는 뜻일 수 있습니다. ὑμνέω는 문자적 ‘노래하다’보다 찬송·찬양을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
