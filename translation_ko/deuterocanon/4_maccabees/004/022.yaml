  text: 그리고 그가 그들을 정복한 뒤에, 그들 가운데 누구든 조상들의 율법대로 살고 있는 것으로 드러나면 죽이도록 하는 칙령을 내렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
