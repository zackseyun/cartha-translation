base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/011/005.yaml
  text: Or does it not seem evil that we worship the Creator of all things and live according to his virtuous law?[a][b]
  footnotes:
  - marker: a
    text: Or 'wrong' instead of 'evil.' The Greek κακόν can denote what is morally bad, blameworthy, or wrong.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'his virtuous law' could also be rendered 'his noble law' or 'his excellent law.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아니면 우리가 만물의 창조주를 경배하고 그의 고결한 율법을 따라 산다는 것이 악하다고 여겨지지 않습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘악하다’ 대신 ‘옳지 않다’로도 옮길 수 있습니다. 그리스어 κακόν은 도덕적으로 나쁜 것, 비난받을 것, 또는 잘못을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 고결한 율법’은 ‘그의 덕스러운 율법’ 또는 ‘그의 훌륭한 율법’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ κακὸν οὐ δοκεῖ
  english_pob_choice: Or does it not seem evil
  chosen_korean: 아니면 … 악으로 보이지 않습니까?
  alternatives_korean:
  - 아니면 … 나쁘게 보이지 않습니까?
  - 아니면 … 옳지 않게 보이지 않습니까?
  lexicon: LSJ
  rationale: κακόν의 도덕적·비난적 뉘앙스를 살리기 위해 ‘악’으로 옮겼고, δοκεῖ의 ‘보이다/여겨지다’ 감각은 ‘보이지 않습니까’로 자연스럽게 살렸습니다.
- source_word: τὸν πάντων κτίστην
  english_pob_choice: the Creator of all things
  chosen_korean: 모든 것의 창조주
  alternatives_korean:
  - 모든 것의 만드신 이
  - 만물의 창조주
  lexicon: LSJ
  rationale: πάντων을 포괄적으로 살려 ‘모든 것의’로 옮겼고, κτίστην은 신학적으로 격식 있는 ‘창조주’가 가장 직접적입니다.
- source_word: εὐσεβοῦμεν
  english_pob_choice: we worship
  chosen_korean: 경배하고
  alternatives_korean:
  - 경건을 드리고
  - 공경하고
  lexicon: LSJ
  rationale: 하나님께 대한 종교적 행위를 가리키므로 단순한 ‘공경’보다 예배적 행위를 드러내는 ‘경배하다’가 source-direct합니다.
- source_word: ἔναρετον … νόμον
  english_pob_choice: his virtuous law
  chosen_korean: 그의 고결한 율법
  alternatives_korean:
  - 그의 덕스러운 율법
  - 그의 훌륭한 율법
  lexicon: LSJ
  rationale: ἔναρετος는 ‘덕 있는, 고결한, 뛰어난’의 뜻이므로 ‘고결한’이 윤리적 우수성을 간결하게 담습니다. νόμος는 여기서 단순한 법보다 토라적·신앙적 규범을 가리켜 ‘율법’이 적절합니다.
- source_word: ζῶμεν
  english_pob_choice: live
  chosen_korean: 따라 산다는
  alternatives_korean:
  - 살아간다는
  - 그에 따라 산다는
  lexicon: LSJ
  rationale: ζῶμεν은 삶의 방식 전체를 가리키므로 한국어에서는 ‘따라 산다’로 옮겨 뒤의 기준 문구와 결합되게 했습니다.
theological_decisions:
- issue: rhetorical question and argumentative force of ἢ
  chosen_reading: 아니면 … 보이지 않습니까?
  alternative_readings:
  - 아니면 … 악으로 여겨지지 않습니까?
  - 아니면 … 악하다고 생각되지 않습니까?
  rationale: 앞 문맥의 변론적 흐름을 살리기 위해 문장 첫머리의 접속적 ‘아니면’을 유지하고, 반문 형식을 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §5
- issue: Rendering of εὐσεβοῦμεν toward God
  chosen_reading: 경배하고
  alternative_readings:
  - 경건히 섬기고
  - 공경하며
  rationale: 대상은 ‘모든 것의 창조주’이므로 단순한 윤리적 태도보다 예배적 충성의 의미가 필요해 ‘경배하다’가 가장 분명합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 6
