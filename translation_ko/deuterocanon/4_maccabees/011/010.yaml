  source_fidelity: 초안의 ‘그들의 허리’는 αὐτοῦ(그의)를 잘못 옮긴 것으로, 고문당하는 한 사람의 허리를 가리켜야 합니다. 또한 ‘해체’는 사람의 신체가 사지별로 찢기는 ἐξεμελίζετο의 뜻에 맞지 않는 현대 한국어 용법입니다. ‘무릎 꿇린’은 본문에 없는 강제 동작을 직접 진술하므로, 자세를 나타내는 ‘무릎을 꿇은 채’가 더 충실합니다.
  naturalness: ‘그것에 무릎 꿇린 채로’, ‘거기에다가’, ‘그 둘레에서’는 지시 대상과 문장 연결이 다소 불분명합니다. 고문 장치와 쐐기를 각각 명시하고, 분사구문의 관계를 한국어에서 자연스럽게 재구성했습니다.
  terminology: ποδάγραις는 발·다리용 쇠구속구이므로 ‘그의 다리에 쇠 족쇄를 채우고’로 분명히 했습니다. ὀσφύς는 ‘허리’, τροχιαῖον σφῆνα는 해석을 과도하게 확정하지 않는 ‘바퀴의 쐐기’로 유지했습니다. ἐξεμελίζετο는 지속되는 사지 분리를 나타내어 ‘사지가 찢겨 나가고 있었습니다’로 옮겼습니다.
  issues:
