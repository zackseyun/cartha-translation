  text: And after heating sharp spits[a], they applied them to his back; and after piercing his sides, they burned his entrails from it.
  footnotes:
  - marker: a
    text: Literally, 'from him.' The phrase likely describes the burning as reaching into his inner parts after his sides were pierced; hence 'from within.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 날카로운 쇠꼬챙이들을 달군 뒤 그것들을 그의 등에 갖다 대었으며, 그의 옆구리를 꿰뚫은 뒤 그의 몸에서 그의 내장을 태웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그에게서’ 또는 ‘그로부터’입니다. 이 표현의 정확한 연결 관계는 분명하지 않습니다. 문맥상 옆구리를 꿰뚫은 뒤 몸 안의 내장에 불을 가했다는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀβελίσκους
  english_pob_choice: spits
  chosen_korean: 쇠꼬챙이들
  alternatives_korean:
  - 꼬챙이들
  - 침봉들
  - 작은 꼬챙이들
  lexicon: LSJ
  rationale: ὀβελίσκος는 작고 뾰족한 금속 꼬챙이 또는 살꼬챙이를 가리키므로, 한국어에서는 물질성과 도구성을 살린 ‘쇠꼬챙이들’이 가장 자연스럽습니다.
- source_word: ὀξεῖς
  english_pob_choice: sharp
  chosen_korean: 날카로운
  alternatives_korean:
  - 뾰족한
  - 예리한
  lexicon: LSJ
  rationale: 도구의 찌르고 꿰뚫는 성질을 분명히 해야 하므로, 직설적이고 문맥에 맞는 ‘날카로운’으로 옮겼습니다.
- source_word: πυρώσαντες
  english_pob_choice: after heating
  chosen_korean: 달군 뒤
  alternatives_korean:
  - 가열한 뒤
  - 불에 달군 뒤
  lexicon: LSJ
  rationale: 행위의 선후를 드러내는 분사이므로, 고문 도구를 미리 뜨겁게 만든 뒤라는 순서를 살려 ‘달군 뒤’로 표현했습니다.
- source_word: ἀπʼ αὐτοῦ
  english_pob_choice: from it
  chosen_korean: 그 안쪽에서
  alternatives_korean:
  - 그에게서
  - 그로부터
  - 그 안에서
  lexicon: LSJ
  rationale: 직역은 ‘그로부터/그에게서’이지만, 앞의 ‘옆구리를 꿰뚫은’ 뒤에 이어지는 고문 결과가 몸 안쪽으로 번지는 뜻이므로, POB의 주석 취지를 따라 ‘그 안쪽에서’로 옮겼습니다.
