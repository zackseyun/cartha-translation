  text: And after heating sharp spits[a], they applied them to his back; and after piercing his sides, they burned his entrails from it.
  footnotes:
  - marker: a
    text: Literally, 'from him.' The phrase likely describes the burning as reaching into his inner parts after his sides were pierced; hence 'from within.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 날카로운 쇠꼬챙이들을 달군 뒤 그의 등 위에 대었으며, 그의 옆구리들을 꿰뚫은 뒤 그 안쪽에서 그의 창자들을 태웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그에게서’입니다. 문맥상 옆구리를 꿰뚫은 뒤 불이 몸 안쪽으로 번져 창자에 이르렀다는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀβελίσκους
  english_pob_choice: spits
  chosen_korean: 쇠꼬챙이들
  alternatives_korean:
  - 꼬챙이들
  - 침봉들
  - 작은 꼬챙이들
  lexicon: LSJ
  rationale: ὀβελίσκος는 작고 뾰족한 금속 꼬챙이 또는 살꼬챙이를 가리키므로, 한국어에서는 물질성과 도구성을 살린 ‘쇠꼬챙이들’이 가장 자연스럽습니다.
