  - 불에 달군 뒤
  lexicon: LSJ
  rationale: 행위의 선후를 드러내는 분사이므로, 고문 도구를 미리 뜨겁게 만든 뒤라는 순서를 살려 ‘달군 뒤’로 표현했습니다.
- source_word: ἀπʼ αὐτοῦ
  english_pob_choice: from it
  chosen_korean: 그 안쪽에서
  alternatives_korean:
