  terminology: ‘젊은이들’은 μειράκια의 젊은 남성들을 자연스럽게 나타내며, ‘폭정’은 τὴν τυραννίδα의 부정적·억압적 성격을 적절히 드러냅니다. ‘당신의’는 σου를 정확히 반영합니다.
