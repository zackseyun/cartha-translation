  source_fidelity: 그리스어 ἓξ μειράκια κατελύσαμέν σου τὴν τυραννίδα의 주어(여섯 젊은이), 완료된 승리 선언의 아오리스트, 2인칭 단수 소유격, 그리고 τυραννίς의 억압적 통치라는 뜻을 충실히 반영했습니다. ‘무너뜨렸습니다’는 문자적 정권 교체로 한정하지 않으면서도 본문의 단호한 수사적 선언을 유지합니다.
