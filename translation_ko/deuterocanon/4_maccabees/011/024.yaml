  alternatives_korean:
  - 육
  lexicon: LSJ
  rationale: 수사 ἓξ를 자연스러운 현대 한국어 수사로 옮겼습니다.
- source_word: μειράκια
  english_pob_choice: young men
  chosen_korean: 젊은이들
  alternatives_korean:
  - 소년들
  - 청년들
  - 젊은 남자들
  lexicon: LSJ
  rationale: 감소형 복수형이지만, 이 장면에서 화자와 형제들의 젊음을 드러내되 유치하게 들리지 않도록 ‘젊은이들’로 옮겼습니다.
- source_word: κατελύσαμέν
  english_pob_choice: have overthrown
  chosen_korean: 무너뜨렸습니다
  alternatives_korean:
  - 전복했습니다
  - 무너뜨려 버렸습니다
  - 무너뜨렸습니다
  lexicon: LSJ
  rationale: καταλύω의 여기서의 뜻은 폭압적 권세를 무너뜨리는 것이므로, 결과의 완결성을 살리되 과도하게 정치적 혁명 용어로 굳히지 않도록 했습니다.
- source_word: τὴν τυραννίδα
  english_pob_choice: tyranny
  chosen_korean: 폭정
  alternatives_korean:
  - 압제
  - 독재
  - 폭압적 통치
  lexicon: LSJ
  rationale: τυραννίς는 단순한 통치가 아니라 억압적이고 폭군적인 지배를 가리키므로, 현대 한국어에서 그 폭력성과 부정성을 직접 드러내는 ‘폭정’을 택했습니다.
theological_decisions:
- issue: 승리 선언의 과장과 역사적 사실의 구분
  chosen_reading: 문자적 정권 전복이 아니라, 순교자들의 신실함이 폭군의 권세를 도덕적·영적 의미에서 무너뜨렸다는 수사로 옮겼습니다.
  alternative_readings:
  - 직역하여 ‘전복했습니다’로 둘 수 있음
  - 완화하여 ‘끝장냈습니다’로 둘 수 있음
  rationale: 본문은 승리의 선언적 어조를 띠며, 한국어도 그 승전 선언을 유지해야 합니다. 다만 역사적 반란으로 오해되지 않도록 의미 범위를 조절했습니다.
  doctrine_reference: Optimal equivalence; preserve rhetorical triumph without over-literalizing political overthrow
