  - 폭압적 통치
  lexicon: LSJ
  rationale: τυραννίς는 단순한 통치가 아니라 억압적이고 폭군적인 지배를 가리키므로, 현대 한국어에서 그 폭력성과 부정성을 직접 드러내는 ‘폭정’을 택했습니다.
theological_decisions:
- issue: 승리 선언의 과장과 역사적 사실의 구분
  chosen_reading: 문자적 정권 전복이 아니라, 순교자들의 신실함이 폭군의 권세를 도덕적·영적 의미에서 무너뜨렸다는 수사로 옮겼습니다.
  alternative_readings:
  - 직역하여 ‘전복했습니다’로 둘 수 있음
  - 완화하여 ‘끝장냈습니다’로 둘 수 있음
  rationale: 본문은 승리의 선언적 어조를 띠며, 한국어도 그 승전 선언을 유지해야 합니다. 다만 역사적 반란으로 오해되지 않도록 의미 범위를 조절했습니다.
  doctrine_reference: Optimal equivalence; preserve rhetorical triumph without over-literalizing political overthrow
