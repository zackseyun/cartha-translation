  yaml_path: translation/deuterocanon/4_maccabees/011/002.yaml
  text: I am not about to shrink back[a], tyrant, from the torture for the sake of virtue.
  footnotes:
  - marker: a
    text: Or 'I will not refuse the torture for the sake of virtue.' The Greek verb can denote declining or refusing, but in context it carries the sense of not recoiling from suffering.
    reason: lexical_alternative
translation:
  language: ko
  text: 폭군이여, 나는 덕을 위하여 받을 고문을 피하지 않겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘덕을 위하여 받을 고문을 거절하지 않겠습니다’로 옮길 수 있습니다. 그리스어 동사는 거절하거나 사양한다는 뜻을 가질 수 있으나, 이 문맥에서는 고통을 피하거나 물러서지 않고 감수한다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ μέλλω
  english_pob_choice: I am not about to
  chosen_korean: 물러서지 않겠습니다
  alternatives_korean:
  - 거부하지 않겠습니다
  - 주저하지 않겠습니다
  - 물러나지 않겠습니다
  lexicon: BDAG
  rationale: μέλλω + 부정은 임박한 결심과 강한 의지를 드러내므로, ‘물러서지 않겠습니다’가 단순한 미래 부정보다 두려움 앞에서의 비굴한 후퇴 거부를 잘 살립니다.
- source_word: τύραννε
  english_pob_choice: tyrant
  chosen_korean: 폭군이여
  alternatives_korean:
  - 독재자여
  - 폭군
  lexicon: LSJ
  rationale: 직접 호격으로 상대를 규정하는 모욕적·대결적 뉘앙스를 살리기 위해 ‘폭군이여’로 옮겼습니다.
- source_word: πρὸς τὸν ... βασανισμόν
  english_pob_choice: from the torture
  chosen_korean: 고문 앞에서
  alternatives_korean:
  - 고문에서
  - 고문으로부터
  - 고문의 앞에서
  lexicon: LSJ
  rationale: παραιτεῖσθαι와 결합한 관계를 한국어에서 가장 자연스럽게 드러내기 위해 ‘고문 앞에서’로 옮겨, 고통을 회피하려는 후퇴의 이미지를 유지했습니다.
- source_word: ὑπὲρ τῆς ἀρετῆς
  english_pob_choice: for the sake of virtue
  chosen_korean: 덕을 위한
  alternatives_korean:
  - 덕을 위하여
  - 덕을 위해
  - 탁월함을 위한
  lexicon: LSJ
  rationale: ἀρετή의 윤리·철학적 의미를 한국어 ‘덕’으로 간결하게 살리되, ὑπέρ의 목적성을 반영해 ‘위한’ 구조로 처리했습니다.
theological_decisions:
- issue: ἀρετή의 철학적·윤리적 의미 범주
  chosen_reading: 덕
  alternative_readings:
  - 탁월함
  - 미덕
  rationale: 이 문맥의 ἀρετή는 단순한 도덕 규범보다 순교적 인내를 떠받치는 윤리적 탁월성을 가리키므로, 한국어로는 고전적이면서도 문맥에 맞는 ‘덕’이 가장 적절합니다.
  doctrine_reference: Translation philosophy §5 (key term consistency with documented exceptions)
