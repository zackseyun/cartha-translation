translation:
  language: ko
  text: 나는, 폭군이여, 덕을 위한 고문 앞에서 물러서지 않겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘덕을 위해 고문을 거부하지 않겠습니다.’로 옮길 수 있습니다. 그리스어 동사는 거절·사양의 뜻을 가질 수 있으나, 문맥상 여기서는 고통을 외면하지 않고 맞서는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ μέλλω
  english_pob_choice: I am not about to
  chosen_korean: 물러서지 않겠습니다
  alternatives_korean:
  - 거부하지 않겠습니다
  - 주저하지 않겠습니다
  - 물러나지 않겠습니다
  lexicon: BDAG
  rationale: μέλλω + 부정은 임박한 결심과 강한 의지를 드러내므로, ‘물러서지 않겠습니다’가 단순한 미래 부정보다 두려움 앞에서의 비굴한 후퇴 거부를 잘 살립니다.
