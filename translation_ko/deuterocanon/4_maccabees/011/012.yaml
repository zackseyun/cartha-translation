  yaml_path: translation/deuterocanon/4_maccabees/011/012.yaml
  text: “Good,” said the tyrant[a], though unwillingly, “he grants us favors—good indeed—by giving us the opportunity, through nobler sufferings[b], to display our endurance for our law.”
  footnotes:
  - marker: a
    text: Or “against his will.” The Greek ἄκων marks that the speaker’s acknowledgment is reluctant.
    reason: lexical_alternative
  - marker: b
    text: 'The phrase “grants us favors” is ironic: the persecutor’s tortures become an occasion for the martyrs to show their steadfastness.'
    reason: cultural_note
translation:
  language: ko
  text: “좋습니다.” 폭군이 마지못해 말했습니다[a]. “그가 우리에게 은혜를 베풉니다[b]—참으로 좋습니다—더 고결한 고난을 통해 우리 율법에 대한 인내를 드러낼 기회를 우리에게 주고 있으니 말입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘마지못해’는 ἄκων이 그 인정 또는 발화가 자발적이지 않았음을 나타내는 뉘앙스를 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘우리에게 은혜를 베풉니다’는 역설적 표현입니다. 박해자가 가하는 고난이 순교자들이 율법에 대한 인내를 드러낼 기회가 된다는 뜻입니다.
    reason: cultural_note
