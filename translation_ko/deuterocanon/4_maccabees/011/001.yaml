translation:
  language: ko
  text: 그리고 이 사람도 고문으로 혹독한 학대를 당한 끝에 죽자, 다섯째가 신호를 보내며 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다섯째가 나섰다’로도 옮길 수 있습니다. 그러나 그리스어는 그가 보낸 신호나 몸짓의 대상이 무엇인지는 명시하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  english_pob_choice: And when
  chosen_korean: 그리고 …-았을 때
  alternatives_korean:
  - 그런데 …-았을 때
  - 그리고 나서 …-자
  lexicon: LSJ
  rationale: 연결사 δέ와 시간 부사절의 흐름을 살리되, 앞선 순서 서술을 자연스럽게 잇는 합쇼체 표현으로 옮겼습니다.
- source_word: καὶ οὗτος
  english_pob_choice: this one also
  chosen_korean: 이 사람도
  alternatives_korean:
  - 이 사람 역시
  - 그도
  lexicon: LSJ
  rationale: 지시대명사 οὗτος가 직전의 인물을 가리키는 점과 반복적 순차를 살려, 맥락상 분명한 ‘이 사람도’로 옮겼습니다.
- source_word: ταῖς βασάνοις
  english_pob_choice: under torture
  chosen_korean: 고문 아래에서
  alternatives_korean:
  - 고문 중에
  - 고문을 당한 뒤
  lexicon: LSJ
  rationale: βάσανοι의 가해진 고문/심문 고통을 그대로 반영하면서, 한국어에서 자연스러운 처소·상태 표현으로 처리했습니다.
- source_word: παρεσήμαινεν
  english_pob_choice: came forward
  chosen_korean: 나서며
  alternatives_korean:
  - 신호하며
  - 손짓하며
  lexicon: LSJ
  rationale: 이 동사는 단순한 ‘말하다’가 아니라 몸짓으로 자신을 드러내거나 앞으로 나오는 동작을 가리킬 수 있으므로, 해석을 과도하게 좁히지 않으면서 전개를 자연스럽게 드러내는 ‘나서며’로 옮겼습니다.
theological_decisions:
- issue: 순교 서술의 폭력성 보존
  chosen_reading: ‘고문 아래에서 죽었을 때’로 옮겨, 본문의 잔혹한 수난 상황을 완화하지 않았습니다.
  alternative_readings:
  - ‘고문 속에서’
  - ‘고문을 받다가’
  rationale: 바사노이의 실제 가해 상황과 죽음의 결과를 함께 드러내는 것이 본문이 강조하는 순교 서사의 긴장을 더 정확히 전달합니다.
  doctrine_reference: 4 Maccabees의 순교-인내 서사
