  source_fidelity: ‘나서며’는 παρεσήμαινεν(신호를 보내다, 표시하다)의 몸짓·표시 의미를 ‘앞으로 나오다’라는 행동으로 좁혀 옮긴 것입니다. 또한 καταικισθείς는 단순히 고문이라는 상황만이 아니라 혹독한 학대·능욕을 당한 상태를 나타내므로 이를 드러내는 편이 원문에 더 충실합니다.
  naturalness: ‘고문 아래에서’는 현대 표준 한국어에서 다소 번역투입니다. ‘고문으로 혹독한 학대를 당한 끝에’와 ‘신호를 보내며 말했습니다’가 문맥과 합쇼체 서술에 자연스럽습니다.
  terminology: ‘고문’은 βάσανοι에 적절하며, καταικισθείς의 가혹한 처우는 ‘혹독한 학대’로 보완했습니다. 인물 지칭과 순서 표현인 ‘이 사람도’, ‘다섯째’는 문맥상 유지할 수 있습니다.
