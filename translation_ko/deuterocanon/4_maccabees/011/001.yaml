    issue: παρεσήμαινεν의 ‘신호를 보내다’ 의미가 ‘나서며’로 대체되었습니다.
    rationale: 원문은 몸짓이나 표시의 대상은 밝히지 않은 채 그가 신호를 보냈다고 서술합니다. ‘나서다’는 가능한 문맥적 추론일 수 있으나 본문의 명시적 어휘 의미를 보존하지 못합니다.
