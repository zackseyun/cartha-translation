  - 손짓하며
  lexicon: LSJ
  rationale: 이 동사는 단순한 ‘말하다’가 아니라 몸짓으로 자신을 드러내거나 앞으로 나오는 동작을 가리킬 수 있으므로, 해석을 과도하게 좁히지 않으면서 전개를 자연스럽게 드러내는 ‘나서며’로 옮겼습니다.
