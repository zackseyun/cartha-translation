  rationale: 바사노이의 실제 가해 상황과 죽음의 결과를 함께 드러내는 것이 본문이 강조하는 순교 서사의 긴장을 더 정확히 전달합니다.
  doctrine_reference: 4 Maccabees의 순교-인내 서사
