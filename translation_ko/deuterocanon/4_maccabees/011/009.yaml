theological_decisions:
- issue: 고문 기구 καταπέλτην의 번역
  chosen_reading: 본문에는 ‘바퀴’로 두되, 의미상 고문 도구를 가리키는 표현으로 읽힙니다.
  alternative_readings:
  - 카타펠트
  - 고문 기계
  - 형벌의 바퀴
  rationale: 이 단어는 문자적으로는 다른 기계도 뜻할 수 있으나, 순교 고문 문맥에서는 실행 장치로 이해하는 것이 자연스럽습니다. 너무 기술적인 번역은 현대 독자에게 전장용 무기로 오해될 수 있어 피했습니다.
  doctrine_reference: 문맥적 의미 우선 원칙
