    text: 또는 ‘고문 기계’로도 옮길 수 있습니다. 그리스어는 문자적으로 ‘투석기’를 뜻할 수 있지만, 여기서는 고문에 쓰인 기구를 가리킵니다.
    reason: lexical_alternative
