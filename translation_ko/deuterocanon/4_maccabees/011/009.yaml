translation:
  language: ko
  text: 그가 그런 말을 하고 있을 때에, 경호병들이 그를 묶고는 바퀴로 끌고 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘고문 기계’로도 옮길 수 있습니다. 그리스어는 문자적으로 ‘투석기’를 뜻할 수 있지만, 여기서는 고문에 쓰인 기구를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιαῦτα
  english_pob_choice: such things
  chosen_korean: 그런 말
  alternatives_korean:
