  lexicon: LSJ
  rationale: γυμνασία의 훈련/연습 비유를 유지하되, πόνων을 한국어에서 가장 자연스럽게 받는 '고난'으로 옮겨 책의 운동 경기적 비유를 보존했습니다.
- source_word: οὐκ ἐνικήθημεν
