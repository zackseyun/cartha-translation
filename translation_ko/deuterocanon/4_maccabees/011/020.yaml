  text: But while he was being tortured[a], as one belonging to a holy age, he said, “For the sake of godliness, when so many brothers were called into training in sufferings, we were not conquered.”
  footnotes:
  - marker: a
    text: Or 'as one of a sacred way of life' or 'as one belonging to a holy life.' The Greek phrase is unusual and may describe a consecrated manner of life rather than an 'age' in a temporal sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그가 고문을 당하고 있는 동안, 거룩한 시대에 속한 사람으로서 이렇게 말했습니다. “경건함 때문에 이처럼 많은 형제들이 고난의 훈련으로 부름을 받았을 때, 우리는 굴복당하지 않았습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “거룩한 삶의 방식에 속한” 또는 “거룩한 삶에 속한”으로도 옮길 수 있습니다. 이 그리스어 구문은 특이하며, 시간적 ‘시대’라기보다 성별된 삶의 양식을 가리킬 수 있습니다.
    reason: lexical_alternative
