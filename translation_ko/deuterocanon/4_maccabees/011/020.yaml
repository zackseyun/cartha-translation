  yaml_path: translation/deuterocanon/4_maccabees/011/020.yaml
  text: But while he was being tortured[a], as one belonging to a holy age, he said, “For the sake of godliness, when so many brothers were called into training in sufferings, we were not conquered.”
  footnotes:
  - marker: a
    text: Or 'as one of a sacred way of life' or 'as one belonging to a holy life.' The Greek phrase is unusual and may describe a consecrated manner of life rather than an 'age' in a temporal sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그는 고문을 당하면서, 성스러운 삶의 방식을 지닌 이로서[a] 이렇게 말했습니다. “경건을 위하여 이처럼 많은 형제들이 고난의 훈련에 부름을 받았으나, 우리는 정복당하지 않았습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “성스러운 시대에 속한 이로서”입니다. 또는 “성스러운 삶에 속한 이로서”로도 옮길 수 있습니다. 이례적인 그리스어 구문은 시간상의 시대라기보다 성별된 삶 또는 삶의 방식을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασανιζόμενος
