  source_fidelity: 기존 번역은 βασανιζόμενος, εὐσέβεια, γυμνασία πόνων 및 수동형 οὐκ ἐνικήθημεν의 큰 뜻을 대체로 반영합니다. 다만 ἱεροπρεποῦς αἰῶνος를 ‘거룩한 시대에 속한 사람’으로 옮기면 한국어에서는 시간상의 시대를 뜻하는 것으로 지나치게 굳어져, 원문의 압축된 ‘성스러운 삶/존재 방식’의 용법을 충분히 전달하지 못합니다. 본문은 가장 개연적인 삶의 방식의 뜻으로 옮기고, 각주에서 문자적·대안적 이해를 보존하는 것이 안전합니다.
  naturalness: ‘굴복당하지 않았습니다’는 현대 한국어에서 비문에 가깝습니다. 수동적 패배/정복의 이미지는 ‘정복당하지 않았습니다’로 자연스럽게 유지할 수 있습니다. 또한 ‘훈련으로 부름을 받다’보다 ‘훈련에 부름을 받다’가 한국어의 결합과 εἰς의 방향성을 더 잘 살립니다.
  terminology: ‘고문을 당하면서’, ‘경건을 위하여’, ‘고난의 훈련’, ‘형제들’, ‘정복당하지 않았습니다’는 현대 합쇼체와 본문의 순교·경기 비유 문맥에 적절합니다. ‘성스러운 삶의 방식을 지닌 이로서’는 ἱεροπρεποῦς αἰῶνος의 유력한 의미를 과도한 교리화 없이 반영하며, 각주가 남은 어휘적 불확실성을 보존합니다.
