  terminology: βασανίζειν/βασάνιζε는 이 문맥에서 ‘고문하다’가 적절합니다. ‘부정한 음식’은 문맥상 오염·더러움을 초래하는 음식이라는 뜻을 자연스러운 한국어로 전달합니다. 다만 원문의 표현은 음식이라는 명사를 명시하지 않는 것으로 볼 여지가 있으므로 각주에서 이를 밝혀 둡니다.
