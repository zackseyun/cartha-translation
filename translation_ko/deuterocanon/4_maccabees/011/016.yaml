- from: 그러므로 만일 당신에게 우리를 더럽힘의 음식을 먹지 않는 자들로 고문하는 것이 좋게 보인다면, 우리를 고문하십시오.[a]
  to: 그러므로 만일 당신께서 부정한 음식을 먹지 않는 사람들을 고문하는 것이 좋다고 여기신다면, 우리를 고문하십시오.[a]
  rationale: 원문의 조건절은 왕에게 ‘그러한 사람들을 고문하는 것이 좋게 보인다면’이라고 도전하고, 결론 명령은 문맥상 암시된 목적어를 밝혀 ‘우리’를 고문하라고 합니다. 이를 한국어의 자연스러운 문장 구조로 재구성했습니다. ‘부정한 음식’은 문맥상 함의를 명료하게 전달하며, 원문의 압축된 어휘는 각주에서 보존했습니다.
