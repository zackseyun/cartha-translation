  text: So if it seems good to you to torture those who do not eat defiling food[a], torture us.
  footnotes:
  - marker: a
    text: Greek literally, 'those not having eaten pollution/defilement'; the sense in context is those who have refused defiling food.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 만일 당신께서 부정한 음식을 먹지 않는 사람들을 고문하는 것이 좋다고 여기신다면, 우리를 고문하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘더러움/오염을 먹지 않는 사람들’에 가깝습니다. 문맥상 이는 부정한 음식을 먹기를 거부한 사람들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστʼ
  english_pob_choice: So
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 따라서
  lexicon: LSJ
  rationale: 앞선 논증에서 이어지는 결론을 자연스러운 현대 한국어로 표시하기 위해 ‘그러므로’를 택했습니다.
- source_word: εἰ σοὶ δοκεῖ
  english_pob_choice: if it seems good to you
  chosen_korean: 만일 당신에게 … 좋게 보인다면
  alternatives_korean:
  - 만일 당신이 … 좋다고 생각한다면
  - 당신이 … 좋게 여기신다면
  lexicon: LSJ
  rationale: δοκεῖ + 여격의 관용적 의미를 살려, 단순한 인지보다 ‘좋게 보이다/여기다’의 뉘앙스를 유지했습니다.
- source_word: μὴ μεμοφαγοῦντας
  english_pob_choice: those who do not eat defiling food
  chosen_korean: 더럽힘의 음식을 먹지 않는 자들
  alternatives_korean:
  - 더럽힌 음식을 먹지 않는 자들
  - 부정한 음식을 먹지 않는 자들
  - 더러움의 음식을 먹지 않는 자들
  lexicon: LSJ
  rationale: 문맥상 거룩한 음식이 아니라 ‘더럽힘/오염’의 성격을 지닌 음식을 가리키므로, POB의 ‘defiling food’를 한국어로 직접 옮겼습니다. ‘먹지 않는’은 현재분사의 지속적 거부를 반영합니다.
- source_word: βασανίζειν / βασάνιζε
  english_pob_choice: to torture / torture us
  chosen_korean: 고문하다 / 우리를 고문하십시오
  alternatives_korean:
  - 괴롭히다 / 우리를 괴롭히십시오
  - 형벌을 가하다 / 우리를 형벌로 다루십시오
  lexicon: LSJ
  rationale: 마카베오스 순교 문맥에서 βασαν- 계열은 단순한 괴로움보다 신체적·법적 고문을 가리키므로 ‘고문하다’가 가장 직접적입니다. 마지막 명령형은 한국어 자연성을 위해 목적어를 드러냈습니다.
theological_decisions:
- issue: μὴ μεμοφαγοῦντας의 해석을 ‘먹지 않는’으로 둘지, ‘먹지 않은’으로 둘지
  chosen_reading: 현재분사의 지속적 거부를 반영하여 ‘먹지 않는 자들’로 옮겼습니다.
  alternative_readings:
  - 먹지 않은 자들
  - 먹어 보지 않은 자들
  rationale: 그리스어 형태가 단발적 완료보다 상태/행동의 지속적 특성을 강조하므로, 문맥상 금지된 음식을 지속적으로 거부하는 자들을 뜻하는 것으로 읽는 것이 맞습니다.
  doctrine_reference: Translation philosophy §1, §6
