  text: Your fire is cold to us[a], your catapults are painless, and your violence is powerless.
  footnotes:
  - marker: a
    text: Or 'your engines of torture are painless.' The Greek καταπέλται literally means 'catapults,' but in this context it may refer more broadly to instruments of torment.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 불은 우리에게 차갑고, 당신의 투석기는 고통이 없으며, 당신의 폭력은 무력합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘καταπέλται’는 문자적으로는 ‘투석기’를 뜻하지만, 이 순교 문맥에서는 더 넓게 고문 장치나 괴롭히는 기구를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πῦρ σου
  english_pob_choice: your fire
  chosen_korean: 당신의 불
  alternatives_korean:
