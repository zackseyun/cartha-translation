  rationale: ‘ψυχρός’의 직설적 의미인 ‘차갑다’를 살려, 박해자의 불이 무력하다는 반어를 약화시키지 않도록 했습니다.
- source_word: οἱ καταπέλται
  english_pob_choice: your catapults
  chosen_korean: 당신의 투석기
