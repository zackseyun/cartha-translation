  - 당신이 쓰는 불
  lexicon: LSJ
  rationale: 원문의 구체적 심상인 불을 그대로 살리되, 한국어에서는 소유 대상을 자연스럽게 드러내기 위해 ‘당신의 불’로 옮겼습니다.
- source_word: ψυχρὸν ἡμῖν
