  text: 당신의 불은 우리에게 차갑고, 투석기는[a] 우리에게 고통을 주지 않으며, 당신의 폭력은 무력합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘καταπέλται’는 문자적으로는 ‘투석기’를 뜻하지만, 이 순교 문맥에서는 더 넓게 고문 장치나 고통을 가하는 기구를 가리킬 수 있습니다.
    reason: lexical_alternative
