  source_fidelity: 그리스어는 첫째와 셋째 명사구에만 명시적으로 소유격 σου(‘당신의’)를 두며, οἱ καταπέλται는 정관사만 있는 ‘그 투석기들’입니다. 따라서 둘째 절의 ‘당신의’는 원문보다 한 단계 더 명시적입니다. 또한 ἄπονοι는 ‘고통이 없는/고통을 주지 않는’이라는 뜻으로, 한국어에서는 장치가 주어일 때 ‘고통이 없다’보다 ‘고통을 주지 않는다’가 의미 관계를 정확하고 자연스럽게 전달합니다.
  naturalness: ‘투석기는 고통이 없으며’는 투석기 자체가 고통을 느끼지 않는다는 뜻으로도 읽힐 수 있어 어색합니다. ‘투석기는 우리에게 고통을 주지 않으며’로 하면 원문의 수사적 역설과 대상(우리)을 분명히 하면서도 현대 표준 한국어 합쇼체에 자연스럽습니다. 주석 표지는 해당 어휘 바로 뒤에 놓는 것이 적절합니다.
