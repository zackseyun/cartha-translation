  rationale: 기본 뜻인 ‘투석기’를 우선 살렸고, 이 문맥에서 고문 장치까지 넓게 가리킬 수 있음을 주석으로 남겼습니다.
- source_word: ἄπονοι
  english_pob_choice: are painless
  chosen_korean: 고통이 없으며
