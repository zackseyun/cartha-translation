  lexicon: LSJ
  rationale: 형용사 ἄπονοι를 한국어 문장에서는 상태 서술로 자연스럽게 풀어 ‘고통이 없다’고 옮겨, 기계 장치가 주는 통증이 없다는 뜻을 드러냈습니다.
- source_word: ἡ βία σου
