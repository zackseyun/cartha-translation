  text: But I came forward of my own accord[a], so that, after killing me also[b], you might incur punishment from heavenly justice for still more acts of wrongdoing.
  footnotes:
  - marker: a
    text: Or 'I myself came on my own initiative' or 'I stepped forward of my own accord.'
    reason: lexical_alternative
  - marker: b
    text: '''Heavenly justice'' may also be rendered ''the justice of heaven'' or ''heavenly judgment.'''
    reason: alternative_reading
translation:
  language: ko
  text: 하지만 저는 자발적으로 앞으로 나섰습니다[a]. 그래서 저까지 죽이시면, 더욱 많은 불의한 행위들에 대해 하늘의 정의로부터 형벌을 받게 되실 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저 자신이 제 뜻으로 나섰습니다’.
    reason: lexical_alternative
  - marker: b
    text: ‘하늘의 정의’는 ‘하늘의 심판’ 또는 ‘천상의 정의’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπʼ ἐμαυτοῦ + παρῆλθον
  english_pob_choice: came forward of my own accord
  chosen_korean: 자발적으로 앞으로 나섰습니다
  alternatives_korean:
  - 제가 스스로 나섰습니다
  - 제 뜻으로 앞으로 나왔습니다
  - 저는 제 의지로 나아왔습니다
  lexicon: LSJ
  rationale: 자기 발의와 자원함을 함께 드러내는 표현으로, 단순한 이동보다 ‘앞으로 나섰습니다’가 상황에 맞고, ‘자발적으로’가 ἀπʼ ἐμαυτοῦ의 개인적 주도성을 살립니다.
- source_word: κἀμέ
  english_pob_choice: me also
  chosen_korean: 저까지
  alternatives_korean:
  - 저도
  - 저 역시
  - 심지어 저도
  lexicon: LSJ
  rationale: 살해 대상에 자신까지 포함된다는 추가 의미를 간결하게 살리기 위해 ‘저까지’로 옮겼습니다.
- source_word: ὀφλήσῃς
  english_pob_choice: you might incur
  chosen_korean: 받게 되실 것입니다
  alternatives_korean:
  - 져야 하실 것입니다
  - 부담하게 되실 것입니다
  - 책임을 지게 되실 것입니다
  lexicon: LSJ
  rationale: 직역적 ‘빚지다’보다 문맥상 형벌의 법적 부담을 자연스럽게 나타내면서, 결과적 책임의 뉘앙스를 유지합니다.
- source_word: τῇ οὐρανίᾳ δίκῃ
  english_pob_choice: heavenly justice
  chosen_korean: 하늘의 정의
  alternatives_korean:
  - 하늘의 공의
  - 하늘의 심판
  - 천상의 정의
  lexicon: LSJ
  rationale: δίκη의 핵심을 ‘정의’로 옮기되, ‘하늘의’로 그 출처를 드러내어 POB의 ‘heavenly justice’ 취지를 한국어로 유지했습니다.
theological_decisions:
- issue: τῇ οὐρανίᾳ δίκῃ의 신학적 뉘앙스
  chosen_reading: 하늘의 정의로부터 형벌을 받게 되실 것입니다
  alternative_readings:
  - 하늘의 심판으로부터 형벌을 받게 되실 것입니다
  - 천상의 정의에 의해 형벌을 받게 되실 것입니다
  rationale: 이 표현은 단순한 처벌이 아니라 초월적 도덕 질서에서 오는 응보를 가리키므로, ‘정의’와 ‘형벌’을 함께 두어 심판성과 도덕적 질서를 모두 보존했습니다.
  doctrine_reference: 신적 정의와 응보를 분명히 하되, 문맥이 요구하는 긴장감을 과도하게 해소하지 않음.
