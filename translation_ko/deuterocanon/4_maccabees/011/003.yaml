  to: 그러나 저는 스스로 나섰습니다. 당신이 저까지 죽이신 뒤, 더 많은 불의에 대하여 하늘의 정의로 형벌을 받게 하려고 말입니다[a][b].
  rationale: ‘스스로 나섰습니다’는 αὐτὸς와 ἀπʼ ἐμαυτοῦ의 자발성과 강조를 자연스럽게 함께 반영합니다. 둘째 문장을 목적 표현으로 고쳐 ὅπως를 보존하고, ‘죽이신 뒤’로 κατακτείνας의 선행 완료를 드러냈습니다. 각주 a는 해당 어구 뒤에, 각주 b는 ‘하늘의 정의’가 포함된 문장 끝에 두었습니다.
