translation:
  language: ko
  text: 이런 말을 한 뒤, 그들은 그를 수레바퀴로 끌고 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘수레바퀴’는 순교 이야기에서 쓰이는 고문 도구를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: ταῦτα
  english_pob_choice: these things
  chosen_korean: 이런 말
  alternatives_korean:
  - 이런 것들
  - 그런 말
  lexicon: LSJ
  rationale: 앞 구절의 발언을 가리키는 중성 복수이므로, 한국어에서는 자연스럽게 ‘이런 말’로 받아 문맥상 발언의 연속임을 드러냈습니다.
- source_word: εἰπόντα
  english_pob_choice: said
  chosen_korean: 한 뒤
  alternatives_korean:
  - 말한 뒤
  - 말하고
  - 말한 후
  lexicon: BDAG
  rationale: 부정과거 분사로서 주동사의 선행 동작을 나타내므로, 한국어에서 ‘-한 뒤’로 시간적 선행을 반영했습니다.
- source_word: παρῆγον
  english_pob_choice: they led
  chosen_korean: 끌고 갔습니다
  alternatives_korean:
  - 데려갔습니다
  - 인도했습니다
  - 끌어갔습니다
  lexicon: LSJ
  rationale: 고문 장치로 이동시키는 강제성을 살리기 위해 단순한 ‘갔습니다’보다 ‘끌고 갔습니다’를 택했습니다.
- source_word: τὸν τροχόν
  english_pob_choice: the wheel
  chosen_korean: 수레바퀴
  alternatives_korean:
  - 바퀴
  - 고문용 수레바퀴
  - 고문 바퀴
  lexicon: LSJ
  rationale: τροχός의 기본 뜻은 ‘바퀴’이지만, 이 순교 서술에서는 고문 도구를 가리키므로 한국어 독자가 기능을 바로 이해하도록 ‘수레바퀴’로 옮겼습니다.
theological_decisions:
- issue: 고문 도구의 명시 여부
  chosen_reading: 본문의 간결함을 유지하되, τροχός가 단순한 바퀴가 아니라 순교 장면의 고문 도구임을 한국어 표현 ‘수레바퀴’로 암시했습니다.
  alternative_readings:
  - ‘바퀴’로 직역하여 본문의 최소성을 더 살리는 해석
  - ‘고문용 수레바퀴’로 기능을 더 분명히 드러내는 해석
  rationale: 그리스어 본문이 설명을 덧붙이지 않으므로 과도한 해설을 피하면서도, 문맥상 의미는 전달되도록 조정했습니다.
  doctrine_reference: 순교 서술의 사실성 보존
