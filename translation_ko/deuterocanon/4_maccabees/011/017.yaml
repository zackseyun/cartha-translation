  source_fidelity: 그리스어는 그가 ‘이런 것들을 말한’ 뒤 사람들이 그를 ‘그 바퀴’로 데려갔다고 합니다. 초안의 ‘수레바퀴’는 τροχός의 기본 의미보다 운송 수단의 바퀴를 연상시키며, ‘끌고 갔습니다’는 원문의 단순한 인도/연행보다 강제성을 더 명시합니다.
  naturalness: ‘그가 이런 말을 한 뒤, 그들은 그를 그 바퀴로 데려갔습니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 선행 행동을 나타내는 분사의 관계도 보존합니다.
  terminology: τροχός는 본문에서는 ‘바퀴’로 옮기고, 고문 도구라는 문맥적 식별은 각주에서만 밝혀 본문의 간결성과 원문 수준의 명시성을 유지하는 것이 적절합니다. 각주 표지는 해당 낱말 바로 뒤에 두어 지시 대상이 분명해야 합니다.
