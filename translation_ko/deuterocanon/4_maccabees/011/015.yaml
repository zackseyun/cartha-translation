  source_fidelity: 핵심 구조와 의미는 잘 반영되었습니다. 다만 τὰ αὐτά / τῶν αὐτῶν의 의도적인 넓은 반복은 ‘같은 일들’보다 ‘같은 것들’로 옮기는 편이 더 직접적이며, 두 곳에서 동일하게 반복하는 원문도 더 잘 드러납니다. τραφέντες의 양육·길러짐의 수동적 뉘앙스도 ‘길러졌으므로’가 더 가깝습니다.
  naturalness: 합쇼체 문체는 적절합니다. 그러나 ‘우리도 또한’은 ‘도’와 ‘또한’이 중복되어 다소 무겁습니다. ὁμοίως는 ‘마찬가지로’로 자연스럽고 충분하게 나타낼 수 있습니다.
  terminology: ‘마땅합니다’는 ὀφείλομεν의 도덕적 당위를 자연스럽게 옮깁니다. 본문이 명시하지 않은 원칙·율법 등의 대상을 넣지 않고 넓은 표현을 유지해야 합니다.
