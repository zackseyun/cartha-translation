  - severity: low
    issue: ‘같은 일들’이 원문의 넓은 ‘것들’보다 약간 구체적으로 들림
    rationale: τὰ αὐτά / τῶν αὐτῶν은 대상이 특정되지 않은 중성 복수 표현입니다. ‘같은 것들’을 두 번 반복하면 그 개방성과 수사적 평행을 더 잘 보존합니다.
