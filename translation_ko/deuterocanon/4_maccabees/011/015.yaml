  text: For since we were both born and brought up for the same things[a], we likewise ought to die for the same things.
  footnotes:
  - marker: a
    text: Or 'for the same causes' or 'for the same principles.' The Greek repeats a broad expression, literally 'the same things,' in both clauses.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리가 같은 일들을 위해 태어나고 자라났으므로, 우리도 또한 같은 일들을 위해 죽는 것이 마땅합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘같은 원인들을 위해’, ‘같은 원칙들을 위해’. 그리스어는 두 절에서 넓은 표현인 ‘같은 것들’을 반복합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὰ αὐτά
  english_pob_choice: for the same things
  chosen_korean: 같은 일들을 위해
  alternatives_korean:
  - 같은 것들을 위해
  - 같은 목적을 위해
  - 같은 일에
  lexicon: LSJ
  rationale: 반복되는 τὰ αὐτά / τῶν αὐτῶν을 살리기 위해 넓은 범주의 표현으로 옮겼습니다. 한국어에서는 ‘같은 일들’이 원문의 반복과 목적 지향성을 함께 자연스럽게 드러냅니다.
- source_word: γενηθέντες
  english_pob_choice: born
  chosen_korean: 태어나
  alternatives_korean:
  - 태어난
  - 태어났으며
  - 생겨나
  lexicon: LSJ
  rationale: 가족적·생애적 맥락에서 aorist 분사를 ‘태어나’로 옮기면 출생의 사실을 간명하게 드러내면서도 문맥에 맞습니다.
- source_word: τραφέντες
  english_pob_choice: brought up
  chosen_korean: 자라났으므로
  alternatives_korean:
  - 양육되었으므로
  - 길러졌으므로
  - 자라며 길러졌으므로
  lexicon: LSJ
  rationale: 단순한 먹여 기름이 아니라 성장과 양육의 의미를 담아 ‘자라났다’로 옮겼습니다.
- source_word: ὀφείλομεν
  english_pob_choice: we ought
  chosen_korean: 마땅합니다
  alternatives_korean:
  - 우리가 의무가 있습니다
  - 우리는 해야 합니다
  - 우리가 빚지고 있습니다
  lexicon: LSJ
  rationale: 윤리적 의무를 나타내는 동사이므로, 한국어에서는 단정적이면서도 자연한 ‘마땅합니다’가 적절합니다.
