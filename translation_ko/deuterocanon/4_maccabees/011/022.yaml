- source_word: τεθήσομαι
  english_pob_choice: will be laid to rest / will be laid down
  chosen_korean: 누울 것입니다
  alternatives_korean:
  - 놓일 것입니다
  - 묻힐 것입니다
  - 안치될 것입니다
  lexicon: LSJ
  rationale: 문맥상 순교자 형제들과 함께 죽음/장례의 자리로 들어가는 뜻이 강하므로, 직접적인 ‘놓이다’보다 한국어에서 완곡하면서도 장례적 함의를 지닌 ‘누울 것입니다’를 택했습니다.
- source_word: μετὰ τῶν ἀδελφῶν μου
  english_pob_choice: with my brothers
  chosen_korean: 형제들과 함께
  alternatives_korean:
  - 내 형제들과 함께
  - 내 형제들 가운데
  - 형제들 곁에
  lexicon: LSJ
  rationale: 여기서 ἀδελφοί는 서사의 일곱 형제를 가리키므로, 문맥을 분명히 하는 ‘형제들’이 적절합니다.
theological_decisions:
- issue: τεθήσομαι의 죽음/장례적 함의
  chosen_reading: 단순한 ‘배치됨’이 아니라, 순교한 형제들과 같은 죽음의 자리와 장례의 연속선상에 놓이는 뜻으로 읽었습니다.
  alternative_readings:
  - 그와 함께 놓이게 될 것이라는 중립적 배치 의미
  - 그와 함께 임명/지정된다는 의미
  rationale: 직전 문맥이 순교와 연대의 선언이므로, 수동태를 보존하면서도 장례적·순교적 분위기를 드러내는 번역이 본문의 의도에 가장 가깝습니다.
