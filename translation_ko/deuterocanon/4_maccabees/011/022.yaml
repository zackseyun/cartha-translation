  yaml_path: translation/deuterocanon/4_maccabees/011/022.yaml
  text: I too[a], armed with noble virtue, will be laid to rest with my brothers[b],
  footnotes:
  - marker: a
    text: Or 'with nobility and goodness' or 'with moral excellence'; the Greek term denotes noble moral character.
    reason: lexical_alternative
  - marker: b
    text: Or 'will be placed with my brothers'; the Greek passive could be read more generally, but here likely refers to joining them in death.
    reason: alternative_reading
translation:
  language: ko
  text: 저도 고귀한 덕으로 무장한 채, 형제들과 함께 누울 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘고귀한 덕’은 Greek καλοκαγαθία의 의미를 압축한 번역입니다. 직역하면 ‘고결함과 선함’ 또는 ‘도덕적 탁월함’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘누울 것입니다’는 그리스어 수동형 τεθήσομαι를 장례적 문맥에 맞게 옮긴 것입니다. 더 직역하면 ‘놓일 것입니다’ 또는 ‘배치될 것입니다’가 가능합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: καλοκαγαθίᾳ
  english_pob_choice: with noble virtue
  chosen_korean: 고귀한 덕으로
  alternatives_korean:
  - 고결한 선함으로
  - 도덕적 탁월함으로
  - 귀한 품성과 선함으로
  lexicon: LSJ
  rationale: καλοκαγαθία는 단순한 예의범절이 아니라 고상한 도덕적 탁월성을 가리키므로, ‘고귀한 덕’이 그 اخلاق적·격조 높은 뉘앙스를 간결하게 살립니다.
- source_word: καθωπλισμένος
  english_pob_choice: armed
  chosen_korean: 무장한 채
  alternatives_korean:
  - 갖추어진 채
  - 완전히 무장한 채
  - 준비된 채
  lexicon: LSJ
  rationale: 전투적 은유를 유지하려면 ‘무장한 채’가 가장 자연스럽고, 원문의 수동 완료 분사 느낌도 무리 없이 전달합니다.
- source_word: τεθήσομαι
  english_pob_choice: will be laid to rest / will be laid down
  chosen_korean: 누울 것입니다
  alternatives_korean:
  - 놓일 것입니다
  - 묻힐 것입니다
  - 안치될 것입니다
  lexicon: LSJ
  rationale: 문맥상 순교자 형제들과 함께 죽음/장례의 자리로 들어가는 뜻이 강하므로, 직접적인 ‘놓이다’보다 한국어에서 완곡하면서도 장례적 함의를 지닌 ‘누울 것입니다’를 택했습니다.
- source_word: μετὰ τῶν ἀδελφῶν μου
  english_pob_choice: with my brothers
  chosen_korean: 형제들과 함께
  alternatives_korean:
  - 내 형제들과 함께
  - 내 형제들 가운데
  - 형제들 곁에
  lexicon: LSJ
  rationale: 여기서 ἀδελφοί는 서사의 일곱 형제를 가리키므로, 문맥을 분명히 하는 ‘형제들’이 적절합니다.
theological_decisions:
- issue: τεθήσομαι의 죽음/장례적 함의
  chosen_reading: 단순한 ‘배치됨’이 아니라, 순교한 형제들과 같은 죽음의 자리와 장례의 연속선상에 놓이는 뜻으로 읽었습니다.
  alternative_readings:
  - 그와 함께 놓이게 될 것이라는 중립적 배치 의미
  - 그와 함께 임명/지정된다는 의미
  rationale: 직전 문맥이 순교와 연대의 선언이므로, 수동태를 보존하면서도 장례적·순교적 분위기를 드러내는 번역이 본문의 의도에 가장 가깝습니다.
  doctrine_reference: 문맥 우선의 의미 유지; 수동태의 종말론적/순교적 함의를 과잉 해석하지 않음
