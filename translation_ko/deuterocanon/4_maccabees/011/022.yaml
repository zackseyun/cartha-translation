translation:
  language: ko
  text: 저 역시 고귀한 덕[a]으로 무장한 채 제 형제들과 함께 놓일 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘고귀한 덕’은 그리스어 καλοκαγαθία의 의미를 압축한 번역입니다. 직역하면 ‘고결함과 선함’ 또는 ‘도덕적 탁월함’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘놓일 것입니다’는 그리스어 수동형 τεθήσομαι를 옮긴 것입니다. 이 문맥에서는 형제들과 함께 죽음 또는 장례의 자리에 놓이는 뜻으로 이해될 수 있으며, 더 직역하면 ‘배치될 것입니다’도 가능합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: καλοκαγαθίᾳ
  english_pob_choice: with noble virtue
  chosen_korean: 고귀한 덕으로
  alternatives_korean:
  - 고결한 선함으로
