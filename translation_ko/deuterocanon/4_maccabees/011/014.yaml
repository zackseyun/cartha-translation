  text: I am younger than my brothers in age, but in understanding I am their equal.
translation:
  language: ko
  text: 저는 나이로는 제 형제들보다 어리지만, 이해로는 그들과 같습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡλικίᾳ / νεώτερος
  english_pob_choice: in age / younger
  chosen_korean: 나이로는 … 어리지만
  alternatives_korean:
  - 연령으로는 … 어리지만
  - 연배로는 … 어리지만
  lexicon: LSJ
  rationale: ἡλικίᾳ와 νεώτερος의 대조를 자연스럽게 살려, 혈연관계 안에서의 실제 연령이 더 낮다는 뜻을 분명히 표현했습니다.
- source_word: ἀδελφῶν
  english_pob_choice: brothers
  chosen_korean: 형제들
  alternatives_korean:
  - 오빠들
  - 남자 형제들
  lexicon: LSJ
  rationale: 문맥상 남성 복수의 친형제들을 가리키므로, 현대 한국어에서 가장 자연스러운 표준어 표현인 ‘형제들’을 택했습니다.
- source_word: διανοίᾳ
  english_pob_choice: in understanding
  chosen_korean: 이해로는
  alternatives_korean:
  - 마음으로는
  - 생각으로는
  - 지혜로는
  lexicon: LSJ
  rationale: διανοία는 단순한 생각보다 이해력·지적 판단을 가리키므로, 문맥의 대비를 살리는 ‘이해’가 가장 적절합니다.
- source_word: ἡλικιώτης
  english_pob_choice: their equal
  chosen_korean: 그들과 같습니다
  alternatives_korean:
  - 그들과 동등합니다
  - 그들과 같은 수준입니다
  - 그들과 동갑입니다
  lexicon: LSJ
  rationale: 직역하면 ‘나이 동무/동년배’ 뉘앙스가 있으나, 앞절과의 논리적 대비상 이해의 동등함을 뜻하므로 ‘그들과 같습니다’로 옮겼습니다.
theological_decisions:
- issue: ἡλικιώτης를 나이의 동일성으로 오해하지 않게 하는 번역
  chosen_reading: 이해의 동등함을 나타내는 표현으로 처리
  alternative_readings:
  - 그들과 동갑입니다
  - 그들과 같은 나이입니다
  - 그들의 또래입니다
  rationale: 원문은 ‘나이로는 더 어리지만’과 분명히 대조되므로, 뒤절을 나이의 동일성으로 옮기면 자가모순이 됩니다. 따라서 판단력/이해에서의 동등함을 드러내야 합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3, 5
