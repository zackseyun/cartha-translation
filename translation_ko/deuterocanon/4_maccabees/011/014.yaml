  source_fidelity: The draft correctly renders the contrast between being younger in age (τῇ μὲν ἡλικίᾳ … νεώτερος) and being on an equal level in mental capacity (τῇ δὲ διανοίᾳ ἡλικιώτης). It appropriately avoids the contradictory literal-age sense of ἡλικιώτης in the second clause.
  naturalness: ‘이해로는’ is understandable but somewhat elliptical and may suggest the content one understands rather than one’s capacity for understanding. ‘이해력으로는’ expresses the intended faculty more naturally in modern Korean while retaining the concise antithesis.
  terminology: ‘형제들’ accurately represents the masculine plural ἀδελφῶν in context. ‘나이로는 … 어리지만’ is idiomatic and faithful. ‘이해력’ is a suitable Korean rendering for διανοία here; ‘그들과 같습니다’ naturally conveys contextual parity for ἡλικιώτης without overstating the term.
  issues:
  - severity: low
    issue: ‘이해로는’ can be semantically underspecified in Korean.
    rationale: The Greek διανοίᾳ denotes mental capacity or understanding in this contrast, not merely understanding as an object or result. Adding ‘력’ makes this explicit without adding interpretive content.
  revised_text: 저는 나이로는 제 형제들보다 어리지만, 이해력으로는 그들과 같습니다.
