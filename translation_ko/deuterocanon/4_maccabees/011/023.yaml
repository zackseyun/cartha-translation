base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/011/023.yaml
  text: By bringing against yourself a great avenger as well[a], you innovator of tortures and enemy of those who are truly reverent.
  footnotes:
  - marker: a
    text: Or 'a great avenging spirit'; the Greek ἀλάστωρ can carry the sense of a personal avenger or a force of retribution.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 또한 큰 보복자를 자신에게 가져다오고 있으니[a], 고통의 혁신가이며 참으로 경건한 이들의 원수입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘큰 보복하는 영’; 그리스어 ἀλάστωρ는 개인적 보복자나 보복의 힘을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέγαν
  english_pob_choice: great
  chosen_korean: 큰
  alternatives_korean:
  - 위대한
  - 막중한
  lexicon: LSJ
  rationale: ἀλάστορα를 수식하는 강도를 살리면서도 한국어에서 자연스럽고 직역에 가깝게 표현했습니다.
- source_word: προσβαλλὼν σοι
  english_pob_choice: bringing against yourself
  chosen_korean: 자신에게 가져다오고 있으니
  alternatives_korean:
  - 자신에게 던지고 있으니
  - 자신에게 가져오고 있으니
  - 자신에게 들이대고 있으니
  lexicon: LSJ
  rationale: προσβαλλὼν의 ‘다가가/던져 맞닥뜨리게 하다’는 동작성을 살리되, 결과가 자신에게 돌아온다는 점을 자연스럽게 드러냈습니다.
- source_word: ἀλάστορα
  english_pob_choice: avenger
  chosen_korean: 보복자
  alternatives_korean:
  - 원수 갚는 자
  - 복수하는 영
  - 응징자
  lexicon: LSJ
  rationale: 문맥상 단순한 개인적 복수보다 신적·운명적 응징의 뉘앙스가 있어 ‘보복자’로 옮겼습니다. 영어 주석이 허용한 어휘적 긴장도 유지합니다.
- source_word: καινοτόμε τῶν βασάνων
  english_pob_choice: innovator of tortures
  chosen_korean: 고통의 혁신가
  alternatives_korean:
  - 고문의 발명가
  - 고통을 새로 만들어 내는 자
  - 고문을 혁신하는 자
  lexicon: LSJ
  rationale: vocative의 비난을 유지하면서 βασάνων의 가혹함을 직접 드러냈습니다. ‘혁신가’는 새롭고 전례 없는 고문을 꾸민다는 뉘앙스를 반영합니다.
- source_word: τῶν ἀληθῶς εὐσεβούντων
  english_pob_choice: of those who are truly reverent
  chosen_korean: 참으로 경건한 이들
  alternatives_korean:
  - 참으로 경외하는 이들
  - 참된 경건을 지키는 이들
  - 참으로 하나님을 공경하는 이들
  lexicon: LSJ
  rationale: εὐσεβέω의 신앙적 경건을 한국어 교회어에 지나치게 묶지 않으면서도, ‘참으로’의 강조를 살려 옮겼습니다.
theological_decisions:
- issue: ἀλάστωρ의 성격
  chosen_reading: ‘보복자’로 옮기되, 개인적 복수보다 심판적 응징의 뉘앙스를 남겼습니다.
  alternative_readings:
  - ‘복수하는 영’으로 보다 신화적 존재를 드러내는 읽기
  - ‘원수를 갚는 자’로 더 직설적으로 옮기는 읽기
  rationale: 영어 POB 주석이 ἀλάστωρ의 개인적 존재/응징적 힘의 양가성을 인정하므로, 한국어 본문은 중립적인 ‘보복자’를 택하고 주석으로 다른 가능성을 열어 두었습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 6
- issue: vocative 비난문의 어조
  chosen_reading: 직접 호칭의 격한 질책을 그대로 살리기 위해 2인칭 호격 구조를 유지했습니다.
  alternative_readings:
  - 서술형으로 완화해 ‘당신은 ...입니다’처럼 풀어 쓰는 방식
  rationale: 원문은 단순 서술이 아니라 폭군을 향한 정면 규탄이므로, 한국어도 호격과 단정형을 함께 써 강한 수사적 압박을 유지했습니다.
  doctrine_reference: 문체 지침 및 원문 수사 구조
