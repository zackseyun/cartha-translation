  naturalness: ‘큰 보복자를 자신에게 가져다오고 있으니’와 ‘고통의 혁신가’는 현대 한국어의 비난문으로 어색합니다. ‘큰 응징자를 스스로에게 불러들이고 있으니’ 및 ‘고문을 새로 꾸며 내는 자’로 고치면 합쇼체의 직접적인 규탄 어조와 자연스러운 문장 연결이 살아납니다.
  terminology: ἀλάστωρ는 본문에서 ‘응징자’로 옮겨 보복·심판의 성격을 유지하되 특정 종교적 존재로 단정하지 않았습니다. 각주에서 ‘복수의 영’ 가능성과 비인격적인 보복의 힘이라는 어휘 범위를 보존했습니다. εὐσεβούντων은 ‘참으로 경건한 사람들’로 유지하여 신앙적 경건을 자연스럽게 나타냈습니다.
