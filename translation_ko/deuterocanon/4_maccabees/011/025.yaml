  yaml_path: translation/deuterocanon/4_maccabees/011/025.yaml
  text: For your not being able to persuade our reason[a], nor to compel us to eat defiled food—is that not your defeat?
  footnotes:
  - marker: a
    text: Or, more contextually, 'to eating forbidden meat' or 'to eating defiled food.' The Greek term itself is literally 'meat-eating,' but in this episode it refers to meat prohibited under the Jewish law.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신이 우리의 이성[a]을 설득하지도 못하고, 우리를 강제로 더러운 고기를 먹게 하지도 못하였으니 — 이것이 당신의 패배가 아닙니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘이성’ 또는 문맥상 ‘판단’입니다. 4마카베오스의 λογισμός는 본서의 핵심 어휘로, 감정이나 욕망에 맞서는 합리적 분별을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δυνηθῆναί σε μεταπεῖσαι τὸν λογισμὸν ἡμῶν
  english_pob_choice: your not being able to persuade our reason
  chosen_korean: 당신이 우리의 이성을 설득하지도 못하고
  alternatives_korean:
  - 당신이 우리의 이성을 설득할 수 없고
  - 당신이 우리의 이성을 꺾지도 못하고
  lexicon: BDAG
  rationale: λογισμός는 4마카베오스에서 단순한 생각보다 이성적 판단을 가리키므로, ‘이성’으로 옮겨 본문의 핵심 대조를 살렸습니다.
- source_word: βιάσασθαι
  english_pob_choice: to compel
  chosen_korean: 강제로 ... 먹게 하지도 못하고
  alternatives_korean:
  - 억지로 ... 먹게 하지도 못하고
  - 강압하여 ... 먹게 하지도 못하고
  lexicon: BDAG
  rationale: βιάσασθαι는 힘으로 억누르거나 강요하는 뜻이어서, ‘강제로’로 그 폭력성을 분명히 드러냈습니다.
- source_word: πρὸς τὴν μεμοφαγίαν
  english_pob_choice: to eat defiled food
  chosen_korean: 더러운 고기를 먹게
  alternatives_korean:
  - 금지된 고기를 먹게
  - 부정한 음식을 먹게
  - 고기를 먹게
  lexicon: LSJ
  rationale: μεμοφαγία는 문자적으로 ‘고기 먹기’이지만, 문맥상 율법상 금지된 고기를 가리키므로 본문에는 ‘더러운 고기’로 풀어 옮기되, 지나친 해석은 피했습니다.
- source_word: οὐ κατάλυσίς ἐστιν σου;
  english_pob_choice: is that not your defeat?
  chosen_korean: 이것이 당신의 패배가 아닙니까?
  alternatives_korean:
  - 이것이 당신의 몰락이 아닙니까?
  - 이것이 당신의 무너짐이 아닙니까?
  lexicon: BDAG
  rationale: κατάλυσις는 무너짐, 붕괴, 패배의 뉘앙스를 가지며, 조롱조의 수사 의문문에서는 ‘패배’가 가장 자연스럽고 분명합니다.
theological_decisions:
- issue: λογισμός의 철학적-윤리적 무게
  chosen_reading: ‘이성’으로 번역하여, 순교 서사의 핵심인 이성의 승리 대 패기의 대립을 살렸습니다.
  alternative_readings:
  - ‘판단’
  - ‘굳은 결심’
  rationale: 이 단락은 감정과 폭력에 맞서는 이성적 분별을 강조하므로, 지나치게 심리화된 표현보다 ‘이성’이 본문 의도를 더 직접적으로 전달합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 5
- issue: μεμοφαγίαν의 문맥적 구체화
  chosen_reading: 본문에는 ‘더러운 고기’로 옮기고, 율법상 금지된 음식이라는 문맥은 본문 자체가 드러내도록 두었습니다.
  alternative_readings:
  - ‘금지된 고기’
  - ‘부정한 음식’
  rationale: 그리스어는 문자적으로 ‘고기 먹기’이지만, 서사 문맥상 유대 율법에 어긋나는 식사를 뜻하므로 너무 일반화하지 않으면서도 의미가 분명한 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
