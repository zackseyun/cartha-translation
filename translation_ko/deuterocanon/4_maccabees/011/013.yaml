  text: And after this one had died, the sixth youth was brought forward. When the tyrant asked whether he wanted to be released if he ate, he said,
translation:
  language: ko
  text: 그리고 이 사람이 죽은 뒤에, 여섯째 청년이 끌려 나왔습니다. 그때 폭군이 먹으면 풀어 주겠느냐고 묻자, 그가 말했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τελευτήσαντος δὲ καὶ τούτου
  english_pob_choice: And after this one had died
  chosen_korean: 그리고 이 사람이 죽은 뒤에
  alternatives_korean:
  - 그리고 이 사람도 죽은 뒤에
  - 그리고 이 사람이 생을 마친 뒤에
  lexicon: LSJ
  rationale: τελευτάω의 핵심은 죽음을 가리키므로, 문맥에 맞게 자연스럽게 ‘죽은 뒤에’로 옮겼습니다. ‘이 사람’은 바로 앞 인물을 가리키는 지시성을 살리면서도 한국어에서 어색한 반복을 줄입니다.
- source_word: ὁ ἕκτος
  english_pob_choice: the sixth
  chosen_korean: 여섯째 청년
  alternatives_korean:
  - 여섯째
  - 여섯째 형제
  - 여섯째 사람
  lexicon: LSJ
  rationale: 서수는 문맥상 형제들 가운데 여섯째를 뜻하지만, 그리스어 자체는 단지 ‘여섯째’라고만 하므로 영어 POB처럼 본문 흐름에서 알 수 있는 μειρακίσκος를 반영해 ‘청년’으로 풀었습니다.
- source_word: ἤγετο
  english_pob_choice: was brought forward
  chosen_korean: 끌려 나왔습니다
  alternatives_korean:
  - 앞으로 끌려 나왔습니다
  - 끌려 왔습니다
  - 인도되었습니다
  lexicon: LSJ
  rationale: 재판·처형 장면의 공적 등장이라는 뉘앙스를 살려 ‘끌려 나왔다’로 옮겼습니다. 단순한 ‘인도되었다’보다 수동성과 강제성이 더 분명합니다.
- source_word: τοῦ τυράννου
  english_pob_choice: the tyrant
  chosen_korean: 폭군
  alternatives_korean:
  - 폭군 통치자
  - 독재자
  - 왕
  lexicon: LSJ
  rationale: τύραννος는 중립적 ‘왕’이 아니라 평가가 담긴 ‘폭군’입니다. 본문의 도덕적 판단을 약화시키지 않기 위해 직역에 가깝게 유지했습니다.
- source_word: εἰ βούλοιτο φαγὼν ἀπολύεσθαι
  english_pob_choice: whether he wanted to be released if he ate
  chosen_korean: 먹으면 풀어 주겠느냐고
  alternatives_korean:
  - 먹으면 놓아 주겠느냐고
  - 먹으면 석방해 주겠느냐고
  - 먹는다면 풀어 주겠느냐고
  lexicon: LSJ
  rationale: 조건문과 ἀπολύεσθαι의 ‘풀어 주다/석방하다’ 의미를 한국어에서 가장 자연스럽게 전달했습니다. ‘먹으면’은 조건을, ‘풀어 주겠느냐고’는 tyrant의 제안을 살립니다.
theological_decisions:
- issue: τύραννος의 부정적 정치·도덕적 호칭 유지
  chosen_reading: 폭군
  alternative_readings:
  - 왕
  - 통치자
  - 독재자
  rationale: 저자는 안티오코스를 중립적 지배자가 아니라 악한 권력자로 그립니다. 한국어에서도 그 평가를 그대로 드러내는 것이 본문의 수사와 신학적 긴장을 보존합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
- issue: ‘먹다’의 대상 비명시성 유지
  chosen_reading: 먹으면
  alternative_readings:
  - 금지된 음식을 먹으면
  - 제물을 먹으면
  rationale: 이 절 자체에는 먹는 대상이 명시되지 않으므로, 앞뒤 문맥이 알려 주는 내용을 본문에 미리 덧붙이지 않았습니다. 이렇게 해야 현재 절의 범위를 넘는 해석을 피할 수 있습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
