  lexicon: LSJ
  rationale: 4 마카베오서에서 λογισμός는 감정을 다스리는 이성적 능력을 가리키므로, 단순한 ‘생각’보다 ‘이성’이 문맥상 더 정확합니다.
theological_decisions:
- issue: 폭군의 권세와 신적 율법의 권위를 대비하는 방식
  chosen_reading: ‘폭군을 위한 것이 아니라 신적 율법을 위한 자리’라는 대비를 유지했습니다.
  alternative_readings:
  - ‘폭군 아래가 아니라 신적 율법 아래’
  - ‘폭군 편이 아니라 신적 율법 편’
  rationale: 그리스어는 경비병들의 배치 목적과 충성을 대비하므로, 단순히 지배관계만 옮기기보다 ‘~을 위한’ 구조로 권위의 방향성을 살렸습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; original-language primacy over translation tradition.'
