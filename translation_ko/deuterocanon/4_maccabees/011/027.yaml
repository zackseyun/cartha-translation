  lexicon: LSJ
  rationale: ἀνίκητος의 ‘이기지 못한/정복되지 않은’ 의미를 한국어에서 덜 장식적으로 전달해, 4 마카베오서의 수사적 철학 용법에 맞춥니다.
- source_word: λογισμόν
  english_pob_choice: reason
  chosen_korean: 이성
