  text: For our guards stand over us not for a tyrant[a], but for divine law; for this reason we have undefeated reason.
  footnotes:
  - marker: a
    text: Or 'our reasoning is invincible' or 'we possess unconquerable reason.' The Greek λογισμός is a key term in 4 Maccabees for the rational faculty.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리 위에 있는 경비병들은 폭군이 아니라 신적 율법의 권위 아래에 있습니다. 그러므로 우리는 무적의 이성을 지니고 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리의 이성은 무적입니다’ 또는 ‘우리는 정복될 수 없는 이성을 지니고 있습니다’. 여기서 λογισμός는 4 마카베오서의 핵심 용어로, 감정을 다스리는 이성적 능력 또는 판단력을 가리킵니다.
    reason: lexical_alternative
