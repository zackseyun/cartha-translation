revisions:
- from: 우리의 경비병들은 폭군을 위한 것이 아니라 신적 율법을 위한 자리에서 우리 위에 서 있습니다. 그러므로 우리는 패배하지 않는 이성을 지니고 있습니다.[a]
  to: 우리 위에 있는 경비병들은 폭군이 아니라 신적 율법의 권위 아래에 있습니다. 그러므로 우리는 무적의 이성을 지니고 있습니다.[a]
  rationale: 첫 절을 경비병들의 권위·소속을 나타내는 원문의 대조에 맞추어 자연스러운 한국어로 고쳤습니다. 마지막 절은 원문의 목적어 구성을 유지하되, ἀνίκητον의 자연스러운 한국어 표현으로 ‘무적의’를 사용했습니다. 각주는 λογισμός를 주어로 파악하는 가능한 번역과 이 문헌 특유의 용례를 반영하도록 다듬었습니다.
