  lexicon: LSJ
  rationale: 직역에 가까운 ‘신적 율법’이 그리스어의 형용사-명사 결합을 가장 가깝게 옮기며, 본문의 법적·종교적 성격을 함께 보존합니다.
- source_word: προεστήκασιν
