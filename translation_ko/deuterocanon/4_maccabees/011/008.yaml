lexical_decisions:
- source_word: νῦν ἰδὲ
  english_pob_choice: Now look
  chosen_korean: 지금 보십시오
  alternatives_korean:
  - 이제 보십시오
  - 지금 보라
  lexicon: BDAG
  rationale: νῦν의 현재적 대조와 ἰδὲ의 주의 환기를 자연스러운 합쇼체 명령으로 옮겼습니다.
- source_word: ἀλλότριος ὢν θεοῦ
  english_pob_choice: being alien to God
  chosen_korean: 하나님에게서 멀어진
  alternatives_korean:
  - 하나님에게 낯선
  - 하나님과 단절된
  - 하나님에게서 소외된
  lexicon: BDAG
  rationale: ἀλλότριος는 소속이 다른 상태를 가리키므로, 관계적 거리와 소속 상실을 드러내는 ‘멀어진’으로 옮겼습니다.
- source_word: πολεμεῖς
  english_pob_choice: you are making war against
  chosen_korean: 전쟁을 벌이고 있습니다
  alternatives_korean:
  - 싸우고 있습니다
  - 전쟁을 일으키고 있습니다
  - 대적하고 있습니다
  lexicon: BDAG
  rationale: 직접적인 적대 행위를 가리키는 동사이므로, 단순한 ‘싸우다’보다 군사적 강도를 살린 표현을 택했습니다.
- source_word: τοὺς εὐσεβοῦντας εἰς τὸν θεόν
  english_pob_choice: those who are devout toward God
  chosen_korean: 하나님을 경건하게 섬기는 이들
  alternatives_korean:
  - 하나님께 경건한 이들
  - 하나님을 향해 경건한 이들
  - 경건을 실천하는 사람들
  lexicon: BDAG
  rationale: εὐσεβοῦντας의 지속적 경건/경외를 살리되, εἰς τὸν θεόν의 방향성을 한국어에서 자연스럽게 드러내기 위해 ‘경건하게 섬기는’으로 옮겼습니다.
theological_decisions:
- issue: ἀλλότριος θεοῦ의 관계적 뉘앙스
  chosen_reading: 단순한 ‘외국인/낯선 사람’이 아니라 하나님과의 관계에서 멀어진 상태로 이해했습니다.
  alternative_readings:
  - 하나님에게서 소외된
  - 하나님에게 속하지 않은
  - 하나님과 적대하는
  rationale: 문맥상 경건한 이들을 대적하는 폭군에 대한 책망이므로, 소속 상실과 관계적 단절의 뉘앙스를 함께 살리는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
