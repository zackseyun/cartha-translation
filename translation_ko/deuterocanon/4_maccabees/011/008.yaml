  lexicon: BDAG
  rationale: ἀλλότριος는 소속이 다른 상태를 가리키므로, 관계적 거리와 소속 상실을 드러내는 ‘멀어진’으로 옮겼습니다.
- source_word: πολεμεῖς
  english_pob_choice: you are making war against
  chosen_korean: 전쟁을 벌이고 있습니다
