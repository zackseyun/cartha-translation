  source_fidelity: ‘하나님에게서 멀어진 사람인’은 ἀλλότριος ὢν θεοῦ의 관계적 뜻을 대체로 전달하지만, ‘멀어진’은 이전에 하나님께 가까웠다는 함의를 불필요하게 더할 수 있고 ‘사람인’은 원문에 없는 명사를 보탭니다. ‘하나님께 속하지 않은 당신은’은 ἀλλότριος의 소속·관계상 이질성을 더 직접적으로 보존합니다. πολεμεῖς의 전투적 강도와 εὐσεβοῦντας εἰς τὸν θεόν의 하나님을 향한 경건은 유지됩니다.
  naturalness: ‘하나님께 속하지 않은 당신은’과 ‘이들을 상대로 전쟁을 벌이고 있습니다’는 현대 표준어 합쇼체에서 자연스럽고, 원문의 책망하는 어조를 유지합니다. 문두의 주의 환기는 마침표로 분리하여 한국어 문장 흐름을 매끄럽게 했습니다.
  terminology: ‘하나님’ 및 ‘경건하게 섬기는 이들’은 일관되고 자연스럽습니다. 각주 a의 ‘또는 보십시오’는 본문과 중복되므로 실제 대안을 제시하도록 바로잡았습니다. 각주 b는 본문 선택의 가능한 관계적 대안을 제시합니다.
  issues:
  - severity: medium
    issue: ‘하나님에게서 멀어진’은 ἀλλότριος의 소속상 이질성에 이전의 친밀 관계가 있었다는 함의를 더할 수 있습니다.
    rationale: 원문은 하나님께 속하지 않음/하나님에 대해 낯섦을 말하며, 이전 상태에 대해서는 명시하지 않습니다.
  - severity: low
    issue: ‘사람인’은 원문의 분사구에 없는 명사를 추가합니다.
    rationale: 한국어 문법상 반드시 필요하지 않으므로 삭제하면 더 간결하고 원문에 가깝습니다.
  - severity: low
    issue: 각주 a가 본문 표현 ‘보십시오’를 대안으로 반복합니다.
    rationale: 어휘 대안 각주는 본문과 구별되는 번역 가능성을 제시해야 합니다.
  revised_text: 지금 보십시오[a]. 하나님께 속하지 않은 당신은 하나님을 경건하게 섬기는 이들을 상대로 전쟁을 벌이고 있습니다.
