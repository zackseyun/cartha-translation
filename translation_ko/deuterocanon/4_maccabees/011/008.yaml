    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하나님에게서 멀어진’, ‘하나님에게 낯선’.
    reason: lexical_alternative
  revision_rationale: ἀλλότριος ὢν θεοῦ를 ‘하나님께 속하지 않은’으로 옮겨 소속과 관계의 대조를 보존하면서, ‘멀어진’이 암시할 수 있는 이전 관계를 단정하지 않았습니다. 원문에 없는 ‘사람인’을 삭제했고, 대적의 대상을 자연스럽게 나타내기 위해 ‘이들을 상대로 전쟁을 벌이고 있습니다’로 다듬었습니다. 각주 a의 중복도 해소했습니다.
