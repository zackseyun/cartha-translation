translation:
  language: ko
  text: 이는 폭군이여, 경건한 지식은 정복될 수 없기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경건한 이성’ 또는 ‘경건한 이해’. 헬라어 표현은 하나님을 경외하는 태도와 이성적 이해를 함께 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνίκητος
  english_pob_choice: unconquerable
  chosen_korean: 정복될 수 없습니다
  alternatives_korean:
  - 패배할 수 없습니다
  - 이길 수 없습니다
  - 꺾을 수 없습니다
  lexicon: ἀνίκητος
  rationale: 전장적·법정적 뉘앙스를 살리면서도 현대 한국어에서 자연스럽고 강하게 ‘정복 불가’의 의미를 전달합니다.
- source_word: εὐσεβὴς ἐπιστήμη
  english_pob_choice: godly understanding
  chosen_korean: 경건한 지식
  alternatives_korean:
  - 경건한 이해
  - 경건한 지혜
  - 경건한 인식
  lexicon: εὐσεβής + ἐπιστήμη
  rationale: 영문 POB의 ‘godly understanding’과 헬라어의 경건성 + 인식/지식 결합을 함께 반영하되, 지나친 해석 확장을 피했습니다.
- source_word: ὦ τύραννε
  english_pob_choice: O tyrant
  chosen_korean: 오만한 통치자여
  alternatives_korean:
  - 폭군이여
  - 폭군아
  - 참주여
  lexicon: τύραννος
  rationale: 직역인 ‘폭군’은 가능하지만, 한국어에서 당대의 청중에게 주는 도발성과 경멸을 살리기 위해 ‘오만한 통치자여’로 옮겼습니다.
theological_decisions:
- issue: εὐσεβὴς ἐπιστήμη의 의미 범위
  chosen_reading: ‘경건한 지식’으로 번역해, 하나님 경외와 인식의 결합을 유지했습니다.
  alternative_readings:
  - ‘경건한 이해’로 더 인지적 측면을 강조하는 읽기
  - ‘경건한 지혜’로 더 실천적·윤리적 측면을 강조하는 읽기
  rationale: 이 구절은 경건이 단순 감정이 아니라 인식의 형식이라는 점을 말하므로, 지식/이해/지혜 중 하나로 과도하게 평준화하지 않고 ‘지식’으로 유지했습니다.
  doctrine_reference: 지혜문학 및 순교문학의 하나님 경외와 인식의 결합
