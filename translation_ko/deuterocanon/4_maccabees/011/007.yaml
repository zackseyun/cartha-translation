lexical_decisions:
- source_word: εἴπερ ἠσθάνου
  english_pob_choice: if indeed you had any human awareness
  chosen_korean: 참으로 네가 … 감각을 지니고 있었다면
  alternatives_korean:
  - 만일 네가 … 느꼈다면
  - 네가 참으로 … 알아차렸다면
  lexicon: εἰπέρ / αἰσθάνομαι
  rationale: 조건문 속의 2인칭 미완료 과거를 살려 가정적·논박적 뉘앙스를 유지하면서, 단순한 감정보다 ‘감각/인식의 자각’을 드러내는 표현으로 옮겼습니다.
- source_word: ἀνθρώπους πόθων
  english_pob_choice: human awareness of desires
  chosen_korean: 인간의 욕망에 대한 감각
  alternatives_korean:
  - 사람들의 욕망에 대한 감각
  - 인간적 욕망의 느낌
  lexicon: ἄνθρωπος / πόθος
  rationale: πόθος를 단순한 ‘원함’보다 강한 ‘욕망’으로, ἀνθρώπους는 인간성의 영역을 가리키는 형용적 용법으로 보고 ‘인간의 욕망’으로 처리했습니다.
- source_word: ἐλπίδα εἶχες παρὰ θεῷ σωτηρίου
  english_pob_choice: had hope from God for deliverance
  chosen_korean: 하나님께서 주시는 구원에 대한 희망도 있었다면
  alternatives_korean:
  - 하나님께로부터 구원의 희망도 있었다면
  - 하나님 앞에서 구원의 소망도 있었다면
  lexicon: ἐλπίς / παρὰ θεῷ / σωτήριον
  rationale: παρά + dative를 원천적 출처로 이해해 ‘하나님께서 주시는’으로 옮겼고, σωτηρίου는 ‘구원’으로 직역하되 문맥상 기대를 담는 ‘희망’과 연결했습니다.
theological_decisions:
- issue: 4 Maccabees의 수사적 조건문 어조
  chosen_reading: 이 구절을 실제 가능성을 묻는 중립적 조건문보다, 상대를 책망하며 논지를 밀어붙이는 수사적 가정으로 읽었습니다.
  alternative_readings:
  - 단순한 가정문으로 읽기
  - 심리 상태를 묻는 서술로 읽기
  rationale: 문맥상 변증적·권면적 논박이 강하므로, 조건절의 가정성과 반박적 기능을 살려 번역했습니다.
  doctrine_reference: 수사학적 문맥 해석
- issue: παρὰ θεῷ의 관계
  chosen_reading: ‘하나님께서 주시는’으로 번역해, 희망의 근원이 하나님께 있음을 분명히 했습니다.
  alternative_readings:
  - ‘하나님께’로 단순 위치를 나타내기
  - ‘하나님 앞에서’로 완화하기
  rationale: παρά + dative는 단순한 공간보다 기원·출처를 나타내는 경우가 있어, 본문의 신학적 초점을 보존했습니다.
  doctrine_reference: 출처/기원 표지
