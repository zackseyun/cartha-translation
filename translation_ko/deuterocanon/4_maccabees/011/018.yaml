  text: On it, while being stretched out with measured care and disjointed, he was being burned underneath.
  footnotes:
  - marker: a
    text: Or 'carefully' or 'methodically'; the Greek adverb emphasizes deliberate, regulated action in the torture.
    reason: lexical_alternative
  - marker: b
    text: Or 'having his joints dislocated' or 'with his limbs wrenched apart'; the Greek verb refers to violent dislocation of the body's joints or vertebrae.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 위에서, 몸이 팽팽히 당겨진 채로 질서정연하게 사지가 뒤틀리며, 그는 아래에서 불타고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘조심스럽게’, ‘방법적으로’로도 옮길 수 있습니다. 그리스어 부사 εὐμελῶς는 고문이 의도적으로, 규율 있게 진행되었음을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘관절이 탈구되며’, ‘마디마디가 어긋나며’로도 옮길 수 있습니다. 그리스어 동사 ἐκσφονδυλιζόμενος는 관절이나 척추가 강제로 빠지는 폭력을 가리킵니다.
    reason: lexical_alternative
