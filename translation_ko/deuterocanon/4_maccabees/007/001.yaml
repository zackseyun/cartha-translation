  text: For just as the reasoning of our father Eleazar[a], like an excellent helmsman, was steering the ship of godliness on the sea of the passions[b],
  footnotes:
  - marker: a
    text: Or 'the ship of piety.' The Greek εὐσέβεια can denote reverent devotion toward God expressed in faithful conduct.
    reason: lexical_alternative
  - marker: b
    text: The Greek πάθη here likely means 'passions' or disordered emotions, a key theme in 4 Maccabees, rather than merely 'sufferings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리 아버지 엘레아자르의 이성적 판단은 가장 뛰어난 키잡이처럼, 정념의 바다에서 경건[a]의 배를 조종하고 있었으니,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘신심’. 그리스어 εὐσέβεια는 하나님께 대한 경건한 헌신이 신실한 행동으로 드러나는 것을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 그리스어 πάθη는 이 책의 핵심 주제인 ‘정념’, 곧 통제되지 않은 감정이나 욕망을 가리킬 가능성이 크며, 단순히 ‘고난’을 뜻하는 것은 아닙니다.
    reason: lexical_alternative
