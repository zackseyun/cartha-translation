  text: Such men must be those who establish the law with their own blood[a], and defend it with noble sweat through sufferings unto death.
  footnotes:
  - marker: a
    text: Or 'those who uphold the law'; the Greek verb can suggest making, producing, or causing something to stand, and here likely means establishing the law by faithful action rather than legislating it.
    reason: lexical_alternative
translation:
  language: ko
  text: 이런 이들은 자기 피로 율법을 세우고, 고귀한 땀으로 죽음에 이르기까지의 고난을 통하여 그것을 변호하는 사람들이어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘율법을 지키는 사람들’; 그리스어 동사는 만들다, 산출하다, 세우게 하다의 뜻을 가질 수 있으며, 여기서는 율법을 입법하는 것이 아니라 충실한 행동으로 율법을 확립하는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
