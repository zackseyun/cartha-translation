translation:
  language: ko
  text: 이는 철학의 모든 규범을 따라 경건하게 철학을 실천하며 하나님을 신뢰하는 사람이 누가 있겠습니까,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπεὶ
  english_pob_choice: For
  chosen_korean: 그러므로
  alternatives_korean:
  - 이는
  - 왜냐하면
  lexicon: LSJ
  rationale: 앞선 진술에 대한 이유 제시로서 문맥상 원인보다 논증적 연결이 강하므로, 자연스러운 접속 부사인 ‘그러므로’를 택했습니다.
- source_word: πρὸς ὅλον τὸν τῆς φιλοσοφίας κανόνα
  english_pob_choice: according to the whole rule of philosophy
  chosen_korean: 철학의 온 규범에 따라
  alternatives_korean:
  - 철학의 모든 규범에 따라
  - 철학의 온 기준에 따라
  lexicon: LSJ
  rationale: κανών은 여기서 철학적·도덕적 ‘규범/기준’의 뜻이므로 ‘규범’으로 옮겼고, ὅλον의 총체성을 ‘온’으로 살렸습니다.
- source_word: εὐσεβῶς φιλοσοφῶν
  english_pob_choice: devoutly pursuing philosophy
  chosen_korean: 경건하게 철학하며
  alternatives_korean:
  - 경건하게 철학을 실천하며
  - 경건하게 철학을 추구하며
  lexicon: LSJ
  rationale: εὐσεβῶς는 경건한 태도를, φιλοσοφῶν은 단순 사색이 아니라 삶의 방식으로서의 철학 실천을 가리키므로 간결하게 ‘경건하게 철학하며’로 옮겼습니다.
- source_word: πεπιστευκὼς θεῷ
  english_pob_choice: having put his trust in God
  chosen_korean: 하나님을 믿고 있다면
  alternatives_korean:
  - 하나님을 신뢰하고 있다면
  - 하나님께 믿음을 두고 있다면
  lexicon: LSJ
  rationale: 완료분사 πεπιστευκώς는 지속적 신뢰 상태를 나타내므로 ‘믿고 있다’로 옮겼고, θεῷ는 한국어에서 자연스러운 목적어 구조로 처리했습니다.
theological_decisions:
- issue: πιστεύω의 뉘앙스
  chosen_reading: ‘믿고 있다’는 단순 지적 동의보다 하나님께 대한 지속적 신뢰를 드러냅니다.
  alternative_readings:
  - ‘믿었다’
  - ‘신뢰하고 있다’
  rationale: 문맥상 완료분사는 이미 형성된 신뢰 상태를 나타내므로, 현재적 지속성을 띤 표현이 원문 의미를 더 잘 살립니다.
  doctrine_reference: 'DOCTRINE.md: πίστις/πιστεύω는 문맥에 따라 믿음과 신뢰의 결을 구분'
