base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/007/015.yaml
  text: O blessed old age[a], and venerable gray hair, and a law-abiding life, which a faithful seal of death brought to completion.
  footnotes:
  - marker: a
    text: Or 'which a true/trustworthy seal of death perfected.' The Greek compresses the metaphor, and 'faithful seal of death' may also be understood as death serving as the reliable confirmation of such a life.
    reason: lexical_alternative
translation:
  language: ko
  text: 오, 복된 노년이여, 존귀한 백발이여, 율법에 따른 삶이여—죽음의 믿을 만한 인장이 그 삶을 완성하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죽음의 참된 인장이 그 삶을 완성하였습니다.’ 그리스어는 이 은유를 압축하여 표현합니다. ‘죽음의 믿을 만한 인장’은 죽음이 그러한 삶을 믿을 만하게 확증한다는 뜻으로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαρίου
  english_pob_choice: blessed
  chosen_korean: 복된
  alternatives_korean:
  - 행복한
  - 복이 있는
  lexicon: LSJ
  rationale: 여기서는 감정적 행복보다 높임과 칭송의 뉘앙스가 중심이므로, 경탄문에 어울리는 ‘복된’이 가장 자연스럽습니다.
- source_word: σεμνῆς πολιᾶς
  english_pob_choice: venerable gray hair
  chosen_korean: 존귀한 백발
  alternatives_korean:
  - 경건한 흰머리
  - 존엄한 백발
  - 경외받는 백발
  lexicon: LSJ
  rationale: πολιᾶς는 문자적으로 흰머리이지만 나이 든 존엄을 가리키는 메토님이므로, ‘백발’로 살리고 σεμνῆς의 공경받는 품위를 ‘존귀한’으로 옮겼습니다.
- source_word: βίου νομίμου
  english_pob_choice: a law-abiding life
  chosen_korean: 율법을 따른 삶
  alternatives_korean:
  - 법을 지킨 삶
  - 율법에 따른 삶
  - 합법적인 삶
  lexicon: LSJ
  rationale: 4마카베오서는 유대적 율법 충실성을 칭송하므로, 일반적 ‘법’보다 ‘율법’이 원문의 종교·언약적 맥락을 더 분명히 드러냅니다.
- source_word: πιστὴ θανάτου σφραγὶς
  english_pob_choice: faithful seal of death
  chosen_korean: 죽음의 신실한 인장
  alternatives_korean:
  - 죽음의 믿을 만한 인장
  - 죽음의 참된 인장
  - 죽음의 신실한 봉인
  lexicon: LSJ
  rationale: σφραγίς의 비유를 그대로 살리기 위해 ‘인장’을 택했고, πιστὴ는 서술적 설명보다 ‘신실한’으로 압축해 원문의 긴밀한 은유를 유지했습니다.
- source_word: ἐτελείωσεν
  english_pob_choice: brought to completion
  chosen_korean: 완성하였습니다
  alternatives_korean:
  - 이루었습니다
  - 완결하였습니다
  - 온전하게 하였습니다
  lexicon: LSJ
  rationale: τελειόω의 종결·성취 뉘앙스를 현대 한국어에서 가장 간명하게 전달하는 표현으로 ‘완성하다’를 선택했습니다.
theological_decisions:
- issue: 죽음의 역할을 어떻게 이해할 것인가
  chosen_reading: 죽음이 삶을 증명하는 표지로서 ‘신실한 인장’처럼 작동한다고 옮겼습니다.
  alternative_readings:
  - 죽음이 삶을 완성시키는 수단이다
  - 죽음이 그 삶을 확증한다
  rationale: 본문은 죽음을 단순한 종결이 아니라 한 삶의 진정성과 성취를 확인하는 압축된 은유로 제시합니다. 이를 지나치게 해설하지 않으면서도 ‘인장’ 이미지를 보존했습니다.
  doctrine_reference: Translation philosophy §3
- issue: 율법의 성격
  chosen_reading: ‘율법’을 사용해 유대 전승과 토라 충실성의 맥락을 드러냈습니다.
  alternative_readings:
  - 법
  - 규범
  rationale: 문맥상 일반 법질서보다 하나님께 받은 율법에 대한 순종이 중심이므로, 전통적 신앙어를 소거하지 않는 방향이 본문의 의도를 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §1, §5
