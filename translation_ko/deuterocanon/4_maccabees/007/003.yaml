  naturalness: ‘경건의 노’는 이해할 수 있으나 현대 한국어에서 조타 기능이 충분히 드러나지 않습니다. ‘경건의 조타용 노’가 원문의 항해 은유와 οἴαξ의 의미를 더 분명하게 전달합니다. 문장 연결도 ‘않았으며’가 자연스럽습니다.
