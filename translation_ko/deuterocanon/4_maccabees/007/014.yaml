translation:
  language: ko
  text: 그는 이성의 영과 이삭 같은 이성으로 여러 머리가 달린 바퀴를 무력화하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러 머리가 달린 고문용 바퀴’; στρέβλα는 고문 기구를 가리키며, ‘바퀴’는 그 구체적인 이미지를 보존합니다.
    reason: lexical_alternative
