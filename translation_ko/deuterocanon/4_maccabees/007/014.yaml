  to: 그는 이성의 영과 이삭 같은 이성으로 여러 머리가 달린 바퀴를 무력화하였습니다.[a]
  rationale: ‘다두의’를 ‘여러 머리가 달린’으로 고쳐 πολυκέφαλον의 이미지를 자연스러운 현대 한국어로 보존했습니다. 본문은 στρέβλα의 구체적 ‘바퀴’ 이미지를 유지하고, 고문 기구라는 넓은 어휘 의미는 유의미한 대안으로 각주에 제시했습니다. 접속사 ‘그리고’를 생략하여 두 여격 수단 표현의 병렬을 자연스럽게 다듬었습니다.
