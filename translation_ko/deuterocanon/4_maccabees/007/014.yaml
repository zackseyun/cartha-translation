  text: by the spirit of reason[a], and by Isaac-like reason he nullified the many-headed wheel.
  footnotes:
  - marker: a
    text: Or 'the many-headed torture-wheel'; the Greek στρέβλα denotes an instrument of torture, and 'wheel' preserves the concrete image while the broader sense may be implied.
    reason: lexical_alternative
translation:
  language: ko
  text: 이성의 영으로, 그리고 이삭 같은 이성으로 그는 그 다두의 고문용 바퀴를 무력화하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다두의 고문용 바퀴’; στρέβλα는 고문 장치를 가리키며, ‘바퀴’는 그 구체적 이미지를 살립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεύματι
  english_pob_choice: spirit
  chosen_korean: 영
  alternatives_korean:
  - 정신
  - 마음
  - 기운
  lexicon: BDAG
  rationale: 여기서 πνεῦμα는 성령이 아니라 이성을 움직이는 내적 동인을 가리키므로, 한국어로도 영을 택해 은유적 힘을 살렸습니다.
- source_word: τοῦ λογισμοῦ / λογισμῷ
  english_pob_choice: reason / reason
  chosen_korean: 이성
  alternatives_korean:
  - 이유
  - 사유
  - 추론
  - 판단
  lexicon: BDAG
  rationale: 반복되는 λογισμός의 핵심은 욕정에 맞서는 이성적 결단이므로, 두 번 모두 이성으로 옮겨 반복성과 의미를 함께 보존했습니다.
- source_word: Ἰσακείῳ
  english_pob_choice: Isaac-like
  chosen_korean: 이삭 같은
  alternatives_korean:
  - 이삭의
  - 이삭다운
  - 이삭처럼
  lexicon: LSJ
  rationale: 형용사는 소유보다 유사성을 나타내므로, 한국어에서도 ‘이삭 같은’으로 옮겨 이삭에 대한 암시와 비교의 뉘앙스를 유지했습니다.
- source_word: στρέβλαν
  english_pob_choice: wheel
  chosen_korean: 고문용 바퀴
  alternatives_korean:
  - 바퀴
  - 형구
  - 고문기구
  - 형틀
  lexicon: LSJ
  rationale: στρέβλα는 고문 장치를 가리키며, 본문 이미지의 구체성을 살리면서도 독자가 이해할 수 있도록 ‘고문용 바퀴’로 풀었습니다.
- source_word: ἠκύρωσεν
  english_pob_choice: nullified
  chosen_korean: 무력화하였습니다
  alternatives_korean:
  - 무효화하였습니다
  - 무효로 만들었습니다
  - 좌절시켰습니다
  lexicon: BDAG
  rationale: 단순히 없애기보다 기능을 잃게 만드는 뜻이므로, 고문 장치의 의도를 꺾는 강한 의미를 담아 무력화하였습니다로 번역했습니다.
theological_decisions:
- issue: τῷ πνεύματι τοῦ λογισμοῦ의 성격
  chosen_reading: 하나님의 영이 아니라 이성의 내적 동인
  alternative_readings:
  - 마음의 힘
  - 지혜의 영
  rationale: 문맥 전체가 고난 속에서 이성이 정념을 제압하는 흐름이므로, 신학적으로 성령을 암시하는 번역은 원문이 허락하는 범위를 넘습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
- issue: Ἰσακείῳ의 암시 기능
  chosen_reading: 이삭을 닮은 비교적 표현
  alternative_readings:
  - 이삭에게 속한 이성
  - 이삭의 본을 따른 이성
  rationale: 형용사형은 직접 소유보다 유사와 상징을 가리키므로, 본문이 요구하는 암시를 유지하고 해석을 과잉 확장하지 않았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
