  rationale: 문맥 전체가 고난 속에서 이성이 정념을 제압하는 흐름이므로, 신학적으로 성령을 암시하는 번역은 원문이 허락하는 범위를 넘습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
- issue: Ἰσακείῳ의 암시 기능
  chosen_reading: 이삭을 닮은 비교적 표현
