  - marker: a
    text: Or “overcome the passions” or “gain control over their passions.”
    reason: lexical_alternative
  - marker: b
    text: Or “have reason that is wise/sound.” The Greek uses a key term for rational judgment central to 4 Maccabees’ argument.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 아마도 어떤 이들은 이렇게 말할지도 모릅니다. 「모든 사람이 자신의 정념을 제압하는 것은 아닙니다. 모든 사람이 분별 있는 이성을 지니고 있는 것은 아니기 때문입니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴσως δʼ ἂν εἴποιέν τινες
  english_pob_choice: But perhaps some might say
  chosen_korean: 그러나 어떤 이들은 이렇게 말할지도 모릅니다
  alternatives_korean:
  - 아마도 어떤 이들은 말할지도 모릅니다
  - 어떤 이들은 아마 말할 수 있습니다
  lexicon: LSJ
  rationale: ἴσως와 optative+ἄν의 잠정적·가상적 어조를 한국어의 ‘말할지도 모릅니다’로 자연스럽게 옮겨, 반대 견해를 도입하는 수사적 기능을 살렸습니다.
- source_word: τῶν παθῶν
  english_pob_choice: their passions
  chosen_korean: 자신의 정념
  alternatives_korean:
  - 그들의 정념
  - 욕망
  lexicon: LSJ
  rationale: 4 Maccabees에서 πάθη는 외적 고난보다 이성으로 다스려야 할 정념/욕구를 가리키므로, 문맥에 맞는 철학적 용어인 ‘정념’을 택했습니다.
- source_word: οὐ πάντες περικρατοῦσιν
  english_pob_choice: Not all gain mastery over
  chosen_korean: 모든 사람이 ... 제압하는 것은 아니니
  alternatives_korean:
  - 모든 사람이 ... 지배하는 것은 아니니
  - 모든 사람이 ... 이겨내는 것은 아니니
  lexicon: LSJ
  rationale: περικρατέω의 ‘제압하다/장악하다’ 의미를 살리되, 한국어에서는 서술형으로 풀어 ‘제압하는 것은 아니니’라고 해 자연스러운 문장을 만들었습니다.
- source_word: φρόνιμον ἔχουσιν τὸν λογισμόν
  english_pob_choice: have prudent reason
  chosen_korean: 분별 있는 이성을 지니고 있지 않기 때문입니다
  alternatives_korean:
  - 신중한 이성을 지니고 있지 않기 때문입니다
  - 현명한 판단력을 지니고 있지 않기 때문입니다
  lexicon: LSJ
  rationale: φρόνιμον은 단순한 지적 능력보다 실천적 분별을 뜻하므로 ‘분별 있는’으로 옮겼고, λογισμός는 4마카베오스의 핵심어로서 ‘이성’으로 번역해 철학적 논지를 살렸습니다.
theological_decisions:
- issue: 이성의 결핍과 정념 통제 실패의 관계
  chosen_reading: 이 구절은 모든 사람이 이성 자체를 갖지 못한다는 뜻이 아니라, 정념을 다스릴 만큼 분별 있는 이성을 갖추지 못한 사람이 있다는 반론을 제시합니다.
  alternative_readings:
  - 단순히 어떤 사람들은 더 약해서 정념을 이기지 못한다고 읽을 수도 있습니다.
  rationale: 그리스어의 φρόνιμον ἔχουσιν τὸν λογισμόν은 이성의 ‘보유’와 그 성격을 함께 말하므로, 인간성 일반을 부정하지 않으면서 윤리적·철학적 논점을 유지해야 합니다.
  doctrine_reference: 인간론
