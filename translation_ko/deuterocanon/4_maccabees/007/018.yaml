lexical_decisions:
- source_word: ἀλλʼ
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  lexicon: LSJ
  rationale: 앞의 주장과의 대조를 자연스럽게 드러내는 한국어 접속사로, 문맥의 반전과 강조를 살립니다.
- source_word: τῆς εὐσεβείας προνοοῦσιν
  english_pob_choice: care for godliness
  chosen_korean: 경건을 돌보는
  alternatives_korean:
  - 경건을 염려하는
  - 경건에 힘쓰는
  - 경건을 주의 깊게 살피는
  lexicon: LSJ
  rationale: προνοέω의 ‘미리 돌보다/주다’에서 확장된 적극적 관심을 반영해, 단순한 마음가짐보다 지속적 배려의 뉘앙스를 살렸습니다.
- source_word: ἐξ ὅλης καρδίας
  english_pob_choice: with their whole heart
  chosen_korean: 온 마음으로
  alternatives_korean:
  - 마음 다하여
  - 전심으로
  lexicon: LSJ
  rationale: 전체성의 강조를 간결하게 옮기되, 한국어에서 자연스러운 전심성 표현을 택했습니다.
- source_word: κρατεῖν
  english_pob_choice: master
  chosen_korean: 다스릴 수 있습니다
  alternatives_korean:
  - 제어할 수 있습니다
  - 지배할 수 있습니다
  - 통제할 수 있습니다
  lexicon: LSJ
  rationale: κρατέω의 ‘붙들어 제어하다/장악하다’는 강한 의미를 살리면서도 한국어에서 과도하게 위압적으로 들리지 않도록 ‘다스리다’를 선택했습니다.
- source_word: τῶν τῆς σαρκὸς παθῶν
  english_pob_choice: the passions of the flesh
  chosen_korean: 육체의 정욕
  alternatives_korean:
  - 육체의 열정
  - 육신의 욕망
  - 육체의 욕정
  lexicon: LSJ
  rationale: πάθη를 단순한 ‘고난’이 아니라 윤리적·심리적 ‘정욕/정념’으로 읽는 문맥을 반영했고, σάρξ는 POB 기본값인 ‘flesh’에 맞춰 ‘육체’로 옮겼습니다.
theological_decisions:
- issue: σάρξ의 번역을 ‘육체’로 유지할지, 해석적 표현으로 풀지
  chosen_reading: 육체
  alternative_readings:
  - 육신
  - 죄된 본성
  - 몸
  rationale: 본문은 육체와 연결된 정념을 말하지만, ‘죄된 본성’처럼 교리적으로 확장된 표현은 원문의 범위를 넘어설 수 있어 source-direct한 ‘육체’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — σάρξ'
