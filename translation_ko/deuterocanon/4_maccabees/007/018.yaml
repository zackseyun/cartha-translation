  rationale: προνοέω의 ‘미리 돌보다/주다’에서 확장된 적극적 관심을 반영해, 단순한 마음가짐보다 지속적 배려의 뉘앙스를 살렸습니다.
- source_word: ἐξ ὅλης καρδίας
