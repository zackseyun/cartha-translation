  lexicon: LSJ
  rationale: κρατέω의 ‘붙들어 제어하다/장악하다’는 강한 의미를 살리면서도 한국어에서 과도하게 위압적으로 들리지 않도록 ‘다스리다’를 선택했습니다.
- source_word: τῶν τῆς σαρκὸς παθῶν
  english_pob_choice: the passions of the flesh
  chosen_korean: 육체의 정욕
  alternatives_korean:
