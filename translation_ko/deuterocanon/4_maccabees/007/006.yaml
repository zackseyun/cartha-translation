  text: O priest[a], worthy of the priesthood, you did not defile your sacred teeth, nor did you make your stomach—which had room for godliness and purity—a partner in defiling food.
  footnotes:
  - marker: a
    text: Or 'nor did you share in defiling eating.' The Greek term refers to participation in food that brings ritual or moral defilement.
    reason: lexical_alternative
translation:
  language: ko
  text: 오, 제사장직에 합당한 제사장이시여, 당신은 거룩한 이빨을 더럽히지 않으셨고, 경건함과 정결함을 품을 수 있던 배를 더럽혀진 음식을 먹는 일에 참여시키지도 않으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘더럽혀진 음식을 먹는 일에 참여하지도 않으셨습니다.’ 그리스어 표현은 의례적 또는 도덕적 더러움을 가져오는 음식 섭취에 참여하는 것을 가리킬 수 있습니다.
    reason: lexical_alternative
