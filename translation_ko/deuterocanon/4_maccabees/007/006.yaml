  source_fidelity: 첫 절의 호격과 ‘거룩한 이빨’이라는 의도적으로 구체적인 이미지는 충실합니다. 그러나 ‘배를 더럽히는 음식과 함께 나누다’는 ἐκοινώνησας의 사역·결합 의미와 μιεροφαγίᾳ의 ‘더럽힘을 수반하는 음식 섭취’ 의미를 한국어에서 부정확하고 어색하게 만듭니다.
  naturalness: ‘음식과 함께 나누다’는 한국어에서 배가 음식과 무엇을 나눈다는 뜻으로 읽혀 부자연스럽습니다. ‘배를 … 음식을 먹는 일에 참여시키다’는 원문의 수사적 신체 이미지를 유지하면서도 자연스럽습니다.
  terminology: ‘제사장직’, ‘거룩한’, ‘경건함’, ‘정결함’, ‘더럽히다’는 본문의 제의적·도덕적 정결 어휘를 적절히 보존합니다. μιεροφαγίᾳ는 단순한 ‘음식’보다 음식 섭취 행위를 가리키도록 옮기는 것이 낫습니다.
  issues:
