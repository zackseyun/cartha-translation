- source_word: χωρήσασαν γαστέρα ἐκοινώνησας μιεροφαγίᾳ
  english_pob_choice: make your stomach—which had room for godliness and purity—a partner in defiling food
  chosen_korean: 경건함과 정결함이 들어갈 자리가 있던 배를 더럽히는 음식과 함께 나누지도 않으셨습니다
  alternatives_korean:
  - 경건함과 정결함을 담을 수 있던 배를 더럽히는 음식과 함께하지도 않으셨습니다
  - 경건함과 정결함이 머물 자리가 있던 위를 더럽히는 음식에 참여시키지도 않으셨습니다
  lexicon: LSJ
  rationale: χωρέω의 '자리가 있다/받아들이다'는 뜻을 '들어갈 자리'로 살리고, ἐκοινώνησας의 참여 의미는 '함께 나누다'로 표현해 음식과의 결합을 드러냈습니다.
theological_decisions:
