  text: O priest[a], worthy of the priesthood, you did not defile your sacred teeth, nor did you make your stomach—which had room for godliness and purity—a partner in defiling food.
  footnotes:
  - marker: a
    text: Or 'nor did you share in defiling eating.' The Greek term refers to participation in food that brings ritual or moral defilement.
    reason: lexical_alternative
translation:
  language: ko
  text: 오, 제사장직에 합당한 제사장이시여, 당신은 거룩한 이빨을 더럽히지 않으셨고, 경건함과 정결함이 들어갈 자리가 있던 배를 더럽히는 음식과 함께 나누지도 않으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '더럽히는 먹는 일에 참여하지도 않으셨습니다.' 그리스어는 오염을 일으키는 음식 섭취에 동참하는 것을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ ἄξιε τῆς ἱερωσύνης ἱερεῦ
  english_pob_choice: O priest, worthy of the priesthood
  chosen_korean: 오, 제사장직에 합당한 제사장이시여
  alternatives_korean:
  - 오, 제사장이여, 제사장직에 합당한 분이시여
  - 오, 제사장직에 합당한 제사장이여
  lexicon: LSJ
  rationale: 호격의 감탄과 칭찬을 살리면서 ἱερωσύνης의 소속 관계를 '제사장직'으로 옮겨 제사장과 제사장직을 함께 드러냈습니다.
- source_word: ἐμίανας / τοὺς ἱεροὺς ὀδόντας
  english_pob_choice: defile / your sacred teeth
  chosen_korean: 거룩한 이빨을 더럽히지 않으셨고
  alternatives_korean:
  - 성스러운 이빨을 더럽히지 않으셨고
  - 거룩한 치아를 더럽히지 않으셨고
  lexicon: LSJ
  rationale: 의례적·도덕적 오염의 동사를 '더럽히다'로 살리고, ὀδόντας의 구체적 신체 이미지는 완화하지 않았습니다.
- source_word: θεοσέβειαν καὶ καθαρισμόν
  english_pob_choice: godliness and purity
  chosen_korean: 경건함과 정결함
  alternatives_korean:
  - 하나님 경외와 정결
  - 경건과 순결
  lexicon: LSJ
  rationale: θεοσέβεια의 '하나님을 향한 경건'과 καθαρισμός의 정결 상태를 자연스러운 합쇼체 한국어로 짝지어 옮겼습니다.
- source_word: χωρήσασαν γαστέρα ἐκοινώνησας μιεροφαγίᾳ
  english_pob_choice: make your stomach—which had room for godliness and purity—a partner in defiling food
  chosen_korean: 경건함과 정결함이 들어갈 자리가 있던 배를 더럽히는 음식과 함께 나누지도 않으셨습니다
  alternatives_korean:
  - 경건함과 정결함을 담을 수 있던 배를 더럽히는 음식과 함께하지도 않으셨습니다
  - 경건함과 정결함이 머물 자리가 있던 위를 더럽히는 음식에 참여시키지도 않으셨습니다
  lexicon: LSJ
  rationale: χωρέω의 '자리가 있다/받아들이다'는 뜻을 '들어갈 자리'로 살리고, ἐκοινώνησας의 참여 의미는 '함께 나누다'로 표현해 음식과의 결합을 드러냈습니다.
theological_decisions:
- issue: 신체 부위와 음식에 대한 정결 언어를 얼마나 직접적으로 보존할지
  chosen_reading: '''거룩한 이빨''과 ''배''의 구체적 이미지를 유지해 순교자의 식물 규례 충성을 몸의 언어로 보여 주었습니다.'
  alternative_readings:
  - 보다 완곡하게 '거룩한 몸'이나 '식사'로 일반화하는 읽기
  rationale: 본문은 의도적으로 육체적이고 수사적이므로, 이미지를 평준화하면 유대교 정결과 순교의 긴장이 약해집니다.
  doctrine_reference: Translation philosophy §§1, 6
