revisions:
- from: 그러나 가장 놀라운 것은, 그가 이미 늙은 사람이었고, 몸의 고통은 이미 풀리고, 살은 늘어졌으며, 심지어 힘줄마저 닳아 있었는데도, 젊음을 되찾았다는 점입니다.[a]
  to: 그런데도 가장 놀라운 것은, 그가 노인이었고 몸의 기력이 이미 쇠했으며 살은 늘어지고 힘줄마저 지쳤는데도 젊음을 되찾았다는 것입니다.[a]
  rationale: The revision removes the Korean implication that pain was relieved and instead expresses the contextual image of failing bodily strength. It preserves the source’s concessive buildup, literal physical sense of ‘flesh’ and ‘sinews,’ elevated final renewal imagery, and the lexical-alternative footnote.
