  text: 그러나 가장 놀라운 것은, 그가 이미 늙은 사람이었고, 몸의 고통은 이미 풀리고, 살은 늘어졌으며, 심지어 힘줄마저 닳아 있었는데도, 젊음을 되찾았다는 점입니다.[a]
  philosophy: optimal-equivalence
