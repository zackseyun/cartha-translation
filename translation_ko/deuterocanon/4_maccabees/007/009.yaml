translation:
  language: ko
  text: 아버지, 당신은 우리의 법을 따르는 삶을 견딤으로써 영광에 이르기까지 확증하셨고, 거룩함을 높이 말하면서도 그것을 무너뜨리지 않으셨으며, 당신의 행위로 철학의 말들을 입증하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영광을 위해’. εἰς δόξαν은 결과나 목적을 나타낼 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘철학의 말들/가르침들’. λόγοι는 ‘말들’, ‘논증들’, ‘가르침들’을 뜻할 수 있습니다.
    reason: alternative_reading
