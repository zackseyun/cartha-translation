  source_fidelity: 수정이 필요합니다. Ὥσπερ γὰρ는 뒤에 이어질 비교의 전반을 여는 표현이므로, ‘이는 곧 … 것과 같습니다’라는 독립적 결론 구조보다 ‘왜냐하면 … 것처럼’으로 옮기는 편이 원문의 미완결 비교 구조를 보존합니다. 또한 τῷ θυμιατηρίῳ는 καθωπλισμένος에 대한 수단을 나타내므로 ‘향로로 무장하고’가 정확합니다.
  naturalness: ‘향로를 무장한 채’는 한국어에서 향로 자체가 무장한 것처럼 읽힐 수 있어 부자연스럽습니다. ‘향로로 무장하고’가 현대 문어체에서 자연스럽고 원문의 비유적 군사 이미지를 살립니다. ‘불을 일으키는 천사’는 ἐμπυριστής의 행위적 의미를 자연스럽게 전달합니다.
  terminology: ὁ πατὴρ Ἀαρών의 존칭·선조적 용법은 ‘조상 아론’으로 반영했습니다. τὸν ἐμπυριστὴν ἄγγελον은 본문에서 ‘불을 일으키는 천사’로 번역하고, ‘불의 천사’와 ‘멸망시키는 천사’는 해석 가능성이므로 각주에 남겼습니다.
