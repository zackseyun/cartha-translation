  text: 왜냐하면 조상 아론이 향로로 무장하고 백성의 큰 무리 사이를 달려가며 불을 일으키는 천사를 이겨 냈던 것처럼,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불의 천사’, ‘멸망시키는 천사’로 옮길 수 있습니다. 이 표현은 민수기 16장에서 아론이 재앙을 막아선 일을 가리키는 듯합니다.
    reason: ‘불을 일으키는 천사’는 ἐμπυριστὴν ἄγγελον의 행위적 의미를 따릅니다. 다른 번역들은 가능한 어휘적·해석적 이해이므로 본문이 아니라 각주에 제시합니다.
