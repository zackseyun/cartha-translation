  text: For just as the father Aaron[a], armed with the censer, running through the midst of the multitude, overcame the fire-bearing angel,
  footnotes:
  - marker: a
    text: Or 'the angel of fire' or 'the destroying angel.' The phrase likely alludes to Aaron's intervention during the plague in Numbers 16.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 곧, 아론이 향로를 무장한 채 사람들의 큰 무리 한가운데를 달려가며, 불을 내는 천사를 이겨 낸 것과 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '불의 천사', '멸망시키는 천사'로 옮길 수 있습니다. 이 표현은 민수기 16장의 재앙을 아론이 막아선 장면을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥσπερ γὰρ
  english_pob_choice: For just as
  chosen_korean: 이는 곧
  alternatives_korean:
  - 이는 마치
  - 왜냐하면 마치
  lexicon: LSJ
  rationale: 비교를 도입하는 Ὥσπερ와 설명적 γάρ을 함께 살리되, 한국어에서는 문맥 연결이 자연스럽도록 '이는 곧'으로 정리했습니다.
- source_word: ὁ πατὴρ Ἀαρὼν
  english_pob_choice: father Aaron
  chosen_korean: 아론
  alternatives_korean:
  - 아버지 아론
  - 조상 아론
  lexicon: LSJ
  rationale: 영어 POB의 'father Aaron'은 아론을 선조적·존칭적으로 부르는 표현이지만, 한국어에서는 본문 흐름상 이름만 두어도 그 존칭 뉘앙스를 과도하게 덧붙이지 않으면서 유지할 수 있습니다.
- source_word: τῷ θυμιατηρίῳ
  english_pob_choice: with the censer
  chosen_korean: 향로를 무장한 채
  alternatives_korean:
  - 향로를 가지고
  - 향로로 무장한 채
  lexicon: LSJ
  rationale: θυμιατήριον은 향로/분향통이며, καθωπλισμένος의 군사적 이미지를 살리기 위해 '무장한 채'와 결합해 원문의 비유성을 드러냈습니다.
- source_word: διὰ τοῦ ἔθνοπλήθους
  english_pob_choice: through the mass of the people
  chosen_korean: 사람들의 큰 무리 한가운데를
  alternatives_korean:
  - 백성의 큰 무리 가운데를
  - 무리 한가운데를
  lexicon: LSJ
  rationale: 복합어 ἔθνοπλήθους의 '많은 사람들로 이루어진 집단'이라는 밀집감을 살려 '사람들의 큰 무리 한가운데를'로 옮겼습니다.
- source_word: τὸν ἐμπυριστὴν ἄγγελον
  english_pob_choice: the fire-bearing angel
  chosen_korean: 불을 내는 천사
  alternatives_korean:
  - 불을 지닌 천사
  - 불의 천사
  - 멸망시키는 천사
  lexicon: LSJ
  rationale: 본문은 문자 그대로 '불을 내는' 뉘앙스를 가지므로, 해석을 앞서지 않도록 본문 표현을 유지했습니다. 영어 POB의 각주가 제시한 '멸망시키는 천사' 가능성은 본문에 직접 삽입하지 않았습니다.
- source_word: ἐνίκησεν
  english_pob_choice: overcame
  chosen_korean: 이겨 냈습니다
  alternatives_korean:
  - 극복했습니다
  - 물리쳤습니다
  lexicon: LSJ
  rationale: νικάω의 승리·극복 의미를 현대 한국어에서 자연스럽고 강하게 전달하는 표현으로 옮겼습니다.
theological_decisions:
- issue: 천사의 정체를 본문에서 얼마나 구체화할지
  chosen_reading: 주본문에는 '불을 내는 천사'만 두고, '멸망시키는 천사' 같은 해석은 각주로만 처리하지 않았습니다.
  alternative_readings:
  - 멸망시키는 천사
  - 불의 천사
  rationale: 그리스어 표현 자체가 가리키는 바를 우선해 해석을 본문에 과도하게 주입하지 않도록 했습니다. 이는 원문의 긴장을 보존하는 방향입니다.
  doctrine_reference: 원문 우선 원칙; 해석적 확정의 절제
