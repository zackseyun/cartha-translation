  text: For this reason indeed[a], even young men, by philosophizing according to the reasoning of piety[b], overcame more severe tortures.
  footnotes:
  - marker: a
    text: Or 'by pious reason' or 'with godly reason.' The Greek phrase is central to 4 Maccabees' theme of reason directed by reverence toward God.
    reason: lexical_alternative
  - marker: b
    text: The participle can also be rendered 'practicing philosophy' or 'living philosophically.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 때문에, 참으로 젊은이들까지도 경건의 판단에 따라 철학하며 더 심한 고문을 이겨 냈습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '참으로: γε τοι의 강조를 반영한 것으로, 본문의 논증을 더욱 강하게 드러냅니다.'
    reason: lexical_alternative
  - marker: b
    text: '경건의 판단에 따라: τῷ τῆς εὐσεβείας λογισμῷ는 ‘경건한 이성으로’ 또는 ‘경건에 따른 숙고로’도 옮길 수 있습니다.'
    reason: lexical_alternative
lexical_decisions:
