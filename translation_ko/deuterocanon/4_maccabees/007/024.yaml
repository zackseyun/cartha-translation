  lexicon: LSJ
  rationale: χαλεπωτέρων은 비교급 강도를 살려 ‘더 심한’으로 옮기고, βασανιστήρια는 고문/가혹한 고통의 의미를 반영해 ‘고문’으로 번역했습니다.
