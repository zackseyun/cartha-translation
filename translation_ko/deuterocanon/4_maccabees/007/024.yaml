  rationale: λόγισμος의 핵심을 단순 ‘생각’보다 판단·숙고의 결과로 보아 ‘판단’으로 옮기고, εὐσέβεια는 이 책의 종교적 맥락에 맞게 ‘경건’으로 유지했습니다.
- source_word: φιλοσοφοῦντες
