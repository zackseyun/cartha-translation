  lexicon: LSJ
  rationale: 단순 승리보다 고난을 제압하고 견뎌낸 뉘앙스를 살려, 현대 한국어에서 자연스러운 ‘이겨 냈습니다’를 선택했습니다.
theological_decisions:
- issue: reason and piety in 4 Maccabees
  chosen_reading: ‘경건의 판단’으로 옮겨, 이성/숙고가 하나님 경외 아래 작동한다는 긴장을 살렸습니다.
