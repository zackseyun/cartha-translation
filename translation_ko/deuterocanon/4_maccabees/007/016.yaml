translation:
  language: ko
  text: 그러므로 한 노인이 경건함 때문에 죽음에 이르기까지의 고문들을 업신여겼다면, 경건한 이성은 분명히 정념들의 지배자입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경건함을 위하여’. 그리스어 전치사구는 원인뿐 아니라 목적의 뉘앙스로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: γέρων
  english_pob_choice: an old man
  chosen_korean: 한 노인
  alternatives_korean:
  - 한 늙은이
  - 한 연로한 사람
  lexicon: LSJ
  rationale: 그리스어 γέρων은 연로한 남성을 가리키므로, 현대 한국어에서는 자연스럽고 남성 단수성을 살리는 ‘한 노인’이 가장 적절합니다.
- source_word: περιεφρόνησεν
  english_pob_choice: despised
  chosen_korean: 업신여겼다면
  alternatives_korean:
  - 경멸했다면
  - 하찮게 여겼다면
  lexicon: LSJ
  rationale: 동사는 강한 경시·경멸의 의미를 가지므로, 비교적 평이하면서도 강도를 살리는 ‘업신여기다’를 택했습니다.
- source_word: διʼ εὐσέβειαν
  english_pob_choice: because of piety
  chosen_korean: 경건함 때문에
  alternatives_korean:
  - 경건함을 위하여
  - 경건 때문에
  lexicon: LSJ
  rationale: διά + 목적격은 원인과 목적 모두의 뉘앙스를 지닐 수 있으나, 본문 논지상 원인 의미가 자연스러워 ‘때문에’로 옮겼습니다.
- source_word: ὁ εὐσεβὴς λογισμός
  english_pob_choice: pious reason
  chosen_korean: 경건한 이성
  alternatives_korean:
  - 경건한 사고
  - 경건한 판단
  lexicon: LSJ
  rationale: 이 구절은 4마카베오스의 핵심 철학적 표현으로, λογισμός의 이성적·판단적 의미를 살리면서도 εὐσεβής의 종교적 경건성을 반영해 ‘경건한 이성’으로 번역했습니다.
theological_decisions:
- issue: τῶν παθῶν의 철학적 용어성
  chosen_reading: 정념들의 지배자
