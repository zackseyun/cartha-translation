translation:
  language: ko
  text: 그렇다면, 한 노인이 경건함 때문에 죽음에 이르는 고문도 업신여겼다면, 경건한 이성은 정녕 정념들의 지배자입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경건함을 위하여’. 그리스어 전치사구는 원인뿐 아니라 목적의 뉘앙스로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: γέρων
