  yaml_path: translation/deuterocanon/4_maccabees/007/012.yaml
  text: Thus Eleazar[a], the descendant of Aaron, though being burned through the fire[b], did not change his resolve.
  footnotes:
  - marker: a
    text: Greek literally, 'the Aaronide.' That is, one belonging to the line of Aaron.
    reason: lexical_alternative
  - marker: b
    text: Or 'did not change his reason' / 'did not alter his rational purpose.' The Greek term can denote reasoned resolve, an important theme in 4 Maccabees.
    reason: alternative_reading
translation:
  language: ko
  text: 이처럼 아론의 후손 엘레아살은 불 속에서 타들어 가면서도 자신의 결심을 바꾸지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 Ἀαρωνίδης는 문자적으로 ‘아론의 계통에 속한 사람’을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자신의 이성/합리적 결심을 바꾸지 않았다’로 옮길 수 있습니다. λογισμός는 4 마카베오서에서 중요한 철학적 용어입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ Ἀαρωνίδης
  english_pob_choice: the descendant of Aaron
  chosen_korean: 아론의 후손
  alternatives_korean:
  - 아론 계열의 사람
  - 아론의 자손
  lexicon: LSJ
  rationale: Ἀαρωνίδης는 아론의 계통에 속한 사람을 뜻하므로, 한국어에서는 자연스럽고 분명한 ‘아론의 후손’으로 옮겼습니다.
- source_word: διὰ τοῦ πυρὸς
  english_pob_choice: through the fire
  chosen_korean: 불 속에서
  alternatives_korean:
  - 불 가운데서
  - 불을 통해
  lexicon: LSJ
  rationale: διά + 속격은 여기서 고통의 상황과 매개를 함께 드러내므로, 과도한 직역보다 형벌의 현장감을 살리는 ‘불 속에서’가 적절합니다.
- source_word: ὑπερτηκόμενος
  english_pob_choice: being burned through the fire
  chosen_korean: 타들어 가면서도
  alternatives_korean:
  - 불에 녹아 가면서도
  - 불에 소진되면서도
  lexicon: LSJ
  rationale: 이 분사는 극심한 열에 의해 녹아내리거나 소모되는 상태를 나타내므로, 현대 한국어에서 생생한 감각을 주는 ‘타들어 가면서도’로 옮겼습니다.
- source_word: τὸν λογισμόν
  english_pob_choice: his resolve
  chosen_korean: 자신의 결심
  alternatives_korean:
  - 자신의 이성
  - 자신의 판단
  - 자신의 사고
  lexicon: LSJ
  rationale: 4 마카베오서는 λογισμός를 이성적 사고와 의지의 결단이 결합된 개념으로 쓰지만, 이 문맥에서는 고문 아래서 꺾이지 않는 내적 결단을 가리키므로 ‘결심’이 가장 자연스럽습니다.
theological_decisions:
- issue: 4 마카베오서의 λογισμός 개념을 한국어로 어떻게 드러낼지
  chosen_reading: ‘결심’을 택해, 이성이 붙든 내적 결단이라는 책의 주제를 지나치게 철학적으로만 보이지 않게 했습니다.
  alternative_readings:
  - ‘이성’
  - ‘합리적 목적’
  - ‘사고방식’
  rationale: 이 책의 큰 주제는 이성이 정념을 다스린다는 데 있지만, 본문은 순교 고통 속에서도 흔들리지 않는 태도를 말합니다. 따라서 철학적 함의는 남기되, 독자가 문맥상 핵심을 즉시 이해할 수 있는 표현을 사용했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 5
