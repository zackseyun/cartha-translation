  rationale: 죽음/생명의 대조를 한국어에서 평이하게 살리되, ἀλλὰ의 대조를 ‘하지만’으로 분명히 드러냈습니다.
- source_word: οἱ πατριάρχαι ἡμῶν Ἀβραάμ, Ἰσαάκ, Ἰακώβ
  english_pob_choice: our patriarchs Abraham, Isaac, and Jacob
  chosen_korean: 우리 조상들인 아브라함과 이삭과 야곱
  alternatives_korean:
