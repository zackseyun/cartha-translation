  text: 믿는 사람들은 하나님께[a] 죽지 않고, 우리 족장들인 아브라함, 이삭, 야곱처럼 하나님께 살아 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어의 여격은 단순한 방향뿐 아니라 관계나 범위를 나타낼 수 있습니다. 곧 ‘하나님 앞에서’ 또는 ‘하나님의 시선에서’라는 뜻으로도 이해될 수 있으며, 이 절에서 두 번 반복됩니다.
    reason: lexical_alternative
