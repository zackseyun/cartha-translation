theological_decisions:
- issue: ‘하나님께 죽지 않는다/하나님께 산다’의 여격 의미
  chosen_reading: 관계적 여격으로 이해해 ‘하나님께 죽지 않지만, 살아 있습니다’로 번역했습니다.
  alternative_readings:
  - 하나님 앞에서 죽지 않지만 살아 있습니다
  - 하나님의 시선에서 죽지 않지만 살아 있습니다
  - 하나님을 위해 죽지 않지만 살아 있습니다
  rationale: 본문의 여격은 단순한 방향보다 하나님과의 관계를 나타내므로, 해석을 과도하게 풀지 않으면서도 원문의 긴장을 유지했습니다.
  doctrine_reference: 관계적 여격 보존; 해석 과잉 회피
- issue: 아브라함·이삭·야곱의 위치를 문장 끝 비교절로 배치
  chosen_reading: 비교절을 뒤에 두어 ‘우리 조상들인 아브라함과 이삭과 야곱도 그러합니다’로 처리했습니다.
  alternative_readings:
  - 우리 조상들인 아브라함과 이삭과 야곱처럼
  - 우리 조상들인 아브라함과 이삭과 야곱도 살아 있습니다
  rationale: 그리스어의 비교 구조(ὥσπερ γάρ ... ἀλλὰ)와 대조를 자연스러운 한국어 어순으로 재현했습니다.
  doctrine_reference: 문장 구조 보존
