  yaml_path: translation/deuterocanon/4_maccabees/007/005.yaml
  text: For[a], like a sheer cliff, father Eleazar, stretching out his own mind[b], broke around himself the surging waves of the passions that were raging.
  footnotes:
  - marker: a
    text: Or 'a precipitous height' or 'a steep crag.' The Greek image is of a sharply projecting rocky height standing against the sea.
    reason: lexical_alternative
  - marker: b
    text: '''Passions'' here refers to disordered impulses or appetites, a key theme in 4 Maccabees'' argument about the rule of the rational mind.'
