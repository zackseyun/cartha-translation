translation:
  language: ko
  text: 이는 엘레아자르 아버지께서 자신의 마음을 깎아지른 절벽처럼[a] 내세우셔서, 미쳐 날뛰는 정념[b]의 파도들을 자기 둘레에서 꺾으셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 비유는 바다에 맞서는 가파르게 돌출한 바위 곶이나 깎아지른 절벽을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘정념’은 단순한 감정이 아니라 질서를 잃은 내적 충동이나 욕구를 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: πρόκρημνον ἄκραν
  english_pob_choice: a sheer cliff
  chosen_korean: 곧바로 뻗어 내밀어
  alternatives_korean:
