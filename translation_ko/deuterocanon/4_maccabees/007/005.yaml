  - 깎아지른 절벽처럼
  - 험준한 바위 끝처럼
  lexicon: LSJ
  rationale: 그리스어의 핵심 이미지는 급경사의 돌출부이므로, 한국어에서는 뒤의 동작과 결합해 ‘곧바로 뻗어 내밀어’로 옮겨 비유의 힘을 살렸습니다.
- source_word: διάνοιαν
  english_pob_choice: mind
  chosen_korean: 마음
  alternatives_korean:
  - 생각
  - 이성
  - 정신
  lexicon: LSJ
  rationale: 이 문맥에서 διάνοια는 정념에 맞서는 내적 판단과 결의의 자리이므로, 한국어의 ‘마음’이 너무 기술적이지 않으면서도 인지·의지의 중심을 함께 드러냅니다.
- source_word: περιέκλασεν
  english_pob_choice: broke around himself
  chosen_korean: 자기 둘레에서 꺾으셨습니다
  alternatives_korean:
  - 자기 둘레에서 부러뜨리셨습니다
  - 둘레로 밀쳐내셨습니다
  - 자기 주위에서 꺾어 버리셨습니다
  lexicon: LSJ
  rationale: 복합동사의 둘레/주위라는 공간감을 살리면서, 파도에 대한 대응으로는 ‘꺾다’가 한국어에서 더 자연스럽게 저항과 제압을 함께 나타냅니다.
- source_word: μαινομένους τῶν παθῶν κλύδωνας
  english_pob_choice: the surging waves of the passions that were raging
  chosen_korean: 미쳐 날뛰는 정념의 파도들
  alternatives_korean:
  - 광란하는 정념의 물결들
  - 격렬히 날뛰는 욕망의 파도들
  - 소용돌이치는 정념의 물결들
  lexicon: LSJ
  rationale: πάθη는 4 마카베오기에서 절제되지 않은 내적 충동을 가리키므로 ‘정념’이 문맥의 철학적·도덕적 긴장을 유지합니다. κλύδωνας는 ‘파도들’로 옮겨 바다 이미지와 운동성을 살렸습니다.
theological_decisions:
- issue: 4 마카베오기 7:5의 인간 심리 대비를 어떻게 드러낼 것인가
  chosen_reading: ‘마음’과 ‘정념’의 대비를 유지해, 이성이 정념을 제압한다는 본문의 논지를 과도한 신학화 없이 드러냈습니다.
  alternative_readings:
  - ‘이성’과 ‘욕망’으로 더 해석적으로 옮기는 방법
  - ‘정신’과 ‘감정’으로 완화하는 방법
  rationale: 본문은 교리 진술보다 수사적 비유에 가깝기 때문에, 철학적 대립구조를 보존하되 현대 한국어에서 읽히는 자연스러움을 확보하는 쪽이 적절합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3, 6
