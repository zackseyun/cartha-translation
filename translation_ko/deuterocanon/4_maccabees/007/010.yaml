  yaml_path: translation/deuterocanon/4_maccabees/007/010.yaml
  text: O Eleazar[a], elder stronger than torments, old man more intense than fire[b], and king greater than sufferings.
  footnotes:
  - marker: a
    text: Or 'tortures' for 'torments'; the Greek can denote torture more specifically in this context.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek uses exalted metaphorical vocatives: ''elder,'' ''old man,'' and ''king'' are honorific acclamations addressed to Eleazar, not statements of political office.'
    reason: cultural_note
translation:
  language: ko
  text: 오 엘레아자르여, 고문보다 더 강하신 어르신이시여, 불보다 더 굳세신 노인이시여, 고난보다 더 위대하신 왕이시여.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘고문’은 이 문맥에서 βασάνων이 단순한 ‘시험’이 아니라 실제 고문과 고통을 가리킨다는 뜻을 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘어르신’, ‘노인’, ‘왕’은 엘레아자르에게 바치는 격찬의 호격들입니다. 여기서 ‘왕’은 정치적 직함을 뜻하지 않습니다.
    reason: cultural_note
