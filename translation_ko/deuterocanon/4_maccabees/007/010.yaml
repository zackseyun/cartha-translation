  rationale: πάθη는 여기서 내적 ‘정념’이 아니라 고문과 불에 맞서는 외적 고난을 뜻하므로, 문맥에 맞는 복수형 ‘고난들’이 적절합니다.
- source_word: βασιλεῦ
