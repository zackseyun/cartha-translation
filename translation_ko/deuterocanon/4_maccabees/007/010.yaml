theological_decisions:
- issue: 연속된 호격의 수사 보존
  chosen_reading: 엘레아자르를 설명문으로 풀지 않고, ‘노인… 장로… 왕’이라는 연속 호격으로 유지했습니다.
  alternative_readings:
  - ‘고문보다 강한 엘레아자르’처럼 서술형으로 풀기
  - 의미를 정리해 단일한 찬사로 압축하기
  rationale: 그리스어는 진술문이 아니라 격찬의 호격 연쇄이므로, 수사적 긴장과 순교 찬가의 장중함을 보존하는 것이 본문 의미에 더 충실합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; source rhetoric preservation'
- issue: ‘왕’의 비정치적 용법
  chosen_reading: ‘왕’은 엘레아자르의 정치적 지위가 아니라 고난을 이기는 우월성을 찬양하는 은유적 호칭으로 처리했습니다.
  alternative_readings:
  - ‘통치자’로 완화
  - 의미를 설명하는 주석형 번역
  rationale: 문맥상 칭송의 관용적 호칭이므로, 직역을 유지하되 오해를 줄이기 위해 수사적 용법으로 이해해야 합니다.
  doctrine_reference: Source rhetoric and genre sensitivity
