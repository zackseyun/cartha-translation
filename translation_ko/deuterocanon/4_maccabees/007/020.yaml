theological_decisions:
- issue: reason versus passions in 4 Maccabees
  chosen_reading: λογισμός를 '이성', παθοκρατεῖσθαι를 '정념에 지배당하다'로 옮겨 이성과 정념의 대조를 유지했습니다.
