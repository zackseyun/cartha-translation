  - λογισμός를 '생각'이나 '판단'으로 옮기기
  - παθοκρατεῖσθαι를 '감정에 압도되다'로 옮기기
  rationale: 이 책의 핵심 논지는 이성이 정념을 다스리는가에 관한 것이므로, 철학적 대조가 흐려지지 않도록 용어를 일관되게 유지했습니다.
