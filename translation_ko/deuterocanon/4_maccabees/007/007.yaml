  - 오이
  lexicon: LSJ
  rationale: 직접 호격을 드러내는 감탄사로, 높고 수사적인 부름의 톤을 살리기 위해 ‘오’로 옮겼습니다.
- source_word: σύμφωνε
  english_pob_choice: who are in harmony with
  chosen_korean: 율법과 조화를 이루며
