  lexicon: LSJ
  rationale: σύμφωνος의 핵심은 ‘함께 울리는/조화로운’ 의미이므로, 단순한 ‘동의’보다 관계적 합치를 드러내는 ‘조화를 이루며’를 택했습니다.
- source_word: θείου βίου
  english_pob_choice: the divine way of life
