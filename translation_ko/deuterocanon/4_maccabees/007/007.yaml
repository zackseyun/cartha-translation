translation:
  language: ko
  text: 오, 율법과 조화를 이루며 신적 삶의 철학자인 분이여.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘율법에 조화를 이루는’ 혹은 ‘율법과 합하는’. 그리스어는 공명이나 조화의 뜻을 지닌 표현을 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하나님께 속한 삶의 철학자’. θείου βίου는 ‘하나님에 의해 특징지어진 삶’이라는 뜻으로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὦ
  english_pob_choice: O
  chosen_korean: 오
  alternatives_korean:
