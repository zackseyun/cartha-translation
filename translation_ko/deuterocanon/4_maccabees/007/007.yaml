  lexicon: LSJ
  rationale: 영어 POB의 ‘divine way of life’가 지닌 압축된 수식 관계를 살리면서도 한국어에서 자연스럽게 읽히도록 ‘신적 삶’으로 간결하게 옮겼습니다.
theological_decisions:
- issue: θείου βίου의 신학적 뉘앙스
  chosen_reading: ‘신적 삶’은 단순한 윤리적 생활양식이 아니라 하나님께 속한 삶의 성격을 드러냅니다.
  alternative_readings:
  - ‘경건한 삶’으로 풀어 쓸 수 있습니다.
  - ‘하나님께 헌신된 삶’으로 해석할 수 있습니다.
  rationale: 본문은 철학적 수사와 종교적 경건을 함께 지닌 압축 표현이므로, 과도한 설명을 덧붙이지 않으면서도 하나님 지향성을 유지하는 번역이 적절합니다.
  doctrine_reference: 번역 원칙 §§1, 6
