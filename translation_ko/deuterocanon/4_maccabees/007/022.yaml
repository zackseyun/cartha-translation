base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/007/022.yaml
  text: And knowing that it is blessed to endure every pain for the sake of virtue[a], would he not prevail over the passions for the sake of godliness?
  footnotes:
  - marker: a
    text: Or 'piety' for 'godliness.' The Greek term denotes reverent devotion toward God.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 덕을 위해 모든 고통을 견디는 것이 복됨을 알면서, 경건을 위해 정념을 이기지 못하겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘신심’으로도 옮길 수 있습니다. 이 헬라어는 하나님께 대한 경건한 헌신을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρετή
  english_pob_choice: virtue
  chosen_korean: 덕
  alternatives_korean:
  - 미덕
  - 탁월함
  lexicon: LSJ
  rationale: 4 Maccabees의 윤리적 문맥에서 ἀρετή는 도덕적 탁월성과 덕을 가리키므로, 한국어로는 간결하고 문맥에 맞는 ‘덕’이 가장 자연스럽습니다.
- source_word: πάντα πόνον
  english_pob_choice: every pain
  chosen_korean: 모든 고통
  alternatives_korean:
  - 모든 아픔
  - 온갖 수고
  - 모든 괴로움
  lexicon: LSJ
  rationale: πόνος는 고통, 수고, 힘겨움을 아우르므로, 여기서는 집합적 표현을 살려 ‘모든 고통’으로 옮겨 반복적·전면적 감수의 뜻을 드러냈습니다.
- source_word: τῶν παθῶν
  english_pob_choice: the passions
  chosen_korean: 정념
  alternatives_korean:
  - 열정
  - 감정
  - 욕망
  lexicon: LSJ
  rationale: 여기서 πάθη는 단순 감정보다 통제되어야 할 내적 정념을 가리키는 철학적 용례이므로, 신학·윤리 문맥을 보존하는 ‘정념’이 적절합니다.
- source_word: εὐσέβειαν
  english_pob_choice: godliness
  chosen_korean: 경건
  alternatives_korean:
  - 경외
  - 신심
  - 공경
  lexicon: BDAG
  rationale: εὐσέβεια는 하나님께 대한 경외와 헌신을 포함하는 용어이므로, 한국어의 종교적 어휘 중 ‘경건’이 본문의 방향성을 가장 잘 살립니다.
theological_decisions:
- issue: 마카베오기 하권의 헬라 철학적 윤리 어휘를 한국어로 어떻게 보존할지
  chosen_reading: ἀρετή는 ‘덕’, πάθη는 ‘정념’, εὐσέβεια는 ‘경건’으로 옮겨 윤리적·종교적 긴장을 함께 드러냈습니다.
  alternative_readings:
  - ‘미덕/탁월함’ for ἀρετή
  - ‘감정/욕망’ for πάθη
  - ‘신심/경외’ for εὐσέβεια
  rationale: 이 구절은 고난을 견디는 윤리와 하나님께 대한 경건을 대조하므로, 너무 일상적이거나 지나치게 교회적 표현으로 평준화하지 않고 헬라적 도덕 어휘의 결을 살리는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
