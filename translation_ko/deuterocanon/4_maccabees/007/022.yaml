  source_fidelity: 그리스어의 인과적 분사 εἰδώς는 ‘알면서’로 자연스럽게 반영되었고, ‘모든 고통을 견디는 것이 복됨’, ‘정념을 이기다’ 및 수사의문문의 뜻도 충실합니다. διὰ τὴν ἀρετήν과 διὰ τὴν εὐσέβειαν은 문맥상 각각 덕과 경건을 동기·목적으로 삼는 의미이며, ‘덕을 위해’와 ‘경건을 위해’는 이를 무리 없이 전달합니다.
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽고 간결합니다. ‘정념’은 다소 전문적인 어휘이나, 4마카베오기의 철학적 윤리 문맥에서 의도된 기술적 의미를 정확히 보존하며 문장 안에서도 어색하지 않습니다.
  terminology: ἀρετή–πάθη–εὐσέβεια의 윤리적·종교적 어휘 관계를 각각 ‘덕–정념–경건’으로 일관되게 살렸습니다. 각주도 ‘신심’이라는 가능한 대안을 제시하면서 εὐσέβεια의 하나님을 향한 경건한 헌신의 의미를 적절히 설명합니다.
