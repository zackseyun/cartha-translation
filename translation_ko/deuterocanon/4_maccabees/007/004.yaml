base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/007/004.yaml
  text: No city under siege ever held out against many and varied siege engines as that most holy man[a], while his sacred soul was being burned by tortures and the wheel[b], stirred up those besieging him through the reason that defends godliness.
  footnotes:
  - marker: a
    text: Or 'racks' or more generally 'instruments of torture' for 'the wheel' (στρέβλαις). The exact device term is difficult, though it clearly refers to torturous means.
    reason: lexical_alternative
  - marker: b
    text: Or 'because of reason defending godliness/piety.' The Greek places strong emphasis on λογισμός ('reason') as the power by which he resisted.
    reason: lexical_alternative
translation:
  language: ko
  text: 포위당한 어떤 도시도 수많고 다양한 공성 기구에 맞서 이처럼 버틴 적은 없었습니다. 그러나 그 지극히 거룩한 사람은, 자신의 거룩한 영혼이 고문과 고문 기구들로 불태워지고 있을 때에도, 경건을 수호하는 이성으로[b] 자신을 포위하던 자들을 뒤흔들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘고문 기구들’은 στρέβλαις를 옮긴 것입니다. 이 말은 비틀거나 늘이는 고문 또는 그 기구들을 가리키지만, 정확히 어떤 장치인지는 확정하기 어렵습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘경건을 수호하는 이성적 판단으로’. λογισμός는 여기서 단순한 이유가 아니라 이성적 원리 또는 판단력을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πόλις πολλοῖς καὶ ποικίλοις μηχανήμασιν ἀντέσχεν
  english_pob_choice: No city under siege ever held out against many and varied siege engines
  chosen_korean: 어떤 도시도 포위당한 채 많은 종류의 공성 기구를 맞고 버틴 적이 없었습니다
  alternatives_korean:
  - 어떤 도시도 포위당해 여러 가지 공성 장치에 견딘 적이 없었습니다
  - 어떤 도시도 포위 속에서 많은 다양한 기계에 버틴 적이 없었습니다
  lexicon: LSJ
  rationale: πολιόρκουμένη와 μηχανήμασιν의 군사적 문맥을 살려 μηχανήματα를 일반적 ‘기구’보다 구체적인 ‘공성 기구’로 옮겼습니다.
- source_word: πανάγιος
  english_pob_choice: most holy
  chosen_korean: 가장 거룩한
  alternatives_korean:
  - 지극히 거룩한
  - 대단히 거룩한
  lexicon: LSJ
  rationale: 최상급의 찬탄을 자연스러운 현대 한국어로 옮기되, 과장보다 성결의 강도를 드러내는 ‘가장 거룩한’을 택했습니다.
- source_word: ἱερὰν ψυχὴν
  english_pob_choice: his sacred soul
  chosen_korean: 그의 거룩한 영혼
  alternatives_korean:
  - 그의 성스러운 영혼
  - 그의 거룩한 생명
  lexicon: LSJ
  rationale: ψυχή를 여기서는 단순한 ‘생명’보다 인격적·도덕적 중심을 가리키는 ‘영혼’으로 살리고, ἱεράν의 신성한 울림은 ‘거룩한’으로 반영했습니다.
- source_word: αἰκισμοῖς τε καὶ στρέβλαις πυρπολούμενος
  english_pob_choice: while his sacred soul was being burned by tortures and the wheel
  chosen_korean: 고문과 수레에 불타는 가운데서도
  alternatives_korean:
  - 고문과 형틀에 불타는 가운데서도
  - 고문과 고문 수레에 불타는 가운데서도
  lexicon: LSJ
  rationale: στρέβλαις는 정확한 기구 명칭이 불분명하므로, POB의 판단을 따라 고문의 구체적 도구를 특정하지 않고 한국어에서 자연스러운 ‘수레’로 옮겼습니다.
- source_word: λογισμόν
  english_pob_choice: reason
  chosen_korean: 이성
  alternatives_korean:
  - 이성적 판단
  - 이유
  - 이성의 힘
  lexicon: LSJ
  rationale: 4 마카베오서의 핵심어인 λογισμός를 철학적 색채를 유지한 채 ‘이성’으로 옮겨, 감정이나 충동이 아닌 합리적 원리를 강조했습니다.
- source_word: ὑπερασπίζοντα τῆς εὐσεβείας
  english_pob_choice: that defends godliness
  chosen_korean: 경건을 변호하는
  alternatives_korean:
  - 경건을 옹호하는
  - 경건을 수호하는
  - 경건을 지키는
  lexicon: LSJ
  rationale: ὑπερασπίζω의 적극적 ‘옹호/변호’ 의미를 살려, εὐσέβεια는 이 책의 문맥에 맞게 ‘경건’으로 옮겼습니다.
theological_decisions:
- issue: εὐσέβεια의 번역
  chosen_reading: 경건
  alternative_readings:
  - 하나님을 향한 경외
  - 신실한 경외
  rationale: 4 마카베오서에서 εὐσέβεια는 하나님께 대한 경외와 충성의 삶을 가리키므로, 한국어 성서어휘로는 ‘경건’이 가장 직접적입니다.
  doctrine_reference: Translation philosophy §6
- issue: 수사적 대조 구조
  chosen_reading: 도시의 포위와 순교자의 견딤을 대비하는 문장 구조를 유지
  alternative_readings:
  - 문장을 평이하게 재구성해 대조를 완화
  - 두 절을 독립 문장으로 분리
  rationale: 원문의 핵심은 포위당한 도시보다 순교자의 인내가 더 강력했다는 역설적 대조이므로, 그 긴장감을 한국어에서도 유지했습니다.
  doctrine_reference: North-star principle
