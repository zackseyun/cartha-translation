  to: 포위당한 어떤 도시도 수많고 다양한 공성 기구에 맞서 이처럼 버틴 적은 없었습니다. 그러나 그 지극히 거룩한 사람은, 자신의 거룩한 영혼이 고문과 고문 기구들로 불태워지고 있을 때에도, 경건을 수호하는 이성으로[b] 자신을 포위하던 자들을 뒤흔들었습니다.[a]
