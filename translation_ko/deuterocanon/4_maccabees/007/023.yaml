  - 지배자
  rationale: 여기서 κύριος는 신적 호칭이 아니라 정욕에 대한 지배권을 뜻하므로, '주인'이 가장 직접적으로 그 통치/소유의 뉘앙스를 전달합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος'
