  rationale: 그리스어는 남성 단수 형식을 쓰지만, 이 격언은 일반적 윤리 진술이므로 한국어에서는 자연스러운 포괄적 표현인 '사람'으로 옮겼습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: κύριος의 비신적 용법
  chosen_reading: 주인
  alternative_readings:
