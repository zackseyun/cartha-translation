  text: Go on, then, tyrant; and if you kill our lives because of godliness, do not suppose that by torturing us you are harming us.
translation:
  language: ko
  text: 그러므로 너희를 시험해 보아라, 폭군이여. 그리고 경건함 때문에 우리의 생명을 죽이더라도, 고문함으로써 우리를 해치고 있다고 생각하지 마십시오.
  philosophy: formal
lexical_decisions:
- source_word: πεῖραζε
  english_pob_choice: Go on
  chosen_korean: 그러므로 너희를 시험해 보아라
  alternatives_korean:
  - 계속해 보아라
  - 시험해 보아라
  lexicon: πειράζω
  rationale: 명령형으로 상대의 행위를 도발적으로 받아치되, 단순한 ‘계속하라’보다 시험/시도 뉘앙스를 살렸습니다.
- source_word: τύραννε
  english_pob_choice: tyrant
  chosen_korean: 폭군이여
  alternatives_korean:
  - 폭군
  - 전제군주여
  lexicon: τύραννος
  rationale: 직접 호칭을 살려 수사적 대립을 유지했고, 한국어에서 가장 자연스러운 대응어인 ‘폭군’으로 옮겼습니다.
- source_word: τὰς ἡμῶν ψυχὰς
  english_pob_choice: our lives
  chosen_korean: 우리의 생명
  alternatives_korean:
  - 우리의 목숨
  - 우리의 영혼
  lexicon: ψυχή
  rationale: 본문의 source와 최신 영어 POB가 ‘lives’로 되돌린 점을 반영해, 여기서는 ‘생명’으로 번역해 육체적 생명 상실을 분명히 했습니다.
- source_word: διὰ τὴν εὐσέβειαν
  english_pob_choice: because of godliness
  chosen_korean: 경건함 때문에
  alternatives_korean:
  - 경건 때문에
  - 하나님을 경외함 때문에
  lexicon: εὐσέβεια
  rationale: 4마카베오의 핵심 덕목인 εὐσέβεια를 한국어 복음주의 문맥에서 자연스러운 ‘경건함’으로 옮겼습니다.
- source_word: βασανίζων
  english_pob_choice: torturing
  chosen_korean: 고문함으로써
  alternatives_korean:
  - 고문하면서
  - 심문함으로써
  lexicon: βασανίζω
  rationale: 단순한 괴롭힘보다 실제 형벌성 고문을 드러내는 말이 원문의 강도를 더 정확히 반영합니다.
theological_decisions:
- issue: ψυχή를 ‘영혼’이 아니라 ‘생명’으로 옮길지 여부
  chosen_reading: 여기서는 인격의 비물질적 부분보다 죽임당할 수 있는 삶 전체를 가리키므로 ‘생명’으로 번역했습니다.
  alternative_readings:
  - 영혼
  - 목숨
  rationale: 본문이 ‘경건함 때문에 죽인다’는 맥락과 결합되어 있어, 영어 POB의 수정본처럼 생명 상실을 지시하는 의미를 살리는 편이 source에 더 충실합니다.
  doctrine_reference: 4 Maccabees 9:7; English POB applied revision note
