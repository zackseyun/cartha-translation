  source_fidelity: ‘보고 놀랐을 때’는 용기를 보고 놀랐다는 인과관계를 덧붙이며, θαυμασάντων의 ‘감탄하다/경탄하다’보다 다소 약하고 달라집니다. 또한 ‘그의 손에 … 씌운’은 철제 장치를 그의 손에 씌웠다는 해석을 고정합니다. 그리스어는 날카로운 손톱(발톱)이 달린 ‘철제 손’이라는 도구를 장착한 것으로 표현하므로, 대상 위치를 단정하지 않는 표현이 더 안전합니다.
  naturalness: 합쇼체 서술은 대체로 자연스럽지만, ‘나이로 첫째 다음인 둘째’는 현대 한국어에서 다소 어색합니다. ‘첫째 다음으로 나이가 많은 둘째’가 연령 순서라는 뜻을 더 명료하게 전달합니다. ‘철제 손’은 의도적으로 낯선 도구 명칭이지만, 각주를 통해 보완할 수 있습니다.
  terminology: καρτεροψυχίαν은 ‘굳센 용기’로, δορυφόροι는 문맥상 ‘경비병들’로 옮길 수 있습니다. ὀργάνοις는 일반적인 ‘기구들’로 두고, καταπέλτῃ는 문자적 의미를 보존하여 ‘카타펄트’로 유지하되 기계식 고문 장치일 가능성을 각주에 밝혀야 합니다.
