  yaml_path: translation/deuterocanon/4_maccabees/009/021.yaml
  text: And though the framework of his bones was already burned all around[a], the noble-minded and Abraham-like young man did not groan.
  footnotes:
  - marker: a
    text: Or 'the structure of his bones was already melted all around.' The Greek uses a vivid image of the bones' frame being affected on every side by the fire.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그의 뼈의 틀이 이미 사방에서 불에 타 있었는데도, 고귀한 마음을 지니고 아브라함을 닮은 그 젊은이는 신음하지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 뼈의 틀이 이미 사방에서 녹아 있었다.’ 그리스어는 불로 인해 뼈의 틀이 사방에서 열 손상을 입은 생생한 이미지를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτετηγμένον
  english_pob_choice: burned all around
  chosen_korean: 사방에서 불에 타고 있었는데도
  alternatives_korean:
  - 사방에서 녹아 있었는데도
  - 사방에서 불타 있었는데도
  - 둘레가 불에 둘러싸여 있었는데도
  lexicon: LSJ
  rationale: 불의 고문으로 뼈의 틀이 둘러싸여 영향을 받는 생생한 이미지를 살리면서, 한국어에서는 '사방에서 불에 타고 있었다'가 가장 자연스럽고 감각적입니다.
- source_word: τὸ τῶν ὀστέων πῆγμα
  english_pob_choice: framework
  chosen_korean: 뼈의 틀
  alternatives_korean:
  - 뼈의 구조
  - 뼈의 형체
  - 뼈의 틀 구조
  lexicon: LSJ
  rationale: 직역하면 다소 딱딱한 표현이므로, 뼈로 이루어진 몸의 지지 구조라는 이미지를 살려 '뼈의 틀'로 옮겼습니다.
- source_word: μεγαλόφρων
  english_pob_choice: noble-minded
  chosen_korean: 고귀한 마음을 지닌
  alternatives_korean:
  - 고상한 마음을 지닌
  - 대담한 마음을 지닌
  - 고결한 마음을 지닌
  lexicon: LSJ
  rationale: 단순한 감정이 아니라 인격적 품위와 용기를 함께 드러내므로, 형용사성을 살려 '고귀한 마음을 지닌'으로 번역했습니다.
- source_word: Ἀβραμιαῖος
  english_pob_choice: Abraham-like
  chosen_korean: 아브라함 같은
  alternatives_korean:
  - 아브라함적인
  - 아브라함을 닮은
  - 아브라함과 같은
  lexicon: LSJ
  rationale: 혈통 표지보다 아브라함을 닮은 믿음과 태도를 가리키는 비교적 의미를 살려, 자연스러운 비교 표현으로 옮겼습니다.
- source_word: οὐκ ἐστέναξεν
  english_pob_choice: did not groan
  chosen_korean: 신음하지 않았습니다
  alternatives_korean:
  - 탄식하지 않았습니다
  - 신음 소리를 내지 않았습니다
  - 한숨지지 않았습니다
  lexicon: LSJ
  rationale: 고통 중의 들리는 반응을 가리키므로 '신음하다'가 가장 직접적이며, 부정형으로 그의 인내를 분명히 드러냅니다.
theological_decisions:
- issue: Ἀβραμιαῖος의 의미를 혈통이 아니라 모범적 비교로 볼지 여부
  chosen_reading: 아브라함 같은 — 아브라함의 믿음과 결단을 닮은 인물이라는 비교적 의미를 드러내는 표현
  alternative_readings:
  - 아브라함의 후손인
  - 아브라함적인
  - 아브라함에게 속한
  rationale: 문맥은 순교자의 인내를 칭찬하는 흐름이며, 단순한 민족적 소속보다 아브라함의 신실함을 본받은 성격을 강조합니다.
  doctrine_reference: '번역 원칙: 문맥이 지시하는 의미 우선, 수사적 칭찬의 비교 의미 보존'
