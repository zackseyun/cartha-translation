theological_decisions:
- issue: πρόνοια의 신학적 성격
  chosen_reading: ‘섭리’는 추상적 운명이 아니라, 공동체를 향한 하나님의 돌보심을 암시하는 신학적 표현으로 처리했습니다.
  alternative_readings:
  - 철학적 의미의 단순한 ‘예지/선견’
  - 더 직접적인 ‘하나님의 섭리’
  rationale: 원문은 θεός를 직접 부르지 않지만, 4 Maccabees의 고양된 문맥에서는 πρόνοια가 신학적으로 기능하므로, 본문을 과도하게 명시화하지 않으면서도 신적 돌보심의 울림을 보존했습니다.
  doctrine_reference: 원문 우선, 신학적 긴장은 해소하지 않고 유지
- issue: τιμωρήσειεν의 청원적 뉘앙스
  chosen_reading: 한국어 종결을 청원형 ‘-시기를 바랍니다’로 처리해, optative가 지닌 소망/기원 감각을 반영했습니다.
  alternative_readings:
  - ‘벌하실 것입니다’
  - ‘벌하셔야 합니다’
  rationale: 원문의 optative는 단정이 아니라 바람·기원을 나타내므로, 선언문보다 기도문적 한국어가 더 적합합니다.
  doctrine_reference: 청원체의 수사적 기능 보존
