  text: through which our righteous and ancestral providence[a], having become gracious to the nation[b], might punish the accursed tyrant.
  footnotes:
  - marker: a
    text: Or 'propitious' or 'gracious' for 'merciful'; the Greek term carries the sense of being favorably disposed.
    reason: lexical_alternative
  - marker: b
    text: Or 'the avenging tyrant' if ἀλάστωρ is taken in its stronger sense of a doom-bringing or vengeance-associated figure.
    reason: lexical_alternative
translation:
  language: ko
  text: 이를 통하여 우리의 의롭고 조상 전래의 섭리가 민족에게[b] 호의를 베풀어[a] 저주받은 폭군을 벌하시기를 바랍니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자비를 베풀어’, ‘은혜를 베풀어’로도 옮길 수 있습니다. ἵλεως는 상대에게 호의적이고 우호적인 상태를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘민족을 향하여’로도 옮길 수 있습니다. ἔθνει는 여기서 호의가 향하는 대상을 나타내는 여격으로 이해할 수 있습니다.
    reason: lexical_alternative
