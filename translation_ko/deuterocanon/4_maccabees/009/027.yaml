  yaml_path: translation/deuterocanon/4_maccabees/009/027.yaml
  text: And when they asked whether he wished to eat before being tortured[a], they heard his noble resolve,
  footnotes:
  - marker: a
    text: Or 'his noble purpose' or 'his noble mind'; the Greek γνώμη can denote intention, resolve, or way of thinking.
