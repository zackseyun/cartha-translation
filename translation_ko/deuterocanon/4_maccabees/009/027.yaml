translation:
  language: ko
  text: 그리고 그들이 그가 고문을 당하기 전에 먹기를 원하느냐고 물었을 때, 그의 고귀한 결심을 들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 고귀한 목적”이나 “그의 고귀한 마음”. 헬라어 γνώμη는 의도, 결심, 생각의 방식까지 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δʼ εἰ
  english_pob_choice: And when
  chosen_korean: 그리고 … 때
  alternatives_korean:
  - 그리고 … 하자
  - 그리고 … 하였을 때
  lexicon: LSJ
  rationale: 서술 흐름을 자연스럽게 잇는 시간적 전환으로 처리했습니다. 문맥상 가정법보다 사건의 다음 국면을 여는 용법이므로 합쇼체 문장에서는 "그리고 … 때"가 가장 무난합니다.
- source_word: φαγεῖν
  english_pob_choice: to eat
  chosen_korean: 먹을 것을
  alternatives_korean:
  - 음식을
  - 먹기를
  lexicon: LSJ
  rationale: 동사의 목적을 한국어에서 자연스럽게 풀어 "먹을 것"으로 옮겼습니다. 의미를 넓히지 않으면서도 공문체 문장에 잘 맞습니다.
- source_word: πρὶν βασανίζεσθαι
  english_pob_choice: before being tortured
  chosen_korean: 고문을 당하기 전에
  alternatives_korean:
  - 고문당하기 전에
  - 문초를 당하기 전에
  lexicon: LSJ
  rationale: 4마카베오스의 순교 서술에서 βασανίζεσθαι는 실제 고문을 가리키므로, 약화된 "괴롭힘"보다 "고문을 당하다"가 원문의 긴박함을 더 잘 드러냅니다.
- source_word: τὴν εὐγενῆ γνώμην
  english_pob_choice: his noble resolve
  chosen_korean: 그의 고귀한 결심
  alternatives_korean:
  - 그의 고귀한 마음
  - 그의 고상한 생각
  - 그의 귀한 의지
  lexicon: LSJ
  rationale: γνώμη는 단순한 의견이 아니라 확고한 내적 판단과 의지를 포함하므로 "결심"이 적합합니다. εὐγενῆ는 신분보다 품격을 가리키는 뉘앙스이므로 "고귀한"으로 옮겼습니다.
- source_word: ἤκουσαν
  english_pob_choice: they heard
  chosen_korean: 들었습니다
  alternatives_korean:
  - 들었고
  - 들었습니다만
  lexicon: LSJ
  rationale: 단순한 aorist를 직접적으로 옮겼습니다. 주어가 앞선 문맥의 심문자들이므로 한국어에서는 생략된 주어를 자연스럽게 처리했습니다.
theological_decisions:
- issue: γνώμη의 번역에서 윤리적·의지적 무게를 보존할지 여부
  chosen_reading: 결심
  alternative_readings:
  - 마음
  - 생각
  - 의견
  rationale: 이 대목은 고문 직전의 순교적 태도를 보여 주므로, 단순한 인지 상태보다 확고한 의지와 선택을 드러내는 표현이 필요합니다. "결심"은 그 윤리적 긴장을 가장 분명하게 전달합니다.
  doctrine_reference: Translation philosophy §1, §6
