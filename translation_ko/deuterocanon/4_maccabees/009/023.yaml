  - severity: medium
    issue: λειποτακτήσητε의 군사적 의미가 약화됨
    rationale: ‘싸움을 포기하며 달아나다’는 설명적이지만, 군사적으로 ‘탈주하다/대열을 이탈하다’라는 동사의 힘을 충분히 드러내지 못합니다.
  - severity: medium
    issue: ἀδελφότητα를 ‘형제애’로 번역
    rationale: 여기서는 사랑의 감정보다는 용기를 공유하는 형제들의 결속 또는 공동체를 뜻하므로 ‘형제 공동체’가 더 가깝습니다.
