base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/023.yaml
  text: Imitate me[a], brothers, he said, on the rack; do not desert by abandoning the struggle when I have not left it, nor through me renounce the brotherhood of courage. Wage the holy and noble campaign for godliness[c][b],
  footnotes:
  - marker: a
    text: Or 'under torture.' The Greek expression evokes the torture-rack specifically, so the main text keeps the concrete image.
    reason: lexical_alternative
  - marker: b
    text: Or 'do not become deserters' / 'do not abandon the ranks.' The verb is military in tone.
    reason: lexical_alternative
  - marker: c
    text: Or 'piety.' The Greek εὐσέβεια is a key virtue in 4 Maccabees, denoting faithful devotion to God.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 고문대 위에서도 말했습니다. 「나를 본받으십시오, 형제들이여. 내가 아직 싸움을 버리지 않았으니, 싸움을 포기하며 달아나지 말고, 나를 통해 이 용기의 형제애를 저버리지도 마십시오. 거룩하고 고귀한 전쟁을 경건함을 위해 치르십시오.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘고문대 위에서도’는 그리스어 στρεβλὰς가 암시하는 구체적 고문 도구의 이미지를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘전쟁을 치르십시오’는 στρατείαν στρατεύσασθε의 군사적 반복을 살리려는 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘경건함’은 εὐσέβεια의 단순한 종교심보다 하나님께 대한 충성된 경외를 포괄합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: στρεβλὰς
  english_pob_choice: on the rack
  chosen_korean: 고문대 위에서도
  alternatives_korean:
  - 고문대에서
  - 고문 속에서도
  - 형틀 위에서도
  lexicon: LSJ
  rationale: στρεβλὰς가 가리키는 구체적 고문 도구의 이미지를 살리기 위해, 단순한 ‘고문 중에’보다 ‘고문대 위에서도’로 옮겼습니다.
- source_word: Μιμήσασθέ
  english_pob_choice: Imitate
  chosen_korean: 나를 본받으십시오
  alternatives_korean:
  - 나를 흉내 내십시오
  - 나를 따라 하십시오
  lexicon: LSJ
  rationale: μιμέομαι의 권면적 뉘앙스를 살리면서 한국어에서 자연스럽고 품위 있게 들리는 ‘본받다’를 택했습니다.
- source_word: λ εἰποτακτήσητε
  english_pob_choice: desert / abandon the struggle
  chosen_korean: 싸움을 포기하며 달아나지 말고
  alternatives_korean:
  - 도망쳐 버리지 말고
  - 탈주하지 말고
  - 배반하지 말고
  lexicon: LSJ
  rationale: 군사적 ‘탈주/이탈’의 힘을 유지하되, 문맥의 ἀγών(싸움/투쟁)과 연결되도록 ‘싸움을 포기하며 달아나다’로 풀었습니다.
- source_word: τὴν τῆς εὐψυχίας ἀδελφότητα
  english_pob_choice: the brotherhood of courage
  chosen_korean: 이 용기의 형제애
  alternatives_korean:
  - 담대한 형제애
  - 용맹의 형제됨
  - 굳센 마음의 형제애
  lexicon: LSJ
  rationale: εὐψυχία의 핵심을 ‘용기’로 간명하게 살리고, ἀδελφότητα의 공동 유대를 ‘형제애’로 옮겼습니다.
- source_word: ἱερὰν καὶ εὐγενῆ στρατείαν στρατεύσασθε
  english_pob_choice: Wage the holy and noble campaign
  chosen_korean: 거룩하고 고귀한 전쟁을 ... 치르십시오
  alternatives_korean:
  - 거룩하고 고귀한 전쟁을 수행하십시오
  - 거룩하고 고귀한 싸움을 싸우십시오
  - 거룩하고 고귀한 원정을 하십시오
  lexicon: LSJ
  rationale: cognate 어구의 군사적 긴장을 살리기 위해 ‘전쟁을 치르다’로 옮겼고, εὐγενῆ는 ‘고귀한’으로, ἱεράν은 ‘거룩한’으로 옮겼습니다.
- source_word: περὶ τῆς εὐσεβείας
  english_pob_choice: for godliness
  chosen_korean: 경건함을 위해
  alternatives_korean:
  - 경건을 위하여
  - 하나님을 향한 경외를 위해
  - 신실한 경외를 위해
  lexicon: LSJ
  rationale: εὐσέβεια를 한국어 교회어법의 ‘경건’으로 옮기되, 목적 관계를 분명히 하기 위해 ‘~을 위해’로 처리했습니다.
theological_decisions:
- issue: 정경적·교리적 연관어 εὐσέβεια의 번역
  chosen_reading: 경건함
  alternative_readings:
  - 경건
  - 하나님께 대한 경외
  rationale: 4 마카베오서에서 εὐσέβεια는 단순한 내적 종교심이 아니라 박해 속에서도 하나님께 충실한 태도를 뜻하므로, 독자가 의미를 직관적으로 파악할 수 있는 ‘경건함’을 택했습니다.
  doctrine_reference: Translation philosophy §6; key-term consistency §5
- issue: 직접 인용문 안의 호칭과 명령형의 문체
  chosen_reading: 형제들이여 / 마십시오 / 치르십시오
  alternative_readings:
  - 형제들아 / 하지 마시오 / 싸우시오
  rationale: 원문의 공개적 권면과 호소를 표준어 합쇼체로 옮기되, 인용문 내부는 직접 경고와 권면의 긴장을 유지하도록 명령형을 사용했습니다.
  doctrine_reference: Style policy; quoted-speech register
