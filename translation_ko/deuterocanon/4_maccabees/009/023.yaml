  source_fidelity: 개정이 필요합니다. λέγων은 서술 속의 ‘그가 말하며/말했습니다’이지 1인칭 ‘나는 말했습니다’가 아니며, μὴ λειπὼν τὸν ἀγῶνα는 화자가 자신이 싸움을 떠나지 않았음을 내세우는 표현으로 옮기는 것이 안전합니다. λειποτακτήσητε의 군사적 ‘탈주하다’와 στρατείαν στρατεύσασθε의 군사적 어조도 유지해야 합니다.
  naturalness: 현행 ‘나는 고문대 위에서도 말했습니다’는 인용문의 ‘나를’과 결합되어 화자 전환이 부자연스럽습니다. 또한 ‘싸움을 포기하며 달아나다’는 원문의 군사적 동사와 앞의 ἀγών을 중복해 다소 풀어쓴 표현입니다. ‘그는 고문대 위에서 이렇게 말했습니다’ 및 ‘탈주하지 마십시오’가 현대 표준어 합쇼체에서 더 자연스럽습니다.
  terminology: ‘경건함’은 가능하나, 명사형 ‘경건을 위하여’가 문체상 더 간결합니다. ἀδελφότης는 단순한 애정인 ‘형제애’보다 공동 유대를 가리키므로 ‘용기의 형제 공동체’로 옮겨 의미를 보존했습니다. ‘거룩하고 고귀한 전쟁’은 στρατεία의 군사 비유를 충실히 반영합니다.
  issues:
