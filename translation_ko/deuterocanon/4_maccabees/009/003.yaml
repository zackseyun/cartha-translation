    text: 헬라어는 매우 압축되어 있어, 직역하면 ‘법lessness의 조언자, 폭군’ 또는 ‘조언자, 법lessness의 폭군’처럼도 읽힐 수 있습니다. 본문은 두 호격을 병렬로 살려 옮겼습니다.
