  text: Counselor of lawlessness[a], tyrant, do not hate us; rather, have mercy on us more than on them.
  footnotes:
  - marker: a
    text: 'Greek text is somewhat compressed: literally, ''Counselor, tyrant of lawlessness, not hating us beyond them, have mercy on us.'' The phrase translated ''more than on them'' could also be understood as ''because of them.'''
    reason: alternative_reading
translation:
  language: ko
  text: 불법의 조언자[a]여, 폭군이여, 우리를 미워하지 마시고, 그들에게보다 우리에게 더 자비를 베푸십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 문장은 매우 압축되어 있습니다. 첫 두 호격은 ‘불법의 조언자’와 ‘폭군’으로 병렬로 옮겼습니다. 또한 ‘그들에게보다 우리에게 더’로 옮긴 말은 ‘그들보다’를 뜻하는 비교 표현으로 이해할 수 있으나, 문맥에 따라 ‘그들 때문에’로 이해될 가능성도 있습니다.
    reason: alternative_reading
