  rationale: 동사 ἐγίνετο의 미완료상은 진행 중인 고통을 드러내므로, 순간적 결과보다 지속되는 육체적 파괴를 살리는 쪽이 원문에 충실합니다.
  doctrine_reference: 순교 서술의 수사적 강조
- issue: εὐγενής의 의미 범위
  chosen_reading: ‘고귀한’으로 옮겨 신분과 품위를 함께 반영했습니다.
  alternative_readings:
  - ‘귀족의’로 신분을 좁힐 수 있습니다.
  - ‘고상한’으로 성품만 강조할 수 있습니다.
  rationale: 4 Maccabees에서 εὐγενής는 출신과 도덕적 고결성을 함께 울리므로, 한쪽으로만 좁히지 않는 번역이 적절합니다.
  doctrine_reference: 문맥적 어휘 범위
