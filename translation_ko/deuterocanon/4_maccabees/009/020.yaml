  yaml_path: translation/deuterocanon/4_maccabees/009/020.yaml
  text: And the wheel was defiled all around with blood[a], and the heap of coals was being quenched by the drops of bodily fluids[c][b], and the flesh was flowing around the axles of the machine.
  footnotes:
  - marker: a
    text: Or 'was stained all around with blood.' The Greek verb can denote staining, but here likely carries the stronger sense of defilement or contamination.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the drops of the ichors.' The Greek term refers to fluid flowing from wounds; 'bodily fluids' is used for clarity in modern English.
    reason: lexical_alternative
  - marker: c
    text: Or 'of the instrument/apparatus.' The Greek word denotes the torture device as an implement.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 수레는 사방이 피로 더럽혀졌고, 숯불 더미는 체액의 방울들로 꺼져 갔으며, 살점은 기계의 축 주위를 흘러다녔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘피에 얼룩졌고.’ 그리스어 동사는 색이 배는 뜻도 있지만, 여기서는 오염과 더러움의 의미가 더 강합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘이코르의 방울들로’입니다. 이 그리스어는 상처에서 흘러나오는 액체를 가리키므로, 현대 한국어에서는 ‘체액’으로 풀었습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘기구의.’ 그리스어 ὄργανον은 고문 장치라는 뜻의 도구를 가리킬 수 있습니다.
    reason: lexical_alternative
