  text: 아, 우리 조상에게서 물려받은 경건[a] 때문에 어떤 죽음의 방식이든 얼마나 달콤합니까! 그리고 그는 폭군에게 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
