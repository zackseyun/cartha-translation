    text: 또는 ‘우리 조상들의 경건.’ 그리스어는 조상에게서 전해진 경외의 헌신을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς ἡδὺς
  english_pob_choice: How sweet
  chosen_korean: 얼마나 달콤합니까
  alternatives_korean:
  - 얼마나 기쁩니까
  - 참으로 달콤합니다
  lexicon: LSJ
  rationale: 감탄문의 강한 정서를 살리면서 ἡδὺς의 직역적 의미인 ‘달콤하다’를 유지했습니다.
- source_word: πᾶς τρόπος θανάτου
  english_pob_choice: every kind of death
  chosen_korean: 죽음의 모든 방식
  alternatives_korean:
  - 모든 종류의 죽음
  - 어떠한 방식의 죽음이든
  lexicon: LSJ
  rationale: 분배적 의미를 살려 죽음이 닥치는 형태 전반을 넓게 포괄하는 표현으로 옮겼습니다.
- source_word: διὰ τὴν πάτριον ἡμῶν εὐσέβειαν
  english_pob_choice: for our ancestral godliness
  chosen_korean: 우리 조상들의 경건함 때문에
  alternatives_korean:
  - 우리 조상들의 신앙 때문에
  - 우리 조상들의 경건 때문에
  lexicon: BDAG
  rationale: διὰ+대격의 원인 의미를 살려 ‘때문에’로 옮기고, εὐσέβεια는 문맥상 ‘경건함’으로 두어 조상에게서 물려받은 신앙적 충성을 드러냈습니다.
- source_word: πρὸς τὸν τύραννον
  english_pob_choice: to the tyrant
  chosen_korean: 폭군에게
  alternatives_korean:
  - 압제자에게
  - 독재자에게
  lexicon: LSJ
  rationale: τύραννος가 단순한 왕호가 아니라 박해하는 통치자에 대한 평가적 호칭이므로, 그 힘을 살려 ‘폭군’으로 번역했습니다.
theological_decisions:
- issue: εὐσέβεια의 한국어 신학 어휘
  chosen_reading: 경건함
  alternative_readings:
  - 신앙
  - 경건
  - 공경
  rationale: 이 절에서 εὐσέβεια는 조상에게서 물려받은 하나님을 향한 충성된 경외를 뜻하므로, 전통적 교회어를 과도하게 좁히지 않으면서도 의미를 보존하는 ‘경건함’이 적절합니다.
