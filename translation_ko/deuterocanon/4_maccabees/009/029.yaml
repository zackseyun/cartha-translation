translation:
  language: ko
  text: 아, 우리 조상들의 경건함 때문에 죽음의 모든 방식이 얼마나 달콤합니까! 그리고 그는 폭군에게 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
