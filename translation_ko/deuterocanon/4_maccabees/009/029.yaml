  - 독재자에게
  lexicon: LSJ
  rationale: τύραννος가 단순한 왕호가 아니라 박해하는 통치자에 대한 평가적 호칭이므로, 그 힘을 살려 ‘폭군’으로 번역했습니다.
theological_decisions:
