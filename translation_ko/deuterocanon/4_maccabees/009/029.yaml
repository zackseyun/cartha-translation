  lexicon: BDAG
  rationale: διὰ+대격의 원인 의미를 살려 ‘때문에’로 옮기고, εὐσέβεια는 문맥상 ‘경건함’으로 두어 조상에게서 물려받은 신앙적 충성을 드러냈습니다.
- source_word: πρὸς τὸν τύραννον
  english_pob_choice: to the tyrant
  chosen_korean: 폭군에게
