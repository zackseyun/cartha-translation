  text: But he said, “Your device is not so strong, you limbs of a demon, as to lead my reason away. Cut off my limbs, and burn my flesh, and wrench my joints.”
translation:
  language: ko
  text: 그러나 그가 말했습니다. 「너희의 방식은 내 이성을 빼앗아 갈 만큼 강하지 않다, 오, 마귀의 지체들아. 내 지체들을 자르고, 내 살을 불태우며, 내 관절을 비틀어라」
  philosophy: formal
lexical_decisions:
- source_word: ὁ τρόπος
  english_pob_choice: device
  chosen_korean: 방식
  alternatives_korean:
  - 수단
  - 방법
  - 장치
  lexicon: τρόπος
  rationale: 영문 POB의 device는 단순한 ‘방법’보다 작동 방식·수단의 뉘앙스를 담고 있어, 한국어로는 문맥상 가장 자연스럽고 중립적인 ‘방식’으로 옮겼습니다.
- source_word: μεροὶ δαῖμον
  english_pob_choice: you limbs of a demon
  chosen_korean: 마귀의 지체들아
  alternatives_korean:
  - 악마의 지체들아
  - 귀신의 지체들아
  - 마귀의 팔다리들아
  lexicon: μέλος, δαίμων
  rationale: 직역하면 ‘지체들’이지만, 한국어에서는 신체의 일부라는 뜻을 살리면서도 조롱의 호칭임을 드러내기 위해 ‘마귀의 지체들아’로 옮겼습니다.
- source_word: τὸν λογισμὸν
  english_pob_choice: my reason
  chosen_korean: 내 이성
  alternatives_korean:
  - 내 생각
  - 내 판단
  - 내 이성적 판단
  lexicon: λογισμός
  rationale: λογισμός는 단순한 생각보다 이성적 숙고와 판단을 가리키므로, POB의 ‘reason’을 따라 ‘이성’으로 옮겼습니다.
- source_word: μέλη / σάρκας / ἄρθρα
  english_pob_choice: my limbs / my flesh / my joints
  chosen_korean: 내 지체들 / 내 살 / 내 관절
  alternatives_korean:
  - 내 팔다리 / 내 육체 / 내 마디
  lexicon: μέλος, σάρξ, ἄρθρον
  rationale: 세 항목의 병렬을 살리되, μέλη는 신체 부위를 아우르는 ‘지체들’, σάρκες는 육체적 살점을 가리키는 ‘살’, ἄρθρα는 관절을 뜻하는 ‘관절’로 대응시켰습니다.
theological_decisions:
- issue: 가학적 협박을 담은 직접화법의 어조
  chosen_reading: 본문의 고문·협박 장면을 완화하지 않고, 명령형과 조롱적 호칭을 그대로 살렸습니다.
  alternative_readings:
  - 완곡하게 순화된 서술형
  - 폭력성을 낮춘 표현
  rationale: 원문은 순교자의 결연함과 가해자의 잔혹성을 강조하므로, 수사적 강도를 보존해야 서사의 의도가 유지됩니다.
  doctrine_reference: 순교 서사의 수사와 본문 충실성
