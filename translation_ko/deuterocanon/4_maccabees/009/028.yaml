base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/028.yaml
  text: Dragging him by the tendons with their iron hands[a], the leopard-like beasts stripped away all his flesh, even to his beard, and the skin of his head; but as he endured this grievous pain steadfastly, he said[d][c][b],
  footnotes:
  - marker: a
    text: Or 'from the sinews.' The Greek term refers to tendons or sinews, emphasizing that the tearing began deep in the body's connective tissue.
    reason: lexical_alternative
  - marker: b
    text: Literally 'with iron hands.' The phrase may describe metal implements or intensify the image of the beasts' tearing power, but the Greek wording itself is retained in the translation.
    reason: lexical_alternative
  - marker: c
    text: Or 'the leopards' if the adjective is taken more concretely. The Greek more literally says 'the leopard-like beasts.'
    reason: lexical_alternative
  - marker: d
    text: Or 'the scalp.' The Greek says more literally 'the skin of his head.'
    reason: lexical_alternative
translation:
  language: ko
  text: 쇠로 된 손으로 힘줄에서부터 그를 끌어당기자, 표범 같은 짐승들이 그의 모든 살, 곧 수염까지, 그리고 머리의 가죽까지도 벗겨 냈습니다. 그러나 그가 이 참혹한 고통을 굳게 견디며 말했습니다,[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘힘줄에서부터’는 ἀπὸ τῶν τενόντων의 시작점을 살린 번역이며, ‘힘줄로부터/힘줄에서’ 모두 가능하지만 문맥상 이곳에서 찢기기 시작함을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘쇠로 된 손’은 직역에 가깝고, 금속 도구나 괴력의 이미지를 함께 불러일으킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘표범 같은 짐승들’은 원문의 형용사형 παρδάλιοι를 살린 표현이며, 단순히 ‘표범들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘머리의 가죽’은 더 문자적이며, ‘두피’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τῶν τενόντων
  english_pob_choice: Dragging him by the tendons
  chosen_korean: 힘줄에서부터 그를 끌어당기자
  alternatives_korean:
  - 힘줄에서 그를 끌어당기자
  - 힘줄로부터 그를 끌어당기자
  lexicon: LSJ
  rationale: ἀπό는 시작점/출발점을 나타내고 τένων은 힘줄이므로, ‘힘줄에서부터’로 시작 지점을 살리면서 한국어 문장 흐름을 자연스럽게 잡았습니다.
- source_word: ταῖς σιδηραῖς χερσὶν
  english_pob_choice: with their iron hands
  chosen_korean: 쇠로 된 손으로
  alternatives_korean:
  - 철의 손으로
  - 쇠손으로
  lexicon: LSJ
  rationale: χείρ는 문자적으로 ‘손’이므로 이미지를 유지했고, ‘쇠로 된’은 metal imagery를 자연스럽게 옮긴 표현입니다.
- source_word: οἱ παρδάλιοι θῆρες
  english_pob_choice: the leopard-like beasts
  chosen_korean: 표범 같은 짐승들
  alternatives_korean:
  - 표범 같은 맹수들
  - 표범들
  lexicon: LSJ
  rationale: παρδάλιος는 형용사적 표현이므로 ‘표범 같은’으로 살리고, θῆρες는 맹수/짐승이라는 뜻을 반영했습니다.
- source_word: τὴν τῆς κεφαλῆς δορὰν
  english_pob_choice: the skin of his head
  chosen_korean: 머리의 가죽
  alternatives_korean:
  - 두피
  - 머리의 피부
  lexicon: LSJ
  rationale: δορά는 본래 가죽/피부이므로 ‘두피’로 좁히지 않고, 원문에 더 가까운 ‘머리의 가죽’으로 옮겼습니다.
- source_word: βαρέως τὴν ἀλγηδόνα καρτερῶν
  english_pob_choice: as he endured this grievous pain steadfastly
  chosen_korean: 이 참혹한 고통을 굳게 견디며
  alternatives_korean:
  - 이 괴로운 고통을 끈기 있게 견디며
  - 이 무거운 고통을 인내하며
  lexicon: LSJ
  rationale: βαρέως는 고통의 무게와 참혹함을, καρτερῶν은 굳게/인내하며 견딤을 나타내므로 두 요소를 함께 살렸습니다.
theological_decisions:
- issue: 폭력 묘사의 직설성
