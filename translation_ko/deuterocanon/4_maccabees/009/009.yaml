  source_fidelity: 수정이 필요합니다. μιεροφονίαν은 ‘거룩한 살해’로 직역하면 한국어에서 살해 자체가 거룩하다는 뜻으로 읽히며, 문맥상 상대가 화자들을 살해한 죄라는 방향이 흐려집니다. ἡμῶν의 관계를 ‘우리에게 저지른’으로 자연스럽게 밝혔되, 어휘의 정확한 뉘앙스는 각주에서 보존했습니다. ὑπὸ τῆς θείας δίκης는 행위자적 용법이므로 ‘신적 정의에 의해’로 옮겼습니다. αὐτάρκη는 βάσανον에 걸리는 강조를 ‘온전히 견디게’로 반영했습니다.
  naturalness: 초안의 ‘우리에 대한 거룩한 살해’, ‘신적 정의 아래서’, ‘불로 된 영원한 고통’은 현대 한국어에서 부자연스럽거나 의미 관계가 불명확합니다. 수정문은 합쇼체를 유지하면서도 위협·응보라는 본문의 격식과 강도를 자연스럽게 전달합니다.
