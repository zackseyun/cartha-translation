    text: 또는 ‘우리의 신성 모독적인 살인’, ‘우리 곧 거룩한 이들을 살해한 일’.
    reason: μιεροφονίαν의 드문 합성어는 불경하고 오염된 살인, 또는 거룩한 이들의 살해를 가리킬 수 있습니다. 본문은 문맥상 피해자인 화자들을 향해 저질러진 살해로 옮기되, 어휘적 여지를 보존합니다.
  - marker: b
    text: 직역하면 ‘불을 통하여 [가해지는] 충분한 영원한 고통’. 또는 ‘불로 말미암는 영원한 형벌’.
    reason: αὐτάρκη는 고통을 충분하고 온전한 것으로 강조하며, διὰ πυρός는 불의 수단·매개를 나타낼 수 있습니다.
