theological_decisions:
- issue: μὴ ἀσεβήσαντα / ἀσεβήσαντα의 뉘앙스
  chosen_reading: ‘불경하게 행동했기 때문도 아니다’로 옮겨, 단순한 비윤리성이 아니라 하나님과 성스러운 것에 대한 불경의 의미를 살렸습니다.
  alternative_readings:
  - ‘경건하지 않았기 때문도 아니다’
  - ‘하나님을 모독했기 때문도 아니다’
  - ‘불신앙이었기 때문도 아니다’
  rationale: ἀσεβέω는 일반적 ‘나쁜 행동’보다 종교적 불경을 가리키므로, 이를 약화하지 않도록 했습니다.
  doctrine_reference: 4 Maccabees의 순교 신학과 경건/불경의 대조
- issue: 주체의 자기변호와 신성한 율법 수호의 강조
  chosen_reading: 마지막 절을 ‘내가 신성한 율법을 수호하고 있기 때문’으로 번역해, 순교자의 정당한 변호라는 논지를 직접 드러냈습니다.
  alternative_readings:
  - ‘내가 신성한 율법을 دفاع하고 있기 때문’
  - ‘내가 신성한 율법을 위해 싸우고 있기 때문’
  - ‘내가 신성한 율법을 옹호하고 있기 때문’
  rationale: προασπίζοντα는 ‘앞에 서서 지키다/방어하다’의 의미가 있어 단순 보호보다 적극적 방어의 뉘앙스를 살리는 것이 문맥상 적절합니다.
  doctrine_reference: 율법 충성/순교 변증의 문맥
