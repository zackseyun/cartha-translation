  text: Most defiled tyrant[a], enemy of heavenly justice, and savage-minded man, you are not torturing me in this way because I have committed murder, nor because I have acted impiously, but because I am defending the divine law.
  footnotes:
  - marker: a
    text: Or 'enemy of heavenly judgment.' The Greek term can refer either to justice in a broad sense or to judicial punishment.
    reason: lexical_alternative
translation:
  language: ko
  text: “가장 부정한 폭군이여, 하늘의 정의[a]의 원수이며 잔혹한 마음을 품은 자여, 당신이 나를 이처럼 고문하는 것은 내가 살인을 저지르거나 불경을 범했기 때문이 아니라, 내가 신성한 율법을 수호하기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘의 심판의 원수’로 옮길 수 있습니다. δίκη는 넓게는 정의를, 더 좁게는 심판이나 형벌을 뜻할 수 있습니다.
    reason: lexical_alternative
