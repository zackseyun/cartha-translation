  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 μιερώτατε의 종교적·도덕적 오염의 뜻에는 ‘가장 부정한’이 한국어에서 더 자연스럽고 정확합니다. 또한 οὐκ … οὐδὲ … ἀλλὰ의 대조는 ‘A나 B 때문이 아니라 C 때문’으로 정리하는 편이 원문 논리를 더 명료하게 보존합니다.
  naturalness: 현 초안의 ‘가장 더럽혀진’, ‘사나운 마음을 가진 자’, ‘하늘의 정의의 원수’는 다소 직역투입니다. 특히 종결형 ‘-이니라’와 2인칭 ‘네가’는 요청된 현대 격식체 합쇼체와 맞지 않습니다. ‘당신이 … 때문이 아니라 … 때문입니다’로 고칩니다.
