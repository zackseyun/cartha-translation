base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/019.yaml
  text: They are unconquerable on behalf of virtue[a]. While he was still saying these things, they spread fire beneath him, and, by intensifying the wheel[c][b], they tightened it further.
  footnotes:
  - marker: a
    text: Or 'for virtue.' The Greek phrase ὑπὲρ ἀρετῆς can denote acting or suffering for the sake of virtue.
    reason: lexical_alternative
  - marker: b
    text: That is, the wheel used for torture.
    reason: cultural_note
  - marker: c
    text: The final verb is difficult; it conveys increasing the strain or tightening the victim further on the wheel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 덕을 위하여는 정복될 수 없습니다[a]. 그는 이 말을 아직 하고 있는 동안에도 그들은 그 위에 불을 더 깔았고, 바퀴를 더 세차게 몰아 더욱 조이게 했습니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘덕을 위해’. 그리스어 ὑπὲρ ἀρετῆς는 ‘덕을 위하여/덕 때문에’의 뜻이 될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 고문에 사용된 바퀴입니다.
    reason: cultural_note
  - marker: c
    text: 마지막 동사는 의미가 다소 어렵습니다. 바퀴 위의 피해자에게 가해지는 긴장이나 압박을 더한다는 뜻으로 이해했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ ἀρετῆς
  english_pob_choice: for the sake of virtue
  chosen_korean: 덕을 위하여는
  alternatives_korean:
  - 덕을 위해서는
  - 덕을 위한
  - 덕 때문에
  lexicon: LSJ
  rationale: ὑπέρ + 속격은 ‘~을 위하여/위해서’의 뜻을 가질 수 있고, ἀρετή는 4마카베오에서 Hellenistic 윤리어휘인 ‘덕’으로 옮기는 것이 가장 자연스럽습니다.
- source_word: ἀνίκητοι
  english_pob_choice: unconquerable
  chosen_korean: 정복될 수 없습니다
  alternatives_korean:
  - 정복할 수 없습니다
  - 패배시킬 수 없습니다
  - 이길 수 없습니다
  lexicon: LSJ
  rationale: 형용사 ἀνίκητοι의 수동적 의미를 살려 ‘정복될 수 없습니다’로 옮기면 무적성의 의미를 유지하면서도 한국어에서 지나치게 영웅화된 뉘앙스를 피할 수 있습니다.
- source_word: πῦρ ἐπέστρωσαν
  english_pob_choice: they spread fire beneath him
  chosen_korean: 그 위에 불을 더 깔았고
  alternatives_korean:
  - 그 아래에 불을 깔았고
  - 불을 더 퍼뜨렸고
  - 불을 더 얹었고
  lexicon: LSJ
  rationale: ἐπιστρώννυμι는 ‘깔다, 펴다’의 뜻이므로 문맥상 고문 도구 아래에 불을 깔아 열을 더한 장면을 자연스럽게 드러내도록 했습니다.
- source_word: διερεθίζοντες τὸν τροχὸν προσεπικατέτεινον
  english_pob_choice: by intensifying the wheel ... they tightened it further
  chosen_korean: 바퀴를 더 세차게 몰아 더욱 조이게 했습니다
  alternatives_korean:
  - 바퀴를 더 격하게 움직여 더욱 조였습니다
  - 바퀴를 더 자극하여 더욱 조였습니다
  - 바퀴를 더 세차게 돌려 더욱 조였습니다
  lexicon: LSJ
  rationale: διερεθίζοντες는 ‘더 자극하다, 더 격하게 하다’의 뜻이지만, 여기서는 고문용 바퀴의 압박을 더하는 행동으로 이해되어 ‘더 세차게 몰아’와 ‘더욱 조이게 했습니다’로 압박과 긴장 증대를 함께 드러냈습니다.
theological_decisions:
- issue: 고문용 τροχός의 지시 대상
  chosen_reading: 바퀴
  alternative_readings:
  - 고문 바퀴
  - 형벌용 바퀴
  rationale: 원문은 단순히 ‘그 바퀴’라고 하므로 본문에는 문자적 표현을 유지하고, 한국어 문맥상 고문 도구임은 서술 전체로 충분히 드러나게 했습니다.
  doctrine_reference: 번역 원칙 §1, §6
- issue: ἀρετή의 철학적 의미 보존
  chosen_reading: 덕
  alternative_readings:
  - 미덕
  - 도덕적 탁월함
  - 탁월성
  rationale: 4마카베오는 헬라 윤리철학 어휘를 사용하므로, 교회식 추상어보다 ‘덕’이 원문의 사상 세계를 가장 직접적으로 보존합니다.
  doctrine_reference: 번역 원칙 §1, §5
