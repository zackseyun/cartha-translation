  terminology: ἀρετή는 철학적 어휘인 ‘덕’으로 유지하는 것이 적절합니다. τροχός는 본문에서 ‘바퀴’로 두고 고문 도구라는 설명을 각주로 제공하는 방식도 적절합니다.
