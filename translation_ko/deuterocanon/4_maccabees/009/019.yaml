  - 형벌용 바퀴
  rationale: 원문은 단순히 ‘그 바퀴’라고 하므로 본문에는 문자적 표현을 유지하고, 한국어 문맥상 고문 도구임은 서술 전체로 충분히 드러나게 했습니다.
  doctrine_reference: 번역 원칙 §1, §6
- issue: ἀρετή의 철학적 의미 보존
  chosen_reading: 덕
  alternative_readings:
  - 미덕
  - 도덕적 탁월함
  - 탁월성
  rationale: 4마카베오는 헬라 윤리철학 어휘를 사용하므로, 교회식 추상어보다 ‘덕’이 원문의 사상 세계를 가장 직접적으로 보존합니다.
  doctrine_reference: 번역 원칙 §1, §5
