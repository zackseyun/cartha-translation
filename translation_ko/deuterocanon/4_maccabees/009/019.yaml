  source_fidelity: 첫 문장의 ὑπὲρ ἀρετῆς와 ἀνίκητοι는 대체로 충실하지만, ‘덕을 위하여는’은 조사 결합이 부자연스럽습니다. πῦρ ἐπέστρωσαν은 문맥상 희생자 아래에 불을 까는 행동으로 이해할 수 있으나, 초안의 ‘그 위에’는 지시 대상과 위치가 불명확하고 고문 장면의 문맥과도 맞지 않습니다. 또한 διερεθίζοντες는 ‘바퀴를 돌리다’라는 뜻이 아니므로 ‘세차게 몰아’는 지나치게 구체적입니다. 마지막 동사는 고문 대상자를 더욱 당기거나 긴장을 더하는 뜻으로 옮기는 편이 안전합니다.
