  - 그런데
  lexicon: LSJ
  rationale: 앞선 서술과의 대조를 분명히 하는 접속사이므로, 현대 한국어에서 가장 자연스러운 대조 표지인 ‘그러나’로 옮겼습니다.
- source_word: ὥσπερ
