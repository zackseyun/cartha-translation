    reason: lexical_alternative
  - marker: b
    text: 제공된 그리스어 본문은 목적어를 이끄는 여성 복수 정관사 ‘τὰς’에서 끝납니다. 따라서 뒤따를 명사는 전승된 절편에 없으며, 번역에서도 줄임표로 이를 나타냈습니다.
    reason: textual_variant
