  lexicon: LSJ
  rationale: 비유적 비교를 나타내며 실제 변형을 단정하지 않도록, ‘마치 …처럼’으로 처리했습니다.
- source_word: ἐν πυρί
  english_pob_choice: in the fire
  chosen_korean: 불 속에서
  alternatives_korean:
  - 불 가운데서
  - 불 안에서
  lexicon: LSJ
  rationale: 장면의 위치적 이미지를 살리면서도 한국어로 자연스럽게 들리도록 ‘불 속에서’로 옮겼습니다.
- source_word: εἰς ἀφθαρσίαν
  english_pob_choice: into incorruptibility
  chosen_korean: 썩지 않음으로
  alternatives_korean:
  - 불멸로
  - 부패하지 않음으로
  - 썩지 않는 상태로
  lexicon: LSJ
  rationale: ἀφθαρσία의 핵심인 ‘부패/썩음의 부재’를 직접 드러내되, 영어 POB가 보존한 의미 범위를 좁히지 않기 위해 ‘썩지 않음’으로 옮겼습니다.
- source_word: ὑπέμεινεν εὐγενῶς
  english_pob_choice: he nobly endured
  chosen_korean: 그는 … 고상하게 견뎌 냈습니다
  alternatives_korean:
  - 그는 … 품위 있게 견뎌 냈습니다
  - 그는 … 기품 있게 참아 냈습니다
  lexicon: LSJ
  rationale: εὐγενῶς의 ‘고귀하게, 품위 있게’라는 뉘앙스를 살려 ‘고상하게’로 옮겼고, ὑπέμεινεν은 인내의 뉘앙스를 살려 ‘견뎌 냈습니다’로 렌더링했습니다.
theological_decisions:
- issue: ἀφθαρσία의 종말론적 뉘앙스
  chosen_reading: ‘썩지 않음’으로 옮겨, 불멸이라는 더 특정한 교리 용어로 좁히지 않았습니다.
  alternative_readings:
  - 불멸
  - 부패하지 않음
  - 영원한 생명
  rationale: 본문의 어휘는 부패/소멸의 반대를 가리키며, 반드시 ‘불멸’이라는 교리적 결론으로 수렴시키지 않아도 됩니다. 원문의 긴장과 시적 과장을 보존하는 쪽이 더 적절합니다.
  doctrine_reference: 원문의 어휘 범위를 보존하고, 단어 수준에서 교리화를 앞서지 않음.
