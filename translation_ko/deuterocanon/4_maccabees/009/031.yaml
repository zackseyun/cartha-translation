  text: For I, by the pleasures that come through virtue, lighten the pain.
translation:
  language: ko
  text: 나는 참으로 덕에서 나오는 즐거움들로 그 고통을 덜어 냅니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡδέσι ... ἡδοναῖς
  english_pob_choice: by the pleasures
  chosen_korean: 즐거움들로
  alternatives_korean:
  - 기쁨들로
  - 쾌락들로
  lexicon: LSJ
  rationale: 여기서는 도구적 여격으로서 ‘즐거움/기쁨’의 의미가 가장 직접적입니다. ‘쾌락’은 현대 한국어에서 지나치게 감각적이어서 순교 문맥의 역설적 뉘앙스를 약화시킬 수 있습니다.
- source_word: διὰ τὴν ἀρετήν
  english_pob_choice: that come through virtue
  chosen_korean: 덕에서 나오는
  alternatives_korean:
  - 덕 때문에 생기는
  - 덕을 통해 오는
  lexicon: LSJ
  rationale: διά + 대격은 원인·매개를 나타낼 수 있으므로, 즐거움이 ‘덕’과 연결되어 생겨나는 관계를 자연스럽게 드러냈습니다. ‘덕에서 나오는’은 원문의 관계를 간결하게 보존합니다.
- source_word: τὸν πόνον
  english_pob_choice: the pain
  chosen_korean: 그 고통
  alternatives_korean:
  - 그 아픔
  - 그 수고
  lexicon: LSJ
  rationale: 순교적 고문과 신체적 고통의 맥락이므로 ‘고통’이 가장 포괄적이고 문맥에 맞습니다. ‘수고’는 의미가 약하고, ‘아픔’은 다소 국소적입니다.
- source_word: ἐπικουφίζομαι
  english_pob_choice: lighten
  chosen_korean: 덜어 냅니다
  alternatives_korean:
  - 가볍게 합니다
  - 완화합니다
  lexicon: LSJ
  rationale: 동사는 무게를 덜어 가볍게 하거나 완화한다는 뜻입니다. ‘덜어 냅니다’는 은유를 살리면서 현대 한국어에서 자연스럽고 간결합니다.
theological_decisions:
- issue: ἀρετή의 윤리-철학적 함의
  chosen_reading: 덕
  alternative_readings:
  - 탁월함
  - 미덕
  rationale: 4마카베오서에서 ἀρετή는 단순한 도덕성보다, 고난 속에서도 지혜롭게 견디는 윤리적·철학적 강함을 가리킵니다. 한국어 ‘덕’은 이 개념을 가장 넓게 담으면서도 문맥상 과도하게 교회화하지 않습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; readable modern Korean.'
