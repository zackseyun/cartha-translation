translation:
  language: ko
  text: 이 고난과 인내를 통해 우리는 참된 덕의 상들을 반드시 차지할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘덕의 보상들’을 뜻할 수 있습니다. 그리스어는 경기 언어를 사용하여 문자적으로는 ‘덕의 상들을 차지하다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τῆσδε τῆς κακοπαθείας
  english_pob_choice: through this suffering
  chosen_korean: 이 고난을 통해
  alternatives_korean:
  - 이 고난 가운데
  - 이 괴로움으로 인해
  lexicon: BDAG
  rationale: διά + 속격은 수단·매개를 나타내므로 ‘~을 통해’로 옮기고, τῆσδε의 지시성을 살려 ‘이’로 구체화했습니다. κακοπάθεια는 단순한 불편이 아니라 견디기 어려운 고난이므로 ‘고난’이 적절합니다.
- source_word: ὑπομονῆς
  english_pob_choice: endurance
  chosen_korean: 인내
  alternatives_korean:
  - 견딤
  - 꾸준한 인내
  lexicon: BDAG
  rationale: 문맥상 경기적·윤리적 덕목을 가리키므로 현대 한국어의 핵심 대응어인 ‘인내’로 옮겼습니다. 앞의 ‘고난’과 함께 자연스러운 짝을 이루면서도 의미를 과도하게 확대하지 않습니다.
- source_word: τὰ τῆς ἀρετῆς ἆθλα
  english_pob_choice: the prizes of virtue
  chosen_korean: 참된 덕의 상들
  alternatives_korean:
  - 덕의 상들
  - 덕의 보상들
  - 도덕적 탁월함의 상들
  lexicon: LSJ
  rationale: ἆθλα는 경주나 경기를 통해 얻는 ‘상/상품’이라는 경기적 은유를 지니므로 ‘상들’로 살렸습니다. ἀρετή는 이 문맥에서 헬라적 윤리의 핵심어이므로 ‘덕’으로 옮기되, 4 마카베오의 사상적 뉘앙스를 살리기 위해 ‘참된’으로 수식했습니다.
- source_word: οἴσομεν
  english_pob_choice: we will ... carry off
  chosen_korean: 반드시 차지할 것입니다
  alternatives_korean:
  - 가져갈 것입니다
  - 차지하게 될 것입니다
  - 거머쥘 것입니다
  lexicon: BDAG
  rationale: 미래형 오ἴσομεν의 ‘가져가다/차지하다’ 의미와 ἆθλα의 경기 은유를 함께 살리기 위해 ‘차지하다’를 택했습니다. POB의 ‘carry off’와 같은 의미층을 자연스러운 한국어로 재현합니다.
theological_decisions:
- issue: ἀρετή의 번역 범위
  chosen_reading: ‘덕’으로 번역하되, 단순한 일반 도덕이 아니라 고난 속에서 드러나는 윤리적 탁월성을 가리키는 것으로 유지했습니다.
  alternative_readings:
  - 도덕적 탁월함
  - 미덕
  rationale: 4 마카베오는 철학적·유대교적 순교 담론 안에서 ἀρετή를 사용하므로, 교회 전통어보다 본문의 헬레니즘 윤리어휘를 드러내는 번역이 적합합니다. ‘참된’은 문맥상의 가치판단을 덧붙여 주되 의미를 과장하지 않습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
