base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/030.yaml
  text: Do you not think[a], O most savage tyrant of all, that you are now being tortured more than I am[b], seeing the proud reasoning of your tyranny being conquered by our endurance for the sake of godliness?
  footnotes:
  - marker: a
    text: Or 'the arrogant mindset of your tyranny.' The Greek λογισμός can denote reasoning, thought, or governing mindset; the rendering 'reasoning' preserves the book's emphasis on rationality.
    reason: lexical_alternative
  - marker: b
    text: Or 'because of our piety.' The phrase may be understood as endurance motivated by devotion to God.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 생각하지 않습니까? 오, 모든 이 가운데 가장 잔혹한 폭군이여, 당신이 이제 나보다 더 큰 고통을 당하고 있다고, 곧 당신의 폭정에 속한 교만한 생각이 우리의 경건을 위한 인내에 의해 꺾이는 것을 보면서 말입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 폭정에 속한 교만한 논리’. λογισμός는 생각, 사유, 또는 지배적 마음가짐을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리의 경건 때문에’. 이 표현은 하나님께 대한 헌신 때문에 드러나는 인내로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ δοκεῖς
  english_pob_choice: Do you not think
  chosen_korean: 당신은 생각하지 않습니까?
  alternatives_korean:
  - 당신은 그렇게 여기지 않습니까?
  - 당신은 그렇게 생각하지 않습니까?
  lexicon: LSJ
  rationale: 수사적 반문을 살리면서, 현대 한국어에서 자연스러운 ‘생각하다’로 도전적인 어조를 유지했습니다.
- source_word: ὦ πάντων ὠμότατε τύραννε
  english_pob_choice: O most savage tyrant of all
  chosen_korean: 오, 모든 이 가운데 가장 잔혹한 폭군이여
  alternatives_korean:
  - 오, 모든 이 가운데 가장 사나운 폭군이여
  - 오, 가장 잔인한 폭군이여
  lexicon: LSJ
  rationale: ὠμότατε의 잔혹함·야만성을 살리기 위해 ‘잔혹한’으로 옮기고, πάντων은 ‘모든 이 가운데’로 보존했습니다.
- source_word: τὸν τῆς τυραννίδος ὑπερήφανον λογισμὸν
  english_pob_choice: the proud reasoning of your tyranny
  chosen_korean: 당신의 폭정에 속한 교만한 생각
  alternatives_korean:
  - 당신의 폭정의 교만한 논리
  - 당신의 폭정에 속한 오만한 판단
  lexicon: LSJ
  rationale: λογισμός의 ‘생각/사유’ 의미를 살리되, 4 Maccabees의 이성적 주제에 맞게 ‘교만한 생각’으로 옮겼습니다.
- source_word: διὰ τὴν εὐσέβειαν ἡμῶν
  english_pob_choice: for the sake of godliness
  chosen_korean: 우리의 경건을 위해
  alternatives_korean:
  - 우리의 경건 때문에
  - 하나님을 향한 우리의 경건 때문에
  lexicon: LSJ
  rationale: εὐσέβεια를 단순한 종교적 형식이 아니라 하나님께 대한 경건한 충성으로 보되, 한국어에서는 자연스럽고 간결한 ‘경건’으로 처리했습니다.
- source_word: ὑπομονῆς
  english_pob_choice: endurance
  chosen_korean: 인내
  alternatives_korean:
  - 견딤
  - 참음
  lexicon: LSJ
  rationale: ὑπομονή의 고난 아래 버티는 의미를 한국어의 표준 종교 어휘인 ‘인내’로 간명하게 살렸습니다.
theological_decisions:
- issue: εὐσέβεια의 한국어 톤
  chosen_reading: 경건
  alternative_readings:
  - 경건함
  - 신앙적 경외
  rationale: 순교 문맥에서 εὐσέβεια는 단순한 예의가 아니라 하나님께 대한 충성된 경외를 뜻하므로, 한국어 표준 성경 어휘인 ‘경건’이 가장 적절합니다.
  doctrine_reference: Translation philosophy §6; key-term consistency
- issue: 폭정의 ‘생각/논리’가 무너진다는 역설
  chosen_reading: 당신의 폭정에 속한 교만한 생각이 ... 꺾이는
  alternative_readings:
  - 당신의 폭정의 교만한 논리가 ... 정복되는
  - 당신의 폭정의 오만한 판단이 ... 이겨지는
  rationale: 4 마카베오서의 이성-지배 어휘를 살려, 폭군의 내적 사유가 순교자들의 인내에 의해 패배한다는 역설을 드러냈습니다.
  doctrine_reference: Translation philosophy §5
