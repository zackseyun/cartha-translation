  rationale: ὑπομονή의 고난 아래 버티는 의미를 한국어의 표준 종교 어휘인 ‘인내’로 간명하게 살렸습니다.
theological_decisions:
- issue: εὐσέβεια의 한국어 톤
  chosen_reading: 경건
  alternative_readings:
  - 경건함
  - 신앙적 경외
  rationale: 순교 문맥에서 εὐσέβεια는 단순한 예의가 아니라 하나님께 대한 충성된 경외를 뜻하므로, 한국어 표준 성경 어휘인 ‘경건’이 가장 적절합니다.
  doctrine_reference: Translation philosophy §6; key-term consistency
- issue: 폭정의 ‘생각/논리’가 무너진다는 역설
  chosen_reading: 당신의 폭정에 속한 교만한 생각이 ... 꺾이는
  alternative_readings:
  - 당신의 폭정의 교만한 논리가 ... 정복되는
  - 당신의 폭정의 오만한 판단이 ... 이겨지는
  rationale: 4 마카베오서의 이성-지배 어휘를 살려, 폭군의 내적 사유가 순교자들의 인내에 의해 패배한다는 역설을 드러냈습니다.
  doctrine_reference: Translation philosophy §5
