base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/030.yaml
  text: Do you not think[a], O most savage tyrant of all, that you are now being tortured more than I am[b], seeing the proud reasoning of your tyranny being conquered by our endurance for the sake of godliness?
  footnotes:
  - marker: a
    text: Or 'the arrogant mindset of your tyranny.' The Greek λογισμός can denote reasoning, thought, or governing mindset; the rendering 'reasoning' preserves the book's emphasis on rationality.
    reason: lexical_alternative
  - marker: b
    text: Or 'because of our piety.' The phrase may be understood as endurance motivated by devotion to God.
    reason: lexical_alternative
translation:
  language: ko
  text: 오, 모든 이 가운데 가장 잔혹한 폭군이여, 당신은 당신의 폭정의 오만한 논리[a]가 경건으로 말미암은 우리의 인내[b]에 정복당하는 것을 보면서, 이제 당신이 나보다 더 큰 고통을 당하고 있다고 생각하지 않습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 폭정의 오만한 사고방식’. 그리스어 λογισμός는 논리, 사유, 또는 지배적인 사고방식을 가리킬 수 있습니다. ‘논리’는 이 책에서 두드러지는 이성적 사유의 주제를 보존합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리의 경건 때문에’. 이 표현은 하나님께 대한 경건에서 비롯된 인내를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ δοκεῖς
  english_pob_choice: Do you not think
  chosen_korean: 당신은 생각하지 않습니까?
  alternatives_korean:
  - 당신은 그렇게 여기지 않습니까?
  - 당신은 그렇게 생각하지 않습니까?
  lexicon: LSJ
  rationale: 수사적 반문을 살리면서, 현대 한국어에서 자연스러운 ‘생각하다’로 도전적인 어조를 유지했습니다.
- source_word: ὦ πάντων ὠμότατε τύραννε
  english_pob_choice: O most savage tyrant of all
  chosen_korean: 오, 모든 이 가운데 가장 잔혹한 폭군이여
  alternatives_korean:
  - 오, 모든 이 가운데 가장 사나운 폭군이여
