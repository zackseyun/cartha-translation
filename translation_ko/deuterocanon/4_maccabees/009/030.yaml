  lexicon: LSJ
  rationale: ὠμότατε의 잔혹함·야만성을 살리기 위해 ‘잔혹한’으로 옮기고, πάντων은 ‘모든 이 가운데’로 보존했습니다.
- source_word: τὸν τῆς τυραννίδος ὑπερήφανον λογισμὸν
  english_pob_choice: the proud reasoning of your tyranny
  chosen_korean: 당신의 폭정에 속한 교만한 생각
  alternatives_korean:
  - 당신의 폭정의 교만한 논리
  - 당신의 폭정에 속한 오만한 판단
  lexicon: LSJ
  rationale: λογισμός의 ‘생각/사유’ 의미를 살리되, 4 Maccabees의 이성적 주제에 맞게 ‘교만한 생각’으로 옮겼습니다.
- source_word: διὰ τὴν εὐσέβειαν ἡμῶν
  english_pob_choice: for the sake of godliness
  chosen_korean: 우리의 경건을 위해
  alternatives_korean:
  - 우리의 경건 때문에
  - 하나님을 향한 우리의 경건 때문에
  lexicon: LSJ
  rationale: εὐσέβεια를 단순한 종교적 형식이 아니라 하나님께 대한 경건한 충성으로 보되, 한국어에서는 자연스럽고 간결한 ‘경건’으로 처리했습니다.
- source_word: ὑπομονῆς
