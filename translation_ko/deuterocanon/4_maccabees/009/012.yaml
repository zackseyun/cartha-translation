base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/012.yaml
  text: But when they grew weary from striking him with whips[a], accomplishing nothing[b], they put him on the wheel.
  footnotes:
  - marker: a
    text: Or 'onto the wheel.' The Greek preposition ἐπί with the accusative can emphasize movement onto the instrument.
    reason: lexical_alternative
  - marker: b
    text: The 'wheel' is a torture device, not an ordinary cart wheel.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 그들이 채찍으로 그를 치다가 지쳐 아무 성과도 거두지 못하자, 그를 바퀴[b] 위에[a] 올려놓았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바퀴 위로’. 헬라어 전치사 ἐπί와 대격은 그 기구 위로 옮겨 가는 움직임을 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘바퀴’는 일반적인 수레의 바퀴가 아니라 고문 기구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: τύπτοντες ταῖς μάστιξιν
  english_pob_choice: striking him with whips
  chosen_korean: 채찍으로 그를 치다가
  alternatives_korean:
  - 채찍질하며
  - 채찍으로 때리다가
  lexicon: LSJ
  rationale: τύπτοντες와 μάστιξιν의 반복적 구타를 자연스러운 현대 한국어로 옮기되, 과도한 해석 없이 물리적 타격을 드러내기 위해 ‘채찍으로 그를 치다가’를 선택했습니다.
- source_word: ἐκοπίασαν
  english_pob_choice: grew weary
  chosen_korean: 지쳐
  alternatives_korean:
  - 피곤해져
  - 탈진하여
  lexicon: BDAG
  rationale: 동사의 ‘지치다/피곤해지다’ 의미를 살리면서도 서술 흐름을 매끄럽게 하기 위해 ‘지쳐’로 옮겼습니다.
- source_word: μηδὲν ἀνύοντες
  english_pob_choice: accomplishing nothing
  chosen_korean: 아무 성과도 얻지 못하자
  alternatives_korean:
  - 아무것도 이루지 못하자
  - 아무런 성과도 내지 못하자
  lexicon: LSJ
  rationale: 의도한 결과를 전혀 얻지 못했다는 뜻을 한국어 관용으로 풀어, 고문의 무효성을 분명히 드러냈습니다.
- source_word: ἐπὶ τὸν τροχόν
  english_pob_choice: on the wheel
  chosen_korean: 수레바퀴 위에
  alternatives_korean:
  - 바퀴 위에
  - 그 고문용 바퀴 위에
  lexicon: LSJ
  rationale: τροχός는 문맥상 일반 수레바퀴가 아니라 고문 기구를 가리키므로, 본문에는 간결하게 ‘수레바퀴 위에’로 두되 문화적 구분은 각주로 보완했습니다.
theological_decisions:
- issue: 고문 기구 τροχός의 의미
  chosen_reading: 본문은 ‘수레바퀴’로 옮기되, 일반적인 바퀴가 아니라 고문 도구라는 점을 각주로 밝혔습니다.
  alternative_readings:
  - 고문용 바퀴
  - 바퀴
  rationale: 한국어에서 ‘바퀴’만 쓰면 의미가 지나치게 일반화될 수 있어, 본문은 자연스러운 표현을 택하고 오해 가능성은 각주로 처리했습니다.
  doctrine_reference: 역사적·문화적 배경 전달
