lexical_decisions:
- source_word: τῶν δορυφόρων
  english_pob_choice: the bodyguards
  chosen_korean: 호위병들
  alternatives_korean:
  - 경호병들
  - 근위병들
  - 몸을 지키는 자들
  lexicon: δορυφόρος
  rationale: δώρυφόροι는 문자적으로는 무장 수행원을 가리키며, 문맥상 투옥된 인물을 압박하는 수행 경비를 뜻하므로 현대 한국어에서는 기능을 드러내는 「호위병들」이 가장 자연스럽습니다.
- source_word: Ὁμολόγησον
  english_pob_choice: Agree
  chosen_korean: 동의하십시오
  alternatives_korean:
  - 먹겠다고 인정하십시오
  - 인정하십시오
  - 승낙하십시오
  lexicon: ὁμολογέω
  rationale: 이 문맥에서 핵심은 죄를 고백하라는 의미가 아니라 식사하겠다고 수긍하라는 압박이므로, POB의 「Agree」를 따라 「동의하십시오」로 옮겼습니다.
- source_word: φαγεῖν
  english_pob_choice: to eat
  chosen_korean: 먹겠다고
  alternatives_korean:
  - 먹는다고
  - 먹도록
  - 먹게
  lexicon: ἐσθίω
  rationale: 부정사 구문은 직접 인용에서 목적 절처럼 기능하므로, 한국어에서는 의지를 표명하는 간접 인용 형태로 자연스럽게 풀어 「먹겠다고」로 옮겼습니다.
- source_word: ἀπαλλαγῇς
  english_pob_choice: you may be released
  chosen_korean: 풀려나실 수 있습니다
  alternatives_korean:
  - 석방되실 수 있습니다
  - 벗어나실 수 있습니다
  - 놓여나실 수 있습니다
  lexicon: ἀπαλλάσσω
  rationale: ἀπαλλαγῇς는 단순한 해방·면제를 뜻하므로, 감옥 문맥에서 가장 직역적이면서도 현대적인 표현인 「풀려나실 수 있습니다」를 선택했습니다.
