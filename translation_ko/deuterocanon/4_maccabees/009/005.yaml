  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 원문의 문장 구조는 ‘고문을 통하여 우리에게 닥칠 죽음’을 위협하는 것이므로, ‘우리에게 죽음을 위협하며’보다 ‘고문으로 우리를 죽이겠다고 위협하면서’가 수단과 대상의 관계를 더 자연스럽고 분명하게 드러냅니다. 또한 ὥσπερ οὐχὶ ... μαθών은 ‘아무것도 배우지 않은’이라고 반드시 확대할 필요 없이 ‘배우지 않은’으로 옮겨 원문의 표현을 보존하는 편이 안전합니다.
  naturalness: 합쇼체와 전반적 문체는 적절합니다. 그러나 ‘마치 … 것처럼 말입니다’는 앞 절과 분리될 때 다소 구어적이고 느슨합니다. ‘마치 … 배우지 않기라도 한 것처럼’으로 연결하면 현대 한국어의 반어적 질책이 더 자연스럽게 살아납니다.
  terminology: ‘고문’은 βάσανοι에 적절하고, ‘엘리아자르’는 통용되는 한국어 성서식 인명 표기와 잘 맞습니다. ‘죽음’도 θάνατον에 충실합니다. 별도의 신학 용어 문제는 없습니다.
