  text: But you are trying to frighten us by threatening us with death through tortures[a], as though you had not learned from Eleazar a little while ago.
  footnotes:
  - marker: a
    text: Or, 'as if you had learned nothing from Eleazar recently.' The sense is rhetorical and sarcastic, not a literal denial that he witnessed Eleazar's example.
