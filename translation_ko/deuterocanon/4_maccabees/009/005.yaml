translation:
  language: ko
  text: 그러나 당신은 고문으로 우리를 죽이겠다고 위협하면서 우리를 겁주려 하고 있습니다. 마치 얼마 전에 엘리아자르에게서 배우지 않기라도 한 것처럼 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘마치 얼마 전에 엘리아자르에게서 배우지 않은 것처럼.’ 이는 엘리아자르의 본보기를 보고도 그 교훈을 무시하는 상대를 반어적으로 꾸짖는 표현입니다.
    reason: lexical_alternative
