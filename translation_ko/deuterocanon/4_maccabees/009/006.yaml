revisions:
- from: 만일 히브리인들의 늙은이들이 경건 때문에 고문을 견디고 죽었다면, 우리 젊은이들은 오히려 더 마땅히 죽어야 하지 않겠습니까? 우리는 당신의 강요로 인한 고문을 가벼이 여기고, 그 고문을 이긴 그 늙은 스승도 있었습니다.[a][b]
  to: 만일 히브리 사람들의 노인들이 경건 때문에 고문을 견디고 죽었다면, 나이 든 스승도 이겨 낸 당신의 강요로 인한 고문을 아랑곳하지 않고 우리 젊은이들이 죽는 것이 더욱 마땅하지 않겠습니까?
  rationale: 마지막 관계절을 ‘나이 든 스승도 이겨 낸’으로 복원하여 ἐνίκησεν과 ἃς의 문법 관계를 충실히 반영했습니다. ‘아랑곳하지 않고’는 ὑπεριδόντες의 멸시하고 개의치 않는 태도를 자연스럽게 나타냅니다. 기존 각주는 번역문 이해에 필수적이지 않으며, 특히 첫 각주의 직분/연령 구분은 본문 번역에 이미 ‘노인들’로 충분히 반영되므로 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:52:47Z'
