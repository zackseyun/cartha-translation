  source_fidelity: 핵심 대조와 수사 의문문은 살렸지만, 현 번역의 마지막 절은 ἐνίκησεν(‘이겼다/이겨 냈다’)을 ‘있었습니다’로 바꾸어 원문의 서술을 소실했습니다. 또한 관계절이 ‘고문’을 수식한다는 문법 관계가 흐려졌습니다.
  naturalness: ‘그 고문을 이긴 그 늙은 스승도 있었습니다’는 현대 한국어에서 비문에 가깝고 문맥상 무엇을 말하는지 불명료합니다. ‘나이 든 스승도 이겨 낸 … 고문’으로 고치면 자연스럽고 원문의 관계절 구조도 드러납니다. ‘늙은이들’보다 ‘노인들’이 현대 공적 문체에서 중립적입니다.
