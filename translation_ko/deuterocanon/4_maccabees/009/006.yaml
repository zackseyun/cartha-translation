  yaml_path: translation/deuterocanon/4_maccabees/009/006.yaml
  text: But if the old men of the Hebrews died after enduring tortures because of godliness, how much more rightly should we, the young men, die, having disregarded the tortures of your compulsion, which the aged instructor also conquered.
translation:
  language: ko
  text: 만일 히브리 사람들의 노인들이 경건 때문에 고문을 견디고 죽었다면, 나이 든 스승도 이겨 낸 당신의 강요로 인한 고문을 아랑곳하지 않고 우리 젊은이들이 죽는 것이 더욱 마땅하지 않겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέροντες
  english_pob_choice: old men
  chosen_korean: 늙은이들
  alternatives_korean:
  - 장로들
  - 노인들
  - 늙은 남자들
  lexicon: γέρων / γέροντες
  rationale: POB가 ‘old men’으로 풀어낸 집단적 연령 표현을 살려, 직분 의미의 ‘장로들’은 피하고 자연스러운 현대어 ‘늙은이들’로 옮겼습니다.
- source_word: εὐσέβεια
  english_pob_choice: godliness
  chosen_korean: 경건
  alternatives_korean:
  - 하나님을 향한 경건함
  - 경외
  - 경건함
  lexicon: εὐσέβεια
  rationale: 원문의 종교적 태도와 POB의 ‘godliness’를 반영해, 한국어 성경 문맥에서 가장 직접적인 ‘경건’을 사용했습니다.
- source_word: βασανισμούς / βασάνους
  english_pob_choice: tortures
  chosen_korean: 고문
  alternatives_korean:
  - 고초
  - 형벌
  - 심문
  lexicon: βάσανος / βασανισμός
  rationale: 반복되는 가혹한 신체적 가해를 가리키므로, 추상화된 ‘고초’보다 구체적이고 강한 ‘고문’이 원문과 POB의 강도를 잘 드러냅니다.
- source_word: τὰς βασάνους τῶν σῶν ἀναγκῶν
  english_pob_choice: the tortures of your compulsion
  chosen_korean: 당신의 강요로 인한 고문
  alternatives_korean:
  - 당신의 억압의 고문
  - 당신의 강제의 고문
  - 당신이 강요하는 고문
  lexicon: ἀνάγκη
  rationale: ἀνάγκη가 단순한 ‘필요’가 아니라 강제·압박의 힘을 뜻하므로, POB의 ‘compulsion’을 따라 ‘강요’로 옮겨 문맥의 폭압성을 살렸습니다.
theological_decisions:
- issue: ‘δικαιότερον’의 비교·도덕적 타당성 표현
  chosen_reading: ‘오히려 더 마땅히’로 옮겨, 단순한 비교급이 아니라 윤리적 당위의 뉘앙스를 살렸습니다.
  alternative_readings:
  - 더 옳게
  - 더 정당하게
  - 더 마땅하게
  rationale: 순수한 정도 비교보다 ‘우리 젊은이들이 더 당연히 그래야 한다’는 수사적 압박이 핵심이므로, 한국어에서는 당위성을 분명히 드러냈습니다.
  doctrine_reference: 순교 권면과 지혜문학적 수사
- issue: ‘ὁ παιδευτὴς γέρων ἐνίκησεν’의 의미
  chosen_reading: ‘그 늙은 스승도 있었습니다’로 처리해, 마지막 절을 독립적 관계절이 아니라 예시적 종결로 자연스럽게 읽히게 했습니다.
  alternative_readings:
  - 늙은 교육자가 이겼습니다
  - 그 늙은 훈련자도 이겼습니다
  - 그 늙은 스승이 이겼습니다
  rationale: παιδευτής는 단순 교사보다 훈육·교육하는 인물을 가리키므로 ‘스승’이 가장 무난하며, ἐνίκησεν의 승리는 앞선 고문을 이겨 냈다는 문맥적 승리로 이해했습니다.
  doctrine_reference: 순교 서사와 인내의 승리
