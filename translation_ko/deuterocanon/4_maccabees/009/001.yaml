  text: What are you waiting for[b][a], O tyrant? For we are ready to die rather than transgress the commandments of our fathers.
  footnotes:
  - marker: a
    text: Or, 'What are you waiting for, O tyrant?' The Greek idiom can express delay or hesitation.
    reason: lexical_alternative
  - marker: b
    text: Or, 'our ancestral commandments.' The phrase refers to the inherited commands of the Jewish tradition.
    reason: lexical_alternative
translation:
  language: ko
  text: 「왜 주저하십니까[a], 폭군이여? 우리는 우리 조상들의 계명[b]을 어기느니 죽을 준비가 되어 있습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왜 기다리십니까, 폭군이여?’로 옮길 수 있습니다. 여기서 μέλλω는 행동을 지연하거나 머뭇거리는 뜻의 관용적 표현일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리 조상들에게서 전해 내려온 계명’으로 옮길 수 있습니다. 이는 유대 전통에서 물려받은 계명을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί μέλλεις
  english_pob_choice: Why do you hesitate
  chosen_korean: 왜 주저하십니까
  alternatives_korean:
  - 왜 기다리십니까
  - 왜 머뭇거리십니까
  lexicon: LSJ
  rationale: μέλλω는 단순한 ‘기다리다’보다 행동을 미루거나 주저하는 뉘앙스를 담아, 수사적 책망으로서의 힘을 살려 ‘주저하십니까’로 옮겼습니다.
- source_word: ὦ τύραννε
  english_pob_choice: O tyrant
  chosen_korean: 오 폭군이여
  alternatives_korean:
  - 오 폭군
  - 오 통치자
  lexicon: LSJ
  rationale: τύραννος는 여기서 분명히 경멸적 호칭이므로, 직접 호격을 살리면서도 평가를 보존하는 ‘오 폭군이여’를 선택했습니다.
- source_word: πατρίους ἡμῶν ἐντολάς
  english_pob_choice: the commandments of our fathers / our ancestral commandments
  chosen_korean: 우리 조상들의 계명
  alternatives_korean:
  - 우리 선조들의 계명
  - 우리 조상들에게서 전해 내려온 계명
  lexicon: LSJ
  rationale: πατρίους는 ‘조상/아버지에게서 전해진’ 뜻이므로, 한국어에서는 자연스럽고도 계승성을 드러내는 ‘조상들의 계명’으로 옮겼습니다.
- source_word: ἀποθνήσκειν
  english_pob_choice: to die
  chosen_korean: 죽는 것은
  alternatives_korean:
  - 죽는 일은
  - 죽는 것
  lexicon: LSJ
  rationale: 부정사 구조를 한국어 명사화해, ‘죽음’ 자체를 선택 가능한 대안으로 대비시키는 문장을 자연스럽게 살렸습니다.
theological_decisions:
- issue: 조상들의 계명을 어기는 것과 죽음의 대비
  chosen_reading: 순교적 결단으로서 죽음은 감수하되, 조상으로부터 받은 계명은 넘지 않겠다는 선언으로 읽었습니다.
  alternative_readings:
  - 단순한 정치적 저항 선언
  - 일반적 도덕 규범 준수
  rationale: 문맥상 이 말은 폭군 앞에서 유대 전통의 계명을 지키기 위해 죽음을 택하는 순교적 고백이므로, 종교적-언약적 긴장을 드러내는 방향을 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
