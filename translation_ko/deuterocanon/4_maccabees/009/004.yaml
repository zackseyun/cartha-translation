translation:
  language: ko
  text: 우리는 우리를 부당하게 구원하려는 당신의 연민이 죽음 그 자체보다 더 가혹하다고 여깁니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리의 불법한 보존을 위한 자비’, ‘우리를 불법하게 살리려는 동정’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαλεπώτερον
  english_pob_choice: harsher
  chosen_korean: 더 가혹하다고
  alternatives_korean:
  - 더 심하다고
  - 더 괴롭다고
  - 더 엄중하다고
  lexicon: LSJ
  rationale: comparative μορφή의 χαλεπός는 더 무겁고 견디기 어려운 정도를 나타내므로, 현대 한국어에서는 ‘더 가혹하다’가 문맥의 강한 평가를 가장 자연스럽게 살립니다.
- source_word: νομίζομεν
  english_pob_choice: we consider
  chosen_korean: 여깁니다
  alternatives_korean:
  - 생각합니다
  - 판단합니다
  - 여깁니다
  lexicon: LSJ
  rationale: 여기서는 단순한 의견이 아니라 상대의 제안을 평가하고 단정하는 어조이므로, ‘여깁니다’가 판단의 뉘앙스를 잘 전달합니다.
- source_word: ἔλεον
  english_pob_choice: pity
  chosen_korean: 연민
  alternatives_korean:
  - 긍휼
  - 자비
  - 동정
  lexicon: LSJ
  rationale: 문맥상 법을 어겨서라도 살려 주려는 감정적 호의에 대한 거부이므로, 신학적으로 과도하게 고정되지 않으면서도 연민 섞인 호의를 드러내는 ‘연민’이 적절합니다.
- source_word: παρανόμῳ σωτηρίᾳ ἡμῶν
  english_pob_choice: our unlawful deliverance
  chosen_korean: 우리를 부당하게 구원하려는
  alternatives_korean:
  - 우리의 불법적인 구원을 위한
  - 우리의 율법을 어긴 구제를 위한
  - 우리의 불법한 구원에 대한
  lexicon: LSJ
  rationale: σωτηρία는 여기서 종교적 ‘구원’이 아니라 목숨을 건져 주는 구제이므로, 동사구로 풀어 ‘구원하려는’으로 옮기되 παρανόμῳ의 위법성을 ‘부당하게’로 담았습니다.
theological_decisions:
- issue: σωτηρία의 번역을 신학적 ‘구원’으로 볼지, 상황적 ‘구제/구명’으로 볼지
  chosen_reading: 상황적 구원 의도로서 ‘구원하려는’이라는 표현을 쓰되, 문맥상 법을 어겨 목숨을 살리려는 시도라는 점을 분명히 했습니다.
  alternative_readings:
  - 구제
  - 보존
  - 도움
  rationale: 이 절의 σωτηρία는 교리적 구원이 아니라 생명 보전을 가리키지만, 한국어에서 가장 가까운 핵심어가 ‘구원’이므로 문맥 제한을 반영한 동사형 표현으로 처리했습니다.
  doctrine_reference: Translation philosophy §1, §6
