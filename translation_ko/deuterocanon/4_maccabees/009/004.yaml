  source_fidelity: ‘부당하게’는 παράνομος의 핵심인 ‘법/율법에 어긋남’을 일반적인 부당함으로 약화합니다. 또한 σωτηρία는 이 문맥에서 목숨을 보전받는 일을 가리키므로, ‘살려 주다’로 풀어 신학적 구원으로 읽힐 가능성을 피하는 편이 정확합니다. ‘우리의 불법한 구원’이라는 속격 관계와 ἐπί의 목적·관련 의미는 ‘율법을 어기는 방식으로 우리를 살려 주려는’으로 자연스럽게 반영할 수 있습니다.
  naturalness: 현 문장은 문법적으로 가능하지만 ‘우리를 부당하게 구원하려는’은 무엇이 부당한지 불분명하고 ‘구원’이 다소 신학적으로 들립니다. 수정문은 현대 표준어 합쇼체로 자연스럽고, 화자가 상대의 목숨을 살려 주겠다는 제안을 거부하는 문맥을 분명히 합니다.
  terminology: ἔλεον은 ‘연민’으로 유지할 수 있으며, χαλεπώτερον은 ‘더 가혹하다’, νομίζομεν은 ‘여깁니다’가 적절합니다. παράνομος는 ‘율법을 어기는 방식으로’로 구체화하고, σωτηρία는 ‘살려 주다’로 옮깁니다.
