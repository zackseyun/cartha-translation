  text: 그들이 이런 말을 하자, 폭군은 그들을 불순종하는 자들로 여겨 격분하였을 뿐 아니라, 배은망덕한 자들로 여겨서도 분노하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
