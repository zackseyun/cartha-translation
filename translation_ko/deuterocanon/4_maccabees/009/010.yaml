  source_fidelity: 수정이 필요합니다. 초안은 ‘여길 뿐만 아니라’라는 구문으로 두 범주의 사람을 단순히 그렇게 간주했다는 뜻을 만들고, 원문의 두 분노 동사(ἐχαλέπαινεν, ὠργίσθη)를 하나의 ‘격분하였습니다’로 합쳐 버립니다. 원문은 폭군이 불순종하는 자들에 대하여 격분했을 뿐 아니라 배은망덕한 자들에 대하여도 분노했음을 말합니다.
  naturalness: ‘그들이 이런 말을 하자’와 ‘폭군’은 자연스럽고 현대 표준어 합쇼체에 적합합니다. 다만 ‘사람들이라고 여길 뿐만 아니라’는 뒤의 ‘격분하였습니다’와 결합할 때 통사적 연결과 의미가 부자연스럽습니다. 두 병렬된 분노를 명시하면 자연스러워집니다.
  terminology: τύραννος는 ‘폭군’이 적절합니다. ἀπειθούντων과 ἀχαρίστων은 문맥상 사람들을 가리키므로 ‘불순종하는 자들’, ‘배은망덕한 자들’로 옮길 수 있습니다. 각 표현의 남성 복수 형태를 사람 지칭으로 보충했다는 각주는 두 표현 모두를 대상으로 해야 하며, ἀχάριστος는 분사가 아니라 형용사이므로 ‘남성 복수 표현’이라고 하는 것이 정확합니다.
