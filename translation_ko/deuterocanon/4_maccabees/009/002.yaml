    text: 또는, ‘우리가 율법에 대한 순종을 조언과 분별로 삼지 않는다면, 우리는 마땅히 우리 조상들 앞에서 부끄러워할 것입니다.’
    reason: αἰσχυνόμεθα가 ‘수치를 입히다’가 아니라 ‘부끄러워하다’라는 뜻으로 해석될 가능성과, συμβούλῳ καὶ γνώσει의 기능적 번역을 반영합니다.
