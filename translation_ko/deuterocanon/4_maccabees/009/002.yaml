theological_decisions:
- issue: 조상들에게 수치를 끼친다는 진술의 방향성
  chosen_reading: 순종하지 않으면 조상들 앞에서 부끄럽다는 감정보다, 조상들의 유산 자체에 수치를 가져오는 책임 진술로 옮겼습니다.
  alternative_readings:
  - 조상들 앞에서 부끄러워하게 된다는 뜻으로 옮길 수 있습니다.
  rationale: 목적격 τοὺς προγόνους가 수치의 대상이 되는 점을 반영해, 단순 내적 감정보다 공동체적·윤리적 책임을 드러냈습니다.
  doctrine_reference: martyrial fidelity to ancestral law
- issue: συμβούλῳ의 인격화
  chosen_reading: ‘조언’으로만 줄이기보다, 행위를 이끄는 안내 기능을 살려 번역했습니다.
  alternative_readings:
  - ‘상담자’처럼 인격화할 수 있습니다.
