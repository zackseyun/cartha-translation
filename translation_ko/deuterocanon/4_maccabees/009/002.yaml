  text: 왜냐하면 우리가 율법에 대한 순종을 우리의 조언자와 판단으로 삼지 않는다면, 우리는 마땅히 우리 조상들에게 수치를 끼치게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
