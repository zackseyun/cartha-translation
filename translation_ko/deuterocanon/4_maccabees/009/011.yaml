translation:
  language: ko
  text: 그리하여 그들이 그렇게 하라는 명령을 받았을 때, 고문하는 자들이 그들 가운데 맏이를 앞으로 끌어내고, 그의 속옷을 찢어 열어젖힌 뒤 그의 손과 팔을 양쪽에서 끈으로 묶었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문의 ‘고문하는 자들’에 해당하는 희귀한 그리스어 형태는 문맥상 왕의 고문 집행자들을 가리키는 것으로 이해됩니다.
    reason: textual_variant
lexical_decisions:
- source_word: ὅθεν
  english_pob_choice: So
  chosen_korean: 그리하여
  alternatives_korean:
  - 그러므로
  - 그래서
  - 그러니
  lexicon: LSJ
  rationale: 앞선 서술에서 이어지는 결과·전개를 자연스럽게 잇되, 문어체의 흐름을 유지하기 위해 ‘그리하여’를 선택했습니다.
- source_word: τὸν πρεσβύτατον αὐτῶν
  english_pob_choice: the eldest of them
  chosen_korean: 그들 가운데 맏이
  alternatives_korean:
  - 그들 중 가장 나이 많은 사람
  - 그들의 장자
  - 그들 가운데 가장 늙은 자
  lexicon: LSJ
  rationale: πρεσβύτατος는 단순한 ‘연장자’보다 최상급의 ‘가장 나이 많은 이’를 뜻하므로, 집단 내부의 맏이/최연장자를 드러내는 표현으로 옮겼습니다.
- source_word: χιτῶνα
  english_pob_choice: tunic
  chosen_korean: 속옷
  alternatives_korean:
  - 속적삼
  - 저고리
  - 긴 옷
  lexicon: LSJ
  rationale: χιτών은 겉옷보다 안쪽에 입는 옷으로, 한국어에서는 당시의 의복 구분을 완전히 재현하기보다 기능적으로 ‘속옷’이라 옮기는 것이 가장 직접적입니다.
- source_word: ἱμᾶσιν
  english_pob_choice: with straps
  chosen_korean: 끈으로
  alternatives_korean:
  - 가죽끈으로
  - 끈들로
  - 띠로
  lexicon: LSJ
  rationale: ἱμάς는 묶는 끈·가죽끈의 의미가 있어, 본문의 ‘묶다’와 결합할 때 가장 간결하고 자연스러운 한국어는 ‘끈으로’입니다.
