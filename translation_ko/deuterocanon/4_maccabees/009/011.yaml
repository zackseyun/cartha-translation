    issue: χιτών을 ‘속옷’으로 번역함
    rationale: χιτών은 몸에 가까이 입는 튜닉/옷이지만, 현대 한국어 ‘속옷’은 대체로 내의를 뜻하여 시대적 의복을 부정확하게 특정할 수 있습니다.
  - severity: low
    issue: παρήγαγον을 ‘앞으로 끌어내고’로 번역함
    rationale: 이 동사는 사람을 앞으로 데려오거나 끌고 나아가게 한다는 뜻이며, 원문에는 강제로 질질 끈다는 뜻이 명시되지 않습니다.
  - severity: low
    issue: ‘찢어 열어젖힌’이 원문보다 구체적임
    rationale: διαρρήξαντες는 옷을 찢었다는 뜻입니다. ‘열어젖힌’은 가능한 결과이지만 별도로 명시되지 않았으므로 피하는 편이 좋습니다.
