- from: 그리하여 그들이 그렇게 하라는 명령을 받았을 때, 고문하는 자들이 그들 가운데 맏이를 앞으로 끌어내고, 그의 속옷을 찢어 열어젖힌 뒤 그의 손과 팔을 양쪽에서 끈으로 묶었습니다.[a]
  to: 그리하여 그들이 명령을 받자, 고문을 집행하는 자들이 그들 가운데 맏이를 앞으로 데려와 그의 옷을 찢은 뒤, 그의 손과 팔을 양쪽에서 가죽끈으로 묶었습니다.[a]
  rationale: 고대 의복 명칭 χιτών을 현대적 내의로 오해할 수 있는 ‘속옷’ 대신 포괄적인 ‘옷’으로 옮겼습니다. 또한 ‘앞으로 데려와’와 ‘옷을 찢은 뒤’를 사용하여 원문의 동작을 과도하게 구체화하지 않고 자연스러운 현대 한국어로 표현했습니다. 결박 도구는 ἱμᾶσιν의 통상적 의미를 반영하여 ‘가죽끈’으로 명시했습니다.
