review_pass:
  verdict: revise
  source_fidelity: 전반적인 문장 구조와 행위의 순서는 그리스어 본문에 충실합니다. 다만 χιτών을 ‘속옷’으로 옮기면 현대 한국어에서 내의라는 의미가 강해 고대의 일반적인 몸에 붙는 옷을 지나치게 특정할 수 있습니다. 또한 παρήγαγον은 ‘끌어내다’보다 ‘앞으로 데려오다’가 더 직접적입니다.
  naturalness: 합쇼체 문체는 일관되지만, ‘속옷을 찢어 열어젖힌’은 현대 한국어에서 다소 불필요하게 구체적이고 어색합니다. ‘옷을 찢은 뒤’가 자연스럽고 원문의 범위에도 맞습니다.
  terminology: ‘맏이’는 πρεσβύτατον의 최상급 및 문맥상 형제들 가운데 가장 나이 많은 이를 적절히 반영합니다. ἱμᾶσιν의 ‘끈’도 가능하나, 결박 도구라는 뜻을 더 분명히 하는 ‘가죽끈’이 적절합니다. 희귀한 행위자 명사에 관한 각주는 유지하는 것이 좋습니다.
  issues:
