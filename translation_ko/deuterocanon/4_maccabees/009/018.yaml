lexical_decisions:
- source_word: διὰ πασῶν ... τῶν βασάνων
  english_pob_choice: through all the tortures
  chosen_korean: 모든 고문을 통해
  alternatives_korean:
  - 온갖 고문을 거쳐
  - 모든 고문 속에서
  lexicon: BDAG
  rationale: διὰ + 속격은 수단·경유의 뜻을 가지므로 ‘~을 통해’가 가장 직접적입니다. βάσανοι는 단수적 추상보다 복수의 고문 행위를 가리키므로 ‘모든 고문’으로 옮겼습니다.
- source_word: πείσω
  english_pob_choice: I will convince
  chosen_korean: 나는 너희에게 … 확신시키겠습니다
  alternatives_korean:
  - 나는 너희를 설득하겠습니다
  - 나는 너희에게 … 납득시키겠습니다
  lexicon: BDAG
  rationale: 미래형 πείσω는 단순한 설득보다 결과를 통해 확신하게 한다는 뉘앙스가 강하므로, 고문을 견뎌 내는 증언의 맥락에 맞게 ‘확신시키겠습니다’로 옮겼습니다.
- source_word: οἱ παῖδες Ἑβραίων
  english_pob_choice: the sons of the Hebrews
  chosen_korean: 히브리인들의 아들들
  alternatives_korean:
  - 히브리인들의 젊은이들
  - 히브리인들의 자녀들
  lexicon: BDAG
  rationale: παῖδες는 문맥에 따라 자녀·젊은이·종이 될 수 있으나, 여기서는 순교하는 형제들을 가리키므로 남성 복수성을 살린 ‘아들들’이 가장 적절합니다.
