    reason: lexical_alternative
  - marker: b
    text: 남아 있는 그리스어 문구는 단독으로는 통사적으로 미완전해 보이며, 다음 절로 이어질 가능성이 있습니다. 이 번역은 보존된 문구만 반영하며 명시되지 않은 내용을 보충하지 않습니다.
    reason: textual_variant
lexical_decisions:
- source_word: διὰ πασῶν ... τῶν βασάνων
  english_pob_choice: through all the tortures
  chosen_korean: 모든 고문을 통해
  alternatives_korean:
