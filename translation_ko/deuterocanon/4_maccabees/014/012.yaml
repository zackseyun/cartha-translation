lexical_decisions:
- source_word: μήτηρ
  english_pob_choice: mother
  chosen_korean: 어머니
  alternatives_korean:
  - 엄마
  lexicon: LSJ
  rationale: 문맥의 비극성과 수사적 격조를 살리기 위해 일상적 호칭보다 격식 있는 ‘어머니’가 적절합니다.
- source_word: τῶν ἐπτὰ νεανίσκων
  english_pob_choice: of the seven young men
  chosen_korean: 일곱 청년의
  alternatives_korean:
  - 일곱 젊은이의
  - 일곱 아들의
  lexicon: LSJ
  rationale: νεανίσκοι는 성인 남성에 가까운 ‘청년들’의 뉘앙스를 가지므로 이를 살렸고, ‘아들들’은 τέκνων에서 드러나는 뒤의 친족 관계를 앞당겨 해석하게 하므로 피했습니다.
- source_word: ὑπήνεγκεν
  english_pob_choice: endured
  chosen_korean: 견뎌 내셨습니다
  alternatives_korean:
  - 견디셨습니다
  - 감내하셨습니다
  lexicon: LSJ
  rationale: 고난 아래에서 수동적으로 버티는 뉘앙스를 현대 한국어로 자연스럽게 옮기기 위해 ‘견뎌 내다’를 택했습니다.
- source_word: τὰς ἐφʼ ἑνὶ ἑκάστῳ τῶν τέκνων στρέβλας
  english_pob_choice: the tortures of each one of her children
  chosen_korean: 자기 자녀들 각각에게 가해진 고문
  alternatives_korean:
  - 자녀들 각각의 고문
  - 각 자녀에게 가해진 고문
  lexicon: LSJ
  rationale: στρέβλας의 의미를 포괄적으로 ‘고문’으로 옮기되, ἐφʼ ἑνὶ ἑκάστῳ의 분배적 의미를 ‘각각에게’로 드러냈습니다. τέκνα는 여기서 혈연관계를 살려 ‘자녀들’로 옮겼습니다.
theological_decisions:
- issue: 문장의 수사적 초점이 아들의 순교보다 어머니의 고난 감내에 있음
  chosen_reading: 어머니가 각 자녀에게 미친 고문을 끝까지 견뎌 낸 것으로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 순교자 어머니로 해석해 의역하기
  - ‘고문당하는 장면’을 더 서사적으로 풀어쓰기
  rationale: 본문의 문법은 어머니를 주어로 세우고, 분배된 고문을 견뎠음을 말하므로 이 초점을 흐리지 않도록 했습니다.
  doctrine_reference: 순교 서사의 수사 구조
