base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/024.yaml
  text: How can I describe the affection of parents for their children—the fervor that stamps into the small form of a child the marvelous likeness of soul and appearance[a], This is especially so because fathers make mothers more sympathetic toward those who have been born?
  footnotes:
  - marker: a
    text: Or 'parents’ love for their children—the ardor that impresses in a child the wonderful likeness of soul and form.' The Greek is rhetorically dense and includes rare imagery built on sealing or stamping.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 부모가 자녀를 사랑하는 정을 어떻게 설명하겠습니까—그 열정이 어린아이의 작은 형상에 혼과 모습의 놀라운 닮음을 찍어 넣습니다. 특히 아버지들이 낳은 자들에 대해 어머니를 더욱 동정심 있게 만들기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘찍어 넣습니다’는 봉인·압인 이미지를 살린 번역입니다. 직역하면 ‘봉인하여 각인하다/찍어 누르다’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα τρόπον
  english_pob_choice: How can I
  chosen_korean: 나는 ... 어떻게 설명하겠습니까
  alternatives_korean:
  - 어떤 방식으로 제가 설명하겠습니까
  - 어떻게 말하겠습니까
  lexicon: LSJ
  rationale: 수사적 질문의 어조를 살리면서도 현대 한국어에서 자연스럽게 읽히는 방식으로 옮겼습니다.
- source_word: ἠθολογήσῃμι
  english_pob_choice: describe
  chosen_korean: 설명하겠습니까
  alternatives_korean:
  - 묘사하겠습니까
  - 그려내겠습니까
  - 표현하겠습니까
  lexicon: LSJ
  rationale: 희귀 동사의 성격·품성 중심의 묘사 뉘앙스를 과장하지 않으면서, 문맥상 말로 풀어내는 행위를 가장 분명하게 드러내는 표현을 택했습니다.
- source_word: φιλοτέκνα γονέων αἴθη
  english_pob_choice: the affection of parents for their children—the fervor
  chosen_korean: 부모가 자녀를 사랑하는 정 — 그 열정
  alternatives_korean:
  - 부모의 자녀 사랑 — 그 뜨거움
  - 부모의 자녀에 대한 애정 — 그 열기
  lexicon: LSJ
  rationale: φιλοτέκνα의 자녀 사랑과 αἴθη의 뜨거운 정서를 함께 살리기 위해 ‘정’과 ‘열정’을 병치했습니다.
- source_word: ψυχῆς τε καὶ μορφῆς ὁμοιότητα
  english_pob_choice: the marvelous likeness of soul and appearance
  chosen_korean: 혼과 모습의 놀라운 닮음
  alternatives_korean:
  - 영혼과 형체의 놀라운 닮음
  - 혼과 형상의 놀라운 닮음
  lexicon: LSJ
  rationale: ψυχή는 여기서 내면의 생명/인격, μορφή는 외적 형상을 가리키므로, ‘혼’과 ‘모습’으로 대조를 살렸습니다.
- source_word: ἐναποσφραγίζοντα
  english_pob_choice: stamps into
  chosen_korean: 찍어 넣습니다
  alternatives_korean:
  - 새겨 넣습니다
  - 도장처럼 찍어 넣습니다
  - 인장하듯 새깁니다
  lexicon: LSJ
  rationale: 봉인·도장 찍기 이미지를 현대 한국어에서 너무 생경하지 않게 전달하면서, ‘찍어’와 ‘넣다’로 각인/압인 비유를 살렸습니다.
- source_word: εἰς μικρὸν παιδοχαρακτῆρα
  english_pob_choice: the small form of a child
  chosen_korean: 어린아이의 작은 형상
  alternatives_korean:
  - 아이의 작은 인상
  - 어린아이의 작은 자국
  lexicon: LSJ
  rationale: παιδοχαρακτήρ의 형상·인상 이미지를 자연스럽게 풀어, 독자가 문장의 비유를 따라가도록 했습니다.
- source_word: τοῖς γεννηθεῖσιν
  english_pob_choice: those who have been born
  chosen_korean: 낳은 자들
  alternatives_korean:
  - 태어난 자들
  - 태어난 아이들
  - 자녀들에게
  lexicon: LSJ
  rationale: 문맥상 아버지와 어머니가 낳은 자녀를 가리키므로, 관계를 직접 드러내는 ‘낳은 자들’로 옮겼습니다.
theological_decisions:
- issue: 부모-자녀 정서의 강도와 수사적 과장
  chosen_reading: 문장의 수사적 밀도를 그대로 살려, 단순한 감정보다 강한 ‘열정’과 ‘찍어 넣다’의 이미지를 유지했습니다.
  alternative_readings:
  - 부드럽게 완화해 ‘애정’과 ‘새겨 넣다’로 처리할 수 있음
  - 비유를 줄여 평서적으로 표현할 수 있음
  rationale: 본문은 부모의 사랑을 도장/봉인 이미지로 과장되게 묘사하므로, 이를 순화하지 않고 그대로 드러내는 것이 원문 효과에 충실합니다.
  doctrine_reference: 문학적 수사에 대한 직역 원칙
- issue: μᾶλλον/μάλιστα 뒤의 설명 절
  chosen_reading: ‘특히 아버지들이 낳은 자들에 대해 어머니를 더욱 동정심 있게 만들기 때문입니다’로 원인 관계를 분명히 했습니다.
  alternative_readings:
  - ‘무엇보다도’로 시작하는 방식
  - ‘아버지들이 자녀를 낳았기 때문에’로 단순화하는 방식
  rationale: 뒤의 διὰ τὸ ... καθιστᾶναι는 이유를 제시하므로, 현대 한국어에서 자연스러운 ‘기 때문입니다’로 처리하되 인과를 약화하지 않았습니다.
  doctrine_reference: 문장 논리 및 인과 접속의 보존
