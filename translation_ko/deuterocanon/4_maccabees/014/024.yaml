- from: 나는 부모가 자녀를 사랑하는 정을 어떻게 설명하겠습니까—그 열정이 어린아이의 작은 형상에 혼과 모습의 놀라운 닮음을 찍어 넣습니다. 특히 아버지들이 낳은 자들에 대해 어머니를 더욱 동정심 있게 만들기 때문입니다.[a]
  to: 부모가 자녀를 사랑하는 뜨거운 정, 곧 영혼과 모습의 놀라운 닮음을 어린아이의 작은 형상에 인장처럼 찍어 넣는 그 열정을 제가 어떻게 묘사할 수 있겠습니까?[a] 이는 특히 아버지들이 태어난 이들에 대하여 어머니들을 더 동정 깊게 하기 때문입니다.
  rationale: 원문의 수사적 질문, 부모의 뜨거운 사랑, 아이 안에 내적·외적 닮음을 압인한다는 비유를 유지했습니다. 동시에 τοῖς γεννηθεῖσιν을 ‘태어난 이들’로 바로잡고, 어머니들이 그들에게 더 동정 깊게 된다는 마지막 인과절을 자연스러운 현대 한국어 합쇼체로 다듬었습니다.
