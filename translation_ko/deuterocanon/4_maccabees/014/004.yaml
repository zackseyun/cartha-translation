  yaml_path: translation/deuterocanon/4_maccabees/014/004.yaml
  text: None of the seven young men became cowardly[a], nor did they shrink back from death;
  footnotes:
  - marker: a
    text: Greek has a singular verb in the second clause, literally, 'nor did he shrink back from death,' expressing the idea that not one of them recoiled.
    reason: lexical_alternative
translation:
  language: ko
  text: 일곱 젊은이 가운데 아무도 비겁해지지 않았고, 죽음 앞에서 물러서지도 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 둘째 절에 단수 동사를 사용해, 문자적으로는 ‘그가 죽음 앞에서 물러서지 않았다’에 가깝습니다. 이는 일곱 사람 가운데 한 사람도 물러서지 않았다는 분배적 의미를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς ἐκ τῶν ἑπτὰ μειρακίων
  english_pob_choice: None of the seven young men
  chosen_korean: 일곱 젊은이 가운데 아무도
  alternatives_korean:
  - 일곱 청년들 중 아무도
  - 일곱 젊은이 중 누구도
  lexicon: LSJ
  rationale: οὐδεὶς와 ἐκ + partitive 구문을 자연스러운 한국어로 옮기되, μειράκιον의 남성적 청년 뉘앙스를 살려 ‘젊은이’로 렌더링했습니다.
- source_word: ἐδειλίασεν
  english_pob_choice: became cowardly
  chosen_korean: 비겁해지지 않았고
  alternatives_korean:
  - 겁내지 않았고
  - 두려워하지 않았고
  - 용기를 잃지 않았고
  lexicon: LSJ
  rationale: δείλιαω의 도덕적·성품적 함의가 있어 단순한 ‘두려움’보다 ‘비겁해지다’가 원문의 질감을 더 잘 드러냅니다.
- source_word: πρὸς τὸν θάνατον ὤκνησεν
  english_pob_choice: nor did they shrink back from death
  chosen_korean: 죽음 앞에서 물러서지도 않았습니다
  alternatives_korean:
  - 죽음을 앞두고 주춤하지도 않았습니다
  - 죽음에서 물러서지도 않았습니다
  - 죽음 앞에서 주저하지도 않았습니다
  lexicon: LSJ
  rationale: ὀκνέω는 주저함·물러섬·뒤로 물러남의 의미가 있어, 한국어에서는 ‘죽음 앞에서 물러서다’가 결연한 대비를 가장 분명히 전달합니다.
theological_decisions:
- issue: 첫 절의 부정과 둘째 절의 동의적 병행
  chosen_reading: 두 절을 모두 부정형으로 유지하여, 일곱 사람 가운데 아무도 두려움이나 후퇴를 보이지 않았다는 집단적 증언을 분명히 했습니다.
  alternative_readings:
  - 둘째 절을 ‘아무도 죽음 앞에서 주춤하지도 않았습니다’로 완화해 표현
  - 둘째 절을 단순히 ‘죽음을 두려워하지 않았습니다’로 옮김
  rationale: 그리스어는 ‘아무도’라는 집단 부정을 반복하며, δεύτερος 절의 ὤκνησεν도 단순 감정이 아니라 죽음 앞의 후퇴를 말하므로 이를 약화시키지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 5
