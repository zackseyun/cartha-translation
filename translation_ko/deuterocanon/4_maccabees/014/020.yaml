  - 소년들의 어머니
  lexicon: LSJ
  rationale: νεανίαι는 ‘청년들/젊은이들’에 해당하므로, 현대 한국어에서 가장 분명한 ‘청년들’을 택했습니다.
- source_word: ὁμόψυχον
  english_pob_choice: of one spirit with
  chosen_korean: 한마음이었던
  alternatives_korean:
  - 한 영을 지닌
  - 같은 마음을 품은
  - 한 뜻이었던
  lexicon: LSJ
  rationale: 직역인 ‘한 영을 지닌’도 가능하지만, 여기서는 아브라함과의 내적 연대와 성향의 일치를 자연스럽게 드러내는 ‘한마음이었던’을 선택했습니다.
theological_decisions:
- issue: 아브라함과의 관계 표지
  chosen_reading: 이 문장은 혈통 자체보다 아브라함과 같은 신실한 내적 태도를 강조하는 것으로 옮겼습니다.
  alternative_readings:
  - 아브라함과 닮은 어머니
  - 아브라함의 후손인 어머니
  rationale: ὁμόψυχον과 속격의 결합은 단순한 계보 표지가 아니라 ‘같은 영/마음’의 공유를 뜻하므로, 본문이 칭찬하는 신앙적 연대를 살리는 번역이 필요합니다.
  doctrine_reference: 원문 우선 원칙; 계보보다 신앙적 동일시를 드러내는 해석을 보존합니다.
