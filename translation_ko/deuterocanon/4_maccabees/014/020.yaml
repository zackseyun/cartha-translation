  - 연민
  lexicon: LSJ
  rationale: 문맥이 ‘자녀들’과 ‘어머니’의 관계를 전제하므로, 모성적 정서를 드러내되 과도한 심리해석을 피하는 표현으로 옮겼습니다.
- source_word: τῶν νεανιῶν μητέρα
  english_pob_choice: the mother of the young men
  chosen_korean: 청년들의 어머니
  alternatives_korean:
