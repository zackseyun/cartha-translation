lexical_decisions:
- source_word: μετεκίνησεν
  english_pob_choice: did not move
  chosen_korean: 흔들리지 않았습니다
  alternatives_korean:
  - 움직이지 않았습니다
  - 동요하지 않았습니다
  - 변하지 않았습니다
  lexicon: LSJ
  rationale: 맥락상 물리적 이동보다 마음이 설득이나 감정에 의해 좌우되지 않는다는 뜻이므로, 한국어로는 ‘흔들리지 않다’가 가장 자연스럽고 원문의 비유도 보존합니다.
