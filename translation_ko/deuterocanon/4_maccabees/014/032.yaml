base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/032.yaml
  text: O sacred nature[a], and parents’ affections, and filial love toward parents, and nurture[b], and mothers’ unconquerable passions.
  footnotes:
  - marker: a
    text: Or 'the endearments of parents'; the Greek φίλτρα can literally denote love-charms, but here refers more naturally to affectionate bonds.
    reason: lexical_alternative
  - marker: b
    text: Or 'mothers’ indomitable emotions' or, less likely in context, 'mothers’ unconquerable sufferings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 오, 거룩한 본성아, 부모의 애정과 부모를 향한 자녀의 사랑아, 양육과 어머니들의 정복될 수 없는 정념이여.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '부모의 애정 어린 유대'로도 옮길 수 있습니다. 그리스어 φίλτρα는 문자적으로 '사랑의 주술'을 뜻할 수 있으나, 여기서는 더 자연스럽게 애정의 결속을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '어머니들의 정복될 수 없는 감정'이나, 문맥상 덜 가능하지만 '어머니들의 정복될 수 없는 고통'으로도 볼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: φύσις ἱερά
  english_pob_choice: sacred nature
  chosen_korean: 거룩한 본성
  alternatives_korean:
  - 거룩한 자연
  - 신성한 본성
  - 거룩한 자연 질서
  lexicon: LSJ
  rationale: φύσις는 여기서 단순한 '자연'보다 인간의 본성과 가족적 본능을 포괄하는 말로 보이며, ἱερά는 그 성격을 높여 주므로 '거룩한 본성'이 가장 직접적입니다.
- source_word: φίλτρα γονέων
  english_pob_choice: parents’ affections
  chosen_korean: 부모의 애정
  alternatives_korean:
  - 부모의 사랑
  - 부모의 애틋함
  - 부모의 애정 어린 마음
  lexicon: LSJ
  rationale: φίλτρα는 문자적으로는 '애정/정애'를 뜻하므로, 한국어에서는 지나치게 문학적인 '사랑의 주술'이 아니라 관계적 애착을 드러내는 '애정'이 자연스럽습니다.
- source_word: γονεύσιν φιλοστόργε
  english_pob_choice: filial love toward parents
  chosen_korean: 부모를 향한 자녀의 사랑
  alternatives_korean:
  - 부모를 향한 효성
  - 부모에 대한 자녀의 애정
  - 부모를 향한 효애
  lexicon: LSJ
  rationale: φιλοστόργος 계열은 혈연적이고 따뜻한 친애를 가리키므로, 현대 한국어에서 의미를 분명히 하는 '부모를 향한 자녀의 사랑'으로 옮겼습니다.
- source_word: τροφεῖα
  english_pob_choice: nurture
  chosen_korean: 양육
  alternatives_korean:
  - 기름
  - 보살핌
  - 키움
  lexicon: LSJ
  rationale: τροφεῖα는 먹이고 길러 내는 행위를 가리키므로, 간결하면서도 양육의 의미를 모두 담는 '양육'이 적절합니다.
- source_word: μητέρων ἀδάμαστα πάθη
  english_pob_choice: mothers’ unconquerable passions
  chosen_korean: 어머니들의 정복될 수 없는 정념
  alternatives_korean:
  - 어머니들의 굴복하지 않는 감정
  - 어머니들의 꺾일 수 없는 애정
  - 어머니들의 정복될 수 없는 감정
  lexicon: LSJ
  rationale: πάθη는 여기서 단순한 '고통'보다 강렬한 정서적 동요를 가리키므로 '정념'을 유지했고, ἀδάμαστα는 수동적 의미를 살려 '정복될 수 없는'으로 옮겼습니다.
theological_decisions:
- issue: πάθη의 의미를 '고통'이 아니라 '정념/정서'로 읽을지 여부
  chosen_reading: 이 구절은 어머니들의 감정적·애정적 힘을 열거하는 수사로 보고 '정념'을 택했습니다.
  alternative_readings:
  - 어머니들의 정복될 수 없는 고통
  - 어머니들의 꺾일 수 없는 괴로움
  rationale: 문맥상 열거는 가족적 유대의 힘을 강조하며, πάθη를 '고통'으로만 좁히면 수사의 정서적 범위가 약화됩니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
