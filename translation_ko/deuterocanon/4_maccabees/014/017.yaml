translation:
  language: ko
  text: 그러나 그들이 그것을 막을 수 없더라도, 그들 주위를 사방으로 날아다니며[a], 타고난 애정으로 괴로워하고, 자기 목소리로 그들을 부르면서, 할 수 있는 모든 방법으로 자녀들을 도울 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 새의 이미지를 사용합니다. 어미 새가 새끼 주위를 날아다니며 울어 부르는 모습을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: κωλύειν
  english_pob_choice: prevent
  chosen_korean: 막다
  alternatives_korean:
  - 저지하다
  - 방해하다
  lexicon: LSJ
  rationale: κωλύειν은 다가오는 일을 막거나 못 하게 하는 뜻이므로, 문맥상 자연스러운 ‘막다’로 옮겨 조건절의 긴박함을 살렸습니다.
- source_word: περιιπτάμενα κυκλόθεν αὐτῶν
  english_pob_choice: flying around them on every side
  chosen_korean: 사방으로 그들 곁을 날아다니며
  alternatives_korean:
  - 그들 주위를 사방으로 날며
  - 사방에서 그들을 에워싸며 날아다니며
  lexicon: LSJ
  rationale: 날개 달린 존재가 젊은 새 주변을 맴도는 이미지가 분명하므로, ‘날아다니며’와 ‘사방으로’로 둘 다 살려 시각적 긴박감을 유지했습니다.
- source_word: ἀλγοῦντα τῇ στοργῇ
  english_pob_choice: grieving in their affection
  chosen_korean: 자기 애정 때문에 아파하고
  alternatives_korean:
  - 자연스러운 애정 때문에 아파하고
  - 가족애로 괴로워하며
  lexicon: LSJ
  rationale: στοργή는 혈연적·가족적 애정을 가리키지만, 여기서는 그 의미를 넓게 살려 과도한 해석 없이 ‘애정’으로 두고 ἀλγοῦντα의 고통을 ‘아파하고’로 반영했습니다.
- source_word: ἀνακαλούμενα τῇ ἰδίᾳ φωνῇ
  english_pob_choice: calling to them in their own voice
  chosen_korean: 자기 목소리로 그들을 부르며
  alternatives_korean:
  - 자기 소리로 그들을 불러들이며
  - 자기 울음소리로 그들을 부르며
  lexicon: LSJ
  rationale: ἀνακαλούμενα는 불러서 호소하거나 불러들이는 뜻이므로, 과장 없이 ‘부르며’로 처리하고 ‘자기 목소리’로 친밀한 호출의 뉘앙스를 유지했습니다.
- source_word: καθʼ ὃν δύναται τρόπον βοηθεῖ τοῖς τέκνοις
  english_pob_choice: help their children in whatever way they could
  chosen_korean: 할 수 있는 방법으로는 무엇이든 자녀들을 도와줄 것입니다
  alternatives_korean:
  - 어떤 방식으로든 자녀들을 도와줄 것입니다
  - 할 수 있는 대로 자녀들을 도울 것입니다
  lexicon: LSJ
  rationale: 관용구는 능력 범위 안에서 최선을 다한다는 뜻이므로, ‘할 수 있는 방법으로는 무엇이든’으로 제한된 능력과 적극성을 함께 드러냈습니다.
theological_decisions:
- issue: 본절의 조류적 비유를 한국어에서 얼마나 직접 유지할지
  chosen_reading: ‘날아다니며’와 ‘자기 목소리’로 비유를 직접 유지했습니다.
  alternative_readings:
  - 비유를 완화해 ‘둘러싸며’ 정도로 옮김
  - 모성적 정서만 남기고 조류 이미지는 약화함
  rationale: 그리스어 참여구는 보호하려는 어미 새의 움직임을 강하게 암시하므로, 이를 완화하지 않고 살려 본문의 수사적 힘을 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 6
