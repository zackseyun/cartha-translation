  rationale: ἑβδομάδα는 시간 단위 ‘주’가 아니라 일곱 사람의 집합을 가리키므로, 문맥에 맞게 ‘일곱 사람’으로 풀어 주었습니다.
- source_word: χορεύοντες
  english_pob_choice: dancing in a circle
  chosen_korean: 돌며 춤추면서
