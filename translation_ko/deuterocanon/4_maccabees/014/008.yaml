  - 그렇게
  lexicon: BDAG
  rationale: 앞선 묘사의 방식과 결과를 이어 주는 말이므로, 한국어에서는 간결한 연결부사 ‘이렇게’가 가장 자연스럽습니다.
- source_word: περὶ τὴν ἑβδομάδα
