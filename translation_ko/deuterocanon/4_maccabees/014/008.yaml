  lexicon: LSJ
  rationale: 원형적 춤과 회전 동작을 함께 살리되, 한국어에서 과도하게 낯설지 않도록 ‘돌며 춤추면서’로 옮겼습니다.
- source_word: ἐκύκλουν
  english_pob_choice: encircled them
  chosen_korean: 주위를 돌며
