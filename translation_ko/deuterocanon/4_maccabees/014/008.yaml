  lexicon: LSJ
  rationale: 미완료시제가 반복적·지속적 동작을 나타내므로, 단순히 ‘에워쌌습니다’보다 동작성을 살린 표현을 택했습니다.
- source_word: τὸν βασάνων φόβον
  english_pob_choice: the fear of tortures
