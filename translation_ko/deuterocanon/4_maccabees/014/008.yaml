  text: Thus the young men[a], dancing around the seven, encircled them, abolishing the fear of tortures.
  footnotes:
  - marker: a
    text: Greek ἑβδομάδα literally means 'a group of seven' or 'hebdomad'; here it refers to the seven brothers, not to a week.
    reason: lexical_alternative
translation:
  language: ko
  text: 이렇게 젊은이들은 일곱 형제[a] 주위를 춤추며 둘러 돌면서, 고문에 대한 두려움을 없앴습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 ἑβδομάδα는 문자적으로 ‘일곱의 집합’ 또는 ‘헤브도마드’를 뜻하며, 여기서는 ‘주간’이 아니라 일곱 형제를 가리킵니다.
    reason: lexical_alternative
