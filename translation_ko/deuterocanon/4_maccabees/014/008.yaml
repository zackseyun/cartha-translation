  - 폐기했습니다
  - 무력화했습니다
  lexicon: BDAG
  rationale: 두려움을 단순히 약화시키는 것이 아니라 완전히 사라지게 하는 효과를 나타내므로, 종결감을 가진 ‘없애 버렸습니다’가 맞습니다.
theological_decisions:
- issue: ἑβδομάδα의 의미
  chosen_reading: ‘주간’이 아니라 일곱 형제의 집합체를 가리키는 말로 이해했습니다.
  alternative_readings:
  - 일주일
  - 칠중의 무리
  rationale: 순교 서사 문맥에서 시간 단위 ‘주간’은 문맥에 맞지 않으며, POB의 영어 주석처럼 일곱 형제를 집합적으로 가리키는 것으로 읽는 것이 타당합니다.
  doctrine_reference: 원어 우선 번역 원칙; 문맥이 지시하는 표면 의미 보존
