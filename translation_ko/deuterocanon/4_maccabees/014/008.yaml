  text: Thus the young men[a], dancing around the seven, encircled them, abolishing the fear of tortures.
  footnotes:
  - marker: a
    text: Greek ἑβδομάδα literally means 'a group of seven' or 'hebdomad'; here it refers to the seven brothers, not to a week.
    reason: lexical_alternative
translation:
  language: ko
  text: 이렇게 젊은이들은 일곱 사람 주위를 돌며 춤추면서, 고문에 대한 두려움을 없애 버렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 ἑβδομάδα는 문자적으로는 ‘일곱의 집합’ 또는 ‘헤브도마드’를 뜻하며, 여기서는 ‘주간’이 아니라 일곱 형제들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  english_pob_choice: Thus
  chosen_korean: 이렇게
  alternatives_korean:
