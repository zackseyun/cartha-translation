    issue: 역접 표현의 중복
    rationale: ‘그러나 그럼에도 불구하고’는 ἀλλʼ ὅμως의 강조를 한국어에서 중복하여 문장을 무겁게 만듭니다.
  - severity: medium
    issue: ἐπʼ οὐδενὸς αὐτῶν의 지시 범위가 한국어에서 부자연스럽게 한정됨
    rationale: ‘그중 어느 하나로도’는 무엇을 가리키는지 불분명합니다. 그리스어의 지시 범위에도 논의의 여지가 있으므로 ‘그 어느 경우에도’로 보존적으로 옮겼습니다.
  - severity: low
    issue: 각주 a의 앵커 및 어휘 설명
    rationale: 각주 a는 ‘자녀 사랑’에 바로 붙어야 하며, φιλοτεκνία의 대안으로 ‘자애’를 제시하는 것은 지나치게 넓고 부정확합니다.
