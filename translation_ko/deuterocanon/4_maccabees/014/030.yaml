  yaml_path: translation/deuterocanon/4_maccabees/014/030.yaml
  text: But even so[a], although so many impulses of motherly love were drawing the mother toward sympathy[b], the all-varied tortures were not able by any one of them to turn aside her reason.
  footnotes:
  - marker: a
    text: Or 'so many impulses of maternal affection.' The Greek phrase refers to the powerful pull of a mother's love for her children.
    reason: lexical_alternative
  - marker: b
    text: '''Her reason'' could also be rendered ''her resolve'' or ''her rational judgment.'' The book regularly uses this term for reason''s rule over emotion.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그럼에도 자녀 사랑과 관련된 수많은 요인이 어머니를 동정심으로 끌어당기고 있었지만,[a] 온갖 고문도 그 어느 경우에도 그녀의 이성을[b] 꺾을 수 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자녀 사랑’은 헬라어 φιλοτεκνία를 옮긴 말로, ‘자녀에 대한 애정’ 또는 ‘자녀를 사랑함’으로도 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이성’은 여기서 ‘판단’이나 ‘결심’으로도 옮길 수 있지만, 4 마카베오서에서 반복되는 λογισμός의 철학적 용례를 따라 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλʼ ὅμως
  english_pob_choice: But even so
  chosen_korean: 그러나 그럼에도 불구하고
  alternatives_korean:
  - 그렇지만 여전히
  - 그럼에도
  lexicon: LSJ
  rationale: 강한 양보 뒤의 역접 전환을 자연스럽게 살리면서, 앞뒤 긴장을 분명히 드러내는 합쇼체 표현입니다.
- source_word: τοσούτων ὄντων τῶν περὶ φιλοτεκνίαν
  english_pob_choice: so many impulses of motherly love
  chosen_korean: 자녀들에 대한 사랑의 여러 충동
  alternatives_korean:
  - 어머니의 자녀 사랑에 대한 여러 끌림
  - 어머니의 자애에 관한 여러 감정
  lexicon: LSJ
  rationale: φιλοτεκνία는 자녀를 향한 사랑을 뜻하므로, 어머니의 감정이 자녀들을 향해 작용하는 여러 내적 충동이라는 점을 살려 옮겼습니다.
- source_word: ἐπʼ οὐδενὸς αὐτῶν
  english_pob_choice: by any one of them
  chosen_korean: 그중 어느 하나로도
  alternatives_korean:
  - 그 어떤 것에 의해서도
  - 그들 가운데 어느 하나로도
  lexicon: LSJ
  rationale: 여러 유인 요소들 각각을 가리키는 의미를 자연스럽게 반영해, 실패의 범위를 분명히 했습니다.
- source_word: τὸν λογισμὸν αὐτῆς
  english_pob_choice: her reason
  chosen_korean: 그녀의 이성
  alternatives_korean:
  - 그녀의 판단
  - 그녀의 결심
  lexicon: BDAG
  rationale: 4 마카베오서는 λογισμός를 감정에 대립하는 이성의 통제로 반복적으로 사용하므로, 문맥의 철학적 의미를 살려 '이성'으로 옮겼습니다.
- source_word: αἱ παντοίκιλοι βάσανοι
  english_pob_choice: the all-varied tortures
  chosen_korean: 그 모든 가지각색의 고문
  alternatives_korean:
  - 그 모든 다채로운 고통
  - 그 여러 가지의 고문
  lexicon: LSJ
  rationale: παντοίκιλοι의 ‘모든 종류의 다양함’을 살려 강한 수사성을 보존했고, βάσανοι는 단순한 시련보다 실제 고문에 가깝게 보아 옮겼습니다.
theological_decisions:
- issue: λoγισμός의 의미를 심리적 결단으로 약화할지 여부
  chosen_reading: 이성
  alternative_readings:
  - 결심
  - 판단
  rationale: 이 장은 감정과 이성의 대조를 강조하므로, λογισμός를 '이성'으로 번역해야 본문의 철학적 긴장이 유지됩니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 5
