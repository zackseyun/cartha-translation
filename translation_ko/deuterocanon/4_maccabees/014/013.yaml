  rationale: 직전 맥락의 어미를 고려하되, 단어 자체가 ‘자녀를 향한 애정’이라는 폭넓은 의미를 가지므로, ‘부모의 사랑’으로 좁히지 않고 그 범위를 살렸습니다.
- source_word: σπλάγχνων
  english_pob_choice: the sympathy of the inward parts
  chosen_korean: 내장의 공감
