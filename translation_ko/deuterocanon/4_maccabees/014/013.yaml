  text: 그러나 자녀를 향한 애정[a]이 얼마나 복잡한지 보십시오. 그것은 모든 것을 마음 깊은 곳에서 우러나는 공감으로 끌어당깁니다.
  philosophy: optimal-equivalence
  footnotes:
