theological_decisions:
- issue: φιλοτεκνίας의 범위를 어미의 사랑으로만 한정할지 여부
  chosen_reading: 본문의 어휘 범위에 맞추어 ‘자녀를 향한 애정’으로 넓게 옮기고, 특정 성별의 부모로 한정하지 않았습니다.
  alternative_readings:
