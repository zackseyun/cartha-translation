translation:
  language: ko
  text: 그러나 보십시오. 자녀를 향한 애정의 사랑이 얼마나 복잡한지, 모든 것을 내장의 공감으로 끌어당깁니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어머니의 사랑’입니다. 문맥은 일곱 형제의 어머니이지만, 그리스어 어휘 자체는 자녀를 향한 애정을 더 넓게 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖτε
  english_pob_choice: see
  chosen_korean: 보십시오
  alternatives_korean:
