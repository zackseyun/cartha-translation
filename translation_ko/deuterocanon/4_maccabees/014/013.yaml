revisions:
- from: 그러나 보십시오. 자녀를 향한 애정의 사랑이 얼마나 복잡한지, 모든 것을 내장의 공감으로 끌어당깁니다.[a]
  to: 그러나 자녀를 향한 애정[a]이 얼마나 복잡한지 보십시오. 그것은 모든 것을 마음 깊은 곳에서 우러나는 공감으로 끌어당깁니다.
  rationale: 원문의 권면형 θεωρεῖτε는 ‘보십시오’로, πολυπλόκος는 ‘복잡한’으로 유지했습니다. φιλοτεκνίας στοργή의 중복 번역을 ‘자녀를 향한 애정’으로 바로잡아 자연스러움과 어휘 범위를 함께 살렸습니다. ἕλκουσα를 독립 절로 처리하여 한국어 문장 구조를 명료하게 했습니다. σπλάγχνων συμπάθειαν은 ‘마음 깊은 곳에서 우러나는 공감’으로 옮겨, 원문의 내면적·신체적 정서 표상을 해부학적으로 난삽하게 만들지 않으면서 보존했습니다.
