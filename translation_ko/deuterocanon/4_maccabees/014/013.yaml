  lexicon: LSJ
  rationale: 직역하면 ‘내장/창자’의 영역이지만, 한국어 성경 문맥에서 지나치게 해부학적이지 않으면서도 원문의 신체적 관용을 보존하는 표현으로 처리했습니다.
theological_decisions:
- issue: φιλοτεκνίας의 범위를 어미의 사랑으로만 한정할지 여부
  chosen_reading: 본문의 어휘 범위에 맞추어 ‘자녀를 향한 애정’으로 넓게 옮기고, 특정 성별의 부모로 한정하지 않았습니다.
  alternative_readings:
  - 어머니의 사랑
  - 모성애
  - 부모의 사랑
  rationale: 영문 POB의 주석처럼 문맥상 어머니가 중심이지만, 그리스어 자체는 자녀를 향한 애정 일반을 가리키므로 lexical breadth를 유지하는 것이 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: σπλάγχνων συμπάθεια의 신체적-정서적 긴장
  chosen_reading: ‘내장의 공감’처럼 신체적 표상을 남겨 정서적 공감이 단순한 심리 상태가 아니라 깊은 내면에서 솟아나는 반응임을 드러냈습니다.
  alternative_readings:
  - 깊은 공감
  - 마음 깊은 동정
  - 속 깊은 동정
  rationale: 원문은 ‘내장/창자’의 관용을 사용해 정서를 표현하므로, 이를 완전히 추상화하면 원문의 힘이 약해집니다. 한국어에서도 낯설지만 이해 가능한 방식으로 긴장을 살렸습니다.
  doctrine_reference: Translation philosophy §1, §5
