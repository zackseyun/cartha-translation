  source_fidelity: 개정이 필요합니다. 현행문의 ‘애정의 사랑’은 φιλοτεκνίας στοργή의 의미를 중복적으로 처리하며, ‘내장의 공감’은 σπλάγχνων συμπάθειαν의 신체적 정서 관용을 한국어에서 부자연스럽고 의미 불명확하게 만듭니다. ‘모든 것을’은 중성 복수 πάντα의 포괄성을 유지합니다.
  naturalness: ‘그러나 보십시오’ 뒤에 완결된 내용을 두고, 뒤 절의 분사 ἕλκουσα를 ‘그것은 … 끌어당깁니다’로 풀어 주는 편이 현대 표준 한국어 합쇼체에서 자연스럽습니다. ‘마음 깊은 곳에서 우러나는 공감’은 원문의 깊은 내면/내장의 정서 표상을 자연스럽게 전달합니다.
  terminology: φιλοτεκνίας στοργή는 성별을 특정하지 않는 ‘자녀를 향한 애정’으로 옮깁니다. 문맥상 모성애라는 대안은 주석에서만 제시합니다. σπλάγχνων는 문자적 ‘내장’보다 한국어 관용에 맞는 ‘마음 깊은 곳’으로 처리하되, 깊은 내면에서 일어나는 공감이라는 원문의 정서적 힘을 보존합니다.
