- source_word: ποθεινοτέρα
  english_pob_choice: more longed for
  chosen_korean: 더 간절히 바라는
  alternatives_korean:
  - 더 그리워하는
  - 더 소원하는
  - 더 원하는
  lexicon: LSJ
  rationale: ποθέω 계열의 비교급이 지닌 ‘갈망/열망’의 정서를 살려, 비교의 강도를 드러내는 ‘더 간절히 바라는’으로 옮겼습니다.
theological_decisions:
- issue: εὐσέβεια의 종교적 강도
  chosen_reading: ‘경건’으로 번역해 하나님께 대한 헌신이 자녀에 대한 애착보다 우선한다는 점을 드러냈습니다.
  alternative_readings:
  - ‘경외’
  - ‘신앙심’
  rationale: 문맥은 단순한 도덕성이나 일반 종교심이 아니라 하나님께 대한 충성의 우선성을 칭송하므로, 축약되지 않은 ‘경건’이 가장 균형 잡힌 선택입니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 6
- issue: 정념과 이성의 대조
  chosen_reading: ‘이성’과 ‘정념’의 대조를 유지해, 원문의 철학적-윤리적 긴장을 약화시키지 않았습니다.
  alternative_readings:
  - ‘마음’과 ‘욕망’
  - ‘이해’와 ‘감정’
  rationale: 이 문장은 단순 감정 표현이 아니라 이성이 정념을 통치한다는 수사이므로, 원문의 구조를 보존하는 용어쌍이 필요합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 4
