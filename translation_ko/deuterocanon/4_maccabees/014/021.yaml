  yaml_path: translation/deuterocanon/4_maccabees/014/021.yaml
  text: O reason[b][a], tyrant over the passions of children! And godliness is to a mother more longed for than children.
  footnotes:
  - marker: a
    text: Or 'O reason, tyrant over the passions of the children'; the genitive 'of children' may be taken closely with 'passions,' though the sense remains that reason rules passions and that devotion to God outweighs even a mother's attachment to her children.
    reason: lexical_alternative
  - marker: b
    text: Or 'piety is more desirable to a mother than children.'
    reason: alternative_reading
translation:
  language: ko
  text: 오, 이성아, 자녀들을 향한 정념을 지배하는 폭군이여![a] 경건은 어머니가 자녀들보다 더 간절히 바라는 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오, 이성아, 자녀들의 정념을 지배하는 폭군이여’로도 옮길 수 있습니다. 속격 ‘자녀들의’는 ‘정념’과 밀접하게 연결될 수 있으며, 문맥상 자녀들에 관한 정념을 가리키는 것으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘경건은 어머니가 자녀들보다 더 바람직하게 여기는 것입니다’로도 옮길 수 있습니다.
    reason: alternative_reading
