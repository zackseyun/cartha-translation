base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/021.yaml
  text: O reason[b][a], tyrant over the passions of children! And godliness is to a mother more longed for than children.
  footnotes:
  - marker: a
    text: Or 'O reason, tyrant over the passions of the children'; the genitive 'of children' may be taken closely with 'passions,' though the sense remains that reason rules passions and that devotion to God outweighs even a mother's attachment to her children.
    reason: lexical_alternative
  - marker: b
    text: Or 'piety is more desirable to a mother than children.'
    reason: alternative_reading
translation:
  language: ko
  text: 오, 이성아, 자녀들의 정념을 지배하는 폭군이여! 그리고 경건은 어머니에게 자녀들보다 더 간절히 바라는 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오, 이성, 자녀의 정념을 지배하는 폭군이여’로도 옮길 수 있습니다. 속격 ‘자녀들의’는 ‘정념’과 더 밀접하게 연결될 수 있지만, 뜻은 여전히 이성이 정념을 다스린다는 점입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘경건은 어머니에게 자녀들보다 더 바람직합니다’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: λογισμέ
  english_pob_choice: reason
  chosen_korean: 이성
  alternatives_korean:
  - 이성적 판단
  - 사유
  lexicon: LSJ
  rationale: 4마카베오에서는 λογισμός가 정념을 다스리는 이성적 판단을 뜻하므로, vocative를 자연스럽고 간결하게 살려 ‘이성’으로 옮겼습니다.
- source_word: παθῶν
  english_pob_choice: passions
  chosen_korean: 정념
  alternatives_korean:
  - 욕망
  - 감정
  - 수난
  lexicon: LSJ
  rationale: 이 책에서 πάθη는 고통 일반보다 이성의 지배 아래 놓이는 내적 정념을 가리키므로, 철학적 뉘앙스를 살려 ‘정념’으로 번역했습니다.
- source_word: τύραννε
  english_pob_choice: tyrant over
  chosen_korean: 폭군이여
  alternatives_korean:
  - 지배자여
  - 전제자여
  - 군주여
  lexicon: LSJ
  rationale: 직접적인 지배와 강한 비유를 살리기 위해 ‘폭군이여’로 옮겼습니다. ‘이성’이 정념을 압도하는 힘을 드러냅니다.
- source_word: εὐσέβεια
  english_pob_choice: godliness
  chosen_korean: 경건
  alternatives_korean:
  - 경외
  - 신앙심
  - 독실함
  lexicon: LSJ
  rationale: εὐσέβεια는 하나님께 대한 헌신을 뜻하므로, 문맥상 가장 직접적인 한국어인 ‘경건’을 택했습니다. 교회 관용어와도 잘 맞습니다.
- source_word: ποθεινοτέρα
  english_pob_choice: more longed for
  chosen_korean: 더 간절히 바라는
  alternatives_korean:
  - 더 그리워하는
  - 더 소원하는
  - 더 원하는
  lexicon: LSJ
  rationale: ποθέω 계열의 비교급이 지닌 ‘갈망/열망’의 정서를 살려, 비교의 강도를 드러내는 ‘더 간절히 바라는’으로 옮겼습니다.
theological_decisions:
- issue: εὐσέβεια의 종교적 강도
  chosen_reading: ‘경건’으로 번역해 하나님께 대한 헌신이 자녀에 대한 애착보다 우선한다는 점을 드러냈습니다.
  alternative_readings:
  - ‘경외’
  - ‘신앙심’
  rationale: 문맥은 단순한 도덕성이나 일반 종교심이 아니라 하나님께 대한 충성의 우선성을 칭송하므로, 축약되지 않은 ‘경건’이 가장 균형 잡힌 선택입니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 6
- issue: 정념과 이성의 대조
  chosen_reading: ‘이성’과 ‘정념’의 대조를 유지해, 원문의 철학적-윤리적 긴장을 약화시키지 않았습니다.
  alternative_readings:
  - ‘마음’과 ‘욕망’
  - ‘이해’와 ‘감정’
  rationale: 이 문장은 단순 감정 표현이 아니라 이성이 정념을 통치한다는 수사이므로, 원문의 구조를 보존하는 용어쌍이 필요합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 4
