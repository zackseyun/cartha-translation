  lexicon: LSJ
  rationale: 직접적인 지배와 강한 비유를 살리기 위해 ‘폭군이여’로 옮겼습니다. ‘이성’이 정념을 압도하는 힘을 드러냅니다.
- source_word: εὐσέβεια
