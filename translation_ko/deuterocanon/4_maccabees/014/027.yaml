  - 하나님 앞의 경외심
  rationale: 원문이 ‘fear’라는 단어를 사용하므로, 도덕적·신학적 긴장을 약화시키지 않기 위해 완화된 종교적 용어로 바꾸지 않았습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it.'
- issue: σωτηρία의 범위
  chosen_reading: 자녀들의 일시적 생존/보호를 뜻하는 것으로 이해했습니다.
  alternative_readings:
