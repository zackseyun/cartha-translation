  to: 그들은 의롭고 절제하며, 용감하고 고결한 마음을 지녔으며, 형제들을 사랑하였습니다. 또한 어머니를 지극히 사랑하여, 죽음에 이르기까지도 법규들을 지키면서 어머니에게 순종하였습니다.[a]
