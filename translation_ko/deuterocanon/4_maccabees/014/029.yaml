base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/029.yaml
  text: For they were righteous and self-controlled[a], brave and noble-minded and loving toward their brothers, and so devoted to their mother that, even to the point of death, they obeyed her by keeping the law.
  footnotes:
  - marker: a
    text: Or 'the ancestral laws' or 'the ordinances'; the Greek is plural, referring to the lawful requirements they were determined to observe.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 의롭고 절제하며, 용감하고 고상한 마음을 가졌고, 형제들을 사랑하였으며, 어머니에게도 깊이 마음이 있어, 죽음에 이르기까지도 법규를 지키며 어머니에게 순종하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘조상의 법들’, ‘법규들’로도 옮길 수 있습니다. 그리스어는 복수형으로, 이들이 지키기로 굳게 결심한 합법적 요구사항들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιοί
  english_pob_choice: righteous
  chosen_korean: 의롭고
  alternatives_korean:
  - 정의롭고
  - 올바르고
  lexicon: LSJ
  rationale: 특성 목록의 첫 항목으로서 도덕적·종교적 올바름을 나타내므로, 법적 공정성보다 넓은 의미의 ‘의롭다’가 가장 잘 맞습니다.
- source_word: σώφρονες
  english_pob_choice: self-controlled
  chosen_korean: 절제하며
  alternatives_korean:
  - 자제하며
  - 신중하며
  lexicon: LSJ
  rationale: 몸과 욕망을 다스리는 덕목을 가리키므로, 현대 한국어에서 자연스럽고 덕목 목록에도 어울리는 ‘절제하다’를 택했습니다.
- source_word: φιλάδελφοι
  english_pob_choice: loving toward their brothers
  chosen_korean: 형제들을 사랑하였으며
  alternatives_korean:
  - 형제애가 있으며
  - 형제들에게 애정이 있으며
  lexicon: LSJ
  rationale: 그리스어가 실제로 ‘형제들’을 가리키므로, 성별 중립화보다 문맥에 맞는 형제 관계를 분명히 드러냈습니다.
- source_word: τὰ νόμιμα
  english_pob_choice: the law
  chosen_korean: 법규를
  alternatives_korean:
  - 율법을
  - 법을
  - 조상들의 규례를
  lexicon: LSJ
  rationale: 복수형 νόμιμα의 ‘법적 요구사항들’이라는 뉘앙스를 살리기 위해 단수의 추상명사보다 ‘법규’를 택했습니다.
theological_decisions:
- issue: πείθεσθαι αὐτῇ의 관계를 어떻게 드러낼 것인가
  chosen_reading: 어머니에게 순종하였습니다
  alternative_readings:
  - 그녀에게 복종하였습니다
  - 그녀의 말에 따랐습니다
  rationale: 여기서는 설득을 넘어 자녀의 충성을 뜻하는 복종/순종의 의미가 강하므로, 어머니에 대한 효성과 결부된 ‘순종’이 가장 자연스럽습니다.
  doctrine_reference: Translation philosophy §1, §4
- issue: μέχρι θανάτου의 강도 표현
  chosen_reading: 죽음에 이르기까지도
  alternative_readings:
  - 죽음까지
  - 죽음에 이르도록
  rationale: 단순한 시간 한계를 넘어 순교적 극단을 나타내므로, ‘이르기까지도’로 강도를 유지했습니다.
  doctrine_reference: Translation philosophy §6
