  source_fidelity: 수정이 필요합니다. 현 번역은 덕목 목록과 ‘죽음에 이르기까지’ 및 어머니에게 순종한 사실을 대체로 옮겼으나, φιλόμητρος οὕτως, ὥστε의 정도-결과 관계가 ‘어머니에게도 깊이 마음이 있어’라는 부자연스러운 표현 속에서 약화되었습니다. 또한 τὰ νόμιμα는 복수형이므로 본문에서도 복수의 규정이라는 점을 드러내는 것이 안전합니다.
  naturalness: ‘어머니에게도 깊이 마음이 있어’는 현대 표준 한국어 합쇼체에서 어색하며, ‘어머니를 지극히 사랑하여’가 자연스럽고 원문의 강조를 살립니다. 덕목 목록은 병렬성을 유지하도록 다듬었습니다.
  terminology: δίκαιοι는 ‘의롭고’, σώφρονες는 ‘절제하며’, ἀνδρεῖοι는 ‘용감하고’, μεγαλόψυχοι는 ‘고결한 마음을 지녔고’로 옮겼습니다. τὰ νόμιμα는 유대적 법 준수의 문맥을 존중하되 원문의 복수성과 표현상의 여지를 보존하여 ‘법규들을’로 번역하고 각주에 대안을 제시했습니다.
