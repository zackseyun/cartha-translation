base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/026.yaml
  text: But of all mothers[a], the mother of the seven became the most devoted to her children, she who, through seven pregnancies, had her affection for them deeply planted within her;
  footnotes:
  - marker: a
    text: Or 'more loving toward her children.' The Greek comparative φιλοτεκνοτέρα, in context with 'of all mothers,' carries the sense that she stood out above all others in maternal devotion.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 모든 어머니들 가운데서 일곱 아이의 어머니가 아이들에 대한 사랑이 가장 깊은 사람이 되었으니, 일곱 번의 잉태를 통해 그들에 대한 애정이 그녀 안에 심기운 사람이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '자녀를 더 사랑하는'. 그리스어 비교급 φιλοτεκνοτέρα는 '모든 어머니들 가운데서'라는 문맥과 함께, 그녀가 모성적 헌신에서 다른 이들을 뛰어넘는다는 뜻을 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πασῶν δὲ τῶν μητέρων
  english_pob_choice: But of all mothers
  chosen_korean: 그러나 모든 어머니들 가운데서
  alternatives_korean:
  - 그리고 모든 어머니들 가운데서
  - 모든 어머니들 가운데서
  lexicon: LSJ
  rationale: partitive genitive와 δέ의 전환감을 살리되, 현대 한국어에서 자연스러운 대조 연결로 옮겼습니다.
- source_word: φιλοτεκνοτέρα
  english_pob_choice: the most devoted to her children
  chosen_korean: 아이들에 대한 사랑이 가장 깊은 사람
  alternatives_korean:
  - 자녀를 가장 사랑하는 사람
  - 자녀에게 가장 헌신적인 사람
  lexicon: LSJ
  rationale: 비교급이지만 문맥상 모든 어머니들과의 대비에서 최상급 의미가 드러나므로, 자녀를 향한 특별한 애정과 헌신을 자연스럽게 표현했습니다.
- source_word: ἑπτὰ κυοφορίας
  english_pob_choice: through seven pregnancies
  chosen_korean: 일곱 번의 잉태를 통해
  alternatives_korean:
  - 일곱 번의 임신을 통해
  - 일곱 번 아이를 잉태함으로
  lexicon: LSJ
  rationale: κυοφορία의 출산 전 단계인 임신/잉태를 반영하되, 고전적 문맥에 더 잘 맞는 '잉태'를 택했습니다.
- source_word: φιλοστοργίαν ... ἐπιφυτευομένην
  english_pob_choice: her affection for them deeply planted within her
  chosen_korean: 그들에 대한 애정이 그녀 안에 심기운
  alternatives_korean:
  - 그들에 대한 애정이 그녀 안에 깊이 뿌리내린
  - 그들에 대한 사랑이 그녀 안에 심어진
  lexicon: LSJ
  rationale: φιλοστοργία의 가족적 애정을 '애정'으로 옮기고, ἐπιφυτευομένην의 식재 은유를 '심기운'으로 살렸습니다.
theological_decisions:
- issue: 비교급 φιλοτεκνοτέρα의 강도
  chosen_reading: 한국어에서는 최상급적 의미를 드러내는 '가장 깊은'으로 옮겼습니다.
  alternative_readings:
  - '''자녀를 더 사랑하는''으로 직역'
  - '''자녀에 대한 사랑이 더 큰''으로 완화'
  rationale: 본문은 '모든 어머니들'과의 대비 속에서 예외적 탁월성을 말하므로, 단순 비교보다 최상급적 뉘앙스가 더 정확합니다.
  doctrine_reference: 문맥-수사적 의미 보존
- issue: 애정의 내재화 표현
  chosen_reading: '''그녀 안에 심기운''으로 식재 은유를 유지했습니다.'
  alternative_readings:
  - '''그녀 안에 뿌리내린'''
  - '''그녀 안에 자리 잡은'''
  rationale: 저자는 사랑이 외적 감정이 아니라 내면에 이식된 상태임을 말하므로, 은유를 약화시키지 않고 전달했습니다.
  doctrine_reference: 수사적 이미지 보존
