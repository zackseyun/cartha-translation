revisions:
- from: 그러나 모든 어머니들 가운데서 일곱 아이의 어머니가 아이들에 대한 사랑이 가장 깊은 사람이 되었으니, 일곱 번의 잉태를 통해 그들에 대한 애정이 그녀 안에 심기운 사람이었습니다.[a]
  to: 그러나 모든 어머니 가운데 일곱을 둔 어머니가 자녀를 가장 사랑하는 이가 되었으니, 그는 일곱 번의 임신을 거치면서 그들을 향한 애정이 자신 안에 심어져 간 이였습니다.[a]
  rationale: 원문의 비교급이 ‘모든 어머니 가운데’라는 비교 범위 안에서 지니는 최상급적 효과를 유지했습니다. 관계절을 ‘…이 되었으니, …인 이였습니다’로 다듬어 원문의 설명적 ἥτις를 자연스럽게 반영했고, ‘심어져 간’으로 ἐπιφυτευομένην의 식재 은유와 진행성을 보존했습니다.
  reviewer_model: gpt-5.6-terra
