  text: He loved piety more[b][a], the piety that saves unto eternal life according to God.
  footnotes:
  - marker: a
    text: Or 'godliness' for 'piety' (εὐσέβεια).
    reason: lexical_alternative
  - marker: b
    text: The phrase 'according to God' may also mean 'in accordance with God's will' or 'in God's judgment.'
    reason: alternative_reading
translation:
  language: ko
  text: 그는 경건을 더 사랑하였는데 — 그 경건은 영원한 생명에 이르게 하는, 하나님에 따른 경건이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐσέβειαν
  english_pob_choice: piety
  chosen_korean: 경건
  alternatives_korean:
  - 경외
  - 신앙의 덕
  lexicon: LSJ
  rationale: εὐσέβεια는 하나님을 향한 경건한 헌신과 그에 따른 삶을 가리키므로, 한국어에서는 교회적·문어적 용례가 안정된 ‘경건’이 가장 직접적입니다.
- source_word: μᾶλλον ἠγάπησεν
  english_pob_choice: loved ... more
  chosen_korean: 더 사랑하였습니다
  alternatives_korean:
  - 더 좋아하였습니다
  - 더 애정하였습니다
  lexicon: LSJ
  rationale: 비교 부사는 선호의 강도를 나타내므로, 동사의 기본 의미인 ‘사랑하다’를 살리면서 ‘더’로 비교를 드러내는 것이 자연스럽습니다.
- source_word: τὴν σώζουσαν
  english_pob_choice: the piety that saves
  chosen_korean: 그 경건은 ... 이르게 하는
  alternatives_korean:
  - 구원하는
  - 살리는
  lexicon: LSJ
  rationale: 현재분사는 경건의 속성을 수식하므로, ‘이르게 하는’으로 풀어 경건 자체의 구원 기능을 분명히 하되 과도한 신학적 확장을 피했습니다.
- source_word: εἰς αἰώνιον ζωὴν
  english_pob_choice: unto eternal life
  chosen_korean: 영원한 생명에 이르게 하는
  alternatives_korean:
  - 영원한 생명을 향하여
  - 영원한 생명으로
  lexicon: LSJ
  rationale: εἰς는 목적·도달점을 나타내므로, ‘이르게 하는’으로 목적지를 드러내어 형식과 의미를 함께 보존했습니다.
- source_word: κατὰ θεόν
  english_pob_choice: according to God
  chosen_korean: 하나님에 따른
  alternatives_korean:
  - 하나님의 뜻에 따른
  - 하나님의 판단에 따른
  lexicon: LSJ
  rationale: 구문이 압축적이어서 ‘하나님에 따른’으로 직역적으로 유지하면 원문의 여지를 살리면서도 한국어에서 이해 가능합니다.
theological_decisions:
- issue: κατὰ θεόν의 해석 범위
  chosen_reading: 문맥을 확정하지 않고 ‘하나님에 따른’으로 유지했습니다.
  alternative_readings:
  - 하나님의 뜻에 따른
  - 하나님의 판단에 따른
  - 하나님 보시기에
  rationale: 원문은 경건의 성격이나 그 결과를 하나님 기준에 맞춘다고 말할 수 있으나, 특정한 교리적 방향으로 좁히지 않는 것이 본문의 압축성을 보존합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3, 6
