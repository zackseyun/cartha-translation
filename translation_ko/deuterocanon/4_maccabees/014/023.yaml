review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘인 εὐσέβεια, μᾶλλον ἠγάπησεν, εἰς αἰώνιον ζωήν은 대체로 충실합니다. 그러나 초안의 ‘하나님에 따른 경건’은 κατὰ θεόν의 수식 범위를 경건에 고정하며, 압축적인 원문의 여지를 충분히 보존하지 못합니다.
  naturalness: ‘그는 … 사랑하였는데 — 그 경건은 … 이었습니다’는 현대 한국어 합쇼체에서 문장 연결과 시제가 다소 부자연스럽습니다. 한 문장 안에서 목적어를 분명히 하고 ‘사랑하였습니다’로 종결하는 편이 자연스럽습니다.
  terminology: ‘경건’과 ‘영원한 생명’은 안정적이고 적절한 용어입니다. κατὰ θεόν은 본문에서 ‘하나님에 따라’로 가깝게 옮기되, 그 수식 범위와 의미의 여지는 각주로 밝혀야 합니다.
  issues:
  - severity: medium
    issue: κατὰ θεόν의 수식 범위가 본문에서 ‘경건’으로 확정됨
    rationale: 이 전치사구는 경건의 성격뿐 아니라 영원한 생명에 이르게 하는 구원 작용과 관련될 수도 있습니다. 본문은 과도하게 해석하지 않고, 각주에서 가능한 범위를 밝혀야 합니다.
  - severity: low
    issue: 문장 연결과 높임 종결의 불균형
    rationale: ‘사랑하였는데’ 뒤에 ‘이었습니다’가 이어지는 대시는 설명적 문장으로 다소 어색하며, 앞 절도 요청된 합쇼체 종결과 일치하지 않습니다.
  revised_text: 그는 영원한 생명에 이르게 하는, 하나님에 따라† 이루어지는 경건을 더 사랑하였습니다.
  revised_footnotes:
  - marker: †
    text: 직역하면 ‘하나님에 따라’입니다. 이 표현은 경건의 성격을 가리킬 수도 있고, 영원한 생명에 이르게 하는 구원이 하나님의 기준이나 뜻에 따른다는 뜻일 수도 있습니다.
    reason: κατὰ θεόν의 압축된 의미와 수식 범위에 관한 해석 가능성을 보존합니다.
  revision_rationale: 문장을 현대 한국어 합쇼체로 매끄럽게 정리하고, ‘경건’ 및 ‘영원한 생명’의 핵심 용어를 유지했습니다. κατὰ θεόν은 번역문에서 가까이 옮기되, 각주로 그것이 경건 또는 구원의 작용과 관련될 수 있다는 원문의 개방성을 보존했습니다.
