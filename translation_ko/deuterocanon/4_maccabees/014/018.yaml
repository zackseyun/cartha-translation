- from: 그리고 왜 이성 없는 짐승들을 통해 자식들에 대한 애정을 드러내야 하겠습니까?
  to: 그리고 왜 이성 없는 동물들을 예로 들어 자녀에 대한 애정을 보여 줄 필요가 있겠습니까?
  rationale: 수사적 질문인 τί δεῖ를 ‘왜 … 필요가 있겠습니까?’로, 논증적 용례의 ἐπιδεικνύναι를 ‘예로 들어 … 보여 주다’로 명확히 옮겼습니다. ἀλόγων의 의미는 ‘이성 없는’으로 유지했으며, 원문에 없는 소유 주체를 확정하지 않았습니다.
