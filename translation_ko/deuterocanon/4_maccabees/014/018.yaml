  yaml_path: translation/deuterocanon/4_maccabees/014/018.yaml
  text: And why is it necessary to point out[a], by means of the irrational animals[b], the affection for their children?
  footnotes:
  - marker: a
    text: Or 'through unreasoning animals' or 'by the brute beasts.' The Greek emphasizes animals as lacking reason, in contrast to human rationality.
    reason: lexical_alternative
  - marker: b
    text: Or 'natural affection for their offspring.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 왜 이성 없는 동물들을 예로 들어 자녀에 대한 애정을 보여 줄 필요가 있겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί δεῖ
  english_pob_choice: why is it necessary
  chosen_korean: 왜 ... 해야 하겠습니까?
  alternatives_korean:
  - 무슨 필요가 있습니까
  - 왜 반드시 ... 해야 합니까
  lexicon: LSJ
  rationale: 수사적 질문으로서 필요성 자체를 문제 삼는 구조를 살려, 자연스러운 합쇼체 질문형으로 옮겼습니다.
- source_word: διὰ τῶν ἀλόγων ζῴων
  english_pob_choice: by means of the irrational animals
  chosen_korean: 이성 없는 짐승들을 통해
  alternatives_korean:
  - 이성 없는 동물들을 통해
  - 무지한 짐승들을 통해
  lexicon: LSJ
  rationale: ἀλόγων의 핵심인 ‘이성 없음’을 살려 인간의 이성과 대조되는 점을 분명히 했습니다.
- source_word: ἐπιδεικνύναι
  english_pob_choice: to point out
  chosen_korean: 드러내야
  alternatives_korean:
  - 보여야
  - 증명해야
  lexicon: LSJ
  rationale: 문맥상 동물의 예를 들어 어떤 사실을 논증적으로 제시하는 뜻이므로, 단순한 ‘보이다’보다 ‘드러내다’가 수사적 기능을 더 잘 반영합니다.
- source_word: συμπάθειαν
  english_pob_choice: affection
  chosen_korean: 애정
  alternatives_korean:
  - 동정심
  - 친애
  lexicon: LSJ
  rationale: 여기서는 자식에 대한 부모의 따뜻한 정을 가리키므로, 현대 한국어에서 자연스럽고 오해가 적은 ‘애정’을 택했습니다.
