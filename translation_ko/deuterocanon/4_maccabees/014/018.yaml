    rationale: 원문은 이성 없는 동물들을 사례로 삼아 자녀를 향한 애정을 ‘보여 주다/입증하다’는 뜻입니다. 수정안은 ‘예로 들어’와 ‘보여 줄’로 이 관계를 명확히 합니다.
