  terminology: ἄλογα는 ‘이성이 없는’으로, συνπάθεια와 στοργή의 짝은 각각 ‘공감’과 ‘애정’으로 옮겨 철학적 대조와 자연스러운 부모-자손의 정을 함께 보존했습니다.
