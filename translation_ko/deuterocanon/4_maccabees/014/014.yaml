  yaml_path: translation/deuterocanon/4_maccabees/014/014.yaml
  text: For even the irrational animals have toward the offspring born from them a sympathy and affection like that of human beings[a][b].
  footnotes:
  - marker: a
    text: Or 'the unreasoning animals.' The Greek highlights the contrast between creatures lacking rational capacity and human beings.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'toward the things born from them,' that is, their own offspring.
    reason: lexical_alternative
translation:
  language: ko
  text: 왜냐하면 이성이 없는 동물들조차도 자기에게서 태어난 새끼들을 향해 인간이 지니는 것과 같은 공감과 애정을 품기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이성이 없는 동물들’은 그리스어 ἄλογα ζῷα를 옮긴 것으로, 이성적 능력이 없는 동물들을 인간과 대조하여 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들에게서 태어나는 것들을 향해’이며, 곧 그 동물들 자신의 새끼들을 뜻합니다.
    reason: lexical_alternative
