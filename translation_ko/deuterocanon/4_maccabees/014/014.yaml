  text: For even the irrational animals have toward the offspring born from them a sympathy and affection like that of human beings[a][b].
  footnotes:
  - marker: a
    text: Or 'the unreasoning animals.' The Greek highlights the contrast between creatures lacking rational capacity and human beings.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'toward the things born from them,' that is, their own offspring.
    reason: lexical_alternative
translation:
  language: ko
  text: 왜냐하면 무정한 짐승들조차도 자기들에게서 난 새끼들에 대해 인간과 같은 동정과 애정을 지니기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무정한’은 ἄλογα의 핵심 대비인 ‘이성 없음/무이성’을 살리기 위한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘새끼들’은 직역상의 ‘그들에게서 난 것들’을 동물의 자손을 뜻하는 한국어로 풀어쓴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου γε καὶ
  english_pob_choice: For even
  chosen_korean: 왜냐하면 … 때문입니다
  alternatives_korean:
  - 심지어 … 때문입니다
  - 더구나 … 때문입니다
  - 왜냐하면 심지어 … 때문입니다
  lexicon: LSJ
  rationale: 문맥상 단순한 장소가 아니라 앞선 논지를 뒷받침하는 근거를 제시하므로, 한국어에서는 인과 연결로 자연스럽게 옮겼습니다.
- source_word: τὰ ἄλογα ζῷα
  english_pob_choice: the irrational animals
  chosen_korean: 무정한 짐승들
  alternatives_korean:
  - 이성 없는 짐승들
  - 비이성적 동물들
  - 무리한 짐승들
  lexicon: LSJ
  rationale: ἄλογα는 이성적 능력이 없는 존재와 인간을 대조하므로, ‘무정한’으로 옮겨 원문의 대비와 비합리성의 뉘앙스를 살렸습니다.
- source_word: συνπίθειαν καὶ στοργὴν
  english_pob_choice: sympathy and affection
  chosen_korean: 동정과 애정
  alternatives_korean:
  - 공감과 애정
  - 동류감과 애정
  - 친애와 따뜻한 정
  lexicon: LSJ
  rationale: συνπίθεια는 단순한 감정이입보다 ‘함께 느끼는 마음’에 가깝고, στοργή는 혈연적 애정을 가리키므로, 한국어에서 의미를 분리해 ‘동정과 애정’으로 대응했습니다.
- source_word: τὴν πρὸς τὰ ἐξ αὐτῶν γεννώμενα
  english_pob_choice: toward the offspring born from them
  chosen_korean: 자기들에게서 난 새끼들에 대해
  alternatives_korean:
  - 자기들에게서 태어난 자식들에게 대해
  - 그들에게서 난 새끼들을 향해
  - 자기 소생에 대하여
  lexicon: LSJ
  rationale: 직역적인 ‘태어난 것들’보다, 동물의 자손을 가리키는 문맥을 살려 ‘새끼들’로 옮기되, ‘자기들에게서 난’으로 출처 관계를 분명히 했습니다.
theological_decisions:
- issue: 인간과 짐승의 비교 방식
  chosen_reading: 본문은 짐승들에게도 인간과 유사한 자손 사랑이 있음을 말하며, 인간의 합리성과 대비되는 본성적 정을 강조합니다.
  alternative_readings:
  - 단순히 동물의 본능적 보호 본능을 말하는 것으로 축소하는 읽기
  - 인간의 사랑을 동물보다 낮추는 도식으로 읽는 것
  rationale: ἄλογα와 τοῖς ἀνθρώποις의 대조가 철학적·수사학적 비교를 형성하므로, 그 긴장을 약화시키지 않고 그대로 드러내는 것이 source-grounded합니다.
  doctrine_reference: 인간의 이성/도덕성에 대한 고전적 유대-헬라 비교 수사
