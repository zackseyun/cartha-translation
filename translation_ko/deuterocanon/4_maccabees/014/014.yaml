  lexicon: LSJ
  rationale: 직역적인 ‘태어난 것들’보다, 동물의 자손을 가리키는 문맥을 살려 ‘새끼들’로 옮기되, ‘자기들에게서 난’으로 출처 관계를 분명히 했습니다.
theological_decisions:
- issue: 인간과 짐승의 비교 방식
  chosen_reading: 본문은 짐승들에게도 인간과 유사한 자손 사랑이 있음을 말하며, 인간의 합리성과 대비되는 본성적 정을 강조합니다.
  alternative_readings:
  - 단순히 동물의 본능적 보호 본능을 말하는 것으로 축소하는 읽기
  - 인간의 사랑을 동물보다 낮추는 도식으로 읽는 것
  rationale: ἄλογα와 τοῖς ἀνθρώποις의 대조가 철학적·수사학적 비교를 형성하므로, 그 긴장을 약화시키지 않고 그대로 드러내는 것이 source-grounded합니다.
  doctrine_reference: 인간의 이성/도덕성에 대한 고전적 유대-헬라 비교 수사
