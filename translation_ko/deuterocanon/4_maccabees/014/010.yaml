  text: What could be more painful than these things? For the power of fire[a], being sharp and brief, quickly destroyed the bodies.
  footnotes:
  - marker: a
    text: Or 'quickly destroyed the bodies.' The Greek verb can mean 'dissolved,' 'broke up,' or 'destroyed'; 'consumed' is chosen here because the subject is fire.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일보다 더 고통스러운 것이 무엇이겠습니까? 불의 능력은 날카롭고도 짧아, 몸을 재빨리 파괴하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘몸을 재빨리 파괴하였다.’ 이 동사는 ‘풀어 해체하다’, ‘무너뜨리다’, ‘파괴하다’의 뜻을 가질 수 있으며, 여기서는 불이 주어이므로 영어 POB는 ‘consumed’를 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν τί γένοιτο ἐπαλγέστερον;
  english_pob_choice: What could be more painful than these things?
  chosen_korean: 이 일보다 더 고통스러운 것이 무엇이겠습니까?
  alternatives_korean:
  - 이것들보다 더 괴로운 것이 무엇이겠습니까?
  - 이 일보다 더 비통한 것이 무엇이겠습니까?
  lexicon: LSJ
  rationale: ἐπαλγέστερον은 ‘더 아픈/더 고통스러운’의 비교 표현이므로, 수사적 질문 구조를 살려 가장 सीधे한 ‘더 고통스러운’으로 옮겼습니다.
- source_word: ὀξεῖα
  english_pob_choice: sharp
  chosen_korean: 날카롭고도
  alternatives_korean:
  - 예리하고도
  - 매섭고도
  lexicon: LSJ
  rationale: 불의 작용을 묘사하는 감각적 형용사이므로, ‘sharp’의 이미지가 살아 있는 ‘날카롭고도’로 옮겼습니다.
- source_word: σύντομος
  english_pob_choice: brief
  chosen_korean: 짧아
  alternatives_korean:
  - 짧고
  - 신속하여
  lexicon: LSJ
  rationale: σύντομος는 ‘짧은/간결한’ 뜻이지만 여기서는 δύναμις와 병치되어 작용의 지속이 짧음을 가리키므로 ‘짧아’가 자연스럽습니다.
- source_word: ταχέως διέλυσε τὰ σώματα
  english_pob_choice: quickly consumed/destroyed the bodies
  chosen_korean: 몸을 재빨리 파괴하였습니다
  alternatives_korean:
  - 몸을 재빨리 무너뜨렸습니다
  - 몸을 재빨리 소멸시켰습니다
  lexicon: LSJ
  rationale: διέλυσε는 문자적으로 ‘풀어 해체하다/무너뜨리다/파괴하다’의 범위를 가지며, 불이 신체를 해체하는 맥락이므로 과도한 해석 없이 ‘파괴하였습니다’로 처리했습니다.
