  source_fidelity: 수정이 필요합니다. 원문의 주어는 λογισμός(이성)인데, 초안은 ‘그 남자들이 … 이성에 지배당한 것’이라는 수동 구문으로 바꾸어 원문의 능동적 강조와 ‘고문 가운데서’라는 상황 표현을 다소 흐립니다. 또한 ὅπου γε καί는 단순 첨가의 ‘더욱이’보다 근거를 강화하는 ‘왜냐하면 …조차’로 옮기는 편이 맞습니다. πολυτροπωτέρων은 ‘더 심한’보다 ‘더 다양한/여러 가지의’라는 비교적·다양성의 뜻을 보존해야 합니다.
  naturalness: 합쇼체와 전반적 문장은 자연스럽지만, ‘더욱이’는 앞 절의 진술을 뒷받침하는 원문의 논리 관계를 충분히 드러내지 못합니다. 능동 구문으로 고치면 더 간결하고 명료합니다.
  terminology: ‘이성’은 4마카베오스의 λογισμός에 적절합니다. βασάνοις는 이 문맥에서 실제 가해지는 고문을 가리키므로 ‘고문 가운데서’가 적절하며, ἀλγηδόνων은 ‘고통들’로 유지할 수 있습니다. ὑπερεφρόνησεν의 경시·멸시의 뜻은 ‘업신여겼습니다’가 잘 나타냅니다.
  issues:
