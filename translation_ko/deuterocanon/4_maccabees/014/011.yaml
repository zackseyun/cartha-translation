  text: And do not consider it remarkable if reason gained the mastery over those men in their torments[b][a], since even a woman's mind looked down on more severe pains.
  footnotes:
  - marker: a
    text: Or 'prevailed over those men in their tortures.'
    reason: lexical_alternative
  - marker: b
    text: Or 'despised more manifold pains' or 'rose above more varied sufferings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 남자들이 그 고통 속에서도 이성에 지배당한 것이 놀랍다고 여기지 마십시오. 더욱이 한 여인의 마음은 더 심한 고통들까지도 가볍게 여겼습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그 남자들을 그들의 고문 속에서 압도했다.'
    reason: lexical_alternative
  - marker: b
    text: 또는 '더욱 다양한 고통들을 업신여겼다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμαστὸν ἡγεῖσθε
  english_pob_choice: do not consider it remarkable
  chosen_korean: 놀랍다고 여기지 마십시오
  alternatives_korean:
  - 이상하게 여기지 마십시오
  - 놀랍게 생각하지 마십시오
  lexicon: LSJ
  rationale: θαυμαστόν은 '놀랍다/이상하다'는 뜻이고 ἡγεῖσθε는 '여기다, 간주하다'이므로, 현대 한국어에서 자연스럽고 공손한 금지형으로 옮겼습니다.
- source_word: λογισμὸς
  english_pob_choice: reason
  chosen_korean: 이성
  alternatives_korean:
  - 이치
  - 이성적 판단
  lexicon: LSJ
  rationale: 4마카베오스에서 λογισμός는 정념을 다스리는 이성의 능력을 가리키므로, 문맥을 살려 '이성'으로 옮겼습니다.
- source_word: περιεκράτησεν
  english_pob_choice: gained the mastery over
  chosen_korean: 지배당한
  alternatives_korean:
  - 지배했습니다
  - 압도했습니다
  - 제압했습니다
  lexicon: LSJ
  rationale: 복합동사는 완전한 우세를 뜻하므로, 주어가 이성이고 대상이 사람들인 구조를 한국어에서 자연스럽게 드러내기 위해 수동적 표현을 사용했습니다.
- source_word: ὑπερεφρόνησεν ἀλγηδόνων
  english_pob_choice: looked down on ... pains
  chosen_korean: 가볍게 여겼습니다
  alternatives_korean:
  - 깔보았습니다
  - 업신여겼습니다
  - 대수롭지 않게 여겼습니다
  lexicon: LSJ
  rationale: ὑπερεφρόνησεν은 단순히 '초월했다'보다 경멸적 경시를 포함하므로, 과도하게 비속하지 않으면서도 태도의 경시를 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: γυναικός의 성별 표지 보존
  chosen_reading: 한 여인의 마음
  alternative_readings:
  - 여인의 마음
  - 한 여성의 마음
  rationale: 원문은 단수 여성 명사를 분명히 사용하므로, 남자들에 대한 대비를 유지하면서 성별 표지를 지우지 않는 표현을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy §4'
- issue: 고난/고통 어휘의 강도
  chosen_reading: 고통
  alternative_readings:
  - 고난
  - 고초
  - 고문
  rationale: βασάνοις와 ἀλγηδόνων은 실제 고통과 괴로움을 가리키지만, 한국어 본문에서는 지나치게 형벌적이거나 장황한 뉘앙스를 피하면서도 강도를 유지하기 위해 '고통'을 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy §§1, 5'
