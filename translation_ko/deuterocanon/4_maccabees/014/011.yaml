    rationale: 원문은 ‘이성이 그 남자들을 고문 가운데서 제압했다’고 말합니다. 수동 표현도 핵심 의미를 전달하지만, 원문의 주어 강조와 직접적 지배 관계를 보존하는 능동 구문이 더 충실합니다.
