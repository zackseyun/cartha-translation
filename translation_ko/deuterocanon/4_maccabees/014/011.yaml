revisions:
- from: 그 남자들이 그 고통 속에서도 이성에 지배당한 것이 놀랍다고 여기지 마십시오. 더욱이 한 여인의 마음은 더 심한 고통들까지도 가볍게 여겼습니다.[a][b]
  to: 이성이 그 남자들을 그들의 고문 가운데서 제압한 것이 놀랍다고 여기지 마십시오.[a] 왜냐하면 한 여인의 마음조차 더 다양한 고통들을 업신여겼기 때문입니다.[b]
  rationale: 원문의 능동 구문(‘이성이 … 제압했다’), βασάνοις의 문맥상 의미(‘고문 가운데서’), ὅπου γε καί의 강화·근거 관계(‘왜냐하면 …조차’), 그리고 πολυτροπωτέρων의 다양성 의미(‘더 다양한’)를 보존했습니다. 성별이 표지된 γυναικός는 ‘한 여인의 마음’으로 유지했으며, ὑπερεφρόνησεν의 경시 의미는 ‘업신여겼습니다’로 나타냈습니다. 각주 표지도 각 대안이 적용되는 자리로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:03:55Z'
