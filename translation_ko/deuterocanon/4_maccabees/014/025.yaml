  yaml_path: translation/deuterocanon/4_maccabees/014/025.yaml
  text: For the more mothers are weak in spirit and more prolific[a], the more they love their children.
  footnotes:
  - marker: a
    text: Or, 'the more affectionate toward their children.' The Greek literally says 'more child-loving.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왜냐하면 어머니들은 더 약한 마음을 지니고 더 많은 자녀를 낳을수록, 그만큼 더 자녀들을 사랑하기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자녀들에게 더 애정이 있는’이라는 뜻입니다. 그리스어는 문자적으로 ‘더 자녀를 사랑하는’이라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσῳ ... τοσούτῳ / μᾶλλον
  english_pob_choice: the more ... the more
  chosen_korean: 더 ... 그만큼 더
  alternatives_korean:
  - ~할수록 ... 더욱
  - 더 ... 더
  lexicon: LSJ
  rationale: 원문의 상관 비교 구조를 한국어의 대응 구조로 자연스럽게 옮겨, 인과적·비례적 강조를 보존했습니다.
- source_word: ἀσθενέψυχοι
  english_pob_choice: weak in spirit
  chosen_korean: 더 약한 마음을 지니고
  alternatives_korean:
  - 영이 약하고
  - 마음이 약하고
  - 심지가 약하고
  lexicon: LSJ
  rationale: 직역적 이미지인 '영/혼의 약함'을 살리되, 한국어에서 자연스럽고 오해가 적은 표현으로 풀었습니다.
- source_word: πολυγονώτεραι
  english_pob_choice: more prolific
  chosen_korean: 더 많은 자녀를 낳을수록
  alternatives_korean:
  - 더 많은 자녀를 둔
  - 다산한
  - 더 풍성히 자녀를 낳은
  lexicon: LSJ
  rationale: 단순한 '다산'보다 문맥상 출산의 결과를 분명히 드러내는 표현을 택해 비교의 뜻을 살렸습니다.
- source_word: φιλοτεκνότεραι
  english_pob_choice: love their children / lovers of their children
  chosen_korean: 자녀들을 사랑하기
  alternatives_korean:
  - 자녀들을 더 사랑하기
  - 자녀들을 사랑하는 이들이기
  - 자녀들에게 더 애정이 있기
  lexicon: LSJ
  rationale: 직역의 이미지인 '자녀를 사랑하는' 뜻을 유지하면서, 한국어 문장에서는 서술적 동사구로 읽히도록 했습니다.
theological_decisions:
- issue: 원문의 성향 서술을 도덕적 평가로 과도하게 바꾸지 않기
  chosen_reading: 어머니들의 '더 약한 마음'과 '많은 출산'이 자녀 사랑의 강도로 연결된다는 수사적 진술로 옮겼습니다.
  alternative_readings:
  - 감상적 모성애로 일반화하기
  - 출산의 생물학적 사실만 강조하기
  rationale: 4 마카베오서의 문맥은 순교 서사 속에서 어머니의 정서적·육체적 취약성과 사랑의 강도를 연결합니다. 이를 심리학적 설명이나 교훈문으로 약화하지 않았습니다.
  doctrine_reference: 문맥적 수사 이해
