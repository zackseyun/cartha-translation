  naturalness: ‘각 아들을 하나씩 따로도’는 ‘각’·‘하나씩’·‘따로’가 중복되어 어색합니다. ‘아들 하나하나를 따로’가 현대 표준 한국어로 자연스럽고 분배성을 충분히 보존합니다. ‘죽음에 이르도록 권하셨습니다’는 엄중한 문맥을 유지하면서도 자연스럽습니다.
