  yaml_path: translation/deuterocanon/4_maccabees/014/031.yaml
  text: But the mother urged each son individually[a], and all of them together[b], toward death for the sake of godliness.
  footnotes:
  - marker: a
    text: Or 'one by one ... and all together.'
    reason: lexical_alternative
  - marker: b
    text: Or 'for piety.' The Greek term denotes devout reverence and faithful devotion toward God.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 어머니는 각 아들을 하나씩 따로도, 그리고 그들 모두를 함께도, 경건함을 위한 죽음으로 재촉하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나씩 … 그리고 모두 함께’입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘경건을 위하여’입니다. 이 그리스어는 하나님께 대한 경건한 경외와 신실한 헌신을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그뿐만 아니라
  lexicon: LSJ
  rationale: 앞 문맥과의 약한 대조와 이어짐을 함께 살리기 위해 ‘그러나’를 택했습니다.
- source_word: καθʼ ἕνα παῖδα
  english_pob_choice: each son individually
  chosen_korean: 각 아들을 하나씩 따로
  alternatives_korean:
  - 한 명씩
  - 각 아들을 개별적으로
  lexicon: LSJ
  rationale: καθʼ ἕνα의 분배적 의미를 드러내면서, παῖδα를 이 문맥의 남자 자녀로 보아 ‘아들’로 옮겼습니다.
- source_word: ὁμοῦ πάντας
  english_pob_choice: all of them together
  chosen_korean: 그들 모두를 함께
  alternatives_korean:
  - 모두 함께
  - 전부 함께
  lexicon: LSJ
  rationale: 앞의 ‘하나씩 따로’와 대비되는 집합적 뉘앙스를 자연스럽게 살렸습니다.
- source_word: ἐπὶ τὸν ... θάνατον
  english_pob_choice: toward death
  chosen_korean: 죽음으로 재촉하셨습니다
  alternatives_korean:
  - 죽음을 향해
  - 죽음 쪽으로
  lexicon: LSJ
  rationale: προτρέπω의 ‘재촉하다, 촉구하다’와 ἐπί+대격의 방향성을 함께 반영했습니다.
- source_word: τῆς εὐσεβείας
  english_pob_choice: for the sake of godliness
  chosen_korean: 경건함을 위한
  alternatives_korean:
  - 경건을 위한
  - 하나님께 대한 경건함을 위한
  - 경건을 위하여
  lexicon: LSJ
  rationale: εὐσέβεια의 종교적·경건한 충성의 의미를 살리되, 한국어로는 ‘경건함’이 가장 직접적이고 과장되지 않습니다.
theological_decisions:
- issue: εὐσέβεια의 신학적 색채
  chosen_reading: ‘경건함’으로 옮겨, 단순한 도덕적 엄숙함이 아니라 하나님께 대한 신실한 경외를 드러내도록 했습니다.
  alternative_readings:
  - ‘경건’
  - ‘하나님께 대한 경외’
  - ‘신앙적 경건’
  rationale: 4 마카베오서의 εὐσέβεια는 순교 맥락에서 하나님과 그 뜻에 대한 헌신을 가리키므로, 한국어에서도 그 종교적 밀도를 유지하는 것이 필요합니다.
  doctrine_reference: 번역 원칙 §§1, 6
