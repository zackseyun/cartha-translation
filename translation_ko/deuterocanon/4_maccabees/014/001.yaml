  text: Moreover[a], by urging them on to torture, they sought that they should not only despise the pains, but also master the emotions of brotherly affection for their brothers.
  footnotes:
  - marker: a
    text: Or 'the passions of brotherly love for their brothers.' The Greek πάθη can mean 'passions' or 'emotions'; the phrase highlights their need to master even intense familial affection under torture.
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 그들은 그들을 고문하도록 부추기며, 그들이 단지 고통만을 업신여길 뿐 아니라 형제들을 향한 형제 사랑의 감정도 다스리게 하려 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 πάθη는 ‘감정’ 또는 ‘정념’으로도 옮길 수 있습니다. 여기서는 고문 아래에서도 형제애적 내적 반응을 제어해야 한다는 의미를 살려 ‘감정’을 본문에 두었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέτι
  english_pob_choice: Moreover
  chosen_korean: 또한
  alternatives_korean:
  - 더구나
  - 게다가
  lexicon: LSJ
  rationale: 앞선 논지를 덧붙이는 연결어이므로, 문어적이면서도 자연스러운 ‘또한’으로 처리했습니다.
- source_word: ἐπὶ τὸν αἰκισμόν
  english_pob_choice: to torture
  chosen_korean: 고문하도록
  alternatives_korean:
  - 학대하도록
  - 가혹하게 다루도록
  lexicon: LSJ
  rationale: 순교 문맥에서 αἰκισμός의 가혹성을 살리기 위해, 완곡한 표현보다 ‘고문’이 원문의 강도를 더 직접적으로 드러냅니다.
- source_word: ἐποτρύνοντες
  english_pob_choice: by urging them on
  chosen_korean: 부추기며
  alternatives_korean:
  - 재촉하며
  - 선동하며
  lexicon: LSJ
  rationale: 행위를 밀어붙이는 뉘앙스를 가진 분사이므로, 원인·수단의 느낌을 살린 ‘부추기며’가 적절합니다.
- source_word: τῶν ἀλγηδόνων
  english_pob_choice: the pains
  chosen_korean: 고통
  alternatives_korean:
  - 고통들
  - 아픔
  lexicon: LSJ
  rationale: 복수형이지만 한국어에서는 자연스럽게 총칭하는 ‘고통’이 가장 읽기 좋고, 고문 상황의 신체적 고통을 충분히 전달합니다.
- source_word: τῆς τῶν ἀδελφῶν φιλαδελφίας
  english_pob_choice: brotherly love for their brothers
  chosen_korean: 형제들을 향한 형제 사랑
  alternatives_korean:
  - 형제들에 대한 형제애
  - 형제들을 향한 동기간의 사랑
  lexicon: LSJ
  rationale: φιλαδελφία의 직역적 성격을 살리되, POB의 중복된 가족 강조를 한국어에서도 보이도록 ‘형제들을 향한 형제 사랑’으로 옮겼습니다.
- source_word: παθῶν
  english_pob_choice: the emotions
  chosen_korean: 감정
  alternatives_korean:
  - 정념
  - 감성
  - 정서
  lexicon: LSJ
  rationale: 4 마카베오스의 윤리·철학적 문맥에서 πάθη는 단순 감정보다 강한 내적 충동까지 포함할 수 있으나, 본문 흐름상 가장 중립적이고 현대적인 대응어로 ‘감정’을 택했습니다.
- source_word: κρατῆσαι
  english_pob_choice: master
  chosen_korean: 다스리게
  alternatives_korean:
  - 제어하게
  - 이기게
  - 장악하게
  lexicon: BDAG
  rationale: ‘지배하다/통제하다’의 뜻을 한국어에서 자연스럽게 풀어, 이유절 안에서 능동적 통제의 의미를 드러내는 ‘다스리게’로 번역했습니다.
theological_decisions:
- issue: 4 마카베오스의 πάθη를 철학적 범주로 어떻게 전달할지
  chosen_reading: ‘감정’으로 번역하되, 본문의 윤리적 긴장—고문 아래에서도 형제애적 정서를 제어해야 한다는 점—을 유지했습니다.
  alternative_readings:
  - 정념
  - 감성
  rationale: 이 책의 주제는 이성이 πάθη를 다스리는 데 있으나, 본 절에서는 추상적 철학어보다 실제로 흔들리는 내적 반응을 드러내는 한국어가 더 직접적입니다. 그래서 지나치게 학술적인 ‘정념’ 대신 ‘감정’을 사용했습니다.
  doctrine_reference: Translation philosophy §6; 4 Maccabees의 수덕적 인간론
- issue: φιλαδελφία의 중복된 친족 강조를 어떻게 살릴지
  chosen_reading: ‘형제들을 향한 형제 사랑’으로 반복 구조를 유지했습니다.
  alternative_readings:
  - 형제들에 대한 형제애
  - 동기간 사랑
  rationale: 원문은 ‘형제들’과 ‘형제 사랑’의 중복을 통해 친족적 유대를 의도적으로 강조하므로, 이를 평평하게 만들지 않고 한국어에서도 반복을 보존했습니다.
  doctrine_reference: source-rhetorical emphasis
