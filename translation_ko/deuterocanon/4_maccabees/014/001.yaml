  source_fidelity: 초안의 ‘그들을 고문하도록 부추기며’는 ἐπὶ τὸν αἰκισμόν을 ‘그들을 고문하다’라는 능동 행위로 읽게 하여, 그리스어의 ‘고문을 향하여/고문의 상황으로’라는 표현보다 행위자와 역할을 더 구체화합니다. 이어지는 αὐτούς가 고통을 업신여기고 형제애의 πάθη를 다스리는 대상으로 기능하므로, 한국어에서는 같은 대상을 ‘고문을 겪도록’ 부추기는 것으로 표현하는 편이 문맥과 지시 관계를 더 충실히 보존합니다. ‘고통을 업신여기다’와 ‘다스리다’는 각각 περιφρονῆσαι와 κρατῆσαι를 적절히 반영합니다.
  naturalness: ‘형제들을 향한 형제 사랑의 감정’은 원문의 반복을 살리려는 의도는 타당하지만, 한국어에서는 명사 연쇄가 무겁고 ‘형제 사랑’의 대상이 불필요하게 중복되어 다소 부자연스럽습니다. ‘형제들 사이의 형제애에서 일어나는 감정’은 친족적 상호 관계와 그 사랑에 수반되는 감정을 자연스러운 현대 한국어로 드러냅니다. 합쇼체 문장 종결도 유지했습니다.
