  naturalness: ‘새들 가운데서도 길든 것들은 집들의 지붕에 둥지를 틀고 자기 새끼들을 보호합니다’는 현대 표준어 합쇼체로 자연스럽습니다. ‘집들의 지붕’은 복수의 일반적 집들을 가리키는 그리스어 표현을 무리 없이 반영합니다.
