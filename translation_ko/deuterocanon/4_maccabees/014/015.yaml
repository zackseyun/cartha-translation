lexical_decisions:
- source_word: πετεινῶν
  english_pob_choice: birds
  chosen_korean: 새들
  alternatives_korean:
  - 새들 가운데서
  - 날아다니는 것들
  lexicon: LSJ
  rationale: πετεινῶν은 일반적인 새를 가리키므로, 한국어에서는 자연스럽고 포괄적인 ‘새들’이 가장 적절합니다.
- source_word: ἥμερα
  english_pob_choice: some
  chosen_korean: 어떤 것은
  alternatives_korean:
  - 길든 것들은
  - 길들여진 것들은
  lexicon: LSJ
  rationale: 형용사 자체의 ‘길든/길들여진’ 뜻을 노출하면 한국어 문장이 거칠어지므로, 대비되는 일부 집단을 가리키는 기능을 살려 ‘어떤 것은’으로 옮겼습니다.
- source_word: ὀροφοποιοῦντα
  english_pob_choice: making their nests on houses
  chosen_korean: 집들의 지붕에 둥지를 틀고
  alternatives_korean:
  - 집들의 지붕에 집을 짓고
  - 지붕 아래에 둥지를 틀고
  lexicon: LSJ
  rationale: 합성어가 지붕과 관련된 둥지 짓기를 뜻하므로, 새의 서식 모습을 살려 ‘집들의 지붕에 둥지를 틀고’로 옮겼습니다.
- source_word: προασπίζει
  english_pob_choice: protect
  chosen_korean: 지켜 줍니다
  alternatives_korean:
  - 보호합니다
  - 방어합니다
  lexicon: LSJ
  rationale: προασπίζει는 보호하고 막아 주는 의미이나, 새가 새끼를 돌보는 장면에서는 한국어에서 더 자연스러운 ‘지켜 줍니다’가 적절합니다.
