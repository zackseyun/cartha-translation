  - 신심
  - 신앙심
  rationale: 이 문맥에서 εὐσέβεια는 단순한 예절보다 하나님께 대한 충성된 삶의 태도를 가리키므로, 한국어 성서어휘로 널리 통용되는 ‘경건’이 가장 적합합니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy §§1, 6'
