lexical_decisions:
- source_word: ἱερὰς
  english_pob_choice: sacred
  chosen_korean: 거룩하고
  alternatives_korean:
  - 신성한
  - 성스러운
  lexicon: LSJ
  rationale: ἱερός는 신적 영역에 속한 거룩함을 뜻하므로, ‘거룩하고’로 옮겨 높임과 종교적 긴장을 살렸습니다.
- source_word: ἐναρμόστους
  english_pob_choice: harmonious
  chosen_korean: 조화로운
  alternatives_korean:
  - 조화된
  - 화합된
  - 화음이 맞는
  lexicon: LSJ
  rationale: 형용사 ἐναρμόστος의 ‘서로 잘 맞물린, 조화를 이룬’ 뜻을 자연스러운 현대 한국어로 살렸습니다.
- source_word: περὶ τῆς εὐσεβείας
  english_pob_choice: concerning godliness
  chosen_korean: 경건에 관한
  alternatives_korean:
  - 경건에 대한
  - 경외에 관한
  - 신앙에 관한
  lexicon: LSJ
  rationale: εὐσέβεια는 4 마카베오에서 하나님께 대한 경건한 헌신을 가리키므로, 전통적이지만 의미가 가까운 ‘경건’을 택했습니다.
- source_word: συμφωνίας
  english_pob_choice: agreement
  chosen_korean: 합의입니다
  alternatives_korean:
  - 일치입니다
  - 합창입니다
  - 화합입니다
  lexicon: LSJ
  rationale: συμφωνία는 의견이나 결의의 일치를 뜻할 수 있으므로, ‘합의’가 문맥상 가장 직접적이고 과도한 음악적 뉘앙스를 피합니다.
theological_decisions:
- issue: εὐσέβεια의 번역어 선택
  chosen_reading: 경건
  alternative_readings:
