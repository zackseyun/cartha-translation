  text: Now we[a], hearing of the affliction of those young men, shudder; but they, not only seeing it, and not only hearing the immediate word of threat, but also suffering it,
  footnotes:
  - marker: a
    text: Or 'the threatening word delivered on the spot'; the Greek phrase emphasizes the immediacy of the threat.
    reason: lexical_alternative
translation:
  language: ko
  text: 지금 우리는 그 젊은이들의 고난을 들으면서 떨게 됩니다. 그러나 그들은 그것을 보는 것만이 아니라, 그 즉각적인 위협의 말을 듣는 것만도 아니라, 그 일을 겪으면서도[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 즉각적인 위협의 말’은 ‘그 자리에서 전해진 위협의 말’로도 옮길 수 있습니다. 그리스어는 위협이 현장에서 즉시 주어졌다는 점을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: θλῖψιν
  english_pob_choice: affliction
  chosen_korean: 고난
  alternatives_korean:
  - 환난
  - 곤경
  - 억압
  lexicon: BDAG
  rationale: 여기서는 젊은이들이 겪는 심한 고통과 시련을 가리키므로, 문어적이면서도 자연스러운 ‘고난’이 적절합니다. ‘환난’은 종교적 색채가 더 강하고, ‘고통’은 너무 좁게 느껴질 수 있습니다.
- source_word: νεανιῶν
  english_pob_choice: young men
  chosen_korean: 젊은이들
  alternatives_korean:
  - 청년들
  - 어린 남자들
  lexicon: LSJ
  rationale: 대상은 고문을 당한 형제들이므로 남성 복수와 연령감을 살려야 합니다. 한국어에서는 ‘젊은이들’이 현대적이고 자연스럽습니다.
- source_word: φρίττομεν
  english_pob_choice: shudder
  chosen_korean: 떨게 됩니다
  alternatives_korean:
  - 몸서리칩니다
  - 전율합니다
  - 오싹해합니다
  lexicon: LSJ
  rationale: 비참한 장면을 들을 때의 신체적 반응을 나타내므로, ‘떨게 됩니다’가 감각적 반응을 간결하게 살립니다. ‘몸서리칩니다’는 더 강하지만 다소 관용적입니다.
- source_word: παραχρῆμα ἀπειλῆς λόγον
  english_pob_choice: the immediate word of threat
  chosen_korean: 그 즉각적인 위협의 말
  alternatives_korean:
  - 그 자리에서 전해진 위협의 말
  - 당장 내뱉은 협박의 말
  - 즉석의 위협의 말
  lexicon: LSJ
  rationale: παραχρῆμα의 즉시성을 살리면서도, λόγος와 ἀπειλή의 결합을 한국어 자연문으로 옮기기 위해 ‘즉각적인 위협의 말’로 렌더링했습니다. ‘협박’은 현대어에서는 지나치게 구어적일 수 있습니다.
- source_word: πάσχοντες
  english_pob_choice: suffering it
  chosen_korean: 그 일을 겪으면서도
  alternatives_korean:
  - 그것을 당하면서도
  - 고난을 겪으면서도
  - 그것을 받으면서도
  lexicon: BDAG
  rationale: 미완결 구문을 살리기 위해 동작의 진행과 체험성을 드러내는 표현을 택했습니다. 본문이 끝나지 않은 채 이어지므로 한국어도 여운을 남기도록 했습니다.
theological_decisions:
- issue: 그리스어 현재분사들의 긴장감과 미완결 구문 유지
  chosen_reading: 문장을 한국어에서도 마침표로 닫지 않고, ‘...겪으면서도’로 끝내어 이어질 대조를 기다리게 했습니다.
  alternative_readings:
  - 완결된 문장으로 매끈하게 정리하기
  - ‘겪고 있습니다’처럼 서술을 보충하기
  rationale: 원문이 대조를 이어 가는 도중에 끊기므로, 의미를 보태어 마감하지 않고 미완결성을 드러내는 것이 더 충실합니다.
  doctrine_reference: 원문 수사 구조 보존
