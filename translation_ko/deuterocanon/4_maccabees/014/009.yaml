  text: 지금 우리는 그 젊은이들이 겪은 고난을 듣고 몸서리칩니다. 그러나 그들은 그것을 볼 뿐만 아니라, 그 자리에서 들려온 위협의 말을[a] 듣기만 한 것도 아니라, 그것을 겪기까지 하면서도,
