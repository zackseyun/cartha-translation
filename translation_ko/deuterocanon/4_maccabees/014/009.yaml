  lexicon: LSJ
  rationale: 대상은 고문을 당한 형제들이므로 남성 복수와 연령감을 살려야 합니다. 한국어에서는 ‘젊은이들’이 현대적이고 자연스럽습니다.
- source_word: φρίττομεν
  english_pob_choice: shudder
  chosen_korean: 떨게 됩니다
  alternatives_korean:
  - 몸서리칩니다
