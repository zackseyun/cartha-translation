  - 오싹해합니다
  lexicon: LSJ
  rationale: 비참한 장면을 들을 때의 신체적 반응을 나타내므로, ‘떨게 됩니다’가 감각적 반응을 간결하게 살립니다. ‘몸서리칩니다’는 더 강하지만 다소 관용적입니다.
- source_word: παραχρῆμα ἀπειλῆς λόγον
  english_pob_choice: the immediate word of threat
  chosen_korean: 그 즉각적인 위협의 말
  alternatives_korean:
  - 그 자리에서 전해진 위협의 말
  - 당장 내뱉은 협박의 말
  - 즉석의 위협의 말
  lexicon: LSJ
  rationale: παραχρῆμα의 즉시성을 살리면서도, λόγος와 ἀπειλή의 결합을 한국어 자연문으로 옮기기 위해 ‘즉각적인 위협의 말’로 렌더링했습니다. ‘협박’은 현대어에서는 지나치게 구어적일 수 있습니다.
- source_word: πάσχοντες
  english_pob_choice: suffering it
  chosen_korean: 그 일을 겪으면서도
  alternatives_korean:
  - 그것을 당하면서도
  - 고난을 겪으면서도
  - 그것을 받으면서도
  lexicon: BDAG
  rationale: 미완결 구문을 살리기 위해 동작의 진행과 체험성을 드러내는 표현을 택했습니다. 본문이 끝나지 않은 채 이어지므로 한국어도 여운을 남기도록 했습니다.
