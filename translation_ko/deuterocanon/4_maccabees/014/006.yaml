  yaml_path: translation/deuterocanon/4_maccabees/014/006.yaml
  text: For just as hands and feet move in harmony with the directions of the soul[a], so those holy youths also, as if by the immortal soul of godliness[b], were in harmony with death for its sake.
  footnotes:
  - marker: a
    text: Or 'piety' for 'godliness' (εὐσέβεια).
    reason: lexical_alternative
  - marker: b
    text: 'The Greek repeats συμφων- language: the limbs move ''in harmony,'' and the youths ''were in accord'' with death, highlighting their unified resolve.'
    reason: cross_reference
translation:
  language: ko
  text: 손과 발이 영혼의 지시에 따라 조화롭게 움직이는 것처럼, 그 거룩한 청년들도 마치 경건[a]의 불멸의 영혼에 이끌린 듯 경건을 위한 죽음과 조화를 이루었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘신심’으로 옮길 수 있습니다(εὐσέβεια).
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 συμφων- 어근을 반복하여, 지체가 ‘조화롭게’ 움직이고 청년들이 죽음과 ‘조화를 이룬다’는 점을 강조합니다.
    reason: cross_reference
lexical_decisions:
- source_word: καθάπερ ... οὕτως
  english_pob_choice: just as ... so
  chosen_korean: 마치 ... 듯
  alternatives_korean:
  - '...처럼 ... 그렇게'
  - '...함과 같이 ... 또한'
  lexicon: LSJ
  rationale: 비교 구문을 한국어에서 자연스럽게 살리기 위해 마치-듯 구조를 사용하되, 대응되는 결과절의 평행성을 유지했습니다.
- source_word: τοῖς τῆς ψυχῆς ἀφηγήμασιν
  english_pob_choice: the directives of the soul
  chosen_korean: 영혼의 지시
  alternatives_korean:
  - 영혼의 명령
  - 영혼의 인도
  lexicon: LSJ
  rationale: ἀφήγημα의 ‘인도/지시’ 의미를 따라, 몸의 지체가 영혼의 통제 아래 움직인다는 비유를 한국어로 분명하게 전달했습니다.
- source_word: ἱεροὶ μειρᾶκες
  english_pob_choice: holy youths
  chosen_korean: 거룩한 청년들
  alternatives_korean:
  - 거룩한 젊은이들
  - 성스러운 청년들
  lexicon: LSJ
  rationale: μειρᾶκες의 연령감을 살리면서도 현대 한국어에서 가장 자연스러운 ‘청년들’을 택했고, ἱεροί는 ‘거룩한’으로 옮겼습니다.
- source_word: ὡς ὑπὸ ψυχῆς ἀθανάτου τῆς εὐσεβείας
  english_pob_choice: as if by the immortal soul of godliness
  chosen_korean: 불멸의 경건한 영에 의해
  alternatives_korean:
  - 불멸의 경건의 영에 의해
  - 불멸한 경건의 혼에 의해
  lexicon: LSJ
  rationale: 영어의 ‘soul of godliness’는 비유적 의인화이므로, 도식적인 영혼-혼 구분을 피하면서도 εὐσέβεια의 종교적 무게를 살려 ‘경건한 영’으로 번역했습니다.
- source_word: πρὸς τὸν ὑπὲρ αὐτῆς ... θάνατον
  english_pob_choice: with death for its sake
  chosen_korean: 그를 위한 죽음과도
  alternatives_korean:
  - 그것을 위한 죽음과도
  - 경건을 위한 죽음과도
  lexicon: LSJ
  rationale: πρὸς + accusative의 방향성을 완전히 평평하게 만들지 않고, ‘~를 위한 죽음’으로 옮겨 헌신의 대상을 드러냈습니다.
theological_decisions:
- issue: εὐσέβεια의 의인화와 ‘불멸의 영’ 표현
  chosen_reading: 이 표현을 경건의 실제 별도 실체에 대한 교리 진술이 아니라, 청년들의 결의가 몸의 지체처럼 하나로 움직인다는 수사적 비유로 보았습니다.
  alternative_readings:
  - 불멸한 경건 자체가 주체로 작용한다는 식의 실체화
  - ‘경건’ 대신 ‘신앙’으로 완화
  rationale: 그리스어 문맥은 비교와 의인화가 핵심이며, 후대의 인류학적 개념을 덧씌우지 않는 것이 본문 의미를 더 정확히 보존합니다.
  doctrine_reference: 의인화는 문자적 존재론이 아니라 수사적 장치로 유지
