  source_fidelity: 개정이 필요합니다. ψυχῆς는 앞부분과 뒷부분 모두 ‘영혼’으로 일관되게 옮겨야 하며, τῆς εὐσεβείας는 ‘경건한 영’이 아니라 ‘경건의 … 영혼’이라는 소유·의인화 구조를 보존해야 합니다. 또한 αὐτῆς는 여성 명사 εὐσέβεια를 가리키므로 한국어에서는 ‘그를’이 아니라 명시적으로 ‘경건을 위한’으로 옮기는 것이 정확합니다.
  naturalness: ‘경건의 불멸의 영혼’은 의인화된 수사라는 점에서 다소 낯설지만, 원문의 의도된 비유를 보존하는 자연스러운 문장 안에 둘 수 있습니다. ‘마치 … 이끌린 듯’은 ὡς ὑπό의 비교적·피동적 뉘앙스를 자연스럽게 전달합니다.
  terminology: ‘영혼’은 ψυχή에, ‘경건’은 εὐσέβεια에 적합합니다. ‘조화롭게’/‘조화를 이루었습니다’는 συμφώνως/συνεφώνησαν의 반복을 한국어에서 충분히 반영합니다. 각주 a는 εὐσέβεια의 실제 번역어인 ‘경건’에 붙여야 합니다.
  issues:
  - severity: high
    issue: ‘불멸의 경건한 영’이 ‘경건의 불멸의 영혼’이라는 그리스어의 속격 구조를 변경합니다.
    rationale: τῆς εὐσεβείας는 ‘영’의 성격을 나타내는 단순 형용사가 아니라 ψυχῆς와 연결되어 ‘경건의 영혼’을 이룹니다. ‘영’ 역시 ψυχή의 앞선 ‘영혼’과의 어휘적 평행을 약화합니다.
  - severity: high
    issue: ‘그를 위한 죽음’의 대명사 지시가 부정확하고 한국어에서 선행사가 불명확합니다.
    rationale: αὐτῆς는 여성형 εὐσέβεια를 가리킵니다. ‘경건을 위한 죽음’으로 명시하면 성별·지시 대상 문제를 해소하면서 의미를 보존합니다.
