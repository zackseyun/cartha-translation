  yaml_path: translation/deuterocanon/4_maccabees/014/028.yaml
  text: But not only that[a]; rather, because of the noble goodness of her sons and their obedience to the law[b], her motherly affection for them was even greater.
  footnotes:
  - marker: a
    text: Or 'virtue' for 'noble goodness' (καλοκἀγαθία), emphasizing moral excellence and nobility together.
    reason: lexical_alternative
  - marker: b
    text: That is, obedience to the ancestral Jewish law.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 그뿐만이 아니라, 아들들의 고결한 덕성[a]과 율법[b]에 대한 그들의 순종 때문에도 그들을 향한 어머니의 애정은 더욱 컸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘고결한 덕성’은 καλοκἀγαθία의 두 요소, 곧 고귀함과 도덕적 선함을 함께 나타내려는 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘율법’은 유대 조상들의 율법인 토라를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: οὐ μὴν δέ, ἀλλὰ καὶ
  english_pob_choice: But not only that; rather, because
  chosen_korean: 그뿐만 아니라 … 때문에
  alternatives_korean:
  - 하지만 그뿐만 아니라
  - 그뿐만이 아니라, 오히려 … 때문에
  - 단지 그뿐 아니라
  lexicon: LSJ
  rationale: 강한 전환과 추가를 함께 나타내는 구문이므로, 앞의 내용에 덧붙여 새로운 이유를 제시하는 흐름을 한국어에서 자연스럽게 살렸습니다.
- source_word: καλοκἀγαθίαν
  english_pob_choice: noble goodness
  chosen_korean: 고결한 선함
  alternatives_korean:
  - 덕
  - 고결함
  - 도덕적 탁월함
  lexicon: LSJ
  rationale: 아름다움과 선함이 결합된 복합적 의미를 살리기 위해 단순한 ‘덕’보다 ‘고결한 선함’을 택했습니다.
- source_word: τῶν υἱῶν
  english_pob_choice: her sons
  chosen_korean: 아들들의
  alternatives_korean:
  - 아들의
  - 자녀들의
  lexicon: LSJ
  rationale: 그리스어가 남성 복수형을 사용하므로, 문맥상 어머니의 아들들을 가리키는 점을 살려 성별을 유지했습니다.
- source_word: πρὸς τὸν νόμον αὐτῶν εὐπείθειαν
  english_pob_choice: their obedience to the law
  chosen_korean: 율법에 대한 그들의 순종
  alternatives_korean:
  - 율법에 대한 복종
  - 법에 대한 순종
  - 율법을 따르는 태도
  lexicon: LSJ
  rationale: νόμος는 유대인의 토라를 가리키므로 ‘율법’으로 옮겼고, εὐπείθεια는 자원하는 복종의 뜻을 간결하게 ‘순종’으로 표현했습니다.
- source_word: φιλοστοργίαν
  english_pob_choice: motherly affection
  chosen_korean: 어머니의 그들에 대한 사랑
  alternatives_korean:
  - 어머니의 애정
  - 모성적 사랑
  - 자연스러운 애정
  lexicon: LSJ
  rationale: 이 단어는 혈연적이고 깊은 가족애를 뜻하므로, 문맥상 어머니를 분명히 하면서 가장 자연스러운 ‘사랑’으로 풀었습니다.
theological_decisions:
- issue: 율법의 범위
  chosen_reading: 여기서의 율법은 일반적 도덕법이 아니라 조상에게 주어진 유대인의 토라를 가리킵니다.
  alternative_readings:
  - 일반적인 법 준수
  - 도덕적 원리로서의 법
  rationale: 4 마카베오서는 순교자들의 충성을 조상의 율법에 대한 신실함으로 반복해서 설명하므로, 여기서도 그 covenantal 의미를 유지하는 것이 문맥에 가장 충실합니다.
  doctrine_reference: 4 Maccabees의 서사적 일관성; DOCTRINE.md §Translation philosophy 4
