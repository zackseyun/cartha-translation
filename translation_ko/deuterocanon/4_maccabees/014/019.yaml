  rationale: κηρογονία는 단순한 꿀 생산이 아니라 밀랍/집짓기 형성을 가리키므로, ‘벌꿀집을 만드는 때’로 풀어 원문의 구체적 이미지를 살렸습니다.
- source_word: τῇ νοσσίᾳ αὐτῶν
