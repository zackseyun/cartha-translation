  rationale: 강조를 담은 예시 도입으로 이해하여, 한국어에서는 문맥에 자연스럽게 들어가는 ‘벌들도’로 시작해 비교의 힘을 살렸습니다.
- source_word: περὶ τὸν τῆς κηρογονίας καιρὸν
