- source_word: τῇ νοσσίᾳ αὐτῶν
  english_pob_choice: their brood
  chosen_korean: 자기 새끼들
  alternatives_korean:
  - 자기 자식들
  - 자기 새끼벌들
  lexicon: LSJ
  rationale: 문자적으로는 ‘그들의 새끼/자손’이라는 보호 대상의 이미지를 갖기 때문에, 한국어에서는 비유를 살린 직역에 가까운 ‘자기 새끼들’로 옮겼습니다.
- source_word: τῷ κέντρῳ
  english_pob_choice: their stinger
  chosen_korean: 쇠 같은 침
  alternatives_korean:
  - 침
  - 독침
  lexicon: LSJ
  rationale: 본문이 벌의 침을 가리키지만, 앞의 ‘쇠’와 결합한 비교를 살리기 위해 ‘쇠 같은 침’으로 옮겨 강한 타격감을 드러냈습니다.
