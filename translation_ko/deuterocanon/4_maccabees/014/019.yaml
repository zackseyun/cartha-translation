  rationale: 원문은 실제 벌의 방어 행동을 예로 들어 순교적 인내를 강화하는 문맥이므로, 비유의 설득력을 유지하는 번역이 필요합니다.
  doctrine_reference: 문맥 주석적 번역 원리
