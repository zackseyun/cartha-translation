  chosen_korean: 쇠 같은 침
  alternatives_korean:
  - 침
  - 독침
  lexicon: LSJ
  rationale: 본문이 벌의 침을 가리키지만, 앞의 ‘쇠’와 결합한 비교를 살리기 위해 ‘쇠 같은 침’으로 옮겨 강한 타격감을 드러냈습니다.
