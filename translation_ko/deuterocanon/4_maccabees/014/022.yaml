base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/022.yaml
  text: a mother[a], with two things set before her—godliness, and the temporary safety of her seven sons according to the tyrant’s promise[b];
  footnotes:
  - marker: a
    text: Or 'piety' or 'godliness' for 'reverence for God' (Greek εὐσέβεια).
    reason: lexical_alternative
  - marker: b
    text: Or 'temporary deliverance'; the Greek refers to short-term preservation of life under the tyrant's promise, not necessarily salvation in a fuller theological sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 한 어머니[a]에게는 두 가지가 앞에 놓여 있었습니다. 곧 하나님에 대한 경건과, 폭군의 약속에 따른 일곱 아들의 일시적 안전[b]이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '경건', '하나님을 향한 경외'. 그리스어 εὐσέβεια의 번역 가능성입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '임시적 구출' 또는 '일시적 구원'. 여기서 σωτηρία는 종말론적 구원이 아니라 폭군의 약속 아래서의 단기적 생존을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μήτηρ
  english_pob_choice: a mother
  chosen_korean: 한 어머니
  alternatives_korean:
  - 어머니
  - 그 어머니
  lexicon: LSJ
  rationale: 무관사 단수 명사를 한국어에서는 자연스럽게 부정·비특정의 느낌으로 풀어 '한 어머니'로 옮겼습니다.
- source_word: δυεῖν προκειμένων
  english_pob_choice: with two things set before her
  chosen_korean: 두 가지가 앞에 놓여 있었습니다
  alternatives_korean:
  - 두 가지가 제시되어 있었습니다
  - 두 가지가 놓여 있었습니다
  lexicon: LSJ
  rationale: πρόκειμαι의 '앞에 놓이다/제시되다'라는 이미지를 살리면서 한국어로 자연스럽게 상황적 배경을 표현했습니다.
- source_word: εὐσεβείας
  english_pob_choice: godliness
  chosen_korean: 하나님에 대한 경건
  alternatives_korean:
  - 경건
  - 하나님을 향한 경외
  lexicon: LSJ
  rationale: 4마카베오서의 εὐσέβεια는 단순한 종교성보다 하나님께 대한 충실한 경건을 뜻하므로, 대상이 분명하도록 '하나님에 대한 경건'으로 풀었습니다.
- source_word: σωτηρίας προσκαίρου
  english_pob_choice: the temporary safety
  chosen_korean: 일시적 안전
  alternatives_korean:
  - 임시적 구원
  - 잠시의 구출
  - 일시적 구원
  lexicon: LSJ
  rationale: 여기서 σωτηρία는 종말론적 '구원'이 아니라 폭군의 약속 아래서 생명을 잠시 보존하는 의미이므로, 신학적 과잉을 피하는 '일시적 안전'을 택했습니다.
- source_word: κατὰ τὴν τοῦ τυράννου ὑπόσχεσιν
  english_pob_choice: according to the tyrant’s promise
  chosen_korean: 폭군의 약속에 따른
  alternatives_korean:
  - 폭군의 약속대로의
  - 폭군의 약속에 따라
  lexicon: LSJ
  rationale: κατά + 대격의 '따라/에 따른' 의미를 반영했고, τυράννου는 문맥상 박해자이므로 '폭군'으로 옮겼습니다.
theological_decisions:
- issue: εὐσέβεια의 신학적 뉘앙스
  chosen_reading: 하나님에 대한 경건
  alternative_readings:
  - 경건
  - 경외
  rationale: 이 책에서 εὐσέβεια는 하나님과 그분의 뜻에 대한 충성된 삶을 가리키므로, 독자가 일반적 도덕성으로 축소하지 않도록 대상어를 명시했습니다.
  doctrine_reference: 'DOCTRINE.md: original-language primacy; preserve theological weight without ecclesial domestication'
- issue: σωτηρία의 의미 범위
  chosen_reading: 일시적 안전
  alternative_readings:
  - 임시적 구원
  - 일시적 구출
  rationale: 본문의 대비는 순종과 단기적 생존 사이의 선택이므로, 한국어 '구원'이 주는 구속사적 함의를 의도적으로 피하고 본문 의미를 좁혀 표현했습니다.
  doctrine_reference: 'DOCTRINE.md: do not import doctrinal claims the text does not make'
