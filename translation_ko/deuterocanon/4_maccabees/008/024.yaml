translation:
  language: ko
  text: 달콤한 세상의 [것을]… 우리는 필연을 억지로 재촉하지 말고[a], 우리 자신의 고문틀을 두고 헛되이 자랑하지 맙시다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘필연을 억지로 밀어붙이지 맙시다’, ‘불가피한 일을 억지로 하지 맙시다’로 옮길 수 있습니다. 그리스어 표현은 압축되어 있으며, 피할 수 없는 고난을 성급히 재촉하지 말라는 뜻일 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘고문틀’에 해당하는 그리스어 στρέβλη는 특히 몸을 늘여 고문하는 도구, 곧 랙(rack)을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ γλυκέος κόσμου
  english_pob_choice: of the sweet world
  chosen_korean: 달콤한 세상으로부터
  alternatives_korean:
  - 달콤한 세계로부터
  - 달콤한 이 세상으로부터
  lexicon: LSJ
  rationale: γλυκύς는 문자적으로 ‘달다’는 뜻이므로 ‘달콤한’으로 옮겨 세계의 유혹적 매력을 살렸고, κόσμος는 여기서 질서가 아니라 현세적 세계를 가리키므로 ‘세상’이 가장 자연스럽습니다.
- source_word: μὴ βιαζώμεθα
  english_pob_choice: let us not force
  chosen_korean: 우리는 필요를 억지로 밀어붙이지 말고
  alternatives_korean:
  - 우리는 필요를 강제로 하지 말고
  - 우리는 필요에 폭력을 행사하지 말고
  lexicon: LSJ
  rationale: βιάζομαι는 단순한 ‘강요’보다 거칠게 밀어붙이는 뉘앙스가 있어 ‘억지로 밀어붙이다’로 옮겨 압박성과 폭력성을 드러냈습니다.
- source_word: τὴν ἀνάγκην
  english_pob_choice: necessity
  chosen_korean: 필요를
  alternatives_korean:
  - 필연을
  - 불가피한 것을
  lexicon: LSJ
  rationale: ἀνάγκη는 ‘필연/필요/불가피성’의 폭을 가지지만, 이 문맥에서는 피할 수 없는 고난을 서두르지 말라는 뜻이어서 한국어에서는 추상명사보다 문맥상 자연한 ‘필요’를 택했습니다.
- source_word: ἐπὶ τῇ ἑαυτῶν στρέβλῃ
  english_pob_choice: in/over our own torture-rack
  chosen_korean: 우리 자신의 고문대 위에서
  alternatives_korean:
  - 우리 자신의 고문틀 위에서
  - 우리 자신의 형틀 위에서
  lexicon: LSJ
  rationale: στρέβλη는 고문용 ‘rack’이므로 현대 독자에게 분명하도록 ‘고문대’로 풀었고, ἑαυτῶν의 자기 소유격을 ‘우리 자신의’로 보존했습니다.
theological_decisions:
- issue: κένοδοξήσωμεν의 정서와 윤리적 강도
  chosen_reading: ‘헛되이 자랑하지 맙시다’로 옮겨, 단순한 자기표현이 아니라 공허한 과시를 경계하는 뜻을 드러냈습니다.
  alternative_readings:
  - ‘헛된 허영을 부리지 맙시다’
  - ‘허망하게 영광을 구하지 맙시다’
  rationale: 문맥상 순교적 고난 앞에서 자기 과시를 금하는 경고이므로, ‘헛되이 자랑하다’가 POB의 vainglory/boast 뉘앙스를 비교적 직접적으로 반영합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
- issue: μὴ βιαζώμεθα τὴν ἀνάγκην의 전체적 의미
  chosen_reading: 화자는 피할 수 없는 고난을 자기들의 행동으로 더 거칠게 앞당기거나 밀어붙이지 말라고 권합니다.
  alternative_readings:
  - 필연에 저항하지 말라는 뜻
  - 필연을 거슬러서는 안 된다는 뜻
  rationale: 구문이 압축적이지만, 이어지는 ‘헛되이 자랑하지 말라’는 경고와 함께 읽을 때 성급한 자기 과시나 무리한 행동으로 필연적 고난을 재촉하지 말라는 뜻이 가장 자연합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
