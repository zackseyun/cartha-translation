  text: And I pity your beauty. Will you not consider this—that nothing lies before you[a], if you disobey, except to die amid tortures?
  footnotes:
  - marker: a
    text: Greek literally, 'except to die with tortures'; the phrase means death accompanied by torture, hence 'to die amid tortures.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 저는 너희의 아름다움을 가엾게 여깁니다. 너희가 불순종한다면, 이 점을 생각하지 않겠습니까? 곧 고문을 당하며 죽는 것밖에는 너희 앞에 놓인 것이 아무것도 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘고문들과 함께 죽다’에 가깝습니다. 여기서는 죽음이 고문과 동반됨을 드러내기 위해 ‘고문을 당하며 죽다’로 옮겼습니다.
    reason: lexical_alternative
