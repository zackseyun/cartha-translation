  text: And I pity your beauty. Will you not consider this—that nothing lies before you[a], if you disobey, except to die amid tortures?
  footnotes:
  - marker: a
    text: Greek literally, 'except to die with tortures'; the phrase means death accompanied by torture, hence 'to die amid tortures.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 저는 너희의 아름다운 용모가 가엾습니다. 너희가 불순종한다면, 고문 속에서 죽는 것 외에는 너희에게 아무것도 마련되어 있지 않다는 것을 생각해 보지 않겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘고문들과 함께 죽다’에 가깝습니다. 이 표현은 고문이 수반된 죽음을 뜻하므로 ‘고문 속에서 죽는 것’으로 옮겼습니다.
    reason: lexical_alternative
