  text: 그가 이런 말을 하는 동안, 고문 도구들을 앞으로 가져오라고 명령하여, 두려움을 통해서라도 그들로 하여금 더러운 음식을 먹게 하려 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
