lexical_decisions:
- source_word: ταῦτα δὲ λέγων
  english_pob_choice: And as he said these things
  chosen_korean: 그가 이런 말을 하는 동안
  alternatives_korean:
  - 그가 이런 말을 하면서
  - 이런 말을 하며
  lexicon: LSJ
  rationale: 분사구문이 주동작과 동시에 진행되는 상황을 나타내므로, 한국어에서는 자연스러운 시간 부사절로 옮겨 말과 명령의 동시성을 살렸습니다.
- source_word: ἐκέλευσεν
  english_pob_choice: he ordered
  chosen_korean: 명령하여
  alternatives_korean:
  - 지시하여
  - 명하여
  lexicon: LSJ
  rationale: 단순한 요청이 아니라 강한 명령을 뜻하므로, 문맥의 강도를 유지하는 ‘명령하여’를 택했습니다.
- source_word: τὰ βασανιστήρια
  english_pob_choice: the instruments of torture
  chosen_korean: 고문 도구들
  alternatives_korean:
  - 고문 장치들
  - 고문 기구들
  lexicon: LSJ
  rationale: 추상적 ‘고문’이 아니라 앞에 내어 놓는 물리적 대상이므로, 도구라는 구체성을 드러냈습니다.
- source_word: μιεροφαγῆσαι
  english_pob_choice: to eat defiled food
  chosen_korean: 더러운 음식을 먹게 하려
  alternatives_korean:
  - 부정한 음식을 먹게 하려
  - 더럽혀진 음식을 먹게 하려
  lexicon: LSJ
  rationale: 유대 율법을 어기는 음식 섭취의 종교적 오염 의미를 살리되, 한국어에서 과도하게 제도화된 용어보다 본문의 수치를 직접 드러내는 표현을 택했습니다.
theological_decisions:
- issue: μιεροφαγῆσαι의 종교-도덕적 오염 뉘앙스
  chosen_reading: 더러운 음식을 먹게 하려
  alternative_readings:
  - 부정한 음식을 먹게 하려
  - 오염된 음식을 먹게 하려
  rationale: 문맥상 율법에 어긋나는 음식 섭취를 가리키지만, 본문 자체는 ‘부정한’이라는 기술 용어보다 오염/더러움의 압박을 강조합니다. 한국어에서는 그 강압성과 혐오감을 함께 전달하는 ‘더러운’이 가장 직접적입니다.
  doctrine_reference: '번역 원칙: 원문 우선, 문맥상 종교적 오염과 강압의 긴장을 보존'
