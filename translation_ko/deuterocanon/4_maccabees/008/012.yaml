  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 목적절의 πείσειεν은 ‘설득하다’이므로, ‘그들로 하여금 ... 먹게 하려’는 결과적 강제를 다소 강하게 들리게 합니다. 또한 μιεροφαγῆσαι의 종교적·의례적 오염 의미는 이 문맥에서 ‘더러운 음식’보다 ‘부정한 음식’으로 옮기는 편이 더 정확합니다.
  naturalness: 초안은 자연스럽지만 ‘명령하여’ 뒤의 긴 연결과 ‘두려움을 통해서라도 그들로 하여금’은 다소 무겁습니다. 두 문장으로 나누고 목적을 명시하면 현대 표준 한국어 합쇼체에서 더 명료합니다.
  terminology: ‘고문 도구들’은 τὰ βασανιστήρια의 물질적 의미를 잘 반영합니다. μιεροφαγῆσαι는 율법 위반과 관련된 부정/오염의 뜻을 지니므로 본문에서는 ‘부정한 음식’을 사용하고, ‘더러운 음식’을 각주 대안으로 제시하는 것이 적절합니다.
