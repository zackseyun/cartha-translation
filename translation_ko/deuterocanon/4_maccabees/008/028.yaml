  yaml_path: translation/deuterocanon/4_maccabees/008/028.yaml
  text: For they were contemptuous of sufferings[b][a], and masters of pains.
  footnotes:
  - marker: a
    text: Or 'despisers of sufferings.' The Greek adjective is strong and conveys looking down on sufferings rather than merely enduring them.
    reason: lexical_alternative
  - marker: b
    text: Or 'self-rulers over pains' / 'in control of pains.' The Greek emphasizes mastery or dominion over pain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 고난을 업신여겼고, 아픔들을 주관했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘고난을 업신여기는 자들.’ 그리스어 형용사는 단순히 견디는 정도보다, 고난을 아래로 내려다보는 강한 태도를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘아픔들을 스스로 다스리는 자들’ / ‘아픔들을 장악한 자들.’ 그리스어는 통제와 지배의 의미를 강하게 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: περίφρονες
  english_pob_choice: contemptuous of
  chosen_korean: 업신여겼고
  alternatives_korean:
  - 멸시했고
  - 경멸했고
  - 얕보았고
  lexicon: LSJ
  rationale: 형용사 περίφρονες가 단순한 참음을 넘어 ‘대상을 깔보는’ 강한 태도를 가리키므로, 한국어에서는 동사적으로 자연스럽게 ‘업신여기다’로 옮겨 평가적 강도를 살렸습니다.
- source_word: τῶν παθῶν
  english_pob_choice: sufferings
  chosen_korean: 고난
  alternatives_korean:
  - 고통
  - 수난
  - 수고
  lexicon: LSJ
  rationale: 이 문맥의 πάθη는 내적 ‘정념’이 아니라 박해와 순교의 맥락에서 겪는 고난을 뜻하므로, 표준적이면서도 문맥에 맞는 ‘고난’으로 번역했습니다.
- source_word: αὐτοκράτορες
  english_pob_choice: masters of
  chosen_korean: 주관했습니다
  alternatives_korean:
  - 지배했습니다
  - 주인처럼 다스렸습니다
  - 스스로 다스렸습니다
  lexicon: LSJ
  rationale: αὐτοκράτορες는 무엇인가를 ‘주도적으로 장악하고 지배하는’ 뜻이므로, 한국어에서는 권능과 통제를 드러내는 ‘주관하다’로 옮겼습니다.
- source_word: τῶν ἀλγηδόνων
  english_pob_choice: pains
  chosen_korean: 아픔들
  alternatives_korean:
  - 고통들
  - 통증들
  - 괴로움들
  lexicon: LSJ
  rationale: ἀλγηδών은 특히 육체적 아픔을 가리키므로, 지나치게 추상적이지 않은 ‘아픔들’로 직역 성격을 유지했습니다.
theological_decisions:
- issue: 고난과 아픔에 대한 영웅적 태도의 표현 수준
  chosen_reading: 본문은 그들이 고난을 멸시하고 아픔을 장악했다고 진술할 뿐, 이를 별도의 철학 체계나 교리로 풀어 설명하지는 않습니다.
  alternative_readings:
  - 스토아적 무감각이나 ‘정념 극복’ 교리로 해석해 풀어 쓸 수 있습니다.
  rationale: 그리스어는 간결한 서술형이므로, 번역도 본문의 직접 진술을 유지하고 해석적 확장을 피했습니다.
  doctrine_reference: 문맥이 허용하는 의미를 보존하고, 본문이 말하지 않는 체계적 해석은 주석으로만 다룹니다.
