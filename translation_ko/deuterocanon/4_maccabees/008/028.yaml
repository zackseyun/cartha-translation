  lexicon: LSJ
  rationale: αὐτοκράτορες는 무엇인가를 ‘주도적으로 장악하고 지배하는’ 뜻이므로, 한국어에서는 권능과 통제를 드러내는 ‘주관하다’로 옮겼습니다.
