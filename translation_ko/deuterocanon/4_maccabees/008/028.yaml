  yaml_path: translation/deuterocanon/4_maccabees/008/028.yaml
  text: For they were contemptuous of sufferings[b][a], and masters of pains.
  footnotes:
  - marker: a
    text: Or 'despisers of sufferings.' The Greek adjective is strong and conveys looking down on sufferings rather than merely enduring them.
    reason: lexical_alternative
  - marker: b
    text: Or 'self-rulers over pains' / 'in control of pains.' The Greek emphasizes mastery or dominion over pain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 고난을 업신여기고[a] 고통을 다스렸습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘고난을 업신여기는 이들.’ 그리스어 형용사는 단순히 견디는 정도보다 고난을 깔보는 강한 태도를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘고통을 스스로 다스리는 이들’ 또는 ‘고통을 지배하는 이들.’ 그리스어는 고통에 대한 통제와 지배의 의미를 강하게 드러냅니다.
    reason: lexical_alternative
