translation:
  language: ko
  text: 그리고 삶의 방식을 바꾼 뒤에는 여러분의 젊은 시절을 즐기십시오[a]. 왜냐하면 여러분이 불순종하여 나를 화나게 하면, 여러분은 내가 끔찍한 형벌과 고문으로 여러분 한 사람 한 사람을 죽이도록 나를 몰아붙일 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘여러분이 불순종으로 나를 성나게 대한다면.’ 그리스어 구문은 난해합니다. 본문은 문맥상 가장 개연성 있는 의미를 옮긴 것입니다.
    reason: lexical_alternative
