  - ‘왜냐하면’
  - ‘그리고’
  rationale: 앞선 권고에서 곧바로 위협으로 넘어가는 구조이므로, 한국어에서는 대조와 경고를 함께 드러내는 ‘그러나’가 가장 자연스럽습니다.
  doctrine_reference: 원문 수사 구조 보존; 문맥 기능 우선
- issue: 고문과 형벌의 결합 표현
  chosen_reading: 형벌과 고문을 함께 유지해 가혹한 집행 수단을 드러냈습니다.
  alternative_readings:
  - 형벌로
  - 고문으로
  - 징벌로
  rationale: 본문은 단순 처벌이 아니라 잔혹한 집행을 강조하므로, 완화하지 않고 두 요소를 함께 살려야 합니다.
  doctrine_reference: 번역에서의 폭력성 완화 금지; 원문 강도 보존
