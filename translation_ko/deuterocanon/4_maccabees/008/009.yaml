translation:
  language: ko
  text: 그리고 여러분이 삶의 방식을 바꾼 뒤에는, 청춘을 즐기십시오[a]. 그러나 여러분의 불순종으로 제가 화를 내게 되면, 여러분은 저마다를 끔찍한 형벌과 고문으로 멸망시키도록 저를 몰아넣게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘여러분이 불순종으로 저를 화나게 대한다면.’ 그리스어 구문은 어렵기 때문에, 본문은 가능한 의미를 옮긴 것입니다.
    reason: lexical_alternative
