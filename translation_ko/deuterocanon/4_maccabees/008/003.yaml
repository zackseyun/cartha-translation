theological_decisions:
- issue: τύραννος의 평가적 호칭을 어떻게 유지할 것인가
  chosen_reading: ‘그 폭군’으로 번역해 저자의 도덕적 평가를 그대로 드러냈습니다.
  alternative_readings:
  - 그 왕
  - 그 통치자
  rationale: 본문의 호칭은 단순한 정치적 직함이 아니라 비판적 평가를 포함하므로, 완화하지 않고 직설적으로 살렸습니다.
  doctrine_reference: '번역 원칙: 원문 우선, 평가적 어휘 보존'
