  text: When the tyrant had given these orders[a], seven brothers were brought in with their aged mother[b], handsome and modest and noble and gracious in every way.
  footnotes:
  - marker: a
    text: Or 'appeared while being led in'; the Greek more literally combines their arrival with the fact that they were being escorted under compulsion.
    reason: lexical_alternative
  - marker: b
    text: Or 'charming in every respect' for 'gracious in every way.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 폭군이 이런 명령을 내린 뒤에, 일곱 형제가 늙으신 어머니와 함께 끌려왔습니다. 그들은 잘생기고 품위가 있었으며, 고귀하고 모든 면에서 우아했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘끌려 가는 중에 나타났습니다’; 그리스어는 그들의 도착과 강제적인 인도를 더 문자적으로 함께 묶습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘모든 면에서 매력 있는’으로도 옮길 수 있습니다.
    reason: lexical_alternative
