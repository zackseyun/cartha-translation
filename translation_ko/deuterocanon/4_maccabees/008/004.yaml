  source_fidelity: 전반적인 공간 구도와 서사 진행은 잘 반영했습니다. 다만 καθάπερ ἐν χορῷ를 ‘마치 합창하듯’으로 옮기면 둘러서 있는 방식보다 노래하는 행위가 부각되어 원문의 원형적·군무적 비유가 흐려집니다. 또한 ᾔσθετο ἐπʼ αὐτοῖς의 반응은 ‘감동을 받다’보다 ‘깊은 인상을 받다’가 정서적 감화라는 과도한 함의를 피하면서 문맥상의 강한 주목을 보존합니다.
