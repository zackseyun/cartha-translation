  terminology: ‘폭군’은 τύραννος의 평가적 호칭을 적절히 살립니다. ‘고귀한 출신’은 εὐγένεια를 성품이 아니라 혈통·출신의 고귀함으로 이해하게 하므로 적절합니다.
