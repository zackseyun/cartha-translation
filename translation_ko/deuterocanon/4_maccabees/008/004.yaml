base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/004.yaml
  text: When the tyrant saw them surrounding their mother in the middle as if in a chorus[a], he was impressed by them, and astonished at their good bearing and noble birth, he smiled at them; and calling them near, he said[b],
  footnotes:
  - marker: a
    text: Or 'as in a dance/chorus,' preserving the image of a coordinated ring around their mother.
    reason: lexical_alternative
  - marker: b
    text: The phrase rendered 'he was struck by them' could also be taken more mildly as 'he took notice of them,' but the following mention of astonishment favors a stronger reaction.
    reason: lexical_alternative
translation:
  language: ko
  text: '폭군은 그들이 어머니를 가운데에 두고 마치 원무를 추듯 둘러선 것을 보고, 그들에게 깊은 인상을 받았습니다. 그리고 그들의 품위 있는 모습과 고귀한 출신에 놀라 그들에게 미소를 지었으며, 가까이 오라고 불러 말했습니다[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘마치 원무를 추듯’으로 옮긴 χορός는 노래하는 합창대뿐 아니라 춤추며 원을 이루는 무리를 가리킬 수 있습니다. 따라서 ‘마치 합창대처럼’으로도 옮길 수 있으나, 여기서는 어머니를 둘러싼 공간적 이미지를 살렸습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τύραννος
  english_pob_choice: the tyrant
  chosen_korean: 폭군
  alternatives_korean:
  - 통치자
  - 왕
  lexicon: LSJ
  rationale: τύραννος는 중립적 왕호가 아니라 억압적 지배자를 가리키는 평가적 표현이므로, 한국어에서도 그 뉘앙스를 살려 ‘폭군’으로 옮겼습니다.
- source_word: καθάπερ ἐν χορῷ
  english_pob_choice: as if in a chorus
  chosen_korean: 마치 합창하듯
  alternatives_korean:
  - 마치 춤추는 무리처럼
  - 마치 원을 이루어
  lexicon: LSJ
  rationale: χορός는 합창과 춤의 원형적 이미지를 함께 띠므로, 한국어에서는 장면의 질서정연한 집합성을 살리는 ‘합창하듯’으로 옮겼습니다.
- source_word: περιέχοντας μέσην τὴν μητέρα
  english_pob_choice: surrounding their mother in the middle
  chosen_korean: 어머니를 가운데에 두고 둘러선 것을
  alternatives_korean:
  - 어머니를 중심에 두고 둘러선 것을
  - 어머니를 가운데 두른 것을
  lexicon: BDAG
  rationale: 어머니가 중심에 놓인 공간적 구도를 유지하기 위해 ‘가운데에 두고 둘러선’으로 직역에 가깝게 처리했습니다.
- source_word: ᾔσθετο ἐπʼ αὐτοῖς
  english_pob_choice: he was impressed by them
  chosen_korean: 그들에게서 감동을 받았으며
  alternatives_korean:
  - 그들을 알아보았으며
  - 그들에게서 인상을 받았으며
  lexicon: LSJ
  rationale: 이 표현은 단순한 인지가 아니라 강한 심리적 반응을 나타내므로, 문맥에 맞게 ‘감동을 받았다’로 옮겨 반응의 강도를 살렸습니다.
- source_word: τῆς εὐπρεπείας
  english_pob_choice: their good bearing
  chosen_korean: 그들의 단정한 모습
  alternatives_korean:
  - 그들의 품위 있는 태도
  - 그들의 아름다운 차림
  lexicon: LSJ
  rationale: εὐπρέπεια는 외모와 태도의 단정함을 함께 가리킬 수 있어, 지나치게 미화하지 않는 ‘단정한 모습’으로 옮겼습니다.
- source_word: τῆς εὐγενίας
  english_pob_choice: noble birth
  chosen_korean: 고귀한 출신
  alternatives_korean:
  - 귀한 혈통
  - 고상한 품성
  lexicon: LSJ
  rationale: εὐγένεια는 혈통적 귀함을 뜻하는 경우가 많아, 성품으로 돌리지 않고 ‘고귀한 출신’으로 구체화했습니다.
theological_decisions:
- issue: 폭군의 반응을 어떻게 옮길지
  chosen_reading: 폭군이 이들을 보고 단순히 관찰한 것이 아니라 정서적으로 강하게 흔들리고 일시적으로 호의를 보이는 장면으로 옮겼습니다.
  alternative_readings:
  - 그는 그들을 알아보았다
  - 그는 그들에게 주목했다
  rationale: 뒤이어 ‘놀라’와 ‘미소를 지었다’가 이어지므로, ᾔσθετο ἐπʼ αὐτοῖς의 강한 반응을 약화시키지 않는 번역이 문맥상 더 적절합니다.
  doctrine_reference: 서사적 인물 묘사와 정서적 반응의 문맥 해석
