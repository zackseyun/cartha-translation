  lexicon: LSJ
  rationale: ἥδιστος의 ‘pleasant/sweet/delightful’ 범위를 한국어의 ‘즐거운’으로 옮겨 과도한 감각적 표현을 피하면서도 의미를 보존합니다.
- source_word: ἀποστεροῦμεν
