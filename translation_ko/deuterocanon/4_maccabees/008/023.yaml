    rationale: ἐξάγω는 문자적으로 ‘밖으로 이끌다’입니다. ‘끌어내다’는 한국어에서도 자연스럽고, 단순한 상태 변화보다 자기 자신을 삶의 영역에서 이끌어 내는 표현을 더 분명히 합니다.
