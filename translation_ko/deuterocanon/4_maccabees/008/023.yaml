  - 우리 자신을 잃게 합니까
  - 우리 자신을 스스로 빼앗습니까
  lexicon: LSJ
  rationale: ἀποστερέω의 핵심인 ‘박탈하다/빼앗다’를 유지했습니다. 목적어가 생략된 미완성 문장을 보존하기 위해 한국어도 마침표로 닫지 않고 열린 형태를 유지했습니다.
