translation:
  language: ko
  text: 그때[a] 호위병들이 바퀴들, 관절을 꺾는 기구들, 몸을 늘이는 기구들, 긁는 갈고리들, 투석기[b], 가마들, 프라이팬들, 손가락 조임틀들, 쇠로 된 손 모양의 기구들, 쐐기들, 그리고 불의 타오르는 숯들을 내어놓자, 폭군이 말을 이어 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절에 나오는 몇몇 기구명은 매우 희귀하거나 전문적인 용어이므로 번역은 대략적입니다. ‘관절을 꺾는 기구들’은 ‘팔다리를 부수는 기구들’로, ‘몸을 늘이는 기구들’은 ‘고문대들’로, ‘손가락 조임틀들’은 ‘손가락 압착기들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 본문은 이 목록에서 ‘투석기’를 읽습니다. 고문 기구를 뜻한다고 추정하여 다른 말로 바꾸지 않고 원문의 어휘를 유지했습니다.
    reason: alternative_reading
