  - marker: b
    text: The Greek text reads 'catapults,' an unusual item in this list; the translation preserves the source wording rather than replacing it with a conjectured torture instrument.
    reason: alternative_reading
translation:
  language: ko
  text: 그때[a], 시종들이 바퀴들과 관절을 꺾는 도구들, 늘이는 기구들, 갈고리들, 투석기[b], 가마들, 프라이팬들, 엄지조임틀, 쇠손들, 쐐기들, 그리고 불의 살아 있는 숯들을 내어놓자, 폭군이 말을 받아 이르렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 몇몇 기구명은 매우 희귀하거나 기술적인 용어이므로 한국어 번역은 대략적입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 본문은 이 목록에서 ‘투석기’를 읽고 있으므로, 추정되는 고문 기구로 바꾸지 않고 원문 어휘를 유지했습니다.
    reason: alternative_reading
