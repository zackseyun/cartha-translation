  source_fidelity: 핵심 기구 목록과 ‘폭군’이라는 평가적 호칭은 대체로 충실합니다. 그러나 οἱ δορυφόροι는 궁정의 ‘시종들’이 아니라 호위병/친위대이며, 이를 바로잡아야 합니다. 또한 δακτυλήθρας는 엄지에만 한정되지 않는 손가락 관련 기구이므로 ‘손가락 조임틀’이 더 안전합니다.
  naturalness: 원문의 열거 구조는 자연스럽게 유지되어 있습니다. 다만 ‘쇠손들’은 현대 한국어에서 다소 부자연스러워 ‘쇠로 된 손 모양의 기구들’로 풀고, στρεβλωτήρια도 무엇을 늘이는지 드러나도록 다듬었습니다.
  terminology: ‘투석기’는 이례적이지만 καταπέλτας의 직접적인 어휘값을 보존하는 적절한 선택입니다. 희귀한 고문 기구 명칭들의 불확실성은 각주에서 밝혀야 하며, 본문에서는 지나친 특정화를 피했습니다.
