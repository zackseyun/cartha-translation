  naturalness: ‘권하는 일을 그치자’는 명사화가 다소 무겁습니다. ‘권하기를 그치자마자’가 현대 표준 한국어 합쇼체 서술에서 더 자연스럽습니다. ‘마치 같은 영혼에서 나온 것처럼’은 원문의 비유적 표현을 자연스럽게 유지합니다.
  terminology: ‘폭군’은 τύραννος의 부정적 수사적 평가를 적절히 살립니다. ‘부정한 음식’은 위생적 의미로 한정되지 않도록 각주에서 종교적·의례적 부정을 뜻한다고 밝혀야 합니다. ψυχή는 여기서 ‘영혼’으로 유지할 수 있으며, ‘마음’으로 축소하지 않는 것이 좋습니다.
