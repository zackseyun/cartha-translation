  rationale: τύραννος의 비판적 뉘앙스를 살려 중립적인 ‘통치자’보다 ‘폭군’이 원문의 평가를 더 분명히 드러냅니다.
- source_word: συμβουλεύοντα αὐτοῖς μιεροφαγῆσαι
  english_pob_choice: urging them to eat defiling food
  chosen_korean: 그들에게 부정한 음식을 먹으라고 권하는 일
  alternatives_korean:
  - 그들에게 더러운 음식을 먹으라고 권하는 일
  - 그들에게 의례적으로 더럽혀지는 음식을 먹으라고 권하는 일
  lexicon: LSJ
  rationale: μιεροφαγῆσαι의 종교적/의례적 오염 의미를 ‘부정한 음식’으로 간결하게 살리고, συμβουλεύοντα는 강압적 맥락을 과장하지 않으면서도 ‘권하는’으로 옮겼습니다.
- source_word: διὰ μιᾶς φωνῆς ὁμοῦ, ὥσπερ ἀπὸ τῆς αὐτῆς ψυχῆς
  english_pob_choice: with one voice, as if from the same soul
  chosen_korean: 한목소리로, 마치 같은 영혼에서 나온 듯이
  alternatives_korean:
  - 한 목소리로, 마치 같은 혼에서 나온 듯이
  - 한 목소리로, 마치 같은 마음에서 나온 듯이
  lexicon: LSJ
  rationale: ‘διὰ μιᾶς φωνῆς’는 관용적으로 ‘한목소리로’가 자연스럽고, ‘ψυχή’는 단순한 심리보다 내적 전체성을 살리는 ‘영혼’이 가장 근접합니다.
theological_decisions:
- issue: μιεροφαγῆσαι의 종교적 오염 뉘앙스
  chosen_reading: ‘부정한 음식’으로 옮겨, 음식 섭취가 율법적/의례적 더러움과 연결된다는 점을 드러냈습니다.
  alternative_readings:
  - ‘더러운 음식’
  - ‘오염된 음식’
  rationale: 이 표현은 단순한 위생 문제가 아니라 종교적 부정을 가리키므로, 현대어로도 그 신학적·의례적 긴장을 보존하는 번역이 필요합니다.
  doctrine_reference: '번역 원칙: 원문 우선, 의미 보존'
