  yaml_path: translation/deuterocanon/4_maccabees/008/029.yaml
  text: So when the tyrant stopped urging them to eat defiling food[a], they all together, with one voice, as if from the same soul, said[b],
  footnotes:
  - marker: a
    text: Or 'to eat unclean food' or 'to eat polluted food.' The Greek term refers to food whose consumption would bring religious defilement.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'as if from the same soul,' expressing complete unity of resolve.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 폭군이 그들에게 부정한 음식을 먹으라고 권하는 일을 그치자, 그들은 모두 한목소리로, 마치 같은 영혼에서 나온 듯이 말했습니다[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 직역하면 ‘같은 영혼에서 나온 듯이’로, 그들의 완전한 결의의 일치를 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
