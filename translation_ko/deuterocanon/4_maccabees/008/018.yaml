lexical_decisions:
- source_word: τί
  english_pob_choice: Why
  chosen_korean: 왜
  alternatives_korean:
  - 무엇 때문에
  - 어찌하여
  lexicon: LSJ
  rationale: 수사적 책망을 담은 질문이므로, 단순한 ‘무엇’보다 현대 한국어의 ‘왜’가 충고·경고의 힘을 가장 자연스럽게 전달합니다.
- source_word: βουλήμασιν κενοῖς
  english_pob_choice: empty schemes
  chosen_korean: 텅 빈 계획
  alternatives_korean:
  - 헛된 계획
  - 공허한 궁리
  - 헛된 의도
  lexicon: LSJ
  rationale: βουλήματα는 계획·결심의 뜻을 가지며, κενοῖς의 ‘비어 있음’을 살리기 위해 ‘텅 빈’으로 옮겨 계획의 무의미함을 직설적으로 드러냅니다.
- source_word: θανατηφόρον
  english_pob_choice: death-bringing
  chosen_korean: 죽음을 가져오는
  alternatives_korean:
  - 죽음의
  - 치명적인
  - 죽음을 부르는
  lexicon: LSJ
  rationale: 합성어의 문자적 의미인 ‘죽음을 가져오는’을 유지해, 단순한 형용사 ‘치명적인’보다 원문의 구성과 경고성을 더 투명하게 보여 줍니다.
- source_word: ἀπειθίαν
  english_pob_choice: disobedience
  chosen_korean: 불순종
  alternatives_korean:
  - 순종 거부
  - 반항
  - 배반
  lexicon: LSJ
  rationale: ἀπειθία는 기본적으로 복종하지 않음이므로 ‘불순종’이 가장 직접적이며, ‘반항’이나 ‘배반’처럼 의미를 과도하게 확대하지 않습니다.
theological_decisions:
- issue: 수사적 경고의 강도
  chosen_reading: ‘감히 하겠습니까’로 끝내어, 화자의 책망과 자책 섞인 경고를 한국어 문장 끝에서 유지했습니다.
  alternative_readings:
  - ‘감히 하느냐’로 더 직설적으로 처리
  - ‘감히 하겠느냐’로 반말화
  rationale: 원문의 공동체적 훈계와 수사적 압박을 살리되, 현대 합쇼체 본문에 맞게 무게를 유지하기 위해 ‘감히 하겠습니까’를 선택했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
