  - 강제로 … 먹도록 강요할 수 없었기 때문입니다
  lexicon: LSJ
  rationale: 분사구는 패배의 이유를 설명하므로 ‘할 수 없었기 때문입니다’로 인과를 분명히 했고, ἀναγκάσαι는 강제성을 살려 ‘강제로’와 함께 옮겼습니다.
- source_word: μαιροφαγῆσαι
  english_pob_choice: to eat defiling food
  chosen_korean: 더럽힌 음식을 먹게
  alternatives_korean:
