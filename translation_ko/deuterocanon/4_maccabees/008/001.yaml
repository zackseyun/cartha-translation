  text: For since in the first trial the notorious tyrant was defeated[a], being unable to compel the old man to eat defiling food,
  footnotes:
  - marker: a
    text: Or 'to eat polluted meat' or 'to eat forbidden meat.' The Greek verb is rare and points to eating food regarded as defiling under Jewish law.
    reason: lexical_alternative
translation:
  language: ko
  text: 왜냐하면 악명 높은 그 폭군은 첫 번째 시험에서 패배하였는데, 이는 그 노인에게 부정한 음식을 먹도록 강요할 수 없었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘부정한 고기를 먹다’ 또는 ‘금지된 고기를 먹다’로 옮길 수 있습니다. 이 희귀한 그리스어 동사는 유대 율법상 부정하게 여겨지는 음식을 먹는 것을 가리킵니다.
    reason: lexical_alternative
