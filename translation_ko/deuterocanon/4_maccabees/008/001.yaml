  rationale: πεῖρα는 여기서 ‘시험/시도’의 뜻으로 쓰였으므로, 마카베오스의 순교적 시험 문맥을 살려 ‘시험’으로 옮겼습니다.
- source_word: περιφανὴς ὁ τύραννος
