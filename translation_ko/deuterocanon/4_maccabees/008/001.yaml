  - 금지된 고기를 먹게
  lexicon: LSJ
  rationale: 희귀 동사는 유대 율법 아래서 부정하게 여겨지는 음식을 먹는다는 뜻을 지니므로, 영어의 해석을 따라 ‘더럽힌 음식’으로 옮겨 정결/부정의 의미를 보존했습니다.
theological_decisions:
