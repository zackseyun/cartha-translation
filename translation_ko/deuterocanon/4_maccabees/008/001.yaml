  rationale: 본문의 강조점은 단순한 식재료가 아니라 유대 율법이 규정하는 더러움에 있으므로, 의미를 좁히지 않으면서도 신학적 긴장을 유지하는 표현이 적절합니다.
  doctrine_reference: 정결/부정과 율법적 순종의 문맥
