  rationale: τύραννος는 단순한 ‘통치자’보다 ‘폭군’이 원문의 정치·도덕적 뉘앙스를 더 잘 보존합니다. περιφανής는 맥락상 긍정적 의미보다 공적으로 두드러진 존재를 가리키므로 ‘유명한’으로 자연스럽게 반영했습니다.
- source_word: μὴ δυνηθεὶς ἀναγκάσαι
  english_pob_choice: being unable to compel
  chosen_korean: 강제로 … 먹게 할 수 없었기 때문입니다
  alternatives_korean:
