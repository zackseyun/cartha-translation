  yaml_path: translation/deuterocanon/4_maccabees/008/015.yaml
  text: But when they heard the inducements and saw the tortures[a], they not only were not afraid, but even reasoned philosophically with the tyrant[c][b],
  footnotes:
  - marker: a
    text: Or 'the persuasions' or 'the enticements.' The Greek term refers to attempts to win them over before or alongside threats.
    reason: lexical_alternative
  - marker: b
    text: Literally 'terrible things'; in context this refers to the tortures or horrors set before them.
    reason: lexical_alternative
  - marker: c
    text: The Greek says 'philosophized against the tyrant,' preserving the book's emphasis on reasoned philosophical resistance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들이 유인하는 말들을 듣고 고문을 보았을 때, 그들은 조금도 두려워하지 않았을 뿐 아니라, 오히려 폭군에게 철학적으로 맞섰습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘유인하는 말들’은 ἐπαγωγὰς의 설득·회유·유혹의 폭넓은 의미를 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘고문’은 직역하면 ‘무서운 것들’에 가까운 δεινά를 순교 문맥에 맞게 풀어 옮긴 것입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘철학적으로 맞섰습니다’는 원문의 ἀντεφιλοσόφησαν, 곧 ‘철학적으로 대항하다’는 표현을 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαγωγὰς
  english_pob_choice: the inducements
  chosen_korean: 유인하는 말들
  alternatives_korean:
  - 설득
  - 회유
  - 유혹
  lexicon: LSJ
  rationale: 여기서는 협박과 함께 사람을 끌어들이려는 시도를 가리키므로, 단순한 ‘설득’보다 의미를 드러내는 ‘유인하는 말들’이 원문과 영어 POB의 뉘앙스를 함께 살립니다.
- source_word: δεινά
  english_pob_choice: the tortures
  chosen_korean: 고문
  alternatives_korean:
  - 무서운 일들
  - 참혹한 일들
  - 고통
  lexicon: LSJ
  rationale: 문자적으로는 ‘무서운 것들’이지만, 순교 문맥상 실제로 가해지거나 보이는 형벌과 고통을 뜻하므로 자연스럽고 구체적인 ‘고문’이 적절합니다.
- source_word: ἀντεφιλοσόφησαν
  english_pob_choice: reasoned philosophically with the tyrant
  chosen_korean: 철학적으로 맞섰습니다
  alternatives_korean:
  - 철학적으로 논박했습니다
  - 이성적으로 맞섰습니다
  - 철학을 들어 맞섰습니다
  lexicon: LSJ
  rationale: 원문의 φιλοσοφ- 요소를 살리면서도 한국어에서 어색하지 않도록 ‘철학적으로’와 대립·대응의 동사 ‘맞섰습니다’를 결합했습니다.
- source_word: τῷ τυράννῳ
  english_pob_choice: the tyrant
  chosen_korean: 폭군
  alternatives_korean:
  - 군주
  - 전제자
  lexicon: BDAG
  rationale: 그리스어가 단순한 왕이 아니라 도덕적으로 규정된 ‘tyrant’를 가리키므로, 평가를 약화시키지 않는 ‘폭군’이 적절합니다.
theological_decisions:
- issue: 4 Maccabees의 철학 언어를 한국어에서 어떻게 살릴지
  chosen_reading: ‘철학적으로 맞섰습니다’로 철학적 저항의 성격을 본문에 유지했습니다.
  alternative_readings:
  - ‘이성적으로 맞섰습니다’처럼 더 일반화하기
  - ‘논리적으로 반박했습니다’로 평이하게 바꾸기
  rationale: 이 책은 순교를 단순한 논쟁이 아니라 철학적 덕성과 이성의 실천으로 제시하므로, φιλοσοφ- 계열의 표현을 약화시키지 않는 것이 본문 의도를 더 잘 보존합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 5
