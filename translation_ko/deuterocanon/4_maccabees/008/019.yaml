lexical_decisions:
- source_word: οὐ φοβησόμεθα
  english_pob_choice: Shall we not fear
  chosen_korean: 우리가 두려워하겠습니까
  alternatives_korean:
  - 우리가 두려워하지 않겠습니까
  - 우리는 두려워하지 않겠습니까
  lexicon: BDAG
  rationale: 미래형의 수사적 질문을 한국어에서 자연스럽게 살리기 위해 반문형으로 옮겼습니다. 단순한 평서문보다 권면의 긴장감이 유지됩니다.
- source_word: ἄνδρες ἀδελφοί
  english_pob_choice: brothers
  chosen_korean: 형제들아
  alternatives_korean:
  - 형제들이여
  - 형제들
  lexicon: BDAG
  rationale: 남성 복수 호격의 직접 부름을 살리면서도 한국어에서 가장 자연스러운 호격형으로 옮겼습니다. '남자 형제들'처럼 직역하지 않고 호소의 어조를 우선했습니다.
- source_word: τὰ βασανιστήρια
  english_pob_choice: the tortures
  chosen_korean: 고문
  alternatives_korean:
  - 고문들
  - 고문 형벌
  lexicon: BDAG
  rationale: 문맥상 고문/고문형벌을 가리키므로 현대 한국어에서 즉각 이해되는 '고문'을 택했습니다. 복수성은 문맥과 뒤의 병렬 구조가 충분히 전달합니다.
- source_word: τὴν κενοδοξίαν ταύτην καὶ ὀλεθροφόρον ἀλαζονίαν
  english_pob_choice: this empty glory and deadly arrogance
  chosen_korean: 이 공허한 영광과 파멸을 불러오는 오만
  alternatives_korean:
  - 이 헛된 영광과 죽음을 부르는 오만
  - 이 공허한 자랑과 파멸을 가져오는 오만
  lexicon: BDAG
  rationale: κενοδοξία는 단순한 '헛된 자랑'보다 '공허한 영광'이 어휘 대조를 더 살립니다. ὀλεθροφόρος와 ἀλαζονία는 의미를 살려 '파멸을 불러오는 오만'으로 옮겼습니다.
theological_decisions:
- issue: 수사적 질문의 형식
  chosen_reading: 세 개의 병렬 동사를 모두 반문형으로 유지해, 두려움과 회피를 거부하는 권면의 힘을 보존했습니다.
  alternative_readings:
  - 평서문으로 바꾸어 '우리는 두려워하지 않습니다… 피하겠습니다'라고 옮김
  rationale: 그리스어의 반문은 단순 진술이 아니라 공동체를 결단으로 이끄는 호소이므로, 한국어에서도 질문형이 본문의 압력을 가장 잘 전달합니다.
  doctrine_reference: 번역 철학 §1, §6
