translation:
  language: ko
  text: 형제 여러분, 우리가 고문을 두려워하고, 고문의 위협을 헤아리며, 이 헛된 허영과 파멸을 가져오는 오만을 피하겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘헛된 허영’은 ‘헛된 영광’으로도 옮길 수 있습니다.
