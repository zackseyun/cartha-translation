  lexicon: BDAG
  rationale: 문맥상 고문/고문형벌을 가리키므로 현대 한국어에서 즉각 이해되는 '고문'을 택했습니다. 복수성은 문맥과 뒤의 병렬 구조가 충분히 전달합니다.
- source_word: τὴν κενοδοξίαν ταύτην καὶ ὀλεθροφόρον ἀλαζονίαν
  english_pob_choice: this empty glory and deadly arrogance
  chosen_korean: 이 공허한 영광과 파멸을 불러오는 오만
  alternatives_korean:
  - 이 헛된 영광과 죽음을 부르는 오만
  - 이 공허한 자랑과 파멸을 가져오는 오만
  lexicon: BDAG
  rationale: κενοδοξία는 단순한 '헛된 자랑'보다 '공허한 영광'이 어휘 대조를 더 살립니다. ὀλεθροφόρος와 ἀλαζονία는 의미를 살려 '파멸을 불러오는 오만'으로 옮겼습니다.
theological_decisions:
- issue: 수사적 질문의 형식
  chosen_reading: 세 개의 병렬 동사를 모두 반문형으로 유지해, 두려움과 회피를 거부하는 권면의 힘을 보존했습니다.
  alternative_readings:
  - 평서문으로 바꾸어 '우리는 두려워하지 않습니다… 피하겠습니다'라고 옮김
  rationale: 그리스어의 반문은 단순 진술이 아니라 공동체를 결단으로 이끄는 호소이므로, 한국어에서도 질문형이 본문의 압력을 가장 잘 전달합니다.
  doctrine_reference: 번역 철학 §1, §6
