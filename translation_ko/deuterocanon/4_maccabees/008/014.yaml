  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 δίκη를 「의」로 옮기면 한국어에서 ‘의로움/의(義)’로 읽히기 쉬워, 여기서 인격화되어 경외되고 호의를 보이는 ‘justice’의 뜻을 충분히 드러내지 못합니다. 「정의」가 더 직접적입니다. παρανομήσασιν은 일반적으로 ‘법을 어기다’이므로 문맥상 가능한 「율법」보다 원문의 비특정성을 보존한 「법」이 안전합니다.
  naturalness: 「말을 가로채며 말했습니다」는 동작과 발화 동사가 겹쳐 다소 무겁습니다. 「끼어들어 말했습니다」가 현대 한국어 합쇼체 서술에서 자연스럽습니다. 「정의가 … 자비로울 것입니다」는 원문의 의인화와 조건적 호소를 자연스럽게 보존합니다.
  terminology: τύραννος의 「폭군」, Μειράκια의 「젊은이들아」, φοβήθητε의 「두려워하십시오」는 적절합니다. δίκη의 본문 번역은 「정의」로 수정하고, ‘벌/판결’의 가능한 의미는 해당 낱말에 직접 거는 각주에서 밝혀야 합니다.
