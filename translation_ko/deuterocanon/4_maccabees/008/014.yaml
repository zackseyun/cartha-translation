theological_decisions:
- issue: δίκη의 의미 범위와 ‘자비로울 것입니다’의 연결
  chosen_reading: ‘의’가 강요 아래의 위반을 자비롭게 보아줄 수 있다는 의미로 읽었습니다.
  alternative_readings:
  - ‘벌’이 너희에게 관대할 것이다
  - ‘판결’이 너희에게 유리할 것이다
  rationale: σέβεσθε(경외하다)와 결합된 δίκη는 단순 형벌보다 경외의 대상이 되는 도덕적 질서를 뜻할 가능성이 크므로, 해석을 과도하게 좁히지 않고 긴장을 보존했습니다.
  doctrine_reference: 의와 자비의 긴장을 보존하는 번역 원칙
- issue: ἵλεως의 정서적 강도
  chosen_reading: ‘자비로울 것입니다’로 완곡하면서도 긍정적인 호의의 의미를 살렸습니다.
  alternative_readings:
  - 호의적일 것입니다
  - 유리할 것입니다
  rationale: 본문의 호소는 엄밀한 법정 용어보다, 강요된 위반에 대한 관대한 태도를 암시하므로 한국어에서는 교리적 단정 없이 자비의 방향을 드러냈습니다.
  doctrine_reference: 문맥 중심의 정서·법정 어휘 보존
