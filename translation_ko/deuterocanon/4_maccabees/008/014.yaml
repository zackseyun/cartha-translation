  text: But the tyrant interrupted and said[a], “Young men, be afraid, and the justice you revere will be merciful to you if, under compulsion, you break the law.”
  footnotes:
  - marker: a
    text: Or 'the penalty/judgment you revere will be favorable to you.' The Greek δίκη can denote justice, judgment, or penalty.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 폭군이 말을 가로채며 말했습니다. 「젊은이들아, 두려워하십시오. 그리고 너희가 경외하는 그 의는, 너희가 강요를 받아 율법을 어긴다면 너희에게 자비로울 것입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희가 경외하는 벌/판결은 너희에게 유리할 것입니다.’ 그리스어 δίκη는 의, 판결, 벌을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπολαβών
  english_pob_choice: interrupted
  chosen_korean: 말을 가로채며
