  rationale: 직접 호격의 청유적 호소를 살리면서도, 지나치게 유치하거나 과도하게 시대적이지 않은 자연스러운 표현을 택했습니다.
- source_word: δίκην
  english_pob_choice: justice
  chosen_korean: 의
  alternatives_korean:
