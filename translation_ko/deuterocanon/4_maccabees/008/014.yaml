  text: But the tyrant interrupted and said[a], “Young men, be afraid, and the justice you revere will be merciful to you if, under compulsion, you break the law.”
  footnotes:
  - marker: a
    text: Or 'the penalty/judgment you revere will be favorable to you.' The Greek δίκη can denote justice, judgment, or penalty.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 폭군이 끼어들어 말했습니다. 「젊은이들아, 두려워하십시오. 너희가 경외하는 정의[a]는 너희가 강요를 받아 법을 어긴다면 너희에게 자비로울 것입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘벌’ 또는 ‘판결’. 그리스어 δίκη는 정의, 판결, 벌을 뜻할 수 있습니다.
    reason: lexical_alternative
