  yaml_path: translation/deuterocanon/4_maccabees/008/026.yaml
  text: Why has such contentiousness been instilled in us[a], and why does deadly endurance please us, when it is possible to live in tranquility by obeying the king, after becoming afraid of the tortures that lead to death?
  footnotes:
  - marker: a
    text: The Greek opening is syntactically difficult in Swete's witness; the sense is that quiet life was available if they gave way out of fear of the death-dealing tortures.
    reason: textual_variant
translation:
  language: ko
  text: 왜 우리 안에 이처럼 완고한 다툼이 심겨졌으며, 왜 죽음을 부르는 인내가 우리를 기쁘게 합니까? 왕에게 순종하면 죽음으로 이어지는 고문을 두려워한 뒤에도, 평온하게 살아갈 수 있는데도 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 어순이 다소 난해하므로, 여기서는 ‘죽음으로 이어지는 고문을 두려워한 뒤에도’라는 뜻으로 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: πόθεν
  english_pob_choice: Why
  chosen_korean: 왜
  alternatives_korean:
  - 어찌하여
  - 무슨 까닭으로
  lexicon: LSJ
  rationale: 수사적인 원인 질문이므로, 자연스러운 표준어인 ‘왜’로 원인·이유의 뉘앙스를 살렸습니다.
- source_word: ἡ τοσαύτη ἐντέτηκεν φιλονεικία
  english_pob_choice: has such contentiousness been instilled in us
  chosen_korean: 이처럼 완고한 다툼이 심겨졌으며
  alternatives_korean:
  - 이처럼 다툼이 심어졌으며
  - 이처럼 시비를 좋아하는 성향이 들어왔으며
  lexicon: LSJ
  rationale: φιλονεικία의 부정적·분쟁적 성격을 살려 ‘다툼’으로 옮기고, ἐντέτηκεν의 안으로 스며든 느낌은 ‘심겨졌으며’로 표현했습니다.
- source_word: ἡ θανατηφόρος ἀρέσκει καρτερία
  english_pob_choice: deadly endurance please us
  chosen_korean: 죽음을 부르는 인내가 우리를 기쁘게 합니까
  alternatives_korean:
  - 죽음에 이르게 하는 인내가 우리를 즐겁게 합니까
  - 죽음에 이르는 끈기가 우리에게 좋게 보입니까
  lexicon: LSJ
  rationale: θανατηφόρος는 단순히 ‘죽음과 관련된’ 것이 아니라 ‘죽음을 일으키는/불러오는’ 뉘앙스이므로 ‘죽음을 부르는’으로, καρτερία는 맥락상 ‘인내’로 옮겼습니다.
- source_word: τῷ βασιλεῖ πεισθέντας
  english_pob_choice: by obeying the king
  chosen_korean: 왕에게 순종하면
  alternatives_korean:
  - 왕에게 굴복하면
  - 왕의 말을 따르면
  lexicon: LSJ
  rationale: πεισθέντας는 ‘설득되다’와 ‘복종하다’가 겹치지만, 군주를 대상으로 할 때는 실제적 의미가 복종이므로 ‘순종하다’로 풀었습니다.
- source_word: μετὰ ἀταραξίας ζῆν
  english_pob_choice: to live in tranquility
  chosen_korean: 평온하게 살아갈 수 있는데도
  alternatives_korean:
  - 아무 동요 없이 살 수 있는데도
  - 마음의 평정을 누리며 살아갈 수 있는데도
  lexicon: LSJ
  rationale: ἀταραξία의 핵심인 ‘흔들림 없음, 동요 없음’을 현대 한국어에서 자연스럽게 전달하는 말로 ‘평온하게’와 ‘살아갈 수 있는데도’를 선택했습니다.
theological_decisions:
- issue: 왕에게 순종하는 삶과 죽음으로 이어지는 고문 사이의 대조
  chosen_reading: 본문의 조롱 섞인 유혹을 그대로 살려, 순교적 인내를 미화하지 않고 왕에게 굴복하는 ‘평온한 삶’의 제안을 드러냈습니다.
  alternative_readings:
  - 인내를 긍정적으로 읽어 순교적 용기로 번역
  - ‘평온’ 대신 ‘평화’로 순화
  rationale: 이 발언은 왕의 회유/압박 화법이므로, 문맥상 칭찬이 아니라 유혹의 대조를 보존하는 것이 원문 의미에 가깝습니다.
  doctrine_reference: 문맥 우선 원칙; 서술자 승인과 발화자 수사를 구분함
