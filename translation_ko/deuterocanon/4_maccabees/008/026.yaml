  verdict: revise
  source_fidelity: 수정이 필요합니다. Swete 본문의 첫 절은 ‘φοβηθέντας τὰ βασανιστήρια’를 목적어로 취하는 ‘θανατοῖ’의 구문이며, 초안처럼 뒤의 ‘왕에게 순종하면’ 및 ‘평온하게 살 수 있다’에 붙여 ‘두려워한 뒤에도’로 옮길 수 없습니다. 본문은 이 구문의 명시적 주어를 제시하지 않으므로 한국어에서도 주어를 보충하지 않고 유지했습니다.
  naturalness: ‘완고한 다툼’은 다소 부자연스럽고 φιλονεικία의 성향적 의미도 약해집니다. ‘이처럼 다투려는 마음’은 현대 표준어로 자연스러우면서도 부정적 수사라는 문맥을 보존합니다. ‘평온히 살 수 있는데’는 간결하고 자연스럽습니다.
  terminology: καρτερία는 ‘인내’, θανατηφόρος는 발화자의 적대적 규정에 맞추어 ‘죽음을 부르는’으로 유지했습니다. πεισθέντας는 왕에 대한 실제적 복종의 뜻으로 ‘왕에게 순종하여’로 옮겼습니다. 첫 절의 불명시적 주어는 신학적·해석적 보충 없이 처리했습니다.
  issues:
  - severity: high
    issue: ‘죽음으로 이어지는 고문을 두려워한 뒤에도’가 본문의 구문 관계를 바꿉니다.
    rationale: φοβηθέντας τὰ βασανιστήρια는 θανατοῖ와 연결되어 있으며, ‘두려워한 뒤에도’는 양보·시간 관계를 추가하고 이를 뒤 절에 종속시킵니다.
  - severity: medium
    issue: ‘완고한 다툼’은 φιλονεικία의 내적 성향을 충분히 드러내지 못하고 한국어로도 다소 어색합니다.
    rationale: φιλονεικία는 단일한 다툼 사건보다 다툼·논쟁을 좋아하는 성향을 가리킵니다.
  - severity: medium
    issue: 각주가 본문의 첫 절을 ‘두려워한 뒤에도’로 해석하도록 유도합니다.
    rationale: 어순의 난해함은 인정할 수 있으나, 각주는 원문에 없는 시간·양보 관계를 확정해서는 안 됩니다.
  revised_text: 고문을 두려워한 사람들을 죽음에 이르게 합니다. 그런데 어찌 우리 안에 이처럼 다투려는 마음이 스며들었으며, 어찌 죽음을 부르는 인내가 우리를 기쁘게 합니까? 왕에게 순종하여 평온히 살 수 있는데도 말입니다.[a]
  revised_footnotes:
  - marker: a
    text: 그리스어 첫 절은 명시된 주어 없이 ‘고문을 두려워한 사람들을 죽음에 이르게 한다’라고 말합니다. 이어지는 문장은 왕에게 순종하면 평온히 살 수 있다는 회유성 질문입니다.
    reason: source_note
  revision_rationale: 첫 절을 뒤 절에 부당하게 연결한 시간·양보 표현을 제거하고, Swete 본문의 구문적 불명시성을 보존했습니다. 또한 φιλονεικία를 자연스러운 현대 한국어로 조정하되, 왕의 부정적·조롱하는 어조와 ‘죽음을 부르는 인내’라는 적대적 규정은 유지했습니다.
