    reason: textual_variant
lexical_decisions:
- source_word: ἐλεήσωμεν
  english_pob_choice: Let us have mercy
  chosen_korean: 불쌍히 여기고
  alternatives_korean:
  - 자비를 베풀고
  - 긍휼을 베풀고
  - 가엾이 여기고
  lexicon: BDAG
  rationale: 호소하는 공동체적 청유형으로서 ‘have mercy’의 정서를 살리되, 한국어에서는 대상에 대한 연민을 직접 드러내는 ‘불쌍히 여기다’가 가장 자연스럽습니다.
- source_word: τὰς ἑαυτῶν ἡλικίας
  english_pob_choice: our own youth
  chosen_korean: 우리의 젊은 날
  alternatives_korean:
  - 우리의 나이
  - 우리의 청년 시절
  - 우리의 젊은 시기
  lexicon: LSJ
  rationale: ἡλικία는 나이 자체보다 생애의 시기나 젊은 시절을 가리킬 수 있으므로, 문맥의 절박함을 살려 ‘젊은 날’로 옮겼습니다.
- source_word: κατοικτειρήσωμεν
  english_pob_choice: let us pity
  chosen_korean: 가엾이 여기고
  alternatives_korean:
  - 측은히 여기고
  - 불쌍히 여기고
  - 동정하고
  lexicon: LSJ
  rationale: 앞의 동사와 나란히 놓인 청유형의 또 다른 연민 표현이므로, 반복을 피하면서도 정서가 살아 있는 ‘가엾이 여기다’를 택했습니다.
- source_word: τὸ τῆς μητρὸς
  english_pob_choice: our mother’s old age
  chosen_korean: 우리 어머니의 노년
  alternatives_korean:
  - 우리 어머니의 늙으심
  - 우리 어머니의 노쇠함
  - 우리 어머니의 늙은 상태
  lexicon: LSJ
  rationale: 전승 본문은 생략이 있어 영어 POB처럼 문맥적 보충이 필요합니다. 여기서는 ‘old age’에 해당하는 가장 자연스러운 현대 한국어로 ‘노년’을 사용했습니다.
