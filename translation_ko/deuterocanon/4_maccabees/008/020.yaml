  chosen_reading: 도덕적 훈계가 아니라 절박한 연민의 호소로 읽히도록 ‘불쌍히 여기고 / 가엾이 여기고’의 이중 표현을 유지했습니다.
  alternative_readings:
  - 자비를 베풀고 / 동정하고
  - 긍휼을 베풀고 / 측은히 여기고
  rationale: 본문은 행동 지시보다 감정적 공감을 촉구하는 수사이므로, 종교적 관용구보다 직접적인 연민 표현이 원뜻을 더 잘 드러냅니다.
  doctrine_reference: 수사적 청유와 연민의 윤리
