  source_fidelity: 그리스어의 두 청유법(ἐλεήσωμεν, κατοικτειρήσωμεν)을 ‘…여기자’라는 공동 청유로 정확히 반영했습니다. τὰς ἑαυτῶν ἡλικίας는 문맥상 각자의 젊음/젊은 삶을 뜻하며 ‘우리의 젊은 날’은 적절합니다. τὸ τῆς μητρὸς의 명사 생략에 대하여 ‘우리 어머니의 노년’으로 문맥적 보충을 하되 각주로 불확실성을 밝혀 원문의 생략성을 보존했습니다.
  naturalness: ‘우리의 젊은 날을 불쌍히 여기고, 우리 어머니의 노년을 가엾이 여기자’는 현대 표준 한국어로 자연스럽고 합쇼체 계열의 청유 표현에도 부합합니다. 두 연민 동사의 반복은 원문의 병렬과 수사적 강조를 자연스럽게 드러냅니다.
  terminology: ‘불쌍히 여기다’와 ‘가엾이 여기다’는 각각 ἐλεέω와 κατοικτείρω의 연민 의미를 무리 없이 전달합니다. ‘노년’은 문맥상 보충된 표현임을 각주에서 충분히 명시하므로 적절합니다.
