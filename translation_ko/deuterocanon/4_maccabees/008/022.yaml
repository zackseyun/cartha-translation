  source_fidelity: 수정이 필요합니다. 미래형 συγγνώσεται는 ‘용서할 것입니다’로 옮겨야 하나, 초안의 ‘용서하십니다’는 현재형입니다. 또한 διʼ ἀνάγκην과 φοβηθεῖσιν은 강요·불가피한 상황에서 왕을 두려워하게 된 일을 가리키므로, ‘그런 두려움’이라는 지시어를 보태지 않고 그 관계를 직접 나타내는 편이 충실합니다.
