  terminology: θεία δίκη는 ‘신적 정의’로 옮겨 θεία의 비소유격 표현과 δίκη의 정의·심판·형벌 범위를 보존합니다. 각주에서는 ‘신적 심판’ 및 ‘신적 형벌’의 가능한 의미를 제시하되, 형벌이 ‘용서한다’고 말하는 부자연스러움은 ‘우리에게 형벌을 내리지 않을 것이다’로 풀어 밝혔습니다.
