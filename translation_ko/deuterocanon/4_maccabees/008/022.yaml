  yaml_path: translation/deuterocanon/4_maccabees/008/022.yaml
  text: But divine justice will also pardon us if[a], under compulsion, we become afraid of the king.
  footnotes:
  - marker: a
    text: Or 'the divine judgment will also forgive us' or 'divine punishment will spare us.' The Greek δίκη can mean justice, judgment, or penalty.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 신적인 의는 우리도 용서하십니다[a] — 우리가 강제로 그런 두려움에 사로잡혀 왕을 두려워했기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘신적인 판단이 우리를 용서하실 것이다’ 혹은 ‘신적인 형벌이 우리를 그냥 두실 것이다’. 그리스어 δίκη는 의, 심판, 형벌을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: συγγνώσεται
  english_pob_choice: will pardon
  chosen_korean: 용서하십니다
  alternatives_korean:
  - 사면하십니다
  - 너그러이 봐주십니다
  - 용납하십니다
  lexicon: LSJ
  rationale: 여기서는 προσωπ적 대상 ἡμῖν을 향한 허용·면제의 뉘앙스가 있어, 한국어에서는 법정적이면서도 관계적인 ‘용서’가 가장 자연스럽습니다. '사면'은 지나치게 형벌 중심이고, '봐주다'는 구어체라 본문 격식에 맞지 않습니다.
- source_word: ἡ θεία δίκη
  english_pob_choice: divine justice
  chosen_korean: 신적인 의
  alternatives_korean:
  - 하나님의 의
  - 신적인 심판
  - 신적인 판단
  lexicon: LSJ
  rationale: δίκη는 정의, 심판, 형벌의 뜻을 함께 가질 수 있지만, 여기서는 ‘용서하다’의 주체로 인격화되어 있습니다. 그래서 긴 설명 없이도 공의와 판단의 긴장을 살릴 수 있는 ‘신적인 의’를 택했습니다.
- source_word: διʼ ἀνάγκην
  english_pob_choice: under compulsion
  chosen_korean: 우리가 강제로 그런 두려움에 사로잡혀
  alternatives_korean:
  - 강요를 받아
  - 부득이하게
  - 어쩔 수 없이
  lexicon: LSJ
  rationale: 문맥상 단순한 사정 설명이 아니라, 강제성 아래에서 생긴 두려움을 가리킵니다. 그래서 원문의 압박감을 살리되 한국어로는 자연스럽게 ‘강제로’와 뒤의 두려움 표현을 연결했습니다.
- source_word: φοβηθεῖσιν
  english_pob_choice: became afraid
  chosen_korean: 두려워했기 때문입니다
  alternatives_korean:
  - 무서워했기 때문입니다
  - 겁을 먹었기 때문입니다
  - 두려움에 떨었기 때문입니다
  lexicon: LSJ
  rationale: aorist passive participle의 사건성은 원인절로 풀어 ‘-했기 때문입니다’로 옮겼습니다. ‘두려워하다’는 문어체 합쇼체에서 가장 균형이 좋고, 왕에 대한 감정의 직접성을 보존합니다.
theological_decisions:
- issue: δίκη를 ‘심판/형벌’로 좁힐지, 더 넓은 ‘의’로 둘지
  chosen_reading: 신적인 의
  alternative_readings:
  - 신적인 심판
  - 신적인 형벌
  rationale: 본문은 강제된 두려움 아래의 행위를 언급하면서도 그럼에도 ‘용서’가 가능하다고 말합니다. 따라서 하나님의 공의가 상황을 고려하는 방식이라는 긴장을 유지하려면, 형벌로만 좁히기보다 더 넓은 ‘의’가 적절합니다.
  doctrine_reference: 하나님의 공의와 사정 고려의 긴장 보존
- issue: θεία의 번역을 ‘하나님의’로 명시할지, ‘신적인’으로 유지할지
  chosen_reading: 신적인 의
  alternative_readings:
  - 하나님의 의
  rationale: 여기서는 인격화된 δίκη의 표현을 살리기 위해 굳이 소유격으로 풀지 않았습니다. ‘하나님의 의’는 의미는 분명하지만, 원문의 수사적 거리감과 문장 균형을 조금 약화시킵니다.
  doctrine_reference: 원문의 인격화된 표현 보존
