theological_decisions:
- issue: 단독 명사구 γῆρας의 처리
  chosen_reading: 앞절에서 이어진 문맥이 생략된 채 ‘늙음이요’로 끊어지는 문장 파편성을 보존했습니다.
  alternative_readings:
  - ‘늙어서’로 매끈하게 보완하는 읽기
  - ‘노년이 다가오니’처럼 보충하는 읽기
  rationale: 원문은 의미를 완결시키지 않고 abrupt하게 시작하므로, 해설적 보충을 넣지 않는 편이 본문 수사와 긴장을 더 정확히 전달합니다.
  doctrine_reference: 문학적 형식 보존 원칙
- issue: ἀπειθοῦντες를 조건으로 옮기는 방식
  chosen_reading: ‘우리가 불순종하면’으로 조건문화했습니다.
  alternative_readings:
  - ‘불순종하면서’
  - ‘불순종하는 자로서’
  rationale: 영어 POB가 지적한 것처럼 헬라어 분사는 형식상 분사지만, 이 문맥에서는 경고의 결과를 선명하게 드러내는 조건문이 독자 이해에 가장 충실합니다.
  doctrine_reference: 문맥 우선 번역 원칙
