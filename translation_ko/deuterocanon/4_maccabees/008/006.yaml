base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/006.yaml
  text: I urge you, by agreeing with me, to enjoy my friendship[a]; for just as I have power to punish those who disobey my commands[b], so also to do good to those who obey me well.
  footnotes:
  - marker: a
    text: Or 'by yielding to me' or 'by consenting with me'; the Greek participle is somewhat difficult, but it clearly calls for compliance with the speaker.
    reason: lexical_alternative
  - marker: b
    text: '''My friendship'' may also be understood in a royal-patronal sense as ''my favor.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 저와 뜻을 같이하여 저의 우정을 누리십시오[a]. 왜냐하면 제가 제 명령에 불복종하는 자들을 벌할 힘이 있는 것처럼, 저에게 잘 순종하는 자들에게도 선을 베풀 힘이 있기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘저에게 동의하여/양보하여’에 가깝습니다. 이 분사구는 화자에게의 순응을 요구하는 다소 어려운 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλῶ
  english_pob_choice: I urge
  chosen_korean: 저와 뜻을 같이하여 … 누리십시오
  alternatives_korean:
  - 권합니다
  - 간청합니다
  - 촉구합니다
  lexicon: LSJ / BDAG
  rationale: 왕이 하는 직접 호소이므로 단순한 요청보다 압박감 있는 권면을 살렸습니다. 한국어에서는 뒤의 목적절과 자연스럽게 이어지도록 명령형으로 풀었습니다.
- source_word: συνείξαντάς μοι
  english_pob_choice: by agreeing with me
  chosen_korean: 저와 뜻을 같이하여
  alternatives_korean:
  - 저에게 동의하여
  - 저에게 양보하여
  - 저에게 순응하여
  lexicon: LSJ
  rationale: 분사구는 본문에서 ‘함께 동의/양보하는 것’을 뜻하는 어려운 표현이므로, 합쇼체 한국어에서 의미를 분명히 하면서도 과도한 해석을 피하는 ‘뜻을 같이하여’로 옮겼습니다.
- source_word: τῆς ἐμῆς ἀπολαῦσαι φιλίας
  english_pob_choice: to enjoy my friendship
  chosen_korean: 저의 우정을 누리십시오
  alternatives_korean:
  - 저의 친분을 누리십시오
  - 저의 호의를 누리십시오
  - 저의 은혜를 누리십시오
  lexicon: LSJ
  rationale: φιλία의 기본 의미를 살리되 왕과 신하 사이의 후원적 뉘앙스를 지나치게 풀지 않기 위해 ‘우정’을 택했습니다. ‘누리다’는 ἀπολαύω의 ‘즐기다/향유하다’에 맞습니다.
- source_word: τοὺς ἀπειθοῦντάς μου τοῖς ἐπιτάγμασιν
  english_pob_choice: those who disobey my commands
  chosen_korean: 제 명령에 불복종하는 자들
  alternatives_korean:
  - 제 명령을 거역하는 자들
  - 제 명령을 따르지 않는 자들
  - 제 칙령에 불복종하는 자들
  lexicon: BDAG
  rationale: ἀπειθέω는 단순 미이행보다 ‘불복종/불신종’의 강한 거부를 드러내므로 이를 살렸습니다. ἐπιτάγματα는 여기서 왕의 명령을 가리키므로 ‘명령’이 가장 직접적입니다.
- source_word: εὐεργετεῖν
  english_pob_choice: to do good to
  chosen_korean: 선을 베풀
  alternatives_korean:
  - 호의를 베풀
  - 좋은 일을 해주
  - 은혜를 베풀
  lexicon: BDAG
  rationale: 동사의 일반적 의미인 ‘좋은 일을 하다/유익을 주다’를 그대로 살려, 보상이나 감정적 호의로 좁히지 않았습니다.
- source_word: τοὺς εὐπειθοῦντάς μου
  english_pob_choice: those who obey me well
  chosen_korean: 저에게 잘 순종하는 자들
  alternatives_korean:
  - 저에게 순종하는 자들
  - 저에게 기꺼이 순종하는 자들
  - 저에게 쉽게 따르는 자들
  lexicon: LSJ
  rationale: εὐπειθέω의 εὐ-가 주는 ‘잘/잘 기꺼이’의 뉘앙스를 살려 단순한 ‘순종하는 자들’보다 한 단계 더 적극적인 순응을 표현했습니다.
theological_decisions:
- issue: φιλία의 왕권적 의미
  chosen_reading: ‘우정’으로 옮기되, 왕과 신하 사이의 후원적 관계를 암시하는 표현으로 읽히게 했습니다.
  alternative_readings:
  - 호의
  - 친분
  - 은총
  rationale: 본문은 개인적 친밀감만이 아니라 복종에 따른 왕의 은혜로운 수용을 말하므로, 한국어 본문에서는 ‘우정’을 유지하되 문맥이 권력 관계임을 잃지 않도록 했습니다.
  doctrine_reference: 원문 우선, 고대 수사와 후원 관계의 보존
- issue: 분사구의 순응성
  chosen_reading: ‘저와 뜻을 같이하여’로 시작해 요청의 조건성을 드러냈습니다.
  alternative_readings:
  - 저에게 동의하여
  - 저에게 순응하여
  rationale: 그리스어 분사구는 단순한 감정적 동조보다 화자에게 맞추는 실제적 순응을 요구하므로, 본문은 독자가 그 요구를 분명히 느끼도록 구성했습니다.
  doctrine_reference: 원문 구조 보존
