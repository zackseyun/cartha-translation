  source_fidelity: 본문의 「생활방식을 받아들여」는 μεταλαβόντες(부정과거 능동 분사)와 Ἑλληνικοῦ βίου(‘그리스식 삶/생활 방식’)를 문맥상 자연스럽게 옮긴 것으로, ‘그리스식 삶의 방식을 채택함’이라는 뜻을 충실히 전달합니다. 다만 현대 표준어에서는 ‘헬라식’보다 ‘그리스식’이 더 일반적이고 명료합니다.
  naturalness: ‘그리스식 생활 방식을 받아들여’는 현대 한국어에서 자연스럽고, 뒤따르는 본절의 주절에 연결되는 분사구의 미완결 형식도 보존합니다. 기존 각주의 ‘삶을 나누어 가지며’는 μεταλαμβάνω의 ‘참여하다/함께 누리다’ 가능성을 부자연스럽게 표현하므로 고치는 것이 좋습니다.
  terminology: Ἑλληνικός는 여기서 민족명 자체보다 문화적·생활양식적 성격을 나타내므로 ‘그리스식’이 적절합니다. βίος는 생물학적 생명보다 삶의 양식이므로 ‘생활 방식’으로 옮깁니다. 신학적 용어 문제는 없습니다.
  issues:
