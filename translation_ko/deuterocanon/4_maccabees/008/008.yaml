theological_decisions:
- issue: 헬라 문화 수용의 서술 방식
  chosen_reading: 본문은 단순한 문화 접촉이 아니라 삶의 방식 자체를 헬라식으로 바꾸어 받아들인 행위를 말하므로, 중립적 표현보다 행위의 전환성을 살렸습니다.
  alternative_readings:
  - 헬라 문화를 따르며
  - 헬라식 삶에 참여하며
  rationale: 문맥상 μεταλαβόντες + γενitive는 ‘부분적으로 접하다’보다 ‘그 방식에 들어가다/채택하다’의 뉘앙스가 강하므로, 의미상의 긴장을 유지해야 합니다.
  doctrine_reference: 문맥 주해
