  rationale: 반사대명사의 자기지시성을 한국어에서 가장 간결하게 드러내어, ‘자기 자신에게 연민을 베풀라’는 뜻을 분명히 합니다.
- source_word: ὁ πολέμιος
  english_pob_choice: your enemy
  chosen_korean: 너희의 원수
  alternatives_korean:
  - 너희의 적
