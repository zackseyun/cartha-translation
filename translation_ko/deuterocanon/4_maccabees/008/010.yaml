  lexicon: LSJ
  rationale: 문맥상 화자가 자기 자신을 적대적 관계로 지칭하므로, 관계를 분명히 드러내는 ‘너희의 원수’가 적절합니다.
- source_word: τῆς ἡλικίας
  english_pob_choice: because of your age
  chosen_korean: 너희의 나이 때문에
  alternatives_korean:
