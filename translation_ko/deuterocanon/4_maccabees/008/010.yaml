  lexicon: LSJ
  rationale: 아orist 명령형의 간청을 한국어 합쇼체로 자연스럽게 살리면서, 단순한 감정이 아니라 상대를 향한 연민의 촉구를 전달합니다.
- source_word: ἑαυτούς
