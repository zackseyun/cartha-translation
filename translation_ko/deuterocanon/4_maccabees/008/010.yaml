  - 너희의 연령 때문에
  lexicon: LSJ
  rationale: ἡλικία의 기본적인 ‘나이/연령’ 범위를 우선 살리되, 본문이 더 구체적으로 ‘젊음’을 가리킬 가능성은 각주로 보존합니다.
theological_decisions:
- issue: ἡλικία의 의미 범위
  chosen_reading: ‘너희의 나이’로 두고, ‘젊음’ 가능성을 각주에 보존합니다.
  alternative_readings:
  - 너희의 젊음 때문에
  - 너희의 연령 때문에
  rationale: 본문은 연령 일반을 가리킬 수 있으며, 청년기라는 더 구체적 뉘앙스는 문맥상 가능하지만 본문만으로 단정할 필요는 없습니다. 의미의 긴장을 해소하지 않고 남겨 두는 쪽이 원문에 더 가깝습니다.
  doctrine_reference: '번역 원칙: 원문 우선, 의미 범위는 과도하게 좁히지 않음.'
