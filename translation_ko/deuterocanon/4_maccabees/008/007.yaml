  text: So comply, and you will receive ruling offices over my affairs, if you renounce the ancestral ordinance of your way of life.
translation:
  language: ko
  text: 그러므로 여러분이 조상에게서 물려받은 삶의 방식의 규례를 버린다면, 내 일을 관장하는 통치 관직들을 받게 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πιστεύσατε
  english_pob_choice: So comply
  chosen_korean: 순응하십시오
  alternatives_korean:
  - 따르십시오
  - 동의하십시오
  - 믿으십시오
  lexicon: πιστεύω
  rationale: 문맥상 단순한 ‘믿다’가 아니라 요구에 ‘순응/응하다’는 뜻이므로, POB의 ‘comply’에 맞춰 명령형으로 옮겼습니다.
- source_word: ἀρχὰς ἡγεμονικὰς
  english_pob_choice: ruling offices
  chosen_korean: 다스리는 지위들
  alternatives_korean:
  - 통치 직분들
  - 지배하는 관직들
  - 권세 있는 직책들
  lexicon: ἀρχή / ἡγεμονικός
  rationale: 권력적·행정적 직위를 가리키는 복수 표현이어서, ‘office’의 제도성과 ‘ruling’의 통치성을 함께 드러냈습니다.
- source_word: τὸν πάτριον ... θεσμόν
  english_pob_choice: the ancestral ordinance of your way of life
  chosen_korean: 삶의 방식에 관한 조상 전래의 규례
  alternatives_korean:
  - 조상 대대로 내려온 삶의 규례
  - 당신들의 생활양식에 대한 조상 전통의 법도
  - 조상의 전통적 관습
  lexicon: πάτριος / θεσμός / πολιτεία
  rationale: θεσμός는 단순한 관습보다 규범·제정된 규례에 가깝고, πολιτεία는 공동체적 삶의 방식이므로 이를 함께 반영했습니다.
theological_decisions:
- issue: 회개 권유가 아니라 정치적 복종을 요구하는 문맥
  chosen_reading: 이 구절의 πιστεύσατε는 신앙적 ‘믿음’이 아니라 권위에 대한 ‘순응/복종’의 의미로 읽었습니다.
  alternative_readings:
  - 믿으십시오
  - 신뢰하십시오
  rationale: 앞뒤 문맥이 종교적 믿음이 아니라 박해 상황에서의 동조 요구이므로, 영어 POB의 ‘comply’를 유지하는 것이 원문의 힘을 보존합니다.
  doctrine_reference: 문맥 우선 원칙; 4 Maccabees 8장 전체의 서사적 대조
