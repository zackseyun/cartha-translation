- source_word: παρακαλοῦντος καὶ ἐπὶ εὐεργεσίᾳ φωνοῦντος
  english_pob_choice: urges us and calls us to receive a benefit
  chosen_korean: 우리를 권면하시고 호의를 베푸시며 부르실 때
  alternatives_korean:
  - 우리를 간절히 권하시고 은혜를 베풀겠다고 부르실 때
  - 우리를 설득하시며 은혜를 위해 부르실 때
  lexicon: LSJ
  rationale: παρακαλέω와 εὐεργεσία의 결합은 단순한 ‘초대’보다 왕의 호의와 설득을 함께 띠므로, ‘권면’과 ‘호의를 베푸시며’로 분리해 표현했습니다.
- source_word: μὴ πεισθείημεν αὐτῷ
  english_pob_choice: should we not be persuaded by him?
  chosen_korean: 우리가 그분의 말을 따르지 않겠습니까?
  alternatives_korean:
  - 우리가 그분에게 설득되지 않겠습니까?
  - 우리가 그분을 따르지 않겠습니까?
  lexicon: LSJ
  rationale: πειθώ 계열은 문맥상 ‘설득되다’와 ‘따르다/순종하다’의 뉘앙스를 함께 가지므로, 한국어에서는 자연스럽게 ‘말을 따르다’로 옮겨 응답의 함의를 살렸습니다.
theological_decisions:
- issue: 왕의 호의에 대한 응답을 ‘설득’으로만 둘지 ‘순종’의 함의까지 드러낼지
  chosen_reading: 표면적으로는 ‘그분의 말을 따르다’로 옮기되, 본문이 왕의 호의와 권면에 대한 응답을 말한다는 점을 유지했습니다.
  alternative_readings:
  - 우리가 그분에게 설득되지 않겠습니까?
  - 우리가 그분에게 순종하지 않겠습니까?
  rationale: 그리스어 πεισθείημεν은 이 장면에서 단순 인지적 설득을 넘어 실제로 따름과 수용을 포함할 수 있어, 의미 범위를 과도하게 좁히지 않도록 했습니다.
  doctrine_reference: 의미역 범위 보존
