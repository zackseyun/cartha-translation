  yaml_path: translation/deuterocanon/4_maccabees/008/017.yaml
  text: Alas for us! How miserable and utterly foolish we are! When the king urges us and calls us to receive a benefit[a], should we not be persuaded by him?
  footnotes:
  - marker: a
    text: Or, 'should we not obey him?' The Greek πεισθείημεν can carry the sense of being persuaded and, by extension, yielding or obeying.
    reason: lexical_alternative
translation:
  language: ko
  text: 아, 우리는 참으로 비참하고 너무나 어리석습니다! 왕께서 우리를 권하시고 호의를 베풀겠다고 부르시는데, 우리가 그분에게 설득되지 않겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리가 그분을 따르지 않겠습니까?” 또는 “우리가 그분에게 순종하지 않겠습니까?” 그리스어 πεισθείημεν은 ‘설득되다’에서 나아가 ‘따르다, 순종하다’라는 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ τάλανες ἡμεῖς
  english_pob_choice: Alas for us! How miserable we are!
  chosen_korean: 아, 우리야말로 얼마나 비참하고
