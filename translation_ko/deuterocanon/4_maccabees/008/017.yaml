base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/017.yaml
  text: Alas for us! How miserable and utterly foolish we are! When the king urges us and calls us to receive a benefit[a], should we not be persuaded by him?
  footnotes:
  - marker: a
    text: Or, 'should we not obey him?' The Greek πεισθείημεν can carry the sense of being persuaded and, by extension, yielding or obeying.
    reason: lexical_alternative
translation:
  language: ko
  text: 아, 우리야말로 얼마나 비참하고 너무나도 어리석습니까! 왕이 우리를 권면하시고 호의를 베푸시며 부르실 때, 우리가 그분의 말을 따르지 않겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리가 그분에게 순종하지 않겠습니까?” 그리스어 πεισθείημεν은 ‘설득되다’에서 나아가 ‘따르다, 순종하다’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ τάλανες ἡμεῖς
  english_pob_choice: Alas for us! How miserable we are!
  chosen_korean: 아, 우리야말로 얼마나 비참하고
  alternatives_korean:
  - 아, 우리는 참으로 비참하고
  - 불쌍하기도 한 우리야
  lexicon: LSJ
  rationale: Ὦ의 탄식과 τάλανες의 비참함을 함께 살리기 위해 감탄사와 자책의 형식을 취했습니다.
- source_word: λίαν ἀνόητοι
  english_pob_choice: utterly foolish
  chosen_korean: 너무나도 어리석습니다
  alternatives_korean:
  - 지극히 어리석습니다
  - 완전히 어리석습니다
  lexicon: LSJ
  rationale: λίαν의 강한 강조를 한국어 부사 ‘너무나도’로 옮겨 자기 비판의 강도를 살렸습니다.
- source_word: παρακαλοῦντος καὶ ἐπὶ εὐεργεσίᾳ φωνοῦντος
  english_pob_choice: urges us and calls us to receive a benefit
  chosen_korean: 우리를 권면하시고 호의를 베푸시며 부르실 때
  alternatives_korean:
  - 우리를 간절히 권하시고 은혜를 베풀겠다고 부르실 때
  - 우리를 설득하시며 은혜를 위해 부르실 때
  lexicon: LSJ
  rationale: παρακαλέω와 εὐεργεσία의 결합은 단순한 ‘초대’보다 왕의 호의와 설득을 함께 띠므로, ‘권면’과 ‘호의를 베푸시며’로 분리해 표현했습니다.
- source_word: μὴ πεισθείημεν αὐτῷ
  english_pob_choice: should we not be persuaded by him?
  chosen_korean: 우리가 그분의 말을 따르지 않겠습니까?
  alternatives_korean:
  - 우리가 그분에게 설득되지 않겠습니까?
  - 우리가 그분을 따르지 않겠습니까?
  lexicon: LSJ
  rationale: πειθώ 계열은 문맥상 ‘설득되다’와 ‘따르다/순종하다’의 뉘앙스를 함께 가지므로, 한국어에서는 자연스럽게 ‘말을 따르다’로 옮겨 응답의 함의를 살렸습니다.
theological_decisions:
- issue: 왕의 호의에 대한 응답을 ‘설득’으로만 둘지 ‘순종’의 함의까지 드러낼지
  chosen_reading: 표면적으로는 ‘그분의 말을 따르다’로 옮기되, 본문이 왕의 호의와 권면에 대한 응답을 말한다는 점을 유지했습니다.
  alternative_readings:
  - 우리가 그분에게 설득되지 않겠습니까?
  - 우리가 그분에게 순종하지 않겠습니까?
  rationale: 그리스어 πεισθείημεν은 이 장면에서 단순 인지적 설득을 넘어 실제로 따름과 수용을 포함할 수 있어, 의미 범위를 과도하게 좁히지 않도록 했습니다.
  doctrine_reference: 의미역 범위 보존
