- source_word: οὐδὲν ... οὐδὲ ἐνεθυμήθησαν
  english_pob_choice: said none of these things, nor did they even think them
  chosen_korean: 이런 말들 가운데 어느 것도 말하지 않았고, 그런 생각조차 하지 않았습니다
