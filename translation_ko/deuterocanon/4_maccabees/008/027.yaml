translation:
  language: ko
  text: 그러나 이제 죽임을 당할 젊은이들은 이런 말들 가운데 어느 것도 말하지 않았고, 그런 생각조차 하지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그런 생각을 마음에 품지도 않았습니다.’ Greek 동사 ἐνθυμέομαι는 마음속으로 생각하거나 숙고하는 뜻이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
