theological_decisions:
- issue: βασανίζεσθαι의 강도 표현
  chosen_reading: ‘죽임을 당할’로 옮겨, 다가오는 처형의 현실성과 압박감을 강조했습니다.
  alternative_readings:
  - ‘고문당할’
  - ‘고초를 겪을’
  rationale: 본문은 단순한 시험이 아니라 순교 직전의 실제 처형 상황을 서술하므로, 독자에게 그 긴박함이 분명히 전달되도록 했습니다.
  doctrine_reference: '번역 원칙: 원문 우선, 문맥 기반 의미 강도 유지'
- issue: οὐδὲ ἐνεθυμήθησαν의 내면 동사
  chosen_reading: ‘생각조차 하지 않았습니다’로, 외적 발화 부재와 내적 숙고 부재를 함께 드러냈습니다.
  alternative_readings:
  - ‘마음에 두지도 않았습니다’
  - ‘그런 생각을 품지도 않았습니다’
  rationale: ἐνθυμέομαι는 단순한 ‘생각하다’보다 마음속으로 곱씹거나 고려하는 뉘앙스를 가지므로, 그 내면성을 드러내는 표현을 택했습니다.
  doctrine_reference: '번역 원칙: 의미 범위의 긴장 보존'
