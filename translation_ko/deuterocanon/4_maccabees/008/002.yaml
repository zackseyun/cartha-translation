    reason: lexical_alternative
  - marker: b
    text: Literally 'eat pork' or 'eat swine's flesh.'
    reason: lexical_alternative
  - marker: c
    text: The Greek adverb literally means 'more bitterly,' that is, more harshly or severely.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 그는 몹시 격동하여 같은 또래의 히브리 사람들 가운데서 다른 이들을 데려오라고 명령했습니다.[a] 그들이 돼지고기를 먹으면[b] 데려온 이들을 풀어 주고, 반대하면 더 가혹하게[c] 고문하라고 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 또래의 다른 히브리 사람들’. 그리스어 표현에는 연령대에 대한 언급이 분명히 들어 있습니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어 μηροφαγοῖεν은 이 문맥에서 돼지고기를 먹는 것을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 그리스어 비교급은 문자적으로 ‘더 쓰게’라는 뜻이지만, 고문 문맥에서는 ‘더 가혹하게’라는 의미입니다.
    reason: lexical_alternative
