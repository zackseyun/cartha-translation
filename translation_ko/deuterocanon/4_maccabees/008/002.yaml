  text: Then[a], becoming deeply agitated, he ordered that others from among the Hebrews of that age be brought in; and if they would eat meat from the thigh, to release those who were brought in, but if they objected[c][b], to torture them more severely.
  footnotes:
  - marker: a
    text: Or 'other Hebrews of the same age group.' The Greek phrase explicitly includes an age reference.
    reason: lexical_alternative
  - marker: b
    text: Literally 'eat pork' or 'eat swine's flesh.'
    reason: lexical_alternative
  - marker: c
    text: The Greek adverb literally means 'more bitterly,' that is, more harshly or severely.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 그는 몹시 격동되어, 같은 또래의 히브리인들 가운데서 다른 사람들을 데려오라고 명령했습니다. 그리고 그들이 넓적다리 고기를 먹으면 데려온 사람들을 풀어 주고, 반대하면 더 가혹하게 고문하라고 했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘같은 연령대의 다른 히브리인들’. 그리스어 표현은 나이대를 분명히 포함합니다.
    reason: alternative_reading
  - marker: b
    text: 원뜻은 ‘넓적다리 고기를 먹다’입니다.
    reason: lexical_alternative
  - marker: c
    text: 그리스어의 비교급은 문자적으로 ‘더 쓰게’라는 뜻이지만, 여기서는 ‘더 가혹하게’라는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σφόδρα περιπαθὼς
  english_pob_choice: becoming deeply agitated
  chosen_korean: 몹시 격동되어
  alternatives_korean:
  - 깊이 동요되어
  - 몹시 격분하여
  - 크게 괴로워하며
  lexicon: LSJ
  rationale: 감정의 강도를 살리되, περιπαθώς의 핵심인 내적 동요를 반영하기 위해 ‘격동되어’를 택했습니다. ‘격분’처럼 분노로 좁히지 않고, σφόδρα의 강한 강조를 ‘몹시’로 옮겼습니다.
- source_word: ἄλλους ἐκ τῆς ἡλικίας τῶν Ἑβραίων
  english_pob_choice: others from among the Hebrews of that age
  chosen_korean: 같은 또래의 히브리인들 가운데서 다른 사람들
  alternatives_korean:
  - 동년배의 히브리인들 가운데서 다른 사람들
  - 히브리인들 중 다른 사람들
  - 그 또래의 다른 히브리인들
  lexicon: LSJ
  rationale: ἡλικία는 단순히 ‘나이’가 아니라 또래/연령대의 뉘앙스를 담을 수 있으므로, 앞서 나온 청년들과 같은 연령층이라는 점을 드러냈습니다.
- source_word: μηροφαγοῖεν
  english_pob_choice: would eat meat from the thigh
  chosen_korean: 넓적다리 고기를 먹으면
  alternatives_korean:
  - 돼지고기를 먹으면
  - 돼지의 살을 먹으면
  - 넓적다리의 고기를 먹으면
  lexicon: LSJ
  rationale: 직역상 ‘넓적다리 고기’가 가장 원문에 가깝습니다. 영어 본문이 돼지고기로 해석한 흔적이 있으나, 원어 형태를 우선해 한국어 본문에는 해부학적 표현을 유지했습니다.
- source_word: πικρότερον
  english_pob_choice: more severely / more bitterly
  chosen_korean: 더 가혹하게
  alternatives_korean:
  - 더 심하게
  - 더 잔인하게
  - 더 쓰게
  lexicon: LSJ
  rationale: 비교급의 문자적 ‘더 쓰게’는 한국어 본문에서는 자연스럽지 않으므로, 고문 맥락에 맞는 ‘더 가혹하게’로 옮겨 비교 의미와 처벌 강도를 모두 살렸습니다.
