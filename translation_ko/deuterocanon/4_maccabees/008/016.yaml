  text: 'And through their blessed courage they brought down his tyranny. Yet let us consider this: if some among them had been fainthearted and unmanly, what words would they have used? Would it not have been these?'
  footnotes:
  - marker: a
    text: Or 'through their nobility,' 'through their blessedness,' or possibly 'through the excellence for which they were blessed.' The Greek term is rare and may denote a praiseworthy quality rather than a spoken blessing.
    reason: lexical_alternative
  - marker: b
    text: Greek 'unmanly,' a gendered term in the source used in the book's virtue rhetoric; alternatively, 'without courage' or 'cowardly.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 그들의 복됨[a]으로 그의 폭정을 무너뜨렸습니다. 그러나 생각해 봅시다. 그들 가운데 어떤 이들이 비겁하고 사내답지 못했다면[b], 그들은 어떤 말을 했겠습니까? 바로 이런 말들이 아니었겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 εὐλογιστία는 드문 단어입니다. ‘복됨’, ‘축복받은 탁월함’, 또는 칭찬받을 만한 고귀한 덕성을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 직역하면 ‘사내답지 못한’이라는 성별화된 표현을 사용합니다. 이는 이 책의 고대 덕 윤리 수사에 따른 말이며, ‘용기가 없는’ 또는 ‘비겁한’으로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τῆς εὐλογιστίας
  english_pob_choice: through their blessed courage / blessedness
  chosen_korean: 복되운 용기
  alternatives_korean:
