  source_fidelity: 첫 절의 εὐλογιστία에 ‘용기’를 보태는 것은 문맥상 가능하나 원문에 없는 덕목을 명시하므로, 드문 명사의 의미 범위를 보존하는 ‘복됨’이 더 안전합니다. 또한 δειλόψυχοί와 ἄνανδροι를 모두 ‘비겁하고 나약한’으로 합치면 두 번째의 남성-규범적 수사를 잃습니다.
