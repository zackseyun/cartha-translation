  lexicon: LSJ
  rationale: εὐλογιστία는 드문 말로, 단순한 ‘축복’이나 ‘찬양’보다 칭찬받을 만한 내적 덕성을 가리킬 가능성이 커서, 문맥의 순교적 저항을 살려 ‘복되운 용기’로 옮겼습니다.
