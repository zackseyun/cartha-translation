  - 소심했다
  lexicon: LSJ
  rationale: 복합어의 내면적 비겁함을 살리면서도 한국어에서 자연스러운 두 겹의 성격 묘사로 옮겼습니다.
- source_word: ἄνανδροι
  english_pob_choice: unmanly
  chosen_korean: 비겁하고 나약했다
  alternatives_korean:
  - 사내답지 못했다
  - 남자답지 못했다
  - 여성스럽다
  lexicon: LSJ
  rationale: 이 단어는 성별 대조가 있는 수사지만, 한국어에서는 직접적인 성별 폄하 표현보다 본문 뜻을 과도하게 좁히지 않는 방식으로 옮겼습니다. 앞말과 함께 비겁함의 중첩을 드러냅니다.
