  text: 'And through their blessed courage they brought down his tyranny. Yet let us consider this: if some among them had been fainthearted and unmanly, what words would they have used? Would it not have been these?'
  footnotes:
  - marker: a
    text: Or 'through their nobility,' 'through their blessedness,' or possibly 'through the excellence for which they were blessed.' The Greek term is rare and may denote a praiseworthy quality rather than a spoken blessing.
    reason: lexical_alternative
  - marker: b
    text: Greek 'unmanly,' a gendered term in the source used in the book's virtue rhetoric; alternatively, 'without courage' or 'cowardly.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들의 복되운 용기[a]로 그들은 그의 폭정을 무너뜨렸습니다. 그런데 이 점을 생각해 봅시다. 그들 가운데 어떤 이들이 비겁하고 나약했다면, 어떤 말들을 사용했겠습니까? 이런 말들이 아니었겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 εὐλογιστία는 드문 단어로, ‘복됨’, ‘축복받은 탁월함’, 혹은 여기처럼 ‘복되운 용기’로 이해될 수 있습니다.
    reason: lexical_alternative
