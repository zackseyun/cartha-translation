  terminology: ἄνανδροι는 고대의 성별화된 덕 윤리를 반영하는 표현이므로 ‘사내답지 못한’으로 옮기고 주석에서 이를 설명합니다. 이는 그 수사를 승인하거나 현대의 성 역할 규범으로 재해석하지 않습니다.
