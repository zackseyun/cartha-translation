- from: 그리고 그들의 복되운 용기[a]로 그들은 그의 폭정을 무너뜨렸습니다. 그런데 이 점을 생각해 봅시다. 그들 가운데 어떤 이들이 비겁하고 나약했다면, 어떤 말들을 사용했겠습니까? 이런 말들이 아니었겠습니까?
