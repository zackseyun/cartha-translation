base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/003.yaml
  text: But if any should be unwilling to eat defiling food[b][a], let them be broken on the wheel and put to death.
  footnotes:
  - marker: a
    text: Or, 'to eat polluted food' or 'to partake of defiled meat.' The Greek verb itself carries the idea of eating what is ritually defiling; the object is not separately stated in this clause.
    reason: lexical_alternative
  - marker: b
    text: Or, 'be racked/tortured on the wheel.' The Greek participle refers to wheel-based torture; 'broken on the wheel' makes the likely method explicit in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 만일 어떤 이들이 더럽히는 음식을 먹기를 원하지 않으면, 그들을 수레바퀴에 얹어 산산이 부수고 죽이게 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉, 먹는 대상은 별도로 제시되지 않으며, 동사 자체가 제의적으로 더럽히는 것을 먹는다는 뜻을 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘수레바퀴로/수레바퀴에 의해 고문당한’에 가깝습니다. 여기서는 처형 방식이 드러나도록 ‘수레바퀴에 얹어 산산이 부수고’로 옮겼습니다.
    reason: lexical_alternative
