theological_decisions:
- issue: 제의적 불결성과 처벌의 강도
  chosen_reading: ‘더럽히는 음식’이라는 표현을 유지하고, 형벌은 완곡하게 누그러뜨리지 않았습니다.
  alternative_readings:
  - ‘부정한 음식’으로 일반화하기
  - ‘고기’로 구체화하기
  - 형벌을 ‘고문하다’ 정도로 완화하기
  rationale: 본문은 먹는 행위가 제의적으로 더럽히는 것임을 강조하며, τροχισθέντας와 ἀναιρεθῆναι는 매우 가혹한 처형을 가리키므로 그 긴장을 그대로 보존해야 합니다.
  doctrine_reference: 제의적 정결/불결, 순교 서사
- issue: 명령형의 법정적 어조
  chosen_reading: ‘죽이게 하십시오’로 현대 한국어의 명령·허가형을 살렸습니다.
  alternative_readings:
  - ‘죽여라’로 직설화하기
  - ‘죽이도록 하라’로 바꾸기
  rationale: 본문은 군사·법정 상황의 강한 명령을 담고 있으므로, 합쇼체 안에서 공적 지시의 무게가 드러나도록 했습니다.
  doctrine_reference: 서사적 명령문 번역 관행
