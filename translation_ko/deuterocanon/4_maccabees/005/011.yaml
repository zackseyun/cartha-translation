translation:
  language: ko
  text: 그리고 너는 네 추론에 담긴 어리석음을 떨쳐 버리고, 네 나이에 걸맞은[a] 분별을 갖추어, 유익한 것에 관한 진리를 철학적으로 탐구할 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἄξιον τῆς ἡλικίας는 문자적으로 ‘나이에 걸맞은’이며, 연령뿐 아니라 삶의 단계에 대한 적합성을 함축할 수 있습니다.
    reason: source_note
  - marker: b
    text: φιλοσοφήσεις는 단순히 ‘생각하다’가 아니라 ‘철학적으로 사유하다/탐구하다’는 뜻을 분명히 드러냅니다.
    reason: cultural_note
