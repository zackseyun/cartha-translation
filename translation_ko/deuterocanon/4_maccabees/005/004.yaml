  - 이스라엘 사람
  rationale: 원문이 분명히 Ἑβραῖος를 사용하므로, 후대적·해석적 범주인 ‘유대인’보다 직접 대응하는 ‘히브리 사람’을 유지했습니다.
  doctrine_reference: source-language fidelity
- issue: τὸ γένος ἱερεύς의 혈통적 제사장성
  chosen_reading: 혈통상 제사장이며
  alternative_readings:
  - 태생이 제사장이며
  - 가문상 제사장이며
  - 제사장 가문 출신이며
  rationale: 문맥은 직분 수행보다 출신과 계통을 강조하므로, 4마카베오스의 수사적 병렬을 살리면서 ‘혈통상’으로 계보적 의미를 드러냈습니다.
  doctrine_reference: source-language fidelity
