  text: But when many had been seized, one man, first from the flock, a Hebrew named Eleazar, a priest by birth, trained in the law in knowledge, advanced in age, and known to many around the tyrant because of his age, opened his mouth.
  footnotes:
  - marker: a
    text: Or 'one man, first from the group.' The Greek literally says 'from the flock,' using a metaphor for the company of Hebrews.
    reason: lexical_alternative
  - marker: b
    text: Or 'an expert in the law.' The Greek describes Eleazar as learned with respect to the law, not as a legal professional in the modern sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 많은 이들이 붙잡히자, 무리 가운데서 첫 사람, 히브리 사람이며 엘르아살이라는 이름을 가진 이, 혈통상 제사장이며 율법에 밝고 나이가 많아, 나이 때문에 폭군 주변의 많은 사람에게도 알려져 있던 그가 입을 열었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무리 가운데서 첫 사람’은 문자적으로는 ‘무리(떼)에서 첫째’라는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: συναρπασθέντων
  english_pob_choice: had been seized
  chosen_korean: 붙잡히자
  alternatives_korean:
  - 사로잡히자
  - 끌려가자
  - 붙들리자
  lexicon: LSJ
  rationale: 강제적으로 붙잡힌 상황을 자연스러운 현대 한국어로 옮기되, 수동적·폭력적 뉘앙스를 유지했습니다.
- source_word: ἀγέλης
  english_pob_choice: flock
  chosen_korean: 무리
  alternatives_korean:
  - 떼
  - 집단
  - 양떼
  lexicon: LSJ
  rationale: 원문은 히브리인들의 집단을 비유적으로 ‘flock’이라 부르지만, 한국어에서는 과도하게 축자적인 ‘양떼’보다 문맥을 살리는 ‘무리’가 비유성을 유지합니다.
- source_word: τὴν ἐπιστήμην νομικός
  english_pob_choice: trained in the law in knowledge
  chosen_korean: 율법에 밝고
  alternatives_korean:
  - 율법에 학식이 있고
  - 율법을 잘 알고
  - 율법에 정통하고
  lexicon: LSJ
  rationale: νομικός를 현대 직업명처럼 ‘율법학자’로 고정하기보다, 원문이 말하는 ‘율법에 대한 지식/학식’을 드러내기 위해 ‘율법에 밝고’로 옮겼습니다.
- source_word: ἠνῴχετο τὸ στόμιον αὐτοῦ
  english_pob_choice: opened his mouth
  chosen_korean: 입을 열었습니다
  alternatives_korean:
  - 말하기 시작했습니다
  - 입을 열어 말했습니다
  - 말문을 열었습니다
  lexicon: LSJ
  rationale: 헬라어 관용구를 한국어 관용으로 옮기되, 장중한 서술 흐름을 해치지 않도록 직역보다 자연스러운 표현을 택했습니다.
