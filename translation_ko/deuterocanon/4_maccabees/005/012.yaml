  - 동정하게 될 것입니다
  - 자비를 베풀게 될 것입니다
  lexicon: LSJ
  rationale: 동사 의미는 ‘불쌍히 여기다, 가엾게 여기다’로, 목적어가 자기 자신의 늙음이라는 점을 살려 한국어에서 자연스럽게 옮겼습니다.
- source_word: τὸ σεαυτοῦ γῆρας
  english_pob_choice: your own old age
  chosen_korean: 너 자신의 늙음
  alternatives_korean:
  - 너의 늙은 나이
  - 너 자신의 노년
