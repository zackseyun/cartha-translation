  rationale: παρηγορία는 여기서 위로보다 설득·권유에 가깝고, φιλάνθρωπον은 ‘인도적인/자애로운’의 자기정당화적 뉘앙스를 살립니다.
- source_word: οἰκτειρήσεις
  english_pob_choice: you will have pity on
  chosen_korean: 불쌍히 여기게 될 것입니다
