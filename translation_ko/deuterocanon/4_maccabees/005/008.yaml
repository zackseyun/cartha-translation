base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/008.yaml
  text: For it is foolish not to enjoy the pleasant things that are without reproach[a], and unjust to turn away from the gifts of nature.
  footnotes:
  - marker: a
    text: Or, 'the blameless pleasures.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왜냐하면 비난받을 일이 없는 즐거움을 주는 것들을 누리지 않는 것은 어리석은 일이며, 자연의 선물들을 외면하는 것은 불의하기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘비난받을 일이 없는 즐거움들’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόητον
  english_pob_choice: foolish
  chosen_korean: 어리석은 일
  alternatives_korean:
  - 분별없는 일
  - 미련한 일
  lexicon: LSJ
  rationale: ἀνόητον은 분별과 이해가 없는 상태를 가리키므로, 현대 한국어에서 자연스럽고 도덕적·지적 무게를 함께 살리는 ‘어리석은 일’로 옮겼습니다.
- source_word: τὸ μὴ ἀπολαύειν
  english_pob_choice: not to enjoy
  chosen_korean: 누리지 않으려 하고
  alternatives_korean:
  - 즐기지 않으려 하고
  - 향유하지 않으려 하고
  lexicon: LSJ
  rationale: ἀπολαύειν은 단순한 접촉보다 ‘기쁨을 누림’에 가깝기 때문에, 일상적이면서도 의미를 살리는 ‘누리다’를 선택했습니다.
- source_word: τῶν χωρὶς ὀνείδους ἡδέων
  english_pob_choice: the pleasant things that are without reproach
  chosen_korean: 비난받을 것이 없는 즐거운 것들
  alternatives_korean:
  - 책망받을 것이 없는 즐거운 것들
  - 허물이 없는 հաճ락한 것들
  lexicon: LSJ
  rationale: ἡδέων의 ‘즐거운 것들’과 χωρὶς ὀνείδους의 ‘비난/책망 없음’을 둘 다 드러내기 위해, 도덕적 제한을 보존하는 표현으로 옮겼습니다.
- source_word: ἄδικον
  english_pob_choice: unjust
  chosen_korean: 불의합니다
  alternatives_korean:
  - 부당합니다
  - 옳지 않습니다
  lexicon: LSJ
  rationale: ἄδικον은 단순한 부적절함보다 의롭지 않음의 범주를 가리키므로, 윤리적 강도를 살린 ‘불의합니다’가 가장 적절합니다.
- source_word: τὰς τῆς φύσεως χάριτας
  english_pob_choice: the gifts of nature
  chosen_korean: 자연의 선물들
  alternatives_korean:
  - 자연의 은혜들
  - 자연의 호의들
  lexicon: LSJ
  rationale: χάριτας는 여기서 신학적 ‘은혜’보다 자연이 베푸는 유익과 혜택을 뜻하므로, 오해를 피하면서도 자연스러우며 직설적인 ‘선물들’로 옮겼습니다.
theological_decisions:
- issue: 즐거움에 대한 도덕적 평가
  chosen_reading: 본문은 일부 즐거움이 ‘비난받을 것이 없는’ 범위 안에 있으며, 그런 것들은 누려야 한다는 논지를 유지합니다.
  alternative_readings:
  - ‘비난받을 것이 없는 즐거움’으로 압축해 옮길 수 있습니다.
  rationale: 그리스어는 즐거움 자체를 무조건 긍정하지 않고, ‘비난 없음’이라는 제한을 붙이므로 그 긴장을 한국어에서도 그대로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: 원문의 도덕적 긴장을 해소하지 말고, 읽기 쉬운 현대어로 전달할 것.'
