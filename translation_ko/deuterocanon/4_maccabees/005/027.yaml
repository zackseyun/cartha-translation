  - 이 가장 혐오스러운 먹음의 더러움으로
  lexicon: LSJ
  rationale: 희귀 합성어의 핵심인 '먹음'과 '부정/더러움'의 결합을 살리면서, 단순히 음식 자체가 아니라 음식 때문에 생기는 의례적·도덕적 더러움을 드러냈습니다.
theological_decisions:
- issue: 마카베오스의 '율법'을 어떻게 드러낼 것인가
  chosen_reading: 본문에는 '율법'만 두어 직역성을 지키되, 마카베오 문맥상 유대 율법을 가리키는 것으로 읽힙니다.
  alternative_readings:
  - 하나님의 율법
  - 조상들의 율법
  rationale: 그리스어는 일반적 '법'이지만, 순교 논증의 배경상 토라 위반을 뜻합니다. 본문에 설명을 덧붙이지 않고도 문맥이 보이도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
