  rationale: 그리스어는 일반적 '법'이지만, 순교 논증의 배경상 토라 위반을 뜻합니다. 본문에 설명을 덧붙이지 않고도 문맥이 보이도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
