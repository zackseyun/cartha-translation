  text: But tyrannically you are not only compelling us to break the law[a], but also to eat, so that you may further mock us with this most hateful defilement by food.
  footnotes:
  - marker: a
    text: Or 'with this most hateful polluted eating' or 'with this most hateful food-defilement.' The Greek term is rare and combines the ideas of eating and ritual/moral defilement.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 당신은 폭압적으로 우리에게 율법을 범하게 할 뿐 아니라 먹게도 강요하여, 이 가장 혐오스러운 먹음으로 인한 부정으로 우리를 더욱 조롱하려고 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 가장 혐오스러운 부정한 먹음’ 또는 ‘이 가장 혐오스러운 음식으로 인한 더러움’. 그리스어의 희귀 합성어는 먹는 행위와 그에 따르는 의례적·도덕적 부정의 뜻을 함께 담습니다.
    reason: lexical_alternative
