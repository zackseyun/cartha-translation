  lexicon: LSJ
  rationale: ὑψηλοῦ τόπου는 문자적으로 높은 위치를 뜻하며, 여기서는 예배용 ‘산당’이 아니라 단순한 고지임을 유지해야 하므로 ‘높은 곳’으로 직역에 가깝게 옮겼습니다.
- source_word: εὐόπλων
