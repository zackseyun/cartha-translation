lexical_decisions:
- source_word: Προκαθίσας
  english_pob_choice: had taken his seat
  chosen_korean: 앉았고
  alternatives_korean:
  - 자리에 먼저 앉았고
  - 자리에 앉아 있었고
  - 착석하고
  lexicon: LSJ
  rationale: 이 분사는 안티오코스가 권위 있는 위치에 앉아 장면을 여는 동작을 나타내므로, 한국어에서는 자연스럽게 ‘앉았고’로 처리해 장면 설정을 살렸습니다.
- source_word: γέ τοι
  english_pob_choice: So then
  chosen_korean: 그러므로
  alternatives_korean:
  - 이에
  - 그리하여
  - 그러자
  lexicon: LSJ
  rationale: 이 결합은 서술 전환과 강조를 더하므로, 맥락을 이어 주는 ‘그러므로’가 영어 POB의 ‘So then’과 유사한 담화 기능을 전달합니다.
- source_word: μετὰ τῶν συνέδρων
  english_pob_choice: with his council
  chosen_korean: 자기의 회의들과 함께
  alternatives_korean:
  - 자기의 परिषद과 함께
  - 자기의 자문관들과 함께
  - 자기 회의원들과 함께
  lexicon: LSJ
  rationale: συνέδρων은 그와 함께 의논하는 사람들을 가리키므로, 기관명처럼 굳힌 ‘회의’보다 인물을 드러내는 표현이 더 자연스럽지만, 본문 구조를 따라 ‘자기의 회의들’로 옮겨 공식적 협의체의 뉘앙스를 남겼습니다.
- source_word: ἐπὶ τινος ὑψηλοῦ τόπου
  english_pob_choice: on a certain high place
  chosen_korean: 한 높은 곳에
  alternatives_korean:
  - 어떤 높은 곳에
  - 한 높은 장소에
  - 높은 단 위에
  lexicon: LSJ
  rationale: ὑψηλοῦ τόπου는 문자적으로 높은 위치를 뜻하며, 여기서는 예배용 ‘산당’이 아니라 단순한 고지임을 유지해야 하므로 ‘높은 곳’으로 직역에 가깝게 옮겼습니다.
- source_word: εὐόπλων
  english_pob_choice: fully armed
  chosen_korean: 완전무장한
  alternatives_korean:
  - 온전히 무장한
  - 무장한
  - 완전히 무장한
  lexicon: LSJ
  rationale: 형용사는 병사들이 전투 준비를 갖춘 상태를 강조하므로, 한국어에서는 압축된 형용사 ‘완전무장한’이 위압적인 분위기를 가장 잘 전달합니다.
theological_decisions:
