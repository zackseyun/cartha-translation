  - 그리하여
  - 그러자
  lexicon: LSJ
  rationale: 이 결합은 서술 전환과 강조를 더하므로, 맥락을 이어 주는 ‘그러므로’가 영어 POB의 ‘So then’과 유사한 담화 기능을 전달합니다.
- source_word: μετὰ τῶν συνέδρων
  english_pob_choice: with his council
  chosen_korean: 자기의 회의들과 함께
  alternatives_korean:
