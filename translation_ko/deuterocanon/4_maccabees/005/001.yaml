  lexicon: LSJ
  rationale: συνέδρων은 그와 함께 의논하는 사람들을 가리키므로, 기관명처럼 굳힌 ‘회의’보다 인물을 드러내는 표현이 더 자연스럽지만, 본문 구조를 따라 ‘자기의 회의들’로 옮겨 공식적 협의체의 뉘앙스를 남겼습니다.
- source_word: ἐπὶ τινος ὑψηλοῦ τόπου
  english_pob_choice: on a certain high place
  chosen_korean: 한 높은 곳에
  alternatives_korean:
  - 어떤 높은 곳에
  - 한 높은 장소에
