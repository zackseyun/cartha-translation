lexical_decisions:
- source_word: Προκαθίσας
  english_pob_choice: had taken his seat
  chosen_korean: 앉았고
  alternatives_korean:
  - 자리에 먼저 앉았고
  - 자리에 앉아 있었고
  - 착석하고
  lexicon: LSJ
  rationale: 이 분사는 안티오코스가 권위 있는 위치에 앉아 장면을 여는 동작을 나타내므로, 한국어에서는 자연스럽게 ‘앉았고’로 처리해 장면 설정을 살렸습니다.
- source_word: γέ τοι
