translation:
  language: ko
  text: 그러므로 두 경우 가운데 어느 경우를 통해서든지, 율법은 똑같이 자랑합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘두 경우 가운데 각각’을 뜻하는 분배적 표현으로, 여기서는 두 대상이 전제됩니다.
    reason: lexical_alternative
  - marker: b
    text: 동사 ὑπερηφανεῖται는 ‘자랑하다/뽐내다/기뻐하다’의 뜻을 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διʼ ἑκατέρου
  english_pob_choice: through either one
  chosen_korean: 두 경우 가운데 어느 경우를 통해서든지
  alternatives_korean:
  - 어느 쪽을 통해서든지
  - 두 가지 각각을 통해서
  lexicon: LSJ
  rationale: ἑκατέρου는 둘 중 각각을 가리키는 분배적 표현이므로, 한국어에서도 ‘둘’의 범위를 분명히 드러내는 말로 옮겼습니다.
- source_word: γὰρ
  english_pob_choice: for
  chosen_korean: 그러므로
  alternatives_korean:
  - 왜냐하면
  - 이는
  lexicon: LSJ
  rationale: 앞뒤 문맥의 설명·근거 연결을 자연스러운 한국어 접속어로 풀었습니다.
- source_word: ὡς ὁμοίως
  english_pob_choice: equally
  chosen_korean: 똑같이
  alternatives_korean:
  - 동일하게
  - 같은 방식으로
  lexicon: LSJ
  rationale: 두 대상에 대한 동등성을 강조하는 결합이므로, 부사적으로 자연스럽게 ‘똑같이’로 옮겼습니다.
- source_word: ὁ νόμος ὑπερηφανεῖται
  english_pob_choice: the law takes pride
  chosen_korean: 율법은 자랑합니다
  alternatives_korean:
  - 율법은 자랑합니다
  - 율법은 크게 기뻐합니다
  - 율법은 자랑스러워합니다
  lexicon: LSJ
  rationale: 법을 의인화한 표현을 살리되, 현대 한국어에서 과도하게 낯설지 않도록 ‘자랑하다’로 옮겼습니다.
theological_decisions:
- issue: 율법의 의인화 유지
  chosen_reading: 율법이 직접 ‘자랑합니다’라고 말하는 의인화 표현을 유지했습니다.
  alternative_readings:
  - 율법이 equally honored 됩니다
  - 율법이 두 경우에서 똑같이 인정받습니다
  rationale: 그리스어 ὑπερηφανεῖται는 율법을 인격화하여 말하므로, 이를 추상화하지 않고 그대로 살려 수사적 힘을 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 6
