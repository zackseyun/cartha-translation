  text: For through either one, the law takes equal pride.
  footnotes:
  - marker: a
    text: Or 'through each of the two'; the Greek ἑκατέρου refers specifically to two items or persons in view.
    reason: lexical_alternative
  - marker: b
    text: Or 'the law glories equally.' The Greek personifies the law with a verb of pride/exultation.
