translation:
  language: ko
  text: 철학적 이성이여, 나는 그대를 욕되게 하지도 않겠으며, 존귀한 제사장직과 율법에 대한 지식이여, 나는 그대를 저버리지도 않겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 φιλόσοφε λόγε는 직역하면 ‘철학적인 이성이여’이며, 압축되고 다소 문체적인 호격 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ἑξαρνήσομαί는 단순히 ‘부인하다’보다 더 강하게 관계나 충성을 끊어 ‘저버리다’, ‘배척하다’라는 뜻을 나타냅니다.
    reason: lexical_alternative
