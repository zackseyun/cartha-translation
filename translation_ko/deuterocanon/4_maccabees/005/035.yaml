translation:
  language: ko
  text: 나는 당신을 부끄럽게 하지도 않겠습니다, 철학적인 말씀아, 또한 당신을 버리지도 않겠습니다, 존귀한 제사장직과 율법에 대한 지식이여.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘철학적인 말씀’입니다. 그리스어 φιλόσοφε λόγε는 압축된 호격 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ἑξαρνήσομαί는 단순한 ‘부인하다’보다 더 강한 ‘배척하다/저버리다’의 뉘앙스를 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ καταισχυνῶ
  english_pob_choice: Nor will I disgrace
  chosen_korean: 부끄럽게 하지도 않겠습니다
  alternatives_korean:
  - 욕되게 하지도 않겠습니다
  - 수치스럽게 하지도 않겠습니다
  - 망신시키지도 않겠습니다
  lexicon: BDAG / LSJ
  rationale: καταισχύνω의 수치·치욕 의미를 자연스러운 합쇼체로 옮기되, 관계적 맥락에서 대상의 체면을 손상하지 않겠다는 결심을 분명히 드러냈습니다.
- source_word: φιλόσοφε λόγε
  english_pob_choice: O philosophical reason
  chosen_korean: 철학적인 말씀아
  alternatives_korean:
  - 철학적 이성이여
  - 철학의 말씀아
  - 철학적인 이성이여
  lexicon: LSJ
  rationale: 직접 호격의 압축된 표현을 살려 λόγε를 ‘말씀’으로 옮기고, φιλόσοφε를 ‘철학적인’으로 붙여 원문의 인격화된 호소를 유지했습니다.
- source_word: ἑξαρνήσομαί σε
  english_pob_choice: nor will I renounce you
  chosen_korean: 또한 당신을 버리지도 않겠습니다
  alternatives_korean:
  - 또한 당신을 부인하지도 않겠습니다
  - 또한 당신을 저버리지도 않겠습니다
  - 또한 당신을 포기하지도 않겠습니다
  lexicon: BDAG
  rationale: ἐξαρνέομαι의 강한 거부·배척 의미를 반영해 단순한 ‘부인’보다 관계를 끊는 뉘앙스를 살리는 ‘버리다’로 옮겼습니다.
- source_word: ἱεροσύνη τιμία καὶ νομοθεσίας ἐπιστήμη
  english_pob_choice: honored priesthood and knowledge of the law
  chosen_korean: 존귀한 제사장직과 율법에 대한 지식이여
  alternatives_korean:
  - 존귀한 제사장직과 율법 지식이여
  - 귀중한 제사장직과 율법 지식이여
  - 존경받는 제사장직과 율법에 대한 학식이여
  lexicon: LSJ
  rationale: ἱεροσύνη는 직분적 의미를 살려 ‘제사장직’으로, τιμία는 전통적 ‘귀한’보다 호격의 품위를 살리는 ‘존귀한’으로, νομοθεσίας ἐπιστήμη는 문맥상 모세 율법에 대한 지식으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 인격화된 추상명사에 대한 직접 호격 유지
  chosen_reading: ‘철학적인 말씀’과 ‘제사장직’, ‘율법에 대한 지식’을 실제 대화의 대상처럼 부르는 원문의 수사 구조를 그대로 살렸습니다.
  alternative_readings:
  - 추상어를 평서형으로 풀어 ‘철학과 제사장직과 율법 지식을 저버리지 않겠습니다’라고 옮길 수 있습니다.
  - 호격을 완화해 일반 서술로 바꿀 수 있습니다.
  rationale: 이 절은 추상 개념들을 인격화하여 배신하지 않겠다는 서약을 형성하므로, 한국어에서도 호격 구조를 보존해야 원문의 긴장과 장중함이 유지됩니다.
  doctrine_reference: 원문 수사 보존 및 인격화된 호격의 문학적 기능 유지
