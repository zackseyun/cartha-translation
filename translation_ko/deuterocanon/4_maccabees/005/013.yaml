revisions:
- from: 이 점도 생각해 보십시오. 이 종교에 어떤 살피는 힘이 있다 하더라도, 그것은 이 모든 일에서 강요로 인해 저지른 불법을 당신에게 용서해 줄 것입니다.[a][b]
  to: 또한 생각해 보십시오. 설령 이 종교를 지켜보는 어떤 힘[a]이 있다 하더라도, 그 힘은 강요 때문에 저지른 모든 범법을 당신에게 용서해 줄 것입니다.[b]
  rationale: 문장 구조를 다듬어 ‘모든’의 포괄 범위와 강요의 원인 관계를 분명히 했습니다. 또한 각 주석을 해당 표현 바로 뒤와 문장 끝에 배치하여 주석 대상이 명확하게 했습니다. ‘지켜보는 어떤 힘’은 신적 존재, 섭리, 수호적 존재 가운데 어느 하나로 단정하지 않습니다.
