translation:
  language: ko
  text: 또한 생각해 보십시오. 설령 이 종교를 지켜보는 어떤 힘[a]이 있다 하더라도, 그 힘은 강요 때문에 저지른 모든 범법을 당신에게 용서해 줄 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 종교를 감독하는 어떤 힘’으로 옮길 수 있습니다. 그리스어는 이 힘의 정체를 분명히 밝히지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘강요 아래 행해진 범법에 대해서는 모두 당신을 용서해 줄 것입니다.’로 옮길 수 있습니다.
    reason: alternative_reading
