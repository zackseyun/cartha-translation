  lexicon: LSJ
  rationale: 정체가 특정되지 않은 감시/감독의 능력을 뜻하므로, 신학적으로 과도하게 특정하지 않으면서도 ‘힘’과 ‘살피다’의 이미지를 살렸습니다.
