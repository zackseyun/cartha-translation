translation:
  language: ko
  text: 그는 경호병들에게 히브리 사람들 하나하나를 끌어내어 돼지고기와 우상에게 바친 고기를 강제로 맛보게 하라고 명령했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῖς δορυφόροις
  english_pob_choice: the guards
  chosen_korean: 경호병들
  alternatives_korean:
  - 경비병들
  - 호위병들
  - 창을 든 자들
  lexicon: LSJ
  rationale: δόρυ-φόροι는 문자적으로는 ‘창을 든 자들/창병들’이지만, 이 궁정·처형 맥락에서는 역할 중심으로 ‘경호병들’이 자연스럽고, 원문의 강제력도 잘 드러납니다.
- source_word: ἕνα ἕκαστον τῶν Ἐβραίων
  english_pob_choice: each one of the Hebrews
  chosen_korean: 히브리 사람들 하나하나를
  alternatives_korean:
  - 히브리 사람 한 사람 한 사람을
  - 히브리인들 각각을
  - 유대인들 각각을
  lexicon: BDAG
  rationale: ἕνα ἕκαστον의 분배적 강조를 살려 ‘하나하나’를 넣었고, Ἐβραίων은 영어 POB의 ‘Hebrews’를 따라 ‘히브리 사람들’로 옮겨 원문 표지를 유지했습니다.
- source_word: περισπᾶσθαι
  english_pob_choice: to drag away
  chosen_korean: 끌어내어
  alternatives_korean:
  - 끌고 가게 하라고
  - 잡아끌어 가게 하라고
  - 끌어다가
  lexicon: LSJ
  rationale: 이 동사는 사람을 강제로 떼어 내다/끌어내다의 뉘앙스를 가지므로, 단순히 ‘잡다’보다 ‘끌어내다’가 강제성을 더 분명히 드러냅니다.
- source_word: κρεῶν ὑείων
  english_pob_choice: pork
  chosen_korean: 돼지고기
  alternatives_korean:
  - 돼지 고기
  - 돼지의 고기
  - 돼지 살코기
  lexicon: LSJ
  rationale: 문자적으로는 ‘돼지의 고기’지만, 현대 한국어에서는 ‘돼지고기’가 가장 자연스럽고 금지 식품이라는 의미도 분명하게 전달합니다.
- source_word: εἰδωλοθύτων
  english_pob_choice: meat sacrificed to idols
  chosen_korean: 우상에게 바친 고기
  alternatives_korean:
  - 우상에게 제물로 바친 고기
  - 우상 제물 고기
  - 우상에게 바쳐진 고기
  lexicon: BDAG
  rationale: 이 표현은 ‘우상에게 바쳐진 것’을 뜻하므로, 고기와 평행을 이루도록 ‘우상에게 바친 고기’로 옮겨 제의적 금기를 분명히 했습니다.
theological_decisions:
- issue: 'ἀπογεύεσθαι의 강도: 단순 섭취인가, 맛보기인가'
  chosen_reading: 맛보게 하다
  alternative_readings:
  - 먹게 하다
  - 일부라도 먹게 하다
  - 먹어 보게 하다
  rationale: 원문은 강제된 완전 섭취보다 ‘맛보기’라는 최소한의 위반 자체를 강조하므로, 그 긴장을 유지하는 쪽이 본문에 더 충실합니다.
  doctrine_reference: Translation philosophy §3, preserve theological tension rather than resolve it
- issue: Ἐβραίων의 정체성 표지 유지
  chosen_reading: 히브리 사람들
  alternative_readings:
  - 유대인들
  - 이스라엘 사람들
  rationale: 원문은 Ἐβραίων이라고 분명히 말하므로, 해석적으로 일반화하지 않고 민족·역사적 표지를 그대로 살렸습니다.
  doctrine_reference: Translation philosophy §1, original-language primacy over translation tradition
