  naturalness: ‘율법에 의해 훈련받은 훈련이여’는 의미 관계가 뒤집혀 있을 뿐 아니라 현대 한국어로도 부자연스럽고 반복적입니다. ‘나를 가르치는 율법이여’는 의인화와 문학적 호격을 유지하면서 자연스럽습니다. ‘사랑하는 절제여’도 문맥상 자연스럽게 유지됩니다.
