  yaml_path: translation/deuterocanon/4_maccabees/005/034.yaml
  text: I will not deny you[a], O law-trained discipline, nor will I spare you[b], beloved self-control.
  footnotes:
  - marker: a
    text: Or 'I will not prove false to you' or 'I will not betray you.' The Greek verb can denote being false to a person as well as lying.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek directly addresses personified virtues: literally, ''O trainer law'' and ''beloved self-control.'' The translation makes the relation explicit as ''discipline that trains by the law.'''
    reason: cultural_note
translation:
  language: ko
  text: 저는 당신을 저버리지 않겠습니다[a], 나를 가르치는 율법이여. 또한 사랑하는 절제여, 당신을 아끼지 않겠습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 다른 가능성으로는 ‘당신에게 거짓말하지 않겠습니다’, ‘당신에게 거짓되게 굴지 않겠습니다’, 또는 ‘당신을 배반하지 않겠습니다’가 있습니다. 그리스어 동사는 사람을 목적어로 할 때 그 사람에게 거짓되게 굴거나 신의를 저버린다는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 의인화된 대상을 직접 부릅니다. 앞부분은 직역하면 ‘훈육자여, 율법이여’에 가깝고, 이어서 ‘사랑하는 절제여’라고 부릅니다. 번역은 율법을 가르치는 존재로 부르는 관계를 자연스럽게 드러냈습니다.
    reason: cultural_note
lexical_decisions:
- source_word: ψεύσομαί
  english_pob_choice: I will not deny you
  chosen_korean: 나는 당신을 부인하지 않겠습니다
  alternatives_korean:
  - 나는 당신에게 거짓말하지 않겠습니다
  - 나는 당신에게 거짓되지 않겠습니다
  - 나는 당신을 배반하지 않겠습니다
  lexicon: BDAG
  rationale: 상대에게 향한 미래 중간태 ψεύδομαι는 ‘거짓되다/부인하다’의 뜻을 띠므로, 맹세적 충성의 문맥에 맞게 ‘부인하지 않겠습니다’로 옮겼습니다.
- source_word: παιδευτὰ νόμε
  english_pob_choice: law-trained discipline
  chosen_korean: 율법에 의해 훈련받은 훈련
  alternatives_korean:
  - 율법에 의해 훈련하는 훈련자
  - 율법으로 훈련하는 훈련
  - 율법이 훈련하는 훈련
  lexicon: LSJ
  rationale: vocative로서 의인화된 표현을 살리기 위해 ‘훈련받은 훈련’으로 구성해 παιδευτὰ의 ‘훈련/양육’과 νόμε의 ‘율법’ 관계를 드러냈습니다.
- source_word: φείσομαί
  english_pob_choice: will spare
  chosen_korean: 아끼지 않겠습니다
  alternatives_korean:
  - 참지 않겠습니다
  - 삼가겠습니다
  - 물러서지 않겠습니다
  lexicon: BDAG
  rationale: 이 순교적 맥락에서 φείδομαι는 ‘아끼다/사양하다’의 뉘앙스로, 고통 앞에서 절제를 포기하지 않겠다는 결의를 한국어로 자연스럽게 살렸습니다.
- source_word: ἐγκράτεια
  english_pob_choice: self-control
  chosen_korean: 절제
  alternatives_korean:
  - 자기통제
  - 자제
  - 자기절제
  lexicon: BDAG
  rationale: ἐγκράτεια의 덕목적 의미를 현대 한국어의 정착된 표현인 ‘절제’로 옮겨, 인격화된 부름을 간결하게 유지했습니다.
theological_decisions:
- issue: 의인화된 덕목에 대한 직접 호칭
  chosen_reading: ‘훈련’과 ‘절제’를 각각 직접 부르는 수사적 호칭을 유지했습니다.
  alternative_readings:
  - 서술형으로 풀어 ‘율법이 훈련시키는 훈련’과 ‘사랑하는 절제’의 성격 설명으로 바꾸는 것
  rationale: 그리스어가 복수의 호격을 사용하므로, 문학적 의인화를 평탄화하지 않고 그대로 살리는 편이 원문의 수사와 결의의 강도를 보존합니다.
  doctrine_reference: Translation philosophy §§1, 6
