revisions:
- from: 그러나 사실 우리의 율법이, 당신이 생각하듯, 신적이지 않다 하더라도, 우리는 그것이 신적이라고 생각합니다. 그렇다 해도 당신이 경건에 근거한 우리의 명예를 무효화할 권리는 없습니다.[a]
  to: 그런데도, 사실 우리 율법이 당신이 생각하듯 신성한 것이 아니고, 우리가 그것을 신성한 것으로 여긴다 해도, 그런 경우에도 당신이 우리의 경건으로 얻은 명예를 무효로 할 수는 없습니다.[a]
  rationale: 'The revision more naturally renders the layered concessive construction: the law’s being ‘truly’ divine is placed under the opponent’s supposition, while the speakers’ own contrary assessment is retained. It also uses idiomatic Korean theological vocabulary and corrects the footnote alternative so that it reflects the basis expressed by ἐπὶ τῇ εὐσεβείᾳ.'
