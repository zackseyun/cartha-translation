  text: And yet[a], even if our law were not truly divine, as you suppose, though we think it to be divine, even so you would have no right to nullify our honor in matters of piety.
  footnotes:
  - marker: a
    text: Or 'our reputation for piety.' The Greek phrase can denote honorable standing or repute grounded in reverence toward God.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데도, 사실 우리 율법이 당신이 생각하듯 신성한 것이 아니고, 우리가 그것을 신성한 것으로 여긴다 해도, 그런 경우에도 당신이 우리의 경건으로 얻은 명예를 무효로 할 수는 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경건으로 얻은 우리의 평판’입니다. 여기서 δόξα는 추상적인 ‘영광’보다 사람들 앞에서 누리는 명예나 평판을 뜻할 수 있습니다.
    reason: lexical_alternative
