  rationale: δόξα는 단순한 ‘영광’보다 사회적 평판·명예를 포함하므로 ‘명예’로, ἐπὶ τῇ εὐσεβείᾳ는 그 근거를 나타내는 구조로 보아 ‘경건에 근거한’으로 옮겼습니다.
theological_decisions:
- issue: εὐσέβεια의 한국어 대응
  chosen_reading: ‘경건’으로 옮겨 하나님을 향한 경외와 삶의 태도를 함께 드러냈습니다.
  alternative_readings:
  - 경건성
  - 신심
  - 종교적 경건
  rationale: 4마카베오스에서 εὐσέβεια는 단순한 내적 신앙심보다 하나님께 대한 올바른 경외와 실천을 아우르므로, 가장 직접적인 표준어 표현인 ‘경건’이 문맥에 맞습니다.
  doctrine_reference: Translation philosophy §5
