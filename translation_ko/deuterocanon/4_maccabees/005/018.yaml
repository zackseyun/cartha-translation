  text: And yet[a], even if our law were not truly divine, as you suppose, though we think it to be divine, even so you would have no right to nullify our honor in matters of piety.
  footnotes:
  - marker: a
    text: Or 'our reputation for piety.' The Greek phrase can denote honorable standing or repute grounded in reverence toward God.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 사실 우리의 율법이, 당신이 생각하듯, 신적이지 않다 하더라도, 우리는 그것이 신적이라고 생각합니다. 그렇다 해도 당신이 경건에 근거한 우리의 명예를 무효화할 권리는 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경건에 대한 우리의 평판’입니다. 여기서 δόξα는 추상적 ‘영광’보다 사람들 앞에서의 명예나 평판을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καίτοι
  english_pob_choice: And yet
  chosen_korean: 그러나 사실
  alternatives_korean:
  - 그럼에도
  - 그렇지만
  lexicon: LSJ
  rationale: 양보를 전제하면서 논지를 꺾는 어조를 살리기 위해, 한국어에서는 앞뒤 논박이 살아나는 ‘그러나 사실’로 옮겼습니다.
- source_word: ὁ νόμος ἡμῶν
  english_pob_choice: our law
  chosen_korean: 우리의 율법
  alternatives_korean:
  - 우리 법
  - 우리 율법
  lexicon: LSJ
  rationale: 여기서는 유대인의 토라를 가리키므로 일반적 ‘법’보다 종교적·언약적 범주를 드러내는 ‘율법’이 적절합니다.
- source_word: θεῖος
  english_pob_choice: divine
  chosen_korean: 신적이지
  alternatives_korean:
  - 하나님께 속하지
  - 하나님에게서 난
  - 거룩하지
  lexicon: LSJ
  rationale: 원문의 판단형 형용사 θεῖος를 과도하게 풀지 않고, 상대가 부정하는 속성을 직접 대비시키는 ‘신적’으로 옮겼습니다.
- source_word: τὴν ἐπὶ τῇ εὐσεβείᾳ δόξαν
  english_pob_choice: our honor in matters of piety
  chosen_korean: 경건에 근거한 우리의 명예
  alternatives_korean:
  - 경건에 대한 우리의 명예
  - 경건과 관련한 우리의 평판
  - 경건으로 말미암은 우리의 명예
  lexicon: LSJ
  rationale: δόξα는 단순한 ‘영광’보다 사회적 평판·명예를 포함하므로 ‘명예’로, ἐπὶ τῇ εὐσεβείᾳ는 그 근거를 나타내는 구조로 보아 ‘경건에 근거한’으로 옮겼습니다.
theological_decisions:
- issue: εὐσέβεια의 한국어 대응
  chosen_reading: ‘경건’으로 옮겨 하나님을 향한 경외와 삶의 태도를 함께 드러냈습니다.
  alternative_readings:
  - 경건성
  - 신심
  - 종교적 경건
  rationale: 4마카베오스에서 εὐσέβεια는 단순한 내적 신앙심보다 하나님께 대한 올바른 경외와 실천을 아우르므로, 가장 직접적인 표준어 표현인 ‘경건’이 문맥에 맞습니다.
  doctrine_reference: Translation philosophy §5
