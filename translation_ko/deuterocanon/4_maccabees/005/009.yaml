lexical_decisions:
- source_word: σὺ δέ
  english_pob_choice: But you
  chosen_korean: 그런데 당신은
  alternatives_korean:
  - 하지만 당신은
  - 그러나 당신은
  - 그런데 그대는
  lexicon: LSJ
  rationale: δέ의 대조를 살리되, 현대 한국어에서 자연스러운 역접 연결로 옮겼습니다. 직접 대상을 분명히 하기 위해 주어를 명시했습니다.
- source_word: μοι
  english_pob_choice: to me
  chosen_korean: 제게
  alternatives_korean:
  - 저에게
  - 내게
  - 제 생각에는
  lexicon: LSJ
  rationale: 여격 μοι는 화자의 개인적 판단 기준을 나타내므로, ‘제게’로 옮겨 화자의 시점을 분명히 했습니다.
- source_word: ἀνοητότερον
  english_pob_choice: more foolishly
  chosen_korean: 더 어리석게
  alternatives_korean:
  - 더 어리석게도
  - 더 분별없이
  - 더 무지하게
  lexicon: LSJ
  rationale: 비교급 부사 형태를 반영해 ‘더’로 유지하고, ἀνόητος의 어감은 현대 한국어에서 과도하게 공격적이지 않으면서도 충분히 강한 ‘어리석게’로 옮겼습니다.
- source_word: ποιήσειν δοκεῖς
  english_pob_choice: you seem to be acting
  chosen_korean: 행동하는 것처럼 보입니다
  alternatives_korean:
  - 행하고 있는 것처럼 보입니다
  - 하고 있는 듯합니다
  - 행동하는 듯합니다
  lexicon: LSJ
  rationale: δοκεῖς는 ‘~인 것처럼 보이다’의 판단 표현으로, ποιεῖν은 단순 ‘하다’보다 행위 전체를 드러내는 ‘행동하다’로 옮겼습니다.
