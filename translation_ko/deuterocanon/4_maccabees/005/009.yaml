  lexicon: LSJ
  rationale: δοκεῖς는 ‘~인 것처럼 보이다’의 판단 표현으로, ποιεῖν은 단순 ‘하다’보다 행위 전체를 드러내는 ‘행동하다’로 옮겼습니다.
