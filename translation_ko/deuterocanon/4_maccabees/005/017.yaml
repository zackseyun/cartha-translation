  source_fidelity: 그리스어의 추론 접속사 διὸ는 ‘그러므로’로, 강조사 δὴ는 ‘참으로’로 적절히 반영되었습니다. κατʼ οὐδένα τρόπον의 절대적 부정은 ‘결코’가 자연스럽게 살리며, παρανομεῖν과 ἀξιοῦμεν의 관계도 ‘율법을 어기지 않는 것이 옳다고 여깁니다’로 충실히 옮겼습니다.
