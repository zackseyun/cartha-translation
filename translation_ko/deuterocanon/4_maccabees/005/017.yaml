lexical_decisions:
- source_word: διὸ
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그리하여
  - 따라서
  lexicon: LSJ
  rationale: 앞선 논지를 잇는 추론 접속사이므로 한국어에서도 결과를 이끄는 '그러므로'가 가장 자연스럽고 논리 관계를 분명히 드러냅니다.
- source_word: δὴ
  english_pob_choice: indeed
  chosen_korean: 참으로
  alternatives_korean:
  - 실로
  - 과연
  lexicon: LSJ
  rationale: 강조 입자를 살리기 위해 '참으로'를 선택해 발화의 확신을 보강했습니다.
- source_word: κατʼ οὐδένα τρόπον
  english_pob_choice: in no way
  chosen_korean: 결코
  alternatives_korean:
  - 어떤 방식으로도
  - 전혀
  lexicon: LSJ
  rationale: 절대적 부정을 나타내는 관용구이므로 간결한 부사 '결코'로 옮겨 부정의 강도를 유지했습니다.
- source_word: παρανομεῖν
  english_pob_choice: break the law
  chosen_korean: 율법을 어기지 않는 것
  alternatives_korean:
  - 율법을 범하지 않는 것
  - 율법에 어긋나지 않는 것
  lexicon: LSJ
  rationale: 법을 어기는 행위를 뜻하므로, 이 문맥의 유대적·규범적 뉘앙스를 살려 '율법을 어기다'로 옮겼습니다.
- source_word: ἀξιοῦμεν
  english_pob_choice: we consider it right
  chosen_korean: 옳다고 여깁니다
  alternatives_korean:
  - 마땅하다고 생각합니다
  - 옳다고 판단합니다
  lexicon: LSJ
  rationale: 판단·평가의 의미를 담는 동사이므로 '옳다고 여깁니다'가 문맥상 가장 자연스럽고 격식을 갖춥니다.
theological_decisions:
- issue: '''law''의 범위와 표기'
  chosen_reading: 본문에는 특정어가 없으므로 '율법'으로 옮기되, 대문자화나 추가 설명 없이 유지했습니다.
  alternative_readings:
  - 법
  - 율법(모세 율법)
  rationale: 그리스어에는 한정어가 없지만, 4마카베오스의 문맥상 유대적 규범을 가리키므로 '율법'이 원문과 맥락을 함께 가장 잘 반영합니다. 다만 본문 자체를 넘어서 '모세'를 덧붙이진 않았습니다.
  doctrine_reference: original-language primacy; preserve contextual meaning without over-specifying beyond the source
