  text: But you mock our philosophy[a], as though we did not live in it with blessedness.
  footnotes:
  - marker: a
    text: Or 'as though we did not live in it happily' or 'as though we did not conduct our life in it with good repute.' The Greek noun is rare and may suggest blessedness, happiness, or honorable esteem.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 당신은 우리 철학을 조롱하십니다[a] — 마치 우리가 그 안에서 복된 삶을 살지 않았던 것처럼 말입니다.
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 ‘우리가 그 안에서 행복하게 살지 않았던 것처럼’ 또는 ‘우리가 그 안에서 좋은 평판으로 삶을 영위하지 않았던 것처럼’. 희귀한 그리스어 명사로, 복됨·행복·명예로운 평가의 뜻을 모두 시사할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: χλευάζεις
  english_pob_choice: you mock
  chosen_korean: 조롱하십니다
  alternatives_korean:
  - 비웃으십니다
  - 조롱하십니다
  - 희롱하십니다
  lexicon: LSJ
  rationale: 경멸과 멸시를 담은 직접적인 비난이므로, 현대 한국어에서 강도가 분명한 ‘조롱하다’를 택해 어조를 살렸습니다.
- source_word: φιλοσοφίαν
  english_pob_choice: philosophy
  chosen_korean: 철학
  alternatives_korean:
  - 사상
  - 삶의 방식
  - 가르침
  lexicon: LSJ
  rationale: 4 마카베오서는 유대적 경건을 하나의 ‘철학’으로 자의식 있게 제시하므로, 이를 풀어쓰기보다 그대로 ‘철학’으로 옮겨 저자의 범주를 보존했습니다.
- source_word: εὐλογιστίας
  english_pob_choice: with blessedness
  chosen_korean: 복된 삶
  alternatives_korean:
  - 행복
  - 좋은 평판
  - 축복된 상태
  lexicon: LSJ
  rationale: 희귀한 명사로서 단순한 감정적 행복보다 복과 선한 삶의 품격을 함께 암시하므로, ‘복된 삶’으로 옮겨 종교적·윤리적 뉘앙스를 유지했습니다.
- source_word: ἐν αὐτῇ βιούντων
  english_pob_choice: live in it
  chosen_korean: 그 안에서 삶을 살지
  alternatives_korean:
  - 그 안에서 살지
  - 그것 안에서 살아가지
  - 그것을 따라 살지
  lexicon: LSJ
  rationale: 직역의 ‘그 안에서’ 구조를 유지하되, 한국어에서 자연스러운 ‘삶을 살다’로 풀어 ἐν αὐτῇ가 가리키는 철학 안의 삶의 방식을 드러냈습니다.
theological_decisions:
- issue: 4 마카베오서에서 φιλοσοφία의 의미를 어떻게 보존할지
  chosen_reading: 주석적 의역 없이 본문에 ‘철학’을 유지했습니다.
  alternative_readings:
  - 삶의 방식
  - 경건한 가르침
  rationale: 이 책은 유대 신앙을 철학으로 규정하는 수사적 틀을 사용하므로, 이를 일반적인 종교어로 바꾸면 저자의 자기표현이 약화됩니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 5
- issue: εὐλογιστίας의 의미 범위
  chosen_reading: ‘복된 삶’으로 옮겨 복과 삶의 품격을 함께 살렸습니다.
  alternative_readings:
  - 행복
  - 좋은 평판
  rationale: 문맥상 단순 정서적 행복만이 아니라 그 철학이 낳는 복된 상태와 삶의 성격이 함께 드러나야 하므로, 지나치게 평면적인 표현을 피했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 6
