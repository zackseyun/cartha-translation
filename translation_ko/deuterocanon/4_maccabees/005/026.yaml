  text: He permitted us to eat the things suited to our souls[a], but he forbade us to eat flesh that is opposed to them.
  footnotes:
  - marker: a
    text: Or 'the things akin to our souls' ... 'flesh contrary to them.' The Greek emphasizes moral congruity or incongruity with the soul.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리의 영혼에 맞는 것들은 먹게 하셨지만, 그것들과 반대되는 육체는 먹지 못하게 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리 영혼과 친연한 것들’ … ‘그것들과 상반되는 육체.’ 그리스어는 영혼과의 도덕적 조응 또는 불조응을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκειωθησόμενα
  english_pob_choice: suited
  chosen_korean: 맞는
  alternatives_korean:
  - 어울리는
  - 적합한
  - 친숙한
  lexicon: LSJ
  rationale: ψυχαῖς와의 ‘부합/조응’이라는 의미를 간결하게 살리기 위해 ‘맞는’을 택했습니다. 지나치게 철학적으로 풀지 않으면서도 moral congruity를 드러냅니다.
- source_word: ψυχαῖς
  english_pob_choice: souls
  chosen_korean: 영혼
  alternatives_korean:
  - 생명
  - 자기 자신
  - 혼
  lexicon: LSJ
  rationale: 이 문맥의 ψυχαῖς는 단순한 생명보다 윤리적·인간론적 중심을 가리키므로, 한국어에서는 ‘영혼’이 가장 자연스럽게 그 무게를 보존합니다.
- source_word: ἐπέτρεψεν
  english_pob_choice: permitted
  chosen_korean: 먹게 하셨지만
  alternatives_korean:
  - 허락하셨지만
  - 허용하셨지만
  - 먹도록 두셨지만
  lexicon: LSJ
  rationale: 하나님의 규정적 허락을 매끄럽게 드러내기 위해 동사 구조로 옮겼습니다. 문맥상 식사 허용의 적극성을 살리되 과도한 법률어는 피했습니다.
- source_word: ἐναντιωθησόμενα
  english_pob_choice: opposed
  chosen_korean: 반대되는
  alternatives_korean:
  - 대립하는
  - 거스르는
  - 적대하는
  lexicon: LSJ
  rationale: ‘영혼에 맞는 것들’과 평행을 이루는 반대 의미를 가장 직접적으로 보여 주는 말로 ‘반대되는’을 선택했습니다.
theological_decisions:
- issue: sarco-의 의미를 ‘육체’로 둘지 ‘고기/육’으로 둘지
  chosen_reading: ‘육체’로 번역해 식육 금지의 대상이 되는 물질성과 반대성을 함께 보이게 했습니다.
  alternative_readings:
  - ‘고기’
  - ‘육’
  - ‘고기(육식)’
  rationale: σαρκοφαγεῖν은 문자적으로 ‘살을 먹다’이므로 음식의 물질성을 가리키지만, 이 절의 대조는 단순 식재료보다 영혼과 상반되는 존재 방식에 있습니다. 한국어 ‘육체’는 본문의 윤리적 대조를 드러내는 데 유리합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
