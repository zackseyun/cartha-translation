  text: My fathers will welcome me as a champion[a], since I did not fear your constraints, even unto death.
  footnotes:
  - marker: a
    text: Or, more literally, 'My fathers will receive me for a struggle/contest, since I did not fear your coercions up to death.' The Greek uses agonistic imagery that may evoke athletic or combat language.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 조상들은 내가 당신의 죽음에 이르기까지의 강요를 두려워하지 않았으므로, 나를 투쟁의 경기자[a]로 맞아들일 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경기 또는 투쟁에 나선 사람으로’. 그리스어 ἀγών은 운동경기나 투쟁·경연을 가리키는 말로, 여기서는 그러한 경연의 이미지를 불러일으킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγών᾽
  english_pob_choice: as a champion
  chosen_korean: 챔피언
  alternatives_korean:
  - 경기자로서
  - 투쟁의 사람으로
  - 싸움꾼으로
  lexicon: LSJ
  rationale: 문맥상 ἀγών은 단순한 ‘경기’가 아니라 순교적 인내와 관련된 투쟁/경쟁의 이미지를 띠므로, 영어 POB의 ‘as a champion’을 따라 한국어에서도 명예로운 승리자 이미지를 살렸습니다.
- source_word: οἱ πατέρες
  english_pob_choice: my fathers
  chosen_korean: 내 조상들
  alternatives_korean:
  - 내 아버지들
  - 그 조상들
  - 내 선조들
  lexicon: LSJ
  rationale: 화자가 순교 후 맞이할 대상으로 언급하는 것은 직계 부모보다 믿음의 선대라는 점이 분명하므로, 한국어에서는 자연스럽게 ‘내 조상들’로 옮겼습니다.
- source_word: προσδέξονται
  english_pob_choice: will welcome
  chosen_korean: 받아들일 것입니다
  alternatives_korean:
  - 환영할 것입니다
  - 맞아들일 것입니다
  - 받을 것입니다
  lexicon: LSJ
  rationale: προσδέχομαι의 핵심은 호의적 수용이지만, 여기서는 ‘조상들’이 화자를 영예롭게 맞이하는 장면이어서 ‘받아들이다’가 가장 간결하면서도 무난합니다.
- source_word: μὴ φοβηθέντα σου τὰς μέχρι θανάτου ἀνάγκας
  english_pob_choice: since I did not fear your constraints, even unto death
  chosen_korean: 내가 죽음에 이르기까지 당신의 강압을 두려워하지 않았으므로
  alternatives_korean:
  - 내가 죽기까지 당신의 압력을 두려워하지 않았으므로
  - 내가 죽음에까지 이르는 당신의 강제에 겁내지 않았으므로
  - 내가 죽음에 이르도록 당신의 강압을 무서워하지 않았으므로
  lexicon: LSJ
  rationale: ἀνάγκας는 단순한 ‘제약’보다 강제적 압박·강압의 뜻이 강해 ‘강압’으로 옮겼고, μέχρι θανάτου는 ‘죽음에 이르기까지’로 극대화된 강제의 범위를 살렸습니다.
theological_decisions:
- issue: 조상들의 수용이 어떤 종말론적 함의를 갖는가
  chosen_reading: 본문이 말하는 수준에서, 화자는 충실한 인내 후 조상들에게 영예롭게 받아들여질 것으로 기대합니다.
  alternative_readings:
  - 단순히 조상들에 의한 명예로운 수용으로만 읽기
  - 명시적 사후세계 교리로 확장해 읽기
  rationale: 본문은 ‘조상들’의 환대를 말할 뿐이므로, 사후세계 교리를 과도하게 확정하지 않고 긴장을 유지하는 것이 원문에 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
