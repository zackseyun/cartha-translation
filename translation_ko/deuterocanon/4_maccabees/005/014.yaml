  text: When the tyrant was urging him in this way toward the lawless eating of flesh, Eleazar asked to speak.
translation:
  language: ko
  text: 그 폭군이 이런 방식으로 그를 율법을 어기는 고기 먹기로 부추기고 있을 때, 엘르아자르는 말을 청했습니다.
  philosophy: formal
lexical_decisions:
- source_word: Τοῦτον τὸν τρόπον
  english_pob_choice: in this way
  chosen_korean: 이런 방식으로
  alternatives_korean:
  - 이렇게
  - 이러한 방식으로
  lexicon: τοῦτον τὸν τρόπον
  rationale: 행동의 방식과 절차를 나타내는 지시적 표현이므로, 서술을 자연스럽게 유지하면서도 원문의 지시성을 살려 옮겼습니다.
- source_word: ἐπὶ τὴν ἔκθεσμον σαρκοφαγίαν
  english_pob_choice: toward the lawless eating of flesh
  chosen_korean: 율법을 어기는 고기 먹기로
  alternatives_korean:
  - 불법한 고기 먹기로
  - 율법을 범하는 육식으로
  lexicon: ἔκθεσμος / σαρκοφαγία
  rationale: ἔκθεσμον은 단순한 ‘불법’보다 규범에서 벗어난 ‘율법을 어기는’ 뉘앙스가 강하고, σαρκοφαγία는 직역적인 ‘고기 먹기’가 본문 맥락을 가장 직접적으로 드러냅니다.
- source_word: ἐποτρύνοντος τοῦ τυράννου
  english_pob_choice: the tyrant was urging
  chosen_korean: 폭군이 … 부추기고 있을 때
  alternatives_korean:
  - 폭군이 … 재촉하고 있을 때
  - 폭군이 … 권하고 있을 때
  lexicon: τυραννος / ἐποτρύνω
  rationale: τυραννος는 단순 통치자가 아니라 폭압적 지배자를 가리키므로 ‘폭군’이 적절하며, ἐποτρύνω는 강하게 몰아붙이는 뉘앙스를 살려 ‘부추기다’로 옮겼습니다.
- source_word: λόγον ᾔτησεν
  english_pob_choice: asked to speak
  chosen_korean: 말을 청했습니다
  alternatives_korean:
  - 말할 기회를 청했습니다
  - 발언을 요청했습니다
  lexicon: λόγον αἰτέω
  rationale: 직역하면 ‘말을 청하다/요청하다’가 되며, 단순히 말문을 연 것이 아니라 허락을 구하는 상황을 반영합니다.
theological_decisions:
- issue: ‘lawless eating of flesh’의 윤리적 강도 보존
  chosen_reading: ‘율법을 어기는 고기 먹기’로 옮겨, 식이 문제를 넘어 율법 위반이라는 도덕·종교적 판단을 드러냈습니다.
  alternative_readings:
  - ‘불법한 육식’
  - ‘율법을 범하는 육식’
  rationale: 본문의 ἔκθεσμον은 단순한 취향 문제가 아니라 율법 질서에 대한 노골적 위반을 뜻하므로, 이를 완화하지 않고 한국어에서도 선명하게 유지했습니다.
  doctrine_reference: 4 Maccabees의 순교 윤리와 율법 충성의 주제
- issue: 폭군이라는 정치-신학적 호칭 유지
  chosen_reading: τύραννος를 ‘폭군’으로 직역해 권력의 폭력성과 억압성을 분명히 했습니다.
  alternative_readings:
  - ‘통치자’
  - ‘군주’
  rationale: 이 단어는 중립적 통치자가 아니라 강압적 폭력을 행사하는 지배자를 지칭하므로, 본문의 순교 상황을 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 순교 문맥에서의 권력 비판
