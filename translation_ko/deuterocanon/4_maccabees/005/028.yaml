translation:
  language: ko
  text: 그러나 너는 나를 향해 이런 조롱의 웃음을 웃지 못할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘웃다’와 ‘웃음’의 동족어 결합을 사용하여, 단순한 웃음이 아니라 조롱하는 웃음을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλʼ
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그렇지만
  lexicon: LSJ
  rationale: 강한 대조를 나타내는 접속사로, 앞선 맥락에서의 전환을 자연스러운 현대 한국어로 옮기기 위해 ‘그러나’를 선택했습니다.
- source_word: γελάσεις ... τοῦτον τὸν γέλωτα
  english_pob_choice: you will laugh this laugh
  chosen_korean: 이런 조롱의 웃음을 웃지 못할 것입니다
  alternatives_korean:
  - 이 웃음을 웃지 못할 것입니다
  - 나를 비웃지 못할 것입니다
  lexicon: LSJ
  rationale: 그리스어의 동족어 결합(‘laugh this laugh’)을 한국어에서 그대로 살리기 어렵기 때문에, 반복성과 경멸적 뉘앙스를 함께 드러내는 ‘조롱의 웃음’으로 옮겼습니다.
- source_word: κατʼ ἐμοῦ
  english_pob_choice: at me
  chosen_korean: 나를 향해
  alternatives_korean:
  - 내게
  - 내게 대고
  lexicon: LSJ
  rationale: κατά + 속격이 웃음의 대상에 대한 적대적·조롱적 방향을 나타내므로, 한국어에서는 관계 방향을 살린 ‘나를 향해’로 풀었습니다.
theological_decisions:
- issue: 경멸적 웃음의 표현 방식
  chosen_reading: 직역적 반복을 완전히 고정하기보다, 한국어에서 이해 가능한 조롱의 의미를 보존하는 방향으로 번역했습니다.
  alternative_readings:
  - ‘너는 이 웃음을 나에게 웃지 못할 것입니다’
  - ‘너는 나에게 이 웃음을 터뜨리지 못할 것입니다’
  rationale: 본문의 핵심은 단순한 웃음이 아니라 수치 주기 위한 조롱이므로, 의미를 드러내되 원문의 적대감을 약화시키지 않도록 ‘조롱의 웃음’으로 처리했습니다.
  doctrine_reference: 문맥 주해
- issue: 주어의 격식
  chosen_reading: 직접 인용 내부의 인칭 대명사와 종결은 현대 서술체로 유지했습니다.
  alternative_readings:
  - 더 경어적인 종결
  - 더 고어적인 종결
  rationale: 이 절은 서사적 진술이므로 합쇼체를 유지하는 것이 가장 자연스럽고, 인용문의 공격성도 그대로 전달합니다.
  doctrine_reference: 문체 원칙
