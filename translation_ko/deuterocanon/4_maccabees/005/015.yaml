  text: 'And having taken the right to speak, he began to address the assembly as follows:'
translation:
  language: ko
  text: 그는 말할 권한을 받은 뒤, 군중에게 다음과 같이 말하기 시작했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβὼν ... ἐξουσίαν
  english_pob_choice: having taken the right
  chosen_korean: 권한을 받은 뒤
  alternatives_korean:
  - 말할 권한을 얻은 뒤
  - 말할 허락을 받은 뒤
  lexicon: BDAG
  rationale: Ἐξουσίαν은 이 문맥에서 ‘권위’보다 ‘말할 권한/허락’의 뜻이 자연스럽고, ‘받다’가 λάβων의 수동적 뉘앙스를 잘 살립니다.
- source_word: τοῦ λέγειν
  english_pob_choice: to speak
  chosen_korean: 말할
  alternatives_korean:
  - 말하는
  - 발언할
  lexicon: BDAG
  rationale: 목적/영역을 나타내는 부정사 구문이므로 한국어에서는 ‘말할’로 풀어 주어, 단순 동작이 아니라 발화의 권한을 분명히 했습니다.
- source_word: δημηγορεῖν
  english_pob_choice: to address the assembly
  chosen_korean: 군중에게
  alternatives_korean:
  - 회중에게
  - 모인 사람들에게
  - 집회에서
  lexicon: LSJ
  rationale: δημηγορεῖν은 공적으로 모인 사람들 앞에서 말하는 행위이므로, ‘군중에게’로 공적 연설의 장면을 살리되 현대 한국어에서 부자연스러운 ‘연설하다’를 피했습니다.
- source_word: οὕτως
  english_pob_choice: as follows
  chosen_korean: 다음과 같이
  alternatives_korean:
  - 이렇게
  - 그와 같이
  lexicon: BDAG
  rationale: 뒤이어 나오는 직접화법을 여는 관용적 표현이므로, 한국어 문장 흐름에 맞는 ‘다음과 같이’를 택했습니다.
theological_decisions:
- issue: δημηγορεῖν의 장면 성격
  chosen_reading: 공적 연설의 시작을 알리는 역사적 서술로 옮겼습니다.
  alternative_readings:
  - ‘군중을 향해 장광설을 늘어놓기 시작했습니다’
  - ‘공개적으로 설교하기 시작했습니다’
  rationale: 본문은 연설의 내용이 아니라 발언 개시를 말하므로, 평가적 뉘앙스나 종교적 용어를 덧씌우지 않고 중립적으로 처리했습니다.
  doctrine_reference: 서술 문맥 보존
