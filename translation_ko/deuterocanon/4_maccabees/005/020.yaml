lexical_decisions:
- source_word: παρανομεῖν
  english_pob_choice: to break the law
  chosen_korean: 율법을 어기는 것
  alternatives_korean:
  - 율법을 범하는 것
  - 불법을 저지르는 것
  - 법을 어기는 것
  lexicon: LSJ
  rationale: ἁρμόζει는 법을 어기는 행위를 가리키므로, POB의 'break the law'에 맞춰 자연스럽고 직설적인 '율법을 어기는 것'으로 옮겼습니다.
- source_word: ἐν μικροῖς καὶ ἐν μεγάλοις
  english_pob_choice: in small matters and in great matters
  chosen_korean: 작은 일에서나 큰 일에서나
  alternatives_korean:
  - 작은 일들에서나 큰 일들에서나
  - 작은 것에서나 큰 것에서나
  - 작은 문제에서나 큰 문제에서나
  lexicon: LSJ
  rationale: 중립적인 중성 복수의 대비를 한국어에서 가장 자연스럽게 살리기 위해 '일'을 써서 짧고 대조적인 구조를 유지했습니다.
- source_word: ἰσοδύναμόν ἐστιν
  english_pob_choice: equivalent
  chosen_korean: 같은 것입니다
  alternatives_korean:
  - 동등한 것입니다
  - 동일한 것입니다
  - 서로 같은 것입니다
  lexicon: LSJ
  rationale: 이 형용사는 힘이나 가치가 같다는 뜻이므로, 본문의 논지를 과도하게 설명하지 않으면서 한국어에서 가장 직접적인 '같은 것입니다'로 옮겼습니다.
- source_word: γὰρ
  english_pob_choice: For
  chosen_korean: 그러므로
  alternatives_korean:
  - 왜냐하면
  - 실로
  - 이는
  lexicon: LSJ
  rationale: 앞 문맥의 논증을 이어 주는 설명적 접속으로 기능하므로, 한국어에서는 자연스럽게 결론·설명 전환을 나타내는 '그러므로'를 택했습니다.
theological_decisions:
- issue: 작은 죄와 큰 죄의 관계
  chosen_reading: 본문은 작은 영역이든 큰 영역이든 율법을 어기는 행위가 같은 범주의 위반임을 말합니다.
  alternative_readings:
  - 작은 죄와 큰 죄가 처벌까지 완전히 같다는 뜻은 아닙니다.
  - 단지 어떤 위반이든 율법 위반으로 계산된다는 뜻일 수 있습니다.
  rationale: ἰσοδύναμόν ἐστιν의 강한 동등성 진술을 살리되, 본문이 말하지 않는 형벌 체계까지 한국어가 덧붙이지 않도록 했습니다.
  doctrine_reference: 본문의 긴장을 보존하고 범위를 확장하지 않음
