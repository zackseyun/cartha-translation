  chosen_korean: 같은 것입니다
  alternatives_korean:
  - 동등한 것입니다
  - 동일한 것입니다
  - 서로 같은 것입니다
  lexicon: LSJ
  rationale: 이 형용사는 힘이나 가치가 같다는 뜻이므로, 본문의 논지를 과도하게 설명하지 않으면서 한국어에서 가장 직접적인 '같은 것입니다'로 옮겼습니다.
- source_word: γὰρ
