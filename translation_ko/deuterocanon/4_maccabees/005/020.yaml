  lexicon: LSJ
  rationale: 앞 문맥의 논증을 이어 주는 설명적 접속으로 기능하므로, 한국어에서는 자연스럽게 결론·설명 전환을 나타내는 '그러므로'를 택했습니다.
theological_decisions:
- issue: 작은 죄와 큰 죄의 관계
  chosen_reading: 본문은 작은 영역이든 큰 영역이든 율법을 어기는 행위가 같은 범주의 위반임을 말합니다.
  alternative_readings:
  - 작은 죄와 큰 죄가 처벌까지 완전히 같다는 뜻은 아닙니다.
  - 단지 어떤 위반이든 율법 위반으로 계산된다는 뜻일 수 있습니다.
  rationale: ἰσοδύναμόν ἐστιν의 강한 동등성 진술을 살리되, 본문이 말하지 않는 형벌 체계까지 한국어가 덧붙이지 않도록 했습니다.
  doctrine_reference: 본문의 긴장을 보존하고 범위를 확장하지 않음
