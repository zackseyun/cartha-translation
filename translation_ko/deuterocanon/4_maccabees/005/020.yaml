lexical_decisions:
- source_word: παρανομεῖν
  english_pob_choice: to break the law
  chosen_korean: 율법을 어기는 것
  alternatives_korean:
  - 율법을 범하는 것
  - 불법을 저지르는 것
  - 법을 어기는 것
  lexicon: LSJ
  rationale: ἁρμόζει는 법을 어기는 행위를 가리키므로, POB의 'break the law'에 맞춰 자연스럽고 직설적인 '율법을 어기는 것'으로 옮겼습니다.
- source_word: ἐν μικροῖς καὶ ἐν μεγάλοις
  english_pob_choice: in small matters and in great matters
  chosen_korean: 작은 일에서나 큰 일에서나
  alternatives_korean:
  - 작은 일들에서나 큰 일들에서나
  - 작은 것에서나 큰 것에서나
  - 작은 문제에서나 큰 문제에서나
  lexicon: LSJ
  rationale: 중립적인 중성 복수의 대비를 한국어에서 가장 자연스럽게 살리기 위해 '일'을 써서 짧고 대조적인 구조를 유지했습니다.
- source_word: ἰσοδύναμόν ἐστιν
