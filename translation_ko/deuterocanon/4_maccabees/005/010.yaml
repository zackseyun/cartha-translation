  - 더 해석적으로 ‘정신 차리지 않겠느냐’로 옮길 수도 있습니다.
  rationale: 4마카베오서는 논박적·교훈적 수사를 사용하므로, 질문형을 보존하는 것이 본문의 공격성과 설득력을 더 잘 전달합니다.
  doctrine_reference: Translation philosophy §§1, 6
