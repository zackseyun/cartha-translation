base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/010.yaml
  text: If[a], while vainly boasting about the truth, you still despise even me at the cost of your own punishment[b], will you not wake up from your foolish philosophy?
  footnotes:
  - marker: a
    text: Or 'to your own punishment' or 'bringing punishment on yourself.' The Greek phrase can be rendered more literally, but the sense is that such contempt results in punishment for the hearer himself.
    reason: lexical_alternative
  - marker: b
    text: Or 'babbling philosophy.' The adjective behind 'foolish' can denote empty, silly, or prating speech.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 그대가 진리를 두고 헛되이 자랑하면서도 나까지 업신여겨 그대 자신의 형벌을 자초하면서도[a], 너희의 헛소리나 하는 철학에서 깨어나지 않겠습니까?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그대 자신의 형벌로’ 또는 ‘그대 자신에게 형벌을 가져오면서’로 옮길 수 있습니다. 그리스어 구는 더 문자적으로 번역할 수도 있으나, 그러한 경멸이 당사자 자신에게 형벌로 되돌아온다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘쓸데없이 지껄이는 철학’ 또는 ‘헛된 철학’으로 옮길 수 있습니다. 형용사 φλύαρος는 빈말을 하거나 쓸데없이 떠드는 뉘앙스를 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κενοδοξῶν
  english_pob_choice: vainly boasting
  chosen_korean: 헛되이 자랑하면서
  alternatives_korean:
  - 헛되이 뽐내면서
  - 헛된 자랑을 하면서
  - 공허하게 자랑하면서
  lexicon: LSJ
  rationale: κενοδοξέω는 내용 없는 자기과시를 뜻하므로, 단순한 ‘자랑’보다 부사어 ‘헛되이’를 붙여 공허한 과시성을 살렸습니다.
- source_word: περὶ τὸ ἀληθές
  english_pob_choice: about the truth
  chosen_korean: 진리를 두고
  alternatives_korean:
  - 진리에 관해
  - 참된 것을 두고
  - 진리와 관련하여
  lexicon: LSJ
  rationale: 직역하면 ‘진리에 관하여’이지만, 한국어에서는 ‘~을 두고’가 논쟁적·수사적 맥락을 더 자연스럽게 드러냅니다.
- source_word: καταφρονήσεις
  english_pob_choice: despise
  chosen_korean: 업신여기고
  alternatives_korean:
  - 경멸하고
  - 깔보고
  - 무시하고
  lexicon: LSJ
  rationale: καταφρονέω의 경멸적 무시를 한국어 동사 ‘업신여기다’가 가장 직접적으로 담습니다.
- source_word: ἐπὶ τῇ ἰδίᾳ τιμωρίᾳ
  english_pob_choice: at the cost of your own punishment
  chosen_korean: 너희 자신의 벌을 자초한다면
  alternatives_korean:
  - 너희 자신의 벌이 되도록
  - 너희 자신에게 벌을 가져온다면
  - 너희 자신의 형벌 위에
  lexicon: LSJ
  rationale: 이 구는 단순한 장소가 아니라 결과를 뜻하므로, ‘자초하다’로 자기에게 되돌아오는 역설을 살렸습니다.
- source_word: οὐκ ἐξυπνώσεις
  english_pob_choice: will you not wake up
  chosen_korean: 깨어나지 않겠느냐
  alternatives_korean:
  - 정신 차리지 않겠느냐
  - 눈을 뜨지 않겠느냐
  - 잠에서 깨지 않겠느냐
  lexicon: LSJ
  rationale: ἐξυπνέω의 비유적 의미를 유지하되, 한국어 수사문답형으로 강한 촉구를 전달했습니다.
- source_word: φλυάρου φιλοσοφίας
  english_pob_choice: foolish philosophy
  chosen_korean: 어리석은 철학
  alternatives_korean:
  - 헛소리하는 철학
  - 떠드는 철학
  - 쓸데없는 철학
  lexicon: LSJ
  rationale: φλύαρος는 ‘빈말하는, 쓸데없이 지껄이는’의 뉘앙스를 가지지만, 본문의 공격적 수사를 한국어에서 가장 자연스럽게 드러내는 기본어는 ‘어리석은’입니다.
theological_decisions:
- issue: 수사적 질문의 강도 유지
  chosen_reading: 문장 전체를 반문형으로 옮겨, 상대의 태도를 책망하며 즉각적인 각성을 요구하는 원문의 압박감을 유지했습니다.
  alternative_readings:
