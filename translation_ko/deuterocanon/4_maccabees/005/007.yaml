lexical_decisions:
- source_word: διὰ τί γὰρ
  english_pob_choice: For why
  chosen_korean: 그런데 어찌하여
  alternatives_korean:
  - 왜
  - 무슨 이유로
  lexicon: LSJ
  rationale: γάρ의 설명·논박 흐름을 살리면서, 수사적 질문의 직접성을 한국어로 자연스럽게 옮겼습니다.
- source_word: τῆς φύσεως
  english_pob_choice: nature
  chosen_korean: 자연이
  alternatives_korean:
  - 자연 본성이
  - 자연의 질서가
  lexicon: LSJ
  rationale: 주어 역할로 자연을 의인화한 표현을 살려, 뒤의 ‘마련해 준’과 연결되도록 했습니다.
- source_word: κεχαρισμένης
  english_pob_choice: has made
  chosen_korean: 마련해 준
  alternatives_korean:
  - 은혜롭게 마련해 준
  - 베풀어 준
  - 만들어 준
  lexicon: LSJ
  rationale: χαρίζομαι의 ‘주다/베풀다’ 뉘앙스를 반영하되, 한국어에서는 식품의 상태를 설명하는 자연스러운 완료 표현으로 옮겼습니다.
- source_word: τὴν τοῦδε τοῦ ζῴου σαρκοφαγίαν
  english_pob_choice: eating the flesh of this animal
  chosen_korean: 이 짐승의 고기를 먹는 것
  alternatives_korean:
  - 이 짐승의 살을 먹는 것
  - 이 동물의 고기를 먹는 것
  - 이 짐승의 고기 먹기
  lexicon: LSJ
  rationale: sarco-phagia의 직역성(‘살/고기 먹기’)을 유지하면서도, 한국어에서는 어색함을 줄여 수사적 공격성을 보존했습니다.
- source_word: βδελύττεις
  english_pob_choice: loathe
  chosen_korean: 혐오합니까
  alternatives_korean:
  - 싫어합니까
  - 역겨워합니까
  - 몹시 싫어합니까
  lexicon: LSJ
  rationale: 강한 혐오·혐오감의 의미를 살리기 위해 ‘혐오하다’를 택했습니다.
theological_decisions:
- issue: 4 Maccabees의 수사적 비난을 현대 한국어로 어떻게 전달할지
  chosen_reading: 직설적 질문 형태와 ‘혐오합니까’를 유지해, 원문의 논박과 도발적 어조를 약화시키지 않았습니다.
  alternative_readings:
  - 좀 더 완곡한 ‘싫어합니까’
  - 설명형으로 바꾼 ‘왜 먹지 않습니까’
  rationale: 이 절은 감정적·논박적 압박이 핵심이므로, 완곡화하면 화자의 논증 힘이 약해집니다.
  doctrine_reference: 수사적 담화의 정서 강도 보존
- issue: κεχαρισμένης의 의미를 ‘은혜’로 신학화할지 여부
  chosen_reading: ‘마련해 준’으로 번역해, 본문이 말하는 자연의 부여를 나타내되 ‘은혜’라는 신학 용어는 전면에 두지 않았습니다.
  alternative_readings:
  - 은혜롭게 마련해 준
  - 친절히 베풀어 준
  rationale: 여기서 χάρις 계열은 일반적 ‘베풀어 줌/부여됨’에 가깝고, 기독교 신학적 은혜를 직접 요구하는 문맥은 아닙니다.
  doctrine_reference: 헬라어 χαρίζομαι의 일반 의미
