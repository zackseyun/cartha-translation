  text: nor will I disregard the sacred oaths of the fathers to keep the law[b][a],
  footnotes:
  - marker: a
    text: Or 'the sacred oaths of our ancestors.' The Greek προγόνων can mean 'ancestors' or 'forefathers'; 'fathers' is retained to reflect the source's masculine ancestral language.
    reason: lexical_alternative
  - marker: b
    text: That is, the Jewish ancestral law; alternatively, 'the Law.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 조상들의 거룩한 맹세, 곧 율법을 지키기 위한 맹세를 무시하지 않겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리 조상들의 거룩한 맹세.’ προγόνων은 ‘조상들’이나 ‘선조들’을 뜻할 수 있으나, 여기서는 남성 조상 언어를 반영해 ‘조상들’을 유지했습니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 유대의 조상적 율법, 또는 ‘그 율법’.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε ... οὐ παρήσω
  english_pob_choice: nor will I disregard
  chosen_korean: 무시하지 않겠습니다
  alternatives_korean:
  - 저버리지 않겠습니다
  - 간과하지 않겠습니다
  - 내버려 두지 않겠습니다
  lexicon: LSJ
  rationale: 부정 접속의 거절을 한국어에서 자연스럽게 살리면서, 맹세를 유효한 것으로 존중하지 않는 태도를 분명하게 나타냅니다.
- source_word: ἱεροὺς
  english_pob_choice: sacred
  chosen_korean: 거룩한
  alternatives_korean:
  - 신성한
  - 성스러운
  - 엄숙한
  lexicon: LSJ
  rationale: 맹세의 종교적 엄중함을 살리되, 한국어에서 ‘거룩한 맹세’가 가장 자연스럽고 어감도 강합니다.
- source_word: τῶν προγόνων
  english_pob_choice: of our fathers
  chosen_korean: 조상들의
  alternatives_korean:
  - 우리의 조상들의
  - 선조들의
  - 아버지들의
  lexicon: LSJ
  rationale: 그리스어는 남성 조상 언어를 쓰지만, 한국어에서는 ‘조상들’이 혈통·전승의 의미를 가장 자연스럽게 전달합니다. ‘아버지들’은 직역적이지만 현대 한국어에서는 부자연스럽습니다.
- source_word: περὶ τοῦ φυλάξαι τὸν νόμον
  english_pob_choice: to keep the law
  chosen_korean: 율법을 지키기 위한
  alternatives_korean:
  - 율법을 지키려는
  - 율법을 지키도록 한
  - 율법을 보존하기 위한
  lexicon: LSJ
  rationale: περὶ τοῦ + 부정과거 부정사 구조가 맹세의 목적/내용을 나타내므로, 한국어에서는 ‘~하기 위한’으로 자연스럽게 풀었습니다. ‘율법’은 유대적 토라를 가리키는 표준 번역입니다.
- source_word: ὅρκους
  english_pob_choice: oaths
  chosen_korean: 맹세
  alternatives_korean:
  - 서약
  - 맹약
  - 誓約
  lexicon: LSJ
  rationale: ἱεροὺς와 결합된 ὅρκους는 단순한 약속보다 ‘맹세’가 더 정확하며, 반복을 피하기 위해 앞쪽은 ‘거룩한 맹세’로 묶었습니다.
theological_decisions:
- issue: τὸν νόμον의 지시 대상
  chosen_reading: 율법
  alternative_readings:
  - 법
  - 율법서
  - 하나님의 율법
  rationale: 맥락상 유대 조상들이 지켜야 할 토라를 가리키므로, 본문 의미를 가장 직접적으로 드러내는 ‘율법’을 택했습니다.
  doctrine_reference: Translation philosophy 1, 6
- issue: προγόνων의 성별 언어
  chosen_reading: 조상들의
  alternative_readings:
  - 아버지들의
  - 선조들의
  rationale: 그리스어의 남성 조상 언어를 한국어에서 지나치게 성별화하지 않으면서도 전승의 연속성을 보존하는 표현을 선택했습니다.
  doctrine_reference: Translation philosophy 4
