  - 어떤 폭력도 순종보다 더 강하다고 여기지 않습니다
  rationale: 본문은 단순한 필요가 아니라 coercive pressure를 말하므로, ‘강제’와 ‘더 강한’으로 옮겨 강압적 뉘앙스를 유지했습니다.
  doctrine_reference: 'Translation philosophy: 원문 우선, 수사적 강도를 약화시키지 않음.'
