  text: 그러나 우리는, 안티오쿠스여, 신성한 율법에 설득되어[a] 그 율법에 따라 살아가며, 우리 율법에 대한 순종보다 더 강한 강제는 어떤 것도 없다고 여깁니다.
  philosophy: optimal-equivalence
  footnotes:
