  lexicon: LSJ
  rationale: 정치적 어감을 그대로 옮기기보다 문맥상 율법 아래의 삶의 방식이라는 의미를 자연스러운 한국어로 풀어, 행위의 규범성을 유지했습니다.
- source_word: τῆς πρὸς τὸν νόμον ἡμῶν εὐπειθείας
  english_pob_choice: than obedience to our law
  chosen_korean: 우리 율법에 대한 순종
