  text: But we[a], Antiochus, being persuaded by a divine law, order our lives by it, and we consider no compulsion to be stronger than obedience to our law.
  footnotes:
  - marker: a
    text: Or, 'having been convinced by the divine law, we conduct our lives accordingly.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하지만 우리[a]는, 안티오쿠스여, 신적 율법에 설득되었기에 그것에 따라 삶을 살아가며, 우리 율법에 대한 순종보다 더 강한 강제는 아무것도 없다고 여깁니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘신적 율법에 설득되어, 그에 따라 삶을 살아갑니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: θείῳ
  english_pob_choice: divine
  chosen_korean: 신적
  alternatives_korean:
  - 하나님의
  - 거룩한
  lexicon: LSJ
  rationale: νόμῳ를 수식하는 θείῳ의 성격을 살리면서도, 본문이 직접적으로 말하는 ‘신적/하늘적 기원’의 뉘앙스를 보존하기 위해 ‘신적’을 택했습니다.
- source_word: πεπεισμένοι
  english_pob_choice: having been persuaded
  chosen_korean: 설득되었기에
  alternatives_korean:
  - 확신했기에
  - 설복되었기에
  lexicon: LSJ
  rationale: 완료 수동 분사로서 이미 받아들여진 상태를 드러내기 위해 원인절 형태로 옮겼고, 강압보다 논증에 의해 마음이 굳어진 뉘앙스를 살렸습니다.
- source_word: πολιτευόμεθα
  english_pob_choice: order our lives by it
  chosen_korean: 그것에 따라 삶을 살아가며
  alternatives_korean:
  - 그것을 따라 시민답게 살며
  - 그것으로 삶을 다스리며
  lexicon: LSJ
  rationale: 정치적 어감을 그대로 옮기기보다 문맥상 율법 아래의 삶의 방식이라는 의미를 자연스러운 한국어로 풀어, 행위의 규범성을 유지했습니다.
- source_word: τῆς πρὸς τὸν νόμον ἡμῶν εὐπειθείας
  english_pob_choice: than obedience to our law
  chosen_korean: 우리 율법에 대한 순종
  alternatives_korean:
  - 우리 율법에 대한 복종
  - 우리 율법을 따르는 순종
  lexicon: LSJ
  rationale: εὐπείθεια의 핵심인 ‘기꺼이 따름/순종’을 살리되, 영어 POB의 ‘obedience’와 대응시키기 위해 ‘순종’을 선택했습니다.
