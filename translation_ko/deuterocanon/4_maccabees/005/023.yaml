  text: For it teaches us self-control, so that we may master all pleasures and desires, and to practice courage, so that we may willingly endure every pain;
translation:
  language: ko
  text: 이것은 우리에게 절제를 가르쳐서, 모든 쾌락과 욕망을 다스리게 하고, 용기를 훈련시켜서, 모든 고통을 기꺼이 견디게 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘절제’는 여기서 단순한 금욕이 아니라 자신을 훈련하여 욕망을 다스리는 덕목을 가리킵니다.
    reason: theological_note
lexical_decisions:
- source_word: σωφροσύνην
  english_pob_choice: self-control
  chosen_korean: 절제
  alternatives_korean:
  - 자기 절제
  - 근신
  lexicon: LSJ
  rationale: 윤리적 덕목을 가리키는 말로서, 이 문맥에서는 자신을 다스리는 태도를 간결하게 드러내는 ‘절제’가 가장 자연스럽습니다.
- source_word: κρατεῖν
  english_pob_choice: master
  chosen_korean: 다스리게 하다
  alternatives_korean:
  - 제압하게 하다
  - 지배하게 하다
  lexicon: LSJ
  rationale: ‘쥐다/이기다’의 힘 있는 의미를 살리면서도 한국어에서 도덕적 자기통제를 자연스럽게 표현하려면 ‘다스리게 하다’가 적절합니다.
- source_word: ἀνδρείαν
  english_pob_choice: courage
  chosen_korean: 용기
  alternatives_korean:
  - 담대함
  - 굳셈
  lexicon: LSJ
  rationale: 고전적 ‘남성다움’보다 헬레니즘 윤리 문맥의 덕목 의미를 살려, 현대 한국어의 표준 덕목어인 ‘용기’로 옮겼습니다.
- source_word: ἑκουσίως ὑπομένειν
  english_pob_choice: willingly endure
  chosen_korean: 기꺼이 견디게 하다
  alternatives_korean:
  - 자원하여 견디게 하다
  - 자발적으로 감당하게 하다
  lexicon: LSJ
  rationale: ‘ἑκουσίως’의 자발성을 ‘기꺼이’로, ‘ὑπομένειν’의 버팀과 인내를 ‘견디다’로 살려, 순교적 고통 수용의 뉘앙스를 보존했습니다.
theological_decisions:
- issue: ὥστε + 부정사 절의 목적/결과 뉘앙스
  chosen_reading: 한국어에서는 ‘-해서 …하게 하다’ 구조로 이어, 가르침의 목적과 결과를 모두 드러내는 자연스러운 종속 관계로 표현했습니다.
  alternative_readings:
  - ‘그래서 …한다’로 결과만 강조하는 번역
  - ‘…하도록’로 목적만 강조하는 번역
  rationale: 본문은 절제와 용기의 가르침이 각각 어떤 삶의 태도를 낳는지 설명하므로, 목적성과 결과성을 함께 보존하는 연결이 가장 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy §§5–6'
