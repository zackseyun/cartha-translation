  text: Therefore we do not eat defiling food[a]; for because we believe that the law has been established by God, we know that the Creator of the world, in giving the law[b], also sympathizes with our nature.
  footnotes:
  - marker: a
    text: Or, more literally, 'Therefore we do not eat what is defiled.'
    reason: lexical_alternative
  - marker: b
    text: The Greek may also be understood as 'the Creator of the world, when legislating, is sympathetic to us in accordance with nature.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 우리는 더럽혀진 것을 먹지 않습니다[a]. 하나님께서 율법을 세우셨음을 믿으므로, 세상의 창조주께서 율법을 제정하실 때[b] 우리의 본성에 맞추어 우리를 헤아리신다는 것을 알고 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하면, ‘그러므로 우리는 더럽혀진 것을 먹지 않는다.’
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘세상의 창조주께서는 입법하실 때 우리의 본성에 따라 우리에게 공감하신다’로도 이해될 수 있습니다.
    reason: alternative_reading
