theological_decisions:
- issue: 하나님의 율법 수여와 인간 본성의 관계
  chosen_reading: 창조주께서 율법을 주실 때 우리 본성에 따라 우리를 동정하신다는 의미를 살렸습니다.
  alternative_readings:
  - 창조주께서 우리 본성에 맞게 율법을 제정하신다는 철학적 의미
  - 창조주께서 율법을 주실 때 우리에게 공감하신다는 더 약한 의미
  rationale: κατὰ φύσιν과 συμπαθεῖ의 결합은 단순한 추상적 자연법론으로만 환원되지 않으며, 동시에 인간을 고려한 율법 수여라는 강조도 포함합니다. 두 층위를 모두 보존하도록 번역했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
