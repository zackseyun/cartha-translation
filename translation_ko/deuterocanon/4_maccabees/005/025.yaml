  text: 그러므로 우리는 더러운 것을 먹지 않습니다[a]. 우리는 율법이 하나님께서 세우신 것임을 믿기 때문이며, 또한 이 세상의 창조주께서 율법을 주실 때[b] 우리 본성에 따라 우리를 동정하신다는 것을 알고 있기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘더럽혀진 것을 먹지 않는다’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘세상의 창조주께서 입법하실 때 우리에게 우리 본성에 따라 동정하신다’로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: μιεροφαγοῦμεν
