  text: I will not pity my own old age so much that I would, by my own act, abolish the ancestral law.
translation:
  language: ko
  text: 저는 제 노년을 그토록 가엾게 여겨, 제 스스로 조상들의 율법을 폐하지는 않겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘제 스스로’는 διʼ ἐμαυτοῦ를 옮긴 것으로, 화자 자신이 그 행위의 주체가 됨을 나타냅니다.
    reason: korean_style_note
  - marker: b
    text: ‘조상들의 율법’은 πάτριον νόμον을 옮긴 것으로, 조상에게서 전해진 율법을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκτειρήσω
  english_pob_choice: I will pity
  chosen_korean: 불쌍히 여기지 않겠습니다
  alternatives_korean:
  - 가엾게 여기지 않겠습니다
  - 연민하지 않겠습니다
  lexicon: BDAG
  rationale: 감정적 연민을 뜻하는 동사로, 여기서는 자기 늙음을 향한 과도한 연민을 부정하는 뜻이므로 ‘불쌍히 여기다’가 자연스럽고 의미를 잘 살립니다.
- source_word: τὸ ἐμαυτοῦ γῆρας
  english_pob_choice: my own old age
  chosen_korean: 제 늙음
  alternatives_korean:
  - 제 나이 듦
  - 저의 늙은 나이
  lexicon: LSJ
  rationale: γῆρας는 ‘늙음/노년’이므로 현대 한국어에서는 ‘늙음’이 직접적입니다. ἐμαυτοῦ의 자기지시를 1인칭 소유격으로 충분히 살렸습니다.
- source_word: διʼ ἐμαυτοῦ
  english_pob_choice: by my own act
  chosen_korean: 제 몸소 행함으로
  alternatives_korean:
  - 제 자신으로
  - 제 스스로 한 일로
  - 제 힘으로
  lexicon: BDAG
  rationale: 자기 자신이 수단이 되어 율법을 깨뜨리게 된다는 agency를 나타내므로, ‘제 몸소 행함으로’가 행위 주체의 직접성을 드러냅니다.
- source_word: τὸν πάτριον νόμον
  english_pob_choice: the ancestral law
  chosen_korean: 조상들의 율법
  alternatives_korean:
  - 선조들의 율법
  - 부조들의 율법
  - 조상의 율법
  lexicon: BDAG
  rationale: πάτριος는 조상에게서 전해진 유산의 성격을 띠므로, 유대교적 전승 맥락을 자연스럽게 드러내는 ‘조상들의 율법’이 적절합니다.
- source_word: καταλῦσαι
  english_pob_choice: abolish
  chosen_korean: 폐하지는 않겠습니다
  alternatives_korean:
  - 무너뜨리지는 않겠습니다
  - 무효화하지는 않겠습니다
  - 헐어버리지는 않겠습니다
  lexicon: BDAG
  rationale: 문맥상 율법의 권위를 자기 행위로 무너뜨리는 뜻이므로, 한국어에서는 ‘폐하다’가 가장 간결하게 대응합니다.
theological_decisions:
- issue: 자기 늙음을 향한 연민과 율법 준수의 긴장
  chosen_reading: 화자는 자기 늙음을 이유로 조상들의 율법을 어기는 길을 택하지 않겠다고 선언합니다.
  alternative_readings:
  - 늙음을 가볍게 보지 않겠다는 자기관리의 표현
  - 단순한 은유적 과장
  rationale: 문장의 핵심은 나이 듦에 대한 감정이 아니라, 그 감정이 율법 폐기로 이어지지 않도록 단호히 거부하는 윤리적 결단입니다.
  doctrine_reference: 'Translation philosophy: source-directed ethical force; martyrdom and Torah fidelity in 4 Maccabees.'
