  chosen_korean: 지배할 수는 있겠지만
  alternatives_korean:
  - 폭정할 수는 있겠지만
  - 폭군처럼 군림할 수는 있겠지만
  lexicon: LSJ
  rationale: 직역하면 ‘폭정을 하다’이지만, 한국어에서는 지나치게 어색하므로 압제적 지배라는 힘을 살리면서도 문맥의 대비를 유지하는 표현을 택했습니다.
- source_word: τῶν δὲ ἐμῶν περὶ τῆς εὐσεβείας λογισμῶν
  english_pob_choice: my reasonings concerning godliness
  chosen_korean: 경건에 관한 내 이성적 판단들
  alternatives_korean:
  - 경건에 관한 내 추론들
  - 경건에 대한 내 생각들
  - 경건에 관한 내 합리적 판단들
  lexicon: LSJ
  rationale: 4마카베오스에서 λογισμός는 단순한 ‘생각’이 아니라 이성적 숙고를 가리키므로, 그 철학적 무게를 드러내는 표현을 선택했습니다.
- source_word: οὔτε λόγοις, οὔτε δι᾽ ἔργων
  english_pob_choice: neither by words nor by deeds
  chosen_korean: 말로도 행위로도
  alternatives_korean:
  - 말로도 행동으로도
  - 말로도 업적으로도
  - 말로도 일로도
  lexicon: LSJ
  rationale: 대구 구조를 살리며, λόγοις와 ἔργων의 수단적 의미를 자연스러운 한국어 병렬로 옮겼습니다.
- source_word: δεσπόσεις
  english_pob_choice: you will rule
  chosen_korean: 주권을 행사하지 못할 것입니다
  alternatives_korean:
  - 군림하지 못할 것입니다
  - 지배하지 못할 것입니다
  - 주인 노릇을 하지 못할 것입니다
  lexicon: LSJ
  rationale: δεσπόζω의 ‘주인처럼 다스리다’는 뜻을 살리되, 내적 판단을 억누를 수 없다는 점을 분명히 하기 위해 ‘주권을 행사하다’를 택했습니다.
theological_decisions:
- issue: ἀσέβεια/εὐσέβεια의 종교·윤리적 대비를 한국어에서 어떻게 보존할지
  chosen_reading: 경건하지 않은 자들 / 경건
  alternative_readings:
  - 불경한 자들 / 경건
  - 불경건한 자들 / 경건함
  rationale: 이 구절은 폭군의 외적 지배와 경건한 내적 판단의 불가침성을 대조하므로, ‘경건’ 계열 표현으로 원문의 종교적 대립을 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
