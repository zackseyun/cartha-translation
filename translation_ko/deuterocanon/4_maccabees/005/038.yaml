  text: For you may indeed tyrannize over the ungodly[a], but over my reasonings concerning godliness you will rule neither by words nor by deeds.
  footnotes:
  - marker: a
    text: Or 'my rational judgments concerning piety.' The Greek λογισμῶν is a key term in 4 Maccabees for reasoned moral deliberation.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 경건하지 않은 자들을 지배할 수는 있겠지만, 경건에 관한 내 이성적 판단들에는 말로도 행위로도 결코 주권을 행사하지 못할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ὁ λογισμός 계열은 4마카베오스에서 이성적 숙고와 도덕적 판단을 가리키는 핵심어이므로, 여기서는 단순한 ‘생각’보다 ‘이성적 판단’의 뜻을 살렸습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσεβῶν
  english_pob_choice: the ungodly
  chosen_korean: 경건하지 않은 자들
  alternatives_korean:
  - 불경한 자들
  - 불경건한 자들
  lexicon: LSJ
  rationale: ἀσέβεια/εὐσέβεια의 대조를 살리면서도, 한국어에서 자연스럽고 도덕·종교적 대비가 분명한 표현으로 옮겼습니다.
- source_word: τυραννήσεις
