  lexicon: LSJ
  rationale: 복합동사는 음식이 의례적으로 더럽혀지거나 속된 것으로 된 상태에서 먹는 행위를 뜻하므로, '더럽혀진 음식'이 종교적 오염의 의미를 가장 직접적으로 드러냅니다.
