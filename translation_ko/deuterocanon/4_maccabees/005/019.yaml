  text: 그러므로 우리가 부정한 음식을 먹는다면, 그것을 작은 죄라고 여기지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “부정한 것을 먹는다면.” 그리스어 동사는 의례적으로 부정하거나 속된 것을 먹는 행위를 한 단어로 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ... νομίσῃς
  english_pob_choice: do not suppose
  chosen_korean: 생각해서는 안 됩니다
  alternatives_korean:
