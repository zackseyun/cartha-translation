  rationale: μικράν이 ἁμαρτίαν을 직접 수식하므로, 죄의 경중을 약화하지 않도록 가장 პირდაპირ적으로 '작은 죄'를 택했습니다.
- source_word: ταύτην
  english_pob_choice: this
