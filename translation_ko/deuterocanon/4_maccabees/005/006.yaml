base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/006.yaml
  text: Before I begin the tortures against you[a], old man, I would advise you of this, so that by tasting the pork you might save yourself. For I respect your age and your gray hair, though after having had it for so long a time[b], you do not seem to me to philosophize by practicing the religion of the Jews.
  footnotes:
  - marker: a
    text: Or, 'by tasting swine's flesh, you might preserve your life.'
    reason: lexical_alternative
  - marker: b
    text: The Greek says 'be philosophizing,' preserving the book's recurring language of philosophy and reason.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 당신에게 가할 고문을 시작하기 전에, 노인이여, 한 가지 권고하겠습니다. 당신이 돼지고기를 맛보아 목숨을 건질 수 있도록 말입니다.[a] 나는 당신의 나이와 흰머리를 존중하기 때문입니다. 그러나 그토록 오랫동안 그 흰머리를 지니고 있으면서도, 당신은 유대인의 종교를 실천하면서 철학하고 있는 것으로는 내게 보이지 않습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘돼지의 고기를 맛보아 당신의 생명을 보존할 수 있도록 말입니다.’
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘철학하다’라는 말을 사용하여, 이 책에서 반복되는 철학과 이성의 어휘를 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὶν ἄρξασθαι
  english_pob_choice: Before I begin
  chosen_korean: 내가 … 시작하기 전에
  alternatives_korean:
  - 시작하기 전에
  - 내가 … 시작하기 앞서
  lexicon: LSJ
  rationale: πρίν + 부정사 구문은 시간 부사절로 옮기는 것이 자연스러워, 한국어에서도 주어를 분명히 하여 흐름을 살렸습니다.
- source_word: τῶν κατὰ σοῦ βασάνων
  english_pob_choice: the tortures against you
