  - 너를 향한 고문
  lexicon: LSJ
  rationale: βάσανοι는 단순한 고통이 아니라 실제 고문/심문 행위를 가리키므로 ‘고문’으로 옮겼고, κατὰ σοῦ의 대상을 분명히 했습니다.
- source_word: ὑείων
  english_pob_choice: pork
  chosen_korean: 돼지고기
  alternatives_korean:
  - 돼지의 고기
  - 돼지 고기
  lexicon: LSJ
  rationale: ὑείων은 돼지의 고기라는 뜻이므로, 현대 한국어에서 자연스러운 ‘돼지고기’로 옮겼습니다.
- source_word: φιλοσοφεῖν
  english_pob_choice: to philosophize
  chosen_korean: 철학하는 사람처럼
  alternatives_korean:
  - 철학하다
  - 철학을 실천하다
  lexicon: LSJ
  rationale: 4마카베오기에서 반복되는 철학/이성 어휘를 살리기 위해 ‘철학하다’ 계열을 유지하되, 한국어 문장에서는 비교 구문으로 자연화했습니다.
theological_decisions:
- issue: τῇ Ἰουδαίων χρωμένῃ θρησκείᾳ의 번역
  chosen_reading: 유대인들의 종교를 따르며
  alternative_readings:
  - 유대인들의 종교를 실천하며
  - 유대인들의 종교를 사용하며
  rationale: χρῶμαι의 ‘사용하다/실천하다’ 뉘앙스를 반영하되, θρησκεία를 현대 독자가 이해하기 쉬운 ‘종교’로 옮겼습니다. 여기서는 교리적 평가보다 행위 방식에 대한 조롱이 핵심입니다.
  doctrine_reference: '번역 원칙: 원문이 드러내는 행위·태도의 의미를 보존하고, 후대 교회 용어로 평탄화하지 않습니다.'
- issue: οὔ μοι δοκεῖς φιλοσοφεῖν의 뉘앙스
  chosen_reading: 너는 나에게는 … 철학하는 사람처럼 보이지 않소
  alternative_readings:
  - 너는 나에게 철학하는 것처럼 보이지 않소
  - 너는 나에게 현명하게 사는 것처럼 보이지 않소
  rationale: 4마카베오기 특유의 ‘철학’ 어휘를 유지하여, 경건과 이성을 결부시키는 저자의 문체를 드러내는 쪽을 택했습니다.
  doctrine_reference: '번역 원칙: 핵심 반복어를 보존하여 책의 수사와 신학적 색채를 가립니다.'
