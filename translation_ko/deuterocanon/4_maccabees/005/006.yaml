  yaml_path: translation/deuterocanon/4_maccabees/005/006.yaml
  text: Before I begin the tortures against you[a], old man, I would advise you of this, so that by tasting the pork you might save yourself. For I respect your age and your gray hair, though after having had it for so long a time[b], you do not seem to me to philosophize by practicing the religion of the Jews.
  footnotes:
  - marker: a
    text: Or, 'by tasting swine's flesh, you might preserve your life.'
    reason: lexical_alternative
  - marker: b
    text: The Greek says 'be philosophizing,' preserving the book's recurring language of philosophy and reason.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 네게 가해질 고문을 시작하기 전에, 늙은이여, 나는 네게 이렇게 권하겠소. 돼지고기를 맛보고서 너 자신을 살리시오. 나는 네 나이와 흰머리를 존중하기 때문이오. 그러나 그것을 오랫동안 지녀 왔으면서도, 너는 유대인들의 종교를 따르며 철학하는 사람처럼 나에게는 보이지 않소.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘돼지의 고기를 맛보아 네 생명을 보존하라.’
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘철학하다’를 써서, 이 책의 반복되는 철학과 이성의 언어를 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὶν ἄρξασθαι
  english_pob_choice: Before I begin
  chosen_korean: 내가 … 시작하기 전에
  alternatives_korean:
  - 시작하기 전에
  - 내가 … 시작하기 앞서
  lexicon: LSJ
  rationale: πρίν + 부정사 구문은 시간 부사절로 옮기는 것이 자연스러워, 한국어에서도 주어를 분명히 하여 흐름을 살렸습니다.
- source_word: τῶν κατὰ σοῦ βασάνων
  english_pob_choice: the tortures against you
  chosen_korean: 네게 가해질 고문
  alternatives_korean:
  - 네게 가해질 고문들
  - 너를 향한 고문
  lexicon: LSJ
  rationale: βάσανοι는 단순한 고통이 아니라 실제 고문/심문 행위를 가리키므로 ‘고문’으로 옮겼고, κατὰ σοῦ의 대상을 분명히 했습니다.
- source_word: ὑείων
  english_pob_choice: pork
  chosen_korean: 돼지고기
  alternatives_korean:
  - 돼지의 고기
  - 돼지 고기
  lexicon: LSJ
  rationale: ὑείων은 돼지의 고기라는 뜻이므로, 현대 한국어에서 자연스러운 ‘돼지고기’로 옮겼습니다.
- source_word: φιλοσοφεῖν
  english_pob_choice: to philosophize
  chosen_korean: 철학하는 사람처럼
  alternatives_korean:
  - 철학하다
  - 철학을 실천하다
  lexicon: LSJ
  rationale: 4마카베오기에서 반복되는 철학/이성 어휘를 살리기 위해 ‘철학하다’ 계열을 유지하되, 한국어 문장에서는 비교 구문으로 자연화했습니다.
theological_decisions:
- issue: τῇ Ἰουδαίων χρωμένῃ θρησκείᾳ의 번역
  chosen_reading: 유대인들의 종교를 따르며
  alternative_readings:
  - 유대인들의 종교를 실천하며
  - 유대인들의 종교를 사용하며
  rationale: χρῶμαι의 ‘사용하다/실천하다’ 뉘앙스를 반영하되, θρησκεία를 현대 독자가 이해하기 쉬운 ‘종교’로 옮겼습니다. 여기서는 교리적 평가보다 행위 방식에 대한 조롱이 핵심입니다.
  doctrine_reference: '번역 원칙: 원문이 드러내는 행위·태도의 의미를 보존하고, 후대 교회 용어로 평탄화하지 않습니다.'
- issue: οὔ μοι δοκεῖς φιλοσοφεῖν의 뉘앙스
  chosen_reading: 너는 나에게는 … 철학하는 사람처럼 보이지 않소
  alternative_readings:
  - 너는 나에게 철학하는 것처럼 보이지 않소
  - 너는 나에게 현명하게 사는 것처럼 보이지 않소
  rationale: 4마카베오기 특유의 ‘철학’ 어휘를 유지하여, 경건과 이성을 결부시키는 저자의 문체를 드러내는 쪽을 택했습니다.
  doctrine_reference: '번역 원칙: 핵심 반복어를 보존하여 책의 수사와 신학적 색채를 가립니다.'
