lexical_decisions:
- source_word: σὲ
  english_pob_choice: you
  chosen_korean: 너를
  alternatives_korean:
  - 당신을
  - 너
  lexicon: BDAG
  rationale: 2인칭 단수 목적격을 직접적으로 반영했고, 경고하는 문맥상 친밀하지만 강한 호소를 유지하기 위해 ‘너를’로 옮겼습니다.
- source_word: ἐν τῷ νῦν βίῳ
  english_pob_choice: in the present life
  chosen_korean: 현재의 삶에서도
  alternatives_korean:
  - 이 삶에서
  - 지금의 삶에서도
  - 현세에서도
  lexicon: BDAG
  rationale: ‘지금의 삶’이라는 시간성을 살리면서, 뒤의 사후 벌과 대조되도록 ‘에서도’로 포함 범위를 드러냈습니다.
- source_word: θανόντα
  english_pob_choice: after you die
  chosen_korean: 네가 죽은 뒤에도
  alternatives_korean:
  - 죽은 뒤에도
  - 죽고 나서도
  - 네가 죽으면
  lexicon: BDAG
  rationale: 분사구가 시간 부사적으로 작동하는 점을 살려, 벌이 죽음 이후에도 이어진다는 의미를 자연스럽게 표현했습니다.
- source_word: τιμωρήσεται
  english_pob_choice: he will punish
  chosen_korean: 그가 너를 벌하실 것입니다
  alternatives_korean:
  - 그가 너에게 벌을 내리실 것입니다
  - 그가 너에게 복수하실 것입니다
  - 그가 너를 처벌하실 것입니다
  lexicon: BDAG
  rationale: 미래 중간태의 행위 주체를 보존하기 위해 능동적으로 옮겼고, 문맥상 강한 징벌 의미를 ‘벌하다’로 자연스럽게 전달했습니다.
theological_decisions:
- issue: 문장에 드러나지 않은 주어의 보충
  chosen_reading: 그가 너를 벌하실 것입니다
  alternative_readings:
  - 너는 벌을 받을 것입니다
  rationale: 그리스어는 3인칭 단수 중간태로 행위 주체를 지우지 않으므로, 한국어도 수동으로 흐리지 않고 주체성을 드러냈습니다.
  doctrine_reference: Original-language primacy over translation tradition.
- issue: 현세와 사후의 이중 벌 형식
  chosen_reading: 현재의 삶에서도, 그리고 네가 죽은 뒤에도
  alternative_readings:
  - 이 삶에서도, 그리고 죽은 뒤에도
  - 지금도, 죽은 뒤에도
  rationale: 본문은 벌이 이생과 사후 दोनों 영역에 걸친다는 점을 분명히 하므로, 두 시간대를 모두 유지해 그 긴장을 약화하지 않았습니다.
  doctrine_reference: Original-language primacy over translation tradition.
