  lexicon: LSJ
  rationale: 기본 의미인 ‘친구’를 유지해 원문의 어휘를 직접 반영했고, 궁정적 뉘앙스는 문맥에서 읽히도록 두었습니다.
- source_word: ἀφήγησιν
  english_pob_choice: oversight / charge
  chosen_korean: 맡아보게 될
  alternatives_korean:
  - 책임지게 될
  - 감독하게 될
  - 다스리게 될
  lexicon: LSJ
  rationale: 이 어형은 이 문맥에서 왕국의 사무를 위임받아 처리하는 권한을 가리키므로, ‘맡아보다’로 행정적 위임과 관리의 뉘앙스를 살렸습니다.
- source_word: τῶν ἐπὶ τῆς βασιλείας πραγμάτων
  english_pob_choice: the affairs of the kingdom
  chosen_korean: 왕국의 일들
  alternatives_korean:
  - 왕국의 사무
  - 왕국의 업무
  - 왕국의 일
  - 왕실의 일들
  lexicon: LSJ
  rationale: πράγματα의 ‘일들/사무’라는 넓은 의미를 보존하면서, βασιλεία를 ‘왕국’으로 옮겨 정치·행정적 맥락을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 왕국에서 맡는 역할의 성격
  chosen_reading: 친구가 되는 것과 함께 왕국의 일들을 맡아보는 행정적·정무적 권한으로 이해했습니다.
  alternative_readings:
  - 단순한 우정의 약속으로만 읽는 해석
  - 궁정의 총애를 뜻하는 표현으로만 좁히는 해석
  rationale: 원문과 영어 POB의 ‘have charge of the affairs of the kingdom’ 흐름에 따라, 관계적 호칭과 실제 권한 부여를 함께 살렸습니다.
  doctrine_reference: 문맥상 왕권 수여와 궁정 언어
- issue: πεισθεὶς의 조건문 처리
  chosen_reading: 수동 분사형의 문법을 한국어 조건문으로 풀어 ‘설득되면’이라고 옮겼습니다.
  alternative_readings:
  - ‘설득된 뒤에는’
  - ‘설득을 받아서’
  rationale: 원문의 조건적 기능을 유지하면서, 한국어에서 독자가 즉시 이해할 수 있는 종속절로 재구성했습니다.
  doctrine_reference: 문법적-수사적 본문 해석
