  text: 그러나 네가 설득되면, 네가 친구가 될 것이며, 왕국의 일을 맡게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕국의 일을 관리하게 될 것입니다.’ 그리스어 ἀφήγησις는 이 문맥에서 관리, 지도 또는 통솔을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεισθεὶς
  english_pob_choice: if you are persuaded
  chosen_korean: 설득되면
  alternatives_korean:
  - 권유를 받아들이면
  - 납득하면
  - 마음을 돌리면
  lexicon: LSJ
  rationale: 조건적 의미를 분명히 드러내면서도, 수동 분사의 직역보다 한국어 문맥에 자연스럽게 맞는 표현으로 옮겼습니다.
- source_word: φίλος
