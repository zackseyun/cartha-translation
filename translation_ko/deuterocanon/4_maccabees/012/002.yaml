  text: Whom the tyrant pitied[a], even though he had been cruelly mistreated by his brothers, seeing that he was already wearing the chains,
  footnotes:
  - marker: a
    text: Or, 'bound in chains' or 'with the chains fastened around him.' The Greek literally describes him as having the chains around him.
