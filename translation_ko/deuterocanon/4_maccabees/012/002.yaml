translation:
  language: ko
  text: 그는 폭군이 불쌍히 여겼습니다[a]. 비록 자기 형제들에게 잔인하게 학대를 당했지만, 이미 사슬이 몸에 둘려 있는 것을 보고서였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사슬에 묶인’, ‘사슬이 몸에 둘려 있는’으로도 옮길 수 있습니다. 헬라어는 문자적으로 그가 사슬을 몸에 두르고 있는 모습을 묘사합니다.
    reason: lexical_alternative
