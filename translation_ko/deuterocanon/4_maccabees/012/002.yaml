translation:
  language: ko
  text: 폭군은 비록 자기 형제들에게 심하게 모욕을 당했지만, 그가 이미 사슬에 묶여 있는 것을 보고 그를 가엾게 여겼습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사슬이 몸에 둘려 있는’으로 옮길 수 있습니다. 헬라어는 문자적으로 그에게 사슬이 둘려 있는 상태를 묘사합니다.
    reason: lexical_alternative
