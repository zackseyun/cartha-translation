  - 혹독하게 해를 입었지만
  - 몹시 학대를 당했지만
  lexicon: LSJ
  rationale: 이 분사형은 단순한 ‘나쁨’보다 가혹한 처우를 뜻하므로, 영어 POB의 ‘cruelly abused’에 맞춰 ‘잔인하게 학대를 당하다’로 처리했습니다.
- source_word: τὰ δεσμὰ περικείμενον
  english_pob_choice: wearing the chains
  chosen_korean: 사슬이 몸에 둘려 있는
  alternatives_korean:
  - 사슬을 두른
  - 사슬에 묶인
  - 사슬이 둘러진
  lexicon: LSJ
  rationale: 직역하면 ‘사슬이 둘려 있는’ 상태를 말하므로, 영어 주석이 지적한 시각적 이미지를 살려 ‘몸에 둘려 있는’으로 옮겼습니다.
