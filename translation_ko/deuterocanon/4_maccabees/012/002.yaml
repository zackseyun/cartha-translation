revisions:
- from: 그는 폭군이 불쌍히 여겼습니다[a]. 비록 자기 형제들에게 잔인하게 학대를 당했지만, 이미 사슬이 몸에 둘려 있는 것을 보고서였습니다.
  to: 폭군은 비록 자기 형제들에게 심하게 모욕을 당했지만, 그가 이미 사슬에 묶여 있는 것을 보고 그를 가엾게 여겼습니다[a].
  rationale: 그리스어의 주격 분사들이 모두 ‘폭군’을 수식한다는 문법 관계를 한국어에서 명확히 반영했습니다. ‘자기 형제들’은 αὐτοῦ가 폭군을 가리키는 관계를 자연스럽게 드러냅니다. ‘사슬에 묶여 있는’은 δεσμὰ περικείμενον의 상태 묘사를 보존하며, 더 문자적인 표현은 각주에 남겼습니다.
