  lexicon: LSJ
  rationale: ἀδελφῶν의 남성 복수 의미를 그대로 살려 ‘형제들’로 옮겼고, 행위 주체를 분명히 하기 위해 ‘자기’를 더했습니다.
- source_word: κακισθείς
  english_pob_choice: had been cruelly abused
  chosen_korean: 잔인하게 학대를 당했지만
  alternatives_korean:
