lexical_decisions:
- source_word: πλησιέστερον
  english_pob_choice: to come nearer
  chosen_korean: 더 가까이 오게 하라고
  alternatives_korean:
  - 가까이
  - 더 가까이
  lexicon: LSJ
  rationale: 비교급 부사로서 단순한 위치가 아니라 ‘더 가까이’라는 이동의 뉘앙스를 살려, 한국어에서는 목적절 형태로 자연스럽게 풀었습니다.
- source_word: μετεπέμψατο
  english_pob_choice: sent for
  chosen_korean: 사람을 보내
  alternatives_korean:
  - 불러오고
  - 소집하고
  - 불러
  lexicon: LSJ
  rationale: 중간태의 μεταπέμπω는 ‘불러오다/소환하다’의 뜻이지만, 서술 흐름상 현대 한국어에서는 ‘사람을 보내다’로 옮기면 요청 동작이 자연스럽게 드러납니다.
- source_word: παρηγορεῖν
  english_pob_choice: to encourage
  chosen_korean: 위로하려고
  alternatives_korean:
  - 격려하려고
  - 달래려고
  - 위로하고
  lexicon: LSJ
  rationale: 이 동사의 핵심은 상대를 돕기 위한 말/행동이므로, EN POB가 ‘encourage’로 잡은 긴장을 반영하되 한국어에서는 문맥상 정서적·권면적 요소를 함께 담는 ‘위로하다’를 택했습니다.
- source_word: ἐπειρᾶτο
  english_pob_choice: tried
  chosen_korean: 애쓰면서
  alternatives_korean:
  - 시도하면서
  - 노력하면서
  - 애썼습니다
  lexicon: LSJ
  rationale: 미완료과거의 지속적 시도를 살려, 단회적 완료보다 진행 중인 노력감을 주는 부사구로 옮겼습니다.
theological_decisions:
- issue: 직접 화법 도입부의 시제와 호흡
  chosen_reading: 동사들을 연결해 ‘…오게 하라고 사람을 보내고 — 위로하려고 애쓰면서 — 말했습니다’로 처리해, 연속적 시도라는 서술 흐름을 살렸습니다.
  alternative_readings:
  - ‘사람을 보내어 그를 더 가까이 불러오고, 그를 위로하려고 애쓰며 말했습니다’
  - ‘그를 가까이 오라고 불러, 위로하려고 애쓰며 말했습니다’
  rationale: 원문은 목적과 시도가 겹쳐지는 문장 구조이므로, 한국어에서도 사건의 연쇄와 지속성을 보존하는 것이 의미를 가장 잘 전달합니다.
  doctrine_reference: 서사 문맥 보존; 헬라어 미완료상과 분사구의 연속성
