base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/012/011.yaml
  text: “You unholy man,” she said[a], “most ungodly tyrant of all wicked men, were you not ashamed, after receiving good things and kingship from God[b], to kill his servants and torture the practitioners of godliness?”
  footnotes:
  - marker: a
    text: Or “most impious tyrant of all the wicked.” The Greek piles up superlatives and class language for rhetorical force.
    reason: lexical_alternative
  - marker: b
    text: “Practitioners of godliness” translates a phrase that could also be rendered “devotees of piety” or, more literally, “ascetics of godliness.”
    reason: lexical_alternative
translation:
  language: ko
  text: “불경한 자여,” 그녀가 말했습니다. “모든 악한 자들 가운데 가장 불경한 폭군이여[a], 하나님에게서 좋은 것들과 왕권을 받고서도 그분의 종들을 죽이고 경건의 실천자들을[b] 고문하는 것을 부끄러워하지 않았습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 최상급 표현과 집단 표현을 겹쳐 써서 모욕의 수사적 강도를 높입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘경건의 실천자들’은 더 문자적으로는 ‘경건의 수행자들’ 또는 ‘경건의 금욕자들’로도 옮길 수 있습니다. 여기서는 실천과 헌신의 의미를 함께 살렸습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνόσιε
  english_pob_choice: You unholy man
  chosen_korean: 불경한 자여
  alternatives_korean:
  - 부정한 자여
  - 거룩하지 않은 자여
  - 불경한 사람이여
  lexicon: LSJ
  rationale: 호격의 ἀνόσιε는 신성/경건을 범한 자를 직접 꾸짖는 말이므로, 현대 한국어에서 가장 자연스럽고 강한 ‘불경한 자’로 옮겼습니다.
- source_word: πάντων τῶν πονηρῶν ἀσεβέστατε τύραννε
  english_pob_choice: most ungodly tyrant of all evil men
  chosen_korean: 모든 악한 자들 가운데서 가장 불경한 폭군
  alternatives_korean:
  - 모든 악인들 가운데서 가장 불경한 폭군
  - 모든 사악한 자들 가운데서 가장 경건치 않은 폭군
  - 모든 악한 사람들 가운데서 가장 불경한 폭군
  lexicon: LSJ
  rationale: 그리스어의 슈퍼라티브와 누적된 비난을 살리기 위해 ‘가장 불경한 폭군’으로 두고, πάντων τῶν πονηρῶν은 ‘모든 악한 자들 가운데서’로 집단을 드러내어 수사적 강도를 유지했습니다.
- source_word: τὴν βασιλείαν
  english_pob_choice: kingship
  chosen_korean: 왕권
  alternatives_korean:
  - 왕위
  - 통치권
  - 왕국
  lexicon: LSJ
  rationale: 여기서는 영토보다 부여된 통치 지위가 핵심이므로, ‘왕권’이 수여받은 권세의 의미를 가장 간결하게 드러냅니다.
- source_word: τοὺς τῆς εὐσεβείας ἀσκητάς
  english_pob_choice: the practitioners of godliness
  chosen_korean: 경건의 실천자들
  alternatives_korean:
  - 경건의 수련자들
  - 경건의 수행자들
  - 경건의 훈련을 받은 이들
  lexicon: LSJ
  rationale: ἀσκητής는 단순한 교파적 ‘수도자’가 아니라 훈련과 실천의 뉘앙스를 가지므로, ‘경건의 실천자들’이 문맥의 윤리적·수행적 의미를 가장 잘 살립니다.
theological_decisions:
- issue: εὐσέβεια의 한국어 처리
  chosen_reading: 경건
  alternative_readings:
  - 경건함
  - 신심
  - 경외
  rationale: 4마카베오기에서 εὐσέβεια는 하나님께 대한 올바른 태도와 실천을 함께 포함하므로, 전통적이지만 문맥상 정확한 ‘경건’을 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 6
- issue: θεράποντας αὐτοῦ의 관계성
  chosen_reading: 그의 종들
  alternative_readings:
  - 그의 시종들
  - 그를 섬기는 자들
  - 그의 일꾼들
  rationale: 문맥은 하나님께 속한 자들을 가리키며, 특정 직분보다 소속과 섬김의 관계가 중요하므로 ‘종들’이 가장 직접적입니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
