lexical_decisions:
- source_word: Οὐκ ἀπαντυμολοῶ
  english_pob_choice: I will not renounce
  chosen_korean: 저버리지 않겠습니다
  alternatives_korean:
  - 부인하지 않겠습니다
  - 저버리지 않겠습니다
  - 포기하지 않겠습니다
  lexicon: LSJ
  rationale: ἀπαντυμολοῶ는 거부·배반·부인을 포함하는 강한 동사이므로, 합쇼체에서 압박 속에서도 끝내 버리지 않는 뜻을 자연스럽게 드러내는 ‘저버리다’가 적절합니다.
- source_word: τῆς τῶν ἀδελφῶν μου μαρτυρίας
  english_pob_choice: the testimony of my brothers
  chosen_korean: 형제들의 증언
  alternatives_korean:
  - 형제들의 증언
  - 형제들의 증거
  - 형제들의 순교 증언
  lexicon: LSJ
  rationale: μαρτυρίας의 기본 의미는 ‘증언/증거’이며, 본문은 순교 맥락을 지니지만 단어 자체를 과도하게 풀어 쓰지 않기 위해 ‘증언’으로 옮겼습니다.
- source_word: τῶν ἀδελφῶν μου
  english_pob_choice: my brothers
  chosen_korean: 형제들의
  alternatives_korean:
  - 내 형제들의
  - 형제들의
  lexicon: LSJ
  rationale: 서술 맥락상 말하는 이의 남성 형제들을 가리키므로, 직역 성격을 유지하면서도 한국어 어순에 맞게 ‘형제들의’로 처리했습니다.
theological_decisions:
- issue: μαρτυρίας에 순교 의미를 직접 드러낼지 여부
  chosen_reading: ‘증언’으로 번역하되 순교 함의를 본문 밖으로 끌어내지 않음
  alternative_readings:
  - 순교
  - 증거
  rationale: 4마카베오스 전체는 순교 신학을 강하게 전개하지만, 여기서는 명사 자체의 직접 의미를 우선해야 하므로 ‘증언’으로 두고 순교적 배경은 해석 여지로 남겼습니다.
  doctrine_reference: 의미 충실성 우선, 신학적 긴장은 보존
