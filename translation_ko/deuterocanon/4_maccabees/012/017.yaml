  lexicon: LSJ
  rationale: ἀπαντυμολοῶ는 거부·배반·부인을 포함하는 강한 동사이므로, 합쇼체에서 압박 속에서도 끝내 버리지 않는 뜻을 자연스럽게 드러내는 ‘저버리다’가 적절합니다.
