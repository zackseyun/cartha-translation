  source_fidelity: ‘그러면’은 εἴπω의 목적을 나타내는 접속법을 조건·결과 관계로 바꾸므로 적절하지 않습니다. 목적 관계를 ‘…말할 수 있도록’으로 옮기는 것이 원문에 충실합니다. 또한 σὺν αὐτῷ는 왕을 가리키는 것으로 자연스럽게 연결하되, φίλοι의 폭넓은 의미는 각주에서 보존할 수 있습니다.
