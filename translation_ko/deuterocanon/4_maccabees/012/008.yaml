  yaml_path: translation/deuterocanon/4_maccabees/012/008.yaml
  text: Release me[a], he says, so that I may tell the king and all his friends who are with him.
  footnotes:
  - marker: a
    text: Or 'all the friends with him' or 'all his companions with him.' The Greek φίλοι can denote personal friends or royal associates/courtiers, but 'friends' is retained as the most direct rendering.
    reason: lexical_alternative
translation:
  language: ko
  text: “나를 풀어 주십시오. 그러면 제가 왕과 그와 함께 있는 모든 친구들에게 말하겠습니다.”라고 그가 말합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그와 함께 있는 모든 친구들’ 또는 ‘그와 함께 있는 모든 동료들’. 그리스어 φίλοι는 개인적 친구뿐 아니라 왕실 측근이나 궁정 인사를 가리킬 수 있으나, 여기서는 가장 직접적인 번역으로 ‘친구들’을 유지했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπόλυσόν με
  english_pob_choice: Release me
  chosen_korean: 나를 풀어 주십시오
  alternatives_korean:
  - 나를 놓아 주십시오
  - 저를 풀어 주십시오
  - 나를 석방해 주십시오
  lexicon: LSJ
  rationale: ἀπολύω의 직접 명령은 단순한 해방 요청으로 읽히며, 한국어에서는 감옥/구속의 맥락을 과도하게 좁히지 않는 “풀어 주십시오”가 가장 자연스럽습니다.
- source_word: εἴπω τῷ βασιλεῖ
  english_pob_choice: so that I may tell the king
  chosen_korean: 그러면 제가 왕에게 말하겠습니다
  alternatives_korean:
  - 그래서 제가 왕에게 이야기하겠습니다
  - 제가 왕에게 전하겠습니다
  lexicon: LSJ
  rationale: εἴπω는 여기서 목적을 나타내며, 한국어에서는 ‘말하다’보다 목적 관계를 살려 ‘그러면/그래서 … 말하겠습니다’로 옮기는 것이 직접적입니다.
- source_word: τοῖς σὺν αὐτῷ φίλοις πᾶσιν
  english_pob_choice: all his friends who are with him
  chosen_korean: 그와 함께 있는 모든 친구들에게
  alternatives_korean:
  - 그와 함께 있는 모든 동료들에게
  - 그와 함께 있는 모든 시종들에게
  - 그와 함께 있는 모든 벗들에게
  lexicon: LSJ
  rationale: φίλοι는 문자적으로 ‘친구들’이지만 왕실 측근·동료를 포함할 수 있어, POB의 직접 렌더링을 살리되 ‘그와 함께 있는’으로 σὺν αὐτῷ를 분명히 했습니다.
