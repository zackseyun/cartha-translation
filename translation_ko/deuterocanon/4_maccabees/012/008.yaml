  terminology: ‘풀어 주십시오’는 ἀπόλυσόν με에 적절하며 구금·법적 석방으로 과도하게 한정하지 않습니다. φίλοι는 본문에서 ‘친구들’을 유지하고, 왕의 측근·궁정 인사라는 가능한 함의를 각주로 밝혀야 합니다.
