  to: “제가 왕과 왕의 곁에 있는 모든 친구들에게 말할 수 있도록 나를 풀어 주십시오.”라고 그가 말합니다.[a]
  rationale: 목적을 나타내는 εἴπω를 ‘말할 수 있도록’으로 번역하여 원문의 통사 관계를 보존했습니다. ‘왕의 곁에 있는’은 σὺν αὐτῷ의 지시 대상을 자연스럽게 드러내며, φίλοι의 어휘적 여지는 각주에서 유지했습니다.
