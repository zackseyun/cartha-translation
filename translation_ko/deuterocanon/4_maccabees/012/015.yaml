  source_fidelity: ‘선한 이들의 챔피언’은 τῆς ἀρετῆς ἀγωνιστάς를 ‘선한 사람들의 챔피언’으로 바꾸어 원문의 ‘덕/탁월성의 투사들’이라는 수식 관계와 핵심 윤리 용어 ἀρετή를 잃습니다. 또한 ‘무고하게’는 한국어에서 피해자의 무죄 또는 행위자의 무고함으로도 읽힐 수 있어, ἀναίτιως의 ‘아무런 정당한 이유 없이’라는 뜻을 더 명료하게 옮길 필요가 있습니다.
  naturalness: ‘덕의 투사들’은 이 문맥에서 ἀγωνιστής의 투쟁 및 명예의 뉘앙스를 자연스럽게 전달합니다. ‘아무런 까닭 없이 죽였으므로’는 인과 관계와 비난의 어조를 현대 표준 한국어 합쇼체로 명료하게 표현합니다.
  terminology: ἀρετή는 철학적·윤리적 핵심어이므로 ‘덕’으로 유지합니다. ἀγωνιστής는 현대 스포츠 용어인 ‘챔피언’보다 ‘투사들’이 본문의 도덕적 투쟁 맥락에 적합합니다. ἀναίτιως는 ‘아무런 까닭 없이’로 옮겨 ‘부당하게’라는 해석적 좁힘을 피합니다.
