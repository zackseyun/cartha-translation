  text: But you will wail miserably for putting to death, without cause, the champions of virtue[a][b].
  footnotes:
  - marker: a
    text: Or 'the athletes of virtue' or 'the fighters for virtue'; the Greek term evokes contestants in a struggle and is used honorifically here.
    reason: lexical_alternative
  - marker: b
    text: Or 'unjustly' or 'without justification.' The Greek says literally 'without cause.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 너는 선한 이들의 챔피언을 무고하게 죽였으므로 비참하게 통곡하게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘덕의 운동선수들’ 또는 ‘덕을 위해 싸우는 이들’. 그리스어 용어는 투쟁의 참가자를 떠올리게 하며, 여기서는 존칭으로 쓰였습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘부당하게’ 또는 ‘정당한 이유 없이’. 그리스어는 문자적으로 ‘무고하게’라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  english_pob_choice: But you
  chosen_korean: 그러나 너는
  alternatives_korean:
  - 하지만 너는
  - 그런데 너는
  lexicon: LSJ
  rationale: 대조와 직접 호소를 살리기 위해 문두 역접을 분명히 두었고, 원문의 2인칭 강한 책망을 유지했습니다.
- source_word: κακῶς οἰμώξεις
  english_pob_choice: will wail miserably
  chosen_korean: 비참하게 통곡하게 될 것입니다
  alternatives_korean:
  - 몹시 통곡하게 될 것입니다
  - 비참히 울부짖게 될 것입니다
  lexicon: LSJ
  rationale: οἰμώζω의 강한 애도·통곡을 살리되, 합쇼체 문맥에 자연스러운 ‘통곡하다’로 옮기고 κακῶς는 비참함의 정서적 강도를 나타내도록 처리했습니다.
- source_word: τοὺς τῆς ἀρετῆς ἀγωνιστὰς
  english_pob_choice: the champions of virtue
  chosen_korean: 선한 이들의 챔피언
  alternatives_korean:
  - 덕의 투사들
  - 덕을 위한 투쟁자들
  - 덕의 운동선수들
  lexicon: LSJ
  rationale: ἀγωνιστής의 경쟁·투쟁 이미지를 살리면서, POB의 honorific한 해석을 따라 ‘챔피언’을 유지했습니다. ἀρετή는 여기서 윤리적 탁월성의 인물을 가리키므로 ‘선한 이들’로 풀어 자연스럽게 연결했습니다.
- source_word: ἀναίτιως ἀποκτεῖναι
  english_pob_choice: for putting to death, without cause
  chosen_korean: 무고하게 죽였으므로
  alternatives_korean:
  - 아무 까닭 없이 죽였으므로
  - 정당한 이유 없이 죽였으므로
  lexicon: LSJ
  rationale: ἀναίτιως는 ‘정당한 사유 없이/무고하게’의 의미 범위를 가지므로, 본문이 암시하는 부당함을 과잉 해석하지 않으면서도 한국어에서 자연스러운 ‘무고하게’로 옮겼습니다.
theological_decisions:
- issue: 호칭 대상에 대한 직접 책망의 어조
  chosen_reading: ‘너는’으로 직설적으로 책망하는 합쇼체를 유지했습니다.
  alternative_readings:
  - 간접화된 서술형
  - 완곡한 비난 표현
  rationale: 본문은 폭군에게 향한 예언적 선언이므로, 수위를 낮추지 않고 직접적 대조와 심판 선언의 압박감을 보존했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; prophetic denunciation register'
