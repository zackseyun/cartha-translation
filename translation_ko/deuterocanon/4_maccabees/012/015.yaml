  text: But you will wail miserably for putting to death, without cause, the champions of virtue[a][b].
  footnotes:
  - marker: a
    text: Or 'the athletes of virtue' or 'the fighters for virtue'; the Greek term evokes contestants in a struggle and is used honorifically here.
    reason: lexical_alternative
  - marker: b
    text: Or 'unjustly' or 'without justification.' The Greek says literally 'without cause.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 너는 덕의 투사들을[a] 아무런 까닭 없이[b] 죽였으므로 비참하게 통곡하게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘덕의 운동선수들’ 또는 ‘덕을 위해 싸운 이들’. 그리스어 용어는 경기나 투쟁의 참가자를 떠올리게 하며, 여기서는 명예로운 뜻으로 쓰였습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘부당하게’ 또는 ‘정당한 이유 없이’. 그리스어는 문자적으로 ‘아무런 까닭 없이’라는 뜻입니다.
    reason: lexical_alternative
