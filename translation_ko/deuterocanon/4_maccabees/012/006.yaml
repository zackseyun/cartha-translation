    rationale: ‘구출/구원’은 순응의 대상이 아니라 남은 아들이 순응할 경우 얻고자 하는 목적입니다. εὐπειθῆ는 남은 아들의 순응성을 서술합니다.
  - severity: medium
    issue: 본문의 ‘구원’은 한국어에서 영적 의미로 과도하게 읽힐 수 있습니다.
