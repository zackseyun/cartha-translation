  source_fidelity: 수정이 필요합니다. 초안의 ‘그가 그녀에게 많은 아들들을 빼앗긴 뒤에’는 στερηθεῖσαν의 수동 의미를 뒤바꾸어, 그가 그녀에게서 아들들을 빼앗았다는 뜻이 됩니다. 이는 ‘많은 아들을 잃은 그녀’를 수식해야 합니다. 또한 εὐπειθῆ ποιῆσαι는 남은 아들을 순응/복종하게 만든다는 뜻인데, ‘구원에 순응하게’는 순응의 대상과 구원의 목적을 혼동합니다.
  naturalness: ‘불러들이게 했습니다’도 가능하나, 사람을 보내어 불러오게 한 μετεπέμψατο에는 ‘불러오게 했습니다’가 더 자연스럽습니다. 목적절은 ‘남은 아들이 구출되도록 그를 순응하게 만들라고 그녀를 설득하려 했습니다’로 하면 현대 한국어 문법과 합쇼체 문체에 맞으면서 원문의 관계를 보존합니다.
  terminology: σωτηρία는 이 문맥에서 처형으로부터의 물리적 구출을 가리키므로 본문에서는 ‘구출’로 번역했습니다. 각주에서 ‘구원’이라는 가능한 직역을 밝혀 어휘 범위를 보존합니다. τὸν περιλειπόμενον은 문맥상 남은 아들이므로 ‘남은 아들’로 명시하는 것이 자연스럽고 정확합니다.
