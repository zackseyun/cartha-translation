  yaml_path: translation/deuterocanon/4_maccabees/012/006.yaml
  text: And while urging these things[a], he sent for the boy’s mother, so that, having pity on her after she had been deprived of so many sons, he might persuade her to make the one remaining compliant for his deliverance.
  footnotes:
  - marker: a
    text: Or 'for his salvation.' The Greek can use 'salvation' broadly, but here it most naturally refers to physical deliverance.
    reason: lexical_alternative
translation:
  language: ko
  text: 이런 것들을 권하면서, 그는 소년의 어머니를 불러오게 했습니다. 많은 아들을 잃은 그녀를 불쌍히 여겨, 남은 아들이 구출되도록[a] 그를 순응하게 만들라고 그녀를 설득하려 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘구원을 위하여’입니다. 그리스어 σωτηρία는 더 넓게 ‘구원’을 뜻할 수도 있으나, 여기서는 문맥상 처형에서 벗어나는 물리적 구출을 가장 자연스럽게 가리킵니다.
    reason: lexical_alternative
