  chosen_reading: 여기서는 즉각적 죽음에서의 물리적 구출을 가리키지만, 한국어 본문에서는 ‘구원’으로 넓게 남겨 두었습니다.
  alternative_readings:
  - 영적 구원
  - 단순한 생존
  - 구출
  rationale: 서술 상황은 처형을 피하게 하려는 정치적·신체적 맥락이므로 물리적 의미가 우선합니다. 다만 본문 자체가 후대 신학적 뉘앙스를 완전히 배제하지는 않으므로, 의미를 과도하게 좁히지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
