  text: And while urging these things[a], he sent for the boy’s mother, so that, having pity on her after she had been deprived of so many sons, he might persuade her to make the one remaining compliant for his deliverance.
  footnotes:
  - marker: a
    text: Or 'for his salvation.' The Greek can use 'salvation' broadly, but here it most naturally refers to physical deliverance.
    reason: lexical_alternative
translation:
  language: ko
  text: 이런 것들을 권하는 동안, 그는 소년의 어머니를 불러들이게 했습니다. 그렇게 하여, 그가 그녀에게 많은 아들들을 빼앗긴 뒤에 불쌍히 여겨, 남아 있는 하나를 구원에 순응하게 만들도록 설득하려 한 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 σωτηρία는 문맥상 영적 구원보다 즉각적인 육체적 구출을 가리키는 것이 가장 자연스럽습니다.
    reason: lexical_alternative
