base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/012/013.yaml
  text: Were you not ashamed[a], though you are a man, most beastly one, to cut out the tongues of those who share the same sufferings and have come from the same elements, and after mutilating him in this way[b], to torture him?
  footnotes:
  - marker: a
    text: Or 'those subject to the same passions' / 'your fellow sufferers'; the Greek ὁμοιοπαθεῖς can denote sharing the same experiences or conditions.
    reason: lexical_alternative
  - marker: b
    text: '''From the same elements'' reflects the Greek philosophical term στοιχεῖα, referring to the common material constitution of human beings.'
    reason: cultural_note
translation:
  language: ko
  text: 네가 사람이면서도, 가장 짐승 같은 자여, 같은 고통을 겪는 이들[a], 곧 같은 요소들[b]에서 생겨난 이들의 혀를 잘라 내고, 그를 이처럼 훼손한 뒤 고문하기를 부끄러워하지 않았습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ὁμοιοπαθεῖς는 이 문맥에서 ‘같은 고통을 겪는 이들’이라는 뜻이 가장 적절하지만, ‘같은 감정이나 정념을 지닌 이들’ 또는 ‘같은 처지의 동료들’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘요소들’은 στοιχεῖα의 철학적 표현을 살린 번역으로, 인간이 동일한 물질적 구성에서 생겨났다는 뜻을 반영합니다.
    reason: cultural_note
lexical_decisions:
- source_word: οὐκ ᾐδέσθης
  english_pob_choice: Were you not ashamed
  chosen_korean: 네가 … 고문할 생각이었느냐?
  alternatives_korean:
  - 부끄럽지도 않았느냐
  - 창피하지도 않았느냐
  lexicon: LSJ
  rationale: 여기서는 책망하는 수사 의문이므로, 한국어에서도 단순 감정 표현보다 죄책과 수치를 묻는 공격적 질문으로 살렸습니다.
- source_word: ἄνθρωπος ὢν
  english_pob_choice: though you are a man
  chosen_korean: 네가 사람이면서도
  alternatives_korean:
  - 네가 인간이면서도
  - 사람인데도
  lexicon: LSJ
  rationale: 짐승 같은 행위와의 대비를 분명히 하기 위해 ‘사람’의 인간성을 간결하게 드러냈습니다.
- source_word: θηριωδέστατε
  english_pob_choice: most beastly one
  chosen_korean: 가장 짐승 같은 자여
  alternatives_korean:
  - 가장 포악한 자여
  - 가장 야만적인 자여
  lexicon: LSJ
  rationale: θηρίον(짐승) 계열의 이미지를 유지해, 단순한 ‘사나움’보다 비인간적 잔혹성을 강조했습니다.
- source_word: τοὺς ὁμοιοπαθεῖς καὶ ἐκ τῶν αὐτῶν γεγονότας στοιχείων
  english_pob_choice: those who share the same sufferings and have come from the same elements
  chosen_korean: 같은 고통을 겪고 같은 요소들에서 생겨난 이들
  alternatives_korean:
  - 같은 감정을 지닌 이들
  - 같은 본성에서 나온 이들
  lexicon: LSJ
  rationale: ὁμοιοπαθεῖς는 이 문맥에서 ‘같은 고통/처지’를 가리키므로 ‘같은 고통을 겪는’으로, στοιχεῖα는 철학적 인류학적 표현을 살려 ‘요소들’로 옮겼습니다.
- source_word: γλωττοτομῆσαι
  english_pob_choice: to cut out the tongues
  chosen_korean: 혀를 잘라 내고
  alternatives_korean:
  - 혀를 도려내고
  - 혀를 잘라 내게 하고
  lexicon: LSJ
  rationale: 합성동사의 직접적 의미를 자연스러운 한국어로 옮겨, 폭력의 구체성을 분명히 했습니다.
- source_word: καὶ τοῦτον καταικίσας τὸν τρόπον
  english_pob_choice: and after mutilating him in this way
  chosen_korean: 또 그를 이런 식으로 훼손한 뒤에
  alternatives_korean:
  - 또 그를 이렇게 모욕한 뒤에
  - 또 그를 이런 방식으로 훼손하고
  lexicon: LSJ
  rationale: καταικίζω의 물리적 손상·훼손의 뜻을 살리되, 앞의 혀 절단과 자연스럽게 이어지도록 했습니다.
theological_decisions:
- issue: 인간성과 짐승성의 대비
  chosen_reading: ‘사람이면서도 … 가장 짐승 같은 자여’로 인간-짐승 대비를 노골적으로 유지했습니다.
  alternative_readings:
  - ‘네가 인간이면서도 … 가장 야만적인 자여’
  rationale: 이 구절의 수사는 인간에게 부여된 도덕적 책임과 그 반대편의 야만성을 대조하는 데 있습니다. 완곡하게 만들지 않는 것이 본문의 힘을 보존합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: στοιχεῖα의 의미 보존
  chosen_reading: ‘같은 요소들’로 직역 계열의 표현을 유지했습니다.
  alternative_readings:
  - ‘같은 재료로 이루어진’
  - ‘같은 물질적 구성에서 나온’
  rationale: 저자는 공통된 인간 구성에 대한 철학적 언어를 사용합니다. 본문이 가진 개념적 질감을 보존하기 위해 ‘요소들’을 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 5
