base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/012/004.yaml
  text: You see the outcome of your brothers’ madness[a]; for because of disobedience they have been tortured and have died. But you, if you do not obey, will yourself also die before your time[c][b], after being miserably tortured.
  footnotes:
  - marker: a
    text: Or 'the end' or 'the result' of your brothers' madness.
    reason: lexical_alternative
  - marker: b
    text: The Greek verb for 'have been tortured' can more specifically refer to being stretched on the rack.
    reason: cultural_note
  - marker: c
    text: Or 'if you are not persuaded'; here the sense is practical compliance, hence 'obey.'
    reason: lexical_alternative
translation:
  language: ko
  text: 형제들의 어리석음의 결과를 보십시오. 그들은 불순종 때문에 고문을 당해 죽었습니다. 그러나 당신은, 만일 설득되지 않으면, 당신도 제때가 되기 전에 비참하게 고문을 당한 뒤 죽을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘끝’, ‘결과’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 동사는 더 구체적으로는 형틀에 매어 늘이는 고문을 가리킬 수 있습니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘설득되지 않으면’입니다. 여기서는 실제로는 순응하라는 뜻이어서 ‘복종하다’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῆς μὲν τῶν ἀδελφῶν σου ἀπονοίας
  english_pob_choice: your brothers’ madness
  chosen_korean: 형제들의 어리석음
  alternatives_korean:
  - 형제들의 광기
  - 형제들의 무모함
  - 형제들의 어리석은 행위
  lexicon: LSJ
  rationale: ἀπονοία는 판단의 이탈과 무분별을 가리키므로, 비난의 뉘앙스를 살리면서도 한국어에서 과도하게 병리적으로 들릴 수 있는 ‘광기’보다 ‘어리석음’이 더 안정적으로 대응합니다.
- source_word: τὸ τέλος ὁρᾷς
  english_pob_choice: You see the outcome
  chosen_korean: 그 결과를 보십시오
  alternatives_korean:
  - 그 끝을 보십시오
  - 그 결말을 보십시오
  - 그 결과를 보게 됩니다
  lexicon: LSJ
  rationale: τὸ τέλος은 단순한 종결보다 ‘귀결/결과’의 뜻이 자연스럽기 때문에, 본문 맥락상 형제들에게 일어난 사태의 귀결을 가리키는 말로 옮겼습니다.
- source_word: διὰ γὰρ ἀπείθειαν
  english_pob_choice: because of disobedience
  chosen_korean: 불순종 때문에
  alternatives_korean:
  - 복종하지 않았기 때문에
  - 설득을 거부했기 때문에
  - 말을 듣지 않았기 때문에
  lexicon: BDAG
  rationale: ἀπείθεια는 단순한 의견 차이가 아니라 거절과 불복종을 뜻하므로, 원인 관계를 분명히 드러내는 ‘불순종’이 가장 직접적입니다.
- source_word: στρεβλωθέντες
  english_pob_choice: have been tortured
  chosen_korean: 고문을 당해
  alternatives_korean:
  - 채찍형을 받아
  - 형틀에 매여 고문을 당해
  - 벌을 받아
  lexicon: LSJ
  rationale: στρεβλόω는 넓게는 고문을 뜻하고, 경우에 따라 신체를 비틀어 매다는 가혹한 형벌을 가리킬 수 있으므로, 본문 의미를 넓게 살려 ‘고문을 당해’로 옮겼습니다.
- source_word: πεισθείης
  english_pob_choice: if you are not persuaded / obey
  chosen_korean: 설득되지 않으면
  alternatives_korean:
  - 복종하지 않으면
  - 말을 듣지 않으면
  - 설득을 받아들이지 않으면
  lexicon: BDAG
  rationale: 직역은 ‘설득되다’이지만, 협박성 문맥에서는 실제로 왕의 요구에 순응하는 뜻이므로, 본문의 이중 가능성을 살리면서도 한국어 문장 흐름에는 ‘설득되지 않으면’이 가장 가깝습니다.
theological_decisions:
- issue: 협박적 화자의 평가어를 어떻게 살릴 것인가
  chosen_reading: ἀπονοία를 ‘어리석음’으로 옮겨 화자의 멸시를 드러내되, 서술자가 이를 승인하는 것처럼 읽히지 않게 했습니다.
  alternative_readings:
  - 광기
  - 무모함
  - 분별없음
  rationale: 이 절은 폭군의 직접 발언이므로, 번역은 그 공격적 수사를 보존해야 합니다. 다만 한국어에서 ‘광기’는 과도하게 병리적일 수 있어, 평가성은 유지하되 자연스러운 ‘어리석음’을 택했습니다.
  doctrine_reference: 원문 수사의 보존과 화자-서술자 구분 유지
- issue: πρὸ ὥρας의 시간성 표현
  chosen_reading: ‘제때가 되기 전에’로 옮겨 죽음의 비조기성을 드러냈습니다.
  alternative_readings:
  - 일찍
  - 때 이르게
  - 예정보다 먼저
  rationale: 관용구는 단순한 ‘일찍’보다 ‘정해진 때 이전’의 뉘앙스를 담으므로, 운명적 조기 죽음이라는 효과를 유지하는 표현이 적절합니다.
  doctrine_reference: 시간성·운명성 표현의 등가성 유지
