translation:
  language: ko
  text: 그러나 저는 제 조상들의 하나님[a]께 간구합니다. 그분께서 제 민족[b]에게 자비를 베푸시기를 바랍니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘제 조상들의 하나님’은 ‘제 아버지들의 하나님’ 또는 ‘조상의 하나님’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘제 민족’은 문맥에 따라 ‘제 백성’, ‘제 친족’, 또는 더 문자적으로 ‘제 혈통/종족’을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλοῦμαι
  english_pob_choice: I call upon
  chosen_korean: 호소합니다
  alternatives_korean:
  - 부릅니다
  - 간청합니다
  - 부르짖습니다
  lexicon: BDAG
  rationale: 기도하듯 하나님께 간절히 요청하는 행위로서, 단순한 ‘부르다’보다 공적·간구적 뉘앙스를 살리면서도 과도하게 격식적인 표현을 피했습니다.
- source_word: πατρῷον θεόν
  english_pob_choice: the God of my fathers
  chosen_korean: 제 조상들의 하나님
  alternatives_korean:
  - 제 아버지들의 하나님
  - 제 선조들의 하나님
  - 조상의 하나님
  lexicon: LSJ
  rationale: πατρῷον은 혈연적 ‘아버지들’보다 조상 대대로 이어진 언약적 소속을 드러내므로, 현대 한국어에서는 ‘조상들의 하나님’이 가장 자연스럽고 본문의 역사적·공동체적 뉘앙스를 잘 보존합니다.
- source_word: τῷ γένει μου
  english_pob_choice: to my nation
  chosen_korean: 제 민족에게
  alternatives_korean:
  - 제 백성에게
  - 제 가족에게
  - 제 혈통에게
  lexicon: BDAG
  rationale: γένος은 가족보다 넓은 혈통·집단·민족을 가리킬 수 있으므로, 박해받는 유대 공동체 전체를 가리키는 문맥에 맞춰 ‘민족’으로 옮겼습니다.
- source_word: ἐλέως γένηται
  english_pob_choice: he may be merciful
  chosen_korean: 자비를 베푸시기를 바랍니다
  alternatives_korean:
  - 긍휼히 여기시기를 바랍니다
  - 은혜를 베푸시기를 바랍니다
  - 자비로우시기를 바랍니다
  lexicon: BDAG
  rationale: γένηται는 여기서 하나님의 성품이 ‘되다’라기보다 간구의 결과로 ‘자비를 베푸시다’라는 기능적 의미를 띠므로, 한국어 기도 문맥에 자연스러운 동사구로 표현했습니다.
theological_decisions:
- issue: πατρῷον θεόν의 신앙적 울림
  chosen_reading: ‘제 조상들의 하나님’으로 옮겨 언약적·역사적 소속감을 드러냈습니다.
  alternative_readings:
  - ‘조상들의 하나님’
  - ‘조상의 하나님’
  - ‘선조들의 하나님’
  rationale: 이 표현은 단순한 가족 호칭이 아니라 이스라엘의 하나님을 조상들의 신앙 전통과 연결하는 고백이므로, 한국어에서도 공동체적 기억과 신앙 계승의 의미를 살리는 쪽이 적절합니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: τῷ γένει μου의 범위
  chosen_reading: ‘제 민족’으로 번역해 개인 가족이 아니라 공동체 전체를 가리키게 했습니다.
  alternative_readings:
  - ‘제 백성’
  - ‘제 친족’
  - ‘제 혈통’
  rationale: 문맥상 저자는 박해받는 유대 ժողովրդի 운명을 자기 가족보다 넓은 집단에 대한 중보로 말하고 있으므로, 현대 독자가 오해 없이 읽을 수 있는 공동체적 표현이 필요합니다.
  doctrine_reference: Translation philosophy §1, §6
