translation:
  language: ko
  text: 그들은 그 소년의 약속에 특히 기뻐하며, 그를 재빨리 풀어 주었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιχαρέντες
  english_pob_choice: rejoicing
  chosen_korean: 기뻐하며
  alternatives_korean:
  - 즐거워하며
  - 환호하며
  lexicon: BDAG
  rationale: 부사구적으로 이어지는 분사이므로, 서술 흐름을 자연스럽게 살리면서도 원문의 ‘기뻐하다/즐거워하다’ 의미를 유지하는 표현으로 옮겼습니다.
- source_word: μάλιστα
  english_pob_choice: especially
  chosen_korean: 특히
  alternatives_korean:
  - 무엇보다
  - 가장
  lexicon: LSJ
  rationale: 기쁨의 정도를 강조하는 부사로, 현대 한국어에서 가장 자연스럽게 강조를 살리는 말은 ‘특히’입니다.
- source_word: τοῦ παιδός
  english_pob_choice: the young man's
  chosen_korean: 그 소년의
  alternatives_korean:
  - 그 청년의
  - 그 아이의
  - 그 젊은이의
  lexicon: BDAG
  rationale: παῖς는 문맥에 따라 ‘아이, 소년, 종, 젊은 사람’이 될 수 있는데, 여기서는 맥락상 마카베오 형제 중 한 사람을 가리키므로 ‘소년’이 POB의 ‘young man’에 가장 가까우면서도 과도하게 유아화하지 않습니다.
- source_word: ἔλυσαν
  english_pob_choice: untied
  chosen_korean: 풀어 주었습니다
  alternatives_korean:
  - 해방시켰습니다
  - 풀었습니다
  - 놓아 주었습니다
  lexicon: BDAG
  rationale: λύω는 문자적으로 ‘풀다, 묶은 것을 푸는’ 뜻이 있어, 고문 상황의 맥락에서는 단순히 ‘놓아 주었습니다’보다 ‘풀어 주었습니다’가 구속을 해제했다는 구체성을 더 잘 드러냅니다.
