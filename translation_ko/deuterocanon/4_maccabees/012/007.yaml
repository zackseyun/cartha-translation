  rationale: φωνή는 여기서 소리가 아니라 말/언어를 뜻하므로, 현대 한국어에서 가장 분명한 ‘히브리어로’로 옮겼습니다.
- source_word: ὡς ἐροῦμεν μετὰ μικρὸν ὕστερον
  english_pob_choice: as we will tell a little later
  chosen_korean: 우리는 조금 뒤에 말할 것입니다
