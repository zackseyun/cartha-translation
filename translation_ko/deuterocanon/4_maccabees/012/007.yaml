theological_decisions:
- issue: 서술자 주석으로서의 미래 발언
  chosen_reading: ‘우리는 조금 뒤에 말할 것입니다’로 옮겨, 본문이 현재 사건을 잠시 멈추고 뒤에서 설명을 예고하는 서술자 개입임을 드러냈습니다.
  alternative_readings:
  - ‘조금 뒤에 말하겠습니다’
  - ‘곧 이야기하겠습니다’
  rationale: 원문 ὡς ἐροῦμεν은 단순 시간부사가 아니라 서술자의 예고이므로, 1인칭 복수의 메타서술을 유지하는 것이 좋습니다.
  doctrine_reference: narrative discourse / authorial aside
