lexical_decisions:
- source_word: προτρεψαμένης
  english_pob_choice: had encouraged
  chosen_korean: 격려했을 때
  alternatives_korean:
  - 권면했을 때
  - 독려했을 때
  - 재촉했을 때
  lexicon: LSJ
  rationale: προτρέπω는 단순한 위로보다 적극적인 권면·격려의 뉘앙스를 가지므로, 자연스러운 현대 한국어로는 ‘격려하다’가 가장 무난합니다.
- source_word: τῇ Ἑβραΐδι φωνῇ
  english_pob_choice: in the Hebrew language
  chosen_korean: 히브리어로
  alternatives_korean:
  - 히브리 말로
  - 히브리 언어로
  - 히브리어의 말로
  lexicon: LSJ
  rationale: φωνή는 여기서 소리가 아니라 말/언어를 뜻하므로, 현대 한국어에서 가장 분명한 ‘히브리어로’로 옮겼습니다.
- source_word: ὡς ἐροῦμεν μετὰ μικρὸν ὕστερον
  english_pob_choice: as we will tell a little later
  chosen_korean: 우리는 조금 뒤에 말할 것입니다
  alternatives_korean:
  - 우리는 조금 뒤에 이야기할 것입니다
  - 우리가 곧 말할 것입니다
  - 곧 뒤에서 말할 것입니다
  lexicon: LSJ
  rationale: 미래형의 삽입적 서술자 발언을 살려, 뒤에서 이어질 설명을 예고하는 형태로 자연스럽게 옮겼습니다.
- source_word: δὲ
  english_pob_choice: and
  chosen_korean: 그리고
  alternatives_korean:
  - 그런데
  - 또
  - ''
  lexicon: LSJ
  rationale: 여기서 δέ는 강한 대조가 아니라 서술의 완만한 연결이므로 ‘그리고’가 가장 적절합니다.
theological_decisions:
- issue: 서술자 주석으로서의 미래 발언
  chosen_reading: ‘우리는 조금 뒤에 말할 것입니다’로 옮겨, 본문이 현재 사건을 잠시 멈추고 뒤에서 설명을 예고하는 서술자 개입임을 드러냈습니다.
  alternative_readings:
  - ‘조금 뒤에 말하겠습니다’
  - ‘곧 이야기하겠습니다’
  rationale: 원문 ὡς ἐροῦμεν은 단순 시간부사가 아니라 서술자의 예고이므로, 1인칭 복수의 메타서술을 유지하는 것이 좋습니다.
  doctrine_reference: narrative discourse / authorial aside
