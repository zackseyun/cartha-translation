review_pass:
  verdict: revise
  source_fidelity: 원문의 분사구문 προτρεψαμένης는 어머니가 그를 격려한 사실을 서술하며, ὡς ἐροῦμεν μετὰ μικρὸν ὕστερον은 그 사실을 뒤에서 다시 말하겠다는 저자의 삽입적 예고입니다. 현 번역의 ‘격려했을 때’는 시간절로 처리되어 ‘우리는 조금 뒤에 말할 것입니다’를 수식하는 것처럼 읽히므로 원문의 관계를 정확히 드러내지 못합니다.
  naturalness: ‘그의 어머니가 … 격려했는데, 이에 대해서는 … 말하겠습니다’는 현대 표준 한국어 합쇼체에서 자연스럽고, 어머니의 행동과 저자의 후행 설명 예고를 명료하게 구분합니다.
  terminology: ‘히브리어로’는 τῇ Ἑβραΐδι φωνῇ의 언어 의미를 정확하고 자연스럽게 전달합니다. ‘격려했는데’는 προτρέπω의 적극적 격려·권면의 폭을 무리 없이 보존합니다. 각주 대안인 ‘히브리 말로’도 적절합니다.
  issues:
  - severity: medium
    issue: ‘격려했을 때’가 ὡς ἐροῦμεν의 범위를 잘못 연결함
    rationale: 원문은 ‘어머니가 히브리어로 그를 격려한 것’을 저자가 ‘조금 뒤에 말하겠다’고 예고합니다. 한국어의 시간절 ‘…했을 때’는 ‘그때 우리가 말할 것이다’라는 시간적 관계를 만들기 쉬워 원문의 삽입적 서술자 주석을 흐립니다.
  revised_text: 그리고 그의 어머니가 히브리어로 그를 격려했는데, 이에 대해서는 우리가 조금 뒤에 말하겠습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘히브리 말로’. 여기서는 어머니가 그에게 말한 언어를 가리킵니다.
    reason: lexical_alternative
  revision_rationale: 시간절을 연결 어미 ‘-했는데’와 지시 표현 ‘이에 대해서는’으로 바꾸어, 어머니의 격려 사실에 대한 저자의 후행 설명 예고라는 원문의 구조를 보존했습니다. 원문의 완만한 접속사 δέ는 ‘그리고’로 유지했고, 언어 지시와 각주 앵커도 보존했습니다.
