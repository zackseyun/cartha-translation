lexical_decisions:
- source_word: κατευξάμενος
  english_pob_choice: after praying these things
  chosen_korean: 이런 것들을 기도한 뒤
  alternatives_korean:
  - 이것들을 기도한 뒤
  - 이런 것들을 기도하고 나서
  - 이런 기도를 드린 뒤
  lexicon: BDAG
  rationale: 아오리스트 분사로서 주동작보다 앞선 기도를 나타내므로, 시간 순서를 살려 ‘~한 뒤’로 옮겼습니다.
- source_word: ἑαυτὸν ἔρριψεν
  english_pob_choice: he threw himself
  chosen_korean: 자기 몸을 ... 던졌고
  alternatives_korean:
  - 자신을 던졌고
  - 몸을 내던졌고
  - 스스로를 던졌고
  lexicon: BDAG
  rationale: 반사대명사의 자기-투척 의미를 살리되, 한국어에서는 ‘자기 몸을 던지다’가 행위의 급박함과 의도를 자연스럽게 전달합니다.
- source_word: κατὰ τῶν τηγάνων
  english_pob_choice: onto the frying pans
  chosen_korean: 튀김용 팬들 위로
  alternatives_korean:
  - 튀김팬들 위에
  - 팬들 위로
  - 가열된 팬들 위로
  lexicon: LSJ
  rationale: κατά + 속격의 ‘~위로/향하여’라는 운동 방향을 반영했고, τηγάνων은 문맥상 가열된 팬/프라이팬 계열의 고문 도구를 가리키므로 직역보다 설명적 표현을 택했습니다.
- source_word: ἀπέδωκεν
  english_pob_choice: he died
  chosen_korean: 죽었습니다
  alternatives_korean:
  - 생명을 내주었습니다
  - 숨을 거두었습니다
  - 죽음을 맞았습니다
  lexicon: BDAG
  rationale: 문맥상 죽음을 뜻하는 관용적 용법이므로, 과도한 신학적 해석을 덧붙이지 않고 서술적으로 ‘죽었습니다’로 옮겼습니다.
theological_decisions:
- issue: ἀπέδωκεν의 관용적 의미를 생명/영의 ‘내어줌’으로 확장할지 여부
  chosen_reading: 서술상 결과를 드러내는 ‘죽었습니다’로 처리합니다.
  alternative_readings:
  - 생명을 내주었습니다
  - 그는 영을 내주었습니다
  - 그는 생명을 돌려주었습니다
  rationale: 본문은 명시적으로 ‘생명’이나 ‘영’을 말하지 않으므로, 마르티르 서술의 결과를 간결하게 전달하되 불필요한 신학적 구체화는 피했습니다.
  doctrine_reference: Translation philosophy §1, §6
