  source_fidelity: 주절의 시간 순서, 의도적인 자기 투신, 그리고 죽음이라는 결말은 대체로 정확합니다. 다만 κατευξάμενος ταῦτα는 한국어에서 ‘이런 것들을 기도한’이라고 하면 부자연스럽고, 앞선 발화 내용을 가리키는 ‘이러한 기도를 드린’이 더 충실하고 자연스럽습니다.
  naturalness: ‘튀김용 팬들’은 현대 한국어에서 조리 도구의 제품명처럼 들려 고문 장면의 서술에는 다소 부자연스럽습니다. ‘프라이팬들’이 통용되는 명칭이며, 원문에 없는 ‘가열된’을 보태지 않고도 문맥을 보존합니다.
  terminology: ἀπέδωκεν은 본문에서 목적어 없이 죽음을 뜻하는 완곡한 표현으로 쓰였습니다. 본문의 ‘죽었습니다’는 적절합니다. 각주는 ‘양도하였다’처럼 법률·소유권 이전을 연상시키는 표현 대신, 생명을 내놓거나 넘겨주는 뜻이라는 문맥적 설명을 제시하는 편이 낫습니다.
