  text: And as he too died blessedly, after being thrown into the cauldron, the seventh came forward, the youngest of all.
translation:
  language: ko
  text: 그도 가마솥에 던져진 뒤[b] 복되게 죽자[a], 그들 모두 가운데 가장 어린 일곱째가 나섰습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘복되게’는 μακαρίως의 평가적 뉘앙스를 살린 번역입니다.
    reason: korean_style_note
  - marker: b
    text: ‘가마솥’은 λέβης가 가리키는 큰 금속 용기를 옮긴 말입니다.
    reason: source_note
lexical_decisions:
- source_word: μακαρίως
  english_pob_choice: blessedly
  chosen_korean: 축복받은 죽음을 맞이하고
  alternatives_korean:
  - 복되게
  - 축복된 방식으로
  lexicon: LSJ
  rationale: 마카리오스의 형용사적 어감과는 달리 여기서는 부사로서 죽음의 성격을 평가하므로, 순서를 살린 ‘죽음을 맞이하고’와 결합해 순교적 긍정 평가를 드러냈습니다.
- source_word: ἐναπέθανεν
  english_pob_choice: died
  chosen_korean: 죽음을 맞이하고
  alternatives_korean:
  - 죽었습니다
  - 죽었고
  lexicon: LSJ
  rationale: 복합동사의 핵심은 그 처지 안에서 죽었다는 사실이며, 한국어에서는 직역적 반복보다 자연스러운 관용 표현이 문맥의 흐름을 잘 살립니다.
- source_word: καταβληθείς εἰς λέβητα
  english_pob_choice: after being thrown into the cauldron
  chosen_korean: 가마솥에 던져졌으며
  alternatives_korean:
  - 가마솥에 던져진 뒤
  - 솥에 내던져졌으며
  lexicon: LSJ
  rationale: 수동 분사와 폭력성을 함께 살리기 위해 ‘던져졌으며’로 옮겼고, λέβης는 고문 장면에 맞는 구체적 용어인 ‘가마솥’으로 옮겼습니다.
- source_word: ὁ ἕβδομος
  english_pob_choice: the seventh
  chosen_korean: 일곱째가
  alternatives_korean:
  - 일곱 번째가
  - 일곱째 형제가
  lexicon: LSJ
  rationale: 문맥상 형제들 가운데 한 사람을 가리키므로 한국어에서는 순서를 나타내는 자연스러운 ‘일곱째’가 가장 간결합니다.
- source_word: ὁ πάντων νεώτερος
  english_pob_choice: the youngest of all
  chosen_korean: 모두 가운데 가장 어린 사람이었습니다
  alternatives_korean:
  - 모두 중 가장 어린 사람이었습니다
  - 가장 어린 이였습니다
  lexicon: LSJ
  rationale: 비교급 최상 의미를 분명히 하면서도, 한국어에서는 집단 내 최연소자를 드러내는 ‘모두 가운데 가장 어린 사람’이 가장 투명합니다.
theological_decisions:
- issue: μακαρίως의 순교 평가를 어떻게 드러낼지
  chosen_reading: ‘축복받은 죽음’으로 순교의 긍정적 평가를 유지했습니다.
  alternative_readings:
  - 단순히 ‘죽었습니다’로 중립화
  - ‘행복하게’로 감정 상태처럼 처리
  rationale: 본문은 단순한 정서 묘사가 아니라 고난 속 죽음을 가치 판단적으로 평가하므로, 축복/복됨의 뉘앙스를 보존해야 합니다.
  doctrine_reference: martyrdom testimony in 4 Maccabees
- issue: λέβητα의 구체성 유지
  chosen_reading: 고문 도구의 물성을 살려 ‘가마솥’으로 옮겼습니다.
  alternative_readings:
  - 솥
  - 냄비
  rationale: 장면의 폭력성과 고문 맥락을 약화시키지 않기 위해, 일반 조리기구보다 더 거칠고 큰 용기를 가리키는 표현을 택했습니다.
  doctrine_reference: narrative violence and persecution context
