  to: 그도 가마솥에 던져진 뒤[b] 복되게 죽자[a], 그들 모두 가운데 가장 어린 일곱째가 나섰습니다.
  rationale: 가마솥에 던져진 일이 죽음보다 앞선다는 원문의 문법적 관계를 ‘던져진 뒤’로 바로잡았습니다. μακαρίως는 부사적으로 유지하고, παρεγίνετο는 다음 순교자가 앞으로 나오는 장면에 맞춰 ‘나섰습니다’로 옮겼습니다. ‘그들 모두 가운데’는 πάντων의 범위를 문맥상 앞선 형제들로 자연스럽게 드러냅니다.
