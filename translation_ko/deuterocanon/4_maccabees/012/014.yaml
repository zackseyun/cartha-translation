lexical_decisions:
- source_word: ἀλλ᾽
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  lexicon: BDAG
  rationale: 앞선 문맥과의 대조를 자연스럽게 살리되, 문어체 합쇼체에서 전환을 분명히 드러내는 연결어로 옮겼습니다.
- source_word: εὐγενῶς
  english_pob_choice: nobly
  chosen_korean: 고귀하게
  alternatives_korean:
  - 고상하게
  - 품위 있게
  lexicon: BDAG
  rationale: 순교적 죽음의 도덕적·품격적 평가를 담는 부사이므로, 단순한 외적 예절보다 내적 품위를 드러내는 '고귀하게'가 적절합니다.
- source_word: ἐπλήρωσαν
  english_pob_choice: fulfilled
  chosen_korean: 완성했습니다
  alternatives_korean:
  - 이루었습니다
  - 채웠습니다
  lexicon: BDAG
  rationale: 문자적 '채우다'보다, 그들의 죽음이 경건을 끝까지 드러내고 완결시켰다는 의미를 살려 '완성했습니다'로 옮겼습니다.
- source_word: τὴν ... εὐσέβειαν
  english_pob_choice: their godliness
  chosen_korean: 그들의 경건
  alternatives_korean:
  - 그들의 신심
  - 그들의 경외
  lexicon: BDAG
  rationale: 유대-헬라 문맥의 εὐσέβεια는 하나님께 대한 경건한 태도와 실천을 함께 가리키므로, 한국어 성서어법에서 통용되면서도 전통적 위계를 과도하게 강요하지 않는 '경건'을 선택했습니다.
theological_decisions:
- issue: εὐσέβεια의 한국어 신학적 중립성 유지
  chosen_reading: 경건
  alternative_readings:
  - 신심
  - 경외
  rationale: 이 절은 순교자의 죽음을 통해 하나님께 대한 경건이 충만하게 드러났음을 말하므로, '경건'이 내적 신앙과 외적 충성을 함께 담아 가장 균형 있게 반영합니다.
  doctrine_reference: DOCTRINE.md §Consistency of key terms; §Translation philosophy
