  source_fidelity: 핵심 의미는 대체로 정확합니다. 그러나 ἐπλήρωσαν은 하나님께 대한 εὐσέβεια를 충만히 이루거나 다했다는 뜻이며, 한국어에서 ‘경건을 완성했습니다’는 다소 부자연스럽고 추상 명사를 인위적으로 완결하는 듯 들립니다.
  naturalness: ‘하나님을 향한 그들의 경건을 완성했습니다’보다 ‘하나님께 대한 경건을 다했습니다’가 현대 표준 한국어의 문어체 합쇼체에서 더 자연스럽고 간결합니다. ‘고귀하게 죽은’은 εὐγενῶς의 도덕적 평가를 무리 없이 반영합니다.
  terminology: εὐσέβεια를 ‘경건’으로 옮긴 것은 하나님께 향한 신앙적 헌신과 실천이라는 문맥에 적절합니다. ‘신심’은 가능한 어휘 대안입니다. εἰς τὸν θεόν은 ‘하나님께 대한’으로 자연스럽게 드러냈습니다.
  issues:
