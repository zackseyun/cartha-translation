  yaml_path: translation/deuterocanon/1_esdras/004/070.yaml
  text: And he wrote letters to all the local rulers in Coele-Syria and Phoenicia and to those in Lebanon[a], to bring cedar timber from Lebanon to Jerusalem, so that they might build the city with him.
  footnotes:
  - marker: a
    text: Or 'district governors'; Greek 'toparchs,' rulers over local districts.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 코엘레 시리아와 페니키아의 모든 지방 통치자들과, 그리고 레바논에 있는 이들에게 편지를 보내어, 레바논에서 예루살렘으로 백향목 재목을 가져오게 하고, 또 그와 함께 그 성을 건축하게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지방 구역의 통치자들’; 그리스어 τοπάρχαι는 지역 구역을 다스리는 자들을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοπάρχαις
  english_pob_choice: local rulers
  chosen_korean: 지방 통치자들
  alternatives_korean:
  - 지방 관리들
  - 지역 통치자들
  - 토파르크들
  lexicon: LSJ
  rationale: τοπάρχης는 특정 지역이나 구역을 다스리는 통치자를 가리키므로, 행정적 의미를 살리면서도 현대 한국어에서 자연스러운 ‘지방 통치자들’로 옮겼습니다.
- source_word: ἐν κοίλῃ Συρίᾳ
  english_pob_choice: in Coele-Syria
  chosen_korean: 코엘레 시리아
  alternatives_korean:
  - 홀로우 시리아
  - 시리아
  lexicon: LSJ
  rationale: 헬레니즘 시대의 고유 지명으로 보아 음역을 유지했습니다. 일반적인 ‘시리아’로 풀면 역사적 지명이 약화됩니다.
- source_word: ἔγραψεν ἐπιστολάς
  english_pob_choice: he wrote letters
  chosen_korean: 편지를 보내어
  alternatives_korean:
  - 편지를 썼습니다
  - 서한을 보냈습니다
  lexicon: LSJ
  rationale: 직역하면 ‘썼습니다’이지만, 문맥상 왕의 공식 통신문 발송을 뜻하므로 한국어에서는 ‘편지를 보내어’가 자연스럽고 기능적으로도 가깝습니다.
- source_word: ξύλα κέδρινα
  english_pob_choice: cedar timber
  chosen_korean: 백향목 재목
  alternatives_korean:
  - 백향목 목재
  - 백향목 나무
  - 백향목 통나무
  lexicon: LSJ
  rationale: 건축 자재로서의 목재라는 점을 살리기 위해 ‘재목’을 택했습니다. 성전/건축 맥락에서 단순한 ‘나무’보다 구체적입니다.
theological_decisions:
- issue: τὴν πόλιν의 대상
  chosen_reading: ‘그 성’을 구체적 건축 대상으로 유지하고, 이를 성전으로 바꾸지 않았습니다.
  alternative_readings:
  - 성전
  - 예루살렘 성읍
  rationale: 본문은 분명히 τὴν πόλιν(‘그 성’)이라고 하므로, 건축 대상을 성전으로 조정하지 않고 도시 자체를 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3
