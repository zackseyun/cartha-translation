- from: 그는 코엘레 시리아와 페니키아의 모든 지방 통치자들과, 그리고 레바논에 있는 이들에게 편지를 보내어, 레바논에서 예루살렘으로 백향목 재목을 가져오게 하고, 또 그와 함께 그 성을 건축하게 하였습니다.[a]
  to: 그는 코엘레시리아와 페니키아의 모든 지방 통치자들[a]과 레바논에 있는 이들에게 편지를 써서, 레바논에서 예루살렘으로 백향목 재목을 가져오고 그와 함께 그 성읍을 건축하도록 하였습니다.
  rationale: ‘편지를 보내어’를 원문의 명시적 동사에 맞게 ‘편지를 써서’로 고쳤습니다. 이어지는 부정사와 목적절은 편지로 내린 지시의 내용을 나타내도록 ‘가져오고 … 건축하도록 하였습니다’로 옮겼습니다. 역사적 지명은 ‘코엘레시리아’로 유지하고, 도시를 뜻하는 πόλις는 성전으로 한정하지 않고 ‘그 성읍’으로 번역했습니다.
