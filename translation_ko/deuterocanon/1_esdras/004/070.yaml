  source_fidelity: 그리스어 ἔγραψεν ἐπιστολάς는 ‘편지들을 썼습니다’이므로, 초안의 ‘편지를 보내어’는 문맥상 가능한 함의가 있어도 명시된 동작을 ‘보내다’로 바꿉니다. 또한 편지의 내용/목적을 나타내는 μεταφέρειν 및 ὅπως 절은 한국어에서 ‘가져오고 … 건축하도록’으로 자연스럽게 재현할 수 있습니다.
  naturalness: ‘코엘레시리아’는 역사적 지명으로 자연스럽게 음역할 수 있으며, ‘그 성읍’은 여기서 예루살렘 도시를 가리키는 πόλις를 현대 한국어에서 분명하게 전달합니다. 각주 표지는 해당 어휘 바로 뒤에 두는 편이 독자에게 명확합니다.
  terminology: τοπάρχαις는 ‘지방 통치자들’로 적절히 옮겼습니다. ξύλα κέδρινα는 건축용 목재라는 의미를 담은 ‘백향목 재목’이 적절합니다. τὴν πόλιν을 ‘성전’으로 조화시키지 않고 ‘그 성읍’으로 유지합니다.
