  text: And when the king awoke[a], they took the letter and gave it to him[b], and he read it.
  footnotes:
  - marker: a
    text: Or 'the writing' or 'the document' for the Greek γράμμα.
    reason: lexical_alternative
  - marker: b
    text: The Greek verb can mean simply 'read' or, in some contexts, 'read aloud'; the text itself does not specify aloudness here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 왕이 깨어났을 때, 그들이 그 문서를 가져다가 그에게 주었고, 그는 그것을 읽었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: γράμμα는 여기서 ‘편지’보다 더 넓게 ‘문서/서면’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ἀνέγνω는 문맥에 따라 ‘소리 내어 읽다’의 뜻이 될 수 있지만, 이 구절은 그 여부를 분명히 말하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἐξηγέρθη
  english_pob_choice: when the king awoke
  chosen_korean: 왕이 깨어났을 때
  alternatives_korean:
  - 왕이 일어났을 때
  - 왕이 깨어났을 무렵
  lexicon: LSJ
  rationale: ἐξηγέρθη는 여기서 ‘깨어나다/잠에서 깨다’의 자연스러운 사건 진행으로 이해하는 것이 문맥에 가장 잘 맞습니다. '일어나다'도 가능하지만, 영어 POB의 선택과 같은 이유로 수면에서 깸을 드러내는 표현이 더 직접적입니다.
- source_word: τὸ γράμμα
  english_pob_choice: the letter
  chosen_korean: 그 문서
  alternatives_korean:
  - 그 편지
  - 그 글
  lexicon: LSJ
  rationale: γράμμα는 이 궁정 맥락에서 단순한 편지보다 왕에게 제출된 서면 문건을 가리키므로, 한국어에서는 ‘문서’가 더 정확합니다. 영어 POB의 'letter'는 관용적이지만, 원문 의미를 살리기 위해 문서로 옮겼습니다.
- source_word: ἔδωκαν αὐτῷ
  english_pob_choice: gave it to him
  chosen_korean: 그에게 주었고
  alternatives_korean:
  - 그에게 건네주었고
  - 그에게 넘겨주었고
  lexicon: LSJ
  rationale: 단순한 aorist 동사를 따라 자연스러운 서술형으로 옮겼습니다. '건네주다'는 손동작을 더 구체화하므로 원문이 말하지 않는 뉘앙스를 덧붙일 수 있습니다.
- source_word: ἀνέγνω
  english_pob_choice: he read it
  chosen_korean: 그는 그것을 읽었습니다
  alternatives_korean:
  - 그는 읽었습니다
  - 그는 그것을 소리 내어 읽었습니다
  lexicon: LSJ
  rationale: ἀνέγνω는 ‘읽다’ 또는 문맥에 따라 ‘소리 내어 읽다’를 뜻하지만, 원문 자체가 낭독 여부를 밝히지 않으므로 단순히 ‘읽었습니다’로 두었습니다. 한국어에서는 목적어를 보충해 문장 흐름을 분명히 했습니다.
