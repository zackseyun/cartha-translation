revisions:
- from: 그리고 그는 고레스가 바빌론에서 따로 떼어 놓은 모든 기물과, 고레스가 하라고 말한 모든 것을 자신도 직접 명령하여 예루살렘으로 보내게 하였습니다.[a]
  to: 그리고 그는 고레스가 바빌론에서 따로 떼어 둔 모든 기물을 되돌려 보냈습니다.[a] 또 고레스가 하라고 말한 모든 일을 그 자신도 행하고 예루살렘으로 보내라고 명령하였습니다.
  rationale: 원문의 두 절을 분리하여, 기물의 실제 반환(ἐξαπέστειλεν)과 왕이 내린 행정 명령(ἐπέταξεν)을 모두 보존했습니다. ‘그 자신도’로 αὐτός의 강조와 καί의 첨가 의미를 살렸으며, ‘행하고 예루살렘으로 보내라고’로 두 부정사 ποιῆσαι와 ἐξαποστεῖλαι를 병렬로 반영했습니다.
