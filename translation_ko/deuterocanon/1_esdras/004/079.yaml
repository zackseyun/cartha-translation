  source_fidelity: 수정이 필요합니다. 초안은 첫 동사 ἐξαπέστειλεν(그가 모든 기물을 보냈다)과 뒤의 ἐπέταξεν ... ἐξαποστεῖλαι(그가 행하고 예루살렘으로 보내라고 명령했다)를 한 문장으로 합쳐, 실제로 보낸 행위와 명령 행위를 혼동합니다. 또한 ἐξαπέστειλεν의 문맥상 귀환 방향은 ‘되돌려 보냈습니다’로 드러내는 것이 적절합니다.
  naturalness: ‘기물’과 공적 명령의 표현은 현대 표준 한국어 합쇼체에 맞습니다. 두 절을 분리하면 병렬 구조와 행위 주체가 명확해지고 자연스럽습니다.
  terminology: σκεύη는 본문 문맥에서 ‘기물’로 유지할 수 있습니다. χωρίζω는 ‘따로 떼어 둔’으로 번역하되, 이것이 단순한 물리적 분리인지 선별·지정인지 단정하지 않도록 대안 번역을 각주에 제시합니다. αὐτός의 강조와 καί의 첨가 의미는 ‘그 자신도’로 반영합니다.
