  text: And he sent back all the vessels that Cyrus had set apart from Babylon; and everything that Cyrus had said should be done[a], he himself also ordered to be done and to be sent to Jerusalem.
  footnotes:
  - marker: a
    text: Or 'had separated from Babylon.' The Greek verb can denote separating, setting apart, or removing; here it refers to the temple vessels singled out for return.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 고레스가 바빌론에서 따로 떼어 놓은 모든 기물과, 고레스가 하라고 말한 모든 것을 자신도 직접 명령하여 예루살렘으로 보내게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘따로 떼어 놓은’은 그리스어 χωρίζω의 가능 의미인 ‘분리하다, 구별하다, 떼어 놓다’를 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαπέστειλεν
  english_pob_choice: sent back
  chosen_korean: 보내게 하였습니다
  alternatives_korean:
  - 되돌려 보냈습니다
  - 보냈습니다
  - 송환하였습니다
  lexicon: BDAG
  rationale: 문맥상 예루살렘 성전 기물이 바빌론에서 돌아오는 상황이므로, 단순한 ‘보내다’보다 ‘보내게 하였습니다’가 귀환의 방향을 살리면서도 자연스럽습니다.
- source_word: τὰ σκεύη
  english_pob_choice: the vessels
  chosen_korean: 모든 기물
  alternatives_korean:
  - 모든 그릇
  - 모든 성전 기물
  - 모든 기구
  lexicon: BDAG
  rationale: σκεύη는 성전 맥락에서 기물·기구를 가리키므로, 한국어에서는 지나치게 협소한 ‘그릇’보다 ‘기물’이 더 정확하고 포괄적입니다.
- source_word: ἃ ἐχώρισεν
  english_pob_choice: had set apart
  chosen_korean: 따로 떼어 놓은
  alternatives_korean:
  - 따로 구별한
  - 분리해 놓은
  - 따로 떼어 둔
  lexicon: BDAG
  rationale: χωρίζω는 여기서 바빌론 가운데서 선별하여 따로 떼어 둔 뉘앙스를 가지므로, ‘따로 떼어 놓은’이 행정적 선별과 반환의 맥락을 잘 드러냅니다.
- source_word: ἐπέταξεν
  english_pob_choice: ordered
  chosen_korean: 직접 명령하여
  alternatives_korean:
  - 명령하여
  - 지시하여
  - 분부하여
  lexicon: BDAG
  rationale: 왕의 공적 지시를 나타내므로 ‘명령하여’가 적절하며, αὐτός의 강조를 살리기 위해 ‘직접’은 ‘자신도’와 짝지어 반영했습니다.
theological_decisions:
- issue: 왕의 반복적 명령과 실행의 강조
  chosen_reading: 고레스의 말과 왕 자신이 내린 명령이 실제 집행으로 이어졌다는 행정적 강조를 살려 번역했습니다.
  alternative_readings:
  - 단순히 ‘고레스가 말한 대로’로 평면화하는 번역
  - ‘명령했다’만 두어 반복성을 약화시키는 번역
  rationale: 본문은 ‘고레스가 말한 것’과 ‘그 자신도 명령한 것’을 나란히 놓아, 반환이 우연이 아니라 공식적·의도적으로 집행되었음을 강조합니다. 이를 한국어에서도 유지해야 합니다.
  doctrine_reference: 본문의 서술 강조와 왕권 행정의 실재성
