  text: and you vowed to rebuild the temple which the Judeans burned when Judea was laid waste by the Chaldeans[a].
  footnotes:
  - marker: a
    text: 'Greek: ''which the Judeans burned.'' Some readers may expect ''which the Chaldeans/Babylonians burned'' from parallel historical traditions, but the present Greek text explicitly reads ''the Judeans.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 당신께서는 갈대아인들이 유대아를 황폐하게 했을 때 유대인들이 불태운 그 성전을 다시 세우겠다고 서원하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존 그리스어 본문은 성전을 “유대인들이 불태웠다”라고 말합니다. 다른 평행 전승에 비추어 갈대아인들 또는 바빌로니아인들이 불태웠을 것이라고 예상할 수 있으나, 이 본문은 유대인들을 주어로 명시합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: εὔξω
  english_pob_choice: you vowed
  chosen_korean: 서원하셨습니다
  alternatives_korean:
  - 약속하셨습니다
  - 맹세하셨습니다
  - 기도하셨습니다
  lexicon: LSJ
  rationale: εὔχομαι의 서원/서약 의미를 살려, 단순한 약속보다 더 엄숙한 결단을 드러내는 ‘서원하셨습니다’를 택했습니다.
- source_word: οἰκοδομῆσαι
  english_pob_choice: to rebuild
  chosen_korean: 다시 짓겠다고
  alternatives_korean:
  - 짓겠다고
  - 재건하겠다고
  lexicon: LSJ
  rationale: 이미 불탄 성전의 복구라는 문맥을 반영해 ‘다시 짓다’로 옮겨, 단순 신축이 아니라 회복의 뜻을 분명히 했습니다.
- source_word: ναὸν
  english_pob_choice: temple
  chosen_korean: 성전
  alternatives_korean:
  - 성소
  - 전
  lexicon: LSJ
  rationale: 예루살렘 성전이라는 역사적 대상을 가리키므로 한국어 성경에서 널리 쓰이는 ‘성전’이 가장 자연스럽습니다.
- source_word: οἱ Ἰουδαῖοι
  english_pob_choice: the Judeans
  chosen_korean: 유대인들이
  alternatives_korean:
  - 유대 사람들이
  - 유대아 사람들이
  lexicon: LSJ
  rationale: 여기서는 지리·민족적 집단을 가리키는 표현이므로 ‘유대인들’로 옮기되, 주석 없이 본문 의미가 드러나도록 했습니다.
theological_decisions:
- issue: ‘유대인들이 불태웠다’는 역사적 긴장 보존
  chosen_reading: 본문의 그리스어 주어를 따라 성전의 소각 주체를 ‘유대인들’로 유지했습니다.
  alternative_readings:
  - 갈대아인들이 불태웠다고 뜻을 풀어 쓰는 해석
  - 불태웠다는 주어를 지우고 수동형으로 완화하는 번역
  rationale: 병행 전승과의 긴장이 있더라도 원문이 말하는 주어를 본문에서 숨기지 않는 것이 source-first 원칙에 더 부합합니다.
  doctrine_reference: 원문 우선, 역사적 긴장 보존
- issue: ‘유대아가 … 황폐해졌을 때’의 상황 묘사
  chosen_reading: ἡ Ἰουδαία ἐρημώθη를 ‘유대아가 … 황폐해졌을 때’로 옮겼습니다.
  alternative_readings:
  - 유대아가 황폐하게 되었을 때
  - 유대아가 황무지가 되었을 때
  rationale: 단순한 상태 진술보다 사건의 결과와 파괴성을 함께 드러내는 표현이 문맥에 더 적절합니다.
  doctrine_reference: 역사 서술의 결과 상태 강조
