  chosen_korean: 축하하였습니다
  alternatives_korean:
  - 즐겁게 지냈습니다
  - 잔치를 벌였습니다
  - 기뻐하며 축제하였습니다
  lexicon: LSJ
  rationale: 희귀 동사의 축제적 의미를 한국어에서 가장 무리 없이 드러내는 표현으로, 지나치게 구어적이거나 부정적 뉘앙스가 없는 ‘축하하다’를 택했습니다.
theological_decisions:
- issue: 성전과 하나님의 이름의 관계
  chosen_reading: ‘그 위에 그의 이름이 불린’으로 옮겨, 성전이 하나님의 이름과 연관된 언약적 귀속의 장소임을 드러냈습니다.
  alternative_readings:
  - ‘그의 이름이 거기에 불린’
  - ‘그의 이름을 지닌’
  rationale: 본문은 하나님의 임재를 단정적으로 설명하기보다, 성전이 하나님의 이름과 연결된다는 성경적 공식 자체를 유지합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
