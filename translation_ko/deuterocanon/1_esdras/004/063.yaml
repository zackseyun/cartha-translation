  rationale: 성전과 예루살렘의 복구 맥락이지만, 한국어에서는 ‘건축하다’가 본동사로 자연스러워 과도한 해설 없이 의미를 전달합니다.
- source_word: οὗ ὠνομάσθη τὸ ὄνομα αὐτοῦ ἐπʼ αὐτῷ
  english_pob_choice: on which his name had been called
  chosen_korean: 그 위에 그의 이름이 불린
  alternatives_korean:
  - 그 이름이 지어진
  - 그의 이름이 새겨진
  lexicon: LSJ
  rationale: 성경적 명명 공식의 수동형을 살려, 그 대상이 하나님의 이름과 관련된 소유·귀속을 받는다는 뜻을 직접적으로 옮겼습니다.
- source_word: ἐκωθωνίζοντο
