  - marker: b
    text: The rare verb here can also be understood as 'they made festal celebration' or 'they rejoiced in celebration.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예루살렘과 그 위에 그의 이름이 불린 성전을 다시 올라가 건축하고, 그들은 음악과 기쁨으로 칠 일 동안 축하하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 자연스럽게는 ‘그의 이름을 지닌 성전’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 희귀 동사는 ‘축제를 벌였다’ 또는 ‘축제의 기쁨을 누렸다’는 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβῆναι
  english_pob_choice: to go up
  chosen_korean: 다시 올라가
  alternatives_korean:
