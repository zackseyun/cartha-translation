  - 예루살렘으로 올라가
  lexicon: LSJ
  rationale: 예루살렘으로 향하는 성경적 ‘올라가다’ 관용을 살리되, 문맥상 복귀의 뉘앙스를 담기 위해 ‘다시’를 보탰습니다.
- source_word: οἰκοδομῆσαι
