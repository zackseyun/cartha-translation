  text: to go up and rebuild Jerusalem and the temple on which his name was called[b][a]; and they celebrated with music and joy for seven days.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'the temple that bears his name.'
    reason: lexical_alternative
  - marker: b
    text: The rare verb here can also be understood as 'they made festal celebration' or 'they rejoiced in celebration.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예루살렘으로 올라가 예루살렘과 그 위에 그의 이름이 불린 성전[a]을 재건하고, 그들은 음악과 기쁨으로 칠 일 동안 축제를 벌였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 자연스럽게는 ‘그의 이름을 지닌 성전’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 희귀 동사는 ‘축하하였다’, ‘축제의 기쁨을 누렸다’로도 이해할 수 있습니다.
    reason: lexical_alternative
