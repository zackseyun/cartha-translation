base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/036.yaml
  text: All the earth calls truth blessed[a], and heaven blesses her; and all works shake and tremble[b], and with her there is nothing unjust.
  footnotes:
  - marker: a
    text: Greek has a masculine/neuter form ('with him/it') here after feminine references to 'truth'; the sense is most naturally still 'with truth,' and the English preserves the surrounding personification.
    reason: textual_variant
  - marker: b
    text: Or 'all created works' for 'all the works.'
    reason: lexical_alternative
translation:
  language: ko
  text: 온 땅이 진리를 찬양하고, 하늘이 진리를 복되다 하며, 모든 일들이 흔들리고 떨며, 그와 함께는 불의한 것이 하나도 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 앞의 진리에 대해 성이 맞지 않는 형태를 전합니다. 본문은 문맥의 의인화를 살렸습니다.
    reason: source_note
  - marker: b
    text: ‘모든 일들’은 문자적으로는 ‘모든 일/작업’이지만, 여기서는 우주적 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ἡ γῆ
  english_pob_choice: All the earth
  chosen_korean: 온 땅
  alternatives_korean:
  - 온 세상
  - 모든 땅
  lexicon: LSJ
  rationale: γῆ는 여기에서 하늘과 짝을 이루는 우주적 범위로 쓰이므로, 한국어도 단순한 ‘땅’보다 범위를 드러내는 ‘온 땅’이 자연스럽습니다.
- source_word: τὴν ἀλήθειαν
  english_pob_choice: truth
  chosen_korean: 진리
  alternatives_korean:
  - 진실
  - 참됨
  lexicon: LSJ
  rationale: 추상명사 ἀλήθεια는 여기에서 칭송의 대상이므로, 교회어휘와도 맞는 ‘진리’가 가장 सीधे합니다.
- source_word: καλεῖ
  english_pob_choice: calls truth blessed
  chosen_korean: 찬양하고
  alternatives_korean:
  - 복되다 하고
  - 부른다고 하고
  - 칭송하고
  lexicon: LSJ
  rationale: POB의 영어는 καλέω를 ‘truth blessed’라는 관용적 평가로 풀었지만, 한국어에서는 같은 의미역을 자연스럽게 살리기 위해 ‘찬양하다’로 옮겼습니다. 단순한 ‘부르다’보다 이 문맥의 존숭 표현을 더 잘 드러냅니다.
- source_word: ὁ οὐρανὸς
  english_pob_choice: heaven
  chosen_korean: 하늘
  alternatives_korean:
  - 천국
  - 하늘나라
  lexicon: LSJ
  rationale: 여기서는 신학적 용어라기보다 우주적 병렬구조이므로, ‘하늘’이 가장 직접적입니다.
- source_word: εὐλογεῖ
  english_pob_choice: blesses
  chosen_korean: 복되다 하며
  alternatives_korean:
  - 축복하며
  - 복을 빌며
  - 찬미하며
  lexicon: LSJ
  rationale: εὐλογέω의 기본 뜻을 살리되, 한국어에서 대상을 ‘복되다’고 선언하는 표현이 시적 병렬에 잘 맞습니다.
- source_word: πάντα τὰ ἔργα
  english_pob_choice: all the works
  chosen_korean: 모든 일들
  alternatives_korean:
  - 모든 작품
  - 모든 창조물
  - 모든 것들
  lexicon: LSJ
  rationale: ἔργα는 문자적으로 ‘일/작업’이지만, 여기서는 우주 전체의 반응을 말하므로 ‘모든 일들’이 가장 무난하게 넓은 범위를 보존합니다.
- source_word: σείεται καὶ τρέμει
  english_pob_choice: shake and tremble
  chosen_korean: 흔들리고 떨며
  alternatives_korean:
  - 요동하고 떨며
  - 흔들며 떨며
  - 흔들리고 두려워하며
  lexicon: LSJ
  rationale: 두 동사의 병렬과 진행감을 살려 ‘흔들리고 떨며’로 옮겼습니다. 두려움 해석을 직접 넣지는 않았습니다.
- source_word: μετʼ αὐτοῦ
  english_pob_choice: with her
  chosen_korean: 그와 함께는
  alternatives_korean:
  - 그녀와 함께는
  - 진리와 함께는
  lexicon: LSJ
  rationale: 그리스어는 앞선 ‘진리’와 불일치하는 중성/남성형으로 전승되지만, 문맥상 ‘진리와 함께’라는 뜻을 가리키므로 한국어는 그 지시를 살려 ‘그와 함께는’으로 두었습니다. 인칭 불일치는 주석으로 남길 수 있으나 본문은 매끄럽게 유지했습니다.
- source_word: ἄδικον οὐθέν
  english_pob_choice: nothing unjust
  chosen_korean: 불의한 것이 하나도 없습니다
  alternatives_korean:
  - 불의한 것이 없습니다
  - 아무 부정함도 없습니다
  - 불의한 것은 전혀 없습니다
  lexicon: LSJ
  rationale: 형용사 ἄδικον의 대조를 살리기 위해 ‘불의한 것’을 택했고, οὐθέν은 강한 부정을 드러내는 ‘하나도 없습니다’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 진리의 인격화 보존 여부
  chosen_reading: ‘진리’를 의인화된 대상으로 읽되, 한국어 본문은 과도한 인칭화 없이 시적 표현으로 유지했습니다.
  alternative_readings:
  - ‘진실’을 비인격적 개념으로 처리
  - ‘진리’를 직접 ‘그녀’로 의인화
  rationale: 원문은 여성이 되는 대명사로 진리를 의인화하지만, 한국어에서 ‘그녀’ 반복은 부자연스러울 수 있어 시적 동사를 통해 의인화 효과만 보존했습니다.
  doctrine_reference: 원문 수사 보존과 현대 한국어 가독성의 균형
- issue: ἄδικον의 윤리·법정적 뉘앙스
  chosen_reading: ‘불의한 것’으로 옮겨 윤리적 잘못과 불공정을 함께 포괄했습니다.
  alternative_readings:
  - ‘의롭지 않은 것’
  - ‘부정한 것’
  - ‘불의’
  rationale: 문맥상 진리와 함께 있을 수 없는 모든 부당함을 말하므로, 좁은 법정 용어보다 넓은 윤리적 표현이 적절합니다.
  doctrine_reference: 의/불의 대조를 유지하되 문맥 과잉신학화는 피함
