  source_fidelity: 개정이 필요합니다. καλεῖ는 여기서 ‘찬양하다’로 한정되지 않으며, 목적어만 취한 표현은 ‘진리를 부르다/부르짖다’ 또는 문맥상 ‘진리를 찾다’의 여지를 남깁니다. ‘찬양하고’는 원문의 직접적 어휘 범위를 넘어섭니다. 또한 εὐλογεῖ는 ‘복되다 하다’보다 ‘축복하다’가 더 직접적입니다. 마지막 μετʼ αὐτοῦ의 성 불일치는 본문에서 문맥상 ‘진리와 함께’로 명료하게 옮기고 주석에서 보존하는 것이 자연스럽습니다.
  naturalness: ‘그와 함께는’은 비인격 추상명사인 ‘진리’를 받는 한국어로 다소 어색하고, 앞에서 ‘진리’를 반복한 뒤 대명사로 바꾸어 지시도 흐립니다. ‘진리와 함께는’이 현대 표준 한국어의 격조 있는 문장에 더 자연스럽습니다. 우주적 문맥의 πάντα τὰ ἔργα는 ‘모든 만물’로 옮기고 직역 가능성을 주석으로 밝히는 편이 ‘모든 일들’보다 자연스럽습니다.
