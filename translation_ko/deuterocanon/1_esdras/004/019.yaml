  text: and it turns every mind to feasting and gladness[b][a], and one remembers no sorrow and no debt.
  footnotes:
  - marker: a
    text: Or 'every thought' for 'every mind.'
    reason: lexical_alternative
  - marker: b
    text: Or 'no obligation' for 'no debt'; the Greek can denote what is owed more generally.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그것은 모든 이의 마음[a]을 잔치와 즐거움으로 돌려놓고, 사람은 어떤 슬픔도 어떤 빚[b]도 기억하지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모든 이의 마음’은 ‘모든 생각’ 또는 ‘모든 이해’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘빚’은 ‘의무’ 또는 더 넓게는 ‘갚아야 할 것’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσαν διάνοιαν
  english_pob_choice: every mind
  chosen_korean: 모든 생각
  alternatives_korean:
  - 모든 마음
  - 온갖 생각
  - 모든 이해
  lexicon: LSJ
  rationale: διάνοια는 마음, 생각, 이해를 가리킬 수 있으므로, 여기서는 영어 POB의 'every mind'가 지닌 분배적 의미를 살리면서 한국어로는 자연스럽게 '모든 생각'으로 옮겼습니다.
- source_word: μεταστρέφει
  english_pob_choice: turns
  chosen_korean: 돌려놓으며
  alternatives_korean:
  - 바꾸며
  - 돌리며
  - 전환하며
  lexicon: LSJ
  rationale: 동사의 기본 뜻인 '돌다/돌리다'를 살리되, 뒤따르는 목적지 구문을 자연스럽게 받도록 '돌려놓으며'로 처리했습니다.
- source_word: εἰς εὐωχίαν καὶ εὐφροσύνην
  english_pob_choice: to feasting and gladness
  chosen_korean: 잔치와 즐거움
  alternatives_korean:
  - 향연과 기쁨
  - 흥청거림과 기쁨
  - 연회와 환희
  lexicon: LSJ
  rationale: εὐωχία는 단순한 기쁨보다 '잔치/연회'의 축제성을, εὐφροσύνη는 즐거움·흥겨움을 나타내므로, 한국어에서는 두 요소를 과장하지 않으면서도 자연스럽게 '잔치와 즐거움'으로 옮겼습니다.
- source_word: οὐ μέμνηται πᾶσαν λύπην καὶ πᾶν ὀφείλημα
  english_pob_choice: one remembers no sorrow and no debt
  chosen_korean: 아무 슬픔도 아무 빚도 기억하지 않게 합니다
  alternatives_korean:
  - 슬픔도 빚도 기억하지 않게 합니다
  - 어떤 슬픔도 어떤 빚도 기억하지 않게 합니다
  - 슬픔과 빚을 잊게 합니다
  lexicon: LSJ
  rationale: 기억하지 못한다는 표현을 한국어에서는 '기억하지 않게 합니다'로 자연화하되, πᾶν ὀφείλημα의 구체성은 '빚'으로 살려 영어 POB의 'no debt'를 반영했습니다.
theological_decisions:
- issue: 익명적 주어와 일반 진술의 처리
  chosen_reading: 행위의 주체를 특정 인물로 두지 않고, 술의 작용에 대한 일반 진술로 한국어를 구성했습니다.
  alternative_readings:
  - 그는 아무 슬픔도 아무 빚도 기억하지 않습니다
  - 사람은 아무 슬픔도 아무 빚도 기억하지 않게 됩니다
  rationale: 그리스어의 무인칭적/일반적 용법을 살려 특정 성별 주어를 넣지 않는 것이 원문의 범위를 더 정확히 전달합니다.
  doctrine_reference: 문법적 일반 진술의 보존
