translation:
  language: ko
  text: 그는 편지들을 가지고 바빌론으로 나가서 자기 형제들 모두에게 알렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰς ἐπιστολάς
  english_pob_choice: the letters
  chosen_korean: 편지들을
  alternatives_korean:
  - 서신들을
  - 문서들을
  lexicon: BDAG
  rationale: ἐπιστολή의 기본 뜻은 ‘편지/서신’이므로, 공식 문서의 뉘앙스를 과도하게 좁히지 않으면서도 가장 직접적인 한국어인 ‘편지들’을 택했습니다.
- source_word: ἐξῆλθεν εἰς Βαβυλῶνα
  english_pob_choice: went out to Babylon
  chosen_korean: 바빌론으로 나가서
  alternatives_korean:
  - 바빌론으로 떠나서
  - 바빌론으로 가서
  lexicon: BDAG
  rationale: ἔξ-의 방향성을 살리기 위해 단순한 ‘가다’보다 ‘나가다’를 반영했고, 지명은 현대 표기 관행에 맞춰 ‘바빌론’으로 옮겼습니다.
- source_word: ἀπήγγειλεν
  english_pob_choice: reported
  chosen_korean: 알렸습니다
  alternatives_korean:
  - 보고했습니다
  - 전했습니다
  - 보고했습니다
  lexicon: BDAG
  rationale: 이 동사는 여기서 앞선 행동의 결과를 남에게 알리는 뜻이므로, 한국어에서는 과도하게 관료적인 ‘보고하다’보다 자연스럽고 직접적인 ‘알리다’가 문맥에 더 잘 맞습니다.
- source_word: τοῖς ἀδελφοῖς αὐτοῦ πᾶσιν
  english_pob_choice: to all his brothers
  chosen_korean: 자기 형제들 모두에게
  alternatives_korean:
  - 자기 형제들 모두에게
  - 자기 동족들 모두에게
  - 자기 형제들에게 모두
  lexicon: BDAG
  rationale: ἀδελφοί를 직역해 ‘형제들’로 두되, πᾶσιν의 전면성을 살려 ‘모두’로 옮겼습니다. 이 구절은 형제/동족을 넓게 가리킬 수 있지만, 본문이 허용하는 가장 가까운 형태를 유지했습니다.
theological_decisions:
- issue: ἀδελφοί의 범위
  chosen_reading: ‘형제들’로 유지하되, 문맥상 혈연만으로 제한하지 않고 공동체적 친족/동족의 포괄 가능성을 열어 둡니다.
  alternative_readings:
  - ‘동족들’로 확대
  - ‘형제자매들’로 현대화
  rationale: 원어 자체가 남성 복수형이며, 본문은 대상을 좁혀 설명하지 않습니다. 따라서 해석을 앞서 확정하기보다 원문 근접성을 우선했습니다.
  doctrine_reference: 문맥 주해의 범위 문제
