  text: 진리의 판단에는 불의한 것이 전혀 없습니다. 모든 시대에 걸친 힘과 나라와 권세와 위엄은 진리의 것입니다. 진리의 하나님은 찬송받으실지어다.[a]
  philosophy: optimal-equivalence
  footnotes:
