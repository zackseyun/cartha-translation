  source_fidelity: 수정이 필요합니다. 여성 단수 대명사 αὐτῆς와 αὕτη는 문맥상 의인화된 ‘진리’를 가리키는데, 초안의 ‘그의/그에게’는 남성 지시로 바꾸어 선행사와 문학적 의인화를 훼손합니다. 또한 δεύτε 절은 ‘그에게 ... 있습니다’보다 힘·나라·권세·위엄이 진리에 속한다는 소유 구문을 보존하는 편이 원문에 더 가깝습니다.
  naturalness: ‘진리의 판단’ 및 ‘…은 진리의 것입니다’는 현대 표준 한국어의 격식 있는 문체에서 자연스럽고, 반복을 통해 원문의 의인화된 지시를 무리 없이 드러냅니다. 송영은 ‘찬송받으실지어다’가 자연스럽고 적절합니다.
  terminology: κρίσις는 여기서 ‘판단’으로 옮겨 재판적·분별적 의미를 유지했습니다. ἄδικον은 ‘불의한 것’, ἰσχύς/ἐξουσία는 ‘힘/권세’, βασίλειον은 ‘나라’, μεγαλειότης는 ‘위엄’으로 구별했습니다. ‘진리의 하나님’은 ὁ θεὸς τῆς ἀληθείας를 직접적으로 보존합니다.
