translation:
  language: ko
  text: 그의 판결에는 조금도 불의한 것이 없습니다. 그리고 그에게는 모든 시대의 힘과 나라와 권세와 위엄이 있습니다. 진리의 하나님은 찬양받으실지어다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘모든 시대들의’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσις
  english_pob_choice: judgment
  chosen_korean: 판결
  alternatives_korean:
  - 심판
  - 판단
  lexicon: LSJ
  rationale: 여기서는 재판적·사법적 판단의 뜻이 강하므로, ‘판결’이 문맥을 가장 분명하게 살립니다.
- source_word: ἄδικον
  english_pob_choice: unjust
  chosen_korean: 불의한
  alternatives_korean:
  - 부당한
  - 옳지 않은
  lexicon: LSJ
  rationale: ‘불의한’은 κρίσις와 결합된 사법적 문맥에서 ‘정의롭지 않은’ 뜻을 자연스럽게 드러냅니다.
- source_word: τῶν πάντων αἰώνων
  english_pob_choice: of all the ages
  chosen_korean: 모든 시대의
  alternatives_korean:
  - 영원부터 영원까지의
  - 온 세대의
  lexicon: LSJ
  rationale: 영어 POB의 각주가 보여 주듯 직역하면 ‘모든 시대들의’이므로, 한국어에서는 자연스러운 ‘모든 시대의’로 옮기되 문맥상 영원성을 함께 느끼게 했습니다.
- source_word: ὁ θεὸς τῆς ἀληθείας
  english_pob_choice: the God of truth
  chosen_korean: 진리의 하나님
  alternatives_korean:
  - 참되신 하나님
  - 진실의 하나님
  lexicon: LSJ
  rationale: 소유격/관계 표현을 자연스러운 관형격으로 살려, 하나님을 ‘진리와 관련된 분’으로 직접 드러냈습니다.
theological_decisions:
- issue: εὐλογητός의 doxological force
  chosen_reading: ‘찬양받으실지어다’로 옮겨, 단순 서술보다 송영적 축복 선언의 어조를 살렸습니다.
  alternative_readings:
  - ‘복되신 분’
  - ‘찬송받으실지어다’
  rationale: 문장 말미는 선언형 축도로 기능하므로, 한국어에서도 하나님께 드리는 공개적 찬양의 형식을 분명히 하는 표현이 적절합니다.
