  text: From you are victory and wisdom[a], and yours is the glory, and I am your servant.
  footnotes:
  - marker: a
    text: Or 'I am your household servant.' The Greek οἰκέτης specifically denotes a household servant; 'servant' is used in the main text for natural English style.
    reason: lexical_alternative
translation:
  language: ko
  text: 승리와 지혜는 당신에게서 나오며, 영광은 당신의 것이고, 저는 당신의 집안 종입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 종’. 그리스어 οἰκέτης는 특히 집안이나 가정에 속한 종을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρά σοῦ / σὴ
  english_pob_choice: From you / yours is
  chosen_korean: 주님께 있고 / 주님의 것입니다
  alternatives_korean:
  - 주님에게서 나옵니다 / 주님께 속합니다
  - 주님으로부터 있습니다 / 주님의 몫입니다
  lexicon: LSJ
  rationale: παρά + 속격의 출처 의미와 σὴ ἡ δόξα의 소유 표현을 한국어에서 자연스럽게 살려, ‘...께 있다/것입니다’로 근원을 표시했습니다.
- source_word: νίκη
  english_pob_choice: victory
  chosen_korean: 승리
  alternatives_korean:
  - 개가
  - 이김
  lexicon: LSJ
  rationale: νίκη의 기본 의미를 가장 직접적으로 옮기는 말로 ‘승리’를 선택했습니다.
- source_word: σοφία
  english_pob_choice: wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 슬기
  - 총명
  lexicon: LSJ
  rationale: σοφία의 표준 대응어인 ‘지혜’를 사용해 본문의 대칭 구조를 보존했습니다.
- source_word: οἰκέτης
  english_pob_choice: servant / household servant
  chosen_korean: 집안 종
  alternatives_korean:
  - 종
  - 가사 종
  - 가정 종
  lexicon: LSJ
  rationale: οἰκέτης가 가정에 속한 종을 가리킨다는 점을 드러내면서도, 문체를 지나치게 장황하게 만들지 않도록 ‘집안 종’으로 옮겼습니다.
theological_decisions:
- issue: 호칭이 특정 인물인지 하나님인지 본문 자체가 밝히지 않는 문제
  chosen_reading: 직접 호칭 구조를 유지하고 대상의 특정화는 하지 않았습니다.
  alternative_readings:
  - 하나님께 드리는 고백으로 명시
  - 왕에게 드리는 진술로 명시
  rationale: 헬라어는 2인칭 대명사로 직접 말하지만 이 절 안에서 수신자를 명시하지 않으므로, 번역도 그 긴장을 그대로 보존했습니다.
  doctrine_reference: 본문의 지시 대상을 번역자가 과도하게 확정하지 않음
- issue: οἰκέτης의 사회적 함의
  chosen_reading: ‘종’보다 구체적인 ‘집안 종’으로 번역해 소속성과 봉사성을 함께 드러냈습니다.
  alternative_readings:
  - 종
  - 노예
  rationale: 여기서는 bonded status를 전면화하기보다 가정 소속의 뉘앙스가 더 강하므로, 본문의 높임과 문맥을 함께 살리는 표현을 택했습니다.
  doctrine_reference: 어휘의 사회적 범위를 본문 맥락에 따라 조정
