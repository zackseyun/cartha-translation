  rationale: ὑπερισχύω는 ‘이기다/우세하다/더 강하다’의 뜻을 가지므로, 짧고 선언적인 문장으로서 ‘우세합니다’가 POB의 ‘prevails’를 가장 균형 있게 반영합니다.
