lexical_decisions:
- source_word: ὁ ἕτερος
  english_pob_choice: The other
  chosen_korean: 다른 이
  alternatives_korean:
  - 다른 사람
  - 두 번째 사람
  - 또 한 사람
  lexicon: LSJ
  rationale: 정관사와 함께 쓰인 ἕτερος는 앞선 인물과 대비되는 ‘다른 사람’을 가리키므로, 한국어에서도 자연스럽게 대비를 살려 ‘다른 이’로 옮겼습니다.
- source_word: ἔγραψεν
  english_pob_choice: wrote
  chosen_korean: 썼습니다
  alternatives_korean:
  - 기록했습니다
  - 적었습니다
  - 써 놓았습니다
  lexicon: LSJ
  rationale: 부정과거 γράφω는 단순히 ‘썼다’로 옮기는 것이 가장 직접적이며, 문맥상 물질적 매체를 특정하지 않으므로 ‘기록하다’보다 넓고 자연한 표현을 택했습니다.
- source_word: Ὑπερισχύει
  english_pob_choice: prevails
  chosen_korean: 우세합니다
  alternatives_korean:
  - 이깁니다
  - 더 강합니다
  - 우위에 있습니다
  lexicon: LSJ
  rationale: ὑπερισχύω는 ‘이기다/우세하다/더 강하다’의 뜻을 가지므로, 짧고 선언적인 문장으로서 ‘우세합니다’가 POB의 ‘prevails’를 가장 균형 있게 반영합니다.
- source_word: ὁ βασιλεύς
  english_pob_choice: the king
  chosen_korean: 왕
  alternatives_korean:
  - 임금
  - 군왕
  - 통치자
  lexicon: LSJ
  rationale: βασιλεύς의 기본 의미는 ‘왕’이므로, 한국어에서도 가장 직접적이고 과도한 해석이 없는 ‘왕’을 사용했습니다.
