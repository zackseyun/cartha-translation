lexical_decisions:
- source_word: ὅταν
  english_pob_choice: when
  chosen_korean: -면
  alternatives_korean:
  - -할 때
  - -할 때마다
  lexicon: BDAG
  rationale: 일반적인 시간 종속절이므로 한국어에서는 조건-시간 겸용의 자연스러운 ‘-면’으로 옮겨, 반복적 일반 진술의 흐름을 살렸습니다.
- source_word: ἀπὸ τοῦ οἴνου
  english_pob_choice: from the wine
  chosen_korean: 포도주로부터
  alternatives_korean:
  - 포도주에서
  - 술에서
  - 포도주를 마시고
  lexicon: BDAG
  rationale: 영어 본문처럼 해석을 덧붙이지 않고, 그리스어의 ‘포도주로부터’라는 출발점을 그대로 드러내어 음주 뒤의 상태 회복을 암시하게 했습니다.
- source_word: ἐγερθῶσιν
  english_pob_choice: they rise
  chosen_korean: 일어나면
  alternatives_korean:
  - 깨어나면
  - 일어나게 되면
  lexicon: BDAG
  rationale: 문맥상 술기운에서 벗어나 몸을 일으키는 뜻이므로, 간결하고 원문에 가까운 ‘일어나면’을 택했습니다.
- source_word: οὐ μέμνηται ἃ ἔπραξαν
  english_pob_choice: they do not remember what they did
  chosen_korean: 자신들이 행한 것을 기억하지 못합니다
  alternatives_korean:
  - 그들이 한 일을 기억하지 못합니다
  - 무엇을 했는지 기억하지 못합니다
  lexicon: BDAG
  rationale: ‘기억하지 못하다’로 부정을 분명히 하고, 목적절보다 자연스러운 ‘자신들이 행한 것’을 사용해 행위의 책임 주체를 살렸습니다.
theological_decisions:
- issue: 술 이후의 상태를 어떻게 드러낼 것인가
  chosen_reading: ‘포도주로부터 일어나면’으로 직역적 이미지를 유지해, 술로 인한 무기력/혼미에서 벗어나는 상황을 독자가 스스로 읽게 했습니다.
  alternative_readings:
  - ‘술기운에서 깨어나면’
  - ‘술에서 정신이 들면’
  rationale: 본문은 도덕적 평가보다 관찰적 진술을 하고 있으므로, 해석을 과하게 좁히지 않고 원문 이미지의 생경함을 보존하는 편이 더 적절합니다.
  doctrine_reference: 문맥상 지혜문학적 관찰 진술
