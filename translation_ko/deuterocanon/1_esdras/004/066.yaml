  naturalness: ‘서원한 것들’은 의미상 부자연스럽고 문장 구조상 무엇이 서원했는지 불명확합니다. 고레스를 두 서원의 주어로 명확히 하고, 기물은 ‘따로 구별해 둔 것들’로 처리하면 현대 표준 한국어 합쇼체로 자연스럽습니다.
