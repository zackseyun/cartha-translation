base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/066.yaml
  text: and all the vessels taken from Jerusalem are to be sent back there—those that Cyrus set apart when he vowed to destroy Babylon[c][b][a], and vowed to send there.
  footnotes:
  - marker: a
    text: Or 'vowed to destroy Babylon'; the Greek literally says 'to cut off Babylon.'
    reason: lexical_alternative
  - marker: b
    text: Or 'prayed' instead of 'vowed.'
    reason: alternative_reading
  - marker: c
    text: Literally 'to send there'; 'back' is supplied in English from the context of returning items taken from Jerusalem.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 예루살렘에서 가져간 모든 기물, 곧 고레스가 바빌론을 끊어 버리고[a] 그곳으로 보내기로 서원할 때[b] 따로 구별해 둔 것들은 그곳으로 다시[c] 보내져야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘바빌론을 끊다’입니다. 본문은 이 표현의 파괴적 이미지를 유지합니다.
    reason: lexical_alternative
  - marker: b
    text: ηὔξατο는 ‘기도했다’로도 옮길 수 있지만, 여기서는 뒤따르는 부정사들과 함께 서원 또는 엄숙한 결의를 나타내는 것으로 읽었습니다.
    reason: alternative_reading
  - marker: c
    text: 헬라어는 단순히 ‘그곳으로 보내다’라고 말합니다. ‘다시’는 예루살렘에서 가져온 물품이라는 문맥에 따라 보충한 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκεύη
  english_pob_choice: vessels
  chosen_korean: 기물
  alternatives_korean:
  - 그릇
  - 용기
  - 성전 기물
  lexicon: LSJ
  rationale: 성전 문맥에서 단순한 생활용품보다 예배용 물품을 가리킬 가능성이 높아, 지나치게 구체화하지 않으면서도 제의적 물품을 살릴 수 있는 ‘기물’을 택했습니다.
- source_word: τὰ λημφθέντα ἐξ Ἰερουσαλήμ
  english_pob_choice: taken from Jerusalem
  chosen_korean: 예루살렘에서 가져간
  alternatives_korean:
  - 예루살렘에서 빼앗은
  - 예루살렘에서 취한
  lexicon: LSJ
  rationale: 문맥상 바벨론에 의해 옮겨진 성전 물품을 가리키므로, 영어의 ‘taken’처럼 상태를 말하되 한국어에서는 자연스럽고 중립적인 ‘가져간’으로 옮겼습니다.
- source_word: ἐκπέμψαι ... ἐκεῖ
  english_pob_choice: are to be sent back there
  chosen_korean: 다시 그곳으로 보내져야 합니다
  alternatives_korean:
  - 그곳으로 보내져야 합니다
  - 거기로 다시 보내져야 합니다
  lexicon: LSJ
  rationale: 헬라어 자체는 단순히 ‘보내다’이지만, 앞절의 예루살렘에서 가져온 물품이라는 맥락이 회복의 방향을 분명히 하므로 ‘다시’로 그 함의를 드러냈습니다.
- source_word: ἃ ἐχώρισεν
  english_pob_choice: those that ... set apart
  chosen_korean: 따로 구별한 것들
  alternatives_korean:
  - 따로 떼어 둔 것들
  - 분리한 것들
  - 지정한 것들
  lexicon: LSJ
  rationale: χωρίζω는 여기서 행정적 분리와 목적을 위한 구별을 모두 담을 수 있어, 제의적 뉘앙스를 살리는 ‘따로 구별한’이 가장 적절합니다.
- source_word: ηὔξατο
  english_pob_choice: vowed
  chosen_korean: 서원했을 때 / 서원한 것들
  alternatives_korean:
  - 기도했을 때
  - 약속했을 때
  - 맹세했을 때
  lexicon: LSJ
  rationale: 분사로 이어지는 뒤 문맥상 단순 기도보다 서원이나 엄숙한 결의가 더 자연스러우므로, POB의 ‘vowed’를 따라 ‘서원하다’로 옮겼습니다.
theological_decisions:
- issue: 바빌론에 대한 동사의 강도(ἐκκόψαι Βαβυλῶνα)
  chosen_reading: ‘바빌론을 끊어 버리다’로 직역적 이미지를 살리고, 문맥상 파괴의 뜻을 독자가 읽어 내도록 둡니다.
  alternative_readings:
  - 바빌론을 멸하다
  - 바빌론을 없애다
  rationale: 본문의 헬라어는 문자적으로 ‘자르다/끊다’의 이미지를 유지하므로, 이를 평탄화해 ‘멸하다’로만 옮기면 POB가 보존하려는 수사적 긴장이 사라집니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
- issue: 기물의 반환을 어떻게 표현할지
  chosen_reading: ‘다시 그곳으로 보내져야 합니다’로 반환의 방향을 명시합니다.
  alternative_readings:
  - 그곳으로 보내져야 합니다
  - 되돌려 보내져야 합니다
  rationale: 헬라어에는 ‘다시’에 해당하는 말이 없지만, 예루살렘에서 가져간 물품이라는 바로 앞 정보가 회복/환원의 의미를 요구하므로, 오해를 막기 위해 함의를 드러냈습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 5
