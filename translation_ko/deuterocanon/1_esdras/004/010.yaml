theological_decisions:
- issue: Ὑπερισχύει의 의미 범위
  chosen_reading: ‘더 강합니다’로 본문을 번역해 힘의 비교를 전면에 두었습니다.
  alternative_readings:
  - ‘우세합니다’
  - ‘이깁니다’
  - ‘더 낫습니다’
  rationale: 영어 POB도 ‘is stronger’와 각주 ‘prevails’를 함께 두어 의미 범위를 열어 두고 있습니다. 한국어 본문은 비교 강세를 기본값으로 두고, 대안 의미는 각주로 보완하는 편이 가장 투명합니다.
  doctrine_reference: 번역학적 판정
