lexical_decisions:
- source_word: ὁ εἷς
  english_pob_choice: One
  chosen_korean: 한 사람이
  alternatives_korean:
  - 하나가
  - 그 한 사람이
  - 한 명이
  lexicon: LSJ
  rationale: 경연 장면에서 특정 인물을 가리키는 기능을 살려, 자연스러운 한국어로 ‘한 사람이’라고 옮겼습니다.
- source_word: ἔγραψεν
