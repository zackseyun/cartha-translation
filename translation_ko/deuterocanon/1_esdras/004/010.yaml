  chosen_korean: 썼습니다
  alternatives_korean:
  - 기록했습니다
  - 적었습니다
  lexicon: LSJ
  rationale: γράφω의 기본 의미를 직접적으로 반영하면서도 현대 한국어 서술문에 자연스럽습니다.
- source_word: Ὑπερισχύει
  english_pob_choice: is stronger
  chosen_korean: 더 강합니다
  alternatives_korean:
  - 더 우세합니다
  - 이깁니다
  - 우세합니다
  lexicon: LSJ
  rationale: 본문의 비교적 진술을 살려 ‘강하다’의 비교형으로 옮기면, 힘의 우열이라는 감각이 가장 분명하게 드러납니다.
- source_word: ὁ οἶνος
  english_pob_choice: Wine
  chosen_korean: 포도주가
  alternatives_korean:
  - 술이
  - 와인이
  lexicon: LSJ
  rationale: 성경 문맥에서 οἶνος는 통상 포도주를 뜻하므로 표준적이고 직역에 가까운 ‘포도주’로 옮겼습니다.
theological_decisions:
- issue: Ὑπερισχύει의 의미 범위
  chosen_reading: ‘더 강합니다’로 본문을 번역해 힘의 비교를 전면에 두었습니다.
  alternative_readings:
  - ‘우세합니다’
  - ‘이깁니다’
  - ‘더 낫습니다’
  rationale: 영어 POB도 ‘is stronger’와 각주 ‘prevails’를 함께 두어 의미 범위를 열어 두고 있습니다. 한국어 본문은 비교 강세를 기본값으로 두고, 대안 의미는 각주로 보완하는 편이 가장 투명합니다.
  doctrine_reference: 번역학적 판정
