  text: And he sent back all the vessels that Cyrus had set apart from Babylon; and everything that Cyrus had said to do[a], he himself also ordered to be done and sent to Jerusalem.
  footnotes:
  - marker: a
    text: Or 'sent out'; the context of restoring temple vessels supports 'sent back.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 고레스가 바빌론에서 따로 떼어 둔 모든 기물을 돌려보냈습니다.[a] 또한 고레스가 하라고 말한 모든 일을 그도 실행하고 예루살렘으로 보내도록 명령했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내보냈습니다’. 문맥상 기물의 회복을 가리키므로 ‘돌려보냈습니다’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαπέστειλεν
  english_pob_choice: sent back
  chosen_korean: 돌려보냈습니다
  alternatives_korean:
  - 보냈습니다
  - 내보냈습니다
  lexicon: LSJ
  rationale: 사원 기물의 회복 맥락에서 단순한 ‘보냄’보다 원래 있던 곳으로 되돌리는 방향을 드러내는 ‘돌려보내다’가 영어 POB의 ‘sent back’에 가장 가깝습니다.
- source_word: τὰ σκεύη
  english_pob_choice: the vessels
  chosen_korean: 그릇
  alternatives_korean:
  - 기물
  - 용기
  - 그릇들
  lexicon: LSJ
  rationale: 성전 관련 물건을 가리키는 말이지만, 현대 한국어에서 가장 자연스럽고 과도하게 기술적이지 않은 표현으로 ‘그릇’을 택했습니다. 문맥상 복수성은 앞의 ‘모든’으로 충분히 드러납니다.
- source_word: ἃ ἐχώρισεν Κῦρος ἀπὸ Βαβυλῶνος
  english_pob_choice: that Cyrus had set apart from Babylon
  chosen_korean: 고레스가 바빌론에서 따로 떼어 놓은
  alternatives_korean:
  - 고레스가 바빌론에서 분리해 놓은
  - 고레스가 바빌론에서 떼어 놓은
  lexicon: LSJ
  rationale: ἐχώρισεν의 ‘분리하다’ 의미를 살리되, 회복을 위해 보관·구별한 뉘앙스를 담는 ‘따로 떼어 놓다’로 옮겼습니다.
- source_word: ἐπέταξεν
  english_pob_choice: ordered
  chosen_korean: 명령하고
  alternatives_korean:
  - 지시하고
  - 명하고
  lexicon: LSJ
  rationale: 행정적·공적 명령의 힘을 유지하면서 현대 문체에 자연스러운 ‘명령하다’를 사용했습니다.
- source_word: ποιῆσαι καὶ ἐξαποστεῖλαι
  english_pob_choice: to be done and to be sent
  chosen_korean: 실행하라고 … 보내라고
  alternatives_korean:
  - 행해지라고 … 보내라고
  - 하도록 … 보내도록
  lexicon: LSJ
  rationale: 이중 부정사 구조를 한국어의 간접화법으로 풀어, 누가 직접 행위하는지보다 ‘행해지도록’과 ‘보내도록’이라는 명령의 대상성을 드러냈습니다.
