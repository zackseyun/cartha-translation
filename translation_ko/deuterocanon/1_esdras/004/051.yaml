  - 템플
  lexicon: LSJ
  rationale: ἱερόν은 여기서 성전 परिसर/건물을 가리키므로, 한국어 성서 문맥에서 가장 직접적인 ‘성전’을 택했습니다.
- source_word: κατʼ ἐνιαυτόν
  english_pob_choice: each year
  chosen_korean: 해마다
  alternatives_korean:
  - 매년
  - 한 해마다
  lexicon: LSJ
  rationale: 반복 지급의 주기를 자연스러운 현대 한국어로 살리기 위해 ‘해마다’로 옮겼습니다.
- source_word: τάλαντα εἴκοσι
  english_pob_choice: twenty talents
  chosen_korean: 스무 달란트
  alternatives_korean:
  - 이십 달란트
  - 스무 탈란트
  lexicon: LSJ
  rationale: τάλαντον은 고대 중량/금전 단위이므로 음역된 표준형 ‘달란트’를 유지하고, 수사는 한국어 자연어법에 맞춰 ‘스무’로 처리했습니다.
