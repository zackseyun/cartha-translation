  text: and for the building of the temple[b][a], that twenty talents be given each year until it is built.
  footnotes:
  - marker: a
    text: Or 'for the construction of the temple.'
    reason: lexical_alternative
  - marker: b
    text: A talent was a large ancient unit of weight, often used for precious metals and monetary assessment.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 성전 건축을 위해 해마다 스무 달란트가 지급되어야 하며, 성전이 세워질 때까지 그렇게 해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 달란트는 고대의 큰 중량 단위이며, 금속이나 금전 평가에 쓰이기도 했습니다.
    reason: cultural_note
lexical_decisions:
- source_word: οἰκοδομὴν
  english_pob_choice: building
  chosen_korean: 건축
  alternatives_korean:
  - 건설
  - 세움
  lexicon: LSJ
  rationale: 명사 οἰκοδομή는 건축 행위나 사업을 가리키므로, 성전의 물리적 공사를 자연스럽게 드러내는 ‘건축’이 적절합니다.
- source_word: τοῦ ἱεροῦ
  english_pob_choice: temple
  chosen_korean: 성전
  alternatives_korean:
