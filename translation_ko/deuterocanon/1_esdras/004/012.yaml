lexical_decisions:
- source_word: ὁ τρίτος
  english_pob_choice: The third
  chosen_korean: 그 셋째
  alternatives_korean:
  - 셋째 사람
  - 세 번째 사람
  lexicon: LSJ
  rationale: 정관사와 서수의 결합이 서술 속 ‘세 번째로 말한 사람’을 가리키므로, 한국어에서는 간결하게 ‘그 셋째’로 옮겼습니다.
- source_word: ἔγραψεν
  english_pob_choice: wrote
  chosen_korean: 쓰기를
  alternatives_korean:
  - 기록하기를
  - 썼다고
  lexicon: LSJ
  rationale: 말의 내용을 직접 인용으로 이끄는 서술 동사이므로, 문어체에서 자연한 ‘쓰기를’로 처리했습니다.
- source_word: Ὑπερισχύουσιν αἱ γυναῖκες
  english_pob_choice: Women are stronger
  chosen_korean: 여자들이 더 강하지만
  alternatives_korean:
  - 여자들이 더 강합니다
  - 여자들이 이깁니다
  lexicon: LSJ
  rationale: ὑπερισχύουσιν은 단순한 ‘이기다’보다 ‘더 강하다/우세하다’의 힘 비교를 담으므로, 영어 POB의 선택을 따라 ‘더 강하다’로 옮겼습니다.
- source_word: ὑπὲρ δὲ πάντα νικᾷ ἡ ἀλήθεια
  english_pob_choice: but above all things truth is victorious
  chosen_korean: 무엇보다도 진리가 이깁니다
  alternatives_korean:
  - 그러나 진리가 모든 것 위에서 이깁니다
  - 그런데 진리가 모든 것보다 이깁니다
  lexicon: LSJ
  rationale: ὑπὲρ δὲ πάντα는 ‘무엇보다도/모든 것 위에서’의 최고 비교를 나타내고, νικᾷ는 ‘이기다, 승리하다’의 현재 일반진술이므로 한국어에서는 간명하게 ‘무엇보다도 진리가 이깁니다’로 살렸습니다.
