  chosen_reading: 진리가 이깁니다
  alternative_readings:
  - 진리가 승리합니다
  - 진리가 모든 것 위에서 이깁니다
  rationale: 본문은 인격화된 진리를 최종 승자로 제시하는 잠언형 진술이므로, 교리적 해설을 덧붙이지 않고 동사의 승리 이미지를 직접 보존했습니다.
