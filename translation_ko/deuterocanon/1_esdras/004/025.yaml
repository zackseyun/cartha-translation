  text: But the king prevails over them and rules over them[a], and is master over them, and whatever he says to them, they obey.
  footnotes:
  - marker: a
    text: Or 'they listen to him' / 'they heed him.' The Greek verb is literally a hearing-word, but here it carries the sense of obedience to royal command.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 왕은 그들보다 우세하고 그들을 다스리며, 그들의 주인이 되며, 또 그가 그들에게 말하는 것은 무엇이든 그들은 듣고 따릅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘듣다/들어주다’이지만, 여기서는 왕의 명령에 대한 순종의 뜻으로 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ βασιλεὺς
  english_pob_choice: But the king
  chosen_korean: 그러나 왕은
  alternatives_korean:
  - 그리고 왕은
  - 이제 왕은
  lexicon: LSJ
  rationale: δέ의 대조·전개 기능을 반영해 ‘그러나’로 옮기고, βασιλεύς는 기본적으로 ‘왕’으로 처리했습니다.
- source_word: ὑπερισχύει
  english_pob_choice: prevails over
  chosen_korean: 그들보다 우세하고
  alternatives_korean:
  - 그들보다 더 강하고
  - 그들 위에 군림하고
  lexicon: LSJ
  rationale: 동사의 비교적 우세함을 살리면서 현대 한국어로 자연스럽게 들리도록 ‘우세하고’로 옮겼습니다.
- source_word: κυριεύει αὐτῶν
  english_pob_choice: rules over them
  chosen_korean: 그들을 다스리며
  alternatives_korean:
  - 그들 위에 군림하며
  - 그들을 지배하며
  lexicon: LSJ
  rationale: κυριεύω의 통치·지배 의미를 살리되, 뒤의 δεσπόζει와 구별되도록 보다 일반적인 ‘다스리다’를 택했습니다.
- source_word: δεσπόζει αὐτῶν
  english_pob_choice: is master over them
  chosen_korean: 그들의 주인이 되며
  alternatives_korean:
  - 그들을 완전히 주관하며
  - 그들 위에 주인처럼 군림하며
  lexicon: LSJ
  rationale: δεσπόζω의 더 강한 ‘주인 됨/절대적 소유권’ 뉘앙스를 유지하기 위해 ‘주인이 되며’로 구분해 옮겼습니다.
- source_word: ἐνακούουσιν
  english_pob_choice: they obey
  chosen_korean: 듣고 따릅니다
  alternatives_korean:
  - 그에게 복종합니다
  - 그의 말을 경청합니다
  lexicon: LSJ
  rationale: 직역하면 ‘듣다’이지만, 왕의 명령 문맥에서는 순종의 뜻이므로 청각적 의미와 복종의 의미를 함께 살려 ‘듣고 따르다’로 옮겼습니다.
theological_decisions:
- issue: 왕권을 묘사하는 세 동사의 단계적 강도
  chosen_reading: ὑπερισχύει–κυριεύει–δεσπόζει를 서로 다른 한국어 표현으로 유지해, 단순한 반복이 아니라 우세함→통치함→주인 됨의 강도 상승을 드러냈습니다.
  alternative_readings:
  - 세 동사를 모두 ‘다스리다/지배하다’로 평준화하는 번역
  - 강한 어휘를 하나로 묶어 의미 차이를 약화하는 번역
  rationale: 본문은 왕의 권세를 점층적으로 강조하므로, 한국어에서도 같은 층위를 보존하는 것이 원문 의도를 더 잘 반영합니다.
  doctrine_reference: 정치·권력 언어의 수사적 점층
