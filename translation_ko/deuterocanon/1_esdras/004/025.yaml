  lexicon: LSJ
  rationale: δεσπόζω의 더 강한 ‘주인 됨/절대적 소유권’ 뉘앙스를 유지하기 위해 ‘주인이 되며’로 구분해 옮겼습니다.
- source_word: ἐνακούουσιν
