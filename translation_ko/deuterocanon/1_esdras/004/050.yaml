  source_fidelity: 원문의 두 병렬 칙령을 충실히 반영합니다. κρατήσουσιν의 미래적 뉘앙스는 ‘차지하게 될’로, διακρατοῦσιν의 지속적 점유는 ‘점유하고 있는’으로 옮겼습니다. δεύτε clause는 원문대로 갈대아 사람들이 유다 사람들의 마을을 비워야 한다는 뜻입니다.
  naturalness: 초안의 ‘유다 사람들의 그들이 점유하는 마을들’은 관계절의 위치가 부자연스럽고 뜻을 즉시 파악하기 어렵습니다. ‘자신들이 점유하고 있는 유다 사람들의 마을에서 떠나야 합니다’로 고치면 현대 표준어 합쇼체에서 자연스럽고 명료합니다.
