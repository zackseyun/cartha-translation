  rationale: κρατέω는 소유·지배·점유의 뜻을 모두 가질 수 있지만, 이 문맥에서는 땅을 확보해 보유한다는 의미가 두드러져 ‘차지할’이 가장 자연스럽습니다.
- source_word: ἀφορολόγητον
