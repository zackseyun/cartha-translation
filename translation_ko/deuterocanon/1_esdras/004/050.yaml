  text: 그리고 그들이 차지하게 될 모든 땅은 그들에게 세금이 면제되어야 하며[a], 갈대아 사람들은 자신들이 점유하고 있는 유다 사람들의 마을에서 떠나야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 차지하게 될 모든 영토는 공납이 면제되어야 한다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: χώραν
  english_pob_choice: land
  chosen_korean: 땅
  alternatives_korean:
  - 토지
  - 영토
  - 땅과 영토
  lexicon: LSJ
  rationale: χώρα는 문맥상 행정적으로 점유하는 땅이나 영토를 가리키므로, 간결하면서도 범위를 과도하게 좁히지 않는 ‘땅’이 적절합니다.
- source_word: κρατήσουσιν
  english_pob_choice: they hold
  chosen_korean: 차지할
  alternatives_korean:
  - 소유할
  - 점유할
  - 지배할
  lexicon: LSJ
  rationale: κρατέω는 소유·지배·점유의 뜻을 모두 가질 수 있지만, 이 문맥에서는 땅을 확보해 보유한다는 의미가 두드러져 ‘차지할’이 가장 자연스럽습니다.
- source_word: ἀφορολόγητον
  english_pob_choice: tax-free
  chosen_korean: 세금이 면제되어야 하며
  alternatives_korean:
  - 조세가 면제되어야 하며
  - 세금이 없어야 하며
  - 면세가 되어야 하며
  lexicon: LSJ
  rationale: ἀφορολόγητον은 과세나 공납의 면제를 뜻하므로, 현대 한국어에서 의미를 분명히 드러내는 ‘세금이 면제되어야 하며’로 옮겼습니다.
- source_word: ἀφίουσι
  english_pob_choice: should leave
  chosen_korean: 떠나야 합니다
  alternatives_korean:
  - 버려야 합니다
  - 물러나야 합니다
  - 떠나야 하며
  lexicon: LSJ
  rationale: ἀφίημι는 여기서 점유를 그만두고 떠나는 뜻이므로, 한국어로는 ‘떠나야 합니다’가 가장 직설적입니다.
- source_word: διακρατοῦσιν
  english_pob_choice: they occupy
  chosen_korean: 점유하는
  alternatives_korean:
  - 차지하는
  - 지속해서 점유하는
  - 붙들고 있는
  lexicon: LSJ
  rationale: διακρατέω는 단순한 거주보다 계속 붙들고 있는 점유를 강조하므로, 유다 사람들의 마을에 대한 불법적 점유 느낌을 살려 ‘점유하는’으로 옮겼습니다.
