- issue: 칼데아 사람들에 대한 명칭과 행정 언어의 처리
  chosen_reading: 역사적 민족명 ‘갈대아 사람들’을 그대로 두고, 본문은 왕의 행정적 명령을 드러내는 문체로 번역했습니다.
  alternative_readings:
