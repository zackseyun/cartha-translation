  - 면세가 되어야 하며
  lexicon: LSJ
  rationale: ἀφορολόγητον은 과세나 공납의 면제를 뜻하므로, 현대 한국어에서 의미를 분명히 드러내는 ‘세금이 면제되어야 하며’로 옮겼습니다.
- source_word: ἀφίουσι
  english_pob_choice: should leave
  chosen_korean: 떠나야 합니다
  alternatives_korean:
  - 버려야 합니다
  - 물러나야 합니다
  - 떠나야 하며
  lexicon: LSJ
  rationale: ἀφίημι는 여기서 점유를 그만두고 떠나는 뜻이므로, 한국어로는 ‘떠나야 합니다’가 가장 직설적입니다.
- source_word: διακρατοῦσιν
