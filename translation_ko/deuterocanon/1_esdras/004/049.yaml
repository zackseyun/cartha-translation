base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/049.yaml
  text: And he wrote to all the Jews who were going up from the kingdom to Judea concerning freedom[a], that no official or satrap or toparch or steward should come to their doors[c][b],
  footnotes:
  - marker: a
    text: Or 'every authority' or 'every powerful man'; the Greek phrase πάντα δυνατὸν is difficult and may refer generally to anyone holding power.
    reason: lexical_alternative
  - marker: b
    text: '''Toparch'' refers to a local district ruler; alternatively, ''local governor.'''
    reason: cultural_note
  - marker: c
    text: The clause 'should not come against their doors' likely means they were not to intrude on them or press claims against them at their homes.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 왕국에서 유대아로 올라가는 모든 유대인들에게, 자유에 관하여 기록했습니다. 곧 어떤 관리도, 사트라프도, 토파르크도, 청지기도 그들의 문으로 다가오지 못하게 하라는 것이었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: παντα δυνατὸν은 문자적으로 ‘모든 유력한 자’ 또는 ‘모든 권세 있는 자’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 토파르크는 지방 구역의 통치자를 가리키는 행정 용어로, ‘지방 통치자’라고 풀어 옮길 수도 있습니다.
    reason: cultural_note
  - marker: c
    text: ‘그들의 문으로 다가오지 못하게’는 집으로의 침입이나 압박, 청구를 하지 못하게 하라는 뜻일 가능성이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψεν
  english_pob_choice: he wrote
  chosen_korean: 기록했습니다
  alternatives_korean:
  - 썼습니다
  - 공문으로 보냈습니다
  lexicon: LSJ
  rationale: 본문은 왕의 행정 문맥이지만 동사는 단순히 ‘쓰다’이므로, 절차적 뉘앙스를 살리면서도 과잉 해석을 피하는 ‘기록했습니다’를 택했습니다.
- source_word: τοῖς ἀναβαίνουσιν ἀπὸ τῆς βασιλείας εἰς τὴν Ἰουδαίαν
  english_pob_choice: who were going up from the kingdom to Judea
  chosen_korean: 왕국에서 유대아로 올라가는
  alternatives_korean:
  - 왕국에서 유대아로 돌아가는
  - 제국에서 유대아로 올라가는
  lexicon: LSJ
  rationale: ἀναβαίνω의 문자적 의미인 ‘올라가다’를 살려 지리적·예루살렘 향행의 뉘앙스를 유지했습니다.
- source_word: ὑπὲρ τῆς ἐλευθερίας
  english_pob_choice: concerning freedom
  chosen_korean: 자유에 관하여
  alternatives_korean:
  - 자유를 위하여
  - 자유에 대해
  lexicon: LSJ
  rationale: 여기서 ὑπέρ는 서신의 내용 표지로서 ‘관하여/대하여’가 가장 자연스럽고, ἐλευθερία는 문자대로 ‘자유’로 옮겼습니다.
- source_word: πάντα δυνατὸν καὶ σατράπην καὶ τοπάρχην καὶ οἰκονόμον
  english_pob_choice: every official or satrap or toparch or steward
  chosen_korean: 어떤 관리도, 사트라프도, 토파르크도, 청지기도
  alternatives_korean:
  - 모든 권세자도, 사트라프도, 토파르크도, 청지기도
  - 어떤 권력자도, 사트라프도, 토파르크도, 청지기도
  lexicon: LSJ
  rationale: πάντα δυνατὸν은 문자적으로는 ‘모든 유력한 자/권세 있는 자’이지만, 문맥상 행정관료를 가리키는 흐름이므로 ‘어떤 관리도’로 처리했고, 나머지 직함은 기술용어 성격을 살려 음역하거나 관용역으로 옮겼습니다.
- source_word: μὴ ἐπελεύσεσθαι ἐπὶ τὰς θύρας αὐτῶν
  english_pob_choice: should come to their doors
  chosen_korean: 그들의 문으로 다가오지 못하게 하라는
  alternatives_korean:
  - 그들의 문에 이르지 못하게 하라는
  - 그들의 집 문을 침범하지 못하게 하라는
  lexicon: LSJ
  rationale: ἐπελεύσεσθαι ἐπὶ τὰς θύρας는 단순 접근보다 침입·압박의 함의를 가질 수 있어, ‘문으로 다가오다’에 부정 명령을 더해 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 행정 금지문의 표현 방식
  chosen_reading: ‘…다가오지 못하게 하라’로 옮겨, 단순 접근 금지인지 주거 침입·청구 금지인지의 긴장을 그대로 남겼습니다.
  alternative_readings:
  - ‘그들의 문에 오지 못하게 하라’
  - ‘그들의 집을 침범하지 못하게 하라’
  rationale: 그리스어 ἐπὶ τὰς θύρας αὐτῶν은 문자상 ‘그들의 문 위로/앞으로’이지만, 실제 의미는 집에 대한 간섭 금지일 수 있어 과도하게 특정하지 않았습니다.
