  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ἔγραψεν은 수신자에게 ‘썼다’라는 뜻이므로 ‘기록했습니다’보다 ‘썼습니다’가 직접적이며, 원문의 부정적 미래부정사(‘오지 못하게/오지 않도록’)를 한 문장 안에서 더 분명히 연결하는 편이 좋습니다. ἐπελεύσεσθαι ἐπὶ τὰς θύρας αὐτῶν의 정확한 관용적 함의는 불확실하므로, 본문에서는 ‘문에 오지 못하도록’으로 절제해 옮기고 각주에서 침입·압박 가능성을 밝혔습니다.
  naturalness: 초안의 ‘자유에 관하여 기록했습니다. 곧 … 하라는 것이었습니다’는 한국어 문장 연결이 다소 우회적입니다. ‘…자유에 관하여 썼습니다. 곧 … 오지 못하도록 한 것이었습니다’로 고치면 현대 표준어 합쇼체에서 자연스럽고, 서신 내용이라는 구조도 분명해집니다. ‘어떤 관리도’보다 ‘아무 관리나’가 뒤따르는 부정과 자연스럽게 호응합니다.
