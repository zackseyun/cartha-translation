base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/046.yaml
  text: 'And now this is what I ask[a], lord king, and what I request from you, and this is the greatness that comes from you: therefore I beg that you fulfill the vow which I vowed to the King of heaven to accomplish by your mouth.'
  footnotes:
  - marker: a
    text: Literally, 'to do from your mouth'—that is, to carry it out by your spoken decree or command.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이제, 주 왕이여, 이것이 제가 간구하는 바이며, 또한 제가 주께 요청하는 바입니다. 이것이 주께서 베푸시는 위대함입니다. 그러므로 저는 왕의 입을 통해 이루겠다고 제가 서원한 서원을 하늘의 왕께서 이루시도록 해 주시기를 간청합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘당신의 입으로부터’로, 왕의 구두 명령이나 칙령을 통해 이루라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀξιῶ / αἰτοῦμαί
  english_pob_choice: I ask / I request
  chosen_korean: 간구하다 / 요청하다
  alternatives_korean:
  - 구하다
  - 청하다
  - 청원하다
  lexicon: LSJ
  rationale: 두 동사를 서로 다르게 살려, 동일한 청원을 반복하는 수사적 병렬을 유지했습니다. 전자는 더 강한 청원인 ‘간구하다’, 후자는 공손한 ‘요청하다’로 구분했습니다.
- source_word: κύριε βασιλεῦ
  english_pob_choice: lord king
  chosen_korean: 주 왕이여
  alternatives_korean:
  - 주군 왕이여
  - 왕이시여
  lexicon: LSJ
  rationale: 인간 왕을 향한 존칭을 살리되, 신적 호칭과 혼동되지 않도록 ‘주’를 소문자적 기능의 존칭으로 옮기고 호격을 자연스럽게 처리했습니다.
- source_word: μεγαλωσύνη ἡ παρὰ σοῦ
  english_pob_choice: the greatness that comes from you
  chosen_korean: 주께서 베푸시는 위대함
  alternatives_korean:
  - 주께로부터 오는 위대함
  - 주께서 주시는 عظ대함
  lexicon: LSJ
  rationale: 직역의 ‘위대함’을 유지하되, ‘from you’의 출처 의미를 한국어에서는 ‘베푸시는’으로 풀어 왕의 호의가 주어에서 비롯됨을 드러냈습니다.
- source_word: ποιήσῃς τὴν εὐχήν ἣν ηὔξω
  english_pob_choice: you fulfill the vow which I vowed
  chosen_korean: 이루시도록 해 주시기를 간청합니다
  alternatives_korean:
  - 서원을 이루시기를 간청합니다
  - 서원하신 것을 행해 주시기를 간청합니다
  lexicon: LSJ
  rationale: εὐχή를 여기서는 ἣν ηὔξω와의 결합에 따라 ‘서원’으로 이해해야 하므로, ‘이루다’로 동사를 살려 서원을 실행하는 뜻을 전달했습니다.
- source_word: ἐκ στόματός σου
  english_pob_choice: by your mouth
  chosen_korean: 왕의 입을 통해
  alternatives_korean:
  - 왕의 입으로
  - 왕의 말씀으로
  lexicon: LSJ
  rationale: ‘from your mouth’의 비유적 표현을 보존하면서도 한국어에서 자연스러운 수단 표현으로 옮겨, 왕의 공식적 구두 명령을 뜻하게 했습니다.
theological_decisions:
- issue: τῷ βασιλεῖ τοῦ οὐρανοῦ의 대상
  chosen_reading: ‘하늘의 왕’은 하나님을 가리키며, 앞의 인간 왕 호칭과 구별했습니다.
  alternative_readings:
  - ‘하늘의 왕’이 추상적 존칭이라는 읽기
  - 인간 왕을 높이는 표현으로 축소하는 읽기
  rationale: 본문은 지상의 왕에게 말하면서 동시에 이미 하나님께 서원한 바를 언급하므로, 두 왕호를 구별해 번역해야 본문의 대조와 신학적 긴장이 유지됩니다.
  doctrine_reference: 'DOCTRINE.md: preserve referent distinction; translate divine titles transparently'
