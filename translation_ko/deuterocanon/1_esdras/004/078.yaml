  yaml_path: translation/deuterocanon/1_esdras/004/078.yaml
  text: And to all who guarded the city[b][a], he wrote to give them allotments and wages.
  footnotes:
  - marker: a
    text: Or 'lots' or 'shares' for 'allotments' (κλήρους). The Greek may refer to portions assigned to them, possibly by lot.
    reason: lexical_alternative
  - marker: b
    text: Or 'pay' or 'rations' for 'wages' (ὀψώνια). The term can denote provisions or compensation for service.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 그 도시를 지키는 모든 사람에게 몫[a]과 급료[b]를 주라고 썼습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘몫’으로 번역한 그리스어 κλήρους는 ‘제비’ 또는 제비로 정해진 몫, 할당분을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘급료’로 번역한 그리스어 ὀψώνια는 복무에 대한 보수이며, 문맥에 따라 식량 지급을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: φρουροῦσι
  english_pob_choice: guarded
  chosen_korean: 지키는
  alternatives_korean:
  - 경계하는
  - 보초 서는
  lexicon: LSJ
  rationale: φρουρέω는 성이나 도시를 지키며 경계하는 뜻이므로, 군사·치안 맥락에 자연스러운 ‘지키는’으로 옮겼습니다.
- source_word: πόλιν
  english_pob_choice: city
  chosen_korean: 성
  alternatives_korean:
  - 도시
  - 읍
  lexicon: LSJ
  rationale: πόλις의 기본뜻은 ‘도시’이지만, 여기서는 성을 경비하는 문맥이어서 한국어에서 더 구체적인 ‘성’이 자연스럽습니다.
- source_word: κλήρους
  english_pob_choice: allotments
  chosen_korean: 몫
  alternatives_korean:
  - 할당분
  - 분배분
  - 몫
  lexicon: LSJ
  rationale: κλῆρος는 ‘제비’뿐 아니라 분배된 몫, 할당분을 뜻할 수 있으므로, 문맥상 ‘몫’으로 넓게 살렸습니다.
- source_word: ὀψώνια
  english_pob_choice: wages
  chosen_korean: 삯
  alternatives_korean:
  - 품삯
  - 급료
  - 급여
  lexicon: LSJ
  rationale: ὀψώνια는 보수나 급료를 가리키며, 성을 지키는 이들에게 주는 보수라는 점을 살려 ‘삯’으로 옮겼습니다.
