lexical_decisions:
- source_word: ἀπενοήθησαν ταῖς ἰδίαις διανοίαις
  english_pob_choice: were driven out of their own minds
  chosen_korean: 자기 생각에서 벗어나게 되었고
  alternatives_korean:
  - 제정신을 잃었고
  - 자기 판단이 무너졌고
  - 자기 이해에서 벗어났고
  lexicon: LSJ
  rationale: 문맥상 임상적 ‘광기’보다 판단력과 분별의 붕괴를 가리키므로, ‘생각에서 벗어나게 되다’로 옮겨 원문의 인지적 전도와 POB의 신중한 어조를 살렸습니다.
- source_word: διὰ τὰς γυναῖκας
  english_pob_choice: because of women
  chosen_korean: 여자들 때문에
  alternatives_korean:
  - 여자들로 말미암아
  - 여자들 때문에
  - 여자들로 인해
  lexicon: LSJ
  rationale: διά+대격의 인과를 가장 직접적으로 드러내는 표현으로 옮겼습니다.
- source_word: δοῦλοι ἐγένοντο
  english_pob_choice: became slaves
  chosen_korean: 노예가 되었습니다
  alternatives_korean:
  - 종이 되었습니다
  - 종살이가 되었습니다
  - 노예로 전락했습니다
  lexicon: LSJ
  rationale: δοῦλος는 여기서 사회적 예속 상태가 분명하므로, 프로젝트 기준에 따라 완곡한 ‘종’보다 ‘노예’가 원문의 강도를 더 정확히 드러냅니다.
- source_word: διʼ αὐτάς
  english_pob_choice: because of them
  chosen_korean: 그들 때문에
  alternatives_korean:
  - 그들로 인해
  - 그들 때문에
  - 그 여자들 때문에
  lexicon: LSJ
  rationale: 앞의 여자들을 가리키는 대명사를 한국어에서도 자연스럽게 연결해 인과를 반복했습니다.
theological_decisions:
- issue: ‘자기 생각’이 가리키는 정신적 붕괴의 범위
  chosen_reading: 원문은 단순한 감정적 동요가 아니라 분별력과 판단력의 붕괴를 말하므로, 과도한 병리화 없이 인지적 전도 상태로 표현했습니다.
  alternative_readings:
  - 제정신을 잃었습니다
  - 미쳤습니다
  rationale: POB 영어가 임상적 ‘madness’보다 분별 상실을 강조하므로, 한국어도 같은 긴장을 유지해야 합니다.
