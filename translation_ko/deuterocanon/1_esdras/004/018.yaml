  source_fidelity: 그리스어는 왕과 고아, 노예와 자유인, 가난한 사람과 부자라는 세 대조쌍의 διάνοια를 μίαν(하나)로 만든다고 말합니다. 초안도 기본 의미는 전달하지만, 둘째 대조쌍에는 ‘마음’에 해당하는 표현이 생략되어 평행 구조가 다소 불균등하며, οἰκέτης와 ἐλεύθερος의 신분 대조에는 ‘종’보다 ‘노예’가 더 정확합니다.
  naturalness: ‘왕과 고아의 마음’은 소유 관계처럼도 들릴 수 있고, 첫째와 셋째 쌍에만 ‘마음’을 명시한 현재 문장은 병렬성이 약합니다. 각 대조쌍을 직접 나열하고 ‘생각을 하나로 만듭니다’로 마무리하면 현대 표준 한국어 합쇼체로 자연스럽고 간결합니다. 기존 각주는 서술어 없이 끝나 문장 구조가 완결되지 않습니다.
  terminology: διάνοια는 여기서 감정적 ‘마음’보다는 생각·판단·성향을 가리키므로 ‘생각’이 안전합니다. οἰκέτης는 ἐλεύθερος와 대조되어 있으므로 ‘노예’로 옮기는 것이 신분 대조를 보존합니다. ‘자유인’, ‘고아’, ‘가난한 사람’, ‘부자’는 적절합니다.
