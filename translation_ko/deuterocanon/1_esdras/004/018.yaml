translation:
  language: ko
  text: 그것은 왕과 고아의 마음을 하나로 만들며, 종과 자유인, 가난한 사람과 부자의 마음도 하나로 만듭니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 자연스럽게는 ‘왕과 고아를 같은 생각을 하게 하며, 종과 자유인, 가난한 사람과 부자를’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖ τὴν διάνοιαν μίαν
  english_pob_choice: makes the mind ... one
  chosen_korean: 마음을 하나로 만들며
  alternatives_korean:
  - 생각을 같게 하며
  - 의식을 하나로 만들며
  - 마음을 같게 하며
  lexicon: LSJ
  rationale: διάνοια는 마음, 생각, 판단을 가리킬 수 있으므로, 본문이 말하는 ‘한 마음’의 효과를 자연스럽게 살려 ‘마음을 하나로 만들다’로 옮겼습니다.
- source_word: ὀρφανοῦ
  english_pob_choice: orphan
  chosen_korean: 고아
  alternatives_korean:
  - 부모 없는 아이
  - 부친 없는 자
  lexicon: LSJ
  rationale: 현대 한국어에서 가장 직접적이고 자연스러운 대응어는 ‘고아’이며, 사회적 대비를 분명히 드러냅니다.
- source_word: οἰκέτου
  english_pob_choice: slave
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 집안일꾼
  - 하인
  lexicon: LSJ
  rationale: POB 영어가 여기서 slavery의 신분 대비를 살리지만, 한국어 본문에서는 본문의 시대적 어감을 유지하면서도 문맥상 대비를 충분히 드러내는 기본어 ‘종’을 택했습니다.
- source_word: ἐλευθέρου
  english_pob_choice: free
  chosen_korean: 자유인
  alternatives_korean:
  - 자유한 사람
  - 자유로운 자
  lexicon: LSJ
  rationale: ‘free’의 신분적 대조를 살리기 위해 단순한 ‘자유’보다 사람을 가리키는 ‘자유인’이 문맥상 더 정확합니다.
- source_word: πένητος ... πλουσίου
  english_pob_choice: poor ... rich
  chosen_korean: 가난한 사람과 부자
  alternatives_korean:
  - 빈곤한 사람과 부유한 사람
  - 가난한 자와 부유한 자
  lexicon: LSJ
  rationale: 대조쌍의 평행성을 유지하면서도 현대 한국어에서 가장 자연스러운 사회경제적 대비로 옮겼습니다.
theological_decisions:
- issue: 본문은 신분이 다른 사람들을 동일한 판단/성향으로 만드는 효과를 말하며, 그 작동 방식은 설명하지 않습니다.
  chosen_reading: 설명 없이 평행 대조 자체를 살려 번역했습니다.
  alternative_readings:
  - 더 풀어서 ‘같은 생각을 하게 하며’로 옮김
  - 원인을 암시해 ‘하나로 일치시키며’로 강화함
  rationale: 본문의 수사적 핵심은 왕, 고아, 종, 자유인, 가난한 사람, 부자를 가리지 않고 마음을 하나로 만든다는 점이므로, 해석을 덧붙이지 않고 직접성을 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
