  text: And he sat in the council chamber[a], and the letter was read before them. And he said, “Call the young men, and they will explain their words.” And they were called, and they entered.
  footnotes:
  - marker: a
    text: Or “tribunal” or “courtroom” for the place named by χρηματιστήριον; the exact institutional nuance is not fully transparent from the word alone, though it clearly denotes an official place of hearing or deliberation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 심문실에 앉았고, 그 편지가 그들 앞에서 낭독되었습니다. 그러고는 이렇게 말했습니다. “젊은이들을 부르십시오. 그러면 그들이 자기들의 말을 설명할 것입니다.” 그래서 그들이 불렸고, 들어갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: χρηματιστήριον은 단어 자체만으로 제도적 뉘앙스를 완전히 특정하기 어려워, 본문에서는 기능상 ‘심문실’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματιστηρίῳ
  english_pob_choice: council chamber
  chosen_korean: 심문실
  alternatives_korean:
  - 재판정
  - 법정
  - 회의실
  lexicon: LSJ
  rationale: 이 단어는 공식적인 심리·협의 장소를 가리키므로, 현대 한국어에서 기능적으로 가장 가까운 ‘심문실’을 택해 장소의 사법적 성격을 살렸습니다.
- source_word: ἀνεγνώσθη
  english_pob_choice: was read
  chosen_korean: 낭독되었습니다
  alternatives_korean:
  - 읽혔습니다
  - 공개적으로 읽혔습니다
  lexicon: LSJ
  rationale: 공적 자리에서 서면 문서가 소리 내어 읽히는 장면이므로, 단순한 ‘읽혔습니다’보다 ‘낭독되었습니다’가 장면의 성격을 더 잘 드러냅니다.
- source_word: νεανίσκους
  english_pob_choice: young men
  chosen_korean: 젊은이들
  alternatives_korean:
  - 청년들
  - 젊은 남자들
  lexicon: LSJ
  rationale: 세 명의 남성 참가자를 가리키지만 한국어에서는 자연스럽고 간결하게 들리는 ‘젊은이들’을 사용했습니다. 문맥상 남성성이 분명하므로 추가 표지는 생략했습니다.
- source_word: δηλώσουσιν τοὺς λόγους αὐτῶν
  english_pob_choice: will explain their words
  chosen_korean: 자기들의 말을 설명할 것입니다
  alternatives_korean:
  - 자기들의 말을 밝힐 것입니다
  - 자기들의 말을 해명할 것입니다
  lexicon: LSJ
  rationale: δηλόω의 핵심은 ‘분명히 하다/설명하다’이므로, 문맥에 맞게 ‘설명할 것입니다’로 옮겨 그들이 쓴 내용을 풀어 말한다는 뜻을 살렸습니다.
