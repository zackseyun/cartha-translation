translation:
  language: ko
  text: 그리고 너는 유대인들이 불태운 그 성전을 다시 세우겠다고 맹세하였는데, 그것은 갈대아인들 때문에 유다 땅이 황폐해졌을 때였습니다.ᵃ[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 본문은 ‘유대인들이 불태운’이라고 되어 있습니다. 이는 더 익숙한 전승, 곧 성전이 갈대아인/바빌로니아인에 의해 불탔다는 서술과 다른 난해한 독법입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: εὔξω
  english_pob_choice: you vowed
  chosen_korean: 맹세하였는데
  alternatives_korean:
