  lexicon: LSJ
  rationale: 이미 무너진 성전을 전제로 하므로, ‘세우다’보다 복원 의미가 드러나는 ‘다시 세우다’가 원문의 복구 맥락을 잘 반영합니다.
- source_word: οἱ Ἰουδαῖοι
  english_pob_choice: the Judeans
  chosen_korean: 유대인들이
  alternatives_korean:
