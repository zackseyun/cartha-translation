translation:
  language: ko
  text: 또한 당신은 유다가 갈대아인들에 의해 황폐해졌을 때 유다인들이 불태운 그 성전을 다시 세우겠다고 서원하실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 ‘유다인들이 불태운’이라고 말합니다. 이는 성전이 갈대아인들 또는 바빌로니아인들에 의해 불탔다는 더 익숙한 서술과 다른 난해한 독법입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: εὔξω
  english_pob_choice: you vowed
  chosen_korean: 맹세하였는데
  alternatives_korean:
  - 약속하였는데
  - 서원하였는데
  - 기도하였는데
  lexicon: LSJ
  rationale: 여기서는 행동 계획을 두고 한 서원/맹세의 의미가 분명하므로, 단순한 ‘약속’보다 종교적·서약적 뉘앙스를 살린 ‘맹세하다’를 택했습니다.
- source_word: οἰκοδομῆσαι
  english_pob_choice: to rebuild
  chosen_korean: 다시 세우겠다고
  alternatives_korean:
  - 건축하겠다고
  - 세우겠다고
  lexicon: LSJ
  rationale: 이미 무너진 성전을 전제로 하므로, ‘세우다’보다 복원 의미가 드러나는 ‘다시 세우다’가 원문의 복구 맥락을 잘 반영합니다.
- source_word: οἱ Ἰουδαῖοι
  english_pob_choice: the Judeans
  chosen_korean: 유대인들이
  alternatives_korean:
  - 유대 사람들
  - 유다인들이
  lexicon: LSJ
  rationale: 이 절에서는 역사·지리적 집단 명칭보다 한국어에서 자연스럽게 읽히는 민족·지역 집단 표지로 옮기되, 본문 각주로 난해한 원문 주어를 드러냈습니다.
- source_word: ἐρημώθη
  english_pob_choice: was laid waste
  chosen_korean: 황폐해졌을 때
  alternatives_korean:
  - 폐허가 되었을 때
  - 황폐하게 되었을 때
  lexicon: LSJ
  rationale: 수동 완료의 파괴·황폐 상태를 간결하게 살리기 위해 ‘황폐해지다’를 사용했습니다.
theological_decisions:
- issue: 원문대로 유지한 난해한 주어 표현
  chosen_reading: ‘유대인들이 불태운 그 성전’이라는 원문 표현을 그대로 살렸습니다.
  alternative_readings:
  - 갈대아인들이 불태운 그 성전
  - 바빌로니아인들이 불태운 그 성전
  rationale: 더 익숙한 역사 서술로 조정하지 않고, 원문 증거가 가진 난해한 독법을 투명하게 보존해야 하므로 본문은 원형을 유지하고 각주로 설명했습니다.
  doctrine_reference: 원문 우선 원칙; 본문 비평적 난해독 존중
- issue: 갈대아인과 유다 땅 황폐화의 역사적 배경
  chosen_reading: 갈대아인들 때문에 유다 땅이 황폐해졌다고 옮겼습니다.
  alternative_readings:
  - 바빌로니아인들 때문에
  - 갈대아인들에 의해
  rationale: 원문이 Χαλδαίων을 직접 제시하므로, 전통적 바빌로니아인으로 바꾸지 않고 ‘갈대아인들’로 유지해 역사적·어휘적 층위를 보존했습니다.
  doctrine_reference: 원문 직접 대응; 역사적 명칭 보존
