  lexicon: LSJ
  rationale: 여기서는 행동 계획을 두고 한 서원/맹세의 의미가 분명하므로, 단순한 ‘약속’보다 종교적·서약적 뉘앙스를 살린 ‘맹세하다’를 택했습니다.
- source_word: οἰκοδομῆσαι
