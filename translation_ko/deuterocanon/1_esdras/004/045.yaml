  lexicon: LSJ
  rationale: 이 절에서는 역사·지리적 집단 명칭보다 한국어에서 자연스럽게 읽히는 민족·지역 집단 표지로 옮기되, 본문 각주로 난해한 원문 주어를 드러냈습니다.
- source_word: ἐρημώθη
  english_pob_choice: was laid waste
  chosen_korean: 황폐해졌을 때
  alternatives_korean:
