  lexicon: LSJ
  rationale: 본문의 비유적 표현을 살리기 위해 직역을 유지하되, 문맥상 성전을 가리킨다는 점은 주해로 남겨두는 편이 원문에 가깝습니다.
- source_word: Ἰερουσαλὴμ οἰκοδομηθῆναι
  english_pob_choice: Jerusalem built
  chosen_korean: 예루살렘이 세워질
  alternatives_korean:
