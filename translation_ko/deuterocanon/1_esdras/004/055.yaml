base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/055.yaml
  text: And he wrote that support should be given to the Levites until the day when the house would be completed and Jerusalem built[a][b][c][d].
  footnotes:
  - marker: a
    text: Or 'provision,' 'allowance,' or 'supply' for the Levites.
    reason: lexical_alternative
  - marker: b
    text: '''The house'' refers to the temple.'
    reason: cross_reference
  - marker: c
    text: Or 'Jerusalem rebuilt.' The Greek says simply 'built,' though the context is restoration.
    reason: lexical_alternative
  - marker: d
    text: The Greek wording after 'until the day' is somewhat awkward in transmission, but the sense is that the support was to continue until the temple was completed and Jerusalem built.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 그는 레위 사람들에게 그 집이 완성되고 예루살렘이 세워질 때까지 지원을 주도록 기록했습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 χορηγία는 레위 사람들에게 계속 제공되는 물질적 지원, 곧 공급·부양·배급을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '''그 집''은 성전을 가리킵니다.'
    reason: cross_reference
  - marker: c
    text: 그리스어는 단순히 '세워지다'에 해당하며, 문맥상 '재건되다'로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: '''그때까지'' 뒤의 그리스어 표현은 전승상 다소 어색하지만, 뜻은 성전이 완성되고 예루살렘이 세워질 때까지 지원이 계속되어야 한다는 것입니다.'
    reason: textual_variant
lexical_decisions:
- source_word: ἔγραψεν
  english_pob_choice: he wrote that
  chosen_korean: 기록했습니다
  alternatives_korean:
  - 서면으로 명령했습니다
  - 편지를 써서 지시했습니다
  lexicon: LSJ
  rationale: 왕의 공식적 문서 행위를 자연스러운 현대 한국어로 옮기되, 내용 자체가 명령임을 과잉설명하지 않기 위해 '기록했습니다'를 택했습니다.
- source_word: δοῦναι τὴν χορηγίαν
  english_pob_choice: support should be given
  chosen_korean: 지원을 주도록
  alternatives_korean:
  - 공급을 주도록
  - 부양을 주도록
  - 보급을 주도록
  lexicon: LSJ
  rationale: χορηγία는 지속적 제공·유지의 의미가 있어, 현대어로는 '지원'이 가장 넓고 자연스럽게 재정적·물질적 공급을 담아냅니다.
- source_word: τοῖς Λευείταις
  english_pob_choice: to the Levites
  chosen_korean: 레위 사람들에게
  alternatives_korean:
  - 레위인들에게
  - 레위 사람들에게
  lexicon: LSJ
  rationale: 고유 집단명은 한국어 성경에서 널리 통용되는 '레위 사람들'을 사용해 독자가 즉시 인식하도록 했습니다.
- source_word: ὁ οἶκος
  english_pob_choice: the house
  chosen_korean: 그 집
  alternatives_korean:
  - 성전
  - 그 집
  lexicon: LSJ
  rationale: 본문의 비유적 표현을 살리기 위해 직역을 유지하되, 문맥상 성전을 가리킨다는 점은 주해로 남겨두는 편이 원문에 가깝습니다.
- source_word: Ἰερουσαλὴμ οἰκοδομηθῆναι
  english_pob_choice: Jerusalem built
  chosen_korean: 예루살렘이 세워질
  alternatives_korean:
  - 예루살렘이 재건될
  - 예루살렘이 건축될
  lexicon: LSJ
  rationale: 그리스어는 단순히 '세워지다/지어지다'에 해당하므로, 복원 맥락은 유지하되 원문의 동사를 과도하게 풀지 않았습니다.
theological_decisions:
- issue: ὁ οἶκος의 지시 대상
  chosen_reading: '''그 집''은 성전을 가리키는 문맥적 표현으로 유지합니다.'
  alternative_readings:
  - 본문에서 곧바로 '성전'으로 풀어 옮김
  - '''집''을 일반 건물로 이해'
  rationale: 에스라·에스드라 전승의 복원 문맥에서 '집'은 관용적으로 성전을 뜻하므로, 원문 이미지를 보존하면서 의미는 문맥으로 해석하도록 했습니다.
  doctrine_reference: 번역 철학 §1, §5
- issue: ἀναστήσεται/οἰκοδομηθῆναι에 해당하는 복원 뉘앙스
  chosen_reading: 예루살렘이 '세워질'로 옮겨 복원 맥락을 암시합니다.
  alternative_readings:
  - 예루살렘이 '지어질'
  - 예루살렘이 '재건될'
  rationale: 원문은 단순히 'built'에 해당하므로 본문에서는 중립적으로 처리하고, 재건 의미는 전체 문맥이 뒷받침합니다.
  doctrine_reference: 번역 철학 §1, §5
