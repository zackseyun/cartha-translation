    rationale: οἰκοδομηθῆναι는 ‘지어지다/건축되다’로 설명하는 것이 적절합니다.
  revised_text: 그리고 그는 레위 사람들에게 지원이 제공되도록 썼습니다. 그 집이 완성되고 예루살렘이 지어질 때까지였습니다.[a][b][c][d]
