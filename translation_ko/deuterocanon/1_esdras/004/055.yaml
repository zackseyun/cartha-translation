  - 예루살렘이 건축될
  lexicon: LSJ
  rationale: 그리스어는 단순히 '세워지다/지어지다'에 해당하므로, 복원 맥락은 유지하되 원문의 동사를 과도하게 풀지 않았습니다.
theological_decisions:
- issue: ὁ οἶκος의 지시 대상
  chosen_reading: '''그 집''은 성전을 가리키는 문맥적 표현으로 유지합니다.'
  alternative_readings:
  - 본문에서 곧바로 '성전'으로 풀어 옮김
  - '''집''을 일반 건물로 이해'
  rationale: 에스라·에스드라 전승의 복원 문맥에서 '집'은 관용적으로 성전을 뜻하므로, 원문 이미지를 보존하면서 의미는 문맥으로 해석하도록 했습니다.
  doctrine_reference: 번역 철학 §1, §5
- issue: ἀναστήσεται/οἰκοδομηθῆναι에 해당하는 복원 뉘앙스
  chosen_reading: 예루살렘이 '세워질'로 옮겨 복원 맥락을 암시합니다.
  alternative_readings:
  - 예루살렘이 '지어질'
  - 예루살렘이 '재건될'
  rationale: 원문은 단순히 'built'에 해당하므로 본문에서는 중립적으로 처리하고, 재건 의미는 전체 문맥이 뒷받침합니다.
  doctrine_reference: 번역 철학 §1, §5
