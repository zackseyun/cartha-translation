base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/055.yaml
  text: And he wrote that support should be given to the Levites until the day when the house would be completed and Jerusalem built[a][b][c][d].
  footnotes:
  - marker: a
    text: Or 'provision,' 'allowance,' or 'supply' for the Levites.
    reason: lexical_alternative
  - marker: b
    text: '''The house'' refers to the temple.'
    reason: cross_reference
  - marker: c
    text: Or 'Jerusalem rebuilt.' The Greek says simply 'built,' though the context is restoration.
    reason: lexical_alternative
  - marker: d
    text: The Greek wording after 'until the day' is somewhat awkward in transmission, but the sense is that the support was to continue until the temple was completed and Jerusalem built.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 그는 레위 사람들에게 지원이 제공되도록 썼습니다. 그 집이 완성되고 예루살렘이 지어질 때까지였습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 χορηγία는 레위 사람들에게 계속 제공되는 물질적 지원, 곧 공급·부양·배급을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 집’은 성전을 가리킵니다.
    reason: cross_reference
  - marker: c
    text: 그리스어는 단순히 ‘지어지다’에 해당하며, 문맥상 ‘재건되다’로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘그 날까지’ 뒤의 그리스어 표현은 전승상 다소 어색하지만, 뜻은 성전이 완성되고 예루살렘이 지어질 때까지 지원이 계속 제공되어야 한다는 것입니다.
    reason: textual_variant
