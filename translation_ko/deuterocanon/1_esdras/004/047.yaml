  - 몸을 일으켜
  lexicon: LSJ
  rationale: 왕이 앉은 자리에서 몸을 일으키는 동작을 자연스럽고 간결하게 살리되, 과장된 뉘앙스는 피했습니다.
- source_word: κατεφίλησεν
