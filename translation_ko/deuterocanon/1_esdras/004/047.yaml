  - 몸을 일으켜
  lexicon: LSJ
  rationale: 왕이 앉은 자리에서 몸을 일으키는 동작을 자연스럽고 간결하게 살리되, 과장된 뉘앙스는 피했습니다.
- source_word: κατεφίλησεν
  english_pob_choice: kissed
  chosen_korean: 입을 맞추고
  alternatives_korean:
  - 키스하고
  - 따뜻하게 입을 맞추고
  lexicon: LSJ
  rationale: 단순한 '입을 맞추다'가 행위 자체를 가장 직접적으로 옮기며, 감정의 정도는 원문 이상으로 풀지 않았습니다.
- source_word: οἰκονόμους
  english_pob_choice: treasurers
  chosen_korean: 재정 관리관들
  alternatives_korean:
  - 청지기들
  - 재무관들
  lexicon: LSJ
  rationale: 행정·재정 목록의 문맥상 가정적 의미의 '청지기'보다 국가 재정 담당 관직을 드러내는 표현이 더 적절합니다.
- source_word: τοπάρχας καὶ στρατηγοὺς καὶ σατράπας
  english_pob_choice: regional governors and generals and satraps
  chosen_korean: 지역 총독들과 군 지휘관들과 사트라프들
  alternatives_korean:
  - 지방 통치자들과 장군들과 총독들
  - 지역 관료들과 장군들과 총독들
  lexicon: LSJ
  rationale: 세 관직을 각각 구분해 옮겨, 원문이 제시하는 제국 행정·군사 계층 구조를 흐리지 않았습니다.
- source_word: οἰκοδομῆσαι
  english_pob_choice: to build
  chosen_korean: 건축하러
  alternatives_korean:
  - 짓기 위해
  - 건설하기 위해
  lexicon: LSJ
  rationale: 원문이 단순히 'build'를 쓰므로 '재건하다'를 덧붙이지 않고, 예루살렘을 세우는 행위를 자연스러운 목적구로 살렸습니다.
theological_decisions:
- issue: 예루살렘 건축 동사의 범위
  chosen_reading: 원문 그대로 '건축하다'로 두어 '재건하다'를 명시하지 않았습니다.
  alternative_readings:
  - 재건하다
  - 다시 세우다
  rationale: 본문의 그리스어는 단순히 οἰκοδομῆσαι('짓다/건축하다')이며, POB의 감사 주석도 이 지점을 보존합니다. 문맥상 복구를 떠올릴 수 있어도 본문 수준에서는 확장하지 않았습니다.
  doctrine_reference: 본문충실성 / 역사서 서술의 어휘 보존
