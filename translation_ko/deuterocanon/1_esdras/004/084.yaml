  yaml_path: translation/deuterocanon/1_esdras/004/084.yaml
  text: and they blessed the God of their fathers[a], because he had given them relief and release.
  footnotes:
  - marker: a
    text: Or 'rest and freedom.' The Greek terms can denote easing from distress and release/liberation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 자기 조상들의 하나님을 찬송했는데, 그분께서 그들에게 안식과 해방을 주셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘안식과 자유’. 헬라어 두 단어는 고통의 완화와 석방/해방을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλόγησαν
  english_pob_choice: blessed
  chosen_korean: 찬송했습니다
  alternatives_korean:
  - 복을 빌었습니다
  - 축복했습니다
  lexicon: LEH
  rationale: 하나님을 대상으로 하는 εὐλόγησαν은 한국어 성경 문맥에서 단순한 ‘축복하다’보다 ‘찬송하다’가 더 자연스럽고, 하나님께 영광을 돌리는 행위를 분명하게 드러냅니다.
- source_word: τὸν θεὸν τῶν πατέρων αὐτῶν
  english_pob_choice: the God of their fathers
  chosen_korean: 자기 조상들의 하나님
  alternatives_korean:
  - 그들의 조상들의 하나님
  - 선조들의 하나님
  lexicon: LEH
  rationale: ‘조상들의 하나님’이라는 언약적·역사적 연속성을 살리되, 현대 한국어에서 자연스럽게 읽히도록 ‘자기’를 보탰습니다.
- source_word: ἄνεσιν
  english_pob_choice: relief
  chosen_korean: 안식
  alternatives_korean:
  - 완화
  - 휴식
  - 편안함
  lexicon: LEH
  rationale: ἄνεσις는 압박이나 고통이 가벼워지는 뜻이므로, POB의 ‘relief’에 대응해 문맥상 더 포괄적인 ‘안식’을 택했습니다. 다만 주된 의미는 여전히 짐이 풀린 상태입니다.
- source_word: ἄφεσιν
  english_pob_choice: release
  chosen_korean: 해방
  alternatives_korean:
  - 석방
  - 자유
  - 면제
  lexicon: LEH
  rationale: 이 절은 죄 사함보다 역사적 구출과 억압에서의 풀림을 말하므로, ‘release’에 대응하는 ‘해방’이 가장 직접적입니다.
theological_decisions:
- issue: ἄφεσις의 의미를 죄 사함으로 읽을지 여부
  chosen_reading: 역사적 구출과 억압에서의 해방으로 읽습니다
  alternative_readings:
  - 죄 사함
  - 용서
  - 영적 자유
  rationale: 문맥이 제의적 속죄가 아니라 조상들의 하나님께서 베푸신 현실적 구원과 휴식을 말하므로, 신학적 확장을 피하고 본문이 말하는 범위 안에서 번역했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
