base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/034.yaml
  text: Men[a], are not women strong? Great is the earth, and high is heaven, and swift in its course is the sun[b], because it turns in the circle of heaven and again runs back to its own place in one day.
  footnotes:
  - marker: a
    text: Or 'swift in its race'; the Greek phrase pictures the sun as moving rapidly along its course.
    reason: lexical_alternative
  - marker: b
    text: The verse uses ordinary observational language about the sun's daily movement across the sky.
    reason: cultural_note
translation:
  language: ko
  text: 남자들이여, 여자가 강하지 않습니까? 땅은 크고 하늘은 높으며, 해는 그 진행에 있어 빠릅니다. 그것은 하늘의 원을 돌고, 다시 자기 자리로 하루 만에 달려 돌아갑니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 달리는 속도에 있어 빠르다’. 그리스어 표현은 해가 자신의 진행로를 매우 빠르게 움직이는 모습을 그립니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절은 해의 하루 운행을 일상적인 관찰 언어로 말합니다.
    reason: cultural_note
lexical_decisions:
- source_word: Ἄνδρες
  english_pob_choice: Men
  chosen_korean: 남자들이여
  alternatives_korean:
  - 사람들이여
  - 남성들이여
  lexicon: LSJ
  rationale: 직접적인 호격 복수 호칭을 살리면서, 일반적인 군중 호칭보다 성별 표지를 분명히 드러내는 표현을 택했습니다.
- source_word: ἰσχυραὶ
  english_pob_choice: strong
  chosen_korean: 강하지 않습니까
  alternatives_korean:
  - 힘이 세지 않습니까
  - 강력하지 않습니까
  lexicon: LSJ
  rationale: 질문형 수사 구조를 유지하면서 δύναμις/strength의 기본 의미를 자연스러운 한국어로 옮겼습니다.
- source_word: ταχὺς τῷ δρόμῳ
  english_pob_choice: swift in its course
  chosen_korean: 그 진행에 있어 빠릅니다
  alternatives_korean:
  - 그 달리는 길에서 빠릅니다
  - 그 운행이 빠릅니다
  lexicon: LSJ
  rationale: dative phrase의 관용적 기능을 살려 ‘course’를 단순 속도가 아니라 진행/운행의 흐름으로 표현했습니다.
- source_word: στρέφεται ἐν τῷ κύκλῳ τοῦ οὐρανοῦ καὶ πάλιν ἀποτρέχει
  english_pob_choice: it turns in the circle of heaven and again runs back
  chosen_korean: 하늘의 원을 돌고, 다시 자기 자리로 하루 만에 달려 돌아갑니다
  alternatives_korean:
  - 하늘의 둘레를 돌고 다시 본래의 곳으로 돌아갑니다
  - 하늘의 원 안에서 돌다가 다시 제자리로 돌아갑니다
  lexicon: LSJ
  rationale: 천문 현상을 관찰 언어로 묘사한 본문의 이미지를 보존하기 위해 ‘돌다/달려 돌아가다’의 운동성을 살렸습니다.
