  chosen_reading: 현대 과학 용어로 교정하지 않고, 관찰 가능한 현상에 대한 고대의 서술을 그대로 유지했습니다.
  alternative_readings:
  - ‘지구의 자전으로 인해 보이는 것처럼’과 같이 현대 과학적으로 풀이함
  rationale: 본문은 해의 일주를 일상적 관찰 언어로 말하며, 번역이 이를 설명문으로 바꾸면 수사적 힘이 약해집니다.
  doctrine_reference: 번역 원칙 §1, §6
