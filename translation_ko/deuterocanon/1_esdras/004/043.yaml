  text: 그때 그가 왕에게 말했습니다. 「당신이 왕국을 받으신 날 예루살렘을 다시 세우기로 하신 서원을 기억하십시오」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신이 드린 기도’; 그리스어 명사 εὐχή는 ‘기도’도 뜻할 수 있으나, 여기서는 동족 동사와 문맥이 ‘서원’을 더 강하게 지지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνήσθητι
  english_pob_choice: Remember
  chosen_korean: 기억하십시오
  alternatives_korean:
  - 기억하소서
  - 기억하세요
  lexicon: BDAG
  rationale: 왕에게 직접 호소하는 명령형이므로, 합쇼체의 공손한 명령인 ‘기억하십시오’가 가장 자연스럽고 원문의 촉구를 살립니다.
- source_word: εὐχήν / ηὔξω
  english_pob_choice: vow
  chosen_korean: 서원
  alternatives_korean:
  - 기도
  - 약속
  lexicon: BDAG
  rationale: 동사 ηὔξω와 같은 어근이어서 단순한 기도보다 ‘서원’이 원문의 상호 연관을 더 분명히 드러냅니다.
- source_word: οἰκοδομῆσαι τὴν Ἰερουσαλήμ
  english_pob_choice: to rebuild Jerusalem
  chosen_korean: 예루살렘을 다시 세우기로
  alternatives_korean:
  - 예루살렘을 건축하기로
  - 예루살렘을 재건하기로
  lexicon: BDAG
  rationale: 예루살렘은 새로 짓는 것이 아니라 무너진 뒤 회복하는 대상이므로, ‘다시 세우다’가 역사적 뉘앙스를 잘 전달합니다.
- source_word: ἐν τῇ ἡμέρᾳ ᾗ τὸ βασίλειόν σου παρέλαβες
  english_pob_choice: on the day when you received your kingdom
  chosen_korean: 왕국을 받으신 날
  alternatives_korean:
  - 왕국을 받아들이신 날
  - 왕국을 얻으신 날
  lexicon: BDAG
  rationale: παρέλαβες는 왕권을 ‘받다’의 뜻이므로, ‘받으신 날’이 원문과 가장 가깝고 왕에게 드리는 존칭도 유지합니다.
theological_decisions:
- issue: εὐχή의 의미를 기도보다 서원으로 볼지 여부
  chosen_reading: 서원
  alternative_readings:
  - 기도
  - 간구
  rationale: 이 문맥에서는 같은 어근의 동사 ηὔξω가 ‘서원하다’의 의미로 분명히 작동하므로, 왕에게 상기시키는 책임 있는 약속의 성격을 살려야 합니다.
  doctrine_reference: 번역 원칙 §1, §5
