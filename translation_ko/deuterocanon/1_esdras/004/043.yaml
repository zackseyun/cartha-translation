  naturalness: ‘당신이 … 하신 서원’은 왕에게 직접 말하는 장면에서 현대 표준 한국어의 공손한 문체로는 다소 부자연스럽습니다. ‘왕께서’와 ‘…겠다고 하신 서원’을 사용하면 합쇼체와 왕에게 하는 직접 호소가 자연스럽게 살아납니다.
