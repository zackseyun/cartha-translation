  yaml_path: translation/deuterocanon/1_esdras/004/077.yaml
  text: And he wrote that support should be given to the Levites until the day when the house is completed and Jerusalem is built[a][b].
  footnotes:
  - marker: a
    text: Or 'the temple' for 'the house'; the Greek literally reads 'the house,' a common way of referring to the temple in this context.
    reason: lexical_alternative
  - marker: b
    text: Or 'Jerusalem is rebuilt.' The context is restoration, though the Greek verb itself simply says 'be built.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 집이 완공되고 예루살렘이 건축되는 날까지 레위인들에게 지원을 제공하라고 기록했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성전’. 그리스어는 문자적으로 ‘집’이라고 하며, 이 문맥에서는 성전을 가리키는 흔한 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘예루살렘이 재건되는 날까지’. 문맥은 회복을 가리키지만, 그리스어 동사 자체는 단순히 ‘건축되다’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς Λευείταις
  english_pob_choice: to the Levites
  chosen_korean: 레위인들에게
  alternatives_korean:
  - 레위 사람들에게
  - 레위 지파 사람들에게
  lexicon: LSJ
  rationale: 여격의 수혜 대상을 자연스럽게 드러내면서, 성경 문맥에서 익숙한 고유 명칭을 살렸습니다.
- source_word: τὴν χορηγίαν
  english_pob_choice: support
  chosen_korean: 지원을
  alternatives_korean:
  - 공급을
  - 부양을
  - 배급을
  lexicon: LSJ
  rationale: χoρηγία는 지속적인 물질적 제공을 가리키므로, 형태를 과도하게 특정하지 않는 ‘지원’을 택했습니다.
- source_word: ἔγραψεν δοῦναι
  english_pob_choice: he wrote that ... should be given
  chosen_korean: 기록했습니다
  alternatives_korean:
  - 써서 주도록 했습니다
  - 서면으로 명령했습니다
  lexicon: LSJ
  rationale: ‘기록하다’는 서면 지시의 성격을 보존하면서, 뒤따르는 부정사 절의 내용을 한국어에서 간결하게 풀어 줍니다.
- source_word: ὁ οἶκος
  english_pob_choice: the house
  chosen_korean: 집이
  alternatives_korean:
  - 성전이
  - 하나님의 집이
  lexicon: LSJ
  rationale: 본문의 직역인 ‘집’을 살리되, 이 문맥에서 성전을 가리키는 관용적 표현이라는 점을 유지했습니다.
theological_decisions:
- issue: Ἰερουσαλὴμ οἰκοδομηθῆναι의 상태를 ‘built’로 둘지 ‘rebuilt’로 둘지
  chosen_reading: ‘예루살렘이 건축될 때까지’로 옮겨, 재건의 문맥은 주석 없이 본문 흐름에서 드러나게 했습니다.
  alternative_readings:
  - 예루살렘이 재건될 때까지
  - 예루살렘이 다시 세워질 때까지
  rationale: 그리스어 동사 자체는 단순히 ‘세워지다/건축되다’를 뜻하므로, 재-의 의미를 본문에 덧붙이지 않고 문맥이 뒷받침하도록 두었습니다.
  doctrine_reference: restoration_context
