  - ‘집정관들’처럼 로마 직함으로 옮김
  rationale: 본문은 왕이 페르시아와 메디아의 고위층과 지방 행정가들을 공식 소집하는 장면이므로, 서로 다른 직책을 구분해 번역해야 본문의 정치적·행정적 긴장이 살아납니다.
