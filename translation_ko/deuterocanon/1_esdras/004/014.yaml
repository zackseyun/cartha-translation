base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/014.yaml
  text: And he sent out and summoned all the nobles of Persia and Media[a], and the satraps and generals and local rulers and governors[c][b],
  footnotes:
  - marker: a
    text: Or 'having sent out, he called'; the Greek participle may explicitly describe dispatching messengers before the summons was carried out.
    reason: lexical_alternative
  - marker: b
    text: '''Toparchs'' refers to rulers over local districts or regions.'
    reason: cultural_note
  - marker: c
    text: The final term can also be rendered 'chief officials' or, more literally in some contexts, 'consuls'; here it is rendered according to the Persian administrative setting rather than as a Roman title.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 사람을 보내어 페르시아와 메디아의 모든 귀족들과 사트라프들과 장군들과 지방 통치자들과 총독들을 불렀습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ἐξαποστείλας는 문자적으로는 ‘보내어’라는 선행 동작을 나타내며, 소집이 실제로 실행되기 전에 사자들을 먼저 파견한 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: τοπάρχας는 지방이나 구역을 다스리는 통치자들을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: ὑπάτους는 문맥에 따라 ‘총독들’ 또는 더 문자적으로는 ‘최고 관리들’로 옮길 수 있지만, 여기서는 페르시아 궁정의 행정 문맥에 맞추었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαποστείλας
  english_pob_choice: he sent out
  chosen_korean: 사람을 보내어
  alternatives_korean:
  - 보내어
  - 파견하여
  lexicon: LSJ
  rationale: 아오리스트 분사로서 ‘보내다/파견하다’의 선행 동작을 나타내므로, 왕이 소집을 위해 사람을 보냈다는 흐름을 자연스럽게 살렸습니다.
- source_word: ἐκάλεσεν
  english_pob_choice: summoned
  chosen_korean: 불렀습니다
  alternatives_korean:
  - 소집했습니다
  - 불러 모았습니다
  lexicon: LSJ
  rationale: 왕실 문맥의 공식적 소환을 나타내므로 단순한 ‘불렀다’보다 소집의 뉘앙스를 유지하되, 현대 한국어에서는 자연스러운 서술형으로 옮겼습니다.
- source_word: μεγιστᾶνας
  english_pob_choice: nobles
  chosen_korean: 귀족들
  alternatives_korean:
  - 대귀족들
  - 유력자들
  - 대신들
  lexicon: LSJ
  rationale: 고위 귀족층을 가리키는 말이므로, 현대 독자가 바로 이해할 수 있는 ‘귀족들’이 가장 적절합니다.
- source_word: σατράπας
  english_pob_choice: satraps
  chosen_korean: 사트라프들
  alternatives_korean:
  - 총독들
  - 지방장관들
  lexicon: LSJ
  rationale: 페르시아 행정직의 고유 명칭이므로 일반화하지 않고 음역을 유지해 역사적 배경을 보존했습니다.
- source_word: τοπάρχας
  english_pob_choice: local rulers
  chosen_korean: 지방 통치자들
  alternatives_korean:
  - 지역 통치자들
  - 토파르크들
  lexicon: LSJ
  rationale: 지역 또는 구역의 통치자를 뜻하므로, 본문의 행정적 계층을 드러내는 ‘지방 통치자들’로 옮겼습니다.
- source_word: ὑπάτους
  english_pob_choice: governors
  chosen_korean: 총독들
  alternatives_korean:
  - 주지사들
  - 최고 관리들
  - 총독관들
  lexicon: LSJ
  rationale: 이 목록에서는 로마 직함인 ‘집정관’보다 페르시아 행정 체계에 맞는 고위 통치자로 이해하는 것이 타당하므로, 영어 POB의 ‘governors’에 상응하는 ‘총독들’을 택했습니다.
theological_decisions:
- issue: 열거된 관직들의 역사적 배경을 어떻게 한국어로 보존할 것인가
  chosen_reading: 사트라프들, 지방 통치자들, 총독들로 구분해 페르시아 행정 체계를 드러냈습니다.
  alternative_readings:
  - 모두 일반적인 ‘관리들’로 완화하여 번역
  - ‘집정관들’처럼 로마 직함으로 옮김
  rationale: 본문은 왕이 페르시아와 메디아의 고위층과 지방 행정가들을 공식 소집하는 장면이므로, 서로 다른 직책을 구분해 번역해야 본문의 정치적·행정적 긴장이 살아납니다.
  doctrine_reference: 역사 서술의 정확성, 본문-배경 일치
