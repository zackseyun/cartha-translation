  rationale: 이 목록에서는 로마 직함인 ‘집정관’보다 페르시아 행정 체계에 맞는 고위 통치자로 이해하는 것이 타당하므로, 영어 POB의 ‘governors’에 상응하는 ‘총독들’을 택했습니다.
theological_decisions:
