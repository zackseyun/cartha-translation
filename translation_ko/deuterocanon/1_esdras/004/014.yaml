base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/014.yaml
  text: And he sent out and summoned all the nobles of Persia and Media[a], and the satraps and generals and local rulers and governors[c][b],
  footnotes:
  - marker: a
    text: Or 'having sent out, he called'; the Greek participle may explicitly describe dispatching messengers before the summons was carried out.
    reason: lexical_alternative
  - marker: b
    text: '''Toparchs'' refers to rulers over local districts or regions.'
    reason: cultural_note
  - marker: c
    text: The final term can also be rendered 'chief officials' or, more literally in some contexts, 'consuls'; here it is rendered according to the Persian administrative setting rather than as a Roman title.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 사람들을 보내어 페르시아와 메디아의 모든 귀족, 사트라프, 장군, 지방 통치자, 총독을 소집했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἐξαποστείλας는 문자적으로 ‘보내어’라는 선행 동작을 나타냅니다. 소집에 앞서 사자들을 파견했다는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: τοπάρχας는 지방이나 구역을 다스리는 통치자들을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: ὑπάτους는 ‘총독들’로 옮길 수 있으며, 문맥에 따라 ‘최고 관리들’ 또는 ‘집정관들’로도 번역될 수 있습니다. 여기서는 페르시아 궁정의 행정 문맥을 따라 ‘총독들’로 옮겼습니다.
    reason: lexical_alternative
