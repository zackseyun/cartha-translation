base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/074.yaml
  text: and on the altar to offer burnt offerings daily[a], as they have been commanded, to offer seventeen, and another ten talents yearly[c][b];
  footnotes:
  - marker: a
    text: The Greek verb rendered 'to offer' is unusual here and may more literally suggest 'to supply' or 'to furnish' the burnt offerings.
    reason: lexical_alternative
  - marker: b
    text: The object of 'seventeen' is not explicitly repeated in Greek; it likely refers to sacrificial items to be presented as part of the daily requirement.
    reason: alternative_reading
  - marker: c
    text: A 'talent' was a large unit of weight, often of precious metal; the text does not specify the metal here.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 제단 위에서는 번제물을 날마다 바치고, 그들이 명령을 받은 대로 열일곱을 바치며, 또 해마다 다른 열 달란트를 바치게 하였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 καρποῦσθαι는 여기서 문자적으로는 ‘산출하다’나 ‘공급하다’에 가깝지만, 제의 문맥에서는 번제물을 마련하여 드린다는 뜻으로 쓰였습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘열일곱’의 목적어는 그리스어에서 직접 반복되지 않으며, 문맥상 매일 요구되는 제의 항목을 가리키는 것으로 이해됩니다.
    reason: alternative_reading
  - marker: c
    text: ‘달란트’는 무게 단위로, 여기서는 어떤 금속인지는 본문이 밝히지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: θυσιαστήριον
  english_pob_choice: altar
  chosen_korean: 제단
  alternatives_korean:
  - 제단
  - 번제단
  lexicon: LSJ
  rationale: 성전 제의 맥락의 일반적 희생 제단을 가리키므로, 과도하게 한정하지 않는 ‘제단’이 가장 자연스럽습니다.
- source_word: ὁλοκαυτώματα
  english_pob_choice: burnt offerings
  chosen_korean: 번제물
  alternatives_korean:
  - 번제물
  - 온전히 불사르는 제물
  lexicon: LSJ
  rationale: 전부 불태워 드리는 희생 제물이라는 의미를 간결하게 살리기 위해 ‘번제물’로 옮겼습니다.
- source_word: καρποῦσθαι
  english_pob_choice: to offer
  chosen_korean: 바치고
  alternatives_korean:
  - 바치고
  - 공급하고
  - 제공하고
  lexicon: LSJ
  rationale: 이 동사는 직역하면 ‘산출하다/공급하다’의 뉘앙스가 있으나, 제의 문맥에서는 필요한 제물을 예비하여 드린다는 뜻으로 기능하므로 ‘바치다’가 가장 자연스럽습니다.
- source_word: ἑπτὰ καὶ δέκα
  english_pob_choice: seventeen
  chosen_korean: 열일곱
  alternatives_korean:
  - 열일곱
  - 십칠
  lexicon: LSJ
  rationale: 한국어 수사법에 맞게 아라비아 숫자 대신 고유어 수사 ‘열일곱’을 사용했습니다.
- source_word: προσφέρειν
  english_pob_choice: to offer
  chosen_korean: 바치며
  alternatives_korean:
  - 바치며
  - 드리며
  - 제공하며
  lexicon: LSJ
  rationale: 앞의 제의 동작과 맞물려, 제물을 공식적으로 드리는 행위를 ‘바치다’로 일관되게 옮겼습니다.
- source_word: ἄλλα τάλαντα δέκα
  english_pob_choice: another ten talents
  chosen_korean: 또 해마다 다른 열 달란트
  alternatives_korean:
  - 또 해마다 다른 열 달란트
  - 추가로 열 달란트
  - 또 열 달란트
  lexicon: LSJ
  rationale: ἄλλα는 앞의 항목에 더해지는 추가분을 뜻하므로 ‘다른/또’의 추가성을 살렸고, τάλαντα는 무게 단위로서 ‘달란트’로 음역했습니다.
theological_decisions:
- issue: 제의적 동사 καρποῦσθαι의 뜻 범위
  chosen_reading: ‘바치다’로 옮겨 제물의 준비·공급과 제의적 헌납을 함께 드러냈습니다.
  alternative_readings:
  - ‘공급하다’
  - ‘제공하다’
  rationale: 본문은 일상적 ‘제공’이 아니라 제단에 올리는 희생 제물의 맥락이므로, 한국어에서는 제의 행위를 직접 드러내는 표현이 더 정확합니다.
  doctrine_reference: 성전 제사 문맥의 제의적 어휘
- issue: ‘달란트’의 표기와 주석 처리
  chosen_reading: 본문에는 음역어 ‘달란트’를 두고, 금속 종류는 본문에 없는 정보로 보존했습니다.
  alternative_readings:
  - ‘재능’(비유적 의미)
  - ‘무게 단위’로 풀어쓰기
  rationale: 여기서 τάλαντα는 은유적 재능이 아니라 실제 무게 단위이므로, 전통적 비유 의미를 피하고 본문의 물질적·제의적 성격을 유지해야 합니다.
  doctrine_reference: 본문의 역사적-제의적 의미 보존
