translation:
  language: ko
  text: 예루살렘과 그의 이름이 그 위에 불린 성전을 다시 세우고자 하였으며, 그들은 음악과 기쁨으로 칠 일 동안 축하하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “그의 이름이 그 위에 불린”이며, 성전을 하나님께 속한 곳으로 지칭하는 셈어적 공식입니다.
    reason: source_note
lexical_decisions:
- source_word: ἀναβῆναι
  english_pob_choice: to go up
  chosen_korean: 다시 세우고자 하였으며
  alternatives_korean:
  - 올라가고자 하였으며
  - 올라가서
  lexicon: LSJ
  rationale: 문맥상 예루살렘으로 ‘올라감’의 뜻이 있지만, 한국어에서는 그 뒤의 목적절과 함께 자연스럽게 풀어 ‘다시 세우다’와 결합해 원문의 행위 방향을 살렸습니다.
- source_word: οἰκοδομῆσαι
  english_pob_choice: rebuild
  chosen_korean: 다시 세우고자 하였으며
  alternatives_korean:
  - 재건하고자 하였으며
  - 건축하고자 하였으며
  lexicon: LSJ
  rationale: 예루살렘과 성전이 복구되는 맥락이므로 단순한 ‘짓다’보다 ‘다시 세우다’가 원문의 회복 의미를 더 잘 드러냅니다.
- source_word: ἱερὸν
  english_pob_choice: temple
  chosen_korean: 성전
  alternatives_korean:
  - 신전
  - 거룩한 곳
  lexicon: LSJ
  rationale: 이 단어는 예루살렘 성전 건물을 가리키므로 한국어 성경 용례에 맞는 ‘성전’이 가장 분명합니다.
- source_word: οὗ ὠνομάσθη τὸ ὄνομα αὐτοῦ ἐπ’ αὐτῷ
  english_pob_choice: on which his name had been called
  chosen_korean: 그의 이름이 그 위에 불린
  alternatives_korean:
  - 그의 이름이 그 위에 불려진
  - 그의 이름으로 불린
  lexicon: LSJ
  rationale: 템플 공식의 셈어적 표현을 보존하기 위해 ‘이름이 그 위에 불린’ 구조를 살렸고, 소유·귀속의 함의를 너무 평탄하게 만들지 않도록 했습니다.
- source_word: ἐκωθωνίζοντο
  english_pob_choice: they celebrated
  chosen_korean: 축하하였습니다
  alternatives_korean:
  - 즐거운 잔치를 벌였습니다
  - 기뻐하며 잔치를 하였습니다
  lexicon: LSJ
  rationale: 희귀한 축하/연회 동사를 현대 한국어로는 과도하게 해석하지 않고, 뒤의 ‘음악과 기쁨’과 함께 공적인 축하의 뉘앙스를 담는 ‘축하하다’로 옮겼습니다.
theological_decisions:
- issue: 성전과 하나님의 이름의 귀속 관계
  chosen_reading: ‘그의 이름이 그 위에 불린’이라는 표현을 유지해 성전이 하나님의 소유와 임재의 표지라는 함의를 드러냈습니다.
  alternative_readings:
  - ‘그의 이름으로 불린’으로 평탄화
  - ‘그의 이름이 불려진’으로 수동만 강조
  rationale: 본문의 셈어적 공식은 단순 명칭이 아니라 언약적 귀속을 뜻하므로, 이를 너무 해설적으로 풀지 않고 긴장을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; Original-language primacy over translation tradition.'
