  text: to go up and rebuild Jerusalem and the temple on which his name had been called; and they celebrated with music and joy for seven days.
  footnotes:
  - marker: a
    text: Or 'over which his name was invoked' or 'which was called by his name.' The Greek reflects a Semitic temple formula expressing God's claim upon and association with the temple.
