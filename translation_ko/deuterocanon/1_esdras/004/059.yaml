translation:
  language: ko
  text: 말씀하시기를 「승리는 주님께 있고, 지혜도 주님께 있으며, 영광도 주님의 것입니다. 저는 주님의 종입니다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘종’은 여기서 가정에 속한 종/노예를 가리키는 οἰκέτης의 비교적 완곡한 번역입니다. 더 강하게는 ‘노예’도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρὰ σοῦ
  english_pob_choice: From you
  chosen_korean: 주님께 있고
  alternatives_korean:
