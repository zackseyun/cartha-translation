  rationale: 소유를 강조하는 구조를 한국어에서는 서술적으로 풀어, 영광의 귀속이 주님께 있다는 점을 분명히 했습니다.
- source_word: οἰκέτης
  english_pob_choice: servant
  chosen_korean: 종
