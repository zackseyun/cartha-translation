    rationale: παρά + 속격은 여기서 ‘~에게서, ~로부터’라는 근원을 뜻합니다. ‘~께 있다’는 소유 또는 소재로 해석될 수 있으며, 세 번째 절의 명시적 소유 표현과의 차이도 흐려집니다.
  - severity: low
    issue: ‘말씀하시기를’은 원문에 없는 발화자 높임을 암시할 수 있습니다.
    rationale: λέγων은 단순히 ‘말하며/말하여’라는 분사입니다. 한국어 독립 문장에서는 ‘이렇게 말했습니다’가 원문의 의미를 무리 없이 전달하면서 불필요한 존대 뉘앙스를 피합니다.
  revised_text: 이렇게 말했습니다. 「승리는 주님에게서 나오고, 지혜는 주님에게서 나오며, 영광은 주님의 것입니다. 저는 주님의 종입니다.」[a]
