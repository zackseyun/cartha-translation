translation:
  language: ko
  text: 그들이 그를 바라보고 있었고, 또한 바르타쿠스의 딸이며 왕의 첩인 아파메가 왕의 오른편에 앉아 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바라보고 있었고’는 그리스어 미완료 시제가 나타내는 지속적·반복적 시선을 반영한 번역입니다.
    reason: source_note
lexical_decisions:
- source_word: ἐθεώρουν
  english_pob_choice: They were watching
  chosen_korean: 바라보고 있었고
  alternatives_korean:
  - 지켜보고 있었고
  - 관찰하고 있었고
  lexicon: LSJ
  rationale: 미완료 과거의 지속적 시선을 살리기 위해 단순 과거보다 진행형 느낌의 표현을 택했습니다.
- source_word: τοῦ θαυμαστοῦ
  english_pob_choice: the admirable
  chosen_korean: 바르타쿠스의 딸
  alternatives_korean:
  - 훌륭한 바르타쿠스의
  - 칭찬받는 바르타쿠스의
  - 명망 있는 바르타쿠스의
  lexicon: LSJ
  rationale: ‘바르타쿠스의’ 뒤에 붙은 형용사는 본문에 포함된 수식어이므로, 이름에 직접 붙여 ‘명망 있는/훌륭한’의 뉘앙스를 살렸습니다.
- source_word: παλλακήν
  english_pob_choice: concubine
  chosen_korean: 첩
  alternatives_korean:
  - 후궁
  - 소실
  lexicon: LSJ
  rationale: 고대 왕실 맥락에서 βασιλέως와 결합된 παλλακή는 ‘첩’이 가장 직접적이고 과도한 미화가 없습니다.
- source_word: ἐν δεξιᾷ τοῦ βασιλέως
  english_pob_choice: at the king’s right hand
  chosen_korean: 왕의 오른편
  alternatives_korean:
  - 왕의 오른손 편
  - 왕의 오른쪽
  lexicon: LSJ
  rationale: 관용적 위치 표현을 한국어로 자연스럽게 옮기되, 원문의 방향성과 위상을 유지했습니다.
theological_decisions:
- issue: 본문의 사회적·궁정적 위계 표현
  chosen_reading: ‘왕의 첩’과 ‘왕의 오른편’이라는 표현을 완화하지 않고 그대로 옮겼습니다.
  alternative_readings:
  - 관계가 있는 여자
  - 왕 곁에 앉아 있는 여자
  - 왕의 옆자리에 앉아 있는
  rationale: 본문은 인물의 신분과 자리 배치를 드러내므로, 현대 독자에게 불편할 수 있어도 위계를 흐리지 않는 직역적 표현을 유지하는 것이 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §5
