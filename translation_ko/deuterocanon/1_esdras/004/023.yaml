  text: Men[a], does not wine prevail, since it compels one to act thus? And he fell silent after speaking in this way.
  footnotes:
  - marker: a
    text: Or, 'does not wine prove stronger, because it forces one to do these things?' The Greek rhetorical question can be rendered with slightly different English idiom.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람들이여, 포도주가 이렇게까지 사람을 억누르게 하니, 도리어 포도주가 더 강하다고 하지 않겠습니까? 그는 이렇게 말하고 나서 잠잠해졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘포도주가 더 강하지 않습니까? 그것이 사람을 이렇게 하도록 강요하기 때문입니다.’ 그리스어 수사 의문문은 한국어에서 조금 다르게도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ὦ ἄνδρες
  english_pob_choice: Men
  chosen_korean: 사람들이여
  alternatives_korean:
  - 남자들이여
  - 여러분
  lexicon: LSJ
  rationale: 직접 호격의 복수 호칭을 살리되, 현대 한국어에서 성별만 드러내는 직설적 호칭을 완화해 자연스럽게 들리도록 했습니다.
- source_word: οὐχ ὑπερισχύει
  english_pob_choice: does not ... prevail
  chosen_korean: 더 강하다고 하지 않겠습니까
  alternatives_korean:
  - 우세하지 않습니까
  - 이기지 않습니까
  - 더 힘이 세지 않습니까
  lexicon: LSJ
  rationale: ὑπερισχύει의 ‘더 강하다/우세하다’라는 힘의 우위를 한국어 수사 의문문으로 옮겨, 포도주의 영향력을 강조했습니다.
- source_word: ἀναγκάζει ποιεῖν
  english_pob_choice: it compels one to act thus
  chosen_korean: 사람을 억누르게 하니
  alternatives_korean:
  - 사람을 강제로 그렇게 하게 하니
  - 사람을 이런 일들을 하게 하니
  - 사람을 어쩔 수 없이 그렇게 만들기에
  lexicon: LSJ
  rationale: ἀναγκάζει의 ‘강요하다/억누르다’는 강제성을 살리되, 이어지는 수사 질문의 흐름 속에서 간결하게 표현했습니다.
- source_word: ἐσίγησεν οὕτως εἴπας
  english_pob_choice: And he fell silent after speaking in this way
  chosen_korean: 그는 이렇게 말하고 나서 잠잠해졌습니다
  alternatives_korean:
  - 그는 이렇게 말한 뒤 침묵했습니다
  - 그는 그렇게 말하고 말없이 있었습니다
  lexicon: LSJ
  rationale: ἀorist σιγάω의 종결 동작을 자연스러운 서술로 옮기되, 원문의 ‘말한 뒤 침묵함’이라는 전환을 보존했습니다.
