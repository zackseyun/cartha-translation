translation:
  language: ko
  text: 여러분, 포도주가 사람을 이처럼 행동하게 강요하니 포도주가 더 강하지 않습니까?[a] 그는 이렇게 말하고 잠잠해졌습니다.
  philosophy: optimal-equivalence
  footnotes:
