  lexicon: LSJ
  rationale: ἀναγκάζει의 ‘강요하다/억누르다’는 강제성을 살리되, 이어지는 수사 질문의 흐름 속에서 간결하게 표현했습니다.
- source_word: ἐσίγησεν οὕτως εἴπας
  english_pob_choice: And he fell silent after speaking in this way
  chosen_korean: 그는 이렇게 말하고 나서 잠잠해졌습니다
  alternatives_korean:
  - 그는 이렇게 말한 뒤 침묵했습니다
  - 그는 그렇게 말하고 말없이 있었습니다
  lexicon: LSJ
  rationale: ἀorist σιγάω의 종결 동작을 자연스러운 서술로 옮기되, 원문의 ‘말한 뒤 침묵함’이라는 전환을 보존했습니다.
