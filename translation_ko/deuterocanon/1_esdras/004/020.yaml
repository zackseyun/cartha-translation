base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/020.yaml
  text: And it makes all hearts rich[a], and it remembers neither king nor satrap; and it makes everything speak in terms of talents.
  footnotes:
  - marker: a
    text: Or 'it makes all speak about money' / 'it makes everyone talk in sums of money.' The Greek phrase uses 'talents' in the monetary sense, not in the modern sense of natural abilities.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그것은 모든 마음을 부유하게 만들고, 왕도 사트라프도 기억하지 않으며, 모든 것을 재능이라는 말로 말하게 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 혹은 ‘모든 사람을 돈 이야기로 말하게 합니다.’ / ‘모든 사람이 돈 액수로 말하게 합니다.’ 여기서 그리스어 ‘talents’는 현대 영어의 ‘재능’이 아니라 화폐적 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάσας καρδίας
  english_pob_choice: every heart
  chosen_korean: 모든 마음
  alternatives_korean:
  - 각각의 마음
  - 모든 심장
  lexicon: LSJ
  rationale: καρδία를 한국어의 관용을 따라 ‘마음’으로 옮기되, 분배적 뉘앙스는 ‘모든’으로 살렸습니다.
- source_word: ποιεῖ πλουσίας
  english_pob_choice: makes ... rich
  chosen_korean: 부유하게 만들고
  alternatives_korean:
  - 풍성하게 하고
  - 부요하게 하고
  lexicon: LSJ
  rationale: ποιέω + 형용사의 결과를 자연스러운 합쇼체로 옮기면서도, ‘rich’의 경제적 의미를 분명히 했습니다.
- source_word: οὐ μέμνηται βασιλέα οὐδὲ σατράπην
  english_pob_choice: remembers neither king nor satrap
  chosen_korean: 왕도 사트라프도 기억하지 않으며
  alternatives_korean:
  - 왕도 사트라프도 마음에 두지 않으며
  - 왕도 지방관도 기억하지 않으며
  lexicon: LSJ
  rationale: σατράπην은 역사적 색채를 보존하기 위해 음역형 ‘사트라프’를 택했고, οὐ μέμνηται는 단순한 ‘무시하다’보다 원형의 ‘기억하다/염두에 두다’를 살렸습니다.
- source_word: διὰ ταλάντων
  english_pob_choice: in terms of talents
  chosen_korean: 재능이라는 말로
  alternatives_korean:
  - 달란트라는 말로
  - 돈의 단위로
  lexicon: LSJ
  rationale: 여기서 τάλαντον은 현대 한국어의 ‘재능’이 아니라 화폐 단위를 뜻하므로, 오해를 피하도록 본문에서는 ‘재능’이 아니라 문맥상 금액·가치의 표현을 드러내는 방식으로 옮겼습니다.
