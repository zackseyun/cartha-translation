  lexicon: LSJ
  rationale: σατράπην은 역사적 색채를 보존하기 위해 음역형 ‘사트라프’를 택했고, οὐ μέμνηται는 단순한 ‘무시하다’보다 원형의 ‘기억하다/염두에 두다’를 살렸습니다.
- source_word: διὰ ταλάντων
