  yaml_path: translation/deuterocanon/1_esdras/004/020.yaml
  text: And it makes all hearts rich[a], and it remembers neither king nor satrap; and it makes everything speak in terms of talents.
  footnotes:
  - marker: a
    text: Or 'it makes all speak about money' / 'it makes everyone talk in sums of money.' The Greek phrase uses 'talents' in the monetary sense, not in the modern sense of natural abilities.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 모든 마음을 부유하게 만들고, 왕도 사트라프도 기억하지 않으며, 모든 사람이 돈 액수로 말하게 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘모든 사람이 달란트로 말하게 합니다.’ ‘달란트’는 여기서 현대적 의미의 재능이 아니라 고대의 중량·화폐 단위이며, 문맥상 돈의 액수를 가리킵니다.
    reason: lexical_alternative
