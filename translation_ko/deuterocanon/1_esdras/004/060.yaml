  text: Blessed are you[a], who have given me wisdom; and to you I give thanks[b], Master of the fathers.
  footnotes:
  - marker: a
    text: Or 'I acknowledge you' or 'I praise you'; the Greek verb can denote open acknowledgment or confession, and here likely carries a thanksgiving sense in prayer.
    reason: lexical_alternative
  - marker: b
    text: Or 'Sovereign of the fathers.' The Greek addresses God as δέσποτα, a term distinct from κύριος ('Lord').
    reason: lexical_alternative
translation:
  language: ko
  text: 주님은 찬양받으실 분이십니다. 주님께서 제게 지혜를 주셨으니, 저는 조상들의 주인이신 주님께 감사드립니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 εὐλογητὸς는 단순한 상태 진술뿐 아니라 하나님을 향한 찬양 선언으로도 읽힐 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: δέσποτα는 κύριος와 다른 단어로, ‘주님’보다 ‘주인’ 또는 ‘주권자’의 뉘앙스를 더 직접적으로 드러냅니다.
    reason: lexical_alternative
