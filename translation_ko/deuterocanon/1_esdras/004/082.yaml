base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/082.yaml
  text: Blessed are you[a], who have given me wisdom; and to you I give thanks, Master of the fathers.
  footnotes:
  - marker: a
    text: Or 'to you I acknowledge/confess.' The Greek verb can carry the sense of open acknowledgment or praise; here it is rendered 'I give thanks' because the context is a blessing addressed to God after receiving wisdom.
    reason: lexical_alternative
translation:
  language: ko
  text: 복되십니다, 저에게 지혜를 주신 분이시여. 조상들의 주권자이신 분께 감사드립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘감사드립니다’는 여기서 ὁμολογῶ를 문맥에 따라 옮긴 것입니다. 이 동사는 ‘공개적으로 인정하다’, ‘고백하다’, 또는 ‘찬양하다’라는 뜻도 지닐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογητὸς εἶ
  english_pob_choice: Blessed are you
  chosen_korean: 복되십니다
  alternatives_korean:
  - 복받으셨습니다
  - 찬송받으십니다
  lexicon: LXX/BDAG
  rationale: 직접적인 축복 선언으로 읽히므로 ‘복되십니다’가 예배적 호칭을 가장 자연스럽게 살리면서도 ‘찬송받으십니다’보다 원문 형식을 덜 해치지 않습니다.
- source_word: ἔδωκάς μοι σοφίαν
  english_pob_choice: have given me wisdom
  chosen_korean: 저에게 지혜를 주셨기 때문입니다
  alternatives_korean:
  - 저에게 지혜를 주셨기 때문입니다
  - 저에게 지혜를 주셨습니다
  lexicon: BDAG
  rationale: 완료된 주심의 결과가 지금의 감사로 이어지는 흐름이므로 한국어에서는 이유를 드러내는 표현이 자연스럽고, ‘지혜’는 σοφία의 표준 대응입니다.
- source_word: σοὶ ὁμολογῶ
  english_pob_choice: I give thanks
  chosen_korean: 감사드립니다
  alternatives_korean:
  - 고백합니다
  - 인정합니다
  lexicon: BDAG
  rationale: ὁμολογέω의 감사/공적 인정의 뉘앙스를 살리되, 이 축복 기도의 문맥에서 현대 독자가 오해하지 않도록 ‘감사드립니다’로 옮겼습니다.
- source_word: δέσποτα τῶν πατέρων
  english_pob_choice: Master of the fathers
  chosen_korean: 조상의 주이신 주님
  alternatives_korean:
  - 조상들의 주인이신 주님
  - 조상들의 주님
  lexicon: BDAG
  rationale: δέσποτα의 강한 주권성을 살리기 위해 ‘주님’만으로 평준화하지 않고 ‘주이신’ 구조를 더해, ‘조상들’의 하나님이라는 관용적 호칭을 드러냈습니다.
theological_decisions:
- issue: δέσποτα의 신학적 뉘앙스
  chosen_reading: ‘주님’ 앞에 ‘주이신’이라는 구조를 써서 절대적 주권을 드러냄
  alternative_readings:
  - ‘마스터’
  - ‘주인’
  rationale: 한국어 기독교 용례에서 ‘마스터’와 ‘주인’은 예배적 호칭으로는 부자연스럽고, 단순히 ‘주님’만 쓰면 δέσποτα의 더 강한 지배/권위를 약화시킬 수 있어 중간적 해결을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: lexical distinction 유지 원칙'
