lexical_decisions:
- source_word: ἔλαβεν
  english_pob_choice: took
  chosen_korean: 가지고
  alternatives_korean:
  - 받고
  - 가져가고
  lexicon: BDAG
  rationale: 편지들을 손에 쥐고 이동하는 연속 동작을 자연스럽게 드러내기 위해 ‘가지고’를 택했습니다.
- source_word: τὰς ἐπιστολάς
  english_pob_choice: the letters
  chosen_korean: 그 편지들을
  alternatives_korean:
  - 그 서신들을
  - 그 문서들을
  lexicon: BDAG
  rationale: ἐπιστολάς는 일반적으로 ‘편지들/서신들’이므로, 가장 직접적인 ‘편지들’로 옮겼습니다.
- source_word: ἐξῆλθεν εἰς Βαβυλῶνα
  english_pob_choice: went out to Babylon
  chosen_korean: 바빌론으로 나가서
  alternatives_korean:
  - 바빌론으로 떠나서
  - 바빌론으로 나가
  lexicon: BDAG
  rationale: ἐξῆλθεν의 ‘나가다/떠나다’ 뉘앙스를 살리되, 목적지를 분명히 하는 한국어로 옮겼습니다.
- source_word: τοῖς ἀδελφοῖς αὐτοῦ πᾶσιν
  english_pob_choice: to all his brothers
  chosen_korean: 자기 형제들 모두에게
  alternatives_korean:
  - 자기 형제들에게 모두
  - 자기 동족 모두에게
  lexicon: BDAG
  rationale: ἄδελφοι의 남성 복수형을 그대로 살려 ‘형제들’로 옮겼고, πᾶσιν은 ‘모두’로 분명히 했습니다.
theological_decisions:
- issue: ἀδελφοῖς의 집단적 의미를 한국어에서 어떻게 유지할지
  chosen_reading: ‘형제들’로 직역하되, 문맥상 혈연만이 아니라 동족/공동체를 가리킬 수 있는 여지를 열어 둡니다.
  alternative_readings:
  - 동족
  - 친족
  - 형제자매
  rationale: 원문은 남성 복수 ἀδελφοῖς를 사용하므로, 본문 가시성 차원에서 ‘형제들’을 유지했습니다. 다만 1 Esdras의 유대인 공동체 문맥을 고려하면 집단적 의미도 가능합니다.
  doctrine_reference: DOCTRINE.md §4 Gender-accurate over gender-neutral
