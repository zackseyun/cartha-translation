theological_decisions:
- issue: ἀδελφοῖς의 집단적 의미를 한국어에서 어떻게 유지할지
  chosen_reading: ‘형제들’로 직역하되, 문맥상 혈연만이 아니라 동족/공동체를 가리킬 수 있는 여지를 열어 둡니다.
  alternative_readings:
  - 동족
  - 친족
  - 형제자매
  rationale: 원문은 남성 복수 ἀδελφοῖς를 사용하므로, 본문 가시성 차원에서 ‘형제들’을 유지했습니다. 다만 1 Esdras의 유대인 공동체 문맥을 고려하면 집단적 의미도 가능합니다.
  doctrine_reference: DOCTRINE.md §4 Gender-accurate over gender-neutral
