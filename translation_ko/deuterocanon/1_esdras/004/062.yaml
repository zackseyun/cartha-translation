  text: And they blessed the God of their fathers, because he had given them relief and release.
translation:
  language: ko
  text: 그리고 그들은 자기 조상들의 하나님을 찬양했습니다. 그분께서 자기들에게 안식과 해방을 주셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
