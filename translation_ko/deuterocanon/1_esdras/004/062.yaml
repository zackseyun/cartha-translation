lexical_decisions:
- source_word: εὐλόγησαν
  english_pob_choice: blessed
  chosen_korean: 찬양했습니다
  alternatives_korean:
  - 복을 빌었습니다
  - 축복했습니다
  lexicon: εὐλογέω
  rationale: 여기서는 하나님을 향한 응답으로서의 ‘찬양하다’가 자연스럽고, 단순한 복 주기 행위보다 문맥상 감사와 경배를 더 잘 드러냅니다.
- source_word: τὸν θεὸν τῶν πατέρων αὐτῶν
  english_pob_choice: the God of their fathers
  chosen_korean: 자기 조상들의 하나님
  alternatives_korean:
  - 그들의 조상들의 하나님
  - 조상들의 하나님
  lexicon: θεός + πατήρ
  rationale: 직역 구조를 유지하되 한국어에서 소유관계를 자연스럽게 풀어, 혈통적·언약적 연속성을 분명히 했습니다.
- source_word: ἄνεσιν
  english_pob_choice: relief
  chosen_korean: 안식
  alternatives_korean:
  - 휴식
  - 완화
  - 해방
  lexicon: ἄνεσις
  rationale: ἄνεσις의 핵심인 짐에서 벗어난 ‘완화된 상태’를 한국어로 간결하게 살리되, 이어지는 ἄφεσις와 구별되도록 ‘안식’을 택했습니다.
- source_word: ἄφεσιν
  english_pob_choice: release
  chosen_korean: 해방
  alternatives_korean:
  - 석방
  - 풀어줌
  - 면제
  lexicon: ἄφεσις
  rationale: 영문 POB의 ‘release’를 따라, 포로/억압 상태에서 풀려나는 의미를 가장 직접적으로 드러내는 ‘해방’을 선택했습니다.
theological_decisions:
- issue: ἄφεσις의 의미 범위
  chosen_reading: 이 절에서는 죄 사함보다 정치적·사회적 해방의 뜻으로 읽고 ‘해방’으로 옮겼습니다.
  alternative_readings:
  - 용서
  - 사함
  - 면제
  rationale: 영문 POB가 이미 ‘release’로 고정했고, 문맥상 포로 생활이나 압제에서의 풀림을 가리키므로 속죄적 ‘용서’로 좁히지 않았습니다.
  doctrine_reference: 문맥 우선 원칙; ἄφεσις의 비속죄적 용례
