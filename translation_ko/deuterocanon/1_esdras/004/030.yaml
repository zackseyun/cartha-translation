    reason: lexical_alternative
lexical_decisions:
- source_word: διάδημα
  english_pob_choice: crown
  chosen_korean: 관
  alternatives_korean:
  - 왕관
  - 면류관
  lexicon: LSJ
  rationale: διάδημα는 왕권을 나타내는 머리 장식이므로, 한국어에서는 직역 투의 ‘왕관’보다 간결하고 고전적 함의가 있는 ‘관’이 본문 맥락에 잘 맞습니다.
- source_word: ἐπιτιθοῦσαν αὐτῇ
  english_pob_choice: putting it on herself
  chosen_korean: 자기 머리에 얹고
  alternatives_korean:
  - 자기에게 얹고
  - 자기 머리에 씌우고
  lexicon: LSJ
  rationale: 목적이 ‘자기 자신에게’ 두는 행위이므로, 단순히 ‘그것을 두다’보다 ‘자기 머리에 얹다’가 반사적 의미를 한국어로 자연스럽게 드러냅니다.
- source_word: ἐράπιζεν
  english_pob_choice: struck
  chosen_korean: 때렸습니다
  alternatives_korean:
  - 쳤습니다
  - 손바닥으로 쳤습니다
  - 후려쳤습니다
  lexicon: LSJ
  rationale: 이 동사는 손으로 때리는 행위를 넓게 가리키므로, 과도하게 구체화하지 않는 ‘때렸습니다’가 본문 의미를 보존합니다. English POB의 footnote처럼 ‘뺨을 때렸다’는 뉘앙스도 가능하지만 본문에는 일반 동작을 유지했습니다.
- source_word: τῇ ἀριστερᾷ
  english_pob_choice: with her left hand
  chosen_korean: 왼손으로
  alternatives_korean:
  - 왼손을 써서
  - 왼손으로서
  lexicon: LSJ
  rationale: 헬라어 여격은 수단을 나타내며, 한국어에서는 ‘왼손으로’가 가장 자연스럽고 간결하게 도구적 의미를 전합니다.
