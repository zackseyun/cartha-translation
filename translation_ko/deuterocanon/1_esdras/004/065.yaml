base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/065.yaml
  text: Then he said to the king[a], “Remember the vow that I made to rebuild Jerusalem on the day when you received your kingdom,”
  footnotes:
  - marker: a
    text: Or, “Remember the prayer that I prayed to rebuild Jerusalem …” The Greek uses εὐχή/ηὐξάμην, which can refer either to a vow or to prayer; here the context favors a vowed commitment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 그가 왕에게 말했습니다. "왕께서 왕국을 받으셨던 날에, 예루살렘을 다시 세우려고 내가 드린 서원을 기억해 주십시오."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 "예루살렘을 다시 세우려고 내가 드린 기도를 기억해 주십시오". 여기서 εὐχή/ηὐξάμην은 서원이나 기도를 가리킬 수 있으나, 문맥상 본문은 서원에 더 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνήσθητι
  english_pob_choice: Remember
  chosen_korean: 기억해 주십시오
  alternatives_korean:
  - 기억하십시오
  - 떠올려 주십시오
  lexicon: BDAG
  rationale: 왕에게 직접 요청하는 명령형으로, 현대 한국어에서는 정중한 청유·요청의 뉘앙스를 살려 "기억해 주십시오"가 가장 자연스럽습니다.
- source_word: εὐχήν / ηὐξάμην
  english_pob_choice: vow / I made
  chosen_korean: 서원 / 드린
  alternatives_korean:
  - 기도 / 드린
  - 약속 / 한
  lexicon: LSJ; BDAG
  rationale: 문맥상 단순한 기도보다 구체적으로 이행을 약속한 서원이 앞서므로 "서원"으로 옮기되, 동사는 한국어에서 어색한 중복을 피하려고 "드린"으로 처리했습니다.
- source_word: οἰκοδομῆσαι τὴν Ἰερουσαλήμ
  english_pob_choice: to rebuild Jerusalem
  chosen_korean: 예루살렘을 다시 세우려고
  alternatives_korean:
  - 예루살렘을 건축하려고
  - 예루살렘을 재건하려고
  lexicon: BDAG
  rationale: 도시 회복의 맥락이 분명하므로 단순히 "세우다"보다 "다시 세우다"가 원문의 복원 의미를 잘 드러냅니다.
- source_word: τὸ βασίλειόν σου παρέλαβες
  english_pob_choice: you received your kingdom
  chosen_korean: 왕국을 받으셨던
  alternatives_korean:
  - 왕국을 맡으셨던
  - 왕위를 이어받으셨던
  lexicon: BDAG; LSJ
  rationale: παραλαμβάνω의 "받다/이어받다" 의미를 살리면서, 왕에게 직접 말하는 존대 표현으로 "받으셨던"을 택했습니다.
theological_decisions:
- issue: εὐχή/ηὐξάμην의 의미를 기도와 서원 중 어떻게 살릴지
  chosen_reading: 본문의 핵심은 예루살렘 재건을 위해 한 구체적 서원입니다.
  alternative_readings:
  - 기도
  - 약속
  rationale: Greek pairing can denote prayer or vow, but the infinitival content makes a vowed commitment the more probable sense; the Korean main text therefore uses "서원" while leaving no unnecessary ambiguity in the sentence.
  doctrine_reference: '번역 원칙: 의미상 중요한 어휘적 긴장은 문맥이 허용하는 범위에서 보존하되, 본문이 요구하지 않는 중복은 피합니다.'
