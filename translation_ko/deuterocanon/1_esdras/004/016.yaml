  lexicon: LSJ
  rationale: ἰσχύς의 의미 범위는 '힘/강함/능력'이지만, 여기서는 포도주의 우열을 말하는 문맥이므로 가장 직접적인 '힘'을 선택했습니다.
- source_word: καὶ ἔφη οὕτως
