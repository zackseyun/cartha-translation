  lexicon: BDAG
  rationale: 수사적 질문이 예스의 답을 기대하므로, 단순 부정보다 상대적 우세를 묻는 한국어 표현으로 옮겨 의미를 분명히 했습니다.
- source_word: τὴν γῆν καὶ τὴν θάλασσαν κατακρατοῦντες καὶ πάντα τὰ ἐν αὐτοῖς
  english_pob_choice: ruling over the land and the sea and everything in them
  chosen_korean: 땅과 바다와 그 안에 있는 모든 것을 지배하니
