  text: 'And the second[a], who had spoken about the king’s strength, began to speak: “Men, do not men prevail, ruling over the land and the sea and everything in them?”'
  footnotes:
  - marker: a
    text: 'Greek: ''Do not men prevail...?'' The question is rhetorical and expects the answer ''Yes.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 왕의 힘에 관해 말했던 둘째 사람이 말하기 시작했습니다. “여러분, 사람들이 땅과 바다와 그 안에 있는 모든 것을 지배하니, 더 강하지 않습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어의 문장은 수사적 질문이며, ‘그렇습니다’라는 긍정의 대답을 기대합니다.
    reason: lexical_alternative
