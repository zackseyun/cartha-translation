  lexicon: BDAG
  rationale: ἰσχύς는 여기서 왕의 ‘힘’ 또는 ‘능력’을 뜻하므로, POB의 선택을 따라 ‘힘’으로 옮기고, 앞선 발화를 식별하는 과거분사 기능을 ‘말했던’으로 나타냈습니다.
