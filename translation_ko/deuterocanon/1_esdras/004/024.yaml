  lexicon: BDAG
  rationale: κατακρατέω는 통치·지배의 강한 의미를 가지므로 ‘지배하다’로 옮겨 행위의 성격을 분명히 했고, ‘그 안에 있는 모든 것’으로 포괄성을 살렸습니다.
