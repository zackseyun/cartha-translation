theological_decisions:
- issue: 건축 대상의 범위
  chosen_reading: ‘그 도시’를 그대로 유지하여, 이 절이 성전이 아니라 예루살렘 성읍 건축을 말함을 반영했습니다.
  alternative_readings:
  - 성전 건축으로 완화하여 이해하는 번역
  - 도성 재건으로 일반화하는 번역
  rationale: 그리스어가 분명히 τὴν πόλιν이라고 말하므로, 다른 복원 전승의 성전 언어로 조화시키지 않고 본문 그대로 따랐습니다.
  doctrine_reference: 원문 우선 번역 원칙
