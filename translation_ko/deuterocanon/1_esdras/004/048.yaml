  text: And he wrote letters to all the governors in Coele-Syria and Phoenicia and to those in Lebanon[a], to bring cedar timber from Lebanon to Jerusalem[b], so that they might build the city with him.
  footnotes:
  - marker: a
    text: Or 'district rulers' or 'local rulers' for 'governors' (Greek toparchs).
    reason: lexical_alternative
  - marker: b
    text: Coele-Syria is the historical regional name in the Greek text.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그는 코엘레-시리아[a]와 페니키아에 있는 모든 지방 통치자들과 레바논에 있는 이들에게, 레바논에서 예루살렘으로 백향목 목재를 운반하고 그와 함께 그 도시를 건축하도록 편지를 썼습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 코엘레-시리아는 그리스어 본문의 역사적 지역명입니다.
