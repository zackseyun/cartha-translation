  rationale: 그리스어의 수신자 구분(코엘레-시리아와 페니키아의 지방 통치자들, 그리고 레바논에 있는 이들)을 보존했습니다. 부정과거 ‘편지를 썼다’를 문장의 주동사로 유지하고, 부정사 μεταφέρειν 및 목적 접속사 ὅπως와 접속법 οἰκοδομήσωσιν은 ‘운반하고 … 건축하도록’으로 옮겨 지시와 목적의 관계를 나타냈습니다. ‘그 도시’는 τὴν πόλιν을 그대로 반영합니다.
