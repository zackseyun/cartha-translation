  - 친구들과 형제들에게 다정하게 대할
  - 친구들과 형제들에게 우정을 나타낼
  lexicon: LSJ
  rationale: φιλιάζειν의 관계적·애정적 의미를 살려 ‘애정을 보이다’로 옮겼고, ἀδελφοῖς는 본문의 남성형을 따라 ‘형제들’로 유지했습니다.
- source_word: μετʼ οὐ πολὺ σπῶνται μαχαίρας
  english_pob_choice: before long they draw swords
  chosen_korean: 얼마 지나지 않아 칼을 빼어 듭니다
  alternatives_korean:
