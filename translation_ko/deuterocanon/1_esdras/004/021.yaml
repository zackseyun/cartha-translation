  text: 그들은 술을 마시는 동안 친구들과 형제들에게 애정을 보일 생각을 하지 못하고, 얼마 지나지 않아 칼을 빼어 듭니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘친구들과 형제들에게 다정하게 대할’. 그리스어 동사는 문자적 ‘애정 표현’보다 더 넓은 우호적 행동을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μέμνηται
  english_pob_choice: they do not remember
  chosen_korean: 생각을 하지 못하고
  alternatives_korean:
  - 기억하지 못하고
