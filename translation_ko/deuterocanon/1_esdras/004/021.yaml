  text: 그들은 술을 마실 때에는 친구들과 형제들에게 다정하게 대할 것을[a] 잊고, 얼마 지나지 않아 칼을 빼어 듭니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘친구들과 형제들에게 애정을 보일 것을’. 그리스어 동사는 문자적인 애정 표현에만 한정되지 않고, 더 넓게 우호적이거나 다정하게 행동하는 것을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μέμνηται
  english_pob_choice: they do not remember
  chosen_korean: 생각을 하지 못하고
  alternatives_korean:
