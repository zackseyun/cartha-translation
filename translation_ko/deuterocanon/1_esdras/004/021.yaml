  lexicon: LSJ
  rationale: 원문의 ‘기억하지 않다’는 단순한 기억 상실보다, 술자리에서 마땅히 해야 할 바를 떠올려 실행하지 못하는 뜻을 포함하므로 자연스러운 한국어로 옮겼습니다.
- source_word: ὅταν πίνωσιν
  english_pob_choice: while they are drinking
  chosen_korean: 술을 마시는 동안
  alternatives_korean:
  - 마시는 동안
  - 술 마실 때
  - 술을 마실 때마다
  lexicon: LSJ
  rationale: 반복적·상황적 용법을 살려, 음주가 진행되는 한가운데의 장면으로 표현했습니다.
- source_word: φιλιάζειν φίλοις καὶ ἀδελφοῖς
  english_pob_choice: to show affection to friends and brothers
  chosen_korean: 친구들과 형제들에게 애정을 보일
  alternatives_korean:
  - 친구들과 형제들에게 친절을 보일
