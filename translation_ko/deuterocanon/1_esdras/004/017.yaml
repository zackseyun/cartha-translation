translation:
  language: ko
  text: 남자들이여, 포도주의 힘이 얼마나 대단합니까! 포도주는 그것을 마시는 모든 사람의 마음을 미혹합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνδρες
  english_pob_choice: Men
  chosen_korean: 사람들아
  alternatives_korean:
  - 남자들이여
  - 여러분
  lexicon: LSJ
  rationale: 직접 호격의 남성 복수를 살리되, 한국어에서 현대적이고 자연스러운 군중 연설체로 옮겼습니다. '남자들이여'는 원문의 성별 표지를 더 직접 반영하지만 다소 경직되어 보일 수 있어, 본문 전체의 수사적 호소를 살리는 쪽을 택했습니다.
- source_word: πῶς ὑπερισχύει
  english_pob_choice: how greatly prevails
  chosen_korean: 얼마나 크게 힘을 떨치는지
  alternatives_korean:
  - 얼마나 크게 우세한지
  - 얼마나 강력한지
  - 얼마나 지배하는지
  lexicon: LSJ
  rationale: πῶς의 감탄적 정도와 ὑπερισχύει의 '우세하다/힘을 떨치다'는 뜻을 함께 살리기 위해, 단순한 '강하다'보다 수사적 뉘앙스가 드러나는 표현으로 옮겼습니다.
- source_word: πάντας τοὺς ἀνθρώπους τοὺς πίοντας αὐτόν
  english_pob_choice: all the men who drink it
  chosen_korean: 마시는 모든 사람
  alternatives_korean:
  - 그것을 마시는 모든 남자
  - 그것을 마시는 모든 사람들
  - 마시는 모든 이들
  lexicon: LSJ
  rationale: ἄνθρωπος는 문맥상 일반명사로도 읽을 수 있어, 한국어에서는 성별 일반성을 살린 '사람'이 가장 자연스럽습니다. 영어 POB의 남성 표지 선택은 그대로 따르지 않고, 원문의 ἀνθρώπους가 갖는 포괄성을 우선했습니다.
- source_word: πλανᾷ τὴν διάνοιαν
  english_pob_choice: leads astray the mind
  chosen_korean: 마음을 미혹합니다
  alternatives_korean:
  - 생각을 잘못 인도합니다
  - 이성을 빗나가게 합니다
  - 마음을 속입니다
  lexicon: LSJ
  rationale: πλανᾷ는 단순한 정보 오류보다 '길을 잃게 하다/미혹하다'의 강한 의미가 있어 '미혹합니다'를 택했습니다. διάνοια는 '마음/생각/이성'이 모두 가능하지만, 한국어에서는 사유와 의지를 함께 아우르는 '마음'이 가장 무난합니다.
theological_decisions:
- issue: 문장 첫 호격의 성별 표지 처리
  chosen_reading: 원문의 Ἄνδρες는 남성 호격이지만, 한국어 본문에서는 수사적 호소를 자연스럽게 살리기 위해 '사람들아'로 옮겼습니다.
  alternative_readings:
  - 남자들이여
  - 여러분
  rationale: 이 장면의 초점은 성별 구분 자체보다 술의 힘을 강조하는 경구적 경고에 있으므로, 현대 한국어 독자의 즉각적 이해를 우선했습니다. 다만 원문의 남성 표지는 lexical_decisions에서 설명했습니다.
  doctrine_reference: 문맥/수사적 재현
- issue: 반복되는 ἀνθρώπους의 범위
  chosen_reading: 마시는 모든 사람
  alternative_readings:
  - 모든 남자
  - 모든 이들
  rationale: 원문 ἀνθρώπους는 보통 '사람들'이 가능하며, 이 절의 일반 진술은 술의 보편적 영향력을 말합니다. 따라서 한국어에서는 성별 제한을 두지 않는 쪽이 본문의 의미를 더 정확히 전달합니다.
  doctrine_reference: 어휘 범위/문맥 우선
