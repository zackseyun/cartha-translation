lexical_decisions:
- source_word: τότε
  english_pob_choice: then
  chosen_korean: 그때에
  alternatives_korean:
  - 그런 다음
  - 그때
  lexicon: LSJ
  rationale: 서사의 다음 단계를 표시하는 시간 부사로, 문맥의 순서를 자연스럽게 살리면서도 구어체로 흐르지 않도록 ‘그때에’로 옮겼습니다.
- source_word: γράφψαντες / γράψαντες
  english_pob_choice: after each had written
  chosen_korean: 각 사람이 자기의 말을 써서
  alternatives_korean:
