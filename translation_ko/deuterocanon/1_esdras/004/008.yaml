translation:
  language: ko
  text: 그때에 그들은 각자 자기의 진술을 쓴 뒤 그것들을 봉인하여 다리우스 왕의 베개[a] 아래에 두었습니다.
  philosophy: optimal-equivalence
  footnotes:
