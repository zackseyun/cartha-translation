  - 써 놓고
  lexicon: LSJ
  rationale: 분사구문은 앞선 행위를 나타내므로 ‘써서’로 처리해, 각 사람이 먼저 기록한 뒤 봉인하고 내려놓는 순서를 드러냈습니다.
- source_word: τὸν ἑαυτοῦ λόγον
  english_pob_choice: his own statement
  chosen_korean: 자기의 말
  alternatives_korean:
  - 자기의 진술
  - 자기 말
  lexicon: LSJ
  rationale: λόγος는 여기서 각자가 제출한 글/진술을 가리키므로, 해석을 과도하게 확장하지 않으면서도 서면 제출의 성격을 살려 ‘자기의 말’로 옮겼습니다.
- source_word: ὑπὸ τὸ προσκεφάλαιον
  english_pob_choice: under the pillow
  chosen_korean: 머리받침 아래에
  alternatives_korean:
  - 베개 아래에
  - 머리맡 아래에
  lexicon: LSJ
  rationale: προσκεφάλαιον은 ‘베개’도 가능하지만 ‘머리받침/머리용 받침’의 뜻도 있어, 본문 주석 가능성을 열어 두는 ‘머리받침 아래에’로 옮겼습니다.
