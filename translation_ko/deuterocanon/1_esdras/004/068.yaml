  terminology: εὐχή/ηὐξάμην의 동족어 반복은 ‘서원/서원한’으로 보존했습니다. ‘하늘의 왕’은 지상 왕과 구별되는 하나님 경칭으로 유지했습니다. ‘당신의 입으로’도 본문의 구체적 표현으로 유지하고, 각주에서 왕의 말 또는 명령이라는 관용적 뜻을 설명합니다.
