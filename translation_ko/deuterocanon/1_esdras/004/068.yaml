base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/068.yaml
  text: 'And now this is what I ask, O lord king, and what I request from you, and this is the greatness that comes from you: therefore I beg that you do the vow which I vowed to the King of heaven that it should be done by your mouth.'
  footnotes:
  - marker: a
    text: Or 'fulfill the vow.' The Greek literally says 'do the vow,' an idiom for carrying out what was vowed.
    reason: lexical_alternative
  - marker: b
    text: Literally 'by your mouth'; that is, by your spoken command or authorization.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 왕이신 주여, 이것이 제가 바라는 모든 것이며, 당신께 요청하는 것도 이것입니다. 이것이 당신에게서 오는 큰 은혜입니다. 그러므로 제가 하늘의 왕께 서원한 서원을[a] 당신의 입으로[b] 이루어 주시기를 간청합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘서원을 하다/행하다’입니다. 여기서는 서원한 일을 실행하거나 이루어 낸다는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘당신의 입으로’입니다. 곧 왕의 말이나 공식 명령으로 승인하거나 시행해 달라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
