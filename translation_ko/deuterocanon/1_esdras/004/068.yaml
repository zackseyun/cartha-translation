base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/068.yaml
  text: 'And now this is what I ask, O lord king, and what I request from you, and this is the greatness that comes from you: therefore I beg that you do the vow which I vowed to the King of heaven that it should be done by your mouth.'
  footnotes:
  - marker: a
    text: Or 'fulfill the vow.' The Greek literally says 'do the vow,' an idiom for carrying out what was vowed.
    reason: lexical_alternative
  - marker: b
    text: Literally 'by your mouth'; that is, by your spoken command or authorization.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 제가 주님 왕께 구하는 것은 이것이며, 당신께 요청하는 것도 이것입니다. 이것이 또한 당신에게서 나오는 위대함입니다. 그러므로 제가 하늘의 왕께 서원한 서원을 당신의 입으로 이루게 해 주시기를 간청합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘서원을 하다/행하다’입니다. 여기서는 서원한 일을 실행한다는 관용어입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘당신의 입으로’입니다. 곧 왕의 말이나 공식 명령으로 승인해 달라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀξιῶ
  english_pob_choice: I ask
  chosen_korean: 구하는 것은
  alternatives_korean:
  - 요청하는 것은
  - 청하는 것은
  - 청원하는 것은
  lexicon: BDAG
  rationale: 겸손한 청탁의 뉘앙스를 살리되, 이어지는 αἰτοῦμαί와 중복되지 않도록 한국어에서는 ‘구하다’로 자연스럽게 받았습니다.
- source_word: αἰτοῦμαί
  english_pob_choice: I request
  chosen_korean: 요청하는 것도
  alternatives_korean:
  - 구하는 것도
  - 청하는 것도
  - 간청하는 것도
  lexicon: BDAG
  rationale: 앞의 ἀξιῶ와 구별되는 반복 청원을 살리기 위해 ‘요청하다’를 택했습니다.
- source_word: μεγαλωσύνη ἡ παρὰ σοῦ
  english_pob_choice: the greatness that comes from you
  chosen_korean: 당신에게서 나오는 위대함
  alternatives_korean:
  - 당신의 위대함
  - 당신에게서 오는 عظ대함
  - 당신의 너그러움
  lexicon: LSJ
  rationale: 단순한 속성보다 왕에게서 비롯되는 위엄/관대함의 출처를 드러내는 구조를 반영했습니다.
- source_word: ποιήσῃς τὴν εὐχὴν
  english_pob_choice: you do the vow
  chosen_korean: 서원을 이루게 해 주시기를
  alternatives_korean:
  - 서원을 행하게 해 주시기를
  - 서원을 완수하게 해 주시기를
  - 서원을 지키게 해 주시기를
  lexicon: BDAG
  rationale: εὐχή를 여기서는 서원으로 보고, ‘do the vow’의 관용적 의미를 한국어에서 가장 자연스럽게 ‘이루다/이루게 하다’로 옮겼습니다.
- source_word: ἐκ στόματός σου
  english_pob_choice: by your mouth
  chosen_korean: 당신의 입으로
  alternatives_korean:
  - 당신의 말로
  - 당신의 명으로
  - 당신이 말씀하시는 대로
  lexicon: LSJ
  rationale: 직역 이미지인 ‘입으로’를 유지하되, 실제로는 왕의 공적 승인과 발화를 뜻하는 점을 한국어에서도 드러냈습니다.
theological_decisions:
- issue: τῷ βασιλεῖ τοῦ οὐρανοῦ의 지시 대상
  chosen_reading: 하늘의 왕은 하나님을 가리키는 경외칭호입니다.
  alternative_readings:
  - 하늘에 속한 왕
  - 하늘의 왕좌를 가진 왕
  rationale: 문맥상 지상 왕에게 하는 청원이 아니라, 유대적 경칭으로서 하나님을 뜻하므로 그대로 보존했습니다.
  doctrine_reference: 유일신 신앙과 경칭적 신호 해석
