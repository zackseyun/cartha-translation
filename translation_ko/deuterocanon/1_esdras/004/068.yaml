revisions:
- from: 이제 제가 주님 왕께 구하는 것은 이것이며, 당신께 요청하는 것도 이것입니다. 이것이 또한 당신에게서 나오는 위대함입니다. 그러므로 제가 하늘의 왕께 서원한 서원을 당신의 입으로 이루게 해 주시기를 간청합니다.[a][b]
  to: 이제 왕이신 주여, 이것이 제가 바라는 모든 것이며, 당신께 요청하는 것도 이것입니다. 이것이 당신에게서 오는 큰 은혜입니다. 그러므로 제가 하늘의 왕께 서원한 서원을[a] 당신의 입으로[b] 이루어 주시기를 간청합니다.
  rationale: 왕에게 직접 청하는 ἵνα ποιήσῃς의 주체를 ‘이루어 주시기를’으로 분명히 했고, 각주 표지를 각각 ‘서원’과 ‘당신의 입으로’에 붙였습니다. 서원 언어와 ‘하늘의 왕’이라는 신적 칭호는 보존했으며, 왕의 μεγαλωσύνη는 문맥상 왕에게서 베풀어지는 관대함/은혜를 가리키므로 자연스러운 한국어로 조정했습니다.
