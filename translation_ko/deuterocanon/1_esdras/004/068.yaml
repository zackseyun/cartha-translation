  source_fidelity: 그리스어의 청원 구조와 서원 어휘는 대체로 반영되어 있습니다. 다만 초안의 ‘이루게 해 주시기를’은 왕이 서원을 직접 이행하도록 청하는 ποιήσῃς를, 화자가 이행하도록 허락해 달라는 뜻으로도 읽히게 합니다. ‘이루어 주시기를’로 고쳐 왕의 행위와 발화/명령의 수단을 더 분명히 반영합니다.
