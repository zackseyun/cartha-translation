  rationale: 단순한 속성보다 왕에게서 비롯되는 위엄/관대함의 출처를 드러내는 구조를 반영했습니다.
- source_word: ποιήσῃς τὴν εὐχὴν
  english_pob_choice: you do the vow
  chosen_korean: 서원을 이루게 해 주시기를
  alternatives_korean:
  - 서원을 행하게 해 주시기를
  - 서원을 완수하게 해 주시기를
  - 서원을 지키게 해 주시기를
  lexicon: BDAG
  rationale: εὐχή를 여기서는 서원으로 보고, ‘do the vow’의 관용적 의미를 한국어에서 가장 자연스럽게 ‘이루다/이루게 하다’로 옮겼습니다.
- source_word: ἐκ στόματός σου
  english_pob_choice: by your mouth
  chosen_korean: 당신의 입으로
  alternatives_korean:
  - 당신의 말로
  - 당신의 명으로
  - 당신이 말씀하시는 대로
  lexicon: LSJ
  rationale: 직역 이미지인 ‘입으로’를 유지하되, 실제로는 왕의 공적 승인과 발화를 뜻하는 점을 한국어에서도 드러냈습니다.
