  yaml_path: translation/deuterocanon/1_esdras/004/037.yaml
  text: Wine is unjust[a], the king is unjust, women are unjust, and all the sons of men and all their works are unjust—all such things. And there is no truth in them, and in their injustice they will perish.
  footnotes:
  - marker: a
    text: Or 'all human beings'; Greek 'all the sons of men,' a masculine idiom for humanity.
    reason: lexical_alternative
translation:
  language: ko
  text: 포도주는 불의합니다[a]. 왕도 불의하고, 여자들도 불의하며, 사람의 아들들은 모두 불의하고 그들의 모든 일도 다 불의합니다. 그런 모든 것은 불의합니다. 그들 안에는 진실이 없고, 그들의 불의 가운데서 멸망할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 사람’; 그리스어 ‘사람의 아들들’은 인류를 가리키는 남성형 관용구입니다.
    reason: lexical_alternative
