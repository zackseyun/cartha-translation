  - 의롭지 않습니다
  rationale: 이 단락은 사람과 행위 전체가 야훼의 공의에 어긋난다는 총체적 선언이므로, '불의'가 법적·도덕적 결핍을 가장 직접적으로 드러냅니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 6
