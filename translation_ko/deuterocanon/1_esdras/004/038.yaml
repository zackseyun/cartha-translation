  text: And the truth remains and is strong forever, and lives and prevails forever and ever.
translation:
  language: ko
  text: 그리고 진리는 영원히 머물며 강합니다. 또한 영원히 영원히 살며, 이깁니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ἀλήθεια
  english_pob_choice: the truth
  chosen_korean: 진리
  alternatives_korean:
  - 그 진리
  - 진실
  lexicon: BDAG
  rationale: 관사로 강조된 ἀλήθεια의 인격화된 주어를 살리되, 한국어에서는 자연스럽게 단순 명사로 처리해 ‘진리’로 옮겼습니다.
- source_word: μένει
  english_pob_choice: remains
  chosen_korean: 머물며
  alternatives_korean:
  - 남으며
  - 계속하며
  - 존속하며
  lexicon: BDAG
  rationale: 지속성과 존속의 의미를 현대 한국어로 자연스럽게 담았습니다.
- source_word: ἰσχύει
  english_pob_choice: is strong
  chosen_korean: 강합니다
  alternatives_korean:
  - 힘이 있습니다
  - 강력합니다
  - 강합니다
  lexicon: BDAG
  rationale: μένει와 구별되는 내재적 강함을 드러내기 위해 ‘강합니다’로 옮겼습니다.
- source_word: ζῇ
  english_pob_choice: lives
  chosen_korean: 살며
  alternatives_korean:
  - 삽니다
  - 살아 있습니다
  lexicon: BDAG
  rationale: 진리가 살아 있다는 의인화를 보존하면서, 다음 동사와 병렬이 되도록 연결형으로 처리했습니다.
- source_word: κρατεῖ
  english_pob_choice: prevails
  chosen_korean: 이깁니다
  alternatives_korean:
  - 우세합니다
  - 우세를 보입니다
  - 다스립니다
  lexicon: BDAG
  rationale: 단순한 강함(ἰσχύει)과 구별되는 적극적 우위를 한국어로 가장 분명하게 드러낼 수 있는 동사로 옮겼습니다.
- source_word: εἰς τὸν αἰῶνα / εἰς τὸν αἰῶνα τοῦ αἰῶνος
  english_pob_choice: forever / forever and ever
  chosen_korean: 영원히 / 영원히 영원히
  alternatives_korean:
  - 영원토록 / 세세토록
  - 영원히 / 세세무궁히
  lexicon: BDAG
  rationale: 두 겹의 시간 표현을 구별해, 앞은 기본적 영속성, 뒤는 강화된 종결 표현으로 살렸습니다.
theological_decisions:
- issue: 진리의 의인화
  chosen_reading: ‘진리’가 머물고, 강하고, 살며, 이긴다는 문법을 그대로 살렸습니다.
  alternative_readings:
  - ‘진리는 영원합니다’처럼 의미를 추상화함
  - 의인적 동사를 완화해 ‘진리는 계속됩니다’로 처리함
  rationale: 원문이 진리를 추상명사로 평평하게 말하지 않고 능동적 속성을 부여하므로, 수사적 힘을 보존하는 쪽이 더 충실합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3, 6
