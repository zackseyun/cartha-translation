- source_word: ἡ ἀλήθεια
  english_pob_choice: the truth
  chosen_korean: 진리
  alternatives_korean:
  - 그 진리
  - 진실
  lexicon: BDAG
  rationale: 관사로 강조된 ἀλήθεια의 인격화된 주어를 살리되, 한국어에서는 자연스럽게 단순 명사로 처리해 ‘진리’로 옮겼습니다.
- source_word: μένει
  english_pob_choice: remains
