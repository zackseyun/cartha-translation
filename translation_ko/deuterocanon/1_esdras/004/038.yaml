  rationale: 지속성과 존속의 의미를 현대 한국어로 자연스럽게 담았습니다.
- source_word: ἰσχύει
  english_pob_choice: is strong
  chosen_korean: 강합니다
  alternatives_korean:
  - 힘이 있습니다
  - 강력합니다
  - 강합니다
  lexicon: BDAG
  rationale: μένει와 구별되는 내재적 강함을 드러내기 위해 ‘강합니다’로 옮겼습니다.
- source_word: ζῇ
  english_pob_choice: lives
  chosen_korean: 살며
  alternatives_korean:
  - 삽니다
  - 살아 있습니다
  lexicon: BDAG
  rationale: 진리가 살아 있다는 의인화를 보존하면서, 다음 동사와 병렬이 되도록 연결형으로 처리했습니다.
- source_word: κρατεῖ
  english_pob_choice: prevails
  chosen_korean: 이깁니다
  alternatives_korean:
  - 우세합니다
  - 우세를 보입니다
  - 다스립니다
  lexicon: BDAG
  rationale: 단순한 강함(ἰσχύει)과 구별되는 적극적 우위를 한국어로 가장 분명하게 드러낼 수 있는 동사로 옮겼습니다.
- source_word: εἰς τὸν αἰῶνα / εἰς τὸν αἰῶνα τοῦ αἰῶνος
  english_pob_choice: forever / forever and ever
  chosen_korean: 영원히 / 영원히 영원히
  alternatives_korean:
  - 영원토록 / 세세토록
  - 영원히 / 세세무궁히
  lexicon: BDAG
  rationale: 두 겹의 시간 표현을 구별해, 앞은 기본적 영속성, 뒤는 강화된 종결 표현으로 살렸습니다.
