base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/075.yaml
  text: And to all who go up from Babylonia to build the city[a], freedom is to belong to them and to their children[b], and to all the priests who go up.
  footnotes:
  - marker: a
    text: Or 'liberty shall be theirs.' The Greek says literally that 'freedom' is to belong to them.
    reason: lexical_alternative
  - marker: b
    text: '''Babylonia'' translates the regional term in Greek; some English versions simplify it to ''Babylon.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 바빌로니아에서[a] 올라와 그 성을 건설하는 모든 사람과 그들의 자녀, 그리고 올라오는 모든 제사장에게도 자유가[b] 주어져야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 도시명 Βαβυλών이 아니라 지역명 Βαβυλωνία를 쓰므로, 여기서는 “바빌로니아”로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 문자적으로 자유가 그들에게 ‘속해야 한다’고 말합니다. 여기서는 이를 “자유가 주어져야 합니다”로 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: πᾶσιν τοῖς προσβαίνουσιν
  english_pob_choice: to all who go up
  chosen_korean: 바빌로니아에서 올라와
  alternatives_korean:
  - 바빌로니아에서 오는
  - 바빌로니아에서 올라오는
  lexicon: LSJ
  rationale: 귀환·상승의 성격을 지닌 προσβαίνω를 성경적 지리 관용구인 “올라오다”로 살려, 예루살렘으로의 상승 의미를 드러냈습니다.
- source_word: ἀπὸ τῆς Βαβυλωνίας
  english_pob_choice: from Babylonia
  chosen_korean: 바빌로니아에서
  alternatives_korean:
  - 바빌론에서
  lexicon: LSJ
  rationale: 그리스어가 도시명 Βαβυλών이 아니라 지역명 Βαβυλωνία를 쓰므로, 더 정확한 “바빌로니아”를 택했습니다.
- source_word: κτίσαι τὴν πόλιν
  english_pob_choice: to build the city
  chosen_korean: 그 성을 건설하는
  alternatives_korean:
  - 그 성을 다시 세우는
  - 그 도시를 건설하는
  lexicon: LSJ
  rationale: κτίζω는 여기서 단순히 “건설하다/세우다”의 뜻이므로, 본문이 직접 말하지 않는 “다시”를 덧붙이지 않았습니다.
- source_word: ὑπάρχειν τὴν ἐλευθερίαν
  english_pob_choice: freedom is to belong
  chosen_korean: 자유가 있어야 하며
  alternatives_korean:
  - 자유가 그들에게 있어야 하며
  - 자유가 그들의 것이어야 하며
  lexicon: LSJ
  rationale: 주어진 자유가 그들에게 “속하다/있다”는 수여적 구문을 한국어로 자연스럽게 옮기되, 행정적 범위를 지나치게 특정하지 않았습니다.
theological_decisions:
- issue: ἐλευθερία의 범위와 성격
  chosen_reading: 법적 특권의 구체 항목을 특정하지 않고 “자유”로 넓게 옮겼습니다.
  alternative_readings:
  - 면세나 면역 같은 더 좁은 행정적 권리로 구체화하기
  - “자유/자치”로 해석을 좁히기
  rationale: 본문은 자유가 수여된다고만 말할 뿐 그 법적 내용을 규정하지 않으므로, 원문의 긴장을 보존하기 위해 포괄적으로 번역했습니다.
  doctrine_reference: 원문 우선과 과도한 제도화 해석의 보류
