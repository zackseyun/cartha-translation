  text: 우리 각자가 이길 한 가지 말을 합시다[a]. 그리고 누구의 말이 다른 이의 말보다 더 지혜롭게 보이면, 다리오 왕이 그에게 큰 선물과 승리의 큰 상을 줄 것입니다[b].
