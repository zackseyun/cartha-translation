translation:
  language: ko
  text: 우리 각 사람이 하나의 말을 하여 이기게 합시다[a]. 그리고 누구의 말이 다른 사람의 것보다 더 지혜롭게 보이면, 다리오 왕이 그에게 큰 선물과 큰 승리의 상을 줄 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘하나의 말/진술’입니다. λόγος는 여기서 한마디 발언이나 논거를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ἐπινίκια는 승리자에게 주어지는 상이나 영예를 뜻합니다.
    reason: lexical_alternative
