base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/044.yaml
  text: and all the vessels taken from Jerusalem are to be sent back[a], which Cyrus set apart when he vowed to destroy Babylon[b], and vowed to send there.
  footnotes:
  - marker: a
    text: Or 'those that Cyrus designated, when he resolved to destroy Babylon, and to send them there.' The Greek wording is compressed and somewhat awkward, especially in the repeated 'vowed/resolved' clauses.
    reason: lexical_alternative
  - marker: b
    text: That is, the temple vessels taken from Jerusalem were to be returned. 'There' likely refers to Jerusalem, though the Greek expresses it tersely.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 예루살렘에서 가져온 모든 기물도 다시 보내어야 합니다[a]. 이는 고레스가 바빌론을 멸하려고 서원했을 때 따로 구별해 둔 것들이며[b], 또한 거기로 보내겠다고 서원한 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘고레스가 바빌론을 멸하려고 결심했을 때 지정한 것들’로도 옮길 수 있습니다. 그리스어 표현은 매우 압축되어 있어, 반복되는 ‘서원하다’ 구문이 다소 어색합니다.
    reason: lexical_alternative
  - marker: b
    text: 즉 예루살렘에서 가져간 성전 기물들이 다시 돌아가야 한다는 뜻입니다. ‘거기’는 문맥상 예루살렘을 가리키는 것으로 보이지만, 그리스어는 매우 간략하게 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: σκεύη
  english_pob_choice: vessels
  chosen_korean: 기물
  alternatives_korean:
  - 그릇
  - 용기
  - 제기
  lexicon: LSJ
  rationale: 성전 문맥의 σκεύη는 단순한 일반 물건보다 성전 관련 기물·그릇을 가리키므로, 한국어에서는 보다 넓고 공적인 의미의 ‘기물’이 적절합니다.
- source_word: τὰ λημφθέντα ἐξ Ἰερουσαλήμ
  english_pob_choice: taken from Jerusalem
  chosen_korean: 예루살렘에서 가져온
  alternatives_korean:
  - 예루살렘에서 빼앗긴
  - 예루살렘에서 취한
  lexicon: LSJ
  rationale: 문맥상 예루살렘에서 옮겨져 나온 성전 기물을 가리키므로, 원문의 수동적 결과를 살리면서도 한국어에서는 자연스러운 ‘가져온’으로 옮겼습니다.
- source_word: ἐκπέμψαι
  english_pob_choice: are to be sent back
  chosen_korean: 다시 보내어야 합니다
  alternatives_korean:
  - 되돌려 보내야 합니다
  - 보내야 합니다
  lexicon: LSJ
  rationale: 직역하면 ‘보내다’이지만, 여기서는 예루살렘으로의 환송을 뜻하므로 ‘다시 보내다’가 방향성을 가장 분명하게 드러냅니다.
- source_word: ἐχώρισεν
  english_pob_choice: set apart
  chosen_korean: 따로 구별해 둔
  alternatives_korean:
  - 분리해 둔
  - 지정해 둔
  lexicon: LSJ
  rationale: 고레스가 이 기물들을 환송 대상으로 따로 정해 두었다는 행정적·구별적 뉘앙스를 살리기 위해 ‘따로 구별해 둔’을 선택했습니다.
- source_word: ηὔξατο
  english_pob_choice: vowed
  chosen_korean: 서원했을 때
  alternatives_korean:
  - 맹세했을 때
  - 약속했을 때
  - 기도했을 때
  lexicon: LSJ
  rationale: 반복되는 부정사구와 함께 쓰여 엄숙한 서원/서약을 가리키므로, 한국어 성경 문맥에 맞는 ‘서원했다’를 택했습니다.
theological_decisions:
- issue: ηὔξατο와 ἐκκόψαι Βαβυλῶνα의 압축된 표현을 얼마나 매끄럽게 풀 것인가
  chosen_reading: ‘바빌론을 멸하려고 서원했다’로 옮겨 원문의 폭력적·단정적 표현을 완화하지 않고 전달했습니다.
  alternative_readings:
  - ‘바빌론을 끊어내려고 서원했다’
  - ‘바빌론을 치러/무너뜨리려고 서원했다’
  rationale: 이 절은 신학 논쟁보다 역사 서술의 압축성과 어색함이 핵심이므로, 본문이 가진 거친 표현을 평탄화하지 않고 그대로 드러내는 편이 원문 투명성에 더 부합합니다.
  doctrine_reference: '번역 원칙: 원문 우선, 과도한 순화 금지'
- issue: ἐκεῖ의 지시 대상이 어디인가
  chosen_reading: ‘거기로’는 앞선 환송의 방향, 곧 예루살렘을 가리키는 것으로 읽었습니다.
  alternative_readings:
  - 바빌론으로
  - 그곳으로
  rationale: 영어 POB 주석처럼 그 지시어는 문맥상 예루살렘을 가리키는 것으로 보는 편이 자연스럽지만, 원문은 매우 압축적이므로 본문에서는 모호성을 완전히 해소하지 않고 ‘거기로’로 남겨 두었습니다.
  doctrine_reference: '번역 원칙: 모호성 보존 및 주석화'
