base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/044.yaml
  text: and all the vessels taken from Jerusalem are to be sent back[a], which Cyrus set apart when he vowed to destroy Babylon[b], and vowed to send there.
  footnotes:
  - marker: a
    text: Or 'those that Cyrus designated, when he resolved to destroy Babylon, and to send them there.' The Greek wording is compressed and somewhat awkward, especially in the repeated 'vowed/resolved' clauses.
    reason: lexical_alternative
  - marker: b
    text: That is, the temple vessels taken from Jerusalem were to be returned. 'There' likely refers to Jerusalem, though the Greek expresses it tersely.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 예루살렘에서 가져온 모든 기물도 다시 보내야 합니다. 그것들은 고레스가 바빌론을 멸하겠다고 서원했을 때[a] 따로 구별해 둔 것이며, 또 거기로 보내겠다고 서원한 것들입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘고레스가 바빌론을 멸하기로 결심했을 때 지정한 것들’로 옮길 수 있습니다. 그리스어 표현은 매우 압축되어 있으며, ‘서원하다’에 해당하는 동사가 반복되어 다소 어색하게 들립니다.
    reason: lexical_alternative
  - marker: b
    text: 즉 예루살렘에서 가져간 성전 기물들이 다시 돌아가야 한다는 뜻입니다. ‘거기’는 문맥상 예루살렘을 가리키는 것으로 보이지만, 그리스어는 이를 매우 간략하게 표현합니다.
    reason: alternative_reading
