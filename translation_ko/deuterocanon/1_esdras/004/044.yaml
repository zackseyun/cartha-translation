  - ‘바빌론을 치러/무너뜨리려고 서원했다’
  rationale: 이 절은 신학 논쟁보다 역사 서술의 압축성과 어색함이 핵심이므로, 본문이 가진 거친 표현을 평탄화하지 않고 그대로 드러내는 편이 원문 투명성에 더 부합합니다.
  doctrine_reference: '번역 원칙: 원문 우선, 과도한 순화 금지'
- issue: ἐκεῖ의 지시 대상이 어디인가
  chosen_reading: ‘거기로’는 앞선 환송의 방향, 곧 예루살렘을 가리키는 것으로 읽었습니다.
  alternative_readings:
  - 바빌론으로
  - 그곳으로
  rationale: 영어 POB 주석처럼 그 지시어는 문맥상 예루살렘을 가리키는 것으로 보는 편이 자연스럽지만, 원문은 매우 압축적이므로 본문에서는 모호성을 완전히 해소하지 않고 ‘거기로’로 남겨 두었습니다.
  doctrine_reference: '번역 원칙: 모호성 보존 및 주석화'
