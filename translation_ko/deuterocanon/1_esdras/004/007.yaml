  text: And the second will sit beside Darius because of his wisdom[b][a], and he will be called a kinsman of Darius.
  footnotes:
  - marker: a
    text: Or, 'will be seated' or 'will sit down' with Darius; the Greek verb primarily refers to being seated, and the exact nuance of rank or proximity is inferred from the royal setting.
    reason: lexical_alternative
  - marker: b
    text: '''Kinsman'' may denote a relative or an honorific designation of close association with Darius.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 둘째는 그의 지혜 때문에 다리우스 곁에 앉을 것이며, 다리우스의 친족이라 불릴 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘앉을 것이다’ 또는 ‘앉게 될 것이다’입니다. 다리우스 곁에 앉는다는 표현은 왕실 문맥에서 지위나 가까운 관계를 암시할 수 있지만, 그 정확한 뉘앙스는 문맥에 따라 판단됩니다.
    reason: lexical_alternative
  - marker: b
    text: ‘친족’은 실제 혈연 친척을 뜻할 수도 있고, 다리우스와 가까운 관계를 나타내는 명예상의 호칭일 수도 있습니다.
    reason: lexical_alternative
