base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/041.yaml
  text: And he stopped speaking; and then all the people cried out[a], and then they said, “Great is the truth, and it prevails.”
  footnotes:
  - marker: a
    text: Or “Great is truth, and it is strongest / overcomes.” The Greek verb can mean “prevails,” “is strongest,” or “overcomes.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말을 그치자, 온 백성이 그때 외쳤고, 이어서 이렇게 말하였습니다. “진리는 위대하며, 진리가 이깁니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “진리는 위대하며, 가장 강합니다 / 이깁니다.” ὑπερισχύει는 ‘이기다’, ‘우세하다’, ‘더 강하다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσιώπησεν τοῦ λαλεῖν
  english_pob_choice: stopped speaking
  chosen_korean: 말하기를 그치자
  alternatives_korean:
  - 말을 멈추자
  - 침묵하자
  - 말하기를 멈추자
  lexicon: LSJ
  rationale: ἐσιώπησεν은 ‘침묵하다/말을 그치다’의 완료된 동작을 나타내므로, 한국어에서는 결과를 자연스럽게 드러내는 ‘말하기를 그치자’가 가장 잘 맞습니다.
- source_word: πᾶς ὁ λαός
  english_pob_choice: all the people
  chosen_korean: 온 백성
  alternatives_korean:
  - 모든 백성
  - 온 백성이
  - 백성 전체
  lexicon: LSJ
  rationale: λαός는 모인 공동체 전체를 가리키므로, 자연스러운 집합명사인 ‘온 백성’으로 옮기되 과도한 현대화는 피했습니다.
- source_word: ἐφώνησεν
  english_pob_choice: cried out
  chosen_korean: 외쳐 말하였습니다
  alternatives_korean:
  - 소리쳐 말하였습니다
  - 외쳤습니다
  - 크게 외쳤습니다
  lexicon: LSJ
  rationale: 공동체의 공개적 환호를 살리면서도 한국어 성경문체에 맞게 ‘외쳐 말하였습니다’로 풀어, 단순한 음량보다 집단적 응답의 뉘앙스를 살렸습니다.
- source_word: Μεγάλη ἡ ἀλήθεια
  english_pob_choice: Great is the truth
  chosen_korean: 진리는 위대하며
  alternatives_korean:
  - 진리는 크며
  - 진리는 위대합니다
  - 진리는 크다
  lexicon: LSJ
  rationale: 형용사-서술 구문을 한국어의 선언형으로 옮겨, 경구적·찬탄적 어조를 유지했습니다. άρθρο가 있는 ἡ ἀλήθεια는 추상적 ‘진리’가 아니라 그 진리의 현실성을 가리킨다고 보았습니다.
- source_word: ὑπερισχύει
  english_pob_choice: it prevails
  chosen_korean: 진리가 이깁니다
  alternatives_korean:
  - 진리가 우세합니다
  - 진리가 승리합니다
  - 진리가 능가합니다
  lexicon: LSJ
  rationale: ὑπερισχύει는 ‘더 강하다, 이기다, 우세하다’의 뜻이므로, 한국어에서는 공적 선언에 자연스러운 ‘이깁니다’로 압축해 승리·우세의 의미를 살렸습니다.
theological_decisions:
- issue: 공동체의 응답을 직접화법으로 처리할지 여부
  chosen_reading: 직접화법으로 「진리는 위대하며, 진리가 이깁니다.」를 제시했습니다.
  alternative_readings:
  - 간접화법으로 ‘진리가 위대하며, 진리가 이긴다고 말했습니다.’
  rationale: 그리스어 원문은 군중의 즉각적 외침을 직접 인용하므로, 한국어도 직접화법을 유지하는 편이 현장감과 수사적 힘을 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §§1, 5
