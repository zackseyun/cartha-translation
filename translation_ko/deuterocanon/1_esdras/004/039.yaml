translation:
  language: ko
  text: 그녀에게는 편파성[a]도 차별[b]도 없고, 오직 모든 불의하고 악한 것과는 달리 의로운 일만 하며, 모든 사람이 그녀의 일들을 좋게 여깁니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어를 직역하면 ‘그녀와 함께는 얼굴을 받음이 없다’이며, 곧 편파를 보이지 않는다는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘구별도 없고’로 옮길 수 있습니다.
    reason: lexical_alternative
