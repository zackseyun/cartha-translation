translation:
  language: ko
  text: 그리고 성을 지키는 모든 사람들에게는, 배당과 삯이 주어지도록 그가 기록했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘배당’은 여기서 제비뽑기보다 ‘배분된 몫/할당분’의 뜻으로 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσι τοῖς φρουροῦσι
  english_pob_choice: to all who guarded
  chosen_korean: 성을 지키는 모든 사람들에게
  alternatives_korean:
  - 성을 지키던 모든 사람들에게
  - 성을 지키고 있던 모든 사람들에게
  - 성을 경비하는 모든 사람들에게
  lexicon: LSJ
  rationale: φρουρέω는 ‘지키다, 경비하다’의 뜻이므로 문맥의 군사적·보호적 의미를 살려 ‘성을 지키는’으로 옮겼습니다.
- source_word: ἔγραψε
  english_pob_choice: he wrote that
  chosen_korean: 기록했습니다
  alternatives_korean:
  - 써서 명했습니다
  - 기록하여 주도록 했습니다
  - 써서 지시했습니다
  lexicon: LSJ
  rationale: 행정적 문맥에서 ἔγραψε는 서면 지시를 가리키므로, 한국어에서는 ‘기록했습니다’로 옮겨 서면 명령의 성격을 살렸습니다.
- source_word: κλήρους
  english_pob_choice: allotments
  chosen_korean: 배당
  alternatives_korean:
  - 몫
  - 배분된 몫
  - 할당분
  lexicon: LSJ
  rationale: κλῆρος는 여기서 ‘제비’보다 배분된 몫/몫 배당의 뜻이 자연스러워, ὀψώνια와 함께 행정적 지급 항목으로 읽히게 ‘배당’으로 옮겼습니다.
- source_word: ὀψώνια
  english_pob_choice: wages
  chosen_korean: 삯
  alternatives_korean:
  - 품삯
  - 급료
  - 보수
  lexicon: BDAG
  rationale: ὀψώνια는 보수·급료·삯의 뜻이 있어, 군사/노무 맥락에서 넓고도 자연스러운 한국어인 ‘삯’을 택했습니다.
theological_decisions:
- issue: 서면 명령의 성격을 어떻게 드러낼지
  chosen_reading: ‘기록했습니다’로 옮겨, 단순한 서술이 아니라 지급을 지시하는 문서 행위임을 드러냈습니다.
  alternative_readings:
  - ‘명령했습니다’
  - ‘써서 지시했습니다’
  rationale: 원문 ἔγραψε는 ‘썼다’이지만, 여기서는 공문성 있는 지시를 전하는 서술이므로 문서화된 명령의 성격을 보존하는 것이 좋습니다.
  doctrine_reference: 문맥적 서술 원칙
