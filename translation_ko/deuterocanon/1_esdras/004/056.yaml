  source_fidelity: 개정이 필요합니다. 초안의 ‘기록했습니다’는 ἔγραψε(‘그가 썼다’)를 지나치게 일반적인 기록 행위로 들리게 하며, 이어지는 부정사 δοῦναι의 지시·명령 내용을 한국어에서 충분히 드러내지 못합니다. ‘주도록 글로 지시했습니다’는 서면 행위와 지급 지시를 모두 자연스럽게 보존합니다. κλήρους는 문맥상 ‘배분된 몫’으로 옮길 수 있으나, 문자적으로는 ‘제비들/제비로 정한 몫들’의 여지가 있으므로 주석으로 남기는 것이 적절합니다.
  naturalness: ‘성을 지키는 모든 사람들에게는, 배당과 삯이 주어지도록 그가 기록했습니다’는 조사와 쉼표가 다소 부자연스럽고, ‘배당’은 지급되는 구체적 항목보다 배분 행위로 읽힐 수 있습니다. ‘성을 지키는 모든 사람에게 몫과 급료를 주도록 그가 글로 지시했습니다’가 현대 표준어 합쇼체에서 더 명료하고 자연스럽습니다.
  terminology: φρουροῦσι는 ‘성을 지키는’, ὀψώνια는 이 행정·경비 문맥에서 ‘급료’로 옮기는 것이 적절합니다. κλήρους는 ‘몫’으로 번역하고, ‘제비’라는 문자적 의미 및 할당된 몫이라는 해석을 주석에서 밝혀 의미 폭을 보존합니다.
