base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/071.yaml
  text: And he wrote to all the Jews who were going up from the kingdom to Judea concerning their freedom[a], that no official, satrap, governor, or steward should come against their doors[b],
  footnotes:
  - marker: a
    text: Or 'for their exemption' or 'regarding their liberty.' The Greek uses the ordinary word for 'freedom,' but in this administrative context it may refer to a legal privilege or immunity.
    reason: lexical_alternative
  - marker: b
    text: Literally 'should not come against their doors,' likely meaning that officials were not to intrude on them at their homes or press claims against them there.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 왕국에서 유대로 올라가는 모든 유대인들에게 그들의 자유에 관하여[a] 기록하여, 어떤 관리나 사트라프나 총독이나 청지기도 그들의 문에[b] 들이닥치지 못하게 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 면제에 관하여’, ‘그들의 자유를 위하여’. 그리스어는 일반적인 ‘자유’라는 말을 쓰지만, 이 행정 문맥에서는 법적 특권이나 면제를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들의 문들에 (맞서)’입니다. 아마도 관리들이 그들의 집에 들이닥치거나 그곳에서 요구를 강요하지 못하게 한다는 뜻일 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς ἀναβαίνουσιν ἀπὸ τῆς βασιλείας εἰς τὴν Ἰουδαίαν
  english_pob_choice: who were going up from the kingdom to Judea
  chosen_korean: 왕국에서 유대로 올라가는
  alternatives_korean:
  - 왕국에서 유대로 돌아가는
  - 왕국에서 유대로 올라가던
  lexicon: LSJ
  rationale: ἀναβαίνω의 기본 의미인 ‘올라가다’를 살리면서, 귀환 맥락이지만 과도하게 ‘돌아가다’로 풀지 않았습니다.
- source_word: ὑπὲρ τῆς ἐλευθερίας
  english_pob_choice: concerning their freedom
  chosen_korean: 그들의 자유에 관하여
  alternatives_korean:
  - 그들의 면제에 관하여
  - 그들의 자유를 위하여
  lexicon: LSJ
  rationale: ἐλευθερία의 기본 뜻을 ‘자유’로 유지하되, 행정 문맥에서의 법적 면제 가능성은 주석으로 남겼습니다.
- source_word: πάντα δυνατὸν καὶ σατράπην καὶ τοπάρχην καὶ οἰκονόμον
  english_pob_choice: no official, satrap, governor, or steward
  chosen_korean: 어떤 관리나 사트라프나 총독이나 청지기도
  alternatives_korean:
  - 어떤 유력자나 사트라프나 지방장관이나 청지기도
  - 어떤 권력자나 사트라프나 지역 통치자나 청지기도
  lexicon: LSJ
  rationale: πάντα δυνατὸν은 직역하면 어색하므로, 뒤따르는 관직 목록이 가리키는 행정 권한자를 포괄하는 ‘관리’로 처리했습니다. σατράπην은 역사적 특수성을 살려 음역했습니다.
- source_word: μὴ ἐπελεύσεσθαι ἐπὶ τὰς θύρας αὐτῶν
  english_pob_choice: should not come against their doors
  chosen_korean: 그들의 문 앞에 들이닥치지 못하게 하였습니다
  alternatives_korean:
  - 그들의 문에 들이닥치지 못하게 하였습니다
  - 그들의 집 문 앞에 들어오지 못하게 하였습니다
  lexicon: LSJ
  rationale: ‘doors’의 문자적 이미지를 유지하되, 한국어에서 자연스러운 위협적 침입의 뉘앙스를 살리기 위해 ‘들이닥치다’를 택했습니다.
theological_decisions:
- issue: Administrative liberty in a royal decree
  chosen_reading: 그들의 자유에 관하여
  alternative_readings:
  - 그들의 면제에 관하여
  - 그들의 특권에 관하여
  rationale: 이 구절은 영적 자유가 아니라 왕의 행정적 보호/면제에 관한 내용이므로, 원문의 ἐλευθερία를 살리면서도 정확한 법적 성격은 단정하지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve ambiguity where the source does not specify more precisely.'
