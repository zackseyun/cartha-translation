  yaml_path: translation/deuterocanon/1_esdras/004/031.yaml
  text: And besides this[a], the king stared at her with his mouth open; and if she laughs at him, he laughs; but if she is offended with him[b], he flatters her so that she may be reconciled to him.
  footnotes:
  - marker: a
    text: Or, 'if she laughs with him, he laughs.' The Greek dative after 'laughs' can be understood in more than one way.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek image is vivid: literally, ''the king, gaping with his mouth, was looking at her.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이뿐 아니라 왕은 입을 벌린 채 그녀를 바라보고 있었습니다. 그녀가 그에게 웃으면 그도 웃습니다. 그러나 그녀가 그에게 언짢아하면, 그는 그녀가 자기와 화해하도록 그녀에게 아첨합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρὸς τούτοις
  english_pob_choice: besides this
  chosen_korean: 그리고 이 외에도
  alternatives_korean:
  - 더구나
  - 이 일 외에도
  lexicon: LSJ
  rationale: 앞 구절에 덧붙는 연결어이므로, 추가성을 자연스럽게 살리는 표현으로 옮겼습니다.
- source_word: χάσκων τὸ στόμα ἐθεώρει αὐτήν
  english_pob_choice: stared at her with his mouth open
  chosen_korean: 입을 벌린 채 그녀를 바라보았으며
  alternatives_korean:
  - 입을 벌리고 그녀를 빤히 바라보았으며
  - 입을 벌린 채 그녀를 응시하였으며
  lexicon: LSJ
  rationale: ‘입을 벌린 채’로 열린 입의 이미지를 살리고, ‘바라보았다’로 지속적 시선을 자연스럽게 표현했습니다.
- source_word: κολακεύει αὐτὴν
  english_pob_choice: he flatters her
  chosen_korean: 그는 그녀에게 아첨하여
  alternatives_korean:
  - 그는 그녀를 아첨하여
  - 그는 그녀에게 비위를 맞추어
  lexicon: LSJ
  rationale: κολακεύω의 핵심 의미를 직접적으로 드러내되, 권력 불균형이 느껴지는 한국어로 옮겼습니다.
- source_word: ὅπως διαλλαγῇ αὐτῷ
  english_pob_choice: so that she may be reconciled to him
  chosen_korean: 그녀가 그와 화해하게 합니다
  alternatives_korean:
  - 그녀가 그와 화목하게 하려고
  - 그녀가 그에게 다시 받아들여지게 하려고
  lexicon: BDAG
  rationale: διαλλάσσω 계열의 관계 회복 의미를 살려 ‘화해하다’로 옮겼고, 목적절 ὅπως의 뜻을 드러냈습니다.
