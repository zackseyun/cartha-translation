  yaml_path: translation/deuterocanon/1_esdras/004/064.yaml
  text: Then the king said to him, “Ask for whatever you want beyond what has been written, and we will give it to you, since you have been found wiser; and you shall sit next to me, and you shall be called my kinsman.”
translation:
  language: ko
  text: 그때 왕이 그에게 말했습니다. "기록된 것보다 더 원하는 것을 구하라. 그러면 우리가 그것을 주겠다. 너는 지혜로운 사람으로 인정되었으니, 내 곁에 앉게 될 것이며 내 친족이라 불릴 것이다."
  philosophy: formal
lexical_decisions:
- source_word: Αἴτησαι ὃ θέλεις πλείω τῶν γεγραμμένων
  english_pob_choice: Ask for whatever you want beyond what has been written
  chosen_korean: 기록된 것보다 더 원하는 것을 구하라
  alternatives_korean:
  - 네가 원하는 것을 기록된 것보다 더 많이 구하라
  - 기록된 범위를 넘어 원하는 것을 청하라
  lexicon: αἰτέω / γράφω
  rationale: 구하라로 αἴτησαι의 요청 의미를 살리고, πλείω τῶν γεγραμμένων은 ‘기록된 것보다 더’로 자연스럽게 옮겨 범위를 분명히 했습니다.
- source_word: ἐχόμενός μου καθήσῃ
  english_pob_choice: you shall sit next to me
  chosen_korean: 내 곁에 앉게 될 것이며
  alternatives_korean:
  - 내 옆에 앉게 될 것이며
  - 내 곁에 자리를 잡게 될 것이며
  lexicon: ἐχόμενος / καθίζω
  rationale: ἐχόμενός μου는 단순한 공간적 근접을 넘어 왕과의 특별한 동석을 뜻하므로 ‘내 곁에’로 간결하게 처리했습니다.
- source_word: συγγενής μου κληθήσῃ
  english_pob_choice: you shall be called my kinsman
  chosen_korean: 내 친족이라 불릴 것이다
  alternatives_korean:
  - 내 친족으로 불릴 것이다
  - 내 혈육이라 불릴 것이다
  lexicon: συγγενής / καλέω
  rationale: συγγενής는 친족, 혈족의 뜻이지만 직역을 지나치게 좁히지 않도록 ‘친족’으로 옮겼습니다.
theological_decisions:
- issue: 왕의 보상 약속을 어떻게 전달할지
  chosen_reading: 권위자가 지혜를 인정한 자에게 특별한 지위를 약속하는 장면으로, 본문의 정치적·서사적 긴장을 그대로 유지했습니다.
  alternative_readings:
  - 종교적 승격으로 완화하여 표현
  - 단순한 호의로만 축소하여 표현
  rationale: 이 절은 신학적 용어보다 왕의 관대함과 지혜의 보상이라는 서사적 의미가 핵심이므로, 과장하거나 완화하지 않고 직접적으로 옮겼습니다.
  doctrine_reference: 서사 본문 번역 원칙
- issue: 지혜의 원인 접속사 처리
  chosen_reading: ‘since you have been found wiser’를 ‘지혜로운 사람으로 인정되었으니’로 옮겨 원인과 판정의 뉘앙스를 함께 살렸습니다.
  alternative_readings:
  - 지혜롭다고 여겨졌으니
  - 더 지혜로 드러났으니
  rationale: ἐχόμενος와 함께 이어지는 보상 이유를 자연스러운 한국어로 풀어, 단순한 비교가 아니라 판정된 지혜를 드러내었습니다.
  doctrine_reference: 서사 본문 번역 원칙
