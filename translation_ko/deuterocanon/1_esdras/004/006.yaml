  text: and to put on purple[a], and to drink from gold vessels, and to sleep on gold, and a chariot with gold bridles, and a turban of fine linen, and a necklace around the neck[c][b],
  footnotes:
  - marker: a
    text: Or 'drink in golden cups' / 'drink from golden vessels'; the Greek expression specifies the use of gold objects for drinking but does not name the exact vessel type.
    reason: lexical_alternative
  - marker: b
    text: Literally 'sleep on gold'; this likely refers to a gold-decorated bed or couch, but the noun for bed/couch is not stated in the Greek.
    reason: lexical_alternative
  - marker: c
    text: The phrase rendered 'a chariot with gold bridles' may more broadly mean a chariot with golden harness or fittings.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 자주색 옷을 입고, 금그릇으로 마시고, 금 위에서 자고, 금 재갈을 단 병거와, 세마포 터번과, 목에 맨 목걸이를 가지는 것까지 말입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 마시는 데 금으로 된 물건을 사용한다는 뜻을 분명히 하지만, 잔인지 그릇인지의 정확한 형태는 밝히지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 '금 위에서 잠자다'입니다. 금으로 장식한 침상이나 의자를 가리킬 가능성이 있지만, 원문에는 침상이라는 명사가 없습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 표현은 금으로 된 굴레, 재갈, 혹은 더 넓은 마구 장식을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορφύραν περιβαλέσθαι
  english_pob_choice: to put on purple
  chosen_korean: 자주색 옷을 입고
  alternatives_korean:
  - 자주색을 두르고
  - 자주색 옷을 걸치고
  lexicon: LSJ
  rationale: περιβαλέσθαι는 몸에 걸쳐 입는 동작이므로, 한국어에서는 자연스럽고 구체적인 '옷을 입다'로 옮겼습니다. πορφύραν의 색채와 위신적 뉘앙스는 '자주색'으로 살렸습니다.
- source_word: ἐν χρυσώμασιν πίνειν
  english_pob_choice: to drink from gold vessels
  chosen_korean: 금그릇으로 마시고
  alternatives_korean:
  - 금잔으로 마시고
  - 금 그릇에서 마시고
  lexicon: LSJ
  rationale: 원문은 마시는 데 금으로 된 물건을 사용한다는 뜻이지 그릇의 정확한 형태를 특정하지 않으므로, 과도하게 좁히지 않도록 '금그릇'으로 옮겼습니다. 조사 '으로'는 수단을 자연스럽게 나타냅니다.
- source_word: ἐπὶ χρυσῷ καθεύδειν
  english_pob_choice: to sleep on gold
  chosen_korean: 금 위에서 자고
  alternatives_korean:
  - 금으로 된 침상에서 자고
  - 금 장식 침상에서 자고
  lexicon: LSJ
  rationale: 영문 POB처럼 침상 자체를 덧붙이지 않고, 그리스어의 압축된 표현을 그대로 살려 '금 위에서'로 두었습니다. 사치의 이미지를 유지하면서도 원문이 말하지 않은 '침상'을 단정하지 않게 합니다.
- source_word: κίδαριν βυσσίνην
  english_pob_choice: a turban of fine linen
  chosen_korean: 세마포 터번
  alternatives_korean:
  - 고운 베 터번
  - 세마포로 된 관
  lexicon: LSJ
  rationale: κίδαρις는 터번/머리쓰개를 가리키므로 현대 독자가 이해할 수 있는 '터번'을 택했고, βυσσίνην은 고급 세마포를 뜻하여 '세마포'로 옮겼습니다. 전통적 관보다 원문의 착용물을 더 직접적으로 드러냅니다.
- source_word: μανιάκην περὶ τὸν τράχηλον
  english_pob_choice: a necklace around the neck
  chosen_korean: 목에 맨 목걸이를
  alternatives_korean:
  - 목에 두른 목장식
  - 목에 건 목걸이를
  lexicon: LSJ
  rationale: μανιάκη는 목장식/목걸이 계열의 장신구이므로 가장 자연스러운 현대어인 '목걸이'를 택했습니다. περὶ τὸν τράχηλον은 위치를 분명히 하여 '목에 맨'으로 살렸습니다.
