  rationale: 이 절은 사치의 구체적 표지들을 나열하는 것이 핵심이므로, 추상화하면 수사적 힘과 비교의 선명함이 약해집니다. 원문의 재료성과 물건성을 보존하는 것이 본문의 의도를 더 잘 전달합니다.
