  text: And they said[a], “When the king rises, they will give him the writing; and whoever the king and the three nobles of Persia judge that his argument is wiser, to him the victory will be given[b], as it is written.”
  footnotes:
  - marker: a
    text: Or “the letter” or “the document” for “the writing” (τὸ γράμμα).
    reason: lexical_alternative
  - marker: b
    text: Or “his speech is wiser” or “his case is wiser” for “his argument is wiser” (ὁ λόγος αὐτοῦ σοφώτερος).
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들이 말했습니다. 「왕이 일어나면 그에게 그 문서[a]를 줄 것이며, 왕과 바사의 세 고관이 누구의 논변[b]이 더 지혜롭다고 판정하든, 기록된 대로 그 사람에게 승리가 주어질 것입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 γράμμα는 여기서 ‘문서’, ‘편지’, ‘글’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 ὁ λόγος αὐτοῦ σοφώτερος는 ‘그의 말이 더 지혜롭다’ 또는 ‘그의 논변이 더 지혜롭다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ γράμμα
  english_pob_choice: the writing
  chosen_korean: 그 문서
  alternatives_korean:
  - 그 글
  - 그 편지
  - 그 기록물
  lexicon: BDAG
  rationale: 이 문맥의 γράμμα는 개인 서신보다 왕에게 제출되는 공식 문서를 가리키므로, 한국어에서는 자연스럽고 공적 성격이 드러나는 ‘문서’가 가장 적절합니다.
- source_word: ὁ λόγος αὐτοῦ σοφώτερος
  english_pob_choice: his argument is wiser
  chosen_korean: 누구의 말이 더 지혜롭다고
  alternatives_korean:
  - 누구의 논변이 더 지혜롭다고
  - 누구의 말이 더 현명하다고
  - 누구의 발언이 더 지혜롭다고
  lexicon: BDAG
  rationale: λόγος는 단순한 ‘한마디’보다 이 대결 장면에서의 발언·논증을 뜻하므로, 한국어에서는 심판의 비교 구도를 살리면서도 자연스러운 ‘말이 더 지혜롭다’로 옮겼습니다.
- source_word: τὸ νῖκος
  english_pob_choice: the victory
  chosen_korean: 승리
  alternatives_korean:
  - 이김
  - 우승
  - 이긴 자
  lexicon: LSJ
  rationale: νῖκος는 경쟁에서 주어지는 승리를 뜻하므로, 한국어에서는 결과를 분명히 드러내는 ‘승리’로 옮기는 것이 가장 직접적입니다.
- source_word: ὅταν ἐγερθῇ ὁ βασιλεύς
  english_pob_choice: When the king rises
  chosen_korean: 왕이 일어나면
  alternatives_korean:
  - 왕이 일어설 때
  - 왕이 잠에서 깨어나면
  - 왕이 자리에서 일어나면
  lexicon: BDAG
  rationale: ἐγερθῇ는 왕이 자리에서 일어나는 동작을 가리키므로, 과도하게 구체화하지 않고 현대 한국어로 자연스러운 조건절 ‘왕이 일어나면’으로 옮겼습니다.
