translation:
  language: ko
  text: 그리고 그들이 차지하게 될 모든 땅에 대하여 그들에게 조세를 면제하고[a], 갈대아인들이 자신들이 장악하고 있는 유대인들의 마을들을 떠나게 하십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘조세를 면제하고’는 그 땅에 부과되는 세금이나 공납을 면제한다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘갈대아인들’은 그리스어 표현을 따른 것입니다. 역사적 문맥에서는 더 넓게 바빌로니아인들을 가리키는 것으로 이해되기도 합니다.
    reason: lexical_alternative
