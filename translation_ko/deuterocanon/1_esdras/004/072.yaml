review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. κρατήσουσιν은 미래형이므로 ‘소유하는’보다 ‘차지하게 될’이 원문의 시간적·법령적 전망을 더 잘 반영합니다. 또한 διακρατοῦσιν은 갈대아인들이 현재 붙들고 있는 마을들을 뜻하므로 ‘자신들이 장악하고 있는’을 사용해 현재적 지속성을 드러냈습니다.
  naturalness: 초안의 ‘그들에게 세금이 면제되게 하며’는 문법적으로 가능하지만, 무엇에 대해 면제되는지 다소 불분명합니다. ‘모든 땅에 대하여 그들에게 조세를 면제하고’는 현대 한국어의 법령·청원 문맥에서 더 명료하고 자연스럽습니다. 절 끝의 ‘하라’는 독립적인 직접 명령으로 들리므로, 병렬된 청원·규정 조항에 맞게 ‘하게 하십시오’로 고쳤습니다.
  terminology: ‘갈대아인들’과 ‘유대인들’은 원문의 민족명을 보존합니다. ἀφορολόγητον의 재정·공납 맥락은 ‘세금’보다 다소 법령적인 ‘조세’가 적절합니다. ‘유대인들의 마을들’은 τὰς κώμας ... τῶν Ἰουδαίων의 소유·귀속 관계를 보존합니다.
  issues:
