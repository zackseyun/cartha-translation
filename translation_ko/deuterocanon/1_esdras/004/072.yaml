  text: and that all the land they possess should be tax-free for them[b][a]; and that the Chaldeans should leave the villages of the Jews that they hold.
  footnotes:
  - marker: a
    text: Or 'all the territory they possess shall be exempt from tribute for them.'
    reason: lexical_alternative
  - marker: b
    text: '''Chaldeans'' is the Greek wording; some English readers may understand this more broadly as Babylonians.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들이 소유하는 모든 땅이 그들에게 세금이 면제되게 하며, 또한 갈대아인들이 유대인들의 소유인 마을들을 떠나게 하라.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘세금이 면제되다’는 여기서 세금 또는 조세 부담에서 벗어난다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘갈대아인들’은 그리스어 표현을 따른 것이며, 역사적으로는 더 넓게 바빌로니아인들을 가리키는 것으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσαν τὴν χώραν
  english_pob_choice: all the land
  chosen_korean: 모든 땅
  alternatives_korean:
  - 온 지역
  - 모든 영토
  lexicon: LSJ
  rationale: χώρα는 여기서 행정·토지 맥락의 넓은 영역을 가리키므로, 법령 문체에 자연스러운 ‘땅’으로 옮겼습니다.
- source_word: κρατήσουσιν
  english_pob_choice: possess
  chosen_korean: 소유하는
  alternatives_korean:
  - 차지하는
  - 보유하는
  - 점유하는
  lexicon: LSJ
  rationale: κρατέω의 미래는 단순 점유보다 ‘붙들어 소유하다/보유하다’의 뉘앙스가 강하므로, 법적 소유 상태를 드러내는 표현을 택했습니다.
- source_word: ἀφορολόγητον ... ὑπάρχειν
  english_pob_choice: should be tax-free for them
  chosen_korean: 그들에게 세금이 면제되게 하며
  alternatives_korean:
  - 그들에게 조세가 면제되게 하며
  - 그들에게 세금이 없게 하며
  lexicon: LSJ
  rationale: ἀφορολόγητον은 과세/조세 면제를 뜻하므로, 현대 한국어 공문체에 맞게 ‘세금이 면제되다’로 간결하게 옮겼습니다.
- source_word: Χαλδαῖοι
  english_pob_choice: Chaldeans
  chosen_korean: 갈대아인들
  alternatives_korean:
  - 바빌로니아인들
  lexicon: LSJ
  rationale: 본문의 민족명은 그리스어 그대로 ‘갈대아인들’이므로, 역사적 해설을 덧붙이지 않고 원지명을 보존했습니다.
theological_decisions:
- issue: 법령형 종속절의 한국어 법적 어조
  chosen_reading: ‘…되게 하며’와 ‘…떠나게 하라’로 명령문·규정문의 효력을 살렸습니다.
  alternative_readings:
  - 직역적인 부정사 구조로 번역
  - 더 완곡한 서술형으로 번역
  rationale: 이 절은 왕령의 조항을 나열하므로, 한국어에서도 규정의 효력이 분명히 드러나는 명령·요구형이 본문의 기능을 가장 잘 반영합니다.
  doctrine_reference: 'DOCTRINE.md: optimal equivalence; 공문·법령 문체'
