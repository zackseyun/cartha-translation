    issue: κρατήσουσιν의 미래성이 ‘소유하는’에서 약화됩니다.
    rationale: κρατήσουσιν은 미래형이며, 해당 토지를 앞으로 차지하거나 보유하게 될 상황을 가리킵니다.
  - severity: medium
    issue: 두 번째 법령 조항이 ‘떠나게 하라’라는 직접 명령으로 처리되어 병렬 구조와 높임말 문체가 흔들립니다.
    rationale: καὶ ἵνα 이하도 앞의 부정사 조항과 함께 법령의 내용으로 제시됩니다. 한국어에서는 ‘떠나게 하십시오’가 문맥상 더 자연스럽고 합쇼체에도 맞습니다.
  - severity: low
    issue: ‘세금이 면제되게’의 적용 대상이 불명료합니다.
    rationale: 면제의 대상은 토지와 관련한 조세 부담이므로, ‘모든 땅에 대하여 그들에게 조세를 면제하고’라고 하면 법적 의미가 분명해집니다.
