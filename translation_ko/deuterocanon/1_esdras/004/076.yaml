translation:
  language: ko
  text: 그는 또한 공급품과 제사장 의복, 곧 그 안에서 무엇으로 섬길지를 기록하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 직역하면 ‘그 안에서 무엇으로 섬길지를’에 가까운 압축된 표현입니다. ‘그 안에서’의 지시 대상과 ‘무엇으로’의 정확한 관계는 분명하지 않습니다. ‘공급품’(χορηγία)은 제공물·지원분·할당분으로도 옮길 수 있습니다.
    reason: source_ambiguity_and_lexical_alternative
lexical_decisions:
- source_word: ἔγραψεν
  english_pob_choice: wrote out
  chosen_korean: 기록하여
  alternatives_korean:
  - 적어 두어
  - 써 두어
  - 기록하였고
  lexicon: LSJ
  rationale: 행정적·공적 문맥에서 단순히 ‘쓰다’보다 문서로 남겨 정리한다는 뜻을 살려 ‘기록하여’로 옮겼습니다.
- source_word: χορηγίαν
  english_pob_choice: provision
  chosen_korean: 봉헌물
  alternatives_korean:
  - 제공물
  - 공급
  - 지원분
  lexicon: LSJ
  rationale: 성전 봉사와 연결된 마련된 물품이라는 점을 살리면서, 한국어에서 자연스러운 종교적·물질적 준비를 나타내는 말로 옮겼습니다.
- source_word: ἱερατικὴν στολήν
  english_pob_choice: priestly robe
  chosen_korean: 제사장 의복
  alternatives_korean:
  - 제사장 예복
  - 제사장 옷
  - 제사장 겉옷
  lexicon: LSJ
  rationale: στολή의 기본 뜻은 ‘정해진 예복/의복’이므로, 한 벌의 옷으로 좁히기보다 제의적 복장을 포괄하는 ‘의복’이 더 안전합니다.
- source_word: ἐν τίνι … ἐν αὐτῇ
  english_pob_choice: specifying in what they are to minister in it
  chosen_korean: 그 안에서 어떻게 섬길지
  alternatives_korean:
  - 그것 안에서 무엇으로 섬길지
  - 그 안에서 섬기는 방식이 무엇인지
  lexicon: LSJ
  rationale: 그리스어가 압축되어 있어 정확한 대상과 방식이 엉켜 있으므로, 핵심 의미인 ‘그것 안에서 어떤 방식으로 섬길지’를 한국어로 자연스럽게 풀었습니다.
theological_decisions:
- issue: λατρεύσουσιν의 제의적 의미
  chosen_reading: ‘섬길’로 옮기되 성전 봉사 맥락을 유지했습니다.
  alternative_readings:
  - 예배드릴
  - 봉사할
  - 성무를 행할
  rationale: λατρεύω는 일반적 ‘봉사’보다 제의적 섬김의 뉘앙스가 강하므로, 현대 한국어에서는 너무 교회화된 표현을 피하면서도 성전 맥락을 드러내는 ‘섬길’이 가장 균형적입니다.
  doctrine_reference: Temple service / cultic worship
- issue: 전치사구의 압축성 보존
  chosen_reading: ‘그 안에서 어떻게 섬길지’로 의미를 압축 보존했습니다.
  alternative_readings:
  - 그것 안에서 섬기게 될 것
  - 그 안에서 섬겨야 할 것
  rationale: 원문은 ‘무엇에서/어떻게/그 안에서’가 압축되어 있어, 한국어도 과도한 해설 없이 의미만 드러내는 쪽이 본문의 모호성을 보존합니다.
  doctrine_reference: Source-text ambiguity retention
