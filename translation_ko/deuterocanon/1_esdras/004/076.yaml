  text: He also wrote out the provision and the priestly robe[a]—specifying in what they are to minister in it.
  footnotes:
  - marker: a
    text: Or 'the supply/allowance and the priestly garment, indicating how they are to serve in it.' The Greek wording is compressed, especially in the phrase 'in what ... in it.'
