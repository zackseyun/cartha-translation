  source_fidelity: 원문의 καὶ와 부정사 δοθῆναι는 앞선 칙령 내용에 이어지는 ‘지급하도록 하다’라는 행정적 명령을 나타냅니다. 초안의 ‘그렇게 하였습니다’는 원문에 없는 완료된 서술을 더하므로 삭제해야 합니다. μέχρι τοῦ οἰκοδομηθῆναι는 성전 건축이 완료될 때까지의 기간을 뜻하므로 그 대상을 명시했습니다.
  naturalness: ‘성전 건축을 위하여 해마다 스무 달란트를 … 지급하도록 하였으며’는 현대 표준어의 공식적 합쇼체 문맥에 자연스럽습니다. ‘그것이 세워질 때까지 그렇게 하였습니다’의 모호한 지시어와 불필요한 반복을 피했습니다.
