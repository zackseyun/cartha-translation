  yaml_path: translation/deuterocanon/1_esdras/004/073.yaml
  text: and for the building of the temple[a], that twenty talents be given each year until it is built[b];
  footnotes:
  - marker: a
    text: Or 'for the construction of the sanctuary.' The Greek uses ἱερόν, a standard term for the temple.
    reason: lexical_alternative
  - marker: b
    text: A talent was a large unit of weight, and in this context a monetary measure.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 성전 건축을 위하여 해마다 스무 달란트를 성전이 건축될 때까지 지급하도록 하였으며,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성소’. 헬라어 ἱερόν은 성전 또는 성소를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘달란트’는 큰 무게 단위이며, 이 문맥에서는 금전적 가치의 단위로 쓰입니다.
    reason: cultural_note
lexical_decisions:
- source_word: οἰκοδομή
  english_pob_choice: building
  chosen_korean: 건축
  alternatives_korean:
  - 건물 세움
  - 건축 공사
  lexicon: LSJ
  rationale: 명사형 표현으로서 ‘οἰκοδομή’는 여기서 성전의 건립 행위를 가리키므로, ‘건축’이 한국어에서 가장 자연스럽고 공적 문서체에도 잘 맞습니다.
- source_word: ἱερόν
  english_pob_choice: temple
  chosen_korean: 성전
  alternatives_korean:
  - 성소
  - 성전 구역
  lexicon: LSJ
  rationale: POB의 ‘temple’은 여기서 성전 전체를 가리키는 말이므로, 한국어에서는 제의적 복합체를 드러내는 ‘성전’이 더 정확합니다.
- source_word: δοθῆναι
  english_pob_choice: be given
  chosen_korean: 주어지도록 하다
  alternatives_korean:
  - 지급되도록 하다
  - 주게 하다
  lexicon: LSJ
  rationale: 행정적 배분을 뜻하는 수동 부정사이므로, 금액이 공식적으로 배정·지급된다는 뜻을 살려 ‘주어지도록 하다’로 옮겼습니다.
- source_word: κατ’ ἐνιαυτόν
  english_pob_choice: each year
  chosen_korean: 해마다
  alternatives_korean:
  - 매년
  - 해마다마다
  lexicon: LSJ
  rationale: 반복적 분배를 나타내는 표현이라 ‘해마다’가 가장 간결하고 자연스럽습니다.
- source_word: τάλαντα εἴκοσι
  english_pob_choice: twenty talents
  chosen_korean: 스무 달란트
  alternatives_korean:
  - 이십 달란트
  - 달란트 스무 개
  lexicon: LSJ
  rationale: 도량형·화폐 단위인 ‘talents’를 그대로 음역한 뒤 수량은 관용적으로 ‘스무’로 처리해, 본문의 재정적 의미를 보존했습니다.
