  text: And King Darius made a great banquet for all who were under him[a], and for all his household, and for all the nobles of Media and Persia,
  footnotes:
  - marker: a
    text: Or 'feast' for 'banquet.' The Greek term denotes a formal meal or entertainment.
    reason: lexical_alternative
translation:
  language: ko
  text: 다리오 왕은 그의 통치 아래 있는 모든 사람과 그의 집안 사람들 모두와 메대와 페르시아의 모든 귀족을 위해 성대한 연회를 베풀었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 δοχή는 공식적인 식사 자리 또는 연회를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοχὴ μεγάλην
  english_pob_choice: great banquet
  chosen_korean: 큰 잔치
  alternatives_korean:
  - 큰 연회
  - 큰 향연
  lexicon: LSJ
  rationale: δοχή는 공식적인 식사 자리나 연회를 가리키므로, 왕실 맥락에서는 자연스럽고 직접적인 ‘큰 잔치’가 원문의 규모와 성격을 잘 드러냅니다.
- source_word: τοῖς ὑπʼ αὐτόν
  english_pob_choice: who were under him
  chosen_korean: 자기에게 속한 모든 사람
  alternatives_korean:
  - 자기 아래 있는 모든 사람
  - 자기 권세 아래 있는 모든 사람
  - 자기 신하 모두
  lexicon: LSJ
  rationale: 직역에 가까운 ‘자기 아래 있는’도 가능하지만, 한국어에서는 지배 관계를 자연스럽게 보여 주는 ‘자기에게 속한’이 원문의 위계적 의미를 비교적 직접적으로 살립니다.
- source_word: οἰκογενέσιν
  english_pob_choice: his household
  chosen_korean: 자기 집안의 모든 사람
  alternatives_korean:
  - 자기 집안
  - 자기 가솔
  - 자기 가문 사람들
  lexicon: LSJ
  rationale: οἰκογενέσιν은 단순한 직계 가족보다 집안 구성원을 넓게 가리킬 수 있으므로, 왕궁 맥락에서 ‘집안의 모든 사람’이 범위를 잘 보존합니다.
- source_word: μεγιστᾶσιν
  english_pob_choice: the nobles
  chosen_korean: 귀족
  alternatives_korean:
  - 귀인
  - 대귀족
  - 유력자
  lexicon: LSJ
  rationale: μεγιστάνες는 높은 지위의 사람들을 뜻하므로, 한국어에서는 공적·사회적 신분을 분명히 하는 ‘귀족’이 가장 간결하고 안정적입니다.
theological_decisions:
- issue: 왕의 잔치에 포함된 대상 범위
  chosen_reading: ‘자기에게 속한 모든 사람’과 ‘자기 집안의 모든 사람’을 구분해, 궁정 내부와 왕권 아래의 범주를 함께 드러냈습니다.
  alternative_readings:
  - ‘자기 신하들 모두’로 통합
  - ‘자기 아래 있는 모든 사람’로 단순화
  rationale: 원문은 대상들을 병렬로 나열해 범위를 넓히므로, 한국어도 그 구분을 유지해 왕권의 포괄성을 살렸습니다.
  doctrine_reference: 본문 서술의 역사적-문법적 구분
