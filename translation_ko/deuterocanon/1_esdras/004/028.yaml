  yaml_path: translation/deuterocanon/1_esdras/004/028.yaml
  text: And now[a], do you not believe me? Is not the king great in his authority? Do not all the lands fear to touch him?
  footnotes:
  - marker: a
    text: Or 'Do not all the countries stand in fear of touching him?' The Greek χῶραι can mean 'lands,' 'countries,' or 'regions,' and εὐλαβοῦνται carries the sense of fearful caution or reverence.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 지금 나를 믿지 않으십니까? 왕이 자기 권세로 얼마나 위대한지 보십시오. 온 땅이 그에게 손대기를 두려워하지 않습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「온 땅」은 χῶραι의 넓은 의미를 살린 번역입니다. 이 단어는 ‘땅들’, ‘나라들’, ‘지역들’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύετέ μοι
