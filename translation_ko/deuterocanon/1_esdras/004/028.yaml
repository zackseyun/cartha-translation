  text: And now[a], do you not believe me? Is not the king great in his authority? Do not all the lands fear to touch him?
  footnotes:
  - marker: a
    text: Or 'Do not all the countries stand in fear of touching him?' The Greek χῶραι can mean 'lands,' 'countries,' or 'regions,' and εὐλαβοῦνται carries the sense of fearful caution or reverence.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 지금 나를 믿지 않으십니까? 왕은 자기 권세로 위대하지 않습니까? 모든 땅이 그를 만지기를 두려워하지 않습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「모든 땅」은 그리스어 χῶραι를 옮긴 것으로, ‘나라들’ 또는 ‘지역들’로도 번역할 수 있습니다. 「두려워하다」에 해당하는 εὐλαβοῦνται에는 경외심과 조심스러운 두려움의 뜻이 함께 담길 수 있습니다.
    reason: lexical_alternative
