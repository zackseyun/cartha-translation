  yaml_path: translation/deuterocanon/1_esdras/004/042.yaml
  text: Then the king said to him[a], “Ask for whatever more you want beyond what has been written, and we will give it to you, because you have been found wiser; and you shall sit beside me[c][b], and you shall be called my kinsman.”
  footnotes:
  - marker: a
    text: Or, 'whatever more you wish than what has been written.' The phrase likely refers to rewards already recorded or decreed in writing.
    reason: lexical_alternative
  - marker: b
    text: Or, 'you shall sit beside me.' The Greek expression denotes proximity and honor at court.
    reason: lexical_alternative
  - marker: c
    text: Or, 'you shall be called my relative.' The wording expresses royal favor and elevated status.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 왕이 그에게 말했습니다. 「기록된 것에 더하여 원하는 것이 무엇이든 구하십시오.[a] 그러면 우리가 그것을 당신에게 주겠습니다. 당신이 더 지혜로운 이로 드러났기 때문입니다. 당신은 내 곁에 앉을 것이며,[b] 내 친족이라 불릴 것입니다.[c]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기록된 것보다 더 당신이 원하는 것이 무엇이든’으로 옮길 수 있습니다. 이 구절은 이미 기록되거나 정해진 보상들을 가리킬 가능성이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 옆에 앉을 것이며’. 그리스어 표현은 궁정에서의 근접성과 명예를 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘내 친족으로 불릴 것입니다’. 이 표현은 왕의 호의와 높아진 지위를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Αἴτησαι
  english_pob_choice: Ask for
  chosen_korean: 구하십시오
  alternatives_korean:
