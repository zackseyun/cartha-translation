  - 청하십시오
  - 구해 보십시오
  lexicon: LSJ
  rationale: 왕의 직접 권유이면서 사실상 명령에 가까운 말이므로, 공손한 청유형인 ‘구하십시오’가 문맥의 위계와 현대 합쇼체를 함께 살립니다.
- source_word: ὃ θέλεις πλείω τῶν γεγραμμένων
  english_pob_choice: whatever more you want beyond what has been written
  chosen_korean: 기록된 것보다 더 바라는 것이 있으면 무엇이든
  alternatives_korean:
  - 기록된 것보다 더 원하는 것이 있으면 무엇이든
  - 기록된 것을 넘어 더 원하는 것이 있으면 무엇이든
  lexicon: LSJ
  rationale: γεγραμμένων을 단순히 ‘기록된 것’으로 옮겨, 이미 문서화된 보상/허락을 가리키는 표현의 중층성을 남겼습니다.
- source_word: ἐχόμενός μου καθήσῃ
  english_pob_choice: you shall sit beside me
  chosen_korean: 내 곁에 앉게 될 것이며
  alternatives_korean:
  - 내 옆에 앉게 될 것이며
  - 내 가까이에 앉게 될 것이며
  lexicon: LSJ
  rationale: ἐχόμενός μου는 궁정적 근접성과 명예를 나타내므로, 직역보다 자연스러운 ‘내 곁에’가 지위 상승의 뉘앙스를 보존합니다.
- source_word: συγγενής μου κληθήσῃ
  english_pob_choice: you shall be called my kinsman
  chosen_korean: 내 친족으로 불릴 것입니다
  alternatives_korean:
  - 내 친족이라 불릴 것입니다
  - 내 혈족으로 불릴 것입니다
  - 내 친척으로 불릴 것입니다
  lexicon: LSJ
  rationale: συγγενής는 혈연만이 아니라 같은 가문/친족 집단의 관계를 가리킬 수 있어, 고어풍 ‘족친’보다 현대적이면서도 관계적 격을 살린 ‘친족’이 적절합니다.
theological_decisions:
- issue: 궁정적 친족 호칭의 의미
  chosen_reading: 혈연 선언으로 좁히지 않고, 왕의 호의로 주어지는 친족적 지위 상승으로 옮겼습니다.
  alternative_readings:
  - 실제 혈족 편입으로 읽기
  - 단순한 친구/우호 관계로 읽기
  rationale: 문맥은 신학적 교리보다 왕의 보상과 신분 상승에 초점이 있으므로, 원문의 사회적·정치적 함의를 과장하지 않으면서도 ‘친족’의 높은 호칭을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §5
