  text: 그들은 먹고 마셨습니다. 배부른 뒤에 떠났습니다. 그런데 다리오 왕은 침실로 들어가 잠들었고, 깨어났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἐμπλησθέντες는 단순히 ‘배부르다’는 뜻뿐 아니라 식사 후 충분히 만족한 상태를 강조할 수 있습니다.
    reason: lexical_alternative
