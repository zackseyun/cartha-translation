  text: And they ate and drank[a], and when they were filled they departed. But Darius the king went into his bedchamber and slept, and then awoke.
  footnotes:
  - marker: a
    text: Or 'having been satisfied' for 'when they were filled'; the Greek participle ἐμπλησθέντες can emphasize satiety after the meal.
