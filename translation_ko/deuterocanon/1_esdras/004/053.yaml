  text: And for all who go up from Babylonia to build the city[a], there shall be freedom for them and for their children, and for all the priests who go up.
  footnotes:
  - marker: a
    text: Or 'liberty'; in this royal-decree context the term may include legal privileges or exemption from certain obligations, though the Greek does not define the exact scope.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 바빌로니아에서 올라가 그 성을 건축하는 모든 사람과 그들의 자녀와, 올라가는 모든 제사장에게 자유가 보장될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘면제’. 이 칙령의 문맥에서 이 말은 특정 의무의 면제나 법적 특권을 포함할 수 있으나, 그 범위는 그리스어 본문이 구체적으로 밝히지 않습니다.
    reason: lexical_alternative
