  text: 그리고 바빌로니아에서 올라와 그 성을 건축하는 모든 사람에게, 그들과 그들의 자녀에게 자유가 있으며, 올라오는 모든 제사장들에게도 그러합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
