  yaml_path: translation/deuterocanon/1_esdras/004/080.yaml
  text: And when the young man went out, lifting up his face toward heaven, facing Jerusalem, he blessed the King of heaven, saying,
translation:
  language: ko
  text: 그리고 그 청년이 나가자, 예루살렘을 마주한 채 하늘을 향하여 얼굴을 들어 하늘의 왕을 찬송하며 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘마주하여/맞은편에’에 가깝지만, 여기서는 방향을 나타내는 ‘마주한 채’로 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: ὁ νεανίσκος
  english_pob_choice: the young man
  chosen_korean: 그 청년
  alternatives_korean:
  - 젊은이
  - 소년
  lexicon: νεανίσκος
  rationale: 단순한 연령 표시로 보이며, 문맥상 자연스러운 표준어인 ‘청년’이 적절합니다. ‘그’는 앞선 서술의 특정 인물을 가리키는 지시를 살립니다.
- source_word: ἄρας τὸ πρόσωπον εἰς τὸν οὐρανόν
  english_pob_choice: lifting up his face toward heaven
  chosen_korean: 하늘을 향하여 얼굴을 들어
  alternatives_korean:
  - 얼굴을 하늘로 들어
  - 하늘을 우러러 얼굴을 들고
  lexicon: πρόσωπον / οὐρανός
  rationale: 직역을 유지하되 한국어 어순에 맞게 조정했습니다. ‘얼굴을 들어’는 동작의 방향성을 살리고, ‘하늘을 향하여’는 목적격적 방향을 자연스럽게 표현합니다.
- source_word: ἔναντιον Ἰερουσαλήμ
  english_pob_choice: facing Jerusalem
  chosen_korean: 예루살렘을 마주한 채
  alternatives_korean:
  - 예루살렘을 향하여
  - 예루살렘 앞에서
  lexicon: ἔναντιον
  rationale: 영어 POB의 수정본이 ‘facing Jerusalem’로 확정되어 있어, 단순 위치보다 ‘마주함’의 방향성을 드러내는 표현을 택했습니다.
- source_word: εὐλόγησεν τῷ βασιλεῖ τοῦ οὐρανοῦ
  english_pob_choice: he blessed the King of heaven
  chosen_korean: 하늘의 왕을 찬송하며
  alternatives_korean:
  - 하늘의 왕을 축복하며
  - 하늘의 왕께 복을 빌며
  lexicon: εὐλογέω / βασιλεὺς τοῦ οὐρανοῦ
  rationale: 문맥상 하나님께 드리는 송축이므로 ‘찬송하며’가 한국어 성경 독자에게 의미를 가장 분명하게 전달합니다. ‘하늘의 왕’은 직역을 유지했습니다.
theological_decisions:
- issue: 하늘의 왕 호칭 유지
  chosen_reading: ‘하늘의 왕’을 하나님에 대한 직접 호칭으로 그대로 옮겼습니다.
  alternative_readings:
  - ‘하늘에 계신 왕’
  - ‘천상의 왕’
  rationale: 본문의 왕권 이미지를 약화하지 않고 보존하기 위해 직역형을 택했습니다. 이는 하나님을 우주적 통치자로 묘사하는 유대적 경건 표현을 살립니다.
  doctrine_reference: 시편 47편, 다니엘 4:37의 하나님의 सार्व주권적 왕권 이미지
- issue: εὐλόγησεν의 예배적 뉘앙스
  chosen_reading: ‘찬송하며’로 옮겨 송축/예배의 뉘앙스를 드러냈습니다.
  alternative_readings:
  - ‘축복하며’
  - ‘복을 빌며’
  rationale: 주어가 하나님을 향해 행하는 동작이므로, 한국어에서 오해될 수 있는 ‘축복하다’보다 예배적 송축을 분명히 하는 표현이 적절합니다.
  doctrine_reference: 유대교적 ברך/εὐλογέω의 송축 용례
