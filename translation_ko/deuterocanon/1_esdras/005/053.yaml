  source_fidelity: 대체로 그리스어 원문을 충실히 반영합니다. 다만 목적을 나타내는 두 부정사(παράγειν, διαφέρειν)는 시돈 사람들과 두로 사람들이 수행할 일을 가리키므로, 한국어에서도 그들이 ‘가져오고 ... 운반하도록’ 지급했다는 관계를 더 직접적으로 드러내는 것이 좋습니다. 또한 γραφὲν αὐτοῖς παρὰ Κύρου는 고레스에게서 그들에게 내려진 서면 조서라는 뜻이므로 ‘써 보낸’보다 ‘내린 서면 조서’가 더 정확합니다.
  naturalness: 현행 문장은 이해 가능하지만, ‘주어서 ... 가져오게 하였으며’와 마지막의 ‘이는 ... 따른 것이었습니다’는 다소 느슨하게 연결됩니다. 목적절과 조서에 따른 근거를 명료하게 재구성하면 현대 한국어 합쇼체로 더 자연스럽습니다.
  terminology: ‘은’, ‘돌을 다듬는 사람들’, ‘목수들’, ‘백향목 통나무’, ‘뗏목’, ‘욥바’, ‘바사 왕 고레스’는 적절합니다. 난해한 χάρα를 ‘보급품’으로 옮긴 것은 병행 본문의 ‘기름’을 본문에 부당하게 이입하지 않는 신중한 처리입니다.
