base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/053.yaml
  text: And they gave silver to the stonecutters and carpenters[a], and drink and food and provisions to the Sidonians and Tyrians, to bring cedar logs from Lebanon, transporting them by rafts to the harbor of Joppa, according to the written decree given to them by Cyrus king of the Persians.
  footnotes:
  - marker: a
    text: The Greek word rendered 'provisions' is difficult here; the Hebrew parallel in Ezra 3:7 specifies 'oil.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 돌을 다듬는 사람들과 목수들에게 은을 주고, 시돈 사람들과 두로 사람들에게는 마실 것과 먹을 것과 보급품을 주어서, 레바논에서 백향목 통나무를 가져오게 하였으며, 그것들을 뗏목으로 욥바의 항구까지 운반하게 하였는데, 이는 바사 왕 고레스가 그들에게 써 보낸 조서에 따른 것이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 χάρα는 문맥상 공급품 목록의 한 항목으로 보이지만, 병행 본문이 더 구체적이어서 한국어 본문은 품목을 단정하지 않고 ‘보급품’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀργύριον
  english_pob_choice: silver
  chosen_korean: 은
  alternatives_korean:
  - 은전
  - 돈
  lexicon: LSJ
  rationale: 문맥상 지급 수단을 가리키지만, 원문이 문자 그대로 ‘은’이라고 말하므로 한국어도 직접적으로 옮겨 원문성을 살렸습니다.
- source_word: λατόμοις
  english_pob_choice: stonecutters
  chosen_korean: 돌을 다듬는 사람들
  alternatives_korean:
  - 석공들
  - 채석꾼들
  lexicon: LSJ
  rationale: 돌을 절단·가공하는 일을 드러내기 위해 직역적으로 풀어 옮겼습니다. ‘석공’보다 채석/가공 기능이 더 분명합니다.
- source_word: ποτὰ καὶ βρωτὰ καὶ χάρα
  english_pob_choice: drink and food and provisions
  chosen_korean: 마실 것과 먹을 것과 보급품
  alternatives_korean:
  - 음료와 음식과 보급품
  - 마실 것과 먹을 것과 공급품
  lexicon: LSJ
  rationale: 세 항목의 공급 목록이라는 점을 살리면서, 난해한 χάρα는 POB의 ‘provisions’에 맞춰 구체 품목을 단정하지 않고 ‘보급품’으로 처리했습니다.
- source_word: ξύλα κέδρινα
  english_pob_choice: cedar logs
  chosen_korean: 백향목 통나무
  alternatives_korean:
  - 백향목 목재
  - 백향목 재목
  lexicon: LSJ
  rationale: 운반 대상이 되는 건축용 목재를 구체적으로 드러내기 위해 ‘통나무’를 택했습니다. ‘목재’보다 물질감이 살아 있습니다.
- source_word: διαφέρειν σχεδίαις
  english_pob_choice: transporting them by rafts
  chosen_korean: 뗏목으로 ... 운반하게 하였으며
  alternatives_korean:
  - 뗏목으로 ... 실어 나르게 하였으며
  - 뗏목으로 ... 옮기게 하였으며
  lexicon: LSJ
  rationale: 수송 수단인 뗏목을 자연스러운 한국어 서술로 옮겼습니다. 목적 부정사 구조를 한국어의 사동·목적 표현으로 반영했습니다.
- source_word: Ἰόππης λιμένα
  english_pob_choice: the harbor of Joppa
  chosen_korean: 욥바의 항구
  alternatives_korean:
  - 욥바 항구
  - 욥바 포구
  lexicon: LSJ
  rationale: λιμήν의 기본 의미를 살려 ‘항구’로 옮기되, 지명과의 결합을 자연스럽게 했습니다.
- source_word: Κύρου τοῦ Περσῶν βασιλέως
  english_pob_choice: Cyrus king of the Persians
  chosen_korean: 바사 왕 고레스
  alternatives_korean:
  - 페르시아 왕 고레스
  - 바사 사람들의 왕 고레스
  lexicon: LSJ
  rationale: 한국어 성경에서 널리 알려진 이름형 ‘고레스’를 유지하고, ‘왕국/민족’ 표현은 전통적 지명형 ‘바사’로 자연화했습니다.
theological_decisions:
- issue: Greek primary text with difficult supply term χάρα
  chosen_reading: 본문은 그리스어를 우선하되, 난해한 χάρα는 구체 품목으로 단정하지 않고 기능상 ‘보급품’으로 옮겼습니다.
  alternative_readings:
  - 에스라 3:7의 병행을 따라 ‘기름’으로 구체화
  - 원문 형태를 따라 모호함을 그대로 노출
  rationale: 1 Esdras에서는 그리스어가 1차 기준이므로, 병행 본문은 의미 점검에만 쓰고 특정 물품을 본문에 삽입하지 않았습니다. 다만 공급 목록이라는 큰 틀은 유지했습니다.
  doctrine_reference: '1 Esdras translation policy: Greek primary with Hebrew parallel as sanity check'
