translation:
  language: ko
  text: 바이테로스의 자손은 삼천오 명이며, 라게슬로몬의 자손은 백스물세 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 그리스어 이름들은 대략적인 히브리어/MT 병행 전승과 다르며, 병행 전승은 이 지점에서 ‘하숨의 자손, 이백스물세 명’으로 반영합니다. 본문은 MT가 아니라 1 에스드라의 그리스어를 따릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  english_pob_choice: the sons of
  chosen_korean: 자손은
  alternatives_korean:
  - 아들들은
  - 자녀들은
  lexicon: LSJ
  rationale: 명단·족보 문맥에서 υἱοὶ는 혈연 집단을 가리키는 공식 표현이므로, 직역투를 유지하면서도 한국어에서 자연스러운 ‘자손’으로 옮겼습니다.
- source_word: Βαιτηρούς
