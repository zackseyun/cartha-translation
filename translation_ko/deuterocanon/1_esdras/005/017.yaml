translation:
  language: ko
  text: 바이테루스[a]의 자손은 삼천오 명이며, 라게틀로몬 출신 자손은 백이십삼 명이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 그리스어 고유명사들은 대략적으로 대응하는 히브리어 마소라 본문(MT)의 병행 전승과 다릅니다. 그 병행 전승은 이 지점에서 ‘하숨의 자손, 이백이십삼 명’이라고 합니다. 본문은 MT에 맞추어 조화시키지 않고 1 에스드라의 그리스어를 따릅니다.
    reason: alternative_reading
