  lexicon: 고유명사 음역
  rationale: 본문의 그리스어 형태를 따라 음역했으며, 기존 영어 음역을 기계적으로 따르기보다 한국어 표기 관례에 맞게 옮겼습니다.
- source_word: τρισχίλιοι πέντε
  english_pob_choice: three thousand and five
  chosen_korean: 삼천오 명
  alternatives_korean:
  - 삼천다섯 명
  - 삼천오
  lexicon: LSJ
  rationale: 수사는 본문이 제시하는 정확한 수량을 보존하되, 한국어 명단 문맥에 맞게 단위 ‘명’을 보충해 읽기 쉽도록 했습니다.
- source_word: ἑκατὸν εἴκοσι τρεῖς
  english_pob_choice: one hundred twenty-three
  chosen_korean: 백스물세 명
  alternatives_korean:
  - 백이십삼 명
  - 백 스물세 명
  lexicon: LSJ
  rationale: 그리스어 수사를 그대로 반영하면서 현대 한국어에서 자연스러운 결합형 수사로 옮겼습니다.
- source_word: ἐκ Ῥαγεθλωμῶν
  english_pob_choice: the sons from Ragethlomon
  chosen_korean: 라게슬로몬의 자손은
  alternatives_korean:
  - 라게슬로몬에서 온 자손은
  - 라게슬로몬 사람들은
  lexicon: LSJ
  rationale: ἐκ는 이 명단에서 집단의 소속을 나타내므로 ‘~의’로 처리해 한국어 족보식 표현을 살렸습니다.
theological_decisions:
- issue: 1 Esdras의 그리스어 명단이 히브리어/MT 병행 전승과 정확히 일치하지 않음
  chosen_reading: 본문은 그리스어 인명을 그대로 유지하고, MT의 ‘하숨’으로 조화하지 않았습니다.
  alternative_readings:
  - 두 번째 집단을 MT에 맞춰 ‘하숨’으로 바꾸는 읽기
  - 병행 전승을 따라 이름을 일반화하는 읽기
  rationale: 이 책의 번역 기준은 그리스어 본문이며, 병행 히브리어는 점검용이므로 본문에 없는 조화를 끼워 넣지 않았습니다.
  doctrine_reference: '번역 원칙: 원문 우선, 병행 전승은 보조적 참고'
