  - severity: medium
    issue: Ῥαγεθλωμῶν을 ‘라게슬로몬’으로 음역함
    rationale: θλ 자음군을 ‘슬’로 처리하면 원문의 자음 구성이 사라집니다. ‘라게틀로몬’이 그리스어 형태를 더 충실히 반영합니다.
