base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/009.yaml
  text: 'The number of those from the nation[a], and their leaders: the sons of Phoros[b], seventy-two thousand.'
  footnotes:
  - marker: a
    text: 'Greek: ''Phoros.'' The parallel Hebrew-list tradition differs in both names and numbers at this point; the Greek text of 1 Esdras appears to preserve a divergent list form.'
    reason: alternative_reading
  - marker: b
    text: The Greek reads 'seventy-two thousand.' This unusually large figure differs sharply from the approximate MT parallel and may reflect a textual disturbance or a different list tradition.
    reason: textual_variant
translation:
  language: ko
  text: 민족에서 나온 사람들과 그들의 지도자들의 수는 이러합니다. 포로스의 아들들, 칠만 이천 명입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘포로스’라고 읽습니다. 이 자리의 히브리어 병행 전승은 이름과 수치가 모두 다르며, 1 에스드라스의 그리스어 본문은 다른 명부 전승을 보존한 것으로 보입니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어 본문은 ‘칠만 이천 명’이라고 읽습니다. 이 수치는 이 문맥의 병행 전승과 크게 달라, 본문 전승의 혼선이나 다른 명부 전승을 반영할 수 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἀριθμὸς
  english_pob_choice: The number
  chosen_korean: 수는
  alternatives_korean:
  - 수
  - 인원수
  - 계수
  lexicon: LSJ
  rationale: 목록 서두의 집계 표현으로, 한국어에서는 자연스럽게 ‘수는’으로 옮겨 간결한 목록 도입을 살렸습니다.
- source_word: τῶν ἀπὸ τοῦ ἔθνους
  english_pob_choice: of those from the nation
  chosen_korean: 민족에서 나온 사람들
  alternatives_korean:
  - 그 민족에 속한 사람들
  - 백성 가운데 나온 사람들
  - 나라에서 나온 사람들
  lexicon: LSJ
  rationale: ἔθνος의 기본 의미를 따라 ‘민족’을 택했고, 목록형 압축 표현을 한국어에서 이해되도록 ‘나온 사람들’로 풀었습니다.
- source_word: οἱ προηγούμενοι αὐτῶν
  english_pob_choice: their leaders
  chosen_korean: 그들의 지도자들
  alternatives_korean:
  - 그들 앞에 선 사람들
  - 그들의 우두머리들
  - 그들의 선두자들
  lexicon: LSJ
  rationale: 직역하면 ‘앞서 가는 자들’이지만, 이 행정·명부 문맥에서는 ‘지도자들’이 의도를 가장 분명하게 드러냅니다.
- source_word: υἱοὶ Φορὸς
  english_pob_choice: the sons of Phoros
  chosen_korean: 포로스의 아들들
  alternatives_korean:
  - 포로스의 자손들
  - 포로스 집안의 아들들
  lexicon: Greek proper name
  rationale: 그리스어 고유명사 Φορὸς를 원문 기준으로 음역하고, 족보·명부 관용구인 ‘아들들’을 유지했습니다.
- source_word: ἑβδομήκοντα δύο χιλιάδες
  english_pob_choice: seventy-two thousand
  chosen_korean: 칠만 이천 명
  alternatives_korean:
  - 72,000명
  - 일곱만 이천 명
  lexicon: LSJ
  rationale: 그리스어 수사를 한국어 전통 수사형으로 자연스럽게 옮겼고, 단위를 명시해 인원수임을 분명히 했습니다.
theological_decisions:
- issue: 그리스어 목록 전승의 수치 차이
  chosen_reading: 본문의 그리스어가 전하는 ‘칠만 이천 명’을 그대로 번역했습니다.
  alternative_readings:
  - MT 병행전승에 맞춘 다른 수치로 조정
  - 전승 차이를 본문에 흡수해 완화
  rationale: 이 본문은 그리스어가 주된 증거이며, 영어 POB도 수치의 이질성을 각주로 표시하므로 본문은 전승된 수치를 보존해야 합니다.
  doctrine_reference: 본문 비평 / 전승 보존
- issue: ἔθνος의 범주
  chosen_reading: ‘민족’으로 옮겨 집단 정체성을 드러냈습니다.
  alternative_readings:
  - 백성
  - 나라
  - 족속
  rationale: 여기서는 제도적 ‘국가’보다 혈연·집단 명부의 뉘앙스가 강하므로, ‘민족’이 원문의 범주를 가장 무리 없이 반영합니다.
  doctrine_reference: 번역 원칙 / 어휘 의미
