base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/061.yaml
  text: and many with trumpets[a], and great joy with the voice[b];
  footnotes:
  - marker: a
    text: 'Greek is elliptical here, preserving a fragmentary list-like style: literally, ''and many through/with trumpets, and great joy with the voice.'' The translation supplies natural English while keeping the sense of audible celebration.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew parallel (Ezra 3:10) more fully describes priests with trumpets and Levites with cymbals praising the LORD. 1 Esdras here presents a compressed Greek form of that scene.
    reason: cross_reference
translation:
  language: ko
  text: 그리고 많은 이들이 나팔을 불며, 큰 기쁨이 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 이곳에서 압축된 목록형 표현을 사용하며, 영어 POB도 이를 자연스럽게 풀어 옮겼습니다.
    reason: source_note
  - marker: b
    text: 히브리어 평행본문(에스라 3:10)은 제사장들이 나팔을, 레위 사람들이 제금을 가지고 야훼를 찬양하는 장면을 더 분명히 보여 줍니다.
    reason: cross_reference
lexical_decisions:
- source_word: πολλοὶ
  english_pob_choice: many
  chosen_korean: 많은 이들
  alternatives_korean:
  - 많은 사람들
  - 많은 무리
  lexicon: LSJ
  rationale: 주어가 생략된 압축된 목록형 표현이므로, 과도하게 풀지 않고 자연스러운 복수 표현인 ‘많은 이들’로 옮겼습니다.
- source_word: διὰ σαλπίγγων
  english_pob_choice: with trumpets
  chosen_korean: 나팔을 불며
  alternatives_korean:
  - 나팔과 함께
  - 나팔로
  - 나팔들을 가지고
  lexicon: LSJ
  rationale: διά + 속격의 도구적 용법을 한국어의 자연스러운 동사구로 풀어, 행위의 동반성과 울림을 함께 드러냈습니다.
- source_word: χαρὰ μεγάλη
  english_pob_choice: great joy
  chosen_korean: 큰 기쁨
  alternatives_korean:
  - 큰 환희
  - 매우 큰 기쁨
  lexicon: LSJ
  rationale: χαρά의 기본 의미를 직접적으로 살려 ‘큰 기쁨’으로 옮겼습니다.
- source_word: τῇ φωνῇ
  english_pob_choice: with a loud voice
  chosen_korean: 소리로
  alternatives_korean:
  - 큰 소리로
  - 목소리로
  - 외치는 소리로
  lexicon: LSJ
  rationale: 정관사와 명사만 있는 압축 표현이므로, 영어처럼 ‘loud’를 보충하기보다 문맥상 청각적 표현을 유지하는 쪽을 택했습니다.
theological_decisions:
- issue: 압축된 그리스어 열거의 재현
  chosen_reading: ‘많은 이들… 큰 기쁨이 있었습니다’로, 주어와 동작을 완전히 보충하지 않고 축제적 소리의 분위기를 간결하게 살렸습니다.
  alternative_readings:
  - ‘많은 이들이 나팔을 불었고, 큰 기쁨이 있었습니다’
  - ‘많은 이들이 나팔과 함께, 큰 기쁨과 소리로’
  rationale: 본문은 목록형으로 매우 압축되어 있어, 의미를 과잉 해설하지 않고 원문의 축제적 단문성을 보존하는 것이 더 적절합니다.
  doctrine_reference: '번역 원칙: 원문 형식 보존과 자연스러운 한국어의 균형'
