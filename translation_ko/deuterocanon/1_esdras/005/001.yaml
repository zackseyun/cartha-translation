base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/001.yaml
  text: After these things[a], the heads of ancestral houses, according to their tribes, were chosen to go up, along with their wives and their sons and daughters, and their male servants and female servants, and their livestock.
  footnotes:
  - marker: a
    text: Or 'their servants ... and their maidservants.' The Greek terms can denote household slaves or servants; here 'male servants' and 'female servants' are used to reflect the paired masculine and feminine forms without overstating legal status from this verse alone.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일들이 있은 뒤에, 조상 가문의 우두머리들이 지파별로 그들의 아내들과 아들들과 딸들과 남종들과 여종들과 가축을 데리고 올라가도록 뽑혔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 종들 … 그리고 그들의 여종들.’ 이 그리스어는 가정의 종이나 노예를 가리킬 수 있으므로, 이 절에서는 법적 지위를 지나치게 단정하지 않기 위해 성별 대칭을 살린 ‘남종들’과 ‘여종들’을 사용했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  english_pob_choice: After these things
  chosen_korean: 그 후에
  alternatives_korean:
  - 이 일들 후에
  - 그런 뒤에
  lexicon: LSJ
  rationale: 복수 지시사의 연쇄를 한국어로 자연스럽게 풀되, 서사 전환의 시간 순서를 분명히 살리기 위해 간결한 ‘그 후에’를 택했습니다.
- source_word: ἐξελέγησαν
  english_pob_choice: were chosen
  chosen_korean: 뽑혔습니다
  alternatives_korean:
  - 선택되었습니다
  - 선출되었습니다
  lexicon: LSJ
  rationale: 공적 직책 선출을 과도하게 암시하지 않으면서 수동 의미를 자연스럽게 전달하는 말로 ‘뽑혔습니다’를 사용했습니다.
- source_word: ἀρχηγοὶ οἴκου πατριῶν
  english_pob_choice: the heads of ancestral houses
  chosen_korean: 조상들의 집의 우두머리들
  alternatives_korean:
  - 족장들의 집의 우두머리들
  - 가문들의 우두머리들
  lexicon: LSJ
  rationale: 가문 단위를 가리키는 표현을 살리되, ‘집’과 ‘우두머리’의 결합으로 원문의 사회적 구조를 직접 반영했습니다.
- source_word: οἱ παῖδες αὐτῶν / αἱ παιδίσκαι
  english_pob_choice: their male servants / female servants
  chosen_korean: 그들의 남종들과 여종들
  alternatives_korean:
  - 그들의 종들과 여종들
  - 그들의 남자 종들과 여자 종들
  lexicon: LSJ
  rationale: 남성형과 여성형이 짝을 이루는 점을 드러내면서, 이 문맥에서는 가사 종살이/예속 상태를 함축할 수 있어 ‘남종/여종’으로 번역했습니다.
- source_word: τὰ κτήνη αὐτῶν
  english_pob_choice: their livestock
  chosen_korean: 그들의 가축
  alternatives_korean:
  - 그들의 집짐승
  - 그들의 짐승들
  lexicon: LSJ
  rationale: 이주 명단의 맥락에서 κτήνη는 가축을 가리키는 것이 가장 자연스러워, 현대 한국어의 표준적인 ‘가축’으로 옮겼습니다.
theological_decisions:
- issue: οἱ παῖδες / αἱ παιδίσκαι의 사회적 지위
  chosen_reading: 이 본문은 남종과 여종을 단순한 고용인으로만 약화시키지 않고, 예속된 가사 노동자를 포괄하는 표현으로 옮겼습니다.
  alternative_readings:
  - 남녀 종
  - 하인들과 하녀들
  - 종들과 여종들
  rationale: 영문 POB가 legal status를 과도하게 단정하지 않으면서도 household slaves/servants의 가능성을 열어 두었으므로, 한국어도 그 긴장을 유지하는 쪽이 본문에 충실합니다.
  doctrine_reference: 본문의 사회사적 의미와 어휘상의 폭을 보존하는 번역 원칙
