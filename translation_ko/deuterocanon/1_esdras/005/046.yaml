base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/046.yaml
  text: Now when the seventh month had come[a], and the sons of Israel were each in their own places[c][b], they gathered with one accord in the open area of the first gate on the east.
  footnotes:
  - marker: a
    text: Or, 'the Israelites.' The Greek reads 'the sons of Israel,' a covenantal familial expression.
    reason: lexical_alternative
  - marker: b
    text: Or, 'the broad place' or 'the square.' The Greek denotes a spacious open area.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew parallel in Nehemiah emphasizes that Israel was settled in their towns; the Greek here similarly presents each person as being in his own place before the assembly.
    reason: cross_reference
translation:
  language: ko
  text: 일곱째 달이 시작되었을 때, 이스라엘 자손이 각각 자기 처소에 있었는데, 그들은 한마음으로 동쪽에 있는 첫째 문의 넓은 곳에 모였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘각각 자기에게 속한 곳에’. 그리스어는 각 사람이 자기에게 속한 곳에 있었음을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 평행문은 이스라엘이 각기 자기 성읍들에 자리하고 있었음을 강조합니다.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐνστάντος δὲ τοῦ ἑβδόμου μηνός
  english_pob_choice: Now when the seventh month had come
  chosen_korean: 이레째 달이 이르매
  alternatives_korean:
  - 일곱째 달이 이르매
  - 일곱째 달이 시작되매
  - 일곱째 달이 되었을 때
  lexicon: LSJ
  rationale: Ἐνστάντος는 달이 ‘이르다/도래하다’는 시작점을 나타내므로, 자연스러운 합쇼체로 ‘이르매’라고 옮겨 시간적 전환을 살렸습니다.
- source_word: τῶν υἱῶν Ἰσραήλ
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: LSJ
  rationale: 그리스어의 가족/언약적 표현을 살리되, 한국어 성경에서 익숙하고 성별로 오해되지 않는 표준 표현인 ‘이스라엘 자손’을 택했습니다.
- source_word: ἕκαστος ἐν τοῖς ἰδίοις
  english_pob_choice: each in their own places
  chosen_korean: 각각 자기의 처소에 있을 때
  alternatives_korean:
  - 각각 자기 집에 있을 때
  - 각자 자기 자리에서
  - 각각 자기 땅에 있을 때
  lexicon: LSJ
  rationale: ἰδίοις는 단순히 ‘집’보다 더 넓게 ‘자기에게 속한 곳’을 가리키므로, 문맥을 과도하게 좁히지 않는 ‘처소’로 옮겼습니다.
- source_word: ὁμοθυμαδόν
  english_pob_choice: with one accord
  chosen_korean: 동심으로
  alternatives_korean:
  - 한마음으로
  - 일치하여
  - 뜻을 같이하여
  lexicon: LSJ
  rationale: 이 부사는 단순 동시집합이 아니라 마음과 목적의 일치를 강조하므로, 동작의 합일을 드러내는 ‘동심으로’를 선택했습니다.
- source_word: τὸ εὐρύχωρον
  english_pob_choice: the open area
  chosen_korean: 넓은 곳
  alternatives_korean:
  - 넓은 광장
  - 빈터
  - 열린 공간
  lexicon: LSJ
  rationale: εὐρύχωρον은 넓고 열린 공간을 뜻하지만, 본문이 도시 구조를 단정하지 않으므로 가장 중립적인 ‘넓은 곳’으로 번역했습니다.
theological_decisions:
- issue: ὁμοθυμαδόν의 공동체적 일치
  chosen_reading: ‘동심으로’로 옮겨 물리적 집합이 아니라 공동의 마음과 목적을 강조했습니다.
  alternative_readings:
  - 한자리에 모여
