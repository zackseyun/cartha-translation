translation:
  language: ko
  text: 베바이의 아들들은 육백삼십삼 명이며, 아르가이의 아들들은 천삼백이십이 명입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 ‘아르가이’라고 읽습니다. 대략적으로 대응하는 마소라 본문에는 다른 이름인 ‘아스갓’과 다른 총수(1,222명)가 나오므로, 1 에스드라의 이 대목은 히브리어 목록과 정확히 일치하지 않습니다.
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ
  english_pob_choice: the sons of
  chosen_korean: ~의 아들들
  alternatives_korean:
  - 자손
  - 아들들
  lexicon: LSJ
  rationale: 계보·명부 형식에서 특정 조상/가문의 소속을 나타내는 관용구로 보고, 자연스러운 한국어 명부체인 ‘~의 아들들’로 옮겼습니다.
- source_word: Βηβαί
  english_pob_choice: Bebai
  chosen_korean: 베바이
  alternatives_korean:
  - 베바이
  lexicon: LSJ
  rationale: 그리스어 고유명사 Βηβαί를 현대 외래어 표기법에 맞춰 음역했습니다.
- source_word: Ἀργαί
  english_pob_choice: Argai
  chosen_korean: 아르가이
  alternatives_korean:
  - 아라이
  - 아스갓
  lexicon: LSJ
  rationale: 주본문의 그리스어 형태 Ἀργαί를 우선하여 음역했으며, 히브리어 병행본의 다른 이름 전통은 주석으로 처리하는 편이 본문 충실도에 맞습니다.
- source_word: ἑξακόσιοι τριάκοντα τρεῖς / χίλιοι τριακόσιοι εἴκοσι δύο
  english_pob_choice: six hundred thirty-three / one thousand three hundred twenty-two
  chosen_korean: 육백서른세 명 / 천삼백스물두 명
  alternatives_korean:
  - 육백 삼십삼 명 / 천삼백이십이 명
  - 육백서른셋 / 천삼백스물둘
  lexicon: LSJ
  rationale: 명부의 수를 현대적이면서도 낭독 가능한 형식으로 옮겼고, ‘명’을 덧붙여 한국어 문장으로 자연스럽게 만들었습니다.
theological_decisions:
- issue: 그리스어 본문과 히브리어 평행본의 이름 차이
  chosen_reading: 본문은 Ἀργαί를 따르고, 히브리어 평행본과의 불일치는 본문 주석으로 다룹니다.
  alternative_readings:
  - 아스갓(히브리어 평행본)
  rationale: 1 Esdras는 평행 전승과 정확히 일치하지 않는 경우가 있으므로, 주된 번역은 현존 그리스어 본문을 따라야 합니다.
  doctrine_reference: 본문 비평 / 정경 간 평행전승
