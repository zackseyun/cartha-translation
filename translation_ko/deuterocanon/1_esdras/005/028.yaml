  lexicon: LSJ
  rationale: temple/community 명부 문맥에서 θυρωροί는 문이나 성문을 맡아 지키는 사람들을 가리키므로, 간결하고 현대적인 ‘문지기들’이 가장 직접적입니다.
- source_word: τετρακόσιοι
  english_pob_choice: four hundred
  chosen_korean: 사백 명
  alternatives_korean:
