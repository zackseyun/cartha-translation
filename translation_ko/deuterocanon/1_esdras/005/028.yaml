base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/028.yaml
  text: the gatekeepers[a], four hundred; the sons of Ishmael, sons of Lakubath[b], one thousand.
  footnotes:
  - marker: a
    text: The Greek text reads 'the sons of Ishmael, sons of Lakubath, one thousand.' The Hebrew parallel in Nehemiah 7 does not match this wording at this point, so the translation follows the Greek witness here rather than harmonizing to the Masoretic list.
    reason: textual_variant
  - marker: b
    text: Lakubath may reflect a name-form related to the better-known Akkub/Lakkub in parallel returnee lists.
    reason: lexical_alternative
translation:
  language: ko
  text: 문지기들은 사백 명이었고, 이스마엘의 아들들, 곧 라쿠밧의 아들들은 천 명이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 ‘이스마엘의 아들들, 라쿠밧의 아들들, 천 명’이라고 읽습니다. 느헤미야 7장의 히브리어 평행본문은 이 지점과 일치하지 않으므로, 여기서는 마소라 본문과 조화시키지 않고 그리스어 증거를 따랐습니다.
    reason: textual_variant
  - marker: b
    text: ‘라쿠밧’은 평행 귀환자 명부에 나오는 더 익숙한 이름형인 아쿱 또는 라쿱과 관련된 표기일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ θυρωροί
  english_pob_choice: the gatekeepers
  chosen_korean: 문지기들
  alternatives_korean:
