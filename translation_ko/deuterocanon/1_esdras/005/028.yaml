  lexicon: LSJ
  rationale: 그리스어 수사는 앞 그룹의 인원을 그대로 나타내므로, 자연스러운 한국어 수량 표현인 ‘사백 명’을 택했습니다.
- source_word: οἱ Ἰσμαήλου, υἱοὶ Λακουβάτου
  english_pob_choice: the sons of Ishmael, sons of Lakubath
  chosen_korean: 이스마엘의 아들들, 라쿠밧의 아들들
  alternatives_korean:
  - 이스마엘에게 속한 자들, 라쿠밧의 아들들
  - 이스마엘의 아들들, 라쿱의 아들들
  lexicon: LSJ
  rationale: 그리스어의 족보적 소유/소속 표현을 한국어 명부 문체에 맞게 ‘~의 아들들’로 옮겼고, 고유명사는 본문 증거에 따라 음역했습니다.
- source_word: χίλιοι
  english_pob_choice: one thousand
  chosen_korean: 천 명
  alternatives_korean:
  - 1,000명
  - 일천 명
  lexicon: LSJ
  rationale: 이전 수사와 같은 방식으로 인원수를 나타내는 표현이므로, 자연스러운 ‘천 명’을 사용했습니다.
theological_decisions:
- issue: 1 Esdras의 인명 목록이 사무엘하/느헤미야 평행본문과 불일치하는 지점의 처리
  chosen_reading: 그리스어 증거를 본문으로 유지하고, 한국어 본문은 목록 자체를 그대로 옮겼습니다.
  alternative_readings:
  - 평행본문에 맞추어 익숙한 인명으로 조화시키기
  - 마소라 본문의 이름 형태로 교정하기
  rationale: 이 절의 공신력 있는 기준은 스웨트 그리스어 본문이며, 공지된 평행본문 불일치는 본문 변개가 아니라 전승 차이로 다루어야 하므로 조화하지 않았습니다.
  doctrine_reference: 본문 비평 원칙
