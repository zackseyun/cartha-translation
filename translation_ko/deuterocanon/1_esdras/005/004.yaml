base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/004.yaml
  text: And these are the names of the men who were going up according to their ancestral houses[a], into their tribes[b], each to his own administrative division.
  footnotes:
  - marker: a
    text: Or 'by their fathers' houses.' The Greek πατριαί refers to kinship groups traced through ancestral lineage.
    reason: lexical_alternative
  - marker: b
    text: The term rendered 'administrative division' translates the rare Greek word μεριδαρχίαν, which may denote a district, territorial allotment, or other formal division.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 자기들의 조상 집안들[a]에 따라 올라가는 사람들의 이름이며, 각자 자기의 행정 구역[b]으로 들어갑니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘조상들의 집안들’. 그리스어 πατριαί는 조상 계보를 따라 구분되는 친족 집단을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘행정 구역’은 희귀한 그리스어 μεριδαρχίαν을 옮긴 것으로, 구역·배당 구역·공식적 분할 단위 등을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν ἀνδρῶν
  english_pob_choice: of the men
  chosen_korean: 사람들의
  alternatives_korean:
  - 남자들의
  - 남성들의
  lexicon: LSJ
  rationale: 명단 서두의 총칭을 자연스러운 한국어로 옮기되, 여기서는 이어지는 친족·지파 구분이 핵심이므로 성별보다 명단 전체의 인물성을 살렸습니다.
- source_word: κατὰ πατριὰς αὐτῶν
  english_pob_choice: according to their ancestral houses
  chosen_korean: 자기의 조상 집안들
  alternatives_korean:
  - 조상 가문들
  - 아버지들의 집안들
  lexicon: LSJ
  rationale: πατριά는 혈통·가계 단위를 가리키므로, POB의 'ancestral houses'를 따라 가문보다 계보적 뉘앙스를 보존했습니다.
- source_word: εἰς τὰς φυλὰς
  english_pob_choice: into their tribes
  chosen_korean: 지파들로
  alternatives_korean:
  - 각 지파 안으로
  - 그들의 지파로
  lexicon: LSJ
  rationale: φυλή는 이 문맥에서 이스라엘의 지파를 가리키므로 '지파'로 직역하고, 방향성을 살리기 위해 조사 '로'를 사용했습니다.
- source_word: μεριδαρχίαν
  english_pob_choice: administrative division
  chosen_korean: 행정 구역
  alternatives_korean:
  - 분구
  - 배정 구역
  - 통치 구역
  lexicon: LSJ
  rationale: 희귀한 행정 용어라서 문자적 음역보다 기능을 드러내는 표현이 필요하며, POB의 판단처럼 공식적 구획이라는 뜻을 간결하게 전달합니다.
theological_decisions:
- issue: 명단 서술의 담담한 문체
  chosen_reading: 역사 기록의 목록 서술로 보고, 서술적 평서문을 유지했습니다.
  alternative_readings:
  - 문학적으로 다듬어 목록의 의미를 강조하는 방식
  - 전통 교회식 표현으로 인명 열거를 격식화하는 방식
  rationale: 본문은 신학적 논평보다 귀환 집단의 이름과 배치를 기록하는 기능이 중심이므로, 의미를 덧붙이지 않고 목록의 행정적 성격을 보존했습니다.
  doctrine_reference: 성경 본문의 역사·서사 장르 존중
- issue: ἐπὶ τὴν μεριδαρχίαν αὐτῶν의 범위
  chosen_reading: 각자 자기의 행정 구역으로 들어갑니다
  alternative_readings:
  - 각자 자기의 분구로 갑니다
  - 각자 자기의 구역 위에 있습니다
  rationale: 희귀어의 정확한 제도적 범주가 확정적이지 않으므로, 의미를 과도하게 좁히지 않으면서도 기능적 행정 단위를 드러내는 표현을 택했습니다.
  doctrine_reference: 어휘의 불확정성 보존 원칙
