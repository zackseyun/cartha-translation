    text: 이 절의 히브리어 병행 전승은 크게 다르며, 대략 ‘벧엘과 아이의 사람들, 이백이십삼 명’으로 읽힙니다. 1 Esdras의 그리스어는 다른 이름과 총계를 보존합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
