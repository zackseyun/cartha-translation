  lexicon: LSJ
  rationale: 뒤의 수량도 동일한 방식으로 일관되게 옮겼습니다.
theological_decisions:
- issue: 1 Esdras의 그리스어 인명·수치와 MT 평행본문의 현저한 차이
  chosen_reading: 그리스어 본문에 따라 ‘칼라모칼루와 오누스의 자손… 여리고의 자손…’으로 그대로 옮기고, MT와의 조화는 시도하지 않았습니다.
  alternative_readings:
  - MT 병행의 ‘벧엘과 아이…’로 조정
  - 지명을 일반화하여 차이를 완화
  rationale: 외경/제외경 기록에서는 직접 본문 증거를 우선해야 하며, 이 절은 이름과 숫자에서 큰 불일치가 있어 조화 번역은 실제 그리스어 읽기를 가립니다.
  doctrine_reference: 'PHILOSOPHY.md: Deuterocanonical / Apocrypha; translation philosophy §1'
