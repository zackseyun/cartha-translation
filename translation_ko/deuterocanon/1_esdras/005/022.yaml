  lexicon: LSJ
  rationale: 그리스어 형태를 따라 음역했고, MT 병행의 다른 지명과 맞추어 정리하지 않았습니다.
- source_word: ἑπτακόσιοι εἴκοσι πέντε
  english_pob_choice: seven hundred twenty-five
  chosen_korean: 칠백이십오 명
  alternatives_korean:
