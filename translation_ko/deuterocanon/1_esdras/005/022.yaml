  lexicon: LSJ
  rationale: 그리스어 수사를 현대 한국어 관용에 맞게 간결하게 옮기고, 명사 수량 표지 ‘명’을 덧붙여 명부의 인원을 분명히 했습니다.
- source_word: διακόσιοι τεσσεράκοντα πέντε
  english_pob_choice: two hundred forty-five
