base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/060.yaml
  text: And from the priests[a], the Levites, and the heads of their ancestral houses came the elders who had seen the former house, and at the building of this one they cried out with a loud cry and great weeping[b],
  footnotes:
  - marker: a
    text: Or, 'with loud shouting and great weeping.' The Greek explicitly includes both an outcry and weeping; the wording may reflect a mixed public lament at seeing the new temple built in contrast to the former one.
    reason: lexical_alternative
  - marker: b
    text: The Greek says 'the former house' and 'this one,' preserving the temple idiom 'house' for the sanctuary.
    reason: cultural_note
translation:
  language: ko
  text: 제사장들과 레위 사람들과 가문별 우두머리들 가운데서, 이전 집[b]을 보았던 장로들이 나왔습니다. 이 집을 건축할 때에 그들은 큰 소리로 외치며 크게 울었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 κλαυθμοῦ μεγάλου는 ‘큰 울음’ 또는 ‘큰 통곡’을 뜻합니다. 본문은 큰 외침과 큰 울음을 함께 언급합니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 οἶκος(‘집’)는 일반 주택이 아니라 성전을 가리키는 관용적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: τῶν ἱερέων τῶν Λευειτῶν
  english_pob_choice: the priests, the Levites
  chosen_korean: 제사장들, 레위 사람들
  alternatives_korean:
  - 제사장들, 레위인들
  - 제사장들, 레위 자손들
  lexicon: LSJ / BDAG
  rationale: 그리스어는 두 집단을 병렬로 제시하므로 한국어도 분리해 살리고, Λευειτῶν은 표준적인 ‘레위 사람들’로 옮겨 집단 정체성을 자연스럽게 드러냈습니다.
- source_word: τῶν προκαθημένων κατὰ τὰς πατριὰς αὐτῶν
  english_pob_choice: the heads of their ancestral houses
  chosen_korean: 조상 집들의 우두머리들
  alternatives_korean:
  - 각 조상 집의 지도자들
  - 족속별 우두머리들
  - 가문의 우두머리들
  lexicon: LSJ
  rationale: προκαθημένων의 ‘앞에 서 있는/우두머리’라는 뜻과 πατριά의 혈통·가문 단위를 함께 살려, ‘조상 집들’과 ‘우두머리들’로 가족-계보 구조를 드러냈습니다.
- source_word: οἱ πρεσβύτεροι ἑωρακότες
  english_pob_choice: the elders who had seen
  chosen_korean: 장로들이 … 본
  alternatives_korean:
  - 나이 많은 이들이 … 본
  - 옛적에 본 장로들이
  lexicon: BDAG
  rationale: πρεσβύτεροι는 연장자와 공동체적 지위를 함께 가리킬 수 있어 ‘장로들’로 두되, ἑωρακότες는 과거에 실제로 목격했음을 분명히 하도록 ‘본’으로 옮겼습니다.
- source_word: τὸν πρὸ τοῦ οἶκον … τὴν τούτου οἰκοδομὴν
  english_pob_choice: the former house … the building of this one
  chosen_korean: 예전 집 … 이 집의 건축
  alternatives_korean:
  - 이전 집 … 이 집의 세움
  - 전의 집 … 이 집의 건축
  lexicon: LSJ
  rationale: 성전의 관용구인 ‘집’을 유지해 앞선 성전과 새 성전의 대비를 살렸고, οἰκοδομή는 단순한 ‘공사’보다 ‘건축’이 더 직접적으로 대응합니다.
- source_word: μετὰ κραυγῆς καὶ κλαυθμοῦ μεγάλου
  english_pob_choice: with a loud cry and great weeping
  chosen_korean: 큰 소리로 외치고 크게 울었습니다
  alternatives_korean:
  - 큰 부르짖음과 큰 울음으로
  - 큰 외침과 심한 통곡으로
  lexicon: BDAG
  rationale: κραυγή와 κλαυθμός의 두 요소를 모두 살려, 외침과 울음이 함께 나타난 공적 애곡의 장면을 한국어로 자연스럽게 전달했습니다.
theological_decisions:
- issue: 성전 칭호로서의 οἶκος(집) 유지
  chosen_reading: ‘집’으로 번역해 첫 성전과 두 번째 성전의 대비를 유지했습니다.
  alternative_readings:
  - ‘성전’으로 통일
  - ‘전(殿)’으로 고급화
  rationale: 본문은 ‘집’이라는 성전 관용구를 의도적으로 사용하므로, 이를 ‘성전’으로 평준화하면 반복되는 대비와 문학적 긴장이 약해집니다.
  doctrine_reference: 성전 표상과 본문 수사 보존
