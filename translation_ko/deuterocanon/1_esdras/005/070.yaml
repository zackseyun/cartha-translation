review_pass:
  verdict: revise
  source_fidelity: 후반절의 εἰρχθησαν은 복수 수동형으로, 문법상 ‘그들’(건축자들)이 건축 일을 하지 못하게 된 것을 가리킵니다. 현 초안의 ‘건축은 ... 중단되었습니다’는 가능한 사건 중심의 의역이지만, 원문의 복수 인칭 수동형을 소실합니다. 또한 χρον... ζωῆς는 고레스의 ‘생애/살아 있는 기간’ 전체를 뜻합니다.
  naturalness: ‘음모와 군중 선동과 파벌 형성으로’는 명사 나열이 다소 딱딱하므로 동사형 병렬로 다듬었습니다. ‘두 해 동안 건축 일을 하지 못하게 되었습니다’는 현대 표준 한국어 합쇼체에서 자연스럽고, 수동적 제지를 무리 없이 전달합니다.
  terminology: 고레스와 다리오는 통용되는 한국어 성경식 고유명사입니다. βουλάς, δημαγωγοῦντες, συστάσεις ποιούμενοι의 적대적·조직적 뉘앙스는 각각 ‘음모를 꾸미고’, ‘군중을 선동하며’, ‘파벌을 형성하여’로 보존했습니다. 각주 a는 해당 시간 표현에, 각주 b는 후반 수동절에 직접 붙여 앵커를 바로잡았습니다.
  issues:
  - severity: high
    issue: 후반절의 복수 수동형 εἰρχθησαν이 단수·비인칭적인 ‘건축은 중단되었습니다’로 번역되었습니다.
    rationale: 그리스어는 건축 자체가 아니라 앞선 복수 주어가 ‘건축과 관련하여 제지/억제되었다’고 말합니다. 사건 중심의 대안은 각주로 제시할 수 있으나, 본문은 인칭과 수동성을 보존해야 합니다.
