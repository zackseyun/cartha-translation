base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/070.yaml
  text: And by plots and by stirring up the crowds and by forming factions[a], they hindered the building from being completed all the time of the life of King Cyrus; and the building was halted for two years[b], until the reign of Darius.
  footnotes:
  - marker: a
    text: Or, 'throughout the lifetime of King Cyrus.' The Greek phrase is literally 'all the time of the life of King Cyrus.'
    reason: lexical_alternative
  - marker: b
    text: 'The final clause may also be understood more impersonally: ''the building was stopped for two years, until the reign of Darius.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 음모를 꾸미고 군중을 선동하며 파벌을 형성하여, 고레스 왕이 살아 있는 동안 내내[a] 그 건축이 완공되지 못하도록 막았습니다. 그리고 그들은 다리오의 통치 때까지 두 해 동안 건축 일을 하지 못하게 되었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘고레스 왕의 평생 동안’이라고 할 수 있습니다. 그리스어 표현은 문자적으로 ‘고레스 왕의 생애의 모든 시간’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 비인칭적으로 ‘건축이 다리오의 통치 때까지 두 해 동안 중단되었다’고 이해할 수도 있습니다. 그러나 그리스어 동사는 복수형이므로, 본문은 건축자들이 건축 일을 하지 못하게 되었다고 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: βουλὰς
  english_pob_choice: plots
  chosen_korean: 음모
  alternatives_korean:
  - 계획
  - 책략
  - 모의
  lexicon: LSJ
  rationale: 적대적 문맥에서 단순한 ‘계획’보다 숨은 해악의 뉘앙스를 가진 ‘음모’가 Greek의 부정적 의도를 더 잘 드러냅니다.
- source_word: δημαγωγοῦντες
  english_pob_choice: stirring up the crowds
  chosen_korean: 군중 선동
  alternatives_korean:
  - 백성을 선동하며
  - 민중을 선동하며
  - 사람들을 부추기며
  lexicon: LSJ
  rationale: δημαγωγεῖν은 대중을 부추기거나 선동하는 의미이므로, 한국어에서는 간결하고 자연스러운 ‘군중 선동’으로 옮겼습니다.
- source_word: συστάσεις ποιούμενοι
  english_pob_choice: forming factions
  chosen_korean: 파벌 형성
  alternatives_korean:
  - 분파를 만들며
  - 패거리를 이루며
  - 당파를 조직하며
  lexicon: LSJ
  rationale: 이 표현은 조직된 반대 세력의 결성을 가리키므로, ‘파벌 형성’이 가장 직접적으로 대응합니다.
- source_word: πάντα τὸν χρόνον τῆς ζωῆς τοῦ βασιλέως Κύρου
  english_pob_choice: all the time of the life of King Cyrus
  chosen_korean: 고레스 왕의 생애가 다하는 동안
  alternatives_korean:
  - 고레스 왕의 평생 동안
  - 고레스 왕의 생존 기간 내내
  - 고레스 왕이 살아 있는 동안
  lexicon: LSJ
  rationale: 그리스어의 다소 어색한 ‘생애의 모든 시간’ 표현을 과도하게 매끈하게 만들지 않으면서도, 한국어로는 자연스러운 의미가 되도록 옮겼습니다.
- source_word: εἰρχθησαν τῆς οἰκοδομῆς
  english_pob_choice: the building was halted
  chosen_korean: 건축은 ... 중단되었습니다
  alternatives_korean:
  - 건축이 멈추었습니다
  - 건축이 저지되었습니다
  - 그들은 건축을 못 하게 되었습니다
  lexicon: LSJ
  rationale: 수동형의 핵심은 ‘건축’ 자체가 중단된 상태이므로, 주어를 사건으로 두는 ‘건축은 중단되었습니다’가 본문 흐름에 가장 잘 맞습니다.
theological_decisions:
- issue: 수동절의 주어 처리
  chosen_reading: 후반부 수동절은 사람들에게 직접 행동이 가해졌다고 보기보다, 건축 작업 자체가 일정 기간 멈춘 상태를 묘사하는 것으로 처리했습니다.
  alternative_readings:
  - 그들이 건축에서 막혔습니다
  - 누군가가 그들을 건축에서 멈추게 했습니다
  rationale: 그리스어 수동형과 전체 문맥을 함께 고려하면, 사건 중심으로 번역하는 편이 인과를 덜 과장하면서도 본문의 역사적 진술을 살릴 수 있습니다.
  doctrine_reference: 서술상의 수동 표현은 가능한 한 원문의 문법과 역사적 의미를 보존합니다.
