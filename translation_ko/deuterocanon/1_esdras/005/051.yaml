base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/051.yaml
  text: And after these[a], the regular offerings[b], and the sacrifices for Sabbaths and new moons and all the consecrated feasts.
  footnotes:
  - marker: a
    text: Or 'the continual offerings.' The Greek term behind 'regular' can denote offerings made continuously or on a fixed recurring basis.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew parallel in Ezra emphasizes the burnt offering 'day by day, according to the number required for each day.' First Esdras here presents a broader summary of the regular sacred calendar.
    reason: cross_reference
translation:
  language: ko
  text: 그리고 그 뒤에 정규 제물들과 안식일과 초하루와 모든 거룩하게 구별된 절기의 제물들을 드렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘정규’는 여기서 끊임없는 연속보다 정기적으로 반복되는 제의 관행을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 병행 본문은 날마다 드리는 번제를 강조하지만, 이 그리스어 본문은 더 넓은 예배 달력 전체를 요약합니다.
    reason: cross_reference
lexical_decisions:
- source_word: προσφορὰς ἐνδελεχισμοῦ
  english_pob_choice: the regular offerings
  chosen_korean: 정규 제물들
  alternatives_korean:
  - 계속 드리는 제물들
  - 항상 드리는 제물들
  - 상시 제물들
  lexicon: LSJ
  rationale: ἐνδελεχισμοῦ는 지속적·정기적 반복의 뜻을 담으므로, 한국어에서는 자연스럽고 현대적인 ‘정규’로 옮겨 반복성의 핵심을 살렸습니다.
- source_word: θυσίας
  english_pob_choice: sacrifices
  chosen_korean: 제물들
  alternatives_korean:
  - 희생제물들
  - 희생들
  - 제사
  lexicon: LSJ
  rationale: 앞의 προσφορὰς와 구별되는 희생 제의 항목이므로, 일반적인 ‘제물’로 옮겨 제사적 성격을 유지했습니다.
- source_word: σαββάτων καὶ νουμηνιῶν
  english_pob_choice: Sabbaths and new moons
  chosen_korean: 안식일과 초하루
  alternatives_korean:
  - 안식일들과 초하루들
  - 안식일과 새 달
  - 안식일과 신월
  lexicon: LSJ
  rationale: 유대력의 고정된 예배일을 한국어 성경에서 널리 쓰는 용례에 따라 ‘안식일’과 ‘초하루’로 옮겼습니다.
- source_word: ἑορτῶν πασῶν ἡγιασμένων
  english_pob_choice: all the consecrated feasts
  chosen_korean: 모든 거룩하게 구별된 절기
  alternatives_korean:
  - 모든 성별된 절기
  - 모든 거룩한 절기
  - 모든 봉헌된 절기
  lexicon: LSJ
  rationale: ἡγιασμένων은 단순히 ‘거룩한’보다 ‘구별하여 바친/성별한’ 뉘앙스가 강하므로, 예배 달력의 지정성을 드러내는 ‘거룩하게 구별된’으로 옮겼습니다.
theological_decisions:
- issue: 1 Esdras의 압축된 제의 목록을 히브리어 병행구와 과도하게 일치시키지 않을지
  chosen_reading: 그리스어 본문이 제시하는 범주적 목록을 따라 ‘정규 제물들, 안식일과 초하루와 모든 거룩하게 구별된 절기’로 옮겼습니다.
  alternative_readings:
  - ‘항상 드리는 제물들’로 더 풀어 번역할 수 있음
  - ‘지정된 절기들’로 일반화할 수 있음
  rationale: 이 절은 병행 히브리어 본문보다 더 넓은 전례 목록을 제시하므로, 히브리어에 맞춰 좁히기보다 그리스어의 범주성과 리듬을 보존하는 편이 본문의 의미를 더 정확히 드러냅니다.
  doctrine_reference: 원문 우선 번역 원칙; 병행 본문은 보조적 의미 확인용
