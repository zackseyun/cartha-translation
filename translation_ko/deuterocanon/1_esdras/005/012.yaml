    reason: alternative_reading
translation:
  language: ko
  text: 요람의 자손은 두 명이며, 자투의 자손은 아흔아홉백 칠십 명, 호르베의 자손은 칠백오 명, 바네이의 자손은 육백사십팔 명입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 Ζατοῦ를 따른 음역입니다. MT 평행 전통에는 Zattu가 보입니다.
    reason: source_note
  - marker: b
    text: 그리스어 Χορβέ는 히브리어 평행 전통과 완전히 일치하지 않으며, 전승 차이가 있습니다.
    reason: textual_variant
  - marker: c
    text: 그리스어 Βανεί는 MT 평행의 Bani와 대응하지만, 본문은 그리스어 형태를 우선합니다.
    reason: alternative_reading
