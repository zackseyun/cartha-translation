  text: the sons of Iolamus[a], two; the sons of Zatou, nine hundred seventy; the sons of Chorbe, seven hundred five; the sons of Banei, six hundred forty-eight[c][b];
  footnotes:
  - marker: a
    text: Greek Ζατοῦ, rendered here as Zatou; the MT-parallel tradition has Zattu.
    reason: alternative_reading
  - marker: b
    text: Greek Χορβέ is uncertain in relation to the Hebrew parallel traditions; some parallel lists preserve a different family name here.
