translation:
  language: ko
  text: 이올라무스의 자손은 두 명이며, 자투[a]의 자손은 구백칠십 명, 코르베[b]의 자손은 칠백오 명, 바네이[c]의 자손은 육백사십팔 명입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 Ζατοῦ를 따른 음역입니다. MT 평행 전통에는 자투(Zattu)가 나옵니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어 Χορβέ는 히브리어 평행 전통과의 관계가 불확실합니다. 일부 평행 목록에는 여기와 다른 가문명이 보존되어 있습니다.
    reason: textual_variant
  - marker: c
    text: 그리스어 Βανεί를 따른 음역입니다. MT 평행 전통에는 바니(Bani)가 나오며, 히브리어 목록의 총수도 다릅니다.
    reason: alternative_reading
