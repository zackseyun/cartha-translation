base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/007.yaml
  text: Now these are the ones from Judea who came up from the captivity of the exile[a], whom Nebuchadnezzar king of Babylon had carried away to Babylon[b],
  footnotes:
  - marker: a
    text: The Hebrew parallel in Ezra 2:1 reads 'the sons of the province' rather than 'the ones from Judea.' This draft follows the Greek text of 1 Esdras as the primary source.
