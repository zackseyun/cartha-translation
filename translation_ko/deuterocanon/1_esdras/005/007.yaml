translation:
  language: ko
  text: 이들은 유다 출신으로, 바빌론 왕 느부갓네살이 바빌론으로 강제 이주시킨 유배 생활의 포로 상태에서 올라온 사람들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 ‘유다’라고 합니다. 병행 본문인 에스라 2:1의 히브리어는 ‘그 지방의 자손들’이라고 합니다.
    reason: alternative_reading
  - marker: b
    text: ‘강제 이주시킨’은 ‘유배시킨’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἐκ τῆς Ἰουδαίας
  english_pob_choice: the ones from Judea
  chosen_korean: 유다에서 올라온 자들
  alternatives_korean:
  - 유대에서 올라온 자들
  - 유다 사람들
  lexicon: BDAG
  rationale: 그리스어의 지역명 Ἰουδαία를 한국어로는 문맥상 ‘유다’로 옮길 수 있으며, 이어지는 ἀναβάντες의 상승 관용구와 맞물려 ‘올라온’이 자연스럽습니다.
- source_word: οἱ ἀναβάντες
  english_pob_choice: who came up
  chosen_korean: 올라온 자들
  alternatives_korean:
  - 올라온 사람들
  - 돌아온 자들
  lexicon: BDAG
  rationale: 포로기 귀환 문맥에서 ἀναβαίνω는 ‘올라가다’의 관용적 표현이므로, 출발점보다 예루살렘/유다로의 상승을 살려 ‘올라온’으로 옮겼습니다.
- source_word: ἐκ τῆς αἰχμαλωσίας τῆς παροικίας
  english_pob_choice: from the captivity of the exile
  chosen_korean: 포로 생활의 포로들
  alternatives_korean:
  - 포로의 유배에서
  - 포로 생활에서
  lexicon: BDAG
  rationale: αἰχμαλωσία는 ‘포로 됨/포로 상태’이고 παροικία는 이주·거류의 상태를 가리켜, 둘을 풀어 ‘포로 생활’로 살리되 반복 어감을 유지해 ‘포로들’로 마무리했습니다.
- source_word: μετῴκισεν
  english_pob_choice: had carried away
  chosen_korean: 사로잡아 간
  alternatives_korean:
  - 옮겨 간
  - 유배시킨
  lexicon: BDAG
  rationale: μετοικίζω는 강제 이주시킴, 곧 포로로 끌고 감의 뜻이므로, 바빌론으로의 강제 이송을 드러내는 ‘사로잡아 간’이 가장 직접적입니다.
theological_decisions:
- issue: 이 장의 집단 표지와 서술 순서
  chosen_reading: 본문의 그리스어를 따라 ‘유다에서 올라온 자들’과 ‘포로 생활의 포로들’을 구분해, 귀환 공동체의 정체성을 역사적 사실로 제시했습니다.
  alternative_readings:
  - MT 병행처럼 ‘성읍/지방의 아들들’로 일반화하는 읽기
  - ‘귀환한 사람들’로만 평탄화하는 읽기
  rationale: 1 Esdras의 그리스어는 MT와 달리 Ἰουδαία를 분명히 말하므로, 귀환 집단의 지리적·역사적 표지를 지우지 않는 쪽이 본문 충실도가 높습니다.
  doctrine_reference: 본문-기반 역사 서술의 보존
