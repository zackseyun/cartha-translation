translation:
  language: ko
  text: 그리고 각자는 예루살렘과 유대의 나머지 지역, 곧 자기 성읍으로 돌아갔습니다. 그들은 스룹바벨과 예수아, 느헤미야, 자라이야, 르사야, 에네니오스, 모르드개, 벨사루스, 아스파라수스, 보로엘리우스, 로이무스, 바아나, 곧 그들의 지도자들과 함께 온 사람들이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 이름 목록의 몇몇 이름은 에스라/느헤미야의 대략적인 히브리어 평행본문과 형태가 다릅니다. 이 번역은 히브리어 형태로 정규화하지 않고 1 에스드라의 그리스어 본문을 따릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέστρεψεν
  english_pob_choice: returned
  chosen_korean: 돌아갔습니다
  alternatives_korean:
  - 되돌아갔습니다
  - 돌아왔습니다
  lexicon: LSJ
  rationale: 이동의 종결과 이전 거처로의 복귀를 자연스럽게 드러내면서도, 문맥상 단순한 방향 전환보다 귀환의 의미를 살렸습니다.
- source_word: τὴν λοιπὴν Ἰουδαίαν
  english_pob_choice: the rest of Judea
  chosen_korean: 유대의 남은 지역
  alternatives_korean:
  - 유대의 나머지 지역
  - 남은 유대
  lexicon: LSJ
  rationale: λοιπή의 ‘남은/나머지’ 의미를 살리되, 예루살렘과 대비되는 지역 전체를 가리키는 말로 한국어에서 자연스럽게 옮겼습니다.
- source_word: ἕκαστος εἰς τὴν ἰδίαν πόλιν
  english_pob_choice: each to his own city
  chosen_korean: 각자 자기 성읍으로
  alternatives_korean:
  - 각 사람은 자기 도시로
  - 각기 자기 고을로
  lexicon: LSJ
  rationale: ἕκαστος의 분배적 의미를 ‘각자’로, πόλις를 성읍으로 옮겨 고대 정착지의 뉘앙스를 유지했습니다.
- source_word: τῶν προηγουμένων αὐτῶν
  english_pob_choice: their leaders
  chosen_korean: 그들의 인도자들
  alternatives_korean:
  - 그들의 지도자들
  - 그들보다 앞서 간 사람들
  lexicon: LSJ
  rationale: προηγουμένων은 단순한 시간상 선행보다 앞장서는 사람들의 기능을 가리키므로, ‘인도자들’로 옮겨 목록의 결론을 살렸습니다.
theological_decisions:
- issue: 고유명사 목록의 표기 기준
  chosen_reading: 그리스어 본문의 형태를 따라 음역하되, 한국어에서 널리 굳은 이름은 익숙한 형태를 사용했습니다.
  alternative_readings:
  - 히브리어 평행본문에 맞춘 정규화
  - 모든 이름을 영어식으로 통일
  rationale: 이 절은 인명 목록의 변형이 핵심이므로, 1 Esdras의 그리스어 전승을 우선하고 MT와의 불일치를 지우지 않기 위해 그리스어 기반 음역을 유지했습니다.
  doctrine_reference: 본문 비평 및 정경 간 평행본문 처리 원칙
