revisions:
- from: 그리고 예루살렘과 유대의 남은 지역으로, 각자 자기 성읍으로 돌아갔습니다. 곧 스룹바벨과 예수아, 느헤미야, 스라야, 르사야, 에느니오스, 모르드개, 벨사루스, 아스바라수스, 보로에리우스, 로이무스, 바아나와 함께 온 사람들, 곧 그들의 인도자들이었습니다.[a]
  to: 그리고 각자는 예루살렘과 유대의 나머지 지역, 곧 자기 성읍으로 돌아갔습니다. 그들은 스룹바벨과 예수아, 느헤미야, 자라이야, 르사야, 에네니오스, 모르드개, 벨사루스, 아스파라수스, 보로엘리우스, 로이무스, 바아나, 곧 그들의 지도자들과 함께 온 사람들이었습니다.[a]
  rationale: 그리스어 본문에 따른 인명 형태를 보존하기 위해 ‘스라야’를 ‘자라이야’로 고쳤습니다. 또한 귀환자와 열거된 지도자들의 관계가 드러나도록 문장 구조를 재구성했습니다. ‘나머지 지역’은 τὴν λοιπὴν Ἰουδαίαν의 예루살렘 이외 유대 지역이라는 대비를 자연스럽게 유지합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:04:03Z'
review_pass:
  verdict: revise
  source_fidelity: 그리스어 본문의 귀환 진술과 ‘각자 자기 성읍으로’라는 분배적 표현은 대체로 반영되었습니다. 그러나 스라야는 그리스어 Ζαραίου의 형태를 히브리어 평행본문 쪽으로 정규화한 표기이므로, 그리스어를 우선한다는 번역 방침 및 각주와 일치하지 않습니다. 또한 현 문장의 마지막 동격은 귀환자들과 지도자들의 관계를 다소 불명확하게 만듭니다.
  naturalness: 현 번역은 ‘돌아갔습니다’의 주어와 뒤따르는 인명 목록의 관계가 문법적으로 매끄럽지 않습니다. 지도자 명단을 ‘그들의 지도자들인 …’으로 처리하면, 귀환한 이들과 그들을 이끈 명단의 관계가 자연스럽고 분명해집니다.
  terminology: ‘예루살렘’, ‘유대’, ‘성읍’, ‘스룹바벨’, ‘예수아’, ‘느헤미야’, ‘모르드개’는 현대 한국어 성경 문맥에서 적절합니다. 그 밖의 이름들은 본문의 그리스어 음역 형태를 유지해야 하므로 Ζαραίου는 ‘자라이야’로 옮기는 것이 안전합니다. ‘지도자들’은 προηγουμένων의 문맥상 의미를 자연스럽게 전달합니다.
  issues:
  - severity: medium
    issue: ‘스라야’가 그리스어 이름 형태를 평행 히브리어 본문 쪽으로 정규화합니다.
    rationale: 원문은 Ζαραίου(자라이야/자레야 계열)이며, 스라야는 히브리어 평행본문의 익숙한 형태입니다. 이 절에서는 그리스어 본문을 우선한다는 명시된 방침에 따라 구별을 보존해야 합니다.
  - severity: medium
    issue: ‘곧 … 함께 온 사람들, 곧 그들의 인도자들이었습니다’의 문장 구조가 지도자와 귀환자 사이의 관계를 흐립니다.
    rationale: 그리스어의 τῶν προηγουμένων αὐτῶν은 열거된 인물들이 귀환자들의 지도자임을 나타냅니다. 이를 ‘그들의 지도자들인 …와 함께 온 사람들’로 처리하면 관계가 명확해집니다.
  revised_text: 그리고 각자는 예루살렘과 유대의 나머지 지역, 곧 자기 성읍으로 돌아갔습니다. 그들은 스룹바벨과 예수아, 느헤미야, 자라이야, 르사야, 에네니오스, 모르드개, 벨사루스, 아스파라수스, 보로엘리우스, 로이무스, 바아나, 곧 그들의 지도자들과 함께 온 사람들이었습니다.[a]
  revised_footnotes:
