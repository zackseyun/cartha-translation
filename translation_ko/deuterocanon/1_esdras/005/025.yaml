  rationale: 계수 목록 문맥에서 υἱοὶ는 혈연 집단 전체를 가리키는 관용적 표현이므로, 현대 한국어에서는 자연스럽고 포괄적인 ‘자손’으로 옮겨 목록의 성격을 살렸습니다.
