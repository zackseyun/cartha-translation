  lexicon: 고유명사 음역
  rationale: 영어 POB가 그리스어 형태 Φασσόρου를 따라 Phassor로 처리했으므로, 한국어도 히브리어 대응형을 끌어오지 않고 그리스어 기반 음역을 유지했습니다.
