translation:
  language: ko
  text: 파소르의 자손은 1,247명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 평행본문인 느헤미야 7:37은 “로드, 하딧, 오노의 자손” 725명이라고 읽습니다. 이 구절의 1 에스드라서는 그리스어 전승에서 다른 목록 위치와 내용을 반영합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
