base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/069.yaml
  text: But the nations of the land, joining themselves to those in Judea and besieging them, hindered the building of the house.
  footnotes:
  - marker: a
    text: Greek 'joining themselves to' is difficult; the phrase may also suggest 'pressing upon' or 'settling among' those in Judea. The sense in context is hostile involvement, clarified by 'besieging them.'
    reason: lexical_alternative
  - marker: b
    text: The Greek says simply 'to build'; 'the house' is supplied from the surrounding temple-rebuilding context.
    reason: cross_reference
translation:
  language: ko
  text: 그러나 그 땅의 민족들이 유다에 있는 사람들에게 달라붙어 그들을 포위하며 건축을 방해하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἐπικοιμώμενα는 드문 분사로 그 정확한 뜻이 불확실합니다. 여기서는 ‘달라붙어’로 옮겼으나, ‘그들 가운데 머물거나 정착하여’ 또는 ‘그들에게 압박을 가하여’라는 뜻으로 이해될 수도 있습니다. 뒤의 ‘포위하며’는 이 개입이 적대적이었음을 보여 줍니다.
    reason: lexical_alternative
  - marker: b
    text: τοῦ οἰκοδομεῖν은 문자적으로 ‘짓는 것’ 또는 ‘건축하는 것’입니다. 이 절에는 무엇을 짓는지가 명시되지 않았으므로 본문에서는 ‘건축’으로 옮겼습니다. 문맥은 성전 재건과 관련됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: τὰ δὲ ἔθνη τῆς γῆς
  english_pob_choice: the nations of the land
  chosen_korean: 그 땅의 민족들
  alternatives_korean:
  - 그 땅의 나라들
  - 그 땅의 백성들
  - 그 땅의 이방 민족들
  lexicon: LSJ
  rationale: ἔθνη는 여기서 주변의 민족 집단들을 가리키므로, ‘민족들’이 가장 자연스럽고 중립적입니다. '이방 민족들'은 NT식 종교 용어를 덧씌울 수 있어 피했습니다.
- source_word: ἐπικοιμώμενα
  english_pob_choice: joining themselves to
  chosen_korean: 다가붙어
  alternatives_korean:
  - 합세하여
  - 들러붙어
  - 가까이 붙어
  lexicon: LSJ
  rationale: 이 희귀한 분사는 문맥상 단순한 접근이 아니라 적대적 개입의 뉘앙스를 띱니다. ‘다가붙어’는 관계적으로 달라붙는 느낌을 살리면서도 문맥의 적대성을 과도하게 해석하지 않습니다.
- source_word: πολιορκοῦντες
  english_pob_choice: besieging them
  chosen_korean: 그들을 포위하여
  alternatives_korean:
  - 그들을 에워싸며
  - 그들을 성으로 포위하여
  - 그들을 압박하여
  lexicon: LSJ
  rationale: πολιορκέω의 기본 의미는 ‘포위하다/공격해 포위하다’이므로, ‘포위하여’가 군사적 은유와 위협의 강도를 가장 잘 드러냅니다.
- source_word: εἶργον τοῦ οἰκοδομεῖν
  english_pob_choice: hindered the building
  chosen_korean: 건축을 방해하였습니다
  alternatives_korean:
  - 짓는 일을 막았습니다
  - 건축하는 일을 저지하였습니다
  - 건축을 가로막았습니다
  lexicon: LSJ
  rationale: 미완료 과거의 지속적 방해를 ‘방해하였습니다’로 살렸습니다. τοῦ οἰκοδομεῖν은 목적어가 생략된 ‘짓다/건축하다’이므로, 문맥상 성전 재건을 가리키되 본문에 없는 ‘집/성전’을 본문에 직접 추가하지는 않았습니다.
theological_decisions:
- issue: 토지의 민족들과 유다 공동체 사이의 적대적 관계 표현
  chosen_reading: ‘다가붙어’와 ‘포위하여’로 연속 동작을 살려, 단순한 공존이 아니라 방해와 압박의 관계를 드러냈습니다.
  alternative_readings:
  - 합세하여
  - 정착하여
  - 함께
  rationale: 본문은 협력 관계가 아니라 적대적 개입과 방해를 묘사합니다. 따라서 관계의 긴장과 공격성을 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 본문-문맥 우선 원칙; 1 Esdras 5장의 성전 재건 방해 서술
