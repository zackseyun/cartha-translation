base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/062.yaml
  text: so that the people could not hear the trumpets because of the weeping of the people[a]; for the crowd was sounding them loudly[b], so that it was heard from far away.
  footnotes:
  - marker: a
    text: The Hebrew parallel in Ezra 3:11 describes the people raising a great shout in praise to the LORD; 1 Esdras here foregrounds the sound of trumpets and weeping in a more expanded way.
    reason: cross_reference
  - marker: b
    text: Or 'the trumpet blasts.' The Greek literally has 'the trumpets,' but the sense may be the sound they made.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 백성은 백성의 통곡 때문에 나팔 소리를 들을 수 없었습니다. 그 군중이 큰 소리로 불었으므로, 멀리서도 들렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 사람들의 ‘통곡’과 ‘나팔 소리’를 말하지만, 히브리어 평행본문(에스라 3:11)은 여호와께 대한 큰 외침과 찬양을 강조합니다.
    reason: cross_reference
  - marker: b
    text: 직역하면 ‘나팔들’이지만, 문맥상 실제 의미는 나팔이 내는 소리일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν λαόν
  english_pob_choice: the people
  chosen_korean: 백성
  alternatives_korean:
  - 사람들
  - 백성들
  - 회중
  lexicon: BDAG
  rationale: λαός는 이 서사에서 집단 전체를 가리키므로 자연스러운 단수 집합명사인 ‘백성’이 적합합니다. 같은 어구를 앞뒤로 유지해 반복 효과를 살렸습니다.
- source_word: μὴ ἀκούειν
  english_pob_choice: could not hear
  chosen_korean: 들을 수 없었습니다
  alternatives_korean:
  - 듣지 못했습니다
  - 들을 수 없었습니다
  - 들을 수 없게 되었습니다
  lexicon: BDAG
  rationale: 그리스어 결과 구문은 단순 부정이 아니라 실제 청취 불능을 나타내므로, 한국어에서도 능력 부정으로 옮겼습니다.
- source_word: τῶν σαλπίγγων
  english_pob_choice: the trumpets
  chosen_korean: 나팔 소리
  alternatives_korean:
  - 나팔들
  - 나팔 울림
  - 트럼펫 소리
  lexicon: BDAG
  rationale: 직역하면 ‘나팔들’이지만, 문맥상 실제로 들리는 것은 소리이므로 한국어에서는 자연스럽게 ‘나팔 소리’로 풀어 옮겼습니다.
- source_word: ὁ γὰρ ὄχλος ἦν ὁ σαλπίζων μεγάλως
  english_pob_choice: for the crowd was sounding them loudly
  chosen_korean: 그 군중이 큰 소리로 불었으므로
  alternatives_korean:
  - 그 군중이 크게 불고 있었으므로
  - 무리가 크게 나팔을 불었으므로
  - 그 군중이 큰 소리로 울려 퍼뜨렸으므로
  lexicon: BDAG
  rationale: ὁ σαλπίζων은 나팔을 부는 행위를 가리키므로, 한국어에서도 동작을 분명히 드러냈습니다. ‘큰 소리로’는 μεγάλως의 강도를 살립니다.
theological_decisions:
- issue: Greek witness foregrounds trumpets and weeping, while the Hebrew parallel emphasizes praise and a loud shout.
  chosen_reading: 본문의 그리스어 증거를 따라 ‘백성의 통곡’과 ‘나팔 소리’를 본문 의미로 유지했습니다.
  alternative_readings:
  - 에스라 3:11의 평행본문처럼 ‘찬양의 큰 외침’으로 조정하기
  - 히브리어 평행본문을 따라 재구성하기
  rationale: 이 절은 1 Esdras의 확장된 그리스어 전승이 핵심이므로, 평행본문으로 본문을 평준화하지 않고 차이를 그대로 드러내는 것이 번역 원칙에 맞습니다.
  doctrine_reference: 본문 비평 및 평행본문 처리 원칙
- issue: ὥστε 절의 결과성을 한국어에서 어떻게 살릴지
  chosen_reading: ‘그리하여 … 들을 수 없었습니다’로 결과를 앞세웠습니다.
  alternative_readings:
  - ‘그래서 … 들을 수 없었습니다’로 더 구어적으로 옮기기
  - ‘… 할 정도로’ 구조로 풀기
  rationale: 그리스어 ὥστε의 결과 뉘앙스를 분명히 하면서도, 서사문체에 맞는 현대 한국어로 자연스럽게 전달했습니다.
  doctrine_reference: 결과절의 서사적 기능
