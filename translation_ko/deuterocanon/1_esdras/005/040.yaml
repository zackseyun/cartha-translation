revisions:
- from: 그리고 느헤미야와 아타리아스가 그들에게 말하기를, 제사장이 일어나야 비로소 거룩한 것들에 참여하지 말라고 하였습니다. 그 제사장은 ‘현현’과 ‘진리’를 입고 있어야 합니다.[a][b]
  to: 느헤미야와 아타리아스는 그들에게 “‘계시’와 ‘진리’를 입은 제사장이 일어날 때까지 거룩한 것들에 참여하지 말라”고 말했습니다.[a][b]
  rationale: 그리스어 어순과 수식 관계를 따라 금지의 기간을 정확히 회복하고, 제사장이 ‘계시와 진리’를 입었다는 분사 수식을 한 문장으로 통합했습니다. δήλωσις는 ‘현현’ 대신 ‘계시’로 옮겼으며, 우림과 둠밈이라는 전통적 명칭은 각주에만 보존하여 그리스어 본문과 병행 히브리어 증거를 모두 존중했습니다.
