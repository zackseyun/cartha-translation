base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/040.yaml
  text: And Nehemiah and Atharias told them not to partake of the holy things until a priest should arise clothed with the Manifestation and the Truth[a][b].
  footnotes:
  - marker: a
    text: Traditionally, 'the Manifestation and the Truth' refers to the priestly objects known from the Hebrew parallel as the Urim and the Thummim.
    reason: alternative_reading
  - marker: b
    text: That is, they were not to eat from the sacred priestly provisions until a qualified priest could render a definitive decision.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 느헤미야와 아타리아스가 그들에게 말하기를, 제사장이 일어나야 비로소 거룩한 것들에 참여하지 말라고 하였습니다. 그 제사장은 ‘현현’과 ‘진리’를 입고 있어야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적으로 이 표현은 히브리어 병행본문의 ‘우림과 둠밈’을 가리키는 것으로 이해됩니다.
    reason: cross_reference
  - marker: b
    text: 즉, 그들은 제사장이 확정적인 판결을 내릴 수 있을 때까지 성전의 제의적 몫에 참여하지 말아야 했습니다.
    reason: cultural_note
lexical_decisions:
- source_word: εἶπεν αὐτοῖς
  english_pob_choice: told them
  chosen_korean: 그들에게 말하기를 ... 하였습니다
  alternatives_korean:
  - 그들에게 말했습니다
  - 그들에게 일렀습니다
  lexicon: BDAG
  rationale: 직접 명령 내용이 이어지므로 단순한 ‘말했습니다’보다 지시 내용을 도입하는 표현이 자연스럽고, 합쇼체도 유지됩니다.
- source_word: μὴ μετέχειν τῶν ἁγίων
  english_pob_choice: not to partake of the holy things
  chosen_korean: 거룩한 것들에 참여하지 말라고
  alternatives_korean:
  - 거룩한 것들을 먹지 말라고
  - 성물에 참여하지 말라고
  lexicon: BDAG
  rationale: μετέχειν은 ‘참여하다/함께 나누다’의 뜻이 기본이므로, 제의적 문맥을 살리되 과도하게 ‘먹다’로 한정하지 않고 ‘거룩한 것들에 참여하다’로 옮겼습니다.
- source_word: τῶν ἁγίων
  english_pob_choice: the holy things
  chosen_korean: 거룩한 것들
  alternatives_korean:
  - 성물
  - 거룩한 제물
  lexicon: BDAG
  rationale: 복수형과 제의적 범주를 살리기 위해 ‘거룩한 것들’로 번역하고, 전통 교회어인 ‘성물’은 의미를 지나치게 좁힐 수 있어 본문에는 두지 않았습니다.
- source_word: ἐνδεδυμένος τὴν δήλωσιν καὶ τὴν ἀλήθειαν
  english_pob_choice: clothed with the Manifestation and the Truth
  chosen_korean: ‘현현’과 ‘진리’를 입고 있어야 합니다
  alternatives_korean:
  - ‘계시’와 ‘진리’를 입고 있어야 합니다
  - ‘우림’과 ‘둠밈’을 입고 있어야 합니다
  lexicon: LSJ
  rationale: 영어 POB의 literal rendering을 따라 δήλωσις와 ἀλήθεια의 의미를 직접 살렸고, ἱερεὺς ἐνδεδυμένος는 ‘입고 있다’보다 상태를 드러내는 ‘입고 있어야 합니다’가 한국어에서 더 자연스럽습니다.
theological_decisions:
- issue: δήλωσιν καὶ τὴν ἀλήθειαν을 전통적 고유명사(우림과 둠밈)로 흡수할지, 그리스어 표현을 유지할지
  chosen_reading: 본문에는 ‘현현’과 ‘진리’를 유지합니다.
  alternative_readings:
  - 우림과 둠밈
  - 계시와 진리
  rationale: 이 구절은 그리스어 본문이 히브리어 고유명사를 음역하지 않고 의미적으로 풀어 쓴 형태이므로, 원문 가시성을 위해 본문은 그리스어 의미어를 따르는 것이 더 정확합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5; 1 Esdras의 그리스어 우선 원칙
