base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/050.yaml
  text: And they kept the Feast of Booths[a], as it is commanded in the law, and offered sacrifices day by day, as was fitting.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'the feast of Tabernacles.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 율법에 명령된 대로 초막절을 지키고, 마땅한 대로 날마다 제사를 드렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 전통적으로 ‘장막절’이라고도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγάγοσαν
  english_pob_choice: they kept
  chosen_korean: 지키고
  alternatives_korean:
  - 거행하고
  - 가졌고
  - 준수하고
  lexicon: LSJ
  rationale: 절기를 ἄγω의 관용적 용법으로 이해하여, 한국어에서는 ‘지키다’가 절기 준수의 의미를 가장 자연스럽고 정확하게 드러냅니다.
- source_word: τὴν τῆς σκηνοπηγίας ἑορτήν
  english_pob_choice: the feast of Booths
  chosen_korean: 초막절
  alternatives_korean:
  - 장막절
  - 초막 축제
  - 천막절
  lexicon: LSJ
  rationale: 그리스어 σκηνοπηγία는 초막/장막을 짓는 절기를 가리키므로, 한국어 성경 전통과 의미 투명성을 함께 살리는 ‘초막절’이 적절합니다.
- source_word: ἐν τῷ νόμῳ
  english_pob_choice: in the law
  chosen_korean: 율법에
  alternatives_korean:
  - 법에
  - 율법서에
  - 율법 안에
  lexicon: BDAG
  rationale: 여기서 νόμος는 일반 법이 아니라 절기 준거가 되는 모세 율법을 가리키므로 ‘율법’으로 옮기는 것이 맞습니다.
- source_word: καθ’ ἡμέραν
  english_pob_choice: day by day
  chosen_korean: 날마다
  alternatives_korean:
  - 매일
  - 하루하루
  - 연일
  lexicon: BDAG
  rationale: 반복성과 지속성을 나타내는 분포 표현이므로 ‘날마다’가 가장 간결하고 자연스럽습니다.
theological_decisions:
- issue: 절기 명칭의 번역 투명성
  chosen_reading: ‘초막절’로 옮기되, 본문은 축제의 구체적 의미를 직접 드러내는 현대어로 유지합니다.
  alternative_readings:
  - ‘장막절’
  - ‘수장절’
  rationale: ἑορτή와 σκηνοπηγία의 결합은 전통적 교회 용어보다 절기의 물리적 이미지를 살리는 번역이 소스에 더 가깝습니다. 이 구절은 교리 쟁점보다 역사적·예배적 사실 전달이 핵심입니다.
  doctrine_reference: 'Translation philosophy: original-language primacy and source transparency'
