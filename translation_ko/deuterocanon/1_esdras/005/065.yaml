base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/065.yaml
  text: And coming to Zerubbabel and Jeshua and the heads of the fathers’ houses[a], they said to them, “We will build with you.”
  footnotes:
  - marker: a
    text: Or, “We will join you in building.” The Greek verb means to build together with someone, not merely to offer general support.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 스룹바벨과 예수아와 가문의 우두머리들에게 다가가서, 그들에게 말하였습니다. “우리가 여러분과 함께 짓겠습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθόντες
  english_pob_choice: coming to
  chosen_korean: 다가가서
  alternatives_korean:
  - 와서
  - 나아가서
  lexicon: BDAG
  rationale: 행동의 선행성을 가진 부정과거 분사로, 말하기 전에 그들에게 가까이 간 동작을 자연스러운 현대 한국어로 나타냈습니다.
- source_word: τοῖς ἡγουμένοις τῶν πατριῶν
  english_pob_choice: the heads of the fathers’ houses
  chosen_korean: 조상들의 집의 우두머리들
  alternatives_korean:
  - 족장들의 우두머리들
  - 가문의 우두머리들
  lexicon: LSJ
  rationale: πατριά의 가문/족속 뜻을 살리면서도, POB의 source-direct 성격을 고려해 직역에 가까운 ‘조상들의 집’을 택했습니다.
- source_word: Ἰησοῦ
  english_pob_choice: Jeshua
  chosen_korean: 예수
  alternatives_korean:
  - 예수아
  - 여호수아
  lexicon: 표준 음역 관행
  rationale: 본문의 그리스어 표기만 보면 ‘예수’가 가능하지만, 이 문맥은 포로기 귀환기의 역사 서술이므로 한국어 고유 교회 전통상 가장 익숙한 인명 음역을 따랐습니다.
- source_word: Συνοικοδομήσομεν
  english_pob_choice: We will build with you
  chosen_korean: 우리가 당신들과 함께 지을 것입니다
  alternatives_korean:
  - 우리가 당신들과 함께 건축할 것입니다
  - 우리가 당신들과 함께 지을 것입니다
  lexicon: LSJ
  rationale: συν-의 공동 행위를 분명히 드러내되, ‘build with you’의 의미를 자연스러운 합쇼체로 옮겼습니다.
theological_decisions:
- issue: 히브리식 친족·가문 표지의 현대 한국어 표기
  chosen_reading: ‘조상들의 집’으로 옮겨 혈연·가문 단위를 드러냈습니다.
  alternative_readings:
  - ‘가문들’로 일반화
  - ‘족장들의 집’으로 축약
  rationale: 본문의 τῶν πατριῶν은 단순한 행정 직책이 아니라 혈연적 가문 구조를 가리키므로, 의미를 약화시키지 않는 방향을 택했습니다.
  doctrine_reference: 역사 서술의 사회적·가계적 정확성
- issue: 공동 건축 의지의 표현
  chosen_reading: ‘함께 지을 것입니다’로 공동 참여를 분명히 했습니다.
  alternative_readings:
  - ‘도와서 짓겠습니다’
  - ‘우리가 너희를 도울 것입니다’
  rationale: συνοικοδομέω는 단순한 지원이 아니라 함께 짓는다는 의미이므로, 협력의 실제성을 살려 번역했습니다.
  doctrine_reference: 문맥 우선의 어휘 정확성
