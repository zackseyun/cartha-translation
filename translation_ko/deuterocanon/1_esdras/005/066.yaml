  - 너희처럼
  lexicon: LSJ
  rationale: 비교 관계를 분명히 하면서도 한국어로 자연스럽게 풀었습니다.
- source_word: ἀκούομεν
  english_pob_choice: listen to
  chosen_korean: 듣고
  alternatives_korean:
