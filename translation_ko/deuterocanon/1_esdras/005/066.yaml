  - 귀 기울여 듣고
  - 순종하고
  lexicon: BDAG
  rationale: 단순 청취보다 관계적·응답적 의미를 남기되, 본문에 없는 ‘순종’으로 과도하게 좁히지 않았습니다.
- source_word: ἐπιθύσομεν
  english_pob_choice: we will sacrifice
  chosen_korean: 희생제를 드릴 것입니다
  alternatives_korean:
  - 제사를 드릴 것입니다
  - 희생제를 바칠 것입니다
  lexicon: LSJ
  rationale: 문맥상 제의적 희생을 가리키므로 평범한 ‘드리다’보다 제의성을 드러내는 표현을 택했습니다.
- source_word: Ἀσβακαφὰθ
  english_pob_choice: Asbakaphath
  chosen_korean: 아스바카팟
  alternatives_korean:
  - 아스바카팧
  - 에살핫돈
  lexicon: Greek proper name / transliteration
  rationale: 그리스어 표기를 따라 음역했고, 히브리 병행본문의 식별은 본문이 아니라 주석적 정보로 남기는 편이 적절합니다.
- source_word: μετήγαγεν ἡμᾶς ἐνταῦθα
  english_pob_choice: brought us here
  chosen_korean: 우리를 이리로 데려왔습니다
  alternatives_korean:
  - 우리를 여기로 옮겨왔습니다
  - 우리를 이곳으로 옮겨 놓았습니다
  lexicon: LSJ
  rationale: 이동·이송의 의미를 살리면서도 한국어에서 더 자연스러운 결과 상태를 표현했습니다.
theological_decisions:
- issue: ‘너희의 주’(τοῦ κυρίου ὑμῶν)의 직역 범위
  chosen_reading: ‘너희의 주’로 좁게 옮기고, ‘하나님’은 덧붙이지 않았습니다.
  alternative_readings:
  - 너희의 하나님
  - 주 너희 하나님
  rationale: 그리스어에는 ‘하나님’이 없으므로, 공적 번역어를 위해 본문 밖의 신학적 확장을 하지 않았습니다.
  doctrine_reference: DOCTRINE.md §§1, 3; contested term κύριος → 주
