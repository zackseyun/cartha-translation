base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/066.yaml
  text: For we also[a], like you, listen to your Lord, and we will sacrifice to him from the days of Asbakaphath king of the Assyrians[c][b], who brought us here.
  footnotes:
  - marker: a
    text: Asbakaphath is the Greek form here; the Hebrew parallel in Ezra 4:2 identifies this king as Esarhaddon.
    reason: alternative_reading
  - marker: b
    text: Or 'we will offer sacrifice to him.' The Greek verb refers specifically to sacrificial worship.
    reason: lexical_alternative
  - marker: c
    text: The phrase 'brought us here' may imply forced relocation or resettlement under Assyrian rule.
    reason: cultural_note
translation:
  language: ko
  text: 우리가 또한 너희와 같이 너희의 주의 말씀을 듣고, 아스바카팟 왕, 곧 앗수르 왕 때부터 그에게 희생제를 드릴 것입니다. 그는 우리를 이리로 데려왔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아스바카팟은 이곳의 그리스어 형태입니다. 히브리어 병행본문은 에스라 4:2에서 이 왕을 에살핫돈으로 식별합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그에게 희생제를 드릴 것입니다.’ 그리스어 동사는 제의적 희생을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: ‘우리를 이리로 데려왔습니다’는 강제 이주시켰다는 뉘앙스를 담을 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: ὁμοίως
  english_pob_choice: like you / also, like you
  chosen_korean: 우리도 너희와 같이
  alternatives_korean:
