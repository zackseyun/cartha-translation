base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/066.yaml
  text: For we also[a], like you, listen to your Lord, and we will sacrifice to him from the days of Asbakaphath king of the Assyrians[c][b], who brought us here.
  footnotes:
  - marker: a
    text: Asbakaphath is the Greek form here; the Hebrew parallel in Ezra 4:2 identifies this king as Esarhaddon.
    reason: alternative_reading
  - marker: b
    text: Or 'we will offer sacrifice to him.' The Greek verb refers specifically to sacrificial worship.
    reason: lexical_alternative
  - marker: c
    text: The phrase 'brought us here' may imply forced relocation or resettlement under Assyrian rule.
    reason: cultural_note
translation:
  language: ko
  text: 우리는 또한 너희처럼 너희의 주께 귀 기울이며, 앗수르 사람들의 왕 아스바카팟[a] 시대부터 그분께 희생 제사를 드릴 것입니다[b]. 그는 우리를 이곳으로 데려왔습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아스바카팟은 이곳의 그리스어 형태입니다. 히브리어 병행본문인 에스라 4:2에서는 이 왕을 에살핫돈으로 식별합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그분께 제사를 드릴 것입니다.’ 그리스어 동사는 특별히 제의적 희생을 드리는 것을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: ‘우리를 이곳으로 데려왔습니다’는 앗수르 통치 아래 강제 이주나 재정착을 암시할 수 있습니다.
    reason: cultural_note
