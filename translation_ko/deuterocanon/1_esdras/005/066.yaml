  rationale: 그리스어에는 ‘하나님’이 없으므로, 공적 번역어를 위해 본문 밖의 신학적 확장을 하지 않았습니다.
  doctrine_reference: DOCTRINE.md §§1, 3; contested term κύριος → 주
