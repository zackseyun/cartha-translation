  - 그들에게 합류했고
  lexicon: LSJ
  rationale: 중간/수동 뉘앙스를 살려 단순한 수동보다 자발적 접근감을 담되, 한국어에서는 자연스럽게 '모여들다'로 옮겼습니다.
- source_word: ἐκ τῶν ἄλλων ἐθνῶν τῆς γῆς
  english_pob_choice: from the other nations of the land
  chosen_korean: 그 땅의 다른 민족들 가운데서
  alternatives_korean:
  - 그 땅의 다른 나라들 가운데서
  - 그 땅에 있는 다른 민족들 가운데서
  lexicon: LSJ
  rationale: ἔθνη의 기본값을 '민족들'로 두고, 지리적 범위를 과잉해석하지 않도록 '그 땅의'를 유지했습니다.
- source_word: κατωρθώθησαν
  english_pob_choice: were strengthened
  chosen_korean: 굳게 섰습니다
  alternatives_korean:
  - 강해졌습니다
  - 확립되었습니다
  - 튼튼하게 되었습니다
  lexicon: LSJ
  rationale: 문맥상 제단의 제자리에 대한 안정·확립의 뜻이어서, 상태의 견고함을 드러내는 한국어 표현을 택했습니다.
- source_word: ὁλοκαυτώματα
  english_pob_choice: whole burnt offerings
  chosen_korean: 전부 태워 드리는 번제
  alternatives_korean:
  - 온전히 태워 드리는 제물
  - 번제
  lexicon: LSJ
  rationale: 단순한 '번제'보다 '전부 태워 드리는'을 넣어, 전소되는 제사의 의미를 분명히 했습니다.
theological_decisions:
- issue: 주님(Κυρίῳ)과 제의적 표현의 톤
  chosen_reading: 주님께 전부 태워 드리는 번제를 드렸습니다
  alternative_readings:
