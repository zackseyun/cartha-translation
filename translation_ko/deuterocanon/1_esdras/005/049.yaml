  - 주님께 번제를 드렸습니다
  rationale: κύριος를 프로젝트 기본값인 '주님'으로 옮기되, 제사 문맥의 행위성을 살려 동사구를 풀어 썼습니다.
  doctrine_reference: 'project glossary: κύριος (of Jesus) → 주/주님; cultic offering language'
