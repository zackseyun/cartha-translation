base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/059.yaml
  text: And all the people sounded trumpets and shouted with a loud voice, praising the Lord because of the raising up of the house of the Lord.
  footnotes:
  - marker: a
    text: Or 'because of the rebuilding of the house of the Lord.' The Greek says 'raising up,' which can refer more broadly to the temple's being erected or restored.
    reason: lexical_alternative
translation:
  language: ko
  text: 온 백성이 나팔을 불고 큰 소리로 외치며, 주님의 집을 세우는 일을 두고[a] 주님을 찬양했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 집을 재건하는 일을 두고’로 번역할 수 있습니다. 그리스어 ἐγέρσις는 ‘세움, 일으킴’을 뜻하며, 성전 문맥에서는 성전을 세우거나 복구하는 일을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ λαός
  english_pob_choice: all the people
  chosen_korean: 온 백성
  alternatives_korean:
  - 모든 백성
  - 온 회중
  lexicon: LSJ
  rationale: 집합명사 λαός의 총체성을 살리면서, 예배 현장의 공동체라는 뉘앙스를 자연스럽게 드러냅니다.
- source_word: ἐσάλπισαν
  english_pob_choice: sounded trumpets
  chosen_korean: 나팔을 불고
  alternatives_korean:
  - 나팔을 불며
  - 나팔 소리를 내고
  lexicon: LSJ
  rationale: 동사는 나팔을 불어 소리를 내는 행위를 뜻하므로, 한국어 관용에 맞게 직접 동작으로 옮겼습니다.
- source_word: ἐβόησαν φωνῇ μεγάλῃ
  english_pob_choice: shouted with a loud voice
  chosen_korean: 큰 소리로 외치며
  alternatives_korean:
  - 큰 소리로 소리치며
  - 큰 외침으로
  lexicon: LSJ
  rationale: βοάω의 외침과 φωνῇ μεγάλῃ의 음성 강도를 함께 살려, 두 요소를 합쳐 자연스럽게 표현했습니다.
- source_word: ἐπὶ τῇ ἐγέρσει
  english_pob_choice: because of the raising up
  chosen_korean: 다시 세워진 데 대한
  alternatives_korean:
  - 세워짐에 대한
  - 재건된 데 대한
  lexicon: LSJ
  rationale: ἐγέρσις의 기본 의미인 ‘세움/일으킴’을 살리되, 성전 문맥에서 자연스러운 결과 상태를 드러내도록 옮겼습니다. POB의 ‘raising up’의 넓은 의미를 반영했습니다.
theological_decisions:
- issue: κύριος의 한국어 처리
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 여호와
  rationale: 그리스어 본문이 κύριος를 사용하므로, 프로젝트 기본값에 따라 ‘주님’으로 옮겼습니다. 문맥상 이 호칭은 이스라엘의 하나님을 가리킵니다.
  doctrine_reference: 'DOCTRINE.md: Greek κύριος → Lord/주님'
- issue: ἐγέρσει의 범위 보존
  chosen_reading: 다시 세워진 데 대한
  alternative_readings:
  - 재건된 데 대한
  - 세워짐에 대한
  rationale: 본문은 성전이 ‘세워진/일으켜진’ 사실을 말하며, POB도 ‘raising up’의 더 넓은 이미지를 유지합니다. 특정 공정을 지나치게 좁히지 않도록 했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve lexical tension; avoid over-specifying temple-building stage'
