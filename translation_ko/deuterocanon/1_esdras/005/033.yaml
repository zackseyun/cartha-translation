    text: 그리스어 본문은 근사 병행본문인 마소라 본문보다 더 길고 서로 다른 이름들을 제시합니다. 마소라 본문에는 ‘깃델의 아들들, 가할의 아들들, 르아야의 아들들’이라는 더 짧은 목록이 나옵니다.
