translation:
  language: ko
  text: 솔로몬의 종들의 아들들, 아사페이오스의 아들들, 파레이다의 아들들, 이에일레의 아들들, 로존의 아들들, 이스다엘의 아들들, 사푸이에의 아들들.[a]
