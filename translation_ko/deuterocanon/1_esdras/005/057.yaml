base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/057.yaml
  text: And the priests stood arrayed with musicians and trumpets, and the Levites, the sons of Asaph, had the cymbals, praising the Lord and blessing him according to David king of Israel;
  footnotes:
  - marker: a
    text: Or 'with musical instruments and trumpets.' The Greek μουσικῶν can be understood more generally as musical accompaniment or instruments.
    reason: lexical_alternative
  - marker: b
    text: Or 'as prescribed by David king of Israel' or 'in the manner of David king of Israel.' The Greek leaves the exact force of conformity open.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 제사장들은 음악가들과 나팔수들과 함께 제복을 입고 서 있었고, 레위 사람들, 아삽의 자손들은 심벌즈를 들고 주님을 찬양하며 이스라엘의 왕 다윗에 따라 그분을 송축했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘음악 악기들과 나팔들과 함께’로도 옮길 수 있습니다. 그리스어 μουσικῶν은 보다 일반적으로 음악 반주나 악기들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이스라엘의 왕 다윗이 정한 대로’ 혹은 ‘이스라엘의 왕 다윗의 방식으로’로도 옮길 수 있습니다. 그리스어는 정확한 준거의 성격을 열어 둡니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐστολισμένοι
  english_pob_choice: arrayed
  chosen_korean: 제복을 입고
  alternatives_korean:
  - 차려입고
  - 단장하고
  - 예복을 입고
  lexicon: LSJ
  rationale: 의식적/제의적 차림을 나타내는 표현이므로, 자연스러우면서도 예배 맥락을 드러내는 ‘제복을 입고’로 옮겼습니다.
- source_word: μετὰ μουσικῶν καὶ σαλπίγγων
  english_pob_choice: with musicians and trumpets
  chosen_korean: 음악가들과 나팔수들과 함께
  alternatives_korean:
  - 악기들과 나팔들과 함께
  - 음악과 나팔들과 함께
  lexicon: LSJ
  rationale: μουσικῶν을 단순한 ‘음악’보다 연주자 집단으로 보는 POB의 판단을 살려, 제의 행렬에 맞는 ‘음악가들’로 옮겼습니다.
- source_word: ἔχοντες τὰ κύμβαλα
  english_pob_choice: had the cymbals
  chosen_korean: 심벌즈를 들고
  alternatives_korean:
  - 심벌즈를 가지고
  - 심벌즈를 지니고
  - 심벌즈를 잡고
  lexicon: LSJ
  rationale: ἔχοντες는 단순 소유보다 실제로 손에 든 상태를 가리키므로, 문맥상 자연한 ‘들고’를 선택했습니다.
- source_word: κατὰ Δαυεὶδ βασιλέα τοῦ Ἰσραήλ
  english_pob_choice: according to David king of Israel
  chosen_korean: 이스라엘의 왕 다윗에 따라
  alternatives_korean:
  - 이스라엘의 왕 다윗의 규정대로
  - 이스라엘의 왕 다윗의 방식대로
  - 이스라엘의 왕 다윗을 따라
  lexicon: LSJ
  rationale: κατά는 여기서 다윗의 선례/규범/방식에 대한 준거를 열어 두므로, 그 긴장을 살리는 ‘...에 따라’로 옮겼습니다.
theological_decisions:
- issue: κύριος의 번역
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 주 하나님
  rationale: 이 문맥에서 κύριος는 성전 예배 가운데 이스라엘의 하나님을 가리키므로, 한국어 예배 문맥에서 자연한 ‘주님’을 사용했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος'
- issue: 다윗과의 준거 표현(κατὰ)
  chosen_reading: '...에 따라'
  alternative_readings:
  - '...의 규정대로'
  - '...의 방식대로'
  rationale: 본문은 다윗의 권위 아래서 예배 행위가 이루어졌음을 말하지만, 정확히 법규인지 관행인지는 결정하지 않으므로 그 여지를 보존했습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
