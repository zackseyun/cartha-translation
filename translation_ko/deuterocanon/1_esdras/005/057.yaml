  naturalness: 현대 표준어 합쇼체에서는 ‘레위 사람들, 아삽의 자손들’보다 동격을 드러내는 ‘레위 사람들 곧 아삽의 자손들은’이 자연스럽습니다. 각주 표지는 해당 어구 바로 뒤에 배치해야 합니다.
  terminology: κύριος의 ‘주님’과 εὐλογοῦντες의 ‘송축했습니다’는 이 제의 문맥에 적절합니다. κύμβαλα는 현대 표준어에서 통용되는 ‘심벌즈’로 유지할 수 있습니다.
