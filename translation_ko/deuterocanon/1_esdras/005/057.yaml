revisions:
- from: 그리고 제사장들은 음악가들과 나팔수들과 함께 제복을 입고 서 있었고, 레위 사람들, 아삽의 자손들은 심벌즈를 들고 주님을 찬양하며 이스라엘의 왕 다윗에 따라 그분을 송축했습니다.[a][b]
  to: 그리고 제사장들은 예복을 갖추어 입고 음악가들과 나팔들과 함께 서 있었으며[a], 레위 사람들 곧 아삽의 자손들은 심벌즈를 들고 주님을 찬양하며 이스라엘 왕 다윗을 따라 그분을 송축했습니다.[b]
  rationale: 원문의 악기 명사를 정확히 반영하여 ‘나팔수들’을 ‘나팔들’로 고쳤고, 특정 현대 제복을 암시하는 표현을 의례적 차림을 나타내는 ‘예복을 갖추어 입고’로 조정했습니다. 다윗에 대한 κατά의 의미 범위는 ‘다윗을 따라’로 보존했으며, 각주 표지를 관련 어구에 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:04:01Z'
