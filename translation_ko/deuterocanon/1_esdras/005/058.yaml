base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/058.yaml
  text: And they cried out with hymns[a], blessing the Lord, because his goodness and his glory are forever for all Israel.
  footnotes:
  - marker: a
    text: Or, 'because his goodness and glory endure forever for all Israel.' The Greek clause is compressed and allows more than one natural English expansion.
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 찬송가들을 부르며 외치고, 주님을 송축했습니다. 그의 선하심과 그의 영광이 온 이스라엘을 위하여 영원하기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘찬송가들로’ 또는 ‘찬송 가운데’로도 옮길 수 있습니다. δι’ ὕμνων은 예배적 수단을 압축해 말한 표현입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐφώνησαν
  english_pob_choice: they cried out
  chosen_korean: 외치고
  alternatives_korean:
  - 소리치고
  - 부르짖고
  - 외쳤습니다
  lexicon: LSJ
  rationale: 공적이고 열정적인 발화의 힘을 살리되, 예배 맥락에서 한국어로 자연스럽게 들리도록 ‘외치고’로 옮겼습니다.
- source_word: δι’ ὕμνων
  english_pob_choice: with hymns
  chosen_korean: 찬송가들을 부르며
  alternatives_korean:
  - 찬송으로
  - 찬송들과 함께
  - 찬송을 통해
  lexicon: LSJ
  rationale: 도구·수단의 뜻을 한국어 예배 표현으로 자연화하여, 함께 부르는 찬양의 장면을 드러냈습니다.
- source_word: εὐλογοῦντες
  english_pob_choice: blessing
  chosen_korean: 송축했습니다
  alternatives_korean:
  - 축복하며
  - 찬양하며
  - 복을 빌며
  lexicon: LSJ
  rationale: 하나님을 향한 경배 행위로서의 ‘blessing’을 한국어 성경 문맥에 맞게 ‘송축하다’로 옮겼습니다.
- source_word: χρηστότης αὐτοῦ καὶ ἡ δόξα
  english_pob_choice: his goodness and his glory
  chosen_korean: 그의 선하심과 그의 영광
  alternatives_korean:
  - 그의 인자하심과 그의 영광
  - 그의 선함과 그의 영광
  - 그의 친절과 그의 영광
  lexicon: LSJ
  rationale: χρηστότης는 단순 친절보다 하나님의 선한 성품과 호의를 아우르는 말이어서, 문맥상 가장 넓고 자연한 ‘선하심’으로 옮겼습니다.
- source_word: εἰς τοὺς αἰῶνας παντὶ Ἰσραήλ
  english_pob_choice: for all Israel / upon all Israel
  chosen_korean: 온 이스라엘을 위하여 영원하기 때문입니다
  alternatives_korean:
  - 온 이스라엘을 위하여 영원합니다
  - 온 이스라엘 위에 영원합니다
  - 모든 이스라엘을 향해 영원합니다
  lexicon: LSJ
  rationale: ἰς와 여격이 함께 만드는 압축된 칭송 문장을 한국어에서는 ‘~을 위하여 영원하다’로 풀어, 영속성과 수혜 대상을 모두 살렸습니다.
theological_decisions:
- issue: κύριος의 번역
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 주여
  rationale: 그리스어 원문이 κύριος이므로 한국어 기본 대응인 ‘주님’을 택해, 예배적이면서도 과도한 관습어화를 피했습니다.
  doctrine_reference: 'POB contested terms: κύριος → 주님'
