base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/067.yaml
  text: Then Zerubbabel and Jeshua and the heads of the fathers’ houses of Israel said to them[b][a], “It is not for you to build the house for the Lord our God.”
  footnotes:
  - marker: a
    text: Greek Ἰησοῦς here refers to the postexilic high priest usually called Jeshua; alternatively, 'Joshua.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the temple'; literally, 'the house.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 스룹바벨과 예수아와 이스라엘의 조상 집들의 우두머리들이 그들에게 말했습니다. “그 집을 우리 하나님 주님을 위해 건축하는 것은 너희에게는 해당되지 않습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문의 Ἰησοῦς는 포로기 이후의 대제사장 예수아를 가리키며, 경우에 따라 ‘여호수아’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 원문의 τὸν οἶκον은 문자적으로 ‘집’이며, 문맥상 성전을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ζοροβαβὲλ
  english_pob_choice: Zerubbabel
  chosen_korean: 스룹바벨
  alternatives_korean:
  - 세룹바벨
  - 제로바벨
  lexicon: 고유명사 표기 관행
  rationale: 1스드라 5장 문맥에서 널리 통용되는 한국어 성서형 이름을 따랐습니다.
- source_word: Ἰησοῦς
  english_pob_choice: Jeshua
  chosen_korean: 예수아
  alternatives_korean:
  - 여호수아
  - 예수
  lexicon: 고유명사 표기 관행
  rationale: 포로기 이후 대제사장을 가리키는 인물이므로, 예수와의 혼동을 피하면서도 히브리어 계열 인명에 맞는 예수아를 택했습니다.
- source_word: οἱ ἡγούμενοι τῶν πατριῶν
  english_pob_choice: the heads of the fathers’ houses
  chosen_korean: 이스라엘의 조상 집들의 우두머리들
  alternatives_korean:
  - 이스라엘의 족장들
  - 조상 가문의 지도자들
  lexicon: BDAG / LSJ
  rationale: πατριῶν의 가문·족장 단위를 살리되, 한국어에서 자연스러운 ‘우두머리들’로 지도자 신분을 드러냈습니다.
- source_word: Οὐχ ὑμῖν τοῦ οἰκοδομῆσαι
  english_pob_choice: It is not for you to build
  chosen_korean: 건축하는 것은 너희에게는 해당되지 않습니다
  alternatives_korean:
  - 너희가 건축할 일은 아닙니다
  - 너희에게는 건축할 권한이 없습니다
  lexicon: BDAG
  rationale: 그리스어의 배제/금지 뉘앙스를 살리되, 직역투를 피하면서 한국어에서 명확한 금지 의미가 드러나게 했습니다.
- source_word: τὸν οἶκον
  english_pob_choice: the house
  chosen_korean: 그 집
  alternatives_korean:
  - 그 성전
  - 그 집
  lexicon: BDAG
  rationale: 원문은 문자적으로 ‘집’이므로 이를 유지했고, 문맥상 성전임은 독자가 알 수 있게 했습니다. POB의 source-direct 원칙에 맞춰 ‘성전’으로 미리 풀지 않았습니다.
theological_decisions:
- issue: Κυρίῳ θεῷ ἡμῶν의 한국어 처리
  chosen_reading: 우리 하나님 주님
  alternative_readings:
  - 우리 주 하나님
  - 우리 하나님 여호와
  rationale: 그리스어 본문이 κύριος를 쓰므로 기본값인 ‘주님’을 따르되, 병렬 히브리어 전승의 야훼 배경을 지우지 않도록 ‘우리 하나님’과 함께 병기했습니다. 문장 안에서는 대상이 ‘주님’께 속한 집임을 분명히 했습니다.
  doctrine_reference: 'POB terminology: κύριος → 주님; יהוה → 야훼'
