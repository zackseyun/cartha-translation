  alternative_readings:
  - 우리 주 하나님
  - 우리 하나님 여호와
  rationale: 그리스어 본문이 κύριος를 쓰므로 기본값인 ‘주님’을 따르되, 병렬 히브리어 전승의 야훼 배경을 지우지 않도록 ‘우리 하나님’과 함께 병기했습니다. 문장 안에서는 대상이 ‘주님’께 속한 집임을 분명히 했습니다.
  doctrine_reference: 'POB terminology: κύριος → 주님; יהוה → 야훼'
