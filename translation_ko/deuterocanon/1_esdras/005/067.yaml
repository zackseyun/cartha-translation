revisions:
- from: 그때 스룹바벨과 예수아와 이스라엘의 조상 집들의 우두머리들이 그들에게 말했습니다. “그 집을 우리 하나님 주님을 위해 건축하는 것은 너희에게는 해당되지 않습니다.”[a][b]
  to: 그때 스룹바벨과 예수아[a]와 이스라엘 조상 가문의 지도자들이 그들에게 말했습니다. “우리 하나님이신 주님을 위한 집[b]을 너희가 건축할 일은 아닙니다.”
  rationale: 그리스어를 우선하여 인명, ‘집’, 그리고 상대방을 배제하는 타원적 표현을 유지했습니다. ‘우리 하나님이신 주님’으로 호칭의 문법 관계를 분명히 하고, 직역투인 ‘해당되지 않습니다’를 자연스러운 합쇼체인 ‘건축할 일은 아닙니다’로 바꾸었습니다. ‘조상 가문’은 πατριῶν이 가리키는 부계 가문 단위를 보존하며, 성전이라는 문맥적 의미는 본문에 과도하게 풀어넣지 않고 각주에서 설명했습니다.
