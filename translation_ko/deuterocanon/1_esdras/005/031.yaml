base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/031.yaml
  text: the sons of Iaeir[a], the sons of Daisan, the sons of Noeba, the sons of Chaseba, the sons of Kazera, the sons of Ozeiou, the sons of Phinoe, the sons of Asara, the sons of Basthai, the sons of Assana, the sons of Manei, the sons of Napheisei, the sons of Akouph, the sons of Acheiba, the sons of Asour, the sons of Pharakem,
