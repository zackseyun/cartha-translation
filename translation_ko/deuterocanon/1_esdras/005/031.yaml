translation:
  language: ko
  text: 야에이르의 아들들.[a] 다이산의 아들들, 노에바의 아들들, 카세바의 아들들, 카제라의 아들들, 오제이우의 아들들, 피노에의 아들들, 아사라의 아들들, 바스타이의 아들들, 아사나의 아들들, 마네이의 아들들, 나페이세이의 아들들, 아쿠프의 아들들, 아케이바의 아들들, 아수르의 아들들, 파라켐의 아들들.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어 평행본문인 느헤미야 7:46은 이 지점에서 다른 이름들을 열거합니다. 곧 ‘느디님: 시하의 아들들, 하수바의 아들들, 답바옷의 아들들’입니다. 1 에스드라서는 여기에서 상당히 다른 그리스어 목록을 보존하므로, 이 번역은 히브리어 평행본문과 조화시키지 않고 그리스어 본문을 따릅니다.'
    reason: alternative_reading
