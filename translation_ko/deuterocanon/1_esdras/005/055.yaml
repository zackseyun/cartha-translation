    rationale: 본문을 ‘성전’으로 바로 번역하면 대안 각주가 필요하지 않습니다. ‘성소’는 ναός의 가능한 용례 범주이지만 이 건축·기초 문맥에서는 불필요하게 의미 범위를 넓힙니다.
