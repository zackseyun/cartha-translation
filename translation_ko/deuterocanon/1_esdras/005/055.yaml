base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/055.yaml
  text: And they laid the foundation of the temple of God on the new moon of the second month[a], in the second year after they had come into Judea and Jerusalem.
  footnotes:
  - marker: a
    text: Or 'the temple of God.' The Greek word here is the usual term for the sanctuary/temple.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 하나님의 집의 기초를 둘째 달의 초하루에, 곧 그들이 유다와 예루살렘에 도착한 뒤의 둘째 해에 놓았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 성전’. 여기서 그리스어 ναός는 성전/성소를 가리키는 일반적인 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθεμελίωσαν
  english_pob_choice: laid the foundation
  chosen_korean: 기초를 놓았습니다
  alternatives_korean:
  - 기초를 닦았습니다
  - 기초를 세웠습니다
  lexicon: LSJ
  rationale: τίθημι 계열의 건축 문맥에서 ‘기초를 놓다’가 가장 직접적이고 자연스럽게 원문의 행위를 드러냅니다.
- source_word: τὸν ναὸν τοῦ θεοῦ
  english_pob_choice: the temple of God
  chosen_korean: 하나님의 집
  alternatives_korean:
  - 하나님의 성전
  - 하나님의 성소
  lexicon: LSJ
  rationale: naos는 일반적으로 성전이지만, 기초를 놓는 건축 문맥과 에스라 전승의 표현 관용을 살려 ‘하나님의 집’으로 옮기면 건물 전체를 가리키는 뜻이 분명해집니다.
- source_word: τῇ νουμηνίᾳ τοῦ δευτέρου μηνός
  english_pob_choice: on the new moon of the second month
  chosen_korean: 둘째 달의 초하루에
  alternatives_korean:
  - 둘째 달의 신월에
  - 둘째 달의 새 달에
  lexicon: LSJ
  rationale: νουμηνία는 달의 첫날, 곧 초하루를 뜻하므로 한국어 성경 문맥에서는 ‘초하루’가 가장 정확합니다.
- source_word: ἐν τῷ ἐλθεῖν εἰς τὴν Ἰουδαίαν καὶ Ἰερουσαλήμ
  english_pob_choice: after they had come into Judea and Jerusalem
  chosen_korean: 그들이 유다와 예루살렘에 도착한 뒤에
  alternatives_korean:
  - 그들이 유다와 예루살렘에 왔을 때
  - 그들이 유다와 예루살렘으로 들어온 뒤에
  lexicon: LSJ
  rationale: 전치사구와 부정과거 부정사 구성은 시간적 선행을 나타내므로, 결과를 분명히 하는 ‘도착한 뒤에’가 자연스럽습니다.
theological_decisions:
- issue: ναός의 한국어 범주 선택
  chosen_reading: ‘하나님의 집’으로 하여 건축 대상의 실체를 드러냈습니다.
  alternative_readings:
  - ‘하나님의 성전’으로 직역할 수 있습니다.
  rationale: 이 절은 예배 제도보다 복구되는 건축물의 기초 놓음을 강조하므로, 전통적 교회어보다 본문 맥락에 맞는 건물 중심 표현이 더 적절합니다.
  doctrine_reference: Translation philosophy §1, §5
