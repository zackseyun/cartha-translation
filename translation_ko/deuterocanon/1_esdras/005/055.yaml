revisions:
- from: 그들은 하나님의 집의 기초를 둘째 달의 초하루에, 곧 그들이 유다와 예루살렘에 도착한 뒤의 둘째 해에 놓았습니다.[a]
  to: 그들은 그들이 유대와 예루살렘에 온 뒤 둘째 해, 둘째 달 초하루에 하나님의 성전의 기초를 놓았습니다.
  rationale: 그리스어의 건축 대상(τὸν ναὸν τοῦ θεοῦ)을 ‘하나님의 성전’으로 직접 옮기고, 지역명 Ἰουδαία를 ‘유대’로 바로잡았습니다. 날짜와 연대 및 도착 이후의 시간 관계는 원문의 순서를 크게 훼손하지 않는 자연스러운 한국어 어순으로 정리했습니다.
