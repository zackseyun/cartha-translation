  source_fidelity: 그리스어의 ἐπέγνωσαν, 지속상의 οἰκοδομοῦσιν, 그리고 건축의 수혜자/헌납 대상을 나타내는 여격을 대체로 충실히 반영했습니다. 그러나 οἱ ἐκ τῆς αἰχμαλωσίας는 본문 자체에서 ‘돌아온’을 명시하지 않으므로 그 함의를 본문에 보태지 않는 편이 안전합니다. 또한 κύριος는 원문과 영어 POB의 ‘Lord’에 따라 ‘주’로 옮기는 것이 적절합니다.
  naturalness: ‘야훼, 이스라엘의 하나님’은 쉼표로 연결된 호칭이 현대 한국어 문장 안에서 부자연스럽습니다. ‘이스라엘의 주 하나님’이 자연스럽고 원문의 결속된 칭호를 잘 반영합니다. ‘…짓고 있다는 것을 알게 되었습니다’는 간접 진술을 명확하고 자연스럽게 나타냅니다.
  terminology: ναός는 ‘성전’으로 적절합니다. κύριος θεὸς Ἰσραήλ은 ‘이스라엘의 주 하나님’으로 통일했습니다. ‘포로 생활을 하던 사람들’은 귀환을 명시하지 않으면서도 αἰχμαλωσία의 상태를 자연스럽게 전달합니다.
