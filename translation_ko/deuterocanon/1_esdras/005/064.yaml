translation:
  language: ko
  text: 그리고 그들은 포로 생활을 하던 사람들이 이스라엘의 주 하나님을 위하여 성전을 짓고 있다는 것을 알게 되었습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘포로에서 나온 사람들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이스라엘의 주 하나님께 성전을 짓고 있었다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέγνωσαν
  english_pob_choice: recognized
  chosen_korean: 알게 되었습니다
  alternatives_korean:
  - 인식했습니다
  - 깨달았습니다
  - 알아차렸습니다
  lexicon: BDAG
  rationale: 여기서는 단순한 지식 습득보다 상황을 분명히 파악하게 되었음을 나타내므로, 자연스럽고 문맥에 맞는 ‘알게 되었습니다’로 옮겼습니다.
- source_word: οἱ ἐκ τῆς αἰχμαλωσίας
  english_pob_choice: those from the captivity
  chosen_korean: 포로에서 돌아온 사람들
  alternatives_korean:
  - 포로에서 온 사람들
  - 포로 된 자들
  - 포로들
  lexicon: LSJ
  rationale: 직역하면 ‘포로에서 나온 자들’이지만, 한국어 문맥에서는 귀환한 집단을 가리키는 뜻이 분명하므로 의미를 보존하면서도 읽기 자연스러운 표현을 택했습니다.
- source_word: οἰκοδομοῦσιν
  english_pob_choice: were building
  chosen_korean: 짓고 있음을
  alternatives_korean:
  - 건축하고 있음을
  - 세우고 있음을
  lexicon: BDAG
  rationale: 현재형의 진행상을 살려 ‘짓고 있음을’으로 옮겨, 인지 동사 뒤의 간접진술 구조가 드러나게 했습니다.
- source_word: τὸν ναὸν
  english_pob_choice: the temple
  chosen_korean: 성전
  alternatives_korean:
  - 성막
  - 템플
  lexicon: BDAG
  rationale: 이 문맥은 예루살렘 성전 재건을 가리키므로, 한국어 성서어휘로는 ‘성전’이 가장 정확합니다.
- source_word: τῷ κυρίῳ θεῷ Ἰσραήλ
  english_pob_choice: for the Lord God of Israel
  chosen_korean: 야훼, 이스라엘의 하나님을 위하여
  alternatives_korean:
  - 이스라엘의 주 하나님을 위하여
  - 이스라엘의 주님 하나님을 위하여
  lexicon: BDAG/LSJ
  rationale: κύριος는 이 프로젝트의 기본 원칙에 따라 야훼로 옮기고, dative는 건축의 목적/헌납 의미를 드러내는 ‘-을 위하여’로 처리했습니다.
theological_decisions:
- issue: κύριος θεός Ἰσραήλ의 표기
  chosen_reading: 야훼, 이스라엘의 하나님
  alternative_readings:
  - 주, 이스라엘의 하나님
  - 주님, 이스라엘의 하나님
  rationale: 본문은 이스라엘의 하나님을 지칭하는 LXX 관용구이므로, covenantal divine name을 흐리지 않도록 κύριος를 야훼로 반영했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → 야훼'
