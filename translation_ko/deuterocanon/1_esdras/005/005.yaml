base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/005.yaml
  text: 'The priests[a], the sons of Phinehas, the sons of Aaron: Jeshua son of Jozadak son of Seraiah, and Joakim son of Zerubbabel son of Shealtiel, from the house of David, from the family line of Perez[b],'
  footnotes:
  - marker: a
    text: Greek 'sons of' can denote descendants in genealogical lists, not only immediate sons.
    reason: lexical_alternative
  - marker: b
    text: Greek Ἰησοῦς could be represented as 'Joshua' or, in other contexts, 'Jesus'; here 'Jeshua' best matches the postexilic priestly figure intended.
    reason: lexical_alternative
translation:
  language: ko
  text: '제사장들[a], 곧 비느하스의 아들들, 아론의 아들들: 예수아[b]—여호사닥의 아들이며 스라야의 아들—와 요아김, 스룹바벨의 아들이며 스알디엘의 아들로서 다윗의 집안, 곧 바레스의 계열에서 나온 자들입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ‘아들들’은 계보 목록에서 직계 아들뿐 아니라 후손을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 Ἰησοῦς는 문맥에 따라 ‘여호수아’ 또는 ‘예수’로도 옮길 수 있지만, 여기서는 포로기 이후 제사장 인물을 가리키므로 ‘예수아’가 가장 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἱερεῖς
  english_pob_choice: The priests
  chosen_korean: 제사장들
  alternatives_korean:
  - 사제들
  - 제사장 집단
  lexicon: BDAG
  rationale: 관사 있는 복수 명사로서, 다음의 계보적 인물들을 소개하는 표제이므로 표준 교회어이면서도 본문 기능을 잘 드러내는 ‘제사장들’로 옮겼습니다.
- source_word: υἱοὶ Φινεὲς υἱοὶ Ἀαρών
  english_pob_choice: the sons of Phinehas, the sons of Aaron
  chosen_korean: 비느하스의 아들들, 아론의 아들들
  alternatives_korean:
  - 비느하스의 후손들, 아론의 후손들
  - 비느하스 자손, 아론 자손
  lexicon: BDAG
  rationale: 계보 목록에서 υἱοί는 직계 아들뿐 아니라 후손을 가리킬 수 있으므로, POB의 선택을 따라 ‘아들들’을 유지하되 문맥상 계보 표현으로 읽히게 했습니다.
- source_word: Ἰησοῦς
  english_pob_choice: Jeshua
  chosen_korean: 예수아
  alternatives_korean:
  - 여호수아
  - 예수
  lexicon: BDAG
  rationale: 포로기 이후 제사장 계보의 인물을 가리키므로, 기독론적 오해를 피하면서 이 시대 인물에 맞는 관용형 ‘예수아’를 택했습니다.
- source_word: ὁ τοῦ Ἰωσεδὲκ τοῦ Σαραιοῦ
  english_pob_choice: son of Jozadak son of Seraiah
  chosen_korean: 여호사닥의 아들이며 스라야의 아들
  alternatives_korean:
  - 여호사닥의 아들, 스라야의 아들
  - 여호사닥과 스라야의 아들
  lexicon: BDAG
  rationale: 연속된 속격 계보 구조를 한국어로 자연스럽게 풀어 ‘~의 아들이며 ~의 아들’로 옮겨, 두 세대의 혈통 연결을 분명히 했습니다.
- source_word: ἐκ τοῦ οἴκου τοῦ Δαυείδ
  english_pob_choice: from the house of David
  chosen_korean: 다윗의 집안
  alternatives_korean:
  - 다윗의 집
  - 다윗의 가문
  lexicon: BDAG
  rationale: οἶκος는 여기서 거주지보다 다윗 왕조/가계를 뜻하므로, 한국어에서 계보적·왕조적 뉘앙스를 함께 살리는 ‘집안’을 사용했습니다.
- source_word: ἐκ τῆς γενεᾶς Φάρες
  english_pob_choice: from the family line of Perez
  chosen_korean: 바레스의 계열
  alternatives_korean:
  - 베레스의 가족 계열
  - 바레스의 족보
  lexicon: BDAG
  rationale: γενεά는 단순한 ‘세대’보다 혈통 계열을 가리키므로, 족보적 연속성을 간결하게 드러내는 ‘계열’로 옮겼습니다.
theological_decisions:
- issue: 계보 문구의 직계/후손 의미
  chosen_reading: 반복되는 ‘아들들’과 ‘~의 아들’ 구조를 유지해 계보의 층위를 드러냈습니다.
  alternative_readings:
  - 모두 ‘후손들’로 압축하기
  - ‘자손’으로 통일하기
  rationale: 본문은 교리 진술보다 제사장 및 다윗 계열의 출신을 식별하는 데 초점이 있으므로, 구조를 평평하게 만들지 않고 원문의 계보 리듬을 보존하는 것이 더 정확합니다.
  doctrine_reference: Translation philosophy §§1, 5
