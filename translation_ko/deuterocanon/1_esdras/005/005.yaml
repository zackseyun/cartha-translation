  yaml_path: translation/deuterocanon/1_esdras/005/005.yaml
  text: 'The priests[a], the sons of Phinehas, the sons of Aaron: Jeshua son of Jozadak son of Seraiah, and Joakim son of Zerubbabel son of Shealtiel, from the house of David, from the family line of Perez[b],'
  footnotes:
  - marker: a
    text: Greek 'sons of' can denote descendants in genealogical lists, not only immediate sons.
    reason: lexical_alternative
  - marker: b
    text: Greek Ἰησοῦς could be represented as 'Joshua' or, in other contexts, 'Jesus'; here 'Jeshua' best matches the postexilic priestly figure intended.
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장들은 비느하스의 아들들이며 아론의 아들들입니다[a]. 곧 스라야의 아들 여호사닥의 아들 예수아[b]와, 다윗의 집안 곧 베레스의 계열에서 나온 스알디엘의 아들 스룹바벨의 아들 요아김입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ‘아들들’은 계보 목록에서 직계 아들뿐 아니라 후손을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 Ἰησοῦς는 문맥에 따라 ‘여호수아’ 또는 ‘예수’로도 옮길 수 있지만, 여기서는 포로기 이후 제사장 인물을 가리키므로 ‘예수아’가 가장 적절합니다.
    reason: lexical_alternative
