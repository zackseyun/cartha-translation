translation:
  language: ko
  text: 탬버린과 피리로[a]. 그리고 그들의 형제들 모두가 연주하고 있었으며[b], 그는 그들로 하여금 저 사람들과 함께 올라가게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘관악기’로도 옮길 수 있습니다. 그리스어 αὐλῶν은 더 넓게는 갈대피리류나 이와 유사한 관악기를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 본문은 여기서 갑작스럽고 문맥 의존적이므로, ‘그들의 형제들 모두가 연주하고 있었다’가 주변 서술을 전제로 한 옮김입니다.
    reason: alternative_reading
