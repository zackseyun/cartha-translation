translation:
  language: ko
  text: 탬버린과 피리로[a]. 또 그들의 모든 형제는 연주하고 있었습니다. 그는 그들이 저 사람들과 함께 올라가게 했습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘관악기’로도 옮길 수 있습니다. 그리스어 αὐλῶν은 더 넓게는 갈대피리류나 이와 유사한 관악기를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 본문은 여기서 갑작스럽고 문맥 의존적입니다. ‘저 사람들’은 그리스어 지시어 ἐκείνων을 옮긴 것이나, 그 지시 대상은 주변 이야기에서 보충해야 합니다.
    reason: alternative_reading
