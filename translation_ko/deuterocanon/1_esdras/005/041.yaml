base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/041.yaml
  text: 'All these were Israelites[a], from twelve years old and upward, apart from male and female servants: forty-two thousand three hundred sixty. Their male and female servants were seven thousand three hundred thirty-seven[b]; and the singers and songstresses were two hundred forty-five.'
  footnotes:
  - marker: a
    text: Or 'apart from male and female slaves.' The Greek terms can denote household servants in dependent status; the context here is a census total rather than a focus on legal condition.
    reason: lexical_alternative
  - marker: b
    text: Or 'male and female singers.' The Greek distinguishes ψάλται and ψαλτῳδοί rather than using a single undifferentiated term.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 그들은 모두 이스라엘 사람이었는데, 열두 살부터 위의 사람들만 해당하며, 남녀 종들은 제외했습니다. 모두 합하여 사만이천삼백육십 명이었습니다. 그들의 남녀 종은 칠천삼백삼십칠 명이었고, 노래하는 사람들과 노래하는 여자들은 이백사십오 명이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘남녀 노예들을 제외하고’. 그리스어의 παῖδες / παιδίσκαι는 문맥에 따라 가정의 종속 종이나 노예를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘노래하는 남자들과 노래하는 여자들’. 그리스어는 ψάλται와 ψαλτῳδοί를 서로 구분해 적습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ πάντες
  english_pob_choice: All these
  chosen_korean: 그런데 그들은 모두
  alternatives_korean:
  - 그리고 그들은 모두
  - 이 모든 사람은
  lexicon: LSJ
  rationale: 총계 서술의 도입부로서 προηγούμενον을 요약하는 힘을 살리되, δέ의 약한 전환을 한국어의 자연스러운 접속으로 옮겼습니다.
- source_word: ἦσαν Ἰσραήλ
  english_pob_choice: were Israelites
  chosen_korean: 이스라엘 사람이었는데
  alternatives_korean:
  - 이스라엘이었는데
  - 이스라엘 백성이었는데
  lexicon: LSJ
  rationale: 그리스어의 정체성 진술을 한국어에서 자연스럽게 표현하면서, 민족·언약 공동체를 가리키는 뜻을 유지했습니다.
- source_word: χωρὶς παίδων καὶ παιδισκῶν
  english_pob_choice: apart from male and female servants
  chosen_korean: 남녀 종들은 제외했습니다
  alternatives_korean:
  - 남녀 하인들은 제외했습니다
  - 남녀 노예들은 제외했습니다
  lexicon: LSJ
  rationale: 여기서는 인원 총계에서의 제외 항목을 분명히 해야 하므로, χωρὶς의 배제 의미를 직접 살렸습니다. παιδές/παιδίσκαι는 문맥상 종속 신분의 남녀 종으로 이해되는 점을 반영했습니다.
- source_word: ψάλται καὶ ψαλτῳδοί
  english_pob_choice: the singers and songstresses
  chosen_korean: 노래하는 사람들과 노래하는 여자들
  alternatives_korean:
  - 노래하는 사람들과 노래하는 이들
  - 남자 가수들과 여자 가수들
  lexicon: LSJ
  rationale: 두 표현을 구분해 적은 점을 살리면서도, 현대 한국어에서 과도하게 어색한 직역을 피했습니다.
theological_decisions:
- issue: ἦσαν Ἰσραήλ의 정체성 표현
  chosen_reading: 이스라엘 사람이라는 집합적 정체성으로 번역했습니다.
  alternative_readings:
  - 이스라엘이었다
  - 이스라엘 백성이었다
  rationale: 문맥은 신학적 논쟁점보다 귀환 공동체의 계수 결과를 말하므로, 한국어에서 가장 분명한 집합 명사 표현을 택했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: παῖδες / παιδίσκαι의 사회적 지위
  chosen_reading: 남녀 종으로 옮기되, 본문 내에서는 단순한 제외 항목으로 처리했습니다.
  alternative_readings:
  - 남녀 노예
  - 남자아이와 여자아이
  rationale: 명단형 계수 문맥에서는 ‘아이들’보다 종속된 가구 구성원을 가리키는 뜻이 더 강하므로, POB의 주해 취지를 따라 신분 표지를 과장하지 않으면서도 의미를 분명히 했습니다.
  doctrine_reference: DOCTRINE.md contested terms table by analogy
