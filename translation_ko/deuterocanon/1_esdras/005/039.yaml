base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/039.yaml
  text: and he was called by his name[a]. And from these[b], those who were searched for in the genealogical record in the enrollment, and were not found, were excluded from serving as priests.
  footnotes:
  - marker: a
    text: Or 'was named after his name.' The Greek opening clause is compressed and its immediate referent is not fully explicit in this verse alone.
    reason: lexical_alternative
  - marker: b
    text: That is, they could not verify their ancestry in the official genealogical register and so were disqualified from priestly service.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그는 그의 이름으로 불렸습니다[a]. 이들[b] 가운데 족보 기록의 등록부에서 조회되었으나 발견되지 않은 사람들은 제사장으로 섬기는 일에서 제외되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 이름으로 불렸다’입니다. 그리스어의 압축된 표현이며, 이 절만으로는 직접 지시 대상이 완전히 드러나지 않습니다. 이름을 부르거나 그 이름으로 식별했다는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 공식 족보 등록부에서 자신의 계보를 확인할 수 없었던 사람들을 가리킵니다.
    reason: cultural_note
