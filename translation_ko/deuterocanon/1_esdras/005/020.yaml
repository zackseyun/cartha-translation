base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/020.yaml
  text: the sons of Chadiasai and Ammidioi[a], four hundred twenty-two; the sons of Keiramas Kabbes, six hundred twenty-one[b];
  footnotes:
  - marker: a
    text: Greek has 'those from Keiramas Kabbes.' The rendering 'the sons of Keiramas and Kabbes' reflects the census style of the surrounding list and treats the names as a grouped family entry. The underlying Greek is somewhat awkward, and the Hebrew parallel at this point differs substantially.
    reason: alternative_reading
  - marker: b
    text: The Hebrew parallel in Ezra/Nehemiah does not closely match these names or numbers here; 1 Esdras appears to preserve a divergent or reordered list. The translation therefore follows the Greek as primary.
    reason: textual_variant
translation:
  language: ko
  text: 하디아사이와 암미디오이의 자손은 사백이십이 명이었습니다. 케이라마스 카베스에서 온 사람들은 육백이십일 명이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ Χαδιάσαι
  english_pob_choice: the sons of Chadiasai
  chosen_korean: 하디아사이의 자손
  alternatives_korean:
  - 하디아사이 사람들
  - 하디아사이의 것들
  lexicon: LSJ
  rationale: 인구 조사 형식의 목록에서 άρθρο+고유명사는 집단/가문 표지를 뜻하므로, 한국어에서는 ‘자손’으로 자연스럽게 옮겼습니다.
- source_word: Ἀμμίδιοι
  english_pob_choice: Ammidioi
  chosen_korean: 암미디오이
  alternatives_korean:
  - 아미디오이
  - 암미디오이 사람들
  lexicon: LSJ
  rationale: 그리스어 음을 따라 음역했으며, 본문이 이름 목록이므로 설명을 덧붙이지 않았습니다.
- source_word: τετρακόσιοι εἴκοσι δύο
  english_pob_choice: four hundred twenty-two
  chosen_korean: 사백스물둘
  alternatives_korean:
  - 사백 이십이
  - 사백스물두
  lexicon: LSJ
  rationale: 현대 한국어 수사 표기에서 자연스러운 붙여쓰기 형태로 옮겼습니다.
- source_word: οἱ ἐκ Κειράμας Κάββης
  english_pob_choice: the sons of Keiramas and Kabbes
  chosen_korean: 케이라마스와 카베스의 자손
  alternatives_korean:
  - 케이라마스 카베스에서 온 사람들
  - 케이라마스와 카베스에게서 나온 자들
  lexicon: LSJ
  rationale: ἐκ는 본래 ‘~에서/부터’를 뜻하지만, 이 장의 계보·등록 목록에서는 집단 소속을 나타내므로 ‘자손’으로 처리했습니다. 영어 POB의 묶음 읽기와 같이 두 이름을 한 항목으로 보되, 그리스어의 어색한 구조를 과도하게 매끈하게 만들지는 않았습니다.
- source_word: ἑξακόσιοι εἴκοσι εἷς
  english_pob_choice: six hundred twenty-one
  chosen_korean: 육백스물하나
  alternatives_korean:
  - 육백 이십일
  - 육백스물한
  lexicon: LSJ
  rationale: 앞의 수사와 동일한 방식으로 현대 한국어 숫자 표기를 통일했습니다.
