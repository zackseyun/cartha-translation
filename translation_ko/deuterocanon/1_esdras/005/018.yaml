translation:
  language: ko
  text: 네테바스[a]에서 온 사람들은 쉰다섯 명입니다. 에나토스에서 온 사람들은 백쉰여덟 명입니다. 바이타스몬 자못[b]에서 온 사람들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 그리스어 지명들은 대략적인 히브리어 병행본문인 느헤미야 7:25의 전승과 크게 다릅니다. 그 본문은 기브온/깁발의 자손 아흔다섯 명으로 읽히지만, 여기서는 조화시키지 않고 1 에스드라스의 그리스어 본문을 따랐습니다.
    reason: textual_variant
  - marker: b
    text: 마지막 지명은 그리스어에서 난해하며 복합 지명이거나 훼손된 지명일 수 있습니다. 따라서 뜻을 추정하지 않고 음역했습니다.
    reason: lexical_alternative
