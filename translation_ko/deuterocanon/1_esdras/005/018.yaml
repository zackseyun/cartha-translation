  text: those from Netebas[a], fifty-five; those from Enatos, one hundred fifty-eight[b]; those from Baitasmon Zamoth.
  footnotes:
  - marker: a
    text: The Greek names in this verse differ notably from the approximate Hebrew parallel in Nehemiah 7:25, which reads 'the sons of Gibeon/Gibbar, ninety-five' in the MT tradition. Because 1 Esdras here preserves a different list-form and names, the translation follows the Greek witness closely rather than harmonizing to the Hebrew.
    reason: textual_variant
  - marker: b
    text: The final place-name is textually difficult in Greek and may reflect a compound or corrupted toponym; the translation therefore preserves it by transliteration.
    reason: lexical_alternative
translation:
  language: ko
  text: 네테바스에서 온 사람들은 쉰다섯 명입니다. 에나토스에서 온 사람들은 백쉰여덟 명입니다. 바이타스몬 자못에서 온 사람들은 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 고유명사는 히브리어 병행본문의 대응형과 상당히 다르므로, 조화시키지 않고 그리스어 형태를 따랐습니다.
    reason: textual_variant
  - marker: b
    text: 마지막 지명은 그리스어에서 난해한 복합 지명일 수 있으므로, 의미를 추정하지 않고 음역을 유지했습니다.
    reason: lexical_alternative
