base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/047.yaml
  text: Then Jeshua son of Jozadak arose[a], along with his brothers the priests, and Zerubbabel son of Shealtiel and his brothers, and they prepared the altar of the God of Israel[b],
  footnotes:
  - marker: a
    text: Greek Ἰησοῦς here refers to Jeshua, the postexilic high-priestly figure, not to Jesus of Nazareth. The Hebrew parallel tradition supports the form Jeshua/Joshua.
    reason: cross_reference
  - marker: b
    text: Or 'stood up' / 'having arisen.' The Greek participle marks the beginning of decisive action.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 예수아[a], 곧 여호사닥의 아들인 예수아가 그의 형제들인 제사장들과 함께 일어나고, 스룹바벨, 곧 스알디엘의 아들과 그의 형제들과 함께 이스라엘의 하나님께 드릴 제단을 준비하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 Ἰησοῦς는 여기서 나사렛 예수가 아니라 포로기 귀환기의 대제사장 인물 예수아를 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: καταστὰς
  english_pob_choice: arose
  chosen_korean: 일어나고
  alternatives_korean:
  - 일어났습니다
  - 자리를 털고 일어나
  - 일어나
  lexicon: LSJ
  rationale: 문맥상 결정적 행동의 개시를 나타내는 분사이므로, 자연스러운 서술 흐름을 살려 ‘일어나고’로 옮겼습니다.
- source_word: Ἰησοῦς
  english_pob_choice: Jeshua
  chosen_korean: 예수아
  alternatives_korean:
  - 여호수아
  - 예수
  lexicon: LSJ
  rationale: 포로기 귀환기의 대제사장 인물에 해당하므로 예수(나사렛 예수)와 구별되는 이름 형태인 ‘예수아’를 택했습니다.
- source_word: οἱ ἀδελφοὶ αὐτοῦ οἱ ἱερεῖς
  english_pob_choice: his brothers, the priests
  chosen_korean: 그의 형제들인 제사장들
  alternatives_korean:
  - 그의 제사장 형제들
  - 그의 형제들인 제사장들
  lexicon: LSJ
  rationale: 형제 관계와 직분을 함께 드러내기 위해 수식 관계를 유지해 옮겼습니다.
- source_word: τοῦ θεοῦ Ἰσραήλ
  english_pob_choice: of the God of Israel
  chosen_korean: 이스라엘의 하나님께 드릴
  alternatives_korean:
  - 이스라엘의 하나님에게 속한
  - 이스라엘의 하나님을 위한
  lexicon: LSJ
  rationale: 제단이 하나님께 속하고 그분께 바쳐지는 대상이라는 뜻이므로, 소유격을 한국어의 목적성 표현으로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 이름 예수아의 음역과 신약 인물 예수와의 구별
  chosen_reading: 구약 후기 제사장 인물은 ‘예수아’로 두어 ‘예수’와 구별했습니다.
  alternative_readings:
  - 예수
  - 여호수아
  rationale: 본문의 역사적·계보적 문맥상 나사렛 예수가 아니라 귀환기 대제사장 인물을 가리키므로, 혼동을 피하는 번역이 필요합니다.
  doctrine_reference: 역사적 인물 식별과 정경 간 이름 전승
