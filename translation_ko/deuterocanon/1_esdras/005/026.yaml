base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/026.yaml
  text: 'The Levites: the sons of Jesueis[a], Koddelou, Bannou, and Soudiou, seventy-four.'
  footnotes:
  - marker: a
    text: Several names in this verse differ from the better-known Ezra-Nehemiah parallels; this translation follows the Greek text of 1 Esdras rather than harmonizing them to the Hebrew tradition.
    reason: alternative_reading
translation:
  language: ko
  text: 레위 사람들은 예수에스의 아들들, 코드엘루, 반누, 그리고 수디우입니다. 칠십사 명입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 인명들은 에스라-느헤미야의 더 잘 알려진 평행본문과 서로 다릅니다. 이 번역은 히브리 전승에 맞춰 조정하지 않고 1 에스드라의 그리스어 본문을 따릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ Λευεῖται
  english_pob_choice: The Levites
  chosen_korean: 레위 사람들
  alternatives_korean:
  - 레위인들
  - 레위 지파 사람들
  lexicon: LSJ
  rationale: 족보·명부 문맥에서 συλλογ적 집단을 가리키므로, 한국어에서는 자연스러운 집합 명칭인 ‘레위 사람들’로 옮겨 명부 항목의 기능을 살렸습니다.
- source_word: υἱοὶ
  english_pob_choice: the sons of
  chosen_korean: 아들들
  alternatives_korean:
  - 자손들
  - 후손들
  lexicon: LSJ
  rationale: 명부형 표현에서 υἱοὶ는 혈통·가문 소속을 표시하므로, 직역에 가까운 ‘아들들’을 유지해 계보적 구조를 보존했습니다.
- source_word: Ἰησουείς, Κοδδηλοῦ καὶ Βάννου καὶ Σουδίου
  english_pob_choice: Jesueis, Koddelou, Bannou, and Soudiou
  chosen_korean: 예수에스, 코드엘루, 반누, 수디우
  alternatives_korean:
  - 예슈에스, 코데루, 바누, 수디우
  - 여수에스, 고델루, 반누, 수디오
  lexicon: 고유명사 음역
  rationale: 1 에스드라의 그리스어 표면형을 그대로 음역했습니다. 정경 에스라-느헤미야의 더 익숙한 이름들과 조화시키지 않고, 본문이 실제로 제시하는 이름형을 유지했습니다.
- source_word: ἑβδομήκοντα τέσσαρες
  english_pob_choice: seventy-four
  chosen_korean: 칠십사 명
  alternatives_korean:
  - 일흔네 명
  - 74명
  lexicon: LSJ
  rationale: 그리스어 수사 표현은 단순한 인원 집계를 뜻하므로, 현대 한국어 명부 문체에 맞는 ‘칠십사 명’으로 옮겼습니다.
theological_decisions:
- issue: 1 에스드라의 그리스어 명부를 히브리 전승과 조화할 것인지
  chosen_reading: 그리스어 본문이 제시하는 이름형과 숫자를 그대로 따랐습니다.
  alternative_readings:
  - 에스라-느헤미야의 평행 본문에 맞춰 이름을 정비하는 읽기
  - 히브리 전승의 더 익숙한 인명으로 환원하는 읽기
  rationale: 이 구절은 계보 표 목록이므로, 본문 자체의 증언을 보존하는 것이 중요합니다. 평행본문과의 차이는 본문 차이로 남겨 두어야 하며, 조화는 주석에서 다루는 편이 적절합니다.
  doctrine_reference: 본문 비평과 정경 간 평행본문 처리 원칙
- issue: 명부의 집합 명칭을 현대 한국어에서 어떻게 처리할지
  chosen_reading: ‘레위 사람들’로 자연스럽게 옮겨 집단 명칭의 기능을 살렸습니다.
  alternative_readings:
  - ‘레위인들’로 더 직역하는 방식
  - ‘레위 지파’로 부족 정체성을 강조하는 방식
  rationale: 여기서는 제도적 직함보다 명부의 집합적 지칭이 핵심이므로, 한국어 독자가 바로 이해할 수 있는 중립적 표현을 택했습니다.
  doctrine_reference: 서술 장르의 명부·족보 번역 원칙
