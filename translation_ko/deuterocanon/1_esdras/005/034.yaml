  yaml_path: translation/deuterocanon/1_esdras/005/034.yaml
  text: the sons of Hagia[a], the sons of Phacareth-sabeie, the sons of Sarothei, the sons of Meisaias, the sons of Gas, the sons of Addous, the sons of Soubas, the sons of Apherra, the sons of Barotheis, the sons of Saphag, the sons of Allon;
  footnotes:
  - marker: a
    text: The Hebrew parallel in Nehemiah 7:51 is much shorter here ('the sons of Uzza, the sons of Paseah, the sons of Besai'). 1 Esdras preserves an expanded Greek list, so the translation follows the Greek names rather than harmonizing to the Hebrew.
    reason: alternative_reading
translation:
  language: ko
  text: 하가의 자손, 파카레트-사비에의 자손, 사로테이의 자손, 메이사이아의 자손, 가스의 자손, 아둣의 자손, 수바스의 자손, 아페르라의 자손, 바로테이스의 자손, 사파그의 자손, 알론의 자손입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절은 느헤미야 7:51의 히브리어 병행본문보다 더 긴 그리스어 명단을 보존하므로, 번역도 그리스어 이름 순서를 따랐습니다.
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ
  english_pob_choice: the sons of
  chosen_korean: ~의 자손
  alternatives_korean:
  - ~의 아들들
  - ~의 후손
  lexicon: LSJ
  rationale: 족보·목록체에서 반복되는 υἱοὶ는 단순한 생물학적 아들보다 씨족/가문 소속을 가리키므로, 한국어에서는 자연스럽고 목록체를 살리는 ‘자손’으로 옮겼습니다.
- source_word: Ἁγιά
  english_pob_choice: Hagia
  chosen_korean: 하가
  alternatives_korean:
  - 아기아
  - 하기아
  lexicon: LSJ
  rationale: 고유명사는 의미 번역보다 음역이 적절하므로, 그리스어 형태를 기준으로 한국어 표기화했습니다.
- source_word: Φακαρὲθ Σαβειή
  english_pob_choice: Phacareth-sabeie
  chosen_korean: 파카레트-사비에
  alternatives_korean:
  - 파카레트 사비에
  - 파카렛-사비에
  lexicon: LSJ
  rationale: 그리스어에서 붙어 있는 복합 이름을 한국어에서도 하이픈으로 보존해 결합 관계를 드러냈습니다.
- source_word: Ἀλλών
  english_pob_choice: Allon
  chosen_korean: 알론
  alternatives_korean:
  - 알룐
  - 알론
  lexicon: LSJ
  rationale: 목록의 마지막 고유명사도 다른 이름들과 동일하게 음역하되, 현대 한국어에서 읽기 쉬운 형태로 정리했습니다.
theological_decisions:
- issue: 1 Esdras의 확장된 그리스어 명단을 히브리어 병행본문과 조화시킬지 여부
  chosen_reading: 그리스어 본문에 있는 11개 이름을 그대로 따라 번역했습니다.
  alternative_readings:
  - 느헤미야 7:51의 더 짧은 히브리어 계열 명단에 맞춰 축약
  - 히브리어 대응형 이름으로 일부 정리
  rationale: 본문 자체가 확장된 그리스어 계열 명단을 보존하므로, 병행 본문에 맞춰 줄이기보다 원문이 전달하는 목록 형태를 유지하는 것이 더 충실합니다.
  doctrine_reference: 본문비평/정경 전승 차이
