translation:
  language: ko
  text: 하기아의 자손, 파카렛-사비에의 자손, 사로테이의 자손, 메이사이아스의 자손, 가스의 자손, 아두스의 자손, 수바스의 자손, 아페라의 자손, 바로테이스의 자손, 사팍의 자손, 알론의 자손입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 느헤미야 7:51의 히브리어 병행본문은 여기서 더 짧게 ‘웃사의 자손, 파세아의 자손, 베새의 자손’이라고 합니다. 에스드라 첫째 5:34는 확장된 그리스어 명단을 보존하므로, 번역은 히브리어 병행본문에 맞추어 조화시키지 않고 그리스어의 이름들을 따릅니다.
    reason: alternative_reading
