  lexicon: 고유명사 음역
  rationale: 그리스어 형태를 보수적으로 음역했습니다. MT 병행과의 불일치는 주어진 주석대로 병행 자료 차이로 보고 조화시키지 않았습니다.
- source_word: Ἁτεφά
  english_pob_choice: Hatepha
  chosen_korean: 하테파
  alternatives_korean:
  - 아테파
  lexicon: 고유명사 음역
  rationale: 거친 숨표를 반영해 첫 음을 살렸고, 희귀 고유명사의 경우 원형 추적성이 더 높다고 보았습니다.
theological_decisions:
- issue: 그리스어 목록과 히브리어 병행본의 불일치 처리
  chosen_reading: 그리스어 본문에 있는 여섯 개 가문명을 그대로 옮기고, 히브리어 병행본과의 조화는 시도하지 않았습니다.
  alternative_readings:
  - 히브리어 병행본의 이름들로 정렬
  - 혼합형으로 병합
  rationale: 1 에스드라는 이 절에서 그리스어 전승이 주 번역 기준이며, 병행본과의 차이는 문헌 전승 차이로 드러내야 합니다.
  doctrine_reference: 본문비평/정경 전승 원칙
- issue: υἱοὶ의 의미 범위
  chosen_reading: ‘아들들’로 직역하되, 씨족 목록이라는 문맥을 유지했습니다.
  alternative_readings:
  - ‘자손들’로 의미화
  - ‘가문들’로 의역
  rationale: 명단의 반복적 형식을 보존하면서도 집단적 혈통 표지를 전달하는 것이 가장 균형적입니다.
  doctrine_reference: 족보/명단 번역 원칙
