  text: the sons of Dedda[a], the sons of Bachous, the sons of Serar, the sons of Thomthei, the sons of Nasei[b], the sons of Hatepha.
  footnotes:
  - marker: a
    text: The Greek text here lists six family names—Dedda, Bachous, Serar, Thomthei, Nasei, and Hatepha—where the approximate Hebrew parallel lists three different names (Lebanah, Hagaba, and Akkub). Because 1 Esdras is translated from the Greek witness here, the Greek names are retained rather than harmonized to the Hebrew parallel.
    reason: alternative_reading
  - marker: b
    text: Several names in this verse are rare and may reflect textual instability or transliteration differences in the Greek tradition; the rendering follows the provided Greek text conservatively.
    reason: textual_variant
translation:
  language: ko
  text: 데다의 자손들[a], 바쿠스의 자손들, 세라르의 자손들, 톰테이의 자손들, 나세이의 자손들[b], 하테파의 자손들.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 그리스어 본문은 데다, 바쿠스, 세라르, 톰테이, 나세이, 하테파라는 여섯 가문명을 제시합니다. 반면 대략적인 히브리어 병행본문에는 레바나, 하가바, 악굽이라는 서로 다른 세 이름이 나옵니다. 1 에스드라는 여기서 그리스어 전승을 번역하므로, 히브리어 병행본문에 맞추지 않고 그리스어 이름들을 유지했습니다.
    reason: alternative_reading
  - marker: b
    text: 이 절의 몇몇 이름은 희귀하며 그리스어 전승의 본문상 불안정성 또는 음역 차이를 반영할 수 있습니다. 번역은 주어진 그리스어 본문을 보수적으로 따라 음역했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ
  english_pob_choice: the sons of
  chosen_korean: 아들들
  alternatives_korean:
  - 자손들
  - 가문들
  lexicon: LSJ
  rationale: 족보적·명단형 문맥에서 υἱοὶ는 단순한 생물학적 아들보다 씨족/가문 단위를 가리키므로, 반복 구조를 살려 ‘아들들’로 옮겼습니다.
- source_word: Δεδδά
  english_pob_choice: Dedda
  chosen_korean: 데다
  alternatives_korean:
  - 레바나
  - 레바나의 계열
  lexicon: 고유명사 음역
  rationale: 그리스어 본문을 주 번역 기준으로 삼아 직접 음역했습니다. 히브리어 병행 본문과 다른 이름이지만, 여기서는 그리스어 전승을 보존해야 합니다.
- source_word: Βαχούς
  english_pob_choice: Bachous
  chosen_korean: 바쿠스
  alternatives_korean:
