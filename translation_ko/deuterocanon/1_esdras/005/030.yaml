base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/030.yaml
  text: the sons of Akoud[a], the sons of Outa, the sons of Ketab, the sons of Akkaba, the sons of Sybaei, the sons of Anan, the sons of Koua, the sons of Keddour,
  footnotes:
  - marker: a
    text: The Hebrew parallel at Nehemiah 7:45 has a different list of gatekeeper families (including Shallum, Ater, Talmon, Akkub, Hatita, and Shobai). 1 Esdras here preserves a divergent Greek list, so the translation follows the Greek rather than harmonizing to the Hebrew.
    reason: alternative_reading
translation:
  language: ko
  text: 아쿠드의 아들들, 우타의 아들들, 케탑의 아들들, 악카바의 아들들, 시바이의 아들들, 아난의 아들들, 쿠아의 아들들, 케두르의 아들들,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 그리스어 명단은 느헤미야 7:45의 히브리어 병행본문과 이름들이 다릅니다. 따라서 번역은 히브리어와 맞추지 않고 그리스어 본문을 따랐습니다.
    reason: cross_reference
lexical_decisions:
- source_word: υἱοὶ
  english_pob_choice: the sons of
  chosen_korean: ~의 아들들
  alternatives_korean:
