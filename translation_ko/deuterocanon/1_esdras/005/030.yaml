  - 우따
  lexicon: LSJ
  rationale: 오믹론-우시론 결합을 반영해 자연스럽게 음역했습니다.
- source_word: Κητάβ
  english_pob_choice: Ketab
  chosen_korean: 케탑
  alternatives_korean:
  - 케타브
  - 케탭
  lexicon: LSJ
  rationale: 그리스어 자형을 그대로 따르되, 한국어 표기에서는 종결 자음을 자연스럽게 옮겼습니다.
- source_word: Ἀκκαβά
  english_pob_choice: Akkaba
  chosen_korean: 악카바
  alternatives_korean:
  - 아카바
  - 악까바
  lexicon: LSJ
  rationale: 겹자음 kappa를 반영하여 자음의 중복감을 살렸습니다.
- source_word: Συβαεί
  english_pob_choice: Sybaei
  chosen_korean: 시바이
  alternatives_korean:
  - 수바이
  - 시바에이
  lexicon: LSJ
  rationale: 그리스어 어미를 과도하게 한국어화하지 않고, 음역을 간결하게 유지했습니다.
- source_word: Ἀνάν
  english_pob_choice: Anan
  chosen_korean: 아난
  alternatives_korean:
  - 아난
  lexicon: LSJ
  rationale: 짧고 직접적인 고유명사 음역을 따랐습니다.
- source_word: Κουά
  english_pob_choice: Koua
  chosen_korean: 쿠아
  alternatives_korean:
  - 쿠와
  - 구아
  lexicon: LSJ
  rationale: ου의 이중 모음을 한국어 '쿠'로 반영해 소리를 보존했습니다.
- source_word: Κεδδούρ
  english_pob_choice: Keddour
  chosen_korean: 케두르
  alternatives_korean:
  - 케두르르
  - 케뚜르
  lexicon: LSJ
  rationale: 겹자음과 ου를 반영하되, 한국어 독자가 읽기 쉬운 형태로 정리했습니다.
theological_decisions:
- issue: 1 Esdras의 그리스어 명단과 히브리어 병행본문의 불일치
  chosen_reading: 그리스어 본문에 있는 이름들을 그대로 옮기고, 느헤미야의 히브리어 목록과 조화시키지 않았습니다.
  alternative_readings:
  - 히브리어 병행본문의 익숙한 이름들로 일부를 바꾸는 방식
  rationale: 이 책의 번역 기준은 그리스어 원문이며, 병행 히브리어는 참고용 비교 자료이므로 본문을 맞추어 재구성하지 않았습니다.
  doctrine_reference: '번역 원칙: 원어 본문 우선'
- issue: 반복 구조의 보존
  chosen_reading: 각 항목을 ‘~의 아들들’로 반복해 명단의 리듬과 집단 표지를 유지했습니다.
  alternative_readings:
  - 의미만 전달하는 간략한 목록형 번역
  rationale: 이 구절은 서술보다 목록 구조가 핵심이므로, 반복되는 문형을 유지하는 것이 원문 이해에 더 충실합니다.
  doctrine_reference: 형식-의미 균형
