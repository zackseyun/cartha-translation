  lexicon: LSJ
  rationale: 그리스어 음형을 바탕으로 현대 한국어 외래어 표기 방식에 맞게 옮겼습니다.
- source_word: Οὐτά
  english_pob_choice: Outa
  chosen_korean: 우타
  alternatives_korean:
