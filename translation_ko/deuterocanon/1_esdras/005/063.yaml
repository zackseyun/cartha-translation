base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/063.yaml
  text: And when the enemies of the tribe of Judah and Benjamin heard[a], they came to find out what the sound of the trumpets was[b],
  footnotes:
  - marker: a
    text: Or, more literally, 'what the voice of the trumpets was.'
    reason: lexical_alternative
  - marker: b
    text: Greek has the singular 'tribe' with 'Judah and Benjamin'; English might also be rendered 'the tribes of Judah and Benjamin.'
    reason: alternative_reading
translation:
  language: ko
  text: 유다와 베냐민 지파의 원수들이 그것을 듣고, 나팔들의 소리가 무엇인지 알아보려고 왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἐχθροὶ
  english_pob_choice: the enemies
  chosen_korean: 원수들
  alternatives_korean:
  - 적들
  - 대적들
  lexicon: BDAG
  rationale: 단순한 ‘적들’보다 관계적 적대와 위협을 더 분명히 드러내는 ‘원수들’이 문맥에 맞고, POB의 적대자 의미를 유지합니다.
- source_word: τῆς φυλῆς Ἰούδα καὶ Βενιαμεὶν
  english_pob_choice: of the tribe of Judah and Benjamin
  chosen_korean: 유다와 베냐민 지파의
  alternatives_korean:
  - 유다와 베냐민의 지파의
  - 유다와 베냐민 지파들의
  lexicon: BDAG
  rationale: 그리스어는 단수 ‘지파’를 쓰므로, 한국어도 단수 명사를 살려 ‘유다와 베냐민 지파의’로 옮겨 원문 형태를 반영했습니다.
- source_word: ἐπιγνῶναι
  english_pob_choice: to find out
  chosen_korean: 알아보려고
  alternatives_korean:
  - 알아내려고
  - 확인하려고
  - 알게 되려고
  lexicon: BDAG
  rationale: 목적 부정사로서 자연스럽고, 문맥상 소리의 정체를 파악하려는 뜻을 간결하게 드러냅니다.
- source_word: τίς ἡ φωνὴ τῶν σαλπίγγων
  english_pob_choice: what the sound of the trumpets was
  chosen_korean: 나팔들의 소리가 무엇인지
  alternatives_korean:
  - 나팔 소리가 무엇인지
  - 나팔들의 음성이 무엇인지
  - 그 나팔 소리가 무엇인지
  lexicon: BDAG
  rationale: φωνή를 이 문맥에서는 ‘소리’로 옮기는 것이 자연스럽고, τίς를 ‘무엇인지’로 처리해 POB의 해석 여지를 살렸습니다.
