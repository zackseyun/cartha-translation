base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/037.yaml
  text: 'And they were not able to declare their families and lineage[a], that they were from Israel: the sons of Asan son of Baenan, the sons of Nekodan[b], six hundred fifty-two.'
  footnotes:
  - marker: a
    text: The Greek text names 'Asan ... Baenan' and 'Nekodan' here, while the approximate MT parallel in Nehemiah 7 lists different names at this point. Because 1 Esdras is translated from the Greek witness, the Greek names are retained in the main text.
    reason: alternative_reading
  - marker: b
    text: The phrase 'son of the son of Baenan' is awkward in English but reflects the Greek wording as transmitted; it may represent a compressed or irregular genealogical expression.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 자기 조상들의 가문과 계보를, 곧 자기들이 이스라엘 사람인지 증명하여 밝힐 수 없었습니다. 아산의 아들 바에난의 아들들, 느고단의 아들들, 육백오십이 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 여기에서 아산, 바에난, 느고단을 말하며, 병행하는 히브리어/느헤미야 전승은 이 지점에서 다른 이름을 전합니다. 1 Esdras는 그리스어 본문을 따라 번역합니다.
    reason: textual_variant
