translation:
  language: ko
  text: 마칼론[a] 사람들은 백이십이 명이었고, 베톨리오 사람들은 오십이 명이었으며, 네이페이스 사람들은 백오십육 명이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 평행본문인 느헤미야 7:25에는 “라마와 게바 자손은 육백이십일 명”이라고 되어 있습니다. 여기 1 에스드라스는 이름들과 수가 크게 다른 전승을 보존합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ ἐκ
  english_pob_choice: those from
  chosen_korean: ~ 사람들
  alternatives_korean:
  - ~ 출신 사람들
  - ~에서 온 이들
  lexicon: LSJ
  rationale: 지명 기원을 나타내는 표현이므로, 한국어에서는 자연스러운 소속 표현인 ‘~ 사람들’로 옮겨 원문의 집단 식별 기능을 살렸습니다.
