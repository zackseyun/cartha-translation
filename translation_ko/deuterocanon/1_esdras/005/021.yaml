  chosen_korean: 마칼론
  alternatives_korean:
  - 마카론
  - 마칼롱
  lexicon: LSJ
  rationale: 그리스어 고유명사를 음역해 유지했습니다. 히브리어 평행본문과의 조화를 피하고, 1 Esdras의 그리스어 전승을 그대로 드러내기 위한 선택입니다.
- source_word: Βετολιώ
  english_pob_choice: Betolio
  chosen_korean: 베톨리오
  alternatives_korean:
  - 베토리오
  - 베톨리오우
  lexicon: LSJ
  rationale: 그리스어 형태를 따라 음역했습니다. 전승이 불안정한 지명명이므로 추정적 한국식 동형화보다 음역 보존이 적절합니다.
- source_word: Νειφείς
  english_pob_choice: Neipheis
  chosen_korean: 네이페이스
  alternatives_korean:
  - 네이피스
  - 네이페이즈
  lexicon: LSJ
  rationale: 그리스어 주격형을 직접 음역했습니다. 히브리어 평행본문의 지명군과 다르므로, 본문 전승의 차이를 지우지 않기 위해 표준화하지 않았습니다.
- source_word: ἑκατὸν εἴκοσι δύο
  english_pob_choice: one hundred twenty-two
  chosen_korean: 백스물둘
  alternatives_korean:
  - 백이십이
  - 한백스물둘
  lexicon: LSJ
  rationale: 현대 한국어에서 가장 자연스러운 수사 표현으로 옮겼습니다. 목록 구절의 간결한 열거 리듬을 살리기 위해 한자식 표기보다 순우리말 수사를 사용했습니다.
- source_word: πεντήκοντα δύο
  english_pob_choice: fifty-two
  chosen_korean: 쉰둘
  alternatives_korean:
  - 오십이
  - 쉰두
  lexicon: LSJ
  rationale: 앞선 수와 통일되게 순우리말 수사로 처리했습니다.
- source_word: ἑκατὸν πεντήκοντα ἕξ
  english_pob_choice: one hundred fifty-six
  chosen_korean: 백쉰여섯
  alternatives_korean:
  - 백오십육
  - 한백쉰여섯
  lexicon: LSJ
  rationale: 목록의 숫자 표기를 자연스러운 현대 한국어로 옮겼습니다.
theological_decisions:
- issue: 1 Esdras의 그리스어 명단과 히브리어 평행본문의 큰 차이
  chosen_reading: 그리스어 본문을 본문역으로 유지하고, 평행본문과의 차이는 각주로만 다루지 않되 본문을 조화시키지 않았습니다.
  alternative_readings:
  - 느헤미야 7:25의 히브리어 평행본문에 맞춰 ‘라마와 게바의 아들들, 육백이십일’로 조화
  rationale: 이 구절은 1 Esdras의 그리스어 전승이 원자료이며, 평행본문은 참고·대조 자료입니다. 명단과 숫자의 차이가 크므로 조화 번역은 본문 증거를 흐리게 합니다.
  doctrine_reference: 'PHILOSOPHY.md: 1 Esdras는 Swete LXX를 기본 본문으로 하며, WLC 평행본문은 비평적 참고 자료입니다.'
