  text: those from Makalon[a], one hundred twenty-two; those from Betolio, fifty-two; Neipheis, one hundred fifty-six.
  footnotes:
  - marker: a
    text: The Hebrew parallel at Nehemiah 7:25 reads, 'the sons of Ramah and Geba, six hundred twenty-one.' 1 Esdras here preserves a substantially different set of names and numbers.
