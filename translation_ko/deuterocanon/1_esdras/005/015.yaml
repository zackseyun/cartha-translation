  - ~의 가족들
  lexicon: LSJ
  rationale: 계보·명단 형식에서 반복되는 υἱοὶ는 직역에 가까운 ‘~의 아들들’이 가장 원문 구조를 잘 보존합니다.
- source_word: Ἀζὴρ Ἐζεκίου
