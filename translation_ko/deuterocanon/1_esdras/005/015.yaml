  - 아제르 헤제키아
  lexicon: 고유명사 음역
  rationale: 그리스어 고유명사를 음역해 원문 형태를 유지했으며, 본절의 MT 평행본문과는 이름이 달라지므로 본문 안에서 표준화하지 않았습니다.
- source_word: Κειλὰν καὶ Ἀζητάς
  english_pob_choice: Keilan and Azetas
  chosen_korean: 케일란과 아제타스
  alternatives_korean:
  - 케일라와 아제타스
  - 케일란과 아제타
  lexicon: 고유명사 음역
  rationale: 두 이름 모두 그리스어 표기를 따라 음역했고, 연결사 καὶ는 자연스러운 한국어 접속으로 처리했습니다.
- source_word: ἐξήκοντα ἑπτά
  english_pob_choice: sixty-seven
  chosen_korean: 예순일곱 명
  alternatives_korean:
  - 67명
  - 예순일곱
  lexicon: LSJ
  rationale: 정수는 한국어 출판 문체에 맞게 한글 수사로 옮기되, 인원 계수 맥락을 드러내기 위해 ‘명’을 붙였습니다.
- source_word: Ἀζάρου
  english_pob_choice: Azaros
  chosen_korean: 아사로스
  alternatives_korean:
  - 아자루
  - 아자르
  lexicon: 고유명사 음역
  rationale: 속격형 그리스어 고유명사를 음역해 유지했으며, 앞선 명단과의 불일치를 조화시키지 않고 원문 순서를 따랐습니다.
- source_word: τετρακόσιοι τριάκοντα δύο
  english_pob_choice: four hundred thirty-two
  chosen_korean: 사백삼십두 명
  alternatives_korean:
  - 432명
  - 사백삼십이 명
  lexicon: LSJ
  rationale: 원문의 정확한 수량을 보존하면서 한국어 명단 문체에 맞는 수사 표기를 사용했습니다.
theological_decisions:
- issue: 1 Esdras의 그리스어 본문과 MT 평행본문의 인명·수량 불일치
  chosen_reading: 그리스어 본문을 그대로 따라 번역하고, 평행본문과의 조화를 시도하지 않습니다.
  alternative_readings:
  - MT의 인명과 수량에 맞춰 정리하는 읽기
  - 두 전승을 절충해 표준화하는 읽기
  rationale: 이 절은 1 Esdras 특유의 재배열·확장 가능성이 있는 족보 목록이므로, 검증된 그리스어 증거를 우선하고 히브리어 평행본문으로 본문을 평준화하지 않는 것이 원문 지향에 충실합니다.
  doctrine_reference: 본문비평 / 전승비교
