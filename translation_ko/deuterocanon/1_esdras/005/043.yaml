base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/043.yaml
  text: And some of the heads of families[a], when they arrived at the temple of God in Jerusalem, pledged to raise up the house on its site, according to their ability,
  footnotes:
  - marker: a
    text: Or “vowed to rebuild the house in its place.” The Greek verb can carry the sense of making a vow, and “house” here refers to the temple.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 족장들 가운데 몇 사람은 예루살렘에 있는 하나님의 성전에 이르렀을 때, 자기들의 능력에 따라 그 집을 그 터 위에 세우기로 서원했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 집을 그 자리에 다시 세우기로 서원했습니다.” 이 동사는 서원의 뜻을 가질 수 있으며, 여기서 “집”은 성전을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡγουμένων κατὰ τὰς πατριὰς
  english_pob_choice: heads of families
  chosen_korean: 족장들 가운데 몇 사람
  alternatives_korean:
  - 가문들의 우두머리들
  - 가족들의 지도자들
  - 조상 가문의 우두머리들
  lexicon: LSJ
  rationale: πατριάς는 혈통·가문 단위를 가리키므로, 문맥상 ‘머리들’의 의미를 살려 자연스럽게 ‘족장들’로 옮겼습니다.
- source_word: ἱερὸν τοῦ θεοῦ τὸ ἐν Ἰερουσαλήμ
  english_pob_choice: the temple of God in Jerusalem
  chosen_korean: 예루살렘에 있는 하나님의 성전
  alternatives_korean:
  - 예루살렘에 있는 하나님의 성소
  - 예루살렘의 하나님의 성전
  lexicon: LSJ
  rationale: ἱερόν은 성전 परिसर/성전 건물을 가리키므로, 한국어에서는 가장 분명한 ‘성전’으로 옮겼습니다.
- source_word: εὔξαντο ἐγεῖραι
  english_pob_choice: pledged to raise up
  chosen_korean: 세우기로 서원했습니다
  alternatives_korean:
  - 일으키기로 서약했습니다
  - 재건하기로 서원했습니다
  - 세우겠다고 약속했습니다
  lexicon: LSJ
  rationale: εὔξαντο는 서원·맹세의 뉘앙스를 지니며 뒤의 부정사와 함께 단순한 의지 표명보다 더 강한 결의를 나타내므로 ‘서원했습니다’로 살렸습니다. ἐγεῖραι의 ‘일으키다/세우다’ 이미지는 건축 맥락에서 자연스럽게 ‘세우다’로 표현했습니다.
- source_word: τὸν οἶκον ἐπὶ τοῦ τόπου αὐτοῦ
  english_pob_choice: the house on its site
  chosen_korean: 그 집을 그 터 위에
  alternatives_korean:
  - 그 집을 제자리에
  - 그 성전을 그 자리 위에
  - 그 집을 그 본래 자리에
  lexicon: LSJ
  rationale: οἶκος는 여기서 성전을 가리키는 ‘집’이라는 성경적 관용을 유지했고, ἐπὶ τοῦ τόπου αὐτοῦ는 복원 위치를 드러내는 말이므로 ‘그 터 위에’로 옮겼습니다.
- source_word: κατὰ τὴν αὐτῶν δύναμιν
  english_pob_choice: according to their ability
  chosen_korean: 자기들의 능력에 따라
  alternatives_korean:
  - 그들의 형편에 따라
  - 그들의 힘에 따라
  - 자기들의 소출에 따라
  lexicon: BDAG
  rationale: δύναμις는 여기서 실질적 역량·감당 가능성을 뜻하므로, 의미를 넓게 포괄하는 ‘능력’이 가장 균형 잡힌 대응입니다.
theological_decisions:
- issue: εὔξαντο의 의미를 ‘서원’으로 둘지, 단순한 ‘약속/결의’로 둘지
  chosen_reading: ‘서원했습니다’로 번역해 성전 재건을 위한 엄숙한 결심의 성격을 드러냈습니다.
  alternative_readings:
  - 약속했습니다
  - 결의했습니다
  - 맹세했습니다
  rationale: 문맥은 성전 재건에 대한 헌신이며, 동사의 어감은 단순 약정보다 더 강한 서원에 가깝습니다. 다만 지나치게 제의적 의미로 고정하지 않기 위해 ‘재건하기로 서원했습니다’보다 문장 흐름은 자연스럽게 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; optimal equivalence'
