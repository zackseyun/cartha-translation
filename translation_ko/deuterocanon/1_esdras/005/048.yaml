revisions:
- from: 그 위에 번제물을 바치되, 모세의 책에 기록된 바—하나님의 사람의 책무에 따라 정해진 대로—행해야 합니다.[a]
  to: 그 위에 번제를 드리기 위해, 하나님의 사람 모세의 책에 규정된 대로 하였습니다.[a]
  rationale: 모세를 수식하는 ‘하나님의 사람’을 올바르게 복원하고, 원문에 없는 ‘책무’와 독립적 의무 표현을 제거했습니다. 그리스어의 ‘책’ 및 ‘규정된’이라는 표현을 보존하면서, 한국어에서 목적 구문과 앞 문맥의 행위를 자연스럽게 연결했습니다. 각주도 그리스어 본문과 히브리어 병행 본문의 실제 표현 차이를 정확히 설명하도록 고쳤습니다.
