base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/048.yaml
  text: to offer burnt offerings on it[a], according to what is prescribed in the book of Moses, the man of God.
  footnotes:
  - marker: a
    text: The Hebrew parallel in Ezra 3:2 reads, 'as it is written in the law of Moses, the man of God.' 1 Esdras here uses 'the book of Moses' and 'what is prescribed,' expressing the same basic sense with different wording.
    reason: alternative_reading
translation:
  language: ko
  text: 그 위에 번제를 드리기 위해, 하나님의 사람 모세의 책에 규정된 대로 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 병행 본문인 에스라 3:2는 “모세, 하나님의 사람의 율법에 기록된 대로”라고 읽습니다. 그러나 1 에스드라스의 그리스어 본문은 “하나님의 사람 모세의 책에 규정된 대로”라고 표현합니다.
    reason: cross_reference
lexical_decisions:
- source_word: προσενέγκαι
  english_pob_choice: to offer
  chosen_korean: 바치다
  alternatives_korean:
  - 드리다
  - 제물로 바치다
  lexicon: LEH
  rationale: 제사 문맥에서 단순한 ‘가져오다’보다 희생제물을 하나님께 올려 드리는 행위를 드러내기 위해 ‘바치다’를 택했습니다.
- source_word: ὁλοκαυτώματα
  english_pob_choice: burnt offerings
  chosen_korean: 번제물
  alternatives_korean:
  - 불태워 드리는 제물
  - 전번제
  lexicon: LEH
  rationale: 전부 불살라 드리는 제사의 의미를 살리면서 한국어 성경 용례와도 맞는 표현으로 옮겼습니다.
- source_word: ἐπ’ αὐτοῦ
  english_pob_choice: on it
  chosen_korean: 그 위에
  alternatives_korean:
  - 그 위에서
  - 그것 위에
  lexicon: BDAG
  rationale: 앞절의 제단을 가리키므로 장소 관계를 자연스럽게 살려 ‘그 위에’로 옮겼습니다.
- source_word: τοῖς ... διηγορευμένοις
  english_pob_choice: what is prescribed
  chosen_korean: 정해진 대로
  alternatives_korean:
  - 규정된 바에 따라
  - 명령된 바에 따라
  lexicon: LSJ
  rationale: 법적·제의적 규정을 가리키는 말이므로, 단순 설명보다 규범적 구속을 드러내는 표현을 택했습니다.
- source_word: ἐν τῇ Μωσέως βίβλῳ
  english_pob_choice: in the book of Moses
  chosen_korean: 모세의 책에
  alternatives_korean:
  - 모세의 두루마리에
  - 모세의 책 속에
  lexicon: LEH
  rationale: Greek 본문이 ‘율법’이 아니라 ‘책’을 말하므로, MT의 병행을 참고하되 그리스어 표현을 그대로 살렸습니다.
- source_word: τοῦ ἀνθρώπου τοῦ θεοῦ
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님의 종
  - 하나님의 사람인
  lexicon: LEH
  rationale: 모세를 가리키는 성경적 칭호를 직역에 가깝게 유지해, 전통적 명칭의 무게를 보존했습니다.
theological_decisions:
- issue: Greek 본문의 ‘모세의 책’과 히브리어 병행문의 ‘모세의 율법’ 관계
  chosen_reading: 본문은 그리스어의 ‘모세의 책’과 ‘정해진 대로’라는 표현을 유지하되, 율법적 의미는 문맥으로 드러내도록 했습니다.
  alternative_readings:
  - ‘모세의 율법에 기록된 대로’로 MT에 맞춰 정리
  - ‘모세의 책에 있는 명령대로’로 더 풀어 옮김
  rationale: 1 Esdras는 그리스어가 주본문이므로, 히브리어 병행은 의미 확인용으로만 사용하고 본문 어휘 자체를 덮어쓰지 않았습니다.
  doctrine_reference: 'PHILOSOPHY.md: deuterocanonical books use Greek source primacy with parallel Hebrew as confirmatory evidence'
