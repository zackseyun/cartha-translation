revisions:
- from: 그리고 그들은 레위 사람들을 스무 살 이상으로 정하여 주님의 일들을 맡겼습니다. 그때 예수아가 자기 아들들과 형제들과 함께 섰고, 그의 형제 다말디엘과 예수아의 아들 헤마다분과, 유다의 아들 엘리아둔의 아들들이 자기 아들들과 형제들과 함께 섰습니다. 모든 레위 사람들은 한마음으로 일의 감독자들이 되어 주님의 집에서 일들을 수행하였고, 건축자들은 주님의 성전을 지었습니다.[a][b][c][d]
  to: 그리고 그들은 스무 살 이상 된 레위 사람들을 주님의 일들을 감독하도록 세웠습니다. 그때 예수아와 그의 아들들과 형제들이 섰고, 그의 형제인 다마디엘[a]과 헤마다분의 아들 예수아의 아들들[b], 또 엘리아둔의 아들 유다의 아들들이 자기 아들들과 형제들과 함께 섰습니다. 모든 레위 사람들은 한마음으로 여러 일을 감독하는 이들이 되어[c] 주님의 집에서 그 일들을 수행했습니다.[d] 그리고 건축자들은 주님의 성전을 지었습니다.
  rationale: 원문의 우선권을 따라 인명 열거와 속격 계보를 바로잡고, 병행 전승으로 강하게 뒷받침되는 이름 식별은 본문에 강제하지 않고 각주로 한정했습니다. ‘다마디엘’이 누구의 형제인지 그리스어 문장 자체가 다소 압축되어 있으므로, 한국어에서도 ‘그의 형제’라는 표현을 보존하면서 예수아에 연결되는 가장 가까운 문법적 이해만 제시했습니다. 직무 배정, 복수의 ‘일들’, 집/성전의 구별, 드문 감독 직책의 의미도 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:04:05Z'
review_pass:
  verdict: revise
  source_fidelity: 현 초안은 첫 문장의 직무 배정과 마지막의 ‘건축자들이 … 지었습니다’를 대체로 충실히 옮겼습니다. 그러나 인명 계보의 속격 연결을 바꾸어 ‘헤마다분의 아들 예수아’와 ‘엘리아둔의 아들 유다’를 각각 ‘예수아의 아들 헤마다분’ 및 ‘유다의 아들 엘리아둔’으로 뒤집었고, 다마디엘을 ‘그의 형제’로 처리한 선행사도 한국어 문장에서 불명확합니다. 그리스어의 난해한 열거를 과도하게 조화시키지 않고, 인명 관계를 원문 순서에 맞추어 바로잡았습니다.
  naturalness: ‘스무 살 이상으로 정하여 주님의 일들을 맡겼습니다’는 한국어에서 목적어와 맡겨진 직무의 관계가 어색합니다. ‘스무 살 이상 된 … 세워 … 감독하게 했습니다’가 자연스럽고 직무 배정의 뜻을 더 정확히 드러냅니다. 계보 열거는 원문의 다소 거친 구조를 유지하되, 조사와 쉼표로 현대 한국어에서 식별 가능하게 정리했습니다.
  terminology: κύριος는 ‘주님’, οἶκος와 ναός는 각각 ‘집’과 ‘성전’으로 구별했습니다. Δαμαδιήλ과 Ἡμαδαβούν은 본문에서 그리스어에 가까운 ‘다마디엘’, ‘헤마다분’으로 보존하고, 병행 전승의 갓미엘 및 헤나닷은 각주에서만 제시했습니다. 기존 각주의 ‘깟디엘’은 통용 한국어 성서 이름 표기로 보기 어렵고 ‘갓미엘’로 고쳤습니다.
  issues:
  - severity: high
    issue: 헤마다분과 예수아의 부자 관계가 역전되었습니다.
    rationale: οἱ υἱοὶ Ἰησοῦ Ἡμαδαβούν은 영어 감사본도 ‘the sons of Jeshua son of Henadad’로 분석합니다. 초안의 ‘예수아의 아들 헤마다분’은 반대 관계입니다.
  - severity: high
    issue: 엘리아둔과 유다의 부자 관계가 역전되었습니다.
    rationale: οἱ υἱοὶ Ἰούδα τοῦ Εἰλιαδοὺν은 ‘엘리아둔의 아들 유다의 아들들’입니다. 초안의 ‘유다의 아들 엘리아둔의 아들들’은 속격 관계를 뒤집습니다.
  - severity: medium
    issue: ‘그의 형제 다말디엘’의 선행사가 불명확하며, 음역도 원문 Δαμαδιήλ에서 불필요하게 벗어납니다.
    rationale: 그리스어는 다마디엘을 ‘그 형제’로 열거합니다. 한국어에서는 ‘그의 형제인 다마디엘’로 처리해 결속을 보이고, 본문 음역은 ‘다마디엘’로 유지하는 것이 안전합니다.
  - severity: medium
    issue: 기존 각주 a의 ‘깟디엘’은 표준적 한국어 성서 인명 표기와 맞지 않습니다.
    rationale: 병행 에스라 전승의 Kadmiel은 한국어에서 통상 ‘갓미엘’로 표기됩니다. 본문은 그리스어형을 유지하되 각주에서 병행형을 정확히 밝혀야 합니다.
  - severity: low
    issue: 각주 표지가 문장 끝에 한꺼번에 배치되어 각주 대상이 불분명합니다.
    rationale: 대체 독법 각주는 해당 인명 뒤에, 어휘 각주는 해당 표현 뒤에 붙여 독자가 무엇을 설명하는지 알 수 있게 해야 합니다.
