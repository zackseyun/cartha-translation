base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/056.yaml
  text: And they appointed the Levites[a], from twenty years old and upward, over the works of the Lord. Then Jeshua stood with his sons and brothers, and Kadmiel his brother, and the sons of Jeshua son of Henadad, and the sons of Judah son of Eliadun, together with their sons and brothers—all the Levites, united as supervisors of the work, carrying on the works in the house of the Lord[d][c][b]. And the builders built the temple of the Lord.
  footnotes:
  - marker: a
    text: Greek reads Damadiēl; the parallel Ezra tradition identifies this Levite as Kadmiel.
    reason: alternative_reading
  - marker: b
    text: Greek Hemadaboun likely reflects the name Henadad from the parallel Hebrew tradition.
    reason: alternative_reading
  - marker: c
    text: The phrase 'supervisors of the work' translates a rare Greek term meaning those directing or overseeing the labor.
    reason: lexical_alternative
  - marker: d
    text: Some English translations smooth 'works' to singular 'work' in this verse; the Greek uses the plural in both occurrences.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 스무 살 이상 된 레위 사람들을 주님의 일들을 감독하도록 세웠습니다. 그때 예수아와 그의 아들들과 형제들이 섰고, 그의 형제인 다마디엘[a]과 헤마다분의 아들 예수아의 아들들[b], 또 엘리아둔의 아들 유다의 아들들이 자기 아들들과 형제들과 함께 섰습니다. 모든 레위 사람들은 한마음으로 여러 일을 감독하는 이들이 되어[c] 주님의 집에서 그 일들을 수행했습니다.[d] 그리고 건축자들은 주님의 성전을 지었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 Δαμαδιήλ로 읽지만, 병행 에스라 전승은 이 인물을 갓미엘로 식별합니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어 Ἡμαδαβούν은 병행 히브리어 전승의 헤나닷을 반영한 형태로 보입니다.
    reason: alternative_reading
  - marker: c
    text: ἐργοδιῶκται는 드문 합성어로, 단순 노동자보다 일을 지휘하거나 감독하는 사람들을 가리킵니다.
    reason: lexical_alternative
  - marker: d
    text: 그리스어는 두 곳 모두 ‘일들’을 뜻하는 복수형 ἔργων/ἔργα를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησαν τοὺς Λευείτας
  english_pob_choice: they appointed the Levites
  chosen_korean: 레위 사람들을 ... 맡겼습니다
  alternatives_korean:
  - 레위 사람들을 세웠습니다
  - 레위 사람들을 임명했습니다
  lexicon: LSJ
  rationale: ἔστησαν은 단순히 ‘세우다’보다 사람을 어떤 직무에 배치·지정하는 뜻이어서, 문맥상 ‘맡기다’로 옮겨 직무 부여의 의미를 드러냈습니다.
- source_word: ἀπὸ εἰκοσαετοῦς
  english_pob_choice: from twenty years old and upward
  chosen_korean: 스무 살 이상으로
  alternatives_korean:
  - 스무 살부터
  - 스무 살부터 위로
  lexicon: LSJ
  rationale: 최소 연령 기준을 나타내므로 현대 한국어에서 자연스러운 ‘스무 살 이상으로’가 가장 직접적입니다.
- source_word: ἐπὶ τῶν ἔργων τοῦ κυρίου / ἐν τῷ οἴκῳ τοῦ κυρίου
  english_pob_choice: over the works of the Lord / in the house of the Lord
  chosen_korean: 주님의 일들 / 주님의 집
  alternatives_korean:
  - 주님의 일 / 주님의 성전 안
  lexicon: LSJ
  rationale: 원문은 두 번 모두 복수형 ἔργων을 쓰므로 ‘일들’을 유지했고, οἶκος는 앞부분에서 ‘집’으로, ναός는 뒤에서 ‘성전’으로 구분해 옮겼습니다.
- source_word: ἐργοδιῶκται
  english_pob_choice: supervisors of the work
  chosen_korean: 일의 감독자들
  alternatives_korean:
  - 일꾼들
  - 공사의 감독자들
  - 일 감독자들
  lexicon: LSJ
  rationale: 드문 합성어로 단순 노동자가 아니라 일을 감독·관리하는 사람들을 뜻하므로, 한국어에서도 직무의 성격이 드러나는 ‘감독자들’이 적절합니다.
- source_word: Δαμαδιὴλ / Ἡμαδαβούν
  english_pob_choice: Kadmiel / Henadad
  chosen_korean: 다말디엘 / 헤마다분
  alternatives_korean:
  - 다마디엘 / 헤마다분
  - 깟디엘 / 헤나닷
  lexicon: parallel Hebrew tradition / standard English biblical name convention
  rationale: 이본은 병행 전승의 고유명 정체성과 그리스어 표기를 함께 반영해야 하므로, 본문에는 그리스어 형태를 살리고 별도 주석 없이도 식별 가능한 범위에서 음역했습니다.
- source_word: οἰκοδόμησαν οἱ οἰκοδόμοι τὸν ναὸν
  english_pob_choice: the builders built the temple
  chosen_korean: 건축자들은 ... 성전을 지었습니다
  alternatives_korean:
  - 건축자들은 ... 성전을 건축했습니다
  - 건축자들은 ... 성전을 세웠습니다
  lexicon: LSJ
  rationale: οἰκοδόμησαν οἱ οἰκοδόμοι의 반복 효과를 살리면서, ναός는 앞의 οἶκος와 구별되게 ‘성전’으로 옮겼습니다.
theological_decisions:
- issue: κύριος의 번역
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 야훼
  rationale: 직접 본문이 그리스어 κύριος이므로 기본값인 ‘주님’을 따랐고, 이 구절에서는 여호와 표기를 요구할 정도의 직접 উদ্ধৃতি 맥락은 아닙니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → 주님'
- issue: 고유명사의 그리스어-병행전승 처리
  chosen_reading: 본문에는 그리스어 형태를 바탕으로 음역하되, 병행 전승이 분명한 이름은 한국어에서 식별 가능한 범위로 옮깁니다.
  alternative_readings:
  - 그리스어 철자를 그대로 음차
  - 히브리어 병행형으로 완전 복원
  rationale: 1 Esdras는 에스라 전승을 확장·재배열하는 경우가 있어, 본문 가독성과 전승 식별성을 함께 살리는 절충이 필요합니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names'
