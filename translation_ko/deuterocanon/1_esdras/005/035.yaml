    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερόδουλοι
  english_pob_choice: temple servants
  chosen_korean: 성전 봉사자들
  alternatives_korean:
  - 성전 종들
  - 성전 노예들
  lexicon: LSJ
  rationale: 문맥이 행정적 인원 집계이므로, 직역의 servile 뉘앙스를 과도하게 부각하지 않으면서도 성전 관련 봉사 집단임을 분명히 드러내는 표현으로 옮겼습니다.
- source_word: υἱοὶ τῶν παίδων Σαλωμών
  english_pob_choice: the sons of Solomon’s servants
  chosen_korean: 솔로몬의 종들의 아들들
  alternatives_korean:
  - 솔로몬의 종들의 자손들
  - 솔로몬의 노예들의 아들들
  lexicon: LSJ
  rationale: genealogical 목록의 형식을 살려 '아들들'을 유지했고, παίδες의 종속성을 반영해 '종들'로 옮겼습니다. '자손들'은 의미상 가능하지만 원문의 형식을 약화시킵니다.
- source_word: τριακόσιοι ἑβδομήκοντα δύο
  english_pob_choice: three hundred seventy-two
  chosen_korean: 삼백칠십이 명
  alternatives_korean:
  - 삼백칠십이
  - 삼백칠십이 사람
  lexicon: LSJ
  rationale: 한국어 인원 계수 관용에 맞게 '명'을 붙여 자연스럽게 수치를 전달했습니다.
theological_decisions:
- issue: ἱερόδουλοι와 παίδες의 종속적 신분을 어떻게 드러낼 것인가
  chosen_reading: 본문에는 중립적 행정 용어인 '성전 봉사자들'과 '종들'을 사용하고, 더 강한 신분 뉘앙스는 각주로 제한했습니다.
  alternative_readings:
  - 성전 노예들
  - 솔로몬의 노예들의 아들들
  rationale: 이 절은 제의 인원의 총계이므로 본문에서는 과도한 신학적 강조를 피하되, 그리스어가 종속 노동/봉사까지 포함할 수 있다는 점은 주석으로 보존하는 것이 원문에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: contested service terms / source-directed lexical tension'
