base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/054.yaml
  text: And in the second year[a], when they had come to the house of God in Jerusalem, in the second month, Zerubbabel son of Shealtiel and Jeshua son of Jozadak began, along with their brothers, the priests, the Levites, and all who had come from the captivity to Jerusalem[b],
  footnotes:
  - marker: a
    text: Or 'the temple of God' or 'the sanctuary of God.' The Greek term can refer to the sacred complex more broadly, but 'house of God' preserves the restoration-era idiom.
    reason: lexical_alternative
  - marker: b
    text: Or 'all who had returned from exile.' The Greek says more literally 'from the captivity.'
    reason: lexical_alternative
translation:
  language: ko
  text: 둘째 해에, 그들이 예루살렘에 있는 하나님의 집에 이르렀을 때, 둘째 달에 스알디엘의 아들 스룹바벨과 요사닥의 아들 예수아와 그들의 형제들, 제사장들, 레위인들, 그리고 포로 생활에서 예루살렘으로 올라온 모든 이가 시작했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 성전’, ‘하나님의 성소’로 옮길 수 있습니다. 여기서는 복원기 문맥의 관용구를 살려 ‘집’을 택했습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘포로에서 돌아온 모든 이’로 옮길 수 있습니다. 직역하면 ‘포로 생활에서 온 모든 이’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ δευτέρῳ ἔτει
  english_pob_choice: in the second year
  chosen_korean: 둘째 해에
  alternatives_korean:
  - 둘째 해 동안
  - 둘째 해에
  lexicon: BDAG
  rationale: 시간을 나타내는 여격 표현을 자연스러운 한국어 시점 부사어로 옮겼습니다.
- source_word: τὸ ἱερὸν τοῦ θεοῦ
  english_pob_choice: the house of God
  chosen_korean: 하나님의 집
  alternatives_korean:
  - 하나님의 성전
  - 하나님의 성소
  lexicon: BDAG
  rationale: 복원기 에스라 전승의 관용구를 살려 ‘집’으로 옮겨, 성전 건물만이 아니라 예배의 거처라는 넓은 의미를 보존했습니다.
- source_word: παραγενόμενοι
  english_pob_choice: when they had come
  chosen_korean: 그들이 ...에 이르렀을 때
  alternatives_korean:
  - 그들이 ...에 도착했을 때
  - 그들이 ...에 와서
  lexicon: BDAG
  rationale: 앞선 동작을 배경으로 깔고 뒤의 ‘시작했습니다’를 이끄는 시간 관계를 한국어로 분명히 드러냈습니다.
- source_word: οἱ ἀδελφοὶ αὐτῶν
  english_pob_choice: their brothers
  chosen_korean: 그들의 형제들
  alternatives_korean:
  - 그들의 친족들
  - 그들의 동료들
  lexicon: BDAG
  rationale: 그리스어의 남성 복수 친족 표현을 그대로 살려, 공동체 구성원을 일반화해 바꾸지 않았습니다.
- source_word: πάντες οἱ παραγενόμενοι ἐκ τῆς αἰχμαλωσίας
  english_pob_choice: all who had come from the captivity
  chosen_korean: 포로 생활에서 ...으로 올라온 모든 이
  alternatives_korean:
  - 포로 생활에서 돌아온 모든 이
  - 포로 상태에서 온 모든 이
  lexicon: BDAG
  rationale: αἰχμαλωσία의 구체적 ‘포로 생활’ 뉘앙스를 유지하면서, 예루살렘으로의 귀환이라는 문맥을 한국어 관용에 맞게 표현했습니다.
theological_decisions:
- issue: τὸ ἱερὸν τοῦ θεοῦ를 ‘성전’보다 ‘집’으로 옮길지 여부
  chosen_reading: 하나님의 집
  alternative_readings:
  - 하나님의 성전
  - 하나님의 성소
  rationale: 이 본문은 재건 시대의 예배 회복 문맥에 속하므로, 헬라어 ἱερόν의 범위를 좁히기보다 에스라 계열의 관용적 표현인 ‘하나님의 집’을 택하는 것이 원문의 의미와 전승을 더 잘 살립니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: ἐκ τῆς αἰχμαλωσίας의 뉘앙스를 ‘포로 생활’로 유지할지 여부
  chosen_reading: 포로 생활
  alternative_readings:
  - 포로 상태
  - 포로에서
  rationale: ‘포로’라는 사건성뿐 아니라 그 지속 상태를 드러내어, 귀환 공동체의 역사적·신학적 배경을 분명하게 전달합니다.
  doctrine_reference: Translation philosophy §2
