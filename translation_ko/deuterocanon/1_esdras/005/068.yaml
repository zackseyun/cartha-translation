base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/068.yaml
  text: For we alone will build for the Lord of Israel[a], in accordance with what Cyrus king of the Persians commanded us.
  footnotes:
  - marker: a
    text: Or, 'according to what Cyrus king of Persia commanded us.' The Greek reads 'king of the Persians,' while English may also express the title with the land-name.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 이스라엘의 주께[a]만 집을 지을 것이니, 페르시아 왕 고레스가 우리에게 명령한 대로입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘의 주님께’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς ... μόνοι
  english_pob_choice: we alone
  chosen_korean: 우리는 ...만
  alternatives_korean:
  - 우리는 홀로
  - 우리만
  lexicon: LSJ
  rationale: ἡμεῖς의 주어를 살리고 μόνοι의 배타성을 한국어 조사 ‘만’으로 간결하게 살렸습니다.
- source_word: οἰκοδομήσομεν
  english_pob_choice: will build
  chosen_korean: 집을 지을 것이니
  alternatives_korean:
  - 건축할 것이니
  - 세울 것이니
  lexicon: LSJ
  rationale: 성전 문맥이지만 동사 자체는 일반적인 ‘짓다/지다’가 자연스러워, 과도한 해석을 피하면서도 한국어로 유려하게 옮겼습니다.
- source_word: τῷ κυρίῳ τοῦ Ἰσραήλ
  english_pob_choice: for the Lord of Israel
  chosen_korean: 이스라엘의 주께
  alternatives_korean:
  - 이스라엘의 주님께
  - 이스라엘의 주를 위하여
  lexicon: LSJ
  rationale: τῷ κυρίῳ의 여격은 헌정/귀속의 뉘앙스를 살려 ‘-께’로 옮겼고, κύριος는 이 문맥의 신적 칭호로 ‘주’로 번역했습니다.
- source_word: ἀκολούθως οἷς προσέταξεν ἡμῖν
  english_pob_choice: in accordance with what ... commanded us
  chosen_korean: '...명령한 대로입니다'
  alternatives_korean:
  - '...명령하신 것에 따라입니다'
  - '...명령한 바에 따라입니다'
  lexicon: LSJ
  rationale: ἀκολούθως의 ‘일치/부합’ 의미를 한국어 관용인 ‘-대로’로 자연스럽게 재현했습니다.
theological_decisions:
- issue: κύριος를 ‘주’로 둘지 ‘주님’으로 둘지
  chosen_reading: ‘주’로 유지했습니다.
  alternative_readings:
  - 주님
  - 주인
  rationale: 본문은 이스라엘의 하나님을 가리키는 신적 칭호이므로 ‘주님’도 가능하지만, POB의 일관된 원어 대응과 문장 리듬을 위해 기본형 ‘주’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table, κύριος → Lord'
