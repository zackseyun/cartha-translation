  text: and from the tribe of Judah[a], who spoke wise words to Darius king of the Persians in the second year of his reign, in the month Nisan, the first month.
  footnotes:
  - marker: a
    text: Or 'in the presence of Darius' or 'to Darius'; the Greek phrase ἐπὶ Δαρείου can be understood in slightly different but closely related ways in this court context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 유다 지파 출신으로, 페르시아 왕 다리오의 통치 제이 년, 첫째 달인 니산월에 다리오 앞에서 지혜로운 말을 한 사람이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다리오에게’ 또는 ‘다리오가 있는 자리에서’로도 옮길 수 있습니다. 그리스어 ἐπὶ Δαρείου는 이 궁정 문맥에서 서로 매우 가까운 이러한 의미들 가운데 어느 하나로 이해될 수 있습니다.
    reason: alternative_reading
