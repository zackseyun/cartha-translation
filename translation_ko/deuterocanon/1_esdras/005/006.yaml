  rationale: 원문의 지파 소속 표현을 ‘출신’으로 유지하여 ‘나온’이 더하는 불필요한 의미를 피했습니다. 문장상 암시된 사람은 한국어의 완결된 문장을 위해 최소한으로 보완했습니다. 또한 현대적인 ‘페르시아 왕’을 사용하고, 날짜가 다리오의 통치 연도를 가리킴을 명확히 했으며, 중복되는 서술을 자연스럽게 다듬었습니다. ἐπὶ Δαρείου의 의미 범위는 본문과 각주에서 보존했습니다.
