  text: and from the tribe of Judah[a], who spoke wise words to Darius king of the Persians in the second year of his reign, in the month Nisan, the first month.
  footnotes:
  - marker: a
    text: Or 'in the presence of Darius' or 'to Darius'; the Greek phrase ἐπὶ Δαρείου can be understood in slightly different but closely related ways in this court context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 유다 지파에서 나온 자가 있었는데, 그는 바사 왕 다리오 앞에서 그의 치세 둘째 해, 니산 월, 곧 첫째 달에 지혜로운 말들을 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다리오에게’로도 옮길 수 있습니다. 그리스어 ἐπὶ Δαρείου는 궁정 문맥에서 약간 다른, 그러나 매우 가까운 의미로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: φυλῆς
  english_pob_choice: tribe
  chosen_korean: 지파
  alternatives_korean:
  - 부족
  - 종족
  lexicon: LSJ
  rationale: 유다의 집단적 혈통·민족 단위를 가리키므로 한국어 성경에서 자연스러운 ‘지파’를 사용했습니다.
- source_word: ἐπὶ Δαρείου
  english_pob_choice: before Darius
  chosen_korean: 다리오 앞에서
  alternatives_korean:
  - 다리오에게
  - 다리오의 앞에서
  - 다리오에게서
  lexicon: LSJ
  rationale: 궁정 맥락에서 ‘~앞에서’가 행위의 공개적 청중성을 가장 자연스럽게 드러내며, 출처의 모호성도 과장하지 않습니다.
- source_word: λόγους σοφοὺς
  english_pob_choice: wise words
  chosen_korean: 지혜로운 말들
  alternatives_korean:
  - 슬기로운 말들
  - 지혜의 말들
  lexicon: LSJ
  rationale: 복수형 λόγους를 살리면서도 내용의 성격을 분명히 하는 표현으로 ‘지혜로운 말들’을 택했습니다.
- source_word: τοῦ πρώτου μηνός
  english_pob_choice: the first month
  chosen_korean: 곧 첫째 달
  alternatives_korean:
  - 첫째 달
  - 첫 달
  lexicon: LSJ
  rationale: 니산이 첫째 달임을 설명하는 동격 구문이므로, 달력 체계를 독자가 즉시 이해하도록 ‘곧’으로 풀어 주었습니다.
theological_decisions:
- issue: 왕 앞에서의 발언 관계(ἐπὶ Δαρείου)
  chosen_reading: 공적 청중성은 살리되 특정한 법정 절차나 단순한 ‘~에게’로 단정하지 않고 ‘다리오 앞에서’로 옮겼습니다.
  alternative_readings:
  - 다리오에게
  - 다리오의 앞에서
  rationale: 그리스어 전치사 ἐπί + 속격은 이 문맥에서 발화의 상대를 분명히 하되, 정확한 관계는 약간의 여지를 남깁니다. 번역도 그 긴장을 유지하는 것이 적절합니다.
  doctrine_reference: '번역학적 주해: 문맥 우선, 과잉명시 금지'
