translation:
  language: ko
  text: 낙타 사백삼십오 마리, 말 칠천삼십육 마리, 노새 이백사십오 마리, 짐짐승[a] 오천오백이십오 마리입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ὑποζύγια는 특정 한 종이 아니라 짐을 싣거나 끄는 동물을 가리키는 넓은 말이므로, 여기서는 ‘짐짐승’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κάμηλοι
  english_pob_choice: camels
  chosen_korean: 낙타
  alternatives_korean:
  - 낙타들
  lexicon: LSJ
  rationale: 표준적이고 자연스러운 현대 한국어 대응은 ‘낙타’입니다. 수사와 함께 목록형으로 제시되므로 단수형 어휘를 유지했습니다.
- source_word: ἵπποι
  english_pob_choice: horses
  chosen_korean: 말
  alternatives_korean:
  - 말들
  lexicon: LSJ
  rationale: 가축 목록에서 ἵπποι는 일반적으로 ‘말’로 옮기는 것이 가장 직접적이고 자연스럽습니다.
- source_word: ἡμίονοι
  english_pob_choice: mules
  chosen_korean: 노새
  alternatives_korean:
  - 반노새
  - 노새들
  lexicon: LSJ
  rationale: ἡμίονοι는 노새를 뜻하므로, 한국어 관용 표현인 ‘노새’로 옮겼습니다.
- source_word: ὑποζύγια
  english_pob_choice: pack animals
  chosen_korean: 짐짐승
  alternatives_korean:
  - 짐승
  - 짐을 나르는 짐승
  - 짐동물
  lexicon: LSJ
  rationale: 영어 POB가 이 단어를 종(species)보다 넓은 부하 운반용 동물로 이해하므로, 한국어에서는 ‘짐짐승’으로 넓은 범주를 살렸습니다.
