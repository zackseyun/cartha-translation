translation:
  language: ko
  text: 요사닥의 아들 여호수아[b]와 그의 형제인 제사장들, 그리고 살라디엘[a]의 아들 스룹바벨과 그의 형제들이 일어나 이스라엘 하나님의 제단을 준비했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 Σαλαθιήλ입니다. 히브리어형 이름은 흔히 ‘스알디엘’로 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘여호수아’로 옮긴 이름은 그리스어에서 ‘예수’와 같은 형태이며, 문맥에 따라 ‘여호수아’ 또는 ‘예수’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰησοῦς
  english_pob_choice: Jeshua
  chosen_korean: 여호수아
  alternatives_korean:
  - 예슈아
  - 예수
  lexicon: LSJ
  rationale: 이 시기 인물명은 히브리어/아람어형 이름을 반영하는 인물로 이해되므로, 한국어에서는 고유명사 관용형인 여호수아를 택해 인물 식별을 분명하게 했습니다.
- source_word: καταστὰς
  english_pob_choice: arose
  chosen_korean: 일어나
  alternatives_korean:
  - 일어서
  - 일어나서
  - 들어서
  lexicon: LSJ
  rationale: 서사의 전개를 보이기 위한 분사적 동작을 한국어에서는 자연스러운 서술 동사 ‘일어나’로 옮겨, 준비 행동으로 이어지는 긴박한 흐름을 살렸습니다.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  english_pob_choice: his brothers
  chosen_korean: 그의 형제들
  alternatives_korean:
  - 그의 친족들
  - 그의 동료들
  - 그의 형제자매들
  lexicon: LSJ
  rationale: 원문이 남성형 친족 용어를 쓰므로 이를 그대로 살려 ‘형제들’로 번역했고, 제사장 문맥이지만 의미를 임의로 넓히지 않았습니다.
- source_word: ἡτοίμασαν τὸ θυσιαστήριον
  english_pob_choice: prepared the altar
  chosen_korean: 제단을 준비했습니다
  alternatives_korean:
  - 제단을 마련했습니다
  - 제단을 갖추었습니다
  - 제단을 세웠습니다
  lexicon: LSJ
  rationale: ἡτοίμασαν의 핵심 의미는 ‘준비하다’이므로 가장 직접적인 ‘준비했습니다’를 택했으며, ‘세웠습니다’는 구체적 설치를 덧붙일 수 있어 피했습니다.
theological_decisions:
- issue: 이름 표기에서 Ἰησοῦς의 역사적 인물 구분
  chosen_reading: 여호수아
  alternative_readings:
  - 예수
  - 예슈아
  rationale: 동일한 그리스어 형태라도 여기서는 포로기 이후 대제사장 인물을 가리키므로, 신약의 예수와 혼동되지 않도록 한국어 관용형 ‘여호수아’로 옮겼습니다.
  doctrine_reference: POB 이름형 구분 원칙
- issue: ‘제단을 준비하다’의 의미 범위
  chosen_reading: 예배용 제단을 사전에 갖추는 행위로 이해
  alternative_readings:
  - 제단을 단순히 청소하거나 정비하는 것
  - 제단을 새로 세우는 것
  rationale: 원문은 제단 자체를 대상으로 하는 준비 행위를 말하며, 여기서는 제사의 시작을 위한 실제 준비를 나타내는 것으로 읽는 것이 가장 무난합니다.
  doctrine_reference: 문맥 우선 번역 원칙
