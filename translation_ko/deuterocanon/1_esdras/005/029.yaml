base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/029.yaml
  text: 'the sons of Tobeis[a], altogether one hundred thirty-nine; the temple slaves: the sons of Esau, the sons of Taseipha, the sons of Tabaoth, the sons of Keras, the sons of Soua, the sons of Phalaiou, the sons of Labana[c][b],'
  footnotes:
  - marker: a
    text: Greek ἱερόδουλοι can also be rendered 'temple servants'; we use 'temple slaves' to preserve the bonded sense of the term.
    reason: lexical_alternative
  - marker: b
    text: The source text here is a list fragment ending with a comma; the next verse continues the roster of temple slaves.
    reason: cross_reference
  - marker: c
    text: The Hebrew parallel in Nehemiah 7:43 is not verbally parallel here; 1 Esdras presents a different section of the returnees list at this point.
    reason: alternative_reading
translation:
  language: ko
  text: 토베이스의 아들들은 모두 백삼십구 명이었습니다. 성전 노예들은 에서의 아들들, 타세이파의 아들들, 타바옷의 아들들, 케라스의 아들들, 수아의 아들들, 파라이우의 아들들, 라바나의 아들들이었습니다,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἱερόδουλοι는 ‘성전 노예들’로도, 완화하여 ‘성전 종들’로도 옮길 수 있지만, 여기서는 예속적 의미를 드러내기 위해 전자를 택했습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절은 다음 절로 이어지는 명단의 일부이며, 끝이 쉼표로 남아 있습니다.
    reason: source_note
