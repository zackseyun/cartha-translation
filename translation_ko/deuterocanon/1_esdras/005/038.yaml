revisions:
- from: 그리고 제사장들 가운데서 제사장 직분을 주장하던 자들이 있었으나, 발견되지 않았습니다. 곧 오벼아의 아들들, 악보스의 아들들, 그리고 야둣의 아들들인데, 이 야둣은 파엑셀다이의 딸들 가운데서 아우기아를 아내로 맞이한 사람입니다.[a][b]
  to: 제사장들 가운데에는 제사장 직분을 주장하였으나 발견되지 않은 이들이 있었습니다.[a] 곧 오베이아의 아들들, 악보스의 아들들, 그리고 파엑셀다이의 딸들 가운데서 아우기아를 아내로 맞이한 이아두스의 아들들이었습니다.[b]
  rationale: 원문의 생략된 ‘발견되지 않았다’를 유지하면서 관련 각주를 정확한 위치에 붙였습니다. 마지막 관계절은 이아두스에게 연결되도록 재구성하여, 세 가문의 병렬 목록과 그리스어의 수식 관계를 보존했습니다. 고유명사는 근사 병행 히브리어 본문에 맞추지 않고 그리스어 본문을 기준으로 음역했습니다.
