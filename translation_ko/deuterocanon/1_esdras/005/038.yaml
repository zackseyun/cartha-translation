base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/038.yaml
  text: 'And from the priests[a], those who claimed the priesthood, but were not found: the sons of Obbeia, the sons of Akbos, the sons of Iaddous, who had taken Augia as a wife from the daughters of Phaexeldai[b],'
  footnotes:
  - marker: a
    text: 'The Greek is elliptical: ''were not found'' likely means their genealogical record or priestly registration was not found, as in the Ezra parallel.'
    reason: lexical_alternative
  - marker: b
    text: The proper names here differ from the approximate MT parallel; this translation follows the Greek text of 1 Esdras rather than harmonizing to Ezra/Nehemiah.
    reason: textual_variant
translation:
  language: ko
  text: 제사장들 가운데에는 제사장 직분을 주장하였으나 발견되지 않은 이들이 있었습니다.[a] 곧 오베이아의 아들들, 악보스의 아들들, 그리고 파엑셀다이의 딸들 가운데서 아우기아를 아내로 맞이한 이아두스의 아들들이었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘발견되지 않았다’라고만 하여, 그들이 제사장 명부나 족보 기록에서 확인되지 않았다는 뜻을 암시합니다.
    reason: lexical_alternative
  - marker: b
    text: 여기 나오는 고유명사들은 히브리어 병행구와 정확히 일치하지 않으므로, 본문은 1 에스드라스의 그리스어 증거를 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν ἱερέων
  english_pob_choice: from the priests
  chosen_korean: 제사장들 가운데서
  alternatives_korean:
  - 제사장들 중에서
  - 제사장들로부터
  lexicon: LSJ
  rationale: ἐκ + 속격은 여기서 집단 안의 범위를 나타내므로, 한국어에서는 자연스럽게 ‘제사장들 가운데서’로 옮기면 됩니다.
- source_word: οἱ ἐμποιούμενοι ἱερωσύνης
  english_pob_choice: those who claimed the priesthood
  chosen_korean: 제사장 직분을 주장하던 자들
  alternatives_korean:
  - 제사장 직분을 내세우던 자들
  - 제사장 직분을 자처하던 자들
  lexicon: LSJ
  rationale: 문맥상 혈통상 자격을 주장하는 뉘앙스이므로 단순한 직무 수행이 아니라 ‘주장하다’로 옮기는 것이 적절합니다.
- source_word: οὐχ εὑρέθησαν
  english_pob_choice: were not found
  chosen_korean: 발견되지 않았습니다
  alternatives_korean:
  - 찾을 수 없었습니다
  - 기록에서 확인되지 않았습니다
  lexicon: LSJ
  rationale: 그리스어는 직접적으로 대상이 생략된 수동 표현이므로, 한국어는 너무 풀이하지 않되 문맥상 명단/기록의 부재를 암시할 수 있는 중립적 표현으로 처리했습니다.
- source_word: υἱοὶ Ὀββειά / Ἀκβώς / Ἰαδδοὺς
  english_pob_choice: the sons of Obbeia / the sons of Akbos / the sons of Iaddous
  chosen_korean: 오벼아의 아들들 / 악보스의 아들들 / 야둣의 아들들
  alternatives_korean:
  - 오벼야의 아들들 / 악보스의 아들들 / 이앗두스의 아들들
  - 오베아의 자손들 / 악보스의 자손들 / 야두스의 자손들
  lexicon: SBLGNT/Greek proper-name transliteration
  rationale: 이 절은 그리스어 증거를 따르는 이름 목록이므로, 히브리어 병행구와 조화시키지 않고 그리스어 형태를 기준으로 음역했습니다.
- source_word: τοῦ λαβόντος Αὐγίαν γυναῖκα
  english_pob_choice: who had taken Augia as a wife
  chosen_korean: 아우기아를 아내로 맞이한
  alternatives_korean:
  - 아우기아와 결혼한
  - 아우기아를 아내로 취한
  lexicon: LSJ
  rationale: λαμβάνω + γυναῖκα는 결혼/아내로 맞아들임의 관용구이므로, 의미는 살리되 지나치게 현대적이지 않은 표현으로 옮겼습니다.
- source_word: τῶν θυγατέρων Φαηξελδαίου
  english_pob_choice: from the daughters of Phaexeldai
  chosen_korean: 파엑셀다이의 딸들 가운데서
  alternatives_korean:
  - 파엑셀다이의 딸들 중에서
  - 파엑셀다이의 딸들로부터
  lexicon: Greek proper-name transliteration
  rationale: 출신 집단을 나타내는 구조이므로 ‘가운데서’로 자연스럽게 처리했고, 고유명사는 그리스어 음역을 따랐습니다.
theological_decisions:
- issue: 사제 자격의 부재를 어떻게 드러낼지
  chosen_reading: ‘제사장 직분을 주장하던 자들’과 ‘발견되지 않았습니다’를 함께 살려, 혈통적·공적 자격이 확인되지 않았다는 긴장을 드러냈습니다.
  alternative_readings:
  - ‘제사장이라 자처하던 자들’로 약화
  - ‘기록이 없었습니다’로 명시적으로 풀어쓰기
  rationale: 본문은 단순한 직함 문제가 아니라 정당한 제사장 자격의 결여를 말하므로, 주장과 부재를 둘 다 보존하는 쪽이 원문에 충실합니다.
  doctrine_reference: 에스라-느헤미야 계열의 족보/성전 봉사 자격 논점
- issue: ‘이 야둣은…’의 관계절 처리
  chosen_reading: 인명 목록 뒤에 관계절을 붙여 야둣이 아우기아를 아내로 맞이한 인물임을 분명히 했습니다.
  alternative_readings:
  - 관계절을 분리해 쉼표만으로 연결
  - 인물 설명을 뒤로 돌려 재배열
  rationale: 그리스어 구조를 따라 마지막 인물의 수식 관계를 유지해야 목록과 설명의 연결이 흐트러지지 않습니다.
  doctrine_reference: 본문 구조 보존 원칙
