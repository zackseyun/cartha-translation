  source_fidelity: 그리스어의 핵심 구조, 곧 제사장 직분을 주장하였으나 ‘발견되지 않은’ 집단과 세 가문의 열거는 대체로 반영되었습니다. 다만 ‘이 야둣은’이라는 독립 설명은 원문의 관계절을 다소 풀어 쓰며, 고유명사 음역도 그리스어 형태에 더 가깝게 정비하는 편이 안전합니다. ‘발견되지 않았다’의 생략된 목적어는 본문에서 보충하지 않는 것이 적절합니다.
