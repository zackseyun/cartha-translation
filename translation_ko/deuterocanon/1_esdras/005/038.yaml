    rationale: τοῦ λαβόντος는 ‘야두스의 아들들’을 이루는 야두스를 수식합니다. 한국어에서는 ‘…아우기아를 아내로 맞이한 야두스의 아들들’로 연결하면 원문의 목록 구조와 수식 관계를 더 충실히 보존합니다.
