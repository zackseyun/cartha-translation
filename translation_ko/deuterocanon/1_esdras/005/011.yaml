  lexicon: LSJ
  rationale: 그리스어 형태를 따르되, Ἰησοῦ는 후기 성서 족보 문맥에서 통상 인명 표기인 ‘예수’로 옮기고, Ῥοβοάβ는 그리스어 자음을 반영해 ‘로바압’으로 음역했습니다.
