base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/011.yaml
  text: The sons of Phath-moab[a], of the sons of Jeshua and Joab[b], two thousand eight hundred and two.
  footnotes:
  - marker: a
    text: Greek Phthalemoab; the Hebrew-parallel tradition commonly has Pahath-moab.
    reason: alternative_reading
  - marker: b
    text: Greek reads 'Jeshua and Roboab'; the parallel list in Ezra/Nehemiah is commonly aligned with 'Jeshua and Joab.' Because 1 Esdras often reorders or reshapes its source material, the Greek form is significant even where the parallel tradition differs.
    reason: textual_variant
translation:
  language: ko
  text: 프탈레모압[a]의 자손, 예수아와 로보압[b]의 자손에 속한 이들은 이천팔백이 명입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘프탈레모압’(Φθαλεμωάβ)으로 읽습니다. 히브리어 병행 전승에서는 흔히 ‘파핫-모압’으로 읽습니다.
    reason: textual_variant
  - marker: b
    text: 그리스어는 ‘예수아와 로보압’(Ἰησοῦ καὶ Ῥοβοάβ)으로 읽습니다. 에스라·느헤미야의 병행 목록은 흔히 ‘예수아와 요압’에 대응하는 것으로 이해됩니다. 그러나 1에스드라스는 병행 전승을 재배열하거나 변형하기도 하므로, 여기서는 그리스어 형태를 본문에 보존합니다.
    reason: textual_variant
