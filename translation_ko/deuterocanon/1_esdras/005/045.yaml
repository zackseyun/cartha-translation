base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/045.yaml
  text: And the priests and the Levites and some of the people settled in Jerusalem and the region[a], and the temple singers and the gatekeepers, and all Israel in their villages.
  footnotes:
  - marker: a
    text: Or 'those from the people.' The Greek phrase is literally 'those from his people,' likely distinguishing the non-priestly members of the community.
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장들과 레위인들과 백성 가운데 일부[a]는 예루살렘과 그 지역에 정착하였으며, 성전에서 노래하는 이들과 문지기들과 온 이스라엘은 각자의 마을에 정착하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 백성 중에서 나온 이들’. 그리스어는 문자적으로 ‘그의 백성 중에서 나온 이들’이라고 합니다. 여기서는 제사장들과 레위인들에 대비되는 공동체 구성원을 가리킬 가능성이 있습니다.
    reason: lexical_alternative
