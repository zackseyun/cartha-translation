base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/045.yaml
  text: And the priests and the Levites and some of the people settled in Jerusalem and the region[a], and the temple singers and the gatekeepers, and all Israel in their villages.
  footnotes:
  - marker: a
    text: Or 'those from the people.' The Greek phrase is literally 'those from his people,' likely distinguishing the non-priestly members of the community.
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장들과 레위인들과 백성 가운데 일부는 예루살렘과 그 지역에 정착하였고[a], 성전 노래하는 이들과 문지기들과 온 이스라엘은 자기들의 마을에 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 백성 가운데서 나온 이들’. 그리스어는 문자적으로 ‘그의 백성 가운데서 나온 이들’이며, 여기서는 비제사장·비레위인 공동체 성원을 구별하는 말로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατῳκίσθησαν
  english_pob_choice: settled
  chosen_korean: 정착하였고
  alternatives_korean:
  - 살게 되었고
  - 거주하게 되었고
  - 자리를 잡았고
  lexicon: BDAG
  rationale: 거주의 상태가 확립되었음을 자연스럽게 드러내되, 수동형의 뉘앙스를 무리 없이 살릴 수 있습니다.
- source_word: οἱ ἐκ τοῦ λαοῦ αὐτοῦ
  english_pob_choice: some of the people
  chosen_korean: 백성 가운데 일부
  alternatives_korean:
  - 그의 백성 가운데서 나온 이들
  - 백성 중 일부
  - 그 백성 가운데서 나온 사람들
  lexicon: BDAG
  rationale: 직역의 어색함을 줄이면서도, 제사장·레위인과 구별되는 비제의적 공동체 구성원이라는 뜻을 보존합니다.
- source_word: ἐν Ἰερουσαλὴμ καὶ τῇ χώρᾳ
  english_pob_choice: in Jerusalem and the region
  chosen_korean: 예루살렘과 그 지역
  alternatives_korean:
  - 예루살렘과 그 주변 지역
  - 예루살렘과 그 지방
  - 예루살렘과 그 땅
  lexicon: BDAG
  rationale: χώρᾳ의 지리적 범위를 과장하지 않으면서, 예루살렘에 대비되는 넓은 거주 구역을 간결하게 옮겼습니다.
- source_word: οἵ τε ἱεροψάλται καὶ οἱ θυρωροὶ
  english_pob_choice: the temple singers and the gatekeepers
  chosen_korean: 성전 노래하는 이들과 문지기들
  alternatives_korean:
  - 성전 찬양하는 이들과 문지기들
  - 성전 성가대와 문지기들
  - 성전 가객들과 문지기들
  lexicon: LSJ
  rationale: ἱεροψάλται는 단순한 ‘노래하는 이들’보다 성전 예배와 연결된 직무를 가리키므로, 의미를 드러내는 방향으로 옮겼습니다.
- source_word: πᾶς Ἰσραήλ
  english_pob_choice: all Israel
  chosen_korean: 온 이스라엘
  alternatives_korean:
  - 온 이스라엘 백성
  - 모든 이스라엘
  - 이스라엘 전체
  lexicon: BDAG
  rationale: 공동체 전체를 가리키는 관용적 표현으로 이해하여, 수학적 총합보다 회복된 언약 공동체의 포괄성을 살렸습니다.
theological_decisions:
- issue: πᾶς Ἰσραήλ의 범위
  chosen_reading: ‘온 이스라엘’을 공동체적 총칭으로 옮겼습니다.
  alternative_readings:
  - 모든 이스라엘 사람 개개인을 가리키는 것으로 읽기
  - 후대적 민족 전체 개념으로 넓혀 읽기
  rationale: 문맥이 정착된 집단들의 분포를 요약하므로, 각 개인의 전수보다는 회복된 백성 전체를 가리키는 집합적 용법이 더 적절합니다.
  doctrine_reference: 문맥 우선의 공동체적 읽기; 수량적 과잉해석을 피함
