base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/052.yaml
  text: And all who had vowed a vow to God began[a], from the new moon of the first month, to offer sacrifices to God[b], though the temple of God had not yet been built.
  footnotes:
  - marker: a
    text: Or, more literally, 'and the temple of God was not yet built.' The English main text uses 'though' to bring out the likely concessive sense of the Greek coordination.
    reason: lexical_alternative
  - marker: b
    text: The parallel Hebrew text in Ezra differs here, speaking of the Feast of Booths and the prescribed daily burnt offerings. 1 Esdras preserves a distinct Greek wording, which is followed in the main text.
    reason: cross_reference
translation:
  language: ko
  text: 하나님께 서원을 한 모든 사람은 첫째 달의 초하루부터 하나님께 제사를 드리기 시작했습니다. 그러나 하나님의 성전은 아직 지어지지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 단순히 ‘그리고’로 연결하지만, 문맥상 뒤절은 양보적 의미를 띱니다.
    reason: theological_note
lexical_decisions:
- source_word: ὅσοι
  english_pob_choice: all who
  chosen_korean: 모든 사람은
  alternatives_korean:
  - 그런 이들은
  - 서원한 모든 사람은
  lexicon: LSJ
  rationale: 포괄적 대상을 자연스러운 한국어로 살리되, 문맥상 서원한 무리를 가리키므로 앞말에서 이미 한정된 대상을 이어 받게 했습니다.
- source_word: εὔξαντο εὐχήν
  english_pob_choice: had vowed a vow
  chosen_korean: 서원을 한
  alternatives_korean:
  - 서원을 드린
  - 맹세를 한
  lexicon: LSJ
  rationale: 동사-명사 중복 구조가 서원의 행위를 강조하므로, 한국어에서도 간단히 '서원을 한'으로 옮겨 중복의 힘을 유지했습니다.
- source_word: ἀπὸ τῆς νουμηνίας τοῦ πρώτου μηνός
  english_pob_choice: from the new moon of the first month
  chosen_korean: 첫째 달의 초하루부터
  alternatives_korean:
  - 첫째 달의 새달부터
  - 첫째 달의 초하루로부터
  lexicon: LSJ
  rationale: νουμηνία는 달의 초하루를 가리키는 달력 용어이므로, 예배 달력의 시작점을 드러내는 '초하루'를 택했습니다.
- source_word: θυσίας τῷ θεῷ
  english_pob_choice: sacrifices to God
  chosen_korean: 하나님께 제사를
  alternatives_korean:
  - 하나님께 희생제물을
  - 하나님께 희생을
  lexicon: LSJ
  rationale: θυσία는 단순한 헌물보다 제의적 제사를 가리키므로, 본문의 예배적 의미를 살려 '제사'로 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 καί 절 관계
  chosen_reading: 한국어에서는 '그러나'로 옮겨, 제사가 시작되었지만 성전은 아직 없었다는 대조를 분명히 했습니다.
  alternative_readings:
  - 그리고 하나님의 성전은 아직 지어지지 않았습니다.
  - 비록 하나님의 성전은 아직 지어지지 않았습니다.
  rationale: 그리스어는 καί로 단순 연결하지만, 문맥상 제의 재개와 성전 미건립 사이의 긴장이 핵심이므로 한국어에서 대조를 드러내는 편이 의미를 더 정확히 전달합니다.
  doctrine_reference: Translation philosophy §1, §6
