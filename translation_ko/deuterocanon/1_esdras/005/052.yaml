  source_fidelity: 그리스어의 핵심 요소를 충실히 반영합니다. εὔξαντο εὐχήν은 ‘서원을 한’, ἀπὸ τῆς νουμηνίας τοῦ πρώτου μηνός는 ‘첫째 달의 초하루부터’, ἤρξαντο προσφέρειν θυσίας는 ‘제사를 드리기 시작했습니다’로 적절합니다. 마지막 καί절은 문맥상 드러나는 대조·양보의 관계를 ‘그러나’로 자연스럽게 표현했으며, 성전이 ‘아직 지어지지’ 않았다는 진술도 보존합니다.
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽고 공적 성경 문체에 맞습니다. ‘첫째 달의 초하루’와 ‘하나님의 성전’도 문맥상 명료합니다.
  terminology: ‘하나님’, ‘서원’, ‘제사’, ‘성전’은 일관되고 적절한 성경 번역 용어입니다. ‘지어지지 않았습니다’는 원문의 단순한 ‘건축되다’를 ‘재건되다’로 과도하게 한정하지 않습니다.
