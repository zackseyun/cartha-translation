base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/044.yaml
  text: and to give to the holy treasury for the works one thousand minas of gold[a], and five thousand minas of silver[b], and one hundred priestly garments.
  footnotes:
  - marker: a
    text: Or 'the temple treasury.' The Greek phrase literally combines 'holy' and 'treasury/storehouse.'
    reason: lexical_alternative
  - marker: b
    text: A mina was an ancient unit of weight and, by extension, value; the translation preserves the ancient term rather than converting it into a modern equivalent.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 거룩한 보물창고 곧 그 일들을 위하여 금 천 므나와 은 오천 므나와 제사장 예복 백 벌을 드리게 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἱερὸν γαζοφυλάκιον은 문자적으로 ‘거룩한 보물창고’이지만, 문맥상 ‘성전 금고’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: μνᾶ는 고대의 중량·가치 단위이므로, 현대 화폐 단위로 환산하지 않고 음역을 유지했습니다.
    reason: cultural_note
lexical_decisions:
- source_word: καὶ δοῦναι
  english_pob_choice: to give
  chosen_korean: 드리게 하였습니다
  alternatives_korean:
  - 주게 하였습니다
  - 바치게 하였습니다
  lexicon: LSJ
  rationale: 동사 δοῦναι의 기본 의미를 따라 ‘주다’로 옮기되, 성전 봉헌 맥락을 살려 공손하고 헌납적 뉘앙스가 있는 ‘드리다’를 선택했습니다.
- source_word: ἱερὸν γαζοφυλάκιον
  english_pob_choice: the holy treasury
  chosen_korean: 거룩한 보물창고
  alternatives_korean:
  - 성전 금고
  - 거룩한 خز창고
  lexicon: LSJ
  rationale: ἱερόν과 γαζοφυλάκιον의 결합을 반영해 ‘거룩한’과 ‘보물창고’를 함께 살렸습니다. 영어 POB의 ‘holy treasury’를 따르되, 한국어에서는 ‘창고’보다 재물 보관처를 분명히 하는 ‘보물창고’가 더 투명합니다.
- source_word: μνᾶς χιλίας / μνᾶς πεντακισχιλίας
  english_pob_choice: one thousand minas / five thousand minas
  chosen_korean: 천 므나 / 오천 므나
  alternatives_korean:
  - 일천 므나 / 오천 므나
  - 천 마나 / 오천 마나
  lexicon: LSJ
  rationale: μνᾶ는 고대의 중량·가치 단위이므로 현대 단위로 환산하지 않고 음역 ‘므나’를 유지했습니다. 수사는 한국어 자연성을 위해 ‘천, 오천’으로 옮겼습니다.
- source_word: στολὰς ἱερατικὰς
  english_pob_choice: priestly garments
  chosen_korean: 제사장 예복
  alternatives_korean:
  - 제사장 옷
  - 제사장 의복
  lexicon: LSJ
  rationale: στολή의 기본 의미는 ‘옷/의복’이지만, ἱερατικά가 제사장 용도의 예복임을 분명히 하므로 ‘예복’이 가장 간결하고 기능적으로 정확합니다.
- source_word: ἑκατόν
  english_pob_choice: one hundred
  chosen_korean: 백 벌
  alternatives_korean:
  - 백 개
  - 백
  lexicon: LSJ
  rationale: 뒤의 명사 ‘제사장 예복’을 한국어에서 자연스럽게 반복하지 않기 위해 수량을 실질적으로 받는 단위인 ‘벌’을 보완해 이해를 돕되, 원문의 수량 정보는 그대로 유지했습니다.
theological_decisions:
- issue: 성전 재정의 성격을 어떻게 드러낼지
  chosen_reading: ‘거룩한 보물창고’와 ‘드리게 하였습니다’로 성전 헌납의 성격을 분명히 했습니다.
  alternative_readings:
  - ‘성전 금고에 주게 하였습니다’
  - ‘성소 창고에 바치게 하였습니다’
  rationale: 본문은 단순한 재무 기록이 아니라 성전 관련 헌납 목록이므로, 기능적 중립어보다 성소적·봉헌적 뉘앙스를 살리는 표현이 원문 의도에 더 가깝습니다.
  doctrine_reference: 성전 제의 및 봉헌 관련 본문 이해
