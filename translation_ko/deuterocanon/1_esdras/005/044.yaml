  - severity: medium
    issue: ‘보물창고 곧 그 일들을 위하여’가 τῶν ἔργων의 문법적 관계를 부정확하게 처리합니다.
    rationale: τῶν ἔργων은 헌납의 용도, 즉 공사/작업을 위한 것임을 나타냅니다. ‘곧’은 보물 창고와 일을 동격처럼 연결합니다.
  - severity: low
    issue: ‘제사장 예복’은 στολάς의 의미 범위를 다소 좁힙니다.
    rationale: στολή는 예복일 수 있으나 일반적으로 의복/옷을 뜻할 수도 있습니다. ‘제사장 의복’이 원문의 넓이를 더 잘 보존합니다.
