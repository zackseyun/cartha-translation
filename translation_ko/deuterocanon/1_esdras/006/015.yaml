lexical_decisions:
- source_word: οἶκον
  english_pob_choice: the house
  chosen_korean: 그 집
  alternatives_korean:
  - 성전
  - 건물
  lexicon: BDAG
  rationale: 그리스어가 직접적으로는 οἶκος(집)를 쓰므로, 본문에서는 ‘집’을 살리고 문맥상 성전임은 각주로 밝히는 편이 원문과 주해 정보를 함께 보존합니다.
- source_word: καθελόντες
  english_pob_choice: tore down
  chosen_korean: 헐어버리고
  alternatives_korean:
  - 무너뜨리고
  - 헐고
  lexicon: BDAG
  rationale: 완결된 파괴 행위를 자연스럽게 드러내는 현대 한국어로 ‘헐어버리고’를 택했습니다.
- source_word: ᾐχμαλώτευσαν
  english_pob_choice: they took captive
  chosen_korean: 사로잡아 갔습니다
  alternatives_korean:
  - 포로로 잡아 갔습니다
  - 사로잡았습니다
  lexicon: BDAG
  rationale: ‘붙잡다’보다 더 강하게 포로로 끌고 가는 뉘앙스를 살리면서도 한국어 서술 흐름에 맞게 옮겼습니다.
theological_decisions:
- issue: ‘그 집’의 지시 대상
  chosen_reading: 본문은 ‘집’을 유지하되, 의미상 성전임을 각주로 분명히 했습니다.
  alternative_readings:
  - 성전
  - 하나님의 집
  rationale: 그리스어는 οἶκον을 사용하므로 본문에서 곧바로 ‘성전’으로 바꾸면 원문의 표현을 약화시킬 수 있습니다. 다만 역사적 문맥상 독자는 성전을 이해해야 하므로 각주로 보완합니다.
  doctrine_reference: Translation philosophy §1, §5
