    reason: cross_reference
translation:
  language: ko
  text: 고레스가 바벨론 땅을 다스리던 첫해에, 고레스 왕이 이 집을 건축하라고 썼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이 집’은 예루살렘 성전을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν δὲ τῷ πρώτῳ ἔτει
  english_pob_choice: Now in the first year
  chosen_korean: 바벨론 땅을 다스리던 고레스의 첫해에
  alternatives_korean:
  - 그리고 고레스의 첫해에
  - 고레스의 첫해에
  lexicon: LSJ
  rationale: 시간 부사구와 가벼운 접속 관계를 자연스러운 서술 도입으로 옮겼습니다.
- source_word: βασιλεύοντος Κύρου
  english_pob_choice: of Cyrus reigning
  chosen_korean: 고레스의 첫해에
  alternatives_korean:
  - 고레스가 다스릴 때
  - 고레스가 통치하던 때
  lexicon: LSJ
  rationale: 분사구는 통치 중이라는 배경을 표시하므로, 한국어에서는 소유격식보다 시간 배경을 드러내는 표현이 자연스럽습니다.
- source_word: χώρας Βαβυλωνίας
  english_pob_choice: over the land of Babylonia
  chosen_korean: 바벨론 땅을
  alternatives_korean:
  - 바빌로니아 땅을
  - 바벨론 나라를
  lexicon: LSJ
  rationale: χώρα는 도시 바벨론이 아니라 영토/땅을 가리키므로, ‘땅’을 유지해 지리적 범위를 살렸습니다.
- source_word: ἔγραψεν … οἰκοδομῆσαι
  english_pob_choice: wrote to build
  chosen_korean: 이 집을 건축하라고 기록했습니다
  alternatives_korean:
  - 이 집을 짓도록 기록했습니다
  - 이 집을 건축하라고 명령했습니다
  lexicon: LSJ
  rationale: ἔγραψεν의 문자적 의미를 살리되, 행정 문맥상 왕의 서면 지시라는 기능이 드러나도록 ‘건축하라고’로 옮겼습니다.
- source_word: τὸν οἶκον τοῦτον
  english_pob_choice: this house
  chosen_korean: 이 집
  alternatives_korean:
  - 이 성전
  - 그 집
  lexicon: LSJ
  rationale: οἶκος의 기본 의미인 ‘집’을 유지해 원문 어휘를 보존했고, 본문 문맥상 성전임은 독자가 알 수 있습니다.
theological_decisions:
- issue: 왕의 행위 성격
  chosen_reading: ‘기록했습니다’로 옮겨, 단순히 말한 것이 아니라 서면의 왕령이라는 점을 드러냈습니다.
  alternative_readings:
  - 명령했습니다
  - 조서를 내렸습니다
  rationale: 그리스어는 ἔγραψεν(썼다)이라고 말하므로, 문맥상 권위를 살리면서도 ‘조서’ 같은 더 강한 행정용어는 본문에 없는 요소를 덧붙일 수 있어 피했습니다.
  doctrine_reference: Translation philosophy §1
