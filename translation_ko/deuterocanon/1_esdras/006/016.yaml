base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/016.yaml
  text: Now in the first year of Cyrus reigning over the land of Babylonia, King Cyrus wrote that this house should be built,
  footnotes:
  - marker: a
    text: Or, 'King Cyrus issued a decree that this house be built.' The Greek literally says 'wrote ... to build this house,' which in context refers to a royal written order.
    reason: lexical_alternative
