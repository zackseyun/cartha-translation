base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/005.yaml
  text: And the elders of the Jews found favor from the Lord[a], having come to oversee the captivity.
  footnotes:
  - marker: a
    text: Or 'having been appointed over the exiles.' The Greek phrase is compressed and may describe the elders as taking up oversight in relation to the returned community.
