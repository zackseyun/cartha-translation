base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/005.yaml
  text: And the elders of the Jews found favor from the Lord[a], having come to oversee the captivity.
  footnotes:
  - marker: a
    text: Or 'having been appointed over the exiles.' The Greek phrase is compressed and may describe the elders as taking up oversight in relation to the returned community.
    reason: alternative_reading
translation:
  language: ko
  text: 유다 사람들의 장로들은 포로 상태 위에 세워져 주님께서 주신 호의를 얻었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘포로들 위에 임명되어 감독하도록.’ 그리스어 표현은 압축되어 있어, 장로들이 돌아온 공동체와 관련된 관리 책임을 맡게 되었다는 뜻일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔσχον χάριν
  english_pob_choice: found favor
  chosen_korean: 호의를 얻었습니다
  alternatives_korean:
  - 은혜를 얻었습니다
  - 은총을 입었습니다
  - 호감을 얻었습니다
  lexicon: BDAG
  rationale: ἔχειν/ἔσχειν χάριν은 문맥상 ‘호의를 얻다’의 관용적 의미가 가장 자연스럽고, 추상적인 ‘은혜’보다 행정적·서사적 맥락을 더 잘 살립니다.
- source_word: ἐπισκοπῆς
  english_pob_choice: to oversee
  chosen_korean: 위에 세워져
  alternatives_korean:
  - 감독하도록
  - 살피도록
  - 감독의 직분으로
  lexicon: LSJ
  rationale: ἐπισκοπή는 ‘감독, 돌봄, 관리’의 뜻이 있어, 여기서는 장로들이 어떤 관리/감독의 책임 위에 놓였다는 기능을 드러내는 표현으로 옮겼습니다.
- source_word: γενόμενοι ἐπὶ τὴν αἰχμαλωσίαν
  english_pob_choice: having come to oversee the captivity
  chosen_korean: 포로 상태 위에 세워져
  alternatives_korean:
  - 포로들 위에 임명되어
  - 포로 상태를 맡게 되어
  - 포로 생활을 감독하게 되어
  lexicon: LSJ
  rationale: γενόμενοι ἐπί + 대격은 단순한 ‘도착’보다 어떤 지위나 역할에 들어감을 나타낼 수 있으므로, ‘세워져’로 그 취임/부임의 뉘앙스를 살렸습니다.
- source_word: παρὰ τοῦ κυρίου
  english_pob_choice: from the Lord
  chosen_korean: 주님께서 주신
  alternatives_korean:
  - 주님으로부터
  - 주님에게서
  - 주님께로부터 주어진
  lexicon: BDAG
  rationale: παρά + 속격의 출처 의미를 반영하면서, 호의의 근원이 주님임을 한국어에서 자연스럽게 드러내는 표현으로 정리했습니다.
- source_word: οἱ πρεσβύτεροι τῶν Ἰουδαίων
  english_pob_choice: the elders of the Jews
  chosen_korean: 유다 사람들의 장로들
  alternatives_korean:
  - 유대인들의 장로들
  - 유다의 장로들
  - 유대 사람들의 장로들
  lexicon: BDAG
  rationale: Ἰουδαῖοι는 이 시기 문맥에서 ‘유다 사람들/유대인들’로 옮길 수 있으나, 여기서는 집단 소속을 드러내면서도 지명적·민족적 색채를 함께 살리는 ‘유다 사람들’을 택했습니다.
theological_decisions:
- issue: κύριος의 번역
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 야훼
  rationale: 본문의 그리스어가 κύριος이므로 기본값인 ‘주님’을 유지했습니다. 이 구절은 직접적인 LXX 인용 표지가 없으므로 본문에서는 인용형 ‘야훼’로 바꾸지 않았습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → 주님'
- issue: αἰχμαλωσία의 의미 범위
  chosen_reading: 포로 상태
  alternative_readings:
  - 포로들
  - 포로 생활
  - 유배
  rationale: αἰχμαλωσία는 문자적으로 포로됨/포로 상태를 뜻하며, 여기서는 대상 집단을 지나치게 풀어 쓰기보다 상태 자체를 드러내는 쪽이 원문 긴장을 더 잘 보존합니다.
  doctrine_reference: 'Translation philosophy: preserve source ambiguity rather than over-resolve'
