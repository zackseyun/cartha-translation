translation:
  language: ko
  text: 그때 산아바사르가 와서 예루살렘에 있는 주님의 집의 기초를 놓았고, 그때부터 지금까지 그것이 지어지고 있으나 아직 완공되지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 산아바사르는 에스라 전승의 세스바살과 동일 인물로 흔히 이해됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Σαναβάσσαρος
  english_pob_choice: Sanabassar
  chosen_korean: 산아바사르
  alternatives_korean:
  - 세스바살
  - 세스바스살
  lexicon: LSJ
  rationale: 그리스어 음역형 Σαναβάσσαρος를 직접 따라 음역했습니다. 히브리/아람어 계열 전승의 인물과 동일시될 수 있지만, 본문은 그리스어 형태를 우선해야 하므로 한국어도 이를 반영했습니다.
- source_word: εἰσεβάλλετο τοὺς θεμελίους
  english_pob_choice: laid the foundations
  chosen_korean: 기초를 놓았고
  alternatives_korean:
  - 터를 닦았고
  - 기초석을 놓았고
  - 주춧돌을 놓았고
  lexicon: LSJ
  rationale: 문맥상 건축의 시작을 뜻하므로 자연스러운 현대 한국어로 '기초를 놓다'를 택했습니다. '주춧돌'은 더 구체적이지만 원문의 일반적 '기초들'보다 좁습니다.
- source_word: τοῦ οἴκου Κυρίου
  english_pob_choice: of the house of the Lord
  chosen_korean: 주님의 집
  alternatives_korean:
  - 주님의 성전
  - 주의 집
  - 주님의 집
  lexicon: LSJ
  rationale: 그리스어의 관용구를 비교적 직접적으로 살리면서도 한국어로 자연스럽게 옮겼습니다. '성전'은 해석을 더 강하게 반영하므로 여기서는 '집'을 유지했습니다.
- source_word: ἀπ᾽ ἐκείνου μέχρι τοῦ νῦν
  english_pob_choice: from that time until now
  chosen_korean: 그때부터 지금까지
  alternatives_korean:
  - 그때로부터 현재까지
  - 그 후 지금까지
  lexicon: BDAG
  rationale: 시간의 연속성을 간결하게 드러내는 표준 표현으로 옮겼습니다. 원문의 시작점-종착점 구조를 그대로 보존합니다.
- source_word: οἰκοδομουμένου ... οὐκ ἔλαβεν συντέλειαν
  english_pob_choice: it has been under construction and has not reached completion
  chosen_korean: 지어지고 있으나 아직 완공되지 않았습니다
  alternatives_korean:
  - 건축되고 있으나 아직 끝나지 않았습니다
  - 세워지고 있으나 아직 마치지 못했습니다
  lexicon: BDAG
  rationale: 현재까지 지속되는 진행과 미완성 상태를 현대 한국어로 자연스럽게 표현했습니다. '완공'은 결과적 완성의 의미를 잘 담습니다.
theological_decisions:
- issue: Κυρίου의 한국어 처리와 주어 없는 건축 문맥
  chosen_reading: 주님의 집
  alternative_readings:
  - 야훼의 집
  - 주(主)의 집
  rationale: 본문은 그리스어 Κυρίου를 따르므로 기본값 '주님'을 유지했습니다. 이 구절은 직접적인 신명 표기가 아니라 건축 대상의 소유 관계를 말하므로, 문맥상 자연스러운 '주님의 집'으로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: κύριος → 주님; 번역은 그리스어 본문 우선'
- issue: 시제와 완료성의 표현
  chosen_reading: 지어지고 있으나 아직 완공되지 않았습니다
  alternative_readings:
  - 지금까지도 건축 중이며 아직 완성되지 않았습니다
  - 계속 지어지고 있으나 아직 끝나지 않았습니다
  rationale: 현재까지 이어지는 미완성 상태를 분명히 하되, 한국어에서 과도하게 직역된 진행형을 피했습니다. 원문의 durative + 완료 부정 의미를 함께 살렸습니다.
  doctrine_reference: '번역 문체 지침: source-direct, 의미 보존 우선'
