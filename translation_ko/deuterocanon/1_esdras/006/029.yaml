- from: 그와 같이 밀과 소금과 포도주와 기름도 해마다 계속해서, 예루살렘의 제사장들이 지시하는 대로, 매일 의심 없이 사용되게 하십시오.[a]
  to: 그와 같이 밀과 소금과 포도주와 기름도 매년 지속적으로, 예루살렘의 제사장들이 지시하는 대로 매일 이의 없이 사용되도록 하십시오.[a]
  rationale: 핵심 부사의 의미를 ‘의심’이 아니라 이의·논쟁의 부재로 바로잡고, 수동 부정사의 지시적 기능을 자연스러운 합쇼체로 다듬었습니다. ‘매년 지속적으로’는 ἐνδελεχῶς κατʼ ἐνιαυτόν의 지속성과 연례성을 유지합니다.
