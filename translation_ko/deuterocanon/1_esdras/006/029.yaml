base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/029.yaml
  text: Likewise also wheat and salt and wine and oil continually year by year[a], as the priests in Jerusalem may direct, are to be used up day by day without dispute,
  footnotes:
  - marker: a
    text: Or 'without fail' / 'without question.' The Greek adverb can emphasize either the absence of objection or the certainty of compliance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그와 같이 밀과 소금과 포도주와 기름도 매년 지속적으로, 예루살렘의 제사장들이 지시하는 대로 매일 이의 없이 사용되도록 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 부사는 ‘이의 없이’, ‘논쟁 없이’ 또는 ‘의문의 여지 없이’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πυρὸν
  english_pob_choice: wheat
  chosen_korean: 밀
  alternatives_korean:
  - 밀알
  - 곡식
  lexicon: LSJ
  rationale: 문맥의 성전 공물 목록에서 πυρός는 일반 곡식보다 구체적인 ‘밀’을 가리키는 것이 자연스러워, 한국어도 가장 직접적인 대응인 ‘밀’로 옮겼습니다.
- source_word: ἐνδελεχῶς κατʼ ἐνιαυτόν
  english_pob_choice: continually year by year
  chosen_korean: 해마다 계속해서
  alternatives_korean:
  - 해마다 끊임없이
  - 매년 계속해서
  lexicon: LSJ
  rationale: 지속성과 반복성을 함께 담아야 하므로, ‘해마다 계속해서’로 옮겨 연례적 제공과 계속성을 모두 보이도록 했습니다.
- source_word: ὑπαγορεύσωσιν
  english_pob_choice: may direct
  chosen_korean: 지시하는 대로
  alternatives_korean:
  - 명하는 대로
  - 규정하는 대로
  lexicon: LSJ
  rationale: 제사장들이 필요한 양과 방식을 정하는 행정적 의미가 있어, 단순한 명령보다 절차적 뉘앙스를 살린 ‘지시하는 대로’가 적절합니다.
- source_word: ἀναλίσκεσθαι
  english_pob_choice: are to be used up
  chosen_korean: 사용되게 하십시오
  alternatives_korean:
  - 소모되게 하십시오
  - 소비되게 하십시오
  lexicon: LSJ
  rationale: 제의용 공급품이 실제로 쓰이는 것을 뜻하므로, 현대 한국어에서 공문체에 어울리는 ‘사용되게 하십시오’로 자연스럽고 과도한 해석 없이 옮겼습니다.
- source_word: ἀναμφισβητήτως
  english_pob_choice: without dispute
  chosen_korean: 의심 없이
  alternatives_korean:
  - 논란 없이
  - 이의 없이
  lexicon: LSJ
  rationale: 이 부사는 본래 ‘논쟁의 여지 없이, 이의 없이’의 뜻이므로, 여기서는 공급을 막거나 다투지 말라는 행정적 의미를 살려 ‘의심 없이’로 옮겼습니다.
theological_decisions:
- issue: 제사장 권위와 왕실 공급의 관계
  chosen_reading: 예루살렘의 제사장들이 지시하는 기준에 따라 성전 공급품이 정기적으로 제공되도록 하는 행정 명령으로 읽었습니다.
  alternative_readings:
  - 단순한 물자 배급 지시
  - 종교적 율례 준수 명령
  rationale: 본문은 신학적 논쟁보다 성전 유지에 필요한 물자 제공의 질서와 권한을 강조하므로, 제사장들의 지시를 행정적·제의적 기준으로 반영했습니다.
  doctrine_reference: 성전 봉사와 제사장 직무에 대한 구약적 문맥(출 29; 민 28–29)
