base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/028.yaml
  text: and from the tribute of Coele-Syria and Phoenicia[a], support is to be given carefully to these men for sacrifice to the Lord, to Zerubbabel the governor, for bulls and rams and lambs[c][b],
  footnotes:
  - marker: a
    text: Or 'an allowance is to be given' or 'provision is to be made.' The Greek σύνταξιν δίδοσθαι refers to an official allotment or support from provincial revenues.
    reason: lexical_alternative
  - marker: b
    text: '''Coele-Syria'' is the conventional Greek provincial name for the region; literally, the term means ''Hollow Syria.'''
    reason: cultural_note
  - marker: c
    text: The syntax around 'to Zerubbabel the governor' is compressed in Greek and may indicate either the recipient/administrator of the support or an appositional identification within the decree.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 코엘레 시리아와 페니키아의 조세 수입에서, 이 사람들에게 주님께 드릴 제사를 위해, 총독 스룹바벨에게, 수소와 숫양과 어린 양들을 위하여, 신중하게 지원금이 지급되어야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φορολογίας
  english_pob_choice: tribute
  chosen_korean: 조세 수입
  alternatives_korean:
  - 조공
  - 세금 수입
  - 부세
  lexicon: LSJ
  rationale: φορολογίας는 지방 행정의 과세 수입을 가리키므로, 한국어로는 제국적 맥락을 살리면서도 자연스러운 ‘조세 수입’이 적절합니다.
- source_word: κοίλης Συρίας
  english_pob_choice: Coele-Syria
  chosen_korean: 코엘레 시리아
  alternatives_korean:
  - 홀로우 시리아
  - 코일레 시리아
  lexicon: LSJ
  rationale: 고유한 헬라스식 지명으로, 직역하기보다 음역해 역사적 지역명을 보존하는 것이 맞습니다.
- source_word: σύνταξιν δίδοσθαι
  english_pob_choice: support is to be given
  chosen_korean: 지원금이 지급되어야 합니다
  alternatives_korean:
  - 할당금이 주어져야 합니다
  - 공급이 마련되어야 합니다
  - 부조가 주어져야 합니다
  lexicon: LSJ
  rationale: σύνταξις는 공식적인 할당·배정의 뜻이 강하므로, 문맥상 재정 지원을 드러내는 ‘지원금’과 수동적 의무 표현 ‘지급되어야 합니다’가 가장 자연스럽습니다.
- source_word: ἐπιμελῶς
  english_pob_choice: carefully
  chosen_korean: 신중하게
  alternatives_korean:
  - 부지런히
  - 정성껏
  - 주의 깊게
  lexicon: LSJ
  rationale: 행정적 지시의 어조를 살려, 단순한 열심보다 절차적·책임감 있는 수행을 나타내는 ‘신중하게’가 적합합니다.
- source_word: ἄρνας
  english_pob_choice: lambs
  chosen_korean: 어린 양들
  alternatives_korean:
  - 양들
  - 새끼 양들
  lexicon: LSJ
  rationale: 제사 동물 목록이므로 ‘어린 양들’이 제의적 뉘앙스를 자연스럽게 전달합니다.
theological_decisions:
- issue: κύριῳ의 한국어 처리
  chosen_reading: 주님께
  alternative_readings:
  - 주께
  - 주 하나님께
  rationale: 헬라어 본문은 κυρίῳ를 사용하므로, 기본 원칙에 따라 ‘주님’으로 옮기되 제사 문맥의 경건한 대상임을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md contested terms: κύριος → 주님'
- issue: Ζοροβάβελ ἐπάρχῳ의 관계
  chosen_reading: 총독 스룹바벨에게
  alternative_readings:
  - 총독인 스룹바벨에게
  - 스룹바벨 총독에게
  rationale: 여격의 압축된 구문을 한국어로는 행정 직함과 인명을 분명히 연결해 ‘총독 스룹바벨에게’로 옮겼습니다.
  doctrine_reference: Greek dative/appositional syntax in decree formula
