  source_fidelity: 초안은 ἀτενίσαι의 감독·유의의 뜻을 ‘돌보게 하다’로 옮기면서, ‘유다 포로들에게서 온 사람들’이 돌보는 주체인 것처럼 문장 관계를 바꾸었습니다. 그리스어는 그들이 포로 생활에서 나온 이들과 함께 일하도록 유의/감독하라는 명령입니다. 또한 τοῖς ἐκ τῆς αἰχμαλωσίας τῆς Ἰουδαίας는 ‘포로들에게서 온’이 아니라 ‘유다의 포로 생활에서 나온 이들’입니다.
