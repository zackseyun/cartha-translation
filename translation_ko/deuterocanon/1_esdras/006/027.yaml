theological_decisions:
- issue: τοῖς ἐκ τῆς αἰχμαλωσίας τῆς Ἰουδαίας의 대상 범주
  chosen_reading: ‘유다 포로들에게서 온 사람들’로 옮겨, 포로 신분에서 나온 귀환자들을 가리키는 의미를 살렸습니다.
  alternative_readings:
  - 유다의 포로들
  - 유다의 유배자들
  - 유다 포로에서 나온 자들과
  rationale: 그리스어가 ‘유다의 포로 상태에서 나온 이들’을 뜻하므로, 단순히 지역명만 붙인 표현보다 포로/귀환의 역사적 상태를 드러내는 번역이 더 정확합니다.
  doctrine_reference: '번역 원칙: source-direct historical sense; POB glossary on αἰχμαλωσία/exile'
- issue: τὸν οἶκον τοῦ κυρίου의 κύριος
  chosen_reading: ‘주의 집’으로 옮겨 κύριος의 일반적 신적 호칭을 유지했습니다.
  alternative_readings:
  - 주님의 집
  - 야훼의 집
  rationale: 이 본문은 그리스어 직역 기반의 deuterocanonical 문맥이므로, 주석적 이론 없이 κύριος를 ‘주’로 유지하는 것이 본문 충실도에 적합합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → 주'
