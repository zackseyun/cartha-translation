base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/027.yaml
  text: And I also gave orders that it be fully rebuilt[a], and that attention be given so that they may work together with those from the captivity of Judea until the house of the Lord is finished[b];
  footnotes:
  - marker: a
    text: Or, 'with the exiles of Judea.' The Greek phrase literally refers to those from the captivity/exile of Judea.
    reason: lexical_alternative
  - marker: b
    text: The verb rendered 'attention be given' literally means 'to look intently'; here it likely has the administrative sense 'see to it' or 'take care.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나도 또한 그 집을 완전히 재건하고, 유다의 포로 생활에서 나온 이들과 함께 일하도록 유의하여 주의 집이 완공될 때까지 그렇게 하라고 명령하였습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다의 유배자들과’. 그리스어는 문자적으로 ‘유다의 포로 생활에서 나온 이들’을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘유의하여’에 해당하는 동사는 문자적으로 ‘집중해서 바라보다’라는 뜻입니다. 여기서는 그들이 함께 일하도록 살피고 감독하라는 행정적 의미로 쓰였습니다.
    reason: lexical_alternative
