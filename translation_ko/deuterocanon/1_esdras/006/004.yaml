base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/004.yaml
  text: By whose authorization are you building this house and completing this roof and all the rest? And who are the builders carrying out these things?[a][b]
  footnotes:
  - marker: a
    text: Or, 'At whose command are you building this house...?' The Greek participle can emphasize an order or directive behind the work.
    reason: lexical_alternative
  - marker: b
    text: '''House'' here refers to the temple; the translation keeps the ordinary Greek term rather than substituting the interpretive gloss ''temple.'''
    reason: cultural_note
translation:
  language: ko
  text: 누가 여러분에게 이 집을 짓고 이 지붕과 그 밖의 모든 것을 완성하라고 허가했습니까? 그리고 이 일을 수행하는 건축자들은 누구입니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 '집'은 문맥상 성전을 가리키지만, 번역은 해석어를 덧붙이지 않고 일반 명사를 유지했습니다.
    reason: cultural_note
  - marker: b
    text: συντάξαντος는 단순한 '누구의'보다 지시·허가의 근거를 묻는 말로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίνος ὑμῖν συντάξαντος
  english_pob_choice: By whose authorization
  chosen_korean: 누가 여러분에게 ... 허가했습니까?
  alternatives_korean:
  - 누구의 명령으로 ... 했습니까?
  - 누구의 허가로 ... 했습니까?
  lexicon: LSJ
  rationale: συντάξαντος는 단순한 정보 질문이 아니라 공적 허가나 지시의 근거를 묻는 행정적 뉘앙스가 있어, 한국어에서는 자연스러운 공문체 표현인 "허가"로 옮겼습니다.
- source_word: τὸν οἶκον τοῦτον
  english_pob_choice: this house
  chosen_korean: 이 집
  alternatives_korean:
  - 이 성전
  - 이 건물
  lexicon: LSJ
  rationale: 원문은 οἶκον(집)이라고 말하며, POB도 해석어인 'temple'을 피했습니다. 따라서 한국어도 '성전' 대신 '집'을 유지해 원문 어휘를 보존했습니다.
- source_word: τὴν στέγην ταύτην
  english_pob_choice: this roof
  chosen_korean: 이 지붕
  alternatives_korean:
  - 이 덮개
  - 이 지붕 덮개
  lexicon: LSJ
  rationale: στέγη는 건물의 지붕 또는 덮개를 뜻하므로, 가장 직접적이고 자연스러운 '지붕'을 택했습니다.
- source_word: τἄλλα πάντα ἐπιτελεῖτε ... οἱ ταῦτα τελοῦντες
  english_pob_choice: all the rest ... carrying out these things
  chosen_korean: 그 밖의 모든 것을 완성 ... 이 일을 수행하는
  alternatives_korean:
  - 나머지 모든 것을 마무리 ... 이 일들을 행하는
  - 그 밖의 모든 것을 이루어 ... 이 일을 실행하는
  lexicon: LSJ
  rationale: ἐπιτελέω와 τελέω는 모두 완수/완성의 의미가 있어, 앞부분은 '완성하다'로, 뒷부분은 동작성을 살린 '수행하다'로 나누어 번역했습니다.
theological_decisions:
- issue: '''house''를 ''성전''으로 풀어 쓸지 여부'
  chosen_reading: 원문 어휘를 따라 '집'으로 두었습니다.
  alternative_readings:
  - '''성전''으로 해석 번역'
  - '''하나님의 집''으로 확장 번역'
  rationale: 1 Esdras의 이 구절은 건축 현장에 대한 공식 질문으로, 본문 자체는 해석어보다 원어 표현을 유지하는 편이 독자에게 원문 감각을 더 정확히 전달합니다.
  doctrine_reference: source-foregrounding / interpretive restraint
