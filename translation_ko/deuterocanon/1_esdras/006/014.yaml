base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/014.yaml
  text: And because our fathers[a], having provoked him, sinned against the Lord of Israel, the heavenly One, he gave them into the hands of Nebuchadnezzar king of Babylon, king of the Chaldeans;
  footnotes:
  - marker: a
    text: Or 'the God of heaven.' The Greek reads 'the heavenly One,' while related Ezra tradition often uses the fuller title 'God of heaven.'
    reason: alternative_reading
translation:
  language: ko
  text: 또한 우리 조상들이 이스라엘의 주, 곧 하늘에 계신 분[a]을 노하시게 하고 그분을 거슬러 죄를 지었으므로, 그분께서 그들을 바빌론 왕 느부갓네살, 곧 갈대아인의 왕의 손에 넘기셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘의 하나님’. 그리스어 본문은 ‘하늘에 계신 분’에 해당하는 표현을 쓰지만, 이와 평행하는 에스라 전승에는 더 완전한 호칭이 자주 나옵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ πατέρες ἡμῶν
  english_pob_choice: our fathers
  chosen_korean: 우리 조상들
  alternatives_korean:
  - 우리 아버지들
  - 우리 선조들
  lexicon: BDAG
  rationale: 공동체의 역사적 기억을 가리키는 표현이므로, 직역의 어감을 살리되 현대 한국어에서는 ‘조상들’이 가장 자연스럽습니다.
- source_word: παραπικράναντες
  english_pob_choice: having provoked him
  chosen_korean: 그분을 노하게 하며
  alternatives_korean:
  - 그분을 격분시키며
  - 그분을 거스르며
  lexicon: BDAG
  rationale: 분사구가 하나님을 향한 반역적 자극을 나타내므로, 관계적·정서적 긴장을 드러내는 ‘노하게 하다’가 적절합니다.
- source_word: εἰς τὸν κύριον τοῦ Ἰσραὴλ τὸν οὐράνιον
  english_pob_choice: against the Lord of Israel, the heavenly One
  chosen_korean: 하늘에 계신 이스라엘의 주
  alternatives_korean:
  - 이스라엘의 주, 하늘에 계신 분
  - 하늘의 이스라엘 주
  lexicon: BDAG
  rationale: κύριος는 여기서 주로 두고, τὸν οὐράνιον은 ‘하늘에 계신’으로 옮겨 두 표현이 겹쳐 이루는 호칭을 살렸습니다. ‘이스라엘의 하나님’처럼 의미를 확장하지 않았습니다.
- source_word: παρέδωκεν αὐτοὺς εἰς χεῖρας
  english_pob_choice: he gave them into the hands of
  chosen_korean: 그들을 … 손에 넘기셨습니다
  alternatives_korean:
  - 그들을 … 손에 내주셨습니다
  - 그들을 … 권력 아래에 두셨습니다
  lexicon: BDAG
  rationale: ‘손에 넘기다’는 히브리적/헬라적 심판 공식의 관용구를 자연스럽게 살리며, 포로·패배의 수동성을 드러냅니다.
- source_word: Ναβουχοδονοσὸρ
  english_pob_choice: Nebuchadnezzar
  chosen_korean: 느부갓네살
  alternatives_korean:
  - 네부카드네자르
  - 나부코도노소르
  lexicon: LSJ
  rationale: 이미 정착된 한국어 성경 인명 표기를 따랐습니다.
theological_decisions:
- issue: τὸν οὐράνιον의 처리
  chosen_reading: ‘하늘에 계신’으로 옮겨, 본문이 말하는 하늘적/초월적 칭호를 유지했습니다.
  alternative_readings:
  - ‘하늘의 하나님’
  - ‘하늘에 계신 분’
  rationale: 그리스어 본문은 더 긴 ‘하늘의 하나님’이 아니라 형용사적 명사구를 사용하므로, 관련 전승의 확장된 표현을 본문 속으로 끌어오지 않았습니다. 다만 한국어에서는 ‘분’보다 ‘주’와 결합한 호칭이 더 응집력 있습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: κύριος의 번역
  chosen_reading: ‘주’로 유지했습니다.
  alternative_readings:
  - ‘주님’
  - ‘주(主)’
  rationale: 표준 프로젝트 용례에 맞추어 κύριος의 주호칭을 유지하되, 문맥상 대상이 하나님이므로 존칭적 문장으로 처리했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος'
