translation:
  language: ko
  text: 나 다리오 왕은 이것이 이러한 것들에 따라 주의 깊게 이루어지도록 칙령을 내렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ
  english_pob_choice: I
  chosen_korean: 나
  alternatives_korean:
  - 저
  lexicon: LSJ
  rationale: 왕의 공식 칙령에서 강조된 1인칭 화자를 자연스러운 한국어로 드러내기 위해 ‘나’로 옮겼습니다.
- source_word: βασιλεὺς Δαρεῖος
  english_pob_choice: King Darius
  chosen_korean: 다리오 왕
  alternatives_korean:
  - 왕 다리오
  - 다리오
  lexicon: LSJ
  rationale: 고유명사 뒤에 왕호를 붙이는 한국어 관용에 맞추되, 원문의 왕권 표지를 유지했습니다.
- source_word: δεδογμάτικα
  english_pob_choice: have decreed
  chosen_korean: 명령합니다
  alternatives_korean:
  - 칙령했습니다
  - 결정했습니다
  lexicon: LSJ
  rationale: 완료형의 공적인 통치 행위를 한국어 현재 시제 명령문으로 자연스럽게 반영하면서, 이미 유효한 왕령의 성격을 살렸습니다.
- source_word: ἐπιμελῶς
  english_pob_choice: carefully
  chosen_korean: 주의 깊게
  alternatives_korean:
  - 신중하게
  - 세심하게
  lexicon: LSJ
  rationale: 집행의 정확성과 주의를 강조하는 부사로서, 절차적·행정적 뉘앙스를 가장 무리 없이 전달합니다.
- source_word: κατὰ ταῦτα
  english_pob_choice: according to these instructions
  chosen_korean: 이 지시들에 따라
  alternatives_korean:
  - 이것들에 따라
  - 이러한 것들에 따라
  lexicon: LSJ
  rationale: 직역은 ‘이것들에 따라’이지만, 문맥상 앞선 왕의 규정을 가리키므로 ‘지시들’로 풀어 한국어에서 지시 대상을 분명히 했습니다.
