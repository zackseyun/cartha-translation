  yaml_path: translation/deuterocanon/1_esdras/006/033.yaml
  text: I, King Darius, have decreed that this be done carefully according to these instructions.
  footnotes:
  - marker: a
    text: Or, more literally, 'according to these things.' The phrase refers to the preceding provisions of Darius's decree.
