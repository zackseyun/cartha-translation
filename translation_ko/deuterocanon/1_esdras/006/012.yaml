base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/012.yaml
  text: But they answered us[a], saying, “We are servants of the Lord, who created heaven and earth.”
  footnotes:
  - marker: a
    text: Or “children of the Lord who created heaven and earth.” The Greek word can mean either “children” or “servants”; here the context favors service rather than filial status.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그들은 우리에게 이렇게 대답하였습니다. “우리는 하늘과 땅을 창조하신 주님의 종들[a]입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하늘과 땅을 창조하신 주님의 자녀들.” 그리스어 παῖδες는 ‘종들’ 또는 ‘자녀들’을 뜻할 수 있습니다. 여기서는 공식적인 답변의 문맥상 ‘종들’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἀπεκρίθησαν ἡμῖν λέγοντες
  english_pob_choice: But they answered us, saying
  chosen_korean: 그들이 우리에게 대답하며 말하기를
  alternatives_korean:
  - 그들은 우리에게 대답하여 말하였습니다
  - 그들은 우리에게 응답하며 말하기를
  lexicon: BDAG
  rationale: ἀπεκρίθησαν과 λέγοντες의 서술 흐름을 자연스러운 서사체로 살리되, ‘우리에게’로 수신 대상을 분명히 드러냈습니다.
- source_word: παῖδες
  english_pob_choice: servants
  chosen_korean: 종들
  alternatives_korean:
  - 섬기는 사람들
  - 하인들
  - 자녀들
  lexicon: BDAG
  rationale: 문맥상 하나님께 속해 봉사하는 신분을 가리키므로, POB의 ‘servants’를 한국어에서 가장 직접적으로 받는 ‘종들’로 옮겼습니다.
- source_word: τοῦ κυρίου
  english_pob_choice: of the Lord
  chosen_korean: 주님의
  alternatives_korean:
  - 주님의
  - 주님의 주인의
  - 주님의 주께서
  lexicon: BDAG
  rationale: κύριος는 하나님의 호칭으로서 한국어 관용에 맞게 ‘주님’으로 옮기되, 소유격 관계를 살려 ‘주님의’로 처리했습니다.
- source_word: τοῦ κτίσαντος τὸν οὐρανὸν καὶ τὴν γῆν
  english_pob_choice: who created heaven and earth
  chosen_korean: 하늘과 땅을 창조하신
  alternatives_korean:
  - 하늘과 땅을 지으신
  - 하늘과 땅을 만드신
  lexicon: BDAG
  rationale: κτίσαντος는 창조 행위를 가리키므로 ‘창조하신’이 가장 정확하며, ‘하늘과 땅’은 성경적 총칭 표현을 그대로 보존합니다.
theological_decisions:
- issue: παῖδες의 신분 뉘앙스
  chosen_reading: 종들
  alternative_readings:
  - 자녀들
  - 섬기는 자들
  rationale: 본문은 공식적 항변 속에서 하나님께 속한 사람들임을 밝히는 자리이므로, 혈연적 ‘자녀’보다 봉사와 소속을 드러내는 ‘종들’이 문맥에 더 적합합니다.
  doctrine_reference: 'DOCTRINE.md: optimal equivalence; terminology consistency'
