review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘그곳에서 물러나게 하되’는 명령을 받은 관리들이 스스로 그 장소에서 떨어져 있어야 한다는 ἀπέχεσθαι의 의미를, 누군가를 물러나게 하는 사역 표현처럼 바꿉니다. 또한 본문에 없는 ‘나아가도록’을 넣은 각주는 ἐᾶσαι의 비간섭 의미를 과도하게 구체화합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체의 간접 명령 구문으로 자연스럽습니다. ‘그곳에 가까이하지 말고’와 ‘그대로 두라고’는 공간적 거리 유지와 공식적 비간섭이라는 문맥을 함께 드러냅니다.
  terminology: παῖδα Κυρίου는 ‘주의 종’, ὕπαρχον은 ‘유대의 총독’, πρεσβυτέρους는 ‘유대 사람들의 장로들’로 유지합니다. Σισίννῃ는 그리스어 형태에 맞추어 ‘시시네스’로 표기하고, Σαθραβουζάνῃ는 ‘사트라부자네스’로 표기합니다.
  issues:
  - severity: medium
    issue: ‘그곳에서 물러나게 하되’의 주체 및 태
    rationale: ἀπέχεσθαι는 시시네스 등 명령 수령자들이 ‘그 장소에서 떨어져 있다/가까이하지 않다’는 뜻입니다. 한국어 사역형 ‘물러나게 하다’는 다른 이를 물러나게 하는 뜻으로 읽힐 수 있습니다.
  - severity: medium
    issue: 각주의 ‘나아가도록 허락하라’
    rationale: ἐᾶσαι는 ‘내버려 두다, 허락하다’이지만, 원문은 무엇을 하도록 ‘나아가게’ 한다고 명시하지 않습니다. 비간섭이라는 문맥적 설명은 가능하나 ‘나아가도록’은 본문에 없는 내용을 보탭니다.
  - severity: low
    issue: 시시느 표기
    rationale: 그리스어 Σισίννῃ 및 영어 감사본의 Sisinnes에 비추어 ‘시시네스’가 더 투명하고 일관된 음역입니다.
