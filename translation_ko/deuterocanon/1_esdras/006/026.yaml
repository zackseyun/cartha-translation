  to: 그는 또한 시리아와 페니키아의 총독 시시네스와 사트라부자네스와 그들의 동료들, 그리고 시리아와 페니키아에 임명된 총독들에게 그곳에 가까이하지 말고, 주의 종이며 유대의 총독인 스룹바벨과 유대 사람들의 장로들을 그대로 두라고 명령하였습니다.[a]
