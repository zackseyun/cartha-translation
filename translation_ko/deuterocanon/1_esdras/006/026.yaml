base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/026.yaml
  text: He also ordered Sisinnes[a], governor of Syria and Phoenicia, and Sathrabuzanes and their associates and the appointed governors in Syria and Phoenicia, to keep away from the place, but to leave Zerubbabel, the servant of the Lord and governor of Judea, and the elders of the Jews alone.
  footnotes:
  - marker: a
    text: Or 'allow Zerubbabel, the servant of the Lord, governor of Judea, and the elders of the Jews to proceed.' The Greek literally says 'leave' or 'permit,' in a context of official noninterference.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 또한 시리아와 페니키아의 총독 시시네스와 사트라부자네스와 그들의 동료들, 그리고 시리아와 페니키아에 임명된 총독들에게 그곳에 가까이하지 말고, 주의 종이며 유대의 총독인 스룹바벨과 유대 사람들의 장로들을 그대로 두라고 명령하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주의 종 스룹바벨, 유대의 총독, 그리고 유대 사람들의 장로들을 내버려 두라’로 옮길 수 있습니다. 그리스어의 표현은 문자적으로 ‘떠나 있다/삼가다’와 ‘내버려 두다/허락하다’라는 뜻이며, 이 문맥에서는 공식적인 비간섭을 명합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσετάξεν ... ἐπιμεληθῆναι
  english_pob_choice: ordered
  chosen_korean: 명령하였습니다
  alternatives_korean:
  - 지시하였습니다
  - 명령을 내렸습니다
  lexicon: LSJ
  rationale: 접속된 부정사 구문 전체가 하나의 상위 명령의 내용이므로, 한국어에서는 동사 하나로 자연스럽게 옮기되 지시의 권위를 유지했습니다.
- source_word: ἐπάρχῳ / ἀποτεταγμένοις ... ἡγεμόσιν / ὕπαρχον
  english_pob_choice: governor
  chosen_korean: 총독
  alternatives_korean:
  - 지사
  - 통치자
  - 관리
  lexicon: LSJ
  rationale: 페르시아 행정 문맥의 지역 통치자를 가리키므로, 현대 한국어에서 행정적 지위를 드러내는 ‘총독’이 가장 자연스럽고 일관됩니다.
- source_word: παῖδα Κυρίου
  english_pob_choice: the servant of the Lord
  chosen_korean: 주의 종
  alternatives_korean:
  - 주의 아들
  - 주의 아이
  - 주님의 종
  lexicon: LSJ
  rationale: παῖς는 문자적으로 ‘아이’일 수도 있으나, 여기서는 존칭적·공적 호칭이므로 ‘종’이 원문의 의미와 POB의 선택을 가장 잘 반영합니다.
- source_word: πρεσβυτέρους
  english_pob_choice: elders
  chosen_korean: 장로들
  alternatives_korean:
  - 어른들
  - 원로들
  - 연장자들
  lexicon: LSJ
  rationale: 유대 공동체의 지도층을 가리키는 관용적 표현이므로, 단순한 연령이 아니라 공동체적 직분을 드러내는 ‘장로들’로 옮겼습니다.
theological_decisions:
- issue: κύριος의 한국어 처리
  chosen_reading: 주
  alternative_readings:
  - 주님
  - 주인
  rationale: 여기서 κύριος는 야훼를 가리키는 존칭적 표제로 읽히므로, 본문에서는 간결하게 ‘주’로 두어 원문의 경외성을 유지했습니다.
  doctrine_reference: 'POB glossary: κύριος → 주(主) / 주님'
- issue: ζει로भाबेल에 대한 서술의 범위
  chosen_reading: 주의 종 스룹바벨 곧 유대의 총독
  alternative_readings:
  - 주의 종이자 유대의 총독 스룹바벨
  - 유대의 총독 스룹바벨, 주의 종
  rationale: 원문은 스룹바벨을 ‘주의 종’과 ‘유대의 총독’으로 병렬 진술하므로, 두 호칭을 모두 유지해 공적 직분과 신앙적 호칭 사이의 긴장을 보존했습니다.
  doctrine_reference: Source-note / translation philosophy
