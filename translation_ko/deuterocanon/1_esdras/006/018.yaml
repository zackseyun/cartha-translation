base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/018.yaml
  text: And he was commanded to bring back all these vessels[a], to put them in the temple in Jerusalem, and that the temple of the Lord should be built on its site.
  footnotes:
  - marker: a
    text: Or 'carry back all these vessels ... and rebuild the temple of the Lord in its place.' The Greek wording allows slightly different English choices for the restoration command and the final location phrase.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그에게 명령이 내려져, 이 모든 기구를 예루살렘에 있는 성전에 두고 오게 하였으며, 주님의 성전이 그 터 위에 세워지게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 모든 기구를 도로 가져와 … 주님의 성전을 그 자리에서 다시 세우게 하였다.’ 그리스어 표현은 기구의 ‘되돌림’과 성전의 ‘재건’을 약간 다르게 옮길 여지를 줍니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετάγη
  english_pob_choice: it was commanded
  chosen_korean: 명령이 내려져
  alternatives_korean:
  - 그에게 명령되었고
  - 명령을 받았고
  lexicon: BDAG
  rationale: 주어 없는 수동형의 공식적·관용적 뉘앙스를 살려, 누가 명령했는지를 덧붙이지 않고 한국어로 자연스럽게 옮겼습니다.
- source_word: ἀπήνεγκεν ... ἀποθεῖναι
  english_pob_choice: should bring back ... to put them
  chosen_korean: 두고 오게 하였으며
  alternatives_korean:
  - 돌려오게 하였으며
  - 가져와 두게 하였으며
  - 도로 가져가 놓게 하였으며
  lexicon: BDAG
  rationale: 성전 기구를 원래 자리로 되돌리는 의미와 ‘두다/놓다’의 결과를 함께 담기 위해 ‘두고 오게’로 옮겼습니다. 영어의 restore/bring back 뉘앙스를 기계적으로 반복하기보다 문맥상 더 분명한 재배치 의미를 살렸습니다.
- source_word: σκεύη
  english_pob_choice: vessels
  chosen_korean: 기구
  alternatives_korean:
  - 그릇
  - 용기
  - 제기
  lexicon: BDAG
  rationale: 성전용 기물을 가리키므로 일상어 ‘그릇’보다 포괄적이고 문맥에 맞는 ‘기구’를 택했습니다.
- source_word: ναῷ τῷ ἐν Ἰερουσαλήμ
  english_pob_choice: the temple in Jerusalem
  chosen_korean: 예루살렘에 있는 성전
  alternatives_korean:
  - 예루살렘의 성전
  - 예루살렘 성전
  lexicon: BDAG
  rationale: 장소를 밝히는 전치사구를 자연스러운 현대 한국어로 풀어, 독자가 곧바로 지리적 위치를 이해하도록 했습니다.
- source_word: ναὸν τοῦ κυρίου
  english_pob_choice: the temple of the Lord
  chosen_korean: 주님의 성전
  alternatives_korean:
  - 주님의 전
  - 주님의 성전집
  - 주님의 집
  lexicon: BDAG
  rationale: κύριος를 프로젝트 기본값에 따라 ‘주님’으로 옮기되, 성전 맥락에서 소유격을 자연스럽게 살리기 위해 ‘주님의 성전’으로 했습니다.
- source_word: ἐπὶ τοῦ τόπου
  english_pob_choice: on its site
  chosen_korean: 그 터 위에
  alternatives_korean:
  - 그 자리 위에
  - 그 장소에
  - 제자리에
  lexicon: BDAG
  rationale: ‘그 장소’보다 건축 재건 문맥을 더 잘 드러내는 ‘터’가 원위치·기초 부지를 암시하므로, 재건의 장소성에 맞게 선택했습니다.
theological_decisions:
- issue: ‘주님의 성전’의 주어적 성격과 재건 명령의 수동 표현
  chosen_reading: 직접 명령자나 행위자를 밝히지 않고, 성전 재건이 공식적 명령 아래 이루어졌다는 수동형의 엄숙한 문체를 유지했습니다.
  alternative_readings:
  - ‘그가 명령을 받아’처럼 행위자를 드러내는 번역
  - 능동형으로 풀어 ‘그가 가져오고 성전을 세우게 했다’로 옮기는 번역
  rationale: 본문은 누가 명령했는지보다 명령의 공적 성격을 강조합니다. 따라서 한국어도 주어를 특정하지 않는 수동형으로 그 긴장을 보존했습니다.
  doctrine_reference: 문체·신학적 수동태 보존
