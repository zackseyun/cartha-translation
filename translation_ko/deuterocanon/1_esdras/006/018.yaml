- from: 그리고 그에게 명령이 내려져, 이 모든 기구를 예루살렘에 있는 성전에 두고 오게 하였으며, 주님의 성전이 그 터 위에 세워지게 하였습니다.[a]
  to: 그리고 그는 이 모든 기구를 돌려 가져와 예루살렘에 있는 성전에 두고, 주님의 성전은 그 자리에 세우도록 명령을 받았습니다.[a]
  rationale: 명령을 받은 사람과 명령의 두 내용을 ‘…하도록 명령을 받았습니다’로 연결하여 원문의 공식적 수동 구조를 자연스럽게 보존했습니다. ‘돌려 가져와’는 기구의 반환이라는 문맥을 드러내되, 단순 운반으로도 읽힐 수 있는 그리스어의 여지는 각주에 남겼습니다. 성전 건축에는 원문에 없는 ‘재건’ 또는 ‘다시’를 본문에 넣지 않았습니다.
