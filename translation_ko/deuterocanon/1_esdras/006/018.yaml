review_pass:
  verdict: revise
  source_fidelity: 현 번역은 명령의 공식적 수동 뉘앙스와 성전 건축의 수동 표현을 대체로 보존합니다. 그러나 ‘두고 오게 하였으며’는 ἀπήνεγκεν의 ‘가져가다/돌려 가져오다’와 ἀποθεῖναι의 ‘두다’를 한데 뭉개며, 명령을 받은 당사자가 다시 사역하게 한 것처럼 읽힐 수 있습니다.
  naturalness: ‘그는 … 하도록 명령을 받았습니다’로 문장을 정리하면 현대 표준 한국어 합쇼체로 자연스럽고, 명령의 내용도 명료해집니다.
  terminology: ‘기구’, ‘예루살렘에 있는 성전’, ‘주님의 성전’, ‘그 자리’는 문맥과 등록에 적절합니다. 건축 부지를 가리키는 표현은 ‘그 자리’가 ἐπὶ τοῦ τόπου를 자연스럽게 전달하며, 원문에 명시되지 않은 ‘다시’를 본문에서 피합니다.
  issues:
