base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/032.yaml
  text: Therefore may the Lord[a], whose name has been invoked there, destroy every king and nation that stretches out its hand to hinder or to harm that house of the Lord there in Jerusalem.
  footnotes:
  - marker: a
    text: Or, 'whose name is called there.' The Greek can be rendered more literally this way; 'has been invoked there' brings out the cultic sense in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그 이름이 거기서 불린 주께서, 예루살렘에 있는 그 주님의 집을 방해하거나 해치려고 손을 뻗는 모든 왕과 민족을 멸하시기를 바랍니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 이름이 거기서 불린/불려진’. 헬라어는 더 글자 그대로 ‘거기서 이름이 일컬어진’으로도 옮길 수 있으나, 성전 맥락에서는 예배적 의미가 드러나는 번역이 더 분명합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ ταῦτα
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이로 말미암아
  - 이 때문에
  lexicon: LSJ
  rationale: 결론·결과를 이끄는 문맥이므로 한국어 연결어로는 간결한 ‘그러므로’가 가장 자연스럽고 원문의 추론적 힘을 유지합니다.
- source_word: οὗ τὸ ὄνομα αὐτοῦ ἐπικέκληται ἐκεῖ
  english_pob_choice: whose name has been invoked there
  chosen_korean: 그 이름이 거기서 불린
  alternatives_korean:
  - 그 이름이 거기서 불려진
  - 그 이름이 거기서 일컬어진
  lexicon: LSJ
  rationale: ἐπικέκληται의 완료 수동을 ‘불린’으로 옮겨, 성전 장소와 하나님의 이름이 연결된 예배적 함의를 살리면서도 과도한 해석을 피했습니다.
- source_word: κωλῦσαι ἢ κακοποιῆσαι
  english_pob_choice: to hinder or to harm
  chosen_korean: 방해하거나 해치려고
  alternatives_korean:
  - 막거나 악하게 하려고
  - 저지하거나 손상시키려고
  lexicon: LSJ
  rationale: 두 동사의 병렬을 한국어에서 자연스럽게 살리되, 행정적 방해(κωλῦσαι)와 가해(κακοποιῆσαι)의 강도 차이를 유지했습니다.
- source_word: τὸν οἶκον Κυρίου ἐκεῖνον τὸν ἐν Ἰερουσαλήμ
  english_pob_choice: that house of the Lord there in Jerusalem
  chosen_korean: 예루살렘에 있는 그 주님의 집
  alternatives_korean:
  - 예루살렘에 있는 그 주의 집
  - 예루살렘에 있는 성전
  lexicon: LSJ
  rationale: οἶκος Κυρίου의 성전 관용구를 ‘주님의 집’으로 직역해 유지하고, ἐκεῖνον/ἐν Ἰερουσαλήμ의 지시성과 장소성을 살렸습니다.
theological_decisions:
- issue: 신명 대명사의 예배적 함의
  chosen_reading: ‘그 이름이 거기서 불린’으로 번역해, 성전이 하나님의 이름과 연결된 장소라는 점을 드러냅니다.
  alternative_readings:
  - ‘그 이름이 거기서 불려진’
  - ‘그 이름이 거기서 일컬어진’
  rationale: 본문은 하나님의 이름이 그곳에 불린/호명된 상태를 말하므로, 예배적·성전적 의미를 유지하면서도 히브리식 확장(‘거하게 하다’)을 덧붙이지 않았습니다.
  doctrine_reference: DOCTRINE.md §§1, 3, 5
- issue: 저주·기원문의 서법
  chosen_reading: ‘멸하시기를 바랍니다’로 옮겨, 문장 전체를 기원형으로 읽히게 했습니다.
  alternative_readings:
  - ‘멸하실 것입니다’
  - ‘멸하여 주십시오’
  rationale: 헬라어 부정사 ἀφανίσαι는 여기서 명령문이 아니라 기원적·저주적 맥락의 동사이므로, 한국어에서는 자연스러운 소원형이 적절합니다.
  doctrine_reference: DOCTRINE.md §1
