translation:
  language: ko
  text: 이제 그러니, 왕이시여, 결정되게 하소서. 바빌론에 있는 주 왕의 왕실 기록 보관소에서 수색이 이루어지게 하소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘결정되게 하십시오, 왕이시여; 바빌론에 있는 주 왕의 왕실 기록 보관소에서 수색이 이루어지게 하십시오.’
    reason: alternative_reading
lexical_decisions:
- source_word: νῦν οὖν
  english_pob_choice: Now then
  chosen_korean: 이제 그러니
  alternatives_korean:
  - 그러므로 이제
  - 이제
  lexicon: LSJ
  rationale: 시간적 전환과 논리적 연결을 함께 살리기 위해 합쇼체에서 자연스러운 ‘이제 그러니’를 택했습니다.
- source_word: κρίνεται
  english_pob_choice: let it be determined
  chosen_korean: 결정되게 하소서
  alternatives_korean:
  - 판단되게 하소서
  - 판결되게 하소서
  - 정해지게 하소서
  lexicon: LSJ
  rationale: 행정적·공적 결정을 청하는 표현이므로, 법정적 뉘앙스가 강한 ‘판결’보다 중립적인 ‘결정’이 본문 맥락에 더 맞습니다.
- source_word: ἐπισκεπτήτω
  english_pob_choice: let a search be made
  chosen_korean: 수색이 이루어지게 하소서
  alternatives_korean:
  - 조사가 이루어지게 하소서
  - 살피게 하소서
  - 검토하게 하소서
  lexicon: LSJ
  rationale: 문맥이 문서 보관소를 대상으로 한 공식 확인 절차이므로, 단순한 ‘살피다’보다 기록을 찾는 행위가 드러나는 ‘수색’이 더 직접적입니다.
- source_word: βασιλικοῖς βιβλιοφυλακίοις
  english_pob_choice: the royal archives
  chosen_korean: 왕실 기록 보관소
  alternatives_korean:
  - 왕실 문서 보관소
  - 왕의 기록 보관소
  - 왕실 서고
  lexicon: LSJ
  rationale: 문서와 책이 보관된 장소라는 기능을 살리면서도, 현대 한국어에서 행정 문맥에 자연스러운 ‘기록 보관소’로 옮겼습니다.
- source_word: τοῦ κυρίου βασιλέως
  english_pob_choice: of my lord the king
  chosen_korean: 주 왕의
  alternatives_korean:
  - 나의 주 왕의
  - 주군 왕의
  - 주인인 왕의
  lexicon: LSJ
  rationale: 여기서 κύριος는 신적 호칭이 아니라 궁정의 존칭이므로, POB의 취지를 따라 ‘주’로 옮기되 한국어 문맥에서는 관형격으로 압축했습니다.
theological_decisions:
- issue: κύριος가 왕에 대한 궁정식 존칭으로 쓰인 경우의 처리
  chosen_reading: ‘주’는 여기서 하나님/그리스도 칭호가 아니라 예의적 호칭으로 이해하여 ‘주 왕’으로 번역했습니다.
  alternative_readings:
  - ‘주님 왕’
  - ‘주군’
  rationale: 본문은 세속적 왕실 문서 문맥이므로, 신학적 호칭으로 오해되지 않도록 구별하는 것이 소스에 충실합니다.
  doctrine_reference: 'DOCTRINE.md: κύριος는 문맥에 따라 비신적 존칭으로 번역 가능'
- issue: 청유형의 높임말 처리
  chosen_reading: 왕에게 직접 청하는 말이므로 종결은 ‘-하소서’로 두었습니다.
  alternative_readings:
  - -하십시오
  - -되게 하십시오
  rationale: 직접 호소하는 궁정식 청원문이라는 장르를 한국어에서도 자연스럽게 보존합니다.
  doctrine_reference: 'Korean style guide: direct petition in formal address'
