base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/003.yaml
  text: At that time Sisinnes[a], the governor of Syria and Phoenicia, was present with them, along with Sathrabuzanes and his associates; and he said to them,
  footnotes:
  - marker: a
    text: Greek has a singular verb, 'and he said to them,' most naturally referring to Sisinnes as the principal speaker, though he is accompanied by Sathrabuzanes and other associates.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 시시네스[a], 곧 시리아와 페니키아의 총독이 그들과 함께 와 있었고, 사드라부자네스와 그의 동료들도 함께 있었습니다. 그리고 그가 그들에게 말하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 단수 동사 ‘말하였습니다’를 사용하므로, 사드라부자네스가 동행하더라도 주된 발화자는 시시네스로 이해하는 것이 가장 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αὐτῷ τῷ χρόνῳ
  english_pob_choice: At that time
  chosen_korean: 그때에
  alternatives_korean:
  - 그 시각에
  - 그때
  lexicon: LSJ
  rationale: 시간의 전환을 자연스럽게 표시하는 관용적 표현으로, 원문의 서두 기능을 간결하게 살렸습니다.
- source_word: παρῆν πρὸς αὐτούς
  english_pob_choice: was present with them
  chosen_korean: 그들과 함께 와 있었습니다
  alternatives_korean:
  - 그들과 함께 있었습니다
  - 그들에게 와 있었습니다
  - 그들 앞에 있었습니다
  lexicon: BDAG
  rationale: παρῆν은 단순한 도착보다 ‘함께 있는 상태’를 강조하므로, 문맥상 이동의 뉘앙스를 완전히 지우지 않으면서도 현재의 동반 상태를 드러내는 표현을 택했습니다.
- source_word: ὁ ἔπαρχος Συρίας καὶ Φοινίκης
  english_pob_choice: the governor of Syria and Phoenicia
  chosen_korean: 시리아와 페니키아의 총독
  alternatives_korean:
  - 시리아와 페니키아의 지방장관
  - 시리아와 페니키아의 감독관
  lexicon: BDAG
  rationale: ἔπαρχος는 지역을 다스리는 고위 행정관을 가리키므로, 일반 독자에게 가장 투명한 ‘총독’으로 옮겼습니다.
- source_word: Σαθραβουζάνης καὶ οἱ συνέταιροι
  english_pob_choice: Sathrabuzanes and his associates
  chosen_korean: 사드라부자네스와 그의 동료들도
  alternatives_korean:
  - 사드라부자네스와 그의 협력자들도
  - 사드라부자네스와 그의 일행도
  lexicon: BDAG
  rationale: συνέταιροι는 단순 동행인보다 함께 속한 부하·동료의 성격을 띠므로, 행정 맥락에 맞는 ‘동료들’로 옮겼습니다.
theological_decisions:
- issue: 직접화법의 화자 식별
  chosen_reading: 문맥상 단수 동사 εἶπεν은 시시네스를 주된 화자로 보아 한국어도 단수 주어를 유지했습니다.
  alternative_readings:
  - 사드라부자네스를 포함한 일행이 함께 말하였다는 넓은 해석
  rationale: 영어 POB의 주석처럼 그리스어의 단수형은 시시네스를 중심 화자로 읽는 것이 가장 자연스럽습니다.
  doctrine_reference: 본문 문맥과 문법 관찰
