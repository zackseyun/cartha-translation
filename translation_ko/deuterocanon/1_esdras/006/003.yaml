  - severity: low
    issue: ‘사드라부자네스와 그의 동료들’
    rationale: 그리스어의 ‘그 동료들’에는 단수 소유사가 없습니다. 동료들을 사드라부자네스 한 사람의 소속으로만 확정하지 않는 표현이 더 충실합니다.
