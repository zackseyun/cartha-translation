  verdict: revise
  source_fidelity: παρῆν πρὸς αὐτούς는 ‘그들과 함께 있었다/있었습니다’라는 현존·동석의 뜻이며, 초안의 ‘함께 와 있었고’는 원문에 명시되지 않은 이동·도착의 뉘앙스를 더합니다. 또한 οἱ συνέταιροι는 문법상 사드라부자네스 개인에게만 한정되지 않으므로 ‘그의 동료들’보다 두 명의 명명된 관리와 관련된 ‘그들의 동료들’이 안전합니다.
  naturalness: 수정문은 현대 표준어 합쇼체로 자연스럽고, ‘그리고 그가’는 앞의 복수 인물들과 대비되는 그리스어 단수 동사를 분명히 드러냅니다.
  terminology: ‘총독’은 ἔπαρχος의 행정 관직을 무리 없이 옮깁니다. 인명은 초안의 음역을 유지했습니다. ‘동료들’은 행정적 동반자라는 συνέταιροι의 폭넓은 의미를 유지합니다.
  issues:
