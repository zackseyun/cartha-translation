base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/010.yaml
  text: Then we questioned these elders[a], saying[b], ‘Who commanded you to build this house and—’
  footnotes:
  - marker: a
    text: The Greek text of this verse, as preserved in Swete, ends abruptly with 'and,' indicating that the sentence continues in the next verse. The English keeps that unfinished form rather than smoothing it out.
    reason: textual_variant
  - marker: b
    text: '''This house'' refers to the temple in Jerusalem.'
    reason: cultural_note
translation:
  language: ko
  text: 그때 우리는 이 장로들에게 이렇게 물었습니다. “누가 너희에게 이 집[b]을 건축하라고 명하였으며—”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 이 절에서 ‘그리고’로 끝나며, 문장은 다음 절로 이어집니다.
    reason: textual_variant
  - marker: b
    text: ‘이 집’은 예루살렘 성전을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπυνθανόμεθα
  english_pob_choice: we questioned
  chosen_korean: 우리는 ... 묻기를
  alternatives_korean:
  - 우리는 ... 질문하였습니다
  - 우리는 ... 캐물었습니다
  lexicon: LSJ
  rationale: 공식적 조사 상황의 ‘질문하다/묻다’ 의미를 살리되, 한국어에서 자연스러운 서술형으로 옮겼습니다. ‘캐물었습니다’는 다소 구어적이라 피했습니다.
- source_word: τῶν πρεσβυτέρων τούτων
  english_pob_choice: these elders
  chosen_korean: 이 장로들
  alternatives_korean:
  - 이 원로들
  - 이 노인들
  lexicon: LSJ
  rationale: πρεσβύτεροι는 단순한 연장자가 아니라 공동체의 공적 지도층을 가리키므로 ‘장로들’이 가장 직접적입니다.
- source_word: Τίνος ὑμῖν προστάξαντος
  english_pob_choice: Who gave you the order
  chosen_korean: 누가 너희에게 ... 명하였느냐
  alternatives_korean:
  - 누가 너희에게 ... 명령하였느냐
  - 무슨 권세로 너희에게 ... 시켰느냐
  lexicon: LSJ
  rationale: προστάξαντος의 명령/지시 뉘앙스를 ‘명하다’로 옮겨 권한의 출처를 묻는 공식적 질문의 힘을 살렸습니다.
- source_word: τὸν οἶκον τοῦτον
  english_pob_choice: this house
  chosen_korean: 이 집
  alternatives_korean:
  - 이 성전
  - 이 건물
  lexicon: LSJ
  rationale: 직역에 가까운 ‘집’을 유지하여 원문 표현을 살렸습니다. 이 문맥에서 성전을 뜻하지만, 본문 자체는 οἶκος의 비유적 표현을 사용합니다.
theological_decisions:
- issue: 미완성된 문장 형태 유지
  chosen_reading: 끝을 매끈하게 완결하지 않고 ‘—’로 끊어 원문의 중단된 형태를 보존했습니다.
  alternative_readings:
  - 문장을 완결하여 매끄럽게 정리함
  - 다음 절의 내용을 미리 이어 붙임
  rationale: 이 절의 그리스어는 다음 절로 이어지는 미완성 형태이므로, 독자가 본문의 불완전성을 그대로 인지하도록 유지했습니다.
  doctrine_reference: 본문 비평 및 번역 충실성 원칙
