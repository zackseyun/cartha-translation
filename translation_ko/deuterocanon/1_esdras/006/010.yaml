    rationale: ἐπυνθανόμεθα λέγοντες는 ‘이렇게 물었습니다’로 자연스럽게 옮길 수 있으며, 조사·공식 질문의 의미도 유지됩니다.
  - severity: medium
    issue: ‘명하였느냐—’는 원문의 마지막 καὶ가 나타내는 접속·미완결을 명시적으로 반영하지 못합니다.
    rationale: ‘명하였으며—’는 ‘그리고’로 이어지다 중단되는 원문의 형태를 보존하면서도 한국어 문장으로 가능합니다.
