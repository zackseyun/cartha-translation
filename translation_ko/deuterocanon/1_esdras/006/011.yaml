base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/011.yaml
  text: So we questioned them in order to make it known to you and to write to you the names of the men who were leading them[b][a], and we asked them for the list of names of those who were at their head.
  footnotes:
  - marker: a
    text: Or, 'the men who were leading them'; the Greek participle translated 'who were speaking as leaders' is somewhat difficult and may emphasize either leadership or those giving the formal account.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'the list of names of those who were at their head' refers to an official register of the leaders overseeing the work.
    reason: cultural_note
translation:
  language: ko
  text: 그래서 우리는 그것을 당신에게 알려 주고 그들을 이끌고 있던 사람들의 이름을 당신에게 적어 보내기 위해 그들을 심문하였으며, 그들의 우두머리였던 이들의 이름 목록도 그들에게 요청하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἄφηγουμένους는 문맥상 ‘이끌고 있던/앞장서던’의 뜻으로도, ‘말해 주는 자들’의 뉘앙스로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ὀνοματογραφία는 사람들의 이름을 적어 둔 공식 명단이나 등록부를 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: ἐπερωτήσαμεν
  english_pob_choice: we questioned
  chosen_korean: 우리는 ... 심문하였으며
  alternatives_korean:
  - 우리는 ... 물었으며
  - 우리는 ... 조사하였으며
  lexicon: BDAG
  rationale: 공식 보고문에서 단순한 ‘묻다’보다 절차적·조사적 성격을 살리기 위해 ‘심문하다’를 선택했습니다.
- source_word: ἕνεκεν τοῦ γνωρίσαι σοι
  english_pob_choice: in order to make it known to you
  chosen_korean: 그것을 당신에게 알려 주고
  alternatives_korean:
  - 당신이 알도록 하고
  - 당신에게 알리기 위해
  lexicon: BDAG
  rationale: 목적을 나타내는 구조이므로 한국어에서는 자연스럽게 목적 연결로 옮겼습니다.
- source_word: τοὺς ἀνθρώπους τοὺς ἀφηγουμένους
  english_pob_choice: the men who were leading them / who were speaking as leaders
  chosen_korean: 그들을 이끌고 있던 사람들
  alternatives_korean:
  - 그들에게 앞장서던 사람들
  - 그들을 인도하던 사람들
  lexicon: LSJ
  rationale: ἄφηγουμένους의 지휘·인도 의미를 살리되, 문맥상 공식 명단 작성 대상이 되는 ‘앞장선 사람들’이라는 점을 자연스럽게 드러냈습니다.
- source_word: ὀνοματογραφίαν
  english_pob_choice: the list of names
  chosen_korean: 이름 목록
  alternatives_korean:
  - 명단
  - 이름 기록
  lexicon: LSJ
  rationale: 행정 문서의 성격을 살려 ‘이름 목록’으로 옮겼습니다.
theological_decisions:
- issue: 공식 보고문에서의 ἀφηγουμένους / προκαθηγουμένων의 관계 표현
  chosen_reading: 두 표현을 모두 ‘이끄는/우두머리’ 계열로 옮기되, 하나는 ‘이끌고 있던 사람들’, 다른 하나는 ‘우두머리였던 이들’로 구분했습니다.
  alternative_readings:
  - ‘말하던 사람들’로 좁히는 번역
  - 둘 다 단순히 ‘지도자들’로 평탄화하는 번역
  rationale: 원문이 행정적 보고와 지도자 식별을 함께 담고 있으므로, 지휘와 명단 작성의 긴장을 유지하는 쪽이 더 충실합니다.
  doctrine_reference: '번역 일반 원칙: 원문의 의미 범주 보존'
- issue: 역사서 문체의 공문서적 어조
  chosen_reading: 현대 한국어 합쇼체를 유지하되 ‘심문하였으며’, ‘요청하였습니다’ 같은 공식 문체를 사용했습니다.
  alternative_readings:
  - 더 구어적인 ‘물어보았습니다’
  - 더 경직된 문어체
  rationale: 보고서체의 공식성을 살리면서도 현대 독자가 읽기 쉬운 수준으로 조정했습니다.
  doctrine_reference: 문체/등록 일관성
