base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/025.yaml
  text: And the holy vessels of the house of the Lord[a], both the gold and the silver ones, which Nebuchadnezzar carried out from the house in Jerusalem and took to Babylon, are to be restored to the house in Jerusalem where they were placed[b], so that they may be set there.
  footnotes:
  - marker: a
    text: Or 'sacred vessels.' The Greek phrase refers to temple items dedicated for holy use.
    reason: lexical_alternative
  - marker: b
    text: Greek 'house of the Lord,' that is, the temple.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 주님의 집의 거룩한 기물들[a]—곧 금으로 된 것들과 은으로 된 것들—은 느부갓네살이 예루살렘에 있는 집에서 가져다가 바빌론으로 옮겨 간 것들인데, 예루살렘에 있는 그 집, 곧 본래 그것들이 놓여 있던 곳에 되돌려 놓고 그곳에 두도록 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성스러운 기물들’. 여기서는 성전에서 거룩한 용도로 구별된 물품들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἱερὰ σκεύη
  english_pob_choice: holy vessels
  chosen_korean: 거룩한 기물들
  alternatives_korean:
  - 거룩한 그릇들
  - 성스러운 기물들
  lexicon: LSJ
  rationale: σκεύη는 단순한 그릇보다 성전 용도의 기물·도구를 가리키므로, 문맥의 성전성까지 살린 ‘기물들’이 가장 자연스럽습니다.
- source_word: οἴκου Κυρίου
  english_pob_choice: house of the Lord
  chosen_korean: 주님의 집
  alternatives_korean:
  - 주님의 성전
  - 주님의 집
  lexicon: LSJ
  rationale: οἶκος를 직역하면 ‘집’이지만, 여기서는 성전을 가리키므로 ‘주님의 집’이 원문 구조를 유지하면서도 문맥을 드러냅니다.
- source_word: ἐξήνεγκεν ... ἀπήνεγκεν εἰς Βαβυλῶνα
  english_pob_choice: carried out ... took to Babylon
  chosen_korean: 가져다가 바빌론으로 옮겨 간
  alternatives_korean:
  - 끌어내어 바빌론으로 가져간
  - 밖으로 꺼내어 바빌론으로 옮겨 간
  lexicon: LSJ
  rationale: 두 동사의 연쇄는 성전에서 꺼내어 바빌론으로 이동시킨 과정을 나타내므로, 한국어에서는 ‘가져다가 … 옮겨 간’으로 자연스럽게 연결했습니다.
- source_word: ἀποκατασταθῆναι
  english_pob_choice: are to be restored
  chosen_korean: 다시 돌려놓아
  alternatives_korean:
  - 회복되도록
  - 원래 자리로 돌아가도록
  lexicon: LSJ
  rationale: 이 부정사구는 반환과 제자리 회복의 목적을 말하므로, 물건의 이동 맥락에 맞게 ‘다시 돌려놓아’로 옮겼습니다.
- source_word: ὅπως τεθῇ ἐκεῖ
  english_pob_choice: so that they may be set there
  chosen_korean: 거기에 놓이게 하도록 하였습니다
  alternatives_korean:
  - 그곳에 놓이게 하도록 하였습니다
  - 거기에 두도록 하였습니다
  lexicon: LSJ
  rationale: 마지막 목적절은 성전 안에 재배치되는 목적을 가리키므로, 수동적 뉘앙스를 살린 ‘놓이게 하도록’이 적절합니다.
theological_decisions:
- issue: 1세스드라스의 Κυρίου를 한국어에서 어떻게 처리할지
  chosen_reading: ‘주님’으로 옮겨, 성전 소유를 나타내는 문맥을 살리면서도 원문의 κύριος를 직접 반영했습니다.
  alternative_readings:
  - ‘여호와’
  - ‘주’
  rationale: 이 본문은 히브리어 야훼 표기가 아니라 그리스어 Κυρίου를 전하므로, 본문층위에 맞는 ‘주님’이 가장 직접적입니다.
  doctrine_reference: 'DOCTRINE.md: κύριος → Lord / 주님'
