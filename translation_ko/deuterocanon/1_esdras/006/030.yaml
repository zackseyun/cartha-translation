base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/030.yaml
  text: so that libations may be offered to God Most High for the king and his sons[b][a], and that they may pray for them.
  footnotes:
  - marker: a
    text: Or 'drink offerings' for 'libations.'
    reason: lexical_alternative
  - marker: b
    text: The Greek literally says 'and that they may pray concerning them/for them'; 'for their welfare' makes explicit the likely sense in context, referring to the king and his sons.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 왕과 그 아들들을 위하여 지극히 높으신 하나님께 전제물을 드리고, 또 그들을 위하여 기도하도록 하려는 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘전제물’은 σπονδαὶ를 옮긴 말이며, 문맥상 ‘술제물’ 또는 ‘붓는 제물’로도 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 구절의 περὶ τῆς αὐτῶν은 문맥상 왕과 그 아들들을 가리키며, 그들을 위한 기도를 뜻합니다.
    reason: source_note
lexical_decisions:
- source_word: σπονδαὶ
  english_pob_choice: libations
  chosen_korean: 전제물
  alternatives_korean:
  - 술제물
  - 붓는 제물
  - 음료제물
  lexicon: LSJ
  rationale: σπονδαὶ는 제의적으로 ‘붓는 제물’, 곧 전제물을 뜻하므로, 한국어에서도 제의적 의미가 살아 있는 ‘전제물’로 옮겼습니다.
- source_word: τῷ θεῷ τῷ ὑψίστῳ
  english_pob_choice: God Most High
  chosen_korean: 지극히 높으신 하나님
  alternatives_korean:
  - 가장 높으신 하나님
  - 지존하신 하나님
  - 지극히 높으신 하나님
  lexicon: LSJ
  rationale: 하나님의 칭호와 최상급 수식을 함께 살리되, 한국어에서 자연스럽고 경건한 표준 표현으로 옮겼습니다.
- source_word: ὑπὲρ τοῦ βασιλέως καὶ τῶν παίδων
  english_pob_choice: for the king and his sons
  chosen_korean: 왕과 그 아들들을 위하여
  alternatives_korean:
  - 왕과 그의 자손들을 위해
  - 왕과 그의 자녀들을 위하여
  lexicon: LSJ
  rationale: 왕실 문맥에서 παῖδες는 단순한 ‘아이들’보다 ‘아들들’이 더 구체적이므로, 왕조적 의미를 살려 번역했습니다.
- source_word: προσεύχωνται περὶ τῆς αὐτῶν
  english_pob_choice: they may pray for them
  chosen_korean: 그들을 위하여 기도하게 하려는 것입니다
  alternatives_korean:
  - 그들에 관하여 기도하게 하려는 것입니다
  - 그들의 복을 위하여 기도하게 하려는 것입니다
  lexicon: LSJ
  rationale: περὶ + 대명사는 문맥상 수혜를 위한 기도를 뜻하므로, 과도한 해석을 피하면서도 한국어에서 자연스러운 ‘~을 위하여 기도하다’로 옮겼습니다.
