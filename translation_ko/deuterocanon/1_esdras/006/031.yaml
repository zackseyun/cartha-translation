base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/031.yaml
  text: And issue an order that if anyone transgresses any part of what has been written and nullifies it[a], a beam shall be taken from his own property and he shall be hanged on it, and his possessions shall become royal property.
  footnotes:
  - marker: a
    text: Or, 'he shall be impaled on it' or 'suspended on it.' The Greek says 'hanged,' but the ancient punishment described may have involved impalement or public suspension on a wooden beam.
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 명령을 내리셔서, 누구든지 기록된 것들 가운데 어느 하나라도 어기고 그것을 무효로 하면, 그의 소유에서 들보를 가져다가 그를 그 위에 매달고[a], 그의 소유물은 왕실의 것이 되게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 위에 꿰뚫려 처형되다’ 또는 ‘그 위에 매달려 공개되다’. 그리스어는 기본적으로 ‘매달리다’라고 말하지만, 이 고대 형벌이 실제로 어떻게 집행되었는지는 더 구체적으로 단정하기 어렵습니다.
    reason: κρεμασθῆναι의 기본 의미인 ‘매달리다’를 본문에 유지하면서, 고대 형벌 방식에 관한 가능한 해석을 과도한 단정 없이 제시합니다.
lexical_decisions:
- source_word: προστάξαι
  english_pob_choice: issue an order
  chosen_korean: 명령을 내려
  alternatives_korean:
  - 명령하십시오
  - 분부하십시오
  lexicon: LSJ
  rationale: 행정적·공적 지시의 흐름을 살려, 현대 한국어에서 자연스럽고 공식적인 표현인 ‘명령을 내려’로 옮겼습니다.
- source_word: παραβῶσίν τι τῶν γεγραμμένων
  english_pob_choice: transgresses any part of what has been written
  chosen_korean: 기록된 것 가운데 무엇이든지 어기고
  alternatives_korean:
  - 기록된 것의 어떤 부분이라도 범하고
  - 기록된 조항 가운데 무엇이든지 위반하고
  lexicon: LSJ
  rationale: ‘어기다’는 법령·명령을 위반한다는 의미를 자연스럽게 담으며, τι τῶν γεγραμμένων의 ‘무엇이든지/어떤 부분이라도’라는 범위를 유지합니다.
- source_word: ἀκυρώσωσιν
  english_pob_choice: nullifies it
  chosen_korean: 무효로 하면
  alternatives_korean:
  - 폐기하면
  - 효력을 없애면
  lexicon: LSJ
  rationale: 법적 효력을 없앤다는 뜻을 가장 직접적으로 드러내는 표현은 ‘무효로 하다’이므로, POB의 법률 문맥을 살려 이 표현을 택했습니다.
- source_word: ἐκ τῶν ἰδίων αὐτοῦ
  english_pob_choice: from his own property
  chosen_korean: 그의 자기 재산에서
  alternatives_korean:
  - 그의 소유에서
  - 그의 재산에서
  lexicon: LSJ
  rationale: ‘자기 것들/자기 소유물’의 폭을 살리면서도, 처벌용 들보가 피고인의 소유에서 나와야 한다는 점을 분명히 하기 위해 ‘자기 재산에서’로 옮겼습니다.
- source_word: κρεμασθῆναι
  english_pob_choice: he shall be hanged
  chosen_korean: 그 위에 매달고
  alternatives_korean:
  - 그 위에 달고
  - 그 위에 처형하여
  lexicon: LSJ
  rationale: 그리스어 동사는 ‘매달다/달다’의 직접 뜻을 가지므로, 역사적 집행 방식의 세부를 과도하게 좁히지 않고 본문상 가장 직접적인 의미를 살렸습니다.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  english_pob_choice: his possessions
  chosen_korean: 그의 소유물
  alternatives_korean:
  - 그의 재산
  - 그의 소지품
  lexicon: LSJ
  rationale: 재산 전체의 몰수를 뜻하는 법률적 결과를 반영하기 위해, 물건에만 한정되지 않는 ‘소유물’을 택했습니다.
- source_word: βασιλικά
  english_pob_choice: royal property
  chosen_korean: 왕실의 것이 되게 하십시오
  alternatives_korean:
  - 왕의 소유가 되게 하십시오
  - 왕실 재산이 되게 하십시오
  lexicon: LSJ
  rationale: 형용사 βασιλικά는 ‘왕실에 속하는’이라는 뜻이므로, 몰수된 재산이 왕실 소유로 넘어간다는 법적 결과를 자연스럽게 풀어 옮겼습니다.
theological_decisions:
- issue: 처형 방식인 κρεμασθῆναι의 해석
  chosen_reading: 본문에는 ‘매달다’의 직접 의미를 두고, 구체적 집행 방식은 본문 밖으로 과도하게 단정하지 않았습니다.
  alternative_readings:
  - ‘못 박아 매달다/꿰뚫다’로 이해할 수 있음
  - ‘공개적으로 매달아 노출하다’로 이해할 수 있음
  rationale: 그리스어 자체는 매달거나 매다는 행위를 가리키지만, 고대 근동의 형벌 관행은 걸기와 노출, 때로는 더 가혹한 처형을 포함할 수 있으므로, 해석을 넓혀 두는 편이 원문의 긴장을 보존합니다.
  doctrine_reference: 문학적·역사적 불확실성은 본문이 허용하는 범위 안에서 유지합니다.
