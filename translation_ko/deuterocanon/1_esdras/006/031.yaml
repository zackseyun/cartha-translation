  source_fidelity: 그리스어는 기록된 사항을 어기고 무효로 하는 자에게, 그의 소유에서 나무/들보를 취하여 그 위에 그를 매다는 처벌과 재산의 왕실 귀속을 명하도록 합니다. 초안은 대체로 이를 반영하지만, ‘그 위에 매달고’에는 매달리는 대상(그 사람)이 명시되지 않아 들보를 매다는 것으로도 읽힐 수 있습니다.
