  terminology: ‘무효로 하다’, ‘들보’, ‘소유물’, ‘왕실의 것’은 법적·행정적 문맥에 적절합니다. κρεμασθῆναι의 기본 뜻은 본문에서 ‘매달다’로 유지하고, 처형 방식에 관한 대안은 절제된 각주로 처리하는 것이 적절합니다.
