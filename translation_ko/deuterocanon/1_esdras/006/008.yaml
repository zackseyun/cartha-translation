revisions:
- from: 우리 왕이신 주께서는 이것을 모두 아셔야 합니다. 우리가 유다 땅과 예루살렘, 그 성읍에 도착했을 때, 예루살렘, 그 성읍에서 포로 생활에 있던 유다 사람들의 장로들이 주를 위해 크고 새로운 집을 짓고 있는 것을 발견했습니다.[a]
  to: 우리 주 왕께 모든 것을 아뢰옵니다. 우리가 유다 땅과 예루살렘 성읍에 도착했을 때, 예루살렘 성읍에서 유다 사람 포로들의 장로들이 주를 위하여 크고 새 집을 짓고 있는 것을 발견했습니다.[a]
  rationale: 포괄적 보고 공식인 πάντα γνωστὰ ἔστω를 ‘모든 것을 아뢰옵니다’로 바로잡고, 포로 관련 수식어에서 현재 포로 상태라는 해석을 제거했습니다. 나머지 표현은 원문의 반복, 궁정 호칭과 신적 호칭의 구별, 그리고 οἶκος의 문자적 의미를 유지합니다.
