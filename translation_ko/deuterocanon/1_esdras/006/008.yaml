base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/008.yaml
  text: 'Let everything be known to our lord the king: when we came into the land of Judea and to Jerusalem[a], the city, we found the elders of the captivity of the Jews in Jerusalem, the city, building a great new house for the Lord[b],'
  footnotes:
  - marker: a
    text: Or, more literally, 'the elders of the Jews of the captivity.' The Greek wording is compressed; the sense is the leadership of the Jewish exile/returnee community.
    reason: lexical_alternative
  - marker: b
    text: '''House for the Lord'' refers to the temple.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리 주 왕께 모든 것을 아뢰옵니다. 우리가 유다 땅과 예루살렘 성읍에 도착했을 때, 예루살렘 성읍에서 유다 사람 포로들의 장로들이 주를 위하여 크고 새 집을 짓고 있는 것을 발견했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘집’은 성전을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα γνωστὰ ἔστω
  english_pob_choice: Let everything be known
  chosen_korean: 이것을 모두 아셔야 합니다
  alternatives_korean:
  - 모든 것이 알려져야 합니다
  - 이 모든 일이 알려지게 하십시오
  lexicon: LSJ
  rationale: 보고 문장의 명령형 성격을 살리되, 한국어에서 자연스러운 공손 보고체로 옮겼습니다.
- source_word: τῷ κυρίῳ ἡμῶν τῷ βασιλεῖ
  english_pob_choice: to our lord the king
  chosen_korean: 우리 왕이신 주께서는
  alternatives_korean:
  - 우리의 주 왕께서는
  - 우리 주 왕께서는
  lexicon: LSJ
  rationale: 여기서 κύριος는 페르시아 왕에게 붙는 궁정 호칭이므로, 하나님 호칭과 구별되도록 ‘왕이신 주’로 옮기고 경어체를 유지했습니다.
- source_word: τῆς αἰχμαλωσίας τοὺς πρεσβυτέρους τῶν Ἰουδαίων
  english_pob_choice: the elders of the Jewish exiles
  chosen_korean: 포로 생활에 있던 유다 사람들의 장로들
  alternatives_korean:
  - 포로된 유다 사람들의 장로들
  - 포로의 유다인 장로들
  lexicon: LSJ
  rationale: 압축된 그리스어를 한국어에서는 자연스럽게 풀어, ‘포로 생활’이라는 상태와 ‘유다 사람들’의 관계를 드러냈습니다.
- source_word: οἰκοδομοῦντας οἶκον
  english_pob_choice: building ... house
  chosen_korean: …집을 짓고 있는
  alternatives_korean:
  - …집을 건축하고 있는
  - …집을 세우고 있는
  lexicon: LSJ
  rationale: οἶκος의 기본값인 ‘집’을 유지하되, 문맥상 성전임을 본문에 과도하게 선해하지 않고 뒤의 주를 위해 남겼습니다.
- source_word: τῷ κυρίῳ
  english_pob_choice: for the Lord
  chosen_korean: 주를 위해
  alternatives_korean:
  - 주님을 위해
  - 주께
  lexicon: LSJ
  rationale: 이 절의 마지막 κύριος는 이스라엘의 하나님을 가리키므로, 현대 한국어에서 자연스럽고 직설적인 ‘주를 위해’로 옮겼습니다.
theological_decisions:
- issue: 같은 κύριος가 왕과 하나님 모두를 가리키는 문제
  chosen_reading: 왕에게는 ‘왕이신 주’, 하나님께는 ‘주’를 사용해 동일 어휘의 이중 지시를 드러냈습니다.
  alternative_readings:
  - 왕에는 ‘주인’, 하나님에는 ‘주님’으로 구분
  - 모두 ‘주’로만 통일
  rationale: 본문은 권위 호칭과 신적 호칭을 의도적으로 나란히 쓰므로, 한국어에서도 구분을 살리면서 원문의 중복을 보존하는 것이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: κύριος의 문맥별 번역 및 호칭 구분'
- issue: οἶκος를 ‘성전’으로 바로 옮길지 여부
  chosen_reading: 본문에는 ‘집’으로 두고, 문맥이 요구하는 성전 의미는 독자가 파악하도록 했습니다.
  alternative_readings:
  - 성전
  - 하나님의 집
  rationale: 그리스어 본문은 문자적으로 ‘집’을 말하며, POB의 영어도 이를 유지하고 있으므로 한국어도 과잉해석을 피했습니다.
  doctrine_reference: '번역 원칙: source-direct, lexical transparency'
