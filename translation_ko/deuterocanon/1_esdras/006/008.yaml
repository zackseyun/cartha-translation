review_pass:
  verdict: revise
  source_fidelity: 첫 문장의 πάντα는 ‘이것’이 아니라 포괄적인 ‘모든 것/모든 일’을 뜻합니다. 또한 τῆς αἰχμαλωσίας는 장로들이 현재도 ‘포로 생활에 있던’ 상태라는 뜻으로 한정하지 않으므로, 원문의 압축성과 역사적 지시를 더 잘 보존하도록 ‘유다 사람 포로들의 장로들’로 수정하는 것이 안전합니다. ‘유다 땅과 예루살렘 성읍에’, ‘발견했습니다’, ‘주를 위하여 크고 새 집을 짓고’는 그리스어의 구조와 뜻을 충실히 반영합니다.
  naturalness: ‘우리 주 왕께 모든 것을 아뢰옵니다’는 왕에게 올리는 서신·보고의 정중한 관용 표현으로, 현대 표준어 합쇼체 안에서 자연스럽습니다. ‘예루살렘 성읍’은 원문의 동격적 반복을 과도하게 되풀이하지 않으면서 보존합니다.
  terminology: 왕을 가리키는 κύριος는 ‘우리 주 왕’, 하나님을 가리키는 κύριος는 ‘주’로 구별했습니다. οἶκος는 본문에서 ‘집’으로 유지하고, 성전이라는 문맥상 의미는 각주로 설명합니다.
