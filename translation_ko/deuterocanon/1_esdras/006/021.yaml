translation:
  language: ko
  text: 또한 만일 예루살렘에 있는 주님의 집을 세운 일이[a] 고레스 왕의 승인에 따라 이루어진 것으로 밝혀지고, 우리 주 왕께서 좋게 여기시면, 이 일들에 관해 우리에게 알려 주시기 바랍니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 '예루살렘에 있는 주님의 건축'이라고 합니다. 문맥상 이는 '예루살렘에 있는 주님의 집, 곧 성전의 건축'을 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: μετὰ τῆς γνώμης Κύρου τοῦ βασιλέως
  english_pob_choice: with the approval of Cyrus the king
  chosen_korean: 고레스 왕의 승인과 함께
  alternatives_korean:
  - 고레스 왕의 결정에 따라
  - 고레스 왕의 허락으로
  - 고레스 왕의 동의와 함께
  lexicon: LSJ
  rationale: γνώμη는 의견, 판단, 승인, 의사 등을 가질 수 있으며, 이 행정 문맥에서는 단순한 생각이 아니라 왕의 공식적 승인으로 읽는 것이 자연스럽습니다.
- source_word: τὴν οἰκοδομὴν τοῦ κυρίου τοῦ ἐν Ἰερουσαλήμ
  english_pob_choice: the building of the house of the Lord in Jerusalem
  chosen_korean: 예루살렘에 있는 주님의 집을 세운 일
  alternatives_korean:
  - 예루살렘에 있는 주님의 성전을 세운 일
  - 예루살렘에 있는 주님의 건축을 한 일
  lexicon: LSJ
  rationale: 그리스어는 문자적으로는 '예루살렘에 있는 주님의'이지만, 문맥상 성전/집을 뜻하므로 '주님의 집'을 보완해 주었습니다. '세운 일'은 완료된 건축 행위를 자연스럽게 드러냅니다.
- source_word: τῷ κυρίῳ βασιλεῖ ἡμῶν
  english_pob_choice: to our lord the king
  chosen_korean: 우리 주 왕께서
  alternatives_korean:
  - 우리 주 왕에게
  - 우리의 주권자 왕께서
  - 우리의 군주 왕께서
  lexicon: LSJ
  rationale: κύριος는 여기서 하나님 칭호가 아니라 페르시아 왕에 대한 궁정식 존칭이므로, 한국어에서도 존칭을 살려 '우리 주 왕'으로 옮겼습니다.
- source_word: προσφωνησάτω ἡμῖν περὶ τούτων
  english_pob_choice: let him send us word about these matters
  chosen_korean: 이 일들에 관해 우리에게 알려 주십시오
  alternatives_korean:
  - 이 일들에 관해 우리에게 말해 주십시오
  - 이 일들에 대해 우리에게 회답해 주십시오
  - 이 일들에 관해 우리에게 전해 주십시오
  lexicon: LSJ
  rationale: 동사는 문자적으로 '말해 주다/호명하다'에 가깝지만, 행정 문맥에서는 공식적 통보를 뜻하므로 '알려 주십시오'가 가장 자연스럽습니다.
theological_decisions:
- issue: 예루살렘의 주님의 건축물을 어떻게 이해할지
  chosen_reading: 본문은 단순한 일반 건물이 아니라 성전 건축을 가리키는 것으로 이해했습니다.
  alternative_readings:
  - 문자적으로 '주님의 건축'으로 옮길 수 있음
  - 일반적인 집 짓기처럼 이해할 수 있음
  rationale: 영어 POB의 주석처럼, 그리스어는 압축적으로 말하지만 문맥 전체는 예루살렘 성전 공사를 가리킵니다. 한국어 본문에는 이를 드러내되, 주석은 따로 두지 않았습니다.
  doctrine_reference: 성전/성막 어휘의 문맥적 확장
- issue: κύριος의 이중 용례를 한국어에서 구분하는 방식
  chosen_reading: 하나님을 가리키는 주님과 왕을 가리키는 존칭 '우리 주 왕'을 구분했습니다.
  alternative_readings:
  - 두 곳 모두 '주'로 옮김
  - 왕을 '주인님'처럼 더 직접적으로 옮김
  rationale: 같은 어형이지만 참조 대상이 다르므로, 한국어에서도 신적 호칭과 왕실 존칭을 구분해야 의미가 흐려지지 않습니다.
  doctrine_reference: κύριος의 문맥적 번역
