base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/007.yaml
  text: 'A copy of the letter that Sisinnes[a], the governor of Syria and Phoenicia, and Sathrabuzanes, and their associates, the rulers in Syria and Phoenicia, wrote and sent to King Darius: Greetings.'
  footnotes:
  - marker: a
    text: The Greek text has a slight grammatical shift from singular ('was writing') to plural ('they sent'). The translation renders the clause smoothly in English as a collective action by the named officials.
    reason: textual_variant
translation:
  language: ko
  text: 시리아와 페니키아의 총독 시시네스[a]와 사트라부자네스, 그리고 시리아와 페니키아에 있는 통치자들인 그들의 동료들이 다리우스 왕께 써서 보낸 편지의 사본입니다. 다리우스 왕께 문안드립니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 ‘썼다’에서 단수형을, ‘보냈다’에서 복수형을 사용합니다. 번역은 이름이 열거된 관리들이 그 편지를 공동으로 작성하고 발송한 것으로 자연스럽게 옮겼습니다.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀντίγραφον ἐπιστολῆς
  english_pob_choice: A copy of the letter
  chosen_korean: 사본은 … 편지입니다
  alternatives_korean:
  - 편지의 사본입니다
  - 서신의 사본입니다
  lexicon: LSJ
  rationale: Ἀντίγραφον은 문서의 ‘사본’이며, ἐπιστολή는 공식적인 ‘편지’이므로 문서성을 살려 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: ὁ ἔπαρχος Συρίας καὶ Φοινίκης
  english_pob_choice: the governor of Syria and Phoenicia
  chosen_korean: 시리아와 페니키아의 총독
  alternatives_korean:
  - 시리아와 페니키아의 통치관
  - 시리아와 페니키아의 감독관
  lexicon: LSJ
  rationale: ἔπαρχος는 행정 구역을 다스리는 관직을 가리키므로, 본문 맥락에 맞는 현대적 행정어인 ‘총독’을 택했습니다.
- source_word: οἱ συνέταιροι οἱ ἐν Συρίᾳ καὶ Φοινίκῃ ἡγεμόνες
  english_pob_choice: their associates, the rulers in Syria and Phoenicia
  chosen_korean: 시리아와 페니키아의 통치자들인 그들의 동료들
  alternatives_korean:
  - 그들의 동료들인 시리아와 페니키아의 통치자들
  - 그 지역의 관료들인 그들의 동료들
  lexicon: LSJ
  rationale: συνέταιροι는 단순한 친구보다 공식적·행정적 ‘동료들’이 자연스럽고, ἡγεμόνες는 이미 ἔπαρχος를 ‘총독’으로 옮긴 뒤라 반복을 피하면서 ‘통치자들’로 넓게 살렸습니다.
- source_word: Βασιλεῖ Δαρείῳ χαίρειν
  english_pob_choice: 'To King Darius: Greetings.'
  chosen_korean: 다리우스 왕께 … 문안드립니다
  alternatives_korean:
  - 다리우스 왕께 … 안부를 전합니다
  - 다리우스 왕께 평안합니다
  lexicon: LSJ
  rationale: χαίρειν은 서신 관용구로서 직역보다 공식적인 서두·결말 기능을 살린 ‘문안드립니다’가 자연스럽습니다.
theological_decisions:
- issue: 문서 서두의 서간체를 어떻게 처리할 것인가
  chosen_reading: 서간 공식을 현대 한국어 문체로 살리되, ‘문안드립니다’로 마무리해 고대 편지의 관용적 인사말을 드러냈습니다.
  alternative_readings:
  - 직역하여 ‘기뻐하라’로 옮김
  - ‘안부를 전합니다’로 평이하게 처리
  rationale: 본문의 χαίρειν은 일반 명령이 아니라 서신 인사 공식이므로, 한국어 독자에게 같은 기능을 전달하는 표현이 필요합니다.
  doctrine_reference: 문체/장르 처리
