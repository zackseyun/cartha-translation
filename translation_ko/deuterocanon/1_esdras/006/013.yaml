    rationale: 전승 그리스어의 압축되고 난해한 구문상 시간적 해석을 택할 수 있으나, ‘위대하고 강한 이스라엘 왕에 의해/통하여’라는 대안도 독자에게 알려야 합니다.
  - severity: low
