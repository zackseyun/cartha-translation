base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/013.yaml
  text: And the house was being built over many years before the time of a great and mighty king of Israel[b][a], and it was completed.
  footnotes:
  - marker: a
    text: Or, 'by a great and mighty king of Israel.' The Greek clause is compressed and can be taken instrumentally, though the context favors a temporal-historical sense.
    reason: alternative_reading
  - marker: b
    text: '''The house'' refers to the temple.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 집은 위대한 강한 이스라엘의 왕 이전에 여러 해에 걸쳐 지어지고 있었으며, 마침내 완공되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집’은 성전을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 문장은 압축되어 있어, ‘여러 해에 걸쳐’와 ‘이전’의 시간적 관계를 자연스럽게 풀어 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: οἰκοδομεῖτο
  english_pob_choice: was being built
  chosen_korean: 지어지고 있었으며
  alternatives_korean:
  - 건축되고 있었으며
  - 세워지고 있었으며
  lexicon: BDAG
  rationale: 미완료 수동형의 진행·지속성을 살려, 단순 완료보다 공사 진행 중임을 드러내는 표현을 택했습니다.
- source_word: ὁ οἶκος
  english_pob_choice: the house
  chosen_korean: 그 집
  alternatives_korean:
  - 그 성전
  - 그 집(성전)
  lexicon: LSJ
  rationale: 원문은 문자적으로 ‘집’이지만, 문맥상 성전을 가리키므로 본문에서는 원어의 표면형을 살리되 자연스러운 한국어로 옮겼습니다.
- source_word: ἔμπροσθεν ... ἐτῶν πλειόνων
  english_pob_choice: before the time of / over many years
  chosen_korean: 이전에는 여러 해에 걸쳐
  alternatives_korean:
  - 여러 해 전에
  - 오랜 세월 동안
  lexicon: LSJ
  rationale: 전승된 그리스어가 다소 압축되어 있어, 시간적 선행과 긴 공사 기간을 함께 드러내도록 풀어 옮겼습니다.
- source_word: ἐπετέλεσθη
  english_pob_choice: it was completed
  chosen_korean: 마침내 완공되었습니다
  alternatives_korean:
  - 완성되었습니다
  - 끝마쳐졌습니다
  lexicon: BDAG
  rationale: 완료 동사의 의미를 자연스럽고 분명하게 살리되, 성전 건축 문맥에 맞는 공식적인 표현을 사용했습니다.
theological_decisions:
- issue: ‘이 집’의 지시 대상
  chosen_reading: 문자적으로는 ‘집’이지만 문맥상 성전을 뜻한다고 이해했습니다.
  alternative_readings:
  - 처음부터 ‘성전’으로 의역함
  - ‘집’과 ‘성전’을 병기함
  rationale: 원문 투명성을 우선하면서도 독자가 문맥에서 성전임을 알아볼 수 있게 했습니다.
  doctrine_reference: Translation philosophy §§1, 6
- issue: 이스라엘의 ‘위대한 강한 왕’ 표현
  chosen_reading: 직역에 가깝게 유지하되, 한국어 어순에 맞게 자연스럽게 배치했습니다.
  alternative_readings:
  - 솔로몬으로 명시함
  - 의미를 풀어 ‘솔로몬 왕’으로 옮김
  rationale: 전승 본문은 압축적이며 이름을 직접 말하지 않으므로, 원문이 가진 역사적 암시를 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3
