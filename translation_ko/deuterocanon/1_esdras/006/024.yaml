revisions:
- from: 그들이 계속 타오르는 불로 제사를 드리게 하십시오. 그 제단의 높이는 육십 규빗이고 너비도 육십 규빗이며, 다듬은 돌 세 단과 새로 된 토착 목재 한 단으로 하십시오. 그리고 그 비용은 왕 고레스의 궁에서 대도록 하십시오.
  to: 그들이 계속 타는 불로 제사를 드리게 하십시오. 그것의 높이는 육십 규빗, 너비도 육십 규빗으로 하고, 다듬은 돌 세 줄과 새 현지 목재 한 줄로 하십시오. 또 그 비용은 고레스 왕의 왕실에서 지급하게 하십시오.
  rationale: 제단이라는 비명시적 선행사를 제거하여 그리스어의 지시 대상 अस्पष्ट성을 보존했습니다. 건축 문맥의 δόμος를 ‘줄’로, 새 현지산 목재를 자연스러운 현대어로 조정했으며, 왕의 οἶκος는 비용을 내는 왕실의 의미가 드러나게 옮겼습니다. 명령형 어조는 영어 POB 감사 번역의 ‘Let them … let the expense be given’과 문맥상 지시의 기능을 따라 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:04:02Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 제사의 지속적인 불, 치수, 돌과 목재의 단, 비용의 왕실 부담을 대체로 충실히 반영합니다. 그러나 그리스어에는 제단(βωμός 등)이 명시되어 있지 않은데 관계절의 선행사를 ‘그 제단’으로 특정하여 근거 없는 대상을 보탰습니다. 또한 δόμος는 여기서 건축 재료의 ‘단/줄(course)’이므로 ‘줄’이 더 정확합니다.
  naturalness: 합쇼체의 지시문 형식은 자연스럽습니다. ‘새로 된 토착 목재’는 현대 한국어에서 다소 부자연스러우므로 ‘새 현지 목재’로 다듬는 것이 좋습니다. ‘궁에서’는 비용의 출처로는 장소적 의미가 강하므로 ‘왕실에서 지급하게’가 자연스럽습니다.
  terminology: ‘규빗’, ‘제사를 드리다’, ‘고레스 왕’은 적절합니다. ξυστός는 ‘다듬은’으로, ἐγχώριος는 ‘현지’로 옮겼습니다. 원문의 관계절 선행사가 이 절 자체에서는 명시적으로 드러나지 않으므로 ‘그것’으로 처리하여 초안의 ‘제단’ 특정화를 피했습니다.
  issues:
  - severity: medium
    issue: ‘그 제단의’라는 선행사 특정
    rationale: 원문은 관계대명사로 치수를 연결할 뿐 이 절에서 제단을 명시하지 않습니다. 제단을 삽입하면 원문보다 의미를 좁힙니다.
  - severity: low
    issue: 건축 단위 δόμος의 번역
    rationale: ‘돌 세 단’도 가능하지만, 석재와 목재의 건축적 course를 나타내는 문맥에서는 ‘세 줄/한 줄’이 더 분명합니다.
  - severity: low
    issue: ‘왕 고레스의 궁에서’
    rationale: οἶκος는 왕의 궁전이라는 장소보다 왕실/왕가의 재정적 출처를 가리킬 수 있으므로, 비용 지급 문맥에서는 ‘왕실에서’가 더 적합합니다.
  revised_text: 그들이 계속 타는 불로 제사를 드리게 하십시오. 그것의 높이는 육십 규빗, 너비도 육십 규빗으로 하고, 다듬은 돌 세 줄과 새 현지 목재 한 줄로 하십시오. 또 그 비용은 고레스 왕의 왕실에서 지급하게 하십시오.
