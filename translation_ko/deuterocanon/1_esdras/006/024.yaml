  text: Let them offer sacrifices with continual fire, whose height is sixty cubits and width sixty cubits, with three courses of polished stone and one course of new local timber; and let the expense be given from the house of Cyrus the king.
translation:
  language: ko
  text: 그들이 계속 타오르는 불로 제사를 드리게 하십시오. 그 제단의 높이는 육십 규빗이고 너비도 육십 규빗이며, 다듬은 돌 세 단과 새로 된 토착 목재 한 단으로 하십시오. 그리고 그 비용은 왕 고레스의 궁에서 대도록 하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θύουσιν διὰ πυρὸς ἐνδελεχοῦς
  english_pob_choice: Let them offer sacrifices with continual fire
  chosen_korean: 계속 타오르는 불로 제사를 드리게 하십시오
  alternatives_korean:
  - 끊임없는 불로 제사를 드리게 하십시오
  - 항상 타는 불로 희생제사를 드리게 하십시오
  lexicon: θύω; διὰ πυρός; ἐνδελεχής
  rationale: θύουσιν은 ‘제사를 드리다’로, διὰ πυρὸς ἐνδελεχοῦς는 단순한 불이 아니라 지속되는 불의 수단을 나타내어 ‘계속 타오르는 불로’가 자연스럽고 원문 밀착적입니다.
- source_word: οὓ τὸ ὕψος πηχέων ἑξήκοντα, πλάτος πηχέων ἑξήκοντα
  english_pob_choice: whose height is sixty cubits and width sixty cubits
  chosen_korean: 그 제단의 높이는 육십 규빗이고 너비도 육십 규빗이며
  alternatives_korean:
  - 그것의 높이는 육십 규빗이고 폭도 육십 규빗이며
  - 높이 육십 규빗, 너비 육십 규빗인
  lexicon: ὕψος; πλάτος; πηχέων
  rationale: 관계대명사 οὓ는 바로 앞 대상인 제단을 가리키므로, 한국어에서는 ‘그 제단의’로 풀어주어 문맥을 명확히 했습니다.
- source_word: δόμων λιθίνων ξυστῶν τριῶν καὶ δόμου ξυλίνου ἐγχωρίου καινοῦ ἑνός
  english_pob_choice: with three courses of polished stone and one course of new local timber
  chosen_korean: 다듬은 돌 세 단과 새로 된 토착 목재 한 단으로 하십시오
  alternatives_korean:
  - 다듬은 돌 세 단과 새 토착 목재 한 단으로 하십시오
  - 매끈한 돌 세 층과 현지산 새 목재 한 층으로 하십시오
  lexicon: δόμος; λιθίνων ξυστῶν; ξυλίνου ἐγχωρίου καινοῦ
  rationale: δόμος는 건축의 ‘단/층’을 뜻하므로 ‘한 단/세 단’으로 옮겼고, ἐγχωρίου는 ‘토착/현지’의 뉘앙스를 살려 ‘토착 목재’로 표현했습니다.
- source_word: ἐκ τοῦ οἴκου Κύρου τοῦ βασιλέως
  english_pob_choice: from the house of Cyrus the king
  chosen_korean: 왕 고레스의 궁에서
  alternatives_korean:
  - 왕 고레스의 집에서
  - 고레스 왕의 왕실에서
  lexicon: οἶκος; Κῦρος; βασιλεύς
  rationale: οἶκος는 여기서 단순 주택보다 왕실 재정·궁정 범위를 가리키므로 ‘궁’이 자연스럽고, 고유명사는 통용 표기인 ‘고레스’를 사용했습니다.
theological_decisions:
- issue: 희생제물/제사와 지속되는 불의 관계
  chosen_reading: 제사 행위를 명시하되, 불은 제사의 수단으로 유지되는 지속성에 초점을 두었습니다.
  alternative_readings:
  - 불 자체를 제물로 드린다고 읽는 번역
  - 제단에 불을 놓으라는 명령으로만 좁히는 번역
  rationale: διὰ πυρὸς ἐνδελεχοῦς는 제사의 방식과 지속성을 함께 말하므로, 희생 제사의 행위와 계속 타오르는 불의 관계를 모두 드러내는 것이 원문에 가장 가깝습니다.
  doctrine_reference: 제사·성전 재건 문맥
