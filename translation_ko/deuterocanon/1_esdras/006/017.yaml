base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/017.yaml
  text: And the holy vessels[a], the gold and the silver ones, which Nebuchadnezzar had carried out from the house in Jerusalem and deposited in his own temple—Cyrus the king again brought them out from the temple in Babylon, and they were handed over to Zerubbabel and to Sanabassar the governor.
  footnotes:
  - marker: a
    text: Greek Σαβανασσάρ; likely corresponding to the name often rendered 'Sheshbazzar' in Ezra.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 예루살렘에 있는 집에서 느부갓네살이 꺼내어 자기 신전에 두었던 거룩한 기물들, 곧 금 기물들과 은 기물들을 고레스 왕이 바빌론에 있는 신전에서 다시 꺼냈고, 그것들은 스룹바벨과 총독 사바나사르에게 넘겨졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 Σαβανασσάρ의 음역입니다. 에스라서의 더 익숙한 형태 ‘세스바살’과 대응될 가능성이 큽니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἱερὰ σκεύη
  english_pob_choice: holy vessels
  chosen_korean: 거룩한 기물들
  alternatives_korean:
  - 성스러운 기물들
  - 성소의 기물들
  - 거룩한 그릇들
  lexicon: LSJ
  rationale: σκεύη는 단순한 ‘그릇’보다 성전용 기물 전반을 가리킬 수 있으므로, ‘기물들’이 범위를 넓게 유지하면서도 ‘ἱερά’의 거룩함을 살립니다.
- source_word: τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ
  english_pob_choice: the gold and the silver ones
  chosen_korean: 금과 은의 것들
  alternatives_korean:
  - 금과 은의 기물들
  - 금으로 된 것들과 은으로 된 것들
  - 금붙이와 은붙이
  lexicon: LSJ
  rationale: 형용사가 명사처럼 쓰여 앞의 기물을 다시 지시하므로, 한국어에서는 ‘것들’로 받되 재질 구분을 분명히 하여 원문의 대구를 살렸습니다.
- source_word: οἴκου τοῦ ἐν Ἰερουσαλήμ
  english_pob_choice: the house in Jerusalem
  chosen_korean: 예루살렘에 있는 집
  alternatives_korean:
  - 예루살렘에 있는 성전
  - 예루살렘의 집
  - 예루살렘에 있는 신전
  lexicon: LSJ
  rationale: 여기서는 ναός와 구별되는 οἶκος를 ‘집’으로 옮겨, 뒤의 바빌론 ‘신전’과의 어휘 대비를 보존했습니다.
- source_word: ἀπηρείσατο αὐτὰ ἐν τῷ αὐτοῦ ναῷ
  english_pob_choice: deposited them in his own temple
  chosen_korean: 자기 신전 안에 두었던
  alternatives_korean:
  - 자기 신전에 보관했던
  - 자기 신전에 넣어 두었던
  - 자기 신전에 맡겨 두었던
  lexicon: LSJ
  rationale: ἀπηρείσατο는 단순한 ‘두다’보다 정식으로 옮겨 놓는 뉘앙스가 있어 ‘두었던’으로 자연화하되, 소유격 ‘자기’로 대비를 분명히 했습니다.
- source_word: Σαβανασσάρῳ τῷ ἐπάρχῳ
  english_pob_choice: Sanabassar the governor
  chosen_korean: 총독 사바나사르
  alternatives_korean:
  - 사바나사르 총독
  - 사나바살 총독
  - 세스바살
  lexicon: transliteration
  rationale: 그리스어형 고유명사를 우선 따라 ‘사바나사르’로 옮기고, τῷ ἐπάρχῳ는 문맥상 행정관 직함인 ‘총독’으로 옮겼습니다.
theological_decisions:
- issue: εἰς/ἐκ 대비에 따른 회복 서술의 방향
  chosen_reading: 느부갓네살이 예루살렘 집에서 꺼내어 자기 신전에 둔 물건을 고레스가 다시 꺼내어 돌려주는 회복의 흐름을 살렸습니다.
  alternative_readings:
  - 단순히 두 번의 이동만 나열하는 평이한 표현
  - ‘다시 가져오다’로만 처리하여 반전성을 약화시키는 표현
  rationale: 이 절은 약탈과 환수를 대조하며 포로 귀환의 복원 주제를 드러내므로, ‘다시 꺼내어’와 ‘넘겨주었습니다’로 서술적 반전을 유지했습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 1, 5
