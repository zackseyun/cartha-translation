revisions:
- from: 그리고 예루살렘에 있는 집에서 느부갓네살이 꺼내어 자기 신전 안에 두었던 거룩한 기물들, 곧 금과 은의 것들을 고레스 왕이 바빌론에 있는 신전에서 다시 꺼내어 스룹바벨과 총독 사바나사르에게 넘겨주었습니다.[a]
  to: 그리고 예루살렘에 있는 집에서 느부갓네살이 꺼내어 자기 신전에 두었던 거룩한 기물들, 곧 금 기물들과 은 기물들을 고레스 왕이 바빌론에 있는 신전에서 다시 꺼냈고, 그것들은 스룹바벨과 총독 사바나사르에게 넘겨졌습니다.[a]
