  terminology: 고유명은 한국어 성경의 통용 표기인 ‘다리오, 학개, 스가랴, 잇도’를 사용했습니다. Κυρίου θεοῦ Ἰσραήλ은 ‘이스라엘의 하나님이신 주’로 옮겨 그리스어의 호칭 및 동격 관계를 반영했습니다.
