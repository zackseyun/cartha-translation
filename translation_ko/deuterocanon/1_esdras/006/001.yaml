base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/001.yaml
  text: Now in the second year of the reign of Darius[a], Haggai and Zechariah son of Iddo, the prophets, prophesied to the Jews who were in Judea and Jerusalem in the name of the Lord God of Israel[c][b], to them.
  footnotes:
  - marker: a
    text: Or 'Judah and Jerusalem,' following the Hebrew parallel more closely; the Greek reads 'Judea and Jerusalem.'
    reason: lexical_alternative
  - marker: b
    text: The closing phrase 'over them' could also be understood as 'concerning them' or, less likely in context, simply 'to them.' The Greek and Hebrew both preserve this somewhat compressed wording.
    reason: alternative_reading
  - marker: c
    text: The Greek text has a duplicated article before 'prophets' ('the the prophets'), likely a scribal or transmission irregularity; the translation gives the intended sense.
    reason: textual_variant
translation:
  language: ko
  text: 다리오 왕이 다스린 지 둘째 해에, 예언자 학개와 잇도의 아들 스가랴가 유대와 예루살렘에 있는 유대인들에게 이스라엘의 하나님이신 주의 이름으로 그들을 두고 예언하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어의 마지막 표현은 직역하면 ‘그들 위에’입니다. 문맥상 ‘그들을 두고’ 또는 ‘그들에게’로도 이해될 수 있으나, 그리스어와 히브리어 평행본문 모두 이 압축된 표현을 보존합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ δευτέρῳ ἔτει τῆς Δαρείου βασιλείας
  english_pob_choice: Now in the second year of the reign of Darius
  chosen_korean: 이제 다리오의 통치 제2년에
  alternatives_korean:
  - 그리고 다리오의 통치 제2년에
  - 다리오의 통치 제2년에
  lexicon: LSJ
  rationale: δὲ의 가벼운 연결감은 ‘이제’로 살리고, βασιλεία는 여기서 ‘나라’보다 왕의 통치 기간인 ‘통치’로 옮기는 편이 source에 더 가깝습니다.
- source_word: Ἀγγαῖος καὶ Ζαχαρίας ὁ τοῦ Ἐδδεὶν
  english_pob_choice: Haggai and Zechariah son of Iddo
  chosen_korean: 학개와 이드도의 아들 스가랴
  alternatives_korean:
  - 학개와 이드도의 아들인 스가랴
  - 학개와 이드도의 아들 스가랴
  lexicon: LSJ
  rationale: 그리스어의 단수 친족관계 표현은 스가랴에게 붙는 것으로 읽는 것이 자연스럽고, 히브리어 평행본문의 בַר־עִדּוֹא도 이를 뒷받침합니다.
- source_word: ἐπὶ τοὺς Ἰουδαίους τοὺς ἐν τῇ Ἰουδαίᾳ καὶ Ἰερουσαλήμ
  english_pob_choice: to the Jews who were in Judea and Jerusalem
  chosen_korean: 유다와 예루살렘에 있는 유다 사람들에게
  alternatives_korean:
  - 유대와 예루살렘에 있는 유다 사람들에게
  - 유다와 예루살렘에 있는 유대인들에게
  lexicon: BDAG
  rationale: ἐπί는 여기서 적대가 아니라 예언의 대상/청자를 가리키므로 ‘~에게’로 옮겼고, Ἰουδαίοι는 본문 맥락상 민족명으로서 ‘유다 사람들’이 더 직접적입니다.
- source_word: ἐπὶ τῷ ὀνόματι Κυρίου θεοῦ Ἰσραήλ
  english_pob_choice: in the name of the Lord, the God of Israel
  chosen_korean: 야훼, 이스라엘의 하나님 이름으로
  alternatives_korean:
  - 주, 이스라엘의 하나님 이름으로
  - 야훼 하나님의 이름으로
  lexicon: BDAG
  rationale: source의 ‘이름으로’라는 공적 권위 표현을 살리되, κύριος는 야훼의 직접 인용·호칭으로 이해하여 본 프로젝트 기본값인 ‘야훼’로 옮겼습니다.
- source_word: ἐπ’ αὐτούς
  english_pob_choice: over them
  chosen_korean: 그들을 향해
  alternatives_korean:
  - 그들 위에
  - 그들에 대하여
  lexicon: BDAG
  rationale: 끝의 ἐπί는 메시지의 방향성을 남기면서도 한국어에서 어색한 ‘위에’보다, 예언이 그들에게 향했다는 뜻을 드러내는 ‘그들을 향해’가 더 자연스럽습니다.
theological_decisions:
- issue: κύριος의 한국어 처리와 야훼 표기
  chosen_reading: 그리스어 본문에서 κυρίου는 하나님의 이름을 가리키는 호칭으로 읽어 ‘야훼’로 옮기고, 뒤의 ‘이스라엘의 하나님’을 병기하여 호칭의 신학적 무게를 보존합니다.
  alternative_readings:
  - 주
  - 주님
  rationale: 본문은 예언의 권위를 하나님의 이름에 직접 연결하므로, 단순한 호칭어 ‘주’보다 성경적 고유명 표기인 ‘야훼’가 source의 강도를 더 잘 반영합니다.
  doctrine_reference: 'DOCTRINE.md: יהוה / YHWH → 야훼; κύριος의 문맥상 신명 호칭 처리'
- issue: ἐπὶ/עַל의 방향성
  chosen_reading: ‘그들을 향해 예언하였습니다’
  alternative_readings:
  - 그들에게 예언하였습니다
  - 그들 위에 예언하였습니다
  - 그들에 대하여 예언하였습니다
  rationale: 이 구절은 예언이 유다 공동체를 향한 권위 있는 선포라는 점을 드러내므로, 적대나 단순 대상화가 아닌 방향성을 가진 표현이 가장 적절합니다.
  doctrine_reference: 예언 행위의 수신자/대상 표지
