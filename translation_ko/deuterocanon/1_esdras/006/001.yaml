  rationale: 명시되지 않은 ‘이제’를 제거하고, 그리스어 κύριος를 ‘주’로 바로잡았습니다. 첫 번째 ἐπί는 예언의 수신자를 나타내는 ‘유대인들에게’로, 마지막 ἐπ’ αὐτούς는 독립된 모호성을 보존하는 ‘그들을 두고’로 옮겼습니다. 문장을 현대 표준어 합쇼체로 다듬고 고유명 표기를 통일했습니다.
