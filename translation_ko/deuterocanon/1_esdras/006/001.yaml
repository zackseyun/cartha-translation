revisions:
- from: 이제 다리오의 통치 제2년에, 학개와 이드도의 아들 스가랴, 곧 예언자들이 유다와 예루살렘에 있는 유다 사람들에게 야훼, 이스라엘의 하나님 이름으로 그들을 향해 예언하였습니다.[a]
