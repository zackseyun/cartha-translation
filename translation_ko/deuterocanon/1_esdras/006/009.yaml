  source_fidelity: 그리스어의 건축 자재, 성실한 수행, 작업의 순조로운 진전, 그리고 완성의 수식어를 전반적으로 잘 반영합니다. 다만 ‘번성하며’는 한국어에서 공사·작업의 진전에 다소 부자연스럽고, δόξα를 건축 문맥에서 ‘영광’으로만 옮기면 의미가 지나치게 추상화됩니다.
