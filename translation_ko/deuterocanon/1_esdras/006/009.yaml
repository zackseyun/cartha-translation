base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/009.yaml
  text: with costly hewn stones[a], with timber laid in the buildings, and those works being done with diligence, and the work prospering in their hands[b], being completed with all glory and care.
  footnotes:
  - marker: a
    text: Or 'with haste' for 'with diligence'; the Greek phrase ἐπὶ σπουδῆς can emphasize urgency as well as earnest care.
    reason: lexical_alternative
  - marker: b
    text: '''Glory'' here likely carries the sense of splendor or magnificence in the workmanship, not only honor in an abstract sense.'
    reason: cultural_note
translation:
  language: ko
  text: 값비싼 다듬은 돌과 건물에 들이는 목재를 사용하여, 그 일들이 열심히 이루어지고, 그 공사가 그들의 손에서 순조롭게 진행되어, 온갖 화려함과 세심한 주의로 완성되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: σπουδή는 여기서 ‘부지런함, 열심’뿐 아니라 ‘서둘러’라는 뉘앙스도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: δόξα는 이 문맥에서 단순한 ‘영예’보다 공사의 화려함이나 장엄함을 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: λίθων ξυστῶν πολυτελῶν
  english_pob_choice: costly hewn stones
  chosen_korean: 값비싼 다듬은 돌들
  alternatives_korean:
  - 값비싼 깎은 돌들
  - 정교하게 다듬은 귀한 돌들
  lexicon: LSJ
  rationale: ξυστῶν은 원석이 아니라 손질된 건축용 돌을 가리키고, πολυτελῶν은 값비싼·귀한 성격을 더하므로, 건축 문맥을 살려 “값비싼 다듬은 돌들”로 옮겼습니다.
- source_word: ξύλων τιθεμένων ἐν τοῖς οἴκοις
  english_pob_choice: timber laid in the buildings
  chosen_korean: 건물들 안에 놓인 목재
  alternatives_korean:
  - 집들 안에 놓인 목재
  - 건축물에 들인 나무
  lexicon: LSJ
  rationale: οἴκοις는 여기서 가정집보다 건축물/건물의 범위를 가리키는 것이 자연스럽고, τιθεμένων은 “놓이다/배치되다”의 수동 분사이므로 구조를 그대로 살렸습니다.
- source_word: ἐπὶ σπουδῆς
  english_pob_choice: with diligence
  chosen_korean: 부지런히
  alternatives_korean:
  - 서둘러
  - 열심히
  lexicon: BDAG/LSJ
  rationale: σπουδή는 “부지런함, 열심, 진지함”과 함께 경우에 따라 “서둘러”도 뜻하지만, 이 건축 보고 문맥에서는 조급함보다 성실한 추진이 더 적절하여 “부지런히”로 옮겼습니다.
- source_word: εὐοδούμενον τὸ ἔργον ἐν ταῖς χερσὶν αὐτῶν
  english_pob_choice: the work prospering in their hands
  chosen_korean: 그들의 손에서 그 일이 번성하며
  alternatives_korean:
  - 그들의 손에서 그 일이 잘 되어 가며
  - 그들의 손에서 그 일이 성공하며
  lexicon: LSJ
  rationale: εὐοδόω의 핵심은 “잘되다, 번성하다, 순조롭게 진행되다”이므로, “손에서”라는 관용적 표현을 살리면서 진행의 성과를 드러내는 “번성하며”를 택했습니다.
- source_word: ἐν πάσῃ δόξῃ καὶ ἐπιμελείᾳ
  english_pob_choice: with all glory and care
  chosen_korean: 모든 영광과 세심함으로
  alternatives_korean:
  - 모든 화려함과 세심함으로
  - 온갖 장엄함과 주의로
  lexicon: LSJ
  rationale: δόξα는 여기서 추상적 ‘영광’보다 공사와 완성의 격조를 드러내는 ‘화려함/장엄함’의 뉘앙스도 있으나, 한국어 본문에서는 문맥의 높임을 유지하면서도 자연스러운 “영광”을 쓰고, ἐπιμέλεια는 “세심함”으로 옮겼습니다.
theological_decisions:
- issue: δόξα의 의미 범위
  chosen_reading: 건축 작업의 품위와 장엄함을 포함하는 ‘영광’으로 유지하되, 단순한 내적 명예감으로 축소하지 않았습니다.
  alternative_readings:
  - 화려함
  - 장엄함
  - 영예
  rationale: 이 절은 성전/건축 보고의 문맥이므로 δόξα는 단지 추상적 명예가 아니라 시각적·미학적 풍성함까지 함축할 수 있습니다. 한국어 본문은 ‘영광’으로 두고, 의미는 번역 선택에서 과도하게 좁히지 않았습니다.
  doctrine_reference: 구약 성전 건축의 성소적/왕실적 장엄성
