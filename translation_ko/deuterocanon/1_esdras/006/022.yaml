  - 이런 것들이 기록된
  - 이런 내용이 적힌
  lexicon: LSJ
  rationale: 공식 문서의 기록 형식을 살려, 뒤에 오는 내용이 두루마리에 적혀 있었다는 점을 자연스럽게 표현했습니다.
theological_decisions:
- issue: 장소명과 관청 기록의 역사 서술 방식
  chosen_reading: 본문을 예언적·신학적 확대 없이, 왕실 문서 수색과 발견이라는 역사 서술로 직역에 가깝게 옮겼습니다.
  alternative_readings:
  - 보다 해설적으로 풀어 쓰는 번역
  - 문서의 법적 권위를 강조하는 번역
  rationale: 이 절은 신학적 논쟁보다 기록 발견의 사실 전달이 핵심이므로, 서술의 객관성과 문서성을 유지하는 것이 원문 의도에 충실합니다.
  doctrine_reference: 성경 번역의 역사-서술 본문 처리 원칙
- issue: 두루마리/기록의 지시 대상
  chosen_reading: ‘두루마리’로 옮겨 실제로 발견된 문서 매체를 드러냈습니다.
  alternative_readings:
  - ‘기록’으로 일반화
  - ‘문서’로 평탄화
  rationale: 헬라어 τόπος는 문자 그대로는 ‘장소’이지만, 문맥상 발견된 기록 문서로 이해되는 점이 영어 POB의 수정에도 반영되어 있으므로 그 의미를 살렸습니다.
  doctrine_reference: 본문 비평과 문맥적 의미 우선 원칙
