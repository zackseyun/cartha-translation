  - 문서가 발견되었습니다
  lexicon: BDAG
  rationale: 영어 POB의 후속 수정이 반영한 문서 맥락을 따라, 여기서는 실제로 발견된 대상이 두루마리임을 드러냈습니다.
- source_word: ὑπομνημάτιστο τάδε
  english_pob_choice: had been recorded
  chosen_korean: 이런 기록이 적힌
  alternatives_korean:
