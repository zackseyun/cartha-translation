base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/023.yaml
  text: In the first year of the reign of Cyrus[a], King Cyrus gave orders that the house of the Lord in Jerusalem should be built, where they offer continual sacrifices by fire,
  footnotes:
  - marker: a
    text: Or, 'where they sacrifice with continual fire.' The Greek phrase is compact and may describe the place as one of ongoing fire-offerings.
    reason: lexical_alternative
translation:
  language: ko
  text: 고레스의 치세 첫 해에, 고레스 왕은 예루살렘에 있는 주의 집을 건축하라고 명령했습니다. 그곳에서 그들은 끊임없는 불로 제사를 드립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 끊임없는 불로 제사를 드리는 곳’으로 옮길 수 있습니다. 그리스어 표현은 간결해서 제의 장소를 가리키는 말일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτους πρώτου βασιλεύοντος Κύρου
  english_pob_choice: In the first year of the reign of Cyrus
  chosen_korean: 고레스의 치세 첫 해에
  alternatives_korean:
  - 고레스가 통치하던 첫 해에
  - 고레스의 통치 첫 해에
  lexicon: LSJ
  rationale: 그리스어의 연대 표지는 왕의 재위 연도를 나타내므로, 한국어에서도 자연스러운 왕실 연대 표현으로 옮겼습니다.
- source_word: βασιλεὺς Κῦρος
  english_pob_choice: King Cyrus
  chosen_korean: 고레스 왕은
  alternatives_korean:
  - 왕 고레스는
  - 고레스는
  lexicon: LSJ
  rationale: 본문에 명시된 왕호를 분명히 살리기 위해 이름 뒤에 ‘왕’을 붙였습니다.
- source_word: τὸν οἶκον τοῦ κυρίου
  english_pob_choice: the house of the Lord
  chosen_korean: 주의 집을
  alternatives_korean:
  - 주님의 집을
  - 주님의 성전을
  lexicon: LSJ
  rationale: οἶκος의 직역인 ‘집’을 유지해 원문 이미지를 살리되, 문맥상 성전임은 자연스럽게 드러나게 했습니다.
- source_word: ἐπιθύουσιν διὰ πυρὸς ἐνδελεχοῦς
  english_pob_choice: they offer continual sacrifices by fire
  chosen_korean: 끊임없는 불로 제사를 드립니다
  alternatives_korean:
  - 계속해서 불로 제사를 드립니다
  - 끊임없이 불로 제사를 드립니다
  lexicon: LSJ
  rationale: ἐπιθύουσιν의 제의적 의미를 ‘제사를 드리다’로 풀고, διὰ πυρὸς ἐνδελεχοῦς는 반복적 화제(불로 드리는 제사)의 지속성을 살려 옮겼습니다.
theological_decisions:
- issue: κύριος의 한국어 처리
  chosen_reading: ‘주의’로 옮겨 일반적 본문 흐름을 유지했습니다.
  alternative_readings:
  - ‘야훼의’로 옮김
  - ‘주님’으로 옮김
  rationale: 이 구절은 1 Esdras의 헬라어 본문으로, 히브리어 טetragrammaton 직접 대응이 아니라 κυρίου를 포함하므로 본문 용례에 맞게 ‘주’로 번역했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → 주/주님'
