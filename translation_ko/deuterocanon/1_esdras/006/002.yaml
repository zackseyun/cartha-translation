base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/002.yaml
  text: Then Zerubbabel son of Salathiel and Jeshua son of Josedek stood up and began to build the house of the Lord in Jerusalem[a], while the prophets of the Lord were with them[c][b], helping them.
  footnotes:
  - marker: a
    text: Or 'arose.' The Greek participle can mark taking action as well as the physical act of standing.
    reason: lexical_alternative
  - marker: b
    text: Greek 'Jeshua' is Ἰησοῦς, the same form often rendered 'Jesus' in Greek contexts; here it refers to the postexilic high priest, not Jesus of Nazareth.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew parallel context names Haggai and Zechariah among the prophets supporting the rebuilding, though this Greek verse refers to them simply as 'the prophets of the Lord.'
    reason: cross_reference
translation:
  language: ko
  text: 그때 스룹바벨—살라디엘의 아들—과 예수아—여사닥의 아들—가 일어나 예루살렘에 있는 주님의 집을 짓기 시작했습니다. 주님의 예언자들이 그들과 함께 있어 그들을 도왔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘일어나’는 στάς의 문자적 동작과 ‘착수하다’의 관용적 의미를 함께 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: Ἰησοῦς는 여기서 나사렛 예수가 아니라 포로기 이후 대제사장 예수아를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 이 그리스어 절은 예언자들을 일반적으로 말하지만, 히브리어 평행본문은 주변 문맥에서 학개와 스가랴를 명시합니다.
    reason: cross_reference
lexical_decisions:
- source_word: στάς
  english_pob_choice: stood up
  chosen_korean: 일어나
  alternatives_korean:
  - 일어서
  - 일어나서
  lexicon: LSJ
  rationale: aorist participle ἵστημι의 행동 개시 뉘앙스를 살리되, 한국어에서는 자연스럽고 간결하게 ‘일어나’로 풀어 움직임과 착수를 함께 드러냈습니다.
- source_word: Ζοροβαβὲλ ὁ τοῦ Σαλαθιὴλ
  english_pob_choice: Zerubbabel son of Salathiel
  chosen_korean: 스룹바벨—살라디엘의 아들—
  alternatives_korean:
  - 스룹바벨, 살라디엘의 아들
  - 스룹바벨—스알디엘의 아들—
  lexicon: LSJ
  rationale: 인명은 통용되는 성서형을 따르되, Greek의 Σαλαθιήλ을 그대로 반영하기 위해 ‘살라디엘’로 옮겼습니다. 관계절 구조는 한국어에서 삽입구로 처리했습니다.
- source_word: Ἰησοῦς ὁ τοῦ Ἰωσεδὲκ
  english_pob_choice: Jeshua son of Josedek
  chosen_korean: 예수아—여사닥의 아들—
  alternatives_korean:
  - 예수아—요사닥의 아들—
  - 예수—여사닥의 아들—
  lexicon: LSJ
  rationale: 이 문맥의 Ἰησοῦς는 나사렛 예수가 아니라 포로기 이후 대제사장 예수아이므로, 혼동을 피하면서도 역사적 인물을 드러내는 ‘예수아’를 택했습니다. Ἰωσεδέκ은 Greek 형태를 따라 ‘여사닥’으로 옮겼습니다.
- source_word: τὸν οἶκον τοῦ κυρίου
  english_pob_choice: the house of the Lord
  chosen_korean: 주님의 집
  alternatives_korean:
  - 주님의 집
  - 주님의 성전
  lexicon: LSJ
  rationale: source의 ‘집’ 이미지를 유지하면서도 한국어에서는 자연스럽게 읽히도록 했습니다. ‘성전’은 의미는 맞지만 해석을 앞당기는 표현이라 기본 본문에서는 보류했습니다.
- source_word: τῶν προφητῶν τοῦ κυρίου
  english_pob_choice: the prophets of the Lord
  chosen_korean: 주님의 예언자들이
  alternatives_korean:
  - 주님의 예언자들이
  - 주님의 선지자들이
  lexicon: LSJ
  rationale: POB의 ‘prophets’는 구약 문맥에서 전통어 ‘선지자’도 가능하지만, 한국어 본문은 더 직접적인 ‘예언자’로 옮겨 원문 기능을 분명히 했습니다.
- source_word: βοηθούντων αὐτοῖς
  english_pob_choice: helping them
  chosen_korean: 그들을 도왔습니다
  alternatives_korean:
  - 그들을 도왔습니다
  - 그들에게 도움을 주었습니다
  lexicon: LSJ
  rationale: 현재분사의 지속적 도움을 한국어 과거 서술로 자연스럽게 풀되, 실제 건축 지원의 의미가 분명하게 드러나도록 했습니다.
theological_decisions:
- issue: κύριος의 번역을 주님의 집/주님의 예언자들에 일관되게 반영할지 여부
  chosen_reading: 주님/주님의
  alternative_readings:
  - 야훼
  - 주
  rationale: 이 절의 κύριος는 본문상 직접적인 신적 칭호로 기능하므로, 프로젝트 기본값에 따라 ‘주님’으로 옮겼습니다. 1 Esdras는 Greek 본문을 1차로 삼으므로 본문에 야훼를 도입하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: κύριος → 주님; deuterocanonical Greek primary witness'
