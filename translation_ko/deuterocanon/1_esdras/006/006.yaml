  verdict: revise
  source_fidelity: 그리스어의 수동 표현과 행정 절차의 순서는 대체로 잘 반영되었습니다. 다만 ὑποσημανθῆναι는 단순한 ‘소식’보다 사안에 관한 공식 보고를 뜻하는 것이 자연스럽고, προσφωνηθῆναι는 문맥상 회답으로 이해할 수 있으나 ‘말을 건네다/통지하다’라는 어휘적 여지도 있으므로 각주에서 더 직접적으로 밝혀야 합니다.
  naturalness: ‘그들에 관한 소식’은 한국어 행정 문맥에서 다소 부자연스럽습니다. ‘그들에 관한 보고가 다리우스에게 올라가고 회답이 내려질 때까지’가 현대 표준어 합쇼체에서 더 자연스럽고, 원문의 공식적 성격도 잘 드러냅니다.
  terminology: ‘건축을 방해받지 않았습니다’는 적절합니다. ‘보고가 올라가고’와 ‘회답이 내려질’은 고대 왕실 행정 문맥을 과도하게 현대화하지 않으면서도 자연스럽게 전달합니다. ‘다리우스’ 표기도 적절합니다.
