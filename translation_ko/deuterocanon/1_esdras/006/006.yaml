base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/006.yaml
  text: and they were not hindered from building until word about them should be sent to Darius and a reply should be returned[a].
  footnotes:
  - marker: a
    text: Or 'and an answer should be given.' The Greek verb can denote being addressed or receiving an official response; the context favors an administrative reply after the report to Darius.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 다리우스에게 그들에 관한 소식이 전달되고 답변이 보내질 때까지 건축을 방해받지 않았습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리고 응답이 주어질 때까지’. 그리스어 동사는 공식적 회신을 받는 뜻도 가질 수 있으며, 문맥상 다리우스에게 보고한 뒤 내려오는 행정적 답변을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἐκωλύθησαν
  english_pob_choice: they were not hindered
  chosen_korean: 방해받지 않았습니다
  alternatives_korean:
  - 저지당하지 않았습니다
  - 막히지 않았습니다
  lexicon: BDAG
  rationale: κωλύω의 수동은 ‘방해/저지’의 의미가 자연스럽고, 여기서는 공사의 진행이 제지되지 않았다는 점을 간결하게 살리는 것이 적절합니다.
- source_word: τῆς οἰκοδομῆς
  english_pob_choice: from building
  chosen_korean: 건축
  alternatives_korean:
  - 건축 공사
  - 짓는 일
  lexicon: BDAG
  rationale: 문맥상 진행 중인 성전 건축을 가리키므로 명사형으로 자연스럽게 옮기되, 행위의 지속성을 유지했습니다.
- source_word: ὑποσημανθῆναι
  english_pob_choice: word ... should be sent
  chosen_korean: 소식이 전달되고
  alternatives_korean:
  - 보고가 올려지고
  - 통지가 전달되고
  lexicon: LSJ
  rationale: 이 동사는 공식적으로 알리거나 보고하는 뜻을 가지므로, 다리우스에게 전달되는 행정적 통신의 흐름을 살려 번역했습니다.
- source_word: προσφωνηθῆναι
  english_pob_choice: a reply should be returned
  chosen_korean: 답변이 보내질 때까지
  alternatives_korean:
  - 응답이 주어질 때까지
  - 대답이 돌아올 때까지
  lexicon: LSJ
  rationale: 뒤의 동사는 공식적인 회신을 가리키므로 ‘답변’으로 옮겼습니다. 단순한 대답보다 행정적 회신의 성격을 더 잘 드러냅니다.
theological_decisions:
- issue: 행정적 두 동사의 중복 의미 처리
  chosen_reading: ‘소식이 전달되고 답변이 보내질 때까지’로 옮겨, 보고와 회신의 두 단계가 있다는 점을 유지했습니다.
  alternative_readings:
  - ‘보고되고 응답이 주어질 때까지’
  - ‘알려지고 회답이 올 때까지’
  rationale: 본문은 공사가 중단되지 않은 기간을 행정 절차의 완료 시점으로 규정하므로, 보고와 회신의 순서를 한국어에서도 분명히 보존하는 것이 중요합니다.
  doctrine_reference: 본문의 서술 구조 보존
