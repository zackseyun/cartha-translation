base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/075.yaml
  text: And now, for a little while, mercy has come to us from the Lord, the Lord, to leave us a root and a name in this holy place,
translation:
  language: ko
  text: 이제 잠시 동안, 주, 주님께서 우리에게 자비를 베푸셔서 이 거룩한 곳에서 우리에게 뿌리와 이름을 남겨 주셨습니다.[a][b][c]
  philosophy: formal
  footnotes:
  - marker: a
    text: 직역하면 “잠시 동안”에 해당하는 시간 표현입니다.
    reason: source_note
  - marker: b
    text: 그리스어 본문은 “뿌리”라고 하며, POB 본문도 이를 따릅니다.
    reason: previous_rendering
  - marker: c
    text: ὁ κύριος Κυρίος의 중복 호칭을 살린 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: κατὰ πόσον τι
  english_pob_choice: for a little while
  chosen_korean: 잠시 동안
  alternatives_korean:
  - 얼마간
  - 짧은 동안
  lexicon: κατά + πόσος + τι
  rationale: 시간의 짧음을 나타내는 완곡한 표현으로, POB의 'for a little while'을 자연스럽고 간결한 한국어로 옮겼습니다.
- source_word: ἔλεος
  english_pob_choice: mercy
  chosen_korean: 자비
  alternatives_korean:
  - 긍휼
  - 은혜
  lexicon: ἔλεος
  rationale: 하나님의 베푸심이라는 뜻을 살리되, 이 문맥의 감사 표현에는 한국어로 가장 직접적인 '자비'가 자연스럽습니다.
- source_word: παρὰ τοῦ κυρίου Κυρίου
  english_pob_choice: from the Lord, the Lord
  chosen_korean: 주, 주님께서
  alternatives_korean:
  - 주님, 주님께서
  - 주 하나님께서
  lexicon: κύριος
  rationale: 그리스어의 중복된 κύριος를 그대로 반영해 '주, 주님'으로 옮기고, 문장 흐름상 주어 표지를 붙여 반복의 강조를 살렸습니다.
- source_word: ῥίζαν
  english_pob_choice: a root
  chosen_korean: 뿌리
  alternatives_korean:
  - 후손
  - 남은 뿌리
  lexicon: ῥίζα
  rationale: POB의 개정된 'a root'를 따라, 혈통적 지속성과 생명의 근원을 떠올리게 하는 직역적 표현인 '뿌리'를 유지했습니다.
- source_word: ἁγιάσματος
  english_pob_choice: this holy place
  chosen_korean: 이 거룩한 곳
  alternatives_korean:
  - 이 성소
  - 이 성결의 장소
  lexicon: ἁγίασμα
  rationale: 공간을 가리키는 말이므로 '곳'으로 풀고, 성별된 장소라는 의미를 살려 '거룩한'을 붙였습니다.
theological_decisions:
- issue: κύριος Κυρίου의 중복 호칭 처리
  chosen_reading: 주, 주님
  alternative_readings:
  - 주님, 주님
  - 야훼, 주님
  rationale: 본문의 반복을 삭제하지 않고 한국어에서도 두 번의 호칭으로 드러내어 강조를 보존했습니다. 다만 이 구절은 인용문이 아니므로 야훼로 바꾸지 않았습니다.
  doctrine_reference: 본문 문맥 보존 및 호칭 중복의 수사적 강조
