base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/006.yaml
  text: In the seventh year of the reign of Artaxerxes[a], in the fifth month—they arrived at Jerusalem; for they had set out from Babylon on the new moon of the first month[c][b], and they came to Jerusalem according to the prosperity of the journey given to them by the Lord upon him.
  footnotes:
  - marker: a
    text: The Greek text here contains a difficult clause, 'this year was the second for the king,' which does not fit the context and is absent from the Hebrew parallel (Ezra 7:6–9). It is likely a textual corruption or displacement, so it is not represented in the main translation.
    reason: textual_variant
  - marker: b
    text: 'The Hebrew parallel focuses on Ezra in the singular: ''This Ezra went up from Babylon ... and the king granted him all his request, according to the hand of the LORD his God upon him'' (Ezra 7:6). The Greek of 1 Esdras here shifts to plural forms (''they arrived,'' ''given to them'').'
    reason: alternative_reading
  - marker: c
    text: Literally, 'upon him.' The sense is likely that the Lord's favor or hand was upon Ezra, as made explicit in the Hebrew parallel.
    reason: lexical_alternative
translation:
  language: ko
  text: 아르타크세르크세스의 통치 제7년, 다섯째 달에—그들은 예루살렘에 도착하였습니다. 이는 그들이 첫째 달 초하루에 바빌론에서 출발하였기 때문이며, 주께서 그들에게 주신 형통한 여행을 따라 예루살렘에 이른 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문에는 ‘이 해는 왕에게 둘째 해였다’라는 난해한 절이 있으나, 문맥과 맞지 않고 히브리어 평행본문에도 없으므로 본문에는 반영하지 않았습니다.
    reason: textual_variant
  - marker: b
    text: 히브리어 평행본문은 에스라 개인의 상승을 말하지만, 이 그리스어 본문은 복수형으로 진행됩니다.
    reason: alternative_reading
  - marker: c
    text: 직역하면 ‘그 위에’이지만, 문맥상 주님의 호의나 손이 에스라 위에 임한 뜻으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτους ἑβδόμου βασιλεύοντος Ἀρταξέρξου
  english_pob_choice: In the seventh year of the reign of Artaxerxes
  chosen_korean: 아르타크세르크세스의 통치 제7년
  alternatives_korean:
  - 아르타크세르크세스의 재위 제7년에
  - 아르타크세르크세스가 통치한 지 7년째에
  lexicon: LSJ
  rationale: 왕의 연대 표시는 한국어에서도 간결한 관용적 표현으로 옮겨야 하므로 ‘통치 제7년’으로 처리했습니다.
- source_word: ἐν τῷ πέμπτῳ μηνί
  english_pob_choice: in the fifth month
  chosen_korean: 다섯째 달에
  alternatives_korean:
  - 제5월에
  - 다섯 번째 달에
  lexicon: LSJ
  rationale: 달(月) 표시는 본문의 시간 부사를 자연스럽게 살려 ‘다섯째 달’로 번역했습니다.
- source_word: τῇ νουμηνίᾳ τοῦ πρώτου μηνός
  english_pob_choice: on the new moon of the first month
  chosen_korean: 첫째 달 초하루에
  alternatives_korean:
  - 첫째 달의 신월에
  - 첫째 달의 초하루에
  lexicon: LSJ
  rationale: νουμηνία는 문자적으로 ‘신월’이지만, 한국어 성경 문맥에서는 날짜 표현인 ‘초하루’가 더 직접적이어서 이렇게 옮겼습니다.
- source_word: παρεγένοντο εἰς Ἰερουσαλήμ
  english_pob_choice: they arrived at Jerusalem
  chosen_korean: 그들은 예루살렘에 도착하였습니다
  alternatives_korean:
  - 그들은 예루살렘에 이르렀습니다
  - 그들은 예루살렘에 왔습니다
  lexicon: LSJ
  rationale: 성취된 도착을 분명히 드러내는 동사이므로 ‘도착하였습니다’로 옮겼습니다.
- source_word: κατὰ τὴν δοθεῖσαν αὐτοῖς εὐοδίαν
  english_pob_choice: according to the prosperous journey given to them
  chosen_korean: 주께서 그들에게 주신 형통한 여행을 따라
  alternatives_korean:
  - 주께서 그들에게 주신 좋은 여행을 따라
  - 그들에게 주어진 형통한 여정을 따라
  lexicon: LSJ
  rationale: εὐοδία는 단순한 ‘성공’보다 ‘형통한 여행/길’의 뜻이 강하므로, 여행의 결과와 과정을 함께 살리는 표현을 택했습니다.
- source_word: ἐπʼ αὐτῷ
  english_pob_choice: upon him
  chosen_korean: 그들에게
  alternatives_korean:
  - 그 위에
  - 그에게
  lexicon: LSJ
  rationale: 본문 전후맥락에서 Greek의 ‘upon him’은 히브리어 평행본문의 ‘주님의 손이 그에게’에 해당하는 짧은 표현으로 보이므로, 본문에는 자연스러운 한국어로 풀어 반영하고 직역은 주석으로 처리했습니다.
theological_decisions:
- issue: 본문의 κυρίου를 한국어로 어떻게 옮길지
  chosen_reading: 주
  alternative_readings:
  - 주님
  - 주 하나님
  rationale: 1 Esdras의 그리스어 본문을 따라 κύριος를 ‘주’로 유지하되, 히브리어 평행본문의 YHWH를 본문에 직접 대체하지는 않았습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → 주'
- issue: 그리스어 본문의 난해한 'upon him' 구문을 한국어 본문에 어떻게 반영할지
  chosen_reading: 주께서 그들에게 주신 형통한 여행을 따라
  alternative_readings:
  - 주께서 그 위에
  - 주께서 그에게
  rationale: 히브리어 평행본문이 에스라 개인에게 주님의 손이 임했음을 분명히 하므로, 그 의미를 살려 한국어 본문에서는 여행의 형통으로 풀어 옮기고, 직역의 어색함은 본문 밖에서 해결하지 않았습니다.
  doctrine_reference: Ezra 7:9 parallel; source-critical alignment
