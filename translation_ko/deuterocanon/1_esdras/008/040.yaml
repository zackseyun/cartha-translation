  source_fidelity: 그리스어 καὶ μετʼ αὐτῶν ἄνδρες ἑβδομήκοντα는 ‘그리고/또 그들과 함께 남자 칠십 명’이라는 간결한 열거입니다. 초안의 ‘칠십 명’은 수는 정확하지만 ἄνδρες의 남성 지시를 본문에서 중화합니다. 이를 ‘남자 칠십 명’으로 명시하는 편이 원문에 더 충실합니다.
  naturalness: ‘또 그들과 함께 남자 칠십 명이 있었습니다’는 한국어 성경식 열거 문맥에서 자연스럽고 합쇼체 문장 종결을 유지합니다. 기존 본문의 중복 각주 표기 ‘ᵃ[a]’는 단일 표기로 바로잡아야 합니다.
  terminology: ἄνδρες는 일반적 사람들이 아니라 남자들을 뜻하므로 ‘남자’로 옮겼습니다. 숫자는 그리스어 본문을 따라 ‘칠십’으로 유지했습니다. 각주는 히브리어 병행 본문이 근사 병행이며 수치가 ‘백십 명의 남자’라는 점을 분명히 합니다.
  issues:
