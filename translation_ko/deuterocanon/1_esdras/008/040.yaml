    issue: ἄνδρες의 성별 지시가 본문 번역에서 빠졌습니다.
    rationale: 그리스어 ἄνδρες는 여기서 남성들을 가리키므로, 단순히 ‘칠십 명’이라고 하면 원문의 명시적 정보를 잃습니다.
  - severity: medium
    issue: 본문에 각주 표기가 ‘ᵃ[a]’로 중복되어 있습니다.
    rationale: 각주 앵커는 하나만 있어야 하며, 중복 표기는 독자와 조판 체계 모두에 혼선을 줍니다.
  - severity: low
