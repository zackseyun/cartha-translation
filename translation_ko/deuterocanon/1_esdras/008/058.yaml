base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/058.yaml
  text: And I said to them[a], “You also are holy to the Lord, and the vessels are holy, and the silver and the gold are a vow offering to the Lord[b], the Lord of our fathers.”
  footnotes:
  - marker: a
    text: Or, more literally from the Greek, “a vow offering” or “an offering.” The Hebrew parallel has “a freewill offering.”
    reason: lexical_alternative
  - marker: b
    text: The Greek text here reads approximately “to the Lord, Lord of our fathers,” while the Hebrew parallel has “to the Lord, the God of your fathers.” The main text reflects the Greek pronoun perspective with the fuller covenantal sense supported by the Hebrew parallel.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 내가 그들에게 말했습니다. “여러분도 주님께 거룩하며, 그 기물들도 거룩합니다. 은과 금도 주님께, 곧 우리 조상들의 주님께 바친 서원 예물입니다[a][b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ‘서원’(εὐχή)은 여기서 서원 예물 또는 헌물을 뜻할 수 있습니다. 병행 히브리어 본문은 ‘자원 예물’이라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 본문은 “주님, 우리 조상들의 주님”에 가깝습니다. 병행 히브리어 본문은 “주님, 너희 조상들의 하나님”이라고 합니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἅγιοί
  english_pob_choice: holy
  chosen_korean: 거룩
  alternatives_korean:
  - 성별된
  - 구별된
  lexicon: BDAG
  rationale: 성전 맥락에서 ἅγιοί는 하나님께 속한 거룩한 상태를 가리키므로, 한국어로는 교회적 관용보다 직설적인 ‘거룩’이 원문의 제의적·신학적 힘을 가장 잘 살립니다.
- source_word: τῷ κυρίῳ
  english_pob_choice: to the Lord
  chosen_korean: 주님께
  alternatives_korean:
  - 주님을 위하여
  - 주께
  lexicon: BDAG
  rationale: 헌정과 소속을 나타내는 여격이므로 ‘주님께’가 가장 자연스럽고, 프로젝트 기본어인 ‘주님’을 유지합니다.
- source_word: σκεύη
  english_pob_choice: vessels
  chosen_korean: 기물
  alternatives_korean:
  - 그릇
  - 집기
  lexicon: BDAG
  rationale: 성전 물품의 목록 문맥에서 단순한 식기보다 더 포괄적인 ‘기물’이 원문의 성소용 도구/용기를 넓게 담습니다.
- source_word: εὐχή
  english_pob_choice: freewill offering
  chosen_korean: 서원 예물
  alternatives_korean:
  - 자원 예물
  - 서원 제물
  - 헌물
  lexicon: BDAG
  rationale: 그리스어 εὐχή는 ‘서원’ 뉘앙스를 가질 수 있어 이를 살리되, 본문이 실제 헌납물에 대해 말하므로 ‘예물’로 옮겨 제의적 성격을 분명히 했습니다. 영어 POB의 ‘freewill offering’과 병행 본문의 자발적 헌납 의미를 함께 반영합니다.
- source_word: κυρίῳ τῶν πατέρων ἡμῶν
  english_pob_choice: the Lord, the God of our fathers
  chosen_korean: 우리 조상들의 주님, 곧 우리 조상들의 하나님
  alternatives_korean:
  - 우리 조상들의 주님
  - 우리 조상들의 하나님
  lexicon: BDAG
  rationale: 그리스어는 ‘우리 조상들의 주님’이지만, 병행 본문의 ‘우리 조상들의 하나님’이 언약적 정체성을 더 분명히 하므로 ‘곧’으로 설명적 apposition을 살렸습니다. ‘우리’는 그리스어의 인칭 관점을 유지합니다.
theological_decisions:
- issue: εὐχή의 제의적 의미를 어떻게 한국어로 드러낼 것인가
  chosen_reading: 서원 예물
  alternative_readings:
  - 서원 제물
  - 자원 예물
  - 헌물
  rationale: 원문은 단순한 ‘선물’보다 서원/헌납의 종교적 성격을 띠며, 병행 본문도 자발적 헌납을 지지합니다. ‘서원 예물’은 서원과 실제 헌납의 긴장을 과도하게 풀지 않으면서 의미를 보존합니다.
  doctrine_reference: 원문 우선 번역 원칙; 병행 본문은 의미 판단의 보조 자료로 사용
- issue: 마지막 호칭을 그리스어와 히브리어 병행 사이에서 어떻게 처리할 것인가
  chosen_reading: 우리 조상들의 주님, 곧 우리 조상들의 하나님
  alternative_readings:
  - 우리 조상들의 주님
  - 우리 조상들의 하나님
  - 우리 조상들의 주님, 우리 조상들의 하나님
  rationale: 그리스어와 병행 히브리어 사이에 명시적 차이가 있으므로, 둘 중 하나를 삭제하기보다 설명적 apposition으로 함께 드러내어 출처상 긴장을 보존했습니다.
  doctrine_reference: 원문 비평과 병행본문 비교를 통한 투명성 유지
