base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/061.yaml
  text: And after setting out from the place Thera on the twelfth day of the first month[a], they came to Jerusalem by the mighty hand of our Lord that was upon us; and he rescued us from every enemy from the outset[c][b], and they came to Jerusalem.
  footnotes:
  - marker: a
    text: The Greek names the departure point as 'Thera'; the Hebrew parallel in Ezra 8:31 reads 'the river Ahava.' Because 1 Esdras is translated from the Greek here, 'Thera' is kept in the main text.
    reason: alternative_reading
  - marker: b
    text: The Greek phrase literally reads something like 'from the approach/entrance from every enemy,' which is difficult in context. The Hebrew parallel has 'from the hand of the enemy and ambush on the way,' which supports the sense 'from every enemy encountered on the way.'
    reason: textual_variant
  - marker: c
    text: Some Greek wording here appears irregular, including a shift from 'us' to 'they came.' The translation smooths this to 'we came' to match the surrounding first-person narrative and the Hebrew parallel.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 그들은 첫째 달 열둘째 날에 테라의 장소에서 출발하여, 우리 위에 있는 우리 주의 강한 손을 따라 예루살렘에 이르렀습니다. 그분은 길에서 모든 원수의 손아귀에서 우리를 건져 주셨고, 우리는 예루살렘에 이르렀습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 출발지를 ‘테라의 장소’로 부르며, 히브리어 병행본문은 ‘아하와 강’으로 읽습니다. 1 에스드라에서는 그리스어 본문을 따라 테라를 본문에 유지했습니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어의 ‘ἀπὸ τῆς εἰσόδου ἀπὸ παντὸς ἐχθροῦ’는 문맥상 난해합니다. 병행하는 히브리어 본문은 ‘원수의 손과 길의 매복’으로 읽히므로, 본문에서는 길 위의 적대 상황으로 옮겼습니다.
    reason: textual_variant
  - marker: c
    text: 마지막의 ‘그들은/그들이 왔습니다’라는 주어 불일치는 그리스어 본문 전승의 불규칙을 반영합니다. 문맥상 첫 사람 복수를 살린 번역은 본문 흐름과 병행본문을 고려한 조정입니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἀναζεύξαντες
  english_pob_choice: after setting out
  chosen_korean: 출발하여
  alternatives_korean:
  - 길을 떠나
  - 출발한 뒤에
  - 진군하여
  lexicon: LSJ
  rationale: 여행의 시작과 이동을 자연스럽게 드러내는 동사로, ‘떠나다’보다 공문체 서술에 맞는 ‘출발하다’를 택했습니다.
- source_word: τοῦ τόπου Θερὰ
  english_pob_choice: the place Thera
  chosen_korean: 테라의 장소
  alternatives_korean:
  - 테라
  - 테라의 곳
  - 테라 지역
  lexicon: LSJ
  rationale: 그리스어가 출발지를 ‘테라’라는 고유명으로 지시하므로 이를 음역해 살렸고, 히브리어 병행본문의 ‘아하와 강’과의 긴장은 본문 주석 없이 본문에서 임의로 조화시키지 않았습니다.
- source_word: τῇ δωδεκάτῃ τοῦ πρώτου μηνὸς
  english_pob_choice: on the twelfth day of the first month
  chosen_korean: 첫째 달 열둘째 날에
  alternatives_korean:
  - 첫째 달의 열둘째 날에
  - 첫째 달 열두째 날에
  lexicon: LSJ
  rationale: 달력 표현은 한국어 성경체에서 자연스러운 순서로 옮기되, ‘첫째 달’과 날짜를 간결하게 유지했습니다.
- source_word: κατὰ τὴν κραταιὰν χεῖρα τοῦ κυρίου ἡμῶν τὴν ἐφʼ ἡμῖν
  english_pob_choice: by the mighty hand of our Lord that was upon us
  chosen_korean: 우리 위에 있는 우리 주의 강한 손을 따라
  alternatives_korean:
  - 우리 위에 있는 우리 주의 강한 손으로
  - 우리에게 임한 우리 주의 강한 손으로
  - 우리 위에 있던 우리 주의 강한 손에 따라
  lexicon: LSJ
  rationale: ‘강한 손’은 출애굽적 구원의 관용구를 살리는 표현이므로 유지했고, κατὰ를 본문 흐름에 맞게 ‘따라’로 옮겨 원인의 의미를 드러냈습니다.
- source_word: ἐρύσατο
  english_pob_choice: he rescued us
  chosen_korean: 건져 주셨고
  alternatives_korean:
  - 구해 주셨고
  - 건져 내셨고
  - 구원하셨고
  lexicon: LSJ
  rationale: 위험에서 빼내는 구체적 의미를 살리되, 문맥상 종교적 구원어로 과도하게 확대하지 않기 위해 ‘건져 주셨다’를 선택했습니다.
- source_word: ἀπὸ τῆς εἰσόδου ἀπὸ παντὸς ἐχθροῦ
  english_pob_choice: from every enemy from the outset
  chosen_korean: 길에서 모든 원수의 손아귀에서
  alternatives_korean:
  - 출발할 때부터 모든 원수에게서
  - 들어가는 길에서 모든 원수에게서
  - 길목의 모든 원수에게서
  lexicon: LSJ
  rationale: 그리스어 표현이 문맥상 난해하므로, 영어 POB의 본문 주석처럼 길 위의 적대 상황이라는 의미를 한국어로 자연화했습니다. ‘손아귀’는 포획과 위협을 함께 드러냅니다.
