  source_fidelity: 현 초안은 ‘이방 민족들로부터, 곧 그들의 더러움에서’라고 하여 민족 목록을 ‘더러움’의 동격처럼 처리합니다. 그리스어의 열거는 이방 민족들을 특정하며, 부정함은 그들과 관련된 분리 실패의 범주입니다. 이를 한국어 문장 안에서 명확히 연결할 필요가 있습니다.
  naturalness: ‘…않았습니다. — 가나안 사람들과 …입니다’는 완결된 문장 뒤에 민족 목록이 독립문처럼 놓여 자연스럽지 않고, ‘곧 그들의 더러움에서’도 선행 명사와의 관계가 어색합니다. 목록을 ‘이방 민족들’ 뒤에 삽입하면 현대 한국어 문장으로 자연스럽습니다.
