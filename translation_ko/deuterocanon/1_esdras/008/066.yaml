base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/066.yaml
  text: The rulers and the priests and the Levites have not separated themselves from the foreign nations of the land, with their uncleannesses—from the Canaanites and Hittites and Perizzites and Jebusites and Moabites and Egyptians and Edomites.
  footnotes:
  - marker: a
    text: Or 'have not kept themselves separate from the foreign peoples of the land in their impurities.' The Greek wording is compressed; the Hebrew parallel in Ezra 9:1 supports the sense of failure to separate from the peoples and their defiling practices.
    reason: lexical_alternative
translation:
  language: ko
  text: 관리들과 제사장들과 레위인들은 이 땅의 이방 민족들, 곧 가나안 사람들과 헷 사람들과 브리스 사람들과 여부스 사람들과 모압 사람들과 이집트 사람들과 에돔 사람들의 부정함에서[a] 스스로를 구별하지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 땅의 이방 민족들과 그들의 부정함에서 스스로를 분리하지 않았습니다.’ 그리스어 표현은 압축되어 있습니다. 히브리어 평행 본문(에스라 9:1)은 이 민족들과 그들의 부정한 행위에서 구별하지 않았다는 뜻을 뒷받침합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ ἐχώρισαν
  english_pob_choice: have not separated themselves
  chosen_korean: 스스로 구별하지 않았습니다
  alternatives_korean:
  - 분리하지 않았습니다
  - 스스로 분리하지 않았습니다
  lexicon: BDAG
  rationale: ἑαυτούς가 생략된 분리 동사의 반사적 의미를 한국어에서 자연스럽게 살리기 위해 ‘스스로 구별하다’로 옮겼습니다.
- source_word: οἱ ἄρχοντες
  english_pob_choice: the rulers
  chosen_korean: 관리들
  alternatives_korean:
  - 지도자들
  - 통치자들
  lexicon: BDAG
  rationale: 여기서 ἄρχοντες는 공동체의 공식 책임자들을 가리키므로, 현대 한국어에서 너무 군주적 뉘앙스를 주지 않는 ‘관리들’이 문맥상 가장 무난합니다.
- source_word: ἀλλογενῆ ἔθνη
  english_pob_choice: the foreign nations
  chosen_korean: 이방 민족들
  alternatives_korean:
  - 외국 민족들
  - 외국의 민족들
  lexicon: BDAG
  rationale: 이스라엘 밖의 민족들을 가리키는 집합 표현이므로, 성경적 구분을 유지하는 ‘이방 민족들’로 옮겼습니다.
- source_word: ἀκαθαρσίας αὐτῶν
  english_pob_choice: with their uncleannesses / from their uncleannesses
  chosen_korean: 그들의 더러움에서
  alternatives_korean:
  - 그들의 부정함에서
  - 그들의 더러움과 함께
  lexicon: BDAG
  rationale: 본문의 핵심은 ‘분리하지 않음’이며, ἀκαθαρσία는 의례적·도덕적 부정을 함께 띨 수 있으므로 ‘더러움’으로 옮겨 그 부정성을 직접 살렸습니다.
- source_word: Χαναναίων … Ἰδουμαίων
  english_pob_choice: from the Canaanites ... Edomites
  chosen_korean: 가나안 사람들과 헷 사람들과 브리스 사람들과 여부스 사람들과 모압 사람들과 이집트 사람들과 에돔 사람들
  alternatives_korean:
  - 가나안 사람들…
  - 가나안 족속들과 헷 족속들과 브리스 족속들과 여부스 족속들과 모압 사람들과 이집트 사람들과 에돔 사람들
  lexicon: BDAG
  rationale: 열거된 민족명들은 본문이 직접 제시하는 고유명사 목록이므로, 한국어 성경에서 널리 알려진 표기를 우선해 옮겼습니다.
theological_decisions:
- issue: 부정/더러움 언어의 강도 유지
  chosen_reading: ‘더러움’으로 직역에 가깝게 유지해, 단순한 사회적 분리 문제가 아니라 언약적·의례적 부정의 함의를 남겨 두었습니다.
  alternative_readings:
  - 부정함
  - 더럽힘
  - 가증한 것들
  rationale: 그리스어 ἀκαθαρσία는 이 본문에서 완곡하게 약화하기보다, 성결-부정 범주의 긴장을 그대로 드러내는 쪽이 원문에 더 충실합니다.
  doctrine_reference: '번역 원칙: 원문이 지닌 성결 언어와 신학적 긴장을 보존한다.'
