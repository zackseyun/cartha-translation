- from: 그리고 포로 상태에서 돌아온 자들은 야훼, 곧 이스라엘의 하나님께 제물을 바쳤습니다. 숫양 아흔여섯 마리, 어린 양 일흔여섯 마리, 그리고 속건제를 위한 숫염소 열두 마리였습니다. 그 모두는 야훼께 드린 제물이었습니다.[a]
  to: 그리고 포로 생활에서 온 이들은 이스라엘의 하나님이신 주님께 희생 제물을 바쳤습니다. 숫양 아흔여섯 마리, 어린양 일흔여섯 마리, 그리고 구원을 위한[a] 숫염소 열두 마리였습니다. 이 모두는 주님께 드린 희생 제물이었습니다.
  rationale: 본문은 그리스어의 도착/도래 의미와 하나님-주님의 동격 관계를 유지했습니다. 특히 σωτήριον을 ‘속건제’로 한정하지 않고 기본 의미인 ‘구원’을 번역문에 남겼으며, 제의 문맥에서 가능한 안녕·구출의 뉘앙스는 각주로 제시했습니다.
