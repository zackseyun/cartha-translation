base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/063.yaml
  text: 'And those who had come from the captivity offered sacrifices to the Lord[a], the God of Israel: ninety-six rams, seventy-six lambs, and twelve male goats for a peace offering; all of them as a sacrifice to the Lord.'
  footnotes:
  - marker: a
    text: Or 'for well-being,' 'for salvation,' or 'for deliverance.' The Greek says literally 'for salvation/deliverance,' but here it appears in a sacrificial context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 포로 생활에서 온 이들은 이스라엘의 하나님이신 주님께 희생 제물을 바쳤습니다. 숫양 아흔여섯 마리, 어린양 일흔여섯 마리, 그리고 구원을 위한[a] 숫염소 열두 마리였습니다. 이 모두는 주님께 드린 희생 제물이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘안녕을 위한’, ‘구출을 위한’. 그리스어는 문자적으로 ‘구원/구출을 위한’이라는 뜻이며, 여기서는 희생 제사의 문맥에서 사용됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ παραγενόμενοι ἐκ τῆς αἰχμαλωσίας
  english_pob_choice: those who had come from the captivity
  chosen_korean: 포로 상태에서 돌아온 자들
  alternatives_korean:
  - 포로에서 온 이들
  - 유배에서 돌아온 사람들
  lexicon: BDAG
  rationale: αἰχμαλωσία는 단순한 ‘유배’보다 포로로 잡힌 상태를 더 직접적으로 가리키므로, ‘포로 상태에서 돌아온 자들’로 자연스럽게 옮겼습니다.
- source_word: τῷ θεῷ τοῦ Ἰσραὴλ Κυρίῳ / τῷ κυρίῳ
  english_pob_choice: the Lord, the God of Israel / the Lord
  chosen_korean: 야훼, 곧 이스라엘의 하나님
  alternatives_korean:
  - 주님, 이스라엘의 하나님
  - 이스라엘의 하나님, 곧 주님
  lexicon: BDAG
  rationale: κύριος를 본문 기본 용례에 따라 ‘야훼’로 옮기고, 동격 구조는 ‘곧’으로 풀어 그 하나님이 이스라엘의 하나님이심을 분명히 했습니다.
- source_word: ἄρνας
  english_pob_choice: rams
  chosen_korean: 숫양
  alternatives_korean:
  - 양
  - 숫양들
  lexicon: LSJ
  rationale: 희생 제물 목록에서 ἄρνας는 숫양을 뜻하는 것이 자연스럽고, 뒤의 τράγους(숫염소)와 성별 대조도 살려 줍니다.
- source_word: τράγους
  english_pob_choice: male goats
  chosen_korean: 숫염소
  alternatives_korean:
  - 염소
  - 수염소
  lexicon: LSJ
  rationale: τράγους는 명시적으로 수컷 염소를 가리키므로, 현대 한국어에서 자연스러운 ‘숫염소’를 선택했습니다.
- source_word: ὑπὲρ σωτηρίου
  english_pob_choice: for a peace offering
  chosen_korean: 속건제를 위한
  alternatives_korean:
  - 평안제를 위한
  - 구원을 위한
  - 구출을 위한
  lexicon: LSJ
  rationale: 문맥상 희생 제사 목록 안의 기술어이므로 제의적 의미를 살려야 합니다. 다만 ελλην어 σωτήριον의 문자적 의미 범위는 넓어, 본문은 제사 유형을 드러내는 방향으로 옮겼습니다.
theological_decisions:
- issue: ὑπὲρ σωτηρίου의 제의적 의미를 한국어 제사 용어로 어떻게 표기할지
  chosen_reading: ‘속건제를 위한’으로 옮겨 제사의 성격을 분명히 했습니다.
  alternative_readings:
  - 평안제를 위한
  - 구원을 위한
  - 구출을 위한
  rationale: 이 구절은 제물 목록의 일부이므로 추상적 구원 진술로 읽기보다 제의적 문맥을 우선해야 합니다. 한국어 독자에게는 제사 범주가 드러나는 표현이 더 오해를 줄입니다.
  doctrine_reference: Translation philosophy §§1, 6
