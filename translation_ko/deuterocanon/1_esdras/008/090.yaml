base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/090.yaml
  text: And Jechonias son of Jeelus[a], of the sons of Israel, cried out and said to Ezra, “We have sinned against the Lord, and foreign women from the nations of the land have dwelt among us[b]; and now there is still hope for all Israel.”
  footnotes:
  - marker: a
    text: The Greek final clause is difficult and appears to diverge from or compress the Hebrew parallel in Ezra 10:2. The translation follows the likely sense, 'there is still hope for Israel,' rather than a more literal but obscure rendering.
    reason: textual_variant
  - marker: b
    text: The Hebrew parallel reads more explicitly, 'we have married foreign women from the peoples of the land'; the Greek here instead says that foreign women 'have dwelt' among them.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 이스라엘 자손 가운데 여엘루스의 아들 예코니야가 에스라에게 외쳐 말했습니다. 「우리가 주님께 죄를 지었습니다. 이 땅의 민족들 가운데서 나온 이방 여인들이 우리 가운데 살고 있습니다.[b] 그리고 이제는 온 이스라엘을 위한 희망이 아직 있습니다.[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 마지막 절은 난해하며, 히브리어 병행본문(에스라 10:2)과도 다소 어긋납니다. 여기서는 문맥상 가장 자연스러운 뜻인 ‘이스라엘을 위한 희망이 아직 있습니다’로 옮겼습니다.
    reason: textual_variant
  - marker: b
    text: 히브리어 병행본문은 더 분명하게 ‘이 땅의 백성들의 이방 여자들을 취하였다’는 뜻을 보이지만, 그리스어는 여기서 그들이 ‘우리 가운데 살고 있다’고 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: φωνήσας
  english_pob_choice: cried out
  chosen_korean: 외쳐
  alternatives_korean:
  - 큰소리로 말하여
  - 소리쳐
  lexicon: LSJ
  rationale: φωνέω 계열의 강한 발화와 공개적 호소를 살리기 위해 단순한 ‘말하여’보다 ‘외쳐’가 더 적절합니다.
- source_word: Ἰεχονίας Ἰεήλου
  english_pob_choice: Jechonias son of Jeelus
  chosen_korean: 예손아의 아들 이예코니야
  alternatives_korean:
  - 이예코니야, 예손아의 아들
  - 예코니야, 예일의 아들
  lexicon: 고유명사 표기 정책
  rationale: 그리스어 인명은 음역하되, 필리아 관계는 ‘아들’로 분명히 드러냈습니다. 히브리어 병행본문의 이름형과의 차이는 주석으로 다루되 본문에서는 그리스어 형식을 따랐습니다.
- source_word: γυναῖκες ἀλλογενεῖς ἐκ τῶν ἐθνῶν τῆς γῆς
  english_pob_choice: foreign women from the nations of the land
  chosen_korean: 이방 여인들이 우리 가운데 살고 있습니다
  alternatives_korean:
  - 외국 여인들이 우리 가운데 살고 있습니다
  - 다른 민족의 여인들이 우리 가운데 살고 있습니다
  lexicon: LSJ
  rationale: ἀλλογενεῖς는 ‘다른 민족/계통의’라는 뜻이므로 관용적이면서도 종교·민족적 분리를 드러내는 ‘이방 여인들’로 옮겼습니다. κατῴκησαν은 단순히 ‘거주하다’이지만, 문맥상 공동체 안에 편입된 상태를 나타내므로 ‘우리 가운데 살고 있습니다’로 자연스럽게 풀었습니다.
- source_word: καὶ νῦν ἔστιν ἐπάνω πᾶς Ἰσραήλ
  english_pob_choice: and now there is still hope for all Israel
  chosen_korean: 그리고 이제는 온 이스라엘을 위한 희망이 아직 있습니다
  alternatives_korean:
  - 그리고 이제 온 이스라엘 위에는 있습니다
  - 그리고 이제는 온 이스라엘에게 남은 것이 있습니다
  lexicon: LSJ
  rationale: 마지막 절은 그리스어 자체가 난해하고 병행본문과도 어긋나므로, 문맥상 확실한 뜻인 ‘희망이 아직 있다’를 살렸습니다. ‘온 이스라엘’을 유지해 공동체 전체를 가리키는 범위를 보존했습니다.
theological_decisions:
- issue: κύριον의 번역
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 야훼
  rationale: 직접 화법 안의 회개 고백이므로 한국어 신앙 문맥에 익숙한 ‘주님’을 썼습니다. 이 구절의 그리스어는 κύριον이며, 여기서는 히브리어 야훼를 직접 표기할 근거가 없습니다.
  doctrine_reference: 'POB glossary: κύριος → 주님'
- issue: 마지막 절의 불명료한 그리스어를 병행본문으로 해석
  chosen_reading: 희망이 아직 있습니다
  alternative_readings:
  - 그리스어를 더 직역한 불명확한 표현
  - 온 이스라엘 위에 있습니다
  rationale: 본문이 major_mismatch로 표기되어 있고, 영어 POB도 병행본문을 참고해 의미를 복원했습니다. 이 번역은 그리스어의 난점을 숨기지 않되, 독자가 고백의 핵심 의미를 이해하도록 합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy with documented parallel-source reasoning'
