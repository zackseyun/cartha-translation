base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/034.yaml
  text: 'From the sons of Sophotius: Zaraias son of Michael[a], and with him seventy men.'
  footnotes:
  - marker: a
    text: The Greek names here differ from the approximate Hebrew parallel in Ezra 8:6, which reads 'from the sons of Adin, Ebed son of Jonathan, and with him fifty males.' Because 1 Esdras is translated from the Greek witness, the main text follows the Greek names and number.
    reason: alternative_reading
translation:
  language: ko
  text: 소포티우스의 아들들 가운데서, 미카엘의 아들 자라야스와 그와 함께한 사람 칠십 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 그리스어 이름과 숫자는 에스라 8:6의 히브리어 병행문(아딘, 요나단의 아들 에벳, 쉰 명)과 다릅니다. 1 에스드라서는 그리스어 증언을 따라 본문을 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  english_pob_choice: From the sons of
  chosen_korean: …의 아들들 가운데서
  alternatives_korean:
  - …의 아들들 중에서
  - …의 아들들 가운데
  lexicon: LSJ
  rationale: ἐκ + 속격은 집단 가운데서의 선출·소속을 나타내므로, 목록 문맥에 맞게 ‘…의 아들들 가운데서’로 옮겨 선별 출처를 드러냈습니다.
- source_word: Σοφοτίου
  english_pob_choice: Sophotius
  chosen_korean: 소포티우스
  alternatives_korean:
  - 소포티오스
  - 소포티우스
  lexicon: 고유명사 음역
  rationale: 그리스어 고유명을 음역했으며, 본문 계통을 따라 히브리어 병행문의 이름과 조화시키지 않았습니다.
- source_word: Μειχαήλου
  english_pob_choice: son of Michael
  chosen_korean: 미카엘의 아들
  alternatives_korean:
  - 마이클의 아들
  - 미하엘의 아들
  lexicon: 고유명사 음역
  rationale: γεν. 단독 형태를 족보식 관계로 풀어 한국어에서 자연스럽고 명시적으로 ‘미카엘의 아들’로 표현했습니다.
- source_word: μετʼ αὐτοῦ
  english_pob_choice: and with him
  chosen_korean: 그와 함께한
  alternatives_korean:
  - 그와 함께
  - 그와 더불어
  lexicon: BDAG
  rationale: 동반 구문을 한국어 목록 문체에 맞게 간결하게 풀어, 인물명과 뒤의 수량을 자연스럽게 연결했습니다.
theological_decisions:
- issue: 1 Esdras의 그리스어 본문을 따를지, 히브리어 병행문의 이름·숫자와 조화시킬지
  chosen_reading: 그리스어 본문을 따라 ‘소포티우스… 미카엘의 아들 자라야스… 칠십 명’으로 옮겼습니다.
  alternative_readings:
  - 히브리어 병행문을 반영해 ‘아딘… 요나단의 아들 에벳… 쉰 명’으로 조화시키는 읽기
  rationale: 이 절은 1 Esdras의 그리스어 증언이 मुख्य 본문이며, 병행 히브리어는 근사치이므로 본문은 그리스어를 유지하고 차이는 각주로만 표시하는 편이 source-grounded합니다.
  doctrine_reference: 본문 우선 원칙 및 병행본문 주석 처리
