base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/037.yaml
  text: 'From the sons of Baer: Zechariah son of Bemaiah[a], and with him twenty-eight men.'
  footnotes:
  - marker: a
    text: The Greek names in this verse differ notably from the approximate Hebrew parallel (Ezra 8:9), which reads 'from the sons of Joab, Obadiah son of Jehiel, and with him two hundred and eighteen males.' Because 1 Esdras is translated here from the Greek witness, the Greek names and number are followed in the main text.
    reason: alternative_reading
translation:
  language: ko
  text: 바에르의 자손들 가운데서는, 베마의 아들 스가랴와 그와 함께한 스물여덟 명이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 구절의 그리스어 이름과 숫자는 약한 히브리어 대응 본문(Ezra 8:9)과 현저히 다릅니다. 1 에스드라서는 그리스어 증언을 따라 본문에 반영했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τῶν Βαήρ
  english_pob_choice: From the sons of Baer
  chosen_korean: 바에르의 자손들 가운데서는
  alternatives_korean:
  - 바에르에게서
  - 바에르 가문에서
  lexicon: LSJ
  rationale: 전치사 ἐκ는 여기서 명단 항목의 소속을 나타내므로, 영어 POB의 ‘the sons of’에 맞추어 한국어에서도 혈통/가문 소속을 드러냈습니다.
- source_word: Ζαχαρίαι
  english_pob_choice: Zechariah
  chosen_korean: 스가랴
  alternatives_korean:
  - 자카리아
  - 자카리야
  lexicon: LSJ
  rationale: 성경 인명으로 널리 굳어진 형태를 따라, 그리스어 이름 Ζαχαρίαι를 한국어 성경 관행에 맞게 스가랴로 옮겼습니다.
- source_word: Βημαί
  english_pob_choice: son of Bemaiah
  chosen_korean: 베마의 아들
  alternatives_korean:
  - 베마이
  - 베마의
  lexicon: LSJ
  rationale: 영어 POB가 이 이름을 친족 표지로 읽어 ‘son of Bemaiah’로 풀어 놓았으므로, 한국어도 같은 관계를 분명히 드러내는 방식으로 처리했습니다.
- source_word: ἄνδρες εἴκοσι ὀκτώ
  english_pob_choice: twenty-eight men
  chosen_korean: 스물여덟 명
  alternatives_korean:
  - 스물여덟 남자
  - 스물여덟 남성
  lexicon: LSJ
  rationale: 명단·집계 문맥에서 ἄνδρες는 성인 남자를 가리키지만, 한국어에서는 수량 단위와 함께 자연스럽게 읽히도록 ‘명’을 사용했습니다.
