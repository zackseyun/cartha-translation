    rationale: 독자가 본문의 그리스어 읽기와 근사 히브리어 병렬(Ezra 8:9)의 차이를 확인할 수 있도록 병렬의 이름과 수치를 밝혀야 합니다.
  revised_text: 바에르 자손 가운데서는 베마이의 스가랴와 그와 함께한 남자 스물여덟 명이 있었습니다.[a]
