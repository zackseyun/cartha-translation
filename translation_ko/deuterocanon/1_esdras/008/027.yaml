revisions:
- from: 그리고 저는 주 하나님의 도우심에 따라 담대해졌고, 이스라엘에서 사람들을 모아 저와 함께 올라가게 하였습니다.[a]
  to: 저는 주 나의 하나님의 도우심에 힘입어 담대해졌고, 저와 함께 올라가기 위해 이스라엘에서 남자들을 모았습니다.[a]
  rationale: 그리스어 원문을 우선하여 ἄνδρας의 성별 표지를 ‘남자들’로 보존하고, συναναβῆναί μοι를 사역 표현이 아닌 동행 목적의 표현으로 바로잡았습니다. ‘주 나의 하나님의 도우심에 힘입어’는 κατὰ τὴν ἀντίλημψιν Κυρίου θεοῦ μου의 도움·지원 의미를 자연스러운 한국어로 재현합니다. 평행 히브리어 본문의 상이한 읽기는 본문이 아니라 각주에 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:04:01Z'
