base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/027.yaml
  text: And I took courage according to the help of the Lord my God[a], and I gathered from Israel men to go up with me.
  footnotes:
  - marker: a
    text: The Hebrew parallel in Ezra 7:28 reads 'heads' or 'leaders' rather than 'men.' 1 Esdras here follows the Greek wording.
    reason: alternative_reading
translation:
  language: ko
  text: 저는 주 나의 하나님의 도우심에 힘입어 담대해졌고, 저와 함께 올라가기 위해 이스라엘에서 남자들을 모았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 평행본문인 에스라 7:28은 ‘남자들’ 대신 ‘우두머리들’ 또는 ‘지도자들’에 해당하는 표현을 읽습니다. 1 에스드라의 그리스어 본문은 ἄνδρας(‘남자들’)를 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθαρσὴς ἐγενόμην
  english_pob_choice: I took courage
  chosen_korean: 담대해졌고
  alternatives_korean:
  - 용기를 얻었고
  - 담대해졌습니다
  - 굳세어졌고
  lexicon: LSJ
  rationale: εὐθαρσής ἐγενόμην은 내적으로 힘을 얻어 담대해진 상태를 뜻하므로, 현대 한국어에서 자연스럽고 의미를 보존하는 '담대해졌고'로 옮겼습니다.
- source_word: κατὰ τὴν ἀντίλημψιν
  english_pob_choice: according to the help
  chosen_korean: 도우심에 따라
  alternatives_korean:
  - 도움에 따라
  - 도움으로 말미암아
  - 도우심을 힘입어
  lexicon: LSJ
  rationale: ἀντίλημψις는 도움·지원을 뜻하므로, 하나님의 능동적 지원을 드러내는 존대형 명사 '도우심'을 택해 원문의 의미를 살렸습니다.
- source_word: ἄνδρας
  english_pob_choice: men
  chosen_korean: 사람들을
  alternatives_korean:
  - 남자들을
  - 사내들을
  lexicon: LSJ
  rationale: 그리스어는 ἄνδρας로 성별이 드러나는 일반 명사지만, 이 절의 핵심은 동행자를 모았다는 점이므로 한국어에서는 어색하지 않게 '사람들을'로 옮기되, 원문의 인적 집합 의미를 유지했습니다.
- source_word: ὥστε συναναβῆναί μοι
  english_pob_choice: to go up with me
  chosen_korean: 저와 함께 올라가게 하였습니다
  alternatives_korean:
  - 저와 함께 올라가도록 하였습니다
  - 저와 함께 올라오게 하였습니다
  lexicon: LSJ
  rationale: συναναβῆναί μοι는 목적/결과의 부정사 구조로, 예루살렘으로의 '올라감'이라는 순례적 이동 관용을 살려 '저와 함께 올라가게 하였습니다'로 표현했습니다.
theological_decisions:
- issue: κυρίου θεοῦ μου의 호칭 처리
  chosen_reading: 주 하나님
  alternative_readings:
  - 주 내 하나님
  - 주님 하나님
  rationale: κύριος는 본 프로젝트의 기본값에 따라 '주'로, θεός는 '하나님'으로 옮겨 원문의 신적 호칭을 간결하게 보존했습니다.
  doctrine_reference: 호칭 번역 일관성; κύριος/θεός 구분
- issue: 이스라엘에서 모은 대상의 성격
  chosen_reading: 사람들
  alternative_readings:
  - 지도자들
  - 우두머리들
  rationale: 1 Esdras의 그리스어 본문은 ἄνδρας('남자들/사람들')을 읽으므로, 히브리어 평행본문의 '지도자들'을 본문에 끌어오지 않고 그리스어를 우선했습니다.
  doctrine_reference: 원전 우선 원칙; 평행본문 차이 보존
