base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/068.yaml
  text: And as soon as I heard these things[a], I tore my garments and the holy robe, and I pulled out hair from my head and beard[b], and I sat down stunned and deeply grieved.
  footnotes:
  - marker: a
    text: Or 'the sacred garment'; possibly an official priestly robe, though the Greek does not state this explicitly.
    reason: lexical_alternative
  - marker: b
    text: Or 'astonished' or 'dismayed' for 'stunned.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 이 말을 듣자마자 옷을 찢고 거룩한 옷도 찢었으며, 머리털과 수염에서 털을 뽑고 어리둥절하며 몹시 근심하며 앉았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '성스러운 옷'. 그리스어는 그 옷이 거룩하다고만 말하며, 보다 좁은 '제의복'은 명시하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '충격을 받고'나 '당황하여'로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα τῷ ἀκοῦσαί με
  english_pob_choice: as soon as I heard
  chosen_korean: 내가 이 말을 듣자마자
  alternatives_korean:
  - 내가 이 말을 들을 때
  - 내가 이 말을 듣고 곧바로
  lexicon: LSJ
  rationale: ἅμα + 부정사구는 즉각적인 시간 관계를 나타내므로, 한국어에서는 '듣자마자'가 즉시성의 뉘앙스를 가장 자연스럽게 드러냅니다.
- source_word: τὰ ἱμάτια
  english_pob_choice: my garments
  chosen_korean: 옷
  alternatives_korean:
  - 의복
  - 겉옷
  lexicon: LSJ
  rationale: 애도 관용구로서의 '옷을 찢다'를 살리되, 과도하게 고어적이거나 특정한 겉옷으로 좁히지 않기 위해 간명하게 옮겼습니다.
- source_word: τὴν ἱερὰν ἐσθῆτα
  english_pob_choice: the holy robe
  chosen_korean: 거룩한 옷
  alternatives_korean:
  - 성스러운 옷
  - 제의복
  lexicon: LSJ
  rationale: ἱεράν은 이 옷이 거룩하게 구별된 것임을 표시하지만, 본문이 '제의복'이라고 명시하지는 않으므로 그보다 넓은 '거룩한 옷'을 택했습니다.
- source_word: κατέτειλον τοῦ τριχώματος τῆς κεφαλῆς καὶ τοῦ πώγωνος
  english_pob_choice: I pulled out hair from my head and beard
  chosen_korean: 머리털과 수염에서 털을 뽑고
  alternatives_korean:
  - 머리와 수염의 털을 뽑고
  - 머리와 수염에서 머리털을 뽑고
  lexicon: LSJ
  rationale: 원문의 초점은 머리와 수염에 난 털을 강제로 뽑아내는 행위이므로, 한국어에서는 중복을 줄이면서도 신체 부위를 분명히 드러내는 표현을 택했습니다.
- source_word: σύννους καὶ περίλυπος
  english_pob_choice: stunned and deeply grieved
  chosen_korean: 어리둥절하며 몹시 근심하며
  alternatives_korean:
  - 충격을 받고 몹시 슬퍼하며
  - 멍해지고 깊이 근심하며
  lexicon: LSJ
  rationale: σύννους는 단순한 놀람보다 정신이 멍해진 상태를, περίλυπος는 깊은 슬픔/근심을 나타내므로 두 감정 상태를 모두 살려 옮겼습니다.
theological_decisions:
- issue: τὴν ἱερὰν ἐσθῆτα의 의미 범위
  chosen_reading: '''거룩한 옷''으로 유지하여, 본문이 암시하는 성별된 의복의 성격은 드러내되 ''제의복''처럼 더 좁은 해석은 피했습니다.'
  alternative_readings:
  - 제의복
  - 성스러운 옷
  rationale: 그리스어는 그 옷이 거룩하다고만 말하며, 특정 직분용 제복이라고 단정하지 않습니다. 따라서 번역은 본문의 범위를 넘지 않도록 유지했습니다.
  doctrine_reference: '번역 원칙: 본문이 말하는 것 이상을 주입하지 않음(최적 대응).'
