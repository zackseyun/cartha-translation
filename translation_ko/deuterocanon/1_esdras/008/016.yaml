  source_fidelity: 그리스어는 βούλῃ(단수)를 사용하여 수신자인 ‘너’의 의지를 표현하고, μετὰ τῶν ἀδελφῶν σου는 ‘네 형제들과 함께’라는 동반·공동 행위의 관계를 나타냅니다. 초안의 ‘너와 네 형제들이 … 하고자 하는’은 형제들을 의지의 공동 주체로 바꾸므로, 단수 수신자와 함께함의 관계가 드러나도록 고쳐야 합니다. 또한 χρυσίῳ καὶ ἀργυρίῳ의 순서에 맞추어 ‘금과 은’으로 옮기는 것이 안전합니다.
  naturalness: ‘네가 네 형제들과 함께 금과 은으로 무엇을 하기를 원하든지’는 현대 표준어 합쇼체 문맥에서 자연스럽고, 원문의 열린 관계절과 의지의 뉘앙스를 유지합니다. ‘그것을 실행하십시오’는 ἐπιτέλει의 집행·수행 의미를 명료하게 전달합니다.
