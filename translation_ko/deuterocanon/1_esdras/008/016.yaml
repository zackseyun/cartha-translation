base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/016.yaml
  text: And whatever you and your brothers wish to do with the silver and gold[a], carry it out according to the will of your God.
  footnotes:
  - marker: a
    text: The Hebrew parallel in Ezra 7:18 is more specific, speaking of what seems good to do with the remaining silver and gold. 1 Esdras here gives a broader Greek wording.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 너와 네 형제들이 은과 금으로 하고자 하는 모든 것은, 너의 하나님의 뜻에 따라 실행하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 평행본문(Ezra 7:18)은 더 구체적으로 “남은 은과 금”에 대해 말하지만, 1 Esdras의 그리스어는 더 넓은 표현을 사용합니다.
    reason: cross_reference
lexical_decisions:
- source_word: πάντα ὅσα ἂν βούλῃ
  english_pob_choice: whatever ... wish
  chosen_korean: 하고자 하는 모든 것은
  alternatives_korean:
  - 원하는 모든 것은
  - 마음대로 하고자 하는 것은
  lexicon: BDAG
  rationale: 열린 조건·의지의 뉘앙스를 살려 “하고자 하는 모든 것은”으로 옮기면, 무한히 열려 있는 가능성과 의도성을 함께 담을 수 있습니다.
- source_word: μετὰ τῶν ἀδελφῶν σου
  english_pob_choice: you and your brothers
  chosen_korean: 너와 네 형제들이
  alternatives_korean:
  - 네 형제들과 함께
  - 너와 형제들이
  lexicon: BDAG
  rationale: 직역의 “~와 함께”보다 한국어에서는 주어를 함께 드러내는 표현이 자연스러워, 공동 행위의 주체를 분명히 했습니다.
- source_word: χρυσίῳ καὶ ἀργυρίῳ
  english_pob_choice: with the silver and the gold
  chosen_korean: 은과 금으로
  alternatives_korean:
  - 은과 금과 함께
  - 은과 금에 관하여
  lexicon: BDAG
  rationale: 여격은 수단·재료의 성격을 가지므로 한국어에서는 “~으로”가 가장 자연스럽고, 지정된 성전 자원의 사용이라는 의미를 잘 드러냅니다.
- source_word: ἐπιτέλει
  english_pob_choice: carry it out
  chosen_korean: 실행하십시오
  alternatives_korean:
  - 행하십시오
  - 완수하십시오
  - 수행하십시오
  lexicon: BDAG
  rationale: ἐπιτελέω의 핵심은 허락된 일을 실제로 집행하는 데 있으므로, 현대 한국어에서 가장 명료한 “실행하십시오”를 택했습니다.
- source_word: κατὰ τὸ θέλημα τοῦ θεοῦ σου
  english_pob_choice: according to the will of your God
  chosen_korean: 너의 하나님의 뜻에 따라
  alternatives_korean:
  - 너의 하나님의 뜻대로
  - 너의 하나님께서 원하시는 대로
  lexicon: BDAG
  rationale: 지배 기준을 나타내는 κατὰ를 한국어의 “~에 따라”로 옮겨, 단순한 조언이 아니라 하나님의 뜻이 규범이라는 점을 분명히 했습니다.
theological_decisions:
- issue: 1 Esdras의 그리스어가 Ezra 7:18의 히브리어 평행본문보다 더 넓은 표현을 사용함
  chosen_reading: 그리스어 본문대로, ‘너와 네 형제들이 은과 금으로 하고자 하는 모든 것’을 포괄적으로 허용하되, 최종 기준은 하나님의 뜻으로 제한합니다.
  alternative_readings:
  - 평행본문에 맞추어 ‘남은 은과 금으로 무엇이 좋든지’로 더 구체화함
  rationale: 이 책의 번역 원칙상 1 Esdras에서는 그리스어가 1차 본문이므로, 히브리어 평행문은 참고하되 본문 문구를 좁혀 덮어쓰지 않았습니다.
  doctrine_reference: 'PHILOSOPHY.md: Greek primary text with Semitic parallel as control'
