base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/069.yaml
  text: And all who were ever stirred by the word of the Lord[a], the God of Israel, gathered to me while I was mourning over the lawlessness, and I sat grieved until the evening sacrifice.
  footnotes:
  - marker: a
    text: 'Greek: ''by the word of the Lord of Israel.'' The phrase may also be understood more literally as ''by the word of the Lord of Israel''; the translation follows the likely sense in light of the parallel Hebrew context and common biblical usage, ''the Lord, the God of Israel.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 주님의 말씀으로 마음이 움직인 사람은 누구나 내게 모여들었습니다. 나는 법을 어긴 일로 슬퍼하며 애도하는 가운데 있었고, 저녁 제사 때까지 근심에 잠겨 앉아 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 직역은 “이스라엘의 주님의 말씀으로”에 가깝습니다. 평행하는 히브리어 문맥을 따라 ‘주님의 말씀’으로 자연스럽게 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπισυνήχθησαν
  english_pob_choice: gathered
  chosen_korean: 모여들었습니다
  alternatives_korean:
  - 모였습니다
  - 모여 있었습니다
  lexicon: LSJ
  rationale: 사람들이 에스라에게 자발적으로 모여든 집합 의미를 자연스럽게 살리면서도, 단순한 정적 집합보다 움직임을 드러냅니다.
- source_word: ἐπεκινοῦντο τῷ ῥήματι Κυρίου τοῦ Ἰσραήλ
  english_pob_choice: were stirred by the word of the Lord, the God of Israel
  chosen_korean: 주님의 말씀으로 마음이 움직인
  alternatives_korean:
  - 주님의 말씀에 감동된
  - 주님의 말씀에 이끌린
  lexicon: LSJ
  rationale: ἐπεκινοῦντο는 내적으로 자극받아 반응하는 뜻이므로, 관용적이되 반응의 동력을 보이는 ‘마음이 움직인’으로 옮겼습니다.
- source_word: ἀνομίᾳ
  english_pob_choice: lawlessness
  chosen_korean: 법을 어긴 일
  alternatives_korean:
  - 불법
  - 불의
  lexicon: LSJ
  rationale: 단순한 추상어보다 하나님의 뜻에 어긋난 행위를 더 직접적으로 드러내는 표현을 택했습니다. 이 구절은 죄의 상태보다 위반 행위를 강조합니다.
- source_word: δειλινῆς θυσίας
  english_pob_choice: the evening sacrifice
  chosen_korean: 저녁 제사
  alternatives_korean:
  - 저녁 제물
  - 저녁 드림
  lexicon: LSJ
  rationale: 정기적인 성전 제사를 가리키는 관용구이므로, 한국어 성경에서 널리 이해되는 ‘저녁 제사’를 사용했습니다.
theological_decisions:
- issue: τῷ ῥήματι Κυρίου τοῦ Ἰσραήλ의 지시 대상
  chosen_reading: 주님의 말씀
  alternative_readings:
  - 주님의 말씀, 곧 이스라엘의 하나님의 말씀
  - 이스라엘의 주님의 말씀
  rationale: 히브리어 평행본문을 보면 지시 대상은 이스라엘의 하나님이므로, 본문에서는 과도한 확장 없이 ‘주님의 말씀’으로 두되 문맥상 하나님 말씀으로 읽히게 했습니다.
  doctrine_reference: parallel-source guided sense; κύριος usually rendered 주님 in Korean POB
