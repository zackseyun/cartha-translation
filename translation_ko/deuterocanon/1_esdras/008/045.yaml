base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/045.yaml
  text: And I told them to go to Laddaeus[a], the leader at the place of the treasury[b],
  footnotes:
  - marker: a
    text: The Greek names only Laddaeus here, whereas the Hebrew parallel in Ezra 8:16 lists several men sent for. 1 Esdras appears to compress or reshape the parallel account at this point.
    reason: alternative_reading
  - marker: b
    text: Or 'the leader at the treasury place' or 'the one in charge of the treasury chamber.' The Greek wording is compact and allows slightly different construals of the final phrase.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나는 그들에게 금고가 있는 곳의 책임자인 라다이오스[a][b]에게 가라고 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 여기서 라다이오스 한 사람만 언급하지만, 히브리어 평행 본문인 에스라 8:16은 여러 사람을 보냅니다. 1 에스드라서는 이 대목에서 평행 전승을 압축하거나 재구성한 것으로 보입니다.
    reason: alternative_reading
  - marker: b
    text: 원문의 마지막 표현은 ‘금고가 있는 곳의 책임자’로, 또는 ‘금고실을 맡은 사람’으로도 이해할 수 있습니다. 그리스어 표현이 압축되어 있어 수식 관계를 약간 다르게 파악할 여지가 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπα
  english_pob_choice: I told
  chosen_korean: 내가 ... 말했습니다
  alternatives_korean:
  - 내가 ... 일렀습니다
  - 내가 ... 지시했습니다
  lexicon: BDAG
  rationale: aorist λέγω가 뒤의 부정사구 ἐλθεῖν πρὸς를 지배하므로, 단순한 ‘말하다’보다 명령 전달의 기능이 드러나는 한국어로 옮겼습니다.
- source_word: ἐλθεῖν πρὸς
  english_pob_choice: to go to
  chosen_korean: '...에게 가라고'
  alternatives_korean:
  - '...에게 오라고'
  - '...에게 다가가라고'
  lexicon: BDAG
  rationale: 화자 기준의 ‘오다’보다, 지시받은 사람들의 이동을 나타내는 ‘가다’가 자연스럽고 원문의 방향성을 잘 살립니다.
- source_word: Λαδδαῖον
  english_pob_choice: Laddaeus
  chosen_korean: 라다이오스
  alternatives_korean:
  - 라다에우스
  - 라다이오
  lexicon: LSJ
  rationale: 고유명사는 번역하지 않고 음역해야 하며, 그리스어 대격형을 반영한 현대 한국어 음역으로 처리했습니다.
- source_word: τὸν ἡγούμενον
  english_pob_choice: the leader
  chosen_korean: 책임자
  alternatives_korean:
  - 지도자
  - 인도자
  - 우두머리
  lexicon: BDAG
  rationale: ἡγούμενος의 핵심은 ‘인도하다/이끌다’이지만, 여기서는 특정 직함보다 ‘그곳을 맡은 사람’이라는 기능이 중요하므로 자연스러운 ‘책임자’를 택했습니다.
- source_word: τὸν ἐν τῷ τόπῳ γαζοφυλακίου
  english_pob_choice: at the place of the treasury
  chosen_korean: 그곳의 금고
  alternatives_korean:
  - 그곳의 보물고
  - 그곳의 보관실
  - 그곳의 금고실
  lexicon: BDAG
  rationale: γαζοφυλάκιον은 재정 보관 장소를 가리키므로, 교회 용어처럼 굳은 ‘보물창고’보다 일상적이면서도 기능을 드러내는 ‘금고’로 옮겼습니다.
theological_decisions:
- issue: 1 Esdras의 병렬 본문 압축과 인명 처리
  chosen_reading: 그리스어 본문대로 라다이오스 한 사람만 언급하는 번역을 유지했습니다.
  alternative_readings:
  - 히브리어 에스라 8:16의 여러 사람 이름을 덧입혀 보완하는 읽기
  - 병렬 본문을 따라 복수의 파견 대상을 암시하는 읽기
  rationale: 본문 자체가 그리스어에서 한 인명으로 압축되어 있으므로, 병렬 본문을 본문에 역투사하지 않고 차이를 그대로 드러내는 것이 적절합니다.
  doctrine_reference: 본문비평/정경 병렬 관계
- issue: τὸν ἡγούμενον의 직함 강도
  chosen_reading: 공적 관직명보다 기능적 표현인 ‘책임자’로 번역했습니다.
  alternative_readings:
  - 지도자
  - 총독
  - 우두머리
  rationale: 본문은 공식 관직을 명시하지 않으므로, 한국어에서도 과도한 제도화 없이 맡은 역할을 드러내는 쪽이 원문 충실합니다.
  doctrine_reference: 역사-서사 본문 해석
