base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/085.yaml
  text: For you, Lord, who have lightened our sins, have given us such a root; yet we have turned back to transgress your law by mingling with the uncleanness of the nations of the land.
translation:
  language: ko
  text: 주님, 주께서 우리의 죄를 가볍게 하시고 우리에게 이러한 뿌리를 주셨건만, 우리는 다시 돌아서서 이 땅의 민족들의 부정함과 섞이므로 주님의 율법을 범하였습니다.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: 직역하면 ‘우리의 죄를 가볍게 하신’입니다.
    reason: lexical_alternative
  - marker: b
    text: ῥίζα는 문맥상 ‘뿌리’로 남겨 둔 은유적 표현입니다.
    reason: theological_note
lexical_decisions:
- source_word: κουφίσας τὰς ἁμαρτίας ἡμῶν
  english_pob_choice: who have lightened our sins
  chosen_korean: 우리의 죄를 가볍게 하시고
  alternatives_korean:
  - 우리의 죄를 덜어 주시고
  - 우리의 죄를 가볍게 하신
  lexicon: κουφίζω
  rationale: 죄를 ‘가볍게 하다’는 이미지를 그대로 살리면서, 원문의 완료적 진술을 한국어 연결상 ‘-시고’로 자연스럽게 옮겼습니다.
- source_word: τοιαύτην ῥίζαν
  english_pob_choice: such a root
  chosen_korean: 이러한 뿌리
  alternatives_korean:
  - 그러한 뿌리
  - 이런 뿌리
  lexicon: ῥίζα
  rationale: 영어 POB의 ‘root’를 그대로 따르되, 문맥상 은유적 기초/계보의 뉘앙스를 유지하기 위해 ‘뿌리’로 번역했습니다.
- source_word: παραβῆναι τὸν νόμον σου
  english_pob_choice: to transgress your law
  chosen_korean: 주님의 율법을 범하였습니다
  alternatives_korean:
  - 주님의 율법을 어겼습니다
  - 주님의 율법을 거슬렀습니다
  lexicon: παραβαίνω + νόμος
  rationale: 죄책 고백의 법정적·언약적 성격을 살려 ‘범하다’를 택했고, νόμος는 이 문맥에서 토라/율법으로 읽는 것이 자연스럽습니다.
- source_word: τὸ ἐπιμιγῆναι τῇ ἀκαθαρσίᾳ τῶν ἐθνῶν τῆς γῆς
  english_pob_choice: by mingling with the uncleanness of the nations of the land
  chosen_korean: 이 땅의 민족들의 부정함과 섞이므로
  alternatives_korean:
  - 이 땅의 민족들의 부정함에 섞이므로
  - 이 땅 민족들의 더러움과 뒤섞이므로
  lexicon: ἐπιμίγνυμι + ἀκαθαρσία
  rationale: ‘섞이다’는 접촉/혼합의 직접성을 살리고, ἀκαθαρσία는 의식적·도덕적 부정성을 유지하기 위해 ‘부정함’으로 옮겼습니다.
theological_decisions:
- issue: ῥίζα의 비유적 의미
  chosen_reading: ‘뿌리’는 단순한 식물 이미지가 아니라, 하나님께서 남겨 두신 생명력 있는 기반/계보를 가리키는 표현으로 유지했습니다.
  alternative_readings:
  - ‘남은 자’로 의역
  - ‘생존의 기반’으로 해석적 번역
  rationale: 영어 POB가 ‘remnant’에서 ‘root’로 되돌아간 수정 이력을 반영하여, 본문의 은유를 약화하지 않고 원문 표현을 보존했습니다.
  doctrine_reference: 에스라-느헤미야 전승의 회복/보존 모티프
