base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/004.yaml
  text: And the king gave him honor, because he had found favor before him in regard to all his offices.
  footnotes:
  - marker: a
    text: Or 'glory' for 'honor.' The Greek term can denote public distinction or esteem; here it refers to royal recognition rather than divine glory.
    reason: lexical_alternative
  - marker: b
    text: The Greek phrase rendered 'all his offices' is somewhat compressed and may also mean 'all his dignities' or 'all his appointments.'
    reason: alternative_reading
translation:
  language: ko
  text: 왕은 그의 모든 직무에 관하여 자기 앞에서 은혜를 얻었으므로 그에게 영예를 주었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영광.’ 여기서는 신적 영광이 아니라 왕의 공개적 인정에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 모든 직무’로 옮긴 ἀξιώματα는 문맥상 ‘직위’나 ‘직책’으로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔδωκεν ... δόξαν
  english_pob_choice: gave ... honor
  chosen_korean: 영예를 주었습니다
  alternatives_korean:
  - 존귀를 주었습니다
  - 영광을 주었습니다
  - 명예를 주었습니다
  lexicon: LSJ
  rationale: δόξα는 이 궁정 문맥에서 신적 ‘영광’보다 왕이 신하에게 베푸는 공개적 인정과 격식을 가리키므로, ‘영예’가 가장 자연스럽고 원뜻을 잘 드러냅니다.
- source_word: εὑρόντος χάριν
  english_pob_choice: because he had found favor
  chosen_korean: 은혜를 얻었으므로
  alternatives_korean:
  - 은총을 얻었으므로
  - 호의를 얻었으므로
  - 은혜를 발견했으므로
  lexicon: LSJ
  rationale: genitive absolute의 원인 관계를 살리면서, χάριν을 한국어 성경 문맥에 맞게 ‘은혜’로 옮겨 왕 앞에서 얻은 호의라는 관계성을 보존했습니다.
- source_word: ἐναντίον αὐτοῦ
  english_pob_choice: before him
  chosen_korean: 자기 앞에서
  alternatives_korean:
  - 그의 앞에서
  - 그의 눈앞에서
  - 그의 면전에서
  lexicon: LSJ
  rationale: ‘before him’의 궁정적 표현을 한국어의 자연스러운 관용으로 옮겨, 왕의 면전에서 인정받았다는 뜻을 유지했습니다.
- source_word: ἐπὶ πάντα τὰ ἀξιώματα αὐτοῦ
  english_pob_choice: in regard to all his offices
  chosen_korean: 그의 모든 직무에 관하여
  alternatives_korean:
  - 그의 모든 직위에 관하여
  - 그의 모든 직책에 대하여
  - 그의 모든 임명에 관하여
  lexicon: LSJ
  rationale: ἀξιώματα는 여기서 추상적 ‘영예’보다 행정적 직무나 직책을 가리키므로, 문맥상 가장 무리 없는 ‘직무’로 옮겼습니다.
theological_decisions:
- issue: δόξα의 한국어 어휘 선택이 신학적 ‘영광’으로 과도하게 들릴 수 있음
  chosen_reading: 왕이 주는 공개적 ‘영예’로 이해해 번역했습니다.
  alternative_readings:
  - 영광
  - 명예
  - 존귀
  rationale: 본문은 인간 왕의 보상 행위에 관한 것이므로, 하나님의 영광을 뜻하는 표현으로 밀어붙이지 않고 궁정적 인정의 의미를 살렸습니다.
  doctrine_reference: 문맥 우선 원칙; δόξα의 다의성
