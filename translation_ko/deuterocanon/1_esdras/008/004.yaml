  rationale: δόξα는 이 궁정 문맥에서 신적 ‘영광’보다 왕이 신하에게 베푸는 공개적 인정과 격식을 가리키므로, ‘영예’가 가장 자연스럽고 원뜻을 잘 드러냅니다.
- source_word: εὑρόντος χάριν
  english_pob_choice: because he had found favor
