  source_fidelity: 수정이 필요합니다. ἐπὶ πάντα τὰ ἀξιώματα αὐτοῦ의 ἀξιώματα는 이 구문에서 그의 행정상 ‘직무’ 자체라기보다 그가 제기한 청원·요구를 가리키는 것이 더 적절합니다. 또한 εὑρόντος χάριν ἐναντίον αὐτοῦ의 주체와 대상은 각각 ‘그’와 ‘왕’으로 분명히 드러내는 편이 원문 관계를 정확히 보존합니다.
  naturalness: 현 번역의 ‘자기 앞에서’는 ‘자기’의 지시 대상이 왕인지 그인지 잠시 모호하며, ‘그의 모든 직무에 관하여 은혜를 얻다’도 현대 한국어에서는 의미 연결이 부자연스럽습니다. ‘그가 드린 모든 청에 대하여 왕 앞에서 호의를 얻었으므로’는 자연스럽고 격식 있는 합쇼체 문장입니다.
  terminology: δόξαν은 인간 왕이 베푸는 공적 인정이라는 문맥에서 ‘영예’가 적절합니다. χάριν은 여기서 신학적 의미로 한정되지 않으므로 ‘호의’가 왕의 총애·인정을 분명히 합니다. ἀξιώματα는 ‘청’으로 옮기고, 대안으로 ‘요청’ 또는 ‘요구’를 제시하는 것이 적절합니다.
