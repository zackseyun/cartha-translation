  yaml_path: translation/deuterocanon/1_esdras/008/004.yaml
  text: And the king gave him honor, because he had found favor before him in regard to all his offices.
  footnotes:
  - marker: a
    text: Or 'glory' for 'honor.' The Greek term can denote public distinction or esteem; here it refers to royal recognition rather than divine glory.
    reason: lexical_alternative
  - marker: b
    text: The Greek phrase rendered 'all his offices' is somewhat compressed and may also mean 'all his dignities' or 'all his appointments.'
    reason: alternative_reading
translation:
  language: ko
  text: 왕은 그가 드린 모든 청[b]에 대하여 왕 앞에서 호의를 얻었으므로, 그에게 영예[a]를 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영광.’ 여기서는 신적 영광이라기보다 왕이 베푸는 공적 인정이나 존귀를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 ἀξιώματα는 문맥상 그가 제기한 ‘요청’, ‘요구’, 또는 ‘청원’을 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔδωκεν ... δόξαν
  english_pob_choice: gave ... honor
  chosen_korean: 영예를 주었습니다
  alternatives_korean:
