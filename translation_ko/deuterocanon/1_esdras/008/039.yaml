translation:
  language: ko
  text: 아도니아김의 자손 가운데서[a] 마지막 사람들이었는데, 그들의 이름은 이르갑라 아들 기우엘과 사마야[b]입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘마지막 사람들’입니다. 마지막 하위 집단이나 후대 구성원을 가리킬 수 있으나, 정확한 뉘앙스는 분명하지 않아 원문에 가깝게 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 구절의 평행 MT 증언은 다른 가족명과 숫자를 전합니다. 1 에스드라서는 평행 본문을 재배열하거나 변형하는 경우가 있어, 여기서는 그리스어 본문을 따랐습니다.
    reason: textual_variant
