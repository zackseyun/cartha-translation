- from: 이 일에 관하여 우리에게는 주께[a] 맹세가 있게 하여, 우리 아내들 곧 이방 사람들 가운데서 온 여자들과 그들의 자녀들을 모두 내보내게 하십시오. 그것은 당신이[b] 결정한 대로이며, 또 주의 율법을 따르는 모든 사람에 의해서도 그러합니다.
