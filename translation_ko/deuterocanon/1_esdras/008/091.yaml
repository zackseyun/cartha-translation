base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/091.yaml
  text: In this matter let there be for us an oath to the Lord[a], to send away all our wives from among the foreigners, together with their children, as it has been decided by you[b], and by all who obey the law of the Lord.
  footnotes:
  - marker: a
    text: 'Greek: ''as it has been decided by you, and those who will obey the law of the Lord.'' The clause is syntactically compressed in the Greek witness; the translation makes the implied sense explicit.'
    reason: textual_variant
  - marker: b
    text: Or 'to put away' or 'to cast out' for 'to send away.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일에 관하여 우리에게는 주께[a] 맹세가 있게 하여, 우리 아내들 곧 이방 사람들 가운데서 온 여자들과 그들의 자녀들을 모두 내보내게 하십시오. 그것은 당신이[b] 결정한 대로이며, 또 주의 율법을 따르는 모든 사람에 의해서도 그러합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘그것은 당신이 결정한 대로이며, 또 주의 율법을 따르는 모든 사람에 의해서도 그러합니다’라는 압축된 구조입니다. 한국어 본문은 문맥의 뜻을 풀어 옮겼습니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘당신에 의해 결정된 대로’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  english_pob_choice: In this matter
  chosen_korean: 이 일에 관하여
  alternatives_korean:
  - 이 일에서
  - 이 점에서
  lexicon: LSJ
  rationale: 문맥상 특정 사안에 대한 도입구이므로, 한국어에서는 ‘이 일에 관하여’가 가장 자연스럽고 직접적입니다.
- source_word: ὁρκωμοσία
  english_pob_choice: an oath
  chosen_korean: 맹세
  alternatives_korean:
  - 서약
  - 맹세의 행위
  lexicon: LSJ
  rationale: 여기서는 공식적인 서약 행위를 가리키므로 ‘맹세’가 간결하고 문맥에 맞습니다.
- source_word: ἐκβαλεῖν
  english_pob_choice: to send away
  chosen_korean: 내보내게 하십시오
  alternatives_korean:
  - 내쫓게 하십시오
  - 보내게 하십시오
  - 내치게 하십시오
  lexicon: LSJ
  rationale: 가정과 가족을 떼어 내보내는 강한 조치이지만, 한국어에서는 과도하게 폭력적으로 들리지 않도록 ‘내보내게 하십시오’로 옮겼습니다.
- source_word: τὰς γυναῖκας ἡμῶν τὰς ἐκ τῶν ἀλλογενῶν
  english_pob_choice: all our wives from among the foreigners
  chosen_korean: 우리 아내들 곧 이방 사람들 가운데서 온 여자들
  alternatives_korean:
  - 우리의 이방 아내들
  - 우리 아내들 곧 이방 출신 여성들
  - 우리 아내들 곧 외국인들 가운데서 온 여자들
  lexicon: LSJ
  rationale: γυναῖκες는 여기서 결혼 관계를 가리키므로 ‘아내들’이 맞고, ἀλλογενῶν은 민족적 출신을 나타내어 ‘이방 사람들 가운데서 온 여자들’로 풀었습니다.
- source_word: τοῦ νόμου τοῦ κυρίου
  english_pob_choice: the law of the Lord
  chosen_korean: 주의 율법
  alternatives_korean:
  - 주님의 율법
  - 주의 법
  lexicon: LSJ
  rationale: κύριος는 본문에서 이스라엘의 하나님을 가리키므로 관례대로 ‘주’로 옮기되, νόμος는 여기서 토라 의미의 ‘율법’이 가장 적절합니다.
theological_decisions:
- issue: ‘주’(κύριος)의 번역
  chosen_reading: 주
  alternative_readings:
  - 주님
  - 주인
  rationale: 문맥이 맹세와 율법 준수이므로, 하나님의 언약적 호칭으로서 ‘주’가 가장 적절합니다.
  doctrine_reference: 'DOCTRINE.md contested terms: κύριος → 주'
- issue: 알로게네스(ἀλλογενῶν)의 민족적 의미
  chosen_reading: 이방 사람들 가운데서 온
  alternative_readings:
  - 이방인
  - 외국 출신의
  - 다른 민족의
  rationale: 후대의 신학적 범주보다 원문의 민족/출신 구분을 유지하는 것이 더 정확합니다.
  doctrine_reference: Source-language ethnicity marker ἀλλογενής
