- source_word: ἐν ὅλῃ Συρίᾳ καὶ Φοινίκῃ
  english_pob_choice: throughout all Syria and Phoenicia
  chosen_korean: 온 시리아와 페니키아에서
  alternatives_korean:
  - 시리아와 페니키아 전역에서
  - 시리아와 페니키아 곳곳에서
  lexicon: LSJ
  rationale: 헬라어 본문의 지리적 범위를 그대로 반영했습니다. 1 에스드라스의 그리스어 지리 표지를 유지하고, 히브리 병행본의 행정 구역 표현으로 맞추어 바꾸지 않았습니다.
- source_word: τὸν νόμον τοῦ θεοῦ σου
  english_pob_choice: the law of your God
  chosen_korean: 네 하나님의 율법
  alternatives_korean:
  - 네 하나님의 법
  - 너의 하나님의 율법
  lexicon: BDAG
  rationale: νόμος는 여기서 토라/율법의 의미이므로 표준적인 '율법'을 택했습니다. σου를 반영해 '네 하나님'으로 옮겨 소유 관계를 분명히 했습니다.
theological_decisions:
- issue: 1 에스드라스의 그리스어 지리명과 병행본문의 조화 여부
  chosen_reading: 그리스어 본문대로 '시리아와 페니키아'를 본문에 유지했습니다.
  alternative_readings:
  - 병행하는 에스라서의 행정 구역 표현에 맞추어 조화시키는 읽기
  rationale: 이 책의 번역 기준은 헬라어 본문이므로, 병행본문의 차이를 흡수하지 않고 1 에스드라스의 고유한 그리스어 지리 프레임을 보존하는 것이 원문의 의도에 더 충실합니다.
  doctrine_reference: 'PHILOSOPHY.md: 1 Esdras는 Swete LXX 그리스어 본문을 मुख्य स्रोत으로 삼고, 히브리 병행은 대조 자료로 사용합니다.'
- issue: 지혜의 출처와 소유격 처리
  chosen_reading: '''네 하나님이 주신 지혜''로 옮겨, τοῦ θεοῦ σου의 소유격과 관계성을 드러냈습니다.'
  alternative_readings:
  - '''하나님의 지혜''로 일반화하는 읽기'
  rationale: 앞절의 '네 하나님'과 같은 소유 관계를 유지해야 문맥상 에스라에게 주어진 지혜라는 점이 분명해집니다. 일반화하면 원문의 인칭 관계가 약해집니다.
  doctrine_reference: 본문의 접속 구조와 소유격 일치에 따른 문맥 보존 원칙
