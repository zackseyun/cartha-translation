base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/023.yaml
  text: And you[a], Ezra, according to the wisdom of your God, appoint judges and magistrates, so that they may judge throughout all Syria and Phoenicia all those who know the law of your God; and you shall teach those who do not know it.
  footnotes:
  - marker: a
    text: The Greek text reads 'Syria and Phoenicia,' reflecting 1 Esdras' Greek geographical framing; the Hebrew parallel in Ezra uses different provincial wording.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 에스라여, 그대의 하나님의 지혜를 따라 재판관들과 법관들을 임명하여, 그들이 시리아와 페니키아 전역에서 그대의 하나님의 율법을 아는 모든 사람을 재판하게 하십시오.[a] 율법을 알지 못하는 이들은 그대가 가르치십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 ‘시리아와 페니키아’라고 읽으며, 이는 1 에스드라스의 그리스어 지리적 틀을 반영합니다. 히브리어 병행본문은 다른 행정 구역 표현을 사용합니다.
    reason: alternative_reading
