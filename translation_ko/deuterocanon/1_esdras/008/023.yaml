base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/023.yaml
  text: And you[a], Ezra, according to the wisdom of your God, appoint judges and magistrates, so that they may judge throughout all Syria and Phoenicia all those who know the law of your God; and you shall teach those who do not know it.
  footnotes:
  - marker: a
    text: The Greek text reads 'Syria and Phoenicia,' reflecting 1 Esdras' Greek geographical framing; the Hebrew parallel in Ezra uses different provincial wording.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 너, 에스라야, 네 하나님이 주신 지혜에 따라 재판관들과 판관들을 세워, 그들이 온 시리아와 페니키아에서 네 하나님의 율법을 아는 모든 사람을 재판하게 하라. 그리고 그것을 알지 못하는 사람들은 네가 가르치라.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 '시리아와 페니키아'라고 읽으며, 1 에스드라스의 헬라어 지리 표현을 반영합니다. 히브리 병행본문의 행정 구역 표현과는 다릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνάδειξον
  english_pob_choice: appoint
  chosen_korean: 세워
  alternatives_korean:
  - 임명하라
  - 지정하라
  lexicon: BDAG
  rationale: 임명 행위의 공적이고 권위 있는 성격을 살리면서, 한국어 명령형에서 자연스러운 표현으로 옮겼습니다.
- source_word: κριτὰς καὶ δικαστάς
  english_pob_choice: judges and magistrates
  chosen_korean: 재판관들과 판관들
  alternatives_korean:
  - 재판관들과 치안판사들
  - 재판관들과 행정관들
  lexicon: BDAG
  rationale: 두 명칭의 법정적 구분을 유지하되, 현대 한국어에서 모두 이해 가능한 사법 용어로 살렸습니다. 단일어로 흡수해 버리면 원문의 이중성이 약해집니다.
- source_word: ἐν ὅλῃ Συρίᾳ καὶ Φοινίκῃ
  english_pob_choice: throughout all Syria and Phoenicia
  chosen_korean: 온 시리아와 페니키아에서
  alternatives_korean:
  - 시리아와 페니키아 전역에서
  - 시리아와 페니키아 곳곳에서
  lexicon: LSJ
  rationale: 헬라어 본문의 지리적 범위를 그대로 반영했습니다. 1 에스드라스의 그리스어 지리 표지를 유지하고, 히브리 병행본의 행정 구역 표현으로 맞추어 바꾸지 않았습니다.
- source_word: τὸν νόμον τοῦ θεοῦ σου
  english_pob_choice: the law of your God
  chosen_korean: 네 하나님의 율법
  alternatives_korean:
  - 네 하나님의 법
  - 너의 하나님의 율법
  lexicon: BDAG
  rationale: νόμος는 여기서 토라/율법의 의미이므로 표준적인 '율법'을 택했습니다. σου를 반영해 '네 하나님'으로 옮겨 소유 관계를 분명히 했습니다.
theological_decisions:
- issue: 1 에스드라스의 그리스어 지리명과 병행본문의 조화 여부
  chosen_reading: 그리스어 본문대로 '시리아와 페니키아'를 본문에 유지했습니다.
  alternative_readings:
  - 병행하는 에스라서의 행정 구역 표현에 맞추어 조화시키는 읽기
  rationale: 이 책의 번역 기준은 헬라어 본문이므로, 병행본문의 차이를 흡수하지 않고 1 에스드라스의 고유한 그리스어 지리 프레임을 보존하는 것이 원문의 의도에 더 충실합니다.
  doctrine_reference: 'PHILOSOPHY.md: 1 Esdras는 Swete LXX 그리스어 본문을 मुख्य स्रोत으로 삼고, 히브리 병행은 대조 자료로 사용합니다.'
- issue: 지혜의 출처와 소유격 처리
  chosen_reading: '''네 하나님이 주신 지혜''로 옮겨, τοῦ θεοῦ σου의 소유격과 관계성을 드러냈습니다.'
  alternative_readings:
  - '''하나님의 지혜''로 일반화하는 읽기'
  rationale: 앞절의 '네 하나님'과 같은 소유 관계를 유지해야 문맥상 에스라에게 주어진 지혜라는 점이 분명해집니다. 일반화하면 원문의 인칭 관계가 약해집니다.
  doctrine_reference: 본문의 접속 구조와 소유격 일치에 따른 문맥 보존 원칙
