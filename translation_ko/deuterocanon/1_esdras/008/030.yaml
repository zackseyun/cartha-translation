base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/030.yaml
  text: 'Of the sons of Pharez: Zechariah[a], and with him, according to the record[b], one hundred fifty men.'
  footnotes:
  - marker: a
    text: 'Hebrew parallel: ''Parosh'' rather than ''Pharez.'' The main text follows the Greek witness of 1 Esdras.'
    reason: alternative_reading
  - marker: b
    text: Or 'by written record' / 'from the register'; the phrase refers to genealogical enrollment.
    reason: lexical_alternative
translation:
  language: ko
  text: 파레스 자손 가운데서는 스가랴와, 그와 함께 기록에 등록된 남자 백오십 명이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 평행본문에는 ‘파레스’ 대신 ‘파로쉬’에 해당하는 이름이 나옵니다. 본문은 1 에스드라스의 그리스어 본문을 따라 ‘파레스’로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: ‘기록에 등록된’은 직역하면 ‘기록으로부터’입니다. 문맥상 명부에 기록된 인원을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Φαρές
  english_pob_choice: Pharez
  chosen_korean: 파레스
  alternatives_korean:
  - 바레스
  - 파레스
  lexicon: LSJ
  rationale: 그리스어 고유명사 Φαρές를 음역하되, 1 Esdras의 그리스어 본문을 우선하여 히브리어 평행본문의 פארוש(파로쉬)와 구별되게 옮겼습니다.
- source_word: ἀπὸ γραφῆς
  english_pob_choice: according to the record
  chosen_korean: 족보 기록에 따라
  alternatives_korean:
  - 기록에 따라
  - 등록부에 따라
  - 기록상
  lexicon: LSJ
  rationale: 직역하면 ‘기록/문서로부터’이지만, 문맥상 인구·족보 등록을 가리키므로 한국어에서는 ‘족보 기록에 따라’로 풀어 의미를 분명히 했습니다.
- source_word: ἄνδρες
  english_pob_choice: men
  chosen_korean: 남자
  alternatives_korean:
  - 사람
  - 인원
  - 남성들
  lexicon: LSJ
  rationale: 본문이 성별을 가진 성인 남성을 가리키므로, 중립화하지 않고 ‘남자’로 옮겨 수사적·인구조사적 뉘앙스를 살렸습니다.
- source_word: ἑκατὸν πεντήκοντα
  english_pob_choice: one hundred fifty
  chosen_korean: 백오십 명
  alternatives_korean:
  - 백오십 사람
  - 일백오십 명
  lexicon: LSJ
  rationale: 숫자는 현대 한국어의 자연스러운 표기로 옮기고, 인원수를 나타내는 단위를 보완해 문맥을 살렸습니다.
theological_decisions:
- issue: 히브리어 평행본문과 그리스어 본문의 이름 차이
  chosen_reading: 본문은 그리스어 Φαρές를 따라 ‘파레스’로 두고, 히브리어 평행본문의 다른 형태는 본문에 반영하지 않았습니다.
  alternative_readings:
