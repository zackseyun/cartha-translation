  - severity: medium
    issue: τιμωρίᾳ에 ‘다른’을 첨가함
    rationale: 원문은 ‘죽음’과 ‘형벌’을 병렬로 열거할 뿐 ‘다른 형벌’이라고 한정하지 않습니다.
  - severity: low
    issue: 소유격 표현과 각주 표지의 자연성
    rationale: ‘당신의 하나님의 율법’이 더 자연스럽고, ἐπιμελῶς 및 ἀπαγωγῇ 관련 각주는 각각 ‘엄정하게’와 ‘구금’ 뒤에 붙이는 것이 정확합니다.
