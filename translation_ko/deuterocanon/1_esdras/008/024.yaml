revisions:
- from: 그리고 당신의 하나님 율법과 왕의 율법을 모두 어기는 사람은 누구나, 죽음이든 다른 형벌이든, 은화의 벌금이든 재산 몰수든, 철저히 벌받을 것입니다.[a][b][c]
  to: 그리고 당신의 하나님의 율법과 왕의 율법, 곧 두 율법을 모두 어기는 사람은 누구나 엄정하게[b] 처벌받을 것입니다. 죽음이든 형벌이든, 은으로 내는 벌금이든 구금이든[c] 그러할 것입니다.[a]
  rationale: 그리스어 본문을 우선하여 ἀπαγωγῇ의 의미를 법률 문맥과 대응 본문에 맞게 ‘구금’으로 수정했습니다. 영어 POB 감사 기록의 ‘confiscation’은 가능한 해석이지만, 본문 번역으로 확정하기에는 근거가 약하므로 각주에서 대안으로 보존했습니다. 원문에 없는 ‘다른’을 삭제하고, 한국어 소유격과 벌금 표현을 현대 표준어에 맞게 다듬었으며, 각주 표지를 관련 낱말에 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:04:11Z'
