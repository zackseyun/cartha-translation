theological_decisions:
- issue: ‘하나님의 율법’과 ‘왕의 율법’의 이중 책임
  chosen_reading: 두 법에 모두 대한 위반을 병렬적으로 제시하여, 종교적·정치적 법질서 둘 다에 대한 책임을 드러냈습니다.
  alternative_readings:
  - 둘 중 하나를 어기는 경우로 완화하는 해석
  - ‘왕의 율법’을 단순한 왕권 일반으로 희석하는 해석
  rationale: Greek의 καὶ ... καὶ는 선택 관계가 아니라 병렬 결합이므로, 두 법 모두에 대한 위반으로 읽는 것이 자연스럽습니다.
  doctrine_reference: 'DOCTRINE.md §Translation philosophy #1, #5'
- issue: MT 병행본문과의 불일치
  chosen_reading: 주어진 히브리어/MT 평행문보다 그리스어 본문을 우선해 번역했습니다.
  alternative_readings:
  - MT 표현에 맞추어 본문을 조정하는 방법
  rationale: 이 절은 제공된 MT 병행본문과 내용상 현저히 어긋나므로, 원천 본문인 그리스어를 기준으로 삼아야 합니다.
  doctrine_reference: PHILOSOPHY.md 'Original-language primacy'
