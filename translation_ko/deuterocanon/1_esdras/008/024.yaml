base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/024.yaml
  text: And all who transgress both the law of your God and the king’s law shall be diligently punished[a], whether by death or by punishment[c][b], by a fine of silver or by confiscation.
  footnotes:
  - marker: a
    text: The Greek source here differs materially from the supplied MT parallel, which corresponds to a different context; this translation therefore follows the Greek as the primary witness.
    reason: textual_variant
  - marker: b
    text: Or 'strictly punished'; the adverb may emphasize diligent enforcement rather than mere careful procedure.
    reason: lexical_alternative
  - marker: c
    text: Or 'banishment' for 'confiscation'; the Greek term can denote removal, but in this legal list it is best understood as seizure of property.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 당신의 하나님 율법과 왕의 율법을 모두 어기는 사람은 누구나, 죽음이든 다른 형벌이든, 은화의 벌금이든 재산 몰수든, 철저히 벌받을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제공된 히브리어/MT 평행문은 이 절과 실질적으로 일치하지 않으므로, 번역은 그리스어 본문을 우선했습니다.
    reason: textual_variant
  - marker: b
    text: ‘철저히’는 ἐπιμελῶς의 집행 강도를 살린 번역입니다. ‘주의 깊게’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ἀπαγωγῇ는 이 법률 문맥에서 사람의 추방보다 재산의 몰수 또는 박탈을 가리키는 것으로 이해했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: παραβαίνωσι
  english_pob_choice: transgress
  chosen_korean: 어기는
  alternatives_korean:
  - 범하는
  - 위반하는
  lexicon: BDAG
  rationale: 법률 문맥에서 ‘어기다’는 규범을 넘어서 위반한다는 뜻을 자연스럽고 직접적으로 드러냅니다.
- source_word: τοῦ νόμον τοῦ θεοῦ σου
  english_pob_choice: the law of your God
  chosen_korean: 당신의 하나님 율법
  alternatives_korean:
  - 당신의 하나님 법
  - 하나님의 가르침
  lexicon: BDAG
  rationale: νόμος는 여기서 행정·법적 문맥의 ‘율법’이 적절하며, 소유격 구조를 살려 ‘당신의 하나님 율법’으로 옮겼습니다.
- source_word: τοῦ βασιλικοῦ
  english_pob_choice: the king’s law
  chosen_korean: 왕의 율법
  alternatives_korean:
  - 왕의 법
  - 왕실의 법
  lexicon: LSJ
  rationale: 앞의 ‘하나님 율법’과 평행을 이루는 축약 표현이므로, 문맥상 소유 관계를 풀어 ‘왕의 율법’으로 옮기는 것이 가장 분명합니다.
- source_word: ἐπιμελῶς
  english_pob_choice: diligently
  chosen_korean: 철저히
  alternatives_korean:
  - 주의 깊게
  - 엄정하게
  - 근면히
  lexicon: LSJ
  rationale: 형벌 집행의 방식이므로 단순한 태도보다 강한 집행 뉘앙스를 가진 ‘철저히’가 문맥에 맞습니다.
- source_word: τιμωρίᾳ
  english_pob_choice: punishment
  chosen_korean: 형벌
  alternatives_korean:
  - 벌
  - 처벌
  lexicon: LSJ
  rationale: 뒤의 벌금·몰수와 함께 법적 제재 목록을 이루므로, 일반적이면서도 제도적인 ‘형벌’이 적절합니다.
- source_word: ἀπαγωγῇ
  english_pob_choice: confiscation
  chosen_korean: 재산 몰수
  alternatives_korean:
  - 추방
  - 압류
  - 몰수
  lexicon: LSJ
  rationale: 법정 제재 목록의 마지막 항목으로는 신체적 추방보다 재산의 박탈을 가리키는 ‘재산 몰수’가 문맥상 가장 자연스럽습니다.
theological_decisions:
- issue: ‘하나님의 율법’과 ‘왕의 율법’의 이중 책임
  chosen_reading: 두 법에 모두 대한 위반을 병렬적으로 제시하여, 종교적·정치적 법질서 둘 다에 대한 책임을 드러냈습니다.
  alternative_readings:
  - 둘 중 하나를 어기는 경우로 완화하는 해석
  - ‘왕의 율법’을 단순한 왕권 일반으로 희석하는 해석
  rationale: Greek의 καὶ ... καὶ는 선택 관계가 아니라 병렬 결합이므로, 두 법 모두에 대한 위반으로 읽는 것이 자연스럽습니다.
  doctrine_reference: 'DOCTRINE.md §Translation philosophy #1, #5'
- issue: MT 병행본문과의 불일치
  chosen_reading: 주어진 히브리어/MT 평행문보다 그리스어 본문을 우선해 번역했습니다.
  alternative_readings:
  - MT 표현에 맞추어 본문을 조정하는 방법
  rationale: 이 절은 제공된 MT 병행본문과 내용상 현저히 어긋나므로, 원천 본문인 그리스어를 기준으로 삼아야 합니다.
  doctrine_reference: PHILOSOPHY.md 'Original-language primacy'
