  source_fidelity: 그리스어의 수신자 표지(Ἔσρᾳ), 두 직함(τῷ ἱερεῖ καὶ ἀναγνώστῃ), ‘주님의 율법’(τοῦ νόμου Κυρίου), 그리고 서신 인사말(χαίρειν)을 충실히 반영합니다. MT 평행본문의 ‘서기관’으로 본문을 조화시키지 않습니다.
