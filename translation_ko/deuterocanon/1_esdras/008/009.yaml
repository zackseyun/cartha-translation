base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/009.yaml
  text: King Artaxerxes to Ezra the priest and reader of the law of the Lord[a], greetings.
  footnotes:
  - marker: a
    text: The Greek reads 'reader of the law of the Lord'; the Hebrew parallel in Ezra 7:12 has 'scribe of the law of the God of heaven.'
    reason: alternative_reading
translation:
  language: ko
  text: 아르타크세르크세스 왕은 제사장이며 주님의 율법을 읽는 에스라에게 문안합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 ‘주님의 율법을 읽는 이’라고 합니다. 에스라 7:12의 대응하는 히브리어 평행본문은 ‘하늘의 하나님의 율법의 서기관’이라고 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Βασιλεὺς
  english_pob_choice: King
  chosen_korean: 왕
  alternatives_korean:
  - 그 왕
  - 임금
  lexicon: LSJ
  rationale: 서신 머리말의 칭호로 쓰인 무관사 표현이므로, 자연스러운 호칭인 “왕”으로 옮겼습니다.
- source_word: Ἀρταξέρξης
  english_pob_choice: Artaxerxes
  chosen_korean: 아르타크세르크세스
  alternatives_korean:
  - 아닥사스다
  - 아르타크세르크세스
  lexicon: 표준 외래어 표기
  rationale: 고유명사는 음역하되, 한국어 표기법에 맞는 현대 표기를 사용했습니다.
- source_word: τῷ ἱερεῖ
  english_pob_choice: the priest
  chosen_korean: 제사장
  alternatives_korean:
  - 그 제사장
  - 사제
  lexicon: LSJ
  rationale: 에스라의 직분을 지칭하는 관형적 호칭이므로, 한국어에서는 직함만 앞세워 “제사장 에스라”로 자연스럽게 처리했습니다.
- source_word: ἀναγνώστῃ
  english_pob_choice: reader
  chosen_korean: 읽는 사람
  alternatives_korean:
  - 낭독자
  - 서기관
  lexicon: LSJ
  rationale: 그리스어가 분명히 ἀναγνώστῃ(읽는 사람, 낭독자)를 쓰므로, MT의 “서기관”으로 평준화하지 않고 기능을 드러내는 표현을 택했습니다.
- source_word: τοῦ νόμου Κυρίου
  english_pob_choice: of the law of the Lord
  chosen_korean: 주님의 율법
  alternatives_korean:
  - 주의 율법
  - 주님의 법
  lexicon: LSJ
  rationale: νόμος는 프로젝트 기본값에 따라 “율법”으로, κύριος는 문맥상 하나님을 가리키는 소유격이므로 “주님의”로 옮겼습니다.
- source_word: χαίρειν
  english_pob_choice: greetings
  chosen_korean: 인사합니다
  alternatives_korean:
  - 문안합니다
  - 안부를 전합니다
  lexicon: LSJ
  rationale: 서신 서두의 관용적 용례를 한국어 공문체에 맞게 살려 “인사합니다”로 옮겼습니다.
theological_decisions:
- issue: 그리스어 본문의 ἀναγνώστῃ를 MT 평행본문의 ‘서기관’으로 조화시킬지 여부
  chosen_reading: ‘읽는 사람’으로 그대로 반영했습니다.
  alternative_readings:
  - 서기관
  - 율법학자
  rationale: 1 에스드라의 우선 본문은 그리스어이며, 본절은 에스라를 ‘주님의 율법을 읽는 사람’이라고 직접 규정합니다. 평행 MT는 비교 자료로만 두고 본문 어휘를 바꾸지 않았습니다.
  doctrine_reference: 원어 우선 원칙과 평행본문의 보조적 사용
