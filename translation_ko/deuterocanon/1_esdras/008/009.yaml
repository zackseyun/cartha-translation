- from: 아르타크세르크세스 왕이 제사장 에스라, 곧 주님의 율법을 읽는 사람에게 인사합니다.[a]
  to: 아르타크세르크세스 왕은 제사장이며 주님의 율법을 읽는 에스라에게 문안합니다.[a]
  rationale: 그리스어 ἀναγνώστῃ를 ‘서기관’으로 바꾸지 않고 ‘읽는 이’의 뜻을 유지했습니다. 다만 수신자 머리말에 어울리는 현대 한국어 격식과 두 직함의 병렬을 위해 문장을 다듬었습니다. 각주 표지는 그리스어와 히브리어 평행본문 사이의 직함 차이를 정확히 가리킵니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:04:01Z'
