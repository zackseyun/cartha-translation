base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/025.yaml
  text: Blessed be the Lord alone[a], who put these things into the heart of the king,
  footnotes:
  - marker: a
    text: The Greek here is difficult, reading literally something like 'into the heart of me/of the king.' The sense is likely that God put this resolve into the king's heart; 'my lord the king' reflects that probable meaning.
    reason: textual_variant
translation:
  language: ko
  text: 야훼 홀로 찬송받으소서. 그분께서 이러한 일들을 왕의 마음에 넣으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전승된 그리스어는 문자적으로 ‘내 마음, 왕의’처럼 읽힐 수 있는 μου τοῦ βασιλέως라는 난해한 표현을 사용합니다. 문맥상 하나님께서 이러한 일들을 왕의 마음에 두셨다는 뜻으로 이해하는 것이 가장 자연스럽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: εὐλογητὸς
  english_pob_choice: Blessed be
  chosen_korean: 찬송이 있을지니
  alternatives_korean:
  - 복되십니다
  - 찬양받으소서
  lexicon: LSJ
  rationale: 헬라어 축복 선언형을 한국어의 경건한 송축 표현으로 옮겼습니다. 합쇼체 서술문이면서도 선언적 울림을 살리기 위해 ‘찬송이 있을지니’를 택했습니다.
- source_word: μόνος
  english_pob_choice: alone
  chosen_korean: 오직
  alternatives_korean:
  - 홀로
  - 단독으로
  lexicon: LSJ
  rationale: κύριος를 향한 배타성을 분명히 하되, 한국어 축문에서 자연스럽게 들리는 부사로 옮겼습니다.
- source_word: ὁ κύριος
  english_pob_choice: the Lord
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 주
  lexicon: 'DOCTRINE.md Contested terms: κύριος → Lord / project default YHWH → 야훼'
  rationale: 이 구절은 구약 헬라어 축복문 맥락에서 야훼를 가리키므로 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: ὁ δοὺς ταῦτα εἰς τὴν καρδίαν
  english_pob_choice: who put these things into the heart
  chosen_korean: 그분께서 이런 것들을 마음에 넣으셨습니다
  alternatives_korean:
  - 이것들을 마음속에 두셨습니다
  - 이런 것들을 마음에 넣어 주셨습니다
  lexicon: BDAG
  rationale: δίδωμι + εἰς τὴν καρδίαν의 관용적 의미를 따라, 외적 제시가 아니라 내적 प्रेर감/결심의 주입을 드러내는 ‘마음에 넣으셨습니다’로 옮겼습니다.
- source_word: μου τοῦ βασιλέως
  english_pob_choice: of my lord the king / of the king
  chosen_korean: 왕의
  alternatives_korean:
  - 내 왕의
  - 내 주 왕의
  lexicon: BDAG
  rationale: 전승된 그리스어가 어색하지만 문맥상 ‘왕의 마음’이 가장 자연스럽습니다. 소유격의 난점을 과장하지 않고, 본문 의미를 우선해 간결하게 처리했습니다.
theological_decisions:
- issue: κύριος의 대상과 구약적 호칭 처리
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 주
  rationale: 그리스어 κύριος가 이 송축문에서 하나님의 언약명 야훼를 가리키는 것으로 읽히므로, 전통 교회 용례보다 स्रोत-대응을 우선했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος; YHWH rendering policy'
- issue: ‘마음에 넣다’의 내적 प्रेर감 표현
  chosen_reading: 마음에 넣으셨습니다
  alternative_readings:
  - 생각나게 하셨습니다
  - 결심하게 하셨습니다
  rationale: 본문은 왕의 외적 행동보다 하나님의 내적 작용을 말하므로, 결과를 앞당겨 해석하지 않고 원문의 관용구를 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3
