base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/018.yaml
  text: And whatever else may come up as a need for the house of your God[a], you shall give from the royal treasury.
  footnotes:
  - marker: a
    text: Or, 'for the temple of your God' or 'for the sanctuary of your God.' The Greek reads 'the holy precinct/temple,' while the parallel Semitic witness supports 'house of your God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 밖에 하나님의 집에 더 필요한 것이 생기면, 왕실 금고에서 지급하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 하나님의 성전’ 또는 ‘당신의 하나님의 성소’. 그리스어는 ‘신성한 구역’ 또는 ‘성전’을 뜻하며, 평행 셈어 본문은 ‘하나님의 집’을 지지합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: τὰ λοιπὰ
  english_pob_choice: whatever else
  chosen_korean: 그 밖에 … 무엇이든
  alternatives_korean:
  - 나머지 것들
  - 그 나머지 일들
  - 그 밖의 것들
  lexicon: LSJ
  rationale: 단순한 ‘나머지’보다, 이미 언급된 것 외에 추가로 발생하는 항목들을 포괄하는 뜻이므로 자연스러운 현대 한국어로 풀었습니다.
- source_word: ὅσα ἂν ὑποπίπτῃ σοι
  english_pob_choice: may come up
  chosen_korean: 생기면
  alternatives_korean:
  - 발생하면
  - 일어나면
  - 마주치면
  lexicon: LSJ
  rationale: 조건적 뉘앙스를 살리면서도 행정 문맥에 맞는 자연스러운 표현으로 옮겼습니다.
- source_word: εἰς τὴν χρείαν
  english_pob_choice: as a need
  chosen_korean: 필요한 일
  alternatives_korean:
  - 필요
  - 필수로 필요한 것
  - 필요한 것
  lexicon: LSJ
  rationale: χρεία의 핵심 의미인 필요/필요성에 맞추되, 한국어에서는 ‘필요한 일’이 문맥상 가장 매끄럽습니다.
- source_word: τοῦ ἱεροῦ τοῦ θεοῦ σου
  english_pob_choice: for the house of your God
  chosen_korean: 하나님의 집에
  alternatives_korean:
  - 당신의 하나님의 집에
  - 당신의 하나님의 성전에
  - 당신의 하나님의 성소에
  lexicon: LSJ
  rationale: 헬라어 ἱερόν의 성전/신성 구역 의미와, 평행 히브리어의 ‘하나님의 집’이 가리키는 기관적 의미를 함께 반영했습니다.
- source_word: ἐκ τοῦ βασιλικοῦ γαζοφυλακίου
  english_pob_choice: from the royal treasury
  chosen_korean: 왕실 금고에서
  alternatives_korean:
  - 왕의 금고에서
  - 왕실 보물고에서
  - 왕실 خز고에서
  lexicon: LSJ
  rationale: γᾰζοφυλάκιον은 재정 보관소를 가리키므로, 현대 한국어에서는 ‘금고’가 가장 직접적이고 공식적입니다.
theological_decisions:
- issue: ἱερόν을 ‘성전/성소’로 좁힐지, 평행 본문을 따라 ‘하나님의 집’으로 옮길지
  chosen_reading: 하나님의 집
  alternative_readings:
  - 성전
  - 성소
  rationale: 이 절은 행정적 기부 지시로서, 평행 셈어 증거가 지시하는 기관적 표현을 살리는 편이 원문의 의도를 더 잘 전달합니다.
