lexical_decisions:
- source_word: ἐκ τῶν ἱερέων
  english_pob_choice: from the priests
  chosen_korean: 제사장들 가운데서
  alternatives_korean:
  - 제사장들로부터
  - 제사장들 중에서
  lexicon: BDAG
  rationale: ἐκ은 출처/범위 모두를 가리킬 수 있으므로, 한국어에서는 자연스럽고 문맥에 맞는 ‘가운데서’로 옮겨 집단 안에서 찾았다는 뜻을 살렸습니다.
- source_word: ἐκ τῶν Λευειτῶν
  english_pob_choice: from the Levites
  chosen_korean: 레위인들 가운데서
  alternatives_korean:
  - 레위인들로부터
  - 레위인들 중에서
  lexicon: BDAG
  rationale: 앞의 ‘제사장들’과 병렬을 이루도록 동일하게 처리해, 대칭성과 탐색 대상의 범위를 분명히 했습니다.
- source_word: οὐχ εὗρον
  english_pob_choice: I found no one
  chosen_korean: 아무도 찾지 못했습니다
  alternatives_korean:
  - 찾지 못했습니다
  - 아무도 발견하지 못했습니다
  lexicon: BDAG
  rationale: 1인칭 단수의 행위를 드러내면서, 한국어에서는 대상이 생략되지 않도록 ‘아무도’로 보완해 자연스럽게 표현했습니다.
- source_word: ἐκεῖ
  english_pob_choice: there
  chosen_korean: 거기서
  alternatives_korean:
  - 거기
  - 그곳에서
  lexicon: BDAG
  rationale: 장소 부사로서 조사 ‘-서’를 붙여, ‘그곳에서 찾아도 없었다’는 장면성을 살렸습니다.
theological_decisions:
- issue: 그리스어 본문과 제공된 히브리어/MT 병행본의 불일치
  chosen_reading: 그리스어 본문을 따라 ‘제사장들과 레위인들 가운데서 거기서 아무도 찾지 못했습니다’로 번역했습니다.
  alternative_readings:
  - MT 병행의 다른 인명 목록을 반영한 재구성
  - 병행본을 따라 본문을 바꾸는 번역
  rationale: 이 절의 주 번역 기준은 그리스어이며, 제공된 MT 병행은 근접 대응이 아닌 다른 재료로 보이므로 본문을 혼합하지 않고 Greek witness를 유지했습니다.
  doctrine_reference: 원천 언어 우선 원칙 및 병행 본문은 보조 증거로만 사용하는 POB deuterocanon 번역 원칙
