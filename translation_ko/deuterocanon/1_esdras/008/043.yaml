  source_fidelity: 그리스어의 1인칭 단수 동사 εὗρον은 화자가 ‘나’임을 나타냅니다. 초안의 종결형만으로도 문맥상 가능하지만, 한국어에서는 주어를 명시하면 원문의 인칭을 더 분명히 보존할 수 있습니다. ‘제사장들과 레위인들 가운데’ 및 ‘그곳에서’는 각각 ἐκ τῶν ἱερέων καὶ ἐκ τῶν Λευειτῶν 및 ἐκεῖ를 충실히 반영합니다.
