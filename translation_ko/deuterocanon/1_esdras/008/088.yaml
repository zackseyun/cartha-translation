base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/088.yaml
  text: Look, we are before you in our lawless deeds, for it is no longer possible to stand before you because of these things.
  footnotes:
  - marker: a
    text: Or, 'in our iniquities.' The Greek ἀνομίαι can denote acts of lawlessness or the state of guilt resulting from them.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew parallel (Ezra 9:14) expresses the same crisis in different words, emphasizing God's anger and the possible end of any remnant; 1 Esdras here frames it as an inability to stand before God because of these sins.
    reason: cross_reference
translation:
  language: ko
  text: 보십시오, 우리는 우리의 불법들 가운데서 주 앞에 서 있습니다. 이 일들 때문에 더는 주 앞에 서 있을 수 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리의 죄악들 가운데서’입니다. 그리스어 ἀνομίαι는 율법 위반 행위와 그로 인한 죄책 상태를 함께 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절의 핵심은 하나님 앞에 더 이상 설 수 없다는 회개적 고백입니다. 히브리어 평행본문은 멸망 위기와 남은 자의 소멸 가능성을 더 강하게 드러내지만, 본문은 그리스어를 직접 따라갑니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἰδοὺ
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보소서
  lexicon: BDAG
  rationale: 강한 주목을 요구하는 감탄사로서, 현대 합쇼체에서 자연스럽고도 직접적인 호소를 살리기 위해 ‘보십시오’를 선택했습니다.
- source_word: ἐσμὲν ἐνώπιόν σου
  english_pob_choice: we are before you
  chosen_korean: 우리는 주 앞에 서 있습니다
  alternatives_korean:
  - 우리는 주 앞에 있습니다
  - 우리는 주님의 임재 앞에 있습니다
  lexicon: BDAG
  rationale: 단순한 위치보다 법정적·예배적 대면의 뉘앙스를 살리기 위해 ‘주 앞에 서 있습니다’로 옮겼습니다.
- source_word: ἐν ταῖς ἀνομίαις ἡμῶν
  english_pob_choice: in our lawless deeds
  chosen_korean: 우리의 불법들 가운데서
  alternatives_korean:
  - 우리의 불법 가운데
  - 우리의 죄악들 가운데서
  - 우리의 불법 행위들 가운데서
  lexicon: BDAG
  rationale: ἀνομίαις의 핵심은 율법/계명에 대한 위반이므로 ‘불법들’이 가장 직역적입니다. 문맥상 상태를 나타내는 전치사구로 자연스럽게 읽히도록 ‘가운데서’를 붙였습니다.
- source_word: στῆναι ἔτι ἔμπροσθέν σου
  english_pob_choice: it is no longer possible to stand before you
  chosen_korean: 더는 주 앞에 서 있을 수 없습니다
  alternatives_korean:
  - 더는 주 앞에 설 수 없습니다
  - 이제는 주 앞에 서는 것이 불가능합니다
  lexicon: BDAG
  rationale: στῆναι의 ‘서다’ 이미지를 살리면서, 한국어에서는 가능성 표현으로 풀어 ‘서 있을 수 없습니다’라고 자연스럽게 옮겼습니다.
- source_word: ἐπὶ τούτοις
  english_pob_choice: because of these things
  chosen_korean: 이 일들 때문에
  alternatives_korean:
  - 이것들로 말미암아
  - 이 일들로 인해
  - 이 일들로 인해서
  lexicon: BDAG
  rationale: 마지막 절의 원인 관계를 분명히 드러내되, 지나치게 해설적으로 확대하지 않기 위해 가장 간결한 인과 표현을 사용했습니다.
theological_decisions:
- issue: ἀνομίαις를 죄책 상태로 완화할지, 불법 행위의 직접성을 유지할지
  chosen_reading: ‘우리의 불법들’로 직접 옮겨, 하나님 앞에 설 수 없게 만든 계명 위반의 현실을 드러냈습니다.
  alternative_readings:
  - 우리의 죄악들
  - 우리의 불의 가운데서
  - 우리의 불법 행위들
  rationale: 회개 기도 문맥이지만, 본문은 단지 내적 죄책보다 실제적인 율법 위반을 말하므로 ‘불법들’이 소스의 법정·언약적 긴장을 가장 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: original-language primacy; preserve legal/covenantal force of penitential confession'
