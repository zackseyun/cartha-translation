base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/001.yaml
  text: And after these things[a], in the reign of Artaxerxes king of the Persians, Ezra son of Azariah, son of Zechariah, son of Chelkiah, son of Shallum[b], came up.
  footnotes:
  - marker: a
    text: 'Greek: ''king of the Persians''; the Hebrew parallel in Ezra 7:1 reads ''king of Persia.'' The main text follows the Greek source of 1 Esdras.'
    reason: alternative_reading
  - marker: b
    text: Greek 'Chelkiah' corresponds to the name more commonly rendered 'Hilkiah' in the Hebrew parallel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이 일들 뒤에, 페르시아인의 왕[a] 아르타크세르크세스가 통치하던 때에, 아자랴의 아들이며, 아자랴는 제크리의 아들이고, 제크리는 첼기야[b]의 아들이며, 첼기야는 살레모스의 아들인 에스라가 올라왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘페르시아인의 왕’이라고 하며, 에스라 7:1의 히브리어 평행본문은 ‘페르시아의 왕’이라고 합니다. 본문은 1 Esdras의 그리스어를 따릅니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어 ‘첼기야’는 히브리어 평행본문에서 더 흔히 ‘힐기야’로 옮겨집니다.
    reason: lexical_alternative
