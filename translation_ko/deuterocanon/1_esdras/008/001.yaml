revisions:
- from: 그리고 이 일들[a] 뒤에, 페르시아인의 왕 아르타크세르크세스가 통치하던 때에, 에스라가—아자랴의 아들이요, 제카랴의 아들이요, 첼기야의 아들이요, 살룸의 아들인—올라왔습니다.[b]
  to: 그리고 이 일들 뒤에, 페르시아인의 왕[a] 아르타크세르크세스가 통치하던 때에, 아자랴의 아들이며, 아자랴는 제크리의 아들이고, 제크리는 첼기야[b]의 아들이며, 첼기야는 살레모스의 아들인 에스라가 올라왔습니다.
  rationale: 그리스어를 우선하여 족보의 세대 관계를 명시적으로 바로잡고, Ζεχρίου와 Σαλήμου의 인명 형태를 영어 감사 기록의 조화적 이름들에 맞추지 않고 원문에 가깝게 반영했습니다. 의미 변화 없이 주석 표지도 각각의 관련 어구로 옮겼습니다.
