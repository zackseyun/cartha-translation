theological_decisions:
- issue: 문두의 χρονικός 전환과 서사 초점
  chosen_reading: ‘이 일들 뒤에’로 시작해 사건의 시간적 전환을 자연스럽게 드러내고, 이후의 ‘올라왔습니다’로 에스라의 예루살렘 상행을 서사적으로 읽게 했습니다.
  alternative_readings:
