  verdict: revise
  source_fidelity: 시간 전환과 아르타크세르크세스의 통치라는 배경, 그리고 προσέβη의 ‘올라오다’는 대체로 충실합니다. 그러나 족보 속격들의 연쇄는 에스라가 각 인물의 아들이라는 병렬 표현이 아니라, 아자랴-제크리-첼기야-살레모스로 이어지는 세대 관계입니다. 또한 그리스어 Ζεχρίου는 통상적인 그리스어 ‘스가랴’(Ζαχαρίας)와 구별되는 형태이므로, 원문 우선 원칙에 따라 ‘제크리’로 옮기는 것이 안전합니다. Σαλήμου도 본문 표면형에 맞추어 ‘살레모스’로 옮겼습니다.
  naturalness: 수정문은 한국어 족보 서술에서 자연스러운 관계절을 사용하여 각 세대의 관계를 명확히 하면서, 현대 표준어 합쇼체를 유지합니다. 대시로 삽입된 원문의 표현은 길고 수식 관계가 불명료해질 수 있어 풀어 썼습니다.
  terminology: 에스라와 아자랴는 널리 쓰이는 성경식 표기를 유지했습니다. ‘첼기야’는 그리스어 본문의 형태를 따라 유지하되, 히브리어 평행본문의 익숙한 대응형 ‘힐기야’는 주석으로 밝혔습니다. 원문과 영어 감사 기록의 ‘Zechariah/제카랴’는 그리스어 Ζεχρίου의 정확한 반영이 아니므로 ‘제크리’로 바로잡았습니다.
  issues:
  - severity: high
    issue: 족보의 문법적 관계가 잘못 표현되었습니다.
    rationale: 초안의 ‘에스라가—아자랴의 아들이요, 제카랴의 아들이요 …’는 에스라가 나열된 모든 인물의 아들인 것처럼 읽힙니다. 그리스어의 반복되는 속격과 τοῦ는 각 인물이 바로 앞 인물의 아들임을 나타냅니다.
  - severity: medium
    issue: 제카랴라는 인명은 그리스어 원문 Ζεχρίου와 일치하지 않습니다.
    rationale: 통상 ‘스가랴/Zechariah’에 해당하는 그리스어 형태는 Ζαχαρίας입니다. 여기의 Ζεχρίου는 별개의 짧은 이름 형태이므로, 영어 감사 기록의 조화적 식별을 그대로 따르지 않고 음역에 가까운 ‘제크리’를 사용했습니다.
