base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/050.yaml
  text: And there I proclaimed a fast before our Lord for the young men[b][a],
  footnotes:
  - marker: a
    text: Greek literally, 'And there I prayed/vowed a fast for the young men before our Lord.' The Hebrew parallel reads, 'And there I proclaimed a fast ... before our God,' which likely explains the sense adopted here for the verb.
    reason: alternative_reading
  - marker: b
    text: 'The Hebrew parallel to Ezra 8:21 continues with details not present in this Greek line: the fast is proclaimed at the river Ahava to humble themselves before God and seek a straight path for themselves, their children, and all their possessions.'
    reason: cross_reference
translation:
  language: ko
  text: 그리고 거기서 우리 주 앞에서 젊은이들을 위하여 금식을 서원했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 εὐξάμην은 ‘기도했습니다’ 또는 ‘서원했습니다’라는 뜻입니다. 따라서 이 표현은 문자적으로 ‘금식을 서원했습니다’로 옮겼습니다. 히브리어 병행구는 ‘내가 금식을 선포하였다’라고 읽습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 병행구에는 장소인 아하와 강과, 하나님 앞에서 스스로를 낮추며 자신들과 자녀들과 모든 소유를 위하여 바른 길을 구한다는 목적이 더 자세히 나옵니다.
    reason: cross_reference
lexical_decisions:
- source_word: εὐξάμην
  english_pob_choice: I proclaimed
  chosen_korean: 선포했습니다
  alternatives_korean:
  - 기도했습니다
  - 서원했습니다
  - 불렀습니다
  lexicon: LSJ
  rationale: 직역하면 ‘기도하다/서원하다’이지만, 히브리어 병행구의 ‘내가 선포하였다’가 이 대목의 뜻을 더 분명히 드러내므로 금식을 공표한 행위로 옮겼습니다.
- source_word: νηστείαν
  english_pob_choice: a fast
  chosen_korean: 금식
  alternatives_korean:
  - 한 금식
  - 단식
  lexicon: LSJ
  rationale: 명사 목적어로서 자연스럽게 ‘금식’으로 옮기되, 한국어 관용에 맞게 ‘한’은 생략해도 의미가 유지됩니다.
- source_word: τοῖς νεανίσκοις
  english_pob_choice: for the young men
  chosen_korean: 젊은이들을 위해
  alternatives_korean:
  - 젊은 남자들을 위해
  - 청년들을 위해
  lexicon: LSJ
  rationale: νεανίσκοι는 연령대가 있는 남성 청년층을 가리키므로, 지나치게 현대적 제도어인 ‘청년들’보다 직접적인 ‘젊은이들’이 더 무난합니다.
- source_word: ἔναντι κυρίου ἡμῶν
  english_pob_choice: before our Lord
  chosen_korean: 우리 주 앞에서
  alternatives_korean:
  - 우리 주님 앞에서
  - 우리 주의 면전에서
  lexicon: LSJ
  rationale: ἔναντι는 ‘~앞에/면전에서’의 뜻이므로 예배적 맥락을 살려 ‘앞에서’로 옮겼고, κύριος는 이 책의 문맥에서 ‘주’로 유지했습니다.
theological_decisions:
- issue: 그리스어 본문과 히브리어 병행구의 동사 차이
  chosen_reading: 본문에는 ‘선포했습니다’로, 각주에는 그리스어의 더 문자적인 가능성인 ‘기도했습니다/서원했습니다’를 반영했습니다.
  alternative_readings:
  - 기도했습니다
  - 서원했습니다
  rationale: 그리스어 εὐξάμην은 보통 ‘기도하다/서원하다’이지만, 병행 히브리어가 금식의 선포를 분명히 보여 주므로 본문은 그 장면의 의미를 우선하고, 문자적 여지는 각주로 보존했습니다.
  doctrine_reference: 'Translation philosophy: optimal-equivalence; parallel_source handling'
