  verdict: revise
  source_fidelity: 그리스어의 주동사 εὐξάμην은 통상 ‘기도하다’ 또는 ‘서원하다’이며, 본문 자체만으로 ‘선포하다’라는 뜻을 확정하기는 어렵습니다. 히브리어 병행구의 ‘금식을 선포하다’는 중요한 문맥적 대조이지만, 그리스어를 우선하는 본문에서는 그 차이를 각주에만 남기고 동사를 대체하지 않는 편이 안전합니다. τοῖς νεανίσκοις의 여격은 ‘젊은이들을 위하여’로 보존했습니다.
  naturalness: ‘금식을 서원했습니다’는 현대 표준 한국어의 격식 있는 성경 문체에서 자연스럽고, 그리스어의 다소 특이한 결합을 과도하게 해석하지 않습니다. ‘우리 주 앞에서’도 ἔναντι κυρίου ἡμῶν을 충실히 반영합니다.
  terminology: κύριος는 ‘주’로, νηστεία는 ‘금식’으로 유지했습니다. νεανίσκοι는 남성 청년을 가리킬 수 있으나 한국어 본문에서는 ‘젊은이들’이 무리 없이 포괄하며, 각주가 없는 한 성별을 지나치게 강조하지 않습니다.
