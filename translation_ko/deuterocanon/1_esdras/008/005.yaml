base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/005.yaml
  text: And some of the sons of Israel[a], and of the priests, Levites, temple singers, gatekeepers, and temple servants, went up to Jerusalem[b],
  footnotes:
  - marker: a
    text: Or 'some of the Israelites.' The Greek more literally says 'some of the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'temple slaves.' The Greek term can carry the sense of persons bound to sacred service.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이스라엘 자손들과 제사장들, 레위 사람들, 성전 노래하는 이들, 문지기들, 성전 종들이 예루살렘으로 올라갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’. 그리스어는 문자적으로 ‘이스라엘의 아들들’이라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘성전 노예들’. 그리스어 용어는 성전 봉사에 묶인 사람들을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν Ἰσραὴλ
  english_pob_choice: some of the sons of Israel
  chosen_korean: 이스라엘 자손들
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  - 이스라엘인들
  lexicon: LSJ
  rationale: 그리스어는 집합 전체가 아니라 그 집단 가운데 일부가 포함되었음을 보이지만, 한국어에서는 문맥상 ‘그리고 …들’의 목록으로 자연스럽게 풀어 주어 소속과 부분성을 함께 드러냈습니다.
- source_word: ἱεροψαλτῶν
  english_pob_choice: temple singers
  chosen_korean: 성전 노래하는 이들
  alternatives_korean:
  - 성전 가수들
  - 성가대원들
  - 성전 찬양자들
  lexicon: LSJ
  rationale: 단순한 ‘노래하는 사람들’이 아니라 성전 봉사에 속한 사람들임을 살리되, 현대 한국어에서 직역에 가까우면서도 이해하기 쉬운 표현으로 옮겼습니다.
- source_word: θυρωρῶν
  english_pob_choice: gatekeepers
  chosen_korean: 문지기들
  alternatives_korean:
  - 문을 지키는 이들
  - 문간지기들
  - 경비원들
  lexicon: LSJ
  rationale: 성전 문을 맡은 직무를 가장 직접적으로 드러내는 전통적 한국어 표현을 선택했습니다.
- source_word: ἱεροδούλων
  english_pob_choice: temple servants
  chosen_korean: 성전 종들
  alternatives_korean:
  - 성전 일꾼들
  - 성전 노예들
  - 성전 종사자들
  lexicon: LSJ
  rationale: 이 용어는 성전 봉사에 속한 종속적 신분까지 함의할 수 있으나, 명단의 직무 항목으로서는 ‘종들’이 봉사 소속을 드러내면서도 과도하게 제도적 신분을 단정하지 않습니다.
- source_word: εἰς Ἰερουσαλήμ
  english_pob_choice: to Jerusalem
  chosen_korean: 예루살렘으로
  alternatives_korean:
  - 예루살렘 안으로
  - 예루살렘에
  - 예루살렘으로 향하여
  lexicon: LSJ
  rationale: 도착 방향을 나타내는 목적격 전치사구를 한국어 이동 동사와 자연스럽게 결합해 옮겼습니다.
theological_decisions:
- issue: ἱεροδούλων의 신분 뉘앙스
  chosen_reading: 성전 종들
  alternative_readings:
  - 성전 노예들
  - 성전 종사자들
  rationale: 본문의 명단은 성전 관련 직무를 열거하므로, 본문에 드러난 제도적 기능을 우선 살리되 ‘노예들’로 과도하게 고정하지 않았습니다. 다만 용어 자체에 종속성의 뉘앙스가 있을 수 있어 lexical_decisions에 이를 명시했습니다.
