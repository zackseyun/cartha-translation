  lexicon: BDAG
  rationale: 부사격 ὑπό를 독립된 구절로 옮길 때, 여기서는 원천/매개를 드러내는 ‘…로부터’가 가장 자연스럽고, ‘…에 의해’보다 한국어로 덜 기계적입니다.
- source_word: τοῦ κυρίου
