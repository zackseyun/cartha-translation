translation:
  language: ko
  text: 우리 주로부터[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제공된 그리스어 원문은 ‘ὑπὸ τοῦ κυρίου ἡμῶν’(‘우리 주로부터/우리 주에 의해’)라는 구절 단편뿐입니다. 제공된 병행 히브리어 본문은 이 표현과 직접 대응하지 않으므로, 여기서는 완전한 문장을 복원하지 않았습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ὑπό
  english_pob_choice: from
  chosen_korean: …로부터
  alternatives_korean:
