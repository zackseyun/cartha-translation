  yaml_path: translation/deuterocanon/1_esdras/008/059.yaml
  text: Stay awake and guard them until you hand them over to the chiefs of the priests and the Levites and to the heads of the fathers’ houses of Israel in Jerusalem[b][a], in the chambers of the house of our Lord.
  footnotes:
  - marker: a
    text: Or 'Keep watch and guard them.' The opening pair of verbs emphasizes vigilant custody.
    reason: lexical_alternative
  - marker: b
    text: '''Chambers'' refers to rooms in the temple complex; the Hebrew parallel has ''rooms/chambers'' (lishkoth).'
    reason: cross_reference
translation:
  language: ko
  text: 깨어서 지키십시오.[a] 그것들을 예루살렘에 있는 우리 주의 집의 방들에서[b] 제사장들과 레위 사람들의 지도자들과 이스라엘 조상 가문들의 우두머리들에게 넘겨줄 때까지 지키십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “깨어 있으면서 지키십시오.” 두 동사는 함께 쓰여, 맡겨진 물품을 경계하며 보호하라는 뜻을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘방들’은 성전 건물 안의 방 또는 곁방들을 가리킵니다. 히브리어 병행문에도 lishkoth(방들/곁방들)가 나옵니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἀγρυπνεῖτε
  english_pob_choice: Stay awake
  chosen_korean: 깨어 있고
  alternatives_korean:
  - 깨어 있으십시오
  - 경계하십시오
  lexicon: BDAG
  rationale: 잠들지 않고 주의 깊게 지키는 뜻을 살려, 단순한 각성이 아니라 지속적인 경계 상태를 자연스럽게 표현했습니다.
- source_word: φυλάσσετε
  english_pob_choice: guard
  chosen_korean: 지키십시오
  alternatives_korean:
  - 보호하십시오
  - 경비하십시오
  lexicon: BDAG
  rationale: 성물의 인도 전까지 맡겨진 것을 안전하게 보존하는 의미이므로, 현대 한국어에서 가장 직접적인 명령형인 ‘지키십시오’를 택했습니다.
- source_word: φυλάρχοις ... ἡγουμένοις ... πατριῶν
  english_pob_choice: chiefs ... heads ... fathers’ houses
  chosen_korean: 제사장들과 레위 사람들의 지도자들과 이스라엘의 조상 가문의 우두머리들
  alternatives_korean:
  - 제사장들과 레위 사람들의 우두머리들과 이스라엘의 아버지 집들의 지도자들
  - 제사장들과 레위 사람들의 수장들과 이스라엘의 조상 집안의 대표자들
  lexicon: LSJ
  rationale: Greek의 이중 리더십 표현과 혈연-가문 구조를 살리기 위해, ‘지도자들’과 ‘우두머리들’, 그리고 ‘조상 가문’으로 구분해 옮겼습니다.
- source_word: παστοφορίοις
  english_pob_choice: chambers
  chosen_korean: 방들
  alternatives_korean:
  - 방
  - 곁방
  - 저장실
  lexicon: LSJ
  rationale: 본문이 성전 परिसर의 공간을 가리키고, 영어 POB도 주석으로 ‘chambers’임을 밝히므로, 한국어에서는 너무 기술적이지 않으면서도 복수 공간을 드러내는 ‘방들’로 옮겼습니다.
theological_decisions:
- issue: τοῦ οἴκου τοῦ κυρίου ἡμῶν의 번역
  chosen_reading: 우리 주의 집
  alternative_readings:
  - 우리 주의 성전
  - 주 우리 하나님의 집
  rationale: Greek 본문이 ‘우리 주’(τοῦ κυρίου ἡμῶν)라고 직접 말하므로 그 표현을 유지하고, 성전 문맥은 ‘집’으로 드러내어 원문과 문맥을 함께 보존했습니다.
  doctrine_reference: 원문 우선 번역 원칙; κύριος의 기본 대응은 ‘주’
