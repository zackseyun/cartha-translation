- source_word: εὐφυὴς
  english_pob_choice: skillful
  chosen_korean: 유능한
  alternatives_korean:
  - 능숙한
  - 준비된
  - 총명한
  - 숙련된
  lexicon: LSJ
  rationale: 단순 지능보다 실무적 적성과 역량을 가리키므로, 서기관의 직무 수행 능력을 드러내는 '유능한'이 적절합니다.
- source_word: τῷ Μωυσέως νόμῳ τῷ ἐκδεδομένῳ
  english_pob_choice: the law of Moses that had been given
  chosen_korean: 모세의 율법 안에서, 곧 … 주신 그 율법 안에서
  alternatives_korean:
  - 모세의 율법에서
  - 모세의 율법에 정통하여
  - 모세의 율법으로 주어진
  lexicon: BDAG; LSJ
  rationale: ἐν τῷ … νόμῳ는 단순 소속보다 그 영역 안에서의 전문성을 뜻하므로 '안에서'로 살렸고, ἐκδεδομένῳ의 수동 의미는 하나님께서 주신 율법이라는 표현으로 드러냈습니다.
- source_word: θεοῦ τοῦ Ἰσραήλ
  english_pob_choice: the God of Israel
  chosen_korean: 이스라엘의 하나님
  alternatives_korean:
