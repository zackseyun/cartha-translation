translation:
  language: ko
  text: 이 에스라는 바벨론에서 올라갔습니다. 그는 이스라엘의 하나님께서 주신 모세의 율법에 능숙한[a] 서기관이었습니다.
  philosophy: optimal-equivalence
  footnotes:
