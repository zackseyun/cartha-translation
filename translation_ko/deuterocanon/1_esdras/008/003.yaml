  source_fidelity: 초안은 핵심 의미를 대체로 보존하지만, ἀνέβη는 서술 기준상 ‘올라왔는데’보다 ‘올라갔습니다’가 정확합니다. 또한 ‘곧’은 그리스어에 없는 설명적 삽입이며, 수동 분사 ἐκδεδομένῳ는 모세의 율법을 직접 수식하도록 옮기는 편이 더 충실합니다.
