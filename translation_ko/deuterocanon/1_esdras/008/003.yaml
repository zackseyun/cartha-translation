  terminology: ‘에스라’, ‘바벨론’, ‘서기관’, ‘모세의 율법’, ‘이스라엘의 하나님’은 적절합니다. εὐφυής에는 직무상의 숙련을 나타내는 ‘능숙한’을 사용하고, 대안적 어휘 범위는 각주로 보존합니다.
