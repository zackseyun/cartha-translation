  lexicon: BDAG
  rationale: 바벨론에서 예루살렘/유대 지역으로 이동하는 성경적 관용 표현을 자연스럽게 살리면서도, 지리적 상승 뉘앙스를 보존했습니다.
- source_word: γραμματεὺς
