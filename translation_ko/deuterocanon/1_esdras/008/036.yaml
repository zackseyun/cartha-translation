  yaml_path: translation/deuterocanon/1_esdras/008/036.yaml
  text: 'From the sons of Bani: Salimoth son of Josaphias[a], and with him one hundred sixty men;'
  footnotes:
  - marker: a
    text: 'The Hebrew parallel at Ezra 8:8 differs substantially here, naming a different family line, leader, and number. Because 1 Esdras is translated from the Greek witness, the main text follows the Greek: ''Bani ... Salimoth son of Josaphias ... one hundred sixty men.'''
    reason: alternative_reading
translation:
  language: ko
  text: 바니의 아들들 가운데서 살리못 요사피아의 아들이 있었고, 그와 함께한 사람은 백육십 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리 병행본문(에스라 8:8)은 여기서 다른 가문명, 인물, 숫자를 제시합니다. 1 Esdras는 그리스어 증거를 따르므로 본문은 그리스어의 ‘바니 … 살리못 요사피아의 아들 … 백육십 명’을 따릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν Βανίας
  english_pob_choice: From the sons of Bani
  chosen_korean: 바니의 아들들 가운데서
  alternatives_korean:
  - 바니의 자손들 가운데서
  - 바니의 아들들로부터
  lexicon: LSJ
  rationale: γενеalogical 목록에서 υἱοί는 문자적 ‘아들들’이면서도 가문 구성원을 가리킬 수 있어, 직역성을 살리되 한국어 목록체에 맞게 ‘가운데서’로 자연스럽게 옮겼습니다.
- source_word: Σαλειμὼθ
  english_pob_choice: Salimoth
  chosen_korean: 살리못
  alternatives_korean:
  - 살림못
  - 살레못
  lexicon: LSJ
  rationale: 그리스어 형태를 따라 음역하되, 한국어 표기에서는 발음에 가장 가까운 ‘살리못’을 택했습니다.
- source_word: Ἰωσαφίου
  english_pob_choice: son of Josaphias
  chosen_korean: 요사피아의 아들
  alternatives_korean:
  - 요사피아스의 아들
  - 요사피우의
  lexicon: LSJ
  rationale: 속격 이름을 족보식 한국어로 풀어 ‘~의 아들’로 분명하게 표현했습니다.
- source_word: ἄνδρες ἑκατὸν ἑξήκοντα
  english_pob_choice: one hundred sixty men
  chosen_korean: 백육십 명
  alternatives_korean:
  - 160명
  - 백육십 남자
  lexicon: LSJ
  rationale: ἄνδρες는 여기서 성인 남성을 뜻하므로 단순 ‘명’보다 ‘남자’가 더 정확하지만, 한국어 목록 문맥에서는 수량만을 강조하는 ‘백육십 명’이 자연스러워 과도한 중복을 피했습니다.
theological_decisions:
- issue: 1 Esdras의 그리스어 본문을 따를 때 에스라서 히브리 병행본문과 이름/수효가 다릅니다.
  chosen_reading: 본문은 그리스어 증거를 따라 바니, 살리못, 요사피아, 백육십 명으로 옮겼습니다.
  alternative_readings:
  - 에스라 8:8의 히브리 평행본문을 따라 다른 가문명·이름·숫자를 반영하는 번역
  - 주석 없이 본문을 히브리 병행본문에 맞추는 번역
  rationale: 이 단락은 1 Esdras의 그리스어 목록 자체를 번역하는 것이므로, 병행 히브리 본문과의 차이는 본문이 아니라 주석 수준에서 처리하는 것이 स्रोत 충실성에 맞습니다.
  doctrine_reference: 본문 비평 / 정경 간 병행본문 처리
