translation:
  language: ko
  text: 바니의 자손 가운데서는 요사피아스의 아들 살리못과 그와 함께한 남자 백육십 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 병행본문인 에스라 8:8은 이곳에서 다른 가문, 지도자, 수를 제시합니다. 제1에스드라는 그리스어 본문을 번역하므로, 본문은 그리스어의 ‘바니 … 요사피아스의 아들 살리못 … 남자 백육십 명’을 따릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν Βανίας
  english_pob_choice: From the sons of Bani
  chosen_korean: 바니의 아들들 가운데서
  alternatives_korean:
