  - severity: low
    issue: ἐπὶ τὸ θυσιαστήριον의 번역
    rationale: ‘제단에’도 넓게는 가능하지만, ἐπί와 대격의 ‘제단 위에/제단으로’라는 관계를 ‘제단 위에’가 더 충실히 나타냅니다.
