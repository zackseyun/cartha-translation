review_pass:
  verdict: revise
  source_fidelity: 그리스어의 ‘그들의 주’와 예루살렘에 있는 특정 제단이라는 한정은 반영했습니다. 그러나 προσενεγκεῖν은 주어를 사역하는 뜻이 아닌 부정사이므로 ‘제물을 바치게 하려는’은 근거 없이 사역성을 더합니다. 또한 ἐπὶ τὸ θυσιαστήριον의 방향·위치 관계는 ‘제단 위에’가 더 직접적입니다.
  naturalness: ‘그들의 주의 제단’은 성서적 격식 문체에서 가능하며, 문장 전체는 ‘…하기 위한 것이었습니다’로 목적을 자연스럽게 나타낼 수 있습니다. ‘제단 위에 제물을 바치다’는 현대 표준어의 격식 있는 종교 문맥에도 자연스럽습니다.
  terminology: κύριος는 그리스어 본문을 따라 ‘주’로, θυσίας는 제단 문맥에 적합하게 ‘제물’로 유지합니다. 히브리어 평행본문의 ‘하나님의 집’은 본문에 도입하지 않고 각주에서만 밝혀야 합니다.
