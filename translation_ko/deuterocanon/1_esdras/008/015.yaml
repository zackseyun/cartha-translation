translation:
  language: ko
  text: 그들의 주의 제단, 곧 예루살렘에 있는 제단 위에 제물을 바치기 위한 것이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 평행본문은 인접 문맥에서 ‘예루살렘에 있는 그들의 하나님의 집’이라고 하여 예배 대상이 이스라엘의 하나님임을 뒷받침합니다. 그러나 여기의 그리스어 본문은 분명히 ‘그들의 주의 제단, 곧 예루살렘에 있는 제단’이라고 말합니다.
    reason: cross_reference
lexical_decisions:
- source_word: ὥστε
  english_pob_choice: so as to
  chosen_korean: …하려는 것이었습니다
  alternatives_korean:
  - …하도록
  - …하게 하여
  - …하기 위하여
  lexicon: BDAG
  rationale: 문맥상 목적을 나타내므로 ‘…하려는’으로 옮겨 의도성을 분명히 했습니다.
- source_word: προσενεγκεῖν
  english_pob_choice: to bring
  chosen_korean: 제물을 바치게 하다
  alternatives_korean:
  - 제물을 가져오게 하다
  - 제물을 드리게 하다
  - 제물을 바치다
  lexicon: BDAG
  rationale: 제사적 ‘제시/봉헌’의 뜻을 한국어에서 가장 자연스럽게 드러내는 표현으로 ‘바치다’를 택했습니다.
- source_word: θυσίας
  english_pob_choice: sacrifices
  chosen_korean: 제물
  alternatives_korean:
  - 희생제물
  - 희생
  - 제사
  lexicon: BDAG
  rationale: 제단 앞의 희생 제의를 가리키는 말이므로 일반적이고 직접적인 ‘제물’로 옮겼습니다.
- source_word: τοῦ κυρίου αὐτῶν
  english_pob_choice: of their Lord
  chosen_korean: 그들의 주
  alternatives_korean:
  - 그들의 주님
  - 그들의 하나님
  - 그들의 주 하나님
  lexicon: BDAG
  rationale: 본문의 κύριος를 프로젝트 기본값에 따라 ‘주’로 유지했고, 소유격 ‘their’는 ‘그들의’로 반영했습니다.
- source_word: τὸ ἐν Ἰερουσαλήμ
  english_pob_choice: the one in Jerusalem
  chosen_korean: 예루살렘에 있는 제단
  alternatives_korean:
  - 예루살렘에 있는 그 제단
  - 예루살렘에 있는 것
  - 예루살렘의 것
  lexicon: BDAG
  rationale: 관사+전치사구는 특정 제단을 한정하므로 자연스러운 한국어로 대상 명사를 보충해 ‘예루살렘에 있는 제단’으로 풀었습니다.
theological_decisions:
- issue: Greek 본문이 ‘그들의 주’라고 하고, 히브리어 평행본문은 ‘그들의 하나님’으로 확장되는 불일치
  chosen_reading: 본문에는 ‘그들의 주’를 유지하되, 대상이 예루살렘의 제단임을 명시했습니다.
  alternative_readings:
  - 그들의 하나님
  - 그들의 주 하나님
  rationale: 번역의 1차 기준은 그리스어 본문이므로 평행본문의 신학적 명시를 본문에 끌어오지 않았습니다. 다만 한국어로는 제단 문맥이 이미 예배 대상을 충분히 시사합니다.
  doctrine_reference: 원문 우선 원칙; 평행본문은 보조 증거로만 사용
