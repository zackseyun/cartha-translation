base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/054.yaml
  text: And again we prayed to our Lord about all these things[b][a], and we found him favorable.
  footnotes:
  - marker: a
    text: The Greek source here says, 'And again we prayed to our Lord about all these things, and we found him favorable.' The supplied Hebrew/MT parallel listed for this verse does not match this wording and appears to reflect a different context; the translation therefore follows the Greek as the primary witness.
    reason: textual_variant
  - marker: b
    text: Or 'gracious' for 'favorable.' The Greek adjective can denote a kindly or propitious disposition.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 다시 우리는 이 모든 일에 대해 우리 주께 기도하였고, 그분이 호의적이심을 얻었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 “그리고 다시 우리는 우리 주께 이 모든 일에 대해 기도하였고, 그분이 호의적이심을 얻었습니다”라고 말합니다. 여기에 제시된 히브리어/MT 병행은 이 구절의 문구와 일치하지 않으므로, 번역은 그리스어를 주된 증언으로 따릅니다.
    reason: textual_variant
  - marker: b
    text: ‘호의적이심’은 ‘은혜로우심’ 또는 ‘자비로우심’으로도 옮길 수 있습니다. 다만 그리스어 형용사는 친절한/호의적인 태도를 뜻하므로, 보다 직접적인 의미를 살렸습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  english_pob_choice: again
  chosen_korean: 다시
  alternatives_korean:
  - 또
  - 한번 더
  lexicon: LSJ
  rationale: 반복을 나타내는 부사로, 현대 한국어에서 가장 자연스럽고 간결한 대응은 ‘다시’입니다.
- source_word: ἐδεήθημεν
  english_pob_choice: we prayed
  chosen_korean: 우리는 기도하였고
  alternatives_korean:
  - 우리는 간청하였고
  - 우리는 애원하였고
  - 우리는 간구하였고
  lexicon: BDAG
  rationale: δέομαι는 간절한 청원을 뜻하므로 ‘기도하다’로 옮기되, 서술 흐름상 ‘~하였고’로 연결해 청원의 의미를 살렸습니다.
- source_word: τοῦ κυρίου ἡμῶν
  english_pob_choice: to our Lord
  chosen_korean: 우리 주께
  alternatives_korean:
  - 우리 주님께
  - 우리 주에게
  lexicon: BDAG
  rationale: 기도의 대상인 κύριος는 프로젝트 기본어인 ‘주’로 옮기고, 여격적 대상은 ‘~께’로 처리했습니다.
- source_word: εὐιλάτου
  english_pob_choice: favorable
  chosen_korean: 호의적이심을
  alternatives_korean:
  - 은혜로우심을
  - 관대하심을
  - 좋게 여기심을
  lexicon: LSJ
  rationale: 형용사는 ‘호의적/호의가 있는’의 뜻이므로, ‘그분이 호의적이심’으로 인격적 태도를 살렸습니다.
theological_decisions:
- issue: εὐιλάτου의 신학적 뉘앙스
  chosen_reading: ‘호의적이심’으로 번역하여 하나님의 마음이 그들에게 유리하게 기울어진 결과를 드러냈습니다.
  alternative_readings:
  - ‘은혜로우심’으로 번역
  - ‘자비로우심’으로 번역
  rationale: 문맥상 ‘자비’나 ‘은혜’보다 ‘호의’가 그리스어 형용사의 직접 의미에 더 가깝고, 응답의 결과를 과도하게 신학화하지 않습니다.
  doctrine_reference: LSJ εὐίλατος; 원문 의미 보존 원칙
- issue: MT 병행문의 불일치 처리
  chosen_reading: 그리스어 본문을 본문으로 따르고, 히브리어/MT 병행의 불일치는 본문 밖에서 처리합니다.
  alternative_readings:
  - MT 병행에 맞추어 제사장 선발 내용으로 조정
  - 병행 차이를 본문에 반영하지 않음
  rationale: 주어진 자료가 그리스어를 주된 번역 앵커로 명시하므로, 본문은 그리스어를 따르고 차이는 투명하게 관리해야 합니다.
  doctrine_reference: 원문 우선 원칙 / 텍스트 비평 투명성
