base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/080.yaml
  text: saying that the land into which you are entering to inherit is a land defiled by the defilement of the foreigners of the land[b][a], and they have filled it with their uncleanness.
  footnotes:
  - marker: a
    text: Or, following the Hebrew-parallel idiom, 'the peoples of the land.' The Greek more specifically says 'the foreigners of the land.'
    reason: alternative_reading
  - marker: b
    text: '''Uncleanness'' can carry both ritual and moral force here; the wording does not require choosing only one sense.'
    reason: lexical_alternative
translation:
  language: ko
  text: 말하기를, 「너희가 차지하려고 들어가는 땅은 그 땅의 이방인들의 더러움으로 더럽혀진 땅이며, 그들이 자기들의 부정함으로 그것을 가득 채웠다」 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 히브리어 평행 표현을 따르면 ‘그 땅의 백성들’입니다. 그리스어는 더 구체적으로 ‘그 땅의 이방인들’이라고 말합니다.
    reason: alternative_reading
  - marker: b
    text: ‘부정함’은 여기서 의례적 불결함과 도덕적 오염을 함께 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ γῆ
  english_pob_choice: the land
  chosen_korean: 땅
  alternatives_korean:
  - 그 땅
  - 나라
  lexicon: LSJ
  rationale: 상속과 정복의 문맥에서 지구 전체가 아니라 특정한 약속의 땅을 가리키므로 ‘땅’으로 자연스럽게 옮겼습니다.
- source_word: μεμολυσμένη μολυσμῷ
  english_pob_choice: defiled by the defilement
  chosen_korean: 더러움으로 더럽혀진
  alternatives_korean:
  - 부정으로 부정하게 된
  - 오염으로 오염된
  lexicon: LSJ
  rationale: 반복된 어근의 강조를 한국어에서도 살리기 위해 ‘더러움/더럽혀진’의 중첩 표현을 택해, 의례적·윤리적 오염의 긴장을 유지했습니다.
- source_word: τῶν ἀλλογενῶν τῆς γῆς
  english_pob_choice: of the foreigners of the land
  chosen_korean: 그 땅의 이방인들의
  alternatives_korean:
  - 그 땅의 백성들의
  - 그 땅의 타민족들의
  lexicon: LSJ
  rationale: 그리스어 ἀλλογενῶν의 핵심인 ‘다른 종족/외부인’의 의미를 분명히 드러내기 위해 ‘이방인들’을 선택했습니다.
- source_word: τῆς ἀκαθαρσίας αὐτῶν
  english_pob_choice: their uncleanness
  chosen_korean: 자기들의 부정함
  alternatives_korean:
  - 그들의 더러움
  - 그들의 불결함
  lexicon: BDAG
  rationale: ἀκαθαρσία가 예식적 불결함과 도덕적 부정함을 함께 가질 수 있어, 한국어에서도 그 긴장을 보존하는 넓은 표현을 사용했습니다.
theological_decisions:
- issue: ἀλλογενῶν을 ‘땅의 백성’으로 순화할지 여부
  chosen_reading: 원문과 평행 히브리어 전통의 차이를 인정하되, 본문 자체의 ‘이방인들’이라는 외부성 표시를 그대로 드러냈습니다.
  alternative_readings:
  - 그 땅의 백성들
  - 그 땅의 사람들
  rationale: 1 에스드라는 그리스어 본문이 우선이므로, 히브리어 평행구의 관용보다 원문의 직접적 표지를 우선해야 합니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 1
- issue: μολυσμός/ἀκαθαρσία를 의례적 부정함으로만 좁힐지 여부
  chosen_reading: 의례적 불결함과 도덕적 더러움의 두 가능성을 모두 열어 두는 번역을 택했습니다.
  alternative_readings:
  - 예식적으로 더럽혀진 땅
  - 도덕적으로 타락한 땅
  rationale: 원문은 한쪽으로만 제한하지 않으므로, 한국어도 지나치게 신학적으로 단정하지 않고 넓은 의미를 유지해야 합니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 3
