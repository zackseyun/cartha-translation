- from: 말하기를, 「너희가 차지하려고 들어가는 땅은 그 땅의 이방인들의 더러움으로 더럽혀진 땅이며, 그들이 자기들의 부정함으로 그것을 가득 채웠다」 하였습니다.[a][b]
