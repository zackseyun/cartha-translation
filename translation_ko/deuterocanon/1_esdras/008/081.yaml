translation:
  language: ko
  text: 그리고 이제 너희 딸들을 그들의 아들들에게 시집보내지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 직역하면, ‘너희 딸들을 그들의 아들들과 혼인시키지 마십시오’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  english_pob_choice: And now
  chosen_korean: 그리고 이제
  alternatives_korean:
  - 이제
  - 그리고 지금
  - 이제 그러므로
  lexicon: LSJ
  rationale: 연결사와 시간 전환을 함께 살리기 위해 ‘그리고 이제’로 옮겼습니다. ‘그러므로’는 원문에 없는 추론을 강하게 만들 수 있습니다.
- source_word: τὰς θυγατέρας ὑμῶν
  english_pob_choice: your daughters
  chosen_korean: 너희 딸들을
  alternatives_korean:
  - 너희의 딸들을
  - 딸들을
  lexicon: LSJ
  rationale: 복수 소유격을 자연스러운 현대 한국어로 옮기되, 공동체를 향한 직접 호소를 분명히 하기 위해 ‘너희’로 처리했습니다.
- source_word: μὴ συνοικίσητε
  english_pob_choice: do not give in marriage
  chosen_korean: 시집보내지 마십시오
  alternatives_korean:
  - 혼인시키지 마십시오
  - 결혼시키지 마십시오
  - 함께 살게 하지 마십시오
  lexicon: LSJ
  rationale: 이 동사는 부부로서 함께 살게 하다/결혼시키다의 의미를 지니므로, 문맥상 부모·공동체가 딸을 상대의 아들에게 넘겨 혼인시키는 뜻을 한국어 관용으로 가장 직접적으로 드러내는 ‘시집보내다’를 택했습니다.
- source_word: τοῖς υἱοῖς αὐτῶν
  english_pob_choice: to their sons
  chosen_korean: 그들의 아들들에게
  alternatives_korean:
  - 그들의 아들들과
  - 그들 아들들에게
  lexicon: LSJ
  rationale: 여격의 방향성을 보존해 ‘-에게’로 옮겼고, 소유 대명사 ‘그들의’를 유지해 문맥상 바깥 민족의 아들들을 가리키는 점이 드러나게 했습니다.
theological_decisions:
- issue: 혼인 금지의 표현 방식
  chosen_reading: ‘시집보내지 마십시오’로 공동체적 혼인 금지를 직접 표현했습니다.
  alternative_readings:
  - ‘결혼시키지 마십시오’
  - ‘혼인시키지 마십시오’
  - ‘그들의 아들들과 결혼하지 않게 하십시오’
  rationale: 원문은 단순한 동거가 아니라 혼인 결합을 금지하는 문맥이므로, 한국어에서 가장 자연스럽고 강한 사회적·가족적 함의를 지닌 표현을 선택했습니다. 이는 본문의 금지 의도를 약화하지 않습니다.
  doctrine_reference: Translation philosophy §§1, 4, 6
