base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/073.yaml
  text: From the times of our fathers[b][a], we have been in great sin until this day.
  footnotes:
  - marker: a
    text: Or, 'of our ancestors.' The Greek reads 'of our fathers,' preserving the masculine ancestral idiom.
    reason: lexical_alternative
  - marker: b
    text: Or, 'we are in great sin.' The Greek present tense can be rendered more literally this way, but the English perfect better conveys the continuing state from past time until now.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리 조상들의 시대부터 오늘까지 우리는 큰 죄 가운데 있어 왔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘우리 아버지들의 시대부터’입니다. 한국어 본문은 이를 선조 전체를 가리키는 자연스러운 표현으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 현재형 ἐσμεν은 ‘우리는 있다’라는 뜻이지만, 여기서는 과거부터 오늘까지 이어지는 상태를 나타냅니다. 그래서 한국어에서는 그 지속을 드러내어 ‘있어 왔습니다’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τῶν χρόνων
  english_pob_choice: From the times
  chosen_korean: ~의 시대부터
  alternatives_korean:
  - ~의 때로부터
  - ~의 시절부터
  lexicon: BDAG
  rationale: ἀπό + 속격은 시작점을 나타내므로 ‘~부터’로 옮기고, χρόνοι는 단순한 연대보다 시간의 구간을 가리키므로 ‘시대’가 자연스럽습니다.
- source_word: τῶν πατέρων ἡμῶν
  english_pob_choice: of our fathers
  chosen_korean: 우리 조상들의
  alternatives_korean:
  - 우리 아버지들의
  - 우리 선조들의
  lexicon: BDAG
  rationale: 직역하면 ‘우리의 아버지들’이지만, 한국어에서는 집단적 선조를 가리키는 관용으로 ‘조상들’이 가장 자연스럽고 의미를 유지합니다.
- source_word: ἐσμεν ἐν μεγάλῃ ἁμαρτίᾳ
  english_pob_choice: we have been in great sin
  chosen_korean: 우리는 큰 죄 가운데 있었습니다
  alternatives_korean:
  - 우리는 큰 죄 안에 있었습니다
  - 우리는 큰 죄를 지니고 있었습니다
  lexicon: BDAG
  rationale: ἐσμεν의 현재형은 시작부터 현재까지 이어지는 상태를 나타내므로 과거-현재 지속을 드러내는 ‘있었습니다’가 POB 영어의 의도를 잘 반영합니다.
- source_word: ἕως τῆς ἡμέρας ταύτης
  english_pob_choice: until this day
  chosen_korean: 오늘까지
  alternatives_korean:
  - 이 날까지
  - 지금까지
  lexicon: BDAG
  rationale: 현재 시점까지의 지속을 간결하게 드러내는 한국어로 ‘오늘까지’가 가장 자연스럽습니다.
theological_decisions:
- issue: ‘fathers’의 성별 표지 보존
  chosen_reading: 우리 조상들의
  alternative_readings:
  - 우리 아버지들의
  - 우리 선조들의
  rationale: 원문 πατέρων은 문자적으로는 남성 복수이지만, 한국어에서는 혈통적-역사적 선대 전체를 가리키는 표현으로 ‘조상들’이 의미를 흐리지 않으면서도 자연스럽습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy, point 4
- issue: 죄와 죄책의 구분
  chosen_reading: 큰 죄 가운데
  alternative_readings:
  - 큰 죄책 가운데
  - 큰 죄악 가운데
  rationale: ἁμαρτία는 여기서 ‘죄’가 기본 의미이며, 본문이 별도의 법정적 죄책 개념을 요구하지 않으므로 성경적 범주를 직접 유지했습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy, point 1
