base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/056.yaml
  text: And with them[a], from among their brothers, ten men. And I weighed out to them the silver and the gold and the holy vessels of the house of our Lord[b], which the king and his counselors and the nobles and all Israel had given as a gift.
  footnotes:
  - marker: a
    text: 'Greek: ''I set/placed before them''; the Hebrew parallel reads ''I weighed out to them,'' which fits the context of silver, gold, and vessels being entrusted.'
    reason: textual_variant
  - marker: b
    text: Or 'ten of their brothers.' The Greek literally says 'from their brothers, ten men.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들과 함께 그들의 형제들 가운데서 열 사람도 있었습니다. 나는 은과 금과 우리 주의 집의 거룩한 기물들을 그들에게 맡겼습니다. 곧 왕과 그의 조언자들과 귀족들과 온 이스라엘이 예물로 드린 것들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘그들 형제들로부터 열 사람’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘맡겼습니다’는 이 절의 그리스어 ἔστησα와 병행 히브리어의 ‘달아 주었다/재어 주었다’ 사이의 의미를 반영한 번역입니다.
    reason: textual_variant
lexical_decisions:
- source_word: μετʼ αὐτῶν ἐκ τῶν ἀδελφῶν αὐτῶν ἄνδρας δέκα
  english_pob_choice: And with them, from among their brothers, ten men
  chosen_korean: 그들과 함께 그들의 형제들 가운데서 열 사람도 있었습니다
  alternatives_korean:
  - 그들과 함께 그들의 형제들 중 열 사람이 있었습니다
  - 그들과 함께 형제들 가운데서 열 사람이 있었습니다
  lexicon: LSJ
  rationale: 그리스어의 어순이 다소 압축적이어서, ‘from among their brothers’의 관계를 살리면서도 한국어에서는 자연스럽게 풀어 옮겼습니다. ‘남자들’은 문맥상 ‘사람들/열 사람’으로 충분히 드러납니다.
- source_word: ἔστησα αὐτοῖς
  english_pob_choice: I weighed out to them
  chosen_korean: 나는 ... 그들에게 맡겼습니다
  alternatives_korean:
  - 나는 ... 그들 앞에 놓았습니다
  - 나는 ... 그들에게 내주었습니다
  lexicon: LSJ
  rationale: 본문 그리스어는 직역하면 ‘세웠다/놓았다’이지만, 이 절의 은·금·성물 문맥과 병행 전승의 ‘달아 주었다/재어 주었다’는 뜻을 반영해 위탁의 의미로 옮겼습니다. 한국어에서는 금전·성물의 공식적 인계를 ‘맡기다’가 가장 자연스럽습니다.
- source_word: τὸ ἀργύριον καὶ τὸ χρυσίον καὶ τὰ ἱερὰ σκεύη
  english_pob_choice: the silver and the gold and the holy vessels
  chosen_korean: 은과 금과 ... 거룩한 기물들
  alternatives_korean:
  - 은과 금과 ... 성스러운 그릇들
  - 은과 금과 ... 성물들
  lexicon: LSJ
  rationale: ‘기물’은 제사용/성전용 용기를 포괄할 수 있어 ἱερὰ σκεύη의 기능을 살립니다. ‘거룩한’은 cultic force를 유지하면서도 현대 한국어에서 자연스럽습니다.
- source_word: τοῦ οἴκου τοῦ κυρίου ἡμῶν
  english_pob_choice: of the house of our Lord
  chosen_korean: 우리 주의 집
  alternatives_korean:
  - 우리 주님의 집
  - 우리 주 하나님의 집
  lexicon: LSJ
  rationale: κύριος를 여기서는 POB 기본값대로 ‘주’로 두어 ‘우리 주’로 옮겼습니다. ‘집’은 성전/성소를 가리키는 표준적 표현으로 유지했습니다.
- source_word: οὕτως ἐδωρήσατο ὁ βασιλεὺς ... καὶ πᾶς Ἰσραήλ
  english_pob_choice: which the king and his counselors and the nobles and all Israel had given as a gift
  chosen_korean: 곧 왕과 그의 조언자들과 귀족들과 온 이스라엘이 예물로 드린 것들입니다
  alternatives_korean:
  - 곧 왕과 그의 조언자들과 귀족들과 온 이스라엘이 선물로 준 것들입니다
  - 곧 왕과 그의 조언자들과 귀족들과 온 이스라엘이 바친 것들입니다
  lexicon: LSJ
  rationale: ἐδωρήσατο의 ‘선물로 주다’는 뜻을 한국어에서는 성전 맥락에 맞게 ‘예물로 드리다’로 풀었습니다. ‘조언자들’과 ‘귀족들’은 신분적 뉘앙스를 과도하게 약화하지 않도록 직역 계열을 유지했습니다.
theological_decisions:
- issue: 1 Esdras의 그리스어 본문과 히브리어 평행본문의 차이(ἔστησα vs. ‘달아 주었다’)
  chosen_reading: 본문에는 ‘맡겼습니다’로 옮기되, 인계/위탁의 행위를 드러내는 방향을 택했습니다.
  alternative_readings:
  - 직역하여 ‘세웠습니다’
  - 평행본문을 따라 ‘달아 주었습니다’
  rationale: 이 절은 성물과 재물의 공식적 인계를 말하므로, 문맥상 기능을 드러내는 번역이 필요합니다. 그리스어의 표면형과 평행본문 사이의 긴장은 유지하되, 한국어 본문은 독자가 즉시 이해할 수 있는 위탁 의미를 전달합니다.
  doctrine_reference: POB source-grounded translation principle for deuterocanonical parallel-text tensions
- issue: κύριος ἡμῶν의 처리
  chosen_reading: ‘우리 주’
  alternative_readings:
  - ‘우리 주님’
  - ‘주님’
  rationale: 이 절은 YHWH를 직접 번역하는 맥락이 아니라 그리스어 κύριος를 따른 표현이므로, POB 기본어휘를 유지해 ‘우리 주’로 옮겼습니다.
  doctrine_reference: 'POB glossary: κύριος → 주/주님'
