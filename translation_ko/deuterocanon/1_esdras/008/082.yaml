base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/082.yaml
  text: and do not take their daughters for your sons[a], and do not seek peace with them all your days, so that, having become strong, you may eat the good things of the land and inherit it
  footnotes:
  - marker: a
    text: Or, more fully in light of the Hebrew parallel, 'do not seek their peace or prosperity forever.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들의 딸들을 여러분의 아들들의 아내로 맞이하지 말고, 언제나 그들과 평화롭게 지내려고[a] 하지도 마십시오. 그리하여 여러분이 강해져 땅의 좋은 것들을 먹고 그 땅을 상속받게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 히브리어 평행 본문에 비추어, ‘그들의 평안이나 번영을 구하려고’.
    reason: 그리스어의 압축된 ‘그들과 평화롭게 지내다’라는 표현에 대해, 히브리어 평행 본문이 시사하는 더 넓은 의미를 제시합니다.
lexical_decisions:
- source_word: τὰς θυγατέρας αὐτῶν μὴ λάβητε τοῖς υἱοῖς ὑμῶν
  english_pob_choice: do not take their daughters for your sons
  chosen_korean: 그들의 딸들을 너희 아들들을 위해 데려오지 말며
  alternatives_korean:
  - 너희 아들들에게 장가들지 말며
  - 그들의 딸들을 너희 아들들에게 시집보내지 말며
  lexicon: BDAG; LXX usage
  rationale: λάβητε는 직역상 ‘데려가다/취하다’이므로, 결혼 맥락을 드러내되 과도하게 설명하지 않는 ‘데려오다’를 택했습니다.
- source_word: μὴ ζητήσετε εἰρηνεῦσαι τὰ πρὸς αὐτοὺς
  english_pob_choice: do not seek peace with them
  chosen_korean: 그들과 평화를 구하지 말고
  alternatives_korean:
  - 그들과 화평을 도모하지 말고
  - 그들의 평안과 번영을 구하지 말고
  lexicon: BDAG
  rationale: εἰρηνεῦσαι τὰ πρὸς αὐτούς의 압축된 관용구를 한국어로 간명하게 옮기면서, 평화 추구 자체를 금하는 뜻을 살렸습니다.
- source_word: τὸν ἅπαντα χρόνον
  english_pob_choice: for all time
  chosen_korean: 모든 날 동안
  alternatives_korean:
  - 영원히
  - 항상
  lexicon: BDAG
  rationale: 문맥상 지속적 금지를 나타내는 표현이므로, ‘모든 날 동안’으로 기간의 전면성을 자연스럽게 살렸습니다.
- source_word: ἵνα ἰσχύσαντες φάγητε τὰ ἀγαθὰ τῆς γῆς καὶ κατακληρονομήσητε
  english_pob_choice: so that, having become strong, you may eat the good things of the land and inherit it
  chosen_korean: 그렇게 하여 강해진 뒤에는 땅의 좋은 것들을 먹고 그것을 상속받게 되실 것입니다.
  alternatives_korean:
  - 그리하여 강해져서 땅의 좋은 것들을 먹고 그것을 차지하게 되실 것입니다.
  - 강해진 뒤에 땅의 좋은 것들을 누리고 그것을 유업으로 받게 되실 것입니다.
  lexicon: BDAG
  rationale: ἰσχύσαντες는 ‘강해지다/세력을 얻다’의 완료적 뉘앙스를 살려 ‘강해진 뒤에’로 옮겼고, κατακληρονομήσητε는 상속 언어를 유지해 ‘상속받다’로 처리했습니다.
theological_decisions:
- issue: 히브리어 평행본문이 보태는 ‘평화/번영’의 더 넓은 뉘앙스 처리
  chosen_reading: 본문은 그리스어를 직접 따르되, ‘평화를 구하지 말고’로 번역해 평화 추구 금지의 핵심을 살리고 히브리어 평행본문의 확장 의미는 주석 여지로 남깁니다.
  alternative_readings:
  - ‘그들의 평안이나 번영을 구하지 말고’로 확장 번역
  - 그리스어 표면형만 따라 단순히 ‘평화를 구하지 말고’로만 처리
  rationale: 1 Esdras는 그리스어를 우선하되, 제공된 히브리어 평행본문이 관용구의 의미를 보강하므로 본문은 간결하게 유지하고 의미는 과도하게 축소하지 않도록 했습니다.
  doctrine_reference: 1 Esdras 평행본문 원칙; 의미 보존 우선
