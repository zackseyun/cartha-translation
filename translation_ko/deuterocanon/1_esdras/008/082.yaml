revisions:
- from: 그리고 그들의 딸들을 너희 아들들을 위해 데려오지 말며[a], 또 그들과 평화를 구하지 말고, 그들과 더불어 모든 날 동안 그렇게 하지 마십시오. 그렇게 하여 강해진 뒤에는 땅의 좋은 것들을 먹고 그것을 상속받게 되실 것입니다.
  to: 그들의 딸들을 여러분의 아들들의 아내로 맞이하지 말고, 언제나 그들과 평화롭게 지내려고[a] 하지도 마십시오. 그리하여 여러분이 강해져 땅의 좋은 것들을 먹고 그 땅을 상속받게 될 것입니다.
  rationale: 그리스어의 직접 목적어와 결혼 문맥을 자연스러운 한국어로 살리고, ‘언제나’가 평화 관계를 추구하지 말라는 금령 전체를 수식하도록 재구성했습니다. 목적절의 흐름과 상속 어휘를 보존했으며, 평행본문에서 비롯되는 ‘평안/번영’의 확장 해석은 본문이 아니라 올바른 위치의 각주로 처리했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:09:43Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안은 결혼 금지와 땅의 좋은 것을 먹고 상속받는다는 내용을 대체로 보존하지만, τὸν ἅπαντα χρόνον을 별도의 ‘그렇게 하지 마십시오’로 처리하여 그리스어에서 ‘그들과 평화롭게 지내려 하지 말라’에 걸리는 수식 관계를 흐렸습니다. 또한 ἵνα 이하의 목적 관계는 유지하되, 2인칭 복수에 대한 높임말 혼용을 바로잡아야 합니다.
  naturalness: ‘너희’와 ‘되실 것입니다’의 조합은 현대 표준어 합쇼체에서 부자연스럽습니다. ‘여러분’과 비높임 미래 표현을 일관되게 사용하고, ‘모든 날 동안 그렇게 하지 마십시오’ 대신 ‘언제나 … 하려 하지도 마십시오’로 옮기면 자연스럽고 원문의 결속도 살아납니다.
  terminology: 결혼 문맥의 λάβητε는 ‘딸들을 너희 아들들의 아내로 맞이하다’가 자연스럽고 의미상 정확합니다. κατακληρονομήσητε의 상속 어휘는 ‘그 땅을 상속받다’로 보존했습니다. 평화/번영의 확장 의미는 본문에 삽입하지 않고 해당 구절 뒤의 각주로 남겼습니다.
  issues:
  - severity: high
    issue: ‘그들과 평화를 구하지 말고, 그들과 더불어 모든 날 동안 그렇게 하지 마십시오’는 기간 수식어를 별도 금령처럼 분리합니다.
    rationale: τὸν ἅπαντα χρόνον은 μὴ ζητήσετε εἰρηνεῦσαι τὰ πρὸς αὐτούς에 결부됩니다. ‘언제나 그들과 평화롭게 지내려고 하지도 마십시오’처럼 한 문장 안에서 표현해야 합니다.
  - severity: high
    issue: 각주 표지가 ‘딸들’ 뒤에 있으나 각주 내용은 평화/번영이라는 다음 구절의 대안적 이해에 관한 것입니다.
    rationale: 각주 앵커는 해당 표현인 ‘그들과 평화롭게 지내려고’ 뒤로 옮겨야 합니다.
  - severity: medium
    issue: ‘너희’와 존대 미래형 ‘되실 것입니다’가 혼용됩니다.
    rationale: 수신자 복수에 대한 현대 합쇼체에서는 ‘여러분’ 및 ‘될 것입니다’처럼 일관된 표현이 적절합니다.
  - severity: low
    issue: ‘그것’을 상속받는다는 표현은 선행사인 땅을 다소 불명확하게 합니다.
    rationale: 원문의 함축된 목적어는 ‘땅’이므로 ‘그 땅을 상속받다’로 명시하면 한국어 문맥이 선명해지며 의미 변화가 없습니다.
