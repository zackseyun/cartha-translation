translation:
  language: ko
  text: 주님, 저는 부끄럽고 주님의 얼굴 앞에서 수치를 당합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘주님의 얼굴 앞에서’입니다. 그리스어는 하나님 앞에 직접 서 있는 수치의 이미지를 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주여
  - 오 주님
  lexicon: BDAG
  rationale: 그리스어 호격 κύριε는 하나님께 드리는 직접 호칭이므로, 현대 합쇼체 기도문에 자연스러운 ‘주님’으로 옮겨 직접 부름의 무게를 살렸습니다.
- source_word: ᾔσχυμμαι
  english_pob_choice: I am ashamed
  chosen_korean: 부끄럽습니다
  alternatives_korean:
  - 수치를 당합니다
  - 부끄러움을 느낍니다
  lexicon: LSJ
  rationale: 완료형이 드러내는 현재 상태를 반영하되, 한국어에서는 내적 부끄러움을 가장 자연스럽게 나타내는 표현으로 처리했습니다.
- source_word: ἐντέτραμμαι
  english_pob_choice: humiliated / disgraced
  chosen_korean: 수치를 당합니다
  alternatives_korean:
  - 굴욕을 당합니다
  - 멸시를 당합니다
  lexicon: LSJ
  rationale: 이미 ‘부끄럽다’가 앞에 있으므로, 두 번째 동사는 단순 반복보다 공개적 수치와 굴욕의 뉘앙스를 더해 주는 ‘수치를 당하다’로 옮겨 중첩된 shame 표현을 살렸습니다.
- source_word: κατὰ πρόσωπόν σου
  english_pob_choice: before your face
  chosen_korean: 주님의 얼굴 앞에서
  alternatives_korean:
  - 주님 앞에서
  - 주님의 면전에서
  lexicon: LSJ
  rationale: 직역적 이미지를 유지하면서도 현대 한국어에서 자연스럽고 공손한 표현으로, 하나님의 직접적 임재 앞에 서 있다는 감각을 드러내도록 했습니다.
theological_decisions:
- issue: ‘before your face’의 직유적 표현 보존
  chosen_reading: ‘주님의 얼굴 앞에서’로 직접성 있는 표현을 유지했습니다.
  alternative_readings:
  - ‘주님 앞에서’로 평탄화
  - ‘주님의 면전에서’로 관용화
  rationale: 본문은 단순한 위치 정보가 아니라 하나님 앞에 드러난 수치의 이미지를 전합니다. 이 긴장을 약화시키지 않기 위해 ‘얼굴 앞’의 구체성을 살렸습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
- issue: 호칭의 존칭 수준
  chosen_reading: 하나님께 드리는 직접 호칭은 ‘주님’으로, 본문 전체는 합쇼체로 유지했습니다.
  alternative_readings:
  - ‘주여’의 전통적 기도체
  - 무표지 서술형
  rationale: 원문의 기도문 성격을 살리면서도 현대 한국어 공예배 문체에 맞게 존칭을 정리했습니다.
  doctrine_reference: 'DOCTRINE.md: Modern formal-polite Korean target style'
