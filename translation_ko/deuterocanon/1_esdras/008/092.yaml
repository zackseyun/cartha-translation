base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/092.yaml
  text: Rise up and carry it through[a], for the matter is yours, and we are with you; be strong and act.
  footnotes:
  - marker: a
    text: The Greek phrase 'to act strongly' is terse and may also be understood as 'be strong' or, in light of the Hebrew parallel (Ezra 10:4), 'be strong and do it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 일어나서 그것을 이루십시오[a]. 그 일은 당신에게 맡겨졌고, 우리는 당신과 함께 있습니다. 강하게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ἰσχὺν ποιεῖν은 직역하면 ‘힘을 행하다/강함을 행하다’에 가까워, 문맥상 ‘강하게 하십시오’ 또는 ‘힘 있게 행하십시오’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  english_pob_choice: Rise up
  chosen_korean: 일어나서
  alternatives_korean:
  - 일어서서
  - 일어나
  lexicon: LSJ
  rationale: 명령적 뉘앙스를 살리되 자연스러운 현대 한국어 합쇼체로 옮겼습니다.
- source_word: ἐπίτελει
  english_pob_choice: carry it through
  chosen_korean: 그것을 이루십시오
  alternatives_korean:
  - 그것을 완수하십시오
  - 끝까지 해내십시오
  lexicon: LSJ
  rationale: ἐπιτελέω의 ‘완수하다/이루다’ 의미를 따라, 과업을 끝까지 수행하라는 촉구를 간결하게 담았습니다.
- source_word: πρὸς σὲ γὰρ τὸ πρᾶγμα
  english_pob_choice: for the matter is yours
  chosen_korean: 그 일은 당신에게 맡겨졌고
  alternatives_korean:
  - 그 일은 당신의 것입니다
  - 그 일은 당신에게 달려 있고
  lexicon: LSJ
  rationale: 직역보다 책임 부여의 관용적 의미를 드러내는 표현으로 옮겼습니다. 한국어로는 ‘맡겨졌다’가 소관과 책임을 가장 자연스럽게 나타냅니다.
- source_word: ἰσχὺν ποιεῖν
  english_pob_choice: be strong and act
  chosen_korean: 강하게 하십시오
  alternatives_korean:
  - 강해지십시오
  - 힘 있게 행하십시오
  - 강하고 행하십시오
  lexicon: LSJ
  rationale: 그리스어가 압축적으로 ‘강함을 행하다/드러내다’는 뜻을 가지므로, 두 동작을 어색하게 쪼개기보다 강한 행위 촉구를 한국어에서 자연스럽게 압축했습니다.
theological_decisions:
- issue: 마지막 구절의 압축적 권면 표현
  chosen_reading: ‘강하게 하십시오’로 옮겨, 단순한 감정적 격려가 아니라 실제 행동의 힘과 결단을 요구하는 권면으로 유지했습니다.
  alternative_readings:
  - ‘강해지십시오’
  - ‘힘 있게 행하십시오’
  rationale: 본문의 ἰσχὺν ποιεῖν은 단순한 상태 설명보다 행동과 결단을 강조하는 말로 읽히므로, 한국어에서도 그 긴장을 약화하지 않도록 했습니다.
  doctrine_reference: 성경 본문 수사와 권면의 강도 보존
- issue: 직접 권면의 호칭과 어조
  chosen_reading: 대상에게 직접 말하는 2인칭 권면을 합쇼체로 유지했습니다.
  alternative_readings:
  - 반말체
  - 더 평이한 설명체
  rationale: 본문이 격려와 명령이 결합된 직접 화행이므로, 현대 표준어의 공적인 권면 어조를 보존하는 것이 적절합니다.
  doctrine_reference: 문체 일관성과 직접 خطاب 보존
