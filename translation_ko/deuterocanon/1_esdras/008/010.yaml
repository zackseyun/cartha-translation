base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/010.yaml
  text: And having judged what is humane[a], I ordered that those of the nation of the Jews who are willing, and of their own choice, and the priests and the Levites and these others in our kingdom[b], should go with you to Jerusalem.
  footnotes:
  - marker: a
    text: Or “those of the Jewish people who wish to choose themselves,” with the rare Greek form likely emphasizing voluntary participation.
    reason: lexical_alternative
  - marker: b
    text: The supplied Hebrew parallel reflects a substantially different wording at this point; the translation follows the Greek text of 1 Esdras here.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 나는 인간적인 것이 무엇인지 판단한 뒤, 유대인 민족 가운데서 원하는 사람들, 곧 자기 뜻으로 선택한 사람들과 제사장들과 레위인들과 그리고 우리 왕국에 있는 이들까지도 당신과 함께 예루살렘으로 가도록 명령하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “인간적인 것”으로, 유대인들 가운데 자발적으로 참여하려는 사람들을 가리키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ φιλάνθρωπα
  english_pob_choice: what is humane
  chosen_korean: 인간적인 것이 무엇인지
  alternatives_korean:
  - 자비로운 것이 무엇인지
  - 인도적인 것이 무엇인지
  lexicon: LSJ
  rationale: 중성 복수 관사구가 실체화된 판단 내용을 가리키므로, 도덕적 성격을 유지하면서도 한국어에서 자연스러운 ‘인간적인 것’으로 옮겼습니다.
- source_word: κρίνας
  english_pob_choice: having judged
  chosen_korean: 판단한 뒤
  alternatives_korean:
  - 심판한 뒤
  - 결정한 뒤
  lexicon: BDAG
  rationale: 왕의 숙고 후 결정을 나타내는 부가 분사이므로, 행정적 문맥에 맞게 ‘판단한 뒤’로 처리했습니다.
- source_word: τοὺς βουλομένους ... αἱρετίζοντας
  english_pob_choice: those ... who are willing ... and of their own choice
  chosen_korean: 원하는 사람들, 곧 자기 뜻으로 선택한 사람들
  alternatives_korean:
  - 뜻하는 사람들
  - 자원하는 사람들
  lexicon: BDAG
  rationale: 두 표현이 모두 자발성을 강조하므로, 중복을 살리되 한국어에서는 ‘원하는’과 ‘자기 뜻으로 선택한’으로 분리해 의지를 분명히 했습니다.
- source_word: συμπορεύεσθαί σοι
  english_pob_choice: should go with you
  chosen_korean: 당신과 함께 ... 가도록
  alternatives_korean:
  - 동행하도록
  - 함께 가도록
  lexicon: BDAG
  rationale: 함께 이동한다는 의미를 간명하게 살리되, 공문체 문맥에 맞춰 ‘가도록’으로 연결했습니다.
