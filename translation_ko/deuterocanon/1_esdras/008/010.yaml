  source_fidelity: 개정이 필요합니다. τὰ φιλάνθρωπα는 자발적 참여자들을 뜻하지 않고 왕이 정한 ‘인도적/자비로운 조처’를 가리킵니다. 또한 αἱρετίζοντας의 드문 용례와 다소 거친 열거 구조는 자발성의 강조로 옮기되, 본문에 없는 설명을 본문에 넣지 않는 편이 안전합니다.
  naturalness: 초안의 ‘인간적인 것이 무엇인지’는 현대 한국어에서 부자연스럽고 의미가 모호합니다. ‘인도적인 조처를 정하고’는 왕의 행정적 발화에 자연스럽습니다. ‘원하는 사람들, 곧 자기 뜻으로 선택한 사람들’은 같은 대상을 장황하게 풀어 쓰므로 ‘자원하여 스스로 택하는 이들’로 정리할 수 있습니다.
  terminology: ‘제사장들’, ‘레위인들’, ‘예루살렘’은 적절합니다. συμπορεύεσθαί σοι는 ‘당신과 함께 예루살렘으로 가도록’으로 충실하게 유지합니다. τῶνδε는 지시대명사의 다소 불분명함을 보존하여 ‘우리 왕국에 있는 이들도’로 옮깁니다.
