base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/086.yaml
  text: Were you not angry with us[a], to destroy us, leaving no root or seed or name of ours?
  footnotes:
  - marker: a
    text: Or, more interpretively, 'until no remnant, offspring, or name of ours was left.' The Greek reads literally 'root and seed and name.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 우리에게 노하셔서 우리를 멸하시고, 우리의 뿌리와 씨와 이름도 남기지 않으실 만큼 하신 것이 아닙니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ‘뿌리와 씨와 이름’이라는 구체적인 세 표현을 사용합니다. 이는 남아 있는 계보와 정체성이 전혀 없게 되는 극단적인 상황을 비유적으로 나타냅니다.
    reason: source_note
lexical_decisions:
- source_word: οὐχὶ
  english_pob_choice: Were you not
  chosen_korean: ~하신 것이 아닙니까?
  alternatives_korean:
  - ~하지 않으셨습니까?
  - 정말 ~하신 것 아닙니까?
  lexicon: LSJ
  rationale: 반문으로서 긍정을 기대하는 질문이므로, 현대 한국어에서는 정중한 반문형으로 살리는 것이 자연스럽습니다.
- source_word: ὠργίσθης
  english_pob_choice: were ... angry
  chosen_korean: 노하셔서
  alternatives_korean:
  - 분노하셔서
  - 진노하셔서
  lexicon: BDAG
  rationale: 하나님의 감정적·심판적 분노를 담되, 지나치게 격한 표현보다 본문에 충실한 표준어로 옮겼습니다.
- source_word: ἕως τοῦ μὴ καταλιπεῖν ῥίζαν καὶ σπέρμα καὶ ὄνομα ἡμῶν
  english_pob_choice: leaving no root or seed or name of ours
  chosen_korean: 우리에게서 뿌리와 씨와 이름도 남기지 않으려 하신
  alternatives_korean:
  - 우리의 뿌리와 씨와 이름을 남기지 않으려 하신
  - 뿌리와 씨와 이름이 하나도 남지 않게 하려 하신
  lexicon: BDAG
  rationale: 그리스어의 목적/결과 구조를 한국어의 자연스러운 부정 목적형으로 풀어, ‘남기지 않다’의 총체성을 그대로 살렸습니다.
- source_word: ῥίζαν καὶ σπέρμα καὶ ὄνομα
  english_pob_choice: root or seed or name
  chosen_korean: 뿌리와 씨와 이름
  alternatives_korean:
  - 뿌리와 후손과 이름
  - 뿌리와 자손과 이름
  lexicon: BDAG
  rationale: ‘root/seed/name’의 삼중 이미지를 보존하기 위해 직역에 가까운 ‘뿌리/씨/이름’을 택했습니다. ‘씨’는 후손을 암시하지만 원문 이미지의 형식을 유지합니다.
theological_decisions:
- issue: 직접적인 심판-소멸 표현의 강도
  chosen_reading: 본문이 말하는 것은 단순한 징계가 아니라, 남은 계보와 정체성까지 끊어질 수 있는 심판의 극단성을 나타내는 것으로 보았습니다.
  alternative_readings:
  - 더 완곡하게 ‘우리의 남은 자가 없게 하려 하신’으로 요약할 수 있습니다.
  - ‘남은 자, 후손, 이름’처럼 해석어를 넣어 의미를 풀어줄 수도 있습니다.
  rationale: 원문은 추상어보다 ‘뿌리, 씨, 이름’이라는 구체적 삼중어를 사용하므로, 그 긴장과 무게를 그대로 드러내는 번역이 필요합니다.
  doctrine_reference: 원문 우선, 신학적 긴장 보존
