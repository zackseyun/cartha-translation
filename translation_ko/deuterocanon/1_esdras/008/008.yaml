base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/008.yaml
  text: A copy of the document presented by King Artaxerxes to Ezra the priest and reader of the law of the Lord is set out below:[a][b]
  footnotes:
  - marker: a
    text: The Greek reads 'reader of the law of the Lord.' The Hebrew parallel in Ezra 7:11 has 'scribe' rather than 'reader.'
    reason: alternative_reading
  - marker: b
    text: The Greek wording of this heading is somewhat awkward; the sense is that a copy of Artaxerxes' document to Ezra is reproduced below.
    reason: textual_variant
translation:
  language: ko
  text: 아르타크세르크세스 왕이 제사장이며 주님의 율법 낭독자인 에스라에게 전달한 문서의 사본이 아래에 제시됩니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘주님의 율법 낭독자’라고 합니다. 에스라 7:11의 히브리어 평행문에는 ‘서기관’이 나옵니다.
    reason: alternative_reading
  - marker: b
    text: 이 표제문은 그리스어 표현이 다소 어색합니다. 뜻은 아르타크세르크세스 왕이 에스라에게 전달한 문서의 사본이 아래에 제시된다는 것입니다.
    reason: textual_variant
lexical_decisions:
- source_word: Προσπεσόντος παρὰ Ἀρταξέρξου βασιλέως
  english_pob_choice: presented by King Artaxerxes
  chosen_korean: 아르타크세르크세스 왕이 전달한
  alternatives_korean:
  - 아르타크세르크세스 왕으로부터 온
  - 아르타크세르크세스 왕이 제출한
  lexicon: LSJ
  rationale: 문서 머리말의 관용적·서류적 용법으로 이해하여, 어색한 직역보다 왕이 문서를 공식적으로 건넨 뜻을 드러내는 ‘전달한’으로 옮겼습니다.
- source_word: πρὸς Ἔσραν
  english_pob_choice: to Ezra
  chosen_korean: 에스라
  alternatives_korean:
  - 에스라에게
  - 에스라를 향해
  lexicon: LSJ
  rationale: 수신 대상이 분명한 공문 문맥이므로 한국어에서는 ‘에게’를 반복하지 않고 인명 뒤 배치로 자연스럽게 처리했습니다.
- source_word: τὸν ἱερέα
  english_pob_choice: the priest
  chosen_korean: 제사장
  alternatives_korean:
  - 사제
  - 제사장인
  lexicon: LSJ
  rationale: 에스라의 직함을 직역해 유지했습니다. 한국어 성경 관용어 가운데 ‘제사장’이 가장 직접적입니다.
- source_word: ἀναγνώστην τοῦ νόμου Κυρίου
  english_pob_choice: reader of the law of the Lord
  chosen_korean: 주님의 율법의 낭독자
  alternatives_korean:
  - 주님의 율법의 서기관
  - 주님의 율법의 독자
  lexicon: LSJ
  rationale: 그리스어 ἀναγνώστης의 기본 뜻인 ‘읽는 사람/낭독자’를 살려, 히브리어 평행문의 ‘서기관’으로 조화시키지 않고 그리스어 고유 표현을 보존했습니다.
- source_word: Κυρίου
  english_pob_choice: the Lord
  chosen_korean: 주님의
  alternatives_korean:
  - 주님의
  - 주 하나님의
  lexicon: LSJ
  rationale: 기존 프로젝트 기본어휘에 따라 κύριος는 ‘주님’으로 옮기되, 소유격 구조를 자연스럽게 반영해 ‘주님의’로 처리했습니다.
- source_word: ἀντίγραφον τὸ ὑποκείμενον
  english_pob_choice: a copy ... is set out below
  chosen_korean: 문서의 사본이 아래에 나옵니다
  alternatives_korean:
  - 문서의 사본이 아래에 제시됩니다
  - 문서의 복사본이 아래에 나옵니다
  lexicon: LSJ
  rationale: ἀντίγραφον은 행정 문서 맥락에서 ‘사본’이 가장 적절하고, τὸ ὑποκείμενον의 다소 비정형적 표현은 한국어 관용에 맞게 ‘아래에 나옵니다’로 옮겼습니다.
theological_decisions:
- issue: ἀναγνώστην τοῦ νόμου Κυρίου의 직함 처리와 히브리어 평행문과의 차이
  chosen_reading: 본문은 ‘율법의 낭독자’로 유지하고, 평행문과의 차이는 각주로 알립니다.
  alternative_readings:
  - 율법의 서기관
  - 율법 전문가
  rationale: 1 Esdras의 직접 원문인 그리스어가 우선이므로, 히브리어 평행문의 ‘서기관’으로 평준화하지 않고 그리스어의 직함 차이를 그대로 드러냈습니다.
  doctrine_reference: 원문 우선 원칙; 평행본문 차이를 제거하지 않고 보존
