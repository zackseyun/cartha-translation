  source_fidelity: 그리스어의 문서 표제 형식, 아르타크세르크세스 왕에서 에스라에게로 향하는 관계, ‘제사장’ 및 ἀναγνώστης의 ‘낭독자’라는 직함, 그리고 아래에 사본이 이어진다는 뜻을 대체로 충실히 반영했습니다. 다만 에스라의 두 직함이 동격임을 본문에서 더 명료하게 하는 것이 안전합니다.
