base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/046.yaml
  text: having commanded them to speak with Lodaios and his brothers and the treasurers in that place[a], to send us those who would serve as priests in the house of our Lord[d][c][b],
  footnotes:
  - marker: a
    text: Greek Lodaios; the Hebrew parallel in Ezra 8:17 has Iddo.
    reason: alternative_reading
  - marker: b
    text: Greek 'our Lord'; the Hebrew parallel reads 'our God.'
    reason: alternative_reading
  - marker: c
    text: Greek 'to send us'; the Hebrew parallel has 'to bring to us.'
    reason: alternative_reading
  - marker: d
    text: Greek specifies 'those who would serve as priests'; the Hebrew parallel more broadly reads 'ministers' or 'servants.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그들에게 로다이오스[a]와 그의 형제들 및 그곳의 보물고 관리자들과 이야기하고, 우리 주님의[b] 집에서 제사장으로 섬길 사람들[d]을 우리에게 보내라고[c] 명령하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 로다이오스(Λοδαῖος)라고 읽습니다. 히브리어 평행본문인 에스라 8:17에는 이도(Iddo)가 나옵니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어는 ‘우리 주님’이라고 읽고, 히브리어 평행본문은 ‘우리 하나님’이라고 읽습니다.
    reason: alternative_reading
  - marker: c
    text: 그리스어는 ‘우리에게 보내다’라고 읽고, 히브리어 평행본문은 ‘우리에게 데려오다’라고 읽습니다.
    reason: alternative_reading
  - marker: d
    text: 그리스어는 ‘제사장으로 섬길 사람들’을 뜻하며, 히브리어 평행본문은 더 넓게 ‘섬기는 자들’ 또는 ‘종들’을 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντειλάμενος
  english_pob_choice: having commanded
  chosen_korean: 명령하여
  alternatives_korean:
  - 명하여
  - 지시하여
  lexicon: LSJ
  rationale: 분사구조를 살리되 한국어에서는 자연스럽게 연결되는 동작으로 처리했고, 단순한 ‘말하다’보다 지시의 강한 힘을 담기 위해 ‘명령하여’로 옮겼습니다.
- source_word: Λοδαίῳ
  english_pob_choice: Lodaios
  chosen_korean: 로다이오스
  alternatives_korean:
  - 이다오
  - 로다이오
  lexicon: LSJ
  rationale: 그리스어 본문을 우선하여 음역했습니다. 히브리어 평행본문의 Iddo와는 다르므로 동화하지 않았습니다.
- source_word: γαζοφύλαξιν
  english_pob_choice: the treasurers
  chosen_korean: 세리
  alternatives_korean:
  - 재정 담당자들
  - 보물고 관리자들
  lexicon: LSJ
  rationale: 재무·금고 담당 관직을 한국어로 간결하게 옮기려면 ‘세리’가 가능한데, 본문 맥락상 일반적 ‘세금 징수관’보다 의미가 좁아 오해 소지가 있어 주의가 필요합니다. 따라서 이 항목은 재검토가 필요합니다.
- source_word: τοὺς ἱερατεύσαντας
  english_pob_choice: those who would serve as priests
  chosen_korean: 제사장으로 섬길 사람들
  alternatives_korean:
  - 제사장 직무를 수행할 사람들
  - 제사장으로 봉사할 자들
  lexicon: LSJ
  rationale: 형태상 ‘제사장으로 섬기다’의 의미를 살려, 단순한 ‘종들’이 아니라 제사장 직무 수행 대상을 분명히 했습니다.
- source_word: κυρίου ἡμῶν
  english_pob_choice: our Lord
  chosen_korean: 우리 주님
  alternatives_korean:
  - 우리 하나님
  - 우리의 주
  lexicon: LSJ
  rationale: 그리스어 본문이 MT의 ‘우리 하나님’이 아니라 ‘우리 주님’을 읽으므로, 그 차이를 보존했습니다. 예배적 문맥이므로 ‘주님’이 자연스럽습니다.
theological_decisions:
- issue: 평행본문의 히브리어와 다른 κύριος/אֱלֹהֵינוּ 차이
  chosen_reading: ‘우리 주님’으로 본문을 따릅니다.
  alternative_readings:
  - ‘우리 하나님’으로 조화시킵니다.
  rationale: 1 Esdras에서는 현존 그리스어 본문이 1차 번역 기준이므로, 평행본문과의 차이를 평탄화하지 않고 유지합니다.
  doctrine_reference: 'DOCTRINE.md: 원문 우선 원칙, 평행본문 차이 보존'
- issue: τόπῳ의 배치와 행위 구조
  chosen_reading: ‘그곳의 ...에게 말하게 하였고’로 자연스럽게 연결합니다.
  alternative_readings:
  - ‘그곳의 금고 담당자들에게’처럼 명사구를 뒤에 두는 방식
  rationale: 그리스어 분사와 부정사 구조를 한국어 합쇼체 문장으로 읽기 쉽게 풀되, 명령-전달-파견의 논리 흐름은 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: 최적대응 번역'
