base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/033.yaml
  text: 'From the sons of Lam: Esias son of Gotholias[a], and with him seventy men.'
  footnotes:
  - marker: a
    text: The approximate MT parallel at Ezra 8:3 reads differently in names and number, with 'from the sons of Shecaniah, son of Jahaziel ... three hundred males.' Because 1 Esdras is translated here from the Greek witness, the main text follows the Greek names and the number seventy.
    reason: textual_variant
translation:
  language: ko
  text: 람의 자손들 가운데서는 에시아, 곧 고돌리야의 아들[a]과 그와 함께한 사람 칠십 명이 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 평행하는 MT 본문인 에스라 8:3은 이름 배열과 숫자가 다르며, ‘스가냐의 자손, 야하시엘의 아들 … 남자 삼백 명’으로 읽습니다. 이 번역은 그리스어 증거를 따라 본문을 옮겼습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν Λάμ
  english_pob_choice: From the sons of Lam
  chosen_korean: 람의 자손들 가운데서는
  alternatives_korean:
  - 람의 아들들 가운데서는
  - 람의 자손들 중에서
  lexicon: LSJ
  rationale: γεν계 목록의 도입구로서 소속 집단을 나타내므로, 한국어에서는 자연스럽게 ‘~의 자손들 가운데서’로 옮겨 원문의 분류 구조를 살렸습니다.
- source_word: Ἐσίας
  english_pob_choice: Esias
  chosen_korean: 에시아
  alternatives_korean:
  - 에시아스
  - 에사이아스
  lexicon: LSJ
  rationale: 고유명사는 그리스어형을 따라 음역했습니다. MT의 다른 이름형과 맞추기보다 그리스어 본문에 고정하는 것이 이 절의 원문 기준에 맞습니다.
- source_word: Γοθολίου
  english_pob_choice: Gotholias
  chosen_korean: 고돌리야의 아들
  alternatives_korean:
  - 고돌리야
  - 고돌리우의
  lexicon: LSJ
  rationale: 그리스어 속격이 혈연 관계를 나타내므로 한국어에서는 ‘~의 아들’로 풀어 관계를 명시했습니다. 이는 영어 POB의 ‘son of’ 처리에 대응합니다.
- source_word: ἄνδρες ἑβδομήκοντα
  english_pob_choice: seventy men
  chosen_korean: 사람 칠십 명
  alternatives_korean:
  - 남자 칠십 명
  - 칠십 명의 남자
  lexicon: LSJ
  rationale: ἄνδρες는 문자적으로 ‘남자들’이지만, 이 명단 맥락에서는 단순 수량 보고이므로 한국어에서는 성별을 과도하게 전면화하지 않는 ‘사람 칠십 명’이 자연스럽습니다. 다만 원문의 수량은 그대로 보존했습니다.
theological_decisions:
- issue: 1 Esdras의 그리스어 본문을 우선할지, 에스라 8:3의 히브리어/MT 평행 본문과 맞출지
  chosen_reading: 그리스어 본문을 따라 람, 에시아, 고돌리야, 칠십 명으로 옮겼습니다.
  alternative_readings:
  - MT 평행의 다른 이름 배열과 ‘삼백 남자’에 맞추는 읽기
  rationale: 이 절은 1 Esdras의 그리스어 증거를 주 본문으로 삼는다는 편집 원칙이 명시되어 있으므로, 평행 본문의 차이는 각주로만 처리하는 것이 적절합니다.
  doctrine_reference: 본문 비평 및 1 Esdras 번역 원칙
