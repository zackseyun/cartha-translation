    reason: alternative_reading
  - marker: c
    text: 히브리어 병행은 숫자를 ‘열여덟’으로 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἄνδρα ἐπιστήμονα
  english_pob_choice: a man of understanding
  chosen_korean: 지혜 있는 사람
  alternatives_korean:
  - 이해력이 있는 사람
  - 식견 있는 사람
  - 알고 있는 사람
  lexicon: LSJ
  rationale: ἐπιστήμονα는 단순한 지식보다 분별과 숙련을 함께 지닌 사람을 가리키므로, 한국어에서는 자연스러운 ‘지혜 있는 사람’으로 옮겨 의미를 살렸습니다.
- source_word: τῶν υἱῶν Μοολὶ
  english_pob_choice: from the sons of Mooli
  chosen_korean: 므울리의 아들
  alternatives_korean:
  - 므울리의 자손
  - 므올리의 아들
  lexicon: LSJ
  rationale: 계보 표현은 원문의 소속 관계를 드러내는 것이 중요하므로 ‘아들’을 유지했고, Greek형 이름 Μοολὶ는 음역해 본문에 반영했습니다.
- source_word: Ἀσεβηβίαν
  english_pob_choice: Asebebias
  chosen_korean: 아세비비아스
  alternatives_korean:
  - 아세베비아스
  - 아세비비아
  lexicon: LSJ
  rationale: 주 소스가 그리스어이므로 그 형태를 직접 음역했습니다. 본문 이름은 Greek 표기를 따라 아세비비아스로 옮겼습니다.
- source_word: δέκα
  english_pob_choice: ten
  chosen_korean: 열 명
  alternatives_korean:
  - 십 명
  - 열둘
  lexicon: LSJ
  rationale: 숫자는 한국어 현대 서술에서 자연스러운 ‘열 명’으로 옮겼습니다. MT 병행본의 ‘열여덟’은 본문이 아닌 주해적 대조 사항입니다.
