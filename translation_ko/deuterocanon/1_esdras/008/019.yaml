base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/019.yaml
  text: And I[a], King Artaxerxes, have given orders to the treasurers of Syria and Phoenicia, that whatever Ezra the priest and reader of the law of God Most High may send for, they are to give him carefully, up to one hundred talents of silver[b],
  footnotes:
  - marker: a
    text: Or 'may request.' The Greek verb literally means 'may send,' but in this supply context it likely refers to sending a requisition or request.
    reason: lexical_alternative
  - marker: b
    text: Greek 'reader of the law.' In parallel Ezra traditions he is often described as a scribe; this Greek witness explicitly uses 'reader.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 나, 아르타크세르크세스 왕은 시리아와 페니키아의 재무관들에게 명령하여, 에스라 제사장 곧 지극히 높으신 하나님의 율법을 읽는 자가 요청하는 것은 무엇이든지, 은 백 달란트에 이르기까지 그에게 신중히 주게 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 동사는 문자적으로는 ‘보내다’이지만, 이 공급 문맥에서는 요청이나 청구를 의미할 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘율법의 읽는 자’라고 하며, 평행한 에스라 전승에서는 흔히 ‘서기관’으로 묘사됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: προσέταξα
  english_pob_choice: have given orders
  chosen_korean: 명령하여
  alternatives_korean:
  - 지시하여
  - 명하여
  lexicon: BDAG
  rationale: 왕의 권위를 드러내는 강한 동사를 택하되, 현대 한국어에서 자연스러운 공적 문체로 옮겼습니다.
- source_word: γαζοφύλαξι
  english_pob_choice: treasurers
  chosen_korean: 재무관들에게
  alternatives_korean:
  - 금고 관리자들에게
  - 금고 담당자들에게
  lexicon: LSJ
  rationale: 단순한 금고 보관인이 아니라 왕실 재정을 맡은 관리들을 가리키므로, 직함성을 살려 옮겼습니다.
- source_word: ἀναγνώστης
  english_pob_choice: reader
  chosen_korean: 읽는 자
  alternatives_korean:
  - 낭독자
  - 독서자
  lexicon: LSJ
  rationale: 그리스어가 문자 그대로 ‘읽는 사람’을 뜻하므로, 후대의 ‘서기관’으로 바꾸지 않고 본문 표현을 유지했습니다.
- source_word: ἀποστείλῃ
  english_pob_choice: may send for
  chosen_korean: 요청하는 것은 무엇이든지
  alternatives_korean:
  - 보내는 것은 무엇이든지
  - 청하는 것은 무엇이든지
  lexicon: BDAG
  rationale: 이 문맥에서는 단순한 ‘보내다’보다, 공급을 위한 requisition/요청의 뜻이 더 자연스럽게 드러나므로 청구의 의미를 반영했습니다.
- source_word: τοῦ νόμου τοῦ θεοῦ τοῦ ὑψίστου
  english_pob_choice: of the law of God Most High
  chosen_korean: 지극히 높으신 하나님의 율법
  alternatives_korean:
  - 가장 높으신 하나님의 율법
  - 하나님 지극히 높으신 분의 율법
  lexicon: LSJ
  rationale: ‘ὑψίστου’의 수식 관계를 한국어의 자연스러운 관용으로 풀어 ‘지극히 높으신 하나님’으로 옮겼습니다.
- source_word: ἕως ἀργυρίου τάλαντων ἑκατόν
  english_pob_choice: up to one hundred talents of silver
  chosen_korean: 은 백 달란트에 이르기까지
  alternatives_korean:
  - 은 백 달란트까지
  - 은 백 달란트 한도까지
  lexicon: LSJ
  rationale: ἕως가 허용 한도를 나타내므로, 지급 상한을 분명히 하는 표현으로 옮겼습니다.
theological_decisions:
- issue: ἰδοὺ의 처리와 왕의 자기 제시
  chosen_reading: ‘그리고 나’로 시작해 왕의 직접적 자기 선언을 살리고, 별도의 ‘보라’는 두지 않았습니다.
  alternative_readings:
  - 보라, 나
  - 내가 여기 있다
  rationale: 이 담화 표지는 현대 한국어에서 서술 흐름을 방해할 수 있어, 왕의 자기 제시가 이미 충분히 강조되므로 자연스럽게 흡수했습니다.
  doctrine_reference: 'DOCTRINE.md: discourse particles may be omitted when their force is otherwise carried'
- issue: ‘reader of the law’의 직함 보존
  chosen_reading: 에스라를 ‘율법을 읽는 자’로 유지했습니다.
  alternative_readings:
  - 서기관
  - 율법 낭독자
  rationale: 이 증언은 평행 전통의 ‘서기관’보다 ‘읽는 자’라는 그리스어 직함을 명시하므로, 본문이 가진 독특한 호칭을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: preserve source-specific titles where textually explicit'
