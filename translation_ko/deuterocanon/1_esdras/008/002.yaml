base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/002.yaml
  text: son of Saddoulouk[a], son of Acheitob, son of Amartheios, son of Ozeias, son of Bokka, son of Abeisai, son of Phinees, son of Eleazar[c][b], son of Aaron the chief priest.
  footnotes:
  - marker: a
    text: 'The Greek text here gives a fuller genealogy than the brief Hebrew parallel, which reads: ''son of Shallum, son of Zadok, son of Ahitub.'''
    reason: alternative_reading
  - marker: b
    text: 'Several names here reflect Greek forms of more familiar Hebrew names: Acheitob = Ahitub, Ozeias = Uzzi, Bokka = Bukki, Abeisai = Abishua, Phinees = Phinehas.'
    reason: lexical_alternative
  - marker: c
    text: Or possibly 'the first high priest,' though the Greek word is simply 'priest.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사두룩의 아들, 아히돕의 아들, 아마르테오스의 아들, 웃시야의 아들, 북기의 아들, 아비수아의 아들, 비느하스의 아들, 엘르아살의 아들, 아론 곧 첫째 제사장의 아들입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 히브리어 병행본문보다 더 긴 족보를 제시합니다. 히브리어 병행본문은 ‘살룸, 사독, 아히둡’으로 더 짧습니다.
    reason: alternative_reading
  - marker: b
    text: '이 이름들에는 히브리어에서 더 익숙한 대응형이 있습니다: 아히돕=아히둡, 웃시야=웃지, 북기=부기, 아비수아=아비사.'
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘첫째 제사장’으로도 옮길 수 있습니다. 그리스어는 단순히 ‘제사장’이라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ Σαδδουλούκου
  english_pob_choice: Saddoulouk
  chosen_korean: 사두룩
  alternatives_korean:
  - 사둘루크
  - 사들룩
  - 삿둘룩
  lexicon: LSJ
  rationale: 그리스어 고유명사 형태를 음역하되, 한국어 성경에서 익숙한 음운에 맞게 자연스럽게 옮겼습니다. MT의 ‘살룸’과는 다른 그리스 본문 형태를 주본문에 유지합니다.
- source_word: τοῦ Ἀχειτὼβ
  english_pob_choice: Acheitob
  chosen_korean: 아히돕
  alternatives_korean:
  - 아케이토브
  - 아히둡
  lexicon: LSJ
  rationale: 그리스어 표기를 따라가되, 히브리어 계열의 대응형과 연결되는 표준 음역을 택했습니다. 문맥상 족보의 고유명사로 자연스럽게 읽히게 합니다.
- source_word: τοῦ Ὀζείου
  english_pob_choice: Ozeias
  chosen_korean: 웃시야
  alternatives_korean:
  - 오지야
  - 오제이아스
  lexicon: LSJ
  rationale: 그리스어 음역형을 한국어로 옮기면서도, 알려진 히브리어 대응형과의 연결을 살렸습니다. POB의 주본문 원칙에 따라 그리스어 계열을 우선했습니다.
- source_word: τοῦ Βοκκὰ
  english_pob_choice: Bokka
  chosen_korean: 북기
  alternatives_korean:
  - 보카
  - 부키
  lexicon: LSJ
  rationale: 그리스어 표기에서 온 이름을 음역했습니다. 히브리어 대응형이 더 익숙할 수 있으나, 본문은 그리스어를 기준으로 유지합니다.
- source_word: τοῦ Ἀβεισαὶ
  english_pob_choice: Abeisai
  chosen_korean: 아비수아
  alternatives_korean:
  - 아베이사이
  - 아비사이
  lexicon: LSJ
  rationale: 그리스어형 고유명사를 한국어 성경식 음역으로 옮겼습니다. 족보 항목이므로 의미 번역보다 이름 형태 보존이 적절합니다.
- source_word: τοῦ Φεινεὲς
  english_pob_choice: Phinees
  chosen_korean: 비느하스
  alternatives_korean:
  - 피네에스
  - 피네하스
  lexicon: LSJ
  rationale: 히브리어 계열의 통용형을 채택해 한국어 독자가 바로 인식할 수 있게 했습니다. 그리스어 표기는 족보 흐름 안에서 충분히 식별 가능합니다.
- source_word: τοῦ πρώτου ἱερέως
  english_pob_choice: the first priest
  chosen_korean: 첫째 제사장
  alternatives_korean:
  - 첫 제사장
  - 대제사장
  lexicon: LSJ
  rationale: ἱερεύς는 ‘제사장’이며, ἀρχιερεύς가 아니므로 ‘대제사장’은 피했습니다. πρῶτος의 ‘첫째/첫’ 의미를 살려 아론의 원초적 지위를 직접적으로 표현했습니다.
theological_decisions:
- issue: Aaron의 직함을 ‘대제사장’으로 올릴지 여부
  chosen_reading: 본문의 어휘를 따라 ‘첫째 제사장’으로 두었습니다.
  alternative_readings:
  - 대제사장
  - 첫 제사장
  rationale: 그리스어는 ἱερεύς(제사장)이지 ἀρχιερεύς(대제사장)가 아니므로, 신학적으로 익숙한 직함을 덧씌우지 않고 어휘 차이를 보존했습니다.
  doctrine_reference: 'Translation philosophy #1 original-language primacy over translation tradition'
- issue: 그리스어 족보의 긴 계열을 히브리어 병행본문의 짧은 계열로 평준화할지 여부
  chosen_reading: 그리스어의 더 긴 족보를 그대로 유지했습니다.
  alternative_readings:
  - 살룸-사독-아히둡의 짧은 병행형으로 조정
  rationale: 1 Esdras에서는 그리스어 본문이 1차 기준이므로, 병행 히브리어 전통에 맞춰 축약하지 않고 본문에 있는 족보 길이를 보존했습니다.
  doctrine_reference: 'PHILOSOPHY.md: original-language primacy over parallel harmonization'
