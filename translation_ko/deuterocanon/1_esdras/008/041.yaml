  text: 'From the sons of Banai: Outu son of Istakalkou, and with him seventy men.'
translation:
  language: ko
  text: 바나이의 자손 가운데서는 우투, 곧 이스타칼쿠의 아들이 있었으며, 그와 함께한 사람은 칠십 명이었습니다.
  philosophy: formal
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν Βαναὶ
  english_pob_choice: From the sons of Banai
  chosen_korean: 바나이의 자손 가운데서는
  alternatives_korean:
  - 바나이의 아들들 가운데서는
  - 바나이의 자손들 중에는
  lexicon: υἱοί
  rationale: 출발점을 표시하는 ἐκ τῶν을 한국어의 문맥상 자연스러운 ‘~가운데서는’으로 옮기고, υἱοί는 혈통 집단을 드러내는 ‘자손’으로 처리했습니다.
- source_word: Οὐτοῦ Ἰστακάλκου
  english_pob_choice: Outu son of Istakalkou
  chosen_korean: 우투, 곧 이스타칼쿠의 아들
  alternatives_korean:
  - 우투 이스타칼쿠의 아들
  - 우투, 이스타칼쿠의 아들
  lexicon: 고유명사 / 친족표현
  rationale: POB의 이름 형태인 Outu를 ‘우투’로 음역하고, 소유·혈연 관계는 ‘곧 …의 아들’로 풀어 주어 문장 흐름과 관계를 분명히 했습니다.
- source_word: ἄνδρες ἑβδομήκοντα
  english_pob_choice: seventy men
  chosen_korean: 칠십 명이었습니다
  alternatives_korean:
  - 남자 칠십 명이었습니다
  - 일흔 명이 있었습니다
  lexicon: ἄνδρες
  rationale: ἄνδρες는 단순한 ‘사람들’보다 남성 집단을 가리키지만, 한국어에서는 인원수 표현으로 자연스럽게 ‘칠십 명’이라 옮기되 필요 최소한의 성별 정보만 남겼습니다.
theological_decisions:
- issue: 이 절의 계수·명단 서술 방식
