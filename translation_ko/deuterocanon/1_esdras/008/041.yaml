  alternative_readings:
  - 직역에 가까운 ‘그리고 그와 함께 남자 칠십 명’
  - 명사구를 더 압축한 목록형 번역
  rationale: 본문은 신학적 해석보다 목록 보고가 중심이므로, 의미를 덧붙이지 않고 원문의 인원 보고 기능을 그대로 드러내는 방향을 택했습니다.
  doctrine_reference: 본문 맥락상 없음
