base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/014.yaml
  text: together with what was freely given by the nation for the temple of their Lord in Jerusalem[a], and the gold and silver to be gathered for bulls and rams and lambs and what goes with them[b],
  footnotes:
  - marker: a
    text: The Hebrew parallel in Ezra 7:16 differs notably here, speaking of silver and gold freely offered by the king and his counselors to the God of Israel, whose dwelling is in Jerusalem. 1 Esdras' Greek wording is not identical and is translated as given.
    reason: textual_variant
  - marker: b
    text: Or 'the accompanying things,' likely the additional items required for the sacrifices.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 백성이 자원하여 드린 것과 더불어, 예루살렘에 있는 그들의 주님의 성전으로 모을 금과 은, 곧 수소와 숫양과 어린양과 그것들과 함께 딸린 것들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 '백성'이 자원하여 드린 것으로 말하며, 히브리어 병행문(에스라 7:16)은 왕과 신하들이 드린 은과 금으로 다르게 말합니다.
    reason: textual_variant
  - marker: b
    text: 또는 '그것들과 함께 하는 것들' — 제사에 필요한 부수 물품을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺν τῷ δεδωρημένῳ ὑπὸ τοῦ ἔθνους
  english_pob_choice: together with what was freely given by the nation
  chosen_korean: 백성이 자원하여 드린 것과 더불어
  alternatives_korean:
  - 나라가 바친 것과 함께
  - 민족이 준 것과 더불어
  - 백성이 드린 것과 함께
  lexicon: BDAG
  rationale: σὺν은 단순한 동반보다 병렬·첨가의 힘이 있어 '더불어'로 살렸고, δεδωρημένῳ는 자원성/증여성을 드러내어 '자원하여 드린 것'으로 옮겼습니다.
- source_word: τοῦ κυρίου αὐτῶν
  english_pob_choice: of their Lord
  chosen_korean: 그들의 주님의
  alternatives_korean:
  - 그들의 주의
  - 그들의 주 하나님의
  - 그들의 주님에 속한
  lexicon: BDAG
  rationale: κύριος는 본문의 소유격을 살려 '주님'으로 옮겼고, αὐτῶν의 소유 관계를 자연스럽게 '그들의 주님의'로 반영했습니다.
- source_word: τὸ ἐν Ἰερουσαλήμ
  english_pob_choice: in Jerusalem
  chosen_korean: 예루살렘에 있는
  alternatives_korean:
  - 예루살렘에 있는 그
  - 예루살렘 안에 있는
  - 예루살렘에
  lexicon: BDAG
  rationale: 관사+분사적 구성은 성전의 위치를 가리키므로, 한국어에서는 '예루살렘에 있는'으로 간명하게 처리했습니다.
- source_word: εἰς ταύρους καὶ κριοὺς καὶ ἄρνας καὶ τὰ τούτοις ἀκόλουθα
  english_pob_choice: for bulls and rams and lambs and what goes with them
  chosen_korean: 곧 수소와 숫양과 어린양과 그것들과 함께 딸린 것들입니다
  alternatives_korean:
  - 곧 황소들과 숫양들과 어린양들과 그에 딸린 것들입니다
  - 곧 소들과 숫양들과 새끼양들과 관련된 것들입니다
  - 곧 수소와 숫양과 어린양과 그에 따른 것들입니다
  lexicon: BDAG
  rationale: 제사 동물 목록은 성경적 제의 맥락을 살려 구체적으로 옮겼고, τὰ τούτοις ἀκόλουθα는 범위를 좁히지 않고 '그것들과 함께 딸린 것들'로 보존했습니다.
theological_decisions:
- issue: 1 Esdras의 그리스어 본문과 에스라 7:16의 히브리어 병행문의 차이
  chosen_reading: 본문의 그리스어를 그대로 따라 '백성이 자원하여 드린 것'과 '그들의 주님의 성전'으로 번역하고, 히브리어 병행문과의 차이는 본문 주석에서 다룰 수 있도록 남겨 둡니다.
  alternative_readings:
  - 히브리어 병행문에 맞추어 '왕과 신하들이 자원하여 드린 은과 금'으로 조정
  - 본문을 에스라 7:16과 조화시키는 방향으로 재구성
  rationale: 이 절은 그리스어 증거가 주 본문이며 병행 히브리어와 현저히 다르므로, 조화보다 증거 본문 충실성을 우선해야 합니다.
  doctrine_reference: '번역 원칙: 원문 우선, 병행 본문은 확인 자료로 사용'
