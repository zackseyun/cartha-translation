    text: 여기의 그리스어 이름들은 에스라 8:2의 히브리어 평행본문과 상당히 다릅니다. 그 평행본문에는 ‘비느하스 자손 가운데 게르솜, 이다말 자손 가운데 다니엘, 다윗 자손 가운데 핫두스’라고 되어 있습니다. 이 본문은 1 에스드라의 그리스어 전승을 따르므로, 주본문은 히브리어 평행본문에 맞추어 조화시키지 않습니다.
    reason: alternative_reading
  - marker: b
    text: ‘다윗 자손 가운데서는’이라는 표현은 다음 절에서 명단이 계속되므로, 여기서는 열린 채로 남습니다.
    reason: cross_reference
