base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/029.yaml
  text: From the sons of Phoros[a], Tarosotomos; from the sons of Ietamar, Gamelos; from the sons of David[b],
  footnotes:
  - marker: a
    text: 'The Greek names here differ notably from the approximate MT parallel in Ezra 8:2, which reads: ''from the sons of Phinehas, Gershom; from the sons of Ithamar, Daniel; from the sons of David, Hattush.'' Because 1 Esdras is translated from the Greek witness, the main text preserves the Greek forms rather than harmonizing them to the Hebrew parallel.'
    reason: alternative_reading
  - marker: b
    text: The phrase 'from the sons of David,' is left open-ended because the Greek list continues in the following verse.
    reason: cross_reference
translation:
  language: ko
  text: 포로스의 아들들 중에서는 타로소토모스가 있고, 이에다마르의 아들들 중에서는 가멜로스가 있으며, 다윗의 아들들 중에서는[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 이름들은 에스라 8:2의 히브리어 평행본문과 상당히 다릅니다. 이 본문은 1 Esdras의 그리스어 전승을 따르므로, 주본문은 히브리어 평행본문에 맞추어 조화시키지 않습니다.
    reason: alternative_reading
  - marker: b
    text: ‘다윗의 아들들 중에서는’이라는 표현은 다음 절에서 명단이 계속되므로, 여기서는 문장이 열린 채로 남습니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  english_pob_choice: from the sons of
  chosen_korean: ~의 아들들 중에서는
  alternatives_korean:
  - ~의 아들들 가운데서
  - ~의 아들들로부터
  lexicon: LSJ
  rationale: 족보·명단 공식의 반복 구조를 한국어에서도 자연스럽게 살리기 위해 ‘~의 아들들 중에서는’을 사용했습니다.
- source_word: Φορός
  english_pob_choice: Phoros
  chosen_korean: 포로스
  alternatives_korean:
  - 파로스
  - 포로시
  lexicon: LSJ
  rationale: 1 Esdras의 그리스어 증거를 따라 히브리어 평행본문의 Parosh로 맞추지 않고, 그리스어 음가에 가깝게 음역했습니다.
- source_word: Ταροσότομος
  english_pob_choice: Tarosotomos
  chosen_korean: 타로소토모스
  alternatives_korean:
  - 다른 평행본문에 맞춘 이름
  - 타로소토모
  lexicon: LSJ
  rationale: 본문의 그리스어 고유명사를 그대로 음역해, 평행본문과 다른 전승을 숨기지 않았습니다.
- source_word: Ἰεταμάρου
  english_pob_choice: Ietamar
  chosen_korean: 이에다마르
  alternatives_korean:
  - 이타마르
  - 이에타마르
  lexicon: LSJ
  rationale: 히브리어 평행본문의 익숙한 이타마르로 정리하지 않고, 그리스어 철자에 더 가까운 형태를 유지했습니다.
- source_word: Γάμηλος
  english_pob_choice: Gamelos
  chosen_korean: 가멜로스
  alternatives_korean:
  - 다니엘
  - 가멜로
  lexicon: LSJ
  rationale: 평행본문의 다니엘과 조화시키지 않고, 그리스어 이름 자체를 보존했습니다.
theological_decisions:
- issue: 평행본문과 다른 고유명사 전승을 어떻게 처리할지
  chosen_reading: 그리스어 본문을 주본문으로 두고, 히브리어 평행본문에 맞추어 이름을 교정하지 않았습니다.
  alternative_readings:
  - 에스라 평행본문에 따라 포로스→파로쉬, 이에다마르→이타마르, 가멜로스→다니엘로 조정
  rationale: 이 책은 1 Esdras의 그리스어 증거를 번역 대상으로 삼으므로, 평행본문 차이는 본문 안에서 지워지기보다 드러나야 합니다.
  doctrine_reference: 본문 비평 원칙과 번역 충실성
