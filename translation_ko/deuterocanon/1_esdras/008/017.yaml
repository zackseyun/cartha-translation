base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/017.yaml
  text: And concerning your holy vessels that are being given for the use of the house of your God in Jerusalem,[a]
  footnotes:
  - marker: a
    text: Greek has 'the temple/sanctuary of your God in Jerusalem'; the rendering 'the house of your God' follows the Semitic parallel and standard biblical idiom for the Jerusalem temple.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 예루살렘에 있는 너의 하나님 집을 위한 용도로 바쳐지고 있는 너의 거룩한 기물들도 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘예루살렘에 있는 너의 하나님 성전/성소’를 뜻합니다. 여기서는 세미틱 평행을 따라 ‘하나님 집’으로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: κατὰ
  english_pob_choice: concerning
  chosen_korean: 그리고 …도 말입니다
  alternatives_korean:
  - …에 관하여
  - …와 관련하여
  lexicon: BDAG
  rationale: 행정적·서신적 맥락에서 주제를 이어 붙이는 용법으로 보고, 한국어에서는 자연스러운 연결어와 종결 완화 표현으로 옮겼습니다.
- source_word: ἱερὰ σκεύη
  english_pob_choice: holy vessels
  chosen_korean: 거룩한 기물
  alternatives_korean:
  - 거룩한 그릇들
  - 성물
  lexicon: BDAG
  rationale: σκεύη는 단순히 ‘그릇’보다 넓은 성전 기구/도구를 포함할 수 있어 ‘기물’이 더 포괄적이며, ἱερὰ의 성별(聖別) 의미를 ‘거룩한’으로 보존했습니다.
- source_word: τὰ διδόμενα
  english_pob_choice: that are being given
  chosen_korean: 바쳐지고 있는
  alternatives_korean:
  - 주어지고 있는
  - 넘겨지고 있는
  lexicon: BDAG
  rationale: 현재 수동 분사의 진행성을 살리면서, 성전용 기구를 공적·종교적으로 인도하는 뉘앙스를 한국어 ‘바쳐지고 있는’으로 담았습니다.
- source_word: τοῦ ἱεροῦ
  english_pob_choice: the house
  chosen_korean: 하나님 집
  alternatives_korean:
  - 성전
  - 성소
  lexicon: BDAG
  rationale: 영어 POB는 히브리어 평행과 관용구를 따라 ‘house’를 취했으므로, 한국어도 ‘하나님 집’으로 옮겨 성전의 성경적 관용을 살렸습니다.
theological_decisions:
- issue: ἱεροῦ의 번역 범주
  chosen_reading: 본문의 ἱερόν을 직접 ‘성전’으로 단정하기보다, 평행 전승을 반영한 ‘하나님 집’으로 옮겼습니다.
  alternative_readings:
  - 성전으로 직역
  - 성소로 완화
  rationale: 그리스어 본문은 ἱερόν이지만, 영어 POB는 세미틱 평행을 근거로 ‘house’를 유지합니다. 한국어도 그 결정을 따라 예루살렘 성전의 관용적 표현을 보존했습니다.
  doctrine_reference: 문자적 일치보다 평행 전승을 반영한 번역 선택
- issue: 직접 화법의 호칭
  chosen_reading: ‘너의 하나님’처럼 2인칭 소유를 그대로 살렸습니다.
  alternative_readings:
  - ‘당신의 하나님’
  - ‘너희 하나님’
  rationale: 문맥이 특정 수신자에게 보내는 행정적 통신문이므로, 원문의 친밀하고 직접적인 2인칭을 유지하는 편이 source-direct합니다.
  doctrine_reference: 수신자 지칭의 문체 보존
