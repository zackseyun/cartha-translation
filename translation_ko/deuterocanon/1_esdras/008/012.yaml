  source_fidelity: 그리스어의 목적절(ὅπως ... ἐπισκέψωνται)은 간접 명령으로 자연스럽게 옮길 수 있습니다. 그러나 현 초안의 ‘주님의 법에 따라 하게 하십시오’는 조사의 행위와 규범의 관계가 다소 불분명하며, 각주 b와 그 전제인 ‘그대의 손 안에 있는’은 제시된 그리스어 본문에 없습니다. ἀκολούθως ᾧ ἔχει νόμῳ Κυρίου의 압축된 표현은 ‘주님의 법에 규정된 대로’로 옮겨 법에 담긴 규정을 기준으로 삼는 뜻을 보존합니다.
