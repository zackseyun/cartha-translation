base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/012.yaml
  text: so that they may inspect Judea and Jerusalem[a], according to the law of the Lord that is in your hand[b],
  footnotes:
  - marker: a
    text: Or 'they may oversee' or 'they may inquire into'; the Greek verb can denote official inspection, visitation, or review.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'in your hand' is supported by the Hebrew parallel in Ezra 7 and likely means 'entrusted to you' or 'in your possession.'
    reason: cross_reference
translation:
  language: ko
  text: 그들이 유다와 예루살렘[a]을 조사하여, 주님의 법[b]에 따라 하게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘감독하게 하라’, ‘살펴보게 하라’; ἐπισκέψωνται는 공식적 조사, 방문, 점검의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그대의 손 안에 있는’이라는 뜻은 에스라 7장의 히브리어 평행본문에 의해 뒷받침되며, ‘그대에게 맡겨진’ 또는 ‘그대가 소지한’이라는 뉘앙스를 가질 수 있습니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισκέψωνται
  english_pob_choice: they may inspect
  chosen_korean: 조사하여
  alternatives_korean:
  - 살피게 하여
  - 감독하게 하여
  - 방문하여 살피게 하여
  lexicon: LSJ
  rationale: 왕의 공문맥에서 공식적인 검열·점검의 뉘앙스를 살려, 단순한 ‘방문’보다 행정적 확인을 드러내는 ‘조사하다’를 택했습니다.
- source_word: κατὰ τὴν Ἰουδαίαν καὶ κατὰ Ἰερουσαλήμ
  english_pob_choice: Judea and Jerusalem
  chosen_korean: 유다와 예루살렘
  alternatives_korean:
  - 유다와 예루살렘에서
  - 유다와 예루살렘 전역을
  - 유다와 예루살렘에
  lexicon: LSJ
  rationale: 반복된 κατά+대격은 대상/관할 영역을 가리키므로, 한국어에서는 자연스럽게 지명만 제시해 조사 대상 지역을 드러냈습니다.
- source_word: νόμῳ Κυρίου
  english_pob_choice: the law of the Lord
  chosen_korean: 주님의 법
  alternatives_korean:
  - 주님의 율법
  - 주님의 법도
  - 주님의 토라
  lexicon: LSJ
  rationale: 율법적 의미가 분명하지만, 한국어에서 ‘법’이 더 넓은 기준·규범의 뉘앙스를 함께 담아 문맥상 간결하고 자연스럽습니다.
- source_word: Κυρίου
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주인
  lexicon: 'DOCTRINE.md Contested terms: κύριος → Lord'
  rationale: 유대교 경전적 문맥의 κύριος를 프로젝트 기본에 따라 ‘주님’으로 옮겼습니다.
theological_decisions:
- issue: 공문 명령형의 한국어 표현
  chosen_reading: «그들이 … 하게 하십시오»라는 간접 명령으로 옮김
  alternative_readings:
  - 직접명령형으로 옮김
  - «… 하십시오» 없이 평서로 옮김
  rationale: 왕의 지시문이라는 장르를 살리면서도 현대 한국어 합쇼체를 유지하기 위해 간접 명령을 사용했습니다.
  doctrine_reference: 'Korean style guide: modern formal-polite imperative in quotation-free narration'
- issue: 주님의 법의 규범성
  chosen_reading: νόμῳ를 ‘법’으로 옮기고 ‘주님의 법’으로 구체화함
  alternative_readings:
  - ‘율법’으로 옮김
  - ‘법도’로 완화함
  rationale: 원문의 규범적 기준을 유지하면서, ‘율법’보다 덜 종교어적인 ‘법’이 이 문맥의 행정적·실무적 성격을 더 잘 드러냅니다.
  doctrine_reference: Lexical theology of νόμος in contextual legal usage
