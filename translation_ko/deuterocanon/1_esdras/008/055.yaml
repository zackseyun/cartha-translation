base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/055.yaml
  text: And I set apart twelve men from the leaders of the priests[a], and Eserebias and Asoamias[c][b],
  footnotes:
  - marker: a
    text: Eserebias likely corresponds to the Hebrew name Sherebiah in the parallel text.
    reason: alternative_reading
  - marker: b
    text: Asoamias likely corresponds to the Hebrew name Hashabiah in the parallel text.
    reason: alternative_reading
  - marker: c
    text: The Greek text here is shorter than the Hebrew parallel in Ezra 8:24, which continues with additional names and the weighing out of the silver, gold, and vessels.
    reason: cross_reference
translation:
  language: ko
  text: 그리고 나는 제사장들의 지도자들 가운데서 열두 사람과 에세레비아와 아소아미아를 따로 세웠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 형태는 히브리어 병행본문의 ‘세레뱌’와 대응되는 것으로 보입니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어 형태는 히브리어 병행본문의 ‘하사뱌’와 대응되는 것으로 보입니다.
    reason: alternative_reading
  - marker: c
    text: 이 그리스어 본문은 에스라 8:24의 히브리어 병행본문보다 짧으며, 그곳에는 은, 금, 기명에 관한 추가 내용이 이어집니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἐχώρισα
