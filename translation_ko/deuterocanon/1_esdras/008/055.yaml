translation:
  language: ko
  text: 그리고 나는 제사장 지도자들 가운데서 남자 열두 명을 따로 뽑고, 에세레비아스와 아소아미아스도 뽑았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
