    text: 에세레비아스라는 그리스어 이름은 히브리어 병행본문의 ‘스레뱌’에 대응하는 것으로 보입니다.
    reason: alternative_reading
  - marker: b
    text: 아소아미아스라는 그리스어 이름은 히브리어 병행본문의 ‘하사뱌’에 대응하는 것으로 보입니다.
    reason: alternative_reading
  - marker: c
    text: 이 그리스어 본문은 에스라 8:24의 히브리어 병행본문보다 짧습니다. 그 병행본문에는 추가 이름들과 은, 금, 기명을 달아 주는 내용이 이어집니다.
    reason: cross_reference
