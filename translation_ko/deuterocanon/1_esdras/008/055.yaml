  source_fidelity: 그리스어는 제사장 지도자들 가운데서 남자 열두 명을 따로 구별하고, 이어 에세레비아스와 아소아미아스를 언급합니다. 초안의 핵심 의미는 대체로 맞지만, 이름의 그리스어 음역에서 어말 -스가 빠졌고, ‘열두 사람과 …를’이라는 구조는 두 이름까지 ‘제사장 지도자들 가운데서’에 직접 묶이는 듯 읽힐 수 있습니다.
  naturalness: ‘따로 세웠습니다’는 자연스럽지만, ἐχώρισα의 선별·구별 의미에는 ‘따로 뽑았습니다’가 더 직접적입니다. 두 이름을 별도 병렬 항목으로 처리하면 한국어 문장 구조도 더 명료합니다.
