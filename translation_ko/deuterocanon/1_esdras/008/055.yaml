  - 제사장 가운데 지도자들
  - 제사장들의 족장들
  lexicon: LSJ
  rationale: 직역하면 ‘제사장들 가운데의 지도자들’이지만, 한국어에서는 관계를 압축해도 의미가 분명하므로 ‘제사장들의 지도자들’로 옮겼습니다.
- source_word: ἄνδρας δέκα δύο
  english_pob_choice: twelve men
  chosen_korean: 열두 사람
  alternatives_korean:
  - 열두 남자
  - 열두 명의 남자
  - 열두 사람들
  lexicon: BDAG
  rationale: ἄνδρας는 남성 복수이지만 한국어에서는 대표 선발을 말할 때 ‘사람’이 더 자연스러워, 성별 정보는 문맥상 유지하면서 읽기 쉽게 했습니다.
- source_word: Ἐσερεβίαν / Ἀσοαμίαν
  english_pob_choice: Eserebias / Asoamias
  chosen_korean: 에세레비아와 아소아미아
  alternatives_korean:
  - 에세레비아스와 아소아미아스
  - 세레비야와 하사비야
  - 에세레비야와 아소아미야
  lexicon: transliteration
  rationale: 1 Esdras의 주된 증거인 그리스어 형태를 따라 음역했고, 히브리어 병행본문과의 대응은 각주로 처리하는 편이 본문 충실성에 맞습니다.
