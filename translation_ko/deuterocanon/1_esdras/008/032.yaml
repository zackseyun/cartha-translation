- from: 사속스의 아들들 가운데서는 예에코니야스, 예델의 아들로서 그와 함께한 남자 이백 명이 있었고, 아딘의 아들들 가운데서는 오베스, 요나단의 아들로서 그와 함께한 남자 이백오십 명이 있었습니다.[a][b]
  to: 자토에스의 아들들 가운데서는 예텔의 아들 이에코니아스와 그와 함께한 남자 이백 명이 있었고,[a] 아딘의 아들들 가운데서는 요나단의 아들 우벤과 그와 함께한 남자 이백오십 명이 있었습니다.[b]
  rationale: 그리스어 본문을 우선하여 고유명사의 자음과 어말을 바로잡았습니다. 특히 Οὐβὴν을 영어 감사 기록의 추정적 ‘Obeth’ 형태에 맞추어 ‘오베스’로 옮기지 않고, 제시된 그리스어 철자에 가까운 ‘우벤’으로 수정했습니다. 명단의 부계 관계, 동반 인원, 수량 및 원문의 반복적 구조는 유지했습니다.
