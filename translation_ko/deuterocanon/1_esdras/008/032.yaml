base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/032.yaml
  text: 'From the sons of Zathoes: Eiechonias son of Jethel[a], and with him two hundred men; from the sons of Adin: Obeth son of Jonathan[b], and with him two hundred fifty men.'
  footnotes:
  - marker: a
    text: The Greek family name is transliterated as Zathoes from the primary 1 Esdras witness; the approximate MT parallel has a different name form.
    reason: alternative_reading
  - marker: b
    text: The personal name rendered Obeth reflects an uncertain Greek form (Οὐβὴν); a more literal transliteration such as Uben/Oben is also possible.
    reason: lexical_alternative
translation:
  language: ko
  text: 자토에스의 아들들 가운데서는 예텔의 아들 이에코니아스와 그와 함께한 남자 이백 명이 있었고,[a] 아딘의 아들들 가운데서는 요나단의 아들 우벤과 그와 함께한 남자 이백오십 명이 있었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자토에스’는 그리스어 본문의 족명 Ζαθόης를 음역한 것입니다. MT의 대략적인 평행 본문에는 다른 이름 형태가 나옵니다.
    reason: textual_variant
  - marker: b
    text: 그리스어 Οὐβὴν의 음역은 확정되지 않았습니다. ‘오벤’으로도 옮길 수 있습니다.
    reason: lexical_alternative
