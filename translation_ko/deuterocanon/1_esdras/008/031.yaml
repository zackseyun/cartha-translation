  text: From the sons of Pahath-moab[a], Eliaonias son of Zareou, and with him two hundred men;
  footnotes:
  - marker: a
    text: The Greek reads 'Eliaonias son of Zareou'; the Hebrew parallel in Ezra 8:4 has 'Elihoenai son of Zerahiah.'
