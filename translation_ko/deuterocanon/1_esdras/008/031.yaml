revisions:
- from: 파핫모압의 자손 가운데서, 엘리아오니아스 곧 자레오의 아들, 그리고 그와 함께한 사람 이백 명이었습니다.[a]
  to: 파핫모압의 자손 가운데서는 자레오의 아들 엘리아오니아스와 그와 함께한 남자 이백 명이었습니다.[a]
  rationale: 그리스어 본문을 우선하여 그리스어계 인명 표기를 본문에 유지했습니다. 속격으로 제시된 자레오와 엘리아오니아스의 계보 관계는 명단 문맥에 따라 자연스럽게 번역하되, 원문의 표면형과 히브리어 평행본문의 다른 이름형은 각주에서 구별해 밝혔습니다. 또한 ἄνδρες의 성별 의미를 ‘남자’로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:04:02Z'
review_pass:
  verdict: revise
  source_fidelity: 그리스어의 집단명과 두 인명은 대체로 충실히 반영했습니다. 다만 ἄνδρες는 이 명단 문맥에서 ‘사람’보다 ‘남자’로 옮기는 편이 직접적입니다. 또한 자레오의 속격은 계보 관계로 이해할 수 있으나, 본문에 명시되지 않은 설명적 연결어 ‘곧’은 불필요합니다.
  naturalness: 현 번역은 의미가 통하지만 ‘엘리아오니아스 곧 자레오의 아들, 그리고’는 명단 문체로 다소 부자연스럽습니다. ‘자레오의 아들 엘리아오니아스와 그와 함께한 남자 이백 명’으로 정리하면 자연스럽고 원문의 열거 구조도 유지됩니다.
  terminology: 파핫모압, 엘리아오니아스, 자레오는 그리스어 우선 원칙에 맞습니다. 각주의 히브리어 평행본문 이름 ‘스레야’는 제공된 히브리어 זְרַחְיָה 및 영어 감사 기록의 Zerahiah에 맞게 ‘스라히야’로 바로잡아야 합니다.
  issues:
  - severity: medium
    issue: ἄνδρες를 ‘사람’으로 번역함
    rationale: 그리스어 ἄνδρες는 여기서 ‘남자들’을 뜻합니다. 히브리어 평행본문의 ‘남성들’과도 부합하므로 ‘남자 이백 명’이 더 충실합니다.
  - severity: low
    issue: 본문의 ‘곧’과 ‘그리고’가 열거 구조를 흐림
    rationale: 그리스어는 이름과 동반 인원을 간결하게 이어 줍니다. ‘곧’은 원문에 없는 해설적 첨가이며, ‘와’로 연결하는 편이 자연스럽습니다.
  - severity: medium
    issue: 각주의 히브리어 이름 ‘스레야’가 평행본문 및 영어 감사 기록의 Zerahiah와 맞지 않음
    rationale: 제시된 히브리어 זְרַחְיָה는 통상 ‘스라히야’(Zerahiah)로 옮기는 것이 적절합니다. 또한 그리스어는 ‘아들’이라는 단어를 명시하지 않고 자레오를 속격으로 둔다는 점을 각주에서 정확히 밝혀야 합니다.
