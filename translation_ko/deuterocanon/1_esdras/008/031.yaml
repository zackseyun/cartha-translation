translation:
  language: ko
  text: 파핫모압의 자손 가운데서, 엘리아오니아스 곧 자레오의 아들, 그리고 그와 함께한 사람 이백 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 ‘엘리아오니아스 자레오의 아들’로 읽지만, 히브리어 평행본문(스 8:4)은 ‘엘리호에나이 스레야의 아들’로 전합니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν Μααθμωάβ
  english_pob_choice: From the sons of Pahath-moab
  chosen_korean: 파핫모압의 자손 가운데서
  alternatives_korean:
  - 파핫모압의 아들들 가운데서
  - 파핫모압에서
  lexicon: LSJ
  rationale: Greek의 clan 표지를 한국어로 자연스럽게 살리기 위해 ‘~의 자손 가운데서’로 옮겼습니다. MT 평행본문의 ‘Pahath-moab’과도 맞닿는 집단명으로 읽히므로 단순 지명처럼 처리하지 않았습니다.
- source_word: Ἐλιαλωνίας
  english_pob_choice: Eliaonias
  chosen_korean: 엘리아오니아스
  alternatives_korean:
  - 엘리아로니아스
  - 엘리호에나이
  lexicon: LSJ
  rationale: 주 본문은 그리스어 증거에 붙어 있으므로 그리스어 기반 음역을 유지했습니다. 히브리어 평행본문의 이름형은 각주로만 보조적으로 확인할 수 있습니다.
- source_word: Ζαραιου
  english_pob_choice: son of Zareou
  chosen_korean: 자레오의 아들
  alternatives_korean:
  - 자라이우의 아들
  - 스레야의 아들
  lexicon: LSJ
  rationale: γενική의 소유/계보 관계를 한국어의 ‘~의 아들’로 직접 반영했습니다. 본문의 그리스어 이름형을 그대로 따라가되, 히브리어 대응형으로 바꾸지는 않았습니다.
- source_word: ἄνδρες διακόσιοι
  english_pob_choice: two hundred men
  chosen_korean: 사람 이백 명
  alternatives_korean:
  - 남자 이백 명
  - 이백 명의 남자
  lexicon: BDAG
  rationale: διακόσιοι와 결합한 ἄνδρες를 인원 집계 표현으로 자연스럽게 옮기기 위해 ‘사람 이백 명’으로 다듬었습니다. 문맥상 성별 강조보다 수효 보고가 중심입니다.
theological_decisions:
- issue: 고유명사 표기에서 그리스어 본문과 히브리어 평행본문의 관계
  chosen_reading: 본문에는 그리스어 음역을 유지하고, 히브리어 평행본문과의 대응은 각주로만 처리합니다.
  alternative_readings:
  - 히브리어 평행본문형인 ‘엘리호에나이, 스레야’로 본문을 교체
  - 혼합형 표기
  rationale: 1 Esdras는 그리스어 증거가 직접 본문이며, 평행 히브리어는 보정용 증거입니다. 따라서 본문 번역은 그리스어를 우선하되 독자가 대응 관계를 추적할 수 있게 해야 합니다.
  doctrine_reference: 본문비평 원칙 / 정경 간 평행본문 처리
