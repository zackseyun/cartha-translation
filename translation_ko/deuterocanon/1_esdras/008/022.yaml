base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/022.yaml
  text: And it is also declared to you that no tax or other burden is to be imposed on any of the priests[a], Levites, temple singers, gatekeepers, temple servants, or workers of this temple[b], and that no one is to have authority to impose it on them.
  footnotes:
  - marker: a
    text: Or 'other burden' or 'other imposition.' The Greek term can denote an additional imposed obligation; the fiscal context favors 'levy.'
    reason: lexical_alternative
  - marker: b
    text: '''Workers of this temple'' renders a term for those occupied with the temple''s affairs or business; ''officials'' is also possible but may sound too narrow.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너희에게도 알려집니다. 곧 이 성전의 제사장들, 레위 사람들, 성가대원들, 문지기들, 성전 종들, 그리고 이 성전의 일꾼들[a] 가운데 누구에게도 세금이나 다른 부담[b]이 부과되지 않을 것이며, 아무도 그들에게 그것을 부과할 권한을 가져서는 안 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘이 성전의 일을 맡은 사람들’에 가깝습니다. 영어 POB의 ‘workers of this temple’은 관직명보다 업무 종사자를 넓게 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 ἄλλη ἐπιβουλή는 여기서 세금과 함께 금지되는 추가적 부과·부담을 가리키므로, ‘다른 부담’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγεται
  english_pob_choice: it is also declared
  chosen_korean: 알려집니다
  alternatives_korean:
  - 선언됩니다
  - 선포됩니다
  - 말해집니다
  lexicon: BDAG
  rationale: 왕의 칙령 문맥에서 수동형 λέγεται는 단순한 ‘말해짐’보다 공식 통보의 뉘앙스가 강하므로, 한국어에서는 행정적이고 자연스러운 ‘알려집니다’로 옮겼습니다.
- source_word: ἱεροψάλταις
  english_pob_choice: temple singers
  chosen_korean: 성가대원들
  alternatives_korean:
  - 성전 노래하는 이들
  - 성전 찬양대원들
  - 성가대
  lexicon: LSJ
  rationale: 직역하면 ‘성전 노래하는 이들’이지만, 한국어에서 직무를 맡은 사람들을 자연스럽게 가리키는 표현으로 ‘성가대원들’을 택하되, 제의적 맥락은 앞의 ‘성전’으로 보존했습니다.
- source_word: θυρωροῖς
  english_pob_choice: gatekeepers
  chosen_korean: 문지기들
  alternatives_korean:
  - 문지기
  - 출입문 관리인들
  - 문을 지키는 이들
  lexicon: LSJ
  rationale: 성전 출입을 지키는 직무를 가장 직접적으로 드러내는 표준어 표현으로 ‘문지기들’이 적절합니다.
- source_word: ἱεροδούλοις
  english_pob_choice: temple servants
  chosen_korean: 성전 종들
  alternatives_korean:
  - 성전 시종들
  - 성전 종복들
  - 성전 노예들
  lexicon: LSJ
  rationale: 이 단어는 성전과 관련된 하급 봉사자들을 가리키며, 영어 POB처럼 꼭 ‘slave’로 고정하지 않고도 한국어에서 봉사 신분을 드러내는 ‘성전 종들’이 본문 목록의 균형을 살립니다.
- source_word: πραγματικοῖς τοῦ ἱεροῦ
  english_pob_choice: workers of this temple
  chosen_korean: 이 성전의 일꾼들
  alternatives_korean:
  - 이 성전의 업무 담당자들
  - 이 성전의 사무 담당자들
  - 이 성전의 관리인들
  lexicon: LSJ
  rationale: πραγματικός는 ‘일/업무를 맡은’ 쪽의 뜻이 강하므로, 과도하게 관료화하지 않으면서도 실제로 일하는 사람들을 드러내는 ‘일꾼들’이 가장 무난합니다.
- source_word: φορολογία / ἐπιβουλή
  english_pob_choice: tax or other burden
  chosen_korean: 세금이나 다른 부담
  alternatives_korean:
  - 세금이나 다른 부과
  - 세금이나 다른 징수
  - 세금이나 다른 짐
  lexicon: LSJ
  rationale: φορολογία는 세금·조세 부담이고, ἄλλη ἐπιβουλή는 이 문맥에서 추가로 지워지는 부과/부담을 뜻하므로, 영어 POB의 ‘burden’에 맞춰 한국어에서도 ‘다른 부담’으로 넓게 옮겼습니다.
- source_word: ἐξουσίαν ἐπιβαλεῖν τούτοις
  english_pob_choice: have authority to impose it on them
  chosen_korean: 그들에게 그것을 부과할 권한을 가져서는 안 됩니다
  alternatives_korean:
  - 그들에게 그것을 얹을 권한을 가져서는 안 됩니다
  - 그들에게 이것을 강제할 권한을 가져서는 안 됩니다
  - 그들 위에 그것을 지울 권한을 가져서는 안 됩니다
  lexicon: BDAG
  rationale: ἐξουσίαν ἐπιβαλεῖν은 법적 권한으로 어떤 부담을 얹는 뜻이므로, 행정 문맥에 맞는 ‘부과할 권한’이 가장 분명합니다.
theological_decisions:
- issue: 성전 직무자 목록의 번역에서 ‘노예’로 과잉 지정할지 여부
  chosen_reading: ἱεροδούλοις는 ‘성전 종들’로 번역해, 봉사 신분은 드러내되 본문이 명시하지 않은 강한 사회법적 뉘앙스는 절제했습니다.
  alternative_readings:
  - 성전 노예들
  - 성전 종복들
  rationale: 이 절은 제의 인력 목록과 세금 면제 조항이 핵심이므로, 본문이 요구하는 범위를 넘지 않으면서도 하위 봉사자라는 사실은 유지하는 번역이 적절합니다.
  doctrine_reference: source-sensitive lexical restraint
