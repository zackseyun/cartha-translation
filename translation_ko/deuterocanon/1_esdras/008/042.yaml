  source_fidelity: 개정이 필요합니다. συναγαγών은 남성 단수 능동 분사이므로, 뒤의 복수 동사 ‘우리는 진을 쳤습니다’와 구별되는 화자 개인의 선행 행위를 나타냅니다. 초안의 ‘그들을 … 모은 뒤, 우리는’은 분사 주어를 복수로 읽히게 할 수 있어 이 단수성을 충분히 드러내지 못합니다. ‘내가’를 보완하여 원문의 단수-복수-단수 전환을 보존했습니다.
  naturalness: ‘내가 … 모은 뒤, 우리는 그곳에서 사흘 동안 진을 쳤으며, 나는 그들을 살펴보았습니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 이동·숙영 서사의 문체에도 적절합니다. ‘그곳에서’는 αὐτόθι를 명료하게 반영합니다.
