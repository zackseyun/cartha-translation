  yaml_path: translation/deuterocanon/1_esdras/008/042.yaml
  text: And after gathering them to the river called the River[a], we camped there for three days[b], and I examined them.
  footnotes:
  - marker: a
    text: Greek literally, 'to the river called the River.' The wording likely preserves a place-name designation rather than a generic description.
    reason: lexical_alternative
  - marker: b
    text: The Greek text shifts from 'we camped' to 'I inspected them.' Some translations smooth this to a consistent person, but the source text distinguishes the group's action from Ezra's personal review.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 내가 그들을 ‘강’이라고 불리는 강[a]으로 모은 뒤, 우리는 그곳에서 사흘 동안 진을 쳤으며, 나는 그들을 살펴보았습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자 그대로 ‘강이라고 불리는 강’입니다. 이 표현은 단순 설명이 아니라 지명일 가능성을 보존합니다.
    reason: lexical_alternative
  - marker: b
    text: 본문은 ‘내가 그들을 모은 뒤’에서 ‘우리는 진을 쳤다’로, 이어 ‘나는 살펴보았다’로 인칭과 수가 바뀝니다. 한국어에서 이를 매끈하게 하나로 맞추기보다 원문의 구분을 살렸습니다.
    reason: alternative_reading
