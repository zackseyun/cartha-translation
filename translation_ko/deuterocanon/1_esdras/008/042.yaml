base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/042.yaml
  text: And after gathering them to the river called the River[a], we camped there for three days[b], and I examined them.
  footnotes:
  - marker: a
    text: Greek literally, 'to the river called the River.' The wording likely preserves a place-name designation rather than a generic description.
    reason: lexical_alternative
  - marker: b
    text: The Greek text shifts from 'we camped' to 'I inspected them.' Some translations smooth this to a consistent person, but the source text distinguishes the group's action from Ezra's personal review.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그들을 ‘강’이라고 불리는 강으로 모은 뒤, 우리는 거기서 사흘 동안 진을 쳤으며, 나는 그들을 살펴보았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자 그대로 ‘강이라고 불리는 강’입니다. 이 표현은 단순 설명이 아니라 지명일 가능성을 보존합니다.
    reason: lexical_alternative
  - marker: b
    text: 본문은 ‘우리는 진을 쳤다’에서 ‘나는 살펴보았다’로 인칭이 바뀝니다. 한국어에서 이를 매끈하게 하나로 맞추기보다 원문의 구분을 살렸습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: συναγαγὼν αὐτοὺς
  english_pob_choice: after gathering them
  chosen_korean: 그들을 모은 뒤
  alternatives_korean:
  - 그들을 모으고 나서
  - 그들을 집결시킨 뒤
  lexicon: LSJ
  rationale: aorist 분사로서 앞선 동작을 나타내므로, 자연스러운 한국어 시간 순서를 살려 ‘-한 뒤’로 옮겼습니다.
- source_word: ἐπὶ τὸν λεγόμενον Ποταμόν
  english_pob_choice: to the river called the River
  chosen_korean: ‘강’이라고 불리는 강으로
  alternatives_korean:
  - ‘강’이라고 불리는 곳으로
  - ‘강’이라 불리는 강으로
  lexicon: LSJ
  rationale: λεγόμενον은 ‘불리는/이름 붙은’의 뜻이고, Ποταμός가 문자 그대로 ‘강’이므로 중복된 표현을 유지해 지명적 용법을 드러냈습니다.
- source_word: παρενεβάλομεν
  english_pob_choice: we camped
  chosen_korean: 우리는 거기서 … 진을 쳤으며
  alternatives_korean:
  - 우리는 거기서 … 야영했으며
  - 우리는 거기서 … 숙영했으며
  lexicon: LSJ
  rationale: 군사적·이동 서사에서 흔한 ‘진을 치다’가 가장 자연스럽고, 문맥의 집단 이동/숙영 뉘앙스를 잘 살립니다.
- source_word: κατέμαθον αὐτούς
  english_pob_choice: I examined them
  chosen_korean: 나는 그들을 살펴보았습니다
  alternatives_korean:
  - 나는 그들을 검토해 보았습니다
  - 나는 그들을 조사했습니다
  lexicon: LSJ
  rationale: 이 동사는 단순한 ‘알게 되다’보다 대상을 자세히 확인하고 점검하는 뜻이 강하므로, 맥락상 무난한 ‘살펴보다’로 옮겼습니다.
theological_decisions:
- issue: 1인칭 복수와 단수의 전환
  chosen_reading: ‘우리는 … 진을 쳤으며, 나는 … 살펴보았습니다’로 원문의 인칭 전환을 그대로 유지했습니다.
  alternative_readings:
  - ‘우리는 … 진을 쳤으며, 우리는 … 살펴보았습니다’로 평준화함
  - ‘내가 … 진을 치고 … 살펴보았습니다’로 통일함
  rationale: 본문은 공동 행위와 에스라의 개인적 확인을 구분하는 형태이므로, 매끄럽게 통일하기보다 원문이 드러내는 긴장을 보존했습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
