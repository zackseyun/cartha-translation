base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/089.yaml
  text: And while Ezra was praying and making confession[a], weeping as he lay prostrate before the temple[b], a very great crowd gathered to him from Jerusalem—men and women and young men—for there was great weeping among the multitude.
  footnotes:
  - marker: a
    text: Or 'was giving thanks'; the Greek verb can bear either sense, but here the penitential context favors 'making confession.'
    reason: lexical_alternative
  - marker: b
    text: Greek 'young men'; the term is masculine, not a gender-neutral word for youths in general.
    reason: lexical_alternative
translation:
  language: ko
  text: 예스라가 성전 앞에 엎드려 울며 기도하고 죄를 자백하고 있을 때, 예루살렘에서 매우 큰 무리가 그에게 모여들었습니다—남자들과 여자들과 젊은 남자들이었습니다. 그 무리 가운데 큰 통곡이 있었기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 동사는 어떤 문맥에서는 ‘감사하다’도 뜻할 수 있으나, 여기서는 회개의 맥락이 더 강하므로 ‘죄를 자백하다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘젊은 남자들’은 남성형 그리스어 νεανίαι를 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσευχόμενος
  english_pob_choice: was praying
  chosen_korean: 기도하고
  alternatives_korean:
  - 기도하며
  - 기도하는 중에
  lexicon: BDAG
  rationale: 분사로 이어지는 연속 동작을 자연스럽게 살리되, 한국어에서는 보조적 연결로 간결하게 처리했습니다.
- source_word: ἀνθωμολογεῖτο
  english_pob_choice: was making confession
  chosen_korean: 죄를 자백하고
  alternatives_korean:
  - 고백하고
  - 감사하고
  lexicon: LSJ
  rationale: 회개 맥락에서 이 동사는 단순한 감사보다 죄의 자백을 드러내는 것이 더 적절하므로, 그 의미를 분명히 했습니다.
- source_word: χαμαιπετής
  english_pob_choice: as he lay prostrate
  chosen_korean: 엎드려
  alternatives_korean:
  - 땅에 엎드려
  - 엎드러져
  lexicon: LSJ
  rationale: 낮고 굴복된 자세를 간결하게 살리기 위해 ‘엎드려’를 택했습니다.
- source_word: νεανίαι
  english_pob_choice: young men
  chosen_korean: 젊은 남자들
  alternatives_korean:
  - 청년들
  - 젊은이들
  lexicon: LSJ
  rationale: 그리스어가 남성형을 분명히 쓰므로, 성별을 중화하지 않고 남성 집단으로 옮겼습니다.
- source_word: κλαυθμὸς γὰρ ἦν μέγας ἐν τῷ πλήθει
  english_pob_choice: for there was great weeping among the multitude
  chosen_korean: 그 무리 가운데 큰 통곡이 있었기 때문입니다
  alternatives_korean:
  - 무리 가운데 큰 울음이 있었기 때문입니다
  - 무리가 크게 통곡하고 있었기 때문입니다
  lexicon: BDAG
  rationale: 명사의 울림을 살리면서도 한국어 문장 흐름에 맞게 ‘통곡’으로 옮겨 집단적 애도 분위기를 드러냈습니다.
theological_decisions:
- issue: ἀνθωμολογεῖτο의 회개적 성격
  chosen_reading: ‘죄를 자백하고’로 번역하여 회개·참회 맥락을 분명히 함
  alternative_readings:
  - ‘감사하고’로 번역
  - ‘고백하고’로만 번역
  rationale: 기도, 눈물, 엎드림과 함께 놓인 문맥은 감사보다 죄의 고백을 가리키므로, 독자가 본문 의도를 즉시 이해하도록 했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
- issue: νεανίαι의 성별 표지
  chosen_reading: ‘젊은 남자들’
  alternative_readings:
  - ‘청년들’
  - ‘젊은이들’
  rationale: 본문이 남성 복수형을 사용하므로, 이를 성중립적으로 완화하지 않고 그대로 반영했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
