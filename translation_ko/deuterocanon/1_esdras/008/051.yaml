base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/051.yaml
  text: to seek from him a prosperous journey for us and for our children and livestock[a].
  footnotes:
  - marker: a
    text: Or 'a good journey,' 'success on the way,' or 'a safe journey.' The Greek εὐοδίαν refers to favorable progress in travel; the Hebrew parallel context also speaks of help from enemies on the road.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분께 우리와 우리 자녀들과 가축을 위하여 순조로운 여행을 구하려는 것이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘좋은 여행’, ‘길에서의 형통’, ‘안전한 여행’으로도 옮길 수 있습니다. 그리스어 εὐοδία는 여행에서 순조롭고 형통하게 나아감을 가리킵니다. 히브리어 평행 문맥도 길에서 대적을 만날 때 받을 도움을 언급합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητῆσαι
  english_pob_choice: to seek
  chosen_korean: 구하려는 것이었습니다
  alternatives_korean:
  - 요청하려는 것이었습니다
  - 청하려는 것이었습니다
  lexicon: LSJ
  rationale: 부정사 ζητῆσαι의 ‘seek/ask for’ 의미를 살려, 하나님께 청원하는 행위를 자연스러운 한국어 동사구로 옮겼습니다.
- source_word: παρʼ αὐτοῦ
  english_pob_choice: from him
  chosen_korean: 그분에게서
  alternatives_korean:
  - 그분 앞에서
  - 그분께로부터
  lexicon: LSJ
  rationale: παρά + 속격의 출처 표지를 살려 ‘~에게서’로 옮기고, 하나님을 가리키는 문맥에 맞게 ‘그분’으로 처리했습니다.
- source_word: εὐοδίαν
  english_pob_choice: a prosperous journey
  chosen_korean: 복된 길
  alternatives_korean:
  - 형통한 여행
  - 안전한 길
  - 좋은 길
  lexicon: LSJ
  rationale: 여행 중의 ‘순조로운 진행’과 ‘하나님의 은혜로 인한 형통’을 함께 담기 위해 직역보다 넓은 ‘복된 길’을 선택했습니다.
- source_word: ἡμῖν τε καὶ τοῖς τέκνοις ἡμῶν καὶ κτήνεσιν
  english_pob_choice: for us and for our children and livestock
  chosen_korean: 우리와 우리 자녀들과 가축을 위한
  alternatives_korean:
  - 우리와 우리 아이들과 가축을 위한
  - 우리와 우리 자녀들과 가축에게
  lexicon: LSJ
  rationale: τέκνοις는 성별을 제한하지 않는 ‘자녀들’이 적절하고, κτήνεσιν은 가축/집짐승을 가리키므로 현대 한국어의 자연스러운 ‘가축’으로 옮겼습니다.
theological_decisions:
- issue: εὐοδίαν의 여행 축복 뉘앙스
  chosen_reading: ‘복된 길’로 옮겨 안전과 형통을 모두 함축했습니다.
  alternative_readings:
  - ‘안전한 여행’으로 좁히는 해석
  - ‘형통한 여행’으로만 옮기는 해석
  rationale: 본문은 단순한 물리적 안전보다 길 위에서의 순조롭고 복된 진행을 말하므로, 한국어에서도 그 폭을 보존했습니다.
  doctrine_reference: '원문 우선 원칙: 번역 전통이 아니라 본문이 드러내는 의미 범위를 보존'
