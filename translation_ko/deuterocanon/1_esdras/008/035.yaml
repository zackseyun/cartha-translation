base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/035.yaml
  text: 'From the sons of Joab: Abadias son of Iezelus[a], and with him two hundred twelve men.'
  footnotes:
  - marker: a
    text: The Hebrew parallel in Ezra 8:12 reads differently here, naming a descendant of Elam and numbering seventy males. Because 1 Esdras is translated from the Greek witness, this draft follows the Greek text rather than harmonizing to the Hebrew parallel.
    reason: textual_variant
translation:
  language: ko
  text: 요압 자손 가운데서는 이에젤루스의 아들 아바디아와, 그와 함께한 남자 이백십이 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 평행본문인 에스라 8:12는 이 부분을 다르게 전하여, 엘람의 자손인 아달랴의 아들 이사야와 그와 함께한 남자 일흔 명을 말합니다. 제1 에스드라는 그리스어 증언을 번역하므로, 이 번역은 히브리어 평행본문과 조화시키지 않고 그리스어 본문을 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν Ἰωάβ
  english_pob_choice: From the sons of Joab
  chosen_korean: 요압의 자손들 가운데서는
  alternatives_korean:
  - 요압의 아들들 가운데서는
  - 요압의 집안에서
  lexicon: LSJ
  rationale: 유대 족보·명단 문맥에서 υἱῶν은 직역상 ‘아들들’이지만, 혈연 집단 전체를 가리킬 수 있으므로 자연스러운 한국어로는 ‘자손들’이 적절합니다. 전치사 ἐκ는 명단 항목을 여는 용법을 살려 ‘가운데서는’으로 옮겼습니다.
- source_word: Ἀβαδίας
  english_pob_choice: Abadias
  chosen_korean: 아바디아
  alternatives_korean:
  - 오바댜
  lexicon: LSJ
  rationale: 그리스어 본문에 있는 인명 형태를 직접 음역했습니다. 히브리어 대응형으로 보이는 ‘오바댜’는 이 절의 직접 원문 형태가 아니므로 본문에서는 쓰지 않았습니다.
- source_word: Ἰεζήλου
  english_pob_choice: Iezelus
  chosen_korean: 이예젤루스
  alternatives_korean:
  - 이에젤루스
  - 예젤루스
  - 이제일
  lexicon: LSJ
  rationale: 1 Esdras의 그리스어 증언에 따라 그리스어형 인명을 음역했습니다. 마소라 본문 대응형과 맞추어 순화하지 않고, POB 영어안의 로마자형을 한국어 음역으로 반영했습니다.
- source_word: ἄνδρες
  english_pob_choice: men
  chosen_korean: 사람
  alternatives_korean:
  - 남자
  - 남성
  - 사람들
  lexicon: LSJ
  rationale: ἀνδρες는 문자적으로는 ‘남자들’이지만, 명단 맥락에서는 수를 세는 구성원 전체를 가리키므로 한국어에서는 성별을 과도하게 드러내지 않는 ‘사람’이 가장 자연스럽습니다.
- source_word: διακόσιοι δέκα δύο
  english_pob_choice: two hundred twelve
  chosen_korean: 이백십이 명
  alternatives_korean:
  - 이백열두 명
  - 212명
  lexicon: LSJ
  rationale: 그리스어 수사에 따라 수량을 현대 한국어 관용으로 옮겼습니다. 명사 ‘사람’과 함께 쓰이므로 단위는 ‘명’을 붙였습니다.
theological_decisions:
- issue: 1 Esdras의 그리스어 본문을 히브리어 평행본문과 조화시킬지 여부
  chosen_reading: 그리스어 본문을 따라 요압의 자손, 아바디아, 이예젤루스, 이백십이 명으로 옮겼습니다.
  alternative_readings:
  - 에스라 8:12의 히브리어 평행본문에 맞추어 엘람의 자손, 이사야, 일흔 명으로 조화하는 읽기
  rationale: 이 절은 1 Esdras의 그리스어 증언이 본문 기준이므로, 평행본문과의 차이를 없애지 않고 그대로 보존해야 합니다. 이는 문헌 증거의 차이를 독자가 보게 하는 데 중요합니다.
  doctrine_reference: textual criticism / source priority
