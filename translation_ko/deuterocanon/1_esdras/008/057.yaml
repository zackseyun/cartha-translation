base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/057.yaml
  text: And he handed over to them[a], after weighing it out, six hundred fifty talents of silver, and silver vessels worth a hundred talents, and a hundred talents of gold, and twenty golden bowls[b], and ten vessels of fine gleaming bronze.
  footnotes:
  - marker: a
    text: The Greek text here differs notably from the Hebrew parallel in Ezra 8:27, which lists two vessels of fine bronze and gives a value for the gold bowls. Because 1 Esdras is translated from the Greek witness here, the main text follows the Greek inventory.
    reason: textual_variant
  - marker: b
    text: Or possibly 'twenty gold objects' for 'twenty golden bowls'; the Greek term is rare, but the Hebrew parallel supports understanding it as a kind of bowl or basin.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그것을 저울질하여 그들에게 넘겨주었는데, 은 육백오십 달란트와 은그릇 백 달란트와 금 백 달란트와 금 그릇 스무 개와 잘 빛나는 놋으로 된 놋그릇 열 개였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 에스라 8:27의 히브리어 평행본문과 상당히 다릅니다. 이 번역은 1 Esdras의 그리스어 증거를 따릅니다.
    reason: textual_variant
  - marker: b
    text: 희귀한 그리스어 단어로, 문맥과 히브리어 평행본문은 이를 금 그릇이나 금 대접류로 이해하게 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέδωκεν
  english_pob_choice: handed over
  chosen_korean: 넘겨주었는데
  alternatives_korean:
  - 건네주었는데
  - 맡겼는데
  - 전달하였는데
  lexicon: LSJ
  rationale: 물품을 공식적으로 이전하는 행위를 자연스러운 현대 한국어로 옮기되, 단순한 전달보다 인도·이양의 뉘앙스를 살렸습니다.
- source_word: στήσας
  english_pob_choice: after weighing it out
  chosen_korean: 그것을 저울질하여
  alternatives_korean:
  - 달아
  - 무게를 재어
  - 저울에 달아
  lexicon: LSJ
  rationale: 성전 재물 목록의 맥락에서 수량을 확인하며 무게를 재는 행위를 드러내는 표현이므로, ‘저울질하여’로 옮겼습니다.
- source_word: χρυσώματα
  english_pob_choice: golden bowls
  chosen_korean: 금 그릇
  alternatives_korean:
  - 금 접시
  - 금 바구니
  - 금 용기
  lexicon: LSJ
  rationale: 희귀어라 단정성을 과도하게 높이기보다, 히브리어 평행본문이 제시하는 그릇류의 뜻을 반영해 비교적 중립적인 ‘금 그릇’으로 처리했습니다.
- source_word: σκεύη χαλκᾶ ἀπὸ χαλκοῦ χρηστοῦ στίλβοντα
  english_pob_choice: ten vessels of fine gleaming bronze
  chosen_korean: 잘 빛나는 놋으로 된 놋그릇 열 개
  alternatives_korean:
  - 광택 나는 놋그릇 열 개
  - 좋은 빛나는 놋그릇 열 개
  - 잘 닦인 놋그릇 열 개
  lexicon: LSJ
  rationale: 그리스어가 재료와 질을 반복해 강조하므로, ‘잘 빛나는’과 ‘놋으로 된’으로 그 반복 효과를 살렸습니다. ‘놋’은 성전 기물 맥락에 자연스럽고 한국어 성경 전통에도 익숙합니다.
theological_decisions:
- issue: 1 Esdras의 그리스어 목록이 에스라의 히브리어 평행본문과 수량·품목에서 다름
  chosen_reading: 본문은 그리스어 사본의 목록을 따라 은 650달란트, 은그릇 100달란트, 금 100달란트, 금 그릇 20개, 놋그릇 10개로 옮겼습니다.
  alternative_readings:
  - 히브리어 평행본문처럼 금 그릇을 다른 수량으로 조정하는 읽기
  - 놋그릇을 2개로 맞추는 조정
  rationale: 이 책의 번역 기준이 그리스어 증거이므로, 평행본문과의 차이를 본문에서 평준화하지 않고 그대로 드러내는 편이 문헌비평적으로 정직합니다.
  doctrine_reference: 본문비평 원칙
