  text: And when these things had been completed, the leaders came to me, saying,
translation:
  language: ko
  text: 이러한 일들이 마무리되자, 지도자들이 내게 와서 말하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τούτων τελεσθέντων
  english_pob_choice: when these things had been completed
  chosen_korean: 이러한 일들이 마무리되자
  alternatives_korean:
  - 이러한 일들이 완료되자
  - 이런 일들이 끝나자
  - 이러한 일들이 이루어지자
  lexicon: SBLGNT / BDAG
  rationale: γενitive absolute가 앞선 일의 완료를 표시하므로, 한국어에서는 자연스러운 선행 완료 표현인 ‘마무리되자’로 옮겨 시간 관계를 살렸습니다.
- source_word: προσηλθόσαν μοι
  english_pob_choice: came to me
  chosen_korean: 내게 와서
  alternatives_korean:
  - 내게 다가와서
  - 내게 나아와서
  lexicon: SBLGNT / BDAG
  rationale: προσέρχομαι는 ‘다가오다/오다’의 뜻이지만, 한국어에서는 이어지는 직접화법을 여는 서술로 ‘내게 와서’가 가장 자연스럽습니다.
- source_word: οἱ ἡγούμενοι
  english_pob_choice: the leaders
  chosen_korean: 지도자들이
  alternatives_korean:
  - 우두머리들이
  - 주도자들이
  - 치리자들이
  lexicon: SBLGNT / BDAG
  rationale: 이 문맥의 ἡγούμενοι는 특정 직분명보다 앞서 이끄는 사람들을 가리키므로, 현대 한국어에서 의미를 분명히 하는 ‘지도자들’이 적절합니다.
- source_word: λέγοντες
  english_pob_choice: saying
  chosen_korean: 말하였습니다
  alternatives_korean:
  - 말하며
  - 이르며
  - 말하면서
  lexicon: SBLGNT / BDAG
  rationale: 분사 λέγοντες는 다음 절의 직접화법을 도입하므로, 한국어에서는 매끄럽게 이어지는 ‘말하였습니다’로 처리했습니다.
