base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/079.yaml
  text: And now what shall we say[a], Lord, having these things? They have transgressed your commandments[b], which you gave by the hand of your servants the prophets.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'through your servants the prophets.' The Greek reads 'by the hand of,' a standard biblical expression for mediated delivery.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'having these things' is compressed in Greek and likely refers back to the favors or circumstances just mentioned in the surrounding prayer.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이제, 주님, 우리가 이런 것들을 가지고 있으니 무엇이라고 말하겠습니까? 그들은 주님의 계명들을 어겼습니다. 그 계명들은 주님의 종들인 예언자들의 손을 통해 주님께서 주신 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἔχοντες αὐτά는 압축된 표현으로, 앞에서 언급된 은혜나 형편을 가리키는 말일 가능성이 있습니다.
    reason: alternative_reading
  - marker: b
    text: ἐν χειρὶ는 성경에서 흔한 매개 전달 관용구로, 문자적으로는 ‘손으로’이지만 여기서는 ‘손을 통해’가 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  english_pob_choice: And now
  chosen_korean: 그리고 이제
  alternatives_korean:
  - 이제
  - 그런데 이제
  lexicon: BDAG
  rationale: 새로운 탄원으로 넘어가는 연결어로서 καὶ νῦν의 흐름을 자연스럽게 살리면서도, 합쇼체 문맥에 맞게 간결하게 옮겼습니다.
- source_word: τί ἐροῦμεν
  english_pob_choice: what shall we say
  chosen_korean: 무엇이라고 말하겠습니까?
  alternatives_korean:
  - 무엇을 말하겠습니까?
  - 무엇이라 하겠습니까?
  lexicon: BDAG
  rationale: 수사적 질문의 당혹감과 숙고의 뉘앙스를 살리기 위해 직설적 질문형으로 옮겼습니다.
- source_word: ἔχοντες αὐτά
  english_pob_choice: having these things
  chosen_korean: 우리가 이런 것들을 가지고 있으니
  alternatives_korean:
  - 이것들을 가지고 있으니
  - 이런 것들을 소유하고 있으니
  - 이런 은혜를 입고 있으니
  lexicon: BDAG
  rationale: 문맥상 앞선 은혜나 형편을 가리키는 압축 표현이므로, 참조를 지나치게 특정하지 않으면서도 한국어로 자연스럽게 풀었습니다.
- source_word: τὰ προστάγματά σου
  english_pob_choice: your commandments
  chosen_korean: 주님의 계명들
  alternatives_korean:
  - 주님의 명령들
  - 주님의 규례들
  - 주님의 법령들
  lexicon: BDAG
  rationale: προστάγματα의 명령적, 언약적 성격을 살려 표준적인 성경어인 ‘계명들’로 옮겼습니다.
- source_word: ἐν χειρὶ τῶν παίδων σου τῶν προφητῶν
  english_pob_choice: by the hand of your servants the prophets
  chosen_korean: 주님의 종들인 예언자들의 손을 통해 주님께서 주신 것입니다
  alternatives_korean:
  - 주님의 종들인 예언자들의 손으로 주신 것입니다
  - 주님의 종들인 예언자들을 통해 주신 것입니다
  - 주님의 종들인 예언자들의 손으로 전해 주신 것입니다
  lexicon: BDAG
  rationale: ‘손을 통해’는 히브리어-헬라어 성경의 매개 전달 관용구를 보존하고, παῖδες를 문맥에 맞게 ‘종들’로 옮겨 예언자들의 수종자/종 노릇을 드러냈습니다.
theological_decisions:
- issue: ἐν χειρὶ의 매개 전달 관용구
  chosen_reading: ‘손을 통해’와 ‘주님께서 주신 것입니다’를 함께 써서, 계명이 예언자들을 매개로 하되 궁극적으로는 하나님이 주신 것임을 드러냈습니다.
  alternative_readings:
  - ‘통해’만 사용해 더 매끈하게 옮김
  - ‘예언자들을 통해 주신 것입니다’로 단순화
  rationale: 원문의 관용구를 지우지 않으면서도, 주어와 수여 행위를 분명히 해 신학적 긴장을 보존했습니다.
  doctrine_reference: 매개적 계시와 하나님의 직접적 수여를 함께 보존
