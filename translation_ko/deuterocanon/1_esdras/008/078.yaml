base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/078.yaml
  text: but he has shown us favor before the kings of Persia[a], to give us sustenance and to glorify our sanctuary and to raise up desolate Zion, to give us a stronghold in Judea and Jerusalem.
  footnotes:
  - marker: a
    text: Or 'firm footing' or 'security' in Judea and Jerusalem.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그분은 페르시아 왕들 앞에서 우리에게 은혜를 베푸셔서 우리에게 양식을 주시고 우리 성소를 영화롭게 하시며 황폐한 시온을 일으키고 유다와 예루살렘에서 우리에게 견고한 터를 주셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘견고한 기반’ 또는 ‘안정’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν ἡμᾶς ἐν χάριτι ἐνώπιον
  english_pob_choice: has shown us favor before
  chosen_korean: 은혜를 베푸셔서 … 앞에서
  alternatives_korean:
  - 호의를 보여 주셔서
  - 은총을 입게 하셔서
  lexicon: BDAG
  rationale: ἐποίησεν … ἐν χάριτι는 ‘우리를 은혜/호의 아래 두다’는 관계적 표현이므로, 한국어에서는 ‘은혜를 베푸시다’로 자연스럽게 옮기되 ‘앞에서’로 ἐνώπιον의 대면 관계를 살렸습니다.
- source_word: δοῦναι ἡμῖν τροφήν
  english_pob_choice: to give us sustenance
  chosen_korean: 우리에게 양식을 주시고
  alternatives_korean:
  - 우리에게 먹을 것을 주시고
  - 우리에게 생계를 주시고
  lexicon: BDAG
  rationale: τροφή는 단순한 음식보다 공급·양식의 뜻도 있으므로, 문맥상 왕의 지원을 가리키는 말로 ‘양식’을 선택했습니다.
- source_word: δοξάσαι τὸ ἱερὸν ἡμῶν
  english_pob_choice: to glorify our sanctuary
  chosen_korean: 우리 성소를 영화롭게 하시며
  alternatives_korean:
  - 우리 성전을 존귀하게 하시며
  - 우리 성소에 영광을 더하시며
  lexicon: BDAG
  rationale: ἱερόν은 성전 건물 전체보다 성소/성전 구역을 가리키는 말로 볼 수 있어 ‘성소’로 옮겼고, δοξάσαι는 ‘영광스럽게 하다’의 뜻을 살려 ‘영화롭게 하다’로 번역했습니다.
- source_word: ἐγεῖραι τὴν ἔρημον Σειών
  english_pob_choice: to raise up desolate Zion
  chosen_korean: 황폐한 시온을 일으키고
  alternatives_korean:
  - 버려진 시온을 세우고
  - 황무한 시온을 회복하고
  lexicon: BDAG
  rationale: ἐγείρω는 ‘일으키다/세우다’의 뜻이 있으며, ἔρημος는 ‘황폐한, 버려진’의 의미이므로 ‘황폐한 시온을 일으키다’로 이미지와 회복의 뉘앙스를 함께 살렸습니다.
- source_word: στερέωμα
  english_pob_choice: a stronghold
  chosen_korean: 견고한 터
  alternatives_korean:
  - 요새
  - 안전한 기반
  - 견고한 보루
  lexicon: LSJ
  rationale: στερέωμα은 굳게 선 상태나 기반을 뜻할 수 있어, 이 회복 문맥에서는 군사적 ‘요새’보다 정착과 안정의 뉘앙스가 있는 ‘견고한 터’가 더 적합합니다.
theological_decisions:
- issue: Σειών의 음역과 시온 정체성
  chosen_reading: 시온
  alternative_readings:
  - 시온(Sion)
  - 시온 산
  rationale: 본문은 지명 시온을 가리키므로 통상적인 성경 한국어 표기를 따랐습니다. 의미 확장 없이 고유명사를 유지하는 것이 원문에 가장 충실합니다.
  doctrine_reference: 지명은 고유명사로 처리하고, 본문의 상징성을 과도하게 재해석하지 않습니다.
- issue: στερέωμα의 구체성
  chosen_reading: 견고한 터
  alternative_readings:
  - 안정
  - 안전한 기반
  - 요새
  rationale: 문맥은 포로 귀환 공동체의 실제적 재정착과 보호를 말하므로, 추상적 ‘안정’보다 공동체가 설 자리라는 뜻을 드러내는 표현을 택했습니다.
  doctrine_reference: 문맥이 허용하는 구체적 의미를 우선하며, 추상화로 의미를 약화시키지 않습니다.
