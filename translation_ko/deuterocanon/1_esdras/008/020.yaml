base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/020.yaml
  text: Likewise[b][a], up to one hundred cors of wheat and one hundred measures of wine.
  footnotes:
  - marker: a
    text: A cor was a large dry measure, and a bath was a liquid measure. The Greek uses ancient units rather than generic 'measures.'
    reason: cultural_note
  - marker: b
    text: 'The parallel in Ezra 7:22 supports understanding these as standard administrative quantity limits: up to one hundred cors of wheat and one hundred baths of wine.'
    reason: cross_reference
translation:
  language: ko
  text: 마찬가지로, 밀은 일백 코르까지, 포도주는 일백 메트레테르까지입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 코르와 메트레테르는 고대의 도량형으로, 본문은 특정한 역사적 단위를 사용합니다.
    reason: cultural_note
  - marker: b
    text: 에스라 7:22의 평행본문은 이 수량들이 행정적 허용 상한임을 뒷받침합니다.
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως
  english_pob_choice: Likewise
  chosen_korean: 마찬가지로
  alternatives_korean:
  - 또한
  - 그와 같이
  lexicon: LSJ
  rationale: 앞의 항목에 더해지는 행정적 허용치를 자연스럽게 이어 주는 말로, ‘Likewise’의 부가적 힘을 살립니다.
- source_word: ἕως
  english_pob_choice: up to
  chosen_korean: ~까지
  alternatives_korean:
  - ~에 이르기까지
  - 최대 ~
  lexicon: LSJ
  rationale: 수량의 상한을 나타내는 용법이므로, 시간적 의미보다 한도를 드러내는 ‘~까지’가 적절합니다.
- source_word: πυροῦ
  english_pob_choice: wheat
  chosen_korean: 밀
  alternatives_korean:
  - 곡식
  lexicon: LSJ
  rationale: πυρός는 일반 곡물이 아니라 밀을 가리키므로, 보다 정확한 곡물명으로 옮겼습니다.
- source_word: κόρων ἑκατόν
  english_pob_choice: one hundred cors
  chosen_korean: 일백 코르
  alternatives_korean:
  - 백 코르
  - 일백 고르
  lexicon: LSJ
  rationale: κόρος는 고대의 건량 단위이므로 의미를 평준화하지 않고 음역을 유지했습니다.
- source_word: μετρητῶν ἑκατόν
  english_pob_choice: one hundred measures
  chosen_korean: 일백 메트레테르
  alternatives_korean:
  - 일백 측량
  - 일백 단위
  lexicon: LSJ
  rationale: μετρητής도 고대의 액량 단위이므로, 일반적인 ‘측량’보다 단위성을 드러내는 음역이 더 정확합니다.
theological_decisions:
- issue: 고대 도량형의 처리
  chosen_reading: 현대 독자가 읽을 수 있도록 수량 상한은 분명히 하되, 단위를 평준화하지 않고 고대 단위를 보존했습니다.
  alternative_readings:
  - ‘일백 통’처럼 현대식으로 바꾸는 읽기
  - ‘일백 배스’처럼 역대 본문과의 대응 단위를 넣는 읽기
  rationale: 본문은 행정 명령의 허용량을 전하는 것이므로 수치와 단위의 역사성을 함께 보존하는 편이 원문 의도에 가깝습니다.
  doctrine_reference: 번역학적 판단
