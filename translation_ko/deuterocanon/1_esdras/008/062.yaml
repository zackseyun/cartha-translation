- from: 그곳에 사흘째 되는 날, 은과 금을 달아 야훼의 집에서 제사장 마르모티 우리아에게 넘겼습니다. 그의 곁에는 바스냐의 아들 엘르아살이 있었고, 그들과 함께한 레위 사람들인 요사베스, 예수스, 모엣, 사반누스의 아들은 수량대로, 그리고 무게대로 모두 처리하였습니다. 그때 바로 전체 무게가 기록되었습니다.[a]
  to: 그곳에서 사흘째 되는 날, 은과 금 전체를 수량과 무게에 따라 달아 주님의 집에서 제사장 우리아의 아들 마르모티에게 넘겼습니다. 그와 함께 비느하스의 아들 엘르아살이 있었고, 그들과 함께 레위 사람들인 예수스의 아들 요사베스와 사반누스의 아들 모엣이 있었습니다. 바로 그때 전체 무게를 기록하였습니다.[a]
