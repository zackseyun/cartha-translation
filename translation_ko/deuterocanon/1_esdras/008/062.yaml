base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/062.yaml
  text: And when the third day came there, the silver and the gold were weighed out and handed over in the house of the Lord to Marmothi son of Ourias the priest, and with him was Eleazar son of Phinehas; and with them were Josabees son of Jesous and Moeth son of Sabannus, the Levites, by number and by weight, all of it; and the whole weight was recorded at that very time.
  footnotes:
  - marker: a
    text: The Greek names here differ from the MT-parallel tradition, which has forms such as Meremoth son of Uriah, Eleazar son of Phinehas, and Levites corresponding to Jonathan son of Jeshua and Noadiah son of Binnui. The main text follows the Greek witness of 1 Esdras.
    reason: alternative_reading
translation:
  language: ko
  text: 그곳에 사흘째 되는 날, 은과 금을 달아 야훼의 집에서 제사장 마르모티 우리아에게 넘겼습니다. 그의 곁에는 바스냐의 아들 엘르아살이 있었고, 그들과 함께한 레위 사람들인 요사베스, 예수스, 모엣, 사반누스의 아들은 수량대로, 그리고 무게대로 모두 처리하였습니다. 그때 바로 전체 무게가 기록되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 인명은 MT 병행 전통과 다릅니다. 히브리어 계열 병행에는 메렘못, 우리야, 엘르아살, 비느하스와 같은 형태가 나타나지만, 본문은 1 에스드라스의 그리스어 증거를 따릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἡμέρας τρίτης / αὐτόθι
  english_pob_choice: when the third day came there
  chosen_korean: 그곳에 사흘째 되는 날
  alternatives_korean:
  - 사흘째에
  - 그곳에서 사흘째 되는 날
  lexicon: LSJ
  rationale: 시간과 장소를 함께 드러내는 구문으로 보고, 한국어에서는 자연스럽게 '그곳에 사흘째 되는 날'로 옮겨 서술 흐름을 살렸습니다.
- source_word: παρεδόθη ἐν τῷ οἴκῳ Κυρίου
  english_pob_choice: were handed over in the house of the Lord
  chosen_korean: 야훼의 집에서 ... 넘겼습니다
  alternatives_korean:
  - 주님의 집에서 ... 넘겼습니다
  - 성전에서 ... 넘겼습니다
  lexicon: LSJ
  rationale: κυρίου는 본문이 야훼 인용적 성격의 성구 표현이 아니어서, OT 본문 맥락을 따르는 기본값으로 옮기지 않고 서술형의 '야훼의 집'을 유지했습니다.
- source_word: Μαρμωθὶ Οὐρείᾳ ἱερεῖ
  english_pob_choice: Marmothi son of Ourias the priest
  chosen_korean: 제사장 마르모티 우리아
  alternatives_korean:
  - 제사장 마르모티, 우리아의 아들
  - 제사장 마르모티 우리아의 아들
  lexicon: LSJ
  rationale: 그리스어는 수여 대상인 이름 뒤에 직분이 붙는 구조이므로, 한국어에서는 가장 자연스럽게 이름+직분으로 풀되, 관계는 문맥상 유지했습니다.
- source_word: οἱ Λευεῖται
  english_pob_choice: the Levites
  chosen_korean: 레위 사람들
  alternatives_korean:
  - 레위인들
  - 레위 사람들
  lexicon: LSJ
  rationale: 족속명과 직무를 함께 보존하는 표현으로 '레위 사람들'을 택해, 고유한 종교적 집단임을 드러냈습니다.
- source_word: πρὸς ἀριθμὸν καὶ ὁλκὴν πάντα
  english_pob_choice: by number and by weight, all of it
  chosen_korean: 수량대로, 그리고 무게대로 모두 처리하였습니다
  alternatives_korean:
  - 수와 무게대로, 모두
  - 수량과 무게에 따라, 모두
  lexicon: LSJ
  rationale: 행정적 정산 문맥이므로 '처리하였습니다'로 결과를 자연스럽게 담되, '수량'과 '무게'를 병렬로 살렸습니다.
theological_decisions:
- issue: κύριος의 한국어 처리
  chosen_reading: 야훼의 집
  alternative_readings:
  - 주님의 집
  - 주의 집
  rationale: 이 절의 κύριος는 성전 공식 명칭으로 기능하므로, 프로젝트 기본값인 '야훼'를 본문에 반영했습니다. 다만 본문이 야훼 인용구는 아니므로 대문자 LORD 체계를 따르지 않았습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: 그리스어 고유명사의 본문 보존
  chosen_reading: 그리스어 형태를 음역 중심으로 본문에 유지
  alternative_readings:
  - 마레못/메렘못 등 MT 계열 형태로 정규화
  rationale: 1 Esdras는 그리스어 본문을 1차 स्रोत으로 삼으므로, MT 병행의 익숙한 형태로 맞추기보다 그리스어 증거를 우선해 음역했습니다.
  doctrine_reference: Original-language primacy; translate titles, transliterate names
