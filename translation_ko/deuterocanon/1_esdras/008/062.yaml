base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/062.yaml
  text: And when the third day came there, the silver and the gold were weighed out and handed over in the house of the Lord to Marmothi son of Ourias the priest, and with him was Eleazar son of Phinehas; and with them were Josabees son of Jesous and Moeth son of Sabannus, the Levites, by number and by weight, all of it; and the whole weight was recorded at that very time.
  footnotes:
  - marker: a
    text: The Greek names here differ from the MT-parallel tradition, which has forms such as Meremoth son of Uriah, Eleazar son of Phinehas, and Levites corresponding to Jonathan son of Jeshua and Noadiah son of Binnui. The main text follows the Greek witness of 1 Esdras.
    reason: alternative_reading
translation:
  language: ko
  text: 그곳에서 사흘째 되는 날, 은과 금 전체를 수량과 무게에 따라 달아 주님의 집에서 제사장 우리아의 아들 마르모티에게 넘겼습니다. 그와 함께 비느하스의 아들 엘르아살이 있었고, 그들과 함께 레위 사람들인 예수스의 아들 요사베스와 사반누스의 아들 모엣이 있었습니다. 바로 그때 전체 무게를 기록하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 인명 형태는 MT 병행 전통과 다릅니다. MT 계열 병행에는 우리아의 아들 메렘못, 비느하스의 아들 엘르아살, 그리고 예수아의 아들 요나단 및 빈누이의 아들 노아댜에 해당하는 레위인들이 나타납니다. 본문은 1 에스드라스의 그리스어 증거를 따릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἡμέρας τρίτης / αὐτόθι
  english_pob_choice: when the third day came there
  chosen_korean: 그곳에 사흘째 되는 날
  alternatives_korean:
