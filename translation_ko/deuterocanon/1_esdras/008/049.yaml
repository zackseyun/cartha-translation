revisions:
- from: 그리고 다윗과 지도자들이 레위 사람들의 일에 맡긴 성전 봉사자들 가운데서는 성전 봉사자들, 이백스물 명이었습니다. 그들 모두는 이름으로 기록되었습니다.[a][b]
  to: 그리고 다윗과 지도자들이 레위 사람들의 일을 위해 맡긴 성전 봉사자들[a] 가운데에는 이백이십 명의 성전 봉사자가 있었습니다. 그들 모두는 이름별로 명부에 기록되었습니다.[b]
  rationale: 원문의 성전 봉사자라는 분류와 수효를 유지하면서, 한국어의 어색한 중복을 수량 구문으로 자연스럽게 정리했습니다. 배정의 목적(레위 사람들의 일)을 분명히 하고, ὀνοματογραφία의 행정적 명부 의미를 본문과 각주에 반영했습니다. 신분적 함의를 본문에 과도하게 덧붙이지 않았습니다.
  reviewer_model: gpt-5.6-terra
