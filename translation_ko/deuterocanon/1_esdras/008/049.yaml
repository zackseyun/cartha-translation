base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/049.yaml
  text: 'And from the temple servants whom David and the leaders had assigned to the service of the Levites: temple servants[a], two hundred twenty[b]; all of them were listed by name.'
  footnotes:
  - marker: a
    text: Or 'Nethinim,' a Hebrew-derived technical term for temple servants. The Greek has 'temple servants' (ἱερόδουλοι), while the Hebrew parallel uses נְתִינִים.
    reason: lexical_alternative
  - marker: b
    text: Or 'all of them were recorded by name.' The closing phrase refers to formal registration or listing by name.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 다윗과 지도자들이 레위 사람들의 일에 맡긴 성전 봉사자들 가운데서는 성전 봉사자들, 이백스물 명이었습니다. 그들 모두는 이름으로 기록되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ἱεροδούλων은 문자적으로는 성전/신성한 봉사에 속한 사람들을 가리키며, 히브리어 평행구는 נְתִינִים을 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 구절은 ‘모두가 이름으로 공식 등록되었다’는 뜻으로, 명부 작성의 뉘앙스를 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱεροδούλων
  english_pob_choice: temple servants
  chosen_korean: 성전 봉사자들
  alternatives_korean:
  - 성전 종들
  - 성전 노예들
  - 느디님
  lexicon: LSJ
  rationale: 그리스어는 성전/신성한 봉사에 속한 사람들을 가리키며, 히브리어 평행구의 נְתִינִים도 기능적 용례를 뒷받침하므로, 본문에서는 직역보다 역할을 드러내는 ‘성전 봉사자들’이 가장 자연스럽습니다.
- source_word: εἰς τὴν ἐργασίαν τῶν Λευειτῶν
  english_pob_choice: to the service of the Levites
  chosen_korean: 레위 사람들의 일
  alternatives_korean:
  - 레위 사람들의 봉사
  - 레위 사람들의 사역
  - 레위 사람들의 작업
  lexicon: LSJ
  rationale: ἐργασία는 문맥상 단순한 ‘노동’보다 배정된 실무/봉사를 뜻하므로, 한국어에서는 ‘일’로 풀어 레위 사람들을 돕는 실무적 역할을 담았습니다.
- source_word: ἐσημάνθη ὀνοματογραφία
  english_pob_choice: all of them were listed by name
  chosen_korean: 그들 모두는 이름으로 기록되었습니다
  alternatives_korean:
  - 그들 모두는 이름으로 목록에 올려졌습니다
  - 그들 모두는 이름으로 등재되었습니다
  - 그들 모두는 이름별로 기록되었습니다
  lexicon: LSJ
  rationale: 마지막 구절은 단순한 호칭이 아니라 공식적인 명부 작성/등록을 가리키므로, ‘이름으로 기록되었습니다’가 가장 간결하게 행정적 뉘앙스를 살립니다.
- source_word: διακόσιοι εἴκοσι
  english_pob_choice: two hundred twenty
  chosen_korean: 이백스물 명
  alternatives_korean:
  - 이백이십 명
  - 220명
  lexicon: LSJ
  rationale: 한국어 성경체에서는 수사를 자연스럽게 풀어 쓰는 것이 읽기 흐름에 맞아 ‘이백스물 명’으로 옮겼습니다.
theological_decisions:
- issue: ἱεροδούλων의 직역 가능성(‘성전 노예들’)을 본문에 반영할지 여부
  chosen_reading: 봉사 기능을 드러내는 ‘성전 봉사자들’로 옮기고, bonded-status 뉘앙스는 본문에 두드러지게 드러내지 않았습니다.
  alternative_readings:
  - 성전 노예들
  - 성전 종들
  rationale: 여기서는 인원의 신분 논쟁보다 성전-레위 조직 내 배정과 명부 작성이 핵심이므로, 원문의 기능적 의미를 우선했습니다.
  doctrine_reference: Temple administration / lexical sense, not a doctrinal locus
