base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/064.yaml
  text: And they delivered the king’s decrees to the royal stewards and to the governors of Syria and Phoenicia[a], and they honored the nation and the sanctuary of the Lord.
  footnotes:
  - marker: a
    text: Or 'they glorified the nation and the sanctuary of the Lord.' The Greek verb can also be rendered more literally as 'glorified,' but here likely refers to honoring or showing distinction.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 왕의 명령문들을 왕실 관리들과 시리아와 페니키아의 총독들에게 전달하였고, 백성과 주님의 성소를 높였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ προστάγματα
  english_pob_choice: the decrees
  chosen_korean: 명령문들
  alternatives_korean:
  - 칙령들
  - 법령들
  - 명령들
  lexicon: LSJ
  rationale: 왕의 공식 지시를 가리키므로, 단순한 명령보다 문서화된 행정적 성격이 드러나는 ‘명령문들’이 적절합니다.
- source_word: τοῖς βασιλικοῖς οἰκονόμοις
  english_pob_choice: to the royal stewards
  chosen_korean: 왕실 관리들
  alternatives_korean:
  - 왕의 청지기들
  - 왕실 집사들
  - 왕실 재무관들
  lexicon: LSJ
  rationale: οἰκονόμος의 기본 의미는 ‘가계/소유의 관리인’이지만, 여기서는 궁정 행정관을 가리키므로 ‘왕실 관리들’이 가장 자연스럽습니다.
- source_word: τοῖς ἐπάρχοις
  english_pob_choice: to the governors
  chosen_korean: 총독들
  alternatives_korean:
  - 지방관들
  - 주지사들
  - prefect들
  lexicon: LSJ
  rationale: ἐπάρχος는 지방 행정 책임자를 뜻하므로, 한국어에서 통용되는 고위 지방 통치자 표현인 ‘총독들’로 옮겼습니다.
- source_word: ἐδόξασαν
  english_pob_choice: they honored
  chosen_korean: 높였습니다
  alternatives_korean:
  - 영화롭게 했습니다
  - 존중했습니다
  - 영광스럽게 했습니다
  lexicon: BDAG
  rationale: 여기서는 하나님께 드리는 예배적 ‘영화롭게 하다’보다, 백성과 성소를 공적으로 귀히 여기고 드높인다는 뜻이므로 ‘높였습니다’가 더 정확합니다.
- source_word: τὸ ἱερὸν
  english_pob_choice: the sanctuary
  chosen_korean: 성소
  alternatives_korean:
  - 성전
  - 신성한 곳
  - 성역
  lexicon: BDAG
  rationale: ἱερόν은 성전 परिसर 전체나 성역을 가리킬 수 있는데, 여기서는 백성과 병렬로 언급된 거룩한 장소로서 ‘성소’가 간결하고도 정확합니다.
theological_decisions:
- issue: κύριος의 번역과 1 Esdras의 그리스어 직접 반영
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 주 하나님
  - 야훼
  rationale: 본문의 직접 증거가 그리스어 κύριος이므로, 기본적으로는 ‘주님’으로 옮기되 히브리어 신명 대체 표시는 하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → Lord; יְהוָה → 야훼'
