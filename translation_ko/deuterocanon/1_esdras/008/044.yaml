translation:
  language: ko
  text: 나는 엘레아자르[a]와 이두엘, 마아스만, 에나아탄, 스마야, 요립, 나단, 엔나탄, 스가랴, 그리고 메솔라본에게 사람을 보냈습니다. 그들은 지도자들과 이해 있는 사람들이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 여러 인명은 그리스어 전승에 남은 형태를 따르며, 히브리어 에스라 평행본문과 정확히 일치하지 않을 수 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπέστειλα πρὸς
  english_pob_choice: I sent for
  chosen_korean: 사람을 보냈습니다
  alternatives_korean:
  - 불러 보냈습니다
  - 보냈습니다
  lexicon: BDAG
  rationale: 문맥상 단순 이동이 아니라 특정 인물들을 향해 파견해 부르는 행위이므로, 한국어에서는 자연스러운 서술인 ‘사람을 보냈습니다’로 옮기되 ‘불러’의 뉘앙스는 문맥이 감당하는 범위 안에서만 암시했습니다.
- source_word: Ἐλεάζαρον καὶ Ἰδούηλον καὶ Μαασμὰν καὶ Ἐναατὰν καὶ Σαμαίαν καὶ Ἰώριβον, Ναθάν, Ἐννατάν, Ζαχαρίαν καὶ Μεσολαβών
  english_pob_choice: Eleazar, Iduel, Maasman, Enaathan, Shemaiah, Jorib, Nathan, Ennathan, Zechariah, and Mesholabon
  chosen_korean: 엘레아자르, 이두엘, 마아스만, 에나아탄, 스마야, 요립, 나단, 엔나탄, 스가랴, 그리고 메솔라본
  alternatives_korean:
  - 엘르아살, 이두엘, 마아스마, 에나아탄, 사마야, 요리브, 나단, 엔나탄, 즈카랴, 메솔라봉
  lexicon: 고유명사 음역
  rationale: 이 절은 1 Esdras의 그리스어 증언을 따르는 인명 목록이므로, 히브리어 평행본문과 완전히 맞추기보다 그리스어 형태를 기준으로 한국어 음역을 정리했습니다.
- source_word: τοὺς ἡγουμένους
  english_pob_choice: the leaders
  chosen_korean: 지도자들
  alternatives_korean:
  - 인도하는 사람들
  - 우두머리들
  lexicon: BDAG
  rationale: ἡγούμενοι는 앞서는 사람, 이끄는 사람을 뜻하므로 한국어에서는 기능을 분명히 드러내는 ‘지도자들’이 가장 자연스럽습니다.
- source_word: ἐπιστήμονας
  english_pob_choice: men of understanding
  chosen_korean: 이해 있는 사람들
  alternatives_korean:
  - 이해력이 있는 사람들
  - 식견 있는 사람들
  - 학식 있는 사람들
  lexicon: LSJ
  rationale: 그리스어는 단순한 지식 보유보다 분별과 이해를 지닌 사람들을 가리키므로, 직역보다 의미를 살린 ‘이해 있는 사람들’로 옮겼습니다.
theological_decisions:
- issue: 1 Esdras의 그리스어 인명 전승을 히브리어 평행본문과 조화시킬지 여부
  chosen_reading: 그리스어 본문의 이름 형태를 그대로 따라가고, 히브리어 평행본문과의 불일치는 본문 전승 차이로 둡니다.
  alternative_readings:
  - 히브리어 평행본문에 맞춰 이름을 재조정함
  - 익숙한 구약 이름 형태로 표준화함
  rationale: 이 절의 번역 기준은 히브리어 평행본문이 아니라 그리스어 원문이며, 인명 목록은 전승 차이를 지우기보다 그대로 드러내는 것이 사료적으로 더 정확합니다.
  doctrine_reference: 본문비평 / 전승사
- issue: ἐπιστήμονας의 성별 표지
  chosen_reading: 남성 복수 맥락을 반영해 ‘사람들’로 옮기되, 불필요하게 성중립적 추상어로 약화시키지 않았습니다.
  alternative_readings:
  - 학자들
  - 전문가들
  - 이해력 있는 이들
  rationale: 문맥상 특정 남성 인물들을 가리키므로, 한국어도 그 집단성을 유지하는 방향이 원문에 더 가깝습니다.
  doctrine_reference: 문법적 성별 / 서술 정확성
