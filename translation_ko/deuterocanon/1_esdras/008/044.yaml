review_pass:
  verdict: revise
  source_fidelity: 그리스어는 열거된 인물들을 향해 보냈다고 하고, 이어 그들을 ‘지도자들 및 식견 있는 사람들’로 동격 수식합니다. 초안의 ‘사람을 보냈습니다’는 파견의 매개자를 명시하여 약간 보충적이지만, ‘불러오려고’를 더하면 영어 POB의 ‘sent for’가 포착한 문맥상 소집 의미를 자연스럽게 드러낼 수 있습니다. 또한 Σαμαίαν은 ‘스마야’보다 ‘사마이아’가 그리스어 형태에 가깝습니다.
  naturalness: ‘이해 있는 사람들’은 현대 한국어에서 다소 부자연스럽고 의미 범위도 불명확합니다. ‘식견 있는 사람들’이 ἐπιστήμονας의 지식·전문성의 뜻을 자연스럽고 적절하게 전달합니다. 수식 관계를 ‘이들은 …’으로 풀어 쓰면 한국어 문장도 매끄럽습니다.
  terminology: ἡγούμενοι는 ‘지도자들’로 적절합니다. ἐπιστήμονας는 ‘식견 있는 사람들’로 고쳤습니다. 인명은 그리스어 전승을 우선하여 음역하며, 사마이아는 Σαμαίαν의 형태를 반영했습니다. 각 이름을 히브리어 평행본문에 맞추어 조화시키지 않았습니다.
  issues:
  - severity: medium
    issue: Σαμαίαν을 ‘스마야’로 음역함
    rationale: 그리스어 Σαμαίαν의 음역은 ‘사마이아’가 더 직접적입니다. ‘스마야’는 히브리어계 친숙한 이름 형태에 가까워, 그리스어 전승을 따르겠다는 번역 원칙과 긴장됩니다.
  - severity: medium
    issue: ἐπιστήμονας을 ‘이해 있는 사람들’로 번역함
    rationale: ‘이해 있는’은 현대 표준 한국어에서 어색하며, 여기서 말하는 지식·식견·전문성의 의미를 충분히 명료하게 전달하지 못합니다.
  - severity: low
    issue: ‘그들은 지도자들과 이해 있는 사람들이었습니다’의 접속 방식
    rationale: 원문은 καί로 연결된 동격적 두 명사를 사용합니다. 한국어에서는 ‘지도자들이며 식견 있는 사람들’이 병렬 관계를 더 분명하고 자연스럽게 나타냅니다.
