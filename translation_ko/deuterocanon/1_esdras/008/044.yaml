  to: 나는 엘레아자르[a]와 이두엘, 마아스만, 에나아탄, 사마이아, 요립, 나단, 엔나탄, 스가랴, 그리고 메솔라본을 불러오려고 사람을 보냈습니다. 이들은 지도자들이며 식견 있는 사람들이었습니다.
