base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/074.yaml
  text: And because of our sins and the sins of our fathers[a], we were handed over, together with our brothers, our kings, and our priests, to the kings of the earth, to the sword and captivity and plundering with shame[b], to this present day.
  footnotes:
  - marker: a
    text: Or 'to the kings of the land.' The Greek γῆ can mean 'earth' or 'land'; here 'earth' is retained as the broader idiom for foreign earthly rulers.
    reason: lexical_alternative
  - marker: b
    text: Or 'spoil' or 'plunder' for 'plundering.' The Greek term denotes being given over to pillage.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리의 죄와 우리 조상들의 죄 때문에, 우리는 우리 형제들, 우리 왕들, 우리 제사장들과 함께 땅의 왕들에게 넘겨져 칼을 당하고 포로가 되고 약탈을 당하며 수치를 겪어 오늘날에 이르렀습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘세상의 왕들에게’. 그리스어 γῆ는 ‘땅’ 또는 ‘세상/나라’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘약탈’은 ‘노략’ 또는 ‘전리품으로 빼앗김’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὰς ἁμαρτίας ἡμῶν καὶ τῶν πατέρων ἡμῶν
  english_pob_choice: because of our sins and the sins of our fathers
  chosen_korean: 우리의 죄와 우리 조상들의 죄 때문에
  alternatives_korean:
  - 우리의 죄와 우리 아버지들의 죄 때문에
  - 우리의 죄와 선조들의 죄로 인해
  lexicon: BDAG
  rationale: διά + 대격은 원인 관계를 나타내므로, 한국어에서는 ‘때문에’로 자연스럽게 옮겨 원인의 무게를 살렸습니다.
- source_word: παρεδόθημεν
  english_pob_choice: we were handed over
  chosen_korean: 우리는 넘겨져
  alternatives_korean:
  - 우리는 내주어져
  - 우리는 넘겨졌습니다
  lexicon: BDAG
  rationale: παραδίδωμι의 수동형은 권세 아래로 ‘넘겨지는’ 의미를 담으므로, 단순한 수동보다 심판·포박의 뉘앙스를 살려 ‘넘겨져’로 옮겼습니다.
- source_word: τοῖς βασιλεῦσιν τῆς γῆς
  english_pob_choice: to the kings of the earth
  chosen_korean: 땅의 왕들에게
  alternatives_korean:
  - 세상의 왕들에게
  - 나라들의 왕들에게
  lexicon: BDAG
  rationale: γῆ는 여기서 외국의 지상 통치자들을 가리키는 넓은 표현이므로, 영어의 ‘earth’에 맞춰 ‘땅의 왕들’로 직역하되 자연스러운 한국어 어순으로 조정했습니다.
- source_word: εἰς ῥομφαίαν καὶ αἰχμαλωσίαν καὶ προνομὴν
  english_pob_choice: to the sword and captivity and plundering
  chosen_korean: 칼과 포로 됨과 약탈에
  alternatives_korean:
  - 칼과 포로 됨과 노략에
  - 칼과 포로 생활과 노략질에
  lexicon: BDAG; LSJ
  rationale: 세 항목의 심판 공식을 그대로 유지하되, ῥομφαία는 한국어 성경의 관용을 따라 ‘칼’로, αἰχμαλωσία는 상태를 드러내는 ‘포로 됨’으로, προνομὴ는 약탈의 결과를 드러내는 ‘약탈’로 옮겼습니다.
- source_word: μετὰ αἰσχύνης
  english_pob_choice: with shame
  chosen_korean: 수치와 함께
  alternatives_korean:
  - 수치 속에
  - 부끄러움과 함께
  lexicon: BDAG
  rationale: αἰσχύνη는 단순 감정이 아니라 공적 수치·굴욕을 뜻하므로, 보다 문어적이고 강한 ‘수치’로 옮겼습니다.
theological_decisions:
- issue: 공동체적·세대적 죄책의 직접성
  chosen_reading: ‘우리의 죄와 우리 조상들의 죄 때문에’라는 구조를 그대로 유지해, 현재 공동체와 조상들의 죄가 함께 언급되는 본문의 논리를 보존했습니다.
  alternative_readings:
  - ‘우리의 죄와 그 이전 세대의 죄 때문에’로 완화하기
  - 세대적 책임 표현을 생략하기
  rationale: 그리스어는 현재 공동체와 ‘우리 조상들’을 함께 원인으로 제시하므로, 이를 완화하지 않고 그대로 드러내는 편이 원문과 공적 고백의 무게를 더 정확히 반영합니다.
  doctrine_reference: 공동체적 책임과 언약적 연대의 표현을 보존합니다.
