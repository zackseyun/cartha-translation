  lexicon: LSJ
  rationale: 동반 출발의 뜻을 살리되, 현대 한국어에서 명령형으로 가장 자연스러운 행정적 표현을 선택했습니다.
- source_word: ἐμοί τε καὶ τοῖς ἑπτὰ φίλοις συμβουλευταῖς
  english_pob_choice: by me and the seven friends who are my counselors
  chosen_korean: 나와 나의 일곱 친구인 조언자들과 함께
  alternatives_korean:
