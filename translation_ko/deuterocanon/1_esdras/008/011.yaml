  - ‘참모들’로 옮김
  rationale: 본문은 개인적 친분보다 왕실 의사결정 참여자라는 궁정적 의미를 시사하므로, 한국어에서도 사적 우정보다 공적 직무를 함께 보이게 했습니다.
  doctrine_reference: 궁정 역사 서술의 사회적 맥락
