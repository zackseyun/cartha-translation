base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/011.yaml
  text: Therefore[a], let all who are so minded set out together, just as it has been decided by me and my seven friends who are counselors[b];
  footnotes:
  - marker: a
    text: Or, 'let all who intend it go forth together.' The Greek verb ἐνθυμοῦνται can mean 'intend' or 'have in mind,' and συνεξορμάσθωσαν can be rendered more literally 'go forth together.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'the seven friends who are my counselors' reflects court language. 'Friends' may denote an official rank at a royal court, not merely personal companions.
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 그러한 뜻을 가진 사람은 모두 함께 나서십시오. 그것은 나와 나의 일곱 친구인 조언자들과 함께 이미 결정된 바와 같습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 뜻을 품은 사람은 모두 함께 나서십시오.’ ἐνθυμοῦνται는 ‘의도하다, 마음에 두다’의 뜻으로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘일곱 친구인 조언자들’은 단순한 사적 친구가 아니라 궁정에서의 공식 직함일 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: ὅσοι
  english_pob_choice: all who
  chosen_korean: 그러한 뜻을 가진 사람은 모두
  alternatives_korean:
  - 누구든지
  - 뜻하는 사람은 모두
  - 모든 이들
  lexicon: LSJ
  rationale: 복수의 조건적 초대를 한국어로 자연스럽게 옮기면서, 단순한 ‘원하는 사람’보다 문맥상 결심과 의향을 드러내는 표현을 택했습니다.
- source_word: ἐνθυμοῦνται
  english_pob_choice: are so minded
  chosen_korean: 그러한 뜻을 가진
  alternatives_korean:
  - 마음에 두는
  - 의도하는
  - 원하는
  lexicon: LSJ
  rationale: 이 동사는 ‘생각하다’보다 ‘마음에 품다, 의도하다’의 뉘앙스가 강하므로, 결심한 의향을 나타내는 표현으로 옮겼습니다.
- source_word: συνεξορμάσθωσαν
  english_pob_choice: set out together
  chosen_korean: 함께 나서십시오
  alternatives_korean:
  - 함께 출발하십시오
  - 함께 떠나십시오
  - 함께 나아가십시오
  lexicon: LSJ
  rationale: 동반 출발의 뜻을 살리되, 현대 한국어에서 명령형으로 가장 자연스러운 행정적 표현을 선택했습니다.
- source_word: ἐμοί τε καὶ τοῖς ἑπτὰ φίλοις συμβουλευταῖς
  english_pob_choice: by me and the seven friends who are my counselors
  chosen_korean: 나와 나의 일곱 친구인 조언자들과 함께
  alternatives_korean:
  - 나와 나의 일곱 조언자 친구들과 함께
  - 나와 나를 돕는 일곱 친구들과 함께
  - 나와 나의 일곱 친구 조언자들과 함께
  lexicon: LSJ
  rationale: φίλοις συμβουλευταῖς는 궁정의 공식 직함 성격을 띨 수 있어 단순한 사적 친구로 좁히지 않고, 관계와 직무를 함께 드러내는 ‘친구인 조언자들’로 옮겼습니다.
theological_decisions:
- issue: 궁정 용어 φίλοι의 처리
  chosen_reading: ‘친구들’을 유지하되, 직함적 성격을 드러내기 위해 ‘조언자들’과 결합해 읽었습니다.
  alternative_readings:
  - 단순히 ‘친구들’로 옮김
  - ‘신하들’로 옮김
  - ‘참모들’로 옮김
  rationale: 본문은 개인적 친분보다 왕실 의사결정 참여자라는 궁정적 의미를 시사하므로, 한국어에서도 사적 우정보다 공적 직무를 함께 보이게 했습니다.
  doctrine_reference: 궁정 역사 서술의 사회적 맥락
