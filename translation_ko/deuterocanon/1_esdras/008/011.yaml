  to: 그러므로 그러한 뜻을 품은 사람들은 모두[a], 나와 일곱 친구이자 조언자인 이들이 결정한 대로 함께 나서십시오[b].
  rationale: 핵심 문법 관계를 바로잡아, 명령이 화자와 일곱 φίλοις συμβουλευταῖς가 내린 결정에 따른다는 뜻을 분명히 했습니다. φίλοι와 συμβουλευταῖς의 병렬적 성격 및 궁정 용례의 가능성을 보존했으며, 원문에 없는 소유 표현 ‘나의’는 삭제했습니다. 명령문의 복수 수신자와 합쇼체를 자연스럽게 유지했습니다.
