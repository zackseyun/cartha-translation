  - severity: medium
    issue: καθάπερ의 연결 표현 부정확
    rationale: ‘결정된 바와 같습니다’는 비교·유사 판단처럼 들립니다. 본문은 권유가 이미 내려진 결정에 부합함을 말하므로 ‘결정한 대로’가 적절합니다.
  - severity: low
    issue: 각주 a의 앵커 위치
    rationale: 각주의 설명 대상은 ἐνθυμοῦνται이므로 ‘뜻을 품은’ 바로 뒤에 붙이는 편이 명확합니다.
