  naturalness: ‘옷들과 거룩한 예복’은 한국어 병렬 명사구로 다소 부자연스럽습니다. 또한 각주 표지가 모두 문장 끝에 있어 각주가 가리키는 원어 표현을 즉시 확인하기 어렵습니다. 해당 어구 뒤로 표지를 옮기면 독해와 주석 연결이 분명해집니다.
