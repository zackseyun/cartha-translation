base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/070.yaml
  text: And rising from the fasting[a], with his garments and the holy robe torn, he bent his knees and stretched out his hands to the Lord, saying[b],
  footnotes:
  - marker: a
    text: Greek has a plural form, literally 'they were saying' or 'I was saying' depending on textual explanation; the context strongly points to Ezra introducing his prayer, so the English smooths this as 'saying.'
    reason: textual_variant
  - marker: b
    text: Or 'the sacred garment.' The Greek does not explicitly say 'priestly robe,' though the context may suggest official sacred attire.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 금식을 마치고 일어나, 옷과 거룩한 예복[b]이 찢어진 채 무릎을 굽히고 손을 주님께 펴 들며 말하였습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 형태상 복수형으로 전해지며, 직역하면 ‘그들이 말하던’ 또는 ‘내가 말하던’의 가능성이 있습니다. 그러나 문맥상 에스라가 기도를 시작하는 장면이므로 ‘말하였습니다’로 자연스럽게 옮겼습니다.
    reason: textual_variant
  - marker: b
    text: 원문은 ‘거룩한 예복’이라고만 하며, 제사장 예복이라고는 명시하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεγερθείς ἐκ τῆς νηστείας
  english_pob_choice: rising from the fasting
  chosen_korean: 금식에서 일어나
  alternatives_korean:
  - 금식 후에 일어나
  - 금식 중에서 일어나
  lexicon: BDAG
  rationale: 아오리스트 분사와 전치사구를 자연스러운 한국어 행위 전환으로 옮기되, ‘금식’의 상태/기간에서 벗어나는 의미를 유지했습니다.
- source_word: διερρηγμένα ἔχων τὰ ἱμάτια
  english_pob_choice: with his garments torn
  chosen_korean: 옷들이 찢어진 채
  alternatives_korean:
  - 찢어진 옷을 입은 채
  - 그의 옷이 찢겨 있는 채
  lexicon: BDAG
  rationale: ἱμάτια는 일반 의복이므로 ‘옷들’로 옮기고, 분사구의 상태성을 ‘-된 채’로 살렸습니다.
- source_word: τὴν ἱερὰν ἐσθῆτα
  english_pob_choice: the holy robe
  chosen_korean: 거룩한 예복
  alternatives_korean:
  - 거룩한 옷
  - 성스러운 옷
  - 거룩한 제의복
  lexicon: BDAG
  rationale: ἱερά의 ‘거룩한/성스러운’과 ἐσθής의 ‘겉옷/의복’ 의미를 반영하되, 문맥상 공식적 성복의 뉘앙스를 전달할 수 있는 ‘예복’을 택했습니다.
- source_word: πρὸς τὸν κύριον
  english_pob_choice: to the Lord
  chosen_korean: 주님께
  alternatives_korean:
  - 주님을 향하여
  - 주께
  lexicon: BDAG
  rationale: 기도의 방향성을 자연스럽게 드러내면서, κύριος를 프로젝트 기본어인 ‘주님’으로 옮겼습니다.
theological_decisions:
- issue: 예복의 성격을 얼마나 구체화할지
  chosen_reading: 거룩한 예복
  alternative_readings:
  - 제사장 예복
  - 성소의 예복
  rationale: 원문은 ‘거룩한’ 옷이라고만 하고 제사장용이라고 명시하지 않으므로, 문맥이 시사하는 공식적 성복의 가능성은 살리되 더 강한 제도적 해석은 피했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
- issue: κύριος의 번역
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 주인
  rationale: 기도 장면에서 κύριος는 하나님께 대한 경외적 호칭으로 기능하므로, 프로젝트 기본어인 ‘주님’을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → 주님'
