base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/060.yaml
  text: And the priests and the Levites who had received the silver and the gold and the vessels brought them to Jerusalem, into the temple of the Lord.
  footnotes:
  - marker: a
    text: The Hebrew parallel reads, 'to bring [them] to Jerusalem, to the house of our God.' The Greek of 1 Esdras instead reads, 'brought [them] ... into the temple of the Lord.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리하여 제사장들과 레위 사람들은 은과 금과 기물들을 받아 예루살렘 곧 주님의 성전으로 가져갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 병행은 ‘예루살렘으로, 우리 하나님의 집으로 가져가다’로 읽습니다. 1 Esdras의 그리스어는 대신 ‘주님의 성전으로’라고 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ ἱερεῖς καὶ οἱ Λευεῖται
  english_pob_choice: the priests and the Levites
  chosen_korean: 제사장들과 레위 사람들
  alternatives_korean:
  - 제사장들과 레위인들
  - 제사장들과 레위 사람들
  lexicon: BDAG
  rationale: 두 직분 집단을 평이하게 드러내기 위해 표준적인 한국어 복수 표현을 사용했습니다.
- source_word: παραλαβόντες
  english_pob_choice: who had received
  chosen_korean: 받아
  alternatives_korean:
  - 받은
  - 수령한
  lexicon: BDAG
  rationale: 이 분사구는 뒤의 운반 동작보다 앞선 수령을 가리키므로, 한국어에서는 동작의 선후가 자연스럽게 드러나도록 ‘받아’로 옮겼습니다.
- source_word: τὸ ἀργύριον καὶ τὸ χρυσίον καὶ τὰ σκεύη
  english_pob_choice: the silver and the gold and the vessels
  chosen_korean: 은과 금과 기물들을
  alternatives_korean:
  - 은과 금과 그릇들을
  - 은과 금과 성전 기물들을
  lexicon: BDAG
  rationale: ἱερόν 문맥의 τὰ σκεύη는 단순한 일반 물건이 아니라 성전 관련 기물로 이해되므로, ‘기물들’로 넓되 성전 문맥을 과도하게 보충하지는 않았습니다.
- source_word: ἤνεγκαν εἰς τὸ ἱερὸν τοῦ κυρίου
  english_pob_choice: brought them into the temple of the Lord
  chosen_korean: 주님의 성전으로 가져갔습니다
  alternatives_korean:
  - 주님의 성전 안으로 가져갔습니다
  - 주님의 성전으로 들여갔습니다
  lexicon: BDAG
  rationale: εἰς + 목적지는 ‘~으로’가 가장 자연스럽고, ἱερόν은 한국어 성경에서 통용되는 ‘성전’이 가장 분명합니다.
- source_word: ἐν Ἰερουσαλήμ
  english_pob_choice: to Jerusalem
  chosen_korean: 예루살렘
  alternatives_korean:
  - 예루살렘으로
  - 예루살렘에서
  lexicon: BDAG
  rationale: 본문의 이동 방향과 병행 히브리어 전승을 고려해 지명은 문장 안에서 자연스럽게 목적지로 읽히도록 배치했습니다.
theological_decisions:
- issue: κύριος의 번역과 병행 전승 차이
  chosen_reading: 주님
  alternative_readings:
  - 하나님
  - 우리 하나님
  rationale: 그리스어 본문은 τοῦ κυρίου를 가지므로 주님의 성전으로 옮기고, 히브리어 병행의 ‘우리 하나님의 집’과는 동일시하지 않고 그대로 차이를 보존했습니다.
  doctrine_reference: 'POB contested-terms principle: original-language primacy with transparent preservation of alternatives'
