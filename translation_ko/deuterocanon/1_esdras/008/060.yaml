    rationale: 그리스어는 예루살렘과 주님의 성전을 동격으로 제시하지 않습니다. ἐν Ἰερουσαλήμ을 ‘예루살렘에 있는’으로 반영하여 장소 표현의 모호하지 않은 문법적 기능을 보존해야 합니다.
  - severity: medium
    issue: 각주가 그리스어의 예루살렘 관련 읽기를 생략함
    rationale: 현 각주는 그리스어가 단지 ‘주님의 성전으로’라고만 말한다고 하지만, 제시된 그리스어에는 ἐν Ἰερουσαλήμ도 있습니다. MT 병행의 ‘예루살렘으로’와 그리스어의 ‘예루살렘에 있는’의 차이를 밝혀야 합니다.
