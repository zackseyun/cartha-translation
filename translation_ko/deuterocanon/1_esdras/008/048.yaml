translation:
  language: ko
  text: 하누나이의 아들들과 그들의 아들들 가운데서 스무 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존 그리스어 본문은 ‘하누나이의 아들들과 그들의 아들들 가운데서 스무 명’이라고 읽습니다. 대략적으로 대응하는 히브리어 본문은 느헤미야 8:19(마소라 본문과 에스라-느헤미야의 번호는 전통에 따라 다름)에서 므라리 자손인 하사뱌와 그와 함께한 여사야, 그의 형제들과 그들의 아들들, 스무 명을 말합니다.
    reason: textual_variant
lexical_decisions:
- source_word: οἱ ἐκ τῶν υἱῶν Χανουναίου
  english_pob_choice: from the sons of Hanunai
  chosen_korean: 하누나이의 아들들
  alternatives_korean:
  - 하누나이의 아들들 가운데서
  - 하누나이의 아들들에게서
  lexicon: LSJ
  rationale: ἐκ + 속격은 집단 안에서 나온/속한 사람들을 가리키므로, 한국어에서는 소속 관계를 자연스럽게 드러내는 ‘~의 아들들’로 옮겼습니다.
- source_word: οἱ υἱοὶ αὐτῶν
  english_pob_choice: their sons
  chosen_korean: 그들의 아들들
  alternatives_korean:
  - 그 아들들
  - 그들의 자손들
  lexicon: LSJ
  rationale: αὐτῶν이 복수이므로 단수 소유격으로 평준화하지 않고, 직역에 가까운 ‘그들의 아들들’을 유지했습니다.
- source_word: εἴκοσι ἄνδρες
  english_pob_choice: twenty men
  chosen_korean: 스무 명
  alternatives_korean:
  - 스무 남자
  - 스무 사람
  lexicon: LSJ
  rationale: ἄνδρες는 남성 집계 표현이지만, 한국어 성경 문맥에서는 수량 명사 ‘명’이 가장 자연스럽고 목록형 기록의 성격을 잘 살립니다.
- source_word: Χανουναίου
  english_pob_choice: Hanunai
  chosen_korean: 하누나이
  alternatives_korean:
  - 하누나이오
  - 하누네
  lexicon: modern transliteration
  rationale: 고유명사는 통용되는 음역보다 원음에 가까운 표기를 우선해 ‘하누나이’로 옮겼습니다.
theological_decisions:
- issue: 1 Esdras의 그리스어 본문과 히브리어 평행본문의 인물 목록 불일치
  chosen_reading: 본문은 그리스어의 ‘하누나이의 아들들과 그들의 아들들, 스무 명’에 따라 옮기고, 평행본 차이는 각주로 처리합니다.
  alternative_readings:
  - MT 평행의 하샤뱌와 예사야, 므라리 자손, 그들의 형제와 아들들, 스무 명
  rationale: 이 구절은 인물 식별이 달라지는 본문 차이가 크므로, 주요 본문은 원천 그리스어를 따르고 히브리어 평행은 보조 증거로만 남겨야 합니다.
  doctrine_reference: 'PHILOSOPHY.md: original-language primacy; 1 Esdras parallel handling'
