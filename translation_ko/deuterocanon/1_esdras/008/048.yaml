revisions:
- from: 하누나이의 아들들과 그들의 아들들은 스무 명이었습니다.[a]
  to: 하누나이의 아들들과 그들의 아들들 가운데서 스무 명이었습니다.[a]
  rationale: 그리스어 본문을 우선하여 하누나이 및 ‘그들의 아들들’을 유지하되, ἐκ의 집단 내 출신·선발 의미를 ‘가운데서’로 보완했습니다. 실질적으로 다른 인물·가문 구성을 제시하는 마소라 본문 평행은 본문에 조화시키지 않고 각주에 남겼으며, 그 요약은 제시된 히브리어의 소유 관계와 번호 체계의 유동성을 정확히 반영하도록 고쳤습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:09:44Z'
review_pass:
  verdict: revise
  source_fidelity: 본문 초안은 핵심 집단명과 수효를 충실히 옮겼으나, οἱ ἐκ τῶν의 ‘~가운데서/~로부터’라는 선발·출신 관계가 명시되지 않았습니다. 또한 각주의 히브리어 평행문 요약에서 ‘그의 형제들’에 해당하는 소유 관계가 ‘그들의 형제’로 바뀌었습니다.
  naturalness: ‘하누나이의 아들들과 그들의 아들들 가운데서 스무 명이었습니다’는 목록 문맥에서 자연스럽고, ‘가운데서’가 두 병렬 집단에 걸쳐 적용되어 그리스어의 ἐκ를 간결하게 드러냅니다.
  terminology: 하누나이는 그리스어 본문에 맞는 음역입니다. 각주 속 평행본문의 이름은 한국어 성경에서 널리 쓰이는 하사뱌, 여사야, 므라리로 통일하고, 마소라 본문의 소유 관계를 정확히 반영했습니다.
  issues:
  - severity: medium
    issue: 본문에서 ἐκ(‘~가운데서/부터’)의 의미가 빠졌습니다.
    rationale: ‘하누나이의 아들들과 그들의 아들들은’은 단순 주제 제시처럼 들리지만, 그리스어는 해당 가문 집단에서 뽑힌 사람들을 가리킵니다. ‘가운데서’를 보충하면 이 관계를 보존할 수 있습니다.
  - severity: medium
    issue: 각주의 히브리어 평행문에서 ‘그의 형제들’을 ‘그들의 형제’로 옮겼습니다.
    rationale: 제시된 히브리어의 אֶחָיו는 단수 소유 관계(‘그의 형제들’)이며, 뒤의 ‘그들의 아들들’과 구별되어야 합니다.
  - severity: low
    issue: 각주가 본문 번호 체계의 차이를 밝히지 않습니다.
    rationale: 영어 감사 기록은 느헤미야 8:19라는 대응 표시에 MT/에스라-느헤미야 번호 체계가 전통에 따라 다름을 명시합니다. 한국어 각주도 이 한정을 유지하는 것이 검증 가능성과 혼동 방지에 유익합니다.
