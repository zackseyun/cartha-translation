base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/026.yaml
  text: and he honored me before the kings and all his friends and nobles[a][b].
  footnotes:
  - marker: a
    text: Or 'before those who ruled as kings'; the Greek uses a participial form rather than the simple noun 'kings.'
    reason: lexical_alternative
  - marker: b
    text: '''Friends'' may refer to royal associates or courtiers, not necessarily intimate personal friends.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그는 왕들[a]과 그의 모든 친구들[b]과 귀족들 앞에서 나를 존귀하게 여겨 주셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕으로 다스리는 이들’; 그리스어는 단순 명사 ‘왕들’이 아니라 분사형을 사용합니다.
    reason: alternative_reading
  - marker: b
    text: ‘친구들’은 반드시 친밀한 개인적 친구라기보다 왕실 측근이나 궁정 인사들을 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἐτίμησεν
  english_pob_choice: honored
  chosen_korean: 높여 주었습니다
  alternatives_korean:
  - 존귀하게 여겼습니다
  - 존중해 주었습니다
  - 영예를 주었습니다
  lexicon: BDAG
  rationale: τιμάω는 ‘존귀하게 여기다/명예를 주다’의 뜻이므로, 관계적이고 공개적인 승격의 뉘앙스를 살려 ‘높여 주었습니다’로 옮겼습니다.
- source_word: ἔναντι
  english_pob_choice: before
  chosen_korean: 앞에서
  alternatives_korean:
  - 면전에서
  - 있는 앞에서
  - 보는 앞에서
  lexicon: BDAG
  rationale: 공적 청중 앞에서 행해진 행위를 나타내므로, 한국어에서는 자연스럽고 간결한 ‘앞에서’가 적절합니다.
- source_word: τῶν βασιλευόντων
  english_pob_choice: the kings
  chosen_korean: 모든 왕들
  alternatives_korean:
  - 통치하는 자들
  - 왕권을 행사하는 자들
  - 통치자들
  lexicon: BDAG
  rationale: 직역하면 ‘왕으로 다스리는 자들’이지만, 문맥상 왕족/왕권 인사들을 가리키는 표현으로 읽히므로 본문 의미를 살려 ‘왕들’로 옮기되, ‘모든’으로 복수를 분명히 했습니다.
- source_word: μεγιστάνων
  english_pob_choice: nobles
  chosen_korean: 귀족들
  alternatives_korean:
  - 대귀족들
  - 유력자들
  - 대신들
  lexicon: LSJ
  rationale: μεγιστάνες는 고위 귀인·귀족층을 가리키므로, 현대 한국어에서 가장 자연스럽고 위계감을 살리는 ‘귀족들’이 적절합니다.
theological_decisions:
- issue: 인물 호칭의 공적 위상 표현
  chosen_reading: 본문은 개인적 칭찬이 아니라 왕실과 귀인들 앞에서의 공개적 격상을 말합니다.
  alternative_readings:
  - 사적인 호의 표현
  - 단순한 예우
  rationale: ἔναντι와 복수 명사들의 조합은 공개적·정치적 맥락을 강하게 시사하므로, 그 긴장을 약화시키지 않도록 반영했습니다.
  doctrine_reference: 서사 문맥 해석
- issue: φίλων의 사회적 의미
  chosen_reading: ‘친구들’로 옮기되, 왕실 측근·궁정 인사일 가능성을 배제하지 않습니다.
  alternative_readings:
  - 궁정 신하들
  - 측근들
  - 친밀한 개인적 친구들
  rationale: English POB도 문화적 주석을 달아 단순한 사적 친구보다 왕실 연고 집단일 수 있음을 밝혔으므로, 본문은 직역을 유지하고 의미 범위를 열어 둡니다.
  doctrine_reference: 역사적 문맥 해석
