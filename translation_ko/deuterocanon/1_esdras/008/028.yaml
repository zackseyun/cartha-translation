base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/028.yaml
  text: And these are the leaders according to their fathers’ houses and their divisions[b][a], who went up with me from Babylon in the reign of Artaxerxes the king.
  footnotes:
  - marker: a
    text: Or, 'the chiefs' or 'the leaders' according to their fathers’ houses.' The Greek προηγούμενοι can suggest those at the head, and the Hebrew parallel supports a sense of clan heads.
    reason: lexical_alternative
  - marker: b
    text: The Greek reads 'their divisions,' while the Hebrew parallel has a genealogical expression ('their enrollment by genealogy' / 'their lineage'). The translation follows the Greek as the primary witness for 1 Esdras.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 이것들은 그들의 조상 가문들과 그들의 구분에 따른 우두머리들이며, 바빌론에서 나와 함께 올라온 자들로서 아르타크세르크세스 왕의 치세에 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '그들의 구분'이지만, 그리스어 μεριδαρχία는 조직된 분류·편제를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: κατὰ τὰς πατριὰς αὐτῶν은 보다 직역하면 '그들의 조상 가문들을 따라'입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι οἱ προηγούμενοι
  english_pob_choice: the leaders
  chosen_korean: 우두머리들
  alternatives_korean:
  - 지도자들
  - 선두에 선 이들
  - 수령들
  lexicon: LSJ
  rationale: οἱ προηγούμενοι는 단순히 먼저 간 사람이 아니라 앞에 서는 사람, 곧 집단의 선도자·우두머리라는 뜻을 담을 수 있어 이를 반영했습니다.
- source_word: κατὰ τὰς πατριὰς αὐτῶν
  english_pob_choice: according to their fathers’ houses
  chosen_korean: 그들의 조상 가문들에 따른
  alternatives_korean:
  - 그들의 아버지들의 집안에 따른
  - 그들의 족장 가문에 따른
  - 그들의 가족들에 따른
  lexicon: LSJ
  rationale: πατριά는 단순한 가족보다 혈통·가문 단위를 가리키므로, '조상 가문들'로 옮겨 족보적 뉘앙스를 살렸습니다.
- source_word: καὶ τὰς μεριδαρχίας
  english_pob_choice: and their divisions
  chosen_korean: 그들의 구분
  alternatives_korean:
  - 그들의 분할
  - 그들의 부서
  - 그들의 구획
  lexicon: LSJ
  rationale: 메리다르키아이는 조직된 분류나 구획을 가리키므로, 자연스러운 한국어로 '구분'을 택하되 행정적·편제적 느낌을 남겼습니다.
- source_word: ἐν τῇ βασιλείᾳ Ἀρταξέρξου τοῦ βασιλέως
  english_pob_choice: in the reign of Artaxerxes the king
  chosen_korean: 아르타크세르크세스 왕의 치세에
  alternatives_korean:
  - 아르타크세르크세스 왕의 통치 때에
  - 아르타크세르크세스 왕의 재위 동안
  - 아르타크세르크세스 왕국 안에서
  lexicon: LSJ
  rationale: 여기서 βασιλεία는 시간적 표현으로 쓰였으므로 '왕국'보다 '치세'가 더 정확하며, 왕의 통치 기간이라는 뜻을 분명히 합니다.
theological_decisions:
- issue: 이 구절의 명단 소개를 한국어에서 어떻게 시작할지
  chosen_reading: '''그리고 이것들은''으로 시작해 명단 도입의 지시성을 살렸습니다.'
  alternative_readings:
  - '''이들은'''
  - '''이 사람들은'''
  rationale: 원문의 οὗτοι는 목록을 가리키는 지시 표현이므로, 서술적이면서도 목록 도입 기능이 드러나는 표현을 택했습니다.
  doctrine_reference: 본문 이해/문학적 기능
- issue: ἀναβάντες의 방향성
  chosen_reading: '''올라온 자들''로 옮겨 예루살렘으로 올라가는 성경적 관용을 유지했습니다.'
  alternative_readings:
  - '''온 자들'''
  - '''떠나온 자들'''
  rationale: 바빌론에서 예루살렘으로의 이동은 성경 전반에서 '올라가다' 관용이 자연스럽고, 지리적·신학적 방향성을 함께 반영합니다.
  doctrine_reference: 성경적 지리 관용
