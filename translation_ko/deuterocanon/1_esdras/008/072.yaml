base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/072.yaml
  text: For our sins have multiplied beyond our heads[a], and our offenses have risen up to heaven.
  footnotes:
  - marker: a
    text: Or 'our errors,' 'our unwitting sins,' or 'our acts of ignorance.' The Greek distinguishes this term from 'sins' in the previous clause.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리의 죄가 우리 머리보다 더 많아졌고[a], 우리의 무지한 잘못들은 하늘에까지 올라갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리의 무지’나 ‘무지에서 비롯된 죄들’로도 옮길 수 있습니다. 그리스어는 앞의 ‘죄’와 구별되는 다른 용어를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτίαι
  english_pob_choice: sins
  chosen_korean: 죄
  alternatives_korean:
  - 허물
  - 죄악
  lexicon: BDAG
  rationale: ἁμαρτίαι의 기본 의미는 도덕적 잘못으로서의 ‘죄’이며, 문맥상 가장 직접적이고 자연스럽게 대응합니다.
- source_word: ἐπλεόνασαν
  english_pob_choice: have multiplied
  chosen_korean: 더 많아졌고
  alternatives_korean:
  - 증가했고
  - 불어났고
  lexicon: BDAG
  rationale: 수량이 크게 불어나는 이미지를 살리되, 한국어 합쇼체 문맥에서 읽기 자연스럽게 압축해 표현했습니다.
- source_word: ὑπὲρ τὰς κεφαλὰς ἡμῶν
  english_pob_choice: beyond our heads
  chosen_korean: 우리 머리보다 더
  alternatives_korean:
  - 우리 머리 위로
  - 우리 머리를 넘어
  lexicon: BDAG
  rationale: ‘머리를 넘어서는’ 압도적 무게의 비유를 살리면서도, 한국어에서는 ‘보다 더’가 가장 무난하게 원문 이미지를 전달합니다.
- source_word: ἄγνοιαι
  english_pob_choice: offenses / ignorances
  chosen_korean: 무지한 잘못들
  alternatives_korean:
  - 무지들
  - 알지 못한 죄들
  - 무지로 인한 허물
  lexicon: BDAG
  rationale: ἄγνοιαι는 ‘무지’ 자체보다 무지에서 비롯된 잘못의 뉘앙스가 있으므로, 앞절의 ‘죄’와 구별을 유지하면서도 한국어에서 어색한 ‘무지들’을 피했습니다.
- source_word: ὑπερήνεγκαν ἕως τοῦ οὐρανοῦ
  english_pob_choice: have risen up to heaven
  chosen_korean: 하늘에까지 올라갔습니다
  alternatives_korean:
  - 하늘까지 치솟았습니다
  - 하늘에까지 이르렀습니다
  lexicon: LSJ
  rationale: 위로 올라가는 동적 이미지를 살려 ‘올라갔습니다’로 옮기고, 목적지인 οὐρανός는 한국어 성경 문맥에 맞게 ‘하늘’로 렌더링했습니다.
theological_decisions:
- issue: ἁμαρτίαι와 ἄγνοιαι의 구별을 한국어에서 유지할지 여부
  chosen_reading: 앞절은 ‘죄’, 뒷절은 ‘무지한 잘못들’로 구분하여 번역했습니다.
  alternative_readings:
  - 둘 다 ‘죄’로 통일하기
  - 둘 다 ‘허물’로 넓게 번역하기
  rationale: 그리스어는 서로 다른 두 용어를 병렬로 사용해 죄책의 중첩을 강조하므로, 한국어에서도 의미 차이를 어느 정도 드러내는 편이 원문 충실성에 더 부합합니다.
  doctrine_reference: 'Translation philosophy: source transparency and lexical distinction'
