lexical_decisions:
- source_word: τοῖς υἱοῖς ὑμῶν
  english_pob_choice: to your sons
  chosen_korean: 너희 자손에게
  alternatives_korean:
  - 너희 아들들에게
  - 너희 아들들에게
  - 너희 자녀들에게
  lexicon: LSJ
  rationale: 직역상 ‘아들들’이 가능하지만, 한국어에서는 소유격 목적어로 자연스럽고 포괄적인 ‘자손’이 문맥 없는 단편 구절에서 가장 무난합니다. 다만 여성성을 넓히는 ‘자녀들’은 원문의 υἱοῖς(남성 복수)를 약화하므로 채택하지 않았습니다.
- source_word: ἕως αἰῶνος
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 끝없이
  - 세세토록
  - 영구히
  lexicon: LSJ
  rationale: 관용구가 지속의 의미를 나타내므로 현대 한국어의 자연스러운 대응인 ‘영원히’로 옮겼습니다. 문어적이지만 의미를 가장 직접적으로 보존합니다.
theological_decisions:
- issue: 파편적 그리스어 본문 처리
  chosen_reading: 남아 있는 그리스어 단편을 그대로 ‘너희 자손에게 영원히.’로 번역했습니다.
  alternative_readings:
  - 더 긴 히브리어 평행본문을 따라 문장을 복원함
  - 의미를 보강해 완전한 문장으로 재구성함
  rationale: 이 절의 제시된 주 본문은 짧은 그리스어 단편이며, 병행 히브리어는 다른 더 긴 문맥이므로 본문을 덮어쓰지 않았습니다. 원문 증거의 경계를 보존하는 것이 우선입니다.
