base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/021.yaml
  text: Let it be done according to the law of God for God Most High[b][a], so that wrath may not come upon the kingdom of the king and his sons.
  footnotes:
  - marker: a
    text: Or 'Let it be carried out according to the law of God for the Most High God.' The Greek imperative can emphasize full execution or completion.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew parallel in Ezra 7:23 differs substantially at this point and emphasizes supplying specified amounts for temple service; 1 Esdras here preserves a shorter Greek formulation. The translation follows the Greek as the primary witness.
    reason: textual_variant
translation:
  language: ko
  text: 하나님의 법에 따라 지극히 높으신 하나님을 위하여 시행되게 하십시오. 왕과 그의 아들들의 나라에 진노가 임하지 않도록 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님의 법에 따라 지극히 높으신 하나님을 위하여 이행되게 하십시오.” 그리스어 수동 명령형은 수행·이행 또는 완수의 뉘앙스를 지닐 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 병행본문(에스라 7:23)은 이 지점에서 내용이 크게 달라, 성전 봉사에 필요한 물품의 수량을 열거합니다. 이 절의 번역은 짧은 그리스어 형식을 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: κατὰ τὸν τοῦ θεοῦ νόμον
  english_pob_choice: according to the law of God
  chosen_korean: 하나님의 법대로
  alternatives_korean:
  - 하나님의 율법에 따라
  - 하나님의 법에 맞게
  lexicon: BDAG
  rationale: κατὰ는 기준·준거를 나타내므로 한국어는 자연스럽게 '-대로'로 옮기되, νόμος는 여기서 하나님의 binding standard이어서 '법'보다 교회적 관용어인 '율법'도 가능하지만, 행정적·공적 문맥을 살려 '법'으로 간결하게 표현했습니다.
- source_word: ἐπιτελεσθήτω
  english_pob_choice: let it be done
  chosen_korean: 그렇게 행하게 하십시오
  alternatives_korean:
  - 행해지게 하십시오
  - 이행되게 하십시오
  - 수행되게 하십시오
  lexicon: BDAG
  rationale: 수동 명령형은 '완수되다/이행되다'의 뉘앙스를 가지므로, 왕령 문맥에서 자연스러운 명령으로 풀어 '행하게 하십시오'로 옮겼습니다. 과도한 강조는 피하되, 실행·이행의 요구를 살렸습니다.
- source_word: τῷ θεῷ τῷ ὑψίστῳ
  english_pob_choice: for God Most High
  chosen_korean: 지극히 높으신 하나님께
  alternatives_korean:
  - 가장 높으신 하나님께
  - 지극히 높으신 하나님을 위해
  lexicon: BDAG
  rationale: 여격은 수혜·향방을 나타내므로 한국어에서는 '-께'가 가장 자연스럽습니다. τῷ ὑψίστῳ는 정형화된 칭호를 살려 '지극히 높으신 하나님'으로 옮겼습니다.
- source_word: ὀργὴν
  english_pob_choice: wrath
  chosen_korean: 진노
  alternatives_korean:
  - 분노
  - 노여움
  lexicon: BDAG
  rationale: 문맥상 단순 감정보다 심판적·위협적 어감을 지닌 표현이므로 '진노'가 가장 적절합니다. 하나님 관련 문맥의 중량감을 보존합니다.
- source_word: βασιλείαν τοῦ βασιλέως καὶ τῶν υἱῶν
  english_pob_choice: the kingdom of the king and his sons
  chosen_korean: 왕과 그의 아들들의 나라
  alternatives_korean:
  - 왕의 왕국과 그의 아들들
  - 왕과 그의 아들들의 왕국
  lexicon: BDAG
  rationale: βασιλείαν은 '나라/왕국'을 뜻하므로 '나라'로 옮겼고, 뒤의 γενitive 연결을 한국어 어순에 맞춰 '왕과 그의 아들들의 나라'로 구성했습니다. 본문은 단수형 '왕국/나라'를 유지해야 하므로 복수 개념으로 풀지 않았습니다.
