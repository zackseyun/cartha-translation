  rationale: 본문은 하나님의 법과 지극히 높으신 하나님을 함께 언급하므로, ὀργή는 단순 정치적 불편보다 심판적 진노로 읽는 것이 가장 자연스럽습니다. 다만 본문이 그 진노의 주체를 길게 해설하지 않으므로 그 긴장은 그대로 두었습니다.
