  language: ko
  text: 그리고 예루살렘에 야훼께 드릴 예물[a], 곧 나와 내 친구들이 서원한 것과 바빌로니아 땅에서 찾을 수 있는 모든 금과 은을 야훼를 위하여 예루살렘으로 가져가게 하십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘헌물’; 그리스어 δῶρα는 이 문맥에서 제의적 의미를 지닐 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 구문은 그리스어에서 압축되어 있습니다. 직역하면 ‘야훼께 예루살렘으로/안으로’이며, 뜻은 예루살렘에서 야훼를 위해 지정된 자원이라는 의미입니다.
    reason: lexical_alternative
