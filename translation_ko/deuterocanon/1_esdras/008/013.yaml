theological_decisions:
- issue: κυρίῳ의 번역과 여호와/야훼 표기
  chosen_reading: 이 문맥의 κύριος는 성전 예물의 수신자인 이스라엘의 하나님을 가리키므로 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 주
  rationale: 정경 밖이지만 유대교 성경 전승의 맥락에서 헌물의 대상은 인간 군주가 아니라 하나님이며, 본 프로젝트의 기본 용례에 따라 야훼를 사용합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יהוה / YHWH → 야훼'
- issue: δῶρα와 ηὔξαμην의 종교적 강도
  chosen_reading: ‘예물’과 ‘서원한 것’으로 옮겨, 단순한 선물이나 일반적 약속보다 하나님께 대한 헌납·서약의 성격을 드러냈습니다.
  alternative_readings:
  - 선물
  - 약속한 것
  rationale: 본문은 예루살렘 성전 맥락의 헌납을 말하므로, 희석된 표현보다 제의적 의미를 살리는 번역이 원문의 의도를 더 잘 반영합니다.
  doctrine_reference: 1 Esdras 8:13 cultic context
