translation:
  language: ko
  text: 또한 나와 내 친구들이 서원한 야훼께 드릴 예물과 바빌로니아 땅에서 찾을 수 있는 모든 금과 은을 야훼를 위하여 예루살렘으로 가져가는 것[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘헌물’; 그리스어 δῶρα는 이 문맥에서 제의적 의미를 지닐 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 구문은 그리스어에서 압축되어 있습니다. 직역하면 ‘야훼를 위하여 예루살렘으로/안으로’이며, 예루살렘의 야훼를 위하여 마련된 자원이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
