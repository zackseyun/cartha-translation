    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ συμβαίνοντα πάντα
  english_pob_choice: everything that happens
  chosen_korean: 우리에게 닥치는 모든 일
  alternatives_korean:
  - 우리에게 일어나는 모든 일
  - 우리에게 닥쳐오는 모든 일
  lexicon: LSJ
  rationale: 포괄성(πάντα)과 사건성(συμβαίνοντα)을 함께 살리면서, 현대 한국어에서 자연스러운 표현으로 옮겼습니다.
- source_word: ἡμῖν γίνεται
  english_pob_choice: comes to us / happens to us
  chosen_korean: 우리에게 닥칩니다
  alternatives_korean:
  - 우리에게 일어납니다
  - 우리에게 일어납니다
  lexicon: BDAG
  rationale: γίνεται는 결과로 ‘생기다/일어나다’의 넓은 뜻을 가지지만, 앞의 사건 표현과 중복을 피하면서 수동적으로 닥쳐오는 뉘앙스를 살렸습니다.
- source_word: διὰ τὰ ἔργα ἡμῶν τὰ πονηρὰ
  english_pob_choice: because of our evil deeds
  chosen_korean: 우리에게 속한 악한 행위 때문입니다
  alternatives_korean:
  - 우리의 악한 행위 때문에
  - 우리의 악한 일들 때문에
  lexicon: BDAG
  rationale: διά + 대격의 원인 관계를 분명히 하되, ἔργα의 행위를 ‘행위’로, πονηρά의 도덕적 악을 ‘악한’으로 반영했습니다.
- source_word: τὰς μεγάλας ἁμαρτίας
  english_pob_choice: our great sins
  chosen_korean: 우리의 큰 죄들
  alternatives_korean:
  - 우리의 중대한 죄들
  - 우리의 큰 죄
  lexicon: BDAG
  rationale: μεγάλας의 문자적 의미인 ‘큰’(규모·중대성)을 보존하여, 해석을 덜 가하고 직역성을 유지했습니다.
theological_decisions:
- issue: 원인 진술의 직접성
  chosen_reading: 이 일들은 백성의 악한 행위와 큰 죄들 때문에 생겼다고 직접 말합니다.
  alternative_readings:
  - 원인 관계를 다소 완화한 표현
  - 죄의 결과라는 점을 암시적으로만 드러내는 표현
  rationale: 그리스어는 διά + 대격으로 분명한 원인 관계를 제시하므로, 죄책의 고백을 약화하지 않고 그대로 드러내는 것이 원문에 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
