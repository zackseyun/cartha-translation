lexical_decisions:
- source_word: ἐνετράπην
  english_pob_choice: I was ashamed
  chosen_korean: 부끄러웠습니다
  alternatives_korean:
  - 수치스러웠습니다
  - 당황스러웠습니다
  lexicon: BDAG
  rationale: 이 동사는 단순한 감정 난처함보다 ‘부끄러움/수치’의 뉘앙스를 띠므로, 요청하기를 주저한 내적 상태를 자연스러운 합쇼체로 옮겼습니다.
- source_word: ἵππεις
  english_pob_choice: horsemen
  chosen_korean: 기병
  alternatives_korean:
  - 말 탄 병사들
  - 마병
  lexicon: LSJ
  rationale: 문맥상 단순한 승마인이 아니라 군사 호위대이므로, 한국어에서는 군사적 기능이 분명한 ‘기병’이 가장 정확합니다.
- source_word: πεζοὺς
  english_pob_choice: foot soldiers
  chosen_korean: 보병
  alternatives_korean:
  - 도보 병사들
  - 보병대
  lexicon: LSJ
  rationale: ἵππεις와의 대조를 살리기 위해 ‘보병’으로 간결하게 옮겼습니다.
- source_word: προπομπὴν
  english_pob_choice: as an escort
  chosen_korean: 호위로서
  alternatives_korean:
  - 호송대로
  - 호위대로
  lexicon: LSJ
  rationale: 여기서는 ‘동반하는 호위’의 기능이 핵심이므로, 현대 한국어에서 자연스러운 ‘호위로서’가 문맥을 잘 드러냅니다.
- source_word: τῆς πρὸς τοὺς ἐναντίους ἡμῖν
  english_pob_choice: against those hostile to us
  chosen_korean: 우리에게 적대하는 자들에 맞서
  alternatives_korean:
  - 우리의 적들에 맞서
  - 우리에게 반대하는 자들에 맞서
  lexicon: LSJ
  rationale: ἐναντίους는 단순한 ‘적’보다 ‘적대하는 자들/대항하는 자들’의 성격이 있어, 관계성을 살려 번역했습니다.
theological_decisions:
- issue: 군사적 호위 요청을 두려워하고 부끄러워한 서술의 톤
  chosen_reading: 화자가 자기 의존 대신 하나님 앞에서의 태도와 공동체의 안전을 의식하며 호위 요청을 꺼린 것으로 옮겼습니다.
  alternative_readings:
  - 단순한 행정적 요청을 망설인 것으로 약화하여 옮기기
  - ‘수치’보다 ‘난처함’ 중심으로 중화하기
  rationale: 본문은 실제로 군사 호위를 요청하는 행위에 대한 부끄러움을 말하므로, 그 도덕적·정서적 긴장을 약화시키지 않는 것이 원문에 충실합니다.
  doctrine_reference: source-text sensitivity; translation philosophy on preserving rhetorical force
