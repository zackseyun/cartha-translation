base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/087.yaml
  text: Lord of Israel, you are true; for we have been left as a root to this day.
translation:
  language: ko
  text: 이스라엘의 주님, 주님은 참되십니다. 우리가 오늘까지 뿌리처럼 남겨졌기 때문입니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 직역하면 ‘뿌리’입니다. 본문은 ‘남은 자’가 아니라 생존의 최소 상태를 비유적으로 말합니다.
    reason: source_note
lexical_decisions:
- source_word: κύριε τοῦ Ἰσραήλ
  english_pob_choice: Lord of Israel
  chosen_korean: 이스라엘의 주님
  alternatives_korean:
  - 이스라엘의 하나님
  - 이스라엘의 주
  lexicon: κύριος
  rationale: 호격이므로 ‘이스라엘의 주님’으로 자연스럽게 옮기되, 본문이 하나님께 직접 부르는 말이라는 점을 살렸습니다.
- source_word: ἀληθινὸς εἶ
  english_pob_choice: you are true
  chosen_korean: 주님은 참되십니다
  alternatives_korean:
  - 주님은 진실하십니다
  - 주님은 참이십니다
  lexicon: ἀληθινός
  rationale: 인격적 진실성보다는 하나님의 참되심을 말하는 표현이므로, 한국어 성서 문체에서 자연스러운 ‘참되십니다’를 택했습니다.
- source_word: ῥίζα
  english_pob_choice: root
  chosen_korean: 뿌리처럼
  alternatives_korean:
  - 뿌리
  - 남은 자
  - 잔존자
  lexicon: ῥίζα
  rationale: 영어 POB가 ‘a root’로 유지한 이미지를 따라, 단순 생존이나 ‘남은 자’로 평탄화하지 않고 비유적 이미지를 보존했습니다.
- source_word: ἐν τῇ σήμερον
  english_pob_choice: to this day
  chosen_korean: 오늘까지
  alternatives_korean:
  - 이 날까지
  - 지금까지
  lexicon: σήμερον
  rationale: ‘오늘’의 시간 표지를 한국어 관용에 맞게 확장해 ‘오늘까지’로 옮겨 현재까지 이어진 상태를 분명히 했습니다.
theological_decisions:
- issue: ῥίζα를 ‘남은 자’로 해석할지, 이미지대로 유지할지
  chosen_reading: ‘뿌리처럼 남겨졌기 때문입니다’로 옮겨 이미지와 비유성을 유지했습니다.
  alternative_readings:
  - 우리가 남은 자로 남겨졌기 때문입니다
  - 우리가 뿌리 하나만 남게 되었기 때문입니다
  rationale: 본문의 직접 어휘는 ‘뿌리’이며, 영어 POB도 ‘remnant’로 바꾸지 않고 ‘root’를 유지했습니다. 따라서 해석적 평탄화보다 원문 이미지를 보존하는 편이 더 충실합니다.
  doctrine_reference: 성경적 잔존 개념과 언어적 이미지의 구분
