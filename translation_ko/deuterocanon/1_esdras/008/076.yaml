base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/076.yaml
  text: and to reveal a lamp for us in the house of our Lord[a], to give us food in the time of our slavery; and while we were enslaved[c][b], we were not forsaken
  footnotes:
  - marker: a
    text: Or 'to reveal a light for us'; the Greek literally says 'to uncover a lamp/light for us,' an image of renewed light in the Lord's house.
    reason: lexical_alternative
  - marker: b
    text: '''House of our Lord'' refers to the temple.'
    reason: cultural_note
  - marker: c
    text: Or 'in the time of our servitude' / 'while we were serving.' The Greek uses the δουλεία word group in both clauses.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 우리를 위하여 우리 주의 집 안에 등불을 드러내시고, 우리에게 우리의 노예 상태의 때에 먹을 것을 주시며, 우리가 노예로 있을 때에도 버려지지 않으셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘등불’은 ‘빛’으로도 옮길 수 있습니다. 헬라어는 문자적으로는 ‘덮개를 벗겨 드러내다’는 뜻을 통해 빛의 회복 이미지를 전합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘우리 주의 집’은 성전을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 이 구절의 예속 어휘는 ‘노예 상태/노예로 있음’의 뜻을 지닙니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνακαλύψαι φωστῆρα
  english_pob_choice: to uncover a lamp / reveal a lamp
  chosen_korean: 등불을 드러내시고
  alternatives_korean:
  - 등불을 밝히시고
  - 빛을 드러내시고
  - 등잔을 드러내시고
  lexicon: LSJ
  rationale: ἀνακαλύψαι는 문자적으로 ‘덮개를 벗겨 드러내다/드러내 보이다’의 뜻이어서, ‘드러내시고’로 영상성을 살렸습니다. φωστῆρα는 이 문맥에서 빛을 내는 구체적 대상이므로 ‘등불’이 가장 자연스럽고 구체적입니다.
- source_word: οἶκῳ τοῦ κυρίου ἡμῶν
  english_pob_choice: house of our Lord
  chosen_korean: 우리 주의 집 안에
  alternatives_korean:
  - 우리 주님의 집에
  - 우리 주의 성전에
  - 우리 주의 집에
  lexicon: LSJ
  rationale: Greek의 직접 표현인 ‘우리 주의 집’을 살리되, 문맥상 내부 공간을 드러내기 위해 ‘안에’를 보탰습니다. ‘성전’은 해석을 더한 표현이므로 본문에는 두지 않았습니다.
- source_word: δουλείας / δουλεύειν
  english_pob_choice: slavery / enslaved
  chosen_korean: 노예 상태의 때 / 노예로 있을 때
  alternatives_korean:
  - 종살이의 때 / 종살이할 때
  - 노예 생활의 때 / 종살이하던 때
  - 속박의 때 / 속박받을 때
  lexicon: LSJ
  rationale: 이 단어군은 단순한 봉사보다 강한 예속 상태를 가리키므로, 본 프로젝트 기본어인 ‘노예’를 사용해 강도를 유지했습니다. 시간표현에서는 자연스러운 한국어가 되도록 ‘때’와 ‘있을 때’를 조합했습니다.
- source_word: ἐγκατελείφθημεν
  english_pob_choice: we were not forsaken
  chosen_korean: 버려지지 않으셨습니다
  alternatives_korean:
  - 버림받지 않았습니다
  - 떠나지 않으셨습니다
  - 저버림당하지 않았습니다
  lexicon: LSJ
  rationale: 주어가 공동체를 포함하는 1인칭 복수이므로, 한국어에서는 능동적 존대 대신 수동 표현으로 ‘버려지지 않았습니다’가 가장 직접적입니다. ‘forsaken’의 언약적 뉘앙스는 ‘버려지다’가 잘 전달합니다.
theological_decisions:
- issue: δουλεία 계열을 한국어에서 어떻게 처리할지
  chosen_reading: ‘노예’로 일관해 예속의 강도를 드러냈습니다.
  alternative_readings:
  - 종살이
  - 속박
  - 종노릇
  rationale: 이 구절은 단순한 섬김이 아니라 억압적 예속 상태를 말하므로, 완화된 표현보다 ‘노예’가 본문의 현실성을 더 정확히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: contested terms table for δοῦλος-family terms'
- issue: ‘우리 주의 집’을 ‘성전’으로 풀어쓸지 여부
  chosen_reading: 본문에는 ‘우리 주의 집’을 유지했습니다.
  alternative_readings:
  - 성전
  - 성전 안에
  rationale: 독자에게는 성전으로 이해되겠지만, 원문은 해석어보다 은유적·직접적 표현인 ‘집’을 사용합니다. 본문은 원문 이미지를 보존하고, 의미 이해는 문맥에 맡기는 편이 적절합니다.
  doctrine_reference: Translation philosophy §1, §5
