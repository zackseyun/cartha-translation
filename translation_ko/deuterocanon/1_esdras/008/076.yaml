  source_fidelity: 핵심 어휘와 절의 관계는 대체로 원문에 충실합니다. ἀνακαλύψαι φωστῆρα는 ‘등불을 드러내시고’로, τροφή는 ‘먹을 것’으로, 두 δουλεία 계열은 ‘노예 상태/노예로 있음’으로 적절히 옮겼습니다. 다만 마지막 ἐγκατελείφθημεν은 ‘우리가 버림받지 않았다’라는 수동 과거이므로, 초안의 ‘버려지지 않으셨습니다’는 공동체를 높이는 부적절한 높임 표현이자 주어 표지상 어색합니다.
  naturalness: ‘우리에게 우리의 노예 상태의 때에’는 현대 한국어에서 부자연스럽습니다. ‘우리가 노예 상태에 있던 때에 우리에게’로 정리하면 의미와 문체가 모두 자연스럽습니다. 또한 각주 표지는 해당 어휘 바로 뒤에 두는 편이 독자의 이해와 각주 연결에 적절합니다.
  terminology: ‘등불’, ‘우리 주의 집’, ‘노예 상태’, ‘노예로 있음’, ‘버림받지 않았습니다’는 원문의 이미지, 예속 어휘의 반복, 그리고 ἐγκαταλείπω의 의미를 잘 보존합니다. ‘우리 주의 집’은 본문에서 유지하고 성전이라는 지시는 각주로 처리하는 것이 적절합니다.
