base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/067.yaml
  text: They took some of their daughters as wives for themselves and for their sons[a], and the holy seed was mixed with the foreign nations of the land[b]; and the leaders and the nobles shared in this lawlessness from the beginning of the matter.
  footnotes:
  - marker: a
    text: Or 'the holy offspring' or 'the holy line.' The Greek literally says 'the holy seed,' a covenantal metaphor for the people set apart to God.
    reason: lexical_alternative
  - marker: b
    text: Or 'participated in this transgression.' The Greek says 'shared in this lawlessness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 자기 딸들 가운데 일부를 자기들과 자기들의 아들들을 위해 아내로 맞이하였고[a], 거룩한 씨가 그 땅의 이방 민족들과 뒤섞였으며[b], 이 불법의 시작부터 지도자들과 귀족들이 여기에 가담하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 딸들 가운데 일부를 아내로 맞이하였고’. 그리스어는 혼인 관계를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 땅의 이방 민족들 가운데 섞였으며’. 그리스어는 ‘섞이다/혼합되다’의 이미지를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῴκισαν τινας τῶν θυγατέρων αὐτῶν, καὶ αὐτοὶ καὶ οἱ υἱοὶ αὐτῶν
  english_pob_choice: took some of their daughters as wives for themselves and for their sons
  chosen_korean: 자기 딸들 가운데 일부를 자기들과 자기들의 아들들을 위해 아내로 맞이하였고
  alternatives_korean:
  - 결혼시켰고
  - 자기 딸들 가운데 일부를 데려와 살게 하였고
  lexicon: LSJ
  rationale: 혼인 맥락을 분명히 드러내면서도, 그리스어의 관계적 의미를 살려 ‘아내로 맞이하다’로 옮겼습니다.
- source_word: τὸ σπέρμα τὸ ἅγιον
  english_pob_choice: the holy seed
  chosen_korean: 거룩한 씨
  alternatives_korean:
  - 거룩한 후손
  - 거룩한 계보
  lexicon: LSJ
  rationale: ‘씨’는 문자적 비유를 보존하고, 언약적·민족적 함의를 흐리지 않으면서 POB의 핵심 표현을 가장 가깝게 살립니다.
- source_word: εἰς τὰ ἀλλογενῆ ἔθνη τῆς γῆς
  english_pob_choice: with the foreign nations of the land
  chosen_korean: 그 땅의 이방 민족들과 뒤섞였으며
  alternatives_korean:
  - 그 땅의 외국 민족들 가운데 섞였으며
  - 그 땅의 다른 민족들과 섞였으며
  lexicon: LSJ
  rationale: 혼합이라는 동사를 살리기 위해 ‘뒤섞이다’를 택했고, ἀλλογενῆ의 이방성은 ‘이방 민족들’로 반영했습니다.
- source_word: μετεῖχον
  english_pob_choice: shared in
  chosen_korean: 가담하였습니다
  alternatives_korean:
  - 참여하였습니다
  - 공유하였습니다
  lexicon: LSJ
  rationale: 여기서는 중립적 참여보다 죄책이 있는 연루를 드러내는 문맥이므로, ‘가담하다’가 원문의 책임성을 더 잘 전달합니다.
- source_word: τῆς ἀνομίας ταύτης
  english_pob_choice: this lawlessness
  chosen_korean: 이 불법
  alternatives_korean:
  - 이 무법
  - 이 율법 없음
  lexicon: LSJ
  rationale: ἀνομία의 핵심 의미인 ‘법/율법 없음’을 한국어의 강한 법적·도덕적 표현인 ‘불법’으로 옮겼습니다.
theological_decisions:
- issue: ‘거룩한 씨’의 의미를 설명적으로 풀지 여부
  chosen_reading: 언약적 비유를 유지한 채 ‘거룩한 씨’로 직역에 가깝게 옮기고, 추가 설명은 본문 밖으로 미뤘습니다.
  alternative_readings:
  - 거룩한 후손
  - 거룩한 계보
  rationale: 원문은 공동체를 거룩하게 구별된 존재로 묘사하지만, 그 의미를 민족·혈통 이론으로 확장하지 않습니다. 비유를 보존하는 것이 문맥의 긴장을 가장 잘 살립니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: ἀνομία의 윤리적 강도
  chosen_reading: ‘불법’으로 번역해 명시적 법·언약 위반의 성격을 유지했습니다.
  alternative_readings:
  - 죄악
  - 불의
  rationale: 본문은 단순한 실수나 일반적 악행이 아니라 명백한 반역/위반을 말하므로, 법적 강도가 있는 표현이 필요합니다.
  doctrine_reference: Translation philosophy §§1, 5
