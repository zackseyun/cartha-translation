  - marker: b
    text: 'The Greek wording is compressed at the end; literally it runs along the lines of ''to leave out nothing from the law of the Lord and from the commandments, all Israel, statutes and judgments.'' The translation makes explicit the likely sense: that he instructed all Israel in these legal matters.'
    reason: textual_variant
translation:
  language: ko
  text: 아삽아스는 큰 학식이 있어서 주님의 율법과 계명에서 아무것도 빠뜨리지 않고, 온 이스라엘에게 그 규례와 판단을 가르쳤습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 Ἀψάρας로 읽습니다. 히브리어 평행본문의 맥락은 에스라와 대응하지만, 여기서는 그리스어 증거를 우선했습니다.
    reason: source_note
  - marker: b
    text: 그리스어는 끝부분이 압축되어 있어, 한국어에서는 ‘온 이스라엘에게 그 규례와 판단을 가르쳤습니다’로 의미를 풀어 옮겼습니다.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀψάρας
  english_pob_choice: Apsaras
  chosen_korean: 아삽아스
  alternatives_korean:
  - 에스라
  lexicon: 고유명사 음역
  rationale: 주어진 그리스어 본문이 Ἀψάρας를 보존하므로, 히브리어 평행본문의 인물명과 조화시키지 않고 그 형태를 음역했습니다.
- source_word: πολλὴν ἐπιστήμην περιεῖχεν
  english_pob_choice: had great learning
  chosen_korean: 큰 학식이 있어서
  alternatives_korean:
  - 많은 지식을 지니고 있어서
  - 깊은 이해가 있어서
  lexicon: LSJ
  rationale: ἐπιστήμη는 지식·이해·학식을 가리키며, 여기서는 인물의 배움과 숙련을 함께 드러내는 ‘학식’이 자연스럽습니다.
- source_word: εἰς τὸ μηδὲν παραλείπειν
  english_pob_choice: so as to leave out nothing
  chosen_korean: 아무것도 빠뜨리지 않고
  alternatives_korean:
  - 하나도 빠뜨리지 않도록
  - 아무것도 생략하지 않고
  lexicon: LSJ
  rationale: παραλείπειν의 핵심은 빠뜨리거나 생략하지 않는다는 뜻이므로, 목적·결과를 살린 부사절로 옮겼습니다.
- source_word: δικαιώματα καὶ κρίματα
  english_pob_choice: the statutes and the judgments
  chosen_korean: 그 규례와 판단
  alternatives_korean:
  - 규례와 판결
  - 율례와 판결들
  lexicon: LSJ
  rationale: 이 둘은 성경적 법률 용어의 병렬로 이해되므로, 표준적인 ‘규례’와 ‘판단’으로 옮겨 법적·규범적 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 끝부분의 압축된 문장 구조
  chosen_reading: 마지막의 법적 용어들은 아삽아스가 온 이스라엘에게 가르친 내용으로 이해했습니다.
  alternative_readings:
  - 더 문자적으로는 ‘...에서 아무것도 빠뜨리지 않기 위해, 온 이스라엘, 규례와 판단’처럼 압축적으로 읽을 수 있습니다.
  rationale: 그리스어가 매우 압축되어 있어 한국어에서는 의미를 분명히 드러내는 편이 좋습니다. 이는 새로운 내용을 더하는 것이 아니라, 이미 내포된 교육적 의미를 풀어 쓴 것입니다.
  doctrine_reference: '번역 원칙: source-directed optimal equivalence'
