    rationale: 원문에는 ‘그’에 해당하는 지시어가 없고, κρίματα를 ‘판단’으로 하면 교육 내용인 법률 조항의 병렬 표현으로 다소 어색합니다. ‘규례와 판결’이 더 자연스럽고 원문의 법률적 의미를 보존합니다.
