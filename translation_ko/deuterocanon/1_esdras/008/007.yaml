base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/007.yaml
  text: For Apsaras had great learning[a], so as to leave out nothing from the law of the Lord and from the commandments[b], teaching all Israel the statutes and the judgments.
  footnotes:
  - marker: a
    text: 'Greek: ''Apsaras.'' The Hebrew parallel context corresponds to Ezra, but the primary Greek witness here preserves the name in this form.'
