translation:
  language: ko
  text: 그리고 요시야는 그곳에 있던 백성에게 어린양 서만 마리와 새끼 염소 서만 마리, 그리고 송아지 삼천 마리를 주었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘백성, 곧 발견된 자들’이라는 뜻이며, 문맥상 그 자리에 있던 사람들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 제시된 히브리어 병행본문은 이 그리스어 절과 정확히 일치하지 않으므로, 번역은 그리스어 본문을 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἐδωρήσατο
  english_pob_choice: gave
  chosen_korean: 주었습니다
  alternatives_korean:
  - 선물했습니다
  - 하사했습니다
  - 내주었습니다
  lexicon: LSJ
  rationale: 중간태 δωρέομαι의 ‘선물로 주다’라는 뜻을 살리면서도, 한국어에서는 문맥상 자연한 ‘주었습니다’가 가장 무리 없고 읽기 쉽습니다.
- source_word: τῷ λαῷ τοῖς εὑρεθέντι
  english_pob_choice: to the people who were present
  chosen_korean: 그곳에 있던 백성에게
  alternatives_korean:
  - 그곳에 모인 백성에게
  - 거기서 발견된 백성에게
  - 그곳에 있는 백성에게
  lexicon: LSJ
  rationale: 직역하면 ‘발견된/만나게 된’이지만, 문맥상 현장에 있던 참석자들을 가리키므로 ‘그곳에 있던’이 원뜻을 가장 잘 전달합니다.
- source_word: ἀρνῶν
  english_pob_choice: lambs
  chosen_korean: 어린양
  alternatives_korean:
  - 양
  - 새끼 양
  lexicon: LSJ
  rationale: 제물 목록의 구체성을 살리기 위해 일반적인 ‘양’보다 ‘어린양’이 더 직접적입니다.
- source_word: ἐρίφων
  english_pob_choice: young goats
  chosen_korean: 새끼 염소
  alternatives_korean:
  - 어린 염소
  - 염소 새끼
  lexicon: LSJ
  rationale: ἔριφος는 어린 염소를 뜻하므로, 현대 한국어에서 분명하고 자연한 ‘새끼 염소’로 옮겼습니다.
- source_word: μόσχους
  english_pob_choice: calves
  chosen_korean: 송아지
  alternatives_korean:
  - 송아지들
  - 어린 소
  lexicon: LSJ
  rationale: μόσχος는 어린 소를 가리키며, 한국어 성경에서도 익숙하고 정확한 ‘송아지’가 가장 적절합니다.
