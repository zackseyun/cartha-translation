base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/048.yaml
  text: And the God of their fathers sent by his angel to visit their people and to call them back[b][a], because he had compassion on them and on his dwelling place.
  footnotes:
  - marker: a
    text: Or 'through his messenger'; Greek ἄγγελος can mean either 'angel' or 'messenger.'
    reason: lexical_alternative
  - marker: b
    text: 'The opening Greek wording is unusual: literally, ''the King of their fathers, the God of their fathers.'' The translation preserves both titles rather than silently smoothing the text.'
    reason: textual_variant
translation:
  language: ko
  text: 그들의 조상들의 왕, 곧 그들의 조상들의 하나님께서는[b] 그분의 천사를[a] 보내어 그들의 백성을 돌보시고 그들을 다시 부르셨습니다. 이는 그분이 그들과 그분의 거처를 아끼셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 그리스어 ἄγγελος는 ‘천사’ 또는 ‘사자/전령’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 전승된 그리스어는 ‘그들의 조상들의 왕’과 ‘그들의 조상들의 하나님’을 연이어 둡니다. 본문은 이 특이한 이중 호칭을 보존합니다.
    reason: textual_variant
lexical_decisions:
- source_word: ὁ βασιλεὺς τῶν πατέρων αὐτῶν ὁ θεὸς τῶν πατέρων αὐτῶν
  english_pob_choice: the King of their fathers, the God of their fathers
  chosen_korean: 그들의 조상들의 왕이신 그들의 조상들의 하나님
  alternatives_korean:
  - 그들의 조상들의 하나님
  - 그들의 조상들의 왕, 그들의 조상들의 하나님
  lexicon: LSJ
  rationale: 전승된 그리스어의 이중 호칭을 지우지 않고 둘 다 살리기 위해, 앞의 βασιλεύς를 ‘왕’으로, 뒤의 θεός를 ‘하나님’으로 옮겼습니다.
- source_word: ἐπισκέψασθαι
  english_pob_choice: to visit
  chosen_korean: 돌보시고
  alternatives_korean:
  - 찾아오시고
  - 방문하시고
  lexicon: BDAG
  rationale: 문맥상 단순 방문보다 구원적 개입과 관심의 뉘앙스가 강하므로, 한국어에서는 ‘돌보다’가 가장 자연스럽게 기능합니다.
- source_word: διὰ τοῦ ἀγγέλου αὐτοῦ
  english_pob_choice: by his angel
  chosen_korean: 자기 천사를 통해
  alternatives_korean:
  - 자기 사자를 통해
  - 그분의 천사를 통해
  lexicon: BDAG
  rationale: ἄγγελος의 기본적 천사 의미를 살리되, 수단을 나타내는 διὰ를 자연스럽게 반영하기 위해 ‘통해’로 옮겼습니다.
- source_word: μετακαλέσαι αὐτούς
  english_pob_choice: to call them back
  chosen_korean: 그들을 다시 부르도록
  alternatives_korean:
  - 그들을 불러오도록
  - 그들을 소환하도록
  lexicon: LSJ
  rationale: 복합동사의 ‘다시/되돌아오게 부르다’는 의미를 살려, 포로 귀환·회복의 방향성을 드러냈습니다.
- source_word: τοῦ σκηνώματος αὐτοῦ
  english_pob_choice: his dwelling place
  chosen_korean: 자기 거처
  alternatives_korean:
  - 자기 장막
  - 자기 성막
  lexicon: LSJ
  rationale: σκῆνωμα는 문자적으로는 거처/장막이지만, 여기서는 하나님의 거하심을 가리키는 표현으로서 ‘거처’가 가장 과도하지 않고 넓게 대응합니다.
theological_decisions:
- issue: 천사/사자(ἀγγελος) 선택
  chosen_reading: ‘천사’로 옮기고 별도 주석 없이 본문을 유지했습니다.
  alternative_readings:
  - ‘사자’로 옮김
  - ‘메신저’로 옮김
  rationale: 이 구절은 신적 파송 문맥이므로 기본 의미인 ‘천사’를 취하는 것이 한국어 성경 독자에게도 가장 자연스럽고, 본문의 초월적 행위자를 보존합니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
- issue: ‘돌보시고’와 ‘불쌍히 여기셨기 때문입니다’의 결합
  chosen_reading: ἐπισκέψασθαι와 φείδομαι의 자비로운 개입을 두 절차로 나누어 표현했습니다.
  alternative_readings:
  - ‘방문하시고 … 아끼셨기 때문입니다’
  - ‘돌보시고 … 너그러이 여기셨기 때문입니다’
  rationale: 그리스어는 ‘찾아 돌보심’과 ‘아낌/긍휼’의 두 동사를 병렬로 두므로, 한국어에서도 구제적 방문과 긍휼의 이유를 분리해 살렸습니다.
  doctrine_reference: 'PHILOSOPHY.md: transparency and original-language primacy'
