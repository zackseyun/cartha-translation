revisions:
- from: 그들의 조상들의 왕이신 그들의 조상들의 하나님께서 자기 천사를 통해 그들의 백성을 돌보시고 그들을 다시 부르도록 보내셨으니, 이는 그분이 그들과 자기 거처를 불쌍히 여기셨기 때문입니다.[a][b]
  to: 그들의 조상들의 왕, 곧 그들의 조상들의 하나님께서는[b] 그분의 천사를[a] 보내어 그들의 백성을 돌보시고 그들을 다시 부르셨습니다. 이는 그분이 그들과 그분의 거처를 아끼셨기 때문입니다.
  rationale: 파송 동사의 목적어를 문맥상 명백한 ‘그분의 천사’로 명시하여 한국어 문장을 완결하면서, 그리스어의 이중 신적 호칭과 천사/사자라는 어휘적 가능성은 그대로 보존했습니다. ‘아끼셨기’는 φείδομαι의 자비·보호 의미를 유지하며 사람들과 하나님의 거처에 함께 자연스럽게 연결됩니다.
