base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/045.yaml
  text: And he did what was evil before the Lord[a], and he was not ashamed at the words spoken by Jeremiah the prophet from the mouth of the Lord.
  footnotes:
  - marker: a
    text: Or, 'he did not humble himself before the words spoken by Jeremiah the prophet from the mouth of the Lord.' The Hebrew parallel in 2 Chronicles 36:12 uses language of not humbling oneself, while 1 Esdras here speaks of not being ashamed or abashed.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 주님 앞에서 악한 일을 행하였고, 예레미야 선지자가 주님의 입에서 전한 말씀들 때문에 부끄러워하지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “예레미야 선지자가 주님의 입에서 전한 말씀들 앞에서 스스로 낮추지 않았습니다.” 히브리어 병행본문은 ‘스스로 낮추다’의 표현을 사용하지만, 여기서는 그리스어 본문의 ‘부끄러워하지 않다’에 맞춥니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐποίησεν τὸ πονηρόν
  english_pob_choice: did what was evil
  chosen_korean: 악한 일을 행하였고
  alternatives_korean:
  - 악을 행하였고
  - 악한 일을 했고
  lexicon: LSJ
  rationale: 관용구로서의 ‘did what was evil’를 한국어에서 자연스럽게 풀어, 단순히 ‘악을 했다’보다 행위의 성격을 분명히 했습니다.
- source_word: ἐνώπιον Κυρίου
  english_pob_choice: before the Lord
  chosen_korean: 주님 앞에서
  alternatives_korean:
  - 주님 앞에
  - 주님의 눈앞에서
  lexicon: LSJ
  rationale: ‘before’의 법정·언약적 뉘앙스를 살리면서도 현대 한국어에서 자연스러운 표현으로 옮겼습니다.
- source_word: οὐκ ἐνετράπη
  english_pob_choice: he was not ashamed
  chosen_korean: 부끄러워하지 않았습니다
  alternatives_korean:
  - 부끄러워하지 않았습니다
  - 수치스러워하지 않았습니다
  - 부끄러움을 느끼지 않았습니다
  lexicon: LSJ
  rationale: 이 문맥은 왕이 경고 앞에서 수치를 느끼지 않은 상태를 가리키므로, 현대 독자에게 가장 직접적인 ‘부끄러워하지 않았다’로 옮겼습니다.
- source_word: ἐκ στόματος τοῦ κυρίου
  english_pob_choice: from the mouth of the Lord
  chosen_korean: 주님의 입에서 전한
  alternatives_korean:
  - 주님의 입에서 나온
  - 주님의 입으로부터 전한
  lexicon: LSJ
  rationale: 예언 공식의 생생한 이미지를 유지하면서, 한국어에서는 ‘전한’으로 전달 행위를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: Κυρίου의 번역과 예언적 발화 공식
  chosen_reading: 주님 / 주님의 입에서 전한 말씀들
  alternative_readings:
  - 주(Lord)
  - 주님의 말씀
  rationale: 본문은 예언자 예레미야를 통해 선포된 하나님의 직접 발화를 강조하므로, ‘주님의 입에서 전한’으로 출처성과 권위를 함께 살렸습니다.
  doctrine_reference: 'POB default: κύριος → 주님; prophetic formula preservation'
