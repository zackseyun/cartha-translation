base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/006.yaml
  text: In order[a], sacrifice the Passover, and prepare the sacrifices for your brothers[b], and keep the Passover according to the command of the Lord that was given to Moses.
  footnotes:
  - marker: a
    text: Or 'in proper order' or 'according to rank'; the phrase points to ordered arrangement, and the Hebrew parallel emphasizes divisions or groupings.
    reason: lexical_alternative
  - marker: b
    text: '''Brothers'' here refers to fellow members of the people, not necessarily only male siblings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 질서 있게, 유월절을 드리십시오. 그리고 여러분의 형제들을 위해 제물들을 준비하고, 야훼께서 모세에게 주신 명령에 따라 유월절을 지키십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘질서 있게’는 ‘정확한 순서로’ 또는 ‘정해진 배열에 따라’라는 뜻도 가능합니다. 이 표현은 제의 행위의 정돈된 배치를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘형제들’은 여기서 단지 남자 형제만이 아니라 공동체의 구성원들을 가리키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τάξει
  english_pob_choice: In order
  chosen_korean: 질서 있게
  alternatives_korean:
  - 순서대로
  - 바르게
  - 정돈된 상태로
  lexicon: LSJ
  rationale: 맥락상 단순한 시간적 순서가 아니라 제의가 바르게 배열된 상태를 가리키므로, 한국어로는 짧고 자연스러운 ‘질서 있게’가 가장 잘 대응합니다.
- source_word: θύσατε τὸ πάσχα
  english_pob_choice: sacrifice the Passover
  chosen_korean: 유월절을 드리십시오
  alternatives_korean:
  - 유월절을 제사하십시오
  - 유월절을 희생하십시오
  - 유월절 제물을 드리십시오
  lexicon: BDAG
  rationale: θύω는 제의적 문맥에서 ‘희생 제사를 드리다’의 뜻이므로, 예배 행위의 공적·제의적 성격을 살려 ‘드리십시오’로 옮겼습니다.
- source_word: τοῖς ἀδελφοῖς ὑμῶν
  english_pob_choice: for your brothers
  chosen_korean: 여러분의 형제들을 위해
  alternatives_korean:
  - 여러분의 형제자매를 위해
  - 여러분의 동족을 위해
  - 여러분의 형제들을 위하여
  lexicon: BDAG
  rationale: 직역하면 ‘형제들’이며, 여기서는 혈연보다 공동체 구성원을 가리키는 대표적 남성형 표현이므로 본문은 그대로 두고 한국어 관용에 맞게 처리했습니다.
- source_word: τὰς θυσίας
  english_pob_choice: the sacrifices
  chosen_korean: 제물들을
  alternatives_korean:
  - 제사들을
  - 희생제물들을
  - 제사 제물들을
  lexicon: BDAG
  rationale: 앞의 θύσατε와 같은 제의 어휘군 안에 있으므로, 동작보다 결과물/공급물을 나타내는 ‘제물들’이 가장 자연스럽습니다.
- source_word: κατὰ τὸ πρόσταγμα τοῦ κυρίου τὸ δοθὲν τῷ Μωυσῇ
  english_pob_choice: according to the command of the Lord that was given to Moses
  chosen_korean: 야훼께서 모세에게 주신 명령에 따라
  alternatives_korean:
  - 주님께서 모세에게 주신 명령에 따라
  - 모세에게 주어진 주님의 명령에 따라
  - 모세에게 주신 야훼의 명령에 따라
  lexicon: LSJ
  rationale: 주어는 그리스어 κύριος이지만, 이는 모세에게 주어진 율법적 명령으로서 야훼의 명령을 가리키는 전승 맥락이 분명하므로 본문에서는 ‘야훼’로 옮기되, 그리스어 स्रोत에서의 직설적 표기는 주해적으로 설명할 수 있게 유지했습니다.
theological_decisions:
- issue: κύριος의 번역을 이 본문에서 어떻게 처리할지
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 주
  rationale: 이 절의 명령은 모세에게 주어진 계명으로, 본문 전승의 배후에서 야훼의 규정이 분명하게 기능하므로 POB의 원칙에 따라 신적 이름을 드러내는 번역을 선택했습니다.
  doctrine_reference: 'POB contested-terms policy: κύριος in LXX citation/allusion → 야훼'
- issue: ἀδελφοῖς ὑμῶν의 대표적 공동체 의미
  chosen_reading: 여러분의 형제들
  alternative_readings:
  - 여러분의 형제자매
  - 여러분의 동족
  rationale: 남성 복수형을 한국어에서 무리하게 중성화하지 않고, 공동체 내부 구성원을 가리키는 대표 표현으로 그대로 살리는 것이 본문의 어휘와 긴장을 가장 잘 보존합니다.
  doctrine_reference: DOCTRINE.md §4 Gender-accurate over gender-neutral
