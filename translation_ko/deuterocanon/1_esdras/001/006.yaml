    issue: κύριος를 ‘야훼’로 번역함
    rationale: 일차 기준인 그리스어는 κυρίου(‘주님의/주의’)라고 읽으며, 제공된 영어 POB 감사 기록도 ‘Lord’를 채택합니다. 배후 히브리 전승 또는 모세 율법 문맥만으로 신명을 본문에 삽입하면 원문의 표면적 표현을 특정화하게 됩니다.
  - severity: medium
    issue: 첫 번째 ‘유월절을 드리십시오’의 대상 불명료성
    rationale: θύσατε τὸ πάσχα는 희생제사를 드리는 행위를 말합니다. 한국어 ‘유월절을 드리다’는 절기 준수 또는 예배를 드린다는 의미로도 이해될 수 있으므로, ‘유월절 제물을 바치십시오’가 제의적 의미를 더 안전하게 전달합니다.
  - severity: low
    issue: ‘제물들을 준비하고’의 표현 선택
    rationale: 의미상 오류는 없으나, ἑτοιμάσατε는 ‘마련하다/준비하다’이며 문장 흐름에서는 ‘제물들을 마련하십시오’가 더 매끄럽습니다.
