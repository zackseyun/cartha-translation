  source_fidelity: 그리스어 원문은 ἐν τάξει, θύσατε τὸ πάσχα, καὶ τὰς θυσίας ἑτοιμάσατε τοῖς ἀδελφοῖς ὑμῶν, καὶ ποιήσατε τὸ πάσχα κατὰ τὸ πρόσταγμα τοῦ κυρίου τὸ δοθὲν τῷ Μωυσῇ입니다. 초안은 전반적 명령 구조와 ‘유월절을 지키십시오’를 잘 반영하지만, κύριος를 ‘야훼’로 바꾼 것은 그리스어 일차 원문 및 영어 POB 감사 기록의 ‘Lord’ 결정을 벗어납니다. ‘주님’으로 옮기는 것이 원문 충실성과 프로젝트 용어 원칙에 맞습니다. 또한 첫 번째 τὸ πάσχα는 제의적으로 바치는 대상일 가능성을 열어 두므로 ‘유월절 제물을 바치십시오’가 한국어에서 더 명료하고 θύσατε의 희생제사 의미를 보존합니다.
  naturalness: ‘질서 있게’와 합쇼체 명령형은 자연스럽습니다. 다만 ‘유월절을 드리십시오’는 한국어에서 유월절 절기 자체를 ‘드리다’로 읽힐 수 있어 다소 불명료합니다. ‘유월절 제물을 바치십시오’가 자연스럽고 정확합니다. ‘제물들을’은 가능하나, 문맥상 복수 희생 제물을 가리키므로 ‘제물들을 마련하십시오’가 ‘prepare sacrifices’에 더 직접적으로 대응합니다.
  terminology: κύριος는 원문에 신명사 표기가 아니라 ‘주’라는 그리스어 호칭으로 있으므로 ‘주님’이 적절합니다. ‘야훼’는 역번역 또는 배후 전승에 근거한 과도한 특정화입니다. θυσίαι에는 ‘제물’, θύω에는 ‘바치다’, ποιεῖν τὸ πάσχα에는 ‘유월절을 지키다’를 사용하여 제의 어휘와 관용구를 구별하는 것이 좋습니다.
