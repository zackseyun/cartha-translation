base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/020.yaml
  text: In the eighteenth year of Iosias's reign[b][a], this Passover was held.
  footnotes:
  - marker: a
    text: 'Greek: ''this Passover was led/conducted''; the wording means that the Passover observance was carried out at that time.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew parallel in 2 Chronicles 35 describes Israel keeping the Passover at that time; the Greek here is a compressed summary of that observance.
    reason: cross_reference
translation:
  language: ko
  text: 요시아가 통치한 제십팔년에 이 파스카가 거행되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ἤχθη는 문자적으로 ‘인도되었다/끌려갔다’에 가깝지만, כאן에서는 파스카 절기가 실제로 집행되었음을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 요시아의 통치 연대라는 배경은 2역대기 35장의 평행 본문과 대응합니다.
    reason: cross_reference
lexical_decisions:
- source_word: ὀκτωκαιδεκάτῳ ἔτει
  english_pob_choice: in the eighteenth year
  chosen_korean: 제십팔년에
  alternatives_korean:
  - 열여덟째 해에
  - 제18년에
  lexicon: LSJ
  rationale: 시간을 나타내는 여격 표현이므로, 한국어에서는 자연스러운 연도 표지인 ‘제십팔년에’로 옮겼습니다.
- source_word: βασιλεύοντος Ἰωσείου
  english_pob_choice: of Iosias's reign
  chosen_korean: 요시아가 통치한
  alternatives_korean:
  - 요시아가 다스리던
  - 요시아의 통치 기간에
  lexicon: LSJ
  rationale: 분사구는 ‘통치하다/다스리다’의 상태 배경을 나타내므로, 본문 흐름에 맞게 ‘요시아가 통치한’으로 압축했습니다.
- source_word: ἤχθη
  english_pob_choice: was held
  chosen_korean: 거행되었습니다
  alternatives_korean:
  - 진행되었습니다
  - 시행되었습니다
  - 열렸습니다
  lexicon: LSJ
  rationale: 문자적으로는 ‘끌려가다/인도되다’이지만, πάσχα와 결합해 절기 준행을 뜻하므로 예배·절기 문맥을 살린 ‘거행되었습니다’가 가장 가깝습니다.
- source_word: τὸ πάσχα
  english_pob_choice: the Passover
  chosen_korean: 이 파스카
  alternatives_korean:
  - 이 유월절
  - 이 과월절
  lexicon: LSJ
  rationale: 본문의 절기명은 유대 절기 ‘파스카’이므로, 프로젝트 기본어인 ‘파스카’를 사용하되 문맥상 특정된 절기를 가리키는 ‘이’를 붙였습니다.
theological_decisions:
- issue: ἤχθη의 의미를 단순한 ‘이동’이 아니라 절기 준행으로 읽을지 여부
  chosen_reading: 파스카가 실제로 ‘거행되었다’는 뜻으로 옮겼습니다.
  alternative_readings:
  - 파스카가 인도되었습니다
  - 파스카가 끌려왔습니다
  rationale: 그리스어 동사의 기본 뜻은 이동이지만, 절기명과 함께 쓰일 때는 관용적으로 예식의 시행을 뜻합니다. 본문은 사건 서술이지 행렬 묘사가 아니므로 예식적 의미를 드러내야 합니다.
  doctrine_reference: 절기 준행에 관한 서술적 문맥
