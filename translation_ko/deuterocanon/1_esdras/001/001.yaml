base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/001.yaml
  text: And Josiah kept the Passover in Jerusalem to the Lord his God[a], and they slaughtered the Passover on the fourteenth day of the first month,
  footnotes:
  - marker: a
    text: 'Greek: ''to his Lord''; the Hebrew parallel in 2 Chronicles 35:1 reads ''to/for the LORD.'''
    reason: alternative_reading
translation:
  language: ko
  text: 요시야는 예루살렘에서 자기 주님께 유월절을 지켰고, 그들은 첫째 달 열나흗날에 유월절 제물을 잡아 바쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 그리스어는 ‘자기 주님께’로 되어 있으며, 히브리어 평행구는 ‘여호와께’로 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἤγαγεν
  english_pob_choice: kept
  chosen_korean: 지켰고
  alternatives_korean:
  - 준수했고
  - 행했고
  - 드렸고
  lexicon: LSJ
  rationale: 제의적 맥락에서 단순한 ‘이끌다/가져오다’보다 절기를 ‘지키다’가 ελλην어와 히브리어 평행문의 의도를 가장 자연스럽게 살립니다.
- source_word: τὸ πάσχα
  english_pob_choice: the Passover
  chosen_korean: 유월절
  alternatives_korean:
  - 파스카
  - 유월절 절기
  - 유월절 제사
  lexicon: BDAG
  rationale: 첫 번째 용례는 절기 전체를 가리키므로 한국어 성경 관용에 맞는 ‘유월절’이 가장 직접적입니다.
- source_word: τῷ κυρίῳ αὐτοῦ
  english_pob_choice: to his Lord
  chosen_korean: 자기 주님께
  alternatives_korean:
  - 자기 주께
  - 그의 주님께
  - 주님께
  lexicon: BDAG
  rationale: 그리스어의 소유격 αὐτοῦ를 반영해 ‘자기’를 살렸고, κύριος는 프로젝트 기본값에 따라 ‘주님’으로 옮겼습니다.
- source_word: ἔθυσαν
  english_pob_choice: slaughtered
  chosen_korean: 잡아 바쳤습니다
  alternatives_korean:
  - 잡아 죽였습니다
  - 희생시켰습니다
  - 제사했습니다
  lexicon: LSJ
  rationale: 유월절 제물의 실제 도살 행위를 드러내면서도 제의적 의미를 유지하려면 ‘잡아 바쳤습니다’가 가장 균형적입니다.
- source_word: τὸ πάσχα
  english_pob_choice: the Passover
  chosen_korean: 유월절
  alternatives_korean:
  - 유월절 양
  - 유월절 제물
  - 유월절 제사
  lexicon: BDAG
  rationale: 둘째 용례도 그리스어에는 ‘유월절’만 있으므로, 본문에 없는 ‘양’을 덧붙이지 않고 제의적 대상만 자연스럽게 표현했습니다.
- source_word: τῇ τεσσαρεσκαιδεκάτῃ ἡμέρᾳ
  english_pob_choice: on the fourteenth day
  chosen_korean: 열나흗날
  alternatives_korean:
  - 십사일째 날
  - 열네째 날
  - 열나흘째 날
  lexicon: LSJ
  rationale: 날짜 표현은 한국어 성경 문체에서 굳어진 ‘열나흗날’이 가장 간결하고 정확합니다.
theological_decisions:
- issue: ἔθυσαν의 제의적·물리적 의미를 한국어에서 어떻게 살릴지
  chosen_reading: ‘잡아 바쳤습니다’로 번역해 도살 행위와 제사 행위를 함께 드러냈습니다.
  alternative_readings:
  - 잡았습니다
  - 희생했습니다
  - 제사드렸습니다
  rationale: 유월절 맥락에서는 단순한 ‘제사드리다’보다 실제로 희생동물을 잡는 구체성이 중요하므로, 의미의 긴장을 보존하는 표현을 택했습니다.
  doctrine_reference: 'Translation philosophy #1; source-language sensitivity for cultic verbs'
