base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/053.yaml
  text: And they brought all her splendor to ruin[b][a], and he carried the survivors away with the sword to Babylon.
  footnotes:
  - marker: a
    text: Or 'the remnant' for 'the survivors.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'with the sword' may also be understood in close connection with the preceding devastation, with the sense that the rest were driven away under violent conquest; compare the Hebrew parallel, which emphasizes killing by the sword.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그들은 그 도시의 모든 영화를 헛되게 만들었고, 남은 자들을 칼로 바빌론으로 끌고 갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘남은 자들’은 ‘생존자들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘칼로’는 평행본문의 학살 뉘앙스를 반영한 번역이며, 직역하면 ‘칼과 함께’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα τὰ ἔνδοξα αὐτῆς
  english_pob_choice: all her splendor
  chosen_korean: 그 도시의 모든 영화
  alternatives_korean:
  - 그녀의 모든 영광스러운 것들
  - 그 도시의 모든 영광
  lexicon: LSJ
  rationale: ἔνδοξα는 ‘영화로운 것들/영광스러운 것들’의 뜻이지만, 여기서는 도시를 가리키는 여성형 대명사와 함께 공동체적 찬란함 전체를 뜻하므로 ‘모든 영화’가 자연스럽고 간결합니다.
- source_word: ἀχρειῶσαι
  english_pob_choice: bringing ... to ruin
  chosen_korean: 헛되게 만들었고
  alternatives_korean:
  - 무가치하게 만들었고
  - 파괴하였고
  - 쓸모없게 만들었고
  lexicon: LSJ
  rationale: ἀχρειόω는 ‘쓸모없게 하다, 무가치하게 하다’의 뜻이어서, 단순한 물리적 파괴보다 상실된 영예와 가치의 소멸을 드러내는 ‘헛되게 만들다’가 잘 맞습니다.
- source_word: τοὺς ἐπιλοίπους
  english_pob_choice: the survivors
  chosen_korean: 남은 자들
  alternatives_korean:
  - 생존자들
  - 남은 사람들
  - 남겨진 자들
  lexicon: LSJ
  rationale: 문맥상 학술적·신학적 ‘남은 자’보다, 파괴 후 실제로 남아 있던 사람들을 가리키는 일반적 표현이 적절하므로 ‘남은 자들’로 옮겼습니다.
- source_word: μετὰ ῥομφαίας
  english_pob_choice: with the sword
  chosen_korean: 칼로
  alternatives_korean:
  - 칼과 함께
  - 칼을 가지고
  - 칼에 의해
  lexicon: LSJ
  rationale: 문맥과 평행본문의 학살 뉘앙스를 살리면서도 한국어에서 더 자연스럽게 읽히도록, 수단·수단적 폭력을 함축하는 ‘칼로’를 선택했습니다.
- source_word: εἰς Βαβυλῶνα
  english_pob_choice: to Babylon
  chosen_korean: 바빌론으로
  alternatives_korean:
  - 바벨론으로
  lexicon: 표준 외래어 표기법
  rationale: 지명은 현대 외래어 표기법에 따라 ‘바빌론’으로 적되, 본문 흐름상 이동 목적지를 분명히 하기 위해 조사 ‘-으로’를 붙였습니다.
theological_decisions:
- issue: τοὺς ἐπιλοίπους의 ‘remnant’ 여부
  chosen_reading: ‘남은 자들’로 역사적 생존자를 가리키되, 신학적으로 정형화된 ‘남은 자’ 개념은 적극화하지 않았습니다.
  alternative_readings:
  - ‘남은 자’(신학적 remnant)
  - ‘생존자들’
  rationale: 이 절은 포로와 파괴의 역사 서술이 중심이므로, 구원사적 ‘남은 자’ 신학을 불필요하게 덧씌우지 않으면서도 남아 있던 사람들을 정확히 드러내는 표현을 택했습니다.
  doctrine_reference: 원문 우선 및 용례 구분 원칙
- issue: 주어의 교체(복수 → 단수)
  chosen_reading: 앞부분의 복수 주어는 파괴 행위를 한 무리이고, 뒷부분의 단수는 그 행위를 대표하는 바빌론 왕으로 이해했습니다.
  alternative_readings:
  - 복수 주어를 계속 유지하는 집합적 표현
  - 무기명 서술로 처리
  rationale: 그리스어가 복수에서 단수로 바뀌며, 이 장의 흐름과 평행본문도 왕의 주도적 역할을 가리키므로 한국어에서는 자연스럽게 대표 주어를 드러냈습니다.
  doctrine_reference: 서술 명료성 원칙
