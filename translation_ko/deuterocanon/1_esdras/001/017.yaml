base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/017.yaml
  text: And the sons of Israel who were found at that time kept the Passover and the feast of unleavened bread for seven days[a][b].
  footnotes:
  - marker: a
    text: Or 'the Israelites.' The Greek reads more literally 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'were found'; that is, those present there at that time.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 발견된 이스라엘의 아들들이 유월절과 무교절을 칠 일 동안 지켰습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’입니다. 그리스어는 더 문자적으로 ‘이스라엘의 아들들’이라고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘발견된’입니다. 곧 그때 그 자리에 있던 사람들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰσραὴλ
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: LSJ
  rationale: 그리스어의 친족 표현을 그대로 살려, 남성 복수의 직접적 의미를 유지했습니다. ‘이스라엘 사람들’은 자연스럽지만 원문 구조를 다소 평준화합니다.
- source_word: οἱ εὑρεθέντες
  english_pob_choice: who were found at that time
  chosen_korean: 그때에 발견된
  alternatives_korean:
  - 그때에 있던
  - 그때에 있던 사람들
  lexicon: LSJ
  rationale: 분사는 ‘발견되다/찾히다’의 수동적 뉘앙스를 가지므로, 단순히 ‘있던’으로 풀기보다 원문의 동사를 살렸습니다. 문맥상 ‘그때에’가 시기와 현장성을 함께 전합니다.
- source_word: ἤγαγοσαν
  english_pob_choice: kept
  chosen_korean: 지켰습니다
  alternatives_korean:
  - 드렸습니다
  - 기념했습니다
  - 거행했습니다
  lexicon: LSJ
  rationale: 절기와 제의 문맥에서 ‘지키다’는 예배 행위를 자연스럽게 전달합니다. ‘드리다’는 제사 행위를 좁게 만들고, ‘거행하다’는 다소 문어적입니다.
- source_word: τὸ πάσχα καὶ τὴν ἑορτὴν τῶν ἀζύμων
  english_pob_choice: the Passover and the feast of unleavened bread
  chosen_korean: 유월절과 무교절
  alternatives_korean:
  - 파스카와 누룩 없는 빵의 절기
  - 유월절과 무교병의 절기
  lexicon: LSJ
  rationale: 한국어 성경에서 널리 통용되는 절기명칭을 쓰되, ‘무교절’로 축약해 원문의 병렬 구조를 유지했습니다. ‘무교절’은 ‘누룩 없는 빵의 절기’보다 간결하면서도 충분히 정확합니다.
- source_word: ἡμέρας ἑπτά
  english_pob_choice: for seven days
  chosen_korean: 칠 일 동안
  alternatives_korean:
  - 일곱 날 동안
  - 칠 일에 걸쳐
  lexicon: LSJ
  rationale: 기간의 지속을 자연스럽게 나타내는 한국어 표현을 선택했습니다. ‘동안’이 원문의 기간 의미를 분명하게 합니다.
