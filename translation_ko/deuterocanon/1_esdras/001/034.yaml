base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/034.yaml
  text: And he fined the nation one hundred talents of silver and one talent of gold[a].
  footnotes:
  - marker: a
    text: Or 'imposed a monetary penalty on the people.' The Greek verb can denote causing loss or exacting a fine; the context is a punitive payment in silver and gold.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 백성에게 은 백 달란트와 금 한 달란트의 벌금을 물렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘백성에게 금전적 벌금을 부과했다.’ 그리스어 동사는 손실을 입히거나 벌금을 물리는 뜻을 가질 수 있으며, 여기서는 은과 금으로 납부되는 징벌성 금전 부과를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζημίωσεν
  english_pob_choice: fined
  chosen_korean: 벌금을 물렸습니다
  alternatives_korean:
  - 벌금을 부과했습니다
  - 형벌로 손해를 입혔습니다
  - 징벌했습니다
  lexicon: LSJ
  rationale: 이 동사는 단순 과세보다 손실·벌금 부과의 뉘앙스가 강하므로, POB의 ‘fined’를 따라 처벌성 금전 부과를 분명하게 살렸습니다.
- source_word: τὸ ἔθνος
  english_pob_choice: the nation
  chosen_korean: 백성
  alternatives_korean:
  - 나라
  - 국민
  - 민족
  lexicon: LSJ
  rationale: 여기서 ἔθνος는 정치적 집단 전체를 가리키며, 한국어에서는 문맥상 ‘백성’이 압류·징벌의 대상인 공동체를 자연스럽게 드러냅니다.
- source_word: τάλαντοις ἑκατόν / ταλάντῳ ἑνί
  english_pob_choice: one hundred talents / one talent
  chosen_korean: 은 백 달란트와 금 한 달란트
  alternatives_korean:
  - 은 백 달란트와 금 한 달란트의 양
  - 은 일백 달란트와 금 일 달란트
  lexicon: LSJ
  rationale: 중량·가치 단위인 τάλαντον을 ‘달란트’로 옮기고, 재료를 앞에 두어 헬라어의 금속-단위 구성을 그대로 반영했습니다.
theological_decisions:
- issue: 징벌성 금전 부과의 성격
  chosen_reading: 이 구절은 단순한 세금이 아니라 패전자에게 가해진 벌금/배상금의 성격으로 읽었습니다.
  alternative_readings:
  - 그냥 조공 또는 세금으로 읽는 해석
  - 일반적 행정 벌과금으로 완화하는 해석
  rationale: ἐζημίωσεν과 뒤따르는 구체적 금액은 강제된 금전적 제재를 가리키므로, 본문의 처벌성을 약화하지 않는 번역이 필요합니다.
  doctrine_reference: 역사서의 문맥과 징벌적 재정 부과
