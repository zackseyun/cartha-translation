base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/040.yaml
  text: Now the recorded accounts concerning him, and his uncleanness and impiety, are written in the book of the chronicles of the kings.
  footnotes:
  - marker: a
    text: Or 'the things reported about him.' The Greek participle can denote matters recounted or put on record.
    reason: lexical_alternative
translation:
  language: ko
  text: 그에 관한 기록된 일들과 그의 부정함과 불경건함은 왕들의 역대기 책에 기록되어 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에 관해 전해진 일들’로 옮길 수 있습니다. 그리스어 분사는 말해진 내용이나 기록된 사항을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱστορηθέντα
  english_pob_choice: recorded accounts
  chosen_korean: 기록된 일들
  alternatives_korean:
  - 기록된 이야기들
  - 기록된 내용들
  - 전해진 일들
  lexicon: LSJ
  rationale: ἀναγέγραπται와 함께 문서에 남아 있는 항목들을 가리키므로, 한국어에서도 ‘기록된’으로 남기고 τὰ ... ἱστορηθέντα의 복수성을 ‘일들’로 살렸습니다.
- source_word: ἀκαθαρσίας
  english_pob_choice: uncleanness
  chosen_korean: 부정함
  alternatives_korean:
  - 더러움
  - 부정
  - 불결함
  lexicon: LSJ
  rationale: 도덕·종교적 오염을 함께 담는 표현으로 ‘부정함’이 가장 자연스럽고, 단순한 위생적 ‘더러움’으로 약화되지 않습니다.
- source_word: δυσσεβείας
  english_pob_choice: impiety
  chosen_korean: 불경건함
  alternatives_korean:
  - 경건치 않음
  - 불신앙
  - 불경함
  lexicon: LSJ
  rationale: 하나님에 대한 불경·불경건의 뉘앙스를 살리면서도 현대 한국어에서 이해되기 쉬운 표현이어서 ‘불경건함’을 택했습니다.
- source_word: βίβλῳ τῶν χρόνων τῶν βασιλέων
  english_pob_choice: the book of the chronicles of the kings
  chosen_korean: 왕들의 역대기 책
  alternatives_korean:
  - 왕들의 연대기 책
  - 왕들의 사적 기록책
  - 왕들의 연대 기록
  lexicon: LSJ
  rationale: 역대기/연대기 성격의 궁정 기록을 가리키는 공식문구이므로 ‘역대기 책’으로 옮겨 архив적 문체를 유지했습니다.
theological_decisions:
- issue: 두 개의 도덕적 평가어를 어떻게 구분할지
  chosen_reading: ‘부정함과 불경건함’으로 두 항목을 분리해 번역했습니다.
  alternative_readings:
  - ‘부정과 악행’
  - ‘부정함과 불의함’
  rationale: 그리스어는 ἀκαθαρσίας와 δυσσεβείας를 병렬로 놓아 이중 비난을 형성하므로, 하나로 뭉개지 않고 각각의 평가를 분리했습니다.
  doctrine_reference: Translation philosophy §§1, 5
