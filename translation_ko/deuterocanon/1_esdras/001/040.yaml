- from: 그에 관한 기록된 일들과 그의 부정함과 불경건함은 왕들의 역대기 책에 기록되어 있습니다.[a]
  to: 그에 관하여 전해진 일들[a]과 그의 부정과 불경건은 왕들의 연대기 책에 기록되어 있습니다.
  rationale: ‘전해진 일들’로 ἱστορηθέντα의 폭넓은 ‘서술되다/전해지다’ 의미를 살리고, 문서에 남아 있다는 ἀναγέγραπται는 ‘기록되어 있습니다’로 유지했습니다. 두 비난 명사는 각각 ‘부정’과 ‘불경건’으로 구별했으며, 왕실 기록의 성격을 드러내기 위해 ‘연대기 책’을 사용했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T05:29:17Z'
review_pass:
  verdict: revise
  source_fidelity: 그리스어의 두 병렬 명사(ἀκαθαρσίας, δυσσεβείας)와 왕들의 공식 기록이라는 뜻은 대체로 충실히 옮겼습니다. 다만 ἱστορηθέντα를 ‘기록된 일들’로 하고 뒤의 ἀναγέγραπται도 ‘기록되어 있습니다’로 옮기면 서로 다른 동사의 의미가 불필요하게 중복됩니다.
  naturalness: ‘그에 관한 기록된 일들’은 문법적으로 가능하지만 ‘기록된 … 기록되어’의 반복이 다소 부자연스럽습니다. ‘그에 관하여 전해진 일들’은 ἱστορηθέντα의 서술·전승 의미를 자연스럽게 살리면서 문장도 매끄럽습니다. ‘부정과 불경건’은 ‘부정함과 불경건함’보다 간결하고 현대 문어체에 자연스럽습니다.
  terminology: ‘연대기 책’은 왕실 연대·공적 기록을 뜻하는 βιβλίῳ τῶν χρόνων τῶν βασιλέων에 적절하며, 성경 정경의 제목으로도 쓰이는 ‘역대기’와 혼동될 여지를 줄입니다. ‘부정’과 ‘불경건’은 각각 ἀκαθαρσία와 δυσσέβεια의 종교·도덕적 비난을 구별하여 보존합니다.
  issues:
  - severity: low
    issue: ‘기록된’과 ‘기록되어 있습니다’의 의미 중복
    rationale: ἱστορηθέντα는 ‘서술되거나 전해진’ 일을, ἀναγέγραπται는 문서에 기록되어 있음을 말합니다. 두 표현을 모두 ‘기록’으로 옮기면 원문의 어휘적 구분이 흐려지고 한국어 문장이 반복적으로 들립니다.
  - severity: low
    issue: ‘왕들의 역대기 책’의 정경 제목 연상 가능성
    rationale: 여기서 말하는 것은 왕들의 연대·공적 기록책이라는 일반적 왕실 문서 공식입니다. ‘왕들의 연대기 책’이 이 기능을 더 투명하게 드러냅니다.
  - severity: low
    issue: 각주 표지의 선행어 불명확성
    rationale: 각주가 ἱστορηθέντα의 번역 대안을 설명하므로 해당 구절 바로 뒤에 표지를 두는 편이 독자에게 분명합니다.
