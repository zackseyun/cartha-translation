  source_fidelity: 그리스어의 기본 의미는 대체로 충실히 반영했습니다. 다만 φυλάς는 원문상 통상 ‘지파들’이며, 평행 히브리어 본문을 근거로 본문에서 단정적으로 ‘구분들’이라고 옮기면 그리스어의 어휘적 불확실성이 충분히 보존되지 않습니다.
  naturalness: ‘너희의 조상 가문들과 너희의 구분들’은 현대 한국어에서 다소 어색하고 행정 용어처럼 들립니다. ‘너희 조상들의 가문과 지파에 따라’가 더 자연스럽고 분류 기준도 분명합니다. ‘너희의 주 하나님’도 가능하나 ‘주 너희 하나님’이 성서적 관용과 현대 문어에서 더 매끄럽습니다.
  terminology: λατρεύετε와 θεραπεύετε를 각각 ‘섬기고’와 ‘돌보며’로 구별한 것은 적절합니다. ‘그의 백성 이스라엘’과 ‘궤’도 적절합니다. φυλάς의 문맥상 ‘구분’ 가능성은 본문이 아니라 각주에서 밝혀 두는 편이 그리스어 우선 원칙과 평행본문 활용을 함께 만족시킵니다.
