translation:
  language: ko
  text: 이것을 너희 어깨 위에 메고 갈 필요는 없습니다[a]. 이제 너희의 주 하나님을 섬기고, 그의 백성 이스라엘을 돌보며, 너희의 조상 가문들과 너희의 구분들에 따라 준비하십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 ‘그것’은 앞서 언급된 궤를 가리킵니다.
    reason: cross_reference
  - marker: b
    text: φυλαί는 보통 ‘지파’로 옮길 수 있지만, 이 문맥에서는 제의적·행정적 구분을 가리키는 말로 보는 편이 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ ἔσται ὑμῖν ἆραι ἐπʼ ὤμων αὐτήν
  english_pob_choice: You will not need to carry it on your shoulders
  chosen_korean: 이것을 너희 어깨 위에 메고 갈 필요는 없습니다
  alternatives_korean:
  - 너희는 그것을 어깨에 메어야 하지 않습니다
  - 너희에게는 그것을 어깨 위에 들 필요가 없습니다
  lexicon: BDAG
  rationale: οὐκ ἔσται ὑμῖν는 단순 부정 명령보다 ‘필요 없음/의무 없음’의 뜻이 강하므로, 한국어에서는 ‘필요는 없습니다’로 자연스럽게 살렸습니다. ἆραι와 ἐπʼ ὤμων은 구체적 신체 이미지를 유지해 ‘어깨 위에 메고’로 옮겼습니다.
- source_word: λατρεύετε τῷ κυρίῳ θεῷ ὑμῶν
  english_pob_choice: serve the Lord your God
  chosen_korean: 너희의 주 하나님을 섬기고
  alternatives_korean:
  - 너희의 주 하나님을 예배하고
  - 너희의 주 하나님을 섬기십시오
  lexicon: BDAG
  rationale: λατρεύετε는 단순 노동이 아니라 하나님께 드리는 예배적 섬김을 가리키므로 ‘섬기고’로 옮겼습니다. κύριῳ θεῷ ὑμῶν은 관용적인 언약 표현을 따라 ‘주 하나님’으로 자연스럽게 처리했습니다.
- source_word: θεραπεύετε τὸ ἔθνος αὐτοῦ Ἰσραήλ
  english_pob_choice: minister to his people Israel
  chosen_korean: 그의 백성 이스라엘을 돌보며
  alternatives_korean:
  - 그의 백성 이스라엘을 섬기며
  - 그의 백성 이스라엘을 시중들며
  lexicon: BDAG
  rationale: θεραπεύετε는 앞의 λατρεύετε와 기능을 구별해야 하므로, 한국어에서는 공적·목회적 뉘앙스가 있는 ‘돌보며’로 옮겨 서로 다른 봉사의 방향을 드러냈습니다. τὸ ἔθνος αὐτοῦ Ἰσραήλ은 여기서 ‘나라’보다 관계적 의미의 ‘백성’이 더 적절합니다.
- source_word: κατὰ τὰς πατριὰς καὶ τὰς φυλὰς ὑμῶν
  english_pob_choice: by your fathers' houses and your divisions
  chosen_korean: 너희의 조상 가문들과 너희의 구분들에 따라
  alternatives_korean:
  - 너희의 조상 가문들과 너희의 지파들에 따라
  - 너희의 아버지 집들과 너희의 부대들에 따라
  lexicon: BDAG
  rationale: πατριά는 혈연적 집단인 ‘가문’이 가장 무난하고, κατὰ는 기준·질서에 따른 배열을 나타내므로 ‘~에 따라’로 옮겼습니다. φυλάς는 보통 ‘지파’이지만, 이 절의 제의적·행정적 맥락과 평행본문을 고려해 단순 혈연 지파보다 조직적 구분을 드러내는 ‘구분들’로 옮겼습니다.
theological_decisions:
- issue: λατρεύετε와 θεραπεύετε의 구별 유지
  chosen_reading: 하나님께 드리는 섬김과 백성을 향한 돌봄을 서로 다른 한국어 동사로 구분했습니다.
  alternative_readings:
  - 두 동사를 모두 ‘섬기고’로 통일하기
  - 둘 다 ‘봉사하고’로 옮기기
  rationale: 원문은 하나님께 대한 예배적 봉사와 이스라엘 공동체를 향한 실무적 봉사를 의도적으로 구별합니다. 한국어에서도 그 차이를 보존해야 제의적 긴장과 의미의 층위가 흐려지지 않습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 5
