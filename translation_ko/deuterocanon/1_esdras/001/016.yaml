base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/016.yaml
  text: 'And the matters of the Lord’s sacrifice were completed on that day: the Passover was offered[a], and the sacrifices were brought up onto the altar of the Lord[b], according to the command of King Josias.'
  footnotes:
  - marker: a
    text: Or, more literally, 'the Passover was brought'; the Greek uses sacrificial language that can be rendered 'brought,' 'presented,' or 'offered.'
    reason: lexical_alternative
  - marker: b
    text: Josias is the Greek form of the name; in the Hebrew parallel he is called Josiah.
    reason: alternative_reading
translation:
  language: ko
  text: 그날 주님의 제사에 관한 일들이 마무리되었습니다. 곧 유월절 제물이 드려지고[a], 제물들이 주님의 제단 위에 바쳐졌습니다. 이 모든 일은 왕 요시아스의 명령에 따라 이루어졌습니다[b].
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 또는 더 문자적으로, ‘유월절이 가져와졌습니다.’ 그리스어는 제의적 문맥에서 ‘가져오다’, ‘드리다’, ‘바치다’로 옮길 수 있습니다. 본문은 문맥상 ‘유월절 제물’을 보충하여 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘요시아스’는 그리스어형 이름입니다. 히브리어 평행 본문에서는 ‘요시야’로 나옵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: συνετελέσθη τὰ τῆς θυσίας τοῦ κυρίου
  english_pob_choice: the matters of the Lord’s sacrifice were completed
  chosen_korean: 주님의 제사의 일들이 마무리되었고
  alternatives_korean:
  - 주님의 제사의 일들이 끝났고
  - 주님의 제사에 관한 일들이 완수되었고
  lexicon: LSJ
  rationale: συνετελέσθη는 단순 종결보다 절차의 완결을 뜻하므로, 한국어에서는 ‘마무리되다’로 공적·의례적 완료를 자연스럽게 살렸습니다.
- source_word: ἀχθῆναι τὸ πάσχα
  english_pob_choice: the Passover was offered
  chosen_korean: 유월절이 드려졌으며
  alternatives_korean:
  - 유월절이 가져와졌으며
  - 유월절이 바쳐졌으며
  lexicon: LSJ
  rationale: 직역하면 ‘가져오다’ 계열이지만 제사 문맥에서의 희생적 행위를 드러내기 위해 ‘드려지다’를 택했습니다. ‘바쳐지다’도 가능하지만 현대 한국어에서는 ‘드려지다’가 더 자연스럽습니다.
- source_word: προσαχθῆναι τὰς θυσίας ἐπὶ τὸ τοῦ κυρίου θυσιαστήριον
  english_pob_choice: the sacrifices were brought up onto the altar of the Lord
  chosen_korean: 제물들이 주님의 제단으로 올라가게 되었으니
  alternatives_korean:
  - 제물들이 주님의 제단 위로 올라가게 되었으니
  - 제물들이 주님의 제단 앞으로 가져가졌으니
  lexicon: LSJ
  rationale: προσάγω와 ἐπί(대격)가 향하는 동작을 포함하므로, 제단을 향한 이동을 ‘올라가게 되다’로 옮겨 제의적 이동성을 드러냈습니다. ‘제단’은 θυσιαστήριον의 표준적 번역입니다.
- source_word: κατὰ τὴν ἐπιταγὴν τοῦ βασιλέως Ἰωσείου
  english_pob_choice: according to the command of King Josias
  chosen_korean: 왕 요시야의 명령에 따른 것이었습니다
  alternatives_korean:
  - 왕 요시야의 명령에 따라
  - 왕 요시야의 지시에 따른 것이었습니다
  lexicon: LSJ
  rationale: ἐπιταγή는 권위 있는 명령을 가리키므로 ‘명령’이 가장 직접적입니다. 고유명사는 그리스어형을 반영해 ‘요시야’로 옮겼습니다.
theological_decisions:
- issue: κύριος의 번역을 제사 문맥에서 어떻게 처리할지
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 야훼
  rationale: 본절은 그리스어 본문이 κύριος를 사용하므로, 원문 층위를 따라 일반적으로 ‘주님’으로 옮겼습니다. 제도적·전례적 맥락이지만 여기서는 직접적인 YHWH 표기를 전제한 인용이 아니므로 본문에는 ‘야훼’를 쓰지 않았습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → 주님'
