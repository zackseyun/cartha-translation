  source_fidelity: 핵심 제의 의미와 왕의 명령이라는 요소는 반영되어 있으나, 원문의 병렬적인 보충 관계를 ‘이는’으로 인과화했고, Ἰωσείου의 그리스어형과 히브리어형을 구별한다는 각주가 본문과 동일한 ‘요시야’를 반복하여 기능하지 않습니다. προσαχθῆναι ... ἐπὶ τὸ ... θυσιαστήριον은 제단 위로 바쳐지는 동작으로 명시하는 편이 충실합니다.
  naturalness: ‘주님의 제사의 일들’과 ‘올라가게 되었으니’는 현대 표준 한국어의 제의 서술로 다소 부자연스럽습니다. ‘주님의 제사에 관한 일들’, ‘제단 위에 바쳐졌습니다’가 더 자연스럽고 분명합니다.
  terminology: κύριος는 ‘주님’, θυσιαστήριον은 ‘제단’, ἐπιταγή는 ‘명령’으로 적절합니다. 그리스어 이름 Ἰωσείου는 본문에서 ‘요시아스’로 음역하고, 히브리어 평행 본문의 ‘요시야’를 각주로 제시해야 대안 독법 각주의 목적이 살아납니다.
