base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/052.yaml
  text: And they burned the house of the Lord[a], and tore down the walls of Jerusalem, and burned its towers with fire[b],
  footnotes:
  - marker: a
    text: Or 'set the house of the Lord on fire' and later 'set its towers on fire.' The Greek uses the same burning verb twice.
    reason: lexical_alternative
  - marker: b
    text: '''The house of the Lord'' refers to the temple in Jerusalem.'
    reason: cross_reference
translation:
  language: ko
  text: 그들은 주님의 집을 불태우고, 예루살렘의 성벽을 무너뜨렸으며, 그 성읍의 망대들을 불로 태웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주님의 집’은 예루살렘 성전을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἐνεπύρισαν
  english_pob_choice: burned
  chosen_korean: 불태우고 / 불로 태웠습니다
  alternatives_korean:
  - 불을 지르고
  - 불에 태우고
  - 태워 버리고
  lexicon: LSJ
  rationale: 같은 동사가 두 번 반복되므로, 첫째는 일반적으로 ‘불태우고’, 둘째는 ‘불로 태웠습니다’로 자연스럽게 살려 반복 효과를 보존했습니다.
- source_word: τὸν οἶκον τοῦ κυρίου
  english_pob_choice: the house of the Lord
  chosen_korean: 주님의 집
  alternatives_korean:
  - 주님의 성전
  - 주님의 집터
  lexicon: LSJ
  rationale: οἶκος의 직역인 ‘집’을 유지해 원문 어감을 살리고, 이 문맥의 성전 의미는 주석 없이도 독자가 이해할 수 있도록 했습니다.
- source_word: κατέλυσαν
  english_pob_choice: tore down
  chosen_korean: 무너뜨렸으며
  alternatives_korean:
  - 허물었으며
  - 헐어 버렸으며
  - 파괴했으며
  lexicon: LSJ
  rationale: 벽과 같은 구조물을 ‘무너뜨리다’가 가장 자연스럽고, 해체·파괴의 뉘앙스를 잘 전달합니다.
- source_word: τοὺς πύργους αὐτῆς
  english_pob_choice: its towers
  chosen_korean: 그 성읍의 망대들
  alternatives_korean:
  - 그 성읍의 탑들
  - 그것의 망대들
  lexicon: LSJ
  rationale: 도시를 가리키는 여성형 대명사를 한국어에서는 자연스럽게 ‘그 성읍’으로 풀었고, πύργοι는 군사·방어적 맥락을 반영해 ‘망대’로 옮겼습니다.
theological_decisions:
- issue: κύριος의 한국어 처리
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 하나님
  rationale: 그리스어 본문이 κύριου를 사용하므로, 프로젝트 기본값에 따라 ‘주님’으로 옮겨 주님의 집이라는 표현을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md contested terms: κύριος → Lord'
