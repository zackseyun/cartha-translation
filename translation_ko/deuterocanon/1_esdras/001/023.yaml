translation:
  language: ko
  text: 이 모든 요시야의 일 뒤에, 파라오—곧 이집트 왕—가 카르케미스에서 유프라테스 강가에 전쟁을 일으키러 오게 되었습니다. 그리고 요시야는 그를 맞서 나갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 절 끝에서 끊겨 있어(‘그리고 그는 …로 나갔습니다’) 말미가 불완전합니다. 한국어는 문맥상 가능한 최소 보완을 따랐습니다.
    reason: textual_variant
