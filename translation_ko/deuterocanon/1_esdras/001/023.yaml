translation:
  language: ko
  text: 요시야의 이 모든 행적 뒤에, 이집트 왕 파라오가 유프라테스 강가의 카르케미스에서 전쟁을 일으키려고 왔습니다. 그리고 요시야는 그에게 맞서 나갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 그리스어 본문은 절 끝에서 끊겨 있어(‘그리고 그는 …로 나갔습니다’) 말미가 불완전합니다. 본문은 직접적인 문맥에 따라 이를 최소한으로 보완했습니다.
    reason: textual_variant
