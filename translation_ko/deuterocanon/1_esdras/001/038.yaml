base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/038.yaml
  text: After him Nebuchadnezzar king of Babylon came up[a], and he bound him with bronze chains and carried him away to Babylon.
  footnotes:
  - marker: a
    text: Or 'went up.' The Greek verb can be rendered either way; 'came up' preserves the conventional directional idiom of a king advancing against a land.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 뒤에 바빌론 왕 느부갓네살이 올라와서 그를 놋사슬로 묶고 바빌론으로 끌고 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘올라갔다’. 그리스어 동사는 이렇게도 옮길 수 있으나, 왕이 어떤 땅을 향해 진군하는 관용적 방향 이미지를 살리기 위해 ‘올라와서’를 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετʼ αὐτὸν
  english_pob_choice: After him
  chosen_korean: 그 뒤에
  alternatives_korean:
  - 그 후에
  - 그 다음에
  lexicon: LSJ
  rationale: 직전 왕의 뒤를 잇는 시간 순서를 자연스럽게 살리되, 인칭 대명사 ‘그’를 한국어에서 어색하지 않게 앞당겨 풀었습니다.
- source_word: ἀνέβη
  english_pob_choice: came up
  chosen_korean: 올라와서
  alternatives_korean:
  - 올라갔습니다
  - 쳐들어왔습니다
  lexicon: LSJ
  rationale: 원문의 ‘올라가다/오르다’ 이미지를 유지했습니다. 군사적 함의를 과도하게 좁히는 ‘쳐들어왔습니다’는 피했습니다.
- source_word: ἐν χαλκεῖς δεσμοῖς
  english_pob_choice: with bronze chains
  chosen_korean: 놋사슬로
  alternatives_korean:
  - 청동사슬로
  - 놋쇠사슬로
  - 놋 족쇄로
  lexicon: LSJ
  rationale: χαλκεῖς는 금속 재질을 뜻하므로 전통적으로도 통하는 ‘놋’을 택했고, δεσμοῖς는 여기서 사슬형 구속구로 자연스럽게 옮겼습니다.
- source_word: ἀπήγαγεν εἰς Βαβυλῶνα
  english_pob_choice: carried him away to Babylon
  chosen_korean: 바빌론으로 끌고 갔습니다
  alternatives_korean:
  - 바빌론으로 데려갔습니다
  - 바빌론으로 압송했습니다
  lexicon: LSJ
  rationale: 포로로서의 강제 이송을 드러내기 위해 단순한 ‘데려갔습니다’보다 ‘끌고 갔습니다’를 선택했습니다.
- source_word: Ναβουχοδονόσορ βασιλεὺς Βαβυλῶνος
  english_pob_choice: Nebuchadnezzar king of Babylon
  chosen_korean: 바빌론 왕 느부갓네살
  alternatives_korean:
  - 바빌론의 왕 느부갓네살
  - 느부갓네살 바빌론 왕
  lexicon: 고유명사/호칭 관용
  rationale: 한국어에서 널리 통용되는 이름형 ‘느부갓네살’을 사용하고, 왕호는 자연스러운 관형격 순서로 배치했습니다.
theological_decisions:
- issue: 원문의 행위 연속과 왕의 포로화 표현
  chosen_reading: ‘올라와서…묶고…끌고 갔습니다’로 세 동작의 연속과 강제성을 그대로 살렸습니다.
  alternative_readings:
  - 의미를 풀어 ‘공격해 점령하고 사로잡아 갔습니다’로 옮길 수 있음
  rationale: 본문은 역사 서술로서 단순한 이동이 아니라 왕권 행사와 포로 처리를 연속적으로 보여 주므로, 그 긴장을 약화하지 않도록 직역에 가까운 형태를 유지했습니다.
  doctrine_reference: '서사 본문 번역 원칙: 서술 동사들의 연쇄와 사건의 강도를 보존'
- issue: 고유명사 표기와 정전 외 전승(1 Esdras)
  chosen_reading: 본문의 그리스어 1 Esdras를 그대로 번역하고, 병행 히브리어 전승에 맞추어 조정하지 않았습니다.
  alternative_readings:
  - 열왕기하/역대기 계열의 병행 구절에 맞춰 이름과 순서를 조화시킬 수 있음
  rationale: 이 절의 번역 기준은 그리스어 본문이며, 병행 전승은 참고용이므로 본문 순서를 교정하거나 화해시키지 않았습니다.
  doctrine_reference: 원전 우선 원칙 / 병행 본문은 보조 증거
