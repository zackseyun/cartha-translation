  - severity: low
    issue: ἀνέβη를 ‘올라와서’로 옮김
    rationale: 그리스어 본문에는 한국어의 ‘오다’에 수반되는 화자 중심의 방향성이 명시되지 않습니다. ‘올라갔고’가 원문의 방향 표현을 더 중립적으로 보존합니다.
  - severity: low
    issue: ‘놋사슬’의 현대성 및 띄어쓰기
    rationale: ‘놋’은 전통적 표현이지만 현대 독자에게는 ‘청동’이 더 분명하며, ‘청동 사슬’은 재질과 구속구를 명료하게 전달합니다.
  - severity: low
    issue: 각주 표지의 위치
    rationale: 각주는 ἀνέβη의 번역 선택에 관한 것이므로 문장 끝보다 ‘올라갔고’에 직접 붙이는 편이 앵커가 분명합니다.
