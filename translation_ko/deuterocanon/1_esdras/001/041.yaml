base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/041.yaml
  text: And Jehoiakim his son reigned in his place; for when he was appointed[a], he was eight years old.
  footnotes:
  - marker: a
    text: The Greek reads 'he was eight years old' when he was appointed. Other biblical traditions differ on the king's identity or age at accession; this translation preserves the Greek wording of 1 Esdras.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 그의 아들 여호야김이 그를 이어 왕이 되었습니다. 그가 임명될 때는 여덟 살이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 임명될 때 그가 여덟 살이었다고 말합니다. 다른 성경 전승은 왕의 인물이나 즉위 나이를 다르게 전합니다. 이 번역은 1 Esdras의 그리스어 표현을 그대로 보존합니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἐβασίλευσεν
  english_pob_choice: reigned
  chosen_korean: 왕이 되었습니다
  alternatives_korean:
  - 다스렸습니다
  - 통치했습니다
  lexicon: BDAG
  rationale: 역사 서술에서 βασιλεύω의 결과를 자연스럽게 나타내되, 단순한 재위 사실을 담아 영어 POB의 'reigned'와 대응시켰습니다.
- source_word: ἀντ᾽ αὐτοῦ
  english_pob_choice: in his place
  chosen_korean: 그를 이어
  alternatives_korean:
  - 그의 자리에
  - 그 대신에
  lexicon: BDAG
  rationale: 왕위 승계를 한국어로 가장 자연스럽게 드러내면서도 대체·승계의 의미를 보존했습니다.
- source_word: Ἰωακεὶμ
  english_pob_choice: Jehoiakim
  chosen_korean: 여호야김
  alternatives_korean:
  - 요아킴
  - 여호야킴
  lexicon: LSJ
  rationale: 히브리어 왕명에 대응하는 통용 성경 인명인 여호야김을 사용해 독자가 인물을 즉시 식별할 수 있게 했습니다.
- source_word: ἀνεδείχθη
  english_pob_choice: was appointed
  chosen_korean: 임명될 때
  alternatives_korean:
  - 즉위할 때
  - 왕으로 세워질 때
  lexicon: BDAG
  rationale: ἀναδείκνυμι의 수동은 공식적 지명·임용을 가리킬 수 있으므로, 본문이 말하는 지위 부여의 순간을 한국어로 절제되게 옮겼습니다.
