revisions:
- from: 그리고 그는 자기의 둘째 병거에 올랐습니다[a]. 그리고 예루살렘으로 다시 옮겨진 뒤[b], 그는 생명을 마치고 자기 조상들의 무덤에 묻혔습니다.
  to: 그는 자신의 두 번째 병거에 올랐습니다[a]. 그리고 예루살렘으로 다시 옮겨진 뒤[b], 생을 마치고 자신의 조상의 무덤에 묻혔습니다.
  rationale: 수동적 이동과 병거라는 핵심 의미는 유지했습니다. 한국어의 자연스러운 합쇼체를 위해 소유 표현을 다듬고, 죽음 관용구가 자해·자살을 암시하지 않도록 ‘생을 마치고’로 조정했습니다. 또한 원문의 단수 ‘조상의 무덤’을 보존하고, 그 점을 평행본문 각주에서 명시했습니다.
