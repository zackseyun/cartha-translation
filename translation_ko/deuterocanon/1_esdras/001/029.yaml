base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/029.yaml
  text: And he got onto his second chariot[a]; and after being brought back to Jerusalem[b], he ended his life and was buried in his ancestral tomb.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'he died.' The Greek literally says 'he exchanged/ended his life,' an idiom for death.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew parallel in 2 Chronicles 35:24 reads 'the chariot of the second rank' and adds that all Judah and Jerusalem mourned for Josiah; 1 Esdras here is shorter and uses singular 'tomb.'
    reason: cross_reference
translation:
  language: ko
  text: 그는 자신의 두 번째 병거에 올랐습니다[a]. 그리고 예루살렘으로 다시 옮겨진 뒤[b], 생을 마치고 자신의 조상의 무덤에 묻혔습니다.
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 또는 더 관용적으로, ‘그는 죽었습니다.’ 그리스어는 직역하면 ‘그의 삶을 바꾸었다’라는 표현을 사용하며, 여기서는 죽음을 뜻하는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 평행본문인 역대하 35:24는 ‘둘째 등급의 병거’라고 하며, 온 유다와 예루살렘이 요시야를 애도했다고 덧붙입니다. 1 에스드라스는 여기서 더 짧으며, ‘무덤’을 단수로 표현합니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἀνέβη ἐπὶ τὸ ἅρμα τὸ δεύτερον αὐτοῦ
  english_pob_choice: got onto his second chariot
  chosen_korean: 자기의 둘째 병거에 올랐습니다
  alternatives_korean:
  - 자기의 둘째 전차에 탔습니다
  - 자기의 두 번째 병거 위로 올랐습니다
  lexicon: LSJ
  rationale: ἐπὶ + ἅρμα는 단순한 ‘올라가다’보다 수단에 ‘타다/오르다’의 뜻이 자연스러워, 동작성을 살리면서도 현대 한국어로는 ‘올랐다’가 가장 직접적입니다.
- source_word: ἀποκατασταθεὶς εἰς Ἰερουσαλήμ
  english_pob_choice: after being brought back to Jerusalem
  chosen_korean: 예루살렘으로 다시 옮겨진 뒤
  alternatives_korean:
  - 예루살렘으로 다시 돌아온 뒤
  - 예루살렘으로 회복되어
  lexicon: BDAG
  rationale: 수동 분사로서 ‘스스로 돌아감’보다 ‘옮겨짐/되돌려짐’이 맞고, 문맥상 시신이 예루살렘으로 운구된 상황을 반영해야 하므로 ‘다시 옮겨진 뒤’로 옮겼습니다.
- source_word: μετήλλαξεν τὸν βίον αὐτοῦ
  english_pob_choice: ended his life
  chosen_korean: 생명을 마치고
  alternatives_korean:
  - 죽고
  - 세상을 떠나고
  - 삶을 끝내고
  lexicon: LSJ
  rationale: 그리스어 관용구로 ‘죽다’를 뜻하지만, 직역에 치우치면 부자연스러워 한국어에서는 결과를 분명히 하되 완곡하지 않게 ‘생명을 마치고’로 처리했습니다.
- source_word: ἐν τῷ πατρικῷ τάφῳ
  english_pob_choice: in his ancestral tomb
  chosen_korean: 자기 조상들의 무덤에
  alternatives_korean:
  - 자기 조상의 무덤에
  - 자기 조상들의 묘실에
  lexicon: LSJ
  rationale: πατρικός는 ‘아버지의/조상들의’에 해당하고 τάφος는 무덤이므로, 단수 형식을 무리하게 풀지 않으면서도 가문의 매장지를 뜻하도록 ‘자기 조상들의 무덤’으로 옮겼습니다.
theological_decisions:
- issue: 1 Esdras의 죽음 표현을 한국어에서 어떻게 처리할지
  chosen_reading: ‘생명을 마치고’로 번역해 죽음의 사실을 분명히 하면서도, 원문의 관용적 표현을 보존했습니다.
  alternative_readings:
  - 그는 죽었습니다
  - 그는 세상을 떠났습니다
  rationale: 본문은 단순 서술이 아니라 관용구를 사용하므로, 한국어에서도 의미는 명확히 하되 어휘적 흔적을 남기는 쪽이 원문 충실도에 더 맞습니다.
  doctrine_reference: 서술문 내 죽음 표현의 문체적·관용적 보존
- issue: ‘예루살렘으로 다시 옮겨진 뒤’의 수동성
  chosen_reading: 주체가 스스로 이동한 것이 아니라 외부에 의해 운구·이송된 수동 상황으로 읽었습니다.
  alternative_readings:
  - 예루살렘으로 돌아온 뒤
  - 예루살렘으로 회복된 뒤
  rationale: 히브리어 평행본문과 그리스어 분사 모두 수동적 흐름을 지지하므로, 사건의 역사적 진행을 흐리지 않도록 수동성을 유지했습니다.
  doctrine_reference: 본문비평/서술 문맥상의 수동 이해
