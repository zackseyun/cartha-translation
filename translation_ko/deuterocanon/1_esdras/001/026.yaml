base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/026.yaml
  text: And Josiah did not turn back to his chariot[a], but attempted to fight him, not paying attention to the words of Jeremiah the prophet from the mouth of the Lord.
  footnotes:
  - marker: a
    text: Or 'did not withdraw to his chariot.' The Greek wording is compressed and may imply refusing to pull back into or toward his chariot.
    reason: lexical_alternative
translation:
  language: ko
  text: 요시야는 자기 전차로 물러서지 않았고, 그러나 그와 싸우려고 했으며, 주님의 입에서 나온 예레미야 예언자의 말씀에 주의를 기울이지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: ‘자기 전차로 물러서지 않았고’는 압축된 그리스어 표현을 반영한 번역입니다. 이 표현은 자기 전차 쪽으로 돌아서지 않았다는 뜻 또는 전차를 향해 물러나지 않았다는 뜻일 수 있습니다.
    reason: 그리스어 ἀπέστρεψεν ἑαυτὸν ἐπὶ τὸ ἅρμα αὐτοῦ의 정확한 공간적·군사적 뉘앙스가 압축되어 있으므로, 본문은 자연스럽게 번역하고 각주에서 가능한 의미를 보존합니다.
lexical_decisions:
- source_word: οὐκ ἀπέστρεψεν ἑαυτὸν ἐπὶ τὸ ἅρμα αὐτοῦ
  english_pob_choice: did not turn back to his chariot
  chosen_korean: 자기 전차로 물러서지 않았고
  alternatives_korean:
  - 자기 전차로 돌아서지 않았고
  - 전차로 물러나지 않았고
  lexicon: LSJ
  rationale: ἀποστρέφω의 반사적 용법과 전차 전투 맥락을 살려, 단순한 방향 전환보다 ‘물러서다’의 후퇴 뉘앙스를 살렸습니다.
- source_word: πολεμεῖν αὐτὸν ἐπεχείρει
  english_pob_choice: attempted to fight him
  chosen_korean: 그와 싸우려고 했으며
  alternatives_korean:
  - 그와 싸우려 시도했으며
  - 그에게 전쟁을 걸려고 했으며
  lexicon: LSJ
  rationale: ἐπιχειρέω + 부정사는 ‘~하려고 시도하다/하려 들다’의 뜻이므로, 현대 한국어에서 자연스럽고 직접적인 ‘싸우려고 했으며’로 옮겼습니다.
- source_word: οὐ προσέχων ῥήμασιν Ἰερεμίου προφήτου
  english_pob_choice: not paying attention to the words of Jeremiah the prophet
  chosen_korean: 예레미야 선지자의 말씀에 주의를 기울이지 않았습니다
  alternatives_korean:
  - 예레미야 선지자의 말을 듣지 않았습니다
  - 예레미야 선지자의 말씀을 귀담아듣지 않았습니다
  lexicon: LSJ
  rationale: προσέχω는 단순 청취보다 ‘주의를 기울이다/유의하다’의 의미가 분명하므로, 예언적 권면을 거절하는 뉘앙스를 살렸습니다.
- source_word: ἐκ στόματος Κυρίου
  english_pob_choice: from the mouth of the Lord
  chosen_korean: 주님의 입으로부터 나온
  alternatives_korean:
  - 주님의 입에서 나온
  - 주님의 말씀으로부터 나온
  lexicon: LSJ
  rationale: ‘입’이라는 비유를 유지해 예언의 신적 기원을 드러냈습니다. ‘주님의 말씀’으로 풀면 원문의 형상성이 약해집니다.
theological_decisions:
- issue: 예레미야의 말의 신적 권위
  chosen_reading: ‘주님의 입으로부터 나온’으로 직역해, 예레미야의 말씀이 단순한 인간 발언이 아니라 야훼의 직접적 발화에서 비롯된 것임을 드러냈습니다.
  alternative_readings:
  - ‘주님께로부터 나온’으로 완화
  - ‘주님의 말씀’으로 일반화
  rationale: 원문은 예언의 출처를 신체적 은유로 강조합니다. 이를 보존해야 본문의 신학적 긴장과 권위를 함께 전달할 수 있습니다.
  doctrine_reference: 'DOCTRINE.md: 신적 발화의 형상을 보존하고, 소스가 지닌 신학적 긴장을 약화하지 말 것'
