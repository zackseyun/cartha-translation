base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/027.yaml
  text: But he arrayed himself for war against him in the plain of Megiddo[a], and the commanders came down against King Josiah.
  footnotes:
  - marker: a
    text: The Hebrew parallel in 2 Chronicles 35:22 reads 'he disguised himself to fight against him' rather than the Greek's 'he arrayed himself for war against him.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 그는 메깃도 평원에서 그와 전투를 벌이기 위해 전열을 갖추었고, 지휘관들은 요시야 왕에게로 내려왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 병행본문인 역대하 35:22는 ‘그가 싸우기 위해 자신을 위장하였다’고 읽어, 그리스어의 ‘전투를 벌이기 위해 전열을 갖추었다’와 다릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: συνεστήσατο πρὸς αὐτὸν πόλεμον
  english_pob_choice: arrayed himself for war against him
  chosen_korean: 그와 전투를 벌이기 위해 전열을 갖추었고
  alternatives_korean:
  - 그와 전쟁을 벌였습니다
  - 그에게 맞서 전투 태세를 갖추었습니다
  lexicon: LSJ
  rationale: 중간태의 자기지향성을 살리면서 πόλεμον의 군사적 의미를 자연스러운 현대 한국어로 옮기기 위해 ‘전열을 갖추다’를 택했습니다.
- source_word: ἐν τῷ πεδίῳ Μετααδδούς
  english_pob_choice: in the plain of Megiddo
  chosen_korean: 메깃도 평원에서
  alternatives_korean:
  - 메깃도 들판에서
  - 메깃도 벌판에서
  lexicon: LSJ
  rationale: πεδίον은 ‘평원/들판’의 뜻이므로 ‘평원’이 원어에 가장 가깝고, 병행 본문이 가리키는 지명은 메깃도로 옮겼습니다.
- source_word: οἱ ἄρχοντες
  english_pob_choice: the commanders
  chosen_korean: 지휘관들은
  alternatives_korean:
  - 지도자들은
  - 관리들은
  - 통치자들은
  lexicon: LSJ
  rationale: 전투 맥락에서 ἄρχοντες는 민정적 ‘통치자들’보다 군사적 ‘지휘관들’이 더 적합합니다.
- source_word: κατέβησαν πρὸς βασιλέα Ἰωσίαν
  english_pob_choice: came down against King Josiah
  chosen_korean: 요시야 왕에게로 내려왔습니다
  alternatives_korean:
  - 요시야 왕에게 내려왔습니다
  - 요시야 왕을 치러 내려왔습니다
  lexicon: BDAG
  rationale: κατέβησαν는 문자적으로 ‘내려오다’이며, 여기서는 이동 방향을 우선 살려 번역하고 적대성은 앞 절의 전투 문맥으로 드러내었습니다.
theological_decisions:
- issue: 1 Esdras의 그리스어 본문과 히브리어 병행본문의 차이
  chosen_reading: 본문은 그리스어의 ‘전투를 벌이기 위해 전열을 갖추었다’를 따르고, 병행본문은 지명 확인에만 참고했습니다.
  alternative_readings:
  - ‘위장하고 싸우기 위해 내려갔다’(역대하 병행의 의미)
  rationale: 이 책의 기본 본문은 Swete의 그리스어이며, 히브리어 병행본문은 지명과 대조용 보조 증거로만 사용해야 한다는 원칙을 따랐습니다.
  doctrine_reference: 'PHILOSOPHY.md: Deuterocanonical / Apocrypha; original-language primacy'
