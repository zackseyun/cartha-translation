base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/019.yaml
  text: And all the kings of Israel had not kept such a Passover as Josias kept[c][b][a], and the priests and the Levites and the Judeans and all Israel who were found dwelling in Jerusalem.
  footnotes:
  - marker: a
    text: Greek Josias; the Hebrew parallel names the same king as Josiah.
    reason: cross_reference
  - marker: b
    text: Or 'had not celebrated such a Passover.' The Greek literally says 'had not led/brought a Passover such as...,' an idiom for observing it.
    reason: lexical_alternative
  - marker: c
    text: '''The Judeans'' may also be rendered ''the Jews''; here the term likely carries an ethnic-geographic sense tied to Judah/Judea.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘의 모든 왕은 요시아스가 지킨 것과 같은 유월절을 지키지 않았으며, 제사장들과 레위 사람들과 유다 사람들과 예루살렘에 거주하던 것으로 확인된 온 이스라엘도 그러하지 않았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 그리스어는 이 왕의 이름을 ‘요시아스’로 표기합니다. 히브리어 평행본문에서는 같은 왕을 ‘요시야’라고 부릅니다.
    reason: source_note
  - marker: b
    text: ‘지키다’는 그리스어 ἤγαγον πάσχα(직역하면 ‘유월절을 이끌다/행하다’)의 관용적 의미를 반영합니다. ‘거행하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘유다 사람들’은 여기서 지리·민족적 의미의 Ἰουδαῖοι를 반영합니다. ‘유대인들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγον πάσχα
  english_pob_choice: had not kept such a Passover
  chosen_korean: 그런 유월절을 지키지 못했으며
  alternatives_korean:
  - 그런 유월절을 지키지 않았으며
  - 그런 유월절을 거행하지 않았으며
  lexicon: BDAG
  rationale: ἄγω + πάσχα는 문자적으로 ‘데려오다’가 아니라 유월절을 ‘지키다/거행하다’는 관용적 의미이므로, 한국어도 예배·절기 표현에 자연스러운 ‘지키다’로 옮겼습니다.
- source_word: τοιοῦτον οἷον
  english_pob_choice: such a ... as
  chosen_korean: 그런 ... 같은
  alternatives_korean:
  - 이와 같은
  - 그와 같은
  lexicon: LSJ
  rationale: 비교를 강조하는 상관구문이므로, 단순한 품질 서술보다 ‘그런 ... 같은’으로 대응해 ‘요시아스가 행한 것과 같은’ 비교 관계를 살렸습니다.
- source_word: Ἰωσείας
  english_pob_choice: Josias
  chosen_korean: 요시아스
  alternatives_korean:
  - 요시야
  lexicon: source transliteration
  rationale: 그리스어 표지형 Ἰωσείας를 직접 반영하되, 한국어에서는 현대 독자가 읽기 쉬운 음역 ‘요시아스’를 택했습니다. 히브리어 평행본문의 ‘요시야’와는 다르지만, 본문 기준형을 우선했습니다.
- source_word: Ἰουδαῖοι
  english_pob_choice: the Judeans
  chosen_korean: 유다 사람들
  alternatives_korean:
  - 유대인들
  - 유다인들
  lexicon: BDAG
  rationale: 이 역사 문맥에서는 민족·지리적 집단인 ‘유다/유대 지역 사람들’의 뜻이 강하므로, 후대 종교명사처럼 들릴 수 있는 ‘유대인들’보다 ‘유다 사람들’이 더 직접적입니다.
- source_word: οἱ εὑρεθέντες ἐν τῇ κατοικήσει αὐτῶν ἐν Ἰερουσαλήμ
  english_pob_choice: who were found dwelling in Jerusalem
  chosen_korean: 예루살렘에서 자기 거처에 있던
  alternatives_korean:
  - 예루살렘에 거주하던
  - 예루살렘에서 발견된
  lexicon: LSJ
  rationale: ‘발견된’은 한국어에서 부자연스러워 거주 상태를 드러내는 표현으로 풀되, ‘자기 거처에 있던’으로 그리스어의 존재·거주 뉘앙스를 유지했습니다.
theological_decisions:
- issue: ‘이스라엘의 모든 왕들’의 범위
  chosen_reading: 그대로 ‘이스라엘의 모든 왕들’로 두고, 유다 왕들로 좁히지 않았습니다.
  alternative_readings:
  - 이스라엘/유다의 모든 왕들
  - 전 왕들
  rationale: 그리스어가 명시적으로 ‘이스라엘의 모든 왕들’이라고 말하므로, 역대기식 조화보다 원문 표현을 우선해 역사적 긴장을 보존했습니다.
  doctrine_reference: 원문 우선 원칙과 본문 긴장 보존
- issue: 직접 비교의 강도
  chosen_reading: ‘그런 유월절을 지키지 못했으며’로 비교를 명시했습니다.
  alternative_readings:
  - 그런 유월절을 드리지 못했으며
  - 그런 유월절을 거행하지 못했으며
  rationale: 본문은 요시아스가 행한 유월절의 유례없음을 강조하므로, 단순한 서술보다 ‘그런 ... 같은’ 비교 구조를 살려 원문의 강조를 유지했습니다.
  doctrine_reference: 서사적 강조 보존
