- from: 그리고 이스라엘의 모든 왕들도 요시아스가 행한 것과 같은 그런 유월절을 지키지 못했으며, 제사장들과 레위 사람들과 유다 사람들과 예루살렘에서 자기 거처에 있던 온 이스라엘도 그러했습니다.[a][b][c]
  to: 이스라엘의 모든 왕은 요시아스가 지킨 것과 같은 유월절을 지키지 않았으며, 제사장들과 레위 사람들과 유다 사람들과 예루살렘에 거주하던 것으로 확인된 온 이스라엘도 그러하지 않았습니다.[a][b][c]
  rationale: 단순 과거 부정을 능력·가능의 부정으로 바꾸지 않도록 ‘지키지 않았다’의 의미를 회복했습니다. 비교구문을 자연스럽게 다듬고, 예루살렘 거주자라는 문맥적 의미와 ‘발견된/확인된’이라는 분사 뉘앙스를 균형 있게 반영했습니다. 열거된 모든 집단이 유례없는 유월절을 지키지 않았다는 원문의 병렬 구조도 보존했습니다.
