translation:
  language: ko
  text: 그리고 이집트 왕이 그의 형제 요아킴을 유다와 예루살렘의 왕으로 세웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 이름은 그리스어 본문에서 ‘요아킴’으로 나오며, 히브리어 평행 전승에서는 흔히 ‘여호야김’으로 식별됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέδειξεν
  english_pob_choice: made
  chosen_korean: 세웠습니다
  alternatives_korean:
  - 임명했습니다
  - 세워 왕으로 삼았습니다
  lexicon: LSJ
  rationale: 왕권을 부여해 직분에 올리는 causative 의미를 살려, 자연스러운 현대 한국어로는 ‘세우다’가 가장 직접적입니다.
- source_word: Ἰωακεὶμ
  english_pob_choice: Joakim
  chosen_korean: 요아킴
  alternatives_korean:
  - 여호야김
  - 요아킴
  lexicon: LSJ
  rationale: 그리스어 본문 형태를 우선해 음역했고, 평행 전승의 ‘여호야김’은 각주로 처리하는 편이 본문과 주석의 구분에 맞습니다.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  english_pob_choice: his brother
  chosen_korean: 그의 형제
  alternatives_korean:
  - 그의 형
  - 그의 동생
  lexicon: LSJ
  rationale: 친족 관계를 그대로 살렸으며, 남매 구분을 본문이 명시하지 않으므로 중립적인 ‘형제’가 적절합니다.
- source_word: τῆς Ἰουδαίας καὶ Ἰερουσαλήμ
  english_pob_choice: over Judea and Jerusalem
  chosen_korean: 유다와 예루살렘의
  alternatives_korean:
  - 유다와 예루살렘 위에
  - 유다와 예루살렘에 대한
  lexicon: LSJ
  rationale: 그리스어의 속격은 통치 범위를 나타내므로, 한국어에서는 ‘~의 왕’으로 옮겨 설치된 통치 관계를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 본문의 왕권 수여 표현
  chosen_reading: 왕으로 ‘세웠습니다’라고 옮겨, 단순 지명이나 추천이 아니라 실제 통치권 부여를 드러냈습니다.
  alternative_readings:
  - 임명했습니다
  - 왕이 되게 했습니다
  rationale: ἀνέδειξεν과 반복된 βασιλέα는 공식적 즉위/등극의 의미를 강하게 가지므로, 그 권위와 공적 성격을 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 본문 해석상 역사 서술의 통치권 수여 표현
