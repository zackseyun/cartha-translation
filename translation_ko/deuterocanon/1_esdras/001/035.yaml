  source_fidelity: 그리스어의 핵심 요소를 충실히 반영합니다. ἀνέδειξεν의 왕권 수여 의미를 ‘왕으로 세웠습니다’로 자연스럽게 옮겼고, Ἰωακεὶμ은 그리스어 형태에 따라 ‘요아킴’으로 유지했습니다. ‘그의 형제’의 선행사는 직전 문맥에 의존하는 원문의 지시 관계를 그대로 보존합니다.
  naturalness: ‘그리고 이집트 왕이 그의 형제 요아킴을 유다와 예루살렘의 왕으로 세웠습니다’는 현대 표준 한국어 합쇼체 서술로 자연스럽습니다. ‘유다와 예루살렘의 왕’은 통치 영역을 나타내는 그리스어 속격을 무리 없이 표현합니다.
  terminology: ‘이집트 왕’, ‘유다’, ‘예루살렘’, ‘왕’, ‘요아킴’은 일관되고 적절합니다. 본문은 그리스어 이름형을 따르고, 각주는 히브리어 전승의 ‘여호야김’ 형태를 적절히 안내합니다.
