  lexicon: LSJ
  rationale: ἵστημι의 행정적·배치적 용법을 살려, 제사장들을 정해진 자리에 세운다는 뜻을 간명하게 전했습니다.
- source_word: κατʼ ἐφημερίας
  english_pob_choice: in their divisions
  chosen_korean: 그들의 차례대로
  alternatives_korean:
  - 그들의 분반대로
  - 그들의 직무 조별로
  - 그들의 순번에 따라
  lexicon: LSJ
  rationale: 제사장들의 정해진 근무 순번·반열을 가리키므로, 현대 한국어에서 자연스럽고 제도적 의미가 드러나는 표현을 택했습니다.
- source_word: ἐστολισμένους
  english_pob_choice: clothed in splendor
  chosen_korean: 화려하게 차려입게
  alternatives_korean:
  - 장엄하게 차려입게
  - 찬란하게 입게
  - 예복을 입게
  lexicon: LSJ
  rationale: 단순한 복장 착용을 넘어 단정하고 위엄 있는 차림을 암시하는데, 과도하게 ‘제사장 예복’으로 특정하지 않도록 넓게 옮겼습니다.
- source_word: ἐν τῷ ἱερῷ τοῦ κυρίου
  english_pob_choice: in the house of the Lord
  chosen_korean: 주님의 성전에서
  alternatives_korean:
  - 주님의 집에서
  - 주님의 성소에서
  - 주님의 성전 안에서
  lexicon: LSJ
  rationale: ἱερόν의 성전/성전 구역 의미를 살려 ‘성전’으로 옮기되, κυρίου는 한국어 관례에 맞춰 ‘주님’으로 번역했습니다.
theological_decisions:
- issue: κύριος의 번역과 히브리어 평행본문의 YHWH 대응
  chosen_reading: 주님
  alternative_readings:
  - 야훼
  - 주
  rationale: 주어진 그리스어 본문에는 κυρίου가 있으므로, 원문 우선 원칙에 따라 ‘주님’으로 옮겼습니다. 히브리어 평행본문의 여호와/야훼 대응은 여기서 본문 주역이 아니므로 본문에는 드러내지 않았습니다.
  doctrine_reference: 원문 우선 원칙; contested terms 표의 κύριος 항목
- issue: ἐστολισμένους의 구체화 정도
  chosen_reading: 화려하게 차려입게
  alternative_readings:
  - 예복을 입게
  - 찬란하게 입게
  rationale: 본문은 제사장 복장의 세부 명칭을 직접 말하지 않으므로, 의미를 과장하지 않으면서도 위엄과 단장함을 드러내는 정도로만 옮겼습니다.
  doctrine_reference: 원문이 허용하는 범위를 넘어서지 말 것; optimal equivalence
