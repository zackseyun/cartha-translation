theological_decisions:
- issue: κύριος의 번역과 히브리어 평행본문의 YHWH 대응
  chosen_reading: 주님
  alternative_readings:
  - 야훼
  - 주
  rationale: 주어진 그리스어 본문에는 κυρίου가 있으므로, 원문 우선 원칙에 따라 ‘주님’으로 옮겼습니다. 히브리어 평행본문의 여호와/야훼 대응은 여기서 본문 주역이 아니므로 본문에는 드러내지 않았습니다.
  doctrine_reference: 원문 우선 원칙; contested terms 표의 κύριος 항목
- issue: ἐστολισμένους의 구체화 정도
  chosen_reading: 화려하게 차려입게
  alternative_readings:
  - 예복을 입게
  - 찬란하게 입게
  rationale: 본문은 제사장 복장의 세부 명칭을 직접 말하지 않으므로, 의미를 과장하지 않으면서도 위엄과 단장함을 드러내는 정도로만 옮겼습니다.
  doctrine_reference: 원문이 허용하는 범위를 넘어서지 말 것; optimal equivalence
