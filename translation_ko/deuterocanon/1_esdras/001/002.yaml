base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/002.yaml
  text: having stationed the priests in their divisions[c][b][a], arrayed in the temple of the Lord.
  footnotes:
  - marker: a
    text: Or 'by courses' or 'in their appointed rotations'; the phrase refers to the priests' ordered service divisions.
    reason: lexical_alternative
  - marker: b
    text: Or 'wearing their vestments'; the Greek says they were 'adorned/arrayed,' likely referring to priestly attire.
    reason: lexical_alternative
  - marker: c
    text: Greek 'in the holy place/temple'; the Hebrew parallel has 'for the service of the house of the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 그는 주님의 성전에서[c] 단장한[b] 제사장들을 각 근무 분반에 따라[a] 배치하였습니다.
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: ‘각 근무 분반에 따라’는 제사장들의 정해진 봉사 분반 또는 순번에 따른다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘단장한’은 ‘차려입은’, ‘꾸민’으로도 옮길 수 있습니다. 본문은 제사장 예복을 직접 명시하지 않습니다.
    reason: lexical_alternative
  - marker: c
    text: 그리스어는 ‘성전에서’라고 합니다. 히브리어 평행본문은 ‘주님의 집의 봉사를 위하여’라고 합니다.
    reason: alternative_reading
