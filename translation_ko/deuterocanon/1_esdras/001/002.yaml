base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/002.yaml
  text: having stationed the priests in their divisions[c][b][a], arrayed in the temple of the Lord.
  footnotes:
  - marker: a
    text: Or 'by courses' or 'in their appointed rotations'; the phrase refers to the priests' ordered service divisions.
    reason: lexical_alternative
  - marker: b
    text: Or 'wearing their vestments'; the Greek says they were 'adorned/arrayed,' likely referring to priestly attire.
    reason: lexical_alternative
  - marker: c
    text: Greek 'in the holy place/temple'; the Hebrew parallel has 'for the service of the house of the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 그는 제사장들을 그들의 차례대로 세우고, 주님의 성전에서 화려하게 차려입게 하였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들의 차례대로’는 제사장들의 정해진 근무 반열 또는 순번을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘화려하게 차려입게’는 ‘차려입다/장식하다’의 뉘앙스를 살린 번역이며, 제사장 예복을 직접 명시한 것은 아닙니다.
    reason: lexical_alternative
  - marker: c
    text: ‘성전’은 ἱερῷ의 일반적인 성전/성전 구역 의미를 따른 번역입니다.
    reason: source_note
lexical_decisions:
- source_word: στήσας
  english_pob_choice: having stationed
  chosen_korean: 세우고
  alternatives_korean:
  - 배치하고
  - 임명하고
