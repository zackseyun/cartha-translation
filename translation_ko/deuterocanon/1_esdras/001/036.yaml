base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/036.yaml
  text: And he bound Jehoiakim’s nobles[a], and after seizing Zarius his brother[b], he brought him up from Egypt.
  footnotes:
  - marker: a
    text: 'Greek: ''And he bound Jehoiakim’s nobles''; the clause is compressed, and the broader context together with the Hebrew parallel indicates the acting subject is the king of Egypt, not Jehoiakim himself.'
    reason: alternative_reading
  - marker: b
    text: Some would render μεγιστᾶνας as 'great men' or 'magnates.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 여호야김의 귀족들을 묶고, 그의 형제 자리우스를 붙잡은 뒤 이집트에서 그를 끌어올렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘그리고 여호야김의 귀족들을 묶고’라고 압축되어 있으나, 더 넓은 문맥과 히브리어 평행 본문은 이 행위의 주체가 여호야김이 아니라 이집트 왕임을 보여 줍니다.
    reason: alternative_reading
  - marker: b
    text: μεγιστᾶνας는 ‘귀족들’ 외에도 ‘대인들’, ‘유력자들’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδησεν
