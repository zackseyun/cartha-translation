review_pass:
  verdict: revise
  source_fidelity: 그리스어의 동작 순서(묶음–붙잡음–이집트에서 데려옴)와 압축된 주어는 대체로 보존했습니다. 그러나 Ζάριον은 그리스어 형태에 가깝게 ‘자리온’으로 옮기는 것이 안전하며, ἀνήγαγεν의 상승·이동 의미를 자연스럽게 살린 표현이 필요합니다.
  naturalness: ‘이집트에서 그를 끌어올렸습니다’는 한국어에서 목적지 없는 물리적 상승처럼 들려 다소 부자연스럽습니다. ‘이집트에서 그를 끌고 올라왔습니다’가 원문의 방향성과 강제적 이동의 뉘앙스를 더 자연스럽게 전달합니다.
  terminology: ‘여호야김’은 통용 성경 인명으로 적절하고, μεγιστᾶνας의 ‘귀족들’도 허용됩니다. 다만 해당 어휘를 설명하는 각주 b는 ‘귀족들’ 바로 뒤에 붙어야 합니다. ‘자리우스’는 영어 감사 기록의 표기이지만, 그리스어 Ζάριον에 대한 한국어 음역으로는 ‘자리온’이 더 직접적입니다.
  issues:
  - severity: medium
    issue: Ζάριον을 ‘자리우스’로 표기함
    rationale: 원문은 Ζάριον(자리온)에 해당합니다. 영어의 ‘Zarius’ 표기를 그대로 따른 ‘자리우스’보다 그리스어 원문에 충실한 ‘자리온’이 안전합니다.
  - severity: medium
    issue: ‘이집트에서 그를 끌어올렸습니다’의 한국어 표현
    rationale: ἀνήγαγεν의 ‘위로 데려오다’라는 방향성은 살리지만, 한국어에서는 목적지 없이 ‘끌어올리다’라고 하면 부자연스럽습니다. ‘끌고 올라왔습니다’가 자연스럽고 원문 의미도 보존합니다.
  - severity: low
    issue: 각주 b의 앵커 위치
    rationale: 각주 b는 μεγιστᾶνας(‘귀족들’)의 어휘 대안을 설명하므로 인명 뒤가 아니라 ‘귀족들’ 뒤에 놓여야 합니다.
  revised_text: 그리고 그는 여호야김의 귀족들[b]을 묶고, 그의 형제 자리온을 붙잡은 뒤 이집트에서 그를 끌고 올라왔습니다.[a]
