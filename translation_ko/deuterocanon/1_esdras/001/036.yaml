base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/036.yaml
  text: And he bound Jehoiakim’s nobles[a], and after seizing Zarius his brother[b], he brought him up from Egypt.
  footnotes:
  - marker: a
    text: 'Greek: ''And he bound Jehoiakim’s nobles''; the clause is compressed, and the broader context together with the Hebrew parallel indicates the acting subject is the king of Egypt, not Jehoiakim himself.'
    reason: alternative_reading
  - marker: b
    text: Some would render μεγιστᾶνας as 'great men' or 'magnates.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 여호야김의 귀족들[b]을 묶고, 그의 형제 자리온을 붙잡은 뒤 이집트에서 그를 끌고 올라왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 그리스어는 ‘그리고 여호야김의 귀족들을 묶고’라고 압축되어 있으나, 더 넓은 문맥과 히브리어 평행 본문은 이 행위의 주체가 여호야김이 아니라 이집트 왕임을 보여 줍니다.
    reason: alternative_reading
  - marker: b
    text: μεγιστᾶνας는 ‘귀족들’ 외에도 ‘대인들’, ‘유력자들’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδησεν
  english_pob_choice: bound
  chosen_korean: 묶고
  alternatives_korean:
  - 결박하고
  - 사슬에 묶고
  lexicon: LSJ
  rationale: δέω는 기본적으로 ‘묶다, 결박하다’의 구체적 의미를 가지므로, 과도하게 형벌 수단을 특정하지 않는 ‘묶고’가 원문에 가깝습니다.
- source_word: τοὺς μεγιστᾶνας
  english_pob_choice: nobles
  chosen_korean: 귀족들
  alternatives_korean:
  - 대인들
  - 유력자들
  - 귀인들
  lexicon: LSJ
  rationale: μεγιστάνες는 궁정의 유력한 상층 인물을 가리키므로, 자연스러운 현대 한국어로는 ‘귀족들’이 가장 간결하고 적절합니다.
- source_word: συλλαβών
  english_pob_choice: after seizing
  chosen_korean: 붙잡은 뒤
  alternatives_korean:
  - 체포한 뒤
  - 사로잡은 뒤
  - 붙들고
  lexicon: LSJ
  rationale: 분사 구조의 연속 동작을 살리면서도, 법적 뉘앙스를 과하게 덧씌우지 않는 표현으로 ‘붙잡은 뒤’를 선택했습니다.
- source_word: ἀνήγαγεν ἐξ Αἰγύπτου
  english_pob_choice: brought him up from Egypt
  chosen_korean: 이집트에서 그를 끌어올렸습니다
  alternatives_korean:
  - 이집트에서 그를 데려왔습니다
  - 이집트에서 그를 끌고 올라왔습니다
  lexicon: LSJ
  rationale: ἀνάγω는 ‘올려 데려오다’의 방향성을 가지므로, 지리적 이동을 살리는 ‘끌어올렸습니다’가 원문의 감각을 보존합니다.
- source_word: Ἰωακεὶμ
  english_pob_choice: Jehoiakim
  chosen_korean: 여호야김
  alternatives_korean:
  - 요아킴
  - 여호야킴
  lexicon: standard biblical Korean form
  rationale: 그리스어 형태는 성경에서 통용되는 여호야김과 대응하므로, 확립된 한국어 성경 인명형을 따랐습니다.
