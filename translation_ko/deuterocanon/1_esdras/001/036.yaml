  to: 그리고 그는 여호야김의 귀족들[b]을 묶고, 그의 형제 자리온을 붙잡은 뒤 이집트에서 그를 끌고 올라왔습니다.[a]
  rationale: 원문의 압축된 주어와 ‘그의 형제’가 누구를 가리키는지에 대한 잠재적 모호성은 본문에서 해소하지 않았습니다. 다만 그리스어 고유명사의 직접적 음역, ἀνάγω의 이동 방향, 그리고 어휘 각주의 올바른 앵커 위치를 바로잡았습니다.
