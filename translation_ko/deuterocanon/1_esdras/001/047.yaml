base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/047.yaml
  text: And the leaders of the people and of the priests also committed much impiety and lawlessness[a], beyond all the uncleannesses of all the nations, and they defiled the sanctuary of the Lord[c][b], which had been sanctified in Jerusalem.
  footnotes:
  - marker: a
    text: Or 'more than all the impurities of all the nations.' The Greek phrase expresses excess or surpassing, and ἀκαθαρσίαι can be rendered 'uncleannesses,' 'impurities,' or 'defilements.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the temple of the Lord.' Greek ἱερόν can refer to the sanctuary or the temple precincts more broadly.
    reason: lexical_alternative
  - marker: c
    text: The Greek says literally 'the sanctuary of the Lord, the one sanctified in Jerusalem.' The participle may describe the sanctuary as consecrated there.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 백성의 지도자들과 제사장들도 많은 불경과 불법을 저질렀습니다[a]. 그들은 모든 민족의 모든 부정함을 넘어 주의 성소[b], 곧 예루살렘에서 거룩하게 구별된 곳[c]을 더럽혔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 민족의 모든 더러움보다 더’로도 옮길 수 있습니다. 여기서 ὑπέρ는 초과를, ἀκαθαρσίαι는 의례적·도덕적 부정함을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주의 성전’입니다. 그리스어 ἱερόν은 성소만이 아니라 성전 구역 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 그리스어는 문자적으로 ‘예루살렘에서 거룩하게 되는/거룩하게 된’ 성소라고 말합니다. 여기서는 성소가 예루살렘에서 성별된 곳이라는 뜻으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἡγούμενοι τοῦ λαοῦ καὶ τῶν ἱερέων
  english_pob_choice: the leaders of the people and of the priests
  chosen_korean: 백성의 지도자들과 제사장들
  alternatives_korean:
  - 백성과 제사장의 지도자들
  - 백성 및 제사장들의 지도자들
  lexicon: BDAG
  rationale: ἡγούμενοι는 단순한 ‘앞서 가는 이들’보다 공동체를 이끄는 지도층을 가리키므로 ‘지도자들’이 자연스럽고, 두 집단(백성/제사장)이 함께 책임이 있음을 드러내기 위해 병렬로 옮겼습니다.
- source_word: πολλὰ ἠσέβησαν καὶ ἠνόμησαν
  english_pob_choice: committed much impiety and lawlessness
  chosen_korean: 많은 불경과 불법을 저질렀습니다
  alternatives_korean:
  - 심한 불경과 불법을 행했습니다
  - 불경하게 하고 율법을 어겼습니다
  lexicon: BDAG
  rationale: ἀσεβέω와 ἀνομέω의 결합은 종교적 불경과 규범 위반을 함께 강하게 비난하므로, ‘불경과 불법’을 유지하되 한국어에서 자연스러운 ‘저질렀습니다’로 형식을 맞췄습니다.
- source_word: ὑπὲρ πάσας τὰς ἀκαθαρσίας πάντων τῶν ἐθνῶν
  english_pob_choice: beyond all the uncleannesses of all the nations
  chosen_korean: 모든 민족의 모든 부정함을 넘어
  alternatives_korean:
  - 모든 민족의 온갖 더러움을 넘어
  - 모든 민족의 모든 부정함보다 더
  lexicon: BDAG
  rationale: ὑπέρ의 초과 의미를 살리기 위해 ‘넘어’로 옮겼고, ἀκαθαρσίαι는 의례적·도덕적 ‘부정함’으로 번역해 성소 오염과의 연결을 유지했습니다.
- source_word: τὸ ἱερὸν τοῦ κυρίου τὸ ἁγιαζόμενον ἐν Ἰερουσαλήμ
  english_pob_choice: the sanctuary of the Lord, which had been sanctified in Jerusalem
  chosen_korean: 주의 성소, 곧 예루살렘에서 거룩하게 구별된 곳
  alternatives_korean:
  - 주의 성소, 곧 예루살렘에서 성별된 곳
  - 주의 성소, 예루살렘에서 거룩하게 된 곳
  lexicon: BDAG
  rationale: ἱερόν은 ‘성전’보다 넓게 성소/성전 구역을 가리킬 수 있어 ‘성소’로 두었고, ἁγιαζόμενον은 완료된 성별의 상태를 한국어로 자연스럽게 풀어 ‘거룩하게 구별된’으로 옮겼습니다.
theological_decisions:
- issue: κύριος의 번역과 1 Esdras의 제의적 맥락
  chosen_reading: 주
  alternative_readings:
