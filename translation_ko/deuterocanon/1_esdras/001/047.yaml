  - 야훼
  rationale: 이 절은 역사 서술의 성소 오염 문맥이므로 κύριος를 본문 그대로 ‘주’로 유지해 제의적 참조를 살리되, 본문 안에서 신명 직접 표기는 하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος'
