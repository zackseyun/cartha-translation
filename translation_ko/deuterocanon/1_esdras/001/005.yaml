base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/005.yaml
  text: according to the writing of David king of Israel[a], and according to the greatness of Solomon his son; and standing in the sanctuary according to your ancestral division, O Levites, before your brothers, the sons of Israel[c][b],
  footnotes:
  - marker: a
    text: Or 'according to the majesty/magnificence of Solomon his son.' The Greek term can denote grandeur or magnificence; here it likely refers to the authoritative scale or dignity of Solomon's arrangement.
    reason: lexical_alternative
  - marker: b
    text: The Greek says 'in the holy [place],' which may also be rendered 'in the holy place.'
    reason: lexical_alternative
  - marker: c
    text: The Greek phrase is compressed. The Hebrew parallel more fully reflects the sense 'by your fathers' houses, according to your divisions.'
    reason: alternative_reading
translation:
  language: ko
  text: 다윗 왕이 이스라엘의 기록에 따라, 또 그의 아들 솔로몬의 위대함에 따라, 그리고 성소에 서서, 레위인들인 여러분의 조상들의 분반에 따라, 여러분의 형제들 곧 이스라엘의 아들들 앞에 서십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기록’은 여기서 후대의 기술적 의미의 ‘성경’이 아니라, 다윗과 관련된 서면 지시나 규정의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ἐν τῷ ἁγίῳ는 문자적으로 ‘거룩한 곳에’이지만, 문맥상 성전의 성소를 가리키는 표현으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 그리스어의 ‘여러분의 조상들의 분반’은 압축된 표현이며, 히브리어 병행문은 ‘조상들의 집안에 따라, 여러분의 분반에 따라’라는 뜻을 더 분명히 보여 줍니다.
    reason: alternative_reading
lexical_decisions:
- source_word: γραφὴν
  english_pob_choice: writing
  chosen_korean: 기록
  alternatives_korean:
  - 글
  - 문서
  - 기록된 규정
  lexicon: LSJ
  rationale: 여기서 γραφή는 후대의 기술적 의미의 ‘성경’이 아니라 다윗과 관련된 서면 지시를 가리키므로, 구체성을 살린 ‘기록’이 가장 자연스럽습니다.
- source_word: μεγαλειότητα
  english_pob_choice: greatness
  chosen_korean: 위대함
  alternatives_korean:
  - 위엄
  - 장엄함
  - 광대함
  lexicon: LSJ
  rationale: 솔로몬의 왕적 규모와 위상을 가리키는 말이므로, ‘위대함’이 현대 한국어에서 가장 직접적이고 과장되지 않은 대응입니다.
- source_word: ἐν τῷ ἁγίῳ
  english_pob_choice: in the sanctuary
  chosen_korean: 성소에
  alternatives_korean:
  - 거룩한 곳에
  - 성전의 거룩한 곳에
  - 성소 안에
  lexicon: LSJ
  rationale: 직역하면 ‘거룩한 곳에’이지만, 문맥상 성전 공간을 가리키는 표현이므로 ‘성소’가 가장 분명합니다.
- source_word: μεριδαρχίαν τὴν πατρικὴν ὑμῶν
  english_pob_choice: according to your ancestral division
  chosen_korean: 여러분의 조상들의 분반에 따라
  alternatives_korean:
  - 여러분의 조상 집안의 분반에 따라
  - 여러분의 조상 가문에 따른 분반에 따라
  - 여러분의 가문의 반열에 따라
  lexicon: LSJ
  rationale: μεριδαρχία는 성전 봉사의 질서 있는 분반을 뜻하는 희귀어이고, πατρική는 혈통·가문을 가리키므로 두 요소를 함께 살린 ‘조상들의 분반’이 압축된 그리스어를 가장 잘 드러냅니다.
- source_word: υἱῶν Ἰσραήλ
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  - 이스라엘의 자손들
  lexicon: LSJ
  rationale: 원문이 남성 가족 호칭을 분명히 사용하므로, 이를 평탄화하지 않고 ‘이스라엘의 아들들’로 살렸습니다.
theological_decisions:
- issue: 레위인에 대한 직접 명령형/호소형의 재현
  chosen_reading: ‘서십시오’로 옮겨, 문맥상 레위인들에게 주어지는 지시의 힘을 살렸습니다.
  alternative_readings:
  - ‘서 있었습니다’
  - ‘서 있으십시오’
  - ‘서게 하십시오’
  rationale: στᾶντες는 분사형이지만 문맥상 지시적 힘이 강하므로, 한국어에서는 공문체적 명령에 가까운 ‘서십시오’가 가장 자연스럽고 원문 의도를 잘 전달합니다.
  doctrine_reference: '번역 원칙: 원문 수사 기능 보존'
- issue: 남성형 친족 표현의 유지
  chosen_reading: υἱῶν Ἰσραήλ을 ‘이스라엘의 아들들’로 유지했습니다.
  alternative_readings:
  - 이스라엘 백성
  - 이스라엘 사람들
  - 이스라엘의 자손들
  rationale: 원문은 공동체를 남성 친족 언어로 표현하므로, 문맥이 요구하지 않는 한 이를 중화하지 않고 보존하는 것이 원문 충실성에 부합합니다.
  doctrine_reference: '번역 원칙: 성별 표시가 있는 친족 표현의 보존'
