revisions:
- from: 내가 너에게 맞서 보냄을 받은 것이 아니냐? 주 하나님께서 보내셨기 때문이다. 나의 싸움은 유프라테스에 있으며, 지금 주님께서 나와 함께 계시고, 주님께서 나와 함께 서두르십니다. 비켜서라, 그리고 주님을 거슬러 대적하지 마라.[a][b]
  to: 내가 당신을 대적하려고 주 하나님께서 보내신 사람이 아니겠습니까? 내 전쟁은 유프라테스에 있습니다[a]. 지금 주님께서 나와 함께 계시며, 나와 함께하시는 주님께서 나를 재촉하고 계십니다[b]. 물러서십시오. 주님께 맞서지 마십시오.
  rationale: 그리스어의 수사 의문문과 그 뒤의 전쟁 장소 설명을 보존했습니다. 반복되는 ‘주님’ 및 ‘나와 함께’를 유지하되, 분사의 추진 의미는 현대 한국어에서 자연스럽게 ‘나를 재촉하고 계십니다’로 밝혔습니다. 명령문은 합쇼체로 통일했으며, 각주 표지를 해당 표현 바로 뒤로 옮겼습니다. ‘당신’은 이 직접 대화에서 현대 표준어 합쇼체와 문법적으로 조응하는 중립적 2인칭으로 사용했습니다.
