  naturalness: 초안의 ‘비켜서라’, ‘마라’는 요구된 현대 합쇼체와 맞지 않습니다. ‘물러서십시오’, ‘맞서지 마십시오’가 자연스럽고 일관된 격식체입니다. ‘나의 싸움은 유프라테스에 있으며’도 가능하지만 ‘내 전쟁은 유프라테스에 있습니다’가 군사적 장소 표현으로 더 자연스럽습니다.
