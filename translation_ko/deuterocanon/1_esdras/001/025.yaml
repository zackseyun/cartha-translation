base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/025.yaml
  text: Was I not sent against you by the Lord God? For my war is on the Euphrates[a], and now the Lord is with me, and the Lord is with me, urging me on. Stand aside[b], and do not oppose the Lord.
  footnotes:
  - marker: a
    text: Or 'at the Euphrates' or 'by the Euphrates.' The Greek phrase marks the location of Neco's campaign; the Hebrew parallel names Carchemish on the Euphrates.
    reason: lexical_alternative
  - marker: b
    text: Or 'hastening me' or 'speeding me on.' The Greek participle indicates that the Lord is pressing the campaign forward.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 당신을 대적하려고 주 하나님께서 보내신 사람이 아니겠습니까? 내 전쟁은 유프라테스에 있습니다[a]. 지금 주님께서 나와 함께 계시며, 나와 함께하시는 주님께서 나를 재촉하고 계십니다[b]. 물러서십시오. 주님께 맞서지 마십시오.
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 또는 ‘유프라테스에서’ 또는 ‘유프라테스 곁에서’. 그리스어 표현은 느고의 원정 장소를 가리키며, 히브리어 평행본문은 유프라테스의 갈그미스를 언급합니다.
    reason: ἐπὶ τοῦ Εὐφράτου의 장소 표현에 대한 번역 가능성을 제시하며, 표지를 ‘유프라테스’에 직접 연결합니다.
  - marker: b
    text: 또는 ‘나를 서두르게 하십니다’, ‘나를 재촉해 나아가게 하십니다’, 또는 ‘나를 앞당기십니다’. 그리스어 분사는 주님께서 그 원정을 추진하신다는 뜻입니다.
    reason: ἐπισπεύδων의 가속·재촉 의미와 그것이 화자에게 향한다는 문맥적 이해를 명확히 합니다.
lexical_decisions:
- source_word: οὐχὶ πρὸς σὲ ἐξαπέσταλμαι
  english_pob_choice: Was I not sent against you?
  chosen_korean: 내가 너에게 맞서 보냄을 받은 것이 아니냐?
  alternatives_korean:
  - 내가 너에게 보내진 것이 아니냐?
  - 내가 너를 향해 보냄을 받은 것이 아니냐?
  lexicon: BDAG
  rationale: 반문형의 수사적 뉘앙스를 살리되, 군사적 문맥에서 πρός σὲ의 대립성을 '너에게 맞서'로 드러냈습니다.
- source_word: ὑπὸ Κυρίου τοῦ θεοῦ
  english_pob_choice: by the Lord God
  chosen_korean: 주 하나님께서
  alternatives_korean:
  - 주께서
  - 주 하나님께
  - 주, 하나님께서
  lexicon: BDAG
  rationale: ὑπό의 행위 주체를 한국어 능동문으로 옮겨 '보내셨기 때문이다'로 풀어, 파송의 원인을 자연스럽게 드러냈습니다.
- source_word: ἐπὶ γὰρ τοῦ Εὐφράτου
  english_pob_choice: my war is on the Euphrates
  chosen_korean: 나의 싸움은 유프라테스에 있으며
  alternatives_korean:
  - 나의 전쟁은 유프라테스에 있으며
  - 나의 전쟁은 유프라테스에서 일어나고 있으며
  lexicon: BDAG
  rationale: 전쟁의 장소를 가리키는 표현으로 보아 '유프라테스에'를 택했고, 문맥상 한국어에서는 '싸움'이 가장 자연스럽습니다.
- source_word: ἐπισπεύδων
  english_pob_choice: urging me on
  chosen_korean: 서두르십니다
  alternatives_korean:
  - 재촉하십니다
  - 앞당기십니다
  - 몰아가십니다
  lexicon: LSJ
  rationale: 분사형의 추진·가속 의미를 살리되, 한국어에서 자연스러운 동사로 압축해 신적 지원의 적극성을 나타냈습니다.
- source_word: ἀπόστηθι, καὶ μὴ ἐναντίου τῷ κυρίῳ
  english_pob_choice: Stand aside, and do not oppose the Lord.
  chosen_korean: 비켜서라, 그리고 주님을 거슬러 대적하지 마라.
  alternatives_korean:
  - 물러서라, 그리고 주님을 거슬러 맞서지 마라
  - 비켜서라, 그리고 주님께 맞서지 마라
  lexicon: LSJ
  rationale: ἀπόστηθι의 물러남 명령과 ἐναντίου의 대항 의미를 분명히 살리기 위해 두 겹의 경고로 옮겼습니다.
theological_decisions:
- issue: κύριος의 반복과 Neco의 신적 파송 주장
  chosen_reading: 본문의 주장은 그대로 살려 처음의 '주 하나님'과 뒤의 '주님'을 유지하고, 발화자가 야훼의 권위를 주장하는 긴장을 해소하지 않았습니다.
  alternative_readings:
  - 모호하게 '어떤 주님'으로 약화
  - Neco의 자기 정당화로만 환원
  rationale: 그리스어가 분명히 신적 파송과 동반을 말하므로, 번역은 그 주장 자체를 보존해야 하며 해석으로 긴장을 지워서는 안 됩니다.
  doctrine_reference: 'DOCTRINE.md: κύριος → 주님 / 번역은 본문의 신적 주장과 긴장을 보존'
