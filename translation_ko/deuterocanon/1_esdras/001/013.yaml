base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/013.yaml
  text: For the priests were offering up the fat until evening[a], and the Levites prepared for themselves and for the priests, their brothers, the sons of Aaron.
  footnotes:
  - marker: a
    text: Or 'the fat portions.' The Greek refers to the sacrificial fat offered on the altar.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 제사장들은 기름기들을 저녁까지 계속 제물로 올렸고[a], 레위 사람들은 자기들을 위해, 그리고 그들의 형제요 아론의 아들들인 제사장들을 위해 준비하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기름 부분들을’. 그리스어는 제단에 바치는 희생 제물의 기름을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέφερον
  english_pob_choice: were offering up
  chosen_korean: 계속 제물로 올렸고
  alternatives_korean:
  - 제물로 올렸고
  - 바쳤고
  lexicon: BDAG
  rationale: 희생 제의 맥락의 ἀναφέρω는 단순한 ‘올리다’보다 제단에 ‘제물로 올리다’가 더 정확하며, 미완료 시상은 ‘계속’으로 진행성을 살렸습니다.
- source_word: τὰ στέατα
  english_pob_choice: the fat
  chosen_korean: 기름기들을
  alternatives_korean:
  - 기름들을
  - 기름 부분들을
  lexicon: LSJ
  rationale: στέαρ은 희생 제물의 기름을 가리키므로, 제의적 의미를 드러내되 자연스러운 한국어로 ‘기름기들’을 택했습니다.
- source_word: ἕως ὀψίας
  english_pob_choice: until evening
  chosen_korean: 저녁까지
  alternatives_korean:
  - 해 질 때까지
  - 저물 때까지
  lexicon: LSJ
  rationale: 시간 표현은 그리스어의 직접적 범위를 따라 ‘저녁까지’로 옮겨, 원문의 단순한 종결 시점을 유지했습니다.
- source_word: τοῖς ἱερεῦσιν ἀδελφοῖς αὐτῶν
  english_pob_choice: for the priests, their brothers
  chosen_korean: 그들의 형제요 아론의 아들들인 제사장들
  alternatives_korean:
  - 그들의 형제인 제사장들
  - 그들의 형제 곧 제사장들
  lexicon: BDAG
  rationale: ‘형제들’이라는 친족·동족 표현을 살리면서, 뒤의 ‘아론의 아들들’이 제사장 신분을 한정하므로 관계를 풀어 표기했습니다.
- source_word: υἱοῖς Ἀαρών
  english_pob_choice: the sons of Aaron
  chosen_korean: 아론의 아들들
  alternatives_korean:
  - 아론의 자손들
  - 아론의 아들들인
  lexicon: BDAG
  rationale: 성전 제의 문맥의 전통적 사제 호칭을 따라 직역에 가깝게 옮겼습니다.
theological_decisions:
- issue: 희생 제의 동사 ἀνέφερον의 제의적 의미
  chosen_reading: ‘계속 제물로 올렸고’로 번역해 단순한 이동이 아니라 제단에 드리는 행위를 분명히 했습니다.
  alternative_readings:
  - ‘계속 올렸고’
  - ‘바쳤고’
  rationale: 본문은 제사장들의 희생 제사 행위를 말하므로, 제의적 맥락을 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 'POB translation philosophy: source-directed cultic precision'
- issue: ἀδελφοῖς의 친족 표현
  chosen_reading: ‘그들의 형제’로 보존하되, 제사장 신분을 설명적으로 덧붙였습니다.
  alternative_readings:
  - ‘동료 제사장들’
  - ‘친족인 제사장들’
  rationale: 본문의 형제 언어를 중화하지 않고 유지해야 하며, 이는 제사장 집단 내부의 혈연·동족 연대를 드러냅니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
