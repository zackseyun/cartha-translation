base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/010.yaml
  text: And when these things had taken place[a], the priests and the Levites stood in proper order, holding the unleavened bread, according to the tribes and according to the family divisions of the fathers, before the people, to offer to the Lord according to what is written in the book of Moses[b]; and so they did in the morning.
  footnotes:
  - marker: a
    text: Or 'according to the ancestral-house divisions' or 'according to their fathers' houses.'
    reason: lexical_alternative
  - marker: b
    text: The Greek here differs notably from the approximate Hebrew parallel in 2 Chronicles 35:10, which speaks of Levite leaders providing Passover animals; this translation follows the Greek text of 1 Esdras.
    reason: textual_variant
translation:
  language: ko
  text: 이 일들이 이루어진 뒤에, 제사장들과 레위인들은 무교병을 들고 지파별로, 또 부계 조상들의 가문별 구분에 따라[a] 백성 앞에 질서 있게 서서, 모세의 책에 기록된 대로 주님께 드리려고 했습니다[b]. 그들은 아침에도 이렇게 했습니다.
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 또는 ‘조상들의 가문별 구분에 따라’ 또는 ‘그들의 조상 집안별로’.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 본문은 2역대기 35:10의 대략적인 히브리어 병행본문과 뚜렷이 다릅니다. 이 번역은 1에스드라의 그리스어 본문을 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: εὐπρεπῶς
  english_pob_choice: in proper order
  chosen_korean: 질서 있게
  alternatives_korean:
  - 정중하게
  - 보기 좋게
  - 알맞게
  lexicon: LSJ
  rationale: 제의적 배치와 행렬의 정돈된 상태를 자연스럽게 드러내기 위해, 외형적 미감보다 배열의 질서를 살리는 표현을 택했습니다.
- source_word: τὰ ἄζυμα
  english_pob_choice: the unleavened bread
  chosen_korean: 떡없는 빵
  alternatives_korean:
  - 무교병
  - 누룩 없는 빵
  lexicon: LSJ
  rationale: 본문은 유월절 제의 문맥의 무교식을 가리키므로, 전통 교회어보다 의미가 즉시 드러나는 현대어를 사용했습니다.
- source_word: μεριδαρχίας τῶν πατέρων
  english_pob_choice: family divisions of the fathers
  chosen_korean: 각 조상의 가문 구분
  alternatives_korean:
  - 조상들의 집안 구분
  - 족장 가문별 구분
  lexicon: LSJ
  rationale: τῶν πατέρων의 가문/부친 집단 언어를 유지하면서, μεριδαρχίας의 분할·편성 의미를 한국어로 풀어 보였습니다.
- source_word: τῷ κυρίῳ
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 하나님
  lexicon: LSJ
  rationale: 제의적 문맥에서 κύριος는 하나님을 가리키므로, 한국어 예배어법에 맞는 ‘주님’을 선택했습니다.
- source_word: κατὰ τὰ γεγραμμένα ἐν βιβλίῳ Μωυσῆ
  english_pob_choice: according to what is written in the book of Moses
  chosen_korean: 모세의 책에 기록된 대로
  alternatives_korean:
  - 모세의 책에 적힌 대로
  - 모세 책에 기록된 대로
  lexicon: LSJ
  rationale: 기록된 권위에 대한 복종을 분명히 하되, 한국어에서 자연스러운 ‘-된 대로’ 구문으로 옮겼습니다.
theological_decisions:
- issue: 1 Esdras의 그리스어 본문을 히브리어 병행본문과 구별해 번역할지 여부
  chosen_reading: 그리스어 본문대로 제사장들과 레위인이 무교식을 들고 주님께 드리려 서 있는 장면을 유지했습니다.
  alternative_readings:
  - 역대기 병행본문처럼 레위 지도자들의 제물 제공으로 맞추기
  - 병행본문을 따라 유월절 동물 제물로 조정하기
  rationale: 이 서사는 1 Esdras의 그리스어를 우선해야 하므로, 병행본문은 배경 점검으로만 사용하고 본문 자체의 장면을 보존했습니다.
  doctrine_reference: Deuterocanonical / Apocrypha translation policy
- issue: ‘조상의 가문’ 같은 남성 조상 언어를 어떻게 처리할지
  chosen_reading: ‘각 조상의 가문 구분’으로 보존했습니다.
  alternative_readings:
  - 중립적으로 ‘가문별 구분’으로 완화하기
  - ‘조상 가문들’로 바꾸기
  rationale: 원문의 혈연·가문 질서를 흐리지 않기 위해, 남성 조상 지시를 삭제하지 않고 드러냈습니다.
  doctrine_reference: Gender-accurate rendering policy
