revisions:
- from: 그리고 이런 일이 일어났습니다[a]. 제사장들과 레위인들은 떡없는 빵을 들고, 각 지파와 각 조상의 가문 구분에 따라, 백성 앞에 질서 있게 서서, 모세의 책에 기록된 대로 주님께 드리려고 했습니다[b]. 그리고 그들은 아침에 그렇게 했습니다.
  to: 이 일들이 이루어진 뒤에, 제사장들과 레위인들은 무교병을 들고 지파별로, 또 부계 조상들의 가문별 구분에 따라[a] 백성 앞에 질서 있게 서서, 모세의 책에 기록된 대로 주님께 드리려고 했습니다[b]. 그들은 아침에도 이렇게 했습니다.
  rationale: 무교병의 전문적·자연스러운 한국어 용어를 채택하고, 지파와 부계 조상 집단이라는 두 분류 기준의 병렬을 분명히 했습니다. εὐπρεπῶς ἔστησαν의 제의적 정돈과 προσενεγκεῖν의 목적 표현을 유지했습니다. τὸ πρωϊνόν은 기술적 ‘아침 제사’로 과도하게 해석하지 않고 ‘아침에도 이렇게 했습니다’로 옮겼습니다. 각주 표지는 영어 감사 기록의 기능에 맞추어 재배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T05:28:49Z'
review_pass:
  verdict: revise
  source_fidelity: 그리스어의 핵심 장면(제사장들과 레위인들이 무교병을 들고, 지파와 부계 조상 집단의 구분에 따라 백성 앞에 서서 주님께 드리려 함)은 대체로 보존했습니다. 그러나 ‘그리고 이런 일이 일어났습니다’는 καὶ ταῦτα τὰ γενόμενα의 다소 압축된 전환을 부자연스럽게 풀고, ‘조상의 가문 구분’은 κατὰ τὰς φυλὰς καὶ κατὰ τὰς μεριδαρχίας τῶν πατέρων의 병렬적 분류를 충분히 명료하게 드러내지 못합니다.
  naturalness: ‘떡없는 빵’은 현대 표준 한국어에서 비문에 가깝고, 성서·유월절 문맥에서는 ‘무교병’이 정확하고 자연스럽습니다. 또한 ‘각 지파와 각 조상의 가문 구분에 따라’는 수식 관계가 어색합니다. ‘부계 조상들의 가문별 구분’은 원문의 남성 조상 언어를 유지하면서도 자연스럽습니다.
  terminology: τὰ ἄζυμα는 ‘무교병’으로 옮기는 것이 가장 안정적입니다. κύριος는 문맥상 ‘주님’으로 유지할 수 있습니다. μεριδαρχίας τῶν πατέρων은 확정적으로 ‘조상들의 집안’이라고 단정하기보다 ‘부계 조상들의 가문별 구분’으로 번역하여 원문의 압축성과 분류 의미를 보존합니다.
  issues:
  - severity: medium
    issue: ‘떡없는 빵’이라는 표현
    rationale: τὰ ἄζυμα의 의미는 전달하지만, 한국어에서는 ‘떡없는 빵’이 자연스럽지 않습니다. 유월절·제의 문맥의 표준적이고 이해 가능한 용어인 ‘무교병’이 적절합니다.
  - severity: medium
    issue: ‘각 조상의 가문 구분’의 문법 및 의미 불명확성
    rationale: 원문은 ‘지파들에 따라’와 ‘부계 조상들의 분할/구분에 따라’를 병렬로 제시합니다. 초안은 ‘각 조상의 가문 구분’이 무엇을 뜻하는지 모호하고 ‘각 지파’와의 병렬도 약합니다.
  - severity: low
    issue: 각주 a의 위치와 내용
    rationale: 영어 감사 기록에서 a는 부계 조상 집단 관련 표현의 대안을 설명하지만, 초안에서는 첫 문장의 ‘이런 일이 일어났습니다’에 붙어 있습니다. 해당 각주는 가문별 구분 표현에 붙여야 합니다.
  - severity: low
    issue: 각주 b의 지시 대상
    rationale: 본문의 ‘모세의 책에 기록된 대로’에 붙이는 것이 영어 감사 기록과 독자의 이해에 더 직접적으로 대응합니다.
