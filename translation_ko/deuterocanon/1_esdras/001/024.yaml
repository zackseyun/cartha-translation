translation:
  language: ko
  text: 요시야가 그를 맞이했습니다. 그리고 이집트 왕이 그에게 사람을 보내어 말했습니다. “나와 그대 사이에 무슨 일이 있습니까, 유다의 왕이여?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 관용적으로는 “내게 무슨 상관이 있습니까?”라고 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 본문은 “유다의 왕”에 해당하는 Ἰουδαίας를 사용합니다. 역사적 평행본문을 따라 “유대의 왕”으로 읽을 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπάντησιν αὐτῷ Ἰωσείας
  english_pob_choice: Josiah met him
  chosen_korean: 요시야가 그를 맞이했습니다
  alternatives_korean:
  - 요시야가 그를 만났습니다
  - 요시야가 그와 마주쳤습니다
  lexicon: LSJ
  rationale: 명사 ἀπάντησιν은 ‘만남, 맞이함’의 뜻이므로, 한국어에서는 간결한 동사구로 옮기되 단순 우연적 ‘마주침’보다 의도적 만남의 뉘앙스를 살려 ‘맞이했습니다’로 렌더링했습니다.
- source_word: διεπέμψατο
  english_pob_choice: sent word
  chosen_korean: 사람을 보내어 말했습니다
  alternatives_korean:
  - 말을 전했습니다
  - 사자를 보내어 말했습니다
  lexicon: LSJ
  rationale: 동사는 중개자를 통해 보내는 행위를 가리키므로, 본문에 드러난 수신·발화의 흐름을 자연스럽게 살려 ‘사람을 보내어 말했습니다’로 옮겼습니다. ‘사자’를 넣는 선택도 가능하지만, 헬라어 본문에 명시되지 않은 요소를 과하게 보강하지 않기 위해 덜 특정하게 처리했습니다.
- source_word: Τί ἐμοὶ καὶ σοὶ ἐστίν
  english_pob_choice: What is there between me and you
  chosen_korean: 나와 그대 사이에 무슨 일이 있습니까
  alternatives_korean:
  - 내게 무슨 상관이 있습니까
  - 무엇이 나와 그대에게 있습니까
  lexicon: LSJ
  rationale: 이 표현은 셈어적 관용구로 거리 두기와 도전의 뉘앙스를 함께 담습니다. POB의 직역적 구조를 따라 ‘사이’ 표현을 살리되, 한국어에서 자연스럽고 격조 있는 형태로 옮겼습니다.
- source_word: βασιλεῦ τῆς Ἰουδαίας
  english_pob_choice: O king of Judea
  chosen_korean: 유다의 왕이여
  alternatives_korean:
  - 유대의 왕이여
  - 유다 왕이여
  lexicon: LSJ
  rationale: 그리스어 본문은 Ἰουδαία를 사용하므로, 영어 POB의 ‘Judea’보다 한국어에서는 역사적 지역명 ‘유다’가 더 직접적이고, 본문에 나타난 호격도 살릴 수 있어 ‘유다의 왕이여’로 옮겼습니다.
theological_decisions:
- issue: 셈어적 도전 관용구의 강도
  chosen_reading: 관계 단절 또는 적대의 가능성을 열어 두는 표현으로 처리했습니다.
  alternative_readings:
  - 더 강한 대립 뉘앙스로 옮길 수 있습니다
  - 단순한 외교적 거리 두기로 완화할 수 있습니다
  rationale: Τί ἐμοὶ καὶ σοὶ ἐστίν은 문맥에 따라 공격적이거나 단호한 거리 두기로 읽힐 수 있습니다. 한국어 번역도 그 긴장을 너무 빨리 해소하지 않도록, 지나치게 부드럽거나 과격하게 확정하지 않는 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
