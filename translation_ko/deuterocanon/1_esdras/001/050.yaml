translation:
  language: ko
  text: 이 사람들은 성전[a] 주변에서 자기들의 젊은이들을 칼로 죽였고, 젊은 남자나 처녀나 노인이나 어린 사람도 용서하지 않았습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 형식적으로, ‘거룩한 성전 주변에서’입니다.
    reason: lexical_alternative
  - marker: b
    text: 제공된 히브리어 병행본문은 이 위치에서 본문과 정확히 일치하지 않으며, 그리스어는 성전 주변의 살육을 구체적으로 묘사합니다.
    reason: cross_reference
lexical_decisions:
- source_word: οὗτοι
  english_pob_choice: These men
  chosen_korean: 이 사람들은
  alternatives_korean:
  - 이들은
  - 그 사람들은
  lexicon: LSJ
  rationale: 지시대명사는 앞선 침략자들을 가리키므로, 현대 한국어에서는 ‘이 사람들은’이 지시성과 서술성을 함께 자연스럽게 살립니다.
- source_word: ἐν ῥομφαίᾳ
  english_pob_choice: with the sword
  chosen_korean: 칼로
  alternatives_korean:
  - 칼로써
  - 검으로
  lexicon: LSJ
  rationale: 폭력적 도구를 한국어로 직접적이고 자연스럽게 옮기기 위해 ‘칼로’를 택했습니다. 본문은 전쟁/학살 서술이므로 완곡하게 돌리지 않았습니다.
- source_word: περικύκλῳ τοῦ ἁγίου ἱεροῦ
  english_pob_choice: around the holy temple
  chosen_korean: 성전 주변에서
  alternatives_korean:
  - 거룩한 성전 주위에서
  - 거룩한 성전 둘레에서
  lexicon: LSJ
  rationale: περικύκλῳ는 단순히 ‘둘레에/주변에’의 뜻이므로 한국어에서는 ‘주변에서’가 가장 자연스럽습니다. ἱερόν은 내실(성소)보다 성전 परिसर/성전 전체를 가리키므로 ‘성전’이 적절합니다.
- source_word: οὐκ ἐφείσαντο
  english_pob_choice: they showed no mercy to
  chosen_korean: 용서하지 않았습니다
  alternatives_korean:
  - 아끼지 않았습니다
  - 살려 두지 않았습니다
  - 불쌍히 여기지 않았습니다
  lexicon: LSJ
  rationale: 직역의 ‘아끼지 않았다/사면하지 않았다’도 가능하지만, 학살 문맥에서 결과를 분명히 드러내는 한국어로 ‘용서하지 않았습니다’를 사용했습니다. 다만 원뜻의 ‘spare’ 범위는 유지됩니다.
- source_word: πρεσβύτου καὶ νεωτέρου
  english_pob_choice: old man or youth
  chosen_korean: 노인이나 어린 사람
  alternatives_korean:
  - 늙은이와 젊은이
  - 노인이나 젊은이
  - 늙은이와 어린이
  lexicon: LSJ
  rationale: 대조되는 연령 범주를 한국어로 살리되, νεωτέρου는 단순한 ‘젊은이’보다 넓은 ‘어린 사람’이 더 포괄적입니다. 남성/여성의 대립은 이미 앞의 ‘젊은 남자’와 ‘처녀’가 담당합니다.
theological_decisions:
- issue: Greek 본문의 학살 서술을 MT 병행본문에 맞춰 바꿀지 여부
  chosen_reading: 그리스어 본문대로 성전 주변의 학살과 무차별 살해를 직접 번역했습니다.
  alternative_readings:
  - MT 병행본문처럼 지도자, 백성, 성전 더럽힘의 내용으로 조정하기
  rationale: 이 구절의 주 번역 축은 Swete LXX 그리스어이며, 제공된 히브리어 병행본문은 근사적 참고에 불과합니다. 따라서 병행본문 내용을 끌어와 본문을 바꾸면 원문이 말하는 장면을 흐리게 됩니다.
  doctrine_reference: 1 Esdras의 번역은 LXX 그리스어 본문을 우선하는 원칙
- issue: οὐκ ἐφείσαντο의 강한 폭력성 유지
  chosen_reading: ‘용서하지 않았습니다’로 번역해 무차별 학살의 냉혹함을 드러냈습니다.
  alternative_readings:
  - ‘불쌍히 여기지 않았습니다’
  - ‘살려 두지 않았습니다’
  rationale: 본문은 단순한 감정 부재가 아니라 특정 집단을 가리지 않는 학살을 강조합니다. 한국어에서도 그 긴장을 약화시키지 않도록 강한 부정의 뉘앙스를 유지했습니다.
  doctrine_reference: 본문의 서술적 폭력성 보존 원칙
