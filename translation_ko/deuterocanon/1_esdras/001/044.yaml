base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/044.yaml
  text: And he appointed Zedekiah king of Judea and Jerusalem; Zedekiah was twenty-one years old[a], and he reigned eleven years.
  footnotes:
  - marker: a
    text: 'Greek: ''Judea and Jerusalem.'' The Hebrew parallel tradition in this context commonly has ''Judah and Jerusalem.'' The main text follows the Greek source of 1 Esdras rather than harmonizing to the Hebrew parallel.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그는 유다아와 예루살렘의 왕으로 시드기야를 세웠습니다. 시드기야는 스물한 살이었고, 그는 열한 해 동안 다스렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 ‘유다아와 예루살렘’을 읽습니다. 이 문맥의 히브리어 평행 전승에는 흔히 ‘유다와 예루살렘’이 나옵니다. 본문은 히브리 평준화가 아니라 1 에스드라의 그리스어 본문을 따랐습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέδειξεν
  english_pob_choice: appointed
  chosen_korean: 세웠습니다
  alternatives_korean:
  - 임명했습니다
  - 세웠습니다
  lexicon: LSJ
  rationale: 왕위에 올려 공식적으로 세운다는 뜻을 살리되, 한국어에서는 ‘임명’보다 군주 즉위 맥락에 자연스러운 ‘세우다’가 더 직접적입니다.
- source_word: Σεδεκίαν
  english_pob_choice: Zedekiah
  chosen_korean: 시드기야
  alternatives_korean:
  - 세드기야
  - 시드기야
  lexicon: 공인 성서 인명 표기
  rationale: 히브리어/한국어 성서 관용 표기를 따라 시드기야로 옮겼습니다.
- source_word: τῆς Ἰουδαίας καὶ Ἰερουσαλήμ
  english_pob_choice: Judea and Jerusalem
  chosen_korean: 유다아와 예루살렘
  alternatives_korean:
  - 유대와 예루살렘
  - 유다와 예루살렘
  lexicon: 지명 음역/지명 대응
  rationale: POB의 그리스어 본문을 따라 Ἰουδαία를 히브리 병행의 ‘유다’로 평준화하지 않고 ‘유다아’로 옮겨, 병행 전통과의 차이를 드러냈습니다.
- source_word: ὄντα ἐτῶν εἴκοσι ἑνός
  english_pob_choice: was twenty-one years old
  chosen_korean: 스물한 살이었고
  alternatives_korean:
  - 스물한 살이었습니다
  - 스물한 해였고
  lexicon: LSJ
  rationale: 연령 표현을 현대 한국어의 자연스러운 서술로 옮겼습니다.
- source_word: βασιλεύει δὲ ἔτη ἕνδεκα
  english_pob_choice: he reigned eleven years
  chosen_korean: 그는 열한 해 동안 다스렸습니다
  alternatives_korean:
  - 그는 열한 해 동안 통치했습니다
  - 그는 열한 해 동안 왕으로 있었습니다
  lexicon: LSJ
  rationale: 왕의 재위라는 의미를 살리면서도 한국어 문맥에서 ‘다스리다’가 가장 자연스럽습니다.
