base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/046.yaml
  text: And though he had sworn by the name of the Lord to King Nebuchadnezzar[a], he broke his oath and rebelled; and, stiffening his neck and his heart[c][b], he transgressed the laws of the Lord God of Israel.
  footnotes:
  - marker: a
    text: Or, more literally, 'having been sworn from/by King Nebuchadnezzar.' The Greek preposition is awkward in English here; the sense is that he had taken an oath of loyalty in relation to the king.
    reason: lexical_alternative
  - marker: b
    text: '''Rebelled'' likely refers to revolt against Nebuchadnezzar, though the Greek does not restate the object explicitly.'
    reason: alternative_reading
  - marker: c
    text: Or 'the statutes' or 'the ordinances' of the Lord God of Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 바벨론 왕 느부갓네살에게 주님의 이름으로 맹세를 했으나, 맹세를 깨고 반역하였으며, 목과 마음을 완고하게 하여 이스라엘의 주 하나님께서 정하신 법들을 어겼습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek preposition ἀπό is awkward here; the sense is that the oath was taken in relation to King Nebuchadnezzar.
    reason: source_note
  - marker: b
    text: '''Rebelled'' refers to defection against Nebuchadnezzar, though the Greek does not restate the object.'
    reason: alternative_reading
  - marker: c
    text: Or 'the statutes' or 'the ordinances' of the Lord God of Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁρκισθεὶς
  english_pob_choice: had sworn
  chosen_korean: 맹세를 했으나
  alternatives_korean:
  - 맹세하였으나
  - 맹세해 놓고
  lexicon: BDAG
  rationale: 선행한 맹세를 가리키는 분사로 보아, 한국어에서도 뒤의 위반 행위에 앞서는 배경 동작으로 자연스럽게 옮겼습니다.
- source_word: ἀπὸ τοῦ βασιλέως Ναβουχοδονόσορ
  english_pob_choice: to King Nebuchadnezzar
  chosen_korean: 바벨론 왕 느부갓네살에게
  alternatives_korean:
  - 느부갓네살 왕에게
  - 바벨론 왕 느부갓네살에게 충성의 맹세를 하고
  lexicon: BDAG
  rationale: ἀπό의 어색함은 영어 주석처럼 관계·대상성을 뜻하는 것으로 보고, 맹세의 상대를 분명히 하되 본문에 없는 설명을 과하게 덧붙이지 않았습니다.
- source_word: ἐφιορκήσας ἀπέστη
  english_pob_choice: he broke his oath and rebelled
  chosen_korean: 맹세를 깨고 반역하였으며
  alternatives_korean:
  - 맹세를 어기고 반역하였으며
  - 거짓 맹세를 하고 반역하였으며
  lexicon: LSJ
  rationale: ἐφιορκήσας는 이미 한 맹세를 위반한 뜻이므로 '맹세를 깨고'로, ἀπέστη는 정치적 이탈·반란의 의미가 분명해 '반역하다'로 옮겼습니다.
- source_word: τὰ νόμιμα
  english_pob_choice: the laws
  chosen_korean: 정하신 법들
  alternatives_korean:
  - 율법들
  - 법도들
  lexicon: LSJ
  rationale: νόμιμα는 여기서 단순한 일반법보다 규정된 법적 요구를 가리키므로, 하나님께서 제정하신 권위를 드러내는 방향으로 '정하신 법들'을 택했습니다.
theological_decisions:
- issue: κύριος와 Κυρίου θεοῦ Ἰσραήλ의 한국어 처리
  chosen_reading: 주님 / 이스라엘의 주 하나님
  alternative_readings:
  - 주 / 이스라엘의 주 하나님
  - 야훼 / 이스라엘의 야훼 하나님
  rationale: 본문은 그리스어 κύριος를 사용하므로 기본값대로 '주님'을 유지했고, 후반의 칭호는 '이스라엘의 주 하나님'으로 옮겨 두 차례의 호칭을 자연스럽게 연결했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → 주님'
- issue: ἀπέστη의 범위를 본문에서 얼마나 드러낼지
  chosen_reading: 반역하였으며
  alternative_readings:
  - 그에게서 돌아섰으며
  - 그에게 반역하였으며
  rationale: 그리스어는 반역의 대상을 반복하지 않지만, 앞의 느부갓네살이 이미 제시되어 있으므로 한국어에서도 중복 설명 없이 정치적 반역의 의미를 살렸습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
