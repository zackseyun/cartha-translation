  to: 그리고 그가 느부갓네살 왕에게 주님의 이름으로 맹세하게 되었으나, 맹세를 깨고 반역하였으며, 목을 곧게 하고 마음을 완고하게 하여 이스라엘의 주 하나님의 법들을 어겼습니다.[a][b][c]
