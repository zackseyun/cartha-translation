  terminology: ‘주’는 Κυρίου에 대응하는 절제된 번역으로 적절합니다. ‘주 앞에서’도 자연스럽고 원문의 평가적 표현을 보존합니다. 각주 대안은 본문과 높임 정도를 일치시키고, 완결된 문장 형태로 다듬는 것이 좋습니다.
