lexical_decisions:
- source_word: βασιλεύει
  english_pob_choice: He reigned
  chosen_korean: 다스렸으며
  alternatives_korean:
  - 통치했으며
  - 왕 노릇했으며
  lexicon: LSJ
  rationale: ἄρχω류의 단순한 존재 진술보다 왕권 행사의 의미를 살려, 한국어에서는 자연스럽고도 왕의 재위 사실을 드러내는 ‘다스리다’를 택했습니다.
- source_word: μῆνας τρεῖς καὶ ἡμέρας δέκα
  english_pob_choice: three months and ten days
  chosen_korean: 석 달과 열 날
  alternatives_korean:
  - 세 달과 열흘
  - 석 달 열흘
  lexicon: LSJ
  rationale: 기간 표현을 직역하되, 현대 문체에서 무리 없이 읽히도록 ‘석 달과 열 날’로 옮겼습니다.
- source_word: ἐποίησεν τὸ πονηρόν
  english_pob_choice: he did what was evil
  chosen_korean: 악한 일을 행했습니다
  alternatives_korean:
  - 악을 행했습니다
  - 악을 저질렀습니다
  lexicon: LSJ
  rationale: 정관사와 중성 단수의 관용적 도덕 판단 표현을 한국어의 자연스러운 서술인 ‘악한 일을 행하다’로 살렸습니다.
- source_word: ἔναντι Κυρίου
  english_pob_choice: before the Lord
  chosen_korean: 주 앞에서
  alternatives_korean:
  - 주님 앞에서
  - 주께서 보시기에
  lexicon: LSJ
  rationale: ἔναντι는 ‘~앞에/앞에서’의 면전 의미를 가지므로, 판단의 장면을 간결하게 드러내는 ‘주 앞에서’로 옮겼습니다.
theological_decisions:
- issue: Κυρίου의 한국어 처리
  chosen_reading: ‘주’로 번역했습니다.
  alternative_readings:
  - ‘하나님’으로 구체화
  - ‘주님’으로 높임
  rationale: 본문의 그리스어가 Κυρίου만을 사용하므로, 원문 수준을 유지해 ‘주’로 두었습니다. 이는 후대 독자의 신학적 확대를 피하고 평가의 초점을 유지합니다.
  doctrine_reference: 'κύριος 기본값: 주/주님'
