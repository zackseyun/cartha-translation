revisions:
- from: 그리고 성전의 노래하는 자들인 아삽의 아들들은 다윗이 정해 놓은 바에 따라 자기들의 자리에 있었으며, 아삽과 스가랴와 에딘누스는 왕에게 속한 자들이었습니다.[a][b]
  to: 성전 노래꾼들, 곧 아삽의 아들들은 다윗이 정한 대로 자기들이 맡은 자리에 있었으며, 아삽과 스가랴와 에드디누스는 왕에게서 온 이들이었습니다.[a][b]
  rationale: 원문의 어순과 반복된 이름을 보존하되, ἱεροψάλται와 τάξις를 자연스러운 현대 한국어로 옮겼습니다. 특히 οἱ παρὰ τοῦ βασιλέως의 모호한 관계를 ‘왕에게서 온 이들’로 유지하여 왕실 소속 또는 왕의 임명이라는 특정 해석을 본문에 강제하지 않았습니다. 각주는 해당 표현과 평행 본문의 실제 차이를 정확히 설명하도록 조정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T05:28:53Z'
review_pass:
  verdict: revise
  source_fidelity: 그리스어 본문은 성전 노래꾼들(아삽의 아들들)이 다윗이 정한 배치/직무에 따라 있었고, 이어 아삽·스가랴·에딘누스를 ‘왕으로부터’(οἱ παρὰ τοῦ βασιλέως) 온 이들이라고 덧붙입니다. 초안의 ‘왕에게 속한 자들’은 가능한 해석이지만, 원문의 압축된 관계 표현을 왕실 소속으로 다소 좁힙니다.
  naturalness: ‘성전의 노래하는 자들’보다 ‘성전 노래꾼들’이 현대 표준 한국어에서 더 자연스럽습니다. ‘자기들의 자리’는 가능하나, 예배 봉사의 정해진 배치라는 문맥에는 ‘맡은 자리에’가 더 매끄럽고 의미를 잘 드러냅니다.
  terminology: ‘성전 노래꾼들’, ‘아삽의 아들들’, ‘다윗이 정한 대로’는 적절합니다. 고유명사는 그리스어 철자를 더 가깝게 반영하여 Ἐδδεινοὺς를 ‘에드디누스’로 음역했습니다. 왕과의 관계는 ‘왕에게서 온 이들’로 두고 각주에서 임명·소속 가능성을 밝혀야 합니다.
  issues:
  - severity: medium
    issue: οἱ παρὰ τοῦ βασιλέως를 ‘왕에게 속한 자들’로 번역함
    rationale: παρά+속격은 기본적으로 ‘~로부터, ~의 편에서’라는 관계를 나타내며, 왕실 소속이나 왕의 임명을 확정하지 않습니다. ‘속한’은 소속 해석을 본문에 확정적으로 부가합니다.
  - severity: low
    issue: 각주 a의 위치와 내용이 원문의 쟁점에 맞게 연결되지 않음
    rationale: 왕과의 관계를 설명하는 각주는 해당 구절인 ‘왕에게서 온 이들’ 뒤에 붙어야 합니다. 영어 감사 기록의 a 표지는 ‘temple singers’ 뒤에 있으나 그 주석 내용은 왕 관련 표현에 관한 것이므로, 한국어에서는 내용에 맞는 위치로 바로잡는 것이 안전합니다.
  - severity: low
    issue: 교차참조 각주 b가 평행 본문의 차이를 지나치게 일반화함
    rationale: 제공된 평행 본문은 이 지점에서 번제물 분배에 초점을 둡니다. 이를 명시하면 1 에스드라의 확장적 성격과 평행 본문의 차이를 더 정확히 전달합니다.
  revised_text: 성전 노래꾼들, 곧 아삽의 아들들은 다윗이 정한 대로 자기들이 맡은 자리에 있었으며, 아삽과 스가랴와 에드디누스는 왕에게서 온 이들이었습니다.[a][b]
  revised_footnotes: *id001
