base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/014.yaml
  text: And the temple singers[a], the sons of Asaph, were at their stations according to what had been appointed by David, and Asaph and Zechariah and Eddinous[b], who were from the king.
  footnotes:
  - marker: a
    text: Or 'who were appointed by the king.' The Greek phrase 'who were from the king' is compressed and may indicate royal appointment or royal affiliation.
    reason: alternative_reading
  - marker: b
    text: The wording here differs from the approximate Hebrew parallel in 2 Chronicles, which in this section focuses on distributing the burnt offering. 1 Esdras preserves an expanded notice about the singers and named officials.
    reason: cross_reference
translation:
  language: ko
  text: 성전 노래꾼들, 곧 아삽의 아들들은 다윗이 정한 대로 자기들이 맡은 자리에 있었으며, 아삽과 스가랴와 에드디누스는 왕에게서 온 이들이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 직역하면 ‘왕으로부터/왕에게서’라는 압축된 표현입니다. 이는 왕의 임명이나 왕실과의 관계를 가리킬 수 있으나, 그 정확한 관계는 본문이 명시하지 않습니다.
    reason: source_note
  - marker: b
    text: 대략 대응하는 역대하 평행 본문은 이 대목에서 번제물을 나누어 주는 일에 초점을 둡니다. 에스드라 첫째서는 성전 노래꾼들과 이름이 언급된 이들에 관한 내용을 덧붙여 전합니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἱεροψάλται
  english_pob_choice: temple singers
  chosen_korean: 성전의 노래하는 자들
  alternatives_korean:
  - 성전 찬양대
  - 성전 가수들
  - 거룩한 노래하는 자들
  lexicon: LSJ
  rationale: 합성어가 가리키는 성전 예배 담당 노래꾼이라는 기능을 살리면서도, 현대 한국어에서 자연스럽게 읽히는 표현으로 옮겼습니다.
- source_word: ἐπὶ τῆς τάξεως αὐτῶν
  english_pob_choice: at their stations
  chosen_korean: 자기들의 자리에
  alternatives_korean:
  - 자기들의 순서에
  - 자기들의 분정에
  - 자기들의 배치에
  lexicon: LSJ
  rationale: τάξις는 추상적 ‘질서’보다 예배 안에서 맡겨진 고정된 자리·배치를 뜻하므로, 기능적 의미가 드러나는 ‘자리’로 옮겼습니다.
- source_word: κατὰ τὰ ὑπὸ Δαυεὶδ τεταγμένα
  english_pob_choice: according to what had been appointed by David
  chosen_korean: 다윗이 정해 놓은 바에 따라
  alternatives_korean:
  - 다윗이 임명해 놓은 바에 따라
  - 다윗이 마련한 규정에 따라
  - 다윗이 정해 둔 대로
  lexicon: LSJ
  rationale: 수동 분사 τεταγμένα의 ‘정해짐/배정됨’을 살리면서, 다윗이 그 질서를 마련한 주체임을 분명하게 드러냈습니다.
- source_word: οἱ παρὰ τοῦ βασιλέως
  english_pob_choice: who were from the king
  chosen_korean: 왕에게 속한 자들
  alternatives_korean:
  - 왕으로부터 온 자들
  - 왕의 사람들
  - 왕에게서 나온 자들
  lexicon: LSJ
  rationale: 직역하면 ‘왕에게서/왕에게로부터’이지만, 문맥상 왕실과의 소속·관계가 핵심이므로 지나치게 모호하지 않게 ‘속한 자들’로 옮겼습니다.
- source_word: Ἐδδεινοὺς
  english_pob_choice: Eddinous
  chosen_korean: 에딘누스
  alternatives_korean:
  - 에드디누스
  - 에딘누스
  lexicon: transliteration
  rationale: 전승된 그리스어 형태를 따라 음역했고, 한국어 표기에서는 발음에 가까운 ‘에딘누스’로 정리했습니다.
theological_decisions:
- issue: παρὰ τοῦ βασιλέως의 관계 의미
  chosen_reading: 왕실 임명이라는 뜻을 단정하지 않고, 우선은 왕에게 속한 사람들로 보이게 했습니다.
  alternative_readings:
  - 왕이 임명한 자들
  - 왕의 직무를 맡은 자들
  - 왕궁 소속의 자들
  rationale: 그리스어는 압축적이어서 ‘임명됨’까지 명시하지 않습니다. 본문이 확실히 말하는 소속 관계를 유지하고, 해석적 확장은 주석에 맡기는 편이 원문에 충실합니다.
  doctrine_reference: 본문-근거 우선 원칙
