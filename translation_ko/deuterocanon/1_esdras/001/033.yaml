- source_word: ἀπεκατέστησεν αὐτὸν … βασιλεύειν
  english_pob_choice: removed him from reigning
  chosen_korean: 그를 예루살렘에서 다스리지 못하게 하였습니다
  alternatives_korean:
  - 그를 폐위하였습니다
  - 그를 다스리던 자리에서 물러나게 하였습니다
  - 그를 예루살렘 통치에서 제거하였습니다
  lexicon: BDAG
  rationale: 문맥상 ‘회복시키다/임명하다’가 아니라 왕권을 중단시키는 뜻이므로, 동작의 결과를 분명히 하면서도 본문의 의미를 직접 드러내는 표현을 택했습니다.
- source_word: βασιλεὺς Αἰγύπτου
  english_pob_choice: the king of Egypt
  chosen_korean: 이집트 왕
  alternatives_korean:
  - 애굽 왕
  - 이집트의 왕
  lexicon: BDAG
  rationale: 고유한 칭호 구조를 간결하게 살려 현대 한국어에서 바로 읽히는 형태로 옮겼습니다.
theological_decisions:
- issue: ἀπεκατέστησεν의 문맥적 의미
  chosen_reading: 이 구절은 이집트 왕이 그를 예루살렘 왕위에서 밀어낸 사건을 말합니다.
  alternative_readings:
  - 그를 다시 세워 예루살렘에서 다스리게 했다는 뜻
  rationale: 동사 자체는 ‘회복/임명’도 가능하지만, 바로 앞의 석 달 통치와 뒤이어지는 역사 흐름은 폐위를 요구하므로 그 방향으로 번역해야 합니다.
  doctrine_reference: '번역 원리: 원문 우선, 문맥에 따른 다의어 판정'
