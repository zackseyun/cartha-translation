base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/033.yaml
  text: And he reigned over Israel and Jerusalem for three months[a]; and the king of Egypt deposed him from reigning in Jerusalem[b],
  footnotes:
  - marker: a
    text: Greek literally has 'in Israel and Jerusalem.' English 'over Israel and Jerusalem' expresses the sense of royal rule more naturally.
    reason: lexical_alternative
  - marker: b
    text: The verb rendered 'removed him from reigning' can elsewhere mean 'restore' or 'appoint,' but here the context indicates deposition by the king of Egypt.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 이스라엘과 예루살렘을 석 달 동안 다스렸습니다[a]. 이집트 왕이 그를 예루살렘의 왕위에서 폐위하였습니다[b].
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 그리스어는 문자적으로 ‘이스라엘과 예루살렘 안에서’라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: 이 동사는 다른 문맥에서는 ‘회복시키다’ 또는 ‘임명하다’라는 뜻도 가질 수 있지만, 여기서는 문맥상 그를 왕위에서 물러나게 하거나 폐위했다는 뜻으로 이해됩니다.
    reason: alternative_reading
lexical_decisions:
