  rationale: 개정문은 βασιλεύω의 통치 의미를 자연스러운 한국어 통치 영역 표현으로 옮기고, ἀπεκατέστησεν의 문맥상 왕권 박탈을 ‘폐위하였습니다’로 분명히 했습니다. ‘예루살렘의 왕위’는 원문의 ‘예루살렘에서 왕으로 다스리다’를 한국어의 자연스러운 왕위 표현으로 옮긴 것입니다. 각주는 원문의 문자적 전치사 표현과 해당 동사의 다른 어휘 가능성을 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T05:29:13Z'
