  verdict: revise
  source_fidelity: 첫 절의 ‘다스렸습니다’는 ἐβασίλευσεν의 왕권 행사를 적절히 옮깁니다. 그러나 ‘그를 예루살렘에서 다스리지 못하게 하였습니다’는 ἀπεκατέστησεν의 문맥상 폐위 행위를 단순한 금지·방해처럼 표현하여 약화합니다. 문맥상 왕위에서 몰아낸 뜻을 ‘폐위하였습니다’로 명시하는 편이 충실합니다.
  naturalness: ‘이스라엘과 예루살렘에서 석 달 동안 다스렸습니다’는 이해 가능하지만, 통치 영역을 나타내는 한국어로는 ‘이스라엘과 예루살렘을 석 달 동안 다스렸습니다’가 더 자연스럽습니다. ‘예루살렘에서 다스리지 못하게 하였습니다’도 현대 한국어에서 폐위의 의미가 불분명합니다.
  terminology: ‘이집트 왕’은 현대 표준어 성경 번역에 적합합니다. 왕권 행위에는 ‘다스리다’를 유지할 수 있으며, 두 번째 절에는 사건의 성격을 정확히 나타내는 ‘폐위하다’가 적절합니다. 각주 b는 동사의 다른 가능한 어휘 의미를 언급하되, 문맥적 판단임을 단정 대신 ‘이해됩니다’로 표현하는 것이 좋습니다.
