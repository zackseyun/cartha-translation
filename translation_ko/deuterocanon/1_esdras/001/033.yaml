base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/033.yaml
  text: And he reigned over Israel and Jerusalem for three months[a]; and the king of Egypt deposed him from reigning in Jerusalem[b],
  footnotes:
  - marker: a
    text: Greek literally has 'in Israel and Jerusalem.' English 'over Israel and Jerusalem' expresses the sense of royal rule more naturally.
    reason: lexical_alternative
  - marker: b
    text: The verb rendered 'removed him from reigning' can elsewhere mean 'restore' or 'appoint,' but here the context indicates deposition by the king of Egypt.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 이스라엘과 예루살렘에서 석 달 동안 다스렸습니다[a]. 그리고 이집트 왕이 그를 예루살렘에서 다스리지 못하게 하였습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘이스라엘과 예루살렘 안에서’라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: 이 동사는 다른 문맥에서는 ‘회복시키다’ 또는 ‘임명하다’의 뜻도 가질 수 있지만, 여기서는 문맥상 ‘다스리던 자리를 빼앗다/폐위하다’의 뜻입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐβασίλευσεν
  english_pob_choice: he reigned
  chosen_korean: 다스렸습니다
  alternatives_korean:
  - 통치했습니다
  - 왕으로 다스렸습니다
  - 재위했습니다
  lexicon: BDAG
  rationale: 왕권을 행사했다는 뜻을 자연스럽게 살리되, 한국어에서 지나치게 관용적인 ‘재위하다’보다 서술문에 맞는 표현으로 옮겼습니다.
- source_word: ἐν Ἰσραὴλ καὶ Ἰερουσαλήμ
  english_pob_choice: over Israel and Jerusalem
  chosen_korean: 이스라엘과 예루살렘에서
  alternatives_korean:
  - 이스라엘과 예루살렘 위에
  - 이스라엘과 예루살렘을 다스려
  - 이스라엘과 예루살렘 가운데
  lexicon: BDAG
  rationale: ἐν의 문자값을 살리되 βασιλεύω와 결합한 통치 영역을 한국어로 자연스럽게 나타내기 위해 ‘에서’로 옮겼습니다.
- source_word: ἀπεκατέστησεν αὐτὸν … βασιλεύειν
  english_pob_choice: removed him from reigning
  chosen_korean: 그를 예루살렘에서 다스리지 못하게 하였습니다
  alternatives_korean:
  - 그를 폐위하였습니다
  - 그를 다스리던 자리에서 물러나게 하였습니다
  - 그를 예루살렘 통치에서 제거하였습니다
  lexicon: BDAG
  rationale: 문맥상 ‘회복시키다/임명하다’가 아니라 왕권을 중단시키는 뜻이므로, 동작의 결과를 분명히 하면서도 본문의 의미를 직접 드러내는 표현을 택했습니다.
- source_word: βασιλεὺς Αἰγύπτου
  english_pob_choice: the king of Egypt
  chosen_korean: 이집트 왕
  alternatives_korean:
  - 애굽 왕
  - 이집트의 왕
  lexicon: BDAG
  rationale: 고유한 칭호 구조를 간결하게 살려 현대 한국어에서 바로 읽히는 형태로 옮겼습니다.
theological_decisions:
- issue: ἀπεκατέστησεν의 문맥적 의미
  chosen_reading: 이 구절은 이집트 왕이 그를 예루살렘 왕위에서 밀어낸 사건을 말합니다.
  alternative_readings:
  - 그를 다시 세워 예루살렘에서 다스리게 했다는 뜻
  rationale: 동사 자체는 ‘회복/임명’도 가능하지만, 바로 앞의 석 달 통치와 뒤이어지는 역사 흐름은 폐위를 요구하므로 그 방향으로 번역해야 합니다.
  doctrine_reference: '번역 원리: 원문 우선, 문맥에 따른 다의어 판정'
