  text: And no Passover like this had been held in Israel since the days of Samuel the prophet.
translation:
  language: ko
  text: 그리고 사무엘 선지자의 때로부터 이스라엘 가운데 이와 같은 유월절은 치러진 적이 없었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤχθη
  english_pob_choice: had been held
  chosen_korean: 치러진 적이 없었습니다
  alternatives_korean:
  - 거행된 적이 없었습니다
  - 행해진 적이 없었습니다
  lexicon: LSJ
  rationale: 축제의 관습적 수행을 뜻하는 수동형을 자연스러운 한국어로 옮겼습니다. '치르다'는 절기·의식을 실제로 거행한다는 뜻을 잘 살립니다.
- source_word: τὸ πάσχα
  english_pob_choice: Passover
  chosen_korean: 유월절
  alternatives_korean:
  - 파스카
  - 유월절 절기
  lexicon: LSJ
  rationale: 유대 절기 πάσχα의 표준 한국어 대응으로 '유월절'을 사용했습니다. 문맥상 절기 명칭이므로 별도 수식은 덧붙이지 않았습니다.
- source_word: ἐν τῷ Ἰσραήλ
  english_pob_choice: in Israel
  chosen_korean: 이스라엘 가운데
  alternatives_korean:
  - 이스라엘 안에
  - 이스라엘에서
  lexicon: LSJ
  rationale: 공동체 내부의 범위를 가리키는 뉘앙스를 살리기 위해 '가운데'를 택했습니다.
- source_word: ἀπὸ τῶν χρόνων
  english_pob_choice: since the days of
  chosen_korean: ~의 때로부터
  alternatives_korean:
  - ~의 날들로부터
  - ~의 시대부터
  lexicon: LSJ
  rationale: 시간 기점을 나타내는 ἀπό의 관용적 의미를 반영해 '때로부터'로 옮겼습니다.
- source_word: Σαμουὴλ τοῦ προφήτου
  english_pob_choice: Samuel the prophet
  chosen_korean: 사무엘 선지자
  alternatives_korean:
  - 사무엘 예언자
  - 선지자 사무엘
  lexicon: LSJ
  rationale: 본문이 사무엘을 예언자로 직접 호칭하므로 직역적으로 옮겼습니다. 한국어 성경에서 익숙한 인물명도 유지했습니다.
theological_decisions:
- issue: 본문의 부정 비교와 절기 고유성
  chosen_reading: 이와 같은 유월절은 치러진 적이 없었습니다
  alternative_readings:
  - 이런 유월절은 없었습니다
  - 이와 같은 유월절이 행해진 적이 없었습니다
