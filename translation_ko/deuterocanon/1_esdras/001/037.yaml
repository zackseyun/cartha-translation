base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/037.yaml
  text: Jehoiakim was twenty-five years old when he became king of Judea and Jerusalem[a], and he did what was evil before the Lord.
  footnotes:
  - marker: a
    text: Or 'Judah and Jerusalem.' The Greek text has 'Judea and Jerusalem,' while the Hebrew parallel tradition commonly speaks of 'Judah and Jerusalem.'
    reason: alternative_reading
translation:
  language: ko
  text: 여호야김은 유대와 예루살렘[a]의 왕이 되었을 때 스물다섯 살이었고, 주님 보시기에 악을 행했습니다.
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 또는 ‘유다와 예루살렘.’ 그리스어 본문은 ‘유대와 예루살렘’이라고 하며, 히브리어 병행 전승은 흔히 ‘유다와 예루살렘’이라고 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐτῶν δὲ ἦν εἴκοσι πέντε
  english_pob_choice: was twenty-five years old
  chosen_korean: 스물다섯 살이었으며
  alternatives_korean:
