  lexicon: 고유명사 관용 표기
  rationale: 성경에서 널리 알려진 한국어 고유명사 표기를 따랐습니다.
- source_word: τῆς Ἰουδαίας καὶ Ἰερουσαλήμ
  english_pob_choice: of Judea and Jerusalem
  chosen_korean: 유다와 예루살렘
  alternatives_korean:
  - 유대와 예루살렘
  - 유다 땅과 예루살렘
  lexicon: LSJ
  rationale: 본문은 그리스어로 Ἰουδαίας를 쓰지만, 1 Esdras의 병행 히브리 전승이 흔히 '유다와 예루살렘'을 말하므로 그 차이를 각주로 보존했습니다.
- source_word: ἐποίησεν τὸ πονηρὸν ἐνώπιον Κυρίου
  english_pob_choice: did what was evil before the Lord
  chosen_korean: 주님의 보시기에 악한 일을 했습니다
  alternatives_korean:
  - 주님 앞에서 악을 행했습니다
  - 주님 보시기에 악한 일을 저질렀습니다
  lexicon: LSJ
  rationale: 관용구의 의미를 살리면서도 한국어에서 더 자연스러운 '주님의 보시기에'로 옮겼습니다. '악한 일을 했습니다'는 도덕적 악행의 의미를 직접 드러냅니다.
theological_decisions:
- issue: Κυρίου의 한국어 처리
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 야훼
  rationale: 본문은 LXX 그리스어 κύριος이므로 한국어에서는 '주님'으로 옮겨 그리스어 직역 흐름을 유지했습니다. 이 절은 명시적 야훼 표기 문맥이 아니므로 '야훼'로 바꾸지 않았습니다.
  doctrine_reference: 'POB contested terms: κύριος → 주님; יְהוָה → 야훼'
- issue: Ἰουδαίας의 지명 범주
  chosen_reading: 유다
  alternative_readings:
  - 유대
  - 유대 지방
  rationale: 그리스어 본문은 Ἰουδαίας이지만, 병행 전승을 함께 검토할 때 한국어 본문에는 '유다'가 더 적절합니다. 다만 그리스어 차이를 각주로 남겨 독자와 검토자가 확인할 수 있게 했습니다.
  doctrine_reference: 원문 우선 원칙 및 병행 전승 참고
