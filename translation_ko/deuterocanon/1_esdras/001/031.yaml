base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/031.yaml
  text: for all the family of Israel[a]. Now these things have been recorded in the book of the histories concerning the kings of Judah, and each deed of Josiah, and his glory, and his understanding in the law of the Lord, and the things done by him, both the former things and those now recounted[b], are recorded in the book of the Kings of Israel and Judah.
  footnotes:
  - marker: a
    text: 'Greek: ''the book of the histories concerning the kings of Judah.'' This likely refers to a royal historical record; ''book of the records'' is a possible alternative.'
    reason: lexical_alternative
  - marker: b
    text: The Greek wording near the end is somewhat awkward ('and the things done by him and the things now recounted'). The translation preserves the sense that both Josiah’s deeds and the matters just narrated are said to be recorded in the source book.
    reason: textual_variant
translation:
  language: ko
  text: 이스라엘 온 족속을 위하여입니다[a]. 이제 이 일들은 유다 왕들에 관한 역사 기록의 책에 기록되어 있습니다. 또 요시야가 행한 일을 하나하나, 그의 영광과 주님의 율법에 대한 그의 깨달음과, 그가 행한 일들과 지금 서술되는 일들도 이스라엘과 유다 왕들의 책에 기록되어 있습니다[b].
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 그리스어 ‘이스라엘의 온 족속’은 이스라엘 전체를 친족·계보적 집단으로 가리키는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 끝부분은 다소 어색한 병렬 구조입니다. 본문은 ‘그가 행한 일들’과 ‘지금 서술되는 일들’이 모두 그 책에 기록되어 있다고 옮겨, 원문의 반복과 현재적 서술을 보존했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: γένος Ἰσραήλ
  english_pob_choice: family of Israel
  chosen_korean: 온 이스라엘 가문
  alternatives_korean:
  - 이스라엘의 모든 족속
  - 이스라엘 온 집안
  - 이스라엘의 모든 백성
  lexicon: LSJ
  rationale: γένος는 단순한 민족명보다 혈연·계보의 뉘앙스가 있어, POB의 'family' 취지를 살려 '가문'으로 옮겼습니다.
- source_word: ἀναγέγραπται
  english_pob_choice: have been recorded
  chosen_korean: 기록되어 있습니다
  alternatives_korean:
  - 적혀 있습니다
  - 기록되었습니다
  - 문서화되어 있습니다
  lexicon: BDAG
  rationale: 완료된 기록 상태를 자연스럽게 나타내면서도 한국어로 과도하게 문어적이지 않게 옮겼습니다.
- source_word: βίβλῳ τῶν ἱστορουμένων
  english_pob_choice: book of the histories
  chosen_korean: 역사의 책
  alternatives_korean:
  - 기록의 책
  - 역사 기록의 책
  - 역사서
  lexicon: LSJ
  rationale: ἱστορούμενα는 역사적으로 서술된 사건들을 가리키므로, '역사의 책'이 직역성과 가독성을 함께 살립니다.
- source_word: τὸ καθʼ ἓν πραχθὲν τῆς πράξεως
  english_pob_choice: each deed
  chosen_korean: 각 업적
  alternatives_korean:
  - 일일이 행한 일
  - 하나하나의 행적
  - 각각의 행위
  lexicon: BDAG
  rationale: 그리스어의 '하나씩'이라는 반복·열거의 맛을 살리면서, 왕의 공적을 가리키는 문맥에 맞게 '업적'을 택했습니다.
- source_word: νόμῳ Κυρίου
  english_pob_choice: the law of the Lord
  chosen_korean: 야훼의 율법
  alternatives_korean:
  - 주님의 율법
  - 주의 율법
  - 야훼의 법
  lexicon: BDAG
  rationale: 이 유대교적 문맥에서 Κυρίου는 하나님의 언약 율법을 가리키며, 프로젝트 기본값에 따라 '야훼'를 사용했습니다.
- source_word: τὰ νῦν ἱστόρηται
  english_pob_choice: those now recounted
  chosen_korean: 지금 전해지는 일들
  alternatives_korean:
  - 지금 서술되는 일들
  - 지금 기록되는 일들
  - 현재 전해지는 것들
  lexicon: LSJ
  rationale: 전승·서술의 현재 진행감을 살리되, 어색한 직역을 피하고 자연스러운 한국어로 정리했습니다.
- source_word: βυβλίῳ τῶν Βασιλέων Ἰσραὴλ καὶ Ἰούδα
  english_pob_choice: book of the Kings of Israel and Judah
  chosen_korean: 이스라엘과 유다의 왕들의 책
  alternatives_korean:
  - 이스라엘과 유다 왕들의 책
  - 이스라엘과 유다 왕들의 역사책
  - 이스라엘과 유다 왕조의 책
  lexicon: LSJ
  rationale: 책 제목 성격을 살리면서 그리스어의 소유 관계를 그대로 반영했습니다.
theological_decisions:
- issue: Κυρίου를 한국어로 어떻게 옮길 것인가
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 주
  - 여호와
  rationale: 본 절의 Κυρίου는 율법의 주체인 언약 하나님을 가리키므로, 본 프로젝트의 기본 원칙에 따라 '야훼'를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → 야훼 when referring to YHWH'
