  rationale: 본 절의 Κυρίου는 율법의 주체인 언약 하나님을 가리키므로, 본 프로젝트의 기본 원칙에 따라 '야훼'를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → 야훼 when referring to YHWH'
