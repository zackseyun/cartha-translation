base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/012.yaml
  text: After this they prepared for themselves and for the priests[a], their brothers[b], the sons of Aaron.
  footnotes:
  - marker: a
    text: Or, more explicitly, 'for themselves and also for the priests, their brothers, the sons of Aaron.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew parallel at 2 Chronicles 35:11 differs substantially here; 1 Esdras preserves a Greek wording focused on preparing portions for themselves and for the priests.
    reason: cross_reference
translation:
  language: ko
  text: 그 후에 그들은 자신들과 제사장들, 곧 그들의 형제들인 아론의 아들들을 위하여 마련했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 또는 더 분명하게는, ‘자신들을 위해서와 또한 제사장들, 곧 그들의 형제들인 아론의 아들들을 위해서’입니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서는 1 에스드라서의 그리스어가 자신들과 제사장들을 위하여 마련하는 데 초점을 둡니다. 역대기하 35:11의 히브리어 병행 본문은 이 부분에서 상당히 다릅니다.
    reason: cross_reference
lexical_decisions:
- source_word: μετὰ δὲ ταῦτα
  english_pob_choice: After this
  chosen_korean: 그 후에
  alternatives_korean:
  - 이 일 뒤에
  - 그 뒤에
  lexicon: LSJ
  rationale: 시간의 전환을 자연스러운 현대 한국어로 옮기되, 원문의 순차성을 유지했습니다.
- source_word: ἡτοίμασαν
  english_pob_choice: they prepared
  chosen_korean: 준비했습니다
  alternatives_korean:
  - 마련했습니다
  - 갖추었습니다
  lexicon: LSJ
  rationale: 행위의 핵심은 무엇인가를 마련해 두는 뜻이므로, 문맥에 맞는 중립적 동사를 선택했습니다.
- source_word: ἑαυτοῖς τε καὶ τοῖς ἱερεῦσιν
  english_pob_choice: for themselves and for the priests
  chosen_korean: 자신들을 위해서와 제사장들…을 위해서
  alternatives_korean:
  - 자기들뿐 아니라 제사장들을 위해서
  - 자기들과 제사장들을 위해서
  lexicon: LSJ
  rationale: τεύ καὶ의 병렬을 살려 수혜 대상을 둘로 분명히 드러냈습니다.
- source_word: ἀδελφοῖς αὐτῶν υἱοῖς Ἀαρών
  english_pob_choice: their brothers, the sons of Aaron
  chosen_korean: 그들의 형제들, 아론의 아들들
  alternatives_korean:
  - 그들의 형제들인 아론의 아들들
  - 아론의 자손인 그들의 형제들
  lexicon: LSJ
  rationale: 그리스어의 나열 구조를 유지해 제사장들을 ‘그들의 형제들’이자 ‘아론의 아들들’로 함께 제시했습니다.
theological_decisions:
- issue: 제사장들을 가리키는 apposition의 처리
  chosen_reading: ‘제사장들, 곧 그들의 형제들, 아론의 아들들’로 풀어 써서 세 표현의 병렬을 보존했습니다.
  alternative_readings:
  - ‘그들의 형제들인 제사장들, 아론의 아들들’로 재정렬하기
  - ‘제사장들인 그들의 형제들’로 압축하기
  rationale: 원문은 관계절이 아니라 연속 병치를 사용하므로, 한국어에서도 설명을 과도하게 통합하지 않고 구조를 드러내는 편이 본문 충실성에 더 가깝습니다.
  doctrine_reference: Translation philosophy §§3-4, 6
