base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/043.yaml
  text: And after a year[a], Nebuchadnezzar sent and brought him away to Babylon, together with the holy vessels of the Lord,
  footnotes:
  - marker: a
    text: Or 'carried him off to Babylon.' The Greek verb can denote removal or deportation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 한 해 뒤에 느부갓네살은 사람을 보내어 그를 주님의 거룩한 기구들과 함께 바빌론으로 데려갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 또는 ‘그를 바빌론으로 끌고 갔다.’ 그리스어 동사는 어떤 사람을 옮기거나 유배시키는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετ᾽ ἐνιαυτόν
  english_pob_choice: after a year
  chosen_korean: 1년 뒤에
  alternatives_korean:
  - 한 해 뒤에
  - 1년 후에
  lexicon: LSJ
  rationale: 시간 경과를 나타내는 표현으로, 현대 한국어에서는 짧고 자연스러운 「1년 뒤에」가 가장 매끄럽습니다.
- source_word: μετήγαγεν
  english_pob_choice: brought him away
  chosen_korean: 그를 데려갔습니다
  alternatives_korean:
  - 그를 끌고 갔습니다
  - 그를 옮겼습니다
  - 그를 사로잡아 데려갔습니다
  lexicon: LSJ
  rationale: 이 동사는 이동과 제거를 뜻하므로, 포로로 데려가는 뉘앙스를 유지하면서도 한국어 서술에 자연한 「데려갔습니다」로 옮겼습니다.
- source_word: τοῖς ἱεροῖς σκεύεσιν
  english_pob_choice: the holy vessels
  chosen_korean: 주님의 거룩한 기구들
  alternatives_korean:
  - 주님의 성스러운 그릇들
  - 주님의 거룩한 용기들
  - 주님의 성전 기구들
  lexicon: LSJ
  rationale: σ σκεύη는 단순한 그릇보다 성전에서 쓰는 기구·집기를 포괄하므로, 한국어 성경 문맥에 맞는 「기구들」을 택했습니다.
- source_word: τοῦ κυρίου
  english_pob_choice: of the Lord
  chosen_korean: 주님의
  alternatives_korean:
  - 주의
  - 주께 속한
  lexicon: BDAG
  rationale: 그리스어 속격의 소유 관계를 자연스럽게 살리면서, 본문이 가리키는 신적 소유를 한국어 존칭 소유격 「주님의」로 표현했습니다.
theological_decisions:
- issue: κύριος의 번역을 고전적 교회어 '주'로 할지, 본문 문맥을 살린 소유 표현으로 할지
  chosen_reading: 주님의
  alternative_readings:
  - 주의
  - 주님께 속한
  rationale: 이 구절은 거룩한 기구의 소유를 말하므로, 단순 호칭보다 소유 관계가 분명한 「주님의」가 원문 의미를 더 직접적으로 드러냅니다.
  doctrine_reference: 'POB contested-terms policy: κύριος → 주/주님'
