base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/003.yaml
  text: And he said to the Levites[a], the holy servants of Israel, “Sanctify yourselves to the Lord in the place of the holy ark of the Lord, in the house that Solomon son of David the king built.”
  footnotes:
  - marker: a
    text: The Greek reads, 'Sanctify them for the Lord,' with an unclear referent for 'them.' The Hebrew parallel instead reads more clearly, 'Put the holy ark in the house that Solomon son of David, king of Israel, built.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그는 레위인들, 곧 이스라엘의 거룩한 종들에게 말했습니다. “주께 자신을 거룩하게 하십시오. 주의 거룩한 언약궤가 있는 자리에, 곧 솔로몬 곧 다윗의 아들인 왕이 지은 집 안에서 말입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 αὐτούς를 쓰지만, 문맥상 레위인 자신들을 가리키는 것으로 읽힙니다. 히브리어 병행본문은 ‘언약궤를 그 집에 두라’고 더 분명하게 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Λευείταις
  english_pob_choice: Levites
  chosen_korean: 레위인들
  alternatives_korean:
  - 레위 사람들
  lexicon: LSJ
  rationale: 고유 집단명으로 가장 자연스럽고, 한국어 성경 전통에서도 널리 통용되는 형태입니다.
- source_word: ἱεροδούλοις
  english_pob_choice: holy servants
  chosen_korean: 거룩한 종들
  alternatives_korean:
  - 성전 종들
  - 성스럽게 구별된 종들
  lexicon: LSJ
  rationale: 직역상 sacred/holy service에 속한 자들을 가리키므로, 의미를 살리면서도 과도하게 제도화하지 않는 ‘거룩한 종들’이 적절합니다.
- source_word: ἁγιάσατε
  english_pob_choice: Sanctify
  chosen_korean: 거룩하게 하십시오
  alternatives_korean:
  - 성별하십시오
  - 성화하십시오
  lexicon: LSJ
  rationale: 의례적·헌납적 뉘앙스를 살리면서 현대 한국어에서 이해 가능한 명령형으로 옮겼습니다.
- source_word: αὐτούς
  english_pob_choice: yourselves / them
  chosen_korean: 자신을
  alternatives_korean:
  - 그들을
  - 너희를
  lexicon: Greek NT/LXX lexicon
  rationale: 영문 POB가 채택한 최종 수정처럼, 문맥상 레위인 자신들을 가리키는 해석을 반영하되 한국어에서 자연스럽게 표현했습니다.
- source_word: τῷ κυρίῳ
  english_pob_choice: for the Lord
  chosen_korean: 주께
  alternatives_korean:
  - 주를 위하여
  - 주에게
  lexicon: LSJ
  rationale: ἁγιάζω와 함께 헌신의 방향을 나타내므로 ‘주께’가 간결하고 자연스럽습니다.
- source_word: τῆς ἁγίας κιβωτοῦ
  english_pob_choice: the holy ark
  chosen_korean: 거룩한 언약궤
  alternatives_korean:
  - 거룩한 궤
  - 성궤
  lexicon: LSJ
  rationale: κιβωτός는 여기서 언약궤를 가리키며, 한국어에서 의미가 분명하도록 ‘언약궤’를 채택했습니다.
theological_decisions:
- issue: κύριος를 어떻게 옮길지
  chosen_reading: 주
  alternative_readings:
  - 주님
  - 야훼
  rationale: 이 절의 그리스어 본문은 κύριος를 사용하므로, LXX 직역 원칙에 따라 본문에는 ‘주’를 유지했습니다. 히브리어 병행본문의 YHWH는 참고되지만 본문 자체를 바꾸지는 않았습니다.
  doctrine_reference: 'DOCTRINE.md contested terms: κύριος → 주'
- issue: 그리스어가 애매한 αὐτούς를 히브리어 병행본문처럼 조화할지
  chosen_reading: 레위인 자신들을 대상으로 한 성별 명령으로 유지
  alternative_readings:
  - 언약궤를 그 집에 두라
  - 그들을 거룩하게 하라(대상 불명확)
  rationale: Greek 본문을 우선하되, 최신 audit trail이 반영한 해석을 따라 레위인 자신에 대한 성별 명령으로 옮겼습니다. 다만 병행본문과의 차이는 본문 내부에서 과도하게 평준화하지 않았습니다.
  doctrine_reference: translation philosophy 1 and 3
