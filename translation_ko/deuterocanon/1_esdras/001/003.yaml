revisions:
- from: 그리고 그는 레위인들, 곧 이스라엘의 거룩한 종들에게 말했습니다. “주께 자신을 거룩하게 하십시오. 주의 거룩한 언약궤가 있는 자리에, 곧 솔로몬 곧 다윗의 아들인 왕이 지은 집 안에서 말입니다.”[a]
  to: 그리고 그는 레위인들, 곧 이스라엘의 거룩한 종들에게 말했습니다. “주의 거룩한 언약궤의 자리, 곧 다윗의 아들인 솔로몬 왕이 지은 집에서, 그들을 주를 위하여 거룩하게 하십시오.”[a]
  rationale: 그리스어를 우선하여 αὐτούς의 불명확성을 본문과 주석에서 보존했습니다. 수정된 어순은 ‘언약궤의 자리’와 ‘솔로몬 왕이 지은 집’의 관계를 유지하면서도 한국어 합쇼체 문장으로 자연스럽게 읽히게 합니다. 히브리어 병행본문에 맞추어 본문을 조화시키지 않았습니다.
  reviewer_model: gpt-5.6-terra
