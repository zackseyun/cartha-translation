- from: 그리고 그들은 페르시아인들이 다스리게 될 때까지 그와 그의 아들들에게 종이었습니다. 이는 야훼께서 예레미야의 입을 통해 하신 말씀을 이루려는 것이었습니다.[a]
  to: 그리고 그들은 페르시아인들이 통치하게 될 때까지 그와 그의 아들들의 종들이었습니다. 이는 주님께서 예레미야의 입을 통하여 하신 말씀을 성취하기 위한 것이었습니다.
