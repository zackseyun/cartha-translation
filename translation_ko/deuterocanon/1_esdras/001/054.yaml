base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/054.yaml
  text: And they were servants to him and to his sons until the Persians came to reign, to fulfill the word of the Lord by the mouth of Jeremiah.
translation:
  language: ko
  text: 그리고 그들은 페르시아인들이 통치하게 될 때까지 그와 그의 아들들의 종들이었습니다. 이는 주님께서 예레미야의 입을 통하여 하신 말씀을 성취하기 위한 것이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παῖδες
  english_pob_choice: servants
  chosen_korean: 종
  alternatives_korean:
  - 종들
  - 하인
  - 노예
  lexicon: LSJ
  rationale: 이 문맥의 παῖδες는 왕권 아래에 있던 예속된 사람들을 가리키므로, POB의 영어 'servants'를 한국어로는 관계의 예속성을 분명히 드러내는 '종'으로 옮겼습니다. '노예'도 가능하지만, 본문 자체는 사회적 신분을 더 강하게 특정하지는 않으므로 기본값으로는 '종'이 더 절제됩니다.
- source_word: μέχρι οὗ βασιλεῦσαι Πέρσας
  english_pob_choice: until the Persians came to reign
  chosen_korean: 페르시아인들이 다스리게 될 때까지
  alternatives_korean:
  - 페르시아인들이 통치할 때까지
  - 페르시아의 통치가 시작될 때까지
  lexicon: LSJ
  rationale: 부정과거 부정사 구조는 사건의 도달점을 나타내므로, 한국어에서는 '다스리게 될 때까지'로 옮겨 통치의 시작점을 자연스럽게 드러냈습니다.
- source_word: εἰς ἀναπλήρωσιν τοῦ ῥήματος τοῦ κυρίου
  english_pob_choice: to fulfill the word of the Lord
  chosen_korean: 야훼께서 … 하신 말씀을 이루려는 것
  alternatives_korean:
  - 주님의 말씀을 성취하려는 것
  - 주님의 말씀을 이루기 위함
  lexicon: LSJ
  rationale: ἀναπλήρωσις는 단순한 결과가 아니라 성취/충만의 의미를 가지므로 '이루려는 것'으로 옮겨 목적성을 살렸습니다. 또한 κύριος가 이 문맥에서 예언 성취의 주체인 야훼를 가리키므로, 본문 관례에 따라 '야훼'를 사용했습니다.
- source_word: ἐν στόματι Ἰερεμίου
  english_pob_choice: by the mouth of Jeremiah
  chosen_korean: 예레미야의 입을 통해
  alternatives_korean:
  - 예레미야를 통해
  - 예레미야의 입으로
  lexicon: LSJ
  rationale: 예언 전달의 매개를 나타내는 관용구를 살리되, 현대 한국어에서는 '입을 통해'가 가장 자연스럽고 이해하기 쉽습니다.
theological_decisions:
- issue: κύριος를 한국어로 어떻게 표기할지
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 주
  rationale: 이 구절은 예언 성취 공식으로, 영어 POB도 'the Lord'를 사용하지만 원문 ελλην어 κύριος가 예언자 예레미야를 통한 하나님의 말씀을 가리키는 경우이므로, 프로젝트 기본 원칙에 따라 야훼로 표기했습니다.
  doctrine_reference: 'Project glossary: κύριος alluding to יהוה in prophetic fulfillment formulas → 야훼'
