base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/009.yaml
  text: And Iechonias and Samaias and Nathanael his brother, and Sabias and Ochielos and Joram, commanders of thousands, gave to the Levites for the Passover one thousand sheep and seven hundred calves.
  footnotes:
  - marker: a
    text: The Hebrew parallel in 2 Chronicles 35:9 names different officials and gives different numbers (2,600 Passover animals and 300 cattle). Because 1 Esdras is translated here from its Greek text, the Greek names and numbers are retained in the main text.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 이에코니아, 사마이아, 나타나엘 — 그 형제 —, 사비아, 오키엘로스, 그리고 요람, 천부장들은 유월절을 위해 레위 사람들에게 양 천 마리와 송아지 칠백 마리를 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 병행본문인 2역대기 35:9은 다른 관리 이름과 다른 수량(유월절 제물 2,600마리와 가축 300마리)을 전합니다. 이 번역은 1 에스드라스의 그리스어 본문을 따르므로, 본문에는 그리스어의 이름과 수량을 유지했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: χιλίαρχοι
  english_pob_choice: commanders of thousands
  chosen_korean: 천부장들
  alternatives_korean:
  - 천 명의 지휘관들
  - 천인대장들
  - 군사 지휘관들
  lexicon: LSJ
  rationale: ‘천부장’은 ‘천 명 위의 지휘관’이라는 어감을 간결하게 살리면서도 한국어 성경 문맥에서 자연스럽습니다.
- source_word: εἰς πάσχα
  english_pob_choice: for the Passover
  chosen_korean: 유월절을 위해
  alternatives_korean:
  - 유월절을 위하여
  - 유월절에 드리려고
  - 유월절 제물로
  lexicon: LSJ
  rationale: 여기서는 목적의 뉘앙스가 강하므로 ‘위해’로 옮기되, 제의적 용도를 직접 과도하게 좁히지는 않았습니다.
- source_word: πρόβατα
  english_pob_choice: sheep
  chosen_korean: 양
  alternatives_korean:
  - 양들
  - 양 떼
  - 가축
  lexicon: LSJ
  rationale: 그리스어 πρόβατα의 기본 의미를 가장 직접적으로 반영하면서 한국어 수량 표현에도 자연스럽습니다.
- source_word: μόσχους
  english_pob_choice: calves
  chosen_korean: 송아지
  alternatives_korean:
  - 송아지들
  - 어린 황소
  - 소
  lexicon: LSJ
  rationale: μόσχους는 ‘송아지/어린 소’가 직접적이므로, 지나치게 성체화된 ‘소’보다 ‘송아지’가 원문에 가깝습니다.
- source_word: ὁ ἀδελφὸς
  english_pob_choice: the brother
  chosen_korean: 그 형제
  alternatives_korean:
  - 그의 형제
  - 형제
  - 그 동생
  lexicon: LSJ
  rationale: 원문은 소유격을 분명히 넣지 않으므로, 영어 POB의 조정 취지를 반영해 소유를 덧붙이지 않고 관계를 보존했습니다.
theological_decisions:
- issue: 1 Esdras의 그리스어 본문을 따를 때 이름과 숫자가 역대하의 히브리어 병행본과 다르게 제시됨
  chosen_reading: 주본문에는 그리스어 본문의 이름과 숫자(양 천 마리, 송아지 칠백 마리)를 그대로 유지했습니다.
  alternative_readings:
  - 병행 본문을 따라 이름과 숫자를 맞추는 방식
  - 역대하 35:9의 2,600마리와 300마리로 조정하는 방식
  rationale: 이 절은 1 Esdras의 그리스어 증언이 번역 기준이므로, 병행 본문의 차이를 본문에서 평준화하지 않고 그대로 드러내는 것이 사본적 투명성에 부합합니다.
  doctrine_reference: Textual criticism / canonical parallel handling
