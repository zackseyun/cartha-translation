- from: 그리고 이에코니아, 사마이아, 나타나엘 — 그 형제 —, 사비아, 오키엘로스, 그리고 요람, 천부장들은 유월절을 위해 레위 사람들에게 양 천 마리와 송아지 칠백 마리를 주었습니다.[a]
  to: 그리고 이에코니아와 사마이아와 그 형제 나타나엘과 사비아와 오키엘로스와 요람, 곧 천부장들은 유월절을 위하여 레위 사람들에게 양 천 마리와 송아지 칠백 마리를 주었습니다.[a]
