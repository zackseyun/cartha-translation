    rationale: ὁ ἀδελφός는 나타나엘을 수식하지만 그 형제가 누구의 형제인지는 본문이 명시하지 않습니다. 현 대시 표기는 한국어 열거문을 단절시키고 ‘그 형제’의 연결 대상도 불필요하게 어색하게 만듭니다. ‘그 형제 나타나엘’은 소유격을 보태지 않으면서 원문의 관계 표지를 자연스럽게 반영합니다.
