base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/049.yaml
  text: But they mocked his messengers[a], and whenever the Lord spoke, they were making sport of his prophets, until, in his anger against his nation because of their ungodly deeds[b], he commanded the kings of the Chaldeans to come up against them.
  footnotes:
  - marker: a
    text: Or 'his angels'; here the context more likely means God's human messengers, especially in parallel with 'his prophets.'
    reason: lexical_alternative
  - marker: b
    text: The Greek reads 'the kings of the Chaldeans' (plural). The Hebrew parallel in 2 Chronicles 36 emphasizes the king of Babylon/Nebuchadnezzar. The main text follows the Greek witness of 1 Esdras.
    reason: textual_variant
translation:
  language: ko
  text: 그들은 그의 사자들을 조롱하였고, 주께서 말씀하신 날에 그의 예언자들을 비웃고 있었습니다. 그러다가 그분이 자기 민족에게, 그들의 경건하지 못한 행위로 인해 분노하셔서, 갈대아 사람들의 왕들을 그들 위로 올라오게 하라고 명령하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 천사들’. 여기서는 앞뒤 문맥상 하나님이 보내신 인간 사자들을 가리킬 가능성이 더 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘갈대아 사람들의 왕들’로 복수형입니다. 히브리어 평행본문은 바빌론 왕/느부갓네살의 단수를 강조하므로, 본문은 그리스어 증거를 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἐμυκτήρισαν
  english_pob_choice: mocked
  chosen_korean: 조롱하였고
  alternatives_korean:
  - 비웃었고
  - 멸시하였고
  - 조롱하였으며
  lexicon: LSJ
  rationale: 경멸적 조소의 뜻을 살리되, 이어지는 ‘예언자들을 비웃고’와 중복되지 않도록 ‘조롱하다’를 택했습니다.
- source_word: ἐν τοῖς ἀγγέλοις αὐτοῦ
  english_pob_choice: his messengers
  chosen_korean: 그의 사자들을
  alternatives_korean:
  - 그의 천사들을
  - 그의 전령들을
  lexicon: BDAG/LSJ
  rationale: 문맥상 하나님이 보내신 인간 사자들이 앞뒤의 ‘예언자들’과 더 잘 맞습니다. ‘사자’는 공적 파견자라는 뜻을 살리면서도 ‘천사’ 가능성은 각주로 보존합니다.
- source_word: ᾗ ἡμέρᾳ ἐλάλησεν Κύριος
  english_pob_choice: whenever the Lord spoke
  chosen_korean: 주께서 말씀하신 날에
  alternatives_korean:
  - 주께서 말씀하실 때마다
  - 주께서 말씀하실 때
  lexicon: LSJ
  rationale: 그리스어의 시간 표현을 과도하게 풀지 않고 비교적 직역에 가깝게 옮겼습니다. 한국어에서는 ‘말씀하신 날에’가 본문의 반복적/서술적 흐름을 유지하면서도 읽기 자연스럽습니다.
- source_word: τοὺς βασιλεῖς τῶν Χαλδαίων
  english_pob_choice: the kings of the Chaldeans
  chosen_korean: 갈대아 사람들의 왕들
  alternatives_korean:
  - 갈대아 왕들
  - 갈대아 사람들의 왕
  lexicon: LSJ
  rationale: 그리스어 복수형을 본문에 그대로 반영해 ‘왕들’로 유지했습니다. 히브리어 평행본문의 단수와는 다른 독법이므로 평준화하지 않았습니다.
theological_decisions:
- issue: ‘ἀγγέλοις’의 지시 대상
  chosen_reading: 하나님이 보내신 인간 사자들
  alternative_readings:
  - 하늘의 천사들
  rationale: ‘그의 예언자들’과 병렬되는 점에서 초자연적 천사보다 예언자들과 함께 거부된 인간 사자들이 더 적절합니다.
  doctrine_reference: 번역 원칙 §1, §3
- issue: 그리스어 복수형 ‘갈대아 사람들의 왕들’을 유지할지 여부
  chosen_reading: 본문에서 복수형을 유지함
  alternative_readings:
  - 갈대아의 왕
  - 느부갓네살
  rationale: 1 Esdras에서는 그리스어 본문을 1차 기준으로 삼아야 하므로, 히브리어 평행본문과의 차이를 본문에서 지우지 않았습니다.
  doctrine_reference: 1 Esdras Greek primacy; MT parallel as control text
