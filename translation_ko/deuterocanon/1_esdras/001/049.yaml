revisions:
- from: 그들은 그의 사자들을 조롱하였고, 주께서 말씀하신 날에 그의 예언자들을 비웃고 있었습니다. 그러다가 그분이 자기 민족에게, 그들의 경건하지 못한 행위로 인해 분노하셔서, 갈대아 사람들의 왕들을 그들 위로 올라오게 하라고 명령하셨습니다.[a][b]
  to: 그러나 그들은 그의 사자들을 조롱하였고[a], 주께서 말씀하실 때마다 그의 예언자들을 비웃고 있었습니다. 마침내 그분은 그들의 불경한 행위 때문에 자기 민족에게 진노하셔서 갈대아 사람들의 왕들에게[b] 그들을 치러 올라오라고 명령하셨습니다.
  rationale: 그리스어를 우선하여 ‘왕들’의 복수형을 유지하고, ἀγγέλοις의 가능한 ‘천사들’ 독법은 각주에 보존했습니다. 시간 관계는 반복적 문맥에 맞게 자연화했으며, 침공을 뜻하는 ἀναβιβάσαι ἐπ᾽ αὐτούς는 ‘그들을 치러 올라오라’로 명확히 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T05:29:22Z'
review_pass:
  verdict: revise
  source_fidelity: 그리스어의 복수형 ‘갈대아 사람들의 왕들’과 ἀγγέλοις의 문맥상 ‘사자들’ 이해를 잘 보존했습니다. 다만 ‘그들 위로 올라오게 하라고’는 ἐπ᾽ αὐτούς의 적대적 군사 이동을 자연스럽고 분명하게 전달하지 못하며, 명령의 수령자인 왕들도 한국어 문장에서 명시하는 편이 안전합니다.
  naturalness: ‘주께서 말씀하신 날에’는 한국어에서 단회적 특정 날을 강하게 암시하고, 이어지는 미완료 과거의 반복·지속 상황과 다소 어울리지 않습니다. ‘주께서 말씀하실 때마다’가 문맥과 현대 한국어에 더 자연스럽습니다. 또한 ‘그들 위로 올라오게 하라고’보다 ‘그들을 치러 올라오라고’가 관용적입니다.
  terminology: ‘사자들’, ‘예언자들’, ‘갈대아 사람들의 왕들’은 적절합니다. δυσσεβήματα는 하나님을 향한 불경·불경건의 뜻이므로 ‘불경한 행위’로 옮기면 더 직접적입니다. 각주 표지는 해당 단어 바로 뒤에 두는 것이 참조 범위를 명확히 합니다.
  issues:
  - severity: medium
    issue: 군사적 동작과 명령 대상의 불명확성
    rationale: ‘갈대아 사람들의 왕들을 그들 위로 올라오게 하라고 명령하셨습니다’는 누가 왕들을 올라오게 하는지 불분명하고 ‘그들 위로’도 한국어 군사 서술로 부자연스럽습니다. 왕들에게 ‘그들을 치러 올라오라’고 명령했다는 구조가 그리스어의 의미를 명료하게 반영합니다.
  - severity: low
    issue: 시간 표현의 부자연스러움
    rationale: ᾗ ἡμέρᾳ는 문맥상 주께서 말씀하실 때마다라는 반복적 시간 관계로 이해할 수 있습니다. ‘말씀하신 날에’는 특정 하루를 뜻하는 듯하여 한국어 독해상 덜 적절합니다.
  - severity: low
    issue: 각주 b의 표지 위치
    rationale: 복수형에 관한 각주는 ‘왕들’ 바로 뒤에 두어 무엇을 설명하는지 즉시 알 수 있게 하는 편이 좋습니다.
