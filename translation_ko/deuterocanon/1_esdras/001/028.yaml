base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/028.yaml
  text: And the king said to his servants[a], “Take me away from the battle, for I am very weak.” And immediately his servants took him away from the battle line,
  footnotes:
  - marker: a
    text: Or “attendants.” Greek παῖδες can mean “servants,” “attendants,” or “young men”; the Hebrew parallel reads “his servants.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 왕이 자기 시종들에게 말하였습니다. “나를 전투에서 데려가 주십시오. 내가 매우 약해졌습니다.” 그러자 그의 시종들이 곧바로 그를 전열에서 데려갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 그리스어 παῖδες는 이 왕의 군사·궁정 맥락에서 ‘시종들’ 또는 ‘종들’로 옮길 수 있습니다. 히브리어 병행문은 ‘그의 종들’을 읽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παισίν / παῖδες
  english_pob_choice: servants
  chosen_korean: 종들
  alternatives_korean:
  - 시종들
  - 수종들
  - 어린 종들
  lexicon: LSJ
  rationale: 왕의 군사적·궁정적 맥락에서 παῖδες는 단순한 ‘소년들’이 아니라 왕을 시종하는 하인/수종을 가리키므로, 본문 기능을 살리는 ‘종들’로 옮겼습니다. MT 병행문의 ‘그의 종들’도 이 판단을 뒷받침합니다.
- source_word: Ἀποστήσατέ με
  english_pob_choice: Take me away
  chosen_korean: 나를 옮겨 주십시오
  alternatives_korean:
  - 나를 데려가 주십시오
  - 나를 물러나게 해 주십시오
  - 나를 치워 주십시오
  lexicon: LSJ
  rationale: 여기서는 전투로부터의 물리적 이동을 요청하는 말이므로, 자연스러운 한국어이면서도 단순 제거가 아닌 ‘떼어 옮김’의 의미를 살린 표현을 택했습니다.
- source_word: ἠσθένησα λίαν
  english_pob_choice: I am very weak
  chosen_korean: 내가 매우 약해졌습니다
  alternatives_korean:
  - 제가 매우 약합니다
  - 내가 심히 병들었습니다
  - 내가 몹시 쇠약해졌습니다
  lexicon: LSJ
  rationale: ἠσθένησα는 ‘약해지다/쇠약해지다’의 상태 변화를 나타내며, 원문은 부상보다 연약함 자체를 말합니다. 과도한 해석을 피하고 현재의 곤란한 상태를 드러내는 ‘약해졌습니다’가 적절합니다.
- source_word: παράταξις
  english_pob_choice: battle line
  chosen_korean: 전열
  alternatives_korean:
  - 전투 진형
  - 진열
  - 전선
  lexicon: LSJ
  rationale: παράταξις는 전투의 배열된 진형, 곧 전열을 뜻하므로, ‘전투’와 구별되는 군사적 위치를 살려 ‘전열’로 옮겼습니다.
theological_decisions:
- issue: 왕의 요청이 ‘전투에서’와 ‘전열에서’ 두 표현으로 나뉘는 점
  chosen_reading: 본문의 앞부분은 전투 일반에서의 이탈 요청을, 뒷부분은 곧바로 전열에서의 실제 이동을 말하는 것으로 구분해 번역했습니다.
  alternative_readings:
  - 두 곳 모두 단순히 ‘전투에서’로 통일
  - 두 곳 모두 ‘전선에서’로 통일
  rationale: 그리스어는 μάχη와 παράταξις를 구별해 사용하므로, 한국어에서도 의미 차이를 보존해 독자가 왕의 요청과 실제 조치를 구별하도록 했습니다.
  doctrine_reference: source-language distinction / narrative precision
