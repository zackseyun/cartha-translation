base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/011.yaml
  text: And they roasted the Passover with fire[a], as was proper, and they boiled the sacrifices in the bronze pots and kettles with a pleasing aroma[b], and brought them to all the people.
  footnotes:
  - marker: a
    text: Or, more specifically, 'to all those from the people,' possibly meaning the non-priestly people as distinct from the priests and Levites.
    reason: lexical_alternative
  - marker: b
    text: '''With a pleasing aroma'' renders a phrase that literally refers to fragrance or sweet smell; in sacrificial context it may evoke the aroma of an offering.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 유월절을 불에 구워, 마땅한 대로 하였으며, 희생제물들을 놋 냄비와 가마솥에 향기롭게 삶아 모든 백성에게 가져다주었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 문자적으로는 ‘백성 가운데서 나온 모든 이들에게’로, 제사장과 레위인과 구별되는 일반 백성을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘향기롭게’는 문자적으로는 향기/좋은 냄새를 뜻하는 말로, 제사 문맥에서는 하나님께 기쁘게 받아들여지는 향내의 뉘앙스를 띱니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤπτησαν
  english_pob_choice: roasted
  chosen_korean: 구워
  alternatives_korean:
  - 볶아
  - 불에 구워
  lexicon: LSJ
  rationale: πάσχα와 결합된 조리 동사로서 단순한 ‘요리하다’보다 불에 직접 익히는 뜻을 살려야 하므로 ‘구워’로 옮겼습니다.
- source_word: τὸ πάσχα
  english_pob_choice: the Passover
  chosen_korean: 유월절
  alternatives_korean:
  - 유월절 제물
  - 유월절 양
  lexicon: LSJ
  rationale: 여기서는 제의적 절기와 그에 따른 예물을 함께 가리킬 수 있으므로, 본문에 가장 자연스러운 ‘유월절’을 택했습니다.
- source_word: ἐν τοῖς χαλκίοις καὶ λέβησιν
  english_pob_choice: in the bronze pots and kettles
  chosen_korean: 놋 냄비와 가마솥에
  alternatives_korean:
  - 청동 솥과 가마에
  - 놋그릇과 가마솥에
  lexicon: LSJ
  rationale: χαλκίοις와 λέβησιν의 두 조리 용기를 한국어로 구별해 주기 위해 ‘놋 냄비와 가마솥’으로 옮겼습니다.
- source_word: μετʼ εὐωδίας
  english_pob_choice: with a pleasing aroma
  chosen_korean: 향기롭게
  alternatives_korean:
  - 향긋하게
  - 향내 나게
  lexicon: LSJ
  rationale: 직역하면 향기/좋은 냄새를 뜻하지만, 제사 문맥의 ‘향기로운 냄새’ 뉘앙스를 간결하게 살리기 위해 부사적으로 처리했습니다.
- source_word: πᾶσι τοῖς ἐκ τοῦ λαοῦ
  english_pob_choice: to all the people
  chosen_korean: 모든 백성에게
  alternatives_korean:
  - 백성 가운데 모든 이에게
  - 모든 백성 가운데서
  lexicon: LSJ
  rationale: 직역은 ‘백성에게서 나온 모든 이들’이지만, 문맥상 제관·레위인과 구별되는 일반 백성을 가리킬 수 있어 본문은 자연스러운 ‘모든 백성’으로 두고, 세부 구분은 축약했습니다.
theological_decisions:
- issue: 제물 조리 방식의 구분
  chosen_reading: 유월절은 ‘구워’지고, 희생제물들은 따로 ‘삶아’졌다는 구분을 본문에서 유지했습니다.
  alternative_readings:
  - 둘 다 ‘요리하다’로 통합
  rationale: 그리스어는 서로 다른 동사(ὤπτησαν, ἥψησαν)를 사용하므로, 제의 절차의 차이를 흐리지 않도록 구별을 보존했습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: ‘모든 백성’의 범위
  chosen_reading: 본문에는 ‘모든 백성’으로 두고, 사회적 구분 가능성은 본문 밖에서만 염두에 두었습니다.
  alternative_readings:
  - ‘모든 평민’
  - ‘백성 가운데 모든 이’
  rationale: 원문의 πᾶσι τοῖς ἐκ τοῦ λαοῦ는 제사장·레위인과 대비되는 일반 백성을 암시할 수 있으나, 본문 자체는 가장 분명한 표현을 우선해야 합니다.
  doctrine_reference: Translation philosophy §6
