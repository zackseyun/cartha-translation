revisions:
- from: 그리고 그들은 유월절을 불에 구워, 마땅한 대로 하였으며, 희생제물들을 놋 냄비와 가마솥에 향기롭게 삶아 모든 백성에게 가져다주었습니다.[a][b]
  to: 그들은 마땅한 대로 유월절을 불에 구웠으며, 희생 제물들은 놋 냄비와 가마솥에서 향기가 나게[b] 삶아 백성 가운데 있는 모든 이에게[a] 가져다주었습니다.
  rationale: 수식 관계를 바로잡아 ‘마땅한 대로’가 유월절을 굽는 방식에 연결되게 했습니다. 두 조리 방식과 용기의 구별은 보존했습니다. 또한 각주 표지를 해당 원어 표현 뒤로 옮기고, 향기에 관한 각주에서 원문이 명시하지 않는 신학적 단정을 제거했습니다.
