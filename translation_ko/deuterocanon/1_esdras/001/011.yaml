review_pass:
  verdict: revise
  source_fidelity: 그리스어의 두 조리 동사(ὤπτησαν/ἥψησαν)를 ‘굽다/삶다’로 구별한 점과 조리 용기 및 수령자 표현은 대체로 충실합니다. 그러나 ‘마땅한 대로’가 문장상 ‘그들이 행하였다’에 붙어 원문의 수식 범위(유월절을 굽는 방식)를 흐립니다. 또한 각주 표지가 해당 표현 바로 뒤에 놓이지 않았습니다.
  naturalness: ‘유월절을 불에 구워, 마땅한 대로 하였으며’는 현대 한국어에서 어색하고 의미 연결이 불분명합니다. ‘마땅한 대로 유월절을 불에 구웠으며’로 고치면 자연스럽고 원문 구조도 잘 드러납니다. ‘향기롭게 삶아’는 가능하나, ‘향기가 나게 삶아’가 μετʼ εὐωδίας의 감각적 의미를 조금 더 투명하게 나타냅니다.
  terminology: ‘유월절’, ‘희생 제물’, ‘놋 냄비와 가마솥’은 적절합니다. 기존 각주 b의 ‘하나님께 기쁘게 받아들여지는’은 원문이 명시하지 않는 신학적 해석이므로, 제사 문맥에서의 연상을 가능성으로만 제시해야 합니다.
  issues:
  - severity: medium
    issue: ‘ὡς καθήκει’의 수식 범위가 불명확함
    rationale: 원문에서 ‘마땅한 대로’는 유월절을 불에 굽는 행위에 직접 연결됩니다. 초안의 쉼표와 ‘하였으며’는 이를 별도 행위처럼 읽히게 합니다.
  - severity: medium
    issue: 각주 표지의 위치와 내용 범위가 맞지 않음
    rationale: a는 πᾶσι τοῖς ἐκ τοῦ λαοῦ에 관한 각주이므로 수령자 표현 뒤에, b는 μετʼ εὐωδίας에 관한 각주이므로 ‘향기가 나게’ 뒤에 놓여야 합니다.
  - severity: medium
    issue: 각주 b가 원문 이상의 신학적 의미를 단정함
    rationale: εὐωδία는 향기·좋은 냄새를 뜻합니다. 제사 문맥에서 제물의 향기를 연상시킬 수는 있으나, 하나님께 받아들여짐을 본문이 직접 말하지는 않습니다.
  revised_text: 그들은 마땅한 대로 유월절을 불에 구웠으며, 희생 제물들은 놋 냄비와 가마솥에서 향기가 나게[b] 삶아 백성 가운데 있는 모든 이에게[a] 가져다주었습니다.
