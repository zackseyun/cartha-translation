  source_fidelity: 본문의 수량, 수여 대상, 성소 감독자라는 직함, 그리고 양과 송아지의 구분은 그리스어 본문에 충실합니다. 다만 Ζαχαρίας의 음역으로 ‘자가랴’는 그리스어 형태를 충분히 반영하지 못합니다. 그리스어 본문을 따라 이름을 옮기는 방침이라면 ‘자카리아스’가 더 적절합니다.
  naturalness: 전반적으로 현대 표준어 합쇼체로 자연스럽습니다. ‘왕실의 소유에서’보다 ‘왕실 소유물 가운데서’가 출처·재원의 의미를 더 명료하게 드러냅니다. 또한 ‘약속에 따라’에 관한 주석 표지는 해당 표현 바로 뒤에 두어야 독자가 주석의 대상을 분명히 알 수 있습니다.
  terminology: ‘제사장들’, ‘레위인들’, ‘성소’, ‘유월절’, ‘양’, ‘송아지’는 적절합니다. Χελκείας와 Ἡσυηλος를 그리스어식으로 ‘헬키아스’, ‘에시엘로스’라 한 방침도 유지할 수 있습니다. Ζαχαρίας는 같은 방침에 맞추어 ‘자카리아스’로 통일하는 것이 좋습니다.
  issues:
