base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/008.yaml
  text: These things were given from the royal possessions[a], according to the promise, to the people and to the priests and Levites. And Helkias, Zechariah, and Esyelos, the overseers of the sanctuary, gave to the priests for the Passover two thousand six hundred sheep[c][b], and three hundred calves.
  footnotes:
  - marker: a
    text: The Hebrew parallel in 2 Chronicles 35:8 has the corresponding names in Hebrew form, commonly rendered 'Hilkiah ... Jehiel.' The Greek text of 1 Esdras here reads Helkias ... Esyelos.
    reason: alternative_reading
  - marker: b
    text: The Hebrew parallel specifies 'sheep, lambs, and young goats' from the king's property; the Greek here uses the broader term 'sheep.'
    reason: lexical_alternative
  - marker: c
    text: Or 'as promised.' The Greek phrase literally reads 'according to the promise.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것들은 왕실의 소유에서, 약속에 따라, 백성과 제사장들과 레위인들에게 주어졌습니다. 그리고 성소의 감독자들인 헬키아스와 자가랴와 에시엘로스가, 유월절을 위해 제사장들에게 양 이천육백 마리와 송아지 삼백 마리를 주었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 이름을 헬키아스, 자가랴, 에시엘로스로 전합니다. 히브리어 평행본문의 형태와는 다릅니다.
    reason: source_note
  - marker: b
    text: πρόβατα는 넓게는 양을 가리키지만, 히브리어 평행본문은 양과 어린 염소를 구분합니다.
    reason: cross_reference
  - marker: c
    text: κατʼ ἐπαγγελίαν은 문자적으로는 ‘약속에 따라’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τῶν βασιλικῶν
  english_pob_choice: from the royal possessions
  chosen_korean: 왕실의 소유에서
  alternatives_korean:
  - 왕의 재산에서
  - 왕실의 재산에서
  lexicon: LSJ
  rationale: Greek의 βασιλικά는 왕실/왕의 소유물을 뜻하므로, 현대 한국어에서는 ‘왕실의 소유’가 자연스럽고 원문 범위를 과도하게 좁히지 않습니다.
- source_word: κατʼ ἐπαγγελίαν
  english_pob_choice: according to the promise
  chosen_korean: 약속에 따라
  alternatives_korean:
  - 약속대로
  - 그 약속에 따라
  lexicon: LSJ
  rationale: 명사구 ἐπαγγελία를 살리면서도 한국어에서 가장 자연스럽게 들리는 표현으로 옮겼습니다. POB의 ‘according to the promise’와 같은 의미를 유지합니다.
- source_word: οἱ ἐπιστάται τοῦ ἱεροῦ
  english_pob_choice: the overseers of the sanctuary
  chosen_korean: 성소의 감독자들
  alternatives_korean:
  - 성전의 감독관들
  - 성전 감독자들
  lexicon: LSJ
  rationale: ἐπιστάται는 어떤 일을 맡아 감독하는 자들이므로 ‘감독자들’이 직역에 가깝습니다. τοῦ ἱεροῦ는 ‘성전’도 가능하지만, 원문의 신성한 공간 뉘앙스를 살려 ‘성소’로 옮겼습니다.
- source_word: πρόβατα
  english_pob_choice: sheep
  chosen_korean: 양
  alternatives_korean:
  - 양떼
  - 양들
  lexicon: LSJ
  rationale: 본문은 넓은 뜻의 πρόβατα를 사용하므로, 축제 제물 맥락에서 한국어로 가장 자연스러운 단수 집합 명사 ‘양’으로 옮겼습니다. 영어 POB의 ‘sheep’에 대응합니다.
- source_word: μόσχους
  english_pob_choice: calves
  chosen_korean: 송아지
  alternatives_korean:
  - 어린 소
  - 송아지들
  lexicon: LSJ
  rationale: μόσχος는 어린 소를 뜻하므로 ‘송아지’가 가장 직접적입니다. 제물 목록의 항목으로도 자연스럽습니다.
- source_word: Χελκείας καὶ Ζαχαρίας καὶ Ἡσυηλος
  english_pob_choice: Helkias, Zechariah, and Esyelos
  chosen_korean: 헬키아스와 자가랴와 에시엘로스
  alternatives_korean:
  - 힐기야와 스가랴와 예히엘
  - 헬기야와 자카리아와 에시엘로스
  lexicon: LSJ
  rationale: 이 번역은 1 Esdras의 그리스어 이름 형태를 따라 음역했습니다. MT 평행본문의 힐기야/예히엘형은 주석적 대비로만 남기고 본문은 그리스어 증거를 반영합니다.
theological_decisions:
- issue: κατʼ ἐπαγγελίαν의 의미를 ‘약속’으로 유지할지, ‘서원/언약’으로 구체화할지
  chosen_reading: ‘약속에 따라’로 두어, 누가 한 약속인지는 본문이 밝히지 않는 긴장을 유지했습니다.
  alternative_readings:
  - 서원에 따라
  - 언약에 따라
  - 약속대로
  rationale: 그리스어는 단순히 ‘약속에 따라’라고 말할 뿐이므로, 주체를 보충하거나 종교적 용어로 특정하지 않는 것이 원문에 더 충실합니다.
  doctrine_reference: source transparency
