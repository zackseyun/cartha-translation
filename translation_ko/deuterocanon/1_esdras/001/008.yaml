revisions:
- from: 이것들은 왕실의 소유에서, 약속에 따라, 백성과 제사장들과 레위인들에게 주어졌습니다. 그리고 성소의 감독자들인 헬키아스와 자가랴와 에시엘로스가, 유월절을 위해 제사장들에게 양 이천육백 마리와 송아지 삼백 마리를 주었습니다.[a][b][c]
  to: 이러한 것들은 왕실 소유물 가운데서, 약속에 따라[c], 백성과 제사장들과 레위인들에게 주어졌습니다. 그리고 성소의 감독자들인 헬키아스와 자카리아스와 에시엘로스가 유월절을 위해 제사장들에게 양 이천육백 마리와 송아지 삼백 마리를 주었습니다.[a][b]
  rationale: 그리스어 본문을 우선하여 수량과 동물 명칭을 유지했습니다. 이름들은 본문이 제시하는 그리스어 형태를 따르되, Ζαχαρίας는 음역을 ‘자카리아스’로 바로잡았습니다. ‘약속에 따라’가 누구의 약속인지는 원문이 특정하지 않으므로 그대로 보존했으며, 관련 주석 표지를 해당 표현 뒤로 이동했습니다.
