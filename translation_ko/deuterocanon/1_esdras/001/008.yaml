    rationale: 본문은 히브리어 평행본문의 이름 형태가 아니라 그리스어 형태를 번역의 기준으로 삼습니다. ‘자가랴’는 그리스어 χ 및 어말 -ας를 반영하지 않아, ‘헬키아스’ 및 ‘에시엘로스’와 함께 제시된 그리스어식 음역 원칙과도 일관되지 않습니다.
