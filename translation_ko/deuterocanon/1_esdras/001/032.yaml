  source_fidelity: 그리스어 본문이 예고니아/여고냐를 요시야 대신 왕으로 세우고 그 나이를 스물세 살로 제시하는 점은 대체로 충실히 반영했습니다. 다만 Ἰεχονίαν에는 한국어 성서 문헌에서 통용되는 이름인 ‘여고냐’를 쓰는 편이 정확성과 독자 인지도 면에서 더 적절합니다.
