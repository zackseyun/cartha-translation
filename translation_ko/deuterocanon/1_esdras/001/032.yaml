base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/032.yaml
  text: And those from the nation took Jechoniah son of Josiah and made him king in place of Josiah his father, when he was twenty-three years old.
  footnotes:
  - marker: a
    text: The Greek text reads 'Jechoniah'; the parallel account in 2 Chronicles 36:1 names Jehoahaz.
    reason: alternative_reading
translation:
  language: ko
  text: 그 나라의 사람들은 요시야의 아들 여고냐[a]를 데려다가 그의 아버지 요시야를 대신하여 왕으로 세웠습니다. 그는 스물세 살이었습니다.
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 그리스어 본문은 ‘여고냐’라고 읽지만, 병행 본문인 역대기하 36:1은 ‘여호아하스’를 이름으로 듭니다.
    reason: 그리스어 본문과 병행 본문의 인명 차이를 밝혀, 본문은 그리스어의 읽기를 유지하면서도 독자가 차이를 확인할 수 있게 합니다.
lexical_decisions:
- source_word: οἱ ἐκ τοῦ ἔθνους
  english_pob_choice: those from the nation
  chosen_korean: 그 나라 사람들은
  alternatives_korean:
  - 그 민족에서 나온 사람들은
  - 나라에 속한 사람들은
  - 그 백성들은
  lexicon: LSJ
  rationale: 그리스어의 직역형을 유지하면서도 한국어에서 자연스럽게 읽히도록 ‘그 나라 사람들’로 옮겼습니다. 본문은 특정 제도 용어보다 집단 주체를 드러내는 표현이 적절합니다.
- source_word: ἀναλαβόντες
  english_pob_choice: took
  chosen_korean: 데려다가
  alternatives_korean:
  - 데리고 와서
  - 취하여
  - 붙들어
  lexicon: LSJ
  rationale: 이 동사는 단순한 물리적 ‘취함’보다 인물을 특정 방식으로 받아들이거나 데려오는 뉘앙스를 가질 수 있어, 즉위 맥락에서 ‘데려다가’로 자연스럽게 살렸습니다.
- source_word: ἀνέδειξαν βασιλέα
  english_pob_choice: made him king
  chosen_korean: 왕으로 세웠습니다
  alternatives_korean:
  - 왕으로 삼았습니다
  - 왕으로 임명했습니다
  - 왕으로 선포했습니다
  lexicon: LSJ
  rationale: 즉위 행위를 드러내면서도 과도한 의례 해석을 피하기 위해 ‘왕으로 세우다’를 택했습니다. 영어 POB의 ‘made him king’과 같은 의미 범위를 한국어로 간결하게 반영합니다.
- source_word: ὄντα ἐτῶν εἴκοσι τριῶν
  english_pob_choice: when he was twenty-three years old
  chosen_korean: 그는 스물세 살이었습니다
  alternatives_korean:
  - 스물세 살이었을 때입니다
  - 스물세 살이 되었습니다
  - 스물세 살인 상태였습니다
  lexicon: LSJ
  rationale: 그리스어 분사구를 한국어 서술문으로 옮겨, 연령 정보가 자연스럽게 읽히도록 했습니다. 본문 흐름상 별도의 시간 부사 없이도 의미가 충분히 전달됩니다.
- source_word: Ἰεχονίαν
  english_pob_choice: Jechoniah
  chosen_korean: 예고니아
  alternatives_korean:
  - 여고냐
  - 여호야긴
  - 여호아하스
  lexicon: LSJ
  rationale: 본문의 그리스어 표기를 따라 고유명사를 음역했습니다. 병행 본문과의 차이는 주석으로 처리하는 것이 적절합니다.
theological_decisions:
- issue: 그리스어 본문 이름과 병행 전통의 불일치
  chosen_reading: 본문에는 예고니아를 유지하고, 병행 전통과의 차이는 주석으로 밝힙니다.
  alternative_readings:
  - 여호아하스로 조화
  - 여고냐로 한국 교회식 조정
  rationale: 이 문서는 1 Esdras의 그리스어가 주번역 근거이므로, 병행 본문과 조화시키기보다 현존 본문의 이름을 보존하는 것이 투명합니다. 독자가 역사적 병행 차이를 확인할 수 있도록 주석을 둡니다.
  doctrine_reference: 원어 우선 원칙; 외경/유대 역사서 본문비평의 투명성
