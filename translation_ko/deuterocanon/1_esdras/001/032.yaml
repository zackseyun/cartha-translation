- from: 그리고 그 나라 사람들은 요시야의 아들 예고니아를 데려다가, 그의 아버지 요시야 대신 왕으로 세웠습니다. 그는 스물세 살이었습니다.[a]
  to: 그 나라의 사람들은 요시야의 아들 여고냐[a]를 데려다가 그의 아버지 요시야를 대신하여 왕으로 세웠습니다. 그는 스물세 살이었습니다.
  rationale: 그리스어의 인명 읽기와 병행 본문 사이의 불일치는 본문에서 해소하지 않고 주석으로 남겼습니다. 다만 한국어의 통용 성서 인명 ‘여고냐’를 채택하고, 주석 표지를 해당 인명에 연결했습니다. 나이 정보는 그리스어의 대격 분사구가 여고냐를 수식한다는 뜻을 자연스러운 한국어 문장으로 보존합니다.
