translation:
  language: ko
  text: 그리고 요시야의 행위들은 경건으로 가득한 마음으로 그의 주님 앞에서 올바르게 되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὠρθώθη
  english_pob_choice: were made upright
  chosen_korean: 올바른 것으로 여겨졌습니다
  alternatives_korean:
  - 올바르게 되었습니다
  - 곧게 세워졌습니다
  - 올바르게 처리되었습니다
  lexicon: LSJ
  rationale: 수동형 동사를 살리면서도, 여기서는 요시야의 행위가 하나님 앞에서 도덕적으로 바르게 평가되었음을 자연스러운 합쇼체로 전합니다.
- source_word: τὰ ἔργα
  english_pob_choice: the deeds
  chosen_korean: 행적은
  alternatives_korean:
  - 행위는
  - 일들은
  - 업적은
  lexicon: LSJ
  rationale: 구체적 행동의 총체를 가리키므로, 단순한 ‘일들’보다 인물의 삶 전체를 평가하는 뉘앙스가 살아 있는 ‘행적’이 적절합니다.
- source_word: τοῦ κυρίου αὐτοῦ
  english_pob_choice: his Lord
  chosen_korean: 그의 주님
  alternatives_korean:
  - 그의 주인
  - 주님
  - 그의 주
  lexicon: LSJ
  rationale: 그리스어가 θεός 없이 κύριον만 쓰므로, 본문이 말하는 관계성을 유지해 ‘주님’으로 옮기되, ‘주인’처럼 소유·복종의 평면적 의미로 좁히지 않았습니다.
- source_word: εὐσεβείας
  english_pob_choice: godliness
  chosen_korean: 경건
  alternatives_korean:
  - 경외
  - 독실함
  - 신앙심
  lexicon: LSJ
  rationale: εὐσέβεια의 종교적·윤리적 경건함을 가장 압축적으로 전하는 표준적 한국어로 ‘경건’을 택했습니다.
theological_decisions:
- issue: κύριος를 ‘야훼’로 확대할지, 문맥상 ‘주님’으로 유지할지
  chosen_reading: 본문의 κύριος는 ‘주님’으로 유지했습니다.
  alternative_readings:
  - 야훼
  - 주
  - 하나님
  rationale: 이 절의 그리스어는 ‘τοῦ κυρίου αὐτοῦ’라고만 되어 있어, 여호와/야훼를 본문에 직접 삽입할 근거가 없습니다. 따라서 원문의 범위를 지키면서도 한국어 관례에 맞게 ‘주님’으로 번역했습니다.
  doctrine_reference: 'POB 원칙: 원문 우선, 문헌별 고유어 확대 자제'
- issue: ὠρθώθη를 단순 서술인지, ‘바르게 세워졌다’는 평가적 수동인지
  chosen_reading: 평가적 수동으로 보아 ‘올바른 것으로 여겨졌습니다’라고 옮겼습니다.
  alternative_readings:
  - 올바르게 되었습니다
  - 올바르게 세워졌습니다
  rationale: 문맥은 행위의 실제 성립보다 하나님 앞에서의 인정·판정에 더 가깝습니다. 그래서 결과 상태와 평가를 함께 드러내는 표현을 택했습니다.
  doctrine_reference: 문맥적 수동 이해
