- from: 그 땅이 자기의 안식일들을 누릴 때까지, 그 황폐한 모든 기간 동안 그것은 안식하며, 칠십 년이 채워지게 하였습니다.[a]
  to: 그 땅이 자기 안식일들을 누리기까지, 그 땅은 황폐해 있는 모든 기간 동안 안식일을 지켜 칠십 년을 채웠습니다.[a]
  rationale: The revision retains the Greek’s personification of the land, its repeated Sabbath language, and the stated completion of seventy years. It removes the Korean causative construction, improves formal-polite readability, and corrects the footnote’s claim about what is literal without adding interpretive claims beyond the text.
