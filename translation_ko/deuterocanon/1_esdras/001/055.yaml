base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/055.yaml
  text: until the land had enjoyed its Sabbaths; all the time of its desolation it kept Sabbath[a], to complete seventy years.
  footnotes:
  - marker: a
    text: Or, more literally, 'until the land was pleased with its Sabbaths.' The Greek personifies the land; 'had enjoyed its Sabbaths' expresses the sense in natural English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 땅이 자기의 안식일들을 누릴 때까지, 그 황폐한 모든 기간 동안 그것은 안식하며, 칠십 년이 채워지게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘자기의 안식일들을 누릴 때까지’입니다. 그리스어는 땅을 의인화하여, 포로기 동안 빼앗겼던 안식일-휴식을 되돌려 받는다는 뜻을 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕως τοῦ εὐδοκῆσαι
  english_pob_choice: until ... had enjoyed
  chosen_korean: …할 때까지
  alternatives_korean:
  - …하도록
  - …을 기뻐할 때까지
  lexicon: LSJ
  rationale: εὐδοκέω의 문자적 ‘기뻐하다/마음에 들어 하다’는 의인화가 강하므로, 한국어에서는 자연스럽게 ‘…할 때까지’로 옮겨 흐름을 살리되 의미는 뒤의 ‘안식일들’에서 보완했습니다.
- source_word: τὴν γῆν
  english_pob_choice: the land
  chosen_korean: 그 땅
  alternatives_korean:
  - 땅
  - 그 나라
  lexicon: LSJ
  rationale: 문맥상 지구가 아니라 유다 땅을 가리키므로 ‘그 땅’이 가장 직접적이며, 포로기·황폐화 맥락도 유지합니다.
- source_word: τὰ σάββατα αὐτῆς
  english_pob_choice: its Sabbaths
  chosen_korean: 자기의 안식일들
  alternatives_korean:
  - 자기의 안식들
  - 자기 땅의 안식일들
  lexicon: LSJ
  rationale: 복수형과 안식일-어근 반복을 살리기 위해 ‘안식일들’로 옮겼습니다. 한국어에서 ‘안식일’은 다소 제의적이지만, 본문의 토라적·레위기적 연결을 드러내는 데 유리합니다.
- source_word: σαββατιεῖ
  english_pob_choice: it kept Sabbath
  chosen_korean: 안식하며
  alternatives_korean:
  - 안식일을 지키며
  - 안식일을 지켰습니다
  lexicon: LSJ
  rationale: 동사가 ‘Sabbath-하다’에 해당하므로 단순한 휴식보다 안식일 개념을 보존해야 합니다. 현재 진행의 반복·지속 뉘앙스를 살리기 위해 ‘안식하며’로 처리했습니다.
theological_decisions:
- issue: 땅에 적용된 안식일 언어 보존
  chosen_reading: ‘안식일들’과 ‘안식하며’를 그대로 살려, 황폐한 땅이 빠뜨린 안식의 신학을 드러냈습니다.
  alternative_readings:
  - 그 땅이 쉬게 되기까지
  - 그 땅이 휴식을 누릴 때까지
  rationale: 본문은 단순한 휴식이 아니라 토라적 안식일 언어를 반복합니다. 이를 평이한 ‘휴식’으로 완화하면 레위기적·역대기적 신학적 결이 약해집니다.
  doctrine_reference: 'DOCTRINE.md: Consistency of key terms, or documented exception.'
