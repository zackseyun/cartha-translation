base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/039.yaml
  text: And Nebuchadnezzar took some of the sacred vessels of the Lord and carried them away and deposited them in his temple in Babylon[a].
  footnotes:
  - marker: a
    text: 'Or ''from the holy vessels of the Lord.'' The Greek can be read more literally this way, but the phrase likely has a partitive sense: he took some of the vessels rather than every vessel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 느부갓네살은 주님의 거룩한 기구들 가운데 일부를 가져다가 옮겨서 바빌론에 있는 자기 신전 안에 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 거룩한 기구들에서’. 그리스어는 문자적으로 이렇게도 읽을 수 있지만, 여기서는 일부만 취했다는 부분적 의미가 더 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τῶν ἱερῶν σκευῶν
  english_pob_choice: some of the holy vessels
  chosen_korean: 거룩한 기구들 가운데 일부
  alternatives_korean:
  - 거룩한 기구들에서
  - 성스러운 그릇들 가운데 일부
  lexicon: LSJ
  rationale: ἀπό + 속격은 여기서 전체를 다 가져간 것이 아니라 일부를 취했다는 부분적 의미가 자연스럽기 때문에, 한국어도 ‘가운데 일부’로 그 뉘앙스를 살렸습니다.
- source_word: τοῦ κυρίου
  english_pob_choice: of the Lord
  chosen_korean: 주님의
  alternatives_korean:
  - 주님의 소유인
  - 주님의
  lexicon: LSJ
  rationale: κύριος는 이 문맥에서 소유격으로 쓰였으므로, 표준적인 경어형인 ‘주님’의 소유격 ‘주님의’로 옮겼습니다.
- source_word: ἀπενέγκας ἀπηνείσατο
  english_pob_choice: carried them away and deposited them
  chosen_korean: 옮겨서 … 두었습니다
  alternatives_korean:
  - 가져가서 … 놓았습니다
  - 옮겨서 … 배치했습니다
  lexicon: LSJ
  rationale: 두 분사와 본동사는 연속 동작을 나타내므로, 한국어에서는 ‘가져다가/옮겨서/두었습니다’로 자연스럽게 이어 주면서도 탈취 후 보관의 의미를 유지했습니다.
- source_word: ἐν τῷ ναῷ αὐτοῦ ἐν Βαβυλῶνι
  english_pob_choice: in his temple in Babylon
  chosen_korean: 바빌론에 있는 자기 신전 안에
  alternatives_korean:
  - 바빌론의 자기 신전 안에
  - 바빌론에 있는 그의 신전 안에
  lexicon: LSJ
  rationale: ναός는 여기서 예루살렘 성전이 아니라 느부갓네살의 신전을 가리키므로, 한국어도 ‘신전’으로 구분해 주었습니다.
theological_decisions:
- issue: κύριος의 번역과 예배용어의 격식
  chosen_reading: ‘주님’으로 번역하되, 본문 안에서는 일반 서술형으로 유지했습니다.
  alternative_readings:
  - ‘야훼’
  - ‘주’
  rationale: 이 절의 κύριος는 그리스어 본문이 지시하는 소유 표현으로 읽히며, 여기서는 직접적인 야훼 인용이 아니므로 프로젝트 기본값을 따르되 문맥에 맞는 ‘주님’을 사용했습니다.
  doctrine_reference: 'DOCTRINE.md contested terms: κύριος → 주님; יהוה → 야훼'
