base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/022.yaml
  text: And the things concerning him also have been recorded in former times[a], concerning those who sinned and acted wickedly against the Lord beyond every nation and kingdom, and grieved him greatly[b]; and the words of the Lord rose up against Israel.
  footnotes:
  - marker: a
    text: 'The Greek text at ''and grieved him greatly'' is difficult: the transmitted word after ''grieved him'' is ἔστω, which is awkward in context. The translation takes it as conveying emphasis; alternatively, the line may preserve a minor textual disturbance.'
    reason: textual_variant
  - marker: b
    text: Or 'more than every nation and kingdom,' expressing that their sin surpassed that of all nations and kingdoms.
    reason: lexical_alternative
translation:
  language: ko
  text: 그에 관한 일들도 옛 시대에 기록되어 있습니다. 곧 모든 민족과 왕국보다 더 크게 주님께 죄를 짓고 불경하게 행한 사람들에 관한 것입니다. 그들은 주님을 크게 슬프게 하였습니다[a]. 그리고 주님의 말씀이 이스라엘을 거슬러 일어났습니다.
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 헬라어 본문의 ἔστω는 문맥상 난해합니다. 여기서는 강조의 뜻으로 ‘크게’라고 옮겼으나, 본문 전승에 작은 혼선이 있을 가능성도 있습니다.
    reason: textual_variant
