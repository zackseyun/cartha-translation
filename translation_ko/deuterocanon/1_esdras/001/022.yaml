base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/022.yaml
  text: And the things concerning him also have been recorded in former times[a], concerning those who sinned and acted wickedly against the Lord beyond every nation and kingdom, and grieved him greatly[b]; and the words of the Lord rose up against Israel.
  footnotes:
  - marker: a
    text: 'The Greek text at ''and grieved him greatly'' is difficult: the transmitted word after ''grieved him'' is ἔστω, which is awkward in context. The translation takes it as conveying emphasis; alternatively, the line may preserve a minor textual disturbance.'
    reason: textual_variant
  - marker: b
    text: Or 'more than every nation and kingdom,' expressing that their sin surpassed that of all nations and kingdoms.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그와 관련된 일들도 예전 기록에 남아 있습니다. 곧 야훼께 죄를 짓고 악을 행한 자들에 관한 것인데, 그들은 모든 민족과 왕국보다 더 크게 야훼를 슬프게 했습니다[a]; 그리고 야훼의 말씀이 이스라엘을 향해 일어났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 본문의 ἔστω는 문맥상 난해하여, 여기서는 전체 흐름상 강조로 이해해 옮겼습니다. 본문 전승에 작은 혼선이 있었을 가능성도 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: τὰ κατʼ αὐτόν
  english_pob_choice: the things concerning him
  chosen_korean: 그와 관련된 일들
  alternatives_korean:
  - 그에 관한 일들
  - 그에 대한 일들
  - 그와 관련된 것들
  lexicon: LSJ
  rationale: 인물에 관한 요약적 언급으로서 넓은 범위를 유지해야 하므로, 과도하게 구체화하지 않는 ‘그와 관련된 일들’로 옮겼습니다.
- source_word: ἐν τοῖς ἔμπροσθεν χρόνοις
  english_pob_choice: in former times
  chosen_korean: 예전 기록에
  alternatives_korean:
  - 옛날에
  - 이전 시대에
  - 먼 옛날 기록에
  lexicon: LSJ
  rationale: 기록된 역사 문맥을 살리되, 영어 POB가 잡은 시간적 의미를 자연스럽게 풀어 ‘예전 기록에’로 옮겼습니다.
- source_word: ἐλύπησαν αὐτόν ἔστω
  english_pob_choice: grieved him greatly
  chosen_korean: 그들은 … 야훼를 슬프게 했습니다
  alternatives_korean:
  - 그들은 … 야훼께 큰 슬픔을 안겼습니다
  - 그들은 … 야훼를 몹시 근심하게 했습니다
  - 그들은 … 야훼를 크게 괴롭게 했습니다
  lexicon: LSJ
  rationale: 본문의 감정적·인격적 표현을 약화하지 않기 위해 ‘슬프게 했습니다’로 직접 옮기고, ἔστω는 본문상 난해하므로 한국어에서는 과도한 추정 없이 강세만 반영했습니다.
- source_word: οἱ λόγοι τοῦ κυρίου ἀνέστησαν ἐπʼ Ἰσραήλ
  english_pob_choice: the words of the Lord rose up against Israel
  chosen_korean: 야훼의 말씀이 이스라엘을 향해 일어났습니다
  alternatives_korean:
  - 야훼의 말씀이 이스라엘 위에 일어났습니다
  - 야훼의 말씀이 이스라엘을 거슬러 일어났습니다
  - 야훼의 말씀이 이스라엘에 맞서 일어났습니다
  lexicon: LSJ
  rationale: ἀνέστησαν + ἐπί의 대항적 이미지를 살리면서도 한국어에서 어색하지 않게 ‘향해 일어났습니다’로 옮겼습니다.
theological_decisions:
