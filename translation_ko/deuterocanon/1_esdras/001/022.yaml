revisions:
- from: 그리고 그와 관련된 일들도 예전 기록에 남아 있습니다. 곧 야훼께 죄를 짓고 악을 행한 자들에 관한 것인데, 그들은 모든 민족과 왕국보다 더 크게 야훼를 슬프게 했습니다[a]; 그리고 야훼의 말씀이 이스라엘을 향해 일어났습니다.
  to: 그에 관한 일들도 옛 시대에 기록되어 있습니다. 곧 모든 민족과 왕국보다 더 크게 주님께 죄를 짓고 불경하게 행한 사람들에 관한 것입니다. 그들은 주님을 크게 슬프게 하였습니다[a]. 그리고 주님의 말씀이 이스라엘을 거슬러 일어났습니다.
  rationale: 시간 표현에 불필요하게 첨가된 ‘기록’을 제거하고, 비교구를 죄와 불경한 행위에 명확히 연결했습니다. κύριος는 그리스어 원문 및 영어 감사 이력에 맞추어 ‘주님’으로 바꾸었습니다. 난해한 ἔστω는 단정적으로 해석하지 않고 제한적인 강조 표현과 각주로 처리했으며, ἐπί의 대항적 의미는 ‘거슬러’로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T05:29:04Z'
review_pass:
  verdict: revise
  source_fidelity: ‘예전 기록에’는 ἐν τοῖς ἔμπροσθεν χρόνοις(‘옛 시대에/이전 시대에’)가 직접적으로 말하는 시간 표현에 ‘기록’이라는 대상을 더합니다. 또한 κύριος는 그리스어 본문과 영어 POB의 일관된 선택에 따라 ‘주님’으로 옮기는 것이 안전합니다. παρὰ ἅπαν ἔθνος καὶ βασιλείαν의 비교는 ‘슬프게 했다’가 아니라 죄를 짓고 불경하게 행한 정도에 연결해야 합니다. ἔστω는 난해하므로, 본문의 강조를 ‘크게’로 제한적으로 반영하고 각주를 유지하는 것은 가능합니다.
  naturalness: 합쇼체 문장은 대체로 자연스럽지만, ‘모든 민족과 왕국보다 더 크게 야훼를 슬프게 했습니다’는 비교의 범위가 한국어에서 ‘슬프게 함’으로 잘못 연결됩니다. 두 문장으로 나누어 비교 대상과 난해한 강조 표현을 분명히 하면 더 자연스럽습니다. ‘이스라엘을 거슬러 일어났습니다’는 대항적 ἐπί를 ‘향해’보다 정확하고 자연스럽게 드러냅니다.
  terminology: κύριος는 본 절의 그리스어 원문 및 English POB audit trail에 따라 ‘주님’으로 통일했습니다. ἠσεβηκότων은 일반적인 ‘악을 행한’보다 신을 향한 불경의 의미를 보존하는 ‘불경하게 행한’으로 옮겼습니다. ‘말씀’은 λόγοι의 집합적 용법을 한국어에서 자연스럽게 반영합니다.
  issues:
  - severity: medium
    issue: ‘예전 기록에’가 시간 표현에 ‘기록’을 첨가함
    rationale: ἐν τοῖς ἔμπροσθεν χρόνοις는 문자적으로 ‘옛/이전 시대에’이며, 이 구절 자체에는 ‘기록’이라는 명사가 없습니다. ἀναγέγραπται가 이미 ‘기록되어 있다’를 표현합니다.
  - severity: high
    issue: 비교구가 ‘야훼를 슬프게 했다’에 연결됨
    rationale: παρὰ ἅπαν ἔθνος καὶ βασιλείαν은 περὶ τῶν ἡμαρτηκότων καὶ ἠσεβηκότων의 죄와 불경의 정도를 비교합니다. 한국어 어순상 현 번역은 비교가 뒤의 ‘슬프게 했다’를 수식하는 것으로 읽힙니다.
  - severity: medium
    issue: κύριος를 ‘야훼’로 번역함
    rationale: 1 Esdras의 주된 번역 근거인 그리스어 본문은 κύριος를 사용하며, 제공된 English POB audit trail도 일관되게 ‘Lord’를 택합니다. 원문 우선 원칙상 ‘주님’이 안전합니다.
  - severity: low
    issue: ‘향해 일어났습니다’의 대항 의미가 약함
    rationale: ἀνέστησαν ἐπʼ Ἰσραήλ은 심판적으로 이스라엘에 맞서 일어나는 이미지를 지니므로 ‘거슬러’가 더 충실합니다.
  revised_text: 그에 관한 일들도 옛 시대에 기록되어 있습니다. 곧 모든 민족과 왕국보다 더 크게 주님께 죄를 짓고 불경하게 행한 사람들에 관한 것입니다. 그들은 주님을 크게 슬프게 하였습니다[a]. 그리고 주님의 말씀이 이스라엘을 거슬러 일어났습니다.
