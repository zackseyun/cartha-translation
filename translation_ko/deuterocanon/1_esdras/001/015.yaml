base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/015.yaml
  text: And the gatekeepers were at each gate; no one could leave his own appointed duty[a], for their brothers the Levites had prepared for them.
  footnotes:
  - marker: a
    text: Greek literally, 'the Levites had prepared for themselves.' The context likely means they prepared what was needed on the gatekeepers' behalf, so that each could remain at his assigned service.
    reason: lexical_alternative
translation:
  language: ko
  text: 문지기들은 각 문에 배치되어 있었고, 아무도 자기의 정해진 직무를 벗어날 수 없었습니다. 그들의 형제인 레위인들이 그들을 위해 준비해 두었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 그리스어는 문자적으로 ‘레위인들이 자기들을 위해 준비하였다’입니다. 문맥상 레위인들이 문지기들이 자기 직무를 지킬 수 있도록 필요한 것을 대신 준비해 주었다는 뜻으로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: θυρωροὶ
  english_pob_choice: gatekeepers
  chosen_korean: 문지기들
  alternatives_korean:
  - 성문지기들
  - 문을 지키는 자들
  lexicon: LSJ
  rationale: θυρωρός는 문이나 성문을 지키는 사람을 가리키므로, 성전 문맥에서 자연스럽고 기능을 드러내는 ‘문지기들’로 옮겼습니다.
- source_word: ἐφʼ ἑκάστου πυλῶνος
  english_pob_choice: at each gate
  chosen_korean: 각 문마다
  alternatives_korean:
  - 각 성문마다
  - 모든 문에
  lexicon: LSJ
  rationale: 분배적 의미를 살리면서도 한국어에서 간결하고 자연스러운 위치 표현인 ‘각 문마다’를 선택했습니다.
- source_word: οὐκ ἔστιν παραβῆναι ἕκαστον τὴν ἑαυτοῦ ἐφημερίαν
  english_pob_choice: no one could leave his own appointed duty
  chosen_korean: 각자 자기에게 맡겨진 직무를 떠날 수 없었습니다
  alternatives_korean:
  - 자기 교대 근무를 벗어날 수 없었습니다
  - 자기 봉사를 떠날 수 없었습니다
  lexicon: LSJ
  rationale: ἐφημερία는 고정된 봉사/직무를 뜻하므로 ‘맡겨진 직무’로 옮겨 제의적·공적 성격을 살렸습니다. ‘떠날 수 없었습니다’는 문맥상 자기 자리를 이탈할 수 없다는 뜻을 자연스럽게 전달합니다.
- source_word: ἡτοίμασαν ἑαυτοῖς
  english_pob_choice: had prepared for them
  chosen_korean: 그들을 위해 준비해 두었기 때문입니다
  alternatives_korean:
  - 자기들을 위해 준비해 두었기 때문입니다
  - 그들 몫을 준비해 두었기 때문입니다
  lexicon: LSJ
  rationale: 직역하면 재귀적으로 읽힐 수 있지만, 문맥상 레위인들이 문지기들을 위해 필요한 것을 미리 마련했다는 의미가 분명하므로 그 기능적 뜻을 살렸습니다.
theological_decisions:
- issue: ἡτοίμασαν ἑαυτοῖς의 재귀 표현 처리
  chosen_reading: 레위인들이 문지기들을 대신해 필요한 준비를 해 주었다는 문맥적 의미로 읽었습니다.
  alternative_readings:
  - 레위인들이 자기들을 위해 준비했다는 직역
  rationale: 엄밀한 재귀형은 가능하지만, 이 절의 직무 질서와 흐름을 고려하면 문지기들이 자리를 지키도록 레위인들이 준비를 맡았다는 뜻이 더 분명합니다.
  doctrine_reference: '번역 원칙: स्रोत 문맥 우선, 필요 시 문자적 난점을 주해로 보존'
