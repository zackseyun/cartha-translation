  source_fidelity: 대체로 충실합니다. θυρωροί와 각 문에 배치된 상황, 그리고 정해진 봉사 차례를 벗어날 수 없다는 뜻을 잘 전달합니다. 다만 ἡτοίμασαν ἑαυτοῖς는 문법상 ‘자기들을 위해 준비하였다’이며, 본문의 ‘그들을 위해’는 문맥에 따른 해석입니다. 이 해석은 영어 POB의 처리와 부합하지만, 주석에서 그 불확실성을 ‘자연스럽습니다’라고 단정하기보다 가능성으로 표현하는 편이 원문 충실성에 더 맞습니다.
  naturalness: ‘각 문마다 있었으며’와 ‘직무를 떠날 수 없었습니다’도 이해되지만, 문지기의 배치와 정해진 근무·봉사 차례라는 문맥에서는 ‘각 문에 배치되어 있었고’ 및 ‘정해진 직무를 벗어날 수 없었습니다’가 더 자연스럽고 정확합니다.
  terminology: ‘문지기들’과 ‘레위인들’은 적절합니다. ἐφημερία의 공식적이고 정해진 봉사 차례의 의미는 ‘정해진 직무’로 자연스럽게 나타낼 수 있습니다. 재귀대명사의 문자적 의미는 각주에서 유지해야 합니다.
