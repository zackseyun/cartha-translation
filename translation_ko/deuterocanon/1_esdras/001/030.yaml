base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/030.yaml
  text: And throughout all Judea they mourned for Josiah[a]; and Jeremiah the prophet lamented over Josiah, and the leaders together with the women kept lamenting him to this day[b]; and this was ordained to be done forever.
  footnotes:
  - marker: a
    text: Or 'this was decreed to be done continually' or 'this was established as a perpetual custom.' The Greek wording suggests a formally established ongoing practice, but the exact administrative nuance of the verb is not fully explicit.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew parallel in 2 Chronicles 35:24–25 mentions all Judah and Jerusalem mourning Josiah and Jeremiah chanting a lament for him; 1 Esdras here expands the description with leaders and women lamenting 'to this day.'
    reason: cross_reference
translation:
  language: ko
  text: 온 유대가 요시야를 애도하였습니다. 예언자 예레미야는 요시야를 두고 애가를 불렀고, 지도자들은 여인들과 함께 오늘에 이르기까지 그를 위해 계속 애가를 불렀습니다[b]. 이 일은 영원히 행하도록 공포되었습니다[a].
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 또는 ‘계속 행하도록 정해졌습니다’, ‘영구한 관례로 확립되었습니다’. 그리스어는 지속적 관행이 공식적으로 설정되었음을 시사하지만, 정확한 행정적 뉘앙스는 분명하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 평행본문인 역대하 35:24–25는 온 유다와 예루살렘이 요시야를 애도했고 예레미야가 요시야를 위해 애가를 지었다고 말합니다. 1 에스드라서는 지도자들과 여인들이 ‘오늘에 이르기까지’ 애가를 불렀다고 덧붙입니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν ὅλῃ τῇ Ἰουδαίᾳ
  english_pob_choice: throughout all Judea
  chosen_korean: 온 유대에서
  alternatives_korean:
  - 유대 전역에서
  - 유대 전체에서
  lexicon: LSJ
  rationale: 전면적 범위를 자연스러운 현대 한국어로 옮기되, ὅλῃ의 포괄성을 살려 지역 전체를 뜻하는 표현으로 번역했습니다.
- source_word: ἐπένθησαν
  english_pob_choice: they mourned
  chosen_korean: 애도하였습니다
  alternatives_korean:
  - 슬퍼하였습니다
  - 애곡하였습니다
  lexicon: LSJ
  rationale: 죽음을 두고 하는 공동체적 mourning을 나타내므로 ‘애도하다’가 가장 정확하며, 뒤의 θρηνέω와도 의미를 구별할 수 있습니다.
- source_word: ἐθρήνησεν / ἐθρηνοῦσαν
  english_pob_choice: lamented / kept lamenting
  chosen_korean: 슬퍼하였으며 / 계속 애도하였습니다
  alternatives_korean:
  - 애곡하였으며 / 계속 탄식하였습니다
  - 곡하였으며 / 계속 곡하였습니다
  lexicon: LSJ
  rationale: θρηνέω의 ‘애가를 하다, 곡하다’ 뉘앙스를 살리되 한국어 독자가 읽기 자연스럽게 하면서, 미완료의 지속성을 ‘계속’으로 표현했습니다.
- source_word: οἱ προκαθήμενοι
  english_pob_choice: the leaders
  chosen_korean: 지도자들
  alternatives_korean:
  - 으뜸된 사람들
  - 우두머리들
  - 대표자들
  lexicon: LSJ
  rationale: 문맥상 앞선 사람들, 유력자들을 가리키므로 직분을 과도하게 특정하지 않는 ‘지도자들’이 적절합니다.
- source_word: σὺν γυναιξὶν
  english_pob_choice: together with the women
  chosen_korean: 여자들과 함께
  alternatives_korean:
  - 여인들과 함께
  - 여성들과 함께
  lexicon: LSJ
  rationale: 동반 관계를 분명히 하면서도 현대 한국어에서 가장 직접적인 표현으로 옮겼습니다.
- source_word: ἕως τῆς ἡμέρας ταύτης
  english_pob_choice: to this day
  chosen_korean: 오늘에 이르기까지
  alternatives_korean:
  - 이 날까지
  - 지금까지
  lexicon: LSJ
  rationale: 현재 시점까지 이어지는 관용구를 자연스럽게 재현했습니다.
- source_word: ἐξεδόθη τοῦτο γενέσθαι ἀεί
  english_pob_choice: this was ordained to be done forever
  chosen_korean: 이것은 영원히 그렇게 하도록 정해졌습니다
  alternatives_korean:
  - 이것은 영구한 관례로 정해졌습니다
  - 이것은 계속되도록 선포되었습니다
  lexicon: LSJ
  rationale: ἐξεδόθη의 공적·공식적 성격을 살리면서도, 정확한 행정적 뉘앙스를 과도하게 단정하지 않도록 ‘정해졌습니다’로 번역했습니다.
theological_decisions:
- issue: 1절 끝의 지속적 애도 관행의 성격
  chosen_reading: ‘영원히 그렇게 하도록 정해졌습니다’로 번역해, 공적으로 확립된 지속 관행임을 드러내되 법령의 세부 성격은 단정하지 않았습니다.
  alternative_readings:
  - 영원한 율례로 정해졌습니다
  - 계속 행하도록 명령되었습니다
  rationale: 그리스어는 어떤 형태의 공식적 설정을 시사하지만, 제정 주체나 법적 성격을 구체화하지 않습니다. 따라서 텍스트가 보장하는 범위 안에서만 엄숙함을 보존했습니다.
  doctrine_reference: 본문이 말하는 관행의 지속성과 공적 설정을 보존하고, 과도한 제도적·교리적 해석을 피함
