base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/028.yaml
  text: They kill and are killed[a], and they do not disobey the king’s word; and if they are victorious, they bring everything to the king[b], and whatever else they plunder.
  footnotes:
  - marker: a
    text: Or, more formally, 'if they are victorious.'
    reason: lexical_alternative
  - marker: b
    text: The Greek literally says 'the king’s word,' an idiom meaning his command or order.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 죽이고 죽임을 당하며, 왕의 말씀을 어기지 않습니다. 그러나 승리하면 왕에게 모든 것을 가져오고, 또 그 밖에 탈취한 것과 나머지 모든 것도 가져옵니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 νικήσωσιν은 ‘승리하면’이라는 뜻으로도 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘왕의 말씀’은 여기서 왕의 명령 또는 지시를 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: φονεύουσιν
  english_pob_choice: they kill
  chosen_korean: 죽이고
  alternatives_korean:
  - 살해하고
  - 죽이며
  lexicon: BDAG
  rationale: 군사적 문맥에서 단순한 ‘죽이다’가 가장 자연스럽고, ‘살해하다’는 법적·도덕적 뉘앙스가 강합니다.
- source_word: φονεύονται
  english_pob_choice: are killed
  chosen_korean: 죽임을 당하며
  alternatives_korean:
  - 죽습니다
  - 살해당하며
  lexicon: BDAG
  rationale: 앞의 능동형과 대응되는 수동형을 살리면서, 현대 한국어에서 자연스러운 수동 표현으로 옮겼습니다.
- source_word: λόγον
  english_pob_choice: word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 명령
  lexicon: BDAG
  rationale: 여기서는 왕의 명령을 뜻하는 관용구이므로, POB의 영어 ‘word’를 반영하되 한국어에서는 문맥상 ‘말씀’이 가장 간결하고 자연스럽습니다.
- source_word: τῷ βασιλεῖ κομίζουσιν πάντα
  english_pob_choice: they bring everything to the king
  chosen_korean: 왕에게 모든 것을 가져오고
  alternatives_korean:
  - 왕에게 모두 바치고
  - 왕에게 전부 가져오고
  lexicon: BDAG
  rationale: κομίζω의 기본 의미인 ‘가져오다’를 유지해 전리품을 왕에게 운반해 오는 장면을 분명히 했습니다.
theological_decisions:
- issue: 왕의 말씀을 어기지 않는다는 표현의 성격
  chosen_reading: 이 구절은 신학적 교훈보다 왕권에 대한 군사적 충성의 묘사로 읽었습니다.
  alternative_readings:
  - 도덕적 순종의 일반 원리로 읽기
  - 종교적 순종의 모범으로 확장하기
  rationale: 본문은 전쟁 수행과 전리품 귀속을 설명하는 역사적·서사적 문맥에 있으므로, 의미를 과도하게 일반화하지 않았습니다.
  doctrine_reference: 문맥 우선 원칙
