base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/044.yaml
  text: and with the woman he gives up his life[b][a], and remembers neither father nor mother nor homeland.
  footnotes:
  - marker: a
    text: Or 'he leaves his soul' / 'he abandons himself.' The Greek says literally 'he gives up the life/soul,' using ψυχή in a broad sense that can mean life, self, or soul depending on context.
    reason: lexical_alternative
  - marker: b
    text: '''Woman'' could also be rendered ''wife,'' since Greek γυνή can mean either depending on context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 여인과 함께 그는 자기 생명을 버리고, 아버지도 어머니도 고향도 기억하지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 자기 혼을 버립니다’ 또는 ‘그는 자신을 버립니다.’ 그리스어는 ψυχή를 문자적으로 ‘생명/혼’을 뜻하게 쓰며, 문맥에 따라 생명, 자기, 혼을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘여인’은 문맥에 따라 ‘아내’로도 옮길 수 있습니다. 그리스어 γυνή는 둘 다 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ τῆς γυναικός
  english_pob_choice: with the woman
  chosen_korean: 그 여인과 함께
  alternatives_korean:
  - 그 여자와 함께
  - 그 아내와 함께
  - 그 여인 때문에
  lexicon: LSJ
  rationale: μετά + 속격은 기본적으로 ‘~와 함께’의 뜻이므로, 동반 관계를 살려 자연스럽게 옮겼습니다. γυνή는 문맥상 ‘여인/여자’ 모두 가능하지만, 여기서는 일반적 인물을 가리키는 말로 읽어 ‘여인’이 가장 무난합니다.
- source_word: ἀφίησι τὴν ψυχήν
  english_pob_choice: gives up his life
  chosen_korean: 자기 생명을 버리고
  alternatives_korean:
  - 자기 혼을 버리고
  - 자기 목숨을 내버리고
  - 자기 생명을 내어주고
  lexicon: BDAG
  rationale: ἀφίημι와 ψυχή의 결합은 문자적으로 ‘생명을/혼을 내어놓다’에 가깝지만, 문맥상 과도한 영혼-육체 구분보다 ‘생명을 버리다’가 가장 직접적입니다. ‘자기’는 ελλην어에 없지만, 자연스러운 한국어로 주체를 분명히 했습니다.
- source_word: μέμνηται
  english_pob_choice: remembers
  chosen_korean: 기억하지 않습니다
  alternatives_korean:
  - 생각하지 않습니다
  - 염두에 두지 않습니다
  - 마음에 두지 않습니다
  lexicon: BDAG
  rationale: μέμνηται는 ‘기억하다/염두에 두다’의 뜻이므로, 반복되는 οὔτε 구조를 살려 평이한 ‘기억하지 않습니다’로 옮겼습니다.
- source_word: χώραν
  english_pob_choice: homeland
  chosen_korean: 고향
  alternatives_korean:
  - 나라
  - 조국
  - 본토
  lexicon: LSJ
  rationale: 이 목록은 아버지, 어머니와 나란히 놓인 개인적 귀속의 대상들이므로, 넓은 국가 개념보다 ‘고향’이 더 자연스럽고 친밀한 대응입니다. 다만 ‘homeland’의 개인적 애착을 살리기 위해 공적 색채가 강한 ‘조국’은 피했습니다.
theological_decisions:
- issue: ψυχή의 범위(생명/혼/자기)
  chosen_reading: ‘생명’으로 옮겨, 이 표현이 영혼론이 아니라 자기희생과 집착의 강도를 말한다는 점을 드러냈습니다.
  alternative_readings:
  - 혼
  - 자기
  - 목숨
  rationale: 문맥은 사랑의 강도가 사람을 어떻게 사로잡는지를 말하며, 헬라어 ψυχή는 여기서 ‘생명/자기’까지 포괄할 수 있습니다. ‘생명’은 본문이 지시하는 위험과 헌신을 가장 분명하게 전달합니다.
  doctrine_reference: lexical_semantics
