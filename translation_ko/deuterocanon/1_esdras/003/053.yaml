  - marker: b
    text: The Greek verb can specifically suggest a slap or blow with the hand; 'would strike' is chosen as the broader English rendering.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그녀는 왕의 머리에서 왕관[a]을 벗겨 자기 머리에 쓰고, 왼손으로 왕을 때렸습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 διάδημα는 왕실의 관을 뜻합니다. 더 격식 있게는 ‘디아뎀’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 헬라어 ἐράπιζεν은 손으로 치는 것을 가리키며, 문맥에 따라 따귀를 때리는 뜻일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ διάδημα
  english_pob_choice: the crown
  chosen_korean: 관
  alternatives_korean:
  - 왕관
  - 디아뎀
  - 머리띠
  lexicon: LSJ
  rationale: διάδημα는 왕권을 나타내는 왕의 장식물로, 한국어에서는 가장 자연스럽고 널리 이해되는 ‘관’이 본문의 의미를 잘 전달합니다. '디아뎀'은 학술적이지만 독자성은 떨어집니다.
- source_word: ἀφαιροῦσαν ... ἀπὸ τῆς κεφαλῆς
  english_pob_choice: would take ... from
  chosen_korean: '...에서 벗겨'
  alternatives_korean:
  - '...에서 빼앗아'
  - '...에서 제거하여'
  - '...에서 벗기며'
  lexicon: LSJ
  rationale: 머리에서 왕관을 ‘떼어 내는’ 동작을 한국어 동사 ‘벗겨’로 자연스럽게 옮겨, 반복적·서술적 흐름을 살렸습니다.
- source_word: ἐπιτιθοῦσαν αὐτῇ
  english_pob_choice: put it on herself
  chosen_korean: 자기에게 씌우고
  alternatives_korean:
  - 자기 머리에 얹고
  - 자기에게 두르고
  - 자기에게 올려놓고
  lexicon: LSJ
  rationale: 대명사 αὐτῇ는 여인 자신을 가리키므로, 왕관을 ‘자기에게 씌우다’가 한국어로 가장 자연스럽고 자기-착용의 뜻을 분명히 드러냅니다.
- source_word: ἐράπιζεν τὸν βασιλέα τῇ ἀριστερᾷ
  english_pob_choice: would strike ... with her left hand
  chosen_korean: 왼손으로 왕을 때렸습니다
  alternatives_korean:
  - 왼손으로 왕을 쳤습니다
  - 왼손으로 왕의 뺨을 때렸습니다
  - 왼손으로 왕에게 손찌검했습니다
  lexicon: LSJ
  rationale: ῥαπίζω는 손으로 치는 행위를 뜻하므로, 구체성을 과하게 좁히지 않는 ‘때렸습니다’가 적절합니다. τῇ ἀριστερᾷ는 문맥상 왼손을 뜻하므로 이를 보완해 옮겼습니다.
