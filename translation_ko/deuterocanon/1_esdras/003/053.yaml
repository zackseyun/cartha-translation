base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/053.yaml
  text: and she would take the crown from the king’s head and put it on herself[b][a], and she would strike the king with her left hand.
  footnotes:
  - marker: a
    text: Or, more formally, 'the diadem' instead of 'the crown.'
    reason: lexical_alternative
  - marker: b
    text: The Greek verb can specifically suggest a slap or blow with the hand; 'would strike' is chosen as the broader English rendering.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그녀는 왕의 머리에서 관을 벗겨 자기에게 씌우고, 또 왼손으로 왕을 때렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 διάδημα는 왕관보다 더 정확히는 ‘디아뎀’ 또는 왕의 관을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ἐράπιζεν은 단순히 ‘때리다’보다 손으로 치는, 때로는 따귀를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ διάδημα
  english_pob_choice: the crown
  chosen_korean: 관
  alternatives_korean:
  - 왕관
  - 디아뎀
  - 머리띠
  lexicon: LSJ
  rationale: διάδημα는 왕권을 나타내는 왕의 장식물로, 한국어에서는 가장 자연스럽고 널리 이해되는 ‘관’이 본문의 의미를 잘 전달합니다. '디아뎀'은 학술적이지만 독자성은 떨어집니다.
- source_word: ἀφαιροῦσαν ... ἀπὸ τῆς κεφαλῆς
  english_pob_choice: would take ... from
  chosen_korean: '...에서 벗겨'
  alternatives_korean:
  - '...에서 빼앗아'
  - '...에서 제거하여'
  - '...에서 벗기며'
  lexicon: LSJ
  rationale: 머리에서 왕관을 ‘떼어 내는’ 동작을 한국어 동사 ‘벗겨’로 자연스럽게 옮겨, 반복적·서술적 흐름을 살렸습니다.
- source_word: ἐπιτιθοῦσαν αὐτῇ
  english_pob_choice: put it on herself
  chosen_korean: 자기에게 씌우고
  alternatives_korean:
  - 자기 머리에 얹고
  - 자기에게 두르고
  - 자기에게 올려놓고
  lexicon: LSJ
  rationale: 대명사 αὐτῇ는 여인 자신을 가리키므로, 왕관을 ‘자기에게 씌우다’가 한국어로 가장 자연스럽고 자기-착용의 뜻을 분명히 드러냅니다.
- source_word: ἐράπιζεν τὸν βασιλέα τῇ ἀριστερᾷ
  english_pob_choice: would strike ... with her left hand
  chosen_korean: 왼손으로 왕을 때렸습니다
  alternatives_korean:
  - 왼손으로 왕을 쳤습니다
  - 왼손으로 왕의 뺨을 때렸습니다
  - 왼손으로 왕에게 손찌검했습니다
  lexicon: LSJ
  rationale: ῥαπίζω는 손으로 치는 행위를 뜻하므로, 구체성을 과하게 좁히지 않는 ‘때렸습니다’가 적절합니다. τῇ ἀριστερᾷ는 문맥상 왼손을 뜻하므로 이를 보완해 옮겼습니다.
theological_decisions:
- issue: 반복적 서술의 처리
  chosen_reading: ‘그리고 ... 그리고 ...’로 이어지는 단순 병렬을 유지했습니다.
  alternative_readings:
  - ‘또한 ... 또한 ...’
  - ‘그러고 나서 ... 그리고 ...’
  rationale: 그리스어의 καὶ ... καὶ 연결을 과도하게 해설하지 않고, 장면의 연속 동작을 있는 그대로 드러내는 것이 더 충실합니다.
  doctrine_reference: source narratology
