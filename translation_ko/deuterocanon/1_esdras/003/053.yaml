  source_fidelity: 핵심 동작과 행위자는 정확합니다. 다만 διάδημα의 왕실적 의미를 본문에서 ‘왕관’으로 더 분명히 하고, αὐτῇ가 가리키는 자기 착용을 자연스러운 한국어로 ‘자기 머리에 쓰고’로 옮기는 편이 좋습니다. ῥαπίζω는 손으로 치는 행위를 가리키며, ‘때렸습니다’는 과도하게 구체화하지 않는 적절한 번역입니다.
  naturalness: ‘관을 벗겨 자기에게 씌우고’도 이해되지만, 왕관의 착용에는 ‘자기 머리에 쓰고’가 현대 표준 한국어에서 더 자연스럽습니다. 각주 표지는 해당 낱말 또는 동작 바로 뒤에 두는 것이 독자의 이해에 명확합니다.
