  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 κολακεύει는 단순히 달래는 것보다 상대의 환심을 얻기 위해 아첨하는 행위를 뜻하므로, 「구슬려」는 의미를 다소 약화합니다. 또한 본문의 현재형 반복은 한국어에서도 현재형으로 일관되게 옮기는 편이 적절합니다.
