  yaml_path: translation/deuterocanon/1_esdras/003/054.yaml
  text: And besides this[a], the king stared at her with his mouth open; and if she laughs at him, he laughs; but if she becomes angry with him, he flatters her so that she may be reconciled to him.
  footnotes:
  - marker: a
    text: Or, 'if she laughs with him, he laughs.' The Greek dative after 'laughs' can be understood in more than one relational sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 더 나아가 왕은 입을 벌린 채 그녀를 응시합니다. 그녀가 그를 보고 웃으면 그도 웃습니다. 그러나 그녀가 그에게 화를 내면, 그는 그녀에게 아첨하여 그녀가 그와 화해하게 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그를 보고 웃으면’은 ‘그와 함께 웃으면’으로도 이해될 수 있습니다. 그리스어 여격은 이 관계를 둘 이상의 방식으로 이해할 여지를 남깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς τούτοις
  english_pob_choice: besides this
  chosen_korean: 그리고 이 밖에도
  alternatives_korean:
  - 더하여
  - 이 외에도
  lexicon: LSJ
  rationale: 추가 정보를 덧붙이는 연결어이므로, 앞뒤 흐름을 자연스럽게 잇는 「그리고 이 밖에도」로 옮겼습니다.
- source_word: χάσκων τὸ στόμα ἐθεώρει αὐτήν
  english_pob_choice: stared at her with his mouth open
  chosen_korean: 입을 벌린 채 그녀를 바라보았으며
  alternatives_korean:
  - 입을 벌리고 그녀를 응시했으며
  - 입을 벌린 채 그녀를 지켜보았으며
  lexicon: LSJ
  rationale: 입이 벌어진 채라는 시각적 이미지를 살리면서, ἐθεώρει의 지속적인 주시를 「바라보았으며」로 자연스럽게 표현했습니다.
- source_word: ἐὰν γελάσῃ αὐτῷ, γελᾷ
  english_pob_choice: if she laughs at him, he laughs
  chosen_korean: 그녀가 그에게 웃으면 그도 웃습니다
  alternatives_korean:
  - 그녀가 그를 비웃으면 그도 웃습니다
  - 그녀가 그와 함께 웃으면 그도 웃습니다
  lexicon: LSJ
  rationale: αὐτῷ의 관계를 영어 POB처럼 열어 두되, 한국어에서는 관계를 과도하게 특정하지 않도록 「그에게 웃으면」으로 처리했습니다.
- source_word: κολακεύει
  english_pob_choice: flatters her
  chosen_korean: 그는 그녀를 구슬려
  alternatives_korean:
  - 그는 그녀를 아첨하여
  - 그는 그녀를 달래어
  lexicon: LSJ
  rationale: 관계를 회복시키려는 의도적 달램을 담아, 직역적이지만 현대 한국어에서 자연스러운 「구슬려」를 택했습니다.
- source_word: ὅπως διαλλαγῇ αὐτῷ
  english_pob_choice: so that she may be reconciled to him
  chosen_korean: 그에게 화해하게 하였습니다
  alternatives_korean:
  - 그와 화해하게 하였습니다
  - 그와 다시 사이가 좋아지게 하였습니다
  lexicon: LSJ
  rationale: διαλλαγῇ의 관계 회복 의미를 살려, 최종 목적을 분명히 드러내는 「화해하게 하였습니다」로 옮겼습니다.
theological_decisions:
- issue: 왕과 그녀 사이의 상호 반응을 드러내는 동사 반복
  chosen_reading: 웃음과 분노, 그리고 화해의 동작을 반복 구조로 그대로 살렸습니다.
  alternative_readings:
  - 의미를 풀어 「기분을 맞추었습니다」로 완화할 수 있음
  - 동사 반복을 줄여 더 매끈하게 만들 수 있음
  rationale: 본문은 왕이 그녀의 반응에 맞추어 즉각적으로 반응하는 장면을 묘사하므로, 반복을 줄이면 긴장감과 대비가 약해집니다.
  doctrine_reference: source-sensitive narrative fidelity
