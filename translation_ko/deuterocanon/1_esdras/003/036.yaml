  source_fidelity: 본문의 핵심 구문은 대체로 충실합니다. 다만 현 각주는 그리스어 이름을 잘못하여 ‘μορφή’라고 제시하므로 원문 Ζοροβαβέλ 및 각주 목적에 맞지 않습니다. 본문에서는 문맥상 ‘세 번째 사람’이라는 보충은 가능하지만, 원문의 식별 삽입구를 더 매끄럽고 직접적으로 반영하도록 다듬는 것이 안전합니다.
  naturalness: ‘바로 조로바벨이었으며, 말하기를 시작했습니다’는 문법상 가능하나 연결이 다소 무겁습니다. ‘곧 조로바벨이 말하기 시작했습니다’가 현대 표준어 합쇼체 서술에서 더 자연스럽습니다.
