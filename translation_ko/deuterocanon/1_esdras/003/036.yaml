    rationale: 원문 인명은 Ζοροβαβέλ이며, μορφή는 이 구절에 없고 ‘형태’ 등을 뜻하는 별개의 그리스어입니다. 따라서 현 각주는 사실과 맞지 않아 반드시 수정해야 합니다.
