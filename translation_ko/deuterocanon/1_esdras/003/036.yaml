translation:
  language: ko
  text: 그러나 여자들과 진리에 대해 말한 세 번째 사람은 바로 조로바벨이었으며, 말하기를 시작했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 이름 μορφή를 따라 옮긴 ‘조로바벨’은 더 익숙한 영어형 ‘제루바벨/스룹바벨’에 해당합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ δὲ τρίτος
  english_pob_choice: But the third
  chosen_korean: 그러나 … 세 번째 사람은
  alternatives_korean:
  - 그리고 세 번째는
  - 그런데 세 번째는
  lexicon: LSJ
  rationale: δέ의 대조를 살려 ‘그러나’로 옮기고, τρίτος는 문맥상 인물을 가리키므로 ‘세 번째 사람은’으로 자연스럽게 처리했습니다.
- source_word: ὁ εἴπας περὶ τῶν γυναικῶν καὶ τῆς ἀληθείας
  english_pob_choice: the one who spoke about women and about the truth
  chosen_korean: 여자들과 진리에 대해 말한
  alternatives_korean:
  - 여자들과 진리에 관해 말한
  - 여자들과 진실에 대해 말한
  lexicon: BDAG
  rationale: περὶ + 속격의 반복 구조를 살려 ‘~에 대해’로 대응했고, ἀλήθεια는 여기서 일반적 의미의 ‘진리’가 가장 직접적입니다.
- source_word: οὗτός ἐστιν Ζοροβαβέλ
  english_pob_choice: this was Zorobabel
  chosen_korean: 바로 조로바벨이었으며
  alternatives_korean:
  - 그는 조로바벨이었습니다
  - 바로 조로바벨입니다
  lexicon: BDAG
  rationale: 서술의 흐름상 과거형이 자연스럽고, ἐστιν의 확인·식별 기능은 ‘바로’로 살렸습니다. Ζοροβαβέλ은 그리스어 형태를 반영해 조로바벨로 음역했습니다.
- source_word: ἤρξατο λαλεῖν
  english_pob_choice: began to speak
  chosen_korean: 말하기를 시작했습니다
  alternatives_korean:
  - 말하기 시작했습니다
  - 말하기 시작하였습니다
  lexicon: BDAG
  rationale: ἄρχομαι + 부정사의 개시 용법을 표준적인 한국어로 옮겼습니다.
theological_decisions:
- issue: 인물 식별문에서의 현재형 ἐστιν 처리
  chosen_reading: 과거 서술문 안에서 현재형의 식별 기능을 살려 ‘~이었습니다’로 옮겼습니다.
  alternative_readings:
  - ‘~입니다’로 현재형을 살리는 번역
  - ‘~이었습니다’와 ‘~입니다’를 혼합한 번역
  rationale: 이 구절은 연속된 이야기 흐름 속의 삽입적 식별이므로, 한국어에서는 과거 시제로 정리하는 편이 의미를 더 분명하게 전달합니다.
  doctrine_reference: 문법-담화상의 선택
