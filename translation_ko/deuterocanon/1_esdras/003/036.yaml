    rationale: οὗτός ἐστιν Ζοροβαβέλ의 식별 기능은 ‘곧 조로바벨’로 자연스럽게 옮길 수 있으며, 이어지는 ἤρξατο λαλεῖν의 주어도 명확해집니다.
  revised_text: 그러나 여자들과 진리에 대해 말한 세 번째 사람, 곧 조로바벨[a]이 말하기 시작했습니다.
