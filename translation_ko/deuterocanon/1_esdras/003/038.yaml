lexical_decisions:
- source_word: αἱ γυναῖκες
  english_pob_choice: Women
  chosen_korean: 여인들은
  alternatives_korean:
  - 여자들은
  - 여성들은
  lexicon: γυνή
  rationale: 일반적 성별 지칭이지만, 문맥상 출생 주체를 강조하는 자연스러운 표준어로 ‘여인들’을 택했습니다.
- source_word: ἐγέννησαν
  english_pob_choice: gave birth
  chosen_korean: 낳습니다
  alternatives_korean:
  - 출산했습니다
  - 낳았습니다
  lexicon: γεννάω
  rationale: 출산의 직접성을 유지하면서도 현대 한국어에서 가장 자연스럽고 간결한 동사로 옮겼습니다.
- source_word: τὸν βασιλέα
  english_pob_choice: the king
  chosen_korean: 왕
  alternatives_korean:
  - 임금
  - 왕님
  lexicon: βασιλεύς
  rationale: 통치자를 가리키는 기본 의미를 직역하되, 현대 독자가 이해하기 쉬운 ‘왕’을 사용했습니다.
- source_word: κυριεύει
  english_pob_choice: rule over
  chosen_korean: 다스리는
  alternatives_korean:
  - 지배하는
  - 통치하는
  lexicon: κυριεύω
  rationale: 지배권 행사를 뜻하는 동사를 한국어에서 가장 무리 없이 드러내는 ‘다스리다’로 옮겼습니다.
theological_decisions:
- issue: “sea and land”의 범위 표현
  chosen_reading: ‘바다와 땅’으로 간단히 옮겨, 통치 범위의 총체성을 유지했습니다.
  alternative_readings:
  - ‘바다와 육지’
  - ‘바다와 땅 위의 모든 것’
  rationale: 영어 POB도 관사 없이 압축적으로 제시하므로, 원문의 총체적 범위를 과장 없이 전달하는 간결한 표현을 택했습니다.
