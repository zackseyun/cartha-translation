base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/037.yaml
  text: Men[a], is not the king great, and are not men many, and does not wine have strength? Who then is the one who rules over them[b], or who is the one who has mastery over them? Is it not women?
  footnotes:
  - marker: a
    text: Or, 'and is not wine strong?' The Greek verb can be rendered more directly as 'is strong' rather than 'has strength.'
    reason: lexical_alternative
  - marker: b
    text: The Greek uses 'men' here because the argument contrasts men with women in the following clause; a more generic 'people' is possible lexically but less fitting in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 남자 여러분, 왕이 위대하지 않습니까? 남자들도 많고 포도주도 힘이 있지 않습니까? 그러면 그들을 지배하는 이는 누구이며, 그들 위에 군림하는 이는 누구입니까? 여자들이 아닙니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνδρες
  english_pob_choice: Men
  chosen_korean: 사람들아
  alternatives_korean:
  - 남자들아
  - 여러분
  lexicon: LSJ
  rationale: 원문은 남성 복수 호격이지만, 한국어에서는 호격으로 직접 부르면서도 고정된 성별 호칭을 덜 어색하게 살리기 위해 ‘사람들아’로 옮겼습니다. 뒤의 γυναῖκες와의 대조는 본문 끝에서 유지됩니다.
- source_word: μέγας
  english_pob_choice: great
  chosen_korean: 크지
  alternatives_korean:
  - 위대하지
  - 대단하지
  lexicon: LSJ
  rationale: 왕의 위상을 묻는 수사적 질문이므로 과장되지 않은 기본형 ‘크다’가 가장 सीधे하고 자연스럽습니다.
- source_word: ἰσχύει
  english_pob_choice: has strength
  chosen_korean: 힘이 있지 않느냐
  alternatives_korean:
  - 강하지 않느냐
  - 세지 않느냐
  lexicon: LSJ
  rationale: 동사는 ‘강하다/힘이 있다’의 의미를 가지며, 한국어에서는 포도주의 작용을 말할 때 ‘힘이 있다’가 가장 직설적입니다. 영어 POB의 lexical note도 이 방향을 지지합니다.
- source_word: δεσπόζων
  english_pob_choice: the one who rules over
  chosen_korean: 지배하는 이
  alternatives_korean:
  - 다스리는 이
  - 주관하는 이
  lexicon: LSJ
  rationale: δεσπόζω의 지배/통치 뉘앙스를 살리되, 너무 경직된 종교어를 피하고 본문의 논쟁적 수사에 맞는 ‘지배하다’를 택했습니다.
- source_word: κυριεύων
  english_pob_choice: the one who has mastery over
  chosen_korean: 권세를 부리는 이
  alternatives_korean:
  - 주권을 행사하는 이
  - 지배하는 이
  lexicon: LSJ
  rationale: δεσπόζων과 완전히 같게 처리하지 않고, 영어 POB가 구분한 대로 약간 다른 표현을 사용해 병렬 강조를 살렸습니다. 한국어에서는 ‘권세를 부리다’가 mastery의 강한 지배성을 전달합니다.
- source_word: γυναῖκες
  english_pob_choice: women
  chosen_korean: 여자들이 아니냐
  alternatives_korean:
  - 여인들이 아니냐
  - 아내들이 아니냐
  lexicon: LSJ
  rationale: 문맥상 남자들과 대조되는 일반 명사로 ‘여자들’이 가장 직접적입니다. ‘아내들’은 근거가 약해 배제했습니다.
theological_decisions:
- issue: 남녀 대조의 수사 유지
  chosen_reading: Ἄνδρες와 γυναῖκες의 성별 대조를 드러내면서도 한국어 호격은 자연화했습니다.
  alternative_readings:
  - ‘남자들아’로 직역
  - ‘여러분’으로 중립화
  rationale: 본문은 남성과 여성을 대비시키는 수사적 논증이므로 중립화하면 논리의 날이 무뎌집니다. 다만 한국어 호격에서는 어색함을 줄이기 위해 첫 호칭만 자연스럽게 처리했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: 왕/남자들/포도주의 병렬 질문 구조
  chosen_reading: 세 개의 질문을 모두 유지하고, 마지막 결론도 질문형으로 보존했습니다.
  alternative_readings:
  - 서술문으로 재구성
  - 의미를 풀어 설명
  rationale: 원문은 짧은 수사적 질문들의 연쇄로 구성되어 있습니다. 이를 설명문으로 바꾸면 원문의 논쟁적 힘이 약해지므로 질문 구조를 그대로 살렸습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 5
