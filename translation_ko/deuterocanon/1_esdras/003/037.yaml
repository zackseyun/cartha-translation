  source_fidelity: 첫 절의 ‘왕은 크지 않으며’는 그리스어의 부정 의문문 οὐ μέγας …;를 평서 부정으로 바꾸어, ‘왕이 위대하지 않다’는 반대 의미를 낳습니다. 또한 Ἄνδρες와 이어지는 ἄνθρωποι 및 γυναῖκες의 수사적 남녀 대조는 한국어에서도 유지하는 편이 원문에 충실합니다.
  naturalness: 합쇼체의 연속된 수사 의문문으로 다듬었습니다. ‘권세를 부리는 이’도 가능하나, 여기서는 ‘군림하는 이’가 κυριεύων의 지배·주권 행사를 자연스럽고 간결하게 나타냅니다.
  terminology: Ἄνδρες는 ‘남자 여러분’으로, ἄνθρωποι는 문맥상 ‘남자들’로, γυναῖκες는 ‘여자들’로 옮겼습니다. δεσπόζων/κυριεύων의 근접 병렬은 ‘지배하다/군림하다’로 구별하되 과도한 신학적 함의를 부여하지 않았습니다.
