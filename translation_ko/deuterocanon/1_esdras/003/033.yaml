base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/033.yaml
  text: and all his people and his forces obey him[a]. Besides this, he himself reclines and eats and drinks and sleeps[b];
  footnotes:
  - marker: a
    text: Or 'his armies' for 'his forces'; the Greek δυνάμεις can denote military forces in a royal context.
    reason: lexical_alternative
  - marker: b
    text: The verb translated 'reclines' can also be rendered 'rests' or 'lies down,' but the following 'eats and drinks' suggests the customary reclining posture at table.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그의 모든 백성과 그의 군대가 그에게 순종합니다. 이 밖에도 그는 스스로 기대어 앉아 먹고 마시고 잠니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 군대들’로도 옮길 수 있습니다. 헬라어 δυνάμεις는 왕권 문맥에서 군사력 또는 군대를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘스스로 기대어 앉아’는 식탁에서의 기대는 자세를 살린 번역입니다. 문맥상 단순한 ‘쉼’보다 ‘먹고 마시고’와 더 잘 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ λαὸς αὐτοῦ
  english_pob_choice: all his people
  chosen_korean: 그의 모든 백성
  alternatives_korean:
  - 그의 모든 사람들
  - 그의 모든 ժողովուրդ
  lexicon: LSJ
  rationale: λαός는 왕권 문맥에서 백성, 곧 통치 아래 있는 사람들을 가리키는 것이 자연스러워 ‘백성’으로 옮겼습니다.
- source_word: αἱ δυνάμεις αὐτοῦ
  english_pob_choice: his forces
  chosen_korean: 그의 군대
  alternatives_korean:
  - 그의 군사들
  - 그의 병력
  - 그의 힘들
  lexicon: LSJ
  rationale: δυνάμεις는 여기서 왕의 군사력/무력 집단을 뜻하므로, 한국어에서는 군사적 집합을 분명히 드러내는 ‘군대’가 가장 적절합니다.
- source_word: ἐνακούουσιν
  english_pob_choice: obey
  chosen_korean: 순종합니다
  alternatives_korean:
  - 듣습니다
  - 귀를 기울입니다
  - 복종합니다
  lexicon: LSJ
  rationale: 직역하면 ‘듣다’ 계열이지만, 문맥상 왕에게 복종하는 의미가 분명하므로 ‘순종합니다’로 풀어 의미를 분명히 했습니다.
- source_word: ἀνάκειται
  english_pob_choice: reclines
  chosen_korean: 스스로 기대어 앉아
  alternatives_korean:
  - 기대어 앉아
  - 드러누워
  - 쉬며
  lexicon: LSJ
  rationale: 다음의 ‘먹고 마시고’와 연결될 때 식탁에서의 기대어 앉는 자세를 가리키므로, 단순한 ‘쉰다’보다 자세를 보존하는 표현을 택했습니다.
theological_decisions:
- issue: 왕의 일상 묘사에서 ‘reclines’의 자세적 뉘앙스를 어떻게 살릴 것인가
  chosen_reading: ‘스스로 기대어 앉아’로 옮겨, 식사 자리에서의 표준적 자세를 드러냈습니다.
  alternative_readings:
  - ‘쉰다’로 일반화하기
  - ‘드러누워 있다’로 직설화하기
  rationale: 본문은 왕의 일상적 안락함과 식탁에서의 자세를 대비시키므로, 지나치게 일반화하거나 과격하게 바꾸지 않고 문맥상 자연스러운 자세 표현을 유지하는 것이 좋습니다.
  doctrine_reference: 해당 없음
