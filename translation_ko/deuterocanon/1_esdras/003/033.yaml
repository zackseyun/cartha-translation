  - 귀를 기울입니다
  - 복종합니다
  lexicon: LSJ
  rationale: 직역하면 ‘듣다’ 계열이지만, 문맥상 왕에게 복종하는 의미가 분명하므로 ‘순종합니다’로 풀어 의미를 분명히 했습니다.
- source_word: ἀνάκειται
