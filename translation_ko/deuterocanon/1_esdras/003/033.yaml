  rationale: δυνάμεις는 여기서 왕의 군사력/무력 집단을 뜻하므로, 한국어에서는 군사적 집합을 분명히 드러내는 ‘군대’가 가장 적절합니다.
- source_word: ἐνακούουσιν
  english_pob_choice: obey
  chosen_korean: 순종합니다
  alternatives_korean:
