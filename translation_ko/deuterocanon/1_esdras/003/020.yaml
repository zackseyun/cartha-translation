  yaml_path: translation/deuterocanon/1_esdras/003/020.yaml
  text: and it makes every heart rich[a], and it remembers neither king nor satrap; and it makes everything speak in terms of talents.
  footnotes:
  - marker: a
    text: Or, more dynamically, 'it makes everyone talk about money.' The Greek says literally 'it makes all/everything speak through talents,' with 'talents' referring to monetary units.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그것은 모든 마음을 부유하게[a] 만들며, 왕도 사트라프도 기억하지 않으며, 모두가 탈렌트로 말하게 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 의역하면, ‘모든 사람을 돈 이야기를 하게 만든다.’ 헬라어는 문자적으로 ‘모든 것/모든 이가 탈렌트를 통해 말하게 한다’는 뜻이며, 여기서 ‘탈렌트’는 화폐 단위를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάσας καρδίας
  english_pob_choice: every heart
  chosen_korean: 모든 마음
  alternatives_korean:
  - 모든 심장
  - 각 사람의 마음
  lexicon: LSJ
  rationale: καρδία는 감정만이 아니라 내면 전체를 가리키므로, 한국어에서도 ‘마음’으로 옮겨 그 비유를 살렸습니다. ‘모든’은 분배적 의미를 자연스럽게 드러냅니다.
- source_word: ποιεῖ πλουσίας
  english_pob_choice: makes ... rich
  chosen_korean: 부유하게 만들며
  alternatives_korean:
  - 풍요롭게 하며
  - 부자 되게 하며
  lexicon: LSJ
  rationale: 단순한 서술 동사구를 살리면서 경제적 이미지도 유지하기 위해 ‘부유하게 만들다’로 옮겼습니다.
- source_word: σατράπην
  english_pob_choice: satrap
  chosen_korean: 사트라프
  alternatives_korean:
  - 총독
  - 지방 총독
  lexicon: LSJ
  rationale: σατράπης는 페르시아 행정직명으로, 일반화하지 않고 음역하여 역사적 색채를 보존했습니다.
- source_word: διὰ ταλάντων
  english_pob_choice: in terms of talents
  chosen_korean: 탈렌트로
  alternatives_korean:
  - 재물로
  - 돈으로
  - 탈렌트 단위로
  lexicon: LSJ
  rationale: τάλαντον은 무게와 화폐 단위이므로, 본문이 말하는 화폐적 기준을 드러내기 위해 음역을 유지하되 한국어 조사로 자연스럽게 처리했습니다.
theological_decisions:
- issue: ‘does not remember’의 인격적 무관심 표현
  chosen_reading: ‘기억하지 않으며’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 돌보지 않으며
  - 마음에 두지 않으며
  rationale: 문맥상 무시/무관심의 뜻이지만, 헬라어 οὐ μέμνηται의 표면 의미를 보존해 독자가 수사적 과장을 그대로 감지하도록 했습니다.
  doctrine_reference: 문자적-수사적 보존 원칙
