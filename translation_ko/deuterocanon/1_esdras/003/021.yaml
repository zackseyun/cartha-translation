  text: 그리고 그들은 술을 마실 때 친구들과 형제들에게 애정을 보일 것을 기억하지 못하고, 얼마 지나지 않아 칼을 뽑습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 동사 μορφή는 단수이지만, 문맥상 일반적 복수 주어를 가리키는 것으로 보아 한국어에서는 복수로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: φιλάζειν은 여기서 '애정을 보이다'로 옮겼지만, 더 직역하면 '다정하게 대하다' 또는 드물게는 '입맞춤하다'의 뜻도 가능합니다.
    reason: lexical_alternative
