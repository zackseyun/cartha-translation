  text: and they do not remember[a], when they are drinking, to show affection to friends and brothers[b], and before long they draw swords.
  footnotes:
  - marker: a
    text: Or, more literally, 'he does not remember'; the Greek verb is singular, but the clause functions generically in context and is rendered with English 'they.'
    reason: lexical_alternative
  - marker: b
    text: The verb translated 'show affection' can also be understood more concretely as 'be affectionate toward' or, less likely here, 'kiss.'
    reason: lexical_alternative
