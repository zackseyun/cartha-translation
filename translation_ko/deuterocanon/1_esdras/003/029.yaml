base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/029.yaml
  text: And those who do not serve in the army or fight[a], but farm the land, again, when they sow, after reaping they bring tribute to the king; and by compelling one another[b], they bring the taxes to the king.
  footnotes:
  - marker: a
    text: Or 'present tribute to the king.' The verb 'bring' here carries the sense of delivering payment owed to a ruler.
    reason: lexical_alternative
  - marker: b
    text: Literally 'compelling one another.' The phrase likely describes mutual pressure to ensure the king's taxes are paid.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 군대에 복무하지도 않고 싸우지도 않으며 땅을 경작하는 이들은, 또한 씨를 뿌리고 수확한 뒤 왕에게 공물을 바칩니다[a]. 그리고 서로를 강제하면서[b] 왕에게 세금을 납부합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 첫 번째 절의 ἀναφέρουσιν은 단순히 ‘가져오다’보다 상급자에게 의무적으로 ‘바치다/납부하다’는 뜻을 띱니다.
    reason: lexical_alternative
  - marker: b
    text: ἕτερος τὸν ἕτερον ἀναγκάζοντες는 문자적으로 ‘서로를 강제하면서’입니다. 여기서는 공동체 내부의 상호 압박을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατεύονται
  english_pob_choice: serve in the army
  chosen_korean: 군역에 복무하다
  alternatives_korean:
  - 군대에 복무하다
  - 군사로 복무하다
  lexicon: LSJ
  rationale: 군사적 봉사를 뜻하는 동사를 현대 한국어로 자연스럽게 옮기되, 단순히 ‘전쟁하다’와 구별되도록 했습니다.
- source_word: πολεμοῦσιν
  english_pob_choice: fight
  chosen_korean: 싸우다
  alternatives_korean:
  - 전쟁을 하다
  - 전투하다
  lexicon: LSJ
  rationale: 앞의 στρατεύονται와 병렬을 이루는 보다 직접적인 동사이므로, 과도하게 격식을 높이지 않고 ‘싸우다’로 옮겼습니다.
- source_word: γεωργοῦσιν τὴν γῆν
  english_pob_choice: cultivate the land / farm the land
  chosen_korean: 땅을 경작하다
  alternatives_korean:
  - 땅을 일구다
  - 토지를 경작하다
  lexicon: LSJ
  rationale: 농경 노동의 일반적 의미를 살리면서도 문어체에 맞게 ‘경작하다’를 사용했습니다.
- source_word: ἀναφέρουσιν
  english_pob_choice: bring / present tribute
  chosen_korean: 공물을 바치다
  alternatives_korean:
  - 바치다
  - 전달하다
  - 공물을 전달하다
  lexicon: LSJ
  rationale: 왕에게 올리는 의무 납부라는 재정적·봉건적 의미를 살려, 첫 번째 구절은 ‘공물’로 구체화했습니다.
- source_word: τοὺς φόρους
  english_pob_choice: the taxes
  chosen_korean: 세금
  alternatives_korean:
  - 조세
  - 세납
  - 공물
  lexicon: LSJ
  rationale: 두 번째 절은 φόρους가 명시되어 있어 일반적 납세 의무를 드러내는 ‘세금’이 적절합니다.
- source_word: ἕτερος τὸν ἕτερον ἀναγκάζοντες
  english_pob_choice: by compelling one another
  chosen_korean: 서로 강요하면서
  alternatives_korean:
  - 서로 강제하면서
  - 서로 압박하면서
  lexicon: LSJ
  rationale: 상호적 강요를 뜻하는 표현을 자연스러운 한국어로 풀어, 공동체 내부의 압박이라는 힘을 살렸습니다.
theological_decisions:
- issue: 왕에게 드리는 납부 표현의 이중성
  chosen_reading: 첫 절은 ‘공물’, 둘째 절은 ‘세금’으로 구분했습니다.
  alternative_readings:
  - 둘 다 ‘공물’로 통일
  - 둘 다 ‘세금’으로 통일
  rationale: 그리스어는 둘 다 납부 행위를 말하지만, 두 번째 절에서 φόρους가 명시되므로 한국어에서도 일반적 조세와 왕실 납부를 구분해 주는 편이 본문의 흐름을 잘 드러냅니다.
