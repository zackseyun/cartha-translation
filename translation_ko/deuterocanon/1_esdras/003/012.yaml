    text: Or 'Women prevail, but truth conquers everything.'
    reason: lexical_alternative
translation:
  language: ko
  text: 세 번째 사람이 기록하기를, 「여자들은 더 강하지만, 무엇보다도 진리가 승리합니다」라고 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여자들은 우세하지만, 진리가 모든 것을 이긴다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρίτος
  english_pob_choice: The third
  chosen_korean: 세 번째 사람
  alternatives_korean:
  - 세 번째
  - 세 번째 자
  - 세 번째 남자
  lexicon: LSJ
  rationale: 순번이 매겨진 발화자라는 점을 자연스럽게 드러내기 위해 「세 번째 사람」으로 옮겼습니다.
- source_word: ἔγραψεν
  english_pob_choice: wrote
  chosen_korean: 기록하기를
  alternatives_korean:
  - 썼습니다
  - 기록했습니다
  - 적었습니다
  lexicon: LSJ
  rationale: 이 구절은 대화문 속 발언 내용을 문서화한 맥락이므로, 단순한 필기 행위보다 결과를 드러내는 「기록하기를」이 가장 자연스럽습니다.
- source_word: Ὑπερισχύουσιν αἱ γυναῖκες
  english_pob_choice: Women are stronger
  chosen_korean: 여자들은 더 강하지만
  alternatives_korean:
  - 여자들은 더 강합니다
  - 여자들은 우세합니다
  - 여자들은 이깁니다
  lexicon: LSJ
  rationale: Ὑπερισχύουσιν은 단순한 ‘이기다’보다 ‘힘에서 더 우세하다/더 강하다’의 뜻이어서, 뒤의 νικᾷ와 구별되도록 「더 강하다」로 옮겼습니다.
- source_word: ὑπὲρ δὲ πάντα νικᾷ
  english_pob_choice: but above all things truth is victorious
  chosen_korean: 무엇보다도 진리가 승리합니다
  alternatives_korean:
  - 그러나 무엇보다도 진리가 모든 것을 이깁니다
  - 그런데 진리가 모든 것 위에 승리합니다
  - 하지만 진리가 무엇보다도 이깁니다
  lexicon: LSJ
  rationale: ὑπὲρ δὲ πάντα의 우위 표현을 「무엇보다도」로, νικᾷ의 승리/정복 의미를 「승리합니다」로 살려 간결하게 표현했습니다.
- source_word: ἡ ἀλήθεια
  english_pob_choice: truth
  chosen_korean: 진리
  alternatives_korean:
  - 진실
  - 참된 것
  - 그 진리
  lexicon: LSJ
  rationale: 격언적 진술에서 ἀλήθεια는 추상명사로 자연스럽게 「진리」가 적절하며, 한국어에서는 관사 없이도 일반명사처럼 읽힙니다.
theological_decisions:
- issue: 진리를 보편적 원리로 읽을지 특정 교리 명제로 읽을지
  chosen_reading: 문맥상 특정 교리보다 ‘진리’가 모든 것에 우선하여 이긴다는 보편적 격언으로 옮겼습니다.
  alternative_readings:
  - 특정한 진리가 승리합니다
  - 그 진리가 모든 것을 이깁니다
  rationale: 본문은 논쟁에서 제시된 한 줄 명언으로, 특정 신학 명제를 지목하기보다 진리의 보편적 우위를 선언하는 격언으로 이해하는 편이 원문에 가깝습니다.
  doctrine_reference: '번역 원칙: 격언적 문장을 과도하게 교리화하지 말고, 원문의 보편 진술을 유지합니다.'
