  lexicon: LSJ
  rationale: διά + 대격의 원인 의미를 분명하게 살리기 위해 ‘지혜 때문에’로 옮겼습니다.
- source_word: συγγενής
  english_pob_choice: kinsman
  chosen_korean: 친족
