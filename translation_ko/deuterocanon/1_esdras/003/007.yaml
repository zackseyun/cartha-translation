  rationale: 혈연을 가리키는 기본 뜻을 유지하되, 궁정적 은유로 축소하지 않기 위해 ‘친족’을 선택했습니다.
theological_decisions:
- issue: 궁정 서열과 혈연 호칭의 중첩
  chosen_reading: ‘다리오 다음의 둘째 자리’와 ‘다리오의 친족’이라는 두 표현을 모두 살려, 지혜로 인한 서열 부여와 친족 호칭을 구분해 드러냈습니다.
  alternative_readings:
  - ‘다리오에게서 둘째’
  - ‘다리오의 가까운 사람’
  rationale: 본문은 단순한 임명보다 왕실 내 순위와 관계 호칭을 함께 말하므로, 둘을 분리해 번역해야 원문의 긴장을 보존할 수 있습니다.
  doctrine_reference: 문학적/역사적 본문 의미 보존
