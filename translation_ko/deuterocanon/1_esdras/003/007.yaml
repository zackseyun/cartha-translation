  lexicon: LSJ
  rationale: 직역하면 ‘앉다/앉히다’의 이미지가 살아 있어 왕궁에서의 자리 부여를 드러내므로, ‘앉게 될 것입니다’로 옮겼습니다.
- source_word: διὰ τὴν σοφίαν αὐτοῦ
  english_pob_choice: because of his wisdom
  chosen_korean: 그의 지혜 때문에
  alternatives_korean:
