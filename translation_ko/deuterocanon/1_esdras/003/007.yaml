  text: And he will be seated second to Darius because of his wisdom[b][a], and he will be called a kinsman of Darius.
  footnotes:
  - marker: a
    text: Or 'he will sit second to Darius.' The Greek verb can denote being seated or installed in a position of rank.
    reason: lexical_alternative
  - marker: b
    text: '''Kinsman'' may denote an actual relative or an honorific court status implying close royal favor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 다리오 다음의 둘째 자리에 앉게 될 것이며, 다리오의 친족이라 불릴 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다리오 다음에 둘째로 앉을 것입니다.’ 그리스어 동사는 자리에 앉는 것과 지위에 세워지는 것을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘친족’은 실제 혈연을 뜻할 수도 있고, 왕실에서 가까운 특별한 지위를 가리키는 존칭일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεύτερος
