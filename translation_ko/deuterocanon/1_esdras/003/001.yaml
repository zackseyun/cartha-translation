translation:
  language: ko
  text: 그리고 다리오 왕은 자기 아래에 있는 모든 사람과 자기 집안의 모든 사람과 메디아와 페르시아의 모든 귀족을 위해 큰 잔치를 베풀었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: δοχή는 공식적인 식사 초대나 연회를 가리킬 수 있으므로, 여기서는 왕실 연회의 성격을 살려 ‘잔치’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 민족이 아니라 지역명(메디아, 페르시아)을 사용합니다.
    reason: source_note
