  rationale: 원문은 대상들을 구분해 나열하므로, 한국어에서도 범주를 합치지 않고 각각의 대상을 분명히 드러내는 것이 문맥과 충실도에 더 적합합니다.
  doctrine_reference: 원문 서술의 역사적·문맥적 충실성
