    text: 그리스어는 민족이 아니라 지역명(메디아, 페르시아)을 사용합니다.
    reason: source_note
  - marker: b
    text: δοχή는 공식적인 식사 초대나 연회를 가리킬 수 있습니다. 여기서는 왕실 연회의 성격을 살려 ‘연회’로 옮겼습니다.
    reason: lexical_alternative
