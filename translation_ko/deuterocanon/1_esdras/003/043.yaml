  source_fidelity: ‘친아버지’는 원문의 πατέρα(아버지)에 없는 생물학적 친자 관계의 한정을 더하므로 삭제해야 합니다. 또한 ἄνθρωπος는 이 문맥에서 아내를 취하는 남성 주체를 가리키므로 ‘한 남자’가 원문의 성별 표지를 더 충실히 반영합니다. χώρα는 ‘고향’보다 ‘나라’가 원문의 지리적 범위를 보존합니다.
  naturalness: ‘달라붙습니다’는 현대 한국어에서 물리적·부정적 뉘앙스가 강해 혼인 관계의 지속적 결속을 나타내는 κολλᾶται에는 ‘붙습니다’가 더 자연스럽고 문체에 맞습니다. 관계절은 대시 삽입보다 선행 명사 앞에 두는 편이 매끄럽습니다.
