  yaml_path: translation/deuterocanon/1_esdras/003/043.yaml
  text: A man leaves his own father[a], who raised him, and his own country, and clings to his own wife,
  footnotes:
  - marker: a
    text: Or 'abandons' or 'forsakes' for 'leaves'; the Greek verb can carry a stronger sense, but here it likely describes departing from father and country in order to attach himself to his wife.
    reason: lexical_alternative
translation:
  language: ko
  text: 한 사람은 자기의 친아버지—자기를 길러 준 아버지—와 자기의 고향을 떠나 자기의 아내에게 달라붙습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘버리다’, ‘저버리다’일 수 있습니다. 그리스어 동사는 더 강한 뜻을 가질 수 있지만, 여기서는 아버지와 고향을 떠나 아내에게 결합하는 움직임을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος
  english_pob_choice: A man
  chosen_korean: 한 사람은
  alternatives_korean:
  - 한 남자는
  - 사람은
  lexicon: BDAG
  rationale: 그리스어의 단수 일반 진술을 자연스러운 한국어로 옮기되, 문맥상 결혼의 대표적 남성 주체를 드러내기 위해 ‘한 사람은’을 택했습니다.
- source_word: τὸν ἑαυτοῦ πατέρα
  english_pob_choice: his own father
  chosen_korean: 자기의 친아버지
  alternatives_korean:
  - 자기의 아버지
  - 자기 아버지
  lexicon: BDAG
  rationale: ἑαυτοῦ의 소유 강조를 살리기 위해 ‘자기의’를 두고, 단순한 아버지보다 관계의 긴밀함을 드러내는 ‘친아버지’로 옮겼습니다.
- source_word: ἐγκαταλείπει
  english_pob_choice: leaves
  chosen_korean: 떠나
  alternatives_korean:
  - 버리고
  - 떠납니다
  lexicon: BDAG
  rationale: 이 동사는 문맥상 아내에게 결합하기 위해 부모와 고향을 ‘떠나는’ 의미가 자연스럽고, 지나치게 비난하는 뉘앙스는 원문보다 강해질 수 있어 피했습니다.
- source_word: ὃς ἐξέθρεψεν αὐτόν
  english_pob_choice: who raised him
  chosen_korean: 자기를 길러 준
  alternatives_korean:
  - 자기를 키워 준
  - 자기를 양육한
  lexicon: BDAG
  rationale: ἐξέθρεψεν은 양육·성장을 도운 뜻이므로, 현대 한국어에서 가장 자연스러운 ‘길러 준’으로 표현했습니다.
- source_word: τὴν ἰδίαν χώραν
  english_pob_choice: his own country
  chosen_korean: 자기의 고향을
  alternatives_korean:
  - 자기의 나라를
  - 자기의 땅을
  lexicon: BDAG
  rationale: χώρα는 여기서 출신지·거주지를 가리키는 폭넓은 말이므로, ‘country’의 기능을 살리면서도 한국어에서 구체적으로 전달되는 ‘고향’을 선택했습니다.
- source_word: πρὸς τὴν ἰδίαν γυναῖκα
  english_pob_choice: to his own wife
  chosen_korean: 자기의 아내에게
  alternatives_korean:
  - 자기의 여자에게
  - 자기 아내에게
  lexicon: BDAG
  rationale: γυνή가 결혼 관계에서는 ‘아내’라는 뜻이 분명하므로, 현대 독자가 바로 이해할 수 있게 옮겼습니다.
- source_word: κολλᾶται
  english_pob_choice: clings
  chosen_korean: 달라붙습니다
  alternatives_korean:
  - 붙습니다
  - 매달립니다
  - 굳게 결합합니다
  lexicon: BDAG
  rationale: ‘cling’의 강한 결합성을 살리기 위해 보다 직접적인 동작어를 택했으며, 문자적 긴밀함을 드러내는 ‘달라붙습니다’로 옮겼습니다.
theological_decisions:
- issue: 혼인 관계를 강조하는 동사의 강도
  chosen_reading: ‘달라붙습니다’로 옮겨 결합의 강한 밀착감을 드러냅니다.
  alternative_readings:
  - ‘붙습니다’로 완화함
  - ‘결합합니다’로 중립화함
  rationale: 원문 κολλᾶται는 단순한 접촉보다 긴밀한 부착·결속을 뜻하므로, 혼인 결합의 강도를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 창 2:24의 결합 표현과 본문의 혼인-분리 대비
