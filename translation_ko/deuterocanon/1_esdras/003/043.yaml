  text: A man leaves his own father[a], who raised him, and his own country, and clings to his own wife,
  footnotes:
  - marker: a
    text: Or 'abandons' or 'forsakes' for 'leaves'; the Greek verb can carry a stronger sense, but here it likely describes departing from father and country in order to attach himself to his wife.
    reason: lexical_alternative
translation:
  language: ko
  text: 한 남자는 자기를 길러 준 자기 아버지와 자기 나라를 떠나 자기 아내에게 붙습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘버리다’, ‘저버리다’로 옮길 수 있습니다. 그리스어 동사는 더 강한 뜻을 가질 수 있지만, 여기서는 아버지와 나라를 떠나 아내에게 결합하는 것을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος
