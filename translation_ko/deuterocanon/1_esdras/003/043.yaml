  lexicon: BDAG
  rationale: 그리스어의 단수 일반 진술을 자연스러운 한국어로 옮기되, 문맥상 결혼의 대표적 남성 주체를 드러내기 위해 ‘한 사람은’을 택했습니다.
- source_word: τὸν ἑαυτοῦ πατέρα
