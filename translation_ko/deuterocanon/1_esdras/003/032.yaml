translation:
  language: ko
  text: 그가 「찍어 버리라」고 하면 그들이 찍어 버리고, 그가 「심으라」고 하면 그들이 심습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν
  english_pob_choice: he said
  chosen_korean: 그가 …라고 하면
  alternatives_korean:
  - 그가 말했다
  - 그가 명령하면
  lexicon: LSJ
  rationale: εἶπεν은 단순 발화 동사이지만, 뒤따르는 내용은 실제 행위를 낳는 지시이므로 한국어에서는 반복되는 간결한 구조를 살리면서도 명령의 기능을 드러내는 방식으로 옮겼습니다.
- source_word: ἐκκόψαι / ἐκκόπτουσιν
  english_pob_choice: Cut it down / they cut it down
  chosen_korean: 찍어 버리라 / 찍어 버리고
  alternatives_korean:
  - 잘라 버리라 / 잘라 버리고
  - 베어 버리라 / 베어 버리고
  lexicon: LSJ
  rationale: ἐκκόπτω는 ‘자르다, 도려내다, 잘라 없애다’의 뜻이어서, 반복되는 단호한 어감을 살리기 위해 ‘찍어 버리다’를 택했습니다. 한국어에서 대상이 생략되어도 자연스럽고, 행동의 즉각성과 절단의 강도를 유지합니다.
- source_word: φυτεῦσαι / φυτεύουσιν
  english_pob_choice: Plant it / they plant it
  chosen_korean: 심으라 / 심습니다
  alternatives_korean:
  - 심어 두라 / 심어 둡니다
  - 식재하라 / 식재합니다
  lexicon: LSJ
  rationale: φυτεύω는 보통 ‘심다’로 자연스럽게 옮길 수 있으며, 앞의 절단 동작과 평행을 이루도록 간결하게 처리했습니다. 문맥상 동일한 대상이 이어지므로 영어와 달리 한국어에서는 대명사 ‘그것’을 반복하지 않았습니다.
theological_decisions:
- issue: 반복되는 왕명/지시의 구문을 한국어에서 어떻게 살릴 것인가
  chosen_reading: 직설적 명령문을 그대로 옮기되, 인용문 내부는 왕의 즉각적인 지시처럼 간결하게 유지했습니다.
  alternative_readings:
  - 서술형으로 완화해 ‘그가 …라고 말했습니다’로 옮기기
  - 명령의 강도를 높여 ‘반드시 …하라’로 옮기기
  rationale: 본문은 짧은 평행 구조로 권위 있는 지시와 즉각적 실행을 대비시키므로, 과도한 설명이나 완화 없이 한국어의 간결한 반복을 보존하는 것이 의미를 가장 잘 드러냅니다.
  doctrine_reference: '본문 해석의 일반 원칙: 서술 구조와 수사적 반복 보존'
- issue: 대상 명사의 생략을 한국어에서 어떻게 처리할 것인가
  chosen_reading: 한국어 본문에서는 대상 대명사를 넣지 않고 동사만 반복했습니다.
  alternative_readings:
  - ‘그것을 찍어 버리고 / 그것을 심습니다’처럼 목적어를 보충하기
  - 앞 문맥의 대상을 주석으로 처리하기
  rationale: 그리스어는 양쪽 절에서 목적어를 드러내지 않으며, 영어 POB도 자연성을 위해 it을 보충했습니다. 한국어에서는 이런 보충이 오히려 본문의 압축감을 약화시키므로 생략을 유지했습니다.
  doctrine_reference: 본문 문법 보존과 최소 보충 원칙
