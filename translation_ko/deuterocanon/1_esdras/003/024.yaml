  lexicon: BDAG
  rationale: 앞서 언급된 화자를 되짚는 분사이므로, 관계를 분명히 드러내는 ‘말했던 그 사람’으로 옮겼습니다.
- source_word: ἰσχύος
  english_pob_choice: strength / power
  chosen_korean: 힘
