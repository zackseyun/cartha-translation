lexical_decisions:
- source_word: Καὶ ἤρξατο ... λαλεῖν
  english_pob_choice: began to speak
  chosen_korean: 말하기 시작했습니다
  alternatives_korean:
  - 말하기를 시작했습니다
  - 말하기 시작하였습니다
  lexicon: BDAG
  rationale: ἤρξατο + λαλεῖν은 발화를 시작했다는 진행상의 전환을 나타내므로, 한국어에서는 자연스러운 ‘말하기 시작했습니다’로 옮겼습니다.
- source_word: ὁ δεύτερος
  english_pob_choice: the second
  chosen_korean: 둘째 사람
  alternatives_korean:
  - 두 번째 사람
  - 둘째
  lexicon: BDAG
  rationale: 대화 순서 속 두 번째 화자를 가리키므로, 문맥상 자연스러운 명사구인 ‘둘째 사람’을 택했습니다.
- source_word: ὁ εἴπας
  english_pob_choice: the one who had spoken
  chosen_korean: 말했던 그 사람
  alternatives_korean:
  - 말한 사람
  - 이미 말한 사람
  lexicon: BDAG
  rationale: 앞서 언급된 화자를 되짚는 분사이므로, 관계를 분명히 드러내는 ‘말했던 그 사람’으로 옮겼습니다.
- source_word: ἰσχύος
  english_pob_choice: strength / power
  chosen_korean: 힘
  alternatives_korean:
  - 강함
  - 권세
  - 능력
  lexicon: BDAG
  rationale: ἰσχύς는 ‘strength/might/power’의 폭을 가지며, 여기서는 왕의 위세를 가리키는 말이므로 과도하게 추상화하지 않는 ‘힘’이 가장 무난합니다.
