  yaml_path: translation/deuterocanon/1_esdras/003/022.yaml
  text: And when they rise from the wine[a], they do not remember what they did.
  footnotes:
  - marker: a
    text: Greek literally, 'when they rise from the wine.' The phrase refers to getting up after being under wine's effects, not necessarily a formal statement about sobriety.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 술을 마시고 일어날 때에는, 자신들이 한 일을 기억하지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어는 문자적으로 ‘포도주로부터 일어나면’입니다. 이 표현은 포도주의 영향 아래 있다가 일어나는 상황을 가리키며, 반드시 술이 완전히 깬 상태를 뜻하는 것은 아닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τοῦ οἴνου
  english_pob_choice: from the wine
  chosen_korean: 술에서
  alternatives_korean:
  - 포도주에서
  - 술로부터
  - 술의 영향에서
  lexicon: BDAG
  rationale: 직역하면 ‘포도주에서’이지만, 문맥상 포도주의 영향을 받은 뒤 다시 일어나는 모습을 가리키므로 한국어에서는 자연스럽게 ‘술에서’로 옮겨 이미지와 의미를 함께 살렸습니다.
- source_word: ἐγερθῶσιν
  english_pob_choice: they rise
  chosen_korean: 일어나면
  alternatives_korean:
  - 일어나면
  - 깨어나면
  - 몸을 일으키면
  lexicon: BDAG
  rationale: 동사의 기본 의미인 ‘일어나다’를 유지하면서, 한국어 조건절에서 자연스러운 ‘일어나면’으로 처리했습니다.
- source_word: οὐ μέμνηται
  english_pob_choice: they do not remember
  chosen_korean: 기억하지 못합니다
  alternatives_korean:
  - 기억하지 않습니다
  - 떠올리지 못합니다
  - 기억하지 못합니다
  lexicon: BDAG
  rationale: 기억의 결핍을 분명히 드러내는 표현으로 옮겼고, 본문 의미상 단순한 ‘하지 않는다’보다 ‘하지 못합니다’가 더 적절합니다.
