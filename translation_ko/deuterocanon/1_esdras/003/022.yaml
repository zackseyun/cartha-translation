  chosen_korean: 일어나면
  alternatives_korean:
  - 일어나면
  - 깨어나면
  - 몸을 일으키면
  lexicon: BDAG
  rationale: 동사의 기본 의미인 ‘일어나다’를 유지하면서, 한국어 조건절에서 자연스러운 ‘일어나면’으로 처리했습니다.
- source_word: οὐ μέμνηται
  english_pob_choice: they do not remember
  chosen_korean: 기억하지 못합니다
  alternatives_korean:
  - 기억하지 않습니다
  - 떠올리지 못합니다
  - 기억하지 못합니다
  lexicon: BDAG
  rationale: 기억의 결핍을 분명히 드러내는 표현으로 옮겼고, 본문 의미상 단순한 ‘하지 않는다’보다 ‘하지 못합니다’가 더 적절합니다.
