  source_fidelity: 원문의 세 동사(ἀπώλοντο, ἐσφάλησαν, ἡμάρτοσαν)는 모두 과거에 일어난 사건을 서술합니다. ‘멸망하고, 길을 벗어나며, 죄를 지었습니다’는 가운데 동사만 현재적 연결형으로 되어 시제·상 흐름이 고르지 않습니다. ἐσφάλησαν의 수동적 ‘잘못된 길로 이끌리다’라는 의미는 ‘미혹되어’로 자연스럽게 보존할 수 있습니다.
