  text: And many perished and were led astray and sinned because of women[a].
  footnotes:
  - marker: a
    text: Or 'because of wives.' The Greek γυναῖκες can mean either 'women' or 'wives,' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 많은 이들이 여인들 때문에 멸망하고 미혹되어 죄를 지었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아내들 때문에’로 옮길 수 있습니다. 그리스어 γυναῖκες는 문맥에 따라 ‘여인들’ 또는 ‘아내들’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώλοντο
  english_pob_choice: perished
  chosen_korean: 멸망하고
  alternatives_korean:
  - 멸망하였고
  - 망하고
  lexicon: BDAG
  rationale: Ἀπόλλυμι의 결과적 붕괴를 한국어로는 ‘멸망하다’가 가장 직접적으로 드러내며, 문맥의 강한 파멸감을 살립니다.
- source_word: ἐσφάλησαν
  english_pob_choice: were led astray
  chosen_korean: 길을 벗어나며
  alternatives_korean:
  - 미혹되어
  - 넘어지며
  lexicon: LSJ
  rationale: 물리적 ‘넘어짐’보다 도덕적·삶의 방향 이탈을 나타내므로, 한국어에서는 ‘길을 벗어나다’가 의미를 가장 자연스럽게 전달합니다.
- source_word: ἡμάρτοσαν
  english_pob_choice: sinned
  chosen_korean: 죄를 지었습니다
  alternatives_korean:
  - 범죄하였습니다
  - 잘못하였습니다
  lexicon: BDAG
  rationale: ἁμαρτάνω의 표준적 윤리·종교적 의미를 현대 한국어의 평이한 표현으로 옮겼습니다.
- source_word: διὰ τὰς γυναῖκας
  english_pob_choice: because of women
  chosen_korean: 여인들 때문에
  alternatives_korean:
  - 여자들 때문에
  - 아내들 때문에
  lexicon: BDAG
  rationale: διά + 대격의 원인 의미를 ‘때문에’로 살렸고, γυναῖκες의 넓은 뜻을 좁히지 않기 위해 ‘여인들’을 선택했습니다.
theological_decisions:
- issue: γυναῖκες의 범위를 ‘wives’로 좁힐지 여부
  chosen_reading: 여인들
  alternative_readings:
  - 아내들
  - 여자들
  rationale: 본문 자체는 배우자에 한정하지 않으므로, 영어 POB의 ‘women’을 따라 더 넓은 범위를 유지했습니다. 이는 원문의 수사적 폭을 보존합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 4, 5
