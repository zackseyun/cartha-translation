  text: and from them they came to be[a], and these women nourished the very men who planted the vineyards from which wine comes[b],
  footnotes:
  - marker: a
    text: Or, 'they were born from them.' The Greek says more literally, 'they came to be from them.'
    reason: lexical_alternative
  - marker: b
    text: The Greek feminine demonstrative means specifically 'these women,' not merely 'these things.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 사람들은 그들에게서 생겨났으며[a], 이 여성들은[b] 포도원을 심은 바로 그 사람들을 길렀고, 그 포도원들에서 포도주가 나옵니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들에게서 생겨났다’입니다. 문맥상 출생의 기원을 가리키지만, 그리스어는 더 넓게 ‘생겨나다’라는 표현을 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어의 여성형 지시대명사는 단순한 ‘이것들’이 아니라 분명히 ‘이 여성들’을 가리킵니다.
    reason: lexical_alternative
