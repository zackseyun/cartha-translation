base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/039.yaml
  text: and from them they came to be[a], and these women nourished the very men who planted the vineyards from which wine comes[b],
  footnotes:
  - marker: a
    text: Or, 'they were born from them.' The Greek says more literally, 'they came to be from them.'
    reason: lexical_alternative
  - marker: b
    text: The Greek feminine demonstrative means specifically 'these women,' not merely 'these things.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들로부터 사람들이 태어났으며, 이 여자들이 포도원을 심은 바로 그 사람들을 길러 주었으니, 그 포도원들로부터 포도주가 나옵니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들로부터 생겨났다/태어났다’입니다. 문맥상 출생의 기원을 말하지만, 그리스어는 더 넓게 ‘생겨나다’의 표현을 씁니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어의 여성형 지시대명사는 단순한 ‘이것들’이 아니라 분명히 ‘이 여자들’을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ αὐτῶν
  english_pob_choice: from them
  chosen_korean: 그들로부터
  alternatives_korean:
  - 그들에서
  - 그들 가운데서
  - 그들로부터 나와
  lexicon: LSJ
  rationale: ἐξ + 속격은 기원/출처를 나타내므로, 한국어에서도 출처를 드러내는 ‘-로부터’로 옮겨 원문의 기원을 보존했습니다.
- source_word: ἐγένοντο
  english_pob_choice: they came to be
  chosen_korean: 사람들이 태어났으며
  alternatives_korean:
  - 그들이 생겨났으며
  - 그들이 존재하게 되었으며
  - 그들이 되었습니다
  lexicon: BDAG
  rationale: 문맥상 출생의 기원을 말하므로 자연스러운 한국어로는 ‘태어났으며’가 가장 잘 맞지만, 원문의 기원 표현도 함께 살리기 위해 연결했습니다.
- source_word: αὗται
  english_pob_choice: these women
  chosen_korean: 이 여자들이
  alternatives_korean:
  - 이들은
  - 이 여자들은
  - 이 여성들이
  lexicon: LSJ
  rationale: 여성형 지시대명사이므로 지시 대상이 여성임을 분명히 해야 합니다. 다만 한국어에서는 문맥상 자연스럽게 ‘이 여자들이’로 풀었습니다.
- source_word: ἐξέθρεψαν
  english_pob_choice: nourished
  chosen_korean: 길러 주었으니
  alternatives_korean:
  - 양육하였으니
  - 먹여 키웠으니
  - 기르셨으니
  lexicon: BDAG
  rationale: 이 동사는 먹이고 기르는 의미를 함께 가지므로, 모성적 돌봄의 뉘앙스를 살리면서도 한국어로 자연스러운 ‘길러 주었으니’를 선택했습니다.
- source_word: αὐτοὺς τοὺς φυτεύσαντας
  english_pob_choice: the very men who planted
  chosen_korean: 포도원을 심은 바로 그 사람들을
  alternatives_korean:
  - 포도원을 심은 사람들을
  - 심은 바로 그 사람들을
  - 그 포도원을 심은 사람들을
  lexicon: LSJ
  rationale: 대명사와 분사의 결합이 강조를 이루므로, 단순한 관계절보다 ‘바로 그 사람들’을 넣어 강조를 반영했습니다. 또한 φυτεύσαντας는 포도원 ‘심기’의 행위로 옮겼습니다.
- source_word: τοὺς ἀμπελῶνας
  english_pob_choice: the vineyards
  chosen_korean: 포도원
  alternatives_korean:
  - 포도밭
  - 포도원들
  - 포도나무밭
  lexicon: LSJ
  rationale: ἀμπελών의 통상적 번역인 ‘포도원’을 사용해 자연스러운 현대 한국어를 유지했습니다.
- source_word: ὁ οἶνος γίνεται
  english_pob_choice: wine comes
  chosen_korean: 포도주가 나옵니다
  alternatives_korean:
  - 포도주가 만들어집니다
  - 포도주가 생깁니다
  - 포도주가 나옵니다
  lexicon: BDAG
  rationale: γίνεται는 산출/발생의 넓은 의미를 가지므로, 과도하게 기술적으로 만들지 않고 결과를 드러내는 ‘나옵니다’로 옮겼습니다.
theological_decisions:
- issue: 문장 전체의 여성 우위/기원 논증을 한국어에서 얼마나 분명히 드러낼지
  chosen_reading: ‘이 여자들이… 길러 주었으니’로 옮겨, 여성들이 남성의 기원과 양육에 관한 논증의 주체라는 점을 분명히 했습니다.
  alternative_readings:
  - 주어를 단순히 ‘이들은’으로 처리하기
  - 양육 행위를 일반화하여 성별 강조를 약화하기
  rationale: 이 절은 여성의 우선성과 영향력을 강조하는 수사이므로, 여성 지시를 지우지 않고 드러내는 것이 원문의 논증을 보존합니다.
  doctrine_reference: optimal equivalence; source meaning over gender-neutral smoothing
