theological_decisions:
- issue: 문장 전체의 여성 우위/기원 논증을 한국어에서 얼마나 분명히 드러낼지
  chosen_reading: ‘이 여자들이… 길러 주었으니’로 옮겨, 여성들이 남성의 기원과 양육에 관한 논증의 주체라는 점을 분명히 했습니다.
  alternative_readings:
  - 주어를 단순히 ‘이들은’으로 처리하기
  - 양육 행위를 일반화하여 성별 강조를 약화하기
  rationale: 이 절은 여성의 우선성과 영향력을 강조하는 수사이므로, 여성 지시를 지우지 않고 드러내는 것이 원문의 논증을 보존합니다.
