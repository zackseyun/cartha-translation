  yaml_path: translation/deuterocanon/1_esdras/003/040.yaml
  text: And these make the garments of men[a], and these bring glory to men, and men cannot exist apart from women.
  footnotes:
  - marker: a
    text: Or 'cannot be without women.' The Greek infinitive is literally 'to be,' which may be rendered more woodenly as 'be' rather than 'exist.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 여자들은 남자들의 옷을 만들고, 이 여자들은 남자들에게 영광을 가져다주며, 남자들은 여자들 없이 있을 수 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '여자들 없이 있을 수 없다'로 옮길 수 있습니다. 그리스어 부정사 εἶναι는 문자적으로는 'be'입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὗται
  english_pob_choice: these
  chosen_korean: 이 여자들은
  alternatives_korean:
  - 이들은
  - 이 여자들이
  lexicon: LSJ
  rationale: 앞선 문맥의 γυναῖκες를 가리키는 여성 지시어이므로, 단순한 '이들'보다 '이 여자들'이 지시 대상을 분명히 하면서도 반복 효과를 살립니다.
- source_word: ποιοῦσιν τὰς στολὰς
  english_pob_choice: make the garments
  chosen_korean: 옷을 만들고
  alternatives_korean:
  - 의복을 만들고
  - 겉옷을 만들고
  - 옷감을 만들어
  lexicon: BDAG
  rationale: στολή는 격식 있는 '옷/의복'까지 포함할 수 있지만, 여기서는 직역된 복수성과 구체성을 살려 가장 자연스러운 '옷'으로 옮겼습니다.
- source_word: δόξαν
  english_pob_choice: glory
  chosen_korean: 영광을 가져다주며
  alternatives_korean:
  - 명예를 가져다주며
  - 영예를 주며
  - 빛을 더하며
  lexicon: BDAG
  rationale: δόξα는 단순한 '명예'보다 더 높은 격조의 '영광'을 드러내므로, 주어가 남자들에게 귀속시키는 가치 상승을 살려 '영광을 가져다주다'로 표현했습니다.
- source_word: χωρὶς τῶν γυναικῶν
  english_pob_choice: apart from women
  chosen_korean: 여자들 없이
  alternatives_korean:
  - 여자들 없이는
  - 여자들과 떨어져
  - 여자들 apart from
  lexicon: BDAG
  rationale: χωρίς의 기본 의미인 '없이/떨어져'를 반영해, 한국어로는 가장 직접적인 '여자들 없이'가 문맥상의 의존 관계를 분명하게 드러냅니다.
theological_decisions:
- issue: οἱ ἄνθρωποι의 성별 지시
  chosen_reading: 남자들
  alternative_readings:
  - 사람들
  - 인간들
  rationale: 바로 뒤의 τῶν γυναικῶν과 대조되는 관계이므로, 여기서는 일반적 포괄어보다 남성 지시가 소스의 논리와 더 정확히 맞습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
