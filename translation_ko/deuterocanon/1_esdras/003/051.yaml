  yaml_path: translation/deuterocanon/1_esdras/003/051.yaml
  text: And now you do not believe me[a]. Is not the king great in his authority? Do not all the lands fear to touch him?
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'Do not all the lands fear to lay a hand on him?' The Greek literally says 'to touch him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 이제 너희는 나를 믿지 않습니다. 왕이 자기 권세로 얼마나 큰 분입니까? 온 땅들이 그를 만지기를 두려워하지 않습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 관용적으로, ‘그에게 손을 대기를 두려워하지 않습니까?’로 옮길 수 있습니다. 그리스어는 문자적으로 ‘그를 만지다’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύετέ μοι
  english_pob_choice: you do not believe me
  chosen_korean: 너희는 나를 믿지 않습니다
  alternatives_korean:
  - 너희는 나를 신뢰하지 않습니다
  - 너희는 내 말을 믿지 않습니다
  lexicon: BDAG
  rationale: 대화 상대가 발화자의 진술을 받아들이지 않는다는 뜻이므로, ‘믿지 않습니다’가 가장 직접적이고 자연스럽습니다.
- source_word: ὁ βασιλεὺς
  english_pob_choice: the king
  chosen_korean: 왕
  alternatives_korean:
  - 임금
  - 군왕
  lexicon: LSJ
  rationale: 본문의 정치적 호칭을 현대 한국어에서 가장 중립적으로 전달하는 말은 ‘왕’입니다.
- source_word: τῇ ἐξουσίᾳ αὐτοῦ
  english_pob_choice: in his authority
  chosen_korean: 자기 권세로
  alternatives_korean:
  - 자기 권위로
  - 자기 통치권으로
  lexicon: LSJ
  rationale: ἐξουσία는 단순한 지위가 아니라 실제로 행사되는 통치 권한을 가리키므로, 문맥상 ‘권세’가 힘과 권한을 함께 살립니다.
- source_word: πᾶσαι αἱ χῶραι
  english_pob_choice: all the lands
  chosen_korean: 온 땅들
  alternatives_korean:
  - 모든 지역들
  - 모든 나라들
  lexicon: LSJ
  rationale: χῶραι는 현대 국가보다 넓은 ‘땅/영토’의 뜻이어서, 지리적·정치적 포괄성을 살리는 ‘온 땅들’이 적절합니다.
- source_word: εὐλαβοῦνται ἅψασθαι αὐτοῦ
  english_pob_choice: fear to touch him
  chosen_korean: 그를 만지기를 두려워하지 않습니까
  alternatives_korean:
  - 그에게 손대기를 두려워하지 않습니까
  - 그를 만지기를 겁내지 않습니까
  lexicon: LSJ
  rationale: εὐλαβέομαι는 조심스러움에서 오는 두려움을 나타내며, ἅψασθαι는 직역하면 ‘만지다’입니다. 한국어에서는 수사적 질문의 힘을 살리기 위해 ‘만지기를 두려워하지 않습니까’로 옮겼습니다.
theological_decisions:
- issue: 수사적 질문의 유지
  chosen_reading: 본문의 연속된 반문을 그대로 살려 왕의 위세를 청중이 체감하도록 했습니다.
  alternative_readings:
  - 서술문으로 풀어 ‘왕이 매우 큽니다’라고 바꾸는 번역
  - 더 완곡하게 ‘두려워합니다’로 약화하는 번역
  rationale: 그리스어는 반문을 통해 상대의 무지를 책망하고 왕권의 위압감을 강조하므로, 질문 형식을 유지하는 것이 본문의 논증력을 보존합니다.
  doctrine_reference: 수사학적 보존 원칙
- issue: 직역과 관용 사이의 균형
  chosen_reading: ‘만지기를 두려워하지 않습니까’로 직역성을 유지하되 한국어 어법에 맞게 다듬었습니다.
  alternative_readings:
  - ‘손을 대기를 두려워하지 않습니까’
  - ‘그에게 감히 손대지 못하지 않습니까’
  rationale: 원문은 ‘touch’의 직접적 의미를 가지므로 이를 유지해야 하며, 동시에 한국어에서는 ‘손대다’보다 ‘만지다’가 문맥상 더 넓고 자연스럽습니다.
  doctrine_reference: 원문 밀착 번역 원칙
