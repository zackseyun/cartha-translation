base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/027.yaml
  text: If she tells them to make war[a], one against another, they do it; but if she sends them out against the enemies, they go and tear down the mountains and the walls and the towers.
  footnotes:
  - marker: a
    text: Or 'destroy' or 'overthrow' for 'tear down' (Greek κατεργάζονται); the verb here denotes forceful action against terrain and fortifications.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 그들에게 서로 서로를 향해 전쟁을 하라고 말하면 그들은 그렇게 합니다. 그러나 만일 그들을 적들 앞으로 보내시면, 그들은 가서 산들과 성벽들과 망대들을 무너뜨립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무너뜨립니다’는 여기서 산과 성벽, 망대에 대한 강한 파괴 행위를 나타냅니다. 그리스어 κατεργάζονται는 문맥상 ‘파괴하다/전복하다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπῃ
  english_pob_choice: If she tells
  chosen_korean: 만일 그들에게 … 말하면
  alternatives_korean:
  - 만일 그들에게 … 이르시면
  - 만일 그들에게 … 명하시면
  lexicon: LSJ
  rationale: 조건문의 일반성을 살리면서도 한국어로 자연스럽게 옮기기 위해 ‘말하면’을 택했습니다. 영어 POB의 ‘tells’처럼 직접 인용 없이 지시하는 뉘앙스를 유지합니다.
- source_word: ποιῆσαι πόλεμον ἕτερος πρὸς τὸν ἕτερον
  english_pob_choice: to make war, one against another
  chosen_korean: 서로 서로를 향해 전쟁을 하라고
  alternatives_korean:
  - 서로에게 전쟁을 일으키라고
  - 한 사람씩 서로 맞서 싸우라고
  lexicon: LSJ
  rationale: ‘make war’의 관용을 살리되, ἕτερος πρὸς τὸν ἕτερον의 상호 대립을 ‘서로 서로를 향해’로 드러냈습니다. 단순한 ‘싸우다’보다 전쟁의 강도를 보존합니다.
- source_word: ἐξαποστείλῃ αὐτοὺς πρὸς τοὺς πολεμίους
  english_pob_choice: sends them out against the enemies
  chosen_korean: 그들을 적들 앞으로 보내시면
  alternatives_korean:
  - 그들을 적들에게 보내시면
  - 그들을 적들 맞은편으로 파견하시면
  lexicon: LSJ
  rationale: ἐξαποστείλῃ의 ‘보내다/내보내다’와 전쟁 문맥을 함께 살리면서, 한국어로는 ‘적들 앞으로’가 가장 자연스럽고 발화 방향성을 분명히 합니다.
- source_word: κατεργάζονται τὰ ὄρη καὶ τὰ τείχη καὶ τοὺς πύργους
  english_pob_choice: tear down the mountains and the walls and the towers
  chosen_korean: 산들과 성벽들과 망대들을 무너뜨립니다
  alternatives_korean:
  - 산들과 성벽들과 망대들을 파괴합니다
  - 산들과 성벽들과 망대들을 허물어 버립니다
  lexicon: LSJ
  rationale: κατεργάζονται는 여기서 단순 ‘작업하다’가 아니라 거칠고 파괴적인 행동을 뜻하므로, POB의 ‘tear down’을 따라 ‘무너뜨립니다’로 옮겼습니다. ‘산들’은 문자적으로 유지해 원문 이미지를 보존합니다.
theological_decisions:
- issue: 여성 주어의 지시 대상 유지
  chosen_reading: 이 절은 앞문맥의 여인을 지시하므로, 한국어도 대명사나 생략된 주어로 자연스럽게 이어가되 ‘그녀’ 대신 문맥상 주체가 드러나게 구성했습니다.
  alternative_readings:
  - 매번 ‘그 여자가’라고 반복하기
  - 성별 표지를 지우고 무정칭으로 옮기기
  rationale: 그리스어는 이 절에서 주어를 반복하지 않지만 문맥상 여인을 가리킵니다. 한국어에서는 과도한 반복을 피하면서도 지시 대상을 분명히 하는 것이 원문 흐름에 더 가깝습니다.
  doctrine_reference: 문맥 지시어의 유지와 자연스러운 담화 결속
- issue: 군사적 파괴 동사의 강도
  chosen_reading: ‘무너뜨립니다’로 옮겨 산·성벽·망대에 가해지는 강한 파괴를 드러냈습니다.
  alternative_readings:
  - ‘파괴합니다’로 더 일반화하기
  - ‘정복합니다’로 완화하기
  rationale: 영어 POB도 ‘tear down’으로 거칠고 구체적인 파괴를 살리고 있으며, 그리스어 κατεργάζονται 역시 이 문맥에서 강한 행위를 뜻합니다. 따라서 완화하지 않고 파괴성을 유지했습니다.
  doctrine_reference: 원문이 가진 전쟁·파괴 이미지 보존
