    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσαν διάνοιαν
  english_pob_choice: every mind
  chosen_korean: 모든 마음
  alternatives_korean:
  - 모든 생각
  - 온 마음
  - 모든 뜻
  lexicon: BDAG
  rationale: διάνοια는 마음, 생각, 이해를 가리킬 수 있으므로, 분포적 의미를 살려 ‘모든 마음’으로 옮겼습니다.
- source_word: μεταστρέφει
  english_pob_choice: turns
  chosen_korean: 돌려 놓습니다
  alternatives_korean:
  - 바꿉니다
  - 전환시킵니다
  - 돌립니다
  lexicon: LSJ
  rationale: 동사의 핵심인 ‘돌리다/전환하다’를 살리되, 마음의 방향이 바뀌는 뉘앙스를 자연스럽게 표현했습니다.
- source_word: εἰς εὐωχίαν καὶ εὐφροσύνην
  english_pob_choice: to feasting and gladness
  chosen_korean: 잔치와 즐거움으로
  alternatives_korean:
  - 연회와 기쁨으로
  - 먹고 마심과 즐거움으로
  - 향연과 환희로
  lexicon: LSJ
  rationale: εὐωχία는 축제적 식사나 연회를 뜻하므로 ‘잔치’가 가장 직접적이고, εὐφροσύνη는 ‘즐거움’으로 무리 없이 대응됩니다.
- source_word: ὀφείλημα
  english_pob_choice: debt
  chosen_korean: 빚
  alternatives_korean:
  - 빚진 것
  - 빚
  - 빌린 것
  lexicon: BDAG
  rationale: ὀφείλημα은 문자적으로 ‘빚, 갚아야 할 것’이므로, POB의 ‘debt’를 따라 ‘빚’으로 옮겨 구체성을 살렸습니다.
theological_decisions:
- issue: 기억하지 않음의 일반화
  chosen_reading: ‘아무 슬픔도 아무 빚도 기억하지 않게 합니다’로, 일반적 주어 없이 보편적 효과를 표현했습니다.
  alternative_readings:
  - 그는 아무 슬픔도 아무 빚도 기억하지 않습니다
  - 사람은 아무 슬픔도 아무 빚도 기억하지 않습니다
  rationale: 그리스어의 단수 동사는 일반적 진술로 읽는 것이 자연스러우므로, 특정 인물로 한정하지 않고 보편적 효과를 드러냈습니다.
  doctrine_reference: 서사적 일반 진술 처리
