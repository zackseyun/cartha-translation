  text: and it turns every mind to feasting and gladness[b][a], and one remembers no sorrow and no debt.
  footnotes:
  - marker: a
    text: Or 'every thought' for 'every mind.'
    reason: lexical_alternative
  - marker: b
    text: Or 'no sorrow and nothing owed.' The Greek ὀφείλημα is literally 'debt' and may extend more broadly to obligations.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그것은 사람의 마음을 모두 잔치와 즐거움으로 돌리고, 어떤 슬픔이나 빚도 기억하지 않게 합니다.[a][b]
  philosophy: optimal-equivalence
