lexical_decisions:
- source_word: πλεῖον ... μᾶλλον ἢ
  english_pob_choice: more ... than
  chosen_korean: 더 ... 보다
  alternatives_korean:
  - 더 ... 보다도
  - 더욱 ... 보다
  lexicon: LSJ; BDAG
  rationale: 그리스어 비교 구문은 단순한 우위 비교를 나타내므로, 한국어에서도 자연스러운 비교 표현인 '더 ... 보다'로 옮겨 degree의 의미를 유지했습니다.
- source_word: ἀγαπᾷ
  english_pob_choice: loves
  chosen_korean: 사랑합니다
  alternatives_korean:
  - 좋아합니다
  - 애정합니다
  lexicon: BDAG
  rationale: ἀγαπάω의 기본 의미를 직역적으로 드러내면서도 현대 한국어에서 자연스럽고 공적 문체에 맞게 '사랑합니다'로 렌더링했습니다.
- source_word: τὴν ἰδίαν γυναῖκα
  english_pob_choice: his own wife
  chosen_korean: 자기 아내를
  alternatives_korean:
  - 자기 자신의 아내를
  - 그의 아내를
  lexicon: BDAG
  rationale: γυνή는 여기서 '아내'가 분명하고, ἰδίαν은 소유의 강조를 더하므로 한국어에서는 반복을 피하면서도 '자기'로 그 뉘앙스를 살렸습니다.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  english_pob_choice: his father and mother
  chosen_korean: 그의 아버지와 어머니보다
  alternatives_korean:
  - 아버지와 어머니보다
  - 부모보다
  lexicon: BDAG
  rationale: 원문은 단수형의 '아버지와 어머니'를 병렬로 제시하므로, 한국어도 이를 보존하고 문맥상 보충되는 소유를 '그의'로 드러냈습니다.
theological_decisions:
- issue: 본문의 결혼·부모 관계 우선순위 표현
  chosen_reading: 아내에 대한 사랑이 아버지와 어머니보다 더 크다는 비교를 그대로 유지했습니다.
  alternative_readings:
  - '''더 소중히 여깁니다''처럼 정서화하는 읽기'
  - '''우선한다''처럼 관계의 순서를 해석적으로 풀어 쓰는 읽기'
  rationale: 원문은 감정의 미묘한 재해석보다 단순 비교를 말하므로, 비교 구조를 보존해 독자가 본문의 직설성을 그대로 이해하도록 했습니다.
  doctrine_reference: 창세기 2:24의 결혼 결합 원리와 조화되지만, 여기서는 그 교리를 설명하기보다 비교 진술 자체를 우선합니다.
