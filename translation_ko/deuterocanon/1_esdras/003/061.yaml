base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/061.yaml
  text: Wine is unjust[a], the king is unjust, women are unjust, all the sons of men are unjust, and all their works are unjust—all such things. And there is no truth in them[b], and in their injustice they will perish.
  footnotes:
  - marker: a
    text: Or 'all these things' / 'everything of this sort' for 'all such things.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'the sons of men' is a literal rendering of a Greek idiom for humankind.
    reason: cultural_note
translation:
  language: ko
  text: 포도주도 불의하고, 왕도 불의하며, 여자들도 불의하고, 모든 사람의 아들들도 불의하며, 그들의 모든 행위도 모두 그러합니다. 그들 안에는 진리가 없고, 그들의 불의 가운데서 그들은 멸망할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모두 그러합니다’는 앞의 항목들을 묶는 말로, ‘이와 같은 모든 것’이라는 뜻도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘사람의 아들들’은 그리스어의 관용적 표현을 살린 것으로, 인류 전체를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἄδικος / ἄδικοι / ἄδικα
  english_pob_choice: unjust
  chosen_korean: 불의한
  alternatives_korean:
  - 의로운
  - 악한
  lexicon: BDAG
  rationale: 반복되는 형용사를 ‘불의한’으로 옮겨 앞의 ἄδικος와 뒤의 ἀδικία 사이의 어휘적 연결을 살렸습니다. ‘악한’은 도덕적 평가를 지나치게 강화하고, ‘의로운’은 반대말이지만 본문의 반복 효과를 덜 직접적으로 드러냅니다.
- source_word: υἱοὶ τῶν ἀνθρώπων
  english_pob_choice: the sons of men
  chosen_korean: 모든 사람의 아들들
  alternatives_korean:
  - 인간들
  - 사람의 자녀들
  lexicon: BDAG
  rationale: 그리스어의 관용적이고 성별이 표시된 표현을 최대한 보존해 직역성을 유지했습니다. POB의 ‘the sons of men’에 맞춰 ‘모든 사람의 아들들’로 옮기되, 한국어에서 의미가 분명하도록 자연스럽게 다듬었습니다.
- source_word: τὰ τοιαῦτα
  english_pob_choice: all such things
  chosen_korean: 모두 그러합니다
  alternatives_korean:
  - 이런 것들 모두
  - 그와 같은 모든 것들
  lexicon: BDAG
  rationale: 앞의 항목들을 포괄적으로 묶는 질적 표현이므로, 단순 지시어보다 ‘그와 같은 성질의 것들’이라는 뜻을 살리는 방향으로 처리했습니다. 문맥상 반복을 줄이기 위해 본문에는 ‘모두 그러합니다’로 응축했습니다.
- source_word: ἀλήθεια
  english_pob_choice: truth
  chosen_korean: 진리
  alternatives_korean:
  - 진실
  - 참됨
  lexicon: BDAG
  rationale: 불의와 대비되는 명사로서 ‘진리’가 가장 직접적입니다. ‘진실’은 말의 참됨에 치우칠 수 있고, ‘참됨’은 명사로서 다소 어색합니다.
- source_word: ἀπολοῦνται
  english_pob_choice: they will perish
  chosen_korean: 멸망할 것입니다
  alternatives_korean:
  - 망할 것입니다
  - 소멸할 것입니다
  lexicon: BDAG
  rationale: 미래 중간/수동형의 종국적 파멸을 자연스럽게 드러내는 한국어 표현으로 옮겼습니다. ‘망하다’보다 다소 격식 있고, 문맥의 심판적 결말을 더 분명히 보여 줍니다.
theological_decisions:
- issue: ‘포도주도 불의하다’는 의인화된 진술의 강도
  chosen_reading: 본문의 수사적 과장을 약화하지 않고 그대로 옮겨, 창조질서 전체가 왜곡되었다는 논지를 드러냈습니다.
  alternative_readings:
  - 포도주도 옳지 않습니다
  - 포도주는 잘못되었습니다
  rationale: 이 절은 논리적 진술이라기보다 수사적 열거와 과장에 가깝습니다. 그래서 도덕적 평가를 순화하지 않고 ‘불의하다’로 유지해 원문이 주는 충격을 보존했습니다.
  doctrine_reference: POB translation philosophy; source-driven rhetoric preservation
- issue: ‘왕’과 ‘여자들’의 보편 진술
  chosen_reading: 특정 인물 비판이 아니라 대표적 인간 범주를 열거하는 일반 진술로 읽고, 한국어에서도 그 대표성을 유지했습니다.
  alternative_readings:
  - 한 왕
  - 어떤 여자들
  rationale: 그리스어 정관사와 복수형의 결합은 개별 사례보다 유형적 진술을 가리킵니다. 따라서 한국어에서도 범주적 의미를 유지하는 것이 원문에 더 충실합니다.
  doctrine_reference: BDAG; gender/genre-sensitive literalness
