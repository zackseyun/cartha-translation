  yaml_path: translation/deuterocanon/1_esdras/003/052.yaml
  text: I saw him[a], and Apame, the daughter of the admirable Bartacus, the king’s concubine, sitting at the king’s right hand[b],
  footnotes:
  - marker: a
    text: Or 'Apama.' The Greek name Ἀπάμην can be transliterated in more than one standard English form.
    reason: lexical_alternative
  - marker: b
    text: The epithet for Bartacus literally means 'admirable,' 'remarkable,' or 'renowned.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 그를 보았고, 훌륭한[b] 바르타쿠스의 딸이며 왕의 첩인 아파메[a]가 왕의 오른편에 앉아 있는 것도 보았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ἀπάμην은 ‘아파마’로도 음역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: τοῦ θαυμαστοῦ는 문자적으로 ‘놀라운’, ‘존경할 만한’, 또는 ‘훌륭한’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθεώρουν
  english_pob_choice: I saw
  chosen_korean: 나는 ... 보았습니다
  alternatives_korean:
  - 나는 ... 바라보고 있었습니다
  - 나는 ... 관찰했습니다
  lexicon: LSJ
  rationale: 미완료 과거의 지속 뉘앙스가 있으나, 서술 흐름에서는 단순 과거형으로 자연스럽게 옮기는 것이 적절합니다. 1인칭 단수로 이해되는 문맥을 살려 ‘나는’과 ‘보았습니다’를 사용했습니다.
- source_word: Ἀπάμην
  english_pob_choice: Apame
  chosen_korean: 아파메
  alternatives_korean:
  - 아파마
  lexicon: LSJ
  rationale: 그리스어 대격형을 반영하는 표준 음역으로 옮겼습니다. 영어 POB의 ‘Apame’와 대응되며, 한국어 외래어 표기 관행상 ‘아파메’가 자연스럽습니다.
- source_word: τοῦ θαυμαστοῦ
  english_pob_choice: the admirable
  chosen_korean: 훌륭한
  alternatives_korean:
  - 감탄할 만한
  - 명망 높은
  - 존경할 만한
  lexicon: LSJ
  rationale: θαυμαστός는 ‘놀라운/존경받는/뛰어난’의 범위를 가지므로, 인명 수식어로서는 과도하게 제목화하지 않으면서 품격을 살리는 ‘훌륭한’이 무난합니다.
- source_word: παλλακήν
  english_pob_choice: concubine
  chosen_korean: 첩
  alternatives_korean:
  - 후궁
  - 첩실
  lexicon: LSJ
  rationale: 부부 관계 밖의 왕의 동반 여성을 가리키는 구체적 어휘이므로, 완곡한 표현보다 직역에 가까운 ‘첩’을 택했습니다.
theological_decisions:
- issue: 왕의 오른편이라는 위치 표현의 보존
  chosen_reading: ‘왕의 오른편에 앉아 있는’으로 직역해, 단순한 좌석 배치가 아니라 특권적 지위를 암시하는 표현을 유지했습니다.
  alternative_readings:
  - ‘왕의 오른쪽에’
  - ‘왕 옆에’
  rationale: 그리스어 ἐν δεξιᾷ는 관용적으로 높은 지위와 호의를 나타낼 수 있으므로, 이를 약화시키지 않고 보존하는 것이 본문 의미에 더 충실합니다.
  doctrine_reference: 성서의 상징적 공간 언어
- issue: 바르타쿠스의 수식어 처리
  chosen_reading: ‘훌륭한 바르타쿠스’로 옮겨, 인물의 평판을 나타내는 형용사를 생략하지 않았습니다.
  alternative_readings:
  - 수식을 생략
  - ‘명망 높은 바르타쿠스’
  rationale: θαυμαστός의 의미 범위를 문맥상 지나치게 좁히지 않으면서, 본문이 바르타쿠스에 부여하는 평가를 독자가 읽을 수 있도록 유지했습니다.
  doctrine_reference: 어휘적 정확성
