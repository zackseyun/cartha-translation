  verdict: revise
  source_fidelity: 수정이 필요합니다. 원문에서 ‘훌륭한/존경할 만한’(τοῦ θαυμαστοῦ)은 바르타쿠스를 수식하고, ‘왕의 첩’(τὴν παλλακὴν τοῦ βασιλέως)은 아파메를 수식합니다. 초안은 ‘훌륭한 바르타쿠스의 첩’으로 연결되어 아파메를 바르타쿠스의 첩으로 오해하게 합니다.
  naturalness: 초안의 병렬 구조는 수식 범위가 불명확합니다. 두 인물의 관찰과 아파메의 착석을 분명히 나누어 서술하면 현대 표준 한국어 합쇼체로 자연스럽고 정확합니다.
  terminology: ‘첩’은 παλλακή의 역사적 사회관계를 직접적으로 반영하는 적절한 표현입니다. ‘아파메’와 ‘바르타쿠스’도 무난합니다. 다만 각주 a는 본문 표기와 같은 ‘Apame’를 대안으로 제시하여 실질적인 대안이 되지 않으므로 ‘아파마’로 바로잡아야 합니다.
  issues:
