    rationale: 본문의 ‘아파메’는 이미 Apame에 해당하므로, ‘Apame로도’는 한국어 독자에게 대안 표기가 아닙니다. 대안 음역인 ‘아파마’를 제시하는 것이 적절합니다.
  - severity: low
