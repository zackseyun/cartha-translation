- from: 나는 그를 보았습니다. 그리고 바르타쿠스의 딸이요, 훌륭한 바르타쿠스의 첩인 아파메가 왕의 오른편에 앉아 있는 것을 보았습니다.[a][b]
  to: 나는 그를 보았고, 훌륭한[b] 바르타쿠스의 딸이며 왕의 첩인 아파메[a]가 왕의 오른편에 앉아 있는 것도 보았습니다.
