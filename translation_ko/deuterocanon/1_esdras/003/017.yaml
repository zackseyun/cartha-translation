  yaml_path: translation/deuterocanon/1_esdras/003/017.yaml
  text: 'And they said to them[a], “Tell us about what has been written.” And the first, who had spoken about the strength of wine[b], began and said thus:'
  footnotes:
  - marker: a
    text: Or “about the written statements.” The Greek phrase can refer collectively to the written compositions submitted for judgment.
    reason: lexical_alternative
  - marker: b
    text: Or “the power of wine.” The noun can denote strength, force, or power.
    reason: lexical_alternative
translation:
  language: ko
  text: '그들이 그들에게 말했습니다. 「기록된 것들[a]에 관하여 우리에게 말해 주십시오.」 그러자 포도주의 힘[b]에 관해 말했던 첫째 사람이 말을 시작하여 이렇게 말했습니다:'
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 또는 “기록된 글들에 대해.” 그리스어 표현은 심판을 위해 제출된 기록물 전체를 집합적으로 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “포도주의 능력.” 이 명사는 힘, 강함, 능력을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπαγγείλατε
  english_pob_choice: Tell / Report
  chosen_korean: 말해 주십시오
  alternatives_korean:
  - 전해 주십시오
  - 보고해 주십시오
  lexicon: LSJ
  rationale: 명령형 복수로서 공식적인 요청이므로, 지나치게 관료적인 ‘보고하다’보다 자연스럽고 격식 있는 「말해 주십시오」가 원문의 요구를 잘 살립니다.
- source_word: περὶ τῶν γεγραμμένων
  english_pob_choice: what has been written
  chosen_korean: 기록된 것들
  alternatives_korean:
  - 쓰인 것들
  - 적힌 것들
  - 기록된 문서들
  lexicon: LSJ
  rationale: γεγραμμένων은 이미 기록된 내용을 가리키므로, ‘기록된 것들’로 옮겨 문서/작품 전체를 포괄하는 뜻을 유지했습니다.
- source_word: ἰσχύος τοῦ οἴνου
  english_pob_choice: the strength of wine
  chosen_korean: 포도주의 힘
  alternatives_korean:
  - 포도주의 강함
  - 포도주의 세력
  - 포도주의 능력
  lexicon: LSJ
  rationale: ἰσχύς는 힘·강함·능력을 가리키며, 한국어에서는 ‘힘’이 가장 सीधे로 대응합니다. 포도주의 작용이나 효력을 논하는 문맥도 해치지 않습니다.
- source_word: ἔφη οὕτως
  english_pob_choice: said thus
  chosen_korean: 이렇게 말했습니다
  alternatives_korean:
  - 그렇게 말했습니다
  - 이와 같이 말했습니다
  lexicon: LSJ
  rationale: οὕτως의 지시적 기능을 살려, 직설적이면서도 현대 한국어에 자연스러운 ‘이렇게 말했습니다’로 처리했습니다.
