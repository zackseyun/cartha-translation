  text: 'And they said to them[a], “Tell us about what has been written.” And the first, who had spoken about the strength of wine[b], began and said thus:'
  footnotes:
  - marker: a
    text: Or “about the written statements.” The Greek phrase can refer collectively to the written compositions submitted for judgment.
    reason: lexical_alternative
  - marker: b
    text: Or “the power of wine.” The noun can denote strength, force, or power.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그들에게 말했습니다. 「기록된 것들에 대해 우리에게 말해 주십시오.」 그러자 먼저 말한 사람, 곧 포도주의 힘에 대해 말했던 사람이 일어나 이렇게 말했습니다:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “기록된 문장들에 대해.” 그리스어 표현은 심판에 제출된 기록물 전체를 집합적으로 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “포도주의 능력.” 이 명사는 힘, 강함, 능력을 뜻할 수 있습니다.
    reason: lexical_alternative
