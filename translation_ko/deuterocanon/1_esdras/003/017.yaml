  revision_rationale: ‘일어나’를 삭제하고 ἤρξατο의 의미를 ‘말을 시작하여’로 옮겼습니다. 나머지 핵심 표현은 원문의 범위와 영어 POB의 어휘 결정을 유지했으며, 각주 표지는 해당 표현 바로 뒤로 옮겼습니다.
