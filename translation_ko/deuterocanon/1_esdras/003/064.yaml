  yaml_path: translation/deuterocanon/1_esdras/003/064.yaml
  text: and in her judgment there is nothing unjust[a]. And this is the strength and the kingdom and the authority and the majesty of all the ages[b]. Blessed is the God of truth.
  footnotes:
  - marker: a
    text: Or 'in its judgment,' if the personification of 'truth' is not carried into English.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'of all the ages'; more idiomatically, 'forever and ever.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그녀의[a] 판단에는 아무런 불의가 없습니다. 이 진리가 곧 모든 시대에 걸친[b] 힘과 나라와 권위와 위엄입니다. 진리의 하나님은 찬송받으십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 αὐτῆς는 여성형 대명사로, 앞의 ‘진리’를 가리킵니다. 원문은 진리를 여성형으로 의인화합니다.
    reason: lexical_alternative
  - marker: b
    text: τῶν πάντων αἰώνων은 문자적으로 ‘모든 시대들의’라는 뜻입니다. ‘모든 시대에 걸친’은 관용적인 ‘영원히’로 바꾸지 않고 원문의 시간적 범위를 살린 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσις
  english_pob_choice: judgment
  chosen_korean: 판결
  alternatives_korean:
  - 심판
  - 재판
  - 판단
  lexicon: BDAG
  rationale: 여기서는 진리의 공정한 판단 행위를 가리키므로, 법정적 뉘앙스를 살리면서도 현대 한국어에서 자연스러운 ‘판결’로 옮겼습니다.
- source_word: ἄδικον
  english_pob_choice: unjust
  chosen_korean: 불의
  alternatives_korean:
  - 부정의
  - 부당한 것
  - 불공정
  lexicon: BDAG
  rationale: ἄδικον은 ‘의롭지 않음/불의함’을 뜻하므로, 판결 문맥에서 ‘아무런 불의가 없습니다’라고 하면 의미를 정확하고 간결하게 드러낼 수 있습니다.
- source_word: τῶν πάντων αἰώνων
  english_pob_choice: of all the ages
  chosen_korean: 모든 시대에 속한
  alternatives_korean:
  - 영원부터 영원까지의
  - 영원한
  - 모든 세대의
  lexicon: BDAG
  rationale: 영어 POB처럼 관용적 ‘영원히’로 완전히 풀어쓰기보다, 원문 표현을 살려 ‘모든 시대에 속한’으로 직역해 doxology의 시간적 범위를 드러냈습니다.
- source_word: εὐλογητός
  english_pob_choice: Blessed is
  chosen_korean: 복되십니다
  alternatives_korean:
  - 찬송받으십니다
  - 복을 받으십니다
  - 복되신 분입니다
  lexicon: BDAG
  rationale: 도송적 선언으로서 하나님께 대한 경배를 자연스럽게 드러내는 합쇼체 표현을 택했습니다.
theological_decisions:
- issue: ‘진리의 하나님’의 종결 형식
  chosen_reading: ‘복되십니다’로 마무리해 하나님께 대한 직접 찬양의 공적 어조를 유지했습니다.
  alternative_readings:
  - ‘찬송받으십니다’
  - ‘복되신 분입니다’
  rationale: 원문의 εὐλογητός는 단순 서술보다 축복/찬양 선언이므로, 한국어에서도 예배적 선언성을 보존하는 쪽이 더 충실합니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 1, 5
- issue: ‘판결’과 ‘불의’의 결합
  chosen_reading: 법정적 판단의 공정성으로 이해해 ‘판결에는 아무런 불의가 없습니다’라고 옮겼습니다.
  alternative_readings:
  - ‘심판에는 아무런 불의가 없습니다’
  - ‘판단에는 아무런 불의가 없습니다’
  rationale: 문맥상 진리의 개인화된 진술이지만, 한국어에서는 ‘판결’이 κρίσις의 공적·사법적 성격을 가장 명료하게 전달합니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 1, 3
