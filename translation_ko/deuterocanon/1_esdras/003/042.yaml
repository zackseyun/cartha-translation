  text: And leaving all these things behind[a], they gape at her; with mouths hanging open they stare at her, and all choose her rather than gold and silver and every beautiful thing.
  footnotes:
  - marker: a
    text: Or, 'all prefer her to gold and silver and every beautiful thing.' The Greek verb can carry the sense of choosing with implied preference in this comparative construction.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이 모든 것을 뒤로한 채, 그들은 그녀를 향해 입을 벌리고, 입을 벌린 채 그녀를 바라봅니다. 모두가 금과 은과 모든 아름다운 것보다 그녀를 택합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘모두가 그녀를 금과 은과 모든 아름다운 것보다 더 선호합니다.’ 그리스어 동사는 이 비교 구문에서 선호의 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφέντες
  english_pob_choice: leaving ... behind
  chosen_korean: 버려두고
  alternatives_korean:
  - 두고 떠나
  - 떠나서
  lexicon: BDAG
  rationale: ἀφίημι의 분사로서 앞의 것들을 제쳐 두고 뒤로 남겨두는 뉘앙스를 살리기 위해 ‘버려두고’로 옮겼습니다.
- source_word: εἰς αὐτὴν κέχηναν
  english_pob_choice: they gape at her
  chosen_korean: 그녀를 향해 입을 벌린 채 바라보며
  alternatives_korean:
  - 그녀를 향해 넋을 잃고 바라보며
  - 그녀를 향해 멍하니 바라보며
  lexicon: LSJ
  rationale: ‘입을 벌리고 응시하다’는 신체적 이미지를 유지하면서도 한국어로 자연스럽게 보이도록 풀어 옮겼습니다.
- source_word: ἀυτὴν αἱρετίζουσιν μᾶλλον ἢ
  english_pob_choice: choose her rather than
  chosen_korean: 그녀를 더 택하였습니다
  alternatives_korean:
  - 그녀를 더 선택하였습니다
  - 그녀를 오히려 택하였습니다
  lexicon: BDAG
  rationale: μᾶλλον ἢ의 비교 우위를 반영해 ‘더 택하다’로 옮겨 선호의 의미를 분명히 했습니다.
- source_word: πᾶν πρᾶγμα ὡραῖον
  english_pob_choice: every beautiful thing
  chosen_korean: 모든 아름다운 것
  alternatives_korean:
  - 모든 아름다운 물건
  - 아름다운 모든 것
  lexicon: BDAG
  rationale: πρᾶγμα의 넓은 범위를 살려 ‘것’으로 번역하고, ὡραῖον의 미적 가치를 ‘아름다운’으로 반영했습니다.
theological_decisions:
- issue: 비교구문에서의 선호 의미
  chosen_reading: 그녀를 금과 은과 모든 아름다운 것보다 더 가치 있게 여기는 선호의 비교로 옮겼습니다.
  alternative_readings:
  - 그녀를 선택하는 단순한 행위로만 옮김
  - 그녀를 다른 것들보다 더 사랑함으로 옮김
  rationale: αἱρετίζουσιν + μᾶλλον ἢ는 단순 선택보다 비교적 선호를 드러내므로, 본문이 강조하는 가치 판단을 유지했습니다.
