  text: And leaving all these things behind[a], they gape at her; with mouths hanging open they stare at her, and all choose her rather than gold and silver and every beautiful thing.
  footnotes:
  - marker: a
    text: Or, 'all prefer her to gold and silver and every beautiful thing.' The Greek verb can carry the sense of choosing with implied preference in this comparative construction.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이 모든 것을 버려두고 그녀를 향해 입을 벌린 채 바라보며, 모두가 금과 은과 모든 아름다운 것보다 그녀를 더 택하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그녀를 금과 은과 모든 아름다운 것보다 더 선호한다.’ 그리스어 동사는 이 비교구문에서 선호의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφέντες
  english_pob_choice: leaving ... behind
  chosen_korean: 버려두고
  alternatives_korean:
  - 두고 떠나
  - 떠나서
  lexicon: BDAG
  rationale: ἀφίημι의 분사로서 앞의 것들을 제쳐 두고 뒤로 남겨두는 뉘앙스를 살리기 위해 ‘버려두고’로 옮겼습니다.
- source_word: εἰς αὐτὴν κέχηναν
  english_pob_choice: they gape at her
  chosen_korean: 그녀를 향해 입을 벌린 채 바라보며
  alternatives_korean:
