base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/014.yaml
  text: And he sent and summoned all the nobles of Persia and Media[a], and the satraps and generals and local rulers and governors[b],
  footnotes:
  - marker: a
    text: Or, more formally, 'having sent out, he called.' The Greek participle likely implies that he sent out messengers or orders before the summons.
    reason: lexical_alternative
  - marker: b
    text: The sequence of official titles reflects Persian imperial administration; some terms can be rendered more literally as 'toparchs' and 'chief officials.'
    reason: cultural_note
translation:
  language: ko
  text: 그가 사람을 보내어, 페르시아와 메디아의 모든 귀족들과 사트라프들과 장군들과 지방 통치자들과 총독들을 불렀습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξαποστείλας
  english_pob_choice: he sent
  chosen_korean: 사람을 보내어
  alternatives_korean:
  - 보내어
  - 파견하여
  lexicon: LSJ
  rationale: 분사구가 주동사의 행위보다 선행하는 파견 동작을 나타내므로, 한국어에서도 ‘사람을 보내어’로 앞선 조치를 드러내는 것이 자연스럽습니다.
- source_word: ἐκάλεσεν
  english_pob_choice: summoned
  chosen_korean: 불렀습니다
  alternatives_korean:
  - 소집했습니다
  - 소환했습니다
  lexicon: LSJ
  rationale: 왕실의 명령으로 관료들을 불러들이는 상황이므로, 단순한 ‘부르다’보다 격을 살리면서도 현대 한국어에서 자연스러운 ‘불렀습니다’가 적절합니다.
- source_word: μεγιστᾶνας τῆς Περσίδος καὶ τῆς Μηδείας
  english_pob_choice: the nobles of Persia and Media
  chosen_korean: 페르시아와 메디아의 모든 귀족들
  alternatives_korean:
  - 페르시아와 메디아의 모든 대신들
  - 페르시아와 메디아의 모든 유력자들
  lexicon: LSJ
  rationale: μεγιστᾶνας는 제국의 최고위층을 가리키므로, 현대 독자가 이해하기 쉬운 ‘귀족들’로 옮기되 ‘모든’으로 전체 소집의 범위를 살렸습니다.
- source_word: σατράπας καὶ στρατηγοὺς καὶ τοπάρχας καὶ ὑπάτους
  english_pob_choice: the satraps and generals and local rulers and governors
  chosen_korean: 사트라프들과 장군들과 지방 통치자들과 총독들
  alternatives_korean:
  - 사트라프들과 장군들과 지역 통치자들과 고위 관료들
  - 사트라프들과 군사령관들과 지방 군주들과 총독들
  lexicon: LSJ
  rationale: 페르시아 제국 행정의 직함들을 서로 구별해 보여 주기 위해, 사트라프는 음역으로 보존하고 나머지는 기능을 드러내는 한국어로 옮겼습니다.
theological_decisions:
- issue: 페르시아 제국 관직 열거의 번역 방식
  chosen_reading: 직함의 역사성을 유지하되, 현대 독자가 역할을 파악할 수 있도록 일부는 음역, 일부는 기능역으로 처리했습니다.
  alternative_readings:
  - 모든 직함을 완전 음역하기
  - 모든 직함을 모두 풀어쓴 설명어로 바꾸기
  rationale: 본문은 특정 제국 행정 체계를 열거하므로, 역사적 색채를 지우지 않으면서도 읽기성을 확보하는 균형이 필요합니다.
  doctrine_reference: source_fidelity
- issue: ἐξαποστείλας와 ἐκάλεσεν의 행위 순서
  chosen_reading: ‘사람을 보내어’와 ‘불렀습니다’를 이어서, 파견 후 소집이라는 순서를 드러냈습니다.
  alternative_readings:
  - ‘보내고 불렀습니다’
  - ‘보내어 소집했습니다’
  rationale: 분사가 선행 조치를 나타내므로, 본문의 절차적 흐름을 한국어에서 분명히 보여 주는 편이 원문의 의미에 더 가깝습니다.
  doctrine_reference: narrative_precision
