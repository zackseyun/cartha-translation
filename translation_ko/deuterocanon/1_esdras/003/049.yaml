  - 여자들로 말미암아
  lexicon: LSJ
  rationale: διά + 목적격의 원인 용법을 가장 분명하게 드러내는 말로 옮겼습니다.
- source_word: δοῦλοι
  english_pob_choice: slaves
  chosen_korean: 노예가 되었습니다
  alternatives_korean:
