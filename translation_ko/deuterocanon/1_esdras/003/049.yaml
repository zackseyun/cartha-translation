  yaml_path: translation/deuterocanon/1_esdras/003/049.yaml
  text: And many lost their senses because of women[a], and became slaves because of them;
  footnotes:
  - marker: a
    text: Or 'many were led astray in their own minds because of women.' The Greek expression is somewhat idiomatic, combining a verb of losing reason with 'their own minds/thoughts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 많은 사람이 여자들 때문에 제정신을 잃었고, 그들 때문에 노예가 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘많은 사람이 여자들 때문에 자기들의 생각 속에서 미혹되었다.’ 그리스어 표현은 관용적이며, 이성을 잃는 동작과 ‘자기들의 마음/생각’을 함께 묶습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπενοήθησαν
  english_pob_choice: lost their senses
  chosen_korean: 제정신을 잃었고
  alternatives_korean:
  - 분별을 잃었고
  - 미혹되었고
  - 어리석어졌고
  lexicon: LSJ
  rationale: ‘아πονοέω’의 핵심은 이성을 잃거나 정신이 흐려지는 뜻이므로, 현대 한국어에서 자연스러운 ‘제정신을 잃다’로 옮겼습니다.
- source_word: ταῖς ἰδίαις διανοίαις
  english_pob_choice: their senses
  chosen_korean: 제정신을
  alternatives_korean:
  - 자기들의 생각을
  - 자기들의 마음을
  - 자기들의 분별을
  lexicon: LSJ
  rationale: 직역하면 ‘자기들의 생각/마음 안에서’이지만, 앞의 ‘제정신을 잃다’와 결합해 그 의미를 살리는 쪽이 한국어로 더 정확합니다.
- source_word: διὰ τὰς γυναῖκας
  english_pob_choice: because of women
  chosen_korean: 여자들 때문에
  alternatives_korean:
  - 여자들로 인해
  - 여자들 탓에
  - 여자들로 말미암아
  lexicon: LSJ
  rationale: διά + 목적격의 원인 용법을 가장 분명하게 드러내는 말로 옮겼습니다.
- source_word: δοῦλοι
  english_pob_choice: slaves
  chosen_korean: 노예가 되었습니다
  alternatives_korean:
  - 종이 되었습니다
  - 종살이하게 되었습니다
  - 노예가 되었습니다
  lexicon: LSJ
  rationale: 이 구절은 실제적 종속 상태를 강하게 말하므로, 프로젝트 기본값 중에서도 더 직접적인 ‘노예’가 원문과 영어 POB의 취지를 잘 보존합니다.
