translation:
  language: ko
  text: 그리고 많은 사람이 여자들 때문에 제정신을 잃었고, 그들 때문에 노예가 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘많은 사람이 여자들 때문에 자기들의 생각에서 미혹되었다.’ 그리스어 표현은 관용적이며, 이성을 잃는 동작과 ‘자기들의 마음/생각’을 함께 묶습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπενοήθησαν
  english_pob_choice: lost their senses
  chosen_korean: 제정신을 잃었고
  alternatives_korean:
  - 분별을 잃었고
  - 미혹되었고
  - 어리석어졌고
  lexicon: LSJ
  rationale: ‘아πονοέω’의 핵심은 이성을 잃거나 정신이 흐려지는 뜻이므로, 현대 한국어에서 자연스러운 ‘제정신을 잃다’로 옮겼습니다.
- source_word: ταῖς ἰδίαις διανοίαις
