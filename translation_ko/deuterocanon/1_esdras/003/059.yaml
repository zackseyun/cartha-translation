base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/059.yaml
  text: Is not the one who does these things great? And truth is great, and stronger than everything[a][b].
  footnotes:
  - marker: a
    text: Or 'he who does these things.' The Greek leaves the referent implicit; the broader context may suggest God, but the clause itself does not name him.
    reason: alternative_reading
  - marker: b
    text: Or 'stronger than all things.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이러한 일들을 행하는 이[a]가 크지 않습니까? 진리는 크며, 모든 것보다 더 강합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이것들을 행하는 이’. 그리스어는 행위자의 지시 대상을 명시하지 않으며, 더 넓은 문맥은 하나님을 시사할 수 있지만 이 절 자체는 그를 이름으로 밝히지 않습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘만물보다 더 강합니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχὶ
  english_pob_choice: Is not
  chosen_korean: …않습니까?
  alternatives_korean:
  - …아닙니까?
  - …하지 않습니까?
  lexicon: BDAG
  rationale: 반어적 질문으로서 긍정의 답을 기대하는 구조를 살리기 위해 합쇼체 의문형으로 처리했습니다.
- source_word: ὃς ταῦτα ποιεῖ
  english_pob_choice: the one who does these things
  chosen_korean: 이 일을 행하는 이
  alternatives_korean:
  - 이것들을 하는 이
  - 이 일을 하는 분
  lexicon: BDAG
  rationale: 주어를 본문처럼 명시하지 않고, 속격적 관계절의 일반적 인물을 한국어 자연문으로 옮겼습니다. ‘분’은 해석을 앞서므로 피했습니다.
- source_word: ἀλήθεια
  english_pob_choice: truth
  chosen_korean: 진리
  alternatives_korean:
  - 진실
  - 참됨
  lexicon: BDAG
  rationale: 지혜문학적 선언에서 추상명사 ἀλήθεια는 단순한 사실 여부보다 보편적 진리/실재를 가리키므로 ‘진리’가 가장 직접적입니다.
- source_word: ἰσχυροτέρα παρὰ πάντα
  english_pob_choice: stronger than everything
  chosen_korean: 모든 것보다 더 강합니다
  alternatives_korean:
  - 모든 것보다 강합니다
  - 만물보다 더 강합니다
  lexicon: BDAG
  rationale: 비교급과 보편 비교 표현을 자연스러운 한국어로 살리되, ‘모든 것’이 가진 총괄적 범위를 유지했습니다.
theological_decisions:
- issue: 행위자의 정체를 본문에서 밝히지 않는 문제
  chosen_reading: 주어를 ‘이 일을 행하는 이’로 유지해 본문이 이름을 밝히지 않는 상태를 보존했습니다.
  alternative_readings:
  - 하나님이 이 일을 행하시는 분으로 명시
  - 메시아적 인물로 구체화
  rationale: 그리스어는 이 절에서 행위자를 명시하지 않으므로, 문맥상 가능성이 있더라도 번역문에서 신학적으로 특정하지 않았습니다.
  doctrine_reference: 원문 우선과 해석의 유보; 문맥 가능성은 주석층에 남김
