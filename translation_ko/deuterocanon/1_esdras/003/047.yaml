base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/047.yaml
  text: and he watches for the lion[a], and walks in darkness; and whenever he steals and snatches and breaks in[c][b], he brings it to his beloved.
  footnotes:
  - marker: a
    text: Or 'looks at the lion.' The Greek verb can denote attentive looking or observing; the context favors a more purposeful sense.
    reason: lexical_alternative
  - marker: b
    text: The final verb for theft (κλωποδυτήσῃ) refers specifically to stealing by stealth, especially by housebreaking; hence 'breaks in.'
    reason: lexical_alternative
  - marker: c
    text: Or 'his lover' or 'the woman he loves.' The Greek τῇ ἐρωμένῃ denotes a beloved woman in a romantic sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 사자[a]를 살피며 어둠 속을 걸어갑니다. 그리고 언제나 훔치고 낚아채고[b] 몰래 들어가서[c] 그것을 그의 사랑하는 여자에게 가져갑니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사자를 바라봅니다.’ θεωρεῖ는 주의 깊게 보는 행위일 수 있으며, 문맥상 ‘살피다’가 더 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: κλωποδυτήσῃ는 특히 은밀한 절도, 곧 주거 침입을 가리키므로 ‘몰래 들어가다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그의 연인’ 또는 ‘그가 사랑하는 여자’. τῇ ἐρωμένῃ는 연애적 의미의 사랑하는 여자를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖ
  english_pob_choice: watches for
  chosen_korean: 살피며
  alternatives_korean:
  - 바라보며
  - 관찰하며
  - 주시하며
  lexicon: LSJ
  rationale: 단순한 ‘보다’보다 의도적으로 주의를 기울여 지켜본다는 뜻을 살리기 위해 ‘살피다’를 택했습니다.
- source_word: λέοντα
  english_pob_choice: the lion
  chosen_korean: 사자
  alternatives_korean:
  - 그 사자
  - 한 사자
  lexicon: LSJ
  rationale: 헬라어의 정관사는 문맥상 특정된 대상을 가리키지만, 한국어에서는 자연스럽게 ‘사자’로 옮겨도 의미가 유지됩니다.
- source_word: κλωποδυτήσῃ
  english_pob_choice: breaks in
  chosen_korean: 몰래 들어가서
  alternatives_korean:
  - 침입해서
  - 집을 털어서
  - 도둑질해서
  lexicon: LSJ
  rationale: 이 희귀 동사는 특히 은밀한 절도, 곧 주거 침입을 가리키므로 문맥을 살려 ‘몰래 들어가서’로 옮겼습니다.
- source_word: τῇ ἐρωμένῃ
  english_pob_choice: his beloved
  chosen_korean: 그의 사랑하는 여자
  alternatives_korean:
  - 그의 연인
  - 그가 사랑하는 여자
  - 그의 애인
  lexicon: LSJ
  rationale: ἐρωμένη는 연애적 의미의 ‘사랑받는 여자’를 가리키므로, 지나치게 현대적이거나 성적인 뉘앙스를 덜어내면서도 관계의 성격을 드러내기 위해 이렇게 옮겼습니다.
theological_decisions:
- issue: 폭력적·은밀한 행위의 연속 동사 처리
  chosen_reading: ‘훔치고 낚아채고 몰래 들어가서’로 연속 동작을 살려, 본문의 거친 범죄 묘사를 완화하지 않았습니다.
  alternative_readings:
  - ‘훔치고 빼앗고 들어가서’
  - ‘훔치고 강탈하고 몰래 들어가서’
  rationale: 원문은 세 동사를 병렬로 쌓아 행위의 연속성과 난폭함을 강조하므로, 한국어에서도 그 강도를 유지했습니다.
  doctrine_reference: source fidelity / narrative force
