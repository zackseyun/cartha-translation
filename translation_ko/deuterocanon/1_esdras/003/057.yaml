  yaml_path: translation/deuterocanon/1_esdras/003/057.yaml
  text: Men[a], are not women strong? Great is the earth, and high is heaven, and swift in its course is the sun, because it turns in the circuit of heaven.
  footnotes:
  - marker: a
    text: Or, 'for it revolves in the circle of heaven.'
    reason: lexical_alternative
translation:
  language: ko
  text: 남자들이여, 여자들이 강하지 않습니까? 땅은 크고 하늘은 높으며, 해는 그 운행이 빠릅니다. 이는 하늘의 궤도 안에서 돌기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘하늘의 원 안에서 돕니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες
  english_pob_choice: Men
  chosen_korean: 사람들이여
  alternatives_korean:
  - 남자들이여
  - 여러분
  lexicon: LSJ
  rationale: 직접 호격의 수사적 호소를 살리되, 한국어에서는 단순 남성 지칭보다 담론 전체를 부르는 호칭이 자연스러워 ‘사람들이여’로 옮겼습니다.
- source_word: οὐκ ἰσχυραὶ αἱ γυναῖκες
  english_pob_choice: are not women strong?
  chosen_korean: 여자들이 강하지 않습니까?
  alternatives_korean:
  - 여자들은 강하지 않습니까?
  - 여자들이 힘이 세지 않습니까?
  lexicon: LSJ
  rationale: ἰσχυραὶ는 힘/강함을 뜻하므로 ‘강하다’가 가장 सीधे하며, POB의 수사적 의문문 구조도 그대로 반영했습니다.
- source_word: ταχὺς τῷ δρόμῳ ὁ ἥλιος
  english_pob_choice: swift in its course is the sun
  chosen_korean: 해는 자기의 달리기에 빠른데
  alternatives_korean:
  - 해는 그 길을 빠르게 달리는데
  - 해는 그 경주에 빠른데
  lexicon: LSJ
  rationale: δρόμος를 단순 ‘속도’보다 ‘달리기/주행’의 이미지로 살리기 위해 직역에 가까운 표현을 택하되, 한국어 문장 흐름을 위해 ‘자기의’로 보완했습니다.
- source_word: ἐν τῷ κύκλῳ τοῦ οὐρανοῦ
  english_pob_choice: in the circuit of heaven
  chosen_korean: 하늘의 궤도를 돕니다
  alternatives_korean:
  - 하늘의 원을 돕니다
  - 하늘의 둘레를 돕니다
  lexicon: LSJ
  rationale: κύκλος의 ‘원/회전하는 궤도’ 의미를 현대 한국어에서 자연스럽게 전달하기 위해 ‘궤도’로 옮겼고, 천문적 순환 이미지를 유지했습니다.
theological_decisions:
- issue: Οὐρανός의 번역을 ‘하늘’로 할지 ‘천국’으로 할지
  chosen_reading: 여기서는 우주론적 의미의 sky/heaven이므로 ‘하늘’로 번역했습니다.
  alternative_readings:
  - 천국
  - 하늘나라
  rationale: 문맥이 신학적 ‘천국’이 아니라 창조 질서의 높이와 태양의 운동을 말하므로, 독자가 본문의 자연적 비유를 바로 이해하도록 ‘하늘’이 적절합니다.
  doctrine_reference: 창조세계의 질서에 대한 성경적 표현
