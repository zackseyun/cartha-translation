base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/005.yaml
  text: Let each of us speak one word that will prevail[a]; and whoever's statement is shown to be wiser than the other's, Darius the king will give him great gifts and great victory honors[b],
  footnotes:
  - marker: a
    text: Or 'one statement' for 'one word' (λόγον); the Greek can denote a saying, statement, or argument, but the more literal wording preserves the challenge's concise form.
    reason: lexical_alternative
  - marker: b
    text: '''Victory honors'' renders ἐπινίκια, honors or prizes given for victory; the term is distinct from the preceding ''gifts.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 우리 각자가 이길 한마디씩 말합시다. 그리고 그 말이 다른 사람의 말보다 더 지혜로운 것으로 드러나는 이에게 다리오 왕은 큰 선물들과 큰 승리의 포상들을 줄 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: ‘한마디’는 λόγον의 간결한 형식을 살린 번역입니다. 이 말은 발언, 진술, 주장 등의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘승리의 포상들’은 ἐπινίκια를 옮긴 것으로, 앞의 ‘선물들’과 구별되는 승리에 따른 상이나 영예를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἴπωμεν ἕκαστος ἡμῶν
  english_pob_choice: Let each of us speak
  chosen_korean: 각자 우리 가운데 한 마디를 말하여
  alternatives_korean:
  - 우리 각자가 말합시다
  - 각자 한 마디씩 말합시다
  lexicon: LSJ
  rationale: Ἐίπωμεν은 권유법이므로 한국어에서는 함께 제안하는 형태로 옮기고, ἕκαστος ἡμῶν의 분배적 뜻을 ‘각자 우리 가운데’로 살렸습니다.
- source_word: ἕνα λόγον
  english_pob_choice: one word
  chosen_korean: 한 마디
  alternatives_korean:
  - 한 말
  - 한 진술
  - 한 말씀
  lexicon: LSJ
  rationale: λόγος의 간결한 결투 형식을 살리기 위해 직역보다 자연스러운 ‘한 마디’를 택해, 앞선 영어 POB의 ‘one word’와 같은 압축감을 유지했습니다.
- source_word: ὑπερισχύσει
  english_pob_choice: that will prevail
  chosen_korean: 이기게
  alternatives_korean:
  - 우세하게
  - 우세할
  - 이길
  lexicon: LSJ
  rationale: ὑπερισχύω는 ‘이기다, 우세하다, 능가하다’의 뜻이므로, 논쟁의 승패를 드러내는 ‘이기게’가 문맥상 가장 자연스럽습니다.
- source_word: τὸ ῥῆμα αὐτοῦ σοφώτερον τοῦ ἑτέρου
  english_pob_choice: his statement is shown to be wiser than the other's
  chosen_korean: 누구의 말이 다른 사람의 것보다 더 지혜로운 것으로 드러나든지
  alternatives_korean:
  - 그의 진술이 다른 이의 것보다 더 지혜로운 것으로 드러나든지
  - 그의 말이 상대보다 더 지혜롭다고 나타나든지
  lexicon: LSJ
  rationale: ῥῆμα는 여기서 실제로 내놓는 발언이므로 ‘말’로 옮겼고, 비교 구문은 ‘더 지혜로운 것으로 드러나든지’로 판정의 의미를 분명히 했습니다.
- source_word: ἐπινίκια μεγάλα
  english_pob_choice: great victory honors
  chosen_korean: 큰 승리의 상급들
  alternatives_korean:
  - 큰 승리의 영예들
  - 큰 승리 상들
  - 큰 승전 상급들
  lexicon: LSJ
  rationale: ἐπινίκια는 단순한 선물(δωρεάς)과 구별되는 승리 보상·영예를 가리키므로, 이를 ‘승리의 상급들’로 구분해 옮겼습니다.
theological_decisions:
- issue: '왕이 주는 보상의 이중성: 선물과 ἐπινίκια의 구별'
  chosen_reading: ‘큰 선물들’과 ‘큰 승리의 상급들’을 분리해, 물질적 증여와 승리의 명예 보상을 함께 제시하는 것으로 읽었습니다.
  alternative_readings:
  - 두 표현을 모두 단순히 ‘큰 상들’로 합치는 읽기
  - ‘승리의 상급들’을 단지 선물의 반복으로 보는 읽기
  rationale: 본문은 δωρεάς와 ἐπινίκια를 나란히 두어 서로 다른 종류의 보상을 말하므로, 한국어에서도 구별을 유지하는 편이 원문의 긴장을 더 잘 보존합니다.
  doctrine_reference: 문학적·역사적 본문 해석 원칙
