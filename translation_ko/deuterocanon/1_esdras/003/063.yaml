  source_fidelity: 그리스어의 여성 단수 지시와 ἀπό의 분리·대조 기능은 대체로 반영하려 했으나, 본문의 ‘그’·‘그와’·‘그의’는 남성 대명사여서 여성형 의인화와 맞지 않습니다. 또한 ‘것들’은 τῶν ἀδίκων καὶ πονηρῶν의 사람 지시 가능성을 본문에서 배제합니다.
  naturalness: ‘그와 함께는’은 현대 한국어에서 부자연스럽고, ‘그녀에게는’이 관계적 의미를 자연스럽게 전달합니다. ‘그의 일들을 좋게 여깁니다’도 성별 지시가 어긋나므로 ‘그녀가 하는 일을 좋게 여깁니다’로 다듬는 것이 자연스럽습니다.
  terminology: λαμβάνειν πρόσωπα는 ‘편파’, διαφορά는 문맥상 ‘차별’로 옮길 수 있습니다. τὰ δίκαια는 ‘의로운 일’, εὐδοκοῦσι는 ‘좋게 여기다’가 적절합니다. ἀπό 구문의 대상이 악한 일인지 악한 사람인지 확정되지 않으므로 각주에서 양 가능성을 유지해야 합니다.
