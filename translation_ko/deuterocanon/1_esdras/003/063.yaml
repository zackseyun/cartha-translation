  yaml_path: translation/deuterocanon/1_esdras/003/063.yaml
  text: and with her there is no partiality or distinction, but she does what is righteous apart from all that is unjust and evil; and all approve of her works,
  footnotes:
  - marker: a
    text: Literally, 'to receive faces,' an idiom meaning to show favoritism or partiality.
    reason: lexical_alternative
  - marker: b
    text: Or 'separate from all the unjust and evil.' The Greek phrase may be understood as separation from unjust and evil things, or more personally from unjust and evil people.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그녀에게는 편파나 차별이 없으며, 모든 불의하고 악한 것과는 달리 의로운 일을 합니다.[a][b] 모두가 그녀가 하는 일을 좋게 여깁니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘얼굴을 받다’라는 관용구로, 사람을 보고 편애하거나 편파적으로 대하는 것을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘모든 불의하고 악한 것들로부터/그것들과는 달리’라는 뜻입니다. 여기의 표현은 불의하고 악한 일들을 가리킬 수도 있고, 불의하고 악한 사람들을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρʼ αὐτῇ
  english_pob_choice: with her
  chosen_korean: 그와 함께는
  alternatives_korean:
  - 그와 더불어는
  - 그에게는
  - 그 앞에서는
  lexicon: LSJ
  rationale: Wisdom을 가리키는 여성형 인칭을 한국어에서는 자연스럽게 받침 없이 연결해 관계성을 살렸습니다. “함께”는 장소보다 동반·관계의 뉘앙스를 보존합니다.
- source_word: λαμβάνειν πρόσωπα
  english_pob_choice: partiality
  chosen_korean: 편파
  alternatives_korean:
  - 사람을 차별하여 대함
  - 편애
  - 사람의 낯을 봄
  lexicon: LSJ
  rationale: 직역인 ‘얼굴/낯을 받다’의 관용적 의미가 편애·편파이므로, 현대 한국어에서 짧고 의미가 분명한 “편파”로 옮겼습니다.
- source_word: διαφορά
  english_pob_choice: distinction
  chosen_korean: 구별
  alternatives_korean:
  - 차별
  - 구분
  - 차이
  lexicon: LSJ
  rationale: 앞의 ‘편파’와 병렬되는 부정 표현으로서 사람 사이를 나누어 대하는 행위를 가리키므로, 중립적이되 윤리적 뉘앙스를 살리는 “구별”을 택했습니다.
- source_word: τὰ δίκαια ποιεῖ
  english_pob_choice: does what is righteous
  chosen_korean: 의로운 일을 하며
  alternatives_korean:
  - 의로운 것을 행하며
  - 옳은 일을 하며
  - 의를 행하며
  lexicon: LSJ
  rationale: 중성 복수 명사구는 행위 전반을 가리키므로, 한국어에서는 자연스러운 관용인 “의로운 일을 하며”로 풀어 의미를 살렸습니다.
- source_word: ἀπὸ πάντων τῶν ἀδίκων καὶ πονηρῶν
  english_pob_choice: apart from all that is unjust and evil
  chosen_korean: 모든 불의하고 악한 것들에서 벗어나
  alternatives_korean:
  - 모든 불의하고 악한 것들과 분리되어
  - 모든 불의하고 악한 것들로부터 떨어져
  - 모든 불의하고 악한 사람들에서 벗어나
  lexicon: LSJ
  rationale: ἀπό의 분리 의미를 살리면서도, POB의 해석 범위처럼 사물/행동과 사람 모두를 포괄할 수 있게 “것들”로 두었습니다.
- source_word: εὐδοκοῦσι τοῖς ἔργοις αὐτῆς
  english_pob_choice: approve of her works
  chosen_korean: 모두가 그의 일들을 좋게 여깁니다
  alternatives_korean:
  - 모두가 그의 일들을 승인합니다
  - 모두가 그의 일들을 기뻐합니다
  - 모두가 그의 일들을 좋아합니다
  lexicon: LSJ
  rationale: εὐδοκέω의 ‘좋게 여기다/기뻐하다/승인하다’ 가운데, 평가·찬동의 의미를 살리면서 문장 흐름이 자연스러운 표현으로 옮겼습니다.
theological_decisions:
- issue: 의인화된 대상의 인칭 유지
  chosen_reading: 여성형 그리스어를 반영해 한국어에서도 일관되게 ‘그’가 아닌 ‘그녀/그와’ 계열의 인칭을 쓰는 대신, 문장 전체를 의인화된 지시로 처리했습니다.
  alternative_readings:
  - 명사를 반복해 ‘지혜와 함께는’으로 옮김
  - 무생물처럼 ‘그것’으로 처리함
  rationale: 본문은 지혜를 여성형으로 의인화하므로, 인칭 흔적을 지우면 문학적·신학적 구조가 약해집니다. 다만 한국어에서는 성별 대명사보다 문장 구조로 의인화를 유지하는 편이 더 자연스럽습니다.
  doctrine_reference: 'DOCTRINE.md: 본문의 수사와 신학적 긴장을 유지하고, 불필요한 평준화를 피함'
