    text: 직역하면 ‘오 사람들아, 포도주가 이렇게 행하도록 강제하기 때문에 우세하지 않느냐?’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὦ ἄνδρες
  english_pob_choice: Men
