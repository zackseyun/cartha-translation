  - 그리고 그는 이렇게 말하고서 침묵했습니다
  - 그리고 그는 그렇게 말한 후 침묵하였습니다
  lexicon: LSJ
  rationale: ἐσίγησεν의 상태 전환을 ‘잠잠해지다’로 자연스럽게 표현했고, 분사 구문은 ‘이렇게 말하고는’으로 시간 순서를 반영했습니다.
