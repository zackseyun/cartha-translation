  rationale: ἀναγκάζει의 강제성을 살리면서 ποιεῖν의 넓은 ‘행하다/하다’를 한국어에서 간결하게 반영했습니다.
- source_word: ἐσίγησεν οὕτως εἴπας
  english_pob_choice: And he became silent after saying this
  chosen_korean: 그리고 그는 이렇게 말하고는 잠잠해졌습니다
  alternatives_korean:
