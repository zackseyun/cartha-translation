  text: And then[a], after each had written his own statement, they sealed them and placed them under the pillow of Darius the king,
  footnotes:
  - marker: a
    text: Or 'under the headrest of Darius the king.' The Greek προσκεφάλαιον can denote a pillow or headrest.
