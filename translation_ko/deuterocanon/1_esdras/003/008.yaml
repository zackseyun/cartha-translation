    issue: ‘그리고 그때’의 중복된 서사 접속
    rationale: καὶ τότε를 직역적으로 겹쳐 옮긴 표현입니다. ‘그러자’가 접속사와 시간 부사의 기능을 자연스럽게 함께 전달합니다.
  - severity: medium
    issue: λόγος를 ‘진술서’로 특정함
    rationale: 원문은 작성된 λόγος, 곧 말·명제·글을 가리키며 ‘진술서’는 공식 문서라는 현대적 의미를 불필요하게 부가합니다. ‘자기 글’이 더 중립적입니다.
  - severity: low
