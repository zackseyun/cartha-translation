lexical_decisions:
- source_word: γράφψαντες
  english_pob_choice: after each had written
  chosen_korean: 각자가 … 쓴 뒤
  alternatives_korean:
  - 각자가 … 썼고
  - 써서
  lexicon: LSJ
  rationale: 분사구문의 시간적 선행 관계를 한국어에서 자연스럽게 드러내기 위해 ‘…쓴 뒤’로 옮겼습니다.
- source_word: τὸν ἑαυτοῦ λόγον
  english_pob_choice: his own statement
  chosen_korean: 자기의 진술서
  alternatives_korean:
  - 자기 말
  - 자기 주장
  - 자기 설명
  lexicon: LSJ
  rationale: 경연 맥락에서 λόγος는 개별 참가자가 적어 낸 제출문을 가리키므로, 단순한 ‘말’보다 ‘진술서’가 더 정확하고 문맥에 맞습니다.
- source_word: ἐσφραγίσαντο
  english_pob_choice: they sealed them
  chosen_korean: 그것들을 봉인하여
  alternatives_korean:
  - 봉인하고
  - 인봉하여
  lexicon: LSJ
  rationale: 복수 목적어가 문맥상 앞선 진술서를 가리키므로 ‘그것들을’로 보충했고, 문서 봉인의 의미를 살려 ‘봉인하여’로 옮겼습니다.
- source_word: ὑπὸ τὸ προσκεφάλαιον
  english_pob_choice: under the pillow
  chosen_korean: 베개 아래에
  alternatives_korean:
  - 머리받침 아래에
  - 머리맡 아래에
  lexicon: LSJ
  rationale: προσκεφάλαιον은 ‘베개/머리받침’을 뜻할 수 있으나, 한국어에서는 ‘베개 아래’가 가장 분명하고 자연스럽습니다.
