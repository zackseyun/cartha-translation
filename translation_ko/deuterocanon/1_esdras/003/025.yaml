  text: O men[a], do not men prevail, since they rule over the earth and the sea and everything in them?
  footnotes:
  - marker: a
    text: Or, more literally, 'do not men prevail, ruling over the earth and the sea and all things in them?' The Greek uses a rhetorical question expecting the answer yes.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람들아, 사람이 땅과 바다와 그 안에 있는 모든 것을 지배하며 그 위에 군림하는데, 사람이 정말 우세하지 않느냐?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 문자적으로는 ‘땅과 바다와 그 안의 모든 것을 지배하면서 사람이 정말 우세하지 않느냐?’로 옮길 수 있습니다. 그리스어는 긍정 답을 기대하는 수사 의문입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ ἄνδρες
  english_pob_choice: O men
  chosen_korean: 사람들아
  alternatives_korean:
  - 남자들아
  - 사람들이여
  lexicon: LSJ
  rationale: 호격 복수의 직접 부름을 살리되, 현대 한국어에서는 성별이 드러나는 ‘남자들아’보다 자연스러운 호소형 ‘사람들아’가 수사적 발화를 더 잘 전달합니다.
- source_word: οὐχ ὑπερισχύουσιν
  english_pob_choice: do not ... prevail
  chosen_korean: 정말 우세하지 않느냐
  alternatives_korean:
  - 정복하지 않느냐
  - 능가하지 않느냐
  - 우세하지 않느냐
  lexicon: LSJ
  rationale: ὑπερισχύω는 ‘더 강하다/우세하다/이기다’의 의미이므로, 문맥의 수사 의문을 살려 ‘우세하지 않느냐’로 옮겼습니다.
- source_word: κατακρατοῦντες
  english_pob_choice: since they rule over
  chosen_korean: 지배하며 그 위에 군림하는데
  alternatives_korean:
  - 다스리며
  - 주관하며
  - 장악하며
  lexicon: LSJ
  rationale: 분사 구문이 앞의 진술을 설명하므로, 인간이 땅과 바다를 실제로 지배하는 상태를 ‘지배하며 그 위에 군림하는데’로 풀어 관계를 분명히 했습니다.
- source_word: τὴν γῆν καὶ τὴν θάλασσαν ... πάντα τὰ ἐν αὐτοῖς
  english_pob_choice: the earth and the sea and everything in them
  chosen_korean: 땅과 바다와 그 안에 있는 모든 것
  alternatives_korean:
  - 땅과 바다와 그 안의 모든 것
  - 땅과 바다와 그 속의 모든 것
  lexicon: LSJ
  rationale: 지구적 총칭을 이루는 병렬 표현이므로 ‘땅과 바다와 그 안에 있는 모든 것’으로 간결하게 옮겨 포괄성을 살렸습니다.
theological_decisions:
- issue: 수사 의문문의 기대값
  chosen_reading: 이 문장은 부정의 형식이지만 답을 ‘그렇다’로 기대하는 수사 의문입니다.
  alternative_readings:
  - 정말 우세하지 않느냐?
  - 사람이 이기지 않느냐?
  rationale: 영어 POB 주석이 밝히듯 그리스어 οὐχ는 여기서 긍정 답을 기대하는 수사 의문을 이룹니다. 한국어에서도 이를 질문형으로 유지해 논증의 힘을 보존했습니다.
  doctrine_reference: 수사학/문맥 해석
