  yaml_path: translation/deuterocanon/1_esdras/003/055.yaml
  text: O men, how are women not strong, since they do such things?
translation:
  language: ko
  text: “사람들이여, 어째서 여자들이 이렇게 행동하는데도 강하지 않다는 말이겠습니까?”
  philosophy: formal
lexical_decisions:
- source_word: ὦ ἄνδρες
  english_pob_choice: O men
  chosen_korean: “사람들이여”
  alternatives_korean:
  - “남자들이여”
  - “사내들이여”
  lexicon: ἄνδρες
  rationale: 호격으로 부르는 표현은 현대 한국어에서 자연스럽고 공개적으로 읽히는 ‘사람들이여’로 옮겨, 성별 대조를 살리되 지나치게 성별 고정적이지 않게 했습니다.
- source_word: οὐκ ἰσχυραὶ αἱ γυναῖκες
  english_pob_choice: how are women not strong
  chosen_korean: “여자들이 … 강하지 않다는 말이겠습니까”
  alternatives_korean:
  - “여자들이 … 강하지 않습니까”
  - “여자들이 … 강한 것이 아니겠습니까”
  lexicon: ἰσχυραὶ
  rationale: ἰσχυραί의 핵심 의미인 ‘강함/강하다’를 그대로 살리되, 수사적 질문 구조에 맞게 한국어 문장을 다듬었습니다.
- source_word: οὕτως πράσσουσιν
  english_pob_choice: since they do such things
  chosen_korean: “이렇게 행동하는데도”
  alternatives_korean:
  - “그런 일들을 하는데도”
  - “그처럼 행하는데도”
  lexicon: πράσσουσιν
  rationale: πράσσω는 단순 ‘하다’보다 ‘행하다/행동하다’의 뉘앙스가 있어, 문맥상 행위 자체를 가리키는 표현으로 옮겼습니다.
theological_decisions:
- issue: 수사적 질문의 논리 관계
  chosen_reading: ‘since’에 해당하는 이유 제시를 살려, 여성이 그런 일을 행하므로 강하다는 역설적 찬사를 유지했습니다.
  alternative_readings:
  - ‘that’처럼 결과절로 처리하여 단순 진술로 읽기
  - ‘어째서 … 강하지 않습니까’처럼 직접 비교문으로 단순화하기
  rationale: 본절은 여성의 용맹을 찬양하는 수사적 반문이므로, 논리 관계를 약화시키지 않고 ‘-는데도’ 구조로 역설을 드러내는 것이 원문 효과에 가깝습니다.
  doctrine_reference: 문맥상 성별 일반론이 아니라 여성의 용기와 실천을 칭찬하는 수사적 발화
- issue: 직접화법의 화자 태도
  chosen_reading: 공적 발언체에 맞춰 공손한 반문형으로 처리했습니다.
  alternative_readings:
  - 직설적 단정형
  - 더 구어적인 감탄형
  rationale: 그리스어 호격과 수사문을 한국어 합쇼체 반문으로 옮기면, 공적 장면의 말투와 평가적 힘을 함께 보존할 수 있습니다.
  doctrine_reference: 서사적 연설문의 문체 보존
