  text: 왕과 고아의 마음을 하나로, 노예와 자유인의 마음을 하나로, 가난한 사람과 부자의 마음을 하나로 만듭니다.[a]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 또는 ‘하인’. 그러나 ‘자유인’과의 대조 때문에 여기서는 신분상 예속된 ‘노예’가 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖ
