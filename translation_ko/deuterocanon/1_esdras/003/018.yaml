  rationale: 본문은 ἐλευθέρου(자유인)와의 대조로 신분 대비를 이루지만, 한국어 성경 관례와 문맥상 균형을 위해 기본어 ‘종’을 사용했습니다. 다만 본문의 bonded status는 그대로 유지했습니다.
- source_word: ἐλευθέρου
