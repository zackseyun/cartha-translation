    rationale: οἰκέτης에는 가사·가내 봉사자라는 용례도 있으나, 여기서는 ἐλευθέρου(자유인)와 직접 대조됩니다. 따라서 ‘노예’가 신분상 예속이라는 본문 의미를 더 정확히 드러냅니다.
