  - 만들어 냅니다
  lexicon: LSJ
  rationale: 그리스어의 직접적인 현재 능동 의미를 살려, 단순하고 힘 있는 ‘만듭니다’로 옮겼습니다.
- source_word: διάνοιαν μίαν
  english_pob_choice: mind ... one
  chosen_korean: 마음을 하나로
  alternatives_korean:
