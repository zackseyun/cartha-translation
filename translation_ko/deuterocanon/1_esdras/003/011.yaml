- source_word: ὁ ἕτερος
  english_pob_choice: The other
  chosen_korean: 다른 사람이
  alternatives_korean:
  - 그 다른 사람
  - 한 사람이 더
  lexicon: LSJ
  rationale: 기사와 함께 쓰인 ἕτερος는 앞서 언급된 인물들과 대비되는 ‘다른 쪽 사람’을 가리키므로, 간결하게 ‘다른 사람이’로 옮기면 순서를 유지하면서도 자연스럽습니다.
- source_word: ἔγραψεν
  english_pob_choice: wrote
  chosen_korean: 기록했습니다
  alternatives_korean:
  - 기록했습니다
  - 썼습니다
  lexicon: LSJ
  rationale: 문맥상 단순히 글을 남긴 행위를 뜻하므로 ‘썼습니다’도 가능하지만, 경쟁 진술들을 적는 장면의 성격을 살려 ‘기록했습니다’로 옮겼습니다.
- source_word: Ὑπερισχύει
  english_pob_choice: is stronger
  chosen_korean: 더 강합니다
  alternatives_korean:
  - 우세합니다
  - 이깁니다
  - 더 우세합니다
  lexicon: LSJ
  rationale: ὑπερισχύω는 힘이나 우세함에서 ‘더 강하다/우세하다’는 뜻이므로, 비교의 힘을 살리면서도 한국어로 자연스러운 ‘더 강합니다’가 적절합니다.
- source_word: ὁ βασιλεύς
  english_pob_choice: the king
  chosen_korean: 왕이
  alternatives_korean:
  - 임금이
  - 군주가
  lexicon: LSJ
  rationale: βασιλεύς는 표준적으로 ‘왕’을 뜻하므로, 의미 범위를 좁히지 않고 직역에 가까운 ‘왕이’를 택했습니다.
