lexical_decisions:
- source_word: ἐξηγέρθη
  english_pob_choice: awoke
  chosen_korean: 잠에서 깨어났을 때
  alternatives_korean:
  - 깨어났을 때
  - 일어났을 때
  lexicon: LSJ
  rationale: 여기서는 ‘일어나다’보다 수면에서 깨어남을 직접 드러내는 ‘잠에서 깨어나다’가 서술 흐름과 의미를 더 정확히 살립니다.
- source_word: λαβόντες
  english_pob_choice: they took
  chosen_korean: 가져다가
  alternatives_korean:
  - 가지고
  - 받아
  lexicon: LSJ
  rationale: 문맥상 편지를 집어 가져가는 동작이므로, 한국어에서는 자연스러운 서술 동사인 ‘가져다가’로 옮겨 동작의 연속성을 살렸습니다.
- source_word: τὸ γράμμα
  english_pob_choice: the letter
  chosen_korean: 그 편지
  alternatives_korean:
  - 그 문서
  - 그 글
  lexicon: LSJ
  rationale: 직전 맥락에서 왕에게 전달되는 서면 문서를 가리키므로, 가장 구체적이고 자연스러운 ‘편지’로 번역했습니다.
- source_word: ἀνέγνω
  english_pob_choice: he read it
  chosen_korean: 그는 그것을 읽었습니다
  alternatives_korean:
  - 그는 읽었습니다
  - 그는 그 편지를 읽었습니다
  lexicon: LSJ
  rationale: 동사의 목적어가 문맥상 생략되어 있으나 한국어에서는 대상을 드러내는 것이 자연스러워 ‘그것을’로 받았습니다.
