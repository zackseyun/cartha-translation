  source_fidelity: ‘진실’을 ‘진리’로 바꾸는 것이 ἀλήθεια의 핵심 용례와 이 문맥의 의인화를 더 잘 보존합니다. ‘그것을’과 ‘그’를 사용한 초안은 선행사와 지시 관계가 불분명하고 의인화를 약화합니다. 또한 πάντα τὰ ἔργα를 ‘모든 일’로 옮기면 ‘일이 떨다’가 부자연스러우므로, 문맥상 포괄적인 ‘모든 것’이 자연스럽게 반응의 대상을 나타냅니다.
  naturalness: ‘진리를 부르고/진리를 축복하며’처럼 명사를 반복하면 한국어에서 대명사의 성·지시 문제를 만들지 않으면서 시적 의인화를 유지할 수 있습니다. ‘흔들리고 떱니다’는 그리스어 동사 순서와 합쇼체 문체를 자연스럽게 반영합니다.
  terminology: ἀλήθεια는 이처럼 우주적으로 찬양되고 불의와 대조되는 문맥에서 ‘진리’가 표준적이며 신학적·문학적 어조에도 알맞습니다. εὐλογεῖ는 ‘축복하며’로, ἄδικον은 ‘불의한 것’으로 유지합니다.
