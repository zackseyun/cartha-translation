base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/060.yaml
  text: All the earth calls on truth[a], and heaven blesses her; and all works shake and tremble[b], and with her there is nothing unjust.
  footnotes:
  - marker: a
    text: 'Greek: ''calls truth'' or ''calls upon truth''; the verb may be understood as acclaiming or invoking personified Truth.'
    reason: lexical_alternative
  - marker: b
    text: The Greek text reads 'with him/it' in the final clause (μετʼ αὐτοῦ), though the earlier references to Truth are feminine; the translation follows the sense of the personification.
    reason: textual_variant
translation:
  language: ko
  text: 온 땅이 진실을 부르며, 하늘은 그것을 복 주고, 모든 일은 떨며 흔들리니, 그와 함께는 불의한 것이 하나도 없습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶσα ἡ γῆ
  english_pob_choice: All the earth
  chosen_korean: 온 땅이
  alternatives_korean:
  - 모든 땅이
  - 온 세상이
  lexicon: LSJ
  rationale: 우주적 범위를 살리면서도 한국어에서 자연스러운 포괄 표현으로 옮겼습니다.
- source_word: τὴν ἀλήθειαν
  english_pob_choice: truth
  chosen_korean: 진실을
  alternatives_korean:
  - 진리를
  - 참됨을
  lexicon: LSJ
  rationale: 여기서는 인격화된 추상명사보다 의미상 직접적인 ‘진실’이 가장 자연스럽고, 시적 인격화도 유지할 수 있습니다.
- source_word: καλεῖ
  english_pob_choice: calls on
  chosen_korean: 부르며
  alternatives_korean:
  - 호소하며
  - 호명하며
  - 호출하며
  lexicon: LSJ
  rationale: 목적어를 향해 외치거나 청하는 뉘앙스를 한국어 동사 하나로 과도하게 좁히지 않고, 인격화된 ‘진실’을 향한 호출/찬동의 감각을 살렸습니다.
- source_word: ὁ οὐρανὸς αὐτὴν εὐλογεῖ
  english_pob_choice: heaven blesses her
  chosen_korean: 하늘은 그것을 복 주고
  alternatives_korean:
  - 하늘은 그에게 복을 빌고
  - 하늘은 그를 축복하고
  lexicon: LSJ
  rationale: ‘복 주다’는 성경적 문맥에서 축복의 능동성을 잘 드러내며, 대상을 인격화된 ‘진실’로 보되 한국어 대명사는 중성화하여 어색함을 줄였습니다.
- source_word: πάντα τὰ ἔργα σείεται καὶ τρέμει
  english_pob_choice: all works shake and tremble
  chosen_korean: 모든 일은 떨며 흔들리니
  alternatives_korean:
  - 모든 일들이 떨고 흔들리니
  - 모든 작품은 떨며 흔들리니
  lexicon: LSJ
  rationale: ἔργα는 단순히 ‘작품’이 아니라 넓게 ‘일/행위/작용’을 가리킬 수 있어, 문맥에 맞는 포괄적 표현인 ‘모든 일’로 옮겼습니다.
- source_word: μετʼ αὐτοῦ ἄδικον οὐδέν
  english_pob_choice: with her there is nothing unjust
  chosen_korean: 그와 함께는 불의한 것이 하나도 없습니다
  alternatives_korean:
  - 그것과 함께는 불의한 것이 하나도 없습니다
  - 그와 함께는 아무것도 불의하지 않습니다
  lexicon: LSJ
  rationale: 그리스어 본문이 가진 대명사 불일치를 노출하기보다, 앞선 인격화된 ‘진실’을 가리키는 뜻을 따라 자연스러운 한국어로 처리했습니다.
theological_decisions:
- issue: 진실의 인격화
  chosen_reading: ‘진실’이 마치 호명되고 축복받는 실재처럼 표현되도록 한국어도 시적으로 살렸습니다.
  alternative_readings:
  - 완전히 추상적인 ‘진리’로 평면적으로 처리한다
  - 의인화를 약화시키고 사실 진술로만 옮긴다
  rationale: 본문은 진실을 단순 개념이 아니라 우주적 질서 속에서 응답받는 존재처럼 묘사하므로, 그 힘을 약화하지 않는 번역이 필요합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3, 6
- issue: 마지막 대명사의 지시 대상
  chosen_reading: 그리스어의 대명사 불일치를 각주로 노출하지 않고 본문은 문맥상 진실을 가리키는 것으로 처리했습니다.
  alternative_readings:
  - 직역하여 ‘그와 함께는’의 어색함을 그대로 유지한다
  - 각주를 달아 문법 불일치를 설명한다
  rationale: 이 절은 시적 평행이 우선이므로, 본문 가독성을 해치지 않는 범위에서 의미를 따라 번역했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 5
