  yaml_path: translation/deuterocanon/1_esdras/003/016.yaml
  text: And he said[a], “Call the young men, and they will declare their words.” And they were called, and they entered.
  footnotes:
  - marker: a
    text: Or “they will make known their statements” or “they will present their arguments.” The Greek λόγους is broad and can refer to words, statements, or arguments.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 말했습니다. 「젊은이들을 불러오십시오. 그러면 그들이 자기들의 말을 밝힐 것입니다.」 그래서 그들이 불려 들어왔고, 그들은 들어왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘말’은 λόγοι의 넓은 의미를 따른 것입니다. 문맥상 ‘진술’이나 ‘주장’도 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καλέσατε
  english_pob_choice: Call
  chosen_korean: 불러오십시오
  alternatives_korean:
  - 부르십시오
  - 소집하십시오
  lexicon: LSJ
  rationale: 공손한 명령형으로 옮기되, 이어지는 수동형 ‘불려’와 같은 어근감을 살리기보다 자연스러운 한국어 명령을 택했습니다.
- source_word: τοὺς νεανίσκους
  english_pob_choice: the young men
  chosen_korean: 젊은이들
  alternatives_korean:
  - 청년들
  - 소년들
  lexicon: LSJ
  rationale: νεανίσκος의 기본 의미인 젊은 남자들을 살리면서도, 한국어에서 성별을 과도하게 좁히지 않는 자연스러운 표현을 택했습니다.
- source_word: δηλώσουσιν τοὺς λόγους αὐτῶν
  english_pob_choice: they will declare their words
  chosen_korean: 그들이 자기들의 말을 밝힐 것입니다
  alternatives_korean:
  - 그들이 자기들의 말을 선언할 것입니다
  - 그들이 자기들의 진술을 밝힐 것입니다
  lexicon: LSJ
  rationale: λόγοι의 넓은 뜻을 따라 ‘말’로 두되, 법정/공적 맥락의 발표라는 점을 살려 ‘밝히다’로 옮겼습니다.
- source_word: ἐκλήθησαν, καὶ εἰσήλθοσαν
  english_pob_choice: they were called, and they entered
  chosen_korean: 그들이 불려 들어왔고, 그들은 들어왔습니다
  alternatives_korean:
  - 그들이 소집되었고, 들어왔습니다
  - 그들이 불려 왔고, 들어왔습니다
  lexicon: LSJ
  rationale: 앞의 명령 ‘부르다’와 연결되는 반복을 살리기 위해 ‘불려’로 옮겼고, εἰσήλθοσαν은 단순한 동작을 유지해 ‘들어왔습니다’로 했습니다.
