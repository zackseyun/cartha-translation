revisions:
- from: 그리고 그가 말했습니다. 「젊은이들을 불러오십시오. 그러면 그들이 자기들의 말을 밝힐 것입니다.」 그래서 그들이 불려 들어왔고, 그들은 들어왔습니다.[a]
  to: 그리고 그가 말했습니다. 「청년들을 부르십시오. 그러면 그들이 그들의 말[a]을 밝힐 것입니다.」 그러자 그들은 부름을 받고 들어왔습니다.
  rationale: The revision removes a duplicated entrance action, represents the Greek sequence naturally as “부름을 받고 들어왔습니다,” specifies the male young persons as “청년들,” and relocates the lexical footnote marker to “말.” It retains the broad, non-interpretive rendering of λόγοι and the formal-polite narrative register.
  reviewer_model: gpt-5.6-terra
