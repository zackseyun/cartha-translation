  yaml_path: translation/deuterocanon/1_esdras/003/030.yaml
  text: And he alone[a], if he says to kill, they kill; if he says to release, they release.
  footnotes:
  - marker: a
    text: Or 'if he says to let go, they let go.' The Greek verb can denote release, letting go, or pardon depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 혼자만 있어도, 죽이라고 하면 그들은 죽이고, 풀어 주라고 하면 그들은 풀어 줍니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘풀어 주다’는 문맥에 따라 ‘놓아주다’, ‘석방하다’, 또는 ‘용서하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς εἰ μόνος ἐστίν
  english_pob_choice: he alone / is alone
  chosen_korean: 그가 홀로 있을지라도
  alternatives_korean:
  - 그 자신이 홀로 있더라도
  - 그만 홀로 있어도
  - 그가 홀로 있을 때에도
  lexicon: LSJ
  rationale: αὐτός의 강조와 εἰ μόνος ἐστίν의 ‘홀로 있음’을 함께 살리되, 한국어에서는 문장 앞의 양보 구조로 자연스럽게 옮겼습니다.
- source_word: ἀποκτεῖναι
  english_pob_choice: to kill
  chosen_korean: 죽이라고
  alternatives_korean:
  - 목숨을 끊으라고
  - 사형하라고
  lexicon: BDAG
  rationale: 명령 내용이 직접적이므로 ‘죽이다’를 가장 간명하게 반영했습니다.
- source_word: ἀφείουσιν
  english_pob_choice: they release
  chosen_korean: 풀어 줍니다
  alternatives_korean:
  - 놓아 줍니다
  - 해방합니다
  - 놓아 보냅니다
  lexicon: BDAG
  rationale: ἀφεῖναι/ἀφίουσιν의 ‘풀어 주다, 놓아 주다’ 범위를 살리면서도 한국어에서 왕의 명령에 대한 즉각적 순응을 자연스럽게 표현했습니다.
