  text: 그리고 인도에서 에티오피아까지 이르는 백이십칠 사트라피아에 있는, 그의 통치 아래의 모든 사트라프와 장군과 총독에게도.[a]
  philosophy: optimal-equivalence
  footnotes: &id001
