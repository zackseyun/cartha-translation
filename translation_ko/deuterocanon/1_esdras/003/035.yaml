  yaml_path: translation/deuterocanon/1_esdras/003/035.yaml
  text: O men[a], how does the king not prevail, since he is so obeyed? And he was silent.
  footnotes:
  - marker: a
    text: Or, 'he is so heeded' or 'he is so listened to.' The Greek adjective can denote being listened to as well as being obeyed; 'obeyed' is preferred here because the subject is the king and the context concerns authority.
    reason: lexical_alternative
translation:
  language: ko
  text: “남자 여러분, 왕이 이처럼 순종을 받는데도 어찌 우세하지 않겠습니까?” 그리고 그는 잠잠해졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕에게 이처럼 귀를 기울이는데도’ 또는 ‘왕의 말을 이처럼 잘 듣는데도’로 옮길 수 있습니다. 그리스어 형용사는 왕이 사람들에게 귀 기울여지고 그의 말이 받아들여진다는 뜻과 왕에게 순종한다는 뜻을 모두 나타낼 수 있으나, 여기서는 왕과 권위의 문맥 때문에 ‘순종을 받다’를 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὦ ἄνδρες
  english_pob_choice: O men
  chosen_korean: “여러분”
  alternatives_korean:
  - “남자들이여”
  - “사람들이여”
  lexicon: LSJ
  rationale: 직역상 ‘남자들’이지만, 한국어 현대 합쇼체에서는 공개 발화의 호격으로 ‘여러분’이 가장 자연스럽고 수사적 호소도 유지합니다. 성별 표지는 원문의 직접 호격 기능을 해치지 않는 범위에서 완화했습니다.
- source_word: ὑπερισχύει
  english_pob_choice: prevail
  chosen_korean: 우세하지 않겠습니까
  alternatives_korean:
  - 이기지 않겠습니까
  - 압도하지 않겠습니까
  - 우세하지 않습니까
  lexicon: LSJ
  rationale: 원문의 비교·우세 의미를 살리되, 한국어에서는 질문형 수사 의문으로 풀어 ‘우세하다’가 가장 무난합니다. ‘압도하다’보다 관계적 권위 비교가 덜 과장됩니다.
- source_word: οὕτως ἐπάκουστός ἐστιν
  english_pob_choice: he is so obeyed
  chosen_korean: 이처럼 순종을 받는데도
  alternatives_korean:
  - 이처럼 복종을 받는데도
  - 이렇게 말을 잘 듣는데도
  - 이처럼 들은 대로 따르는데도
  lexicon: LSJ
  rationale: ἐπάκουστος는 ‘들어주다/순종하다’의 폭이 있으나, 왕의 권위 맥락에서는 ‘순종을 받다’가 가장 적절합니다. 영어 POB의 ‘obeyed’를 반영하되, 한국어 문장 흐름상 수동 표현으로 처리했습니다.
- source_word: καὶ ἐσίγησεν
  english_pob_choice: And he was silent
  chosen_korean: 그리고 그는 잠잠해졌습니다
  alternatives_korean:
  - 그리고 그는 침묵했습니다
  - 그리고 그는 말이 없었습니다
  - 그리고 그는 가만히 있었습니다
  lexicon: LSJ
  rationale: aorist ἐσίγησεν은 발화의 종료를 나타내므로 ‘잠잠해지다’가 상태 변화와 말 멈춤을 함께 드러냅니다. 단순 상태인 ‘침묵했습니다’보다 서술 전개가 더 자연스럽습니다.
theological_decisions:
- issue: 왕권과 순종의 논리
  chosen_reading: 왕이 순종을 받는다는 점이 그의 우세를 뒷받침하는 논증으로 읽히도록 옮겼습니다.
  alternative_readings:
  - ‘왕이 이처럼 말을 듣는데도 어떻게 이기지 않겠습니까?’로 더 강한 승리 뉘앙스를 주는 읽기
  - ‘우세하다’ 대신 ‘강하다’로 단순 역량을 강조하는 읽기
  rationale: 문맥은 전투적 승리보다 권위·복종의 관계를 논증하는 수사이므로, 한국어에서도 권력의 우세를 유지하는 쪽이 원문과 English POB의 균형에 부합합니다.
  doctrine_reference: 본문 수사와 문맥 해석
