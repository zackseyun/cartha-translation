  text: But the king prevails over them and rules over them, and he is master over them, and whatever he says to them, they will obey.
translation:
  language: ko
  text: 그러나 왕은 그들보다 우세하여 그들을 다스리고, 그들 위에 군림하며, 그들에게 말하는 것은 무엇이든 그들이 따릅니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘군림하며’는 δεσπόζει αὐτῶν의 권위적·지배적 뉘앙스를 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπερισχύει
  english_pob_choice: prevails over them
  chosen_korean: 그들보다 우세하여
  alternatives_korean:
  - 그들보다 강하여
  - 그들을 압도하여
  lexicon: ὑπερισχύω
  rationale: 단순한 통치가 아니라 상대를 능가하여 우세해지는 힘의 뉘앙스를 살려 ‘우세하여’로 옮겼습니다.
- source_word: κυριεύει αὐτῶν
  english_pob_choice: rules over them
  chosen_korean: 그들을 다스리고
  alternatives_korean:
  - 그들 위에 군림하고
  - 그들을 통치하고
  lexicon: κυριεύω
  rationale: 지배 행위를 일반적이고 공적인 표현인 ‘다스리다’로 옮겨 앞뒤 표현과 균형을 맞췄습니다.
- source_word: δεσπόζει αὐτῶν
  english_pob_choice: he is master over them
  chosen_korean: 그들 위에 군림하며
  alternatives_korean:
  - 그들의 주인이며
  - 그들을 지배하며
  lexicon: δεσπόζω
  rationale: POB의 ‘he is master over them’을 직역하되, 한국어에서 소유적 호칭보다 권세의 뉘앙스를 드러내는 ‘군림하다’를 택했습니다.
- source_word: ἐνακούσουσιν
  english_pob_choice: they will obey
  chosen_korean: 그들이 따릅니다
  alternatives_korean:
  - 그들이 순종합니다
  - 그들이 복종합니다
  lexicon: ἐπακούω / ἐνακούω
  rationale: 명령에 귀 기울여 따르는 결과를 자연스럽게 보여 주는 표현으로 ‘따르다’를 사용했습니다.
theological_decisions:
- issue: 왕권의 누적 동사들(다스림/군림/순종)의 강한 지배성
  chosen_reading: 왕이 백성 위에 실제로 우세한 권세를 행사하는 정치적·사회적 서술로 유지했습니다.
  alternative_readings:
  - 완화하여 단순한 지도력으로 번역
  - ‘주님’ 같은 종교적 어휘로 격상
  rationale: 본문은 왕권의 사실적 위계와 복종 구조를 반복 동사로 강조하므로, 이를 약화하지 않고 그대로 드러내는 것이 원문 효과에 부합합니다.
  doctrine_reference: 본문 맥락은 세속 왕권의 묘사이며, 신학적 확대 해석을 가하지 않습니다.
