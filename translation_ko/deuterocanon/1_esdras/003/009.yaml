  yaml_path: translation/deuterocanon/1_esdras/003/009.yaml
  text: And they said[a], “When the king rises, they will give him the writing; and the one whom the king and the three nobles of Persia judge to be the one whose word is wiser, to him the victory will be given[b], as it is written.”
  footnotes:
  - marker: a
    text: Or “the letter” or “the document” for “the writing.”
    reason: lexical_alternative
  - marker: b
    text: Or “whose statement/word is wiser.” The Greek says literally, “that his λόγος is wiser.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들이 말했습니다. 「왕이 일어나면 그에게 그 글을 줄 것이며, 왕과 페르시아의 세 대신이 판단하여 그 말이 더 지혜로운 자에게는 승리가 주어질 것입니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “편지” 또는 “문서”로 볼 수 있습니다. 여기의 γράμμα는 서면 문서를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그의 말/주장이 더 지혜로운 자.” 그리스어는 문자적으로 “그의 λόγος가 더 지혜로운”이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ γράμμα
  english_pob_choice: the writing
  chosen_korean: 그 글
  alternatives_korean:
  - 그 편지
  - 그 문서
  - 그 글쓰기
  lexicon: BDAG
  rationale: γράμμα는 여기서 전달된 서면 문서를 가리키므로, ‘그 글’이 가장 중립적이며 ‘편지’처럼 사적 서신으로 좁히지 않습니다.
- source_word: οἱ τρεῖς μεγιστᾶνες τῆς Περσίδος
  english_pob_choice: the three nobles of Persia
  chosen_korean: 페르시아의 세 대신
  alternatives_korean:
  - 페르시아의 세 귀족
  - 페르시아의 세 대귀족
  - 페르시아의 세 고관
  lexicon: LSJ
  rationale: μεγιστᾶνες는 고위 귀족층을 뜻하므로, 한국어로는 역사적 궁정 맥락을 살리는 ‘대신’이 자연스럽고 위계도 잘 드러납니다.
- source_word: ὁ λόγος αὐτοῦ σοφώτερος
  english_pob_choice: the one whose word is wiser
  chosen_korean: 그 말이 더 지혜로운 자
  alternatives_korean:
  - 그의 말이 더 지혜로운 사람
  - 그의 발언이 더 지혜로운 자
  - 더 지혜로운 주장을 하는 사람
  lexicon: BDAG
  rationale: λόγος는 단순한 한 마디보다 발언/주장을 가리킬 수 있어, POB의 의미를 살려 ‘그 말이 더 지혜로운 자’로 옮기면 비교 판단의 성격이 드러납니다.
- source_word: τὸ νῖκος
  english_pob_choice: the victory
  chosen_korean: 승리
  alternatives_korean:
  - 이김
  - 승
  - 승리의 판정
  lexicon: LSJ
  rationale: νῖκος는 결과로서의 승리를 뜻하므로, 문맥상 판정의 보상으로 주어지는 결과를 자연스럽게 나타내는 ‘승리’가 적절합니다.
theological_decisions:
- issue: 이 구절의 서술체와 궁정 판정 절차를 한국어에서 어떻게 유지할 것인가
  chosen_reading: 직설적 서술을 유지하고, 왕과 대신들의 판정을 그대로 드러내는 문장 구조를 택했습니다.
  alternative_readings:
  - 더 풀어서 ‘누가 더 옳은지 판정하면’으로 의역
  - ‘이긴 자에게’로 축약
  rationale: 본문은 경쟁적 논증과 공식 판정을 묘사하므로, 절차성과 공적 판단의 긴장을 보존하는 것이 원문에 충실합니다.
  doctrine_reference: source fidelity / narrative register
