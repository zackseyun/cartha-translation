    rationale: 이 동사는 ‘나가다’와 함께 원정 또는 출정에 나서는 뜻으로 이해될 수 있습니다. ‘원정을 떠나다’는 군사적 맥락을 유지하면서도 원문의 이동·원정 어감과 의미 범위를 보존합니다.
