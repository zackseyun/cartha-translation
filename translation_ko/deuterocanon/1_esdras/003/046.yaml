review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘전쟁을 치르고’는 ἐξοδεύειν이 문맥상 가질 수 있는 의미이지만, ‘출정하다/원정을 떠나다’라는 이동·원정의 어감을 실제 전쟁 수행으로 다소 좁힙니다. 또한 헬라어의 ἐκπορεύεται와 뒤따르는 부정사들의 관계를 더 잘 드러내도록 고칠 필요가 있습니다. ‘바다와 강을 항해합니다’는 εἰς τὴν θάλασσαν ... ποταμούς의 병렬을 자연스럽게 반영합니다.
  naturalness: 초안은 ‘나가 전쟁을 치르고 … 항해합니다’에서 앞선 연결 동사들과 마지막 종결 표현의 호응이 다소 매끄럽지 않습니다. ‘나가 원정을 떠나며, 약탈하고 훔치고, … 항해합니다’는 현대 표준어 합쇼체로 자연스럽고, 동사 나열도 분명합니다.
  terminology: ῥομφαία는 ‘칼’, λῃστεύειν은 ‘약탈하다’, κλέπτειν은 ‘훔치다’로 적절합니다. ἐξοδεύειν은 신학 용어가 아니며, 본문이 확정하지 않는 ‘전쟁을 치르다’보다 ‘원정을 떠나다’가 원문의 범위와 영어 감사 기록의 lexical alternative를 더 잘 보존합니다.
