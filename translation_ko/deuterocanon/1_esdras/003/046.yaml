base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/046.yaml
  text: And a man takes his sword and goes out to campaign and to plunder and to steal[a], and to sail on the sea and rivers,
  footnotes:
  - marker: a
    text: Or 'to march out,' 'to make an expedition,' or more broadly 'to wage war' for the Greek ἐξοδεύειν.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 한 사람이 자기 칼을 들고 나가 원정을 떠나며, 약탈하고 훔치고, 바다와 강을 항해합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘원정을 떠나며’는 헬라어 ἐξοδεύειν을 옮긴 것으로, ‘출정하다’, ‘원정을 하다’, 또는 더 넓게 ‘전쟁을 수행하다’로도 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος
  english_pob_choice: a man
  chosen_korean: 한 사람이
  alternatives_korean:
  - 사람이
  - 어떤 사람이
  lexicon: LSJ
  rationale: 대표적 단수 남성형을 한국어에서 자연스럽게 살리되, 현대 문체에서는 성별을 과도하게 강조하지 않기 위해 '한 사람이'로 옮겼습니다.
