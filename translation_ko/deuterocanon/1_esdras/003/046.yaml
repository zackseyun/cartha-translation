  - 큰 칼
  lexicon: LSJ
  rationale: ῥομφαία는 큰 칼/칼날류를 가리킬 수 있지만, 이 문맥에서는 무기 유형을 과잉 특정하지 않고 자연스러운 현대어인 '칼'이 적절합니다.
- source_word: ἐξοδεύειν
  english_pob_choice: to campaign
  chosen_korean: 전쟁을 치르고
  alternatives_korean:
  - 원정을 떠나고
  - 출정하고
  - 전쟁하러 나가
  lexicon: LSJ
  rationale: 영어 POB가 각주로 제시한 대안들처럼 이 동사는 단순 이동보다 군사적 출정·원정의 뉘앙스를 가지므로, 결과적 행위까지 드러내는 '전쟁을 치르고'로 옮겼습니다.
- source_word: λῃστεύειν
  english_pob_choice: to plunder
  chosen_korean: 약탈하며
  alternatives_korean:
  - 노략하며
  - 강탈하며
  lexicon: LSJ
  rationale: 군사적 맥락에서 폭력적으로 빼앗는 의미가 분명하므로 '약탈하다'가 가장 직접적입니다.
- source_word: κλέπτειν
  english_pob_choice: to steal
  chosen_korean: 훔치고
  alternatives_korean:
  - 절도하고
  - 몰래 빼앗고
  lexicon: LSJ
  rationale: λῃστεύειν과 구별되는 일반적 '도둑질'의 의미를 살려 표준적인 '훔치다'를 사용했습니다.
- source_word: εἰς τὴν θάλασσαν πλεῖν
  english_pob_choice: to sail on the sea
  chosen_korean: 바다와 강을 항해합니다
  alternatives_korean:
  - 바다로 항해합니다
  - 바다에서 항해합니다
  lexicon: LSJ
  rationale: πλεῖν은 배를 타고 항해하는 행위이므로 '항해합니다'가 적절하며, 뒤의 ποταμούς와 병렬을 살려 '바다와 강'으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 전쟁·약탈·도둑질의 병렬이 제시하는 인간 행위의 윤리적 긴장
  chosen_reading: 본문은 인간이 칼을 집어 들고 군사적 출정, 약탈, 절도를 수행하는 모습을 사실적으로 나열합니다.
  alternative_readings:
  - 추상적으로 '사람이 무기를 들고 밖으로 나간다'로 완화하는 읽기
  - 전쟁만을 지칭하고 뒤의 약탈·도둑질을 부차화하는 읽기
  rationale: 문장의 누적 동사들은 행위의 폭력성과 부정성을 약화시키지 않고 그대로 드러내며, 한국어도 그 긴장을 보존해야 합니다.
  doctrine_reference: 일반 윤리적 본문 이해
- issue: ἐξοδεύειν의 범위
  chosen_reading: '''전쟁을 치르고''로 옮겨 군사적 출정과 전쟁 수행의 폭을 함께 드러냈습니다.'
  alternative_readings:
  - '''원정하다'''
  - '''출정하다'''
  rationale: 영어 POB 각주가 밝히듯 이 동사는 단순한 이동보다 더 넓은 군사 행위를 포함할 수 있으므로, 한국어에서도 좁히지 않되 자연스럽게 표현했습니다.
  doctrine_reference: 본문 의미 보존 원칙
