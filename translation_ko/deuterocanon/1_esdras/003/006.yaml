  yaml_path: translation/deuterocanon/1_esdras/003/006.yaml
  text: and to put on purple[a], and to drink from gold vessels, and to sleep on gold, and to have a chariot with gold bridles, and a turban of fine linen, and a necklace around the neck[c][b],
  footnotes:
  - marker: a
    text: Or 'drink in gold cups' / 'from golden vessels'; the Greek expression specifies drinking by means of gold items without naming the exact vessel type.
    reason: lexical_alternative
  - marker: b
    text: Literally 'sleep on gold,' likely referring to a gold-adorned bed or couch; the Greek itself is compressed.
    reason: lexical_alternative
  - marker: c
    text: Or 'a gold-bridled chariot'; the adjective may describe the chariot by its golden bridle or harness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 자색 옷을 입고[a], 금그릇으로 마시고, 금 위에서 자고[b], 금 굴레를 단 전차와[c] 고운 베로 만든 터번과 목장식을 갖추고,
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 직역하면 ‘자색을 입고’입니다. 여기서 자색은 자색 천이나 옷을 가리킵니다.
    reason: 원문의 명시적 의복 함의를 설명하되, 왕실적 의미를 단정하지 않습니다.
  - marker: b
    text: 직역하면 ‘금 위에서 자고’입니다. 금으로 장식된 침상이나 잠자리를 가리킬 가능성이 있으나, 원문은 구체적으로 밝히지 않습니다.
    reason: 압축된 그리스어 표현의 가능한 뜻을 설명하면서 모호성을 보존합니다.
  - marker: c
    text: 또는 ‘금 굴레의 전차’. 전차의 굴레나 마구가 금으로 되어 있거나 금으로 장식되었음을 뜻할 수 있습니다.
    reason: 합성 형용사의 수식 범위에 관한 어휘적 대안을 보존합니다.
lexical_decisions:
- source_word: πορφύραν περιβαλέσθαι
  english_pob_choice: to put on purple
  chosen_korean: 자색 옷을 입고
  alternatives_korean:
  - 자색을 걸치고
  - 자색 옷을 두르고
  lexicon: LSJ
  rationale: πορφύρα는 자색 염료/천을 가리키며, 여기서는 왕실적 사치를 나타내므로 자연스럽게 ‘자색 옷’으로 옮겼습니다. περιβαλέσθαι의 ‘입다/걸치다’는 한국어에서 ‘입고’가 가장 매끄럽습니다.
- source_word: ἐν χρυσώμασιν
  english_pob_choice: from gold vessels
  chosen_korean: 금그릇으로 마시고
  alternatives_korean:
  - 금잔으로 마시고
  - 금으로 만든 그릇으로 마시고
  lexicon: LSJ
  rationale: 그리스어는 금으로 된 용기를 통해 마신다는 뜻이지 용기 종류를 특정하지 않으므로, ‘금그릇으로’로 간결하게 옮겨 사치의 이미지를 살렸습니다.
- source_word: ἐπὶ χρυσῷ καθεύδειν
  english_pob_choice: to sleep on gold
  chosen_korean: 금 위에서 자고
  alternatives_korean:
  - 금으로 된 침상에서 자고
  - 금장 침상에서 자고
  lexicon: LSJ
  rationale: 본문의 압축된 표현을 그대로 살려, 실제 가구를 덧붙이지 않고 ‘금 위에서’로 직역에 가깝게 옮겼습니다.
- source_word: ἅρμα χρυσοχάλινον
  english_pob_choice: a chariot with gold bridles
  chosen_korean: 금 굴레를 단 전차
  alternatives_korean:
  - 금굴레 전차
  - 금 고삐를 단 전차
  lexicon: LSJ
  rationale: χρυσοχάλινος는 굴레/재갈에 금이 있는 상태를 가리키므로, ‘금 굴레를 단 전차’로 자연스럽게 표현했습니다. ‘전차’는 고전적 수레 문맥에 맞는 표준어입니다.
- source_word: κίδαριν βυσσίνην
  english_pob_choice: a turban of fine linen
  chosen_korean: 가는 베로 만든 관
  alternatives_korean:
  - 세마포 관
  - 가는 베 터번
  lexicon: LSJ
  rationale: κίδαρις는 터번형 관모를 가리키며, βύσσινος는 고운 베/세마포의 뜻입니다. 한국어 성경 문맥에서는 ‘관’이 가장 자연스럽고, ‘가는 베로 만든’이 재질을 살립니다.
- source_word: μανιάκην περὶ τὸν τράχηλον
  english_pob_choice: a necklace around the neck
  chosen_korean: 목에 두르는 목걸이를 갖추게 하였고
  alternatives_korean:
  - 목걸이를 목에 두르게 하였고
  - 목장식을 목에 걸게 하였고
  lexicon: LSJ
  rationale: μανιάκη는 목에 두르는 장신구를 뜻하므로 ‘목걸이’로 옮기되, περὶ τὸν τράχηλον의 위치를 분명히 드러내기 위해 ‘목에 두르는’이라고 풀었습니다.
