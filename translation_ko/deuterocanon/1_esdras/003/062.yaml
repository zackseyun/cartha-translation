    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 진리는 영원히 남아 있고[a] 강하며, 영원무궁토록 살아 있고 승리합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘남아 있고’는 ‘머무르고’ 또는 ‘지속되고’로도 옮길 수 있습니다.
    reason: lexical_alternative
