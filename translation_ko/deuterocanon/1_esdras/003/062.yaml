  yaml_path: translation/deuterocanon/1_esdras/003/062.yaml
  text: And truth remains and is strong forever[b][a], and lives and prevails forever and ever.
  footnotes:
  - marker: a
    text: Or 'abides' for 'remains.'
    reason: lexical_alternative
  - marker: b
    text: The final phrase is literally 'to the age of the age,' an intensified expression meaning 'forever and ever.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 진리는 영원히 머물며 힘이 있고, 영원무궁토록 살아 있으며 승리합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘머물며’는 ‘남아 있으며’ 또는 ‘지속하며’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘영원무궁토록’은 직역하면 ‘세대의 세대까지’에 해당하는 강한 반복 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλήθεια
  english_pob_choice: truth
  chosen_korean: 진리
  alternatives_korean:
  - 참됨
  - 진실
  lexicon: BDAG
  rationale: 의인화된 주어로서 단순한 사실성보다 객관적이고 공적인 ‘진리’가 가장 자연스럽고, 문맥의 찬양적 어조도 잘 살립니다.
- source_word: μένει
  english_pob_choice: remains
  chosen_korean: 머물며
  alternatives_korean:
  - 남아 있으며
  - 지속하며
  - 머무르며
  lexicon: BDAG
  rationale: 계속 존재한다는 뜻을 현대 한국어로 자연스럽게 옮기되, 동사의 지속성을 살려 뒤의 동사들과 평행을 이루게 했습니다.
- source_word: ἰσχύει
  english_pob_choice: is strong
  chosen_korean: 힘이 있고
  alternatives_korean:
  - 강하고
  - 강력하고
  - 힘이 있습니다
  lexicon: BDAG
  rationale: 뒤의 κρατεῖ를 단순 반복하지 않도록, 현재의 능력/힘을 드러내는 표현으로 구분해 옮겼습니다.
- source_word: κρατεῖ
  english_pob_choice: prevails
  chosen_korean: 승리합니다
  alternatives_korean:
  - 우세합니다
  - 이깁니다
  - 지배합니다
  lexicon: BDAG
  rationale: 진리가 단지 ‘강하다’는 수준을 넘어 실제로 압도하고 관철된다는 점을 살리기 위해, 결과적·역동적 의미를 지닌 표현을 택했습니다.
- source_word: εἰς τὸν αἰῶνα τοῦ αἰῶνος
  english_pob_choice: forever and ever
  chosen_korean: 영원무궁토록
  alternatives_korean:
  - 영원히 또 영원히
  - 세세토록
  - 영원히
  lexicon: BDAG
  rationale: 강조된 중첩 시간 표현을 한국어의 관용적 장구 표현으로 옮겨, 단순한 ‘영원히’보다 강조를 살렸습니다.
theological_decisions:
- issue: 진리의 의인화 유지
  chosen_reading: 진리가 ‘머물며… 힘이 있고… 살아 있으며… 승리합니다’라고 연속 동사로 말하는 구조를 유지했습니다.
  alternative_readings:
  - ‘진리는 영원히 지속되고 강합니다’처럼 더 추상적으로 옮김
  rationale: 그리스어는 ἡ ἀλήθεια를 주어로 삼아 연속적인 서술을 붙이는 수사적·찬송적 구조이므로, 이를 평면화하지 않고 그대로 살리는 편이 본문의 힘을 보존합니다.
  doctrine_reference: 수사적 인격화는 신학적 실체화가 아니라 표현 방식이므로, 본문의 어조를 보존합니다.
