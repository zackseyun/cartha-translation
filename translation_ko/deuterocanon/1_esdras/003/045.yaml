  naturalness: ‘이로부터’는 문법적으로 가능하지만 현대 한국어 산문에서는 다소 딱딱하고 부자연스럽습니다. ‘이것으로 너희는 … 알아야 합니다’가 합쇼체의 논증적 문맥에 자연스럽습니다. 또한 원문의 한 질문을 한 문장으로 처리하면 흐름이 매끄럽습니다.
