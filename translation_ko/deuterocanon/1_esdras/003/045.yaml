  text: And from this you must know that women rule over you. Do you not labor and toil[a], and give and bring everything to women?
  footnotes:
  - marker: a
    text: Or 'wives' for 'women,' though the Greek plural γυναῖκες here is broader and is rendered 'women' in the main text.
    reason: lexical_alternative
translation:
  language: ko
  text: 이로부터 너희는 여자들이 너희를 지배하고 있음을 알아야 합니다. 너희가 수고하고 애쓰지 않습니까? 또 모든 것을 여자들에게 주고 가져다주지 않습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 γυναῖκες는 문맥상 '아내들'이 아니라 더 넓은 의미의 '여자들'로 읽히므로 본문은 '여자들'로 옮겼습니다.
    reason: lexical_alternative
