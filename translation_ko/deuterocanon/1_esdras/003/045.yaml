  text: And from this you must know that women rule over you. Do you not labor and toil[a], and give and bring everything to women?
  footnotes:
  - marker: a
    text: Or 'wives' for 'women,' though the Greek plural γυναῖκες here is broader and is rendered 'women' in the main text.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것으로 너희는 여자들이 너희를 지배한다는 것을 알아야 합니다. 너희가 수고하고 애쓰며, 모든 것을 여자들에게 주고 가져다주지 않습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아내들’. 그리스어 γυναῖκες는 ‘여자들’ 또는 ‘아내들’을 뜻할 수 있으나, 여기서는 본문에 ‘여자들’로 옮겼습니다.
    reason: lexical_alternative
