base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/001.yaml
  text: Then Sisinnes[a], governor of Coele-Syria and Phoenicia, and Sathrabuzanes and their associates, following what had been commanded by King Darius[b],
  footnotes:
  - marker: a
    text: Greek Coele-Syria, a formal regional name; not a descriptive phrase meaning simply 'hollow Syria.'
    reason: cultural_note
  - marker: b
    text: Or 'the associates.' The Greek συνέταιροι can mean associates, partners, or companions.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 코엘레 시리아[a]와 페니키아의 총독 시시네스와 사트라부자네스와 그들의 동료들[b]은 다리우스 왕께서 명하신 것을 따라 행동했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 코엘레 시리아는 ‘속이 빈 시리아’라는 뜻풀이가 아니라, 헬라 세계에서 통용되던 공식 지명입니다.
    reason: cultural_note
  - marker: b
    text: 그리스어 οἱ συνέταιροι는 동료, 협력자, 동반자 등의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
