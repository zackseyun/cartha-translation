  lexicon: LSJ
  rationale: κοίλης는 지형 묘사보다 확립된 지역명으로 기능하므로 음역을 유지해 고유한 행정 구역명을 보존했습니다.
- source_word: οἱ συνέταιροι
  english_pob_choice: their associates
  chosen_korean: 그들의 동료들
  alternatives_korean:
  - 그들의 협력자들
  - 동반자들
  - 동료들
  lexicon: LSJ
  rationale: συνέταιροι의 관계적 의미를 살리면서도 한국어 문맥에서 자연스럽고 과도하게 해석하지 않는 표현을 택했습니다.
- source_word: τοῖς ὑπὸ τοῦ βασιλέως Δαρείου προσταγεῖσιν
  english_pob_choice: what had been commanded by King Darius
  chosen_korean: 다리우스 왕의 명령을 따라갔습니다
  alternatives_korean:
  - 다리우스 왕에게서 내려진 명령에 순종했습니다
  - 다리우스 왕이 명한 것을 따랐습니다
  lexicon: LSJ
  rationale: 분사구의 핵심을 '명령을 따라갔다'로 옮겨, 명령에 대한 순응과 행동의 종속 관계를 간결하게 드러냈습니다.
