  terminology: ‘총독’, ‘코엘레 시리아’, ‘페니키아’, ‘다리우스’는 적절합니다. 각주 b의 그리스어는 ἡ συνέταιροι가 아니라 원문대로 οἱ συνέταιροι로 고쳐야 합니다. 또한 각주 a는 시시네스가 아니라 ‘코엘레 시리아’에 붙어야 합니다.
