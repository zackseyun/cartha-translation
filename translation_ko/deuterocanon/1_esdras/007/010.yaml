revisions:
- from: 그리고 바벨론 포로에서 돌아온 이스라엘 자손은 첫째 달 열넷째 날에 유월절을 지켰습니다[b][a]. 그때 제사장들과 레위 사람들은 함께 스스로를 정결하게 했습니다.
  to: 포로 생활에서 나온 이스라엘 자손은 제사장들과 레위 사람들이 함께 정결하게 되었을 때[b], 첫째 달 열넷째 날에 유월절을 지켰습니다[a].
  rationale: 그리스어를 우선하여 본문에 없는 ‘바벨론’과 ‘돌아온’을 제거하고, 정결 동사의 수동형을 한국어에도 반영했습니다. 축제 준수와 날짜, 제사장들과 레위 사람들의 공동 정결이라는 원문의 정보와 시간 관계는 그대로 보존했습니다. 각주 표지도 각각 포로 생활 표현과 정결 표현에 맞게 재배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:04:02Z'
review_pass:
  verdict: revise
  source_fidelity: ‘바벨론’과 ‘돌아온’은 그리스어 본문에 명시되어 있지 않습니다. τῶν ἐκ τῆς αἰχμαλωσίας는 ‘포로 생활에서 나온/포로 생활에 속했던’ 집단을 가리키므로, 지명을 보태거나 귀환이라는 특정 동작을 단정하지 않는 편이 충실합니다. 또한 ἡγνίσθησαν은 수동형이므로 ‘스스로를 정결하게 했다’보다 ‘정결하게 되었다’가 형태와 의미를 더 잘 보존합니다.
  naturalness: ‘포로 생활에서 나온 이스라엘 자손’, ‘유월절을 지켰습니다’, ‘함께 정결하게 되었을 때’는 현대 표준어 합쇼체에서 자연스럽고, 제의적 맥락도 유지합니다. 시간절을 한 문장에 두어 ὅτε의 연결 관계를 분명히 했습니다.
  terminology: ‘이스라엘 자손’, ‘유월절’, ‘제사장들’, ‘레위 사람들’, ‘정결하게 되다’는 성경 문맥에서 통용되는 적절한 용어입니다. ‘제의적으로’라는 설명은 각주에만 유지했습니다.
  issues:
  - severity: medium
    issue: ‘바벨론 포로에서 돌아온’이 본문보다 구체적입니다.
    rationale: 그리스어에는 바벨론이라는 지명도, ‘돌아오다’라는 동사도 없습니다. 포로 생활과 관련된 집단이라는 식별만 표현해야 합니다.
  - severity: medium
    issue: ‘스스로를 정결하게 했습니다’가 수동형 ἡγνίσθησαν을 능동·재귀적으로 바꿉니다.
    rationale: 본문은 제사장들과 레위 사람들이 정결하게 되었음을 말합니다. 그들이 직접 행위를 했다는 점은 문법적으로 명시되지 않습니다.
  - severity: low
    issue: 기존 각주 a는 본문 표현과 대안 표현이 사실상 동일하고, 각주 b의 표지가 해당 정결 표현에서 떨어져 있습니다.
    rationale: 각주 a는 ‘포로 생활’의 번역 선택을 실질적으로 설명하도록 고치고, 각주 b는 정결 표현 바로 뒤에 배치하는 것이 독해에 적절합니다.
