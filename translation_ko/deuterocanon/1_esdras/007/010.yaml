base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/010.yaml
  text: And the sons of Israel from the captivity kept the Passover on the fourteenth day of the first month[b][a], when the priests and the Levites had purified themselves together.
  footnotes:
  - marker: a
    text: Or 'from exile.' The Greek literally says 'from the captivity,' referring to those of Israel associated with the return from exile.
    reason: lexical_alternative
  - marker: b
    text: That is, the priests and Levites had undergone ritual purification in preparation for the Passover.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 바벨론 포로에서 돌아온 이스라엘 자손은 첫째 달 열넷째 날에 유월절을 지켰습니다[b][a]. 그때 제사장들과 레위 사람들은 함께 스스로를 정결하게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘포로에서’라고도 옮길 수 있습니다. 그리스어는 문자적으로 ‘포로에서’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 즉, 제사장들과 레위 사람들이 유월절을 준비하기 위해 제의적으로 정결하게 되었다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰσραήλ
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: LSJ
  rationale: 족보적·공동체적 표현을 살리되, 한국어에서 가장 자연스럽고 성경적인 관용인 ‘이스라엘 자손’으로 옮겼습니다.
- source_word: τῶν ἐκ τῆς αἰχμαλωσίας
  english_pob_choice: from the captivity
  chosen_korean: 바벨론 포로에서 돌아온
  alternatives_korean:
  - 포로에서
  - 포로 생활에서 돌아온
  lexicon: LSJ
  rationale: 그리스어는 문자적으로는 ‘포로에서 나온 자들’을 가리키지만, 이 문맥에서는 귀환 집단을 식별하므로 의미를 분명히 하되 과도한 의역은 피했습니다.
- source_word: ἤγαγον ... τὸ πάσχα
  english_pob_choice: kept the Passover
  chosen_korean: 유월절을 지켰습니다
  alternatives_korean:
  - 유월절을 행했습니다
  - 유월절을 지켰습니다
  lexicon: LSJ
  rationale: ἤγαγον이 חג절 관용구 안에서 축제를 ‘지키다/행하다’의 뜻으로 쓰이므로, 한국어 성경의 자연스러운 축제 관용을 살렸습니다.
- source_word: ἡγνίσθησαν
  english_pob_choice: had purified themselves
  chosen_korean: 스스로를 정결하게 했습니다
  alternatives_korean:
  - 정결하게 되었습니다
  - 의식적으로 깨끗하게 했습니다
  lexicon: LSJ
  rationale: 제사장과 레위 사람들의 예비적 예식 정결을 나타내므로, 수동보다 자기 준비의 뉘앙스가 드러나는 능동형으로 옮겼습니다.
theological_decisions:
- issue: 예배 준비의 정결 개념
  chosen_reading: 스스로를 정결하게 했습니다
  alternative_readings:
  - 의식적으로 깨끗해졌습니다
  - 정결례를 행했습니다
  rationale: 본문은 도덕적 정화가 아니라 유월절 참여를 위한 제의적 준비를 말하므로, 그 예배 맥락을 분명히 하면서도 본문에 없는 설명을 덧붙이지 않았습니다.
  doctrine_reference: DOCTRINE.md §1 Original-language primacy over translation tradition
