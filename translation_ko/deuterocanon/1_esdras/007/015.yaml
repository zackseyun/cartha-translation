translation:
  language: ko
  text: 그가 앗시리아 왕의 뜻을 그들에게로 돌려, 주, 이스라엘의 하나님의 일을 하는 데 그들의 손을 강하게 하셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어와 히브리어 평행본문 모두 ‘앗시리아 왕’이라 읽지만, 에스라 문맥의 더 넓은 역사 배경은 페르시아 통치자를 가리킵니다. 본문은 조화시키지 않고 원문 표현을 따릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: μετέστρεψεν
  english_pob_choice: had turned
  chosen_korean: 돌려
  alternatives_korean:
  - 바꾸셨기 때문에
  - 전환하셨기 때문에
  - 돌리셨기 때문에
  lexicon: BDAG
  rationale: 문맥상 하나님의 주권적 개입으로 왕의 의중을 바꾸어 놓은 뜻이어서, 한국어에서는 자연스럽게 ‘돌려’로 옮기되 원인의 뉘앙스를 살렸습니다.
- source_word: βουλὴν
  english_pob_choice: counsel
  chosen_korean: 뜻
  alternatives_korean:
  - 계획
  - 의논
  - 조언
  lexicon: BDAG
  rationale: βουλή의 숙고된 의도라는 의미를 한국어의 ‘뜻’으로 간결하게 살렸습니다. ‘계획’도 가능하지만, 왕의 내적 의도와 방향 전환을 함께 담기에는 ‘뜻’이 더 자연스럽습니다.
- source_word: τοῦ βασιλέως Ἀσσυρίων
  english_pob_choice: of the king of Assyria
  chosen_korean: 앗시리아 왕의
  alternatives_korean:
  - 앗시리아의 왕의
  - 앗수르 왕의
  lexicon: BDAG
  rationale: 원문의 표면형과 영어 POB의 보존 방침을 따라 ‘앗시리아 왕’으로 두었고, 역사적 조화는 본문이 아니라 주석적 판단으로 남겼습니다.
- source_word: κατισχῦσαι τὰς χεῖρας αὐτῶν
  english_pob_choice: to strengthen their hands
  chosen_korean: 그들의 손을 강하게 하셨기
  alternatives_korean:
  - 그들의 손을 견고하게 하셨기
  - 그들을 힘 있게 하셨기
  - 그들의 손을 강하게 하도록
  lexicon: BDAG
  rationale: 히브리어 평행본문의 관용구를 반영해 직역성을 유지했습니다. ‘손을 강하게 하다’는 성경적 표현으로, 사역 수행에 필요한 능력 부여를 자연스럽게 드러냅니다.
- source_word: τὰ ἔργα Κυρίου θεοῦ Ἰσραήλ
  english_pob_choice: the work of the Lord, the God of Israel
  chosen_korean: 주, 이스라엘의 하나님의 일
  alternatives_korean:
  - 주, 이스라엘의 하나님의 일들
  - 주 하나님 이스라엘의 일
  - 주, 이스라엘의 하나님의 공사
  lexicon: BDAG
  rationale: 그리스어는 단수 ‘일’을 쓰므로 이를 따랐고, κύριος는 본 프로젝트 기준에 따라 ‘주’로 옮겼습니다. 쉼표로 호격적-서술적 결합을 살려 ‘주, 이스라엘의 하나님’이라는 호칭 구조를 보존했습니다.
theological_decisions:
- issue: κύριος의 번역
  chosen_reading: ‘주’로 옮기고, 본문 안에서 ‘주, 이스라엘의 하나님’으로 호칭 구조를 유지했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문은 히브리어 신명 자체가 아니라 그리스어 Κυρίου를 사용하므로, 본문은 원문 표면형에 따라 ‘주’로 번역했습니다. 이는 주권적 칭호를 유지하면서도 야훼 대체 표기를 과잉 적용하지 않기 위한 선택입니다.
  doctrine_reference: 'DOCTRINE.md contested terms: κύριος → 주 / 주님'
- issue: 앗시리아 왕이라는 역사명칭 보존
  chosen_reading: 본문의 ‘앗시리아 왕’을 그대로 유지했습니다.
  alternative_readings:
  - 페르시아 왕
  - 그 왕
  rationale: 그리스어와 히브리어 평행본문이 모두 이 표기를 보존하므로, 역사적 조화로 바꾸지 않고 원문 증언을 그대로 따랐습니다. 이는 본문 비평상 중요한 긴장으로, 본문에서 지우지 않는 것이 맞습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over harmonization'
