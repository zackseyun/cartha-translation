base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/006.yaml
  text: And the sons of Israel[a], and the priests, and the Levites, and the rest from the captivity who had been brought back[b], did according to what is in the book of Moses.
  footnotes:
  - marker: a
    text: Or, more literally, 'who had been brought back' from the captivity.
    reason: lexical_alternative
  - marker: b
    text: '''From the captivity'' means from the exile; compare the exile-restoration setting reflected in the Hebrew parallel.'
    reason: cross_reference
translation:
  language: ko
  text: 이스라엘 자손과 제사장들과 레위인들과 포로 생활에서 돌아온 나머지 사람들이[a] 모세의 책에 있는 대로 행하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘돌아온’은 직역하면 ‘데려와진’ 또는 ‘돌아오게 된’이라는 수동적 뉘앙스를 지닐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰσραήλ
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 자손들
  lexicon: LSJ
  rationale: 그리스어의 전형적 혈족·언약 표현을 살려 직역에 가깝게 옮겼습니다. ‘이스라엘 사람들’은 더 자연스럽지만 원문의 어구성을 덜 드러냅니다.
- source_word: οἱ λοιποί οἱ ἐκ τῆς αἰχμαλωσίας
  english_pob_choice: the rest from the captivity
  chosen_korean: 포로 상태에서 돌아온 나머지 사람들
  alternatives_korean:
  - 포로에서 온 나머지
  - 포로의 나머지
  lexicon: LSJ
  rationale: αἰχμαλωσία를 단순히 ‘포로’로만 두기보다, 귀환 공동체 문맥에 맞게 ‘포로 상태에서 돌아온’으로 풀어 원문의 역사적 상황을 분명히 했습니다.
- source_word: οἱ προσενεχθέντες
  english_pob_choice: who had been brought back
  chosen_korean: 돌아온
  alternatives_korean:
  - 데려와진
  - 다시 데려온
  lexicon: LSJ
  rationale: 분사에 담긴 수동적 ‘되돌려 옴/귀환됨’의 뜻을 한국어에서 자연스럽게 살려 ‘돌아온’으로 옮겼습니다. 더 직역한 ‘데려와진’은 한국어가 매우 어색합니다.
- source_word: ἀκολούθως τοῖς ἐν τῇ Μωσέως βίβλῳ
  english_pob_choice: according to what is in the book of Moses
  chosen_korean: 모세의 책에 있는 대로
  alternatives_korean:
  - 모세의 책에 따라
  - 모세의 책에 기록된 대로
  lexicon: LSJ
  rationale: ἀκολούθως의 준거 의미를 한국어 관용구 ‘...에 있는 대로’로 옮겨, 모세의 책에 기록된 규범을 따랐다는 뜻을 간결하게 전달했습니다.
theological_decisions:
- issue: 귀환 공동체의 범위 표현
  chosen_reading: ‘이스라엘의 아들들, 제사장들, 레위인들, 그리고 포로 상태에서 돌아온 나머지 사람들’로, 공동체의 구성원을 열거하는 역사적 서술로 읽었습니다.
  alternative_readings:
  - ‘이스라엘 사람들’로 더 일반화
  - ‘포로에서 돌아온 자들’로 더 압축
  rationale: 본문은 예배·공동체 구성의 범주를 구체적으로 나열합니다. 이를 일반화하면 서술의 구조가 약해지므로, 열거 형식을 유지했습니다.
  doctrine_reference: 귀환 공동체와 율법 준수의 역사적 맥락
- issue: ‘모세의 책’의 권위
  chosen_reading: 모세의 책을 행위의 규범으로 제시하는 서술로 옮겼습니다.
  alternative_readings:
  - 모세 율법에 따라
  - 모세의 법에 따라
  rationale: 그리스어는 ‘책’(βίβλῳ)을 말하므로, 여기서 곧바로 ‘율법’으로 바꾸지 않고 문헌 자체를 지시하는 표현을 유지했습니다.
  doctrine_reference: 성문 기록의 권위와 순종
