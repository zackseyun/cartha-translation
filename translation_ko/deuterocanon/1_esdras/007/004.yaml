base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/004.yaml
  text: And they completed these things by the decree of the Lord[a], the God of Israel, and with the approval of Cyrus and Darius and Artaxerxes[b], kings of the Persians.
  footnotes:
  - marker: a
    text: Or 'with the consent' or 'in accordance with the decision' of Cyrus and Darius and Artaxerxes.
    reason: lexical_alternative
  - marker: b
    text: 'Greek: ''king of the Persians.'' The singular title formally follows ''Artaxerxes,'' though the sense may encompass all three named rulers as Persian kings.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 야훼, 이스라엘의 하나님께서 내리신 명령으로, 또 고레스와 다리우스와 아닥사스다, 페르시아인들의 왕의 승인과 함께[a][b] 이 일들을 마쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘동의와 함께’, ‘결정에 따라’.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 문자적으로 ‘페르시아인들의 왕’입니다. 형식상 이 칭호는 마지막으로 언급된 아닥사스다에 붙지만, 뜻은 앞의 세 통치자 모두를 아우르는 것으로 볼 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: συνετέλεσαν
  english_pob_choice: completed
  chosen_korean: 마쳤습니다
  alternatives_korean:
  - 완료했습니다
  - 끝냈습니다
  - 완성했습니다
  lexicon: BDAG
  rationale: 동사가 어떤 일을 정해진 끝까지 이뤘다는 뜻이므로, 현대 한국어에서는 자연스럽고 결과를 분명히 드러내는 ‘마쳤습니다’가 가장 적절합니다.
- source_word: διὰ προτάγματος
  english_pob_choice: by the decree
  chosen_korean: …께서 내리신 명령으로
  alternatives_korean:
  - 법령으로
  - 칙령으로
  - 명령에 따라
  lexicon: BDAG
  rationale: πρόταγμα은 공적 명령·칙령의 성격이 강하므로, ‘명령으로’가 본문의 행정적·공적 뉘앙스를 살립니다. 주어를 드러내어 ‘야훼…께서 내리신’으로 옮겨 원문의 권위 원천을 분명히 했습니다.
- source_word: τοῦ κυρίου θεοῦ Ἰσραήλ
  english_pob_choice: of the Lord, the God of Israel
  chosen_korean: 야훼, 이스라엘의 하나님
  alternatives_korean:
  - 주, 이스라엘의 하나님
  - 주 하나님 이스라엘의 하나님
  lexicon: POB glossary
  rationale: κύριος는 이 프로젝트 기본어로 ‘야훼’로 옮기며, ‘the God of Israel’은 동격을 살려 ‘이스라엘의 하나님’으로 분명히 했습니다.
- source_word: μετὰ τῆς γνώμης
  english_pob_choice: with the approval
  chosen_korean: 승인으로
  alternatives_korean:
  - 동의로
  - 허락으로
  - 판단에 따라
  lexicon: BDAG
  rationale: 고대 행정 문맥에서 γνώμη는 단순한 의견보다 공식적 승인·재가의 의미가 자연스러우므로, ‘승인으로’가 가장 간결하고 문맥에 맞습니다.
theological_decisions:
- issue: 하나님의 명령과 페르시아 왕들의 승인의 병렬 관계
  chosen_reading: 본문은 완성이 야훼의 명령과 페르시아 왕들의 승인을 함께 통해 이루어졌다고 병렬로 진술합니다.
  alternative_readings:
  - 왕들의 승인은 하나님의 명령의 부속 설명으로만 볼 수 있습니다.
  - ‘페르시아 왕들’은 문법상 마지막 왕에게만 붙는 칭호일 수 있습니다.
  rationale: 그리스어는 διὰ … καὶ μετὰ …를 병렬로 배치해 두 원인을 함께 제시합니다. 번역도 한쪽을 다른 쪽에 흡수하지 않고, 신적 주권과 제국의 행정적 승인 사이의 긴장을 그대로 둡니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
