  - 사로잡힘의 모든 자들
  lexicon: BDAG
  rationale: 직역의 ‘sons’를 그대로 살리면 한국어에서는 부자연스러워져, 포로 공동체를 가리키는 집합적 표현으로 기능을 드러내는 ‘사로잡힌 자들’로 옮겼습니다.
- source_word: ἱερεῦσιν
  english_pob_choice: the priests
  chosen_korean: 제사장들
  alternatives_korean:
