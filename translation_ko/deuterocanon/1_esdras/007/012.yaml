base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/012.yaml
  text: And they sacrificed the Passover for all the sons of the captivity[a], and for their brothers the priests[b], and for themselves.
  footnotes:
  - marker: a
    text: Or 'for all the exiles.' The Greek literally says 'for all the sons of the captivity,' a corporate expression for the returned exilic community.
    reason: lexical_alternative
  - marker: b
    text: '''The Passover'' here refers to the Passover sacrifice/observance; the Greek does not explicitly say ''lamb.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 포로 공동체에 속한 모든 이들[a]과 그들의 형제인 제사장들과 자신들을 위하여 유월절 제사를 드렸습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘포로 공동체에 속한 모든 이들’은 헬라어 직역으로는 ‘사로잡힘의 모든 아들들’이며, 포로 생활을 겪은 공동체를 가리키는 표현입니다.
    reason: source_note
  - marker: b
    text: 여기서 ‘유월절’은 유월절 제사 또는 준수를 가리킵니다. 헬라어는 ‘어린양’이라고 명시하지 않습니다.
    reason: lexical_alternative
