base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/012.yaml
  text: And they sacrificed the Passover for all the sons of the captivity[a], and for their brothers the priests[b], and for themselves.
  footnotes:
  - marker: a
    text: Or 'for all the exiles.' The Greek literally says 'for all the sons of the captivity,' a corporate expression for the returned exilic community.
    reason: lexical_alternative
  - marker: b
    text: '''The Passover'' here refers to the Passover sacrifice/observance; the Greek does not explicitly say ''lamb.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 사로잡힌 자들의 모든 자들과 자기들의 형제들인 제사장들과 자기들을 위해 유월절을 제사드렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘유월절’은 유월절 제사/행위를 가리키며, 헬라어는 ‘어린양’이라고 명시하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘사로잡힌 자들’은 헬라어의 직역인 ‘사로잡힘의 아들들’이 가리키는 귀환 포로 공동체를 자연스럽게 옮긴 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: ἔθυσαν
  english_pob_choice: sacrificed
  chosen_korean: 제사드렸습니다
  alternatives_korean:
  - 희생했습니다
  - 바쳤습니다
  - 희생제사를 드렸습니다
  lexicon: BDAG
  rationale: πάσχα와 결합한 θύω의 제의적 의미를 살려, 단순한 ‘행하다’보다 희생 제사의 행위를 분명히 드러냈습니다.
- source_word: τὸ πάσχα
  english_pob_choice: the Passover
  chosen_korean: 유월절
  alternatives_korean:
  - 유월절 제사
  - 유월절 양
  - 파스카
  lexicon: BDAG
  rationale: 문맥상 절기이면서 동시에 제사 행위를 가리키므로, 한국어 성경에서 널리 쓰이는 ‘유월절’로 옮기되 어린양을 덧붙여 과잉 특정하지 않았습니다.
- source_word: πᾶσιν τοῖς υἱοῖς τῆς αἰχμαλωσίας
  english_pob_choice: for all the sons of the captivity
  chosen_korean: 사로잡힌 자들의 모든 자들
  alternatives_korean:
  - 포로 된 모든 자들
  - 모든 포로들
  - 사로잡힘의 모든 자들
  lexicon: BDAG
  rationale: 직역의 ‘sons’를 그대로 살리면 한국어에서는 부자연스러워져, 포로 공동체를 가리키는 집합적 표현으로 기능을 드러내는 ‘사로잡힌 자들’로 옮겼습니다.
- source_word: ἱερεῦσιν
  english_pob_choice: the priests
  chosen_korean: 제사장들
  alternatives_korean:
  - 제사장인 이들
  - 사제들
  lexicon: BDAG
  rationale: 아주 일반적인 제의 용어이므로 표준적인 ‘제사장들’을 사용했습니다.
theological_decisions:
- issue: 공동체적 남성 복수 표현의 처리
  chosen_reading: ‘sons’에 해당하는 표현을 한국어에서는 집합적 의미의 ‘사로잡힌 자들’로 풀어, 수신자가 포로 귀환 공동체를 자연스럽게 이해하도록 했습니다.
  alternative_readings:
  - 사로잡힘의 아들들
  - 포로의 아들들
  - 사로잡힌 자의 자손들
  rationale: 한국어에서 ‘아들들’ 직역은 의미 전달보다 어색함을 낳기 쉬워, 원문의 공동체 지칭 기능을 보존하는 쪽이 더 충실하다고 보았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
