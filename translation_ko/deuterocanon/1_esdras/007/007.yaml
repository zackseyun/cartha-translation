  text: And they offered for the dedication of the house of the Lord one hundred bulls, two hundred rams, and four hundred lambs,
translation:
  language: ko
  text: 그들은 주님의 집 봉헌을 위하여 수소 백 마리와 숫양 이백 마리와 어린 양 사백 마리를 바쳤습니다.
  philosophy: formal
lexical_decisions:
- source_word: τοῦ ἱεροῦ τοῦ κυρίου
  english_pob_choice: the house of the Lord
  chosen_korean: 주님의 집
  alternatives_korean:
  - 주님의 성전
  - 주님의 신전
  lexicon: ἱερόν
  rationale: POB의 영어가 ‘house’를 택하므로, 성전보다 더 직접적인 ‘집’으로 옮겨 봉헌 대상의 소유·거처 이미지를 살렸습니다.
- source_word: προσήνεγκαν
  english_pob_choice: they offered
  chosen_korean: 바쳤습니다
  alternatives_korean:
  - 드렸습니다
  - 봉헌했습니다
  lexicon: προσφέρω
  rationale: 제의적 헌납 행위를 자연스러운 현대 한국어로 나타내되, 단순 ‘주다’보다 예식적 의미가 분명한 ‘바치다’를 택했습니다.
- source_word: ἐγκαινισμὸν
  english_pob_choice: dedication
  chosen_korean: 봉헌
  alternatives_korean:
  - 헌당
  - 낙성
  lexicon: ἐγκαινισμός
  rationale: 건물·집의 성별과 헌납을 함께 드러내는 말로 ‘봉헌’이 가장 무난하며, 예식적 맥락을 유지합니다.
- source_word: ταύρους / κριοὺς / ἄρνας
  english_pob_choice: bulls / rams / lambs
  chosen_korean: 수소 / 숫양 / 어린 양
  alternatives_korean:
  - 황소 / 양 / 새끼양
  lexicon: ταῦρος / κριός / ἀμνός
  rationale: 제물 목록의 구체성을 살리기 위해 축종을 분명히 구분했고, ‘어린 양’은 제의적 관용을 유지하면서도 자연스럽게 읽히도록 했습니다.
theological_decisions:
- issue: 번제·헌물의 제의적 성격
  chosen_reading: ‘봉헌을 위하여 … 바쳤습니다’로 옮겨, 단순한 기부가 아니라 거룩하게 구별된 제의 행위임을 드러냈습니다.
  alternative_readings:
  - ‘헌납했습니다’
  - ‘드렸습니다’
  rationale: 본문의 προσήνεγκαν과 ἐγκαινισμὸν은 성전/집의 봉헌에 속한 제사적 헌물을 가리키므로, 예식성을 보존하는 표현이 필요합니다.
  doctrine_reference: 제의적 봉헌의 언어
