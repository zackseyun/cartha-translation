base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/003.yaml
  text: And the holy works prospered[a], while Haggai and Zechariah the prophets were prophesying.
  footnotes:
  - marker: a
    text: Or 'the sacred works,' that is, the work on the temple.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 거룩한 일들이 번성하였으며[a], 학개와 예언자 스가랴가 예언하고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '성스러운 일들'입니다. 곧 성전과 관련된 일을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐόδα
  english_pob_choice: prospered
  chosen_korean: 번성하였으며
  alternatives_korean:
  - 잘 진행되었으며
  - 성공하였으며
  - 발전하였으며
  lexicon: LSJ
  rationale: 일이 순조롭고 좋은 결과로 나아간다는 뜻을 한국어의 자연스러운 서술로 옮겼습니다. '번성하다'는 단순한 진행보다 긍정적 성과와 활기를 함께 드러냅니다.
- source_word: τὰ ἱερὰ ἔργα
  english_pob_choice: the holy works
  chosen_korean: 거룩한 일들
  alternatives_korean:
  - 성스러운 일들
  - 성전의 일들
  - 거룩한 공사
  lexicon: LSJ
  rationale: 본문은 직접적으로 '성전'이라고 말하지 않고 '거룩한 일들'이라고 하므로, 영어 POB의 투명성을 따라 그 폭을 유지했습니다.
- source_word: προφητευόντων
  english_pob_choice: were prophesying
  chosen_korean: 예언하고 있었습니다
  alternatives_korean:
  - 예언하였습니다
  - 예언하는 중이었습니다
  - 예언하고 있었습니다
  lexicon: BDAG
  rationale: 동시 진행의 분사적 관계를 살려, 일들이 번성하던 바로 그때 예언이 계속되고 있었음을 나타냈습니다.
- source_word: Ἁγγαίου καὶ Ζαχαρίου τῶν προφητῶν
  english_pob_choice: Haggai and Zechariah the prophets
  chosen_korean: 학개와 예언자 스가랴
  alternatives_korean:
  - 학개와 스가랴 예언자들
  - 예언자 학개와 스가랴
  - 학개와 예언자 스가랴
  lexicon: 표준 외래어 표기
  rationale: 인명은 통용되는 성경 표기를 따랐고, 'τῶν προφητῶν'는 두 인물을 동일시하는 부연이므로 한국어에서는 자연스럽게 '예언자'를 붙였습니다.
theological_decisions:
- issue: ‘τὰ ἱερὰ ἔργα’를 성전 공사로 좁혀 말할지 여부
  chosen_reading: 본문의 직접 표현을 따라 '거룩한 일들'로 두고, 성전 관련 맥락은 본문 밖에서 이해하도록 했습니다.
  alternative_readings:
  - 성전 공사
  - 성전의 일들
  - 하나님의 집 공사
  rationale: 그리스어 본문은 이 절에서 성전을 명시하지 않으므로, 맥락상 가능하더라도 본문보다 더 좁은 의미를 본문에 삽입하지 않았습니다.
  doctrine_reference: 원문 우선 및 과잉해석 회피 원칙
- issue: 예언자들의 활동을 단순 완료가 아닌 진행형으로 옮길지 여부
  chosen_reading: '''예언하고 있었습니다''로 옮겨 동시적·진행적 상황을 드러냈습니다.'
  alternative_readings:
  - 예언하였습니다
  - 예언했습니다
  rationale: 분사구문의 핵심은 공사의 번성과 예언 활동이 동시에 진행되었다는 점이므로, 한국어에서도 진행성을 살렸습니다.
  doctrine_reference: 원문 시제·상(aspect) 보존 원칙
