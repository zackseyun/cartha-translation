review_pass:
  verdict: revise
  source_fidelity: 초안은 αἰχμαλωσίας의 자손과 의례적 정결의 의미를 대체로 충실히 반영합니다. 그러나 δεύτε 문장의 καὶ는 단순 접속으로 충분한데 ‘레위인들도’는 첨가의 뉘앙스를 더하며, 그리스어에 거듭 나오는 πάντες의 강조도 더 분명히 드러낼 수 있습니다.
  naturalness: ‘포로의 자손’은 직역으로는 가능하지만 현대 한국어에서는 다소 불투명합니다. ‘포로 생활을 했던 이들의 자손’이 공동체를 가리키는 관용적 표현을 유지하면서 더 자연스럽습니다. 그리스어 자체가 단편적이고 반복적이므로, 레위인 구절의 약간의 반복은 주석과 함께 보존하는 것이 적절합니다.
  terminology: ‘정결하게 하였습니다’는 ἡγνίσθησαν의 의례적 정결 의미에 알맞고, ‘레위인’도 표준 성경 용어입니다. ‘포로 생활을 했던 이들의 자손’은 원문의 전통적 집단 표지를 보존합니다.
  issues:
  - severity: medium
    issue: ‘레위인들도’의 첨가 의미
    rationale: καὶ는 여기서 앞 단편과 다음 진술을 잇는 접속사이며, ‘도’가 암시하는 특별한 첨가·대조를 반드시 요구하지 않습니다. ‘모든 레위인은’으로 옮기는 편이 더 중립적입니다.
  - severity: low
    issue: 레위인에 관한 πάντες의 반복 강조가 약화됨
    rationale: 그리스어는 πάντες를 주어와 ἅμα πάντες 및 문미에 반복합니다. 본문이 다소 단편적인 점을 인정하되 ‘모든’, ‘함께’, ‘모두’를 유지하여 강조를 가능한 한 보존하는 편이 낫습니다.
  revised_text: 그리고 포로 생활을 했던 이들의 자손 모두는 자신을 정결하게 하였습니다. 모든 레위인은 함께, 모두 자신을 정결하게 하였습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘포로된 이들의 자손’이라고 할 수 있습니다. 더 관용적으로는 ‘유배자들’이라고 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 본문은 여기서 의미상 다소 단편적이며 다음 구절로 이어지는 듯합니다. ‘자신을 정결하게 하였습니다’는 ‘정결하게 되었습니다’로도 옮길 수 있습니다.
    reason: textual_variant
  revision_rationale: ‘포로의 자손’이라는 직역적 표현을 현대 한국어에서 더 명료한 말로 다듬되, 원문의 공동체 정체성 표지는 유지했습니다. 또한 근거가 약한 ‘도’를 제거하고, 손상되었거나 단편적으로 보이는 그리스어의 반복 강조를 한국어에서 최소한으로 보존했습니다.
