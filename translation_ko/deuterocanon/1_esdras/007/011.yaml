base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/011.yaml
  text: and all the sons of the captivity[a], because they had purified themselves. For all the Levites together had purified themselves, all of them[b],
  footnotes:
  - marker: a
    text: Or, 'children of the exile' or more idiomatically, 'the exiles.'
    reason: lexical_alternative
  - marker: b
    text: The Greek text here is fragmentary in sense and appears to continue into the next clause; 'had purified themselves' may also be rendered 'were purified.'
    reason: textual_variant
translation:
  language: ko
  text: 그리고 포로의 자손[a]은 모두 자신을 정결하게 하였습니다. 레위인들도 모두 함께[b] 자신을 정결하게 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '포로된 자들', 더 관용적으로는 '유배자들'로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 여기서 뜻이 다소 단편적이며 다음 절로 이어지는 듯합니다. 따라서 '자신을 정결하게 하였습니다' 또는 '정결하게 되었습니다'로도 옮길 수 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ τῆς αἰχμαλωσίας
  english_pob_choice: sons of the captivity
  chosen_korean: 포로의 자손
  alternatives_korean:
  - 포로들의 자녀
  - 포로 된 자들
  - 유배자들
  lexicon: LSJ
  rationale: 그리스어의 관용적 집단 표지를 살리면서도 한국어에서 자연스럽고 직역성을 유지하는 표현으로 옮겼습니다. EN POB의 'sons of the captivity'처럼 공동체 정체성을 드러내는 말입니다.
- source_word: ἡγνίσθησαν
  english_pob_choice: had purified themselves
  chosen_korean: 자신을 정결하게 하였습니다
  alternatives_korean:
  - 정결하게 되었습니다
  - 자신을 깨끗하게 하였습니다
  - 자신을 성결하게 하였습니다
  lexicon: LSJ
  rationale: 문맥상 의례적 준비를 뜻하므로 내적 도덕성보다 정결 예식을 반영하는 '정결하게 하다'를 택했습니다. 중간/수동 형태의 자기-준비 뉘앙스를 한국어에서 자연스럽게 드러냈습니다.
- source_word: λευεῖται
  english_pob_choice: Levites
  chosen_korean: 레위인들
  alternatives_korean:
  - 레위 사람들
  - 레위 족속
  lexicon: LSJ
  rationale: 성경에서 널리 통용되는 고유 집단명으로 옮겼습니다. 복수 표지를 살려 문맥의 집단성을 유지했습니다.
- source_word: ἅμα πάντες
  english_pob_choice: all together
  chosen_korean: 모두 함께
  alternatives_korean:
  - 한꺼번에 모두
  - 다 함께
  - 모두 일제히
  lexicon: LSJ
  rationale: '''함께''와 ''모두''를 병치해 레위인 전체가 한데 정결해졌다는 총체성을 살렸습니다. EN POB의 ''all together''와 반복된 ''all''의 강조를 한국어에서도 유지했습니다.'
theological_decisions:
- issue: 정결 언어의 범위
  chosen_reading: 의례적 정결 준비를 뜻하는 표현으로 이해했습니다.
  alternative_readings:
  - 도덕적 순결의 선언으로 읽기
  - 그저 몸을 씻는 물리적 행위로만 제한하기
  rationale: 이 절은 예배/성전 봉사를 위한 준비 문맥이므로, 내적 윤리화나 단순 위생으로 축소하지 않고 의례적 정결의 의미를 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 5
