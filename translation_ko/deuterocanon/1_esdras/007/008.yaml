  rationale: 희생 제의 문맥에서 χίμαρος는 수염소를 가리키므로, 한국어로는 희생 동물의 성별이 드러나는 ‘숫염소’가 가장 정확합니다.
- source_word: ὑπὲρ ἁμαρτίας
  english_pob_choice: for the sin
  chosen_korean: 속죄제로
  alternatives_korean:
  - 죄를 위하여
  - 죄를 위한 제물로
  - 속죄 제물로
  lexicon: LSJ
  rationale: 직역보다 제의적 기능을 드러내는 표현이 한국어에서 더 자연스럽고, 문맥상 ‘죄를 위한 제물’이라는 희생 의미를 분명히 전달합니다.
- source_word: παντὸς τοῦ Ἰσραήλ
  english_pob_choice: of all Israel
  chosen_korean: 모든 이스라엘을 위한
  alternatives_korean:
  - 온 이스라엘의
  - 모든 이스라엘에 대한
  - 온 이스라엘을 위한
  lexicon: LSJ
  rationale: 희생 제사의 대상/대리성을 살리기 위해 ‘~을 위한’으로 옮겼고, 헬라어의 포괄 범위를 자연스럽게 드러냅니다.
- source_word: φυλάρχων
  english_pob_choice: tribal leaders
  chosen_korean: 지파 지도자들
  alternatives_korean:
  - 지파들의 우두머리들
  - 지파장들
  - 족장들
  lexicon: LSJ
  rationale: φυλάρχης의 뜻은 지파의 우두머리이므로, 현대 한국어에서 이해하기 쉬운 ‘지파 지도자들’이 적절합니다.
theological_decisions:
