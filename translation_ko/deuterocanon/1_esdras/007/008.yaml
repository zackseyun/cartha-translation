translation:
  language: ko
  text: 모든 이스라엘을 위한 속죄제물로 숫염소 열두 마리를, 이스라엘의 열두 지파 지도자 수에 맞추어 드렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘모든 이스라엘의 죄를 위하여’입니다. 희생 제의 문맥에서는 속죄제물을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: χιμάρους
  english_pob_choice: goats
  chosen_korean: 숫염소
  alternatives_korean:
  - 염소
  - 숫염소들
