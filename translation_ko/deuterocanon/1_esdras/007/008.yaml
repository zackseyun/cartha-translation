  alternative_readings:
  - ‘죄를 위하여’
  - ‘죄를 위한 제물로’
  rationale: 히브리/그리스어 희생 제사 문맥에서는 단순한 목적어구보다 속죄 제사의 기능을 드러내는 번역이 한국어 독자에게 본문 의도를 더 정확히 전달합니다.
