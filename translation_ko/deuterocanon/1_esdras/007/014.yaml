base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/014.yaml
  text: And they kept the Feast of Unleavened Bread for seven days[a], rejoicing before the Lord,
  footnotes:
  - marker: a
    text: 'Greek: ''before the Lord''; the Hebrew parallel similarly frames the celebration as joyful before YHWH.'
    reason: cross_reference
translation:
  language: ko
  text: 그들은 무교절을 칠 일 동안 지켰고, 주 앞에서 기뻐했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ἔναντι는 ‘~앞에서’라는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: ἤγαγον
  english_pob_choice: kept
  chosen_korean: 지켰고
  alternatives_korean:
  - 지냈고
  - 거행했고
  - 준수했고
  lexicon: LSJ
  rationale: 절기 문맥에서는 단순히 ‘인도하다’보다 절기를 ‘지키다/거행하다’가 idiomatic하며, EN POB의 kept를 한국어로 자연스럽게 옮겼습니다.
- source_word: τὴν ἑορτὴν τῶν ἀζύμων
  english_pob_choice: the Feast of Unleavened Bread
  chosen_korean: 무교절
  alternatives_korean:
  - 무교병의 절기
  - 누룩 없는 빵의 절기
  - 무교절기
  lexicon: LSJ
  rationale: τῶν ἀζύμων은 유대 절기명 ‘Unleavened Bread’의 관용적 표지이므로, 한국어 성경에서 널리 쓰이는 ‘무교절’로 간결하게 옮겼습니다.
- source_word: ἑπτὰ ἡμέρας
  english_pob_choice: for seven days
  chosen_korean: 칠 일 동안
  alternatives_korean:
  - 일곱 날 동안
  - 일곱 날을
  lexicon: LSJ
  rationale: 지속 기간을 나타내는 표현으로 한국어에서는 ‘칠 일 동안’이 가장 자연스럽고, 원문의 기간 의미를 보존합니다.
- source_word: εὐφραινόμενοι
  english_pob_choice: rejoicing
  chosen_korean: 기뻐했습니다
  alternatives_korean:
  - 즐거워했습니다
  - 기뻐하며 지냈습니다
  - 환호했습니다
  lexicon: LSJ
  rationale: 분사형의 동반 상태를 한국어 서술로 풀되 과장하지 않기 위해 ‘기뻐했습니다’를 택했습니다. 절기의 즐거움이라는 맥락도 반영합니다.
- source_word: ἔναντι Κυρίου
  english_pob_choice: before the Lord
  chosen_korean: 주 앞에서
  alternatives_korean:
  - 주님 앞에서
  - 하나님 앞에서
  - 야훼 앞에서
  lexicon: LSJ
  rationale: ἔναντι는 ‘~앞에서/면전에’의 의미이므로 위치감을 살려 ‘주 앞에서’로 옮겼습니다. κύριος는 본문 관례에 따라 ‘주’로 유지했습니다.
theological_decisions:
- issue: LXX의 Κυρίου를 한국어로 어떻게 표기할지
  chosen_reading: 주
  alternative_readings:
  - 주님
  - 야훼
  - 여호와
  rationale: 본문의 그리스어는 Κυρίου이며, 여기서는 하나님의 이름을 직접 표기하는 대신 문맥상의 호칭을 따라 ‘주’로 번역해 LXX 표기와 POB 용례를 유지했습니다.
  doctrine_reference: 'POB glossary: κύριος (of Jesus) → 주/주님; LXX divine-name references are handled by context rather than automatic substitution in every verse.'
