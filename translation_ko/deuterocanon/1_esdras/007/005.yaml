  source_fidelity: 그리스어 συνετελέσθη의 수동적 완공 의미와 다리오 왕 제6년이라는 연대는 잘 반영되었습니다. 그러나 ἕως(‘~까지’)를 ‘~에’로 옮기면 완료가 그 날짜에 이르렀다는 시간 범위/한계를 약화합니다. 본문에는 ‘~까지’를 반영하는 것이 안전합니다. οἶκος를 ‘성전’으로 의미역한 것은 문맥상 가능하되, 그리스어의 직접 표현이 ‘집’임을 주석으로 밝혀야 합니다.
  naturalness: ‘아달월 스물셋 날’은 현대 표준어에서는 ‘아달월 스물셋째 날’이 더 자연스럽습니다. ‘다리오 왕 제육년’도 전통 성경 문체로는 가능하지만, 현대 합쇼체 표준어에는 ‘다리오 왕의 여섯째 해’가 더 자연스럽고 명료합니다.
