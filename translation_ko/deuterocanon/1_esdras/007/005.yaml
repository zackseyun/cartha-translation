base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/005.yaml
  text: The house was completed by the twenty-third day of the month Adar[b][a], in the sixth year of King Darius.
  footnotes:
  - marker: a
    text: Or, more literally, 'until the third and twentieth of the month Adar.'
    reason: lexical_alternative
  - marker: b
    text: That is, the temple; the Greek text reads simply 'the house.'
    reason: cross_reference
translation:
  language: ko
  text: 성전은 다리오 왕 제육년 아달월 스물셋 날에 완공되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 성전입니다. 그리스어 본문은 단지 '집'이라고만 합니다.
    reason: cross_reference
  - marker: b
    text: 더 문자적으로는 '아달월의 스물셋째 날까지'입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνετελέσθη
  english_pob_choice: was completed
  chosen_korean: 완공되었습니다
  alternatives_korean:
  - 완성되었습니다
  - 끝났습니다
  lexicon: BDAG / LSJ
  rationale: 수동 완료 의미를 자연스러운 현대 한국어로 살리면서, 건축물의 완성이라는 문맥에 맞게 '완공되었습니다'로 옮겼습니다.
- source_word: ὁ οἶκος
  english_pob_choice: the house
  chosen_korean: 성전
  alternatives_korean:
  - 집
  - 하나님의 집
  lexicon: BDAG
  rationale: 직역하면 '집'이지만, 이 문맥에서는 예루살렘 성전을 가리키므로 한국어 독자가 오해하지 않도록 의미를 드러냈습니다.
- source_word: ἕως τρίτης καὶ εἰκάδος μηνὸς Ἀδὰρ
  english_pob_choice: by the twenty-third day of the month Adar
  chosen_korean: 아달월 스물셋 날에
  alternatives_korean:
  - 아달월 스물셋째 날에
  - 아달월 스물세 날에
  lexicon: LSJ
  rationale: 그리스어 날짜 관용구를 한국어 날짜 표현으로 자연스럽게 옮겨, 완료 시점을 분명히 했습니다.
- source_word: τοῦ ἕκτου ἔτους βασιλέως Δαρείου
  english_pob_choice: in the sixth year of King Darius
  chosen_korean: 다리오 왕 제육년
  alternatives_korean:
  - 다리오 왕의 제육년
  - 다리오 왕의 여섯째 해
  lexicon: BDAG
  rationale: 왕의 치세 연대 표기를 한국어 성경 문체에 맞게 간결하게 옮겼습니다.
theological_decisions:
- issue: οἶκος의 번역에서 'house'를 직역할지 성전으로 드러낼지
  chosen_reading: 본문 의미를 드러내는 '성전'으로 번역했습니다.
  alternative_readings:
  - 집
  - 하나님의 집
  rationale: 이 절의 '집'은 문자적 건물을 넘어 예루살렘 성전 전체를 가리키므로, 독자가 본문 기능을 즉시 이해하도록 의미역을 택했습니다.
  doctrine_reference: 구약 성전 서술 문맥
