  source_fidelity: ‘포로 생활에서 나온’은 귀환이라는 방향성을 덧붙일 수 있어, 단지 ‘포로 생활에서/포로 생활을 겪은’이라고 한 그리스어의 표현보다 좁습니다. 또한 두 분사는 ‘모든 사람’을 함께 수식하므로 이를 한국어 문장 구조에서 분명히 드러내는 편이 좋습니다. 목적어를 보충하지 않고 ‘먹었습니다’로 둔 점은 원문에 충실합니다.
  naturalness: 현 번역의 ‘이스라엘 자손은, 곧 … 모든 사람이’는 주제 표지와 서술 주어의 호응이 다소 어색합니다. ‘이스라엘 자손들, 곧 … 모든 사람이’로 정리하고 두 분사를 병렬로 처리하면 현대 한국어 문장으로 더 자연스럽습니다.
