base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/013.yaml
  text: And the sons of Israel who were from the captivity ate[a], all those who had separated themselves from the abominations of the nations of the land[b], seeking the Lord.
  footnotes:
  - marker: a
    text: That is, they ate the Passover meal; the object is implicit in the Greek from the preceding context.
    reason: cross_reference
  - marker: b
    text: Or 'the peoples of the land.' The phrase refers to the surrounding inhabitants whose practices were regarded as defiling.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 포로 생활에서 나온 이스라엘 자손은, 곧 그 땅의 민족들의 가증한 것들에서 자신을 분리한 모든 사람이, 주님을 찾으면서 먹었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 앞선 문맥상 유월절 식사를 가리킵니다. 그리스어 본문에는 목적어가 직접 나오지 않습니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘그 땅의 백성들’. 이 표현은 주변 거주민들과 그들의 관습을 가리키는 것으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰσραήλ
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: LSJ
  rationale: 그리스어의 혈연·언약적 표현을 살리되, 한국어에서는 자연스럽고 널리 이해되는 성서적 표현인 ‘이스라엘 자손’으로 옮겼습니다.
- source_word: οἱ ἐκ τῆς αἰχμαλωσίας
  english_pob_choice: who were from the captivity
  chosen_korean: 포로 생활에서 나온
  alternatives_korean:
  - 포로에서 나온
  - 포로 신분에서 나온
  lexicon: LSJ
  rationale: ‘captivity’를 단순한 상태가 아니라 포로 생활/유배의 현실로 읽어, 출신 배경을 분명히 하면서도 본문의 관계를 자연스럽게 표현했습니다.
- source_word: χωρισθέντες ἀπὸ τῶν βδελυγμάτων
  english_pob_choice: had separated themselves from the abominations
  chosen_korean: 가증한 것들에서 자신을 분리한
  alternatives_korean:
  - 가증한 것들에서 스스로 분리한
  - 가증한 것들을 떠난
  lexicon: LSJ
  rationale: 수동 분사이지만 문맥상 자기 분리의 의미가 분명하므로 ‘자신을 분리한’으로 옮겼고, βδελύγματα는 강한 부정적 종교·도덕적 용어인 ‘가증한 것들’로 유지했습니다.
- source_word: τῶν ἐθνῶν τῆς γῆς
  english_pob_choice: of the nations of the land
  chosen_korean: 그 땅의 민족들
  alternatives_korean:
  - 그 땅의 나라들
  - 그 땅의 백성들
  lexicon: LSJ
  rationale: ἔθνη의 기본 의미를 살려 ‘민족들’로 옮겼고, POB의 주석처럼 주변 거주 집단을 가리키는 넓은 표현으로 유지했습니다.
- source_word: ζητοῦντες τὸν κύριον
  english_pob_choice: seeking the Lord
  chosen_korean: 주님을 찾으면서
  alternatives_korean:
  - 주님을 찾으며
  - 주님을 구하면서
  lexicon: LSJ
  rationale: 현재분사의 지속적·동시적 뉘앙스를 살려 ‘…하면서’로 처리했고, κύριον은 프로젝트 기본값에 따라 ‘주님’으로 옮겼습니다.
theological_decisions:
- issue: ‘먹었습니다’의 대상이 본문에 직접 제시되지 않는 문제
  chosen_reading: 본문에는 단순히 ‘먹었습니다’로 두고, 대상은 드러내지 않습니다.
  alternative_readings:
  - 유월절 식사를 먹었습니다
  - 그것을 먹었습니다
  rationale: 바로 앞 문맥에서 유월절 식사임은 분명하지만, 이 절 자체에는 목적어가 없으므로 과잉보충을 피했습니다.
  doctrine_reference: '번역 철학: 원문이 허락하는 만큼만 명시하고, 문맥적 이해를 본문에 덧씌우지 않습니다.'
- issue: ‘가증한 것들’의 강한 종교·도덕적 어조
  chosen_reading: 부정함을 완화하지 않고 강한 표현을 유지했습니다.
  alternative_readings:
  - 혐오스러운 관습
  - 더러운 것들
  rationale: 이 표현은 단순한 문화적 차이가 아니라 제의적·도덕적 오염과 결부된 강한 언어이므로, 본문의 긴장감을 보존했습니다.
  doctrine_reference: '번역 철학: 본문이 가진 신학적 무게를 약화시키지 않습니다.'
