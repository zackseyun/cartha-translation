  source_fidelity: 그리스어의 미완료 과거 ἐπεστάτουν을 지속적인 감독 행위로 ‘감독했습니다’라고 옮겼고, τῶν ἱερῶν ἔργων의 직역적 범위와 ἐπιμελέστερον의 비교급(‘더욱’)도 보존했습니다. συνεργοῦντες 및 두 여격 대상은 ‘유대인의 장로들과 성전 감독들과 함께 일하면서’로 충실히 반영되었습니다.
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘거룩한 일들’은 일상어에서는 다소 문어적이지만, 원문의 의도적인 포괄성과 성전 문맥을 보존하는 성서 번역 표현으로 적절합니다.
  terminology: ‘유대인의 장로들’과 ‘성전 감독들’은 각각 πρεσβυτέροις τῶν Ἰουδαίων 및 ἱεροστάταις를 과도한 직분 추정 없이 잘 옮깁니다. ‘성전 사역’이라는 각주 표현은 설명적 용례이며, 본문 자체가 ‘일들’의 어휘적 여지를 유지하므로 문제되지 않습니다.
