base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/002.yaml
  text: They supervised the holy works more diligently[a], working together with the elders of the Jews and the temple overseers.
  footnotes:
  - marker: a
    text: Or, 'the sacred works' or 'the temple work.' The Greek literally says 'the holy works'; the Hebrew parallel speaks of 'the work of the house of God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 유대인의 장로들과 성전 감독들과 함께 일하면서, 거룩한 일들을 더욱 세심하게 감독했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘거룩한 일들’입니다. 히브리어 평행 본문은 ‘하나님의 집의 일’이라고 말해, 성전 사역을 가리키는 뜻임을 뒷받침합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεστάτουν
  english_pob_choice: they supervised
  chosen_korean: 감독했습니다
  alternatives_korean:
  - 관리했습니다
  - 감당했습니다
  - 지휘했습니다
  lexicon: LSJ
  rationale: 지속적이고 상위의 관리·감독을 나타내므로, 현대 한국어에서 가장 자연스러운 ‘감독하다’가 가장 가깝습니다.
- source_word: τῶν ἱερῶν ἔργων
  english_pob_choice: the holy works
  chosen_korean: 거룩한 일들
  alternatives_korean:
  - 성스러운 일들
  - 성전의 일들
  - 거룩한 작업들
  lexicon: LSJ
  rationale: 직역에 가까운 ‘거룩한 일들’이 그리스어 표현을 보존하면서도, 본문 맥락의 성전 관련 일을 과도하게 좁히지 않습니다.
- source_word: ἐπιμελέστερον
  english_pob_choice: more diligently
  chosen_korean: 더욱 세심하게
  alternatives_korean:
  - 더욱 부지런히
  - 더욱 주의 깊게
  - 더욱 정성껏
  lexicon: LSJ
  rationale: 비교급의 ‘더’와 주의·배려의 뉘앙스를 살리기 위해 ‘세심하게’를 택했습니다.
- source_word: συνεργοῦντες
  english_pob_choice: working together
  chosen_korean: 함께 일하면서
  alternatives_korean:
  - 협력하면서
  - 동역하면서
  - 공동으로 일하면서
  lexicon: LSJ
  rationale: 뒤따르는 두 집단과의 동반·협력 관계를 자연스럽게 드러내는 표현입니다.
- source_word: ἱεροστάταις
  english_pob_choice: the temple overseers
  chosen_korean: 성전 감독들
  alternatives_korean:
  - 성전 관리자들
  - 성소 담당자들
  - 성전 책임자들
  lexicon: LSJ
  rationale: 직무의 핵심이 감독·관리이므로, 과도한 직분 추정 없이 기능을 드러내는 ‘성전 감독들’이 적절합니다.
theological_decisions:
- issue: ἱερῶν ἔργων의 성전 관련성 표현
  chosen_reading: ‘거룩한 일들’로 옮기되, 다음 구절의 ‘성전 감독들’과 함께 읽힐 때 성전 사역을 가리키는 문맥이 드러나도록 했습니다.
  alternative_readings:
  - ‘성전 일들’로 명시적으로 옮김
  - ‘하나님의 집의 일들’로 의역
  rationale: 그리스어는 문자적으로 ‘거룩한 일들’이라고 말하므로 그 표현을 유지하는 것이 원문에 충실합니다. 다만 문맥상 성전 관련 봉사를 암시하므로, 뒤의 병행 표현으로 그 의미를 보강했습니다.
  doctrine_reference: 'PHILOSOPHY.md: source-first, avoid flattening lexical tension'
