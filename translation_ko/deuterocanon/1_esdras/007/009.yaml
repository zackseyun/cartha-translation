base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/009.yaml
  text: And the priests and the Levites stood arrayed by divisions for the works of the Lord God of Israel[a], in accordance with the book of Moses[b], and the gatekeepers at each gate.
  footnotes:
  - marker: a
    text: Or 'according to tribes.' The Greek reads literally 'by tribes,' likely referring to the ordered divisions of priestly and Levitical service.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew parallel emphasizes strengthening their hands in the work of the house of God; the Greek here focuses on the priests' and Levites' ordered placement for the Lord God's works.
    reason: cross_reference
translation:
  language: ko
  text: 제사장들과 레위인들은 지파별로[a] 차려입고 이스라엘의 주 하나님의 일들을 위하여 모세의 책을 따라[b] 서 있었으며, 문지기들은 각 문에 서 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘지파들에 따라’입니다. 제의적 맥락에서는 정해진 제사장과 레위인의 봉사 편제를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 병행 본문은 하나님의 집의 일을 하도록 그들의 손을 강하게 하셨다는 점을 강조합니다. 여기의 그리스어 본문은 이스라엘의 주 하나님의 일을 위한 제사장들과 레위인들의 질서 있는 배치에 초점을 둡니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἔστησαν
  english_pob_choice: stood
  chosen_korean: 서 있었습니다
  alternatives_korean:
  - 서 있었습니다
  - 자리를 잡았습니다
  - 자기 자리에 섰습니다
  lexicon: LSJ
  rationale: 동사 ἔστησαν의 기본 서다/서 있게 되다의 뜻을 자연스러운 서술문으로 옮겼습니다. 앞뒤의 조직된 배치를 고려하면 단순한 ‘서 있었습니다’가 가장 무난합니다.
- source_word: ἐστολισμένοι
  english_pob_choice: arrayed
  chosen_korean: 차려입고
  alternatives_korean:
  - 차려입고
  - 갖추어 입고
  - 예복을 입고
  lexicon: LSJ
  rationale: 본문은 제의적 정렬과 준비 상태를 말하지만, 구체적 의복 명칭은 없습니다. ‘차려입고’는 의례적 단정함을 살리면서도 과도한 해석을 피합니다.
- source_word: κατὰ φυλάς
  english_pob_choice: by divisions
  chosen_korean: 지파별로
  alternatives_korean:
  - 지파별로
  - 분반대로
  - 부서별로
  lexicon: LSJ
  rationale: 직역하면 ‘지파들에 따라’이지만, 영어 POB도 제의적 조직 단위를 반영해 ‘by divisions’로 풀었습니다. 한국어에서는 이 조직적 구분을 가장 자연스럽게 드러내는 ‘지파별로’를 택했습니다.
- source_word: ἐπὶ τῶν ἔργων
  english_pob_choice: for the works
  chosen_korean: …의 일들을 위해
  alternatives_korean:
  - …의 일들을 위해
  - …의 일에 대하여
  - …의 사역을 위해
  lexicon: LSJ
  rationale: ἔργα는 단순한 노동보다 하나님을 섬기는 행위 전반을 가리킬 수 있으므로, ‘사역’처럼 해석어를 앞세우기보다 ‘일들’을 유지해 원문의 폭을 보존했습니다.
- source_word: Κυρίου θεοῦ Ἰσραήλ
  english_pob_choice: the Lord God of Israel
  chosen_korean: 야훼 하나님 이스라엘
  alternatives_korean:
  - 이스라엘의 주 하나님
  - 이스라엘의 주 하나님 야훼
  lexicon: LSJ
  rationale: 그리스어 κύριος를 프로젝트 기본값대로 ‘주’가 아니라 문맥상 이름과 결합한 신칭으로 보고, 1차 본문을 따라 ‘야훼’로 옮겼습니다. ‘하나님 이스라엘’은 소유격 구조를 한국어로 간결하게 반영한 것입니다.
- source_word: ἀκολούθως τῇ Μωσέως βίβλῳ
  english_pob_choice: in accordance with the book of Moses
  chosen_korean: 모세의 책에 따라
  alternatives_korean:
  - 모세의 책에 따라
  - 모세의 책에 맞추어
  - 모세의 책을 따라
  lexicon: LSJ
  rationale: ἀκολούθως는 규범적 일치의 뜻이므로 ‘따라’가 가장 직접적입니다. 영어 POB의 ‘in accordance with’를 그대로 살리되 문장 흐름은 한국어답게 다듬었습니다.
- source_word: θυρωροί
  english_pob_choice: gatekeepers
  chosen_korean: 문지기들
  alternatives_korean:
  - 문지기들
  - 문을 지키는 사람들
  - 성문지기들
  lexicon: LSJ
  rationale: 성전 맥락의 직책 명칭으로는 ‘문지기들’이 가장 간결하고 자연스럽습니다. 필요 이상의 제도적 용어를 덧붙이지 않았습니다.
theological_decisions:
- issue: κύριος를 한국어로 어떻게 옮길지
  chosen_reading: 그리스어 본문의 Κυρίου를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주
  - 주님
  - 여호와
  rationale: 이 절의 κύριος는 1차 본문인 그리스어에서 나온 호칭이지만, 뒤에 ‘이스라엘의 하나님’이 이어져 야훼 지칭으로 읽는 것이 가장 자연스럽습니다. 프로젝트 기본값도 YHWH에 ‘야훼’를 권장하므로 이를 따랐습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼; κύριος (when citing YHWH) → 야훼'
- issue: κατὰ φυλάς의 의미를 제의 조직으로 볼지 혈연 지파로 볼지
  chosen_reading: 지파별로는 문자적 가능성을 살리면서, 실제 문맥은 성전 봉사 편제를 가리키는 것으로 처리했습니다.
  alternative_readings:
  - 지파에 따라
  - 반열별로
  - 조별로
  rationale: 영어 POB도 literal ‘according to tribes’와 cultic grouping의 긴장을 남겨 두었습니다. 본문 자체가 제사장·레위인·문지기를 나열하므로 단순 혈연보다 봉사 편제가 우선하는 것으로 읽되, 한국어에서는 그 긴장을 과도하게 풀지 않았습니다.
  doctrine_reference: 1 Esdras 7:9 parallel-service context
