  terminology: ‘아딘의 아들들’은 υἱῶν의 족보·명단 관용을 보존합니다. ‘마나셰’는 널리 알려진 인명의 히브리 전통 표기인 ‘므낫세’로 평준화하지 않고, 영어 감사 기록과 그리스어 형태를 따른 기존 방침을 유지할 수 있습니다. 각주에는 그리스어 인명 형태와 근사한 히브리어 병행 본문 사이의 차이를 명시하여 근거를 더 완전하게 제시했습니다.
