  source_fidelity: 그리스어의 나열 구조, ‘아딘의 아들들 가운데서’라는 집단 소속 표현, 그리고 인명 순서는 충실히 반영했습니다. 다만 Βαλνοῦς의 ου는 이 구절의 다른 이름 Λακκοῦνος에서처럼 ‘우’로 일관되게 옮기는 것이 그리스어 형태에 더 가깝습니다. 따라서 ‘발노우스’는 ‘발누스’로 고쳤습니다.
