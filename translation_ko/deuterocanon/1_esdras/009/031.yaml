base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/031.yaml
  text: 'And from the sons of Addin: Lathos and Moosseias[a], Lakkounos and Naidos, and Beskaspasmos and Sesthel and Balnous and Manasseh.'
  footnotes:
  - marker: a
    text: The Greek witness here is a list of personal names, several of which are textually uncertain or differ from the approximate Hebrew parallel. The translation therefore follows the Greek forms closely rather than harmonizing them to the Masoretic tradition.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 아딘의 아들들 가운데서는 라토스와 모오스세이아스[a], 락쿠노스와 나이도스, 그리고 베스카스파스모스와 세스텔과 발노우스와 마나셰가 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이곳의 그리스어 본문은 몇몇 이름이 문헌상 불확실한 인명 목록입니다. 따라서 번역은 마소라 본문과 조화시키기보다 그리스어 형태를 가깝게 따랐습니다.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ ἐκ τῶν υἱῶν Ἀδδείν
  english_pob_choice: And from the sons of Addin
  chosen_korean: 그리고 아딘의 아들들 가운데서는
  alternatives_korean:
  - 그리고 아딘의 아들들 중에서
  - 그리고 아딘의 자손들 가운데서는
  lexicon: LSJ
  rationale: ἐκ + 속격은 목록 문맥에서 집단 가운데 ‘~에서/중에서’의 출처를 나타내므로, 이를 살려 ‘가운데서는’으로 옮겼습니다. υἱῶν은 여기서 족보적 집단을 가리키므로 ‘아들들’이 가장 근접합니다.
- source_word: Λάθος
  english_pob_choice: Lathos
  chosen_korean: 라토스
  alternatives_korean:
  - 라토스
  - 라투스
  lexicon: Greek proper name transliteration
  rationale: 의미를 번역할 수 없는 고유명사이므로 음역했습니다.
- source_word: Μοοσσείας
  english_pob_choice: Moosseias
  chosen_korean: 모오스세이아스
  alternatives_korean:
  - 모오스세이아스
  - 모스세이아스
  lexicon: Greek proper name transliteration
  rationale: 스웨테 본문의 그리스어 표기를 최대한 따라, 겹모음과 자음군을 보존하는 방향으로 음역했습니다.
- source_word: Βεσκασπασμὸς
  english_pob_choice: Beskaspasmos
  chosen_korean: 베스카스파스모스
  alternatives_korean:
  - 베스카스파스모스
  - 베스카스파스모스
  lexicon: Greek proper name transliteration
  rationale: 히브리어 평행본문과 조화시키지 않고, 본문의 불확실한 그리스어 이름 형태를 그대로 반영하기 위해 음역을 유지했습니다.
- source_word: Μανασσῆς
  english_pob_choice: Manasseh
  chosen_korean: 마나셰
  alternatives_korean:
  - 마나세
  - 므낫세
  lexicon: Biblical proper name
  rationale: 이름 자체는 널리 알려진 성서 인명이며, 한국어에서는 히브리식 전통형 ‘므낫세’보다 음역에 가까운 ‘마나셰’가 그리스어 μορφή를 더 직접적으로 반영합니다.
theological_decisions:
- issue: 이 절이 인명 목록만 제시하는지, 평준화하여 유대계 족보 명단으로 매끄럽게 처리할지
  chosen_reading: 문장의 기능을 그대로 살려 단순한 명단 형식으로 번역했습니다.
  alternative_readings:
  - 족보적 맥락을 보강해 서술적으로 풀어쓰는 방식
  - 평행 히브리 전통에 맞추어 이름들을 정리하는 방식
  rationale: 본문은 신학적 진술보다 목록 제시에 초점이 있으므로, 의미 확장 없이 나열 구조를 보존하는 것이 원문 의도에 가장 충실합니다.
  doctrine_reference: 성경 본문 해석의 문맥 우선 원칙
- issue: 마나셰의 한국어 표기 선택
  chosen_reading: 그리스어 형태를 살리는 ‘마나셰’를 채택했습니다.
  alternative_readings:
  - 므낫세
  - 므나쎄
  rationale: 본문의 1차 기준은 스웨테 그리스어이며, 병행 히브리 전통과 완전히 합치시키기보다 원전 형태를 드러내는 것이 이 구절의 문헌적 긴장을 보존합니다.
  doctrine_reference: 원전 우선 번역 원칙
