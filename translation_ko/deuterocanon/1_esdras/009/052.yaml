base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/052.yaml
  text: For the day is holy to the Lord[a], and do not be grieved; for the Lord will glorify you.
  footnotes:
  - marker: a
    text: The Hebrew parallel in Nehemiah 8:10 differs here, reading approximately, 'for the joy of the LORD is your strength.' 1 Esdras' Greek instead says, 'for the Lord will glorify you.'
    reason: alternative_reading
translation:
  language: ko
  text: 이는 주님께 거룩한 날이니, 슬퍼하지 마십시오. 주님께서 여러분을 영화롭게 하실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 평행본문(느헤미야 8:10)은 대체로 “여호와의 기쁨이 너희의 힘”으로 읽히지만, 1 Esdras의 그리스어는 여기서 “주님께서 여러분을 영화롭게 하실 것입니다”라고 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἁγία ... ἡ ἡμέρα
  english_pob_choice: the day is holy
  chosen_korean: 거룩한 날
  alternatives_korean:
  - 성스러운 날
  - 성별된 날
  lexicon: LXX Greek ἅγιος / ἡμέρα
  rationale: ἁγία는 단순한 종교적 분위기보다 하나님께 구별된 상태를 뜻하므로, 현대 한국어에서는 자연스럽고 성경적인 '거룩한 날'이 가장 직접적입니다.
- source_word: τῷ κυρίῳ
  english_pob_choice: to the Lord
  chosen_korean: 주님께
  alternatives_korean:
  - 주님에게
  - 주를 위하여
  lexicon: LXX Greek κύριος
  rationale: 여기서 여격은 그 날의 소속·헌정 관계를 나타내므로, 한국어에서는 '주님께'가 헌정의 뉘앙스를 가장 잘 살립니다.
- source_word: μὴ λυπεῖσθε
  english_pob_choice: do not be grieved
  chosen_korean: 슬퍼하지 마십시오
  alternatives_korean:
  - 근심하지 마십시오
  - 비통해하지 마십시오
  lexicon: BDAG / LXX usage of λυπέω
  rationale: λυπέω는 단순 감정의 침울함보다 실제로 마음이 상하고 괴로운 상태를 가리킬 수 있어, 권면형으로는 '슬퍼하지 마십시오'가 자연스럽고 무게도 유지합니다.
- source_word: δοξάσει
  english_pob_choice: will glorify
  chosen_korean: 영화롭게 하실 것입니다
  alternatives_korean:
  - 영광스럽게 하실 것입니다
  - 영광을 주실 것입니다
  lexicon: BDAG / LXX Greek δοξάζω
  rationale: δοξάζω는 영광/존귀의 영역에 속하므로 '영화롭게 하실 것입니다'가 동사 의미를 가장 직접적으로 옮기며, 단순한 '존중하다'보다 신학적 힘을 보존합니다.
theological_decisions:
- issue: 히브리어 평행본문과 다른 1 Esdras 그리스어 본문을 어떻게 처리할지
  chosen_reading: 본문의 그리스어 δοξάσει를 따라 '주님께서 여러분을 영화롭게 하실 것입니다'로 옮기고, 히브리어 평행은 본문 주석으로만 남깁니다.
  alternative_readings:
  - 히브리어 평행에 맞추어 '주님의 기쁨이 여러분의 힘입니다'처럼 조화시키는 읽기
  rationale: 1 Esdras는 그리스어 본문이 번역의 직접 기준이며, 평행본문의 의미 차이는 중요한 사본 전승 정보이므로 본문을 조화시키지 않고 차이를 보존해야 합니다.
  doctrine_reference: 'POB deuterocanon policy: Greek source text primary; Hebrew parallel used as audit cross-check only'
