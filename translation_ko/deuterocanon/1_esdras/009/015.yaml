translation:
  language: ko
  text: 그리고 포로 생활에서 돌아온 사람들은 이 모든 일을 했습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘돌아온 포로들이 이 모든 일을 했습니다.’ 그리스어는 문자적으로 ‘포로에서 나온 사람들’이라고 하며, 포로기 이후 공동체를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐποίησαν
  english_pob_choice: did
  chosen_korean: 했습니다
  alternatives_korean:
  - 하였습니다
  - 행했습니다
  lexicon: BDAG
  rationale: ποιέω는 여기서 앞선 내용을 실제로 수행했다는 뜻으로 쓰였으므로, 한국어에서는 자연스럽게 ‘했습니다’로 옮기는 것이 가장 직접적입니다.
- source_word: κατὰ πάντα ταῦτα
  english_pob_choice: all these things
  chosen_korean: 이 모든 일
  alternatives_korean:
  - 이 모든 것
  - 모든 이러한 일들
  lexicon: LSJ
  rationale: 직전 서술 전체를 가리키는 표현이므로, ‘이 모든 일’로 전체성과 지시성을 함께 살렸습니다.
- source_word: οἱ ἐκ τῆς αἰχμαλωσίας
  english_pob_choice: those from the captivity
  chosen_korean: 포로 생활에서 돌아온 사람들
  alternatives_korean:
  - 포로에서 나온 사람들
  - 포로 생활에서 온 사람들
  - 포로에서 돌아온 자들
  lexicon: LSJ
  rationale: 직역하면 ‘포로에서 온 사람들’이지만, 문맥상 귀환한 포로 공동체를 가리키므로 한국어에서는 의미를 드러내면서도 본문 범위를 유지하는 표현을 택했습니다.
theological_decisions:
- issue: οἱ ἐκ τῆς αἰχμαλωσίας의 공동체 정체성
  chosen_reading: 포로 생활에서 돌아온 공동체를 지칭하는 역사적 표현으로 읽었습니다.
  alternative_readings:
  - 단순히 포로 출신 사람들
  - 포로 신분에 속한 사람들
  rationale: 영어 POB 주석이 지적하듯 이 표현은 귀환한 유대 공동체를 가리키는 관용적 표현이므로, 신학적 확장 없이 역사적 지시를 따라 옮겼습니다.
  doctrine_reference: 귀환 공동체 / 포로기 이후 역사 이해
