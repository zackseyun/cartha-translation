base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/015.yaml
  text: And those from the captivity did all these things[a].
  footnotes:
  - marker: a
    text: Or, 'the returned exiles did all this.' The Greek literally says 'those from the captivity,' referring to the post-exilic community.
