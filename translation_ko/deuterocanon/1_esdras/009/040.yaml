base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/040.yaml
  text: And Ezra the chief priest brought the law before all the multitude[a], from man to woman, and all the priests, to hear the law, on the new moon of the seventh month.
  footnotes:
  - marker: a
    text: The Hebrew parallel in Nehemiah 8:2–3 differs here, describing the audience as men, women, and those able to understand, rather than 'all the priests.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 대제사장 에스라는 일곱째 달의 초하루에 남자에서 여자에 이르기까지 모든 무리와 모든 제사장들에게 율법을 가져와, 그들이 율법을 듣도록 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 병행본문인 느헤미야 8:2–3은 여기서 대상을 ‘남자들과 여자들과 이해할 수 있는 사람들’로 설명하며, ‘모든 제사장들’과는 다릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκόμισεν
  english_pob_choice: brought
  chosen_korean: 가져와
  alternatives_korean:
  - 가져왔습니다
  - 전했습니다
  - 가지고 왔습니다
  lexicon: LSJ
  rationale: 공적인 낭독 자리에서 무언가를 ‘가져오다’는 뜻을 자연스럽게 살리면서, 의례적 ‘봉헌하다’나 해석적 ‘전달하다’로 과도하게 넘어가지 않게 했습니다.
- source_word: ὁ ἀρχιερεύς
  english_pob_choice: the chief priest
  chosen_korean: 대제사장
  alternatives_korean:
  - 큰 제사장
  - 최고 제사장
  lexicon: LSJ
  rationale: 직역상 ‘chief priest’이지만, 한국어 성경에서 이 직분은 통상 ‘대제사장’으로 굳어져 있어, 본문의 직분 지칭을 가장 분명하게 전달합니다.
- source_word: παντὶ τῷ πλήθει
  english_pob_choice: all the multitude
  chosen_korean: 모든 무리
  alternatives_korean:
  - 온 회중
  - 모든 군중
  - 온 백성
  lexicon: LSJ
  rationale: πλῆθος의 집합적 의미를 살려 ‘무리’로 옮겼습니다. ‘회중’은 예배 공동체로 더 좁게 들릴 수 있어 여기서는 덜 적합합니다.
- source_word: ἀπὸ ἀνθρώπου ἕως γυναικός
  english_pob_choice: from man to woman
  chosen_korean: 남자에서 여자에 이르기까지
  alternatives_korean:
  - 남자에서 여자까지
  - 남자와 여자
  - 남녀 모두
  lexicon: LSJ
  rationale: 그리스어의 분배적이고 성 구분이 드러나는 표현을 한국어에서도 유지했습니다. 성 중립화보다 원문의 표현력을 보존하는 쪽을 택했습니다.
- source_word: πᾶσιν τοῖς ἱερεῦσιν
  english_pob_choice: and all the priests
  chosen_korean: 모든 제사장들에게
  alternatives_korean:
  - 모든 사제들에게
  - 모든 제사장과 함께
  - 제사장 모두에게
  lexicon: LSJ
  rationale: 여기서는 대상이 되는 사람들을 나타내는 여격이므로 ‘-들에게’로 자연스럽게 옮겼습니다. 1 Esdras의 그리스어 본문을 따라 ‘제사장들’로 유지했습니다.
- source_word: νουμηνίᾳ τοῦ ἑβδόμου μηνός
  english_pob_choice: on the new moon of the seventh month
  chosen_korean: 일곱째 달 초하루에
  alternatives_korean:
  - 일곱째 달의 초하루에
  - 일곱째 달 초승에
  - 일곱째 달의 신월에
  lexicon: LSJ
  rationale: νουμηνία를 한국어에서 자연스러운 달력 표현인 ‘초하루’로 옮겼습니다. 직역형 ‘신월’은 현대 독자에게 덜 분명합니다.
theological_decisions:
- issue: Greek 본문의 대상이 ‘모든 제사장들’인 점을 유지할 것인가, 히브리어 병행본문의 ‘이해하는 자들’로 맞출 것인가
  chosen_reading: 그리스어 본문을 따라 ‘모든 제사장들’로 두었습니다.
  alternative_readings:
  - 히브리어 병행본문처럼 ‘이해하는 자들’로 옮김
  - ‘남녀와 이해하는 자들’로 조정
  rationale: 이 책의 번역 대상 본문은 1 Esdras의 그리스어 본문이며, 병행 히브리 본문은 변이로서 각주로만 다루는 것이 원칙에 맞습니다.
  doctrine_reference: PHILOSOPHY.md §What we are translating; DOCTRINE.md §Translation philosophy 1
- issue: 성별이 드러나는 분배적 표현을 현대식 비성별 표현으로 완화할지 여부
  chosen_reading: ‘남자에서 여자에 이르기까지’로 원문 구조를 보존했습니다.
  alternative_readings:
  - ‘남녀 모두’로 완화
  - ‘남자와 여자’로 단순화
  rationale: 원문은 단순한 ‘모두’를 넘어서 분배적으로 성별을 드러내므로, 그 긴장을 지우지 않는 번역이 더 충실합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
