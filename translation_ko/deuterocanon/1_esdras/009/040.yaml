revisions:
- from: 그리고 대제사장 에스라는 일곱째 달 초하루에 남자에서 여자에 이르기까지 모든 무리와 모든 제사장들에게 율법을 가져와, 그들이 율법을 들을 수 있게 했습니다.[a]
  to: 그리고 대제사장 에스라는 일곱째 달의 초하루에 남자에서 여자에 이르기까지 모든 무리와 모든 제사장들에게 율법을 가져와, 그들이 율법을 듣도록 했습니다.[a]
  rationale: 그리스어를 우선하여 ‘모든 제사장들’을 본문에 유지했습니다. 문장 연결을 목적절로 다듬어 ἀκοῦσαι의 기능을 반영했고, 날짜 표현과 각주 문구를 현대 표준어에 맞게 정리했습니다. 본문 의미나 병행본문의 차이에 관한 불확실성은 변경하지 않았습니다.
