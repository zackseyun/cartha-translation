base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/034.yaml
  text: 'And from the sons of Baanei: Jeremias[a], Momdios, Maeros, Jouna, Mamdai, and Pedias, and Anos, Carabasion, and Enaseibos, and Mamntanaimos, Eliaseis, Bannous, Edialeis, Someis, Selemias, Nathanias; and from the sons of Exora: Seseis, Ezreil, Azaelos, Samatos, Zambrei[b], Phosepos.'
  footnotes:
  - marker: a
    text: Several names in this verse are preserved as close transliterations of the Greek text rather than being harmonized to more familiar Hebrew forms from the parallel tradition, because the Greek of 1 Esdras is the primary source for this translation.
    reason: lexical_alternative
  - marker: b
    text: The MT parallel for this section (Ezra 10 context) is approximate and does not preserve this same full sequence of names in the same form; therefore the Greek list governs the translation here.
    reason: cross_reference
translation:
  language: ko
  text: 그리고 바나이의 아들들 가운데서는 예레미아스, 몸디오스, 마에로스, 주나, 맘다이, 그리고 페디아스, 아노스, 카라바시온, 에나세이보스, 맘니다나이모스, 엘리아세이스, 반누스, 에디알레이스, 소메이스, 셀레미아스, 나타니아스가 있었으며, 그리고 엑소라의 아들들 가운데서는 세세이스, 에즈레이일, 아자엘로스, 사마토스, 잠브레이, 포세포스가 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 고유명사들은 평행 히브리 전통보다 그리스어 본문의 형태를 우선해 옮겼습니다.
    reason: source_note
  - marker: b
    text: 이름 목록은 그리스어 1 에스드라스 본문을 따라 번역했으며, 평행 히브리 본문과의 완전한 일치는 전제하지 않았습니다.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ ἐκ τῶν υἱῶν
  english_pob_choice: And from the sons of
  chosen_korean: 그리고 …의 아들들 가운데서는
  alternatives_korean:
  - 그리고 …의 자손들 가운데서는
  - 그리고 …의 후손들 가운데서는
  lexicon: LSJ
  rationale: 명단 도입구로서 소속 집단을 표시하는 표현이므로, 직역적이면서도 한국어에서 자연스러운 ‘…의 아들들 가운데서는’으로 옮겼습니다.
- source_word: Βαανεί / Ἐξορά
  english_pob_choice: Baanei / Exora
  chosen_korean: 바나이 / 엑소라
  alternatives_korean:
  - 바아네이 / 익소라
  - 바니 / 에즈오라
  lexicon: LSJ
  rationale: 이 절은 그리스어 명단이 원문이므로, 히브리어 전통과 맞추기보다 그리스어 음형을 살린 음역을 택했습니다.
- source_word: Ἰερεμίας, Ναθανίας
  english_pob_choice: Jeremias, Nathanias
  chosen_korean: 예레미아스, 나타니아스
  alternatives_korean:
  - 예레미야
  - 나사냐
  lexicon: LSJ
  rationale: 이름 목록 안에서는 익숙한 히브리식 정형보다 그리스어 형태를 직접 반영하는 것이 원문 가시성을 더 잘 보존합니다.
- source_word: Μομδείοσ … Φόσηπος
  english_pob_choice: Momdios … Phosepos
  chosen_korean: 몸디오스 … 포세포스
  alternatives_korean:
  - 몸데이오스 … 포세포스
  - 모디오스 … 요셉
  lexicon: LSJ
  rationale: 난해한 고유명사는 문맥적으로 정규화하지 않고, 그리스어 자모 배열을 따라 최대한 투명하게 음역했습니다.
theological_decisions:
- issue: 히브리 전통과의 불일치가 있는 이름 목록을 어떻게 다룰지
  chosen_reading: 그리스어 목록 자체를 본문으로 옮기고, 익숙한 히브리식 이름으로 동화하지 않았습니다.
  alternative_readings:
  - 히브리 평행본문에 맞추어 정형화된 이름으로 바꾸기
  - 전통적 교회식 표기로 통일하기
  rationale: 1 에스드라스는 그리스어 본문이 1차 증거이므로, 독자가 실제 사본 전승의 형태를 보도록 이름형을 보존하는 것이 본문 충실성에 부합합니다.
