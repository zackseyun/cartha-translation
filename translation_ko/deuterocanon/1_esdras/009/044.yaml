  naturalness: ‘왼편에서는 … 있었습니다’는 열거문으로서 자연스럽고, 현대 한국어 합쇼체 서술에도 맞습니다. 공간 표현 바로 뒤에 각주 표지를 배치하여 지시 대상도 분명히 했습니다.
