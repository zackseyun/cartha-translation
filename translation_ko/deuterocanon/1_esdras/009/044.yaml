translation:
  language: ko
  text: 그리고 왼편에서는[a] 팔라다이오스, 메이사엘, 멜케이아스, 로타수보스, 나바레이아스, 자카리아스가 있었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘왼편에서는’은 단순한 기원보다 모임 안에서의 위치를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절의 이름들은 그리스어 『1 에스드라스』의 형태를 따르며, 근사한 평행 히브리 전승의 더 익숙한 형태와는 다를 수 있습니다.
    reason: alternative_reading
