base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/009.yaml
  text: and do his will[a], and separate yourselves from the nations of the land and from the foreigners.
  footnotes:
  - marker: a
    text: The Hebrew parallel in Ezra 10 is more specific about foreign women/wives; 1 Esdras here uses the broader wording 'the foreigners.'
    reason: alternative_reading
translation:
  language: ko
  text: 그분의 뜻을 행하고, 이 땅의 민족들과 이방인들로부터 스스로를 분리하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 평행본문인 에스라 10장은 더 구체적으로 외국 여인/아내를 말하지만, 1 에스드라 본문은 더 넓게 ‘이방인들’을 말합니다.
    reason: cross_reference
lexical_decisions:
- source_word: ποιήσατε
  english_pob_choice: do
  chosen_korean: 행하고
  alternatives_korean:
  - 하고
  - 실행하고
  lexicon: BDAG
  rationale: 명령형으로서 ‘do’의 직접성을 살리되, ‘그분의 뜻’과 결합할 때 자연스럽고 합쇼체 문맥에 맞는 ‘행하고’로 옮겼습니다.
- source_word: τὸ θέλημα αὐτοῦ
  english_pob_choice: his will
  chosen_korean: 그분의 뜻
  alternatives_korean:
  - 그의 뜻
  - 하시는 뜻
  lexicon: BDAG
  rationale: 하나님을 가리키는 문맥이므로 3인칭 대명사를 한국어에서 더 자연스럽게 풀어 ‘그분의 뜻’으로 옮겼습니다.
- source_word: χωρίσθητε
  english_pob_choice: separate yourselves
  chosen_korean: 스스로를 분리하십시오
  alternatives_korean:
  - 스스로를 떼어놓으십시오
  - 분리되십시오
  - 구별되십시오
  lexicon: BDAG
  rationale: 중간/수동형의 호소를 반영해 자기 분리를 분명히 드러냈습니다. ‘구별되다’는 종교적 뉘앙스를 덧입힐 수 있어 여기서는 더 직접적인 표현을 택했습니다.
- source_word: ἀπὸ τῶν ἀλλογενῶν
  english_pob_choice: from the foreigners
  chosen_korean: 이방인들로부터
  alternatives_korean:
  - 외국인들로부터
  - 타민족 사람들로부터
  lexicon: LSJ
  rationale: ἀλλογενῶν의 ‘다른 혈통/출신의 사람들’이라는 뜻을 살리되, 본문에서 별도로 여성으로 한정하지 않는 넓은 의미를 유지했습니다.
theological_decisions:
- issue: 1 Esdras의 그리스어 본문이 MT 평행본문보다 더 넓게 말하는지 여부
  chosen_reading: 본문은 ‘이 땅의 민족들’과 ‘이방인들’이라는 넓은 범주를 유지하고, 여성으로 좁히지 않았습니다.
  alternative_readings:
  - 이 땅의 백성들과 외국 여인들로부터 스스로를 분리하십시오
  - 이 땅의 이방 백성들과 외국 여자들로부터 스스로를 분리하십시오
  rationale: 이 책의 주요 번역 기준은 그리스어 본문이므로, MT 평행본문의 더 구체적인 ‘외국 여인/아내’ 정보를 본문에 끌어들이지 않았습니다. 다만 한국어로는 문맥상 남성/복합 복수의 넓은 범위를 자연스럽게 드러내기 위해 ‘이방인들’로 번역했습니다.
  doctrine_reference: Translation philosophy §1 Original-language primacy over translation tradition; parallel_sources note on MT as sanity check.
