  to: 그들은 모두 떠나 먹고 마시고 즐거워하며, 아무것도 없는 이들에게 몫을 보내고, 크게 기뻐했습니다.[a]
  rationale: ‘떠나’를 사용하여 ᾤχοντο의 의미를 살리고, 병렬된 부정사들을 자연스러운 한국어 열거로 재현했습니다. ‘아무것도 없는 이들’은 그리스어의 넓고 생략적인 표현을 보존하며, ‘몫이 없는 이들’ 및 음식 몫이라는 문맥적 구체화는 병행본문에 근거해 각주로 옮겼습니다.
