  verdict: revise
  source_fidelity: 그리스어의 다섯 부정사(떠나다, 먹다, 마시다, 즐거워하다, 몫을 보내다, 크게 기뻐하다)를 대체로 담았으나, ‘가서’는 ᾤχοντο의 떠남·흩어짐을 충분히 드러내지 못합니다. 또한 τοῖς μὴ ἔχουσιν은 목적어가 생략된 넓은 표현이므로 본문에서 ‘몫이 없는’으로 한정하기보다 ‘아무것도 없는’으로 옮기고, 병행본문에 따른 구체화는 각주에서 제시하는 편이 더 충실합니다.
  naturalness: 원문의 병렬 구조를 한국어의 자연스러운 연결 어미와 과거 종결로 정리했습니다. ‘크게 즐거워했습니다’보다 ‘크게 기뻐했습니다’가 현대 표준어 합쇼체 서술에서 더 자연스럽습니다.
  terminology: ἀποστολάς는 잔치의 음식 몫을 보내는 문맥이므로 ‘몫을 보내고’로 유지했습니다. τοῖς μὴ ἔχουσιν의 생략된 목적어는 본문에서 보존하고, 히브리어 병행본문이 시사하는 ‘먹을 몫’은 각주에 한정했습니다.
