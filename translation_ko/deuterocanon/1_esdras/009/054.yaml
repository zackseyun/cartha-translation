base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/054.yaml
  text: And they all went away to eat and drink and rejoice[a], and to send portions to those who had nothing, and to rejoice greatly;
  footnotes:
  - marker: a
    text: Or 'to those who had no portions prepared'; the Hebrew parallel explicitly speaks of sending portions (food shares) to those lacking them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 모두 떠나 먹고 마시고 즐거워하며, 아무것도 없는 이들에게 몫을 보내고, 크게 기뻐했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘몫이 없는 이들에게’. 히브리어 병행본문은 잔치에서 먹을 몫을 보내는 것을 명시합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾤχοντο
  english_pob_choice: went away
  chosen_korean: 가서
  alternatives_korean:
  - 떠나서
  - 가 버려서
  lexicon: LSJ
  rationale: 문맥상 회중이 각자 식사와 축제를 위해 흩어지는 동작이므로, ‘가서’가 가장 자연스럽고 간결하게 분산의 뉘앙스를 살립니다.
- source_word: εὐφραίνεσθαι
  english_pob_choice: to rejoice
  chosen_korean: 즐거워하고
  alternatives_korean:
  - 기뻐하고
  - 즐기고
  lexicon: LSJ
  rationale: 명절성의 기쁨과 환희를 함께 담기 위해 ‘즐거워하다’를 택했고, 뒤의 ‘크게 즐거워했습니다’와 구별되도록 현재형 연결형으로 처리했습니다.
- source_word: δοῦναι ἀποστολὰς
  english_pob_choice: to send portions
  chosen_korean: 몫을 보내며
  alternatives_korean:
  - 몫을 보내고
  - 분깃을 보내며
  - 음식을 보내며
  lexicon: LSJ
  rationale: 히브리어 병행본문의 מָנוֹת(몫, 분깃)를 반영해 ‘몫’으로 옮겼고, 단순한 선물보다 식탁 몫을 나누는 행위를 드러내기 위해 ‘보내다’를 유지했습니다.
- source_word: τοῖς μὴ ἔχουσιν
  english_pob_choice: to those who had nothing
  chosen_korean: 몫이 없는 이들에게
  alternatives_korean:
  - 아무것도 없는 이들에게
  - 아직 몫을 받지 못한 이들에게
  - 준비된 몫이 없는 이들에게
  lexicon: LSJ
  rationale: 그리스어는 단순히 ‘가지지 않은 이들’이라고 말하지만, 병행본문이 잔치 몫을 가리키므로 그 의미를 살려 ‘몫이 없는 이들’로 자연스럽게 구체화했습니다.
- source_word: εὐφρανθῆναι μεγάλως
  english_pob_choice: to rejoice greatly
  chosen_korean: 크게 즐거워했습니다
  alternatives_korean:
  - 몹시 즐거워했습니다
  - 크게 기뻐했습니다
  lexicon: LSJ
  rationale: 앞의 εὐφραίνεσθαι와 구별되는 종결적 강조를 살리기 위해 ‘크게’를 붙였고, 축제 맥락에 맞는 ‘즐거워하다’를 반복해 리듬을 유지했습니다.
theological_decisions:
- issue: 병행본문이 드러내는 공유의 성격
  chosen_reading: ‘몫을 보내며’는 단순한 일반 자선이 아니라 잔치의 식탁 몫을 나누는 행위로 읽었습니다.
  alternative_readings:
  - 일반적인 선물 보내기
  - 가난한 자에 대한 자선
  rationale: WLC 병행본문의 ‘몫들’을 근거로, 본문은 공동체적 기쁨이 소외된 이들과의 실제적 나눔으로 확장되는 장면임을 드러냅니다.
  doctrine_reference: 1 Esdras 9:54 parallel with Neh 8:10-12 / WLC parallel witness
