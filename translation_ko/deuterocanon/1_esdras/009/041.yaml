  source_fidelity: 그리스어 본문은 그가 성전 문 앞의 넓은 장소에서 새벽부터 정오까지 남자들과 여자들 앞에서 계속 읽었고, 그들이 모두 율법에 온 마음을 기울였다고 말합니다. 초안은 대체로 충실하나, ἀνεγίνωσκεν의 미완료·지속상을 단순 과거 ‘읽었습니다’보다 ‘읽고 있었습니다’로 옮기는 편이 더 정확합니다.
  naturalness: ‘성전 문 앞의 넓은 공간’, ‘남자들과 여자들 앞에서’, ‘율법에 온 마음을 기울였습니다’는 현대 표준어 합쇼체로 자연스럽습니다. 접속사 ‘그리고’를 반복하지 않고 문장을 자연스럽게 이어도 원문의 병렬은 유지됩니다.
