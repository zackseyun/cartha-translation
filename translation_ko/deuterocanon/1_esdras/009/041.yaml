base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/041.yaml
  text: And he was reading in the broad space before the temple gate from dawn until midday in the presence of the men and the women[b][a]; and all of them gave their attention to the law.
  footnotes:
  - marker: a
    text: Or 'in the open square before the temple gate.' The Greek describes a broad or spacious area; the Hebrew parallel in Nehemiah 8 uses wording commonly rendered 'wooden platform' in a different but related scene, so the exact spatial nuance here should not be over-pressed.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'they gave all the mind to the law,' that is, they paid full attention.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 성전 문 앞의 넓은 공간에서 새벽부터 정오까지 남자들과 여자들 앞에서 읽었습니다. 그리고 그들은 모두 율법에 온 마음을 기울였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘넓은 공간’은 εὐρυχώρος의 문자적 의미를 따른 것입니다. 여기서 특정한 구조물이나 광장 형태를 지나치게 단정하지는 않습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘그들이 온 마음을 율법에 주었다’는 뜻으로, 곧 전심으로 주의를 기울였다는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεγίνωσκεν
  english_pob_choice: was reading
  chosen_korean: 읽었습니다
  alternatives_korean:
  - 낭독하고 있었습니다
  - 읽고 있었습니다
  lexicon: LSJ
  rationale: 미완료 시제의 지속성을 살리되, 한국어에서는 공적 낭독 상황이 자연스럽게 드러나므로 단순 과거형으로 옮겨도 의미가 유지됩니다.
- source_word: ἐν τῷ ... εὐρυχώρῳ
  english_pob_choice: in the broad space
  chosen_korean: 넓은 공간에서
  alternatives_korean:
  - 넓은 마당에서
  - 넓은 뜰에서
  - 넓은 광장에서
  lexicon: LSJ
  rationale: εὐρυχώρος의 핵심은 넓고 탁 트인 장소라는 뜻이므로, 특정 구조물을 단정하지 않는 ‘넓은 공간’이 가장 직접적입니다.
- source_word: ἐνώπιον τῶν ἀνδρῶν καὶ γυναικῶν
  english_pob_choice: in the presence of the men and the women
  chosen_korean: 남자들과 여자들 앞에서
  alternatives_korean:
  - 남자들과 여자들의 앞에서
  - 남자들과 여자들 앞에
  - 남자들과 여자들 앞에서 그들 앞에서
  lexicon: LSJ
  rationale: ἐνώπιον은 ‘~앞에/면전에서’의 뜻이므로 한국어의 자연스러운 공적 장면 표현으로 옮겼습니다. 남자와 여자를 모두 분명히 드러냈습니다.
- source_word: ἐπέδωκαν πάντα τὸν νοῦν
  english_pob_choice: gave their attention
  chosen_korean: 온 마음을 기울였습니다
  alternatives_korean:
  - 마음을 다했습니다
  - 주의를 기울였습니다
  - 전심을 기울였습니다
  lexicon: LSJ
  rationale: 직역하면 ‘모든 마음을 주었다’이지만, 한국어에서는 주의의 완전한 집중을 뜻하는 관용적 표현으로 옮기는 것이 자연스럽습니다. ‘온 마음’은 πλήρης한 집중과 자발성을 함께 전달합니다.
- source_word: εἰς τὸν νόμον
  english_pob_choice: to the law
  chosen_korean: 율법에
  alternatives_korean:
  - 율법으로
  - 법에
  - 토라에
  lexicon: LSJ
  rationale: νόμος는 이 문맥에서 공적으로 낭독된 모세의 율법을 가리키므로, 프로젝트 기본어인 ‘율법’을 사용했습니다. 한국어 조사 ‘-에’가 주의를 기울이는 대상을 자연스럽게 받습니다.
theological_decisions:
- issue: 공적 낭독 장면의 어조
  chosen_reading: 서술문은 평서형으로 유지하고, 직접 인용이 아니므로 별도의 높임말이나 경어 전환을 두지 않았습니다.
  alternative_readings:
  - 더 경건한 문체로 높여 번역
  - 낭독 행위를 ‘선포했습니다’로 바꿈
  rationale: 원문은 사건 서술이며, 특별한 직설 화법이나 기도체가 아니므로 현대 표준어 서술문이 적절합니다. 의미를 과장하지 않고 장면의 사실성을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §4
