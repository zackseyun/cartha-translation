  lexicon: LSJ
  rationale: εὐρυχώρος의 핵심은 넓고 탁 트인 장소라는 뜻이므로, 특정 구조물을 단정하지 않는 ‘넓은 공간’이 가장 직접적입니다.
- source_word: ἐνώπιον τῶν ἀνδρῶν καὶ γυναικῶν
  english_pob_choice: in the presence of the men and the women
  chosen_korean: 남자들과 여자들 앞에서
  alternatives_korean:
  - 남자들과 여자들의 앞에서
  - 남자들과 여자들 앞에
  - 남자들과 여자들 앞에서 그들 앞에서
  lexicon: LSJ
  rationale: ἐνώπιον은 ‘~앞에/면전에서’의 뜻이므로 한국어의 자연스러운 공적 장면 표현으로 옮겼습니다. 남자와 여자를 모두 분명히 드러냈습니다.
- source_word: ἐπέδωκαν πάντα τὸν νοῦν
  english_pob_choice: gave their attention
  chosen_korean: 온 마음을 기울였습니다
  alternatives_korean:
  - 마음을 다했습니다
  - 주의를 기울였습니다
  - 전심을 기울였습니다
  lexicon: LSJ
  rationale: 직역하면 ‘모든 마음을 주었다’이지만, 한국어에서는 주의의 완전한 집중을 뜻하는 관용적 표현으로 옮기는 것이 자연스럽습니다. ‘온 마음’은 πλήρης한 집중과 자발성을 함께 전달합니다.
- source_word: εἰς τὸν νόμον
  english_pob_choice: to the law
  chosen_korean: 율법에
  alternatives_korean:
  - 율법으로
  - 법에
  - 토라에
  lexicon: LSJ
  rationale: νόμος는 이 문맥에서 공적으로 낭독된 모세의 율법을 가리키므로, 프로젝트 기본어인 ‘율법’을 사용했습니다. 한국어 조사 ‘-에’가 주의를 기울이는 대상을 자연스럽게 받습니다.
