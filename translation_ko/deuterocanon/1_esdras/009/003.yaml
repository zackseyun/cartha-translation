base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/003.yaml
  text: And a proclamation was made throughout all Judea and Jerusalem to all those from the captivity[a], to assemble in Jerusalem.
  footnotes:
  - marker: a
    text: Or, more interpretively, 'to all the exiles' or 'to all the returned exiles.' The Greek reads literally 'to all those from the captivity.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 유다 온 땅과 예루살렘에, 포로 생활에서 나온 모든 사람에게 예루살렘에 모이라는 공고가 내려졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘포로 생활에서 나온’은 문자적으로는 ‘포로 상태에서 나온’입니다. POB 영어본의 ‘those from the captivity’와 같은 보다 직역적 이해를 반영할 수 있습니다.
    reason: lexical_alternative
