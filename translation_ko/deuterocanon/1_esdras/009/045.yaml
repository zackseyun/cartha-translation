theological_decisions:
- issue: 에스라의 좌석/위치가 공적으로 구별된 상태라는 점
  chosen_reading: ‘모든 사람 앞에서 위엄 있게 앉아 있었기 때문입니다’로, 단순한 착석이 아니라 공개적으로 두드러진 위치를 반영했습니다.
  alternative_readings:
  - ‘존귀하게 앉아 있었습니다’
  - ‘두드러지게 앉아 있었습니다’
  rationale: ἐπιδόξως는 단순 위치 설명보다 공적 명예와 구별성을 시사하므로, 그 함의를 약화하지 않도록 옮겼습니다.
  doctrine_reference: 공적 예배/낭독 장면의 서술적 강조
