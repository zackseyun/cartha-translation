base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/045.yaml
  text: And Ezra took up the book before the multitude[a], for he was seated prominently before them all[c][b],
  footnotes:
  - marker: a
    text: Or 'the crowd' or 'the assembly' for 'the multitude.'
    reason: lexical_alternative
  - marker: b
    text: The Greek says 'the book'; historically this could refer to a scroll.
    reason: cultural_note
  - marker: c
    text: Or 'was seated with distinction' / 'was seated honorably'; the Greek adverb indicates a publicly distinguished position.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 에스라는 그 책[b]을 무리[a] 앞에서 집어 들었습니다. 그는 모든 사람 앞에 두드러진 자리에 앉아 있었기 때문입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘군중’, ‘회중’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 ‘책’이라고만 되어 있으며, 역사적으로는 두루마리를 가리킬 수 있습니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘명예롭게 앉아 있었다’, ‘존귀하게 앉아 있었다’로도 옮길 수 있습니다. 그리스어는 모든 사람 앞에서 공적으로 구별된 위치를 나타냅니다.
    reason: lexical_alternative
