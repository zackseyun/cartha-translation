base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/045.yaml
  text: And Ezra took up the book before the multitude[a], for he was seated prominently before them all[c][b],
  footnotes:
  - marker: a
    text: Or 'the crowd' or 'the assembly' for 'the multitude.'
    reason: lexical_alternative
  - marker: b
    text: The Greek says 'the book'; historically this could refer to a scroll.
    reason: cultural_note
  - marker: c
    text: Or 'was seated with distinction' / 'was seated honorably'; the Greek adverb indicates a publicly distinguished position.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 에스라는 그 책을 무리 앞에서 들어 올렸습니다[a]. 그는 모든 사람 앞에서 위엄 있게 앉아 있었기 때문입니다[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘군중 앞에서’, ‘회중 앞에서’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 ‘책’이라고만 되어 있으며, 역사적으로는 두루마리를 가리킬 수 있습니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘위엄 있게 앉아 있었다’, ‘존귀하게 앉아 있었다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναλαβών
  english_pob_choice: took up
  chosen_korean: 들어 올렸습니다
  alternatives_korean:
  - 들었습니다
  - 집어 들었습니다
  - 받아 들었습니다
  lexicon: LSJ
  rationale: 책을 손에 취하는 물리적 동작을 드러내면서도, 한국어에서 자연스러운 행위 표현으로 옮겼습니다.
- source_word: τὸ βιβλίον
  english_pob_choice: the book
  chosen_korean: 그 책
  alternatives_korean:
  - 그 두루마리
  - 그 책자
  lexicon: LSJ
  rationale: 원문은 βιβλίον이라고만 하며, 영어 POB처럼 역사적 형태를 단정하지 않고 직역에 가깝게 옮겼습니다.
- source_word: τοῦ πλήθους
  english_pob_choice: the multitude
  chosen_korean: 무리
  alternatives_korean:
  - 군중
  - 회중
  - 사람들
  lexicon: LSJ
  rationale: πλῆθος의 큰 집합체 의미를 살리되, ‘회중’처럼 종교적 조직감을 덧씌우지 않는 표현을 택했습니다.
- source_word: ἐπιδόξως
  english_pob_choice: prominently
  chosen_korean: 위엄 있게
  alternatives_korean:
  - 드러나게
  - 두드러지게
  - 존귀하게
  lexicon: LSJ
  rationale: 공적으로 구별된 높은 자리라는 뉘앙스를 한국어에서 자연스럽게 드러내기 위해 ‘위엄 있게’를 택했습니다.
theological_decisions:
- issue: 에스라의 좌석/위치가 공적으로 구별된 상태라는 점
  chosen_reading: ‘모든 사람 앞에서 위엄 있게 앉아 있었기 때문입니다’로, 단순한 착석이 아니라 공개적으로 두드러진 위치를 반영했습니다.
  alternative_readings:
  - ‘존귀하게 앉아 있었습니다’
  - ‘두드러지게 앉아 있었습니다’
  rationale: ἐπιδόξως는 단순 위치 설명보다 공적 명예와 구별성을 시사하므로, 그 함의를 약화하지 않도록 옮겼습니다.
  doctrine_reference: 공적 예배/낭독 장면의 서술적 강조
