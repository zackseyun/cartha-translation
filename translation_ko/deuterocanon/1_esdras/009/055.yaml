  verdict: revise
  source_fidelity: 초안의 ‘이해를 얻었고’는 ἐνεφυσιώθησαν의 수동형과 다소 특이한 어감을 능동적·해석적으로 평탄화합니다. 또한 ‘함께 모였습니다’는 자연스럽지만 ἐπισυνήχθησαν의 수동성을 충분히 드러내지 못합니다. ‘깨우침을 받았으며, 함께 모이게 되었습니다’는 그리스어의 수동 표현을 더 잘 보존하면서, 희귀 동사의 정확한 뉘앙스가 불확실하다는 점은 각주에서 유지합니다.
  naturalness: ‘자신들이 배운 말씀에 이해를 얻었고’는 현대 한국어에서 어색한 결합입니다. ‘자신들이 배운 말씀에 대하여 깨우침을 받았으며’는 합쇼체 문장으로 자연스럽고, 앞의 수동적 ‘가르침을 받음’과 구별되는 후속 이해·감화의 결과를 무리 없이 표현합니다.
  terminology: 토라 연구 문맥의 ῥήματα는 ‘말씀’으로 옮길 수 있습니다. 다만 이 절 자체에는 ‘율법’이 없으므로 본문에는 보충하지 않고 병행본문 각주에만 ‘율법의 말씀’을 둡니다. ἐνεφυσιώθησαν의 뜻은 확정하기 어려우므로 ‘깨우침’이라는 문맥적 번역을 쓰되, ‘불어넣어지다/스며들다/감화를 받다’ 계열의 대안을 각주에 밝혀야 합니다.
