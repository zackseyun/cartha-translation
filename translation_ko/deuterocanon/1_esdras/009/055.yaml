base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/055.yaml
  text: For they were also instructed in the words that they had been taught[b][a], and they were assembled.
  footnotes:
  - marker: a
    text: The Greek verb rendered 'were instructed' is uncommon here and could be understood more literally as being 'imbued' or 'inspired'; the Hebrew parallel supports the sense of gaining understanding in the words of the law.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew parallel in Nehemiah 8:13 reads more directly, 'they gathered ... to gain insight into the words of the law.' 1 Esdras presents the scene in a compressed Greek form.
    reason: cross_reference
translation:
  language: ko
  text: 그들은 또한 자신들이 배운 말씀에 이해를 얻었고, 함께 모였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ἐνεφυσιώθησαν는 이곳에서 드문 동사로, 문자적으로는 더 강하게 ‘불어넣어지다’에 가까울 수 있으나 문맥과 히브리어 병행은 ‘말씀을 이해하게 됨’을 시사합니다.
    reason: lexical_alternative
  - marker: b
    text: 느헤미야 8:13의 병행본문은 더 직접적으로 ‘그들이 … 율법의 말씀을 깨닫게 하려고 모였다’는 뜻을 보입니다. 1 에스드라스는 이를 더 압축한 그리스어로 제시합니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἐνεφυσιώθησαν
  english_pob_choice: were instructed
  chosen_korean: 이해를 얻었고
  alternatives_korean:
  - 가르침을 받았고
  - 감화되었고
  - 영감을 받았고
  lexicon: LSJ
  rationale: 이 동사는 희귀하고 문맥상 의미가 불분명하므로, 에스라기/느헤미야의 병행구가 시사하는 ‘말씀을 이해하게 됨’의 뜻을 살려 자연스럽게 옮겼습니다.
- source_word: ἐν τοῖς ῥήμασιν
  english_pob_choice: in the words
  chosen_korean: 말씀에
  alternatives_korean:
  - 말들 안에서
  - 말들에
  - 말씀들 안에서
  lexicon: BDAG
  rationale: ῥήματα는 ‘말씀/말들’로 옮길 수 있으나, 토라 읽기와 이해의 문맥이므로 한국어에서는 ‘말씀’이 가장 투명합니다.
- source_word: οἷς ἐδιδάχθησαν
  english_pob_choice: that they had been taught
  chosen_korean: 자신들이 배운
  alternatives_korean:
  - 그들이 가르침을 받은
  - 그들에게 가르쳐진
  - 그들이 배운
  lexicon: BDAG
  rationale: 관계절은 자신들이 이미 받은 교육 내용을 가리키므로, 수동성을 과도하게 강조하지 않으면서도 의미를 살린 표현으로 옮겼습니다.
- source_word: ἐπισυνήχθησαν
  english_pob_choice: were assembled
  chosen_korean: 함께 모였습니다
  alternatives_korean:
  - 모였습니다
  - 모여 있었습니다
  - 집합했습니다
  lexicon: BDAG
  rationale: 수동형을 유지하면서도 한국어로는 군더더기 없이 자연한 ‘함께 모였습니다’가 가장 적합합니다.
theological_decisions:
- issue: 희귀 동사 ἐνεφυσιώθησαν의 의미 범위
  chosen_reading: ‘이해를 얻었고’로 번역해, 말씀을 깨닫게 됨을 중심 의미로 드러냈습니다.
  alternative_readings:
  - ‘감화되었고’
  - ‘영감을 받았고’
  - ‘말씀에 주입되었고’
  rationale: 병행구가 ‘율법의 말씀을 깨달음’ 쪽으로 이끄는 만큼, 지나치게 신비화하거나 물리화하지 않고 본문이 요구하는 이해의 획득을 드러냈습니다.
  doctrine_reference: 느헤미야 8:13 병행본문
- issue: 병행본문과 그리스어 본문의 긴장
  chosen_reading: 그리스어 본문을 우선하되, 병행본문이 뒷받침하는 ‘말씀 이해’의 방향을 반영했습니다.
  alternative_readings:
  - 히브리어 병행을 따라 더 직접적으로 ‘깨달으려고’로 옮김
  - 단순히 ‘가르침을 받았다’로 평탄화
  rationale: 1 Esdras는 압축된 그리스어를 보이므로, 본문 자체의 수동형과 병행전승의 이해 방향을 둘 다 살리는 번역이 필요합니다.
  doctrine_reference: 본문비평 및 병행본문 원리
