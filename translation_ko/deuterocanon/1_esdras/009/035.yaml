base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/035.yaml
  text: 'From the sons of Ooma: Zeitias[a], Zabadias, Edos, Ouel[b], and Banaias.'
  footnotes:
  - marker: a
    text: Greek lists these names individually; the approximate MT parallel (Ezra 10) concludes this section with a summary statement instead of preserving the same list here.
    reason: cross_reference
  - marker: b
    text: The Greek text is a list of personal names. 'The sons of Ooma' makes explicit the family-group sense implied by the construction 'from the [house/clan] of Ooma.'
    reason: cultural_note
translation:
  language: ko
  text: 오마의 아들들 가운데서는 제이티아스, 자바디아스, 에도스, 우엘, 바나이아스가 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 이 이름들을 각각 나열합니다. 근사한 마소라 본문 병행구절(에스라 10장)은 이 자리에서 같은 명단을 보존하지 않고 요약 진술로 이 단락을 끝맺습니다.
    reason: cross_reference
  - marker: b
    text: ‘오마의 아들들’은 ‘오마’가 한 개인이 아니라 집안 또는 씨족 단위를 가리킨다는 목록 문체상의 의미를 드러내기 위한 번역입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκ τῶν
  english_pob_choice: From the sons of Ooma
  chosen_korean: 오마의 아들들 가운데서는
  alternatives_korean:
  - 오마에게서
  - 오마의 집안에서
  - 오마의 자손들 가운데서
  lexicon: LSJ
  rationale: ἐκ는 이 명단 맥락에서 특정 집단을 가리키므로 ‘가운데서는’으로 자연스럽게 옮겼고, 영어 POB가 드러낸 친족/집안 의미를 한국어에서 너무 강하게 단정하지 않도록 했습니다.
- source_word: Ὀομά
  english_pob_choice: Ooma
  chosen_korean: 오마
  alternatives_korean:
  - 오오마
  - 우마
  lexicon: transliteration
  rationale: 그리스어 고유명사를 원문에 가깝게 음역하되, 한국어 표기에서는 읽기 쉬운 ‘오마’를 택했습니다.
- source_word: Ζειτιάς
  english_pob_choice: Zeitias
  chosen_korean: 제이티아스
  alternatives_korean:
  - 제티아스
  - 즈에이티아스
  lexicon: transliteration
  rationale: 그리스어 철자와 발음을 반영해 음역했고, 영어 POB의 철자 선택을 참고하되 한국어 표기 관습에 맞게 정리했습니다.
- source_word: Βαναίας
  english_pob_choice: Banaias
  chosen_korean: 바나이아스
  alternatives_korean:
  - 바나야스
  - 베나야
  lexicon: transliteration
  rationale: 그리스어형 인명으로 옮겨 히브리어 친숙형으로 정상화하지 않았습니다. 원문 증거가 그리스어이기 때문입니다.
theological_decisions:
- issue: 이 절은 신학적 진술보다 인명 목록을 제시하는가, 아니면 번역 과정에서 족속/가문 의미를 명시해야 하는가
  chosen_reading: 명단의 구조를 살려 인명들을 나열하되, ἐκ τῶν의 집단 지시를 ‘아들들 가운데서는’으로 제한적으로 드러냈습니다.
  alternative_readings:
  - 단순히 ‘오마로부터’
  - ‘오마의 가족에서’
  rationale: 그리스어는 개인명 목록이며, 영어 POB도 family-group sense를 주석으로 설명합니다. 본문에서는 과도한 해석을 피하면서도 목록의 소속 관계는 드러내는 것이 적절합니다.
  doctrine_reference: source-text priority / textual transparency
