base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/039.yaml
  text: And he told Ezra the priest and reader to bring the law of Moses that had been given by the God of Israel[a][b].
  footnotes:
  - marker: a
    text: Or 'reader' may be understood more specifically as 'public reader'; some might also render it 'scribe,' but the Greek term here more directly denotes one who reads aloud.
    reason: lexical_alternative
  - marker: b
    text: Or 'that had been handed down by the God of Israel.' The Greek participle can emphasize transmission as well as giving.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 제사장인 에스라와 낭독자에게 모세의 율법—이스라엘의 하나님께서 주신—을 가져오라고 했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔσρᾳ
  english_pob_choice: Ezra
  chosen_korean: 에스라
  alternatives_korean:
  - 에즈라
  lexicon: 고유명사 음역
  rationale: 히브리어·헬라어 인명으로서 한국어 성경에서 널리 쓰이는 표준 음역은 에스라입니다.
- source_word: τῷ ἱερεῖ
  english_pob_choice: the priest
  chosen_korean: 제사장인
  alternatives_korean:
  - 제사장
  lexicon: BDAG
  rationale: 관사로 직분을 규정하는 표현이므로, 에스라의 신분을 드러내는 관형형으로 자연스럽게 옮겼습니다.
- source_word: ἀναγνώστῃ
  english_pob_choice: reader
  chosen_korean: 낭독자
  alternatives_korean:
  - 읽는 사람
  - 공개 낭독자
  - 서기관
  lexicon: BDAG
  rationale: 이 단어는 본문에서 ‘읽는 사람/낭독하는 사람’을 직접 가리키므로, 교회 전통의 ‘서기관’보다 낭독 기능을 살린 ‘낭독자’를 택했습니다.
- source_word: τὸν νόμον Μωυσέως
  english_pob_choice: the law of Moses
  chosen_korean: 모세의 율법
  alternatives_korean:
  - 모세의 법
  - 모세 율법
  lexicon: BDAG
  rationale: 헬라어의 속격 결합과 히브리어 병행구의 תּוֹרָה를 함께 반영하는 가장 투명한 표현은 ‘모세의 율법’입니다.
- source_word: τὸν παραδοθέντα ὑπὸ τοῦ θεοῦ Ἰσραήλ
  english_pob_choice: that had been given by the God of Israel
  chosen_korean: 이스라엘의 하나님께서 주신
  alternatives_korean:
  - 이스라엘의 하나님께서 전해 주신
  - 이스라엘의 하나님께서 넘겨주신
  lexicon: BDAG
  rationale: παραδίδωμι는 ‘주다/전달하다/넘겨주다’의 의미 범위를 가지지만, 여기서는 율법의 신적 기원을 말하므로 ‘주신’이 가장 자연스럽고 소스를 벗어나지 않습니다.
theological_decisions:
- issue: 율법의 기원과 전달 방식
  chosen_reading: ‘모세의 율법—이스라엘의 하나님께서 주신—’으로, 모세와 하나님의 역할을 모두 보존했습니다.
  alternative_readings:
  - ‘이스라엘의 하나님께서 모세를 통해 주신 율법’
  - ‘이스라엘의 하나님께서 전해 주신 모세의 율법’
  rationale: 헬라어는 모세와 하나님을 모두 언급하지만 ‘통하여’(through)라는 매개 표현은 직접 말하지 않으므로, 본문에 있는 신적 주권과 모세적 연계를 그대로 살렸습니다.
  doctrine_reference: 번역 원칙 1, 3, 5
