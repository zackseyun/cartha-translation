base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/007.yaml
  text: And Ezra rose and said to them[a], “You have acted lawlessly and have married foreign women, adding sin to Israel.”
  footnotes:
  - marker: a
    text: Or “have married foreign women” or “have taken foreign women as wives.” The Greek verb literally means “have lived with,” but in this context it refers to unlawful unions with women from other peoples.
    reason: lexical_alternative
translation:
  language: ko
  text: 에스라가 일어나 그들에게 말했습니다. 「너희는 불법을 행했고, 이방 여인들과 함께 살면서 이스라엘에 죄를 더하였습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘함께 살다’이지만, 여기서는 문맥상 율법에 어긋난 혼인 결합을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  english_pob_choice: rose
  chosen_korean: 일어나
  alternatives_korean:
  - 일어서
  - 일어섰다
  lexicon: BDAG
  rationale: 서술 흐름을 자연스럽게 살리면서, 에스라가 발언을 시작하는 동작을 간결하게 보여 줍니다.
- source_word: ἠνομήσατε
  english_pob_choice: have acted lawlessly
  chosen_korean: 불법을 행했고
  alternatives_korean:
  - 율법 없이 행했고
  - 죄를 지었고
  - 율법을 어겼고
  lexicon: BDAG
  rationale: 단순한 ‘죄를 지었다’보다 법/율법에 어긋난 행위라는 힘을 살리기 위해 직접적으로 옮겼습니다.
- source_word: συνῳκίσατε
  english_pob_choice: have lived with
  chosen_korean: 함께 살면서
  alternatives_korean:
  - 결혼하여 살면서
  - 함께 거주하면서
  - 아내로 맞아
  lexicon: BDAG
  rationale: 그리스어 자체의 ‘함께 살다/동거하다’라는 의미를 유지하되, 문맥상 혼인 결합을 독자가 이해할 수 있게 했습니다.
- source_word: γυναιξὶν ἀλλογενέσιν
  english_pob_choice: foreign women
  chosen_korean: 이방 여인들
  alternatives_korean:
  - 외국 여인들
  - 다른 민족의 여인들
  - 외래의 여인들
  lexicon: BDAG
  rationale: ‘foreign’의 민족·공동체적 대비를 한국어 성서 문맥에서 자연스럽게 드러내는 표현입니다.
theological_decisions:
- issue: ס흔/공동체적 책임을 어떻게 드러낼 것인가
  chosen_reading: ‘이스라엘에 죄를 더하였습니다’로 옮겨, 개인적 위반을 넘어 공동체 전체의 죄가 가중된다는 점을 살렸습니다.
  alternative_readings:
  - 이스라엘에게 죄를 더하였습니다
  - 이스라엘의 죄를 더하였습니다
  - 이스라엘 위에 죄를 더하였습니다
  rationale: 본문의 초점은 개인 윤리보다 이스라엘 공동체의 누적된 죄책에 있습니다. 한국어도 그 집단적 무게를 유지하도록 했습니다.
  doctrine_reference: Translation philosophy §1, §6
