base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/049.yaml
  text: 'And Attarates said to Ezra the chief priest and reader[a], and to the Levites who were teaching the multitude[b], to all of them:'
  footnotes:
  - marker: a
    text: Attarates likely corresponds to the figure named in the Hebrew parallel as 'Nehemiah, the Tirshatha' (that is, the governor).
    reason: alternative_reading
  - marker: b
    text: Greek 'reader'; the Hebrew parallel has 'the priest, the scribe,' so the traditions differ slightly in Ezra's designation here.
    reason: lexical_alternative
translation:
  language: ko
  text: '그리고 아타라테[a]가 대제사장이며 낭독자인[b] 에스라와 무리를 가르치는 레위인들, 곧 그들 모두에게 말하였습니다:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 Ἀτταρατὴ(아타라테)를 주며, 히브리어 병행본문은 이 인물을 ‘느헤미야, 곧 총독(티르솨타)’으로 제시합니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어는 에스라를 ‘낭독자’라고 하고, 히브리어 병행본문은 그를 ‘제사장, 서기관’으로 부릅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀτταρατὴ
  english_pob_choice: Attarates
  chosen_korean: 아타라테
  alternatives_korean:
  - 아타라테스
  - 아타라테스(Attarates)
  lexicon: 고유명사 음역
  rationale: 그리스어가 제시하는 고유명사 형태를 그대로 옮기기 위해 음역을 유지했습니다. 영어 POB의 'Attarates'에 대응하되, 한국어 표기에서는 자연스러운 음역 '아타라테'를 택했습니다.
- source_word: τῷ ἀρχιερεῖ
  english_pob_choice: the chief priest
  chosen_korean: 대제사장이며
  alternatives_korean:
  - 대사제이며
  - 대제사장에게
  lexicon: LSJ
  rationale: ἀρχιερεύς는 직역상 '대제사장'이 적절하므로 교회적 관용어를 그대로 살렸습니다. 문맥상 에스라의 지위를 설명하는 병렬 표현으로 처리했습니다.
- source_word: καὶ ἀναγνώστῃ
  english_pob_choice: and reader
  chosen_korean: 낭독자인
  alternatives_korean:
  - 읽는 자인
  - 공적 낭독자인
  - 서기관인
  lexicon: LSJ
  rationale: 그리스어 ἀναγνώστης는 문자 그대로 '읽는 사람, 낭독자'입니다. MT 병행본문의 '서기관'과 구별되므로, 영어 POB의 선택을 따라 '낭독자'로 옮겼습니다.
- source_word: τοῖς διδάσκουσι τὸ πλῆθος
  english_pob_choice: to the Levites who were teaching the multitude
  chosen_korean: 무리를 가르치는 레위인들에게
  alternatives_korean:
  - 백성을 가르치는 레위인들에게
  - 많은 무리를 가르치는 레위인들에게
  lexicon: LSJ
  rationale: διδάσκουσι는 현재분사로 지속적 동작을 나타내므로 '가르치는'이 적절합니다. πλῆθος는 단순한 '사람들'보다 '무리'가 더 직접적으로 대응합니다.
- source_word: ἐπὶ πάντας
  english_pob_choice: to all of them
  chosen_korean: 그들 모두에게
  alternatives_korean:
  - 모두에게
  - 그들 위에
  lexicon: LSJ
  rationale: 문맥상 수신 대상을 가리키는 용법으로 읽는 것이 가장 자연스럽습니다. 영어 POB처럼 해석을 반영하되, 한국어에서는 '그들 모두에게'로 간결하게 처리했습니다.
