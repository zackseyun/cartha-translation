translation:
  language: ko
  text: 성전 노래하는 사람들 가운데서는 엘리아세브[a], 바쿠로스입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '엘리아세브: 히브리어 병행 전승에는 이에 대응하는 이름이 ‘엘리야십’ 형태로 나타납니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τῶν
  english_pob_choice: From the
  chosen_korean: 가운데서는
  alternatives_korean:
  - 에서
  - 중에서
  - 로부터
  lexicon: LSJ
  rationale: 목록 안에서 특정 집단을 가려 제시하는 뜻을 자연스럽게 살리면서, 한국어에서 직역투보다 문맥상 매끄러운 표지를 택했습니다.
- source_word: ἱεροψαλτῶν
  english_pob_choice: temple singers
  chosen_korean: 성전 노래하는 사람들
  alternatives_korean:
  - 성전 찬송가들
  - 성전 가객들
  - 성전에서 노래하는 사람들
  lexicon: LSJ
  rationale: ἱερο-와 ψαλτῶν의 성전 예배 맥락과 노래 행위를 함께 드러내기 위해 직역적으로 옮겼습니다. 한국어에서 ‘노래하는 사람들’이 가장 무난하게 의미를 전달합니다.
- source_word: Ἐλιάσεβος
  english_pob_choice: Eliasib
  chosen_korean: 엘리아세브
  alternatives_korean:
  - 엘리야십
  - 엘리아십
  lexicon: transliteration
  rationale: 그리스어 형태를 우선 따르되, 한국어 음역은 자모 대응이 드러나도록 옮겼습니다. 히브리어 전승의 대응형은 각주로 처리합니다.
- source_word: Βάκχουρος
  english_pob_choice: Bacchurus
  chosen_korean: 바쿠로스
  alternatives_korean:
  - 바카우로스
  - 박쿠로스
  lexicon: transliteration
  rationale: 그리스어 고유명사를 추정적 히브리식 정규화 없이 음역했습니다. 영어 POB의 Bacchurus에 대응하는 읽기 쉬운 한국어 표기를 택했습니다.
theological_decisions:
- issue: 고유명사 전승 차이(그리스어 본문 vs 히브리어 병행전승)
  chosen_reading: 본문은 그리스어 Ἐλιάσεβος를 따라 엘리아세브로 두고, 히브리어 대응 전승이 가리키는 이름형은 각주로만 암시합니다.
  alternative_readings:
  - 히브리어 전승을 따라 엘리야십으로 본문 처리
  - 두 전승을 절충해 이중 표기
  rationale: 이 절은 인명 목록이므로 본문 고정은 그리스어 원문에 두는 것이 가장 소스-충실합니다. 다만 병행 전승의 대응 가능성은 보존해야 하므로 각주로 열어 둡니다.
  doctrine_reference: 본문비평과 전승사
