  source_fidelity: 그리스어 본문의 명단 순서와 소속 표지는 충실히 옮겼습니다. 다만 Σαβανναιούς의 겹자음 νν이 초안의 ‘사바나이오스’에서는 반영되지 않았고, Ματταθίας는 그리스어 음역에 더 가까운 ‘마타티아스’로 고치는 것이 적절합니다.
  naturalness: ‘아솜의 아들들 가운데서는 … 있었습니다’는 명단을 도입하는 문장으로 자연스럽고 현대 표준어 합쇼체에 맞습니다. 각주 a는 관련 이름 바로 뒤에 두어 지시 대상이 분명하도록 조정했습니다.
