translation:
  language: ko
  text: 그리고 아솜[a]의 아들들 가운데서는 말탄나이오스와 마타티아스와 사반나이오스와 엘레이팔랏과 므낫세와 시므이가 있었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘아솜’이라고 읽습니다. 히브리어 평행본문은 아마도 ‘하숨’에 해당합니다.
    reason: alternative_reading
  - marker: b
    text: 이 명단의 몇 이름은 히브리어 평행 전통과 정확히 일치하지 않는 그리스어 형태를 반영합니다. 본문은 1 Esdras의 그리스어 증거를 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ ἐκ τῶν υἱῶν
  english_pob_choice: And from the sons of
  chosen_korean: 그리고 …의 아들들 가운데서는
  alternatives_korean:
  - 그리고 …의 아들들 중에서
  - 그리고 …의 아들들에서
  lexicon: LSJ
  rationale: 명단 앞의 소속 표지를 자연스럽게 살리되, 한국어에서는 목록 내 한 분류를 여는 표현으로 ‘가운데서는’이 가장 읽기 쉽습니다.
- source_word: Ἀσόμ
  english_pob_choice: Asom
  chosen_korean: 아솜
  alternatives_korean:
  - 아솜
  - 하숨
  lexicon: LSJ
  rationale: 주된 본문은 그리스어 증거를 따라 음역하고, 히브리어 평행의 가능한 대응은 각주로 처리하는 것이 원문 우선 원칙에 맞습니다.
- source_word: Μαλτανναῖος / Μανασση / Σαβανναιούς / Ἐλειφαλὰτ / Σεμεεί
  english_pob_choice: Maltannaios / Manasseh / Sabannaious / Eleiphalat / Shimei
  chosen_korean: 말탄나이오스 / 므낫세 / 사바나이오스 / 엘레이팔랏 / 시므이
  alternatives_korean:
  - 말탄나이오스 / 마타디아 / 사바나이오스 / 엘리팔랏 / 시므이
  - 말탄네우스 / 므낫세스 / 사바나이우스 / 엘리파렛 / 세메이
  lexicon: LSJ
  rationale: 고유명사는 가능한 한 그리스어 형태를 보존해 음역했고, ‘므낫세’와 ‘시므이’는 한국어 성경에서 이미 널리 쓰이는 이름 형태를 채택했습니다.
theological_decisions:
- issue: 이 절은 족보/명단 항목이며, 히브리 평행과의 이름 대응이 완전히 일치하지 않습니다.
  chosen_reading: 본문은 1 Esdras의 그리스어 증거를 따라 이름들을 그대로 옮기고, 히브리어 평행은 본문을 교정하는 대신 각주로만 안내합니다.
  alternative_readings:
  - 히브리 평행에 맞춰 하숨, 마다냐, 삽등으로 정규화하기
  - 유명한 구약형 이름으로 전면 조화하기
  rationale: 본문의 의미는 ‘이 이름들이 아솜 계열에 속한다’는 목록 제시이므로, 평행 전통이 달라도 그리스어 증거를 우선해야 합니다.
  doctrine_reference: 원문 우선과 평행본문 처리 원칙
- issue: Σαβανναιούς의 형태가 히브리어 평행과 다소 어긋납니다.
  chosen_reading: 이름의 불일치를 숨기지 않고 음역을 유지합니다.
  alternative_readings:
  - 추정되는 히브리어 대응명으로 바꾸기
  - 익숙한 성경식 인명으로 평준화하기
  rationale: 독자가 실제 본문 차이를 보도록 하는 편이 1 Esdras의 전승 특성을 더 정확히 드러냅니다.
  doctrine_reference: 본문비평 및 전승사 인식
