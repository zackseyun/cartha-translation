base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/038.yaml
  text: And all the multitude gathered together with one accord in the open square of the eastern gate of the temple,[a]
  footnotes:
  - marker: a
    text: Or 'in the broad place by the eastern gate of the temple.' The Greek phrase ἐπὶ τὸ εὐρύχωρον can be rendered more literally as 'into the broad/open place.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 온 무리가 한마음으로 성전 동쪽 문 앞의 넓은 곳에 모였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성전 동쪽 문 곁의 넓은 곳에.’ 그리스어 ἐπὶ τὸ εὐρύχωρον은 더 문자적으로 ‘넓고 트인 곳으로’라고 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν τὸ πλῆθος
  english_pob_choice: all the multitude
  chosen_korean: 모든 무리
  alternatives_korean:
  - 모든 군중
  - 온 회중
  - 모든 사람들
  lexicon: BDAG
  rationale: πλῆθος는 큰 집합체를 가리키므로, ‘모든 무리’가 규모와 집합성을 자연스럽게 살립니다.
- source_word: ὁμοθυμαδόν
  english_pob_choice: with one accord
  chosen_korean: 한마음으로
  alternatives_korean:
  - 일치하여
  - 한뜻으로
  - 모두 함께
  lexicon: BDAG
  rationale: 단순한 동시성이 아니라 뜻과 방향의 일치를 나타내므로, 관용적이면서도 의미를 드러내는 ‘한마음으로’를 택했습니다.
- source_word: ἐπὶ τὸ εὐρύχωρον
  english_pob_choice: in the open square
  chosen_korean: 넓은 마당에
  alternatives_korean:
  - 넓은 광장에
  - 빈터에
  - 넓은 열린 곳에
  lexicon: LSJ
  rationale: εὐρύχωρον은 넓게 트인 공개 공간을 뜻하므로, 성전 맥락에 맞는 공공적 공간으로 ‘넓은 마당’을 옮겼습니다.
- source_word: τοῦ πρὸς ἀνατολὰς ἱεροῦ πυλῶνος
  english_pob_choice: of the eastern gate of the temple
  chosen_korean: 성전 동쪽 문
  alternatives_korean:
  - 성전의 동문
  - 성전의 동쪽 문
  - 동쪽에 있는 성전 문
  lexicon: LSJ
  rationale: πρὸς ἀνατολάς는 방향을, πυλών은 문/문루를 가리키므로, 자연스러운 한국어 속성 구조로 ‘성전 동쪽 문’이라고 옮겼습니다.
theological_decisions:
- issue: 이 구절의 공간 표현은 성전 예배 공간의 공적 모임을 강조합니다.
  chosen_reading: ‘넓은 마당’과 ‘성전 동쪽 문’을 함께 살려, 단순한 위치 정보가 아니라 공개적 집회 장소라는 점을 드러냈습니다.
  alternative_readings:
  - ‘넓은 광장’
  - ‘동문’
  rationale: 본문의 εὐρύχωρον은 단지 ‘넓다’는 형용이 아니라 열린 집회 장소를 뜻하므로, 성전 맥락에서 공적 모임의 성격이 드러나도록 번역했습니다.
  doctrine_reference: 역사 서술의 장소 묘사
