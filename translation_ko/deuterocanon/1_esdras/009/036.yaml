base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/036.yaml
  text: All these had lived with foreign women[a], and they sent them away with the children.
  footnotes:
  - marker: a
    text: Or, more explicitly from the Hebrew parallel, 'had married foreign women' or 'had taken foreign wives.'
    reason: alternative_reading
translation:
  language: ko
  text: 이들은 모두 이방 여자들과 함께 살았으며, 그 여자들과 그 자녀들을 함께 내보냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 평행본문에서는 ‘이방 여자들을 아내로 맞았다/이방 아내들을 취했다’는 뜻이 더 분명합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: συνῴκησαν
  english_pob_choice: had lived with
  chosen_korean: 함께 살았으며
  alternatives_korean:
  - 거주하였으며
  - 동거하였으며
  - 함께 살았습니다
  lexicon: LSJ
  rationale: 그리스어는 단순히 ‘함께 살다/동거하다’의 뜻을 가지므로, 관계를 더 강하게 특정하는 ‘결혼하다’보다 원문 의미를 직접 반영했습니다.
- source_word: γυναῖξιν ἀλλογενέσιν
  english_pob_choice: foreign women
  chosen_korean: 이방 여자들
  alternatives_korean:
  - 외국 여자들
  - 다른 민족의 여자들
  - 이방의 아내들
  lexicon: LSJ
  rationale: ἀλλογενής는 ‘다른 민족/혈통에 속한’이라는 뜻이어서, 성경적 한국어에서 자연스러운 ‘이방 여자들’이 적절합니다. ‘아내들’은 원문에 없는 혼인 관계를 본문에 더 강하게 넣습니다.
- source_word: ἀπέλυσαν αὐτὰς
  english_pob_choice: they sent them away
  chosen_korean: 그 여자들을 내보냈습니다
  alternatives_korean:
  - 그 여자들을 보냈습니다
  - 그 여자들을 떠나보냈습니다
  - 그 여자들을 해산시켰습니다
  lexicon: LSJ
  rationale: ἀπολύω는 ‘보내다/해고하다/내보내다’의 의미가 있으므로, 이 문맥에서는 관계를 끊고 내보낸다는 뜻을 자연스럽게 드러내는 ‘내보냈습니다’가 적절합니다.
- source_word: σὺν τέκνοις
  english_pob_choice: with the children
  chosen_korean: 그 자녀들을 함께
  alternatives_korean:
  - 자녀들과 함께
  - 아이들과 함께
  - 자녀들을 데리고
  lexicon: LSJ
  rationale: σὺν은 ‘~와 함께’이므로, 본문 흐름상 앞의 여성들과 연결되는 자녀들을 함께 내보냈다는 뜻을 살려 ‘그 자녀들을 함께’로 옮겼습니다.
theological_decisions:
- issue: συνῴκησαν을 혼인 표현으로 명시할지, 동거/함께 삶의 더 넓은 의미를 유지할지
  chosen_reading: 원문이 직접 말하는 ‘함께 살다’의 의미를 유지했습니다.
  alternative_readings:
  - 결혼하여 살았습니다
  - 이방 여자들을 아내로 맞았습니다
  - 이방 여자들과 결혼했습니다
  rationale: 히브리어 평행본문은 혼인 관계를 더 분명히 보이지만, 이 구절의 주된 번역 원문은 그리스어이므로 혼인을 단정하는 표현보다 원문의 범위를 보존하는 쪽이 더 충실합니다.
  doctrine_reference: 원문 우선 번역 원칙; optimal equivalence
