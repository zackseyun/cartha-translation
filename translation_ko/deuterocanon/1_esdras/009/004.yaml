base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/004.yaml
  text: And whoever does not appear within two or three days[a], according to the judgment of the presiding elders, their livestock will be devoted[b], and he himself will be excluded from the assembly of the captivity.
  footnotes:
  - marker: a
    text: Or, more interpretively, 'their property will be forfeited.' The Greek says 'will be devoted,' which may carry confiscatory force in this legal setting.
    reason: lexical_alternative
  - marker: b
    text: Or 'from the community of the exiles.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 누구든지 이틀이나 사흘 안에 출두하지 않으면, 주재하는 장로들의 결정에 따라 그 사람의 가축은 바쳐질 것이며[a], 그 사람 자신도 포로 공동체에서 제외될 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘바쳐질 것이다’입니다. 이 법적 문맥에서는 재산이 몰수되는 뜻으로 이해할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘포로들의 모임에서’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαντήσωσιν
  english_pob_choice: appear
  chosen_korean: 나타나지 않는
  alternatives_korean:
  - 나타나지 않는
  - 출두하지 않는
  - 응하지 않는
  lexicon: BDAG
  rationale: 소환에 응해 정해진 기한 안에 나오는 법적 맥락이므로, 단순한 ‘만나다’보다 ‘나타나다/출두하다’가 뜻을 분명히 전합니다.
- source_word: ἐν δυσὶν ἢ τρισὶν ἡμέραις
  english_pob_choice: within two or three days
  chosen_korean: 이틀이나 사흘 안에
  alternatives_korean:
  - 이틀이나 사흘 안에
  - 이틀 혹은 사흘 내에
  - 이틀에서 사흘 사이에
  lexicon: BDAG
  rationale: 허용된 기한을 뜻하므로 한국어에서도 시간 한계를 드러내는 ‘안에’로 옮겼습니다.
- source_word: τῶν προκαθημένων πρεσβυτέρων
  english_pob_choice: of the presiding elders
  chosen_korean: 앞에 앉은 장로들
  alternatives_korean:
  - 주재하는 장로들
  - 앞에 앉은 장로들
  - 주관하는 장로들
  lexicon: BDAG
  rationale: προκαθημένων의 핵심은 앞자리/주재의 권위이므로, 직역에 가깝게 ‘앞에 앉은’으로 옮겨 권위 구조를 보존했습니다.
- source_word: ἀνιερωθήσονται
  english_pob_choice: will be devoted
  chosen_korean: 바쳐지게 되고
  alternatives_korean:
  - 바쳐지게 되고
  - 전념되게 되고
  - 몰수되게 되고
  lexicon: LSJ
  rationale: 본문의 기본 뜻은 ‘바쳐지다/봉헌되다’이며, 이 법적 문맥에서는 사실상 몰수의 효과가 있음을 드러내되 원어의 어감을 살리기 위해 ‘바쳐지게’로 옮겼습니다.
- source_word: ἀλλοτριωθήσεται
  english_pob_choice: will be excluded
  chosen_korean: 제외될 것입니다
  alternatives_korean:
  - 제외될 것입니다
  - 떨어져 나갈 것입니다
  - 소외될 것입니다
  lexicon: BDAG
  rationale: 공동체 소속에서 끊어지는 법적 결과이므로, 현대 한국어의 명료한 표현인 ‘제외되다’가 적절합니다.
- source_word: ἀπὸ τοῦ πλήθους τῆς αἰχμαλωσίας
  english_pob_choice: from the assembly of the captivity
  chosen_korean: 포로들의 모임에서
  alternatives_korean:
  - 포로들의 모임에서
  - 포로 공동체에서
  - 사로잡힌 자들의 무리에서
  lexicon: BDAG
  rationale: πλῆθος는 ‘무리/모임’의 뜻이 있고, αἰχμαλωσία는 포로 상태를 가리키므로, 원문을 따라 ‘포로들의 모임’으로 옮겼습니다.
theological_decisions:
- issue: ἀνιερωθήσονται의 제재 성격
  chosen_reading: 가축은 ‘바쳐지게’ 되지만, 이 법적 맥락에서는 실질적으로 재산 몰수의 제재를 뜻합니다.
  alternative_readings:
  - 단순히 재산이 몰수된다는 뜻일 수 있습니다.
  - 봉헌적 뉘앙스가 거의 없는 법적 처분일 수 있습니다.
  rationale: 원어는 봉헌/전적 헌납의 어감을 가지지만, 본문 맥락상 처벌 조항이므로 그 어감을 보존하면서도 실제 효과가 제재라는 점을 드러냈습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
