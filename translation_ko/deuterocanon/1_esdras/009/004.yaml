revisions:
- from: 그리고 이틀이나 사흘 안에 나타나지 않는 사람은, 앞에 앉은 장로들의 판결에 따라 그들의 가축이 바쳐지게 되고, 그 자신도 포로들의 모임에서 제외될 것입니다.[a][b]
  to: 그리고 누구든지 이틀이나 사흘 안에 출두하지 않으면, 주재하는 장로들의 결정에 따라 그 사람의 가축은 바쳐질 것이며[a], 그 사람 자신도 포로 공동체에서 제외될 것입니다.[b]
  rationale: 소환에 응하여 정해진 기한 안에 나오는 뜻을 ‘출두하다’로 명확히 했습니다. ‘주재하는 장로들’은 προκαθημένων의 권위와 기능을 자연스럽게 반영하며, ‘결정’은 κρῖμα의 법적·행정적 성격을 무리 없이 전달합니다. 본문의 ‘바쳐질 것’은 ἀνιερωθήσονται의 어감을 유지하고, 몰수라는 해석은 각주에서만 제시했습니다. 각주 표지도 각 설명 대상에 맞춰 옮겼습니다.
