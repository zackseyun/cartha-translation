translation:
  language: ko
  text: 엘라의 아들들 가운데에는 마탄과 자카리아스, 예즈리킬로스와 오압디오스와 히에레모트와 아에데이아스가 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 인명들은 그리스어 본문의 형태를 따라 옮겼습니다. 1 에스드라는 히브리어 평행본문과 인명의 철자와 순서가 종종 다르므로, 일부 이름에는 더 익숙한 히브리어계 대응형이 있을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  english_pob_choice: From the sons of
  chosen_korean: 엘라의 아들들 가운데는
  alternatives_korean:
  - 엘라의 아들들 중에서
  - 엘라의 아들들로부터
  lexicon: LSJ
  rationale: ἐκ은 출처를 나타내지만, 한국어에서는 족보/명단 문맥에서 ‘가운데는’이 자연스럽고 선택된 하위 집단을 잘 드러냅니다.
- source_word: Ἠλά
  english_pob_choice: Elah
  chosen_korean: 엘라
  alternatives_korean:
  - 에라
  - 엘라흐
  lexicon: LSJ
  rationale: 고유명사는 그리스어 형태를 따라 음역하되, 이미 익숙한 성경식 표기인 ‘엘라’를 유지하는 것이 가장 투명합니다.
- source_word: Ἰεζρίκιλος
  english_pob_choice: Jezrikilus
  chosen_korean: 예즈리길루스
  alternatives_korean:
  - 예즈리킬루스
  - 예즈리키로스
  lexicon: LSJ
  rationale: 희귀한 이름이므로 히브리어식 추정형으로 바꾸지 않고, 그리스어 전승에 가깝게 음역했습니다.
- source_word: Ὠαβδίος
  english_pob_choice: Obadiah
  chosen_korean: 오바디아
  alternatives_korean:
  - 오아브디오스
  - 오바디야
  lexicon: LSJ
  rationale: 영어 POB의 본문 판단에 따라 전통적 대응형인 ‘오바디아’를 쓰되, 그리스어 Ὠαβδίος의 가능한 대응이라는 점을 보존했습니다.
- source_word: Ἱερεμὼθ
  english_pob_choice: Jeremoth
  chosen_korean: 예레못
  alternatives_korean:
  - 예레모스
  - 예레모트
  lexicon: LSJ
  rationale: 그리스어 고유명사를 직역하지 않고 음역해, 원문 명단의 형태를 그대로 보여 줍니다.
- source_word: Ἀηδείας
  english_pob_choice: Aedeias
  chosen_korean: 아에데아스
  alternatives_korean:
  - 에데아스
  - 아이데이아스
  lexicon: LSJ
  rationale: 마지막 이름도 히브리어 평행본문으로 평준화하지 않고, 현존하는 그리스어 표기를 따라 옮겼습니다.
theological_decisions:
