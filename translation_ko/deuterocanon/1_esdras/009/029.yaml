translation:
  language: ko
  text: 그리고 베바이 자손 가운데에는 요한과 아나니아와 자브도와 에마티스가 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 명단의 이름들은 에스드라스 첫째의 그리스어 본문을 따라 옮겼습니다. 대략적인 히브리어 평행본문에서는 일부 이름의 형태가 다를 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: καὶ ἐκ τῶν υἱῶν Βηβαί
  english_pob_choice: And from the sons of Bebai
  chosen_korean: 그리고 베바이의 자손들 가운데서는
  alternatives_korean:
  - 그리고 베바이의 아들들 가운데서는
  - 그리고 베바이 가문에서
  lexicon: LSJ
  rationale: υἱῶν은 족보·명단 문맥에서 단순히 ‘아들들’보다 넓게 ‘자손들’로 옮길 수 있어, 명단의 소속 관계를 자연스럽게 살리면서도 직역 구조를 유지했습니다.
- source_word: Ἰωάννης
  english_pob_choice: Joannes
  chosen_korean: 요한
  alternatives_korean:
  - 요아네스
  - 조안네스
  lexicon: LSJ
  rationale: 그리스어 인명 Ἰωάννης는 한국어 성경에서 널리 정착된 표기로 옮겼습니다. 이 책의 그리스어 본문을 따르되 독자가 즉시 인명으로 인식할 수 있게 했습니다.
- source_word: Ἁνανίας
  english_pob_choice: Ananias
  chosen_korean: 아나니아
  alternatives_korean:
  - 하나냐
  - 아나니아스
  lexicon: LSJ
  rationale: 그리스어 형태를 음역하되, 한국어 성경 인명 관습에 맞는 ‘아나니아’를 택했습니다. 히브리어식 형태보다 그리스어 증거를 우선한 선택입니다.
- source_word: Ζάβδος
  english_pob_choice: Zabdos
  chosen_korean: 자브도
  alternatives_korean:
  - 자브두스
  - 자브다
  lexicon: LSJ
  rationale: 드문 고유명사는 그리스어 자모와 발음을 최대한 보존하는 음역이 적절합니다. 본문에 나타난 Ζάβδος의 그리스어 형태를 직접 반영했습니다.
- source_word: Ἐμαθίς
  english_pob_choice: Emathis
  chosen_korean: 에마티스
  alternatives_korean:
  - 에마디스
  - 에마티스
  lexicon: LSJ
  rationale: 이름의 그리스어 표기를 보수적으로 음역했습니다. 희귀 고유명사이므로 추정적 히브리어 환원보다 본문 형태를 따르는 것이 더 안전합니다.
theological_decisions:
- issue: 명단 구절에서 서술어의 자연스러운 한국어 처리
  chosen_reading: 존재를 나타내는 ‘있었습니다’를 사용해, 단순 나열이면서도 한국어 문장으로 매끄럽게 읽히도록 했습니다.
  alternative_readings:
  - 직역적으로 ‘있었습니다’ 없이 인명만 열거
  - ‘있었고’로 연결
  rationale: 이 절은 역사 서술 속 인명 목록이므로 과도한 해석을 피하면서 한국어 문장성만 보완하는 것이 적절합니다.
  doctrine_reference: 서술문 번역 원칙
