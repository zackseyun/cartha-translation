  - 살룸
  lexicon: 음역
  rationale: 그리스어 형태를 직접 반영한 음역을 택해, 히브리어식 익숙한 이름으로 평준화하지 않았습니다.
- source_word: Τοβάνης
  english_pob_choice: Tobanes
  chosen_korean: 토바네스
  alternatives_korean:
