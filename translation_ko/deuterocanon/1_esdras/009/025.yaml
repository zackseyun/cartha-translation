translation:
  language: ko
  text: 문지기들 중에는 살루무스와 토바네스가 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 이 두 문지기의 이름을 ‘살루무스’와 ‘토바네스’라는 형태로 전합니다. 이 대목의 병행 히브리어 전통은 본문과 밀접하게 일치하지 않으며, 이 이름들을 같은 형태로 보존하지 않습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν θυρωρῶν
  english_pob_choice: From the gatekeepers
  chosen_korean: 문지기들 중에서는
  alternatives_korean:
  - 문지기들로는
  - 문지기들 가운데는
  - 문지기들 중에서
  lexicon: LSJ
  rationale: ἐκ는 이 명단에서 특정 집단을 가리키는 표지이므로, 한국어에서는 소속 범주를 드러내는 「중에서는」로 옮겨 자연스러운 목록 문맥을 살렸습니다.
- source_word: Σάλλουμος
