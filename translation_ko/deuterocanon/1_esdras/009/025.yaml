  source_fidelity: 그리스어 ἐκ τῶν θυρωρῶν은 명단의 범주 표지로서 ‘문지기들 중에는’으로 자연스럽게 옮길 수 있습니다. 두 이름도 그리스어 형태를 따라야 합니다. 특히 Σάλλουμος의 첫 자음은 σ(ㅅ)이므로, ‘샬루무스’보다 ‘살루무스’가 원문 음역에 더 충실합니다.
  naturalness: 현행 ‘문지기들 중에서는 …입니다’는 대조를 암시하는 ‘-에서는’과 현재적 분류의 ‘입니다’가 결합되어 명단 문맥에서 다소 부자연스럽습니다. ‘문지기들 중에는 …가 있었습니다’가 현대 표준 한국어의 격식 있는 성경 명단 문체에 더 자연스럽습니다.
