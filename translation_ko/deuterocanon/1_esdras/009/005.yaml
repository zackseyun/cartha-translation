  - 아홉째 달 스무째 날
  lexicon: LSJ
  rationale: 달 표기를 현대 독자가 이해하기 쉽게 풀어 쓰되, ‘그 달 스무째 날’로 원문의 날짜 표지를 보존했습니다.
theological_decisions:
- issue: 지파 명칭의 집합적 의미
  chosen_reading: ‘유다와 베냐민 지파에서 나온 이들’로, 개별 남성만이 아니라 그 지파에 속한 공동체 전체의 집합을 나타내는 표현으로 옮겼습니다.
  alternative_readings:
  - ‘유다와 베냐민 지파의 사람들’
  - ‘유다와 베냐민의 남자들’
  rationale: 영어 POB도 gendered ‘men’을 피하고 소속 집단을 강조했으므로, 본문이 말하는 공동체적 소집의 의미를 그대로 살렸습니다.
  doctrine_reference: 본문 해석 / 집합 명사 처리
- issue: 달력 표기의 설명 방식
  chosen_reading: ‘아홉째 달, 곧 그 달 스무째 날’로 직역과 설명을 함께 두어, 행사 시점을 명확히 했습니다.
  alternative_readings:
  - ‘아홉째 달 스무째 날’
  - ‘아홉째 달의 스무째 날’
  rationale: 본문은 신학 논쟁이 아니라 연대기적 표지이므로, 독해의 명료성을 우선하되 원문의 시간 표지를 축약하지 않았습니다.
  doctrine_reference: 본문 해석 / 연대기 표지
