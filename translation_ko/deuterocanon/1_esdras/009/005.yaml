  rationale: 그리스어는 ‘유다와 베냐민에 속한 사람들’이라는 소속을 말하므로, 지파 소속을 드러내되 성별을 덧붙이지 않는 ‘이들’을 택했습니다.
- source_word: ἐν τρισὶν ἡμέραις
  english_pob_choice: within three days
  chosen_korean: 사흘 안에
