base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/005.yaml
  text: And those from the tribe of Judah and Benjamin were gathered in Jerusalem within three days; it was the ninth month[a], on the twentieth day of the month.
  footnotes:
  - marker: a
    text: Greek has the singular 'tribe' with 'Judah and Benjamin'; the sense is the people belonging to Judah and Benjamin. The Hebrew parallel in Ezra 10:9 reads 'all the men of Judah and Benjamin gathered themselves to Jerusalem within three days.'
    reason: cross_reference
translation:
  language: ko
  text: 유다와 베냐민 지파에 속한 이들이 사흘 안에 예루살렘으로 모였습니다. 그때는 아홉째 달 스무째 날이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘지파’를 단수형으로 쓰면서 유다와 베냐민을 함께 언급합니다. 따라서 이 표현은 유다와 베냐민에 속한 사람들을 가리키는 것으로 이해됩니다. 히브리어 평행본문인 에스라 10:9는 ‘유다와 베냐민의 모든 사람’이라고 말합니다.
    reason: cross_reference
