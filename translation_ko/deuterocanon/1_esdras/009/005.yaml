base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/005.yaml
  text: And those from the tribe of Judah and Benjamin were gathered in Jerusalem within three days; it was the ninth month[a], on the twentieth day of the month.
  footnotes:
  - marker: a
    text: Greek has the singular 'tribe' with 'Judah and Benjamin'; the sense is the people belonging to Judah and Benjamin. The Hebrew parallel in Ezra 10:9 reads 'all the men of Judah and Benjamin gathered themselves to Jerusalem within three days.'
    reason: cross_reference
translation:
  language: ko
  text: 그리고 유다와 베냐민 지파에서 나온 이들이 사흘 안에 예루살렘에 모였습니다. 그것은 아홉째 달, 곧 그 달 스무째 날이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘지파’가 단수형이지만 유다와 베냐민을 함께 가리키는 집합적 표현입니다. 히브리어 평행본문인 에스라 10:9는 ‘유다와 베냐민의 모든 사람이…’라고 더 명시적으로 말합니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισυνήχθησαν
  english_pob_choice: were gathered
  chosen_korean: 모였습니다
  alternatives_korean:
  - 모였습니다
  - 모여들었습니다
  - 집합되었습니다
  lexicon: BDAG
  rationale: 수동형으로 된 모임의 형식을 살리면서도, 현대 한국어에서 가장 자연스러운 공적 집합 표현인 ‘모이다’를 택했습니다.
- source_word: οἱ ἐκ τῆς φυλῆς Ἰούδα καὶ Βενιαμεὶν
  english_pob_choice: those from the tribe of Judah and Benjamin
  chosen_korean: 유다와 베냐민 지파에서 나온 이들
  alternatives_korean:
  - 유다와 베냐민 지파에 속한 이들
  - 유다와 베냐민 지파의 사람들
  - 유다와 베냐민의 지파에서 나온 이들
  lexicon: LSJ
  rationale: 그리스어는 ‘유다와 베냐민에 속한 사람들’이라는 소속을 말하므로, 지파 소속을 드러내되 성별을 덧붙이지 않는 ‘이들’을 택했습니다.
- source_word: ἐν τρισὶν ἡμέραις
  english_pob_choice: within three days
  chosen_korean: 사흘 안에
  alternatives_korean:
  - 사흘 내에
  - 사흘 동안에
  - 사흘 후에
  lexicon: BDAG
  rationale: 기한·기간의 의미를 자연스럽게 전달하기 위해 ‘사흘 안에’를 사용했습니다.
- source_word: εἰς Ἰερουσαλήμ
  english_pob_choice: to Jerusalem
  chosen_korean: 예루살렘에
  alternatives_korean:
  - 예루살렘으로
  - 예루살렘 안에
  - 예루살렘에 이르러
  lexicon: BDAG
  rationale: 도착 목적지를 한국어에서 자연스럽게 나타내는 조사 ‘-에’를 사용해 모임의 도착지를 분명히 했습니다.
- source_word: οὗτος ὁ μὴν ἔνατος / τῇ εἰκάδι τοῦ μηνός
  english_pob_choice: it was the ninth month, on the twentieth day of the month
  chosen_korean: 아홉째 달, 곧 그 달 스무째 날
  alternatives_korean:
  - 아홉째 달, 곧 그 달 스무 날
  - 아홉째 달의 스무째 날
  - 아홉째 달 스무째 날
  lexicon: LSJ
  rationale: 달 표기를 현대 독자가 이해하기 쉽게 풀어 쓰되, ‘그 달 스무째 날’로 원문의 날짜 표지를 보존했습니다.
theological_decisions:
- issue: 지파 명칭의 집합적 의미
  chosen_reading: ‘유다와 베냐민 지파에서 나온 이들’로, 개별 남성만이 아니라 그 지파에 속한 공동체 전체의 집합을 나타내는 표현으로 옮겼습니다.
  alternative_readings:
  - ‘유다와 베냐민 지파의 사람들’
  - ‘유다와 베냐민의 남자들’
  rationale: 영어 POB도 gendered ‘men’을 피하고 소속 집단을 강조했으므로, 본문이 말하는 공동체적 소집의 의미를 그대로 살렸습니다.
  doctrine_reference: 본문 해석 / 집합 명사 처리
- issue: 달력 표기의 설명 방식
  chosen_reading: ‘아홉째 달, 곧 그 달 스무째 날’로 직역과 설명을 함께 두어, 행사 시점을 명확히 했습니다.
  alternative_readings:
  - ‘아홉째 달 스무째 날’
  - ‘아홉째 달의 스무째 날’
  rationale: 본문은 신학 논쟁이 아니라 연대기적 표지이므로, 독해의 명료성을 우선하되 원문의 시간 표지를 축약하지 않았습니다.
  doctrine_reference: 본문 해석 / 연대기 표지
