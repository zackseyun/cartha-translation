translation:
  language: ko
  text: 또 마니[a]의 아들들 중에는 올라모스, 마무코스, 예다이오스, 야수보스, 아사엘, 예레못이 있었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 Μανί라고 읽으며, 에스라 병렬 전통의 히브리어 명단에서는 바니와 대응되는 것으로 자주 여겨집니다.
    reason: alternative_reading
  - marker: b
    text: 이 명단의 몇몇 이름은 히브리어 병렬 목록의 이름들과 대응될 가능성이 있지만, 본문 번역은 일차적으로 1 에스드라의 그리스어 형태를 따릅니다.
    reason: cross_reference
