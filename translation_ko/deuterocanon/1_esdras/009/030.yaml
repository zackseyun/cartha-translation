revisions:
- from: 그리고 마니의 아들들 가운데서는 오람, 마무스, 예다이, 야수브, 아사엘, 예레못이 있었습니다.[a][b]
  to: 또 마니[a]의 아들들 중에는 올라모스, 마무코스, 예다이오스, 야수보스, 아사엘, 예레못이 있었습니다.[b]
  rationale: 가문명과 명단 구조는 유지하되, 그리스어 원문을 따른다는 번역 원칙에 맞게 축약되거나 누락된 인명 음가를 보완했습니다. Ἀσάηλος와 Ἰερεμώθ는 한국어에서 이미 자연스럽고 식별 가능한 ‘아사엘, 예레못’으로 두었습니다. Μανί 관련 각주는 해당 단어에 직접 연결하고, 일반적인 병렬 목록 관련 주석은 명단 전체 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:09:40Z'
review_pass:
  verdict: revise
  source_fidelity: 그리스어의 가문명 Μανί는 ‘마니’로 잘 보존했으나, 여러 인명은 그리스어 형태의 일부 음가 또는 어미를 축약하여 원문을 직접 따르는 번역이라는 제시된 원칙과 맞지 않습니다. 특히 Μάμουχος의 χ와 Ἰεδαῖος·Ἰάσουβος의 그리스어 형태가 본문에서 충분히 반영되지 않았습니다.
  naturalness: ‘마니의 아들들 중에는 … 있었습니다’는 현대 표준 한국어의 명단 문맥에서 자연스럽고 합쇼체에도 적절합니다. 접속사 καὶ는 ‘또’로 간결하게 옮길 수 있습니다.
  terminology: 고유명사는 히브리어 병렬 목록에 맞추어 조화시키지 않고 그리스어 1 에스드라의 형태를 일관되게 음역하는 편이 적절합니다. 아사엘과 예레못은 한국어에서 읽기 자연스러운 관용적 어미 처리를 유지할 수 있으나, 다른 이름에서 탈락한 자음과 형태는 보완해야 합니다.
  issues:
