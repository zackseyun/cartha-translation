theological_decisions:
- issue: 명단 서술의 연결 방식
  chosen_reading: 한국어에서는 열거를 자연스럽게 하기 위해 마지막 두 이름 앞의 접속을 완화하여 한 번만 연결했습니다.
  alternative_readings:
  - 오람, 마무스, 예다이, 야수브, 아사엘, 그리고 예레못
  - 오람과 마무스와 예다이와 야수브와 아사엘과 예레못
  rationale: 그리스어는 단순한 연속 명단이므로, 한국어에서는 중복된 접속을 줄여도 의미 손실이 없습니다. 다만 원문의 열거성은 유지했습니다.
