translation:
  language: ko
  text: 그리고 마니의 아들들 가운데서는 오람, 마무스, 예다이, 야수브, 아사엘, 예레못이 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 Μανί라고 읽으며, 에스라 병렬 전통의 히브리어 명단에서는 바니와 대응되는 것으로 자주 보입니다.
    reason: cross_reference
  - marker: b
    text: 이름들은 히브리어 병렬 목록과 대응될 가능성이 있지만, 본문 번역은 1 Esdras의 그리스어 형태를 따릅니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
