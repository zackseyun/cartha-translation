base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/030.yaml
  text: 'And from the sons of Mani: Olamus[a], Mamuchus, Jedaeus, Jasubus, Asael[b], and Jeremoth.'
