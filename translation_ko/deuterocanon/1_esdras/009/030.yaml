    issue: Μάμουχος를 ‘마무스’로 옮김
    rationale: 그리스어 χ가 탈락되어 마무스라는 형태는 Μάμουχος의 직접 음역으로 보기 어렵습니다. 병렬 히브리어형으로의 무의식적 조화를 피하고 ‘마무코스’로 옮기는 것이 안전합니다.
  - severity: medium
    issue: Ὤλαμος, Ἰεδαῖος, Ἰάσουβος의 그리스어 형태가 과도하게 축약됨
