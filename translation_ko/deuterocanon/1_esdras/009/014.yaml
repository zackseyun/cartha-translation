base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/014.yaml
  text: Jonathan son of Azael and Hezekiah son of Thocanus accepted this[c][b][a], and Mosollamus and Levi and Sabbataeus joined in deciding with them.
  footnotes:
  - marker: a
    text: The Greek names here differ from the approximate Hebrew parallel in Ezra 10; compare forms such as Meshullam for Mosollamus and Shabbethai for Sabbataeus.
    reason: alternative_reading
  - marker: b
    text: The verb rendered 'joined in deciding with them' is rare and may also mean that these men acted as assessors or gave supporting judgment with them.
    reason: lexical_alternative
  - marker: c
    text: The Greek text of 1 Esdras here does not closely match the wording of the Masoretic parallel, so the names and phrasing should be read as anchored primarily in the Greek witness.
    reason: textual_variant
translation:
  language: ko
  text: 요나답은 아자엘의 아들이며 헤스기야는 토카누스의 아들이었는데, 이 일에 동의하였습니다. 그리고 모솔라무스와 레위와 사바타이오스도 그들과 함께 판단하는 데 가담하였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문의 인명은 히브리어 병행 본문과 다소 다릅니다. 따라서 본문은 그리스어 증거를 우선해 옮겼습니다.
    reason: textual_variant
  - marker: b
    text: 희귀 동사 συνεβράβευσαν은 ‘함께 판단하다’ 외에도 ‘보조 판관처럼 참여하다’는 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 구절은 마소라 본문의 평행문과 표현이 정확히 일치하지 않으므로, 이름과 어구는 그리스어 본문에 우선해 읽어야 합니다.
    reason: source_note
lexical_decisions:
- source_word: Ἰωνάθας Ἀζαήλου
  english_pob_choice: Jonathan son of Azael
  chosen_korean: 요나답은 아자엘의 아들이며
  alternatives_korean:
  - 요나단은 아자엘의 아들이며
  - 요나답 아자엘의 아들이며
  lexicon: Greek patronymic construction
  rationale: 그리스어 속격 관계를 한국어에서 가장 분명하게 드러내기 위해 ‘~의 아들’로 옮겼습니다. 요나단보다 요나답은 본문 음가에 더 가깝게 옮긴 형태로 보았습니다.
- source_word: ἐπεδέξαντο κατὰ ταῦτα
  english_pob_choice: accepted this
  chosen_korean: 이 일에 동의하였습니다
  alternatives_korean:
  - 이것을 받아들였습니다
  - 이러한 내용에 따라 수락하였습니다
  - 이에 동의했습니다
  lexicon: LSJ
  rationale: 행정·결정 문맥에서 ἐπιδέχομαι는 단순한 ‘받다’보다 ‘수락하다/동의하다’의 뜻이 자연스럽습니다. κατὰ ταῦτα의 ‘그에 따라’라는 의미를 한국어에서 간결하게 반영했습니다.
- source_word: Σαββαταῖος
  english_pob_choice: Sabbataeus
  chosen_korean: 사바타이오스
  alternatives_korean:
  - 샤브베타이
  - 사바타이
  lexicon: Greek proper name transliteration
  rationale: 이 본문은 그리스어 증거를 기준으로 하므로, 히브리어 병행형 대신 그리스어 이름을 음역했습니다. 표준 외래어 표기 관행에 맞춰 사바타이오스로 옮겼습니다.
- source_word: συνεβράβευσαν αὐτοῖς
  english_pob_choice: joined in deciding with them
  chosen_korean: 그들과 함께 판단하는 데 가담하였습니다
  alternatives_korean:
  - 그들과 함께 판단하였습니다
  - 그들과 함께 심사하는 데 동참하였습니다
  - 그들을 도와 판정하였습니다
  lexicon: LSJ
  rationale: 희귀 동사의 법정·심사적 뉘앙스를 살리되, ‘assessors’처럼 과도한 직분 해석은 피했습니다. ‘가담하다’는 함께 판정 과정에 참여했다는 뜻을 비교적 중립적으로 전합니다.
theological_decisions:
- issue: 1 Esdras의 그리스어 본문이 사마리아/마소라 계열 병행 본문과 이름 및 표현에서 어긋나는 문제
  chosen_reading: 본문의 그리스어 증거를 मुख्य 기준으로 두고, 인명은 그리스어형을 한국어로 음역했습니다.
  alternative_readings:
  - 히브리어 병행형에 맞춰 Meshullam, Shabbethai 등으로 조정
  - 병행 본문을 따라 문구를 재구성
  rationale: 주어진 본문은 그리스어 1 Esdras가 1차 증거이므로, 병행 히브리 본문은 참고만 하고 본문 표기는 그리스어에 고정했습니다. 이는 번역의 투명성과 추적 가능성을 보장합니다.
  doctrine_reference: 본문비평 원칙 / 정경 외전 전승 비교
