revisions:
- from: 이제 야훼 우리 조상들의 하나님께 고백과 영광을 드리십시오.[a][b]
  to: 이제 우리 조상들의 하나님이신 주께 고백과 영광을 드리십시오.[a][b]
  rationale: ‘야훼’를 그리스어 원문의 직접 대응어인 ‘주’로 고쳐 원문 충실성을 회복했습니다. 또한 ‘우리 조상들의 하나님이신 주’라는 표현으로 κύριος θεὸς τῶν πατέρων ἡμῶν의 호칭 구조를 자연스러운 한국어로 반영했습니다. 나머지 본문과 두 각주는 원문의 의미 및 영어 POB 감사 기록에 부합하므로, 문체만 최소한으로 다듬었습니다.
  reviewer_model: gpt-5.6-terra
