base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/008.yaml
  text: And now give confession and glory to the Lord God of our fathers[b][a],
  footnotes:
  - marker: a
    text: Or 'acknowledgment.' The Greek ὁμολογία can denote confession or acknowledgment; here 'confession' is preferred because the surrounding context is penitential.
    reason: lexical_alternative
  - marker: b
    text: The Greek source for this verse is shorter than the fuller Hebrew parallel in Ezra; this translation follows the Greek wording while using the Hebrew as a contextual check.
    reason: textual_variant
translation:
  language: ko
  text: 이제 우리 조상들의 하나님이신 주께 고백과 영광을 드리십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인정’. 그리스어 ὁμολογία는 ‘고백’이나 ‘인정’을 뜻할 수 있으나, 여기서는 회개의 문맥이므로 ‘고백’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 본문은 에스라서의 더 긴 히브리어 평행본문보다 짧습니다. 이 번역은 그리스어 문구를 따르며, 히브리어 본문은 문맥 확인을 위해서만 참고했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ νῦν
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 지금
  lexicon: LSJ
  rationale: 담화 전환과 시점을 간결하게 살리기 위해 ‘이제’로 옮겼습니다. 이어지는 권면의 흐름을 자연스럽게 연결합니다.
- source_word: δότε
  english_pob_choice: give
  chosen_korean: 드리십시오
  alternatives_korean:
  - 주십시오
  - 바치십시오
  lexicon: LSJ
  rationale: 대상이 하나님이므로 단순한 ‘주다’보다 예배적·경건한 공손 표현인 ‘드리다’가 더 자연스럽고, 합쇼체 명령으로 맞췄습니다.
- source_word: ὁμολογίαν
  english_pob_choice: confession
  chosen_korean: 고백
  alternatives_korean:
  - 시인
  - 인정
  lexicon: LSJ
  rationale: 회개적 문맥에서 죄와 신실하지 못함을 하나님 앞에 드러내는 뜻이 강하므로 ‘고백’이 가장 적절합니다. ‘인정’은 의미가 약하고, ‘시인’은 현대 한국어에서 다소 문어적입니다.
- source_word: δόξαν
  english_pob_choice: glory
  chosen_korean: 영광
  alternatives_korean:
  - 존귀
  - 찬양
  lexicon: LSJ
  rationale: ‘영광을 드리다’는 성경적 관용구를 그대로 살려, 하나님께 돌려드리는 찬미의 성격과 존귀의 의미를 유지했습니다.
- source_word: τῷ κυρίῳ θεῷ τῶν πατέρων ἡμῶν
  english_pob_choice: to the Lord God of our fathers
  chosen_korean: 야훼 우리 조상들의 하나님께
  alternatives_korean:
  - 주 우리 조상들의 하나님께
  - 주 하나님께
  lexicon: LSJ
  rationale: κυρίῳ θεῷ는 본문상 이스라엘의 하나님을 가리키므로 프로젝트 기본어인 ‘야훼’를 사용했습니다. ‘우리 조상들’은 원문의 πατέρων을 보존하며, 관용구의 언약적 뉘앙스를 유지합니다.
theological_decisions:
- issue: ὁμολογίαν의 회개적 의미
  chosen_reading: ‘고백’으로 옮겨 회개와 죄 인정의 뉘앙스를 살립니다.
  alternative_readings:
  - ‘인정’으로 완화
  - ‘찬양’으로 일반화
  rationale: 문맥이 징계와 회개의 권면이므로, 단순한 사실 확인보다 하나님 앞에서의 죄 고백이 더 적합합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3, 4
- issue: κύριος/יהוה의 처리
  chosen_reading: 본문의 하나님 칭호를 ‘야훼’로 직접 옮겼습니다.
  alternative_readings:
  - ‘주’로 일반화
  - ‘여호와’로 전통화
  rationale: 이 절은 이스라엘의 언약 하나님을 가리키는 구약적 호칭이므로, 프로젝트 기본 원칙에 따라 야훼를 사용해 원문 지시 대상을 선명하게 드러냅니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH'
