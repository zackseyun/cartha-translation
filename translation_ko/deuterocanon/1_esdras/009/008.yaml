  verdict: revise
  source_fidelity: 그리스어 καὶ νῦν δότε ὁμολογίαν δόξαν τῷ κυρίῳ θεῷ τῶν πατέρων ἡμῶν은 ‘이제/그리고 이제 … 우리 조상들의 하나님이신 주께 고백과 영광을 드리십시오’라는 뜻입니다. 초안은 ‘고백’과 ‘영광’, 명령의 복수 합쇼체를 적절히 반영했습니다. 그러나 그리스어 본문은 κύριος(‘주’)라고 할 뿐, 이 절 자체에 야훼라는 신명이나 테트라그람마톤이 나타나지 않으므로 ‘야훼’로 특정한 것은 원문보다 해석적으로 나아갑니다.
  naturalness: ‘이제 우리 조상들의 하나님께’도 이해되지만, ‘우리 조상들의 하나님이신 주께’가 한국어에서 더 자연스럽고 κύριος와 θεός의 결합 관계도 분명히 드러냅니다. ‘고백과 영광을 드리십시오’는 현대의 격식 있는 성경 문체에 자연스럽습니다.
  terminology: κύριος는 이 그리스어 본문에 따라 ‘주’로 옮기는 것이 안전합니다. θεὸς τῶν πατέρων ἡμῶν은 ‘우리 조상들의 하나님’으로 보존했습니다. ὁμολογία는 회개 문맥상 ‘고백’이 적절하며, 각주에서 ‘인정’이라는 대안을 제시할 수 있습니다.
