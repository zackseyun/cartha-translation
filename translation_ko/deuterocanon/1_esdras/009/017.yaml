base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/017.yaml
  text: And the matter concerning the men who had taken foreign women was brought to an end by the new moon of the first month[a][b].
  footnotes:
  - marker: a
    text: 'The Greek text here is difficult: the participle can read more literally as ''the men who had been gathered together.'' The Hebrew parallel supports the contextual sense ''the men who had taken foreign women,'' which is followed in the main text.'
    reason: alternative_reading
  - marker: b
    text: '''New moon of the first month'' refers to the first day of the first month in the lunar calendar.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 이방 여자를 맞아들인 남자들에 관한 일은 첫째 달의 초하룻날에 마무리되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 문자적으로 ‘모여진 남자들’로도 읽을 수 있지만, 평행 히브리어 전승이 ‘이방 여자들을 맞아들인 남자들’이라는 문맥을 뒷받침합니다.
    reason: source_note
  - marker: b
    text: ‘첫째 달의 초하룻날’은 음력 달력에서 첫째 달의 첫날을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἦχθη ἐπὶ πέρας
  english_pob_choice: was brought to an end
  chosen_korean: 마무리되었습니다
  alternatives_korean:
  - 끝났습니다
  - 완결되었습니다
  - 종결되었습니다
  lexicon: LSJ
  rationale: 수동적 완료감을 살리면서도 한국어 문맥에서 자연스럽게 들리도록 ‘마무리되었습니다’로 옮겼습니다.
- source_word: τὰ κατὰ τοὺς ἄνδρας
  english_pob_choice: the matter concerning the men
  chosen_korean: 남자들에 관한 일
  alternatives_korean:
  - 그 남자들에 관한 사건
  - 그 남자들에 대한 사안
  - 그 남자들과 관련된 일
  lexicon: LSJ
  rationale: 법정적 조사 문맥을 반영해 ‘관한 일’로 옮기되, 과도하게 해석을 좁히지 않았습니다.
- source_word: γυναῖκας ἀλλογενεῖς
  english_pob_choice: foreign women
  chosen_korean: 이방 여자
  alternatives_korean:
  - 외국 여인
  - 타민족 여자들
  - 다른 민족의 여자들
  lexicon: LSJ
  rationale: 에스라 계열 문맥의 전통적 의미를 유지하면서도, ἀλλογενεῖς의 ‘다른 민족/이방’ 뉘앙스를 분명히 드러냈습니다.
- source_word: ἕως τῆς νουμηνίας τοῦ πρώτου μηνός
  english_pob_choice: by the new moon of the first month
  chosen_korean: 첫째 달의 초하룻날에
  alternatives_korean:
  - 첫째 달의 초하루까지
  - 첫째 달의 신월에
  - 첫째 달의 새달에
  lexicon: LSJ
  rationale: νουμηνία를 달력상의 ‘초하룻날’로 풀어 한국어 독자가 이해하기 쉽게 했습니다.
theological_decisions:
- issue: 본문의 난해한 분사구를 어떻게 반영할지
  chosen_reading: 본문은 ‘이방 여자를 맞아들인 남자들’이라는 문맥적 의미를 본문 본의로 두고 번역했습니다.
  alternative_readings:
  - ‘함께 모인 남자들’로 직역
  - ‘모여든 남자들’로 완역
  rationale: 그리스어 분사형은 문자적으로는 ‘모여진’ 의미가 가능하지만, 평행 전승과 문맥상 이 사건은 이방 여인과의 혼인 문제를 가리키므로 그 의미를 본문에 반영하는 편이 독자 이해에 충실합니다.
  doctrine_reference: 본문비평 및 평행본문 우선 원칙
- issue: 시점 표현의 자연화
  chosen_reading: ‘by the new moon of the first month’를 ‘첫째 달의 초하룻날에’로 자연화했습니다.
  alternative_readings:
  - ‘첫째 달의 새달까지’
  - ‘첫째 달의 신월에’
  rationale: 유대력의 절기 표지를 한국어 달력 감각으로 전달하되, 달의 첫날이라는 문화적 의미를 보존했습니다.
  doctrine_reference: 달력·문화 배경 번역 원칙
