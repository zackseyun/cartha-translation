base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/017.yaml
  text: And the matter concerning the men who had taken foreign women was brought to an end by the new moon of the first month[a][b].
  footnotes:
  - marker: a
    text: 'The Greek text here is difficult: the participle can read more literally as ''the men who had been gathered together.'' The Hebrew parallel supports the contextual sense ''the men who had taken foreign women,'' which is followed in the main text.'
    reason: alternative_reading
  - marker: b
    text: '''New moon of the first month'' refers to the first day of the first month in the lunar calendar.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 이방 여인들을 맞아들인 남자들에 관한 일은 첫째 달 초하루까지 마무리되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 이 부분을 더 문자적으로 ‘함께 모인 남자들’로 읽을 수 있습니다. 평행 히브리어 본문은 문맥상 ‘이방 여인들을 맞아들인 남자들’이라는 의미를 뒷받침하며, 본문은 이 의미를 따릅니다.
    reason: alternative_reading
  - marker: b
    text: ‘첫째 달 초하루’는 음력을 따르는 달력에서 첫째 달의 첫날을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἦχθη ἐπὶ πέρας
  english_pob_choice: was brought to an end
  chosen_korean: 마무리되었습니다
  alternatives_korean:
