base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/053.yaml
  text: And the Levites kept instructing all the people[a], saying, “This day is holy; do not grieve.”
  footnotes:
  - marker: a
    text: Or, “do not be sorrowful” or “do not mourn.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 레위인들은 온 백성에게 계속 이렇게 일렀습니다. “이 날은 거룩합니다. 슬퍼하지 마십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “근심하지 마십시오”, “애통하지 마십시오.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ Λευεῖται
  english_pob_choice: the Levites
  chosen_korean: 레위인들
  alternatives_korean:
  - 레위 사람들
  - 레위 지파 사람들
  lexicon: LSJ
  rationale: 고유 집단명을 한국어 성서 관용에 맞게 옮기되, 직역을 지나치게 풀지 않고 ‘레위인들’로 간결하게 유지했습니다.
- source_word: ἐκέλευον
  english_pob_choice: kept instructing
  chosen_korean: 계속 권하면서
  alternatives_korean:
  - 계속 명하면서
  - 계속 지시하면서
  - 계속 명령하면서
  lexicon: BDAG
  rationale: 미완료시상의 반복·지속을 살리면서도, 공개적 권면의 맥락에서 너무 강압적인 ‘명령’보다 ‘권하다’가 자연스럽고 본문 분위기에 맞습니다.
- source_word: τῷ δήμῳ πάντα
  english_pob_choice: all the people
  chosen_korean: 모든 백성에게
  alternatives_korean:
  - 온 백성에게
  - 모든 사람에게
  - 백성 전체에게
  lexicon: LSJ
  rationale: δήμος의 공적 공동체 의미와 πάντα의 포괄성을 함께 살려, 회중 전체를 가리키는 ‘모든 백성’으로 옮겼습니다.
- source_word: μὴ λυπεῖσθε
  english_pob_choice: do not grieve
  chosen_korean: 슬퍼하지 마십시오
  alternatives_korean:
  - 근심하지 마십시오
  - 마음 아파하지 마십시오
  - 슬퍼하지 말라
  lexicon: BDAG
  rationale: λυπέω의 정서적 의미를 가장 자연스럽게 드러내는 한국어로 ‘슬퍼하다’를 택했고, 합쇼체 명령형으로 공동체에 대한 권면의 어조를 살렸습니다.
theological_decisions:
- issue: 거룩한 날에 대한 공적 권면의 어조
  chosen_reading: ‘이 날은 거룩한 날입니다’와 ‘슬퍼하지 마십시오’로, 백성의 반응을 억누르기보다 예배적 기쁨으로 돌리는 권면을 직접적으로 드러냈습니다.
  alternative_readings:
  - ‘이 날은 성스럽습니다’
  - ‘근심하지 마십시오’
  - ‘애통하지 마십시오’
  rationale: 문맥상 단순한 감정 조절이 아니라 거룩한 날의 의미를 인식하고 공동체가 슬픔 대신 합당한 태도로 응답하도록 이끄는 말이므로, 본문의 정서와 신학적 긴장을 유지했습니다.
  doctrine_reference: 거룩한 시간/날에 대한 성별과 공동체적 응답
