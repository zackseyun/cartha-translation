  source_fidelity: 그리스어 원문은 레위인들이 온 백성에게 반복적으로/계속 지시하거나 권면하면서 ‘이 날은 거룩하다. 슬퍼하지 말라’고 말한 것으로 읽힙니다. 초안은 핵심 의미를 충실히 전달합니다. 다만 ἐκέλευον과 λέγοντες의 결합은 한국어에서 ‘계속 권하면서 말했습니다’보다 ‘계속 이렇게 일렀습니다’로 옮기는 편이 더 자연스럽고, 미완료의 지속성도 보존합니다.
