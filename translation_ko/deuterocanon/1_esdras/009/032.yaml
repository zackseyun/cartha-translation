translation:
  language: ko
  text: 그리고 아난의 아들들 가운데서는 엘리오다스[a], 아사이야, 멜기야, 삽바이야, 그리고 시몬 호사마우스가 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '이 목록의 일부 이름에는 에스라/느헤미야 전승에서 히브리어 병행형이 있습니다(예: 아난/하난, 삽바이야/삽베대). 본문은 1 에스드라스의 그리스어 형태를 따르며, 히브리어 병행 본문은 확인을 위해서만 참조했습니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  english_pob_choice: from the sons of
  chosen_korean: 아들들 가운데서는
  alternatives_korean:
  - 아들들 중에서
  - 아들들로부터
  lexicon: LSJ
  rationale: 계보 목록에서 ἐκ는 소속·출신을 나타내므로, 한국어에서는 자연스러운 목록 도입인 ‘~가운데서는’으로 옮겨 원문의 구성과 유동성을 함께 살렸습니다.
- source_word: Ἀννὰν
  english_pob_choice: Annan
  chosen_korean: 아난
  alternatives_korean:
  - 한난
  - 하난
  lexicon: LSJ
  rationale: 1 Esdras의 그리스어 본문을 주 텍스트로 삼아 음역했고, 마소라 병행 전승의 Hanan형은 주석적 참조에 그칩니다.
- source_word: Ἀσαίας
  english_pob_choice: Asaiah
  chosen_korean: 아사이야
  alternatives_korean:
  - 아사이아
  - 아사야
  lexicon: LSJ
  rationale: 그리스어 -ίας를 한국어 이름형으로 옮기되, 히브리계 이름에서 익숙한 -야 종결을 반영해 읽기 쉬운 형태로 처리했습니다.
- source_word: Σαββαίας
  english_pob_choice: Sabbaias
  chosen_korean: 삽바이야
  alternatives_korean:
  - 사바이야
  - 삽바이아
  lexicon: LSJ
  rationale: 그리스어 자모를 최대한 가깝게 살리면서도 한국어 음운에 맞게 옮겼으며, 히브리 대응형으로의 과도한 정규화는 피했습니다.
- source_word: Χοσάμαος
  english_pob_choice: Chosamaus
  chosen_korean: 호사마우스
  alternatives_korean:
  - 초사마우스
  - 호사마오스
  lexicon: LSJ
  rationale: 이름이 난해하므로, 영어 POB의 투명한 음역을 참고하되 한국어 표기에서는 그리스어 어형을 따라 최대한 직역적 음역으로 유지했습니다.
