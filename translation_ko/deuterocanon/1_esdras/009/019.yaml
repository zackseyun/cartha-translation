base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/019.yaml
  text: 'From the sons of Jeshua son of Jozadak and his brothers: Maelas[a], Eleazar, Joribus, and Joadanus.'
  footnotes:
  - marker: a
    text: The Greek text here gives the names Maelas, Joribus, and Joadanus. In the approximate Hebrew parallel at Ezra 10:18, 20–21, the corresponding names differ, reflecting the freer relationship between 1 Esdras and the MT in these lists.
    reason: textual_variant
translation:
  language: ko
  text: 여호사닥의 아들 예수아와 그의 형제들의 아들들 가운데서는 마엘라스[a], 엘르아살, 요리보스, 요아다노스가 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 마엘라스, 요리보스, 요아다노스라는 이름을 전합니다. 에스라 10:18, 20–21의 대략적인 히브리어 평행본문에서는 이에 대응하는 이름들이 다릅니다. 이는 1 에스드라와 마소라 본문의 이 명단들이 비교적 자유로운 관계에 있음을 반영합니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  english_pob_choice: From the sons of
  chosen_korean: 아들들 가운데서
  alternatives_korean:
  - 아들들 중에서
  - 아들들로부터
  lexicon: LSJ
  rationale: ἐκ은 목록 안에서의 출처·범주를 나타내므로, 한국어에서는 자연스럽고 문맥에 맞는 ‘가운데서’로 옮겨 리스트 도입 기능을 살렸습니다.
- source_word: Ἰησοῦ
  english_pob_choice: Jeshua
  chosen_korean: 예수
  alternatives_korean:
  - 여호수아
  - 예수아
  lexicon: LSJ
  rationale: 이 절의 인물은 후기 제사장 예수아/여호수아 계열을 가리키지만, 한국어 본문에서는 영어 POB의 ‘Jeshua’에 직접 대응하는 표준 음역을 찾기 어려워, 고유명 자체를 그대로 옮기되 본문 맥락상 통용되는 음역형을 사용했습니다.
- source_word: τοῦ Ἰωσεδὲκ
  english_pob_choice: son of Jozadak
  chosen_korean: 여호사닥의 아들
  alternatives_korean:
  - 요세닥의 아들
  - 요사닥의 아들
  lexicon: LSJ
  rationale: γον. 소유격은 계보 관계를 표시하므로 ‘~의 아들’로 옮겼고, Ἰωσεδὲκ은 히브리어 평행본문에 맞는 통용형 여호사닥을 채택했습니다.
- source_word: τῶν ἀδελφῶν αὐτοῦ
  english_pob_choice: and his brothers
  chosen_korean: 그의 형제들인
  alternatives_korean:
  - 그리고 그의 형제들
  - 그의 아우들인
  lexicon: LSJ
  rationale: ἀδελφοί는 이 계보 목록에서 남성 형제들을 가리키며, 문맥상 나열되는 이름들을 수식하는 관형적 표현으로 처리하는 것이 자연스럽습니다.
- source_word: Μαεήλας
  english_pob_choice: Maelas
  chosen_korean: 마엘라스
  alternatives_korean:
  - 마에엘라스
  - 마엘라
  lexicon: LSJ
  rationale: 스웨테 그리스어 본문에 전해지는 이름형을 그대로 음역해, 1 Esdras의 명단이 MT 평행본문과 다를 수 있다는 본문 전승을 보존했습니다.
- source_word: Ἐλεάζαρος
  english_pob_choice: Eleazar
  chosen_korean: 엘르아살
  alternatives_korean:
  - 엘르아자르
  - 엘레아살
  lexicon: LSJ
  rationale: 성경에서 널리 쓰이는 엘르아살을 채택해 한국어 독자에게 익숙하면서도 원형을 유지했습니다.
- source_word: Ἰώριβος
  english_pob_choice: Joribus
  chosen_korean: 요리보스
  alternatives_korean:
  - 요리브
  - 요리보
  lexicon: LSJ
  rationale: 그리스어 표기 Ἰώριβος를 직접 음역해, 히브리 평행본문의 Jarib과 혼합하지 않고 그리스 본문 자체를 반영했습니다.
- source_word: Ἰωάδανος
  english_pob_choice: Joadanus
  chosen_korean: 요아다노스
  alternatives_korean:
  - 요아다누스
  - 요아단
  lexicon: LSJ
  rationale: 그리스어 전승의 이름형을 그대로 음역해 본문상의 이름 목록을 보존했습니다.
theological_decisions:
- issue: 1 Esdras 이름 목록과 평행 본문(Ezra 10)의 차이 처리
  chosen_reading: 본문의 그리스어 이름형을 본문에 그대로 두고, 평행 전승의 차이는 본문 밖 주석 문제로 남깁니다.
  alternative_readings:
  - 히브리 평행본문의 이름들로 조화시키기
  - 한국어 독자를 위해 익숙한 에스라 본문명으로 바꾸기
  rationale: 이 절은 계보적 명단이므로 텍스트 전승의 차이를 평준화하면 1 Esdras의 독자적 증언을 지워 버립니다. 그리스어 본문을 우선하여 보존하는 것이 해석상 더 정직합니다.
  doctrine_reference: 본문비평 / 전승사
