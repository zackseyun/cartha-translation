base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/012.yaml
  text: not in two days, for we have sinned greatly in these matters. But let the leaders of the multitude stand, and let all those from our settlements who have foreign wives come at an appointed time,
  footnotes:
  - marker: a
    text: Greek literally, 'not even two'; the sense is 'not in two days,' i.e., the matter cannot be finished so quickly.
    reason: lexical_alternative
  - marker: b
    text: Or 'towns' for 'settlements.' The Greek refers to the communities where the people lived.
    reason: lexical_alternative
  - marker: c
    text: The final Greek phrase is compressed ('having taken time'); the sense is that each case should come forward at a fixed or appointed time. The Hebrew parallel likewise points to scheduled appearances.
    reason: alternative_reading
translation:
  language: ko
  text: 이틀 안에도 안 됩니다. 우리가 이 일들에서 크게 죄를 지었기 때문입니다. 그러나 무리의 지도자들은 서게 하십시오. 그리고 우리 거처들 가운데서 외국 여자들을 아내로 둔 사람들은 모두 정해진 때에 나오게 하십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘둘도 아니’에 가깝지만, 문맥상 ‘이틀 안에도’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: κατοικίαι는 개인의 집이 아니라 사람들이 사는 공동체나 거주지를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 구절은 압축된 표현으로, 각 사람이 정해진 시각에 나오라는 뜻입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ δύο
  english_pob_choice: not in two days
  chosen_korean: 이틀 안에도 안 됩니다
  alternatives_korean:
