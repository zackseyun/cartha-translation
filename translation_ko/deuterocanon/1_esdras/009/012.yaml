- issue: 죄의 성격을 완화하지 않는 번역
  chosen_reading: 우리가 이 일들에서 크게 죄를 지었습니다
  alternative_readings:
  - 우리가 이 일에서 많이 잘못했습니다
  - 우리가 이 일들에서 크게 잘못했습니다
  rationale: 그리스어 ἡμάρτομεν은 일반적인 ‘죄를 짓다’이므로, 외국 여자와의 혼인을 둘러싼 언약 위반을 단순한 절차상 문제로 약화시키지 않도록 했습니다.
