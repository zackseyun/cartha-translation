  - 우리 거주지들 가운데서
  lexicon: LSJ
  rationale: κατοικίαι는 개인의 집보다 사람들이 사는 공동체/거처를 가리키므로, 행정적 문맥을 살려 집단적 거주지를 뜻하게 했습니다.
