  source_fidelity: ‘이틀 안에도’는 그리스어의 ‘이틀’이라는 타원적 시간 표현에 ‘안에’를 보태어 완료 기한의 뉘앙스를 다소 좁힙니다. ‘이틀로도 안 됩니다’가 문맥상 앞선 제안(하루나 이틀)을 받으면서도 원문의 압축성을 더 잘 보존합니다. 또한 ἀλλογενεῖς는 현대 국가를 뜻하는 ‘외국’보다 다른 민족/집단 출신이라는 뜻에 가깝습니다. στήτωσαν은 지도자들이 직접 나서거나 서도록 하라는 행정적 지시로 옮겼습니다.
  naturalness: 초안의 ‘우리 거처들 가운데서’는 사람을 수식하는 말로 다소 부자연스럽고, ‘이 일들에서’도 현대 한국어에서는 어색합니다. ‘우리 거주지들에 사는’, ‘이러한 일들에서’로 다듬었습니다. 각주 표지는 해당 어구 바로 뒤에 배치했습니다.
  terminology: ἡμάρτομεν의 종교·도덕적 의미는 ‘죄를 지었습니다’로 유지했습니다. γυναῖκας ἀλλογενεῖς는 본문의 역사적 분류를 현대적으로 과도하게 완화하지 않되, ‘다른 민족 출신 여자들’로 원어의 민족적 범주를 정확히 드러냈습니다.
