  english_pob_choice: at an appointed time
  chosen_korean: 정해진 때에
  alternatives_korean:
  - 정해진 시간에
  - 기한을 받아
  - 지정된 때에
  lexicon: LSJ
  rationale: 그리스어는 압축되어 있으나 각 사례가 일정한 때에 나오게 하라는 행정적 의미이므로, 자연스러운 한국어 관용으로 반영했습니다.
