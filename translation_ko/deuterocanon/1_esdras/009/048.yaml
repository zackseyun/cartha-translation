base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/048.yaml
  text: Jeshua and Anniuth and Sherebiah[a], Jadinus, Jarsubus, Abteus, Autaias, Maiannas and Kelitas, Azariah, Katezabdus, Annas, Phalias—the Levites—
  footnotes:
  - marker: a
    text: Several names in this verse are textually uncertain in the Greek witness, and some may correspond to the Levite list in Nehemiah 8:7 (for example, Shabbethai, Hodiah, Maaseiah, and others). The main text preserves a mostly Greek-based form unless the Hebrew parallel is especially strong.
