translation:
  language: ko
  text: 예수아와 아니웃과 스레뱌[a], 야디누스, 야르수부스, 압테우스, 아우타이아스, 마이안나스와 켈리타스, 아사랴, 카테즈압두스, 안나스, 팔리아스—이들은 레위 사람들이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '이 절의 몇몇 이름은 헬라어 사본 전승에서 본문상 불확실하며, 그중 일부는 느헤미야 8:7의 레위인 명단(예: 삽브대, 호디야, 마아세야 등)과 대응할 수도 있습니다. 본문은 히브리어 병행본문의 대응이 특히 강한 경우를 제외하고는 대체로 헬라어 형태를 보존했습니다.'
    reason: textual_variant
lexical_decisions:
- source_word: Ἰησοῦς
  english_pob_choice: Jeshua
  chosen_korean: 예수아
  alternatives_korean:
  - 여호수아
  - 예수
  lexicon: Greek proper-name tradition / MT parallel
  rationale: 이 문맥은 에스라-느헤미야 계열 인명 목록이므로, 헬라어 μορφή를 따르되 해당 인물의 히브리어형 이름을 반영하는 음역이 필요합니다. 한국어 성경에서 통용되는 역사적 인명 음역을 고려해 예수아로 옮겼습니다.
- source_word: Σαραβίας
  english_pob_choice: Sherebiah
  chosen_korean: 셀레뱌
  alternatives_korean:
  - 세레비야
  - 셔레비야
  lexicon: Greek proper-name tradition / MT parallel
  rationale: 영어 POB가 느헤미야 8:7의 대응 인물로 Sherebiah를 채택한 점을 반영해, 히브리어형 인명으로 옮겼습니다. 헬라어 표기보다 정체성 식별이 더 중요하므로 한국어도 서기관 전승에 맞는 형태를 택했습니다.
- source_word: Κατέθζαβδος
  english_pob_choice: Katezabdus
  chosen_korean: 카테즈압두스
  alternatives_korean:
  - 요자밧
  - 카테즈밥두스
  lexicon: Greek proper-name tradition
  rationale: 이 이름은 전승상 크게 불안정하고, 헬라어 자체가 혼란스러운 형태입니다. 본문은 과도한 정규화보다 헬라어 기반의 보수적 음역을 유지하는 것이 원문 추적에 유리합니다.
- source_word: οἱ Λευεῖται
  english_pob_choice: the Levites
  chosen_korean: 레위 사람들
  alternatives_korean:
  - 레위인들
  - 레위 지파 사람들
  lexicon: LSJ
  rationale: 목록 전체가 레위인을 가리킨다는 점을 한국어에서 자연스럽고 분명하게 드러내기 위해 ‘레위 사람들’로 옮겼습니다. 직역형 ‘레위인들’도 가능하지만, 본문은 명단의 식별 기능이 핵심입니다.
theological_decisions:
- issue: 인명 목록의 불확실한 대응 관계
  chosen_reading: 헬라어 본문을 기본 축으로 두되, 본문이 보존한 이름의 불안정성은 평탄화하지 않고 음역으로 드러냈습니다.
  alternative_readings:
  - 히브리어 병행본문의 확정형으로 전면 치환
  - 전부 한국어 교회식 정착형 이름으로 통일
  rationale: 이 절은 교리 진술이 아니라 전승 불안정성이 큰 명단입니다. 따라서 확정되지 않은 이름을 임의로 조화시키기보다, 본문이 가진 불확실성을 보존하는 것이 더 충실합니다.
  doctrine_reference: 본문비평 / 정경 병행본문 처리
