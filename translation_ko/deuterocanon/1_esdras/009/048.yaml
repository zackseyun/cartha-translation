    issue: Ἄννας를 ‘한난’으로 번역함
    rationale: ‘한난’은 병행 히브리어 명단에 맞춘 조화로 보이나, 주된 헬라어 본문은 Ἄννας이며 영어 POB도 Annas로 보존합니다. 불확실한 명단을 병행 본문으로 평탄화하지 않아야 합니다.
