    rationale: ‘바르야’는 헬라어 Φαλίας 및 영어 POB Phalias와 대응하지 않습니다. 이는 병행 명단에 따른 추정적 치환으로 보이며, 원문 우선 원칙에 어긋납니다.
  - severity: medium
    issue: Ἀβταῖος를 ‘압드에우스’로 음역함
    rationale: 원어 이름에는 ‘드’에 해당하는 자음이 없습니다. 영어 POB의 Abteus에 맞추어 ‘압테우스’로 고치면 불필요한 자음 삽입을 피할 수 있습니다.
  - severity: low
