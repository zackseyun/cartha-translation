  lexicon: LSJ
  rationale: ‘앉다’의 구체적 이미지를 유지하되, 앞뒤 문맥에 맞게 지속 상태를 나타내는 표현으로 옮겼습니다.
- source_word: ἐν τῇ εὐρυχώρῳ τοῦ ἱεροῦ
  english_pob_choice: in the open court of the temple
  chosen_korean: 성전의 넓은 뜰
  alternatives_korean:
  - 성전의 열린 뜰
  - 성전의 넓은 공간
  lexicon: LSJ
  rationale: εὐρυχώρῳ는 넓고 열린 공간을 가리키므로 ‘뜰’로 옮겨 성전 परिसर 안의 개방된 장소라는 감각을 살렸습니다.
- source_word: τὸν ἐνεστῶτα χειμῶνα
  english_pob_choice: because of the present storm
  chosen_korean: 닥쳐온 폭풍
  alternatives_korean:
  - 그때 닥친 겨울 폭풍
  - 현재의 폭풍
  lexicon: LSJ
  rationale: χειμών은 ‘겨울’보다 ‘폭풍/거친 날씨’의 뜻이 문맥에 더 잘 맞아, 떨고 있는 원인을 분명히 드러내는 표현을 택했습니다.
theological_decisions:
- issue: χειμών의 의미 범위
  chosen_reading: 이 구절에서는 ‘겨울’보다 ‘폭풍/거친 날씨’로 읽어, 사람들이 추위보다 날씨 자체 때문에 떨고 있는 장면을 반영했습니다.
  alternative_readings:
  - 겨울
  - 겨울 날씨
  rationale: 성전 뜰에 모여 앉아 떨고 있다는 상황은 계절 명칭보다 현재 닥친 악천후를 가리키는 것으로 이해하는 편이 자연스럽습니다.
  doctrine_reference: 문맥 우선 원칙
