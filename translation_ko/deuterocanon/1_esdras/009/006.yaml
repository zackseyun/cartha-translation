  lexicon: LSJ
  rationale: 공동으로 모인 사람들의 집합을 자연스럽게 드러내면서도, 단순한 군중보다 예배 공간의 집회성을 살립니다.
- source_word: συνεκάθισαν
  english_pob_choice: sat together
  chosen_korean: 함께 앉아 있었습니다
  alternatives_korean:
