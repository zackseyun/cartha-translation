base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/043.yaml
  text: And Mattathias[a], Sammou, Ananias, Azarias, Ourias, Ezekias, and Baalsamos stood at his right hand,
  footnotes:
  - marker: a
    text: The Greek names here differ from the approximate Hebrew parallel in Nehemiah 8:4, where the list of men at Ezra's right hand is not identical. Because 1 Esdras is translated from the Greek witness, the Greek name forms are retained.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 마타디아스, 삼무, 아나니아스, 아자리아스, 우리아스, 에제키아스, 바알사모스가 그의 오른쪽에 섰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 이름들은 네헤미야 8:4의 대략적인 히브리어 평행본문과 다릅니다. 1 에스라는 그리스어 증인을 따라 번역하므로, 여기서는 그리스어 이름 형식을 유지합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστησεν
  english_pob_choice: stood
  chosen_korean: 섰습니다
  alternatives_korean:
  - 세웠습니다
  - 자리를 잡고 섰습니다
  lexicon: LSJ
  rationale: 형태는 사역적이지만, 문맥상 이들은 에스라의 오른쪽에 자리한 상태를 가리키므로 한국어에서는 자연스럽게 ‘섰습니다’로 옮기는 것이 소스 의미를 잘 드러냅니다.
- source_word: αὐτῷ
  english_pob_choice: his
  chosen_korean: 그의
  alternatives_korean:
  - 그에게
  - 그를 위하여
  lexicon: LSJ
  rationale: 여격 관계를 한국어에서는 소유/근접 표현으로 풀어 ‘그의 오른쪽에’라고 옮기면 위치 관계가 가장 자연스럽게 전달됩니다.
- source_word: ἐκ δεξιῶν
  english_pob_choice: at his right hand
  chosen_korean: 오른쪽에
  alternatives_korean:
  - 오른편에
  - 오른손 편에
  lexicon: LSJ
  rationale: 관용적 위치 표현이므로 ‘오른쪽에’로 옮겨도 원문의 구체적 공간 의미를 충분히 보존합니다.
- source_word: Ματταθίας, Σαμμοῦ, Ἀνανίας, Ἀζαρίας, Οὐρείας, Ἐζεκίας, Βαάλσαμος
  english_pob_choice: Mattathias, Sammou, Ananias, Azarias, Ourias, Ezekias, and Baalsamos
  chosen_korean: 마타디아스, 삼무, 아나니아스, 아자리아스, 우리아스, 에제키아스, 바알사모스
  alternatives_korean:
  - 맛다디아스, 사무, 아나니야, 아사랴, 우리야, 히스기야, 바알사모스
  lexicon: 고유명사 표기
  rationale: 1 에스라는 그리스어 본문을 직접 따라가므로, 히브리어 평행본문의 대응명보다 그리스어 음역형을 기준으로 한국어 표기를 옮겼습니다.
theological_decisions:
- issue: 1 Esdras의 그리스어 고유명사 전승을 MT 평행본문보다 우선할지 여부
  chosen_reading: 본문의 인명은 네헤미야의 히브리어 평행본문에 맞추지 않고 그리스어 형식을 유지했습니다.
  alternative_readings:
  - 히브리어 평행본문에 맞춘 정규화된 이름 사용
  rationale: POB 원칙상 1 에스라는 그리스어 증인을 본문 번역의 1차 기준으로 삼아야 하며, 평행본문은 장면 확인용 참고로만 두는 것이 가장 투명합니다.
  doctrine_reference: source fidelity / textual criticism
