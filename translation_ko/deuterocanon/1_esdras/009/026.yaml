translation:
  language: ko
  text: 이스라엘 가운데서, 포로스의 아들들 가운데서는 예르마와 예지아스와 멜케이아스와 미엘로스와 엘레아자르와 아세베이아스와 반나이아스가 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 여러 인명은 에스라 10장의 병행 목록에 보이는 히브리어 이름형과 대응될 가능성이 큽니다. 예를 들어 포로스는 파로스에, 반나이아스는 브나야에 대응할 수 있습니다. 그러나 1 에스드라서는 그리스어 본문을 기준으로 번역하므로, 본문에는 그리스어 이름형을 유지했습니다.
    reason: alternative_reading
