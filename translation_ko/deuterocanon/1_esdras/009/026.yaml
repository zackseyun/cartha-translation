base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/026.yaml
  text: 'From Israel[a], from the sons of Phoros: Jerma and Jezias and Melcheias and Mielos and Eleazar and Asebeias and Bannaias.'
  footnotes:
  - marker: a
    text: Several names in this verse likely correspond to Hebrew name-forms known from the parallel list in Ezra 10, such as Parosh for Phoros and Benaiah for Bannaias. Because 1 Esdras is translated here from its Greek text, the Greek name-forms are retained in the main text.
    reason: alternative_reading
translation:
  language: ko
  text: '이스라엘에서, 포로스의 아들들 가운데서는: 예르마와 예지아와 멜케이아와 미엘로스와 엘레아자르와 아세베이아와 반나이아였습니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 여러 인명은 에스라 10장의 병행 목록에 보이는 히브리어 이름형과 대응될 가능성이 큽니다. 그러나 1 에스드라서는 그리스어 본문을 기준으로 번역하므로, 본문에는 그리스어 이름형을 유지했습니다.
    reason: textual_variant
