    rationale: ‘이스라엘에서, 포로스의 아들들 가운데서는:’ 뒤에 ‘였습니다’를 붙인 형태는 한국어 문장으로 다소 어색합니다. ‘가운데서 … 있었습니다’가 출처·소속을 나타내는 명단 문맥에 자연스럽습니다.
