base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/011.yaml
  text: But the people are many[a], and it is the rainy season, and we are not able to stand outside[b]; and this is not a task of one day.
  footnotes:
  - marker: a
    text: The Greek text here contains a difficult clause, 'and not we found' (καὶ οὐχ εὕρομεν), whose sense is uncertain in this context. The translation follows the verse's clear overall meaning, supported by the Hebrew parallel in Ezra 10:13.
    reason: textual_variant
  - marker: b
    text: Or, more literally, 'it is a wintry season.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 백성은 매우 많고, 지금은 겨울철[b]이어서 우리는 바깥에 서 있을 수 없으며[a], 이 일은 하루 만에 끝낼 일이 아닙니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문에는 문맥상 뜻이 불분명한 구절 ‘그리고 우리는 찾지 못했습니다’(καὶ οὐχ εὕρομεν)가 있습니다. 번역은 절의 분명한 전체 의미를 따랐고, 에스라 10:13의 히브리어 평행본문도 이를 뒷받침합니다.
    reason: textual_variant
  - marker: b
    text: 직역하면 ‘겨울철’ 또는 ‘겨울 같은 때’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πλῆθος πολὺ
  english_pob_choice: the people are many
  chosen_korean: 백성은 매우 많고
  alternatives_korean:
  - 사람들이 매우 많고
  - 무리가 매우 많고
  lexicon: LSJ
  rationale: 집합적 다수의 뜻을 살려 ‘백성’으로 옮기고, πολὺ는 자연스러운 강조인 ‘매우’로 처리했습니다.
- source_word: ὥρα χειμερινή
  english_pob_choice: it is the rainy season
  chosen_korean: 날씨는 겨울철이어서
  alternatives_korean:
  - 장마철이어서
  - 겨울철이라
  - 추운 계절이어서
  lexicon: LSJ
  rationale: 직역하면 ‘겨울철/겨울 같은 때’이지만, 문맥상 바깥에서 오래 서 있기 어려운 기상 조건을 가리키므로 한국어로는 중립적이고 본문에 충실한 ‘겨울철이어서’로 옮겼습니다.
- source_word: οὐκ ἰσχύσομεν στῆναι αἴθριοι
  english_pob_choice: we are not able to stand outside
  chosen_korean: 우리는 바깥에 서 있을 수 없으며
  alternatives_korean:
  - 우리는 노천에 설 수 없으며
  - 우리는 밖에서 버틸 수 없으며
  lexicon: LSJ
  rationale: ἰσχύσομεν은 능력/견딤을, αἴθριοι는 노출된 야외 상태를 뜻하므로 ‘바깥에 서 있을 수 없다’는 표현이 자연스럽게 그 의미를 전달합니다.
- source_word: τὸ ἔργον ἡμῖν οὐκ ἔστιν ἡμέρας μιᾶς
  english_pob_choice: this is not a task for one day
  chosen_korean: 이 일은 하루 만에 끝낼 일이 아닙니다
  alternatives_korean:
  - 이 일은 하루짜리 일이 아닙니다
  - 이 일은 하루에 끝날 일이 아닙니다
  lexicon: LSJ
  rationale: ἔργον은 여기서 ‘일/과업/사안’의 뜻으로 쓰였고, ἡμέρας μιᾶς는 시간 제약을 나타내므로 ‘하루 만에 끝낼 일’로 풀어 자연스럽고 분명하게 했습니다.
theological_decisions:
- issue: 전승상 어려운 그리스어 구절의 처리
  chosen_reading: καὶ οὐχ εὕρομεν은 본문 흐름이 불분명하여 본문 핵심 의미를 해치지 않는 범위에서 별도로 끌어오지 않고 번역문에서 드러내지 않았습니다.
  alternative_readings:
  - ‘그리고 우리는 찾지 못했습니다’처럼 문자적으로 반영하는 읽기
  - 헬라어를 그대로 따라 다소 불분명한 한국어로 옮기는 읽기
  rationale: 이 절의 핵심은 사람의 많음과 겨울철이라는 조건 때문에 하루 안에 일을 마칠 수 없다는 점이며, 난해한 절차적 문구는 문맥과 평행본문이 확인하는 확실한 의미를 흐리면 안 됩니다.
  doctrine_reference: '1 Esdras parallel-text handling: Greek primacy with transparent documentation of difficult clauses'
