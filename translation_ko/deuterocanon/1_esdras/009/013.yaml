  source_fidelity: 현 초안의 ‘장로들과 재판관들을 세워’는 주어진 그리스어 조각에 없는 임명·설치 행위를 명시합니다. 이 절은 앞절에 의존하는 단편이므로, 앞절에서 함축된 절차 참여를 최소한으로 이어 주되 ‘세우다’는 피하는 것이 안전합니다. 또한 τοῦ πράγματος τούτου는 주님의 분노가 생긴 사안을 가리키므로 ‘이 일로 인한’이 자연스럽고 정확합니다.
  naturalness: ‘…세워, …때까지 하십시오’는 목적어와 명령 종결이 겹쳐 현대 한국어로 어색합니다. ‘…도 함께 참여하게 하여, …까지 그렇게 하십시오’는 합쇼체를 유지하면서 앞절에 의존하는 문장 조각을 자연스럽게 보완합니다.
