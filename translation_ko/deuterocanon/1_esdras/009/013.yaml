translation:
  language: ko
  text: 각 지역의 장로들과 재판관들을 세워, 이 일로 말미암아 주님의 분노가 우리에게서 돌이켜질 때까지 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 분노가 이 일에 대해 우리에게서 돌이켜질 때까지’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절의 그리스어는 앞절의 명령을 이어 받는 문장 조각입니다. 한국어에서는 자연스럽게 완결된 문장으로 풀었습니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἑκάστου τόπου
  english_pob_choice: of each place
  chosen_korean: 각 지역의
  alternatives_korean:
  - 각 곳의
  - 모든 지역의
  - 각 마을의
  lexicon: LSJ
  rationale: 분배적 의미를 살리면서도 τόπος를 과도하게 ‘마을’로 좁히지 않기 위해 ‘각 지역의’로 옮겼습니다.
- source_word: πρεσβυτέρους
  english_pob_choice: elders
  chosen_korean: 장로들
  alternatives_korean:
  - 노인들
  - 원로들
  - 지도자들
  lexicon: LSJ
  rationale: 행정·사법적 문맥에서 연장자 일반보다 지역의 공적 대표를 가리키므로 ‘장로들’이 가장 직접적입니다.
- source_word: κριτάς
  english_pob_choice: judges
  chosen_korean: 재판관들
  alternatives_korean:
  - 판사들
  - 심판관들
  - 판관들
  lexicon: LSJ
  rationale: 법정적 기능을 분명히 드러내면서도 현대 한국어에서 자연스러운 행정·사법 용어인 ‘재판관들’을 택했습니다.
- source_word: ὀργὴν Κυρίου
  english_pob_choice: the anger of the Lord
  chosen_korean: 주님의 분노
  alternatives_korean:
  - 주님의 진노
  - 주님의 노여움
  - 주님의 غض
  lexicon: LSJ
  rationale: ὀργή는 하나님의 엄중한 분노를 뜻하므로 의미를 약화하지 않으면서도 현대 한국어에서 읽기 자연한 ‘분노’를 사용했습니다.
- source_word: ἕως τοῦ λῦσαι ... ἀφʼ ἡμῶν
  english_pob_choice: until ... is turned away from us
  chosen_korean: …돌이켜질 때까지
  alternatives_korean:
  - …제거될 때까지
  - …풀릴 때까지
  - …거두어질 때까지
  lexicon: LSJ
  rationale: λῦσαι를 문자적으로 ‘풀다’로 옮기면 분노와의 결합이 어색하므로, 분노가 ‘돌이켜지다’는 한국어 표현으로 위협이 해소되는 종결점을 살렸습니다.
- source_word: τοῦ πράγματος τούτου
  english_pob_choice: over this matter / concerning this matter
  chosen_korean: 이 일로 말미암아
  alternatives_korean:
  - 이 문제 때문에
  - 이 일에 관하여
  - 이 사건으로
  lexicon: LSJ
  rationale: genitive 구문이 이 사안이 여호와의 분노의 원인임을 나타내므로, 원인 관계를 자연스럽게 드러내는 ‘이 일로 말미암아’로 옮겼습니다.
theological_decisions:
- issue: κύριος의 번역과 신적 경외성 유지
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 야훼
  - 주인
  rationale: 이 절의 κύριος는 이스라엘의 하나님을 가리키며, 한국어에서는 경외를 담는 ‘주님’이 가장 자연스럽고 POB 기본값과도 부합합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → Lord/주님'
- issue: 분노/진노의 강도 표현
  chosen_reading: 분노
  alternative_readings:
  - 진노
  - 노여움
  rationale: 하나님의 심판적 감정을 분명히 드러내되, 현대 문체에서 지나치게 고어적이지 않도록 ‘분노’를 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §6
