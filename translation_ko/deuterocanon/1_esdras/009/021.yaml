lexical_decisions:
- source_word: ἐκ τῶν υἱῶν Ἐμὴρ
  english_pob_choice: And from the sons of Emer
  chosen_korean: “에멜의 아들들 가운데서는”
  alternatives_korean:
  - “에멜의 아들들 중에서”
  - “에멜의 아들들에게서”
  lexicon: ἐκ + gen.; υἱοί
  rationale: ἐκ의 출처/소속 감각을 살려 ‘가운데서는’으로 옮겨, 단순 목록 시작이 아니라 집단 안에서 나온 인물들임을 드러냈습니다.
- source_word: Ἀνανίας, Ζαβδαῖος, Μάνης, Θαμαῖος, Ἰερεὴλ, Ἀζαρίας
  english_pob_choice: Ananias, Zabdaios, Manes, Thamaios, Jerel, and Azarias
  chosen_korean: 아나니아스, 잡다이오스, 마네스, 타마이오스, 예렐, 아자리아스
  alternatives_korean:
