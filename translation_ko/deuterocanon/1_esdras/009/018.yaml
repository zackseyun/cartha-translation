  text: And among the priests there were found some who had taken foreign women[a].
  footnotes:
  - marker: a
    text: Greek literally, 'the ones gathered together, having foreign women.' The wording is somewhat awkward in the transmitted text; the Hebrew parallel supports the sense 'those who had taken foreign women.'
