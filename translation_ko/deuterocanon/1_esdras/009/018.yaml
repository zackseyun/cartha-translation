translation:
  language: ko
  text: 그리고 제사장들 가운데 이방 여자를 둔 자들이 발견되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 직역하면 ‘함께 모인 자들, 이방 여자를 가진 자들’입니다. 전승된 문구는 다소 어색하며, 히브리어 평행 본문은 이를 ‘이방 여자를 취한 자들’로 이해하도록 뒷받침합니다.
    reason: source_note
lexical_decisions:
- source_word: εὑρέθησαν
  english_pob_choice: there were found
  chosen_korean: 발견되었습니다
  alternatives_korean:
  - 있었습니다
  - 찾아내었습니다
  lexicon: LSJ
  rationale: 수동 형태와 공식적인 조사·발견의 뉘앙스를 살리기 위해 「발견되었습니다」로 옮겼습니다.
- source_word: τῶν ἱερέων
  english_pob_choice: among the priests
  chosen_korean: 제사장들 가운데서
  alternatives_korean:
  - 제사장들 중에서
  - 제사장들 가운데
  lexicon: LSJ
  rationale: 부분적 소속을 나타내는 속격을 자연스럽게 살려, 발견된 이들이 제사장 집단 안에서 나온 인물들이라는 뜻을 분명히 했습니다.
- source_word: οἱ ... ἔχοντες
  english_pob_choice: some who had taken
  chosen_korean: 이방 여자를 데리고 있는 자들
  alternatives_korean:
  - 이방 여자를 가진 자들
  - 이방 여자를 취한 자들
  - 이방 여자를 아내로 맞이한 자들
  lexicon: LSJ
  rationale: 직역하면 단순히 「가지고 있는」이지만, 문맥상 부부 관계를 가리키는 표현이므로 자연스럽게 관계의 소유 상태를 드러내는 표현을 택했습니다.
- source_word: ἀλλογενεῖς γυναῖκας
  english_pob_choice: foreign women
  chosen_korean: 이방 여자
  alternatives_korean:
  - 외국 여자
  - 낯선 여자
  - 타민족 여자
  lexicon: LSJ
  rationale: ἀλλογενής의 핵심은 다른 민족/혈통에 속한 이라는 뜻이므로, 한국어 성경 문맥에서 이해하기 쉬운 「이방 여자」를 선택했습니다.
theological_decisions:
- issue: 1 Esdras의 그리스어 전승이 마소라 본문과 어순·표현에서 어긋나는 점을 어떻게 반영할 것인가
  chosen_reading: 그리스어 본문을 따라 핵심 진술만 간결하게 옮기되, 「데리고 있는」으로 관계의 실재를 드러냈습니다.
  alternative_readings:
  - 마소라 본문을 따라 「아내를 맞이한 자들」로 구체화하기
  - 그리스어를 더 직역해 「이방 여자를 가진 자들」로 옮기기
  rationale: 이 절은 전승상 다소 불완전한 그리스어를 가지므로, 본문이 명시하는 사실은 유지하되 MT가 확인하는 혼인 관계를 과도하게 도입하지 않는 번역이 적절합니다.
  doctrine_reference: 1 Esdras 9:18 source alignment with Greek primary text and MT parallel
