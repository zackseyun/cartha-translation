  - 모두가 섰습니다
  - 모두가 곧게 섰습니다
  - 모두가 반듯이 섰습니다
  lexicon: BDAG
  rationale: ὀρθοί의 ‘곧바른, 똑바른’ 뉘앙스를 살려 단순한 ‘섰다’보다 자세의 엄정함과 경건한 태도를 드러냈습니다.
- source_word: Ἀζαρίας
  english_pob_choice: Azarias
  chosen_korean: 아사랴
  alternatives_korean:
  - 아자리아스
  - 아자랴
  lexicon: LSJ
  rationale: 그리스어 형식 Ἀζαρίας를 따르기보다, 같은 인물의 히브리어 계열 표준 음역인 아사랴를 사용해 한국어 성서 독자에게 더 일관된 이름 형태를 유지했습니다.
- source_word: τῷ ὑψίστῳ θεῷ σαβαὼθ Παντοκράτορι
  english_pob_choice: the Most High God, the Lord of hosts, the Almighty
  chosen_korean: 지극히 높으신 하나님, 만군의 주, 전능자께
  alternatives_korean:
  - 지극히 높으신 하나님, 만군의 하나님, 전능자께
  - 지극히 높으신 하나님, 만군의 야훼, 전능자께
  - 지극히 높으신 하나님, 사바오스, 전능자께
  lexicon: BDAG
  rationale: ὕψιστος, σαβαώθ, παντοκράτωρ의 연속된 신적 칭호를 한국어 성서 용례에 맞게 각각 ‘지극히 높으신 하나님’, ‘만군의 주’, ‘전능자’로 옮겨 제목의 누적 효과를 보존했습니다.
theological_decisions:
- issue: σαβαώθ의 처리
  chosen_reading: 만군의 주
  alternative_readings:
  - 만군의 하나님
  - 사바오스
  - 만군
  rationale: 본문은 하나님께 드리는 찬양 속의 칭호 나열이므로, 한국어 성서에서 익숙한 ‘만군의 주’를 사용해 의미를 분명히 하면서도 원문의 숭엄한 호칭성을 유지했습니다.
