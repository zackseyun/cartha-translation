  - severity: high
    issue: ‘만군의 주’는 σαβαὼθ 앞에 원문에 없는 ‘주’를 보충합니다.
    rationale: 그리스어에는 κύριος가 없고 θεῷ σαβαὼθ라고 되어 있습니다. 관습적 영어 ‘Lord of hosts’를 그대로 따라가기보다, 원문의 어휘를 보존하는 ‘만군의 하나님’이 적절합니다.
