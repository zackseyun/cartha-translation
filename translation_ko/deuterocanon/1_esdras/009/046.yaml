base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/046.yaml
  text: And when the law was read[a], they all stood upright; and Azarias blessed the Most High God, the Lord of hosts, the Almighty[c][b],
  footnotes:
  - marker: a
    text: Greek Azarias; the Hebrew parallel has Azariah.
    reason: alternative_reading
  - marker: b
    text: Or 'when the law was unrolled/opened.' The Greek verb literally means 'to loose,' but in this context refers to opening the law for public reading.
    reason: lexical_alternative
  - marker: c
    text: '''Hosts'' translates Greek sabaōth, a traditional divine title sometimes left untranslated as ''Sabaoth.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 율법을 펼치자 모두가 똑바로 섰습니다. 그리고 아사랴는 지극히 높으신 하나님, 만군의 주, 전능자께 복을 빌었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 이름은 아자리아스지만, 히브리어 평행 본문은 아사랴입니다.
    reason: alternative_reading
  - marker: b
    text: λύω는 문자적으로는 ‘풀다’라는 뜻이지만, 이 문맥에서는 율법 두루마리를 공개해 읽는 상황을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 사바오스는 전통적으로 남겨 온 칭호이지만, 여기서는 그 뜻을 옮겨 ‘만군’으로 표현했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ λῦσαι τὸν νόμον
  english_pob_choice: when the law was read
  chosen_korean: 율법을 펼치자
  alternatives_korean:
  - 율법이 읽히자
  - 율법이 열리자
  - 율법이 펼쳐지자
  lexicon: BDAG
  rationale: λύω는 두루마리나 책의 문맥에서 ‘펼치다/풀다’의 뜻이 될 수 있으므로, 읽기 직전의 공개 열람 상황을 살려 자연스럽게 옮겼습니다.
- source_word: πάντες ὀρθοὶ ἔστησαν
  english_pob_choice: they all stood upright
  chosen_korean: 모두가 똑바로 섰습니다
