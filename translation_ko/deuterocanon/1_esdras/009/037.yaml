base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/037.yaml
  text: And the priests and the Levites and those from Israel lived in Jerusalem and in the country at the new moon of the seventh month[b][a], and the sons of Israel were in their settlements.
  footnotes:
  - marker: a
    text: Or, 'dwelt.'
    reason: lexical_alternative
  - marker: b
    text: The Greek says 'on the new moon of the seventh month'; the Hebrew parallel in Nehemiah differs substantially at this point, so the wording here follows 1 Esdras as preserved in Greek.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 제사장들과 레위인들과 이스라엘에 속한 이들은 일곱째 달 초하루에[b] 예루살렘과 그 지방에 거주했으며[a], 이스라엘 자손은 자기들의 거처에 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘살았습니다’.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘일곱째 달의 초하루에’라고 말합니다. 느헤미야의 히브리어 평행본문은 이 지점에서 상당히 다르므로, 이 번역은 보존된 1 Esdras의 그리스어 표현을 따릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: κατῴκησαν
  english_pob_choice: lived
  chosen_korean: 머물렀으며
  alternatives_korean:
  - 살았습니다
  - 거주했습니다
  - 살고 있었습니다
  lexicon: BDAG
  rationale: κατοικέω의 완료된 정주를 자연스러운 현대 한국어로 옮기되, 단순 일시 체류보다 거주 상태를 드러내기 위해 ‘머물다’를 선택했습니다.
- source_word: οἱ ἐκ τοῦ Ἰσραήλ
  english_pob_choice: those from Israel
  chosen_korean: 이스라엘에서 나온 사람들
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘에서 온 이들
  - 이스라엘에 속한 사람들
  lexicon: BDAG
  rationale: 제사장들과 레위 사람들과 구별되는 별도 집단이라는 점을 살려, 단순한 민족 명칭보다 출신/소속의 뉘앙스를 보존했습니다.
- source_word: ἐν τῇ χώρᾳ
  english_pob_choice: in the country
  chosen_korean: 그 지방에
  alternatives_korean:
  - 그 나라에
  - 시골에
  - 그 땅에
  lexicon: BDAG
  rationale: χώρα의 여기서의 지리적 대비를 살려 예루살렘 밖의 지역을 가리키는 표현으로 옮겼습니다. ‘시골’은 현대어 뉘앙스가 지나치게 협소합니다.
- source_word: τῇ νουμηνίᾳ τοῦ ἑβδόμου μηνός
  english_pob_choice: On the new moon of the seventh month
  chosen_korean: 일곱째 달의 초하루에
  alternatives_korean:
  - 일곱째 달의 신월에
  - 일곱째 달의 새달에
  - 일곱째 달이 시작되는 날에
  lexicon: LSJ
  rationale: νουμηνία는 달의 초하루를 가리키므로, 한국어 성경 문맥에서 자연스럽고 정확한 ‘초하루’로 옮겼습니다.
- source_word: οἱ υἱοὶ Ἰσραήλ
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘의 자녀들
  - 이스라엘 사람들
  lexicon: BDAG
  rationale: 관용적 성경 표현을 유지하면서도 한국어에서 널리 이해되는 covenant people 지칭으로 옮겼습니다.
- source_word: κατοικίαις
  english_pob_choice: settlements
  chosen_korean: 거처들
  alternatives_korean:
  - 정착지들
  - 마을들
  - 주거지들
  lexicon: LSJ
  rationale: 개별 집보다는 사람들의 거주지를 가리키는 복수 의미를 살리기 위해, 너무 행정적이거나 현대적인 ‘정착지’보다 ‘거처들’을 택했습니다.
theological_decisions:
- issue: 1 Esdras의 그리스어 본문을 Nehemiah의 히브리어 평행구와 조화시킬지 여부
  chosen_reading: 그리스어 본문이 말하는 예루살렘/그 지방 거주와 일곱째 달 초하루를 그대로 유지했습니다.
  alternative_readings:
  - 느헤미야 8:1의 집합 장면에 맞춰 문구를 재구성함
  - 초하루 언급을 일반적인 ‘일곱째 달’로 완화함
  rationale: 이 책의 번역 기준점은 1 Esdras의 그리스어 본문이며, 평행 히브리어는 참고이지만 본문을 덮어쓰지 않습니다. 따라서 시간 표지와 거주 표현을 보존했습니다.
  doctrine_reference: 1 Esdras parallel policy; source-first translation principle
