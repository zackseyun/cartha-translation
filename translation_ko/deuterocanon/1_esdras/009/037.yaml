review_pass:
  verdict: revise
  source_fidelity: 그리스어의 시간 표현(τῇ νουμηνίᾳ τοῦ ἑβδόμου μηνός)은 κατοίκησαν과 함께 놓여 있으므로, ‘거주했다’ 절에 연결하는 것이 안전합니다. 초안은 이를 뒤의 ‘이스라엘 자손은 … 있었습니다’에 연결해 통사 관계를 바꾸었습니다. 또한 οἱ ἐκ τοῦ Ἰσραήλ의 ‘이스라엘에서 나온 사람들’은 지리적 출신을 다소 과도하게 암시하므로 ‘이스라엘에 속한 이들’이 더 자연스럽고 원문의 구별을 유지합니다.
  naturalness: ‘머물렀으며’는 정주·거주의 뜻인 κατοικέω보다 일시 체류의 뉘앙스를 낼 수 있습니다. ‘거주했습니다’가 현대 표준 한국어의 합쇼체에서 더 정확합니다. κατοικίαις는 이 문맥에서 ‘거처들’보다 자연스러운 집합적 표현인 ‘거처에’로 옮길 수 있습니다.
  terminology: ‘레위 사람들’보다 성경 및 현대 한국어에서 통용되는 ‘레위인들’이 간결하고 자연스럽습니다. ‘이스라엘 자손’은 οἱ υἱοὶ Ἰσραήλ의 관용적 표현으로 유지합니다. ‘초하루’는 νουμηνία의 적절한 번역입니다.
  issues:
