translation:
  language: ko
  text: 그때 에스라는 성전 뜰에서 일어나 나세이브의 아들 요나의 방으로 들어갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '그리스어: ‘나세이브의 아들 요나의 방.’ 에스라 10:6의 히브리어 평행본문에는 ‘엘리아십의 아들 여호하난’으로 되어 있어 인명 전승이 다릅니다.'
    reason: textual_variant
lexical_decisions:
- source_word: ἀναστὰς
  english_pob_choice: rose up
  chosen_korean: 일어나
  alternatives_korean:
  - 일어나다
  - 몸을 일으켜
  lexicon: BDAG
  rationale: 서술 흐름을 자연스럽게 살리면서도 동작의 연속성을 보존하는 기본적 서술형으로 옮겼습니다.
- source_word: αὐλῆς τοῦ ἱεροῦ
  english_pob_choice: court of the temple
  chosen_korean: 성전 뜰
  alternatives_korean:
  - 성전의 뜰
  - 성전 마당
  lexicon: LSJ
  rationale: αὐλή는 성전 맥락에서 ‘뜰’이 가장 직접적이며, ‘성전 뜰’은 간결하면서도 장소 감각을 분명히 드러냅니다.
- source_word: παστοφόριον
  english_pob_choice: chamber
  chosen_korean: 방
  alternatives_korean:
  - 침실
  - 방실
  - 칸
  lexicon: LSJ
  rationale: 이 단어는 건물 내부의 방/실을 가리키므로, 한국어에서는 과도하게 장식적이지 않은 ‘방’이 가장 무난합니다.
- source_word: Ἰωνᾶ τοῦ Νασείβου
  english_pob_choice: Jona son of Naseib
  chosen_korean: 요나의
  alternatives_korean:
  - 요나의 아들 나세이브의
  - 요나, 나세이브의 아들
  lexicon: LSJ
  rationale: 이 절의 핵심은 장소 이동이며, 본문이 전하는 현존 형태의 그리스어 고유명사를 그대로 간단히 옮겨 본문 흐름을 유지했습니다.
theological_decisions:
- issue: 본문 전승의 인명 불일치
  chosen_reading: 본문의 그리스어 인명 형태를 본문에는 유지하고, 별도 주석 없이 간결하게 처리했습니다.
  alternative_readings:
  - 히브리어 평행본문에 따른 이름 보정
  - 본문 주석으로만 이형을 처리
  rationale: 이 구절은 서사 동작이 중심이고, 인명 차이는 본문 비평의 범주에 해당하므로 본문 자체는 전승된 그리스어를 따라야 합니다.
  doctrine_reference: source criticism / textual criticism
