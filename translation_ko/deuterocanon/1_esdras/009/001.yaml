  - 성전 마당
  lexicon: LSJ
  rationale: αὐλή는 성전 맥락에서 ‘뜰’이 가장 직접적이며, ‘성전 뜰’은 간결하면서도 장소 감각을 분명히 드러냅니다.
- source_word: παστοφόριον
  english_pob_choice: chamber
  chosen_korean: 방
  alternatives_korean:
  - 침실
  - 방실
  - 칸
  lexicon: LSJ
  rationale: 이 단어는 건물 내부의 방/실을 가리키므로, 한국어에서는 과도하게 장식적이지 않은 ‘방’이 가장 무난합니다.
- source_word: Ἰωνᾶ τοῦ Νασείβου
  english_pob_choice: Jona son of Naseib
  chosen_korean: 요나의
  alternatives_korean:
  - 요나의 아들 나세이브의
