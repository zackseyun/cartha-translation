translation:
  language: ko
  text: 그때 에스라는 성전 뜰에서 일어나, 요나의 방으로 들어갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 ‘요나의 방’으로 읽히며, 히브리어 평행본문과는 인명 전승이 다릅니다.
    reason: textual_variant
  - marker: b
    text: 성전 뜰과 방으로 옮긴 표현은 장소를 자연스럽게 드러내기 위한 직역에 가깝습니다.
    reason: korean_style_note
lexical_decisions:
- source_word: ἀναστὰς
  english_pob_choice: rose up
  chosen_korean: 일어나
  alternatives_korean:
  - 일어나다
  - 몸을 일으켜
  lexicon: BDAG
  rationale: 서술 흐름을 자연스럽게 살리면서도 동작의 연속성을 보존하는 기본적 서술형으로 옮겼습니다.
- source_word: αὐλῆς τοῦ ἱεροῦ
  english_pob_choice: court of the temple
  chosen_korean: 성전 뜰
  alternatives_korean:
