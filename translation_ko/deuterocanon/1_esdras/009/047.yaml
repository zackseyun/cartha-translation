base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/047.yaml
  text: And all the assembly cried out, “Amen, amen,” and lifting up their hands, they fell to the ground and worshiped God.
translation:
  language: ko
  text: 그러자 온 회중이 “아멘, 아멘” 하고 외쳤고, 손을 높이 들고 땅에 엎드려 하나님께 경배했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘모든 무리’이지만, 예배 장면의 공동체성을 살리기 위해 ‘회중’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν τὸ πλῆθος
  english_pob_choice: all the assembly
  chosen_korean: 온 회중
  alternatives_korean:
  - 모든 무리
  - 온 무리
  - 온 군중
  lexicon: BDAG
  rationale: 이 장면은 예배 응답의 공적·공동체적 성격이 강하므로, 단순한 ‘무리’보다 예배 모임을 드러내는 ‘회중’이 더 적절합니다.
- source_word: ἐφώνησεν
  english_pob_choice: cried out
  chosen_korean: 외쳤고
  alternatives_korean:
  - 크게 말했고
  - 불렀고
  - 소리 내어 말했고
  lexicon: BDAG
  rationale: 공동체가 한목소리로 응답하는 장면의 강한 발성을 살리되, 한국어로는 과장되지 않게 ‘외쳤고’가 자연스럽습니다.
- source_word: Ἀμήν, ἀμήν
  english_pob_choice: Amen, amen
  chosen_korean: “아멘, 아멘”
  alternatives_korean:
  - “진실로, 진실로”
  - “진짜로, 진짜로”
  lexicon: BDAG
  rationale: 이 표현은 교리적 진술이 아니라 예배적 응답이므로 음역을 유지하는 것이 기능과 예전적 울림을 가장 잘 보존합니다.
- source_word: προσεκύνησαν τῷ θεῷ
  english_pob_choice: worshiped God
  chosen_korean: 하나님께 경배했습니다
  alternatives_korean:
  - 하나님께 예배했습니다
  - 하나님께 절했습니다
  - 하나님께 엎드려 경배했습니다
  lexicon: BDAG
  rationale: 단순한 몸짓만이 아니라 하나님을 향한 경배 행위가 핵심이므로 ‘경배했습니다’로 옮기되, 앞의 ‘땅에 엎드려’로 자세를 따로 살렸습니다.
theological_decisions:
- issue: 엎드림과 προσκυνέω의 관계
  chosen_reading: ‘땅에 엎드려’로 몸의 동작을 먼저 제시하고, 이어서 ‘하나님께 경배했습니다’로 예배의 의미를 분명히 했습니다.
  alternative_readings:
  - ‘엎드려 절했습니다’
  - ‘몸을 숙여 경배했습니다’
  rationale: 본문은 물리적 자세와 하나님께 드리는 경배를 함께 말하므로, 둘을 구분해 번역해야 예배 행위의 신학적 무게가 유지됩니다.
  doctrine_reference: 'DOCTRINE.md: source terms의 예배적·신학적 의미를 보존하고, 자세와 행위를 혼동하지 말 것.'
- issue: 회중의 응답을 예전적 발화로 볼지 일반 진술로 볼지
  chosen_reading: 공동체의 예배 응답으로 보고 ‘아멘, 아멘’의 음역을 유지했습니다.
  alternative_readings:
  - ‘진실로, 진실로’로 해석
  - ‘그렇습니다, 그렇습니다’로 의역
  rationale: 여기서의 ‘아멘’은 확언이 아니라 회중의 응답이므로, 통용되는 예전적 형태를 보존하는 것이 본문 기능에 맞습니다.
  doctrine_reference: 'PHILOSOPHY.md: 예배 문맥의 리듬과 기능을 살리는 최적 대응 번역.'
