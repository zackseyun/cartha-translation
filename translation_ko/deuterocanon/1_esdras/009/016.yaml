base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/016.yaml
  text: And Ezra the priest selected for himself men who were heads of their fathers’ houses, all of them designated by name, and they convened on the first day of the tenth month to examine the matter.
  footnotes:
  - marker: a
    text: Literally, 'on the new moon of the tenth month,' that is, on the first day of the month.
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장 에스라는 자신을 위하여 그들 조상의 집안의 우두머리인 남자들을 모두 이름으로 지정하여 뽑았습니다. 그들은 열째 달 초하룻날에 모여 그 일을 조사했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 "열째 달의 새달(신월)에"이며, 곧 그 달의 첫째 날을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπελέξατο
  english_pob_choice: selected for himself
  chosen_korean: 자기들을 위하여 … 뽑았고
  alternatives_korean:
  - 선택했고
  - 자기를 위해 택했고
  - 골랐고
  lexicon: BDAG
  rationale: 중간태의 자기지향성을 살려, 에스라가 자기 목적을 위해 사람들을 따로 선발했다는 뜻을 자연스럽게 드러냈습니다.
- source_word: ἄνδρας ἡγουμένους
  english_pob_choice: men who were heads
  chosen_korean: … 우두머리인 사람들을
  alternatives_korean:
  - … 지도자인 사람들을
  - … 책임자인 사람들을
  - … 우두머리인 남자들을
  lexicon: BDAG
  rationale: ἄνδρας의 남성형과 ἡγουμένους의 인도/통솔 의미를 함께 살리되, 명부 작성 맥락에 맞게 행정적·가계적 대표성을 표현했습니다.
- source_word: τῶν πατριῶν αὐτῶν
  english_pob_choice: of their fathers’ houses
  chosen_korean: 조상들의 집안의
  alternatives_korean:
  - 아버지들의 집안의
  - 조상 대대로의 집안의
  - 가문의
  lexicon: LSJ
  rationale: 가문/씨족보다 더 직역에 가까운 '집안'을 써서 친족 단위의 구조를 보존했습니다.
- source_word: πάντας κατ’ ὄνομα
  english_pob_choice: all of them designated by name
  chosen_korean: 그들 모두를 이름대로
  alternatives_korean:
  - 그들 모두를 이름으로
  - 각 사람을 이름으로
  - 그들 모두를 지명하여
  lexicon: BDAG
  rationale: 공식 명단에 따른 식별이라는 뜻을 살리면서, 한국어로는 '이름대로'가 이름별 지정의 절차성을 가장 간결하게 전달합니다.
- source_word: τῇ νουμηνίᾳ τοῦ μηνὸς τοῦ δεκάτου
  english_pob_choice: on the first day of the tenth month
  chosen_korean: 열째 달 초하룻날에
  alternatives_korean:
  - 열째 달의 초하루에
  - 열째 달의 첫날에
  - 열째 달 초하루에
  lexicon: LSJ
  rationale: νουμηνία의 달 초하루 의미를 한국어 관용 표현으로 옮겼습니다. '초하룻날'은 달력상의 첫째 날을 분명히 드러냅니다.
- source_word: ἐτάσαι τὸ πρᾶγμα
  english_pob_choice: to examine the matter
  chosen_korean: 그 일을 조사했습니다
  alternatives_korean:
  - 그 문제를 살펴보았습니다
  - 그 일을 검토했습니다
  - 그 사건을 조사했습니다
  lexicon: BDAG
  rationale: 행정적·조사적 목적을 살려 '조사하다'를 택했고, τὸ πρᾶγμα는 문맥상 대상이 되는 사안을 '그 일'로 자연스럽게 받았습니다.
theological_decisions:
- issue: 남성형 행정 언어 보존
  chosen_reading: 제사장 에스라는 자기들을 위하여, 곧 조상들의 집안의 우두머리인 사람들을…
  alternative_readings:
  - 가문의 대표들을
  - 집안 어른들을
  - 지도자들을
  rationale: 본문은 ἄνδρας와 가계 대표성 언어를 분명히 사용하므로, 이를 중성화하지 않고 남성적·가문 중심 표현을 유지했습니다.
  doctrine_reference: DOCTRINE.md §4 Gender-accurate over gender-neutral
- issue: νουμηνία의 달 초하루 의미
  chosen_reading: 열째 달 초하룻날에
  alternative_readings:
  - 열째 달의 새달에
  - 열째 달의 초하루에
  rationale: 달력 절차를 말하는 문맥이므로 예배적 '새달'보다 날짜 정보가 분명한 표현을 본문에 두었습니다.
  doctrine_reference: DOCTRINE.md §6 Readable modern English, not archaic or academic
