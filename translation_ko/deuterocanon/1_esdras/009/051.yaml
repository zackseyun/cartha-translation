  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 λιπάσματα의 ‘풍성하고 기름진/좋은 음식’이라는 의미를 ‘좋은 음식’만으로 옮기면 풍요로운 잔칫음식의 뉘앙스가 다소 약해집니다. 또한 τοῖς μὴ ἔχουσιν은 목적어가 생략된 ‘가지지 못한 사람들’이므로, 한국어에서는 ‘아무것도 가진 것이 없는’보다 간결한 표현이 자연스럽습니다.
  naturalness: 합쇼체 명령문으로 자연스럽게 다듬을 수 있습니다. ‘드시는’ 청자 높임은 본문이 요구하는 의미는 아니므로 일반 명령 연결형 ‘먹고’가 더 중립적입니다. 각주 표지는 해당 어구 바로 뒤에 두는 편이 가리키는 범위가 분명합니다.
  terminology: ‘몫’은 ἀποστολάς에 적절하며, 문맥상 음식의 몫이라는 뜻도 유지합니다. λιπάσματα는 ‘기름진 음식’으로 옮기고 각주에서 축제의 좋은 음식이라는 관용적 의미를 설명하는 것이 원문 어휘와 현대 독자의 이해를 함께 충족합니다.
