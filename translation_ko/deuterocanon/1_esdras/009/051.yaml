base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/051.yaml
  text: Go your way[a], then[b], eat rich foods and send portions to those who have nothing.
  footnotes:
  - marker: a
    text: Or, more literally, 'eat fat things.' The phrase refers to rich or choice foods for celebration.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew parallel in Nehemiah 8:10 reads more specifically, 'send portions to anyone for whom nothing is prepared.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 가서 좋은 음식을 드시고, 아무것도 가진 것이 없는 이들에게 몫을 보내십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘기름진 것들/살진 것들’을 뜻합니다. 여기서는 축제용으로 좋은 음식을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 병행구는 ‘아무것도 준비되지 않은 사람에게 몫을 보내라’고 더 구체적으로 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: βαδίσαντες οὖν
  english_pob_choice: Go your way, then
  chosen_korean: 그러므로 가서
  alternatives_korean:
  - 가십시오, 그러면
  - 그런 다음 가서
  - 떠나서
  lexicon: LSJ
  rationale: 분사 βαδίσαντες와 연결사 οὖν의 결합을 한국어 명령형 흐름으로 자연스럽게 옮기되, 단순 이동보다 앞선 권면에 대한 이어짐을 드러내기 위해 ‘그러므로’와 ‘가서’를 썼습니다.
- source_word: λιπάσματα
  english_pob_choice: rich foods
  chosen_korean: 좋은 음식
  alternatives_korean:
  - 진수성찬
  - 기름진 음식
  - 풍성한 음식
  lexicon: LSJ
  rationale: 직역하면 ‘기름진/풍성한 음식’의 뉘앙스이지만, 현대 한국어에서 축제용 식사를 자연스럽게 전달하는 표현으로 ‘좋은 음식’을 택했습니다. 과도하게 문자적인 ‘기름진 음식’보다 문맥상 권면의 의미가 또렷합니다.
- source_word: ἀποστολὰς
  english_pob_choice: portions
  chosen_korean: 몫
  alternatives_korean:
  - 몫의 음식
  - 몫을
  - 분깃
  lexicon: LSJ
  rationale: 헬라어는 보내는 ‘몫/분량’을 가리키며, 마소라 본문의 מָנוֹת도 같은 방향을 지지합니다. 한국어에서는 축제 음식의 ‘몫’이라는 뜻이 가장 간결하고도 자연스럽게 살아납니다.
- source_word: τοῖς μὴ ἔχουσιν
  english_pob_choice: to those who have nothing
  chosen_korean: 아무것도 가진 것이 없는 이들에게
  alternatives_korean:
  - 없는 이들에게
  - 무엇도 없는 이들에게
  - 아무것도 없는 이들에게
  lexicon: LSJ
  rationale: 헬라어의 간단한 부정 표현을 그대로 살리면서, 대상이 실제 결핍 상태에 있는 사람들임을 분명히 하기 위해 완곡하지 않게 옮겼습니다.
theological_decisions:
- issue: 이 절의 ‘몫’은 일반적 선물이 아니라 잔치 음식의 나눔을 뜻하는가
  chosen_reading: 문맥상 축제 자리에서 먹을 음식을 함께 나누라는 뜻으로 이해했습니다.
  alternative_readings:
  - 막연한 구제물이나 일반적 선물로 볼 수 있습니다.
  rationale: 헬라어 ἀποστολὰς와 병행 히브리어 מָנוֹת가 모두 ‘보내는 몫/분량’을 가리키고, 바로 앞의 ‘먹으라’는 명령과 이어져 잔치 음식의 배분으로 읽는 것이 가장 자연스럽습니다.
  doctrine_reference: 1 Esdras 9:51 parallel with Nehemiah 8:10
