- from: 그러므로 가서 좋은 음식을 드시고, 아무것도 가진 것이 없는 이들에게 몫을 보내십시오.[a][b]
  to: 그러니 가서 기름진 음식[a]을 먹고, 아무것도 없는 이들에게[b] 몫을 보내십시오.
  rationale: ‘기름진 음식’으로 λιπάσματα의 핵심 어휘 의미를 본문에서 보존하고, 각주로 관용적·문맥적 의미를 설명했습니다. ‘아무것도 없는 이들’은 그리스어의 간결한 결핍 표현을 자연스러운 한국어로 유지하며, 히브리어 병행구의 ‘준비되지 않은’이라는 구체화는 각주에 한정했습니다. 표지를 해당 어구에 직접 배치했습니다.
