base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/020.yaml
  text: and they pledged themselves to send away their wives[a], and for atonement[b], rams for their ignorance.
  footnotes:
  - marker: a
    text: Or, more literally, 'they laid hands to send away their wives'—an idiom meaning they undertook or bound themselves to do so.
    reason: lexical_alternative
  - marker: b
    text: '''For their ignorance'' may also mean ''for their error'' or ''for their unintentional sin'' in this sacrificial context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 자기들의 아내들을 내보내기로 손을 내밀었으며, 속죄를 위하여 자기들의 무지에 대한 숫양들을 바쳤습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “그들의 아내들을 내보내도록 손을 내렸다/얹었다”로, 어떤 일을 하기로 결의하거나 스스로를 묶는 관용구일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: “무지”는 여기서 제의적 문맥 속에서 “실수”나 “의도치 않은 죄”를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβαλον τὰς χεῖρας
  english_pob_choice: they pledged themselves
  chosen_korean: 손을 내밀었으며
  alternatives_korean:
  - 그들은 맹세했습니다
  - 그들은 자신을 바쳤습니다
  - 그들은 손을 얹었습니다
  lexicon: LSJ
  rationale: 직역하면 ‘손을 내렸다/내밀었다’이지만, 여기서는 실제 행위보다 어떤 조치를 하기로 스스로를 묶는 관용구이므로, 한국어에서는 결의·서약의 뉘앙스를 살린 표현으로 옮겼습니다.
- source_word: ἐκβαλεῖν τὰς γυναῖκας αὐτῶν
  english_pob_choice: to send away their wives
  chosen_korean: 자기들의 아내들을 내보내기로
  alternatives_korean:
  - 자기들의 아내들을 내치기로
  - 자기들의 아내들을 쫓아내기로
  - 자기들의 아내들을 보내어 떠나게 하기로
  lexicon: BDAG
  rationale: 혼인 문맥이므로 단순한 ‘쫓아내다’보다 분리·이혼의 의미를 드러내는 ‘내보내다’가 원문의 의미를 과도하게 격화하지 않으면서도 반영합니다.
- source_word: εἰς ἐξιλασμόν
  english_pob_choice: for atonement
  chosen_korean: 속죄를 위하여
  alternatives_korean:
  - 화목을 위하여
  - 속죄 제물로
  - 속죄 목적으로
  lexicon: LEH
  rationale: ἐξιλασμός의 제의적 의미를 한국어 성서 용례에 맞게 간결하게 살리되, 후대 신학 용어를 과도하게 덧씌우지 않도록 했습니다.
- source_word: ὑπὲρ τῆς ἀγνοίας αὐτῶν
  english_pob_choice: for their ignorance
  chosen_korean: 자기들의 무지에 대한
  alternatives_korean:
  - 자기들의 실수에 대한
  - 자기들의 부지에 대한
  - 자기들의 부주의에 대한
  lexicon: BDAG
  rationale: ἀγνοία의 기본 뜻인 ‘무지’를 유지해 원문 투명성을 살렸고, 제의적 문맥이 암시하는 ‘의도치 않은 잘못’의 뉘앙스는 본문을 넘지 않는 범위에서 남겨 두었습니다.
- source_word: κριούς
  english_pob_choice: rams
  chosen_korean: 숫양들을
  alternatives_korean:
  - 수양들을
  - 어린 수컷 양들을
  lexicon: LSJ
  rationale: 희생 제물의 종류를 구체적으로 드러내는 ‘숫양’을 사용했고, 복수형도 유지했습니다.
theological_decisions:
- issue: 제의적 속죄와 ‘무지’의 관계
  chosen_reading: 본문의 ‘무지’를 그대로 두고, 그 제의적 함의는 문맥에서 읽히도록 합니다.
  alternative_readings:
  - ‘의도치 않은 죄’로 풀어 씁니다
  - ‘실수’로 완화합니다
  rationale: 원문은 ἀγνοία를 사용하므로, 제의적 의미를 설명하더라도 본문 자체는 투명하게 남겨 두는 것이 바람직합니다. 한국어 본문은 ‘무지’로 유지하고, 독자가 희생 제의의 배경을 문맥에서 파악하도록 했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3, 6
- issue: ἐπέβαλον τὰς χεῖρας의 관용구 처리
  chosen_reading: 물리적 ‘손을 대다’보다 서약·결의의 의미를 살렸습니다.
  alternative_readings:
  - 그들은 손을 내리쳤다
  - 그들은 손을 얹었다
  rationale: 문맥상 아내들을 실제로 붙잡는 장면이 아니라, 그 일을 실행하겠다고 스스로를 묶는 결의의 표현입니다. 따라서 한국어에서도 행동의 결심을 드러내는 방식으로 옮겼습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
