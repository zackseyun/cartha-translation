base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/022.yaml
  text: 'And from the sons of Phaisour: Elionais[a], Asseias, Ismaēlos, Nathanaēlos, Okaēlēdos[c][b], and Salthas.'
  footnotes:
  - marker: a
    text: Greek Phaisour; the approximate Hebrew parallel corresponds to Pashhur.
    reason: alternative_reading
  - marker: b
    text: The name Okaēlēdos reflects the Greek witness here; the approximate Hebrew parallel tradition may point to a different underlying name, sometimes aligned with Jozabad.
    reason: textual_variant
  - marker: c
    text: Several names in this verse appear in Greek forms that do not exactly match the approximate Hebrew parallel; the translation keeps the Greek forms because 1 Esdras is translated here from the Septuagint witness.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 파이수르[a]의 아들들 가운데서는 엘리오나이스, 아세이아스, 이스마엘로스, 나타나엘로스, 오카일레도스[b], 살타스가 있었습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 이름 파이수르는 대략적인 히브리어 평행전승에서 파슈르(Pashhur)에 해당할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 오카일레도스는 이 절의 그리스어 전승형을 따른 표기이며, 대략적인 히브리어 평행전승은 다른 이름을 가리킬 수 있고, 때로는 요자바드와 연결됩니다.
    reason: textual_variant
  - marker: c
    text: 이 절의 여러 이름은 대략적인 히브리어 평행전승과 정확히 일치하지 않지만, 본문은 1 Esdras의 그리스어 증거를 따라 그 형태를 보존합니다.
    reason: cultural_note
