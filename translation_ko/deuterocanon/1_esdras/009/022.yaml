  rationale: 목록 문맥에서 ἐκ는 집단 안에서의 추출을 나타내므로, 혈통·가문 소속을 살리는 표현으로 옮겼습니다.
- source_word: Φαισούρ
  english_pob_choice: Phaisour
  chosen_korean: 파이수르
  alternatives_korean:
  - 바슈르
  - 페이수르
  lexicon: LSJ
  rationale: 1 Esdras는 그리스어 본문을 따라 옮기므로, MT 대응형이 아니라 그리스어 음역형을 한국어로 옮겼습니다.
- source_word: Ἐλιωναίς, Ἀσσείας, Ἰσμαήλος, Ναθανάηλος, Ὠκαιληδὸς, Σάλθας
  english_pob_choice: Elionais, Asseias, Ismaēlos, Nathanaēlos, Okaēlēdos, Salthas
  chosen_korean: 엘리오나이스, 아세이아스, 이스마엘로스, 나타나엘로스, 오카엘레도스, 살타스
  alternatives_korean:
  - 엘리오나스, 아세야스, 이스마엘, 나다나엘, 요자바드, 샬룸
  lexicon: LSJ
  rationale: 이 절의 인명들은 그리스어 전승의 형태를 보존하는 것이 핵심이므로, 익숙한 히브리어 대응형으로 평준화하지 않고 음역을 유지했습니다.
theological_decisions:
- issue: 그리스어 본문의 인명 보존과 히브리어 평행전승의 차이
  chosen_reading: 본문에는 그리스어 전승의 이름들을 그대로 유지했습니다.
  alternative_readings:
  - MT 평행의 Pashhur, Jozabad, Shallum 등으로 조정
