base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/050.yaml
  text: This day is holy to the Lord[a], and all were weeping when they heard the law.
  footnotes:
  - marker: a
    text: The Hebrew parallel in Nehemiah 8 includes 'our Lord' and continues with an exhortation to eat, drink, share portions, and not grieve; 1 Esdras here preserves a shorter Greek wording.
    reason: cross_reference
translation:
  language: ko
  text: 이 날은 주님께 거룩한 날입니다. 그리고 모두가 율법을 들을 때 울고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 짧게 끝나며, 느헤미야 8장의 평행 본문에는 이어지는 식사·나눔·근심 금지 권면이 더 길게 나옵니다.
    reason: cross_reference
lexical_decisions:
- source_word: Ἡ ἡμέρα αὕτη
  english_pob_choice: This day
  chosen_korean: 이 날은
  alternatives_korean:
  - 오늘은
  - 이 날이
  lexicon: LSJ
  rationale: 지시어 αὕτη의 현장성을 살리면서도 한국어 문장으로 자연스럽게 시작하도록 옮겼습니다.
- source_word: ἁγία
  english_pob_choice: holy
  chosen_korean: 거룩한
  alternatives_korean:
  - 성스러운
  - 신성한
  lexicon: LSJ
  rationale: 절기적·예배적 구별을 나타내는 표준적 번역으로, 본문의 종교적 강도를 자연스럽게 보존합니다.
- source_word: τῷ κυρίῳ
  english_pob_choice: to the Lord
  chosen_korean: 주님께
  alternatives_korean:
  - 주님을 위해
  - 주님에게
  lexicon: LSJ
  rationale: 여격의 방향성을 한국어에서는 처소/대상 표지인 ‘께’로 옮겨 주(主) 지시를 유지했습니다.
- source_word: τὸν νόμον
  english_pob_choice: the law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 가르침
  lexicon: LSJ
  rationale: 이 구절의 νόμος는 공적 낭독의 대상인 토라/율법을 가리키므로, 프로젝트 기본어인 ‘율법’을 사용했습니다.
theological_decisions:
- issue: Greek 본문에 없는 MT 병행의 '우리'나 이어지는 권면을 본문에 끌어올지 여부
  chosen_reading: 그리스어 본문에 있는 내용만 반영해 간결하게 번역했습니다.
  alternative_readings:
  - ‘우리 주님’으로 확장하기
  - 뒤이은 기쁨의 권면까지 보태기
  rationale: 이 역본은 1 Esdras의 현존하는 그리스어를 주 본문으로 삼아야 하므로, 느헤미야의 평행 본문과 조화시키지 않고 짧은 그리스어 문장을 그대로 살렸습니다.
  doctrine_reference: 원전 우선 원칙 / 병행본문 조화 금지
