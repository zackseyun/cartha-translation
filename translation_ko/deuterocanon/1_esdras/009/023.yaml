    reason: textual_variant
translation:
  language: ko
  text: 그리고 레위인 가운데서는 요자바도스와 세네이스와 코노스, 곧 칼리타이스[b]와 파타이오스[c]와 유다와 요나스가 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: οὗτος Καλιταίς는 앞선 코노스를 칼리타이스라는 다른 이름으로 식별하는 동격 표현입니다.
    reason: source_note
  - marker: c
    text: 이 절의 드문 인명들은 전승 차이와 전사상의 미세한 불확실성이 있습니다.
    reason: textual_variant
