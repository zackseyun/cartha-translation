base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/023.yaml
  text: 'And from the Levites: Jozabad[a], Seneis, Konos (that is, Kalitais), and Pathaios[c][b], and Judas and Jonas.'
  footnotes:
  - marker: a
    text: Or 'that is, Kalitais' for the phrase 'who is Kalitais'; the Greek likely identifies Konos by an alternate name.
    reason: alternative_reading
  - marker: b
    text: Some names may correspond to Hebrew forms known from the parallel tradition, such as 'Jonah' for 'Jonas' or a Semitic equivalent behind 'Pathaios,' but the main text follows the Greek witness of 1 Esdras.
    reason: lexical_alternative
  - marker: c
    text: The source transcription is marked with minor mismatch, so the exact spelling of some rare names may be slightly uncertain.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 레위 사람들 가운데서는 여호사밧, 세네이스, 코노스—곧 칼리타이스—와 파타이오스, 그리고 유다와 요나스가 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘여호사밧’은 그리스어 Ἰωζάβαδος의 한국어 관용 대응으로 처리했습니다.
    reason: lexical_alternative
  - marker: b
    text: οὗτος Καλιταίς는 앞 이름의 별칭 또는 다른 이름을 밝히는 동격 표현입니다.
    reason: source_note
  - marker: c
    text: 이 절의 드문 인명들은 전승 차이와 전사상의 미세한 불확실성이 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν Λευειτῶν
  english_pob_choice: from the Levites
  chosen_korean: 레위 사람들 가운데서는
  alternatives_korean:
  - 레위 사람들로부터
  - 레위 사람들 중에서
  lexicon: LSJ
  rationale: ἐκ의 부분적·집합적 의미를 자연스럽게 살려, 명단 안에서 레위인 집단을 가리킨다는 점을 한국어로 분명하게 했습니다.
- source_word: Ἰωζάβαδος
  english_pob_choice: Jozabad
  chosen_korean: 여호사밧
  alternatives_korean:
  - 요자밧
  - 요사밧
  lexicon: 고유명사 전승 대조
  rationale: 이 이름은 히브리어 전승의 대응형이 널리 알려져 있어, 한국어 성경 관용형에 맞춰 옮겼습니다.
- source_word: οὗτος Καλιταίς
  english_pob_choice: that is, Kalitais
  chosen_korean: 곧 칼리타이스
  alternatives_korean:
  - 곧 칼리타이즈
  - 그는 칼리타이스
  - 즉 칼리타이스
  lexicon: LSJ
  rationale: οὗτος는 앞의 이름을 다른 이름으로 식별하는 동격적 표현이므로, 한국어에서는 ‘곧’으로 처리해 동일 인물의 별칭임을 드러냈습니다.
- source_word: Ἰωνάς
  english_pob_choice: Jonas
  chosen_korean: 요나스
  alternatives_korean:
  - 요나
  lexicon: 고유명사 전승 대조
  rationale: 본문의 그리스어 인명형을 따라 음역하되, 히브리어형 ‘요나’ 가능성은 본문 밖에서 검토할 수 있도록 남겨 두었습니다.
