revisions:
- from: 그리고 제사장 에스라는 율법 낭독자와 함께 이미 만들어 놓은 나무 단 위에 섰습니다.[a]
  to: 그리고 제사장이며 율법 낭독자인 에스라가 만들어 놓은 나무 연단 위에 섰습니다.[a]
  rationale: 에스라의 두 직함이 동격이라는 그리스어 문법을 반영하도록 ‘함께’를 삭제하고 수식 관계를 명시했습니다. βῆμα는 문맥상 공적 낭독을 위한 높인 구조물이므로 ‘연단’으로 옮겼습니다. 각주는 그리스어와 히브리어 평행본문의 차이를 유지하되, 어느 한 본문으로 조화시키지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:09:36Z'
