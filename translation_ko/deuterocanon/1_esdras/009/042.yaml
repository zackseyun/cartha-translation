base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/042.yaml
  text: And Ezra the priest and reader of the law stood on the wooden platform that had been constructed;[a]
  footnotes:
  - marker: a
    text: The Hebrew parallel in Nehemiah 8:4 reads 'Ezra the scribe' and says the wooden structure was made 'for the matter' or 'for the occasion.' The Greek of 1 Esdras instead reads 'the priest and reader of the law' and simply says it had been constructed.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 제사장 에스라는 율법 낭독자와 함께 이미 만들어 놓은 나무 단 위에 섰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 평행본문인 느헤미야 8:4는 에스라를 ‘서기관’으로 부르고, 나무 구조물도 ‘일을 위하여/그 일에 맞게’ 만든 것으로 말합니다. 그러나 이 절의 그리스어는 ‘제사장과 율법 낭독자’라고 하고, 단순히 ‘이미 만들어진’ 것으로만 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστη
  english_pob_choice: stood
  chosen_korean: 섰습니다
  alternatives_korean:
  - 서 있었습니다
  - 자리를 잡았습니다
  lexicon: BDAG
  rationale: 서술 동사의 단순 과거를 자연스럽게 옮기되, 공개 낭독 장면의 동작성을 살리기 위해 ‘섰습니다’를 택했습니다.
- source_word: ὁ ἱερεύς
  english_pob_choice: the priest
  chosen_korean: 제사장
  alternatives_korean:
  - 사제
  - 성직자
  lexicon: BDAG
  rationale: 에스라의 직분을 그대로 반영하는 표준 성경어로 ‘제사장’이 가장 직접적입니다.
- source_word: ἀναγνώστης τοῦ νόμου
  english_pob_choice: reader of the law
  chosen_korean: 율법 낭독자
  alternatives_korean:
  - 율법을 읽는 사람
  - 율법 읽는 자
  - 율법 독서자
  lexicon: BDAG
  rationale: ἀναγνώστης의 핵심은 단순한 서기관이 아니라 공적으로 읽는 사람이라는 점이므로, 본문의 역할을 드러내는 ‘율법 낭독자’로 옮겼습니다.
- source_word: ἐπὶ τοῦ ξυλίνου βήματος
  english_pob_choice: on the wooden platform
  chosen_korean: 나무 단 위에
  alternatives_korean:
  - 나무 플랫폼 위에
  - 나무 대 위에
  - 나무 연단 위에
  lexicon: BDAG
  rationale: βῆμα의 기능은 높여 세운 구조물이므로, 현대 한국어에서 자연스럽고 장면이 분명한 ‘나무 단’으로 옮겼습니다.
- source_word: τοῦ κατασκευασθέντος
  english_pob_choice: that had been constructed
  chosen_korean: 이미 만들어 놓은
  alternatives_korean:
  - 건축된
  - 세워 둔
  - 구축된
  lexicon: BDAG
  rationale: 완료된 준비 상태를 나타내므로, 딱딱한 기술어보다 선행 완료를 드러내는 ‘이미 만들어 놓은’이 적절합니다.
theological_decisions:
- issue: Greek witness reads 'priest and reader of the law,' while the Hebrew parallel has 'scribe.'
  chosen_reading: 본문은 그리스어 본문을 따라 에스라를 ‘제사장’이자 ‘율법 낭독자’로 제시하고, ‘서기관’으로 단일화하지 않았습니다.
  alternative_readings:
  - 에스라 서기관
  - 율법을 낭독하는 서기관
  rationale: 이 절의 번역 기준은 그리스어 증언이며, 직분 표지를 유지해야 1 Esdras의 독특한 묘사가 보존됩니다.
  doctrine_reference: 본문 비평과 정경 간 평행 본문 구분
