translation:
  language: ko
  text: 또 자못의 아들들 가운데서는 엘리아다스[a], 엘레이아세이모스, 오토니아스, 이아리못, 사바도스[b], 제랄리아스가 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 일부 이름은 히브리어 병행 전승과 다를 수 있으므로, 이 번역은 에스라/느헤미야와 조화시키지 않고 1 에스드라스의 그리스어 본문을 따릅니다.
    reason: alternative_reading
  - marker: b
    text: 제공된 본문 전사에는 경미한 불일치가 표시되어 있으므로, 몇몇 고유명사 표기는 보수적으로 음역했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ ἐκ τῶν υἱῶν
  english_pob_choice: And from the sons of
  chosen_korean: 그리고 …의 아들들 가운데서는
  alternatives_korean:
  - 그리고 …의 아들들 가운데서
  - 또 …의 아들들 중에서
  lexicon: LSJ
  rationale: ἐκ은 단순 소속보다 집합 안에서의 추출을 나타내므로, 명단 서두의 관용을 살려 ‘가운데서는’으로 옮겼습니다.
- source_word: Ζαμόθ
  english_pob_choice: Zamoth
  chosen_korean: 잠모스
  alternatives_korean:
  - 자모스
  - 자못
  lexicon: LSJ
  rationale: 그리스어 형태를 직접 음역하되, 한국어 표기에서는 자음군과 어미를 자연스럽게 처리해 현대 독자가 읽기 쉬운 형태로 옮겼습니다.
- source_word: Ἐλειάσειμος
  english_pob_choice: Eleiasimus
  chosen_korean: 엘레아시무스
  alternatives_korean:
  - 엘리아시무스
  - 엘레아세이무스
  lexicon: LSJ
  rationale: 드문 고유명사이므로 보이는 그리스어 철자 순서를 보수적으로 반영해 과도한 히브리어식 복원을 피했습니다.
- source_word: Ἰαριμώθ
  english_pob_choice: Jarimoth
  chosen_korean: 야리못
  alternatives_korean:
  - 자리못
  - 이아리못
  lexicon: LSJ
  rationale: 인명 첫 음절의 Ἰ-는 한국어 성경 관행에 따라 ‘야-’로 옮겨 가독성을 살렸습니다.
- source_word: Σάβαδος
  english_pob_choice: Sabados
  chosen_korean: 사바도스
  alternatives_korean:
  - 자바도스
  - 사바두스
  lexicon: LSJ
  rationale: 히브리어 병행본문과 무리하게 조화시키지 않고, 그리스어 증거 자체의 형태를 따라 음역했습니다.
theological_decisions:
- issue: 1 Esdras의 이름 목록을 병행본문과 맞추어 조정할지 여부
  chosen_reading: 그리스어 본문에 보이는 인명들을 그대로 음역해, 병행 전승과 다른 형태를 평탄화하지 않았습니다.
  alternative_readings:
