base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/028.yaml
  text: 'And from the sons of Zamoth: Eliadas[a], Eleiasimus, Othonias, Jarimoth, Sabados[b], and Zeralias.'
  footnotes:
  - marker: a
    text: Several names in this verse may reflect Greek forms that differ from the Hebrew parallel tradition; this translation follows the Greek text of 1 Esdras rather than harmonizing the list to Ezra/Nehemiah.
    reason: alternative_reading
  - marker: b
    text: Because the source transcription is flagged with a minor mismatch, some proper-name spellings remain slightly uncertain; the rendering here is a conservative transliteration of the Greek witness provided.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 잠모스의 아들들 가운데서는 엘리아다스, 엘레아시무스, 오토니아스, 야리못, 사바도스, 그리고 제랄리아스가 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 일부 이름은 히브리어 병행 전승과 다를 수 있으므로, 이 번역은 에스라/느헤미야와 조화시키지 않고 1 Esdras의 그리스어 본문을 따릅니다.
    reason: alternative_reading
  - marker: b
    text: 제공된 본문 전사에는 경미한 불일치가 표시되어 있으므로, 몇몇 고유명사 표기는 보수적으로 음역했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ ἐκ τῶν υἱῶν
  english_pob_choice: And from the sons of
  chosen_korean: 그리고 …의 아들들 가운데서는
  alternatives_korean:
  - 그리고 …의 아들들 가운데서
  - 또 …의 아들들 중에서
  lexicon: LSJ
  rationale: ἐκ은 단순 소속보다 집합 안에서의 추출을 나타내므로, 명단 서두의 관용을 살려 ‘가운데서는’으로 옮겼습니다.
- source_word: Ζαμόθ
  english_pob_choice: Zamoth
  chosen_korean: 잠모스
  alternatives_korean:
  - 자모스
  - 자못
  lexicon: LSJ
  rationale: 그리스어 형태를 직접 음역하되, 한국어 표기에서는 자음군과 어미를 자연스럽게 처리해 현대 독자가 읽기 쉬운 형태로 옮겼습니다.
- source_word: Ἐλειάσειμος
  english_pob_choice: Eleiasimus
  chosen_korean: 엘레아시무스
  alternatives_korean:
  - 엘리아시무스
  - 엘레아세이무스
  lexicon: LSJ
  rationale: 드문 고유명사이므로 보이는 그리스어 철자 순서를 보수적으로 반영해 과도한 히브리어식 복원을 피했습니다.
- source_word: Ἰαριμώθ
  english_pob_choice: Jarimoth
  chosen_korean: 야리못
  alternatives_korean:
  - 자리못
  - 이아리못
  lexicon: LSJ
  rationale: 인명 첫 음절의 Ἰ-는 한국어 성경 관행에 따라 ‘야-’로 옮겨 가독성을 살렸습니다.
- source_word: Σάβαδος
  english_pob_choice: Sabados
  chosen_korean: 사바도스
  alternatives_korean:
  - 자바도스
  - 사바두스
  lexicon: LSJ
  rationale: 히브리어 병행본문과 무리하게 조화시키지 않고, 그리스어 증거 자체의 형태를 따라 음역했습니다.
theological_decisions:
- issue: 1 Esdras의 이름 목록을 병행본문과 맞추어 조정할지 여부
  chosen_reading: 그리스어 본문에 보이는 인명들을 그대로 음역해, 병행 전승과 다른 형태를 평탄화하지 않았습니다.
  alternative_readings:
  - 에스라/느헤미야의 익숙한 이름형으로 조정
  - 히브리어 병행을 따라 의미상 대응 인명으로 환원
  rationale: 이 단락은 인명 목록이 핵심이므로, 전승 차이 자체를 가리면 본문 증거를 흐리게 됩니다. POB의 주석 취지에 맞게 그리스어 본문을 우선했습니다.
  doctrine_reference: 본문 비평 및 정경 전승 차이
