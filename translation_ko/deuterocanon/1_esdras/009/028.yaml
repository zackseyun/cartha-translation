  - 히브리어 병행을 따라 의미상 대응 인명으로 환원
  rationale: 이 단락은 인명 목록이 핵심이므로, 전승 차이 자체를 가리면 본문 증거를 흐리게 됩니다. POB의 주석 취지에 맞게 그리스어 본문을 우선했습니다.
