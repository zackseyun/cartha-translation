base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/010.yaml
  text: And the whole assembly cried out and said with a loud voice[a], “So, as you have said[b], we will do.”
  footnotes:
  - marker: a
    text: Or “all the multitude” or “the whole crowd.”
    reason: lexical_alternative
  - marker: b
