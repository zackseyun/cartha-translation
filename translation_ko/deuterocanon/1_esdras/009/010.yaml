    rationale: 각주는 해당 어구 바로 뒤에 두는 편이 독자에게 분명합니다. b는 완료형 εἴρηκας에 해당하므로 ‘말씀하신 대로’와 ‘말한 대로’의 번역 가능성을 설명해야 합니다.
