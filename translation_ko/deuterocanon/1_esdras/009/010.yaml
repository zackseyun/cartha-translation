base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/010.yaml
  text: And the whole assembly cried out and said with a loud voice[a], “So, as you have said[b], we will do.”
  footnotes:
  - marker: a
    text: Or “all the multitude” or “the whole crowd.”
    reason: lexical_alternative
  - marker: b
    text: The Greek reads “as you have said”; English could also be rendered “as you said.”
    reason: lexical_alternative
translation:
  language: ko
  text: 온 회중이 큰 소리로 외쳐 말했습니다. 「그대로, 당신이 말씀하신 대로 우리가 하겠습니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “온 무리” 또는 “온 군중”입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 “당신이 말한 대로”로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν τὸ πλῆθος
  english_pob_choice: the whole assembly
  chosen_korean: 온 회중
  alternatives_korean:
  - 모든 무리
  - 온 군중
  lexicon: BDAG
  rationale: 공적이고 조직된 공동체의 응답이므로, 단순한 ‘군중’보다 ‘회중’이 장면의 성격을 더 잘 드러냅니다.
- source_word: ἐφώνησαν
  english_pob_choice: cried out
  chosen_korean: 외쳐
  alternatives_korean:
  - 불러
  - 소리쳐
  lexicon: BDAG
  rationale: 공개적으로 큰 소리로 응답하는 동작을 자연스럽게 살리기 위해 ‘외치다’를 택했습니다.
- source_word: μεγάλῃ τῇ φωνῇ
  english_pob_choice: with a loud voice
  chosen_korean: 큰 소리로
  alternatives_korean:
  - 높은 목소리로
  - 큰 목소리로
  lexicon: BDAG
  rationale: 그리스어 관용구를 한국어로 직역에 가깝게 옮기되, 현대 문장으로 자연스럽게 다듬었습니다.
- source_word: ὡς εἴρηκας
  english_pob_choice: as you have said
  chosen_korean: 당신이 말씀하신 대로
  alternatives_korean:
  - 당신이 말한 대로
  - 당신이 말씀하신 것처럼
  lexicon: BDAG
  rationale: 완료형의 지속적 효력을 살리면서도 한국어에서는 ‘말씀하신 대로’가 가장 직접적이고 문맥에 맞습니다.
theological_decisions:
- issue: 공동체의 동의 표현 방식
  chosen_reading: ‘그대로, 당신이 말씀하신 대로 우리가 하겠습니다’로 응답의 결단을 분명히 표현했습니다.
  alternative_readings:
  - ‘그대로 하겠습니다’
  - ‘당신이 말씀하신 대로 하겠습니다’
  rationale: 본문은 제안에 대한 공개적 동의와 결의를 함께 담고 있으므로, 둘을 병렬로 살려 응답의 강도를 유지했습니다.
  doctrine_reference: 번역 원칙 §1, §6
