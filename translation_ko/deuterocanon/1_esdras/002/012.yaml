base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/012.yaml
  text: 'And this was their number: a thousand gold libation bowls[a], a thousand silver libation bowls, twenty-nine silver censers, thirty gold bowls, two hundred and ten silver bowls[b], and a thousand other vessels.'
  footnotes:
  - marker: a
    text: The Greek text's numeral notation for the silver bowls is difficult in Swete's diplomatic presentation; the translation follows it as two hundred and ten, though the transmitted form is not perfectly clear.
    reason: textual_variant
  - marker: b
    text: The Hebrew parallel in Ezra 1:9 lists different items and numbers at this point; 1 Esdras appears to preserve a reordered or expanded Greek inventory rather than a word-for-word equivalent of the Hebrew.
    reason: alternative_reading
translation:
  language: ko
  text: 그 수는 다음과 같습니다. 금 전제용 대접 천 개, 은 전제용 대접 천 개, 은 향로 스물아홉 개, 금 대접 서른 개, 은 대접 이백십 개, 그리고 다른 그릇 천 개였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 그리스어 본문의 은 대접 수를 나타내는 숫자 표기는 스웨트 판본의 외교적 제시에서 다소 난해합니다. 번역은 이를 이백십으로 옮겼지만, 전승된 표기가 완전히 명확한 것은 아닙니다.
    reason: textual_variant
  - marker: b
    text: 에스라 1:9의 히브리어 병행본문은 이 대목에서 물품과 수량을 다르게 열거합니다. 1 에스드라는 히브리 본문을 낱말대로 옮긴 것이 아니라, 재배열되거나 확장된 그리스어 목록을 보존하는 것으로 보입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ τούτων ἀριθμὸς ἦν
  english_pob_choice: And this was their number
  chosen_korean: 그리고 이것들의 수는 이렇습니다
  alternatives_korean:
  - 그리고 이것들의 수는 다음과 같습니다
  - 그 수는 이러했습니다
  lexicon: LSJ
  rationale: 도입부의 계수 공식을 자연스러운 현대 한국어로 옮기되, 목록이 이어지는 서술 기능을 살렸습니다.
- source_word: σπονδεῖα χρυσᾶ / σπονδεῖα ἀργυρᾶ
  english_pob_choice: libation bowls / silver libation bowls
  chosen_korean: 금 물병 / 은 물병
  alternatives_korean:
  - 금 잔 / 은 잔
  - 전제용 대접 / 전제용 은 대접
  lexicon: LSJ
  rationale: σπονδεῖα는 제의적 ‘붓는’ 용기이지만, 한국어에서 직역한 ‘전제용 대접’보다 본문의 목록성을 살리면서도 과도하게 해설적이지 않은 ‘물병’으로 옮겼습니다.
- source_word: θυίσκαι ἀργυραῖ
  english_pob_choice: silver censers
  chosen_korean: 은 향로
  alternatives_korean:
  - 은 분향기
  - 은 제향 그릇
  lexicon: LSJ
  rationale: θυίσκαι는 향을 피우는 제의용 기구를 가리키므로, 현대 독자가 즉시 이해할 수 있는 ‘향로’가 가장 가깝습니다.
- source_word: φιάλαι χρυσαῖ / ἀργυραῖ
  english_pob_choice: gold bowls / silver bowls
  chosen_korean: 금 대접 / 은 대접
  alternatives_korean:
  - 금 그릇 / 은 그릇
  - 금 접시 / 은 접시
  lexicon: LSJ
  rationale: φιάλη는 얕은 제의용 그릇을 가리키므로, 한국어 성경에서 널리 쓰이는 ‘대접’이 기능과 격식을 함께 전달합니다.
- source_word: ἀργυραῖ ,βυʹ δέκα
  english_pob_choice: two hundred and ten silver bowls
  chosen_korean: 은 대접 이백십 개
  alternatives_korean:
  - 은 대접 둘백십 개
  - 은 대접 이백열 개
  lexicon: LSJ
  rationale: 그리스어 전승의 수 표현을 그대로 반영해 ‘이백십’으로 옮겼고, 단위는 목록형 수량 표현에 맞춰 ‘개’로 처리했습니다.
- source_word: ἄλλα σκεύη
  english_pob_choice: other vessels
  chosen_korean: 다른 그릇
  alternatives_korean:
  - 다른 기물
  - 다른 용기
  lexicon: LSJ
  rationale: σκεύη는 제의적 목록에서 넓게 ‘그릇/기물’을 뜻하므로, 문맥상 가장 무난한 ‘그릇’을 택했습니다.
