  alternative_readings:
  - 전제용 대접, 분향용 향로, 제사용 그릇처럼 기능을 모두 풀어 쓰는 방식
  rationale: 이 절은 신학적 논설보다 성전/예배 기물의 수량 보고가 핵심이므로, 본문의 목록성과 절제된 문체를 유지하는 편이 원문 효과에 더 가깝습니다.
  doctrine_reference: 문맥 우선 원칙
