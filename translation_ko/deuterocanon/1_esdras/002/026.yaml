base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/026.yaml
  text: They began to hinder those who were building[a], and the building of the temple in Jerusalem was stopped until the second year of the reign of Darius, king of the Persians.
  footnotes:
  - marker: a
    text: Or 'ceased' or 'lay idle'; the Greek verb indicates that the temple-building work came to a halt.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그 건축자들을 방해하기 시작했고, 예루살렘에 있는 성전의 건축은 페르시아 왕 다리우스의 통치 제2년까지 중단되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘막기 시작했습니다’, ‘저지하기 시작했습니다’. κωλύειν은 건축을 적극적으로 방해하는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο κωλύειν
  english_pob_choice: They began to hinder
  chosen_korean: 방해하기 시작했고
  alternatives_korean:
  - 막기 시작했고
  - 저지하기 시작했고
  lexicon: BDAG
  rationale: ἤρξαντο와 κωλύειν의 결합은 단순한 방해가 아니라 ‘방해하기 시작하다’라는 개시적 뉘앙스를 가지므로, 둘을 함께 살려 옮겼습니다.
- source_word: τοὺς οἰκοδομοῦντας
  english_pob_choice: those who were building
  chosen_korean: 그 건축자들을
  alternatives_korean:
  - 건축하고 있던 이들을
  - 공사하던 사람들을
  lexicon: BDAG
  rationale: 현재분사는 진행 중인 행위를 가리키지만 한국어에서는 간결성과 문맥상 자연스러움을 위해 ‘건축자들’로 옮기되, 동사적 진행 의미는 앞의 ‘방해하기 시작했고’가 보완합니다.
- source_word: ἤργει ἡ οἰκοδομὴ
  english_pob_choice: the building ... was stopped
  chosen_korean: 성전의 건축은 ... 중단되었습니다
  alternatives_korean:
  - 성전 건축은 ... 멈추었습니다
  - 성전의 건축은 ... 쉬게 되었습니다
  lexicon: BDAG
  rationale: ἤργει는 작업이 실제로 멈추어 더 진행되지 않는 상태를 뜻하므로, 문어체 한국어에서 자연스럽고 결과를 분명히 드러내는 ‘중단되었습니다’를 택했습니다.
- source_word: τοῦ ἱεροῦ τοῦ ἐν Ἰερουσαλήμ
  english_pob_choice: of the temple in Jerusalem
  chosen_korean: 예루살렘에 있는 성전의
  alternatives_korean:
  - 예루살렘에 있는 성전의
  - 예루살렘의 성전 건축이
  lexicon: BDAG
  rationale: ἱερόν은 성전 복합체를 가리키므로 전통적 ‘성전’을 유지했고, 위치 표시인 τοῦ ἐν Ἰερουσαλήμ은 ‘예루살렘에 있는’으로 자연스럽게 처리했습니다.
- source_word: τῆς βασιλείας Δαρείου τοῦ Περσῶν βασιλέως
  english_pob_choice: of the reign of Darius, king of the Persians
  chosen_korean: 페르시아 왕 다리우스의 통치 제2년까지
  alternatives_korean:
  - 페르시아 왕 다리우스의 통치 제2년까지
  - 페르시아인의 왕 다리우스의 통치 제2년까지
  lexicon: BDAG
  rationale: βασιλεία는 여기서 나라가 아니라 왕권/통치를 뜻하므로 ‘통치’로 옮겼고, τοῦ Περσῶν βασιλέως는 한국어 관용에 맞게 ‘페르시아 왕 다리우스’로 정리했습니다.
theological_decisions:
- issue: 성전 건축의 중단 상태를 어떻게 표현할지
  chosen_reading: 단순히 ‘멈췄다’보다 공적·서술적 문맥에 맞는 ‘중단되었습니다’를 사용했습니다.
  alternative_readings:
  - 멈추었습니다
  - 쉬게 되었습니다
  rationale: 본문은 실제 작업의 정지와 지속적 중단을 말하므로, 결과 상태를 분명히 전달하는 표현이 가장 적합합니다.
  doctrine_reference: 서술적 역사 본문의 명료성
