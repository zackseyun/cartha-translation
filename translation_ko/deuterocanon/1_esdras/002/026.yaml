  source_fidelity: 첫 절은 ἤρξαντο κωλύειν의 개시 의미를 적절히 살렸고, 성전 건축이 다리우스 통치 제2년까지 멈춘 상태였다는 핵심도 대체로 정확합니다. 다만 τοὺς οἰκοδομοῦντας는 단순 직업명보다 ‘건축하고 있는 이들’로 옮기는 편이 현재분사의 진행성을 더 충실히 반영합니다. ἤργει의 미완료적 지속 상태는 ‘중단된 채 있었습니다’로 더 분명히 드러낼 수 있습니다.
