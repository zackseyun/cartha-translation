  source_fidelity: 그리스어의 수동 동사 ἀνηνέχθη, 행위자 ὑπὸ Σαμανασσάρου, 동반 대상, 출발지와 목적지는 모두 반영되어 있습니다. 다만 ‘올라왔습니다’만으로는 수동의 운반 행위가 충분히 드러나지 않고, ‘사마나사르에 의해 … 함께 올라왔습니다’는 한국어 문장 결속이 다소 부자연스럽습니다.
