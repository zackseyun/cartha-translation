base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/014.yaml
  text: and it was brought up by Sheshbazzar together with those from the captivity[b][a], from Babylon to Jerusalem.
  footnotes:
  - marker: a
    text: 'Greek: ''by Samanassar.'' The name is rendered ''Sheshbazzar'' here in light of the Hebrew parallel and the corresponding Ezra context identifying the same official.'
