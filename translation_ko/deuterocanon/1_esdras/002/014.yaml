  terminology: 그리스어 본문을 우선하여 인명은 ‘사마나사르’로 유지하는 것이 안전합니다. ‘포로 생활에서 나온 사람들’은 ἐκ τῆς αἰχμαλωσίας를 충실하게 옮깁니다. 주어가 앞 문맥의 단수 사물을 가리킨다는 점은 본문에 ‘그것은’으로 보존하되, 추정되는 물건의 종류를 본문에 보충하지 않습니다.
