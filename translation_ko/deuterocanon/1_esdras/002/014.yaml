translation:
  language: ko
  text: 그리고 그것은 사마나사르에 의해, 바빌론에서 예루살렘으로 포로 생활에서 나온 사람들과 함께 올라왔습니다.¹[1]
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: 그리스어 본문은 인명을 ‘사마나사르’로 적습니다. 영어 POB는 히브리어 평행본문과 에스라 본문의 대응을 따라 ‘Sheshbazzar’로 조정했습니다.
    reason: source_note
lexical_decisions:
- source_word: ἀνηνέχθη
  english_pob_choice: was brought up
  chosen_korean: 올라왔습니다
  alternatives_korean:
  - 가져와졌습니다
  - 옮겨졌습니다
  - 끌려왔습니다
  lexicon: BDAG
  rationale: ἀναφέρω의 수동형을 한국어에서 자연스럽게 살리면서, 예루살렘으로 ‘올라감’이라는 성경적 방향성을 유지하기 위해 ‘올라왔습니다’로 옮겼습니다.
- source_word: ὑπὸ Σαμανασσάρου
  english_pob_choice: by Sheshbazzar
  chosen_korean: 사마나사르에 의해
  alternatives_korean:
  - 세스바살에 의해
  - 스헤스바살에 의해
  lexicon: Lexham Analytical Lexicon of the Septuagint
  rationale: 본문의 그리스어 이름 형태를 우선 반영해 음역했고, 본문 자체의 증언을 한국어로 투명하게 드러내기 위해 영어판의 조정형 이름을 따르지 않았습니다.
- source_word: ἅμα τοῖς ἐκ τῆς αἰχμαλωσίας
  english_pob_choice: together with those from the captivity
  chosen_korean: 포로 생활에서 나온 사람들과 함께
  alternatives_korean:
  - 포로에서 나온 자들과 함께
  - 사로잡힘에서 나온 사람들과 함께
  lexicon: BDAG
  rationale: ἅμα는 ‘함께’를, αἰχμαλωσία는 ‘포로/포로 생활’을 뜻하므로, 한국어에서는 출신 상태를 자연스럽게 풀어 ‘포로 생활에서 나온 사람들’로 옮겼습니다.
- source_word: εἰς Ἱερουσαλήμ
  english_pob_choice: to Jerusalem
  chosen_korean: 예루살렘으로
  alternatives_korean:
  - 예루살렘 안으로
  - 예루살렘에
  lexicon: BDAG
  rationale: 목적지 방향을 분명히 하는 전치사 εἰς를 한국어 조사 ‘-으로’로 처리했습니다.
theological_decisions:
- issue: 이 구절의 주어 생략과 대상 지시
  chosen_reading: 앞 절에서 이어지는 단수 사물이 암시되므로, 한국어에서도 목적어를 새로 덧붙이지 않고 ‘그것은’으로 처리했습니다.
  alternative_readings:
  - 그것이 운반되었습니다
  - 성전 기물이 운반되었습니다
  rationale: 영어판의 주석처럼 그리스어는 이곳에서 명시적 명사를 반복하지 않으므로, 본문이 암시하는 단수 대상을 유지하는 편이 소스에 더 충실합니다.
  doctrine_reference: source alignment / discourse coherence
- issue: 사마나사르의 인명 처리
  chosen_reading: 그리스어 표기 Σαμανασσάρου를 따라 ‘사마나사르’로 음역했습니다.
  alternative_readings:
  - 세스바살
  - 스룹바벨
  rationale: 이 절의 본문 증거는 그리스어이며, 히브리어 평행본문은 참고용입니다. 따라서 한국어 본문은 우선 그리스어 이름 형태를 반영하고, 동일 인물의 식별 문제는 주해 단계에서 다루는 것이 적절합니다.
  doctrine_reference: translation hierarchy / source primacy
