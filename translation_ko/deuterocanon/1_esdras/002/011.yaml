base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/011.yaml
  text: And through him they were handed over to Sanamassar[c][b][a], governor of Judea.
  footnotes:
  - marker: a
    text: Sanamassar is the Greek form of the official named Sheshbazzar in the Hebrew parallel (Ezra 1:8).
    reason: alternative_reading
  - marker: b
    text: Or 'by his hand,' emphasizing agency in the transfer.
    reason: lexical_alternative
  - marker: c
    text: Greek 'Judea'; the Hebrew parallel has 'Judah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그를 통해 그들은 사마나사르에게 넘겨졌는데, 그는 유대의 총독이었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 이름 Σαναμασσάρῳ는 히브리어 병행본문의 셋스바살에 해당합니다.
    reason: alternative_reading
  - marker: b
    text: ‘그를 통해’는 ‘그의 손으로’라는 뜻도 될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 그리스어는 ‘유대’라고 하고, 히브리어 병행본문은 ‘유다’라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ δὲ τούτου
  english_pob_choice: through him
  chosen_korean: 그를 통해
  alternatives_korean:
  - 그의 손으로
  - 이 사람을 통해
  lexicon: LSJ
  rationale: 중개·수단의 의미를 자연스러운 한국어로 옮기되, 행위의 매개성을 유지했습니다.
- source_word: παρεδόθησαν
  english_pob_choice: were handed over
  chosen_korean: 넘겨졌는데
  alternatives_korean:
  - 건네졌는데
  - 인도되었는데
  lexicon: BDAG
  rationale: 수동태의 ‘인계·이양’ 의미를 살리면서, 이전 문맥의 물건/권한이 옮겨지는 느낌을 한국어로 간결하게 표현했습니다.
- source_word: Σαναμασσάρῳ
  english_pob_choice: Sanamassar
  chosen_korean: 사마나사르
  alternatives_korean:
  - 사나마사르
  - 산마사르
  lexicon: 음역(그리스어형 기준)
  rationale: 본문의 그리스어 형태를 따르되, 한글 음역으로 옮겼습니다. 히브리어 병행본문의 셋스바살과는 주석에서 구분합니다.
- source_word: προστάτῃ
  english_pob_choice: governor
  chosen_korean: 총독
  alternatives_korean:
  - 지도자
  - 수호자
  - 우두머리
  lexicon: LSJ
  rationale: 행정·공적 직책을 가리키는 문맥이므로, 현대 한국어에서 그 기능을 가장 분명히 드러내는 ‘총독’을 택했습니다.
- source_word: τῆς Ἰουδαίας
  english_pob_choice: of Judea
  chosen_korean: 유대의
  alternatives_korean:
  - 유대 지역의
  - 유다의
  lexicon: LSJ
  rationale: 그리스어 지명 Ἰουδαία를 ‘유대’로 옮겨 병행본문의 ‘유다’와 구별되게 하되, 한국어에서 자연스럽게 소유격으로 연결했습니다.
theological_decisions:
- issue: 지명 Ἰουδαία를 ‘유대’로 유지할지 병행본문의 ‘유다’로 조정할지
  chosen_reading: 본문은 그리스어 우선 원칙에 따라 ‘유대’로 번역하고, 병행본문 차이는 주석으로 처리합니다.
  alternative_readings:
  - 유다
  - 유대 지방
  rationale: 이 절의 주된 증거는 그리스어이며, 히브리어 병행본문은 ‘유다’이지만 1 Esdras의 그리스어 본문 자체가 가리키는 지역명은 ‘유대’입니다.
  doctrine_reference: source-criticism / textual basis
