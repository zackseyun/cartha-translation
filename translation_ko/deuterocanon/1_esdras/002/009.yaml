translation:
  language: ko
  text: 그리고 고레스 왕은 주님의 거룩한 기물들을 꺼내어, 느부갓네살이 예루살렘에서 가져다가 자기 신의 집에 두었던 그것들을 내놓았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 εἰδώλιον은 ‘우상’ 또는 ‘우상당/우상집’의 뉘앙스를 가질 수 있습니다. 히브리어 병행본문은 ‘그의 신의 집’으로 읽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξήνεγκεν
  english_pob_choice: brought out
  chosen_korean: 꺼내어
  alternatives_korean:
  - 가져다 내어
  - 내놓아
  - 꺼내 놓아
  lexicon: BDAG
  rationale: 문맥상 왕이 보관 중인 성전 기물을 밖으로 꺼내어 제시하는 뜻이므로, 현대 한국어에서는 자연스러운 ‘꺼내어’가 원문의 동작과 유사한 효과를 가장 잘 살립니다.
- source_word: τὰ ἅγια σκεύη
  english_pob_choice: the holy vessels
  chosen_korean: 주님의 거룩한 기물들
  alternatives_korean:
  - 주님의 거룩한 그릇들
  - 거룩한 그릇들
  - 성스러운 기물들
  lexicon: BDAG
  rationale: σκεύη는 단순한 그릇보다 성전용 기물 전체를 가리킬 수 있어 ‘기물들’이 더 넓고 정확합니다. ἅγια는 단순한 물건이 아니라 성별된 것임을 나타내므로 ‘거룩한’을 유지했습니다.
- source_word: τοῦ κυρίου
  english_pob_choice: of the Lord
  chosen_korean: 주님의
  alternatives_korean:
  - 주님의 것인
  - 주께 속한
  - 주(主)의
  lexicon: BDAG
  rationale: 문맥상 이 기물들은 이스라엘의 하나님께 속한 성전 기물이므로, 프로젝트 기본값에 따라 ‘주님’으로 옮겼습니다.
- source_word: ἐν τῷ εἰδώλιῳ αὐτοῦ
  english_pob_choice: in the house of his god
  chosen_korean: 자기 신의 집에
  alternatives_korean:
  - 자기 우상의 집에
  - 자기 우상당에
  - 자기 신전 안에
  lexicon: LSJ
  rationale: 주본문의 Greek은 εἰδώλιον이라 더 날카로운 ‘우상/우상당’ 뉘앙스를 띨 수 있으나, 병행 히브리어와 서술 기능을 고려하면 ‘자기 신의 집’이 본문 의미를 가장 잘 전달합니다.
theological_decisions:
- issue: κύριος를 한국어로 어떻게 표시할지
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 야훼
  rationale: 이 절의 κύριος는 성전 기물의 소유주를 가리키는 칭호로 쓰였고, 본문 자체는 인용 형식의 야훼 표지가 아니라 일반 호칭입니다. 따라서 원칙에 따라 ‘주님’을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: κύριος 기본값'
- issue: εἰδώλιον의 강한 우상성 뉘앙스를 본문에 얼마나 반영할지
  chosen_reading: 자기 신의 집에
  alternative_readings:
  - 자기 우상의 집에
  - 자기 우상 신전에
  rationale: 히브리어 병행본문은 ‘그의 신의 집’이라고 하므로, 본문에는 과도한 해석어를 넣지 않고 병행 증거와 조화되는 표현을 택했습니다. 다만 Greek의 sharper nuance는 lexical decision에 반영했습니다.
  doctrine_reference: 병행본문 우선 원칙
