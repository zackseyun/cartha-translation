revisions:
- from: 그리고 고레스 왕은 주님의 거룩한 기물들을 꺼내어, 느부갓네살이 예루살렘에서 가져다가 자기 신의 집에 두었던 그것들을 내놓았습니다.[a]
  to: 그리고 고레스 왕은 주님의 거룩한 기물들을 꺼내었습니다. 그것들은 느부갓네살이 예루살렘에서 가져가 자기 신의 집에 두었던 것들입니다.[a]
  rationale: 원문의 ἐξήνεγκεν은 ‘꺼내었습니다’로 한 번만 번역하여 중복을 제거했습니다. 두 문장으로 나누어 관계절의 긴 수식을 자연스러운 한국어로 처리하되, 느부갓네살이 기물들을 예루살렘에서 옮겨 자기 신의 집에 두었다는 원문의 내용을 보존했습니다. εἰδώλιον의 해석상 긴장은 본문에서 과도하게 결정하지 않고 각주에 남겼습니다.
  reviewer_model: gpt-5.6-terra
