  source_fidelity: 그리스어의 동작 순서와 관계절은 대체로 충실히 반영되었습니다. 다만 초안의 ‘꺼내어 … 내놓았습니다’는 ἐξήνεγκεν 하나를 두 동작으로 중복 번역하는 셈이므로, 한 동사로 옮기는 것이 정확합니다. ‘자기 신의 집’은 히브리어 병행본문과 영어 POB의 본문 선택에 부합하며, 그리스어 εἰδώλιον의 ‘우상/우상 신전’ 뉘앙스는 각주로 보존하는 것이 안전합니다.
  naturalness: ‘꺼내어 … 내놓았습니다’는 한국어에서도 다소 중복적입니다. ‘꺼내었습니다’로 고치면 현대 표준어 합쇼체로 자연스럽고 간결합니다. ‘기물들’과 ‘자기 신의 집’은 이 문맥에서 자연스럽습니다.
  terminology: ‘주님의 거룩한 기물들’은 τὰ ἅγια σκεύη τοῦ κυρίου를 적절히 반영합니다. 고유명사 ‘고레스’, ‘느부갓네살’, ‘예루살렘’도 적절합니다. 각주의 ‘우상당/우상집’은 다소 비표준적이거나 어색할 수 있으므로 ‘우상 신전’ 또는 ‘우상의 집’으로 다듬는 것이 좋습니다.
