base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/017.yaml
  text: And now let it be known to my lord the king that the Judeans who came up from you to us have come to Jerusalem and are living in that rebellious and wicked city[a]; they are repairing its marketplaces and walls[c][b], and are laying the foundation of a temple.
  footnotes:
  - marker: a
    text: Or 'the Jews.' The Greek Ἰουδαῖοι can denote Judeans in an ethnogeographic sense or Jews more broadly.
    reason: lexical_alternative
  - marker: b
    text: Greek 'marketplaces' or 'public squares'; some parallel traditions in Ezra emphasize the rebuilding of the city rather than specifically its market areas.
    reason: alternative_reading
  - marker: c
    text: Or 'are undertaking/rebuilding the temple.' The Greek phrase is somewhat compressed and may refer to beginning temple construction, especially laying its substructure.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 내 주 왕께서는 아시기 바랍니다. 왕께로부터 우리에게 올라온 유다인들[a]이 예루살렘에 이르러 그 반역적이고 악한 성읍에 살면서, 그 성읍의 장터들[b]과 성벽을 수리하고 성전의 기초를 놓고 있습니다.[c]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 또는 ‘유대인들’. 그리스어 Ἰουδαῖοι는 유다/유대의 주민이라는 민족지리적 의미로도, 더 넓게는 유대인 전체를 가리키는 의미로도 쓰일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘광장들’ 또는 ‘공공 시장들’. 그리스어 ἀγορά는 장터 또는 공공 광장을 가리킵니다. 에스라의 일부 평행 전승은 도시 재건을 더 일반적으로 표현합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘성전 건축을 시작하고 있습니다’ 또는 ‘성전을 세우기 시작하고 있습니다’. 그리스어 ὑποβάλλονται는 압축된 표현으로, 특히 기초 공사를 시작하는 일을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ κυρίῳ βασιλεῖ
  english_pob_choice: to my lord the king
  chosen_korean: 내 주 왕께
  alternatives_korean:
  - 왕에게
  - 주 왕께
  - 임금님께
  lexicon: LSJ
  rationale: 여기서 κύριος는 신적 호칭이 아니라 페르시아 궁정의 예우적 호칭이므로, 한국어에서도 인간 왕에게 대한 공식적 존칭으로 옮겼습니다.
- source_word: Ἰουδαῖοι
  english_pob_choice: the Judeans
  chosen_korean: 유다인들
  alternatives_korean:
  - 유대인들
  - 유다 사람들
  lexicon: LSJ
  rationale: 페르시아 시대의 지리·민족적 범주를 살리기 위해 ‘유다인들’로 옮겨, 단순한 종교 집단명처럼 들릴 수 있는 표현을 피했습니다.
- source_word: ἀγοράς
  english_pob_choice: marketplaces
  chosen_korean: 거리들
  alternatives_korean:
  - 시장들
  - 광장들
  - 장터들
  lexicon: LSJ
  rationale: 본문의 행정적 고발 문맥에서 ἀγορά가 공공의 거리/광장 영역을 가리킬 수 있으므로, 한국어에서는 자연스러운 공적 공간 표현으로 ‘거리들’을 택했습니다.
- source_word: θεραπεύουσιν
  english_pob_choice: are repairing
  chosen_korean: 수리하고 있으며
  alternatives_korean:
  - 복구하고 있으며
  - 보수하고 있으며
  - 고치고 있으며
  lexicon: LSJ
  rationale: 이 동사는 단순히 ‘건설하다’보다 손상된 것을 손보는 의미가 강하므로, 성벽과 공공 공간에 대한 실제 복구 작업을 드러내는 ‘수리하다’로 옮겼습니다.
- source_word: ναὸν ὑποβάλλονται
  english_pob_choice: are laying the foundation of a temple
  chosen_korean: 성전을 놓고 있습니다
  alternatives_korean:
  - 성전의 기초를 놓고 있습니다
  - 성전을 세우기 시작하고 있습니다
  - 성전 건축을 시작하고 있습니다
  lexicon: LSJ
  rationale: 그리스어는 성전 공사의 착수를 압축적으로 말하므로, 과도하게 해석을 늘리지 않으면서도 공사 개시를 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘유다인들’과 ‘성전’의 역사적-서술적 지시
  chosen_reading: 이 절은 종교적 선언이 아니라 제국 관리의 고발 서한이므로, 민족명과 건축 행위를 역사적·행정적 의미로 평이하게 옮겼습니다.
  alternative_readings:
  - ‘유대인들’로 옮겨 보다 익숙한 교회 언어를 따르는 방식
  - ‘성전’을 ‘신전’으로 일반화하는 방식
  rationale: 본문의 목적은 예루살렘 공동체를 반역적 도시와 연결해 보고하는 것입니다. 따라서 후대의 교회적 어휘보다 본문이 주는 행정적 긴장과 역사성을 보존하는 것이 타당합니다.
  doctrine_reference: 'DOCTRINE.md: historical sense first; preserve source-level tensions and administrative registers.'
