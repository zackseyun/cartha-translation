revisions:
- from: 이제 내 주 왕께 알리시기 바랍니다. 유다인들 곧 당신에게서 우리에게 올라와 예루살렘에 이른 자들이 그 반역적이고 악한 성읍에 살고 있으며, 그 성읍의 거리들과 성벽을 수리하고 있으며, 성전을 놓고 있습니다.[a][b][c]
  to: 이제 내 주 왕께서는 아시기 바랍니다. 왕께로부터 우리에게 올라온 유다인들[a]이 예루살렘에 이르러 그 반역적이고 악한 성읍에 살면서, 그 성읍의 장터들[b]과 성벽을 수리하고 성전의 기초를 놓고 있습니다.[c]
  rationale: 그리스어 본문을 우선하여 ἀγοράς의 시장·광장 의미를 ‘장터들’로 회복하고, ναὸν ὑποβάλλονται의 건축 착수 의미를 자연스러운 한국어인 ‘성전의 기초를 놓고 있습니다’로 명시했습니다. ‘유다인들’과 궁정식 호칭 ‘내 주 왕’은 유지했습니다. 개정은 특정 교리적 해석을 더하지 않으며, 고발 서한의 공식적 어조와 원문의 표현상 압축성을 보존합니다.
