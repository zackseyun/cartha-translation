base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/006.yaml
  text: Therefore[a], as many as live in the various places, let the men in his place help him with gold and silver, with gifts, with horses and livestock[b], along with the other things added as vowed offerings for the temple of the Lord in Jerusalem.
  footnotes:
  - marker: a
    text: 'Greek: ''with horses and livestock.'' The Hebrew parallel in Ezra 1:4/1:6 differs, reading terms for goods/property and cattle rather than ''horses.'' The main text follows the Greek witness of 1 Esdras.'
    reason: alternative_reading
  - marker: b
    text: Or 'for the temple of the Lord.' Greek ἱερόν can mean 'temple' or 'sanctuary'; 'house of the Lord' reflects the Jerusalem-temple sense and aligns with the Hebrew parallel's wording.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 어느 지역에 살든지, 그가 사는 곳의 사람들은 금과 은과 선물과 말과 가축[b]으로 그를 도와주고, 그 밖에 예루살렘에 있는 주님의 성전을 위하여 서원에 따라 더해진 다른 것들도 보태 주어야 합니다.
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: b
    text: 그리스어는 ‘말과 가축’이라고 읽습니다. 히브리어 병행 본문(에스라 1:4, 6)은 ‘말’ 대신 재산이나 물품 및 가축에 해당하는 표현을 사용합니다. 본문은 1 에스드라의 그리스어 본문을 따랐습니다.
    reason: 그리스어 본문과 히브리어 병행 본문의 관련 차이를 명확히 하면서, 본문이 그리스어를 번역 기준으로 삼는다는 점을 밝힙니다.
lexical_decisions:
- source_word: ὅσοι οὖν
  english_pob_choice: Therefore, as many as
  chosen_korean: 그러므로 각 지역에 사는 사람들은
  alternatives_korean:
  - 그러므로 누구든지
  - 그러므로 모든 사람은
  lexicon: LSJ
  rationale: ὅσοι의 분배적 의미와 οὖν의 추론 연결을 함께 살리기 위해, 자연스러운 한국어로 ‘각 지역에 사는 사람들’과 ‘그러므로’를 결합했습니다.
- source_word: οἱ ἐν τῷ τόπῳ αὐτοῦ
  english_pob_choice: the men in his place
  chosen_korean: 자기 지역의 사람들이
  alternatives_korean:
  - 그곳에 있는 사람들
  - 그 지역의 남자들이
  lexicon: LSJ
  rationale: 직역의 ‘그의 장소에 있는 남자들’은 한국어에서 부자연스러워, 문맥상 그 지역의 주민들을 가리키는 뜻을 살려 자연스럽게 옮겼습니다.
- source_word: μεθʼ ἵππων καὶ κτηνῶν
  english_pob_choice: with horses and livestock
  chosen_korean: 말과 가축으로
  alternatives_korean:
  - 말과 짐승으로
  - 말과 가축과 함께
  lexicon: LSJ
  rationale: ἵππων과 κτηνῶν을 각각 ‘말’과 ‘가축’으로 옮겨 Greek 증거를 그대로 반영했고, 수단·동반의 ἐν/μετά 감각은 조사 ‘-으로’로 처리했습니다.
- source_word: εἰς τὸ ἱερὸν τοῦ κυρίου
  english_pob_choice: for the house/temple of the Lord
  chosen_korean: 주님의 성전을 위해
  alternatives_korean:
  - 주님의 집을 위해
  - 주님의 성소를 위해
  lexicon: LSJ
  rationale: ἱερόν은 이 문맥에서 예루살렘 성전을 가리키므로 ‘성전’을 택했고, κυρίου는 프로젝트 기본값에 따라 ‘주님’으로 옮겼습니다.
- source_word: τοῖς κατʼ εὐχὰς προστεθειμένοις
  english_pob_choice: added as vowed offerings
  chosen_korean: 서원하여 더 보탠 것들
  alternatives_korean:
  - 서원한 봉헌물
  - 서원으로 더한 것들
  lexicon: LSJ
  rationale: εὐχή의 서원 의미와 προστεθειμένοις의 ‘더하다/추가하다’를 함께 살리되, 문맥에 맞게 ‘봉헌물’보다 넓은 ‘것들’로 두었습니다.
theological_decisions:
- issue: κυρίου의 번역
  chosen_reading: ‘주님의’로 번역하여 하나님의 성전을 가리키는 표현으로 유지했습니다.
  alternative_readings:
  - ‘주님의’ 대신 ‘야훼의’
  - ‘주의’
  rationale: 본문은 그리스어 κυρίου를 따르므로 기본값인 ‘주님’을 사용했습니다. 히브리어 병행본문이 있더라도 이 절의 직접 출처는 Greek이므로, 본문에서는 ‘주님의 성전’이 가장 안정적입니다.
  doctrine_reference: 'DOCTRINE.md contested terms: κύριος → 주님/주'
- issue: 이 절의 ἱερὸν 번역
  chosen_reading: ‘성전’으로 옮겨 예루살렘 성전 맥락을 분명히 했습니다.
  alternative_readings:
  - ‘집’
  - ‘성소’
  rationale: ἱερόν은 일반적으로 성전/성소를 뜻하지만, 이 구절은 예루살렘 성전을 말하므로 한국어 독자에게 가장 직접적인 ‘성전’이 문맥에 맞습니다.
  doctrine_reference: LSJ / POB lexical consistency
