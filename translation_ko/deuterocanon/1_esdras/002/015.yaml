review_pass:
  verdict: revise
  source_fidelity: 그리스어의 δέ는 단순한 서술 전환일 뿐 ‘이제’에 해당하는 명시적 시간 부사는 아니므로 본문에서 빼는 편이 안전합니다. 또한 인명은 영어식 형태보다 그리스어 본문(Βήλεμος, Ταβέλλιος, Ῥάθυμος, Βεέλτεθμος, Σαμέλλιος)에 가까운 음역으로 통일하는 것이 원문 우선 원칙에 맞습니다. κατά와 속격은 주민들에 대한 적대적 편지라는 뜻을 낼 수 있으므로 ‘반대하여’가 적절합니다.
  naturalness: 원문의 긴 주어구는 한국어에서 ‘… 사람들이’로 한 번 묶어 주면 자연스럽습니다. ‘페르시아 왕 아르타크세르크세스 시대에’는 ‘아르타크세르크세스 곧 페르시아 왕의 시대에’보다 자연스럽고, ‘다른 곳들’은 τόποις의 비특정성을 ‘다른 지역들’보다 더 직접적으로 보존합니다.
  terminology: γραμματεύς는 ‘서기관’으로 유지합니다. ὑπογεγραμμένην ἐπιστολήν은 본문에서 자연스럽게 ‘다음 편지’로 옮기되, 문자적 가능성은 각주에서 밝혀야 합니다. 각주는 한국어 번역문에 맞게 한국어로 제시하고, a는 ‘다음 편지’에, b는 ‘반대하여’에 붙이는 것이 내용과 일치합니다.
  issues:
  - severity: medium
    issue: ‘이제’가 δέ를 과도하게 구체화합니다.
    rationale: δέ는 여기서 대조·전환을 표시할 수 있으나, ‘이제’라는 명시적 시간·담화 표지를 요구하지 않습니다. 영어 감사 기록도 해당 ‘Now’를 제거했습니다.
  - severity: medium
    issue: 인명 음역이 영어식 어미를 따르며 그리스어 형태와 일관되지 않습니다.
    rationale: Ταβέλλιος, Ῥάθυμος, Βεέλτεθμος, Σαμέλλιος은 그리스어 형태를 기준으로 각각 타벨리오스, 라티모스, 베엘테트모스, 사멜리오스로 옮기는 것이 안전합니다.
  - severity: low
    issue: 각주가 영어로 남아 있고 앵커 위치가 각주 내용과 맞지 않습니다.
    rationale: 한국어 성경 번역에서는 각주도 한국어로 제공해야 하며, ‘아래에 쓰인/첨부된’이라는 a는 ‘다음 편지’에 직접 연결되어야 합니다.
  - severity: low
    issue: ‘다른 지역들’은 τόποις보다 행정적 범위를 다소 암시합니다.
    rationale: τόποις는 일반적으로 ‘곳들/장소들’이므로 ‘다른 곳들’이 더 중립적입니다.
