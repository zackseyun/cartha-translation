base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/015.yaml
  text: 'Now in the time of Artaxerxes king of the Persians[a], Belemus and Mithradates and Tabelius and Rathymus and Beeltethmus and Samellius the scribe, and the rest who were associated with them, living in Samaria and the other places[b], wrote the following letter against the inhabitants of Judea and Jerusalem:'
  footnotes:
  - marker: a
    text: Greek literally, 'the letter written below' or 'the subjoined letter.'
    reason: lexical_alternative
  - marker: b
    text: The Greek wording around 'wrote ... against the inhabitants of Judea and Jerusalem' is somewhat compressed; the translation brings out the apparent sense of a written accusation or complaint.
    reason: alternative_reading
translation:
  language: ko
  text: '페르시아 왕 아르타크세르크세스 시대에, 베레모스와 미트라다테스와 타벨리오스와 라티모스와 베엘테트모스와 서기관 사멜리오스와 그들과 함께한 나머지 사람들, 곧 사마리아와 다른 곳들에 사는 사람들이 유다와 예루살렘에 사는 주민들을 반대하여 다음 편지[a][b]를 기록하였습니다:'
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 그리스어는 직역하면 ‘아래에 쓰인 편지’ 또는 ‘첨부된 편지’입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어의 ‘기록하였다 … 유다와 예루살렘에 사는 주민들을 반대하여’라는 표현은 다소 압축되어 있습니다. 번역은 문맥상 წერ한 고발 또는 진정의 뜻을 드러냅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν δὲ τοῖς ἐπʼ Ἀρταξέρξου ... χρόνοις
  english_pob_choice: Now in the time of Artaxerxes ...
  chosen_korean: 이제 아르타크세르크세스 곧 ...의 시대에
  alternatives_korean:
  - 아르타크세르크세스 시대에
  - 아르타크세르크세스 왕 때에
  lexicon: LSJ
  rationale: χρόνοις는 ‘때/시대’의 의미이므로 한국어도 자연스럽게 ‘시대에’로 옮기고, δέ의 서술 전환을 ‘이제’로 반영했습니다.
- source_word: τοῦ Περσῶν βασιλέως
  english_pob_choice: king of the Persians
  chosen_korean: 페르시아 왕
  alternatives_korean:
  - 페르시아 사람들의 왕
  - 페르시아인의 왕
  lexicon: LSJ
  rationale: Ἀρταξέρξου가 이미 왕명을 지시하므로 한국어에서는 중복을 피하면서도 ‘Περσῶν’의 민족적 수식을 보존해 ‘페르시아 왕’으로 자연스럽게 옮겼습니다.
- source_word: κατέγραψεν ... τὴν ὑπογεγραμμένην ἐπιστολήν
  english_pob_choice: wrote ... the following letter
  chosen_korean: 다음 편지를 썼습니다
  alternatives_korean:
  - 아래 편지를 기록했습니다
  - 아래에 적힌 편지를 썼습니다
  lexicon: LSJ
  rationale: κατέγραψεν과 ὑπογεγραμμένην은 문자적으로는 ‘적어 두다/아래에 쓰다’의 뉘앙스가 있지만, 문맥상 편지 자체를 가리키므로 ‘다음 편지’와 ‘썼습니다’가 가장 분명합니다.
- source_word: οἰκοῦντες δὲ ἐν Σαμαρείᾳ καὶ τοῖς ἄλλοις τόποις
  english_pob_choice: living in Samaria and the other places
  chosen_korean: 사마리아와 다른 지역들에 사는
  alternatives_korean:
  - 사마리아와 다른 곳들에 거주하는
  - 사마리아와 그 밖의 지역들에 사는
  lexicon: LSJ
  rationale: οἰκοῦντες는 단순히 ‘거주하는/사는’ 뜻이며, τοῖς ἄλλοις τόποις는 ‘다른 장소들’이므로 이를 과하게 해석하지 않고 평이하게 옮겼습니다.
- source_word: ὁ γραμματεύς
  english_pob_choice: the scribe
  chosen_korean: 서기관
  alternatives_korean:
  - 기록관
  - 서기
  lexicon: LSJ
  rationale: γραμματεύς는 문맥상 공식 문서 작성자이므로 한국어 공적 문체에서는 ‘서기관’이 적절합니다.
theological_decisions:
- issue: 편지의 행위가 단순한 서술인지, 고발의 뉘앙스를 드러낼지
  chosen_reading: ‘유다와 예루살렘에 사는 주민들을 상대로’로 옮겨 적대적 성격을 드러냈습니다.
  alternative_readings:
  - 유다와 예루살렘 주민들에 관하여
  - 유다와 예루살렘에 사는 사람들에게
  rationale: κατά with genitive는 여기서 반대/대항의 의미를 가지므로, 본문의 적대적 상황을 흐리지 않도록 한국어에도 그 긴장을 반영했습니다.
  doctrine_reference: 본문 이해를 위한 문맥적·수사적 판단
