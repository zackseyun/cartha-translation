base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/022.yaml
  text: I read the letter that you sent to me. Therefore I gave orders to investigate[a], and it was found that that city has from ancient times set itself in opposition to kings,
  footnotes:
  - marker: a
    text: Or, 'has opposed kings.' The Greek participle can be rendered more compactly, but the main text preserves the sense of taking a hostile stand against royal authority.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 당신들이 나에게 보낸 편지를 읽었습니다. 그러므로 조사하도록 명령하였고, 그 도시는 예로부터 왕들에게 대항해 왔다는 사실이 밝혀졌습니다[a].
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 또는 ‘왕들에게 맞서 왔다.’ 그리스어 분사는 더 압축적으로 옮길 수도 있지만, 본문은 왕권에 적대적으로 맞선다는 뜻을 유지합니다.
    reason: ἀντιπαρατάσσουσα의 대안적 표현을 제시하며, 각주 표지를 해당 번역어 뒤로 옮겼습니다.
