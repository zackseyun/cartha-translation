base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/022.yaml
  text: I read the letter that you sent to me. Therefore I gave orders to investigate[a], and it was found that that city has from ancient times set itself in opposition to kings,
  footnotes:
  - marker: a
    text: Or, 'has opposed kings.' The Greek participle can be rendered more compactly, but the main text preserves the sense of taking a hostile stand against royal authority.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 당신들이 보낸 편지를 읽었습니다. 그래서 조사하라고 명령했고[a], 그 결과 그 도시는 옛날부터 왕들에 맞서 서 있는 것으로 밝혀졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕들에 맞서 대항해 왔다.’ 그리스어 분사는 더 압축적으로도 옮길 수 있지만, 본문은 왕권에 적대적인 태도를 드러내는 뜻을 유지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνέγνων
  english_pob_choice: I read
  chosen_korean: 나는 … 읽었습니다
  alternatives_korean:
  - 나는 … 읽어 보았습니다
  - 나는 … 검토했습니다
  lexicon: LSJ
  rationale: 서한 회신의 서술형 과거로 자연스럽게 옮기되, 단순한 독서 행위임을 분명히 했습니다.
- source_word: ἐπιστολήν
  english_pob_choice: letter
  chosen_korean: 편지
  alternatives_korean:
  - 서신
  - 문서
  lexicon: LSJ
  rationale: 행정적 회신 맥락이지만, 여기서는 단순한 ‘편지’가 가장 직접적이고 자연스럽습니다.
- source_word: ἐπέταξα
  english_pob_choice: I gave orders
  chosen_korean: 명령했고
  alternatives_korean:
  - 지시했고
  - 명령을 내렸고
  lexicon: LSJ
  rationale: 왕의 행정적 권위를 드러내는 동사로 ‘명령하다’가 가장 정확합니다.
- source_word: ἐπισκέψασθαι
  english_pob_choice: to investigate
  chosen_korean: 조사하라고
  alternatives_korean:
  - 검토하라고
  - 살펴보라고
  lexicon: LSJ
  rationale: 공적 조사·조회의 의미를 살려 ‘조사하다’로 옮겼습니다.
- source_word: ἐξ αἰῶνος
  english_pob_choice: from ancient times
  chosen_korean: 옛날부터
  alternatives_korean:
  - 오래전부터
  - 예로부터
  lexicon: LSJ
  rationale: 시간적으로 오래 지속된 역사적 상태를 한국어 관용에 맞게 간결하게 표현했습니다.
- source_word: ἀντιπαρατάσσουσα
  english_pob_choice: has set itself in opposition
  chosen_korean: 왕들에 맞서 서 있는
  alternatives_korean:
  - 왕들에 대항하고 있는
  - 왕들에 맞서 배열된
  lexicon: LSJ
  rationale: 단순한 ‘반역’보다 더 중립적인 ‘맞서 서 있다’가 그리스어 분사의 대치·대립 뉘앙스를 잘 살립니다.
theological_decisions:
- issue: 도시의 성격을 과장하지 않고 대립 상태로 유지할지 여부
  chosen_reading: ‘왕들에 맞서 서 있는’으로 옮겨, 지속된 적대적 자세는 드러내되 공개 반란으로 단정하지 않았습니다.
  alternative_readings:
  - 왕들에게 반역해 온
  - 왕들을 거슬러 온
  rationale: 영어 POB의 주석도 open rebellion보다 ‘hostile stand’의 의미를 보존하므로, 본문은 대립 상태로 유지하는 것이 source-faithful합니다.
  doctrine_reference: 문맥적 역사 서술; 절 자체에 교리 쟁점 없음
