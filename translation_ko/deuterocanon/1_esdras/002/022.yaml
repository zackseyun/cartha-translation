- from: 나는 당신들이 보낸 편지를 읽었습니다. 그래서 조사하라고 명령했고[a], 그 결과 그 도시는 옛날부터 왕들에 맞서 서 있는 것으로 밝혀졌습니다.
  to: 나는 당신들이 나에게 보낸 편지를 읽었습니다. 그러므로 조사하도록 명령하였고, 그 도시는 예로부터 왕들에게 대항해 왔다는 사실이 밝혀졌습니다[a].
  rationale: 문장을 현대 표준어 합쇼체의 공식 서신·행정 서술에 맞게 다듬고, ‘대항해 왔다’로 원문의 지속적 대립 의미를 보존했습니다. 또한 어휘 대안에 관한 각주가 실제 설명 대상에 붙도록 앵커를 옮겼습니다.
