  rationale: ἄνθρωποι ἐκείνοι를 자연스러운 지시어로 살리되, 동작 금지를 분명히 표현했습니다. '건축하다'는 도시 건설의 직접 의미를 유지합니다.
- source_word: προνοηθῆναι
