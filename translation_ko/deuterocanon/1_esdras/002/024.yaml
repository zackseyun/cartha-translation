  - 살피라고 했으며
  lexicon: BDAG
  rationale: 행정적 예방·감시의 뉘앙스를 살리면서 한국어 공문체로 자연스럽게 옮겼습니다.
- source_word: ὅπως μηθὲν παρὰ ταῦτα γένηται
  english_pob_choice: that nothing further be done beyond this
  chosen_korean: 그 밖에 아무것도 이 일에 덧붙여지지 않도록
  alternatives_korean:
  - 이것을 넘는 일이 아무것도 생기지 않도록
  - 이것과 어긋나는 일이 아무것도 일어나지 않도록
  lexicon: BDAG
  rationale: παρὰ ταῦτα의 '이것을 넘어'라는 의미를 반영하되, 본문이 금지하는 추가 행위를 자연스럽게 표현했습니다.
- source_word: τὰ τῆς κακίας … εἰς τὸ βασιλεῖς ἐνοχλῆσαι
  english_pob_choice: the evil matter may not advance any more to the harm of kings
  chosen_korean: 그 악한 일이 더 이상 나아가 왕들에게 해를 끼치지 못하게
  alternatives_korean:
  - 그 악한 일이 더 이상 진행되어 왕들을 괴롭히지 못하게
  - 그 악한 일이 더 이상 번져 왕들에게 폐를 끼치지 못하게
  lexicon: LSJ
  rationale: POB의 'evil matter'를 '악한 일'로 구체화하고, ἐνοχλῆσαι의 해침/괴롭힘 의미를 '해를 끼치지'로 옮겨 정치적 위해의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 도시 건축 금지의 대상 표현
  chosen_reading: 본문의 '그 도시'를 그대로 유지하고, '다시'를 본문에 넣지 않았습니다.
  alternative_readings:
  - 그 도시를 다시 건축하지 못하게
  - 그 도시를 재건하지 못하게
  rationale: 그리스어는 단순히 '건축하다'라고 하며, 재건의 역사적 맥락은 있지만 본문 자체에 없는 접두 의미를 주석 없이 본문에 넣지 않기 위해 절제했습니다.
  doctrine_reference: source-accuracy / textual restraint
- issue: 왕들에게 대한 결과 표현
  chosen_reading: '''왕들에게 해를 끼치지''로 옮겼습니다.'
  alternative_readings:
  - 왕들을 괴롭히지
  - 왕권에 방해가 되지
  rationale: ἐνοχλῆσαι는 단순 불편이 아니라 통치 질서에 대한 실제적 위해까지 포괄할 수 있어, 정치적·행정적 문맥에 맞는 중립적 피해 표현을 택했습니다.
  doctrine_reference: historical-context / semantic range
