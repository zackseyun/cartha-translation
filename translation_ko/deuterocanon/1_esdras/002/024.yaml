  - 살피라고 했으며
  lexicon: BDAG
  rationale: 행정적 예방·감시의 뉘앙스를 살리면서 한국어 공문체로 자연스럽게 옮겼습니다.
- source_word: ὅπως μηθὲν παρὰ ταῦτα γένηται
  english_pob_choice: that nothing further be done beyond this
  chosen_korean: 그 밖에 아무것도 이 일에 덧붙여지지 않도록
  alternatives_korean:
  - 이것을 넘는 일이 아무것도 생기지 않도록
