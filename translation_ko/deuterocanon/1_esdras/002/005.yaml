review_pass:
  verdict: revise
  source_fidelity: 그리스어 원문은 앞의 조건절·기원절과 올라감의 분사에서 단수를 사용한 뒤, οἰκοδομείτωσαν에서 복수 명령으로 전환합니다. 초안은 ‘그가 ... 건축하게 하십시오’로 복수 전환을 단수화하여 본문의 수 변화를 잃었습니다. 또한 κατασκηνώσας는 부정과거 분사이므로 ‘거하시는’보다 ‘거하신’이 원문의 상(相)을 더 충실히 반영합니다.
  naturalness: 수 전환을 보존하는 표현은 다소 낯설 수 있으나, ‘그가 ... 올라가도록 하고, 그들이 ... 건축하게 하십시오’는 현대 표준 한국어 합쇼체 안에서 문법적으로 자연스럽고, 원문의 불규칙성을 투명하게 드러냅니다. ‘주의 집’과 ‘거하신 주’는 문맥에 맞는 격식 있는 표현입니다.
  terminology: κύριος는 일관되게 ‘주’로, οἶκος는 성전 문맥에서 ‘집’으로 유지하는 것이 적절합니다. ‘이스라엘의 주의 집’은 그리스어의 다소 특이한 소유 연쇄를 보존합니다. ‘건축하다’도 적절합니다.
  issues:
  - severity: high
    issue: 복수 명령 οἰκοδομείτωσαν의 단수화
    rationale: 초안의 ‘그가 ... 건축하게 하십시오’는 원문의 복수 명령을 단수로 평탄화합니다. 더구나 각주 a는 수 변화를 보존했다고 설명하므로, 본문 및 각주가 서로 모순됩니다.
  - severity: medium
    issue: κατασκηνώσας의 현재화
    rationale: ‘거하시는’은 현재적 관계절이지만, 원문은 부정과거 분사 ὁ κατασκηνώσας(‘거하신/거처를 두신 분’)입니다. 교리적 조화 없이 원문의 상을 반영하는 ‘거하신’이 안전합니다.
  - severity: low
    issue: 각주 표지 위치
    rationale: 각주 a는 복수로 바뀌는 건축 명령 뒤에, 각주 c는 마지막 ‘거하신 주’ 뒤에 놓아야 각각의 설명 대상이 분명합니다. 히브리어 평행본문 각주 b는 문장 끝에 둘 수 있습니다.
  revised_text: 그러므로 여러분 가운데 그의 백성에 속한 사람이 있거든, 그의 주께서 그와 함께 계시기를 바랍니다. 그가 유다에 있는 예루살렘으로 올라가도록 하고, 그들이 이스라엘의 주의 집을 건축하게 하십시오[a]. 그는 예루살렘에 거하신 주이십니다[c][b].
