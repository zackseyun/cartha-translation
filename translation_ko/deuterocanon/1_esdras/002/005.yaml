base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/005.yaml
  text: Therefore[a], if any of you is from his people, may his Lord be with him[c][b], and let him go up to Jerusalem in Judea and build the house of the Lord of Israel—he is the Lord who dwells in Jerusalem.
  footnotes:
  - marker: a
    text: The Greek shifts from singular ('if any of you ... may his Lord be with him') to plural ('let them build'). The translation preserves this number shift rather than smoothing it out.
    reason: textual_variant
  - marker: b
    text: The Hebrew parallel in Ezra differs notably at this point, speaking instead of support with silver, gold, goods, and animals, along with a freewill offering for the house of God in Jerusalem. 1 Esdras here follows a different Greek form of the tradition.
    reason: alternative_reading
  - marker: c
    text: Or, 'who made his dwelling in Jerusalem.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로, 여러분 가운데 그의 백성에 속한 사람이 있거든, 그의 주께서 그와 함께 계시기를 바랍니다[b][c][a]. 그리고 그가 유다에 있는 예루살렘으로 올라가 이스라엘의 주의 집을 건축하게 하십시오. 그는 예루살렘에 거하시는 주이십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 앞부분에서 단수(‘만일 여러분 가운데 누구든지… 그의 주가 그와 함께 있기를’)를 쓰다가 뒤에서 복수 명령으로 이어지는 수 변화가 있습니다. 번역은 이 수 변화를 평탄화하지 않고 반영합니다.
    reason: textual_variant
  - marker: b
    text: 히브리어 평행본문은 이 지점에서 은, 금, 재산, 가축과 자원하는 예물을 언급하는 등 상당히 다르게 전개됩니다. 1 Esdras의 그리스어는 그와 다른 전승 형식을 따릅니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘예루살렘에 거처를 두신 분’.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τις ἐστὶν οὖν ὑμῶν
  english_pob_choice: Therefore, if any of you is
  chosen_korean: 그러므로, 여러분 가운데 ... 사람이 있거든
  alternatives_korean:
  - 그러므로, 여러분 중에 ... 사람이 있으면
  - 그러면 여러분 가운데 ... 사람이 있거든
  lexicon: LSJ
  rationale: οὖν의 추론 연결을 ‘그러므로’로 살리고, εἴ τις ἐστὶν ὑμῶν은 자연스러운 한국어 조건문으로 옮겼습니다.
- source_word: ἔστω ὁ κύριος αὐτοῦ μετʼ αὐτοῦ
  english_pob_choice: may his Lord be with him
  chosen_korean: 그의 주께서 그와 함께 계시기를 바랍니다
  alternatives_korean:
  - 그의 주께서 그와 함께 계시길 바랍니다
  - 그의 주께서 그와 함께 계시게 하십시오
  lexicon: LSJ
  rationale: ἔστω의 기원/기원적 용법을 한국어의 바람 표현으로 옮기되, κύριος는 본문에 따라 ‘주’로 유지했습니다.
- source_word: ἀναβὰς εἰς τὴν Ἰερουσαλὴμ τὴν ἐν τῇ Ἰουδαίᾳ
  english_pob_choice: go up to Jerusalem in Judea
  chosen_korean: 유다에 있는 예루살렘으로 올라가
  alternatives_korean:
  - 유다에 있는 예루살렘으로 올라가서
  - 유다의 예루살렘으로 올라가
  lexicon: LSJ
  rationale: ἀναβαίνω의 ‘올라가다’는 예루살렘 순례/상승의 관용을 살리고, 위치 구문은 한국어답게 처리했습니다.
- source_word: οἰκοδομείτωσαν τὸν οἶκον τοῦ κυρίου τοῦ Ἰσραήλ
  english_pob_choice: let them build the house of the Lord of Israel
  chosen_korean: 이스라엘의 주의 집을 건축하게 하십시오
  alternatives_korean:
  - 이스라엘의 주의 집을 세우게 하십시오
  - 이스라엘의 주의 집을 짓게 하십시오
  lexicon: LSJ
  rationale: οἰκοδομέω는 문맥상 성전/집 건축이므로 ‘건축하다’를 택했고, τοῦ κυρίου τοῦ Ἰσραήλ의 다소 직설적인 소유 관계를 유지했습니다.
- source_word: οὗτος ὁ κύριος ὁ κατασκηνώσας ἐν Ἰερουσαλήμ
  english_pob_choice: he is the Lord who dwells in Jerusalem
  chosen_korean: 그는 예루살렘에 거하시는 주이십니다
  alternatives_korean:
  - 그는 예루살렘에 장막을 치고 거하시는 주이십니다
  - 그는 예루살렘에 거하신 주이십니다
  lexicon: LSJ
  rationale: κατασκηνόω의 ‘거하다/장막 치다’ 의미를 한국어의 ‘거하시는’으로 간결하게 살렸고, 종결은 현재적 진술로 옮겼습니다.
theological_decisions:
- issue: κύριος를 YHWH 전승과 구별되는 그리스어 본문에서 어떻게 처리할지
  chosen_reading: 본문의 κύριος는 모두 ‘주’로 옮기고, 히브리 전통의 여호와 표기는 도입하지 않았습니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 이 구절은 그리스어 1 Esdras 본문이 직접 기준이므로, 히브리어 대응의 신학적 표지를 추정적으로 삽입하지 않고 그리스어의 호칭을 그대로 반영했습니다.
  doctrine_reference: DOCTRINE.md κύριος → 주; 원문 우선 원칙
- issue: 마지막 절의 진술을 ‘거하시는 주’로 둘지, 과거/완료적 뉘앙스로 둘지
  chosen_reading: ‘예루살렘에 거하시는 주’로 현재적 진술을 택했습니다.
  alternative_readings:
  - 예루살렘에 거하신 주
  - 예루살렘에 거하셨던 주
  rationale: κατασκηνώσας는 분사이지만, 문맥상 예루살렘에 있는 주의 정체를 설명하는 서술이어서 한국어에서는 자연스러운 현재형 관계절이 적합합니다.
  doctrine_reference: DOCTRINE.md 분사 처리와 문맥 우선
