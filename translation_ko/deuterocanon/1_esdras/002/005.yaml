  to: 그러므로 여러분 가운데 그의 백성에 속한 사람이 있거든, 그의 주께서 그와 함께 계시기를 바랍니다. 그가 유다에 있는 예루살렘으로 올라가도록 하고, 그들이 이스라엘의 주의 집을 건축하게 하십시오[a]. 그는 예루살렘에 거하신 주이십니다[c][b].
  rationale: 그리스어를 우선하여 οἰκοδομείτωσαν의 복수 명령을 본문에서 명시적으로 보존하고, 그에 맞게 각주 a의 표지를 이동했습니다. 마지막 부정과거 분사 κατασκηνώσας는 현재형으로 평탄화하지 않고 ‘거하신’으로 옮겼습니다. 나머지 핵심 용어와 원문의 의도적인 비조화는 유지했습니다.
