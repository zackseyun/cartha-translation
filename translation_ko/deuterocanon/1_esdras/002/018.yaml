base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/018.yaml
  text: Therefore, if this city is rebuilt and the walls are completed, they will certainly not endure to pay tribute, but will even oppose kings.
  footnotes:
  - marker: a
    text: Or, 'they will certainly not continue to pay tribute.' The Greek phrase literally says they 'will certainly not endure to pay,' which may emphasize refusal to remain under imperial tribute rather than mere inability.
    reason: lexical_alternative
  - marker: b
