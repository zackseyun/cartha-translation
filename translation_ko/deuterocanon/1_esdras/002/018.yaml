revisions:
- from: 그러므로 이 성읍이 재건되고 성벽이 완공되면, 그들은 조공을 바치는 일을 결코 견디지 못할 것이며, 심지어 왕들에게도 맞설 것입니다.[a][b]
  to: 그러므로 이 성읍이 재건되고 성벽이 완공되면, 그들은 조공을 계속 바치는 것을 결코 견디지 않을 것이며[a], 왕들에게 맞서기까지 할 것입니다.[b]
  rationale: ‘계속’을 ‘조공을 바치다’에 연결하여 ὑπομένω가 문맥상 시사하는 지속적 납부의 감내를 자연스럽게 나타냈습니다. ‘결코’는 οὐ μή의 강한 부정을 보존하며, ‘맞서기까지 할 것입니다’는 ἀλλὰ καὶ의 추가·고조 효과를 반영합니다. 본문의 역사적 고발 논조를 유지하되 해석을 덧붙이지 않았습니다.
