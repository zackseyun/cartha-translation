    reason: textual_variant
translation:
  language: ko
  text: 그러므로 이 성읍이 재건되고 성벽이 완공되면, 그들은 조공을 계속 바치는 것을 결코 견디지 않을 것이며[a], 왕들에게 맞서기까지 할 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 직역하면 ‘조공을 바치는 것을 결코 견디지 않을 것이다’라는 뜻으로, 단순히 조공 납부를 중단한다는 것보다 그러한 예속적 부담을 계속 감수하기를 거부한다는 뜻을 더 강하게 드러낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절의 그리스어 본문은 제공된 히브리어/아람어 계열 병행본문과 긴밀히 일치하지 않으므로, 번역은 그리스어 본문을 직접 따랐습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἐὰν οὖν
  english_pob_choice: Therefore, if
  chosen_korean: 그러므로 … 되면
  alternatives_korean:
  - 그러므로 만일 … 되면
  - 그러니 … 되면
  lexicon: LSJ
  rationale: οὖν의 추론 연결을 ‘그러므로’로 살리고, 조건문은 한국어 자연성에 맞게 ‘… 되면’으로 옮겼습니다.
- source_word: ἡ πόλις αὕτη
  english_pob_choice: this city
  chosen_korean: 이 성읍
  alternatives_korean:
  - 이 도시
  - 그 성읍
  lexicon: LSJ
  rationale: 지시어 αὕτη의 근접성을 살려 ‘이’를 두고, 고대 도시 맥락에 맞는 ‘성읍’을 선택했습니다.
- source_word: φορολογίαν
  english_pob_choice: tribute
  chosen_korean: 조공을 바치는 일
  alternatives_korean:
  - 조세
  - 세금
  lexicon: LSJ
  rationale: 일반 세금보다 제국에 대한 예속적 부담을 드러내는 ‘조공’이 문맥에 더 가깝습니다.
- source_word: οὐ μὴ ὑπομείνωσιν δοῦναι
  english_pob_choice: they will certainly not endure to pay
  chosen_korean: 결코 견디지 못할 것이며
  alternatives_korean:
  - 결코 계속 바치지 못할 것이며
  - 결코 감당하지 못할 것이며
  lexicon: LSJ
  rationale: οὐ μὴ의 강한 부정을 살리면서, ὑπομένω의 ‘견디다/버티다’ 의미를 한국어 관용으로 자연스럽게 반영했습니다.
- source_word: βασιλεῦσιν ἀντιστήσονται
  english_pob_choice: will even oppose kings
  chosen_korean: 심지어 왕들에게도 맞설 것입니다
  alternatives_korean:
  - 심지어 왕들에게도 대항할 것입니다
  - 심지어 왕들에게도 저항할 것입니다
  lexicon: LSJ
  rationale: ἀνθίστημι의 대립·저항을 ‘맞서다’로 옮겨, 반역적 정치 함의를 분명히 하되 현대어로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 본문의 부정 강도와 정치적 함의
  chosen_reading: 단순히 조공을 ‘안 바친다’가 아니라, ‘견디지 못할 것’이라는 강한 거부·저항의 뉘앙스를 살렸습니다.
  alternative_readings:
  - 조공을 계속 바치지 않을 것입니다
  - 조공을 감당하지 못할 것입니다
  rationale: 그리스어 οὐ μὴ ὑπομείνωσιν δοῦναι는 강한 부정과 지속적 부담 거부를 함께 내포하므로, 그 긴장을 한국어로 유지하는 것이 중요합니다.
