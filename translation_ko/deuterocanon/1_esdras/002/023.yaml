revisions:
- from: 그리고 그곳의 사람들은 그 안에서 반역과 전쟁을 일으켰고, 강하고 거친 왕들이 예루살렘에 있어 통치하며 코일레 시리아와 페니키아에 조세를 징수하고 있었습니다.[a]
  to: 그리고 그 성읍 사람들은 그곳에서 반란과 전쟁을 벌였으며, 예루살렘에는 강하고 가혹한 왕들이 있어 코일레 시리아와 페니키아를 지배하며 조세를 거두었습니다.[a]
  rationale: 그리스어를 우선하여 συντελοῦντες를 ‘벌였으며’로, ἰσχυροὶ καὶ σκληροί를 ‘강하고 가혹한’으로 옮겼습니다. 또한 κυριεύοντες와 φορολογοῦντες가 뒤따르는 두 지명을 함께 받는 구문을 한국어에서 명확히 드러내어 ‘코일레 시리아와 페니키아를 지배하며 조세를 거두었습니다’로 고쳤습니다. 이는 영어 감사 기록의 ‘ruling and exacting tribute from’보다 그리스어 통사 관계를 더 직접적으로 반영합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T05:29:46Z'
review_pass:
  verdict: revise
  source_fidelity: 그리스어의 핵심 요소인 복수의 ‘반란/반역과 전쟁’, 강력하고 가혹한 왕들, 그리고 코일레 시리아와 페니키아에 대한 지배 및 과세를 대체로 반영했습니다. 그러나 원문의 ‘코일레 시리아와 페니키아’를 목적어로 하는 두 분사(κυριεύοντες καὶ φορολογοῦντες)의 연결이 초안에서는 불분명하며, ‘…에 조세를 징수하다’는 방향 관계도 맞지 않습니다.
  naturalness: ‘그곳의 사람들은 그 안에서’는 지시 표현이 중복되어 부자연스럽고, ‘코일레 시리아와 페니키아에 조세를 징수하고’는 현대 한국어 문법상 어색합니다. ‘그 성읍 사람들은 그곳에서’ 및 ‘…을 지배하며 조세를 거두었습니다’가 자연스럽습니다.
  terminology: ἀποστάσεις에는 정치적 봉기라는 뜻의 ‘반란’이 자연스럽고, σκληροί는 통치자의 성격상 ‘가혹한’이 ‘거친’보다 정확합니다. φορολογοῦντες는 강제적 과세를 나타내므로 ‘조세를 거두다’가 적절합니다. 지명 ‘코일레 시리아’와 ‘페니키아’는 유지할 수 있습니다.
  issues:
