base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/023.yaml
  text: and its people were carrying out rebellions and wars within it[a], and strong and harsh kings were in Jerusalem, ruling and exacting tribute from Coele-Syria and Phoenicia.
  footnotes:
  - marker: a
    text: The Hebrew parallel in Ezra 4:20 describes Jerusalem as a rebellious city that harmed kings and provinces, with revolt occurring in it from ancient days. 1 Esdras here expands the description with 'rebellions and wars' and with tribute from Coele-Syria and Phoenicia.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그곳의 사람들은 그 안에서 반역과 전쟁을 일으켰고, 강하고 거친 왕들이 예루살렘에 있어 통치하며 코일레 시리아와 페니키아에 조세를 징수하고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 그리스어는 에스라 4:20의 히브리어 병행보다 더 확장되어, 예루살렘 안의 반역과 전쟁, 그리고 코일레 시리아와 페니키아에 대한 조세 징수를 덧붙입니다.
    reason: source_note
lexical_decisions:
- source_word: ἀποστάσεις
  english_pob_choice: rebellions
  chosen_korean: 반역
  alternatives_korean:
  - 봉기
  - 반란
  lexicon: LSJ
  rationale: 정치적 저항과 이탈의 성격을 살리기 위해 ‘반역’을 선택했습니다. 다만 단수형의 추상명사보다 복수성을 드러내기 위해 뒤의 ‘전쟁’과 병렬로 읽히게 했습니다.
- source_word: πολέμους
  english_pob_choice: wars
  chosen_korean: 전쟁
  alternatives_korean:
  - 전투
  - 전쟁들
  lexicon: LSJ
  rationale: 그리스어 복수형의 폭넓은 분쟁 의미를 그대로 살려 ‘전쟁’으로 옮겼습니다.
- source_word: συντελοῦντες
  english_pob_choice: carrying out
  chosen_korean: 일으켰고
  alternatives_korean:
  - 행하고 있었고
  - 벌였고
  - 수행했고
  lexicon: LSJ
  rationale: 반역과 전쟁을 능동적으로 야기·전개하는 뜻을 자연스럽게 드러내기 위해 ‘일으키다’를 사용했습니다.
- source_word: ἰσχυροὶ καὶ σκληροὶ
  english_pob_choice: strong and harsh
  chosen_korean: 강하고 거친
  alternatives_korean:
  - 강하고 엄한
  - 강하고 잔혹한
  - 유력하고 कठ한
  lexicon: LSJ
  rationale: 두 형용사의 병렬을 유지하면서도 통치의 압박성과 कठ함을 함께 살릴 수 있는 가장 간결한 현대어 표현으로 잡았습니다.
- source_word: φορολογοῦντες
  english_pob_choice: exacting tribute from
  chosen_korean: 조세를 징수하고
  alternatives_korean:
  - 공물을 거두고
  - 조공을 거두고
  - 세금을 부과하고
  lexicon: LSJ
  rationale: 국가적 강제 징수의 성격을 살리기 위해 ‘조세를 징수하다’로 옮겼습니다. ‘조공’은 동아시아적 위계 뉘앙스가 강해 제외했습니다.
theological_decisions:
- issue: 1 Esdras의 그리스어 확장과 에스라 4:20 히브리어 병행본문의 관계
  chosen_reading: 그리스어 본문의 ‘반역과 전쟁’, ‘코일레 시리아와 페니키아에 대한 조세 징수’를 본문에 그대로 반영했습니다.
  alternative_readings:
  - 히브리어 병행본문에 더 가까운 ‘반역적인 성읍’, ‘옛적부터 그 안에서 일어난 반역’ 식의 압축 번역
  rationale: 1 Esdras에서는 그리스어가 주본문이므로, 병행본문은 참고하되 본문이 가진 확장과 재구성을 지우지 않았습니다.
  doctrine_reference: 'POB 원칙: 외경/제2경전은 그리스어 본문을 주번역 기준으로 삼고, 히브리어 병행은 교차참조로만 활용'
