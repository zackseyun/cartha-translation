    reason: alternative_reading
lexical_decisions:
- source_word: Βασιλεύοντος Κύρου Περσῶν
  english_pob_choice: In the first year of Cyrus king of Persia
  chosen_korean: 페르시아 왕 고레스의 첫째 해에
  alternatives_korean:
  - 고레스가 페르시아를 다스리던 첫해에
  - 페르시아의 고레스 왕의 첫째 해에
  lexicon: LSJ
  rationale: 그리스어는 ‘다스리던 중’이라는 제법을 띤 절이지만, ἔτους πρώτου와 함께 시간적 표지로 기능하므로 한국어도 자연스럽게 왕의 치세 연대를 드러내는 표현으로 옮겼습니다.
- source_word: εἰς συντέλειαν
  english_pob_choice: for the fulfillment of
  chosen_korean: 이루어지도록
  alternatives_korean:
  - 완성되도록
  - 성취되도록
  - 이행되도록
  lexicon: LSJ
  rationale: 문맥상 예레미야를 통한 주님의 말씀이 목적/결과에 따라 ‘완성에 이르는 것’이므로, 종결을 직접 말하는 ‘이루어지도록’이 가장 자연스럽고 의미를 보존합니다.
- source_word: ῥήματος Κυρίου
  english_pob_choice: the word of the Lord
  chosen_korean: 주님의 말씀
  alternatives_korean:
  - 주님의 말
  - 주님의 말씀
  lexicon: LSJ
  rationale: 예언 공식에서 ῥῆμα는 단순한 발화보다 권위 있는 ‘말씀’을 가리키므로, 한국어 성경 문체에 맞는 ‘주님의 말씀’으로 옮겼습니다.
- source_word: ἐν στόματι Ἰερεμίου
  english_pob_choice: by the mouth of Jeremiah
  chosen_korean: 예레미야의 입을 통하여
  alternatives_korean:
  - 예레미야의 입으로
  - 예레미야를 통하여
  lexicon: LSJ
  rationale: 히브리어 병행구와 함께 예언 전달의 관용구를 살리되, 현대 한국어에서 직역체로 들리지 않도록 ‘입을 통하여’로 다듬었습니다.
theological_decisions:
- issue: 천명된 말씀의 성취를 나타내는 목적절 처리
  chosen_reading: ‘이루어지도록’은 말씀의 성취가 우연한 결과가 아니라 주님의 뜻 아래 진행되는 목적/결과임을 드러냅니다.
  alternative_readings:
  - ‘성취되도록’
  - ‘완성되도록’
  rationale: εἰς συντέλειαν의 목적성은 본문 의미의 핵심이므로, 단순한 시간 진술이나 느슨한 서술로 약화하지 않았습니다.
  doctrine_reference: 성경의 예언 성취와 하나님의 섭리
