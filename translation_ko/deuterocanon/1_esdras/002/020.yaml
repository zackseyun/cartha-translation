revisions:
- from: 이제 그러므로 우리가 왕이신 주께 알려 드립니다. 이 성이 건축되고 그 성벽들이 다시 세워지면, 이제는 왕께 코일레 시리아와 페니키아로 들어가는 통로가 더 이상 없을 것입니다.[a]
  to: 그러므로 이제, 주 왕이시여, 저희가 아룁니다. 이 성이 건축되고 그 성의 성벽이 세워지면, 왕께서는 더 이상 코일레 시리아와 페니키아로 나아갈 길이 없게 될 것입니다.[a]
  rationale: ‘다시’를 삭제하여 ἀνασταθῇ의 비반복적 의미를 보존했습니다. 궁정 خطاب의 호격을 ‘주 왕이시여’로 옮기고, ἔξοδος는 전치사구 ‘코일레 시리아와 페니키아로’ 및 문맥에 맞추어 왕의 이동·접근 경로인 ‘나아갈 길’로 번역했습니다. 각주 표지 [a]는 해당 어휘에 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T05:29:42Z'
