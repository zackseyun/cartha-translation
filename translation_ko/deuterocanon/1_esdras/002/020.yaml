base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/020.yaml
  text: Now therefore we make known to you[a], lord king, that if this city is built and its walls are raised up, there will no longer be for you passage into Coele-Syria and Phoenicia.
  footnotes:
  - marker: a
    text: Or 'access' or 'way through' into Coele-Syria and Phoenicia.' The Greek says literally 'there will no longer be for you an exodos into Coele-Syria and Phoenicia,' expressing loss of passage or imperial reach.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이제, 주 왕이시여, 저희가 아룁니다. 이 성이 건축되고 그 성의 성벽이 세워지면, 왕께서는 더 이상 코일레 시리아와 페니키아로 나아갈 길이 없게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 그리스어 ἔξοδος는 문자적으로 ‘나감’ 또는 ‘출구’를 뜻합니다. 여기서는 코일레 시리아와 페니키아로 나아가거나 그 지역에 접근할 수 있는 길을 가리킵니다.
    reason: lexical_alternative
