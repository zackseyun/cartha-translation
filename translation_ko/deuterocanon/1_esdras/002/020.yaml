  - severity: low
    issue: ‘이제 그러므로’와 ‘왕이신 주’의 어색한 어순·호칭
    rationale: νῦν οὖν은 ‘그러므로 이제’가 자연스럽고, κύριε βασιλεῦ는 호격으로서 ‘주 왕이시여’가 두 요소를 유지하면서 더 자연스럽습니다.
  - severity: low
