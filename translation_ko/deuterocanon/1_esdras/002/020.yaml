base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/020.yaml
  text: Now therefore we make known to you[a], lord king, that if this city is built and its walls are raised up, there will no longer be for you passage into Coele-Syria and Phoenicia.
  footnotes:
  - marker: a
    text: Or 'access' or 'way through' into Coele-Syria and Phoenicia.' The Greek says literally 'there will no longer be for you an exodos into Coele-Syria and Phoenicia,' expressing loss of passage or imperial reach.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 그러므로 우리가 왕이신 주께 알려 드립니다. 이 성이 건축되고 그 성벽들이 다시 세워지면, 이제는 왕께 코일레 시리아와 페니키아로 들어가는 통로가 더 이상 없을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 ἔξοδος는 문자적으로는 ‘나감/출입’이지만, 문맥상 ‘통로’ 또는 ‘출입 경로’를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποδεικνύομέν
  english_pob_choice: we make known
  chosen_korean: 우리가 ... 알려 드립니다
  alternatives_korean:
  - 우리가 ... 알립니다
  - 우리가 ... 말씀드립니다
  lexicon: BDAG
  rationale: 공식 보고의 문맥을 살려, 단순 통지보다 윗사람에게 올리는 보고의 뉘앙스가 있는 ‘알려 드립니다’를 택했습니다.
- source_word: κύριε βασιλεῦ
  english_pob_choice: lord king
  chosen_korean: 왕이신 주
  alternatives_korean:
  - 주 왕
  - 주군이신 왕
  - 나의 주 왕
  lexicon: LSJ
  rationale: 그리스어 호격의 두 요소를 모두 살리되, 한국어에서 자연스럽고 궁정적인 호칭이 되도록 ‘왕이신 주’로 옮겼습니다.
- source_word: ἀνασταθῇ
  english_pob_choice: are raised up
  chosen_korean: 다시 세워지면
  alternatives_korean:
  - 올려 세워지면
  - 세워지면
  - 재건되면
  lexicon: BDAG
  rationale: 성벽에 대한 동작을 한국어의 자연한 표현으로 풀되, ‘다시’로 이전 상태의 회복이라는 문맥을 드러냈습니다.
- source_word: ἔξοδός
  english_pob_choice: passage
  chosen_korean: 통로
  alternatives_korean:
  - 출입로
  - 나아갈 길
  - 출구
  lexicon: LSJ
  rationale: 여기서는 단순한 ‘출구’가 아니라 왕의 진출 경로를 가리키므로, POB의 ‘passage’에 맞춰 ‘통로’로 옮겼습니다.
- source_word: κοίλην Συρίαν
  english_pob_choice: Coele-Syria
  chosen_korean: 코일레 시리아
  alternatives_korean:
  - 홀로우 시리아
  - 코엘레 시리아
  lexicon: LSJ
  rationale: 헬레니즘 지명의 고유명사로 기능하므로 음역을 유지했습니다.
- source_word: Φοινίκην
  english_pob_choice: Phoenicia
  chosen_korean: 페니키아
  alternatives_korean:
  - 포이니케
  - 페니키아 지역
  lexicon: LSJ
  rationale: 표준적인 현대 한국어 음역을 사용해 지역명임을 분명히 했습니다.
