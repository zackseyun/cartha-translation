base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/025.yaml
  text: Then[a], when what had been written by King Artaxerxes was read, Rathymus and Samellius the scribe, and those aligned with them[b], hurried up to Jerusalem with horsemen and a battle formation of a crowd.
  footnotes:
  - marker: a
    text: 'Greek names: ''Rathymus'' and ''Samellius''; the Hebrew parallel identifies these figures with Rehum and Shimshai.'
    reason: alternative_reading
  - marker: b
    text: Or 'with cavalry and a multitude drawn up in battle order.' The Greek phrase is compressed and may describe an armed escort or forceful detachment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 아르타크세르크세스 왕에게서 온 글들이 읽히자, 라튀무스와 서기관 사멜리우스[a], 그리고 그들에게 가담한 자들은 급히 말을 탄 자들과 전열을 갖춘 무리와 함께 예루살렘으로 올라갔습니다.[b]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 그리스어 이름은 ‘라튀무스’와 ‘사멜리우스’이며, 히브리어 병행본문은 이들을 레훔과 삼사이로 식별합니다.
    reason: 그리스어 본문의 인명 형태를 본문에 유지하면서 히브리어 병행 전승의 식별을 알립니다.
  - marker: b
    text: 또는 ‘말 탄 병력과 전열을 갖춘 무리와 함께’로 옮길 수 있습니다. 그리스어 표현은 압축적이어서 군사적 호위 또는 강압적인 파견대를 가리킬 수도 있습니다.
    reason: μεθʼ ἵππου καὶ ὄχλου παρατάξεως의 집합적·군사적 의미와 정확한 범위의 불확실성을 보존합니다.
lexical_decisions:
- source_word: τῶν παρὰ τοῦ βασιλέως Ἀρταξέρξου γραφέντων
  english_pob_choice: what had been written by King Artaxerxes
  chosen_korean: 아르타크세르크세스 왕에게서 쓰인 것
  alternatives_korean:
  - 아르타크세르크세스 왕이 쓴 것
  - 아르타크세르크세스 왕에게서 보내진 문서
  lexicon: BDAG
  rationale: γραφή/γράφω의 결과물로서 ‘쓰인 것’이 가장 직접적이며, 본문이 특정 용어로 ‘편지’라고 못박지 않으므로 넓게 살렸습니다.
- source_word: Ῥάθυμος / Σαμέλλιος
  english_pob_choice: Rathymus / Samellius
  chosen_korean: 라튀무스 / 사멜리우스
  alternatives_korean:
  - 레훔 / 삼사이
  lexicon: 고유명사 음역 원칙
  rationale: 그리스어 원문 형태를 본문에서 따르되, 히브리어 병행본문이 가리키는 대응 인물과의 식별은 각주로 보존하는 편이 원문 증거에 더 충실합니다.
- source_word: ὁ γραμματεὺς
  english_pob_choice: the scribe
  chosen_korean: 서기관
  alternatives_korean:
  - 비서
  - 기록관
  lexicon: BDAG
  rationale: γραμματεύς는 행정적 서기/서기관을 가리킬 수 있어, 이 문맥에서는 ‘서기관’이 가장 자연스럽고 직역에 가깝습니다.
- source_word: μεθʼ ἵππου καὶ ὄχλου παρατάξεως
  english_pob_choice: with horsemen and a battle formation of a crowd
  chosen_korean: 말을 탄 자들과 전열을 갖춘 무리와 함께
  alternatives_korean:
  - 기병들과 전투 대형을 갖춘 무리와 함께
  - 말과 전열을 갖춘 무리와 함께
  lexicon: LSJ
  rationale: ἵππου는 여기서 집합적으로 ‘말을 탄 자들’로 옮기고, ὄχλου παρατάξεως는 ‘무리’와 ‘전열’의 긴장을 살려 군사적 질서를 드러냈습니다.
- source_word: ἀναζεύξαντες κατὰ σπουδήν
  english_pob_choice: hurried up
  chosen_korean: 서둘러
  alternatives_korean:
  - 급히
  - 서둘러 출발하여
  lexicon: LSJ / BDAG
  rationale: ἀναζεύξαντες와 κατὰ σπουδήν이 함께 급박한 출발을 나타내므로, 한국어에서는 동작의 방향성보다 속도를 살린 ‘서둘러’로 응축했습니다.
theological_decisions:
- issue: ὄχλου παρατάξεως의 군사적 뉘앙스
  chosen_reading: 본문의 ‘전열을 갖춘 무리’는 단순 인파가 아니라 질서 있게 배치된, 사실상 군사적 성격의 동행을 암시한다고 보았습니다.
  alternative_readings:
  - ‘무리의 전열’처럼 더 중립적으로 옮길 수 있음
  - ‘기병대와 군중’으로 강하게 군사화할 수 있음
  rationale: 그리스어 표현이 압축적이고 다소 거칠기 때문에, 의미를 매끈하게 지우지 않되 과도하게 확정하지 않는 중간 지점을 택했습니다.
  doctrine_reference: 본문-비평 및 어휘 의미 범위
- issue: 고유명사 음역과 히브리어 병행본문의 대응
  chosen_reading: 본문 본체는 그리스어 음역을 유지하고, 병행 전승이 제시하는 인명 대응은 주석으로 처리합니다.
  alternative_readings:
  - 본문에 레훔/삼사이를 직접 반영
  - 본문과 주석 모두에 이중 표기
  rationale: 이 책은 그리스어 본문이 주번역 기준이므로, 병행본문의 식별 정보는 본문을 대체하지 않고 각주에서 투명하게 처리하는 것이 적절합니다.
  doctrine_reference: 정본 우선 원칙 및 전승 간 조화
