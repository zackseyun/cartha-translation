  source_fidelity: 그리스어 본문은 왕에게서 온 ‘쓰인 것들’(복수)이 읽힌 뒤 라튀무스, 서기관 사멜리우스, 그리고 그들에게 가담한 이들이 급히 예루살렘으로 올라간다고 합니다. 초안의 ‘아르타크세르크세스 왕에게서 쓰인 것이’는 ‘왕에게서’와 수동형 ‘쓰인’의 결합이 한국어로 부자연스럽고, 원문의 복수도 충분히 드러나지 않습니다. 또한 ‘그들과 함께하던 자들’은 συντασσόμενοι의 적극적인 결속·가담의 뜻을 약화합니다.
  naturalness: 합쇼체의 전체 문장은 자연스럽지만, ‘왕에게서 쓰인 것’은 현대 한국어에서 어색합니다. ‘왕에게서 온 글들’이 자연스럽고 원문의 범위를 과도하게 ‘편지’로 한정하지 않습니다. 각주 표지는 해당 인명 및 모호한 군사 표현 바로 뒤에 두는 편이 독자의 이해에 적절합니다.
  terminology: ‘서기관’은 γραμματεύς에 적절하며, 라튀무스/사멜리우스도 그리스어 본문을 따르는 안전한 음역입니다. ‘말을 탄 자들’과 ‘전열을 갖춘 무리’는 μεθʼ ἵππου καὶ ὄχλου παρατάξεως의 불명확하면서도 군사적인 어감을 무리 없이 보존합니다.
