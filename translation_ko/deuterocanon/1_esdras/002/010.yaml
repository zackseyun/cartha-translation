base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/010.yaml
  text: Then Cyrus king of the Persians brought them out and handed them over to Mithridates[b][a], his treasurer.
  footnotes:
  - marker: a
    text: That is, the temple vessels mentioned in the preceding verse.
    reason: cross_reference
  - marker: b
    text: Or 'his keeper of the treasury.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 페르시아 왕 고레스가 그것들을 꺼내어 자기 국고 관리 미트리다테스에게 넘겼습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉, 앞절에 나온 성전 기물들입니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘자기 국고 창고를 맡은 사람’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξήνεγκεν
  english_pob_choice: brought ... out
  chosen_korean: 꺼내어
  alternatives_korean:
  - 밖으로 가져내어
  - 끌어내어
  lexicon: BDAG
  rationale: 물건을 공식 보관처에서 밖으로 옮겨 내는 동작을 자연스럽게 나타내면서, 앞절의 성전 기물이라는 문맥에 맞게 과도한 해석을 피합니다.
- source_word: Κῦρος ὁ βασιλεὺς Περσῶν
  english_pob_choice: Cyrus king of the Persians
  chosen_korean: 페르시아 왕 고레스
  alternatives_korean:
  - 고레스 왕 페르시아의
  - 페르시아 사람들의 왕 고레스
  lexicon: LSJ
  rationale: 그리스어의 ‘왕 + 민족 소속’ 구조를 한국어에서 자연스럽게 풀어, 고유명사와 통치 범위를 함께 드러냅니다.
- source_word: παρέδωκεν
  english_pob_choice: handed ... over
  chosen_korean: 넘겼습니다
  alternatives_korean:
  - 인계했습니다
  - 전달했습니다
  lexicon: BDAG
  rationale: 단순히 ‘주다’보다 공식적 이전과 위탁의 뉘앙스를 살리며, 국가 물품을 관리인에게 이양하는 장면에 어울립니다.
- source_word: τῷ ἑαυτοῦ γαζοφύλακι
  english_pob_choice: his treasurer
  chosen_korean: 자기 국고 관리
  alternatives_korean:
  - 자기 재무관
  - 자기 보물창고 관리
  lexicon: BDAG
  rationale: γαζοφύλαξ는 단순 개인 회계인이 아니라 국고/보물창고를 맡은 관리이므로, 직무를 드러내면서도 한국어로 이해하기 쉬운 표현을 택했습니다.
theological_decisions:
- issue: 본문의 대상이 무엇인지 명시할 것인가
  chosen_reading: 대명사 αὐτά를 앞절의 성전 기물로 이해하되, 본절 안에서는 직접 풀어 쓰지 않았습니다.
  alternative_readings:
  - ‘그것들’을 그대로 두는 번역
  - ‘성전 기물들’을 본문에 보충하는 번역
  rationale: 그리스어 본문은 지시대명사만 사용하며, 앞절의 선행사를 통해 의미가 분명하므로 본절에서는 과잉 보충 없이 자연스럽게 처리했습니다.
  doctrine_reference: 문맥 우선의 번역 원칙
