base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/003.yaml
  text: 'Thus says Cyrus king of the Persians: The Lord of Israel[a], the Most High Lord, has appointed me king of the world,'
  footnotes:
  - marker: a
    text: The Hebrew parallel in Ezra 1:2 reads, 'the LORD, the God of heaven,' rather than 'the Lord of Israel, the Most High Lord.' 1 Esdras here reflects the Greek form of the proclamation.
