base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/003.yaml
  text: 'Thus says Cyrus king of the Persians: The Lord of Israel[a], the Most High Lord, has appointed me king of the world,'
  footnotes:
  - marker: a
    text: The Hebrew parallel in Ezra 1:2 reads, 'the LORD, the God of heaven,' rather than 'the Lord of Israel, the Most High Lord.' 1 Esdras here reflects the Greek form of the proclamation.
    reason: alternative_reading
translation:
  language: ko
  text: 이렇게 페르시아 왕 고레스가 말합니다. 「이스라엘의 주, 지극히 높으신 주께서 나를 세상의 왕으로 세우셨습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 평행본문 에스라 1:2는 ‘하늘의 하나님 야훼’에 해당하는 표현을 가지며, 1 에스드라스는 그리스어 형태의 선포를 반영합니다.
    reason: textual_variant
lexical_decisions:
- source_word: Τάδε λέγει
  english_pob_choice: Thus says
  chosen_korean: 이렇게 ... 말합니다
  alternatives_korean:
  - 이와 같이 ... 말씀하십니다
  - 이렇게 ... 이릅니다
  lexicon: LSJ
  rationale: 공식적인 선포문 서두를 자연스러운 현대 한국어로 옮기되, 선언체의 문장 기능을 유지했습니다.
- source_word: ὁ βασιλεὺς Περσῶν Κῦρος
  english_pob_choice: Cyrus king of the Persians
  chosen_korean: 페르시아 왕 고레스
  alternatives_korean:
  - 페르시아인들의 왕 고레스
  - 고레스, 페르시아의 왕
  lexicon: LSJ
  rationale: 그리스어의 명사구를 한국어 어순에 맞게 옮기면서도 고레스의 왕호와 민족 표지를 보존했습니다.
- source_word: ὁ κύριος τοῦ Ἰσραήλ
  english_pob_choice: The Lord of Israel
  chosen_korean: 이스라엘의 주
  alternatives_korean:
  - 이스라엘의 주님
  - 이스라엘의 하나님
  lexicon: LSJ
  rationale: κύριος를 문맥상 ‘주’로 직역하여 그리스어 본문의 호칭 구조를 유지했고, 전통적 ‘하나님’으로 풀어 의미를 평준화하지 않았습니다.
- source_word: Κύριος ὁ ὕψιστος
  english_pob_choice: the Most High Lord
  chosen_korean: 지극히 높으신 주
  alternatives_korean:
  - 가장 높으신 주
  - 지존하신 주
  lexicon: LSJ
  rationale: ὕψιστος의 최고성 표현을 한국어 관용의 ‘지극히 높으신’으로 옮겨 두 칭호의 병치를 자연스럽게 살렸습니다.
- source_word: ἀνέδειξεν βασιλέα
  english_pob_choice: has appointed me king
  chosen_korean: 나를 ... 왕으로 세우셨습니다
  alternatives_korean:
  - 나를 ... 왕으로 임명하셨습니다
  - 나를 ... 왕이 되게 하셨습니다
  lexicon: LSJ
  rationale: ἀναδείκνυμι의 임명·지정 의미를 살리되, 왕권 부여의 공적 선언에 맞는 ‘세우다’를 택했습니다.
- source_word: τῆς οἰκουμένης
  english_pob_choice: of the world
  chosen_korean: 세상의
  alternatives_korean:
  - 온 세상의
  - 거주하는 세계의
  lexicon: LSJ
  rationale: οἰκουμένη의 포괄적 세계 지시를 한국어로 간결하게 담아 제국적 보편성을 드러냈습니다.
theological_decisions:
- issue: 그리스어 본문의 신칭호와 히브리어 평행본문의 차이
  chosen_reading: 본문은 그리스어를 따라 ‘이스라엘의 주, 지극히 높으신 주’로 번역했습니다.
  alternative_readings:
  - 히브리어 평행본문을 따라 ‘하늘의 하나님 야훼’로 옮길 수 있습니다.
  rationale: 1 에스드라스의 주번역 대상은 그리스어 본문이므로, 평행본문의 히브리어 표현은 본문이 아니라 주석적 대조로 처리하는 것이 원천 우선 원칙에 부합합니다.
  doctrine_reference: 원어 우선, 평행본문은 대조 자료로 활용
- issue: κύριος의 존칭 수준
  chosen_reading: 하나님께 직접 말하는 문장이 아니므로 ‘주’로 유지했습니다.
  alternative_readings:
  - ‘주님’으로 높여 옮길 수 있습니다.
  rationale: 본문은 고레스의 공적 선언이며, 그리스어의 호칭어 구조를 보존하기 위해 ‘주’가 더 직접적입니다.
  doctrine_reference: κύριος 기본값 '주'
