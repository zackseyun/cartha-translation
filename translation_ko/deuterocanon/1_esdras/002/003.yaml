    rationale: 영어 감사 기록과 히브리어 평행본문은 ‘the LORD, the God of heaven’에 해당합니다. ‘하늘의 하나님 야훼’가 아니라 ‘여호와, 하늘의 하나님’이라고 해야 순서와 호칭 관계가 보존됩니다.
