base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/007.yaml
  text: Then the heads of the ancestral houses of the tribes of Judah and Benjamin[a], and the priests and the Levites, and everyone whose spirit the Lord had stirred up, arose to go up to build the house of the Lord that is in Jerusalem.
  footnotes:
  - marker: a
    text: The Hebrew parallel in Ezra 1:5 reads 'everyone whose spirit God had stirred up.' 1 Esdras here reads 'the Lord.'
    reason: alternative_reading
translation:
  language: ko
  text: 그때 유다와 베냐민의 지파들 가운데서 조상 가문의 우두머리들과 제사장들과 레위인들과, 주께서 그 영을 감동하신 모든 사람이 일어나 예루살렘에 있는 주의 집을 건축하러 올라갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 병행본문 에스라 1:5는 ‘하나님께서 그 영을 감동하신’이라고 읽습니다. 1 에스드라는 여기서 ‘주’를 사용합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ ἀρχίφυλοι τῶν πατριῶν
  english_pob_choice: the heads of the ancestral houses
  chosen_korean: 조상 가문의 우두머리들
  alternatives_korean:
  - 가문의 수장들
  - 족장들
  - 조상 집안의 우두머리들
  lexicon: LSJ / HALOT
  rationale: 가문 단위를 가리키는 표현을 살리되, 한국어에서 자연스러운 ‘우두머리들’로 리더십을 분명하게 옮겼습니다.
- source_word: τῆς Ἰούδα καὶ Βενιαμεὶν φυλῆς
  english_pob_choice: of the tribes of Judah and Benjamin
  chosen_korean: 유다와 베냐민의 지파들 가운데서
  alternatives_korean:
  - 유다와 베냐민 지파의
  - 유다와 베냐민 지파들
  - 유다와 베냐민의 지파
  lexicon: LSJ
  rationale: φυλή의 복수성을 반영해 ‘지파들’로 옮기고, 두 지파에 속한 사람들을 가리키는 흐름을 한국어 어순에 맞게 정리했습니다.
- source_word: ἤγειρεν ... τὸ πνεῦμα
  english_pob_choice: had stirred up ... spirit
  chosen_korean: 그 영을 감동하신
  alternatives_korean:
  - 그 영을 일깨우신
  - 그 영을 깨우신
  - 그 마음을 움직이신
  lexicon: LSJ / HALOT
  rationale: 성경적 관용구인 ‘영을 감동시키다’는 내적 촉발의 비유를 유지하면서도 현대 한국어에서 자연스럽게 읽히도록 했습니다.
- source_word: Κύριος
  english_pob_choice: the Lord
  chosen_korean: 주
  alternatives_korean:
  - 주님
  - 야훼
  lexicon: LSJ
  rationale: 본문의 κύριος를 프로젝트 기본어휘에 따라 ‘주’로 옮겼고, 여기서는 인용문이 아니라 서술문이므로 ‘주께서’로 처리했습니다.
theological_decisions:
- issue: 1 Esdras의 κύριος를 어떻게 표기할지
  chosen_reading: 주
  alternative_readings:
  - 야훼
  - 하나님
  rationale: 이 문헌의 그리스어 본문이 κύριος를 사용하므로, 본문은 그 직접 대응인 ‘주’로 유지했습니다. 히브리 병행본문의 ‘하나님’은 참고 자료로만 남기고 본문에는 반영하지 않았습니다.
  doctrine_reference: POB 원어 우선 원칙; deuterocanon에서는 그리스어 본문 우선
