  - 반란적이어서 / 반란자들이어서
  - 항거하는 / 항거자들
  lexicon: LSJ
  rationale: 이 절의 고발은 종교적 배교보다 정치적 반역을 가리키므로, 신학적으로 무거운 ‘배교’보다 ‘반역’ 계열이 원문의 행정적·정치적 성격을 더 정확히 드러냅니다.
- source_word: ὀχλοῦσα
  english_pob_choice: troubling
  chosen_korean: 괴롭혔고
  alternatives_korean:
  - 혼란스럽게 했고
  - 소란을 일으켰고
  - 불편하게 했고
  lexicon: LSJ
  rationale: 동사는 지속적으로 소동과 폐를 끼치는 의미이므로, 한국어에서는 왕들과 도시들에게 ‘괴롭혔다’로 옮겨 지속적 방해의 뉘앙스를 살렸습니다.
- source_word: πολιορκίας συνεσταμένοι
  english_pob_choice: had established blockades / had organized sieges
  chosen_korean: 포위들을 세워 두었
  alternatives_korean:
  - 포위를 조직해 두었
  - 공성전을 벌여 왔
  - 포위망을 구축해 두었
  lexicon: LSJ
  rationale: πολιορκία는 ‘포위/공성’의 넓은 의미를 가지며, συνεσταμένοι는 이미 조직·설치된 상태를 가리키므로 ‘포위들을 세워 두었’으로 번역해 상태성과 반복성을 함께 살렸습니다.
- source_word: ἠρημώθη
  english_pob_choice: was laid waste
  chosen_korean: 황폐해졌습니다
  alternatives_korean:
  - 폐허가 되었습니다
  - 황무지가 되었습니다
  - 파괴되었습니다
  lexicon: LSJ
  rationale: 수동형의 결과 상태를 자연스럽게 드러내는 현대 한국어로 ‘황폐해졌습니다’를 선택했습니다.
