  verdict: revise
  source_fidelity: 핵심 고발을 정치적 반역으로 옮긴 점과 ὑπομνηματισμοῖς를 ‘기록들’로 옮긴 점은 적절합니다. 그러나 πολιορκίας συνεσταμένοι의 복수성과 조직·수행의 의미를 ‘포위들을 세워 두었’으로 표현한 것은 한국어로 부자연스럽고 뜻도 불분명합니다. 또한 ἐκείνη(‘그’)와 αὕτη(‘이’)의 지시 차이를 반영하는 편이 좋습니다.
  naturalness: 초안은 ‘너는 … 알게 될 것입니다’처럼 청자 높임과 종결 높임이 섞여 있습니다. 합쇼체에서는 ‘당신은/그대는 … 알게 될 것입니다’처럼 일관되게 써야 합니다. ‘포위들을 세워 두다’도 현대 표준 한국어의 자연스러운 결합이 아닙니다.
  terminology: ‘반역적’ 및 ‘반역자들’은 이 행정·정치 문맥에 맞으며, 종교적 의미가 강한 ‘배교’보다 낫습니다. πολιορκίας는 여기서 ‘포위 작전’으로 옮기고 각주에서 ‘공성전’이라는 대안을 제시하는 것이 자연스럽고 원문의 범위를 보존합니다.
  issues:
  - severity: medium
    issue: 합쇼체 인칭·종결의 불일치
    rationale: ‘너는’은 비격식 또는 낮춤의 청자 지시인데 ‘알게 될 것입니다’는 합쇼체입니다. 목표 등록에 맞춰 ‘당신은’으로 통일해야 합니다.
  - severity: medium
    issue: ‘포위들을 세워 두었’의 비자연성과 의미 불명확성
    rationale: 한국어에서 ‘포위’를 복수로 세우거나 설치한다고 하지 않습니다. πολιορκίας συνεσταμένοι의 복수 및 조직된 지속 행위를 ‘포위 작전을 벌여 왔다’로 옮기는 것이 자연스럽습니다.
  - severity: low
    issue: 각주 앵커 위치
    rationale: 각주는 πολιορκίας의 번역 대안에 관한 것이므로 문장 끝이 아니라 ‘포위 작전’ 바로 뒤에 붙여야 합니다.
  - severity: low
    issue: 지시사의 미세한 차이
    rationale: 본문은 앞에서 ἐκείνη(‘그 도시’)를, 결론에서 αὕτη(‘이 도시’)를 사용합니다. 한국어에서도 이를 구별하면 원문 충실도가 높아집니다.
  revised_text: 그리고 당신은 기록들에서 이 일들에 관하여 기록된 것을 찾아볼 것이며, 그 도시가 반역적이어서 왕들과 도시들을 괴롭혔고, 그 안에 있는 유다인들도 반역자들이어서 예로부터 그 안에서 포위 작전을 벌여 왔음을 알게 될 것입니다. 그러므로 이 도시는 황폐해졌습니다.
  revised_footnotes:
  - marker: a
    text: ‘포위 작전’은 원문의 πολιορκίας를 넓게 옮긴 것입니다. 이 말은 ‘공성전’ 또는 더 넓게 ‘포위·공성 활동’을 가리킬 수 있습니다.
    reason: lexical_alternative
