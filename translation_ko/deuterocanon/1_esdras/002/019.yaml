base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/019.yaml
  text: And you will find in the records what has been written about these things[a], and you will know that that city was rebellious, troubling kings and cities, and that the Jews in it were rebels and had established blockades from of old; for this reason that city was laid waste.
  footnotes:
  - marker: a
    text: Or 'sieges' for 'blockades'; the Greek term can denote siege activity more broadly.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너는 기록들에서 이 일들에 관해 기록된 것을 찾게 될 것이며, 그 도시가 반역적이어서 왕들과 도시들을 괴롭혔고, 그 안의 유다인들도 반역자들이어서 옛날부터 그 안에 포위들을 세워 두었음을 알게 될 것입니다. 그러므로 이 도시는 황폐해졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘포위들’은 원문의 πολιορκίας를 넓게 옮긴 것입니다. 이 말은 ‘공성전’보다 넓게 ‘포위/포위 작전’을 가리킬 수 있습니다.
    reason: lexical_alternative
