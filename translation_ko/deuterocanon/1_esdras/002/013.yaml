- from: 그리고 모든 기구가 — 금과 은의 것들 — 모두 합하여 오천사백육십구 개가 옮겨졌습니다.[a][b]
  to: 금과 은으로 된 모든 기구가 옮겨졌는데, 그 수는 모두 오천사백육십구 개였습니다.[a][b]
  rationale: 수정문은 σκεύη의 범주와 금·은 수식을 명확히 연결하고, ἐκομίσθη의 피동적 운반 사건 및 총수 5,469를 자연스러운 한국어 문장으로 보존합니다. 각주 b는 이 절의 그리스어가 항목별 목록을 제공한다는 부정확한 진술을 제거하고, 그리스어 본문을 우선한다는 번역 원칙을 분명히 합니다.
