    reason: alternative_reading
translation:
  language: ko
  text: 금과 은으로 된 모든 기구가 옮겨졌는데, 그 수는 모두 오천사백육십구 개였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 그리스어는 ‘운반되었습니다’라는 뜻의 동사를 사용합니다. 문맥에 따라 ‘올려 운반되었습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 에스라 1:9–10의 병행 히브리어 목록은 항목의 배열과 수량에서 차이가 있습니다. 여기서는 에스드라상 그리스어 본문의 총수(5,469)를 따릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: τὰ δὲ πάντα σκεύη
  english_pob_choice: all the vessels
  chosen_korean: 모든 기구
  alternatives_korean:
  - 모든 그릇
  - 모든 용기
  lexicon: LSJ
  rationale: σκεύη는 성전 맥락에서 그릇·기구·용품을 가리킬 수 있으므로, 한국어에서는 문맥을 지나치게 좁히지 않는 ‘기구’로 옮겼습니다.
- source_word: ἐκομίσθη
  english_pob_choice: were brought up
  chosen_korean: 옮겨졌습니다
  alternatives_korean:
  - 올려졌습니다
  - 가져와졌습니다
  lexicon: LSJ
  rationale: 동사는 단순한 존재 상태가 아니라 운반·이동을 나타내므로, 자연스러운 수동 표현인 ‘옮겨졌습니다’로 옮겼습니다. ‘올려’의 방향성은 본문만으로는 필수적이지 않아 과도한 해석을 피했습니다.
- source_word: χρυσᾶ καὶ ἀργυρᾶ
  english_pob_choice: the gold and silver ones
  chosen_korean: 금과 은의 것들
  alternatives_korean:
  - 금 그릇과 은 그릇들
  - 금과 은으로 된 것들
  lexicon: LSJ
  rationale: 형용사들이 앞의 기구를 수식하므로, 한국어에서는 반복을 피하면서도 대상이 생략된 수식 구조를 살린 ‘금과 은의 것들’로 표현했습니다.
- source_word: πεντακισχίλια τετρακόσια ἑξήκοντα ἐννέα
  english_pob_choice: five thousand four hundred and sixty-nine
  chosen_korean: 오천사백육십구 개
  alternatives_korean:
  - 5,469개
  - 오천사백육십구
  lexicon: LSJ
  rationale: 그리스어 수량 표현을 그대로 옮기되, 한국어에서는 개체 수를 뜻하는 보조 단위 ‘개’를 보태어 문장 성립을 자연스럽게 했습니다.
theological_decisions:
- issue: 성전 기구의 이동 서술에서 방향성을 얼마나 드러낼지
  chosen_reading: 본문의 핵심은 기구가 실제로 이동·운반되었다는 사실이므로, ‘옮겨졌습니다’로 사건성을 유지했습니다.
  alternative_readings:
  - 올려졌습니다
  - 가져왔습니다
  rationale: 그리스어 ἐκομίσθη는 운반/이송을 뜻하지만, 이 구절만으로 ‘예루살렘으로 올라감’이라는 방향을 반드시 추가할 필요는 없습니다. 따라서 사건의 사실성은 살리고 지리적 해석은 절제했습니다.
  doctrine_reference: 본문 서술의 직접성 유지
