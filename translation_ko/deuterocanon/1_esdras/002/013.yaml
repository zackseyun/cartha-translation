  text: And all the vessels were brought up[a], the gold and silver ones[b], five thousand four hundred and sixty-nine in all.
  footnotes:
  - marker: a
    text: The Greek reads 'were brought up,' a wording that may reflect the return of the temple vessels to Jerusalem. A simpler rendering is 'were brought.'
