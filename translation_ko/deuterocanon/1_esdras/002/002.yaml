base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/002.yaml
  text: the Lord stirred up the spirit of Cyrus king of the Persians[a], and he made a proclamation throughout all his kingdom, and also in writing, saying,
  footnotes:
  - marker: a
    text: 'Greek: ''king of the Persians''; the Hebrew parallel in Ezra 1:1 has ''king of Persia.'''
    reason: alternative_reading
translation:
  language: ko
  text: 주께서 페르시아 왕 고레스의 영을 움직이셨고, 그가 자기 왕국 전체에 공포하고 또한 글로도 이르기를,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘페르시아 왕들/페르시아인들의 왕’(복수형)으로 읽습니다. 히브리어 평행본문은 ‘페르시아 왕’(단수형)입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἤγειρεν
  english_pob_choice: stirred up
  chosen_korean: 움직이셨고
  alternatives_korean:
  - 일으키셨고
  - 자극하셨고
  - 깨우셨고
  lexicon: BDAG
  rationale: 영에 대한 하나님의 내적 작용을 한국어로 자연스럽게 살리면서도, 단순한 물리적 ‘일으킴’보다 의지와 충동을 포함하는 뜻을 드러냅니다.
- source_word: Κύριος
  english_pob_choice: the Lord
  chosen_korean: 주께서
  alternatives_korean:
  - 주님께서
  - 주께
  lexicon: BDAG
  rationale: 여기서는 이스라엘의 하나님을 가리키므로 ‘주께서’로 옮겨, 본문 내 다른 인물 호칭과 구별되는 주어 역할을 분명히 했습니다.
- source_word: τὸ πνεῦμα
  english_pob_choice: the spirit
  chosen_korean: 영
  alternatives_korean:
  - 마음
  - 정신
  - 영혼
  lexicon: BDAG
  rationale: 그리스어의 추상적·내적 요소를 보존하기 위해 ‘영’을 택했습니다. 문맥상 고레스의 내적 방향성이지만, ‘마음’보다 원문의 표현을 덜 축소합니다.
- source_word: βασιλέως Περσῶν
  english_pob_choice: king of the Persians
  chosen_korean: 페르시아 왕
  alternatives_korean:
  - 페르시아인들의 왕
  - 페르시아의 왕
  lexicon: BDAG
  rationale: 영어 본문의 ‘king of the Persians’를 한국어 관용에 맞게 압축하되, 고유명사와 통치 칭호를 자연스럽게 연결했습니다. 본문이 복수형을 쓰는 점은 각주로 보완했습니다.
- source_word: ἐκήρυξεν
  english_pob_choice: made a proclamation
  chosen_korean: 공포하고
  alternatives_korean:
  - 선포하고
  - 선언하고
  - 포고하고
  lexicon: BDAG
  rationale: 공적 통지의 성격을 가장 직접적으로 드러내는 한국어 법령/칙령 어휘를 사용했습니다. 이어지는 ‘글로도’와 짝을 이루어 구두·문서 양식을 모두 살립니다.
- source_word: διὰ γραπτῶν
  english_pob_choice: in writing
  chosen_korean: 글로도
  alternatives_korean:
  - 문서로도
  - 서면으로도
  - 기록으로도
  lexicon: BDAG
  rationale: 구두 공포와 병렬되는 문자 전달을 간결하게 살렸습니다. ‘서면으로도’보다 문맥이 더 직접적이고, 고대 칙령의 공개적 성격도 유지합니다.
theological_decisions:
- issue: 하나님의 직접적 주권과 고레스의 칙령
  chosen_reading: 본문이 고레스의 정치적 조치가 아니라 주께서 그의 영을 움직이신 결과로 제시되도록 번역했습니다.
  alternative_readings:
  - 주께서 허용하신 정도로 완화
  - 고레스의 자발적 정치 판단으로 중립화
  rationale: 그리스어와 히브리어 평행본문 모두 하나님의 능동적 개입을 드러냅니다. 번역은 이 신학적 긴장을 약화시키지 않고 그대로 보존해야 합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; original-language primacy over translation tradition.'
