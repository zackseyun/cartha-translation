base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/008.yaml
  text: And those around them helped in every way[a], with silver and gold, with horses, with livestock, and with very many freewill offerings[c][b], from all whose mind had been stirred.
  footnotes:
  - marker: a
    text: The Hebrew parallel (Ezra 1:6) reads more like 'goods/property' rather than 'horses.' 1 Esdras here follows its Greek wording.
    reason: alternative_reading
  - marker: b
    text: Greek 'prayers' may reflect a textual or interpretive divergence from the Hebrew parallel, which has 'choice gifts' or 'precious things.'
    reason: textual_variant
  - marker: c
    text: Or 'whose spirit had been stirred,' reflecting the Hebrew parallel's idiom more closely; Greek literally says 'whose mind had been stirred.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들 주위에 있던 사람들은 은과 금과 말과 가축으로, 또 마음이 일깨워진 많은 이들이 드린 매우 많은 기도와 서원으로[a][b][c] 모든 일에서 그들을 도왔습니다.
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 히브리어 병행본문(에스라 1:6)은 여기서 ‘말’보다 더 일반적인 ‘재물’ 또는 ‘소유물’에 가까운 말을 사용합니다. 제1 에스드라서는 그리스어 본문의 ‘말’을 따릅니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어 εὐχαῖς는 ‘기도들’ 또는 ‘서원들’을 뜻할 수 있습니다. 히브리어 병행본문은 이 자리에 ‘귀한 것들’ 또는 ‘선택한 선물들’에 가까운 말을 둡니다.
    reason: textual_variant
  - marker: c
    text: 직역하면 ‘그들의 마음이 일깨워진 많은 이들’입니다. 히브리어 병행본문은 이와 비슷한 자리에서 ‘영이 감동된’이라는 관용적 표현을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ περικύκλῳ αὐτῶν
  english_pob_choice: those around them
  chosen_korean: 그들 주변의 사람들
  alternatives_korean:
  - 그들 둘레의 사람들
  - 그들 가까이에 있던 사람들
  lexicon: LSJ
  rationale: 주변에 있던 사람들을 가리키는 표현으로, 한국어에서는 자연스럽게 ‘그들 주변의 사람들’로 옮기는 것이 원문 의미를 잘 살립니다.
- source_word: ἐβοήθησαν ἐν πᾶσιν
  english_pob_choice: helped in every way
  chosen_korean: 모든 면에서 그들을 도왔습니다
  alternatives_korean:
  - 모든 일에 그들을 도왔습니다
  - 모든 방식으로 그들을 도왔습니다
  lexicon: BDAG
  rationale: ἐβοήθησαν의 기본 의미를 살리되, ἐν πᾶσιν의 포괄성을 한국어의 ‘모든 면에서’로 자연스럽게 반영했습니다.
- source_word: ἵπποις, κτήνεσιν
  english_pob_choice: horses, with livestock
  chosen_korean: 말과 가축
  alternatives_korean:
  - 말과 집짐승
  - 말과 가축들
  lexicon: LSJ
  rationale: 그리스어가 구체적으로 ‘말’과 넓은 범주의 가축을 나열하므로, 한국어에서도 두 항목을 분명히 구분해 옮겼습니다.
- source_word: εὐχαῖς
  english_pob_choice: freewill offerings
  chosen_korean: 자원자의 기도들
  alternatives_korean:
  - 기원들
  - 서원들
  lexicon: LSJ
  rationale: 본문의 그리스어는 문자 그대로는 ‘기도들’이지만, 영어 POB는 히브리어 병행본문과의 차이를 반영해 의미를 달리 잡고 있습니다. 한국어 본문은 그리스어 본문을 따라 ‘기도들’을 유지하되, 자원성의 뉘앙스를 ‘자원자의’로 드러냈습니다.
- source_word: πολλῶν ὧν ὁ νοῦς ἠγέρθη
  english_pob_choice: from many whose mind had been stirred
  chosen_korean: 많은 사람들의 마음이 일어났기 때문입니다
  alternatives_korean:
  - 많은 사람들의 생각이 일어났기 때문입니다
  - 많은 사람들의 마음이 움직였기 때문입니다
  lexicon: LSJ
  rationale: νοῦς를 문자적으로 ‘마음’으로 옮기고, ἠγέρθη의 수동적 ‘일어나다/일으켜지다’ 이미지를 살려 동기가 내부에서 발생했음을 표현했습니다.
theological_decisions:
- issue: 1 Esdras의 그리스어 본문과 히브리어 병행본문 사이의 차이
  chosen_reading: 그리스어 본문을 우선하여 ‘말’과 ‘기도들’을 본문에 반영했습니다.
  alternative_readings:
  - 히브리어 병행본문에 맞추어 ‘재물/소유’와 ‘선물’로 완화해 옮기기
  - 두 본문을 절충해 일반적인 ‘물품’으로 처리하기
  rationale: 이 책은 그리스어를 기본 본문으로 삼되 병행본문을 대조용으로 활용하므로, 본문 어휘는 그리스어를 따라가면서도 해설적 흔적을 번역 안에 과도하게 끌어들이지 않았습니다.
