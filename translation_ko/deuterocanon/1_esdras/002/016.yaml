base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/016.yaml
  text: 'To King Artaxerxes our lord: your servants[a], Rathymus, the one over records, and Samellius the scribe, and the rest of their council[c][b], and those in Coele-Syria and Phoenicia.'
  footnotes:
  - marker: a
    text: Greek Rathymus and Samellius correspond approximately to the MT parallel's Rehum and Shimshai.
    reason: alternative_reading
  - marker: b
    text: The Greek title rendered 'the recorder' is idiomatic and somewhat uncertain; more literally, it is 'the one over the matters brought forward.'
    reason: lexical_alternative
  - marker: c
    text: Coele-Syria is the historical regional name in the Greek text.
    reason: cultural_note
translation:
  language: ko
  text: 아르타크세르크세스 왕이시며 우리 주님께, 당신의 종들인 라티무스[a], 곧 제기되는 사안을 맡은 사람[b], 사멜리우스 서기관, 그들의 평의회에 속한 나머지 사람들, 그리고 코일레시리아와 페니키아에 있는 사람들[c]로부터입니다.
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 라티무스와 사멜리우스는 MT 평행본문의 르훔과 심새에 대략 대응합니다.
    reason: 그리스어 본문의 인명 형태를 보존하면서 MT 평행본문의 대응 인명을 알립니다.
  - marker: b
    text: 그리스어는 문자적으로 ‘앞에 제기되는 사안들을 맡은 사람’에 가깝습니다. 행정 직함의 정확한 의미는 불확실합니다.
    reason: 원문의 관용적이고 불확실한 행정 표현을 과도하게 특정하지 않기 위함입니다.
  - marker: c
    text: 코일레시리아는 그리스어 본문에 나타나는 역사적 지역명입니다.
    reason: 지명 보존의 의미를 설명합니다.
lexical_decisions:
- source_word: Βασιλεῖ Ἀρταξέρξῃ κυρίῳ
  english_pob_choice: To King Artaxerxes our lord
  chosen_korean: 아르닥사스다 왕, 곧 우리 주님께
  alternatives_korean:
  - 아르탁세르크세스 왕, 곧 우리 주님께
  - 아르닥사스다 왕에게
  lexicon: LSJ
  rationale: 서간문의 여격 호칭을 한국어 서신체로 옮겼고, κυρίῳ는 궁정 호칭의 뉘앙스를 살려 ‘우리 주님’으로 처리했습니다.
- source_word: οἱ παῖδές σου
  english_pob_choice: your servants
  chosen_korean: 당신의 종들
  alternatives_korean:
  - 당신의 노예들
  - 당신의 시종들
  lexicon: BDAG
  rationale: 궁정 문맥에서 παῖδες는 지배자에게 복속된 하급 신하들을 가리키므로 ‘종들’이 가장 무난하며, 본문이 노예 상태 자체를 강조하지는 않습니다.
- source_word: ὁ τὰ προσπίπτοντα
  english_pob_choice: the one over records
  chosen_korean: 기록 담당자
  alternatives_korean:
  - 일을 접수하는 사람
  - 사안 담당자
  - 기록관
  lexicon: LSJ
  rationale: 직역은 어색하므로 행정 직함으로 기능하는 뜻을 살려 ‘기록 담당자’로 옮겼습니다. 다만 원문은 정확한 직함보다 업무 범주를 가리키는 표현입니다.
- source_word: ὁ γραμματεὺς
  english_pob_choice: the scribe
  chosen_korean: 서기관
  alternatives_korean:
  - 서기
  - 기록관
  lexicon: BDAG
  rationale: γραμματεύς의 행정적 직함을 한국어 성서어휘에 맞춰 ‘서기관’으로 옮겼습니다.
- source_word: οἱ ἐπίλοιποι τῆς βουλῆς αὐτῶν
  english_pob_choice: the rest of their council
  chosen_korean: 그들의 회의의 나머지 사람들
  alternatives_korean:
  - 그들의 의회의 나머지 사람들
  - 그들의 평의회의 나머지 사람들
  lexicon: LSJ
  rationale: βουλή는 숙의체/평의기구를 가리키므로 ‘회의’로 옮겨, 단순한 사교 모임이 아니라 공식 자문 집단임을 드러냈습니다.
- source_word: οἱ ἐν κοίλῃ Συρίᾳ καὶ Φοινίκῃ
  english_pob_choice: those in Coele-Syria and Phoenicia
  chosen_korean: 코일레 시리아와 페니키아에 있는 사람들
  alternatives_korean:
  - 코엘레-시리아와 페니키아에 있는 사람들
  - 빈 시리아와 페니키아에 있는 사람들
  lexicon: LSJ
  rationale: κοίλη Συρία는 고유한 역사 지명으로, 지명을 보존하는 번역이 본문의 지리적 의미를 가장 잘 살립니다.
theological_decisions:
- issue: 왕에게 올리는 서간문의 예의적 호칭과 소속 표현
  chosen_reading: 본문을 직접 화자 발화로 처리하지 않고, 공식 서신의 머리말로서 ‘…께’ 구조를 유지했습니다.
  alternative_readings:
  - 평서문처럼 풀어 쓰기
  - ‘우리 주님’을 생략하기
  rationale: 원문은 사절 서한의 수신처 표식을 담고 있으므로, 한국어에서도 문서적·예식적 형식을 보존하는 것이 의미를 가장 정확히 전달합니다.
  doctrine_reference: 서간문 체계와 본문 장르 보존 원칙
