revisions:
- from: '「아르닥사스다 왕, 곧 우리 주님께: 당신의 종들인 라투무스, 기록 담당자, 그리고 서기관 사멜리우스와 그들의 회의의 나머지 사람들, 그리고 코일레 시리아와 페니키아에 있는 사람들로부터입니다。」[a][b][c]'
  to: 아르타크세르크세스 왕이시며 우리 주님께, 당신의 종들인 라티무스[a], 곧 제기되는 사안을 맡은 사람[b], 사멜리우스 서기관, 그들의 평의회에 속한 나머지 사람들, 그리고 코일레시리아와 페니키아에 있는 사람들[c]로부터입니다.
  rationale: 그리스어를 1차 기준으로 하여 인명을 음역하고, 불확실한 행정 직함을 ‘기록’으로 한정하지 않았습니다. 또한 βουλή를 ‘평의회’로 명료하게 옮기고, 한국어 서간 머리말에 맞게 발신자 열거를 ‘…로부터입니다’로 마무리했습니다. 이는 원문의 동사 없는 공식 수신·발신 표제 구조를 해석적으로 과장하지 않고 자연스럽게 전달합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T05:29:43Z'
review_pass:
  verdict: revise
  source_fidelity: 그리스어 본문을 기준으로 볼 때, 현 번역은 서간문의 수신자와 발신자 열거라는 기본 구조를 대체로 보존합니다. 그러나 Ἀρταξέρξης의 그리스어형을 MT 계열의 ‘아르닥사스다’로 옮긴 점은 주 본문 우선 원칙과 맞지 않으며, ὁ τὰ προσπίπτοντα를 ‘기록 담당자’로 특정한 것은 ‘제기되거나 상정되는 사안들’을 가리키는 원문의 불확실한 업무 표현을 지나치게 좁힙니다.
  naturalness: ‘그들의 회의의 나머지 사람들’은 현대 표준 한국어에서 부자연스럽고 βουλή의 공식 자문·평의 기구 의미도 충분히 드러내지 못합니다. 서간 머리말로서 ‘…께, …로부터’ 구조를 쓰면 자연스럽고, 원문의 동사 없는 표제 형식도 무리 없이 재현됩니다.
  terminology: Ἀρταξέρξης는 그리스어형에 따라 ‘아르타크세르크세스’로, Ῥάθυμος는 ‘라티무스’로 음역하는 것이 안전합니다. γραμματεύς의 ‘서기관’은 적절합니다. κοίλη Συρία는 역사 지명 ‘코일레시리아’로 보존할 수 있습니다. ‘우리 주님’은 왕에게 쓰는 궁정적 존칭으로 문맥상 적절합니다.
  issues:
  - severity: medium
    issue: 그리스어 고유명 Ἀρταξέρξης를 ‘아르닥사스다’로 처리함
    rationale: ‘아르닥사스다’는 MT/아람어 계열의 성서 관용형에 가깝지만, 이 단락의 1차 번역 기준은 그리스어입니다. MT와의 대응은 각주에서 이미 처리하므로 주 본문에는 그리스어형을 보존하는 편이 낫습니다.
  - severity: medium
    issue: ὁ τὰ προσπίπτοντα를 ‘기록 담당자’로 확정함
    rationale: 이 표현은 문자적으로 ‘앞에 제기되는/상정되는 일들을 [맡은 사람]’ 정도이며, 기록 업무를 직접 뜻하지 않습니다. 행정 직함의 정확한 성격이 불확실하므로 더 넓고 비확정적인 표현 및 각주가 필요합니다.
  - severity: low
    issue: ‘그들의 회의의 나머지 사람들’의 자연성과 βουλή 반영 부족
    rationale: βουλή는 공식 평의·자문 기구입니다. ‘그들의 평의회에 속한 나머지 사람들’이 자연스럽고 집단 소속을 더 잘 보존합니다.
  - severity: medium
    issue: 각주 표지가 관련 어구에 붙어 있지 않음
    rationale: a는 인명, b는 라티무스의 직함, c는 코일레시리아에 각각 바로 붙여야 독자가 각주의 적용 범위를 혼동하지 않습니다.
  revised_text: 아르타크세르크세스 왕이시며 우리 주님께, 당신의 종들인 라티무스[a], 곧 제기되는 사안을 맡은 사람[b], 사멜리우스 서기관, 그들의 평의회에 속한 나머지 사람들, 그리고 코일레시리아와 페니키아에 있는 사람들[c]로부터입니다.
