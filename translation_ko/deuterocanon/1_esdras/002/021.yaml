base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/021.yaml
  text: 'Then the king wrote back to Rathymus[a], the recorder of the complaints, and to Beeltethmus, and to Samellius the scribe, and to the rest of their associates who lived in Samaria and Syria and Phoenicia[b], as follows:'
  footnotes:
  - marker: a
    text: The Greek text names the recipients as living in Samaria and Syria and Phoenicia; the parallel Aramaic tradition in Ezra differs in names and wording. This translation follows the Greek witness of 1 Esdras while using the parallel as a control.
    reason: textual_variant
  - marker: b
    text: Or 'the chancellor' for 'the recorder of what was reported'; the Greek expression is administrative and somewhat idiomatic.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 왕은 보고된 일을 적는 관리 라튀무스와 벨텔드무스와 서기 사멜리우스와, 사마리아와 시리아와 페니키아에 살던 그 밖의 동료들에게 다음과 같이 답장을 보냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 사마리아, 시리아, 페니키아에 사는 사람들을 수신자로 밝히며, 에스라의 평행 본문 전승은 이름과 표현이 다릅니다. 이 번역은 1 에스드라스의 그리스어 증언을 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἀντέγραψεν
  english_pob_choice: wrote back
  chosen_korean: 답장을 보냈습니다
  alternatives_korean:
  - 서면으로 답했습니다
  - 글로 응답했습니다
  lexicon: BDAG
  rationale: 서신 맥락의 반응 동사로서, 단순한 ‘썼다’보다 ‘답장을 보냈습니다’가 대응성과 문맥을 자연스럽게 드러냅니다.
- source_word: τῷ γράφοντι τὰ προσπίπτοντα
  english_pob_choice: the recorder of what was reported
  chosen_korean: 보고된 일을 적는 관리
  alternatives_korean:
  - 보고 사항을 기록하는 자
  - 전달된 일을 적는 서기관
  lexicon: BDAG
  rationale: γράφος 계열의 행정적 기록 행위와 τὰ προσπίπτοντα의 ‘보고되어 들어온 일들’이라는 뜻을 살려, 직함을 과장하지 않으면서도 기능을 드러냈습니다.
- source_word: Σαμελλίῳ γραμματεῖ
  english_pob_choice: Samellius the scribe
  chosen_korean: 서기 사멜리우스
  alternatives_korean:
  - 사멜리우스 서기관
  - 사멜리우스 비서
  lexicon: BDAG
  rationale: γραμματεύς는 여기서 행정 직함이므로, 현대 한국어에서 비교적 직접적인 ‘서기’를 택했습니다.
- source_word: τοῖς συντασσομένοις
  english_pob_choice: their associates
  chosen_korean: 동료들
  alternatives_korean:
  - 함께 임명된 자들
  - 함께 배치된 자들
  - 협력자들
  lexicon: BDAG
  rationale: 함께 정렬·배속된 사람들을 가리키는 넓은 표현이므로, 과도한 관직 추정을 피하는 ‘동료들’로 옮겼습니다.
- source_word: ἐν Σαμαρείᾳ καὶ Συρίᾳ καὶ Φοινίκῃ
  english_pob_choice: in Samaria and Syria and Phoenicia
  chosen_korean: 사마리아와 시리아와 페니키아에
  alternatives_korean:
  - 사마리아와 시리아와 페니키아 안에
  - 사마리아, 시리아, 그리고 페니키아에
  lexicon: BDAG
  rationale: 세 지역 목록을 그대로 유지하되, 한국어 문장 흐름에 맞게 위치 부사를 자연스럽게 배치했습니다.
