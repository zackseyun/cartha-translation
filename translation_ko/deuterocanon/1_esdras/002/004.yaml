revisions:
- from: 그리고 그분은 내게 예루살렘—유다에 있는 예루살렘—에 그분을 위해 집을 세우라고 지시하셨습니다.[a][b]
  to: 그리고 그분은 내가 유다에 있는 예루살렘[b]에 그분을 위한 집[a]을 짓도록 지시하셨습니다.
  rationale: 대시로 삽입된 중복 표현을 ‘유다에 있는 예루살렘’으로 바꾸어 그리스어의 수식·설명 구조를 자연스러운 한국어로 반영했습니다. ‘집’은 유지하여 οἶκον을 ‘성전’으로 해석적으로 대체하지 않았고, ‘짓도록 지시하셨습니다’는 ἐσήμανέν의 위임·지시 의미를 과도하게 강화하지 않으면서 전달합니다. 각주는 각각의 해당 어휘에 붙여 범위를 분명히 했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T05:29:30Z'
review_pass:
  verdict: revise
  source_fidelity: 그리스어는 ἐσήμανέν(알리다/지시하다/맡기다의 폭을 지닌 동사)과 부정사 οἰκοδομῆσαι를 사용하여 건축의 위임·지시를 나타냅니다. ‘짓도록 지시하셨습니다’는 이 문맥에서 안전합니다. οἶκον은 ‘집’으로 유지하고, τῇ ἐν τῇ Ἰουδαίᾳ는 ‘유다에 있는 예루살렘’으로 자연스럽게 반영해야 합니다.
  naturalness: 초안의 ‘예루살렘—유다에 있는 예루살렘—에’는 같은 지명을 부자연스럽게 반복하며 대시 삽입도 현대 한국어 성서 문체에 맞지 않습니다. ‘유다에 있는 예루살렘에’로 수식 관계를 한 번에 처리하는 것이 자연스럽습니다.
  terminology: ‘유다’, ‘예루살렘’, ‘집’은 적절합니다. 성전이라는 의미를 본문에 풀어 넣지 않은 점도 원문 어휘에 충실합니다. ‘그분을 위해’보다 ‘그분을 위한’이 ‘집’을 직접 수식하여 더 자연스럽습니다.
  issues:
  - severity: medium
    issue: 예루살렘이 대시 사이에서 불필요하게 반복됨
    rationale: 그리스어의 ‘ἐν Ἰερουσαλὴμ τῇ ἐν τῇ Ἰουδαίᾳ’는 예루살렘을 유다에 있는 곳으로 설명하는 구조입니다. 초안의 삽입구는 한국어에서 중복되고 문장 흐름을 해칩니다.
  - severity: low
    issue: 각주 b가 본문의 명시적 지리 설명을 ‘문맥상’ 의미로 약화함
    rationale: ‘유다에 있는’은 문맥상 추론이 아니라 그리스어 본문에 명시되어 있습니다. 각주가 필요하다면 이를 직역적 설명으로 고쳐야 합니다.
  - severity: low
    issue: 각주 표지의 범위가 불분명함
    rationale: ‘집’ 관련 각주는 ‘집’ 바로 뒤에, 지리 설명 각주는 ‘예루살렘’ 바로 뒤에 두면 각주 대상이 명확합니다.
  revised_text: 그리고 그분은 내가 유다에 있는 예루살렘[b]에 그분을 위한 집[a]을 짓도록 지시하셨습니다.
