base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/004.yaml
  text: and he has appointed me to build a house for him in Jerusalem[b][a], which is in Judea.
  footnotes:
  - marker: a
    text: Or, 'has commanded me' or 'has charged me.' The Greek verb can denote making known or commissioning; the Hebrew parallel more explicitly supports the sense of divine authorization.
    reason: lexical_alternative
  - marker: b
    text: Or, 'a temple for him.' The Greek literally says 'a house for him,' a common biblical way of referring to the temple.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그분은 내가 유다에 있는 예루살렘[b]에 그분을 위한 집[a]을 짓도록 지시하셨습니다.
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 그리스어는 문자 그대로 ‘집’이라고 말합니다. 여기서는 성전을 가리키는 일반적인 성서 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 예루살렘을 ‘유다에 있는’ 곳으로 명시하여 설명합니다.
    reason: source_note
lexical_decisions:
- source_word: ἐσήμανέν
  english_pob_choice: has appointed
  chosen_korean: 지시하셨습니다
  alternatives_korean:
  - 임명하셨습니다
  - 명령하셨습니다
  - 위임하셨습니다
  lexicon: LSJ
  rationale: 이 동사는 단순 통보보다 위임·지정의 뜻이 강하므로, 한국어에서는 왕적/신적 위임을 드러내는 ‘지시하셨습니다’로 옮기되 ‘명령하셨습니다’보다 과도하게 강하게 만들지 않았습니다.
- source_word: οἰκοδομῆσαι
  english_pob_choice: to build
  chosen_korean: 세우라고
  alternatives_korean:
  - 짓도록
  - 건축하도록
  - 건설하도록
  lexicon: LSJ
  rationale: 부정사 ‘to build’에 맞추어 자연스러운 목적 표현 ‘세우라고’로 옮겼습니다. 성전 맥락이 분명하지만 본문에는 ‘성전’이 아니라 ‘집/집을’이 있으므로, 동사만으로는 중립성을 유지했습니다.
- source_word: οἶκον
  english_pob_choice: a house
  chosen_korean: 집
  alternatives_korean:
  - 집 한 채
  - 성전
  - 집(성전)
  lexicon: LSJ
  rationale: POB의 ‘house’를 따라 본문 어휘를 살렸습니다. 문맥상 성전을 가리키지만, 해석어 ‘성전’으로 바꾸지 않고 ‘집’으로 두어 원문 표현을 보존했습니다.
- source_word: τῇ ἐν τῇ Ἰουδαίᾳ
  english_pob_choice: which is in Judea
  chosen_korean: 유다에 있는
  alternatives_korean:
  - 유다에 있는 그
  - 유다에 위치한
  - 유대에 있는
  lexicon: LSJ
  rationale: 관계적 설명구를 한국어의 위치 수식으로 자연스럽게 처리했습니다. 고유명사 ‘Ἰουδαίᾳ’는 본문 맥락에 따라 ‘유다’로 옮겼습니다.
theological_decisions:
- issue: 성전 의미를 ‘집’으로 유지할지 ‘성전’으로 풀어쓸지
  chosen_reading: 집으로 유지했습니다.
  alternative_readings:
  - 성전으로 풀어쓸 수 있습니다.
  - 집 한 채로 완화할 수 있습니다.
  rationale: 그리스어는 분명히 οἶκον(집)이라고 말하며, 본문 자체는 성전 해석을 요구하지 않습니다. 문맥상 성전이 분명하더라도 원문 어휘의 긴장을 유지하는 편이 POB의 원천 충실성에 맞습니다.
  doctrine_reference: Translation philosophy §§1, 5
- issue: ἐσήμανέν의 위임 뉘앙스를 얼마나 강하게 드러낼지
  chosen_reading: ‘지시하셨습니다’로 위임과 지정의 의미를 살렸습니다.
  alternative_readings:
  - 명령하셨습니다
  - 지정하셨습니다
  - 위임하셨습니다
  rationale: 히브리어 병행구는 신적 권위를 분명히 뒷받침하지만, 그리스어 동사 자체는 반드시 ‘명령’만 뜻하지 않습니다. 따라서 신적 승인과 위임을 드러내면서도 과장하지 않는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §1
