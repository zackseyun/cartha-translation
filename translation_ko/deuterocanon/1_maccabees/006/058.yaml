lexical_decisions:
- source_word: δῶμεν δεξιὰν
  english_pob_choice: let us give our right hand
  chosen_korean: 우리 오른손을 내밀고
  alternatives_korean:
  - 우리 손을 내밀고
  - 화친의 약속을 하고
  lexicon: LSJ
  rationale: 직역의 손짓 이미지를 살리되 한국어에서 자연스럽고 이해 가능한 관용으로 옮겼습니다. '오른손'은 평화·동맹의 서약이라는 제스처를 드러냅니다.
- source_word: ποιήσωμεν ... εἰρήνην
  english_pob_choice: let us make peace
  chosen_korean: 평화를 맺읍시다
  alternatives_korean:
  - 평화를 이루읍시다
  - 화평을 하읍시다
  lexicon: LSJ
  rationale: εἰρήνη를 관계의 상태로 자연스럽게 표현하면서도, 맺다는 동사가 동맹·화친의 성격을 잘 드러냅니다.
- source_word: μετὰ παντὸς ἔθνους αὐτῶν
  english_pob_choice: with their whole nation
  chosen_korean: 그들의 온 민족과
  alternatives_korean:
  - 그들의 모든 민족과
  - 그들의 전 민족과
  lexicon: LSJ
  rationale: ἔθνος을 여기서는 특정 집단 전체를 가리키는 '민족'으로 옮기고, παντός의 포괄성을 '온'으로 살렸습니다.
- source_word: νῦν οὖν
  english_pob_choice: Now then
  chosen_korean: 이제 그러면
  alternatives_korean:
  - 그러므로 이제
  - 자, 이제
  lexicon: LSJ
  rationale: 추론적 전환과 즉시성을 함께 드러내는 연결 표현으로, 앞 문맥에서의 결론 도출을 자연스럽게 받습니다.
theological_decisions:
- issue: 평화 제안의 정치·군사적 성격
  chosen_reading: 여기서 '평화'는 내적 영적 평안이 아니라 적대 관계를 끝내는 화친/동맹 제안으로 이해했습니다.
  alternative_readings:
  - 일반적인 평화 요청
  - 도덕적 화해 권면
  rationale: 문맥상 전쟁 상황에서의 협상 발언이므로, 관계적·정치적 의미를 보존하는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 본문 문맥 우선 원칙
