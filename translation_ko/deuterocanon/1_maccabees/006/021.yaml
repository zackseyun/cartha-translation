  text: 그리고 그들은 그곳에서, 곧 갇힌 상태에서[a] 나왔으며, 이스라엘의 경건하지 않은 자들 중 몇 사람이 그들에게 가담했습니다.
  philosophy: optimal-equivalence
  footnotes:
