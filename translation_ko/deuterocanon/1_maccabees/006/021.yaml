  text: And they came out from it[a], from the confinement, and some of the ungodly from Israel joined them.
  footnotes:
  - marker: a
    text: Or 'from the siege' or 'from being shut in'; the Greek term emphasizes confinement or enclosure.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 그곳에서, 즉 갇혀 있던 곳에서 나와, 이스라엘의 경건하지 않은 자들 중 몇 사람이 그들에게 가담했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘포위에서’, ‘갇혀 있음에서’로 옮길 수 있습니다. 그리스어는 군사적 포위보다 ‘안에 갇힌 상태’를 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον ἐξ αὐτοῦ
  english_pob_choice: came out from it
  chosen_korean: 그곳에서 … 나와
  alternatives_korean:
  - 그것에서 나와
  - 그곳에서 나가
  lexicon: BDAG
  rationale: 동작의 방향성을 살리되 한국어에서는 ‘그곳에서 나와’가 가장 자연스럽고, 뒤의 출처가 모호한 대명사도 문맥상 무리 없이 담습니다.
- source_word: ἐκ τοῦ συγκλεισμοῦ
  english_pob_choice: from the confinement
  chosen_korean: 갇혀 있던 곳에서
  alternatives_korean:
  - 감금에서
  - 봉쇄에서
  - 포위에서
  lexicon: LSJ
  rationale: συγκλεισμός의 핵심은 ‘안에 가두어 둠/갇힘’이므로, 군사적 상황을 단정하는 ‘포위’보다 상태를 드러내는 표현이 원문에 더 가깝습니다.
- source_word: ἐκολλήθησαν αὐτοῖς
  english_pob_choice: joined them
  chosen_korean: 그들에게 가담했습니다
  alternatives_korean:
  - 그들과 합류했습니다
  - 그들에게 붙었습니다
  - 그들과 연합했습니다
  lexicon: BDAG
  rationale: 여기서는 단순 동행보다 무리에 편입되는 뉘앙스가 있어, 정치·군사적 맥락까지 아우르는 ‘가담했습니다’가 적절합니다.
- source_word: ἀσεβῶν
  english_pob_choice: ungodly
  chosen_korean: 경건하지 않은 자들
  alternatives_korean:
  - 불경한 자들
  - 악한 자들
  - 하나님을 두려워하지 않는 자들
  lexicon: BDAG
  rationale: ἀσεβής의 종교적·도덕적 반향을 살리면서도, 한국어에서 과도하게 설교조가 되지 않도록 ‘경건하지 않은 자들’로 옮겼습니다.
theological_decisions:
- issue: 이스라엘 내부의 신앙적 분열 표지
  chosen_reading: ‘이스라엘의 경건하지 않은 자들’로, 출신이 이스라엘 안에 있으나 신앙적 충성을 저버린 집단임을 드러냅니다.
  alternative_readings:
  - ‘이스라엘의 악한 자들’
  - ‘이스라엘 가운데서 불경한 자들’
  rationale: 원문은 단순한 도덕평가가 아니라 언약 백성 내부의 배교/불경건을 강조합니다. ‘경건하지 않은’이 그 긴장을 가장 직접적으로 보존합니다.
  doctrine_reference: 'DOCTRINE.md: source meaning over tradition; preserve moral-theological force'
