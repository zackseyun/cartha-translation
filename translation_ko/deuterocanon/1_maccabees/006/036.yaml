  text: These were there beforehand[a], wherever the beast might be; and wherever it went, they went with it and did not leave it.
  footnotes:
  - marker: a
    text: Or 'the animal'; in context, the referent is an elephant.
    reason: lexical_alternative
translation:
  language: ko
  text: 이들은 짐승[a]이 있는 곳마다 미리 있었고, 짐승이 어디로 가든지 그 짐승과 함께 갔으며, 그 짐승에게서 떠나지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘동물’; 문맥상 지칭 대상은 코끼리입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  english_pob_choice: These
  chosen_korean: 이들은
  alternatives_korean:
  - 이 사람들은
  - 그들은
  lexicon: LSJ
  rationale: 지시대명사 οὗτοι를 한국어에서 자연스럽게 주어화하여 ‘이들은’으로 옮겼습니다. 앞선 문맥의 수행원들을 가리키되 원문에 없는 명사를 덧붙이지 않았습니다.
- source_word: πρὸ καιροῦ
  english_pob_choice: beforehand / ahead of time
  chosen_korean: 미리
  alternatives_korean:
  - 미리 전에
  - 일찍이
  lexicon: LSJ
  rationale: πρὸ καιροῦ는 ‘미리, 앞서’라는 선행 배치를 나타내므로 간결한 ‘미리’가 한국어에서 가장 자연스럽습니다.
- source_word: τὸ θηρίον
  english_pob_choice: the beast
  chosen_korean: 짐승
  alternatives_korean:
  - 동물
  - 코끼리
  lexicon: LSJ
  rationale: 원문 표현을 따라 ‘짐승’으로 옮기고, 바로 뒤 문맥에서 지칭 대상이 코끼리임을 독자가 알 수 있도록 두었습니다. 본문에서 해석어인 ‘코끼리’로 바로 바꾸지는 않았습니다.
- source_word: ἐπορεύετο / ἐπορεύοντο ἅμα
  english_pob_choice: went with it
  chosen_korean: 함께 갔으며
  alternatives_korean:
  - 동행했으며
  - 같이 갔으며
  lexicon: LSJ
  rationale: 반복되는 이동의 동시성을 살리기 위해 ‘함께 갔으며’로 옮겼습니다. ‘동행하다’는 다소 설명적일 수 있어 동사 구조를 유지했습니다.
- source_word: οὐκ ἀφίσταντο ἐπʼ αὐτοῦ
  english_pob_choice: did not leave it
  chosen_korean: 그를 떠나지 않았습니다
  alternatives_korean:
  - 그에게서 물러서지 않았습니다
  - 곁을 떠나지 않았습니다
  lexicon: LSJ
  rationale: ἀφίστασθαι의 핵심인 ‘떨어져 나가다, 떠나다’를 반영해 ‘떠나지 않았다’로 옮겼습니다. αὐτοῦ는 문맥상 코끼리를 가리키므로 한국어에서는 자연스럽게 ‘그’를 썼습니다.
