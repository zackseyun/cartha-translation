    issue: ‘그를 떠나지 않았습니다’의 대명사 사용
    rationale: 한국어의 ‘그’는 통상 사람, 특히 남성을 가리키므로 문맥상 동물인 τὸ θηρίον을 받는 표현으로는 부자연스럽고 잠재적으로 모호합니다. 원문의 ‘그것에게서 떠나지 않았다’는 의미를 ‘그 짐승에게서 떠나지 않았습니다’로 밝혀야 합니다.
