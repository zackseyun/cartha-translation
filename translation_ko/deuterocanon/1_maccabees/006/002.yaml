  text: and that the temple in it was exceedingly rich[a], and that there were gold coverings there, and breastplates and weapons, which Alexander son of Philip, the Macedonian king, who first reigned over the Greeks, had left there.
  footnotes:
  - marker: a
    text: Or 'golden coverings.' The Greek does not specify the exact form of these objects beyond their being coverings made of gold.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 안에 있는 성전은 매우 부유하였고, 거기에는 금으로 된 덮개들과 흉갑들과 무기들이 있었는데, 이는 마케도니아 왕 필립포스의 아들 알렉산드로스가 거기에 남겨 둔 것이었습니다. 그는 그리스인들 위에 처음으로 다스렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘금으로 된 덮개들’로 옮겼습니다. 그리스어는 이 물건들의 정확한 형상을 밝히지 않고, 단지 금으로 된 ‘덮개들’이라고만 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερὸν
  english_pob_choice: temple
  chosen_korean: 성전
  alternatives_korean:
  - 신전
  - 성소
  lexicon: LSJ
  rationale: 이 문맥의 ἱερὸν은 도시 안의 제의적 건물을 가리키므로, 일반적인 ‘성소’보다 ‘성전’이 더 자연스럽고 구체적입니다.
- source_word: πλούσιον σφόδρα
  english_pob_choice: exceedingly rich
  chosen_korean: 매우 부유하였고
  alternatives_korean:
  - 극도로 부유하였고
  - 지극히 부유하였고
  lexicon: LSJ
  rationale: σφόδρα의 강한 강조를 살리되, 한국어에서는 재물의 상태를 자연스럽게 드러내는 ‘부유하다’가 가장 매끄럽습니다.
- source_word: καλύμματα χρυσᾶ
  english_pob_choice: gold coverings
  chosen_korean: 금으로 된 덮개들
  alternatives_korean:
  - 금덮개들
  - 금빛 덮개들
  lexicon: LSJ
  rationale: 그리스어는 물건의 정확한 형태를 특정하지 않으므로, 영어 POB처럼 ‘coverings’의 불확정성을 유지한 ‘덮개들’로 옮겼습니다.
- source_word: ὅπλα
  english_pob_choice: weapons
  chosen_korean: 무기들
  alternatives_korean:
  - 병기들
  - 장비들
  lexicon: LSJ
  rationale: θώρακες와 병렬되는 군사용 물품이므로, 현대 한국어에서 가장 직접적인 ‘무기들’이 적절합니다.
- source_word: ὃς ἐβασίλευσεν τοῖς Ἕλλησι πρῶτος
  english_pob_choice: who first reigned over the Greeks
  chosen_korean: 그는 그리스인들 위에 처음으로 다스렸습니다
  alternatives_korean:
  - 그는 그리스인들을 처음으로 통치했습니다
  - 그는 그리스인들 위에 처음으로 군림했습니다
  lexicon: LSJ
  rationale: ἐβασίλευσεν의 핵심을 ‘다스리다’로 살리면서, πρῶτος의 시간적 우선성을 ‘처음으로’로 분명히 했습니다.
