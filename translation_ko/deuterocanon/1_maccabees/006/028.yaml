  text: And the king was enraged when he heard it, and he gathered all his Friends, the commanders of his forces, and those over the reins.
translation:
  language: ko
  text: 그리고 왕은 그것을 듣고 격분하였으며, 자기의 모든 친구들, 자기 군세의 지휘관들과 고삐를 맡은 자들을 모았습니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 직역하면 ‘고삐 위에 있는 자들’이라는 뜻으로, 말과 전차의 조종을 맡은 측근들을 가리키는 표현일 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: ὁ βασιλεύς
  english_pob_choice: the king
  chosen_korean: 왕
  alternatives_korean:
  - 임금
  lexicon: basic noun
  rationale: 헬라어의 일반 명사 βασιλεύς를 자연스러운 현대 한국어로 옮겨 ‘왕’으로 처리했습니다.
- source_word: ἤκουσεν
  english_pob_choice: heard it
  chosen_korean: 그것을 듣고
  alternatives_korean:
  - 이를 듣고
  - 그 소식을 듣고
  lexicon: basic verb
  rationale: 지시 대상을 본문에 드러내지 않은 채, 전후 문맥상 전달된 소식을 가리키는 중성적 표현으로 유지했습니다.
- source_word: φίλους αὐτοῦ
  english_pob_choice: his Friends
  chosen_korean: 자기의 모든 친구들
  alternatives_korean:
  - 자기의 친구들
  - 궁정의 벗들
  lexicon: φίλοι
  rationale: POB가 대문자 Friends를 유지한 점을 따라, 단순한 사적 친구가 아니라 왕의 측근 집단을 가리키는 표현으로 풀되 한국어에서는 문맥상 ‘친구들’로 옮겼습니다.
- source_word: ἄρχοντας δυνάμεως αὐτοῦ
  english_pob_choice: the commanders of his forces
  chosen_korean: 자기 군세의 지휘관들
  alternatives_korean:
  - 자기 군대의 지휘관들
  - 자기 병력의 지휘관들
  lexicon: ἄρχοντες / δύναμις
  rationale: ἄρχοντας를 ‘지휘관들’로, δυνάμεως를 군사적 맥락에 맞게 ‘군세’로 옮겨 왕의 무력 기반을 드러냈습니다.
- source_word: τοὺς ἐπὶ τῶν ἡνιῶν
  english_pob_choice: those over the reins
  chosen_korean: 고삐를 맡은 자들
  alternatives_korean:
  - 마구를 잡은 자들
  - 말 고삐를 맡은 자들
  lexicon: ἐπὶ + genitive / ἡνία
  rationale: 직역을 살리면서도 자연스러운 한국어로, 문자적으로는 ‘고삐 위에 있는 자들’인 표현을 역할 명칭처럼 ‘고삐를 맡은 자들’로 옮겼습니다.
theological_decisions:
- issue: φίλοι αὐτοῦ의 대문자화된 역사적 용법
  chosen_reading: 왕의 사적 친구가 아니라 궁정 권력 핵심층을 가리키는 호칭적 표현으로 이해했습니다.
  alternative_readings:
  - 그냥 친구들
  - 신하들
  rationale: 영어 POB가 ‘Friends’를 대문자로 보존한 것은 단순 우정 관계보다 관료적·정치적 집단성을 시사하므로, 한국어에서도 그 함의를 살리되 과도한 재구성은 피했습니다.
  doctrine_reference: 주석적 역사 이해
