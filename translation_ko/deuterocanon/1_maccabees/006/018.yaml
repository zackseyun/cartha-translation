revisions:
- from: 그는 그에게 “유파토르”라는 이름을 붙였습니다. 그리고 아크라에 있던 자들은 성소 주변에서 이스라엘을 사방으로 에워싸며, 계속 악을 도모하고 이방 민족들에게 버팀목이 되고 있었습니다.[a][b]
  to: 그는 그에게 “에우파토르”라는 이름을 붙였습니다. 아크라에 속한 자들은 성소[a] 주위에서 이스라엘을 에워싸고, 끊임없이 해를 꾀하며 이방 민족들에게[b] 버팀목이 되고 있었습니다.
  rationale: 통용 인명 음역을 바로잡고, 적대적 해악을 뜻하는 표현을 분명히 했습니다. 또한 각주 표지를 해당 어구 바로 뒤로 옮겨 각주 연결을 바로잡았습니다. ‘성소’는 문맥상 자연스럽게 유지하되, 복수형 τῶν ἁγίων의 여지는 각주에 보존했습니다.
  reviewer_model: gpt-5.6-terra
