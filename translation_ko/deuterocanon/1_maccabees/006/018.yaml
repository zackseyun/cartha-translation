  yaml_path: translation/deuterocanon/1_maccabees/006/018.yaml
  text: He named him Eupator[a]. And those from the citadel were hemming Israel in around the sanctuary[b], seeking evil continually and serving as a support to the nations.
  footnotes:
  - marker: a
    text: Or 'around the holy precincts'; the Greek literally has 'the holy things/places,' likely referring to the sanctuary area.
    reason: lexical_alternative
  - marker: b
    text: Or 'a support for the Gentiles.'
    reason: alternative_reading
translation:
  language: ko
  text: 그는 그에게 “유파토르”라는 이름을 붙였습니다. 그리고 아크라에 있던 자들은 성소 주변에서 이스라엘을 사방으로 에워싸며, 계속 악을 도모하고 이방 민족들에게 버팀목이 되고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거룩한 구역들 주변에서’; 헬라어는 문자적으로 ‘거룩한 것들/장소들’을 뜻하며, 성전 구역을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이방인들에게 버팀목이 되어’; 헬라어는 ‘민족들/이방인들’에 대한 지지대라는 뜻입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκάλεσεν τὸ ὄνομα αὐτοῦ
  english_pob_choice: He named him
  chosen_korean: “유파토르”라는 이름을 붙였습니다
  alternatives_korean:
  - 그를 유파토르라고 불렀습니다
  - 그에게 유파토르라는 이름을 주었습니다
  lexicon: LSJ
  rationale: 관용구적으로 ‘이름을 붙이다’가 인명 부여의 뜻을 자연스럽게 살리면서도, 단순 호칭보다 명명 행위를 분명히 드러냅니다.
- source_word: οἱ ἐκ τῆς ἄκρας
  english_pob_choice: those from the citadel
  chosen_korean: 아크라에 있던 자들은
  alternatives_korean:
  - 아크라의 자들은
  - 성채에 있던 자들은
  lexicon: LSJ
  rationale: ἄκρα는 예루살렘의 요새화된 성채를 가리키므로, 고유 지명 ‘아크라’를 살리되 소속 집단을 자연스럽게 표현했습니다.
- source_word: κύκλῳ τῶν ἁγίων
  english_pob_choice: around the sanctuary
  chosen_korean: 성소 주변에서 … 사방으로 에워싸며
  alternatives_korean:
  - 성소를 둘러
  - 거룩한 곳 둘레에서
  lexicon: LSJ
  rationale: ἁγίων의 문자적 ‘거룩한 것들/장소들’이라는 여지를 보존하면서, 문맥상 성전 구역인 ‘성소’로 옮겼습니다.
- source_word: στήριγμα τοῖς ἔθνεσιν
  english_pob_choice: a support to the nations
  chosen_korean: 이방 민족들에게 버팀목이 되고 있었습니다
  alternatives_korean:
  - 민족들에게 지지대가 되고 있었습니다
  - 열국에게 버팀목이 되고 있었습니다
  lexicon: LSJ
  rationale: στήριγμα의 ‘지지대/버팀목’ 이미지를 살렸고, ἔθνεσιν은 이 문맥에서 정치·민족적 ‘이방 민족들’로 옮기는 것이 자연합니다.
theological_decisions:
- issue: ἔθνεσιν의 번역 범위
  chosen_reading: ‘이방 민족들’로 번역하여 외세에 대한 정치·민족적 의미를 드러냈습니다.
  alternative_readings:
  - ‘민족들’
  - ‘이방인들’
  rationale: 여기서는 바울서신의 신학적 ‘이방인/유대인’ 대비가 아니라 적대적 외세를 가리키므로, 문맥을 분명히 하는 표현을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: 문맥 우선의 용례 분화'
