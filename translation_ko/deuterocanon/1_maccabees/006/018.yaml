  source_fidelity: 그리스어의 주된 구문과 진행상(‘에워싸고/꾀하며/되고 있었습니다’)은 대체로 잘 반영했습니다. 다만 ‘악을 도모하다’는 ζητοῦντες κακά의 적대적 해악이라는 뜻을 다소 추상적으로 만들므로 ‘해를 꾀하다’가 더 정확합니다. 또한 Εὐπάτωρ의 통용 한국어 음역은 ‘에우파토르’가 적절합니다.
  naturalness: 합쇼체 문체는 자연스럽습니다. 다만 ‘성소 주변에서 이스라엘을 사방으로 에워싸며’는 ‘주변에서’와 ‘사방으로’가 겹쳐 다소 무겁습니다. ‘성소 주위에서 이스라엘을 에워싸고’가 간결하면서도 κύκλῳ를 충실히 살립니다.
  terminology: ‘아크라’는 예루살렘의 성채를 가리키는 고유 명칭으로 유지할 수 있습니다. οἱ ἐκ τῆς ἄκρας에는 단순 위치보다 소속의 뜻도 있으므로 ‘아크라에 속한 자들’이 더 적절합니다. ἔθνεσιν은 여기서 ‘이방 민족들’로 번역해도 문맥상 무방합니다.
  issues:
  - severity: medium
    issue: 유파토르
    rationale: Εὐπάτωρ는 한국어 성서·고전사 용례에서 일반적으로 ‘에우파토르’로 음역됩니다. ‘유파토르’는 그리스어 Εὐ의 음가와 통용 표기를 충분히 반영하지 못합니다.
  - severity: medium
    issue: 각주 표지가 해당 본문 어구에 붙어 있지 않고 문장 끝에 함께 놓여 있습니다.
