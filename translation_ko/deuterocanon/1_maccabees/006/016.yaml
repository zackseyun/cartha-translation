    issue: 사망 동사의 연결 어미
    rationale: ἀπέθανεν은 단순 과거 서술이고 καί는 단순 접속입니다. ‘죽었는데’는 대조나 배경 전환을 암시할 수 있으므로 ‘죽었습니다’가 더 충실합니다.
  - severity: medium
    issue: 각주의 βασιλεύειν 설명 및 표지 위치
    rationale: 각주의 ‘왕위에 오르게’는 왕이 되다/즉위하다에 치우치며, βασιλεύειν은 왕으로 다스리다 또는 왕권을 행사하다를 뜻합니다. 표지도 이 부정사구 뒤에 두어야 합니다.
  revised_text: 그를 길러 왕으로 다스리게 하려는 것이었습니다.[a] 그리고 안티오코스 왕은 그곳에서 죽었습니다. 그때는 백사십구 년이었습니다.
