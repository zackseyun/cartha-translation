translation:
  language: ko
  text: 그리고 왕의 진영에서 그들을 맞으러 예루살렘으로 올라갔으며, 왕은 유대와 시온 산에 진을 쳤습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεμβολῆς
  english_pob_choice: camp
  chosen_korean: 진영
  alternatives_korean:
  - 캠프
  - 군막
  lexicon: LSJ
  rationale: 군사 문맥의 παρεμβολή는 ‘진영/진’으로 옮기는 것이 자연스럽고, ‘왕의 진영’은 출진 상황을 분명히 드러냅니다.
- source_word: ἀνέβησαν εἰς συνάντησιν αὐτῶν
  english_pob_choice: went up to meet them
  chosen_korean: 그들을 맞으러 올라갔으며
  alternatives_korean:
  - 그들을 만나러 올라갔으며
  - 그들과 마주하러 올라갔으며
  lexicon: LSJ
  rationale: ‘예루살렘으로 올라가다’라는 지리적 관용을 살리면서, συνάντησις의 ‘맞으러/만나러’라는 목적을 간결하게 반영했습니다.
- source_word: παρενέβαλεν
  english_pob_choice: encamped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 진을 쳤습니다
  - 캠프를 쳤습니다
  lexicon: LSJ
  rationale: παρεμβάλλω의 군사적 의미를 한국어 관용에 맞게 ‘진을 치다’로 옮겨, 단순히 머문 것이 아니라 군사 배치를 했음을 살렸습니다.
- source_word: Ἰουδαίαν
  english_pob_choice: Judea
  chosen_korean: 유대
  alternatives_korean:
  - 유대 지방
  - 유다
  lexicon: LSJ
  rationale: 헬라어 역사 서술의 Ἰουδαία는 지역명 ‘Judea’에 해당하므로, 한국어에서도 지명으로서의 ‘유대’가 가장 직접적입니다.
