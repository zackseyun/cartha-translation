  text: judgment[a], and avenge our brothers? We are pleased to serve your father and to walk according to what is said by him[c][b],
  footnotes:
  - marker: a
    text: The Greek text begins mid-sentence in this verse as transmitted here; 'judgment' likely continues a thought from the preceding clause.
    reason: textual_variant
  - marker: b
    text: Or 'vindicate our brothers.' The Greek verb can denote either avenging or securing justice for someone.
