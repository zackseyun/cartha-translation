translation:
  language: ko
  text: 판결을 내리고[a] 우리 형제들의 원한을 갚아 주시겠습니까[b]? 우리는 당신의 아버지를 섬기고 그가 말한 것들을 따라 살아가기를 기꺼이 원합니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 이 절에서 문장 중간에 시작합니다. ‘판결’을 뜻하는 이 말은 앞 절의 생각에 이어지는 것으로 보입니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘우리 형제들의 정당한 권리를 찾아 주시겠습니까?’ 동사는 원한을 갚는 것과 정의를 되찾아 주는 것을 모두 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘그에 의해 말해진 것들을 따라 걷기를’입니다. 이는 그의 말에 따라 살아가거나 행한다는 뜻입니다.
    reason: lexical_alternative
