translation:
  language: ko
  text: 판결[a]과 우리 형제들을 위하여 복수하시겠습니까[b]? 우리는 당신의 아버지를 섬기고, 그가 말하는 바에 따라 걷는 것을 기뻐합니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 이 절에서 문장 중간에서 시작합니다. 따라서 앞절의 생각이 이어진 것으로 보입니다.
    reason: textual_variant
  - marker: b
    text: 또는 '우리 형제들을 변호하시겠습니까?'로도 옮길 수 있습니다. 동사는 복수와 정당한 변호를 모두 함의할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 '그에 의해 말해지는 것들에 따라 걷는'입니다. 여기서는 자연스러운 한국어로 풀었습니다.
    reason: lexical_alternative
