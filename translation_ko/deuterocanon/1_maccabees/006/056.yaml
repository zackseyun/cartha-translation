translation:
  language: ko
  text: 그는 페르시아와 메디아에서 돌아섰고, 왕과 함께 갔던 군대는 그와 함께 있으며, 또 그는 일의 처리를 떠맡으려 하고 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어는 ‘왕과 함께 갔던 군대’와 관련된 연결이 다소 난해합니다. 이 번역은 그 어색함을 원문 증거 범위 안에서 최대한 그대로 보존합니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπέστρεψεν
  english_pob_choice: he turned back
  chosen_korean: 돌아섰고
  alternatives_korean:
  - 되돌아왔고
  - 철수했고
  lexicon: LSJ
  rationale: ἀποστρέφω의 이동 동사는 여기서 ‘되돌다/돌아서다’의 이미지를 살리면서 자연스럽게 옮기는 것이 적절합니다.
- source_word: ἀπὸ τῆς Περσίδος καὶ Μηδίας
  english_pob_choice: from Persia and Media
  chosen_korean: 페르시아와 메디아에서
  alternatives_korean:
  - 페르시아와 메디아로부터
  - 페르시아와 메디아로부터
  lexicon: LSJ
  rationale: ἀπό + 속격의 출발점을 한국어 조사 ‘에서’로 옮겨 지리적 이탈을 분명하게 했습니다.
- source_word: αἱ δυνάμεις
  english_pob_choice: the forces
  chosen_korean: 군대
  alternatives_korean:
  - 병력
  - 부대들
  lexicon: LSJ
  rationale: 이 문맥의 δυνάμεις는 군사적 병력을 가리키므로, 일반 독자가 즉시 이해할 수 있는 ‘군대’가 가장 직접적입니다.
- source_word: παραλαβεῖν τὰ τῶν πραγμάτων
  english_pob_choice: to take over the conduct of affairs
  chosen_korean: 일의 처리를 떠맡으려
  alternatives_korean:
  - 국정 처리를 맡으려
  - 일들을 장악하려
  lexicon: LSJ
  rationale: τὰ τῶν πραγμάτων은 ‘일/사안의 처리’라는 넓은 관료적·정무적 표현이므로, ‘떠맡다’로 책임과 장악의 뉘앙스를 함께 살렸습니다.
theological_decisions:
- issue: 본문의 난해한 군대 관련 절
  chosen_reading: ‘왕과 함께 갔던 군대는 그와 함께 있으며’로, 헬라어의 어색한 연결을 매끈하게 재구성하지 않고 두 요소를 모두 보존했습니다.
  alternative_readings:
  - ‘왕과 함께 갔던 군대는 그와 함께 있었다’
  - ‘왕과 함께 간 군대가 그와 함께 있다’
  rationale: 원문은 τῷ βασιλεῖ와 μετʼ αὐτοῦ가 함께 있어 통사적으로 거칠기 때문에, 의미를 과도하게 정리하지 않고 원문 흔적을 보존하는 쪽이 본문의 불확실성을 더 충실히 드러냅니다.
  doctrine_reference: 본문비평/원문 충실성
