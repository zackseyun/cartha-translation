  source_fidelity: 첫 동사 ἀπέστρεψεν은 완료된 과거 사건이고, ζητεῖ는 현재의 지속적 의도를 나타냅니다. 초안은 앞의 과거는 적절히 살렸으나 마지막을 ‘하고 있었습니다’로 옮겨 현재형 ζητεῖ를 과거로 바꾸었습니다. 군대 절은 난해한 헬라어 연결을 한국어에서도 ‘왕과 함께 … 그와 함께’로 보존하여, 확정적으로 해소하지 않은 점이 적절합니다.
  naturalness: ‘돌아섰고’는 문맥상 자연스럽고, ‘군대는 그와 함께 있으며’도 합쇼체 서술로 무리가 없습니다. 마지막 동사만 현재형 ‘하고 있습니다’로 고치면 시제와 문장 흐름이 모두 자연스럽습니다.
  terminology: ‘페르시아’, ‘메디아’, ‘왕’, ‘군대’는 적절합니다. ‘일의 처리를 떠맡으려’는 παραλαβεῖν τὰ τῶν πραγμάτων의 행정·통치적 의미를 다소 넓게 포괄하며 허용됩니다. 본 절에서는 이를 바꿀 필요가 없습니다.
  issues:
  - severity: medium
    issue: ζητεῖ의 현재 시제가 ‘하고 있었습니다’로 과거화되었습니다.
    rationale: ζητεῖ는 현재 직설법으로, 그가 현재 ‘추구하고/하려 하고 있다’는 뜻입니다. 앞 절의 ἀπέστρεψεν(과거)과 구별되어야 합니다.
  revised_text: 그는 페르시아와 메디아에서 돌아섰고, 왕과 함께 갔던 군대는 그와 함께 있으며, 또 그는 일의 처리를 떠맡으려 하고 있습니다.[a]
