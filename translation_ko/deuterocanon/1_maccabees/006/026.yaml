translation:
  language: ko
  text: 그리고 보십시오[a]. 오늘 그들은 예루살렘의 성채와 성소를 점령하려고 그 성채에 맞서 진을 쳤고, 벳수르를 요새화했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아크라’—예루살렘의 요새화된 성채를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  english_pob_choice: And look
  chosen_korean: 그리고 보십시오
  alternatives_korean:
  - 그리고 보라
  - 그리고 보십시오
  lexicon: LSJ
  rationale: ἰδού는 주의를 환기하는 담화 표지이므로, 현대 한국어에서는 격식 있고 자연스러운 ‘보십시오’로 옮겨 긴박한 시선을 살렸습니다.
- source_word: παρεμβεβλήκασιν
  english_pob_choice: they have encamped against
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 맞서 진을 쳤습니다
  - 포진했습니다
  - 포위했습니다
  lexicon: LSJ
  rationale: 군사적 배치라는 핵심을 살리되, 본문이 명시적으로 ‘포위’까지 말하지는 않으므로 과도한 강화 없이 ‘진을 쳤습니다’로 옮겼습니다.
- source_word: ἐπὶ τὴν ἄκραν
  english_pob_choice: against the citadel
  chosen_korean: 예루살렘의 성채를 향해
  alternatives_korean:
  - 예루살렘의 아크라를 향해
  - 예루살렘의 요새를 향해
  lexicon: LSJ
  rationale: ἄκρα는 일반적으로 성채/요새를 뜻하지만, 예루살렘의 특정 지명인 아크라일 수 있어 본문에는 의미를 우선한 ‘성채’를 쓰고, 역사적 특정성은 각주로 남겼습니다.
- source_word: τοῦ καταλαβέσθαι αὐτὴν καὶ τὸ ἁγίασμα
  english_pob_choice: to capture it and the sanctuary
  chosen_korean: 그것과 성소를 점령하려는 것이며
  alternatives_korean:
  - 그것과 성소를 포획하려는 것이며
  - 그것과 성소를 빼앗으려는 것이며
  lexicon: LSJ
  rationale: 목적을 나타내는 부정사구이므로 ‘-하려는 것이며’로 처리했고, καταλαμβάνω의 군사적 의미를 ‘점령하다’로 살렸습니다.
- source_word: τὴν Βεθσούραν ὠχύρωσαν
  english_pob_choice: they have fortified Beth-zur
  chosen_korean: 베스수라도 요새화했습니다
  alternatives_korean:
  - 베스수라를 요새화했습니다
  - 베스수라를 견고하게 했습니다
  lexicon: LSJ
  rationale: 지명은 음역하되, ὠχυρόω의 직접적 군사 의미를 가장 분명하게 드러내는 ‘요새화했습니다’를 택했습니다.
theological_decisions:
- issue: ἄκρα의 역사적 특정성과 본문 가독성 사이의 균형
  chosen_reading: 본문에서는 ‘성채’로 번역하고, 각주에서 ‘아크라’라는 특정 명칭 가능성을 밝혔습니다.
  alternative_readings:
  - 본문에 ‘아크라’를 직접 표기
  - 일반명사 ‘요새’만 사용
  rationale: 원문은 일반명사적 의미와 고유명사적 가능성을 함께 갖기 때문에, 읽기 쉽게 하면서도 역사적 식별 가능성을 보존하는 방식이 가장 충실합니다.
  doctrine_reference: source-critical translation principle
- issue: 군사 동사의 강도 조절
  chosen_reading: καταλαμβάνω는 ‘점령하다’로, παρεμβάλλω는 ‘진을 치다’로 구분해 번역했습니다.
  alternative_readings:
  - 둘 다 ‘포위하다/취하다’로 통일
  - 둘 다 완화하여 ‘배치하다/차지하다’로 통일
  rationale: 본문은 단순 배치보다 공격적 의도를 보여 주므로, 두 동사의 차이를 유지해야 서술의 긴장감과 의미를 보존할 수 있습니다.
  doctrine_reference: lexical precision
