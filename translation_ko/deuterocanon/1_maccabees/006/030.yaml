  yaml_path: translation/deuterocanon/1_maccabees/006/030.yaml
  text: And the number of his forces was one hundred thousand foot soldiers[a], and twenty thousand horsemen[b], and thirty-two elephants trained for war.
  footnotes:
  - marker: a
    text: Literally, 'twenty thousand of the horses'; the Greek likely uses 'horses' metonymically for mounted troops.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'elephants knowing war,' that is, elephants trained or experienced for battle.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그의 병력 수는 보병 십만 명, 기병 이만 명[a], 그리고 전쟁에 익숙한 코끼리 서른두 마리[b]였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어는 문자적으로 ‘말들(의)’이라고 하지만, 여기서는 말에 탄 병력을 가리키는 환유로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 헬라어는 문자적으로 ‘전쟁을 아는 코끼리’이지만, 곧 ‘전쟁에 훈련된’이라는 뜻의 관용적 표현으로 이해할 수 있습니다.
    reason: lexical_alternative
