  text: and they tore down the abomination that he had built upon the altar in Jerusalem[a], and they surrounded the sanctuary, as before, with high walls, and also Bethsura[b], his city.
  footnotes:
  - marker: a
    text: Or 'the detestable thing.' The Greek has 'the abomination,' a cultically charged term for something offensive in worship.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'Bethsura, his city' is compressed in Greek. 'His' likely refers to Judas in the narrative context; some may understand it more generally as a city under his control.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그들은 예루살렘의 제단 위에 그가 세운 가증한 것을[a] 무너뜨리고, 성소를 이전과 같이 높은 성벽으로 둘러쌌으며, 베드수라[b]와 그의 성읍도 그러했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가증스러운 것’. 그리스어는 예배에서 역겨운 것으로 여겨지는 대상을 가리키는 ‘the abomination’입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어의 ‘베드수라, 그의 성읍’은 압축된 표현입니다. 여기의 ‘그의’는 문맥상 유다를 가리키는 것으로 보는 해석이 유력하지만, 더 넓게는 그의 통제 아래 있던 성읍으로 이해할 수도 있습니다.
    reason: alternative_reading
