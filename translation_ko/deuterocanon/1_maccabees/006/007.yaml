    text: 그리스어의 ‘베드수라, 그의 성읍’은 압축된 동격 표현입니다. 여기의 ‘그의’는 문맥상 유다를 가리키는 것으로 보는 해석이 유력하지만, 더 넓게는 그의 통제 아래 있던 성읍으로 이해할 수도 있습니다.
