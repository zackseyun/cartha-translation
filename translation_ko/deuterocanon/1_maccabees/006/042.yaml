lexical_decisions:
- source_word: ἤγγισεν
  english_pob_choice: advanced
  chosen_korean: 다가갔고
  alternatives_korean:
  - 전진했고
  - 접근했고
  lexicon: LSJ
  rationale: 전투 문맥에서 단순한 ‘가까이 감’보다 교전 직전의 움직임을 자연스럽게 드러내면서도 원문의 접근 의미를 유지합니다.
- source_word: εἰς παράταξιν
  english_pob_choice: into battle formation
  chosen_korean: 전투 대형으로
  alternatives_korean:
  - 전투 진형으로
  - 전투 배열로
  lexicon: LSJ
  rationale: παράταξις의 군사적 ‘배열/진형’ 뜻을 살리되, 한국어로는 ‘전투 대형’이 가장 간결하고 읽기 쉽습니다.
- source_word: ἔπεσαν
  english_pob_choice: fell
  chosen_korean: 쓰러졌습니다
  alternatives_korean:
  - 떨어졌습니다
  - 죽었습니다
  lexicon: LSJ
  rationale: 직역의 ‘떨어졌습니다’는 한국어 전투 서술에서 어색하므로, 원문의 전투 관용구를 살리면서도 함의된 사망을 과도하게 해석하지 않는 표현을 택했습니다.
- source_word: ἑξακισχίλιοι ἄνδρες
  english_pob_choice: six thousand men
  chosen_korean: 육천 명
  alternatives_korean:
  - 육천 명의 남자들
  - 육천 명의 병사들
  lexicon: LSJ
  rationale: 원문은 ‘남자들’이지만 한국어에서는 전투 상황상 수사어 중심의 ‘육천 명’이 가장 자연스럽고, 군사 맥락은 앞뒤 문맥이 보완합니다.
theological_decisions:
- issue: 왕의 군대에서 쓰러진 인원의 표현
  chosen_reading: ‘왕의 군대에서 육천 명이 쓰러졌습니다’로 옮겨, 전투 결과의 직접성을 유지했습니다.
  alternative_readings:
  - ‘왕의 군대에서 육천 명이 죽었습니다’
  - ‘왕의 군대 소속 육천 명이 쓰러졌습니다’
  rationale: 원문은 ἔπεσαν(‘쓰러졌다’)를 사용하므로, 죽음으로 단정하기보다 전투 서술의 관용을 보존하는 편이 원문에 더 가깝습니다.
  doctrine_reference: 서술 관용어 보존 원칙
