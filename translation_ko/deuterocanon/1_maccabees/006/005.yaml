lexical_decisions:
- source_word: ἀπαγγέλλων τις αὐτῷ
  english_pob_choice: someone came reporting to him
  chosen_korean: 어떤 사람이 그에게 와서 ... 소식을 전했습니다
  alternatives_korean:
  - 누군가 그에게 와서 보고했습니다
  - 어떤 이가 그에게 와서 알렸습니다
  lexicon: ἀπαγγέλλω
  rationale: 행위의 핵심은 ‘전하다/보고하다’이지만, 한국어에서는 ‘와서 소식을 전하다’가 자연스럽고 본문의 전달 상황을 잘 드러냅니다.
- source_word: εἰς τὴν Περσίδα
  english_pob_choice: in Persia
  chosen_korean: 페르시아에서
  alternatives_korean:
  - 페르시아 안에서
  - 페르시아 땅에서
  lexicon: Περσίς
  rationale: 도착지/배경을 한국어 문맥에서 자연스럽게 ‘~에서’로 옮겼습니다.
- source_word: αἱ παρεμβολαὶ
  english_pob_choice: the camps
  chosen_korean: 진영들이
  alternatives_korean:
  - 군영들이
  - 진영들
  lexicon: παρεμβολή
  rationale: 영어 POB가 ‘camps’를 택한 점을 따라 군사 집결지를 뜻하는 복수 표현 ‘진영들’로 옮겼습니다.
- source_word: τετρόπωνται
  english_pob_choice: had been routed
  chosen_korean: 패주했다
  alternatives_korean:
  - 격파되었다
  - 무너졌다
  lexicon: τρέπω
  rationale: 단순한 패배보다 전열이 무너져 도망한 뉘앙스를 살리기 위해 ‘패주했다’가 가장 가깝습니다.
