  yaml_path: translation/deuterocanon/1_maccabees/006/061.yaml
  text: And the king and the rulers swore this to them[a]; then he came out from the stronghold[b],
  footnotes:
  - marker: a
    text: Or, 'on these terms,' making explicit that the oath concerned the previously stated conditions.
    reason: lexical_alternative
  - marker: b
    text: The Greek verb is singular ('he came out'), though the immediate context may lead some to understand a broader or collective subject; compare 'they came out.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 왕과 고관들은 그들에게 이 일로 맹세하였습니다[a]. 그러고 나서 그는 견고한 요새에서 나왔습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘이 조건들 위에/대로’라는 뜻으로, 앞서 제시된 조건들을 염두에 둔 맹세입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 동사는 단수형입니다. 다만 바로 앞뒤 문맥에 따라 넓게는 복수 주어로 이해하는 견해도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ὤμοσεν
  english_pob_choice: swore
  chosen_korean: 맹세하였습니다
  alternatives_korean:
  - 서약하였습니다
  - 맹세를 했습니다
  lexicon: BDAG
  rationale: ὄμνυμι의 완료되지 않은 과거형으로, 공식적이고 법적 성격의 ‘맹세하다’가 가장 직접적입니다.
- source_word: οἱ ἄρχοντες
  english_pob_choice: the rulers
  chosen_korean: 고관들은
  alternatives_korean:
  - 통치자들은
  - 지도자들은
  - 관원들은
  lexicon: BDAG
  rationale: 이 군사·정치적 문맥에서 ἄρχοντες는 단순한 지도자보다 권세 있는 고위 관리층을 가리키므로 ‘고관들’이 자연스럽습니다.
- source_word: ἐπὶ τούτοις
  english_pob_choice: this / on these terms
  chosen_korean: 이 일로
  alternatives_korean:
  - 이 조건으로
  - 이러한 조건들에 따라
  - 이 일에 관해
  lexicon: BDAG
  rationale: 바로 앞선 협정 조건을 가리키는 표현이므로, 본문 안에서는 간결하게 ‘이 일로’라고 옮기되 의미상 ‘이 조건으로’라는 뉘앙스를 보존합니다.
- source_word: ἐξῆλθεν
  english_pob_choice: he came out
  chosen_korean: 나왔습니다
  alternatives_korean:
  - 그가 나갔습니다
  - 그들이 나왔습니다
  lexicon: BDAG
  rationale: 스웨트 본문은 단수 동사이므로 우선 ‘그는 나왔습니다’의 의미를 따라 옮겼습니다. 주어가 문맥상 집합적으로 이해될 가능성은 각주로 남깁니다.
- source_word: τοῦ ὀχυρώματος
  english_pob_choice: the stronghold
  chosen_korean: 견고한 요새
  alternatives_korean:
  - 요새
  - 성채
  - 강한 성곽
  lexicon: LSJ
  rationale: ὀχύρωμα는 군사적으로 방비된 장소를 뜻하므로, ‘요새’에 ‘견고한’을 더해 방어적 성격을 드러냈습니다.
theological_decisions:
- issue: ἐπὶ τούτοις의 의미를 본문에서 어떻게 드러낼지
  chosen_reading: 맹세의 대상이 앞서 제시된 조건들이라는 점을 본문 ‘이 일로’로 간명하게 반영했습니다.
  alternative_readings:
  - ‘이 조건으로’
  - ‘이러한 조건들에 따라’
  rationale: 직역적 풀이를 과도하게 길게 만들지 않으면서도, 단순한 일반적 맹세가 아니라 합의 조건에 대한 맹세라는 문맥을 보존합니다.
  doctrine_reference: 본문 맥락 주해
- issue: 단수 동사 ἐξῆλθεν의 주어 처리
  chosen_reading: 본문의 단수 주어를 유지하여 ‘그는’으로 옮겼습니다.
  alternative_readings:
  - ‘그들이’로 집합적 이해
  rationale: 그리스어 형식과 공인 본문의 문법을 우선 따르되, 주변 문맥상 집합적 이해 가능성은 각주로 열어 두었습니다.
  doctrine_reference: 본문 비평/문법 주해
