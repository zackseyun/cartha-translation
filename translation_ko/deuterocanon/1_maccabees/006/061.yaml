  source_fidelity: ‘이 일로 맹세하였습니다’는 ἐπὶ τούτοις가 가리키는 앞선 합의 조건을 충분히 드러내지 못하며, 한국어로도 맹세의 내용·근거를 표현하는 방식이 다소 부자연스럽습니다. ‘그 조건들을 두고’로 고치면 원문의 조건적·합의적 의미를 보존합니다. ἐξῆλθεν의 단수는 ‘그는’으로 유지해야 합니다.
