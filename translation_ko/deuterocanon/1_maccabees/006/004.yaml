translation:
  language: ko
  text: 그들이 그에게 맞서 전쟁을 벌였고, 그는 도망하여 큰 슬픔을 안고 바빌론으로 돌아가기 위해 그곳을 떠났습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέστησαν αὐτῷ εἰς πόλεμον
  english_pob_choice: rose up against him in battle
  chosen_korean: 그에게 맞서 전쟁을 일으켰고
  alternatives_korean:
  - 그에게 맞서 싸워 일어났고
  - 그에게 대항하여 전쟁을 벌였고
  - 그에게 맞서 싸움을 시작했고
  lexicon: LSJ
  rationale: ἀνίστημι + εἰς πόλεμον의 적대적 전쟁 개시 이미지를 살리되, 한국어에서는 ‘전쟁을 일으키다’가 가장 자연스럽게 맞서는 행위를 드러냅니다.
- source_word: ἔφυγεν
  english_pob_choice: he fled
  chosen_korean: 그는 도망하여
  alternatives_korean:
  - 그는 달아나
  - 그는 도망쳤고
  - 그는 피하여
  lexicon: LSJ
  rationale: 단순한 퇴각이 아니라 급박한 도주를 뜻하므로 ‘도망하여’로 옮겨 서술의 긴박감을 유지했습니다.
- source_word: μετὰ λύπης μεγάλης
  english_pob_choice: with great sorrow
  chosen_korean: 큰 슬픔을 안고
  alternatives_korean:
  - 큰 슬픔과 함께
  - 큰 근심을 안고
  - 큰 비통함 속에
  lexicon: LSJ
  rationale: λύπη는 슬픔·근심·고통을 아우르지만, 문맥상 감정의 직접성을 살리는 ‘큰 슬픔’이 가장 무난합니다.
- source_word: ἀποστρέψαι εἰς Βαβυλῶνα
  english_pob_choice: to return to Babylon
  chosen_korean: 바빌론으로 돌아가려는
  alternatives_korean:
  - 바빌론으로 되돌아가려는
  - 바빌론으로 돌아가도록
  - 바빌론으로 돌아가기를
  lexicon: LSJ
  rationale: 부정법이 목적/결과를 나타내므로, 앞뒤 동작과 자연스럽게 이어지도록 ‘돌아가려는’으로 처리했습니다.
- source_word: Βαβυλῶνα
  english_pob_choice: Babylon
  chosen_korean: 바빌론
  alternatives_korean:
  - 바벨론
  lexicon: 고유명사 표기
  rationale: 표준 외래어 표기법에 따른 현대 표기인 ‘바빌론’을 사용했습니다.
theological_decisions:
- issue: 전쟁의 주도성과 도주 묘사
  chosen_reading: ‘그에게 맞서 전쟁을 일으켰고’와 ‘도망하여’로 적대 행위와 패주를 직설적으로 드러냈습니다.
  alternative_readings:
  - ‘그와 싸우기 위해 일어났고’
  - ‘그는 물러나’
  rationale: 본문은 완곡한 철수보다 적대적 전투 개시와 그에 따른 도주를 서술하므로, 서술 강도를 약화시키지 않았습니다.
  doctrine_reference: 본문 서사 충실성
- issue: λύπη의 정서 강도
  chosen_reading: ‘큰 슬픔’으로 유지해 감정적 무게를 직접적으로 전달했습니다.
  alternative_readings:
  - ‘큰 근심’
  - ‘큰 비통함’
  rationale: 본문의 정서는 단순한 아쉬움이 아니라 깊은 비애에 가깝기 때문에, ‘슬픔’이 가장 중립적이면서도 강합니다.
  doctrine_reference: 본문 서사 충실성
