translation:
  language: ko
  text: 그리고 왕의 진영 일부는 높은 산들에 걸쳐 펼쳐졌고, 다른 일부는 낮은 지대에[a] 펼쳐졌으며, 그들은 안전하게 질서정연하게 나아오고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘낮은 곳들’입니다. 그리스어는 높은 산들과 그보다 낮은 지대를 대조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξετάθη
  english_pob_choice: spread out
  chosen_korean: 퍼져 있었으며
  alternatives_korean:
  - 펼쳐져 있었으며
  - 전개되어 있었으며
  lexicon: LSJ
  rationale: 진영의 일부가 지형 위로 넓게 분산된 상태를 자연스럽게 드러내기 위해 ‘퍼져 있었으며’를 택했습니다.
- source_word: παρεμβολῆς
  english_pob_choice: camp
  chosen_korean: 진영
  alternatives_korean:
  - 캠프
  - 야영지
  lexicon: LSJ
  rationale: 군사적 맥락에서 단순한 장소가 아니라 군대의 배치된 진을 가리키므로 ‘진영’이 가장 적절합니다.
- source_word: ἐπὶ τὰ ὑψηλὰ ὄρη / τὰ ταπεινά
  english_pob_choice: over the high mountains / over the lowlands
  chosen_korean: 높은 산들 위로 / 낮은 곳들 위로
  alternatives_korean:
  - 높은 산들 위에 / 낮은 땅 위에
  - 높은 산지 위로 / 낮은 지대 위로
  lexicon: LSJ
  rationale: 원문의 대조인 ‘높은 산들’과 ‘낮은 곳들’을 살리되, 한국어에서 자연스러운 지형 대조로 옮겼습니다.
- source_word: ἀσφαλῶς καὶ τεταγμένως
  english_pob_choice: securely and in formation
  chosen_korean: 안전하게 그리고 정렬된 모습으로
  alternatives_korean:
  - 안전하게 그리고 질서 있게
  - 무사히 그리고 대오를 갖추어
  lexicon: LSJ
  rationale: ‘ἀσφαλῶς’의 안전함과 ‘τεταγμένως’의 질서 있게 정렬된 군사적 이동을 함께 드러내기 위해 이렇게 옮겼습니다.
