  source_fidelity: 초안은 왕의 진영 일부가 높은 곳과 낮은 곳에 나뉘어 펼쳐지고, 그들이 안전하고 질서 있게 전진했다는 원문의 기본 뜻을 잘 전달합니다. 다만 ‘퍼져 있었으며’는 완료된 아오리스트 수동 동작을 지속 상태로 다소 바꾸며, ‘정렬된 모습으로’는 군사적 질서·대오의 부사적 뜻을 충분히 자연스럽게 드러내지 못합니다.
