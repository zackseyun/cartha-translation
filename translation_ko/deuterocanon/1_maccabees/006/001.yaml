translation:
  language: ko
  text: 그리고 안티오코스 왕은 윗 지방들을 지나가고 있었는데, 페르시아[a]의 엘리마이스에 부와 은과 금으로 이름난 한 도시가 있다는 말을 들었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘페르시스에’. 그리스어 ‘페르시스’는 넓은 ‘페르시아’보다 더 좁은 페르시아 지역이나 지방을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεπορεύετο
  english_pob_choice: was traveling through
  chosen_korean: 지나가고 있었는데
  alternatives_korean:
