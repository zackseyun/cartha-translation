translation:
  language: ko
  text: 그리고 안티오코스 왕은 상부 지역들을 지나가고 있었는데, 페르시아의 엘리마이스에 부와 은과 금으로 유명한 도시가 있다는 소식을 들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘페르시스의’, 곧 더 좁은 페르시아 지방/총독령입니다. 그리스어 용어는 넓은 ‘페르시아’보다 더 구체적으로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεπορεύετο
  english_pob_choice: was traveling through
  chosen_korean: 지나가고 있었는데
  alternatives_korean:
