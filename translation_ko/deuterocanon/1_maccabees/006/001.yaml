  chosen_korean: 상부 지역들
  alternatives_korean:
  - 윗 지방들
  - 위쪽 지역들
  - 상쪽 나라들
  lexicon: LSJ
  rationale: 직역을 과도하게 지리화하지 않으면서, 원문의 ‘위쪽/상부’라는 공간 감각을 보존합니다.
- source_word: Ἐλυμαΐς
  english_pob_choice: Elymais
  chosen_korean: 엘리마이스
  alternatives_korean:
