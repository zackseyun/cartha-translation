- source_word: ἐν τῇ Περσίδι
  english_pob_choice: in Persia
  chosen_korean: 페르시아의
  alternatives_korean:
  - 페르시스의
  - 페르시아 지역의
  lexicon: LSJ
  rationale: 문맥상 엘리마이스가 포함된 더 넓은 지역을 가리키므로, 독자 친화적인 ‘페르시아’로 옮기되 속격 관계를 자연스럽게 표현했습니다.
- source_word: πόλις ἔνδοξος πλούτῳ, ἀργυρίῳ, καὶ χρυσίῳ
  english_pob_choice: a city renowned for wealth, silver, and gold
  chosen_korean: 부와 은과 금으로 유명한 도시
  alternatives_korean:
  - 재물과 은과 금으로 유명한 도시
  - 부유함과 은과 금으로 이름난 도시
  lexicon: LSJ
  rationale: ἔνδοξος는 ‘유명한/널리 알려진’의 의미를 살리고, 목록은 한국어에서 자연스러운 병렬로 옮겼습니다. dative의 기준·내용을 ‘~으로 유명한’으로 처리했습니다.
