  lexicon: LSJ
  rationale: 미완료 시제가 나타내는 진행 중인 이동을 자연스러운 현대 한국어로 살리면서, 단발적 통과보다 지속성을 드러냅니다.
- source_word: τὰς ἐπάνω χώρας
