  lexicon: LSJ
  rationale: 고유명사는 현대 외래어 표기 원칙에 따라 음역하고, 원형의 그리스어 형태를 반영합니다.
- source_word: ἐν τῇ Περσίδι
  english_pob_choice: in Persia
  chosen_korean: 페르시아의
  alternatives_korean:
  - 페르시스의
  - 페르시아 지역의
  lexicon: LSJ
  rationale: 문맥상 엘리마이스가 포함된 더 넓은 지역을 가리키므로, 독자 친화적인 ‘페르시아’로 옮기되 속격 관계를 자연스럽게 표현했습니다.
- source_word: πόλις ἔνδοξος πλούτῳ, ἀργυρίῳ, καὶ χρυσίῳ
  english_pob_choice: a city renowned for wealth, silver, and gold
  chosen_korean: 부와 은과 금으로 유명한 도시
  alternatives_korean:
  - 재물과 은과 금으로 유명한 도시
  - 부유함과 은과 금으로 이름난 도시
  lexicon: LSJ
  rationale: ἔνδοξος는 ‘유명한/널리 알려진’의 의미를 살리고, 목록은 한국어에서 자연스러운 병렬로 옮겼습니다. dative의 기준·내용을 ‘~으로 유명한’으로 처리했습니다.
theological_decisions:
- issue: 본문의 지리 표현인 ‘상부 지역들’과 ‘페르시아의 엘리마이스’의 관계
  chosen_reading: 상부 지역들을 지나가고 있었는데, 페르시아의 엘리마이스에…
  alternative_readings:
  - 상부 지역들을 지나 엘리마이스에…
  - 윗 지방들을 지나가고 있었는데, 페르시아 지역 엘리마이스에…
  rationale: 원문의 두 지리 표지를 모두 보존해 이동 경로와 위치 정보를 함께 드러내며, 어느 쪽도 과도하게 특정한 역사 지도로 환원하지 않습니다.
  doctrine_reference: 지리·역사 서술의 원문 충실성
