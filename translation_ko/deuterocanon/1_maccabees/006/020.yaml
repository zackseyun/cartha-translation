    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτους πεντηκοστοῦ καὶ ἑκατοστοῦ
  english_pob_choice: in the one hundred and fiftieth year
  chosen_korean: 제백오십년
  alternatives_korean:
  - 백오십년
  - 제150년
  - 백오십 해
  lexicon: LSJ
  rationale: 그리스어 연대 표지는 한국어에서 관용적으로 ‘제…년’으로 옮기면 연대 표현이 자연스럽고, 원문의 150년이라는 의미도 정확히 보존됩니다.
- source_word: ἐποίησεν
  english_pob_choice: he made
  chosen_korean: 만들었습니다
  alternatives_korean:
  - 지었습니다
  - 제작했습니다
  - 세웠습니다
  lexicon: LSJ
  rationale: ποιέω의 넓은 의미를 살리면서, 여기서는 군사 장비를 준비·제작하는 뜻이므로 ‘만들었습니다’가 가장 직접적입니다.
- source_word: ἐπʼ αὐτούς
  english_pob_choice: against them
  chosen_korean: 그들을 향하여
  alternatives_korean:
  - 그들에 대하여
  - 그들을 상대로
  - 그들에게 맞서
  lexicon: LSJ
  rationale: 공성 무기의 배치 대상이 적대적 방향임을 드러내되, 한국어에서 군사 문맥에 자연스러운 방향 표현으로 옮겼습니다.
- source_word: βελοστασίεις καὶ μηχανάς
  english_pob_choice: missile-launchers and siege engines
  chosen_korean: 투석기와 공성 장비
  alternatives_korean:
  - 투사 장치와 공성 기계
  - 미사일 발사기와 포위 장비
  - 발사 장치와 공성 기구
  lexicon: LSJ
  rationale: βελοστασίεις는 특정 한 종류로 좁히기보다 투사체를 쏘는 장비 전반을 가리키므로 ‘투석기’가 가장 이해 가능하면서도 과도한 구체화를 피합니다. μηχανάς는 전쟁 맥락에서 ‘공성 장비’로 옮겨 기능을 분명히 했습니다.
