- source_word: θηρίου
  english_pob_choice: beast
  chosen_korean: 짐승
  alternatives_korean:
  - 동물
  - 짐승들
  lexicon: LSJ
  rationale: 본문은 문자적으로 ‘짐승’이라고 말하지만 문맥상 전쟁 코끼리를 가리키므로, 원문 어휘를 보존하는 쪽으로 ‘짐승’이라 옮겼습니다.
- source_word: ἄνδρες δύο καὶ τριάκοντα οἱ πολεμοῦντες
  english_pob_choice: thirty-two fighting men
  chosen_korean: 전투하는 사람 서른두 명
  alternatives_korean:
  - 싸우는 사람 서른두 명
