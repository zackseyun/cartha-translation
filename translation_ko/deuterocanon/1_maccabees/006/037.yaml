base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/037.yaml
  text: and on them were strong wooden towers[a], covered over, on each beast, fitted on them with engines; and on each one were thirty-two fighting men[b], and its Indian driver.
  footnotes:
  - marker: a
    text: Literally, 'its Indian.' The phrase likely refers to the Indian handler or driver assigned to each elephant.
    reason: lexical_alternative
  - marker: b
    text: The Greek says 'beast' here; the wider context indicates these were elephants.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 위에는 튼튼한 나무 망루들이 덮개를 씌운 채, 각 짐승 위에 설치되어 있었고, 그 위에는 기계 장치들이 둘려 있었으며, 각각에 전투하는 사람 서른두 명과 그 인도인이 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 이 ‘짐승’은 전쟁 코끼리들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 문자적으로 ‘전투하는 사람들’이라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πύργοι ξύλινοι
  english_pob_choice: wooden towers
  chosen_korean: 나무 망루들
  alternatives_korean:
  - 나무 탑들
  - 목제 탑들
  lexicon: LSJ
  rationale: πύργοι는 탑이나 망루를 뜻하므로, 전투용 구조물의 맥락을 살려 ‘망루들’로 옮겼습니다.
- source_word: ὀχυροὶ σκεπαζόμενοι
  english_pob_choice: strong, covered over
  chosen_korean: 튼튼한 … 덮개를 씌운 채
  alternatives_korean:
  - 견고한 … 덮은 채
  - 튼튼하고 가려진
  lexicon: LSJ
  rationale: ὀχυροὶ의 견고함과 σκεπαζόμενοι의 덮여 있는 상태를 함께 살리되, 한국어에서는 자연스럽게 ‘덮개를 씌운 채’로 표현했습니다.
- source_word: θηρίου
  english_pob_choice: beast
  chosen_korean: 짐승
  alternatives_korean:
  - 동물
  - 짐승들
  lexicon: LSJ
  rationale: 본문은 문자적으로 ‘짐승’이라고 말하지만 문맥상 전쟁 코끼리를 가리키므로, 원문 어휘를 보존하는 쪽으로 ‘짐승’이라 옮겼습니다.
- source_word: ἄνδρες δύο καὶ τριάκοντα οἱ πολεμοῦντες
  english_pob_choice: thirty-two fighting men
  chosen_korean: 전투하는 사람 서른두 명
  alternatives_korean:
  - 싸우는 사람 서른두 명
  - 전사 서른두 명
  lexicon: LSJ
  rationale: οἱ πολεμοῦντες는 단순 숫자보다 ‘싸우는/전투하는 사람들’이라는 기능적 설명을 주므로, 원문의 분사적 성격을 드러내어 옮겼습니다.
- source_word: ὁ Ἰνδὸς αὐτοῦ
  english_pob_choice: its Indian driver
  chosen_korean: 그 인도인
  alternatives_korean:
  - 인도인 운전수
  - 인도인 조종자
  lexicon: LSJ
  rationale: 그리스어는 직역하면 ‘그의 인도인’에 가깝고, 영어 POB도 이를 식별 난점으로 보존하므로 한국어에서도 역할을 과도하게 단정하지 않고 최소한의 의미만 옮겼습니다.
theological_decisions:
- issue: 전투 코끼리와 그 위의 인원 배열을 어떻게 드러낼지
  chosen_reading: 원문이 말하는 비문학적·군사적 묘사를 그대로 살려, 장식적으로 완화하지 않고 코끼리 위의 망루와 전투 인원을 직서했습니다.
  alternative_readings:
  - 상징적으로 풀어 쓰는 방식
  - 전쟁 장비를 일반화하는 방식
  rationale: 이 절은 서술적 세부가 핵심이므로, 독자가 당시 전쟁 편제를 구체적으로 이해하도록 원문 구도를 유지하는 것이 타당합니다.
  doctrine_reference: 본문 맥락 보존 원칙
- issue: ὁ Ἰνδὸς αὐτοῦ의 호칭을 직역할지 역할을 확정할지
  chosen_reading: ‘그 인도인’으로 두어, 영어 POB가 주석으로 밝힌 ‘인도인 인솔자/조련인’의 가능성을 본문 밖에서 처리했습니다.
  alternative_readings:
  - ‘인도인 운전수’로 명시
  - ‘인도인 조련사’로 명시
  rationale: 원문 자체는 역할을 단정하지 않으므로, 본문은 최소 번역으로 두고 해석적 확정은 주석에 맡기는 편이 원문 충실도에 맞습니다.
  doctrine_reference: 주석-본문 구분 원칙
