  text: And from other kings and from islands of the seas, hired troops came to him.
translation:
  language: ko
  text: 그리고 다른 왕들과 바다의 섬들에서 고용된 군대가 그에게 왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ βασιλέων ἑτέρων
  english_pob_choice: from other kings
  chosen_korean: 다른 왕들에서
  alternatives_korean:
  - 다른 왕들에게서
  - 여러 다른 왕들로부터
  lexicon: βασιλεύς
  rationale: ἀπό + 속격의 출처를 살려 ‘~에서/~에게서’로 옮겼고, ἑτέρων은 단순한 ‘other’이므로 ‘다른’으로 간결하게 처리했습니다.
- source_word: ἀπὸ νήσων θαλασσῶν
  english_pob_choice: from islands of the seas
  chosen_korean: 바다의 섬들에서
  alternatives_korean:
  - 바다의 섬들로부터
  - 바다의 여러 섬들에서
  lexicon: νήσος
  rationale: 직역에 가깝게 ‘바다의 섬들’을 유지해 지리적 출처를 분명히 했습니다.
- source_word: δυνάμεις μισθωταί
  english_pob_choice: hired troops
  chosen_korean: 고용된 군대
  alternatives_korean:
  - 용병 부대
  - 고용된 병력
  lexicon: μισθωτός
  rationale: POB의 ‘hired troops’를 반영하되, 현대 한국어에서 자연스럽고 군사적 집단을 드러내는 ‘군대’로 옮겼습니다. ‘용병’은 의미는 분명하지만 다소 해석적이라 본문 표지로는 덜 직접적입니다.
theological_decisions:
- issue: 무장 세력의 성격을 어떻게 드러낼지
  chosen_reading: 본문의 초점은 도움의 출처(다른 왕들과 해상 섬들)와 고용된 군사력의 유입에 있으며, 그 군사력을 ‘고용된 군대’로 중립적으로 옮겼습니다.
  alternative_readings:
  - ‘용병들’로 더 강하게 노출
  - ‘용병 부대’로 해석적 강화
  rationale: 그리스어 μισθωταί는 고용된 전투 집단을 뜻하지만, 본문은 그들의 도덕적 평가보다 외부 조달의 사실을 말합니다. 따라서 해석을 과도하게 고정하지 않는 표현을 택했습니다.
  doctrine_reference: 본문 역사 서술의 중립성
