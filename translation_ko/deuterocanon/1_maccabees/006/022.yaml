  verdict: revise
  source_fidelity: ‘아무 조치도’는 목적어가 없는 οὐ ποιήσεις에 ‘아무’와 ‘조치’를 보태어, 요구되는 행동의 범위와 부정의 강도를 불필요하게 구체화합니다. 제공된 그리스어 증언은 Ἕως πότε οὐ ποιήσεις에서 절단되므로, 한국어도 목적어를 보충하지 않고 미완의 상태를 보존하는 편이 정확합니다.
  naturalness: ‘그들은 왕에게 가서 …라고 말했습니다’와 ‘언제까지 …하시겠습니까’는 현대 표준 한국어 합쇼체에서 자연스럽습니다. 줄임표 앞의 미완 문장도 본문 절단을 드러내는 데 적절합니다.
  terminology: 왕(βασιλεύς), 언제까지(Ἕως πότε), 하다(ποιήσεις)는 직접적이고 중립적으로 대응합니다. ‘하다’는 한국어에서 목적어 없이 다소 미완적으로 들릴 수 있으나, 바로 그 점이 원문의 절단과 목적어 부재를 충실히 나타냅니다.
