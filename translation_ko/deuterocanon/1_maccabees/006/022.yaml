  text: And they went to the king and said[b][a], “How long will you not act…?”
  footnotes:
  - marker: a
    text: The extant Zone 1 Greek for this verse is incomplete in the provided witness, ending after 'How long will you not act/do…?' The ellipsis reflects source-level truncation rather than a deliberate paraphrase.
    reason: textual_variant
  - marker: b
    text: Or, more formally, 'How long will you not do…?' The Greek verb ποιήσεις can mean 'do' broadly; 'act' was chosen for clearer English in a truncated clause.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 왕에게 가서 「언제까지 하지 않으시겠습니까…?」라고 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존하는 그리스어 증언은 이 절에서 「언제까지 하지 않으시겠습니까」에 해당하는 말(Ἕως πότε οὐ ποιήσεις) 뒤에서 끝납니다. 줄임표는 번역상의 의역이 아니라 원문 증언의 절단을 반영합니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπορεύθησαν
  english_pob_choice: went
  chosen_korean: 가서
  alternatives_korean:
  - 갔습니다
  - 왕에게 나아갔습니다
  lexicon: LSJ
  rationale: ἐπορεύθησαν은 여기서 단순한 이동을 가리키므로, 서술의 흐름을 자연스럽게 살리면서도 과도하게 격식을 높이지 않는 ‘가서’로 옮겼습니다.
- source_word: πρὸς τὸν βασιλέα
  english_pob_choice: to the king
  chosen_korean: 왕에게
  alternatives_korean:
  - 왕 앞으로
  - 왕 앞에
  lexicon: LSJ
  rationale: πρός + 대격은 이 문맥에서 왕을 향한 접근을 뜻하므로, 한국어에서는 목적어 표지와 함께 자연스러운 ‘왕에게’가 가장 직접적입니다.
- source_word: Ἕως πότε
  english_pob_choice: How long
  chosen_korean: 언제까지
  alternatives_korean:
  - 얼마나 더
  - 도대체 언제까지
  lexicon: LSJ
  rationale: 이 관용구는 불만이나 촉구를 담은 시간 질문이므로, 표준적이고 현대적인 한국어 대응인 ‘언제까지’를 선택했습니다.
- source_word: οὐ ποιήσεις
  english_pob_choice: will you not act
  chosen_korean: 아무 조치도 하지 않으시렵니까
  alternatives_korean:
  - 하지 않으시렵니까
  - 행동하지 않으시렵니까
  - 아무 일도 하지 않으시렵니까
  lexicon: LSJ
  rationale: ποιέω는 ‘하다, 행하다, 조처하다’처럼 넓은 뜻을 가지며, 본문이 절단되어 목적어가 없으므로 ‘조치하다’로 옮겨 요구된 개입의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 절단된 그리스어 문장과 생략부 표기
  chosen_reading: 본문이 ‘Ἕως πότε οὐ ποιήσεις’에서 끝나므로, 한국어도 문장 종결을 완결하지 않고 줄임표로 열어 두었습니다.
  alternative_readings:
  - 완전한 의문문으로 매끈하게 마무리하는 번역
  - 의미를 보충해 객체를 덧붙이는 번역
  rationale: 제공된 증언이 절단되어 있으므로, 원문 수준의 불완전성을 그대로 드러내는 것이 번역의 정확성과 감사 가능성을 보존합니다.
  doctrine_reference: textual criticism / source fidelity
