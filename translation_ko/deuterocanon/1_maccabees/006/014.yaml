base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/014.yaml
  text: Look[a], I am perishing in great grief in a foreign land. And he called Philip, one of his friends[b], and appointed him over all his kingdom.
  footnotes:
  - marker: a
    text: Or 'I am dying in great sorrow.' The Greek ἀπόλλυμαι can express perishing or dying, and λύπη can be rendered 'grief,' 'sorrow,' or 'distress.'
    reason: lexical_alternative
  - marker: b
    text: '''One of his friends'' may also reflect a court title for a royal associate or courtier, not merely a private friend.'
    reason: cultural_note
translation:
  language: ko
  text: 「보십시오, 나는 큰 슬픔 가운데 외국 땅에서 죽어 가고 있습니다.[a]」 그리고 그는 자기 친구들 가운데 하나인 필립을 불러, 그를 자기 온 왕국을 다스리도록 세웠습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나는 큰 슬픔 속에서 죽어 갑니다.’ ἀπόλλυμαι는 ‘죽어 가다’나 ‘멸망하다’의 뜻을 띨 수 있고, λύπη는 ‘슬픔’, ‘근심’, ‘고통’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘자기 친구들 가운데 하나’는 단순한 사적 친구라기보다 왕실의 동료나 궁정 신하를 가리키는 칭호일 수도 있습니다.
    reason: cultural_note
