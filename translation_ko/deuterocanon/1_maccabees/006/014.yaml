  - 자기 측근 가운데 하나인
  - 자기 궁정 신하 가운데 하나인
  lexicon: BDAG
  rationale: 기본 의미는 ‘친구’로 두되, 헬라 왕실 문맥의 측근 뉘앙스를 주석 없이도 반영할 수 있게 구조를 유지했습니다.
theological_decisions:
- issue: ἕνα τῶν φίλων αὐτοῦ의 궁정 호칭 가능성
  chosen_reading: 본문에는 ‘친구들 가운데 하나’로 두고, 인물 관계의 궁정적 뉘앙스는 본문 바깥 해설로 남깁니다.
  alternative_readings:
  - ‘측근’ 또는 ‘궁정 신하’로 본문에 반영
  - 단순한 사적 친구로만 좁혀 번역
  rationale: 영어 POB도 본문은 직역을 유지하고 각주에서 궁정 칭호 가능성을 밝히므로, 한국어도 본문 의미를 보존하는 쪽이 원문과 감사 가능성에 더 적합합니다.
  doctrine_reference: 역사서의 사회사적 뉘앙스 보존
