    reason: lexical_alternative
  - marker: c
    text: Or, 'my heart is cast down' or 'I am faint at heart.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 자기의 모든 친구를 불러 그들에게 말했습니다. 「잠이 내 눈에서 떠나가고, 내 마음은 근심 때문에 무너집니다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 모든 동료들’ 혹은 ‘그의 모든 자문자들’로도 옮길 수 있습니다. Greek φίλοι는 통치자의 측근 집단을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘잠이 내 눈에서 떠나갑니다’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘내 마음이 가라앉습니다’ 혹은 ‘나는 마음이 약해집니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλεσεν
  english_pob_choice: called
  chosen_korean: 불렀습니다
  alternatives_korean:
  - 소집했습니다
  - 불러 모았습니다
  lexicon: LSJ
  rationale: καλέω의 기본 뜻인 ‘부르다/소집하다’를 자연스러운 서술체로 옮겼습니다. 왕의 측근을 ‘소집하다’로 좁히기보다, 원문과 POB의 평이한 ‘called’를 따라 ‘불렀습니다’로 했습니다.
- source_word: πάντας τοὺς φίλους αὐτοῦ
  english_pob_choice: all his friends
  chosen_korean: 자기의 모든 친구
  alternatives_korean:
  - 자기의 모든 동료
  - 자기의 모든 측근
  - 자기의 모든 참모
  lexicon: LSJ
  rationale: φίλοι는 문자적으로 ‘친구들’이며, 궁정 맥락에서 측근을 뜻할 수도 있지만 원문이 그 기술어를 쓰지 않으므로 기본 의미를 살렸습니다.
- source_word: Ἀφίσταται ἀπὸ τῶν ὀφθαλμῶν μου ὁ ὕπνος
  english_pob_choice: Sleep departs from my eyes
  chosen_korean: 잠이 내 눈에서 떠나가고
  alternatives_korean:
  - 잠이 내 눈을 떠나고
  - 잠이 내 눈에서 물러가고
  lexicon: LSJ
  rationale: ‘눈에서 잠이 떠난다’는 직설적 이미지를 보존해 수면 불안을 생생하게 드러냈습니다. 한국어에서도 ‘떠나가다’가 가장 자연스럽고 원문과 가깝습니다.
- source_word: συνέπεπτον τῇ καρδίᾳ ἀπὸ τῆς μερίμνης
  english_pob_choice: my heart faints from anxiety
  chosen_korean: 내 마음은 근심 때문에 무너집니다
  alternatives_korean:
  - 내 마음은 불안 때문에 기운이 꺾입니다
  - 내 마음은 염려로 기절할 지경입니다
  - 내 마음은 걱정 때문에 가라앉습니다
  lexicon: LSJ
  rationale: συνέπεπτον은 심장이 ‘쓰러지다/무너지다’는 상태를 가리키므로, 감정의 약화만이 아니라 붕괴감을 살려 ‘무너집니다’로 옮겼습니다. μερίμνα는 ‘근심/염려/불안’ 범위가 있으나, 여기서는 압박감이 강해 ‘근심’이 적절합니다.
theological_decisions:
- issue: 왕의 내면 독백을 직설적 감정 표현으로 옮길지 여부
  chosen_reading: 잠 못 이루는 불안과 심장의 붕괴를 그대로 드러내는 표현을 유지했습니다.
  alternative_readings:
  - 더 완곡하게 ‘마음이 불안합니다’로 조정
  - ‘걱정이 큽니다’로 일반화
  rationale: 본문은 단순한 걱정이 아니라 수면 상실과 심장 붕괴를 병렬로 제시하므로, 그 긴장을 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 서사 본문 번역 원칙
