  text: And he called all his friends and said to them[a], “Sleep departs from my eyes[c][b], and my heart faints from anxiety.”
  footnotes:
  - marker: a
    text: Or, 'all his companions' or 'all his advisers'; Greek 'friends' can also refer to members of a ruler's inner circle.
