  text: And he came to terms with those in Bethsura and went out from the city[a], because they had no provisions there to remain shut up in it, because it was a sabbath year for the land.
  footnotes:
  - marker: a
    text: Literally, 'it was a sabbath for the land,' referring to the sabbatical year when the land lay fallow.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 베드수라 사람들과 합의하고 그 도시에서 나갔습니다[a]. 그곳에는 그들이 그 안에 갇혀 있으면서 머무를 양식이 없었기 때문입니다. 이는 그 땅에 안식년이었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 땅에 안식일이 있었다’이지만, 여기서는 토지가 쉬는 안식년을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν μετὰ τῶν ἐκ Βεθσούρων
  english_pob_choice: he came to terms with those in Bethsura
  chosen_korean: 베드수라 사람들과 합의하고
  alternatives_korean:
  - 베드수라 사람들과 화해하고
  - 베드수라 사람들과 협상하고
  lexicon: LSJ
  rationale: 전쟁·포위 맥락의 ἐποίησεν μετά는 단순한 ‘대하다’보다 ‘합의하다/타협하다’의 뜻이 자연스러워, 이를 간결하게 살렸습니다.
- source_word: ἐξῆλθε ἐκ τῆς πόλεως
  english_pob_choice: went out from the city
  chosen_korean: 그 도시에서 나갔습니다
  alternatives_korean:
  - 그 도시를 떠났습니다
  - 그 도시 밖으로 나갔습니다
  lexicon: LSJ
  rationale: 동사의 이동 의미를 직역 과잉 없이 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: διατροφή
  english_pob_choice: provisions
  chosen_korean: 양식
  alternatives_korean:
  - 식량
  - 보급품
  - 식량과 보급품
  lexicon: LSJ
  rationale: 포위 상황에서 필요한 유지 수단이라는 뜻을 살리되, 한국어에서는 ‘양식’이 가장 간결하게 먹을거리와 생존 보급을 함께 담습니다.
- source_word: τοῦ συνκλεισθαι ἐν αὐτῇ
  english_pob_choice: to remain shut up in it
  chosen_korean: 그 안에 갇혀 있으면서 머무를
  alternatives_korean:
  - 그 안에 갇혀 지내는
  - 그 안에 갇혀 머물
  lexicon: LSJ
  rationale: ‘갇혀 있다’는 상태와 ‘머무르다’의 지속성을 함께 보여 주어 포위된 상태를 분명하게 했습니다.
- source_word: σάββατον ἦν τῇ γῇ
  english_pob_choice: it was a sabbath year for the land
  chosen_korean: 그 땅에 안식년이었기
  alternatives_korean:
  - 그 땅에 안식일이었기
  - 그 땅이 안식하는 때였기
  lexicon: LSJ
  rationale: 영어 POB의 해석을 따라 주기적 안식일이 아니라 토지의 안식년을 뜻한다고 반영했습니다.
theological_decisions:
- issue: σάββατον ἦν τῇ γῇ의 의미
  chosen_reading: ‘안식년’으로 구체화해 토지가 경작을 쉬는 해를 가리키는 뜻으로 읽었습니다.
  alternative_readings:
  - ‘그 땅에 안식이 있었다’로 더 직역하는 읽기
  rationale: 문맥상 식량 부족의 원인이 농경 중단과 관련된 안식년이므로, 독자가 오해하지 않도록 구체화하는 것이 원문 의도를 더 잘 드러냅니다.
  doctrine_reference: 1 Maccabees 6:49의 역사 서술 맥락; 레위기 25장의 안식년 개념과 연결되는 용례
