  text: And he came to terms with those in Bethsura and went out from the city[a], because they had no provisions there to remain shut up in it, because it was a sabbath year for the land.
  footnotes:
  - marker: a
    text: Literally, 'it was a sabbath for the land,' referring to the sabbatical year when the land lay fallow.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 베드수라 사람들과 협정을 맺고 그 도시에서 나갔습니다. 그곳에 갇혀 지내기에 필요한 양식이 없었기 때문입니다. 그 땅에 안식년이었기 때문입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 땅에는 안식일이 있었다’입니다. 여기서는 토지가 쉬는 안식년을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν μετὰ τῶν ἐκ Βεθσούρων
  english_pob_choice: he came to terms with those in Bethsura
  chosen_korean: 베드수라 사람들과 합의하고
  alternatives_korean:
