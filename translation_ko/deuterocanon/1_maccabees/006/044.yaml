  text: And he gave himself to save his people and to win for himself an everlasting name.
translation:
  language: ko
  text: 그리고 그는 자기 백성을 구원하고 자기에게 영원한 이름을 얻기 위해 자신을 내주었습니다.[a]
  philosophy: formal
