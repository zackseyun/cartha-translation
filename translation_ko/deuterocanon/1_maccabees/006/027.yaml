  - 붙들어 둘 수 없을 것입니다
  lexicon: LSJ
  rationale: κατέχω 계열의 ‘붙들어 두다/억제하다’ 의미를 살리면서, 전쟁·정치적 긴장 속에서 가장 자연스러운 동사로 옮겼습니다.
theological_decisions:
- issue: ἀὐτούς/αὐτῶν의 대상 표현을 한국어에서 어떻게 드러낼지
  chosen_reading: ‘그들을’로 분명하게 옮겨, 선제 행동과 통제 불능의 대상이 같은 집단임을 드러냈습니다.
  alternative_readings:
