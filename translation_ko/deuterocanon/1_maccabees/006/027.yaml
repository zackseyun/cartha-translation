  lexicon: LSJ
  rationale: 직역의 ‘더 큰’ 구조를 유지하되, 한국어에서 자연스러운 목적어 구문으로 옮겼습니다. 문맥상 ‘더 심각한/더 광범위한’ 뉘앙스는 열어 두었습니다.
- source_word: κατασχεῖν
  english_pob_choice: restrain
  chosen_korean: 억누를 수 없을 것입니다
  alternatives_korean:
