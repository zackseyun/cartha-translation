  rationale: 그리스어의 대격/속격 관계를 한국어로 매끄럽게 풀어 주되, 문맥의 긴박한 군사-정치적 경고를 흐리지 않기 위해 직접목적어를 유지했습니다.
  doctrine_reference: 본문 문맥상의 역사 서술; 교리적 쟁점 없음
