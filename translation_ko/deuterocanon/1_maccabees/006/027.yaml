  text: And if he does not get ahead of them quickly[a], they will do greater things than these[b], and he will not be able to restrain them.
  footnotes:
  - marker: a
    text: Or 'preempt them quickly' or 'overtake them quickly'; the Greek verb suggests acting before them or forestalling them.
    reason: lexical_alternative
  - marker: b
    text: Literally 'greater things than these'; in context this may mean more serious or more extensive actions.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 신속히 그들을 미리 막지 않으면[a], 그들은 이보다 더 큰 일들을 할 것이며[b], 그는 그들을 제어할 수 없을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들보다 먼저 행동하여 막지’, ‘그들을 앞질러 막지’; 그리스어 동사는 상대보다 먼저 행동하거나 미리 막는다는 뜻을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘이것들보다 더 큰 일들’입니다. 문맥상 더 심각하거나 더 광범위한 행동을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προκαταλάβῃ
  english_pob_choice: get ahead of
