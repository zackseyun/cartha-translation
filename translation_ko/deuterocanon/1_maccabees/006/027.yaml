  yaml_path: translation/deuterocanon/1_maccabees/006/027.yaml
  text: And if he does not get ahead of them quickly[a], they will do greater things than these[b], and he will not be able to restrain them.
  footnotes:
  - marker: a
    text: Or 'preempt them quickly' or 'overtake them quickly'; the Greek verb suggests acting before them or forestalling them.
    reason: lexical_alternative
  - marker: b
    text: Literally 'greater things than these'; in context this may mean more serious or more extensive actions.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 그들을 빨리 앞질러 제압하지 않으면, 그들은 이보다 더 큰 일들을 할 것이고, 그는 그들을 억누를 수 없을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 미리 차단하지’, ‘그들보다 먼저 손을 쓰지’; 그리스어 동사는 먼저 행동하여 막는 뜻을 가집니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘이것들보다 더 큰 일들’입니다. 문맥상 더 심각하거나 더 광범위한 행동을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προκαταλάβῃ
  english_pob_choice: get ahead of
  chosen_korean: 빨리 앞질러 제압하지
  alternatives_korean:
  - 빨리 앞서가지
  - 신속히 선점하지
  - 재빨리 제압하지
  lexicon: LSJ
  rationale: 앞질러는 ‘먼저 나아가 막다/앞서다’는 선제 의미를 살리고, 문맥상 군사적 긴박함을 드러내는 제압하지로 행동의 선행성을 표현했습니다.
- source_word: διὰ τάχους
  english_pob_choice: quickly
  chosen_korean: 빨리
  alternatives_korean:
  - 신속히
  - 지체 없이
  - 서둘러
  lexicon: LSJ
  rationale: 짧고 자연스러운 현대 한국어로 긴박성을 전달하기 위해 ‘빨리’를 택했습니다.
- source_word: μείζονα τούτων
  english_pob_choice: greater things than these
  chosen_korean: 이보다 더 큰 일들을
  alternatives_korean:
  - 이것들보다 더 큰 일들을
  - 이보다 더 심각한 일들을
  - 더 큰 것들을
  lexicon: LSJ
  rationale: 직역의 ‘더 큰’ 구조를 유지하되, 한국어에서 자연스러운 목적어 구문으로 옮겼습니다. 문맥상 ‘더 심각한/더 광범위한’ 뉘앙스는 열어 두었습니다.
- source_word: κατασχεῖν
  english_pob_choice: restrain
  chosen_korean: 억누를 수 없을 것입니다
  alternatives_korean:
  - 제어할 수 없을 것입니다
  - 막을 수 없을 것입니다
  - 붙들어 둘 수 없을 것입니다
  lexicon: LSJ
  rationale: κατέχω 계열의 ‘붙들어 두다/억제하다’ 의미를 살리면서, 전쟁·정치적 긴장 속에서 가장 자연스러운 동사로 옮겼습니다.
theological_decisions:
- issue: ἀὐτούς/αὐτῶν의 대상 표현을 한국어에서 어떻게 드러낼지
  chosen_reading: ‘그들을’로 분명하게 옮겨, 선제 행동과 통제 불능의 대상이 같은 집단임을 드러냈습니다.
  alternative_readings:
  - ‘그들에 대해’
  - ‘그들 위에’
  rationale: 그리스어의 대격/속격 관계를 한국어로 매끄럽게 풀어 주되, 문맥의 긴박한 군사-정치적 경고를 흐리지 않기 위해 직접목적어를 유지했습니다.
  doctrine_reference: 본문 문맥상의 역사 서술; 교리적 쟁점 없음
