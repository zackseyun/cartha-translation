  rationale: ἰσχύω의 ‘힘을 얻다/강해지다’와 ὅπλοις의 수단 의미를 함께 반영했습니다.
theological_decisions:
- issue: 마지막 절의 압축된 군사 관용구 해석
  chosen_reading: ‘진영들에서 빼앗아 온 무기들로 힘을 얻었습니다’로 읽어, 약탈한 전리품이 전세를 바꾸는 수단임을 분명히 했습니다.
  alternative_readings:
  - ‘무기들을 가지고 우세해졌습니다’
  - ‘무기들로 이겼습니다’
  rationale: 그리스어는 전투 후 전리품과 전세 역전을 압축해 말하므로, 의미를 지나치게 단순화하지 않되 한국어로는 이해 가능하게 풀었습니다.
  doctrine_reference: 없음
