  text: and to follow his commands[a], because those of our people were becoming alienated from us on account of this, except those who were found among us.
  footnotes:
  - marker: a
    text: Greek text is syntactically compressed in the final clause; 'except for as many as were found among us' preserves the wording closely, though the exact nuance of affiliation may also be understood as 'except those found on our side.'
