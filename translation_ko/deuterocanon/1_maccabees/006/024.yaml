translation:
  language: ko
  text: 그리고 그의 명령들을 따르도록 하였습니다[a]. 우리 백성 가운데서 이 일 때문에 우리에게서 멀어져 간 사람들이 있었기 때문입니다. 다만 우리 가운데서 발견된 사람들은 예외였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어는 마지막 절이 압축되어 있어, ‘우리 가운데서 발견된 사람들’은 문자 그대로의 표현을 살리되 소속의 뉘앙스는 문맥상 열린 채로 둡니다.
    reason: alternative_reading
lexical_decisions:
- source_word: κατακολουθεῖν τοῖς προστάγμασιν αὐτοῦ
  english_pob_choice: to follow his commands
  chosen_korean: 그의 명령들을 따르다
  alternatives_korean:
  - 그의 지시들을 따르다
  - 그의 명령에 따르다
  - 그의 명령을 준행하다
  lexicon: LSJ
  rationale: κατακολουθεῖν은 뒤따라가며 따르는 뜻이고, τοῖς προστάγμασιν은 권위 있는 명령을 가리키므로, 현대 한국어에서는 자연스럽고 직접적인 ‘명령들을 따르다’가 원뜻을 잘 살립니다.
- source_word: οἱ τοῦ λαοῦ ἡμῶν
  english_pob_choice: those of our people
  chosen_korean: 우리 백성 가운데서
  alternatives_korean:
  - 우리 백성의 사람들
  - 우리 백성 중의 사람들
  - 우리 백성
  lexicon: LSJ
  rationale: 헬라어는 직역하면 ‘우리 백성에 속한 사람들’이라는 생략형이므로, 한국어에서는 소속과 집단성을 살려 ‘우리 백성 가운데서’로 옮겼습니다.
- source_word: ἠλλοτριοῦντο ἀφʼ ἡμῶν
  english_pob_choice: were becoming alienated from us
  chosen_korean: 우리에게서 멀어져 간 사람들이 있었다
  alternatives_korean:
  - 우리에게서 소외되어 가고 있었습니다
  - 우리에게서 이탈해 가고 있었습니다
  - 우리에게서 멀어져 있었습니다
  lexicon: LSJ
  rationale: ἠλλοτριοῦντο는 관계가 점차 끊어지는 진행상을 나타내므로, ‘소외되다’보다 서술적으로 ‘멀어져 가다’가 맥락의 정치·사회적 거리감을 더 자연스럽게 드러냅니다.
- source_word: πλὴν ὅσοι εὑρίσκοντο ἀφʼ ἡμῶν
  english_pob_choice: except those who were found among us
  chosen_korean: 다만 우리 가운데서 발견된 사람들은 예외였습니다
  alternatives_korean:
  - 다만 우리 가운데서 발견된 자들만 예외였습니다
  - 그러나 우리 편으로 발견된 사람들은 예외였습니다
  - 다만 우리 편에 있던 사람들은 예외였습니다
  lexicon: LSJ
  rationale: πλὴν은 예외를 표시하고, εὑρίσκοντο는 ‘발견되다/드러나다’의 수동형이므로 POB의 절제된 의미를 따라 ‘발견된 사람들’로 옮겼습니다.
