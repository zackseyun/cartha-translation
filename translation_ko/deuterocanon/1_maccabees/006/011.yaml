  text: And I said in my heart, ‘Into what distress I have come, and into a great סער? now I am in it—though I was kind and beloved.’
translation:
  language: ko
  text: 그리고 나는 마음속으로 말했습니다. ‘내가 얼마나 큰 환난과 거센 폭풍 속에 이르게 되었는가! 이제 나는 그 가운데 있습니다—그러나 나는 친절했고 사랑받는 사람이었습니다.’[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 직역하면 ‘큰 סער/풍랑’에 해당하는 표현으로, 헬라어 κλύδων μεγάλου의 격렬한 물결 이미지를 반영합니다.
    reason: source_note
lexical_decisions:
- source_word: θλίψεως
  english_pob_choice: distress
  chosen_korean: 환난
  alternatives_korean:
  - 고난
  - 곤경
  - 고통
  lexicon: θλῖψις
  rationale: 여기서는 단순한 곤란보다 압박과 고통을 함께 담는 ‘환난’이 원문의 강도를 잘 살립니다.
- source_word: κλύδωνος μεγάλου
  english_pob_choice: great סער?
  chosen_korean: 거센 폭풍
  alternatives_korean:
  - 큰 풍랑
  - 거대한 파도
  - 큰 소용돌이
  lexicon: κλύδων
  rationale: POB의 영어가 어휘 불확실성을 남겼지만, 헬라어 κλύδων은 파도·풍랑의 격렬한 출렁임을 가리키므로 한국어에서는 자연스럽고 स्रोत에 맞는 ‘거센 폭풍’으로 옮겼습니다.
- source_word: χρηστὸς
  english_pob_choice: kind
  chosen_korean: 친절했고
  alternatives_korean:
  - 선했고
  - 온화했고
  - 자비로웠고
  lexicon: χρηστός
  rationale: 문맥상 인격적 호의와 온유함을 가리키므로 ‘친절하다’가 가장 무난하며, 과도한 신학화 없이도 품성을 드러냅니다.
- source_word: ἀγαπώμενος
  english_pob_choice: beloved
  chosen_korean: 사랑받는 사람이었습니다
  alternatives_korean:
  - 사랑받았습니다
  - 사랑을 받는 자였습니다
  - 사랑받는 존재였습니다
  lexicon: ἀγαπάω
  rationale: 수동 분사로서 현재적 상태를 나타내므로 ‘사랑받는 사람이었습니다’로 자연스럽게 풀어 원문의 상태 진술을 보존했습니다.
theological_decisions:
- issue: 화자의 자기평가와 현재 처지의 대비
  chosen_reading: ‘친절했고 사랑받는 사람이었습니다’와 ‘이제 나는 그 가운데 있습니다’의 대비를 살려, 과거의 평판과 현재의 환난을 함께 드러냈습니다.
  alternative_readings:
  - ‘나는 착했고 사랑받는 사람이었습니다’
  - ‘나는 은혜를 입고 사랑받았습니다’
  rationale: 본문은 도덕적 자평과 현재의 역경을 병치하므로, 이를 약화시키지 않고 그대로 대비시키는 번역이 필요합니다.
  doctrine_reference: 문맥 주의; 본문은 회개의 고백이 아니라 처지의 탄식입니다.
