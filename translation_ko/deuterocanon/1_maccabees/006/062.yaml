  source_fidelity: 초안은 βασιλεύς, τὸ ὄρος Σιών, ὀχύρωμα, 맹세의 위반, 성벽의 파괴라는 핵심 의미를 대체로 잘 옮겼습니다. 그러나 ἐνετείλατο καὶ καθεῖλεν은 ‘허물라고 명령했다’라는 단일 명령 내용이 아니라, 왕이 명령을 내리고 성벽을 허물었다는 두 동작을 병렬로 서술합니다. 이를 보존해야 합니다.
  naturalness: ‘그곳의 요새를 보고는’과 ‘맹세를 깨뜨리고’는 자연스럽습니다. 다만 각주 표지는 해당 어휘 바로 뒤에 두는 것이 독자에게 명확하며, 두 동작을 ‘명령을 내리고 … 허물었습니다’로 옮기면 현대 한국어 합쇼체에서도 자연스럽습니다.
  terminology: ‘시온 산’, ‘요새’, ‘맹세’, ‘성벽’은 적절합니다. ‘자신이 맺은 맹세’는 뜻은 통하지만 ὃν ὤμοσεν(그가 맹세한)을 더 직접적으로 반영하는 ‘자신이 한 맹세’로 다듬었습니다. 기존 a 각주는 본문 선택어인 ‘요새’를 대안으로 다시 제시하므로 대안을 조정했습니다.
