  yaml_path: translation/deuterocanon/1_maccabees/006/062.yaml
  text: And the king entered Mount Zion[a], and when he saw the fortification of the place[b], he broke the oath that he had sworn and gave orders to tear down the wall all around.
  footnotes:
  - marker: a
    text: Or 'the fortification' or 'the fortress' for 'the stronghold.'
    reason: lexical_alternative
  - marker: b
    text: Or 'he set aside' or 'he violated' the oath; the Greek verb denotes invalidating or disregarding a binding commitment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 왕은 시온 산에 들어가 그곳의 요새[a]를 보고, 자신이 한 맹세[b]를 깨뜨렸습니다. 그리고 명령을 내리고 그 둘레의 성벽을 허물었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성채’ 또는 ‘방어 시설’로도 옮길 수 있습니다. ὀχύρωμα는 견고하게 방어된 거점이나 방어 시설을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘저버리고’ 또는 ‘무효로 하고’로도 옮길 수 있습니다. ἠθέτησεν은 구속력 있는 맹세를 무시하거나 무효화하는 뜻을 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ὄρος Σιών
  english_pob_choice: Mount Zion
  chosen_korean: 시온 산
  alternatives_korean:
  - 시온
  - 시온의 산
  lexicon: LSJ
  rationale: ὄρος는 기본적으로 '산'이므로, 지명 '시온'에 산을 붙여 지형 감각을 살렸습니다.
- source_word: τὸ ὀχύρωμα
  english_pob_choice: the stronghold
  chosen_korean: 요새
  alternatives_korean:
  - 성채
  - 견고한 방어시설
  lexicon: LSJ
  rationale: ὀχύρωμα는 군사적 방어 거점을 가리키므로, 현대 한국어에서 자연스럽고 기능을 드러내는 '요새'를 택했습니다.
- source_word: ἠθέτησεν τὸν ὁρκισμὸν
  english_pob_choice: he broke the oath
  chosen_korean: 자신이 맺은 맹세를 깨뜨리고
  alternatives_korean:
  - 맹세를 저버리고
  - 맹세를 무효로 하고
  lexicon: LSJ
  rationale: ἠθέτησεν은 맹세를 무효화하거나 저버리는 의미이므로, 문맥상 가장 직접적인 '깨뜨리다'로 옮겨 oath-violation의 윤리적 무게를 보존했습니다.
- source_word: καθεῖλεν τὸ τεῖχος κυκλόθεν
  english_pob_choice: tear down the wall all around
  chosen_korean: 사방의 성벽을 허물라고
  alternatives_korean:
  - 둘레의 성벽을 무너뜨리라고
  - 주위를 둘러싼 성벽을 허물라고
  lexicon: LSJ
  rationale: καθεῖλεν은 무너뜨리다/헐다의 뜻이므로 '허물다'를 택했고, κυκλόθεν은 '사방에, 둘레로'라는 공간적 범위를 '사방의'로 간결하게 살렸습니다.
theological_decisions:
- issue: 왕의 명령과 서술 동사의 연결 방식
  chosen_reading: 직역식 목적구조를 풀어 '성벽을 허물라고 명령했습니다'로 자연스럽게 처리했습니다.
  alternative_readings:
  - 성벽을 허물도록 명령했습니다
  - 성벽을 헐라고 지시했습니다
  rationale: 헬라어는 '명령하다 + 허물다' 구조이므로, 한국어에서는 명령 내용이 드러나도록 부정사적 의미를 풀어 주되 과도한 해석은 피했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
