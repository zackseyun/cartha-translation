  text: And he remained there for many days[a], because great grief came over him, and he thought that he was dying.
  footnotes:
  - marker: a
    text: Or 'great grief was renewed upon him.' The Greek verb emphasizes that his sorrow returned or was revived.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 거기서 여러 날 머물렀습니다. 큰 슬픔이 그에게 다시 덮쳐 왔고[a], 자기가 죽어 가고 있다고 생각했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘큰 슬픔이 그에게 다시 일어났다’라고 옮길 수 있습니다. 그리스어 동사는 슬픔이 새롭게 일어나거나 되살아난다는 뜻을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν ἐκεῖ
  english_pob_choice: he remained there
  chosen_korean: 거기서 … 머물렀습니다
  alternatives_korean:
  - 거기 있었습니다
  - 거기서 지냈습니다
  lexicon: LSJ
  rationale: 장소 부사와 함께한 εἰμί는 단순한 존재보다 지속적 체류를 뜻하므로, 자연스러운 현대 한국어로 ‘머물다’가 그 뉘앙스를 가장 잘 살립니다.
- source_word: ἡμέρας πλείους
  english_pob_choice: for many days
  chosen_korean: 여러 날
  alternatives_korean:
  - 많은 날 동안
  - 며칠 동안
  lexicon: LSJ
  rationale: 긴 기간을 가리키는 표현이므로, 문어체에서 무난하면서도 과장되지 않은 ‘여러 날’로 옮겼습니다.
- source_word: ἀνεκαινίσθη ἐπ᾽ αὐτὸν λύπη μεγάλη
  english_pob_choice: great grief came over him
  chosen_korean: 큰 슬픔이 그에게 다시 덮쳐 왔고
  alternatives_korean:
  - 큰 슬픔이 그에게 덮쳐 왔고
  - 큰 슬픔이 그에게 새로이 일어났고
  lexicon: LSJ
  rationale: ἀνακαινίζω의 수동형은 슬픔이 ‘갱신/재개’되는 뜻을 띠므로, 재발하는 압도적 감정을 한국어의 ‘다시 덮쳐 오다’로 표현했습니다.
- source_word: ἐλογίσατο ὅτι ἀποθνήσκει
  english_pob_choice: he thought that he was dying
  chosen_korean: 자기가 죽어 가고 있다고 생각했습니다
  alternatives_korean:
  - 자기가 죽는다고 생각했습니다
  - 자기가 죽어 가는 중이라고 생각했습니다
  lexicon: LSJ
  rationale: 현재형 ἀποθνήσκει는 단순한 미래 예측보다 진행 중인 상태를 가리키므로, ‘죽어 가다’로 번역해 즉시성을 살렸습니다.
