translation:
  language: ko
  text: 그리고 그는 성소를 대적하여 여러 날 동안 진을 쳤으며, 그곳에 투사기와 공성기와 화염 발사기와 투석기와 전갈들을 설치하여 화살과 물매돌을 쏘도록 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
