  lexicon: LSJ
  rationale: 목적을 나타내는 부정사 구문이므로 ‘쏘게’로 목적성을 살렸고, βέλη와 σφενδόνας는 POB의 대응을 따라 화살과 슬링돌로 유지했습니다.
theological_decisions:
- issue: ἁγίασμα의 한국어 범주
  chosen_reading: ‘성소’로 번역하여 성전 구역 전체를 가리키는 군사적 대상임을 드러냈습니다.
  alternative_readings:
  - 거룩한 곳
  - 성전
  - 성소 구역
  rationale: 문맥상 제사 공간이라기보다 공격 대상이 된 성전 영역이므로, ‘성소’가 가장 짧고 원문의 긴장을 보존합니다.
