translation:
  language: ko
  text: 그리고 그는 성소를 향해 여러 날 동안 진을 쳤고, 거기에 투사기와 공성기와 화염 발사기와 투석기와 전갈들을 세워 놓아 화살과 슬링돌을 쏘게 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전갈 발사기들’, 소형 투사 병기의 한 종류입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρενέβαλεν
  english_pob_choice: encamped
  chosen_korean: 진을 쳤고
  alternatives_korean:
  - 캠프를 쳤고
  - 포위하여 진을 쳤고
  - 주둔했고
  lexicon: LSJ
  rationale: 군사적 맥락에서 단순한 ‘머묾’보다 진을 치는 행위를 드러내면서도, 본문이 직접 말하는 ‘진을 친’ 동작을 보존합니다.
- source_word: ἐπὶ τὸ ἁγίασμα
  english_pob_choice: against the sanctuary
  chosen_korean: 성소를 향해
  alternatives_korean:
  - 성소를 대적하여
  - 성소를 향하여
  - 거룩한 곳을 향해
  lexicon: LSJ
  rationale: ἀγίασμα은 성전/성소 구역을 가리키므로, 군사 동사와 함께 적대적 방향성을 나타내되 한국어에서는 과도하게 해설적이지 않게 ‘성소를 향해’로 옮겼습니다.
- source_word: βελοστασίσεις
  english_pob_choice: missile-launchers
  chosen_korean: 투사기
  alternatives_korean:
  - 미사일 발사기
  - 화살 발사기
  - 투사 장치
  lexicon: LSJ
  rationale: 직역하면 ‘투사하는 장치’로, 뒤의 ‘화살을 쏘게’와도 맞물리므로 특정 현대 무기 이미지를 피한 중립적 군사 용어를 택했습니다.
- source_word: μηχανὰς
  english_pob_choice: engines
  chosen_korean: 공성기
  alternatives_korean:
  - 기계
  - 공성 장치
  - 공성 엔진
  lexicon: LSJ
  rationale: 문맥상 전쟁 기계, 곧 공성 장치를 가리키므로 한국어로는 의미가 분명한 ‘공성기’가 적절합니다.
- source_word: πυροβόλα
  english_pob_choice: fire-throwers
  chosen_korean: 화염 발사기
  alternatives_korean:
  - 불을 던지는 장치
  - 화염 투사기
  - 불사출기
  lexicon: LSJ
  rationale: 문자적으로는 ‘불을 던지는 것들’이므로, 화염을 투사하는 병기라는 점을 살려 ‘화염 발사기’로 옮겼습니다.
- source_word: λιθοβόλα
  english_pob_choice: stone-throwers
  chosen_korean: 투석기
  alternatives_korean:
  - 돌 던지는 장치
  - 석투기
  - 돌 발사기
  lexicon: LSJ
  rationale: 기본 의미는 돌을 던지는 장치이며, 한국어에서 가장 익숙한 공성무기 명칭인 ‘투석기’가 자연스럽습니다.
- source_word: σκορπίδια
  english_pob_choice: scorpions
  chosen_korean: 전갈들
  alternatives_korean:
  - 전갈 발사기
  - 스콜피온들
  - 소형 발사기
  lexicon: LSJ
  rationale: 영어 POB처럼 역사적 명칭을 유지해 본문의 기계 명칭을 살리되, 한국어 독자가 기기 이름으로 인식할 수 있도록 복수형 ‘전갈들’로 옮겼습니다.
- source_word: εἰς τὸ βάλλεσθαι βέλη καὶ σφενδόνας
  english_pob_choice: to shoot arrows and slingstones
  chosen_korean: 화살과 슬링돌을 쏘게
  alternatives_korean:
  - 화살과 물매돌을 쏘게
  - 화살과 투석용 돌을 쏘게
