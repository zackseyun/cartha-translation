  source_fidelity: 원문의 핵심 의미는 대체로 충실합니다. 다만 ‘그들은 각각 자기 자리로’는 ἕκαστος εἰς τὸν τόπον αὐτοῦ의 분배적 의미를 다소 중복되게 표현하며, ‘자리’는 τόπος의 넓은 ‘곳/장소’보다 특정한 자리나 위치를 연상시킬 수 있습니다.
  naturalness: 초안의 ‘기근이 그들을 압도했기 때문이며’는 현대 표준 한국어 문장 연결로 다소 부자연스럽습니다. 원문의 인과관계와 이어지는 동작을 ‘때문에 … 흩어졌습니다’로 매끄럽게 연결할 수 있습니다.
  terminology: ‘성소’는 성전의 신성한 공간이라는 문맥을 적절히 전달합니다. ἄνδρες의 남성 지시는 ‘남자’로 보존할 수 있으나, ‘몇몇 남자들’보다 ‘몇 사람의 남자들’이 ‘적은 수’를 더 분명하게 나타냅니다.
