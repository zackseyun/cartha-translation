  text: And a few men were left in the sanctuary[a], because the famine had overpowered them; and they were scattered, each to his own place.
  footnotes:
  - marker: a
    text: Or 'in the holy place' or 'in the holy precincts.' The Greek literally says 'in the holy [things/places],' a temple-related expression referring to the sacred area.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 성소 안에는 몇몇 남자들만 남아 있었는데, 기근이 그들을 압도했기 때문이며, 그들은 각각 자기 자리로 흩어졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거룩한 곳에’, ‘성전 구역에’. 그리스어는 문자적으로 ‘거룩한 [것들/곳들]’이라고 하며, 성전과 관련된 신성한 구역을 가리키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τοῖς ἁγίοις
  english_pob_choice: in the sanctuary
  chosen_korean: 성소 안에
  alternatives_korean:
  - 거룩한 곳에
  - 거룩한 구역에
  - 성전 구역에
  lexicon: LSJ
  rationale: 이 표현은 문자적으로는 ‘거룩한 것들/곳들’이지만, 문맥상 성전의 신성한 공간을 가리키므로 한국어에서는 자연스럽고 정확한 ‘성소 안에’로 옮겼습니다.
- source_word: ἄνδρες ὀλίγοι
  english_pob_choice: a few men
  chosen_korean: 몇몇 남자들
  alternatives_korean:
  - 몇 사람
  - 적은 수의 남자들
  lexicon: LSJ
  rationale: ἄνδρες는 일반적 인류가 아니라 남성들을 가리키므로 성별을 살렸고, ὀλίγοι는 관용적으로 ‘몇몇’이 가장 자연스럽습니다.
- source_word: κατεκράτησεν αὐτῶν ὁ λιμός
  english_pob_choice: the famine had overpowered them
  chosen_korean: 기근이 그들을 압도했기 때문이며
  alternatives_korean:
  - 기근이 그들을 제압했기 때문이며
  - 기근이 그들 위에 군림했기 때문이며
  - 기근이 그들을 이겼기 때문이며
  lexicon: LSJ
  rationale: κατακρατέω는 ‘이기다’보다 강한 ‘압도하다/제압하다’의 뜻이므로, 기근이 사람들을 지배한 상황을 분명히 드러내는 ‘압도했다’로 옮겼습니다.
- source_word: ἐσκορπίσθησαν ἕκαστος εἰς τὸν τόπον αὐτοῦ
  english_pob_choice: they were scattered, each to his own place
  chosen_korean: 그들은 각각 자기 자리로 흩어졌습니다
  alternatives_korean:
  - 그들은 각각 자기 곳으로 흩어졌습니다
  - 각자 자기 처소로 흩어졌습니다
  - 그들은 각각 자기 장소로 흩어졌습니다
  lexicon: LSJ
  rationale: 수동태의 결과를 살려 ‘흩어졌습니다’로 옮기고, τόπος는 너무 구체화하지 않고 ‘자리’로 두어 원문의 넓은 의미를 유지했습니다.
theological_decisions:
- issue: ἐν τοῖς ἁγίοις의 성전 관련 뉘앙스
  chosen_reading: 성전의 신성한 구역을 뜻하는 표현으로 이해해 ‘성소 안에’로 번역했습니다.
  alternative_readings:
  - ‘거룩한 곳에’
  - ‘성전 구역에’
  - ‘거룩한 것들 가운데에’
  rationale: 본문은 전투·성전 맥락 속 공간 표현이므로 추상화하지 않고, 독자가 성전 공간을 바로 이해하도록 했습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; cultic spatial reference preserved without over-literal awkwardness.'
