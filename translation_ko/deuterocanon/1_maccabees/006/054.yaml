- from: 그리고 성소 안에는 몇몇 남자들만 남아 있었는데, 기근이 그들을 압도했기 때문이며, 그들은 각각 자기 자리로 흩어졌습니다.[a]
  to: 그리고 성소에는 몇 사람의 남자들만 남아 있었으나, 기근이 그들을 압도했기 때문에 그들도 각자 자기 곳으로 흩어졌습니다.[a]
  rationale: ‘성소’와 ‘남자들’은 각각 성전 공간과 남성 지시를 유지합니다. 인과절은 자연스러운 현대 한국어로 조정했으며, ‘그들도’는 원문의 이어지는 καί를 문맥상 자연스럽게 반영합니다. ‘각자 자기 곳’은 ἕκαστος와 τόπος의 분배적이고 비특정적인 의미를 보존합니다.
