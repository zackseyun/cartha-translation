base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/031.yaml
  text: And they came through Idumea and encamped against Bethsura[a], and they fought for many days, and they made siege engines; but they came out and burned them with fire[b], and fought bravely.
  footnotes:
  - marker: a
    text: Greek has a singular verb, 'came out,' after plural verbs; the sense is likely collective, referring to the defenders of Bethsura coming out in a sortie.
    reason: textual_variant
  - marker: b
    text: Or 'fought valiantly'; the Greek adverb literally means 'in a manly way.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 이두마이를 지나 베스수라 맞은편에 진을 치고 여러 날 동안 싸웠으며, 공성 장비들을 만들었습니다. 그런데 그들이 나와서 그것들을 불로 태워 버리고[a], 용감하게 싸웠습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 복수 동사 열거 뒤에 단수 동사 ‘나갔다’를 사용합니다. 문맥상 베스수라의 수비대 전체가 출격한 것으로 이해하는 것이 자연스럽습니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘용맹하게’라고 옮길 수 있습니다. 그리스어 부사는 문자적으로는 ‘남자답게’라는 뜻을 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τῆς Ἰδουμαίας
  english_pob_choice: through Idumea
  chosen_korean: 이두마이를 지나
  alternatives_korean:
  - 이두마이 지역을 지나
  - 이두마이를 통과하여
  lexicon: LSJ
  rationale: διά + 속격의 이동 의미를 살려 ‘지나’로 옮겼고, Ἰδουμαία는 관용적 음역인 ‘이두마이’로 처리했습니다.
- source_word: παρενεβάλοσαν ἐπὶ Βεθσουρᾷ
  english_pob_choice: encamped against Bethsura
  chosen_korean: 베스수라 맞은편에 진을 치고
  alternatives_korean:
  - 베스수라에 진을 치고
  - 베스수라를 향해 진을 치고
  lexicon: LSJ
  rationale: 군사적 문맥의 ἐπί + 여격은 단순한 위치보다 적대적 대치를 나타내므로, ‘맞은편에 진을 치고’로 압박의 뉘앙스를 살렸습니다.
- source_word: μηχανὰς
  english_pob_choice: siege engines
  chosen_korean: 공성 장비들
  alternatives_korean:
  - 공성 기계들
  - 포위 무기들
  lexicon: LSJ
  rationale: 고대 군사 문맥의 μηχαναί는 일반적 ‘기계’가 아니라 공성전 장비를 가리키므로, 현대 한국어에서 이해 가능한 ‘공성 장비들’로 옮겼습니다.
- source_word: ἀνδρωδῶς
  english_pob_choice: bravely
  chosen_korean: 용감하게
  alternatives_korean:
  - 남자답게
  - 담대하게
  - 용맹하게
  lexicon: LSJ
  rationale: 직역하면 ‘남자답게’이지만 현대어에서는 오해를 낳기 쉬워, 찬양의 힘을 유지하는 ‘용감하게’로 옮겼습니다.
