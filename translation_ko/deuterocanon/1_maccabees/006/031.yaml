  lexicon: LSJ
  rationale: διά + 속격의 이동 의미를 살려 ‘지나’로 옮겼고, Ἰδουμαία는 관용적 음역인 ‘이두마이’로 처리했습니다.
- source_word: παρενεβάλοσαν ἐπὶ Βεθσουρᾷ
  english_pob_choice: encamped against Bethsura
  chosen_korean: 베스수라 맞은편에 진을 치고
