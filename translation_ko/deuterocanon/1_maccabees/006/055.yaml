  text: And Lysias heard that Philip[a], whom King Antiochus had appointed while he was still alive to bring up Antiochus his son so that he might reign,
  footnotes:
  - marker: a
    text: Or, 'so that he might become king.' The Greek infinitive βασιλεῦσαι can be rendered either as 'reign' or more explicitly as accession to kingship.
