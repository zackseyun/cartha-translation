  source_fidelity: 원문은 리스아스가 필립에 관한 소식을 들었다는 내용입니다. 필립은 안티오쿠스 왕이 생전에 임명한 사람이며, 그 임명의 목적은 왕의 아들 안티오쿠스를 장차 왕이 되도록 양육하게 하는 것이었습니다. 초안의 ‘그를 통치하게 하도록’은 아들을 ‘통치하게 만드는’ 필립의 역할을 다소 과도하게 드러내고, βασιλεῦσαι의 왕위 계승/왕권 행사 사이의 범위를 충분히 보존하지 못합니다.
  naturalness: 초안은 ‘필립이란 사람이 … 임명받았다’라는 구성에서 누가 임명했는지와 누가 임명받았는지가 순간적으로 불분명할 수 있습니다. 왕을 명시적 주어로 하고 필립을 목적어로 두면 현대 한국어 문장으로 더 자연스럽고 명료합니다.
