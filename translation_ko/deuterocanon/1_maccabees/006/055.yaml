translation:
  language: ko
  text: 리스아스는 필립이란 사람이 안티오쿠스 왕이 아직 살아 있을 때 그의 아들 안티오쿠스를 양육하여 그를 통치하게 하도록 임명받았다는 소식을 들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἤκουσεν은 단순히 ‘들었다’는 뜻일 수도 있지만, 여기서는 전달된 소식을 접했다는 의미로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  english_pob_choice: heard
  chosen_korean: 소식을 들었습니다
  alternatives_korean:
  - 들었습니다
  - 알게 되었습니다
  - 전해 들었습니다
  lexicon: LSJ
  rationale: 보고된 사실을 받아들이는 동사로는 단순한 ‘들었습니다’가 가장 직접적이지만, 문맥상 전달된 소식을 받았다는 뉘앙스를 살려 ‘소식을 들었습니다’로 옮겼습니다.
- source_word: κατέστησεν
  english_pob_choice: had appointed
  chosen_korean: 임명받았다는
  alternatives_korean:
  - 임명했다는
  - 지정받았다는
  - 세웠다는
  lexicon: LSJ
  rationale: 이 동사는 공식적인 직무 부여를 가리키므로, 한국어에서는 ‘임명’이 가장 자연스럽고 소스의 행정적 성격을 잘 드러냅니다.
- source_word: ἔτι ζῶντος αὐτοῦ
  english_pob_choice: while he was still alive
  chosen_korean: 아직 살아 있을 때
  alternatives_korean:
  - 아직 생존해 있을 때
  - 그가 아직 살아 있는 동안
  - 그의 생전에는
  lexicon: LSJ
  rationale: 부사적 분사구의 시간 관계를 현대 한국어로 간결하게 재현하되, 임명 시점이 왕의 생전이었음을 분명히 했습니다.
- source_word: ἐκθρέψαι
  english_pob_choice: to bring up
  chosen_korean: 양육하여
  alternatives_korean:
  - 키워서
  - 기르도록
  - 양육하도록
  lexicon: LSJ
  rationale: 단순한 생물학적 ‘키움’보다 후견·보호를 포함하는 뜻이 있어, 문어체로는 ‘양육하다’가 가장 가까우며 목적 용법에 맞게 연결했습니다.
- source_word: εἰς τὸ βασιλεῦσαι αὐτόν
  english_pob_choice: so that he might reign
  chosen_korean: 그를 통치하게 하도록
  alternatives_korean:
  - 그가 다스리게 하도록
  - 그가 왕위에 오르게 하도록
  - 그가 즉위하게 하도록
  lexicon: LSJ
  rationale: βασιλεῦσαι는 단순한 ‘왕이 되다’보다 왕권 행사를 가리킬 수 있어, ‘통치하다’로 옮기되 목적절의 구조를 유지했습니다.
theological_decisions:
- issue: 왕권 관련 βασιλεῦσαι의 의미 범위
  chosen_reading: ‘통치하게 하도록’으로 번역해, 단순한 즉위 사건보다 왕권의 행사까지 포함할 수 있게 했습니다.
  alternative_readings:
  - ‘왕이 되게 하도록’
  - ‘즉위하게 하도록’
  rationale: 본문은 안티오쿠스의 아들을 양육한 목적을 말하며, 헬라어 부정사 βασιλεῦσαι는 왕이 되는 사건과 왕으로 다스리는 상태를 모두 함축할 수 있습니다.
  doctrine_reference: 역사 서술의 문맥상 왕권의 성격을 과장 없이 드러내는 번역 원칙
