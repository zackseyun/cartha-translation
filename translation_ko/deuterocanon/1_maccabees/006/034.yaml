  text: 그리고 그들은 전쟁에 나서게 하려고 포도와 뽕나무 열매의 피를 코끼리들에게 보여 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘포도와 뽕나무 열매의 피’입니다. 여기서 ‘피’는 붉은 즙을 생생하게 표현하는 비유입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδειξαν
  english_pob_choice: they showed
  chosen_korean: 보여 주었습니다
  alternatives_korean:
  - 보였습니다
  - 드러냈습니다
  lexicon: LSJ
  rationale: 단순한 과거 서술 동사로, 코끼리에게 무언가를 '보여 주다'라는 자연스러운 한국어가 원문의 행위를 가장 직접적으로 옮깁니다.
- source_word: τοῖς ἐλέφασιν
  english_pob_choice: the elephants
  chosen_korean: 코끼리들에게
  alternatives_korean:
  - 코끼리들 앞에
  - 코끼리에게
  lexicon: LSJ
  rationale: 여격 복수를 한국어의 간접목적어로 옮겨, 행위의 대상이 코끼리들임을 분명히 했습니다.
- source_word: αἷμα σταφυλῆς καὶ μόρων
  english_pob_choice: the blood of grapes and mulberries
  chosen_korean: 포도와 뽕나무 열매의 피
  alternatives_korean:
  - 포도와 뽕나무 열매의 붉은 즙
  - 포도와 뽕나무 열매의 피
  lexicon: LSJ
  rationale: 원문의 비유적 표현인 '피'를 유지해 붉은 즙의 강렬한 이미지를 살렸고, μόρων은 문맥상 뽕나무 열매로 옮겼습니다.
- source_word: τοῦ παραστῆσαι
  english_pob_choice: to provoke
  chosen_korean: 전쟁에 나서게 하려고
  alternatives_korean:
  - 자극하려고
  - 격분하게 하려고
  - 전투에 나서게 하려고
  lexicon: LSJ
  rationale: 목적을 나타내는 부정정사 구조를 한국어의 '-하려고'로 풀어, 코끼리들을 싸움에 내몰려는 의도를 자연스럽게 드러냈습니다.
