base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/057.yaml
  text: And they kept urging and pressing to depart[a]. And he said to the king and the leaders of the army and the men, “We are growing weaker day by day, and our food is scant, and the place where we are encamped is strong[b], and the affairs of the kingdom are pressing upon us.”
  footnotes:
  - marker: a
    text: Or “We are giving out day by day”; the Greek verb can denote failing, dwindling, or being exhausted.
    reason: lexical_alternative
  - marker: b
    text: Or “the kingdom’s business is pressing upon us.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 떠나자고 계속 재촉하고 강력히 요구하였습니다. 그가 왕과 군대의 지휘관들과 사람들에게 말하였습니다. 「우리는 날마다 쇠해 가고 있고[a], 우리의 양식은 적으며, 우리가 진을 친 곳은 견고하고, 왕국의 일들[b]이 우리를 압박하고 있습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리는 날마다 쇠약해지고 있습니다.” 그리스어 동사는 기력이나 자원이 줄어들며 소진되는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “왕국의 일이 우리를 압박하고 있습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέσπευδον καὶ ἐπενύοντο
  english_pob_choice: kept urging and pressing
  chosen_korean: 계속 재촉하였습니다
  alternatives_korean:
  - 계속 재촉하며 몰아붙였습니다
  - 간절히 떠나자고 재촉하였습니다
  lexicon: LSJ
  rationale: 두 미완료 동사는 반복적·지속적 압박을 나타내므로, 한국어에서는 한 번의 행동이 아니라 계속된 재촉을 자연스럽게 살렸습니다.
- source_word: τοῦ ἀπελθεῖν
  english_pob_choice: to depart
  chosen_korean: 떠나려
  alternatives_korean:
  - 떠나기 위해
  - 가려고
  lexicon: BDAG
  rationale: 군사적 철수 맥락이므로 단순한 ‘가다’보다 ‘떠나다’가 원문의 방향성을 더 잘 드러냅니다.
- source_word: Ἐκλείπομεν καθʼ ἡμέραν
  english_pob_choice: We are growing weaker day by day
  chosen_korean: 우리는 날마다 쇠해 가고 있고
  alternatives_korean:
  - 우리는 날마다 지쳐 가고 있고
  - 우리는 날마다 약해지고 있고
  lexicon: LSJ
  rationale: ἐκλείπομεν은 단순한 수적 감소보다 기력·자원의 소진까지 아우를 수 있어, ‘쇠해 가다’로 폭넓게 옮겼습니다.
- source_word: ὀχυρός
  english_pob_choice: strong
  chosen_korean: 강하고
  alternatives_korean:
  - 견고하고
  - 요새화되어 있고
  lexicon: LSJ
  rationale: 장소의 방어적 강건함을 말하므로, 한국어에서는 짧고 직접적인 ‘강하다’를 택해 군사적 뉘앙스를 살렸습니다.
theological_decisions:
- issue: τὰ τῆς βασιλείας의 범위
  chosen_reading: ‘왕국의 일들’로 직역하기보다, 문맥상 국가 운영과 전쟁 준비를 포함하는 ‘왕국의 일들’/‘왕국의 일들이 우리를 압박하고 있습니다’로 옮겼습니다.
  alternative_readings:
  - 왕국의 일
  - 왕국의 업무
  - 국정
  rationale: 본문은 군대·왕·지휘관이 등장하는 정치-군사적 상황이므로, 추상적 ‘업무’보다는 왕국에 관한 긴급한 사안이라는 압박감을 살려야 합니다.
  doctrine_reference: 문맥적 의미 결정
