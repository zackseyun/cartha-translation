  yaml_path: translation/deuterocanon/1_maccabees/006/050.yaml
  text: And the king captured Bethsura[b][a], and he stationed a garrison there to guard it.
  footnotes:
  - marker: a
    text: Or 'took Bethsura' or 'seized Bethsura.' The Greek verb can be rendered more generally as taking possession of the city.
    reason: lexical_alternative
  - marker: b
    text: Or 'posted a guard there' or 'appointed a garrison there.' The Greek emphasizes assigning a military force to hold the place.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕은 베스추라를 점령하고, 그곳을 지킬 수비대를 두었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘베스추라를 차지하고’ 혹은 ‘베스추라를 탈취하고’로 옮길 수 있습니다. 그리스어 동사는 그곳을 차지하거나 점유하는 더 넓은 뜻을 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그곳에 수비대를 배치했습니다’나 ‘그곳에 경비대를 주둔시켰습니다’로 옮길 수 있습니다. 그리스어는 그곳을 지키도록 군대를 맡겨 두는 뜻을 분명히 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατελάβετο
  english_pob_choice: captured
  chosen_korean: 점령하고
  alternatives_korean:
  - 함락시키고
  - 탈취하고
  - 차지하고
  lexicon: LSJ
  rationale: 군사적 맥락에서 성채 도시를 자기 수중에 두는 뜻이므로, 단순히 ‘잡다’보다 ‘점령하다’가 소스의 의미를 자연스럽게 드러냅니다.
- source_word: ὁ βασιλεύς
  english_pob_choice: the king
  chosen_korean: 왕은
  alternatives_korean:
  - 임금은
  - 그 왕은
  lexicon: LSJ
  rationale: 고유명사가 아닌 통치 호칭이므로, 직역에 가깝고 현대 한국어에서 자연스러운 ‘왕’으로 옮겼습니다.
- source_word: τὴν Βεθσούραν
  english_pob_choice: Bethsura
  chosen_korean: 베스추라
  alternatives_korean:
  - 벳수라
  - 베드수라
  lexicon: project proper-noun policy
  rationale: 그리스어 형태 Βεθσούρα를 따르는 음역을 사용해 히브리어 지명형으로 맞추지 않았습니다.
- source_word: ἐπέταξεν ... φρουρὰν τηρεῖν
  english_pob_choice: he stationed a garrison there to guard it
  chosen_korean: 그곳을 지킬 수비대를 두었습니다
  alternatives_korean:
  - 그곳에 수비대를 주둔시켰습니다
  - 그곳을 지키도록 경비대를 배치했습니다
  lexicon: LSJ
  rationale: ἐπέταξεν과 φρουράν, τηρεῖν의 결합은 단순 명령보다 ‘수비대를 두다/배치하다’의 군사적 배치를 뜻하므로, 간결하게 ‘수비대를 두었습니다’로 처리했습니다.
