  text: And the king captured Bethsura[b][a], and he stationed a garrison there to guard it.
  footnotes:
  - marker: a
    text: Or 'took Bethsura' or 'seized Bethsura.' The Greek verb can be rendered more generally as taking possession of the city.
    reason: lexical_alternative
  - marker: b
    text: Or 'posted a guard there' or 'appointed a garrison there.' The Greek emphasizes assigning a military force to hold the place.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕은 베스추라를 점령하고, 그곳을 지킬 수비대를 두었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘베스추라를 차지하고’ 혹은 ‘베스추라를 탈취하고’로 옮길 수 있습니다. 그리스어 동사는 이 성을 점유하는 뜻을 더 넓게 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그곳에 수비대를 배치했습니다’나 ‘그곳에 경비대를 주둔시켰습니다’로 옮길 수 있습니다. 그리스어는 그곳을 지키도록 군대를 맡겨 두는 뜻을 분명히 합니다.
    reason: lexical_alternative
