  text: And it happened that when the king heard these words[a], he was astonished and greatly shaken; and he fell upon his bed and became sick from grief, because it had not happened for him as he had planned.
  footnotes:
  - marker: a
    text: Or, 'it had not turned out for him as he had intended.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 이 말들을 들었을 때, 그는 깜짝 놀라고 크게 동요되었으며, 침상에 쓰러져 슬픔 때문에 병들었습니다. 이는 그가 계획한 대로 그에게 일이 일어나지 않았기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그가 의도한 대로 그에게 일이 일어나지 않았기 때문입니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ὡς ἤκουσεν
  english_pob_choice: it happened that when he heard
  chosen_korean: ~했을 때
  alternatives_korean:
  - 그가 들었을 때
  - 그가 듣자
  lexicon: BDAG
  rationale: 서사 전환을 자연스럽게 살리면서도, 그리스어의 사건 전개를 과도하게 풀지 않도록 간결하게 옮겼습니다.
- source_word: ἐθαμβήθη
  english_pob_choice: he was astonished
  chosen_korean: 깜짝 놀라고
  alternatives_korean:
  - 놀라고
  - 경악하고
  lexicon: BDAG
  rationale: 문맥상 충격과 놀람을 함께 담아야 하므로, 한국어의 자연스러운 반응 표현으로 처리했습니다.
- source_word: ἐσαλεύθη σφόδρα
  english_pob_choice: greatly shaken
  chosen_korean: 크게 동요되었으며
  alternatives_korean:
  - 몹시 흔들리며
  - 심하게 흔들리며
  lexicon: BDAG
  rationale: σαλεύω의 내적 동요 이미지를 반영해, 단순한 감정 변화보다 더 강한 흔들림을 드러냈습니다.
- source_word: ἔπεσεν ἐπὶ τὴν κοίτην
  english_pob_choice: he fell upon his bed
  chosen_korean: 침상에 쓰러져
  alternatives_korean:
  - 침대에 엎드려
  - 침상에 누워
  lexicon: LSJ
  rationale: ‘bed’를 문자적으로 유지하되, 충격으로 주저앉는 흐름을 살리기 위해 ‘쓰러져’를 택했습니다.
- source_word: ἐνέπεσεν εἰς ἀρρωστίαν ἀπὸ τῆς λύπης
  english_pob_choice: became sick from grief
  chosen_korean: 슬픔 때문에 병들었습니다
  alternatives_korean:
  - 슬픔으로 병이 났습니다
  - 근심 때문에 앓게 되었습니다
  lexicon: BDAG
  rationale: ἀπό의 원인 관계를 한국어의 ‘~때문에’로 자연스럽게 옮겼고, ἀρρωστία는 상태의 발생을 드러내는 ‘병들다’로 표현했습니다.
- source_word: καθὼς ἐνεθυμεῖτο
  english_pob_choice: as he had planned
  chosen_korean: 그가 계획한 대로
  alternatives_korean:
  - 그가 의도한 대로
  - 그가 생각한 대로
  lexicon: BDAG
  rationale: ἐνθυμέομαι의 의도/계획 의미를 문맥에 맞게 ‘계획하다’로 풀어, 왕의 기대가 좌절되었음을 분명히 했습니다.
