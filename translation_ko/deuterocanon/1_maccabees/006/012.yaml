  text: 그러나 이제 나는 예루살렘에서 내가 저지른 악행들을 기억합니다. 나는 그곳에 있던 모든 은 기물과 금 기물을 가져갔고, 유다 주민들을 아무 이유 없이[a] 멸하려고 명령을 보냈습니다.
  philosophy: optimal-equivalence
  footnotes:
