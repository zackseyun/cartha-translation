translation:
  language: ko
  text: 그러나 이제 나는 예루살렘에서 내가 저지른 악들을 기억합니다. 나는 그 안에 있던 은그릇들과 금그릇들을 모두 가져갔고, 유다 주민들을 아무 이유 없이 없애려고 명령을 보냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아무 이유 없이’는 διὰ κενῆς의 직역적 의미를 풀어쓴 것이며, ‘근거 없이’ 또는 ‘헛되이’로도 옮길 수 있습니다.
    reason: lexical_alternative
