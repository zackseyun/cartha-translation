  yaml_path: translation/deuterocanon/1_maccabees/006/033.yaml
  text: And the king rose early in the morning and moved the camp out in full force on the road to Beth-zachariah[a], and the forces drew up for battle[b], and they sounded the trumpets.
  footnotes:
  - marker: a
    text: Or 'by the way of Beth-zachariah.' The Greek expression can denote movement along the route leading there.
    reason: lexical_alternative
  - marker: b
    text: Or 'with its full rush/impetus.' The phrase translated 'in full force' reflects the Greek word for onset or momentum in a military movement.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 왕은 아침 일찍 일어나서 군영을 거센 기세로[b] 베트자카리아로 가는 길을 따라[a] 이동시켰고, 군대는 전투를 위해 진을 갖추었으며, 나팔을 불었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘베트자카리아의 길을 따라’라고 할 수 있습니다. 이 그리스어 표현은 그곳으로 이어지는 경로를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 기세로/돌진하는 힘으로’라고 할 수 있습니다. 여기서는 군사적 진격의 추진력이나 탄력을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤρθρισεν
  english_pob_choice: rose early
  chosen_korean: 아침 일찍 일어나
  alternatives_korean:
  - 동틀 무렵 일어나
  - 이른 새벽에 일어나
  lexicon: LSJ
  rationale: 동사의 핵심인 이른 시간의 기상을 자연스러운 한국어로 살리되, 과도하게 ‘출정’으로 좁히지 않았습니다.
- source_word: ἀπῆρεν τὴν παρεμβολήν
  english_pob_choice: moved the camp out
  chosen_korean: 군영을 ... 옮겼고
  alternatives_korean:
  - 진영을 걷고 나아갔고
  - 군대를 출발시켰고
  lexicon: LSJ
  rationale: παρεμβολή는 ‘캠프/진영’의 이동을 뜻하므로, ‘군영’으로 옮겨 군사적 맥락을 드러냈습니다.
- source_word: ἐν ὁρμήματι αὐτῆς
  english_pob_choice: in full force
  chosen_korean: 그 기세 그대로
  alternatives_korean:
  - 온 힘으로
  - 전력으로
  - 거센 기세로
  lexicon: LSJ
  rationale: 문맥상 전진의 ‘기세/충동’을 나타내므로, 단순한 힘의 양보다 돌진하는 추진력을 드러내는 표현을 택했습니다.
- source_word: διετάξαντο αἱ δυνάμεις εἰς τὸν πόλεμον
  english_pob_choice: the forces drew up for battle
  chosen_korean: 군대는 전투를 위해 진을 갖추었으며
  alternatives_korean:
  - 군대는 전투 대형을 갖추었으며
  - 군대는 싸움을 위해 배치되었으며
  lexicon: LSJ
  rationale: διατάσσω는 군사적으로 ‘진을 배열하다/대형을 갖추다’의 뜻이므로, 전투 준비의 질서를 살렸습니다.
- source_word: ἐσάλπισαν ταῖς σάλπιγξιν
  english_pob_choice: they sounded the trumpets
  chosen_korean: 나팔을 불었습니다
  alternatives_korean:
  - 나팔을 불었고
  - 트럼펫을 울렸습니다
  lexicon: LSJ
  rationale: 관용적으로는 ‘나팔을 불다’가 가장 자연스럽고, 군사 신호의 기능도 분명하게 전달합니다.
theological_decisions:
- issue: 전투 묘사의 군사적 긴장과 행위의 연속성
  chosen_reading: 원문의 연속 동작을 그대로 살려, 왕의 이동—군대의 대형 정비—나팔 신호가 긴박하게 이어지는 장면으로 제시했습니다.
  alternative_readings:
  - 문장을 더 매끈하게 의역하여 전투 준비 상황으로만 요약할 수 있음
  rationale: 이 절은 신학적 해석보다 역사 서술의 현장성이 핵심이므로, 원문의 속도감과 군사적 긴장을 보존하는 것이 중요합니다.
  doctrine_reference: 서술 본문 보존 원칙
- issue: κατὰ τὴν ὁδὸν Βεθζαχαριά의 방향/경로 의미
  chosen_reading: ‘베트자카리아로 가는 길로’로 옮겨, 단순한 위치가 아니라 그곳을 향한 이동 경로를 드러냈습니다.
  alternative_readings:
  - ‘베트자카리아의 길에서’처럼 더 직역할 수 있음
  rationale: 영어 POB 주석이 지적하듯 이 표현은 목적지 자체보다 그곳으로 이어지는 경로를 뜻할 수 있으므로, 한국어에서도 이동 방향을 분명히 했습니다.
  doctrine_reference: 주해적 방향성 반영
