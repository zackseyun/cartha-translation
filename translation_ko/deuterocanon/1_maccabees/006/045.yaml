  - 대담하게
  - 과감하게
  lexicon: LSJ
  rationale: 행동의 태도를 나타내는 부사로, 전투 서술의 긴박감과 용기를 함께 살리기 위해 ‘담대하게’를 택했습니다.
- source_word: εἰς μέσον τῆς φάλαγγος
  english_pob_choice: into the middle of the phalanx
  chosen_korean: 팔랑크스의 한가운데로
  alternatives_korean:
  - 전열의 한가운데로
  - 방진의 중앙으로
  - 대형의 중심으로
  lexicon: LSJ
  rationale: φάλαγξ는 단순한 ‘전투’가 아니라 정렬된 군사 대형을 가리키므로, 고유한 군사 이미지를 살려 ‘팔랑크스’로 음역하고 위치는 ‘한가운데로’로 옮겼습니다.
- source_word: ἔνθα καὶ ἔνθα
  english_pob_choice: on both sides
  chosen_korean: 이리저리
  alternatives_korean:
  - 양쪽으로
  - 이쪽저쪽으로
  - 좌우로
  lexicon: LSJ
  rationale: 문맥상 좌우로 갈라지는 움직임을 뜻하므로, 단순한 방향 나열보다 분할의 동적인 결과를 살리는 ‘이리저리’가 적절합니다.
