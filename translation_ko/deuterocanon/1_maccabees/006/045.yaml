translation:
  language: ko
  text: 그리고 그는 담대하게 팔랑크스의 한가운데로 돌진하여 오른쪽과 왼쪽에서 죽였으며, 그 앞에서 그 대열은 이리저리 갈라졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘팔랑크스’는 헬라식 밀집 보병 대형을 가리킵니다.
