  yaml_path: translation/deuterocanon/1_maccabees/006/053.yaml
  text: But there was no food in the holy place[a], because it was the seventh year[b], and those who had escaped into Judea from the nations had eaten up the remnant of the supplies.
  footnotes:
  - marker: a
    text: That is, the seventh-year sabbatical year, when agricultural production was restricted; this explains the shortage of food.
    reason: cultural_note
  - marker: b
    text: Or 'from the Gentiles.' The Greek says 'from the nations.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 거룩한 곳에는 먹을 것이 없었으니, 그것은 일곱째 해였기 때문입니다. 또 민족들 가운데서 유다로 피한 이들이 남은 저장품까지 먹어 치웠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 안식년입니다. 이 해에는 농업 생산이 제한되어 식량이 부족해졌습니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘민족들로부터’. 그리스어는 ‘민족들 가운데서’라고 되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: βρώματα
  english_pob_choice: food
  chosen_korean: 먹을 것
  alternatives_korean:
  - 양식
  - 음식
  - 식량
  lexicon: LSJ
  rationale: 군사적·사태 설명 문맥에서 βρώματα는 단순한 ‘음식’보다 넓게 ‘먹을 것’으로 옮기면, 성소 내 공급 부족이라는 사실을 자연스럽게 드러냅니다.
- source_word: ἐν τοῖς ἁγίοις
  english_pob_choice: in the holy place
  chosen_korean: 거룩한 곳에
  alternatives_korean:
  - 성소에
  - 거룩한 장소에
  - 성스럽은 곳에
  lexicon: LSJ
  rationale: 복수 중성 표현을 한국어에서는 단수 장소 표현으로 자연스럽게 풀되, 성전 구역을 가리키는 신성한 공간이라는 점을 살려 ‘거룩한 곳’으로 옮겼습니다.
- source_word: ἀπὸ τῶν ἐθνῶν
  english_pob_choice: from the nations
  chosen_korean: 민족들 가운데서
  alternatives_korean:
  - 나라들로부터
  - 이방인들 가운데서
  - 민족들로부터
  lexicon: LSJ
  rationale: 이 표현은 유대 역사 문맥의 비유대 집단을 뜻하므로, POB의 ‘the nations’에 맞춰 ‘민족들 가운데서’로 옮겨 유대-헬라식 관용을 유지했습니다.
- source_word: τὸ ὑπόλιμμα τῆς παραθέσεως
  english_pob_choice: the remnant of the supplies
  chosen_korean: 남은 저장품
  alternatives_korean:
  - 남은 비축품
  - 남은 저장 식량
  - 남은 공급품
  lexicon: LSJ
  rationale: τῆς παραθέσεως는 이 문맥에서 ‘set aside/stored provisions’의 뜻이므로, 남아 있던 비축 물자를 자연스럽게 드러내는 ‘저장품’으로 옮겼습니다.
theological_decisions:
- issue: ‘일곱째 해’의 역사적 배경을 본문에 명시할지 여부
  chosen_reading: 본문에는 ‘일곱째 해’만 두고, 절기 해석은 주석에 맡깁니다.
  alternative_readings:
  - 안식년이었기 때문에
  - 농업이 제한되는 안식년이었기 때문에
  rationale: 원문은 해석어를 덧붙이지 않고 단순히 ‘일곱째 해’라고 말하므로, 본문은 원문 수준을 유지하고 역사적 의미는 본문 밖에서 설명하는 편이 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §3
