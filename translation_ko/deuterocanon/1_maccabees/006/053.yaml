  source_fidelity: 그리스어의 ἐν τοῖς ἁγίοις는 문맥상 성전의 거룩한 구역을 가리키므로 ‘성소’가 더 분명하고 자연스럽습니다. ἀπὸ τῶν ἐθνῶν은 ‘민족들로부터’이며, 초안의 ‘민족들 가운데서’는 전치사의 방향성을 바꿉니다. ‘남은 저장품까지’의 ‘까지’는 원문에 없는 첨가이므로 삭제하는 것이 좋습니다.
