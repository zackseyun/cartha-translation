  yaml_path: translation/deuterocanon/1_maccabees/006/053.yaml
  text: But there was no food in the holy place[a], because it was the seventh year[b], and those who had escaped into Judea from the nations had eaten up the remnant of the supplies.
  footnotes:
  - marker: a
    text: That is, the seventh-year sabbatical year, when agricultural production was restricted; this explains the shortage of food.
    reason: cultural_note
  - marker: b
    text: Or 'from the Gentiles.' The Greek says 'from the nations.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 성소에는 먹을 것이 없었습니다. 이는 일곱째 해[a]였기 때문입니다. 또 민족들로부터[b] 유다로 피신해 온 이들이 남아 있던 비축 식량을 모두 먹어 버렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 안식년입니다. 이 해에는 농업 생산이 제한되어 식량이 부족해졌습니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘이방 민족들로부터’. 그리스어는 문자적으로 ‘민족들로부터’라고 되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: βρώματα
  english_pob_choice: food
  chosen_korean: 먹을 것
  alternatives_korean:
  - 양식
  - 음식
  - 식량
  lexicon: LSJ
  rationale: 군사적·사태 설명 문맥에서 βρώματα는 단순한 ‘음식’보다 넓게 ‘먹을 것’으로 옮기면, 성소 내 공급 부족이라는 사실을 자연스럽게 드러냅니다.
- source_word: ἐν τοῖς ἁγίοις
  english_pob_choice: in the holy place
  chosen_korean: 거룩한 곳에
  alternatives_korean:
  - 성소에
