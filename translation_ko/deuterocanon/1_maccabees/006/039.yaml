  text: And when the sun flashed on the golden shields, the mountains flashed from them and shone like torches of fire.
translation:
  language: ko
  text: 그런데 해가 황금 방패들 위에 번쩍이자, 산들은 그 빛을 받아 번쩍였고 불타는 횃불처럼 빛을 냈습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔστιλβεν
  english_pob_choice: flashed / shone
  chosen_korean: 번쩍이다
  alternatives_korean:
  - 빛나다
  - 반짝이다
  - 비치다
  lexicon: LSJ
  rationale: 금속에 닿은 햇빛의 순간적이고 눈부신 반사라는 뉘앙스를 살리기 위해, 단순한 지속 상태보다 순간적인 섬광을 드러내는 ‘번쩍이다’를 택했습니다.
- source_word: χρυσᾶς ἀσπίδας
  english_pob_choice: golden shields
  chosen_korean: 금방패들
  alternatives_korean:
  - 황금 방패들
  - 금빛 방패들
  - 황금으로 된 방패들
  lexicon: LSJ
  rationale: ‘golden’의 시각적 성격을 살리면서도 한국어에서 자연스럽게 압축하기 위해 ‘금방패들’로 옮겼습니다. 이는 실제 재질 단정 없이 황금빛의 방패라는 뜻을 유지합니다.
- source_word: τὰ ὄρη ἀπʼ αὐτῶν
  english_pob_choice: the mountains flashed from them
  chosen_korean: 산들도 그들로부터 번쩍이며
  alternatives_korean:
  - 산들도 그 빛을 받아
  - 산들도 그들 때문에 번쩍이며
  - 산들도 그 반사광으로 번쩍이며
  lexicon: LSJ
  rationale: 산이 방패들에서 반사된 빛을 받는다는 원문의 관계를 드러내기 위해 ‘그들로부터’를 유지했습니다. ‘산들도’는 문맥상 대조를 살린 주어 반복입니다.
- source_word: ὡς λαμπάδες πυρός
  english_pob_choice: like torches of fire
  chosen_korean: 불의 횃불처럼
  alternatives_korean:
  - 불꽃 횃불처럼
  - 불타는 횃불처럼
  - 화염의 횃불처럼
  lexicon: LSJ
  rationale: 직유를 보존하면서도 현대 한국어에서 자연스럽게 읽히도록 ‘불의 횃불처럼’으로 옮겼습니다. ‘횃불’은 원문의 ὡς λαμπάδες에 직접 대응합니다.
