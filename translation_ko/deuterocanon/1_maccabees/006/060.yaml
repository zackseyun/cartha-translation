base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/060.yaml
  text: And the proposal pleased the king and the rulers[a], and he sent to them to make peace[c][b], and they accepted.
  footnotes:
  - marker: a
    text: Or 'the word' or 'the matter pleased the king and the rulers.' The Greek λόγος can denote the spoken proposal or matter under discussion.
    reason: lexical_alternative
  - marker: b
    text: Literally 'he sent to them to make peace.' The Greek does not explicitly state whether he sent messengers or a message.
    reason: lexical_alternative
  - marker: c
    text: That is, they accepted the peace proposal or terms.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 제안은 왕과 통치자들의 마음에 들었고, 그는 그들에게 화평을 맺자고 보냈으며, 그들은 받아들였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρεσεν
  english_pob_choice: pleased
  chosen_korean: 마음에 들었고
  alternatives_korean:
  - 기쁘게 했고
  - 승인되었고
  - 호의적이었고
  lexicon: LSJ
  rationale: ἤρεσεν은 여기서 제안이 왕과 권력자들에게 받아들여질 만하다는 뜻이므로, 자연스러운 현대 한국어로는 ‘마음에 들다’가 승인·호감의 뉘앙스를 가장 무리 없이 살립니다.
- source_word: ὁ λόγος
  english_pob_choice: the proposal
  chosen_korean: 그 제안
  alternatives_korean:
  - 그 말
  - 그 일
  - 그 말씀
  lexicon: LSJ
  rationale: λόγος는 이 외교적 문맥에서 단순한 ‘말’보다 앞선 협상 내용 자체를 가리키므로, 영어 POB의 판단을 따라 ‘제안’으로 옮기는 것이 가장 분명합니다.
- source_word: ἀρχόντων
  english_pob_choice: the rulers
  chosen_korean: 통치자들
  alternatives_korean:
  - 지도자들
  - 관리들
  - 지배자들
  lexicon: LSJ
  rationale: ἀρχόντες는 왕 주변의 권력자·고위 통치층을 뜻하므로, ‘통치자들’이 지위의 성격을 유지하면서도 과도한 관직 추정을 피합니다.
- source_word: εἰρηνεῦσαι
  english_pob_choice: to make peace
  chosen_korean: 화평을 맺자고
  alternatives_korean:
  - 평화를 이루자고
  - 화해하자고
  - 평화 협정을 맺자고
  lexicon: LSJ
  rationale: 부정사 εἰρηνεῦσαι는 파견의 목적을 나타내며, 여기서는 외교적 화해를 뜻하므로 ‘화평을 맺다’가 간결하고 문맥에 충실합니다.
