translation:
  language: ko
  text: 그들은 죽임을 당하고 있었고, 우리의 상속 재산은 약탈당하고 있었습니다. 그들은 우리에게만 손을 뻗은 것이 아니라, 그들의 모든 영토에도 손을 뻗었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들의 모든 경계” 또는 “그들 주변의 모든 지역들”로 옮길 수 있습니다. 그리스어 ὅρια는 경계선이나 그 경계로 규정된 영역을 가리킬 수 있습니다.
    reason: lexical_alternative
