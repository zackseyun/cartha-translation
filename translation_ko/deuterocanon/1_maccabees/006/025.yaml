review_pass:
  verdict: revise
  source_fidelity: 죽임을 당하다와 약탈당하다의 미완료 수동 진행은 적절히 반영되었습니다. 다만 ‘자기들의 모든 경계에까지’는 ὅρια가 가리킬 수 있는 영역의 뜻을 본문에서 지나치게 좁고 부자연스럽게 만들며, ‘자기들’도 이 문맥에서는 불필요하게 어색합니다. 본문은 영어 POB의 ‘territories’에 맞추어 ‘그들의 모든 영토’로 옮기고, 각주에서 경계선이라는 대안을 보존하는 것이 안전합니다.
  naturalness: ‘그들은 우리에게만이 아니라 자기들의 모든 경계에까지 손을 뻗었습니다’는 병렬과 조사가 다소 어색합니다. ‘우리에게만 손을 뻗은 것이 아니라, 그들의 모든 영토에도 손을 뻗었습니다’는 원문의 손-뻗음 이미지를 유지하면서 현대 표준 한국어로 자연스럽습니다.
  terminology: ‘상속 재산’은 κληρονομίαι의 상속·세습된 소유라는 의미를 ‘유산’보다 분명히 합니다. ‘영토’는 ὅρια의 영역 의미를 자연스럽게 전달하며, 경계선 및 주변 지역이라는 가능한 이해는 각주에 남깁니다.
  issues:
  - severity: medium
    issue: ὅρια를 본문에서 ‘모든 경계’로 옮김
    rationale: ‘경계’만으로는 선 자체로 읽히기 쉽고, ‘경계에까지’는 손을 뻗는 대상이라는 구문에서 한국어로 부자연스럽습니다. ὅρια의 영역/영토 의미를 본문에 반영하되, 어휘적 범위는 각주로 보존해야 합니다.
  - severity: low
    issue: ‘자기들의 모든 경계에까지’의 지시와 병렬
    rationale: αὐτῶν은 ‘그들의’로 충분하며, ‘우리에게만이 아니라 …에까지’보다 ‘우리에게만 손을 뻗은 것이 아니라 …에도 손을 뻗었습니다’가 원문의 대조를 더 분명하고 자연스럽게 나타냅니다.
