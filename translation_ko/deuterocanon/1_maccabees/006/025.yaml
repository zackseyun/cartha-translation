    text: 또는 “모든 경계들”이나 “그들 주변의 모든 지역들”로도 옮길 수 있습니다. 그리스어 ὅρια는 경계선이나 그 경계로 규정된 영역을 가리킬 수 있습니다.
    reason: lexical_alternative
