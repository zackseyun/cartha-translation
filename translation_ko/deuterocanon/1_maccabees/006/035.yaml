translation:
  language: ko
  text: 그리고 그들은 짐승들을 부대들 가운데 나누었으며, 각 코끼리 옆에는 쇠사슬 갑옷을 입은 천 명의 군인을 세우고, 그들의 머리에는 청동 투구를 씌웠으며, 각 짐승에 배치된 선발된 기병 오백 명도 두었습니다.
  philosophy: optimal-equivalence
