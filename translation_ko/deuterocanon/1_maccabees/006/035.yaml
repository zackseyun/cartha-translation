  yaml_path: translation/deuterocanon/1_maccabees/006/035.yaml
  text: And they divided the beasts among the units, and beside each elephant they stationed a thousand men in coats of mail, with bronze helmets on their heads, and five hundred picked horsemen assigned to each beast.
  footnotes:
  - marker: a
    text: Or 'into the divisions/companies.' The Greek phrase εἰς τὰς φάραγγας is contextually difficult; a military sense is likely here.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the beasts'; the context makes clear these are elephants.
    reason: lexical_alternative
  - marker: c
    text: Or 'for each elephant' or 'at each elephant.' The Greek preposition can be understood in more than one way here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 짐승들[b]을 부대들[a] 가운데 나누어 배치하고, 각 코끼리 곁에[c] 사슬 갑옷을 입고 머리에 청동 투구를 쓴 천 명의 군인을 세웠으며, 각 짐승마다 선발된 기병 오백 명을 배치했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문맥상 군사 편제 또는 부대를 가리키는 것으로 보입니다. 또는 ‘분대들’이나 ‘대열들’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘짐승들’입니다. 이 문맥에서는 코끼리를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘각 코끼리 위에’, ‘각 코끼리마다’ 또는 ‘각 코끼리에게’. 그리스어 전치사의 뜻은 여기서 여러 방식으로 이해될 수 있습니다.
    reason: lexical_alternative
