  source_fidelity: 핵심 인과관계와 ‘그들의 법에 따라 살게 하자’는 제안은 잘 반영되었습니다. 다만 στήσωμεν은 단순한 호의의 ‘해 주다’보다 그러한 상태나 권리를 정책적으로 정하는 뜻을 포함하므로 ‘살아갈 수 있도록 해 줍시다’로 문맥상 더 분명하게 옮기는 것이 좋습니다. ὡς τὸ πρότερον은 앞 절에 결합하여 ‘전처럼’으로 처리해야 합니다.
  naturalness: 현행의 ‘전처럼 말입니다.’는 합쇼체 본문에서 부자연스러운 독립 문장이고, 원문의 수식 관계도 끊습니다. 이를 앞 절에 결합하면 현대 한국어 문장으로 자연스럽고 격식에도 맞습니다. ‘그들 자신의’은 집단이 지닌 법을 가리키는 표현으로 ‘자기’보다 명료합니다.
