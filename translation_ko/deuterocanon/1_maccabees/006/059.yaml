  yaml_path: translation/deuterocanon/1_maccabees/006/059.yaml
  text: and let us establish for them to walk according to their own laws[a], as before; for it was because of their laws, which we set aside[b], that they became angry and did all these things.
  footnotes:
  - marker: a
    text: Or 'walk according to their own customs/laws.' The Greek literally says 'go/walk by their laws,' an idiom for ordering life according to them.
    reason: lexical_alternative
  - marker: b
    text: The verb rendered 'abolished' more literally means 'scattered' or 'disrupted'; here it refers to suppressing or dismantling their legal practices.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들이 전처럼 그들 자신의 율법대로 살아갈 수 있도록 해 줍시다[a]. 우리가 그들의 율법을 무너뜨렸기[b] 때문에 그들이 화를 내고 이런 모든 일을 한 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들 자신의 관습이나 법에 따라’. 그리스어는 문자적으로 ‘그들의 법에 따라 가다/걷다’라는 관용적 표현을 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘무너뜨렸기’로 옮긴 동사는 문자적으로는 ‘흩뜨리다’ 또는 ‘흩어 놓다’에 가깝지만, 여기서는 그들의 법적 실천을 억압하거나 해체한 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: στήσωμεν
  english_pob_choice: let us establish
  chosen_korean: 해 줍시다
  alternatives_korean:
  - 설정합시다
  - 세워 줍시다
  - 확립합시다
  lexicon: LSJ
  rationale: 호소형 가정법으로 정책 제안을 말하므로, 한국어에서는 자연스럽게 ‘~하게 해 줍시다’로 옮겨 공동 제안의 뉘앙스를 살렸습니다.
- source_word: τοῦ πορεύεσθαι
  english_pob_choice: that they may walk according to / live by
  chosen_korean: 살 수 있게
  alternatives_korean:
  - 걷도록
  - 따라 살도록
  - 행동하도록
  lexicon: LSJ
  rationale: ‘걷다/가다’의 직역보다 법을 따라 삶의 방식을 정한다는 관용적 뜻이 더 중요하므로, 문맥상 자연한 ‘살 수 있게’로 풀었습니다.
- source_word: τοῖς νομίμοις αὐτῶν
  english_pob_choice: their own laws
  chosen_korean: 자기 율법
  alternatives_korean:
  - 자기 법
  - 자기 관습
  - 자기 규례
  lexicon: LSJ
  rationale: 마카베오 문맥에서 νομίμοις는 유대인의 종교-법적 실천을 가리키므로, 한국어 성경에서 가장 직접적인 ‘율법’을 택했습니다.
- source_word: διεσκεδάσαμεν
  english_pob_choice: we set aside / we abolished
  chosen_korean: 무너뜨렸기
  alternatives_korean:
  - 흩어 놓았기
  - 없앴기
  - 폐지했기
  lexicon: LSJ
  rationale: 원뜻은 ‘흩다/분산시키다’이지만 여기서는 그들의 법적 질서를 억압·해체한 결과를 말하므로, 완전 폐지보다 강도를 덜어 ‘무너뜨리다’로 옮겼습니다.
theological_decisions:
- issue: 법적·종교적 억압이 초래한 분노의 원인 제시
  chosen_reading: 그들의 율법을 무너뜨린 것이 분노의 원인이라는 인과를 분명히 드러내되, 과장 없이 원문의 정치적 논리를 살렸습니다.
  alternative_readings:
  - 그들의 율법을 폐지했기 때문에
  - 그들의 법을 없앴기 때문에
  rationale: 본문은 행위의 원인과 결과를 정책 제안의 논리로 제시하므로, 인과 구조를 분명히 유지하는 것이 중요합니다.
  doctrine_reference: 역사서 문맥의 인과 표현
