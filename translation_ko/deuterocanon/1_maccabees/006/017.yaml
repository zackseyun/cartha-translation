  text: 그리고 리시아는 왕이 죽었다는 것을 알게 되었습니다[a]. 그래서 그는 자기 아들 안티오코스를 그 대신에 왕으로 세웠으니, 그를 어려서부터 길러 왔습니다. 그리고
