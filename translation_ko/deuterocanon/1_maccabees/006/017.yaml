  chosen_korean: 죽었다는
  alternatives_korean:
  - 이미 죽었다는
  - 죽어 있었다는
  lexicon: BDAG
  rationale: 과거 서술 동사 ‘알게 되었습니다’ 앞에서 완료된 죽음을 한국어로 무리 없이 전달했습니다.
- source_word: κατέστησεν βασιλεύειν
  english_pob_choice: installed ... to reign
  chosen_korean: 왕으로 세웠습니다
  alternatives_korean:
  - 왕으로 임명했습니다
  - 왕위에 앉혔습니다
  - 다스리게 했습니다
  lexicon: BDAG
  rationale: 왕권 승계를 나타내는 공식적 행위를 한국어 관용에 맞게 압축해 옮겼습니다. ‘installed’의 제도적·공적 성격을 살렸습니다.
- source_word: ἀντʼ αὐτοῦ
  english_pob_choice: in his place
  chosen_korean: 그 대신에
  alternatives_korean:
  - 그 자리에
  - 그를 대신하여
  - 그 자리를 이어
  lexicon: BDAG
  rationale: 이 표현은 앞선 왕의 자리를 대체하는 승계 관계를 뜻하므로, 한국어로는 자연스러운 ‘그 대신에’가 적절합니다.
- source_word: ἐξέθρεψεν νεώτερον
  english_pob_choice: had reared from youth
  chosen_korean: 어려서부터 길러 왔습니다
  alternatives_korean:
  - 어릴 때부터 양육해 왔습니다
  - 젊은 시절부터 길러 왔습니다
  - 어려서부터 키워 왔습니다
  lexicon: BDAG
  rationale: ‘from youth’의 시간적 시작점과 양육 의미를 함께 살리기 위해 ‘어려서부터’와 ‘길러 왔습니다’를 결합했습니다.
theological_decisions:
- issue: 왕위 승계의 정치적 진술을 어떻게 전달할지
  chosen_reading: 중립적 역사 서술로 옮기되, ‘왕으로 세웠습니다’로 승계 행위의 공적 성격을 유지했습니다.
  alternative_readings:
  - 왕으로 만들었습니다
