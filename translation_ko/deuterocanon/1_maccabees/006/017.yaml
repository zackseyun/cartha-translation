  rationale: 본문은 신학적 해설보다 역사적 사건 서술이므로, 과도한 해석 없이 권위 있는 승계 조치를 전달하는 표현을 택했습니다.
  doctrine_reference: 본문 맥락상 역사 서술 원칙
