lexical_decisions:
- source_word: ἐπέγνω
  english_pob_choice: learned
  chosen_korean: 알게 되었습니다
  alternatives_korean:
  - 알아차렸습니다
  - 알았습니다
  - 알아냈습니다
  lexicon: BDAG
  rationale: 리시아가 왕의 죽음을 새로 인지했다는 정보 획득의 뜻을 자연스럽게 살리되, 지나치게 구어적이거나 강한 추론 느낌은 피했습니다.
- source_word: τέθνηκεν
