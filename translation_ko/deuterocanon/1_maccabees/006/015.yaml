  rationale: 영어 POB가 원문 종결의 불완전성을 유지한 것처럼, 번역도 사본 상태를 가리거나 보충하지 않고 그대로 드러내는 편이 본문 증거에 충실합니다.
  doctrine_reference: 본문비평 및 사본 증거 존중
- issue: 왕실 표지들의 번역이 갖는 권위·계승 의미
  chosen_reading: 왕관, 예복, 반지를 왕권의 상징으로 옮기되, 원문이 직접 말하지 않는 해석적 확대는 피했습니다.
  alternative_readings:
  - 왕관, 의복, 인장반지로 구체화
  - 왕권의 증표로 의역
  rationale: 헬라어는 세 물건을 나열할 뿐이므로, 계승 의례의 함의는 암시하되 번역에서 과도하게 설명하지 않았습니다.
