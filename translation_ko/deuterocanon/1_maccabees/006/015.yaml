  footnotes:
  - marker: a
    text: 제공된 그리스어 본문은 “그의 아들 안티오코스를 데려오고”(καὶ)에서 문장이 중간에 끝납니다. 따라서 번역도 뒤이어야 할 내용을 보충하지 않고, 미완성된 표현을 그대로 살렸습니다.
    reason: textual_variant
lexical_decisions:
- source_word: διάδημα
  english_pob_choice: crown
  chosen_korean: 왕관
  alternatives_korean:
  - 관
  - 다이아뎀
  lexicon: LSJ
  rationale: 왕권을 나타내는 머리장식으로서 본문의 왕실 맥락을 자연스럽게 드러내기 위해 ‘왕관’을 택했습니다.
- source_word: στολή
  english_pob_choice: robe
  chosen_korean: 예복
  alternatives_korean:
  - 긴 옷
  - 로브
  - 왕복
  lexicon: LSJ
  rationale: 일반 의복이 아니라 왕실의 공식 복장을 가리키므로, 품위와 관직성을 함께 살리는 ‘예복’이 적절합니다.
- source_word: δακτύλιος
  english_pob_choice: ring
  chosen_korean: 반지
  alternatives_korean:
  - 인장반지
  - 반지
  lexicon: LSJ
  rationale: 헬라어 자체는 단순히 ‘반지’를 뜻하므로, 본문이 명시하지 않은 ‘인장’을 덧붙이지 않고 기본 의미를 살렸습니다.
- source_word: ἀγαγεῖν
  english_pob_choice: to bring
  chosen_korean: 데려오게
  alternatives_korean:
  - 끌고 오게
  - 인도하게
  - 데려오게
  lexicon: LSJ
  rationale: 목적 부정사로서 ‘데려오게’가 가장 자연스럽고, 뒤의 왕위 계승 관련 문맥에도 잘 맞습니다.
theological_decisions:
- issue: 본문이 중간에서 끊기는 미완성 문장임을 어떻게 표시할 것인가
  chosen_reading: 한국어 본문도 완결형으로 보충하지 않고, 원문이 이어지지 않는 상태를 그대로 반영했습니다.
  alternative_readings:
  - 문맥상 이어질 내용을 보충해 완결형으로 번역
  - 말줄임표를 넣어 미완성임을 표시
  rationale: 영어 POB가 원문 종결의 불완전성을 유지한 것처럼, 번역도 사본 상태를 가리거나 보충하지 않고 그대로 드러내는 편이 본문 증거에 충실합니다.
  doctrine_reference: 본문비평 및 사본 증거 존중
- issue: 왕실 표지들의 번역이 갖는 권위·계승 의미
  chosen_reading: 왕관, 예복, 반지를 왕권의 상징으로 옮기되, 원문이 직접 말하지 않는 해석적 확대는 피했습니다.
  alternative_readings:
  - 왕관, 의복, 인장반지로 구체화
  - 왕권의 증표로 의역
  rationale: 헬라어는 세 물건을 나열할 뿐이므로, 계승 의례의 함의는 암시하되 번역에서 과도하게 설명하지 않았습니다.
  doctrine_reference: 본문의 서술적 절제 존중
