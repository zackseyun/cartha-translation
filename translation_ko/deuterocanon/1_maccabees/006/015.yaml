  source_fidelity: 초안은 왕실 표지물과 ‘데려오다’의 목적 용법을 대체로 적절히 옮겼습니다. 그러나 원문은 καὶ(‘그리고’)로 끝나는 미완성 구절인데, 초안은 ‘데려오게 했습니다’라는 완결된 사역문으로 만들어 원문의 불완전한 종결과 목적 구조를 보충·변경했습니다.
  naturalness: ‘왕관’, ‘예복’, ‘반지’는 현대 표준 한국어의 격식 있는 성경 문체에 자연스럽습니다. 다만 원문 자체가 중간에 끊겨 있으므로, 수정문에 남는 문장 파편과 말줄임표는 의도된 본문 상태의 반영입니다.
