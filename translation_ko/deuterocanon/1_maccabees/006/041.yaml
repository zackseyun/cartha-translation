  text: And all who heard the sound of their multitude, and the marching of the multitude, and the clashing of the weapons, were shaken; for the camp was exceedingly great and strong.
translation:
  language: ko
  text: 그 소리와 그들의 많은 무리가 행진하는 소리와 무기들이 부딪히는 소리를 듣는 모든 사람이 흔들렸습니다. 이는 진영이 매우 크고 강했기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐσαλεύοντο
  english_pob_choice: were shaken
  chosen_korean: 흔들렸습니다
  alternatives_korean:
  - 동요했습니다
  - 깜짝 놀랐습니다
  - 두려움에 떨었습니다
  lexicon: LSJ
  rationale: 원문의 수동·미완료형이 들은 자들이 외적 소리에 의해 동요되고 흔들린 상태를 나타내므로, 과잉 해석 없이 ‘흔들렸습니다’로 옮겼습니다.
- source_word: φωνῆς πλήθους αὐτῶν
  english_pob_choice: the sound of their multitude
  chosen_korean: 그들의 많은 무리의 소리
  alternatives_korean:
  - 그들의 무리의 소리
  - 그들의 큰 무리의 소리
  - 그들의 군중의 소리
  lexicon: LSJ
  rationale: φωνή는 여기서 ‘목소리’보다 군사적 이동이 만들어내는 청각적 ‘소리’가 자연스럽고, πλήθος는 단순히 수를 가리켜 ‘많은 무리’로 살렸습니다.
- source_word: ὁδοιπορίας τοῦ πλήθους
  english_pob_choice: the marching of the multitude
  chosen_korean: 그들의 많은 무리가 행진하는 소리
  alternatives_korean:
  - 그 많은 무리의 행진
  - 그 무리의 이동
  - 그 많은 무리의 진군
  lexicon: LSJ
  rationale: ὁδοιπορία는 일반적으로 ‘여정’이지만 전투 문맥에서는 군대의 이동·행군을 뜻하므로, 청각 맥락을 유지하는 ‘행진하는 소리’로 옮겼습니다.
- source_word: συγκρουσμοὺς τῶν ὅπλων
  english_pob_choice: the clashing of the weapons
  chosen_korean: 무기들이 부딪히는 소리
  alternatives_korean:
  - 무기들의 충돌
  - 무기들이 맞부딪히는 소리
  - 병기들의 쨍그랑거림
  lexicon: LSJ
  rationale: συγκρουσμός은 ‘서로 부딪힘, 충돌’의 뜻이므로, 청각적으로 구체적인 ‘무기들이 부딪히는 소리’로 번역해 전장의 소란을 살렸습니다.
- source_word: παρεμβολὴ μεγάλη σφόδρα καὶ ἰσχυρά
  english_pob_choice: the camp was exceedingly great and strong
  chosen_korean: 진영이 매우 크고 강했기 때문입니다
  alternatives_korean:
  - 진영이 매우 크고 강했기 때문입니다
  - 진영이 지극히 크고 강했기 때문입니다
  - 진영이 매우 크고 강력했기 때문입니다
  lexicon: LSJ
  rationale: παρεμβολή는 여기서 ‘진영/야영지’를 뜻하며, μεγάλη σφόδρα καὶ ἰσχυρά의 중첩된 강세를 한국어의 자연스러운 정도부사로 옮겼습니다.
theological_decisions:
- issue: 공포의 정도를 과장하지 않고 유지하는 문제
  chosen_reading: ‘흔들렸습니다’로 번역해, 들은 자들의 내적 동요를 드러내되 ‘두려워 떨었다’처럼 감정을 특정하지 않았습니다.
  alternative_readings:
  - 두려워 떨었습니다
  - 겁에 질렸습니다
  - 혼란에 빠졌습니다
  rationale: 원문은 청각적 충격으로 인한 동요를 말할 뿐, 공포의 정서를 직접 명시하지 않으므로 그 긴장을 보존하는 번역이 적절합니다.
  doctrine_reference: 서사 묘사와 감정 과잉 해석을 구별하는 원칙
