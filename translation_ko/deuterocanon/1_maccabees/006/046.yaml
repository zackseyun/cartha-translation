  lexicon: LSJ
  rationale: 전투 상황에서 몸을 낮추며 빈틈으로 들어가는 동작을 살리기 위해, 단순한 진입보다 침투·잠입의 느낌이 있는 ‘파고들어’를 택했습니다.
- source_word: ὑπὸ τὸν ἐλέφαντα
