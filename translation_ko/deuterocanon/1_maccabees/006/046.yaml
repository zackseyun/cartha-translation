  yaml_path: translation/deuterocanon/1_maccabees/006/046.yaml
  text: And he slipped in under the elephant[a], struck it from beneath, and killed it; and it fell to the ground on top of him, and he died there.
  footnotes:
  - marker: a
    text: Or 'stabbed it underneath.' The Greek ὑπέθηκεν αὐτῷ is somewhat idiomatic in this context; the main text keeps the sense of an attack delivered from below without specifying more than the wording warrants.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 코끼리 아래로 파고들어 그 아래에서 코끼리를 쳐 죽였으며, 코끼리는 땅에 쓰러져 그의 위를 덮었고, 그는 거기서 죽었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 아래에서 코끼리를 쳐’는 ὑπέθηκεν αὐτῷ를 문맥에 따라 옮긴 것입니다. 이 표현은 다소 관용적이어서 정확한 공격 방식은 분명하지 않지만, 코끼리 아래에서 가한 공격을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσέδυσεν
  english_pob_choice: slipped in
  chosen_korean: 파고들어
  alternatives_korean:
