    rationale: ἐπάνω αὐτοῦ는 코끼리가 그 사람 위에 떨어졌음을 뜻합니다. 초안의 ‘그 위’는 코끼리나 땅을 가리키는 듯도 하며, 원문의 치명적 공간 관계를 분명히 전달하지 못합니다.
