  - 그 아래에서 그것을 공격하여
  - 그 아래에서 그것을 쳤고
  lexicon: LSJ
  rationale: 그리스어가 아래쪽에서 가한 공격을 뜻하지만, 무기 종류를 지나치게 특정하지 않도록 ‘쳐서’로 옮겼습니다.
- source_word: ἔπεσεν ἐπὶ τὴν γῆν ἐπάνω αὐτοῦ
  english_pob_choice: it fell to the ground on top of him
  chosen_korean: 그 코끼리는 땅에 그 위로 넘어졌고
  alternatives_korean:
  - 그 코끼리는 땅에 그 위에 쓰러졌고
  - 그 코끼리는 땅에 그를 덮치며 넘어졌고
  lexicon: LSJ
  rationale: ‘땅에’와 ‘그 위로’의 이중 방향성을 살려, 단순 낙하보다 위로 덮이는 치명적 장면을 분명히 했습니다.
