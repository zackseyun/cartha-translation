  - 슬며시 들어가
  - 들어가서
  lexicon: LSJ
  rationale: 전투 상황에서 몸을 낮추며 빈틈으로 들어가는 동작을 살리기 위해, 단순한 진입보다 침투·잠입의 느낌이 있는 ‘파고들어’를 택했습니다.
- source_word: ὑπὸ τὸν ἐλέφαντα
  english_pob_choice: under the elephant
  chosen_korean: 코끼리 아래로
  alternatives_korean:
  - 코끼리 밑으로
  - 코끼리 아래에
  lexicon: LSJ
  rationale: 공간 관계를 분명히 하면서도 한국어로 자연스럽게 읽히도록 ‘아래로’를 사용했습니다.
- source_word: ὑπέθηκεν αὐτῷ
  english_pob_choice: struck it from beneath
  chosen_korean: 그 아래에서 그것을 쳐서
  alternatives_korean:
  - 그 아래에서 그것을 찔러
  - 그 아래에서 그것을 공격하여
  - 그 아래에서 그것을 쳤고
  lexicon: LSJ
  rationale: 그리스어가 아래쪽에서 가한 공격을 뜻하지만, 무기 종류를 지나치게 특정하지 않도록 ‘쳐서’로 옮겼습니다.
- source_word: ἔπεσεν ἐπὶ τὴν γῆν ἐπάνω αὐτοῦ
  english_pob_choice: it fell to the ground on top of him
  chosen_korean: 그 코끼리는 땅에 그 위로 넘어졌고
  alternatives_korean:
  - 그 코끼리는 땅에 그 위에 쓰러졌고
  - 그 코끼리는 땅에 그를 덮치며 넘어졌고
  lexicon: LSJ
  rationale: ‘땅에’와 ‘그 위로’의 이중 방향성을 살려, 단순 낙하보다 위로 덮이는 치명적 장면을 분명히 했습니다.
