  - 탈취하려고
  lexicon: LSJ
  rationale: 전리품을 노리고 빼앗는 행위를 분명히 드러내는 표현으로 ‘약탈하다’가 가장 직관적입니다.
- source_word: ὁ λόγος
  english_pob_choice: the plan
  chosen_korean: 그 계획
