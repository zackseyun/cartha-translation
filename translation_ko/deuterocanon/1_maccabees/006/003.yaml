  yaml_path: translation/deuterocanon/1_maccabees/006/003.yaml
  text: And he came and sought to take the city and plunder it[a], but he was not able, because the plan became known to those from the city.
  footnotes:
  - marker: a
    text: Or 'the matter became known' or 'the scheme became known.' Greek λόγος can refer broadly to a word, report, matter, or plan; here the context favors his intended action becoming known to the city's people.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 와서 그 성을 점령하고 약탈하려 했으나, 그 일이[a] 그 성 사람들에게 알려졌기 때문에 그렇게 할 수 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 계획’, ‘그 계략’. 여기서 λόγος는 말, 소식, 일, 사안, 계획 등을 폭넓게 가리킬 수 있습니다. 문맥에서는 그가 성을 점령하고 약탈하려 한 의도나 그와 관련된 일이 성 사람들에게 알려진 것을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλαβεῖν
  english_pob_choice: to take
  chosen_korean: 점령하고
  alternatives_korean:
  - 차지하고
  - 빼앗고
  - 함락시키고
  lexicon: LSJ
  rationale: 군사적 맥락에서 도시를 장악하는 뜻이므로, 한국어에서는 자연스럽고 직접적인 ‘점령하다’가 적절합니다.
- source_word: προνομεῦσαι
  english_pob_choice: plunder
  chosen_korean: 약탈하려고
  alternatives_korean:
  - 노략하려고
  - 노략질하려고
  - 탈취하려고
  lexicon: LSJ
  rationale: 전리품을 노리고 빼앗는 행위를 분명히 드러내는 표현으로 ‘약탈하다’가 가장 직관적입니다.
- source_word: ὁ λόγος
  english_pob_choice: the plan
  chosen_korean: 그 계획
  alternatives_korean:
  - 그 일
  - 그 소문
  - 그 사정
  lexicon: BDAG
  rationale: POB의 해석을 따라 λόγος를 단순한 ‘말’이 아니라 숨은 의도나 작전으로 읽어, 문맥상 ‘계획’으로 옮겼습니다.
- source_word: τοῖς ἐκ τῆς πόλεως
  english_pob_choice: to those from the city
  chosen_korean: 그 성 안의 사람들에게
  alternatives_korean:
  - 그 도시에서 온 사람들에게
  - 그 성의 주민들에게
  - 그 성 사람들에게
  lexicon: BDAG
  rationale: 직역의 ‘도시에서 나온 사람들’보다 문맥상 방어하는 주민들을 자연스럽게 드러내는 한국어로 옮겼습니다.
