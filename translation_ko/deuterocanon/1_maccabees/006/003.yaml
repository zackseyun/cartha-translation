  yaml_path: translation/deuterocanon/1_maccabees/006/003.yaml
  text: And he came and sought to take the city and plunder it[a], but he was not able, because the plan became known to those from the city.
  footnotes:
  - marker: a
    text: Or 'the matter became known' or 'the scheme became known.' Greek λόγος can refer broadly to a word, report, matter, or plan; here the context favors his intended action becoming known to the city's people.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 와서 그 성을 점령하고 약탈하려고 했으나, 그 성 안의 사람들에게 그 계획이 알려졌기 때문에 할 수 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 일이 알려졌다’, ‘그 계략이 알려졌다’. 여기서 λόγος는 넓게는 말, 소식, 일, 계획을 뜻할 수 있으며, 문맥상 그의 의도가 성 안 사람들에게 드러난 것으로 읽는 것이 가장 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλαβεῖν
  english_pob_choice: to take
  chosen_korean: 점령하고
  alternatives_korean:
  - 차지하고
  - 빼앗고
  - 함락시키고
  lexicon: LSJ
  rationale: 군사적 맥락에서 도시를 장악하는 뜻이므로, 한국어에서는 자연스럽고 직접적인 ‘점령하다’가 적절합니다.
