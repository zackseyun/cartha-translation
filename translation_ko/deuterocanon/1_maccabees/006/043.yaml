base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/043.yaml
  text: And Eleazar the Avaran saw one of the beasts armored with royal breastplates[a], and it towered above all the beasts[b], and it appeared that the king was on it.
  footnotes:
  - marker: a
    text: Greek 'one of the beasts'; in context these beasts are war elephants.
    reason: cultural_note
  - marker: b
    text: Or 'it seemed that the king was on it.' The Greek expresses appearance rather than certainty.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 엘레아살 아와란은 짐승들 가운데 하나가 왕의 흉갑으로 무장한 것을 보았는데, 그것은 모든 짐승들보다 더 우뚝했고, 왕이 그 위에 있는 것으로 보였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 직접적으로 ‘짐승들 가운데 하나’라고 말합니다. 이 문맥의 짐승들은 전쟁 코끼리들입니다.
    reason: cultural_note
  - marker: b
    text: 또는 “그것이 왕이 그 위에 있는 것처럼 보였습니다.” 그리스어는 확정이 아니라 외견을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλεάζαρ ὁ Σαυαρὰν
  english_pob_choice: Eleazar the Avaran
  chosen_korean: 엘레아살 아와란
  alternatives_korean:
  - 엘레아살 사와란
  - 엘레아살 아바란
  lexicon: Greek proper-name/transliteration practice
  rationale: 고유명사 겸 별칭으로 기능하므로, 음역을 유지해 인물 식별성을 살렸습니다. 영어 POB의 관용형 ‘Avaran’에 맞추되 한국어 표기법상 자연스러운 형태를 택했습니다.
- source_word: ἐν τῶν θηρίων
  english_pob_choice: one of the beasts
  chosen_korean: 짐승들 가운데 하나가
  alternatives_korean:
  - 짐승들 중 하나가
  - 짐승들 가운데 하나
  lexicon: LSJ
  rationale: 문맥상 전쟁 코끼리들이지만, 그리스어는 여기서 직접적으로 ‘짐승’이라고 말하므로 그 어휘를 유지했습니다. ‘가운데 하나’는 영어 POB의 의미를 자연스럽게 반영합니다.
- source_word: τεθωρακισμένον θώραξιν βασιλικοῖς
  english_pob_choice: armored with royal breastplates
  chosen_korean: 왕의 흉갑으로 무장한
  alternatives_korean:
  - 왕의 흉갑을 두른
  - 왕의 갑주로 무장한
  - 왕실 흉갑으로 무장한
  lexicon: LSJ
  rationale: θωρακίζω/θώραξ 계열의 무장 표현을 한국어의 ‘무장하다’로 살리고, βασιλικοῖς는 ‘왕의’로 직역해 소속과 성격을 드러냈습니다. ‘흉갑’은 영어의 breastplates에 대응하는 비교적 직접적인 용어입니다.
- source_word: ὤφθη ὅτι ἐν αὐτῷ ἐστιν ὁ βασιλεύς
  english_pob_choice: it appeared that the king was on it
  chosen_korean: 왕이 그 위에 있는 것으로 보였습니다
  alternatives_korean:
  - 왕이 그 안에 있는 것으로 보였습니다
  - 왕이 그 위에 있는 듯했습니다
  - 왕이 그 위에 있는 것처럼 보였습니다
  lexicon: LSJ
  rationale: ὤφθη ὅτι는 단정이 아니라 외견상 판단을 뜻하므로, ‘보였습니다’로 번역해 확정성을 피했습니다. ἐν αὐτῷ는 코끼리 탑승 관용을 고려해 ‘그 위에’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 짐승의 정체와 외견상 진술
  chosen_reading: 본문은 짐승 가운데 하나가 왕의 흉갑으로 무장해 보였고, 왕이 그 위에 있는 것처럼 보였다고 묘사합니다.
  alternative_readings:
  - 왕이 실제로 그 위에 있었다고 단정하는 읽기
  - 짐승이 왕을 태운 것으로 확정하는 읽기
  rationale: 그리스어 ὤφθη는 ‘보였다/드러났다’의 뉘앙스를 가지므로, 사건의 실제 여부를 단정하지 않고 관찰된 인상을 유지했습니다. 이는 뒤이어 드러나는 오인 가능성과도 맞습니다.
  doctrine_reference: 문학적 서술의 인식론적 절제
