base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/038.yaml
  text: And he stationed the remaining cavalry on both sides[a], at the two flanks of the camp[b], brandishing and fully armed in the phalanxes.
  footnotes:
  - marker: a
    text: Or 'brandishing' for 'shaking their weapons'; the Greek participle κατασείοντες implies a threatening waving or shaking, with the object left unstated.
    reason: lexical_alternative
  - marker: b
    text: Or 'forming up in the phalanxes' / 'drawing together in the battle lines' for 'closing up in the phalanxes.' The Greek καταφρασσόμενοι is contextually difficult and likely describes tightening or arranging the formation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 남은 기병을 진영의 두 측면에 나누어 배치하였으며, 그들은 무기를 휘두르며 팔랑크스 안에서 대열을 갖추었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무기를 흔들며’로 옮길 수 있습니다. 그리스어 κατασείοντες는 위협적으로 흔들거나 휘두르는 동작을 뜻하며, 목적어는 본문에 명시되어 있지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘팔랑크스 안에서 대열을 정비하며’ 또는 ‘팔랑크스 안에서 더 촘촘히 대열을 이루며’로 옮길 수 있습니다. καταφρασσόμενοι는 문맥상 전열을 정돈하거나 촘촘히 갖추는 동작을 가리킬 가능성이 크지만, 정확한 의미는 불확실합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν ἐπίλοιπον ἵππον
  english_pob_choice: the remaining cavalry
  chosen_korean: 남은 기병
  alternatives_korean:
  - 나머지 기병대
  - 남아 있는 말병력
  - 남은 말
  lexicon: LSJ
  rationale: 전투 문맥에서 ἵππος는 단수 집합적으로 기병대를 가리킬 수 있으므로, 자연스럽게 ‘남은 기병’으로 옮겼습니다.
- source_word: ἔνθεν καὶ ἔνθεν
  english_pob_choice: on both sides
  chosen_korean: 양쪽에
  alternatives_korean:
  - 이쪽과 저쪽에
  - 양편에
  - 좌우에
  lexicon: LSJ
  rationale: 진영의 좌우 배치를 나타내는 관용구이므로, 군사 장면에서 자연한 ‘양쪽에’로 옮겼습니다.
- source_word: τῆς παρεμβολῆς
  english_pob_choice: the camp
  chosen_korean: 진영
  alternatives_korean:
  - 야영지
  - 캠프
  - 군영
  lexicon: LSJ
  rationale: 군사 서술의 παρεμβολή는 단순한 야영이 아니라 전투 진영을 뜻하므로 ‘진영’이 가장 적절합니다.
- source_word: κατασείοντες
  english_pob_choice: brandishing
  chosen_korean: 창들을 휘두르며
  alternatives_korean:
  - 무기를 흔들며
  - 위협적으로 휘두르며
  - 휘두르며
  lexicon: LSJ
  rationale: 동사의 대상이 생략되어 있으므로, 문맥상 무기를 가리킨다고 보고 한국어에서는 그 대상을 보충해 군사적 동작을 분명히 했습니다.
- source_word: καταφρασσόμενοι ἐν ταῖς φάλαγξιν
  english_pob_choice: fully armed in the phalanxes
  chosen_korean: phalanxes 안에서 대열을 다졌습니다
  alternatives_korean:
  - 팔랑크스 안에서 무장했습니다
  - 팔랑크스에 들어가 빽빽이 섰습니다
  - 전열을 정비했습니다
  lexicon: LSJ
  rationale: 이 구절은 문자적인 ‘완전 무장’보다 전열을 촘촘히 하며 정렬하는 군사적 동작이 더 적절하므로, POB의 주석을 반영해 ‘대열을 다졌습니다’로 옮겼습니다.
