  source_fidelity: ‘베르사카리아’는 Βεθζαχαριά(Beth-zachariah)의 음가를 정확히 반영하지 못하며, ‘왕의 진영 맞은편’이라는 공간 관계는 ‘그곳은 … 맞은편이었습니다’보다 동사에 직접 연결하는 편이 원문에 더 충실합니다. ‘아크라’는 이 문맥에서 예루살렘의 특정 성채를 가리키는 처리도 가능합니다.
  naturalness: ‘유다가 아크라를 떠나 벳즈카리아로 가서 왕의 진영 맞은편에 진을 쳤습니다’는 현대 표준 한국어 합쇼체로 자연스럽고 군사적 서술에도 알맞습니다.
  terminology: 아크라는 역사적 고유 지시를 보존할 수 있습니다. 다만 현 각주는 본문에 이미 ‘아크라’가 있는데도 ‘또는 “아크라”’라고 하여 대안 표기로 기능하지 않으므로, 설명 각주로 고쳐야 합니다. Βεθζαχαριά는 ‘벳즈카리아’로 바로잡습니다.
