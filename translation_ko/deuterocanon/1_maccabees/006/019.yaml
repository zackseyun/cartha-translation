  text: And Judas decided to root them out[a], and he assembled all the people to besiege them.
  footnotes:
  - marker: a
    text: Or 'to surround them' more literally, 'to sit around them.' The phrase is a military expression for laying siege.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다는 그들을 없애기로 결심하고, 그들을 포위하려고 온 백성을 모았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들 주위에 앉다’에 가깝지만, 헬라어 군사 표현으로는 ‘포위하다’ 또는 ‘공성하다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλογίσατο
  english_pob_choice: decided
  chosen_korean: 결심하고
  alternatives_korean:
  - 결정하고
  - 판단하고
  - 마음먹고
  lexicon: BDAG
  rationale: 중간태 λογίζομαι는 단순한 계산보다 단호한 의사결정을 가리키므로, 자연스러운 합쇼체에서 ‘결심하다’가 가장 가깝습니다.
- source_word: ἐξᾶραι
  english_pob_choice: to root them out
  chosen_korean: 그들을 없애기로
  alternatives_korean:
  - 그들을 제거하기로
  - 그들을 쓸어버리기로
  - 그들을 멸하기로
  lexicon: LSJ
  rationale: 원문의 강한 제거·축출 뜻을 살리되, 한국어에서 과도하게 해석을 좁히지 않도록 ‘없애다’로 옮겼습니다.
- source_word: ἐξεκκλησίασεν
  english_pob_choice: assembled
  chosen_korean: 모았습니다
  alternatives_korean:
  - 소집했습니다
  - 모여들게 했습니다
  - 집결시켰습니다
  lexicon: LSJ
  rationale: 백성을 한데 불러모으는 의미를 가장 간결하게 드러내는 표준어로 옮겼습니다.
- source_word: τοῦ περικαθίσαι ἐπʼ αὐτούς
  english_pob_choice: to besiege them
  chosen_korean: 포위하려고
  alternatives_korean:
  - 둘러싸려고
  - 공성하려고
  - 에워싸려고
  lexicon: LSJ
  rationale: 직역하면 ‘그들 주위에 앉다’이지만 군사적 관용구이므로, 포위 공격의 뜻을 드러내는 ‘포위하다’로 번역했습니다.
theological_decisions:
- issue: 군사적 관용구의 직역 여부
  chosen_reading: ‘포위하려고’로 번역해 원문의 군사적 목적을 분명히 드러냈습니다.
  alternative_readings:
  - ‘둘러싸려고’
  - ‘그들 주위에 앉으려고’
  rationale: 문자적 표현은 보존되지만 현대 한국어 독자에게는 전쟁 맥락이 흐려질 수 있어, 본문이 의도하는 작전적 의미를 우선했습니다.
  doctrine_reference: '번역 원칙: 의미 등가와 문맥 우선'
- issue: ‘λαός’의 범위
  chosen_reading: ‘온 백성’으로 옮겨 집단 전체를 가리키는 폭을 살렸습니다.
  alternative_readings:
  - ‘모든 백성’
  - ‘온 군중’
  - ‘온 민중’
  rationale: 여기서는 단순한 개인 집합이 아니라 동원된 공동체/전투집단의 뉘앙스가 있으므로, 직역적이면서도 자연스러운 ‘온 백성’이 적합합니다.
  doctrine_reference: '어휘 선택 원칙: 원문 범위 보존'
