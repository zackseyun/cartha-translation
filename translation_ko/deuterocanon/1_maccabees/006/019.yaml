  - 그들을 쓸어버리기로
  - 그들을 멸하기로
  lexicon: LSJ
  rationale: 원문의 강한 제거·축출 뜻을 살리되, 한국어에서 과도하게 해석을 좁히지 않도록 ‘없애다’로 옮겼습니다.
- source_word: ἐξεκκλησίασεν
  english_pob_choice: assembled
  chosen_korean: 모았습니다
  alternatives_korean:
