    reason: lexical_alternative
translation:
  language: ko
  text: 그 회중이 전쟁에 대비하고 기도하며 자비와 긍휼을 구하려고 모였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘소집되었습니다’. 그리스어 동사는 형태상 수동이므로 더 형식적으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 회중’ 대신 ‘그 집회’로도 옮길 수 있습니다. 여기서 συναγωγή는 함께 모인 공동체를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ συναγωγή
  english_pob_choice: the assembly
  chosen_korean: 그 회중
  alternatives_korean:
  - 그 모임
  - 그 집회
  - 그 회당
  lexicon: BDAG
  rationale: 여기서는 제도화된 ‘회당’이 아니라 함께 모인 공동체를 가리키므로, 집합체 의미를 살려 ‘회중’으로 옮겼습니다.
- source_word: ἠθροίσθη
  english_pob_choice: gathered
  chosen_korean: 모였습니다
  alternatives_korean:
  - 모여졌습니다
  - 소집되었습니다
  - 한데 모였습니다
  lexicon: BDAG
  rationale: 그리스어 수동형이지만 의미상 공동체의 집결을 자연스럽게 드러내는 표현으로 ‘모였습니다’를 선택했습니다.
- source_word: τοῦ εἶναι ἑτοίμους εἰς πόλεμον
  english_pob_choice: to be ready for war
  chosen_korean: 전쟁에 대비할 준비를 갖추고
  alternatives_korean:
  - 전쟁에 준비되도록
  - 전쟁에 대비하여
  - 전쟁에 나설 준비를 하고
  lexicon: BDAG
  rationale: 목적을 나타내는 구조를 한국어로 자연스럽게 풀어, ‘전쟁에 대비할 준비’를 명확히 드러냈습니다.
- source_word: ἔλεον καὶ οἰκτειρμούς
  english_pob_choice: mercy and compassion
  chosen_korean: 자비와 긍휼
  alternatives_korean:
  - 은혜와 긍휼
  - 자비와 연민
  - 긍휼과 불쌍히 여김
  lexicon: BDAG
  rationale: 두 명사는 구별을 유지해야 하므로 병렬로 살렸고, 기도 문맥에서 ‘자비’와 ‘긍휼’이 각각의 뉘앙스를 가장 잘 반영합니다.
theological_decisions:
- issue: 공동체를 가리키는 συναγωγή의 번역
  chosen_reading: ‘회중’으로 번역해 공동체적 집결을 강조합니다.
  alternative_readings:
  - ‘회당’으로 번역
  - ‘교회’로 번역
  rationale: 본문은 장소나 제도가 아니라 전쟁과 기도를 위해 모인 백성을 말하므로, 역사적 맥락을 보존하는 표현이 필요합니다.
  doctrine_reference: Translation philosophy §1, §6
