translation:
  language: ko
  text: 그들은 오만과 불법의 큰 무리로 우리에게 달려와 우리와 우리 아내들과 우리 자녀들을 없애 버리고 우리를 약탈하려 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρὸς ἡμᾶς
  english_pob_choice: against us
  chosen_korean: 우리에게
  alternatives_korean:
  - 우리를 향해
  - 우리에게 맞서
  lexicon: LSJ
  rationale: 전투 상황에서 πρός + 목적격은 단순한 방향보다 적대적 접근을 나타내므로, 한국어에서는 동작의 표적을 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: πλήθει ὕβρεως καὶ ἀνομίας
  english_pob_choice: in a great mass of insolence and lawlessness
  chosen_korean: 오만과 불법의 큰 무리로
  alternatives_korean:
  - 오만과 불법의 많은 무리로
  - 오만과 불법을 품은 큰 무리로
  lexicon: LSJ
  rationale: πλήθει를 단순한 수량이 아니라 동반 상태를 나타내는 말로 보고, ὕβρις와 ἀνομία의 결합을 살려 ‘오만과 불법의 큰 무리’로 옮겼습니다.
- source_word: τοῦ ἐξᾶραι ἡμᾶς
  english_pob_choice: to wipe out us
  chosen_korean: 우리와 우리 아내들과 우리 자녀들을 없애 버리고
  alternatives_korean:
  - 우리를 멸하려 하고
  - 우리를 뿌리째 없애려 하고
  lexicon: LSJ
  rationale: ἐξαίρω의 강한 제거·소멸 의미를 반영해, 대상 전체를 완전히 제거하려는 의도를 드러내는 동사로 옮겼습니다.
- source_word: τοῦ σκυλεῦσαι ἡμᾶς
  english_pob_choice: to plunder us
  chosen_korean: 우리를 약탈하려 합니다
  alternatives_korean:
  - 우리를 노략질하려 합니다
  - 우리의 재물을 빼앗으려 합니다
  lexicon: LSJ
  rationale: σκυλεύω는 전리품을 빼앗는 군사적 약탈을 뜻하므로, 현대 한국어에서 가장 직접적이고 분명한 ‘약탈하다’를 택했습니다.
theological_decisions:
- issue: 오만(ὕβρις)과 불법(ἀνομία)의 결합 표현
  chosen_reading: 이들은 단순히 수적으로 많은 적이 아니라, 오만과 율법/질서 거스름을 특징으로 하는 폭력적 침입자로 묘사됩니다.
  alternative_readings:
  - 단순한 악행의 일반 묘사로 완화할 수 있습니다.
  - ‘불법’을 ‘죄악’으로 넓게 옮길 수 있습니다.
  rationale: 본문은 공격의 성격을 도덕적으로 규정하므로, 그 긴장을 약화하지 않기 위해 ‘오만’과 ‘불법’을 그대로 살렸습니다.
  doctrine_reference: 사회적·도덕적 악의 실재에 대한 성경적 증언
- issue: 가족 전체를 포함한 파괴 의도
  chosen_reading: ‘우리와 우리 아내들과 우리 자녀들’은 공동체 전체의 전멸 의도를 강조하는 표현으로 보존했습니다.
  alternative_readings:
  - ‘우리 가족들’로 묶어 더 자연스럽게 옮길 수 있습니다.
  - 대상을 간략화해 ‘우리 모두’를 사용할 수 있습니다.
  rationale: 원문이 아내들과 자녀들을 개별적으로 병기하여 잔혹성을 드러내므로, 이를 압축하지 않고 유지했습니다.
  doctrine_reference: 전쟁 서사의 폭력성에 대한 본문 존중
