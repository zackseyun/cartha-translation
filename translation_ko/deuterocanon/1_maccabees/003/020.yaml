  terminology: ὕβρις는 ‘오만’, ἀνομία는 ‘불법’으로 유지할 수 있습니다. ἐξαίρω의 철저한 제거 의도는 ‘없애 버리다’로, σκυλεύω의 군사적 약탈은 ‘약탈하다’로 적절히 보존했습니다. ‘아내들과 자녀들’도 원문의 열거를 유지했습니다.
