- from: 그때에 유다가 말하였습니다. “띠를 졸라 매고, 힘센 아들들이 되며, 내일 아침에 이 민족들과 싸울 준비를 하십시오. 이 민족들은 우리와 우리 거룩한 것들을 없애려고 우리에게 몰려들었습니다.”[a][b]
  to: 유다가 말하였습니다. “띠를 졸라매십시오. 힘센 아들들이 되십시오[a]. 아침에 우리에게 맞서 모여든 이 민족들과 싸울 준비를 하십시오. 그들은 우리와 우리의 거룩한 것들[b]을 멸하려고 모여들었습니다.”
  rationale: 원문에 없는 ‘내일’을 제거하고, 원문의 명령형 반복을 자연스러운 합쇼체 독립 명령문으로 반영했습니다. 적대 세력의 집결이 ‘우리에게 맞서’ 이루어진 것임을 수식 구조로 명확히 했으며, 각주 표지를 해당 어구로 옮겼습니다. ‘아들들’과 ‘거룩한 것들’은 각각 원문의 성별 표지와 복수형의 의미 범위를 보존합니다.
