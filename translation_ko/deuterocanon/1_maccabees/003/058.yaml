  yaml_path: translation/deuterocanon/1_maccabees/003/058.yaml
  text: And Judas said[a], “Gird yourselves, and become mighty men[b], and be ready in the morning to fight against these nations that have assembled against us to destroy us and our holy things.”
  footnotes:
  - marker: a
    text: Or 'show yourselves mighty men' / 'become strong men'; Greek literally, 'become mighty sons.'
    reason: lexical_alternative
  - marker: b
    text: Or 'our sanctuary'; Greek has the plural 'our holy things,' which may refer broadly to the sacred things or holy precincts.
    reason: alternative_reading
translation:
  language: ko
  text: 유다가 말하였습니다. “띠를 졸라매십시오. 힘센 아들들이 되십시오[a]. 아침에 우리에게 맞서 모여든 이 민족들과 싸울 준비를 하십시오. 그들은 우리와 우리의 거룩한 것들[b]을 멸하려고 모여들었습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자신을 강한 아들들로 드러내라’ / ‘힘센 남자들이 되라’; 헬라어는 문자적으로 ‘힘센 아들들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리 성전’ / ‘우리 성소’; 헬라어 복수형은 더 넓게는 거룩한 것들 또는 거룩한 구역들을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Περιζώσασθε
  english_pob_choice: Gird yourselves
  chosen_korean: 띠를 졸라 매다
  alternatives_korean:
  - 무장하십시오
  - 준비하십시오
  lexicon: LSJ
  rationale: 전투 준비의 관용구인 ‘gird yourselves’를 한국어의 몸동작이 살아 있는 표현으로 옮겨, 단순한 ‘준비하다’보다 긴박한 군사적 뉘앙스를 살렸습니다.
- source_word: γίνεσθε εἰς υἱοὺς δυνατούς
  english_pob_choice: become mighty sons
  chosen_korean: 힘센 아들들이 되다
  alternatives_korean:
  - 용맹한 남자들이 되다
  - 강한 남자들이 되다
  lexicon: LSJ
  rationale: 원문이 직역적으로 ‘능력 있는/힘센 아들들’이므로, 남성 일반으로 평준화하지 않고 ‘아들들’을 유지해 소스의 표현을 살렸습니다.
- source_word: ἐπισυνηγμένοις
  english_pob_choice: have gathered together
  chosen_korean: 몰려들다
  alternatives_korean:
  - 함께 모이다
  - 집결하다
  lexicon: LSJ
  rationale: 문맥상 적대적 세력이 우리를 향해 모여든 상황이므로, 합쇼체 본문에서는 자연스럽지만 공격성을 담는 ‘몰려들다’를 택했습니다.
- source_word: τὰ ἅγια ἡμῶν
  english_pob_choice: our holy things
  chosen_korean: 우리 거룩한 것들
  alternatives_korean:
  - 우리 성전
  - 우리 성소
  - 우리 거룩한 곳들
  lexicon: LSJ
  rationale: 복수형 τὰ ἅγια의 폭을 좁히지 않기 위해 단수의 ‘성전/성소’로 한정하지 않고, 성물과 성소 영역을 함께 열어 두는 표현을 사용했습니다.
theological_decisions:
- issue: 유대식/성경적 남성 표지인 υἱοὺς의 처리
  chosen_reading: ‘아들들’을 본문에 유지했습니다.
  alternative_readings:
  - 사람들
  - 용사들
  rationale: 원문의 남성 표지를 지우지 않고 그대로 살리는 편이 소스 충실도에 부합하며, 전투적 격려의 강도를 유지합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: τὰ ἅγια ἡμῶν의 범위
  chosen_reading: ‘우리 거룩한 것들’로 넓게 옮겼습니다.
  alternative_readings:
  - 우리 성전
  - 우리 성소
  rationale: 복수형이 주는 범위를 보존해, 성전 건물만이 아니라 거룩한 기물과 거룩한 영역 전체를 가리킬 수 있게 했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
