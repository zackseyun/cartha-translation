base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/006.yaml
  text: And the lawless were restrained because of fear of him[a], and all the workers of lawlessness were thrown into confusion[b], and deliverance prospered in his hand.
  footnotes:
  - marker: a
    text: Or 'salvation prospered in his hand.' The Greek σωτηρία can mean 'deliverance' or 'salvation'; here the context favors national/military rescue.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'in his hand' is a biblical idiom meaning that success came through his agency or power.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 불법한 자들은 그를 두려워하여 제압되었으며, 모든 불법의 일꾼들은 혼란에 빠졌고, 구원은 그의 손에서 형통하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 손에서 구원이 형통하였습니다.’ 여기서 σωτηρία는 문맥상 ‘구원’ 또는 ‘구출’을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘그의 손에서’는 히브리식 관용구로, 일이 그의 행위와 권세를 통해 이루어졌다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ ἄνομοι
  english_pob_choice: the lawless
  chosen_korean: 불법한 자들
  alternatives_korean:
  - 무법자들
  - 악한 자들
  lexicon: LSJ/BDAG
  rationale: ἄνομος는 단순히 ‘악한’이 아니라 율법/질서에 반하는 상태를 가리키므로, 한국어에서도 법적·윤리적 성격이 드러나는 ‘불법한 자들’로 옮겼습니다.
- source_word: συνεστάλησαν
  english_pob_choice: were restrained
  chosen_korean: 제압되었으며
  alternatives_korean:
  - 억제되었으며
  - 물러서게 되었으며
  - 제한되었으며
  lexicon: LSJ
  rationale: 전쟁·대적 문맥에서 상대가 두려움 때문에 눌리고 뒤로 물러나는 강한 효과를 살리기 위해, 수동의 압박감을 드러내는 ‘제압되다’를 택했습니다.
- source_word: οἱ ἐργάται τῆς ἀνομίας
  english_pob_choice: the workers of lawlessness
  chosen_korean: 불법의 일꾼들
  alternatives_korean:
  - 불법을 행하는 자들
  - 무법의 행위자들
  lexicon: BDAG/LSJ
  rationale: ‘workers’의 구체적 이미지와 ἀνομ- 어군의 반복을 살리기 위해 ‘일꾼들’을 유지했고, ἀνομία를 앞의 표현과 일치시켜 ‘불법’으로 번역했습니다.
- source_word: εὐωδώθη σωτηρία
  english_pob_choice: deliverance prospered
  chosen_korean: 구원은 형통하였습니다
  alternatives_korean:
  - 구원은 번성하였습니다
  - 구원은 성공하였습니다
  - 구원은 잘되게 되었습니다
  lexicon: LSJ/BDAG
  rationale: σωτηρία는 이 역사·군사 문맥에서 ‘구원/구출’의 뜻이 우세하므로 ‘구원’으로 두었고, εὐωδώθη의 ‘잘 되어 가다/번성하다’ 감각은 ‘형통하다’로 옮겼습니다.
- source_word: ἐν χειρὶ αὐτοῦ
  english_pob_choice: in his hand
  chosen_korean: 그의 손에서
  alternatives_korean:
  - 그의 손 안에서
  - 그의 손으로
  - 그의 권세 아래서
  lexicon: BDAG/LSJ
  rationale: 히브리식 관용구로서 행위·능력의 매개를 가리키므로, 직역적이면서도 자연스러운 ‘그의 손에서’로 유지했습니다.
theological_decisions:
- issue: σωτηρία의 범위
  chosen_reading: 이 구절에서는 ‘구원’이지만, 군사적 승리보다 하나님의 통한 구출과 회복의 성격을 함께 열어 둡니다.
  alternative_readings:
  - 해방
  - 승리
  rationale: 문맥은 유다의 활동으로 적들이 제압되는 역사적 상황이지만, σωτηρία는 단순한 전술적 승리보다 더 넓은 구출 개념을 담을 수 있으므로 ‘구원’을 택하되 군사적 맥락을 지우지 않았습니다.
  doctrine_reference: 구약/외경 어휘의 문맥 우선 원칙
