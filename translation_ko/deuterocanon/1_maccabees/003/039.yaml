  text: And he sent with them forty thousand men and seven thousand cavalry[a], to come into the land of Judah and destroy it[b], according to the word of the king.
  footnotes:
  - marker: a
    text: Or 'according to the command of the king.' The Greek says 'according to the word of the king,' where 'word' carries the force of an order in context.
    reason: lexical_alternative
  - marker: b
    text: Literally 'seven thousand horse'; the Greek likely uses 'horse' metonymically for mounted troops, hence 'cavalry.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그들과 함께 사만 명의 병사와 칠천 명의 기병[b]을 보내어 유다 땅으로 들어가 그 땅을 파괴하게 했습니다. 이는 왕의 말[a]에 따른 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘말’은 이 문맥에서 왕의 명령 또는 지시의 힘을 띤 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 원문의 ‘말’은 여기서 기마 병력을 가리키는 군사적 환유로 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν μετʼ αὐτῶν
  english_pob_choice: sent with them
  chosen_korean: 그들과 함께 … 보내어
  alternatives_korean:
  - 그들과 함께 … 파견하여
  - 그들과 더불어 … 보냈으며
  lexicon: LSJ
  rationale: 군사 파견의 흐름을 자연스럽게 살리면서도, ‘μετʼ αὐτῶν’의 동반 관계를 분명히 드러내기 위해 ‘그들과 함께’로 옮겼습니다.
- source_word: τεσσεράκοντα χιλιάδας ἀνδρῶν
  english_pob_choice: forty thousand men
  chosen_korean: 사만 명의 남자
  alternatives_korean:
  - 사만 명의 사람
  - 사만 명의 군인
  lexicon: LSJ
  rationale: 본문은 문자 그대로 ‘남자들’이라고 하므로, 군사적 맥락을 감안하되 원문 표현을 유지하여 ‘남자’로 옮겼습니다.
- source_word: ἑπτακισχιλίον ἵππον
  english_pob_choice: seven thousand cavalry
  chosen_korean: 칠천의 기병
  alternatives_korean:
  - 칠천 마리의 말
  - 칠천 명의 마병
  lexicon: LSJ
  rationale: ἵππος가 문자적으로는 ‘말’이지만 여기서는 전투에 동원된 기마 병력을 가리키므로, 영어 POB의 판단을 따라 한국어에서는 ‘기병’으로 자연스럽게 옮겼습니다.
- source_word: κατὰ τὸν λόγον τοῦ βασιλέως
  english_pob_choice: according to the word of the king
  chosen_korean: 왕의 말에 따른 것이었습니다
  alternatives_korean:
  - 왕의 명령에 따른 것이었습니다
  - 왕의 말대로였습니다
  lexicon: LSJ
  rationale: λόγος는 여기서 단순한 ‘말’이 아니라 왕의 지시·명령의 힘을 띠므로, 원문의 표현을 살리면서도 한국어에서 의미가 통하도록 ‘왕의 말에 따른’으로 옮겼습니다.
theological_decisions:
- issue: 왕의 λόγος를 어떻게 이해할 것인가
  chosen_reading: ‘왕의 말’이라는 표현을 유지하되, 문맥상 명령의 효력을 가진 말로 이해되도록 번역했습니다.
  alternative_readings:
  - ‘왕의 명령’으로 직접 옮길 수 있습니다.
  - ‘왕이 명령한 대로’로 풀어쓸 수 있습니다.
  rationale: 본문은 왕의 지시에 따른 군사 이동을 말하므로, 의미는 명령이지만 원문 어휘 자체는 ‘말’입니다. 그 긴장을 보존하는 쪽이 source-direct합니다.
  doctrine_reference: 문맥상 의미 확정(lexical pragmatics)
