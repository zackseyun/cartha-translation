  lexicon: LSJ
  rationale: ‘군대/병력’으로 δυνάμεις의 군사적 의미를 살리고, ‘절반’으로 수량 관계를 자연스럽게 반영했습니다.
- source_word: ἀπὸ πόλεως βασιλείας αὐτοῦ
