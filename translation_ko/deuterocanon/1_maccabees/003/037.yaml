base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/037.yaml
  text: And the king took half of the forces that had been left behind and departed from Antioch[a], the city of his kingdom, in the one hundred forty-seventh year[c][b]; and he crossed the Euphrates River and traveled through the upper regions.
  footnotes:
  - marker: a
    text: Or 'from Antioch, the royal city of his kingdom.' The Greek phrase 'from the city of his kingdom' may function appositionally to identify Antioch as the king's royal/capital city.
    reason: lexical_alternative
  - marker: b
    text: That is, the one hundred forty-seventh year of the Seleucid era.
    reason: cultural_note
  - marker: c
    text: Or 'the upper provinces' or 'the inland regions.' The Greek expression likely refers to territories east of the Euphrates.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 왕은 남아 있던 군대의 절반을 거느리고 안티오키아, 곧 자기 왕국의 도시에서 떠났습니다. 그는 제147년에 유프라테스 강을 건너 상부 지역들을 지나갔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 왕국의 왕도인 안티오키아에서’라는 뜻일 수 있습니다. 그리스어의 ‘그의 왕국의 도시’는 안티오키아를 왕도/수도로 설명하는 동격 표현일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 셀레우코스 연대의 제147년입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘상부 지방들’ 혹은 ‘내륙 지역들’로 옮길 수 있습니다. 이 그리스어 표현은 대개 유프라테스 강 동쪽의 지역들을 가리키는 듯합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέλαβεν
