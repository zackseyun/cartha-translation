base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/037.yaml
  text: And the king took half of the forces that had been left behind and departed from Antioch[a], the city of his kingdom, in the one hundred forty-seventh year[c][b]; and he crossed the Euphrates River and traveled through the upper regions.
  footnotes:
  - marker: a
    text: Or 'from Antioch, the royal city of his kingdom.' The Greek phrase 'from the city of his kingdom' may function appositionally to identify Antioch as the king's royal/capital city.
    reason: lexical_alternative
  - marker: b
    text: That is, the one hundred forty-seventh year of the Seleucid era.
    reason: cultural_note
  - marker: c
    text: Or 'the upper provinces' or 'the inland regions.' The Greek expression likely refers to territories east of the Euphrates.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕은 남겨져 있던 군대의 절반을 거느리고 안티오키아[a], 곧 자기 왕국의 도시에서 떠났습니다. 그는 제147년[b]에 유프라테스 강을 건너 상부 지역들을[c] 지나갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 왕국의 왕도인 안티오키아에서’라는 뜻일 수 있습니다. 그리스어의 ‘그의 왕국의 도시’는 안티오키아를 왕도 또는 수도로 설명하는 동격 표현일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 셀레우코스 연대의 제147년입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘상부 지방들’ 혹은 ‘내륙 지역들’로 옮길 수 있습니다. 이 그리스어 표현은 대개 유프라테스 강 동쪽의 지역들을 가리키는 듯합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέλαβεν
  english_pob_choice: took
  chosen_korean: 거느리고
  alternatives_korean:
  - 데리고
  - 취하고
  lexicon: BDAG
  rationale: 군사적 문맥에서 단순히 ‘받다’보다, 남은 병력을 함께 이끌고 이동하는 뜻을 살려 ‘거느리고’로 옮겼습니다.
- source_word: τὰς ἡμίσεις τῶν δυνάμεων τὰς καταλειφθείσας
  english_pob_choice: the half of the forces that had been left behind
  chosen_korean: 남아 있던 군대의 절반
  alternatives_korean:
  - 남겨져 있던 군대의 절반
  - 남은 병력의 절반
  lexicon: LSJ
  rationale: ‘군대/병력’으로 δυνάμεις의 군사적 의미를 살리고, ‘절반’으로 수량 관계를 자연스럽게 반영했습니다.
- source_word: ἀπὸ πόλεως βασιλείας αὐτοῦ
  english_pob_choice: from the city of his kingdom
  chosen_korean: 자기 왕국의 도시에서
  alternatives_korean:
  - 자기 왕국의 왕도에서
  - 자기 왕국의 수도에서
  lexicon: LSJ
  rationale: 그리스어의 동격적 표현을 과도하게 풀이하지 않고, 안티오키아를 왕국의 도시로 설명하는 구조를 유지했습니다.
- source_word: τὰς ἐπάνω χώρας
  english_pob_choice: the upper regions
  chosen_korean: 상부 지역들
  alternatives_korean:
  - 상부 지방들
  - 내륙 지역들
  lexicon: LSJ
  rationale: 지리적 방향성을 살리되, 본문이 특정 행정구역을 명시하지 않으므로 ‘지역들’로 열어 두었습니다.
