  lexicon: LSJ
  rationale: 그리스어의 동격적 표현을 과도하게 풀이하지 않고, 안티오키아를 왕국의 도시로 설명하는 구조를 유지했습니다.
- source_word: τὰς ἐπάνω χώρας
