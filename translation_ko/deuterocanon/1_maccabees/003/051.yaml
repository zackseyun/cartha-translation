translation:
  language: ko
  text: 또한 주님의 거룩한 것들은[a] 짓밟히고 더럽혀졌으며, 주님의 제사장들은 애통과 굴욕 가운데 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거룩한 것들’은 그리스어 중성 복수형으로, ‘성소’나 ‘거룩한 곳’으로도 옮길 수 있습니다. 여기서는 성소만으로 범위를 좁히지 않고 성전의 거룩한 영역과 성물 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
