lexical_decisions:
- source_word: θέλημα
  english_pob_choice: will
  chosen_korean: 뜻
  alternatives_korean:
  - 의지
  - 원하심
  - 목적
  lexicon: BDAG
  rationale: 문맥상 하나님의 내적 의도와 결정된 의향을 가리키므로, 한국어에서는 ‘뜻’이 가장 자연스럽고 신학적으로도 무리 없이 전달합니다.
- source_word: ἐν οὐρανῷ
  english_pob_choice: in heaven
  chosen_korean: 하늘에 계신
  alternatives_korean:
  - 하늘에서
  - 하늘 안에
  lexicon: LSJ
  rationale: 직역형 ‘하늘에’도 가능하지만, 한국어에서는 하나님의 거처를 말할 때 ‘하늘에 계신’이 더 자연스러워 원문의 장소 표현을 살리면서도 문장을 매끄럽게 했습니다.
- source_word: ὡς δʼ ἂν ᾖ ... οὕτως
  english_pob_choice: As ... so
  chosen_korean: 어떠하든지 ... 그대로
  alternatives_korean:
  - '...인 대로 ...'
  - '...하는 대로 ...'
  lexicon: LSJ
  rationale: ἂν + 접속법이 주는 불특정·포괄적 뉘앙스를 살려 ‘어떠하든지’로 옮겼고, 대응 구조는 ‘그대로’로 받아 자연스러운 상관구를 만들었습니다.
- source_word: ποιήσει
  english_pob_choice: he will do
  chosen_korean: 행하실 것입니다
  alternatives_korean:
  - 하실 것입니다
  - 하시겠습니다
  - 실행하실 것입니다
  lexicon: BDAG
  rationale: ποιέω의 일반적 의미를 ‘행하다’로 옮겨 단순한 행위의 지속성보다 의지에 따른 실행을 드러내되, 원문의 간결함은 유지했습니다.
theological_decisions:
