  chosen_reading: 성전과 그 성스러운 구역들을 포함하는 제의적 공간의 폐허
  alternative_readings:
  - 단일한 성소
  - 성전의 거룩한 기물들
  rationale: 본문은 이스라엘 공동체의 회복과 함께 성전 훼손의 회복을 말하므로, 복수형의 폭을 살려 공간과 성물을 모두 포괄할 수 있는 표현으로 남겼습니다.
  doctrine_reference: 성전 정결과 공동체 회복의 맥락
