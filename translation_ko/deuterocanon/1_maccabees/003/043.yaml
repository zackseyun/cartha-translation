  text: 그리고 각자 이웃에게 말했습니다. “우리 백성과 성소를 다시 일으켜 세웁시다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리 백성과 거룩한 것들이 겪은 무너짐을 일으켜 세우자.” 그리스어는 ‘일으켜 세우다’라는 동사와 ‘무너짐/파괴’를 뜻하는 명사를 결합하여, 파괴된 상태에서의 회복을 표현합니다. ‘거룩한 것들’은 여기서 성소와 그 성스러운 영역을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος πρὸς τὸν πλησίον αὐτοῦ
  english_pob_choice: each said to his neighbor
  chosen_korean: 각자 이웃에게
  alternatives_korean:
  - 각 사람이 자기 이웃에게
