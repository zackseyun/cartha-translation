  text: And each said to his neighbor[a], “Let us restore the ruin of our people and of the holy places.”
  footnotes:
  - marker: a
    text: Or “restore the downfall of our people and of the holy things.” The Greek combines a verb meaning “raise up” with a noun for “ruin/downfall,” expressing restoration from devastation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 각자 이웃에게 말했습니다. “우리 백성과 거룩한 곳들의 폐허를 다시 세웁시다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리 백성의 몰락과 거룩한 것들의 몰락을 다시 세우자.” 그리스어는 ‘일으키다’라는 동사와 ‘무너짐/폐허’를 뜻하는 명사를 결합해, 파괴 상태에서의 회복을 표현합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος πρὸς τὸν πλησίον αὐτοῦ
  english_pob_choice: each said to his neighbor
  chosen_korean: 각자 이웃에게
  alternatives_korean:
  - 각 사람이 자기 이웃에게
  - 각자 서로에게
  lexicon: LSJ
  rationale: ἕκαστος는 분배적 ‘각자’이고, πρὸς τὸν πλησίον αὐτοῦ는 ‘이웃에게/가까운 사람에게’라는 상호 발화를 자연스럽게 나타내므로 간결한 ‘각자 이웃에게’로 옮겼습니다.
- source_word: Ἀναστήσωμεν
  english_pob_choice: Let us raise up
  chosen_korean: 다시 세웁시다
  alternatives_korean:
  - 일으켜 세웁시다
  - 회복합시다
  - 세워 봅시다
  lexicon: LSJ
  rationale: ἀνίστημι의 ‘일으키다, 세우다’ 이미지와 문맥의 복구 의미를 함께 살려, 붕괴된 상태를 다시 세우는 뜻의 ‘다시 세웁시다’로 옮겼습니다.
- source_word: τὴν καθαίρεσιν
  english_pob_choice: the ruin
  chosen_korean: 폐허
  alternatives_korean:
  - 무너짐
  - 파괴
  - 붕괴
  lexicon: LSJ
  rationale: καθαίρεσις는 ‘헐어버림, 무너뜨림’의 결과 상태를 가리키므로, 문맥상 파괴 이후의 황폐함을 드러내는 ‘폐허’가 가장 자연스럽습니다.
- source_word: τῶν ἁγίων
  english_pob_choice: the holy places
  chosen_korean: 거룩한 곳들
  alternatives_korean:
  - 거룩한 것들
  - 성소들
  - 성전의 거룩한 것들
  lexicon: LSJ
  rationale: 이 절의 역사적 문맥에서 τὰ ἅγια는 개인들을 뜻하는 ‘성도들’이 아니라 성소적·제의적 영역을 가리키므로, 특정 건물로 지나치게 한정하지 않는 복수형 ‘거룩한 곳들’을 택했습니다.
