    issue: ‘나누게 하려는’이 불필요한 사역성을 추가합니다.
    rationale: κατακληρονομῆσαι는 토지를 제비로 배분하는 행위를 가리키며, 다른 이에게 배분하게 한다는 명시적 사역 동사는 없습니다.
  revised_text: 그리고 그들의 모든 영토[a]에 이방의 아들들을 정착시키고, 그들의 땅을 제비뽑아 나누어 주려는 것입니다.
