  verdict: revise
  source_fidelity: 핵심 어휘는 대체로 충실합니다. κατοικίσαι의 사역적 의미는 ‘정착시키고’로, ἐν πᾶσι τοῖς ὁρίοις αὐτῶν은 ‘그들의 모든 영토에’로, κατακληρονομῆσαι의 제비에 따른 토지 분배는 ‘제비뽑아 나누어 주고’로 적절히 옮길 수 있습니다. 다만 초안의 ‘나누게 하려는’은 원문에 없는 사역 의미를 더합니다.
  naturalness: 초안은 병렬된 부정과거 부정사 둘을 ‘정착시키며 … 하려는 것입니다’로 연결하여 문법적 병렬과 문장 종결이 어색합니다. 두 동사를 ‘정착시키고 … 나누어 주려는 것입니다’로 병렬하면 현대 표준 한국어 합쇼체 문맥에서 자연스럽습니다.
  terminology: ‘이방의 아들들’은 그리스어의 남성 복수 명사 υἱούς를 보존하는 다소 직역적인 표현이며, 본문 정책에 부합합니다. 다만 ‘이방인들’이 문맥상 더 관용적인 뜻임을 각주에서 밝히는 것은 유익합니다. ‘낯선 자들의 아들들’보다 ‘타민족의 아들들’이 현대 한국어에서 ἀλλότριος의 외부 집단 의미를 더 명료하게 전달합니다.
  issues:
