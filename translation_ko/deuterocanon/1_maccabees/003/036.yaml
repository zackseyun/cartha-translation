  chosen_korean: 그들의 땅
  alternatives_korean:
  - 그들의 토지
  - 그들의 나라
  - 그들의 영토
  lexicon: LSJ
  rationale: γῆ는 여기서 상실될 수 있는 실제 소유지이므로, 가장 직접적인 ‘땅’이 적절합니다.
theological_decisions:
