  lexicon: LSJ
  rationale: ὅρια는 단순한 경계선보다 영역 전체를 가리킬 수 있으므로, 현대 한국어로는 ‘영토’가 가장 분명하게 범위를 전달합니다.
- source_word: κατακληρονομῆσαι
  english_pob_choice: to distribute by lot
  chosen_korean: 제비뽑아 나누게 하려는
  alternatives_korean:
