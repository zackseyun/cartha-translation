  lexicon: LSJ
  rationale: 분배의 방식이 ‘제비뽑기’임을 드러내면서, γῆ의 재분배라는 문맥을 살려 자연스럽게 표현했습니다.
- source_word: τὴν γῆν αὐτῶν
