    issue: ‘정착시키며, … 나누게 하려는 것입니다’의 병렬 및 종결이 부자연스럽습니다.
    rationale: κατοικίσαι와 κατακληρονομῆσαι는 함께 목적을 나타내는 병렬 부정사입니다. 한국어에서도 ‘정착시키고 … 나누어 주려는 것입니다’처럼 같은 문법 기능으로 연결해야 합니다.
