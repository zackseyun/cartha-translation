  yaml_path: translation/deuterocanon/1_maccabees/003/056.yaml
  text: And he said that those building a house[a], and those betrothed to women, and those planting vineyards, and the fearful, should each return to his house[b], according to the law.
  footnotes:
  - marker: a
    text: The phrase 'according to the law' likely alludes to the battle exemptions in Deuteronomy 20:5–8.
    reason: cross_reference
  - marker: b
    text: Or 'the timid' / 'the cowardly' for 'the fearful.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 집을 짓는 사람들과 여자와 약혼한 사람들과 포도밭을 심는 사람들과 두려워하는 사람들에게 말했습니다. “각자 자기 집으로 돌아가라고 하십시오. 이는 율법에 따른 것입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘율법에 따른 것입니다’는 신명기 20:5–8의 전쟁 면제 규정을 암시할 가능성이 큽니다.
    reason: cross_reference
  - marker: b
    text: δειλοῖς는 ‘두려워하는 사람들’로도, ‘겁내는 사람들’ 또는 ‘비겁한 사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδομοῦσιν οἰκίαν
  english_pob_choice: those building a house
  chosen_korean: 집을 짓는 사람들
  alternatives_korean:
  - 집을 건축하는 사람들
  - 집을 세우는 사람들
  lexicon: LSJ
  rationale: 현재분사구를 한국어로 자연스럽게 풀되, ‘οἰκίαν’의 단수성을 살려 ‘집’으로 옮겼습니다.
- source_word: μνηστευομένοις γυναῖκας
  english_pob_choice: those betrothed to women
  chosen_korean: 여자와 약혼한 사람들
  alternatives_korean:
  - 여자들에게 약혼한 사람들
  - 신붓감을 약혼한 사람들
  lexicon: LSJ
  rationale: μνηστεύω의 법적·사회적 의미를 살려 ‘약혼한’으로 옮겼고, 여성 복수형은 분배적 표현으로 이해해 자연스러운 한국어로 정리했습니다.
- source_word: δειλοῖς
  english_pob_choice: the fearful
  chosen_korean: 두려워하는 사람들
  alternatives_korean:
  - 겁내는 사람들
  - 소심한 사람들
  - 비겁한 사람들
  lexicon: LSJ
  rationale: ‘비겁한’은 도덕적 판단을 강하게 만들 수 있어, POB의 신중한 선택을 따라 상태를 묘사하는 ‘두려워하는’으로 옮겼습니다.
- source_word: κατὰ τὸν νόμον
  english_pob_choice: according to the law
  chosen_korean: 율법에 따른 것입니다
  alternatives_korean:
  - 율법에 따라
  - 법에 따른 것입니다
  lexicon: LSJ
  rationale: 본문이 단순히 ‘the law’라고 말하므로, 신명기 20:5–8의 배경을 암시하되 확장하지 않고 ‘율법’으로 간결하게 유지했습니다.
theological_decisions:
- issue: 율법의 배경을 본문에 얼마나 드러낼지
  chosen_reading: 메시아적·기독교적 확대 없이 ‘율법에 따른 것입니다’로 유지했습니다.
  alternative_readings:
  - 모세의 율법에 따른 것입니다
  - 율법에서 정한 바입니다
  rationale: 그리스어 본문은 단지 ‘율법’이라고만 말하므로, 배경 참조는 본문 밖에서 다루는 편이 더 충실합니다.
  doctrine_reference: Source fidelity over expansion; preserve allusion without importing unstated specificity.
- issue: ‘각자’와 ‘자기’의 분배적 표현
  chosen_reading: ‘각자 자기 집으로’로 분배적 의미를 살렸습니다.
  alternative_readings:
  - 각 사람이 자기 집으로
  - 각자 그의 집으로
  rationale: ἕκαστον의 분배성을 한국어에서 자연스럽게 표현하면서, 군사적 맥락의 지시문을 유지합니다.
  doctrine_reference: Gender-accurate distributive rendering in context.
