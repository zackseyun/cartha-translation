revisions:
- from: 유다와 그의 형제들은 재앙이 더 많아진 것과, 군대가 자기들의 경계 안에 진을 치고 있는 것을 보았으며, 나라의 명령들—그것이 백성을 멸망과 전멸로 몰아넣도록 내린 것—을 알아차렸습니다.[a][b]
  to: 유다와 그의 형제들은 재난이 더욱 늘어난 것[a]과 군대가 그들의 영토 안에 진을 치고 있는 것을 보았습니다. 그리고 그들은 왕권이 백성에게 멸망과 종말을 가져오도록 내린 명령들[b]을 깨달았습니다.
  rationale: 문장의 의미는 유지하면서, 주둔 장소를 자연스러운 현대 한국어로 다듬고 왕권이 명령을 내린 주체라는 원문의 구조를 명확히 했습니다. ‘멸망과 종말’은 ἀπώλεια와 συντέλεια의 강한 병렬을 보존하되, 원문보다 구체적인 집단적 ‘전멸’을 단정하지 않도록 했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:39:32Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 사건 전개는 대체로 충실하지만, ‘자기들의 경계’는 현대 한국어에서 부자연스럽고, ‘나라의 명령들—그것이 … 내린 것’은 선행사와 수식 관계가 불명확합니다. 또한 εἰς ἀπώλειαν καὶ συντέλειαν의 병렬적 종결성을 ‘멸망과 종말’로 옮기는 편이 ‘전멸’보다 원문의 표현을 더 절제되게 보존합니다.
  naturalness: 현대 표준어 합쇼체는 유지되어 있으나, 삽입 대시 안의 관계절이 길고 ‘그것’의 지시 대상이 모호합니다. 관계절을 명확한 관형절로 바꾸고 각주 표지를 해당 어구 바로 뒤에 두면 읽기가 자연스럽습니다.
  terminology: δυνάμεις는 ‘군대’, παρεμβάλλουσιν은 ‘진을 치고 있다’, βασιλεία는 인격적 왕이 아닌 왕권·통치 체제로 이해한 ‘왕권’, λόγοι는 ‘명령들’로 처리합니다. τὰ κακά는 문맥상 누적된 고난·재난을 뜻하므로 ‘재난’으로 옮깁니다.
  issues:
  - severity: medium
    issue: ‘자기들의 경계 안에’라는 표현
    rationale: αὐτῶν은 유다와 형제들의 집단을 가리키지만, 한국어 재귀 대명사 ‘자기들’은 서술 주어와의 관계가 어색하게 들릴 수 있습니다. 군대가 실제로 주둔하는 장소라는 문맥에는 ‘그들의 영토 안에’가 더 자연스럽습니다.
