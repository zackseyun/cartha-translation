    rationale: ‘그것’이 나라를 받는지 명령들을 받는지 순간적으로 불분명하며, 명령이 명령을 내린다는 식으로 읽힐 여지도 있습니다. βασιλεία를 ‘왕권’으로 명시하고 ‘왕권이 … 내린 명령들’로 고치면 원문의 통치 체제와 명령 행위를 분명히 드러냅니다.
