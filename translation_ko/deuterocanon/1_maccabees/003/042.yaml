  yaml_path: translation/deuterocanon/1_maccabees/003/042.yaml
  text: And Judas and his brothers saw that the troubles had multiplied[a], and that the forces were encamped within their borders[b]; and they recognized the orders of the kingdom that it had commanded to be carried out against the people for destruction and annihilation.
  footnotes:
  - marker: a
    text: Or 'the words/decrees of the kingdom'; the Greek uses 'kingdom' or 'royal rule' rather than directly saying 'the king.'
    reason: lexical_alternative
  - marker: b
    text: 'Literally ''to the people''; context indicates hostile intent: the orders were aimed at the people''s destruction.'
    reason: lexical_alternative
translation:
  language: ko
  text: 유다와 그의 형제들은 재앙이 더 많아진 것과, 군대가 자기들의 경계 안에 진을 치고 있는 것을 보았으며, 나라의 명령들—그것이 백성을 멸망과 전멸로 몰아넣도록 내린 것—을 알아차렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘재앙’은 여기서 도덕적 악 자체보다 전쟁과 박해가 누적되는 상황을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나라의 명령들’은 그리스어의 ‘왕국/통치 체제의 말들’을 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ κακά
  english_pob_choice: the troubles
  chosen_korean: 재앙이 더 많아진 것
  alternatives_korean:
  - 고난이 더 많아진 것
  - 악이 더 많아진 것
  - 재난이 더 많아진 것
  lexicon: LSJ
  rationale: 복수 중성형이 전쟁·정치적 압박의 증가를 가리키므로, 추상적 도덕악보다 누적되는 재앙/난국으로 옮겼습니다.
- source_word: αἱ δυνάμεις
  english_pob_choice: the forces
  chosen_korean: 군대
  alternatives_korean:
  - 군세
  - 병력
  - 군사력
  lexicon: LSJ
  rationale: 여기서는 추상적 ‘권세’가 아니라 실제 주둔하는 무장 세력을 뜻하므로, 문맥상 가장 직접적인 ‘군대’로 옮겼습니다.
- source_word: τοὺς λόγους τῆς βασιλείας
  english_pob_choice: the orders of the kingdom
  chosen_korean: 나라의 명령들
  alternatives_korean:
  - 왕국의 말들
  - 왕권의 법령들
  - 나라의 칙령들
  lexicon: LSJ
  rationale: λόγοι는 여기서 단순한 ‘말’이 아니라 공적 지시·명령의 뜻으로 쓰였고, βασιλεία는 인격적 ‘왕’보다 통치 체제 자체를 가리키므로 ‘나라의 명령들’로 옮겼습니다.
- source_word: εἰς ἀπώλειαν καὶ συντέλειαν
  english_pob_choice: for destruction and annihilation
  chosen_korean: 멸망과 전멸로
  alternatives_korean:
  - 파멸과 소멸로
  - 파괴와 완전한 끝으로
  - 멸절과 종말로
  lexicon: LSJ
  rationale: 두 명사는 결과의 강도를 겹쳐 강조하므로, 매우 강한 종결·소멸의 뜻을 한국어에서 자연스럽게 드러내는 표현을 택했습니다.
theological_decisions:
- issue: τῷ λαῷ의 방향성
  chosen_reading: 백성을 멸망과 전멸로 몰아넣도록
  alternative_readings:
  - 백성에게
  - 백성을 위하여
  - 백성을 향해
  rationale: 여격을 직역하면 대상만 나타나고 적대적 의도가 약해지므로, 이어지는 파괴 목적어와 함께 뜻이 드러나도록 ‘몰아넣도록’으로 처리했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 역사서 문체의 서술 톤
  chosen_reading: 합쇼체 서술로 평이하게 유지
  alternative_readings:
  - 문어적 고어체
  - 비격식체
  rationale: 1마카베오기는 역사 서사이므로, 현대 표준어 합쇼체를 유지해 읽기 자연성과 공적 낭독성을 함께 살렸습니다.
  doctrine_reference: Korean target style guidance
