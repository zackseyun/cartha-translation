    rationale: '[a]와 [b]가 절 끝에 함께 놓여 있어 각각 ‘재앙’ 및 ‘나라의 명령들’을 설명한다는 연결이 약합니다. 해당 낱말 뒤에 배치하는 것이 각주 앵커의 기능에 맞습니다.'
