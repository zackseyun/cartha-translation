  text: And Judas said, “It is easy for many to be shut up into the hands of a few, and in the sight of heaven there is no difference between saving by many or by few.”
  footnotes:
  - marker: a
    text: Or 'to be delivered into the hands of a few.' The Greek verb literally means 'to be shut up/enclosed,' here in the sense of being trapped in another's power.
    reason: lexical_alternative
  - marker: b
    text: '''Heaven'' likely functions as a reverential way of referring to God; compare ''before God'' as an interpretive alternative.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 유다가 말했습니다. 「많은 사람이 소수의 손에 갇히는 것은 쉬운 일이고, 하늘 앞에서는 많은 사람으로 구원하든 소수로 구원하든 차이가 없습니다。」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘소수의 손에 갇히는’은 직역하면 ‘소수의 손에 둘러싸이거나 가두어지는 것’이라는 뜻으로, 남의 권세에 붙잡히는 뉘앙스를 포함합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘하늘’은 경외적 우회 표현으로서 ‘하나님’과 비슷한 기능을 할 가능성이 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Εὔκοπόν ἐστιν
  english_pob_choice: It is easy
  chosen_korean: 쉬운 일이고
  alternatives_korean:
  - 쉽습니다
  - 어려운 일이 아닙니다
  lexicon: LSJ
  rationale: impersonal한 판단 표현을 한국어의 자연스러운 서술로 옮기되, 문맥의 단정성을 유지했습니다.
- source_word: συγκλεισθῆναι ... ἐν χερσὶν ὀλίγων
  english_pob_choice: to be shut up into the hands of a few
  chosen_korean: 소수의 손에 갇히는 것은
  alternatives_korean:
  - 소수의 손에 넘겨지는 것은
  - 소수의 손에 둘러싸여 갇히는 것은
  - 소수의 손에 포위되는 것은
  lexicon: LSJ
  rationale: συγκλεισθῆναι의 ‘가두다/봉쇄하다’ 이미지를 살리면서, ἐν χερσὶν ὀλίγων의 ‘몇 사람의 손/권세 안에’라는 힘의 귀속을 한국어로 간결하게 표현했습니다.
- source_word: ἐναντίον τοῦ οὐρανοῦ
  english_pob_choice: in the sight of heaven
  chosen_korean: 하늘 앞에서는
  alternatives_korean:
  - 하늘 보시기에
  - 하늘 앞에서
  - 하나님 앞에서는
  lexicon: LSJ
  rationale: 본문의 ‘하늘’을 그대로 살리되, 한국어에서 자연스러운 경외 표현인 ‘앞에서는’으로 옮겼습니다.
- source_word: σῴζειν ἐν πολλοῖς ἢ ἐν ὀλίγοις
  english_pob_choice: saving by many or by few
  chosen_korean: 많은 사람으로 구원하든 소수로 구원하든
  alternatives_korean:
  - 많은 사람으로 구원하시든 소수로 구원하시든
  - 많은 사람을 통해 구원하든 소수를 통해 구원하든
  - 많은 사람으로든 소수로든 구원하시든
  lexicon: LSJ
  rationale: σῴζειν을 여기서는 전투 문맥의 ‘구원/건짐’으로 이해하되, 원문이 일반적 진술형이므로 동사 반복을 살려 대구를 유지했습니다.
theological_decisions:
- issue: τοῦ οὐρανοῦ를 ‘하늘’로 유지할지 ‘하나님’으로 해석할지
  chosen_reading: 본문의 직접 표현인 ‘하늘’을 유지했습니다.
  alternative_readings:
  - 하나님 앞에서는
  - 하나님 보시기에는
  rationale: 영문 POB의 주석처럼 경외적 우회 표현일 가능성이 있지만, 본문이 실제로 ‘하늘’이라고 말하므로 한국어 본문도 그 어휘를 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
