- from: 그리고 유다가 말했습니다. 「많은 사람이 소수의 손에 갇히는 것은 쉬운 일이고, 하늘 앞에서는 많은 사람으로 구원하든 소수로 구원하든 차이가 없습니다。」[a][b]
  to: 유다가 말했습니다. “많은 이들이 적은 이들의 손에 갇히는 것은 쉬운 일이고[a], 하늘 앞에서는 많은 이들을 통해 구원하는 것이나 적은 이들을 통해 구원하는 것이나 차이가 없습니다.[b]”
