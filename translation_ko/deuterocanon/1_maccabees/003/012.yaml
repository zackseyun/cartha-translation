translation:
  language: ko
  text: 그들은 자기들의 장비를 빼앗았고, 유다는 아폴로니우스의 칼을 빼앗아, 평생 그것으로 싸웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘평생’은 문자적으로는 ‘모든 날들’이지만, 문맥상 유다의 남은 생애를 가리키는 관용으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ σκεύη
  english_pob_choice: equipment
  chosen_korean: 장비
  alternatives_korean:
  - 무기
  - 도구
  - 전리품
  lexicon: LSJ
  rationale: 군사적 문맥에서 σκεύη는 개별 품목을 특정하지 않는 ‘장비’가 가장 무난하며, 원문의 포괄성을 유지합니다.
- source_word: μάχαιραν
  english_pob_choice: sword
  chosen_korean: 칼
  alternatives_korean:
  - 검
  - 단검
  - 도
  lexicon: LSJ
  rationale: μάχαιρα는 넓게는 칼날 달린 무기를 가리키므로, 한국어에서는 과도하게 장중한 ‘검’보다 직접적인 ‘칼’이 원문의 무기 성격을 잘 살립니다.
- source_word: ἦν πολεμῶν
  english_pob_choice: he fought
  chosen_korean: 싸웠습니다
  alternatives_korean:
  - 싸우고 있었습니다
  - 계속 싸웠습니다
  - 싸워 왔습니다
  lexicon: LSJ
  rationale: 영어 POB의 최종 선택이 단순 과거 ‘fought’이므로, 한국어도 평서형 과거로 옮기되 문맥상 지속성을 해치지 않도록 하였습니다.
- source_word: πάσας τὰς ἡμέρας
  english_pob_choice: all his days
  chosen_korean: 평생
  alternatives_korean:
  - 그의 모든 날 동안
  - 모든 날
  - 남은 생애 동안
  lexicon: LSJ
  rationale: 직역하면 ‘모든 날’이지만 문맥상 유다의 남은 생애를 가리키는 관용이므로, 자연스럽고 함축을 살리는 ‘평생’이 적절합니다.
theological_decisions:
- issue: 전리품과 무기 서술의 직설성
  chosen_reading: ‘장비를 빼앗았고… 칼을 빼앗아’로 직설적으로 옮겨, 전투 서사의 물리성을 약화하지 않았습니다.
  alternative_readings:
  - ‘노획하였다’로 완곡하게 표현
  - ‘무기를 거두었다’로 일반화
  rationale: 원문은 전투 후 취득한 물품과 특정 무기를 연속해서 말하므로, 서술의 생동감을 보존하는 쪽이 본문 의도에 가깝습니다.
  doctrine_reference: 서사 본문 번역 원칙
