lexical_decisions:
- source_word: ἀποστεῖλαι ἐπʼ αὐτοὺς δύναμιν
  english_pob_choice: to send a force against them
  chosen_korean: 그들에게 병력을 보내어
  alternatives_korean:
  - 군대를 보내어
  - 무력을 보내어
  lexicon: LSJ
  rationale: δύναμιν은 여기서 추상적 ‘힘’보다 군사적 ‘병력/군대’의 뜻이므로, 대상에게 파견하는 행위를 자연스러운 한국어로 옮겼습니다.
- source_word: τοῦ ἐκρίψαι καὶ ἐξᾶραι
  english_pob_choice: to crush and remove
  chosen_korean: 짓부수고 없애며
  alternatives_korean:
  - 부수고 제거하며
  - 꺾고 없애며
  lexicon: LSJ
  rationale: 두 목적 부정사로 이어지는 폭력적 파괴와 제거의 중첩을 살리기 위해, 첫 동사는 강한 타격감의 ‘짓부수다’, 둘째는 결과적 소거의 ‘없애다’로 구분했습니다.
- source_word: τὴν ἰσχὺν Ἰσραήλ καὶ τὸ κατάλιμμα Ἰερουσαλήμ
  english_pob_choice: the strength of Israel and the remnant of Jerusalem
  chosen_korean: 이스라엘의 힘과 예루살렘의 남은 자
  alternatives_korean:
  - 이스라엘의 강함과 예루살렘의 남은 무리
  - 이스라엘의 세력과 예루살렘의 남은 자
  lexicon: LSJ
  rationale: ἰσχύς는 ‘힘/강함/세력’의 폭이 있으나, POB의 ‘strength’를 따라 ‘힘’으로 두었고, κατάλιμμα는 남아 있는 공동체를 가리키는 말이어서 ‘남은 자’로 옮겼습니다.
- source_word: ἆραι τὸ μνημόσυνον αὐτοῦ ἀπὸ τοῦ τόπου
  english_pob_choice: to take away its memory from the place
  chosen_korean: 그 이름을 그 자리에서 지워 버리게 하려는 것이었습니다
  alternatives_korean:
  - 그 기억을 그 자리에서 없애 버리게 하려는 것이었습니다
  - 그 기념을 그 자리에서 없애 버리게 하려는 것이었습니다
  lexicon: LSJ
  rationale: μνημόσυνον은 기억/기념/기념물의 범위를 가지므로, 이 문맥의 적대적 ‘삭제’ 의도를 한국어 관용으로 풀어 ‘이름을 지워 버리다’로 옮겼습니다.
theological_decisions:
- issue: μνημόσυνον의 의미 범위
  chosen_reading: ‘기억’이나 ‘기념물’로 한정하지 않고, 공동체의 이름과 존재가 지워지는 의도로 풀어 옮겼습니다.
  alternative_readings:
  - 그 기억을 없애다
  - 그 기념을 없애다
  rationale: 본문은 단순한 심리적 기억보다 역사적·공동체적 소거를 노리는 폭력을 말하므로, 한국어에서는 그 결과를 드러내는 표현이 더 적절합니다.
  doctrine_reference: 'Translation philosophy: preserve source plain sense; do not paraphrase beyond what the source warrants.'
