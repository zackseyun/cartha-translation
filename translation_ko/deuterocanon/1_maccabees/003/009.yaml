  text: And he was renowned to the ends of the earth[b][a], and he gathered those who were perishing.
  footnotes:
  - marker: a
    text: Or 'he became renowned to the ends of the earth.' The Greek literally says 'he was named,' an idiom that can refer to widespread fame or reputation.
    reason: lexical_alternative
  - marker: b
    text: Or 'he gathered the lost' / 'those being destroyed.' The Greek participle can denote people who were ruined, endangered, or perishing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 이름은 땅 끝까지 알려졌고[a], 그는 멸망해 가는 이들을 모았습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 이름은 땅 끝까지 유명해졌습니다.’ 그리스어는 문자적으로 ‘그는 이름이 붙여졌다/불렸다’는 뜻이지만, 관용적으로 널리 알려진 명성을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘멸망하고 있는 이들을 모았습니다.’ 그리스어 분사는 파멸하거나 위험에 처했거나 멸망해 가는 상태의 사람들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠνομάσθη
  english_pob_choice: was renowned
  chosen_korean: 이름이 알려졌고
  alternatives_korean:
  - 널리 유명해졌고
  - 명성이 퍼졌고
  - 이름이 불렸고
  lexicon: LSJ
  rationale: 직역하면 ‘이름을 얻다/불리다’이지만, 문맥상 단순 호칭보다 널리 알려진 명성을 가리키므로 ‘이름이 알려졌고’로 옮겨 그 관용적 의미를 살렸습니다.
- source_word: ἕως ἐσχάτου τῆς γῆς
  english_pob_choice: to the ends of the earth
