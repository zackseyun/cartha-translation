  lexicon: LSJ
  rationale: 그리스어 관용구의 확장 범위를 자연스러운 한국어 표현으로 보존하기 위해 ‘땅 끝까지’를 택했습니다.
- source_word: συνήγαγεν
  english_pob_choice: gathered
  chosen_korean: 모았습니다
  alternatives_korean:
  - 모아 들였습니다
  - 불러 모았습니다
  - 모읍했습니다
  lexicon: LSJ
  rationale: aorist의 완료된 행위를 간명하게 전달하는 기본 대응으로 ‘모았습니다’가 가장 자연스럽습니다.
- source_word: ἀπολλυμένους
  english_pob_choice: those who were perishing
  chosen_korean: 멸망해 가는 자들
  alternatives_korean:
  - 망해 가는 자들
  - 파멸해 가는 자들
  - 죽어 가는 자들
  lexicon: LSJ
  rationale: 이 분사는 단순한 감정적 ‘잃은 자들’보다 실제로 멸망/파괴의 위기에 놓인 상태를 가리키므로, 그 긴박한 진행성을 살려 ‘멸망해 가는 자들’로 옮겼습니다.
theological_decisions:
- issue: ὠνομάσθη의 의미를 단순한 호칭으로 좁힐지, 명성의 확산으로 볼지
  chosen_reading: 문맥상 ‘이름이 알려졌다’는 명성의 확산으로 이해했습니다.
  alternative_readings:
  - 그는 불리게 되었습니다
  - 그는 이름을 얻었습니다
  rationale: 군사적·서사적 맥락에서 대상의 널리 퍼진 평판을 뜻하는 관용으로 읽는 것이 자연스러우며, POB 영어도 ‘was renowned’로 그 의미를 반영합니다.
  doctrine_reference: 서사 문맥의 관용적 의미 처리
- issue: ἀπολλυμένους를 ‘잃은 자들’로 종교적으로 고정할지, 상태 묘사로 둘지
  chosen_reading: 구제나 회복 이전의 상태를 가리키는 ‘멸망해 가는 자들’로 번역했습니다.
  alternative_readings:
  - 잃은 자들
  - 파멸당하는 자들
  rationale: 이곳은 신학적 범주보다 전쟁·위기 속에서 붕괴 직전의 사람들을 묘사하는 표현이므로, 문맥에 맞게 진행 중인 파멸 상태를 드러냈습니다.
  doctrine_reference: 문맥 우선의 서사 번역
