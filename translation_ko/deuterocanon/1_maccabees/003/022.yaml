  text: And he himself will crush them before us; but as for you, do not fear them.
translation:
  language: ko
  text: 그가 직접 그들을 우리 앞에서 부수실 것입니다. 그러나 너희는 그들을 두려워하지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
