    reason: source_note
lexical_decisions:
- source_word: συντρίψει
  english_pob_choice: will crush
  chosen_korean: 부수실 것입니다
  alternatives_korean:
  - 산산이 부수실 것입니다
  - 꺾으실 것입니다
  lexicon: LSJ
  rationale: 전쟁 맥락에서의 강한 파괴·분쇄의 뜻을 살리되, 한국어로는 자연스럽고 직접적인 ‘부수다’가 힘을 잘 전달합니다.
- source_word: αὐτὸς
  english_pob_choice: he himself
  chosen_korean: 그가 직접
  alternatives_korean:
  - 그가
  - 친히
  lexicon: LSJ
  rationale: 주어의 강조를 살려 단순한 ‘그가’보다 ‘그가 직접’으로 옮겨, 승리의 결정적 주체가 사람의 힘이 아님을 드러냈습니다.
- source_word: πρὸ προσώπου ἡμῶν
  english_pob_choice: before us
  chosen_korean: 우리 앞에서
  alternatives_korean:
  - 우리의 면전에서
  - 우리 앞에
  lexicon: LSJ
  rationale: 관용구의 공간적·목격자적 뉘앙스를 살려, 적의 패배가 우리 눈앞에서 일어남을 자연스럽게 표현했습니다.
- source_word: μὴ φοβηθῆτε ἀπʼ αὐτῶν
  english_pob_choice: do not fear them
  chosen_korean: 그들을 두려워하지 마십시오
  alternatives_korean:
  - 그들을 무서워하지 마십시오
  - 그들에게서 두려워하지 마십시오
  lexicon: LSJ
  rationale: 헬라어 부정 명령의 직접성을 살려 간결한 금지형으로 옮겼고, ‘두려워하다’가 가장 표준적입니다.
theological_decisions:
- issue: 전투의 승리 주체를 어떻게 드러낼지
  chosen_reading: ‘그가 직접’으로 옮겨 승리가 하나님의 주도적 행위임을 분명히 했습니다.
  alternative_readings:
  - 단순히 ‘그가’로 옮겨 강조를 약화함
  rationale: 문맥상 용기는 인간의 전력보다 신적 개입에 근거하므로, 원문의 강조를 한국어에서도 유지하는 편이 좋습니다.
  doctrine_reference: 하나님의 주권적 구원 행위
