  text: And a strong camp of ungodly men was added and went up with him[b][a], to help him and to execute vengeance on the sons of Israel.
  footnotes:
  - marker: a
    text: Or 'a strong army of ungodly men joined him and went up with him.' The Greek παρεμβολή can denote a camp or an army.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'to execute vengeance in the sons of Israel'; here the sense is punitive action directed against Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 경건하지 않은 자들의 강한 진영이 그에게 합류하여 그와 함께 올라가, 그를 돕고 이스라엘 자손에게 보복을 가했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경건하지 않은 자들의 강한 군대가 그에게 합류하여 그와 함께 올라갔다’. 그리스어 παρεμβολή는 진영이나 군대를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘이스라엘 자손 안에서 보복을 행하다’입니다. 여기서는 이스라엘 자손을 향한 징벌적 행위를 뜻합니다.
    reason: lexical_alternative
