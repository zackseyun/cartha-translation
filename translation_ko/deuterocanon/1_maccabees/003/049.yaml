  rationale: δεκάται의 표준 성경 번역인 '십일조'가 가장 직접적이고, 제의적 헌납 항목으로도 분명합니다.
- source_word: τοὺς Ναζιραίους
  english_pob_choice: the Nazirites
  chosen_korean: 나지르인들
  alternatives_korean:
  - 나실인들
  - 나지르 서원자들
  - 나실 서원자들
  lexicon: LSJ
  rationale: 기술어를 유지하기 위해 음역을 택하되, 기존 교회 용례보다 원어 형태에 가까운 '나지르인들'로 옮겨 제도적·서원적 범주를 드러냈습니다.
- source_word: οἳ ἐπλήρωσαν τὰς ἡμέρας
  english_pob_choice: who had completed their days
  chosen_korean: 서원을 마친
  alternatives_korean:
  - 정해진 날들을 채운
  - 그 날들을 다 채운
  - 서원 기간을 마친
  lexicon: LSJ
  rationale: 직역하면 '날들을 채운'이지만, 문맥상 나지르 서원 기간의 완결을 뜻하는 관용구이므로 의미를 풀어 '서원을 마친'으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 나지르인(Ναζιραῖοι)과 서원 완료의 의미
  chosen_reading: 나지르인들을 앞으로 불러내었습니다; 서원을 마친
  alternative_readings:
  - 나실인들을 불러 세웠습니다
  - 나지르인들, 곧 서원 기간을 마친 이들을
  - 그들의 날들을 채운 나지르인들
  rationale: 이 본문은 특정 토라 기반 봉헌 범주를 가리키므로, 일반적 '헌신자'로 완화하지 않고 기술어를 유지했습니다. 동시에 끝문구는 단순한 날짜 완료가 아니라 정해진 나지르 서원 기간의 종료를 뜻하는 관용구로 이해했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve cultic-legal terminology and its covenantal precision.'
