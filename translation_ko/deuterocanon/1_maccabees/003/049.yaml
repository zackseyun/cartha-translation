  text: And they brought the priestly garments[a], and the firstfruits and the tithes; and they brought forward the Nazirites, who had completed their days.
  footnotes:
  - marker: a
    text: Or, 'who had fulfilled the days of their vow.' The Greek literally says 'who had completed the days,' an idiom for finishing the prescribed Nazirite period.
