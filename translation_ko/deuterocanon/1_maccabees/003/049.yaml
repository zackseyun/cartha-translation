  text: 그리고 그들은 제사장 예복과 첫 열매와 십일조를 가져왔으며, 정해진 날들을 채운 나실인들을 불러 세웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “날들을 채운”입니다. 이는 나실 서원의 정해진 기간을 마쳤다는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
