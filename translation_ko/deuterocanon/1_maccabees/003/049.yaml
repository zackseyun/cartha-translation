  lexicon: LSJ
  rationale: 제의적 문맥에서 πρωτογεννήματα는 첫 수확물의 봉헌을 가리키므로, 한국어 성경에서 자연스럽고 의미가 분명한 '첫 열매'를 택했습니다.
- source_word: τὰς δεκάτας
  english_pob_choice: the tithes
