base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/045.yaml
  text: And Jerusalem was uninhabited like a wilderness[a]; there was no one entering or going out from her offspring, and the sanctuary was being trampled down, and sons of foreigners were in the citadel, a lodging place for the nations; and delight was taken away from Jacob[c][b], and flute and harp ceased.
  footnotes:
  - marker: a
    text: Greek γενημάτων literally means 'offspring' or 'things born'; in context it may mean 'those born in her,' that is, her inhabitants.
    reason: lexical_alternative
  - marker: b
    text: Or 'Acra,' the fortified citadel in Jerusalem.
    reason: alternative_reading
  - marker: c
    text: '''Harp'' could also be rendered ''lyre.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 예루살렘은 광야처럼 사람이 살지 않았습니다[a]. 그녀의 후손 가운데서 드나드는 이가 없었고, 성소는 짓밟혔으며, 이방 민족의 아들들이 요새에 있었으니, 그것은 민족들 사이의 거처였습니다. 야곱에게서 기쁨이 사라졌고[c][b], 피리와 수금이 멈췄습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 γενημάτων은 문자적으로는 ‘태어난 것들/소산’이며, 문맥상 ‘그녀에게서 난 주민들’ 또는 ‘후손’으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘아크라’ — 예루살렘의 요새화된 성채를 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: ‘수금’은 ‘거문고’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀοίκητος ὡς ἔρημος
  english_pob_choice: uninhabited like a wilderness
  chosen_korean: 광야처럼 사람이 살지 않았습니다
  alternatives_korean:
  - 황무지처럼 사람이 살지 않았습니다
  - 사막처럼 사람이 살지 않았습니다
  lexicon: LSJ
  rationale: ἀοίκητος는 ‘거주하는 이가 없음’을, ὡς ἔρημος는 ‘광야/황무지 같은 상태’를 가리키므로 둘을 분리해 자연스러운 현대 한국어로 살렸습니다.
- source_word: ἐκ τῶν γενημάτων αὐτῆς
  english_pob_choice: from her offspring
  chosen_korean: 그녀의 후손 가운데서
  alternatives_korean:
  - 그녀의 주민 가운데서
  - 그녀에게서 난 이들 가운데서
  lexicon: LSJ
  rationale: γενημάτων은 직역하면 ‘태어난 것들/소산’이지만, 문맥상 도성의 공백을 가리키므로 POB의 source-note를 반영해 ‘후손’으로 옮겼습니다.
- source_word: ἄκρα
  english_pob_choice: citadel
  chosen_korean: 요새
  alternatives_korean:
  - 성채
  - 아크라
  lexicon: LSJ
  rationale: 1 Maccabees의 역사적 맥락에서 특정 성채를 가리키지만, 본문에서는 의미를 먼저 드러내기 위해 ‘요새’를 택했고, 고유명사 가능성은 각주로 보존했습니다.
- source_word: ἐν τοῖς ἔθνεσιν
  english_pob_choice: for the nations
  chosen_korean: 민족들 사이의
  alternatives_korean:
  - 이방인들의
  - 민족들을 위한
  lexicon: LSJ
  rationale: ἔθνεσιν은 여기서 ‘민족들/이방 민족들’의 범주를 가리키므로, 본문 흐름상 요새가 그들 가운데 거처가 되었다는 뜻을 자연스럽게 드러냈습니다.
- source_word: τέρψις
  english_pob_choice: delight
  chosen_korean: 기쁨
  alternatives_korean:
  - 즐거움
  - 환희
  lexicon: LSJ
  rationale: τέρψις는 단순한 쾌락보다 ‘즐거움/기쁨’의 정서를 뜻하므로, 야곱에게서 사라진 상태를 한국어로 간결하게 표현했습니다.
- source_word: κινύρα
  english_pob_choice: harp
  chosen_korean: 수금
  alternatives_korean:
  - 하프
  - 거문고
  lexicon: LSJ
  rationale: κινύρα는 현악기를 가리키며, 한국어 성경 전통과 가독성을 함께 고려해 ‘수금’으로 옮겼습니다.
theological_decisions:
- issue: 성소가 짓밟힌 상태와 예루살렘의 황폐를 병렬로 묘사하는 방식
  chosen_reading: ‘성소는 짓밟혔으며’라고 하여 물리적 훼손과 모독의 힘을 함께 살렸습니다.
  alternative_readings:
  - ‘성소가 더럽혀졌으며’
  - ‘성소가 모독되었습니다’
  rationale: καταπατούμενον은 본래 ‘발로 짓밟다’는 뜻이므로, 해석을 앞세우는 표현보다 원문의 감각을 유지하는 번역이 더 적절합니다.
  doctrine_reference: 원문 우선 번역; 의례적·신학적 함의를 해설어로 미리 좁히지 않음.
- issue: ἄκρα를 일반 명사로 옮길지 고유 지명으로 보존할지
  chosen_reading: 본문은 ‘요새’로 옮기고, 각주에서 ‘아크라’ 가능성을 보존했습니다.
  alternative_readings:
  - 아크라
  - 성채
  rationale: 본문의 이해를 우선하되, 역사적 고유명사 가능성을 지우지 않도록 이중 처리를 했습니다.
  doctrine_reference: 의미 명료화와 역사적 표지 보존의 균형.
