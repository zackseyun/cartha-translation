  text: And Judas learned of it[a], and he went out to meet him and struck him down and killed him; and many fell wounded, and the rest fled.
  footnotes:
  - marker: a
    text: Or, more literally, 'many fell wounded.' The Greek specifies wounded casualties here rather than explicitly saying 'many were killed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 유다는 그것을 알고 그를 맞으러 나가 그를 쳐서 죽였으며, 많은 이들이 부상당해 쓰러졌고, 나머지는 도망쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 여기서 ‘죽은 자들’이 아니라 ‘부상당한 이들’을 더 분명히 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  english_pob_choice: learned of it
  chosen_korean: 그것을 알고
  alternatives_korean:
  - 그 소식을 듣고
  - 알게 되고
  - 그 일을 알고
  lexicon: BDAG
  rationale: 사건을 ‘알게 되다’는 뜻을 자연스럽게 살리면서, 즉각적인 대응으로 이어지는 인식을 표현했습니다.
- source_word: ἐξῆλθεν εἰς συνάντησιν αὐτῷ
  english_pob_choice: went out to meet him
  chosen_korean: 그를 맞으러 나가
  alternatives_korean:
  - 그를 만나러 나가
  - 그에게 맞서 나가
  - 그와 대면하러 나가
  lexicon: LSJ
  rationale: 직역의 ‘맞으러 나가’를 택해 그리스어의 ‘만나러 나가다’라는 기본 의미를 유지하되, 전투 맥락도 드러나게 했습니다.
- source_word: ἐπάταξεν αὐτόν καὶ ἀπέκτεινεν
  english_pob_choice: struck him down and killed him
  chosen_korean: 그를 쳐서 죽였으며
  alternatives_korean:
  - 그를 쳐서 쓰러뜨리고 죽였으며
  - 그를 치고 죽였으며
  - 그를 내려쳐 죽였으며
  lexicon: LSJ
  rationale: 두 동사를 한국어에서도 연결해, 먼저 가한 타격과 이어지는 죽임을 한 번의 전투 서술로 자연스럽게 옮겼습니다.
- source_word: ἔπεσον τραυματίαι πολλοί
  english_pob_choice: many fell wounded
  chosen_korean: 많은 이들이 부상당해 쓰러졌고
  alternatives_korean:
  - 많은 이들이 상처 입고 쓰러졌고
  - 많은 부상자들이 쓰러졌고
  - 많은 이들이 부상당했습니다
  lexicon: LSJ
  rationale: 그리스어가 ‘죽음’보다 ‘부상당한 채 쓰러짐’을 말하므로, 부상과 낙상을 함께 살려 오독을 피했습니다.
theological_decisions:
- issue: 전투 결과를 나타내는 ‘많은 이들이 부상당해 쓰러졌다’의 해석
  chosen_reading: 본문은 많은 적군의 사망을 직접 말하지 않고, 부상당한 이들이 쓰러졌다고 말합니다.
  alternative_readings:
  - 많은 이들이 죽었다고 옮기는 해석
  - ‘fallen wounded’를 단순히 ‘많이 쓰러졌다’로 약화하는 해석
  rationale: 영문 POB 주석과 그리스어 τραυματίαι를 따라, 본문이 명시하는 것은 ‘전사’가 아니라 ‘부상당한 자들의 쓰러짐’임을 보존했습니다.
  doctrine_reference: 본문 주해의 정확성 및 서술적 절제
