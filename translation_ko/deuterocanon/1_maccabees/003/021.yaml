  - 생명
  rationale: 이 절은 영혼론을 논하는 구절이 아니라 실제 전쟁 발언이므로, 추상적·신학적 독해를 덧씌우지 않는 것이 본문의 의도에 가깝습니다.
  doctrine_reference: 원문 우선 원칙; 문맥 우선의 어휘 선택
- issue: νόμιμα의 범위
  chosen_reading: ‘법들’로 옮겨 규범의 공적 성격을 유지했습니다.
  alternative_readings:
  - 관습들
  - 율례들
  - 조상 전통
  rationale: 1 Maccabees에서 νόμιμα는 단순 습관보다 공동체를 규정하는 제도적 규범의 무게가 있어, 가장 직접적인 ‘법들’을 기본값으로 삼았습니다.
  doctrine_reference: 원문 우선 원칙; 최적 대응 번역
