  source_fidelity: 개정이 필요합니다. 초안의 ‘이스라엘과 싸우게 했습니다’는 아폴로니오스가 모은 이들을 싸우도록 시켰다는 사역 의미를 더합니다. 그리스어 τοῦ πολεμῆσαι는 그들이 이스라엘을 상대로 전쟁을 벌이기 위해 모였다는 목적을 나타냅니다. 또한 πρὸς Ἰσραήλ은 이 문맥에서 ‘이스라엘과’보다 적대 방향을 분명히 하는 ‘이스라엘을 상대로/이스라엘에 맞서’가 적절합니다.
  naturalness: ‘이방 민족들과 사마리아에서 온 큰 병력을 모아’는 두 목적어와 ‘사마리아에서’가 큰 병력의 출처임을 자연스럽게 연결합니다. ‘전쟁을 벌이기 위해’는 현대 표준어 합쇼체 서술문에 적합합니다.
  terminology: ἔθνη는 이스라엘과 대조되는 집단이라는 문맥을 반영하여 ‘이방 민족들’로 유지할 수 있습니다. δύναμιν μεγάλην은 반드시 정규 ‘군대’로 한정하지 않는 ‘큰 병력’이 원문의 군사적이면서도 넓은 뜻을 잘 보존합니다.
