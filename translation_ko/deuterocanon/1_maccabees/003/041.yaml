base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/041.yaml
  text: And the merchants of the land heard their name[a], and they took very much silver and gold, and servants, and came into the camp to take the sons of Israel as servants[c][b]. And forces from Syria and from the land of foreigners were added to them.
  footnotes:
  - marker: a
    text: Or 'their fame' or 'the report about them.' Literally, 'their name.'
    reason: lexical_alternative
  - marker: b
    text: '''Servants'' here refers to people acquired as human property; alternatively, ''slaves.'' The Greek uses the same word both for those brought along and for what the sons of Israel were to become.'
    reason: lexical_alternative
  - marker: c
    text: Or 'forces of Syria and of foreign lands joined them.'
    reason: alternative_reading
translation:
  language: ko
  text: 그 땅의 상인들은 그들에 대한 소문을 듣고[a], 매우 많은 은과 금과 종들을[b] 가지고 이스라엘의 아들들을 종으로 삼으려고 진영으로 왔습니다[b]. 그리고 시리아와 이방인들의 땅에서 온 군대가 그들에게 더해졌습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 명성’. 직역은 ‘그들의 이름’입니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘종들’과 ‘종으로’는 모두 같은 그리스어 단어를 옮긴 것입니다. 사람을 인간 재산처럼 취급하는 맥락을 가리키며, ‘노예들/노예로’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘시리아와 이방인들의 땅에서 온 군대가 그들과 합류했습니다’.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ ὄνομα αὐτῶν
  english_pob_choice: their name
  chosen_korean: 그들의 이름
  alternatives_korean:
  - 그들의 소문
  - 그들에 대한 소식
  - 그들의 명성
  lexicon: LSJ
  rationale: 직역하면 ‘그들의 이름’이지만, 문맥상 그들에 관한 소문이나 명성을 가리킬 수 있습니다. 본문에는 그리스어 관용을 살려 ‘그들의 이름’으로 두고, 자연스러운 의미는 문맥에서 읽히게 했습니다.
- source_word: παῖδας
  english_pob_choice: servants
  chosen_korean: 종들
  alternatives_korean:
  - 노예들
  - 하인들
  - 사람들
  lexicon: LSJ
  rationale: 이 단어는 ‘아이들/소년들’과 ‘종들/노예들’의 범위를 가지지만, 여기서는 사람들을 사들여 인간 재산으로 삼는 정황이므로 종속된 신분을 드러내는 번역이 필요합니다. POB의 영어 선택을 따라 한국어에서는 더 직접적인 ‘종들’을 택했습니다.
- source_word: τοὺς υἱοὺς Ἰσραὴλ
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 자손들
  lexicon: LSJ
  rationale: 그리스어의 친족적 표현을 보존하기 위해 ‘이스라엘의 아들들’로 옮겼습니다. 보다 익숙한 ‘이스라엘 자손들’도 가능하지만, 본문의 직접성을 살리기 위해 덜 평준화된 표현을 유지했습니다.
- source_word: πρὸς αὐτοὺς δυνάμεις Συρίας καὶ γῆς ἀλλοφύλων
  english_pob_choice: forces from Syria and from the land of foreigners were added to them
  chosen_korean: 시리아와 이방인의 땅의 군대가 그들에게 더해졌습니다
  alternatives_korean:
  - 시리아와 이방인의 땅에서 온 군대가 그들에게 합류했습니다
  - 시리아와 외국 땅의 군대가 그들과 함께하게 되었습니다
  lexicon: LSJ
  rationale: 수동태와 첨가 동사를 살려 ‘더해졌습니다’로 옮겼습니다. ἀλλοφύλων은 문맥상 ‘블레셋 사람들’보다 넓은 ‘이방인/외국인’이 적절하여, ‘이방인의 땅’으로 처리했습니다.
theological_decisions:
- issue: 포로화·노예화 정황에서 παῖδας의 한국어 강도
  chosen_reading: ‘종들’로 옮겨 노예화의 의미를 분명히 드러냈습니다.
  alternative_readings:
  - ‘노예들’
  - ‘하인들’
  rationale: 이 장면은 상인들이 사람들을 매매하여 신분을 박탈하는 맥락이므로, 완곡한 표현보다 종속 상태를 드러내는 번역이 본문 의도를 더 충실히 전달합니다. 다만 본문 반복어의 일관성을 위해 ‘노예들’보다 ‘종들’을 선택했습니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy §1, §5'
