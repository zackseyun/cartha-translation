revisions:
- from: 그리고 그 땅의 상인들이 그들의 이름을 듣고, 매우 많은 은과 금과 종들을 가져다가, 이스라엘의 아들들을 종으로 삼으려고 진영으로 왔습니다. 그리고 시리아와 이방인의 땅의 군대가 그들에게 더해졌습니다.[a][b][c]
  to: 그 땅의 상인들은 그들에 대한 소문을 듣고[a], 매우 많은 은과 금과 종들을[b] 가지고 이스라엘의 아들들을 종으로 삼으려고 진영으로 왔습니다[b]. 그리고 시리아와 이방인들의 땅에서 온 군대가 그들에게 더해졌습니다.[c]
  rationale: The revision replaces a wooden Korean calque with the contextually appropriate sense of the Greek idiom while retaining its literal form in a footnote. It also improves natural Korean phrasing for the origin of the forces and places every footnote anchor at its actual referent. The repeated rendering of παῖδας is retained and explicitly explained as one repeated Greek term.
