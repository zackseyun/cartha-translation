  text: And Lysias chose Ptolemy son of Dorymenes[a], Nicanor, and Gorgias, mighty men among the king’s friends.
  footnotes:
  - marker: a
    text: Or, 'from among the king’s courtiers.' In Hellenistic royal usage, 'the king’s friends' could function as a court title rather than merely indicating personal friendship.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 리시아스가 도리메네스의 아들 프톨레마이오스와 니카노르와 고르기아스를, 왕의 벗들 가운데서 뛰어난 사람들로 골랐습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘왕의 벗들’은 헬레니즘 왕실에서 단순한 개인적 친분이 아니라 궁정 칭호로 기능할 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπέλεξεν
  english_pob_choice: chose
  chosen_korean: 골랐습니다
  alternatives_korean:
  - 선택했습니다
  - 뽑았습니다
  lexicon: LSJ
  rationale: ἀρχ지휘나 임명보다 단순한 선발의 의미가 핵심이어서, 공식성은 유지하되 과도한 제도적 뉘앙스를 피하는 ‘골랐습니다’가 가장 자연스럽습니다.
- source_word: Πτολεμαῖον τὸν Δορυμένους
  english_pob_choice: Ptolemy son of Dorymenes
  chosen_korean: 도리메네스의 아들 프톨레마이오스
  alternatives_korean:
  - 도리메네스의 아들인 프톨레마이오스
  - 도리메네스의 아들 프톨레마이오스
  lexicon: LSJ
  rationale: 관사가 붙은 속격은 부자 관계로 식별하는 관용구이므로, 한국어에서도 ‘도리메네스의 아들’로 풀어 주는 것이 관계를 가장 분명하게 드러냅니다.
- source_word: ἄνδρας δυνατοὺς
  english_pob_choice: mighty men
  chosen_korean: 뛰어난 사람들
  alternatives_korean:
  - 용맹한 사람들
  - 강한 사람들
  - 유력한 사람들
  lexicon: LSJ
  rationale: 이 표현은 단순한 육체적 강함보다 왕의 측근으로서의 역량과 위세를 함께 가리킬 수 있어, 군사적 맥락을 살리면서도 한국어에서 과장되지 않게 ‘뛰어난 사람들’로 옮겼습니다.
- source_word: τῶν φίλων τοῦ βασιλέως
  english_pob_choice: from the king’s friends
  chosen_korean: 왕의 벗들 가운데서
  alternatives_korean:
  - 왕의 친구들 가운데서
  - 왕의 신하들 가운데서
  - 왕의 궁신들 가운데서
  lexicon: LSJ
  rationale: ‘왕의 벗들’은 헬레니즘 왕실에서 단순한 개인적 친구가 아니라 궁정 직함일 수 있으므로, 문자적인 ‘벗들’을 유지하되 ‘가운데서’로 그 범위를 자연스럽게 나타냈습니다.
theological_decisions:
- issue: ἄνδρας δυνατοὺς와 τῶν φίλων τοῦ βασιλέως의 사회적/정치적 함의
  chosen_reading: 이들은 단지 왕과 친분이 있는 사람들이 아니라, 왕실에서 인정받는 유력한 인물들로 읽었습니다.
  alternative_readings:
  - 단순히 왕의 개인적 친구들로 읽기
  - ‘유력한 사람들’만 강조하고 궁정 직함의 뉘앙스를 약화시키기
  rationale: 영어 POB 주석이 헬레니즘 왕실 용법에서 ‘왕의 벗들’이 궁정 칭호가 될 수 있음을 밝혔으므로, 본문은 그 사회적 지위를 보존하는 방향으로 옮기는 것이 원문 의도에 더 충실합니다.
  doctrine_reference: 역사-사회적 맥락 보존
