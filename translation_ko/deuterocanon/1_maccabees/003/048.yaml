translation:
  language: ko
  text: 그들은 율법책을 펴 놓았고, 그 책과 관련하여 민족들은 자기 우상들의 형상들을 찾고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘열었다’ 혹은 ‘말아 펼쳤다’.
    reason: lexical_alternative
  - marker: b
    text: 헬라어는 압축된 표현입니다. 뜻은 민족들이 우상들의 형상을 만들거나 그것들과 관련해 율법책을 찾았다는 식일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξεπέτασαν
  english_pob_choice: spread out
  chosen_korean: 펴 놓았고
  alternatives_korean:
  - 펼쳤고
  - 펴서 놓았고
  - 펴 보였고
  lexicon: LSJ
  rationale: 두루마리나 책을 실제로 펼쳐 넓혀 놓는 물리적 동작을 자연스럽게 살리면서, '열었다'보다 더 구체적이고 '두루마리로 말아 펼쳤다'는 식의 과잉 해석은 피했습니다.
- source_word: τὸ βιβλίον τοῦ νόμου
  english_pob_choice: the book of the law
  chosen_korean: 율법책
  alternatives_korean:
  - 율법의 책
  - 율법 두루마리
  - 율법서
  lexicon: LSJ
  rationale: 직역보다 한국어에서 자연스러운 합성어를 택하되, 토라를 가리키는 문맥을 흐리지 않도록 '율법'을 유지했습니다.
- source_word: τὰ ἔθνη
  english_pob_choice: the nations
  chosen_korean: 민족들은
  alternatives_korean:
  - 나라들은
  - 이방 민족들은
  - 이방인들은
  lexicon: LSJ
  rationale: 이 문맥에서 비이스라엘 집단을 가리키는 일반 명칭이므로, 전통적 교회어인 '이방인들'보다 원문의 집합적 뉘앙스를 살리는 '민족들'을 택했습니다.
- source_word: τὰ ὁμοιώματα τῶν εἰδώλων αὐτῶν
  english_pob_choice: the likenesses of their idols
  chosen_korean: 자기 우상들의 형상들
  alternatives_korean:
  - 자기 우상들의 모양들
  - 그들의 우상의 형상들
  - 우상들의 모습들
  lexicon: LSJ
  rationale: ὁμοιώματα의 '유사물/형상'과 εἴδωλα의 우상성을 함께 드러내기 위해 '형상들'을 선택했습니다. '모습'보다 물질적·숭배적 대상성을 더 분명히 합니다.
theological_decisions:
- issue: ‘the book of the law’와 ‘우상들의 형상들’을 잇는 압축된 구문 처리
  chosen_reading: 구문을 매끄럽게 풀어쓰지 않고, 율법책과 이방 민족들의 우상 형상 사이의 연결이 다소 압축된 상태로 남도록 옮겼습니다.
  alternative_readings:
  - 그들은 율법책을 펴고, 그 안에서 자기 우상들의 형상을 찾았습니다.
  - 그들은 율법책을 펼쳐 놓았는데, 민족들은 자기 우상들의 형상을 찾고 있었습니다.
  rationale: 헬라어가 의도적으로 압축된 표현이므로, 해석을 과도하게 확정하기보다 독자가 원문의 긴장을 느끼도록 보존했습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
