  text: When Antiochus the king heard these words[a], he became furiously angry, and he sent out and gathered all the forces of his kingdom, a very strong camp.
  footnotes:
  - marker: a
    text: Or 'a very strong encampment' or 'an exceedingly strong army camp.' The Greek παρεμβολή can denote the camp itself or the encamped force.
    reason: lexical_alternative
translation:
  language: ko
  text: 안티오코스 왕이 이 말을 들었을 때, 그는 몹시 분노하고 자기 왕국의 모든 군대를 보내어, 매우 강한 진을 모았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ἀντίοχος ὁ βασιλεύς는 고유명사와 호칭을 함께 둔 표현입니다. 여기서는 문맥상 ‘안티오코스 왕’으로 자연스럽게 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: Ὡς δὲ ἤκουσεν
  english_pob_choice: When ... heard
  chosen_korean: 이 말을 들었을 때
  alternatives_korean:
  - 이 말을 듣자
  - 그 말을 들었을 때
  lexicon: LSJ
  rationale: 시간 전환을 자연스럽게 살리되, λόγους τούτους의 구체성을 유지하기 위해 단순한 ‘들었다’보다 ‘이 말을 들었을 때’로 옮겼습니다.
- source_word: ὠργίσθη θυμῷ
  english_pob_choice: became furiously angry
  chosen_korean: 몹시 분노하고
  alternatives_korean:
  - 격노하고
  - 심히 노하여
  lexicon: LSJ
  rationale: θυμῷ가 분노의 강도를 겹쳐 강조하므로, 단순한 ‘화가 났다’보다 강한 ‘몹시 분노하고’로 옮겨 중첩된 격앙을 살렸습니다.
- source_word: ἀπέστειλεν καὶ συνήγαγεν
  english_pob_choice: he sent out and gathered
  chosen_korean: 보내어 ... 모았습니다
  alternatives_korean:
  - 파견하여 ... 모았습니다
  - 보내고 ... 집결시켰습니다
  lexicon: LSJ
  rationale: ἀπέστειλεν의 방향성을 살려 ‘보내어’로, συνήγαγεν은 군사적 집결을 자연스럽게 드러내는 ‘모았습니다’로 옮겼습니다.
- source_word: τὰς δυνάμεις πάσας τῆς βασιλείας αὐτοῦ
  english_pob_choice: all the forces of his kingdom
  chosen_korean: 자기 왕국의 모든 군대
  alternatives_korean:
  - 그 왕국의 모든 병력
  - 자기 나라의 모든 병력
  lexicon: LSJ
  rationale: δυνάμεις는 여기서 추상적 ‘권세’가 아니라 군사력/병력을 가리키므로, 현대 한국어 독자를 위해 ‘군대’로 분명하게 옮겼습니다.
- source_word: παρεμβολὴν ἰσχυρὰν σφόδρα
  english_pob_choice: a very strong camp
  chosen_korean: 매우 강한 진
  alternatives_korean:
  - 아주 강한 야영지
  - 극히 강한 군영
  lexicon: LSJ
  rationale: παρεμβολή는 ‘진영/야영지/군영’이 가능하지만, 본절의 병력 집결 맥락에서는 간결한 ‘진’이 가장 직접적입니다.
theological_decisions:
- issue: 군사 집결의 묘사와 어조
  chosen_reading: 본절은 안티오코스의 분노가 곧바로 대규모 군사 동원으로 이어지는 장면을 직설적으로 살려, 완곡하게 줄이지 않았습니다.
  alternative_readings:
  - 분노의 결과를 부드럽게 서술하는 방식
  - 군사적 뉘앙스를 약화한 일반적 집결 표현
  rationale: 본문의 긴박감과 폭력성을 보존하는 것이 서술 의도에 더 부합합니다.
  doctrine_reference: '역사서 본문 번역 원칙: 서술의 긴장과 행위의 즉시성을 보존'
