  source_fidelity: 초안은 ἀπέστειλεν의 목적어가 생략된 점을 ‘자기 왕국의 모든 군대를 보내어’로 처리하여, 안티오코스가 병력을 파견한 뒤 진을 모았다는 뜻이 되게 합니다. 그러나 그리스어는 그가 사람들을 보내고 모든 병력을 소집하여 매우 강력한 παρεμβολή를 이루었다는 연쇄를 나타냅니다. 이를 분명히 하되, παρεμβολή의 ‘진영/진을 친 군대’라는 어휘적 범위는 각주로 보존했습니다.
  naturalness: 합쇼체 문체는 대체로 적절하지만, ‘모든 군대를 보내어, 매우 강한 진을 모았습니다’는 현대 한국어에서 목적어와 행위 관계가 부자연스럽고 의미가 혼동됩니다. ‘병력을 모으도록 전령들을 보내고 … 진영을 꾸렸습니다’는 자연스럽고 서사 흐름도 명확합니다.
