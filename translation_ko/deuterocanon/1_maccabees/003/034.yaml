translation:
  language: ko
  text: 그는 그에게 군대의 절반과 코끼리들을 넘겨주고, 그가 바라는 모든 일에 대해, 또 유대와 예루살렘에 거주하는 모든 사람에 대해 그에게 명령을 내렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 ‘군대의 절반’으로 이해할 수 있지만, 헬라어 표현은 권한 아래 들어간 군사 자산의 이전을 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그가 원하는 모든 것에 관하여’입니다. 헬라어는 왕이 무엇을 원했는지의 대상을 생략합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέδωκεν
  english_pob_choice: handed over
  chosen_korean: 넘겨주고
  alternatives_korean:
  - 맡겨주고
  - 건네주고
  - 인도하고
  lexicon: BDAG
  rationale: 지휘권과 처분권의 이전을 자연스러운 한국어로 살리기 위해 ‘넘겨주다’를 택했습니다. ‘맡겨주다’는 위탁의 뉘앙스가 강하고, ‘인도하다’는 다소 전통적·문어적입니다.
- source_word: τὰς ἡμίσεις τῶν δυνάμεων
  english_pob_choice: half of the forces
  chosen_korean: 군대의 절반
  alternatives_korean:
  - 병력의 절반
  - 전력의 절반
  - 군세의 절반
  lexicon: LSJ
  rationale: 복수형 ‘forces’의 군사적 총력을 한국어로는 ‘군대’ 또는 ‘병력’으로 옮길 수 있으나, 본문 흐름상 전군의 절반을 뜻하므로 가장 간결한 ‘군대의 절반’이 적절합니다.
- source_word: ἐλέφαντας
  english_pob_choice: elephants
  chosen_korean: 코끼리들
  alternatives_korean:
  - 전투 코끼리들
  - 코끼리 부대
  - 전쟁 코끼리들
  lexicon: LSJ
  rationale: 헬라어 본문 자체는 단순히 ‘코끼리들’이라고 말하므로, 기능을 덧붙이지 않고 그대로 옮겼습니다. 군사적 맥락은 앞뒤 문맥이 이미 충분히 보여 줍니다.
- source_word: ἐβούλετο
  english_pob_choice: desired / wanted
  chosen_korean: 바라는
  alternatives_korean:
  - 원하는
  - 원하던
  - 뜻하는
  lexicon: BDAG
  rationale: 주체의 의지와 바람을 나타내는 말로, 공문체에 맞게 ‘바라는’으로 옮겼습니다. ‘원하는’도 가능하지만, 과거 맥락의 간접화법에서는 ‘바라는’이 더 자연스럽습니다.
- source_word: τῶν κατοικούντων τὴν Ἰουδαίαν καὶ Ἰερουσαλήμ
  english_pob_choice: those dwelling in Judea and Jerusalem
  chosen_korean: 유대와 예루살렘에 거주하는 모든 사람
  alternatives_korean:
  - 유대와 예루살렘에 사는 모든 이
  - 유대와 예루살렘에 거주하는 자들
  - 유대와 예루살렘의 주민들
  lexicon: BDAG
  rationale: 분사구를 실질적으로 명사화하여 거주 대상을 분명히 했습니다. ‘거주하는’의 형식은 살리되, 현대 한국어에서는 ‘모든 사람’으로 풀어 주는 편이 더 읽기 쉽습니다.
theological_decisions:
- issue: 본절의 정치·군사적 이전 표현
  chosen_reading: ‘넘겨주다’와 ‘명령을 내리다’를 사용해 권한 이양과 통제의 강도를 그대로 드러냈습니다.
  alternative_readings:
  - ‘맡겨주다’로 부드럽게 처리
  - ‘지시했다’로 완화
  rationale: 본문은 단순한 호의적 위임이 아니라 군사력과 통치 명령의 이전을 묘사하므로, 관계의 힘과 책임 이전을 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: 문맥상 역사 서술; 본문 의미 보존 원칙
- issue: ‘코끼리들’의 군사적 함의
  chosen_reading: 본문에 없는 설명을 덧붙이지 않고 단순히 ‘코끼리들’로 옮겼습니다.
  alternative_readings:
  - ‘전쟁 코끼리들’로 구체화
  - ‘전투 코끼리들’로 설명
  rationale: 군사적 용도는 문맥에서 충분히 드러나므로, 원문에 없는 설명어를 넣어 의미를 과잉 특정하지 않았습니다.
  doctrine_reference: 본문 충실성 원칙
