translation:
  language: ko
  text: 그는 그에게 군대의 절반과 코끼리들을 넘겨주었습니다.[a] 그리고 그에게 그가 바라는 모든 것[b]과 유대와 예루살렘에 거주하는 모든 사람에 관하여 명령을 내렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘군대의 절반과 코끼리들을 그에게 맡겼습니다.’ 헬라어 동사는 이를 그의 관리 아래로 넘기는 뉘앙스를 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그가 원하는 모든 것에 관하여’입니다. 그가 무엇을 바랐는지는 헬라어 본문에 명시되어 있지 않습니다.
    reason: lexical_alternative
