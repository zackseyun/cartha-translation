  source_fidelity: 핵심 의미는 충실합니다. παρέδωκεν의 권한·통제권 이전, ‘군대/병력의 절반과 코끼리들’, 그리고 두 개의 περὶ 구문이 모두 반영되었습니다. 다만 ‘모든 일’은 원문의 포괄적인 πάντων보다 다소 좁으므로 ‘모든 것’이 더 충실합니다.
  naturalness: 합쇼체와 역사 서술 문체는 자연스럽습니다. 그러나 ‘그가 바라는 모든 일에 대해, 또 … 모든 사람에 대해 그에게’는 수식 범위와 ‘그에게’의 연결이 다소 멀어집니다. 목적·관련 사항을 한데 묶어 어순을 정리하면 더 자연스럽고 명료합니다.
  terminology: ‘넘겨주다’, ‘군대의 절반’, ‘코끼리들’, ‘거주하는 모든 사람’은 현대 표준어로 적절합니다. 원문에 없는 ‘전투’ 등의 설명을 보태지 않은 점도 좋습니다.
