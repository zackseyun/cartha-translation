  yaml_path: translation/deuterocanon/1_maccabees/003/013.yaml
  text: And Seron[a], the commander of the army of Syria, heard that Judas had gathered a company and an assembly of the faithful with him[b], and of those going out to war.
  footnotes:
  - marker: a
    text: Or 'a band' for 'a company'; the Greek ἄθροισμα denotes an assembled group and may carry a more martial nuance in context.
    reason: lexical_alternative
  - marker: b
    text: '''The faithful'' may also be understood as ''the loyal,'' highlighting commitment to Judas''s cause as well as covenantal fidelity.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 시리아 군대의 지휘관 세론은 유다가 자기와 함께 싸우러 나가는 무리와 충성된 자들의 회중을 모았다는 소식을 들었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무리’는 여기서 ἄθροισμα의 집합체 의미를 살린 번역이며, 문맥상 ‘무장한 무리’라는 뉘앙스를 띨 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘충성된 자들’은 ‘신실한 자들’로도 옮길 수 있으며, 유다의 대의에 대한 충성과 언약적 신실함을 함께 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἄρχων τῆς δυνάμεως Συρίας
  english_pob_choice: the commander of the army of Syria
  chosen_korean: 시리아 군대의 지휘관
  alternatives_korean:
  - 시리아 군대의 사령관
  - 시리아의 군사 지휘관
  lexicon: LSJ
  rationale: ἄρχων은 여기서 통치자보다 군사 지휘관을 가리키므로, 영어 POB의 뜻을 따라 지휘관으로 옮겼습니다.
- source_word: ἄθροισμα
  english_pob_choice: a company
  chosen_korean: 무리
  alternatives_korean:
  - 모임
  - 군세
  - 편
  lexicon: LSJ
  rationale: ἄθροισμα는 모여 형성된 집단을 뜻하며, 문맥상 지나치게 군사화하지 않으면서도 집단성을 살리기 위해 무리로 옮겼습니다.
- source_word: ἐκκλησίαν πιστῶν
  english_pob_choice: an assembly of the faithful
  chosen_korean: 충성된 자들의 회중
  alternatives_korean:
  - 신실한 자들의 회중
  - 믿는 자들의 모임
  - 충성스러운 무리의 집회
  lexicon: LSJ
  rationale: 이 문맥의 ἐκκλησία는 후대의 제도적 ‘교회’가 아니라 모인 회중이므로 회중으로 옮겼고, πιστῶν은 언약에 대한 신실함과 가담한 충성을 함께 담아 충성된 자들로 옮겼습니다.
- source_word: ἐκπορευομένων εἰς πόλεμον
  english_pob_choice: of those going out to war
  chosen_korean: 싸우러 나가는
  alternatives_korean:
  - 전쟁터로 나아가는
  - 전쟁하러 나가는
  - 전투에 나가는
  lexicon: LSJ
  rationale: 분사구는 앞의 집단을 수식하는 추가 설명이므로, 한국어에서는 자연스럽게 ‘싸우러 나가는’으로 풀어 전체 의미를 살렸습니다.
theological_decisions:
- issue: ἐκκλησία의 번역을 유대 전쟁 문맥에서 어떻게 처리할 것인가
  chosen_reading: 회중
  alternative_readings:
  - 교회
  - 회당
  rationale: 둘째 성전기 유대 문맥에 후대 기독교 제도어를 들이지 않기 위해, 영어 POB의 ‘assembly’를 반영해 회중을 선택했습니다.
  doctrine_reference: 'DOCTRINE.md: 원문 문맥의 평이한 의미를 따르고, 후대 교회 용어를 무비판적으로 이식하지 말 것.'
