    text: Or 'stand against them' or 'withstand them'; the Greek expression can carry the sense of facing opponents in conflict.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리가 어떻게 그들 앞에서 버틸 수 있겠습니까? 당신께서 우리를 도와주시지 않으면 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들에 맞서 버티다’라는 뜻일 수 있습니다. 헬라어 표현은 적대자와의 대면·충돌 상황을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: πῶς δυνησόμεθα
  english_pob_choice: How will we be able
  chosen_korean: 어떻게 ... 버틸 수 있겠습니까
  alternatives_korean:
  - 어떻게 ... 서 있을 수 있겠습니까
  - 어떻게 ... 견뎌낼 수 있겠습니까
  lexicon: LSJ; BDAG
  rationale: 능력의 가능성을 묻는 수사 의문이므로, 현대 한국어에서는 자연스럽게 ‘버틸 수 있겠습니까’로 옮겨 가능성과 압박을 함께 드러냈습니다.
- source_word: ὑποστῆναι κατὰ πρόσωπον αὐτῶν
  english_pob_choice: stand before them
  chosen_korean: 그들 앞에서 버틸 수
  alternatives_korean:
  - 그들 앞에 설 수
  - 그들 앞에서 맞설 수
  lexicon: LSJ
  rationale: 문자적인 ‘서다’보다, 적대적 대면에서의 버팀이라는 뜻이 분명하므로 ‘버티다’를 사용해 전투적 긴장을 살렸습니다.
- source_word: ἐὰν μὴ σὺ βοηθήσῃς ἡμῖν
  english_pob_choice: unless you help us
  chosen_korean: 당신께서 우리를 도와주시지 않으면 말입니다
  alternatives_korean:
  - 당신께서 우리를 도우시지 않으면 말입니다
  - 당신이 우리를 돕지 않으시면 말입니다
  lexicon: BDAG
  rationale: 직접적인 호소를 살리기 위해 2인칭을 유지했고, 합쇼체 기도/간구 맥락에 맞게 ‘도와주시다’로 공손성을 표현했습니다.
theological_decisions:
- issue: 전투적 수사와 기도적 의존의 유지
  chosen_reading: 문장을 전투 상황의 절박한 간구로 유지하고, 하나님의 개입 필요성을 직접적으로 말하게 했습니다.
  alternative_readings:
  - 우리가 어떻게 그들 앞에 설 수 있겠습니까? 당신께서 우리를 도우시지 않으면 말입니다.
  rationale: 헬라어 원문의 질문은 단순 가능성보다 맞닥뜨린 적 앞에서의 생존/버팀을 묻는 표현이므로, 그 긴장과 의존을 완화하지 않았습니다.
  doctrine_reference: 원문 긴장 보존; 번역 전통에 의한 완화보다 원어 의미 우선
