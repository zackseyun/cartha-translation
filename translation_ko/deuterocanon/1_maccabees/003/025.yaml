  source_fidelity: 핵심 의미는 대체로 충실합니다. φόβος의 속격을 ‘유다와 그의 형제들에 대한 두려움’으로 이해한 것은 문맥과 맞고, ἐπίπτεν의 미완료상도 지속 표현으로 살렸습니다. 다만 πτῶσις ἐπίπτεν을 ‘몰락이 계속 떨어지고’로 옮긴 표현은 한국어에서 부자연스러우므로, ‘몰락이 계속 닥치고’로 고쳐 원문의 재난이 주변 나라들 위에 계속 임하는 모습을 자연스럽게 전달해야 합니다.
