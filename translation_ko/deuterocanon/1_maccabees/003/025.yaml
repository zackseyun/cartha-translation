  text: 그리고 유다와 그의 형제들에 대한 두려움이 시작되었고, 그들의 주변 나라들 위로 몰락이 계속 떨어지고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '유다와 그의 형제들에 대한 두려움이 생겨났다'라는 뜻으로, 그들에 대한 공포가 다른 이들 사이에 퍼졌다는 의미입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '주변 나라들 위에 몰락이 계속 떨어지고 있었다'라는 뜻으로, 그리스어 미완료시상은 지속되는 움직임을 시사합니다.
    reason: lexical_alternative
