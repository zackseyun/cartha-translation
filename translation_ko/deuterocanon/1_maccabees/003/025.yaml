  terminology: ‘유다’, ‘형제들’, ‘두려움’, ‘주변 나라들’은 적절합니다. ἔθνη는 이 문맥에서 ‘나라들’로 번역해도 무방합니다. πτῶσις는 ‘몰락’으로 유지할 수 있으나, 동반 동사는 ‘떨어지다’보다 ‘닥치다’가 자연스럽습니다.
