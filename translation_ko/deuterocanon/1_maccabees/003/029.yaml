- source_word: πληγῆς
  english_pob_choice: the blow
  chosen_korean: 재앙
  alternatives_korean:
  - 타격
  - 재난
  - 상처
  lexicon: LSJ
  rationale: πληγή는 문자적으로 ‘타격/상처’이지만, 문맥상 그가 땅에 가져온 해악을 가리키므로 한국어에서는 ‘재앙’이 자연스럽고 의미를 잘 전달합니다.
- source_word: τὰ νόμιμα
  english_pob_choice: the customs
  chosen_korean: 관습들을
  alternatives_korean:
  - 율례들을
  - 규례들을
  - 법규들을
  lexicon: LSJ
  rationale: νόμιμα는 여기서 오랜 관행·제도를 뜻하므로, ‘관습들’이 문맥을 과장하지 않으면서도 지속된 제도성을 드러냅니다.
theological_decisions:
- issue: διχοστασία와 πληγή의 정치·공동체적 성격
  chosen_reading: 이 구절은 단순한 행정적 부족이 아니라 분열과 재앙으로 인한 사회·재정 붕괴를 묘사하는 것으로 읽었습니다.
  alternative_readings:
