  - πληγῆ를 단순한 물리적 타격으로만 보는 읽기
  rationale: 문맥상 연속된 원인절이 나라의 질서와 수입이 무너진 상황을 설명하므로, 공동체적 붕괴의 뉘앙스를 보존해야 합니다.
