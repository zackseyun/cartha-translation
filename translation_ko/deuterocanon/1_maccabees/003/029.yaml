  lexicon: LSJ
  rationale: φόροι는 단순 세금만이 아니라 국가/영토의 재정 수입을 가리킬 수 있어, POB의 ‘taxes’보다 넓은 의미를 살린 ‘수입’으로 옮겼습니다.
- source_word: διχοστασίας
  english_pob_choice: division
  chosen_korean: 분열
