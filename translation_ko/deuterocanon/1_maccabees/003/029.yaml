base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/029.yaml
  text: And he saw that the silver had run out from the treasuries[a], and that the taxes of the country were few because of the division and the blow that he had brought upon the land[b], by removing the customs that had existed from former days.
  footnotes:
  - marker: a
    text: Or 'because of the dissension and the calamity that he had inflicted on the land.' The Greek terms can carry broader political and punitive overtones than the more literal 'division' and 'blow.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the established laws' or 'the ancestral customs.' The Greek refers to long-standing norms or ordinances that had been in place from earlier times.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 또한 국고의 은이 바닥난 것과, 그 땅의 세입이 분열과 그가 옛적부터 있던 규례들을 없애기 위하여 그 땅에 내린 재앙[a] 때문에 적어진 것을 보았습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불화와 그가 그 땅에 가한 재앙 때문에’로 옮길 수 있습니다. 그리스어 표현은 단순한 분열이나 타격보다 넓은 정치적·징벌적 뉘앙스를 지닐 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘없애기 위하여’는 그가 땅에 재앙을 내린 목적을 나타냅니다. ‘규례들’은 오래전부터 시행되어 온 제도나 관행을 가리키며, 또는 ‘오래된 관습들’로 옮길 수 있습니다.
    reason: grammar_and_lexical_alternative
lexical_decisions:
- source_word: ἐξέλιπεν τὸ ἀργύριον ἀπὸ τῶν θησαυρῶν
  english_pob_choice: the silver had run out from the treasuries
  chosen_korean: 은이 곳간들에서 다 떨어진 것을
  alternatives_korean:
