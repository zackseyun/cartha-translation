  yaml_path: translation/deuterocanon/1_maccabees/003/029.yaml
  text: And he saw that the silver had run out from the treasuries[a], and that the taxes of the country were few because of the division and the blow that he had brought upon the land[b], by removing the customs that had existed from former days.
  footnotes:
  - marker: a
    text: Or 'because of the dissension and the calamity that he had inflicted on the land.' The Greek terms can carry broader political and punitive overtones than the more literal 'division' and 'blow.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the established laws' or 'the ancestral customs.' The Greek refers to long-standing norms or ordinances that had been in place from earlier times.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 은이 곳간들에서 다 떨어진 것을 보았고, 그 땅의 수입이 분열과 그가 그 땅에 가져온 재앙 때문에 적었으며, 옛날부터 있던 관습들을 없앴습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불화와 그가 그 땅에 가한 재앙 때문에’로 옮길 수 있습니다. 그리스어 표현은 보다 넓은 정치적·징벌적 뉘앙스를 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘오래된 규례들’로 볼 수 있습니다. νόμιμα는 여기서 오래 유지된 제도나 관행을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέλιπεν τὸ ἀργύριον ἀπὸ τῶν θησαυρῶν
  english_pob_choice: the silver had run out from the treasuries
  chosen_korean: 은이 곳간들에서 다 떨어진 것을
  alternatives_korean:
  - 은이 국고에서 고갈된 것을
  - 은이 재무 창고들에서 바닥난 것을
  lexicon: LSJ
  rationale: ἀργύριον의 문자적 ‘은’과 θησαυροί의 복수성을 살리되, 현대 한국어에서는 ‘곳간들’이 저장고의 다수성을 자연스럽게 드러냅니다.
- source_word: οἱ φόροι τῆς χώρας
  english_pob_choice: the taxes of the country
  chosen_korean: 그 땅의 수입이
  alternatives_korean:
  - 그 나라의 세금이
  - 그 지역의 조세가
  lexicon: LSJ
  rationale: φόροι는 단순 세금만이 아니라 국가/영토의 재정 수입을 가리킬 수 있어, POB의 ‘taxes’보다 넓은 의미를 살린 ‘수입’으로 옮겼습니다.
- source_word: διχοστασίας
  english_pob_choice: division
  chosen_korean: 분열
  alternatives_korean:
  - 불화
  - 분쟁
  lexicon: LSJ
  rationale: διχοστασία는 공동체적 분열과 내적 갈등을 가리키므로, 정치적·사회적 파장을 함께 담는 ‘분열’이 적절합니다.
- source_word: πληγῆς
  english_pob_choice: the blow
  chosen_korean: 재앙
  alternatives_korean:
  - 타격
  - 재난
  - 상처
  lexicon: LSJ
  rationale: πληγή는 문자적으로 ‘타격/상처’이지만, 문맥상 그가 땅에 가져온 해악을 가리키므로 한국어에서는 ‘재앙’이 자연스럽고 의미를 잘 전달합니다.
- source_word: τὰ νόμιμα
  english_pob_choice: the customs
  chosen_korean: 관습들을
  alternatives_korean:
  - 율례들을
  - 규례들을
  - 법규들을
  lexicon: LSJ
  rationale: νόμιμα는 여기서 오랜 관행·제도를 뜻하므로, ‘관습들’이 문맥을 과장하지 않으면서도 지속된 제도성을 드러냅니다.
theological_decisions:
- issue: διχοστασία와 πληγή의 정치·공동체적 성격
  chosen_reading: 이 구절은 단순한 행정적 부족이 아니라 분열과 재앙으로 인한 사회·재정 붕괴를 묘사하는 것으로 읽었습니다.
  alternative_readings:
  - 세금 감소에만 초점을 두는 읽기
  - πληγῆ를 단순한 물리적 타격으로만 보는 읽기
  rationale: 문맥상 연속된 원인절이 나라의 질서와 수입이 무너진 상황을 설명하므로, 공동체적 붕괴의 뉘앙스를 보존해야 합니다.
  doctrine_reference: 역사서 문맥 이해
