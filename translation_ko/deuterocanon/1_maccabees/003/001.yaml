lexical_decisions:
- source_word: ἀνέστη
  english_pob_choice: rose up
  chosen_korean: 일어났습니다
  alternatives_korean:
  - 일어섰습니다
  - 나섰습니다
  - 등장했습니다
  lexicon: LSJ
