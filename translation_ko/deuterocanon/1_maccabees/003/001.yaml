translation:
  language: ko
  text: 그리고 마카베오라고 불린 유다, 그의 아들이 그를 대신하여 일어났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 Μακκαβαῖος의 음역입니다. 전통적 영어 표기는 ‘Maccabee’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέστη
  english_pob_choice: rose up
  chosen_korean: 일어났습니다
  alternatives_korean:
  - 일어섰습니다
  - 나섰습니다
  - 등장했습니다
  lexicon: LSJ
  rationale: 여기서는 단순한 기립보다 앞선 인물의 뒤를 이어 행동이 시작되었다는 서사적 움직임이 핵심이므로, 자연스러운 현대 한국어로 ‘일어났습니다’를 택했습니다.
- source_word: ὁ καλούμενος Μακκαβαῖος
  english_pob_choice: who was called Maccabeus
  chosen_korean: 마카베오라고 불린
  alternatives_korean:
  - 마카베오라고 불리는
  - 마카베우스라고 불린
  - 마카베오라는 별칭의
  lexicon: BDAG / LSJ
  rationale: 그리스어 분사구는 별칭·호칭을 식별하는 표현이므로 ‘…라고 불린’으로 옮겨 이름 뒤에 붙는 수식을 살렸습니다. ‘마카베오’는 Greek Μακκαβαῖος의 음역을 반영한 형태입니다.
- source_word: ἀντʼ αὐτοῦ
  english_pob_choice: in his place
  chosen_korean: 그를 대신하여
  alternatives_korean:
  - 그의 자리에
  - 그 자리를 이어
  - 그의 뒤를 이어
  lexicon: BDAG
  rationale: ἀντί + 속격은 대체·대신의 뜻을 나타내므로, 한국어에서 가장 직접적인 ‘그를 대신하여’로 옮겼습니다. 이것은 공식적 계승을 단정하기보다 대체의 의미를 보존합니다.
theological_decisions:
- issue: 유다의 등장과 계승의 강도
  chosen_reading: ‘일어났습니다’와 ‘그를 대신하여’로, 서술은 유지하되 제도적 즉위를 과도하게 강하게 말하지 않았습니다.
  alternative_readings:
  - ‘그를 이어 일어났습니다’
  - ‘그의 뒤를 이어 일어섰습니다’
  - ‘그를 대신해 일어났습니다’
  rationale: 원문은 아버지 뒤를 잇는 등장을 말하지만, 기술적 즉위 용어를 쓰지는 않습니다. 따라서 계승의 의미는 살리되, 문맥 이상의 정치·제도적 함의를 덧붙이지 않았습니다.
  doctrine_reference: 원문 우선 원칙; 의미의 강도는 원문의 범위 안에서만 유지
