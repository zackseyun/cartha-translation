- from: 그는 유다의 여러 성읍을 지나며 그곳의 불경한 자들을 멸하고, 이스라엘에서 진노를 돌려놓았습니다.[a][b]
  to: 그는 유다의 성읍들을 두루 다니며 그곳의 불경건한 자들을 멸하고, 이스라엘에게서 진노를 돌이켰습니다.[a][b]
  rationale: ἀπέστρεψεν ὀργὴν ἀπὸ Ἰσραήλ의 방향을 자연스럽고 정확하게 반영하도록 ‘이스라엘에게서 진노를 돌이켰습니다’로 고쳤습니다. ἀσεβεῖς의 종교적 의미를 더 분명히 하기 위해 ‘불경건한 자들’로 조정했습니다. ‘두루 다니며’는 διῆλθεν이 복수의 성읍을 통과해 다닌 동작을 자연스럽게 나타내며, 진노의 주체는 본문처럼 명시하지 않았습니다.
