  source_fidelity: 전반적으로 헬라어의 사건 순서와 의미를 충실히 반영합니다. 다만 ἀπέστρεψεν ὀργὴν ἀπὸ Ἰσραήλ은 진노를 이스라엘에게서 ‘돌려 놓았다’가 아니라 이스라엘에게서 ‘돌이켰다/거두었다’는 뜻이므로, 현행 표현은 방향성과 한국어 의미가 부정확합니다.
  naturalness: ‘돌려놓았습니다’는 현대 표준 한국어에서 진노를 이스라엘로 되돌려 놓는 듯하게 들리며 부자연스럽습니다. ‘이스라엘에게서 진노를 돌이켰습니다’가 자연스럽고 원문의 제거·회피 방향을 분명히 합니다.
