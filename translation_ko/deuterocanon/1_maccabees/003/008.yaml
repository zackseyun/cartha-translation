translation:
  language: ko
  text: 그는 유다의 성읍들을 두루 다니며 그곳의 불경건한 자들을 멸하고, 이스라엘에게서 진노를 돌이켰습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘불경건한 자들’은 ‘불경한 자들’, ‘경건하지 않은 자들’ 또는 ‘악한 자들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘진노’는 문맥상 하나님의 진노를 가리킬 가능성이 크지만, 본문은 하나님을 직접 언급하지 않습니다.
    reason: theological_note
