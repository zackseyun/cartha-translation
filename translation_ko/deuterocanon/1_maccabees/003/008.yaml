  text: And he went through the cities of Judah[a], and destroyed the ungodly from it[b], and turned away wrath from Israel.
  footnotes:
  - marker: a
    text: Or 'the impious' or 'the wicked' for 'the ungodly.'
    reason: lexical_alternative
  - marker: b
    text: '''Wrath'' likely refers to divine wrath in context, though the verse does not explicitly name God.'
    reason: alternative_reading
translation:
  language: ko
  text: 그는 유다의 여러 성읍을 지나며 그곳의 불경한 자들을 멸하고, 이스라엘에서 진노를 돌려놓았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘불경한 자들’은 ‘경건치 않은 자들’이나 ‘악한 자들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘진노’는 문맥상 하나님의 진노를 가리킬 가능성이 크지만, 본문은 하나님을 직접 언급하지 않습니다.
    reason: theological_note
lexical_decisions:
- source_word: διῆλθεν
  english_pob_choice: went through
  chosen_korean: 지나며
  alternatives_korean:
  - 통과하며
  - 다니며
  lexicon: BDAG
  rationale: 도시들을 따라 이동하는 연속 동작을 자연스럽게 살리면서 과도한 해석을 피했습니다.
- source_word: πόλεσιν Ἰούδα
  english_pob_choice: the cities of Judah
  chosen_korean: 유다의 여러 성읍
  alternatives_korean:
  - 유다의 도시들
  - 유다의 성읍들
  lexicon: BDAG
  rationale: πόλις의 도시/성읍 의미를 반영하되, 한국어에서 더 자연스러운 역사·지리 표현인 ‘성읍’을 택했습니다.
- source_word: ἀσεβεῖς
  english_pob_choice: the ungodly
  chosen_korean: 불경한 자들
  alternatives_korean:
  - 경건치 않은 자들
  - 악한 자들
  lexicon: BDAG
  rationale: 단순한 도덕 악보다 하나님에 대한 불경/불경건의 성격을 드러내기 위해 직역 성격의 표현을 사용했습니다.
- source_word: ἀπέστρεψεν ὀργὴν ἀπὸ Ἰσραήλ
  english_pob_choice: turned away wrath from Israel
  chosen_korean: 이스라엘에서 진노를 돌려놓았습니다
  alternatives_korean:
  - 이스라엘에서 진노를 거두었습니다
  - 이스라엘에게서 진노를 돌이켰습니다
  lexicon: BDAG
  rationale: ὀργή를 ‘진노’로 옮겨 성경적 어감을 유지하고, ἀπέστρεψεν의 이동 이미지를 살려 ‘돌려놓았습니다’로 표현했습니다.
theological_decisions:
- issue: ὀργή(진노)가 누구의 진노인지
  chosen_reading: 본문은 진노를 ‘이스라엘에서’ 돌려놓았다고만 말하며, 여기서는 진노의 주체를 명시하지 않았습니다.
  alternative_readings:
  - 하나님의 진노
  - 일반적인 재앙이나 분노
  rationale: 헬라어 본문 자체가 하나님을 직접 언급하지 않으므로, 문맥상 가능한 신적 진노의 함의를 유지하되 본문보다 앞서 단정하지 않았습니다.
  doctrine_reference: 본문이 허용하는 범위 안에서 신학적 긴장을 보존합니다.
