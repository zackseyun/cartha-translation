  text: 그리고 그들은 벧호론의 내리막길을 따라 평지에 이르기까지 그들을 추격하였으며, 그들 가운데 약 팔백 명이 쓰러졌습니다. 그러나 나머지는 블레셋 땅으로 도망하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
