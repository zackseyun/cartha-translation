  text: And when he stopped speaking[a], he suddenly charged at them[b], and Seron and his camp were crushed before him.
  footnotes:
  - marker: a
    text: Or 'sprang upon them' / 'rushed upon them' for the sudden attack implied by the Greek verb.
    reason: lexical_alternative
  - marker: b
    text: '''His camp'' may also be understood more broadly as ''his army'' or ''his force.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말하기를 마치자마자 그들은 향해 갑자기 돌진했고, 시론과 그의 군대는 그 앞에서 무너졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἐνήλατο는 여기서 ‘돌진하다’보다 더 급작스러운 ‘달려들다/덮치다’의 뜻으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ἡ παρεμβολὴ αὐτοῦ는 문자적으로는 ‘그의 진영’이지만, 문맥상 ‘그의 군대/부대’까지 포함해 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐπαύσατο λαλῶν
  english_pob_choice: And when he stopped speaking
  chosen_korean: 그가 말하기를 마치자마자
  alternatives_korean:
  - 그가 말하기를 마친 뒤
  - 그가 말하던 것을 멈추자
  lexicon: LSJ
  rationale: 즉시 이어지는 행동을 드러내는 시간관계를 자연스럽게 살리면서, 원문의 ‘말하다를 그치다’ 의미를 반영했습니다.
- source_word: ἐνήλατο ἐπʼ αὐτοὺς ἄφνω
  english_pob_choice: he suddenly charged at them
  chosen_korean: 그들은 향해 갑자기 돌진했고
  alternatives_korean:
  - 그들에게 갑자기 달려들었고
  - 그들을 향해 갑자기 공격했고
  lexicon: LSJ
  rationale: ἐνήλατο의 급작스럽고 공격적인 움직임을 한국어의 ‘돌진하다’로 옮겨 전투 장면의 강도를 살렸습니다.
- source_word: Σήρων
  english_pob_choice: Seron
  chosen_korean: 시론
  alternatives_korean:
  - 세론
  lexicon: transliteration
  rationale: 그리스어 Σήρων의 현대 음역을 따랐습니다.
- source_word: ἡ παρεμβολὴ αὐτοῦ
  english_pob_choice: his camp
  chosen_korean: 그의 군대
  alternatives_korean:
  - 그의 진영
  - 그의 야영지
  lexicon: LSJ
  rationale: 문맥상 단순한 야영지보다 무장한 전투 집단을 가리키므로, ‘군대’로 넓게 옮겼습니다.
- source_word: συνετρίβη … ἐνώπιον αὐτοῦ
  english_pob_choice: were crushed before him
  chosen_korean: 그 앞에서 무너졌습니다
  alternatives_korean:
  - 그 앞에서 산산이 부서졌습니다
  - 그 앞에서 짓눌렸습니다
  lexicon: LSJ
  rationale: συνετρίβη의 ‘부서지다/짓눌리다’ 이미지를 살리되, 한국어에서 자연스러운 전투 패배 표현으로 ‘무너지다’를 선택했습니다.
