base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/031.yaml
  text: And he was greatly troubled in his soul[a], and he decided to go into Persia[b], to collect the taxes of the regions and to gather much silver.
  footnotes:
  - marker: a
    text: Or 'was at a loss in himself' or 'was in great distress.' The Greek verb can express perplexity as well as severe difficulty.
    reason: lexical_alternative
  - marker: b
    text: '''Silver'' here likely refers to monetary wealth in coined or weighed silver, not merely raw metal.'
    reason: cultural_note
translation:
  language: ko
  text: 그는 마음속으로 크게 근심하였습니다.[a] 그리고 페르시아로 가서 그 지방들의 세금을 거두고 많은 은[b]을 모으기로 결정하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 안에서 갈피를 잡지 못하였다’ 또는 ‘큰 곤경에 빠져 있었다’로도 옮길 수 있습니다. 그리스어 동사는 당혹스러움이나 막막함뿐 아니라 심한 곤란을 나타낼 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘은’은 단순한 금속만이 아니라 화폐 가치가 있는 은을 가리킬 가능성이 큽니다. 주조한 은전이나 무게를 달아 계산한 은일 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἠπορεῖτο τῇ ψυχῇ αὐτοῦ σφόδρα
  english_pob_choice: was greatly troubled in his soul
  chosen_korean: 마음속으로 크게 근심하였고
  alternatives_korean:
  - 영혼 안에서 크게 난처해하였고
  - 자기 영혼 안에서 크게 번민하였고
  - 마음에 크게 갈피를 잡지 못하였고
  lexicon: LSJ
  rationale: ἠπορεῖτο는 ‘난처해하다/갈피를 잡지 못하다’와 ‘곤경에 빠지다’의 뉘앙스를 함께 지니므로, 문맥의 내적 압박을 살리는 ‘크게 근심하다’로 자연스럽게 옮겼습니다. τῇ ψυχῇ αὐτοῦ는 심리적·내적 상태를 가리키므로 ‘마음속으로’로 풀어 한국어 독자에게 명확히 했습니다.
- source_word: ἐβουλεύσατο
  english_pob_choice: he decided
  chosen_korean: 결정하였습니다
  alternatives_korean:
  - 결심하였습니다
  - 계획하였습니다
  - 숙의하였습니다
  lexicon: LSJ
  rationale: 중간태의 ἐβουλεύσατο는 숙고 끝의 결정을 뜻하므로, ‘결정하다’가 가장 간결하고 현대적인 대응입니다. '숙의하다'는 너무 행정적이고, '계획하다'는 행위의 확정성을 약화시킬 수 있습니다.
- source_word: τοῦ πορευθῆναι εἰς τὴν Περσίδα
  english_pob_choice: to go into Persia
  chosen_korean: 페르시아로 가서
  alternatives_korean:
  - 페르시아 땅으로 가서
  - 페르시아로 들어가서
  - 페르시아에 가서
  lexicon: LSJ
  rationale: εἰς는 목적지로의 이동을 나타내므로 단순하고 직선적인 ‘-로 가서’가 적절합니다. ‘들어가서’는 방향성을 살리지만 한국어에서는 다소 과도하게 구체적일 수 있습니다.
- source_word: τοὺς φόρους τῶν χωρῶν
  english_pob_choice: the taxes of the regions
  chosen_korean: 그 지방들의 세금을
  alternatives_korean:
  - 그 지역들의 조세를
  - 그 지방들의 공물을
  - 그 지역들의 세목을
  lexicon: LSJ
  rationale: φόροι는 이 문맥에서 조공/세금의 뜻을 가지며, 행정적 수취 행위를 드러내는 ‘세금’이 가장 분명합니다. χῶραι는 특정 기술용어라기보다 통치 아래의 지역을 가리키므로 ‘지방들’로 옮겼습니다.
- source_word: ἀργύριον πολύ
  english_pob_choice: much silver
  chosen_korean: 많은 은을 모으기로
  alternatives_korean:
  - 많은 은전을 모으기로
  - 많은 은화로
  - 많은 돈을 모으기로
  lexicon: LSJ
  rationale: ἀργύριον은 문자적으로 ‘은’이지만 실제로는 화폐적 가치를 지닌 은화/은전의 뉘앙스를 띱니다. 영어 POB의 각주 취지를 반영해 ‘은’을 유지하되, 문맥상 축적 행위를 분명히 하는 ‘모으다’를 붙였습니다.
theological_decisions:
- issue: 인물의 내적 상태를 ψυχή로 표현한 방식
  chosen_reading: ‘마음속으로 크게 근심하였고’로 옮겨, 영혼/마음의 구분을 과도하게 신학화하지 않고 내적 곤란을 드러냈습니다.
  alternative_readings:
  - ‘영혼 안에서 크게 괴로워하였고’
  - ‘자기 안에서 크게 갈피를 잡지 못하였고’
  rationale: 이 절은 교리 진술이 아니라 서술적 심리 묘사이므로, ψυχή를 특정 신학 용어로 고정하기보다 문맥이 요구하는 내적 고통을 자연스럽게 전달하는 것이 적절합니다.
  doctrine_reference: 인간론/심리 어휘
