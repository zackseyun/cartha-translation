  text: And behold[a], the nations have gathered against us to destroy us[b]; you know what they are planning against us.
  footnotes:
  - marker: a
    text: Or 'to destroy us.' The Greek verb can denote removing or annihilating; 'wipe us out' brings out the total threat in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'what they are devising against us.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 민족들이 우리를 없애려고[b] 우리에게 맞서 모여들었습니다. 주님께서는 그들이 우리에게 맞서 무엇을 계획하는지 아십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 ἰδοὺ는 여기서 기도문의 긴박한 ‘보십시오/보라’의 호소를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘없애려고’는 원문의 ἐξᾶραι ἡμᾶς를 옮긴 것으로, 단순한 훼손이 아니라 존재를 제거하려는 총체적 위협을 나타낼 수 있습니다.
    reason: lexical_alternative
