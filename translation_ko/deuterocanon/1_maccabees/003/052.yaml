  lexicon: LSJ
  rationale: 악의적 숙고와 의도를 나타내므로, 단순한 ‘생각’보다 ‘계획’이 문맥에 더 정확합니다.
theological_decisions:
- issue: 하나님께 대한 직접 호소에서의 높임말 처리
  chosen_reading: ‘주님은 … 아십니다’로 옮겨, 서술은 합쇼체를 유지하면서 하나님께 대한 직접 호칭과 진술을 공손하게 처리했습니다.
  alternative_readings:
  - ‘주님은 … 알고 계십니다’
  - ‘주님은 … 아십니다’
  rationale: 원문은 간단하고 직접적인 확언이므로, 과도한 의역 없이 존칭을 유지하는 방식이 가장 적절합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, source-directness and register
- issue: ἔθνη의 번역 범위
  chosen_reading: ‘민족들’로 옮겨, 종교적 대립어인 ‘이방인’보다 군사적·정치적 적대 집단이라는 문맥을 우선했습니다.
  alternative_readings:
  - 이방 민족들
  - 열국
  rationale: 1 Maccabees의 전투 기도 맥락에서는 민족/나라들의 연합을 말하는 것이 핵심이므로, 후대 교회어의 고정된 대립구도를 피했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, original-language primacy over translation tradition
