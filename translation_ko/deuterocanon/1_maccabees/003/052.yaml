  text: And behold[a], the nations have gathered against us to destroy us[b]; you know what they are planning against us.
  footnotes:
  - marker: a
    text: Or 'to destroy us.' The Greek verb can denote removing or annihilating; 'wipe us out' brings out the total threat in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'what they are devising against us.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 민족들이 우리를 없애려고 우리를 향해 모여들었습니다[b]; 주님은 그들이 우리를 두고 무엇을 계획하는지 아십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 ἰδοὺ는 여기서 기도문의 긴박한 ‘보십시오/보라’의 호소를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘없애려고’는 POB의 ‘destroy us’를 따라, 단순 훼손이 아니라 존재를 제거하려는 총체적 위협을 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: LSJ
  rationale: 기도문의 긴박감과 지시성을 살리면서도 현대 합쇼체에 맞게 자연스럽게 옮겼습니다.
- source_word: τὰ ἔθνη
  english_pob_choice: the nations
  chosen_korean: 민족들이
  alternatives_korean:
  - 나라들이
  - 이방 민족들이
  lexicon: LSJ
  rationale: 여기서는 특정 종교용어보다 적대적으로 포위한 정치·군사적 집단을 가리키므로, 원문의 넓은 의미를 살려 ‘민족들’로 옮겼습니다.
- source_word: τοῦ ἐξᾶραι ἡμᾶς
  english_pob_choice: to destroy us
  chosen_korean: 우리를 없애려고
  alternatives_korean:
  - 우리를 파멸시키려고
  - 우리를 멸하려고
  lexicon: LSJ
  rationale: ἐξαίρω의 목적 용법이 단순한 해치기가 아니라 존재 자체를 제거하는 강한 의미이므로, 문맥상 총체적 위협을 드러내는 표현을 택했습니다.
- source_word: ἃ λογίζονται
  english_pob_choice: what they are planning
  chosen_korean: 무엇을 계획하는지
  alternatives_korean:
  - 무엇을 꾸미는지
  - 무엇을 생각하는지
  lexicon: LSJ
  rationale: 악의적 숙고와 의도를 나타내므로, 단순한 ‘생각’보다 ‘계획’이 문맥에 더 정확합니다.
theological_decisions:
- issue: 하나님께 대한 직접 호소에서의 높임말 처리
  chosen_reading: ‘주님은 … 아십니다’로 옮겨, 서술은 합쇼체를 유지하면서 하나님께 대한 직접 호칭과 진술을 공손하게 처리했습니다.
  alternative_readings:
  - ‘주님은 … 알고 계십니다’
  - ‘주님은 … 아십니다’
  rationale: 원문은 간단하고 직접적인 확언이므로, 과도한 의역 없이 존칭을 유지하는 방식이 가장 적절합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, source-directness and register
- issue: ἔθνη의 번역 범위
  chosen_reading: ‘민족들’로 옮겨, 종교적 대립어인 ‘이방인’보다 군사적·정치적 적대 집단이라는 문맥을 우선했습니다.
  alternative_readings:
  - 이방 민족들
  - 열국
  rationale: 1 Maccabees의 전투 기도 맥락에서는 민족/나라들의 연합을 말하는 것이 핵심이므로, 후대 교회어의 고정된 대립구도를 피했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, original-language primacy over translation tradition
