lexical_decisions:
- source_word: ὡμοιώθη
  english_pob_choice: was like
  chosen_korean: ~와 같았습니다
  alternatives_korean:
  - ~처럼 되었습니다
  - ~으로 비유되었습니다
  lexicon: LSJ
  rationale: 수동형 비교 표현으로서 변형보다 유사성을 나타내므로, 자연스러운 합쇼체 비교 구문인 “~와 같았습니다”로 옮겼습니다.
- source_word: ἐν τοῖς ἔργοις αὐτοῦ
  english_pob_choice: in his deeds
  chosen_korean: 그의 행적에서는
  alternatives_korean:
  - 그의 일들에서는
  - 그의 행동에서는
  - 그의 업적에서는
  lexicon: LSJ
  rationale: ἔργα는 단순한 ‘일’보다 전투적·영웅적 행위를 가리키는 뉘앙스가 있어, 문맥을 살린 “행적”을 택했습니다.
- source_word: σκύμνος
  english_pob_choice: lion’s cub
  chosen_korean: 사자 새끼
  alternatives_korean:
  - 어린 사자
  - 사자 새끼새
  lexicon: LSJ
  rationale: 어린 사자를 뜻하며, 앞의 ‘사자’와 구별되는 이미지를 살리기 위해 현대 한국어에서 자연스러운 “사자 새끼”로 옮겼습니다.
- source_word: εἰς θήραν
  english_pob_choice: for prey
  chosen_korean: 먹이를 향해
  alternatives_korean:
  - 먹이를 위해
  - 사냥감을 향해
  - 사냥을 위해
  lexicon: LSJ
  rationale: 목적어를 겨누는 방향성을 나타내므로, 단순한 사냥 행위보다 사냥 대상에 대한 돌진을 드러내는 “먹이를 향해”가 적절합니다.
theological_decisions:
- issue: 사자 비유의 중첩과 힘의 강조
  chosen_reading: 첫 절반은 성인 사자, 둘째 절반은 으르렁거리는 사자 새끼의 이중 비유로 읽어 강한 공격성과 위엄을 함께 드러냈습니다.
  alternative_readings:
  - 두 표현을 모두 단순히 ‘사자처럼’으로 평준화하는 읽기
  - 둘째 표현을 ‘어린 사자’로 중화하는 읽기
  rationale: 원문은 같은 동물 이미지를 반복하되 단계가 다른 비유로 힘을 강화합니다. 이를 평준화하면 수사적 긴장이 약해집니다.
  doctrine_reference: 문학적 수사 보존 원칙
- issue: ἔργα의 의미 범위
  chosen_reading: 여기서는 일반적 ‘일’이 아니라 전투적·영웅적 ‘행적’으로 옮겼습니다.
  alternative_readings:
  - 행동
  - 업적
  - 일
  rationale: 문맥상 마카베오의 무용을 찬양하는 대목이므로, 단순 행위보다 공적 성격이 강한 표현이 source 의미를 더 잘 전달합니다.
  doctrine_reference: 문맥 우선 번역 원칙
