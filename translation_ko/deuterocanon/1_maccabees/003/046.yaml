translation:
  language: ko
  text: 그들은 모여서 예루살렘 맞은편의 미스바[a]로 갔습니다. 이는 미스바가 옛적에 이스라엘 사람들이 기도하던 장소였기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예루살렘을 마주한’. 그리스어 표현은 예루살렘의 맞은편에 있거나 예루살렘을 향해 있는 위치를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν
  english_pob_choice: they assembled
  chosen_korean: 그들은 모여서
  alternatives_korean:
  - 그들은 집결해서
  - 그들은 모였고
  lexicon: BDAG
  rationale: 집합적 자발성을 자연스럽게 드러내며, 수동형 어감이 지나치게 두드러지지 않도록 한국어에서는 서술적으로 옮겼습니다.
- source_word: κατέναντι Ἰερουσαλήμ
  english_pob_choice: opposite Jerusalem
  chosen_korean: 예루살렘 맞은편의
  alternatives_korean:
  - 예루살렘 앞의
  - 예루살렘을 마주한
  lexicon: LSJ
  rationale: κατέναντι의 핵심인 ‘마주봄/맞은편’ 관계를 살리되, 한국어에서는 위치 수식으로 자연스럽게 처리했습니다.
- source_word: τόπος προσευχῆς
  english_pob_choice: a place of prayer
  chosen_korean: 기도의 장소
  alternatives_korean:
  - 기도하는 장소
  - 예배의 장소
  lexicon: BDAG
  rationale: 이 구는 특정 제도명보다 기도와 연관된 장소라는 뜻이므로, ‘기도의 장소’로 간결하게 옮겼습니다.
- source_word: τὸ πρότερον ... τῷ Ἰσραήλ
  english_pob_choice: formerly ... for Israel
  chosen_korean: 옛적에 이스라엘에게
  alternatives_korean:
  - 전에 이스라엘을 위해
  - 예전에 이스라엘을 위한
  lexicon: BDAG
  rationale: 시간 표지 τὸ πρότερον을 ‘옛적에’로, 수혜/관계의 여격 τῷ Ἰσραήλ을 ‘이스라엘에게’로 옮겨 문맥상 ‘이스라엘을 위한 기도의 장소’라는 뜻이 드러나게 했습니다.
theological_decisions:
- issue: 미스바의 종교적 성격
  chosen_reading: ‘기도의 장소’로만 두어, 예배처·성소·성전 등 더 구체적인 제도적 의미는 덧붙이지 않았습니다.
  alternative_readings:
  - 예배의 장소
  - 기도하는 집
  rationale: 원문은 미스바가 과거에 이스라엘의 기도와 연결된 장소였다고만 말하므로, 본문이 명시하지 않은 종교 제도적 함의는 확대하지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
