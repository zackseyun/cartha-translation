  text: 그리고 그는 명망 있는 사람이며 왕실 출신인 루시아스를 유프라테스 강에서 이집트의 경계까지 왕의 업무를 맡도록 남겨 두었고,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνθρωπον ἔνδοξον
  english_pob_choice: an honored man
  chosen_korean: 존귀한 사람
  alternatives_korean:
  - 존경받는 사람
  - 명망 있는 사람
  - 유력한 사람
  lexicon: ἔνδοξος
  rationale: POB의 'honored'를 따라 외적 명예보다 지위와 평판을 함께 담는 '존귀한'으로 옮겼습니다.
- source_word: ἀπὸ γένους τῆς βασιλείας
  english_pob_choice: of the royal family
  chosen_korean: 왕실 출신
  alternatives_korean:
  - 왕가 출신
  - 왕족 출신
  - 왕실의 일원
  lexicon: γένος
  rationale: γένους는 단순한 소속보다 혈통·가문을 가리키므로, 현대 한국어에서 자연스럽고 정확한 '왕실 출신'으로 처리했습니다.
- source_word: ἐπὶ τῶν πραγμάτων τοῦ βασιλέως
  english_pob_choice: over the affairs of the king
  chosen_korean: 왕의 일을 맡고 있었고
  alternatives_korean:
  - 왕의 사무를 맡고 있었고
  - 왕의 정사를 관장하고 있었고
  - 왕의 일들을 다스리고 있었고
  lexicon: πράγματα
  rationale: πράγματα는 추상적 '사무/일'의 범위이므로, 직역의 딱딱함을 피하면서도 관직적 책임을 살리는 표현으로 옮겼습니다.
- source_word: ἀπὸ τοῦ ποταμοῦ Εὐφράτου ἕως τῶν ὁρίων Αἰγύπτου
  english_pob_choice: from the Euphrates River as far as the borders of Egypt
  chosen_korean: 유프라테스 강에서부터 이집트의 경계까지
  alternatives_korean:
  - 유프라테스 강에서 이집트의 국경까지
  - 유프라테스 강부터 이집트 국경까지
  lexicon: ἀπό ... ἕως
  rationale: 시작점과 종착점을 분명히 드러내는 범위 표현을 보존해 지리적 관할의 넓이를 그대로 전달했습니다.
