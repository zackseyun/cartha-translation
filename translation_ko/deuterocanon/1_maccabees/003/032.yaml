  source_fidelity: 초안은 루시아스의 신분과 지리적 범위를 대체로 충실히 옮겼습니다. 그러나 κατέλιπεν은 그를 그 직무에 ‘남겨 두어/맡기다’라는 임명 행위인데, ‘맡고 있었고’는 지속 상태로 바꾸어 주동사의 의미를 약화합니다. 또한 원문이 쉼표로 끝나 다음 절에 이어지므로 이를 보존하는 편이 적절합니다.
  naturalness: ‘존귀한 사람’은 현대 한국어에서 다소 문어적이며, 바로 뒤의 왕실 혈통과 함께 읽힐 때 신분상의 고귀함을 중복·혼동시킬 수 있습니다. ‘명망 있는 사람’이 ἔνδοξος의 사회적 명성과 현대적 자연스러움을 잘 살립니다. 직무와 관할 범위를 한 문장 안에서 자연스럽게 재배치했습니다.
  terminology: Λυσίαν은 ‘루시아스’, Εὐφράτου는 ‘유프라테스 강’으로 적절합니다. ἀπὸ γένους τῆς βασιλείας는 ‘왕실 출신’으로 유지했습니다. πράγματα τοῦ βασιλέως는 행정적 책임을 나타내므로 ‘왕의 업무’로 옮겼습니다.
