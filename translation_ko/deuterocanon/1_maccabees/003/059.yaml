  rationale: 원문은 중성 복수형이므로 인격적 ‘성도들’이나 단일 장소를 뜻하지 않습니다. 문맥상 성전 관련 대상을 가리킬 수 있으나, 본문이 남겨 둔 범위를 보존하는 것이 더 정확합니다.
