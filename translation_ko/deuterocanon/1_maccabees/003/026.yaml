base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/026.yaml
  text: And his name reached even to the king[c][b][a], and every nation spoke of the battle lines of Judah.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'his fame reached the king.' The Greek reads literally, 'his name came near to the king.'
    reason: lexical_alternative
  - marker: b
    text: The Greek phrase 'above every battle line' is difficult. It may mean that every nation spoke of Judas in connection with his military formations or victories.
    reason: alternative_reading
  - marker: c
    text: Greek Ἰούδα here refers to Judas Maccabeus; 'Judah' reflects a closer transliteration of the form, while 'Judas' is the standard English name for this figure.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그의 이름은 왕에게까지 알려졌고, 모든 민족이 유다의 전열에 대해 말하였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 이름이 왕에게 가까이 갔다’입니다.
    reason: lexical_alternative
  - marker: b
    text: παράταξις는 전투를 위해 배열된 진형을 가리키므로, 여기서는 ‘전열’로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: Ἰούδα는 이 문맥에서 마카베오 유다를 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἤγγισεν ἕως τοῦ βασιλέως
  english_pob_choice: reached even to the king
  chosen_korean: 왕에게까지 알려졌고
  alternatives_korean:
  - 왕에게까지 다가갔고
  - 왕에게까지 이르렀고
  lexicon: LSJ
  rationale: ἤγγισεν은 문자적으로는 ‘가까이 다가가다’이지만, 여기서는 이름/평판이 왕의 귀에까지 들어갔다는 뜻으로 자연스럽게 옮기는 것이 문맥에 맞습니다.
- source_word: τὸ ὄνομα αὐτοῦ
  english_pob_choice: his name
  chosen_korean: 그의 이름
  alternatives_korean:
  - 그의 명성
  - 그의 평판
  lexicon: LSJ
  rationale: 그리스어는 직역하면 ‘그의 이름’이므로, 본문 표면 의미를 살리되 문맥상 알려진 소문이나 명성이 전해진 것으로 읽히게 했습니다.
- source_word: παράταξιν
  english_pob_choice: the battle lines
  chosen_korean: 전열
  alternatives_korean:
  - 전투 대열
  - 전열 편성
  - 군대 진형
  lexicon: LSJ
  rationale: παράταξις는 전투를 위해 늘어선 진형을 가리키므로, 한국어에서는 압축된 군사적 뉘앙스를 살릴 수 있는 ‘전열’이 가장 적절합니다.
- source_word: Ἰούδα
  english_pob_choice: Judah
  chosen_korean: 유다
  alternatives_korean:
  - 유다스
  - 유대
  lexicon: 현대 음역 관행
  rationale: 이 인물은 마카베오 유다를 가리키며, 한국어 성서 문맥에서는 인명으로 ‘유다’가 표준적이어서 이를 따랐습니다.
theological_decisions:
- issue: ‘이름이 왕에게까지 알려졌다’는 표현의 의미 범위
  chosen_reading: 단순한 신원 전달이 아니라 명성과 소문이 왕의 주목에 이르렀다는 뜻으로 읽었습니다.
  alternative_readings:
  - 글자 그대로 이름 자체가 왕에게 도달했다는 직역
  - 왕이 그 이름을 직접 들었다는 정도의 제한적 의미
  rationale: 헬라어 표면은 ‘이름’이지만, 문맥상 공적 인지도와 명성이 확장되는 장면이므로 의미를 너무 좁히지 않되 본문 이미지는 유지했습니다.
  doctrine_reference: source-semantic fidelity
