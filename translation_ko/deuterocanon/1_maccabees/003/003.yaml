base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/003.yaml
  text: And he enlarged the glory of his people[a]; he put on a breastplate like a giant, and strapped on his weapons of war; he set battles in order[c][b], shielding the camp with the sword.
  footnotes:
  - marker: a
    text: Or 'increased the honor/renown of his people.' The Greek uses a verb meaning 'made broad' metaphorically for increasing glory.
    reason: lexical_alternative
  - marker: b
    text: '''Like a giant'' may also be understood more generally as ''like a mighty warrior'' or ''champion,'' but the Greek word is literally ''giant.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'organized battles' / 'undertook wars.' The Greek expression can emphasize arranging military action, not only participating in it.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자기 백성의 영예를 드높였습니다[a]. 그는 거인처럼[b] 흉갑을 입고 전쟁 장비를 허리에 두르며, 전투를 조직하고[c] 칼로 진영을 보호했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 백성의 명예/명성을 높였습니다.’ 그리스어 동사는 문자적으로 ‘넓게 만들다’를 뜻하며, 여기서는 영광이나 명성을 높인다는 비유적 의미로 쓰였습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘거인처럼’은 더 일반적으로 ‘강한 전사처럼’ 또는 ‘용사처럼’으로도 이해될 수 있지만, 그리스어 단어의 문자적 뜻은 ‘거인’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘전쟁을 수행하고’ 또는 ‘전쟁을 일으키고.’ 이 표현은 단지 싸웠다는 뜻보다 군사 행동을 마련하고 조직하는 뉘앙스를 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλάτυνεν δόξαν
  english_pob_choice: enlarged the glory
  chosen_korean: 영광을 넓히셨습니다
  alternatives_korean:
  - 영광을 증가시키셨습니다
  - 명예를 높이셨습니다
  - 영광을 크게 하셨습니다
  lexicon: LSJ
  rationale: ἐπλάτυνεν은 문자적으로 ‘넓히다’의 뜻을 지니므로, 한국어에서도 공간적 이미지를 살린 ‘넓히다’로 옮겨 은유를 보존했습니다.
- source_word: ὡς γίγας
  english_pob_choice: like a giant
  chosen_korean: 거인처럼
  alternatives_korean:
  - 용사처럼
  - 챔피언처럼
  - 거대한 전사처럼
  lexicon: LSJ
  rationale: γίγας의 문자적 의미를 따라 ‘거인’으로 옮기되, 문맥상 영웅적 비교가 자연스럽게 드러나도록 했습니다.
- source_word: συνεστήσατο
  english_pob_choice: he set battles in order
  chosen_korean: 전투들을 정렬하셨고
  alternatives_korean:
  - 전투들을 조직하셨고
  - 전쟁들을 일으키셨고
  - 전투를 준비하셨고
  lexicon: LSJ
  rationale: συνίστημι 계열 표현의 ‘정리·조직’ 뉘앙스를 살려 단순히 ‘싸웠다’로 약화시키지 않고, 전투를 질서 있게 마련한다는 감각을 반영했습니다.
- source_word: σκεπάζων τὴν παρεμβολὴν ἐν ῥομφαίᾳ
  english_pob_choice: shielding the camp with the sword
  chosen_korean: 칼로 진영을 가리셨습니다
  alternatives_korean:
  - 칼로 진영을 덮으셨습니다
  - 칼로 진영을 보호하셨습니다
  - 칼로 군영을 가리셨습니다
  lexicon: LSJ
  rationale: σκεπάζων의 ‘덮다/가리다’와 παρεμβολή의 ‘진영’을 그대로 살려, 방어적 동작을 한국어로 직접 표현했습니다.
theological_decisions:
- issue: 무장과 전투 묘사의 서술 톤
  chosen_reading: 이 절은 전쟁 영웅의 과장된 서사적 묘사로 읽어, 현대적 완곡화 없이 무기와 전투 이미지를 유지했습니다.
  alternative_readings:
  - 상징적으로 재해석하여 일반적 용맹 서술로 완화
  - ‘흉배’와 ‘칼’의 군사 이미지를 약화
  rationale: 원문은 군사적 비유와 반복을 통해 인물의 공적 위상을 강조하므로, 이를 약화하지 않는 것이 문맥상 적절합니다.
  doctrine_reference: 1 Maccabees의 역사서적·서사적 문맥
- issue: ‘거인’ 표현
  chosen_reading: γίγας는 문자적으로 ‘거인’이므로, 관용적 완화보다 직역을 우선했습니다.
  alternative_readings:
  - ‘용사’나 ‘장사’로 의역
  - 영웅적 비교로만 처리
  rationale: 영문 POB도 ‘giant’를 유지하며 문자성을 주석으로만 보완하므로, 한국어 본문에서도 해당 긴장을 보존했습니다.
  doctrine_reference: 서사적 과장과 문자성의 병존
