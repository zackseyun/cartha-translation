  text: And he said[a], “I will make a name for myself, and I will be glorified in the kingdom[c][b], and I will fight Judah and those with him who are disregarding the king’s word.”
  footnotes:
  - marker: a
    text: Or 'Judas'; the Greek name here refers to Judas Maccabeus.
    reason: alternative_reading
  - marker: b
    text: Or 'who are despising the king’s word.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the king’s command' or 'the king’s decree.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 말했습니다. “나는 내 명성을 얻고, 왕국에서 영광을 받을 것이며[c], 유다[a]와 그와 함께 있는 자들, 곧 왕의 말을 업신여기는 자들과 싸울 것입니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '유다스'; 여기의 그리스어 이름은 유다 마카베오를 가리킵니다.
    reason: alternative_reading
  - marker: b
    text: 또는 '왕의 명령' 또는 '왕의 칙령'.
    reason: lexical_alternative
  - marker: c
    text: 또는 '왕의 나라에서'.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποιήσω ἐμαυτῷ ὄνομα
  english_pob_choice: I will make a name for myself
  chosen_korean: 나는 나를 위해 이름을 만들고
  alternatives_korean:
  - 나는 나를 위해 명성을 얻고
  - 나는 내 이름을 떨치고
  lexicon: LSJ
  rationale: 자기과시적 관용구를 살리되, 한국어에서 자연스러운 표현으로 옮겼습니다. '이름을 만들다'는 영어 POB의 관용을 반영하면서도 인위적으로 과장되지 않습니다.
- source_word: δοξασθήσομαι
  english_pob_choice: I will be glorified
  chosen_korean: 영화롭게 될 것이며
  alternatives_korean:
  - 영광을 받을 것이며
  - 존귀하게 될 것이며
  lexicon: LSJ
  rationale: 수동 미래의 영광/존귀 의미를 살려 '영화롭게 되다'로 옮겼습니다. 단순한 성공보다 명예와 영예의 뉘앙스를 보존합니다.
- source_word: ἐν τῇ βασιλείᾳ
  english_pob_choice: in the kingdom
  chosen_korean: 왕국 안에서
  alternatives_korean:
  - 나라 안에서
  - 그 왕국에서
  lexicon: LSJ
  rationale: 기본 뜻인 βασιλεία의 '왕국/나라'를 직역하되, 문맥상 장소 부사구로 자연스럽게 풀었습니다.
- source_word: τοὺς ἐξουθενοῦντας τὸν λόγον τοῦ βασιλέως
  english_pob_choice: who are disregarding the king’s word
  chosen_korean: 왕의 말을 업신여기는 자들
  alternatives_korean:
  - 왕의 명령을 무시하는 자들
  - 왕의 말을 경시하는 자들
  lexicon: LSJ
  rationale: ἐξουθενέω의 '멸시하다, 하찮게 여기다'는 힘을 살리기 위해 '업신여기다'를 택했습니다. λόγος는 여기서 단순한 '말'보다 '명령/칙령'일 수 있으나, 원문의 어휘를 보존해 '왕의 말'로 두었습니다.
- source_word: τὸν Ἰούδαν
  english_pob_choice: Judah
  chosen_korean: 유다
  alternatives_korean:
  - 유다스
  - 주다
  lexicon: LSJ
  rationale: POB의 이름 처리 원칙에 따라 고유명사로 음역했습니다. 문맥상 마카베오 유다를 가리키므로, 한국어 성경에서 익숙한 '유다'를 채택했습니다.
theological_decisions:
- issue: 가롯 유다와의 혼동 가능성보다 본문 인물 식별을 우선할지
  chosen_reading: 마카베오 유다를 가리키는 고유명사 '유다'로 옮기고 주석 없이 본문 의미를 따릅니다.
  alternative_readings:
  - '''유다스''로 음차하여 그리스어 형태를 더 가깝게 반영'
  - '''유다 마카베오''로 설명적으로 확장'
  rationale: 이 구절의 Ἰούδαν은 유다 마카베오를 지칭하는 역사적 인물입니다. 본문 자체는 별칭을 붙이지 않으므로, 본문 번역은 간결하게 유지하고 식별은 문맥에 맡깁니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names'
