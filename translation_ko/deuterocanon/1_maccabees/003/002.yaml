  text: And all his brothers helped him[a], and all who had joined themselves to his father[b], and they fought the war of Israel with gladness.
  footnotes:
  - marker: a
    text: Or 'all who had attached themselves to his father,' that is, those who had aligned themselves with Mattathias.
    reason: lexical_alternative
  - marker: b
    text: Or 'they waged war for Israel with joy.' The Greek more literally says 'they fought the war of Israel with gladness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그의 모든 형제들과 그의 아버지에게 붙은 모든 사람이 그를 도왔고,[a] 기쁨으로 이스라엘의 전쟁을 치렀습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 아버지에게 자신을 붙인 모든 사람’. 이는 마타티아스에게 동조하거나 그와 결속한 이들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘기쁨으로 이스라엘을 위한 전쟁을 치렀습니다’. 그리스어는 더 문자적으로 ‘기쁨과 함께 이스라엘의 전쟁을 싸웠다’고 말합니다.
    reason: lexical_alternative
