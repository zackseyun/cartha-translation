base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/017.yaml
  text: But when they saw the camp coming to meet him[a], they said to Judas, “How can we, being so few, fight against so great a multitude? And we are exhausted[c][b], having gone without food today.”
  footnotes:
  - marker: a
    text: Or “coming against him.” The Greek phrase can be rendered more neutrally as “coming to meet him,” but in this military context it implies hostile encounter.
    reason: lexical_alternative
  - marker: b
    text: Or “we are faint.” The Greek can denote a weakened or dispirited condition; here it is linked to having gone without food.
    reason: lexical_alternative
  - marker: c
    text: “Having gone without food” could also be rendered “fasting,” but the wording does not by itself require a formal religious fast.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 진영이 유다를 만나러 오는 것을 보고[a] 유다에게 말했습니다. “우리는 수가 이렇게 적은데, 어떻게 그토록 많은 무리와 싸울 수 있겠습니까? 오늘 아무것도 먹지 못해 지쳐 있습니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 문자적으로 ‘그를 만나러 오는’이라는 뜻입니다. 군사 문맥에서는 적대적인 대치를 암시할 수 있지만, 표현 자체가 이를 명시하지는 않습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아무것도 먹지 못해’는 ‘금식하여’ 또는 ‘굶주려’로도 옮길 수 있습니다. 그러나 원문만으로는 형식적인 종교 금식을 뜻한다고 단정할 수 없습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεμβολὴν
  english_pob_choice: camp
  chosen_korean: 진영
  alternatives_korean:
  - 캠프
  - 군영
  lexicon: LSJ
  rationale: 군사적 문맥에서 ‘camp’에 해당하는 구체적 집결지를 살리되, 한국어에서 자연스럽고 문어적인 ‘진영’으로 옮겼습니다.
- source_word: ἐρχομένην εἰς συνάντησιν αὐτῷ
  english_pob_choice: coming to meet him
  chosen_korean: 자기들을 향해 오고 있는
  alternatives_korean:
  - 그와 맞닥뜨리러 오는
  - 그를 맞이하러 오는
  lexicon: LSJ
  rationale: 직역하면 ‘그를 만나러 오는’이지만, 전투 상황의 적대적 접촉 가능성을 드러내기 위해 ‘자기들을 향해 오고 있는’으로 자연스럽게 처리했습니다.
- source_word: ὀλιγοστοὶ ὄντες
  english_pob_choice: being so few
  chosen_korean: 이렇게 적은데
  alternatives_korean:
  - 얼마 되지 않는데
  - 수가 적은데
  lexicon: LSJ
  rationale: 숫자의 적음을 강조하는 표현이라, 반문 속에서 자연스럽게 들리는 ‘이렇게 적은데’로 옮겼습니다.
- source_word: πλῆθος τοσοῦτο
  english_pob_choice: so great a multitude
  chosen_korean: 저렇게 큰 무리
  alternatives_korean:
  - 그처럼 큰 무리
  - 그토록 큰 무리
  lexicon: LSJ
  rationale: πλῆθος는 단순한 군중이 아니라 큰 집단을 가리키므로, 대조를 살린 ‘큰 무리’로 번역했습니다.
- source_word: ἐκλελύμεθα ἀσιτοῦντες σήμερον
  english_pob_choice: we are exhausted, having gone without food today
  chosen_korean: 오늘 우리는 먹지 못하여 지쳤습니다
  alternatives_korean:
  - 오늘 우리는 굶주려 지쳤습니다
  - 오늘 우리는 금식하여 기진했습니다
  lexicon: LSJ
  rationale: ‘먹지 못하여’는 ἀσιτοῦντες의 비섭식 상태를 직접적으로 드러내며, POB의 신중한 처리처럼 형식적 종교 금식으로 단정하지 않기 위해 ‘금식’은 피했습니다.
theological_decisions:
- issue: ἀσιτοῦντες의 성격이 종교적 금식인지 단순한 결식인지
  chosen_reading: 단순히 오늘 먹지 못한 상태로 이해해 ‘먹지 못하여’로 옮겼습니다.
  alternative_readings:
  - 금식하여
  - 굶주려
  rationale: 영문 POB가 이미 formal religious fast를 단정하지 않도록 주석 처리한 만큼, 원문도 그 가능성을 열어 두고 비종교적 결식으로 번역하는 것이 더 안전합니다.
  doctrine_reference: 텍스트 비평/해석상의 절제 원칙
- issue: ἐρχομένην εἰς συνάντησιν αὐτῷ의 적대성 반영
  chosen_reading: 문자적으로는 ‘만나러 오는’이지만, 전투 문맥을 반영해 ‘자기들을 향해 오고 있는’으로 표현했습니다.
  alternative_readings:
  - 그를 만나러 오는
  - 그에게 맞서 오는
  rationale: 원문 자체는 중립적일 수 있으나, 서술 전체가 군사 충돌 상황이므로 독자가 실제 긴장감을 이해하도록 방향성을 암시했습니다.
  doctrine_reference: 서사 문맥 우선 원칙
