lexical_decisions:
- source_word: ἐδίωξεν
  english_pob_choice: hunted down
  chosen_korean: 추적하여 찾아내었고
  alternatives_korean:
  - 뒤쫓았고
  - 추격했고
  - 추적했고
  lexicon: LSJ
  rationale: 단순한 ‘뒤쫓다’보다 적극적이고 집요한 추적의 뉘앙스를 살리면서, 이어지는 ‘찾아내다’와 함께 POB의 ‘hunted down, searching them out’ 구조를 자연스럽게 반영합니다.
- source_word: ἀνόμους
  english_pob_choice: the lawless
  chosen_korean: 불법한 자들
  alternatives_korean:
  - 법 없는 자들
  - 무법자들
  - 악한 자들
  lexicon: LSJ
  rationale: 직역하면 ‘법 없는’이지만, 여기서는 공동체 질서를 거스르는 도덕·법적 성격이 함께 있으므로 ‘불법한 자들’이 원문의 성격을 가장 직접적으로 드러냅니다.
- source_word: ἐξερευνῶν
  english_pob_choice: searching them out
  chosen_korean: 찾아내었고
  alternatives_korean:
  - 찾아다녔고
  - 샅샅이 찾았고
  - 조사했고
  lexicon: LSJ
  rationale: 동사는 단순한 탐색이 아니라 면밀한 수색을 뜻하므로, 한국어에서는 결과를 분명히 드러내는 ‘찾아내다’가 문맥상 가장 자연스럽습니다.
- source_word: ἐφλόγισεν
  english_pob_choice: burned
  chosen_korean: 불태웠습니다
  alternatives_korean:
  - 불로 태웠습니다
  - 태워버렸습니다
  - 불에 태웠습니다
  lexicon: LSJ
  rationale: 그리스어는 문자적으로 ‘불태우다’의 강한 진술이므로, 완곡하게 줄이지 않고 현대 한국어에서 가장 직접적인 ‘불태웠습니다’를 택했습니다.
theological_decisions:
- issue: ἀνόμους의 법적·도덕적 강도 유지
  chosen_reading: 불법한 자들
  alternative_readings:
  - 악한 자들
  - 무법자들
  rationale: 이 표현은 단지 사회적으로 나쁜 사람이라는 뜻이 아니라, 공동체의 질서와 규범을 거스르는 자들을 가리키므로 그 법적·도덕적 긴장을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: ἐφλόγισεν의 노골적 폭력성 보존
  chosen_reading: 자기 백성을 괴롭히는 자들을 불태웠습니다
  alternative_readings:
  - 자기 백성을 괴롭히는 자들을 불로 태웠습니다
  - 자기 백성을 괴롭히는 자들을 태워 죽였습니다
  rationale: 본문은 행위를 완화하지 않고 직설적으로 서술하므로, 한국어에서도 폭력의 강도를 희석하지 않되 원문에 없는 설명은 덧붙이지 않았습니다.
  doctrine_reference: Translation philosophy §1, §6
