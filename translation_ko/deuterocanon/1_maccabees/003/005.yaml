  verdict: revise
  source_fidelity: 그리스어는 ‘무법한 자들을’ 목적어로 하여 ‘찾아다니며/수색하며’(ἐξερευνῶν) ‘추격했다’(ἐδίωξεν)고 말합니다. 초안의 ‘추적하여 찾아내었고’는 탐색의 결과인 ‘찾아냄’을 확정적으로 보태고, 분사와 주동사의 관계를 다소 흐립니다. 또한 ἐφλόγισεν은 ‘불태웠습니다’로 정확히 옮겼습니다.
  naturalness: ‘불법한 자들’은 현대 한국어에서 다소 어색하고 ‘불법적인 사람들’처럼 들릴 수 있습니다. ‘무법한 자들’이 더 자연스러우면서도 원문의 도덕적·법적 의미를 보존합니다. ‘찾아다니며 추격했습니다’는 합쇼체 문장으로 자연스럽고 원문의 진행성도 드러냅니다.
  terminology: ‘무법한 자들’은 ἀνόμους의 ‘lawless’를 유지하며 단순한 형사범이라는 뜻으로 한정하지 않습니다. ‘자기 백성’과 ‘괴롭히는 자들’은 각각 τὸν λαὸν αὐτοῦ 및 παράσσοντας를 적절히 반영합니다. ‘불태웠습니다’는 폭력성을 완화하거나 원문에 없는 사망 결과를 첨가하지 않습니다.
