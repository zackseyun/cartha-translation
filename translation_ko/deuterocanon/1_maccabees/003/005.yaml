    rationale: 문법적으로 가능하나 현대 표준어에서는 ‘무법한 자들’이 더 자연스럽고 ἀνόμους의 의미 영역을 더 잘 전달합니다.
  - severity: medium
    issue: 각주 표지가 해당 어휘에 직접 연결되지 않음
    rationale: a는 ἀνόμους 뒤에, b는 ἐφλόγισεν의 번역인 ‘불태웠습니다’ 뒤에 놓아 각주 대상이 분명해야 합니다.
