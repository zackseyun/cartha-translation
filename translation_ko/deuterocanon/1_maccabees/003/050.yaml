translation:
  language: ko
  text: 그들은 큰 소리로 하늘을 향해 외쳤습니다. “이들을 어떻게 해야 합니까? 또 어디로 데려가야 합니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어디로 그들을 이끌어 가야 합니까?’ 이 동사는 현재의 위험한 곳에서 데려가거나 이끌어 내는 뜻을 더 구체적으로 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβόησαν
  english_pob_choice: they cried out
  chosen_korean: 외치며
  alternatives_korean:
  - 소리치며
  - 부르짖으며
  lexicon: LSJ
  rationale: 강한 외침을 나타내는 동사로, 문맥의 긴급성과 절박함을 살려 ‘외치며’로 옮겼습니다.
- source_word: φωνῇ
  english_pob_choice: with a loud voice
  chosen_korean: 큰 소리로
