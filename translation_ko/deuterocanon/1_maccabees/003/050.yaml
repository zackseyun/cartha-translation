  lexicon: LSJ
  rationale: ‘with a voice’의 문자성보다 보어적 강조를 살려, 자연스럽고 힘 있는 한국어 관용인 ‘큰 소리로’를 택했습니다.
- source_word: εἰς τὸν οὐρανόν
  english_pob_choice: to heaven
  chosen_korean: 하늘을 향해
  alternatives_korean:
  - 하늘로
  - 하늘에
  lexicon: LSJ
  rationale: 본문은 하나님을 직접 지칭하지 않고 ‘하늘’로 말하므로, 기도의 방향성을 드러내되 원문 표현을 유지해 ‘하늘을 향해’로 옮겼습니다.
- source_word: ἀπαγάγωμεν
  english_pob_choice: take them
  chosen_korean: 데려가야 합니까
  alternatives_korean:
  - 끌고 가야 합니까
  - 인도해야 합니까
  lexicon: LSJ
  rationale: 이 동사는 단순한 이동보다 위험한 자리에서 ‘데려가다/끌어내다’의 뉘앙스를 지니므로, 한국어에서는 가장 자연스럽게 ‘데려가야 합니까’로 표현했습니다.
theological_decisions:
- issue: ‘하늘’의 간접적 기도 대상 표현
  chosen_reading: ‘하늘을 향해’라고 유지하여, 하나님을 본문에 명시적으로 덧붙이지 않았습니다.
  alternative_readings:
  - 하나님께
  - 주님께
  rationale: 그리스어는 직접적으로 ‘하나님’이 아니라 ‘하늘’을 말하므로, 기도적 맥락은 살리되 원문이 지닌 간접성을 보존했습니다.
  doctrine_reference: '번역 원칙: 원문 우선, 본문에 없는 신학적 명시화 자제'
