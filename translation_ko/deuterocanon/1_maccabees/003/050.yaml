translation:
  language: ko
  text: 그들은 큰 소리로 하늘을 향해 외치며 말했습니다. “이들을 어떻게 해야 합니까, 또 어디로 데려가야 합니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
