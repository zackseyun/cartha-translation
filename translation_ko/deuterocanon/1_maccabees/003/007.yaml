  text: 그는 많은 왕들의 마음을 쓰라리게 했으며, 그의 행위로 야곱을 기쁘게 했고, 그의 기억은 영원히 복이 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그를 기억하는 일은 영원히 복이 될 것입니다.” 그리스어는 문자적으로 ‘그의 기억은 영원히 복을 위한 것’이라는 축복 공식을 사용합니다.
    reason: lexical_alternative
