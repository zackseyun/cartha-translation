  text: And he embittered many kings[a], and he made Jacob glad by his deeds, and his remembrance is for blessing forever.
  footnotes:
  - marker: a
    text: Or, 'his memory is blessed forever.' The Greek uses a blessing formula literally, 'his remembrance is for blessing forever.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 많은 왕들을 쓰라리게 했으며, 야곱을 자기의 행위들로 기쁘게 했고, 그의 기억은 영원히 복이 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 기억은 영원히 복된 것입니다.” 그리스어는 문자적으로 ‘그의 기억은 영원히 복을 위한 것’이라는 축복 공식을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίκρανεν
  english_pob_choice: embittered
  chosen_korean: 쓰라리게 했으며
  alternatives_korean:
  - 괴롭게 했으며
  - 쓴맛나게 했으며
  - 고통스럽게 했으며
  lexicon: LSJ
  rationale: 직역의 핵심인 ‘bitter’의 이미지를 살리면서도 한국어에서 자연스럽고 현대적인 표현으로 옮겼습니다.
- source_word: βασιλεῖς πολλούς
  english_pob_choice: many kings
  chosen_korean: 많은 왕들
  alternatives_korean:
