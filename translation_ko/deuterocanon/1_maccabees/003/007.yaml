  - 많은 임금들
  lexicon: LSJ
  rationale: 그리스어 βασιλεῖς의 기본 의미를 따라 ‘왕들’로 유지했습니다.
- source_word: ηὔφρανεν
  english_pob_choice: made glad
  chosen_korean: 기쁘게 했고
  alternatives_korean:
  - 즐겁게 했고
  - 환하게 했고
  - 기쁘게 만들었고
  lexicon: LSJ
  rationale: 원문의 사역적 의미를 살리면서 한국어에서 가장 자연스러운 서술로 옮겼습니다.
- source_word: τὸν Ἰακώβ
  english_pob_choice: Jacob
  chosen_korean: 야곱
  alternatives_korean:
  - 이스라엘
  lexicon: LSJ
  rationale: 원문이 집합적 지칭으로 ‘Jacob’을 사용하므로, 해석어인 ‘이스라엘’로 바꾸지 않고 음역을 유지했습니다.
- source_word: τὸ μνημόσυνον αὐτοῦ εἰς εὐλογίαν
  english_pob_choice: his remembrance is for blessing
  chosen_korean: 그의 기억은 영원히 복이 됩니다
  alternatives_korean:
  - 그의 기억은 영원히 복을 받습니다
  - 그의 기억은 복이 되도록 영원합니다
  - 그의 기념은 복이 됩니다
  lexicon: LSJ
  rationale: 명사구적 축복 공식의 뜻을 한국어로 자연스럽게 풀되, ‘기억/기념’의 기억-축복 구조를 보존했습니다.
theological_decisions:
- issue: 마지막 절의 축복 공식 표현
  chosen_reading: ‘그의 기억은 영원히 복이 됩니다’로 옮겨, 명시적 수동문보다 축복 공식을 살렸습니다.
  alternative_readings:
  - 그의 기억은 영원히 복을 받습니다
  - 그의 기념은 영원히 복됩니다
  rationale: 그리스어는 ‘기억/기념이 복을 위한 것’이라는 관용적 축복 공식을 사용하므로, 이를 한국어에서 지나치게 설명적으로 바꾸지 않았습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: ‘야곱’의 집합적 의미 유지
  chosen_reading: ‘이스라엘’로 풀지 않고 ‘야곱’을 유지했습니다.
  alternative_readings:
  - 이스라엘
  rationale: 원문 표지어를 보존해 covenantal register와 본문의 어감을 유지합니다.
  doctrine_reference: Translation philosophy §1, §2
