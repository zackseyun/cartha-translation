  source_fidelity: 첫 절의 ἐπίκρανεν은 ‘쓰라리게 했다’만으로는 한국어에서 목적어인 ‘왕들’과의 결합이 다소 부자연스럽습니다. ‘왕들의 마음을 쓰라리게 했다’로 옮기면 ‘쓰게 만들다’라는 비유적 힘을 보존하면서 자연스럽습니다. 마지막 명사적 축복 공식은 ‘복이 됩니다’보다 미래적·격언적 문맥에 맞는 ‘복이 될 것입니다’가 더 적절합니다.
  naturalness: ‘자기의 행위들’은 한국어에서 불필요하게 복수적이고 다소 번역투입니다. ‘그의 행위로’가 자연스럽습니다. ‘그의 기억은 영원히 복이 됩니다’도 현재 진행 또는 일반적 정의처럼 들릴 수 있으므로 ‘영원히 복이 될 것입니다’로 다듬는 것이 현대 합쇼체 문장에 맞습니다.
  terminology: ‘왕들’과 집합적 호칭인 ‘야곱’은 원문을 충실히 보존합니다. μνημόσυνον은 여기서 ‘기억’으로 옮길 수 있으며, εἰς εὐλογίαν의 축복 공식은 ‘복이 될 것입니다’로 표현해 명시되지 않은 수동형을 강제하지 않았습니다.
