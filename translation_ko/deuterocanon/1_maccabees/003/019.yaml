  text: For victory in war is not in a multitude of strength[a], but strength is from heaven.
  footnotes:
  - marker: a
    text: Or, 'but might comes from heaven.' The Greek contrasts human amassed force with strength granted from the divine realm.
    reason: lexical_alternative
translation:
  language: ko
  text: 전쟁의 승리는 많은 힘에 있는 것이 아니라, 힘은 하늘로부터 옵니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘힘의 많음’입니다. 그리스어는 인간이 모은 힘과 하늘로부터 주어지는 힘을 대조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πλήθει δυνάμεως
  english_pob_choice: in a multitude of strength
  chosen_korean: 많은 힘에 있는 것
  alternatives_korean:
  - 힘의 많음에 있는 것
  - 큰 군세에 있는 것
  - 많은 군사력에 있는 것
  lexicon: LSJ
  rationale: ἐν + 여격은 ‘~안에/에 있다’는 근거·영역을 나타내며, πλῆθος δυνάμεως는 ‘힘의 많음’이지만 한국어에서는 ‘많은 힘’이 더 자연스럽고 원문의 대비를 살립니다.
- source_word: νίκη πολέμου
  english_pob_choice: victory in war
  chosen_korean: 전쟁의 승리
  alternatives_korean:
  - 전투의 승리
  - 전쟁에서의 승리
  lexicon: LSJ
  rationale: πολέμου는 승리의 종류를 규정하므로 ‘전쟁의 승리’로 옮기면 군사적 문맥을 유지하면서도 한국어로 간결하게 전달됩니다.
- source_word: ἀλλʼ ἢ
  english_pob_choice: but
  chosen_korean: …이 아니라
  alternatives_korean:
  - …이 아니고
  - …이라기보다
  - …이 아니라 오히려
  lexicon: LSJ
  rationale: 그리스어의 강한 대조를 한국어에서는 ‘…이 아니라’로 자연스럽게 살렸습니다.
- source_word: ἐκ τοῦ οὐρανοῦ
  english_pob_choice: from heaven
  chosen_korean: 하늘로부터
  alternatives_korean:
  - 하늘에서
  - 하늘로부터 옵니다
  - 하나님께로부터
  lexicon: LSJ
  rationale: 본문의 완곡표현을 그대로 살려 ‘하나님께로부터’로 풀지 않고, 유대-그리스어적 ‘하늘’ 표현을 유지했습니다.
theological_decisions:
- issue: ‘하늘로부터’의 신학적 지시 대상을 명시할지 여부
  chosen_reading: 원문처럼 ‘하늘로부터’로 두어 하나님의 도움을 직접 해설하지 않았습니다.
  alternative_readings:
  - 하나님께로부터
  - 하늘에서 오는
  rationale: 그리스어는 직접적으로 ‘하나님’이 아니라 ‘하늘’을 말하므로, 완곡표현을 해설로 대체하지 않고 source-direct하게 유지하는 것이 문맥과 POB 원칙에 맞습니다.
  doctrine_reference: Translation philosophy §1, §3
