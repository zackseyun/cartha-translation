base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/010.yaml
  text: And now let us cry out to heaven; if he is willing toward us[a], he will remember the covenant of our fathers and crush this camp before us today.
  footnotes:
  - marker: a
    text: Or 'if he favors us' or 'if he is pleased with us.' The Greek literally says 'if he wills/desires us,' expressing God's favorable disposition toward his people.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 지금 하늘을 향해 부르짖읍시다. 그분이 우리를 원하신다면[a], 우리 조상들의 언약을 기억하시고 오늘 우리 앞에서 이 진영을 무너뜨리실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분이 우리를 기뻐하신다면’, ‘그분이 우리에게 호의적이시라면’. 그리스어는 문자적으로 ‘그분이 우리를 원하신다면’이라고 하며, 하나님의 호의적 태도를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: βοήσωμεν
  english_pob_choice: let us cry out
  chosen_korean: 부르짖읍시다
  alternatives_korean:
  - 외칩시다
  - 소리쳐 부르짖읍시다
  lexicon: BDAG
  rationale: 긴박한 전투 상황에서 하나님께 드리는 간절한 호소를 살리기 위해 단순한 ‘외치다’보다 ‘부르짖다’를 택했습니다.
- source_word: εἰς οὐρανόν
  english_pob_choice: to heaven
  chosen_korean: 하늘을 향해
  alternatives_korean:
  - 하늘로
  - 하늘에
  lexicon: BDAG
  rationale: 직역을 유지하되, 하나님께 올리는 호소라는 뉘앙스를 한국어로 자연스럽게 드러내기 위해 ‘하늘을 향해’로 옮겼습니다.
- source_word: εἰ θελήσει ἡμᾶς
  english_pob_choice: if he is willing toward us
  chosen_korean: 그분이 우리를 원하신다면
  alternatives_korean:
  - 그분이 우리를 기뻐하신다면
  - 그분이 우리에게 호의적이시라면
  lexicon: BDAG
  rationale: θέλω의 개인적 목적어 용법을 반영해 하나님의 호의적 의지와 우리를 향한 기울어짐을 살렸습니다. 영어의 긴장을 과하게 풀지 않으면서도 한국어에서 의미가 분명하도록 했습니다.
- source_word: τὴν παρεμβολὴν ταύτην
  english_pob_choice: this camp
  chosen_korean: 이 진영
  alternatives_korean:
  - 이 군대
  - 이 진지
  lexicon: BDAG
  rationale: 전투 대형으로 맞선 적대 세력을 가리키는 구체적 이미지를 살리기 위해 ‘진영’을 택했습니다.
theological_decisions:
- issue: “하늘을 향해”라는 방향 표현의 신학적 처리
  chosen_reading: 하늘 자체가 아니라 하나님께로 드리는 호소를 암시하는 표현으로 유지했습니다.
  alternative_readings:
  - 직접 ‘하나님께’로 옮김
  - ‘하늘에’로만 옮겨 더 문자적으로 유지
  rationale: 원문은 관용적으로 ‘하늘’을 향해 외치라고 하지만, 문맥상 대상은 하나님이므로 의미를 지우지 않으면서도 원문 이미지를 보존했습니다.
  doctrine_reference: 번역 원칙 §1, §6
- issue: εἰ θελήσει ἡμᾶς의 marked한 표현 처리
  chosen_reading: ‘그분이 우리를 원하신다면’로 비교적 직접적으로 유지했습니다.
  alternative_readings:
  - 그분이 우리를 기뻐하신다면
  - 그분이 우리에게 호의적이시라면
  rationale: 원문은 단순한 ‘허락’보다 더 인격적이고 언약적인 호의를 드러내므로, 완전히 매끈하게 바꾸지 않고 표현의 긴장을 남겼습니다.
  doctrine_reference: 번역 원칙 §1, §5
