translation:
  language: ko
  text: 그들은 옷을 찢고 큰 애곡을 하며 머리에 재를 얹었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 옷을 찢고 큰 애곡을 하며 머리에 재를 얹는 일은 성경에서 슬픔과 애도의 전형적인 표지입니다.
    reason: cultural_note
lexical_decisions:
- source_word: διέρρηξαν
  english_pob_choice: tore
  chosen_korean: 찢고
  alternatives_korean:
  - 갈기고
  - 찢어 버리고
  lexicon: LSJ
  rationale: 옷을 찢는 애도 행위를 간결하고 자연스럽게 살리기 위해 ‘찢고’를 택했습니다.
- source_word: τὰ ἱμάτια
  english_pob_choice: garments
  chosen_korean: 옷
  alternatives_korean:
  - 의복
  - 겉옷
  lexicon: LSJ
  rationale: ἱμάτια는 넓게 옷을 가리키므로, 한국어에서는 애도 행동을 자연스럽게 전달하는 ‘옷’이 가장 무난합니다.
- source_word: ἐκόψαντο κοπετὸν μέγαν
  english_pob_choice: made great lamentation
  chosen_korean: 크게 통곡하며
  alternatives_korean:
  - 큰 애곡을 하며
  - 크게 애도하며
  lexicon: LSJ
  rationale: 동사와 명사의 반복을 담은 애도 관용구를, 과도한 해설 없이 공적·격한 슬픔을 드러내는 ‘크게 통곡하며’로 옮겼습니다.
- source_word: σποδὸν
  english_pob_choice: ashes
  chosen_korean: 재
  alternatives_korean:
  - 재가루
  - 잿가루
  lexicon: LSJ
  rationale: 애도 표지로서의 ‘ashes’를 한국어 성경 문맥에 자연스러운 ‘재’로 옮겼습니다.
theological_decisions:
- issue: 애도 관습의 표현 방식
  chosen_reading: 이 구절은 옷 찢기, 통곡, 머리 위에 재를 뿌리기가 고대 이스라엘의 전형적 슬픔 표지라는 점을 살리되, 본문에 없는 해석적 요소는 덧붙이지 않았습니다.
  alternative_readings:
  - 의식적 금식이나 회개의 표시를 명시적으로 덧붙이는 번역
  - ‘슬퍼하며’처럼 약화된 표현
  rationale: 헬라어 본문이 보여 주는 공개적 애도 행위를 그대로 전달하는 것이 중요하므로, 문화적 관습 설명은 주석으로만 처리하는 편이 적절합니다.
  doctrine_reference: 장례/애도 관습에 대한 성경적 서술
- issue: 재의 위치 표현
  chosen_reading: ‘자기들의 머리 위에’로 직역해 개별적 머리에 뿌리는 행위를 보존했습니다.
  alternative_readings:
  - ‘머리에’로 단순화
  - ‘머리 위에’ 대신 ‘머리 위로’
  rationale: 그리스어 전치사구가 가진 동작의 방향성과 표지성을 살리기 위해 ‘머리 위에’를 유지했습니다.
  doctrine_reference: 본문 충실성
