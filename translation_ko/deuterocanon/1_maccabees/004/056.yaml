lexical_decisions:
- source_word: ἐποίησαν τὸν ἐγκαινισμὸν
  english_pob_choice: they celebrated the dedication
  chosen_korean: 봉헌식을 지켰으며
  alternatives_korean:
  - 봉헌을 행했으며
  - 봉헌식을 거행했으며
  - 봉헌을 기념했으며
  lexicon: LSJ
  rationale: ἐγκαινισμός는 단순한 ‘만듦’이 아니라 봉헌/헌당의 예식을 가리키므로, 한국어에서는 자연스럽고 예식적 뉘앙스를 살리는 ‘봉헌식’으로 옮겼습니다.
- source_word: ἡμέρας ὀκτώ
  english_pob_choice: for eight days
  chosen_korean: 여드레 동안
  alternatives_korean:
  - 여덟 날 동안
  - 8일 동안
  lexicon: BDAG
  rationale: 지속 기간의 의미를 간결하고 전통적인 한국어 표현으로 살리기 위해 ‘여드레 동안’을 사용했습니다.
- source_word: ὁλοκαυτώματα
  english_pob_choice: whole burnt offerings
  chosen_korean: 번제물
  alternatives_korean:
  - 온전한 번제물
  - 전번제물
  - 온전히 불태우는 제물
  lexicon: LSJ
  rationale: 전부 불태우는 제사라는 핵심을 살리면서, 한국어 성경 문맥에서 가장 익숙한 제의 용어인 ‘번제물’을 택했습니다.
- source_word: θυσίαν σωτηρίου καὶ αἰνέσεως
  english_pob_choice: a sacrifice of deliverance and praise
  chosen_korean: 구원과 찬양의 제사
  alternatives_korean:
  - 구원의 제사와 찬양
  - 구원제와 찬양제
  - 구호와 찬양의 제사
  lexicon: LSJ
  rationale: σωτηρίου는 여기서 영어 POB가 주석으로도 밝히듯 ‘deliverance/salvation’의 의미를 지니므로, 본문 의미를 직접 반영해 ‘구원’으로 옮겼고, αἰνέσεως는 ‘찬양’으로 살렸습니다.
theological_decisions:
- issue: σωτηρίου의 제의적 의미를 ‘peace offering’으로 좁힐지 여부
  chosen_reading: ‘구원’으로 옮겨, 본문의 표면 의미인 구원/건짐의 강조를 유지했습니다.
  alternative_readings:
  - 화목제
  - 화목제물
  - 평안제
  rationale: 이 그리스어 본문은 히브리 제의 범주를 직접 부르는 말이 아니라 σωτηρίου라는 어휘 자체를 사용하므로, 번역에서는 의례적 범주를 덧씌우기보다 그리스어의 직접 의미를 보존하는 것이 더 투명합니다.
  doctrine_reference: 원어 우선 원칙, 제의 용어의 표면 의미 보존
