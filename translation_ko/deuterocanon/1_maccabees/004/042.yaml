  yaml_path: translation/deuterocanon/1_maccabees/004/042.yaml
  text: And he chose blameless priests[a], devoted to the law.
  footnotes:
  - marker: a
    text: Or 'unblemished priests, zealous for the law.' The Greek can emphasize both freedom from defect and eager commitment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 율법에 열심인 흠 없는 제사장들을 선택했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘흠 없는 제사장들, 율법에 열심인 이들’로 옮길 수 있습니다. 그리스어는 제의적·도덕적으로 흠이 없다는 뜻과 율법을 향한 열의를 함께 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέλεξεν
  english_pob_choice: chose
  chosen_korean: 선택했습니다
  alternatives_korean:
  - 골랐습니다
  - 뽑았습니다
  lexicon: LSJ
  rationale: 아오리스트의 의도적 선발을 자연스러운 현대어로 옮기되, 단순한 임의적 '고름'보다 목적성을 살리기 위해 '선택했습니다'를 택했습니다.
- source_word: ἱερεῖς
  english_pob_choice: priests
  chosen_korean: 제사장들
  alternatives_korean:
  - 사제들
  - 제사들
  lexicon: LSJ
  rationale: 유대 성전 맥락의 ἱερεύς는 한국어 성경에서 통상 '제사장'이므로 이를 유지했습니다.
- source_word: ἀμώμους
  english_pob_choice: blameless
  chosen_korean: 흠 없는
  alternatives_korean:
  - 책망할 데 없는
  - 흠잡을 데 없는
  - 결점 없는
  lexicon: LSJ
  rationale: 이 형용사는 도덕적 흠 없음과 제의적 결격 없음 둘 다를 열 수 있어, 한국어에서는 두 뉘앙스를 함께 담는 '흠 없는'이 가장 간결합니다.
- source_word: θελητὰς νόμου
  english_pob_choice: devoted to the law
  chosen_korean: 율법을 열심히 따르는
  alternatives_korean:
  - 율법에 헌신한
  - 율법을 원하는
  - 율법을 사랑하는
  lexicon: LSJ
  rationale: θελητής는 단순한 자원 의사가 아니라 강한 지향과 열의를 가리키므로, '열심히 따르는'으로 능동적 충성을 살렸습니다.
theological_decisions:
- issue: ἀμώμους의 제의적·도덕적 이중 의미를 어떻게 드러낼지
  chosen_reading: '''흠 없는''으로 두 의미를 함께 열어 두었습니다.'
  alternative_readings:
  - '''흠 잡을 데 없는''처럼 도덕성 중심으로만 좁히는 읽기'
  - '''결점 없는''처럼 외적 자격 중심으로만 좁히는 읽기'
  rationale: 본문은 제사장 자격과 율법에 대한 태도를 함께 암시하므로, 한쪽으로만 좁히지 않고 포괄적인 표현을 유지하는 것이 더 충실합니다.
  doctrine_reference: 번역 철학 §1, §5
- issue: θελητὰς νόμου를 단순한 '율법의 사람'으로 둘지, 적극적 헌신으로 드러낼지
  chosen_reading: 율법을 향한 적극적 충성을 나타내는 표현으로 옮겼습니다.
  alternative_readings:
  - '''율법을 원하는 사람들'''
  - '''율법의 뜻을 가진 사람들'''
  rationale: 영어 POB가 'devoted to the law'를 택한 것은 단순한 의지보다 강한 헌신을 드러내기 위한 것이므로, 한국어도 그 긴장을 유지해야 합니다.
  doctrine_reference: 번역 철학 §1, §5
