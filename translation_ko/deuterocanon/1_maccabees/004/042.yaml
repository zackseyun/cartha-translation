  source_fidelity: ἐπέλεξεν은 의도적인 선발을 뜻하므로 ‘선택했습니다’가 적절합니다. ἱερεῖς ἀμώμους는 ‘흠 없는 제사장들’로 정확히 옮겼습니다. 다만 θελητὰς νόμου는 율법에 대한 자발적 열의·헌신을 가리키며, ‘율법을 열심히 따르는’은 실제 율법 준수 행위 쪽으로 뜻을 다소 구체화합니다. ‘율법에 열심인’이 원문의 여지를 더 잘 보존합니다.
  naturalness: 원안의 ‘제사장들, 곧 율법을 열심히 따르는 이들’도 이해할 수 있으나, 병렬 수식 관계를 ‘율법에 열심인 흠 없는 제사장들’로 처리하면 더 간결하고 자연스럽습니다. 합쇼체 종결도 적절합니다.
  terminology: ‘제사장’, ‘율법’, ‘흠 없는’은 유대 성전 및 율법 맥락에 알맞고, 현대 표준 한국어 성경 문체에도 자연스럽습니다.
