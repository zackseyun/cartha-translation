  text: And they placed loaves on the table[a], and they spread out the curtains[b]; and they completed all the works that they had done.
  footnotes:
  - marker: a
    text: Or 'loaves' for 'bread.' The Greek has the plural ἄρτους.
    reason: lexical_alternative
  - marker: b
    text: Or 'veils' for 'curtains,' a term often used for sanctuary hangings.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 상 위에 빵을 올려놓고, 휘장을 펼쳐 두었으며, 자신들이 한 모든 일을 마무리하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘빵’은 ἄρτους의 자연스러운 한국어 번역입니다. 복수의 뉘앙스를 살리면 ‘빵들/빵덩이들’도 가능하지만, 본문 의미상 제의용 빵을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: τὰ καταπετάσματα는 성소의 걸개를 가리킬 수 있어 ‘휘장’으로 옮겼습니다. 더 직역하면 ‘커튼’도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέθηκαν
