base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/036.yaml
  text: Then Judas and his brothers said[a], “Look, our enemies have been crushed[b]. Let us go up to cleanse the sanctuary and dedicate it.”
  footnotes:
  - marker: a
    text: Or 'dedicate it'; the Greek verb can mean 'dedicate' or 'inaugurate,' but here the context is the renewed dedication of the defiled temple.
    reason: lexical_alternative
  - marker: b
    text: '''Go up'' preserves the Greek wording, likely reflecting ascent to Jerusalem and the temple mount.'
    reason: cultural_note
translation:
  language: ko
  text: 그러자 유다와 그의 형제들이 말했습니다. 「보십시오[a], 우리의 적들이 무너졌습니다[b]. 우리가 올라가서 성소를 깨끗하게 하고 봉헌합시다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ἰδοὺ는 주의를 환기하는 감탄사로, 문맥상 ‘보십시오’로 옮겼습니다.
    reason: source_note
  - marker: b
    text: ‘무너졌습니다’는 συνετρίβησαν의 패배·파괴 의미를 살린 번역입니다.
    reason: source_note
lexical_decisions:
- source_word: Εἶπεν δὲ Ἰούδας καὶ οἱ ἀδελφοὶ αὐτοῦ
  english_pob_choice: Then Judas and his brothers said
  chosen_korean: 그러자 유다와 그의 형제들이 말했습니다
  alternatives_korean:
  - 그때 유다와 그의 형제들이 말했습니다
  - 유다와 그의 형제들이 이르기를
  lexicon: LSJ
  rationale: 서사적 연결어 δέ는 앞뒤 흐름을 이어 주는 ‘그러자’로 자연스럽게 옮기고, Ἰούδας는 역사적 인물명 ‘유다’로 처리했습니다.
- source_word: Ἰδοὺ
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: LSJ
  rationale: 청자에게 장면 전환을 알리는 감탄사를 현대 합쇼체로 살려, 구어적이지만 공손한 ‘보십시오’를 택했습니다.
- source_word: συνετρίβησαν οἱ ἐχθροὶ ἡμῶν
  english_pob_choice: our enemies have been crushed
  chosen_korean: 우리의 적들이 무너졌습니다
  alternatives_korean:
  - 우리의 적들이 산산이 부서졌습니다
  - 우리의 적들이 꺾였습니다
  lexicon: LSJ
  rationale: συντρίβω의 강한 파괴·패배 의미를 살리되, 군사적 문맥에서 한국어로 가장 자연스럽고 과장되지 않게 ‘무너졌습니다’로 옮겼습니다.
- source_word: ἀναβῶμεν
  english_pob_choice: Let us go up
  chosen_korean: 우리가 올라가서
  alternatives_korean:
  - 올라갑시다
  - 올라가자
  lexicon: LSJ
  rationale: 예루살렘과 성전 산으로의 상승을 암시하는 방향성을 살리기 위해 ‘올라가서’를 유지했습니다.
- source_word: τὰ ἅγια
  english_pob_choice: the sanctuary
  chosen_korean: 성소
  alternatives_korean:
  - 성전
  - 거룩한 곳
  - 거룩한 것들
  lexicon: LSJ
  rationale: 성전 정결·재봉헌 문맥에서 τὰ ἅγια는 단순한 ‘거룩한 것들’보다 성소를 가리키는 표현으로 이해하는 것이 가장 분명합니다.
- source_word: ἐγκαινίσαι
  english_pob_choice: dedicate it
  chosen_korean: 봉헌합시다
  alternatives_korean:
  - 헌납합시다
  - 다시 봉헌합시다
  - 봉헌하게 합시다
  lexicon: LSJ
  rationale: ἐγκαινίζω는 새롭게 봉헌·헌정하는 뜻이 있으므로, 예배적 맥락을 드러내는 ‘봉헌합시다’로 옮겼습니다.
theological_decisions:
- issue: τὰ ἅγια의 성전-정결 문맥
  chosen_reading: 성소
  alternative_readings:
  - 성전
  - 거룩한 곳
  rationale: 본문은 더럽혀진 예루살렘 성전의 회복을 말하므로, 한국어에서 제의적·공간적 대상이 분명한 ‘성소’가 문맥을 가장 정확히 전달합니다.
  doctrine_reference: Translation philosophy §§1, 6
- issue: ἐγκαινίσαι의 의미를 새 봉헌으로 드러낼지 여부
  chosen_reading: 봉헌합시다
  alternative_readings:
  - 헌납합시다
  - 다시 봉헌합시다
  rationale: 원문에는 ‘다시’가 명시되지는 않지만, 이미 존재하던 성전이 더렵혀진 뒤 다시 예배에 바치는 상황이므로 ‘봉헌’이 그 역사적·제의적 의미를 충분히 담습니다.
  doctrine_reference: Translation philosophy §§1, 6
