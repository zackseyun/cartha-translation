    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 서로 맞붙어 싸웠고, 리시야의 진영에서 약 오천 명의 병사가 쓰러졌으며, 그 병사들은 그들 앞에서 쓰러졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘리시야의 진영에서 오천 명이 쓰러졌다’로 옮길 수 있습니다. 그리스어의 εἰς는 수량의 대략성이나 총계를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들 맞은편에서’, ‘그들 앞에’로 옮길 수 있습니다.
    reason: lexical_alternative
