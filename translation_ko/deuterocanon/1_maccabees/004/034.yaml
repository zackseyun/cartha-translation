  rationale: 군사적 문맥에서 συμβάλλω는 단순한 '만나다'보다 '맞붙어 싸우다'의 의미가 분명하므로, 상호성을 살리면서도 자연스러운 한국어로 옮겼습니다.
- source_word: ἐκ τῆς παρεμβολῆς Λυσίου
  english_pob_choice: from the camp of Lysias
  chosen_korean: 리시야의 진영에서
  alternatives_korean:
  - 리시야의 진영으로부터
