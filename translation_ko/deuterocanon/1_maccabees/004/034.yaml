    rationale: ‘그들도 그들 앞에서’는 지시 대상이 중첩되어 한국어 독자가 누가 쓰러졌는지 파악하기 어렵고, ‘도’는 단순 반복 서술인 원문의 καί보다 추가적 의미를 암시합니다. 앞 절의 ‘약 오천 명의 병사들’을 받아 명시하는 편이 안전합니다.
