  lexicon: LSJ
  rationale: εἰς가 수량의 대략성을 나타낼 수 있으므로, 숫자를 단정하지 않고 '약'을 넣어 원문의 어감과 영어 POB의 처리에 맞췄습니다.
- source_word: ἐξ ἐναντίας αὐτῶν
  english_pob_choice: facing them / before them
  chosen_korean: 그들 앞에서
  alternatives_korean:
  - 그들을 마주하여
  - 그들 맞은편에서
  - 그들 앞에
  lexicon: LSJ
  rationale: 이 표현은 대치 상태의 위치를 가리키므로, 한국어에서는 전투 장면에 자연스러운 '그들 앞에서'로 옮겨 방향성을 살렸습니다.
