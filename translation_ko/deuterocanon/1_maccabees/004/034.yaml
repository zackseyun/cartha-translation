  text: And they engaged one another in battle[a], and about five thousand men from the camp of Lysias fell[b], and they fell before them.
  footnotes:
  - marker: a
    text: Or 'five thousand men fell from Lysias's camp'; the Greek phrase with εἰς may be taken as an approximate or total number.
