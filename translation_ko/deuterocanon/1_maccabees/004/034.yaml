  text: And they engaged one another in battle[a], and about five thousand men from the camp of Lysias fell[b], and they fell before them.
  footnotes:
  - marker: a
    text: Or 'five thousand men fell from Lysias's camp'; the Greek phrase with εἰς may be taken as an approximate or total number.
    reason: lexical_alternative
  - marker: b
    text: Or 'before them' or 'opposite them' for 'facing them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 서로 맞붙어 싸웠고, 리시야의 진영에서 약 오천 명의 남자가 쓰러졌으며, 그들도 그들 앞에서 쓰러졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '리시야의 진영에서 오천 명이 쓰러졌다'로 옮길 수 있습니다. 그리스어의 εἰς는 수량의 대략성이나 총계를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '그들 맞은편에서', '그들 앞에'로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέβαλλον ἀλλήλοις
  english_pob_choice: they engaged one another in battle
  chosen_korean: 서로 맞붙어 싸웠고
  alternatives_korean:
