  lexicon: LSJ
  rationale: παρεμβολή는 군사적 '진영/야영지'를 뜻하므로 '진영'이 가장 간결하고 문맥에 맞습니다.
- source_word: εἰς πεντακισχιλίους ἄνδρας
  english_pob_choice: about five thousand men
  chosen_korean: 약 오천 명의 남자가
