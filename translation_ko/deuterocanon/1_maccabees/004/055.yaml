  text: And all the people fell on their faces[b][a], and they worshiped and blessed toward heaven the one who had prospered them.
  footnotes:
  - marker: a
    text: Or 'to heaven'; the Greek may express direction ('toward heaven') or, by reverent circumlocution, reference to God in heaven.
    reason: lexical_alternative
  - marker: b
    text: Or 'the one who had given them success.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 온 백성이 얼굴을 땅에 대고 엎드려 경배하고, 그들을 잘되게 하신 분을 향해 하늘을 우러러 복을 빌었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘을 향해’; 헬라어는 방향을 나타낼 수도 있고, 경건한 우회 표현으로 하늘의 하나님을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들에게 성공을 주신 분’.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔπεσον ... ἐπὶ πρόσωπον
  english_pob_choice: fell on their faces
  chosen_korean: 얼굴을 땅에 대고 엎드려
  alternatives_korean:
  - 얼굴을 땅에 대고 쓰러져
  - 엎드려 얼굴을 땅에 대고
  lexicon: LSJ
  rationale: ἐπὶ πρόσωπον은 관용적으로 완전한 엎드림을 뜻하므로, 자연스러운 한국어로 그 동작을 분명히 살렸습니다.
- source_word: πᾶς ὁ λαός
  english_pob_choice: all the people
  chosen_korean: 온 백성이
  alternatives_korean:
  - 모든 백성이
  - 백성 전체가
  lexicon: LSJ
  rationale: 집합 명사로서의 전체성을 간결하게 드러내며, 문맥에 맞는 자연스러운 공적 표현입니다.
- source_word: προσεκύνησαν
  english_pob_choice: worshiped
  chosen_korean: 경배하고
  alternatives_korean:
  - 예배하고
  - 절하고
  lexicon: BDAG
  rationale: 이 문맥은 단순한 몸짓보다 하나님께 드리는 경배의 행위이므로, 종교적 의미를 직접 드러내는 ‘경배’가 적절합니다.
- source_word: ηὐλόγησαν ... τὸν εὐοδώσαντα αὐτούς
  english_pob_choice: blessed ... the one who had prospered them
  chosen_korean: 그들을 잘되게 하신 분을 향해 ... 복을 빌었습니다
  alternatives_korean:
  - 그들을 번영하게 하신 분을 향해 ... 축복했습니다
  - 그들에게 성공을 주신 분을 향해 ... 찬송했습니다
  lexicon: BDAG
  rationale: ηὐλόγησαν은 하나님께 드리는 ‘복을 빌다/송축하다’의 뜻을 살릴 수 있고, εὐοδόω는 ‘잘되게 하다, 형통하게 하다’의 의미가 있어 이를 함께 반영했습니다.
- source_word: εἰς οὐρανόν
  english_pob_choice: toward heaven
  chosen_korean: 하늘을 우러러
  alternatives_korean:
  - 하늘을 향해
  - 하늘 쪽으로
  lexicon: LSJ
  rationale: 방향성을 유지하면서도 경배의 자세와 어울리는 한국어 표현으로 옮겼습니다.
theological_decisions:
- issue: τὸν εὐοδώσαντα αὐτούς의 지시 대상
  chosen_reading: 본문은 하나님을 직접 이름 붙이지 않고, ‘그들을 잘되게 하신 분’이라는 우회적 표현으로 가리킵니다.
  alternative_readings:
  - 보다 명시적으로 ‘하나님, 그들을 잘되게 하신 분’으로 옮길 수 있습니다.
  rationale: 헬라어의 관형절적 표현과 ‘하늘을 향해’라는 결합이 지시 대상을 암시하므로, 본문의 우회성과 경건한 뉘앙스를 그대로 보존했습니다.
  doctrine_reference: 원문의 신학적 우회 표현을 보존하여 직접 명시로 과도하게 해석하지 않음
