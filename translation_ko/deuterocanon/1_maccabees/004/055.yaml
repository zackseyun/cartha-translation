  source_fidelity: 수정이 필요합니다. 초안의 ‘하늘을 우러러 복을 빌었습니다’는 εἰς οὐρανόν의 방향 표현을 시선 동작으로 바꾸며, ηὐλόγησαν의 목적어인 ‘그들을 잘되게 하신 분’을 향한 송축을 그분께 복을 비는 행위처럼 읽히게 합니다. 또한 ‘그들을 잘되게 하신 분을 향해 하늘을 우러러’는 원문의 결합 관계를 바꿉니다.
  naturalness: ‘얼굴을 땅에 대고 엎드려’와 ‘온 백성’은 자연스럽습니다. 다만 하나님을 목적어로 하는 ηὐλόγησαν에는 ‘복을 빌었습니다’보다 ‘송축했습니다’가 자연스럽고 의미가 정확합니다. ‘하늘을 향해 … 분을 송축했습니다’도 문맥상 자연스러운 경건한 우회 표현입니다.
  terminology: προσεκύνησαν은 ‘경배하며’로, ηὐλόγησαν은 하나님께 드리는 찬양적 송축을 뜻하는 ‘송축했습니다’로 옮기는 것이 적절합니다. τὸν εὐοδώσαντα αὐτούς의 간접적 하나님 지칭은 ‘그들을 잘되게 하신 분’으로 보존합니다.
