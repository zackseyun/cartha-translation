lexical_decisions:
- source_word: Ἰδουμαίαν
  english_pob_choice: Idumea
  chosen_korean: 이두매아
  alternatives_korean:
  - 에돔
  lexicon: LSJ
  rationale: 헬라어 지명 Ἰδουμαία는 헬레니즘 시대의 지역명인 Idumea를 가리키므로, 역사적 배경을 살려 이두매아로 옮겼습니다.
- source_word: παρεμβάλον
