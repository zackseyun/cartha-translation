  rationale: 헬라어 συνήντησεν αὐτοῖς는 단순한 우연한 만남보다 군사적 조우를 암시하므로, 서술의 긴장감을 약화시키지 않는 방향이 적절합니다.
  doctrine_reference: 역사서의 서술 뉘앙스 보존
