lexical_decisions:
- source_word: Ἰδουμαίαν
  english_pob_choice: Idumea
  chosen_korean: 이두매아
  alternatives_korean:
  - 에돔
  lexicon: LSJ
  rationale: 헬라어 지명 Ἰδουμαία는 헬레니즘 시대의 지역명인 Idumea를 가리키므로, 역사적 배경을 살려 이두매아로 옮겼습니다.
- source_word: παρεμβάλον
  english_pob_choice: encamped
  chosen_korean: 진을 쳤고
  alternatives_korean:
  - 야영했고
  - 숙영했고
  lexicon: LSJ
  rationale: 군사 문맥에서 야영보다 전투 배치를 드러내는 표현이므로, ‘진을 치다’로 자연스럽고도 군사적인 뉘앙스를 살렸습니다.
- source_word: Βηθορούς
  english_pob_choice: Beth-zur
  chosen_korean: 베트수르
  alternatives_korean:
  - 벧-수르
  - 벧수르
  lexicon: LSJ
  rationale: 본문의 그리스어 표기 Βηθορούς는 영어 POB의 각주처럼 대조가 필요한 지명 문제를 포함하므로, 한국어 음역은 본문에 바로 넣고 지명 고유성을 유지했습니다.
- source_word: ἐν δέκα χιλιάσιν ἀνδρῶν
  english_pob_choice: with ten thousand men
  chosen_korean: 만 명의 병사와 함께
  alternatives_korean:
  - 만 명의 사람과 함께
  - 일만 명과 함께
  lexicon: LSJ
  rationale: ἀνδρῶν은 문자적으로 ‘남자들’이지만 군사 문맥에서는 병력을 뜻하므로, 한국어에서는 의미가 분명한 ‘병사’로 옮겼습니다.
theological_decisions:
- issue: 전투 서술의 직설성 유지
  chosen_reading: 유다가 적군을 단순히 ‘맞이했다’가 아니라 전장 맥락에서 ‘맞섰습니다’로 옮겨, 충돌 직전의 대치감을 살렸습니다.
  alternative_readings:
  - 그들을 만났습니다
  - 그들과 마주쳤습니다
  rationale: 헬라어 συνήντησεν αὐτοῖς는 단순한 우연한 만남보다 군사적 조우를 암시하므로, 서술의 긴장감을 약화시키지 않는 방향이 적절합니다.
  doctrine_reference: 역사서의 서술 뉘앙스 보존
