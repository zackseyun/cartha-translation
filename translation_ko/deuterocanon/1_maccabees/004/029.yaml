  - 일만 명과 함께
  lexicon: LSJ
  rationale: ἀνδρῶν은 문자적으로 ‘남자들’이지만 군사 문맥에서는 병력을 뜻하므로, 한국어에서는 의미가 분명한 ‘병사’로 옮겼습니다.
