  lexicon: LSJ
  rationale: 본문의 그리스어 표기 Βηθορούς는 영어 POB의 각주처럼 대조가 필요한 지명 문제를 포함하므로, 한국어 음역은 본문에 바로 넣고 지명 고유성을 유지했습니다.
- source_word: ἐν δέκα χιλιάσιν ἀνδρῶν
