lexical_decisions:
- source_word: γνώσονται
  english_pob_choice: will know
  chosen_korean: 알게 될 것입니다
  alternatives_korean:
  - 알게 됩니다
  - 알아차리게 될 것입니다
  lexicon: BDAG
  rationale: 미래형 인지 동사를 자연스러운 합쇼체로 옮겨, 예언적 확정성과 인식의 도달을 함께 살렸습니다.
- source_word: πάντα τὰ ἔθνη
  english_pob_choice: all the nations
  chosen_korean: 모든 민족이
  alternatives_korean:
  - 모든 나라가
  - 모든 이방 민족이
  lexicon: BDAG
  rationale: ἔθνη의 보편적 민족·국가 범위를 살리되, 문맥상 ‘이방인’으로 좁히지 않고 자연스러운 한국어로 옮겼습니다.
- source_word: ὁ λυτρούμενος
  english_pob_choice: one who redeems
  chosen_korean: 속량하시고
  alternatives_korean:
  - 구속하시고
  - 되사시는
  lexicon: BDAG
  rationale: 현재분사적·서술적 뉘앙스를 한국어 동사구로 풀어 ‘속량’의 구원·해방 이미지를 보존했습니다.
- source_word: σώζων
  english_pob_choice: saves
  chosen_korean: 구원하시는
  alternatives_korean:
  - 살리시는
  - 건져내시는
  lexicon: BDAG
  rationale: σῴζω의 구원 의미를 ‘구원하다’로 직접 살려, 앞의 ‘속량’과 병렬되는 구원의 두 측면을 분명히 했습니다.
theological_decisions:
- issue: 주어가 생략된 ‘redeems and saves’의 지시 대상
  chosen_reading: 주어를 본문에 직접 보충하지 않고, ‘야훼께서 … 분이심을’으로 옮겨 문맥상 하나님을 가리키는 독서와 본문의 함축을 함께 드러냈습니다.
  alternative_readings:
  - 그가 이스라엘을 속량하시고 구원하시는 분이심을
  - 이스라엘을 속량하고 구원하시는 분이 계심을
  rationale: 헬라어는 주어를 명시하지 않지만 문맥상 야훼를 가리킵니다. 본문이 말하는 사실성을 살리되, 함축된 주어를 한국어에서 과도하게 해소하지 않도록 했습니다.
  doctrine_reference: DOCTRINE.md § Preserve theological tension rather than resolve it
