  text: 그들은 무장한 강한 민족들의 진영과 그 진영을 둘러싼 기병을 보았습니다. 그 기병은 전쟁에 훈련된 자들이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무장한 강한 이방 민족들의 진영과 그것을 둘러싼 기병을 보았습니다. 그 기병은 전쟁에 훈련된 자들이었습니다.’
    reason: ἐθνῶν은 문맥상 유대인과 구별되는 ‘이방 민족들’로 이해될 수도 있습니다.
lexical_decisions:
- source_word: παρεμβολὴν
  english_pob_choice: camp
  chosen_korean: 진
  alternatives_korean:
  - 군영
  - 야영지
  lexicon: LSJ
  rationale: 군사적 의미의 파견된 집결지를 가리키므로, 현대 한국어에서 간결하고 자연스러운 ‘진’이 적절합니다.
- source_word: ἐθνῶν
