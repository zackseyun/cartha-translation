  chosen_reading: ‘민족’의 역사적·군사적 의미를 살려, 1마카베오의 문맥에서 이방 집단을 가리키는 표현으로 처리했습니다.
  alternative_readings:
  - ‘이방인들의’로 좁혀 옮김
  - ‘열국의’로 성경적 어감을 강화함
  rationale: 이 절은 유대 공동체 밖의 군대를 묘사하는 역사 서술이므로, 후기 신약 용례의 고정된 신학 용어를 그대로 이식하지 않고 문맥 중심으로 번역했습니다.
  doctrine_reference: 문맥적 역사서 서술; 용어의 시대별 의미 차이
