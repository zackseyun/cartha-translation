  chosen_korean: 여러 민족의
  alternatives_korean:
  - 민족들의
  - 이방 민족의
  lexicon: LSJ
  rationale: 마카베오서는 유대인과 대비되는 민족 집단을 가리키므로, 직역의 ‘민족들’보다 자연스러운 ‘여러 민족의’로 옮겼습니다.
- source_word: τεθωρακισμένην
  english_pob_choice: armored
  chosen_korean: 무장되어 있었고
  alternatives_korean:
  - 갑옷을 입고 있었고
  - 방호구를 갖춘
  lexicon: LSJ
  rationale: 완료분사는 이미 갖추어진 상태를 나타내므로, 전투 준비가 된 상태를 드러내는 ‘무장되어 있었고’로 자연스럽게 옮겼습니다.
- source_word: ἵππον κυκλοῦσαν αὐτήν
  english_pob_choice: cavalry surrounding it
  chosen_korean: 기병이 그 둘레를 둘러싸고 있었으며
  alternatives_korean:
  - 기병이 그것을 에워싸고 있었으며
  - 기병이 그것을 둘러싸고 있었으며
  lexicon: LSJ
  rationale: 그리스어의 병렬 구조를 살려 ‘그리고’에 해당하는 연결을 유지하면서, 군사적 포위를 분명히 하는 표현으로 옮겼습니다.
- source_word: διδακτοὶ πολέμου
  english_pob_choice: trained for war
  chosen_korean: 전쟁에 익숙한 자들이었습니다
  alternatives_korean:
  - 전쟁을 위해 훈련받은 자들이었습니다
  - 전쟁에 훈련된 자들이었습니다
  lexicon: LSJ
  rationale: 직역의 ‘훈련받은’도 가능하지만, 전쟁 기술과 경험이 몸에 밴 상태를 함께 드러내는 한국어로 ‘익숙한’이 더 자연스럽습니다.
theological_decisions:
- issue: ἐθνῶν의 번역 범위
  chosen_reading: ‘민족’의 역사적·군사적 의미를 살려, 1마카베오의 문맥에서 이방 집단을 가리키는 표현으로 처리했습니다.
  alternative_readings:
  - ‘이방인들의’로 좁혀 옮김
  - ‘열국의’로 성경적 어감을 강화함
  rationale: 이 절은 유대 공동체 밖의 군대를 묘사하는 역사 서술이므로, 후기 신약 용례의 고정된 신학 용어를 그대로 이식하지 않고 문맥 중심으로 번역했습니다.
  doctrine_reference: 문맥적 역사서 서술; 용어의 시대별 의미 차이
