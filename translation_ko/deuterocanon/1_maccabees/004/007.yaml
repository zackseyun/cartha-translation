lexical_decisions:
- source_word: παρεμβολὴν
  english_pob_choice: camp
  chosen_korean: 진
  alternatives_korean:
  - 군영
  - 야영지
  lexicon: LSJ
  rationale: 군사적 의미의 파견된 집결지를 가리키므로, 현대 한국어에서 간결하고 자연스러운 ‘진’이 적절합니다.
- source_word: ἐθνῶν
