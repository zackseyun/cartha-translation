  text: Remember how our fathers were saved in the Red Sea when Pharaoh pursued them with force[a].
  footnotes:
  - marker: a
    text: Or 'at the Red Sea'; alternatively, some prefer 'in the Reed Sea' to reflect the Hebrew background of the Exodus tradition.
