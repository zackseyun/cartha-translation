translation:
  language: ko
  text: 우리 조상들이 붉은 바다에서 어떻게 구원을 받았는지 기억하십시오. 바로 파라오가 그들을 힘으로 추격했을 때입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘홍해에서’로 옮길 수 있습니다. 히브리어 배경을 반영해 ‘갈대 바다’로 보는 견해도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνήσθητε
  english_pob_choice: Remember
  chosen_korean: 기억하십시오
  alternatives_korean:
  - 기억하라
  - 상기하십시오
  lexicon: BDAG
  rationale: 청중에게 과거 구원의 사건을 의도적으로 떠올리게 하는 명령형이므로, 현대 공적 문체에서는 ‘기억하십시오’가 가장 직접적이고 자연스럽습니다.
- source_word: οἱ πατέρες ἡμῶν
  english_pob_choice: our fathers
  chosen_korean: 우리 조상들이
  alternatives_korean:
  - 우리 아버지들이
  - 우리 선조들이
  lexicon: BDAG
  rationale: 문자적으로는 ‘우리 아버지들’이지만, 한국어에서는 이 표현이 지나치게 혈연적일 수 있어, 출애굽 세대를 가리키는 역사적·공동체적 의미를 드러내는 ‘조상들’로 옮겼습니다.
- source_word: ἐν θαλάσσῃ ἐρυθρᾷ
  english_pob_choice: in the Red Sea
  chosen_korean: 붉은 바다에서
  alternatives_korean:
  - 홍해에서
  - 갈대 바다에서
  lexicon: BDAG
  rationale: 헬라어 본문은 관용적으로 ‘Red Sea’를 가리키므로, 직역에 가까운 ‘붉은 바다’로 옮기되, ‘홍해’의 전통적 표현과 ‘갈대 바다’의 대안 가능성을 열어 두었습니다.
- source_word: ἐν δυνάμει
  english_pob_choice: with force
  chosen_korean: 힘으로
  alternatives_korean:
  - 권세로
  - 무력으로
  lexicon: BDAG
  rationale: 추격의 수단이 되는 강한 군사적 힘을 간명하게 드러내는 표현으로 ‘힘으로’를 선택했습니다.
theological_decisions:
- issue: 구원 언어의 역사적 사건 번역
  chosen_reading: 구원을 받았는지
  alternative_readings:
  - 구출을 받았는지
  - 구해졌는지
  rationale: σῴζω의 의미를 역사적 탈출 장면에 적용하면서도, 성경적 구원 어휘와의 연결을 유지하기 위해 ‘구원’을 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
- issue: 붉은 바다 / 홍해 / 갈대 바다
  chosen_reading: 붉은 바다
  alternative_readings:
  - 홍해
  - 갈대 바다
  rationale: 그리스어 본문의 표면 의미와 POB 영어 본문의 선택을 따르되, 히브리 배경 논의는 각주로 처리하는 것이 가장 투명합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 2, 6
