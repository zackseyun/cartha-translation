lexical_decisions:
- source_word: μνήσθητε
  english_pob_choice: Remember
  chosen_korean: 기억하십시오
  alternatives_korean:
  - 기억하라
  - 상기하십시오
  lexicon: BDAG
  rationale: 청중에게 과거 구원의 사건을 의도적으로 떠올리게 하는 명령형이므로, 현대 공적 문체에서는 ‘기억하십시오’가 가장 직접적이고 자연스럽습니다.
- source_word: οἱ πατέρες ἡμῶν
  english_pob_choice: our fathers
  chosen_korean: 우리 조상들이
  alternatives_korean:
  - 우리 아버지들이
  - 우리 선조들이
  lexicon: BDAG
  rationale: 문자적으로는 ‘우리 아버지들’이지만, 한국어에서는 이 표현이 지나치게 혈연적일 수 있어, 출애굽 세대를 가리키는 역사적·공동체적 의미를 드러내는 ‘조상들’로 옮겼습니다.
- source_word: ἐν θαλάσσῃ ἐρυθρᾷ
  english_pob_choice: in the Red Sea
  chosen_korean: 붉은 바다에서
  alternatives_korean:
  - 홍해에서
  - 갈대 바다에서
  lexicon: BDAG
  rationale: 헬라어 본문은 관용적으로 ‘Red Sea’를 가리키므로, 직역에 가까운 ‘붉은 바다’로 옮기되, ‘홍해’의 전통적 표현과 ‘갈대 바다’의 대안 가능성을 열어 두었습니다.
- source_word: ἐν δυνάμει
  english_pob_choice: with force
  chosen_korean: 힘으로
  alternatives_korean:
  - 권세로
  - 무력으로
  lexicon: BDAG
  rationale: 추격의 수단이 되는 강한 군사적 힘을 간명하게 드러내는 표현으로 ‘힘으로’를 선택했습니다.
theological_decisions:
- issue: 구원 언어의 역사적 사건 번역
  chosen_reading: 구원을 받았는지
  alternative_readings:
