  - 구해졌는지
  rationale: σῴζω의 의미를 역사적 탈출 장면에 적용하면서도, 성경적 구원 어휘와의 연결을 유지하기 위해 ‘구원’을 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
- issue: 붉은 바다 / 홍해 / 갈대 바다
  chosen_reading: 붉은 바다
  alternative_readings:
  - 홍해
  - 갈대 바다
  rationale: 그리스어 본문의 표면 의미와 POB 영어 본문의 선택을 따르되, 히브리 배경 논의는 각주로 처리하는 것이 가장 투명합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 2, 6
