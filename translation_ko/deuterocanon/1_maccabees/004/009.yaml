revisions:
- from: 우리 조상들이 붉은 바다에서 어떻게 구원을 받았는지 기억하십시오. 바로 파라오가 그들을 힘으로 추격했을 때입니다.[a]
  to: 바로가 무력으로 그들을 추격했을 때, 우리 조상들이 홍해에서 어떻게 구원을 받았는지 기억하십시오.[a]
  rationale: 원문의 시간절을 주절에 통합하여 바로의 추격과 조상들의 구원이 동일 사건 안에서 연결됨을 명확히 했습니다. ‘홍해’는 그리스어 표현의 통상적 한국어 지명이며, ‘붉은 바다’와 ‘갈대 바다’의 대안은 각주에 보존했습니다. ‘무력으로’는 ἐν δυνάμει의 힘·군사력이라는 범위를 유지하면서 ‘힘으로’보다 자연스럽습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:39:31Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 원문의 시간절(‘바로가 그들을 힘으로 추격했을 때’)이 독립된 문장 조각으로 분리되어 앞 문장과의 통사적 관계가 약해졌습니다. 또한 ‘붉은 바다’는 이해 가능하나 성서·현대 한국어의 고유 지명으로는 ‘홍해’가 자연스럽습니다.
  naturalness: ‘바로 파라오가’는 동의어를 중복한 어색한 표현이며, ‘힘으로 추격했을 때입니다’는 합쇼체 문장으로 부자연스럽습니다. 시간절을 주절 안에 통합하고 ‘무력으로’를 사용하면 현대 공적 문체에서 자연스럽습니다.
  terminology: ‘홍해’는 ἐρυθρὰ θάλασσα의 통상적인 한국어 성서 지명입니다. σῴζω의 ‘구원을 받다’는 역사적 구출의 맥락과 성서적 어휘의 연계를 모두 보존합니다. ‘우리 조상들’은 한국어에서 출애굽 시대의 공동체적 선대를 자연스럽게 가리킵니다.
