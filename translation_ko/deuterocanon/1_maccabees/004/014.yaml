    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆψαν
  english_pob_choice: they joined battle
  chosen_korean: 전투를 벌였고
  alternatives_korean:
  - 교전을 벌였고
  - 맞붙었고
  - 전투에 합류했고
  lexicon: LSJ
  rationale: 군사적 문맥에서 단순히 ‘함께하다’가 아니라 실제로 싸움을 시작해 맞붙는 뜻이므로, 전투 행위를 자연스럽게 드러내는 표현을 택했습니다.
- source_word: συνετρίβησαν
  english_pob_choice: were crushed
  chosen_korean: 무너졌으며
  alternatives_korean:
  - 산산이 부서졌으며
  - 꺾였으며
  - 패배했으며
  lexicon: LSJ
  rationale: συντρίβω의 핵심은 ‘부서지다/짓눌리다’의 강한 파괴성입니다. 한국어에서는 ‘무너지다’가 전투 맥락에서 압도적 패배와 붕괴를 비교적 직접적으로 전달합니다.
- source_word: τὰ ἔθνη
  english_pob_choice: the nations
  chosen_korean: 그 민족들은
  alternatives_korean:
  - 그 나라들은
  - 이방 민족들은
  - 이방인들은
  lexicon: LSJ
  rationale: 직역하면 ‘그 민족들/나라들’이지만, 1마카베오의 문맥상 비유대 세력을 가리킬 수 있어 주석적 단서를 한국어 본문에 과도하게 넣지 않으면서도 의미를 살린 표현을 사용했습니다.
- source_word: τὸ πεδίον
  english_pob_choice: the plain
  chosen_korean: 평지
  alternatives_korean:
  - 들판
  - 넓은 들
  - 평원
  lexicon: LSJ
  rationale: πεδίον은 군사적 후퇴가 이루어지는 넓고 평탄한 지형을 뜻하므로, 간결하고 지형적 뉘앙스를 유지하는 ‘평지’가 적절합니다.
theological_decisions:
- issue: τὰ ἔθνη의 범위
  chosen_reading: 본문은 ‘그 민족들’로 옮기되, 특정 민족학적 해설을 본문에 고정하지 않았습니다.
  alternative_readings:
  - 이방인들
  - 이방 민족들
  rationale: 1마카베오에서 ἔθνη는 비유대 세력을 가리킬 수 있지만, 여기서는 그 가능성을 열어 두고 원문의 더 넓은 집단 명칭을 보존하는 것이 적절합니다.
  doctrine_reference: 본문-문맥 우선 원칙
