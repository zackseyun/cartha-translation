  source_fidelity: 그리스어의 제의 동사 ἀνήνεγκαν과 목적어 θυσίαν을 ‘제사를 드렸습니다’로 자연스럽게 옮겼으며, κατὰ τὸν νόμον, θυσιαστήριον τῶν ὁλοκαυτωμάτων, τὸ καινὸν ὃ ἐποίησαν의 의미도 모두 보존합니다. ‘새로 만든 번제단’은 ‘새로운 … 그들이 만든’을 한국어에서 매끄럽게 결합한 표현입니다.
