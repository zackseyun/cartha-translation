  terminology: ‘율법’, ‘번제단’, ‘제사’는 성전 제의와 율법 준수라는 본문의 핵심 용어를 정확하고 일관되게 전달합니다. 각주도 ‘번제단 위에서’에 대한 자연스러운 위치 표현의 대안을 제공합니다.
