lexical_decisions:
- source_word: ἀνήνεγκαν
  english_pob_choice: offered
  chosen_korean: 제사를 드렸습니다
  alternatives_korean:
  - 드렸습니다
  - 바쳤습니다
  lexicon: LSJ
  rationale: 제사 문맥의 ἀναφέρω는 ‘드리다/바치다’의 희생 제의 의미이므로, 한국어에서는 자연스럽고 제의적 뉘앙스를 살리는 ‘제사를 드렸습니다’가 가장 적절합니다.
- source_word: θυσίαν
  english_pob_choice: sacrifice
  chosen_korean: 제사
  alternatives_korean:
  - 희생제물
  - 희생
  lexicon: LSJ
  rationale: 여기서는 행위 자체를 가리키는 제의 용례이므로, 직역적이지만 어색한 ‘희생제물’보다 ‘제사’가 원문의 제의적 의미를 분명하게 전달합니다.
- source_word: κατὰ τὸν νόμον
  english_pob_choice: according to the law
  chosen_korean: 율법에 따라
  alternatives_korean:
  - 법에 따라
  - 율법대로
  lexicon: LSJ
  rationale: 모세 율법에 따른 합법적 성전을 강조하므로, POB의 ‘law’를 한국어 성서 용례에 맞는 ‘율법’으로 옮겼습니다.
- source_word: θυσιαστήριον τῶν ὁλοκαυτωμάτων
  english_pob_choice: altar of burnt offering
  chosen_korean: 번제단
  alternatives_korean:
  - 번제의 제단
  - 번제물을 드리는 제단
  lexicon: LSJ
  rationale: 이 복합어는 성전 예배의 정해진 제단 명칭이므로, 축약된 성서 한국어 표현인 ‘번제단’이 가장 간결하고 정확합니다.
- source_word: τὸ καινόν ὃ ἐποίησαν
  english_pob_choice: the new altar ... that they had made
  chosen_korean: 새로 만든
  alternatives_korean:
  - 새로 지은
  - 새로 만든 그
  lexicon: LSJ
  rationale: ‘새로운’의 상태와 ‘그들이 만든’이라는 과거 완료적 배경을 함께 살려, 제단의 새로움과 제작 완료를 자연스럽게 연결했습니다.
theological_decisions:
- issue: 성전 제사의 회복을 드러내는 표현
  chosen_reading: ‘제사를 드렸습니다’와 ‘번제단’을 유지해, 일반적 예배가 아니라 율법에 따른 성전 제사의 회복임을 분명히 했습니다.
  alternative_readings:
  - ‘예물을 드렸습니다’
  - ‘제단 위에서 예배했습니다’
  rationale: 본문은 단순한 경건 행위가 아니라 율법에 합당한 제의 행위를 말하므로, 제사 언어를 약화시키지 않는 것이 문맥에 충실합니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
