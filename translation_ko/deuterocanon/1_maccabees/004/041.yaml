translation:
  language: ko
  text: 그때 유다는 사람들이 성채 안에 있는 자들과 싸우도록 명령했습니다. 유다가 성소를 정결하게 할 때까지였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아크라에 있는 자들’. 아크라는 예루살렘의 요새로 알려진 특정 성채를 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέταξεν
  english_pob_choice: ordered
  chosen_korean: 명령했습니다
  alternatives_korean:
  - 지시했습니다
  - 명했습니다
  lexicon: BDAG
  rationale: ἐπιτάσσω의 핵심은 권위를 가진 지시입니다. 한국어에서는 ‘명령했습니다’가 군사적 상황과 지휘의 뉘앙스를 자연스럽게 살립니다.
- source_word: ἀνδράσιν
  english_pob_choice: men
  chosen_korean: 사람들을
  alternatives_korean:
  - 남자들을
  - 병사들을
  lexicon: LSJ
  rationale: 원문은 ‘남자들/사람들’에 해당하지만, 문맥상 군사 행위가 분명하더라도 ‘병사들’은 원문보다 구체적입니다. 한국어에서는 자연성을 위해 ‘사람들을’로 두었습니다.
- source_word: τοὺς ἐν τῇ ἄκρᾳ
  english_pob_choice: those in the citadel
  chosen_korean: 성채 안에 있는 자들
  alternatives_korean:
  - 아크라에 있는 자들
  - 요새 안에 있는 자들
  lexicon: LSJ
  rationale: ἄκρα는 일반적으로 ‘성채/요새’를 뜻할 수 있으며, 마카베오기 문맥에서는 예루살렘의 특정 요새를 가리킬 수도 있습니다. 본문에서는 뜻을 바로 드러내는 ‘성채’로 옮겼습니다.
- source_word: τὰ ἅγια
  english_pob_choice: the sanctuary
  chosen_korean: 성소
  alternatives_korean:
  - 성전
  - 거룩한 곳
  lexicon: LSJ
  rationale: 이 문맥에서 τὰ ἅγια는 단순한 ‘거룩한 것들’보다 성전의 거룩한 공간을 가리킵니다. 한국어 성경에서 가장 간결하고 정확한 대응은 ‘성소’입니다.
theological_decisions:
- issue: ἕως καθαρίσῃ의 종결 표지와 주체
  chosen_reading: ‘성소를 깨끗하게 할 때까지’로 번역해, 싸움의 목표가 정결 회복에 있음을 드러냈습니다.
  alternative_readings:
  - ‘그가 성소를 깨끗하게 할 때까지’
  - ‘성소가 깨끗해질 때까지’
  rationale: ἕως 뒤의 aorist subjunctive는 결과가 이루어질 때까지의 한계를 나타냅니다. 한국어에서는 서술을 간결하게 하되, 정결이 전투의 목적이라는 점을 보존했습니다.
  doctrine_reference: 'Translation philosophy: source-directed temporal nuance; avoid over-explicit agency where Greek is concise.'
