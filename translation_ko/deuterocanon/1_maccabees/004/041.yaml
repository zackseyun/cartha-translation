    rationale: ἐπέταξεν ἀνδράσιν πολεμεῖν은 ‘사람들에게 … 싸우라고 명령했다’라는 구조입니다. ‘사람들을 명령했다’는 사람을 명령의 대상으로 처리하여 뜻과 문법을 모두 훼손합니다.
