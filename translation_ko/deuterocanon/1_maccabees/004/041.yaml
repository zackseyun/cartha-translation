    rationale: 그리스어 동사는 단수이며, 문맥상 유다가 성소를 정결하게 하는 것으로 이해됩니다. ‘유다가 성소를 정결하게 할 때까지’라고 하면 원문의 주체를 보존하면서 한국어 문장도 명료해집니다.
