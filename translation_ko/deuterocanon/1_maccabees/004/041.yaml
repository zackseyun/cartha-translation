  source_fidelity: 핵심 어휘인 ‘명령하다’, ‘사람들’, ‘성채 안에 있는 자들’, ‘성소’는 대체로 원문에 충실합니다. 그러나 현 문장의 ‘사람들을 명령했으니’는 원문의 여격 ἀνδράσιν과 부정사 πολεμεῖν의 관계를 한국어로 잘못 구현합니다. 또한 καθαρίσῃ의 단수 주어는 문맥상 유다이므로 이를 보존하는 것이 안전합니다.
  naturalness: 현 본문은 ‘사람들을 명령했으니’와 문말의 ‘때까지였습니다’가 현대 한국어 합쇼체 문장으로 부자연스럽고 문법적으로도 부정확합니다. ‘사람들에게 … 싸우라고 명령했습니다’가 자연스럽습니다.
  terminology: ‘성채’, ‘성소’는 적절합니다. 아크라를 본문에서는 기술적으로 ‘성채’로 옮기고 각주에서 지명형 대안을 제시한 방식도 적절합니다.
