translation:
  language: ko
  text: 그리고 고르기아스와 군대는 우리 가까운 산지에 있습니다[a]. 그러니 이제 적들 앞에 맞서 서서 그들과 싸우십시오[b]. 그런 다음에는 담대하게 전리품을 취하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리 가까운 산에’. 그리스어 표현은 특정한 산일 수도 있고, 더 넓게는 산악 지대를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들과 대담하게 싸우십시오’ 혹은 ‘그들과 담대히 싸우십시오’.
