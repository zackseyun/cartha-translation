translation:
  language: ko
  text: 그리고 고르기아스는 오천 명의 사람들과 천 명의 선발 기병을 거느렸고, 진영은 밤에 떠났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘진영이 밤에 떠났다’로도 옮길 수 있습니다. 그리스어 ‘진영’은 함께 진을 친 병력 전체를 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: παρέλαβεν
  english_pob_choice: took
  chosen_korean: 거느렸고
  alternatives_korean:
  - 데리고 갔고
  - 취했고
  - 인솔했고
  lexicon: BDAG
  rationale: 군사 문맥에서 단순히 ‘받다’가 아니라 사람들을 함께 데리고 이동시키거나 지휘하에 두는 뉘앙스를 살리기 위해 ‘거느리다’를 택했습니다.
- source_word: πεντακισχιλίους ἄνδρας
  english_pob_choice: five thousand men
  chosen_korean: 오천 명의 사람들
  alternatives_korean:
  - 오천 명의 남자들
  - 오천 명의 군사들
  lexicon: LSJ
  rationale: ἄνδρας는 문자적으로 ‘남자들’이지만, 한국어에서는 군사 문맥에서도 ‘남자들’이 다소 어색할 수 있어, 원문의 일반적 집합성을 살리면서 과도한 군사화도 피하는 ‘사람들’로 옮겼습니다.
- source_word: χιλίαν ἵππον ἐκλεκτήν
  english_pob_choice: one thousand chosen horsemen
  chosen_korean: 천 명의 선발 기병
  alternatives_korean:
  - 천 명의 선택된 기병
  - 천 명의 정예 기병
  - 천 마리의 선발된 말
  lexicon: LSJ
  rationale: ἵππον은 집합적으로 기병대를 가리키므로 ‘기병’이 자연스럽고, ἐκλεκτήν은 선발된 정예성을 드러내는 ‘선발’이 원문에 충실합니다.
- source_word: ἡ παρεμβολή
  english_pob_choice: the camp
  chosen_korean: 진영
  alternatives_korean:
  - 캠프
  - 야영지
  - 군대
  lexicon: LSJ
  rationale: 문맥상 정지된 장소보다 집결한 군사 집단을 가리키는 집합적 용례이므로, 장소성과 부대성을 함께 담는 ‘진영’을 선택했습니다.
- source_word: νυκτός
  english_pob_choice: by night
  chosen_korean: 밤에
  alternatives_korean:
  - 밤중에
  - 야간에
  lexicon: BDAG
  rationale: 시간 부사를 한국어로 가장 자연스럽게 표현하되, 원문의 은밀한 야간 이동 뉘앙스를 해치지 않도록 ‘밤에’로 옮겼습니다.
theological_decisions:
- issue: 군사 집합 명사 ἡ παρεμβολή의 의미 범위
  chosen_reading: ‘진영’은 장소가 아니라 진영에 있는 병력 전체를 포괄하는 집합적 표현으로 이해했습니다.
  alternative_readings:
  - ‘군대’로 본다
  - ‘진영’의 장소적 의미만 본다
  rationale: 영어 POB도 각주에서 ‘camp’가 집합적으로 병력을 가리킬 수 있음을 밝혔습니다. 한국어 본문은 그 집합성을 살리되, 필요 시 독자가 병력 전체를 이해하도록 여지를 남겼습니다.
