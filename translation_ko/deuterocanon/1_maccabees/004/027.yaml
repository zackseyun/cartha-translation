  text: But when he heard all this[a], he was confounded and lost heart, because what had happened to Israel was not what he wanted, and what the king had commanded him had not come about.
  footnotes:
  - marker: a
    text: Or 'was thrown into confusion and became discouraged.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 그가 이 모든 말을 듣고 혼란에 빠지고 낙심하였으니, 이스라엘에게 일어난 일이 그가 바라던 바가 아니었고, 왕이 그에게 명한 것이 이루어지지 않았기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘혼란에 빠지고 낙심하였다’
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεχύθη
  english_pob_choice: was confounded
  chosen_korean: 혼란에 빠지고
  alternatives_korean:
  - 혼란스러워지고
  - 당황하고
  - 동요하고
  lexicon: LSJ
  rationale: συγχέω의 수동형은 강한 내적 혼란과 동요를 뜻하므로, 한국어에서는 상태 변화를 드러내는 ‘혼란에 빠지고’로 옮겨 감정적 충격을 살렸습니다.
- source_word: ἤθυμει
  english_pob_choice: lost heart
  chosen_korean: 낙심하였으니
  alternatives_korean:
  - 마음이 꺾였으니
  - 의기소침하였으니
  - 낙담하였으니
  lexicon: LSJ
  rationale: 미완료 시상은 지속되는 낙심 상태를 나타내므로, 결과 상태를 자연스럽게 드러내는 ‘낙심하였으니’로 옮겼습니다.
- source_word: οὐχ οἷα ἤθελεν
  english_pob_choice: not what he wanted
  chosen_korean: 그가 바라던 바가 아니었고
  alternatives_korean:
  - 그가 원하던 것이 아니었고
  - 그가 뜻하던 바가 아니었고
  - 그가 기대하던 일이 아니었고
  lexicon: LSJ
  rationale: 원문은 기대나 의도와 실제 결과의 대비를 말하므로, 보다 문어적인 ‘바가 아니었고’로 긴장을 유지했습니다.
- source_word: οὐχ οἷα ἐνετείλατο αὐτῷ ὁ βασιλεὺς
  english_pob_choice: what the king had commanded him
  chosen_korean: 왕이 그에게 명한 것
  alternatives_korean:
  - 왕이 그에게 명령한 것
  - 왕이 그에게 지시한 것
  - 왕이 그에게 내린 명령
  lexicon: LSJ
  rationale: ἐντέλλομαι는 권위 있는 명령을 뜻하므로, 왕권의 뉘앙스를 살려 ‘명한 것’으로 옮겼습니다.
- source_word: ἐξέβη
  english_pob_choice: had not come about
  chosen_korean: 이루어지지 않았기 때문입니다
  alternatives_korean:
  - 일어나지 않았기 때문입니다
  - 성사되지 않았기 때문입니다
  - 그렇게 되지 않았기 때문입니다
  lexicon: LSJ
  rationale: 결과가 기대대로 성립되지 않았다는 뜻을 자연스럽게 드러내기 위해, 종결은 ‘이루어지지 않았기 때문입니다’로 처리했습니다.
theological_decisions:
- issue: 왕의 명령과 현실의 불일치
  chosen_reading: 본문은 왕의 명령이 실제 사건을 통제하지 못한 좌절을 강조합니다.
  alternative_readings:
  - 단순한 심리 묘사로만 읽는 해석
  - 정치적 실패의 완곡한 표현으로만 읽는 해석
  rationale: 원문은 감정 변화의 원인을 명확히 제시하며, 명령-결과의 불일치가 핵심이므로 이를 약화하지 않았습니다.
  doctrine_reference: 섭리와 인간 권위의 한계
