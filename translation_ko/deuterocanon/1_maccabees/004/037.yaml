lexical_decisions:
- source_word: συνήχθη
  english_pob_choice: assembled
  chosen_korean: 모였고
  alternatives_korean:
  - 집결했고
  - 함께 모였고
  - 소집되었고
  lexicon: BDAG
  rationale: 수동형 aorist지만 여기서는 집단이 한곳에 모여드는 자연스러운 서술이므로, 한국어에서는 간결한 서술형 ‘모였고’로 옮겨 집합의 완료를 살렸습니다.
- source_word: ἡ παρεμβολὴ πᾶσα
  english_pob_choice: the whole camp
  chosen_korean: 진영 전체
  alternatives_korean:
  - 온 진영
  - 전체 진영
  - 모든 진영
  lexicon: LSJ
  rationale: παρεμβολή는 군사적 ‘진영/캠프’를 뜻하므로, ‘진영’으로 두고 πᾶσα의 총체성을 ‘전체’로 반영했습니다.
- source_word: ἀνέβησαν
  english_pob_choice: they went up
  chosen_korean: 올라갔습니다
  alternatives_korean:
  - 올라갔습니다
  - 올라섰습니다
  - 상경했습니다
  lexicon: BDAG
  rationale: 지형적 상승과 성소를 향한 이동을 함께 담는 기본적 관용 표현이므로 ‘올라갔습니다’가 가장 مستقیم하고 자연스럽습니다.
- source_word: ὄρος Σιών
  english_pob_choice: Mount Zion
  chosen_korean: 시온 산
  alternatives_korean:
  - 시온산
  - 시온의 산
  - 시온산으로
  lexicon: LSJ
  rationale: ὄρος는 ‘산’으로 직역하고 고유명 Σιών은 ‘시온’으로 음역해, 한국어 성경에서 통용되는 ‘시온 산’ 구조를 살렸습니다.
