    issue: ‘이는 백사십팔 년이었습니다’라는 연대 표현
    rationale: τοῦ ... ἔτους는 사건의 연도를 나타내는 속격 날짜 표현입니다. 한국어에서 ‘이는 … 년이었습니다’는 문법적으로 어색하고, ‘년’이 기간인지 연도인지도 불분명합니다. ‘백사십팔 년에’로 처리해야 합니다.
  - severity: medium
