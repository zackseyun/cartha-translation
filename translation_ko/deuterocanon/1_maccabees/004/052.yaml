  alternative_readings:
  - 셀레우코스 시대 백사십팔 년
  - 셀레우코스 왕조의 백사십팔 년
  rationale: 그리스어 본문 자체는 단지 연도 수만 말하므로, 본문에 시대를 덧붙이면 번역을 넘어서는 해석이 됩니다. 시대 식별은 역사적 주석으로 처리하는 것이 원문 우선 원칙에 맞습니다.
  doctrine_reference: 원문 우선 번역 원칙; 본문이 직접 말하지 않는 정보를 본문에 삽입하지 않음
