  text: And they rose early in the morning on the twenty-fifth day of the ninth month—that is[b][a], the month Chislev—in the one hundred and forty-eighth year.
  footnotes:
  - marker: a
    text: 'Greek: ''the month Chaseleu''; the Jewish month name is commonly known in English as Kislev or Chislev.'
    reason: lexical_alternative
  - marker: b
    text: The year is given simply as 'the one hundred and forty-eighth year' in Greek; historically this refers to the Seleucid era.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그들은 아침 일찍, 아홉째 달 스물다섯째 날에 일어났습니다—곧, 키슬레우 월이었습니다—; 이는 백사십팔 년이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 Χασελεὺ는 유대 달 이름의 그리스어 표기입니다. 영어 전통 표기에서는 Kislev/Chislev로 널리 알려져 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 단지 ‘백사십팔 년’이라고만 말하며, 역사적으로는 셀레우코스 시대를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: ὤρθρισαν τὸ πρωὶ
