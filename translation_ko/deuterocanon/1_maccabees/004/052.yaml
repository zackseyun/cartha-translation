  rationale: 연대·월·일·시간을 하나의 자연스러운 한국어 날짜 표현으로 재구성했습니다. ‘백사십팔 년에’는 그리스어가 명시한 연대만 전달하며 시대 명칭을 본문에 보태지 않습니다. Χασελεὺ는 통용되는 한국어 달 이름 ‘기슬레브월’로 옮기고, 원어 표기 및 음역상의 차이는 각주에서 밝혔습니다. 각주 표지도 각각 달 이름과 연대에 직접 붙여 참조 대상을 분명히 했습니다.
