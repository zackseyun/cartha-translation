  rationale: ὤρθρισαν과 τὸ πρωὶ가 함께 이른 시각의 발생을 강조하므로, 한국어에서는 중복을 과하게 살리지 않으면서도 자연스럽게 ‘아침 일찍’으로 옮겼습니다.
