lexical_decisions:
- source_word: καὶ ἐπέστρεψεν
  english_pob_choice: turned back
  chosen_korean: 되돌아왔습니다
  alternatives_korean:
  - 돌아갔습니다
  - 되돌아섰습니다
  lexicon: BDAG
  rationale: ἐπιστρέφω의 군사적 맥락에서 방향 전환을 나타내므로, 단순한 귀환보다 ‘되돌아오다’가 움직임의 전환을 더 자연스럽게 드러냅니다.
- source_word: Ἰούδας καὶ ἡ δύναμις
  english_pob_choice: Judas and the force
  chosen_korean: 유다와 군대
  alternatives_korean:
  - 유다와 병력
  - 유다와 전투부대
  lexicon: LSJ
  rationale: δύναμις는 여기서 단순한 추상적 ‘힘’이 아니라 추격 중인 무장 집단을 가리키므로, 문맥상 ‘군대’가 가장 자연스럽습니다.
- source_word: ἀπὸ τοῦ διώκειν
  english_pob_choice: from pursuing after them
  chosen_korean: 그들을 뒤쫓다가
  alternatives_korean:
  - 그들을 추격하다가
  - 그들을 추적하다가
  lexicon: BDAG
  rationale: ἀπό + 정관사 부정사 구조는 어떤 행동을 그만두는 뜻이므로, ‘-다가’로 끝난 동작과 이탈을 함께 살려 ‘뒤쫓다가’로 옮겼습니다.
- source_word: ὀπίσθεν αὐτῶν
  english_pob_choice: after them
  chosen_korean: 그들을
  alternatives_korean:
  - 그들 뒤를
  - 그들 뒤에
  lexicon: LSJ
  rationale: 한국어에서는 ‘뒤쫓다’ 자체가 ὀπίσθεν의 방향성을 이미 포함하므로, 중복을 피하고 문장을 간결하게 유지했습니다.
