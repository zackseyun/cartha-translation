    issue: ‘되돌아왔습니다’ adds a possible arrival/return implication.
    rationale: The Greek states that Judas and the force turned back from pursuing them, not that they arrived back at a specified prior location. ‘돌아서다’ retains the directional reversal without that added implication.
  revised_text: 그리고 유다와 군대는 그들을 추격하는 일을 그만두고 돌아섰습니다.
