  verdict: revise
  source_fidelity: ‘되돌아왔습니다’ can imply arriving back at a prior location, whereas ἐπέστρεψεν here specifically depicts turning away from the pursuit. The cessation expressed by ἀπὸ τοῦ διώκειν should be explicit.
  naturalness: The draft is fluent modern formal-polite Korean, but ‘뒤쫓다가 되돌아왔습니다’ slightly blurs whether they merely changed direction or actually returned to a place. ‘추격을 그만두고 돌아섰습니다’ is clear and natural.
  terminology: ‘유다’ and ‘군대’ are appropriate for Ἰούδας and ἡ δύναμις in this military context. ‘추격’ suitably renders the pursuit construction without redundantly reproducing the directional sense already inherent in the Korean verb.
  issues:
