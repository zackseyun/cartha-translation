base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/038.yaml
  text: And they saw our sanctuary laid waste[a], and the altar defiled, and the gates burned down, and in the courts plants growing as in a thicket or as on one of the mountains[b], and the chambers torn down.
  footnotes:
  - marker: a
    text: Or 'profaned' for 'defiled.' The Greek emphasizes desecration of what is sacred.
    reason: lexical_alternative
  - marker: b
    text: The Greek term rendered 'side chambers' refers to rooms attached to or associated with the temple complex; the exact architectural nuance is uncertain.
    reason: cultural_note
translation:
  language: ko
  text: 그들은 우리 성소가 황폐해진 것[a]과 제단이 모독된 것과 문들이 불타 버린 것과, 뜰 안에 덤불에서처럼 또는 산들 가운데 어느 한 산에서처럼 식물들이 자라난 것과, 방들이 허물어진 것[b]을 보았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘황폐해진’은 헬라어 ἠρημωμένον의 결과 상태를 살린 번역이며, ‘버려진’보다 파괴의 뉘앙스가 강합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘방들’은 παστοφόρια의 정확한 건축 기능이 불확실하다는 점을 반영한 보수적 번역입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἁγίασμα
  english_pob_choice: sanctuary
  chosen_korean: 성소
  alternatives_korean:
  - 성역
  - 성전
  lexicon: LSJ
  rationale: 이 문맥의 ἁγίασμα는 추상적 거룩함이 아니라 성전의 거룩한 공간을 가리키므로, 한국어로는 가장 직접적인 ‘성소’가 적합합니다.
- source_word: ἠρημωμένον
  english_pob_choice: laid waste
  chosen_korean: 황폐해진
  alternatives_korean:
  - 황량해진
  - 폐허가 된
  lexicon: LSJ
  rationale: 파괴와 버려짐의 상태를 함께 드러내는 말로 ‘황폐해진’이 자연스럽고, 영어의 ‘laid waste’가 가진 devastation의 힘을 잘 반영합니다.
- source_word: βεβηλωμένον
  english_pob_choice: defiled
  chosen_korean: 더럽혀진
  alternatives_korean:
  - 모독된
  - 속된
  lexicon: LSJ
  rationale: 여기서는 물리적 오염보다 성물에 대한 의례적 훼손이 핵심이므로, 일상적이면서도 부정적 의미를 유지하는 ‘더럽혀진’이 적절합니다.
- source_word: παστοφόρια
  english_pob_choice: chambers
  chosen_korean: 방들
  alternatives_korean:
  - 곁방들
  - 부속실들
  - 옆방들
  lexicon: LSJ
  rationale: 이 용어는 성전 복합체와 연결된 방들을 가리키지만 정확한 건축 기능은 분명하지 않으므로, 해석을 좁히지 않는 ‘방들’로 옮겼습니다.
theological_decisions:
- issue: 성전 훼손의 묘사 강도
  chosen_reading: ‘성소가 황폐해진 것’, ‘제단이 더럽혀진 것’, ‘문들이 불타 버린 것’으로 연속된 훼손 상태를 살려, 단순한 파손이 아니라 성스러운 질서의 붕괴를 드러냈습니다.
  alternative_readings:
  - 성소가 무너진 것
  - 제단이 모독된 것
  - 문들이 불탔다
  rationale: 본문은 누적된 훼손을 병렬로 제시하므로, 각 요소의 의례적·물리적 손상을 분리해 표현하는 것이 원문의 긴박함을 더 정확히 전달합니다.
  doctrine_reference: 성전 정결과 모독에 관한 제2성전기 맥락
- issue: ‘뜰 안에… 자라난’의 비교 표현
  chosen_reading: ‘덤불이나 산 중의 어느 한 곳에 있는 것처럼’으로 비교 구조를 보존했습니다.
  alternative_readings:
  - 숲속처럼
  - 수풀처럼
  - 산야처럼
  rationale: 비교어 ὡς/ἢ ὡς의 이중 비교를 유지해, 통제되지 않은 야생화의 이미지를 약화시키지 않도록 했습니다.
  doctrine_reference: 성전 폐허의 묘사 방식
