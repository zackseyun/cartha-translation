  naturalness: 초안의 ‘산 중의 어느 한 곳에 있는 것처럼’은 무엇이 ‘있는’ 것인지 불분명하고 비교 대상도 흐립니다. 병렬 항목을 유지하면서 ‘산들 가운데 어느 한 산에서처럼’이라고 하면 현대 표준 한국어로 자연스럽습니다.
  terminology: ἁγίασμα의 ‘성소’와 παστοφόρια의 ‘방들’은 적절합니다. βεβηλωμένον에는 제의적 훼손을 나타내는 ‘모독된’이 ‘더럽혀진’보다 알맞습니다. 각주 b는 방들을 설명하므로 해당 단어 바로 뒤에 붙여야 합니다.
