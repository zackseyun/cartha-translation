  yaml_path: translation/deuterocanon/1_maccabees/004/054.yaml
  text: At the time[a], on the very day when the nations had defiled it[b], on that very day it was rededicated with songs and lyres and harps and cymbals.
  footnotes:
  - marker: a
    text: Or 'had profaned it.' The Greek verb can denote making something profane or defiled in a sacred context.
    reason: lexical_alternative
  - marker: b
    text: The instrument rendered 'harps' (κινύραις) may refer more broadly to a type of stringed instrument; exact identification is uncertain.
    reason: cultural_note
translation:
  language: ko
  text: 그 민족들이 그것을 더럽혔던[a] 바로 그 날, 바로 그 때에 그것은 노래와 수금과 비파[b]와 제금으로 다시 봉헌되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘더럽혔던’은 문맥상 성소를 속되게 하거나 부정하게 만들었다는 뜻도 지닐 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘비파’로 옮긴 κινύραις는 정확한 고대 악기의 종류가 확실하지 않으며, 더 넓게는 현악기를 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: κατὰ τὸν καιρὸν
  english_pob_choice: At the time
  chosen_korean: 때가 차서
  alternatives_korean:
  - 그때에
  - 그 시기에
  lexicon: LSJ
  rationale: 단순한 시점 표지이면서 문맥상 절기의 완성을 암시하므로, 자연스러운 현대 한국어로 ‘때가 차서’라고 옮겨 시간의 성숙한 도래를 살렸습니다.
- source_word: κατὰ τὴν ἡμέραν / ἐν ἐκείνῃ
  english_pob_choice: on the very day / on that very day
  chosen_korean: 곧 그 날, 곧 ... 바로 그 날
  alternatives_korean:
  - 그 날에
  - 그 바로 날에
  lexicon: LSJ
  rationale: 원문은 같은 날에 정확히 대응됨을 중첩해 강조하므로, 한국어에서도 ‘곧’과 ‘바로 그 날’로 대응의 긴밀함을 살렸습니다.
- source_word: ἐβεβήλωσαν αὐτὸ
  english_pob_choice: had defiled it
  chosen_korean: 그것을 더럽힌
  alternatives_korean:
  - 그것을 profane한
  - 그것을 모독한
  lexicon: LSJ
  rationale: 성소/성물 문맥에서 ‘더럽히다’가 가장 직접적으로 부정한 성화 상태의 훼손을 드러내며, 원문의 cultic 의미를 과하게 추상화하지 않습니다.
- source_word: ἐνεκαινίσθη
  english_pob_choice: it was rededicated
  chosen_korean: 다시 봉헌되었습니다
  alternatives_korean:
  - 재봉헌되었습니다
  - 새로 봉헌되었습니다
  lexicon: LSJ
  rationale: 예루살렘 성전의 정화와 복원 문맥에서 ‘rededicated’에 해당하는 한국어로 ‘다시 봉헌하다’가 가장 투명하며, 단순한 ‘갱신’보다 예배적 헌납의 성격을 분명히 합니다.
- source_word: ᾠδαῖς καὶ κιθάραις καὶ κινύραις καὶ κυμβάλοις
  english_pob_choice: with songs and lyres and harps and cymbals
  chosen_korean: 노래와 수금과 비파와 제금으로
  alternatives_korean:
  - 노래와 리라와 하프와 심벌즈로
  - 찬송과 수금과 비파와 제금으로
  lexicon: LSJ
  rationale: 악기 목록을 한국 교회어로 완전히 바꾸지 않고, 비교적 널리 통용되는 음역/번역을 섞어 원문의 나열감을 유지했습니다. κινύραις는 정확한 악기 식별이 다소 불확실하므로 관용적으로 ‘비파’로 옮겼습니다.
theological_decisions:
- issue: 성전 더럽힘과 재봉헌의 예배적 의미
  chosen_reading: ‘다시 봉헌되었습니다’로 성전의 예배적 회복을 분명히 했습니다.
  alternative_readings:
  - ‘다시 헌납되었습니다’
  - ‘새로 봉헌되었습니다’
  rationale: 이 절은 단순한 건물 수리보다, 더럽혀진 성소가 예배를 위해 다시 구별되는 사건을 말합니다. ‘다시 봉헌’은 그 cultic 의미를 가장 직접적으로 전달합니다.
  doctrine_reference: Translation philosophy §1, §6
