  text: And it seemed to them a good plan to tear it down[a], lest it become a reproach to them because the nations had defiled it; so they tore down the altar.
  footnotes:
  - marker: a
    text: Or 'the Gentiles had defiled it.' The Greek τὰ ἔθνη can be rendered 'the nations' or, in this Jewish context, 'the Gentiles.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그것을 헐어 버리는 것이 좋겠다고 여겼습니다. 이방 민족들[a]이 그것을 더럽혔으므로 그것이 그들에게 수치가 될까 염려했기 때문입니다. 그래서 그들은 제단을 헐어 버렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이방인들이’. 그리스어 τὰ ἔθνη는 ‘민족들’로도, 이 유대적 문맥에서는 ‘이방인들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσεν αὐτοῖς βουλὴ ἀγαθή
  english_pob_choice: it seemed to them a good plan
  chosen_korean: 그들에게 좋은 계책이 떠올라
  alternatives_korean:
  - 그들에게 좋은 계획이 생겨
  - 그들에게 좋은 결심이 떠올라
  lexicon: LSJ
  rationale: 직역하면 ‘좋은 계책이 그들에게 떨어졌다’이지만, 한국어에서는 자연스럽게 ‘떠올라’로 옮겨 사유가 생겨난 느낌을 살렸습니다. ‘계책’은 공동체가 실행할 구체적 판단을 잘 드러냅니다.
- source_word: καθελεῖν / καθεῖλον
  english_pob_choice: to tear down / they tore down
  chosen_korean: 헐어 버리기로 하였으니 / 헐어 버렸습니다
  alternatives_korean:
  - 무너뜨리기로 하였으니 / 무너뜨렸습니다
  - 철거하기로 하였으니 / 철거했습니다
  lexicon: LSJ
  rationale: 제단을 물리적으로 해체하는 동작을 나타내므로, 현대 한국어에서 자연스럽고 힘이 있는 ‘헐다/헐어 버리다’를 사용했습니다. 앞뒤 동사를 맞춰 반복성을 살렸습니다.
- source_word: τὰ ἔθνη
  english_pob_choice: the nations
  chosen_korean: 이방 민족들
  alternatives_korean:
  - 열방이
  - 민족들이
  lexicon: LSJ
  rationale: 이 문맥은 유대 공동체 안에서의 대조를 이루므로, 단순한 ‘민족들’보다 ‘이방 민족들’이 의미를 더 분명히 드러냅니다. 다만 본문 의미를 좁히되 과도한 신학적 해석은 피했습니다.
- source_word: ἐμίαναν
  english_pob_choice: had defiled
  chosen_korean: 더럽혔기 때문에
  alternatives_korean:
  - 더럽혔기 때문에
  - 부정하게 했기 때문에
  - 더럽혀 놓았기 때문에
  lexicon: LSJ
  rationale: 이 동사는 제의적 오염을 뜻하므로 ‘더럽히다’가 가장 직접적입니다. 여기서는 ‘부정하게 하다’보다 한국어 독자에게 즉각적인 오염 감각을 주는 표현을 택했습니다.
- source_word: εἰς ὄνειδος
  english_pob_choice: to them a reproach
  chosen_korean: 그들에게 수치가 될까 하여서
  alternatives_korean:
  - 그들에게 치욕이 될까 하여서
  - 그들에게 수치가 되지 않도록
  lexicon: LSJ
  rationale: ὄνειδος는 공개적 수치·비난의 뉘앙스를 가지므로, ‘수치’로 옮기되 결과절의 우려를 드러내는 구조로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 제의적 오염의 표현
  chosen_reading: ‘더럽혔기 때문에’로 번역해 제단의 제의적 오염을 분명히 드러냈습니다.
  alternative_readings:
  - ‘모독했기 때문에’
  - ‘부정하게 했기 때문에’
  rationale: 본문은 단순한 감정적 모욕이 아니라 이방 민족의 사용으로 인한 성소 대상의 오염을 말하므로, 제의적 불결성의 색채를 유지하는 것이 원문에 더 충실합니다.
  doctrine_reference: Translation philosophy §§1, 5
