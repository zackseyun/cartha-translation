  to: 그들은 그것을 헐어 버리는 것이 좋겠다고 여겼습니다. 이방 민족들[a]이 그것을 더럽혔으므로 그것이 그들에게 수치가 될까 염려했기 때문입니다. 그래서 그들은 제단을 헐어 버렸습니다.
