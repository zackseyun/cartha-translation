base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/015.yaml
  text: But all the rear guard fell by the sword[a], and they pursued them as far as Gazara and as far as the plains of Judea and Azotus and Jamnia[c][b], and about three thousand of them fell.
  footnotes:
  - marker: a
    text: Gazara is the Greek place-name, commonly identified with Gezer.
    reason: cross_reference
  - marker: b
    text: Azotus is the Greek form of Ashdod; Jamnia is commonly identified with Jabneh/Yavneh.
    reason: cross_reference
  - marker: c
    text: Or 'three thousand men of them fell'; the Greek idiom expresses the number of the slain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 후위에 있던 자들은 모두 칼에 쓰러졌고, 그들은 그들을 추격하여 가자라까지[a], 또 유대의 평원과 아조토와 얌니아까지[b] 이르렀으며, 그들 가운데 약 삼천 명이 쓰러졌습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 가자라는 그리스어 지명으로, 흔히 게셀과 동일시됩니다.
    reason: cross_reference
  - marker: b
    text: 아조토는 아스돗의 그리스어 형태이며, 얌니아는 흔히 얍네/야브네와 동일시됩니다.
    reason: cross_reference
  - marker: c
    text: 그리스어 표현은 그들 가운데 쓰러진 이들이 삼천 명에 이르렀음을 가리킵니다.
    reason: lexical_alternative
