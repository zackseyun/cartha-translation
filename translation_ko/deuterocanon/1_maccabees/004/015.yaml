  rationale: 지명은 그리스어 형태를 따라 음역하되, ‘유대의 평원’은 πεδίων의 지리적 의미를 살려 옮겼습니다.
- source_word: ἔπεσαν ἐξ αὐτῶν εἰς ἄνδρας τρισχιλίους
  english_pob_choice: about three thousand of them fell
  chosen_korean: 그들 가운데 약 삼천 명이 쓰러졌습니다
  alternatives_korean:
  - 그들 가운데 삼천 명가량이 쓰러졌습니다
