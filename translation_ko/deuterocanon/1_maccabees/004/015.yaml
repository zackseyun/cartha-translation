  lexicon: LSJ
  rationale: 전투에서 죽임을 당했다는 관용을 살리되, 한국어에서는 ‘칼에 쓰러지다’가 더 직접적이고 문맥에 맞습니다.
- source_word: ἕως Γαζήρων ... καὶ Ἀζώτου καὶ Ἰαννείας
  english_pob_choice: as far as Gazara ... Azotus and Jamnia
  chosen_korean: 가자라까지, 유대의 평원과 아조도와 얌니아까지
  alternatives_korean:
  - 게셀까지, 유대의 평원과 아스돗과 얍네까지
  - 가자르까지, 유대의 들판과 아스돗과 야브네까지
  lexicon: LSJ
  rationale: 지명은 그리스어 형태를 따라 음역하되, ‘유대의 평원’은 πεδίων의 지리적 의미를 살려 옮겼습니다.
- source_word: ἔπεσαν ἐξ αὐτῶν εἰς ἄνδρας τρισχιλίους
  english_pob_choice: about three thousand of them fell
  chosen_korean: 그들 가운데 약 삼천 명이 쓰러졌습니다
  alternatives_korean:
  - 그들 가운데 삼천 명가량이 쓰러졌습니다
  - 그들 가운데 약 삼천 명이 죽었습니다
  lexicon: LSJ
  rationale: εἰς ἄνδρας τρισχιλίους는 죽은 자의 수를 셈하는 관용으로 보아 ‘약 삼천 명’이라는 수량과 ‘쓰러졌습니다’를 함께 살렸습니다.
