  text: And they took whole stones according to the law[b][a], and built a new altar as before.
  footnotes:
  - marker: a
    text: Or 'unhewn stones'; the Greek says 'whole/complete stones,' while the following phrase 'according to the law' likely alludes to Torah requirements for altar stones.
    reason: lexical_alternative
  - marker: b
    text: Or 'as before' or 'according to the former pattern.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그들은 율법에 따라 온전한 돌들을 가져다가, 그 이전 것과 같이 새로운 제단을 쌓았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다듬지 않은 돌들’입니다. 그러나 그리스어는 먼저 ‘온전한/완전한 돌들’이라고 말하고, 이어서 ‘율법에 따라’라고 덧붙여 율법적 요구를 암시합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘전처럼’, ‘이전의 모양대로’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: λίθους ὁλοκλήρους
  english_pob_choice: whole stones
  chosen_korean: 온전한 돌들
  alternatives_korean:
  - 완전한 돌들
  - 다듬지 않은 돌들
  lexicon: LSJ
  rationale: ὁλόκληρος는 ‘온전한, 완전한, 흠 없는’의 뜻이므로, 원문의 형용사를 그대로 살려 ‘온전한 돌들’로 옮겼습니다. ‘다듬지 않은 돌들’은 율법적 함의를 잘 드러내지만, 본문 자체의 표현보다 한 걸음 더 나아갑니다.
- source_word: κατὰ τὸν νόμον
  english_pob_choice: according to the law
  chosen_korean: 율법에 따라
  alternatives_korean:
  - 법에 따라
  - 율법대로
  lexicon: LSJ
  rationale: νόμος는 이 문맥에서 토라/율법을 가리키므로, 프로젝트 기본어인 ‘율법’을 유지했습니다. 전치사 κατά는 준거·부합의 의미로 자연스럽게 ‘-에 따라’로 옮겼습니다.
- source_word: θυσιαστήριον καινὸν
  english_pob_choice: a new altar
  chosen_korean: 새로운 제단
  alternatives_korean:
  - 새 제단
  - 새로 만든 제단
  lexicon: LSJ
  rationale: θυσιαστήριον은 ‘제단’이며, καινός는 단순한 시간적 새로움보다 새로 지어진 상태를 강조합니다. 합쇼체 문맥에서 자연스럽게 ‘새로운 제단’으로 옮겼습니다.
- source_word: κατὰ τὸ πρότερον
  english_pob_choice: as before / like the former one
  chosen_korean: 그 이전 것과 같이
  alternatives_korean:
  - 전과 같이
  - 옛것과 같이
  - 이전의 모양대로
  lexicon: LSJ
  rationale: 이 표현은 단순히 ‘이전처럼’이 아니라, 앞서 있던 것과의 대응을 나타냅니다. 그래서 ‘그 이전 것과 같이’로 옮겨, 이전 제단과의 연속성을 드러냈습니다.
theological_decisions:
- issue: 돌의 성격을 ‘다듬지 않은 돌들’로 명시할지 여부
  chosen_reading: 본문은 ‘온전한 돌들’을 유지하고, 율법 준수는 뒤의 ‘율법에 따라’가 드러내도록 했습니다.
  alternative_readings:
  - 다듬지 않은 돌들
  - 손대지 않은 돌들
  rationale: 그리스어는 형용사 ὁλοκλήρους를 직접 말하고, 별도로 ‘율법에 따라’를 덧붙입니다. 따라서 율법 요구를 돌의 형용사에 흡수하지 않고, 본문이 말하는 두 층위를 분리해 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: κατὰ τὸ πρότερον의 관계를 어떻게 드러낼지
  chosen_reading: ‘그 이전 것과 같이’로 옮겨, 이전 제단과의 비교·연속성을 분명히 했습니다.
  alternative_readings:
  - 전처럼
  - 이전의 방식대로
  rationale: 문맥상 새 제단은 이전 제단을 본떠 세워진 것입니다. ‘그 이전 것과 같이’는 단순한 시간적 ‘전처럼’보다 비교 대상이 더 분명해, 원문의 관계를 잘 드러냅니다.
  doctrine_reference: Translation philosophy §§1, 6
