  text: And Gorgias came to the camp of Judas by night, and found no one; and he was looking for them in the mountains, because he said, “These men are fleeing from us.”
translation:
  language: ko
  text: 그리고 고르기아스가 밤에 유다의 진영에 왔으나 아무도 없었습니다. 그는 “이들이 우리에게서 달아나고 있습니다”라고 말했기 때문에 산에서 그들을 찾고 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεμβολὴν
  english_pob_choice: camp
  chosen_korean: 진영
  alternatives_korean:
  - 캠프
  - 부대
  - 야영지
  lexicon: παρεμβολή
  rationale: 군사적 집결지를 가리키므로, 현대 한국어에서 자연스럽고 문맥에 맞는 ‘진영’으로 옮겼습니다.
- source_word: νυκτός
  english_pob_choice: by night
  chosen_korean: 밤에
  alternatives_korean:
  - 야간에
  - 한밤중에
  lexicon: νύξ
  rationale: 시간 부사로서 간결하게 ‘밤에’라고 옮겨 원문의 사건 진행을 자연스럽게 살렸습니다.
- source_word: ἐζήτει
  english_pob_choice: was looking for
  chosen_korean: 찾고 있었습니다
  alternatives_korean:
  - 찾고 있었습니다
  - 찾고 있었습니다만
  - 찾으려 하고 있었습니다
  lexicon: ζητέω
  rationale: 지속적 탐색을 나타내는 미완료적 뉘앙스를 살려 ‘찾고 있었습니다’로 번역했습니다.
- source_word: Φεύγουσιν οὗτοι ἀφʼ ἡμῶν
  english_pob_choice: These men are fleeing from us
  chosen_korean: 이 사람들은 우리에게서 도망하고 있습니다
  alternatives_korean:
  - 이 사람들은 우리에게서 달아나고 있습니다
  - 이들은 우리를 피해 도망치고 있습니다
  lexicon: φεύγω
  rationale: 현재진행형의 추정 발화를 살리면서, 단순 서술보다 직접적이고 군사적 긴박감이 드러나는 ‘도망하고 있습니다’를 택했습니다.
theological_decisions:
- issue: 직접화법 안의 인물 발화 어조
  chosen_reading: 고르기아스의 추정 발화를 한국어 서술체로 옮기되, 인용문 내부는 과도한 높임 없이 보고된 말투를 유지했습니다.
  alternative_readings:
  - 인용문을 더 구어적으로 다듬는 방식
  - 서술체보다 완곡한 추정 표현을 넣는 방식
  rationale: 본문은 인물의 판단을 그대로 전하므로, 의미를 더하지 않고 발화의 긴박감만 보존하는 것이 적절합니다.
  doctrine_reference: 서사 본문의 발화 재현 원칙
