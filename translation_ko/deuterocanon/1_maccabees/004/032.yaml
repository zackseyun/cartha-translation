  lexicon: LSJ
  rationale: 직역적 이미지인 ‘녹이다’를 유지해 적의 기세가 서서히 사라지는 시각적 비유를 살렸습니다.
- source_word: θράσος ἰσχύος αὐτῶν
  english_pob_choice: the boldness of their strength
  chosen_korean: 그 힘의 대담함
  alternatives_korean:
  - 그들의 힘의 대담함
  - 그 강한 기세
  - 그들의 강한 담력
  lexicon: LSJ
  rationale: θράσος와 ἰσχύς의 결합을 자연스러운 한국어 소유 구문으로 옮기되, ‘대담함’으로 θράσος의 거친 자신감을 보존했습니다.
- source_word: σαλευθήτωσαν τῇ συντριβῇ αὐτῶν
  english_pob_choice: let them be shaken by their own crushing
  chosen_korean: 그들의 무너짐으로 인해 흔들리게 하십시오
  alternatives_korean:
  - 그들의 파괴로 인해 흔들리게 하십시오
  - 그들의 부서짐으로 인해 흔들리게 하십시오
  - 그들의 몰락으로 인해 흔들리게 하십시오
  lexicon: LSJ
  rationale: συντριβή의 구체적 ‘부서짐/무너짐’ 이미지를 살리면서, 최종적으로 그 붕괴가 그들에게 흔들림을 일으킨다는 관계를 한국어로 분명하게 표현했습니다.
theological_decisions:
- issue: 원수에 대한 간구의 직접성
  chosen_reading: 적군의 겁과 붕괴를 구하는 직접 청원을 완화하지 않고 그대로 유지했습니다.
  alternative_readings:
  - 일반적인 패배 선언으로 순화하기
  - 더 완곡한 심판 표현으로 바꾸기
  rationale: 본문은 하나님께 드리는 전투적 간구이므로, 현대 독자에게 불편할 수 있어도 청원의 급박함과 공격성을 지우지 않는 것이 원문에 더 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
