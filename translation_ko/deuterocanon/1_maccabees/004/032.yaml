  lexicon: LSJ
  rationale: δειλία는 단순한 두려움보다 비굴한 위축을 가리키므로, 짧고 강한 ‘겁’으로 옮겨 군사적·도덕적 뉘앙스를 살렸습니다.
- source_word: τῆξον
  english_pob_choice: melt
  chosen_korean: 녹이시며
