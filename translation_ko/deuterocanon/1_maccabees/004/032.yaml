  text: Give them cowardice[a], and melt the boldness of their strength, and let them be shaken by their own crushing.
  footnotes:
  - marker: a
    text: Or 'let them be shaken at their destruction.' The final phrase may be understood more generally as ruin or destruction rather than the more concrete 'crushing.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게 겁을 주십시오[a], 그리고 그 힘의 대담함을 녹이시며, 그들의 무너짐으로 인해 흔들리게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 그들의 파멸 앞에서 흔들리게 하십시오.’ 마지막 구절은 더 일반적으로 ‘부서짐’보다 ‘파멸’이나 ‘파괴’로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὸς
  english_pob_choice: Give
  chosen_korean: 주십시오
  alternatives_korean:
  - 베푸십시오
  - 허락하십시오
  lexicon: LSJ
  rationale: δίδωμι의 명령형으로서 직접적 간구의 힘을 살리기 위해 ‘주십시오’를 택했습니다.
- source_word: δειλίαν
