translation:
  language: ko
  text: 그들에게 비겁함을 주시고, 그들의 힘에서 비롯된 대담함을 녹이시며, 그들이 그들 자신의 부서짐으로 말미암아 흔들리게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 그들의 파멸 앞에서 흔들리게 하십시오.’ 마지막 구절의 ‘부서짐’은 더 일반적으로 파멸이나 파괴를 뜻할 수도 있습니다.
    reason: lexical_alternative
