  - ‘살아남은 자들’로 생존을 강조함
  rationale: 이 절은 신학적 논평보다 사건 전개를 전달하는 문장입니다. 원문의 사건 보고 기능을 넘는 해설을 넣지 않았습니다.
  doctrine_reference: 서사 본문은 저자의 사건 진술을 우선적으로 보존해야 합니다.
