  text: But as many of the foreigners as escaped, after they arrived, reported to Lysias all that had happened.
translation:
  language: ko
  text: 그런데 도망친 이방인들 가운데 얼마가 도착한 뒤, 일어난 모든 일을 리시아에게 보고했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν ἀλλοφύλων
  english_pob_choice: the foreigners
  chosen_korean: 이방인들
  alternatives_korean:
  - 외국인들
  - 타국 사람들
  lexicon: ἀλλόφυλος
  rationale: 유대인 시각의 ‘타 민족 사람들’이라는 대비를 살리기 위해 ‘이방인들’로 옮겼습니다. '외국인들'은 현대적이지만 민족·종교적 대비가 약해질 수 있습니다.
- source_word: διεσώθησαν
  english_pob_choice: escaped
  chosen_korean: 도망친
  alternatives_korean:
  - 간신히 살아남은
  - 빠져나온
  lexicon: διασῴζω
  rationale: 전투 상황에서 생존과 탈출의 뉘앙스를 함께 담되, 한국어에서는 자연스럽게 ‘도망친’이 가장 직접적입니다.
- source_word: παραγενηθέντες
  english_pob_choice: after they arrived
  chosen_korean: 도착한 뒤
  alternatives_korean:
  - 이르러서
  - 와서
  lexicon: παραγίνομαι
  rationale: 부사적 분사로서 선행 동작을 분명히 드러내기 위해 ‘도착한 뒤’로 옮겼습니다.
- source_word: πάντα τὰ συμβεβηκότα
  english_pob_choice: all that had happened
  chosen_korean: 일어난 모든 일
  alternatives_korean:
  - 벌어진 모든 일
  - 일어났던 모든 것
  lexicon: συμβαίνω
  rationale: 사건 보고의 관용적 표현으로, 원문의 포괄성을 유지하면서도 현대 한국어에서 자연스럽게 들리도록 했습니다.
theological_decisions:
- issue: 본문의 정보 중심 서술에서 해석적 확장 여부
  chosen_reading: 단순 사실 보고로 유지했습니다.
  alternative_readings:
  - 패배의 여파를 암시하는 해설적 표현을 덧붙임
  - ‘살아남은 자들’로 생존을 강조함
  rationale: 이 절은 신학적 논평보다 사건 전개를 전달하는 문장입니다. 원문의 사건 보고 기능을 넘는 해설을 넣지 않았습니다.
  doctrine_reference: 서사 본문은 저자의 사건 진술을 우선적으로 보존해야 합니다.
