  rationale: 군사·역사적 문맥에서 σωτηρία는 추상적 종교어보다 구출/구원의 실제적 의미가 강하므로, ‘구원’으로 두되 μεγάλη는 자연스럽게 ‘큰’으로 옮겼습니다.
