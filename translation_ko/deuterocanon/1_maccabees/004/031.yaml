  yaml_path: translation/deuterocanon/1_maccabees/004/031.yaml
  text: Hand over this camp into the hands of your people Israel, and let them be put to shame because of their army and their cavalry.
  footnotes:
  - marker: a
    text: Or 'Deliver this camp into the hands of your people Israel.' The Greek verb can more literally mean 'shut up' or 'confine,' but here it carries the sense of giving the enemy force over to Israel.
    reason: lexical_alternative
  - marker: b
    text: '''Because of their army and their cavalry'' may also be understood as ''in their strength and their cavalry,'' with δύναμις referring more generally to military power.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 진을 당신의 백성 이스라엘의 손에 넘겨주시고, 그들의 군사력과 기병 때문에 부끄러움을 당하게 하소서.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이 진영을… 넘겨주시고’로도 옮길 수 있습니다. Greek 동사 σύγκλεισον은 본래 ‘가두다, 봉쇄하다’의 뜻이 있으나, 여기서는 적군을 이스라엘에게 넘겨 달라는 전투적 청원의 의미가 두드러집니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들의 힘과 기병 때문에’로도 이해할 수 있습니다. δύναμις는 보다 일반적으로 군사적 힘이나 전력을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σύγκλεισον
  english_pob_choice: Hand over
  chosen_korean: 넘겨주시고
  alternatives_korean:
