  lexicon: LSJ
  rationale: 수동적·주격적 뉘앙스를 살리기 위해 단순 내면 감정이 아니라 외적 패배의 수치를 뜻하는 ‘부끄러움을 당하다’로 옮겼습니다.
- source_word: ἐπὶ τῇ δυνάμει καὶ τῇ ἵππῳ αὐτῶν
  english_pob_choice: because of their army and their cavalry
  chosen_korean: 그들의 군사력과 기병 때문에
  alternatives_korean:
  - 그들의 힘과 기병 때문에
  - 그들의 군세와 기병 때문에
  - 그들의 능력과 기병 때문에
