  lexicon: LSJ
  rationale: 전투 상황의 기도문에서 적 진영을 이스라엘의 손에 맡겨 달라는 뜻이므로, 직역적 ‘가두다/봉쇄하다’보다 결과 중심의 ‘넘겨주시고’가 원문 의도를 더 분명하게 살립니다.
- source_word: παρεμβολὴν ταύτην
