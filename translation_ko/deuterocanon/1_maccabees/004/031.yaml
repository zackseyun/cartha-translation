  lexicon: LSJ
  rationale: παρεμβολή는 진영/야영지/군대 모두 가능하지만, 여기서는 눈앞의 적 집결지를 가리키는 구체적 군사 이미지가 핵심이므로 ‘진’이 가장 자연스럽습니다.
- source_word: εἰς χεῖρας λαοῦ σου Ἰσραήλ
  english_pob_choice: into the hands of your people Israel
  chosen_korean: 당신의 백성 이스라엘의 손에
  alternatives_korean:
