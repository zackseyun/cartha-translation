  text: Hand over this camp into the hands of your people Israel, and let them be put to shame because of their army and their cavalry.
  footnotes:
  - marker: a
    text: Or 'Deliver this camp into the hands of your people Israel.' The Greek verb can more literally mean 'shut up' or 'confine,' but here it carries the sense of giving the enemy force over to Israel.
    reason: lexical_alternative
  - marker: b
    text: '''Because of their army and their cavalry'' may also be understood as ''in their strength and their cavalry,'' with δύναμις referring more generally to military power.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 진영을 주님의 백성 이스라엘의 손에 넘겨 주시고[a], 그들의 군세와 기병 때문에 수치를 당하게 하소서.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘이 진영을 주님의 백성 이스라엘의 손에 가두어 두시고’ 또는 ‘봉쇄해 주시고’입니다. 그리스어 동사 σύγκλεισον은 본래 ‘가두다, 봉쇄하다’라는 뜻이지만, 여기서는 적군을 이스라엘에게 넘겨 달라는 전투의 청원을 가리키는 것으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들의 힘과 기병 때문에’로도 옮길 수 있습니다. δύναμις는 더 일반적으로 군사적 힘이나 전력을 가리킬 수 있으며, 이 표현은 ‘그들의 군세와 기병 가운데서’라는 뜻으로 이해될 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
