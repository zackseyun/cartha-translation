  rationale: δύναμις는 여기서 일반적 ‘힘’보다 전투력/군사력을 가리키는 것이 자연스럽고, ἵππος는 단수형이지만 집합적으로 ‘기병’으로 옮기는 것이 현대 한국어에 적합합니다.
