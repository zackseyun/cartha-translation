  lexicon: LSJ
  rationale: ‘손에’는 성서적 관용구를 살리면서도, 누군가의 지배 아래 들어감을 분명히 드러내는 자연스러운 한국어 표현입니다.
- source_word: αἰσχυνθήτωσαν
  english_pob_choice: let them be put to shame
  chosen_korean: 부끄러움을 당하게 하소서
  alternatives_korean:
  - 수치를 당하게 하소서
