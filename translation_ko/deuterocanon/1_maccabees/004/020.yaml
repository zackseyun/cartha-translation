  yaml_path: translation/deuterocanon/1_maccabees/004/020.yaml
  text: And he saw that they had been routed[a], and that they were setting the camp on fire; for the smoke that was visible made what had happened clear.
  footnotes:
  - marker: a
    text: Or 'had turned back' / 'had been put to flight'; the Greek verb can denote being driven into retreat, here in a military sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그들이 패주한 것과 그들이 진영에 불을 지르고 있는 것을 보았습니다. 보이는 연기는 일어난 일을 분명히 드러냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘돌아선’ / ‘도주한’ / ‘패주한’의 뜻일 수 있습니다. 이 동사는 군사적 문맥에서 적이 물러나게 된 상태를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τετρόπωται
  english_pob_choice: had been routed
  chosen_korean: 패주한
  alternatives_korean:
  - 도망친
  - 물리친
  - 패배한
  lexicon: LSJ
  rationale: 전투 문맥의 완결된 패퇴를 한국어로 자연스럽게 드러내면서도, 단순한 ‘도망’보다 군사적 전복을 더 분명히 나타냅니다.
- source_word: ἐνπυρίζουσιν τὴν παρεμβολήν
  english_pob_choice: they were setting the camp on fire
  chosen_korean: 진영에 불을 지르고 있는
  alternatives_korean:
  - 진영을 불태우고 있는
  - 진영에 불을 놓고 있는
  lexicon: LSJ
  rationale: ἐνπυρίζουσιν의 진행상을 살리면서 παρεμβολήν을 군사적 의미의 ‘진영’으로 옮겼습니다.
- source_word: ὁ θεωρούμενος
  english_pob_choice: the smoke that was visible
  chosen_korean: 보이는 연기가
  alternatives_korean:
  - 눈에 띄는 연기가
  - 볼 수 있는 연기가
  lexicon: LSJ
  rationale: 수동 분사로서 ‘보이는/보여지는’ 뉘앙스를 유지하되, 한국어에서는 자연스러운 관찰 가능성을 드러내는 표현으로 다듬었습니다.
- source_word: τὸ γεγονός
  english_pob_choice: what had happened
  chosen_korean: 일어난 일
  alternatives_korean:
  - 벌어진 일
  - 사태
  lexicon: LSJ
  rationale: 완료된 사건을 가리키는 중성 분사 명사구를, 문맥상 가장 자연스러운 중립 표현인 ‘일어난 일’로 옮겼습니다.
