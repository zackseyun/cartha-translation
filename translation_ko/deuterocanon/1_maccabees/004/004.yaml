    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἔτι
  english_pob_choice: while ... still
  chosen_korean: 아직 … 동안
  alternatives_korean:
  - …할 때까지 아직
  - 아직도 … 때
  lexicon: LSJ
  rationale: ἕως ἔτι는 단순한 종착점보다 ‘아직 그러한 상태가 지속되는 동안’이라는 시간적 틀을 주므로, 한국어에서도 자연스러운 ‘아직 … 동안’으로 옮겼습니다.
- source_word: αἱ δυνάμεις
  english_pob_choice: the forces
  chosen_korean: 군대
  alternatives_korean:
  - 병력
  - 군사들
  - 군세
  lexicon: LSJ
  rationale: 여기서 δυνάμεις는 전투 맥락의 병력 전체를 가리키므로, 한국어에서는 문맥상 가장 자연스러운 집합 명사인 ‘군대’로 옮겼습니다.
- source_word: ἐσκορπισμέναι
  english_pob_choice: scattered
  chosen_korean: 흩어져 있는
  alternatives_korean:
  - 분산되어 있는
  - 퍼져 있는
  - 흩어진
  lexicon: LSJ
  rationale: 분사형으로 지속 상태를 나타내므로, 현재진행적 상태를 살리는 ‘흩어져 있는’이 가장 직접적입니다.
- source_word: ἀπὸ τῆς παρεμβολῆς
  english_pob_choice: from the camp
  chosen_korean: 진영에서
  alternatives_korean:
  - 진영으로부터
  - 진지에서
  - 캠프에서
  lexicon: LSJ
  rationale: παρεμβολή는 군사적 ‘진영/진지’를 뜻하므로, ἀπό의 분리 의미를 살려 ‘진영에서’로 간결하게 옮겼습니다.
