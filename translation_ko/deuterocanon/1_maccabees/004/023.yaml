  lexicon: LSJ
  rationale: σκυλίαν은 전쟁에서 빼앗은 물품을 가리키므로 ‘전리품’이 적절하며, παρεμβολῆς는 군사적 ‘진영’으로 옮겼습니다.
- source_word: ὑάκινθον καὶ πορφύραν
