  text: And Judas returned to the plunder of the camp[a], and took much gold and silver, and blue cloth and purple cloth and sea goods[b], and great wealth.
  footnotes:
  - marker: a
    text: Or possibly 'sea-blue cloth' or 'marine-purple'; the Greek term literally means 'of the sea,' and its exact referent in this list of valuables is uncertain.
