  - marker: b
    text: Greek 'he took'; the singular may refer to Judas as representative leader, though the sense can be collective in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 유다가 진영의 전리품으로 되돌아가 많은 금과 은과 청색 천과 자색 천과 바다에서 온 물품들[a], 그리고 큰 부를 취했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 θαλασσίαν은 문자적으로 ‘바다의’라는 뜻입니다. 이 목록에서 정확히 무엇을 가리키는지는 확실하지 않습니다. ‘바다에서 온 물품들’로 옮겼으나, ‘바다빛 천’ 또는 ‘바다 자색’ 같은 직물을 가리킬 가능성도 있습니다.
    reason: lexical_alternative
