  - 바다 물품
  lexicon: LSJ
  rationale: 원어는 문자적으로 ‘바다의/바다에 속한’이라는 뜻이지만 정확한 항목이 불명확하므로, 사전적 불확실성을 남기면서도 목록형 표현을 유지했습니다.
