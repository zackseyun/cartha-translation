  text: And Judas returned to the plunder of the camp[a], and took much gold and silver, and blue cloth and purple cloth and sea goods[b], and great wealth.
  footnotes:
  - marker: a
    text: Or possibly 'sea-blue cloth' or 'marine-purple'; the Greek term literally means 'of the sea,' and its exact referent in this list of valuables is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Greek 'he took'; the singular may refer to Judas as representative leader, though the sense can be collective in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 유다가 진영의 전리품으로 돌아가서 많은 금과 은과 청색 천과 자색 천과 바다 것들을[a], 그리고 큰 부를 취했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 θαλασσίαν은 문자적으로 ‘바다의’라는 뜻입니다. 여기서는 정확한 물품을 단정하기 어려워, 해석을 넓혀 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέστρεψεν
