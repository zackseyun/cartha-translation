  rationale: 군사 서술에서 단순한 이동 완료를 자연스럽게 살리면서도, 원문의 ‘되돌아감’을 유지하기 위해 ‘돌아가서’로 옮겼습니다.
- source_word: σκυλίαν τῆς παρεμβολῆς
