translation:
  language: ko
  text: 그들이 성소를 깨끗하게 하고, 더러움의 돌들을 부정한 곳으로 가져갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκαθάρισαν
  english_pob_choice: cleansed
  chosen_korean: 깨끗하게 하다
  alternatives_korean:
  - 정결하게 하다
  - 정화하다
  - 깨끗이 하다
  lexicon: BDAG
  rationale: 성전 정결 맥락을 살리면서도 현대 한국어에서 지나치게 종교 용어에 치우치지 않게 '깨끗하게 하다'로 옮겼습니다.
- source_word: τὰ ἅγια
  english_pob_choice: the sanctuary
  chosen_korean: 성소
  alternatives_korean:
  - 성전
  - 거룩한 곳
  - 거룩한 것들
  lexicon: LSJ
  rationale: 문맥상 정화 대상은 성전 구역이므로 '성소'가 가장 간결하고 예배적 맥락을 유지합니다.
- source_word: τοὺς λίθους τοῦ μιασμοῦ
  english_pob_choice: the stones of defilement
  chosen_korean: 더러움의 돌들
  alternatives_korean:
  - 더럽혀진 돌들
  - 부정의 돌들
  - 오염의 돌들
  lexicon: LSJ
  rationale: 소유격 구조를 그대로 살려 돌들이 더러움과 결부된 대상임을 드러내되, '부정'보다 일상적이면서도 의례적 함의를 해치지 않는 표현을 택했습니다.
- source_word: εἰς τόπον ἀκάθαρτον
  english_pob_choice: to an unclean place
  chosen_korean: 부정한 곳
  alternatives_korean:
  - 더러운 곳
  - 정결하지 않은 곳
  - 불결한 곳
  lexicon: BDAG
  rationale: ἀκάθαρτος의 제의적 부정성을 보존하기 위해 '부정한'을 사용했습니다.
theological_decisions:
- issue: 성전 정화의 제의적 어휘 보존
  chosen_reading: '''깨끗하게 하다'', ''더러움'', ''부정한 곳''처럼 정결/부정 어휘를 노출시켰습니다.'
  alternative_readings:
  - 단순히 '치우다', '더러운 돌', '더러운 곳'으로 평이하게 처리
  rationale: 본문은 단순 청소가 아니라 훼손된 성소를 예식적으로 정화하는 장면이므로, 정결 언어의 신학적 무게를 살려야 합니다.
  doctrine_reference: 'DOCTRINE.md: 원어 우선, 제의적·신학적 의미를 평이화하지 않음'
