base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/024.yaml
  text: 'And when they turned back, they sang hymns and gave praise to heaven: “For he is good; his mercy endures forever.”'
  footnotes:
  - marker: a
    text: Greek literally, 'to heaven,' a reverential way of directing praise to God.
    reason: cultural_note
  - marker: b
    text: Or, more literally, 'for it is good; his mercy is forever.' The main text renders the likely personal sense of the liturgical formula.
    reason: alternative_reading
translation:
  language: ko
  text: 그들이 돌아와서는 하늘을 향하여 찬송하며 찬양했습니다. “그분은 선하시며, 그분의 인자하심은 영원합니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘하늘을 향하여’입니다. 이는 하나님께 드리는 찬양을 나타내는 경외적 표현입니다.
    reason: cultural_note
  - marker: b
    text: 더 문자적으로는 ‘그분은 선하다; 그분의 인자하심은 영원하다’입니다. 본문은 찬양 공식의 개인적 의미를 드러내어 번역했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιστρέψαντες
  english_pob_choice: when they turned back
  chosen_korean: 돌아와서는
  alternatives_korean:
  - 되돌아와서는
  - 돌아간 뒤에
  lexicon: LSJ
  rationale: 부사절 역할의 부정과거 분사를 한국어에서 자연스럽게 시간 순서로 풀어, 단순한 ‘귀환’보다 움직임과 연속성을 살렸습니다.
- source_word: ὕμνουν
  english_pob_choice: they sang hymns
  chosen_korean: 찬송하며
  alternatives_korean:
  - 찬송을 부르며
  - 찬가를 부르며
  lexicon: LSJ
  rationale: ὑμνέω의 예배적·음악적 뉘앙스를 살리되 한국어 문장에서는 동사형 ‘찬송하며’가 가장 자연스럽습니다.
- source_word: ᾐνοῦν
  english_pob_choice: gave praise
  chosen_korean: 찬양했습니다
  alternatives_korean:
  - 찬미했습니다
  - 칭송했습니다
  lexicon: LSJ
  rationale: 앞의 ὕμνουν과 구별되는 병렬 동사이므로, 의미상 겹치더라도 한국어에서는 두 번째 동사를 ‘찬양’으로 옮겨 반복을 피했습니다.
- source_word: εἰς οὐρανόν
  english_pob_choice: to heaven
  chosen_korean: 하늘을 향하여
  alternatives_korean:
  - 하늘에
  - 하늘을 향해
  lexicon: LSJ
  rationale: 직역하면 ‘하늘로/하늘을 향하여’이지만, 본문은 하나님께 드리는 경외적 우회표현이므로 독자가 그 의도를 읽을 수 있도록 방향성을 살렸습니다.
- source_word: Ὅτι καλὸν εἰς τὸν αἰῶνα τὸ ἔλεος αὐτοῦ
  english_pob_choice: For he is good; his mercy endures forever.
  chosen_korean: “그분은 선하시며, 그분의 인자하심은 영원합니다.”
  alternatives_korean:
  - “그분은 선하시니, 그분의 자비는 영원합니다.”
  - “선한 분이시며, 그분의 인자하심은 영원합니다.”
  lexicon: LSJ
  rationale: Ὅτι의 찬양 공식은 문맥상 하나님을 가리키는 고백으로 이해하는 것이 자연스럽고, ἔλεος는 단순한 ‘자비’보다 시편적·언약적 울림을 살리는 ‘인자하심’이 적절합니다.
theological_decisions:
- issue: εἰς οὐρανόν의 경배 대상 표현
  chosen_reading: ‘하늘을 향하여’로 옮겨, 직접적으로 ‘하나님께’라고 풀지 않고도 경외적 우회표현임을 드러냈습니다.
  alternative_readings:
  - ‘하나님께’
  - ‘하늘로’
  rationale: 그리스어가 문자적으로는 ‘하늘’을 말하지만, 본문 기능은 하나님께 드리는 찬양을 나타내는 경외적 표현이므로 의미는 살리되 과도한 의역은 피했습니다.
  doctrine_reference: 번역 원칙 §1, §6
- issue: Ὅτι καλὸν … τὸ ἔλεος αὐτοῦ의 개인적 주어
  chosen_reading: ‘그분은 선하시며’로 하나님을 주어로 드러냈습니다.
  alternative_readings:
  - ‘선한 것입니다’
  - ‘선하도다’
  rationale: 영어 POB의 감사 공식처럼, 뒤따르는 ‘그분의 인자하심’이 분명히 하나님을 가리키므로 개인적 주어를 취하는 것이 문맥상 가장 자연스럽습니다.
  doctrine_reference: 번역 원칙 §1, §6
