base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/030.yaml
  text: And when he saw that the camp was strong[a], he prayed and said, “Blessed are you, O Savior of Israel, who crushed the assault of the mighty one by the hand of your slave David[b], and gave the camp of the foreigners into the hands of Jonathan son of Saul and of the one who carried his armor.”
  footnotes:
  - marker: a
    text: Or 'your servant David.' The Greek word is δοῦλος, which can mean either 'slave' or 'servant' depending on context.
    reason: lexical_alternative
  - marker: b
    text: The prayer alludes to the story of David and Goliath, and to Jonathan with his armor-bearer in battle; the Greek here says 'the mighty man' and 'the foreigners' rather than naming them explicitly.
    reason: cross_reference
translation:
  language: ko
  text: 그리고 그가 그 진영이 강한 것을 보고 기도하며 말했습니다. “이스라엘의 구원자이신 주님은 찬양받으소서. 당신의 종 다윗의 손을 통해 강한 자의 돌격을 부수셨고, 사울의 아들 요나단과 그의 무기를 멘 자의 손에 블레셋 사람들의 진영을 넘기셨습니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 진영이 강한 것을’입니다. 군사적 맥락의 παρεμβολή를 ‘진영’으로 옮겼습니다.
    reason: source_note
  - marker: b
    text: 원문은 ‘강한 자의 돌격’이라고 하며, 사무엘상의 골리앗 전승을 암시합니다.
    reason: cross_reference
  - marker: c
    text: 직역하면 ‘그의 무기를 멘 자’입니다. 영어 POB의 ‘the one who carried his armor’에 해당합니다.
    reason: source_note
lexical_decisions:
- source_word: παρεμβολὴν ἰσχυράν
  english_pob_choice: the camp was strong
  chosen_korean: 그 진영이 강한 것을
  alternatives_korean:
  - 그 진영이 견고한 것을
  - 그 진영이 강력한 것을
  lexicon: LSJ
  rationale: 군사적 맥락에서 παρεμβολή는 ‘진영’이 자연스럽고, ἰσχυράν은 단순한 물리적 강함보다 전투력 있는 세력을 가리키므로 ‘강한’이 가장 सीधे합니다.
- source_word: ὁ σωτὴρ Ἰσραήλ
  english_pob_choice: O Savior of Israel
  chosen_korean: 이스라엘의 구원자이신 주님
  alternatives_korean:
  - 이스라엘의 구원자이신 하나님
  - 이스라엘의 구원자이신 구세주
  lexicon: LSJ
  rationale: 직접 호칭이므로 존칭형 ‘-이신’으로 처리했고, σωτήρ는 구원 행위를 드러내는 ‘구원자’가 본문에 가장 밀착합니다. 주어가 하나님께 대한 기도이므로 호칭은 ‘주님’으로 풀었습니다.
- source_word: τοῦ δούλου σου Δαυείδ
  english_pob_choice: your slave David
  chosen_korean: 당신의 종 다윗
  alternatives_korean:
  - 당신의 노예 다윗
  - 당신의 종이자 노예인 다윗
  lexicon: BDAG
  rationale: δοῦλος는 문맥상 소속과 종속을 드러내지만, 이 기도문에서 다윗에 대한 역사적 호칭은 한국어로는 ‘종’이 더 자연스럽고 경어 기도문 어조에 맞습니다. 영어 POB의 ‘slave’ 선택은 본문 자체보다 신학적 표시였으므로, 한국어는 과도한 충격을 피하되 주종 관계를 유지했습니다.
- source_word: τοῦ δυνατοῦ
  english_pob_choice: the mighty one
  chosen_korean: 강한 자의
  alternatives_korean:
  - 능한 자의
  - 용사의
  lexicon: LSJ
  rationale: τοῦ δυνατοῦ는 특정 인물을 가리키는 단수 표현이므로, 영어 POB처럼 이름을 덧붙이지 않고 ‘강한 자’로 옮겨 사무엘서의 골리앗 암시를 살렸습니다.
- source_word: ἐν χειρὶ ... εἰς χεῖρας
  english_pob_choice: by the hand of ... into the hands of
  chosen_korean: '...의 손을 통해 ...의 손에'
  alternatives_korean:
  - '...의 손으로 ...의 손에'
  - '...을 통해 ...에게'
  lexicon: LSJ
  rationale: ‘손’ 반복은 원문의 도구성과 역전 구조를 강조하므로 그대로 살렸습니다. 한국어에서는 ‘손을 통해 / 손에’가 가장 자연스럽게 그 대조를 보존합니다.
- source_word: ἀλλοφύλων
  english_pob_choice: the foreigners
  chosen_korean: 블레셋 사람들의
  alternatives_korean:
  - 외국인들의
  - 이방인들의
  lexicon: LSJ
  rationale: 문자적으로는 ‘외국인들’이지만, 여기서는 다윗-요나단 전승을 분명히 가리키는 전형적 역사적 지시가 있으므로 한국어 독자의 이해를 위해 ‘블레셋 사람들’로 구체화했습니다.
theological_decisions:
- issue: δοῦλος를 다윗에게 어떻게 옮길지
  chosen_reading: 당신의 종 다윗
  alternative_readings:
  - 당신의 노예 다윗
  - 당신의 종이자 노예인 다윗
  rationale: 본 절은 하나님께 드리는 기도문의 존칭 문맥이라 한국어 자연성과 경건한 호칭을 고려해 ‘종’을 선택했습니다. 다만 히브리/그리스어의 종속성은 보존되며, 본문은 여전히 하나님께 전적으로 속한 다윗의 위치를 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: δοῦλος 처리 지침; 번역 철학 §1'
- issue: ἀλλοφύλων을 일반적 ‘외국인’으로 둘지 특정 집단으로 밝힐지
  chosen_reading: 블레셋 사람들의 진영
  alternative_readings:
  - 외국인들의 진영
  - 이방인들의 진영
  rationale: 이 절은 사무엘상 전승에 대한 명백한 암시이므로, 한국어 본문에서 역사적 대상인 블레셋을 드러내는 것이 수신자 이해에 더 직접적입니다. 다만 이 선택은 해설적 구체화이므로 주석적 성격을 갖습니다.
  doctrine_reference: 'DOCTRINE.md: 암시적 상호본문성 처리 원칙'
