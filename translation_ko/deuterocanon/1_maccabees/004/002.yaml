  chosen_reading: 본문에서는 '아크라'로 음역하고, 문맥상 예루살렘의 요새 성채를 가리키는 역사적 명칭으로 이해했습니다.
  alternative_readings:
  - 성채
  - 요새
  - 성채(아크라)
  rationale: 원문이 단순한 일반 명사인지, 예루살렘의 특정 요새인 아크라를 가리키는지의 역사적 함의를 지우지 않기 위해 음역을 유지했습니다. 동시에 한국어 독자가 이해할 수 있도록 앞뒤 문맥만으로도 의미가 읽히게 했습니다.
  doctrine_reference: 역사서 본문 해석 원칙; 고유명사 보존의 투명성
