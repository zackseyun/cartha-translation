translation:
  language: ko
  text: 유대인들의 진영을 덮쳐 그들을 갑자기 치려고 했으며, 아크라 사람들은 그의 길잡이였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “아크라의 아들들”입니다. ‘아크라’는 예루살렘의 요새화된 성채를 가리키는 그리스어 이름으로 흔히 쓰입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιβαλεῖν ἐπὶ
  english_pob_choice: fall upon
  chosen_korean: 덮쳐
  alternatives_korean:
  - 쳐들어
  - 공격하여
  lexicon: BDAG / LSJ
  rationale: 적을 향해 급습하는 군사적 움직임을 자연스럽게 살리면서, 단순한 일반적 ‘공격’보다 원문의 강한 돌진감을 보존합니다.
- source_word: πατάξαι
  english_pob_choice: strike
  chosen_korean: 쳐부수려
  alternatives_korean:
  - 치려
  - 내리치려
  - 공격하려
  lexicon: BDAG
  rationale: 문맥상 갑작스러운 군사 타격을 가리키므로, 단순한 ‘치다’보다 결과가 더 강하게 드러나는 한국어를 택했습니다. 다만 원문이 반드시 ‘죽이다’까지 명시하지는 않으므로 그 이상은 말하지 않았습니다.
- source_word: οἱ υἱοὶ τῆς ἄκρας
  english_pob_choice: the sons of the citadel
  chosen_korean: 아크라의 아들들
  alternatives_korean:
  - 아크라의 사람들
  - 아크라의 군사들
  - 성채의 아들들
  lexicon: LSJ
  rationale: 직역에 가까운 형태를 유지해 원문의 표현적 긴장을 살렸습니다. 여기서 ἄκρα는 예루살렘의 요새화된 성채를 가리키는 고유한 역사적 명칭으로 볼 수 있어, 음역을 병기하는 편이 더 투명합니다.
- source_word: ὁδηγοί
  english_pob_choice: guides
  chosen_korean: 길잡이였습니다
  alternatives_korean:
  - 안내자였습니다
  - 인도자였습니다
  - 길안내자였습니다
  lexicon: BDAG
  rationale: 군사적 맥락에서 길을 인도하는 자들을 뜻하므로, 자연스러운 현대 한국어인 ‘길잡이’가 가장 분명합니다.
theological_decisions:
