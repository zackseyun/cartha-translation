  text: And the foreigners lifted up their eyes and saw them encamped opposite them,[a]
  footnotes:
  - marker: a
    text: Or 'drawn up opposite them' or 'positioned facing them.' The Greek participle can denote being situated or arrayed in place; 'encamped' reflects the military setting.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이방인들은 눈을 들어, 자기들 맞은편에 진을 치고 있는 그들을 보았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들 맞은편에 전열을 갖추고 있었다” 또는 “그들을 마주하여 배치되어 있었다.” 그리스어 분사는 자리 잡고 있거나 전열을 이루고 있는 상태를 가리킬 수 있습니다. “진을 치고 있는”은 군사적 문맥을 반영한 번역입니다.
    reason: alternative_reading
