  text: And the foreigners lifted up their eyes and saw them encamped opposite them,[a]
  footnotes:
  - marker: a
    text: Or 'drawn up opposite them' or 'positioned facing them.' The Greek participle can denote being situated or arrayed in place; 'encamped' reflects the military setting.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이방인들은 눈을 들어 보았고, 그들이 자기들 맞은편에 진을 친 것을 보았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들 맞은편에 전열을 갖추었다” 또는 “그들을 향해 배치되어 있었다.” 그리스어 분사형은 ‘그 자리에 놓여 있는/배열된’ 상태를 나타낼 수 있으므로, “진을 친”은 군사적 상황을 반영한 번역입니다.
    reason: alternative_reading
