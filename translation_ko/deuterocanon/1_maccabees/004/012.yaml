  source_fidelity: 그리스어 원문은 ‘이방인들’이 눈을 들어, 자신들의 맞은편에 자리 잡고 있는 ‘그들’을 본 것으로 말합니다. 초안은 ‘그들이 자기들 맞은편에’가 주어인 이방인들과 목적어인 상대 군대의 지시 대상을 혼동하게 할 수 있습니다. 이를 바로잡으면 원문의 대명사 관계와 군사적 위치 관계가 충실히 드러납니다.
  naturalness: ‘눈을 들어 보았고’는 동작의 연결이 다소 겹치며, 뒤의 ‘그들이 자기들 맞은편에’는 한국어에서 누가 진을 쳤는지 불분명합니다. 관계절을 사용한 ‘자기들 맞은편에 진을 치고 있는 그들을 보았습니다’가 현대 표준 한국어 합쇼체 문장으로 명료하고 자연스럽습니다.
