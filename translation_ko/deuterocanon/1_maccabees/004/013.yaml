lexical_decisions:
- source_word: ἐξῆλθαν ἐκ τῆς παρεμβολῆς
  english_pob_choice: they went out from the camp
  chosen_korean: 진을 친 곳에서 나갔고
  alternatives_korean:
  - 진영에서 나갔고
  - 군영에서 나갔고
  lexicon: LEH
  rationale: παρεμβολή는 군사적 ‘진영/진’을 가리키므로, 자연스러운 현대 한국어로는 ‘진을 친 곳’이 본문의 군사적 장면을 유지하면서도 지나치게 고어적이지 않습니다.
- source_word: εἰς πόλεμον
  english_pob_choice: for battle
  chosen_korean: 전투를 위해
  alternatives_korean:
  - 전투로
  - 전쟁을 위해
  lexicon: LEH
  rationale: πόλεμος는 여기서 즉각적인 교전을 가리키므로 ‘전투를 위해’가 가장 간결하고 문맥에 맞습니다.
- source_word: οἱ παρὰ Ἰούδου
  english_pob_choice: those with Judas
  chosen_korean: 유다와 함께한 자들
  alternatives_korean:
  - 유다와 함께 있는 자들
  - 유다의 사람들
  lexicon: BDAG
  rationale: 이 표현은 유다에게 속한 집단이라기보다 유다 곁에 있는 동반 무리를 가리키므로, ‘유다와 함께한 자들’이 관계를 가장 정확하게 드러냅니다.
- source_word: ἐσάλπισαν
  english_pob_choice: sounded the trumpets
  chosen_korean: 나팔을 불었습니다
  alternatives_korean:
  - 나팔을 울렸습니다
  - 트럼펫을 불었습니다
  lexicon: BDAG
  rationale: 동사는 나팔 소리를 내게 하다/불다의 뜻이므로, 한국어 관용 표현인 ‘나팔을 불었습니다’가 가장 자연스럽습니다.
theological_decisions:
- issue: 군사적 장면의 직설성 유지
  chosen_reading: ‘진을 친 곳’과 ‘전투’를 그대로 살려, 본문의 전쟁 준비 장면을 완화하지 않았습니다.
  alternative_readings:
  - ‘진영’으로 일반화하여 완곡하게 옮김
  - ‘싸움’으로 약화하여 옮김
  rationale: 본문은 실제 전투 개시를 묘사하므로, 원문의 군사적 긴장감을 보존하는 편이 독자 이해에 더 충실합니다.
  doctrine_reference: 본문-충실 번역 원칙
- issue: 주어 집단의 관계 표현
  chosen_reading: οἱ παρὰ Ἰούδου를 ‘유다와 함께한 자들’로 옮겨, 문법적 관계를 드러내되 조직적 소속을 과도하게 부여하지 않았습니다.
  alternative_readings:
  - ‘유다의 군사들’로 옮겨 지휘 체계를 강조
  - ‘유다의 사람들’로 옮겨 소속감을 강조
  rationale: 헬라어 전치사구는 동행/근처 관계를 나타내므로, 이를 한국어에서 그대로 반영하는 것이 가장 무리 없습니다.
  doctrine_reference: 본문-충실 번역 원칙
