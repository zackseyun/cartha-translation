review_pass:
  verdict: revise
  source_fidelity: 핵심 군사 행위와 목적 관계는 대체로 잘 반영되어 있습니다. 다만 ὠχύρωσαν은 단순한 ‘강화’보다 ‘요새화하다’가 방어 시설을 갖추는 뜻을 더 정확히 드러냅니다. 마지막 목적절은 ‘것이었습니다’보다 직접적인 목적 표현으로 옮기는 편이 원문의 통사 관계에 충실합니다.
  naturalness: 현 번역의 ‘그들은 거기서 그것을 지키게 할 군대를’는 ‘거기서’와 ‘그것을’의 결합이 어색합니다. ‘그곳을 지키도록 그곳에 군대를 배치하고’처럼 정리하면 현대 표준 한국어로 더 자연스럽습니다.
  terminology: ‘베이트수라’는 그리스어 표기를 반영한 음역으로 수용 가능합니다. ‘견고한 요새’는 ὀχύρωμα의 의미를 다소 중복하여 강조하므로 ‘요새’로 충분합니다. 각주 a의 ‘군대를 명령하였다’는 한국어 결합이 부자연스러우므로 ‘군대를 배치하라고 명령하였다’로 고쳐야 합니다.
  issues:
  - severity: medium
    issue: ὠχύρωσαν을 ‘강화하여’로 번역함
    rationale: 원어는 방어 거점으로 만들거나 방비를 갖추는 행위를 뜻합니다. ‘요새화하여’가 군사적·물리적 방어 의미를 더 정확히 전달합니다.
  - severity: medium
    issue: 목적절을 ‘하려는 것이었습니다’로 처리함
    rationale: τοῦ ἔχειν은 앞선 행동의 목적을 나타냅니다. ‘백성이 … 갖도록 하였습니다’가 원문의 목적 관계를 직접적이고 자연스럽게 표현합니다.
  - severity: low
    issue: 각주 a의 대안 표현이 비문에 가까움
    rationale: ‘군대를 명령하였다’는 자연스러운 한국어가 아닙니다. 명령의 목적어와 보어를 밝혀 ‘군대를 배치하라고 명령하였다’로 해야 합니다.
