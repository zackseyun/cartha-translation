base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/061.yaml
  text: And they stationed a force there to guard it[a], and they fortified it to guard Bethsura[b], so that the people might have a stronghold facing Idumea.
  footnotes:
  - marker: a
    text: Or 'they ordered a force there to guard it.' The Greek verb can mean 'ordered/appointed,' but here likely implies assigning troops to a post.
    reason: lexical_alternative
  - marker: b
    text: Bethsura is a fortified site south of Jerusalem, strategically positioned toward Idumea.
    reason: cultural_note
translation:
  language: ko
  text: 그들은 거기서 그것을 지키게 할 군대를 배치하고, 그것을 강화하여 베이트수라를 지키게 하였으니, 백성이 에돔을 마주한 견고한 요새를 갖게 하려는 것이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그곳을 지키도록 군대를 명령하였다’로도 옮길 수 있습니다. 이 동사는 ‘명령하다/임명하다’의 뜻도 있지만, 여기서는 경비 임무를 배정하는 뜻으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 베이트수라는 예루살렘 남쪽의 요새화된 지점으로, 에돔을 향한 전략적 거점입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπέταξαν
  english_pob_choice: they stationed
  chosen_korean: 군대를 배치하고
  alternatives_korean:
  - 군대를 명령하고
  - 군대를 नियुक्त하고
  lexicon: LSJ
  rationale: 명령의 뜻도 가능하지만, 뒤의 τηρεῖν과 함께 쓰여 실제로는 경비 임무를 맡겨 자리를 지키게 하는 군사적 조치이므로 ‘군대를 배치하고’가 가장 자연스럽습니다.
- source_word: τηρεῖν
  english_pob_choice: to guard
  chosen_korean: 지키게 하다
  alternatives_korean:
  - 감시하게 하다
  - 보호하게 하다
  lexicon: LSJ
  rationale: 여기서는 일반적 ‘지키다’보다 군사적 경계·경비의 뜻이 강하므로 ‘지키게 하다’로 옮겼습니다.
- source_word: ὠχύρωσαν
  english_pob_choice: they fortified
  chosen_korean: 강화하여
  alternatives_korean:
  - 요새화하여
  - 견고하게 하여
  lexicon: LSJ
  rationale: 성채 자체를 더 튼튼하게 만든다는 뜻을 살리되, 한국어 문맥에서는 ‘강화하여’가 간결하고 자연스럽습니다.
- source_word: τὴν Βαιθσουρά
  english_pob_choice: Bethsura
  chosen_korean: 베이트수라
  alternatives_korean:
  - 벳수라
  - 베스수라
  lexicon: LSJ
  rationale: 고유지명은 음역하며, 그리스어 형태 Βαιθσουρά를 최대한 반영하는 표기를 택했습니다.
- source_word: ὀχύρωμα
  english_pob_choice: a stronghold
  chosen_korean: 견고한 요새
  alternatives_korean:
  - 요새
  - 성채
  lexicon: LSJ
  rationale: 단순한 ‘요새’보다 방어 거점이라는 뉘앙스를 드러내기 위해 ‘견고한 요새’로 옮겼습니다.
