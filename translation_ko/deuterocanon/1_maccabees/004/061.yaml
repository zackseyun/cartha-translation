- from: 그들은 거기서 그것을 지키게 할 군대를 배치하고, 그것을 강화하여 베이트수라를 지키게 하였으니, 백성이 에돔을 마주한 견고한 요새를 갖게 하려는 것이었습니다.[a][b]
  to: 그들은 그곳을 지키도록 그곳에 군대를 배치하고[a], 그곳을 요새화하여 베이트수라를 지키게 하였습니다.[b] 그리하여 백성이 에돔 맞은편에 요새를 갖게 하였습니다.
  rationale: 군대 배치, 해당 장소의 방비 강화, 베이트수라 수비, 그리고 에돔 맞은편의 요새 확보라는 원문의 순서와 목적 관계를 유지했습니다. 불필요한 의미 강화는 피하고, 지시대명사의 선행 대상이 본문만으로 특정되지 않도록 ‘그곳’으로 보존했습니다.
