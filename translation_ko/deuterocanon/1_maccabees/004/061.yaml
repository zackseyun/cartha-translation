  yaml_path: translation/deuterocanon/1_maccabees/004/061.yaml
  text: And they stationed a force there to guard it[a], and they fortified it to guard Bethsura[b], so that the people might have a stronghold facing Idumea.
  footnotes:
  - marker: a
    text: Or 'they ordered a force there to guard it.' The Greek verb can mean 'ordered/appointed,' but here likely implies assigning troops to a post.
    reason: lexical_alternative
  - marker: b
    text: Bethsura is a fortified site south of Jerusalem, strategically positioned toward Idumea.
    reason: cultural_note
translation:
  language: ko
  text: 그들은 그곳을 지키도록 그곳에 군대를 배치하고[a], 그곳을 요새화하여 베이트수라를 지키게 하였습니다.[b] 그리하여 백성이 에돔 맞은편에 요새를 갖게 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그곳에 군대를 배치하라고 명령하였다’로 옮길 수 있습니다. 이 동사는 ‘명령하다’ 또는 ‘임명하다’라는 뜻도 있지만, 여기서는 군대를 경비 임무에 배정하는 뜻으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 베이트수라는 예루살렘 남쪽에 있는 요새화된 지점으로, 에돔 쪽에 맞선 전략적 위치에 있습니다.
    reason: cultural_note
lexical_decisions:
