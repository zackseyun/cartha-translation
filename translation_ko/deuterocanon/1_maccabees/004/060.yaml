  text: And at that time they built up Mount Zion with high walls all around and strong towers[a], lest the nations come and trample it, as they had done before.
  footnotes:
  - marker: a
    text: Or 'the Gentiles come and trample it.' The Greek τὰ ἔθνη can mean 'the nations' or 'the Gentiles.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 그들은 시온 산을 둘러 높은 성벽과 튼튼한 망대들을 세워, 이전처럼 이방 민족들이 와서 그것을 짓밟지 못하게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “열방이 와서 그것을 짓밟지 못하게 하였습니다.” 그리스어 τὰ ἔθνη는 “민족들” 또는 “이방인들”을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησαν
  english_pob_choice: they fortified / built up
  chosen_korean: 세워
  alternatives_korean:
  - 건축하였
  - 건설하였
  - 보수하였
  lexicon: LSJ
  rationale: 문맥상 단순한 건축이 아니라 방어 목적의 축성이므로, 한국어에서는 자연스럽게 “세워”로 옮겨 성벽과 망대 설치의 결과를 드러냈습니다.
- source_word: τὸ ὄρος Σιὼν
  english_pob_choice: Mount Zion
  chosen_korean: 시온 산
  alternatives_korean:
  - 시온 산악
  - 시온의 산
  lexicon: LSJ
  rationale: 지명으로 굳어진 표현이므로 “시온 산”을 사용해 자연스러움과 대응성을 함께 살렸습니다.
- source_word: τὰ ἔθνη
  english_pob_choice: the nations
  chosen_korean: 이방 민족들
  alternatives_korean:
  - 열방
  - 민족들
  - 이방인들
  lexicon: LSJ
  rationale: 이 역사 문맥에서는 유대 공동체를 위협하는 비유대계 집단을 가리키므로, ‘민족들’의 기본 의미를 살리면서도 독자에게 대상이 분명하도록 “이방 민족들”로 옮겼습니다.
- source_word: καταπατήσωσιν
  english_pob_choice: trample it
  chosen_korean: 짓밟지 못하게
  alternatives_korean:
  - 밟아 무너지게
  - 유린하지 못하게
  - 밟아 짓누르지 못하게
  lexicon: LSJ
  rationale: 동사의 직역인 ‘밟다’의 강한 폭력성을 유지하려고 “짓밟다”를 택했고, 부정 목적절에 맞게 “못하게”로 자연스럽게 구성했습니다.
theological_decisions:
