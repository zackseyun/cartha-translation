  rationale: 본문은 후대 기독교 용례의 ‘이방인’보다, 적대적 비유대계 집단을 가리키는 역사적 의미를 드러내는 표현이 더 적절합니다.
  doctrine_reference: 'DOCTRINE.md: 원문 의미 우선과 역사적 문맥 보존'
- issue: 방어 건축의 동사 선택
