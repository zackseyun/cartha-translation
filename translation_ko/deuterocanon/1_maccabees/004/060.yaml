  alternative_readings:
  - 건축하여
  - 성곽을 쌓아
  - 요새화하여
  rationale: 본문의 초점은 단순 건축이 아니라 성전/산을 방어 가능한 상태로 만드는 데 있으므로, 과도하게 기술적이거나 현대적 군사어를 피하고 본문이 말하는 보호 의도를 살렸습니다.
  doctrine_reference: 'DOCTRINE.md: 원문의 기능적 의미를 과장 없이 전달'
