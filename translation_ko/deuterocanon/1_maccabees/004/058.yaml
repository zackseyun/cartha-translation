lexical_decisions:
- source_word: ἐγενήθη
  english_pob_choice: there was
  chosen_korean: 일어났으며
  alternatives_korean:
  - 있었습니다
  - 생겼습니다
  - 일어났습니다
  lexicon: BDAG
  rationale: impersonal 서술을 자연스러운 한국어로 옮기되, 단순 존재보다 사건의 발생을 살려 표현했습니다.
- source_word: εὐφροσύνη μεγάλη
  english_pob_choice: very great rejoicing
  chosen_korean: 매우 큰 기쁨
  alternatives_korean:
  - 큰 기쁨
  - 매우 큰 즐거움
  - 큰 환희
  lexicon: LSJ
  rationale: εὐφροσύνη의 공동체적 환희를 ‘기쁨’으로 옮기고, μεγάλη와 σφόδρα의 중첩된 강세를 ‘매우 큰’으로 반영했습니다.
- source_word: ὀνειδὸς ἐθνῶν
  english_pob_choice: the reproach of the nations
  chosen_korean: 민족들의 치욕
  alternatives_korean:
  - 열방의 비난
  - 민족들의 수치
  - 이방 민족들의 치욕
  lexicon: BDAG
  rationale: ὀνειδός는 공적 수치/치욕의 뉘앙스가 강하므로 ‘치욕’이 가장 직접적이며, ἐθνῶν은 이 문맥에서 ‘민족들’로 옮겨 과도한 신학적 해석을 피했습니다.
theological_decisions:
- issue: ἐθνῶν의 범주를 ‘이방인’으로 신학화할지 여부
  chosen_reading: 문맥상 적대적 외부 민족들을 가리키지만, 본문 자체는 ‘민족들’로 유지했습니다.
  alternative_readings:
  - 이방인들의 치욕
  - 열방의 치욕
  rationale: 1마카비서는 역사 서술이므로, 본문의 사회-정치적 대조를 보존하면서도 후대적 용어를 본문에 덧씌우지 않기 위해 중립적 표현을 택했습니다.
  doctrine_reference: 원문 우선 원칙; 문맥적 함의는 본문 주석이 아닌 번역에 과잉 반영하지 않음
