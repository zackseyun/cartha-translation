  language: ko
  text: 그들은 모두 이방인의 땅으로 도망쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이방인들의 땅으로’입니다. 그리스어는 ‘다른 민족의 사람들’이라는 뜻이며, 여기서는 블레셋 사람들보다 일반적인 외국 민족들을 가리키는 것으로 보입니다.
    reason: lexical_alternative
