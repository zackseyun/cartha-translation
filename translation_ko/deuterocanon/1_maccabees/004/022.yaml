theological_decisions:
- issue: ἀλλοφύλων의 범위
  chosen_reading: 특정 민족명으로 좁히지 않고 일반적인 외부 민족을 가리키는 표현으로 번역했습니다.
  alternative_readings:
  - 블레셋 사람들의 땅
  - 열방의 땅
  rationale: 본문과 POB 주석이 모두 특정 민족보다 ‘다른 민족들’을 넓게 가리키는 용례를 지시하므로, 역사적·민족적 범위를 과도하게 한정하지 않았습니다.
  doctrine_reference: 역사 서술의 의미 범위 보존
- issue: 도피 동사의 강도
  chosen_reading: ‘도망쳤습니다’로 번역해 급박한 패주를 드러냈습니다.
  alternative_readings:
  - 물러났습니다
  - 피했습니다
  rationale: 단순 이동이나 회피가 아니라 전쟁 패배로 인한 도주를 표현하는 동사 선택이 본문 의도를 가장 잘 전달합니다.
  doctrine_reference: 본문-서사 충실성
