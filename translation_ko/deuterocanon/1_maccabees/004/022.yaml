  source_fidelity: 그리스어 ἔφυγον πάντες εἰς γῆν ἀλλοφύλων은 ‘그들은 모두 다른 민족들의 땅으로 달아났다’라는 뜻입니다. 초안의 ‘도망쳤습니다’는 φεύγω의 의미를 대체로 잘 전달하지만, ἀλλοφύλων은 복수이며 ‘이방인의 땅’은 단수·집합 명사로도 가능하나 원문의 민족적 복수성과 비특정성을 덜 분명히 드러냅니다.
