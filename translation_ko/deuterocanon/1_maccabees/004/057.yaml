  text: And they adorned the front of the temple with golden crowns and small shields[a], and they renewed the gates and the side chambers, and they fitted them with doors.
  footnotes:
  - marker: a
    text: Or 'golden wreaths' or 'golden garlands'; the Greek στεφάνοις can denote ornamental wreaths as well as crowns.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 성전 정면을 금관들[a]과 작은 방패들로 장식하고, 출입구들과 부속 방들을 새롭게 하였으며, 거기에 문을 달았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘금관들’은 장식용 ‘금 화환들’ 또는 ‘금 화환 장식들’로도 옮길 수 있습니다. 그리스어 στεφάνοις는 관뿐 아니라 화환을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεκόσμησαν
  english_pob_choice: adorned
  chosen_korean: 장식하고
  alternatives_korean:
  - 꾸미고
  - 장식하여
  lexicon: LSJ
  rationale: 성전의 외관을 미적으로 꾸미는 뜻을 살려 ‘장식하고’로 옮겼습니다.
- source_word: τὸ κατὰ πρόσωπον τοῦ ναοῦ
  english_pob_choice: the front of the temple
  chosen_korean: 성전 앞면
  alternatives_korean:
