  rationale: 직역에 가깝되 한국어로 자연스럽게 읽히는 ‘앞면’을 선택해 건축적 앞면을 분명히 했습니다.
- source_word: στεφάνοις χρυσοῖς
  english_pob_choice: golden crowns
  chosen_korean: 금관
  alternatives_korean:
  - 황금 관들
  - 황금 화관들
  lexicon: LSJ
  rationale: στεφάνος는 왕관뿐 아니라 장식용 화환도 가리킬 수 있으므로, 본문 맥락상 장식물임을 살리면서 간결한 ‘금관’으로 옮겼습니다.
- source_word: ἀσπιδίσκαις
  english_pob_choice: small shields
  chosen_korean: 작은 방패들
  alternatives_korean:
  - 작은 방패판들
  - 버클러들
  lexicon: LSJ
  rationale: 축소형 의미를 살리되 이해하기 쉬운 표준어로 ‘작은 방패들’을 택했습니다.
- source_word: ἐνεκαίνισαν
  english_pob_choice: renewed
  chosen_korean: 새롭게 하였으며
  alternatives_korean:
  - 수리하였으며
  - 갱신하였으며
  lexicon: LSJ
  rationale: 문과 부속 방들을 다시 손보아 새 상태로 만든 뜻을 반영해 ‘새롭게 하다’로 옮겼습니다.
- source_word: πύλας … παστοφόρια … ἐθύρωσαν αὐτά
  english_pob_choice: the gates and the side chambers … fitted them with doors
  chosen_korean: 문들과 부속 방들
  alternatives_korean:
  - 대문들과 곁방들
  - 문지방들과 측실들
  lexicon: LSJ
  rationale: πύλας와 παστοφόρια의 병렬을 살려 두 대상을 구분했고, ἐθύρωσαν의 결과를 ‘문을 달았습니다’로 자연스럽게 표현했습니다.
