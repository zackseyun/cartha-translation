  text: And they adorned the front of the temple with golden crowns and small shields[a], and they renewed the gates and the side chambers, and they fitted them with doors.
  footnotes:
  - marker: a
    text: Or 'golden wreaths' or 'golden garlands'; the Greek στεφάνοις can denote ornamental wreaths as well as crowns.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 성전 앞면을 금관과 작은 방패들로 장식하고, 문들과 부속 방들을 새롭게 하였으며, 그것들에 문을 달았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: στεφάνοις는 여기서 ‘금관’으로도, 장식용 ‘화환’이나 ‘갈랜드’로도 이해될 수 있습니다.
    reason: lexical_alternative
