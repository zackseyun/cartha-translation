  yaml_path: translation/deuterocanon/1_maccabees/004/059.yaml
  text: And Judas and his brothers and all the assembly of Israel decreed that the days of the dedication of the altar should be observed at their appointed times[a], year by year, for eight days, from the twenty-fifth day of the month Chislev, with gladness and joy.
  footnotes:
  - marker: a
    text: Greek Χασελεύ reflects the Jewish month name often spelled 'Kislev' in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다와 그의 형제들과 온 이스라엘 회중은 제단 봉헌의 날들을 해마다 정해진 때에 여드레 동안, 기슬레브월 스물다섯째 날부터 기쁨과 즐거움으로 지키기로 정하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 Χασελεύ는 유대력 달 이름의 음역이며, 흔히 ‘기슬레브’ 또는 ‘키슬레브’로 표기합니다.
    reason: lexical_alternative
