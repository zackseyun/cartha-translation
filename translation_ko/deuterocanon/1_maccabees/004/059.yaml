  text: And Judas and his brothers and all the assembly of Israel decreed that the days of the dedication of the altar should be observed at their appointed times[a], year by year, for eight days, from the twenty-fifth day of the month Chislev, with gladness and joy.
  footnotes:
  - marker: a
    text: Greek Χασελεύ reflects the Jewish month name often spelled 'Kislev' in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 유다와 그의 형제들과 온 이스라엘 회중은 제단 봉헌일을 해마다 정해진 때에, 곧 여드레 동안, 기슬르월 스물다섯째 날부터 기쁨과 즐거움으로 지키도록 정하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Χασελεύ는 유대력 달 이름으로, 영어의 Kislev에 해당합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησεν
  english_pob_choice: decreed
  chosen_korean: 정하였습니다
  alternatives_korean:
  - 결정하였습니다
  - 법으로 정하였습니다
  - 명령하였습니다
  lexicon: LSJ
  rationale: 공동체가 절기를 제정하는 문맥이므로 단순히 ‘세웠다’보다 규범적 결정을 나타내는 ‘정하다’가 자연스럽고, 영어 POB의 decreed와도 맞습니다.
- source_word: ἐκκλησία
  english_pob_choice: assembly
  chosen_korean: 회중
  alternatives_korean:
  - 총회
  - 집회
  - 교회
  lexicon: LSJ
  rationale: 여기서는 후기 교회 제도가 아니라 이스라엘의 모인 백성을 가리키므로, 교회보다 ‘회중’이 문맥상 정확합니다.
- source_word: ἐνιαυτὸν κατʼ ἐνιαυτὸν
  english_pob_choice: year by year
  chosen_korean: 해마다
  alternatives_korean:
  - 매년
  - 해마다 해마다
  - 매년마다
  lexicon: LSJ
  rationale: 반복 관용구의 의미를 한국어의 자연스러운 시간 표현으로 옮겼습니다.
- source_word: ἀπὸ τῆς πέμπτης καὶ εἰκάδος τοῦ μηνὸς Χασελεὺ
  english_pob_choice: from the twenty-fifth day of the month Chislev
  chosen_korean: 기슬르월 스물다섯째 날부터
  alternatives_korean:
  - 기슬르월 25일부터
  - 기슬르월 스물다섯째 날에 시작하여
  - 키슬레브월 스물다섯째 날부터
  lexicon: LSJ
  rationale: ἀπό의 시작점 의미를 살려 ‘부터’로 옮겼고, חודש Χασελεύ는 유대력 월명으로서 음역해 표기했습니다.
theological_decisions:
- issue: ἡμέρας ἐγκαινισμοῦ τοῦ θυσιαστηρίου의 절기 성격
  chosen_reading: ‘제단 봉헌일’로 옮겨 제단의 재봉헌/봉헌이라는 역사적·예배적 의미를 드러냈습니다.
  alternative_readings:
  - 제단 헌당일
  - 제단 봉헌의 날
  - 제단 낙성일
  rationale: 단순한 기념일이 아니라 제단의 헌납·재봉헌을 가리키므로, 본문이 지닌 성전 정결의 맥락을 흐리지 않는 표현을 선택했습니다.
  doctrine_reference: DOCTRINE.md § 원어 우선, 절기·예배 용어의 역사적 문맥 보존
