  chosen_reading: ‘제단 봉헌일’로 옮겨 제단의 재봉헌/봉헌이라는 역사적·예배적 의미를 드러냈습니다.
  alternative_readings:
  - 제단 헌당일
  - 제단 봉헌의 날
  - 제단 낙성일
  rationale: 단순한 기념일이 아니라 제단의 헌납·재봉헌을 가리키므로, 본문이 지닌 성전 정결의 맥락을 흐리지 않는 표현을 선택했습니다.
  doctrine_reference: DOCTRINE.md § 원어 우선, 절기·예배 용어의 역사적 문맥 보존
