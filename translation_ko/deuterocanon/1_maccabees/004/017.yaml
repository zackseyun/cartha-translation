lexical_decisions:
- source_word: ἐπιθυμήσητε
  english_pob_choice: desire
  chosen_korean: 탐내지 마십시오
  alternatives_korean:
  - 원하지 마십시오
  - 욕심내지 마십시오
  - 갈망하지 마십시오
  lexicon: BDAG
  rationale: 강한 욕망을 나타내므로, 전쟁 상황에서 자연스럽고 경계의 뉘앙스도 살릴 수 있는 ‘탐내다’를 택했습니다.
- source_word: σκύλων
  english_pob_choice: spoils
  chosen_korean: 노략품
  alternatives_korean:
  - 전리품
  - 노획물
  - 약탈물
  lexicon: LSJ
  rationale: 전쟁에서 얻은 물건을 가리키므로, 의미를 분명히 드러내는 ‘노략품’을 사용했습니다.
- source_word: πόλεμος
  english_pob_choice: battle
  chosen_korean: 전투
  alternatives_korean:
  - 전쟁
  - 싸움
  lexicon: LSJ
  rationale: 문맥상 전면적 전쟁보다 눈앞의 군사적 충돌을 가리키므로 ‘전투’가 가장 자연스럽습니다.
- source_word: ἐξ ἐναντίας ἡμῶν
  english_pob_choice: before us
  chosen_korean: 우리 앞에
  alternatives_korean:
  - 우리에게 맞서
  - 우리와 마주하여
  - 우리 앞에
  lexicon: LSJ
  rationale: 직역하면 ‘우리와 마주하여/맞서’이지만, 임박한 대치를 한국어로 간결하게 살려 ‘우리 앞에 있습니다’로 옮겼습니다.
