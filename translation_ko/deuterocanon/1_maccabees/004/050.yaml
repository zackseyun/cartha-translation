  yaml_path: translation/deuterocanon/1_maccabees/004/050.yaml
  text: And they burned incense on the altar[a], and they lit the lamps that were on the lampstand[b], and they shone in the temple.
  footnotes:
  - marker: a
    text: Or 'they shone in the temple.' The Greek verb can be rendered more literally as the lamps shining.
    reason: lexical_alternative
  - marker: b
    text: '''Temple'' here may more specifically denote the sanctuary area.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 제단 위에 향을 피우고, 등잔대 위에 있는 등잔들을 켰으며, 그것들이 성전[b] 안에서 빛났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것들이 성전 안에서 빛을 비추었습니다.’ 헬라어 동사는 등잔들이 빛을 내거나 빛나는 모습을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘성전’은 넓은 건물 전체보다 거룩한 예배 공간, 곧 성소를 더 구체적으로 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθυμίασαν
  english_pob_choice: they burned incense
  chosen_korean: 향을 피우고
  alternatives_korean:
  - 향을 드리고
  - 분향하고
  lexicon: LSJ
  rationale: θυμιάω는 제의적으로 향을 태우는 행위를 가리키므로, 한국어에서는 가장 자연스럽고 구체적인 ‘향을 피우다’로 옮겼습니다.
- source_word: ἐπὶ τὸ θυσιαστήριον
  english_pob_choice: on the altar
  chosen_korean: 제단 위에
  alternatives_korean:
  - 제단에
  - 제단에서
  lexicon: LSJ
  rationale: ἐπί + 대격은 여기서 제의 행위가 제단 표면 위에서 이루어짐을 나타내므로, ‘제단 위에’가 가장 직접적입니다.
- source_word: τοὺς λύχνους τοὺς ἐπὶ τῆς λυχνίας
  english_pob_choice: the lamps that were on the lampstand
  chosen_korean: 등잔대 위에 있는 등잔불
  alternatives_korean:
  - 등잔대 위에 있는 등잔들
  - 등잔대의 등잔불
  lexicon: LSJ
  rationale: λύχνος는 ‘등잔’이지만 문맥상 성전 등잔불의 점화를 가리키므로, ‘등잔대 위에 있는 등잔불’로 풀어 주어 물건과 기능을 함께 드러냈습니다.
- source_word: ἐφαίνοντο
  english_pob_choice: they shone
  chosen_korean: 빛을 비추었습니다
  alternatives_korean:
  - 빛났습니다
  - 비쳤습니다
  lexicon: LSJ
  rationale: 이 동사는 문맥상 등잔들이 실제로 빛을 내는 모습을 뜻하므로, ‘빛을 비추다’로 옮겨 원문의 능동적 조명 의미를 살렸습니다.
theological_decisions:
- issue: ναός의 한국어 범위
  chosen_reading: ‘성전’으로 옮기되, 단순한 건물 전체가 아니라 거룩한 예배 공간이라는 제의적 뉘앙스를 유지했습니다.
  alternative_readings:
  - 성소
  - 성전 뜰
  rationale: ναός는 여기서 성전의 거룩한 내부를 가리키는 문맥이 강하지만, 한국어 독자에게는 ‘성전’이 가장 분명하면서도 과도하게 축소하지 않는 표현입니다.
  doctrine_reference: translation philosophy §§1, 5, 6
