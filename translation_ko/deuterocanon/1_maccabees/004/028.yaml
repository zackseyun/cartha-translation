  lexicon: LSJ
  rationale: ἵππος의 집합적 군사 용법을 한국어 군사어로 자연스럽게 옮겨 ‘기병 오천 명’으로 했습니다.
theological_decisions:
- issue: 전쟁 목적을 나타내는 ὥστε ἐκπολεμῆσαι αὐτούς의 처리
  chosen_reading: ‘그들을 상대로 전쟁을 일으키려 하였습니다’로 옮겨 목적과 공격성을 분명히 드러냈습니다.
  alternative_readings:
  - 그들과 싸우려 하였습니다
  - 그들을 향해 전쟁을 벌이려 하였습니다
  rationale: ἐκπολεμέω의 ‘전쟁을 벌이다/개전하다’라는 강한 의미를 약화하지 않기 위해 단순한 ‘싸우다’보다 전쟁 개시의 뉘앙스를 살렸습니다.
  doctrine_reference: 본문의 군사 서술에 관한 번역 결정
