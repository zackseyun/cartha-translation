  text: And in the following year he assembled sixty thousand chosen men and five thousand cavalry[b][a], so as to make war against them.
  footnotes:
  - marker: a
    text: Or 'in the coming year.' The Greek expression is literally 'in the coming year,' referring to the next year in the narrative sequence.
    reason: lexical_alternative
  - marker: b
    text: Or 'five thousand horsemen.' The Greek uses 'horse' as a military collective.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 다음 해에 그는 선발된 사람 육만 명과 기병 오천 명을 모아, 그들을 상대로 전쟁을 일으키려 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다음 해에’는 그리스어 표현의 문자적 의미인 ‘오는 해에’를 시간 순서에 맞게 자연화한 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘기병’은 그리스어 ἵππος의 군사적 집합 용법을 풀어 옮긴 것으로, 직역하면 ‘말’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ ἐρχομένῳ ἐνιαυτῷ
