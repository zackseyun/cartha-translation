  text: 그들은 얼굴을 땅에 대고 엎드렸으며, 신호용 나팔을 불고[a] 하늘을 향해 외쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘신호들의 나팔들’에 가깝습니다. 문맥상 신호를 보내는 데 쓰는 나팔들을 가리키는 것으로 볼 수 있습니다.
    reason: lexical_alternative
