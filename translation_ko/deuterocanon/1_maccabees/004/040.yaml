  text: And they fell facedown on the ground[a], and they sounded the signal trumpets, and they cried out to heaven.
  footnotes:
  - marker: a
    text: Or, more literally, 'the trumpets of the signals.' The phrase likely refers to trumpets used for signaling rather than to physical standards or banners.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 얼굴을 땅에 대고 엎드렸으며, 신호 나팔들을 불고 하늘을 향해 외쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘신호 나팔들’은 직역하면 ‘신호들의 나팔들’에 가깝지만, 문맥상 신호용으로 사용되는 나팔들을 가리키는 것으로 이해했습니다.
    reason: lexical_alternative
