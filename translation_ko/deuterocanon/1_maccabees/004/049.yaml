base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/049.yaml
  text: And they made new holy vessels[b][a], and they brought the lampstand and the altar of burnt offerings and of incense and the table into the temple.
  footnotes:
  - marker: a
    text: Or 'the altar for burnt offerings and incense.' The Greek places both 'burnt offerings' and 'incense' in relation to 'altar,' though the sense is the familiar pair of temple altars.
    reason: lexical_alternative
  - marker: b
    text: '''Temple'' here refers to the sanctuary building, not the wider temple complex.'
    reason: cultural_note
translation:
  language: ko
  text: 그들은 새 거룩한 기구들을 만들고, 등잔대와 번제물과 향의 제단과 상을 성전 안으로 들여왔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘성전’은 넓은 성전 구역이 아니라 성전 건물, 곧 성소를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 그리스어는 ‘제단’을 단수로 두고 ‘번제물’과 ‘향’을 모두 이에 연결합니다. 문맥상 성전의 번제단과 향단을 함께 가리킬 수도 있으나, 본문은 이를 명시적으로 분리하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ σκεύη τὰ ἅγια καινά
  english_pob_choice: the holy vessels / new
  chosen_korean: 거룩한 기구들을 새것으로
  alternatives_korean:
  - 거룩한 그릇들을 새것으로
  - 성소 기구들을 새로
  lexicon: LSJ
  rationale: σκεύη는 성전 문맥에서 제의용 기구를 뜻하므로 ‘기구들’이 가장 자연스럽고, καινά는 ‘새것으로’로 옮겨 새로 제작되었음을 드러냅니다.
- source_word: τὴν λυχνίαν
  english_pob_choice: the lampstand
  chosen_korean: 등잔대
  alternatives_korean:
  - 등대
  - 등잔
  lexicon: LSJ
  rationale: 성전 기구를 가리키는 λυχνία는 단순한 램프가 아니라 등잔대이므로, 한국어 성경 전통에 널리 쓰이는 ‘등잔대’로 옮겼습니다.
- source_word: τὸ θυσιαστήριον τῶν ὁλοκαυτωμάτων καὶ θυμιαμάτων
  english_pob_choice: the altar of burnt offerings and of incense
  chosen_korean: 번제단과 향단
  alternatives_korean:
  - 번제와 향을 위한 제단
  - 번제와 향의 제단
  lexicon: LSJ
  rationale: 그리스어는 제물과 향을 각각 제단에 연결한 압축 표현이지만, 실제 성전 기구의 익숙한 짝은 ‘번제단’과 ‘향단’이므로 그 의미를 분명하게 살렸습니다.
- source_word: εἰς τὸν ναόν
  english_pob_choice: into the temple
  chosen_korean: 성전 안으로
  alternatives_korean:
  - 성전으로
  - 성소 안으로
  lexicon: LSJ
  rationale: ναός는 성전 건물/성소 영역을 가리키므로, POB의 취지를 따라 ‘성전 안으로’라고 옮겨 단순한 외곽 परिसर가 아니라 안쪽 공간으로 들어갔음을 드러냈습니다.
theological_decisions:
- issue: θυσιαστήριον τῶν ὁλοκαυτωμάτων καὶ θυμιαμάτων의 구조를 어떻게 처리할지
  chosen_reading: 본문의 압축된 제의어법을 따라 ‘번제단과 향단’으로 분리해 옮겼습니다.
  alternative_readings:
  - ‘번제와 향을 위한 제단’으로 하나의 제단으로 묶어 옮김
  - ‘번제의 제단과 향의 제단’으로 풀어 씀
  rationale: 그리스어는 관용적으로 성전의 두 제단을 떠올리게 하는 압축 표현이므로, 과도한 설명을 더하지 않으면서도 실제 예배 기구의 구분을 분명히 하는 번역이 가장 적절합니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
