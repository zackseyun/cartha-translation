  yaml_path: translation/deuterocanon/1_maccabees/004/008.yaml
  text: And Judas said to the men with him[a], “Do not fear their multitude[b], and do not be terrified by their attack.”
  footnotes:
  - marker: a
    text: Or 'their rush' or 'their onset' for 'their attack' (τὸ ὅρμημα αὐτῶν).
    reason: lexical_alternative
  - marker: b
    text: Or 'do not lose courage' for 'do not be terrified' (μὴ δειλωθῆτε).
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 유다는 자기와 함께한 사람들에게 말했습니다. “그들의 수를 두려워하지 마십시오. 그리고 그들의 돌격에 겁먹지 마십시오.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들의 돌격’은 ‘그들의 공격’, ‘그들의 돌진’, ‘그들의 돌입’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘두려워하지 마십시오’는 ‘겁내지 마십시오’ 또는 ‘무서워하지 마십시오’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ φοβεῖσθε
  english_pob_choice: Do not fear
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 무서워하지 마십시오
  - 두려워 말십시오
  lexicon: BDAG
  rationale: φοβέομαι의 직접 금지 명령을 자연스러운 현대 합쇼체로 옮겼습니다. “두려워하지 마십시오”는 감정적 공포를 분명히 전달하면서도 문맥에 맞는 군사적 격려를 살립니다.
- source_word: τὸ πλῆθος αὐτῶν
  english_pob_choice: their multitude
  chosen_korean: 그들의 수
  alternatives_korean:
  - 그들의 많은 수
  - 그들의 무리
  lexicon: LSJ
  rationale: πλῆθος의 핵심은 ‘많은 수/다수’이므로, 전투 맥락에서 자연스럽고 간결한 “그들의 수”로 옮겼습니다. “무리”는 군중 뉘앙스가 강해 다소 좁을 수 있습니다.
- source_word: τὸ ὅρμημα αὐτῶν
  english_pob_choice: their attack
  chosen_korean: 그들의 돌격
  alternatives_korean:
  - 그들의 공격
  - 그들의 돌진
  - 그들의 돌격과 맹세
  lexicon: LSJ
  rationale: ὅρμημα은 ‘돌격, 돌진, 공격적 돌입’의 뜻을 가지므로, 군사적 긴박함과 속도감을 살리는 “돌격”을 택했습니다. English POB의 ‘attack’보다 원어의 역동성이 더 드러납니다.
- source_word: τοῖς ἀνδράσιν τοῖς μετʼ αὐτοῦ
  english_pob_choice: to the men with him
  chosen_korean: 자기와 함께한 사람들에게
  alternatives_korean:
  - 자기와 함께한 남자들에게
  - 자기와 함께한 이들에게
  - 그와 함께한 사람들에게
  lexicon: BDAG
  rationale: ἀνδράσιν은 문자적으로 ‘남자들’이지만, 한국어에서는 군사 집단을 가리킬 때 “사람들”이 더 자연스럽고 문맥상 의미를 충분히 전달합니다. 성별 표지는 원문에 두되, 한국어 가독성을 위해 완곡하게 처리했습니다.
theological_decisions:
- issue: 전투 격려 발화의 명령형 강도
  chosen_reading: 두 개의 부정 명령으로 공포와 위축을 각각 분명히 금지하는 호소로 옮겼습니다.
  alternative_readings:
  - 한 번의 포괄적 위로로 완화할 수 있음
  - 권고형으로 부드럽게 바꿀 수 있음
  rationale: 원문은 φοβεῖσθε와 δειλωθῆτε를 나란히 배치해 두려움과 겁먹음을 각각 금지합니다. 이를 약화시키지 않고, 지도자의 전투 격려라는 긴장을 그대로 유지했습니다.
  doctrine_reference: 본문 이해상 군사적 격려의 수사 유지
- issue: δειλωθῆτε의 의미
  chosen_reading: ‘겁먹다/두려워하다’의 정서적 반응으로 이해하고, 도덕적 비난처럼 들리는 표현은 피했습니다.
  alternative_readings:
  - ‘비겁해지다’로 옮길 수 있음
  - ‘용기를 잃다’로 옮길 수 있음
  rationale: δειλόω는 ‘비겁하다’의 성격을 가질 수 있지만, 여기서는 상황 속 두려움과 주저함을 금지하는 말입니다. 따라서 판단적 어조보다 정서적 반응을 드러내는 번역이 더 적절합니다.
  doctrine_reference: 어휘 의미와 문맥 우선 원칙
