  text: But when they saw these things[a], they were greatly terrified; and when they also saw Judas's camp in the plain, ready for battle,
  footnotes:
  - marker: a
    text: Or 'ready for deployment' or 'ready for battle array'; the Greek military term refers specifically to being drawn up in formation.
