  yaml_path: translation/deuterocanon/1_maccabees/004/021.yaml
  text: But when they saw these things[a], they were greatly terrified; and when they also saw Judas's camp in the plain, ready for battle,
  footnotes:
  - marker: a
    text: Or 'ready for deployment' or 'ready for battle array'; the Greek military term refers specifically to being drawn up in formation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 이것들을 보고 매우 두려워하였습니다. 또한 그들은 평야에 있는 유다의 진영이 전투 대형을 갖추고 있는 것도 보았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘전투 대형을 갖추고 있는’은 그리스어 παράταξις의 군사적 의미를 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ταῦτα συνιδόντες
  english_pob_choice: But when they saw these things
  chosen_korean: 그들이 이것들을 보고
  alternatives_korean:
  - 그들이 이것들을 알아보고
  - 그들이 이것들을 깨닫고
  lexicon: LSJ
  rationale: συνιδόντες는 단순히 ‘보다’보다 ‘알아차리다/인지하다’까지 뜻할 수 있지만, 문맥상 이어지는 군사적 반응을 자연스럽게 드러내기 위해 ‘보고’로 옮기되, 감각적 확인의 의미를 유지했습니다.
- source_word: ἐδειλώθησαν σφόδρα
  english_pob_choice: they were greatly terrified
  chosen_korean: 매우 두려워하였습니다
  alternatives_korean:
  - 몹시 겁먹었습니다
  - 크게 겁을 먹었습니다
  lexicon: LSJ
  rationale: ἐδειλώθησαν은 ‘겁내다, 용기를 잃다’의 뜻이 있어 단순한 공포보다 전투 의지의 위축을 함께 담습니다. ‘매우 두려워하였습니다’는 그 의미를 지나치게 해설하지 않으면서도 강한 공포를 살립니다.
- source_word: ἑτοίμην εἰς παράταξιν
  english_pob_choice: ready for battle
  chosen_korean: 전투 대형을 갖추고 있는
  alternatives_korean:
  - 전투를 위해 준비된
  - 전투 배치를 갖춘
  lexicon: LSJ
  rationale: παράταξις는 일반적 ‘전투’보다 ‘진형/대형, 전열’의 뉘앙스가 강하므로, POB 각주가 지적한 군사적 의미를 반영해 ‘전투 대형’을 택했습니다.
- source_word: ἐν τῷ πεδίῳ
  english_pob_choice: in the plain
  chosen_korean: 평야에 있는
  alternatives_korean:
  - 평야에
  - 들판에 있는
  lexicon: LSJ
  rationale: πεδίον은 구릉이 없는 넓은 평지를 가리키므로 ‘평야’가 가장 직접적입니다. 문장 안에서는 위치를 자연스럽게 살리기 위해 ‘평야에 있는’으로 풀었습니다.
