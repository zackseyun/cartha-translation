lexical_decisions:
- source_word: ἤκουσεν
  english_pob_choice: heard
  chosen_korean: 이 일을 듣고
  alternatives_korean:
  - 듣고
  - 소식을 듣고
  lexicon: LSJ
  rationale: 군사 서술에서 ἀκούω는 단순 청취보다 소식을 접했다는 뜻이 자연스럽지만, 본문에 별도의 목적어가 없으므로 한국어도 간결하게 처리했습니다.
- source_word: ἀπῆρεν
  english_pob_choice: set out
  chosen_korean: 출발했습니다
  alternatives_korean:
  - 떠났습니다
  - 진군했습니다
  - 나섰습니다
  lexicon: LSJ
  rationale: 전투를 향한 목적 있는 이동을 나타내므로, 과도하게 군사화하지 않으면서도 행동 개시를 분명히 하는 ‘출발했습니다’가 적절합니다.
- source_word: οἱ δυνατοί
  english_pob_choice: the mighty men
  chosen_korean: 용사들이
  alternatives_korean:
  - 강한 자들이
  - 유력한 자들이
  - 힘센 사람들
  lexicon: LSJ
  rationale: 직역하면 ‘강한 자들’이지만, 문맥상 유다와 함께한 전투 인원을 가리키므로 한국어에서는 자연스러운 군사적 표현인 ‘용사들’로 옮겼습니다.
- source_word: τὴν δύναμιν τοῦ βασιλέως τὴν ἐν Ἐμμαούμ
  english_pob_choice: the king’s force that was at Emmaus
  chosen_korean: 에마오에 있는 왕의 군대
  alternatives_korean:
  - 에마오에 주둔한 왕의 군대
  - 에마오에 있던 왕의 군대
  - 왕의 병력
  lexicon: LSJ
  rationale: δύναμις는 여기서 군사력보다 실제 병력을 가리키므로 ‘군대’로 옮겼고, 위치를 나타내는 ἐν Ἐμμαούμ은 자연스럽게 ‘에마오에 있는’으로 처리했습니다.
