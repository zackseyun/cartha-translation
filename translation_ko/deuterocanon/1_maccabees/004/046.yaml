translation:
  language: ko
  text: 그들은 돌들을 성전 언덕의 알맞은 곳에 두어 놓고, 예언자가 와서 그것들에 대해 대답할 때까지 기다렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘집의 산’이며, 곧 성전 산 또는 성전 언덕을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθεντο
  english_pob_choice: set ... aside
  chosen_korean: 두어 놓고
  alternatives_korean:
  - 따로 두고
  - 치워 두고
  - 보관해 두고
  lexicon: BDAG
  rationale: 임시로 옮겨 두어 나중 처리를 기다리게 하는 뜻을 자연스러운 현대 한국어로 살렸습니다.
- source_word: ἐν τῷ ὄρει τοῦ οἴκου
  english_pob_choice: on the temple hill
  chosen_korean: 성전 언덕
  alternatives_korean:
  - 성전 산
  - 성전의 산
  - 성전 산지
  lexicon: LEH
  rationale: 직역하면 ‘집의 산’이지만, 문맥상 성전 산지를 가리키므로 의미를 드러내는 ‘성전 언덕’으로 옮겼습니다.
- source_word: ἐν τόπῳ ἐπιτηδείῳ
  english_pob_choice: in a suitable place
  chosen_korean: 알맞은 곳
  alternatives_korean:
  - 적절한 곳
  - 합당한 곳
  - 편리한 곳
  lexicon: BDAG
  rationale: 장소의 적합성을 말하는 표현이므로, 과도하게 평가적이거나 기술적이지 않은 ‘알맞은 곳’이 가장 자연스럽습니다.
- source_word: τοῦ ἀποκριθῆναι περὶ αὐτῶν
  english_pob_choice: to give an answer concerning them
  chosen_korean: 그것들에 대해 대답할 때까지
  alternatives_korean:
  - 그것들에 대해 답할 때까지
  - 그것들에 관해 응답할 때까지
  - 그것들에 대해 판정할 때까지
  lexicon: BDAG
  rationale: ἀποκριθῆναι의 기본 의미인 ‘대답하다’를 살리고, περὶ αὐτῶν의 ‘그것들에 관해’를 자연스럽게 풀어 옮겼습니다.
theological_decisions:
- issue: 예언자의 역할을 어떤 뉘앙스로 옮길 것인가
  chosen_reading: 미래의 예언자가 와서 돌들에 대해 대답하는 권위 있는 안내를 줄 것으로 기다리는 표현으로 유지했습니다.
  alternative_readings:
  - 법적 판결을 내릴 예언자를 기다리는 뜻으로 좁혀 번역할 수 있습니다.
  - 단순히 결정을 미루는 관용구로 완화해 번역할 수 있습니다.
  rationale: 본문은 예언자의 도착과 그가 ‘대답할’ 것을 분명히 말하지만, 그 기능을 법적 판결로 단정하지도, 단순한 지연 표현으로 약화시키지도 않습니다. 따라서 긴장을 보존했습니다.
  doctrine_reference: 예언적 분별과 권위의 문제를 본문 수준에서 보존합니다.
