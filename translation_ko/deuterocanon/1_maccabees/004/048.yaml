base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/048.yaml
  text: And they rebuilt the sanctuary and the interior of the house[b][a], and they consecrated the courts.
  footnotes:
  - marker: a
    text: Or 'the holy place' for 'the sanctuary'; the Greek τὰ ἅγια can denote the sacred area of the temple.
    reason: lexical_alternative
  - marker: b
    text: '''House'' here refers to the temple building.'
    reason: cultural_note
translation:
  language: ko
  text: 그들은 성소와 집 안쪽을 재건하고, 뜰들을 거룩하게 구별하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거룩한 곳’; 그리스어 τὰ ἅγια는 성전의 신성한 구역을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 여기서 ‘집’은 성전 건물을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: ᾠκοδόμησαν
  english_pob_choice: rebuilt
  chosen_korean: 재건하고
  alternatives_korean:
  - 건축하고
  - 복구하고
  lexicon: LSJ
  rationale: 파괴되거나 더럽혀진 성전 공간을 다시 세운 맥락이므로, 단순한 ‘건축’보다 ‘재건’이 복원과 재건축의 뜻을 함께 살립니다.
- source_word: τὰ ἅγια
  english_pob_choice: the sanctuary
  chosen_korean: 성소
  alternatives_korean:
  - 거룩한 곳
  - 성전
  lexicon: LSJ
  rationale: 성전 문맥에서 τὰ ἅγια는 ‘거룩한 것들’보다 신성한 공간인 ‘성소’로 옮기는 것이 구획된 성전 영역의 의미를 더 분명히 드러냅니다.
- source_word: τὰ ἐντὸς τοῦ οἴκου
  english_pob_choice: the interior of the house
  chosen_korean: 집 안쪽
  alternatives_korean:
  - 집의 내부
  - 성전 안쪽
  lexicon: LSJ
  rationale: οἶκος를 직역해 ‘집’으로 두되, 공간성을 살리기 위해 ‘안쪽’으로 옮겨 성전 건물 내부라는 뜻을 자연스럽게 드러냈습니다.
- source_word: τὰς αὐλάς
  english_pob_choice: the courts
  chosen_korean: 뜰들
  alternatives_korean:
  - 마당들
  - 뜰
  lexicon: LSJ
  rationale: 성전 건축 용례에서 αὐλαί는 복수의 ‘뜰’ 또는 ‘뜰들’이 가장 자연스럽고, 성전 외곽의 구획된 공간이라는 의미를 보존합니다.
- source_word: ἡγίασαν
  english_pob_choice: consecrated
  chosen_korean: 거룩하게 구별하였습니다
  alternatives_korean:
  - 봉헌하였습니다
  - 성별하였습니다
  lexicon: LSJ
  rationale: ἁγιάζω의 핵심은 의례적으로 하나님께 속하도록 따로 떼어 놓는 것이므로, ‘거룩하게 구별하다’가 제의적 헌납과 구별의 뜻을 함께 보여 줍니다.
theological_decisions:
- issue: τὰ ἅγια의 공간성 유지
  chosen_reading: ‘성소’로 옮겨, 성전의 특정 구역을 가리키는 공간 의미를 살렸습니다.
  alternative_readings:
  - ‘거룩한 곳’으로 옮길 수 있습니다.
  - ‘거룩한 것들’로 이해할 수 있습니다.
  rationale: 이 절은 성전의 여러 부분을 병렬로 열거하므로, τὰ ἅγια를 물건이 아니라 성전 공간으로 읽어야 문맥이 흐트러지지 않습니다.
  doctrine_reference: '번역 원리: 원문 우선, 문맥에 따른 공간/대상 구분'
