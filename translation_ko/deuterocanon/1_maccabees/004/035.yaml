  naturalness: 합쇼체 서술은 적절합니다. 다만 ‘사느냐 죽느냐를 막론하고 고상하게 맞설 준비’는 현대 한국어에서 의미 연결이 부자연스럽고, 생사 어느 쪽에나 ‘맞서다’를 덧붙이는 결과가 됩니다. 또한 각주 표지는 해당 어구 바로 뒤에 두는 편이 독자에게 명확합니다.
