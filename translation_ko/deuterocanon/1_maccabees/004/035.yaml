base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/035.yaml
  text: But when Lysias saw the rout that had happened to his own force[a], and the boldness that had arisen in Judas’s men, and how they were ready either to live or to die nobly, he departed for Antioch, and recruited foreign troops, intending, after becoming stronger in number[b], to come again into Judea.
  footnotes:
  - marker: a
    text: Greek literally, 'the boldness of Judas'; the sense in context is the courage of Judas's side or forces, since the next clause uses the plural 'they were ready.'
    reason: lexical_alternative
  - marker: b
    text: Or 'recruited mercenaries.' The Greek verb emphasizes enlisting foreigners; whether they are specifically mercenaries is an interpretive refinement.
    reason: alternative_reading
translation:
  language: ko
  text: 그런데 리시아스가 자기 군대에 일어난 패주와 유다 쪽에서 일어난 담대함을 보고, 그들이 사느냐 죽느냐를 막론하고 고상하게 맞설 준비가 되어 있음을 보고는 안티오키아로 떠나 외국 병력을 모았으며, 수적으로 다시 더 강해진 뒤에 유대로 다시 오려고 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 직역하면 ‘유다의 담대함’이지만, 바로 뒤 절이 복수 주어를 사용하므로 여기서는 유다 편의 군사적 담대함을 가리키는 것으로 이해했습니다.
    reason: lexical_alternative
  - marker: b
    text: ἐξενολόγει는 엄밀히는 ‘외국인을 모집하다’는 뜻이어서, 구체적으로 ‘용병’인지 여부는 해석을 더한 표현입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: τὴν γενομένην τροπὴν τῆς αὐτοῦ συντάξεως
  english_pob_choice: the rout that had happened to his own force
  chosen_korean: 자기 군대에 일어난 패주
  alternatives_korean:
  - 자기 부대에 일어난 패배
  - 자기 진형에 일어난 패주
  lexicon: LSJ
  rationale: 군사 문맥에서 τροπή는 단순한 패배보다 ‘패주’가 더 직접적이며, συντάξις는 여기서 부대/군대의 편성과 전열을 가리키므로 자연스러운 한국어로 ‘자기 군대’로 옮겼습니다.
- source_word: τῆς δὲ Ἰούδα τὸ γεγενημένον θάρσος
  english_pob_choice: the boldness that had arisen in Judas’s men
  chosen_korean: 유다 쪽에서 일어난 담대함
  alternatives_korean:
  - 유다에게서 일어난 담대함
  - 유다의 담대함
  lexicon: LSJ
  rationale: 그리스어는 축약되어 있지만 다음 절의 복수 대명사와 연결되므로, 담대함의 주체가 유다 개인이 아니라 그의 편에 있음을 드러내기 위해 ‘유다 쪽에서’로 풀었습니다.
- source_word: ἕτοιμοι εἶεν ἢ ζῆν ἢ τεθνάναι γενναίως
  english_pob_choice: they were ready either to live or to die nobly
  chosen_korean: 그들이 사느냐 죽느냐를 막론하고 고상하게 맞설 준비가 되어 있음을
  alternatives_korean:
  - 그들이 살든 죽든 고귀하게 준비되어 있음을
  - 그들이 살거나 죽거나 용감하게 있을 준비가 되어 있음을
  lexicon: LSJ
  rationale: ἕτοιμοι εἶεν과 대칭 구조를 살리면서, γενναίως는 단순한 용기보다 명예로운 태도를 포함하므로 ‘고상하게’로 옮겼습니다. ‘맞설’은 상황상 생사 앞에서의 결연한 자세를 드러내기 위한 표현입니다.
- source_word: ἐξενολόγει
  english_pob_choice: recruited foreign troops
  chosen_korean: 외국 병력을 모았으며
  alternatives_korean:
  - 외국인 용병을 모집했으며
  - 외국 병사들을 징집했으며
  lexicon: LSJ
  rationale: 동사는 외국인을 끌어모으는 뜻이 핵심이므로, POB의 해설대로 용병으로 단정하지 않고 ‘외국 병력’으로 옮겼습니다.
- source_word: πλεοναστὸν πάλιν γενηθέντα
  english_pob_choice: after becoming stronger in number
  chosen_korean: 수적으로 다시 더 강해진 뒤에
  alternatives_korean:
  - 다시 수적으로 많아진 뒤에
  - 병력이 다시 증가한 뒤에
  lexicon: LSJ
  rationale: 표현은 수적 증대를 가리키므로, 재차 돌아오는 군사 의도를 살려 ‘수적으로 다시 더 강해진 뒤에’로 자연스럽게 표현했습니다.
