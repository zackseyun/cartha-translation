translation:
  language: ko
  text: 그리고 이것은 그 문서의 사본입니다. 엘룰월 18일, 제172년, 곧 시몬 대제사장 재임 셋째 해에,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντίγραφον
  english_pob_choice: copy
  chosen_korean: 사본
  alternatives_korean:
  - 복사본
  - 문서 사본
  lexicon: LSJ
  rationale: 공식 문서의 복제본이라는 뜻을 살리면서도 현대 한국어에서 자연스럽게 읽히는 표현으로 옮겼습니다.
- source_word: γραφῆς
  english_pob_choice: writing
  chosen_korean: 문서
  alternatives_korean:
  - 기록
  - 글
  lexicon: LSJ
  rationale: 여기서는 성경의 ‘기록’이 아니라 행정·공식 문서를 가리키므로, 오해를 피하려고 ‘문서’로 옮겼습니다.
- source_word: Ὀκτωκαιδεκάτῃ Ἐλοὺλ
  english_pob_choice: the eighteenth of Elul
  chosen_korean: 엘룰월 십팔일
  alternatives_korean:
  - 엘룰의 십팔일
  - 엘룰월 18일
  lexicon: LSJ
  rationale: 달 이름은 음역하고, 날짜는 한국어 관용에 맞게 ‘십팔일’로 풀어 달력 표기를 자연스럽게 했습니다.
- source_word: ἔτους δευτέρου ἑβδομηκοστοῦ καὶ ἑκατοστοῦ
  english_pob_choice: in the one hundred seventy-second year
  chosen_korean: 제백칠십이년
  alternatives_korean:
  - 백칠십이년
  - 제172년
  lexicon: LSJ
  rationale: 연대기 공식에서 ‘one hundred seventy-second year’에 해당하므로 서술형 숫자 대신 연호적 느낌이 나는 ‘제백칠십이년’을 사용했습니다.
- source_word: ἐπὶ Σίμωνος τοῦ ἀρχιερέως
  english_pob_choice: under Simon the high priest
  chosen_korean: 시몬 대제사장 아래서
  alternatives_korean:
  - 시몬 대제사장 시대에
  - 시몬 대제사장 때
  lexicon: LSJ
  rationale: ἐπί + 속격의 연대기 용법을 반영해 통치·직임 아래 있던 시기를 나타내는 ‘아래서’를 사용했습니다.
theological_decisions:
- issue: 문서의 성격을 나타내는 γραφή의 처리
  chosen_reading: ‘문서’로 옮겨 공식 기록임을 드러냈습니다.
  alternative_readings:
  - ‘글’로 직역
  - ‘기록’으로 완화
  rationale: 이 구절은 성경 본문 일반이 아니라 행정적 서한의 머리말이므로, 신학적 오독을 피하기 위해 문서성에 초점을 맞추는 번역이 더 적절합니다.
  doctrine_reference: 원문 우선 원칙과 장르 보존
