  text: The envoys who had been sent to our people reported to us about your glory and honor[a], and we rejoiced at their arrival.
  footnotes:
  - marker: a
    text: Or 'The embassy/delegation that had been sent to our people reported to us …' The Greek οἱ πρεσβεῖαι can be understood either for the mission itself or for the envoys as persons; the latter is reflected in the main text because the verse continues with 'their arrival.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리 백성에게 파견되었던 사절들이 여러분의 영광과 명예에 관하여 우리에게 보고하였고, 우리는 그들이 온 것을 기뻐했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 οἱ πρεσβεῖαι는 ‘사절들’ 외에 ‘사절단들’ 또는 ‘외교 사절단’으로도 이해될 수 있습니다. 여기서는 뒤에 그들의 도착을 언급하는 문맥에 따라 사람을 가리키는 뜻으로 옮겼습니다.
    reason: lexical_alternative
