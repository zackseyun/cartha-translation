base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/035.yaml
  text: And the people saw the faithfulness of Simon and the glory that he had purposed to bring about for his nation[a], and they appointed him as their leader and high priest, because he had done all these things, and because of the righteousness and the faithfulness that he had maintained for his nation[b], and because he had sought in every way to exalt his people.
  footnotes:
  - marker: a
    text: Or 'faithfulness' in both occurrences of 'faith'; the Greek πίστις can denote reliability or fidelity as well as faith.
    reason: lexical_alternative
  - marker: b
    text: Or 'justice' for 'righteousness'; the Greek δικαιοσύνη can carry a civic or ethical sense here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 백성은 시몬의 신실함[a]과 그가 자기 민족을 위해 이루려고 뜻한 영광을 보았습니다. 그래서 그들은 그가 이 모든 일을 하고, 자기 민족을 위해 의[b]와 신실함[a]을 지켜 왔으며, 자기 백성을 높이기 위해 온갖 방법으로 힘썼으므로 그를 자기들의 지도자와 대제사장으로 세웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘믿음’ 또는 ‘충성’. 그리스어 πίστις는 여기서 신뢰성, 신실함, 충성의 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘정의’. 그리스어 δικαιοσύνη는 여기서 시민적·윤리적 의미를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστιν
  english_pob_choice: faithfulness
  chosen_korean: 충성됨
  alternatives_korean:
  - 믿음
  - 신실함
  lexicon: BDAG
  rationale: 이 문맥에서는 단순한 내적 ‘믿음’보다 시몬이 민족에 대해 보여 준 신뢰성·충성의 성격이 강하므로, POB의 개정 취지에 맞춰 ‘충성됨’으로 옮겼습니다.
- source_word: δόξαν
  english_pob_choice: glory
  chosen_korean: 영광
  alternatives_korean:
  - 명예
  - 영예
  lexicon: LSJ
  rationale: δόξα는 명예·평판·영광을 아우르지만, 본문이 민족을 위해 의도한 높임의 가치를 말하므로 ‘영광’이 가장 넓고 자연스럽습니다.
- source_word: ἡγούμενον
  english_pob_choice: leader
  chosen_korean: 지도자
  alternatives_korean:
  - 인도자
  - 통치자
  lexicon: LSJ
  rationale: ἡγούμενος는 이끌어 가는 자라는 넓은 뜻이어서, 직책을 과도하게 특정하지 않는 ‘지도자’가 적절합니다.
- source_word: δικαιοσύνην
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 정의
  - 공의
  lexicon: BDAG
  rationale: 이 용례는 민족을 위한 올바름과 신실한 처신을 함께 가리킬 수 있으므로, POB 기본어인 ‘의’를 유지했습니다.
- source_word: ἀρχιερέα
  english_pob_choice: high priest
  chosen_korean: 대제사장
  alternatives_korean:
  - 수제사장
  lexicon: LSJ
  rationale: 유대 제의 직분을 가리키는 표준 대응어로 ‘대제사장’이 가장 분명합니다.
theological_decisions:
- issue: πίστις를 덕목 묘사로 어떻게 옮길지
  chosen_reading: 충성됨
  alternative_readings:
