  text: καὶ εἶδεν ὁ λαὸς τὴν πίστιν τοῦ Σίμωνος καὶ τὴν δόξαν ἣν ἐβουλεύσατο ποιῆσαι τῷ ἔθνει αὐτοῦ, καὶ ἔθεντο αὐτὸν ἡγούμενον αὐτῶν καὶ ἀρχιερέα, διὰ τὸ πεποιηκέναι αὐτὸν ταῦτα πάντα, καὶ τὴν δικαιοσύνην καὶ τὴν πίστιν ἣν συνετήρησεν τῷ ἔθνει αὐτοῦ, καὶ ἐζήτησεν παντὶ τρόπῳ ὑψῶσαι τὸν λαὸν αὐτοῦ.
