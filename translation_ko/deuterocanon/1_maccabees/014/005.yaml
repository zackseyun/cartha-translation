  yaml_path: translation/deuterocanon/1_maccabees/014/005.yaml
  text: And with all his glory he took Joppa as a harbor[a], and made it an access point to the islands of the sea.
  footnotes:
  - marker: a
    text: Or 'made an entrance to the islands of the sea.' The Greek expression can be rendered more literally, but here it likely means that Joppa served as a point of access for maritime connections.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 온갖 영광을 누리며 야포를 차지하여 항구로 삼고, 바다의 섬들로 가는 길목을 마련하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바다의 섬들로 들어가는 입구를 만들었습니다’로 옮길 수 있습니다. 그리스어 ‘입구’는 문자적인 출입구라기보다 야포가 해상 교통을 통해 섬들에 이르는 접근 지점이 되었음을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ πάσης τῆς δόξης αὐτοῦ
  english_pob_choice: with all his glory
  chosen_korean: 자신의 모든 영광 가운데에서
  alternatives_korean:
  - 자신의 모든 splendor 가운데에서
  - 자신의 모든 존귀 가운데에서
  - 그의 모든 영광과 함께
  lexicon: LSJ
  rationale: δόξα는 여기서 위신과 영화로움을 함께 담는 높임의 표현이므로, 과도하게 좁히지 않고 ‘모든 영광 가운데에서’로 살렸습니다.
- source_word: ἔλαβεν
  english_pob_choice: took
  chosen_korean: 점령하고
  alternatives_korean:
  - 취하고
  - 가져가고
  - 차지하고
  lexicon: LSJ
  rationale: 도시 야포를 다루는 역사 서술 문맥에서는 단순한 ‘가져가다’보다 점유·장악의 뉘앙스가 살아 있는 ‘점령하다’가 더 자연스럽습니다.
- source_word: εἰς λιμένα
  english_pob_choice: as a harbor
  chosen_korean: 항구로
  alternatives_korean:
  - 항구로서
  - 항구가 되도록
  - 항만으로
  lexicon: LSJ
  rationale: εἰς + 목적/결과 용법을 반영해 야포가 ‘항구로 기능하게’ 되었다는 뜻을 간결하게 드러냈습니다.
- source_word: ἐποίησεν εἴσοδον ταῖς νήσοις τῆς θαλάσσης
  english_pob_choice: made it an access point to the islands of the sea
  chosen_korean: 그것을 바다의 섬들로 가는 진입로로 만들었습니다
  alternatives_korean:
  - 그것을 바다의 섬들로 들어가는 입구로 만들었습니다
  - 그것을 바다의 섬들을 위한 접근점으로 만들었습니다
  - 그것을 바다의 섬들로 가는 길목으로 만들었습니다
  lexicon: LSJ
  rationale: εἴσοδος는 문자적으로 ‘들어감/입구’이지만, POB의 의미를 따라 해상 연결의 기능을 드러내는 ‘진입로’로 옮겼습니다.
