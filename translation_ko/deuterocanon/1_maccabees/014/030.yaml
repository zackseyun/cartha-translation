  source_fidelity: 본문은 세 동사(‘모았다/되었다/더해졌다’)와 대제사장 직분을 대체로 충실히 옮겼습니다. 다만 각주 표지가 첫 절 뒤에 붙어 있어, 죽음을 암시하는 마지막 관용구가 아니라 ‘민족’을 수식하는 것처럼 보입니다. 이는 원문 및 영어 감사 기록의 각주 대상과 맞지 않습니다.
  naturalness: ‘그들의 민족을 모았고’는 이해할 수 있으나 현대 한국어에서는 다소 어색하고, ‘그들의 민족’은 민족 정체성 자체를 가리키는 듯 들릴 수 있습니다. ‘그들의 민족을 결집시켰고’가 집단을 모았다는 뜻을 더 자연스럽게 전달합니다. ‘자기 백성에게로 더해졌습니다’는 원문의 비유를 유지하면서 방향성을 자연스럽게 나타냅니다.
  terminology: ‘대제사장’은 ἀρχιερεύς에 대한 적절한 표준 용어입니다. ἔθνος와 λαός의 구별은 본문에서 각각 ‘민족’과 ‘백성’으로 유지했습니다. 각주는 προσετέθη πρὸς τὸν λαὸν αὐτοῦ의 죽음 관용을 설명하되, 본문에 없는 교리적 의미를 덧붙이지 않습니다.
