lexical_decisions:
- source_word: ἠθροισεν
  english_pob_choice: gathered
  chosen_korean: 모았고
  alternatives_korean:
  - 모으고
  - 집결시켰고
  lexicon: LSJ
  rationale: ἀθροίζω의 기본 뜻인 '모으다, 집합시키다'를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: τὸ ἔθνος αὐτῶν
  english_pob_choice: their nation
  chosen_korean: 그들의 민족
  alternatives_korean:
  - 그들의 나라
  - 그들의 백성
  lexicon: LSJ
  rationale: ἔθνος는 문맥상 공동체 전체를 가리키므로, '민족'이 POB의 'nation'에 가장 가깝고 정치·공동체적 뉘앙스를 살립니다.
- source_word: ἐγενήθη ... ἀρχιερεύς
  english_pob_choice: became their high priest
  chosen_korean: 그들의 대제사장이 되었으며
  alternatives_korean:
  - 그들의 대제사장으로 세움을 받았으며
  - 그들의 대제사장으로 봉사하였으며
  lexicon: LSJ
  rationale: ἐγενήθη는 상태 변화의 '되다'로 옮기는 것이 자연스럽고, ἀρχιερεύς는 표준적인 '대제사장'이 적절합니다.
- source_word: προσετέθη πρὸς τὸν λαὸν αὐτοῦ
  english_pob_choice: was added to his people
  chosen_korean: 자기 백성에게 더해졌습니다
  alternatives_korean:
  - 자기 백성에게 모셔졌습니다
  - 자기 백성에게 모인 것으로 여겨집니다
  lexicon: LSJ
  rationale: POB의 본문처럼 원문의 이미지를 보존해 '더해졌습니다'로 옮기고, 관용적 죽음 표현은 각주로 남겼습니다.
theological_decisions:
- issue: προσετέθη πρὸς τὸν λαὸν αὐτοῦ의 관용구 처리
  chosen_reading: 본문은 직역 이미지인 '더해졌습니다'를 유지하고, 각주로 '자기 백성에게 모여들었다/거두어졌다'는 죽음의 관용을 안내합니다.
  alternative_readings:
  - 자기 백성에게 모였습니다
  - 죽어 자기 백성에게로 갔습니다
  rationale: 원문의 표현과 POB의 감사 가능한 해석을 함께 보존하기 위해 본문은 직역성을 유지하고, 독자의 이해를 돕는 관용적 의미를 각주로 처리합니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it; §6 Readable modern English, not archaic or academic
