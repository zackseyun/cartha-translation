  - severity: low
    issue: 각주의 대안 표현 ‘거두어졌다’는 한국어에서 이 관용구의 의미를 충분히 분명히 드러내지 못합니다.
    rationale: ‘자기 백성에게로 모아졌다’와 ‘죽음을 가리키는 성경의 관용적 표현’이라는 설명이 원문의 이미지를 더 가깝게 보존합니다.
