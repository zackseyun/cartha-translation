  lexicon: LSJ
  rationale: Greek 지명 Ἰόππη의 음역을 따르되, 한국어 성경 전통에서 널리 알려진 야포를 사용해 원문과 가독성을 함께 살렸습니다.
- source_word: ὠχύρωσεν
  english_pob_choice: fortified
  chosen_korean: 견고하게 하였는데
  alternatives_korean:
