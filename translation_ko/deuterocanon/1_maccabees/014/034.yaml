  - 성벽을 쌓았는데
  - 강화하였는데
  lexicon: LSJ
  rationale: 도시를 군사적으로 안전하게 만든다는 뜻을 살리되, 한국어에서 자연스럽고 과장되지 않은 표현으로 옮겼습니다.
- source_word: τὴν ἐπὶ τῆς θαλάσσης / τὴν ἐπὶ τῶν ὁρίων Ἀζώτου
  english_pob_choice: which is by the sea / which is on the borders of Azotus
  chosen_korean: 바닷가에 있는 / 아소도 경계에 있는
  alternatives_korean:
  - 바다에 있는 / 아소도의 경계에 있는
  - 바닷가에 위치한 / 아소도 경계에 위치한
  lexicon: LSJ
  rationale: 지리적 위치를 그대로 드러내는 관계절 구조를 유지하여, 원문의 간결한 설명을 한국어에서도 보존했습니다.
- source_word: Γάζαραν
  english_pob_choice: Gazara
  chosen_korean: 가자라
  alternatives_korean:
  - 게셀
  - 게자르
  lexicon: LSJ
  rationale: 그리스어 본문이 가자라 형태를 쓰므로 이를 직접 음역했습니다. 영어 주석의 Gezer 대안은 여기서 정규화하지 않았습니다.
- source_word: ἐπανόρθωσιν
  english_pob_choice: restoration
  chosen_korean: 회복
  alternatives_korean:
  - 재건
  - 복구
  - 재설립
  lexicon: LSJ
  rationale: ἐπανόρθωσις는 다시 바로잡아 세운다는 뜻을 가지므로, 문맥상 사람과 거점의 회복을 함께 아우를 수 있는 ‘회복’이 가장 무난합니다.
theological_decisions:
- issue: Ἰουδαίους의 공동체 정체성 표현
  chosen_reading: 유다 사람들
  alternative_readings:
  - 유대인들
  - 유다인들
  rationale: 1 마카베오에서는 민족·지역·신앙 정체성이 겹치므로, 현대 한국어에서 특정 종교집단으로만 좁히는 인상을 줄 수 있는 표현보다 본문 맥락을 살린 ‘유다 사람들’을 택했습니다.
  doctrine_reference: 역사서 맥락의 민족-지역 정체성 보존
- issue: τὸ πρότερον ἐκεῖ οἱ πολέμιοι의 시간·장소 관계
  chosen_reading: 거기에는 전에 적들이 살고 있었습니다
  alternative_readings:
  - 거기에는 전에 적들이 있었습니다
  - 그곳은 전에 적들의 거주지였습니다
  rationale: οἱ πολέμιοι는 단순한 감정적 적대가 아니라 실제로 그곳에 거주하던 대적 집단을 가리키므로, ‘살고 있었습니다’로 장소 점유의 뉘앙스를 드러냈습니다.
  doctrine_reference: 문맥 기반 역사 서술
