base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/034.yaml
  text: And he fortified Joppa[a], which is by the sea, and Gazara, which is on the borders of Azotus, where the enemies had formerly lived; and he settled Jews there[b], and placed in them whatever was needed for their restoration.
  footnotes:
  - marker: a
    text: Or 'Gezer' for 'Gazara,' reflecting a more familiar Hebrew-associated place name; the Greek source here reads 'Gazara.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'for their restoration' may refer to the reestablishment of these places or of the Jewish communities settled in them; the Greek wording is concise and allows either nuance.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 바닷가에 있는 야포와, 아소도 경계에 있는 가자라를 견고하게 하였는데, 거기에는 전에 적들이 살고 있었습니다. 또 그곳에 유다 사람들을 정착시키고, 그들의 회복에 필요한 것들을 그들에게 마련해 두었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가자라’는 그리스어 본문 형태를 따른 음역입니다. 더 익숙한 히브리어 연계 지명 ‘게셀’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘회복’은 그곳의 재건뿐 아니라 그곳에 정착한 유다 공동체의 재정비까지 아우를 수 있는 표현입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰόππην
  english_pob_choice: Joppa
  chosen_korean: 야포
  alternatives_korean:
