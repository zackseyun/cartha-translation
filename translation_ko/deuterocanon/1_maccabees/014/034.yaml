  source_fidelity: 전반적으로 원문의 도시 강화, 적들의 이전 거주, 유다인 정착 및 회복을 위한 필요 물자 제공이라는 흐름을 충실히 반영합니다. 다만 ὠχύρωσεν은 단순히 ‘견고하게 하다’보다 도시의 방어를 강화한다는 뜻이 분명하므로 ‘요새화하다’가 더 정확합니다. 또한 ἐν αὐτοῖς는 직전의 Ἰουδαίους(유다인들)를 가리킬 수 있으므로, 현재의 ‘그들에게’는 가능한 해석입니다.
  naturalness: ‘유다 사람들’은 현대 표준 한국어 성경 문체에서 다소 어색하고 지리적 출신만을 뜻하는 인상을 줄 수 있습니다. 이 역사적·집단적 맥락에서는 ‘유대인들’이 자연스럽고 통용되는 표현입니다. 문장을 둘로 나누어 합쇼체의 서술 흐름도 자연스럽게 다듬었습니다.
