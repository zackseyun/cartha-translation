base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/022.yaml
  text: 'And after recording in the public records what had been said by them[a], thus: “Numenius son of Antiochus and Antipater son of Jason, ambassadors of the Jews[c][b], came to us renewing their friendship with us.”'
  footnotes:
  - marker: a
    text: The Greek text as transmitted here includes an isolated alpha before 'Jews' (Α Ἰουδαίων), likely a scribal or editorial artifact rather than a meaningful word; the translation follows the clear sense, 'ambassadors of the Jews.'
    reason: textual_variant
  - marker: b
    text: Or 'in the resolutions/councils of the people.' The Greek expression likely refers to official civic documentation rather than merely oral deliberation.
    reason: lexical_alternative
  - marker: c
    text: '''Friendship'' here carries diplomatic force and may imply formal friendly relations or alliance.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그들이 말한 것을 공문서에 기록한 뒤에, 이와 같이 하였습니다. 「안티오코스의 아들 누메니오스와 야손의 아들 안티파트로스는 유대인의 사절들이었으며, 우리에게 와서 우리와의 우호 관계를 새롭게 하였습니다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전해지는 그리스어 본문에는 ‘유대인들’ 앞에 고립된 알파(Α)가 들어 있는데, 의미 있는 단어라기보다 필사·편집상의 흔적으로 보입니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘백성의 결의들/회의들에’. 다만 문맥상 단순한 토론이 아니라 공식 문서 기록을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘우호 관계’는 외교적 용법을 띠며, 경우에 따라 공식 친선 또는 동맹을 뜻할 수 있습니다.
    reason: cultural_note
