  text: And Arsaces, the king of Persia and Media, heard that Demetrius had come into his territory, and he sent one of his commanders to capture him alive.
translation:
  language: ko
  text: 그리고 아르사케스는 페르시아와 메디아의 왕인데, 데메트리오스가 자기 영토에 들어온 것을 듣고는 자기 부하들 가운데 한 사람을 보내어 그를 살아 있는 채로 붙잡게 했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσεν
  english_pob_choice: heard
  chosen_korean: 듣고는
  alternatives_korean:
  - 들었습니다
  - 알게 되었습니다
  lexicon: BDAG
  rationale: 보고된 정보를 받아들인 동작을 자연스럽게 살리기 위해 단순 과거보다 서술 흐름을 이어 주는 ‘듣고는’으로 옮겼습니다.
- source_word: τὰ ὅρια αὐτοῦ
  english_pob_choice: his territory
  chosen_korean: 자기 영토
  alternatives_korean:
  - 자기 경계
  - 자기 국경
  lexicon: LSJ
  rationale: 문맥상 ‘경계’나 ‘국경’보다 정치적 통치 범위를 가리키는 ‘영토’가 가장 정확합니다.
- source_word: ἕνα τῶν ἀρχόντων αὐτοῦ
  english_pob_choice: one of his commanders
  chosen_korean: 자기 부하들 가운데 한 사람
  alternatives_korean:
  - 자기 지휘관들 가운데 한 사람
  - 자기 관리들 가운데 한 사람
  - 자기 통치자들 가운데 한 사람
  lexicon: BDAG
  rationale: ἀρχών은 넓게 ‘지도자, 관리, 통치자’를 뜻하므로, 군사적 임무 문맥을 유지하면서도 직책을 과도하게 좁히지 않는 표현을 택했습니다.
- source_word: συλλαβεῖν αὐτὸν ζῶντα
  english_pob_choice: to capture him alive
  chosen_korean: 그를 살아 있는 채로 붙잡게
  alternatives_korean:
  - 그를 살아서 사로잡게
  - 그를 생포하게
  lexicon: BDAG
  rationale: ζῶντα는 ‘죽이지 말고 살아 있게’라는 뜻이 분명하므로, ‘살아 있는 채로’로 강조했고, 군사적 포획 의미를 ‘붙잡게’로 옮겼습니다.
