    reason: alternative_reading
lexical_decisions:
- source_word: ἐποίησεν αὐτὸν τῶν φίλων αὐτοῦ
  english_pob_choice: made him one of his Friends
  chosen_korean: 그를 자기의 친구들 가운데 한 사람으로 삼고
  alternatives_korean:
  - 그를 자기의 친구들 가운데 한 사람으로 만들고
  - 그를 자기의 친구들 중 하나로 삼고
  lexicon: LSJ
  rationale: ποιέω + 대격 + 속격 구문은 단순한 ‘사귀다’가 아니라 어떤 범주에 들게 하거나 임명하는 뜻이므로, 직역을 유지하면서도 왕실적 포함 의미를 드러내는 표현을 택했습니다.
- source_word: τῶν φίλων αὐτοῦ
  english_pob_choice: one of his Friends
  chosen_korean: 자기의 친구들 가운데 한 사람
  alternatives_korean:
  - 자기의 친구들
  - 자기의 벗들 가운데 한 사람
  lexicon: LSJ
  rationale: 헬레니즘 왕실 용법에서 φίλοι는 단순한 개인적 친구가 아니라 공식적 신분 집단을 가리킬 수 있으나, 한국어에서는 이를 과도하게 제도화하지 않고 ‘친구들 가운데 한 사람’으로 살려 두었습니다.
- source_word: ἐδόξασεν αὐτὸν δόξῃ μεγάλῃ
  english_pob_choice: honored him with great honor
  chosen_korean: 큰 존귀로 그를 높였습니다
  alternatives_korean:
  - 큰 영광으로 그를 영화롭게 했습니다
  - 큰 존경으로 그를 높였습니다
  lexicon: LSJ
  rationale: δώξα가 여기서는 신학적 ‘영광’보다 정치·사회적 ‘존귀/명예’의 의미이므로, 동사와 명사를 함께 살리면서도 자연스러운 한국어 관용을 위해 ‘높이다’와 ‘존귀’를 결합했습니다.
theological_decisions:
- issue: fíloi(친구들)의 왕실 관직성 여부
  chosen_reading: 본문에는 ‘친구들 가운데 한 사람’으로 두되, 한국어 본문 자체에서는 관직명으로 단정하지 않았습니다.
  alternative_readings:
  - 왕의 ‘친구들’이라는 공식 직함
  - 친구들 중 한 사람
  rationale: 본문의 그리스어는 개인적 친분과 왕실적 신분 집단 둘 다 가능하지만, 이 절만으로는 확정할 필요가 없으므로 본문은 중립적으로 두고 영어 주석의 불확실성을 반영했습니다.
  doctrine_reference: 'Translation philosophy: source-language primacy; documented lexical tension preserved.'
