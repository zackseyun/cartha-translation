- from: 그리고 그의 시대에 그것이 그의 손에서 형통하여, 그 민족들을 자기들의 땅에서 제거하게 되었고[a], 또 다윗의 성, 곧 예루살렘에 있던 자들—자기들을 위해 성채를 만들어, 거기에서 나와 성소 둘레를 더럽히고 그 순결에 큰 해를 끼치던 자들—도 제거하게 되었습니다.
  to: 그리고 그의 시대에는 그가 그 민족들을 자기들의 땅에서 제거하고, 다윗 성, 곧 예루살렘에 있던 자들, 곧 자기들을 위하여 성채[a]를 만들어 그곳에서 나와 성소 둘레를 더럽히고 정결을 크게 훼손하던 자들을 제거하는 일에 성공을 거두었습니다.
