  yaml_path: translation/deuterocanon/1_maccabees/014/036.yaml
  text: And in his days it prospered in his hands to remove the nations from their land[a], and those in the city of David in Jerusalem who had made for themselves a citadel, from which they would go out and defile the area around the sanctuary, and they inflicted great damage on its purity.
  footnotes:
  - marker: a
    text: Or 'the Acra,' the fortified citadel in Jerusalem.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그의 시대에는 그가 그 민족들을 자기들의 땅에서 제거하고, 다윗 성, 곧 예루살렘에 있던 자들, 곧 자기들을 위하여 성채[a]를 만들어 그곳에서 나와 성소 둘레를 더럽히고 정결을 크게 훼손하던 자들을 제거하는 일에 성공을 거두었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아크라’, 예루살렘에 있던 요새화된 성채입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐοδώθη
  english_pob_choice: it prospered
  chosen_korean: 형통하여
  alternatives_korean:
  - 잘되었고
  - 번영하여
  - 성공하여
  lexicon: LSJ
  rationale: 수동형의 결과적 뉘앙스를 살리면서, 한국어에서는 주어 없는 관용으로 자연스럽게 ‘형통하다’가 가장 가깝습니다.
- source_word: ἐν ταῖς χερσὶν αὐτοῦ
  english_pob_choice: in his hands
  chosen_korean: 그의 손에서
  alternatives_korean:
  - 그의 통치 아래에서
  - 그의 권세로
  - 그의 손 안에서
  lexicon: LSJ
  rationale: 영어 POB가 유지한 손의 이미지를 그대로 살려, 그의 행위와 효과적 권능을 드러내는 표현으로 옮겼습니다.
- source_word: τὰ ἔθνη / ἐξαρθῆναι
  english_pob_choice: the nations / to remove
  chosen_korean: 그 민족들을 … 제거하게 되었고
  alternatives_korean:
  - 그 나라들을 … 몰아내게 되었고
  - 그 이방 민족들을 … 쫓아내게 되었고
  - 그 민족들을 … 뿌리뽑게 되었고
  lexicon: LSJ
  rationale: τὰ ἔθνη를 문자적으로 ‘민족들’로 옮기고, ἐξαρθῆναι는 과도한 해석을 피하면서도 문맥상 추방·축출의 결과를 담을 수 있는 ‘제거하다’로 번역했습니다.
- source_word: ἄκραν
  english_pob_choice: a citadel
  chosen_korean: 성채
  alternatives_korean:
  - 아크라
  - 요새
  - 성곽
  lexicon: LSJ
  rationale: 본문은 보통명사로는 ‘성채’가 적절하지만, 마카베오기 맥락의 특정 요새 아크라를 가리킬 가능성은 각주로 남겨 두었습니다.
- source_word: ἐμίανον / ἁγνείᾳ
  english_pob_choice: defile / purity
  chosen_korean: 더럽히고 … 순결에
  alternatives_korean:
  - 부정하게 하고 … 정결에
  - 더럽히고 … 정결함에
  - 훼손하고 … 순결에
  lexicon: LSJ
  rationale: 성전 주변의 의례적 오염을 드러내기 위해 ‘더럽히다’를 유지했고, ἁγνεία는 추상적 ‘거룩함’보다 ‘순결’이 더 직접적인 대응입니다.
theological_decisions:
- issue: 성전 주변의 정결 언어
  chosen_reading: ‘성소 둘레를 더럽히고 그 순결에 큰 해를 끼치다’로 옮겨, 의례적 오염과 순결 훼손의 대조를 살렸습니다.
  alternative_readings:
  - ‘거룩한 곳을 더럽히다’로 일반화할 수 있음
  - ‘성물을 더럽히다’로 좁힐 수 있음
  rationale: 본문은 성전 중심의 예배 질서를 해치는 행동을 강조하므로, 일반적 도덕 언어로 완화하지 않고 정결/부정의 성전적 긴장을 보존하는 것이 필요합니다.
  doctrine_reference: Translation philosophy §§1, 6
