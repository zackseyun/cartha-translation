  yaml_path: translation/deuterocanon/1_maccabees/014/040.yaml
  text: For it was heard that the Jews are called friends and allies and brothers by the Romans[a], and that they received Simon’s envoys honorably.
  footnotes:
  - marker: a
    text: Or 'received Simon’s ambassadors with honor.' The Greek verb is literally 'met,' but in context it refers to an official diplomatic reception.
    reason: lexical_alternative
translation:
  language: ko
  text: 유대인들이 로마인들에게 친구요 동맹이요 형제라고 불린다는 것과, 로마인들이 시몬의 사절들을 영예롭게 맞이했다는 것[a]이 알려졌기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ἀπήντησαν은 문자적으로는 ‘만나다’이지만, 이 문맥에서는 사절들에 대한 공식적인 접견을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσθη
  english_pob_choice: it was heard
  chosen_korean: 알려졌기 때문입니다
  alternatives_korean:
  - 전해졌기 때문입니다
  - 들렸기 때문입니다
  lexicon: LSJ
  rationale: 수동적·비인칭 표현을 한국어에서 자연스럽게 살려, 정보가 공개적으로 알려진 상황을 나타냈습니다.
- source_word: προσηγορεῦνται
  english_pob_choice: are called
  chosen_korean: 불리며
  alternatives_korean:
  - 라고 불리며
  - 호칭되며
  lexicon: LSJ
  rationale: 칭호나 호명으로 불리는 뜻을 간결하게 살리되, 문맥상 병렬 구조를 자연스럽게 만들었습니다.
- source_word: φίλοι καὶ σύμμαχοι καὶ οἱ ἀδελφοί
  english_pob_choice: friends and allies and brothers
  chosen_korean: 친구요 동맹이요 형제
  alternatives_korean:
  - 친구요 동맹이요 형제들
  - 벗이요 동맹이요 형제
  lexicon: LSJ
  rationale: 외교적 호칭의 열거를 그대로 보존했습니다. '형제'는 남성 복수 형식을 유지해 원문의 관계 호칭을 흐리지 않았습니다.
- source_word: ἀπήντησαν τοῖς πρεσβευταῖς ... ἐνδόξως
  english_pob_choice: received Simon’s envoys honorably
  chosen_korean: 시몬의 사절들을 영예롭게 맞이한
  alternatives_korean:
  - 시몬의 사절들을 존중하여 맞이한
  - 시몬의 사절들을 명예롭게 맞은
  lexicon: LSJ
  rationale: ἀπήντησαν의 문자적 '만났다'는 외교적 접견 맥락에서 '맞이하다'로 옮겼고, ἐνδόξως는 '영예롭게'로 품격 있는 환대를 살렸습니다.
theological_decisions:
- issue: 로마인의 외교적 호칭을 한국어에서 어떻게 보존할지
  chosen_reading: 친구요 동맹이요 형제라고 불리며
  alternative_readings:
  - 친구와 동맹과 형제라고 불리며
  - 우호국이요 동맹국이요 형제라고 불리며
  rationale: 정치·외교적 공식 호칭이라는 원문의 감각을 유지하기 위해, 완곡하게 바꾸지 않고 직접적인 관계 호칭을 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
