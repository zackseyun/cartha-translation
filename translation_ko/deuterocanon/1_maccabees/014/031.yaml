  - severity: medium
    issue: τὰ ἅγια의 주된 의미 선택
    rationale: ‘거룩한 것들’도 가능한 포괄적 번역이지만, 본문과 영어 POB의 문맥에서는 성전의 신성한 장소·구역을 가리키는 ‘거룩한 곳들’이 우선적으로 자연스럽습니다. 복수성과 남아 있는 어휘적 범위는 각주로 보존해야 합니다.
