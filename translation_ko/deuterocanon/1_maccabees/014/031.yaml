review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 현 번역은 문두의 ‘~하려 하였습니다’가 마지막 ‘손을 뻗다’에만 자연스럽게 걸려, 원문의 ἐβουλήθησαν이 지배하는 세 행동(침입, 파괴, 손을 뻗음) 모두가 적들의 계획이었다는 구조를 흐립니다. 또한 τὰ ἅγια는 문맥상 ‘거룩한 곳들/성소들’의 의미가 우선적이며, 각주로 더 넓은 ‘거룩한 것들’ 가능성을 남기는 것이 영어 POB의 선택 및 원문의 복수성을 가장 잘 반영합니다.
  naturalness: ‘그들의 땅에 침입하여 그들의 땅을 파괴하고’는 실제로 침입과 파괴가 일어난 뒤 손을 뻗으려 했다는 순차적 서술처럼 읽힐 수 있습니다. ‘침입하고 … 파괴하고 … 손을 뻗기로 계획하였습니다’로 병렬된 계획의 내용을 명시하면 현대 표준 한국어 합쇼체로 자연스럽고 정확합니다.
  terminology: ἐμβατεῦσαι는 적대적 군사 진입을 나타내므로 ‘침입하고’가 적절합니다. ἐκτρῖψαι는 ‘파괴하고’로 무리 없이 옮길 수 있습니다. τὰ ἅγια는 복수형을 살려 ‘거룩한 곳들’로 옮기고, ‘성소’ 및 ‘거룩한 것들’을 각주 대안으로 제시합니다. ‘손을 뻗다’는 ἐκτεῖναι τὰς χεῖρας의 비유적이고 적대적인 표현을 과도하게 해석하지 않고 보존합니다.
