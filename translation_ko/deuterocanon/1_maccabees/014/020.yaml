  yaml_path: translation/deuterocanon/1_maccabees/014/020.yaml
  text: And this is the copy of the letter that the Spartans sent—the rulers of the Spartans and the city—to Simon the high priest[a], and to the elders and the priests and the rest of the people of the Jews, their brothers[b], greetings.
  footnotes:
  - marker: a
    text: 'Greek: ''the copy of the letters''; the Greek uses a plural noun (''letters''), though the sentence functions as the introduction to a single piece of correspondence. English singular ''letter'' is used for clarity.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the rest of the Jewish people.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이것은 스파르타인들, 곧 스파르타인들의 통치자들과 그 도시가 대제사장 시몬과 장로들과 제사장들과 그 밖의 유대 백성, 곧 스파르타인들의 형제들에게 보낸 편지들의 사본입니다. 문안 인사를 드립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어의 ‘편지들’은 복수형입니다. 문맥상 이어지는 한 통의 외교 서신을 소개하지만, 본문에서는 원문의 복수형을 유지했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντίγραφον τῶν ἐπιστολῶν
  english_pob_choice: copy of the letter
  chosen_korean: 편지들의 사본
  alternatives_korean:
