  source_fidelity: 초안은 ἀντίγραφον τῶν ἐπιστολῶν의 복수형과 대제사장, 장로들, 제사장들, 유대 백성이라는 수신자 열거를 대체로 충실히 반영합니다. 그러나 χαίρειν은 편지의 관용적인 결어·인사말인데, 초안의 ‘...형제들에게 보내는 인사말입니다’는 ‘사본’과 ‘인사말’을 문법적으로 부자연스럽게 결합하고 발신 행위를 현재형으로 바꿉니다. 또한 ἀδελφοῖς는 유대인 수신자들을 스파르타인들이 ‘형제들’로 부르는 호칭이므로 그 관계를 분명히 하는 편이 좋습니다.
  naturalness: ‘편지들의 사본’은 다소 문서적이지만 원문의 복수형을 보존하는 안전한 표현입니다. 발신자와 수신자를 한 문장으로 정리하고, 마지막 인사 공식을 별도 문장으로 처리하면 현대 한국어 합쇼체에서 훨씬 자연스럽습니다.
  terminology: ‘스파르타인들’, ‘통치자들’, ‘대제사장’, ‘장로들’, ‘제사장들’, ‘유대 백성’은 적절합니다. ‘그들의 형제들’은 선행사가 모호할 수 있으므로 ‘스파르타인들의 형제들’로 명시했습니다.
