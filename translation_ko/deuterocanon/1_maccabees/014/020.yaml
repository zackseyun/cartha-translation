- source_word: τοῖς πρεσβυτέροις καὶ τοῖς ἱερεῦσι καὶ τῷ λοιπῷ δήμῳ τῶν Ἰουδαίων
  english_pob_choice: the elders and the priests and the rest of the people of the Jews
  chosen_korean: 장로들과 제사장들과 유대인들의 나머지 백성
