  to: 그리고 이것은 스파르타인들, 곧 스파르타인들의 통치자들과 그 도시가 대제사장 시몬과 장로들과 제사장들과 그 밖의 유대 백성, 곧 스파르타인들의 형제들에게 보낸 편지들의 사본입니다. 문안 인사를 드립니다.[a]
