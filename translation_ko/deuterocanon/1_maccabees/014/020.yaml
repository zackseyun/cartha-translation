  text: And this is the copy of the letter that the Spartans sent—the rulers of the Spartans and the city—to Simon the high priest[a], and to the elders and the priests and the rest of the people of the Jews, their brothers[b], greetings.
  footnotes:
  - marker: a
    text: 'Greek: ''the copy of the letters''; the Greek uses a plural noun (''letters''), though the sentence functions as the introduction to a single piece of correspondence. English singular ''letter'' is used for clarity.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the rest of the Jewish people.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이것은 스파르타 사람들이 보낸 편지들의 사본입니다. 곧 스파르타의 통치자들과 그 도시가 대제사장 시몬에게, 또 장로들과 제사장들과 유대인들의 나머지 백성 곧 그들의 형제들에게 보내는 인사말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 단수 ‘편지’가 아니라 복수형 ‘편지들’을 사용하지만, 여기서는 한 통의 외교 문서를 가리키는 서문으로 읽히므로 한국어 본문에서는 ‘편지들의 사본’으로 옮겼습니다.
    reason: textual_variant
