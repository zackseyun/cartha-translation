- from: 그리고 그 땅은 시몬의 모든 날 동안 쉬었고, 그는 자기 민족을 위해 좋은 것을 구하였습니다. 그의 권세와 그의 영광은 그의 모든 날 동안 그들에게 기쁨이었습니다.
  to: 그리고 그 땅은 시몬의 생애 내내 평온하였으며, 그는 자기 민족을 위하여 좋은 것을 구하였습니다. 그의 권세와 영광은 그의 생애 내내 그들을 기쁘게 하였습니다.
  rationale: 원문의 반복된 ‘모든 날 동안’을 ‘생애 내내’로 두 차례 유지하여 지속성을 보존했습니다. ‘평온하였으며’는 ἡσύχασεν의 국가적·사회적 안정 상태를 자연스럽게 나타내고, ‘그들을 기쁘게 하였습니다’는 ἤρεσεν αὐτοῖς의 호의적 평가를 직접 반영합니다. 신적 평화나 메시아적 의미는 덧붙이지 않았습니다.
