  text: And the land was at rest all the days of Simon, and he sought good for his nation; and his authority and his glory were pleasing to them all his days.
translation:
  language: ko
  text: 그리고 그 땅은 시몬의 생애 내내 평온하였으며, 그는 자기 민족을 위하여 좋은 것을 구하였습니다. 그의 권세와 영광은 그의 생애 내내 그들을 기쁘게 하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡσύχασεν ἡ γῆ
  english_pob_choice: the land was at rest
  chosen_korean: 그 땅은 … 쉬었고
  alternatives_korean:
  - 그 땅은 평안했고
  - 그 땅은 조용했으며
  - 그 땅은 휴식을 누렸고
  lexicon: LSJ
  rationale: ἡσυχάζω의 결과 상태를 자연스럽게 살리되, 역사적 문맥에서 과도한 신학적 평화 의미를 덧씌우지 않기 위해 ‘쉬다’를 택했습니다.
- source_word: ἐζήτησεν ἀγαθὰ
  english_pob_choice: he sought good
  chosen_korean: 좋은 것을 구하였습니다
  alternatives_korean:
  - 선을 구하였습니다
  - 유익을 구하였습니다
  - 좋은 일들을 추구하였습니다
  lexicon: LSJ
  rationale: 직역적인 ‘good(s)’를 한국어에서 가장 자연스럽게 풀어, 시몬이 민족의 유익을 적극적으로 도모했다는 뜻을 보존했습니다.
- source_word: τῷ ἔθνει αὐτοῦ
  english_pob_choice: for his nation
  chosen_korean: 자기 민족을 위해
  alternatives_korean:
  - 자기 나라를 위해
  - 자기 백성을 위해
  - 자기 나라 민족을 위해
  lexicon: LSJ
  rationale: 1 마카베오기에서 ἔθνος은 주로 유대 민족 공동체를 가리키므로, ‘민족’이 국가·혈연적 집합 의미를 함께 살립니다.
- source_word: ἡ ἐξουσία αὐτοῦ
  english_pob_choice: his authority
  chosen_korean: 그의 권세
  alternatives_korean:
  - 그의 권위
  - 그의 통치권
  - 그의 권력
  lexicon: LSJ
  rationale: ἔξουσία를 한국어로 옮길 때 제도적 통치 능력과 행사된 권한을 함께 담는 ‘권세’가 본문 흐름에 가장 잘 맞습니다.
- source_word: ἡ δόξα αὐτοῦ
  english_pob_choice: his glory
  chosen_korean: 그의 영광
  alternatives_korean:
  - 그의 명예
  - 그의 위엄
  - 그의 명성
  lexicon: LSJ
  rationale: δόξα의 고양된 평가를 유지하기 위해, 단순한 평판보다 성격이 강한 ‘영광’을 선택했습니다.
theological_decisions:
- issue: 시몬에 대한 정치적 찬양의 톤
  chosen_reading: 이 절은 시몬의 통치에 대한 역사적 칭송으로 처리하고, 메시아적·구속사적 함의를 덧붙이지 않습니다.
  alternative_readings:
  - 하나님이 주신 평강의 신학적 선언으로 읽는 해석
  - 후대 유대 지도자 이상형의 예표로 읽는 해석
  rationale: 원문은 땅의 안식, 민족의 유익 추구, 권세와 영광의 호감을 역사 서술의 어조로 병치할 뿐, 직접적인 신학적 해석 표지를 제시하지 않습니다.
  doctrine_reference: Translation philosophy §§1, 3
