translation:
  language: ko
  text: 그는 가서 데메트리우스의 진영을 치고 그를 사로잡아 아르사케스에게 데려가 감옥에 가두었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπορεύθη
  english_pob_choice: went
  chosen_korean: 나아가
  alternatives_korean:
  - 갔습니다
  - 진군했습니다
  lexicon: LSJ
  rationale: 단순 이동을 뜻하는 서술 동사로, 군사적 뉘앙스는 뒤이은 진영 공격에서 이미 드러나므로 과도한 해석 없이 자연스럽게 옮겼습니다.
- source_word: ἐπάταξεν τὴν παρεμβολήν
  english_pob_choice: struck the camp
  chosen_korean: 진영을 쳐서
  alternatives_korean:
  - 진영을 공격하여
  - 진영을 쳤고
  lexicon: LSJ
  rationale: πατάσσω의 직접적 의미인 '치다/치다(타격하다)'를 살리면서, 군사 문맥에서 한국어로 자연스러운 표현으로 옮겼습니다.
- source_word: συνέλαβεν
  english_pob_choice: captured
  chosen_korean: 사로잡고
  alternatives_korean:
  - 붙잡고
  - 포로로 잡고
  lexicon: LSJ
  rationale: 전투 맥락에서 사람을 붙들어 잡는 뜻을 분명히 하면서도, 본문의 간결한 서술성을 유지하기 위해 '사로잡다'를 택했습니다.
- source_word: ἔθετο αὐτὸν ἐν φυλακῇ
  english_pob_choice: put him in prison
  chosen_korean: 감옥에 가두었습니다
  alternatives_korean:
  - 감옥에 넣었습니다
  - 구금했습니다
  lexicon: LSJ
  rationale: ἐν φυλακῇ는 이 문맥에서 단순한 감시가 아니라 수감 상태를 뜻하므로, 결과를 분명히 드러내는 '감옥에 가두다'로 옮겼습니다.
