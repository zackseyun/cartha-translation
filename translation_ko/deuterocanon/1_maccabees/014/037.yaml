  text: And he settled Jewish men in it, and fortified it for the security of the country and the city, and raised the walls of Jerusalem.
translation:
  language: ko
  text: 그리고 그는 그곳에 유다인 남자들을 정착시켰고, 그 땅과 그 도시의 안전을 위하여 그곳을 요새화하였으며, 예루살렘의 성벽을 높였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατῴκισεν
  english_pob_choice: settled
  chosen_korean: 거주하게 하였습니다
  alternatives_korean:
  - 정착시켰습니다
  - 살게 하였습니다
  - 거주민으로 두었습니다
  lexicon: LSJ
  rationale: 사람들을 어떤 곳의 주민으로 세운다는 사역적 의미를 살리면서, 현대 한국어에서 가장 자연스럽게 읽히는 표현을 택했습니다.
- source_word: ἄνδρας Ἰουδαίους
  english_pob_choice: Jewish men
  chosen_korean: 유다 사람들
  alternatives_korean:
  - 유다 남자들
  - 유다인 남성들
  - 유대인들
  lexicon: LSJ
  rationale: ἄνδρας의 남성 표지를 살리는 쪽이 가능하지만, 한국어에서는 본문이 군사·행정적으로 배치된 사람들을 가리키는 맥락이 더 자연스럽게 드러나도록 집단 표지를 우선했습니다. 다만 성별 정보는 약화됩니다.
- source_word: ὠχύρωσεν
  english_pob_choice: fortified
  chosen_korean: 요새화하였습니다
  alternatives_korean:
  - 튼튼하게 하였습니다
  - 성곽을 강화하였습니다
  - 방어를 굳게 하였습니다
  lexicon: LSJ
  rationale: 성채·도시를 방어용으로 강화한다는 군사적 의미를 직접 반영하는 말로 옮겼습니다.
- source_word: πρὸς ἀσφάλειαν τῆς χώρας καὶ τῆς πόλεως
  english_pob_choice: for the security of the country and the city
  chosen_korean: 그 나라와 그 도시의 안전을 위하여
  alternatives_korean:
  - 그 지역과 그 도시의 안전을 위해
  - 그 땅과 그 도시의 보안을 위해
  lexicon: LSJ
  rationale: πρὸς ἀσφάλειαν의 목적 의미를 살려 ‘~을 위하여’로 옮겼고, χώρα와 πόλις의 대비는 ‘나라/도시’로 자연스럽게 전달했습니다.
- source_word: ὕψωσεν τὰ τείχη Ἰερουσαλήμ
  english_pob_choice: raised the walls of Jerusalem
  chosen_korean: 예루살렘의 성벽을 높였습니다
  alternatives_korean:
  - 예루살렘 성벽을 쌓아 높였습니다
  - 예루살렘의 담을 높였습니다
  lexicon: LSJ
  rationale: τείχη는 방어용 성벽이므로 ‘성벽’이 가장 적절하며, ὕψωσεν은 과도한 해석 없이 ‘높였습니다’로 옮겼습니다.
theological_decisions:
- issue: χώρα와 πόλις의 행정·군사적 대비
  chosen_reading: ‘그 나라와 그 도시’로 옮겨, 넓은 영토와 중심 도시를 함께 방어 대상으로 제시합니다.
  alternative_readings:
  - ‘그 땅과 그 도시’
  - ‘그 지역과 그 도시’
  rationale: 본문은 예루살렘 성벽의 상승을 국가 전체와 도시 방어의 맥락에 놓고 있으므로, 행정적·군사적 대비를 흐리지 않도록 했습니다.
  doctrine_reference: 역사서 문맥의 지리·정치적 의미 보존
- issue: ἄνδρας Ἰουδαίους의 성별 표지
  chosen_reading: 본문의 남성 표지를 한국어에서 직접 노출하지 않고 집단을 중심으로 옮겼습니다.
  alternative_readings:
  - ‘유다 남자들’
  - ‘유다인 남성들’
  rationale: 한국어에서는 어색한 성별 반복보다 자연스러운 역사 서술이 우선되었지만, 원문이 남성 명사를 쓴 사실은 번역 선택의 긴장으로 남습니다.
  doctrine_reference: 원문 성별 표지의 번역 가시성
