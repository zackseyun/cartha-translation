  to: 그리고 그는 그곳에 유다인 남자들을 정착시켰고, 그 땅과 그 도시의 안전을 위하여 그곳을 요새화하였으며, 예루살렘의 성벽을 높였습니다.
  rationale: 원문의 명시적 남성 표지와 정착의 사역적 의미를 본문에 보존했습니다. ‘그곳’은 αὐτῇ/αὐτήν의 선행 장소를 원문처럼 특정하지 않으면서 자연스럽게 가리키며, χώρα와 πόλις의 대비 및 예루살렘 성벽을 높였다는 진술도 그대로 유지했습니다. 기존 각주는 본문에서 성별 표지를 보존함에 따라 불필요하므로 삭제했습니다.
