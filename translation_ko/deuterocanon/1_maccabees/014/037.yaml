  text: καὶ κατῴκισεν ἐν αὐτῇ ἄνδρας Ἰουδαίους, καὶ ὠχύρωσεν αὐτὴν πρὸς ἀσφάλειαν τῆς χώρας καὶ τῆς πόλεως, καὶ ὕψωσεν τὰ τείχη Ἰερουσαλήμ.
