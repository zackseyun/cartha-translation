  text: Καὶ ἐν ἔτει δευτέρῳ καὶ ἑβδομηκοστῷ καὶ ἑκατοστῷ συνήγαγεν XIV Δημήτριος ὁ βασιλεὺς τὰς δυνάμεις αὐτοῦ, καὶ ἐπορεύθη εἰς Μηδίαν, τοῦ ἐπισπάσθαι βοήθειαν ἑαυτῷ, ὅπως πολεμήσῃ τὸν Τρύφωνα.
