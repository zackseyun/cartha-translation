base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/001.yaml
  text: And in the one hundred seventy-second year[a], King Demetrius gathered his forces and went into Media[b], to obtain help for himself so that he might make war against Tryphon.
  footnotes:
  - marker: a
    text: 'The dating formula is usually understood according to the Seleucid era: literally, ''in the second and seventieth and hundredth year.'''
    reason: cultural_note
  - marker: b
    text: Or 'to secure help for himself' / 'to win assistance for himself.' The Greek verb suggests drawing or attracting aid.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 백칠십이년[a]에 데메트리오스 왕은 자기의 군대[b]를 모으고 메디아로 들어가, 자신을 위하여 도움을 얻고자 하였으며, 그리하여 트뤼폰과 전쟁하려고 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 연대 공식은 보통 셀레우코스 연호로 이해됩니다. 직역하면 ‘둘째이자 일흔째이자 백째 해’입니다.
    reason: cultural_note
  - marker: b
    text: 여기서 ‘군대’는 군사적 병력 전체를 가리킵니다. 문맥상 ‘병력’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἔτει δευτέρῳ καὶ ἑβδομηκοστῷ καὶ ἑκατοστῷ
  english_pob_choice: in the one hundred seventy-second year
  chosen_korean: 백칠십이년
  alternatives_korean:
  - 제백칠십이년
  - 일백칠십이년
  lexicon: LSJ
  rationale: 그리스어의 누적 서수 표현은 셀레우코스 연대의 연호를 가리키므로, 한국어에서는 현대적이고 자연스러운 연대 표기로 옮겼습니다.
- source_word: συνήγαγεν τὰς δυνάμεις αὐτοῦ
  english_pob_choice: gathered his forces
  chosen_korean: 자기의 군대
  alternatives_korean:
  - 자기의 병력
  - 자기의 군세
  lexicon: LSJ
  rationale: δυνάμεις는 군사 문맥에서 ‘군대/병력’을 뜻하므로, 복수감과 전투적 맥락을 살려 ‘군대’로 옮겼습니다.
- source_word: ἐπορεύθη εἰς Μηδίαν
  english_pob_choice: went into Media
  chosen_korean: 메디아로 들어가
  alternatives_korean:
  - 메디아로 갔습니다
  - 메디아로 진군하였습니다
  lexicon: LSJ
  rationale: εἰς는 단순 목적지가 아니라 ‘~안으로’의 이동을 보이므로, 지역 안으로 들어감을 드러내는 표현을 택했습니다.
- source_word: τοῦ ἐπισπάσθαι βοήθειαν ἑαυτῷ
  english_pob_choice: to obtain help for himself
  chosen_korean: 자신을 위하여 도움을 얻고자 하였으며
  alternatives_korean:
  - 자신에게 도움을 끌어들이고자 하였으며
  - 자신을 위하여 지원을 구하고자 하였으며
  lexicon: LSJ
  rationale: ἐπισπάσθαι는 도움을 ‘끌어오다/끌어당기다’는 뉘앙스가 있지만, 한국어에서는 문맥상 자연스럽고도 과도하게 해석하지 않는 ‘도움을 얻다’가 적절합니다.
- source_word: ὅπως πολεμήσῃ τὸν Τρύφωνα
  english_pob_choice: so that he might make war against Tryphon
  chosen_korean: 그리하여 트뤼폰과 전쟁하려고 하였습니다
  alternatives_korean:
  - 그리하여 트뤼폰과 싸우려고 하였습니다
  - 그리하여 트뤼폰과 전쟁을 벌이려고 하였습니다
  lexicon: LSJ
  rationale: πολεμέω는 단발적 충돌보다 지속적인 전쟁 행위를 뜻하므로, ‘전쟁하다/전쟁을 벌이다’ 계열로 옮겨 의미를 유지했습니다.
theological_decisions:
- issue: 연대 표기와 셀레우코스 연호의 암시
  chosen_reading: ‘백칠십이년’으로 간단히 옮기고, 본문 안에서 셀레우코스 연호임을 추가 설명하지는 않았습니다.
  alternative_readings:
  - ‘제백칠십이년’
  - ‘일백칠십이년’
  rationale: 그리스어 자체는 연호를 암시하지만 본문 차원에서 계산법을 풀어 설명하지 않으며, 한국어 본문은 간결한 연대 표기를 유지하는 편이 원문에 더 가깝습니다.
  doctrine_reference: 본문 주석의 문화사적 설명 문제
- issue: 전쟁 목적의 진술
  chosen_reading: ‘도움을 얻고자 하였으며, 그리하여 트뤼폰과 전쟁하려고 하였습니다’로 목적과 결과를 분리해 옮겼습니다.
  alternative_readings:
  - ‘도움을 얻어 트뤼폰과 싸우려고 하였습니다’
  - ‘도움을 얻기 위해 트뤼폰과 전쟁하려고 하였습니다’
  rationale: τοῦ ... ὅπως ...의 이중 목적 구조를 한국어에서도 구분해 주어, 정치적·군사적 의도를 분명히 드러냈습니다.
  doctrine_reference: 서술 목적구 해석
