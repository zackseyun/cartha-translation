    issue: 문장 종결과 목적절 연결이 부자연스럽습니다.
    rationale: ‘메디아로 들어가, 자신을 위하여 도움을 얻고자 하였으며, 그리하여 … 하였습니다’는 단일 문장 안에서 연결 방식이 혼재합니다. 또한 τοῦ ... ὅπως ...의 목적 관계를 보다 직접적으로 드러낼 필요가 있습니다.
