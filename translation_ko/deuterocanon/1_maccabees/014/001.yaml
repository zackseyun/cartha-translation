  source_fidelity: 본문의 기본 의미는 대체로 충실합니다. 그러나 그리스어의 목적 구조(메디아로 감 → 자신을 위한 도움을 얻음 → 트리폰과 전쟁함)가 현 번역에서는 접속 표현의 혼용으로 다소 흐려집니다. 또한 ἐπισπάσθαι βοήθειαν에 관한 각주가 본문 앵커 및 내용에서 군대(δυνάμεις) 설명으로 바뀌어 있어 원문 및 영어 POB 감사 기록과 맞지 않습니다.
  naturalness: ‘들어가, … 하였으며, 그리하여 … 하였습니다’는 연결 어미와 종결 어미가 한 문장 안에서 부자연스럽게 섞여 있습니다. 목적 관계를 ‘…하기 위해 …고자 메디아로 갔습니다’로 정리하면 현대 표준어 합쇼체로 자연스럽습니다. 연도 단위는 ‘백칠십이 년’으로 띄어 쓰는 것이 적절합니다.
  terminology: ‘데메트리오스’는 유지할 수 있습니다. Τρύφων의 통용 한국어 음역은 ‘트리폰’이므로 이를 사용하는 편이 자연스럽고 독자 친화적입니다. ‘군대’는 δυνάμεις의 군사적 의미를 무리 없이 전달합니다.
  issues:
