translation:
  language: ko
  text: 백성이 이 말을 듣고 말했습니다. 「우리가 시몬과 그의 아들들에게 어떻게 은혜를 보답하겠습니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 χάρις는 ‘은혜’ 외에 ‘호의’, ‘감사’를 뜻할 수 있습니다. 여기서는 ἀποδώσομεν(‘되갚다, 보답하다’)과 함께 쓰여, 시몬과 그의 아들들이 베푼 호의에 상응하여 보답한다는 뜻을 나타냅니다.
    reason: lexical_alternative
