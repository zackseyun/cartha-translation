theological_decisions:
- issue: χάρις의 회적(상호 보답) 의미를 어떻게 드러낼 것인가
  chosen_reading: ‘은혜를 갚다’로 옮겨, 단순한 감정적 감사보다 받은 호의에 대한 상응하는 보답의 뉘앙스를 살렸습니다.
  alternative_readings:
