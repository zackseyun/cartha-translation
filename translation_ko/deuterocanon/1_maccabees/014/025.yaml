  text: When the people heard these words[a], they said, “What favor shall we repay to Simon and to his sons?”
  footnotes:
  - marker: a
    text: Or 'What gratitude shall we return to Simon and to his sons?' The Greek χάρις can denote favor, thanks, or gratitude; with 'repay' it carries a reciprocal sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 말을 무리가 들었을 때, 그들은 「시몬과 그의 아들들에게 우리가 무슨 은혜를 갚아야 합니까?」라고 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문의 χάρις는 ‘은혜’뿐 아니라 ‘호의’, ‘감사’의 뜻도 가질 수 있습니다. 여기서는 ἀποδώσομεν과 함께 써서 ‘되갚아야 할 은혜/호의’의 상호 보답 뉘앙스를 살렸습니다.
    reason: lexical_alternative
