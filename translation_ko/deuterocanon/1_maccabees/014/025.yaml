  - ‘호의를 되갚다’
  rationale: 본문은 ἀποδώσομεν과 결합하여 상호적 보답을 묻고 있으므로, 한국어에서도 교회적 상투어보다 원문 구조가 드러나는 표현이 적절합니다.
  doctrine_reference: Lexical/theological nuance of χάρις in reciprocal benefaction context
