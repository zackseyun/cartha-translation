translation:
  language: ko
  text: 사라멜에서, 제사장들과 백성과 나라의 지도자들과 그 땅의 장로들의 큰 회중 가운데서 우리에게 알려졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 사라멜에서 / 사라멜 안에서 둘 다 가능하지만, 여기서는 장소 표지로 읽었습니다.
    reason: lexical_alternative
  - marker: b
    text: ἀρχόντων ἔθνους와 τῶν πρεσβυτέρων τῆς χώρας는 각각 ‘나라의 지도자들’과 ‘그 땅의 장로들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν Σαραμέλ
  english_pob_choice: At Saramel
  chosen_korean: 사라멜에서
  alternatives_korean:
  - 사라멜 안에서
  - 사라멜에서
  lexicon: LSJ
  rationale: 장소명과 함께한 ἐν은 한국어에서 자연스럽게 ‘-에서’로 옮기되, 장소 표지를 보존했습니다.
- source_word: συναγωγῆς μεγάλης
  english_pob_choice: a great assembly
  chosen_korean: 큰 회중
  alternatives_korean:
  - 큰 모임
  - 큰 집회
  - 큰 회합
  lexicon: LSJ
  rationale: συναγωγή는 여기서 예배당이 아니라 공식적으로 모인 공적 집회를 가리키므로, ‘회중’으로 옮겨 군중이 아닌 구성원들의 집합성을 살렸습니다.
- source_word: τῶν ἱερέων καὶ λαοῦ καὶ ἀρχόντων ἔθνους καὶ τῶν πρεσβυτέρων τῆς χώρας
  english_pob_choice: of the priests and the people and the leaders of the nation and the elders of the country
  chosen_korean: 제사장들과 백성과 나라의 지도자들과 그 땅의 장로들
  alternatives_korean:
  - 제사장들과 백성과 나라의 통치자들과 그 땅의 장로들
  - 제사장들과 백성과 민족의 수장들과 그 땅의 장로들
  lexicon: LSJ
  rationale: ἀρχόντων은 직역적 ‘통치자들’도 가능하지만, 여기서는 공적 대표자들의 열거라는 문맥을 살려 ‘지도자들’로 옮겼습니다. ἔθνος은 이 유대 민족 문맥에서 ‘나라’로, χώρα는 토지/영토의 의미를 살려 ‘그 땅’으로 처리했습니다.
- source_word: ἐγνώσθη ἡμῖν
  english_pob_choice: it was made known to us
  chosen_korean: 우리에게 알려졌습니다
  alternatives_korean:
  - 우리에게 알려졌습니다
  - 우리에게 알려지게 되었습니다
  - 우리에게 밝혀졌습니다
  lexicon: LSJ
  rationale: 수동형의 공식 보고 어조를 살리면서도 한국어에서 자연스러운 문장으로 ‘알려졌습니다’를 택했습니다.
