  yaml_path: translation/deuterocanon/1_maccabees/014/028.yaml
  text: 'At Saramel[a], in a great assembly of the priests and the people and the leaders of the nation and the elders of the country[b], it was made known to us:'
  footnotes:
  - marker: a
    text: Or 'In Saramel.' The Greek preposition can be rendered either way with a place name.
