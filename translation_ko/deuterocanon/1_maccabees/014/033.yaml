  yaml_path: translation/deuterocanon/1_maccabees/014/033.yaml
  text: And he fortified the cities of Judea[a], and Bethsura on the borders of Judea, where formerly the weapons of the enemies had been, and he stationed there a garrison of Jewish men.
  footnotes:
  - marker: a
    text: Or 'Judean men.' The Greek Ἰουδαίους can denote either ethnic-religious identity ('Jewish') or regional identity ('Judean') in this context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 유대의 여러 도시와 유대 경계 지역에 있는 벳수라를 요새화하였습니다. 그곳은 전에 적들의 무기가 있던 곳이었습니다. 또 그는 այնտեղ에 유대인 남자들[a]로 이루어진 수비대를 배치하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유대 사람들’입니다. 그리스어 Ἰουδαίους는 이 문맥에서 민족·종교적 정체성인 ‘유대인’이나 지역적 정체성인 ‘유대 사람들’을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠχύρωσεν
