  lexicon: LSJ
  rationale: 성채·도시를 군사적으로 안전하게 만드는 뜻을 살려, 단순한 ‘강화’보다 방어 시설을 갖춘 상태를 드러내는 표현을 택했습니다.
- source_word: πόλεις
