  rationale: 행정·군사적 맥락의 복수 명사를 자연스럽게 살리면서도, 한국어에서 다소 좁게 들릴 수 있는 ‘성읍들’보다 현대적 표현을 택했습니다.
- source_word: ἐπὶ τῶν ὁρίων
  english_pob_choice: on the borders
  chosen_korean: 국경에 있는
  alternatives_korean:
  - 경계에 있는
  - 변두리에 있는
  lexicon: LSJ
  rationale: 유대의 경계 지대를 뜻하므로, 현대 한국어에서 가장 분명한 지리적 표현인 ‘국경에 있는’을 사용했습니다.
- source_word: ἄνδρας Ἰουδαίους
  english_pob_choice: Jewish men
  chosen_korean: 유대인들로 된 수비대
  alternatives_korean:
  - 유대인 남자들
  - 유대인들로 된 군대
  lexicon: LSJ
  rationale: ἄνδρας의 남성형을 직접 보이기보다, 문맥상 군사 주둔을 나타내는 φρουράν과 결합된 전체 의미를 한국어로 자연스럽게 드러냈습니다. 다만 ‘수비대’는 본문의 군사적 기능을 반영하는 번역입니다.
theological_decisions:
- issue: Ἰουδαίους의 지칭 범위
  chosen_reading: ‘유대인들’로 옮기되, 문맥상 수비대의 구성원을 가리키는 군사적 집단으로 읽었습니다.
  alternative_readings:
  - ‘유대인 남자들’
  - ‘유대 사람들’
  rationale: 이 구절은 민족·종교적 정체성과 지역적 소속이 겹칠 수 있는 표현을 사용합니다. 영어 POB의 판단처럼 ‘Jewish men’이 가능한데, 한국어에서는 군사 주둔의 실제 기능을 함께 살려 ‘유대인들로 된 수비대’로 표현했습니다.
  doctrine_reference: POB 번역 원칙 §5(핵심 용어의 일관성 또는 문서화된 예외), §4(성별 정보 보존)
