  - severity: low
    issue: 각주 표지가 관련 어구가 아닌 문장 끝에 함께 놓여 있습니다.
    rationale: 어휘 대안 각주는 ‘모임’에, 문화 각주는 자주색 옷과 금 걸쇠에 각각 연결하는 편이 명확합니다.
