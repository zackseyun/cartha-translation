  source_fidelity: 원문의 금지 표현과 열거 구조는 대체로 충실합니다. 다만 ‘그리고 이 모든 것에 대하여는’은 원문에 없는 화제 표지이면서 뒤의 ‘이 중’과 중복되고, πόρπη를 단순한 ‘금 장식’으로 옮기면 걸쇠·브로치류라는 물건의 뜻이 지나치게 넓어집니다. 미래 분사 ῥηθησομένοις는 ‘그가 앞으로 말할 것들’로 보존하는 편이 적절합니다.
  naturalness: 현대 표준어 합쇼체에 맞추어 문두의 중복을 제거하고, ‘백성과 제사장들 가운데 누구도’ 및 ‘…할 수 없으며 …할 수 없습니다’의 공적 금지 문장으로 다듬었습니다. 각주 표지도 해당 어구 바로 뒤에 배치했습니다.
  terminology: ‘폐기하다’는 ἀθετῆσαι의 공적 조항을 무효로 하거나 배척하는 뜻에 적절합니다. ‘금 걸쇠’는 πόρπη의 구체성을 유지하되 브로치나 버클로 단정하지 않습니다. συστροφή는 본문에서 중립적으로 ‘모임’으로 두고, 분파적 의미 가능성은 각주에서 보존합니다.
