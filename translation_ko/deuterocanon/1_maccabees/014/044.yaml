  to: 또한 백성과 제사장들 가운데 누구도 이 조항들 가운데 어느 하나도 폐기하거나, 그가 앞으로 말할 것들에 반대하거나, 그 없이 이 땅에서 모임을 소집할 수 없으며[a], 자주색 옷을 입거나 금 걸쇠를 착용할 수 없습니다.[b]
  rationale: 원문의 공적·정치적 금지라는 성격을 유지하면서 문두의 불필요한 중복을 제거했습니다. 미래 분사의 시간 지시를 ‘앞으로’로 보존했고, πόρπη는 특정 장신구 형태를 과도하게 단정하지 않으면서도 ‘금 장식’보다 원문에 가까운 ‘금 걸쇠’로 수정했습니다. συστροφή의 의미상 불확실성은 본문에서 중립적으로 유지하고 각주에 대안을 제시했습니다.
