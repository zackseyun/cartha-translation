  text: And it is not permitted for anyone of the people or of the priests to set aside any of these things, or to contradict what is said by him, or to convene an assembly in the country without him, or to put on purple and wear a gold clasp.
  footnotes:
  - marker: a
    text: Or possibly, 'to organize a faction in the country without him.' The Greek phrase involving συστροφή can suggest a gathering, coalition, or potentially a factional assembly.
    reason: lexical_alternative
  - marker: b
    text: Purple clothing and a gold clasp were marks of rank or official honor.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 이 모든 것에 대하여는 백성이나 제사장 가운데 누구도 이 중 어느 것도 폐지하거나, 그가 말할 것들에 반박하거나, 그 없이 이 땅에서 모임을 소집하거나, 자주색 옷을 입고 금 장식을 착용할 수 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 없이 이 땅에서 분파를 조직하다’로도 옮길 수 있습니다. συστροφή는 모임, 결집, 혹은 파벌적 집회를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 자주색 옷과 금 장식은 지위나 공식적 존귀의 표지였습니다.
    reason: cultural_note
lexical_decisions:
- source_word: οὐκ ἔξεστιν
  english_pob_choice: it is not permitted
  chosen_korean: 할 수 없습니다
  alternatives_korean:
  - 허용되지 않습니다
  - 허락되지 않습니다
  lexicon: LSJ
  rationale: 공적 금지의 뜻을 현대 한국어로 간결하게 드러내되, 과도하게 법률문체로 굳히지 않았습니다.
- source_word: ἀθετῆσαί τι τούτων
  english_pob_choice: to set aside any of these things
  chosen_korean: 이 중 어느 것도 폐지하다
  alternatives_korean:
  - 이 중 어느 것도 무효화하다
  - 이 중 어느 것도 무시하다
  lexicon: LSJ
  rationale: 이미 정해진 조항을 무효로 하거나 무시하는 뜻을 살려, 공적 결정을 뒤집는 행위를 자연스럽게 표현했습니다.
- source_word: τοῖς ὑπʼ αὐτοῦ ῥηθησομένοις
  english_pob_choice: what is said by him
  chosen_korean: 그가 말할 것들
  alternatives_korean:
  - 그가 말하게 될 것들
  - 그에게서 나올 말
  lexicon: LSJ
  rationale: 미래 수동 분사의 ‘그에 의해 말해질 것들’이라는 뜻을 살리되, 한국어에서는 공문 맥락에 맞게 자연스럽게 옮겼습니다.
- source_word: ἐπιστρέψαι συστροφὴν
  english_pob_choice: to convene an assembly
  chosen_korean: 모임을 소집하다
  alternatives_korean:
  - 집회를 조직하다
  - 결집을 일으키다
  lexicon: LSJ
  rationale: συστροφή의 넓은 의미 가운데, 문맥상 공적 집회를 금지하는 뜻을 과장 없이 반영했습니다.
- source_word: περιβαλέσθαι πορφύραν
  english_pob_choice: to put on purple
  chosen_korean: 자주색 옷을 입다
  alternatives_korean:
  - 자주색을 두르다
  - 자주 옷을 입다
  lexicon: LSJ
  rationale: 자주색이 지위의 표지라는 점을 유지하면서도, 한국어에서는 옷차림으로 풀어 자연스럽게 표현했습니다.
- source_word: ἐνπορποῦσθαι πόρπην χρυσῆν
  english_pob_choice: wear a gold clasp
  chosen_korean: 금 장식을 착용하다
  alternatives_korean:
  - 금 버클을 착용하다
  - 금 브로치를 달다
  lexicon: LSJ
  rationale: πόρπη가 걸쇠·브로치·버클을 가리킬 수 있어, 특정 형태를 단정하지 않고 지위 표지라는 기능을 살렸습니다.
