translation:
  language: ko
  text: 그들은 그들의 땅을 평화롭게 경작하고 있었으며, 땅은 그 소산을 내고 있었고, 들[a]의 나무들은 그 열매를 맺고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘평야’. 그리스어 πεδίων은 ‘평야들’을 뜻할 수 있으며, 더 넓게는 ‘들판’이나 ‘탁 트인 시골’을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοῦντες
  english_pob_choice: cultivating
  chosen_korean: 경작하고 있었으며
  alternatives_korean:
  - 농사짓고 있었으며
  - 일하고 있었으며
  lexicon: LSJ
  rationale: 농업적 노동을 나타내는 현재 분사로서, 단순히 ‘일하다’보다 구체적이고 지속적인 행위를 드러내는 ‘경작하다’가 맞습니다.
- source_word: τὴν γῆν αὐτῶν
