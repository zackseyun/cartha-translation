  text: And they were cultivating their land in peace[a], and the land was yielding its produce, and the trees of the fields their fruit.
  footnotes:
  - marker: a
    text: Or 'the trees of the fields their fruit.' The Greek πεδίων can mean 'plains' or more generally 'open fields/countryside.'
