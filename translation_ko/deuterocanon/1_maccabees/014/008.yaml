translation:
  language: ko
  text: 그들은 평강 가운데 자기 땅을 경작하고 있었으며, 땅은 그 소산을 내고, 들의 나무들은 그 열매를 맺고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘들의 나무들이 그 열매를 맺고 있었습니다.’ 그리스어 πεδίων은 ‘평야들’, ‘들판들’, 더 넓게는 ‘들판이 펼쳐진 시골’의 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοῦντες
  english_pob_choice: cultivating
  chosen_korean: 경작하고 있었으며
  alternatives_korean:
  - 농사짓고 있었으며
  - 일하고 있었으며
  lexicon: LSJ
  rationale: 농업적 노동을 나타내는 현재 분사로서, 단순히 ‘일하다’보다 구체적이고 지속적인 행위를 드러내는 ‘경작하다’가 맞습니다.
- source_word: τὴν γῆν αὐτῶν
  english_pob_choice: their land
  chosen_korean: 자기 땅
  alternatives_korean:
  - 그들의 땅
  - 그 땅
  lexicon: LSJ
  rationale: 소유 관계를 자연스럽게 드러내되, 한국어에서는 반복되는 소유격보다 ‘자기 땅’이 더 간결하고 유려합니다.
- source_word: μετʼ εἰρήνης
  english_pob_choice: in peace
  chosen_korean: 평강 가운데
  alternatives_korean:
  - 평화롭게
  - 평안 가운데
  lexicon: LSJ
  rationale: 여기서 εἰρήνη는 단순한 전쟁 부재만이 아니라 안정과 번영의 상태까지 포함하므로, POB의 ‘in peace’를 한국어 신앙어휘로도 살릴 수 있는 ‘평강 가운데’를 택했습니다.
- source_word: τὰ γενήματα
  english_pob_choice: produce
  chosen_korean: 소산
  alternatives_korean:
  - 생산물
  - 수확물
  - 열매
  lexicon: LSJ
  rationale: 토지의 산출물을 가리키는 넓은 농업 용어이므로, 지나치게 현대적이거나 한정적인 표현보다 ‘소산’이 원문의 범위를 잘 보존합니다.
theological_decisions:
- issue: εἰρήνη의 의미 범위
  chosen_reading: ‘평강’으로 번역해, 공동체가 누리는 안전과 번영의 상태를 함께 드러냈습니다.
  alternative_readings:
  - 평화
  - 평안
  rationale: 이 구절은 단지 내적 정서가 아니라 농경 생활이 가능한 안정된 질서를 묘사하므로, 한국어 성경 전통에서도 폭넓게 쓰이는 ‘평강’이 가장 균형 있습니다.
  doctrine_reference: 구약/제2성전기 문맥의 샬롬 개념
