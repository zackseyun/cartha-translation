  text: And they wrote to him on bronze tablets to renew with him the friendship and the alliance that they had established with Judas and Jonathan his brothers[a].
  footnotes:
  - marker: a
    text: Or 'bronze plaques.' The Greek refers to formal written tablets made of bronze, likely for durable public or diplomatic record.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 그와 함께 맺었던 우정과 동맹을, 유다와 그의 형제 요나단과 맺었던 그것을 갱신하기 위해 청동 서판에 그에게 썼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘서판’은 기록용 판을 드러내기 위한 번역입니다. ελλην어 δέλτος는 단순한 판보다 글을 새기거나 적는 표면을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δέλτους χαλκᾶς
  english_pob_choice: bronze tablets
  chosen_korean: 청동 서판
  alternatives_korean:
  - 청동 판
  - 청동 명판
  - 청동 패
  lexicon: LSJ
  rationale: δέλτος는 글을 새기거나 적는 서판을 가리키므로, 단순한 ‘판’보다 기록용 성격을 드러내는 ‘서판’이 더 정확합니다. χαλκᾶς는 재질을 청동으로 반영했습니다.
- source_word: τοῦ ἀνανεώσασθαι
  english_pob_choice: to renew
  chosen_korean: 갱신하기 위해
  alternatives_korean:
  - 새롭게 하기 위해
  - 다시 확정하기 위해
  - 갱신하도록
  lexicon: LSJ
  rationale: 부정사 구문이 목적을 나타내므로 ‘~하기 위해’로 풀었습니다. 단순 반복이 아니라 이전에 맺은 관계를 다시 유효하게 하는 의미를 살려 ‘갱신’으로 옮겼습니다.
- source_word: φιλίαν
  english_pob_choice: the friendship
  chosen_korean: 우정
  alternatives_korean:
  - 친선
  - 친교
  - 우호
  lexicon: LSJ
  rationale: 외교 문맥의 φιλία는 개인 감정보다는 공식적 우호 관계를 가리키지만, 한국어에서는 ‘우정’이 자연스럽고 관계의 친선성을 전달합니다. 관사에 해당하는 정관성은 문맥상 자연스럽게 처리했습니다.
- source_word: συμμαχίαν
  english_pob_choice: the alliance
  chosen_korean: 동맹
  alternatives_korean:
  - 연맹
  - 동맹 관계
  - 연합
  lexicon: LSJ
  rationale: συμμαχία는 군사·정치적 동맹이므로 ‘동맹’이 가장 직접적입니다. φιλία와 짝을 이루는 외교 공식어로도 무리가 없습니다.
theological_decisions:
- issue: 브론즈 서판을 통한 공식 외교 문서의 성격
  chosen_reading: 본문은 단순 서신이 아니라 오래 보존될 공식 기록용 청동 서판에 적은 문서로 이해했습니다.
  alternative_readings:
  - 단순히 청동판에 쓴 일반 문서
  - 상징적 표현으로서의 서판
  rationale: δέλτους χαλκᾶς는 내구성과 공적 기록성을 가진 매체를 가리키므로, 외교 조약의 공문서 성격을 살려 옮기는 것이 문맥에 맞습니다.
  doctrine_reference: 역사 서술의 문맥 이해
