base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/045.yaml
  text: But if anyone does anything contrary to these things[a], or sets aside any of them, he shall be liable.
  footnotes:
  - marker: a
    text: Or 'he shall be guilty.' The Greek expression can denote legal liability or culpability.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 누군가 이 모든 것에 어긋나는 일을 하거나 그 가운데 어떤 것이라도 폐기하면, 그는 책임을 지게 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘책임을 지게 됩니다’는 이 문맥의 법적 책임을 드러낸 번역입니다. 그리스어 표현은 ‘유죄가 된다’는 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρὰ ταῦτα
  english_pob_choice: contrary to these things
  chosen_korean: 이 모든 것에 어긋나는
  alternatives_korean:
  - 이것들에 반하는
  - 이것들 외에
  lexicon: LSJ
  rationale: παρά + 대격은 여기서 단순한 ‘이외에’보다 정해진 조항에 ‘어긋나게/반하여’ 행하는 뜻이므로, 법적 위반 뉘앙스를 살려 옮겼습니다.
- source_word: ποιήσῃ
  english_pob_choice: does anything
  chosen_korean: 일을 하거나
  alternatives_korean:
  - 행하거나
  - 무엇이든 하거나
  lexicon: BDAG
  rationale: 법 조항의 조건문에서 동사는 범위가 넓은 ‘하다’의 의미이므로, 뒤의 절과 함께 ‘일을 하거나’로 풀어 자연스럽게 처리했습니다.
- source_word: ἀθετήσῃ
  english_pob_choice: sets aside
  chosen_korean: 폐기하면
  alternatives_korean:
  - 무효로 하면
  - 무시하면
  - 거부하면
  lexicon: BDAG
  rationale: ἀθετέω는 법적·공적 문맥에서 어떤 규정이나 조항을 무효화하거나 무시하는 뜻이므로, 조항을 ‘폐기하다’로 옮겨 공문서적 성격을 살렸습니다.
- source_word: ἔνοχος ἔσται
  english_pob_choice: he shall be liable
  chosen_korean: 책임을 지게 됩니다
  alternatives_korean:
  - 유죄가 됩니다
  - 책임이 있습니다
  - 책임을 져야 합니다
  lexicon: BDAG
  rationale: ἔνοχος는 여기서 구체적 형벌보다 법적 책임 부담을 가리키므로, ‘유죄’보다 넓은 의미를 유지하는 ‘책임을 지게 됩니다’가 더 정확합니다.
theological_decisions:
- issue: 법적 책임 표현의 범위
  chosen_reading: 마지막 절은 도덕적 단죄보다 조항 위반에 따른 법적 책임을 뜻하는 것으로 읽었습니다.
  alternative_readings:
  - ‘유죄가 됩니다’처럼 형사적 죄책을 강조하는 읽기
  - ‘책임이 있습니다’처럼 더 중립적인 읽기
  rationale: 문맥이 맹세 조항의 위반 제재이므로, ἔνοχος의 공적·법적 성격을 살리되 과도한 형사화는 피했습니다.
  doctrine_reference: 공적 언약/법 조항의 위반 책임
