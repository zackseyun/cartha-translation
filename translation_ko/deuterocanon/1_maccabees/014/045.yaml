- from: 그러나 누군가 이 모든 것에 어긋나는 일을 하거나 그 가운데 어떤 것이라도 폐기하면, 그는 책임을 지게 됩니다.[a]
  to: 그러나 누구든지 이 조항들에 반하여 무엇이든 행하거나 그중 어느 하나라도 무효로 하면, 그는 법적 책임을 지게 됩니다.[a]
  rationale: 원문의 지시어를 ‘이 조항들’로 정확히 반영하고, 조건절의 포괄성을 ‘무엇이든’으로 보존했습니다. ἀθετέω는 법령·규정을 효력 없게 하거나 배척하는 문맥상 ‘무효로 하다’로 옮겼으며, ἔνοχος의 법적 책임과 유책이라는 의미 범위는 본문과 각주에 함께 보존했습니다.
  reviewer_model: gpt-5.6-terra
