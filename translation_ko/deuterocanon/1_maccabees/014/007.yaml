  - 많은 전쟁포로
  - 큰 수의 포로
  lexicon: LSJ
  rationale: 문맥상 ‘포로 상태’가 아니라 사람들을 포로로 데려온 뜻이므로, 군사적 의미가 분명한 ‘포로’를 택했습니다.
- source_word: τῆς ἄκρας
  english_pob_choice: the citadel
  chosen_korean: 성채
  alternatives_korean:
  - 아크라
  - 요새
  - 시타델
  lexicon: LSJ
  rationale: 본문의 일반명사적 의미를 살리되 한국어로 즉시 이해되는 ‘성채’로 옮겼습니다. 역사적 고유명사 가능성은 각주로 남겼습니다.
- source_word: τὰς ἀκαθαρσίας
  english_pob_choice: the uncleanness / uncleannesses
  chosen_korean: 더러움들을
  alternatives_korean:
  - 부정들을
  - 불결함들을
  - 부정한 것들을
  lexicon: LSJ
  rationale: 의례적·종교적 정결 맥락을 유지하면서도 원문의 복수형을 드러내기 위해 복수 표현을 살렸습니다.
- source_word: ὁ ἀντικείμενος αὐτῷ
  english_pob_choice: there was no one opposing him
  chosen_korean: 그를 대적하는 자가 없었습니다
  alternatives_korean:
  - 그에게 맞서는 자가 없었습니다
  - 그를 विरोध하는 자가 없었습니다
  - 그를 거스르는 자가 없었습니다
  lexicon: LSJ
  rationale: 현재 분사형의 지속적 대립을 반영해 ‘대적하는 자’로 옮겼습니다.
theological_decisions:
- issue: ἄκρα의 일반명사 vs. 역사적 고유명사
  chosen_reading: 본문에서는 ‘성채’로 번역하고, 고유명사 가능성은 각주로 처리했습니다.
  alternative_readings:
  - 아크라
  - 그 성채
  rationale: 그리스어 문맥상 일반명사 번역이 가장 투명하지만, 마카베오서의 역사적 배경에서 예루살렘의 특정 요새를 가리킬 수 있으므로 그 긴장을 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3, 6
