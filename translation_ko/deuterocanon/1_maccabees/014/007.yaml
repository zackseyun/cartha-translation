lexical_decisions:
- source_word: συνήγαγεν
  english_pob_choice: gathered
  chosen_korean: 모으고
  alternatives_korean:
  - 모으셨고
  - 끌어모으고
  - 집결시키고
  lexicon: LSJ
  rationale: 전승된 결과를 한데 모으는 동작을 자연스러운 한국어 동사로 옮겼습니다.
- source_word: αἰχμαλωσίαν πολλήν
  english_pob_choice: many captives
  chosen_korean: 많은 포로
  alternatives_korean:
