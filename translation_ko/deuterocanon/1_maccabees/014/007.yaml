revisions:
- from: 그는 많은 포로를 모으고, 게셀과 벧-술과 성채를 장악하였으며, 그곳의 더러움들을 제거하였고, 그를 대적하는 자가 없었습니다.[a]
  to: 그는 많은 포로를 모았고, 게셀과 벧-술과 성채[a]를 장악하였으며, 그곳에서 부정한 것들을 제거하였고, 그를 대적하는 자가 없었습니다.
  rationale: 각주 표지를 ‘성채’에 직접 연결하여 ἄκρα에 관한 대안 독법의 범위를 명확히 했습니다. 또한 ἀκαθαρσίαι의 복수 및 의례적 함의를 ‘부정한 것들’로 보존하고, 이에 맞추어 ‘그곳에서’로 문장을 자연스럽게 다듬었습니다. 그 밖의 지명과 통치·대적의 표현은 원문에 충실하므로 유지했습니다.
