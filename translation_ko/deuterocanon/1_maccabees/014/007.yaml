  - 그를 거스르는 자가 없었습니다
  lexicon: LSJ
  rationale: 현재 분사형의 지속적 대립을 반영해 ‘대적하는 자’로 옮겼습니다.
theological_decisions:
- issue: ἄκρα의 일반명사 vs. 역사적 고유명사
  chosen_reading: 본문에서는 ‘성채’로 번역하고, 고유명사 가능성은 각주로 처리했습니다.
  alternative_readings:
  - 아크라
  - 그 성채
  rationale: 그리스어 문맥상 일반명사 번역이 가장 투명하지만, 마카베오서의 역사적 배경에서 예루살렘의 특정 요새를 가리킬 수 있으므로 그 긴장을 보존했습니다.
