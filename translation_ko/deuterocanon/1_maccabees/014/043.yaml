base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/043.yaml
  text: and that he should have charge of the holy things[a], and that he should be obeyed by all, and that all documents in the country should be written in his name[d][c][b], and that he should wear purple and gold.
  footnotes:
  - marker: a
    text: Or 'the sanctuary' or 'the sacred matters.' The Greek says 'the holy things,' a broad expression for sacred affairs.
    reason: lexical_alternative
  - marker: b
    text: Literally 'be heard by all'; in this context the sense is that his authority is to be heeded or obeyed.
    reason: lexical_alternative
  - marker: c
    text: That is, all official documents in the land were to be issued under his authority.
    reason: cultural_note
  - marker: d
    text: Purple and gold were marks of high rank and official honor.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그가 성스러운 일들을 맡고, 모든 사람이 그에게 복종하며, 나라의 모든 문서가 그의 이름으로 작성되고, 그가 자주색 옷을 입고 금 장식을 착용하도록 하라는 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘성스러운 일들’은 본문의 복수형 표현을 살린 것으로, 성전 자체보다 넓은 성전 관련 직무와 사무를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘모든 사람에게 들리다’이지만, 이 문맥에서는 그의 권위를 인정하고 따르거나 복종하라는 뜻으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그의 이름으로’는 그의 권한 아래 공식적으로 작성된다는 뜻입니다.
    reason: cultural_note
  - marker: d
    text: 자주색 옷과 금 장식은 높은 지위와 공식적 영예의 표지입니다.
    reason: cultural_note
lexical_decisions:
- source_word: μέλῃ αὐτῷ περὶ τῶν ἁγίων
  english_pob_choice: should have charge of the holy things
  chosen_korean: 성스러운 일들을 맡아 돌보며
  alternatives_korean:
  - 성소를 맡으며
  - 거룩한 것들을 돌보며
  - 성스러운 일들에 책임을 지며
  lexicon: LSJ
  rationale: μέλω + περί의 관리·책임 맥락을 살려 단순한 ‘걱정하다’가 아니라 공적 위임의 의미를 드러냈습니다. τῶν ἁγίων은 복수형이므로 ‘성소’처럼 좁히기보다 넓은 sacred affairs로 처리했습니다.
- source_word: ἀκούηται ὑπὸ πάντων
  english_pob_choice: should be obeyed by all
  chosen_korean: 모든 사람에게서 순종을 받으며
  alternatives_korean:
  - 모든 사람에게 들리며
  - 모든 사람에게서 들려지며
  - 모든 사람에게서 들음을 받으며
  lexicon: BDAG
  rationale: 직역하면 ‘들리다’이지만, 권한 부여 문맥에서는 ‘듣고 따르다/순종하다’의 뜻이 자연스럽고 source-accurate합니다.
- source_word: γράφωνται ἐπὶ τῷ ὀνόματι αὐτοῦ πᾶσαι συγγραφαὶ
  english_pob_choice: all documents in the country should be written in his name
  chosen_korean: 나라의 모든 문서가 그의 이름으로 작성되며
  alternatives_korean:
  - 나라의 모든 문서가 그의 이름 아래 작성되며
  - 나라의 모든 공문서가 그의 이름으로 작성되며
  - 나라의 모든 기록이 그의 이름으로 쓰이며
  lexicon: LSJ
  rationale: συγγραφαί를 행정 문서로 풀어 ‘문서’로 옮겼고, ἐπὶ τῷ ὀνόματι는 공식 권한 아래의 작성이라는 뜻이므로 ‘그의 이름으로’가 가장 간결합니다.
- source_word: πορφύραν καὶ χρυσοφορῇ
  english_pob_choice: should wear purple and gold
  chosen_korean: 자주색과 금을 입게 하라는 것입니다
  alternatives_korean:
  - 자주색과 금을 입게 하며
  - 자주색 옷과 금 장식을 입게 하며
  - 자주색과 금을 걸치게 하라는 것입니다
  lexicon: LSJ
  rationale: 두 표지를 그대로 살리되, 헬라어의 짝을 유지해 지위와 영예의 상징을 드러냈습니다. χρυσοφορῇ는 직역해도 자연스러운 한국어로 ‘금을 입다’가 가능합니다.
theological_decisions:
- issue: τῶν ἁγίων의 범위
  chosen_reading: ‘성스러운 일들’로 넓게 유지하여 성전 관련 행정 전반을 포함할 수 있게 했습니다.
  alternative_readings:
  - ‘성소’
  - ‘거룩한 것들’
  rationale: 그리스어 복수형은 단일 건물보다 넓은 sacred affairs를 가리킬 수 있으므로, 의미를 과도하게 좁히지 않았습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve source breadth.'
