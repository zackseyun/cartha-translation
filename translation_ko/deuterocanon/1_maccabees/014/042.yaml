  - severity: medium
    issue: 각주가 본문과 같은 ‘성소’를 다시 대안으로 제시함
    rationale: 현 본문이 이미 ‘성소’이므로 ‘또는 성소’라는 각주는 기능적으로 모순됩니다. 본문을 넓게 고치고 성소 및 거룩한 곳을 대안으로 제시해야 합니다.
  - severity: low
