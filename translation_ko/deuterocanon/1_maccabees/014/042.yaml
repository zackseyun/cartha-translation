translation:
  language: ko
  text: 그리고 그가 그들의 사령관이 되게 하고, 그가 성소에 대해 마음을 쓰게 하며, 그들의 일과 나라와 무기와 요새들 위에 사람들을 세우게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성소’를 가리키는 것으로 볼 수 있으며, 전승 본문의 그리스어는 여기서 다소 난해합니다.
    reason: textual_variant
lexical_decisions:
- source_word: στρατηγόν
  english_pob_choice: commander
  chosen_korean: 사령관
  alternatives_korean:
  - 지휘관
  - 군장
  lexicon: LSJ
  rationale: στρατηγός는 군사적 지도자를 가리키므로, 현대 한국어에서 지나치게 관료적이지 않으면서도 직무를 드러내는 ‘사령관’이 가장 자연스럽습니다.
- source_word: μέλῃ αὐτῷ περὶ
  english_pob_choice: should take thought for
  chosen_korean: 마음을 쓰게 하며
  alternatives_korean:
  - 돌보게 하며
  - 염려하게 하며
  lexicon: LSJ
  rationale: μέλω는 ‘관심을 두다/돌보다’의 뜻이므로, 공적 문맥에 맞게 ‘마음을 쓰다’로 옮기면 의미와 문체를 함께 살릴 수 있습니다.
- source_word: τῶν ... ἅγιον
  english_pob_choice: the holy things / the sanctuary
  chosen_korean: 성소
  alternatives_korean:
  - 거룩한 것들
  - 성물
  lexicon: LSJ
  rationale: 전승된 그리스어는 난해하지만, 이 문맥의 ἅγιον 계열은 성전 관련 대상을 가리키는 것으로 읽히므로, 한국어에서는 의미를 과도하게 풀지 않고 ‘성소’로 좁혀 번역했습니다.
- source_word: καθιστάναι
  english_pob_choice: appoint men over
  chosen_korean: 사람들을 세우게
  alternatives_korean:
  - 맡기게
  - 임명하게
  lexicon: LSJ
  rationale: καθιστάναι는 사람을 어떤 직무에 ‘세우다/임명하다’는 뜻이므로, 뒤에 열거되는 관리 영역들을 고려해 ‘사람들을 세우게’로 옮겼습니다.
- source_word: ὀχυρωμάτων
  english_pob_choice: strongholds
  chosen_korean: 요새들
  alternatives_korean:
  - 성채들
  - 견고한 곳들
  lexicon: LSJ
  rationale: ὀχυρώματα는 군사적 방어 거점을 뜻하므로, 현대 한국어에서 가장 분명한 대응인 ‘요새들’을 택했습니다.
theological_decisions:
- issue: τῶν ... ἅγιον의 정확한 대상이 불분명함
  chosen_reading: 성소로 번역하되, 과도한 해석은 피했습니다.
  alternative_readings:
  - 거룩한 것들
  - 성물
  rationale: 이 구절의 전승 본문은 난해하므로, 본문이 요구하는 최소한의 성전 관련 의미만 드러내고 특정 대상을 단정하지 않았습니다.
  doctrine_reference: 본문 난점 보존과 원어 우선 원칙
