- from: 그리고 그가 그들의 사령관이 되게 하고, 그가 성소에 대해 마음을 쓰게 하며, 그들의 일과 나라와 무기와 요새들 위에 사람들을 세우게 하였습니다.[a]
  to: 그리고 그를 그들의 사령관으로 삼고, 그가 거룩한 것들[a]을 돌보며, 그들의 일과 나라와 무기와 요새들을 맡을 사람들을 임명하게 하였습니다.
  rationale: 본문의 난해한 성스러운 대상에 관한 표현을 ‘거룩한 것들’로 유지하여 지시 대상을 성소로 단정하지 않았습니다. 각주는 성소 및 거룩한 곳이라는 가능한 해석을 보존합니다. 또한 관리 영역들의 열거는 ‘맡을 사람들을 임명하게’로 다듬어 원문의 임명 행위와 한국어 자연스러움을 함께 살렸습니다.
