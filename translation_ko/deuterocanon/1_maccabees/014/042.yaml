  text: and that he should be their commander[a], and that he should take thought for the sanctuary, and appoint men over their works and over the country and over the weapons and over the strongholds.
  footnotes:
  - marker: a
    text: Or 'the sanctuary' or 'the holy place'; the Greek wording here is difficult in the transmitted text.
