  verdict: revise
  source_fidelity: ‘성소’로 본문을 확정하면 전승된 난해한 표현 τῶν Α ἅγιον의 지시 대상을 지나치게 좁히게 됩니다. 본문은 ‘거룩한 것들’로 넓게 옮기고, 성소/거룩한 곳이라는 해석은 각주에 보존하는 것이 원문과 영어 POB의 유보를 더 충실히 반영합니다. 나머지 행정·군사 직무의 열거는 충실합니다.
  naturalness: 초안의 ‘그들의 일과 나라와 무기와 요새들 위에 사람들을 세우게’는 한국어에서 다소 직역투입니다. ‘…을 맡을 사람들을 임명하게’로 하면 καθιστάναι와 ἐπί의 관리·감독 관계를 자연스러운 현대 합쇼체로 드러냅니다.
  terminology: ‘사령관’은 στρατηγός의 군사·행정적 기능에 적절합니다. ‘거룩한 것들’은 난해한 ἅγιον 계열 표현을 과도하게 특정하지 않으며, ‘무기’, ‘요새들’도 적절합니다.
