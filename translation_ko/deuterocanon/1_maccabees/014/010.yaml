  text: He supplied the cities with provisions[a], and equipped them with implements of fortification[b], until the name of his glory was named to the end of the earth.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'his glorious name became known to the end of the earth.' The Greek reads more literally, 'the name of his glory was named.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'implements of fortification' may refer broadly to defensive equipment or matériel for strengthening the cities.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 성읍들에 양식을 공급하고, 그들을 요새화용 기구들로 갖추어 주었으며, 그의 영광의 이름이 땅의 끝까지 알려질 때까지 그렇게 하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐχορήγησεν
  english_pob_choice: supplied
  chosen_korean: 공급하고
  alternatives_korean:
  - 제공하고
  - 보급하고
  - 갖추어 주고
  lexicon: LSJ
  rationale: 성읍들에 대한 행정적·군사적 지원을 나타내므로, 단순한 ‘주다’보다 필요한 것을 공급하는 의미를 살려 번역했습니다.
- source_word: βρώματα
  english_pob_choice: provisions
  chosen_korean: 양식
  alternatives_korean:
  - 식량
  - 식품
  - 보급품
  lexicon: LSJ
  rationale: 문맥상 도시의 생존과 유지에 필요한 식량 공급을 가리키므로, 자연스러운 현대 한국어로 ‘양식’이 적절합니다.
- source_word: ἔταξεν αὐτὰς ἐν σκεύεσιν ὀχυρώσεως
  english_pob_choice: equipped them with implements of fortification
  chosen_korean: 요새화용 기구들로 갖추어 주었으며
  alternatives_korean:
  - 방어 장비로 갖추어 주었으며
  - 성채화 도구들로 마련해 주었으며
  - 요새화에 필요한 수단으로 갖추어 주었으며
  lexicon: LSJ
  rationale: ἔταξεν은 단순히 ‘배치하다’보다 어떤 상태로 ‘갖추다’는 뜻이 자연스럽고, σκεύεσιν ὀχυρώσεως의 구체성을 살리기 위해 ‘요새화용 기구들’로 옮겼습니다.
- source_word: ὠνομάσθη τὸ ὄνομα τῆς δόξης αὐτοῦ ἕως ἄκρου γῆς
  english_pob_choice: the name of his glory was named to the end of the earth
  chosen_korean: 그의 영광의 이름이 땅의 끝까지 알려질 때까지
  alternatives_korean:
  - 그의 영광의 이름이 땅의 끝까지 이름나게 될 때까지
  - 그의 영광의 이름이 땅 끝까지 불리게 될 때까지
  - 그의 영광스러운 이름이 땅 끝까지 알려질 때까지
  lexicon: LSJ
  rationale: 그리스어는 직역하면 ‘이름이 지어졌다/불렸다’이지만, 한국어에서는 그 명성이 널리 알려졌다는 뜻을 더 분명하게 드러내는 것이 문맥에 합당합니다.
theological_decisions:
- issue: ὠνομάσθη의 수동 표현을 한국어에서 어떻게 살릴지
  chosen_reading: 직역적 구조를 유지하되, 자연스러운 한국어에서는 ‘알려질 때까지’로 옮겨 명성의 확산을 드러냈습니다.
  alternative_readings:
  - ‘이름나게 될 때까지’
  - ‘불리게 될 때까지’
  rationale: 문자적으로는 ‘이름이 지어졌다/불렸다’이지만, 본문은 영광의 이름이 온 땅에 알려지는 공적 인지의 확장을 가리키므로 과도한 의인화 없이 의미를 살렸습니다.
  doctrine_reference: 어휘·문체 수준의 결정
