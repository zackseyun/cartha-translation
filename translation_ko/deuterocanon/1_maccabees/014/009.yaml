  text: The elders sat in the public squares; all of them talked together about good things[a], and the young men put on splendid garments and armor.
  footnotes:
  - marker: a
    text: Greek literally, 'glories and garments of war.' The first term is idiomatic in context and likely refers to splendid adornment or honorable attire.
    reason: lexical_alternative
translation:
  language: ko
  text: 장로들은 광장들에 앉아 있었고, 그들 모두가 좋은 일들에 대해 서로 이야기하였으며, 젊은 남자들은 영광스러운 옷과 전쟁용 갑옷을 입었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘영광들’과 ‘전쟁의 옷’이라고 합니다. 앞의 말은 문맥상 화려한 장식이나 존귀한 복장을 가리키는 관용적 표현일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρεσβύτεροι
  english_pob_choice: elders
  chosen_korean: 장로들
  alternatives_korean:
  - 노인들
  - 어른들
  lexicon: LSJ
  rationale: 이 문맥에서는 단순한 고령자가 아니라 공동체의 원로들을 가리키므로, 사회적 지위를 살린 ‘장로들’이 가장 자연스럽습니다.
- source_word: ἐν ταῖς πλατείαις
  english_pob_choice: in the public squares
  chosen_korean: 광장들에
  alternatives_korean:
  - 거리들에
  - 넓은 곳들에
  lexicon: LSJ
  rationale: πλατεῖαι는 도시의 넓은 열린 공간을 가리키므로, 현대 한국어에서 공동체적 공공 공간을 떠올리게 하는 ‘광장들’이 적절합니다.
- source_word: δόξας
  english_pob_choice: splendid garments
  chosen_korean: 영광스러운 옷
  alternatives_korean:
  - 화려한 옷
  - 존귀한 옷
  - 영예로운 장식
  lexicon: LSJ
  rationale: 직역하면 ‘영광들’이지만 복장 문맥에서는 눈에 보이는 장식과 위엄을 뜻하므로, 어색한 추상어를 피하면서도 원뜻을 살린 표현으로 옮겼습니다.
- source_word: στολὰς πολέμου
  english_pob_choice: armor
  chosen_korean: 전쟁용 갑옷
  alternatives_korean:
  - 전쟁 옷
  - 군복
  - 무장
  lexicon: LSJ
  rationale: 직역은 ‘전쟁의 옷’에 가깝지만, 문맥상 전투용 복장과 장비를 가리키므로 한국어에서 구체적이고 이해하기 쉬운 ‘전쟁용 갑옷’으로 옮겼습니다.
theological_decisions:
- issue: δόξας의 이미지가 단순한 ‘영광’인지, 실제 의복 묘사인지
  chosen_reading: 복장 문맥을 따라 외적인 장식과 위엄을 드러내는 표현으로 이해했습니다.
  alternative_readings:
  - 추상적으로 ‘영광들’로 읽기
  - 명예의 상징으로만 읽기
  rationale: 영어 POB도 이 단어를 문맥상 ‘splendid garments’로 풀어 설명하므로, 본문이 전하는 평화와 번영의 외적 표지를 한국어에서도 보이게 하는 것이 타당합니다.
  doctrine_reference: 문맥 기반 어휘 해석
- issue: στολὰς πολέμου를 어떻게 현대 독자가 이해하도록 할지
  chosen_reading: 전쟁에 쓰는 실제 장비를 떠올리게 하는 ‘전쟁용 갑옷’으로 옮겼습니다.
  alternative_readings:
  - 전쟁 옷
  - 군사 복장
  - 무기와 갑옷
  rationale: 본문은 젊은 남자들이 전쟁을 준비하는 모습과 번영의 대비를 그리므로, 단순한 ‘옷’보다 전투성을 분명히 드러내는 번역이 더 충실합니다.
  doctrine_reference: 서술 문맥의 이미지 보존
