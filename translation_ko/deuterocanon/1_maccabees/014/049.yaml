theological_decisions:
- issue: 문서 보관의 목적 표현
  chosen_reading: 이 문서는 단순 보관이 아니라, 시몬과 그의 아들들이 이를 계속 소지·보유하도록 하기 위한 조치로 읽었습니다.
  alternative_readings:
  - 단순히 보관 장소를 지정한 행정적 조치로만 읽기
  - 후대의 법적 보관 증거로만 읽기
  rationale: ὅπως ἔχῃ는 목적을 분명히 하므로, 소지의 지속성을 드러내는 쪽이 원문의 힘을 잘 보존합니다.
  doctrine_reference: 문맥 해석
