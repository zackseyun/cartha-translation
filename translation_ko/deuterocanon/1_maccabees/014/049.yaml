  chosen_reading: 이 문서는 단순 보관이 아니라, 시몬과 그의 아들들이 이를 계속 소지·보유하도록 하기 위한 조치로 읽었습니다.
  alternative_readings:
  - 단순히 보관 장소를 지정한 행정적 조치로만 읽기
