  text: 그리고 그 문서들의 사본은 보물창고에 두어, 시몬과 그의 아들들이 그것들을 가지게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사본’은 여기서 문서의 복제본을 뜻합니다. 영어 POB의 ‘copies’에 해당하며, 원문의 ἀντίγραφα가 가리키는 것은 물건의 일반적 복사가 아니라 문서의 재현입니다.
    reason: lexical_alternative
lexical_decisions:
