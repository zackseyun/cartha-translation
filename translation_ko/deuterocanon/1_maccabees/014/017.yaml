  text: 그런데 그들은 그의 형제 시몬이 그를 대신하여 대제사장이 되었고 그 나라와 그 안에 있는 도시들을 다스리고 있다는 말을 들었을 때,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ ἤκουσαν
  english_pob_choice: But when they heard
  chosen_korean: 그런데 … 들었을 때
  alternatives_korean:
  - 그리고 … 들었을 때
  - 그들이 … 들었을 때
  lexicon: BDAG
  rationale: ὡς + aorist는 시간 부사절로 자연스럽게 옮기되, δέ의 약한 전개 기능은 한국어의 ‘그런데’로 살려 서술의 흐름을 유지했습니다.
- source_word: Σίμων ὁ ἀδελφὸς αὐτοῦ
  english_pob_choice: Simon his brother
  chosen_korean: 시몬, 곧 그의 형제
  alternatives_korean:
  - 시몬, 그의 형제
  - 시몬 그의 형제
  lexicon: BDAG
  rationale: Σίμων을 식별하는 동격구이므로 ‘곧’으로 설명적 동격을 분명히 했고, αὐτοῦ는 직전 인물의 소유·관계 표시로 ‘그의’로 옮겼습니다.
- source_word: ἀντ' αὐτοῦ
  english_pob_choice: in his place
  chosen_korean: 그를 대신하여
  alternatives_korean:
  - 그의 자리에
  - 그 대신에
  lexicon: BDAG
  rationale: ἀντί는 여기서 단순한 위치가 아니라 승계·대체를 뜻하므로, 직무 승계를 분명히 드러내는 ‘그를 대신하여’를 택했습니다.
- source_word: ἀρχιερεὺς
  english_pob_choice: high priest
  chosen_korean: 대제사장
  alternatives_korean:
  - 수제사장
  - 최고 제사장
  lexicon: BDAG
  rationale: 유대 공직명으로 굳어진 표준 대응어인 ‘대제사장’을 사용해 독자가 직책을 즉시 알아보도록 했습니다.
- source_word: ἐπικρατεῖ τῆς χώρας καὶ τῶν πόλεων τῶν ἐν αὐτῇ
  english_pob_choice: was ruling over the country and the cities in it
  chosen_korean: 그 나라와 그 안의 도시들을 다스리고 있다는
  alternatives_korean:
  - 그 나라와 그 안의 도시들을 지배하고 있다는
  - 그 땅과 그 안의 도시들을 다스리고 있다는
  lexicon: BDAG
  rationale: ἐπικρατέω는 여기서 정치적 통치의 의미이므로 ‘다스리다’로 옮겼고, χώρα와 그 안의 πόλεις의 관계는 ‘그 나라와 그 안의 도시들’로 명시했습니다.
theological_decisions:
- issue: ἀρχιερεύς의 직책 번역을 교회 직분어로 오해하지 않도록 할지
