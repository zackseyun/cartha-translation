translation:
  language: ko
  text: 그리고 유대인들과 제사장들이 시몬이 자기들의 지도자이자 대제사장이 되어 영원히 머물기를 원하였으며, 신실한 예언자가 일어날 때까지 그러하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘신실한 예언자’나 ‘참된 예언자’일 수 있습니다. 그리스어 πιστόν은 신실한 사람이나 신뢰할 만한 사람을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν
