theological_decisions:
- issue: εἰς τὸν αἰῶνα와 ἕως 절이 함께 주는 기간의 긴장
  chosen_reading: ‘영원히’라는 표현을 살리되, 곧이어 ‘...일어날 때까지’라는 제한을 함께 유지해 본문이 가진 긴장 자체를 드러냈습니다.
  alternative_readings:
  - ‘영원히’를 약화해 ‘오래도록’으로 옮김
  - 뒤의 제한절을 해석상 부차적인 설명으로 처리함
  rationale: 본문은 영구적 부여처럼 보이는 표현과 명시적 종결 조건을 둘 다 말하므로, 어느 한쪽으로 풀어버리지 않고 함께 남겨 두는 것이 소스 충실성에 맞습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it.
