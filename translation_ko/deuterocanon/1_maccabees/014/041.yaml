  - 대사제
  lexicon: BDAG
  rationale: 제사장 직분의 표준 대응어로서 한국어 성경 독자에게도 분명하고, 본문이 말하는 직책을 직접적으로 전달합니다.
- source_word: προφήτην πιστόν
  english_pob_choice: a trustworthy prophet
  chosen_korean: 신실한 예언자
  alternatives_korean:
  - 신뢰할 만한 예언자
  - 충실한 예언자
