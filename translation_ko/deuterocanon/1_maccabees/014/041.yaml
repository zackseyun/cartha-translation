  lexicon: BDAG
  rationale: 시몬의 역할을 특정 관직으로 과도하게 좁히지 않으면서 정치적·공동체적 이끄는 역할을 잘 드러내는 말로 ‘지도자’를 택했습니다.
- source_word: ἀρχιερέα
  english_pob_choice: high priest
  chosen_korean: 대제사장
