  text: καὶ ἐπεδέξατο Σίμων, καὶ εὐδόκησεν ἀρχιερατεύσαι καὶ εἶναι στρατηγὸς καὶ ἐθνάρχης τῶν Ἰουδαίων καὶ ἱερέων καὶ τοῦ προστῆσαι ἁπάντων.
