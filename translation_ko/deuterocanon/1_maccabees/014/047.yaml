  lexicon: LSJ
  rationale: 중간태의 수락 의미를 자연스러운 현대 한국어로 옮기면서, 문맥상 임명·합의의 대상을 ‘그것’으로 드러냈습니다.
- source_word: ἀρχιερατεύσαι
