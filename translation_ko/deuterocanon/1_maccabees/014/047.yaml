  lexicon: LSJ
  rationale: 직함 자체를 분명히 하되, 직분을 수행하는 의미를 살려 ‘대제사장이 되다’로 옮겼습니다.
- source_word: στρατηγός
  english_pob_choice: commander
  chosen_korean: 장군이자
  alternatives_korean:
  - 군사령관이자
  - 군 지휘관이자
  lexicon: LSJ
  rationale: 군사적 통치 직함을 과도하게 현대화하지 않으면서도 한국어에서 이해되는 공식 직함으로 옮겼습니다.
- source_word: ἐθνάρχης
  english_pob_choice: ethnarch
  chosen_korean: 민족의 지도자가 되어
  alternatives_korean:
  - 에스나르크가 되어
  - 백성의 통치자가 되어
  lexicon: LSJ
  rationale: 역사적 관직 명칭을 그대로 음역하기보다, 본문의 정치적 기능을 드러내는 설명적 번역을 택했습니다.
- source_word: προστῆσαι ἁπάντων
  english_pob_choice: to be over them all
  chosen_korean: 그들 모두 위에 있게 되는 데에
  alternatives_korean:
  - 그들 모두를 다스리게 되는 데에
  - 그들 모두를 관장하게 되는 데에
  lexicon: LSJ
  rationale: προΐστημι의 ‘위에 서서 다스리다’는 뜻을 살리기 위해, 단순한 ‘다스리다’보다 구조가 보이는 표현을 사용했습니다.
theological_decisions:
