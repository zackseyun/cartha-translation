base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/047.yaml
  text: And Simon accepted it[a], and agreed to be high priest and to be commander and ethnarch of the Jews and priests[c][b], and to be over them all.
  footnotes:
  - marker: a
    text: Or 'the Judeans.' The Greek Ἰουδαίων can refer to Jews as a people or to Judeans in a geo-ethnic sense.
    reason: lexical_alternative
  - marker: b
    text: '''Ethnarch'' is a historical political title, roughly a ruler or leader of a people.'
    reason: cultural_note
  - marker: c
    text: Or 'to preside over all of them' or 'to be in charge of them all.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 시몬은 이를 받아들였으며, 대제사장으로 섬기고 유대인들[a]과 제사장들의 군사령관이자 민족의 통치자[b]가 되며, 그들 모두를 주관하는 것[c]에 동의하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다 사람들’. 그리스어 Ἰουδαίων은 유대인이라는 민족적 의미나 유다 지역 사람이라는 지리·민족적 의미를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘민족의 통치자’는 역사적 정치 직함인 ἐθνάρχης를 옮긴 말입니다. 이는 대략 한 민족 또는 백성의 지도자·통치자를 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘그들 모두를 감독하는 것’ 또는 ‘그들 모두를 맡는 것’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
