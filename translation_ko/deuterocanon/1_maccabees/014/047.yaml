  text: And Simon accepted it[a], and agreed to be high priest and to be commander and ethnarch of the Jews and priests[c][b], and to be over them all.
  footnotes:
  - marker: a
    text: Or 'the Judeans.' The Greek Ἰουδαίων can refer to Jews as a people or to Judeans in a geo-ethnic sense.
    reason: lexical_alternative
  - marker: b
    text: '''Ethnarch'' is a historical political title, roughly a ruler or leader of a people.'
    reason: cultural_note
  - marker: c
    text: Or 'to preside over all of them' or 'to be in charge of them all.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 시몬은 그것을 받아들였으며, 대제사장이 되고, 유대인들과 제사장들의 장군이자 민족의 지도자가 되어 그들 모두 위에 있게 되는 데에 동의하였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유대 사람들’. 그리스어 Ἰουδαίων은 유대인이라는 민족적 의미나 유다 지역 사람들이라는 지리·민족적 의미를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘민족의 지도자’는 역사적 관직명 ἐθνάρχης의 기능을 설명한 번역입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘그들 모두를 주관하여’ 혹은 ‘그들 모두를 맡아’로 옮길 수 있습니다.
    reason: lexical_alternative
