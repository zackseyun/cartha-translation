  rationale: 고유 역사직함을 음역하면 독자가 의미를 놓칠 수 있어, 본문이 전달하는 공적 권위와 통치 기능을 우선해 설명적으로 옮겼습니다.
  doctrine_reference: translate titles; preserve historical sense
