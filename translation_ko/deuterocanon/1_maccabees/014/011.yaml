lexical_decisions:
- source_word: ἐποίησεν τὴν εἰρήνην
  english_pob_choice: He made peace
  chosen_korean: 평강을 이루었고
  alternatives_korean:
  - 평화를 만들었고
  - 평화를 세웠고
  lexicon: LSJ
  rationale: ποιέω가 εἰρήνην을 목적어로 취하므로 단순한 ‘만들다’의 힘을 살리되, 한국어에서는 ‘평강을 이루다’가 자연스럽고 상태의 형성을 잘 드러냅니다.
- source_word: ἐπὶ τῆς γῆς
  english_pob_choice: upon the land
  chosen_korean: 땅에
  alternatives_korean:
  - 그 땅에
  - 그 땅 위에
  lexicon: LSJ
  rationale: γῆ는 여기서 세계 전체보다 특정 지역의 ‘땅/영토’를 가리키므로, 한국어에서는 장소를 간결하게 드러내는 ‘땅에’가 적절합니다.
- source_word: ηὐφράνθη Ἰσραήλ εὐφροσύνην μεγάλην
  english_pob_choice: Israel rejoiced with great joy
  chosen_korean: 이스라엘은 큰 기쁨으로 기뻐했습니다
  alternatives_korean:
  - 이스라엘은 크게 기뻐했습니다
  - 이스라엘은 큰 즐거움으로 즐거워했습니다
  lexicon: LSJ
  rationale: ηὐφράνθη와 εὐφροσύνην μεγάλην의 반복적 기쁨 표현을 살리기 위해, 단순히 ‘기뻐했다’보다 ‘큰 기쁨으로 기뻐했습니다’가 중복된 강조를 반영합니다.
