  - marker: b
    text: That is, the sacred vessels or implements used in the sanctuary.
    reason: cultural_note
translation:
  language: ko
  text: 그는 거룩한 것들을 존귀하게 여기고, 성소의 기구들을 늘렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 성소를 영화롭게 했다’ 또는 ‘그는 거룩한 것들을 영예롭게 했다’. 그리스어 τὰ ἅγια는 ‘거룩한 것들’을 뜻할 수도 있고, 넓게는 ‘성소’를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 즉, 성소에서 사용하는 거룩한 그릇이나 도구들입니다.
    reason: cultural_note
lexical_decisions:
- source_word: τὰ ἅγια
  english_pob_choice: the holy things
  chosen_korean: 거룩한 것들
  alternatives_korean:
  - 성소
  - 성물
  lexicon: LSJ
  rationale: 중성 복수 τὰ ἅγια는 ‘거룩한 것들’로도, 확장되어 ‘성소’로도 이해될 수 있습니다. 여기서는 뒤에 성소의 기구들이 따로 나오므로, 앞절은 보다 넓은 의미를 살린 ‘거룩한 것들’로 옮겼습니다.
- source_word: ἐδόξασεν
  english_pob_choice: honored
  chosen_korean: 영화롭게 하고
  alternatives_korean:
  - 존귀하게 하고
  - 영광스럽게 하고
  lexicon: LSJ
  rationale: 동사는 문자적으로 ‘영광을 돌리다/영화롭게 하다’의 뜻이므로, 한국어에서는 고어적이거나 추상적인 표현보다 ‘영화롭게 하다’가 원뜻을 가장 직접적으로 드러냅니다.
- source_word: ἐπλήθυνεν
  english_pob_choice: increased
  chosen_korean: 더 많이 마련했습니다
  alternatives_korean:
  - 증가시켰습니다
  - 늘렸습니다
  lexicon: LSJ
  rationale: 성전 맥락에서 σκεύη는 단순 수량 증가보다 기구의 보충·증설을 가리킬 수 있으므로, ‘더 많이 마련했습니다’가 자연스러우면서도 기능적 의미를 살립니다.
- source_word: τὰ σκεύη τῶν ἁγίων
  english_pob_choice: the vessels of the sanctuary
  chosen_korean: 성소의 기구들
  alternatives_korean:
  - 성전의 그릇들
  - 거룩한 곳의 기구들
  lexicon: LSJ
  rationale: σκεύη는 예배에 쓰는 그릇이나 기구를 뜻하므로 ‘기구들’이 가장 무난합니다. 뒤의 τῶν ἁγίων은 문맥상 ‘성소’로 풀어 ‘성소의 기구들’로 옮겼습니다.
theological_decisions:
- issue: τὰ ἅγια의 의미 범위
  chosen_reading: 앞의 ‘거룩한 것들’과 뒤의 ‘성소의 기구들’을 구분해, 동일어 반복을 피하면서도 성물/성소의 연결을 보존했습니다.
  alternative_readings:
  - 두 절을 모두 ‘성소’ 중심으로 통일하는 번역
  - 앞절을 ‘성물’로 고정하는 번역
  rationale: 원문은 의도적으로 두 표현을 나란히 두어 성스러운 영역과 그에 속한 기구들을 함께 말합니다. 한국어에서도 그 긴장을 유지하는 것이 좋습니다.
  doctrine_reference: 성소와 성물에 대한 성경적 구별
