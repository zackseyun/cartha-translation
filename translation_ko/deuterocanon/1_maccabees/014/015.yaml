  source_fidelity: 원문의 두 동사 ἐδόξασεν과 ἐπλήθυνεν 및 목적어들을 충실히 반영합니다. 다만 ‘더 많이 마련했습니다’는 ‘수량을 늘렸다’는 ἐπλήθυνεν의 직접적 의미에 ‘새로 마련했다’는 뜻을 더하므로, ‘늘렸습니다’가 더 정확합니다. τὰ ἅγια는 본문에서 ‘거룩한 것들’로 유지하고, τῶν ἁγίων은 문맥상 ‘성소의’로 옮기되 각주로 대안을 보존하는 것이 적절합니다.
  naturalness: ‘영화롭게 하고’는 현대 표준 한국어에서 다소 문어적이고 ‘영광스럽게 만들다’로도 들릴 수 있습니다. 이 역사적·제의적 문맥에서는 ‘존귀하게 여기고’가 자연스럽고 ἐδόξασεν의 ‘존중하다/영예롭게 하다’라는 뜻을 잘 전달합니다.
  terminology: ‘성소’, ‘거룩한 것들’, ‘기구들’은 제의 문맥에 적절합니다. ‘기구들’은 σκεύη의 포괄적 의미를 살리며, 각주에서 그릇·도구라는 구체적 뜻을 밝혀 주면 충분합니다.
