  text: And in Rome[a], and even as far as Sparta, they heard that Jonathan had died, and they were deeply grieved.
  footnotes:
  - marker: a
    text: 'Greek has a singular verb (''heard'') before the plural ''they were grieved.'' The translation renders the sense collectively: the people in Rome, and as far as Sparta, heard the news.'
    reason: textual_variant
translation:
  language: ko
  text: 로마와 스파르타에 이르기까지 사람들이[a] 요나단이 죽었다는 소식을 듣고 몹시 슬퍼하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문에는 ἤκουσεν(‘들었다’)이라는 단수형이 뒤의 복수형 ἐλυπήθησαν(‘슬퍼하였다’)과 함께 나타납니다. 여기서는 로마와 스파르타의 사람들을 가리키는 집단적 의미로 옮겼습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἤκουσεν
  english_pob_choice: they heard
  chosen_korean: 그들은 ... 들었고
  alternatives_korean:
  - 듣게 되었습니다
  - 소식을 들었습니다
  lexicon: LSJ
  rationale: 그리스어 단수 동사이지만, 뒤의 복수 동사와 도시 범위를 고려하면 집단적 수신을 뜻하므로 한국어에서는 자연스럽게 복수 주어로 옮겼습니다.
- source_word: ἐν Ῥώμῃ
  english_pob_choice: in Rome
  chosen_korean: 로마에서도
  alternatives_korean:
  - 로마에서
  - 로마 안에서도
  lexicon: LSJ
  rationale: ἐν의 장소 표지를 살리되, 앞뒤의 확장 범위를 고려해 ‘-에서도’로 옮겨 들은 곳의 범위를 자연스럽게 드러냈습니다.
- source_word: καὶ ἕως Σπάρτης
  english_pob_choice: and as far as Sparta
  chosen_korean: 심지어 스파르타까지도
  alternatives_korean:
  - 스파르타까지도
  - 스파르타에 이르기까지
  lexicon: LSJ
  rationale: ἕως의 도달 범위를 한국어의 ‘까지도’로 살려, 로마뿐 아니라 스파르타에 이르는 넓은 소식을 표현했습니다.
- source_word: ἐλυπήθησαν σφόδρα
  english_pob_choice: they were deeply grieved
  chosen_korean: 매우 슬퍼했습니다
  alternatives_korean:
  - 몹시 슬퍼했습니다
  - 크게 근심했습니다
  lexicon: LSJ
  rationale: 강한 슬픔을 뜻하는 표현이지만 한국어에서는 ‘매우 슬퍼했습니다’가 가장 자연스럽고 본문의 감정 강도도 충분히 전달합니다.
