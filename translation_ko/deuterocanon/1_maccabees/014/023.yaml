review_pass:
  verdict: revise
  source_fidelity: 초안은 백성이 사절들을 예우하여 맞이하고 문서 사본을 공적 기록에 두었다는 큰 흐름을 반영합니다. 그러나 δέσθαι를 단순히 ‘기록해 두다’로, ἔγραψαν을 ‘써 보냈다’로 옮긴 것은 각각 ‘두다/보관하다’와 ‘써 주다’보다 구체화된 표현입니다. 특히 ‘보냈다’는 원문에 명시되지 않았습니다. 또한 μνημόσυνον의 목적어가 원문에서 명시되지 않는데 ‘그들을 기념하게’라고 한 것은 선행 대상을 확정합니다.
  naturalness: ‘스파르타 사람들의 백성’과 ‘존귀하게 맞이하다’는 현대 표준 한국어에서 다소 부자연스럽습니다. 공적·외교적 문맥에서는 ‘스파르타 백성’ 및 ‘예를 갖추어 맞이하다’가 자연스럽고 뜻도 정확합니다. ‘이를 기념으로 간직하게’는 앞의 문서 사본을 가리키되, 원문의 간결한 기념·기억의 목적을 유지합니다.
  terminology: ‘대제사장 시몬’은 적절합니다. ‘백성을 위해 정해 둔 책들’은 원문의 다소 불확정적인 제도 용어를 보존하며, 각주에서 공적 기록물이라는 역사적 기능을 설명하는 것이 적절합니다.
  issues:
  - severity: medium
    issue: ‘그들을 기념하게’가 μνημόσυνον의 불명시적 대상을 사절들로 확정합니다.
    rationale: 그리스어는 ‘스파르타 백성이 기념물을/기억을 갖도록’이라고 할 뿐, 기념의 직접 대상을 명시하지 않습니다. 문서 사본을 가리키는 ‘이를 기념으로 간직하게’가 문맥에는 맞으면서도 불필요한 인물 지정을 피합니다.
  - severity: medium
    issue: ‘써 보냈습니다’가 ἔγραψαν에 ‘발송’의 의미를 추가합니다.
    rationale: 원문은 사본을 시몬에게 ‘썼다’고만 합니다. 전달·발송을 명시하지 않는 ‘써 주었습니다’가 더 충실합니다.
  - severity: low
    issue: ‘스파르타 사람들의 백성’과 ‘존귀하게 맞이하다’의 어색한 표현입니다.
