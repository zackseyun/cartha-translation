  lexicon: LSJ
  rationale: 공적 결의의 관용 표현을 자연스럽게 옮기되, 단순 감정보다 결정의 수용과 승인을 드러내기 위해 '좋게 여겼다'를 택했습니다.
- source_word: ἐνδόξως
