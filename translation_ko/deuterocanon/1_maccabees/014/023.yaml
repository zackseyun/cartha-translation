  text: καὶ ἤρεσεν τῷ δήμῳ ἐπιδέξασθαι τοὺς ἄνδρας ἐνδόξως, καὶ τοῦ δέσθαι τὸ ἀντίγραφον τῶν λόγων αὐτῶν ἐν τοῖς ἀποδεδειγμένοις τῷ δήμῳ βιβλίοις, τοῦ μνημόσυνον ἔχειν τὸν δῆμον τῶν Σπαρτιατῶν· τὸ δὲ ἀντίγραφον τούτων ἔγραψαν Σίμωνι τῷ ἀρχιερεῖ.
