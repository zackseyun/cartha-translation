  - 존중하여
  lexicon: LSJ
  rationale: 공적·예우적 뉘앙스를 살리면서 현대 한국어에서 자연스러운 표현으로 '존귀하게'를 사용했습니다.
- source_word: ἐν τοῖς ἀποδεδειγμένοις τῷ δήμῳ βιβλίοις
  english_pob_choice: in the public records of the people
  chosen_korean: 백성을 위해 지정된 책들에
  alternatives_korean:
