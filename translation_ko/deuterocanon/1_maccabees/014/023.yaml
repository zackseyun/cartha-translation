  lexicon: LSJ
  rationale: 직역하면 '백성을 위해/에게 지정된 책들'이 되며, POB 주석의 공식 기록 보관소 의미를 반영해 너무 현대적 행정용어로 바꾸지 않으면서도 독자가 이해할 수 있게 했습니다.
- source_word: τοῦ μνημόσυνον ἔχειν
  english_pob_choice: so that the people ... might have a memorial
  chosen_korean: …를 기념하게 하였으며
  alternatives_korean:
  - …를 기억하게 하였으며
