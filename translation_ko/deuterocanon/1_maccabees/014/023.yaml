  rationale: μνημόσυνον의 핵심인 '기억/기념'을 살리되, 기록 목적 문맥에 맞게 '기념하게 하다'로 자연스럽게 옮겼습니다.
- source_word: τὸν δῆμον τῶν Σπαρτιατῶν
  english_pob_choice: the people of the Spartans
  chosen_korean: 스파르타 사람들의 백성
  alternatives_korean:
  - 스파르타 사람들
  - 스파르타인의 백성
  - 스파르타 백성
  lexicon: LSJ
  rationale: 그리스어의 'δήμος + 속격' 구조를 반영해 POB의 구조적 의미를 유지하되, 한국어에서는 자연스럽게 읽히도록 했습니다.
theological_decisions:
- issue: 공적 기록 보존과 기념의 목적
  chosen_reading: 이 사건은 단순한 통지문이 아니라 공동체의 공식 기록 속에 보존하여 후대가 기억하도록 하는 행위로 이해했습니다.
  alternative_readings:
  - 단순히 서신을 보관했다
  - 외교적 예우를 표시했다
  rationale: 문장 전체가 '책들에 기록'과 '기념'을 함께 말하므로, 기억을 제도화하는 공적 성격을 드러내는 것이 원문 의도에 가장 가깝습니다.
  doctrine_reference: 공동체 기억과 역사 보존의 성격
