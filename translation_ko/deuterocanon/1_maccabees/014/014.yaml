  source_fidelity: 대체로 원문에 충실합니다. 다만 ἐξεζήτησεν은 단순히 ‘찾았다’보다 의도적이고 힘써 അന്വേഷ하는 뜻이므로 ‘힘써 살폈습니다’가 더 적절합니다. ἄνομον은 앞의 νόμος와 어휘적으로 연결되어 있으므로 ‘율법을 어기고’로 자연스럽게 드러낼 수 있습니다.
  naturalness: ‘모든 불법하고 악한 것’은 현대 한국어에서 어색한 결합입니다. 또한 두 각주가 문장 끝에 함께 붙어 있어 각주가 가리키는 낱말이 불분명합니다.
  terminology: ‘율법’은 τὸν νόμον의 문맥상 적절합니다. ‘겸손한 이들’은 ταπεινούς의 도덕적·사회적 폭을 유지하며, 각주가 사회적 낮음의 가능성을 보완합니다.
