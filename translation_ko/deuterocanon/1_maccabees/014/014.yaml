base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/014.yaml
  text: And he strengthened all the humble of his people[a]; he sought out the law[b], and removed every lawless and evil thing.
  footnotes:
  - marker: a
    text: Or 'all the lowly of his people.' The Greek can point to those of humble status as well as the humble in disposition.
    reason: lexical_alternative
  - marker: b
    text: '''The law'' likely refers to the ancestral Jewish law, that is, the Torah.'
    reason: cultural_note
translation:
  language: ko
  text: 그는 자기 백성의 모든 겸손한 이들을 굳게 세웠습니다. 그는 율법을 찾았고, 모든 불법하고 악한 것을 제거했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘겸손한 이들’은 그리스어의 뜻을 따라 사회적으로 낮은 처지의 사람들까지 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘율법’은 유대인의 조상적 율법, 곧 토라를 가리키는 것으로 이해됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἐστήρισεν
  english_pob_choice: strengthened
  chosen_korean: 굳게 세웠습니다
  alternatives_korean:
  - 강화했습니다
  - 튼튼하게 했습니다
  - 굳게 하셨습니다
  lexicon: LSJ
  rationale: ἵστημι 계열의 여기서는 ‘굳게 하다/세우다’가 자연스럽고, 공동체를 안정시키는 통치 행위라는 뉘앙스를 살리면서 ‘strengthened’의 힘을 보존합니다.
- source_word: πάντας τοὺς ταπεινοὺς
  english_pob_choice: all the humble
  chosen_korean: 모든 겸손한 이들
  alternatives_korean:
  - 모든 낮은 이들
  - 모든 낮은 사람들
  - 모든 겸손한 사람들
  lexicon: LSJ
  rationale: ταπεινός는 사회적으로 낮은 처지와 내면의 겸손을 함께 가리킬 수 있으므로, POB의 의미 폭을 살려 ‘겸손한 이들’로 옮기되 인격체를 분명히 하기 위해 ‘이들’을 붙였습니다.
- source_word: τὸν νόμον
  english_pob_choice: the law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 율례
  - 그 율법
  lexicon: LSJ
  rationale: 1 Maccabees의 νόμος는 문맥상 조상들의 유대 율법, 곧 토라를 가리키므로 프로젝트 기본어인 ‘율법’이 가장 직접적입니다.
- source_word: ἐξῆρεν πάντα ἄνομον καὶ πονηρόν
  english_pob_choice: removed every lawless and evil thing
  chosen_korean: 모든 불법하고 악한 것을 제거했습니다
  alternatives_korean:
  - 모든 불법하고 악한 것을 없앴습니다
  - 모든 율법 없는 것과 악한 것을 제거했습니다
  - 모든 불법하고 사악한 것을 제거했습니다
  lexicon: LSJ
  rationale: ἄνομος와 πονηρός를 각각 ‘불법한/악한’으로 대응시켜 νόμος와의 연결을 유지했고, neuter substantival 구조를 한국어의 ‘것’을 통해 자연스럽게 살렸습니다.
theological_decisions:
- issue: ταπεινοὺς를 사회적 ‘낮은 사람들’로만 좁힐지, 도덕적 ‘겸손한 이들’로 남길지
  chosen_reading: 겸손한 이들
  alternative_readings:
  - 낮은 이들
  - 가난한 이들
  - 억눌린 이들
  rationale: 그리스어는 사회적 지위와 내적 태도를 함께 열어두므로, 한쪽으로만 축소하지 않고 ‘겸손한 이들’로 두어 의미의 긴장을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
- issue: νόμος를 ‘율법’으로 옮길 때 그 배경을 노골적으로 해석할지
  chosen_reading: 율법
  alternative_readings:
  - 율법(토라)
  - 법
  rationale: 본문 자체는 설명을 덧붙이지 않지만, 1 Maccabees의 역사적·유대적 맥락상 토라를 가리키므로 본문에는 간결하게 ‘율법’을 두고, 문화적 의미는 주석으로 남기기 적합합니다.
  doctrine_reference: 'DOCTRINE.md: Original-language primacy over translation tradition; readable modern Korean'
