translation:
  language: ko
  text: 각 사람은 자기 포도나무와 자기 무화과나무 아래에 앉았고, 그들을 두렵게 하는 사람은 아무도 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 표현은 평화와 안전을 뜻하는 성경적 관용구를 반영합니다. 1열왕기 4:25, 미가 4:4를 보십시오.
    reason: cross_reference
lexical_decisions:
- source_word: ἐκάθισεν
  english_pob_choice: sat
  chosen_korean: 앉았고
  alternatives_korean:
  - 머물렀고
  - 정착했고
  lexicon: LSJ
  rationale: 가시적 동작인 ‘앉다’를 살리면 평안 속의 안식이라는 관용적 이미지를 보존하면서도 과도한 해석을 피할 수 있습니다.
- source_word: ἕκαστος
  english_pob_choice: each
  chosen_korean: 각 사람은
  alternatives_korean:
  - 각자
  - 모두가
  lexicon: LSJ
  rationale: 분배적 의미를 자연스럽게 드러내면서, 문맥상 집단 전체의 안전을 한 사람씩 누렸다는 점을 분명히 합니다.
- source_word: ὑπὸ τὴν ἄμπελον αὐτοῦ καὶ τὴν συκῆν αὐτοῦ
  english_pob_choice: under his own vine and his own fig tree
  chosen_korean: 자기 포도나무 아래와 자기 무화과나무 아래
  alternatives_korean:
  - 자기 포도덩굴 아래와 자기 무화과나무 아래
  - 자기 포도나무와 무화과나무 아래
  lexicon: LSJ
  rationale: 히브리어 성경의 평화 관용구를 그대로 살리기 위해 ‘포도나무/무화과나무 아래’의 구체적 농경 이미지를 유지했습니다.
- source_word: οὐκ ἦν ὁ ἐκφοβῶν αὐτούς
  english_pob_choice: there was no one to frighten them
  chosen_korean: 그들을 두려워하게 하는 사람은 아무도 없었습니다
  alternatives_korean:
  - 그들을 겁주는 사람은 아무도 없었습니다
  - 그들을 무서워하게 하는 자는 없었습니다
  lexicon: LSJ
  rationale: 분사구문의 동사적 기능을 살려 ‘두려워하게 하는 사람’으로 옮기면 원문의 ‘두려움에 빠뜨리는 자’라는 뜻을 자연스럽게 전달합니다.
theological_decisions:
- issue: ‘under his vine and his fig tree’의 관용구 보존
  chosen_reading: 직역에 가까운 농경 이미지를 본문에 유지했습니다.
  alternative_readings:
  - 일반화하여 ‘평안과 안전 가운데’로 풀어쓰기
  rationale: 이 표현은 성경 전체에서 평화와 안전을 가리키는 익숙한 관용구이므로, 본문에서 이미지를 유지해야 상호본문적 울림이 살아납니다.
  doctrine_reference: Translation philosophy §§1, 6
