lexical_decisions:
- source_word: ἐπλάτυνεν
  english_pob_choice: enlarged
  chosen_korean: 넓히고
  alternatives_korean:
  - 확장하고
  - 넓혔으며
  lexicon: LSJ
  rationale: πλατύνω의 기본 뜻인 ‘넓게 하다’를 살리면서, 영토 확장의 문맥에서는 자연스러운 동사형 ‘넓히다’를 택했습니다.
- source_word: τὰ ὅρια
  english_pob_choice: the borders
  chosen_korean: 경계
  alternatives_korean:
  - 국경
  - 경계선
  - 영토
  lexicon: LSJ
  rationale: ὅρια는 경계·경계선의 뜻이 있어, 정치적 확장 문맥에서 ‘경계’가 가장 직접적으로 대응합니다.
- source_word: τῷ ἔθνει αὐτοῦ
  english_pob_choice: of his nation
  chosen_korean: 자기 민족의
  alternatives_korean:
  - 자기 백성의
  - 자기 나라의
  lexicon: LSJ
  rationale: ἔθνος는 여기서 국가보다 민족/민족 집단의 뉘앙스가 살아 있어, ‘자기 민족’으로 옮겼습니다.
- source_word: ἐκράτησεν τῆς χώρας
  english_pob_choice: gained control of the land
  chosen_korean: 그 땅을 장악했습니다
  alternatives_korean:
  - 그 땅을 차지했습니다
  - 그 지역을 지배했습니다
  lexicon: LSJ
  rationale: κρατέω + 속격은 ‘권세를 잡다, 통제하다’의 뜻이므로, 단순 소유보다 지배·통제를 드러내는 ‘장악하다’가 적절합니다.
