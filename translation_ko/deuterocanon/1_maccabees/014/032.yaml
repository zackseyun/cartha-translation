translation:
  language: ko
  text: 그때 시몬이 일어났고[b], 자기 민족[a]을 위해 싸웠으며, 자기 재산을 많이 들여 자기 민족의 군대에 속한 병사들을 무장시키고 그들에게 급료를 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ἔθνος는 여기서 ‘백성’으로도 옮길 수 있습니다. 문맥에서 집단적·정치적 의미를 보존하기 위해 ‘민족’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 본문에 인쇄된 그리스어 형태 ἀνέστησενσεν은 전사나 인쇄 과정에서 음절이 중복된 것으로 보입니다. 뜻은 시몬이 ‘일어났다’ 또는 ‘나섰다’입니다.
    reason: textual_variant
