  text: After these things Simon sent Numenius to Rome[a], carrying a large gold shield weighing a thousand minas, to establish the alliance with them.
  footnotes:
  - marker: a
    text: A mina was an ancient unit of weight; the phrase indicates an exceptionally heavy and valuable diplomatic gift.
    reason: cultural_note
translation:
  language: ko
  text: 이 일 후에 시몬은 누메니오스를 로마에 보내면서, 무게가 천 므나나 되는 큰 금방패를 들려 그들과의 동맹을 확정하게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 므나는 고대의 중량 단위로, 여기서는 매우 무겁고 값진 외교 선물을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: Μετὰ ταῦτα
  english_pob_choice: After these things
  chosen_korean: 이 일 후에
  alternatives_korean:
  - 그 후에
  - 이런 일 뒤에
  lexicon: LSJ
  rationale: 복수 지시어의 서술적 연결을 살리면서도, 현대 한국어에서 자연스러운 시간 전환으로 옮겼습니다.
- source_word: ἔχοντα ἀσπίδα χρυσῆν μεγάλην
  english_pob_choice: carrying a large gold shield
  chosen_korean: 큰 금방패를 들려
  alternatives_korean:
  - 큰 금으로 된 방패를 가지고
  - 큰 황금 방패를 지니고
  lexicon: LSJ
  rationale: ἀσπίδα는 구체적인 방패이므로 ‘방패’로 옮기고, ἔχοντα는 사절이 운반한 물품이라는 문맥에 맞게 ‘들려’로 자연스럽게 표현했습니다.
- source_word: ὁλκὴν μνῶν χιλίων
  english_pob_choice: weighing a thousand minas
  chosen_korean: 무게가 천 므나나 되는
  alternatives_korean:
  - 천 므나의 무게가 나가는
  - 천 므나를 달하는
  lexicon: LSJ
  rationale: ὁλκή는 무게를 뜻하므로 ‘무게가 … 되는’으로 풀었고, μνᾶ를 음역해 고대 중량 단위를 보존했습니다.
- source_word: εἰς τὸ στῆσαι πρὸς αὐτοὺς τὴν συμμαχίαν
  english_pob_choice: to establish the alliance with them
  chosen_korean: 그들과의 동맹을 확정하게 하였습니다
  alternatives_korean:
  - 그들과의 동맹을 세우게 하였습니다
  - 그들과의 동맹을 공고히 하게 하였습니다
  lexicon: LSJ
  rationale: στῆσαι는 단순히 ‘세우다’보다 이미 맺어진 관계를 공식적으로 확정하는 뉘앙스가 있어, 외교 문맥에 맞게 ‘확정하다’로 옮겼습니다.
theological_decisions:
- issue: 외교 문맥의 συμμαχία 번역
  chosen_reading: ‘동맹’으로 번역해 정치·군사적 연합의 성격을 분명히 했습니다.
  alternative_readings:
  - 친교
  - 조약
  rationale: 문맥상 로마와의 공식 외교 관계를 가리키므로, 한국어에서도 제도적·정치적 의미가 드러나는 표현이 적절합니다.
  doctrine_reference: 역사 서술의 외교 용어 처리
- issue: 보상적 사절단의 목적 표현
  chosen_reading: ‘들려 … 확정하게 하였습니다’로 목적과 행위를 분리해 옮겼습니다.
  alternative_readings:
  - 가지고 가서 동맹을 세우게 하였습니다
  - 들고 가서 동맹을 맺게 하였습니다
  rationale: 원문의 부정사 목적구를 한국어에서 자연스럽게 풀어, 방패의 운반과 동맹 확정의 목적을 모두 보존했습니다.
  doctrine_reference: 서사 문장 구조
