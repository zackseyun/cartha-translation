  source_fidelity: 원문의 목적 표현 εἰς τὸ στῆσαι ... τὴν συμμαχίαν은 로마인들과 동맹을 ‘세우다/맺다’라는 뜻입니다. 초안의 ‘확정하게’는 기존 동맹을 공식적으로 재확인한다는 전제를 더하므로 피하는 것이 안전합니다. 방패를 지닌 채 보낸다는 ἔχοντα의 의미와 천 므나의 무게도 보존되어야 합니다.
  naturalness: ‘로마에 보내면서’와 ‘들려 … 하였습니다’의 결합은 다소 어색하고, 사절 파견의 목적이 흐려집니다. ‘로마로 보내어 … 가지고 가서 … 맺게 하였습니다’는 현대 표준 한국어 합쇼체에서 자연스럽고, 운반·목적의 관계도 분명합니다.
  terminology: 시몬, 누메니오스, 로마, 므나, 방패, 동맹은 적절합니다. ‘금방패’도 자연스럽게 금으로 된 방패를 뜻합니다. 문화 주석은 영어 감사 기록의 내용을 충실히 반영합니다.
  issues:
