    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέλιπεν πολεμῶν
  english_pob_choice: ceased fighting
  chosen_korean: 전쟁하는 일을 그치게 하였고
  alternatives_korean:
  - 싸우는 일을 멈추게 하였고
  - 전쟁을 중단하게 하였고
  lexicon: LSJ; BDAG
  rationale: ἐξέλιπεν은 단순 소멸이 아니라 중지의 뜻이며, πολεμῶν과 함께 ‘전쟁/싸움 행위를 그치다’라는 의미가 됩니다. 한국어에서는 행위성을 살리기 위해 ‘전쟁하는 일을 그치게 하다’로 옮겼습니다.
- source_word: ἐπὶ τῆς γῆς
  english_pob_choice: in the land
  chosen_korean: 이 땅에서
  alternatives_korean:
  - 땅 위에서
  - 이 지역에서
  lexicon: LSJ
  rationale: γῆ는 문맥상 전 지구보다 영토를 가리키는 ‘땅/지역’의 뜻이 자연스럽습니다. 영어 POB의 주석 취지를 반영해 한국어도 영토적 의미를 살렸습니다.
- source_word: οἱ βασιλεῖς αὐτῶν
  english_pob_choice: their kings
  chosen_korean: 그들의 왕들은
  alternatives_korean:
  - 그 왕들은
  - 그들의 통치자들은
  lexicon: LSJ
  rationale: 복수 소유대명사와 명사를 직역해 관계를 분명히 했습니다. ‘왕들’이란 표면적 호칭을 유지하는 것이 본문의 정치적 어조에 가깝습니다.
- source_word: συνετρίβησαν
  english_pob_choice: were crushed
  chosen_korean: 부서졌습니다
  alternatives_korean:
  - 산산이 부서졌습니다
  - 짓눌렸습니다
  - 꺾였습니다
  lexicon: LSJ
  rationale: συντρίβω는 결정적 패배와 파괴를 뜻합니다. 한국어 ‘부서지다’는 군사적 붕괴를 강하게 살리면서도 자연스럽게 읽힙니다.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  english_pob_choice: in those days
  chosen_korean: 그 날들에
  alternatives_korean:
  - 그때에
  - 그 시대에
  lexicon: LSJ
  rationale: 시간 표현을 간결하게 유지해 서술 흐름을 해치지 않도록 했습니다. 복수형의 뉘앙스를 살려 ‘그 날들에’로 옮겼습니다.
theological_decisions:
- issue: 1인칭 서술자 없이 역사 서술의 행위 주체를 어떻게 드러낼지
  chosen_reading: 문장 시작을 ‘그리고 그가’로 처리해 앞 문맥의 단일 행위 주체를 자연스럽게 이어 받았습니다.
  alternative_readings:
  - 그리고 그가
  - 그리고 그분이
  rationale: 본문은 서술 주체를 별도로 설명하지 않고 앞 문맥에 의존합니다. 한국어에서도 대명사 연결을 유지해 역사 서술의 연속성을 보존했습니다.
  doctrine_reference: 문맥 결속 및 서술 일관성
- issue: γῆ의 범위를 어떻게 이해할지
  chosen_reading: ‘이 땅’으로 옮겨 지역적·역사적 범위를 드러냈습니다.
  alternative_readings:
  - 땅
  - 세상
  - 온 땅
  rationale: 1 Maccabees의 정치·군사적 문맥에서는 보편적 ‘세상’보다 특정 영토를 가리키는 이해가 본문 의도에 더 가깝습니다.
  doctrine_reference: 문맥 의미론
