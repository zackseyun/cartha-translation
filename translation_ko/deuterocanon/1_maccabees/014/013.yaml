    rationale: ἐξέλιπεν은 주어가 전쟁 행위를 그쳤다는 뜻이며, 전쟁 또는 타인을 그치게 했다는 사역 의미가 아닙니다.
  - severity: medium
    issue: ‘이 땅’의 무근거 지시성
    rationale: τῆς γῆς에는 ‘이’에 해당하는 지시사가 없습니다. 앞 문맥에 연관된 영토라는 해석은 가능하지만 한국어 본문에서는 ‘그 땅’이 더 절제되고 충실합니다.
