base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/026.yaml
  text: For he and his brothers and his father's house stood firm[a], and they fought the enemies of Israel away from them, and established freedom for him, and recorded it on bronze tablets, and set them on a pillar on Mount Zion.
  footnotes:
  - marker: a
    text: Or 'secured liberty for it,' referring to Israel as a nation; the Greek reads literally 'for him.'
    reason: alternative_reading
translation:
  language: ko
  text: 그와 그의 형제들과 그의 아버지의 집안은 굳건히 섰으며, 이스라엘의 원수들을 이스라엘에서 몰아내고, 이스라엘에[a] 자유를 확립해 주었으며, 이를 청동판들에 기록하여 시온 산에 있는 기둥 위에 두었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게 자유를 확립해 주었다.’ 그리스어는 문자적으로 남성 단수인 ‘그에게’라고 되어 있으며, 문맥상 이스라엘을 가리키는 것으로 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐστήρισεν
  english_pob_choice: stood firm
  chosen_korean: 굳건히 섰고
  alternatives_korean:
  - 굳세게 섰고
  - 견고해졌고
  - 굳게 서 있었고
  lexicon: LSJ
  rationale: 단순히 ‘강하게 했다’보다 주체들의 충성/지속성을 드러내는 ‘굳건히 섰다’가 군사·정치적 문맥에 더 자연스럽고 원문의 능동적 지속을 살립니다.
- source_word: οἱ ἀδελφοὶ αὐτοῦ / ὁ οἶκος τοῦ πατρὸς αὐτοῦ
  english_pob_choice: his brothers / his father's house
  chosen_korean: 그의 형제들과 그의 아버지의 집안
  alternatives_korean:
  - 그의 형제들과 그의 아버지의 집
  - 그의 형제들과 그의 조상 집안
  lexicon: LSJ
  rationale: ‘아버지의 집’의 셈어적 표현을 한국어에서 바로 읽히는 ‘집안’으로 옮겨, 단순 가옥이 아니라 가족·가문 전체를 가리키는 뉘앙스를 보존했습니다.
- source_word: τοὺς ἐχθροὺς Ἰσραὴλ ἀπʼ αὐτῶν
  english_pob_choice: the enemies of Israel away from them
  chosen_korean: 이스라엘의 원수들을 그들로부터 몰아내어
  alternatives_korean:
  - 이스라엘의 원수들을 그들에게서 몰아내어
  - 이스라엘의 원수들을 그들 곁에서 쫓아내어
  - 이스라엘의 원수들을 그들로부터 물리쳐
  lexicon: LSJ
  rationale: ἀπό의 분리 의미를 살려 적대 세력이 ‘그들로부터’ 떨어져 나가게 하는 공간적·보호적 의미를 분명히 했습니다.
- source_word: ἔστησαν αὐτῷ ἐλευθερίαν
  english_pob_choice: established freedom for him
  chosen_korean: 그들을 위해 자유를 세우고
  alternatives_korean:
  - 그를 위해 자유를 세우고
  - 그들에게 자유를 세우고
  - 그에게 자유를 확립하고
  lexicon: LSJ
  rationale: 문맥상 이 자유는 이스라엘 공동체를 향한 것이므로, 영어 POB의 싱귤러 대명사 긴장은 유지하지 않되 한국어에서는 복수 지시로 풀어 자연스럽게 읽히게 했습니다.
- source_word: κατέγραψαν ἐν δέλτοις χαλκαῖς
  english_pob_choice: recorded it on bronze tablets
  chosen_korean: 놋판에 기록하여
  alternatives_korean:
  - 놋판들에 기록하여
  - 청동판에 기록하여
  - 놋으로 된 판에 새겨
  lexicon: LSJ
  rationale: δέλτοις χαλκαῖς의 기록 매체를 한국어 성서 문체에 맞는 ‘놋판’으로 옮겨, ‘기록하다’와 함께 공적 문서화의 성격을 살렸습니다.
- source_word: ἔθεντο ἐν στήλῃ ἐν ὄρει Σιών
  english_pob_choice: set them on a pillar on Mount Zion
  chosen_korean: 시온 산의 기둥 위에 두었습니다
  alternatives_korean:
  - 시온 산의 기둥에 두었습니다
  - 시온 산의 석주 위에 두었습니다
  - 시온 산에 있는 기둥 위에 두었습니다
  lexicon: LSJ
  rationale: στήλη를 ‘기둥’으로 옮겨 일반 독자가 이해할 수 있게 하면서, 공적인 기념 비문을 세운 행위를 유지했습니다.
theological_decisions:
- issue: ἀπʼ αὐτῶν의 분리 방향과 집단적 보호 의미
  chosen_reading: 원수들이 이스라엘 공동체로부터 떨어져 나가게 하는 보호적·군사적 의미로 읽었습니다.
  alternative_readings:
  - 단순히 '그들을 쳤다'는 전투 결과 중심 읽기
  - 공간적 분리 없이 단순한 승리 진술로 완화하는 읽기
  rationale: 원문은 단순 전투 성공보다 적대 세력이 공동체로부터 제거되는 결과를 강조하므로, 분리 의미를 살려 번역해야 합니다.
  doctrine_reference: 원문 공간 의미 보존과 공동체적 구원 서술 유지
- issue: αὐτῷ의 단수 대명사 긴장
  chosen_reading: 한국어 본문은 문맥에 따라 공동체 지시로 풀어 '그들을 위해'라고 옮겼습니다.
  alternative_readings:
  - '''그에게''로 직역하여 개인 지시를 유지하는 읽기'
  - '''그것에''로 비인격화하여 나라를 가리키는 읽기'
  rationale: 그리스어 단수 대명사는 문맥상 이스라엘 공동체를 대표하는 집합적 지시로 볼 수 있으므로, 한국어에서는 의미를 명료하게 하되 원문의 공적·국가적 범위를 보존했습니다.
  doctrine_reference: 집합명사/대표적 단수의 번역 처리
