review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안은 첫 두 절의 임명과 왕국 업무의 뜻을 대체로 반영하지만, οἱ ἐπʼ αὐτῶν은 앞서 언급된 사람들 ‘위에 있는 자들’이라는 관계를 유지해야 합니다. 또한 현재의 ‘살게 하십시오’는 왕에게 드리는 청원처럼 들리며, 원문의 3인칭 명령법(‘그들이 … 하게 하라’)과 왕의 칙령 문맥에 맞지 않습니다. 마지막 문장은 앞 명령에 이어지는 비교절이므로 독립된 ‘것과 같습니다’보다 ‘… 명령하신 대로 하게 하라’로 결속하는 것이 정확합니다.
  naturalness: ‘나라의 필요를 맡되’는 한국어 행정 문맥에서 다소 직역투이므로 ‘왕국의 업무를 맡도록’이 자연스럽습니다. εἰς πίστιν은 여기서 직무상 신뢰성을 가리키므로 ‘신실한 자들’보다 ‘신뢰할 만한 사람들’이 현대 한국어에서 더 정확하고 비신학적입니다. ‘큰 요새들’도 가능하나 군사·행정 시설을 가리키는 문맥에서는 ‘주요 요새들’이 자연스럽습니다.
  terminology: κατασταθήσεται는 ‘임명되다’로 유지할 수 있습니다. ὀχυρώματα는 ‘요새’, ἄρχοντες는 ‘통치자들’로 옮겨 행정적 권위의 뜻을 보존했습니다. ‘그들 자신의 법’은 민족·공동체의 법을 뜻할 수 있으나 원문이 특정 집단을 명시하지 않으므로 ‘자기들의 법’으로 유지했습니다.
  issues:
  - severity: medium
    issue: 3인칭 명령법을 2인칭 존대 명령 ‘살게 하십시오’로 옮김
    rationale: ἔστωσαν과 πορευέσθωσαν은 ‘그들이 … 하게 하라’라는 칙령/명령의 3인칭 형식입니다. ‘하십시오’는 청자에게 직접 요청하는 표현이 되어 화행과 문체가 바뀝니다.
  - severity: medium
    issue: 마지막 비교절이 독립문으로 처리되어 명령의 범위가 약화됨
    rationale: καθὰ καὶ προσέταξεν ὁ βασιλεὺς는 앞의 ‘자기들의 법에 따라 살게 하라’를 수식합니다. ‘왕이 유다 땅에서 명령하신 대로’로 앞 문장에 연결해야 합니다.
  - severity: medium
    issue: εἰς πίστιν을 ‘신실한 자들’로 번역함
    rationale: 이 문맥은 왕국의 업무를 맡을 사람의 행정적 신뢰성에 관한 것이며, ‘신실한’은 종교적·도덕적 충성의 뉘앙스를 불필요하게 불러올 수 있습니다. ‘신뢰할 만한 사람들’이 더 적절합니다.
  - severity: low
    issue: ἐπὶ χρειῶν τῆς βασιλείας의 ‘필요’를 문자적으로 유지함
    rationale: 문법적으로 가능하지만 한국어에서는 ‘왕국의 업무/일’을 맡는다는 표현이 행정적 의미를 더 자연스럽게 전달합니다.
