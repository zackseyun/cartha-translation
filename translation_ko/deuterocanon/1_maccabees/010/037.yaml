base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/037.yaml
  text: And some of them shall be appointed in the king’s great strongholds[a], and from among them some shall be appointed over the needs of the kingdom, being trustworthy; and let those over them and the rulers be from among them, and let them live by their own laws[b], just as the king commanded in the land of Judah.
  footnotes:
  - marker: a
    text: Or 'for the affairs/business of the kingdom.' The Greek phrase 'over the needs of the kingdom' can refer broadly to administrative responsibilities.
    reason: lexical_alternative
  - marker: b
    text: Or 'walk according to their laws.' The Greek idiom uses 'go/walk' with laws to mean conduct life in accordance with them.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 그들 가운데 몇 사람은 왕의 주요 요새들에 임명될 것이며, 그들 가운데 몇 사람은 신뢰할 만한 사람들로서 왕국의 업무를 맡도록 임명될 것입니다. 그들 위에 있는 자들과 통치자들도 그들 가운데서 나오게 하고, 왕이 유다 땅에서 명령하신 대로 그들이 자기들의 법에 따라 살게 하라.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 ‘그들이 자기들의 법에 따라 걸어가게 하라.’ 그리스어는 ‘가다/걷다’라는 동사를 법과 함께 사용하여, 그 법에 따라 삶과 행실을 이끌어 가는 것을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατασταθήσεται
  english_pob_choice: shall be appointed
  chosen_korean: 임명될 것이며
  alternatives_korean:
  - 세워질 것이며
  - 배치될 것이며
  lexicon: LSJ
  rationale: 행정·군사 문맥의 미래 수동은 직위에 ‘임명되다’는 뜻이 가장 자연스럽고 원문 기능을 잘 드러냅니다.
- source_word: ἐπὶ χρειῶν τῆς βασιλείας
  english_pob_choice: over the needs of the kingdom
  chosen_korean: 나라의 필요를 맡되
  alternatives_korean:
  - 나라의 일들을 맡되
  - 왕국의 업무를 맡되
  lexicon: LSJ
  rationale: χρεῖαι는 필요, 업무, 일들을 아우를 수 있으나, 여기서는 왕국 행정의 필요를 맡는다는 뜻을 살려 ‘필요를 맡다’로 옮겼습니다.
- source_word: οὖσιν εἰς πίστιν
  english_pob_choice: being trustworthy
  chosen_korean: 신실한 자들이 될 것이니
  alternatives_korean:
  - 신뢰할 만한 자들이 될 것이니
  - 믿을 만한 자들이 될 것이니
  lexicon: LSJ; BDAG
  rationale: 여기서 πίστις는 신앙이 아니라 직무 수행의 신뢰성을 뜻하므로, 행정 문맥에 맞게 ‘신실한’으로 옮겼습니다.
- source_word: πορευέσθωσαν τοῖς νόμοις αὐτῶν
  english_pob_choice: let them live by their own laws
  chosen_korean: 그들이 자기들의 법을 따라 살게 하십시오
  alternatives_korean:
  - 그들이 자기들의 법에 따라 행하게 하십시오
  - 그들이 자기들의 법대로 살게 하십시오
  lexicon: LSJ
  rationale: ‘가다/걷다’와 ‘법’의 관용구를 한국어에서 자연스러운 생활 준거 표현으로 풀되, 자기 법에 따라 사는 의미는 유지했습니다.
theological_decisions:
- issue: 고유한 민족법 허용을 명령하는 왕의 칙령을 어떻게 문체로 살릴지
  chosen_reading: 명령형 ‘살게 하십시오’와 직접 인용의 행정 칙령 문체를 유지했습니다.
  alternative_readings:
  - ‘살도록 하십시오’
  - ‘살게 하소서’
  rationale: 이 절은 기도문이 아니라 왕의 행정 명령이므로, 현대 합쇼체 명령으로 법령의 효력을 드러내는 것이 원문 의도에 가깝습니다.
  doctrine_reference: 'Translation philosophy: source-directed, register-sensitive rendering'
