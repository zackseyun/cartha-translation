revisions:
- from: 그리고 그들 가운데 몇 사람은 왕의 큰 요새들에 임명될 것이며, 그들 가운데서 몇 사람은 나라의 필요를 맡되 신실한 자들이 될 것이니, 그들 위에 있는 자들과 관리들도 그들 가운데서 나오게 하고, 그들이 자기들의 법을 따라 살게 하십시오[b]. 마치 왕이 유다 땅에서 명령한 것과 같습니다.
  to: 또 그들 가운데 몇 사람은 왕의 주요 요새들에 임명될 것이며, 그들 가운데 몇 사람은 신뢰할 만한 사람들로서 왕국의 업무를 맡도록 임명될 것입니다. 그들 위에 있는 자들과 통치자들도 그들 가운데서 나오게 하고, 왕이 유다 땅에서 명령하신 대로 그들이 자기들의 법에 따라 살게 하라.[b]
  rationale: 원문의 행정적 임명과 신뢰성의 뜻을 더 자연스러운 현대 한국어로 반영했습니다. 특히 원문의 3인칭 명령법과 비교절의 결속을 회복하여, 왕의 명령에 따라 자기들의 법을 따르도록 허용하는 칙령의 형식을 보존했습니다. ‘그들 위에 있는 자들’은 원문의 압축된 관계 표현을 과도하게 해석하지 않고 유지했습니다.
