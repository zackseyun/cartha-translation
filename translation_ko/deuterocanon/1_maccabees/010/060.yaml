base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/060.yaml
  text: And he went with splendor to Ptolemais[a], and met the two kings; and he gave them silver and gold, and many gifts to their friends[c][b], and found favor before them.
  footnotes:
  - marker: a
    text: Or 'with glory' or 'with pomp'; the Greek phrase μετὰ δόξης denotes a display of honor or magnificence in his arrival.
    reason: lexical_alternative
  - marker: b
    text: '''Friends'' may refer more specifically to royal associates or courtiers in a Hellenistic court setting.'
    reason: cultural_note
  - marker: c
    text: Or 'found favor with them' or 'won their favor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 위엄을 떨치며 프톨레마이스로 가서 두 왕을 만났습니다. 그리고 그들에게 은과 금을 주고, 그들의 친구들에게 많은 선물을 주었으며, 그들 앞에서 호의를 얻었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영광 가운데’, ‘장엄하게’, ‘화려하게’. 헬라어 μετὰ δόξης는 그의 도착이 공개적 위엄과 화려함을 띠었음을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘친구들’은 헬라어 궁정 문맥에서는 왕의 측근이나 궁정 인사를 가리킬 수 있습니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘그들의 호의를 얻었습니다’, ‘그들의 마음에 들었습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δόξης
  english_pob_choice: with splendor
  chosen_korean: 위엄을 떨치며
  alternatives_korean:
  - 영광 가운데
  - 장엄하게
  - 화려하게
  lexicon: LSJ
  rationale: δόξα가 여기서는 하나님의 ‘영광’이 아니라 왕실 행렬의 공개적 위엄과 장엄함을 가리키므로, 한국어에서는 자연스럽게 ‘위엄을 떨치며’로 옮겨 그 분위기를 살렸습니다.
- source_word: Πτολεμαΐδα
  english_pob_choice: Ptolemais
  chosen_korean: 프톨레마이스
  alternatives_korean:
  - 프톨레마이다
  - 프톨레마이스
  lexicon: 고유명사 표기
  rationale: 지명은 현대 외래어 표기 관례에 따라 음역했고, 한국어 성경 문맥에서 읽기 쉬운 ‘프톨레마이스’를 채택했습니다.
- source_word: τοῖς δυσὶν βασιλεῦσιν
  english_pob_choice: the two kings
  chosen_korean: 두 왕
  alternatives_korean:
  - 두 임금
  - 양쪽 왕
  lexicon: LSJ
  rationale: 정관사와 수사가 이미 대화 상대가 둘임을 분명히 하므로, 가장 직접적인 ‘두 왕’이 적절합니다.
- source_word: τοῖς φίλοις αὐτῶν
  english_pob_choice: to their friends
  chosen_korean: 그들의 친구들에게
  alternatives_korean:
  - 그들의 신하들에게
  - 그들의 측근들에게
  - 그들의 궁정 인사들에게
  lexicon: LSJ
  rationale: 헬라어 φίλοι는 궁정 용례에서 측근을 뜻할 수 있지만, 본문 자체는 그 직함을 명시하지 않으므로 기본 의미를 따라 ‘친구들’로 옮겼습니다.
theological_decisions:
- issue: μετὰ δόξης의 의미를 ‘영광’으로 신학화할지 여부
  chosen_reading: 왕실의 공개적 위엄과 장엄함을 나타내는 묘사로 이해하고, ‘위엄을 떨치며’로 번역했습니다.
  alternative_readings:
  - ‘영광 가운데’
  - ‘영광스럽게’
  rationale: 본문은 예배적·신학적 ‘영광’이 아니라 외교적 입성의 화려함을 말하므로, 독자가 왕실 장면으로 이해하도록 비신학적 품위를 드러내는 번역을 택했습니다.
  doctrine_reference: 서술 문맥 우선의 직역 원칙
