  text: But in Bethsura some of those who had abandoned the law and the commandments were left behind, for it was a refuge for them.
translation:
  language: ko
  text: 그러나 벳수르에는 율법과 계명을 버린 사람들 가운데 몇 사람이 남아 있었으니, 그곳이 그들에게 피난처였기 때문입니다.
  philosophy: formal
lexical_decisions:
- source_word: ἐν Βεθσούροις
  english_pob_choice: in Bethsura
  chosen_korean: 벳수르에는
  alternatives_korean:
  - 벳수르 안에는
  - 벳수르에서
  lexicon: 고유지명
  rationale: 전치사 ἐν은 여기서 장소 배경을 나타내므로 ‘-에는’으로 자연스럽게 옮겨, 문장의 초점을 벳수르라는 장소에 두었습니다.
- source_word: ὑπελείφθησάν τινες
  english_pob_choice: some ... were left behind
  chosen_korean: 몇 사람이 남아 있었으니
  alternatives_korean:
  - 몇 사람이 뒤에 남겨졌으니
  - 몇 사람이 남겨져 있었으니
  lexicon: 남다 / 남겨지다
  rationale: 영문 POB의 ‘were left behind’를 반영하되, 한국어에서는 수동성과 잔류를 함께 드러내는 자연스러운 합쇼체 표현으로 다듬었습니다.
- source_word: τῶν καταλειπόντων τὸν νόμον καὶ τὰ προστάγματα
  english_pob_choice: those who had abandoned the law and the commandments
  chosen_korean: 율법과 계명을 버린 사람들 가운데
  alternatives_korean:
  - 율법과 계명을 저버린 사람들 가운데
  - 율법과 계명에서 떠난 사람들 가운데
  lexicon: καταλείπω / νόμος / προστάγματα
  rationale: καταλείποντων은 ‘버리다/떠나다’의 의미이므로 ‘버린’으로 옮겼고, νόμος는 이 문맥에서 율법, προστάγματα는 계명으로 옮겨 기존 용례를 유지했습니다.
- source_word: φυγαδευτήριον
  english_pob_choice: a refuge
  chosen_korean: 피난처
  alternatives_korean:
  - 도피처
  - 은신처
  lexicon: 명사 의미
  rationale: φυγαδευτήριον은 도망하거나 숨는 장소를 뜻하므로, 문맥상 가장 직접적인 대응어인 ‘피난처’로 옮겼습니다.
theological_decisions:
- issue: 율법과 계명의 병렬 표현
  chosen_reading: 두 항목을 각각 유지해 법적·종교적 규범의 전면적 이탈을 드러냈습니다.
  alternative_readings:
  - ‘율법’ 하나로 묶어 간단히 처리
  - ‘법도’로 순화
  rationale: 본문은 ‘율법’과 ‘계명’을 병렬로 두어 반역의 범위를 넓혀 보이므로, 이를 합치거나 약화하지 않았습니다.
  doctrine_reference: 본문 서술의 문맥 충실성
