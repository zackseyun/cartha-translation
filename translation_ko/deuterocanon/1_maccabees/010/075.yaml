  source_fidelity: ‘그를 막아 들이지 않았습니다’는 현대 한국어에서 비문에 가깝고 ἀπέκλεισαν αὐτόν의 ‘그가 들어오지 못하게 막았다’는 뜻을 자연스럽게 전달하지 못합니다. 또한 Ἀπολλώνιος는 한국어 음역으로 ‘아폴로니오스’가 적절합니다. 마지막 복수 주어는 그리스어의 표면상 선행사에 따라 ‘그들’로 유지하되, ‘그 성읍’이 야포를 가리키도록 보존했습니다.
  naturalness: 합쇼체 문체에서 ‘성읍 사람들이 그가 들어오지 못하게 막았습니다’가 자연스럽고 명료합니다. 원문의 단순한 사건 연결을 반영하여 ‘그런데’와 ‘그래서’ 같은 강화된 접속어는 제거했습니다.
  terminology: ‘진을 쳤습니다’, ‘성읍’, ‘수비대’는 군사 서술에 적절합니다. 인명은 통용적인 그리스어계 표기인 ‘아폴로니오스’로 바로잡았습니다.
