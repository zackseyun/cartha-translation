base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/075.yaml
  text: And he encamped against Joppa[a], and those from the city shut him out, because a garrison of Apollonius was in Joppa[b]; and they fought against it.
  footnotes:
  - marker: a
    text: Or 'those from the city shut him out.' The Greek phrase is literally 'those from the city.'
    reason: lexical_alternative
  - marker: b
    text: The final 'it' refers to Joppa, the city.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 야포를 향해 진을 쳤습니다. 성읍 사람들이[a] 그가 들어오지 못하게 막았습니다. 야포에 아폴로니오스의 수비대가 있었기 때문입니다. 그리고 그들은 그 성읍과 싸웠습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘성읍에서 나온 자들’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 성읍’은 야포를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρενέβαλεν ἐπὶ Ἰόππην
  english_pob_choice: encamped against Joppa
  chosen_korean: 야포를 향하여 진을 쳤습니다
  alternatives_korean:
  - 야포를 향해 진을 쳤습니다
  - 야포 앞에 진을 쳤습니다
  - 야포를 공격하여 진을 쳤습니다
  lexicon: LSJ
  rationale: 군사적 문맥의 παρεμβάλλω는 단순 이동보다 ‘진을 치다’가 더 직접적이며, ἐπὶ + 대격의 대상을 향한 적대적 접근도 ‘향하여’로 무리 없이 드러냅니다.
- source_word: ἀπέκλεισαν αὐτόν
  english_pob_choice: shut him out
  chosen_korean: 그를 막아 들이지 않았는데
  alternatives_korean:
  - 그를 내쫓았는데
  - 그를 차단했는데
  - 그를 입성시키지 않았는데
  lexicon: LSJ
  rationale: ἀποκλείω는 출입을 막아 ‘들이지 않다’는 뜻이 자연스럽고, 군사 서술에서 성읍 주민이 상대의 입성을 거부한 상황을 한국어로 살리기 위해 이처럼 옮겼습니다.
- source_word: οἱ ἐκ τῆς πόλεως
  english_pob_choice: those from the city
  chosen_korean: 성읍 사람들이
  alternatives_korean:
  - 그 성읍에서 나온 사람들
  - 성읍의 사람들
  - 성읍의 자들
  lexicon: LSJ
  rationale: 그리스어는 문자적으로 ‘성읍에서 나온 자들’이지만, 한국어에서는 자연스럽고 간결하게 주체를 드러내는 ‘성읍 사람들’이 가장 적절합니다.
- source_word: φρουρὰ Ἀπολλωνίου
  english_pob_choice: a garrison of Apollonius
  chosen_korean: 아폴로니오의 수비대
  alternatives_korean:
  - 아폴로니오의 주둔군
  - 아폴로니오의 경비대
  - 아폴로니오에게 속한 수비대
  lexicon: LSJ
  rationale: φρουρά는 군사 주둔 병력을 가리키므로 ‘수비대’가 가장 정확하며, 속격은 소속·통제 관계를 ‘아폴로니오의’로 반영했습니다.
- source_word: ἐπολέμησαν αὐτήν
  english_pob_choice: they fought against it
  chosen_korean: 그 성읍과 싸웠습니다
  alternatives_korean:
  - 그것과 싸웠습니다
  - 야포와 싸웠습니다
  - 그 도시에 대항하여 싸웠습니다
  lexicon: LSJ
  rationale: 대명사 αὐτήν은 여성 단수로 야포를 가리키므로, 의미를 분명히 하기 위해 대상을 반복해 ‘그 성읍’으로 옮겼습니다.
theological_decisions:
- issue: 전투 대상 지시를 한국어에서 명확히 할지 여부
  chosen_reading: 마지막 대명사 αὐτήν을 ‘그 성읍’으로 풀어 야포를 가리키게 했습니다.
  alternative_readings:
  - 그것과 싸웠습니다
  - 야포와 싸웠습니다
  rationale: 그리스어의 지시 관계를 한국어에서 모호하지 않게 보존하는 것이 필요하며, 이는 새 해석을 더하는 것이 아니라 원문이 이미 가리키는 대상을 명시하는 것입니다.
  doctrine_reference: source clarity / referential precision
- issue: 문장 연결사의 의미 강도
  chosen_reading: 그리스어의 단순 연쇄를 따라 ‘그리고 … 그런데 … 그래서 …’로 연결했습니다.
  alternative_readings:
  - 그러나 … 그래서 …
  - 그리고 … 그러므로 …
  rationale: 원문은 인과와 대조를 논리적으로 강하게 해설하기보다 사건을 연쇄적으로 서술하므로, 한국어에서도 과도한 해석적 접속을 피했습니다.
  doctrine_reference: narrative discourse fidelity
