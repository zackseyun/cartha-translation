- from: 그리고 그는 야포를 향하여 진을 쳤습니다. 그런데 성읍 사람들이 그를 막아 들이지 않았는데, 이는 야포에 아폴로니오의 수비대가 있었기 때문입니다. 그래서 그들은 그 성읍과 싸웠습니다.[a][b]
  to: 그리고 그는 야포를 향해 진을 쳤습니다. 성읍 사람들이[a] 그가 들어오지 못하게 막았습니다. 야포에 아폴로니오스의 수비대가 있었기 때문입니다. 그리고 그들은 그 성읍과 싸웠습니다.[b]
  rationale: 본문의 핵심 군사 행위와 지시 관계는 유지하면서, 비문에 가까운 표현을 자연스러운 합쇼체로 고쳤습니다. 마지막 ‘그들’의 정확한 담화상 지시가 문맥상 난해할 수 있으므로 원문의 복수 주어를 해석적으로 다른 집단으로 바꾸지 않았습니다. 각주 표지는 각각 관련 어구 바로 뒤에 배치했습니다.
