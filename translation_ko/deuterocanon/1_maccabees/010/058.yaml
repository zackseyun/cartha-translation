  terminology: 인명·지명 음역은 수용 가능하며, γάμος는 이 문맥에서 ‘혼례’로 옮기는 것이 행사를 베풀었다는 서술과 잘 맞습니다. 각주 b에 혼입된 아랍어 ‘عادة’는 반드시 수정해야 합니다.
