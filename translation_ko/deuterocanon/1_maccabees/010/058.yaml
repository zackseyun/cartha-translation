translation:
  language: ko
  text: 알렉산드로스 왕은 그를 만나 자기 딸 클레오파트라를 그에게 주고[a], 프톨레마이스에서 왕들이 하듯이[b] 그녀의 혼례를 크게 성대하게 베풀었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 딸 클레오파트라를 그에게 시집보냈다.’ 여기서 그리스어 동사는 이 문맥에서 혼인시키는 의미를 분명히 가집니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘왕들의 방식대로’ 또는 ‘왕들이 늘 하듯이.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήντησεν
  english_pob_choice: met
  chosen_korean: 맞이하여 가서
  alternatives_korean:
  - 만났습니다
  - 맞이했습니다
  lexicon: LSJ
  rationale: 단순히 ‘만나다’보다 서술 속에서 상대를 향해 나아가 응대한 뉘앙스를 살리기 위해 ‘맞이하여 가서’를 택했습니다.
- source_word: ἐξέδοτο
  english_pob_choice: gave
  chosen_korean: 주고
  alternatives_korean:
  - 시집보내고
  - 결혼시키고
  lexicon: LSJ
  rationale: 이 동사는 혼인 맥락에서 딸을 ‘주다’는 뜻이므로, 본문에서 결혼 의미를 ‘그 결혼을’로 이어지게 하면서도 과도한 설명을 피했습니다.
- source_word: τὸν γάμον αὐτῆς
  english_pob_choice: he held her wedding
  chosen_korean: 그 결혼
  alternatives_korean:
  - 그 혼인
  - 그 혼례
  lexicon: LSJ
  rationale: γάμος의 혼인/혼례 의미를 반영하되, 한국어에서는 뒤의 ‘베풀었습니다’와 함께 왕실 혼례 행사를 자연스럽게 전달하도록 했습니다.
- source_word: ἐν δόξῃ μεγάλῃ
  english_pob_choice: with great splendor
  chosen_korean: 큰 화려함 가운데
  alternatives_korean:
  - 큰 영광 가운데
  - 큰 장엄함 가운데
  lexicon: LSJ
  rationale: 여기서 δόξα는 신학적 ‘영광’이 아니라 의례적 장식성과 위엄을 가리키므로, 왕실 잔치의 외적 장려함을 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 왕실 혼례의 묘사에서 δόξα를 신학적 용어로 오해하지 않도록 할지
  chosen_reading: ‘큰 화려함’으로 읽어 왕실 의전의 장엄함을 나타냈습니다.
  alternative_readings:
  - ‘큰 영광’으로 직역
  - ‘큰 장엄함’으로 번역
  rationale: 문맥이 하나님과 무관한 왕실 결혼식 서술이므로, 본문의 의미를 흐리지 않도록 의례적·세속적 장엄함으로 번역했습니다.
  doctrine_reference: 문맥 우선의 어휘 판단
