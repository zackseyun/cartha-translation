translation:
  language: ko
  text: 그는 그를 아스돗까지 추격했고, 진영들은 그의 뒤에서 전투를 벌였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεδίωξεν
  english_pob_choice: pursued
  chosen_korean: 추격했고
  alternatives_korean:
  - 뒤쫓았고
  - 추적했고
  lexicon: LSJ
  rationale: 군사적 맥락에서 적극적인 पीछ pursuit를 나타내므로, 현대 한국어에서는 자연스럽고 압축적인 ‘추격하다’가 가장 잘 맞습니다.
- source_word: εἰς Ἄζωτον
  english_pob_choice: to Azotus
  chosen_korean: 아소돗까지
  alternatives_korean:
  - 아소돗으로
  - 아소돗에
  lexicon: LSJ
  rationale: εἰς는 도착점을 향한 이동을 나타내므로, 추격의 종착을 드러내는 ‘-까지’가 문맥에 가장 충실합니다.
- source_word: αἱ παρεμβολαὶ
  english_pob_choice: the camps
  chosen_korean: 진영들은
  alternatives_korean:
  - 진지들은
  - 군대들은
  - 캠프들은
  lexicon: LSJ
  rationale: παρεμβολαί의 기본 이미지는 ‘진영/군영’이므로, 군사 집단을 드러내는 ‘진영들’이 원문 이미지를 비교적 그대로 살립니다.
- source_word: συνῆψαν ... εἰς πόλεμον
  english_pob_choice: joined battle
  chosen_korean: 전투를 벌였습니다
  alternatives_korean:
  - 전투에 합류했습니다
  - 맞붙어 싸웠습니다
  lexicon: LSJ
  rationale: συνάπτω는 군사적으로 ‘교전하다, 맞붙다’의 뜻이므로, 격식을 유지하면서도 자연스러운 ‘전투를 벌이다’로 옮겼습니다.
