  text: And he pursued him to Azotus[a], and the camps joined battle behind him.
  footnotes:
  - marker: a
    text: Or 'the camps engaged in battle after him.' The repeated Greek phrase 'behind/after him' is somewhat awkward in English; the translation preserves the sequence of pursuit and ensuing combat.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 아소돗까지 그를 추격했고, 진영들은 그의 뒤에서 전투를 벌였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아소돗’은 Ἄζωτος의 음역입니다.
