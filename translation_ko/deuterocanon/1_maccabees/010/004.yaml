  yaml_path: translation/deuterocanon/1_maccabees/010/004.yaml
  text: For he said[a], “Let us get ahead of him by making peace with him, before he makes common cause with Alexander against us.”
  footnotes:
  - marker: a
    text: Or, “before he allies himself with Alexander against us.” The Greek literally says “before he places himself with Alexander against us,” an idiom for political alignment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 말했습니다. 「우리가 그와 화평을 이루는 일에서 그보다 먼저 나서서, 그가 알렉산드로스와 함께 우리를 대항하기 전에 그렇게 합시다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “그가 알렉산드로스와 함께 자신을 두기/놓기 전에”라는 뜻으로, 정치적 연합을 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προφθάσωμεν
  english_pob_choice: Let us get ahead of him
  chosen_korean: 우리가 그보다 먼저 나서서
  alternatives_korean:
  - 우리가 그를 앞서서
  - 우리가 먼저 그에게 나아가서
  lexicon: LSJ
  rationale: 호소형 용법의 προφθάνω는 단순한 시간상 선행이 아니라 상대보다 먼저 행동하자는 뜻이어서, 한국어에서는 자연스럽게 ‘먼저 나서서’로 옮겼습니다.
- source_word: τοῦ εἰρηνεῦσαι μετʼ αὐτοῦ
  english_pob_choice: by making peace with him
  chosen_korean: 그와 화평을 이루는 일에서
  alternatives_korean:
  - 그와 화평을 맺는 일로
  - 그와 평화 협상을 하는 가운데
  lexicon: LSJ
  rationale: 관사+부정사 구조가 목적/행위의 영역을 나타내므로, ‘화평을 이루는 일에서’로 처리해 전략적 외교 행위를 살렸습니다.
- source_word: θεῖναι αὐτὸν μετὰ Ἀλεξάνδρου
  english_pob_choice: he makes common cause with Alexander
  chosen_korean: 그가 알렉산드로스와 함께
  alternatives_korean:
  - 그가 알렉산드로스와 손잡고
  - 그가 알렉산드로스 편에 서서
  lexicon: LSJ
  rationale: 직역하면 ‘그를 알렉산드로스와 함께 두다’이지만, 정치적 연합의 관용구이므로 한국어에서는 관계를 드러내는 ‘함께’로 옮기되, ‘대항하기 전에’와 결합해 연합의 의미를 분명히 했습니다.
- source_word: καθʼ ἡμῶν
  english_pob_choice: against us
  chosen_korean: 우리를 대항하기 전에
  alternatives_korean:
  - 우리에게 대항하여
  - 우리에게 맞서기 전에
  lexicon: LSJ
  rationale: κατά+속격의 적대 방향을 표준적이고 현대적인 한국어로 옮겼습니다.
theological_decisions:
- issue: 정치적 동맹을 나타내는 관용구의 직역과 의미 전달의 균형
  chosen_reading: ‘그가 알렉산드로스와 함께 우리를 대항하기 전에’로, 원문의 ‘함께 두다/세우다’라는 직설적 표현을 완전히 풀어 쓰지 않고 정치적 연합의 긴장을 유지했습니다.
  alternative_readings:
  - ‘그가 알렉산드로스와 동맹을 맺어 우리를 대항하기 전에’
  - ‘그가 알렉산드로스 편에 서서 우리를 치기 전에’
  rationale: 본문의 핵심은 외교적 타협보다 먼저 상대의 연합을 차단하려는 계산이므로, 직역성과 의미 전달을 함께 살리는 쪽이 적절합니다.
  doctrine_reference: source-language political idiom
