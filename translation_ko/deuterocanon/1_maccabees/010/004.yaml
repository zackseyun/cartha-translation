  rationale: 문법적으로 부정확한 ‘우리를 대항하기’를 ‘우리에게 맞서기’로 바로잡고, 전략적 선행 행동을 간결하게 ‘그보다 먼저 그와 화평을 맺읍시다’로 옮겼습니다. 정치적 연합이라는 관용적 의미는 ‘손잡고’로 본문에 반영하되, 원문의 직역적 표현은 각주에 남겨 번역의 투명성을 확보했습니다.
