base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/061.yaml
  text: And pestilent men from Israel gathered against him[a], lawless men, to bring charges against him[b]; but the king paid no attention to them.
  footnotes:
  - marker: a
    text: Or 'troublesome men' or 'men like a plague'; the Greek insult is unusually strong and metaphorical.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'to bring charges against him' could also be rendered 'to petition against him' or 'to accuse him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이스라엘에서 온 역병 같은 자들, 곧 무법한 자들이 그를 대적하여 모여들어 그를 고발하려고 하였으나, 왕은 그들에게 귀를 기울이지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: λοιμοί는 문자적으로 ‘역병 같은’이라는 뜻이며, 사람들을 향한 매우 강한 비난적 비유입니다. ‘말썽을 일으키는 자들’ 또는 ‘사회의 해악 같은 자들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ἐντυχεῖν κατʼ αὐτοῦ는 ‘그를 고발하다’로 옮길 수 있으며, 문맥에 따라 ‘그를 상대로 탄원하다’ 또는 ‘그에 대하여 진정하다’라는 뜻도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνδρες λοιμοί
  english_pob_choice: pestilent men
  chosen_korean: 해로운 자들
  alternatives_korean:
  - 폐해를 끼치는 자들
  - 전염병 같은 자들
  - 문젯거리 같은 사람들
  lexicon: LSJ
  rationale: λοιμοί의 강한 비난적·비유적 뉘앙스를 살리되, 한국어에서 자연스럽고 출판 가능한 표현으로 옮겼습니다. '문젯거리'처럼 약화된 표현은 피했습니다.
- source_word: ἐξ Ἰσραήλ
  english_pob_choice: from Israel
  chosen_korean: 이스라엘에서 온
  alternatives_korean:
  - 이스라엘 출신의
  - 이스라엘 가운데서 온
  lexicon: LSJ
  rationale: 출신/소속을 나타내는 표현으로 이해되어, 간결한 출처 표시를 살렸습니다.
- source_word: ἄνδρες παράνομοι
  english_pob_choice: lawless men
  chosen_korean: 불법한 자들
  alternatives_korean:
  - 무법자들
  - 율법을 어기는 자들
  - 악한 자들
  lexicon: LSJ
  rationale: παράνομος의 핵심은 법에 어긋남이므로, 도덕적 평가를 덧씌우기보다 '불법한'으로 직접 옮겼습니다.
- source_word: ἐντυχεῖν κατʼ αὐτοῦ
  english_pob_choice: to bring charges against him
  chosen_korean: 그를 고발하려 했으나
  alternatives_korean:
  - 그를 상대로 탄원하려 했으나
  - 그를 고소하려 했으나
  - 그에 대해 진정하려 했으나
  lexicon: LSJ
  rationale: 법정·행정적 맥락에서 'against him'의 적대적 접근을 한국어에서 가장 분명하게 드러내는 법률적 표현으로 옮겼습니다.
- source_word: οὐ προσέσχεν αὐτοῖς
  english_pob_choice: paid no attention to them
  chosen_korean: 그들에게 귀를 기울이지 않았습니다
  alternatives_korean:
  - 그들을 거들떠보지 않았습니다
  - 그들의 말을 듣지 않았습니다
  - 그들을 상대하지 않았습니다
  lexicon: LSJ
  rationale: προσέχω의 '주의를 기울이다/귀를 기울이다' 의미를 살리면서, 왕의 거절을 자연스럽게 표현했습니다.
