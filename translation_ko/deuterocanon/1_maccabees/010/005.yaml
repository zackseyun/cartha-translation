    reason: lexical_alternative
lexical_decisions:
- source_word: πάντων τῶν κακῶν
  english_pob_choice: all the wrongs
  chosen_korean: 온갖 잘못들
  alternatives_korean:
  - 모든 악들
  - 온갖 악행들
  - 모든 잘못들
  lexicon: κακός
  rationale: POB의 ‘wrongs’를 따라 도덕적·관계적 ‘잘못’으로 옮겨, 단순한 추상적 악보다 행위의 책임을 드러냈습니다.
- source_word: συνετελέσαμεν
  english_pob_choice: we committed
  chosen_korean: 우리가 저지른
  alternatives_korean:
  - 우리가 행한
  - 우리가 범한
  - 우리가 저질렀던
  lexicon: συντελέω
  rationale: 문맥상 상대에게 가한 해악을 가리키므로, 한국어에서는 ‘저지르다’가 가장 직접적으로 책임 있는 가해를 표현합니다.
- source_word: πρὸς αὐτόν, καὶ εἰς τοὺς ἀδελφοὺς αὐτοῦ καὶ εἰς τὸ ἔθνος αὐτοῦ
  english_pob_choice: against him, and against his brothers, and against his nation
  chosen_korean: 그에게, 그의 형제들에게, 그리고 그의 민족에게
  alternatives_korean:
  - 그에게, 그의 형제들에게, 그리고 그의 나라에게
  - 그와 그의 형제들과 그의 민족에게
  - 그에게와 그의 형제들과 그의 민족에게
  lexicon: πρός / εἰς + accusative
  rationale: 전치사의 대립성은 한국어에서 조사 ‘-에게’로 자연스럽게 옮기되, 반복 구조를 유지해 각각의 대상이 분리된 침해의 대상임을 살렸습니다.
theological_decisions:
- issue: 기억하다의 주체와 내용이 회개적 자기반성인지 단순한 정보 회상인지
  chosen_reading: 문맥상 보복 또는 책임 추궁의 근거가 되는 ‘기억’으로, 중립적 기억보다 관계적·도덕적 회상을 강조했습니다.
  alternative_readings:
  - 단순히 기억할 것입니다
  - 상기할 것입니다
  rationale: 원문은 미래형 서술로, 대상이 받은 피해와 책임을 상기하는 뉘앙스를 가집니다. 따라서 한국어에서도 의미를 약화하지 않았습니다.
  doctrine_reference: 서사 문맥상 책임과 보응의 주제
