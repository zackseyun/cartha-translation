  yaml_path: translation/deuterocanon/1_maccabees/010/042.yaml
  text: And in addition to these things[a], the five thousand shekels of silver that they used to take from the revenues, as in former years, from the sanctuary account each year, these also are remitted, because they belong to the priests who minister.
  footnotes:
  - marker: a
    text: Or 'from the sanctuary's annual account' or 'from the annual reckoning of the sanctuary.' The Greek phrase involving λόγος is administrative and somewhat compressed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이 모든 것에 더하여, 그들이 이전 해들과 같이 해마다 성소 회계에 따른 세입에서 거두어 가던 은 오천 세겔도 면제됩니다. 그것은 직무를 수행하는 제사장들에게 속하기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성소의 연간 회계에서’ 또는 ‘성소의 연간 결산에 따라’로 옮길 수 있습니다. λόγος가 포함된 그리스어 표현은 행정·회계적 의미로 압축되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεντακισχιλίους σίκλους ἀργυρίου
  english_pob_choice: the five thousand shekels of silver
  chosen_korean: 은 오천 달란트
  alternatives_korean:
  - 은 오천 세겔
  - 은 오천 세겔의 은
  lexicon: LSJ
  rationale: 화폐 단위는 직역해 보존하되, 한국어에서 자연스러운 명사구로 정리했습니다. POB의 ‘shekels of silver’에 맞춰 단위를 앞세워 표현했습니다.
- source_word: ἀπὸ τῶν χρειῶν
  english_pob_choice: from the revenues
  chosen_korean: 세금 수입에서
  alternatives_korean:
  - 세입에서
  - 수입에서
  - 필요 경비에서
  lexicon: LSJ
  rationale: 문맥이 성전 재정의 징수·배분 문제이므로 ‘필요’보다 재정 수입을 뜻하는 표현이 적합합니다. 영어 POB의 ‘revenues’를 한국어 행정 문맥으로 옮겼습니다.
- source_word: ἀπὸ τοῦ λόγου
  english_pob_choice: account
  chosen_korean: 회계에서
  alternatives_korean:
  - 회계 장부에서
  - 산정에서
  - 계산에서
  lexicon: LSJ
  rationale: λόγος는 여기서 행정적 ‘장부/회계’의 뜻이므로, 영어 POB의 ‘account’를 따라 성전의 연간 회계 항목으로 살렸습니다.
- source_word: τοῖς ἱερεῦσιν τοῖς λειτουργοῦσιν
  english_pob_choice: to the priests who minister
  chosen_korean: 봉사하는 제사장들에게
  alternatives_korean:
  - 성무를 집행하는 제사장들에게
  - 섬기는 제사장들에게
  lexicon: LSJ
  rationale: λειτουργέω의 성전 봉사·직무 수행 뉘앙스를 반영해 ‘봉사하는’으로 옮겼습니다. 한국어 교회 용어인 ‘사역’보다 본문의 제의적 의미를 더 직접적으로 드러냅니다.
theological_decisions:
- issue: 성전 재정과 제사장 몫의 정당성
  chosen_reading: 해당 금액은 성소에 속한 항목이 아니라 제사장들에게 귀속되는 몫으로 제시되어, ‘면제됩니다’와 ‘속하기 때문입니다’를 함께 살렸습니다.
  alternative_readings:
  - ‘면제됩니다’만 두어 법적 면제에 집중
  - ‘없어집니다’로 단순 처리
  rationale: 본문의 ἀφίεται는 단순 삭제가 아니라 징수 의무의 면제·탕감을 뜻하므로, 재정 규정의 의미와 귀속 근거를 함께 보여 주는 것이 필요합니다.
  doctrine_reference: 성전 재정, 제사장 몫에 대한 규정
