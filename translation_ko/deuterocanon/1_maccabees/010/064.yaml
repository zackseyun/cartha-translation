  text: And it happened that[a], when those who met him saw his splendor, as it had been proclaimed, and that he was clothed in linen[b], they all fled.
  footnotes:
  - marker: a
    text: Or 'his glory.' In this context the Greek likely refers to visible royal magnificence rather than a specifically theological sense.
    reason: lexical_alternative
  - marker: b
    text: The Greek says 'clothed in linen' (or 'wearing a linen garment'); the term refers to linen cloth or clothing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들이 그에게서 비친 영광을 보게 되자 — 그것이 선포된 그대로였습니다 — 그가 세마포옷을 입고 있는 것을 보고, 그들은 모두 도망갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 영광.’ 이 문맥에서 그리스어는 신학적 의미라기보다 눈에 보이는 왕적 장엄함을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘세마포로 옷 입은’ 또는 ‘세마포옷을 입은’이라는 뜻입니다. 여기서는 천의 재질과 의복성을 함께 살렸습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ὡς
  english_pob_choice: And it happened that, when
  chosen_korean: 그리고 그들이 … 보게 되자
  alternatives_korean:
  - 그때 … 되었는데
  - …할 때에
  lexicon: LSJ
  rationale: 헬라어의 서사 전환과 시간 관계를 자연스럽게 살리되, 한국어에서는 중복된 연결을 피하면서 사건 진행을 매끄럽게 옮겼습니다.
- source_word: τὴν δόξαν αὐτοῦ
  english_pob_choice: his splendor
  chosen_korean: 그에게서 비친 영광
  alternatives_korean:
  - 그의 영광
  - 그의 위엄
  - 그의 광휘
  lexicon: LSJ
  rationale: 이 문맥에서 δόξα는 신학적 의미보다 왕적·공적 위엄의 가시적 드러남을 가리키므로, 직역적인 '영광'을 유지하되 '비친'을 덧붙여 눈에 보이는 장엄함을 드러냈습니다.
- source_word: περιβεβλημένον αὐτὸν σινδόνα
  english_pob_choice: that he was clothed in linen
  chosen_korean: 그가 세마포옷을 입고 있는 것을 보고
  alternatives_korean:
  - 그가 세마포를 두르고 있는 것을 보고
  - 그가 아마포옷을 입고 있는 것을 보고
  - 그가 세마포를 입고 있는 것을 보고
  lexicon: LSJ
  rationale: σινδών은 린넨 계열의 천/옷을 뜻하므로, 한국어 성서어휘에서 낯설지 않으면서도 재질을 유지하는 '세마포옷'을 택했습니다.
- source_word: ἔφυγον πάντες
  english_pob_choice: they all fled
  chosen_korean: 그들은 모두 도망갔습니다
  alternatives_korean:
  - 그들은 모두 달아났습니다
  - 모두 도망쳤습니다
  lexicon: LSJ
  rationale: ἔφυγον의 급박한 도피감을 살리면서도 서술문체에 맞는 표준적 표현으로 옮겼습니다.
