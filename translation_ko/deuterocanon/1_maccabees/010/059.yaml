  source_fidelity: 그리스어는 알렉산드로스 왕이 요나단에게 그 왕을 만나러 오도록 썼음을 말합니다. 초안의 ‘그에게’는 선행사 지시가 불명확하고, ‘만나자고’는 ‘함께 만나자’라는 상호 제안으로 읽혀 왕이 요나단에게 요청한 부정사 구문의 방향을 충분히 보존하지 못합니다.
  naturalness: ‘요나단에게 그에게 와서 만나자고 썼습니다’는 동일한 여격 대상과 대명사가 연이어 어색하며 지시 대상이 혼동됩니다. ‘자신을 만나러 오라고’가 현대 표준 한국어의 자연스러운 간접 인용입니다.
  terminology: ‘왕 알렉산드로스’와 ‘요나단’은 적절합니다. 신학적 전문 용어 또는 주석은 필요하지 않습니다.
  issues:
