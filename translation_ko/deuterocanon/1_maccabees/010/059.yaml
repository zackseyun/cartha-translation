  text: 그리고 알렉산드로스 왕은 요나단에게 자신을 만나러 오라고 썼습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ βασιλεὺς Ἀλέξανδρος
  english_pob_choice: King Alexander
  chosen_korean: 왕 알렉산드로스
  alternatives_korean:
  - 알렉산드로스 왕
  - 알렉산더 왕
  lexicon: 고유명사 표기 일반 원칙
  rationale: 왕호와 인명을 모두 살리되, 현대 한국어에서 자연스러운 어순으로 옮겼습니다. '알렉산드로스'는 헬라식 인명에 더 가깝고, 본문의 역사적 인물을 분명히 드러냅니다.
- source_word: ἔγραψεν
  english_pob_choice: wrote
  chosen_korean: 썼습니다
  alternatives_korean:
  - 기록했습니다
  - 편지를 보냈습니다
  lexicon: LSJ
  rationale: γράφω의 기본 의미를 직접 살리되, 한국어 서술에서는 자연스러운 과거형인 '썼습니다'가 가장 무난합니다. '편지를 보냈습니다'는 문서 형태를 덧붙이는 해석이어서 피했습니다.
- source_word: ἐλθεῖν εἰς συνάντησιν αὐτῷ
  english_pob_choice: to come and meet him
  chosen_korean: 그에게 와서 만나자고
  alternatives_korean:
  - 그와 만나러 오라고
  - 그와 대면하러 오라고
  lexicon: LSJ
  rationale: 직역하면 '그와의 만남으로 오다'라는 뜻이지만, 한국어에서는 '와서 만나자고'가 초청/소환의 의도를 가장 자연스럽게 전달합니다. '대면'은 지나치게 격식적이어서 본문이 요구하는 단순한 만남의 뉘앙스를 넘습니다.
theological_decisions:
- issue: 회화체가 아닌 서술문에서 초청의 방향성 유지
  chosen_reading: 왕이 요나단을 자기 쪽으로 불러 만나려는 취지를 '와서 만나자고'로 옮겼습니다.
  alternative_readings:
  - '''오라고''로 더 직접적으로 옮길 수 있습니다.'
  - '''만나도록''처럼 중립적으로 처리할 수 있습니다.'
  rationale: 그리스어 부정사구 ἐλθεῖν εἰς συνάντησιν αὐτῷ는 단순한 이동이 아니라 왕이 주도하는 만남의 요청입니다. 한국어에서는 이 관계성을 살리기 위해 초청 목적을 드러냈습니다.
  doctrine_reference: 서술상의 의도와 행위 방향을 보존하는 번역 원칙
