  rationale: 그리스어의 이름+호칭 어순을 크게 해치지 않으면서도 한국어 문장에서 자연스럽게 읽히는 형태로 옮겼습니다. ‘대왕’은 본문에 없는 평가적 요소이므로 배제했습니다.
