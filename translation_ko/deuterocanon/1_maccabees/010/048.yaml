- source_word: συνήγαγεν
  english_pob_choice: gathered
  chosen_korean: 모아
  alternatives_korean:
  - 모집하여
  - 집결시켜
  - 소집하여
  lexicon: LSJ
  rationale: 군사적 맥락에서 흩어진 병력을 한데 불러 모으는 뜻을 살려, 자연스러운 현대 한국어로 간결하게 옮겼습니다.
- source_word: δυνάμεις μεγάλας
  english_pob_choice: great forces
  chosen_korean: 큰 군대들
  alternatives_korean:
  - 큰 병력들
  - 대군
  - 막강한 군세
  lexicon: LSJ
  rationale: δυνάμεις는 단순한 ‘힘’보다 군사적 병력/전력을 가리키므로, 복수성을 살린 ‘군대들’로 옮기고 μεγάλας는 규모를 드러내는 ‘큰’으로 반영했습니다.
- source_word: παρενέβαλεν
  english_pob_choice: encamped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 야영했습니다
  - 캠프를 꾸렸습니다
  - 주둔했습니다
  lexicon: LSJ
  rationale: 전투 대치 문맥의 παρεμβάλλω는 단순 야영이 아니라 군사적으로 진을 배치하는 뜻이므로, 한국어 군사 서술에 자연스러운 ‘진을 치다’를 택했습니다.
- source_word: ἐξ ἐναντίας
  english_pob_choice: opposite
  chosen_korean: 맞은편에
  alternatives_korean:
  - 마주하여
  - 대항하여
  - 정면으로
  lexicon: LSJ
  rationale: 공간적 대치를 나타내는 표현으로, 전투 태세를 유지하면서도 과도한 해석을 피하는 ‘맞은편에’가 적절합니다.
