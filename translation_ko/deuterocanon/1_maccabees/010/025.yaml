  text: 'so that they may be with me as help. And King Demetrius sent to the nation of the Jews, according to these words: Greetings.'
translation:
  language: ko
  text: 그들이 내 곁에 도움으로 함께 있게 하려는 것이었습니다. 그리고 왕 데메드리오스가 유대인들의 민족에게 이 말대로 보냈습니다. 「평안하시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘도움을 위해/돕도록’이지만, 문맥상 함께 있을 때 ‘도움의 역할을 하다’는 뜻을 살려 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς βοήθειαν
  english_pob_choice: for help / as help
  chosen_korean: 도움으로
  alternatives_korean:
  - 도움이 되도록
  - 도움으로서
  - 돕는 사람으로
  lexicon: βοήθεια
  rationale: 전치사 εἰς와 명사 βοήθειαν의 결합은 단순한 목적뿐 아니라 ‘도움의 역할/기능’도 드러내므로, 영어 POB의 ‘as help’를 살려 자연스럽게 ‘도움으로’로 옮겼습니다.
- source_word: καὶ ἀπέστειλεν αὐτοῖς
  english_pob_choice: And ... sent to them
  chosen_korean: 그리고 ... 보냈습니다
  alternatives_korean:
  - 그리고 ... 파견했습니다
  - 그리고 ... 전했습니다
  lexicon: ἀποστέλλω
  rationale: ἀπέστειλεν은 실제로 편지를 보내는 동작을 가리키므로, 왕이 편지를 ‘보냈습니다’로 직역해 서신 문맥을 유지했습니다.
- source_word: τῷ ἔθνει τῶν Ἰουδαίων
  english_pob_choice: to the nation of the Jews
  chosen_korean: 유대인들의 민족에게
  alternatives_korean:
  - 유대 민족에게
  - 유대인 백성에게
  - 유대인의 나라에
  lexicon: ἔθνος
  rationale: ἔθνος은 여기서 정치적·민족적 집단을 가리키므로, POB의 ‘nation’을 따라 ‘민족’으로 두되 소유격을 살려 ‘유대인들의 민족’으로 자연화했습니다.
theological_decisions:
- issue: 왕의 인사말 χαίρειν의 한국어 처리
  chosen_reading: 직접 인용 부호 안에 중립적인 인사말 ‘평안하시오’를 두었습니다.
  alternative_readings:
  - 문안드립니다
  - 안녕하시오
  - 기뻐하시오
  rationale: χαίρειν은 헬라 서신 관용구로서 단순한 ‘기뻐하라’보다 인사 서두의 기능이 강하므로, 한국어 독자에게 서신체로 읽히는 평안 인사로 옮겼습니다.
  doctrine_reference: 서간체 관용구 번역 원칙
