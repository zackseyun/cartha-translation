  source_fidelity: 첫 절의 ὅπως 이하 목적절과 σὺν ἐμοί 및 εἰς βοήθειαν의 의미는 대체로 반영했으나, ‘내 곁에’는 단순한 ‘나와 함께’보다 공간적으로 좁히며, ‘도움으로 함께 있게’는 현대 한국어에서 부자연스럽습니다. ‘이 말대로 보냈습니다’는 κατὰ τοὺς λόγους τούτους의 서신 도입 표현을 충분히 전달하지 못합니다. χαίρειν은 서신의 관용적 인사이므로 ‘평안하시오’보다 ‘문안합니다’가 더 중립적이고 자연스럽습니다.
  naturalness: ‘유대인들의 민족’은 한국어의 일반적 결합이 아니며 ‘유대 민족’이 자연스럽습니다. 또한 ‘왕 데메드리오스가 … 보냈습니다’는 무엇을 보냈는지가 생략되어 어색하므로 ‘편지를 보냈습니다’로 명시하는 것이 문맥상 적절합니다.
