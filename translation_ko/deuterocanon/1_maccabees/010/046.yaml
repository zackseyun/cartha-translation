base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/046.yaml
  text: But when Jonathan and the people heard these words[a], they did not believe them or accept them, because they remembered the great evil that he had done in Israel[b], and how he had oppressed them severely.
  footnotes:
  - marker: a
    text: Or 'they did not trust them or receive them.' The Greek distinguishes between not believing the words and not accepting them.
    reason: lexical_alternative
  - marker: b
    text: Or 'the great evil that he had done against Israel.' The Greek literally says 'in Israel,' which may imply wrongdoing carried out within Israel or against Israel as a people.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 요나단과 백성이 이 말을[a] 들었을 때, 그들은 그것을 믿지도 않았고 받아들이지도 않았습니다. 이는 그가 이스라엘 가운데서[b] 행한 큰 악과 그가 그들을 몹시 압제한 일을 기억했기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 말을 믿지 않았고 받아들이지 않았습니다.’ 여기서 그리스어는 그 말을 사실로 믿지 않는 것과 그것을 받아들이지 않는 것을 구별합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그가 이스라엘에게 행한 큰 악.’ 그리스어는 문자적으로 ‘이스라엘 가운데서’라고 말하며, 이스라엘 안에서 벌어진 악행 또는 이스라엘을 향한 악행을 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἐπίστευσαν αὐτοῖς
  english_pob_choice: they did not believe them
  chosen_korean: 그것을 믿지도 않았고
  alternatives_korean:
  - 그 말을 믿지도 않았고
  - 그것들을 신뢰하지도 않았고
  lexicon: BDAG
  rationale: 문맥상 말을 사실로 받아들이지 않는 뜻이므로, 현대 한국어에서는 ‘믿다’를 써서 직접적으로 옮기는 것이 자연스럽습니다.
- source_word: οὐδὲ ἐπεδέξαντο
  english_pob_choice: or accept them
  chosen_korean: 받아들이지도 않았습니다
  alternatives_korean:
  - 받아들이지도 않았습니다
  - 받아주지도 않았습니다
  - 영접하지도 않았습니다
  lexicon: LSJ
  rationale: 앞의 ‘믿다’와 구별되는 수용의 거부를 살리기 위해 ‘받아들이다’를 택했습니다.
- source_word: τῆς κακίας τῆς μεγάλης ἧς ἐποίησεν ἐν Ἰσραήλ
  english_pob_choice: the great evil that he had done in Israel
  chosen_korean: 이스라엘 가운데서 행한 큰 악
  alternatives_korean:
  - 이스라엘 안에서 행한 큰 악
  - 이스라엘에게 행한 큰 악
  lexicon: LSJ
  rationale: ἐν Ἰσραήλ의 직역 성격을 살리면서도 한국어에서는 ‘가운데서’가 자연스럽고, κακία는 단순한 ‘악행’보다 무게 있는 ‘큰 악’이 원문에 가깝습니다.
- source_word: ἔθλιψεν αὐτοὺς σφόδρα
  english_pob_choice: how he had oppressed them severely
  chosen_korean: 그가 그들을 몹시 압제한
  alternatives_korean:
  - 그가 그들을 심하게 압박한
  - 그가 그들을 크게 괴롭힌
  lexicon: BDAG
  rationale: ἔθλιψεν은 단순한 괴로움보다 지속적이고 강한 억압을 뜻하므로 ‘압제하다’가 역사·정치적 문맥을 가장 잘 드러냅니다.
theological_decisions:
- issue: 이스라엘 가운데서/이스라엘에게의 뉘앙스
  chosen_reading: ‘이스라엘 가운데서’로 옮겨, 원문의 ἐν을 그대로 반영하면서도 문맥상 그 민족 안에서 벌어진 악행이라는 뉘앙스를 남겼습니다.
  alternative_readings:
  - ‘이스라엘에게’로 해석해 가해 대상을 분명히 하는 번역
  rationale: 그리스어는 전치사 ἐν을 사용하므로, 해석을 지나치게 좁히지 않고 원문의 범위를 보존하는 쪽이 더 투명합니다.
  doctrine_reference: source transparency / translation method
