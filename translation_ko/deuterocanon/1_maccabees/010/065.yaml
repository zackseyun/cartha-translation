base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/065.yaml
  text: And the king honored him[a], and enrolled him among the first friends[b], and appointed him general and governor of a district.
  footnotes:
  - marker: a
    text: Or 'listed him among the chief friends.' The phrase 'the first friends' likely reflects an official court rank.
    reason: lexical_alternative
  - marker: b
    text: The Greek term rendered 'governor of a district' refers to an administrative ruler over a territorial division.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 왕이 그를 높여 주었으며, 그를 첫째 친구들 가운데에 등록하고, 그를 장군과 지역의 통치자로 임명하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘첫째 친구들’은 왕실의 공식 서열 또는 직함을 가리키는 말일 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘지역의 통치자’는 한 영토 구역을 맡아 다스리는 행정 관직을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἐδόξασεν
  english_pob_choice: honored
  chosen_korean: 높여 주었으며
  alternatives_korean:
  - 존귀하게 하였으며
  - 명예를 주었으며
  lexicon: LSJ
  rationale: 궁정 정치 문맥에서의 ἐδόξασεν은 신학적 ‘영광스럽게 하다’보다 신분과 명예를 올려 주는 뜻이므로, 왕이 지위를 높여 준 뉘앙스를 살렸습니다.
- source_word: ἔγραψεν αὐτὸν τῶν πρώτων φίλων
  english_pob_choice: enrolled him among the first friends
  chosen_korean: 그를 첫째 친구들 가운데에 등록하고
  alternatives_korean:
  - 그를 첫째 친구들 가운데에 올리고
  - 그를 주요 친구들 가운데에 기록하고
  lexicon: LSJ
  rationale: γράφω의 ‘명부에 기록하다’는 뜻을 반영해 ‘등록하다’로 옮겼고, τῶν πρώτων φίλων은 궁정의 공식 칭호 가능성을 살려 직역에 가깝게 유지했습니다.
- source_word: στρατηγόν
  english_pob_choice: general
  chosen_korean: 장군
  alternatives_korean:
  - 군사령관
  - 지휘관
  lexicon: LSJ
  rationale: 군사 직함임을 분명히 하면서도 한국어에서 가장 자연스러운 관직명인 ‘장군’을 택했습니다.
- source_word: μεριδάρχην
  english_pob_choice: governor of a district
  chosen_korean: 지역의 통치자
  alternatives_korean:
  - 지방 통치자
  - 구역의 총독
  - 분구 통치자
  lexicon: LSJ
  rationale: 행정 구역을 다스리는 직분이라는 점을 드러내되, 정확한 헬레니즘 관직명으로 과도하게 특정하지 않도록 설명적으로 옮겼습니다.
