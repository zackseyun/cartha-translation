translation:
  language: ko
  text: 그리고 내가 그와 전투를 벌였고, 그와 그의 진영은 우리에게 궤멸되었으며, 우리는 그의 왕국의 왕좌에 앉았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνῆψα πρὸς αὐτὸν μάχην
  english_pob_choice: joined battle
  chosen_korean: 그와 싸움에 맞섰고
  alternatives_korean:
  - 그와 전투를 벌였고
  - 그와 싸웠고
  lexicon: LSJ
  rationale: μάχην을 단순히 ‘싸웠다’보다 전투 접촉의 의미를 살려 ‘싸움에 맞섰다’로 옮겨 군사적 대치를 드러냈습니다.
- source_word: συνετρίβη αὐτὸς καὶ ἡ παρεμβολὴ αὐτοῦ
  english_pob_choice: he and his camp were crushed
  chosen_korean: 그와 그의 진영은 우리에게서 무너졌으며
  alternatives_korean:
  - 그와 그의 진영은 우리에게서 부서졌으며
  - 그와 그의 진영은 우리에게 패배했으며
  lexicon: LSJ
  rationale: συντρίβω의 강한 파괴·분쇄 의미를 살려 ‘무너졌다’로 옮기고, παρεμβολή는 군사 문맥에 맞게 ‘진영’으로 렌더링했습니다.
- source_word: ὑφʼ ἡμῶν
  english_pob_choice: by us
  chosen_korean: 우리에게서
  alternatives_korean:
  - 우리로 말미암아
  - 우리 손에
  lexicon: LSJ
  rationale: 행위 주체를 자연스럽게 드러내면서도 승리의 결과를 담는 한국어식 표현으로 처리했습니다.
- source_word: ἐκαθίσαμεν ἐπὶ θρόνου βασιλείας αὐτοῦ
  english_pob_choice: we sat on the throne of his kingdom
  chosen_korean: 우리는 그의 왕국의 왕좌에 앉았습니다
  alternatives_korean:
  - 우리는 그의 왕국의 보좌에 앉았습니다
  - 우리는 그의 왕국의 왕좌에 앉아 있었습니다
  lexicon: LSJ
  rationale: θρόνος를 ‘왕좌’로, βασιλεία를 ‘왕국’으로 옮겨 왕권 승계를 분명히 했습니다.
