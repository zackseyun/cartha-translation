  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 두 부정과거 부정사구는 성벽 공사를 위한 비용이라는 구조이므로, 이를 ‘…하는 데 드는 비용’으로 명시하는 편이 자연스럽고 원문 구조에도 가깝습니다. 또한 ὀχυρῶσαι는 단순히 성벽이 ‘견고해지는’ 상태보다 성벽을 견고하게 하는 행위를 가리키므로 그 동작성을 살렸습니다. ἐκ τοῦ λόγου τοῦ βασιλέως는 재정·회계상의 의미와 왕의 공식 명령이라는 의미가 모두 가능한 난해한 표현이므로, 본문에서는 재정적 의미를 절제하여 반영하고 주석에서 대안을 보존했습니다.
