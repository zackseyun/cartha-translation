  text: and for the walls of Jerusalem to be rebuilt and fortified all around[a], the expense will be paid from the king’s treasury, and for the walls in Judea to be rebuilt.
  footnotes:
  - marker: a
    text: Or possibly, 'the expense will be provided by the king’s decree/order.' The Greek phrase 'from the king’s λόγος' can carry either an administrative-accounting sense or an official-authority sense; the main text adopts the financial nuance because it best fits 'the expense will be paid.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예루살렘의 성벽이 재건되고 사방으로 견고해지며[a], 그 비용은 왕의 재원에서 지급될 것이며, 유대의 성벽도 재건될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 비용은 왕의 명령/지시로 제공될 것입니다.” 그리스어 ‘왕의 λόγος’는 행정적 회계 의미와 공식 명령 의미를 모두 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδομηθῆναι
  english_pob_choice: to be rebuilt
  chosen_korean: 재건되다
  alternatives_korean:
  - 다시 세워지다
  - 건축되다
  lexicon: LSJ
  rationale: 무너진 성벽을 다시 세운다는 뜻을 자연스럽게 살리기 위해 ‘재건되다’를 선택했습니다.
- source_word: τὰ τείχη
  english_pob_choice: walls
  chosen_korean: 성벽
  alternatives_korean:
  - 벽
  - 요새
  lexicon: LSJ
  rationale: 예루살렘과 유대의 방어 시설 맥락상 단순한 ‘벽’보다 ‘성벽’이 원문의 방어적 의미를 더 정확히 드러냅니다.
- source_word: ὀχυρῶσαι κυκλόθεν
  english_pob_choice: fortified all around
  chosen_korean: 사방으로 견고해지다
  alternatives_korean:
  - 둘레를 따라 견고해지다
  - 사방으로 요새화되다
  lexicon: LSJ
  rationale: 둘러싼 방어 강화를 나타내는 표현이므로, 결과 상태를 드러내는 ‘사방으로 견고해지다’로 옮겼습니다.
- source_word: ἐκ τοῦ λόγου τοῦ βασιλέως
  english_pob_choice: from the king’s account
  chosen_korean: 왕의 재원에서
  alternatives_korean:
  - 왕의 명령으로
  - 왕의 회계에서
  - 왕의 말로
  lexicon: LSJ
  rationale: POB의 주석대로 λόγος는 여기서 행정·재정적 의미를 가질 수 있으며, 뒤의 ‘비용은 지급될 것이다’와 가장 잘 맞는 한국어는 ‘재원’입니다.
theological_decisions:
- issue: 왕의 λόγος를 재정적 출처로 볼지 행정 명령으로 볼지
  chosen_reading: 본문은 성벽 공사의 비용 지급을 말하므로 재정적 출처를 드러내는 번역을 본문에 두었습니다.
  alternative_readings:
  - 왕의 명령/지시에 따라
  - 왕의 칙령으로
  rationale: 문맥상 δαπάνη(비용)와 δοθήσεται(지급될 것이다)가 결합되어 있어, 독자가 공사비의 조달을 즉시 이해하도록 하는 것이 가장 적절합니다.
  doctrine_reference: 문맥 우선의 번역 원칙
