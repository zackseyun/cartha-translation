  terminology: ‘성벽’, ‘예루살렘’, ‘유대’는 적절합니다. ‘왕의 재원’은 가능하지만 λόγος의 회계적 뉘앙스를 너무 일반화할 수 있으므로 ‘왕의 재정’으로 옮기고, 명령/지시 해석은 각주에 남기는 것이 안전합니다.
