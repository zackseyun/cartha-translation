  yaml_path: translation/deuterocanon/1_maccabees/010/072.yaml
  text: Ask and learn who I am and who the rest are who are helping us; and they say[a], ‘You have no place to stand before us, because your fathers were routed twice in their own land.’
  footnotes:
  - marker: a
    text: Literally, 'there is not for you a standing of foot before our face.' The translation renders the Greek idiom as 'You have no footing to stand against us.'
    reason: lexical_alternative
translation:
  language: ko
  text: 묻고 알아보십시오. 내가 누구인지, 그리고 우리를 돕고 있는 나머지 사람들이 누구인지. 그러면 그들이 말할 것입니다. 「당신들에게는 우리 앞에 설 발 디딜 자리도 없습니다. 당신들의 조상은 자기 땅에서 두 번이나 패주했기 때문입니다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘우리 얼굴 앞에 있는 발의 서 있음이 너희에게는 없다’는 뜻이므로, 한국어는 관용적으로 풀었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρώτησον καὶ μάθε
  english_pob_choice: Ask and learn
  chosen_korean: 묻고 알아보십시오
  alternatives_korean:
  - 물어보고 알아보십시오
  - 묻고 배우십시오
  - 질문하고 알아보십시오
  lexicon: LSJ
  rationale: 두 명령형의 연속을 한국어의 자연스러운 병렬 명령으로 옮기되, μάθε의 정보 습득 의미를 ‘알아보십시오’로 살려 단순한 지식 상태가 아니라 확인 과정을 드러냈습니다.
- source_word: τίς εἰμι καὶ οἱ λοιποὶ οἱ βοηθοῦντές ἡμῖν
  english_pob_choice: who I am and who the rest are who are helping us
  chosen_korean: 내가 누구인지, 그리고 우리를 돕고 있는 나머지 사람들이 누구인지
  alternatives_korean:
  - 내가 누구이며 우리를 돕는 나머지 사람들이 누구인지
  - 내가 누구인지와 우리를 돕는 다른 사람들이 누구인지
  lexicon: LSJ
  rationale: τίς εἰμι를 직역해 ‘내가 누구인지’로 살리고, οἱ λοιποὶ οἱ βοηθοῦντές ἡμῖν은 단순한 ‘다른 사람들’보다 능동적 도움을 분명히 하는 ‘우리를 돕고 있는 나머지 사람들’로 옮겼습니다.
- source_word: Οὐκ ἔστιν ὑμῖν στάσις ποδὸς κατὰ πρόσωπον ἡμῶν
  english_pob_choice: You have no place to stand before us
  chosen_korean: 당신들에게는 우리 앞에 설 발 디딜 자리도 없습니다
  alternatives_korean:
  - 당신들에게는 우리 앞에 설 자리가 없습니다
  - 당신들에게는 우리 앞에 설 발붙일 곳도 없습니다
  - 당신들은 우리 앞에 설 자리가 없습니다
  lexicon: LSJ
  rationale: στάσις ποδὸς의 문자적 이미지와 POB가 주석에서 밝힌 관용구성을 함께 살려, ‘발 디딜 자리’로 발의 지지점을 보존하면서 ‘우리 앞에 설’로 κατὰ πρόσωπον의 대립적 뉘앙스를 유지했습니다.
- source_word: ἐτροπώθησαν
  english_pob_choice: were routed
  chosen_korean: 패주했기 때문입니다
  alternatives_korean:
  - 패배했기 때문입니다
  - 도망쳤기 때문입니다
  - 무너졌기 때문입니다
  lexicon: LSJ
  rationale: 군사적 맥락에서 단순한 ‘졌다’보다 전투에서 몰려 물러나는 의미를 담는 ‘패주하다’가 ἐτροπώθησαν의 힘을 더 잘 반영합니다.
