translation:
  language: ko
  text: 그리고 요나단은 일백육십 년의 일곱째 달, 곧 초막절에 거룩한 예복을 입고, 군대들을 모으고, 많은 무기를 마련했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘초막절’입니다. 그리스어는 문자적으로는 ‘초막/쉼터를 짓는 절기’를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεδύσατο
  english_pob_choice: put on
  chosen_korean: 입고
  alternatives_korean:
  - 둘러입고
  - 몸에 입고
  lexicon: LSJ
  rationale: 중간태 동사로 ‘옷을 입다’의 구체적 동작을 나타내므로, 한국어에서는 간결하고 자연스러운 ‘입고’가 가장 직접적입니다.
- source_word: τὴν ἁγίαν στολήν
  english_pob_choice: the holy robe
  chosen_korean: 거룩한 예복
  alternatives_korean:
  - 거룩한 옷
  - 성스러운 예복
  - 거룩한 의복
  lexicon: LSJ
  rationale: στολή는 격식 있는 예복/의복을 가리키며, ἁγίαν은 이를 성별된 것으로 표시하므로 ‘예복’이 제의적·공식적 뉘앙스를 살립니다.
- source_word: ἔτους ἑξηκοστοῦ καὶ ἑκατοστοῦ
  english_pob_choice: in the one hundred sixtieth year
  chosen_korean: 일백육십 년
  alternatives_korean:
  - 일백육십 해
  - 160년
  lexicon: LSJ
  rationale: 연대 표시는 한국어에서 ‘일백육십 년’으로 옮기면 고유한 연대기 표현을 유지하면서도 문맥상 자연스럽습니다.
- source_word: ἐν ἑορτῇ σκηνοπηγίας
  english_pob_choice: at the feast of Booths
  chosen_korean: 초막절에
  alternatives_korean:
  - 초막의 절기에
  - 장막절에
  - 수장절에
  lexicon: LSJ
  rationale: σκευνοπηγία는 유대 절기인 ‘Booths/Tabernacles’를 가리키므로, 통용되는 한국어 절기명 ‘초막절’이 가장 분명합니다.
- source_word: συνήγαγεν δυνάμεις
  english_pob_choice: he gathered forces
  chosen_korean: 군대들을 모으고
  alternatives_korean:
  - 병력을 모으고
  - 세력을 모으고
  - 군세를 모으고
  lexicon: LSJ
  rationale: δυνάμεις는 여기서 군사력을 뜻하므로 ‘군대들’을 택해 실제 동원된 병력을 드러냈습니다.
- source_word: κατεσκεύασεν ὅπλα πολλά
  english_pob_choice: made many weapons
  chosen_korean: 많은 무기를 마련했습니다
  alternatives_korean:
  - 많은 무기를 만들었습니다
  - 많은 병기를 준비했습니다
  lexicon: LSJ
  rationale: κατεσκευάσεν은 ‘만들다/준비하다’의 의미 폭이 있어, 군사적 맥락에서 실제 사용 가능 상태로 갖추는 뉘앙스를 살린 ‘마련했습니다’가 적절합니다.
theological_decisions:
- issue: ἁγίαν στολήν의 성격
  chosen_reading: 요나단이 입은 것은 일반 의복이 아니라 성별된 제의적 예복으로 이해해 ‘거룩한 예복’으로 옮겼습니다.
  alternative_readings:
  - 성스러운 옷
  - 성별된 옷
  - 제사장 예복
  rationale: 문맥은 단순한 복장이 아니라 공식적·종교적 위상을 드러내는 의복을 가리키므로, 과도한 특정화를 피하면서도 성별성을 보존했습니다.
  doctrine_reference: 제의적 성별과 성소/성직 관련 어휘의 문맥적 번역 원칙
