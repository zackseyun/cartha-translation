  source_fidelity: 그리스어의 시간 표현은 ‘제160년 일곱째 달, 초막절에’이며, 이어지는 동작은 요나단이 거룩한 예복을 입고 병력을 모으며 많은 무기를 만든 것입니다. 초안의 ‘군대들을’은 복수형을 부자연스럽게 재현했고, ‘마련했습니다’는 κατεσκεύασεν의 제조 의미를 다소 약화합니다.
