  source_fidelity: στεφάνων은 헬레니즘 왕정의 재정 문맥에서 ‘왕관/화관’이라는 명목의 공납 또는 금전 부담을 가리킵니다. 이를 ‘관세’로 옮기면 현대 한국어에서 통관세·수입세를 뜻하므로 원문의 항목과 맞지 않습니다. 또한 ἀφέματα πολλά는 행정적·재정적 면제를 뜻하므로 ‘여러 가지 면제’가 자연스럽고 의미상 정확합니다.
  naturalness: ‘많은 면제’보다 ‘여러 가지 면제’가 현대 한국어의 행정·공식 문맥에 더 자연스럽습니다. ‘여러분을 풀어 주고’는 원문의 별도 선언을 유지하면서도 뒤따르는 세금 면제와 구별됩니다.
  terminology: φόρων은 ‘세금’, τιμῆς τοῦ ἁλός는 ‘소금 부과금’으로 적절합니다. στεφάνων은 ‘왕관 공납’으로 옮기고, 문자적 의미와 역사적 재정 용법은 주석에서 밝혀야 합니다.
