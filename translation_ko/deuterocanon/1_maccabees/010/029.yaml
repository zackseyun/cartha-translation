base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/029.yaml
  text: And we will grant you many remissions[a], and we will give you gifts. And now I release you and exempt all the Jews from the taxes, from the salt duty[c][b], and from the crown levies.
  footnotes:
  - marker: a
    text: Or 'many exemptions' for 'many remissions' (ἀφέματα πολλά); the phrase refers to fiscal releases in context.
    reason: lexical_alternative
  - marker: b
    text: The expression 'salt duty' translates τιμῆς τοῦ ἁλός, likely a tax or assessed charge connected with salt.
    reason: cultural_note
  - marker: c
    text: '''Crown levies'' renders στεφάνων, literally ''crowns,'' a term used for royal tribute or its monetary equivalent.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 우리는 여러분에게 많은 면제[a]를 베풀고, 여러분에게 선물도 주겠습니다. 이제 나는 여러분을 풀어 주며, 모든 유대인을 세금과 소금 부과금[b]과 관세[c]에서 면제합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘많은 면제 조치’로 옮길 수 있습니다. ἀφέματα πολλά는 이 문맥에서 재정적 부담의 해제를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘소금 부과금’은 τιμῆς τοῦ ἁλός의 행정적 징수 성격을 드러낸 번역입니다.
    reason: cultural_note
  - marker: c
    text: ‘관세’는 στεφάνων(‘관들’)이 헬레니즘 왕정에서 공납 또는 그에 상응하는 금전적 부담을 가리키는 점을 풀어 옮긴 것입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἀφέματα πολλά
  english_pob_choice: many remissions
  chosen_korean: 많은 면제
  alternatives_korean:
  - 많은 감면
  - 많은 면제 조치
  - 많은 탕감
  lexicon: LSJ
  rationale: 재정·행정 문맥에서 ἀφέματα는 죄 사함이 아니라 의무의 경감/해제를 뜻하므로, 한국어에서는 자연스럽고 행정적인 ‘면제’가 가장 직접적입니다.
- source_word: ἀπολύω
  english_pob_choice: I release
  chosen_korean: 풀어 주며
  alternatives_korean:
  - 해방하며
  - 석방하며
  - 놓아 주며
  lexicon: BDAG
  rationale: 여기서는 사람을 법적으로 풀어 주는 왕령의 뉘앙스가 있으므로, 지나치게 감정적인 ‘해방’보다 ‘풀어 주다’가 원문의 공식성을 살립니다.
- source_word: τιμῆς τοῦ ἁλός
  english_pob_choice: salt duty
  chosen_korean: 소금 부과금
  alternatives_korean:
  - 소금세
  - 소금세금
  - 소금 관세
  lexicon: LSJ
  rationale: 직역하면 ‘소금의 값/부과’이지만, 문맥상 소금에 관련된 행정적 징수이므로 한국어에서는 의미를 드러내는 ‘소금 부과금’이 가장 무난합니다.
- source_word: στεφάνων
  english_pob_choice: crown levies
  chosen_korean: 관세
  alternatives_korean:
  - 왕관 부과금
  - 면류관 세금
  - 왕관세
  lexicon: LSJ
  rationale: στεφάνων은 문자적으로 ‘관들’이지만, 헬레니즘 왕정의 조세·공납 목록에서는 상징적 공납을 가리키므로, 한국어에서 오해를 줄이도록 ‘관세’로 옮겼습니다.
theological_decisions:
- issue: 왕령 형태의 면제 선언에서 ‘release/exempt’의 행정적 의미 유지
  chosen_reading: 본절은 개인적 용서나 노예 해방이 아니라, 왕이 유대인들에게 부과된 재정 의무를 공식적으로 면제하는 내용으로 읽었습니다.
  alternative_readings:
  - 일반적인 ‘용서’로 읽는 해석
  - 개인 신분 해방으로 읽는 해석
  rationale: 원문은 φόρων, τιμῆς τοῦ ἁλός, στεφάνων처럼 모두 세금·공납 항목을 열거하므로, 신학적 확대보다 행정적 면제를 분명히 드러내는 번역이 필요합니다.
  doctrine_reference: 역사서 본문의 문맥적 의미 우선, 재정·정치 용어의 비신학적 맥락 유지
