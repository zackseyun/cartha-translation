  source_fidelity: ‘우리와 맺은 조약들’은 조약이 귀하와 우리 사이에 맺어진 것임을 다소 보충합니다. 그리스어의 πρὸς ἡμᾶς는 우선 πίστιν(신의)의 상대를 나타내므로, ‘조약들에서 우리에게 신의를’로 옮겨 관계를 더 직접적으로 보존하는 편이 안전합니다. 또한 제공된 전승 본문에는 중복된 καὶ가 있고 끝이 ‘ἠκούσαμεν καὶ’로 절단되어 있으므로, 각주에서 이 두 현상을 밝혀야 합니다.
  naturalness: ‘우리와의 우정 안에 머물며’는 현대 한국어에서 다소 직역투입니다. 외교 문맥의 φιλία를 반영하여 ‘우리와의 우호 관계를 계속 지키시며’가 자연스럽고 의미도 명료합니다. 절단된 원문을 반영한 ‘우리는 들었습니다, 그리고’는 의도적으로 미완성인 표현이므로 본문에 유지할 수 있습니다.
