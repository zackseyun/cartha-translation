  lexicon: LSJ
  rationale: φιλία는 문자 그대로 ‘우정’이지만, 이 장르에서는 외교적 우호 관계도 포함하므로 ‘우정’으로 두되 관계성을 분명히 했습니다.
- source_word: οὐ προσεχωρήσατε τοῖς ἐχθροῖς ἡμῶν
  english_pob_choice: have not joined our enemies
  chosen_korean: 우리 원수들에게 가담하지 않으셨으니
  alternatives_korean:
