translation:
  language: ko
  text: 귀하께서 우리와 맺은 조약들에서 신의를 지키시고[a], 우리와의 우정 안에 머물며 우리 원수들에게 가담하지 않으셨으니, 우리는 들었습니다[b], 그리고
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리에게 신실함/충성을 지키셨다.’ 여기서 그리스어 πίστις는 외교적 문맥에서 신실성이나 충성의 뜻을 띨 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 전해지는 그리스어 본문은 여기서 ‘우리는 들었습니다, 그리고’로 끝나며, 이 절 경계에서 문장이 미완성입니다.
    reason: textual_variant
lexical_decisions:
- source_word: συνετηρήσατε πίστιν πρὸς ἡμᾶς
  english_pob_choice: you have kept faith with us
  chosen_korean: 우리와 맺은 조약들에서 신의를 지키시고
  alternatives_korean:
  - 우리에게 신의를 지키시고
  - 우리와의 신의를 지키시고
  - 우리에게 충성하셨으니
  lexicon: LSJ
  rationale: 외교적 문맥의 πίστις는 단순한 추상적 ‘믿음’보다 조약에 대한 ‘신의/충의’가 핵심이므로, 조약들과 직접 연결해 문맥을 드러냈습니다.
- source_word: συνθήκας
  english_pob_choice: in the treaties
  chosen_korean: 조약들
  alternatives_korean:
  - 협정들
  - 계약들
  - 언약들
  lexicon: LSJ
  rationale: 1 Maccabees의 국제정치 문맥에서 συνθήκη는 종교적 ‘언약’보다 국가 간 ‘조약’이 가장 정확합니다.
- source_word: τῇ φιλία ἡμῶν
  english_pob_choice: in our friendship
  chosen_korean: 우리와의 우정 안에
  alternatives_korean:
  - 우리와의 우호 안에
  - 우리의 우정 안에
  - 우리와의 동맹 안에
  lexicon: LSJ
  rationale: φιλία는 문자 그대로 ‘우정’이지만, 이 장르에서는 외교적 우호 관계도 포함하므로 ‘우정’으로 두되 관계성을 분명히 했습니다.
- source_word: οὐ προσεχωρήσατε τοῖς ἐχθροῖς ἡμῶν
  english_pob_choice: have not joined our enemies
  chosen_korean: 우리 원수들에게 가담하지 않으셨으니
  alternatives_korean:
  - 우리 원수들 편에 서지 않으셨으니
  - 우리 원수들에게 합류하지 않으셨으니
  - 우리의 적들에게 붙지 않으셨으니
  lexicon: LSJ
  rationale: προσεχωρέω는 한편에 ‘붙다/가담하다’는 뜻이므로 군사·정치적 이탈의 뉘앙스를 살렸습니다.
- source_word: ἠκούσαμεν
  english_pob_choice: we have heard
  chosen_korean: 우리는 들었습니다
  alternatives_korean:
  - 우리가 들었습니다
  - 우리는 들었고
  - 우리가 알게 되었습니다
  lexicon: LSJ
  rationale: 문장 끝이 다음 절로 이어지는 미완성 구문이므로, 한국어도 현재완료적 의미를 살리되 절단된 종결감을 과도하게 보강하지 않았습니다.
theological_decisions:
- issue: πίστις의 한국어 대응을 외교적 문맥에서 어떻게 유지할지
  chosen_reading: ‘신의’를 사용해 조약에 대한 충실성과 신뢰성을 함께 담았습니다.
  alternative_readings:
  - 믿음
  - 충성
  - 신실함
  rationale: 이 절의 πίστις는 신학 용례가 아니라 조약 준수의 외교적 신뢰를 가리키므로, 교회 전통의 ‘믿음’보다 문맥상 더 정확한 ‘신의’가 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — πίστις in diplomatic context'
