translation:
  language: ko
  text: 귀하께서 조약들에서 우리에게 신의를 지키시고[a], 우리와의 우호 관계를 계속 지키시며 우리 원수들에게 가담하지 않으셨으므로, 우리는 들었습니다, 그리고[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘조약들에서 우리에게 신실함/충성을 지키셨다.’ 여기서 그리스어 πίστις는 외교적 문맥에서 신실성이나 충성의 뜻을 띨 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 전해지는 그리스어 본문에는 ‘조약들’ 뒤에 접속사 ‘그리고’가 중복되어 있으며, 여기서는 ‘우리는 들었습니다, 그리고’로 끝납니다. 따라서 이 절 경계에서 문장이 문법적으로 미완성인 채 전해집니다.
    reason: textual_variant
lexical_decisions:
- source_word: συνετηρήσατε πίστιν πρὸς ἡμᾶς
  english_pob_choice: you have kept faith with us
