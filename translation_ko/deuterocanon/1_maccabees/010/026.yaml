  - 우리 원수들에게 합류하지 않으셨으니
  - 우리의 적들에게 붙지 않으셨으니
  lexicon: LSJ
  rationale: προσεχωρέω는 한편에 ‘붙다/가담하다’는 뜻이므로 군사·정치적 이탈의 뉘앙스를 살렸습니다.
- source_word: ἠκούσαμεν
