  source_fidelity: 그리스어의 세 동작(들음, 매우 많은 군사력을 모음, 그를 만나 전쟁을 위해 나감)을 충실히 반영합니다. ‘그 소식’은 ἤκουσεν의 목적어가 본문에 명시되어 있지는 않지만, 앞선 문맥에서 전해진 정보를 듣는다는 뜻을 한국어로 자연스럽게 드러낸 것으로 보이며 의미를 실질적으로 추가하지 않습니다. ‘그와 싸우려고 나갔습니다’도 εἰς συνάντησιν αὐτῷ εἰς πόλεμον의 적대적 만남과 전쟁 목적을 적절히 전달합니다.
