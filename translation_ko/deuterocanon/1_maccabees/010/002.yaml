lexical_decisions:
- source_word: ἤκουσεν
  english_pob_choice: heard
  chosen_korean: 그 소식을 듣고
  alternatives_korean:
  - 들었고
  - 알고
  lexicon: LSJ
  rationale: 여기서는 사건에 대한 반응으로서의 ‘듣다’가 자연스럽고, ‘그 소식’은 문맥상 전달된 전언을 분명히 합니다.
- source_word: συνήγαγεν δυνάμεις πολλὰς σφόδρα
  english_pob_choice: gathered very many forces
  chosen_korean: 매우 많은 군대를 모아
  alternatives_korean:
  - 아주 많은 병력을 집결시켜
  - 엄청나게 많은 군대를 소집하여
  lexicon: LSJ
  rationale: δυνάμεις는 군사적 맥락에서 ‘군대/병력’으로 옮길 수 있으며, ‘모아’는 συνήγαγεν의 기본 의미를 간결하게 살립니다.
- source_word: εἰς συνάντησιν αὐτῷ εἰς πόλεμον
  english_pob_choice: to meet him in battle
  chosen_korean: 그와 싸우려고 나갔습니다
  alternatives_korean:
  - 그를 맞으러 전투에 나갔습니다
  - 그와 전쟁하려고 나갔습니다
  lexicon: LSJ
  rationale: 직역의 ‘만나러’보다 뒤의 εἰς πόλεμον이 드러내는 적대적 의미를 살려, 목적을 분명히 하는 한국어로 옮겼습니다.
