  yaml_path: translation/deuterocanon/1_maccabees/010/047.yaml
  text: And they were pleased with Alexander[a], because he had become for them the initiator of peaceful terms, and they fought alongside him all the days.
  footnotes:
  - marker: a
    text: Or 'the leader in words of peace' or 'the originator of peace proposals.' The Greek phrase is somewhat compressed and likely refers to Alexander as the one who initiated conciliatory negotiations.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 알렉산드로스[a]를 호의적으로 여겼습니다. 그가 그들에게 평화 제안을 시작한 사람이 되었기 때문입니다. 그리고 그들은 줄곧 그와 함께 싸웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘평화의 말의 지도자’ 또는 ‘평화 제안의 발원자’로 옮길 수 있습니다. 그리스어 표현은 압축되어 있으며, 알렉산드로스가 화해를 위한 교섭을 먼저 제안하거나 주도한 사람을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν
  english_pob_choice: were pleased with
  chosen_korean: 좋게 여겼는데
  alternatives_korean:
  - 만족했는데
  - 호의적으로 여겼는데
  - 기뻐했는데
  lexicon: LSJ
  rationale: εὐδοκέω는 단순한 감정이 아니라 호의적 평가와 만족을 뜻하므로, 문맥상 ‘좋게 여기다’가 자연스럽고 과도한 신학적 뉘앙스를 덧붙이지 않습니다.
- source_word: ἐν Ἀλεξάνδρῳ
  english_pob_choice: with Alexander
  chosen_korean: 알렉산드로스[a]를
  alternatives_korean:
  - 알렉산드로스 안에서
  - 알렉산드로스를 향해
  - 알렉산드로스와
  lexicon: LSJ
  rationale: εὐδοκέω 뒤의 ἐν은 관용적으로 대상에 대한 호의의 방향을 나타내므로, 한국어에서는 목적격으로 풀어 자연스럽게 옮겼습니다.
- source_word: ἀρχηγὸς λόγων εἰρηνικῶν
  english_pob_choice: the initiator of peaceful terms
  chosen_korean: 평화로운 말의 선두
  alternatives_korean:
  - 평화 제안의 시작자
  - 화평의 말의 선도자
  - 평화로운 협상의 개시자
  lexicon: LSJ
  rationale: ἀρχηγός는 단순한 ‘지도자’보다 ‘앞장서서 시작하는 자’의 뉘앙스가 강하므로, POB의 해석을 따라 ‘선두’로 살리되 λόγων εἰρηνικῶν의 압축된 표현을 그대로 반영했습니다.
- source_word: συνεμάχουν
  english_pob_choice: fought alongside
  chosen_korean: 그의 편에서 싸웠습니다
  alternatives_korean:
  - 그와 함께 싸웠습니다
  - 동맹하여 싸웠습니다
  - 그와 나란히 싸웠습니다
  lexicon: LSJ
  rationale: συνεμάχουν은 단순한 지지보다 공동 군사행동을 가리키므로, ‘그의 편에서 싸웠습니다’로 전투적 협력을 분명히 했습니다.
theological_decisions:
- issue: 평화 관련 표현의 압축성 유지
  chosen_reading: ‘평화로운 말의 선두’로 옮겨, 본문의 외교적·협상적 압축 표현을 넓게 풀지 않고 남겼습니다.
  alternative_readings:
  - ‘평화 제안의 시작자’
  - ‘평화 협상의 주도자’
  rationale: 본문은 알렉산드로스가 화해적 협상의 출발점이었음을 간결하게 말하므로, 지나친 해설 없이 원문의 압축성을 보존하는 것이 적절합니다.
  doctrine_reference: 서술 본문; 역사적·외교적 맥락 해석
