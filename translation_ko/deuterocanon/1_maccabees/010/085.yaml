  - 불태워진 사람들과 함께
  lexicon: ἐμπυρισθεῖσιν
  rationale: σὺν의 결합 관계를 살려 ‘~과 합하여’로 처리했고, 수동 분사를 한국어 수동 표현으로 자연스럽게 옮겼습니다.
- source_word: εἰς ἄνδρας ὀκτακισχιλίους
  english_pob_choice: came to eight thousand men
  chosen_korean: 모두 팔천 명이었습니다
  alternatives_korean:
  - 팔천 명에 이르렀습니다
  - 팔천 명이 되었습니다
  lexicon: εἰς + accusative of total/result
  rationale: 전체 수를 나타내는 결과 표현이므로 ‘모두 …이었습니다’로 간결하게 처리했습니다.
