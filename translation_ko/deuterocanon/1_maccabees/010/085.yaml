lexical_decisions:
- source_word: οἱ πεπτωκότες μαχαίρᾳ
  english_pob_choice: those who fell by the sword
  chosen_korean: 칼에 맞아 쓰러진 사람들
  alternatives_korean:
  - 칼에 쓰러진 사람들
  - 칼에 죽임당한 사람들
  lexicon: πεπτωκότες / μάχαιρα
  rationale: 직역적으로는 ‘칼에 떨어진 자들’이지만, 한국어에서는 자연스럽게 ‘칼에 맞아 쓰러진 사람들’로 옮겨 결과를 분명히 했습니다.
- source_word: σὺν τοῖς ἐμπυρισθεῖσιν
  english_pob_choice: together with those who were burned
  chosen_korean: 불탄 사람들과 합하여
  alternatives_korean:
