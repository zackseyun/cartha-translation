theological_decisions:
- issue: εἴδωλον의 평가적 번역
  chosen_reading: ‘우상’으로 번역해 부정적 평가를 유지했습니다.
  alternative_readings:
  - ‘신상’
  - ‘우상 신전’ 대신 중립적 ‘성소’
  rationale: 본문은 중립적인 종교 시설이 아니라 폄하적 어휘로 이교 숭배를 지칭하므로, 한국어에서도 전통적 교회어법을 완화하지 않고 평가를 보존했습니다.
  doctrine_reference: '번역 원칙: 원문 우선, 평가어 보존'
