  text: And the cavalry was scattered in the plain[a], and they fled to Azotus and entered Beth-dagon, their idol temple, to save themselves.
  footnotes:
  - marker: a
    text: Or, more literally, 'entered Beth-dagon, their idol.' The Greek apposition is compressed; the sense is that they entered the sanctuary associated with their idol.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 기병대는 평원에서 흩어졌고, 그들은 아소돗으로 도망하여 베드다곤, 곧 그들의 우상 신전^a에 들어가 자기들을 구하려고 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
