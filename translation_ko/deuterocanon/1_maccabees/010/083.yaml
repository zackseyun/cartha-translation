  - 베드다곤, 그들의 우상 성소
  - 베드다곤, 그들의 우상 사당
  lexicon: LSJ
  rationale: 그리스어의 압축된 동격은 장소명과 그곳의 우상적 성격을 함께 말하므로, 본문에는 음역을 두고 설명적으로 ‘곧’으로 풀어 주어 장소-기능 관계를 드러냈습니다. ‘우상’은 εἴδωλον의 폄하적 뉘앙스를 살립니다.
- source_word: τοῦ σωθῆναι
  english_pob_choice: to save themselves
  chosen_korean: 자기들을 구하려고
  alternatives_korean:
  - 구원을 얻으려고
