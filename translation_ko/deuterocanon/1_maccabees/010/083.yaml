  yaml_path: translation/deuterocanon/1_maccabees/010/083.yaml
  text: And the cavalry was scattered in the plain[a], and they fled to Azotus and entered Beth-dagon, their idol temple, to save themselves.
  footnotes:
  - marker: a
    text: Or, more literally, 'entered Beth-dagon, their idol.' The Greek apposition is compressed; the sense is that they entered the sanctuary associated with their idol.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 기병대는 평원에 흩어졌고, 아소돗으로 달아나 베드다곤, 곧 그들의 우상 신전에 들어가 구원받으려고 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘베드다곤, 그들의 우상’입니다. 그리스어의 압축된 동격 표현은 베드다곤이 그들의 우상과 관련된 예배 장소임을 가리키는 것으로 이해될 수 있습니다.
    reason: lexical_alternative
