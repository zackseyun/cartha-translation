  issues:
  - severity: medium
    issue: 장소구의 통사 관계가 불명확함
    rationale: ‘예루살렘의 성소와 그 모든 경계 안으로’는 ‘성소’와 ‘경계’를 같은 목적어로 읽히게 합니다. 헬라어는 성소를 수식하는 ‘예루살렘과 그 모든 경계 안에 있는’을 보존하는 편이 안전합니다.
