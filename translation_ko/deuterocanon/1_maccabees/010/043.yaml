base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/043.yaml
  text: And as for any who flee to the sanctuary in Jerusalem and in all its borders[a], owing royal taxes or any other obligation, let them be released[b], along with everything that belongs to them in my kingdom.
  footnotes:
  - marker: a
    text: Or 'take refuge in the temple in Jerusalem and throughout its territory.' The Greek terms can be understood more broadly of the temple precincts or associated territory.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'owing royal dues and every matter.' The phrase may include taxes, debts, or other legal claims.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 예루살렘의 성소와 그 모든 경계 안으로 도피하는 자들 가운데, 왕에게 바칠 세금이나 다른 어떤 의무를 지고 있는 자가 있더라도, 그들은 풀어 주고[b], 내 왕국 안에 있는 그들의 모든 것도 함께 하게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예루살렘의 성전에 피신하고 그 영토 전역에 걸쳐’로도 옮길 수 있습니다. 그리스어 표현은 성전 구역이나 그와 연결된 지역을 더 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘왕실 세금과 모든 사안을 지고 있는’입니다. 이 표현은 세금, 빚, 또는 다른 법적 청구를 포함할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἱερὸν
  english_pob_choice: sanctuary
  chosen_korean: 성소
  alternatives_korean:
  - 성전
  - 신성한 곳
  lexicon: LSJ
  rationale: ἱερόν은 여기서 예루살렘 성전 건물만이 아니라 피난과 보호가 연관된 성역을 가리킬 수 있으므로, ‘성소’가 문맥을 가장 자연스럽게 살립니다.
- source_word: ὅσοι ἐὰν φύγωσιν
  english_pob_choice: flee
  chosen_korean: 도피하는 자들
  alternatives_korean:
  - 피하는 자들
  - 달아나는 자들
  - 피신하는 자들
  lexicon: LSJ
  rationale: φύγωσιν의 기본 동작은 ‘도망가다/도피하다’이므로, 피난처로 향하는 이동을 살리되 문맥상 보호 요청의 뉘앙스를 함께 담아 ‘도피하는 자들’로 옮겼습니다.
- source_word: ὀφείλων βασιλικὰ καὶ πᾶν πρᾶγμα
  english_pob_choice: owing royal taxes or any other obligation
  chosen_korean: 왕에게 바칠 세금이나 다른 어떤 의무를 지고 있는
  alternatives_korean:
  - 왕실 세금이나 다른 어떤 빚을 지고 있는
  - 왕에게 내야 할 공납이나 다른 어떤 청구를 지고 있는
  - 왕실 조세나 다른 어떤 채무를 지고 있는
  lexicon: LSJ
  rationale: ὀφείλων은 단순한 금전채무보다 ‘지고 있는 의무/채무’를 넓게 가리키며, βασιλικὰ는 왕권에 속한 조세·공납을 뜻할 수 있으므로 ‘세금’과 ‘의무’를 함께 써서 범위를 과도하게 좁히지 않았습니다.
- source_word: ἀπολελύσθωσαν
  english_pob_choice: let them be released
  chosen_korean: 풀어 주고
  alternatives_korean:
  - 면제하고
  - 석방하고
  - 해제하고
  lexicon: LSJ
  rationale: ἀπολύω의 법령적 용법은 ‘풀어 주다/해방하다’에 가깝고, 여기서는 의무 해제까지 포함하므로 한국어에서도 간결한 명령형으로 처리했습니다.
- source_word: ἐν τῇ βασιλείᾳ μου
  english_pob_choice: in my kingdom
  chosen_korean: 내 왕국 안에
  alternatives_korean:
  - 내 나라 안에
  - 내 통치 영역 안에
  - 내 왕국 내에
  lexicon: LSJ
  rationale: βασιλεία는 왕의 통치 영역을 뜻하므로, ‘내 왕국 안에’가 가장 직접적이며 문어체에서도 자연스럽습니다.
theological_decisions:
- issue: 피난 성소와 채무/의무 면제의 범위
  chosen_reading: 성소로 도피한 자들에게 왕실 조세와 다른 법적·재정적 의무를 풀어 주는 칙령으로 읽었습니다.
  alternative_readings:
  - ‘다른 어떤 의무’는 세금이 아닌 일반적 법적 청구까지 포함할 수 있습니다.
  - ‘그 모든 경계 안’은 성소의 구역이 아니라 예루살렘 전체의 관할을 넓게 가리킬 수 있습니다.
  rationale: 본문의 ὀφείλων이 βασιλικὰ와 πᾶν πρᾶγμα를 함께 지배하므로, 단순한 세금 면제보다 더 넓은 채무·의무 해제가 문맥상 자연스럽습니다. 다만 행정 구역의 정확한 범위는 모호하므로 번역도 ‘그 모든 경계 안’으로 유지했습니다.
  doctrine_reference: 역사적-문맥적 해석; 법령 문체 보존
- issue: 문장 말미의 접속 구조
  chosen_reading: ‘그들은 풀어 주고… 하십시오’로 칙령체를 살렸습니다.
  alternative_readings:
  - ‘그들을 풀어 주십시오’로 더 직접적으로 옮길 수 있습니다.
  - ‘면제받게 하십시오’로 법적 효과를 더 드러낼 수 있습니다.
  rationale: 그리스어의 수동 명령형 ἀπολελύσθωσαν은 공식 칙령의 문체를 띠므로, 한국어에서도 명령법을 유지해 왕의 선언 형식을 살렸습니다.
  doctrine_reference: 문체-화행 보존
