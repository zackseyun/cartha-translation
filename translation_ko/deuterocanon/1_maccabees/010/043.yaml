  source_fidelity: 현 초안은 왕실 조세 및 그 밖의 의무로부터의 해제를 대체로 잘 반영합니다. 그러나 ‘성소와 그 모든 경계 안으로’는 성소와 경계를 병렬 목적어처럼 만들며, 마지막의 ‘그들의 모든 것도 함께 하게 하십시오’는 원문의 소유물 관련 병렬 범위를 자연스럽고 명확하게 전달하지 못합니다.
  naturalness: ‘도피하는 자들 가운데 … 자가 있더라도’와 ‘모든 것도 함께 하게 하십시오’는 현대 한국어의 공식 법령체로 부자연스럽습니다. 조건절과 병렬 명령을 정돈하면 합쇼체 문체를 유지하면서 의미가 명료해집니다.
