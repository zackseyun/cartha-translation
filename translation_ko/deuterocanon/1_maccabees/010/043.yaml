revisions:
- from: 그리고 예루살렘의 성소와 그 모든 경계 안으로 도피하는 자들 가운데, 왕에게 바칠 세금이나 다른 어떤 의무를 지고 있는 자가 있더라도, 그들은 풀어 주고[b], 내 왕국 안에 있는 그들의 모든 것도 함께 하게 하십시오.[a]
  to: 그리고 예루살렘과 그 모든 경계 안에 있는 성소로 피신하는 사람들[a] 가운데 왕실 세금이나 그 밖의 어떤 의무를 지고 있는 사람이 있으면, 그들을 면제해 주십시오[b]. 내 왕국 안에 있는 그들의 모든 소유물도 마찬가지로 하십시오.
  rationale: 장소구를 ‘예루살렘과 그 모든 경계 안에 있는 성소’로 재구성하여 원문의 수식 관계에 대한 모호성을 보존했습니다. 법령 문맥에서 ἀπολελύσθωσαν을 자연스러운 합쇼체인 ‘면제해 주십시오’로 옮기고, 생략된 동사가 소유물에도 적용되는 마지막 병렬 구문은 ‘마찬가지로 하십시오’로 밝혔습니다. 이는 소유물을 구체적으로 몰수·반환한다고 단정하지 않고, 원문의 해제 범위를 유지합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:46:19Z'
review_pass:
