translation:
  language: ko
  text: 그리고 요나단은 그와 함께 있던 사람들과 돌아왔고, 많은 전리품을 가지고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘노획물’. 그리스어는 전투에서 빼앗은 물품을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέστρεψεν
  english_pob_choice: returned
  chosen_korean: 돌아왔는데
  alternatives_korean:
  - 되돌아왔는데
  - 돌아갔는데
  lexicon: LSJ
  rationale: 전투 장면에서의 단순한 복귀를 나타내므로, 과도한 방향 해석 없이 자연스러운 서술형 ‘돌아왔는데’로 옮겼습니다.
- source_word: σὺν τοῖς παρʼ αὐτοῦ
  english_pob_choice: with those who were with him
  chosen_korean: 자기와 함께 있던 사람들과 함께
  alternatives_korean:
  - 그와 함께 있던 자들과 함께
  - 자기 편 사람들과 함께
  lexicon: LSJ
  rationale: 직역하면 다소 어색하지만, ‘그와 함께 있던’이라는 관계를 살려 인물의 동행 집단을 자연스럽게 표현했습니다.
- source_word: σκῦλα
  english_pob_choice: plunder
  chosen_korean: 전리품
  alternatives_korean:
  - 노획물
  - 노획한 물건
  lexicon: LSJ
  rationale: 전쟁에서 빼앗은 물품을 가리키는 말이므로, 현대 한국어에서 가장 분명한 ‘전리품’을 택했습니다.
- source_word: πολλά
  english_pob_choice: much
  chosen_korean: 많은
  alternatives_korean:
  - 대량의
  - 아주 많은
  lexicon: LSJ
  rationale: 집합적 명사와 어울리도록 수량의 많음을 간결하게 드러냈습니다.
