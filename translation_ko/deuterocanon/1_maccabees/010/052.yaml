base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/052.yaml
  text: After I returned to my kingdom and sat on the throne of my fathers[a], and took control of the rule, and crushed Demetrius and gained control of our land,
  footnotes:
  - marker: a
    text: Or 'my ancestors' throne.' The Greek literally says 'the throne of my fathers,' a dynastic expression.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 내 왕국으로 돌아와 내 조상들의 왕좌에 앉아 통치권을 장악하고 데메트리오스를 짓부수어 우리 땅을 장악한 뒤에,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 아버지들의 왕좌’입니다. 그리스어는 문자적으로 ‘내 아버지들의 왕좌’라고 하며, 왕조적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέστρεψα εἰς τὴν βασιλείαν μου
  english_pob_choice: returned to my kingdom
  chosen_korean: 내 왕국으로 돌아와
  alternatives_korean:
  - 내 나라로 돌아와
  - 내 통치권으로 돌아와
  lexicon: LSJ
  rationale: εἰς τὴν βασιλείαν μου는 단순한 내면적 권세보다 정치적·영토적 왕국 귀환을 가리키므로, 한국어도 ‘왕국’으로 살려 문맥의 왕권 복귀를 드러냈습니다.
- source_word: ἐκάθισα ἐπὶ θρόνου πατέρων μου
  english_pob_choice: sat on the throne of my fathers
  chosen_korean: 내 조상들의 왕좌에 앉고
  alternatives_korean:
  - 내 아버지들의 왕좌에 앉고
  - 내 조상들의 보좌에 앉고
  lexicon: LSJ
  rationale: 직역적 ‘내 아버지들의 왕좌’를 그대로 살릴 수도 있지만, 왕조 계승을 뜻하는 관용이므로 한국어에서는 ‘조상들’로 자연스럽게 옮기되 ‘왕좌’로 왕조적 의미를 유지했습니다.
- source_word: ἐκράτησα τῆς ἀρχῆς
  english_pob_choice: took hold of the rule
  chosen_korean: 통치를 장악하였으며
  alternatives_korean:
  - 통치권을 장악하였으며
  - 권세를 장악하였으며
  - 통치를 차지하였으며
  lexicon: LSJ
  rationale: ἀρχή는 여기서 ‘통치/권위’의 영역이며, κρατέω와 결합해 지배를 얻는 뜻이 강하므로 ‘장악하다’로 힘을 살렸습니다. English POB의 ‘take hold of’도 이 지배의 획득을 반영합니다.
- source_word: συνέτριψα
  english_pob_choice: crushed
  chosen_korean: 무너뜨리고
  alternatives_korean:
  - 짓부수고
  - 분쇄하고
  - 꺾고
  lexicon: LSJ
  rationale: 군사적·폭력적 파괴를 나타내는 강한 동사이지만 한국어에서는 과도한 물리성보다 정치적 파멸의 함의를 살려 ‘무너뜨리다’로 옮겼습니다.
- source_word: ἐπεκράτησα τῆς χώρας ἡμῶν
  english_pob_choice: gained control of our land
  chosen_korean: 우리의 땅을 차지하였습니다
  alternatives_korean:
  - 우리의 땅을 장악하였습니다
  - 우리의 땅을 지배하였습니다
  - 우리의 땅을 얻었습니다
  lexicon: LSJ
  rationale: χώρα는 ‘땅/영토’이며 ἐπεκράτησα는 그 위에 대한 지배 획득을 뜻하므로, ‘차지하다’로 소유와 통제의 뉘앙스를 함께 살렸습니다.
theological_decisions:
- issue: dynastic phrase πατέρων μου의 한국어 처리
  chosen_reading: ‘내 조상들의’로 옮겨 왕조 계승의 뜻을 살렸습니다.
  alternative_readings:
  - ‘내 아버지들의’
  - ‘내 선조들의’
  rationale: 그리스어는 문자적으로 ‘나의 아버지들’이지만, 왕조 문맥에서는 선대 왕들을 가리키는 관용이므로 한국어에서는 의미를 분명히 하는 ‘조상들’이 더 적절합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
