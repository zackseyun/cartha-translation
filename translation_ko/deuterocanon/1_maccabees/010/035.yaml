lexical_decisions:
- source_word: οὐχ ἕξει ἐξουσίαν
  english_pob_choice: will have authority
  chosen_korean: 권한을 갖지 못합니다
  alternatives_korean:
  - 권세를 갖지 못합니다
  - 허가를 받지 못합니다
  lexicon: BDAG
  rationale: ἐξουσία는 단순한 힘보다 공식적 권한이나 권리를 가리키므로, 금지 조항의 법적 성격을 살려 ‘권한’으로 옮겼습니다.
- source_word: πρᾶξαι
  english_pob_choice: to act
  chosen_korean: 행하다
  alternatives_korean:
  - 조치하다
  - 행동하다
  lexicon: LSJ
  rationale: 이 동사는 여기서 특정 행위를 폭넓게 가리키므로, 지나치게 법률화하지 않고 자연스러운 한국어 ‘행하다’로 옮겼습니다.
- source_word: παρενοχλεῖν
  english_pob_choice: harass
  chosen_korean: 괴롭히다
  alternatives_korean:
  - 방해하다
  - 성가시게 하다
  lexicon: LSJ
  rationale: παρενοχλεῖν은 불편을 주고 간섭하는 뜻이 있어, 현대 한국어에서 강제적·적대적 간섭을 드러내는 ‘괴롭히다’가 가장 적절합니다.
- source_word: περὶ παντὸς πράγματος
  english_pob_choice: in any matter
  chosen_korean: 어떤 일에 대해서든
  alternatives_korean:
  - 모든 일에 관하여
  - 어떤 사안에 대해서든
  lexicon: BDAG
  rationale: περὶ + 속격은 ‘~에 관하여’의 범위를 나타내므로, 보호 범위가 전면적임을 자연스럽게 드러내는 표현으로 옮겼습니다.
