theological_decisions:
- issue: ἀνθʼ ὧν의 상호보답 구조
  chosen_reading: 직역적으로는 ‘...한 것에 대하여’이지만, 문맥상 보답의 관계가 분명하므로 한국어 본문에서는 ‘...에 대하여 좋은 것들로 갚겠습니다’로 옮겼습니다.
  alternative_readings:
  - ‘...에 대한 대가로’
  - ‘...한 것에 보답하여’
  rationale: 본절은 서신체의 호의 약속이므로 보답/교환 관계를 분명히 하되, 지나치게 법정적이거나 상거래적인 표현은 피했습니다.
  doctrine_reference: 상호 보답과 호의의 약속을 드러내는 일반적 문맥
- issue: μεθʼ ἡμῶν의 의미
  chosen_reading: ‘우리와 함께’로 두어, 단순한 수혜가 아니라 동반·협력의 관계 가능성을 열어 두었습니다.
  alternative_readings:
  - ‘우리에게’
  - ‘우리를 위하여’
  rationale: 영어 POB 주석이 지적하듯 이 전치사는 관계적 뉘앙스를 가질 수 있으므로, 해석을 좁히지 않고 원문에 가까운 표현을 유지했습니다.
  doctrine_reference: μετά + 속격의 기본 전치사 의미
