translation:
  language: ko
  text: 그리고 우리는 당신들이 우리와 함께 행하는 것에 대하여 좋은 것들로 갚겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리에게 하듯’, ‘우리를 향하여’로도 옮길 수 있습니다. 헬라어는 문자적으로 ‘우리와 함께’라고 하며, 협력이나 호의적 관계를 시사할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνταποδώσομεν
  english_pob_choice: we will repay
