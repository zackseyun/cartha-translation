translation:
  language: ko
  text: 내가 프톨레마이스와 그에 딸린 영토를 예루살렘에 있는 거룩한 이들에게[b][a] 선물로 주었습니다. 성소를 위한 우선적으로 필요한 비용으로 말입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘프톨레마이스와 그에 속한 것’, 혹은 ‘프톨레마이스와 그에 딸린 구역’.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 본문의 마지막 절은 다소 어색합니다. 문맥상 성소나 거룩한 봉사를 위한 지출을 뜻할 가능성이 높습니다. 또 다른 번역은 ‘거룩한 이들을 위한 필요한 비용’입니다.
    reason: alternative_reading
