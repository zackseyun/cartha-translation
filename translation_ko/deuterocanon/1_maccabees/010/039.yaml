theological_decisions:
- issue: 마지막 구절의 τοῖς ἁγίοις 의미
  chosen_reading: 첫 번째 τοῖς ἁγίοις는 예루살렘의 거룩한 이들을 가리키고, 마지막 표현은 성소 관련 비용을 뜻하는 방향으로 이해해 옮겼습니다.
  alternative_readings:
  - 두 표현 모두 거룩한 사람들을 가리킴
  - 마지막 표현은 '거룩한 것들' 혹은 '성소'를 뜻함
  rationale: 본문의 재무·성전 맥락에서는 마지막 구가 사람보다 성소 운영 비용을 가리킨다고 보는 편이 더 자연스럽습니다. 다만 첫 번째 용례는 사람을 가리키는 복수형으로 그대로 유지했습니다.
  doctrine_reference: 번역 원칙 §1, §5
