lexical_decisions:
- source_word: ἐπέστρεψεν
  english_pob_choice: returned
  chosen_korean: 돌아왔습니다
  alternatives_korean:
  - 되돌아갔습니다
  - 돌아갔습니다
  lexicon: BDAG
  rationale: 이 동사는 목적지로의 귀환을 나타내므로, 자연스러운 서술형으로 ‘돌아왔습니다’가 가장 적절합니다.
- source_word: μετʼ εἰρήνης
  english_pob_choice: with peace
  chosen_korean: 평강과 함께
  alternatives_korean:
  - 평강으로
  - 평강 가운데
  lexicon: LSJ
  rationale: μετά + 속격의 기본 의미를 살려 ‘~와 함께’로 옮기되, 한국어에서는 평안한 상태를 나타내는 ‘평강’이 가장 자연스럽습니다.
- source_word: εὐφροσύνης
  english_pob_choice: gladness
  chosen_korean: 기쁨
  alternatives_korean:
  - 즐거움
  - 환희
  lexicon: LSJ
  rationale: εὐφροσύνης는 기쁨·즐거움의 뜻이므로, 간결한 서술문에서는 ‘기쁨’이 가장 무난하며 앞의 ‘평강’과도 균형을 이룹니다.
- source_word: Ἰωνάθαν
  english_pob_choice: Jonathan
  chosen_korean: 요나탄
  alternatives_korean:
  - 요나단
  lexicon: 고유명사 표기 관례
  rationale: 헬라어 음가를 따라 ‘요나탄’으로 옮기되, 한국어 성경에서 널리 알려진 이름 형태와도 무리 없이 대응됩니다.
theological_decisions:
- issue: 평강과 기쁨의 결합 표현
  chosen_reading: 단순한 귀환의 동반 상태를 나타내는 역사 서술로 이해했습니다.
  alternative_readings:
  - 하나님의 보호를 암시하는 신학적 표현으로 확대해 옮김
  - 예배적·축복적 어조로 정서화함
  rationale: 본문은 사건의 상태를 간단히 진술하므로, 의미를 과장하지 않고 ‘평강과 기쁨과 함께’로 직역-자연화했습니다.
  doctrine_reference: 서사 본문 해석 원칙
