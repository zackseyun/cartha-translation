- from: 그리고 시몬은 자기 부대를 풀어 전개하고 팔랑크스와 맞붙었습니다[a]. 그 까닭은 기병이 혼란에 빠졌기 때문입니다[c][b]. 그리고 그들은 그에게 짓눌려 패주했습니다.
  to: 그리고 시몬은 자신의 병력을 전개하여 팔랑크스와 교전했습니다[a]. 기병대가 혼란에 빠졌기 때문입니다[b][c]. 그들은 시몬에게 격파되어 달아났습니다.
  rationale: 군사 서술의 원문 의미를 유지하면서, 중복적인 ‘풀어 전개하고’를 간결한 ‘병력을 전개하여’로 고쳤습니다. ‘기병대’로 집합적 군사 의미를 명확히 했고, 마지막 절은 시몬을 명시하여 ἀπʼ αὐτοῦ의 자연스러운 전투 결과를 드러냈습니다. 각주 표지는 해당 어휘 뒤에 배치했습니다.
