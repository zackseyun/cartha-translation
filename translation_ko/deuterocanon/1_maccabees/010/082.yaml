  - severity: low
    issue: ‘그에게 짓눌려’의 지시와 결합이 다소 어색함
    rationale: ἀπʼ αὐτοῦ는 여기서 시몬에 의해 적군이 궤멸한 결과를 나타냅니다. ‘시몬에게 격파되어’는 선행 인물을 분명히 하고 συνετρίβησαν의 전투 문맥상 의미를 명료하게 전달합니다.
