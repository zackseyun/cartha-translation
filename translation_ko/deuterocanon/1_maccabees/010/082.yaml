  yaml_path: translation/deuterocanon/1_maccabees/010/082.yaml
  text: And Simon deployed his force and joined battle with the phalanx[a], for the cavalry had been thrown into disorder[c][b]; and they were crushed by him and fled.
  footnotes:
  - marker: a
    text: Or 'joined battle with the phalanx.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'the horse'; that is, the cavalry.
    reason: lexical_alternative
  - marker: c
    text: Or 'was broken up' / 'was undone,' referring to the cavalry's loss of cohesion.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 시몬은 자신의 병력을 전개하여 팔랑크스와 교전했습니다[a]. 기병대가 혼란에 빠졌기 때문입니다[b][c]. 그들은 시몬에게 격파되어 달아났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘팔랑크스와 맞붙었습니다.’
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘말’이지만, 여기서는 기병대를 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘무너졌다’ 또는 ‘해체되었다’. 기병대의 결속이 풀린 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέλυσεν
  english_pob_choice: deployed
  chosen_korean: 풀어 전개하고
  alternatives_korean:
  - 출동시켰고
  - 전개했고
  - 풀어 놓고
  lexicon: LSJ
  rationale: 군사적 문맥에서 단순한 ‘풀다’보다 부대를 작전에 들어가게 하는 동작을 살려 ‘풀어 전개하고’로 옮겼습니다.
- source_word: τὴν δύναμιν αὐτοῦ
  english_pob_choice: his force
  chosen_korean: 자기 부대
  alternatives_korean:
  - 자기 군대
  - 자기 병력
  - 자기 군세
  lexicon: LSJ
  rationale: δύναμις는 여기서 개별 병력보다 한 덩어리의 군사력/부대를 가리키므로, 과도하게 확대하지 않고 자연스럽게 ‘부대’로 처리했습니다.
- source_word: συνῆψεν πρὸς τὴν φάλαγγα
  english_pob_choice: joined battle with the phalanx
  chosen_korean: 팔랑크스와 맞붙었습니다
  alternatives_korean:
  - 팔랑크스와 교전했습니다
  - 팔랑크스와 전투를 벌였습니다
  - 팔랑크스와 붙었습니다
  lexicon: LSJ
  rationale: συνῆψεν πρὸς는 ‘접전을 벌이다’의 뜻으로, 헬레니즘 군사편제인 φάλαγγα를 그대로 살려 ‘팔랑크스’로 옮겼습니다.
- source_word: ἡ γὰρ ἵππος ἐξελύθη
  english_pob_choice: the cavalry had been thrown into disorder
  chosen_korean: 기병이 혼란에 빠졌기 때문입니다
  alternatives_korean:
  - 기병이 무너졌기 때문입니다
  - 기병이 흩어졌기 때문입니다
  - 기병이 해체되었기 때문입니다
  lexicon: LSJ
  rationale: ἵππος는 문자적으로 ‘말’이지만 군사 문맥상 기병을 뜻하므로 그렇게 이해했고, ἐξελύθη는 질서가 무너진 상태를 담아 ‘혼란에 빠지다’로 옮겼습니다.
- source_word: ἀπʼ αὐτοῦ
  english_pob_choice: by him
  chosen_korean: 그에게
  alternatives_korean:
  - 그 앞에서
  - 그로 말미암아
  - 그 앞에
  lexicon: LSJ
  rationale: 전투 서술에서 ἀπʼ αὐτοῦ는 시몬과의 충돌에서 비롯된 패배를 가리키므로, 원인/행위 주체를 드러내는 ‘그에게’가 가장 자연스럽습니다.
theological_decisions:
- issue: 전투 서술의 동사 강도
  chosen_reading: ‘짓눌려 패주했습니다’로  συνετρίβησαν... καὶ ἔφυγαν의 연속적 패배를 살렸습니다.
  alternative_readings:
  - ‘부서져 달아났습니다’
  - ‘산산이 무너져 도망쳤습니다’
  rationale: 둘 다 단순한 후퇴가 아니라 결정적 붕괴와 도주를 함께 나타내므로, 한국어에서도 강한 패배의 중첩을 유지했습니다.
  doctrine_reference: 역사 서술의 문맥 보존
