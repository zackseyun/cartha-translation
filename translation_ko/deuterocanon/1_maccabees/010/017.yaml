lexical_decisions:
- source_word: ἔγραψεν
  english_pob_choice: wrote
  chosen_korean: 써서
  alternatives_korean:
  - 기록하여
  - 작성하여
  lexicon: LSJ
  rationale: 과거 능동형 γράφω는 문맥상 자연스럽게 ‘쓰다’로 옮기는 것이 가장 직접적입니다. 결과 연결을 드러내기 위해 ‘써서’를 택했습니다.
- source_word: ἐπιστολὰς
  english_pob_choice: letters
  chosen_korean: 편지들을
  alternatives_korean:
  - 편지
  - 서신들
  lexicon: LSJ
  rationale: 헬라어 복수형을 반영해 복수 ‘편지들을’로 옮겼습니다. 영어 POB의 주석처럼 단수 ‘편지’로 평준화하지 않았습니다.
- source_word: ἀπέστειλεν
  english_pob_choice: sent
  chosen_korean: 보냈습니다
  alternatives_korean:
  - 파견했습니다
  - 발송했습니다
  lexicon: LSJ
  rationale: ἀποστέλλω의 기본 의미는 ‘보내다’이므로, 현대 문맥에서 가장 자연스럽고 직역성도 유지되는 ‘보냈습니다’를 선택했습니다.
- source_word: αὐτῷ
  english_pob_choice: to him
  chosen_korean: 그에게
  alternatives_korean:
  - 그 사람에게
  - 요나단에게
  lexicon: LSJ
  rationale: 대명사 지시를 그대로 살려 ‘그에게’로 옮겼습니다. 본문이 여기서 이름을 반복하지 않으므로, 해석적으로 이름을 보충하지 않았습니다.
