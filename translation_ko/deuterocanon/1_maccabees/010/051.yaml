  rationale: 헬라어 πρέσβεις는 공식 대표자를 가리키지만, 한국어 ‘대사들’은 현대 국가 체제 뉘앙스가 강하므로, 왕실 외교 문맥을 살리면서도 과도한 현대화를 피하는 ‘사절들’이 적절합니다.
- source_word: κατὰ τοὺς λόγους τούτους
  english_pob_choice: with these words
  chosen_korean: 이 말들을 전하며
  alternatives_korean:
  - 이 말에 따라
  - 이런 말로
  lexicon: LSJ
  rationale: 다음 절의 직접 인용을 도입하는 관용구이므로, 의미상 ‘이 말들을 전하며’가 본문 흐름을 가장 자연스럽게 드러냅니다.
- source_word: βασιλέα Αἰγύπτου
  english_pob_choice: king of Egypt
  chosen_korean: 이집트 왕
  alternatives_korean:
  - 이집트의 왕
  - 이집트 국왕
  lexicon: LSJ
  rationale: 고유명사 프톨레마이오스에 대한 동격 표지로서, 한국어에서는 관사를 드러내지 않고 ‘이집트 왕’으로 간결하게 옮기는 것이 가장 자연스럽습니다.
