  text: And the battle raged fiercely until the sun set, and Demetrius fell on that day.
translation:
  language: ko
  text: 그리고 해가 질 때까지 전투가 몹시 격렬하였고, 데메트리오스는 그날에 쓰러졌습니다.
  philosophy: formal
lexical_decisions:
- source_word: ἐστερέωσεν πόλεμον σφόδρα
  english_pob_choice: the battle raged fiercely
  chosen_korean: 전투가 몹시 격렬하였고
  alternatives_korean:
  - 전투가 맹렬하게 이어졌고
  - 전투가 극심하게 벌어졌고
  lexicon: στερεόω / πόλεμος / σφόδρα
  rationale: ἐστερέωσεν은 문자적으로 '굳게 하다'이지만, 전투 문맥에서는 POB의 'raged fiercely'처럼 전투가 격렬하게 계속되었다는 의미를 살려 자연스럽게 옮겼습니다.
- source_word: ἕως ἔδυ ὁ ἥλιος
  english_pob_choice: until the sun set
  chosen_korean: 해가 질 때까지
  alternatives_korean:
  - 해가 지기까지
  - 태양이 지기까지
  lexicon: ἕως / δύω / ὁ ἥλιος
  rationale: 시간 종결 표현을 현대 한국어의 자연스러운 관용으로 옮기되, 원문의 사건 종료 시점을 그대로 유지했습니다.
- source_word: ἔπεσεν
  english_pob_choice: fell
  chosen_korean: 쓰러졌습니다
  alternatives_korean:
  - 죽었습니다
  - 넘어졌습니다
  lexicon: πίπτω
  rationale: 전장 서술에서 ἔπεσεν은 단순한 물리적 넘어짐보다 패배·전사·몰락을 포괄할 수 있어, 한국어에서는 직접적이면서도 함축을 남기는 '쓰러졌습니다'가 가장 균형적입니다.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  english_pob_choice: on that day
  chosen_korean: 그날에
  alternatives_korean:
  - 그날
  - 그날에
  lexicon: ἡμέρα / ἐκείνη
  rationale: 원문의 지시 표현을 유지하여 사건이 같은 날에 일어났음을 분명히 했습니다.
theological_decisions:
- issue: 데메트리오스의 죽음/패배를 직접 명시할지 여부
  chosen_reading: 본문은 '쓰러졌습니다'로 옮겨 전투적 패배와 죽음을 모두 열어 두었습니다.
  alternative_readings:
  - 죽었습니다
  - 전사했습니다
  rationale: ἔπεσεν은 문맥상 전사 가능성이 크지만, 현재 절 자체는 단어 하나만으로 사망을 명시하지 않으므로 해석을 과도하게 고정하지 않았습니다.
  doctrine_reference: 서사 문맥의 최소 해석 원칙
