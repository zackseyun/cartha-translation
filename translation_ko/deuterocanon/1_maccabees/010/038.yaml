theological_decisions:
- issue: 대제사장의 권위에 대한 서술 범위
  chosen_reading: 이 절은 영적 교리 진술보다 행정·정치적 지배 관계를 말하므로, ‘대제사장’의 역할을 제도적 권위로만 드러냈습니다.
  alternative_readings:
  - 대제사장에게 종교적으로 복종해야 한다는 व्यापक한 의미로 읽을 수 있습니다.
  - 유대 공동체 전체의 종교적 최고권을 암시하는 것으로 읽을 수 있습니다.
  rationale: 원문은 영토 편입과 복종의 경계를 다루며, 본문이 직접 말하지 않는 신학적 확장을 피하는 것이 원문 충실도에 맞습니다.
  doctrine_reference: 원문 우선 원칙; 행정·정치적 문맥 보존
