base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/038.yaml
  text: And the three districts added to Judea from the territory of Samaria[a], let them be attached to Judea, so as to be reckoned as one[b], so as not to obey any other authority except that of the high priest.
  footnotes:
  - marker: a
    text: Or 'the three nomes,' using the Hellenistic administrative term for districts.
    reason: lexical_alternative
  - marker: b
    text: Literally 'to become under one,' that is, to be treated as a single administrative unit.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 사마리아 지역에서 유대에 더해진 그 세 행정 구역도 유대에 붙여, 하나로 여겨지게 하며, 다른 어떤 권위에도 복종하지 않게 하되 오직 대제사장의 권위에만 복종하게 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘행정 구역’은 헬라스 시대 행정 용어 νόμος의 뜻을 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘하나 아래로 되게’라는 뜻으로, 하나의 행정 단위로 취급되게 하라는 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: νομοὺς
  english_pob_choice: districts
  chosen_korean: 행정 구역
  alternatives_korean:
  - 구역
  - 노모스
  - 행정 지구
  lexicon: LSJ
  rationale: 헬라스 행정 용어 νόμος는 여기서 ‘율법’이 아니라 지방 행정 단위를 가리키므로, 현대 독자가 이해하기 쉬운 ‘행정 구역’으로 옮겼습니다.
- source_word: προστεθέντας / προστεθήτω
  english_pob_choice: added / let them be attached
  chosen_korean: 더해진 / 붙여
  alternatives_korean:
