  - 병합된 / 병합하게 하여
  - 편입된 / 편입하게 하여
  lexicon: LSJ
  rationale: 과거 분사와 명령형의 차이를 살려, 이미 더해진 상태와 공식적으로 붙이라는 명령을 구분해 표현했습니다.
- source_word: πρὸς τὸ λογισθῆναι τοῦ γενέσθαι ὑφʼ ἕνα
  english_pob_choice: so as to be reckoned as one
  chosen_korean: 하나로 여겨지게 하며
  alternatives_korean:
  - 하나로 계산되게 하며
  - 한 단위로 간주되게 하며
  - 한 아래로 되게 하며
  lexicon: LSJ
  rationale: λογίζομαι의 행정적·공식적 의미를 살려 ‘여겨지게 하며’로 옮겼고, ‘ὑφʼ ἕνα’의 통일성을 자연스럽게 반영했습니다.
- source_word: ἄλλης ἐξουσίας
  english_pob_choice: any other authority
  chosen_korean: 다른 어떤 권위
  alternatives_korean:
  - 다른 어떤 권세
  - 다른 어떤 통치
  - 다른 어떤 관할
  lexicon: LSJ
  rationale: ἐξουσία는 여기서 통치 권한/관할의 뜻이므로, 문맥상 가장 무난한 공적 표현인 ‘권위’를 택했습니다.
theological_decisions:
- issue: 대제사장의 권위에 대한 서술 범위
  chosen_reading: 이 절은 영적 교리 진술보다 행정·정치적 지배 관계를 말하므로, ‘대제사장’의 역할을 제도적 권위로만 드러냈습니다.
  alternative_readings:
  - 대제사장에게 종교적으로 복종해야 한다는 व्यापक한 의미로 읽을 수 있습니다.
  - 유대 공동체 전체의 종교적 최고권을 암시하는 것으로 읽을 수 있습니다.
  rationale: 원문은 영토 편입과 복종의 경계를 다루며, 본문이 직접 말하지 않는 신학적 확장을 피하는 것이 원문 충실도에 맞습니다.
  doctrine_reference: 원문 우선 원칙; 행정·정치적 문맥 보존
