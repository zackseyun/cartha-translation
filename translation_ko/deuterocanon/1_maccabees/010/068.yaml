    issue: 원문에 없는 ‘그때’가 추가되었습니다.
    rationale: καί는 사건을 잇는 접속사일 뿐 특정한 시간 지시를 요구하지 않습니다. 이를 생략하면 불필요한 시간적 뉘앙스를 피할 수 있습니다.
  - severity: low
    issue: ἐλυπήθη σφόδρα를 ‘몹시 근심하였으며’로 옮겼습니다.
    rationale: ‘근심하다’는 염려의 뉘앙스가 강합니다. 이 문맥의 λυπέω는 몹시 괴롭거나 슬픈 정서 상태를 가리키므로 ‘몹시 괴로워하여’가 더 직접적입니다.
  revised_text: 알렉산드로스 왕은 그 소식을 듣고 몹시 괴로워하여 안티오키아로 돌아갔습니다.
