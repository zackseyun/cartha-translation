lexical_decisions:
- source_word: Ἀλέξανδρος ὁ βασιλεύς
  english_pob_choice: Alexander the king
  chosen_korean: 알렉산드로스 왕
  alternatives_korean:
  - 왕 알렉산드로스
  - 알렉산드로스 그 왕
  lexicon: BDAG
  rationale: 그리스어의 동격 구조를 한국어에서 자연스럽게 옮기되, 인명보다 직함을 앞세운 통상적인 역사 서술을 반영했습니다.
- source_word: ἤκουσεν
  english_pob_choice: heard
  chosen_korean: 이 소식을 듣고
  alternatives_korean:
  - 들었습니다
  - 전해 들었습니다
  lexicon: BDAG
  rationale: 문맥상 단순 청취보다 앞선 사건의 소식을 접한 의미가 자연스러워, 한국어에서는 관용적으로 '이 소식을 듣고'로 풀었습니다.
- source_word: ἐλυπήθη σφόδρα
  english_pob_choice: was greatly grieved
  chosen_korean: 몹시 근심하였으며
  alternatives_korean:
  - 크게 슬퍼하였으며
  - 심히 괴로워하였으며
  lexicon: BDAG
  rationale: λυπέω의 정서적 고통을 살리면서도, 전쟁·정치 서술에서 과도하게 감상적으로 들리지 않도록 '근심하다'를 택했습니다.
- source_word: ἀπέστρεψεν εἰς Ἀντιόχειαν
  english_pob_choice: returned to Antioch
  chosen_korean: 안티오키아로 돌아갔습니다
  alternatives_korean:
  - 안티오키아로 돌아섰습니다
  - 안티오키아로 되돌아갔습니다
  lexicon: BDAG
  rationale: 이 동사는 서술 문맥에서 단순한 방향 전환이 아니라 귀환을 뜻하므로, 가장 자연스러운 현대 한국어인 '돌아갔습니다'로 옮겼습니다.
