  source_fidelity: 그리스어의 세 동사(들었다, 몹시 괴로워했다, 안티오키아로 돌아갔다)는 대체로 충실히 옮겼습니다. 다만 원문에 없는 시간 부사 ‘그때’는 덧붙일 필요가 없고, λυπέω의 직접적인 정서적 고통은 ‘근심하다’보다 ‘괴로워하다’가 더 가깝습니다. ‘그 소식’은 앞 문맥에서 전달된 내용을 자연스럽게 가리키는 보충으로 허용됩니다.
  naturalness: 수정문은 현대 표준 한국어의 격식 있는 합쇼체로 자연스럽고, 연속된 사건을 간결하게 연결합니다.
  terminology: ‘알렉산드로스 왕’과 ‘안티오키아’는 통용되는 역사적 인명·지명 표기이며 적절합니다. 신학적 전문 용어 및 각주는 해당하지 않습니다.
  issues:
