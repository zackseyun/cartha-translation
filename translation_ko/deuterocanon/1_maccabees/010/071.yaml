- source_word: δύναμις τῶν πόλεων
  english_pob_choice: the strength of the cities
  chosen_korean: 도시들의 힘
  alternatives_korean:
  - 도시들의 군세
  - 도시들의 세력
  - 성읍들의 힘
  lexicon: BDAG
  rationale: 원문의 단수 δύναμις를 그대로 살리면 ‘힘’이 가장 직접적이고, τῶν πόλεων은 복수 소유격이므로 ‘도시들의 힘’으로 압축했습니다.
