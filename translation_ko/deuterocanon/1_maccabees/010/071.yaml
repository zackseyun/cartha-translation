- source_word: κατάβηθι πρὸς ἡμᾶς εἰς τὸ πεδίον
  english_pob_choice: come down to us in the plain
  chosen_korean: 내려와서 우리와 함께 평지에서
  alternatives_korean:
  - 내려와서 우리에게로 들판에서
  - 평지로 내려와 우리를 만나
  lexicon: BDAG
  rationale: πεδίον은 군사적 결투 장소로서의 ‘평지’가 가장 자연스럽고, κατάβηθι는 직접 명령의 공간 이동을 살려 ‘내려와서’로 옮겼습니다.
- source_word: συγκριθῶμεν ἑαυτοῖς
  english_pob_choice: let us meet there
  chosen_korean: 맞서 보십시오
  alternatives_korean:
