    reason: lexical_alternative
translation:
  language: ko
  text: 그러니 이제, 네가 네 병력을 믿는다면 우리에게로 평지에 내려오십시오. 거기서 서로 맞섭시다.[a] 내게는 도시들의 힘이 있기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거기서 서로 만납시다’로 옮길 수 있습니다. 이 표현은 문맥상 직접적인 대치나 대결을 암시할 수 있으며, 직역하면 ‘서로 비교해 봅시다’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘도시들의 병력’으로 옮길 수 있습니다. 헬라어 표현은 여러 도시에서 나온 집단적 군사 지원을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέποιθας
