  text: Now then[a], if you trust in your forces, come down to us in the plain, and let us meet there[b], because with me is the strength of the cities.
  footnotes:
  - marker: a
    text: Or 'let us engage one another there'; the Greek expression can suggest direct confrontation in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'the forces of the cities.' The Greek phrase may refer collectively to military support drawn from the cities.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 그러니, 네가 네 군세를 믿거든, 내려와서 우리와 함께 평지에서 맞서 보십시오. 왜냐하면 내게는 도시들의 힘이 있기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거기서 서로 맞붙어 보자’로도 옮길 수 있습니다. 헬라어 표현은 문맥상 직접적인 충돌을 암시할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘도시들의 군세’로도 옮길 수 있습니다. 헬라어 구문은 여러 도시에서 끌어온 군사적 지원을 함께 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέποιθας
  english_pob_choice: you trust
  chosen_korean: 네가 … 믿거든
  alternatives_korean:
  - 네가 … 신뢰하거든
  - 네가 … 의지하거든
  lexicon: BDAG
  rationale: 완료형의 상태적 뉘앙스를 한국어 조건절로 자연스럽게 살리되, 군사적 도전문맥에서 ‘믿다’가 가장 간결하게 확신의 상태를 드러냅니다.
- source_word: δυνάμεσίν σου
  english_pob_choice: your forces
  chosen_korean: 네 군세
  alternatives_korean:
  - 네 병력
  - 네 군대의 힘
  - 네 세력
  lexicon: BDAG
  rationale: δυνάμεις는 여기서 추상적 ‘힘’보다 군사적 역량/병력을 가리키므로, 한국어에서는 압축적이고 전투 맥락에 맞는 ‘군세’를 택했습니다.
- source_word: κατάβηθι πρὸς ἡμᾶς εἰς τὸ πεδίον
  english_pob_choice: come down to us in the plain
  chosen_korean: 내려와서 우리와 함께 평지에서
  alternatives_korean:
  - 내려와서 우리에게로 들판에서
  - 평지로 내려와 우리를 만나
  lexicon: BDAG
  rationale: πεδίον은 군사적 결투 장소로서의 ‘평지’가 가장 자연스럽고, κατάβηθι는 직접 명령의 공간 이동을 살려 ‘내려와서’로 옮겼습니다.
- source_word: συγκριθῶμεν ἑαυτοῖς
  english_pob_choice: let us meet there
  chosen_korean: 맞서 보십시오
  alternatives_korean:
  - 거기서 만나 봅시다
  - 서로 겨루어 봅시다
  - 거기서 대결합시다
  lexicon: LSJ
  rationale: 문맥상 단순한 ‘만남’이 아니라 직접적 대치/대결 요청이므로, 영어 POB의 완곡한 처리보다 원문이 내포하는 도전성을 드러내는 한국어로 옮겼습니다.
- source_word: δύναμις τῶν πόλεων
  english_pob_choice: the strength of the cities
  chosen_korean: 도시들의 힘
  alternatives_korean:
  - 도시들의 군세
  - 도시들의 세력
  - 성읍들의 힘
  lexicon: BDAG
  rationale: 원문의 단수 δύναμις를 그대로 살리면 ‘힘’이 가장 직접적이고, τῶν πόλεων은 복수 소유격이므로 ‘도시들의 힘’으로 압축했습니다.
theological_decisions:
- issue: 전투 도전문에서의 직접성
  chosen_reading: 원문의 συγκριθῶμεν ἑαυτοῖς는 단순한 상봉이 아니라 맞대결/대치의 초청으로 이해하여, 본문 긴장감을 살렸습니다.
  alternative_readings:
