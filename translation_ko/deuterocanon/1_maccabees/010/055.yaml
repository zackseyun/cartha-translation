  text: And King Ptolemy answered, saying, “A good day is this, on which you returned to the land of your fathers and sat on the throne of their kingdom.”
translation:
  language: ko
  text: 그리고 왕 프톨레마이오스가 대답하여 말했습니다. 「좋은 날입니다. 오늘은 당신이 조상들의 땅으로 돌아와 그들의 왕국의 왕좌에 앉은 날이기 때문입니다」.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 직역하면 ‘아버지들의 땅’이지만, 문맥상 혈통과 계승을 가리키는 역사적 관용구로 이해했습니다.
    reason: source_note
lexical_decisions:
- source_word: Πτολεμαῖος ὁ βασιλεὺς
  english_pob_choice: King Ptolemy
  chosen_korean: 왕 프톨레마이오스
  alternatives_korean:
  - 프톨레마이오스 왕
  - 프톨레마이오스 대왕
  lexicon: 고유명사
  rationale: 본문의 직함과 이름을 자연스럽게 살리되, 고유명사 앞에 직함을 두어 서술 흐름을 유지했습니다.
- source_word: Ἀγαθὴ ἡμέρα
  english_pob_choice: A good day is this
  chosen_korean: 좋은 날입니다
  alternatives_korean:
  - 이것은 좋은 날입니다
  - 좋은 날이군요
  lexicon: 형용사구
  rationale: 원문의 평가적 선언을 간결한 현대 한국어로 옮겼고, 영어 POB의 현재형 선언성을 무리 없이 반영했습니다.
- source_word: εἰς γῆν πατέρων σου
  english_pob_choice: to the land of your fathers
  chosen_korean: 조상들의 땅
  alternatives_korean:
  - 네 조상들의 땅
  - 네 아버지들의 땅
  lexicon: 관용적 역사 표현
  rationale: πατέρων을 단순히 ‘아버지들’로 직역하기보다, 문맥상 혈통·조상 계승을 드러내는 ‘조상들’로 옮겼습니다.
- source_word: θρόνου βασιλείας αὐτῶν
  english_pob_choice: the throne of their kingdom
  chosen_korean: 그들의 왕국의 왕좌
  alternatives_korean:
  - 그들의 나라의 왕좌
  - 그 왕국의 보좌
  lexicon: 왕권 표현
  rationale: θρόνος와 βασιλεία의 중첩을 살려 ‘왕국의 왕좌’로 직역성을 유지했습니다.
theological_decisions:
- issue: 인용문 안의 평서문과 시간 부사절의 관계
  chosen_reading: 「좋은 날입니다. 오늘은 … 날이기 때문입니다」로, 원문의 선언과 이유절을 분명히 드러냈습니다.
  alternative_readings:
  - 「이것은 좋은 날입니다」
  - 「좋은 날이군요」
  rationale: 원문은 단순한 인사말이 아니라 특정 사건의 가치를 평가하는 선언이므로, 서술적 평서문으로 유지하는 것이 본문의 힘을 보존합니다.
  doctrine_reference: source-directed translation principle
