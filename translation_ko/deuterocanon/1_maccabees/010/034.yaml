  naturalness: ‘세금 면제와 해제의 날’ is understandable but somewhat abrupt in modern Korean. ‘세금 면제와 부담 해제의 날’ makes the administrative sense of ἀφέσεως clear without specifying an obligation that the Greek does not name. The formal imperative is retained as befitting a royal decree in the target 합쇼체 register.
  terminology: ‘절기,’ ‘안식일,’ ‘초하루,’ and ‘정해진 날’ are appropriate standard Korean biblical and calendrical terms. ‘유다인’ is suitable in this historical context. ‘부담 해제’ appropriately avoids importing the theological sense of forgiveness into an administrative decree.
  issues:
  - severity: medium
    issue: Footnote anchor is attached to ‘정해진 날’ although its content explains ἀφέσεως.
    rationale: The note discusses the semantic range of ‘release,’ represented in Korean by ‘해제,’ not the designated/appointed days. Moving the marker is necessary for correct annotation.
  - severity: low
    issue: The beneficiary clause is separated into an explanatory sentence.
    rationale: ‘이는 … 해당합니다’ is not incorrect in meaning, but the Greek directly states that these are days of exemption and release for the Jews throughout the king’s realm. Keeping it in the decree sentence more closely preserves the syntax and emphasis.
  - severity: low
    issue: ‘해제’ alone can sound underspecified in Korean.
    rationale: Adding ‘부담’ clarifies the civic-administrative force while preserving the Greek term’s broadness and avoiding a theological rendering such as ‘죄 사함.’
  revised_text: 또한 모든 절기와 안식일과 초하루와 정해진 날, 그리고 절기 전 사흘과 절기 후 사흘은 내 온 왕국에 있는 모든 유다인을 위하여 모두 세금 면제와 부담 해제[a]의 날이 되게 하십시오.
