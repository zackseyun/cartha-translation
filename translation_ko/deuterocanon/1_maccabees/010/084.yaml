translation:
  language: ko
  text: 그리고 요나단은 아조토스와 그 주변의 도시들을 불태우고,[a] 그들의 전리품을 빼앗았으며, 다곤의 신전과 그 신전을 불로 태웠습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아조토스는 아스돗의 그리스어 형태입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 본문은 ἱερόν(신전)을 두 번 반복합니다. 직역하면 ‘다곤의 신전과 그 신전’입니다. 이 반복은 본문에 따라 유지했습니다.
    reason: textual_variant
