base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/084.yaml
  text: And Jonathan set Azotus and the cities around it on fire[a], and he took their spoil[b]; and he burned the temple of Dagon and its shrines with fire.
  footnotes:
  - marker: a
    text: Azotus is the Greek form of Ashdod.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek text repeats ''the temple'': literally, ''the temple of Dagon and its temple he burned with fire.'' The repetition has been retained rather than smoothed away.'
    reason: textual_variant
translation:
  language: ko
  text: 그리고 요나단은 아스돗과 그 주변의 도시들을 불태우고, 그들의 전리품을 빼앗았으며, 다곤의 신전과 그 신전도 불로 태웠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ἄζωτον은 아스돗의 그리스어 형태입니다.
    reason: lexical_alternative
  - marker: b
    text: 본문은 ἱερόν을 두 번 반복합니다. 직역하면 '다곤의 신전과 그 신전'이 되므로, 한국어에서는 자연성을 위해 반복을 약간 풀어 옮겼습니다.
    reason: textual_variant
