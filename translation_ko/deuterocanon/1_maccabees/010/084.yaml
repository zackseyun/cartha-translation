theological_decisions:
- issue: 반복된 ἱερόν의 처리
  chosen_reading: 본문의 반복을 완화하지 않고, 다곤의 신전이 완전히 파괴되었음을 강조하는 방향으로 유지했습니다.
  alternative_readings:
  - '''다곤의 신전과 그 성소도''로 의미를 풀어 매끄럽게 하는 방식'
  - 반복을 제거하고 단순히 '다곤의 신전도'로 압축하는 방식
  rationale: 영어 POB도 반복을 본문 근거로 보존하려 했으며, 이 반복은 단순한 중복이 아니라 제의 공간의 철저한 소각을 드러냅니다.
  doctrine_reference: 본문비평/서술 강조
- issue: 지명 표기와 헬라어형 보존
  chosen_reading: 본문 의미는 유지하되 독자 식별성을 위해 아스돗을 택했습니다.
  alternative_readings:
  - 아조토스처럼 헬라어형을 유지하는 방식
  - 애쉬도드로 음역하는 방식
  rationale: 1 Maccabees의 그리스어 본문은 Ἄζωτον을 쓰지만, 한국어 성경 전통에서는 아스돗이 곧바로 알아볼 수 있는 대응지명입니다.
  doctrine_reference: 지명 관행
