  yaml_path: translation/deuterocanon/1_maccabees/010/016.yaml
  text: And he said[b][a], “Will we find one man like this? And now let us make him our friend and ally.”
  footnotes:
  - marker: a
    text: Or, more explicitly, “Surely we will not find a man like this, will we?” The Greek uses a rhetorical question expecting the answer no.
    reason: lexical_alternative
  - marker: b
    text: “Friend” may carry an official political sense in Hellenistic court language, not merely personal affection.
    reason: cultural_note
translation:
  language: ko
  text: 그가 말했습니다. “우리가 이런 사람 하나라도 찾을 수 있겠습니까? 이제 그를 우리의 친구이자 동맹으로 삼읍시다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘찾을 수 있겠습니까?’는 μή + 미래 시제의 수사 의문을 옮긴 것입니다. 이 물음은 ‘그런 사람은 찾을 수 없을 것이다’라는 부정적 대답을 기대합니다.
    reason: alternative_reading
  - marker: b
    text: ‘친구’는 여기서 단순한 개인적 친분보다 헬레니즘 정치·궁정 언어에서의 공식적 관계를 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: Μὴ εὑρήσομεν
  english_pob_choice: Will we find
  chosen_korean: 우리가 … 찾아낼 수 있겠습니까?
  alternatives_korean:
  - 우리가 … 찾게 되겠습니까?
  - 우리가 … 찾을 수 있겠습니까?
  lexicon: LSJ
  rationale: μή + 미래 시제의 수사 의문문으로, 실제로는 부정적 대답을 기대합니다. 한국어에서는 반문을 자연스럽게 살리면서도 과도한 확대 해석을 피하기 위해 ‘찾아낼 수 있겠습니까?’로 옮겼습니다.
- source_word: ἄνδρα τοιοῦτον ἕνα
  english_pob_choice: one man like this
  chosen_korean: 이런 사람 하나
  alternatives_korean:
  - 이런 남자 하나
  - 이와 같은 사람 하나
  lexicon: LSJ
  rationale: ἄνδρα는 문자 그대로 남성 단수지만, 한국어에서는 문맥상 특정 인물을 가리키는 표현이므로 ‘사람’이 가장 자연스럽고, ἕνα의 ‘하나’로 유일성을 살렸습니다.
- source_word: ποιήσωμεν αὐτὸν φίλον καὶ σύμμαχον ἡμῶν
  english_pob_choice: let us make him our friend and ally
  chosen_korean: 그를 우리의 친구이자 동맹으로 삼읍시다
  alternatives_korean:
  - 그를 우리의 친구이자 동맹으로 만들읍시다
  - 그를 우리의 벗이자 동맹으로 삼읍시다
  lexicon: LSJ
  rationale: ποιήσωμεν은 문자적으로 ‘만들자’이지만, 정치적 관계를 수립하는 맥락이므로 ‘삼읍시다’가 한국어에서 가장 자연스럽게 공식적 지위를 부여하는 표현입니다. φίλον과 σύμμαχον은 서로 다른 짝이므로 각각 ‘친구’와 ‘동맹’으로 구분했습니다.
theological_decisions:
- issue: 헬레니즘 정치어휘 φίλον의 번역
  chosen_reading: ‘친구’로 유지하되, 정치적 관계를 뜻하는 공식 용례로 읽을 수 있게 했습니다.
  alternative_readings:
  - ‘벗’으로 완화
  - ‘신하/측근’처럼 정치적 의미를 앞세움
  rationale: 본문은 단순한 사교적 우정보다 왕실·정치적 맥락의 ‘friend’ 용례를 지닐 수 있지만, σύμμαχον과 함께 나오는 대칭 구조를 보존하려면 한국어 본문에서는 ‘친구’가 가장 직접적입니다.
  doctrine_reference: 헬레니즘 궁정 언어의 사회적·정치적 수사
