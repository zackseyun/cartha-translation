  yaml_path: translation/deuterocanon/1_maccabees/010/009.yaml
  text: And those from the citadel handed over the hostages to Jonathan[a], and he returned them to their parents.
  footnotes:
  - marker: a
    text: Greek ἄκρα refers to the fortified citadel, traditionally called the Acra.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 성채에서 온 이들이 성채[a]의 인질들을 요나단에게 넘겨주었으며, 그는 그들을 그들의 부모에게 돌려주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ἄκρα는 예루살렘의 요새화된 성채를 가리키며, 전통적으로 아크라라고 불립니다.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ ἐκ τῆς ἄκρας
  english_pob_choice: those from the citadel
  chosen_korean: 성채에 있던 이들
  alternatives_korean:
  - 성채에서 온 사람들
  - 아크라에 있던 사람들
  lexicon: LSJ
  rationale: ἄκρα는 예루살렘의 요새화된 성채를 가리키므로, 문맥을 살려 ‘성채’로 옮겼습니다. ‘있던 이들’은 원문의 집합적 표현을 자연스럽게 반영합니다.
- source_word: παρέδωκαν
  english_pob_choice: handed over
  chosen_korean: 넘겨주었으며
  alternatives_korean:
  - 인도하였으며
  - 건네주었으며
  lexicon: BDAG
  rationale: παρέδωκαν은 단순히 ‘주다’보다 ‘넘겨주다/인도하다’의 뉘앙스가 있어, 인질을 공식적으로 이전하는 장면에 맞게 옮겼습니다.
- source_word: τὰ ὅμηρα
  english_pob_choice: the hostages
  chosen_korean: 인질들
  alternatives_korean:
  - 볼모들
  - 담보물들
  lexicon: LSJ
  rationale: ὅμηρα는 사람으로서의 인질을 뜻하므로, 현대 한국어에서 가장 직접적이고 분명한 ‘인질들’을 선택했습니다.
- source_word: τοῖς γονεῦσιν αὐτῶν
  english_pob_choice: to their parents
  chosen_korean: 그들의 부모에게
  alternatives_korean:
  - 그들의 아버지와 어머니에게
  - 그들의 집안에
  lexicon: BDAG
  rationale: γονεῦσιν은 ‘부모’라는 뜻이므로, 범위를 넓히지 않고 그대로 옮겼습니다.
theological_decisions:
- issue: ἀπέδωκαν의 반환 동사 표현
  chosen_reading: ‘돌려보냈습니다’는 단순 반환이 아니라, 인질을 원래 속한 관계와 가정으로 회복시키는 뉘앙스를 살립니다.
  alternative_readings:
  - 돌려주었습니다
  - 되돌려보냈습니다
  rationale: 문맥상 인질의 석방과 가족에게의 회복이 함께 드러나므로, ‘돌려보냈습니다’가 가장 간결하면서도 관계 회복의 의미를 보존합니다.
  doctrine_reference: 본문 서술의 역사적 의미와 인질 해방의 회복성
