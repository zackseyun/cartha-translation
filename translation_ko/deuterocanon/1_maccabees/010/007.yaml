lexical_decisions:
- source_word: ἦλθεν
  english_pob_choice: came
  chosen_korean: 와서
  alternatives_korean:
  - 왔습니다
  - 도착했습니다
  lexicon: LSJ
  rationale: 서술 흐름을 자연스럽게 유지하면서도 ἔρχομαι의 단순 도착 동작을 그대로 살렸습니다.
- source_word: ἀνέγνω
