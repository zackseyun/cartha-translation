  rationale: εἰς τὰ ὦτα와 결합해 공적 전달 장면이 분명하므로, 한국어에서는 단순 ‘읽다’보다 ‘낭독하다’가 소리 내어 읽는 의미를 더 분명히 드러냅니다.
- source_word: τὰς ἐπιστολὰς
  english_pob_choice: the letters
  chosen_korean: 그 서한들을
  alternatives_korean:
  - 그 편지들을
  - 그 문서들을
  lexicon: LSJ
  rationale: 공적·공식 문맥의 기록물이라는 점을 살려 ‘서한’으로 옮겼습니다.
- source_word: τῶν ἐκ τῆς ἄκρας
  english_pob_choice: those in the citadel
  chosen_korean: 아크라에 있는 자들
  alternatives_korean:
  - 성채에 있는 자들
