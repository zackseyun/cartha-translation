  chosen_korean: 낭독했습니다
  alternatives_korean:
  - 읽었습니다
  - 공개로 읽었습니다
  lexicon: LSJ
  rationale: εἰς τὰ ὦτα와 결합해 공적 전달 장면이 분명하므로, 한국어에서는 단순 ‘읽다’보다 ‘낭독하다’가 소리 내어 읽는 의미를 더 분명히 드러냅니다.
- source_word: τὰς ἐπιστολὰς
  english_pob_choice: the letters
  chosen_korean: 그 서한들을
  alternatives_korean:
  - 그 편지들을
  - 그 문서들을
  lexicon: LSJ
  rationale: 공적·공식 문맥의 기록물이라는 점을 살려 ‘서한’으로 옮겼습니다.
- source_word: τῶν ἐκ τῆς ἄκρας
  english_pob_choice: those in the citadel
  chosen_korean: 아크라에 있는 자들
  alternatives_korean:
  - 성채에 있는 자들
  - 아크라 사람들
  lexicon: LSJ
  rationale: ἄκρα는 일반적으로 ‘성채’이지만 1마카베오기에서는 예루살렘의 특정한 요새 아크라를 가리키므로, 본문에는 지명성을 살리고 각주에서 설명할 수 있게 했습니다.
theological_decisions:
- issue: ἀνέγνω와 εἰς τὰ ὦτα의 공적 낭독성
  chosen_reading: 사적인 읽기가 아니라 공동체 앞에서 들리도록 낭독한 장면으로 이해해 한국어 동사를 ‘낭독했습니다’로 선택했습니다.
  alternative_readings:
  - 읽었습니다
  - 공개로 읽었습니다
  rationale: 본문은 ‘모든 백성’과 ‘아크라에 있는 자들’이 청취 대상임을 분명히 하므로, 공적 선포의 성격을 약화하지 않는 번역이 필요합니다.
  doctrine_reference: 본문 서술의 문맥적 의미 보존
