translation:
  language: ko
  text: 그는 괴로워하며 말했습니다. 「우리가 무슨 일을 한 것입니까? 알렉산드로스가 유대인들과 우호 관계를 맺어 버팀목으로 삼는 일에서 우리보다 앞서갔습니다[a].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “유대인들과의 우정을 지지 기반으로 얻는 일에서.” 여기서 ‘우호 관계’는 정치적·외교적 친선을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλυπήθη
  english_pob_choice: He was grieved
  chosen_korean: 근심하여
  alternatives_korean:
  - 슬퍼하여
  - 괴로워하여
  - 마음이 상하여
  lexicon: BDAG
  rationale: λύπη의 정서적 고통을 한국어로는 ‘근심하다’가 비교적 자연스럽고, 단순한 기분 나쁨보다 더 무게 있게 담아냅니다.
- source_word: Τί τοῦτο ἐποιήσαμεν
  english_pob_choice: What is this that we have done
  chosen_korean: 우리가 무엇을 한 것입니까?
  alternatives_korean:
  - 우리가 무엇을 했습니까?
  - 왜 우리가 이런 일을 했습니까?
  lexicon: BDAG
  rationale: 수사적 자책의 구조를 살리되, 현대 한국어로는 ‘무엇을 한 것입니까?’가 가장 자연스럽게 원문의 반문을 전달합니다.
- source_word: προέφθακεν ἡμᾶς
  english_pob_choice: has gotten ahead of us
  chosen_korean: 우리보다 먼저
  alternatives_korean:
  - 우리를 앞질러
  - 우리보다 앞서
  - 우리보다 먼저 가서
  lexicon: BDAG
  rationale: ‘앞지르다’보다 여기서는 정치적 선점의 의미를 담은 ‘우리보다 먼저’가 더 간결하고 문맥상 적절합니다.
- source_word: φιλίαν ... τοῖς Ἰουδαίοις ... εἰς στήριγμα
  english_pob_choice: friendship with the Jews for support
  chosen_korean: 유대인들과의 우정을 지켜 지원을 얻으려
  alternatives_korean:
  - 유대인들과 우호 관계를 맺어 버팀목으로 삼으려
  - 유대인들과의 친교를 얻어 지지 기반으로 삼으려
  lexicon: LSJ
  rationale: φιλίαν은 기본적으로 ‘우정’이지만 외교 문맥상 우호 관계를 뜻하며, εἰς στήριγμα은 ‘지원/지지 기반’의 목적을 나타내므로 이를 자연스럽게 풀어 옮겼습니다.
theological_decisions:
- issue: 유대인들과의 관계를 외교적 의미로 어떻게 드러낼지
  chosen_reading: ‘우정’과 ‘지원’으로 옮겨, 단순한 감정적 친분이 아니라 정치적 우호와 후원을 암시하게 했습니다.
  alternative_readings:
  - ‘동맹’으로 직역
  - ‘친선’으로 일반화
  rationale: φιλίαν과 εἰς στήριγμα의 결합은 외교적 선점과 후원 확보를 가리키므로, 한국어에서도 그 정치성을 흐리지 않는 표현이 필요합니다.
  doctrine_reference: 문맥상 역사 서술이며 교리 쟁점은 없습니다.
