  - 큰 영예로
  - 큰 영광으로
  lexicon: LSJ
  rationale: δόξα는 여기서 도시가 베푸는 공개적 환대의 장엄함을 가리키므로, '영광'을 살리되 인간에게 돌려지는 명예의 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 도시의 환대 표현인 δόξα의 번역
  chosen_reading: 하나님께 돌리는 '영광'과 구별되지만, 본문 자체의 장엄하고 명예로운 استقبال을 살려 '큰 영광'으로 옮겼습니다.
  alternative_readings:
  - 큰 존경
  - 큰 영예
  - 큰 위엄
  rationale: 문맥은 요나단을 맞이하는 도시의 공개적 환대를 묘사하므로, 신학적 용례의 '영광'으로 오해되지 않도록 하면서도 원문의 장중함을 보존하는 표현이 적절합니다.
  doctrine_reference: 공적 환대와 honor-shame 의미장
