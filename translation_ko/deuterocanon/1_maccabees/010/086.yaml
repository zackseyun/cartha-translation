  lexicon: LSJ
  rationale: 이 동사는 단순히 머무는 것이 아니라 군사적으로 진을 두는 뉘앙스가 있어, 한국어에서는 '진을 치다'가 가장 직접적입니다.
- source_word: Ἀσκάλωνα
  english_pob_choice: Ashkelon
