translation:
  language: ko
  text: 그리고 요나단은 그곳을 떠나 아스칼론에 진을 쳤습니다. 그러자 그 도시 사람들은 큰 영광으로 그를 맞으러 나왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '큰 장엄함으로', '큰 영광으로'; 헬라어 표현은 도시가 요나단을 맞이한 장중함을 강조합니다.
    reason: lexical_alternative
