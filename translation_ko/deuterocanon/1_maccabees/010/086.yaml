  rationale: 문맥은 요나단을 맞이하는 도시의 공개적 환대를 묘사하므로, 신학적 용례의 '영광'으로 오해되지 않도록 하면서도 원문의 장중함을 보존하는 표현이 적절합니다.
  doctrine_reference: 공적 환대와 honor-shame 의미장
