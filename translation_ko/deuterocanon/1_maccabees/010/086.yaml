revisions:
- from: 그리고 요나단은 그곳을 떠나 아스칼론에 진을 쳤습니다. 그러자 그 도시 사람들은 큰 영광으로 그를 맞으러 나왔습니다.[a]
  to: 요나단은 그곳을 떠나 아스글론에 진을 쳤습니다. 그 도시의 사람들은 큰 영예를 갖추어 그를 맞으러 나왔습니다.[a]
  rationale: 군사적 이동을 나타내는 '진을 쳤습니다'는 유지했습니다. 환대의 방식은 원문의 δόξα가 지닌 영예·장엄함의 의미를 보존하면서 자연스러운 현대 한국어로 '큰 영예를 갖추어'라고 옮겼습니다. 지명은 한국어 성서의 통용 표기인 '아스글론'으로 조정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:46:12Z'
