  source_fidelity: 본문의 이동과 진을 치는 행위, 그리고 아스칼론 주민들이 요나단을 맞으러 나온 사실은 충실히 옮겼습니다. 다만 ἐν δόξῃ μεγάλῃ는 여기서 요나단에게 돌린 공적인 예우와 장엄한 환대를 가리키므로, '큰 영광으로'보다 이를 자연스럽게 드러내는 표현이 적절합니다.
  naturalness: '''큰 영광으로 그를 맞으러 나왔습니다''는 문법적으로 가능하지만 현대 한국어에서는 다소 직역투이며, 무엇으로 영광을 받았는지가 불분명합니다. ''큰 영예를 갖추어''는 공적·의례적 환대라는 문맥을 자연스럽게 전달합니다.'
  terminology: Ἀσκάλων은 한국어 성서 전통에서 널리 쓰이는 '아스글론'으로 통일하는 것이 적절합니다. δόξα는 신적 영광이라는 뜻으로 한정하지 않고, 본문 문맥에 맞게 인간에게 베푸는 큰 예우로 번역했습니다.
