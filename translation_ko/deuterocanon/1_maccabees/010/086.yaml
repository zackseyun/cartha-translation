  rationale: 지명은 표준 음역을 따랐고, 한국어 성서 번역에서 통용 가능한 형태로 옮겼습니다.
- source_word: ἐν δόξῃ μεγάλῃ
  english_pob_choice: with great honor
  chosen_korean: 큰 영광으로
  alternatives_korean:
