  yaml_path: translation/deuterocanon/1_maccabees/010/086.yaml
  text: And Jonathan departed from there and encamped at Ashkelon[a], and the people of the city came out to meet him with great honor.
  footnotes:
  - marker: a
    text: Or 'with great splendor' or 'with great glory'; the Greek expression emphasizes the magnificence of the city's reception of Jonathan.
    reason: lexical_alternative
translation:
  language: ko
  text: 요나단은 그곳을 떠나 아스글론에 진을 쳤습니다. 그 도시의 사람들은 큰 영예를 갖추어 그를 맞으러 나왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '큰 장엄함으로', '큰 영광으로'. 그리스어 표현은 도시 사람들이 요나단을 맞이하며 베푼 성대한 예우를 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆρεν
  english_pob_choice: departed
  chosen_korean: 떠나
  alternatives_korean:
  - 출발하여
  - 떠났습니다
  - 길을 떠나
