  source_fidelity: 첫 절의 '당신이 쓴 대로'는 ἃ ἔγραψας(당신이 쓴 것)를 '…대로'라는 방식 표현으로 바꾸어 의미가 달라질 수 있습니다. 또한 마지막 '당신이 말한 대로입니다'는 καθὼς εἴρηκας가 혼인 관계 설정 동사를 수식하는 구조를 충분히 반영하지 못합니다. 이를 문장 안에서 바로 연결해 수정했습니다. ἀπάντησον εἰς Πτολεμαΐδα는 이동과 만남을 함께 나타내도록 옮겼고, ὅπως ἴδωμεν ἀλλήλους의 목적도 보존했습니다.
  naturalness: 수정문은 현대 표준어 합쇼체로 자연스럽고, 접속 관계를 원문의 순서와 뜻에 맞게 드러냅니다. '서로 얼굴을 보도록'은 직역적 '서로 보도록'보다 자연스러우면서 대면한다는 뜻을 유지합니다.
  terminology: 프톨레마이스는 통용 음역을 유지했습니다. ἐπιγαμβρεύσω는 구체적인 혼인 상대를 본문에 보태지 않고 '혼인으로 친족 관계를 맺겠습니다'로 옮겨 혼인을 통한 친족 관계라는 어휘 의미를 보존했습니다. 각주 표지는 해당 표현 바로 뒤에 두었습니다.
