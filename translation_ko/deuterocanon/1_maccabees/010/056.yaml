  text: And now I will do for you what you wrote; but meet me at Ptolemais[a], so that we may see one another, and I will become related by marriage to you, just as you said.
  footnotes:
  - marker: a
    text: Or, 'I will make a marriage alliance with you.' The Greek verb refers to establishing a relationship by marriage; the broader narrative clarifies that a dynastic marriage is in view.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 나는 당신이 쓴 대로 당신을 위해 하겠습니다. 그러나 서로 만나 보기 위해 프톨레마이스로 오십시오. 그러면 당신에게 혼인 관계를 맺겠습니다. 당신이 말한 대로입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, '당신과 혼인 동맹을 맺겠습니다.' 그리스어 동사는 혼인으로 관계를 형성한다는 뜻이며, 더 넓은 이야기 맥락은 왕조적 혼인을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσω σοι ἃ ἔγραψας
  english_pob_choice: I will do for you what you wrote
  chosen_korean: 당신이 쓴 대로 당신을 위해 하겠습니다
  alternatives_korean:
  - 당신이 적은 것을 하겠습니다
  - 당신이 적어 보낸 것을 이행하겠습니다
  lexicon: LSJ
  rationale: ποιέω는 여기서 요청을 실행하겠다는 뜻으로 넓게 쓰였으므로, '하겠습니다'로 자연스럽게 살리되 ἃ ἔγραψας의 직접성을 유지했습니다.
- source_word: ἀπάντησον εἰς Πτολεμαΐδα
  english_pob_choice: meet me at Ptolemais
  chosen_korean: 프톨레마이스로 오십시오
  alternatives_korean:
  - 프톨레마이스에서 만나십시오
  - 프톨레마이스로 와서 저를 만나십시오
  lexicon: LSJ
  rationale: ἐἰς는 도착 방향을 나타내지만, 만남의 장소를 한국어로는 '...로 오십시오'가 가장 간결하고 자연스럽습니다.
- source_word: ὅπως ἰδωμεν ἀλλήλους
  english_pob_choice: so that we may see one another
  chosen_korean: 서로 만나 보기 위해
  alternatives_korean:
  - 서로 보기 위해
  - 우리가 서로 보게 하려고
  lexicon: LSJ
  rationale: 직역하면 '서로를 보게 하려고'이지만, 문맥상 실제 대면을 뜻하므로 '만나 보기 위해'로 옮겨 한국어 자연성과 원문의 '보다' 이미지를 함께 살렸습니다.
- source_word: ἐπιγαμβρεύσω
  english_pob_choice: I will become related by marriage to you
  chosen_korean: 혼인 관계를 맺겠습니다
  alternatives_korean:
  - 사돈 관계를 맺겠습니다
  - 혼인으로 친족 관계를 맺겠습니다
  lexicon: LSJ
  rationale: 동사는 단순한 우정을 넘어 혼인으로 친족 관계를 형성한다는 뜻이므로, POB의 풀이를 반영해 과도한 구체화 없이 '혼인 관계를 맺다'로 옮겼습니다.
theological_decisions:
- issue: ἐπιγαμβρεύσω의 혼인 동맹 의미를 어떻게 드러낼지
  chosen_reading: 본문은 인물 간의 사적인 약속이 아니라 왕조적 혼인 동맹을 예고하는 표현으로 이해했습니다.
  alternative_readings:
  - 단순한 친교 약속으로 읽기
  - 구체적 혼인 상대를 본문 밖으로 보류하기
  rationale: 영어 POB 주석이 이 동사가 혼인을 통한 관계 설정을 뜻하며 더 넓은 서술이 왕조적 혼인을 가리킨다고 밝히므로, 본문에는 그 넓은 의미를 유지하되 주석 없이도 오해가 적게 했습니다.
  doctrine_reference: 역사서 문맥 해석, 혼인 동맹의 서술 기능
