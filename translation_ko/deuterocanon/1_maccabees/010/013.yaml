lexical_decisions:
- source_word: ἕκαστος
  english_pob_choice: each one
  chosen_korean: 각자
  alternatives_korean:
  - 각 사람은
  - 모두
  lexicon: BDAG
  rationale: 개별성을 강조하는 표현이므로, 한국어에서는 자연스럽고 간결한 ‘각자’로 옮겨 각 사람이 따로 행동했음을 살렸습니다.
- source_word: κατέλιπεν τὸν τόπον αὐτοῦ
  english_pob_choice: left his place
  chosen_korean: 자기 자리를 떠나
  alternatives_korean:
  - 자기 자리를 버리고
  - 자기 처소를 떠나
  lexicon: BDAG
  rationale: τόπος는 여기서 단순한 ‘장소’의 의미가 가장 자연스러워 ‘자리’로 옮겼고, ‘떠나’로 동작의 방향을 분명히 했습니다.
- source_word: εἰς τὴν γῆν αὐτοῦ
  english_pob_choice: to his own land
  chosen_korean: 자기 땅으로
  alternatives_korean:
  - 자기 땅으로 돌아가
  - 자기 나라로
  lexicon: BDAG
  rationale: γῆ는 여기서 각자의 거주·귀속 지역을 가리키므로, 민족국가적 뉘앙스가 강한 ‘나라’보다 직접적인 ‘땅’이 원문에 가깝습니다.
- source_word: ἀπῆλθεν
  english_pob_choice: went away
  chosen_korean: 돌아갔습니다
  alternatives_korean:
  - 갔습니다
  - 떠났습니다
  lexicon: BDAG
  rationale: 문맥상 이전 자리에서 자기 땅으로 향하는 이동이므로, 한국어에서는 자연스럽게 ‘돌아갔습니다’로 풀어 연속 동작을 매끄럽게 했습니다.
