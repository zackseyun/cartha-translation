  text: And King Alexander heard the promises that Demetrius had sent to Jonathan, and they told him about the wars and the brave deeds that he and his brothers had done, and the hardships they had endured.
translation:
  language: ko
  text: 그리고 알렉산드로스 왕은 데메트리오스가 요나단에게 보낸 약속들을 들었으며, 사람들은 그에게 그와 그의 형제들이 치른 전쟁들과 그들이 보여 준 용맹한 일들, 그리고 그들이 겪은 고난들을 이야기했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπαγγελίας
  english_pob_choice: promises
  chosen_korean: 약속들
  alternatives_korean:
  - 공약들
  - 언약들
  lexicon: BDAG
  rationale: 정치적 맥락에서 데메트리오스가 요나단에게 보낸 확약을 가리키므로, 의미를 직접 살리되 자연스러운 한국어인 ‘약속들’로 옮겼습니다.
- source_word: διηγήσαντο
  english_pob_choice: they told
  chosen_korean: 이야기했습니다
  alternatives_korean:
  - 전했습니다
  - 자세히 말했습니다
  - 보고했습니다
  lexicon: BDAG
  rationale: 단순 전달보다 내용을 풀어 말하는 뉘앙스를 살려, 현대 한국어에서 무난한 ‘이야기했습니다’를 택했습니다.
- source_word: ἀνδραγαθίας
  english_pob_choice: brave deeds
  chosen_korean: 용맹한 일들
  alternatives_korean:
  - 용감한 행위들
  - 무용한 공적들
  - 영웅적 행위들
  lexicon: LSJ
  rationale: 칭찬의 뉘앙스는 유지하되 과도하게 문어적이거나 영웅담화하지 않도록 ‘용맹한 일들’로 옮겼습니다.
- source_word: κόπους
  english_pob_choice: hardships
  chosen_korean: 고난들
  alternatives_korean:
  - 수고들
  - 애씀들
  - 고생들
  lexicon: BDAG
  rationale: 전투와 관련해 단순한 노동보다 겪은 어려움과 고통을 가리키므로, 더 넓은 의미를 담는 ‘고난들’이 적절합니다.
theological_decisions:
- issue: 왕에게 보고되는 내용의 시점과 수동적 전달 주체
  chosen_reading: ‘사람들은 그에게 … 이야기했습니다’로 처리하여, 원문의 수동적 보고 상황을 자연스러운 한국어로 드러냈습니다.
  alternative_readings:
  - ‘그들이 그에게 … 말했습니다’
  - ‘그에게 …가 보고되었습니다’
  rationale: 원문은 왕이 들은 소문과 보고를 연속적으로 제시하므로, 주체를 특정하지 않은 한국어로 옮겨 사건의 흐름을 보존했습니다.
  doctrine_reference: 서사 문맥 보존
