revisions:
- from: 그리고 알렉산드로스 왕은 데메트리오스가 요나단에게 보낸 약속들을 들었으며, 사람들은 그에게 그와 그의 형제들이 치른 전쟁들과 그들이 보여 준 용맹한 일들, 그리고 그들이 겪은 고난들을 이야기했습니다.
  to: 알렉산드로스 왕은 데메트리오스가 요나단에게 보낸 약속들을 들었습니다. 그리고 그들은 그에게 요나단과 그의 형제들이 치른 전쟁들과 그들이 행한 용맹한 행위들, 그리고 그들이 겪은 고난을 이야기했습니다.
  rationale: 원문에 이름이 제시되지 않은 보고자들은 ‘그들은’으로 유지하여 불특정 복수 주어를 보존했습니다. 또한 용맹한 행위의 주체가 요나단과 그의 형제들임을 명확히 하고, 한국어에서 자연스러운 집합명사 ‘고난’을 사용했습니다. 문장 분리는 원문의 연속된 사건을 훼손하지 않으면서 현대 한국어의 가독성을 높입니다.
