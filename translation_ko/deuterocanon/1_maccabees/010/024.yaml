theological_decisions:
- issue: ὕψους의 의미 범위
  chosen_reading: ‘존귀’로 옮겨 단순한 물리적 ‘높음’보다 사회적 존중과 품위를 드러냈습니다.
  alternative_readings:
  - ‘높임’
  - ‘승격’
  - ‘고귀함’
  rationale: 본문은 편지의 수사적 내용 목록을 말하므로, 문자적 ‘높이’보다 예우와 지위를 암시하는 표현이 문맥을 더 잘 반영합니다.
  doctrine_reference: 문맥 기반 의미 결정
- issue: λόγους παρακλήσεως καὶ ὕψους καὶ δομάτων의 병렬성
  chosen_reading: 세 요소를 각각 나누어 ‘격려와 존귀와 선물’을 병렬로 유지했습니다.
  alternative_readings:
  - ‘격려와 영예와 선물’
  - ‘권면과 높임과 예물’
  rationale: 그리스어의 나열 구조를 보존해 정치적 호의의 정도를 그대로 드러내는 것이 본문의 힘을 살립니다.
  doctrine_reference: 원문 수사 구조 보존
