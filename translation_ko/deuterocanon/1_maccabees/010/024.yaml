  terminology: ὕψους는 문맥상 ‘영예’로 옮기는 편이 ‘존귀’보다 자연스럽고, 각주로 ‘높임/승격’ 가능성을 남기는 것이 적절합니다. παρακλήσεως는 ‘격려’, δομάτων은 ‘선물’로 유지할 수 있습니다.
