translation:
  language: ko
  text: 그리고 그들은 왕이 자기들에게 군대를 모을 권한을 주었다는 소식을 듣고 크게 두려워하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “그들은 큰 두려움을 두려워하였”입니다. 그리스어의 중복 강조 표현을 자연스럽게 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφοβήθησαν φόβον μέγαν
  english_pob_choice: they were greatly afraid
  chosen_korean: 크게 두려워하였습니다
  alternatives_korean:
  - 큰 두려움에 사로잡혔습니다
  - 두려움을 크게 느꼈습니다
  - 두려워하였습니다
  lexicon: BDAG
  rationale: 그리스어의 ‘두려워하다’와 ‘큰 두려움’의 중복 강조를 한국어에서는 자연스럽게 압축하되, 강한 공포의 세기를 유지했습니다.
- source_word: ὅτε ἤκουσαν
  english_pob_choice: when they heard
  chosen_korean: 들은
  alternatives_korean:
  - 들었을 때
  - 듣자
  lexicon: BDAG
  rationale: 서술 흐름을 해치지 않는 시점 부사절로 옮겨, 보고받은 내용에 반응한 순서를 분명히 했습니다.
- source_word: ἐξουσίαν συναγαγεῖν δυνάμεις
  english_pob_choice: authority to gather forces
  chosen_korean: 군대를 모을 권한
  alternatives_korean:
  - 병력을 모을 권한
  - 군사력을 모을 권한
  - 군대를 소집할 권한
  lexicon: BDAG
  rationale: ἐξουσία는 단순한 능력이 아니라 공식적으로 허락된 권한이므로 ‘권한’으로, δυνάμεις는 이 문맥에서 군사력/병력을 가리키므로 ‘군대’로 옮겼습니다.
- source_word: ὁ βασιλεὺς
  english_pob_choice: the king
  chosen_korean: 왕
  alternatives_korean:
  - 그 왕
  - 임금
  lexicon: BDAG
  rationale: 역사 서술의 통상적 칭호를 따라 ‘왕’으로 간결하게 옮겼습니다.
