  text: And he gave him authority to gather forces[a], and to make weapons, and for him to be his ally, and he said that the hostages in the citadel should be handed over to him.
  footnotes:
  - marker: a
    text: Or 'the Acra,' the fortified citadel in Jerusalem.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 그에게 군대를 모으고 무기를 만들며 자기의 동맹자가 되게 할 권한을 주었고, 또 아크라에 있는 인질들을 그에게 넘겨 주라고 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘아크라’는 예루살렘의 요새를 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἔδωκεν αὐτῷ ἐξουσίαν
  english_pob_choice: gave him authority
  chosen_korean: 그에게 ... 권한을 주었고
  alternatives_korean:
  - 그에게 ... 권위를 주었고
  - 그에게 ... 허락을 주었고
  lexicon: BDAG
  rationale: ἐξουσία는 단순한 허용보다 위임된 공식 권한을 가리키므로, 정치·군사 문맥에 맞게 ‘권한’을 택했습니다.
- source_word: συναγαγεῖν δυνάμεις
  english_pob_choice: to gather forces
  chosen_korean: 군대를 모으고
  alternatives_korean:
  - 병력을 모으고
  - 군세를 모으고
  lexicon: LSJ
  rationale: δυνάμεις는 여기서 추상적 ‘능력’이 아니라 군사력/병력을 뜻하므로, 자연스러운 현대 한국어로 ‘군대를 모으고’로 옮겼습니다.
- source_word: κατασκευάζειν ὅπλα
  english_pob_choice: to make weapons
  chosen_korean: 무기를 만들며
  alternatives_korean:
  - 무기를 준비하며
  - 무장을 갖추며
  lexicon: LSJ
  rationale: ὅπλα는 무기이며, κατασκευάζειν은 제작·준비를 포함하지만 문맥상 생산/조달의 뉘앙스가 있어 ‘무기를 만들며’가 가장 직접적입니다.
- source_word: τὰ ὅμηρα τὰ ἐν τῇ ἄκρᾳ
  english_pob_choice: the hostages in the citadel
  chosen_korean: 아크라에 있는 인질들을
  alternatives_korean:
  - 성채에 있는 인질들을
  - 아크라(성채)에 있는 인질들을
  lexicon: LSJ
  rationale: ὅμηρα는 ‘인질들’이 표준적이고, ἄκρα는 일반명사 ‘성채/요새’이면서 1마카비에서는 예루살렘의 아크라를 가리킬 수 있어 본문에는 음역을 살렸습니다.
theological_decisions:
- issue: 예루살렘 ἄκρα의 처리
  chosen_reading: 본문에는 ‘아크라’를 유지하되, 일반 명사적 의미를 배경으로 한 지명 가능성을 열어 둡니다.
  alternative_readings:
  - 성채
  - 요새
  rationale: 1마카비 문맥에서 ἄκρα는 예루살렘의 특정 요새(아크라)를 가리킬 수 있으므로, 독자가 역사적 지시를 놓치지 않도록 음역을 유지했습니다.
  doctrine_reference: 문맥-역사적 지시어 처리 원칙
