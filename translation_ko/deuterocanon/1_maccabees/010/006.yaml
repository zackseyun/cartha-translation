  terminology: ‘권한’, ‘군대를 모으고’, ‘무기를 만들고’, ‘인질들’은 정치·군사 문맥과 원문의 의미에 적절합니다. ‘아크라’는 문맥상 특정 예루살렘 성채를 가리키는 명칭으로 보존할 수 있으며, 각주에서 성채라는 뜻을 밝혀 주는 것이 좋습니다.
