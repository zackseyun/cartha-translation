  source_fidelity: ‘자기의 동맹자가 되게’는 누가 누구의 동맹자가 되는지 한국어에서 불분명할 수 있습니다. εἶναι αὐτῷ σύμμαχον αὐτόν은 수령자인 그가 수여자인 그의 동맹자가 되는 뜻이므로 그 관계를 명확히 해야 합니다. 또한 ἄκρα에 관한 각주는 해당 낱말에 직접 붙이는 것이 적절합니다.
