  yaml_path: translation/deuterocanon/1_maccabees/010/089.yaml
  text: And he sent him a gold clasp[a], as is the custom to give to the king’s kinsmen; and he gave him Accaron and all its territory as an inheritance.
  footnotes:
  - marker: a
    text: Accaron is the Greek form of the place-name more commonly known from Hebrew as Ekron.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 왕들의 친족들에게 주는 관례대로 그에게 금 걸쇠[a]를 보냈습니다. 또 그에게 아카론과 그 모든 영토를 상속 재산으로 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아카론은 히브리어로 더 널리 알려진 에그론(Ekron)에 해당하는 그리스어 지명입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πόρπην χρυσῆν
  english_pob_choice: a gold clasp
  chosen_korean: 금 장식핀
  alternatives_korean:
  - 금 걸쇠
  - 금 브로치
  - 금 장신구
  lexicon: LSJ
  rationale: πόρπη는 옷을 여미는 장식용 걸쇠·핀을 가리킬 수 있어, 현대 한국어로는 기능과 장식성을 함께 살리는 ‘장식핀’이 가장 자연스럽습니다.
- source_word: ὡς ἔθος ἐστὶν διδόσθαι
  english_pob_choice: as is the custom to give
  chosen_korean: 주는 관례대로
  alternatives_korean:
  - 주는 것이 관습이듯
  - 주는 것이 통례대로
  - 주는 관습대로
  lexicon: LSJ
  rationale: 왕실에서의 통상적 증여 관행을 나타내므로, 장황한 설명 없이 ‘관례대로’로 간결하게 옮겼습니다.
- source_word: τῶν βασιλέων
  english_pob_choice: the king’s kinsmen
  chosen_korean: 왕의 친족들
  alternatives_korean:
  - 왕족들
  - 왕의 родствен들
  - 왕실 친척들
  lexicon: LSJ
  rationale: sυγγενεῦσιν은 혈연 친척을 뜻하므로, 한국어에서 가장 सीधे하고 중립적인 ‘친족들’이 적절합니다.
- source_word: Ἀκκαρὼν
  english_pob_choice: Accaron
  chosen_korean: 아카론
  alternatives_korean:
  - 아스글론
  - 에그론
  lexicon: transliteration
  rationale: 원문 그리스어 지명을 그대로 음역해, 본문에서는 그리스어 형태를 반영한 ‘아카론’을 사용했습니다.
theological_decisions:
- issue: τὰ ὅρια αὐτῆς의 범위 표현
  chosen_reading: ‘그 모든 영토’로 옮겨, 경계선 자체보다 그 안에 포함된 지배 구역 전체를 자연스럽게 드러냈습니다.
  alternative_readings:
  - 그 모든 경계
  - 그 모든 경계선
  rationale: 문맥상 단순한 선형 경계가 아니라 아카론에 속한 구역 전체의 양도를 말하므로, 한국어에서는 ‘영토’가 더 정확합니다.
  doctrine_reference: 문맥적 역사 서술
