  text: 그리고 두 왕이 전투를 벌였으며, 데메트리오스의 진영은 도망쳤습니다. 알렉산드로스가 그를 추격하여 그들 위에 우세를 얻었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
