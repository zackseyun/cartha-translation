  yaml_path: translation/deuterocanon/1_maccabees/010/049.yaml
  text: And the two kings joined battle[a], and Demetrius's camp fled, and Alexander pursued him and prevailed over them.
  footnotes:
  - marker: a
    text: 'Greek: ''Demetrius''s camp fled ... Alexander pursued him and prevailed over them.'' The shift from singular (''him'') to plural (''them'') likely reflects pursuit of Demetrius as commander and victory over his forces.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 두 왕이 전투를 벌였습니다. 데메트리오스의 진영이 달아났고, 알렉산드로스는 그를 추격하여 그들에게 우세를 점했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 단수 ‘그를’과 복수 ‘그들에게’를 함께 사용합니다. 이는 알렉산드로스가 데메트리오스를 지휘관으로서 추격하고, 그의 군대에 대해서는 우세를 점했음을 시사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆψαν πόλεμον
  english_pob_choice: joined battle
  chosen_korean: 전투를 벌였으며
  alternatives_korean:
  - 싸웠으며
  - 전투에 들어갔으며
  - 전쟁을 시작했으며
  lexicon: LSJ
  rationale: ‘붙잡아 결합하다’는 직역보다 전투 개시의 관용적 의미를 살려, 현대 한국어에서 자연스럽고 군사적 뉘앙스를 유지하는 표현을 택했습니다.
- source_word: ἡ παρεμβολὴ Δημητρίου
  english_pob_choice: Demetrius's camp
  chosen_korean: 데메트리오스의 진영
  alternatives_korean:
  - 데메트리오스의 캠프
  - 데메트리오스의 군대
  - 데메트리오스의 야영지
  lexicon: LSJ
  rationale: παρεμβολή는 여기서 단순한 장소보다 군사 집단을 가리키는 메톤미로 보이므로, ‘진영’이 문맥상 가장 정확합니다.
- source_word: ἔφυγεν
  english_pob_choice: fled
  chosen_korean: 도망쳤습니다
  alternatives_korean:
  - 달아났습니다
  - 패주했습니다
  - 물러났습니다
  lexicon: LSJ
  rationale: 단순한 후퇴보다 패전 상황의 도주를 드러내는 기본 의미를 살렸습니다.
- source_word: ἴσχυσεν ἐπʼ αὐτούς
  english_pob_choice: prevailed over them
  chosen_korean: 그들 위에 우세를 얻었습니다
  alternatives_korean:
  - 그들을 압도했습니다
  - 그들을 이겼습니다
  - 그들보다 강했습니다
  lexicon: LSJ
  rationale: 직접적인 ‘완전 패배’로 좁히지 않고, 원문의 우세·우승 의미를 보존하면서 한국어에서도 자연스럽게 읽히도록 했습니다.
theological_decisions:
- issue: 대명사 불일치(그를 / 그들)
  chosen_reading: ‘그를 추격하여 그들 위에 우세를 얻었습니다’로 옮겨, 알렉산드로스가 데메트리오스를 추격하되 최종적으로는 그의 군세 전체를 상대로 우세를 거둔 뉘앙스를 반영했습니다.
  alternative_readings:
  - 그를 추격하여 그를 이겼습니다
  - 그들을 추격하여 그들 위에 우세를 얻었습니다
  rationale: 영어 POB의 각주가 지적하듯 단수와 복수의 전환은 지휘관 데메트리오스와 그의 군대를 함께 가리키는 전투 서술로 읽는 것이 가장 자연스럽습니다.
  doctrine_reference: 서사 문맥 해석
