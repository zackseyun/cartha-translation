translation:
  language: ko
  text: 예루살렘은 거룩하고 면제된[a] 곳이 되게 하십시오. 그 경계 지역[b]과 십일조와 세금[c]도 면제하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문맥상 ‘면제된’ 또는 ‘해제된’을 뜻합니다. 다른 문맥에서는 ‘봉헌된’, ‘헌정된’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘경계’, ‘경계선들’. 그리스어는 경계선 자체 또는 예루살렘에 딸린 지역을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘통행세’, ‘관세’, ‘부과금’으로도 옮길 수 있습니다.
    reason: lexical_alternative
