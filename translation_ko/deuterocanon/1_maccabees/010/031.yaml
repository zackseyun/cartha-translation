  text: And let Jerusalem be holy and set apart[a], along with its territory, its tithes[c][b], and its taxes.
  footnotes:
  - marker: a
    text: Or 'dedicated' or 'consecrated' for 'set apart.'
    reason: lexical_alternative
  - marker: b
    text: Or 'its borders'/'its boundaries'; the Greek may refer either to boundary lines or to the territory attached to Jerusalem.
    reason: lexical_alternative
  - marker: c
    text: Or 'its tolls' or 'its customs duties' for 'its taxes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예루살렘은 거룩하고 구별된 곳이 되며, 그 경계와 그 십일조와 세금도 그러해야 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘봉헌된’, ‘헌정된’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘경계들’, ‘경계선들’로도 옮길 수 있으며, 문맥에 따라 예루살렘에 속한 지역을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘통행세’, ‘관세’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤτω
  english_pob_choice: let ... be
  chosen_korean: 되며
  alternatives_korean:
  - 되게 하십시오
  - 되기를 바랍니다
  lexicon: LSJ
  rationale: 왕령의 명령형 뉘앙스를 한국어 합쇼체로 자연스럽게 옮기기 위해 ‘되며’를 사용해 병렬 열거를 살렸습니다.
- source_word: ἁγία
  english_pob_choice: holy
  chosen_korean: 거룩한
  alternatives_korean:
  - 성스러운
  - 신성한
  lexicon: LSJ
  rationale: 예루살렘의 성격을 종교적으로 표시하는 기본 대응으로 ‘거룩한’이 가장 직접적입니다.
- source_word: ἀφιεμένη
  english_pob_choice: set apart
  chosen_korean: 구별된
  alternatives_korean:
  - 헌정된
  - 봉헌된
  lexicon: LSJ
  rationale: ‘holy’와 구별되는 두 번째 형용사의 의미를 살리기 위해, 단순한 거룩함이 아니라 따로 떼어 놓인 상태를 드러내는 ‘구별된’을 택했습니다.
- source_word: τὰ ὅρια αὐτῆς
  english_pob_choice: its territory
  chosen_korean: 그 경계
  alternatives_korean:
  - 그 경계들
  - 그 주변 지역
  - 그 영토
  lexicon: LSJ
  rationale: 문맥상 행정·재정적 경계선을 가리키는 기본 의미를 우선 반영해 ‘경계’로 옮겼습니다. POB의 ‘territory’ 해석 가능성은 유지하되, 본문에는 과도한 확장을 피했습니다.
- source_word: αἱ δεκάται
  english_pob_choice: its tithes
  chosen_korean: 그 십일조
  alternatives_korean:
  - 그 십일조들
  - 그 조세
  lexicon: LSJ
  rationale: 종교적·제도적 수취 항목인 δεκάται를 한국어 교회어법에 맞는 ‘십일조’로 옮겼습니다.
- source_word: τὰ τέλη
  english_pob_choice: its taxes
  chosen_korean: 세금
  alternatives_korean:
  - 통행세
  - 관세
  - 부과금
  lexicon: LSJ
  rationale: τέλη는 세금, 부과금, 통행세, 관세까지 넓게 가리킬 수 있으므로, 이 왕령 맥락에서는 가장 넓고 자연스러운 ‘세금’을 택했습니다.
theological_decisions:
- issue: ἁγία와 ἀφιεμένη의 이중 표현을 어떻게 살릴지
  chosen_reading: ‘거룩하고 구별된 곳’으로 두 표현을 분리해 번역했습니다.
  alternative_readings:
  - 거룩하고 봉헌된 곳
  - 거룩하고 성별된 곳
  rationale: 그리스어는 두 형용사를 병렬로 사용하므로, 하나의 개념으로 합치지 않고 성결과 분리/헌정의 뉘앙스를 각각 들리게 해야 합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 5
