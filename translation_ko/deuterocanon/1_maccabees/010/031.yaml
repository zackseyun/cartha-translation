- from: 예루살렘은 거룩하고 구별된 곳이 되며, 그 경계와 그 십일조와 세금도 그러해야 합니다.[a][b][c]
  to: 예루살렘은 거룩하고 면제된[a] 곳이 되게 하십시오. 그 경계 지역[b]과 십일조와 세금[c]도 면제하십시오.
  rationale: 그리스어 본문과 이 절의 행정·재정 문맥을 우선하여 ἀφιεμένη를 ‘면제된’으로 바로잡았습니다. 영어 감사 기록의 ‘set apart’는 어휘상 가능한 다른 맥락의 의미를 반영하지만, 여기서는 십일조와 세금이 이어지는 왕령의 법적 의미를 충분히 전달하지 못합니다. 본문은 예루살렘의 거룩한 지위와 예루살렘 및 관련 지역·수입에 대한 면제를 자연스러운 한국어 명령문으로 분리하여 표현했습니다.
