  yaml_path: translation/deuterocanon/1_maccabees/010/062.yaml
  text: And the king gave orders to them[a], and they stripped Jonathan of his garments and clothed him in purple[b]; and they did so.
  footnotes:
  - marker: a
    text: Greek has singular verbs ('stripped,' 'clothed him') after 'the king gave orders to them'; the sense is that the attendants carried out the king's command.
    reason: textual_variant
  - marker: b
    text: '''Purple'' signifies royal or high-status attire in this court setting.'
    reason: cultural_note
translation:
  language: ko
  text: 왕은 그들에게 명령을 내렸습니다.[a] 그러자 그들은 요나단의 옷을 벗기고 그에게 자주색 옷을 입혔습니다.[b] 그들은 그렇게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘왕이 그들에게 명령했다’ 뒤에 ‘벗겼다’, ‘입혔다’라는 단수형 동사를 사용합니다. 그러나 마지막에 복수형으로 ‘그들은 그렇게 했다’고 하므로, 명령을 받은 이들이 왕의 명령을 수행한 것으로 이해됩니다.
    reason: textual_variant
  - marker: b
    text: ‘자주색’은 이 궁정 장면에서 왕실 또는 고위 신분의 의복을 나타냅니다.
    reason: cultural_note
lexical_decisions:
- source_word: προσέταξεν
  english_pob_choice: gave orders
  chosen_korean: 명령을 내렸습니다
  alternatives_korean:
  - 명령했습니다
  - 지시했습니다
  lexicon: BDAG
  rationale: 왕의 권위 있는 지시를 자연스럽고 격식 있게 살리기 위해 ‘명령을 내리다’를 택했습니다.
- source_word: ἐξέδυσεν Ἰωνάθαν τὰ ἱμάτια αὐτοῦ
  english_pob_choice: they stripped Jonathan of his garments
  chosen_korean: 요나단의 옷을 벗기고
  alternatives_korean:
  - 요나단의 옷을 벗겨
  - 요나단에게서 옷을 벗기고
  lexicon: BDAG
  rationale: 궁정 의식에서의 공식적인 탈의 행위를 자연스러운 한국어로 옮기되, 단순히 ‘벗다’보다 강한 ‘벗기다’로 원문의 행위를 살렸습니다.
- source_word: ἐνέδυσεν αὐτὸν πορφύραν
  english_pob_choice: clothed him in purple
  chosen_korean: 그에게 자주색 옷을 입혔습니다
  alternatives_korean:
  - 그를 자주색으로 입혔습니다
  - 그에게 자주색을 입혔습니다
  lexicon: BDAG
  rationale: πορφύραν은 왕실·고위 신분을 나타내는 자주색 의복을 가리킬 수 있으므로, 문맥을 드러내는 ‘자주색 옷’으로 옮겼습니다.
- source_word: ἐποίησαν οὕτως
  english_pob_choice: they did so
  chosen_korean: 그들은 그렇게 했습니다
  alternatives_korean:
  - 그들은 그리하였습니다
  - 그들은 그대로 했습니다
  lexicon: BDAG
  rationale: 마지막 순응 진술을 간결하게 살려, 왕의 명령 집행이 실제로 이루어졌음을 분명히 했습니다.
