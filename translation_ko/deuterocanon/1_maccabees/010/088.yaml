  - 알게 되었습니다
  lexicon: BDAG
  rationale: 문맥상 보고나 말을 직접 청취한 의미이므로 '들었습니다'가 가장 직접적입니다.
- source_word: τοὺς λόγους τούτους
  english_pob_choice: these words
  chosen_korean: 이 말들을
  alternatives_korean:
  - 이 말들을
