  text: And it happened that when Alexander the king heard these words[a], he added to honoring Jonathan.
  footnotes:
  - marker: a
    text: Or 'he continued to honor Jonathan' or 'he honored Jonathan still more.' The Greek προσέθετο δοξάσαι expresses added or increased honor.
