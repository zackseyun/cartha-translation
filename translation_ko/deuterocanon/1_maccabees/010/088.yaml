    rationale: 그리스어 표현은 단순히 ‘더하다’라는 어휘를 기계적으로 옮긴 것이라기보다, 존귀하게 함을 계속하거나 더 크게 행했다는 뜻이 될 수 있습니다. 각주를 이 의미 범위에 맞추는 것이 정확합니다.
