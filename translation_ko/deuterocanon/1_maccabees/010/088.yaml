  - 이 소식을
  lexicon: BDAG
  rationale: λόγοι를 여기서는 특정 발언들의 내용으로 보아 '말들'로 옮겼고, '소식'은 의미를 너무 해석적으로 바꿀 수 있어 피했습니다.
- source_word: προσέθετο δοξάσαι
  english_pob_choice: he added to honoring
  chosen_korean: 더욱 높여 주었습니다
  alternatives_korean:
  - 더욱 존중해 주었습니다
  - 계속해서 존귀하게 해 주었습니다
  - 더해져서 영광을 돌렸습니다
  lexicon: BDAG
  rationale: δοξάζω를 왕실·정치적 맥락에서 '영화롭게 하다'보다 '높이다/존중하다'로 보는 것이 자연스럽고, προσέθετο의 '더함'은 '더욱'으로 반영했습니다.
- source_word: τὸν Ἰωναθάν
  english_pob_choice: Jonathan
  chosen_korean: 요나단
  alternatives_korean:
  - 요나단
  - 요나단을
  lexicon: Korean biblical proper nouns
  rationale: 인명은 통용되는 성서 표기를 따랐고, 목적어 표지는 한국어 동사 구조에서 자연스럽게 드러납니다.
theological_decisions:
- issue: 'δοξάσαι의 의미 범위: ''영광을 돌리다'' vs ''높여 주다/존중하다'''
  chosen_reading: 왕이 요나단에게 계속해서 더 큰 존중과 공적 지위를 부여했다는 정치적 의미로 읽었습니다.
  alternative_readings:
  - 영광을 돌려 주었습니다
  - 영화롭게 하였습니다
  rationale: 문맥은 하나님께 영광을 돌리는 신학적 장면이 아니라 왕이 인물을 대우하는 정치적 서술이므로, 한국어에서도 그 차이를 드러내는 표현이 적절합니다.
  doctrine_reference: 문맥적 의미 구분; 왕정 서술의 honor language
