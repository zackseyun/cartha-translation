translation:
  language: ko
  text: 알렉산드로스 왕이 이 말들을 들었을 때, 요나단을 더욱 높여 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘요나단을 계속해서 존귀하게 하였다’ 또는 ‘요나단을 더욱 존귀하게 하였다’로도 옮길 수 있습니다. προσέθετο δοξάσαι는 그에게 베푼 명예가 계속되거나 더해졌음을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐγένετο ὡς
  english_pob_choice: And it happened that when
  chosen_korean: 그 일이 있어서 … 듣고
  alternatives_korean:
  - 그리고 … 듣고
  - 그리고 그것이 일어나서 … 듣고
  lexicon: SBLGNT / narrative formula
  rationale: 그리스어의 사건 전환 공식은 한국어에서 지나치게 직역하면 부자연스러워서, 서사 흐름을 살리되 '그 일이 있어서'로 결과적 전환을 표시했습니다.
- source_word: ἤκουσεν
  english_pob_choice: heard
  chosen_korean: 들었습니다
  alternatives_korean:
  - 들었습니다
  - 알게 되었습니다
  lexicon: BDAG
  rationale: 문맥상 보고나 말을 직접 청취한 의미이므로 '들었습니다'가 가장 직접적입니다.
- source_word: τοὺς λόγους τούτους
  english_pob_choice: these words
  chosen_korean: 이 말들을
  alternatives_korean:
  - 이 말들을
  - 이런 말들을
  - 이 소식을
  lexicon: BDAG
  rationale: λόγοι를 여기서는 특정 발언들의 내용으로 보아 '말들'로 옮겼고, '소식'은 의미를 너무 해석적으로 바꿀 수 있어 피했습니다.
- source_word: προσέθετο δοξάσαι
  english_pob_choice: he added to honoring
  chosen_korean: 더욱 높여 주었습니다
  alternatives_korean:
  - 더욱 존중해 주었습니다
  - 계속해서 존귀하게 해 주었습니다
  - 더해져서 영광을 돌렸습니다
  lexicon: BDAG
  rationale: δοξάζω를 왕실·정치적 맥락에서 '영화롭게 하다'보다 '높이다/존중하다'로 보는 것이 자연스럽고, προσέθετο의 '더함'은 '더욱'으로 반영했습니다.
- source_word: τὸν Ἰωναθάν
  english_pob_choice: Jonathan
  chosen_korean: 요나단
  alternatives_korean:
  - 요나단
  - 요나단을
  lexicon: Korean biblical proper nouns
  rationale: 인명은 통용되는 성서 표기를 따랐고, 목적어 표지는 한국어 동사 구조에서 자연스럽게 드러납니다.
theological_decisions:
- issue: 'δοξάσαι의 의미 범위: ''영광을 돌리다'' vs ''높여 주다/존중하다'''
  chosen_reading: 왕이 요나단에게 계속해서 더 큰 존중과 공적 지위를 부여했다는 정치적 의미로 읽었습니다.
  alternative_readings:
  - 영광을 돌려 주었습니다
  - 영화롭게 하였습니다
  rationale: 문맥은 하나님께 영광을 돌리는 신학적 장면이 아니라 왕이 인물을 대우하는 정치적 서술이므로, 한국어에서도 그 차이를 드러내는 표현이 적절합니다.
  doctrine_reference: 문맥적 의미 구분; 왕정 서술의 honor language
