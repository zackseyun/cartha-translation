base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/020.yaml
  text: And now today we have appointed you high priest of your nation[c][b][a], and to be called the king’s Friend—and they sent him a purple robe and a crown of gold—and to take our side and maintain friendship with us.
  footnotes:
  - marker: a
    text: Or 'friend of the king.' The Greek may reflect an official court title in Hellenistic usage.
    reason: lexical_alternative
  - marker: b
    text: The Greek text shifts here from first-person royal speech ('we have appointed') to third-person narration ('they sent him'), and the translation preserves that shift.
    reason: textual_variant
  - marker: c
    text: Literally 'think our things'; the idiom means to favor our interests or side with us.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이제 오늘 우리는 당신을 당신 민족의 대제사장으로 세우고, 왕의 친구라 불리게 하며—그들에게서 자주빛 옷과 금관을 보내고—우리 편을 생각하고 우리와의 우정을 지키게 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘우리의 것들을 생각하다’입니다. 여기서는 우리 편을 들거나 우리 이익에 우호적으로 기울라는 관용 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 본문은 여기서 1인칭 왕령에서 3인칭 서술로 시점이 바뀝니다. 번역은 그 전환을 평준화하지 않고 그대로 살렸습니다.
    reason: source_note
lexical_decisions:
- source_word: καθεστάκαμέν
  english_pob_choice: we have appointed
  chosen_korean: 우리는 … 세우고
  alternatives_korean:
  - 임명하고
  - 설정하고
  - 수립하고
  lexicon: LSJ
  rationale: 공식적 임직 문맥의 완료형 καθίστημι를 한국어에서 자연스럽게 드러내는 표현으로 ‘세우다’를 택했습니다.
- source_word: ἀρχιερέα
  english_pob_choice: high priest
  chosen_korean: 대제사장
  alternatives_korean:
  - 큰 제사장
  - 최고 제사장
  lexicon: LSJ
  rationale: 유대교의 공적 직함을 가리키는 표준 대응어로 ‘대제사장’이 가장 직접적입니다.
- source_word: φίλον βασιλέως
  english_pob_choice: the king’s Friend
  chosen_korean: 왕의 친구라 불리게 하며
  alternatives_korean:
  - 왕의 친구로 불리게 하며
  - 왕의 벗이라 불리게 하며
  - 왕의 친구라는 칭호를 주며
  lexicon: LSJ
  rationale: 헬라식 궁정 칭호의 성격을 살리되, 한국어에서는 인위적 대문자 표기보다 ‘불리게 하며’로 титуляр 의미를 드러냈습니다.
- source_word: πορφύραν
  english_pob_choice: a purple robe
  chosen_korean: 자주빛 옷
  alternatives_korean:
  - 자주색 옷
  - 자주빛 예복
  - 보랏빛 옷
  lexicon: LSJ
  rationale: 보내진 물건이 의복임은 문맥상 분명하므로 ‘옷’으로 풀고, πορφύρα의 색감을 ‘자주빛’으로 옮겼습니다.
- source_word: στέφανον χρυσοῦν
  english_pob_choice: a crown of gold
  chosen_korean: 금관
  alternatives_korean:
  - 황금 관
  - 금으로 된 관
  - 황금으로 된 왕관
  lexicon: LSJ
  rationale: στέφανος의 관/관식 의미를 한국어에서 간결하게 ‘금관’으로 옮겨 예우용 증정품의 뉘앙스를 살렸습니다.
- source_word: φρονεῖν τὰ ἡμῶν
  english_pob_choice: take our side
  chosen_korean: 우리 편을 생각하고
  alternatives_korean:
  - 우리 뜻을 품고
  - 우리의 일을 생각하고
  - 우리 편에 서고
  lexicon: LSJ
  rationale: 문자적으로는 ‘우리의 것들을 생각하다’이지만, 영어 POB처럼 정치적·충성적 함의를 가진 관용구이므로 ‘우리 편을 생각하다’로 옮겼습니다.
- source_word: συντηρεῖν φιλίαν πρὸς ἡμᾶς
  english_pob_choice: maintain friendship with us
  chosen_korean: 우리와의 우정을 지키게 합니다
  alternatives_korean:
  - 우리와의 우정을 유지하게 합니다
  - 우리와의 우호를 보존하게 합니다
  - 우리와 친선을 지키게 합니다
  lexicon: LSJ
  rationale: φιλία를 단순한 감정이 아니라 외교적 우호 관계로 보고, 지속성을 나타내는 ‘지키다’로 옮겼습니다.
theological_decisions:
- issue: 본문의 서술자 시점 전환(1인칭 왕령에서 3인칭 보고로의 이동)
  chosen_reading: ‘그들에게서 … 보내고’로 시점 전환을 그대로 살렸습니다.
  alternative_readings:
  - ‘우리가 … 보내고’로 평탄화
  - 직접 인용을 완전히 1인칭으로 통일
  rationale: 그리스어는 πρώτον 1인칭 왕령을 유지하다가 ἀπέστειλαν αὐτῷ에서 3인칭 복수로 바뀌므로, 본문 감각을 보존하기 위해 매끄럽게 합치지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: φίλον βασιλέως의 직함성
  chosen_reading: ‘왕의 친구’라는 칭호로 읽었습니다.
  alternative_readings:
  - 단순히 왕의 친구
  - 왕과 친한 사람
  rationale: 이 표현은 단순한 개인적 우정이 아니라 헬레니즘 궁정에서의 공식적 호칭일 가능성이 있어, 직함성을 남기는 번역이 적절합니다.
  doctrine_reference: Translation philosophy §1, §5
