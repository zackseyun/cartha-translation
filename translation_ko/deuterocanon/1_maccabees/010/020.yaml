  source_fidelity: 수정이 필요합니다. καθεστάκαμέν의 완료형은 현재의 ‘세우고/하게 합니다’보다 ‘임명하였습니다’로 옮겨야 합니다. 또한 ἀπέστειλαν αὐτῷ는 ‘그들에게서 … 보내고’가 아니라, 3인칭 복수 주어와 여격 목적어를 드러낸 ‘그들은 그에게 … 보냈습니다’여야 합니다. φρονεῖν τὰ ἡμῶν은 ‘우리 편을 생각하고’보다 ‘우리 편에 서고’가 현대 한국어에서 더 자연스럽고 정치적 충성의 뜻을 정확히 전달합니다.
  naturalness: 초안은 ‘세우고 … 불리게 하며 … 보내고 … 지키게 합니다’가 완료형 왕령과 서술 시제, 그리고 병렬 관계를 불안정하게 만듭니다. 수정문은 현대 표준어 합쇼체로 문법 관계와 시제 전환을 분명히 하였습니다.
  terminology: ‘대제사장’은 적절합니다. φίλον βασιλέως의 직함 가능성은 ‘왕의 친구’라는 표현과 각주로 보존하였습니다. φιλία는 이 문맥에서 개인적 감정보다 정치적·외교적 관계를 가리키므로 ‘우호 관계’로 옮겼습니다.
  issues:
  - severity: high
    issue: ἀπέστειλαν αὐτῷ의 주어·방향이 잘못 번역됨
    rationale: ‘그들에게서 자주빛 옷과 금관을 보내고’는 ‘그들에게서’라는 출처 표현을 넣고, 그들이 그에게 보냈다는 그리스어의 3인칭 복수 주어와 여격 수혜자를 명료하게 전달하지 못합니다.
