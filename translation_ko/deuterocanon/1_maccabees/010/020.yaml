  rationale: 그리스어의 완료형 공식 임명(καθεστάκαμέν), ‘왕의 친구’라는 직함성, ἀπέστειλαν αὐτῷ에서의 돌연한 3인칭 서술 전환, 그리고 정치적 충성을 뜻하는 φρονεῖν τὰ ἡμῶν을 모두 보존하도록 고쳤습니다. ‘그들은 그에게’로 문법적 관계를 명시하되, 본문의 다소 불연속적인 시점 전환 자체는 각주와 본문에서 유지했습니다.
