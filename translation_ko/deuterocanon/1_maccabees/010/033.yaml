  yaml_path: translation/deuterocanon/1_maccabees/010/033.yaml
  text: And every Jewish person who has been taken captive from the land of Judah into any part of my kingdom I release as free[a], without payment; and let all also remit the taxes on them and on their livestock.
  footnotes:
  - marker: a
    text: Or, 'let all remit the taxes and those on their livestock.' The Greek can be read as referring either specifically to taxes assessed on livestock or more broadly to taxes and related dues connected with property.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 유대인의 모든 사람 곧 유다 땅에서 잡혀와 내 왕국의 어느 곳에 있든지 있는 사람들을 나는 값 없이 자유롭게 풀어줍니다. 또 모든 사람은 그들에 대한 세금과 그들의 가축에 대한 세금도 면제해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어는 ‘세금’과 ‘그들의 가축’에 대한 세금을 함께 가리킬 수도 있고, 사람과 가축에 각각 부과된 관련 부담을 포괄적으로 말할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσαν ψυχὴν Ἰουδαίων
  english_pob_choice: every Jewish person
  chosen_korean: 유대인의 모든 사람
  alternatives_korean:
  - 유대인의 모든 영혼
  - 모든 유대인
  lexicon: LSJ
  rationale: ψυχή는 행정적·집단적 문맥에서 ‘영혼’보다 ‘사람’을 뜻하는 경우가 많아, 한국어에서도 자연스럽고 본문의 분배적 의미를 살리기 위해 ‘사람’으로 옮겼습니다.
- source_word: ἀπὸ γῆς Ἰούδα
  english_pob_choice: from the land of Judah
  chosen_korean: 유다 땅에서
  alternatives_korean:
  - 유다 지방에서
  - 유대 땅에서
  lexicon: LSJ
  rationale: γῆ는 ‘땅’의 의미를 직접 반영하며, Greek의 ‘Ἰούδα’를 그대로 살려 ‘유다 땅’으로 옮겼습니다.
- source_word: εἰς πᾶσαν βασιλείαν μου
  english_pob_choice: into any part of my kingdom
  chosen_korean: 내 왕국의 어느 곳에 있든지
  alternatives_korean:
  - 내 왕국 전체에
  - 내 온 나라 안에
  lexicon: LSJ
  rationale: 이 표현은 왕권의 추상적 개념이 아니라 영토 안의 어느 지역이든을 가리키므로, 분포적 의미를 살려 이렇게 옮겼습니다.
- source_word: ἀφίημι ἐλευθέραν δωρεάν
  english_pob_choice: I release as free, without payment
  chosen_korean: 값 없이 자유롭게 풀어줍니다
  alternatives_korean:
  - 무상으로 자유롭게 풀어줍니다
  - 대가 없이 석방합니다
  lexicon: LSJ
  rationale: ἀφίημι는 ‘풀어주다/석방하다’의 의미가 강하고, δωρεάν은 ‘값 없이’라는 뜻이므로 두 요소를 함께 드러냈습니다.
- source_word: τοὺς φόρους καὶ κτηνῶν αὐτῶν
  english_pob_choice: the taxes on them and on their livestock
  chosen_korean: 그들에 대한 세금과 그들의 가축에 대한 세금
  alternatives_korean:
  - 그들 및 그들의 가축에 대한 세금
  - 그들에게 부과된 세금과 가축세
  lexicon: LSJ
  rationale: φόροι와 κτηνῶν αὐτῶν의 관계가 사람과 가축 양쪽에 대한 과세를 가리킬 수 있어, POB의 각주 취지를 반영해 둘 다 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 왕의 칙령 형식과 해방 선언의 어조
  chosen_reading: 명령문이지만 한국어에서는 공문체에 가까운 선언형 ‘풀어줍니다/면제해야 합니다’로 옮겼습니다.
  alternative_readings:
  - 풀어주노라
  - 풀어주겠습니다
  rationale: 본문은 왕의 공적 선언이므로 지나치게 회화적이거나 지나치게 경건한 어조보다, 현대 한국어의 공문·칙령 문체가 의미를 더 정확히 전달합니다.
  doctrine_reference: 역사서/제국 칙령의 문체
