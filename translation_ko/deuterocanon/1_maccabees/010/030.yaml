base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/030.yaml
  text: And instead of the third of the seed-sowing[a], and instead of the half of the fruit of the trees that falls to me to receive, I release it from this day and onward, from being taken from the land of Judah and from the three districts added to it from Samaria and Galilee[c][b], from this day and for all time.
  footnotes:
  - marker: a
    text: 'Or, more idiomatically, ''a third of the crops and half of the fruit of the trees.'' The Greek wording is more literal: ''the third of the seed-sowing'' and ''the half of the fruit of the trees.'''
    reason: lexical_alternative
  - marker: b
    text: That is, the royal share or tax revenue otherwise due to the king.
    reason: cultural_note
  - marker: c
    text: '''Districts'' translates Greek nomoi, administrative regions; some English versions preserve the technical term ''nomes.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 종자 한 몫의 셋째와, 내 몫으로 받아야 하는 나무 열매의 절반 대신, 나는 오늘부터 영구히 그것을 면제하여, 유다 땅과 사마리아와 갈릴리에서 그 땅에 더해진 세 지역으로부터 더 이상 거두지 않게 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 관용적으로는 ‘종자에서 나는 수확의 3분의 1’이라 할 수 있습니다. 그리스어 표현은 더 직역적으로 ‘씨의 셋째’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 왕에게 원래 귀속되던 왕실 몫 또는 조세 수입을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 여기서 νομοί는 행정 구획을 뜻합니다. 일부 번역은 전문용어인 ‘놈’을 보존하기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντὶ τοῦ τρίτου τῆς σπορᾶς
  english_pob_choice: instead of the third of the seed-sowing
  chosen_korean: 종자 한 몫의 셋째
  alternatives_korean:
  - 씨 뿌림의 셋째
  - 파종 수확의 3분의 1
  lexicon: LSJ
  rationale: σπορά를 단순히 ‘씨’로만 좁히기보다, 농업적 할당이라는 문맥을 살려 ‘종자 한 몫’으로 옮겼고, ‘셋째’는 한 몫의 3분의 1이라는 뜻을 자연스럽게 드러냅니다.
- source_word: τοῦ ἡμίσους τοῦ καρποῦ τοῦ ξυλίνου
  english_pob_choice: the half of the fruit of the trees
  chosen_korean: 나무 열매의 절반
  alternatives_korean:
  - 나무의 열매 절반
  - 수목의 열매 절반
  lexicon: LSJ
  rationale: ξυλίνου를 ‘나무’로 풀어, 직역적이면서도 한국어에서 자연스러운 표현으로 유지했습니다.
- source_word: τοῦ ἐπιβάλλοντός μοι λαβεῖν
  english_pob_choice: that falls to me to receive
  chosen_korean: 내 몫으로 받아야 하는
  alternatives_korean:
  - 내가 받아야 할
  - 내게 귀속되어 거두어야 하는
  lexicon: LSJ
  rationale: 재정·조세 문맥의 ‘정당하게 귀속되는 몫’을 살리되, 한국어에서는 ‘내 몫으로 받아야 하는’이 가장 명료합니다.
- source_word: ἀφίημι
  english_pob_choice: I release it
  chosen_korean: 면제하여
  alternatives_korean:
  - 유예하여
  - 풀어 주어
  - 탕감하여
  lexicon: LSJ
  rationale: 왕의 조세 청구를 포기하는 의미이므로, 한국어에서는 행정·세금 문맥에 맞는 ‘면제하다’가 가장 정확합니다.
- source_word: τῶν τριῶν νομῶν
  english_pob_choice: the three districts
  chosen_korean: 세 지역
  alternatives_korean:
  - 세 구역
  - 세 행정구역
  - 세 놈(논스)
  lexicon: LSJ
  rationale: νομός는 행정 구획을 가리키므로 ‘지역’보다 ‘행정구역’이 더 정확하지만, 본문 가독성을 위해 본문에는 ‘세 지역’을 두고 의미를 보존했습니다.
theological_decisions:
- issue: 조세 면제 선언을 뜻하는 ἀφίημι의 법정·행정적 뉘앙스
  chosen_reading: ‘면제하여’로 옮겨, 도덕적 용서가 아니라 왕권의 세금 청구 포기를 드러냈습니다.
  alternative_readings:
  - 용서하여
  - 풀어 주어
  - 포기하여
  rationale: 본문은 죄 사함이 아니라 세금/공물의 면제를 말하므로, 한국어에서도 행정적 효력을 분명히 해야 합니다.
  doctrine_reference: 문맥상 조세·왕실 수입의 면제
