  rationale: 인용문을 여는 분사 구조를 한국어에서 자연스럽게 드러내기 위해 ‘말하기를’로 옮겼습니다.
- source_word: Βασιλεὺς Ἀλέξανδρος
  english_pob_choice: King Alexander
  chosen_korean: 임금 알렉산드로스
  alternatives_korean:
  - 왕 알렉산드로스
  - 알렉산드로스 왕
  lexicon: LSJ
  rationale: 헬라어 βασιλεύς는 통치자 호칭으로서 ‘임금’이 가장 무난하며, 고유명사는 현대 외래어 표기에 따라 옮겼습니다.
- source_word: τῷ ἀδελφῷ
  english_pob_choice: to his brother
  chosen_korean: 그의 형제에게
  alternatives_korean:
  - 그의 형에게
  - 형제에게
  - 그 형제에게
  lexicon: LSJ
  rationale: 헬라어 ἀδελφός의 기본값은 ‘형제’이므로, 추가 재구성 없이 원문 그대로의 친족 호칭을 유지했습니다.
theological_decisions:
- issue: 현존하는 그리스어가 문장 전체가 아니라 서간문의 서두처럼 끊겨 있는 상태를 어떻게 처리할지
  chosen_reading: 본문을 보완하지 않고, 남아 있는 서두형 표현만 한국어로 옮겼습니다.
  alternative_readings:
  - 추정되는 편지 내용을 덧붙여 완전한 문장으로 복원하기
  - 번역을 매끈하게 하려고 서두를 일반 문장으로 바꾸기
  rationale: 영문 POB 주석이 본문이 불완전한 단편이며 복원을 시도하지 않는다고 명시하므로, 한국어도 그 절제된 처리 방식을 따라야 합니다.
  doctrine_reference: 본문비평 원칙
- issue: τῷ ἀδελφῷ의 관계를 왕실 서신 관습의 '형제' 호칭으로 볼지 여부
  chosen_reading: 원문 표면형을 따라 친족 호칭으로만 옮기고, 외교적 호칭으로 확장하지 않았습니다.
  alternative_readings:
  - 외교적 관용구로 ‘동맹자에게’처럼 풀어쓰기
  - 대상 인물을 추정하여 이름을 보충하기
  rationale: 현재 제공된 그리스어에는 수신자 이름이나 추가 맥락이 없으므로, 의미 범위를 넓혀 재구성하지 않는 것이 소스 충실성에 맞습니다.
  doctrine_reference: 본문 충실성
