base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/041.yaml
  text: And all the surplus that they did not pay from the revenues[a], as in the former years[b], from now on they shall give for the works of the house.
  footnotes:
  - marker: a
    text: That is, the temple; 'the house' is a literal rendering of the Greek expression.
    reason: cultural_note
  - marker: b
    text: Or 'excess' / 'remainder' for 'surplus.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들이 수입에서 내지 않은 남은 모든 것은, 전처럼 이제부터는 집의 공사를 위하여 바칠 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘집’은 문맥상 성전을 가리키는 문자적 표현입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘잉여분’/‘초과분’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν τὸ πλεονάζον
  english_pob_choice: all the surplus
  chosen_korean: 남은 모든 것
  alternatives_korean:
  - 잉여분 전체
  - 남은 잉여
  - 초과분
  lexicon: LSJ
  rationale: 행정·재정 문맥에서 ‘surplus’는 단순한 ‘과잉’보다 이미 정산하고도 남은 몫을 가리키므로, 자연스러운 한국어로 ‘남은 모든 것’이라 옮겼습니다.
- source_word: ἀπὸ τῶν χρειῶν
  english_pob_choice: from the revenues
  chosen_korean: 수입에서
  alternatives_korean:
  - 세입에서
  - 재정에서
  - 필요 경비에서
  lexicon: LSJ
  rationale: χρειῶν은 여기서 지출 대비되는 재정적 수입·재원을 뜻하므로, 한국어로는 행정적 의미가 분명한 ‘수입’이 가장 적절합니다.
- source_word: τοῦ οἴκου
  english_pob_choice: the house
  chosen_korean: 집
  alternatives_korean:
  - 성전
  - 하나님의 집
  - 성전 집
  lexicon: LSJ
  rationale: 원문은 직역하면 ‘집’이며, 문맥상 성전을 가리키지만 본문에서는 그 비유적 표현을 살려 ‘집’으로 유지했습니다.
- source_word: εἰς τὰ ἔργα
  english_pob_choice: for the works
  chosen_korean: 공사를 위하여
  alternatives_korean:
  - 일들을 위하여
  - 공역을 위하여
  - 건축 사업을 위하여
  lexicon: LSJ
  rationale: τὰ ἔργα는 성전과 관련된 공적 사업들을 가리키므로, 한국어 독자에게는 구체적이고도 과도하게 좁히지 않는 ‘공사’가 가장 자연스럽습니다.
theological_decisions:
- issue: τοῦ οἴκου의 성전 지시를 본문과 각주 중 어디에 둘지
  chosen_reading: 본문에서는 ‘집’을 직역으로 두고, 성전이라는 지시를 별도 각주로 처리하지 않았습니다.
  alternative_readings:
  - 본문을 ‘성전’으로 해석해 옮김
  - 본문은 ‘집’, 각주로 성전 지시 설명
  rationale: 영어 POB가 ‘house’를 문자적으로 유지하면서도 독자가 문맥상 성전을 알 수 있다고 본 만큼, 한국어도 같은 직역을 유지해 원문 표현의 긴장을 보존했습니다.
  doctrine_reference: 본문 표지의 보존과 문맥 지시의 균형
- issue: 재정 문맥의 ‘남은 것’ 표현이 단순 잔여인지 초과분인지
  chosen_reading: ‘남은 모든 것’으로 옮겨 초과 잔액의 의미를 포괄했습니다.
  alternative_readings:
  - ‘초과분’
  - ‘잉여분’
  - ‘잔액’
  rationale: 원문 participial substantive πλεονάζον은 계산 후 남은 몫을 뜻하므로, 좁게 ‘초과분’으로 고정하기보다 의미를 포괄하는 표현이 문맥에 더 충실합니다.
  doctrine_reference: 행정·재정 서술의 의미 보존
