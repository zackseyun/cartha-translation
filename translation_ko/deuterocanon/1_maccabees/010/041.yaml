  source_fidelity: ‘전처럼’은 ἐν τοῖς πρώτοις ἔτεσιν(이전 여러 해 동안/지난 해들에)이라는 시간적·행정적 비교를 충분히 드러내지 못하며, 두 각주 표지가 모두 문장 끝에 붙어 있어 각각의 지시 대상과 맞지 않습니다. 또한 ‘집의 공사’는 한국어에서 다소 부자연스럽습니다.
  naturalness: ‘그들이 수입에서 내지 않은 남은 모든 것’은 수식 관계가 무겁고, ‘전처럼 이제부터는’도 시간 관계가 모호합니다. 주어를 한 번 제시하고 ‘이전 여러 해 동안’과 ‘이제부터’를 대조하면 현대 한국어 합쇼체 문장으로 자연스럽습니다.
  terminology: πλεονάζον은 재정 문맥에서 ‘잉여분’이 적절하며, ἀπέδωσαν은 ‘바치다’로 옮길 수 있습니다. οἶκος의 문자적 표현은 ‘그 집’으로 보존하고 성전 지시는 해당 어구에 각주를 답니다. τὰ ἔργα는 과도하게 특정하지 않고 ‘공사’로 유지할 수 있습니다.
