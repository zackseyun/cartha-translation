  terminology: ‘마음이 동요되었으며’ is a suitably restrained rendering of ἐκινήθη τῇ διανοίᾳ and properly avoids specifying anger or another precise emotion. ‘만 명’ naturally denotes the selected body of men in this military context. Names are conventionally and consistently rendered as 요나단, 아폴로니우스, 예루살렘, and 시몬.
