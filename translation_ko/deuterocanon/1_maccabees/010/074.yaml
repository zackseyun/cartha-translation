  source_fidelity: 'The draft accurately represents the sequence and principal senses of the Greek: Jonathan hears Apollonius''s words, experiences unspecified inner agitation, selects ten thousand men, leaves Jerusalem, and is met by Simon for the purpose of assistance. The translation should identify Jonathan explicitly in the final clause, since consecutive Korean object pronouns (‘그를 … 그를’) are awkward and can obscure their referents.'
