  yaml_path: translation/deuterocanon/1_maccabees/010/074.yaml
  text: But when Jonathan heard the words of Apollonius[a], he was stirred in his mind, and he chose ten thousand men and went out from Jerusalem, and Simon his brother met him to help him.
  footnotes:
  - marker: a
    text: Or 'he was moved in his mind,' 'he was provoked in his mind.' The Greek describes an inner stirring or agitation without specifying the exact emotion.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 요나단이 아폴로니우스의 말을 듣고 마음이 동요되었으며, 만 명을 택하고 예루살렘에서 나갔고, 그의 형제 시몬이 그를 돕기 위해 그를 만났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘마음이 동요되었으며’는 내면의 격동을 드러내는 번역이며, ἐκινήθη τῇ διανοίᾳ는 정확한 감정명칭을 특정하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν τῶν λόγων
  english_pob_choice: heard the words
  chosen_korean: 아폴로니우스의 말을 듣고
  alternatives_korean:
  - 아폴로니우스의 말을 듣자
  - 아폴로니우스의 말을 들었을 때
  lexicon: LSJ
  rationale: λόγοι는 여기서 아폴로니우스가 한 발언을 가리키므로, ‘말’을 써서 직접적이고 문맥에 맞게 옮겼습니다.
- source_word: ἐκινήθη τῇ διανοίᾳ
  english_pob_choice: he was stirred in his mind
  chosen_korean: 마음이 동요되었으며
  alternatives_korean:
  - 마음이 흔들렸으며
  - 생각이 흔들렸으며
  - 마음이 자극되었으며
  lexicon: LSJ
  rationale: διανοία는 단순한 감정이 아니라 내면의 사고·판단 영역을 가리키므로, 내적 동요를 드러내는 ‘마음이 동요되다’로 옮겼습니다.
- source_word: ἐπέλεξεν δέκα χιλιάδας ἀνδρῶν
  english_pob_choice: he chose ten thousand men
  chosen_korean: 만 명을 택하고
  alternatives_korean:
  - 만 명의 남자를 택하고
  - 만 명의 사람을 택하고
  - 만 명의 군사를 택하고
  lexicon: LSJ
  rationale: ἀνδρῶν은 문자적으로 ‘남자들’이지만, 전투 맥락상 한국어에서는 자연스럽고 간결한 ‘만 명’을 유지해 군사적 인원을 가리키게 했습니다.
- source_word: ἐξῆλθεν ἐξ Ἱερουσαλήμ
  english_pob_choice: went out from Jerusalem
  chosen_korean: 예루살렘에서 나갔고
  alternatives_korean:
  - 예루살렘을 떠났고
  - 예루살렘에서 출정했고
  lexicon: LSJ
  rationale: ἐξῆλθεν은 단순한 ‘나가다’이므로, 군사적 색채를 과도하게 덧붙이지 않는 표현을 택했습니다.
- source_word: ἐπὶ βοήθειαν αὐτοῦ
  english_pob_choice: to help him
  chosen_korean: 그를 돕기 위해
  alternatives_korean:
  - 그의 도움을 위해
  - 그를 돕기 위하여
  - 그의 원조를 위해
  lexicon: LSJ
  rationale: ἐπὶ + 목적어는 목적을 나타내므로, 현대 한국어에서 가장 자연스러운 목적 표현으로 옮겼습니다.
theological_decisions:
- issue: 시몬의 합류 표현
  chosen_reading: ‘그를 돕기 위해 그를 만났습니다’로 옮겨, 단순한 우연한 조우가 아니라 의도된 지원의 합류임을 드러냈습니다.
  alternative_readings:
  - ‘그를 만나 그를 도왔습니다’
  - ‘그를 돕기 위해 와서 만났습니다’
  rationale: συνήντησεν αὐτῷ ἐπὶ βοήθειαν αὐτοῦ는 만남 자체가 지원 목적과 연결되므로, 조우와 목적을 함께 보이도록 했습니다.
  doctrine_reference: 서사 문맥의 행위 의도 표현
