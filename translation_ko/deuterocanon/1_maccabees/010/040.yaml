translation:
  language: ko
  text: 그리고 나도 해마다 은 1만 5천 세겔을 왕의 회계에서, 곧 그에게 속한 지역들에서 드립니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕의 수입에서’, ‘왕의 재정에서’, ‘왕의 명령에 따라’. 그리스어 λόγος는 문자적으로 ‘계산, 회계, 말’을 뜻하며, 여기서는 재정상의 계정이나 수입원을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 구절은 자금이 나오는 지구나 지역을 가리킬 수 있습니다. 문자적으로는 ‘속한 곳들에서’이며, 누구에게 속하는지는 문맥상 왕을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  english_pob_choice: And I also
  chosen_korean: 그리고 나도
  alternatives_korean:
  - 나도
  - 그리고 나 역시
  lexicon: LSJ
  rationale: καί+ἐγώ의 결합으로 앞선 제안에 더해 화자의 개인적 부담을 강조하므로, ‘그리고 나도’가 연결성과 강조를 함께 살립니다.
- source_word: κατʼ ἐνιαυτόν
  english_pob_choice: year by year
  chosen_korean: 해마다
  alternatives_korean:
  - 매년
  - 해마다 한 번씩
  lexicon: LSJ
  rationale: 반복되는 연간 지급을 뜻하므로, 한국어에서는 자연스럽고 간결한 ‘해마다’가 분배적 의미를 잘 드러냅니다.
- source_word: δέκα πέντε χιλιάδας σίκλων ἀργυρίου
  english_pob_choice: fifteen thousand shekels of silver
  chosen_korean: 은 십오만 세겔
  alternatives_korean:
  - 은 1만5천 세겔
  - 은 15,000 세겔
  lexicon: LSJ
  rationale: σίκλοι/세겔은 고대 중량·화폐 단위이므로 보존하고, ἀργυρίου는 ‘은’으로 옮겨 재질을 분명히 했습니다.
- source_word: ἀπὸ τοῦ λόγου τοῦ βασιλέως
  english_pob_choice: from the king’s account
  chosen_korean: 왕의 수입에서
  alternatives_korean:
  - 왕의 계산에서
  - 왕의 회계에서
  - 왕의 재정에서
  lexicon: LSJ
  rationale: λόγος는 문맥상 단순한 ‘계산’보다 왕실 재정의 원천을 가리키는 말로 읽히므로, 한국어에서는 경제적 의미가 드러나는 ‘수입’으로 풀었습니다. 다만 ‘from the king’s account/revenues/treasury’ 사이의 해석 긴장은 유지됩니다.
- source_word: ἀπὸ τῶν τόπων τῶν ἀνηκόντων
  english_pob_choice: from the places that belong to him
  chosen_korean: 그에게 속한 지역들에서
  alternatives_korean:
  - 그에게 속한 곳들에서
  - 그의 소유인 지방들에서
  - 그에게 속한 장소들에서
  lexicon: LSJ
  rationale: τόποι는 단순한 ‘장소’보다 조세·수입의 근거가 되는 지역/지구를 뜻할 수 있어, 한국어에서는 행정적 뉘앙스를 살린 ‘지역들’이 가장 자연스럽습니다.
