base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/070.yaml
  text: And he sent to Jonathan the high priest[a], saying, “You alone are lifting yourself up against us, while I have become an object of ridicule and reproach because of you[c][b]; and why do you exercise authority over us in the mountains?”
  footnotes:
  - marker: a
    text: Or, “are lifting yourself up against us.” The Greek verb can suggest self-exaltation or aggressive rising against someone.
    reason: lexical_alternative
  - marker: b
    text: Or, “I have become a laughingstock and a reproach because of you.”
    reason: lexical_alternative
  - marker: c
    text: “In the mountains” may refer more broadly to the hill country rather than only high mountains.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그는 대제사장 요나단에게 전갈을 보내어 말했습니다. 「우리에게 맞서 스스로를 높이시는 이는 당신뿐입니다[a]. 저는 당신 때문에 조롱과 비난의 대상이 되었습니다[b]. 그런데 왜 산지에서 우리 위에 권세를 행사하십니까[c]?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘스스로를 높이시는 이’는 자신을 높인다는 뜻 외에, 우리에게 맞서 일어선다는 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘조롱과 비난의 대상’은 ‘웃음거리와 모욕거리’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘산지’는 높은 산들만이 아니라 구릉을 포함한 산악·언덕 지대를 가리킬 수도 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπέστειλεν πρὸς
  english_pob_choice: sent to
  chosen_korean: 사람을 보내며
  alternatives_korean:
  - 보내며
  - 전하며
  - 사자를 보내며
  lexicon: BDAG
  rationale: 문맥상 단순 전갈보다 사람/사자를 보내는 서술이 자연스러워, 파송의 의미를 드러내는 표현으로 옮겼습니다.
- source_word: τὸν ἀρχιερέα
  english_pob_choice: the high priest
  chosen_korean: 대제사장
  alternatives_korean:
  - 큰 제사장
  - 수제사장
  lexicon: BDAG
  rationale: Ἀρχιερεύς의 표준 성경 용례에 맞춰 ‘대제사장’으로 옮겼고, 관사를 별도로 드러내지 않았습니다.
- source_word: ἐπαίρῃ ἐφʼ ἡμᾶς
  english_pob_choice: are lifting yourself up against us
  chosen_korean: 우리를 향해 스스로 높아지고 있습니다
  alternatives_korean:
  - 우리를 향해 스스로 높이고 있습니다
  - 우리를 향해 교만해지고 있습니다
  - 우리를 거슬러 높아지고 있습니다
  lexicon: BDAG
  rationale: ἐπαίρω의 자기 고양/들어올림의 뉘앙스를 살리되, 공격적 대치 관계는 ‘우리를 향해’로 자연스럽게 표현했습니다.
- source_word: ἐγενήθην εἰς καταγέλωτα καὶ ὀνειδισμόν
  english_pob_choice: I have become an object of ridicule and reproach
  chosen_korean: 조롱거리와 수치가 되었습니다
  alternatives_korean:
  - 웃음거리와 수치가 되었습니다
  - 비웃음과 비난거리가 되었습니다
  - 조롱과 비난이 되었습니다
  lexicon: BDAG
  rationale: 두 명사구의 병렬을 한국어로 간결하게 살려, 공개적 망신과 부끄러움을 함께 드러냈습니다.
- source_word: ἐν τοῖς ὄρεσιν
  english_pob_choice: in the mountains
  chosen_korean: 산지에서
  alternatives_korean:
  - 산에서
  - 산들에서
  - 산악 지대에서
  lexicon: LSJ
  rationale: POb 각주처럼 여기서는 단순한 ‘높은 산’보다 ‘산지/산악 지대’의 넓은 지리적 의미가 더 적절하여, 한국어도 이를 반영했습니다.
theological_decisions:
- issue: 직설적 고발과 왕권/지배 어조의 보존
  chosen_reading: 후반부의 ἐξουσιάζῃ는 완화하지 않고 ‘지배하십니까’로 옮겨, 상대를 향한 공개적 권력 비난을 드러냈습니다.
  alternative_readings:
  - 다스리십니까
  - 권세를 부리십니까
  - 권위를 행사하십니까
  rationale: 이 절은 중립적 행정권이 아니라 대립적 지배 주장으로 들리므로, 독자가 긴장감을 그대로 읽도록 했습니다.
  doctrine_reference: 역사서의 서술적 긴장 보존
