  source_fidelity: 수정이 필요합니다. ἀπέστειλεν πρὸς는 ‘사람을 보내며’처럼 파송 대상이 사람임을 명시하지 않는 편이 안전합니다. ἐπαίρῃ ἐφʼ ἡμᾶς는 ‘우리를 향해’보다 적대적 방향을 드러내는 ‘우리에게 맞서’가 더 충실합니다. ὀνειδισμόν은 단순한 내적 ‘수치’보다 타인에게 받는 ‘비난/모욕’의 뜻이므로 이를 반영했습니다. ἐξουσιάζῃ는 ‘지배’보다 ‘권세를 행사하다’가 불필요한 억압의 뉘앙스를 더하지 않고 원문에 가깝습니다.
  naturalness: 합쇼체의 서술과 직접 인용을 유지했습니다. ‘전갈을 보냈습니다’는 한국어에서 자연스러우면서도 뒤따르는 λέγων의 전달 내용을 적절히 연결합니다. 각주 표지는 해당 표현 바로 뒤에 배치했습니다.
  terminology: ‘대제사장’은 ἀρχιερέα의 표준적인 성경 한국어 번역입니다. ‘조롱과 비난의 대상’은 καταγέλωτα καὶ ὀνειδισμόν의 병렬적 공개적 치욕을 자연스럽게 반영하며, ‘우리 위에 권세를 행사하십니까’는 ἐξουσιάζῃ ἐφʼ ἡμᾶς를 보존합니다.
