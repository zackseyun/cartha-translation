  yaml_path: translation/deuterocanon/1_maccabees/010/054.yaml
  text: and let us establish friendship with him[a]. And now, give me your daughter as a wife, and I will become related by marriage to you[b], and I will give gifts to you and to her worthy of you.
  footnotes:
  - marker: a
    text: Or 'let us make an alliance with him'; the Greek literally says 'friendship,' which in this royal context likely includes diplomatic alliance.
    reason: lexical_alternative
  - marker: b
    text: Or 'I will marry into your family.' The Greek verb refers to entering a kinship relationship by marriage.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그와 우호를 맺읍시다[a]. 이제 당신의 딸을 아내로 제게 주십시오. 그러면 제가 당신과 인척 관계를 맺고[b], 당신과 당신의 딸에게 당신께 걸맞은 선물을 드리겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그와 동맹을 맺읍시다.’ 그리스어는 문자적으로 ‘우호’를 말하지만, 이 왕실 문맥에서는 외교적 동맹을 포함할 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘제가 당신 집안으로 혼인해 들어가겠습니다.’ 그리스어 동사는 혼인을 통해 친족 관계에 들어감을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνστήσωμεν πρὸς αὐτὸν φιλίαν
  english_pob_choice: let us establish friendship with him
  chosen_korean: 그와 우호를 맺읍시다
  alternatives_korean:
  - 그와 동맹을 맺읍시다
  - 그와 친교를 맺읍시다
  lexicon: LSJ
  rationale: φιλία는 기본적으로 ‘우호/친분’을 뜻하지만, 이 왕실 외교 문맥에서는 실질적 동맹 제안을 포함하므로 한국어에서는 직역보다 자연스러운 ‘우호를 맺다’로 옮기되 각주로 외교적 뉘앙스를 보완했습니다.
- source_word: δός μοι τὴν θυγατέρα σου εἰς γυναῖκα
  english_pob_choice: give me your daughter as a wife
  chosen_korean: 당신의 딸을 아내로 내게 주십시오
  alternatives_korean:
  - 당신의 딸을 아내로 삼게 해주십시오
  - 당신의 딸을 저에게 혼인으로 주십시오
  lexicon: LSJ
  rationale: 그리스어 혼인 관용구의 거래적·왕조적 어조를 살리기 위해, 현대 한국어에서 명확한 ‘아내로 내게 주십시오’를 택했습니다.
- source_word: ἐπιγαμβρεύσω σοι
  english_pob_choice: I will become related by marriage to you
  chosen_korean: 내가 당신과 혼인으로 맺어지고
  alternatives_korean:
  - 내가 당신 집안과 사돈이 되고
  - 내가 당신과 혼인 관계를 맺고
  lexicon: LSJ
  rationale: 동사는 단순히 ‘결혼하다’가 아니라 사돈 관계를 맺는 뜻이므로, ‘혼인으로 맺어지고’로 혈연-혼인 결속을 드러냈습니다.
- source_word: δόματα καὶ αὐτῇ ἄξιά σου
  english_pob_choice: gifts to you and to her worthy of you
  chosen_korean: 당신에게와 당신 딸에게 당신에 걸맞은 선물을 드리겠습니다
  alternatives_korean:
  - 당신과 당신 딸에게 당신에게 합당한 선물을 드리겠습니다
  - 당신과 그녀에게 당신의 품위에 맞는 선물을 드리겠습니다
  lexicon: LSJ
  rationale: δόματα는 일반적인 ‘선물’이고 ἄξιά σου는 ‘당신에게 걸맞은/합당한’의 뜻이므로, 두 대상을 함께 살리되 ‘당신에 걸맞은’으로 기준을 분명히 했습니다.
theological_decisions:
- issue: 왕실 외교에서의 φιλία의 의미
  chosen_reading: 본문의 ‘우호’는 단순한 개인적 친분이 아니라 외교적 결속을 포함하는 제안으로 읽었습니다.
  alternative_readings:
  - ‘동맹’으로 직접 옮기기
  - ‘친교’로 완화해 옮기기
  rationale: 그리스어 표면 의미는 ‘우호’이지만, 문맥상 정치적 결합이 전제되므로 본문에는 중립적인 우호를 두고 각주에서 동맹 가능성을 밝혔습니다.
  doctrine_reference: 역사-문맥적 번역 원칙
