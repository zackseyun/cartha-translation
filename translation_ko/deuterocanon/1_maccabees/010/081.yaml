translation:
  language: ko
  text: 그런데 백성은 요나단이 명령한 대로 그대로 서 있었고, 그들의 말들은 지쳐 버렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 단순히 ‘그들의 말들’이라고 말할 뿐이므로, 문맥상 상대편의 말로 이해될 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ λαός
  english_pob_choice: But the people
  chosen_korean: 그런데 백성은
  alternatives_korean:
  - 그리고 백성은
  - 또 백성은
  lexicon: LSJ
  rationale: δέ의 서사 진행과 약한 대비를 살려 ‘그런데’로 옮겼고, λαός는 여기서 집합적 ‘백성’이 자연스럽습니다.
- source_word: ἱστήκει
  english_pob_choice: stood
  chosen_korean: 그대로 서 있었고
  alternatives_korean:
  - 서 있었고
  - 그 자리에 서 있었고
  - 멈춰 서 있었고
  lexicon: LSJ
  rationale: 단순한 정적 상태보다 ‘명령대로 자리를 지킴’의 뉘앙스를 드러내기 위해 ‘그대로 서 있었고’로 풀었습니다.
- source_word: καθὼς ἐπέταξεν Ἰωναθάν
  english_pob_choice: as Jonathan had commanded
  chosen_korean: 요나단이 명령한 대로
  alternatives_korean:
  - 요나단이 명령한 것처럼
  - 요나단이 지시한 대로
  lexicon: LSJ
  rationale: ἐπιτάσσω의 ‘명령하다’는 의미를 직접 반영했고, καθὼς는 관용적으로 ‘-한 대로’로 옮겼습니다.
- source_word: οἱ ἵπποι αὐτῶν
  english_pob_choice: their horses
  chosen_korean: 그들의 말들은
  alternatives_korean:
  - 그들의 말이
  - 그들의 군마는
  lexicon: LSJ
  rationale: 원문은 소유대명사만 제시하므로 ‘그들의 말들’로 직역성을 유지했고, 문맥상 어느 편의 말인지는 단정하지 않았습니다.
theological_decisions:
- issue: 원문의 ‘their horses’가 누구의 말인지 불분명함
  chosen_reading: 문맥상으로는 대개 상대편 기병의 말로 이해되지만, 본문 번역은 원문의 모호성을 유지해 ‘그들의 말들’로 남겼습니다.
  alternative_readings:
  - 상대편의 말들은
  - 적군의 말들은
  rationale: 영어 POB도 문맥상 상대편일 가능성을 주석으로 처리했듯이, 본문은 그 불확실성을 보존하는 것이 원문 충실에 더 적합합니다.
  doctrine_reference: source transparency / textual caution
