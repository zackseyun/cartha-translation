translation:
  language: ko
  text: 그리고 데메트리오스는 코엘레-시리아를 맡고 있던 아폴로니오스를 임명하였으며, 그가 큰 군세를 모아 얌니아에 진을 쳤습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέστησεν
  english_pob_choice: appointed
  chosen_korean: 임명하였으며
  alternatives_korean:
  - 세웠으며
  - 배치하였으며
  lexicon: BDAG
  rationale: 행정적·군정적 맥락에서 어떤 사람을 직무에 세우는 뜻이므로, 한국어에서는 공식성을 살린 ‘임명하다’가 가장 자연스럽고 원문 의미도 잘 드러냅니다.
- source_word: τὸν ὄντα ἐπὶ Κοίλης Συρίας
  english_pob_choice: who was over Coele-Syria
  chosen_korean: 코엘레-시리아를 맡고 있던
  alternatives_korean:
  - 코엘레-시리아를 다스리던
  - 코엘레-시리아 위에 있던
  lexicon: BDAG
  rationale: ἐπί의 통치·관할 의미를 살려 단순한 위치가 아니라 관할 책임을 나타내는 ‘맡고 있던’으로 옮겼습니다. 지역명은 학술적 전사인 ‘코엘레-시리아’를 유지했습니다.
- source_word: συνήγαγεν δύναμιν μεγάλην
  english_pob_choice: gathered a great force
  chosen_korean: 큰 군세를 모아
  alternatives_korean:
  - 큰 군대를 모아
  - 대군을 모아
  lexicon: LSJ
  rationale: δύναμις는 단순한 ‘군대’보다 폭넓게 ‘군세/군사력’까지 포함할 수 있어, 전투 맥락을 유지하면서도 의미 범위를 좁히지 않는 ‘군세’를 택했습니다.
- source_word: παρενέβαλεν
  english_pob_choice: encamped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 야영했습니다
  - 주둔했습니다
  lexicon: BDAG
  rationale: 군사적 숙영·진주를 뜻하는 동사이므로, 현대 한국어에서 가장 자연스러운 군사 표현인 ‘진을 치다’를 사용했습니다.
