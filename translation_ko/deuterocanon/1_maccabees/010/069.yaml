  terminology: ‘임명하다’는 관직·직무에 세운다는 뜻을 적절히 전달하며, ‘군세’는 δύναμις의 넓은 군사적 의미를 보존합니다. ‘코엘레-시리아’와 ‘얌니아’의 음역도 일관되고 적절합니다.
