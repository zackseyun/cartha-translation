  text: And for the rebuilding and the renovation of the works of the sanctuary[b][a], the expense will be given by order of the king.
  footnotes:
  - marker: a
    text: Or “from the king’s order.” The Greek phrase can be read administratively either as a fiscal account/register or as the king’s directive; the financial context here favors “account.”
    reason: lexical_alternative
  - marker: b
    text: “The sanctuary” renders Greek “the holy things/holy places,” referring here to the sacred temple complex.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 성전의 재건과 새 단장에 필요한 비용은 왕의 계정에서 지급될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “왕의 명령으로.” 그리스어 표현은 행정적 맥락에서 재정 장부나 왕의 지시를 가리킬 수 있으나, 여기서는 비용 지급의 출처라는 점에서 ‘계정’의 의미가 더 잘 맞습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘성전’은 그리스어 “거룩한 것들/거룩한 장소들”을 옮긴 것으로, 여기서는 성전 परिसर을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδομηθῆναι
  english_pob_choice: the rebuilding
  chosen_korean: 재건
  alternatives_korean:
  - 건축
  - 짓는 일
  lexicon: LSJ
  rationale: 성전 복구 문맥에서 단순한 ‘건축’보다 기존 상태를 다시 세우는 의미를 분명히 드러내기 위해 ‘재건’을 택했습니다.
- source_word: ἐπικαινισθῆναι
  english_pob_choice: the renovation
  chosen_korean: 새 단장
  alternatives_korean:
  - 갱신
  - 새롭게 함
  - 수리
  lexicon: LSJ
  rationale: 단순한 의식적 ‘봉헌’보다 실제 복구·갱신의 뉘앙스를 살리면서 현대 한국어로 자연스럽게 전달하기 위해 ‘새 단장’으로 옮겼습니다.
- source_word: τὰ ἔργα τῶν ἁγίων
  english_pob_choice: the works of the sanctuary
  chosen_korean: 성전의 일
  alternatives_korean:
  - 성소의 일들
  - 거룩한 곳의 일
  - 성전의 공사
  lexicon: LSJ
  rationale: ἅγια를 성전/성소 맥락으로 이해하되, ‘works’의 넓은 범위를 유지하기 위해 과도하게 특정한 ‘공사’보다 중립적인 ‘성전의 일’로 처리했습니다.
- source_word: ἐκ τοῦ λόγου τοῦ βασιλέως
  english_pob_choice: from the king’s account / by order of the king
  chosen_korean: 왕의 계정에서
  alternatives_korean:
  - 왕의 명령으로
  - 왕의 재정에서
  - 왕의 회계 장부에서
  lexicon: LSJ
  rationale: λόγος는 행정·재정 맥락에서 ‘계정/장부’로도 읽힐 수 있어, POB의 핵심 판단인 재정적 출처를 살리기 위해 ‘왕의 계정에서’로 옮겼습니다.
theological_decisions:
- issue: 성전 관련 표현의 범위
  chosen_reading: ‘성전의 일’로 옮겨 ἅγια의 성소적 의미를 유지하면서도 독자가 성전 복구 사업으로 이해하도록 했습니다.
  alternative_readings:
  - ‘거룩한 것들’
  - ‘성소들’
  rationale: 이 구절은 예배 대상의 ‘거룩한 것들’보다 예루살렘 성전 복구 문맥이 분명하므로, 문맥에 맞는 성전적 의미를 살리는 번역이 더 적절합니다.
  doctrine_reference: 성전/성소 문맥 해석
- issue: 왕의 λόγος 해석
  chosen_reading: 재정 출처를 나타내는 행정적 표현으로 읽었습니다.
  alternative_readings:
  - 왕의 명령에 따라
  - 왕의 말씀으로
  rationale: 영어 POB의 주석처럼 이 구절은 행정적 회계 표현으로도 읽을 수 있으며, 여기서는 비용 지급의 출처를 말하므로 재정적 읽음이 더 자연스럽습니다.
  doctrine_reference: 문맥 기반 행정 용례
