  lexicon: LSJ
  rationale: ἅγια를 성전/성소 맥락으로 이해하되, ‘works’의 넓은 범위를 유지하기 위해 과도하게 특정한 ‘공사’보다 중립적인 ‘성전의 일’로 처리했습니다.
- source_word: ἐκ τοῦ λόγου τοῦ βασιλέως
  english_pob_choice: from the king’s account / by order of the king
  chosen_korean: 왕의 계정에서
  alternatives_korean:
  - 왕의 명령으로
  - 왕의 재정에서
  - 왕의 회계 장부에서
  lexicon: LSJ
  rationale: λόγος는 행정·재정 맥락에서 ‘계정/장부’로도 읽힐 수 있어, POB의 핵심 판단인 재정적 출처를 살리기 위해 ‘왕의 계정에서’로 옮겼습니다.
theological_decisions:
- issue: 성전 관련 표현의 범위
  chosen_reading: ‘성전의 일’로 옮겨 ἅγια의 성소적 의미를 유지하면서도 독자가 성전 복구 사업으로 이해하도록 했습니다.
  alternative_readings:
  - ‘거룩한 것들’
  - ‘성소들’
  rationale: 이 구절은 예배 대상의 ‘거룩한 것들’보다 예루살렘 성전 복구 문맥이 분명하므로, 문맥에 맞는 성전적 의미를 살리는 번역이 더 적절합니다.
  doctrine_reference: 성전/성소 문맥 해석
- issue: 왕의 λόγος 해석
  chosen_reading: 재정 출처를 나타내는 행정적 표현으로 읽었습니다.
  alternative_readings:
  - 왕의 명령에 따라
  - 왕의 말씀으로
  rationale: 영어 POB의 주석처럼 이 구절은 행정적 회계 표현으로도 읽을 수 있으며, 여기서는 비용 지급의 출처를 말하므로 재정적 읽음이 더 자연스럽습니다.
  doctrine_reference: 문맥 기반 행정 용례
