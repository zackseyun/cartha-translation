base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/003.yaml
  text: And Demetrius sent letters to Jonathan with peaceful words[b][a], so as to honor him.
  footnotes:
  - marker: a
    text: Or 'with words of peace.' The Greek phrase λόγοις εἰρηνικοῖς can be rendered more literally this way.
    reason: lexical_alternative
  - marker: b
    text: Literally 'to make him great.' The sense here is to honor or elevate Jonathan.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 데메트리우스는 요나단에게 평화로운 말로 서한들을 보내어 그를 높이려 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘평화의 말로’입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그를 크게 하려고’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  english_pob_choice: sent
  chosen_korean: 보내어
  alternatives_korean:
  - 보냈습니다
  - 파견하였습니다
  lexicon: LSJ
  rationale: 편지의 발송 맥락이므로, 자연스러운 서술형으로 ‘보내어’라고 옮겨 동사의 연속성을 살렸습니다.
- source_word: ἐπιστολὰς
  english_pob_choice: letters
  chosen_korean: 서한들을
  alternatives_korean:
  - 편지들을
  - 서신들을
  lexicon: LSJ
  rationale: 복수형을 반영해 여러 통의 공식 서신임을 드러내기 위해 ‘서한들’을 택했습니다.
- source_word: λόγοις εἰρηνικοῖς
  english_pob_choice: with peaceful words
  chosen_korean: 평화로운 말로
  alternatives_korean:
  - 평화의 말로
  - 화평한 말로
  - 평화로운 언사로
  lexicon: LSJ
  rationale: 직역에 가까운 구조를 유지하면서도 한국어에서 자연스럽게 서한의 어조를 나타내는 표현으로 옮겼습니다.
- source_word: μεγαλῦναι
  english_pob_choice: honor
  chosen_korean: 그를 높이려
  alternatives_korean:
  - 그를 영화롭게 하려
  - 그를 크게 하려
  - 그를 존중하려
  lexicon: LSJ
  rationale: 직역하면 ‘크게 하다’이지만, 여기서는 정치적·사회적으로 지위를 올려 주려는 뜻이므로 ‘높이다’가 가장 근접합니다.
theological_decisions:
- issue: ὥστε μεγαλεῖν αὐτόν의 목적성
  chosen_reading: 데메트리우스가 요나단을 실제로 높여 주려는 의도를 나타내는 목적절로 옮겼습니다.
  alternative_readings:
  - 그 결과 그를 높이게 되었습니다
  - 그를 크게 만들었습니다
  rationale: ὥστε가 여기서는 결과보다 의도를 나타내는 문맥이므로, 목적 의미를 살려 ‘~하려’로 처리했습니다.
  doctrine_reference: 서사 문맥의 목적/의도 해석
