  text: And now you will not be able to withstand the cavalry and so great a force in the plain[a], where there is neither stone nor pebble nor a place to flee.
  footnotes:
  - marker: a
    text: Greek 'the horse' uses a collective singular, meaning the cavalry or mounted troops.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제는 평지에서 그처럼 큰 기병과 군대를 맞서 버티지 못할 것입니다. 그곳에는 돌도, 조약돌도, 도망할 곳도 없기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘기병’은 직역상 ‘말’의 집합적 단수인 τὴν ἵππον을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ δυνήσῃ ὑποστῆναι
  english_pob_choice: you will not be able to withstand
  chosen_korean: 버티지 못할 것입니다
  alternatives_korean:
  - 대항하지 못할 것입니다
  - 견디지 못할 것입니다
  - 맞서지 못할 것입니다
  lexicon: BDAG
  rationale: 군사적 대치 상황에서 ‘버티다’는 압박과 공격을 견디며 맞서는 뜻을 자연스럽게 살리면서도, 지나치게 문어적이지 않게 합니다.
- source_word: τὴν ἵππον
  english_pob_choice: the cavalry
  chosen_korean: 기병
  alternatives_korean:
  - 말 탄 군대
  - 기마병
  - 마병
  lexicon: LSJ
  rationale: 그리스어 단수 집합명사는 실제로 기병대를 가리키므로, 한국어에서도 군사 집단을 분명히 드러내는 ‘기병’이 가장 적절합니다.
- source_word: δύναμιν τοσαύτην
  english_pob_choice: so great a force
  chosen_korean: 그처럼 큰 군대
  alternatives_korean:
  - 그토록 큰 병력
  - 그처럼 거대한 전력
  - 그처럼 큰 힘
  lexicon: BDAG
  rationale: 여기서 δύναμις는 추상적 ‘힘’이 아니라 전투력·병력을 뜻하므로, 문맥상 ‘군대’로 풀어 자연스럽게 옮겼습니다.
- source_word: ἐν τῷ πεδίῳ
  english_pob_choice: in the plain
  chosen_korean: 평지에서
  alternatives_korean:
  - 들판에서
  - 평원에서
  - 넓은 들판에서
  lexicon: LSJ
  rationale: πέδιον은 지형적 대비를 이루는 ‘평지’가 적합하며, 뒤의 ‘피할 곳 없음’과도 잘 연결됩니다.
- source_word: λίθος … κόχλας
  english_pob_choice: neither stone nor pebble
  chosen_korean: 돌도, 조약돌도
  alternatives_korean:
  - 바위도, 작은 돌도
  - 돌멩이도, 자갈도
  - 돌도, 작은 돌도
  lexicon: LSJ
  rationale: λίθος와 κόχλας의 크기 대비를 살리기 위해 일반적 ‘돌’과 더 작은 ‘조약돌’을 구분했습니다.
