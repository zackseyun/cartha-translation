  source_fidelity: 첫 절의 사역 동사 ἐκάθισεν은 대체로 잘 반영되었습니다. 그러나 ‘어떤 말로도’는 περὶ παντὸς λόγου(모든 사안·이유·문제에 관하여)를 ‘말’이라는 수단으로 좁혀 원문의 범위를 바꿉니다. 또한 ἐντυγχάνειν κατὰ τούτου는 법적·행정적 맥락의 제기나 청원을 뜻할 수 있으므로, ‘그에게 반대하여 호소하다’보다 ‘그를 상대로 호소하다’가 더 자연스럽고 원문의 대상을 분명히 합니다.
  naturalness: ‘아무도 … 못한다고 선포하고’는 왕이 관리들에게 내리는 명령으로는 다소 간접적입니다. ‘… 못하게 선포하고’가 한국어의 공식 명령문으로 더 자연스럽습니다. ‘왕은 그를 자기와 함께 앉게 하고’는 μετʼ αὑτοῦ를 무리 없이 보존합니다.
  terminology: ‘관리들’, ‘선포하다’, ‘괴롭히다’는 궁정 및 공적 명령의 문맥에 적절합니다. 마지막 λόγος는 ‘말’이 아니라 ‘이유’ 또는 ‘사안’으로 옮겨야 합니다. ἐντυγχάνειν의 구체적 법률 용어를 확정하지 않고 ‘호소하다’로 두며 각주에서 가능성을 설명하는 것이 안전합니다.
