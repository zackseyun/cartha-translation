  yaml_path: translation/deuterocanon/1_maccabees/010/063.yaml
  text: And the king seated him with himself[a], and said to his officials, “Go out with him into the middle of the city, and proclaim that no one is to bring a complaint against him about any matter, and let no one trouble him for any reason.”
  footnotes:
  - marker: a
    text: Or 'that no one should petition against him concerning any matter.' The Greek verb can denote making an approach or petition, here likely in an official or legal sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 왕은 그를 자기와 함께 앉게 하고 자기 관리들에게 말했습니다. 「그와 함께 성읍 한가운데로 나가서, 아무도 어떤 일에 관해서도 그를 상대로 호소하지 못하게 선포하고, 아무도 어떤 이유로든 그를 괴롭히지 못하게 하십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그를 상대로 호소하다’로 옮긴 그리스어는 단순한 만남보다 법적·행정적 청원, 이의 제기 또는 고발을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάθισεν αὐτὸν ὁ βασιλεὺς μετʼ αὑτοῦ
  english_pob_choice: the king seated him with himself
  chosen_korean: 왕은 그를 자기 곁에 앉히고
  alternatives_korean:
  - 왕은 그를 자기와 함께 앉게 하고
  - 왕은 그를 자기 옆자리에 앉히고
  lexicon: LSJ
  rationale: καθίζω의 사역적 의미를 살려 ‘앉히고’로 옮기되, 왕의 곁이라는 존대와 배석의 뉘앙스를 자연스럽게 드러냈습니다.
- source_word: τοῖς ἄρχουσιν
  english_pob_choice: his officials
  chosen_korean: 자기 관리들에게
  alternatives_korean:
  - 자기 통치자들에게
  - 자기 대신들에게
  - 자기 신하들에게
  lexicon: LSJ
  rationale: 궁정 맥락의 ἄρχοντες는 지배자 일반보다 왕의 실무 책임자들이므로, 현대 한국어에서 가장 자연스러운 ‘관리들’로 옮겼습니다.
- source_word: κηρύξατε
  english_pob_choice: proclaim
  chosen_korean: 선포하고
  alternatives_korean:
  - 공포하고
  - 알리고
  lexicon: LSJ
  rationale: 공적이고 공식적인 고지 행위를 나타내므로 ‘선포하다’가 가장 가깝습니다.
- source_word: τοῦ μηδένα ἐντυγχάνειν κατὰ τούτου περὶ μηδενὸς πράγματος
  english_pob_choice: that no one is to bring a complaint against him about any matter
  chosen_korean: 아무도 어떤 일에 대해서도 그에게 반대하여 호소하지 못한다고
  alternatives_korean:
  - 아무도 어떤 일에 대해서도 그에게 고소하지 못한다고
  - 아무도 어떤 일에 대해서도 그를 상대로 청원하지 못한다고
  lexicon: LSJ
  rationale: ἐντυγχάνειν은 문맥상 법적·행정적 제기나 청원을 뜻할 수 있어, 영어 POB의 해설을 따라 ‘반대하여 호소하다’로 옮겨 공식적 항의/청원 금지를 드러냈습니다.
- source_word: μηδεὶς αὐτῷ ἐνοχλείτω περὶ παντὸς λόγου
  english_pob_choice: let no one trouble him for any reason
  chosen_korean: 아무도 어떤 말로도 그를 괴롭히지 못하게 하십시오
  alternatives_korean:
  - 아무도 어떤 이유로도 그를 괴롭히지 못하게 하십시오
  - 아무도 어떤 일로도 그를 방해하지 못하게 하십시오
  lexicon: LSJ
  rationale: ἐνοχλέω의 ‘괴롭히다/방해하다’ 뜻을 살리면서, 뒤의 περὶ παντὸς λόγου를 포괄적으로 받아 한국어에서는 상황상 자연스러운 ‘어떤 말로도’로 표현했습니다.
