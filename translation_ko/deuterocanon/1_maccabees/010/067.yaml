  text: And in the one hundred sixty-fifth year[a], Demetrius the son of Demetrius came from Crete into the land of his fathers.
  footnotes:
  - marker: a
    text: Literally, 'into the land of his fathers,' an idiom for his ancestral land.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 백육십오년[a]에 데메트리오스, 데메트리오스의 아들이 크레테에서 자기 조상들의 땅으로 왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 조상들의 땅으로’라는 뜻이며, 여기서는 그의 조상 대대로 내려오는 땅을 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἔτει πέμπτῳ καὶ ἑξηκοστῷ καὶ ἑκατοστῷ
  english_pob_choice: in the one hundred sixty-fifth year
  chosen_korean: 백육십오년
  alternatives_korean:
  - 백육십오 년에
  - 일백육십오년에
  lexicon: LSJ
  rationale: 그리스어의 누적 수사를 한국어 연대 표기 관용에 맞게 간결하게 옮겼습니다. 문맥상 특정 연호를 가리키므로 ‘년에’를 붙여 시간 부사를 살렸습니다.
- source_word: Δημήτριος ὁ υἱὸς Δημητρίου
  english_pob_choice: Demetrius the son of Demetrius
  chosen_korean: 데메트리오스, 데메트리오스의 아들
  alternatives_korean:
  - 데메트리오스, 데메트리오스의 아들인
  - 데메트리오스, 데메트리오스의 아들 데메트리오스
  lexicon: 고유명사 음역
  rationale: 인명은 현대 음역을 따랐고, άρθρο + 동격 구조를 한국어에서 자연스럽게 풀어 ‘데메트리오스의 아들’로 옮겼습니다.
- source_word: ἐκ Κρήτης
  english_pob_choice: from Crete
  chosen_korean: 크레테에서
  alternatives_korean:
  - 크레테로부터
  - 크레타에서
  lexicon: LSJ
  rationale: ἐκ의 출처 의미를 살려 ‘-에서’로 옮겼고, 고유명사는 음역 일관성을 위해 크레테를 택했습니다.
- source_word: εἰς τὴν γῆν τῶν πατέρων αὐτοῦ
  english_pob_choice: into the land of his fathers
  chosen_korean: 자기 조상들의 땅으로
  alternatives_korean:
  - 그의 조상들의 땅으로
  - 그의 조상 땅으로
  - 자기 조상의 땅으로
  lexicon: LSJ
  rationale: 직역하면 ‘그의 아버지들의 땅’이지만, POB의 주석처럼 관용적으로 ‘조상들의 땅’으로 이해해야 하므로 이를 반영했습니다. ‘으로’는 εἰς의 방향성을 살립니다.
