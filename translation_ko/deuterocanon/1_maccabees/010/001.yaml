  lexicon: LSJ
  rationale: 도시를 무력으로 장악했다는 정치·군사적 의미를 분명히 드러내면서도, 한국어 역사문체에서 과도하게 해석적이지 않게 했습니다.
- source_word: ἐπεδέξαντο αὐτόν
  english_pob_choice: they received him
  chosen_korean: 사람들이 그를 받아들였으며
  alternatives_korean:
  - 그를 맞이하였으며
  - 그를 받아 주었으며
  lexicon: LSJ
  rationale: 단순한 환영이 아니라 정치적 수용까지 열어 두는 표현으로, 그리스어의 ‘받아들이다/받아들여 주다’ 의미 범위를 보존했습니다.
- source_word: ἐβασίλευσεν ἐκεῖ
  english_pob_choice: he reigned there / he became king there
  chosen_korean: 그는 그곳에서 왕이 되었습니다
  alternatives_korean:
  - 그는 그곳에서 다스렸습니다
  - 그는 그곳에서 통치하였습니다
  lexicon: LSJ
  rationale: 이 동사는 문맥상 즉위·왕권 획득의 뜻으로 읽을 수 있어, POB의 대안독법을 반영해 ‘왕이 되었습니다’로 옮겼습니다.
theological_decisions:
- issue: 연대기·정치사 서술에서의 왕권 표현
  chosen_reading: ἐβασίλευσεν ἐκεῖ를 ‘그곳에서 왕이 되었습니다’로 옮겨 즉위/왕권 획득의 가능성을 살렸습니다.
  alternative_readings:
  - 그는 그곳에서 다스렸습니다
  - 그는 그곳에서 통치하였습니다
  rationale: 본문은 단순한 지속적 통치보다 왕위의 성립을 강조할 수 있으므로, POB의 대안 주석을 따라 문맥상 더 적합한 독법을 본문에 반영했습니다.
  doctrine_reference: 역사서 본문의 문맥적/서술적 독법
- issue: ἐπεδέξαντο αὐτόν의 정치적 수용 의미
  chosen_reading: ‘사람들이 그를 받아들였으며’로 번역해 환영과 정치적 승인 둘 다 가능하게 했습니다.
  alternative_readings:
  - 사람들이 그를 맞이하였으며
  - 사람들이 그를 환영하였으며
  rationale: 원어는 단순한 감정적 환영만이 아니라 수용·승인의 뉘앙스를 가질 수 있어, 의미를 좁히지 않는 표현을 택했습니다.
  doctrine_reference: 역사 서술의 어휘적 개방성
