base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/001.yaml
  text: And in the one hundred sixtieth year[a], Alexander, the son of Antiochus Epiphanes, came up and took Ptolemais, and they received him[c][b], and he reigned there.
  footnotes:
  - marker: a
    text: Or 'went up' for 'came up'; the Greek preserves the conventional directional idiom often used for military movement.
    reason: lexical_alternative
  - marker: b
    text: Or 'captured Ptolemais' for 'seized Ptolemais.'
    reason: lexical_alternative
  - marker: c
    text: Or 'he reigned there'; the Greek verb may be understood either as accession ('became king') or as the exercise of kingship ('reigned').
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 백육십 년에 알렉산드로스—안티오코스 에피파네스의 아들—가 올라와서 프톨레마이스를 점령하였고, 사람들이 그를 받아들였으며, 그는 그곳에서 왕이 되었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “올라와서”로도 옮길 수 있습니다. 그리스어는 군사 이동에 흔히 쓰이는 관용적 방향 표현을 보존합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “점령하였고”보다 중립적으로 “차지하였고”로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “그는 그곳에서 다스렸습니다.” 그리스어 동사는 여기서 즉위(‘왕이 됨’) 또는 왕권 행사(‘통치함’)로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ἔτει ἑξηκοστῷ καὶ ἑκατοστῷ
  english_pob_choice: in the one hundred sixtieth year
  chosen_korean: 백육십 년에
  alternatives_korean:
  - 백육십 년째에
  - 일백육십 년에
  lexicon: LSJ
  rationale: 그리스어 연대 표현을 자연스러운 한국어 연대기 형식으로 옮기되, 연대의 기준점을 유지했습니다.
- source_word: ἀνέβη
  english_pob_choice: came up
  chosen_korean: 올라와서
  alternatives_korean:
  - 올라갔고
  - 진격하여
  lexicon: LSJ
  rationale: ἀναβαίνω의 관용적 방향 표현을 살리면서, 군사적 전개를 암시하는 역사 서술의 흐름에 맞게 자연스럽게 옮겼습니다.
- source_word: κατελάβετο
  english_pob_choice: took / seized
  chosen_korean: 점령하였고
  alternatives_korean:
  - 차지하였고
  - 붙잡았고
  lexicon: LSJ
  rationale: 도시를 무력으로 장악했다는 정치·군사적 의미를 분명히 드러내면서도, 한국어 역사문체에서 과도하게 해석적이지 않게 했습니다.
- source_word: ἐπεδέξαντο αὐτόν
  english_pob_choice: they received him
  chosen_korean: 사람들이 그를 받아들였으며
  alternatives_korean:
  - 그를 맞이하였으며
  - 그를 받아 주었으며
  lexicon: LSJ
  rationale: 단순한 환영이 아니라 정치적 수용까지 열어 두는 표현으로, 그리스어의 ‘받아들이다/받아들여 주다’ 의미 범위를 보존했습니다.
- source_word: ἐβασίλευσεν ἐκεῖ
  english_pob_choice: he reigned there / he became king there
  chosen_korean: 그는 그곳에서 왕이 되었습니다
  alternatives_korean:
  - 그는 그곳에서 다스렸습니다
  - 그는 그곳에서 통치하였습니다
  lexicon: LSJ
  rationale: 이 동사는 문맥상 즉위·왕권 획득의 뜻으로 읽을 수 있어, POB의 대안독법을 반영해 ‘왕이 되었습니다’로 옮겼습니다.
theological_decisions:
- issue: 연대기·정치사 서술에서의 왕권 표현
  chosen_reading: ἐβασίλευσεν ἐκεῖ를 ‘그곳에서 왕이 되었습니다’로 옮겨 즉위/왕권 획득의 가능성을 살렸습니다.
  alternative_readings:
  - 그는 그곳에서 다스렸습니다
  - 그는 그곳에서 통치하였습니다
  rationale: 본문은 단순한 지속적 통치보다 왕위의 성립을 강조할 수 있으므로, POB의 대안 주석을 따라 문맥상 더 적합한 독법을 본문에 반영했습니다.
  doctrine_reference: 역사서 본문의 문맥적/서술적 독법
- issue: ἐπεδέξαντο αὐτόν의 정치적 수용 의미
  chosen_reading: ‘사람들이 그를 받아들였으며’로 번역해 환영과 정치적 승인 둘 다 가능하게 했습니다.
  alternative_readings:
  - 사람들이 그를 맞이하였으며
  - 사람들이 그를 환영하였으며
  rationale: 원어는 단순한 감정적 환영만이 아니라 수용·승인의 뉘앙스를 가질 수 있어, 의미를 좁히지 않는 표현을 택했습니다.
  doctrine_reference: 역사 서술의 어휘적 개방성
