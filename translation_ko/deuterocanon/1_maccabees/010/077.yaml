  to: 아폴로니오스는 이 소식을 듣고 기병 삼천 명[a]과 큰 병력을 거느리고 진을 쳤습니다. 그는 아스돗으로 가되, 그저 지나가는 듯이 하였고[b], 동시에 평지로 전진했습니다. 이는 그가 많은 기병을 거느리고 그 기병을 의지했기 때문입니다.
