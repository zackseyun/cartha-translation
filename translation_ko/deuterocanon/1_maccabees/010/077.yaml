base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/077.yaml
  text: And Apollonius heard[a], and he encamped with three thousand cavalry and a large force, and went to Azotus as though passing through, and at the same time advanced into the plain[b], because he had a multitude of cavalry and trusted in it.
  footnotes:
  - marker: a
    text: Or 'as if merely passing by.' The Greek suggests that Apollonius presented his movement as a transit rather than an overt attack.
    reason: lexical_alternative
  - marker: b
    text: The Greek uses 'horse' collectively for mounted troops; hence 'cavalry.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 아폴로니오스가 듣고, 삼천의 기병과 많은 군대를 거느리고 진을 쳤으며, 아조돗으로 지나가는 것처럼 가다가, 동시에 평지로 나아갔습니다. 이는 그가 많은 기병을 거느리고 그것을 의지했기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그저 지나가는 것처럼’. 그리스어는 아폴로니오스가 실제 공격이 아니라 통과하는 듯이 움직이는 인상을 주었음을 시사합니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어의 ‘말’은 집합적으로 기병을 가리키므로, 한국어에서는 ‘기병’으로 옮겼습니다.
    reason: cultural_note
lexical_decisions:
- source_word: παρενέβαλεν
  english_pob_choice: encamped
  chosen_korean: 진을 쳤으며
  alternatives_korean:
  - 캠프를 쳤으며
  - 야영했으며
  - 진을 설치했으며
  lexicon: LSJ
  rationale: 군사 서술에서 παρενέβαλεν은 단순 이동보다 ‘진을 치다’가 자연스럽고, 다음에 이어지는 병력 묘사와도 잘 맞습니다.
- source_word: τρισχιλίαν ἵππον
  english_pob_choice: three thousand cavalry
  chosen_korean: 삼천의 기병
  alternatives_korean:
  - 삼천의 말
  - 삼천의 마병
  - 삼천의 기마병
  lexicon: LSJ
  rationale: ἵππος가 집합적으로 기병을 뜻하므로, 한국어에서는 현대적이고 정확한 ‘기병’이 가장 자연스럽습니다.
- source_word: ὡς διοδεύων
  english_pob_choice: as though passing through
  chosen_korean: 지나가는 것처럼
  alternatives_korean:
  - 그저 지나가는 듯이
  - 통과하는 것처럼
  - 그냥 지나가듯
  lexicon: LSJ
  rationale: 겉으로는 단순 통과인 것처럼 보이게 했다는 뉘앙스를 살리되, 과도하게 해석하지 않도록 했습니다.
- source_word: πλῆθος ἵππου
  english_pob_choice: a multitude of cavalry
  chosen_korean: 많은 기병
  alternatives_korean:
  - 기병의 큰 무리
  - 기병의 다수
  - 기병이 많음
  lexicon: LSJ
  rationale: πλῆθος의 ‘많음’과 ἵππου의 집합적 의미를 함께 살리면서도 한국어 문장 흐름을 해치지 않도록 했습니다.
theological_decisions:
- issue: 전쟁 서술에서 동사의 배열과 의도 표현을 어떻게 살릴지
  chosen_reading: ‘진을 쳤으며 … 지나가는 것처럼 가다가 … 평지로 나아갔습니다’로, 겉모습과 실제 전술 의도를 함께 드러냈습니다.
  alternative_readings:
  - ‘진을 치고 … 지나가듯 … 평지로 갔습니다’
  - ‘캠프를 설치하고 … 통과하는 척 … 평지로 진격했습니다’
  rationale: 이 절은 기만적 이동과 전술적 진입을 함께 보여 주므로, 원문의 병렬 구조와 의도적 위장성을 유지하는 것이 중요합니다.
  doctrine_reference: 역사 서술의 문맥 보존
