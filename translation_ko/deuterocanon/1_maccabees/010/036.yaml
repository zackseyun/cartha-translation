  text: And let up to thirty thousand men from the Jews be enrolled in the king’s forces[a], and provisions shall be given to them, as is fitting for all the king’s forces.
  footnotes:
  - marker: a
    text: Or 'rations,' 'maintenance,' or more literally 'hospitality'; the Greek ξενιά here denotes the support supplied to troops.
    reason: lexical_alternative
translation:
  language: ko
  text: 유대인 가운데서 최대 삼만 명을 왕의 군대에 등록시키고, 그들에게는 왕의 모든 군대에 마땅히 지급되는 보급품[ㄱ]을 지급할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: ㄱ
    text: 또는 ‘배급’, ‘부양’; 더 직역하면 ‘환대’. 그리스어 ξενιά는 여기서 군대에 제공되는 보급 또는 지원을 가리킵니다.
    reason: lexical_alternative
