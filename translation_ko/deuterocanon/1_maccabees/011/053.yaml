    rationale: 각주는 ἐψεύσατο에 관한 것이므로 첫 절 뒤에 두어야 독자가 적용 범위를 분명히 알 수 있습니다.
  - severity: low
    issue: 각주의 ‘그가 한 모든 일에서 속였다’는 원문의 발화 대상(ὅσα εἶπεν)을 ‘모든 일’로 넓힙니다.
    rationale: 동사의 넓은 기만 의미는 설명할 수 있으나, 대안 번역 자체는 ‘그가 말한 모든 것’이라는 원문의 범위를 유지하는 편이 안전합니다.
