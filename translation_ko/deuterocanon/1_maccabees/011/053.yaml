  yaml_path: translation/deuterocanon/1_maccabees/011/053.yaml
  text: And he proved false in everything that he said[a], and became estranged from Jonathan, and did not repay the favors that Jonathan had shown him, and he oppressed him severely.
  footnotes:
  - marker: a
    text: Or 'he lied about everything he said' / 'he dealt falsely in all that he said.' The Greek verb can emphasize falsehood in speech or broader deceitful conduct.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 자기가 한 모든 말에서 거짓을 드러냈으며, 요나단과 멀어졌고, 요나단이 그에게 베푼 호의를 갚아 주지 않았으며, 그를 몹시 압박했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 한 말마다 거짓말했다’ / ‘그가 한 모든 일에서 속였다’로도 옮길 수 있습니다. 이 그리스어 동사는 말의 거짓됨뿐 아니라 더 넓은 속임수 행위를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐψεύσατο πάντα ὅσα εἶπεν
  english_pob_choice: he proved false in everything that he said
  chosen_korean: 자기가 한 모든 말에서 거짓을 드러냈으며
  alternatives_korean:
  - 그가 한 모든 말에서 거짓말했습니다
  - 그는 말한 모든 것에서 거짓이었습니다
  - 그가 한 모든 말에 대해 속였습니다
  lexicon: LSJ
  rationale: ἐψεύσατο는 단순한 ‘거짓말하다’보다 말과 행위가 모두 거짓으로 드러나는 넓은 의미를 가질 수 있어, 결과를 드러내는 표현으로 옮겼습니다.
- source_word: ἠλλοτριώθη τῷ Ἰωνάθαν
  english_pob_choice: became estranged from Jonathan
  chosen_korean: 요나단과 멀어졌고
  alternatives_korean:
  - 요나단에게서 소원해졌고
  - 요나단과 단절되었고
  - 요나단에게서 멀어졌고
  lexicon: LSJ
  rationale: 관계의 이탈과 소원함을 자연스러운 한국어로 살리되, 지나치게 강한 적대감은 덧붙이지 않기 위해 ‘멀어지다’를 택했습니다.
- source_word: τὰς εὐνοίας
  english_pob_choice: the favors
  chosen_korean: 호의
  alternatives_korean:
  - 은혜
  - 친절
  - 호의들
  lexicon: LSJ
  rationale: 문맥상 개인적 친절보다 상호 호혜적 호의를 가리키므로, 구체적 공여를 담을 수 있는 ‘호의’로 옮겼습니다.
- source_word: ἔθλιψεν αὐτὸν σφόδρα
  english_pob_choice: he oppressed him severely
  chosen_korean: 그를 몹시 압박했습니다
  alternatives_korean:
  - 그를 심하게 학대했습니다
  - 그를 심히 억눌렀습니다
  - 그를 매우 괴롭혔습니다
  lexicon: LSJ
  rationale: θλίβω는 ‘압박하다/억누르다’의 물리적·정치적 압력을 포함할 수 있으므로, 여기서는 반복적 가혹행위를 드러내는 ‘압박하다’를 선택했습니다.
theological_decisions:
- issue: 관계의 붕괴를 나타내는 ἠλλοτριώθη의 강도
  chosen_reading: ‘멀어졌고’로 번역해 적대보다 관계 단절의 핵심을 앞세웠습니다.
  alternative_readings:
  - ‘적대하게 되었고’
  - ‘완전히 소원해졌고’
  rationale: 본문은 호의의 불이행과 압박을 이어서 말하지만, 동사 자체는 반드시 공개적 적대까지 요구하지 않으므로 강도를 절제했습니다.
  doctrine_reference: 서술 맥락에 따른 어휘 강도 조절
- issue: τὰς εὐνοίας의 번역
  chosen_reading: ‘호의’로 옮겨 상호적 은혜나 선의의 정치적 성격을 유지했습니다.
  alternative_readings:
  - ‘은혜’
  - ‘친절’
  rationale: 이 구절은 신학적 ‘은혜’보다 인간 관계와 약속의 맥락에 있는 호혜적 호의를 말하므로, 오해를 줄이는 방향으로 번역했습니다.
  doctrine_reference: 문맥 우선 번역 원칙
