  yaml_path: translation/deuterocanon/1_maccabees/011/057.yaml
  text: And Antiochus the younger wrote to Jonathan[a], saying, “I appoint you to the high priesthood, and I appoint you over the four districts, and that you are to be among the king’s Friends.”
  footnotes:
  - marker: a
    text: Or “the king’s friends.” The Greek likely refers to an official court rank in the Hellenistic monarchy, not merely personal companions.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 안티오코스 젊은 이가 요나단에게 편지를 보내어 말하기를, “나는 당신에게 대제사장 직분을 수여하며, 당신을 네 행정구역 위에 세우고, 당신이 왕의 벗들 가운데 속하게 합니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “왕의 친구들.” 그리스어는 단순한 개인적 친구들보다 헬레니즘 군주제의 공식 궁정 직함을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψεν
  english_pob_choice: wrote
  chosen_korean: 편지를 보내어
  alternatives_korean:
  - 기록하여
  - 써서
  lexicon: LSJ
  rationale: 단순히 ‘썼다’보다, 이어지는 직접 인용과 함께 나온 서신 행위를 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: ὁ νεώτερος
  english_pob_choice: the younger
  chosen_korean: 젊은 이
  alternatives_korean:
  - 젊은 사람
  - 젊은 자
  - 젊은 안티오코스
  lexicon: LSJ
  rationale: 안티오코스의 식별용 별칭이므로 직역하되, 한국어에서는 인명 뒤의 보충 설명처럼 읽히도록 ‘젊은 이’로 처리했습니다.
- source_word: τὴν ἀρχιερωσύνην
  english_pob_choice: the high priesthood
  chosen_korean: 대제사장 직분
  alternatives_korean:
  - 대제사장직
  - 대제사장직분
  - 대제사장 직
  lexicon: LSJ
  rationale: 직함이 아니라 직무·공적 지위를 수여하는 맥락이므로, 한국어에서도 공적 직분의 성격이 분명한 표현을 택했습니다.
- source_word: τῶν τεσσάρων νομῶν
  english_pob_choice: the four districts
  chosen_korean: 네 행정구역
  alternatives_korean:
  - 네 구역
  - 네 지방
  - 네 도
  lexicon: LSJ
  rationale: νομοί는 여기서 정치 행정 단위를 가리키므로, 현대 독자가 이해할 수 있는 ‘행정구역’으로 옮겼습니다.
- source_word: τῶν φίλων τοῦ βασιλέως
  english_pob_choice: the king’s Friends
  chosen_korean: 왕의 벗들
  alternatives_korean:
  - 왕의 친구들
  - 왕의 측근들
  - 왕의 벗들 가운데
  lexicon: LSJ
  rationale: 헬레니즘 궁정의 사실상 직함 성격을 살리되, 메모에서 밝힌 바와 같이 개인적 친분으로만 축소되지 않도록 ‘벗들’로 유지했습니다.
