  lexicon: LSJ
  rationale: 진행 중인 이동을 살리면서도 한국어에서 자연스럽게 들리도록 ‘지나가다’로 옮겼습니다. ‘τοῦ ποταμοῦ’는 원문처럼 특정 강 이름을 밝히지 않고 보존했습니다.
- source_word: ἐν ταῖς πόλεσιν
  english_pob_choice: through the cities
  chosen_korean: 여러 도시들을
  alternatives_korean:
  - 도시들 안에서
  - 도시들 사이로
  lexicon: LSJ
  rationale: 이동 동사와 결합한 문맥상 단순한 위치가 아니라 도시들을 경유하는 흐름이므로, 불필요한 직역을 피하고 의미를 살렸습니다.
- source_word: ἠθροίσθησαν πρὸς αὐτὸν πᾶσαι αἱ δυνάμεις Συρίας εἰς συμμαχίαν
  english_pob_choice: all the forces of Syria gathered to him as allies
  chosen_korean: 시리아의 모든 군대가 그에게 동맹을 맺으려고 모여들었고
  alternatives_korean:
  - 시리아의 모든 군대가 그에게 동맹으로 모여들었고
  - 시리아의 모든 군대가 그와 동맹하려고 모여들었고
  lexicon: LSJ
  rationale: εἰς συμμαχίαν은 단순 집합이 아니라 동맹 형성의 목적을 드러내므로 ‘동맹을 맺으려고’로 풀어 뜻을 분명히 했습니다.
- source_word: ἐνδόξως
  english_pob_choice: with honor
  chosen_korean: 존귀하게
  alternatives_korean:
  - 영예롭게
  - 정중하게
  - 존중하여
  lexicon: LSJ
  rationale: 도시 사람들이 요나단을 예우하는 태도를 나타내므로, 한국어에서 격식 있고 높임이 느껴지는 ‘존귀하게’를 택했습니다.
theological_decisions:
- issue: 서술체의 행위 연쇄를 어떻게 처리할지
  chosen_reading: 원문의 연속된 동작을 한국어에서도 ‘나가서 … 지나가자 … 모여들었고 … 이르니 … 맞이했습니다’로 이어서, 사건의 진행과 긴박감을 보존했습니다.
  alternative_readings:
  - 문장을 나누어 각 사건을 독립 서술로 처리
  - 더 평이하게 ‘갔고… 왔고… 만났습니다’로 완화
  rationale: 이 절은 전투·외교 상황의 연속을 보여 주므로, 서술의 추진력을 살리는 것이 의미 전달에 중요합니다.
  doctrine_reference: narrative fidelity
