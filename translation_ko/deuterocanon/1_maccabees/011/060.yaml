base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/060.yaml
  text: And Jonathan went out[a], and he traveled beyond the river and through the cities, and all the forces of Syria gathered to him as allies, and he came to Ashkelon[b], and the men of the city met him with honor.
  footnotes:
  - marker: a
    text: '"The river" is left unspecified in the Greek; in this historical setting it likely refers to the Euphrates.'
    reason: cultural_note
  - marker: b
    text: Or "for an alliance" / "into alliance." The Greek phrase εἰς συμμαχίαν indicates that the Syrian forces gathered in support of Jonathan.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 요나단이 나가서 강 건너편과 여러 도시들을 지나가자, 시리아의 모든 군대가 그에게 동맹을 맺으려고 모여들었고, 그가 아스칼론에 이르니, 그 도시 사람들이 그를 존귀하게 맞이했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ‘강’을 특정하지 않습니다. 영어 POB처럼 역사적 문맥상 유브라테스 강을 가리킬 가능성이 있지만, 본문에는 이름이 없습니다.
    reason: source_note
  - marker: b
    text: εἰς συμμαχίαν은 단순한 ‘함께 모임’이 아니라 동맹의 목적을 나타냅니다. 따라서 ‘동맹을 맺으려고’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλεν
  english_pob_choice: went out
  chosen_korean: 나가서
  alternatives_korean:
  - 떠나서
  - 출정하여
  lexicon: LSJ
  rationale: 단순한 출발 동사를 한국어 서술 흐름에 맞게 간결하게 옮겼습니다. 군사적 뉘앙스는 문맥이 충분히 보완합니다.
- source_word: διεπορεύετο πέραν τοῦ ποταμοῦ καὶ ἐν ταῖς πόλεσιν
  english_pob_choice: traveled beyond the river and through the cities
  chosen_korean: 강 건너편과 여러 도시들을 지나가자
  alternatives_korean:
  - 강을 넘어 도시들을 지나가자
  - 강 건너편 지역과 여러 도시들을 통과하자
  lexicon: LSJ
  rationale: 진행 중인 이동을 살리면서도 한국어에서 자연스럽게 들리도록 ‘지나가다’로 옮겼습니다. ‘τοῦ ποταμοῦ’는 원문처럼 특정 강 이름을 밝히지 않고 보존했습니다.
- source_word: ἐν ταῖς πόλεσιν
  english_pob_choice: through the cities
  chosen_korean: 여러 도시들을
  alternatives_korean:
  - 도시들 안에서
  - 도시들 사이로
  lexicon: LSJ
  rationale: 이동 동사와 결합한 문맥상 단순한 위치가 아니라 도시들을 경유하는 흐름이므로, 불필요한 직역을 피하고 의미를 살렸습니다.
- source_word: ἠθροίσθησαν πρὸς αὐτὸν πᾶσαι αἱ δυνάμεις Συρίας εἰς συμμαχίαν
  english_pob_choice: all the forces of Syria gathered to him as allies
  chosen_korean: 시리아의 모든 군대가 그에게 동맹을 맺으려고 모여들었고
  alternatives_korean:
  - 시리아의 모든 군대가 그에게 동맹으로 모여들었고
  - 시리아의 모든 군대가 그와 동맹하려고 모여들었고
  lexicon: LSJ
  rationale: εἰς συμμαχίαν은 단순 집합이 아니라 동맹 형성의 목적을 드러내므로 ‘동맹을 맺으려고’로 풀어 뜻을 분명히 했습니다.
- source_word: ἐνδόξως
  english_pob_choice: with honor
  chosen_korean: 존귀하게
  alternatives_korean:
  - 영예롭게
  - 정중하게
  - 존중하여
  lexicon: LSJ
  rationale: 도시 사람들이 요나단을 예우하는 태도를 나타내므로, 한국어에서 격식 있고 높임이 느껴지는 ‘존귀하게’를 택했습니다.
theological_decisions:
