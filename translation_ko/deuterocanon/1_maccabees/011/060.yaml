base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/060.yaml
  text: And Jonathan went out[a], and he traveled beyond the river and through the cities, and all the forces of Syria gathered to him as allies, and he came to Ashkelon[b], and the men of the city met him with honor.
  footnotes:
  - marker: a
    text: '"The river" is left unspecified in the Greek; in this historical setting it likely refers to the Euphrates.'
    reason: cultural_note
  - marker: b
    text: Or "for an alliance" / "into alliance." The Greek phrase εἰς συμμαχίαν indicates that the Syrian forces gathered in support of Jonathan.
    reason: lexical_alternative
translation:
  language: ko
  text: 요나단이 나가서 강[a] 건너편과 여러 도시를 두루 다니자, 시리아의 모든 병력이 그와 동맹을 맺으려고[b] 그에게 모여들었습니다. 그가 아스칼론에 이르자 그 도시 사람들이 그를 영예롭게 맞이했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 이 ‘강’의 이름을 특정하지 않습니다. 이 역사적 문맥에서는 유브라테스강을 가리킬 가능성이 있지만, 본문에는 이름이 없습니다.
    reason: source_note
  - marker: b
    text: 그리스어 εἰς συμμαχίαν은 시리아 병력이 요나단을 지지하여 동맹 관계를 이루려 모였음을 나타냅니다. 직역하면 ‘동맹을 위해’입니다.
    reason: lexical_alternative
