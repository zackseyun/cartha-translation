- source_word: διεπορεύετο πέραν τοῦ ποταμοῦ καὶ ἐν ταῖς πόλεσιν
  english_pob_choice: traveled beyond the river and through the cities
  chosen_korean: 강 건너편과 여러 도시들을 지나가자
  alternatives_korean:
  - 강을 넘어 도시들을 지나가자
