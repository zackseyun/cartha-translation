base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/073.yaml
  text: And those who had fled from him saw it[a], and they returned to him, and with him they pursued as far as Kadesh, as far as their camp[b], and they encamped there.
  footnotes:
  - marker: a
    text: Or, more explicitly, 'saw this'—the Greek leaves the object unstated, referring back to the preceding events.
    reason: lexical_alternative
  - marker: b
    text: '''Their camp'' most naturally refers to the camp of the force being pursued; the Greek pronoun itself does not spell this out.'
    reason: alternative_reading
translation:
  language: ko
  text: 그에게서 도망쳤던 자들이 그것을[a] 보고 그에게로 돌아와, 그와 함께 카데스까지, 그들의 진영까지[b] 추격하였으며, 거기에서 진을 쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그것을’은 그리스어에 직접 나타나지 않는 목적어를 문맥상 보충한 것입니다.
    reason: source_note
  - marker: b
    text: ‘그들의 진영’은 추격당하는 쪽의 진영을 가리키는 것으로 보는 것이 가장 자연스럽지만, 그리스어 대명사 자체는 이를 분명히 말하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ φυγόντες παρ᾽ αὐτοῦ
  english_pob_choice: those who had fled from him
  chosen_korean: 그에게서 도망쳤던 자들
  alternatives_korean:
  - 그에게서 달아났던 자들
  - 그에게서 도망한 자들
  lexicon: LSJ
  rationale: 과거 분사로 이미 ‘도망친’ 상태를 가리키므로, 한국어에서도 완료된 선행 행위를 드러내는 ‘도망쳤던 자들’이 자연스럽습니다.
- source_word: ἴδον
  english_pob_choice: saw it
  chosen_korean: 그것을 보고
  alternatives_korean:
  - 보고
  - 그 일을 보고
  lexicon: LSJ
  rationale: 그리스어는 목적어를 밝히지 않지만, 문맥상 앞선 사건을 가리키므로 지시어를 최소한으로 보완해 ‘그것을’로 처리했습니다.
- source_word: ἐπέστρεψαν πρὸς αὐτόν
  english_pob_choice: they returned to him
  chosen_korean: 그에게로 돌아와
  alternatives_korean:
  - 그에게 돌아와
  - 그에게 돌아갔습니다
  lexicon: LSJ
  rationale: ‘πρὸς + 대격’의 방향성을 살려 단순 귀환보다 ‘-에게로’로 옮겼습니다.
- source_word: ἐδίωκον μετ᾽ αὐτοῦ
  english_pob_choice: with him they pursued
  chosen_korean: 그와 함께 추격하였으며
  alternatives_korean:
  - 그와 함께 पीछ적하였으며
  - 그와 함께 쫓아갔으며
  lexicon: LSJ
  rationale: 미완료 시제의 지속성을 한국어 연결형으로 살리고, 군사적 맥락을 유지하기 위해 ‘추격하다’를 택했습니다.
- source_word: παρεμβολῆς / παρενέβαλον ἐκεῖ
  english_pob_choice: camp / they encamped there
  chosen_korean: 진영 / 거기에서 진을 쳤습니다
  alternatives_korean:
  - 진영
  - 거기에서 야영했습니다
  lexicon: LSJ
  rationale: 군사 문맥에서 παρεμβολή는 단순 야영보다 ‘진영’이 더 정확하며, 동사도 같은 어근의 군사적 표현인 ‘진을 치다’가 대응됩니다.
