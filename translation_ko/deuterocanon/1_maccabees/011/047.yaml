  text: And the king called the Jews to his aid[a], and they all gathered to him together; and they spread out in the city, and on that day they killed ten thousand in the city.
  footnotes:
  - marker: a
    text: Greek literally, 'were scattered in the city'; the rendering 'spread out through the city' reflects the likely military sense in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 왕은 유대인들을 자기의 원조로 불렀습니다. 그들은 모두 한꺼번에 그에게 모여들었고, 그들은 성 안에 퍼졌으며, 그날 성 안에서 만 명을 죽였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로는 ‘성 안에서 흩어졌다’는 뜻이지만, 여기서는 군사적 전개를 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλεσεν
  english_pob_choice: called
  chosen_korean: 불렀습니다
  alternatives_korean:
  - 소집했습니다
  - 불러들였습니다
  lexicon: LSJ
  rationale: καλέω의 기본 의미를 자연스러운 현대 한국어로 옮기되, 전투 상황의 지시성을 살려 ‘불렀습니다’로 간결하게 처리했습니다.
- source_word: εἰς βοήθειαν
  english_pob_choice: to his aid
  chosen_korean: 자기의 원조로
  alternatives_korean:
  - 자기의 도움으로
  - 자기를 돕도록
  lexicon: LSJ
  rationale: 왕이 유대인들을 자신을 돕는 편으로 부른다는 목적을 살려 직역에 가까운 ‘원조’로 옮겼습니다.
- source_word: ἐπισυνήχθησαν πρὸς αὐτὸν πάντες ἅμα
  english_pob_choice: they all gathered to him together
  chosen_korean: 그들은 모두 한꺼번에 그에게 모여들었고
  alternatives_korean:
  - 그들은 모두 함께 그에게 모였고
  - 그들은 일제히 그에게 모였고
  lexicon: LSJ
  rationale: ‘모여들다’는 πρὸς αὐτόν의 방향성과 집결의 동작성을 살리고, πάντες ἅμα의 총체성과 동시성을 ‘모두 한꺼번에’로 반영합니다.
- source_word: διεσπάρησαν
  english_pob_choice: spread out through the city
  chosen_korean: 성 안에 퍼졌으며
  alternatives_korean:
  - 성 안으로 흩어졌으며
  - 성 안에 흩어졌으며
  lexicon: LSJ
  rationale: 직역상의 ‘흩어지다’도 가능하지만, 영어 POB의 전술적 뉘앙스를 따라 병력 전개를 자연스럽게 드러내는 ‘퍼지다’를 택했습니다.
- source_word: εἰς μυριάδας δέκα
  english_pob_choice: ten thousand
  chosen_korean: 만 명을
  alternatives_korean:
  - 열만을
  - 이만을
  lexicon: LSJ
  rationale: μυριάς의 기본 수량값은 ‘만’이므로, 자연스러운 한국어 수 표현인 ‘만 명’을 사용했습니다.
theological_decisions:
- issue: 전쟁 서술의 폭력성 표현
  chosen_reading: 원문이 직접 말하는 대로 살해 행위를 완화하지 않고 ‘죽였습니다’로 옮겼습니다.
  alternative_readings:
  - 사살했습니다
  - 죽게 했습니다
  rationale: 이 절은 군사적 승전 서술이지만, 원문 ἀπέκτειναν의 직접적 살해 의미를 보존하는 것이 문맥의 사실성을 가장 잘 드러냅니다.
  doctrine_reference: 본문 서술 보존 원칙
