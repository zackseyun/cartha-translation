translation:
  language: ko
  text: 그리고 그 성읍 사람들이 성읍 한가운데로 모여들었는데, 약 십이만 명이었으며, 그들은 왕을 죽이려 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 직역은 ‘남자들 만여단(=1만 단위) 열두 배’, 곧 12만 명입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἐκ τῆς πόλεως
  english_pob_choice: those from the city
  chosen_korean: 그 성읍 사람들이
  alternatives_korean:
  - 성읍에서 온 사람들
  - 그 도시에서 온 이들
  lexicon: LSJ
  rationale: 영어 POB의 ‘those from the city’처럼 출신지를 표시하되, 한국어에서는 자연스럽게 소속 집단을 드러내는 ‘성읍 사람들’로 옮겼습니다.
- source_word: εἰς τὸ μέσον τῆς πόλεως
  english_pob_choice: in the middle of the city
  chosen_korean: 성읍 한가운데로
  alternatives_korean:
  - 성읍 가운데로
  - 성읍의 중심으로
  lexicon: LSJ
  rationale: 공간적 위치 이동을 나타내는 표현이므로 ‘한가운데로’로 옮겨, 군중이 중심부로 모이는 장면을 분명하게 살렸습니다.
- source_word: εἰς ἄνδρας δώδεκα μυριάδας
  english_pob_choice: about one hundred twenty thousand men
  chosen_korean: 약 십이만 명이었으며
  alternatives_korean:
  - 약 십이만 명이었습니다
  - 십이만 명에 이르렀으며
  lexicon: LSJ
  rationale: μυριάδες를 수치로 풀어 쓴 POB의 판단을 따르되, 한국어에서는 자연스러운 인원수 표현인 ‘십이만 명’으로 옮겼습니다.
- source_word: ἀνελεῖν
  english_pob_choice: to kill
  chosen_korean: 죽이려 했습니다
  alternatives_korean:
  - 살해하려 했습니다
  - 죽이려고 했습니다
  lexicon: LSJ
  rationale: 문맥상 생명 박탈의 직접 의미이므로 완곡하지 않은 ‘죽이다’를 택했고, 목적을 나타내는 형태로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 대규모 민중 집결과 왕에 대한 살의의 서술을 어떻게 톤다운하지 않을지
  chosen_reading: 서술의 긴박감과 적대 의도를 그대로 유지하여 ‘왕을 죽이려 했습니다’로 직역에 가깝게 옮겼습니다.
  alternative_readings:
  - 왕을 해치려 했습니다
  - 왕에게 위해를 가하려 했습니다
  rationale: 본문은 단순한 위협이 아니라 살해 의도를 말하므로, 긴장을 약화시키는 표현은 피했습니다.
  doctrine_reference: 역사서 본문의 서술 강도 보존
