    reason: lexical_alternative
translation:
  language: ko
  text: 왕은 뜰[a]로 달아났고, 성읍 사람들은 성읍의 통로들[b]을 장악하여 싸우기 시작하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕궁의 뜰’, ‘안마당’. 그리스어 αὐλή는 뜰이나 안마당을 가리키며, 이 문맥에서는 왕의 거처에 딸린 뜰을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘성읍의 접근로들’, ‘성읍의 입구들’. 그리스어 δίοδος는 통로, 접근로, 지나가는 길을 뜻할 수 있습니다.
    reason: lexical_alternative
