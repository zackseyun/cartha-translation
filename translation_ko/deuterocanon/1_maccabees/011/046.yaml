  yaml_path: translation/deuterocanon/1_maccabees/011/046.yaml
  text: And the king fled into the court[b][a], and the men of the city seized the passages of the city and began to fight.
  footnotes:
  - marker: a
    text: Or 'courtyard'; the Greek can refer to the court area of a palace.
    reason: lexical_alternative
  - marker: b
    text: Or 'those from the city seized the approaches/entrances of the city.' The Greek term can denote passages or access routes.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 왕은 뜰로 도망하였고, 성읍의 사람들은 성읍의 통로들을 장악하고 전투를 시작하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘궁정 뜰’. 그리스어 αὐλή는 왕궁의 뜰이나 안마당을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘성읍 사람들이 성읍의 접근로/입구를 장악하였다’. 그리스어 δίοδος는 통로, 접근로, 지나가는 길을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφυγεν
  english_pob_choice: fled
  chosen_korean: 도망하였고
  alternatives_korean:
  - 달아났고
  - 도망쳤고
  lexicon: BDAG
  rationale: 급박한 위험에서의 도주를 나타내는 동작으로, 자연스러운 현대 한국어로는 ‘도망하다’가 가장 직접적입니다.
- source_word: αὐλήν
  english_pob_choice: court
  chosen_korean: 뜰
  alternatives_korean:
  - 법정
  - 마당
  - 궁정 뜰
  lexicon: LSJ
  rationale: αὐλή는 궁정/뜰/안마당을 가리킬 수 있으므로, 본문이 ‘궁전’이라고까지 명시하지 않는 점을 살려 중립적인 ‘뜰’로 옮겼습니다.
- source_word: τὰς διόδους τῆς πόλεως
  english_pob_choice: the passages of the city
  chosen_korean: 성읍의 통로들
  alternatives_korean:
  - 성읍의 접근로들
  - 성읍의 입구들
  - 성읍의 길목들
  lexicon: LSJ
  rationale: δίοδος는 통과로, 접근로, 지나가는 길을 뜻할 수 있어 특정한 ‘입구’보다 넓은 의미를 살리는 ‘통로들’이 원문의 폭을 잘 보존합니다.
- source_word: ἐκπολεμεῖν
  english_pob_choice: began to fight
  chosen_korean: 전투를 시작하였습니다
  alternatives_korean:
  - 싸우기 시작하였습니다
  - 전쟁을 시작하였습니다
  lexicon: BDAG
  rationale: ‘전투를 시작하다’는 ἐκπολεμεῖν의 전쟁 개시 의미를 살리면서도 현대 한국어에서 자연스럽고 명확합니다.
