base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/059.yaml
  text: And he appointed Simon his brother as commander from the Ladder of Tyre as far as the borders of Egypt[a][b].
  footnotes:
  - marker: a
    text: Or 'general.' The Greek στρατηγός denotes a military leader and may be rendered more specifically depending on context.
    reason: lexical_alternative
  - marker: b
    text: The 'Ladder of Tyre' is a place-name, likely referring to the coastal pass or escarpment near Tyre rather than a literal ladder.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그는 자기 형제 시몬을 두로의 사다리에서 이집트 경계에 이르는 지역의 군사령관으로 임명했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘장군’. 그리스어 στρατηγός는 군사 지도자를 가리키며, 문맥에 따라 더 구체적으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘두로의 사다리’는 지명으로, 문자 그대로의 사다리라기보다 두로 근처의 해안 통로나 절벽 지대를 가리키는 것으로 보입니다.
    reason: cultural_note
lexical_decisions:
- source_word: κατέστησεν
  english_pob_choice: appointed
  chosen_korean: 임명했습니다
  alternatives_korean:
  - 세웠습니다
  - 지정했습니다
  - 임명하였습니다
  lexicon: LSJ
  rationale: 직분이나 역할에 공식적으로 배치하는 뜻을 살려, 단순한 ‘만들다’보다 관직 부여의 뉘앙스가 분명한 ‘임명하다’를 택했습니다.
- source_word: στρατηγὸν
  english_pob_choice: commander
  chosen_korean: 군사령관
  alternatives_korean:
  - 사령관
  - 장군
  - 군대 지휘관
  lexicon: LSJ
  rationale: 전문적 군직을 드러내면서도 현대 한국어에서 자연스럽게 읽히도록 ‘군사령관’으로 옮겼습니다. ‘장군’은 계급 느낌이 더 강해 문맥보다 좁을 수 있습니다.
- source_word: ἀπὸ τῆς κλίμακος Τύρου
  english_pob_choice: from the Ladder of Tyre
  chosen_korean: 두로의 사닥다리에서부터
  alternatives_korean:
  - 두로의 사다리에서부터
  - 두로의 계단길에서부터
  - 두로의 ‘사닥다리’에서부터
  lexicon: LSJ
  rationale: κλίμαξ가 여기서는 문자 그대로의 사다리가 아니라 지명으로 쓰였으므로, POB의 ‘Ladder of Tyre’를 반영해 고유 지명성을 살렸습니다. 한국어에서는 ‘사닥다리’가 고어적이지만 지명 보존에 유리합니다.
- source_word: ἕως τῶν ὁρίων Αἰγύπτου
  english_pob_choice: as far as the borders of Egypt
  chosen_korean: 이집트의 경계에 이르기까지
  alternatives_korean:
  - 이집트의 국경에 이르기까지
  - 이집트의 변경에 이르기까지
  - 이집트의 경계선에 이르기까지
  lexicon: LSJ
  rationale: ὅρια의 영역적 범위를 반영해 ‘경계’로 옮겼고, 도달 범위를 나타내는 ἕως는 ‘-에 이르기까지’로 자연스럽게 살렸습니다.
theological_decisions:
- issue: 형제 관계와 군사 임명의 서술 방식
  chosen_reading: 시몬을 ‘자기 형제’로 두고 그를 군사령관으로 임명했다는 역사 서술로 그대로 옮겼습니다.
  alternative_readings:
  - ‘동생’으로 구체화하기
  - ‘총독’처럼 행정직으로 완화하기
  rationale: ἀδελφὸν과 στρατηγόν의 문맥은 혈연 관계와 군사 직책을 함께 제시합니다. 본문의 역사적·정치적 긴장을 약화시키지 않기 위해 직책을 행정직으로 바꾸지 않았습니다.
  doctrine_reference: 본문의 역사 서술 보존 원칙
- issue: ‘두로의 사닥다리’의 지명 처리
  chosen_reading: 지명을 문자적 표현을 유지한 채 한국어로 옮기되, 의미를 일반화하지 않았습니다.
  alternative_readings:
  - ‘두로의 비탈길’로 해석하기
  - ‘두로의 계단’으로 의역하기
  rationale: 영어 POB도 이 표현을 장소명으로 주해하며 보존하고 있으므로, 한국어에서도 지명성을 유지하는 것이 본문과 주석의 결을 가장 잘 보존합니다.
  doctrine_reference: 주해적 지명 표기 원칙
