  source_fidelity: 그리스어 원문의 핵심 요소, 즉 시몬이 그의 형제라는 점, στρατηγός라는 군사 직책, 그리고 두로의 Ladder에서 이집트 경계까지라는 관할 범위는 충실히 반영되었습니다. 다만 ‘사닥다리’는 현대 표준어 본문에서 다소 고어적이며, 지명으로서의 표현을 보존하면서도 현대적으로 ‘사다리’로 쓰는 편이 적절합니다.
  naturalness: ‘두로의 사닥다리에서부터 이집트의 경계에 이르기까지의 군사령관으로’도 이해 가능하지만, 범위가 관할 지역임을 더 자연스럽게 드러내도록 ‘두로의 사다리에서 이집트 경계에 이르는 지역의 군사령관으로’라고 하는 것이 좋습니다.
  terminology: ‘군사령관’과 ‘임명했습니다’는 στρατηγόν 및 κατέστησεν의 공적·군사적 의미를 잘 전달합니다. ‘사다리’는 κλίμαξ의 지명적 표현을 유지하며, 주석으로 문자적 사다리를 뜻하지 않을 가능성을 설명할 수 있습니다.
