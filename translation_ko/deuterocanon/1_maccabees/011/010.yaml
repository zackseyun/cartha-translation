  text: For I regret giving him my daughter[a], for he sought to kill me.
  footnotes:
  - marker: a
    text: Or, 'he tried to kill me.' The Greek verb can express either seeking or attempting.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그에게 내 딸을 준 것을 후회합니다. 그는 나를 죽이려 했기[a] 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 나를 죽이려고 시도했다.’ 그리스어 동사는 이 문맥에서 ‘~하려 하다’ 또는 ‘~하려고 시도하다’라는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταμεμέλημαι
  english_pob_choice: I regret
  chosen_korean: 후회합니다
  alternatives_korean:
  - 유감입니다
  - 번복하고 싶습니다
  - 회개합니다
  lexicon: BDAG
  rationale: 완료형의 현재적 후회 상태를 자연스러운 현대 한국어로 드러내면서, 정치적·사적 맥락에 맞지 않는 종교적 뉘앙스의 ‘회개합니다’는 피했습니다.
- source_word: δοὺς αὐτῷ τὴν θυγατέρα μου
  english_pob_choice: giving him my daughter
  chosen_korean: 그에게 내 딸을 준 것을
  alternatives_korean:
  - 그에게 내 딸을 준 일
  - 내 딸을 그에게 주어서
  lexicon: BDAG
  rationale: 부정사/분사 절의 원인 관계를 한국어에서는 명사절로 매끈하게 풀어, 뒤의 ‘후회합니다’와 직접 연결되도록 했습니다.
- source_word: ἐζήτησεν ἀποκτεῖναί με
  english_pob_choice: he sought to kill me
  chosen_korean: 그는 나를 죽이려 했기 때문입니다
  alternatives_korean:
  - 그는 나를 죽이려고 했기 때문입니다
  - 그는 나를 죽이려 구했기 때문입니다
  lexicon: BDAG
  rationale: ζητέω + 부정사 구조는 ‘~하려 했다’가 가장 자연스럽고, POB의 ‘sought’가 허용하는 ‘attempted’ 의미도 함께 보존합니다.
