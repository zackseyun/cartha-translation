  text: And Ptolemy entered Antioch and put on the crown of Asia[a], and he put two crowns on his head, that of Asia and Egypt.
  footnotes:
  - marker: a
    text: 'Or ''two diadems.'' The Greek uses the same royal term twice: first for ''the crown of Asia,'' then for ''two crowns''—those of Asia and Egypt.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 프톨레마이오스는 안티오크에 들어가 아시아의 왕관을 썼고, 자기 머리에 아시아와 이집트의 두 왕관을 썼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두 디아뎀’. 헬라어는 같은 왕권 표식을 두 번 사용하여, 먼저 ‘아시아의 왕관’을, 다음에는 ‘두 왕관’—즉 아시아와 이집트의 것—을 말합니다.
    reason: lexical_alternative
