  verdict: revise
  source_fidelity: The draft accurately preserves the twofold use of διάδημα and the concrete action of Ptolemy’s putting on the royal insignia. However, Ἀντιόχεια should be rendered with the established Korean form “안티오키아,” not “안티오크.”
  naturalness: The overall sentence is clear and appropriately formal, but “자기 머리에” is less natural in this elevated narrative register. “그의 머리에” is smoother and avoids the potentially reflexive-colloquial nuance of 자기.
  terminology: “왕관” is an accessible and defensible rendering of διάδημα, and its repetition correctly reflects the Greek. The lexical-alternative note appropriately identifies “디아뎀.”
  issues:
  - severity: medium
    issue: Place name “안티오크” does not accurately represent Greek Ἀντιόχεια.
    rationale: The Greek city name is Antiochia/Antioch; “안티오키아” is the standard Korean transliteration suitable for a source-oriented translation. “안티오크” is not the appropriate Korean form here.
  - severity: low
    issue: “자기 머리에” is stylistically less suitable than “그의 머리에.”
    rationale: The Greek αὐτοῦ refers back to Ptolemy, but Korean formal biblical narrative normally uses “그의” in this construction. This improves idiomatic flow without changing meaning.
  revised_text: 그리고 프톨레마이오스는 안티오키아에 들어가 아시아의 왕관을 썼고, 그의 머리에 아시아와 이집트의 두 왕관을 썼습니다.[a]
