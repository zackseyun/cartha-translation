base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/022.yaml
  text: And when he heard it, he was angry. As soon as he heard, he immediately broke camp and came to Ptolemais, and he wrote to Jonathan not to continue the siege, but to meet him for a conference in Ptolemais as quickly as possible.
  footnotes:
  - marker: a
    text: Greek literally, 'not to sit around' or 'not to remain around'; in context this refers to maintaining the siege.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek clause about meeting is textually awkward (''to meet him, to come together with him''). The translation renders the apparent sense: Jonathan is summoned to meet for a conference in Ptolemais.'
    reason: textual_variant
translation:
  language: ko
  text: 그 말을 듣고 그는 화를 냈습니다. 그러나 듣자마자 곧바로 진을 거두고 돌이켜서 프톨레마이스로 갔으며, 요나단에게 편지를 보내어 포위를 계속하지 말고 프톨레마이스에서 가능한 한 빨리 그를 만나 협의하라고 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어로는 문자적으로 ‘둘러앉아 있지 말라’ 또는 ‘주변에 머물지 말라’에 가깝지만, 여기서는 포위를 계속하라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어의 ‘그를 만나, 그와 함께 모이다’라는 구문은 다소 어색하므로, 문맥상의 뜻을 따라 ‘만나 협의하다’로 옮겼습니다.
    reason: textual_variant
