  yaml_path: translation/deuterocanon/1_maccabees/011/044.yaml
  text: And Jonathan sent three thousand men, mighty in their strength, to Antioch, and they came to the king, and the king rejoiced at their arrival.
  footnotes:
  - marker: a
    text: Or 'at their approach' or 'because of their coming'; the Greek term can denote an approach or coming-on, but here likely refers to the arrival of Jonathan's men before the king.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 요나단은 힘센 사람 삼천 명을 안티오키아로 보냈습니다. 그들이 왕에게 이르자, 왕은 그들이 온 것을 기뻐했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 도착에’나 ‘그들이 다가온 것을’로도 옮길 수 있습니다. 그리스어 ἐφόδος는 접근이나 도착을 뜻할 수 있으며, 여기서는 그들이 왕 앞에 이른 일을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  english_pob_choice: sent
  chosen_korean: 보냈습니다
  alternatives_korean:
