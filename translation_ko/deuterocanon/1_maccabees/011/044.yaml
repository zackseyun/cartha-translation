  lexicon: LSJ
  rationale: 그리스어는 문자적으로 ‘남자들’이지만, 한국어에서는 군사적 뉘앙스를 지나치게 좁히지 않으면서도 자연스럽게 옮기기 위해 ‘사람 삼천 명’으로 처리했습니다.
- source_word: δυνατοὺς ἰσχύι αὐτῶν
  english_pob_choice: mighty in their strength
  chosen_korean: 힘이 강한
  alternatives_korean:
  - 강한 힘을 지닌
  - 그들의 힘에서 강한
  - 용맹한
  lexicon: LSJ
  rationale: 원문의 중첩된 힘의 강조를 살리되, 한국어에서 어색한 직역인 ‘힘에 있어서 강한’보다 의미를 유지하는 자연스러운 표현을 선택했습니다.
- source_word: ἐπὶ τῇ ἐφόδῳ αὐτῶν
  english_pob_choice: at their arrival
  chosen_korean: 그들이 온 것 때문에
  alternatives_korean:
  - 그들의 도착에
  - 그들이 다가온 것에
  - 그들의 접근에
  lexicon: LSJ
  rationale: ἐφόδος는 ‘도착/접근/다가옴’의 범위를 가지며, 본문 맥락에서는 왕 앞에 이른 사실을 가리키므로 한국어에서는 원인적 뉘앙스를 포함해 옮겼습니다.
theological_decisions:
- issue: ἐφόδῳ의 의미를 ‘도착’보다 ‘온 것 때문에’로 옮길지 여부
  chosen_reading: 왕이 그들의 도착 자체에 기뻐한 것으로 이해하되, 한국어에서는 ‘그들이 온 것 때문에’로 자연스럽게 표현했습니다.
  alternative_readings:
  - 그들의 도착에 기뻐했습니다
  - 그들의 접근에 기뻐했습니다
  rationale: 이 절은 신학적 쟁점보다 서술 의미가 핵심이며, 원문의 결과 상태를 한국어에서 가장 무리 없이 드러내기 위해 원인적 표현을 택했습니다.
