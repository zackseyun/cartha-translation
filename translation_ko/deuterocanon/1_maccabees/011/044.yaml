  source_fidelity: 전체 사건 전개와 인명·지명은 원문에 충실합니다. 다만 δυνατοὺς ἰσχύι αὐτῶν의 강조는 ‘힘이 강한 사람’보다 ‘힘센 사람’으로 옮기는 편이 한국어에서 더 정확하고 자연스럽습니다. 또한 ἐπὶ τῇ ἐφόδῳ αὐτῶν는 이 문맥에서 그들의 도착/옴을 기뻐한 대상·계기로 나타내므로, ‘그들이 온 것 때문에’보다 ‘그들이 온 것을’이 원문의 결속을 더 직접적으로 반영합니다.
