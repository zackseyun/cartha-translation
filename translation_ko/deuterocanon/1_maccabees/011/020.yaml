- from: 그때에 요나단은 유대에 있는 사람들을 모아 예루살렘에 있는 성채[a]에 맞서 전쟁하게 하였고, 그들은 그곳에 많은 공성 기구들을 만들었습니다.
  to: 그때에 요나단은 예루살렘에 있는 성채[a]를 공격하려고 유대에서 온 사람들을 모았으며, 그 성채를 치기 위한 많은 공성 기구를 만들었습니다.
  rationale: 사역으로 읽힐 수 있는 표현을 목적 표현으로 바로잡고, 공성 기구가 성채를 공격하기 위한 것이라는 원문의 방향성을 명확히 했습니다. ‘성채’와 ‘아크라’ 각주의 처리 및 역사적 모호성은 유지했습니다.
