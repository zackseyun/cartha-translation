review_pass:
  verdict: revise
  source_fidelity: ‘전쟁하게 하였고’는 요나단이 사람들에게 전쟁을 하도록 시켰다는 사역 의미를 더합니다. 그리스어 τοῦ ἐκπολεμῆσαι는 요나단이 사람들을 모은 목적을 나타내므로 ‘공격하려고’로 옮기는 것이 적절합니다. 또한 ἐπʼ αὐτήν은 성채에 대한 적대적 방향이지 단순 장소가 아니므로 ‘그곳에’는 수정되어야 합니다.
  naturalness: ‘공성 기구’는 이해 가능한 군사 용어이며, ‘그 성채를 치기 위한 많은 공성 기구’는 현대 한국어 합쇼체에서 자연스럽습니다.
  terminology: ἄκρα는 본문에서 ‘성채’로 유지하고, 특정 예루살렘 요새를 가리키는 ‘아크라’라는 대안은 각주로 보존합니다. ‘유대에서 온 사람들’은 τοὺς ἐκ τῆς Ἰουδαίας의 출처 표현을 ‘유대에 있는 사람들’보다 더 직접적으로 반영합니다.
  issues:
