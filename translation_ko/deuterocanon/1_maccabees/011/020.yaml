    issue: ‘전쟁하게 하였고’가 사역 의미를 더함
    rationale: 원문은 요나단이 성채를 공격할 목적으로 사람들을 모았다고 말하며, 그가 그들에게 전쟁을 하게 했다고 명시하지 않습니다.
  - severity: medium
    issue: ‘그곳에’가 ἐπʼ αὐτήν의 적대적 방향을 충분히 반영하지 못함
    rationale: 공성 기구는 성채 ‘에’ 만든 것이 아니라 그 성채를 공격하기 위해 만든 것입니다.
