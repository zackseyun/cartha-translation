translation:
  language: ko
  text: 그때에 요나단은 예루살렘에 있는 성채[a]를 공격하려고 유대에서 온 사람들을 모았으며, 그 성채를 치기 위한 많은 공성 기구를 만들었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아크라’—예루살렘에 있던 요새화된 성채.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγεν
  english_pob_choice: gathered
  chosen_korean: 모아
  alternatives_korean:
  - 모았습니다
  - 소집했습니다
  lexicon: LSJ
  rationale: 군사적 목적의 집합이라는 뜻을 살려 자연스러운 동사 ‘모아’로 옮겼습니다.
- source_word: τοὺς ἐκ τῆς Ἰουδαίας
  english_pob_choice: those from Judea
  chosen_korean: 유대에 있는 사람들을
  alternatives_korean:
  - 유대 사람들을
  - 유대에서 온 사람들을
  lexicon: LSJ
  rationale: 원문은 ‘유대에서 나온 사람들’이라는 출처를 밝히면서도 구체적으로는 생략형이어서, 과도하게 ‘군인들’로 좁히지 않고 한국어로는 자연스럽게 ‘유대에 있는 사람들’로 처리했습니다.
- source_word: τὴν ἄκραν
  english_pob_choice: the citadel
  chosen_korean: 성채
  alternatives_korean:
  - 아크라
  - 요새
  lexicon: LSJ
  rationale: 본문의 일반 의미는 ‘요새화된 성채’이지만, 1 마카베오에서는 예루살렘의 특정한 아크라를 가리키므로 본문에는 의미역인 ‘성채’를 두고 각주로 기술적 대안을 밝혔습니다.
- source_word: μηχανὰς πολλάς
  english_pob_choice: many siege engines
  chosen_korean: 많은 공성 기구들
  alternatives_korean:
  - 많은 포위 무기들
  - 많은 공성 장비들
  lexicon: LSJ
  rationale: 전투 공학 장비를 가리키므로 ‘공성 기구들’로 옮겨, 단순한 ‘기계’로 오해되지 않게 했습니다.
theological_decisions:
- issue: ἄκρα의 번역을 의미역으로 둘 것인가, 고유 명칭으로 둘 것인가
  chosen_reading: 본문에는 ‘성채’로 번역하고, 각주에서 예루살렘의 ‘아크라’일 수 있음을 밝힙니다.
  alternative_readings:
  - 아크라
  - 요새
  rationale: 독자가 문맥상 군사 요새를 즉시 이해하도록 하되, 1 마카베오에서의 역사적 고유명칭도 보존해야 하므로 의미역과 기술명을 병기하는 방식이 가장 투명합니다.
  doctrine_reference: 본문-역사 맥락 보존 및 고유명칭 처리 원칙
