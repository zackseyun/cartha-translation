    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσον
  english_pob_choice: fell
  chosen_korean: 쓰러졌고
  alternatives_korean:
  - 죽었습니다
  - 넘어졌고
  lexicon: LEH
  rationale: 전투 맥락에서 ‘fell’의 관용적 의미를 살리되, 한국어에서는 자연스럽게 전사·패배의 결과를 드러내는 ‘쓰러지다’가 가장 가깝습니다.
- source_word: ἐκ τῶν ἀλλοφύλων
  english_pob_choice: of the foreigners
  chosen_korean: 외국인들 가운데서
  alternatives_korean:
  - 이방인들 가운데서
  - 외국인들의
  lexicon: LEH
  rationale: ἀλλόφυλοι는 문자적으로 ‘다른 민족/부족의 사람들’이므로, 여기서는 특정 민족명으로 좁히지 않고 POB의 ‘foreigners’를 반영해 ‘외국인들’로 옮겼습니다.
- source_word: εἰς ἄνδρας τρισχιλίους
  english_pob_choice: three thousand men
  chosen_korean: 삼천 명이
  alternatives_korean:
  - 약 삼천 명이
  - 삼천 명의 남자가
  lexicon: LEH
  rationale: εἰς + 수사는 총수에 이르는 결과를 나타낼 수 있어, 영어 POB의 ‘three thousand men’에 맞춰 수량을 그대로 제시했습니다.
- source_word: ἐπέστρεψεν
  english_pob_choice: returned
  chosen_korean: 돌아갔습니다
  alternatives_korean:
  - 되돌아갔습니다
  - 귀환했습니다
  lexicon: BDAG
  rationale: 이동 서술에서는 단순한 귀환을 뜻하므로, 현대 한국어에서 가장 자연스러운 ‘돌아가다’를 사용했습니다.
