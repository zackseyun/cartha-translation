lexical_decisions:
- source_word: ἀθετήσεται
  english_pob_choice: shall be set aside
  chosen_korean: 폐기되지 않을 것입니다
  alternatives_korean:
  - 무효화되지 않을 것입니다
  - 제쳐지지 않을 것입니다
  - 폐지되지 않을 것입니다
  lexicon: LSJ
  rationale: 여기서는 앞서 정해진 사항들이 더 이상 효력을 잃지 않는다는 뜻이므로, ‘폐기하다’가 현대 한국어로 가장 자연스럽게 무효화의 의미를 살립니다.
- source_word: οὐδὲν τούτων
  english_pob_choice: none of these things
  chosen_korean: 이 일들 가운데 아무것도
  alternatives_korean:
  - 이것들 가운데 아무것도
  - 이 모든 것 가운데 아무것도
  lexicon: LSJ
  rationale: 지시대명사 τούτων이 앞선 복수 항목들을 가리키므로, ‘이 일들 가운데 아무것도’로 복수 참조를 분명히 살렸습니다.
- source_word: ἀπὸ τοῦ νῦν
  english_pob_choice: from now on
  chosen_korean: 이제부터
  alternatives_korean:
  - 지금부터
  - 이 시점부터
  lexicon: LSJ
  rationale: 현재 시점 이후를 가리키는 시간 부사구로서, ‘이제부터’가 가장 자연스럽고 간결합니다.
- source_word: ἐπὶ τὸν ἅπαντα χρόνον
  english_pob_choice: for all time
  chosen_korean: 영원토록
  alternatives_korean:
  - 모든 때에
  - 온전히 모든 시간 동안
  lexicon: LSJ
  rationale: 문맥상 지속성을 강하게 강조하므로, ‘영원토록’이 전체 시간 범위를 압축적으로 전달합니다.
