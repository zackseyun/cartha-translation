  text: And Jonathan met the king at Joppa with honor, and they greeted one another, and they spent the night there.
translation:
  language: ko
  text: 그리고 요나단은 영광스럽게 야훼께로 왕을 맞이하여 욥바에 이르렀고, 그들은 서로 인사한 뒤 거기서 밤을 지냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘영광스럽게’는 여기서 의례적 존중과 화려한 접견의 뉘앙스를 함께 담는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήντησεν
  english_pob_choice: met
  chosen_korean: 맞이하여
  alternatives_korean:
  - 만나
  - 마주하여
  - 대면하여
  lexicon: LSJ
  rationale: 단순한 ‘만났다’보다 상대를 맞으러 나아가 만나는 정황을 살려, 왕을 정중히 영접하는 문맥에 맞게 ‘맞이하여’로 옮겼습니다.
- source_word: μετὰ δόξης
  english_pob_choice: with honor
  chosen_korean: 영광스럽게
  alternatives_korean:
  - 존귀하게
  - 영예롭게
  - 위엄 있게
  lexicon: LSJ
  rationale: δόξα는 이 문맥에서 추상적 ‘영광’보다 의례적 품위와 존숭을 포함한 태도를 가리키므로, ‘영광스럽게’로 본문 흐름을 살렸습니다.
- source_word: ἠσπάσαντο ἀλλήλους
  english_pob_choice: they greeted one another
  chosen_korean: 서로 인사한 뒤
  alternatives_korean:
  - 서로 인사하고
  - 서로 문안한 뒤
  - 서로 반긴 뒤
  lexicon: BDAG
  rationale: ἀσπάζομαι의 기본 의미인 ‘인사하다/문안하다’를 따라 자연스럽게 표현하되, 뒤의 숙박 동작과 이어지도록 ‘뒤’로 정리했습니다.
- source_word: ἐκοιμήθησαν
  english_pob_choice: they spent the night
  chosen_korean: 밤을 지냈습니다
  alternatives_korean:
  - 잠을 잤습니다
  - 묵었습니다
  - 하룻밤 머물렀습니다
  lexicon: LSJ
  rationale: 여행 서술에서의 관용적 의미를 반영하여 단순 수면이 아니라 그날 밤 머무름을 나타내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 여기서의 대우·의례적 표현 수위
  chosen_reading: 왕을 향한 정중한 영접과 상호 인사의 공적 분위기를 살렸습니다.
  alternative_readings:
  - 중립적인 ‘만나’로 완화하기
  - ‘영광’을 단순한 장식적 표현으로 처리하기
  rationale: 본문은 외교적 만남의 예식을 보여 주므로, 과도한 평준화보다 정중함과 공개성을 드러내는 번역이 원문의 효과를 더 잘 전달합니다.
  doctrine_reference: 역사 서술의 문체 및 궁정 의례 묘사
- issue: 야훼 표기
  chosen_reading: 본문에는 직접적인 יהוה 표기가 없지만, '영광스럽게'가 신적 호칭으로 오해되지 않도록 문맥상 일반 서술로 유지했습니다.
  alternative_readings:
  - ‘주께 영광스럽게’처럼 신학화하기
  - ‘영광스럽게’ 대신 ‘존귀하게’로 중화하기
  rationale: 원문은 하나님 언급이 아닌 외교적 방문을 말하므로, 신학적 확장을 피하고 서술의 역사성을 보존했습니다.
  doctrine_reference: 본문 비유도/직설 구별
