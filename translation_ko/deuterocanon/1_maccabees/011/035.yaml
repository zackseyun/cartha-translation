  yaml_path: translation/deuterocanon/1_maccabees/011/035.yaml
  text: And the other things belonging to us from now on—the tithes and the taxes belonging to us[a], and the salt lakes[b], and the crowns belonging to us—we will grant all these to them.
  footnotes:
  - marker: a
    text: Or 'the salt pans' or 'the saltworks'; the Greek reads literally 'the lakes of salt,' likely referring to salt-producing resources or their revenues.
    reason: lexical_alternative
  - marker: b
    text: Literally 'crowns.' In this fiscal context it may refer to a customary crown-tribute or honorary payment owed to the king.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이제부터 우리에게 속한 나머지 것들—곧 우리에게 속한 십일조와 세금, 소금 호수들, 그리고 우리에게 속한 관들은 모두 그들에게 내주겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘소금의 호수들’입니다. 문맥상 소금 생산지나 그 수익을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘관들’입니다. 이곳에서는 관례적 공물이나 헌납을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἄλλα
  english_pob_choice: the other things
  chosen_korean: 나머지 것들
  alternatives_korean:
  - 다른 것들
  - 남은 것들
  lexicon: LSJ
  rationale: 왕에게 속한 수입 항목들을 덧붙여 열거하는 일반적 표현이므로, ‘나머지 것들’이 범위를 열어 둔 채 자연스럽게 옮깁니다.
- source_word: ἀνήκοντα ἡμῖν / τῶν ἀνηκόντων ἡμῖν / τοὺς ἀνήκοντας ἡμῖν
  english_pob_choice: belonging to us
  chosen_korean: 우리에게 속한
  alternatives_korean:
  - 우리에게 속하는
  - 우리 것이 된
  lexicon: LSJ
  rationale: 반복되는 분사는 법적·행정적 소유 관계를 나타내므로, 문맥에 맞게 ‘우리에게 속한’으로 일관되게 옮겼습니다.
- source_word: δεκατῶν
  english_pob_choice: tithes
  chosen_korean: 십일조
  alternatives_korean:
  - 열의 하나
  - 조세
  lexicon: LSJ
  rationale: 직역하면 ‘열의 하나’이지만, 한국어 성경에서 통용되는 재정·종교적 용례를 살리되 의미를 분명히 하기 위해 ‘십일조’를 택했습니다.
- source_word: τελῶν
  english_pob_choice: taxes
  chosen_korean: 세금
  alternatives_korean:
  - 관세
  - 부과금
  lexicon: LSJ
  rationale: 이 항목은 광범위한 공납·징수금을 가리키므로, 좁은 ‘관세’보다 포괄적인 ‘세금’이 문맥에 맞습니다.
- source_word: τὰς τῶν ἁλῶν λίμνας
  english_pob_choice: the salt lakes
  chosen_korean: 소금 호수들
  alternatives_korean:
  - 소금 늪들
  - 소금밭들
  - 염전들
  lexicon: LSJ
  rationale: 그리스어는 문자적으로 ‘소금의 호수들’이므로, 본문 투명성을 위해 ‘소금 호수들’을 유지했습니다. 다만 실질적으로는 소금 생산지나 그 수익을 가리킬 수 있습니다.
- source_word: στεφάνους
  english_pob_choice: crowns
  chosen_korean: 관들
  alternatives_korean:
  - 왕관들
  - 왕관 공물
  - 관세
  lexicon: LSJ
  rationale: 문자적으로는 ‘관들’이지만, 헬라 왕정의 조세·공납 문맥에서는 관 형식의 헌납이나 공물을 뜻할 수 있어, 한국어로는 중립적이고 형식적인 ‘관들’로 옮겼습니다.
- source_word: πάντα ἐπαρκέσομεν αὐτοῖς
  english_pob_choice: we will grant all these to them
  chosen_korean: 모두 그들에게 내주겠습니다
  alternatives_korean:
  - 모두 그들에게 허락하겠습니다
  - 모두 그들에게 넘겨주겠습니다
  lexicon: LSJ
  rationale: 행정적 양도·면제를 뜻하는 동사로 이해하여, 단순한 ‘제공’보다 권리를 넘겨주는 뉘앙스가 드러나도록 ‘내주겠습니다’로 번역했습니다.
