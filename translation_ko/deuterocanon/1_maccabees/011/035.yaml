  rationale: 문자적으로는 ‘관들’이지만, 헬라 왕정의 조세·공납 문맥에서는 관 형식의 헌납이나 공물을 뜻할 수 있어, 한국어로는 중립적이고 형식적인 ‘관들’로 옮겼습니다.
- source_word: πάντα ἐπαρκέσομεν αὐτοῖς
