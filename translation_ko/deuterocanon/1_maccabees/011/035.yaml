  yaml_path: translation/deuterocanon/1_maccabees/011/035.yaml
  text: And the other things belonging to us from now on—the tithes and the taxes belonging to us[a], and the salt lakes[b], and the crowns belonging to us—we will grant all these to them.
  footnotes:
  - marker: a
    text: Or 'the salt pans' or 'the saltworks'; the Greek reads literally 'the lakes of salt,' likely referring to salt-producing resources or their revenues.
    reason: lexical_alternative
  - marker: b
    text: Literally 'crowns.' In this fiscal context it may refer to a customary crown-tribute or honorary payment owed to the king.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이제부터 우리에게 속한 나머지 것들, 곧 우리에게 속한 십일조와 세금, 소금 호수들[a], 그리고 우리에게 속한 관(冠)들[b]도 이 모든 것을 그들에게 내주겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘소금의 호수들’입니다. 문맥상 소금 생산지나 그 수익을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘관(冠)들’입니다. 이 재정 문맥에서는 관례적인 관 공물 또는 헌납을 뜻할 수 있습니다.
    reason: lexical_alternative
