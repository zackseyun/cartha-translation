translation:
  language: ko
  text: 그리고 그는 그에게 대제사장직과 그가 전에 지니고 있던 다른 모든 영예를 확정해 주었으며, 그를 으뜸 벗들 가운데 한 사람으로 삼았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '첫째 벗들 가운데'입니다. 이는 셀레우코스 행정에서 사용된 공식 궁정 등급을 가리킬 가능성이 높습니다.
    reason: lexical_alternative
