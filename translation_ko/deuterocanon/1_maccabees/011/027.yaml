  text: And he confirmed for him the high priesthood[a], and whatever other honors he had formerly held, and he made him rank among the first friends.
  footnotes:
  - marker: a
    text: Or 'among the chief friends.' The Greek likely reflects a formal court rank in the Seleucid administration.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그에게 대제사장 직분을 확정해 주었으며, 그가 이전에 지니고 있던 다른 모든 명예도 그대로 인정해 주었고, 그를 왕의 첫째 벗들 가운데 한 사람으로 삼았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '왕의 첫째 벗들 가운데'이며, 이는 셀레우코스 왕조의 공식 궁정 직함으로 보입니다.
    reason: lexical_alternative
