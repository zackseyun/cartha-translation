- from: 그리고 그는 평화로운 말로 시리아로 나갔으며, 성읍들에서 온 자들이 그에게 문을 열어 주고 그를 맞으러 나갔습니다. 이는 알렉산드로스 왕이 그를 맞으라고 명령했기 때문이니, 그는 그의 장인이었기 때문입니다.[a][b]
  to: 그리고 그는 평화로운 말로 시리아로 나갔으며, 성읍들에서 온 사람들이 그에게 문을 열어 주고[a] 그를 맞이하러 나갔습니다. 이는 알렉산드로스 왕이 자기 장인인 그를 맞이하라고 명령했기 때문입니다.[b]
  rationale: 원문의 생략된 ‘열다’의 목적어는 본문에서 ‘문’으로 자연스럽게 보충하되 각주에서 그리스어의 생략을 밝혔습니다. 친족 관계의 대명사 모호성은 ‘자기 장인인 그’로 해소하여, 알렉산드로스의 명령과 그 근거의 관계를 보존했습니다. 각주 표지도 해당 본문 표현에 붙였습니다.
