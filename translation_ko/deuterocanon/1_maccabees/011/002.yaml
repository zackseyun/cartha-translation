  source_fidelity: 그리스어의 기본 흐름은 대체로 반영되어 있으나, 마지막의 대명사 연쇄(“그는 그의 장인이었기 때문입니다”)는 누가 누구의 장인인지 한국어에서 불명확합니다. 또한 두 번의 ‘때문’ 연결은 διὰ τὸ πενθερὸν αὐτοῦ εἶναι가 알렉산드로스의 명령의 근거임을 흐립니다.
  naturalness: ‘성읍들에서 온 자들’은 가능하지만 현대 표준 한국어 성경 문체에서는 ‘성읍들에서 온 사람들이’ 더 자연스럽습니다. ‘그에게 문을 열어 주고’는 각주로 생략된 목적어를 설명하면 자연스럽게 이해됩니다. 친족 관계는 ‘자기 장인인 그’로 명시하는 편이 현대 한국어에서 명료합니다.
  terminology: ‘평화로운 말’, ‘성읍’, ‘알렉산드로스 왕’, ‘명령’, ‘장인’은 적절합니다. ‘맞이하라고’는 συναντᾷν αὐτῷ의 문맥상 의미를 잘 전달합니다.
  issues:
