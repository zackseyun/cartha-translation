base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/002.yaml
  text: And he went out into Syria with peaceful words[a], and the men from the cities opened to him and went out to meet him, because Alexander the king had given an order to meet him[b], since he was his father-in-law.
  footnotes:
  - marker: a
    text: Or, more explicitly, 'opened their gates to him.' The Greek leaves the object unstated.
    reason: lexical_alternative
  - marker: b
    text: That is, Alexander had ordered the cities to receive and meet him favorably because Ptolemy was Alexander's father-in-law.
    reason: cross_reference
translation:
  language: ko
  text: 그리고 그는 평화로운 말로 시리아로 나갔으며, 성읍들에서 온 자들이 그에게 문을 열어 주고 그를 맞으러 나갔습니다. 이는 알렉산드로스 왕이 그를 맞으라고 명령했기 때문이니, 그는 그의 장인이었기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 열어 준 대상(성문/문)을 직접 말하지 않습니다.
    reason: source_note
  - marker: b
    text: 즉, 알렉산드로스가 그를 호의적으로 맞이하도록 성읍들에 지시했다는 뜻입니다.
    reason: cross_reference
lexical_decisions:
- source_word: λόγοις εἰρηνικοῖς
  english_pob_choice: with peaceful words
  chosen_korean: 평화로운 말로
  alternatives_korean:
  - 평화의 말로
  - 평화로운 언사로
  lexicon: LSJ
  rationale: dative of manner/instrument를 자연스럽게 살려, 단순한 태도보다 외교적 발언을 가리키는 뉘앙스를 유지했습니다.
- source_word: ἤνοιγον αὐτῷ
  english_pob_choice: opened to him
  chosen_korean: 그에게 문을 열어 주고
  alternatives_korean:
  - 그에게 열어 주고
  - 그를 받아 주고
  lexicon: LSJ
  rationale: 본문은 열어 준 대상이 명시되지 않으므로, 한국어에서는 성읍의 문을 뜻하는 것으로 자연스럽게 보이되 본문의 생략을 과도하게 보충하지 않도록 했습니다.
- source_word: οἱ ἀπὸ τῶν πόλεων
  english_pob_choice: the men from the cities
  chosen_korean: 성읍들에서 온 자들
  alternatives_korean:
  - 성읍들의 사람들
  - 성읍들에서 온 사람들
  lexicon: LSJ
  rationale: 남성 복수 형식을 살리면서도 한국어에서는 성중립적이게 옮겨, 도시 대표자들의 집단적 행동이라는 문맥을 보존했습니다.
- source_word: ἐντολή ἦν Ἀλεξάνδρου τοῦ βασιλέως συναντᾷν αὐτῷ
  english_pob_choice: Alexander the king had given an order to meet him
  chosen_korean: 알렉산드로스 왕이 그를 맞으라고 명령했기 때문이니
  alternatives_korean:
  - 알렉산드로스 왕의 명령으로 그를 만나도록 했기 때문이니
  - 알렉산드로스 왕이 그를 맞이하라고 명령했기 때문이니
  lexicon: LSJ
  rationale: ἐντολή를 ‘명령’으로 옮기고, συναντᾷν αὐτῷ를 문맥상 ‘맞으러 가다/맞다’로 풀어 왕의 지시 내용을 분명히 했습니다.
theological_decisions:
- issue: 왕실 외교와 호의의 근거 표현
  chosen_reading: 알렉산드로스의 친족 관계가 도시들의 호의적 응대와 왕의 명령의 이유로 제시됩니다.
  alternative_readings:
  - 단순한 정치적 우호로 약화하여 읽는 방식
  - 왕의 명령만 강조하고 친족 관계를 부차화하는 방식
  rationale: διὰ τὸ πενθερὸν αὐτοῦ εἶναι는 관계적 이유를 분명히 밝히므로, 문맥상의 외교적 호의가 혈연-혼인 관계에 근거했음을 그대로 드러냈습니다.
  doctrine_reference: 서사 문맥의 역사적-정치적 인과 관계 보존
- issue: ‘문을 열어 주고’의 구체성
  chosen_reading: ‘열어 주다’는 도시 성문을 여는 행위를 암시하되, 본문에 없는 ‘성문’은 본문 밖에서 단정적으로 넣지 않았습니다.
  alternative_readings:
  - ‘성문을 열어 주다’로 명시적으로 확대하는 방식
  - ‘받아 주다’로 추상화하는 방식
  rationale: 그리스어가 대상을 생략하므로, 한국어도 그 생략을 존중하되 독자가 자연스럽게 이해할 수 있는 정도까지만 구체화했습니다.
  doctrine_reference: 본문의 생략 존중과 과잉해석 방지
