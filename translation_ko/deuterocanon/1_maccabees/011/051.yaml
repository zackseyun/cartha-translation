  text: And they threw down their weapons and made peace. And the Jews were honored before the king and before all those in his kingdom, and they returned to Jerusalem with much plunder.
translation:
  language: ko
  text: 그리고 그들은 무기를 내던지고 평화를 맺었습니다. 유대인들은 왕 앞에서와 그의 왕국에 속한 모든 사람 앞에서 존귀하게 되었고, 예루살렘으로 많은 전리품을 가지고 돌아갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρριψαν τὰ ὅπλα
  english_pob_choice: threw down their weapons
  chosen_korean: 무기를 내던지고
  alternatives_korean:
  - 무장을 버리고
  - 무기를 내려놓고
  lexicon: LSJ
  rationale: ἔρριψαν은 단순히 내려놓기보다 거세게 던져 버리는 동작을 살리므로, 항복·무장해제의 뉘앙스를 유지하는 「내던지고」를 택했습니다.
- source_word: ἐποίησαν εἰρήνην
  english_pob_choice: made peace
  chosen_korean: 평화를 맺었습니다
  alternatives_korean:
  - 화평을 이루었습니다
  - 평화 협정을 맺었습니다
  lexicon: LSJ
  rationale: 직역보다 한국어에서 자연스러운 관용을 살리되, 상대와의 관계 정립을 뜻하는 단순한 「평화를 맺었습니다」로 옮겼습니다.
- source_word: ἐδοξάσθησαν
  english_pob_choice: were honored
  chosen_korean: 존귀하게 되었습니다
  alternatives_korean:
  - 존중받았습니다
  - 영광을 얻었습니다
  lexicon: LSJ
  rationale: 이 문맥의 δοξάζω 수동은 신학적 ‘영화’보다 공적 명예를 가리키므로, 과도한 종교적 색채를 피하면서도 위상을 드러내는 「존귀하게 되었습니다」가 적절합니다.
- source_word: σκῦλα πολλά
  english_pob_choice: much plunder
  chosen_korean: 많은 전리품
  alternatives_korean:
  - 많은 노획물
  - 많은 약탈품
  lexicon: LSJ
  rationale: σκῦλα는 전쟁에서 얻은 노획물을 뜻하므로, 현대어로도 분명한 「전리품」을 선택했습니다.
theological_decisions:
- issue: 왕국 안팎에서의 공적 인정 표현
  chosen_reading: 왕 앞에서와 그의 왕국에 속한 모든 사람 앞에서
  alternative_readings:
  - 왕의 눈앞에서와 그의 나라 안의 모든 사람들 앞에서
  - 왕에게서와 그의 왕국 사람들 앞에서
  rationale: ἐναντίον/ἐνώπιον의 병렬은 ‘왕의 시야’와 ‘왕국 전체의 평가’를 함께 드러내므로, 두 범위를 모두 살리는 문장 구조를 유지했습니다.
  doctrine_reference: 서술적 역사문맥의 공적 명예 개념
