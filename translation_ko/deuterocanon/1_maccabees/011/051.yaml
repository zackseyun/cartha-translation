  source_fidelity: 원문의 동작 순서와 의미(무기를 내던짐, 평화 체결, 왕과 왕국 내 모든 사람 앞에서 받는 명예, 많은 전리품을 지닌 예루살렘 귀환)는 대체로 충실히 반영되었습니다. 다만 ἐδοξάσθησαν은 이 문맥에서 ‘존귀하게 되다’보다 ‘영예를 얻다/존중받다’처럼 공적으로 명예를 받는 뜻으로 옮기는 편이 더 정확하고 자연스럽습니다.
