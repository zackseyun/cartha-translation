base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/028.yaml
  text: And Jonathan asked the king to make Judea[a], the three toparchies, and Samaria tax-free, and he promised him three hundred talents.
  footnotes:
  - marker: a
    text: A toparchy was an administrative district. The Greek preserves a technical territorial term rather than a generic word for region.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 요나단은 왕에게 유대를 조세 면제 지역으로, 세 토파르키아와 사마리아를 그렇게 해 달라고 요청하였고, 왕은 그에게 삼백 달란트를 약속하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 토파르키아는 행정 구역을 가리키는 전문 용어입니다. 그리스어는 일반적인 ‘지역’보다 더 구체적인 영토·행정 단위를 보존합니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἠξίωσεν
  english_pob_choice: asked
  chosen_korean: 요청하였고
  alternatives_korean:
  - 청하였고
  - 간청하였고
  - 요구하였고
  lexicon: LSJ
  rationale: 왕에게 올리는 공식적 청원이라는 점을 살려 ‘요청하다’로 옮겼습니다. ‘요구하다’는 강도가 지나치게 세고, ‘청하다’는 다소 구어적으로 약합니다.
- source_word: ποιῆσαι τὴν Ἰουδαίαν ἀφορολόγητον
  english_pob_choice: to make Judea tax-free
  chosen_korean: 유대를 조세 면제 지역으로
  alternatives_korean:
  - 유대를 세금 면제 상태로
  - 유대를 조세가 면제되게
  - 유대를 면세로
  lexicon: LSJ
  rationale: ἀφορολόγητον은 과세·조세 면제를 뜻하므로, 현대 한국어에서 의미가 분명한 ‘조세 면제’로 옮겼습니다. 행정적 상태를 나타내기 위해 ‘지역으로’를 보탰습니다.
- source_word: τὰς τρεῖς τοπαρχίας
  english_pob_choice: the three toparchies
  chosen_korean: 세 토파르키아
  alternatives_korean:
  - 세 행정 구역
  - 세 지방 관할구
  - 세 토파르키
  lexicon: LSJ
  rationale: 토파르키아는 고유한 행정 용어이므로 일반화하지 않고 음역을 유지했습니다. 영어 POB의 주석 취지를 따라 기술적 지명을 보존했습니다.
- source_word: ἐπηγγείλατο αὐτῷ τάλαντα τριακόσια
  english_pob_choice: he promised him three hundred talents
  chosen_korean: 왕은 그에게 삼백 달란트를 약속하였습니다
  alternatives_korean:
  - 왕은 그에게 삼백 달란트를 공약하였습니다
  - 왕은 그에게 삼백 달란트를 주기로 하였습니다
  - 왕은 그에게 삼백 달란트를 약속했습니다
  lexicon: LSJ
  rationale: ἐπηγγείλατο는 ‘약속하다’가 자연스럽고 정확합니다. τάλαντα는 고대 화폐·중량 단위를 현대 금액으로 환산하지 않고 ‘달란트’를 유지했습니다.
theological_decisions:
- issue: 왕에게 올리는 청원문의 화법
  chosen_reading: 서술문 안의 요청은 중립적 합쇼체로 처리하고, 왕의 발화는 없으므로 특별한 경어 전환은 두지 않았습니다.
  alternative_readings:
  - 요나단의 간청을 더 강하게 드러내는 표현
  - 왕에 대한 극존칭을 두드러지게 하는 표현
  rationale: 본문은 정치적 협상 서술이므로 과도한 종교적 문체를 피하고, 사실 서술에 맞는 현대적 합쇼체를 유지했습니다.
  doctrine_reference: 문체/서술 관례
- issue: 지명과 행정용어 보존
  chosen_reading: 토파르키아를 음역해 기술적 행정 용어의 성격을 유지했습니다.
  alternative_readings:
  - 행정 구역으로 일반화
  - 지역으로 완화
  rationale: 본문의 핵심은 단순한 지역 언급이 아니라 특정한 행정 단위이므로, 의미를 넓히지 않고 용어의 역사성을 살렸습니다.
  doctrine_reference: 역사서 본문 해석 원칙
