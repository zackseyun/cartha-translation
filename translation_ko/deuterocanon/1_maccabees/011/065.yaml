  - 전투를 벌이며
  - 공격하며
  lexicon: LSJ
  rationale: 미완료 과거의 진행성을 살려 단회적 공격보다 지속적 교전을 나타내는 ‘싸우며’로 옮겼습니다.
- source_word: συνέκλεισεν
  english_pob_choice: shut it in
  chosen_korean: 에워쌌습니다
  alternatives_korean:
