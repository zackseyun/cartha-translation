  lexicon: proper noun
  rationale: 그리스어형 지명 Βεθσούρᾳ를 현대 한국어 음역으로 옮기되, 본문 흐름을 위해 간결한 음가를 살렸습니다.
- source_word: ἐπολέμει
  english_pob_choice: fought against
  chosen_korean: 싸우며
