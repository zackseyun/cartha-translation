  text: And Simon encamped at Bethsura[a], and fought against it for many days, and shut it in.
  footnotes:
  - marker: a
    text: Or 'blockaded it' / 'hemmed it in.' The Greek verb means to shut in or enclose, likely describing siege containment.
    reason: lexical_alternative
translation:
  language: ko
  text: 시몬은 벳수르에 진을 치고, 여러 날 그곳을 상대로 싸웠으며, 그곳을 포위했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘봉쇄했습니다’, ‘가두었습니다’. 그리스어 동사는 ‘안에 가두다’, ‘에워싸다’를 뜻하며, 여기서는 포위망으로 고립시킨 것을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεβάλλεν
  english_pob_choice: encamped
  chosen_korean: 진을 치고
  alternatives_korean:
  - 캠프를 세우고
  - 주둔하고
  - 포위하고
  lexicon: LSJ
  rationale: 군사적 맥락에서 ‘진을 치다’는 장막을 펴고 전투 태세를 갖추는 뜻을 자연스럽게 살리며, 뒤의 ‘싸우며’와 ‘에워쌌습니다’와도 단계적으로 맞습니다.
- source_word: Βεθσούρᾳ
