  chosen_korean: 베츠르
  alternatives_korean:
  - 벧술
  - 베스수라
  lexicon: proper noun
  rationale: 그리스어형 지명 Βεθσούρᾳ를 현대 한국어 음역으로 옮기되, 본문 흐름을 위해 간결한 음가를 살렸습니다.
- source_word: ἐπολέμει
  english_pob_choice: fought against
  chosen_korean: 싸우며
  alternatives_korean:
  - 전쟁을 벌이며
  - 전투를 벌이며
  - 공격하며
  lexicon: LSJ
  rationale: 미완료 과거의 진행성을 살려 단회적 공격보다 지속적 교전을 나타내는 ‘싸우며’로 옮겼습니다.
- source_word: συνέκλεισεν
  english_pob_choice: shut it in
  chosen_korean: 에워쌌습니다
  alternatives_korean:
  - 가두었습니다
  - 봉쇄했습니다
  - 둘러쌌습니다
  lexicon: LSJ
  rationale: POB의 ‘shut it in’이 가리키는 포위·봉쇄의 의미를 한국어의 자연스러운 군사 표현 ‘에워쌌습니다’로 옮겼습니다.
theological_decisions:
- issue: 성읍을 향한 군사적 포위의 묘사
  chosen_reading: 직접적인 전투와 포위가 이어지는 역사 서술로 이해해, 과장이나 영적 비유를 덧붙이지 않았습니다.
  alternative_readings:
  - 단순히 ‘공격했다’로 축소
  - ‘포위했다’만으로 통일
  rationale: 본문은 ‘진을 침–싸움–에워쌈’의 연속을 통해 점진적 군사 압박을 묘사하므로, 각 동작을 구분해 보존했습니다.
  doctrine_reference: 본문 역사 서술 원칙
