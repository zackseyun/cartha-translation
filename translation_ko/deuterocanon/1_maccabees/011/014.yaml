lexical_decisions:
- source_word: Ἀλέξανδρος δὲ ὁ βασιλεὺς
  english_pob_choice: King Alexander
  chosen_korean: 알렉산더 왕
  alternatives_korean:
  - 왕 알렉산더
  - 알렉산더
  lexicon: LSJ
  rationale: 고유명사와 왕의 칭호를 자연스러운 현대 한국어 어순으로 옮기되, άρθρον이 붙은 βασιλεὺς의 지칭성을 살려 ‘왕’을 분명히 표시했습니다.
- source_word: ἦν ἐν Κιλικίᾳ
  english_pob_choice: was in Cilicia
  chosen_korean: 길리기아에 있었는데
  alternatives_korean:
  - 길리기아에 있었으며
  - 길리기아에 있었습니다
  lexicon: LSJ
  rationale: ἐν + 지명은 단순한 위치를 나타내므로 ‘~에 있다’로 옮겼고, 앞뒤 관계를 자연스럽게 잇기 위해 연결 어미 ‘-었는데’를 사용했습니다.
- source_word: κατὰ τοὺς καιροὺς ἐκείνους
  english_pob_choice: in those days
  chosen_korean: 그 무렵
  alternatives_korean:
  - 그 시절에
  - 그때
  lexicon: LSJ
  rationale: 복수형 καιρούς의 관용적 시점 표현을 한국어의 시간 부사구로 압축해, 직역의 어색함을 피하면서도 시간적 배경을 보존했습니다.
- source_word: οἱ ἀπὸ τῶν τόπων ἐκείνων
  english_pob_choice: those from those regions
  chosen_korean: 그 지방 출신들
  alternatives_korean:
  - 그 지역들에서 온 사람들
  - 그곳 출신들
  lexicon: LSJ
  rationale: 문자적으로는 ‘그곳들로부터 온 이들’이지만, 집합적으로 사람들을 가리키는 말이므로 ‘출신들’로 옮겨 중복을 줄이면서 지리적 출처를 유지했습니다.
- source_word: ἀπεστάτουν
  english_pob_choice: were rebelling
  chosen_korean: 반란을 일으키고 있었기 때문입니다
  alternatives_korean:
  - 반란 중이었기 때문입니다
  - 반역하고 있었기 때문입니다
  lexicon: LSJ
  rationale: 미완료과거는 진행 중인 상태를 나타내므로 ‘~하고 있었다’로 반영했고, ἀποστατέω 계열의 정치적 반역 의미를 살려 ‘반란을 일으키다’로 옮겼습니다.
