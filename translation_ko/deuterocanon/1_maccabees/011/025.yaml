  text: And some lawless men from the nation were making accusations against him[a].
  footnotes:
  - marker: a
    text: Or 'were petitioning against him,' that is, bringing a complaint before authority. The Greek verb can denote an appeal or petition; in this context it is hostile and so is rendered as accusation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 나라의 몇몇 무법한 자들이 그를 고발하고 있었습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 상대로 청원하고 있었던,’ 곧 당국 앞에 불만을 제기하고 있었던 뜻입니다. 그리스어 동사는 호소나 청원을 뜻할 수 있으나, 이 문맥에서는 적대적이어서 ‘고발하다’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνετύγχανον
  english_pob_choice: were making accusations
  chosen_korean: 고발하고 있었습니다
  alternatives_korean:
  - 청원하고 있었습니다
  - 호소하고 있었습니다
  lexicon: LSJ/BDAG
  rationale: 문맥상 κατʼ αὐτοῦ('그를 향해/그에게 반대하여')와 결합되어 중립적 청원보다 적대적 고발의 뜻이 더 강하므로, 진행상을 살린 ‘-고 있었습니다’로 옮겼습니다.
- source_word: κατʼ αὐτοῦ
  english_pob_choice: against him
  chosen_korean: 그를
  alternatives_korean:
  - 그에게 반하여
  - 그에 대하여
  lexicon: LSJ/BDAG
  rationale: 전치사 κατά의 반대·적대 방향을 한국어에서는 동사 ‘고발하다’에 내포시키는 것이 자연스러워, 본문에서는 간결하게 처리했습니다.
- source_word: ἄνομοι
  english_pob_choice: lawless men
  chosen_korean: 무법한 자들
  alternatives_korean:
  - 법 없는 자들
  - 불법한 사람들
  - 악한 자들
  lexicon: LSJ
  rationale: 법과 질서를 무시하는 사람들이라는 moral-legal 뉘앙스를 살리되, 현대 한국어에서 ‘무법한’이 가장 직접적이고 강한 대응어입니다.
- source_word: τῶν ἐκ τοῦ ἔθνους
  english_pob_choice: from the nation
  chosen_korean: 그 나라의
  alternatives_korean:
  - 민족 가운데의
  - 그 민족에서 나온
  - 그 백성 가운데의
  lexicon: LSJ
  rationale: 1 Maccabees의 ἔθνος는 여기서 이방인이 아니라 특정 민족/국가 집단을 가리키므로, 직역에 가까운 ‘그 나라의’로 옮겨 소속감을 유지했습니다.
theological_decisions:
