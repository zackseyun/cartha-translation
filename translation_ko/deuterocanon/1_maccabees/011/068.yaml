  verdict: revise
  source_fidelity: 원문의 ἐξέβαλον ἔνεδρον은 ‘매복을 배치하다/두다’라는 전술 행위를 뜻합니다. 초안의 ‘그를 치려 하였으며’는 매복의 목적을 해설적으로 덧붙여 원문보다 의도를 명시합니다. 또한 마지막 절은 ‘정면에서’보다 공간적으로 ‘맞은편에서’가 더 직접적입니다.
  naturalness: ‘이방인들의 진영’, ‘평지에서 그와 맞닥뜨렸습니다’, ‘산지에 그를 겨냥한 매복을 배치하였고’는 현대 한국어의 격식 있는 서사 문체에서 자연스럽습니다. ‘자기들은’은 다소 구어적이므로 ‘그들 자신은’으로 고쳤습니다.
  terminology: παρεμβολή는 군사 맥락의 ‘진영’으로 유지하고, ἀλλόφυλοι는 특정 민족으로 한정하지 않는 ‘이방인들’로 유지합니다. ἐξ ἐναντίας는 해석을 과도하게 전술화하지 않고 ‘맞은편에서’로 옮겼습니다.
  issues:
  - severity: medium
    issue: ‘그를 치려 하였으며’가 원문에 없는 의도를 보탭니다.
    rationale: ἐξέβαλον ἔνεδρον ἐπʼ αὐτόν은 그를 대상으로 매복을 배치했다는 뜻이지, 별도의 의도 표현을 명시하지 않습니다.
  - severity: low
    issue: ‘정면에서’는 ἐξ ἐναντίας의 공간적 표현을 다소 전술적으로 좁힙니다.
    rationale: ‘맞은편에서’가 ‘반대쪽에서/마주하여’라는 원문의 여지를 더 잘 보존합니다.
