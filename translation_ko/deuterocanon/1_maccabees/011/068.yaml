  yaml_path: translation/deuterocanon/1_maccabees/011/068.yaml
  text: And behold[a], a camp of foreigners met him in the plain, and they set an ambush against him in the mountains, while they themselves advanced from the front.
  footnotes:
  - marker: a
    text: Or 'laid an ambush against him in the mountains, while they themselves met him head-on.' The final clause can be rendered more literally as 'they themselves met from the opposite side.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 보십시오, 이방인의 진영이 평지에서 그를 맞이하였고, 그들은 산지에 매복을 놓아 그를 치려 하였으며, 자기들은 정면에서 맞섰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘산지에 그를 향해 매복을 놓았으며, 그들 자신은 정면으로 맞닥뜨렸다.’ 마지막 절은 더 문자적으로 ‘그들 자신은 반대편에서 맞섰다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεμβολὴ
  english_pob_choice: camp
  chosen_korean: 진영
  alternatives_korean:
  - 캠프
  - 야영지
  - 부대
  lexicon: LSJ
  rationale: 군사적 집결지를 가리키는 말로서 한국어에서는 ‘진영’이 간결하면서도 전투 맥락을 잘 살립니다.
- source_word: ἀλλοφύλων
  english_pob_choice: foreigners
  chosen_korean: 이방인
  alternatives_korean:
  - 외국인
  - 다른 민족 사람들
  - 타민족
  lexicon: LSJ
  rationale: 여기서는 특정 민족명보다 ‘다른 민족에 속한 사람들’이라는 일반적 대립을 나타내므로, 문맥상 ‘이방인’이 가장 자연스럽습니다.
- source_word: ἐξέβαλον ἔνεδρον ἐπʼ αὐτόν
  english_pob_choice: set an ambush against him
  chosen_korean: 그를 치려 하였으며, … 매복을 놓아
  alternatives_korean:
  - 그에 대하여 매복을 설치하였으며
  - 그를 향해 복병을 두었으며
  lexicon: LSJ
  rationale: 직역형 ‘매복을 놓다’로 기본 의미를 살리고, 목적 방향을 ‘그를 치려 하였으며’로 풀어 한국어 군사 서술로 자연스럽게 옮겼습니다.
- source_word: ἐξ ἐναντίας
  english_pob_choice: advanced from the front
  chosen_korean: 정면에서 맞섰습니다
  alternatives_korean:
  - 맞은편에서 나왔습니다
  - 정반대편에서 맞닥뜨렸습니다
  - 정면으로 다가왔습니다
  lexicon: LSJ
  rationale: 문자적으로는 ‘맞은편/반대편’이지만, 앞선 매복과 대비되는 전술적 움직임을 한국어로 분명히 하기 위해 ‘정면에서 맞섰습니다’로 옮겼습니다.
theological_decisions:
- issue: 전투 서술의 대비 구조
  chosen_reading: 산지의 매복과 평지의 정면 대응을 대비시키는 전술적 묘사로 읽었습니다.
  alternative_readings:
  - 단순히 서로 마주친 상황으로 읽을 수 있습니다.
  - ‘맞은편에서’라는 공간적 표현으로 더 직역할 수 있습니다.
  rationale: 문맥상 동사의 반복과 장소 대비가 핵심이므로, 사건의 긴장을 살리는 방향으로 전술적 대조를 드러냈습니다.
  doctrine_reference: 문학적-서사적 문맥 해석
- issue: ἀλλοφύλων의 범주
  chosen_reading: 여기서는 블레셋인 고유명사가 아니라 적대적 ‘다른 민족’ 일반을 가리키는 표현으로 보았습니다.
  alternative_readings:
  - 블레셋으로 특정할 수 있습니다.
  - 그냥 외국 군대로 옮길 수 있습니다.
  rationale: 마카비서의 이 구절에서는 역사적 적군을 일반화한 표현이므로, 본문이 주는 민족적 타자성을 유지하는 것이 좋습니다.
  doctrine_reference: 역사-문맥적 독해
