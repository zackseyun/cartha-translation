base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/054.yaml
  text: After these things Tryphon returned[a], and Antiochus with him, a younger boy[b]; and he became king and put on the crown.
  footnotes:
  - marker: a
    text: Or 'a younger child' or 'a very young boy.' The Greek παιδάριον νεώτερον emphasizes Antiochus's youth.
    reason: lexical_alternative
  - marker: b
    text: Literally 'put on the diadem.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일들이 있은 뒤에 트리폰은 돌아왔고, 안티오코스도 그와 함께 있었는데, 더 어린 소년이었습니다. 그는 왕이 되었고 관을 썼습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘더 어린 아이’나 ‘아주 어린 소년’으로 옮길 수 있습니다. 헬라어 παιδάριον νεώτερον은 안티오코스의 어린 나이를 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘디아뎀을 썼습니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
