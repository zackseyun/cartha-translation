  rationale: διάδημα의 왕권 상징을 한국어에서 가장 자연스럽게 전달하는 말은 ‘관’이며, 동작은 ‘썼습니다’로 옮겨 중립적인 착용 의미를 살렸습니다.
theological_decisions:
- issue: ἐβασίλευσεν의 왕위 즉위 뉘앙스
  chosen_reading: 그는 왕이 되었고
  alternative_readings:
