  rationale: 이 절은 역사 서술이므로, 즉위와 왕권 획득의 맥락을 분명히 드러내는 ‘왕이 되었고’가 가장 적절합니다. 바로 뒤의 ‘관을 썼습니다’와도 자연스럽게 맞물립니다.
