    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέστρεψεν πρὸς αὐτοὺς πόλεμον
  english_pob_choice: turned back against them in battle
  chosen_korean: 그들에게 전쟁을 걸러 돌아서서
  alternatives_korean:
  - 그들에게 맞서 돌아서서
  - 그들과 싸우려고 되돌아가서
  - 전쟁을 일으키려고 그들에게 돌아서서
  lexicon: LSJ
  rationale: ἔστρεψεν/ἐπέστρεψεν과 πρός + 목적어 + πόλεμος의 압축된 군사적 관용을 한국어에서 직접 살리되, 단순한 '돌아왔다'보다 적대적 재돌입을 분명히 드러내려 했습니다.
- source_word: ἐτροπώσατο
  english_pob_choice: routed
  chosen_korean: 그들을 무찔렀고
  alternatives_korean:
  - 그들을 패주시켰고
  - 그들을 궤멸시켰고
  - 그들을 무너뜨렸고
  lexicon: LSJ
  rationale: 이 동사는 적을 패주시키거나 도주하게 만드는 군사적 승리를 뜻하므로, 이어지는 '도망쳤습니다'와 맞물리도록 '무찔렀고'로 옮겼습니다.
- source_word: ἔφυγον
  english_pob_choice: they fled
  chosen_korean: 그들은 도망쳤습니다
  alternatives_korean:
  - 그들은 달아났습니다
  - 그들은 도주했습니다
  - 그들은 도망하였습니다
  lexicon: LSJ
  rationale: 아오리스트 서술의 간명함을 살려, 군사 문맥에 자연스러운 평서형으로 옮겼습니다.
