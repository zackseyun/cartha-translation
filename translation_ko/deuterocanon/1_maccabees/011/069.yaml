translation:
  language: ko
  text: 그러나 매복한 자들이 자기들이 있던 자리에서 일어나 전투를 벌였고, 요나단과 함께하던 모든 이가 도망쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로는 ‘매복들이/매복한 자들이 일어났다’에 가깝지만, 여기서는 전술 자체보다 숨어 있던 전투원들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔνεδρα
  english_pob_choice: the ambushes / the men in ambush
  chosen_korean: 매복한 자들
  alternatives_korean:
  - 매복들
  - 매복해 있던 사람들
  - 매복병들
  lexicon: LSJ
  rationale: ἔνεδρα는 추상명사처럼 보이지만 여기서는 ἐξανέστησαν(일어나다)와 결합하여 실제 전투원들을 가리키므로, 자연스러운 한국어로 인적 주체를 드러내되 의미를 과도하게 확장하지 않는 ‘매복한 자들’이 적절합니다.
- source_word: ἐξανέστησαν
  english_pob_choice: rose up
  chosen_korean: 일어났습니다
  alternatives_korean:
  - 튀어나왔습니다
  - 일어섰습니다
  - 나섰습니다
  lexicon: LSJ
  rationale: 숨은 곳에서 밖으로 움직여 전투에 가담하는 동작을 한국어로 간결하게 살리기 위해 ‘일어났습니다’를 선택했습니다.
- source_word: συνῆψαν πόλεμον
  english_pob_choice: joined battle
  chosen_korean: 전투를 벌였고
  alternatives_korean:
  - 전투에 가담했고
  - 싸움을 벌였고
  - 전쟁을 시작했고
  lexicon: LSJ
  rationale: 직역하면 ‘전쟁을 결합하다’이지만, 전투 장면에서는 개시된 교전을 뜻하므로 ‘전투를 벌이다’가 가장 자연스럽고 원문의 군사적 의미를 유지합니다.
- source_word: οἱ παρὰ Ἰωνάθαν πάντες
  english_pob_choice: all those with Jonathan
  chosen_korean: 요나단과 함께하던 모든 이
  alternatives_korean:
  - 요나단 곁에 있던 모든 사람
  - 요나단 편에 있던 모든 사람
  - 요나단의 모든 사람
  lexicon: LSJ
  rationale: παρά + 인명은 단순 동반자를 뜻하므로 소유격보다 ‘함께하던’이 더 정확하며, πάντες의 포괄성을 살리기 위해 ‘모든 이’를 사용했습니다.
