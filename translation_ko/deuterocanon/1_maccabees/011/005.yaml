base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/005.yaml
  text: And they reported to the king what Jonathan had done[a], in order to accuse him; but the king kept silent.
  footnotes:
  - marker: a
    text: Or 'in order to bring reproach on him' or 'in order to blame him.' The Greek verb can denote censure or disparagement as well as formal accusation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 왕에게 요나단이 한 일을 보고하여 그를 고발하려 하였으나, 왕은 잠잠하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 책망하려고’ 혹은 ‘그를 비난하려고’로 옮길 수 있습니다. 이 동사는 공식적인 고발뿐 아니라 책망이나 폄하의 뜻도 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διηγήσαντο
  english_pob_choice: reported
  chosen_korean: 보고하여
  alternatives_korean:
  - 전하여
  - 말하여
  - 자세히 전하여
  lexicon: LSJ
  rationale: 왕 앞에서의 발화이므로 단순한 ‘말하다’보다 공식적으로 사실을 전달하는 뉘앙스의 ‘보고하다’를 살렸습니다.
- source_word: ἃ ἐποίησεν
  english_pob_choice: what Jonathan had done
  chosen_korean: 요나단이 한 일
  alternatives_korean:
  - 요나단이 행한 일
  - 요나단이 한 것
  - 요나단이 했던 일
  lexicon: Greek grammar
  rationale: 관계절의 내용이 요나단의 행위를 가리키므로, 한국어에서는 자연스럽게 ‘한 일’로 옮겼습니다.
- source_word: εἰς τὸ ψογίσαι
  english_pob_choice: in order to accuse
  chosen_korean: 그를 고발하려 하였으나
  alternatives_korean:
  - 그를 책망하려 하였으나
  - 그를 비난하려 하였으나
  - 그를 비방하려 하였으나
  lexicon: LSJ
  rationale: ψογίζω의 ‘비난/책망/고발’ 범위를 반영하되, 왕에게 올리는 정치적 불리한 보고라는 문맥에서는 ‘고발하다’가 가장 직접적입니다.
- source_word: ἐσίγησεν
  english_pob_choice: kept silent
  chosen_korean: 잠잠하였습니다
  alternatives_korean:
  - 침묵하였습니다
  - 아무 말도 하지 않았습니다
  - 말이 없었습니다
  lexicon: LSJ
  rationale: 단순 상태보다 의도적 무응답을 드러내는 표현으로, 서사 흐름에 맞는 ‘잠잠하다’를 선택했습니다.
