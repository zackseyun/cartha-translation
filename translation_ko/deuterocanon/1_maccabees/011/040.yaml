  yaml_path: translation/deuterocanon/1_maccabees/011/040.yaml
  text: And he stayed close to him[a], so that he might hand him over to him, so that he might reign in place of his father. And they reported to him all that Demetrius had done, and the hostility with which his forces were hostile to him; and he remained there many days.
  footnotes:
  - marker: a
    text: 'The Greek wording is repetitive and somewhat awkward: literally, ''the hostility which his forces are hostile to him.'' The translation keeps the sense that Demetrius''s own forces were acting against him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그에게 가까이 머물렀습니다[a], 그를 그에게 넘겨 주어 그가 자기 아버지 대신 다스리게 하려는 것이었습니다. 사람들은 그에게 데메트리오가 한 모든 일과 그의 군대가 그에게 품은 적대감을 보고했습니다. 그는 거기에 여러 날 머물렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 표현이 다소 반복적이고 어색합니다. 직역하면 ‘그의 군대가 그에게 품는 적대감’에 가깝지만, 의미는 데메트리오의 군대가 그에게 대항하고 있었다는 점입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσήδρευσεν
  english_pob_choice: stayed close to
  chosen_korean: 가까이 머물렀습니다
  alternatives_korean:
  - 곁에 머물렀습니다
  - 가까이 붙어 있었습니다
  - 상석에 앉아 있었습니다
  lexicon: LSJ
  rationale: 정치적 맥락에서 단순한 물리적 동반보다 ‘가까이 머물다’가 관계적 밀착과 접근을 함께 살리며, 영어 POB의 의미도 자연스럽게 반영합니다.
- source_word: παραδοῖ αὐτὸν αὐτῷ
  english_pob_choice: hand him over to him
  chosen_korean: 그를 그에게 넘겨 주어
  alternatives_korean:
  - 그를 그에게 인도하여
  - 그를 그에게 넘겨
  - 그를 그의 손에 맡겨
  lexicon: BDAG
  rationale: παραδίδωμι의 핵심인 ‘넘겨 주다’는 정치적 배신/인도 의미를 가장 직접적으로 드러내며, 반복된 대명사 구조도 유지할 수 있습니다.
- source_word: βασιλεύσῃ ἀντὶ τοῦ πατρὸς αὐτοῦ
  english_pob_choice: reign in place of his father
  chosen_korean: 자기 아버지 대신 다스리게
  alternatives_korean:
  - 자기 아버지 대신 통치하게
  - 아버지의 뒤를 이어 왕이 되게
  - 아버지를 대신하여 왕 노릇하게
  lexicon: LSJ
  rationale: ἀντί의 대체·승계 의미를 ‘대신’으로 살리고, βασιλεύσῃ는 왕권 맥락을 과하게 풀지 않으면서 ‘다스리다’로 옮겼습니다.
- source_word: αἱ δυνάμεις αὐτοῦ
  english_pob_choice: his forces
  chosen_korean: 그의 군대
  alternatives_korean:
  - 그의 병력
  - 그의 무리
  - 그의 세력
  lexicon: LSJ
  rationale: 여기서는 군사·정치적 맥락이 분명하므로 δυνάμεις를 ‘군대’로 옮겨 실질적인 무장 세력을 분명하게 드러냈습니다.
theological_decisions:
- issue: 문장 말미의 반복적·다소 어색한 그리스어 표현(‘그의 군대가 그에게 적대감을 품다’)을 얼마나 직역할지
  chosen_reading: 의미를 유지하되 한국어로는 ‘그의 군대가 그에게 품은 적대감’이라고 옮겨 반복을 과도하게 매끄럽게 지우지 않았습니다.
  alternative_readings:
  - ‘그의 군대가 그를 향해 적대적이었다’
  - ‘그의 군대가 그에게 적의를 품었다’
  rationale: 본문은 명사-동사 어근 반복으로 비정상적인 문형을 유지하므로, 의미를 분명히 하되 ‘적대감’이라는 명사형을 남겨 원문의 거친 질감을 보존했습니다.
  doctrine_reference: source-text integrity; 번역 원리
- issue: 왕위 계승의 표현을 ‘왕이 되다’가 아니라 ‘다스리다’로 처리할지
  chosen_reading: 왕권 승계의 사실은 살리되, 본문 자체가 직설적으로 ‘왕’ 명칭을 주기보다 통치 행위를 말하므로 ‘다스리다’로 처리했습니다.
  alternative_readings:
  - ‘왕이 되게 하려는 것이었습니다’
  - ‘그가 그의 아버지 대신 왕 노릇하게 하려는 것이었습니다’
  rationale: βασιλεύω의 통치 동사를 살리면서도 한국어에서 과도한 해석을 피했습니다. 문맥상 승계는 분명하나, 원문이 서술하는 것은 ‘통치’ 행위입니다.
  doctrine_reference: source-text integrity; historical narrative register
