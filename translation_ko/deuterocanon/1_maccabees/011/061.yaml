base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/061.yaml
  text: And he went from there to Gaza[a], and the men of Gaza shut him out; and he encamped around it, and burned its outlying parts with fire[b], and plundered them.
  footnotes:
  - marker: a
    text: Or 'he besieged it.' The Greek literally says he 'encamped/sat around it.'
    reason: lexical_alternative
  - marker: b
    text: The phrase rendered 'its outlying parts' is difficult; it may refer to the areas around Gaza, such as its environs or suburbs.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 그곳을 떠나 가자로 갔습니다. 가자 사람들은 그를 막아 버렸습니다. 그래서 그는 그 주위에 진을 쳤고, 그 성의 주변 지역을 불로 태웠으며, 그것들을 약탈했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 주위에 앉다/진을 치다’의 뜻이어서, 포위 전술을 가리키는 말로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 성의 주변 지역’으로 옮긴 표현은 해석이 어려운 τὰ περίπολα αὐτῆς를 넓게 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν
  english_pob_choice: went
  chosen_korean: 떠나 ... 갔습니다
  alternatives_korean:
  - 갔습니다
  - 출발했습니다
  lexicon: LSJ
  rationale: 단순한 이동의 서술이므로, 자연스러운 현대 한국어로는 ‘떠나 갔습니다’가 출발의 의미를 살리면서도 문맥에 맞습니다.
- source_word: ἀπέκλεισαν
  english_pob_choice: shut him out
  chosen_korean: 그를 막아 버렸습니다
  alternatives_korean:
  - 그를 막았습니다
  - 그를 밖으로 내쫓았습니다
  - 그에게 문을 닫아걸었습니다
  lexicon: LSJ
  rationale: 접근을 차단하는 적대적 행동을 표현해야 하므로, ‘막아 버렸습니다’가 ‘shut him out’의 폐쇄성과 긴박함을 잘 드러냅니다.
- source_word: περιεκάθισεν περὶ αὐτήν
  english_pob_choice: he encamped around it
  chosen_korean: 그 주위에 진을 쳤고
  alternatives_korean:
  - 그것을 포위했고
  - 그 둘레에 앉았고
  - 그 주위에 진을 쳤습니다
  lexicon: LSJ
  rationale: 직역하면 ‘둘레에 앉다/진을 치다’의 이미지가 있으므로, 군사적 맥락에서 ‘진을 쳤다’가 가장 자연스럽고 원문의 그림도 유지합니다.
- source_word: τὰ περίπολα αὐτῆς
  english_pob_choice: its outlying parts
  chosen_korean: 그 성의 주변 지역
  alternatives_korean:
  - 그 성의 외곽 지역
  - 그 주변 구역
  - 그 성의 변두리
  lexicon: LSJ
  rationale: 이 표현은 해석이 어려운 구문이어서, POB의 ‘outlying parts’를 따라 성 바깥의 주변 지역이라는 넓은 의미를 살렸습니다.
- source_word: ἐνεπύρισεν ... ἐν πυρί
  english_pob_choice: burned ... with fire
  chosen_korean: 불로 태웠으며
  alternatives_korean:
  - 불에 태웠으며
  - 불을 질렀으며
  - 불로 불태웠으며
  lexicon: LSJ
  rationale: ‘ἐν πυρί’의 강조를 과도하게 풀지 않으면서도 한국어로는 ‘불로 태우다’가 가장 직접적이고 간결합니다.
- source_word: ἐσκύλευσεν
  english_pob_choice: plundered
  chosen_korean: 약탈했습니다
  alternatives_korean:
  - 노략질했습니다
  - 전리품을 취했습니다
  - 약탈하여 가져갔습니다
  lexicon: LSJ
  rationale: 전쟁 서술에서의 약탈 행위를 분명히 드러내기 위해, 현대 한국어에서 직관적인 ‘약탈했습니다’를 선택했습니다.
theological_decisions:
- issue: 전쟁 서술의 폭력성 표현
  chosen_reading: 군사 행동을 완화하지 않고 ‘진을 치다’, ‘불로 태우다’, ‘약탈하다’로 직접 옮겼습니다.
  alternative_readings:
  - ‘포위하다’로 완화해 옮김
  - ‘훼손하다’처럼 중화된 표현 사용
  rationale: 본문은 실제 전투/보복 행위를 서술하므로, 의미를 약화하지 않고 독자가 사건의 강도를 그대로 이해하도록 해야 합니다.
  doctrine_reference: source fidelity / narrative transparency
