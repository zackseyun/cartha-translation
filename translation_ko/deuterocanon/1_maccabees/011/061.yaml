review_pass:
  verdict: revise
  source_fidelity: 전반적으로 원문의 이동, 접근 차단, 포위·주둔, 방화, 약탈의 순서를 충실히 전달합니다. 다만 ἀπέκλεισαν은 단순히 물리적으로 ‘막아 버렸다’기보다 가자 측이 그가 들어오지 못하도록 차단했다는 뜻이므로 이를 더 명확히 옮기는 것이 좋습니다. τὰ περίπολα의 지시 대상은 복수이므로 뒤의 약탈 대상도 ‘지역들’로 받는 편이 원문에 더 가깝습니다.
  naturalness: 합쇼체 문체는 대체로 자연스럽습니다. 그러나 ‘막아 버렸습니다’의 ‘버리다’는 현대 구어적 강조를 더하므로, 본문의 절제된 군사 서술에는 ‘들어오지 못하게 했습니다’가 더 자연스럽고 정확합니다. 각주 표지는 해당 어구 바로 뒤에 두는 것이 독자의 이해에 좋습니다.
  terminology: ‘진을 쳤고’, ‘불로 태웠으며’, ‘약탈했습니다’는 군사 서술에 적절합니다. 논란의 여지가 있는 τὰ περίπολα는 ‘주변 지역’으로 넓게 유지하고 각주에서 불확실성을 밝혀야 합니다.
  issues:
