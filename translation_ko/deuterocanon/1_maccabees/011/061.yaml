    issue: ‘그를 막아 버렸습니다’는 접근 차단의 구체적 의미와 문체적 절제를 충분히 반영하지 못합니다.
    rationale: ἀπέκλεισαν은 그를 배제하거나 प्रवेश을 막았다는 뜻입니다. ‘그가 들어오지 못하게 했습니다’는 한국어에서 그 의미를 명확하게 전달하며, ‘버리다’가 더하는 구어적·완결적 뉘앙스를 피합니다.
