translation:
  language: ko
  text: 우리에게 오른손을 내어 주십시오. 그리고 유대인들이 우리와 그 도시를 상대로 싸우는 일을 그치게 해 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘우리에게 오른손을 내어 주십시오’라는 뜻으로, 평화·동맹·선의의 서약을 제시하는 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: Δὸς
  english_pob_choice: Give
  chosen_korean: 주십시오
  alternatives_korean:
  - 주시옵소서
  - 주십시오요
  lexicon: LSJ
  rationale: 직접적인 요청/명령형을 현대 공손체로 옮기되, 고어적 종교문체는 피했습니다.
- source_word: δεξιάς
  english_pob_choice: your right hands
  chosen_korean: 오른손
  alternatives_korean:
