  - 평화의 담보
  lexicon: LSJ
  rationale: 그리스어의 관용구적 이미지가 ‘오른손’이므로 이를 살리고, 한국어에서는 자연스럽게 단수로 정리했습니다. 문맥상 평화·동맹의 담보라는 함의는 본문을 덮지 않도록 주석으로 처리합니다.
- source_word: παυσάσθωσαν
  english_pob_choice: let ... stop
  chosen_korean: 그치게 하십시오
  alternatives_korean:
  - 멈추게 하십시오
  - 중단하게 하십시오
  lexicon: LSJ
  rationale: 제3인칭 명령의 뉘앙스를 한국어에서 자연스럽게 나타내는 동사로 옮겼습니다.
- source_word: πολεμοῦντες
  english_pob_choice: fighting against
  chosen_korean: 싸우는 일을
  alternatives_korean:
