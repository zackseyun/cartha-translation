  - ‘화친의 증표’로 해석
  rationale: 영어 POB가 지적한 문화적 관용을 본문에 남겨 독자가 원문의 체감적 이미지를 보도록 했습니다.
  doctrine_reference: 본문의 문화적 표현 처리 원칙
