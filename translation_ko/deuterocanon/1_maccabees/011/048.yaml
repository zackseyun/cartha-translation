translation:
  language: ko
  text: 그들은 그 도시를 불태우고, 그날 많은 전리품을 빼앗았으며, 왕을 구해 냈습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνεπύρισαν
  english_pob_choice: set the city on fire
  chosen_korean: 그 도시를 불태우고
  alternatives_korean:
  - 그 도시에 불을 지르고
  - 그 도시를 태우고
  lexicon: LSJ
  rationale: ἐνεπύρισαν은 사물을 타게 만드는 사역적 의미이므로, 현대 한국어에서는 자연스럽고 직접적인 ‘불태우다’로 옮기는 것이 가장 적절합니다.
- source_word: πόλιν
  english_pob_choice: city
  chosen_korean: 그 도시
  alternatives_korean:
  - 그 성읍
  - 그 마을
  lexicon: LSJ
  rationale: πόλις는 기본적으로 ‘도시’를 뜻하므로, 규모를 임의로 낮추는 ‘마을’보다 직접적인 ‘도시’가 원문에 가깝습니다.
- source_word: σκῦλα πολλὰ
  english_pob_choice: much plunder
  chosen_korean: 많은 전리품을
  alternatives_korean:
  - 많은 노획물을
  - 많은 약탈물을
  lexicon: LSJ
  rationale: σκῦλα는 전쟁에서 빼앗은 전리품·노획물을 가리키므로, 군사적 맥락을 살린 ‘전리품’이 적절합니다.
- source_word: ἔσωσαν
  english_pob_choice: saved
  chosen_korean: 구해 냈습니다
  alternatives_korean:
  - 구원했습니다
  - 구출했습니다
  lexicon: LSJ
  rationale: 여기서는 왕을 위험에서 빼내는 구체적 행위를 가리키므로, 상황을 분명히 드러내는 ‘구해 내다’가 가장 자연스럽습니다.
