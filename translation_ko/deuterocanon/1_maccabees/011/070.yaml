  source_fidelity: 핵심 서술과 예외 구문, 두 인물의 부자 관계, 군사 지휘관이라는 뜻은 대체로 충실합니다. 그러나 δυνάμεις에 원문에 없는 ‘전투’를 보태어 ‘전투 병력’으로 한 것은 의미를 불필요하게 한정합니다. 또한 στρατιά와 δυνάμεις의 결합은 정확한 뉘앙스가 단정되지 않으므로, 한국어에서도 중립적으로 보존하는 편이 안전합니다.
