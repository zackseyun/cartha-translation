  text: Not one of them was left[a], except Mattathias son of Absalom and Judas son of Chalphi, commanders of the forces of the army.
  footnotes:
  - marker: a
    text: Or 'commanders of the army troops.' The Greek combines two military terms (στρατιά, δυνάμεις), and the exact nuance of the pairing may be rendered in more than one natural English way.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들 가운데 한 사람도 남지 않았습니다. 다만 압살롬의 아들 마타티아와 칼피의 아들 유다만 남아 있었으며, 그들은 군대 병력의 지휘관들이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 στρατιά와 δυνάμεις라는 두 군사 용어를 함께 사용합니다. 이 표현은 ‘군대의 부대들의 지휘관들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ εἷς κατελείφθη ἀπʼ αὐτῶν
  english_pob_choice: Not one of them was left
  chosen_korean: 그들 가운데는 한 사람도 남지 않았습니다
  alternatives_korean:
  - 그들 가운데는 아무도 남지 않았습니다
  - 그들 중 한 사람도 남지 않았습니다
  lexicon: LSJ
  rationale: οὐδὲ εἷς의 강한 부정과 κατελείφθη의 수동 의미를 살려, 남은 사람이 전혀 없었다는 점을 자연스럽게 표현했습니다.
- source_word: πλὴν
  english_pob_choice: except
  chosen_korean: 다만
  alternatives_korean:
  - 오직
  - 제외하고는
  lexicon: LSJ
  rationale: 예외를 표시하는 접속사로서 '다만'이 문맥상 가장 간결하고 현대적입니다.
- source_word: ἄρχοντες τῆς στρατιᾶς τῶν δυνάμεων
  english_pob_choice: commanders of the forces of the army
  chosen_korean: 군대의 전투 병력의 지휘관들
  alternatives_korean:
  - 군대의 병력의 지휘관들
  - 군대의 부대 지휘관들
  - 전군의 지휘관들
  lexicon: LSJ
  rationale: ἄρχοντες는 군사 문맥에서 지휘관들이고, στρατιά와 δυνάμεις의 이중 군사 표현을 둘 다 살리기 위해 '군대'와 '전투 병력'으로 나누어 옮겼습니다.
- source_word: Ματταθίας ὁ τοῦ Ἀψαλώμου / Ἰούδας ὁ τοῦ Χαλφεί
  english_pob_choice: Mattathias son of Absalom / Judas son of Chalphi
  chosen_korean: 압살롬의 아들 맛다티아 / 칼피의 아들 유다
  alternatives_korean:
  - 맛다티아, 압살롬의 아들 / 유다, 칼피의 아들
  - 압살롬의 아들 마타티아 / 칼피의 아들 유다
  lexicon: LSJ
  rationale: 소유격 관계를 한국어의 친족 표지 '아들'로 옮겼고, 본문에 맞춰 고유명사는 통용 표기를 따랐습니다.
theological_decisions:
- issue: 전승 이름 표기와 문맥상 군사 묘사
  chosen_reading: 고유명사 표기는 한국어 성경에서 널리 쓰이는 음역을 따르고, 본문은 역사 서술로서 군사 지휘 체계를 직접적으로 드러내도록 옮겼습니다.
  alternative_readings:
  - 압살롬/칼피를 더 음역에 가깝게 표기하는 방식
  - 지휘관들을 '장관들'처럼 완곡하게 옮기는 방식
  rationale: 이 절은 신학적 쟁점보다 역사적·군사적 정보 전달이 핵심이므로, 원문의 정보 밀도를 유지하는 번역이 적절합니다.
  doctrine_reference: 역사 서술의 직역-의미 균형
