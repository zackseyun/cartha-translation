- source_word: ἕως Σελευκίας τῆς παραθαλασσίας
  english_pob_choice: as far as Seleucia-by-the-Sea
  chosen_korean: 시돈 해변의 셀레우키아까지
  alternatives_korean:
  - 바닷가의 셀레우키아까지
  - 해변의 셀레우키아까지
  lexicon: LSJ
  rationale: 지칭되는 도시를 구별하는 해안 지명 표현을 한국어로 옮기면서, 동일한 지시 기능을 유지하도록 했습니다. 본문 자체의 별칭은 지명 설명으로 처리했습니다.
- source_word: λογισμοὺς πονηρούς
  english_pob_choice: evil plans
  chosen_korean: 악한 계획을
  alternatives_korean:
  - 악한 꾀를
  - 악한 계략을
  - 사악한 계획을
  lexicon: LSJ
  rationale: λογισμοί가 여기서는 계산/의도/계획의 의미로 쓰이며, πονηρούς가 그 도덕적 악함을 분명히 하므로 ‘악한 계획’이 가장 직역에 가깝고도 읽기 자연스럽습니다.
- source_word: περὶ Ἀλεξάνδρου
  english_pob_choice: against Alexander
  chosen_korean: 알렉산드로스를 두고
  alternatives_korean:
  - 알렉산드로스에 관해
  - 알렉산드로스를 향해
  lexicon: LSJ
  rationale: 문자적으로는 ‘알렉산드로스에 관하여’이지만, 앞의 ‘악한 계획’과 결합될 때 적대적 대상이라는 문맥적 힘을 한국어에서 과도하게 해석하지 않으면서도 드러내도록 했습니다.
theological_decisions:
- issue: 문맥상 περὶ Ἀλεξάνδρου의 적대성 표현
  chosen_reading: ‘알렉산드로스를 두고’로 옮겨, 문자적 ‘관하여’의 형태를 유지하면서도 악의적 의도를 암시했습니다.
  alternative_readings:
  - ‘알렉산드로스에 관해’
  - ‘알렉산드로스를 향해’
  - ‘알렉산드로스를 상대로’
  rationale: POB 주석처럼 그리스어는 문자적으로는 ‘관하여’이지만, 문맥상 적대적 의도가 분명합니다. 한국어 본문에서는 과도한 해석어를 피하면서도 악의 대상임을 읽히게 하는 중간값을 택했습니다.
  doctrine_reference: 문맥적 의미와 수사적 적대성
