base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/008.yaml
  text: But King Ptolemy gained control of the cities of the coast as far as Seleucia-by-the-Sea[a], and he was devising evil plans against Alexander.
  footnotes:
  - marker: a
    text: Or 'was considering evil designs concerning Alexander.' The Greek περὶ Ἀλεξάνδρου is literally 'concerning Alexander,' but in context the sense is hostile.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 프톨레마이오스 왕은 해안의 도시들을 바닷가의 셀레우키아까지 장악하였고, 알렉산드로스를 상대로 악한 계략을 꾸미고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘알렉산드로스에 관하여 악한 계략을 생각하고 있었다.’ 그리스어 περὶ Ἀλεξάνδρου는 문자적으로 ‘알렉산드로스에 관하여’이지만, 문맥상 그를 겨냥한 적대적 뜻입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκυρίευσεν
  english_pob_choice: gained control of
  chosen_korean: 장악했고
  alternatives_korean:
