base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/007.yaml
  text: And Jonathan went with the king as far as the river called Eleutherus[a], and he returned to Jerusalem.
  footnotes:
  - marker: a
    text: Eleutherus is the proper name of a river marking a northern boundary region; the Greek simply says 'the river called Eleutherus.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 요나단은 왕과 함께 ‘엘레우테로스’[a]라고 불리는 강까지 갔다가 예루살렘으로 돌아왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘엘레우테로스’는 강의 고유명으로, 그리스어 원문은 단지 ‘엘레우테로스라고 불리는 강’이라고 말합니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπορεύθη
  english_pob_choice: went
  chosen_korean: 갔다
  alternatives_korean:
  - 가셨다
  - 이동했다
  - 여행했다
  lexicon: LSJ
  rationale: 단순한 서술적 이동을 나타내므로, 지나치게 격식적이거나 해설적인 표현보다 자연스러운 ‘갔다’가 원문의 행위를 가장 सीधे하게 옮깁니다.
- source_word: μετὰ τοῦ βασιλέως
  english_pob_choice: with the king
  chosen_korean: 왕과 함께
  alternatives_korean:
  - 왕과 동행하여
  - 왕과 더불어
  lexicon: LSJ
  rationale: 동행 관계를 분명하게 드러내면서도 현대 한국어 서술에 자연스러운 표현입니다.
- source_word: τοῦ καλουμένου Ἐλευθέρου
  english_pob_choice: called Eleutherus
  chosen_korean: ‘엘레우테로스’라고 불리는
  alternatives_korean:
  - ‘엘레우테로스’라 불리는
  - ‘엘레우테로스’라 하는
  lexicon: LSJ
  rationale: καλουμένου의 ‘불리는/이름 붙은’ 의미를 보존하고, 고유 지명은 번역하지 않고 음역해 처리했습니다.
- source_word: εἰς Ἰερουσαλήμ
  english_pob_choice: to Jerusalem
  chosen_korean: 예루살렘으로
  alternatives_korean:
  - 예루살렘에
  - 예루살렘까지
  lexicon: LSJ
  rationale: 도착 방향을 나타내는 εἰς를 한국어 이동 표현 ‘-으로’로 자연스럽게 옮겼습니다.
