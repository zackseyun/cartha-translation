  text: Now then[a], take care to make a copy of these things, and let it be given to Jonathan, and let it be placed on the holy mountain in a prominent place.
  footnotes:
  - marker: a
    text: Or 'in a conspicuous place.' The Greek expression suggests a location that is publicly noticeable or officially marked out.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 그러므로 이 일들의 사본을 만들어 두도록 주의하고, 그것을 요나단에게 주며, 거룩한 산의 눈에 띄는 곳에 두게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘눈에 잘 띄는 곳에’. 그리스어 표현은 공개적으로 눈에 띄거나 공식적으로 지정된 장소를 시사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  english_pob_choice: Now then
  chosen_korean: 이제 그러므로
  alternatives_korean:
  - 그러므로 이제
  - 자, 이제
  lexicon: LSJ
  rationale: 전환과 추론을 함께 나타내는 연결을 자연스러운 현대 한국어로 옮기면서, 명령문의 공적 어조를 살렸습니다.
- source_word: ἐπιμελεῖσθε
  english_pob_choice: take care
  chosen_korean: 주의하고
  alternatives_korean:
  - 힘써
  - 살펴
  lexicon: LSJ
  rationale: ‘주의하다’는 단순한 관심보다 실행의 정확성과 신중함을 강조하여 행정적 지시의 뉘앙스를 잘 드러냅니다.
- source_word: ἀντίγραφον
  english_pob_choice: a copy
  chosen_korean: 사본
  alternatives_korean:
  - 복사본
  - 필사본
  lexicon: LSJ
  rationale: 공식 문서의 ‘written copy’라는 뜻을 살려 한국어의 행정·문서 용어인 ‘사본’을 택했습니다.
- source_word: ἐν τόπῳ ἐπισήμῳ
  english_pob_choice: in a prominent place
  chosen_korean: 눈에 띄는 곳에
  alternatives_korean:
  - 공적으로 표시된 곳에
  - 드러난 곳에
  lexicon: LSJ
  rationale: ἐπίσημος는 단순한 지리적 위치보다 공적으로 잘 보이고 알아볼 수 있는 장소를 가리키므로, ‘눈에 띄는 곳’이 문맥을 가장 자연스럽게 반영합니다.
theological_decisions:
- issue: 거룩한 산의 표지성
  chosen_reading: ‘거룩한 산’은 예루살렘 성전산/시온을 가리키는 공적·성소적 표지로 유지하고, 장소의 공개성을 함께 살렸습니다.
  alternative_readings:
  - ‘거룩한 산’ 대신 ‘성산’
  - ‘눈에 띄는 곳’ 대신 ‘드러난 곳’
  rationale: 본문은 사본을 단지 보관하는 것이 아니라 거룩한 장소에 공식적으로 게시하라고 명하므로, 성스러운 지위와 공개적 가시성을 둘 다 보존해야 합니다.
  doctrine_reference: 성전산/시온의 성소적 표상과 공적 게시의 문맥
- issue: 명령문 재현
  chosen_reading: δοθήτω· τεθήτω를 한국어 청유형/명령형의 공문체로 옮겨 ‘주며, 두게 하십시오’로 재현했습니다.
  alternative_readings:
  - ‘주어라, 두어라’
  - ‘주게 하소서’
  rationale: 원문의 수동 명령형은 절차적·공적 지시이므로, 너무 구어적이거나 기도체로 기울지 않는 합쇼체 명령이 가장 적절합니다.
  doctrine_reference: 문서 지시문체와 행정 명령의 문법
