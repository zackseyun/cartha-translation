  lexicon: LSJ
  rationale: δύναμις는 여기서 추상적 ‘힘’보다 무장한 병력을 가리키므로, 군사적 규모를 살려 ‘큰 군세’로 옮겼습니다.
theological_decisions:
- issue: 직무 해임의 의미
  chosen_reading: 마카베오기의 정치·군사 문맥에서 ‘그를 직무에서 해임하다’는 공식적 지위 박탈을 뜻하는 표현으로 읽었습니다.
  alternative_readings:
  - 그를 자리에서 몰아내려는 뜻
  - 그를 임무에서 돌려세우려는 뜻
  rationale: POB의 주석처럼 τῆς χρείας는 직책/기능을 가리킬 수 있으므로, 권력 투쟁의 맥락을 흐리지 않으면서도 공적 직무 박탈의 의미를 유지했습니다.
  doctrine_reference: 문맥상 해석 문제이며 교리 쟁점은 없습니다.
