translation:
  language: ko
  text: 그리고 요나단은 데메트리오스의 지휘관들이 큰 군세를 거느리고 갈릴리의 케데스에 와서 그를 직무에서 해임하려 한다는 소식을 들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 직책에서 끌어내리려는’ 뜻일 수 있습니다. 그리스어 구절은 그에게 맡겨진 기능이나 직무에서 물러나게 하는 의미를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
