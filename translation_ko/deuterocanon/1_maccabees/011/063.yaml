  rationale: 전투적 문맥에서 ἄρχοντες는 정치적 ‘통치자’보다 군사 지휘자를 가리키는 것이 자연스러워 ‘지휘관들’로 옮겼습니다.
- source_word: βουλόμενοι μεταστῆσαι αὐτὸν τῆς χρείας
  english_pob_choice: intending to remove him from office
  chosen_korean: 그를 직무에서 해임하려 한다는
  alternatives_korean:
  - 그를 자리에서 끌어내리려 한다는
  - 그를 직책에서 제거하려 한다는
  - 그를 임무에서 물러나게 하려 한다는
  lexicon: LSJ
  rationale: χρεία는 단순한 ‘필요’보다 맡은 기능이나 직무를 뜻할 수 있어, POB의 ‘office’ 해석을 따라 ‘직무’와 ‘해임하다’로 공적 지위 해제를 분명히 했습니다.
- source_word: μετὰ δυνάμεως πολλῆς
  english_pob_choice: with a large force
  chosen_korean: 큰 군세를 거느리고
  alternatives_korean:
