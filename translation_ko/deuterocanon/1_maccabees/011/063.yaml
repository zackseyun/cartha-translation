base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/063.yaml
  text: And Jonathan heard that Demetrius’s commanders had come to Kedesh in Galilee with a large force[a], intending to remove him from office.
  footnotes:
  - marker: a
    text: Or 'to depose him from his position.' The Greek phrase can denote removing him from his assigned function or office.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 요나단은 데메트리오스의 지휘관들이 큰 군세를 거느리고 갈릴리의 케데스에 와서 요나단을 그가 맡은 직무에서 물러나게 하려 한다는 소식을 들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 지위에서 끌어내리려는’으로 옮길 수 있습니다. 그리스어 구절은 그가 맡은 직무나 기능, 섬김 또는 지위에서 그를 물러나게 하는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  english_pob_choice: heard
  chosen_korean: 소식을 들었습니다
  alternatives_korean:
  - 들었습니다
  - 알게 되었습니다
  - 전해 들었습니다
  lexicon: LSJ
  rationale: 단순한 청각보다 보고된 정보를 받아들인 뜻이므로, 자연스러운 현대어로 ‘소식을 들었습니다’라고 옮겼습니다.
- source_word: οἱ ἄρχοντες Δημητρίου
  english_pob_choice: Demetrius’s commanders
  chosen_korean: 데메트리오스의 지휘관들
  alternatives_korean:
  - 데메트리오스의 군지휘관들
  - 데메트리오스의 장수들
  - 데메트리오스의 통치자들
  lexicon: LSJ
  rationale: 전투적 문맥에서 ἄρχοντες는 정치적 ‘통치자’보다 군사 지휘자를 가리키는 것이 자연스러워 ‘지휘관들’로 옮겼습니다.
- source_word: βουλόμενοι μεταστῆσαι αὐτὸν τῆς χρείας
  english_pob_choice: intending to remove him from office
  chosen_korean: 그를 직무에서 해임하려 한다는
  alternatives_korean:
  - 그를 자리에서 끌어내리려 한다는
  - 그를 직책에서 제거하려 한다는
  - 그를 임무에서 물러나게 하려 한다는
  lexicon: LSJ
  rationale: χρεία는 단순한 ‘필요’보다 맡은 기능이나 직무를 뜻할 수 있어, POB의 ‘office’ 해석을 따라 ‘직무’와 ‘해임하다’로 공적 지위 해제를 분명히 했습니다.
- source_word: μετὰ δυνάμεως πολλῆς
  english_pob_choice: with a large force
  chosen_korean: 큰 군세를 거느리고
  alternatives_korean:
  - 대군을 이끌고
  - 많은 군사와 함께
  - 큰 병력을 거느리고
  lexicon: LSJ
  rationale: δύναμις는 여기서 추상적 ‘힘’보다 무장한 병력을 가리키므로, 군사적 규모를 살려 ‘큰 군세’로 옮겼습니다.
theological_decisions:
- issue: 직무 해임의 의미
  chosen_reading: 마카베오기의 정치·군사 문맥에서 ‘그를 직무에서 해임하다’는 공식적 지위 박탈을 뜻하는 표현으로 읽었습니다.
  alternative_readings:
  - 그를 자리에서 몰아내려는 뜻
  - 그를 임무에서 돌려세우려는 뜻
  rationale: POB의 주석처럼 τῆς χρείας는 직책/기능을 가리킬 수 있으므로, 권력 투쟁의 맥락을 흐리지 않으면서도 공적 직무 박탈의 의미를 유지했습니다.
  doctrine_reference: 문맥상 해석 문제이며 교리 쟁점은 없습니다.
