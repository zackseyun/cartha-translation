  yaml_path: translation/deuterocanon/1_maccabees/011/024.yaml
  text: And he took silver and gold and clothing and many other gifts[a], and went to the king at Ptolemais, and found favor before him.
  footnotes:
  - marker: a
    text: Or 'found favor with him.' The Greek idiom is literally 'found favor before him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 은과 금과 옷과 그 밖의 많은 예물을 가지고, 왕에게로 가서 돌레마이에게서 그에게 호의를 얻었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 앞에서 호의를 얻었다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀργύριον
  english_pob_choice: silver
  chosen_korean: 은
  alternatives_korean:
  - 은전
  - 돈
  lexicon: LSJ
  rationale: 문맥상 금과 나란히 놓인 물질적 선물이므로 일반적인 금속 명사인 ‘은’으로 옮겨, 외교적 예물 목록의 질감을 살렸습니다.
- source_word: ἱματισμός
  english_pob_choice: clothing
  chosen_korean: 옷
  alternatives_korean:
  - 의복
  - 옷가지
  lexicon: LSJ
  rationale: 선물 목록에서 자연스럽고 간명하게 읽히는 현대 한국어로 ‘옷’을 택했으며, 지나치게 문어적인 ‘의복’보다 직접적입니다.
- source_word: ἕτερα ξένια πλείονα
  english_pob_choice: many other gifts
  chosen_korean: 그 밖의 많은 예물
  alternatives_korean:
  - 많은 다른 선물
  - 많은 다른 예물
  lexicon: LSJ
  rationale: ξένια는 환대·외교 교환의 맥락을 띤 선물이므로 ‘예물’이 적절하며, ἕτερα πλείονα의 추가성과 다수성을 ‘그 밖의 많은’으로 반영했습니다.
- source_word: ἐναντίον αὐτοῦ
  english_pob_choice: before him
  chosen_korean: 그에게 호의를 얻었습니다
  alternatives_korean:
  - 그 앞에서 호의를 얻었습니다
  - 그의 호의를 얻었습니다
  lexicon: LSJ
  rationale: 직역하면 ‘그 앞에서’이지만 한국어로는 관용을 살려 ‘호의를 얻었습니다’로 옮기되, 관계의 방향은 유지했습니다.
theological_decisions:
- issue: ἐναντίον αὐτοῦ의 관용구 처리
  chosen_reading: 왕 앞에서의 유리한 수용을 뜻하는 관용적 표현으로 이해해, 결과를 자연스럽게 ‘호의를 얻었습니다’로 번역했습니다.
  alternative_readings:
  - 그 앞에서 호의를 얻었습니다
  - 그의 호의를 얻었습니다
  rationale: 그리스어 관용구를 문자적으로만 옮기면 한국어가 부자연스러워지므로, 본문의 외교적 성격과 결과를 분명히 드러내는 표현을 택했습니다.
  doctrine_reference: 문맥 주해/관용구 번역 원칙
