  source_fidelity: 그리스어의 선행 동작(λαβών), 선물 목록, 왕에게 감, 그리고 왕의 호의를 얻었다는 뜻은 대체로 반영되었습니다. 그러나 ‘돌레마이에게서’는 지명에 사람에게 쓰는 조사 ‘에게서’를 붙여 ‘돌레마이로부터’라는 반대 방향의 뜻이 되므로, εἰς Πτολεμαΐδα(돌레마이로/돌레마이에)의 목적지를 정확히 반영하지 못합니다.
  naturalness: ‘돌레마이에게서’는 현대 표준 한국어에서 지명과 결합하기 부자연스럽고 의미도 어긋납니다. ‘돌레마이에 있는 왕에게’로 고치면 장소와 왕의 관계가 분명하고 자연스럽습니다. 또한 마지막 대명사 ‘그에게’는 왕을 가리키지만, ‘왕의 호의’로 명시하는 편이 문맥상 명료합니다.
  terminology: ‘은’, ‘금’, ‘옷’, ‘예물’은 적절합니다. ‘호의를 얻었습니다’는 εὗρεν χάριν의 자연스러운 번역이며, 각주에서 그리스어 관용적 직역을 잘 제시합니다. 고유명사는 통용 표기인 ‘돌레마이’를 유지할 수 있습니다.
