  source_fidelity: 병력의 집결, 전투, 도주와 패주의 순서는 원문에 충실합니다. 다만 원문의 ἐπολέμησαν πρὸς αὐτόν은 적대적 전투를 뜻하므로, 초안의 ‘그와 싸웠고’는 한국어에서 공동으로 싸운다는 뜻으로도 읽힐 수 있습니다. ‘맞서 싸웠고’로 고쳐 적대성을 분명히 하는 것이 안전합니다. πρὸς αὐτόν의 선행사 범위는 원문 및 영어 POB의 표현이 지닌 대명사적 모호성을 보존했습니다.
  naturalness: ‘모여들어’와 ‘패주했습니다’는 현대의 격식 있는 전쟁 서술에 자연스럽습니다. ‘그와 맞서 싸웠고’는 ‘그와 싸웠고’보다 의미가 분명하면서도 합쇼체 문체를 유지합니다.
  terminology: ‘병력’, ‘해산시킨’, ‘패주했습니다’는 군사 문맥과 원어의 의미 범위에 적절합니다. 각주도 ἀπεκρόακεν의 가능한 의미와 문맥상 선택을 정확히 설명합니다.
