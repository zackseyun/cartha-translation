  yaml_path: translation/deuterocanon/1_maccabees/011/055.yaml
  text: And all the forces that Demetrius had dismissed gathered to him[a], and they fought against him; and he fled and was routed.
  footnotes:
  - marker: a
    text: Or 'had sent away' or 'had discharged.' The Greek verb can denote removing troops from service or dismissing them from one's presence; the context favors a military dismissal.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 데메트리오스가 해산시킨[a] 모든 병력이 그에게 모여들어 그와 맞서 싸웠고, 그는 달아났으며 패주했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 동사는 병력을 군무에서 해산시키거나 자기 앞에서 물러나게 하는 뜻을 가질 수 있으며, 여기서는 군사적 해산의 의미가 문맥에 더 잘 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισυνήχθησαν
  english_pob_choice: gathered
  chosen_korean: 모여들어
  alternatives_korean:
  - 모였습니다
  - 집결했습니다
  lexicon: LSJ
  rationale: 군사적 맥락에서 여러 병력이 한 사람에게 합류하는 동작을 자연스럽게 살리면서도, 단순한 '모였다'보다 이동성과 집합성을 더 분명히 드러냅니다.
- source_word: ἀπεκρόακεν
  english_pob_choice: had dismissed
  chosen_korean: 해산시킨
  alternatives_korean:
  - 보내버린
  - 해임한
  lexicon: LSJ
  rationale: 이 동사는 문맥상 병력을 군무에서 물러나게 하거나 해산시키는 뜻이므로, 군사적 의미를 분명히 하는 '해산시키다'가 가장 적절합니다.
- source_word: δυνάμεις
  english_pob_choice: forces
  chosen_korean: 병력
  alternatives_korean:
  - 군대
  - 군세
  lexicon: LSJ
  rationale: 여기서는 추상적 '권세'가 아니라 무장한 부대를 가리키므로, 한국어 군사 문맥에 맞는 '병력'이 가장 정확합니다.
- source_word: ἐτροπώθη
  english_pob_choice: was routed
  chosen_korean: 패주했습니다
  alternatives_korean:
  - 패배했습니다
  - 도주하도록 몰렸습니다
  lexicon: LSJ
  rationale: 전투에서 '뒤집혀 쫓겨남'이라는 뉘앙스를 살리기 위해, 단순한 패배보다 더 강한 '패주했습니다'를 선택했습니다.
