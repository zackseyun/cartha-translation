  yaml_path: translation/deuterocanon/1_maccabees/011/055.yaml
  text: And all the forces that Demetrius had dismissed gathered to him[a], and they fought against him; and he fled and was routed.
  footnotes:
  - marker: a
    text: Or 'had sent away' or 'had discharged.' The Greek verb can denote removing troops from service or dismissing them from one's presence; the context favors a military dismissal.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 데메트리오스가 해산시킨 모든 병력이 그에게 모여들어 그와 싸웠고, 그는 도망쳤으며 패주했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 동사는 병력을 군무에서 해산시키거나 자기 앞에서 물러나게 하는 뜻을 가질 수 있으며, 여기서는 군사적 해산의 의미가 문맥에 더 잘 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισυνήχθησαν
  english_pob_choice: gathered
  chosen_korean: 모여들어
  alternatives_korean:
  - 모였습니다
  - 집결했습니다
  lexicon: LSJ
  rationale: 군사적 맥락에서 여러 병력이 한 사람에게 합류하는 동작을 자연스럽게 살리면서도, 단순한 '모였다'보다 이동성과 집합성을 더 분명히 드러냅니다.
- source_word: ἀπεκρόακεν
