  rationale: 재귀 대명사 ‘자기’를 비재귀 소유 대명사 ‘그의’로 바꾸어 원문의 지시 관계를 보존했습니다. 또한 ἐπιθυμῆσαι의 의미 범위를 보존하도록 본문은 ‘원했기 때문에’로 하고, 문맥상 가능한 ‘탐내다’를 각주에서 제시했습니다. 반복된 대명사가 낳는 원문의 인물 지시상 압축성과 문맥 의존성은 유지했습니다.
