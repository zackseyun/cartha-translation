  - severity: medium
    issue: 본문의 ‘탐냈기’가 ἐπιθυμῆσαι의 가능한 더 강한 뜻을 본문에서 확정함
    rationale: 문맥상 ‘탐내다’는 가능하지만, 동사는 ‘원하다’도 뜻합니다. 영어 POB의 본문 선택 및 각주 구조와 같이 본문은 ‘원하다’로 두고, ‘탐내다’를 각주 대안으로 제시하면 어휘적 여지를 더 잘 보존합니다.
