  rationale: 본문과 영어 POB 주석이 ἐπιθυμῆσαι의 더 강한 뜻(‘coveted’) 가능성을 인정하므로, 한국어 본문에서도 도덕적 긴장을 약화시키지 않는 쪽을 택했습니다.
