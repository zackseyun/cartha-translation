translation:
  language: ko
  text: 그는 그가 자기의 왕국을 탐냈기 때문에 그를 책망했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 왕국을 탐했다고 그를 비난했습니다.’ ἐπιθυμῆσαι는 문맥에 따라 ‘탐내다’의 더 강한 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐψόγισεν
  english_pob_choice: reproached
  chosen_korean: 책망했습니다
  alternatives_korean:
  - 꾸짖었습니다
  - 비난했습니다
  - 나무랐습니다
  lexicon: LSJ
  rationale: ψογίζω는 ‘책망하다, 비난하다’의 뜻이므로, 개인적이며 직접적인 비판의 뉘앙스를 살리는 ‘책망했습니다’가 가장 자연스럽습니다.
- source_word: χάριν τοῦ
  english_pob_choice: because
  chosen_korean: ~때문에
  alternatives_korean:
  - ~한 이유로
  - ~으로 말미암아
  - ~때문에
  lexicon: LSJ
  rationale: χάριν + 부정사구는 원인이나 이유를 나타내므로, 현대 한국어에서는 가장 자연스러운 인과 표현인 ‘~때문에’로 옮겼습니다.
- source_word: ἐπιθυμῆσαι
  english_pob_choice: desired
  chosen_korean: 탐냈기
  alternatives_korean:
  - 원했기
  - 욕망했기
  - 갈망했기
  lexicon: LSJ
  rationale: 문맥상 다른 이의 왕권을 향한 정치적 욕심이므로, 단순한 ‘원하다’보다 더 강한 ‘탐내다’가 문맥의 긴장을 잘 드러냅니다.
- source_word: τῆς βασιλείας
  english_pob_choice: kingdom
  chosen_korean: 왕국
  alternatives_korean:
  - 통치
  - 왕권
  - 왕국
  lexicon: LSJ
  rationale: βασιλεία는 여기서 왕의 지배 영역을 가리키므로, 가장 सीधे적인 대응어인 ‘왕국’이 적절합니다.
theological_decisions:
- issue: 행위의 성격을 강도 있게 드러낼지 여부
  chosen_reading: ‘탐냈기 때문에’로 옮겨, 단순한 호감이 아니라 타인의 왕국을 향한 부적절한 욕망을 드러냈습니다.
  alternative_readings:
  - ‘원했기 때문에’
  - ‘바랐기 때문에’
  rationale: 본문과 영어 POB 주석이 ἐπιθυμῆσαι의 더 강한 뜻(‘coveted’) 가능성을 인정하므로, 한국어 본문에서도 도덕적 긴장을 약화시키지 않는 쪽을 택했습니다.
  doctrine_reference: 어휘적 긴장 보존
