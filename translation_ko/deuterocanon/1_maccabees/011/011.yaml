review_pass:
  verdict: revise
  source_fidelity: 원문의 인과 구조와 반복 대명사의 지시 관계는 대체로 따랐습니다. 그러나 본문의 ‘자기의 왕국’은 한국어에서 종속절 주어인 ‘그’ 자신에게 재귀적으로 연결되는 것이 자연스러워, 원문의 ‘그의 왕국’(상대방의 왕국)이라는 뜻을 잘못 전달할 수 있습니다. 또한 ἐπιθυμῆσαι는 문맥상 ‘탐내다’도 가능하지만, 본문에서는 더 넓은 ‘원하다’를 택하고 각주에서 더 강한 가능성을 제시하는 편이 원문의 어휘 범위를 보존합니다.
  naturalness: ‘그는 그가 … 그를’이라는 대명사 연쇄는 원문의 인물 지시가 문맥에 의존한다는 점을 반영할 수 있습니다. 다만 ‘자기’는 한국어의 재귀 지시 규칙 때문에 부적절하므로 ‘그의’로 고쳐야 합니다. ‘…원했기 때문에 그를 책망했습니다’는 현대 문어체 합쇼체로 자연스럽습니다.
  terminology: ψογίζω에는 ‘책망했습니다’를 유지할 수 있고, βασιλεία는 이 문맥에서 ‘왕국’으로 옮길 수 있습니다. ἐπιθυμῆσαι의 강한 ‘탐내다’ 가능성은 본문에 확정적으로 부여하기보다 각주에서 제시합니다.
  issues:
