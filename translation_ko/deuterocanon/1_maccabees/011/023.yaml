  yaml_path: translation/deuterocanon/1_maccabees/011/023.yaml
  text: But when Jonathan heard, he ordered them to be surrounded; and he chose some of the elders of Israel and some of the priests, and put himself in danger.
  footnotes:
  - marker: a
    text: 'Greek: ''and gave him to danger.'' The wording is awkward; the sense is likely that Jonathan exposed himself to danger.'
    reason: textual_variant
translation:
  language: ko
  text: 요나단이 그 소식을 듣자 그들을 포위하라고 명령하고, 이스라엘의 장로들 가운데서 몇 사람과 제사장들 가운데서 몇 사람을 택하였으며, 자신을 위험에 내맡겼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 직역하면 ‘그를 위험에 주었다’에 가깝지만, 문맥상 요나단이 자신을 위험에 노출했다는 뜻으로 이해하는 것이 자연스럽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκέλευσεν περικαθίσθαι
  english_pob_choice: he ordered them to be surrounded
  chosen_korean: 그들을 둘러싸게 명령하고
  alternatives_korean:
  - 그들을 포위하게 명령하고
  - 그들을 에워싸게 명령하고
  lexicon: LSJ
  rationale: 군사적 문맥에서 περικαθίσθαι의 핵심은 상대를 둘러싸는 행동이므로, 한국어도 능동적 명령 형태로 자연스럽게 옮겼습니다.
- source_word: ἐπέλεξεν
  english_pob_choice: he chose
  chosen_korean: 택하였으며
  alternatives_korean:
  - 선택하였으며
  - 골랐으며
  lexicon: LSJ
  rationale: 서술체의 평이한 동사로 처리해 본문의 간결한 역사 서술을 유지했습니다.
- source_word: τῶν πρεσβυτέρων Ἰσραήλ / τῶν ἱερέων
  english_pob_choice: some of the elders of Israel / some of the priests
  chosen_korean: 이스라엘의 장로들 가운데서 몇 사람과 제사장들 가운데서 몇 사람
  alternatives_korean:
  - 이스라엘의 장로들 중 몇 사람과 제사장들 중 몇 사람
  - 이스라엘 장로들과 제사장들 가운데 몇 사람
  lexicon: LSJ
  rationale: ἐπέλεξεν 뒤의 속격을 분수적(partitive)으로 읽어, 전체가 아니라 그들 가운데 일부를 가리키는 의미를 분명히 했습니다.
- source_word: ἔδωκεν αὐτὸν τῷ κινδύνῳ
  english_pob_choice: put himself in danger
  chosen_korean: 자신을 위험에 내맡겼습니다
  alternatives_korean:
  - 자신을 위험에 빠뜨렸습니다
  - 자신을 위험에 던졌습니다
  lexicon: LSJ
  rationale: 직역하면 어색한 ‘그를 위험에 주다’라는 구조이지만, 문맥상 요나단 자신이 위험을 감수했다는 뜻이므로 그 긴장을 살려 자연스럽게 옮겼습니다.
theological_decisions:
- issue: αὐτόν의 수일치가 문맥상 어색한 구문 처리
  chosen_reading: 본문의 난점을 숨기지 않되, 의미는 요나단이 자신을 위험에 노출했다는 방향으로 옮겼습니다.
  alternative_readings:
  - ‘그를 위험에 내맡겼습니다’로 엄격히 직역
  - ‘그 자신을 위험에 내맡겼습니다’처럼 해석을 더 노출
  rationale: 이 절은 교리 문제가 아니라 문장 해석의 문제입니다. 본문 흐름상 요나단이 주어로 계속 이어지므로, 한국어는 독자가 자연스럽게 이해할 수 있도록 자기 위험 감수의 의미를 살렸습니다.
  doctrine_reference: 본문 난점은 보존하되 서술 의미를 지나치게 왜곡하지 않는 원칙
- issue: 수동/능동 뉘앙스의 재구성
  chosen_reading: ‘둘러싸게 명령하고’로 능동 명령형을 사용했습니다.
  alternative_readings:
  - ‘둘러싸이게 명령하고’
  - ‘포위되게 명령하고’
  rationale: 그리스어 표현의 군사적 현실감을 살리기 위해 한국어에서는 자연스러운 능동 명령으로 옮겼습니다.
  doctrine_reference: 서술의 사실성 및 전투적 문맥 유지
