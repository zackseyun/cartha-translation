base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/004.yaml
  text: But when he came near Ashdod[a], they showed him the temple of Dagon burned down, and Ashdod and its surrounding villages torn down, and the bodies thrown about[b], and those burned in the war—for they had made heaps of them along his route.
  footnotes:
  - marker: a
    text: Or 'its suburbs' or 'its outlying districts' for 'its surrounding villages' (τὰ περιπόλια αὐτῆς).
    reason: lexical_alternative
  - marker: b
    text: The rare term βωμίας is uncertain in nuance; it may mean 'heaps,' 'mounds,' or possibly 'funeral pyres.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 아스돗에 가까이 이르렀을 때, 그들은 그에게 다곤의 신전이 불타 버린 것과 아스돗과 그 주변 마을들이 무너진 것과 시체들이 흩어져 있는 것과, 전쟁에서 불에 탄 자들을 보여 주었습니다. 그들은 그의 길목에 그들의 더미를 만들어 두었기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: τὰ περιπόλια αὐτῆς는 ‘그 주변 마을들’ 외에 ‘그 주변의 외곽 지역들’ 또는 ‘그 변두리 지대들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: βωμίας는 뜻이 분명하지 않은 희귀어로, ‘더미’, ‘무더기’, 또는 경우에 따라 ‘장작더미/장송더미’처럼 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄζωτον
  english_pob_choice: Ashdod
  chosen_korean: 아스돗
  alternatives_korean:
  - 아조토
  - 아스도드
  lexicon: 표준 음역 관행
  rationale: 그리스어 지명 Ἄζωτον은 익숙한 히브리식 지명 아스돗으로 옮기는 것이 한국어 독자에게 가장 자연스럽습니다.
- source_word: ἱερὸν Δαγὼν
  english_pob_choice: the temple of Dagon
  chosen_korean: 다곤의 신전
  alternatives_korean:
  - 다곤의 성소
  - 다곤의 제당
  lexicon: LSJ
  rationale: ἱερόν은 이 맥락에서 이교 신전/성소를 가리키므로, 문맥을 가장 분명히 드러내는 ‘신전’을 선택했습니다.
- source_word: τὰ περιπόλια αὐτῆς
  english_pob_choice: its surrounding villages
  chosen_korean: 그 주변 마을들
  alternatives_korean:
  - 그 주변의 촌락들
  - 그 주변 지역들
  - 그 외곽 마을들
  lexicon: LSJ
  rationale: περιπόλια는 도시 둘레의 거주지들을 가리키며, 한국어에서는 ‘주변 마을들’이 가장 구체적이고 읽기 쉽습니다.
- source_word: καθῃρημένα
  english_pob_choice: torn down
  chosen_korean: 무너진
  alternatives_korean:
  - 허물어진
  - 파괴된
  - 헐린
  lexicon: LSJ
  rationale: 건물과 정착지가 파괴된 상태를 간결하게 나타내는 표현으로 ‘무너진’이 적합합니다.
- source_word: τὰ σώματα ἐρριμμένα
  english_pob_choice: the bodies thrown about
  chosen_korean: 시체들이 흩어져 있는
  alternatives_korean:
  - 시체들이 던져져 있는
  - 시체들이 나뒹구는
  - 시체들이 널려 있는
  lexicon: LSJ
  rationale: 문맥상 σώματα는 죽은 몸들을 뜻하므로 ‘시체들’로 옮기고, ἐρριμμένα의 무질서한 상태는 ‘흩어져 있는’으로 살렸습니다.
- source_word: βωμίας
  english_pob_choice: heaps
  chosen_korean: 더미
  alternatives_korean:
  - 무더기
  - 산
  - 무덤
  lexicon: LSJ
  rationale: βωμίας의 정확한 뉘앙스가 불확실하므로, POB의 불확실성을 유지하면서도 문맥에 맞는 중립적 표현인 ‘더미’를 택했습니다.
theological_decisions:
