base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/004.yaml
  text: But when he came near Ashdod[a], they showed him the temple of Dagon burned down, and Ashdod and its surrounding villages torn down, and the bodies thrown about[b], and those burned in the war—for they had made heaps of them along his route.
  footnotes:
  - marker: a
    text: Or 'its suburbs' or 'its outlying districts' for 'its surrounding villages' (τὰ περιπόλια αὐτῆς).
    reason: lexical_alternative
  - marker: b
    text: The rare term βωμίας is uncertain in nuance; it may mean 'heaps,' 'mounds,' or possibly 'funeral pyres.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 아스돗에 가까이 이르렀을 때, 그들은 그에게 다곤의 신전이 불타 버린 것, 아스돗과 그 주변 마을들[a]이 파괴된 것, 시체들이 내던져져 있는 것, 그리고 전쟁 중에 그가 불태운 사람들을 보여 주었습니다. 그들이 그 사람들을 그의 길목에 더미[b]로 쌓아 두었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: τὰ περιπόλια αὐτῆς는 ‘그 주변 마을들’ 외에 ‘그 주변의 외곽 지역들’ 또는 ‘그 변두리 지대들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: βωμίας는 뜻이 분명하지 않은 희귀어로, ‘더미’, ‘무더기’, 또는 경우에 따라 ‘장작더미’나 ‘장례용 화장 더미’처럼 이해될 수 있습니다.
    reason: lexical_alternative
