  text: And those in the city saw that the Jews had gained control of the city as they wished, and they lost heart, and they cried out to the king with a plea, saying,
translation:
  language: ko
  text: 그리고 성 안의 사람들이 유다인들이 성을 자기들이 원하는 대로 장악한 것을 보고, 그들은 기가 죽어 왕에게 간청하며 외쳐 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성 안의 사람들’은 원문 οἱ ὑπὸ τῆς πόλεως의 자연스러운 한국어 처리이며, 문자 그대로의 ‘성 아래’라는 공간 의미는 아닙니다.
    reason: source_note
lexical_decisions:
- source_word: οἱ ὑπὸ τῆς πόλεως
  english_pob_choice: those in the city
  chosen_korean: 성 안의 사람들
  alternatives_korean:
  - 그 성 안에 있는 사람들
  - 성읍의 주민들
  - 그 도성 안의 사람들
  lexicon: LSJ
  rationale: 문맥상 도시 내부의 주민·세력을 가리키므로, 직역적 공간감은 살리되 한국어에서는 자연스러운 ‘성 안의 사람들’로 옮겼습니다.
- source_word: κατεκράτησαν
  english_pob_choice: had gained control
  chosen_korean: 장악한
  alternatives_korean:
  - 주도권을 잡은
  - 지배하게 된
  - 제압한
  lexicon: LSJ
  rationale: κρατέω 계열의 ‘지배하다/장악하다’ 의미를 살리되, 과도하게 폭력적으로 들리지 않도록 ‘장악한’으로 간명하게 옮겼습니다.
- source_word: ὡς ἠβούλοντο
  english_pob_choice: as they wished
  chosen_korean: 자기들이 원하는 대로
  alternatives_korean:
  - 원하던 대로
  - 뜻한 대로
  - 바라는 대로
  lexicon: LSJ
  rationale: 유다인들의 점령 상태가 그들의 의도와 일치했음을 나타내므로, 현대 한국어에서 자연스러운 ‘자기들이 원하는 대로’를 택했습니다.
- source_word: ἠσθένησαν ταῖς διανοίαις αὐτῶν
  english_pob_choice: they lost heart
  chosen_korean: 기가 죽어
  alternatives_korean:
  - 낙심하여
  - 마음이 약해져
  - 의지가 꺾여
  lexicon: LSJ
  rationale: 직역하면 ‘생각/마음에서 약해지다’이지만, 문맥상 전투·정세 앞에서의 낙담을 뜻하므로 관용적이면서도 힘을 살리는 ‘기가 죽어’로 옮겼습니다.
- source_word: μετὰ δεήσεως
  english_pob_choice: with a plea
  chosen_korean: 간청하며
  alternatives_korean:
  - 간청하여
  - 애원하며
  - 탄원하며
  lexicon: LSJ
  rationale: δέησις는 단순 요청보다 강한 간청·탄원을 뜻하므로, 앞의 ‘외쳐’와 연결되는 동사형으로 자연스럽게 반영했습니다.
