  text: 그리고 자기 딸을 알렉산드로스에게서 빼앗아 데메트리오스에게 주었으며, 알렉산드로스의 얼굴이 변했고, 그들 사이의 적대가 드러났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
