  lexicon: LSJ
  rationale: 직역하면 ‘알렉산드로스의 얼굴이 변했다’이므로 본문 이미지와 POB 각주가 지적하는 성격·표정의 변화 가능성을 함께 살려 ‘얼굴이 달라졌다’로 옮겼습니다.
- source_word: ἐφάνη ἡ ἔχθρα αὐτῶν
