  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 서신의 관용문구입니다. 직역하면 “왕 데메트리오스가 라스테네스 그의 아버지에게, 기뻐하라”에 가깝습니다.
    reason: lexical_alternative
