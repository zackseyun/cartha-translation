base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/058.yaml
  text: And he sent him gold vessels and table service[c][b][a], and gave him authority to drink from gold vessels and to be clothed in purple and to wear a gold clasp.
  footnotes:
  - marker: a
    text: Or 'gold objects' or 'gold plate' for the repeated Greek term χρυσώματα.
    reason: lexical_alternative
  - marker: b
    text: The phrase translated 'table service' may also mean service equipment or, less likely, attendants for service.
    reason: lexical_alternative
  - marker: c
    text: The final item could also be rendered 'a gold clasp' or 'a gold brooch.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 그에게 금그릇들과 식탁 시중을 보낼 뿐 아니라, 그가 금그릇으로 마시고 자주색 옷을 입고 금 버클을 차도록 허락하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χρυσώματα
  english_pob_choice: gold vessels
  chosen_korean: 금그릇들
  alternatives_korean:
  - 금붙이들
  - 금 물건들
  - 금판
  lexicon: LSJ
  rationale: 마시는 용도로 이어지는 문맥상 금으로 된 그릇이라는 구체성이 가장 자연스럽고, '그릇들'이 POB의 'vessels'와도 맞습니다.
- source_word: διακονίαν
  english_pob_choice: table service
  chosen_korean: 식탁 시중
  alternatives_korean:
  - 시중
  - 식탁 봉사
  - 식탁용 시중
  lexicon: LSJ
  rationale: 여기서는 추상적 '섬김'보다 궁정 연회와 연결되는 식탁 관련 시중/시중물의 뉘앙스를 살리는 것이 좋습니다.
- source_word: ἐξουσίαν
  english_pob_choice: authority
  chosen_korean: 허락
  alternatives_korean:
  - 권한
  - 권세
  - 권리
  lexicon: BDAG
  rationale: 왕이 부여하는 특권적 허용이라는 문맥에서 한국어로는 '허락'이 가장 자연스럽고, 뒤의 세 동사와도 잘 이어집니다.
- source_word: πόρπην χρυσῆν
  english_pob_choice: a gold clasp
  chosen_korean: 금 버클
  alternatives_korean:
  - 금 장식핀
  - 금 버클핀
  - 금 걸쇠
  lexicon: LSJ
  rationale: πόρπη는 의복을 고정하는 장식성 걸쇠/핀을 가리키므로, 현대 한국어에서는 '버클'이 가장 읽기 쉽고 기능도 전달합니다.
