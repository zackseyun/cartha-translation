- from: 그러므로 우리는 유대의 경계와 세 구역—아파이레마와 리다와 라마타임—을 그들에게 확정하였으며, 그것들은 사마리아에서 유대로 편입되었고[a], 또 그들과 관련된 모든 것을, 예루살렘에서 제사드리는 모든 사람을 위해, 곧 왕이 전에 그들에게서 해마다 토지의 소산과 나무 열매로 거두던 왕실 세금 대신으로 하였습니다[c][b].
