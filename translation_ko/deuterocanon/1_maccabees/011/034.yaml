base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/034.yaml
  text: Therefore we have confirmed for them the borders of Judea and the three districts—Aphairema and Lydda and Ramathaim—which were added to Judea from Samaria[a], and all that adjoins them, for all who offer sacrifice in Jerusalem[c][b], instead of the royal taxes that the king formerly received from them each year from the produce of the land and the fruit trees.
  footnotes:
  - marker: a
    text: Greek νομοὺς literally refers to administrative districts; older scholarship sometimes leaves this as 'nomes.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'all that belongs with them' renders a broad Greek expression that may include dependent villages, lands, or other appurtenances associated with the three districts.
    reason: lexical_alternative
  - marker: c
    text: Or 'the fruits of the trees.' The Greek term can refer broadly to produce from trees, including fruit or nuts.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 우리는 유대의 경계와 세 구역—아파이레마와 리다와 라마타임—을 그들에게 확정하였으며, 그것들은 사마리아에서 유대로 편입되었고[a], 또 그들과 관련된 모든 것을, 예루살렘에서 제사드리는 모든 사람을 위해, 곧 왕이 전에 그들에게서 해마다 토지의 소산과 나무 열매로 거두던 왕실 세금 대신으로 하였습니다[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 νομοὺς는 문자적으로는 행정 구역을 가리키며, 본문은 유대로 편입된 세 구역을 말합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들과 관련된 모든 것’은 그 세 구역에 딸린 마을, 토지, 부속 권리 등을 포괄할 수 있는 넓은 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘나무들의 열매’. 그리스어는 나무에서 나는 산물 전반을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐστήκαμεν
  english_pob_choice: we have confirmed
  chosen_korean: 우리는 … 확정하였으며
  alternatives_korean:
  - 우리는 … 세웠으며
  - 우리는 … 정하였으며
  - 우리는 … 확립하였으며
  lexicon: LSJ
  rationale: 완료형의 공적·법적 효력을 살리면서, 왕령의 문맥에 맞는 ‘확정하다’로 자연스럽게 옮겼습니다.
- source_word: τὰ ὅρια
  english_pob_choice: the borders
  chosen_korean: 경계
  alternatives_korean:
  - 경계선
  - 경역
  - 영역 경계
  lexicon: LSJ
  rationale: 영토·행정 구획을 가리키는 말이므로, 현대 한국어에서 가장 직설적인 ‘경계’를 사용했습니다.
- source_word: τοὺς τρεῖς νομοὺς
  english_pob_choice: the three districts
  chosen_korean: 세 구역
  alternatives_korean:
  - 세 행정구역
  - 세 지구
  - 세 노모스
  lexicon: LSJ
  rationale: 노모스의 행정적 의미를 살리되, 낯선 음역 ‘노모스’ 대신 이해 가능한 행정 단위로 전달했습니다.
- source_word: πᾶσιν τοῖς θυσιάζουσιν εἰς Ἰερουσαλήμ
  english_pob_choice: for all who offer sacrifice in Jerusalem
  chosen_korean: 예루살렘에서 제사드리는 모든 사람을 위해
  alternatives_korean:
  - 예루살렘에서 제사하는 모든 이들을 위해
  - 예루살렘에 제사하는 모든 자들을 위해
  lexicon: LSJ
  rationale: θυσιάζω의 희생 제사 의미를 분명히 살리기 위해 ‘제사드리다’를 택했습니다.
- source_word: τῶν ἀκροδρύων
  english_pob_choice: the fruit trees
  chosen_korean: 나무 열매
  alternatives_korean:
  - 과실
  - 나무의 열매
  - 과수의 열매
  lexicon: LSJ
  rationale: ἀκρόδρυα가 나무에서 나는 열매 전반을 가리킬 수 있으므로, 좁은 ‘과일’보다 넓은 ‘나무 열매’가 안전합니다.
