base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/071.yaml
  text: And Jonathan tore his clothes[a], and put earth on his head[b], and prayed.
  footnotes:
  - marker: a
    text: Putting earth or dust on the head was a customary sign of grief, distress, or lament.
    reason: cultural_note
  - marker: b
    text: Or 'dust on his head.' The Greek reads 'earth' (γῆ), but English often uses 'dust' in this mourning context.
    reason: lexical_alternative
translation:
  language: ko
  text: 요나단은 자기 옷을 찢고 자기 머리에 흙을[a] 얹고[b] 기도했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 γῆ는 ‘땅’ 또는 ‘흙’을 뜻합니다. 이 애도 문맥에서는 ‘먼지’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 옷을 찢고 머리에 흙을 얹는 행위는 고대 근동에서 슬픔, 고통, 애도의 흔한 표지였습니다.
    reason: cultural_note
lexical_decisions:
- source_word: διέρρηξεν
  english_pob_choice: tore
  chosen_korean: 찢고
  alternatives_korean:
  - 갈기고
  - 찢어 버리고
  lexicon: LSJ
  rationale: 슬픔과 비탄의 표지로 옷을 찢는 동작을 자연스럽고 직접적으로 드러내기 위해 ‘찢고’로 옮겼습니다.
- source_word: τὰ ἱμάτια αὐτοῦ
  english_pob_choice: his clothes
  chosen_korean: 자기 옷을
  alternatives_korean:
  - 자기 옷가지들을
  - 자기 의복을
  lexicon: LSJ
  rationale: ἱμάτια는 폭넓게 ‘옷/의복’을 가리키므로, 현대 한국어에서 가장 자연스러운 ‘옷’으로 옮기되 소유를 분명히 했습니다.
- source_word: ἐπέθετο γῆν ἐπὶ τὴν κεφαλὴν αὐτοῦ
  english_pob_choice: put earth on his head
  chosen_korean: 자기 머리에 흙을 얹고
  alternatives_korean:
  - 자기 머리에 땅을 얹고
  - 자기 머리에 먼지를 얹고
  lexicon: LSJ
  rationale: 그리스어가 γῆ(earth)라고 되어 있으므로 영어의 관습적 ‘dust’로 바꾸지 않고, 본문에 더 가까운 ‘흙’을 택했습니다.
- source_word: προσηύξατο
  english_pob_choice: prayed
  chosen_korean: 기도했습니다
  alternatives_korean:
  - 기도를 올렸습니다
  - 기도하였습니다
  lexicon: LSJ
  rationale: 단순한 서술형 동사로서 가장 자연스럽고 현대적인 ‘기도했습니다’가 원문의 의미를 정확히 전달합니다.
theological_decisions:
- issue: 애도 행위의 문화적 의미를 본문에서 확장할지 여부
  chosen_reading: 본문은 옷을 찢고 흙을 머리에 얹는 애통의 행동을 서술적으로만 제시하고, 그 문화적 의미는 본문 밖에서만 암시했습니다.
  alternative_readings:
  - ‘애도의 표시로’ 같은 해설을 본문에 넣기
  - ‘먼지’를 택해 관습적 애도 이미지를 강조하기
  rationale: 영어 POB처럼 본문은 해석을 덧붙이지 않고 행위 자체를 보존하는 편이 원문 관찰에 충실합니다.
  doctrine_reference: Translation philosophy §§1, 6
