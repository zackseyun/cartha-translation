  text: Now then[a], you will do well to send us men who will fight alongside me, because all my forces have deserted.
  footnotes:
  - marker: a
    text: Or 'who will be allies with me'; the Greek verb can denote allied military support, here expressed as fighting alongside the speaker.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이제 우리에게 나와 함께 싸울 사람들[a]을 보내 주시면 잘하실 것입니다. 내 모든 병력이 나를 떠났기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나와 동맹하여 싸울 사람들”; 원문의 동사는 동맹군으로서 함께 싸우는 것을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  english_pob_choice: Now then
  chosen_korean: 그러니 이제는
  alternatives_korean:
  - 이제 그러니
  - 그러므로 이제는
  lexicon: LSJ
  rationale: 전환과 추론을 함께 나타내는 연결을 한국어에서 자연스럽게 살리기 위해 ‘그러니 이제는’으로 옮겼습니다.
