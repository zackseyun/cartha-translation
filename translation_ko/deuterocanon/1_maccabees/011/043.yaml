  - 나와 동맹하여 싸울 사람들
  lexicon: LSJ
  rationale: συμμαχέω의 군사적 동맹·공동전투 의미를 살리되, ‘내 편에 서서’로 협력 관계를 분명히 했습니다.
- source_word: πᾶσαι αἱ δυνάμεις μου
  english_pob_choice: all my forces
  chosen_korean: 내 모든 군대
  alternatives_korean:
  - 내 모든 병력
  - 내 모든 전력
  lexicon: LSJ
  rationale: δυνάμεις가 군사 문맥에서 ‘병력/군대’를 가리키므로, 지나치게 추상적인 ‘힘’보다 상황에 맞는 군사적 의미를 택했습니다.
