  text: Now then[a], you will do well to send us men who will fight alongside me, because all my forces have deserted.
  footnotes:
  - marker: a
    text: Or 'who will be allies with me'; the Greek verb can denote allied military support, here expressed as fighting alongside the speaker.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러니 이제는 당신이 우리에게 내 편에 서서 싸워 줄 사람들을 보내 주시면 좋겠습니다. 왜냐하면 내 모든 군대가 나를 버렸기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나와 동맹이 될 사람들”; 원문 동사는 군사적 지원을 뜻할 수 있으며, 여기서는 함께 싸우는 의미로 풀었습니다.
    reason: lexical_alternative
