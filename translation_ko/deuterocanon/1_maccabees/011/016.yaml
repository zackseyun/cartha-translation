  yaml_path: translation/deuterocanon/1_maccabees/011/016.yaml
  text: And Alexander fled to Arabia[a], that he might be sheltered there[b]; but King Ptolemy was exalted.
  footnotes:
  - marker: a
    text: Or 'to be sheltered there,' 'to be hidden there,' or 'to be protected there.' The Greek purpose expression can suggest refuge, concealment, or protection.
    reason: lexical_alternative
  - marker: b
    text: Or 'was elevated' or 'became powerful.' The Greek more literally says 'was exalted.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 알렉산드로스는 아라비아로 도망하여 그곳에서 보호를 받으려 했습니다[a]. 그러나 왕 프톨레마이오스는 높임을 받았습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그곳에서 보호받으려고’, ‘그곳에서 숨으려고’, ‘그곳에서 피난하려고’라는 뜻일 수 있습니다. 그리스어 목적 표현은 피난, 은폐, 보호의 의미를 함께 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘높여졌습니다’ 혹은 ‘권세를 얻었습니다’로 옮길 수 있습니다. 그리스어는 더 문자적으로는 ‘높임을 받았습니다’라고 말합니다.
    reason: lexical_alternative
