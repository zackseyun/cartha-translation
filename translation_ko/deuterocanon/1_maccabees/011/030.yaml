translation:
  language: ko
  text: 왕 데메트리오스가 그의 형제 요나단과 유대인의 민족에게 문안합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유대인의 민족에게’라고도 할 수 있습니다. 그리스어 Ἰουδαίων은 여기서 민족적 강조를 살릴지 지리적·정체성적 강조를 살릴지에 따라 다르게 옮길 수 있습니다.
    reason: lexical_alternative
