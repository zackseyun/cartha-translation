  text: To the nation of the Jews[a], our friends, who also maintain what is right toward us, we have decided to do good, because of their goodwill toward us.
  footnotes:
  - marker: a
    text: Or 'who also uphold their obligations toward us.' The Greek phrase literally reads 'who maintain the just things toward us.'
    reason: lexical_alternative
translation:
  language: ko
  text: 유다 민족, 곧 우리와의 관계에서 옳은 일을 지키는 우리의 친구들에게, 우리는 그들의 우리를 향한 호의 때문에 선을 베풀기로 결정하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리에게 대한 그들의 의무를 지키는 자들.’ 그리스어 구절은 문자적으로 ‘우리에게 향한 의로운 것들’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ ἔθνει τῶν Ἰουδαίων
  english_pob_choice: to the nation of the Jews
  chosen_korean: 유다 민족
  alternatives_korean:
  - 유대 민족
  - 유다 사람들의 민족
  - 유대인의 나라
  lexicon: LSJ
  rationale: ἔθνος은 여기서 집단 정체성을 가리키는 ‘민족’이 자연스럽고, τῶν Ἰουδαίων은 역사적·민족적 지칭으로 옮겨 ‘유다 민족’으로 간결하게 살렸습니다.
- source_word: φίλοις ἡμῶν
  english_pob_choice: our friends
  chosen_korean: 우리의 친구들에게
  alternatives_korean:
  - 우리의 벗들에게
  - 우리와 우호적인 이들에게
  - 우리의 벗들인
  lexicon: LSJ
  rationale: 문맥상 수신 집단에 대한 호의적 호칭이므로, 영어 POB처럼 관계적 호칭을 살려 ‘우리의 친구들에게’로 옮겼습니다.
- source_word: συντηροῦσι τὰ πρὸς ἡμᾶς δίκαια
  english_pob_choice: who also maintain what is right toward us
  chosen_korean: 우리와의 관계에서 옳은 일을 지키는
  alternatives_korean:
  - 우리에게 마땅한 것을 지키는
  - 우리에게 대한 의무를 지키는
  - 우리에게 합당한 것을 유지하는
  lexicon: LSJ
  rationale: 직역하면 ‘우리에게 향한 의로운 것들’을 뜻하므로, 법적 의무로 과도하게 좁히지 않으면서 관계적·윤리적 함의를 살려 ‘우리와의 관계에서 옳은 일’을 택했습니다.
- source_word: ἐκρίναμεν ἀγαθοποιῆσαι
  english_pob_choice: we have decided to do good
  chosen_korean: 우리는 선을 베풀기로 결정하였습니다
  alternatives_korean:
  - 우리는 선행하기로 결정하였습니다
  - 우리는 호의를 베풀기로 결정하였습니다
  - 우리는 좋은 일을 하기로 하였습니다
  lexicon: LSJ
  rationale: 공적 문서체의 결정 표현을 살려 ‘결정하였습니다’로 옮겼고, ἀγαθοποιῆσαι는 단순한 ‘좋은 일’보다 포괄적인 ‘선을 베풀다’가 더 자연스럽고 원문에 가깝습니다.
- source_word: τῆς ἑαυτῶν εὐνοίας πρὸς ἡμᾶς
  english_pob_choice: because of their goodwill toward us
  chosen_korean: 그들의 우리를 향한 호의 때문에
  alternatives_korean:
  - 그들의 우리를 향한 선의 때문에
  - 그들의 우리에 대한 우호 때문에
  - 그들의 우리를 향한 친선 때문에
  lexicon: LSJ
  rationale: εὔνοια는 정치적·관계적 ‘호의/선의’를 뜻하므로, 한국어에서도 지나치게 감정적이지 않은 ‘호의’를 선택해 문맥의 외교적 어조를 유지했습니다.
