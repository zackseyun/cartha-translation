  yaml_path: translation/deuterocanon/1_maccabees/011/066.yaml
  text: And they asked him to receive pledges from them[a], and he gave them; then he drove them out from there and took the city, and stationed a garrison in it.
  footnotes:
  - marker: a
    text: Literally, 'to receive right hands.' The phrase refers to exchanging pledges or assurances of peace or loyalty, likely symbolized by clasping right hands.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그에게 자기들의 오른손을 받아 달라고 청하자, 그는 그렇게 해 주었습니다. 그런 다음 그들을 그곳에서 몰아내고 그 도시를 점령한 뒤, 그 안에 주둔군을 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘오른손을 받다’입니다. 이 표현은 평화나 충성의 보증을 주고받는 관용구로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠξίωσαν
  english_pob_choice: they asked
  chosen_korean: 청하자
  alternatives_korean:
  - 요청하자
  - 요구하자
  lexicon: LSJ
  rationale: 상대가 예의를 갖춰 요구한 뉘앙스를 살리면서도, 문맥상 과도하게 강한 ‘요구’보다 자연스러운 서술형 ‘청하다’가 적절합니다.
- source_word: δεξιὰς λαβεῖν
  english_pob_choice: receive pledges from them
  chosen_korean: 자기들의 오른손을 받아 달라고
  alternatives_korean:
  - 그들에게서 약속의 오른손을 받아 달라고
  - 그들에게서 화해의 손을 받아 달라고
  lexicon: LSJ
  rationale: 직역하면 ‘오른손을 받다’이지만, 한국어 본문에서는 관용 표현을 살려 오해 없이 옮기되, 원문 이미지는 보존했습니다.
- source_word: κατελάβετο τὴν πόλιν
  english_pob_choice: took the city
  chosen_korean: 그 도시를 점령한 뒤
  alternatives_korean:
  - 그 도시를 차지한 뒤
  - 그 도시를 कब्ज한 뒤
  - 그 도시를 장악한 뒤
  lexicon: LSJ
  rationale: κατελάβετο는 도시를 무력으로 점유·장악하는 뜻이므로, 군사적 함의를 분명히 하는 ‘점령하다’가 가장 직접적입니다.
- source_word: φρουράν
  english_pob_choice: a garrison
  chosen_korean: 주둔군
  alternatives_korean:
  - 수비대
  - 경비병력
  - 가리슨
  lexicon: LSJ
  rationale: 군사 주둔 부대를 뜻하는 말이므로, 현대 한국어에서 이해가 분명한 ‘주둔군’이 적절합니다.
theological_decisions:
- issue: 무력 점령 서술의 직설성
  chosen_reading: 본문의 정치·군사적 전개를 완화하지 않고, 협상 뒤 곧바로 추방과 점령, 주둔 배치를 연속 동사로 옮겼습니다.
  alternative_readings:
  - 완곡하게 ‘들어가 차지하다’로 순화
  - ‘수비병을 세웠다’로 약화
  rationale: 원문은 협약 요구와 군사 점령을 연속적으로 진술하므로, 서술의 날 선 긴장과 통치 장악을 그대로 드러내는 것이 더 충실합니다.
  doctrine_reference: 역사서의 서술 충실성
