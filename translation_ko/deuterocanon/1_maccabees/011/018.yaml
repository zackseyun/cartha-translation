  yaml_path: translation/deuterocanon/1_maccabees/011/018.yaml
  text: And King Ptolemy died on the third day[a], and those who were in his strongholds were destroyed by those in the strongholds.
  footnotes:
  - marker: a
    text: Greek repeats 'in the strongholds' in both clauses. The wording likely distinguishes those in Ptolemy's strongholds from those in the strongholds who turned against them, but the exact relationship is compressed in the Greek.
