translation:
  language: ko
  text: 그리고 왕 프톨레마이오스는 셋째 날에 죽었습니다. 그의 요새들에 있던 사람들은 요새들에 있던 자들에게[a] 멸망당했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 두 절에서 모두 ‘요새들에 있던’이라는 표현을 반복합니다. 이 표현은 프톨레마이오스의 요새들에 있던 자들과, 요새들에 있던 그들에게 맞선 자들을 구분하는 듯하지만, 정확한 관계는 그리스어에서 압축되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθανεν
  english_pob_choice: died
  chosen_korean: 죽었습니다
  alternatives_korean:
  - 사망했습니다
  - 세상을 떠났습니다
  lexicon: BDAG
  rationale: 직접적인 죽음을 나타내는 단순한 과거형으로, 완곡어를 쓰지 않고 본문의 사실 진술을 그대로 살렸습니다.
- source_word: ἐν τῇ ἡμέρᾳ τῇ τρίτῃ
  english_pob_choice: on the third day
  chosen_korean: 셋째 날에
  alternatives_korean:
  - 세 번째 날에
  - 사흘째 되는 날에
  lexicon: BDAG
  rationale: 헬라어 관용구를 자연스러운 한국어 시간 표현으로 옮겨, 서사 흐름 안에서 ‘셋째 날’이라는 의미를 분명하게 했습니다.
- source_word: ὀχυρώμασιν
  english_pob_choice: strongholds
  chosen_korean: 요새들
  alternatives_korean:
  - 성채들
  - 요새지들
  lexicon: LSJ
  rationale: 군사적 방어 거점을 가리키는 말로, 복수 반복을 살리되 한국어에서는 가장 직접적인 ‘요새들’이 적절합니다.
- source_word: ἀπώλοντο ὑπὸ τῶν ἐν τοῖς ὀχυρώμασιν
  english_pob_choice: were destroyed by those in the strongholds
  chosen_korean: 요새들 안에 있던 자들에 의해 멸망했습니다
  alternatives_korean:
  - 요새들 안에 있던 자들에 의해 파멸했습니다
  - 요새들 안에 있던 사람들에게 멸망당했습니다
  lexicon: BDAG
  rationale: ὑπό + 소유격의 행위 주체를 드러내면서, 수동 의미를 한국어의 ‘~에 의해 멸망했습니다’로 보존했습니다. ‘멸망하다’는 파괴의 결과를 폭넓게 담아 영어 POB의 ‘were destroyed’와 맞습니다.
theological_decisions:
- issue: 두 번 반복되는 ‘요새들’ 표현의 관계
  chosen_reading: ‘그의 요새들 안에 있던 사람들은 요새들 안에 있던 자들에 의해 멸망했습니다’로, 반복을 유지해 양 집단의 대비를 드러냈습니다.
  alternative_readings:
  - ‘그의 요새에 있던 자들은 그 요새에 있던 자들에게 멸망했습니다’
  - ‘그의 요새들에 있던 사람들은 그 안의 사람들에 의해 멸망했습니다’
  rationale: 헬라어는 같은 어구를 압축적으로 반복해 두 집단의 대립을 암시합니다. 한국어에서도 이 반복을 살려, 사건의 구조를 희석하지 않도록 했습니다.
  doctrine_reference: 서술의 압축성과 역사적 서술의 대비 구조
- issue: 프톨레마이오스의 칭호
  chosen_reading: ‘왕 프톨레마이오스’로 직역했습니다.
  alternative_readings:
  - ‘프톨레마이오스 왕’
  - ‘왕 프톨레마이오스’
  rationale: 그리스어 어순을 자연스럽게 반영하면서도, 인물의 왕적 지위를 분명히 드러내는 표현을 택했습니다.
  doctrine_reference: 역사 서술의 직설성과 인물 호칭
