  text: And Demetrius sent to Jonathan[a], saying, “Not only will I do these things for you and for your nation, but I will greatly honor you and your nation, if I find a suitable opportunity.”
  footnotes:
  - marker: a
    text: Greek literally, 'I will honor with honor/glory,' an emphatic expression meaning 'I will greatly honor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 데메트리오스는 요나단에게 사람을 보내며 이렇게 말했습니다. “나는 이 일들만 너와 네 민족을 위해 하려는 것이 아니라, 내가 적절한 기회를 얻는다면 너와 네 민족을 크게 높이겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘영광/존귀로 영광스럽게 하다’라는 중복 표현으로, 강한 ‘크게 높이다’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
