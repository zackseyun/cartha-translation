  text: And Demetrius sent to Jonathan[a], saying, “Not only will I do these things for you and for your nation, but I will greatly honor you and your nation, if I find a suitable opportunity.”
  footnotes:
  - marker: a
    text: Greek literally, 'I will honor with honor/glory,' an emphatic expression meaning 'I will greatly honor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 데메트리오스는 요나단에게 전갈을 보내어 이렇게 말했습니다. “나는 이 일들만 너와 네 민족을 위해 하겠다는 것이 아닙니다. 적절한 기회를 얻으면, 너와 네 민족에게 큰 영예를 베풀겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘영예/영광으로 영예롭게 하겠다’라는 동족어 반복의 강조 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  english_pob_choice: sent
  chosen_korean: 사람을 보내며
  alternatives_korean:
  - 보냈습니다
  - 전했습니다
  lexicon: LSJ
  rationale: ἀποστέλλω의 서술적 과거로서 메시지를 전달하기 위해 사람을 보내는 행위를 나타내므로, 문맥에 맞게 ‘사람을 보내며’로 옮겼습니다.
- source_word: πρὸς Ἰωνάθαν
  english_pob_choice: to Jonathan
  chosen_korean: 요나단에게
  alternatives_korean:
  - 요나단에게로
  - 요나단을 향해
  lexicon: LSJ
  rationale: πρός + 대격은 수신자를 가리키므로 한국어에서는 자연스럽게 ‘~에게’로 처리했습니다.
- source_word: ἀλλʼ ἢ δόξῃ δοξάσω
  english_pob_choice: I will greatly honor
  chosen_korean: 크게 높이겠습니다
  alternatives_korean:
  - 크게 영광스럽게 하겠습니다
  - 영광으로 영광스럽게 하겠습니다
  lexicon: LSJ
  rationale: δόξῃ δοξάσω의 중복 강조를 직역하면 어색하므로, ‘크게 높이다’로 그 강한 존대·영예 부여의 뜻을 살렸습니다.
- source_word: τὸ ἔθνος σου
  english_pob_choice: your nation
  chosen_korean: 네 민족
  alternatives_korean:
  - 네 나라
  - 네 백성
  lexicon: LSJ
  rationale: 1 마카베오서에서 ἔθνος는 단순한 개인 집단보다 민족-정치적 공동체를 가리키므로, 그 뉘앙스를 살려 ‘민족’으로 옮겼습니다.
