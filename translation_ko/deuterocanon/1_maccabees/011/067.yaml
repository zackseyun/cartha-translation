  yaml_path: translation/deuterocanon/1_maccabees/011/067.yaml
  text: And Jonathan and his camp encamped by the water of Gennesar, and they rose early in the morning for the plain of Nasor.
  footnotes:
  - marker: a
    text: Or 'to the plain of Nasor.' The Greek says literally 'rose early in the morning into/to the plain of Nasor,' with the motion toward the plain implied rather than expressed by a separate travel verb.
    reason: lexical_alternative
  - marker: b
    text: Gennesar is the form found in the Greek text here; many readers will know the place-name as Gennesaret.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 요나단과 그의 진영은 게네사르[a] 물가에 진을 쳤고, 그들은 아침 일찍 나소르 평원을 향해 길을 떠났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘게네사르’는 이 본문의 그리스어 형태를 따른 음역입니다. 많은 독자에게는 더 익숙한 ‘게네사렛’으로 알려져 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: παρεμβολὴ
  english_pob_choice: camp
  chosen_korean: 진영
  alternatives_korean:
  - 군대
  - 진
  lexicon: LSJ
  rationale: 군사적 집결지를 가리키는 말로, ‘진영’이 집합적 의미와 군사적 분위기를 함께 살립니다.
- source_word: παρενέβαλον
  english_pob_choice: encamped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 야영했습니다
  - 주둔했습니다
  lexicon: LSJ
  rationale: 동사의 기본 뜻이 ‘진을 치다/야영하다’이므로, 전개를 자연스럽게 살리는 ‘진을 쳤다’가 가장 직접적입니다.
- source_word: τοῦ Γεννησάρ
  english_pob_choice: Gennesar
  chosen_korean: 게네사르
  alternatives_korean:
  - 게네사렛
  lexicon: LSJ
  rationale: 그리스어 본문 형태가 Γεννησάρ이므로, 익숙한 지명보다 원형에 가까운 음역을 따랐습니다.
- source_word: εἰς τὸ πεδίον Νασώρ
  english_pob_choice: for the plain of Nasor
  chosen_korean: 나소르 평원을 향해
  alternatives_korean:
  - 나소르 평원으로
  - 나소르 평원에
  lexicon: LSJ
  rationale: εἰς가 목적지 방향을 나타내므로 ‘향해’로 움직임을 드러내되, 본문에 없는 별도의 동사를 과도하게 보태지 않도록 했습니다.
