  text: 그리고 그가 프톨레마이스의 여러 도시에[a] 들어갈 때마다, 그는 각 도시에 병력을 주둔군으로 배치하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘도시들 프톨레마이스’라고 하여 표현이 압축되어 있습니다. 여기서는 프톨레마이오스에 속하거나 그가 지배하는 도시들을 가리키는 것으로 이해하였습니다.
