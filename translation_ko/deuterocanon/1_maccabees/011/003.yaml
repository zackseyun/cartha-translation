  text: And as he entered into the cities of Ptolemais[a], he stationed forces as a garrison in each city.
  footnotes:
  - marker: a
    text: Greek literally, 'into the cities Ptolemais.' The phrase is syntactically compressed; it is taken here to mean the cities belonging to or controlled by Ptolemy.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 프톨레마이오스의 도시들로 들어가자, 각 도시에 주둔군으로 병력들을 배치하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로는 ‘프톨레마이오스의 도시들로’입니다. 이 표현은 압축되어 있어, 여기서는 프톨레마이오스에 속한 도시들을 뜻하는 것으로 옮겼습니다.
    reason: lexical_alternative
