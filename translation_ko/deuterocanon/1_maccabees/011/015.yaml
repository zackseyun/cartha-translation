  yaml_path: translation/deuterocanon/1_maccabees/011/015.yaml
  text: And Alexander heard[a], and came against him in war; and Ptolemy marched out and met him with a strong force, and routed him.
  footnotes:
  - marker: a
    text: Or 'with mighty force.' The Greek literally says 'with a strong hand,' a military idiom for acting with power.
    reason: lexical_alternative
translation:
  language: ko
  text: 알렉산드로스는 그 소식을 듣고 전쟁 중에 그를 치러 왔습니다. 프톨레마이오스는 군사를 이끌고 나가 강한 힘으로[a] 그를 맞아 그를 패주시켰습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘강한 손으로’입니다. 이는 군사적 맥락에서 강력한 힘이나 세력을 나타내는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  english_pob_choice: heard
  chosen_korean: 들었습니다
  alternatives_korean:
  - 듣게 되었습니다
  - 알게 되었습니다
  lexicon: LSJ
  rationale: ἤκουσεν은 여기서 앞선 사건에 대한 반응을 여는 동사이므로, 별도의 해석을 덧붙이지 않고 가장 직접적인 ‘듣다’로 옮겼습니다.
- source_word: ἦλθεν ἐπʼ αὐτὸν ἐν πολέμῳ
  english_pob_choice: came against him in war
  chosen_korean: 전쟁을 걸어 그를 향해 왔습니다
  alternatives_korean:
  - 전쟁에서 그를 향해 왔습니다
  - 전투하러 그에게 왔습니다
  lexicon: LSJ
  rationale: 공격적 이동(ἐπʼ αὐτόν)과 전쟁의 영역(ἐν πολέμῳ)을 함께 살리기 위해, ‘전쟁을 걸다’로 적대적 행동을 자연스럽게 드러냈습니다.
- source_word: ἐξήγαγεν
  english_pob_choice: marched out
  chosen_korean: 나가서
  alternatives_korean:
  - 군사를 이끌고 나가서
  - 출정하여
  lexicon: LSJ
  rationale: 군사적 맥락에서 ‘끌고 나가다/출정하다’의 뜻이지만, 앞뒤 문맥이 이미 전투 상황을 분명히 하므로 간결하게 ‘나가서’로 옮겼습니다.
- source_word: ἐν χειρὶ ἰσχυρᾷ
  english_pob_choice: with a strong hand
  chosen_korean: 강한 손으로
  alternatives_korean:
  - 강한 힘으로
  - 강한 군세로
  lexicon: LSJ
  rationale: 직역하면 ‘강한 손’이지만, 본문이 지닌 군사적 관용구의 이미지를 살리기 위해 손 이미지를 유지했습니다. 영어 POB의 각주 취지도 반영됩니다.
- source_word: ἐτροπώσατο αὐτόν
  english_pob_choice: routed him
  chosen_korean: 그를 무찔렀습니다
  alternatives_korean:
  - 그를 패주시켰습니다
  - 그를 도망치게 했습니다
  lexicon: LSJ
  rationale: 전투 문맥에서 상대를 꺾고 물러나게 하는 의미를 담고 있어, 단순한 ‘패배시켰다’보다 군사적 승패를 더 잘 드러내는 ‘무찔렀다’를 선택했습니다.
theological_decisions:
- issue: 군사적 관용구 ἐν χειρὶ ἰσχυρᾷ의 처리
  chosen_reading: ‘강한 손으로’로 직역해 원문의 이미지와 힘의 뉘앙스를 보존했습니다.
  alternative_readings:
  - ‘강한 힘으로’
  - ‘강한 군세로’
  rationale: 본문은 단순한 능력 묘사보다 전쟁 수행의 힘을 표현하는 관용구이므로, 이미지가 사라지는 의역보다 원형을 살리는 번역을 택했습니다.
  doctrine_reference: 본문의 의미 보존과 관용구 처리 원칙
- issue: ἦλθεν ἐπʼ αὐτὸν ἐν πολέμῳ의 적대적 뉘앙스
  chosen_reading: ‘전쟁을 걸어 그를 향해 왔습니다’로 적대성과 행위의 성격을 함께 드러냈습니다.
  alternative_readings:
  - ‘전쟁에서 그를 향해 왔습니다’
  - ‘전투하러 그에게 왔습니다’
  rationale: 헬라어는 단순한 이동이 아니라 적대적 공격 행위를 말하므로, 한국어에서도 공격 개시의 성격이 분명히 전달되도록 했습니다.
  doctrine_reference: 본문 충실성 원칙
