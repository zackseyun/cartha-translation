base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/009.yaml
  text: And he sent envoys to King Demetrius[a], saying, “Come, let us make a covenant with one another, and I will give you my daughter whom Alexander has[b], and you will reign over your father's kingdom.”
  footnotes:
  - marker: a
    text: Or 'let us conclude a treaty with one another.' The Greek uses διαθήκη, a formal pact term often rendered 'covenant.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'my daughter whom Alexander has,' referring to the daughter presently in Alexander's possession as wife.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 데메드리오스 왕에게 사절들을 보내며 말했습니다. 「어서, 서로 언약을 맺읍시다. 그러면 내가 알렉산드로스가 가진 내 딸을 당신에게 주겠고, 당신은 당신 아버지의 왕국을 다스리게 될 것입니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘서로 조약을 맺읍시다.’ 그리스어 διαθήκη는 형식적 합의나 언약을 가리키는 말입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘알렉산드로스가 가진 내 딸’입니다. 여기서는 알렉산드로스가 그녀를 아내로 두고 있음을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρέσβεις
  english_pob_choice: envoys
  chosen_korean: 사절들
  alternatives_korean:
  - 외교 사절들
  - 사신들
  lexicon: LSJ
  rationale: 공식 외교 대표를 가리키므로, 일반적인 ‘보내는 사람들’보다 정치적 맥락을 드러내는 ‘사절들’이 적절합니다.
- source_word: συνθώμεθα ... διαθήκην
  english_pob_choice: let us make a covenant
  chosen_korean: 언약을 맺읍시다
  alternatives_korean:
  - 약정을 맺읍시다
  - 조약을 맺읍시다
  lexicon: LSJ
  rationale: διαθήκη의 형식적·구속적 어감을 살리기 위해 ‘언약’을 택했고, 평이한 ‘약정’보다 더 무게가 있으나 ‘조약’처럼 국제정치 용어로만 좁히지는 않았습니다.
- source_word: βασιλεύσεις
  english_pob_choice: you will reign
  chosen_korean: 다스리게 될 것입니다
  alternatives_korean:
  - 통치하게 될 것입니다
  - 왕으로 다스리게 될 것입니다
  lexicon: LSJ
  rationale: 동사적 의미를 살려 ‘reign’을 직접 반영하되, 한국어에서 자연스러운 미래 서술로 옮겼습니다.
theological_decisions:
- issue: διαθήκη를 ‘언약’으로 옮길지 ‘조약’으로 옮길지
  chosen_reading: 왕들 사이의 정치적 합의이지만, 본문이 선택한 단어의 무게를 살려 ‘언약’으로 옮겼습니다.
  alternative_readings:
  - 조약
  - 협정
  rationale: 이 장면은 외교적 동맹 제안이지만, 그리스어는 단순 합의보다 더 형식적인 διαθήκη를 사용합니다. POB의 audit trail과 같이 그 어휘적 중량을 보존하는 편이 원문에 더 가깝습니다.
  doctrine_reference: deuterocanonical narrative; lexical-theological sensitivity to covenant language
