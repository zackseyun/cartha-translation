revisions:
- from: 그리고 왕은 그에게 그의 앞서 있던 이들이 그에게 한 것과 같이 하였고, 그를 그의 모든 친구들 앞에서 높였습니다.[a]
  to: 왕은 이전 왕들이 그에게 해 준 것처럼 그에게 해 주었고, 그의 모든 친구들보다 그를 높였습니다.[a]
  rationale: 왕의 전임자라는 문맥상 지시 대상을 ‘이전 왕들’로 명확히 하고, ποιέω의 폭넓은 처우·은전의 의미는 ‘해 주다’로 유지했습니다. ἐναντίον의 공개적 의미와 문맥상 서열 우위의 의미가 모두 가능한 점을 보존하기 위해, 본문에는 ‘친구들보다’라는 승격 의미를 두고 각주에는 ‘친구들 앞에서’라는 대안을 제시했습니다.
