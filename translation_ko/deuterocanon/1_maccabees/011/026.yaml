  text: And the king dealt with him as those before him had dealt with him[a], and he exalted him above all his friends.
  footnotes:
  - marker: a
    text: Or 'in the presence of all his friends.' The Greek phrase can denote public elevation before the king's court, though the context also supports the sense of rank above them.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕은 이전 왕들이 그에게 해 준 것처럼 그에게 해 주었고, 그의 모든 친구들보다 그를 높였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 모든 친구들 앞에서’. 그리스어는 왕의 궁정에서 공개적으로 그를 높였다는 뜻일 수도 있습니다. 여기서 ‘친구들’은 왕의 측근이나 고위 신하들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν αὐτῷ
  english_pob_choice: dealt with him
  chosen_korean: 그에게 … 하였고
  alternatives_korean:
  - 그에게 행하였고
  - 그를 대하였고
  - 그에게 해 주었고
  lexicon: LSJ
  rationale: ποιέω가 여기서는 단순한 ‘만들다’가 아니라 왕의 처분·대응을 뜻하므로, 한국어에서는 관계적 의미를 살린 ‘그에게 … 하였고’로 옮겼습니다.
- source_word: καθὼς ἐποίησαν αὐτῷ οἱ πρὸ αὐτοῦ
  english_pob_choice: as those before him had dealt with him
  chosen_korean: 그의 앞서 있던 이들이 그에게 한 것과 같이
  alternatives_korean:
  - 그의 전임자들이 그에게 한 것과 같이
  - 그보다 앞선 이들이 그에게 한 것과 같이
  - 그 앞선 자들이 그에게 대하였던 것처럼
  lexicon: LSJ
  rationale: οἱ πρὸ αὐτοῦ를 직역하되 문맥상 왕의 앞선 자들, 곧 전임자들을 가리키므로 ‘그의 앞서 있던 이들’로 자연스럽게 표현했습니다.
- source_word: ὕψωσεν
  english_pob_choice: he exalted
  chosen_korean: 그를 … 높였습니다
  alternatives_korean:
  - 그를 높였습니다
  - 그를 들어 올렸습니다
  - 그를 승진시켰습니다
  lexicon: LSJ
  rationale: 여기서는 지위와 명예의 상승을 뜻하므로, 과장되지 않게도 격식을 살리는 ‘높였습니다’가 적절합니다.
- source_word: ἐναντίον πάντων τῶν φίλων αὐτοῦ
  english_pob_choice: above all his friends
  chosen_korean: 그의 모든 친구들 앞에서
  alternatives_korean:
  - 그의 모든 친구들 위에
  - 그의 모든 친구들보다 높여
  - 그의 모든 친구들 앞에
  lexicon: LSJ
  rationale: ἐναντίον은 ‘앞에서/면전에서’의 뜻이 기본이므로, POB의 각주 가능성을 반영해 본문에는 공개적 승격의 의미를 살린 ‘앞에서’로 두었습니다.
theological_decisions:
- issue: ἐναντίον πάντων τῶν φίλων αὐτοῦ의 의미 범위
  chosen_reading: 본문은 공개적 승격을 뜻하는 ‘그의 모든 친구들 앞에서’로 번역하고, 지위상 우월의 뉘앙스는 ‘그를 … 높였습니다’로 전달했습니다.
  alternative_readings:
  - ‘그의 모든 친구들 위에’로 지위 우위를 더 직접적으로 표현
  - ‘그의 모든 친구들 앞에서’로 공개적 행위를 강조
  rationale: 그리스어 표현은 공개적 자리에서의 높임과 서열상의 승격을 모두 열어 두므로, 본문은 공개성에 무게를 두고 서열 의미는 동사로 보완했습니다.
  doctrine_reference: 역사서의 문맥상 왕실 승진/공적 승격 표현
