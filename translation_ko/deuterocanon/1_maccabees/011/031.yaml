  to: 라스데네스가 우리 친족에게 여러분에 관하여 쓴 편지의 사본을 우리도 여러분에게 써 보냈습니다. 여러분이 그것을 보실 수 있도록 말입니다.[a]
  rationale: 원문의 문서적 표현(‘사본을 … 썼다’), ὅπως 목적절, 그리고 συγγενής의 문맥상 열려 있는 의미 범위를 보존했습니다. ‘써 보냈습니다’는 한국어에서 사본을 작성하여 전달한 행위를 자연스럽게 나타내며, 원문이 명시하지 않는 전달 방식은 덧붙이지 않습니다.
