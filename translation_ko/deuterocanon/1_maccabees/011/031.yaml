  yaml_path: translation/deuterocanon/1_maccabees/011/031.yaml
  text: We have also written to you a copy of the letter that Lasthenes wrote to our kinsman concerning you[a], so that you may see it.
  footnotes:
  - marker: a
    text: Or 'to our relative.' The Greek συγγενής can denote a blood relative, a kinsman, or an honored associate/compatriot depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 라스데네스가 우리 친족에게 여러분에 관하여 쓴 편지의 사본을 우리도 여러분에게 써 보냈습니다. 여러분이 그것을 보실 수 있도록 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘친족’에 해당하는 그리스어 συγγενής는 혈연 친족을 뜻할 수 있으며, 궁정이나 외교의 문맥에서는 친족으로 호칭되는 관계자나 명예상의 동료를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἀντίγραφον
  english_pob_choice: a copy
  chosen_korean: 사본
  alternatives_korean:
  - 복사본
  - 필사본
  lexicon: LSJ
  rationale: ἀντίγραφον은 문서의 ‘사본/필사본’이라는 뜻이므로, 현대 한국어에서 가장 자연스럽고 격식 있는 ‘사본’으로 옮겼습니다.
- source_word: τῆς ἐπιστολῆς
  english_pob_choice: of the letter
  chosen_korean: 편지의
  alternatives_korean:
  - 서한의
  - 문서의
  lexicon: LSJ
  rationale: ἐπιστολή는 표준적으로 ‘편지’이므로, 독자가 바로 이해할 수 있는 평이한 표현을 택했습니다.
- source_word: τῷ συγγενεῖ ἡμῶν
  english_pob_choice: to our kinsman
  chosen_korean: 우리 친족에게
  alternatives_korean:
  - 우리 친척에게
  - 우리 친족분에게
  - 우리 친척/동족에게
  lexicon: LSJ
  rationale: συγγενής는 문맥에 따라 혈족, 친족, 또는 동족적 연고를 가리킬 수 있어, 한국어에서는 그 폭을 살린 ‘친족’이 가장 무난합니다.
- source_word: περὶ ὑμῶν
  english_pob_choice: concerning you
  chosen_korean: 당신들에 관하여
  alternatives_korean:
  - 당신들에 대해
  - 당신들 관련하여
  lexicon: LSJ
  rationale: περί+속격의 기본 의미를 반영해 ‘-에 관하여’로 옮겨 공식 문서체를 유지했습니다.
- source_word: ὅπως ἰδῆτε
  english_pob_choice: so that you may see it
  chosen_korean: 보실 수 있을 것입니다
  alternatives_korean:
  - 보시게 하려는 것입니다
  - 보실 수 있도록
  lexicon: LSJ
  rationale: 목적절 ὅπως를 한국어로 자연스럽게 풀어, 문서의 사본을 실제로 확인하게 된다는 결과를 드러내는 표현으로 정리했습니다.
theological_decisions:
- issue: 왕실·외교 문서에서의 συγγενής 번역 범위
  chosen_reading: 혈연만이 아니라 공식적 동맹·친족 관계를 포괄할 수 있는 ‘친족’으로 번역했습니다.
  alternative_readings:
  - 친척
  - 동맹
  - 동족
  rationale: 이 장의 문맥은 서간문이며, συγγενής의 의미 범위가 혈연에만 제한되지 않으므로 한국어에서도 너무 협소한 표현을 피했습니다.
  doctrine_reference: 역사서/외경의 문맥적 의미 보존 원칙
- issue: ‘그것을’의 지시 대상 명시
  chosen_reading: ‘보실 수 있을 것입니다’로 마무리해, 확인 대상이 방금 언급한 편지의 사본임을 자연스럽게 드러냈습니다.
  alternative_readings:
  - 그것을 보실 수 있습니다
  - 보시게 될 것입니다
  rationale: 그리스어는 지시대상을 문맥상 생략하지만, 한국어에서는 오해를 줄이기 위해 목적어를 내포하는 종결형을 택했습니다.
  doctrine_reference: 문장 명료성 및 문맥 충실성
