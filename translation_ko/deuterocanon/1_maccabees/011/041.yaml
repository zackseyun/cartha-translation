  - 예루살렘의 성채 아크라에 있는 자들
  lexicon: LSJ
  rationale: ἄκρα는 일반적으로 ‘요새/성채’지만 1마카베오기에서는 예루살렘의 셀레우코스 성채 아크라를 가리키는 경우가 많아, 본문에는 고유명적 음역 ‘아크라’를 두고 문맥을 드러냈습니다.
- source_word: τοὺς ἐν τοῖς ὀχυρώμασιν
  english_pob_choice: those in the strongholds
  chosen_korean: 요새들에 있는 자들
  alternatives_korean:
  - 견고한 곳들에 있는 자들
  - 성채들에 있는 자들
  lexicon: LSJ
  rationale: ὀχύρωμα는 ‘요새화된 곳’을 뜻하므로, 복수성을 살린 ‘요새들’이 간결하고 직접적입니다.
- source_word: ἦσαν γὰρ πολεμοῦντες τὸν Ἰσραήλ
  english_pob_choice: for they were making war against Israel
  chosen_korean: 그들이 이스라엘과 전쟁을 벌이고 있었기 때문입니다
  alternatives_korean:
  - 그들이 이스라엘과 싸우고 있었기 때문입니다
  - 그들이 이스라엘을 상대로 전쟁 중이었기 때문입니다
  lexicon: LSJ
  rationale: πολεμοῦντες는 단순한 충돌보다 조직된 적대 행위를 가리키므로, ‘전쟁을 벌이고 있었다’로 지속성과 군사적 성격을 함께 드러냈습니다.
theological_decisions:
- issue: 아크라의 지시 대상
  chosen_reading: 본문의 ‘아크라’는 일반적 ‘요새’가 아니라 예루살렘의 셀레우코스 성채를 가리키는 역사적 고유지명으로 읽었습니다.
  alternative_readings:
  - 일반 명사로서의 ‘성채/요새’
  - ‘아크라’의 음역 없이 단순 번역
  rationale: 영어 POB의 주해도 이를 시사하며, 1마카베오기 문맥상 역사적 지시를 지우지 않는 것이 소스 충실성에 부합합니다.
  doctrine_reference: source-critical historical reading
