translation:
  language: ko
  text: 그러자 요나단이 데메트리오스 왕에게 보내어, 예루살렘의 아크라에 있는 자들과 요새들에 있는 자들을 쫓아내게 해 달라고 요청하였는데, 그들이 이스라엘과 전쟁을 벌이고 있었기 때문입니다.ᵃ[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 보다 구체적으로는 예루살렘의 셀레우코스 성채 ‘아크라’를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
