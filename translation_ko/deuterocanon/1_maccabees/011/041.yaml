translation:
  language: ko
  text: 요나단은 데메트리오스 왕에게 사람을 보내어, 예루살렘의 성채 아크라에 속한 자들을 예루살렘에서 내쫓고 요새들에 있는 자들도 내쫓도록 요청하였습니다.[a] 그들이 이스라엘을 상대로 전쟁을 벌이고 있었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘아크라에서 나온 자들’입니다. 아크라는 예루살렘에 있던 셀레우코스 성채를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  english_pob_choice: sent
