  lexicon: LSJ
  rationale: 그리스어의 이름-호칭 병치를 한국어에서는 자연스러운 ‘데메트리오스 왕’으로 압축해 의미를 보존했습니다.
- source_word: τοὺς ἐκ τῆς ἄκρας ἐξ Ἱερουσαλήμ
  english_pob_choice: those in the citadel from Jerusalem
  chosen_korean: 예루살렘의 아크라에 있는 자들
