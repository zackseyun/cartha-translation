  - 이런 내용으로
  - 다음과 같은 내용으로
  lexicon: LSJ
  rationale: 직역하면 ‘이런 형식을 가진’이지만, 다음 절에서 실제 서한 내용이 이어지므로 문서 도입구로 자연스럽고도 원문 구조를 보존하는 ‘다음과 같은 형식으로’를 택했습니다.
