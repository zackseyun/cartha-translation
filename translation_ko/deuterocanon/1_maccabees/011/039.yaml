  source_fidelity: 핵심 구문은 대체로 충실합니다. 다만 Δημητρίου는 ‘데메트리오스’로, Τρύφων은 한국어 음역으로 일관되게 ‘트리폰’으로 표기해야 합니다. 또한 κατὰ τοῦ Δημητρίου의 적대적 방향성과 καταγογγύζουσιν의 집단적 불만은 ‘데메트리오스에게 불만을 품고 수군거리고’로 더 정확하고 자연스럽게 드러낼 수 있습니다.
  naturalness: ‘Try폰’은 한글·로마자 혼용으로 부자연스럽고, ‘모든 군세’와 ‘투덜거린다는’도 현대의 격식 있는 성서 문체에서는 다소 어색합니다. 문장을 두 문장으로 나누고 ‘모든 군대가 … 수군거리고 있는 것을 보고’로 옮기면 합쇼체 서술에 자연스럽습니다.
  terminology: 인명은 그리스어 음가에 따라 트리폰, 알렉산드로스, 데메트리오스, 시마쿠에스, 안티오코스로 통일했습니다. ‘아라비아인’은 ὁ Ἄραψ의 민족·출신 표지를 자연스럽게 반영합니다. παιδάριον의 어린 나이 강조는 ‘어린아이’로 유지하되, 알렉산드로스와의 관계가 그리스어에서 타원적으로 표현된 점은 각주로 보존했습니다.
