base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/039.yaml
  text: Now Tryphon had formerly been among those with Alexander[a], and seeing that all the forces were grumbling against Demetrius, he went to Simmakoues the Arab, who was rearing Antiochus, the little child of Alexander.
  footnotes:
  - marker: a
    text: Literally, 'the child of Alexander,' that is, Alexander's son.
    reason: lexical_alternative
translation:
  language: ko
  text: 트리폰은 이전에 알렉산드로스 편에 있던 사람들 가운데 하나였는데, 모든 군대가 데메트리오스에게 불만을 품고 수군거리고 있는 것을 보고 아라비아인 시마쿠에스에게 갔습니다. 시마쿠에스는 알렉산드로스의 어린아이[a] 안티오코스를 기르고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘알렉산드로스의 어린아이’이며, 문맥상 알렉산드로스의 아들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τρύφων
  english_pob_choice: Tryphon
  chosen_korean: Try폰
  alternatives_korean:
  - 트리폰
  - 트라이폰
  lexicon: 고유명사 음역
  rationale: 그리스어 인명 Τρύφων은 표준 음역에 따라 ‘Tryphon’으로 옮기되, 한국어 본문에서는 발음에 맞춰 ‘Try폰’으로 표기했습니다.
- source_word: τῶν παρὰ Ἀλεξάνδρου
  english_pob_choice: among those with Alexander
  chosen_korean: 알렉산드로스 편에 있던 사람들 가운데
  alternatives_korean:
  - 알렉산드로스와 함께 있던 사람들 가운데
  - 알렉산드로스의 당파에 있던 사람들 가운데
  lexicon: LSJ
  rationale: παρά + 속격이 여기서는 단순 동행보다 ‘누구 편에 속함’을 나타내므로, 관계와 소속을 함께 드러내는 표현으로 옮겼습니다.
- source_word: πᾶσαι αἱ δυνάμεις
  english_pob_choice: all the forces
  chosen_korean: 모든 군세
  alternatives_korean:
  - 모든 군대
  - 모든 병력
  lexicon: LSJ
  rationale: 군사 문맥의 δυνάμεις는 개별 부대보다 폭넓은 ‘군세/병력’의 뜻이므로, 집합적이고 공식적인 느낌을 살렸습니다.
- source_word: καταγογγύζουσιν
  english_pob_choice: were grumbling
  chosen_korean: 투덜거린다는
  alternatives_korean:
  - 불평한다는
  - 수군거린다는
  lexicon: LSJ
  rationale: 이 동사는 불만 섞인 중얼거림을 뜻하므로, 현대 한국어에서 의미와 뉘앙스를 자연스럽게 살리는 ‘투덜거리다’를 택했습니다.
- source_word: τὸ παιδάριον
  english_pob_choice: the little child
  chosen_korean: 어린아이
  alternatives_korean:
  - 작은 아이
  - 어린 소년
  - 아주 어린 아이
  lexicon: LSJ
  rationale: παιδάριον은 축소형으로 어린 나이를 강조하므로, 문맥상 정치적으로도 중요하게 드러나는 미성숙함을 살려 ‘어린아이’로 옮겼습니다.
