  text: And King Demetrius sat on the throne of his kingdom, and the land was quiet before him.
translation:
  language: ko
  text: 그리고 왕 데메트리오스는 자기 왕국의 왕좌에 앉았고, 그 앞에서 그 땅은 조용해졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάθισεν
  english_pob_choice: sat
  chosen_korean: 앉았고
  alternatives_korean:
  - 자리에 앉았고
  - 왕좌에 앉았고
  - 착석했고
  lexicon: LSJ
  rationale: 여기서는 단순한 물리적 착석보다 왕좌에 오름을 포함하는 왕위 착좌의 이미지를 살리되, 한국어에서는 자연스럽게 ‘앉다’로 옮기는 것이 가장 직접적입니다.
- source_word: θρόνου τῆς βασιλείας αὐτοῦ
  english_pob_choice: the throne of his kingdom
  chosen_korean: 자기 왕국의 왕좌
  alternatives_korean:
  - 그의 왕국의 왕좌
  - 그의 왕권의 왕좌
  - 그의 왕좌
  lexicon: LSJ
  rationale: θρόνος와 βασιλεία의 이중 구조를 유지하기 위해 ‘왕좌’와 ‘왕국’을 함께 살렸습니다. ‘자기’는 소유 대명사의 직접 대응입니다.
- source_word: ἡσύχασεν
  english_pob_choice: was quiet
  chosen_korean: 조용해졌습니다
  alternatives_korean:
  - 평온해졌습니다
  - 고요해졌습니다
  - 평화로워졌습니다
  lexicon: LSJ
  rationale: 본문은 나라가 정치적으로 소란이 가라앉은 상태를 말하므로, ‘평화’보다 덜 강한 ‘조용해지다’가 원문의 정도를 더 잘 반영합니다.
- source_word: ἐνώπιον αὐτοῦ
  english_pob_choice: before him
  chosen_korean: 그 앞에서
  alternatives_korean:
  - 그의 앞에서
  - 그의 면전에서
  - 그 앞에
  lexicon: LSJ
  rationale: 직역에 가까운 ‘앞에서’가 문맥상 왕의 현존과 통치 아래의 정적을 간결하게 드러냅니다.
theological_decisions:
- issue: 왕의 즉위와 나라의 정적을 어떻게 뉘앙스화할지
  chosen_reading: ‘앉았고’와 ‘조용해졌습니다’로 옮겨, 왕위 착좌와 통치의 안정감을 드러내되 과도한 ‘평화’ 언어는 피했습니다.
  alternative_readings:
  - ‘즉위하였고’로 왕위 등극을 명시하기
  - ‘평안해졌습니다’로 더 강한 정치적 안정감을 주기
  rationale: 본문은 군사적/정치적 소란이 가라앉은 상태를 말할 뿐, 구속사적 평화를 선언하는 문맥은 아닙니다. 따라서 서술의 수위를 원문에 맞추는 것이 적절합니다.
  doctrine_reference: 문맥적 서술의 정도 보존
