  lexicon: LSJ
  rationale: ὅμηρα는 협정 이행을 보장하기 위한 인질을 뜻하므로, 현대 한국어에서는 ‘인질로 잡다’가 가장 분명합니다.
- source_word: Ἀσαλήμ
