  - 그들의 지배자들의 아들들
  lexicon: LSJ
  rationale: ἀρχόντων은 도시의 정치적 지배층을 가리키므로, 문맥상 ‘통치자들’이 가장 적절합니다.
- source_word: εἰς ὅμηρα
