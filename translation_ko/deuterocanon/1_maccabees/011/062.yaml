  - 조건을 받아들이다
  rationale: 헬라어 동사는 직접적인 ‘항복’보다 협상적 요청을 넓게 가리키므로, 본문 의미를 과도하게 좁히지 않는 표현을 택했습니다.
  doctrine_reference: 역사서 본문의 서술 정확성
