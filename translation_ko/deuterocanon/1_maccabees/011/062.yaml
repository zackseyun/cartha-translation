base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/062.yaml
  text: And the men from Gaza asked terms of Jonathan[a], and he gave them pledges; and he took the sons of their rulers as hostages and sent them to Jerusalem[b]. And he passed through the country as far as Damascus.
  footnotes:
  - marker: a
    text: The Greek witness here includes the isolated word 'Asalim' (Ἀσαλήμ) after 'Jerusalem.' Because it does not fit the sentence smoothly, it may reflect a textual corruption or stray place-name in this line of transmission.
    reason: textual_variant
  - marker: b
    text: Literally, 'he gave them right hands,' an idiom for giving pledges of peace or good faith.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 가자의 사람들이 요나단에게 화친을 요청하자, 그가 그들에게 서약을 주었습니다. 그리고 그들의 통치자들의 아들들을 인질로 잡아 예루살렘으로 보냈습니다. 그는 그 땅을 지나 다마스쿠스까지 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전승 본문에는 ‘예루살렘’ 뒤에 Ἀσαλήμ(아살렘)이 단독으로 나타나며, 문맥상 매끄럽지 않아 이 구절의 전승상 이형 또는 잔여어휘로 보입니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἠξίωσαν
  english_pob_choice: asked terms
  chosen_korean: 화친을 요청하자
  alternatives_korean:
  - 조건을 요청하자
  - 항복 조건을 요구하자
  - 화친을 청하자
  lexicon: LSJ
  rationale: 군사·외교 맥락에서 단순한 ‘요청’보다 협상 조건을 구하는 뜻이 강하므로, 한국어로는 ‘화친을 요청하다’가 간결하면서도 의미를 잘 드러냅니다.
- source_word: ἔδωκεν αὐτοῖς δεξιάς
  english_pob_choice: he gave them pledges
  chosen_korean: 그가 그들에게 서약을 주었습니다
  alternatives_korean:
  - 그가 그들에게 오른손을 주었습니다
  - 그가 그들에게 보증을 주었습니다
  - 그가 그들에게 화평의 서약을 주었습니다
  lexicon: LSJ
  rationale: δεξιάς는 ‘오른손’의 직역이지만, 여기서는 신의와 평화를 보증하는 관용구로 쓰였으므로 ‘서약을 주다’로 자연스럽게 옮겼습니다.
- source_word: τοὺς υἱοὺς τῶν ἀρχόντων αὐτῶν
  english_pob_choice: the sons of their rulers
  chosen_korean: 그들의 통치자들의 아들들
  alternatives_korean:
