base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/001.yaml
  text: And the king of Egypt gathered many forces[a], like the sand by the seashore, and many ships; and he sought to gain control of Alexander’s kingdom by deceit, and to add it to his own kingdom.
  footnotes:
  - marker: a
    text: Or, 'to seize Alexander’s kingdom by deceit' or 'to gain mastery over Alexander’s kingdom by deceit.' The Greek verb can carry the sense of overpowering or taking control.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이집트의 왕은 바닷가의 모래처럼 많은 병력을 모으고, 많은 배들도 마련했습니다. 그는 속임수로 알렉산드로스의 왕국을 장악하고[a] 그것을 자기 왕국에 더하려고 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘빼앗아’ 또는 ‘지배권을 얻어’로 옮길 수 있습니다. 그리스어 동사는 압도하여 지배권을 얻거나 빼앗는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤθροισεν δυνάμεις πολλὰς
  english_pob_choice: gathered many forces
  chosen_korean: 많은 군대와 많은 배들을 모았습니다
  alternatives_korean:
  - 많은 군사력을 모았습니다
  - 많은 병력을 집결시켰습니다
  lexicon: LSJ
  rationale: δυνάμεις는 군사적 집합력을 가리키므로 ‘군대’로 옮기되, 뒤의 πλοῖα πολλά와 대구를 살려 ‘많은 배들’도 함께 분명히 드러냈습니다.
- source_word: ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης
  english_pob_choice: like the sand by the seashore
  chosen_korean: 바닷가의 모래처럼
  alternatives_korean:
  - 바다 기슭의 모래처럼
  - 해변의 모래처럼
  lexicon: LSJ
  rationale: 성경적 과장 비유를 자연스러운 현대 한국어로 옮기되, 원문의 비유 이미지는 유지했습니다.
- source_word: κατακρατῆσαι
  english_pob_choice: to gain control of
  chosen_korean: 장악하여
  alternatives_korean:
  - 지배하여
  - 정복하여
  - 빼앗아
  lexicon: LSJ
  rationale: 이 동사는 단순한 ‘시도’보다 우위 확보와 통제를 뜻하므로, 문맥상 왕국을 권력으로 ‘장악하다’가 가장 적절합니다.
- source_word: δόλῳ
  english_pob_choice: by deceit
  chosen_korean: 속임수로
  alternatives_korean:
  - 기만으로
  - 간계로
  - 속여서
  lexicon: LSJ
  rationale: δόλος의 핵심 의미인 deceit를 직역성 있게 살리면서도 한국어에서 자연스러운 부사어로 처리했습니다.
- source_word: προσθεῖναι αὐτὴν τῇ βασιλείᾳ αὐτοῦ
  english_pob_choice: to add it to his own kingdom
  chosen_korean: 자기 왕국에 더하려고 했습니다
  alternatives_korean:
  - 자기 왕국에 편입하려고 했습니다
  - 자기 왕국에 합치려고 했습니다
  lexicon: LSJ
  rationale: ‘더하다’는 προσθεῖναι의 기본 의미를 보존하며, 정치적 병합 의도를 문맥상 충분히 전달합니다.
theological_decisions:
- issue: 왕국의 확장 의도를 표현하는 동사의 강도
  chosen_reading: ‘장악하여 … 더하려고 했습니다’로, 정치적 병합과 권력 장악의 뉘앙스를 함께 드러냈습니다.
  alternative_readings:
  - ‘점령하여 … 더하려고 했습니다’
  - ‘차지하여 … 더하려고 했습니다’
  rationale: 원문은 단순한 소유가 아니라 다른 왕국을 통제 아래 두려는 의도를 말하므로, 한국어에서도 그 강도를 약화시키지 않는 것이 좋습니다.
  doctrine_reference: 역사서 본문의 서술 강도 보존
