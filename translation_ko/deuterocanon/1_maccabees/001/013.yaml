  source_fidelity: 그리스어의 ἔδωκαν은 복수형인데, 초안은 ‘왕은’이라고 단수 주어를 명시하여 원문의 문법적 형태를 좁힙니다. 제공된 영어 POB는 문맥에 따라 단수로 처리했지만, 원문 우선 원칙상 한국어에서는 복수 주어를 보존하는 편이 안전합니다. 나머지 핵심 의미(일부 백성이 열망함, 왕에게 감, 이방 민족의 관습을 행할 권한을 받음)는 충실합니다.
  naturalness: ‘백성 중에서 몇 사람이’와 ‘민족들의 관습’은 이해되지만, 현대 표준 한국어에서는 ‘백성 가운데 몇몇 사람이’와 문맥상 ‘이방 민족들의 관습’이 더 자연스럽고 명료합니다. 접속 관계도 ‘원했고 … 갔습니다’로 병렬하면 원문의 καὶ를 인과로 오해하지 않습니다.
  terminology: δικαιώματα는 이 문맥에서 ‘관습’으로 옮길 수 있으며, ἐθνῶν은 유대 문맥에서 비이스라엘 민족을 가리키므로 ‘이방 민족들’이 자연스럽습니다. 각주에서 원문의 직역적 표현인 ‘민족들’과 ‘이방인들의 관습’ 대안을 밝혀 의미 범위와 번역 선택을 투명하게 제시합니다.
