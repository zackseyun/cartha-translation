  rationale: 제시된 그리스어 본문의 복수 동사 ἔδωκαν을 ‘그들은’으로 보존하고, 접속 관계를 자연스러운 병렬 문장으로 다듬었습니다. ‘이방 민족들’은 문맥상 ἐθνῶν의 지시 대상을 드러내되, 각주에서 직역과 대안을 병기하여 어휘적 폭을 보존합니다.
