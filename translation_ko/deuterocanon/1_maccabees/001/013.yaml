  yaml_path: translation/deuterocanon/1_maccabees/001/013.yaml
  text: And some from the people eagerly sought this[a], and they went to the king; and he gave them authority to practice the customs of the nations.
  footnotes:
  - marker: a
    text: Or 'the practices of the Gentiles.' The Greek says 'the nations,' a common Jewish way of referring to non-Israelite peoples.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 백성 가운데 몇몇 사람이 이것을 간절히 원했고, 왕에게 갔습니다. 그들은 그들에게 이방 민족들의 관습을 따를 권한을 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘민족들의 관습’ 또는 ‘이방인들의 관습’입니다. 그리스어는 직역하면 ‘민족들의 관습’이라고 되어 있으며, 유대 문맥에서는 흔히 비이스라엘 민족들의 관습을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προεθυμήθησάν τινες ἀπὸ τοῦ λαοῦ
  english_pob_choice: some from the people eagerly sought this
  chosen_korean: 백성 중에서 몇 사람이 그것을 간절히 원하여
  alternatives_korean:
  - 백성 중 몇 사람이 이것을 열망하여
  - 백성 가운데 몇 사람이 이를 간절히 구하여
  lexicon: LSJ
  rationale: προεθυμήθησάν은 단순한 의지보다 강한 열망을 나타내므로, ‘간절히 원하여’로 volitional force를 살렸습니다. ‘몇 사람’은 τινες의 비지시적 소수성을 자연스럽게 옮깁니다.
- source_word: ἐπορεύθησαν πρὸς τὸν Βασιλέα
  english_pob_choice: they went to the king
  chosen_korean: 왕에게 갔으며
  alternatives_korean:
  - 왕께 나아갔으며
  - 왕에게로 갔으며
  lexicon: LSJ
  rationale: 직접적인 이동 동사이므로 과도한 해석을 피하고 단순하게 옮겼습니다. 문맥상 ‘왕에게’가 가장 자연스럽습니다.
- source_word: ἔδωκαν αὐτοῖς ἐξουσίαν
  english_pob_choice: he gave them authority
  chosen_korean: 왕은 그들에게 권한을 주었습니다
  alternatives_korean:
  - 왕은 그들에게 허가를 주었습니다
  - 왕은 그들에게 권위를 주었습니다
  lexicon: LSJ
  rationale: ἐξουσία는 단순 허가보다 더 강한 ‘권한’이 적절하며, 한국어에서 행위 허용의 공식성을 드러냅니다. 영어 POB처럼 문맥상 왕이 주체임을 분명히 했습니다.
- source_word: τὰ δικαιώματα τῶν ἐθνῶν
  english_pob_choice: the customs of the nations
  chosen_korean: 민족들의 관습
  alternatives_korean:
  - 민족들의 규례
  - 이방 민족들의 관습
  lexicon: LSJ
  rationale: δικαιώματα는 여기서 법률 용어라기보다 비유대적 생활양식·관행을 가리키므로 ‘관습’이 적절합니다. ἐθνῶν은 POB의 ‘nations’에 맞춰 직역적으로 ‘민족들’로 옮겼습니다.
theological_decisions:
- issue: ἐθνῶν의 번역
  chosen_reading: ‘민족들’로 옮겨 비유대 민족을 가리키는 넓은 범주를 유지했습니다.
  alternative_readings:
  - ‘이방인들’
  - ‘이방 민족들’
  rationale: 본문은 후대의 기술적 용례보다 ‘민족들’이라는 직접적 표현이 더 가깝고, 유대 문맥상 비이스라엘 집단을 가리키는 점은 주석 없이도 분명합니다.
  doctrine_reference: Contested terms table / source meaning preservation
