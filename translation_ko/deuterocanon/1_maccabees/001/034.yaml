  text: And they stationed there a sinful nation, lawless men, and they strengthened themselves in it.
translation:
  language: ko
  text: 그들은 거기에 죄 많은 민족, 곧 법을 어기는 사람들을 배치하고, 그 안에서 세력을 굳혔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθνος ἁμαρτωλὸν
  english_pob_choice: sinful nation
  chosen_korean: 죄 많은 민족
  alternatives_korean:
  - 죄 많은 백성
  - 죄인들로 된 민족
  lexicon: ἔθνος
  rationale: POB가 'nation'을 채택한 점을 따라 ἔθνος을 '민족'으로 옮기고, ἁμαρτωλὸν은 도덕적 상태를 직접 드러내는 '죄 많은'으로 처리했습니다.
- source_word: ἄνδρας παρανόμους
  english_pob_choice: lawless men
  chosen_korean: 불법한 사람들
  alternatives_korean:
  - 율법 없는 사람들
  - 법을 어기는 사람들
  lexicon: παράνομος
  rationale: παράνομος의 핵심 의미는 '법/율법을 어김'이므로, 다소 직역적이지만 문맥상 강한 비난을 살리는 '불법한 사람들'로 옮겼습니다.
- source_word: ἐνίσχυσαν ἐν αὐτῇ
  english_pob_choice: they strengthened themselves in it
  chosen_korean: 그곳에서 더욱 강성해졌습니다
  alternatives_korean:
  - 그 안에서 힘을 키웠습니다
  - 그곳에서 세력을 굳혔습니다
  lexicon: ἐνισχύω
  rationale: 동사의 중간/사역적 뉘앙스를 한국어로 자연스럽게 풀어, 단순한 내적 강화가 아니라 점유지 안에서 세력이 커졌다는 뜻이 드러나게 했습니다.
theological_decisions:
- issue: 도덕적 비난을 담은 집합명사와 개인명사의 병렬
  chosen_reading: '''죄 많은 민족, 곧 불법한 사람들''로 번역해 집합적 타락과 그 구성원을 함께 보이게 했습니다.'
  alternative_readings:
  - '''죄 많은 백성, 불법한 자들'''
  - '''죄악된 민족, 율법을 어기는 사람들'''
  rationale: 헬라어는 ἔθνος과 ἄνδρας를 병렬로 두어 공동체와 개인을 함께 규정하므로, 한국어도 둘을 분리해 읽히되 의미가 겹치도록 처리했습니다.
  doctrine_reference: 문맥적 역사서 번역 원칙
