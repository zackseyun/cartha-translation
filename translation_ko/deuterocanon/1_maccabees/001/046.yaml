  naturalness: ‘그리고 성소와 거룩한 사람들을 더럽히려는 것입니다’는 앞 절의 목적·명령 목록에 이어지는 번역으로 이해할 수 있으며, 합쇼체 문장 종결도 유지합니다. 목적격 대상을 ‘거룩한 사람들’로 바로잡으면 자연스럽습니다.
  terminology: ‘성소’와 ‘더럽히다’는 제의적 문맥을 충실히 반영합니다. ἁγίους에 ‘성도들’을 본문어로 쓰면 후대 기독교적 연상이 강해질 수 있으므로, 본문에는 ‘거룩한 사람들’을 사용하고 각주에서 대안을 제시하는 것이 적절합니다.
