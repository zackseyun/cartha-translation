base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/016.yaml
  text: And the kingdom was established before Antiochus[a], and he undertook to rule the land of Egypt, so that he might rule over the two kingdoms.
  footnotes:
  - marker: a
    text: Or, more literally, 'the kingdom was made ready before Antiochus.' The Greek wording may imply that his rule was secured for him before he turned toward Egypt.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 왕국은 안티오쿠스 앞에서 마련되었고, 그는 이집트 땅을 다스리려고 하였으니, 두 왕국을 다스리려는 것이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로는 ‘왕국은 안티오쿠스 앞에서 마련되었다’입니다. 그리스어 표현은 그의 통치가 그가 이집트를 향하기 전에 이미 그를 위해 확보되었음을 암시할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡτοιμάσθη ἡ βασιλεία
  english_pob_choice: the kingdom was established
  chosen_korean: 왕국은 마련되었고
  alternatives_korean:
  - 왕국은 준비되었고
  - 왕권은 확립되었고
  - 왕국은 세워졌고
  lexicon: LSJ
  rationale: ἑτοιμάζω의 수동형은 문자적으로는 ‘준비되다/마련되다’이지만, 여기서는 안티오쿠스의 왕권이 그를 위해 갖추어진 정치적 상황을 가리키므로 한국어에서는 ‘마련되다’로 자연스럽게 살렸습니다.
- source_word: ἐνώπιον Ἀντιόχου
  english_pob_choice: before Antiochus
  chosen_korean: 안티오쿠스 앞에서
  alternatives_korean:
  - 안티오쿠스 앞에
  - 안티오쿠스 면전에서
  - 안티오쿠스 앞에 놓여
  lexicon: LSJ
  rationale: 직역 구조를 유지하되, ‘before’의 문맥상 의미를 한국어의 ‘앞에서’로 옮겨 왕국이 그를 향해/그를 위해 배치된 느낌을 보존했습니다.
- source_word: ὑπέλαβεν βασιλεῦσαι
  english_pob_choice: he undertook to rule
  chosen_korean: 그는 … 다스리려고 하였으니
  alternatives_korean:
  - 그는 … 다스리기로 하였으니
  - 그는 … 통치하려고 착수하였으니
  - 그는 … 통치하려 하였습니다
  lexicon: LSJ
  rationale: ὑπολαμβάνω + 부정사는 단순 추정이 아니라 계획을 취해 실행하려는 의미이므로, 서술 흐름에 맞게 ‘다스리려고 하였으니’로 옮겼습니다.
- source_word: γῆς Αἰγύπτου / ἐπὶ τὰς δύο βασιλείας
  english_pob_choice: the land of Egypt / over the two kingdoms
  chosen_korean: 이집트 땅 / 두 왕국
  alternatives_korean:
  - 이집트의 땅 / 두 왕국 위에
  - 이집트 땅 / 두 나라
  - 애굽 땅 / 두 왕국
  lexicon: LSJ
  rationale: 지리적 대상인 γῆς Αἰγύπτου는 ‘이집트 땅’으로, τέλος의 복수적 지배 대상인 δύο βασιλείας는 ‘두 왕국’으로 옮겨 본문의 정치적 대비를 분명히 했습니다.
