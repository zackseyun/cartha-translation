  yaml_path: translation/deuterocanon/1_maccabees/001/057.yaml
  text: And wherever a book of the covenant was found with anyone[a], or if anyone consented to the law[b], the king’s decree put him to death.
  footnotes:
  - marker: a
    text: Or 'a covenant document' or 'a book of the law/covenant.' The Greek literally reads 'a book of the covenant.'
    reason: lexical_alternative
  - marker: b
    text: That is, anyone who aligned himself with or remained loyal to the Jewish law.
    reason: lexical_alternative
translation:
  language: ko
  text: 누구에게서든지 언약의 책[a]이 발견되거나, 누가 율법[b]을 지지하면, 왕의 칙령에 따라 그 사람을 죽였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘언약의 책’은 그리스어를 직역한 표현입니다. ‘언약 문서’ 또는 ‘율법/언약의 책’으로 이해할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘율법을 지지하다’는 단순한 찬성이라기보다 유대 율법의 편에 서거나 그것에 충성하는 것을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: βιβλίον διαθήκης
  english_pob_choice: a book of the covenant
  chosen_korean: 언약의 책
  alternatives_korean:
  - 언약 문서
  - 율법/언약의 책
  lexicon: LSJ
  rationale: διαθήκη의 기본 뜻인 ‘언약’을 살려, 단순한 ‘책’이 아니라 언약과 연결된 문서라는 점을 간결하게 드러냈습니다.
- source_word: παρὰ τινι
  english_pob_choice: with anyone
  chosen_korean: 누구에게든지
  alternatives_korean:
  - 누구의 소유로든
  - 어느 누구에게든
  lexicon: LSJ
  rationale: 소지·보관의 상황을 한국어 자연문으로 압축해, 발견 장소보다 사람의 소유/보관 상태를 중심으로 읽히게 했습니다.
- source_word: συνευδόκει
  english_pob_choice: consented
  chosen_korean: 동의하면
  alternatives_korean:
  - 승인하면
  - 찬성하면
  - 동조하면
  lexicon: BDAG
  rationale: 단순한 의견 일치가 아니라 왕의 탄압 상황에서 율법 편에 서는 승인·동조를 담아, 가장 간결하면서도 적극적 의미를 살렸습니다.
- source_word: τῷ νόμῳ
  english_pob_choice: the law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 율법에 충성하면
  lexicon: LSJ
  rationale: 문맥상 유대인의 토라를 가리키므로, POB 기본어인 ‘율법’을 사용해 범주를 분명히 했습니다.
- source_word: τὸ σύγκριμα τοῦ βασιλέως
  english_pob_choice: the king’s decree
  chosen_korean: 왕의 칙령
  alternatives_korean:
  - 왕의 명령
  - 왕의 결의
  - 왕의 판결
  lexicon: LSJ
  rationale: 공적이고 강제력 있는 왕의 공식 명령이므로, 한국어 관청·정치 용어로 자연스러운 ‘칙령’을 택했습니다.
theological_decisions:
- issue: ‘율법’에 대한 태도가 처벌 사유로 제시되는 방식
  chosen_reading: 본문은 단순한 지적 동의가 아니라, 유대 율법에 대한 공개적 지지·충성을 금지하는 박해 상황을 가리킨다고 보았습니다.
  alternative_readings:
  - 단순히 법 조항에 동의한 경우
  - 일반적인 종교적 의견 표명
  rationale: 1 Maccabees 1장의 박해 문맥상 νόμος는 유대인의 조상적 율법을 뜻하며, 동의 자체가 정치적·종교적 반역으로 간주되는 구조를 반영해야 합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; historical-context sensitivity'
