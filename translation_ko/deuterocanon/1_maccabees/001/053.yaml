  chosen_korean: 이스라엘
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: LSJ
  rationale: 단수 목적어이지만 집합적 의미로 쓰였으므로, 본문 형식을 따라 고유명사 ‘이스라엘’을 유지합니다.
- source_word: ἐν κρυφίοις
  english_pob_choice: into hiding
  chosen_korean: 숨어 지내게
  alternatives_korean:
  - 숨은 곳에
  - 은밀한 곳에
  lexicon: LSJ
  rationale: 단순한 장소표시보다 ‘숨김/은닉 상태’가 핵심이므로, 관용적 표현으로 풀어 ‘into hiding’의 의미를 자연스럽게 옮겼습니다.
- source_word: ἐν παντὶ φυγαδευτηρίῳ αὐτῶν
  english_pob_choice: in every refuge they had
  chosen_korean: 자신들이 가진 온갖 피난처마다
  alternatives_korean:
  - 그들이 가진 모든 피난처마다
  - 그들의 모든 피난처마다
  lexicon: LSJ
  rationale: φυγαδευτήριον은 도피·피난의 장소를 가리키므로 ‘피난처’가 적절하며, αὐτῶν은 소유를 드러내어 ‘자신들이 가진’으로 옮겼습니다.
