lexical_decisions:
- source_word: ἔθεντο
  english_pob_choice: they put / drove
  chosen_korean: 숨어 지내게 하였으며
  alternatives_korean:
  - 숨기게 하였습니다
  - 몰아 숨게 하였습니다
  lexicon: LSJ
  rationale: aorist middle τίθημι의 사역적 뉘앙스를 살리되, 한국어에서는 ‘숨기다’보다 상태 결과를 드러내는 ‘숨어 지내게 하다’가 더 자연스럽고 본문의 강제성을 보존합니다.
- source_word: τὸν Ἰσραήλ
