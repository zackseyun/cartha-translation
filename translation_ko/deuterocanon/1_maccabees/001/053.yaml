  source_fidelity: 개정이 필요합니다. 현행 ‘자신들이 가진’은 문장 주어인 박해자들을 소유자로 읽히게 하여 αὐτῶν이 가리키는 피난처의 소유·이용 주체를 부정확하게 처리할 수 있습니다. 또한 ‘피난처마다 그러했습니다’는 원문에 없는 서술을 보태며, 장소를 나타내는 전치사구를 자연스럽게 옮기지 못합니다. ‘두었습니다’는 ἔθεντο의 기본적 사역 의미를 보존하며, ‘숨은 곳들’과 ‘모든 피난처’를 병렬적으로 유지합니다.
  naturalness: 현행 문장은 ‘피난처마다 그러했습니다’ 때문에 한국어로 부자연스럽고 의미가 불명확합니다. 개정문은 현대 표준어 합쇼체로 자연스럽고, 장소 표현의 관계도 명료합니다.
  terminology: ‘이스라엘’은 집합적 고유명사로 유지하는 것이 적절합니다. φυγαδευτήριον은 ‘피난처’, κρυφίοις는 ‘숨은 곳들’로 옮겼습니다. αὐτῶν은 문맥상 이스라엘 공동체에 속하거나 이용 가능한 피난처를 가리키는 것으로 처리하되, 각주에서 직역적 대안을 보존합니다.
