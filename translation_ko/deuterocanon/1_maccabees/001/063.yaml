  text: And they chose to die[a], so that they might not be defiled by the foods and might not profane the holy covenant[b]; and they died.
  footnotes:
  - marker: a
    text: Or 'the meats.' The Greek term refers to food items, here specifically those whose consumption would defile according to the covenantal law.
    reason: lexical_alternative
  - marker: b
    text: Or 'a holy covenant.' The Greek phrase lacks the article, but the context strongly suggests the covenant known to Israel.
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 음식으로 더럽혀지지 않고 거룩한 언약을 더럽히지 않기 위해 죽기를 택했고, 결국 죽었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘음식들’입니다. 여기의 그리스어는 금지된 음식 항목들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘거룩한 언약’입니다. 헬라어는 정관사가 없지만, 문맥상 이스라엘이 알고 있는 언약을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπεδέξαντο ἀποθανεῖν
  english_pob_choice: chose to die
  chosen_korean: 죽기를 택했고
  alternatives_korean:
  - 죽음을 받아들였고
  - 죽기로 결단했고
  lexicon: LSJ
  rationale: 중간태의 ἐπεδέξαντο는 단순한 수동 수용이 아니라 자기 자신에게 받아들인 선택을 나타내므로, 한국어에서는 자연스럽게 ‘죽기를 택하다’로 옮기는 것이 가장 가깝습니다.
- source_word: μιανθῶσιν τοῖς βρώμασιν
  english_pob_choice: be defiled by the foods
  chosen_korean: 음식으로 더럽혀지지
  alternatives_korean:
  - 음식들로 부정해지지
  - 먹을거리로 더럽혀지지
  lexicon: LSJ
  rationale: βρώματα는 여기서 금지된 음식 항목들을 가리키므로, ‘음식’으로 옮기되 의례적 부정의 의미를 살려 ‘더럽혀지지’로 표현했습니다.
- source_word: βεβηλώσωσιν διαθήκην ἁγίαν
  english_pob_choice: profane the holy covenant
  chosen_korean: 거룩한 언약을 더럽히지
  alternatives_korean:
  - 거룩한 언약을 속되게 하지
  - 거룩한 계약을 더럽히지
  lexicon: LSJ
  rationale: βεβηλόω는 거룩한 것을 속된 것으로 취급한다는 뜻이므로, 한국어에서는 종교적 금기를 분명히 드러내는 ‘더럽히다’가 가장 적절합니다. ‘언약’은 διαθήκη의 통상적 성서 용례를 따랐습니다.
- source_word: καὶ ἀπέθανον
  english_pob_choice: and they died
  chosen_korean: 결국 죽었습니다
  alternatives_korean:
  - 그리고 죽었습니다
  - 그리하여 죽었습니다
  lexicon: LSJ
  rationale: 마지막 진술은 단순 사실 서술이므로 과장 없이 직역하되, 문맥상 순교적 결과를 드러내기 위해 ‘결국’ 정도의 자연스러운 연결을 사용했습니다.
theological_decisions:
- issue: διαθήκην ἁγίαν의 지시 대상
  chosen_reading: 이스라엘이 알고 있는 하나님의 거룩한 언약을 가리키는 확정적 표현으로 읽었습니다.
  alternative_readings:
  - 아무 특정성 없는 ‘거룩한 언약’
  - 하나님과의 새 언약
  rationale: 헬라어에는 정관사가 없지만, 1 Maccabees의 문맥상 이 표현은 이스라엘의 기존 언약을 가리키므로 한국어에서는 의미상 정관성을 살렸습니다.
  doctrine_reference: Translation philosophy §§1, 5
