    issue: Footnote a is not anchored to the expression it explains.
    rationale: The note concerns τοῖς βρώμασιν (‘foods’), but [a] appears only after the final verb. It should immediately follow ‘음식들’.
  - severity: low
    issue: ‘결국’ introduces an unstated resultative emphasis.
    rationale: The source concludes simply καὶ ἀπέθανον, ‘and they died.’ The contextual result may be inferred, but should not be added in the translation.
  - severity: low
    issue: Footnote b is positioned at the verse end rather than at ‘거룩한 언약.’
    rationale: The note explains the definiteness of διαθήκην ἁγίαν and should be anchored to that phrase.
