  terminology: ‘언약’ is the established Korean biblical equivalent for διαθήκη. Rendering βεβηλώσωσιν as ‘더럽히지’ is defensible in this sacred/defilement context, though it repeats the Korean verb used for μιανθῶσιν; the distinct objects and constructions preserve the source sense adequately. ‘음식들’ reflects the Greek plural without over-specifying the items as meat.
