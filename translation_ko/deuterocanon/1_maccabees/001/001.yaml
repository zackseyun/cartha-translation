base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/001.yaml
  text: And it happened[a], after Alexander the Macedonian, the son of Philip, who had come out from the land of Kittim, struck down Darius king of the Persians and Medes, that he reigned in his place[b], having first reigned over Greece.
  footnotes:
  - marker: a
    text: Kittim is a traditional biblical place-name. It can refer more specifically to Cyprus or, more broadly, western lands depending on context.
    reason: cultural_note
  - marker: b
    text: Or 'defeated Darius.' The Greek verb literally means 'struck down.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다음과 같은 일이 있었습니다. 빌립의 아들이며 마케도니아 사람인 알렉산더가 키팀 땅[a]에서 나와 페르시아와 메대의 왕 다리오스를 무찌른[b] 뒤, 그를 대신하여 왕이 되었습니다. 그는 먼저 그리스를 다스렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 키팀은 전통적인 성서 지명입니다. 문맥에 따라 키프로스를 가리키기도 하고, 더 넓게는 서방 지역을 가리키기도 합니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘다리오스를 쳐서 쓰러뜨렸다.’ 헬라어 동사는 문자적으로는 ‘쳐서 쓰러뜨리다’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  english_pob_choice: it happened
  chosen_korean: 다음과 같이 일어났습니다
  alternatives_korean:
  - 일어났습니다
  - 그 일이 있었습니다
  lexicon: BDAG
  rationale: 서사 도입 공식으로서 과도하게 성경투를 내지 않으면서 사건 전개를 자연스럽게 열어 줍니다.
- source_word: τὸ πατάξαι / ἐπάταξεν
  english_pob_choice: struck down
  chosen_korean: 무너뜨린
  alternatives_korean:
  - 쳐서 쓰러뜨린
  - 격파한
  - 쳐부순
  lexicon: BDAG
  rationale: πατάσσω의 강한 군사적 타격성을 살리되, 한국어에서 너무 직역적인 ‘쳤다’보다 결과를 분명히 드러내는 표현을 택했습니다.
- source_word: τὸν Μακεδόνα / τὸν Φιλίππου
  english_pob_choice: the Macedonian, the son of Philip
  chosen_korean: 마케도니아 사람, 곧 빌립의 아들
  alternatives_korean:
  - 마케도니아 사람인 빌립의 아들
  - 빌립의 아들 알렉산더 마케도니아 사람
  lexicon: BDAG
  rationale: 두 개의 수식어를 모두 보존하되, 한국어에서는 동격 설명으로 풀어 읽기 쉽도록 배열했습니다.
- source_word: Χεττιείμ
  english_pob_choice: Kittim
  chosen_korean: 키팀 땅
  alternatives_korean:
  - 기딤 땅
  - 키팀
  - 키팀 지역
  lexicon: LSJ
  rationale: 영어 POB가 전통적 지명 Kittim을 유지한 점을 따라 음역하되, 지명임을 분명히 하려고 ‘땅’을 붙였습니다.
- source_word: ἐβασίλευσεν ἀντʼ αὐτοῦ
  english_pob_choice: he reigned in his place
  chosen_korean: 그의 자리를 이어 다스렸으니
  alternatives_korean:
  - 그 대신 다스렸으니
  - 그의 자리에 왕이 되었으니
  lexicon: BDAG
  rationale: ἀντί + gen.의 대체·승계 의미를 살려 단순한 ‘그 대신’보다 왕위 계승 뉘앙스를 드러냈습니다.
theological_decisions:
- issue: 알렉산더의 세계 제국 서술에서 ‘먼저 그리스 위에 다스렸습니다’의 순서 감각
  chosen_reading: ‘먼저’는 시간적 선행을 나타내는 부사로 이해하고, 그 뒤의 통치 범위를 ‘그리스 위에’로 직역에 가깝게 옮겼습니다.
  alternative_readings:
  - ‘먼저 그리스를 다스렸습니다’
  - ‘처음에는 그리스에 군림했습니다’
  rationale: πρότερον ἐπὶ τὴν Ἑλλάδα는 이후 확장 이전의 초기 지배 범위를 말하므로, 범위를 축소하거나 자연화해 버리지 않고 선행성과 지배 대상을 함께 남겼습니다.
  doctrine_reference: 역사 서술의 시간·범위 보존 원칙
- issue: ἐξῆλθεν ἐκ τῆς γῆς Χεττιείμ의 지명 처리
  chosen_reading: 키팀을 전통적 지명으로 음역하고, 해석을 덧붙이지 않았습니다.
  alternative_readings:
  - 키프로스
  - 서방 땅들
  rationale: 본문 자체가 전통적 성서 지명을 사용하므로, 특정 역사 지리로 과도하게 환원하지 않고 독자가 원문 표현을 그대로 따라가도록 했습니다.
  doctrine_reference: 원문 우선 번역 원칙
