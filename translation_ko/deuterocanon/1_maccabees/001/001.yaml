- from: 알렉산더 마케도니아 사람, 곧 빌립의 아들로서 키팀 땅에서 나와 페르시아와 메대의 왕 다리오스를 무너뜨린 뒤, 그의 자리를 이어 다스렸으니, 먼저 그리스 위에 다스렸습니다.[a][b]
  to: 다음과 같은 일이 있었습니다. 빌립의 아들이며 마케도니아 사람인 알렉산더가 키팀 땅[a]에서 나와 페르시아와 메대의 왕 다리오스를 무찌른[b] 뒤, 그를 대신하여 왕이 되었습니다. 그는 먼저 그리스를 다스렸습니다.
  rationale: 원문의 ἐγένετο를 현대적 서사 도입구로 복원했습니다. πατάσσω는 ‘무찌른’으로 옮겨 군사적 패배의 의미를 유지하고, 각주에서 문자적 표현을 제시했습니다. ‘먼저’(πρότερον)의 시간적 선행과 그리스라는 통치 범위는 자연스러운 한국어 어순으로 보존했습니다. 각주 표지는 해당 단어 바로 뒤로 옮겼습니다.
