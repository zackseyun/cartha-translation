    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεκράτησαν
  english_pob_choice: became strong
  chosen_korean: 힘을 얻었습니다
  alternatives_korean:
  - 강해졌습니다
  - 세력을 얻었습니다
  - 권세를 잡았습니다
  lexicon: LSJ
  rationale: 이 동사는 단순한 ‘강함’보다 우세·세력의 확보를 가리킬 수 있으므로, 왕조적 맥락에서 자연스럽고 과도하게 통치 행위를 단정하지 않는 ‘힘을 얻었습니다’로 옮겼습니다.
- source_word: οἱ παῖδες αὐτοῦ
  english_pob_choice: his sons
  chosen_korean: 그의 아들들
  alternatives_korean:
  - 그의 자녀들
  - 그의 종들
  lexicon: LSJ
  rationale: 이 문맥은 계승사 서술이므로 παῖδες를 ‘자녀들’이나 ‘종들’보다 ‘아들들’로 이해하는 것이 가장 분명합니다.
- source_word: ἕκαστος
  english_pob_choice: each
  chosen_korean: 각각
  alternatives_korean:
  - 각 사람
  - 저마다
  lexicon: LSJ
  rationale: 분배적 의미를 간결하게 살리기 위해 ‘각각’을 사용했습니다.
- source_word: ἐν τῷ τόπῳ αὐτοῦ
  english_pob_choice: in his own place
  chosen_korean: 자기 자리에서
  alternatives_korean:
  - 자기 지역에서
  - 자기 영토에서
  - 자기 처소에서
  lexicon: LSJ
  rationale: τόπος의 기본 뜻인 ‘자리/장소’를 보존하되, 이 절에서 가리키는 관할 범위를 너무 단정하지 않도록 ‘자기 자리에서’로 옮겼습니다.
theological_decisions:
- issue: τόπος의 범위가 지리적 영토인지, 각자의 권한 영역인지
  chosen_reading: 한국어 본문은 해석을 좁히지 않고 ‘자기 자리’로 남겨, 각 아들이 차지한 위치나 영향권을 모두 포괄할 수 있게 했습니다.
  alternative_readings:
  - 자기 영토에서
  - 자기 지역에서
  rationale: 영어 POB 주석도 ‘place’가 통치 영역을 가리킬 수 있음을 인정하지만, 본문 자체는 그 범위를 명시하지 않으므로 번역문은 과잉 해석을 피했습니다.
  doctrine_reference: 본문-역사 문맥 보존 원칙
