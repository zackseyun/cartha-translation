theological_decisions:
- issue: 성전 기물 약탈의 총체성 표현
  chosen_reading: ‘모든 것을 벗겨 버렸습니다’로 옮겨, 금장식 제거뿐 아니라 목록 전체가 철저히 탈취·훼손되었음을 드러냈습니다.
  alternative_readings:
  - ‘다 벗겨 냈습니다’
  - ‘전부 뜯어냈습니다’
  rationale: 문맥상 단순 분해보다 성전의 거룩한 기물들이 철저히 약탈되는 장면의 폭력을 분명히 보여 주는 것이 원문 효과에 가깝습니다.
  doctrine_reference: 성전 모독과 약탈의 역사 서술
- issue: ‘빵을 차려 놓는 상’의 제의적 의미
  chosen_reading: 유대 성전의 제의 기능을 드러내기 위해 ‘빵을 차려 놓는 상’으로 옮겼습니다.
  alternative_readings:
  - ‘진설상의’
  - ‘표시된 빵의 상’
  rationale: 전통 용어를 그대로 반복하기보다, 이 절이 나열하는 성전 기물의 실제 기능을 한국어 독자가 즉시 이해하도록 했습니다.
  doctrine_reference: 성전 예전(제의) 어휘의 기능적 번역
