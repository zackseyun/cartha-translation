  rationale: 성전 내부의 걸림막을 가리키는 말이므로, 교회 전통에서 통용되는 ‘휘장’을 사용했습니다.
- source_word: κόσμον τὸν χρυσοῦν
  english_pob_choice: the gold decoration
  chosen_korean: 금 장식
