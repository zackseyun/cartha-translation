  - 진설 빵상
  - 표시된 빵의 상
  lexicon: LSJ
  rationale: 성전 맥락에서 πρόθεσις는 하나님 앞에 빵을 차려 두는 행위를 가리키므로, 기능을 드러내는 표현으로 옮겼습니다.
