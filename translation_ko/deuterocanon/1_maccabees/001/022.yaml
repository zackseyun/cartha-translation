  text: and the table for the presentation of the bread[b][a], and the libation vessels and the bowls and the golden censers and the curtain and the crowns and the gold decoration on the front of the temple—and he stripped it all off.
  footnotes:
  - marker: a
    text: Or 'the table of the Presence' / 'the showbread table.' The Greek literally refers to the table associated with the setting out of the bread before God.
    reason: lexical_alternative
  - marker: b
    text: The verb can mean 'peeled off' or 'stripped off,' suggesting the removal of gold plating or decorative overlay from the temple frontage.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 빵을 차려 놓는 상과 술붓는 그릇들과 대접들과 금 향로들과 휘장과 면류관들과 성전 앞의 금 장식과 모든 것을 벗겨 버렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘임재의 상’ / ‘진설상의’. 여기의 그리스어는 하나님 앞에 빵을 차려 두는 상을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 이 동사는 ‘벗겨 내다’ 또는 ‘긁어내다’의 뜻이어서, 성전 앞면의 금장식이나 덧씌운 층을 제거하는 뉘앙스를 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τράπεζαν τῆς προθέσεως
