  yaml_path: translation/deuterocanon/1_maccabees/001/009.yaml
  text: And they all put on crowns after his death[a], and their sons after them for many years[b]; and they multiplied evils in the land.
  footnotes:
  - marker: a
    text: Or 'diadems.' The Greek term refers specifically to royal insignia.
    reason: lexical_alternative
  - marker: b
    text: Or 'they increased wickedness' or 'they increased calamities in the land.' The Greek 'evils' is broad enough to include both moral evil and harmful consequences.
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 모두 그의 죽음 후에 관을 썼고[a], 그 뒤를 이어 그들의 아들들도 여러 해 동안 그러했으며[b], 그 땅에서 악을 많이 행했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘디아뎀들’입니다. 그리스어는 특히 왕권의 휘장을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 악을 증가시켰다’ 혹은 ‘그들이 그 땅에 재앙을 증가시켰다’입니다. 그리스어 ‘악들’은 도덕적 악과 해로운 결과를 모두 포함할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: διαδήματα
  english_pob_choice: crowns
  chosen_korean: 관
  alternatives_korean:
  - 왕관
  - 디아뎀
  lexicon: LSJ
  rationale: διαδήματα는 왕권을 나타내는 머리 장식이므로, 한국어에서는 가장 자연스럽고 간결한 ‘관’으로 옮기되 왕권의 함의를 살렸습니다.
- source_word: μετὰ τὸ ἀποθανεῖν αὐτόν
  english_pob_choice: after his death
  chosen_korean: 그의 죽음 후에
  alternatives_korean:
  - 그가 죽은 후에
  - 그의 죽음 뒤에
  lexicon: BDAG
  rationale: 부정사 구문이 나타내는 시간적 선후를 한국어에서도 직접적으로 살렸습니다.
- source_word: ὀπίσω αὐτῶν ἔτη πολλά
  english_pob_choice: for many years
  chosen_korean: 그 뒤를 이어 그들의 아들들도 여러 해 동안
  alternatives_korean:
  - 그들 뒤에 여러 해 동안
  - 그 뒤를 따라 여러 해 동안
  lexicon: LSJ
  rationale: dynastic succession의 의미를 드러내기 위해 ‘그 뒤를 이어’로 처리했고, 기간은 ‘여러 해 동안’으로 자연스럽게 옮겼습니다.
- source_word: ἐπλήθυναν κακὰ
  english_pob_choice: multiplied evils
  chosen_korean: 악을 많이 행했습니다
  alternatives_korean:
  - 악을 증가시켰습니다
  - 재앙을 많이 일으켰습니다
  lexicon: LSJ
  rationale: κακὰ의 넓은 의미를 한국어에서 단순 명사 ‘악’으로만 두기보다, 역사적 서술에서의 행위적·결과적 뉘앙스를 살려 ‘악을 많이 행했습니다’로 옮겼습니다.
theological_decisions:
- issue: κακὰ의 범위
  chosen_reading: 도덕적 악과 그로 인한 해악을 함께 함축하는 넓은 표현으로 유지했습니다.
  alternative_readings:
  - 악행
  - 재앙
  - 불행
  rationale: 원문은 후대 왕조들의 도덕적 타락과 그 결과로서의 해악을 모두 포괄할 수 있으므로, 한국어도 의미를 좁히지 않고 유지했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
