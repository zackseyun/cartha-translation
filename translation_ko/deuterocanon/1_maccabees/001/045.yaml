  rationale: 본문은 성전 제의의 구체 항목을 나열하므로, 범주를 평탄화하지 않고 구별을 보존하는 편이 원문 의도를 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §§1, 5
- issue: Sabbaths and feasts as plural observances
  chosen_reading: ‘안식일들’과 ‘절기들’로 복수형을 살렸습니다.
  alternative_readings:
  - ‘안식일’과 ‘절기’
  rationale: 그리스어 복수형이 일반적 준수 전체를 가리키는 뉘앙스를 가지므로, 한국어에서도 복수 표현으로 관찰적 의미를 보존했습니다.
  doctrine_reference: Source-form preservation
