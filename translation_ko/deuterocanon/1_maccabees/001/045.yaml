  text: and to forbid whole burnt offerings and sacrifices and drink offerings from the sanctuary[a], and to profane Sabbaths and feasts[d][c][b],
  footnotes:
  - marker: a
    text: Or 'burnt offerings.' The Greek term refers specifically to offerings wholly consumed by fire.
    reason: lexical_alternative
  - marker: b
    text: Or 'libation' for 'drink offerings.'
    reason: lexical_alternative
  - marker: c
    text: The phrase 'from the sanctuary' likely means that these rites were to be excluded from taking place there; some English renderings smooth this to 'in the sanctuary.'
    reason: lexical_alternative
  - marker: d
    text: Or 'festivals.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 성소[b]에서 번제[a]와 제사와 전제[c]를 드리는 일을 금지하고, 안식일과 절기[d]를 더럽히도록 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ὁλοκαυτώματα는 문자적으로 ‘온전히 불살라지는 제물’을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘성소로부터’입니다. 여기서는 성소에서 드리는 제의를 배제하거나 금지한다는 뜻으로 이해할 수 있습니다.
    reason: source_note
  - marker: c
    text: σπονδή는 ‘전제’ 또는 ‘붓는 제물’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ἑορτάς는 ‘절기’ 또는 ‘축제’로 옮길 수 있습니다.
    reason: lexical_alternative
