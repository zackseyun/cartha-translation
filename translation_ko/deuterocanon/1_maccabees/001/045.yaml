  naturalness: ‘그리고’ 및 ‘…하려는 것이었습니다’는 독립된 절 구절로서 다소 부자연스럽고 앞 문맥에 종속된 부정사 구조를 충분히 반영하지 못합니다. ‘또한 … 금지하고, … 더럽히도록 하였습니다’는 현대 표준 한국어 합쇼체에서 자연스럽고, 상위 문맥의 칙령 내용을 무리 없이 이어 줍니다. 한국어에서는 집합적 준수를 가리킬 때 ‘안식일과 절기’가 ‘안식일들과 절기들’보다 자연스럽습니다.
