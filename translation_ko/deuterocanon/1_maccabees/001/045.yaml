  - marker: b
    text: Or 'libation' for 'drink offerings.'
    reason: lexical_alternative
  - marker: c
    text: The phrase 'from the sanctuary' likely means that these rites were to be excluded from taking place there; some English renderings smooth this to 'in the sanctuary.'
    reason: lexical_alternative
  - marker: d
    text: Or 'festivals.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 번제와 희생제물과 전제물을 성소에서 금지하고, 안식일들과 절기들을 더럽히게 하려는 것이었습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ὁλοκαυτώματα는 문자적으로 ‘온전히 불살라지는 제물’을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ἐκ τοῦ ἁγιάσματος는 여기서 성소에서 행해지는 제사를 금지한다는 뜻으로 이해할 수 있습니다.
    reason: source_note
  - marker: c
    text: σπονδή는 ‘전제’ 또는 ‘붓는 제물’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ἑορτάς는 ‘절기들’ 또는 ‘축제들’로도 옮길 수 있습니다.
    reason: lexical_alternative
