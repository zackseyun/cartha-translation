- issue: cultic list of temple rites
  chosen_reading: 번제, 희생제물, 전제물을 서로 구별되는 제의 항목으로 유지했습니다.
  alternative_readings:
  - ‘제사’나 ‘예배 행위’로 포괄적으로 묶기
  rationale: 본문은 성전 제의의 구체 항목을 나열하므로, 범주를 평탄화하지 않고 구별을 보존하는 편이 원문 의도를 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §§1, 5
- issue: Sabbaths and feasts as plural observances
  chosen_reading: ‘안식일들’과 ‘절기들’로 복수형을 살렸습니다.
  alternative_readings:
