  yaml_path: translation/deuterocanon/1_maccabees/001/005.yaml
  text: And after these things he fell upon his bed[a], and knew that he was dying.
  footnotes:
  - marker: a
    text: Or 'fell onto the bed' or more idiomatically 'took to his bed.' The Greek keeps the more physical expression.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이 일들 뒤에 그는 침상에 쓰러졌고, 자신이 죽어 가고 있음을 알았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '침상 위에 쓰러졌다'에 가깝고, 더 관용적으로는 '침상에 누웠다' 또는 '자리에 눕다'로도 옮길 수 있습니다. 그리스어는 더 물리적인 표현을 유지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ταῦτα
  english_pob_choice: after these things
  chosen_korean: 이 일들 뒤에
  alternatives_korean:
  - 이 일 후에
  - 그 뒤에
  - 그 후에
  lexicon: LSJ
  rationale: 그리스어의 순차적 시간 연결을 자연스럽게 살리면서도, POB의 'after these things'에 대응하는 직역성을 유지했습니다.
- source_word: ἔπεσεν ἐπὶ τὴν κοίτην
  english_pob_choice: fell upon his bed
  chosen_korean: 침상에 쓰러졌고
  alternatives_korean:
  - 침상에 넘어졌고
  - 침상으로 몸을 던졌고
  - 침상에 누웠고
  lexicon: LSJ
  rationale: κοίτη는 단순한 '침대'보다 '침상'이 더 자연스럽고, ἔπεσεν의 물리적이고 구체적인 동작을 '쓰러졌고'로 살렸습니다. '누웠고'는 의미를 지나치게 완화합니다.
- source_word: ἔγνω ὅτι ἀποθνήσκει
  english_pob_choice: knew that he was dying
  chosen_korean: 자신이 죽어 가고 있음을 알았습니다
  alternatives_korean:
  - 자신이 죽고 있음을 알았습니다
  - 죽어 가는 줄 알았습니다
  - 죽을 것임을 알았습니다
  lexicon: LSJ
  rationale: γινώσκω의 aorist는 여기서 단순한 인지의 획득을 뜻하므로 '알았습니다'로 옮겼고, 현재형 ἀποθνήσκει는 진행 중인 죽음의 과정을 드러내는 '죽어 가고 있음을'으로 반영했습니다.
theological_decisions:
- issue: 죽음의 진행성 표현
  chosen_reading: ‘죽어 가고 있음을’으로 옮겨, 사건 직후의 임박한 종말이 아니라 이미 진행 중인 죽음의 상태를 드러냈습니다.
  alternative_readings:
  - ‘죽을 것임을’으로 미래적 임박성을 강조하는 읽기
  - ‘죽고 있음을’으로 더 직접적으로 옮기는 읽기
  rationale: 본문의 현재 시제 ἀποθνήσκει는 단회적 미래보다 진행성에 무게가 있으므로, 그 뉘앙스를 보존하는 번역이 소스에 더 충실합니다.
  doctrine_reference: 문법-의미상 선택
