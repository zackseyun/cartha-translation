  lexicon: LSJ
  rationale: 단순 형용사보다 한국어에서는 상태 표현이 자연스럽고, 언약 표지의 결여라는 의미가 더 분명해집니다.
- source_word: βδελύξαι τὰς ψυχὰς αὐτῶν ἐν παντὶ ἀκαθάρτῳ
  english_pob_choice: to make their souls abominable with every unclean thing
  chosen_korean: 모든 부정한 것으로 그들의 영혼을 가증하게 만들며
  alternatives_korean:
  - 모든 부정한 것으로 그들의 영혼을 더럽히며
  - 모든 부정한 것으로 그들의 영혼을 혐오스럽게 만들며
  lexicon: LSJ
  rationale: βδελύξαι의 핵심인 ‘가증함/혐오스러움’을 살리되, 이어지는 βεβηλώσαι와 구별되도록 ‘더럽히다’보다 ‘가증하게 만들다’를 택했습니다.
- source_word: τὰς ψυχὰς αὐτῶν
  english_pob_choice: their souls
  chosen_korean: 그들의 영혼
  alternatives_korean:
  - 그들의 생명
  - 그들의 사람들
  lexicon: LSJ
  rationale: 영혼은 이 문맥에서 단순 생명보다 종교적·도덕적 오염의 무게를 더 잘 보존합니다.
- source_word: βεβηλώσαι
  english_pob_choice: to profane them
  chosen_korean: 그들을 더럽히게 하려는 것입니다
  alternatives_korean:
  - 그들을 속되게 하려는 것입니다
  - 그들을 모독하게 하려는 것입니다
  lexicon: LSJ
  rationale: βεβηλόω는 성스러움을 침범해 ‘속되게/더럽히다’는 뜻이므로, 앞의 ‘가증하게 만들다’와 함께 정결-성스러움의 이중 손상을 드러내는 ‘더럽히다’를 택했습니다.
theological_decisions:
- issue: ψυχή를 ‘영혼’으로 유지할지, ‘사람/생명’으로 풀지
  chosen_reading: ‘영혼’으로 유지했습니다.
  alternative_readings:
  - 그들의 생명
  - 그들의 사람
  rationale: 이 구절은 단순한 신체 통제가 아니라 정결과 언약 표지를 훼손하는 강제 동화를 말하므로, ψυχή의 종교적·도덕적 중량을 살리는 ‘영혼’이 더 적절합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy
