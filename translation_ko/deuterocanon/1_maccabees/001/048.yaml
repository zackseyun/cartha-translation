  yaml_path: translation/deuterocanon/1_maccabees/001/048.yaml
  text: and to leave their sons uncircumcised[a], to make their souls abominable with every unclean thing, and to profane them[b],
  footnotes:
  - marker: a
    text: Or 'to make their souls abominable' or 'to pollute their persons'; the Greek wording can emphasize abhorrence as well as defilement.
    reason: lexical_alternative
  - marker: b
    text: The final 'them' refers back to 'their souls' in Greek, though English may hear it more broadly as referring to the people themselves.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 그들의 아들들을 할례받지 않은 채로 남겨 두며, 온갖 부정한 것으로 그들의 영혼을 가증하게 만들고[a] 속되게 하라는 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘온갖 부정한 것으로 그들의 영혼을 더럽히고’ 또는 ‘온갖 부정한 것으로 그들 자신을 더럽히고’로 옮길 수 있습니다. 그리스어 βδελύξαι는 가증하게 하다, 몹시 싫어하게 하다, 또는 더럽히다의 뉘앙스를 낼 수 있으며, ψυχή는 여기서 ‘영혼’ 외에 사람 자신을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφεῖναι
  english_pob_choice: to leave
  chosen_korean: 남겨 두게 하고
  alternatives_korean:
