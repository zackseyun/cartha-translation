  lexicon: LSJ
  rationale: 아들들을 특정 상태에 ‘그대로 두다’는 뜻을 살려, 할례를 받지 않은 상태로 방치한다는 의미가 분명하게 드러나도록 옮겼습니다.
- source_word: τοὺς υἱοὺς αὐτῶν
  english_pob_choice: their sons
  chosen_korean: 그들의 아들들을
