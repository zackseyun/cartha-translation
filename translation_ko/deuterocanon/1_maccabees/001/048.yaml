  rationale: υἱούς는 분명히 ‘아들들’이므로, 할례라는 맥락도 반영해 성별을 일반화하지 않았습니다.
- source_word: ἀπεριτμήτους
  english_pob_choice: uncircumcised
  chosen_korean: 할례받지 않은 상태로
  alternatives_korean:
