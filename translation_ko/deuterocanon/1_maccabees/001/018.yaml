base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/018.yaml
  text: And he waged war against Ptolemy the king of Egypt[a]; and Ptolemy was routed before him and fled[b], and many fell wounded.
  footnotes:
  - marker: a
    text: Or 'Ptolemy was turned back before him.' The Greek verb can more generally denote being driven back or defeated; 'was routed' brings out the military context.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'many wounded [men] fell.' The phrase may denote numerous battle casualties rather than specifying only those who survived with wounds.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 이집트 왕 프톨레마이오스를 상대로 전쟁을 벌였습니다. 프톨레마이오스는 그 앞에서 패주했고[a] 달아났습니다. 많은 부상자가 쓰러졌습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘프톨레마이오스가 그 앞에서 물러나게 되었습니다.’ 이 동사는 더 넓게는 ‘되밀려 나가다’ 또는 ‘패배하다’라는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘많은 부상자가 쓰러졌습니다.’ 이 표현은 상처를 입고도 살아남은 이들만을 가리킨다고 단정하기보다, 전투에서 발생한 많은 사상자를 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεστήσατο πόλεμον
  english_pob_choice: waged war
  chosen_korean: 전쟁을 일으켰습니다
  alternatives_korean:
  - 전쟁을 벌였습니다
  - 전쟁을 수행했습니다
  - 전쟁을 시작했습니다
  lexicon: LSJ
  rationale: 직역하면 ‘전쟁을 세우다/조직하다’에 가깝지만, 문맥상 군사적 충돌을 개시하고 벌였다는 뜻이므로 한국어로는 자연스럽고 힘 있는 ‘전쟁을 일으키다’가 적절합니다.
- source_word: ἐνετράπη
  english_pob_choice: was routed
  chosen_korean: 무너져 달아났고
  alternatives_korean:
  - 패주했고
  - 꺾였고
  - 후퇴했고
  lexicon: LSJ
  rationale: 이 동사는 이 전투 문맥에서 단순 패배보다 ‘밀려 무너짐/패주함’의 뉘앙스를 가지므로, 군사적 흐름을 살려 ‘무너져 달아나다’로 옮겼습니다.
- source_word: ἀπὸ προσώπου αὐτοῦ
  english_pob_choice: before him
  chosen_korean: 그 앞에서
  alternatives_korean:
  - 그의 앞에서
  - 그의 얼굴 앞에서
  - 그의 존재 앞에서
  lexicon: LSJ
  rationale: ‘~의 앞에서/면전에서’라는 관용구이므로, 자연스러운 현대 한국어로 압축해 상대의 압박 앞에서 물러남을 드러냈습니다.
- source_word: ἔπεσαν τραυματίαι πολλοί
  english_pob_choice: many fell wounded
  chosen_korean: 많은 사람이 부상당한 채 쓰러졌습니다
  alternatives_korean:
  - 많은 부상자가 쓰러졌습니다
  - 많은 사람이 상처 입은 채 쓰러졌습니다
  - 많은 사람이 다쳐 쓰러졌습니다
  lexicon: LSJ
  rationale: 본문은 ‘많은 사람이 쓰러졌다’는 전투 관용구에 ‘부상당한’이 결합된 형태이므로, 단순히 ‘죽었다’로 좁히지 않고 전투 피해의 상태를 살렸습니다.
theological_decisions:
- issue: 전투 결과의 서술을 ‘사망’으로 한정할지 여부
  chosen_reading: ‘많은 사람이 부상당한 채 쓰러졌습니다’로 옮겨, 죽음으로 단정하지 않았습니다.
  alternative_readings:
  - 많은 사람이 죽었습니다
  - 많은 부상자가 있었습니다
  rationale: ἔπεσαν τραυματίαι πολλοί는 문자적으로 ‘많은 부상자들이 쓰러졌다’는 표현이므로, 본문이 명시하지 않은 죽음까지 더하지 않고 전투 피해를 그대로 드러내는 편이 더 충실합니다.
  doctrine_reference: 본문 관찰 및 서사 정확성
