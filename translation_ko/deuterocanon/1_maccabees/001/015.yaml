  source_fidelity: 핵심 동작과 연결 관계는 대체로 충실합니다. 그러나 ἀκροβυστίαν은 ‘할례 껍질’이 아니라 ‘포피’이므로, 현 본문의 표현은 어휘상 부정확합니다. 또한 τοῦ ποιῆσαι πονηρόν의 목적 표현은 ‘스스로를 팔았습니다’에 직접 연결하는 편이 더 분명합니다.
  naturalness: ‘자신들에게 할례 껍질을 만들어’는 현대 표준 한국어에서 부자연스럽고 뜻도 혼동시킵니다. ‘스스로 포피를 만들고’는 원문의 의도적인 낯섦을 보존하면서도 문법적으로 자연스럽습니다. ‘이방 민족들과 멍에를 함께 메고’는 원문의 멍에 비유를 적절히 유지합니다.
