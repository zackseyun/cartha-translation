  text: and they made themselves foreskins[a], and turned away from the holy covenant, and yoked themselves to the nations, and sold themselves to do evil.
  footnotes:
  - marker: a
    text: Literally, 'made themselves foreskins'; that is, they concealed or reversed the visible mark of circumcision.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 스스로 포피를 만들고, 거룩한 언약에서 떠나, 이방 민족들과 멍에를 함께 메고, 악을 행하려고 자신들을 팔았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘스스로 포피를 만들었다’입니다. 이는 할례의 보이는 표지를 감추거나 포피를 복원하려 했다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν ἑαυτοῖς ἀκροβυστίαν
  english_pob_choice: they made themselves foreskins
  chosen_korean: 자신들에게 할례 껍질을 만들어
  alternatives_korean:
  - 자신들을 할례받지 않은 상태로 만들고
  - 자신들에게 포피를 되돌려
  lexicon: LSJ
  rationale: 그리스어의 직설적인 충격성을 살리되, 한국어에서는 ‘할례 껍질’로 옮겨 문자적 이미지를 유지했습니다. ‘할례받지 않은 상태로 만들고’는 뜻은 분명하지만 본문의 노골적 표현이 약해집니다.
- source_word: ἀπέστησαν ἀπὸ διαθήκης ἁγίας
  english_pob_choice: turned away from the holy covenant
  chosen_korean: 거룩한 언약에서 떠나
  alternatives_korean:
  - 거룩한 언약을 배반하고
  - 거룩한 언약에서 돌아서고
  lexicon: LSJ
  rationale: ἀπέστησαν은 단순 이탈보다 언약적 결별을 뜻하므로 ‘떠나’로 옮겼습니다. ‘거룩한 언약’은 정관사가 없어도 이 문맥에서 알려진 언약을 가리킵니다.
- source_word: ἐζευγίσθησαν τοῖς ἔθνεσιν
  english_pob_choice: yoked themselves to the nations
  chosen_korean: 이방 민족들과 멍에를 함께 메고
  alternatives_korean:
  - 이방 민족들과 짝지어지고
  - 이방 민족들과 연결되고
  lexicon: LSJ
  rationale: 동사 어근의 ‘멍에’ 이미지를 살려, 언약 백성이 이방과 결속된 상태를 드러냈습니다. ‘함께 메고’는 다소 이례적이지만 원문 비유를 보존합니다.
- source_word: ἐπράθησαν τοῦ ποιῆσαι πονηρόν
  english_pob_choice: sold themselves to do evil
  chosen_korean: 스스로를 팔았습니다
  alternatives_korean:
  - 악을 행하려고 자신을 팔았습니다
  - 악을 하도록 자신을 내주었습니다
  lexicon: LSJ
  rationale: 중간/수동적 뉘앙스를 한국어에서 능동적 자기-매각으로 풀어, 자발적 자기 내맡김을 분명히 했습니다. 목적구는 앞뒤 문맥상 자연스럽게 ‘악을 행하려고’로 연결됩니다.
theological_decisions:
- issue: ‘ἀκροβυστίαν’의 한국어 직역과 해설 필요성
  chosen_reading: 본문에는 ‘할례 껍질을 만들어’처럼 노골적 이미지를 유지하고, 의미는 본문 내부에서 드러나게 합니다.
  alternative_readings:
  - ‘할례받지 않은 상태로 만들고’처럼 의미 위주로 순화하기
  - ‘포피를 되돌려’처럼 해부학적 표현으로 바꾸기
  rationale: 이 구절은 언약 파기를 상징적으로 폭로하는 표현이므로, 완곡하게 만들기보다 원문의 자극적 구체성을 보존하는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
