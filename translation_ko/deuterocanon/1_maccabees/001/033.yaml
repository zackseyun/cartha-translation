  yaml_path: translation/deuterocanon/1_maccabees/001/033.yaml
  text: And they fortified the city of David with a great and strong wall[a], with strong towers, and it became a citadel for them.
  footnotes:
  - marker: a
    text: Or 'it became an Acra for them.' The Greek ἄκρα can be read as a common noun ('citadel, stronghold') or as the historically recognized name of the Seleucid fortress.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 다윗의 성을 크고 견고한 성벽과 견고한 망대들로 세우고, 그것이 그들에게 요새가 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들에게 아크라가 되었습니다.’ 그리스어 ἄκρα는 일반 명사로서 ‘요새, 산성, 성채’를 뜻할 수도 있고, 역사적으로 알려진 셀레우코스 왕조의 요새인 아크라를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησαν
  english_pob_choice: they fortified
  chosen_korean: 세우고
  alternatives_korean:
  - 건축하고
  - 지었고
  - 보강하고
  lexicon: LSJ
  rationale: 원문 동사는 기본적으로 ‘짓다/건축하다’이지만, 문맥상 방어 시설을 갖추는 의미가 강하므로 한국어에서는 ‘세우고’로 옮겨 본문 흐름을 자연스럽게 살렸습니다.
- source_word: τὴν πόλιν Δαυεὶδ
  english_pob_choice: the city of David
  chosen_korean: 다윗의 성
  alternatives_korean:
  - 다윗 성
  - 다윗의 도시
  lexicon: LSJ
  rationale: 고유 지명 표현을 직역해 역사적·지리적 지시를 유지했습니다. 한국어 성경 관용도와 가독성을 함께 고려해 ‘다윗의 성’으로 잡았습니다.
- source_word: τείχει μεγάλῳ καὶ ὀχυρῷ, πύργοις ὀχυροῖς
  english_pob_choice: with a great and strong wall, with strong towers
  chosen_korean: 큰 견고한 성벽과 견고한 망대들로
  alternatives_korean:
  - 크고 강한 성벽과 강한 망대들로
  - 크고 요새화된 성벽과 요새화된 망대들로
  lexicon: LSJ
  rationale: ὀχυρός의 방어적 의미를 살려 ‘견고한’으로 통일했고, ‘성벽/망대’는 군사적 구조물을 자연스럽게 드러내는 표준어를 선택했습니다.
- source_word: ἐγένετο αὐτοῖς εἰς ἄκραν
  english_pob_choice: it became a citadel for them
  chosen_korean: 그들에게 요새가 되었습니다
  alternatives_korean:
  - 그들에게 산성이 되었습니다
  - 그들에게 성채가 되었습니다
  - 그들에게 아크라가 되었습니다
  lexicon: LSJ
  rationale: ἄκρα는 ‘요새/산성/성채’의 뜻이 가능하지만, 본문에서는 일반 명사로 읽는 것이 자연스럽습니다. 역사적 전용명 ‘아크라’는 주석적 대안으로 남기되 본문은 의미를 분명히 했습니다.
theological_decisions:
- issue: ἄκρα의 일반명사 vs. 셀레우코스 요새 고유명 가능성
  chosen_reading: 본문은 일반 명사 의미의 ‘요새’로 번역하고, 역사적 고유명 가능성은 각주로 보조합니다.
  alternative_readings:
  - 아크라
  - 성채
  rationale: 문맥상 방어 거점이라는 의미가 분명하며, 독자가 역사적 배경을 모를 때도 이해가 되도록 본문은 의미역을 택했습니다.
  doctrine_reference: 해석학/본문비평상 대안 표지의 원칙
