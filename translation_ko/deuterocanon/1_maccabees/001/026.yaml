  text: And rulers and elders groaned; virgins and young men grew weak[a], and the beauty of the women was altered.
  footnotes:
  - marker: a
    text: Or 'was changed.' The Greek states that the women's beauty was altered, without specifying exactly how.
    reason: lexical_alternative
translation:
  language: ko
  text: 통치자들과 장로들은 신음했습니다. 처녀들과 젊은 남자들은 쇠약해졌으며, 여자들의 아름다움은 변했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “달라졌습니다.” 그리스어는 여자들의 아름다움이 어떻게 달라졌는지를 구체적으로 밝히지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐστέναξαν
  english_pob_choice: groaned
  chosen_korean: 신음했고
  alternatives_korean:
  - 탄식했고
  - 신음했습니다
  lexicon: LSJ
  rationale: 고통과 비애가 드러나는 몸의 반응을 나타내므로, ‘탄식’보다 직접적이고 ‘groaned’의 감각을 잘 살리는 ‘신음했고’로 옮겼습니다.
- source_word: ἄρχοντες
  english_pob_choice: rulers
  chosen_korean: 통치자들
  alternatives_korean:
  - 지도자들
  - 군주들
  lexicon: LSJ
  rationale: 권위를 가진 사람들을 가리키는 일반 명칭이므로, 사회적 권력자를 분명히 드러내는 ‘통치자들’이 가장 무난합니다.
- source_word: ἠσθένησαν
  english_pob_choice: grew weak
  chosen_korean: 기운이 쇠했으며
  alternatives_korean:
  - 약해졌으며
  - 쇠약해졌으며
  lexicon: LSJ
  rationale: 점차 무기력해지는 상태를 자연스러운 한국어로 살리기 위해 ‘기운이 쇠하다’라는 관용적 표현을 사용했습니다.
- source_word: ἠλλοιώθη
  english_pob_choice: was altered
  chosen_korean: 변했습니다
  alternatives_korean:
  - 달라졌습니다
  - 바뀌었습니다
  lexicon: LSJ
  rationale: 그리스어는 변화의 방향을 구체화하지 않으므로, ‘변했습니다’로 최소한의 의미를 유지하면서 불필요한 해석을 피했습니다.
