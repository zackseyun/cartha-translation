translation:
  language: ko
  text: 통치자들과 장로들은 신음했고, 처녀들과 젊은이들은 기운이 쇠했으며, 여자들의 아름다움은 변했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “변했습니다.” 그리스어는 여자들의 아름다움이 어떻게 달라졌는지를 구체적으로 밝히지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐστέναξαν
  english_pob_choice: groaned
  chosen_korean: 신음했고
  alternatives_korean:
  - 탄식했고
  - 신음했습니다
  lexicon: LSJ
  rationale: 고통과 비애가 드러나는 몸의 반응을 나타내므로, ‘탄식’보다 직접적이고 ‘groaned’의 감각을 잘 살리는 ‘신음했고’로 옮겼습니다.
