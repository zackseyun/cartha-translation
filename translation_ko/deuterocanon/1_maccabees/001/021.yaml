  yaml_path: translation/deuterocanon/1_maccabees/001/021.yaml
  text: And he entered the sanctuary in arrogance[a], and took the golden altar, and the lampstand of the light with all its utensils,
  footnotes:
  - marker: a
    text: Or 'the holy place.' The Greek ἁγίασμα can be rendered more specifically, but 'sanctuary' was chosen to avoid over-specifying the exact chamber beyond what the wording itself requires.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 오만함으로 성소에 들어가서, 금 제단과 빛을 위한 등잔대와 그 모든 기구를 가져갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '거룩한 곳'. 그리스어 ἁγίασμα은 더 구체적으로 옮길 수 있지만, 본문이 요구하는 것보다 좁은 방을 단정하지 않기 위해 '성소'를 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁγίασμα
  english_pob_choice: sanctuary
  chosen_korean: 성소
  alternatives_korean:
  - 성역
  - 거룩한 곳
  - 성소 공간
  lexicon: LSJ
  rationale: ἁγίασμα는 성스러운 장소, 곧 성소를 가리키므로 '성소'가 가장 자연스럽고, 본문이 특정 실내 구획을 더 좁혀 말하지 않으므로 과잉 해석을 피합니다.
- source_word: ἐν ὑπερηφανίᾳ
  english_pob_choice: in arrogance
  chosen_korean: 오만함으로
  alternatives_korean:
  - 교만하게
  - 자만하여
  - 오만하게
  lexicon: LSJ
  rationale: 명사적 어감을 살려 행위의 방식과 도덕적 비난을 함께 드러내기 위해 '오만함으로'로 옮겼습니다.
- source_word: θυσιαστήριον τὸ χρυσοῦν
  english_pob_choice: the golden altar
  chosen_korean: 금 제단
  alternatives_korean:
  - 황금 제단
  - 금으로 된 제단
  - 황금으로 된 제단
  lexicon: LSJ
  rationale: 관형사적 표현을 한국어에서 자연스럽게 처리하면서도 재질을 분명히 드러내기 위해 '금 제단'을 택했습니다.
- source_word: λυχνίαν τοῦ φωτός
  english_pob_choice: the lampstand of the light
  chosen_korean: 빛을 위한 등잔대
  alternatives_korean:
  - 빛의 등잔대
  - 빛을 위한 등잔
  - 빛의 등잔
  lexicon: LSJ
  rationale: τοῦ φωτός의 기능적 관계를 살려 등잔대가 빛을 위해 쓰인다는 뜻을 드러냈고, 문맥상 성전 기구의 역할을 이해하기 쉽게 했습니다.
- source_word: σκεύη
  english_pob_choice: utensils
  chosen_korean: 기구
  alternatives_korean:
  - 도구
  - 집기
  - 기물
  lexicon: LSJ
  rationale: 성전 기물들을 가리키는 일반 명사로서 '기구'가 가장 중립적이며, 문맥의 물건성도 잘 보존합니다.
theological_decisions:
- issue: ἁγίασμα를 '성소'로 좁혀도 되는가
  chosen_reading: '''성소''는 성전의 거룩한 공간을 가리키는 일반적 표현으로 사용하되, 특정 내실을 단정하지 않습니다.'
  alternative_readings:
  - '''성전'''
  - '''거룩한 곳'''
  rationale: 그리스어는 성전의 거룩한 영역을 말하지만 정확한 방 구획을 명시하지 않으므로, '성소'가 본문의 성스러움과 공간성을 함께 보존합니다.
  doctrine_reference: '번역 원칙: 본문이 말하는 범위를 넘어 특정 제의 공간을 단정하지 않는다.'
