  text: And they hung the infants from their necks[a], and their household members[b], and those who had circumcised them.
  footnotes:
  - marker: a
    text: Or 'their families' or 'their relatives' for 'their household members' (τοὺς οἰκείους αὐτῶν).
    reason: lexical_alternative
  - marker: b
    text: The Greek uses one verb ('hung') with all three objects in compressed style; some readers may understand the final two groups as likewise subjected to execution.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그들은 아기들을 목에 매달았으며, 그들의 식구들[a]과 그들에게 할례를 행한 사람들도 매달았습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 가족들’이나 ‘그들의 친족들’로 옮길 수 있습니다(τοὺς οἰκείους αὐτῶν).
    reason: lexical_alternative
  - marker: b
    text: 헬라어는 하나의 동사(‘매달다’)를 세 목적어에 압축해 연결합니다. 따라서 뒤의 두 집단에도 같은 동사가 적용됩니다.
    reason: alternative_reading
