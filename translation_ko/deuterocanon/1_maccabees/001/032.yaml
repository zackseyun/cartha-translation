  yaml_path: translation/deuterocanon/1_maccabees/001/032.yaml
  text: And they took the women and the children captive[a], and they took the livestock as plunder.
  footnotes:
  - marker: a
    text: Literally, 'the livestock they took possession of' or 'they inherited.' The Greek verb normally has the sense of receiving a possession, but here it functions in a conquest context for taking animals as plunder.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 여자들과 아이들을 사로잡았고, 가축은 노략물로 차지하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘가축을 그들이 차지하였다’ 또는 ‘그들이 그것을 상속하였다’입니다. 이 동사는 보통 ‘유산을 받다’의 뜻이지만, 여기서는 정복 문맥에서 가축을 전리품처럼 취한 의미로 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾐχμαλώτευσεν
  english_pob_choice: took ... captive
  chosen_korean: 사로잡았습니다
  alternatives_korean:
  - 포로로 데려갔습니다
  - 포로로 잡았습니다
  lexicon: LSJ
  rationale: 전쟁 맥락에서 사람들을 강제로 끌고 가 포로로 삼는 뜻을 자연스럽게 살리면서, 현대 한국어로도 지나치게 평탄하지 않게 옮겼습니다.
- source_word: τὰς γυναῖκας
  english_pob_choice: the women
  chosen_korean: 여자들
  alternatives_korean:
  - 여인들
  - 아내들
  lexicon: LSJ
  rationale: 문맥상 아내들로 한정할 근거가 없고, 피해자 집단을 일반적으로 가리키므로 가장 직접적인 ‘여자들’로 옮겼습니다.
- source_word: τὰ κτήνη
  english_pob_choice: the livestock
  chosen_korean: 가축
  alternatives_korean:
  - 가축 떼
  - 짐승들
  lexicon: LSJ
  rationale: 가축을 뜻하는 소유물성 동물을 가리키므로, 현대 독자가 바로 이해할 수 있는 ‘가축’을 선택했습니다.
- source_word: ἐκληρονόμησαν
  english_pob_choice: took the livestock as plunder
  chosen_korean: 노략물로 차지하였습니다
  alternatives_korean:
  - 노획하였습니다
  - 빼앗아 차지하였습니다
  - 유산으로 받았습니다
  lexicon: LSJ
  rationale: 본래 ‘상속하다/차지하다’ 계열이지만 여기서는 정복 맥락에서 가축을 전리품처럼 취한 뜻이므로, 의미를 분명히 하는 ‘노략물로 차지하다’를 택했습니다.
theological_decisions:
- issue: 전쟁 약탈 서술의 강도
  chosen_reading: 사람은 ‘사로잡았고’, 가축은 ‘노략물로 차지하였습니다’로 구분해 인명 피해와 재산 약탈을 함께 드러냈습니다.
  alternative_readings:
  - 모두 ‘붙잡았습니다’로 완화
  - 가축도 ‘빼앗았습니다’로 일반화
  rationale: 원문이 사람과 가축을 구분하며 전쟁의 폭력성과 약탈성을 함께 제시하므로, 두 대상을 같은 동사로 평탄화하지 않았습니다.
  doctrine_reference: 본문 서술의 역사적·윤리적 무게를 보존하는 번역 원칙
- issue: 직역과 관용의 균형
  chosen_reading: ‘노략물로 차지하였습니다’로 원문의 소유 획득 뉘앙스를 살리되, 현대 독자가 이해 가능한 표현을 유지했습니다.
  alternative_readings:
  - ‘상속하였습니다’
  - ‘소유하게 되었습니다’
  rationale: ἐκληρονόμησαν의 문자적 의미를 그대로 살리면 문맥에 어긋나므로, 정복 전리품의 의미를 드러내는 관용 표현이 필요합니다.
  doctrine_reference: 문맥 우선의 어휘 결정
