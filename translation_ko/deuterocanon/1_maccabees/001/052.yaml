  text: And many from the people gathered to them, everyone who was abandoning the law; and they did evil in the land,
translation:
  language: ko
  text: 그리고 많은 사람들이 백성 가운데서 그들에게 합류하였는데, 율법을 버리고 있던 사람들 모두였습니다. 그들은 그 땅에서 악을 행하였습니다.
  philosophy: formal
lexical_decisions:
- source_word: συνηθροίσθησαν ἀπὸ τοῦ λαοῦ πρὸς αὐτοὺς πολλοί
  english_pob_choice: And many from the people gathered to them
  chosen_korean: 많은 사람들이 백성 가운데서 그들에게 합류하였는데
  alternatives_korean:
  - 백성 가운데 많은 이들이 그들에게 모여들었습니다
  - 백성 중 많은 사람이 그들에게 가담하였습니다
  lexicon: συναθροίζω
  rationale: 단순히 '모이다'보다 집단에 붙어 들어가는 움직임이 드러나는 '합류하다'가 문맥에 맞고, ἀπὸ τοῦ λαοῦ는 '백성 가운데서'로 자연스럽게 옮겼습니다.
- source_word: πᾶς ὁ ἐγκαταλείπων τὸν νόμον
  english_pob_choice: everyone who was abandoning the law
  chosen_korean: 율법을 버리고 있던 사람들 모두였습니다
  alternatives_korean:
  - 율법을 버리는 모든 사람이었습니다
  - 율법을 저버린 모든 사람이었습니다
  lexicon: ἐγκαταλείπων + νόμος
  rationale: 현재분사 ἐγκαταλείπων의 진행성을 살려 '버리고 있던'으로 옮겼고, νόμος는 본문과 마카베오서의 맥락상 '율법'이 적절합니다.
- source_word: ἐποίησαν κακὰ
  english_pob_choice: and they did evil
  chosen_korean: 그들은 악을 행하였습니다
  alternatives_korean:
  - 그들은 악한 일을 하였습니다
  - 그들은 나쁜 짓을 하였습니다
  lexicon: ποιέω + κακά
  rationale: κακά의 도덕적 악성을 분명히 드러내기 위해 관용적이고도 직접적인 '악을 행하다'를 택했습니다.
theological_decisions:
- issue: 율법을 버리는 자들과 결합된 행위의 성격
  chosen_reading: 본문은 단순한 정치적 동조가 아니라 율법 이탈과 악행의 도덕적 연계를 함께 제시합니다.
  alternative_readings:
  - 단순한 사회적 동맹으로 약화해서 읽기
  - '''율법''을 일반 법규로 완화해서 읽기'
  rationale: 문맥상 νόμος는 하나님의 율법을 가리키며, 이를 버리는 행위와 악행이 직접 연결되어 있습니다.
  doctrine_reference: 율법/언약적 충성의 기본 구분
