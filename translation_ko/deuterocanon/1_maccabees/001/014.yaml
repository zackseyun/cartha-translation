translation:
  language: ko
  text: 그들은 이방 민족들[a]의 관습에 따라 예루살렘에 체육관을 세웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이방인들’입니다. 그리스어는 직역하면 ‘민족들’이며, 유대 문맥에서는 비유대 민족을 가리키는 흔한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησαν
  english_pob_choice: built
  chosen_korean: 세우고
  alternatives_korean:
  - 지었고
  - 건축했고
  lexicon: BDAG
  rationale: 아오리스트 동사의 완료된 건립 행위를 자연스럽게 옮기되, 현대 한국어에서 가장 평이한 동사인 ‘세우다’를 택했습니다.
- source_word: γυμνάσιον
  english_pob_choice: gymnasium
  chosen_korean: 체육관
  alternatives_korean:
  - 김나지온
  - 운동장
  - 훈련장
  lexicon: LSJ
  rationale: 본문의 헬레니즘 제도를 가리키는 말이지만, 한국어 독자에게는 역사적 의미를 전달하면서도 즉시 이해 가능한 ‘체육관’이 가장 적절합니다.
- source_word: τὰ νόμιμα
  english_pob_choice: the customs
  chosen_korean: 관습
  alternatives_korean:
  - 법규
  - 관례
  - 제도
  lexicon: LSJ
  rationale: 여기서는 성문화된 법보다 공동체의 생활양식·관행을 가리키므로 ‘관습’이 가장 직접적입니다.
- source_word: τῶν ἐθνῶν
  english_pob_choice: of the nations
  chosen_korean: 이방 민족들의
  alternatives_korean:
  - 민족들의
  - 열국의
  - 이방인들의
  lexicon: BDAG
  rationale: 문맥상 유대 공동체와 대비되는 비유대 민족들을 뜻하므로, 의미를 분명히 하되 ‘이방 민족들’로 과도한 해석을 더하지 않도록 했습니다.
theological_decisions:
- issue: τῶν ἐθνῶν의 번역 방향
  chosen_reading: ‘민족들’의 문자성을 살리면서 문맥상 비유대 집단임을 드러내기 위해 ‘이방 민족들’로 옮겼습니다.
  alternative_readings:
  - ‘열국의’
  - ‘이방인들의’
  rationale: 그리스어는 직역하면 ‘민족들’이지만, 1마카비의 유대적 대조 구도에서는 단순한 민족 일반이 아니라 비유대 세계를 가리키므로 의미를 분명히 하는 것이 필요합니다.
  doctrine_reference: Translation philosophy §1, §5
