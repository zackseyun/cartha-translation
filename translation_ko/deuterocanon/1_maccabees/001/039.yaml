  text: Her sanctuary was laid waste like a wilderness; her feasts were turned into mourning, her Sabbaths into reproach, her honor into contempt,
translation:
  language: ko
  text: 그 성소는 광야처럼 황폐해졌습니다. 그 축제들은 애도로 바뀌었고, 그 안식일들은 수치가 되었으며, 그 영광은 멸시가 되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ ἁγίασμα
  english_pob_choice: sanctuary
  chosen_korean: 성소
  alternatives_korean:
  - 성역
  - 성전
  lexicon: LSJ
  rationale: ἁγίασμα는 예루살렘의 거룩한 예배 공간을 가리키므로, 일반적이면서도 제의적 함의를 살리는 ‘성소’가 가장 자연스럽습니다.
- source_word: ἠρημώθη ὡς ἔρημος
  english_pob_choice: was laid waste like a wilderness
  chosen_korean: 광야처럼 황폐해졌습니다
  alternatives_korean:
  - 사막처럼 버려졌습니다
  - 들판처럼 폐허가 되었습니다
  lexicon: LSJ
  rationale: 수동적 파괴와 황폐의 결과를 함께 살리되, ὡς ἔρημος의 비교를 한국어에서 자연스럽게 드러내기 위해 ‘광야처럼 황폐해졌습니다’로 옮겼습니다.
- source_word: αἱ ἑορταὶ αὐτῆς ἐστράφησαν εἰς πένθος
  english_pob_choice: her feasts were turned into mourning
  chosen_korean: 그 축제들은 애도로 바뀌었고
  alternatives_korean:
  - 그 절기들은 슬픔이 되었고
  - 그 명절들은 통곡으로 바뀌었고
  lexicon: LSJ
  rationale: ἑορταί는 성전 중심 절기들을 가리키므로 ‘축제들’보다 너무 교회적이지 않으면서도, ‘애도’가 πένθος의 장례·슬픔의 뉘앙스를 잘 살립니다.
- source_word: τὰ σάββατα αὐτῆς εἰς ὀνειδισμόν
  english_pob_choice: her Sabbaths into reproach
  chosen_korean: 그 안식일들은 수치가 되었으며
  alternatives_korean:
  - 그 안식일들은 조롱거리가 되었으며
  - 그 안식일들은 모욕이 되었으며
  lexicon: LSJ
  rationale: ὀνειδισμός는 공개적 수치와 모욕의 뜻을 함께 가지므로, 결과 상태를 분명히 드러내는 ‘수치’로 옮기되 문맥상 사람들의 조롱을 암시하도록 했습니다.
- source_word: τιμὴ αὐτῆς εἰς ἐξουδένωσιν
  english_pob_choice: her honor into contempt
  chosen_korean: 그 영광은 멸시가 되었습니다
  alternatives_korean:
  - 그 존귀는 천대가 되었습니다
  - 그 존엄은 무시가 되었습니다
  lexicon: LSJ
  rationale: τιμή는 ‘명예/존귀/가치’ 범위를 가지지만, 본절의 대조를 살려 도시의 예전 지위를 가리키는 ‘영광’으로, ἐξουδένωσις는 ‘멸시’로 간결하게 대응했습니다.
theological_decisions:
- issue: 여성 대명사 αὐτῆς의 지시 대상
  chosen_reading: 지시 대상을 명시하지 않고 ‘그/그녀의’ 대신 문맥상 성소·절기·안식일의 소유를 자연스럽게 이어 받게 했습니다.
  alternative_readings:
  - ‘예루살렘의’로 명시
  - ‘그 도시의’로 명시
  rationale: 히브리적 애가의 인격화된 어조를 유지하기 위해, 그리스어의 반복된 여성 소유격을 한국어도 직접적인 소유격 반복보다 문맥적 생략으로 살렸습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy with literary force preserved where natural.'
