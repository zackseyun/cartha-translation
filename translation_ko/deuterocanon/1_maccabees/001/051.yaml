  yaml_path: translation/deuterocanon/1_maccabees/001/051.yaml
  text: According to all these words he wrote to his whole kingdom[a], and he appointed overseers over all the people; and he commanded the cities of Judah to offer sacrifices, city by city.
  footnotes:
  - marker: a
    text: Or 'he wrote to his kingdom.' The Greek dative can be rendered more tersely; 'whole' is an interpretive expansion to reflect the broad scope implied by the context.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 모든 말에 따라 그는 자기 왕국[a]에 편지를 보냈고, 모든 백성 위에 감독들을 세웠으며, 유다의 도시들에는 도시마다 희생 제사를 드리라고 명령했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 왕국에 썼다.’ 그리스어 여격은 더 간결하게 옮길 수 있으며, ‘whole’은 문맥상 넓은 범위를 드러내기 위한 해석적 보충입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψεν τῇ βασιλείᾳ αὐτοῦ
  english_pob_choice: he wrote to his whole kingdom
  chosen_korean: 자기 왕국에 편지를 보냈고
  alternatives_korean:
  - 자기 왕국에 썼고
  - 자기 왕국에 공문을 보내고
  lexicon: LSJ
  rationale: τῇ βασιλείᾳ αὐτοῦ는 왕국 전체를 향한 왕의 서신 행위를 가리키므로, 한국어에서는 자연스러운 행정적 표현인 ‘편지를 보냈고’로 옮기되, 왕국 전체를 향한 범위를 문맥으로 드러냈습니다.
- source_word: ἐποίησεν ἐπισκόπους
  english_pob_choice: he appointed overseers
  chosen_korean: 감독들을 세웠으며
  alternatives_korean:
  - 감독들을 임명했으며
  - 감찰관들을 세웠으며
  lexicon: LSJ
  rationale: ἐπίσκοποι는 여기서 교회 직분이 아니라 행정 감시관을 뜻하므로, POB의 ‘overseers’를 따라 ‘감독들’로 옮겨 후대 교회 용례를 피했습니다.
- source_word: ἐπὶ πάντα τὸν λαόν
  english_pob_choice: over all the people
  chosen_korean: 모든 백성 위에
  alternatives_korean:
  - 온 백성 위에
  - 모든 백성 전체를 다스리도록
  lexicon: LSJ
  rationale: ἐπὶ + 대격은 통치·관할의 의미를 나타내므로, 감독들의 권한 범위를 드러내는 ‘위에’가 가장 직접적입니다.
- source_word: θυσιάζειν κατὰ πόλιν καὶ πόλιν
  english_pob_choice: to offer sacrifices, city by city
  chosen_korean: 도시마다 희생 제사를 드리라고
  alternatives_korean:
  - 도시마다 제사를 드리라고
  - 각 도시에서 희생 제사를 드리라고
  lexicon: LSJ
  rationale: θυσιάζειν은 단순한 일반 제의보다 제물로 드리는 희생 행위를 가리키므로, ‘희생 제사’로 구체화했고, κατὰ πόλιν καὶ πόλιν의 분배적 반복성은 ‘도시마다’로 살렸습니다.
theological_decisions:
- issue: ἐπισκόπους의 번역에서 후대 교회 직분 의미를 피할지 여부
  chosen_reading: 행정 감시관을 뜻하는 일반 명사로서 ‘감독들’
  alternative_readings:
  - 주교들
  - 감찰관들
  - 감독관들
  rationale: 본문은 왕권의 강제 집행을 묘사하므로, 교회 직분인 ‘주교’는 시대착오적입니다. ‘감독들’은 어휘의 기본 의미를 살리면서도 교회론적 전이를 막습니다.
  doctrine_reference: 번역 철학 §1, §6
