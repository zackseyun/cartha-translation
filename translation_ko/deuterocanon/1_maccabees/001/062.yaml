revisions:
- from: 그리고 이스라엘의 많은 사람이 굳게 서고 서로 힘을 얻어 부정한 음식[a]을 먹지 않으려고 했습니다.
  to: 그리고 이스라엘 가운데 많은 사람이 굳세어지고 그들 가운데서 굳건해져, 부정한 것을 먹지 않으려고 하였습니다.[a]
  rationale: 두 수동 동사의 병렬을 ‘굳세어지고 … 굳건해져’로 유지하고, ἐν αὐτοῖς는 ‘그들 가운데서’로 옮겨 공동체적 연대와 내적 확신 가운데 어느 하나를 지나치게 확정하지 않았습니다. κοινά는 한국어 문맥상 ‘부정한 것’으로 번역하고, 각주에서 문자적 및 의례적 의미를 구분했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:39:31Z'
review_pass:
  verdict: revise
  source_fidelity: ‘굳게 서고’와 ‘힘을 얻어’는 두 동사의 강함과 견고함의 병렬을 대체로 반영합니다. 그러나 ‘서로 힘을 얻어’는 ἐν αὐτοῖς를 ‘서로에게서 힘을 얻다’라는 적극적 상호 수여로 다소 좁히며, κοινά는 음식 자체라기보다 문맥상 먹는 ‘부정한 것’을 가리킵니다.
  naturalness: 현 문장은 자연스럽지만, ‘서로 힘을 얻어’보다 ‘그들 가운데서 굳건해져’가 원문의 위치 표현과 두 번째 동사의 어감을 더 직접적으로 보존합니다. ‘부정한 것을 먹지 않으려고’도 한국어에서 간결하고 자연스럽습니다.
  terminology: κοινά는 정결 규정 문맥의 의례적 부정을 가리키므로 ‘부정한 것’이 적절합니다. 각주가 본문 표현인 ‘부정한 음식’을 다시 대안으로 제시하는 자기반복을 피하고, ‘속된 것들/일반적인 것들’이라는 문자적 범위를 밝혀야 합니다.
