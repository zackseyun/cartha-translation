  text: 그리고 집들의 문간과 거리에서 향을 피웠습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘향을 바쳤습니다.’ 그리스어 동사는 향을 피우는 행위, 곧 제의적 제물로 향을 바치는 행위를 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘거리’는 ‘넓은 거리’나 ‘공공 광장’으로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: θυρίδων
  english_pob_choice: doorways
  chosen_korean: 문간
  alternatives_korean:
  - 문
  - 출입구
  - 문턱
  lexicon: LSJ
  rationale: θυρίς/θυρίδων은 단순한 ‘문’보다 출입 지점을 가리킬 수 있어, 집의 외곽 위치를 살리는 ‘문간’이 자연스럽습니다.
- source_word: οἰκιῶν
  english_pob_choice: houses
  chosen_korean: 집들
  alternatives_korean:
  - 가옥들
  - 주택들
  - 집
  lexicon: LSJ
  rationale: 복수의 물리적 장소를 가리키므로, 한국어에서는 가장 직접적인 ‘집들’이 무난합니다.
- source_word: πλατείαις
  english_pob_choice: streets
  chosen_korean: 거리
  alternatives_korean:
  - 넓은 거리
  - 광장
  - 공공 광장
  lexicon: LSJ
  rationale: πλατεῖαις는 넓은 길이나 공개된 도시 공간을 뜻할 수 있으나, 문맥상 공개된 장소를 포괄하는 ‘거리’가 가장 자연스럽습니다.
- source_word: ἐθυμίων
  english_pob_choice: they burned incense
  chosen_korean: 향을 피웠습니다
  alternatives_korean:
  - 향을 바쳤습니다
  - 분향했습니다
  - 향을 태웠습니다
  lexicon: LSJ
  rationale: θυμιάω는 향을 피우거나 분향하는 행위를 뜻하므로, 한국어에서는 예식적 함의를 살리면서도 직설적인 ‘향을 피웠습니다’가 적절합니다.
theological_decisions:
- issue: 우상 숭배적 행위를 묘사하는 동사의 뉘앙스
  chosen_reading: ‘향을 피웠습니다’로 번역해 제의적 행위이면서도 본문이 비판하는 우상 숭배 행위의 성격을 드러냈습니다.
  alternative_readings:
  - ‘향을 바쳤습니다’
  - ‘분향했습니다’
  rationale: 본문은 단순한 일상적 향 사용이 아니라 공개 장소에서의 제의 행위를 말하므로, 한국어에서도 그 종교적·우상 숭배적 성격이 흐려지지 않도록 했습니다.
  doctrine_reference: 우상 숭배 경계와 제의 행위 묘사
- issue: 공개 공간의 범위
  chosen_reading: ‘거리’로 옮기되, 각주로 더 넓은 공개 공간 가능성을 열어 두었습니다.
  alternative_readings:
  - ‘넓은 거리’
  - ‘광장’
  rationale: πλατείαις는 넓은 길이나 공공장소까지 포괄할 수 있어, 본문은 간결하게 ‘거리’로 두고 주석에서 의미 범위를 설명하는 편이 안전합니다.
  doctrine_reference: 본문 의미 보존과 어휘 범위 주석
