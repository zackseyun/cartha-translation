  text: And he took the silver and the gold[a], and the precious vessels[b]; and he took the hidden treasures that he found.
  footnotes:
  - marker: a
    text: Or 'precious vessels' for 'desirable vessels'; the Greek literally means 'desired' or 'desirable.'
    reason: lexical_alternative
  - marker: b
    text: Or 'concealed treasures' or 'secret treasure stores'; the Greek can refer either to hidden valuables or to hidden storehouses of treasure.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 은과 금, 그리고 바람직한 그릇들을 가져갔으며, 그가 찾아낸 감추어진 보물들도 가져갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘귀한 그릇들’. 그리스어는 문자적으로 ‘바람직한/탐나는’의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘숨겨진 보물들’ 혹은 ‘감추어진 보물 저장고들’. 그리스어는 숨겨진 값진 것들 또는 보물을 보관한 은닉 장소를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβεν
  english_pob_choice: took
  chosen_korean: 가져갔습니다
  alternatives_korean:
  - 취했습니다
  - 빼앗았습니다
  lexicon: LSJ
  rationale: ἔλαβεν의 기본값은 단순한 ‘취하다/가져가다’이므로, 문맥상 약탈의 뉘앙스는 살리되 과도한 해석을 피하는 ‘가져갔습니다’를 택했습니다.
- source_word: τὰ σκεύη τὰ ἐπιθυμητά
  english_pob_choice: the precious vessels / the desirable vessels
  chosen_korean: 바람직한 그릇들
  alternatives_korean:
  - 귀한 그릇들
  - 소중한 기물들
  - 탐나는 그릇들
  lexicon: LSJ
  rationale: ἐπιθυμητά는 문자적으로 ‘바람직한/탐나는’이므로, POB의 주석 취지를 반영해 평가를 덧붙이지 않는 ‘바람직한’으로 옮겼습니다.
- source_word: τοὺς θησαυροὺς τοὺς ἀποκρύφους
  english_pob_choice: the hidden treasures
  chosen_korean: 감추어진 보물들
  alternatives_korean:
  - 숨겨진 보물들
  - 은닉된 보물들
  - 감춰진 보물 저장고들
  lexicon: LSJ
  rationale: ἀπόκρυφος는 ‘숨겨진/감추어진’의 뜻이므로, 발견된 대상이라는 문맥을 자연스럽게 살리면서도 저장고로 한정하지 않는 ‘감추어진 보물들’을 선택했습니다.
