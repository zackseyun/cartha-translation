translation:
  language: ko
  text: 그리고 그는 은과 금과 탐나는 기물들[a]을 가져갔으며, 찾아낸 숨겨진 보물들[b]도 가져갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘귀한 기물들’. 그리스어는 문자적으로 ‘바람직한’ 또는 ‘탐나는’이라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘감추어진 보물들’ 또는 ‘은닉된 보물 저장고들’. 그리스어는 숨겨진 값진 것들이나 보물이 감추어져 있는 저장고를 가리킬 수 있습니다.
    reason: lexical_alternative
