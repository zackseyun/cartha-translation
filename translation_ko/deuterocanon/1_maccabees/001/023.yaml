  rationale: 현대 한국어의 자연스러움과 성전 약탈 문맥을 위해 ‘바람직한 그릇들’을 ‘탐나는 기물들’로 고쳤습니다. 이는 ἐπιθυμητά의 ‘원해지는/탐나는’ 의미를 보존하며 ‘귀한’이라는 문맥적 번역은 각주에 남깁니다. ‘숨겨진 보물들’은 저장고라는 가능한 의미를 본문에서 단정하지 않고 각주로 처리했습니다. 각주 표지도 해당 단어에 직접 연결했습니다.
