  text: And he took the silver and the gold[a], and the precious vessels[b]; and he took the hidden treasures that he found.
  footnotes:
  - marker: a
    text: Or 'precious vessels' for 'desirable vessels'; the Greek literally means 'desired' or 'desirable.'
    reason: lexical_alternative
  - marker: b
    text: Or 'concealed treasures' or 'secret treasure stores'; the Greek can refer either to hidden valuables or to hidden storehouses of treasure.
