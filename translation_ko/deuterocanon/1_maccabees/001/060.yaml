  text: And they put to death the women who had circumcised their children[a], according to the decree,
  footnotes:
  - marker: a
    text: Or 'the women who had their children circumcised'; the Greek uses an active participle ('having circumcised'), which may describe either direct action or arranged circumcision.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 자기들의 자녀를 할례한 여자들도, 그 명령에 따라 죽였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기들의 자녀에게 할례를 받게 한 여자들’이라는 뜻일 수 있습니다. 그리스어는 능동 분사(‘할례한’)를 사용하므로, 직접 행위와 주선한 행위 둘 다 가능할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰς γυναῖκας τὰς περιτετμηκυίας
  english_pob_choice: the women who had circumcised
  chosen_korean: 자기들의 자녀를 할례한 여자들
  alternatives_korean:
  - 자기들의 자녀에게 할례를 행한 여자들
  - 자기들의 자녀를 할례하게 한 여자들
  lexicon: LSJ
  rationale: 그리스어 능동 분사 περιτετμηκυίας를 따라, 여인들이 그 행위의 주체였음을 살리되 한국어에서는 자연스럽게 ‘할례한’으로 옮겼습니다. causative 뉘앙스도 가능하지만 본문은 직접 능동형이므로 주번역에서는 주체성을 유지했습니다.
- source_word: τὰ τέκνα αὐτῶν
  english_pob_choice: their children
  chosen_korean: 자기들의 자녀
  alternatives_korean:
  - 자기들의 아들들
  - 자기들의 아이들
  lexicon: LSJ
  rationale: τέκνα는 기본적으로 ‘자녀/아이들’이므로, 할례 문맥이라도 원문 범위를 좁히지 않고 ‘자녀’로 옮겼습니다.
- source_word: ἐθανάτωσαν
  english_pob_choice: they put to death
  chosen_korean: 죽였습니다
  alternatives_korean:
  - 처형했습니다
  - 사형에 처했습니다
  lexicon: LSJ
  rationale: 동사는 ‘죽이다/죽게 하다’의 의미이므로, 공식 명령 아래의 맥락을 살리면서도 과도하게 법정 절차를 덧붙이지 않는 ‘죽였습니다’가 적절합니다.
- source_word: κατὰ τὸ πρόσταγμα
  english_pob_choice: according to the decree
  chosen_korean: 그 명령에 따라
  alternatives_korean:
  - 그 칙령에 따라
  - 그 법령에 따라
  lexicon: LSJ
  rationale: πρόσταγμα은 명령, 칙령, 포고를 가리킬 수 있지만, 여기서는 앞뒤 문맥의 박해 명령을 반영해 가장 포괄적인 ‘명령’을 택했습니다.
theological_decisions:
- issue: 여인들의 행위 주체성
  chosen_reading: 여인들이 직접 자녀에게 할례를 행한 주체로 읽었습니다.
  alternative_readings:
  - 여인들이 자녀에게 할례를 받게 한 주체로 읽을 수 있습니다.
  rationale: 그리스어 분사가 능동형이므로, 본문은 직접 행위 주체성을 우선적으로 드러냅니다. 다만 문맥상 시술을 주선했을 가능성도 있어 이를 주해적 대안으로 남겨 둡니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: τέκνα의 범위
  chosen_reading: ‘자녀’로 번역해 원문의 범위를 그대로 유지했습니다.
  alternative_readings:
  - ‘아들들’로 좁혀 옮길 수 있습니다.
  rationale: 할례는 남성에게만 적용되지만, 원문은 더 넓은 명사 τέκνα를 사용합니다. 본문에 없는 제한을 추가하지 않기 위해 ‘자녀’를 유지했습니다.
  doctrine_reference: Translation philosophy §1
