  yaml_path: translation/deuterocanon/1_maccabees/001/004.yaml
  text: And he gathered a very strong force[a], and began to rule over lands and nations and dominions[b], and they became tributary to him.
  footnotes:
  - marker: a
    text: Or 'began to reign over' or simply 'ruled over'; the Greek verb can denote the exercise of rule, and the aorist may emphasize the beginning of that rule.
    reason: lexical_alternative
  - marker: b
    text: The term rendered 'tyrannies' refers to realms or governments ruled by tyrants; it is a formal rendering of the Greek, though 'principalities' or 'despotisms' are possible interpretive alternatives.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 매우 강한 군대를 모으고, 땅들과 민족들과 폭정들 위에 다스리기 시작하였으며, 그들은 그에게 조공을 바치게 되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἦρξεν은 단순히 ‘다스렸다’는 뜻일 수도 있고, ‘다스리기 시작했다’는 시작점을 강조할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: τyραννιῶν은 문자적으로는 ‘폭정들’이지만, 문맥상 폭군이 다스리는 여러 지배 체제나 영토를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆξεν δύναμιν ἰσχυρὰν σφόδρα
  english_pob_choice: gathered a very strong force
  chosen_korean: 매우 강한 군대를 모으고
  alternatives_korean:
  - 매우 강한 군세를 모으고
  - 매우 강한 전력을 집결하고
  lexicon: LSJ
  rationale: 군사적 맥락에서 δύναμις는 단순한 ‘힘’보다 무장한 병력이나 군세를 가리키므로, 자연스러운 현대어인 ‘군대’를 택하되 ‘모으고’로 συνῆξεν의 집결 의미를 살렸습니다.
- source_word: ἦρξεν
  english_pob_choice: began to rule over
  chosen_korean: 다스리기 시작하였으며
  alternatives_korean:
  - 통치하기 시작하였으며
  - 지배하기 시작하였으며
  lexicon: LSJ
  rationale: ἄρχω의 ingressive 뉘앙스가 있어 단순 과거 ‘다스렸으며’보다 ‘다스리기 시작하였으며’가 시작점을 더 잘 드러냅니다.
- source_word: χωρῶν καὶ ἐθνῶν καὶ τυραννιῶν
  english_pob_choice: lands and nations and dominions
  chosen_korean: 땅들과 민족들과 폭정들
  alternatives_korean:
  - 지역들과 민족들과 독재정권들
  - 땅들과 나라들과 폭정들
  lexicon: LSJ
  rationale: χωρῶν은 ‘땅/영토’, ἐθνῶν은 ‘민족들’이 자연스럽고, τυραννιῶν은 단순한 추상적 ‘폭정’이 아니라 폭군이 다스리는 정치적 실체를 가리키지만, 한국어에서는 그 실체성을 과도하게 풀지 않고 원문의 강한 정치적 긴장을 살려 ‘폭정들’로 옮겼습니다.
- source_word: ἐγένοντο αὐτῷ εἰς φόρον
  english_pob_choice: became tributary to him
  chosen_korean: 그들은 그에게 조공을 바치게 되었습니다
  alternatives_korean:
  - 그에게 조공을 내게 되었습니다
  - 그에게 조세를 바치게 되었습니다
  lexicon: LSJ
  rationale: φόρος는 정기적 과세이자 속국적 복속을 뜻하므로, 결과 상태를 담은 ‘조공을 바치게 되었습니다’가 문맥상 가장 분명합니다.
theological_decisions:
- issue: τυραννιῶν의 정치적 함의
  chosen_reading: 원문의 정치 용어를 완화하지 않고 ‘폭정들’로 유지하여, 권력 장악의 폭력성과 압제성을 드러냈습니다.
  alternative_readings:
  - ‘지배체제들’로 중립화
  - ‘독재정권들’로 현대화
  rationale: 마카베오기 1장의 역사 서술은 단순한 행정 통합이 아니라 폭군적 지배의 확장을 강조하므로, 독자의 감각을 누그러뜨리는 완곡어보다 강한 표현이 본문 의도에 더 가깝습니다.
  doctrine_reference: 역사적 서술의 직설성; 헬레니즘 지배 비판 문맥
- issue: ἐγένοντο αὐτῷ εἰς φόρον의 복속 의미
  chosen_reading: ‘조공을 바치게 되었습니다’로 옮겨, 단순 납세가 아니라 정치적 종속을 포함하는 결과 상태를 드러냈습니다.
  alternative_readings:
  - ‘세금을 내게 되었습니다’
  - ‘그에게 속하게 되었습니다’
  rationale: φόρος는 세금만이 아니라 패권 아래 놓인 속국의 공납을 함축하므로, ‘조공’이 가장 적절하게 복속 관계를 전달합니다.
  doctrine_reference: 본문의 제국-속국 관계 서술
