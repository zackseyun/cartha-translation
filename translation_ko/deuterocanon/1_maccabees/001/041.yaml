  yaml_path: translation/deuterocanon/1_maccabees/001/041.yaml
  text: And the king wrote to all his kingdom that all should become one people[b][a],
  footnotes:
  - marker: a
    text: Or 'to his whole kingdom' or 'throughout all his kingdom.' The Greek phrase indicates the full extent of the king's realm as the audience of the order.
    reason: lexical_alternative
  - marker: b
    text: Or 'that all should be one people.' The Greek can be rendered more literally with 'be,' but 'become' brings out the assimilating force of the command.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 왕은 자기 온 나라에 글을 보내어, 모두가 한 백성이 되라고 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 나라 전체에’, ‘그의 온 왕국에’. 그리스어 구는 왕의 왕국 전역을 그 글의 대상 범위로 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘모두가 한 백성이 되도록 하였습니다’. 더 문자적으로는 ‘모두가 한 백성으로 있도록 하였습니다’. ‘한 백성이 되라’는 표현은 문맥상 통합을 지시하는 뜻을 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψεν
  english_pob_choice: wrote
  chosen_korean: 편지를 보내어
  alternatives_korean:
  - 글로 써서
  - 기록하여
  - 조서를 내려
  lexicon: LSJ
  rationale: 동사는 기본적으로 ‘쓰다’이지만, 왕의 공적 명령을 넓은 통치권 전체에 전달하는 행위이므로 한국어에서는 자연스럽게 ‘편지를 보내어’로 옮겨 행정적 전달 기능을 살렸습니다.
- source_word: πάσῃ τὴν βασιλεία αὐτοῦ
  english_pob_choice: to all his kingdom
  chosen_korean: 자기 나라의 모든 백성에게
  alternatives_korean:
  - 자기 나라 전체에
  - 그의 온 나라에
  - 그의 모든 왕국에
  lexicon: LSJ
  rationale: 직역하면 ‘그의 온 나라/왕국에’이지만, 문맥상 수신자는 영토가 아니라 그 통치 영역의 사람들입니다. 따라서 ‘모든 백성에게’로 풀어 왕의 칙령이 미치는 범위를 자연스럽게 드러냈습니다.
- source_word: εἶναι πάντας εἰς λαὸν ἕνα
  english_pob_choice: that all should become one people
  chosen_korean: 모두가 한 백성이 되게
  alternatives_korean:
  - 모두가 한 백성이 되도록
  - 모두가 한 민족이 되게
  - 모두가 하나가 되게
  lexicon: LSJ
  rationale: εἶναι와 εἰς의 결합은 단순한 존재보다 ‘~이 되다’는 변화를 강하게 함의하므로, POB의 ‘become’에 따라 ‘되게’로 옮겼습니다. λαός는 여기서 정치·사회적 집단을 가리키므로 ‘백성’이 가장 무난합니다.
theological_decisions:
- issue: 제국의 동화 정책을 나타내는 ‘하나의 백성’ 표현
  chosen_reading: ‘한 백성이 되게’는 민족적·정치적 동화를 뜻하는 표현으로 유지했습니다.
  alternative_readings:
  - ‘한 민족이 되게’
  - ‘하나가 되게’
  rationale: 본문은 언약 백성에 대한 신학적 진술이 아니라 왕의 강제적 통합 정책을 말합니다. 그래서 ‘민족’처럼 현대 민족국가 뉘앙스를 더하지 않고, ‘백성’으로 평이하게 유지했습니다.
  doctrine_reference: '번역 원칙: 원문의 사회·정치적 의미를 보존하고 후대의 신학적/민족주의적 함의를 덧씌우지 않음.'
