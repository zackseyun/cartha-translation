  text: By their power they kept doing this to Israel[b][a], to those who were found in the cities month after month.
  footnotes:
  - marker: a
    text: Or 'by force'; the Greek phrase can emphasize coercive strength as the means by which they acted.
    reason: lexical_alternative
  - marker: b
    text: Literally 'in every month and month,' that is, repeatedly each month.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 힘으로 그들은 이스라엘에 이런 일을 계속했습니다. 곧 도시들에서 매달마다 발견되는 사람들에게 그렇게 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘강제로’; 그리스어 표현은 그들이 어떤 수단으로 행동했는지, 곧 강압적 힘을 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘매달마다’입니다. 즉, 매달 반복되었다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἰσχύϊ αὐτῶν
  english_pob_choice: By their power
  chosen_korean: 그들의 힘으로
  alternatives_korean:
  - 그들의 능력으로
  - 그들의 세력으로
  - 그들의 강압으로
  lexicon: LSJ
  rationale: 전치사 ἐν+여격이 수단을 나타내므로 한국어도 수단을 드러내는 표현으로 옮겼습니다. POB의 'By their power'에 맞추되, ‘강압’처럼 해석을 과도하게 좁히지 않았습니다.
- source_word: ἐποίουν οὕτω
  english_pob_choice: they kept doing this
  chosen_korean: 그들은 이런 일을 계속했습니다
  alternatives_korean:
  - 그들은 이렇게 했습니다
  - 그들은 계속 그렇게 했습니다
  - 그들은 이런 식으로 행했습니다
  lexicon: LSJ
  rationale: 미완료 시제가 반복·지속을 나타내므로 단회적 행위가 아니라 계속된 행동을 자연스러운 현대 한국어로 살렸습니다.
- source_word: τοῖς εὑρισκομένοις
  english_pob_choice: to those who were found
  chosen_korean: 발견되는 사람들에게
  alternatives_korean:
  - 찾아내어진 사람들에게
  - 발견된 사람들에게
  - 붙잡히는 사람들에게
  lexicon: LSJ
  rationale: 수동 분사는 ‘찾아내다/발견하다’의 대상이 되는 사람들을 가리키므로, 문맥상 권력자들이 찾아낸 대상이라는 점을 보존했습니다. ‘붙잡히는’은 의미를 지나치게 좁힐 수 있습니다.
- source_word: ἐν παντὶ μηνὶ καὶ μηνὶ
  english_pob_choice: month after month
  chosen_korean: 매달마다
  alternatives_korean:
  - 달마다
  - 매월
  - 한 달 한 달마다
  lexicon: LSJ
  rationale: ‘month and month’의 반복·분배적 뉘앙스를 현대 한국어의 반복 표현으로 옮겼습니다. 다만 본문 뒤의 시간부사와 중복되지 않도록 간결하게 처리했습니다.
theological_decisions:
- issue: 고발/가해의 반복성과 강제성
  chosen_reading: 본문은 이스라엘에 대한 반복적이고 지속적인 압박을 말하므로, 단순 과거사 진술보다 ‘계속했습니다’와 ‘힘으로’로 누적된 폭압을 드러냈습니다.
  alternative_readings:
  - 그들의 능력으로 그들은 이스라엘에게 이렇게 했습니다
  - 그들은 이스라엘을 상대로 매달 그렇게 했습니다
  rationale: 그리스어의 미완료상과 수단 표현을 함께 반영해, 본문의 억압적 분위기를 약화하지 않으면서도 본문이 명시하지 않은 세부 폭력 양상은 추가하지 않았습니다.
  doctrine_reference: 본문 맥락상 역사 서술의 폭정 묘사
