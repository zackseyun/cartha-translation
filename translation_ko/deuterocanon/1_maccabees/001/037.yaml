  - 성전을 더럽혔습니다
  - 성소를 부정하게 했습니다
  rationale: 동사는 단순 오염보다 제의적 모독을 포함하므로 ‘더럽혔다’가 본문의 신학적 긴장을 가장 분명하게 전달합니다.
