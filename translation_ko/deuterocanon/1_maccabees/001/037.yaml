translation:
  language: ko
  text: 그들이 성소 주위에 무죄한 피를 쏟았고, 성소를 더럽혔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξέχεαν
  english_pob_choice: poured out
  chosen_korean: 쏟았고
  alternatives_korean:
  - 흘렸고
  - 부었고
  lexicon: BDAG
  rationale: 피를 대상으로 한 δυναμική한 동사를 한국어에서는 자연스럽게 ‘쏟다’로 옮기면, 단순한 유혈이 아니라 마구 흘려버린 폭력을 드러낼 수 있습니다.
- source_word: αἷμα ἀθῷον
  english_pob_choice: innocent blood
  chosen_korean: 무죄한 피
  alternatives_korean:
  - 결백한 피
  - 죄 없는 피
  lexicon: BDAG
  rationale: 성경적 관용구의 의미를 살리면서도, ‘피’를 직접 유지해 억울하게 흘려진 생명의 폭력을 분명히 드러냅니다.
- source_word: κύκλῳ τοῦ ἁγιάσματος
  english_pob_choice: around the sanctuary
  chosen_korean: 성소 주위에
  alternatives_korean:
  - 성소 둘레에
  - 성소를 둘러싸고
  lexicon: BDAG
  rationale: κύκλῳ는 위치를 둘러싼다는 뜻이므로, 한국어에서는 간결하게 ‘주위에’로 옮겨 성소 주변에서 벌어진 모독을 살렸습니다.
- source_word: τοῦ ἁγιάσματος / τὸ ἁγίασμα
  english_pob_choice: the sanctuary
  chosen_korean: 성소
  alternatives_korean:
  - 성전
  - 거룩한 곳
  - 성역
  lexicon: BDAG
  rationale: ἁγίασμα는 여기서 추상적 ‘거룩함’이 아니라 신성한 장소를 가리키므로, 문맥에 맞는 ‘성소’가 가장 직접적입니다.
theological_decisions:
- issue: ἁγίασμα의 제의적·모독적 의미
  chosen_reading: 성소를 더럽혔습니다
  alternative_readings:
  - 성소를 더럽혔습니다
  - 성전을 더럽혔습니다
  - 성소를 부정하게 했습니다
  rationale: 동사는 단순 오염보다 제의적 모독을 포함하므로 ‘더럽혔다’가 본문의 신학적 긴장을 가장 분명하게 전달합니다.
