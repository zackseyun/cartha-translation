    issue: ‘그 땅의 법들과는 다른 법들’
    rationale: 원문은 ‘그 땅의 법들과 비교하여 다른 법들’이라기보다 ‘그 땅에 외래인 법들’을 뜻합니다. ‘그 땅에 낯선 법들’이 수식 관계를 더 직접적으로 반영하고 반복도 피합니다.
  revised_text: 그리고 왕은 사자들을 통하여 예루살렘과 유다의 도시들에 문서들을 보내어, 그 땅에 낯선 법들을 따르도록 하였습니다.[a]
