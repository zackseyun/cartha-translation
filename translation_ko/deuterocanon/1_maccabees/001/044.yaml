translation:
  language: ko
  text: 그리고 왕은 사자들을 통하여 예루살렘과 유다의 도시들에 문서들을 보내어, 그 땅에 낯선 법들을 따르도록 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅에 낯선 관습들’입니다. 그리스어 νόμιμα는 법규뿐 아니라 관습적 실천도 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: βιβλία
  english_pob_choice: letters
  chosen_korean: 문서들
  alternatives_korean:
  - 편지들
  - 서신들
  - 공문들
  lexicon: LSJ
  rationale: 왕이 보낸 것은 일반적인 ‘책’이 아니라 공식적으로 발송된 서면 지시문이므로, 행정적 성격을 살릴 수 있는 ‘문서들’을 선택했습니다.
- source_word: ἐν χειρὶ ἀγγέλων
  english_pob_choice: by the hand of messengers
  chosen_korean: 사자들의 손을 통해
  alternatives_korean:
  - 사자들을 통해
  - 사자들의 손으로
  - 전령들의 손을 통해
  lexicon: LSJ
  rationale: ‘손을 통해’라는 직역적 감각을 살리면서도, 실제 전달의 매개를 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: νομίμων ἀλλοτρίων
  english_pob_choice: laws foreign to the land
  chosen_korean: 그 땅의 법들과는 다른 법들
  alternatives_korean:
  - 그 땅에 속하지 않은 법들
  - 낯선 법들
  - 그 땅의 관습과 다른 법들
  lexicon: LSJ
  rationale: νόμιμα는 법규와 관습적 규범을 모두 가리킬 수 있으므로, 기본 의미를 보존하면서도 ‘법들’로 옮기되 ‘다른’으로 이질성을 드러냈습니다.
- source_word: τῆς γῆς
  english_pob_choice: the land
  chosen_korean: 그 땅
  alternatives_korean:
  - 그 나라
  - 그 땅의
  - 유다 땅
  lexicon: LSJ
  rationale: 원문이 단순히 ‘그 땅’이라고 하므로, 지명을 과도하게 특정하지 않고 그대로 살렸습니다.
