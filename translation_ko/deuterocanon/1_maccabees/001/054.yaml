  text: And on the fifteenth day of Chislev[a], in the one hundred forty-fifth year, they built the abomination of desolation upon the altar; and in the surrounding cities of Judah they built altars[b],
  footnotes:
  - marker: a
    text: Or, 'a desolating abomination' or 'the abomination that causes desolation.' The Greek phrase is compact and can be understood either as a fixed title-like expression or as a descriptive phrase.
    reason: lexical_alternative
  - marker: b
    text: The 'one hundred forty-fifth year' refers to Seleucid-era reckoning.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 제145년 키슬레브월 열다섯째 날, 그들은 제단 위에 황폐하게 하는 가증한 것[a]을 세웠습니다. 또 유다 곳곳의 성읍들에 제단들을 세웠습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘황폐의 가증한 것’, ‘황폐를 일으키는 가증한 것’. 그리스어 표현은 압축되어 있어, 표어와 같은 명칭으로도 서술적 표현으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘제145년’은 셀레우코스 기원에 따른 연대입니다.
    reason: cultural_note
