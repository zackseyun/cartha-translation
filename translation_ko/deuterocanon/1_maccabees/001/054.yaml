  text: 그리고 칠십오년째의 셋째 달, 곧 키슬레우월 열다섯째 날에 그들은 제단 위에 황폐케 하는 가증한 것을 세웠으며, 유다의 사방 도시들에도 제단들을 세웠습니다.[a]
