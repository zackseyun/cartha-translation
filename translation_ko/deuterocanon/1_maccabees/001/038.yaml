- from: 그리고 예루살렘의 주민들은 그들 때문에 달아났으며, 예루살렘은 이방인의 거처가 되었고, 자기 소산에게는 이방처럼 되었으며, 자기 자녀들은 예루살렘을 버렸습니다.[a]
  to: 그리고 예루살렘 주민들은 그들 때문에 달아났으며, 예루살렘은 이방인들의 거처가 되었고, 자기 자손들에게 낯선 곳이 되었으며, 그 자녀들은 예루살렘을 버렸습니다.[a]
