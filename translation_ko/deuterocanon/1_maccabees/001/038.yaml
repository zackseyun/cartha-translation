  yaml_path: translation/deuterocanon/1_maccabees/001/038.yaml
  text: And the inhabitants of Jerusalem fled because of them[a], and she became a dwelling place of foreigners; she became foreign to her offspring, and her children abandoned her.
  footnotes:
  - marker: a
    text: Or 'she became alien to her produce.' The Greek term can refer either to offspring/descendants or to what is produced; the immediate parallel with 'her children' favors 'offspring.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 예루살렘 주민들은 그들 때문에 달아났으며, 예루살렘은 이방인들의 거처가 되었고, 자기 자손들에게 낯선 곳이 되었으며, 그 자녀들은 예루살렘을 버렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 소산에게 낯선 곳이 되었다.’ 그리스어 γενήματα는 ‘자손/후손’ 또는 ‘열매/소산’을 가리킬 수 있습니다. 바로 뒤의 ‘그 자녀들’과의 병행은 여기서 ‘자손’의 뜻을 뒷받침합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κάτοικοι
  english_pob_choice: the inhabitants
  chosen_korean: 주민들
  alternatives_korean:
  - 거주자들
  - 살던 이들
  lexicon: LSJ
  rationale: 예루살렘에 살던 사람들을 가리키므로, 역사 서술에 자연스럽고 현대적인 표준어인 ‘주민들’로 옮겼습니다.
- source_word: διʼ αὐτούς
  english_pob_choice: because of them
  chosen_korean: 그들 때문에
  alternatives_korean:
  - 그들로 인해
  - 그들 때문으로
  lexicon: LSJ
  rationale: 압박의 원인을 드러내는 전치사구이므로, 한국어에서 가장 직접적인 인과 표현으로 처리했습니다.
- source_word: κατοικία ἀλλοτρίων
  english_pob_choice: a dwelling place of foreigners
  chosen_korean: 이방인의 거처
  alternatives_korean:
  - 낯선 사람들의 거처
  - 외국인의 거처
  lexicon: LSJ
  rationale: 거주지를 뜻하는 ‘κατοικία’와 소속 밖 사람을 뜻하는 ‘ἀλλοτρίων’을 살려, 성 밖의 낯선 점유를 나타내는 표현으로 옮겼습니다.
- source_word: τοῖς γενήμασιν αὐτῆς
  english_pob_choice: to her offspring
  chosen_korean: 자기 소산
  alternatives_korean:
  - 자기 자손
  - 그 열매
  lexicon: LSJ
  rationale: γενήματα가 ‘열매/소산’과 ‘자손/후손’의 뜻을 함께 가질 수 있어, 직전의 ‘자녀들’과 병행되는 의인화된 도시 이미지를 살리면서도 의미의 긴장을 보존하는 ‘소산’을 택했습니다.
- source_word: τὰ τέκνα αὐτῆς ἐγκατέλειπον αὐτήν
  english_pob_choice: her children abandoned her
  chosen_korean: 자기 자녀들은 예루살렘을 버렸습니다
  alternatives_korean:
  - 그 자녀들은 그녀를 버렸습니다
  - 자녀들은 그 도시를 떠났습니다
  lexicon: LSJ
  rationale: τέκνα는 폭넓게 ‘자녀’로 옮기고, ἐγκαταλείπω의 버림/유기 의미를 ‘버렸습니다’로 분명히 드러냈습니다.
theological_decisions:
- issue: 예루살렘의 여성 의인화 유지
  chosen_reading: 예루살렘을 ‘거처/소산/자녀’가 있는 여성적 도시로 계속 받아들이고, 대명사 대신 도시 이름과 소유격을 적절히 섞어 의인화를 유지했습니다.
  alternative_readings:
  - 대명사 없이 모두 예루살렘으로 반복
  - 의인화를 약화해 중립적 도시 묘사로 처리
  rationale: 원문의 문장은 도시를 살아 있는 인물처럼 다루며 탄식의 효과를 냅니다. 한국어에서도 이를 보존해야 ‘자녀들이 예루살렘을 버렸다’는 관계가 자연스럽게 드러납니다.
  doctrine_reference: '번역 원칙: 중요한 수사와 이미지의 보존'
