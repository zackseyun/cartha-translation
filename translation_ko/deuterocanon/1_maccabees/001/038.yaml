review_pass:
  verdict: revise
  source_fidelity: 첫째와 둘째 절의 핵심 의미는 대체로 충실합니다. 그러나 ‘자기 소산에게는 이방처럼 되었다’는 τοῖς γενήμασιν αὐτῆς와 ἀλλοτρία의 관계를 한국어에서 부정확하고 어색하게 나타냅니다. 예루살렘이 자신의 자손들에게 ‘낯선 곳/낯선 존재’가 되었다는 소외의 의미를 분명히 해야 합니다.
  naturalness: ‘이방처럼 되었다’는 현대 표준 한국어에서 자연스럽지 않으며, 도시가 자기 자손에게 이질화되었다는 의인화도 충분히 드러나지 않습니다. ‘자기 자손들에게 낯선 곳이 되었다’가 자연스럽고 원문의 비통한 도시 의인화를 잘 전달합니다.
  terminology: κατοικία ἀλλοτρίων는 ‘이방인들의 거처’로 옮길 수 있습니다. γενήματα의 ‘자손/소산’ 양의성은 본문에서 문맥상 ‘자손’을 택하고 각주에서 ‘소산’ 가능성을 밝혀 보존하는 것이 적절합니다. τέκνα는 ‘자녀들’이 적절합니다.
  issues:
  - severity: medium
    issue: ‘자기 소산에게는 이방처럼 되었다’라는 표현
    rationale: ‘이방처럼’은 ἀλλοτρία(낯선, 이질적인)의 서술어 의미를 자연스럽게 전달하지 못하며, ‘소산에게’와 결합하여 예루살렘이 자신의 후손에게 낯선 존재가 되었다는 관계도 불명확합니다.
  - severity: low
    issue: 본문의 ‘소산’ 선택과 각주의 설명이 충돌 없이 연결되도록 할 필요
    rationale: γενήματα는 ‘자손’ 또는 ‘소산’을 뜻할 수 있으나, 뒤따르는 ‘자녀들’과의 병행상 본문은 ‘자손’이 더 자연스럽습니다. ‘소산’ 가능성은 각주로 보존할 수 있습니다.
