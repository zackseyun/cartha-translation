lexical_decisions:
- source_word: ἠγαύθη
  english_pob_choice: pleased
  chosen_korean: 좋게 보였습니다
  alternatives_korean:
  - 마음에 들었습니다
  - 기뻐하였습니다
  - 승인되었습니다
  lexicon: LSJ
  rationale: 수동형의 수용 의미를 한국어 자연문으로 풀되, 단순 감정 반응보다 판단과 호응의 뉘앙스를 살리기 위해 ‘좋게 보였습니다’로 옮겼습니다.
- source_word: ὁ λόγος
  english_pob_choice: the proposal
  chosen_korean: 그 제안
  alternatives_korean:
  - 그 말
  - 그 일
  - 그 계획
  lexicon: LSJ
  rationale: 문맥상 단순한 ‘말’이 아니라 앞선 제안이나 구상을 가리키므로, 영어 POB의 해석을 따라 ‘제안’으로 구체화했습니다.
- source_word: ἐν ὀφθαλμοῖς αὐτῶν
  english_pob_choice: them
  chosen_korean: 그들의 눈에
  alternatives_korean:
  - 그들에게
  - 그들 보기에
  - 그들의 시야에서
  lexicon: LSJ
  rationale: 히브리식/헬라어 관용구를 가능한 한 드러내기 위해 직역 구조를 유지했으며, 평가·판단의 관용적 의미를 한국어에서도 보존했습니다.
