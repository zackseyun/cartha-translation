  text: And the books of the law that they found, they tore to pieces and burned with fire.
translation:
  language: ko
  text: 그들이 찾아낸 율법책들을 찢어서 불로 태웠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ βιβλία
  english_pob_choice: the books
  chosen_korean: 율법책들
  alternatives_korean:
  - 책들
  - 두루마리들
  - 문서들
  lexicon: LSJ
  rationale: βιβλία는 일반적으로 ‘책들/기록물들’을 뜻하지만, 이어지는 τοῦ νόμου가 그 성격을 율법 문서로 한정하므로 한국어에서는 문맥상 ‘율법책들’이 가장 자연스럽고도 source에 충실합니다.
- source_word: τοῦ νόμου
  english_pob_choice: of the law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 율법의
  lexicon: LSJ
  rationale: 여기서 νόμος는 토라/유대 율법을 가리키므로, 한국어 성경 관용과 본문 맥락을 함께 살려 ‘율법’으로 옮겼습니다.
- source_word: κατασχίσαντες
  english_pob_choice: they tore to pieces
  chosen_korean: 찢어서
  alternatives_korean:
  - 갈기갈기 찢어서
  - 뜯어 찢어서
  - 조각내서
  lexicon: LSJ
  rationale: 분사 κατασχίσαντες는 단순 파손이 아니라 격렬한 찢기를 뜻하므로, 과장되거나 해석적인 표현을 피하면서도 동작의 폭력을 드러내는 ‘찢어서’로 옮겼습니다.
- source_word: ἐνεπύρισαν πυρὶ
  english_pob_choice: burned with fire
  chosen_korean: 불로 태웠습니다
  alternatives_korean:
  - 불에 태웠습니다
  - 불로 불살랐습니다
  - 불에 불태웠습니다
  lexicon: LSJ
  rationale: ἐνεπύρισαν은 ‘불태우다’이고 πυρί는 수단의 여격으로, 한국어에서는 자연스러운 관용인 ‘불로 태우다’가 그 강조를 잘 살립니다.
theological_decisions:
- issue: 율법 문서 파괴의 대상 특정
  chosen_reading: ‘율법책들’로 옮겨, 단순한 일반 서적이 아니라 유대 율법 문서의 파괴라는 점을 본문 자체에서 드러냈습니다.
  alternative_readings:
  - ‘책들’로 일반화하는 번역
  - ‘두루마리들’로 고대 형식을 부각하는 번역
  rationale: 이 절은 박해가 단지 문자 기록을 훼손한 것이 아니라 율법을 말살하려는 행위임을 보여 주므로, 문맥상 신학적 함의를 흐리지 않는 번역이 필요합니다.
  doctrine_reference: 율법/토라의 공적 파괴와 신앙 탄압
