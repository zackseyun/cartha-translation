base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/030.yaml
  text: And he spoke peaceful words to them with deceit[a], and they trusted him; then he fell upon the city suddenly, struck it a great blow[b], and destroyed many people from Israel.
  footnotes:
  - marker: a
    text: Or 'words of peace.' The Greek phrase can be rendered more literally that way; 'peaceful words' was chosen for natural English while preserving the sense of conciliatory speech used deceptively.
    reason: lexical_alternative
  - marker: b
    text: Or 'they believed him.' Here the sense is that they accepted his assurances and so trusted him.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 속임수로 그들에게 평화로운 말을 하였고, 그들은 그를 믿었습니다. 그러고 나서 그는 갑자기 그 도시를 덮쳐 큰 타격을 가했으며, 이스라엘 백성 가운데 많은 사람을 죽였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λόγους εἰρηνικούς
  english_pob_choice: peaceful words
  chosen_korean: 평화로운 말들
  alternatives_korean:
  - 평화의 말들
  - 평화적 말들
  - 평화스러운 말들
  lexicon: LEH
  rationale: λόγους를 단순히 ‘말’로 옮기고, εἰρηνικούς는 그 말의 성격을 나타내는 형용사로 풀어 ‘평화로운 말들’로 옮겼습니다. 이는 겉으로는 온화하지만 실제로는 속임수인 발화라는 점을 드러냅니다.
- source_word: ἐν δόλῳ
  english_pob_choice: with deceit
  chosen_korean: 속임수로
  alternatives_korean:
  - 기만으로
  - 속임으로
  - 속임수 가운데
  lexicon: BDAG
  rationale: 전치사구의 수단·방식을 한국어 부사격으로 자연스럽게 드러내되, ‘deceit’를 구체적 명사성으로 보존하기 위해 ‘속임수로’로 옮겼습니다.
- source_word: ἐπίστευσαν αὐτῷ
  english_pob_choice: they trusted him
  chosen_korean: 그를 믿었습니다
  alternatives_korean:
  - 그를 신뢰했습니다
  - 그의 말을 믿었습니다
  lexicon: BDAG
  rationale: 여기서는 신학적 ‘믿음’이 아니라 그의 말과 보장을 받아들인다는 서술적 의미이므로, 가장 직접적인 ‘그를 믿었습니다’로 옮겼습니다.
- source_word: ἐπέπεσεν ἐπὶ τὴν πόλιν ἐξαίφνα
  english_pob_choice: he fell upon the city suddenly
  chosen_korean: 갑자기 그 도시를 덮쳐
  alternatives_korean:
  - 갑자기 그 도시에 달려들어
  - 갑자기 그 도시 위에 덮쳐
  - 불시에 그 도시를 덮쳐
  lexicon: LEH
  rationale: ἐπέπεσεν의 공격적 이미지를 한국어 동사 ‘덮치다’로 살리고, ἐξαίφνα의 순간성을 ‘갑자기’로 분명히 했습니다.
- source_word: ἀπώλεσεν λαὸν πολὺν ἐξ Ἰσραήλ
  english_pob_choice: destroyed many people from Israel
  chosen_korean: 이스라엘에서 많은 사람을 멸망시켰습니다
  alternatives_korean:
  - 이스라엘에서 많은 백성을 멸망시켰습니다
  - 이스라엘에서 많은 사람을 죽였습니다
  - 이스라엘 출신의 많은 사람을 멸망시켰습니다
  lexicon: BDAG
  rationale: ἀπώλεσεν은 단순한 ‘죽이다’보다 더 넓게 ‘멸망시키다/파괴하다’를 뜻할 수 있으므로, 피해의 결과를 포괄하는 ‘멸망시켰습니다’를 선택했습니다. ἐξ Ἰσραήλ은 출처·귀속을 살려 ‘이스라엘에서’로 옮겼습니다.
theological_decisions:
- issue: ἐπίστευσαν αὐτῷ의 신학적 오해 가능성
  chosen_reading: 서술적 신뢰의 의미로만 처리하여, 구원의 ‘믿음’ 용어로 확장하지 않았습니다.
  alternative_readings:
  - 그를 믿었습니다(종교적 믿음처럼 읽힐 가능성)
  - 그의 말을 믿었습니다
  rationale: 이 문맥은 적의 기만에 속아 넘어가는 역사 서술이므로, 신약의 신앙 용어를 떠올리게 하는 표현을 피하고 서술 의미를 유지하는 것이 좋습니다.
  doctrine_reference: 'DOCTRINE.md: 문맥에 따른 πιστεύω/믿다의 비신학적 용법은 신학적 확장을 피하고 서술 기능을 우선한다.'
