- from: 그리고 그는 그들에게 속임수로 평화로운 말들을 하고, 그들은 그를 믿었습니다. 그러고는 갑자기 그 도시를 덮쳐 큰 타격을 가했으며, 이스라엘에서 많은 사람을 멸망시켰습니다.
  to: 그리고 그는 속임수로 그들에게 평화로운 말을 하였고, 그들은 그를 믿었습니다. 그러고 나서 그는 갑자기 그 도시를 덮쳐 큰 타격을 가했으며, 이스라엘 백성 가운데 많은 사람을 죽였습니다.
  rationale: 문장의 연결과 공격의 순서를 유지하면서, 사람을 목적어로 하는 ἀπώλεσεν의 문맥상 치명적 결과를 자연스러운 한국어 ‘죽였습니다’로 옮겼습니다. ‘이스라엘 백성 가운데’는 ἐξ Ἰσραήλ이 나타내는 소속을 한국어에서 오해 없이 드러냅니다. 별도의 본문상 이문이나 번역상 필수 대안이 없으므로 각주는 필요하지 않습니다.
