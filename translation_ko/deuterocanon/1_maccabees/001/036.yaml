  text: And it became an ambush against the sanctuary[a], and a wicked adversary against Israel continually.
  footnotes:
  - marker: a
    text: Or 'a wicked slanderer.' The Greek διάβολος can denote a slanderer or adversary; here the hostile contextual sense favors 'adversary.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 성소에 대한 매복이 되었고, 이스라엘에 대한 사악한 적이 되어 항상 그러하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사악한 중상자’입니다. 그리스어 διάβολος는 중상자나 대적자를 뜻할 수 있으며, 여기서는 적대적 문맥상 ‘적’이 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
