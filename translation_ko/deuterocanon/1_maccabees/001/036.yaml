    rationale: διὰ παντός는 이스라엘에게 악한 적대자가 된 상태가 계속됨을 나타냅니다. ‘끊임없이 사악한 적대자가 되었습니다’로 해당 상태의 지속을 직접 표현하는 편이 자연스럽고 충실합니다.
