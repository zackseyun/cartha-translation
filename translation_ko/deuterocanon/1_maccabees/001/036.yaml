  source_fidelity: 핵심 어휘의 선택은 대체로 원문에 충실합니다. 다만 εἰς ἔνεδρον은 성소를 겨냥해 잠복하는 장소·위협이라는 군사적 기능을 나타내므로, 단순히 ‘성소에 대한 매복’보다 ‘성소를 노리는 매복처’가 한국어에서 그 관계를 더 분명하게 드러냅니다. διὰ παντός는 두 번째 술어의 지속성을 나타내므로 ‘항상 그러하였습니다’보다 ‘끊임없이 … 되었습니다’로 옮기는 것이 정확합니다.
  naturalness: 초안의 ‘항상 그러하였습니다’는 무엇이 계속되었는지가 불명확하고 현대 한국어 문장으로도 다소 어색합니다. 또한 ‘성소에 대한 매복’은 매복의 목표 관계가 부자연스럽습니다. 수정문은 합쇼체를 유지하면서 문장 관계를 자연스럽게 정리합니다.
  terminology: ‘성소’는 ἁγίασμα에 적절합니다. διάβολον πονηρόν은 이 역사적 문맥에서 고유명사 ‘마귀’가 아니라 일반명사로 번역해야 하므로 ‘사악한 적대자’가 적절합니다. 각주에는 가능한 ‘중상자’의 어휘적 대안을 보존합니다.
