translation:
  language: ko
  text: 그것은 성소를 노리는 매복처가 되었고, 이스라엘에게는 끊임없이 사악한 적대자가 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사악한 중상자’입니다. 그리스어 διάβολος는 중상자나 적대자를 뜻할 수 있으며, 여기서는 적대적 문맥상 ‘적대자’가 더 적절합니다.
    reason: lexical_alternative
