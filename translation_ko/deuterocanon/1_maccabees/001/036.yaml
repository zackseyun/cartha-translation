theological_decisions:
- issue: διάβολος를 고유명사처럼 ‘마귀’로 읽을지, 일반명사로 읽을지
  chosen_reading: 일반명사적 적대자 의미를 따라 ‘사악한 적’으로 옮겼습니다.
  alternative_readings:
  - 마귀
  - 사탄
  - 중상자
  rationale: 이 절은 역사 서술 속에서 성소와 이스라엘을 향한 적대적 기능을 말하므로, 후대의 사탄 명칭을 앞세우지 않고 본문의 긴장을 그대로 보존하는 번역이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: 원어의 문맥적 의미를 우선하고, 후대 신학적 확대를 번역으로 미리 확정하지 않음.'
