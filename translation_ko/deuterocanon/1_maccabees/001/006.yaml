  text: And he called his honored servants[a], who had been brought up with him from youth, and divided his kingdom among them while he was still alive.
  footnotes:
  - marker: a
    text: Greek literally begins with 'his paides'; in this context the following descriptions ('honored,' 'brought up with him from youth') indicate trusted court companions rather than biological sons.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 어려서부터 함께 자라 온, 그가 아끼는 신하들을 불러서, 살아 있는 동안 그들 사이에 자기 왕국을 나누어 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 paides는 문자적으로 ‘아이들’이 될 수 있지만, 여기서는 ‘명예로운’과 ‘어려서부터 함께 자란’이라는 수식이 붙어 왕실 측근을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς παῖδας αὐτοῦ
  english_pob_choice: his honored servants/companions
  chosen_korean: 그가 아끼는 신하들
  alternatives_korean:
  - 그의 종들
  - 그의 시종들
  - 그의 동료들
  lexicon: LSJ
  rationale: παῖδες는 문자적으로 ‘아이들/종들’이 될 수 있지만, 이어지는 ‘명예로운’과 ‘어려서부터 함께 자란’이라는 수식이 왕실 측근을 가리키므로, 한국어에서는 왕궁 맥락을 살려 ‘신하들’로 옮겼습니다.
- source_word: τοὺς ἐνδόξους
  english_pob_choice: honored
  chosen_korean: 그가 아끼는
  alternatives_korean:
  - 명예로운
  - 유명한
  - 고귀한
  lexicon: LSJ
  rationale: ἐνδόξους는 단순한 도덕적 칭찬보다 지위와 명망이 있는 사람들을 가리키므로, 문맥상 자연스럽고 과장되지 않는 ‘아끼는’으로 풀어 왕의 신임을 드러냈습니다.
- source_word: τοὺς συνεκτρόφους αὐτοῦ ἀπὸ νεότητος
  english_pob_choice: who had been brought up with him from youth
  chosen_korean: 어려서부터 함께 자라 온
  alternatives_korean:
  - 그와 함께 양육된
  - 젊은 시절부터 함께 자란
  - 어려서부터 그와 함께 길러진
  lexicon: LSJ
  rationale: συνεκτρόφους는 ‘함께 길러진 사람들’이라는 관계를, ἀπὸ νεότητος는 그 시점을 분명히 하므로 ‘어려서부터 함께 자라 온’으로 자연스럽게 표현했습니다.
- source_word: διεῖλεν αὐτοῖς τὴν βασιλείαν αὐτοῦ
  english_pob_choice: divided his kingdom among them
  chosen_korean: 자기 왕국을 나누어 주었습니다
  alternatives_korean:
  - 자기 왕국을 분배하였습니다
  - 자기 통치를 그들 사이에 나누었습니다
  - 자기 나라를 그들에게 나누어 주었습니다
  lexicon: BDAG
  rationale: βασιλεία는 여기서 추상적 ‘왕권’보다 실제로 나눌 수 있는 정치적 영역을 뜻하므로 ‘왕국’이 적절하며, διεῖλεν의 분배 뉘앙스를 살려 ‘나누어 주었습니다’로 옮겼습니다.
- source_word: ἔτι ζῶντος αὐτοῦ
  english_pob_choice: while he was still alive
  chosen_korean: 살아 있는 동안
  alternatives_korean:
  - 그가 아직 살아 있을 때
  - 그가 아직 생존해 있는 동안
  - 그 생전에
  lexicon: BDAG
  rationale: genitive absolute가 행위가 죽기 전에 이뤄졌음을 강조하므로, 가장 자연스러운 현대 문체인 ‘살아 있는 동안’으로 옮겼습니다.
theological_decisions:
- issue: παῖδες의 신분을 ‘아들들’로 오해하지 않도록 할지
  chosen_reading: 왕이 함께 자란 측근 귀족/신하들을 가리키는 것으로 이해하여 번역했습니다.
  alternative_readings:
  - 그의 아들들
  - 그의 종들
  rationale: 본문 자체의 수식어들이 생물학적 자녀가 아니라 궁정 동료임을 강하게 시사하므로, 오해를 막기 위해 혈연적 의미를 배제했습니다.
  doctrine_reference: 본문 맥락 해석
- issue: βασιλεία를 ‘왕권’이 아니라 ‘왕국’으로 옮길지
  chosen_reading: 분할 대상이 되는 통치 영역을 가리키므로 ‘왕국’으로 번역했습니다.
  alternative_readings:
  - 왕권
  - 통치
  rationale: 뒤이어 ‘그들 사이에’ 나누어 주었다는 표현은 추상적 권위보다 실제 정치적 영역의 분배를 가리키므로, 문맥상 ‘왕국’이 가장 정확합니다.
  doctrine_reference: 본문 문맥 해석
