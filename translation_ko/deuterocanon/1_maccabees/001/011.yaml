base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/011.yaml
  text: In those days lawless men came out from Israel and persuaded many[a], saying, “Let us go and make a covenant with the nations around us, because since we separated ourselves from them[c][b], many evils have found us.”
  footnotes:
  - marker: a
    text: Or 'sons of lawlessness.' The Greek expression is more literally familial, but here it refers idiomatically to people characterized by lawlessness.
    reason: lexical_alternative
  - marker: b
    text: Or 'since we were separated from them.' The Greek may be read with a more passive sense.
    reason: lexical_alternative
  - marker: c
    text: Literally, 'many evils found us'; that is, many calamities or troubles came upon us.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 무렵 이스라엘에서 불법한 자들이 나와 많은 사람을 설득하며 말했습니다. “가서 우리 주변의 여러 민족과 언약을 맺읍시다. 우리는 그들에게서 떨어져 나온 뒤로 많은 재난이 우리를 찾아왔기 때문입니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘불법의 아들들’로도 읽을 수 있으나, 여기서는 불법한 성향을 지닌 사람들을 가리키는 관용적 표현으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘우리가 그들에게서 떨어져 나간 뒤로’로도 옮길 수 있습니다. 그리스어는 더 수동적으로도 읽힐 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘많은 재난이 우리를 찾아왔다’입니다. 여기서 ‘재난’은 도덕적 악이 아니라 닥쳐온 환난을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱοὶ παράνομος
  english_pob_choice: lawless men
  chosen_korean: 불법한 자들
  alternatives_korean:
  - 법 없는 사람들
  - 불법한 사람들
  - 불법의 아들들
  lexicon: LSJ
  rationale: 문맥상 혈연 표현이 아니라 불법으로 특징지어진 사람들을 가리키므로, 직역의 거친 이미지를 유지하면서도 한국어로 자연스러운 ‘불법한 자들’로 옮겼습니다.
- source_word: ἀνέπεισαν πολλοὺς
  english_pob_choice: persuaded many
  chosen_korean: 많은 사람을 설득하며
  alternatives_korean:
  - 많은 사람을 설득하여
  - 많은 사람을 꼬드기며
  - 많은 사람을 유혹하며
  lexicon: LSJ
  rationale: 동사의 핵심은 ‘설득하다’이므로 그대로 살렸고, 부정적 뉘앙스는 이미 문맥에서 드러나므로 과도한 해석을 덧붙이지 않았습니다.
- source_word: διαθώμεθα διαθήκην
  english_pob_choice: make a covenant
  chosen_korean: 언약을 맺읍시다
  alternatives_korean:
  - 언약을 세웁시다
  - 계약을 맺읍시다
  - 동맹을 맺읍시다
  lexicon: LSJ
  rationale: διαθήκη는 단순한 합의가 아니라 성경적 ‘언약’ 어휘이므로 이를 보존했습니다. 한국어에서는 ‘맺다’가 자연스러운 결합 표현입니다.
- source_word: τῶν ἐθνῶν τῶν κύκλῳ ἡμῶν
  english_pob_choice: the nations around us
  chosen_korean: 우리 주변의 여러 민족
  alternatives_korean:
  - 우리 둘레의 민족들
  - 우리 주변의 나라들
  - 주변의 이방 민족들
  lexicon: LSJ
  rationale: 이 역사서 문맥에서는 ἔθνη가 주변 민족들을 뜻하므로, 신약식 ‘이방인’으로 옮기지 않고 공간적 관계를 살린 표현을 택했습니다.
- source_word: εὗρεν ἡμᾶς κακὰ πολλὰ
  english_pob_choice: many evils have found us
  chosen_korean: 많은 재난이 우리를 찾아왔습니다
  alternatives_korean:
  - 많은 재앙이 우리를 덮쳤습니다
  - 많은 불행이 우리를 찾아왔습니다
  - 많은 재난이 우리에게 닥쳤습니다
  lexicon: LSJ
  rationale: 직역의 ‘찾다/찾아오다’ 이미지를 유지하되, κακά의 문맥상 의미를 도덕적 ‘악’이 아니라 ‘재난/재앙’으로 옮겼습니다.
theological_decisions:
- issue: “lawless men”의 평가적 표현을 어떻게 한국어로 유지할 것인가
  chosen_reading: 불법한 자들
  alternative_readings:
  - 법 없는 사람들
  - 불법의 아들들
  rationale: 본문은 이들을 단순한 정치 집단이 아니라 율법과 질서에서 벗어난 사람들로 규정하므로, 완곡하게 중화하지 않고 평가적 성격을 드러내는 표현을 유지했습니다.
  doctrine_reference: 1 Maccabees 역사적 서술의 인물 묘사 일관성
