lexical_decisions:
- source_word: πολλοὶ ἀπὸ Ἰσραὴλ
  english_pob_choice: many from Israel
  chosen_korean: 이스라엘 가운데 많은 사람
  alternatives_korean:
  - 이스라엘에서 나온 많은 사람
  - 많은 이스라엘 사람
  lexicon: LSJ
  rationale: ἀπό + 민족명은 집단 안에서 나온 출신을 나타내므로, ‘이스라엘 가운데’로 옮겨 출처와 소속의 뉘앙스를 함께 살렸습니다.
- source_word: ηὐδόκησαν
  english_pob_choice: approved of
  chosen_korean: 좋게 여기고
  alternatives_korean:
  - 승인하고
  - 기뻐하고
  - 동의하고
  lexicon: LSJ
  rationale: 이 동사는 단순한 감정적 기쁨보다 어떤 행위를 수용·찬성하는 뜻을 담으므로, 우상 숭배적 행위를 ‘좋게 여기고’로 자연스럽게 드러냈습니다.
- source_word: τῇ λατρίᾳ αὐτοῦ
  english_pob_choice: his worship
  chosen_korean: 그의 예배
  alternatives_korean:
  - 그의 섬김
  - 그의 숭배
  lexicon: LSJ
  rationale: λατρεία는 여기서 왕권에 결부된 종교적 예배/숭배를 가리키므로, 한국어에서 가장 직접적인 ‘예배’를 선택했습니다.
- source_word: ἐβεβήλωσαν τὸ σάββατον
  english_pob_choice: profaned the Sabbath
  chosen_korean: 안식일을 더럽혔습니다
  alternatives_korean:
  - 안식일을 모독했습니다
  - 안식일을 속되게 했습니다
  lexicon: LSJ
  rationale: βεβηλόω는 거룩한 것을 속되게 만들거나 더럽히는 뜻이므로, ‘더럽혔습니다’가 종교적 위반의 강도를 분명하게 전달합니다.
