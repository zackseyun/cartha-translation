  - 그의 제의
  rationale: 본문은 단순한 정치적 지지보다 우상숭배적 예배 체계에 대한 동조를 말하므로, ‘예배’가 신앙적 충성의 왜곡을 가장 분명하게 드러냅니다.
  doctrine_reference: 'Translation philosophy: source-direct rendering of cultic language; do not domesticate religious allegiance language.'
