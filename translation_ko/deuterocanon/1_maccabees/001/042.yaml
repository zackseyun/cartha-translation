  lexicon: LSJ
  rationale: 분배적 의미를 드러내기 위해 집합적 표현보다 ‘각 사람은’으로 옮겼습니다.
- source_word: τὰ νόμιμα αὐτοῦ
  english_pob_choice: his own customs
  chosen_korean: 자기의 관습
  alternatives_korean:
  - 자기 율법
  - 조상의 관습
  - 자기 법
  lexicon: LSJ
  rationale: νόμιμα가 단순한 법조문보다 종교·생활 관행을 포함하는 ‘관습’의 뜻으로 쓰였으므로, 직역인 ‘율법’보다 의미 범위가 넓은 표현을 택했습니다.
- source_word: κατὰ τὸν λόγον τοῦ βασιλέως
  english_pob_choice: the word of the king
  chosen_korean: 왕의 말을
  alternatives_korean:
  - 왕의 명령을
  - 왕의 칙령을
  - 왕의 말을 따라
  lexicon: BDAG
  rationale: 원문이 문자적으로 ‘왕의 말’이라고 하므로 그 표현을 유지하되, 한국어에서는 자연스럽게 읽히도록 조사와 어순만 조정했습니다.
theological_decisions:
- issue: τὰ νόμιμα의 번역 범위
  chosen_reading: ‘관습’으로 옮겨, 종교적·민족적 전통을 포함하는 강제적 폐기를 드러냈습니다.
  alternative_readings:
  - ‘율법’으로 옮길 수 있음
  - ‘조상의 관습’으로 더 구체화할 수 있음
  rationale: 이 구절은 법조문 전체보다 유대적 삶의 관행과 전통을 포기하게 만드는 맥락이므로, 너무 협소한 ‘율법’보다 문맥에 맞는 넓은 표현이 적절합니다.
  doctrine_reference: 역사 서술의 문맥상 해석
