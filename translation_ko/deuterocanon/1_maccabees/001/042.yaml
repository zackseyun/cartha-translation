  text: and that each should abandon his own customs[b][a]. And all the nations accepted the word of the king.
  footnotes:
  - marker: a
    text: Or 'his own laws' or 'his own ancestral customs.' The Greek τὰ νόμιμα can denote customary legal-religious practices, especially traditional observances.
    reason: lexical_alternative
  - marker: b
    text: Or 'the command of the king' or 'the decree of the king.' The Greek says literally 'the word of the king.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 각 사람은 자기의 관습을 버리게 하였으며, 모든 민족이 왕의 말을 받아들였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 율법들’이나 ‘조상들의 관습들’입니다. 헬라어 τὰ νόμιμα는 특히 전통적 준수사항을 가리킬 때 법적·종교적 관행을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘왕의 명령’이나 ‘왕의 칙령’입니다. 헬라어는 문자적으로 ‘왕의 말’이라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκαταλείπειν
  english_pob_choice: abandon
  chosen_korean: 버리게 하였으며
  alternatives_korean:
  - 버리며
  - 떠나게 하였으며
  - 포기하게 하였으며
  lexicon: BDAG
  rationale: 강요된 상황에서 기존 관행을 단호히 끊어내는 뉘앙스를 살리기 위해, 단순한 ‘떠나다’보다 ‘버리다’ 계열로 옮겼습니다.
- source_word: ἕκαστον
  english_pob_choice: each
  chosen_korean: 각 사람은
  alternatives_korean:
