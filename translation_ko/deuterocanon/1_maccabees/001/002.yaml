  text: And he waged many wars, and seized strongholds, and slaughtered kings,
translation:
  language: ko
  text: 그리고 그는 많은 전쟁을 벌였고, 요새들을 점령하였으며, 왕들을 살육하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεστήσατο πολέμους πολλούς
  english_pob_choice: waged many wars
  chosen_korean: 많은 전쟁을 벌였고
  alternatives_korean:
  - 많은 전쟁을 치렀고
  - 많은 전쟁을 수행하였고
  lexicon: LSJ
  rationale: συνεστήσατο πολέμους는 단순히 전쟁을 ‘시작했다’가 아니라 전쟁을 실제로 벌이고 치르는 뜻이므로, 자연스러운 군사적 표현인 ‘전쟁을 벌이다’를 택했습니다.
- source_word: ἐκράτησεν ὀχυρωμάτων
  english_pob_choice: seized strongholds
  chosen_korean: 요새들을 점령하였으며
  alternatives_korean:
  - 요새들을 빼앗았으며
  - 성채들을 점거하였으며
  lexicon: LSJ
  rationale: ἐκράτησεν은 ‘장악하다/점령하다’의 뜻이고, ὀχυρωμάτων은 ‘요새, 방어진지’이므로, 군사적 점유를 분명히 드러내는 ‘점령하다’가 적절합니다.
- source_word: ἔσφαξεν βασιλεῖς
  english_pob_choice: slaughtered kings
  chosen_korean: 왕들을 살육하였습니다
  alternatives_korean:
  - 왕들을 죽였습니다
  - 왕들을 학살하였습니다
  lexicon: LSJ
  rationale: σφάζω는 단순한 살해보다 훨씬 강한 ‘도살하다/살육하다’의 뉘앙스를 지니므로, 폭력성을 약화하지 않는 ‘살육하다’를 사용했습니다.
theological_decisions:
- issue: 역사 서술의 폭력적 어조 보존
  chosen_reading: 본문의 연속 동사와 격렬한 전쟁·살육 어휘를 그대로 살려, 정복자의 잔혹성과 힘의 확대를 드러내었습니다.
  alternative_readings:
  - 어조를 완화해 ‘정복하였다’나 ‘죽였다’로 풀어 쓰는 방식
  rationale: 마카베오기 상의 역사 서술은 사건의 강도를 약화시키지 않는 것이 중요하므로, 원문의 거친 전투·살육 표현을 유지했습니다.
  doctrine_reference: 본문 해석 원칙 / 역사 서술의 서사적 강도 보존
