  source_fidelity: 시간 표현과 지명은 대체로 충실합니다. 다만 ἄρχοντα φορολογίας는 단순 징수원보다 조세 업무를 관장하는 고위 관리의 뜻이므로 ‘조세 징수관 한 사람’은 ἄρχων의 위상을 충분히 드러내지 못합니다. ἐν ὄχλῳ βαρεῖ는 대규모 동행 집단을 뜻하며, ‘거느리고’는 그 무리를 지휘·소유한다는 뉘앙스를 더할 수 있습니다.
