  text: 이년이 지난 뒤에 왕은 조세 징수관 한 사람을 유다의 도시들로 보냈고, 그는 큰 무리를 거느리고 예루살렘에 왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
