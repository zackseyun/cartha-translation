lexical_decisions:
- source_word: Μετὰ δύο ἐτῶν ἡμερῶν
  english_pob_choice: After two years had passed
  chosen_korean: 이년이 지난 뒤에
  alternatives_korean:
  - 두 해 후에
  - 두 해가 지난 뒤에
  lexicon: LSJ
  rationale: 헬라어 관용구는 시간 경과를 나타내므로, 한국어에서는 자연스럽게 ‘이년이 지난 뒤에’로 옮겨 염두에 둔 기간 경과를 살렸습니다.
- source_word: ἄρχοντα φορολογίας
  english_pob_choice: a chief collector of tribute
  chosen_korean: 조세 징수관 한 사람
  alternatives_korean:
  - 조세 책임자 한 사람
  - 공납 징수관 한 사람
  - 세금 징수관 한 사람
  lexicon: LSJ
  rationale: ἄρχων의 관료적 성격과 φορολογία의 공납/조세 영역을 함께 반영하되, 한국어에서는 과도하게 직역된 ‘우두머리’보다 왕실 재정 관리를 맡은 관리라는 점이 드러나도록 했습니다.
- source_word: ἐν ὄχλῳ βαρεῖ
  english_pob_choice: with a heavy crowd
  chosen_korean: 큰 무리를 거느리고
  alternatives_korean:
  - 큰 군중과 함께
  - 많은 무리를 거느리고
  - 대규모 병력을 거느리고
  lexicon: LSJ
  rationale: 직역하면 ‘무거운 군중’이지만, 문맥상 동행한 상당한 규모의 집단을 가리키므로 한국어에서는 ‘큰 무리’로 옮기되, 동반·압박의 뉘앙스는 ‘거느리고’로 살렸습니다.
theological_decisions:
- issue: ἐν ὄχλῳ βαρεῖ의 문맥적 성격
  chosen_reading: 단순한 군중이 아니라 왕의 조세 관리를 수행하는 권위 있는 동행 집단으로 이해했습니다.
  alternative_readings:
  - 그냥 큰 군중과 함께
  - 무거운 군중과 함께
  - 대규모 병력과 함께
  rationale: 헬라어 표현은 문자적으로는 ‘무거운 군중’이지만, 행정적 파견 맥락에서는 수행원·호위대가 동반된 상황을 암시할 수 있어 문맥을 살린 표현을 택했습니다.
  doctrine_reference: 문맥주의 번역 원칙
