  text: After two years had passed, the king sent a chief collector of tribute to the cities of Judah, and he came to Jerusalem with a heavy crowd.
  footnotes:
  - marker: a
    text: Or 'with a large multitude' or 'with a massive force.' The Greek literally says 'with a heavy crowd,' an idiom suggesting a substantial accompanying body.
