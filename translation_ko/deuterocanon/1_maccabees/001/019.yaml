  source_fidelity: 헬라어의 복수 동사 κατελάβοντο(그들은 점령하였다)와 단수 동사 ἔλαβεν(그는 가져갔다)의 전환을 정확히 보존했습니다. τὰς πόλεις τὰς ὀχυράς는 ‘요새화된 도시들’로, σκῦλα는 ‘전리품’으로 적절히 옮겼으며, γῇ Αἰγύπτῳ의 반복도 유지했습니다.
  naturalness: ‘그들은 이집트 땅의 요새화된 도시들을 점령하였고, 그는 이집트 땅의 전리품을 가져갔습니다’는 현대 표준 한국어의 합쇼체 역사 서술로 자연스럽습니다. ‘요새화된 도시’와 ‘전리품’은 문맥상 명확하고 무리 없는 표현입니다.
  terminology: 군사·역사 문맥의 핵심 어휘가 일관됩니다. ‘점령하다’는 도시를 무력으로 장악하는 뜻을 잘 전달하고, ‘전리품’은 전쟁 중 획득한 σκῦλα에 적합합니다. 원문이 드러내는 주어 수의 대비도 훼손하지 않았습니다.
