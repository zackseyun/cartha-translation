  text: And they captured the fortified cities in the land of Egypt, and he took the plunder of the land of Egypt.
translation:
  language: ko
  text: 그리고 그들은 이집트 땅의 요새화된 도시들을 점령하였고, 그는 이집트 땅의 전리품을 가져갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατελάβοντο
  english_pob_choice: captured
  chosen_korean: 점령하였고
  alternatives_korean:
  - 포획하였고
  - 탈취하였고
  - 차지하였고
  lexicon: LSJ
  rationale: 성채 도시들을 무력으로 장악했다는 군사적 맥락을 살려, 단순한 ‘차지함’보다 통치권 확보의 뉘앙스가 있는 ‘점령하다’를 택했습니다.
- source_word: τὰς πόλεις τὰς ὀχυράς
  english_pob_choice: the fortified cities
  chosen_korean: 요새화된 도시들
  alternatives_korean:
  - 요새 같은 도시들
  - 튼튼한 도시들
  - 견고한 성읍들
  lexicon: LSJ
  rationale: ὀχυράς는 도시의 방어적 성격을 수식하므로, 현대 한국어에서 자연스럽고 의미가 분명한 ‘요새화된’으로 옮겼습니다.
- source_word: ἔλαβεν
  english_pob_choice: he took
  chosen_korean: 그는 … 가져갔습니다
  alternatives_korean:
  - 그는 … 취하였습니다
  - 그는 … 취했습니다
  - 그는 … 빼앗았습니다
  lexicon: LSJ
  rationale: 주어가 앞의 복수와 달라져 단수로 바뀌는 점을 살리되, 전리품을 ‘가져가다’로 옮겨 약탈의 결과를 자연스럽게 드러냈습니다.
- source_word: σκῦλα
  english_pob_choice: the plunder
  chosen_korean: 전리품
  alternatives_korean:
  - 노획물
  - 약탈품
  - 전리품들
  lexicon: LSJ
  rationale: σκῦλα는 전쟁에서 빼앗은 물건을 가리키므로, 현대 독자에게 분명한 ‘전리품’이 가장 적절합니다.
theological_decisions:
- issue: 복수 동사와 단수 동사의 교차
  chosen_reading: 앞 절반은 복수 주어 ‘그들은’, 뒤 절반은 단수 주어 ‘그는’으로 살렸습니다.
  alternative_readings:
  - 두 절을 모두 복수로 평탄화한다
  - 두 절을 모두 단수로 통일한다
  rationale: 헬라어 본문이 κατελάβοντο(복수)에서 ἔλαβεν(단수)로 전환하므로, 군대의 점령과 왕의 전리품 취득이라는 문법적 대비를 그대로 드러냈습니다.
  doctrine_reference: '번역 원칙: 원문 투명성'
- issue: 이집트 땅의 반복
  chosen_reading: 두 번의 γῇ Αἰγύπτῳ를 각각 ‘이집트 땅’으로 반복했습니다.
  alternative_readings:
  - 한 번만 옮기고 뒤는 생략한다
  - ‘그 땅’으로 변주한다
  rationale: 반복은 단순한 중복이 아니라 원문의 서술 리듬과 강조를 이루므로, 이를 유지해 역사 서술의 직설성을 보존했습니다.
  doctrine_reference: '번역 원칙: 원문 밀착'
