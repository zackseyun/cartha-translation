  - marker: a
    text: Or 'bloodshed' or 'slaughter' for 'murder.'
    reason: lexical_alternative
  - marker: b
    text: Or 'spoke great pride/haughtiness.' The Greek uses a noun phrase, literally 'spoke great arrogance.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 모든 것을 빼앗은 뒤, 그는 자기 땅으로 떠났습니다. 그들은 살육을 저질렀고, 큰 오만을 말했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘살인’, ‘학살’, ‘피 흘림’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘큰 교만’, ‘큰 거만’으로도 옮길 수 있습니다. 그리스어는 부사가 아니라 명사구로, 문자적으로는 ‘큰 오만을 말했습니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν πάντα
  english_pob_choice: after taking everything
  chosen_korean: 모든 것을 빼앗은 뒤
  alternatives_korean:
  - 다 얻은 뒤
  - 모든 것을 취한 뒤
  - 모두 가져간 뒤
  lexicon: LSJ
  rationale: 문맥상 단순한 ‘받다/취하다’보다 강한 약탈·탈취의 뉘앙스가 자연스럽기 때문에 ‘빼앗다’로 옮기고, 완료된 선행 동작은 ‘-은 뒤’로 드러냈습니다.
- source_word: ἀπῆλθεν εἰς τὴν γῆν αὐτοῦ
  english_pob_choice: he went away to his own land
  chosen_korean: 그는 자기 땅으로 떠났습니다
  alternatives_korean:
  - 그는 자기 나라로 떠났습니다
  - 그는 자기 땅으로 갔습니다
  - 그는 제 땅으로 돌아갔습니다
  lexicon: LSJ
  rationale: γῆ를 단순 지리적 ‘땅’으로 살리면서도 소유 관계를 드러내기 위해 ‘자기 땅’으로 옮겼고, ἀπῆλθεν은 자연스러운 서술로 ‘떠났습니다’가 적절합니다.
- source_word: φονοκτονίαν
  english_pob_choice: murder
  chosen_korean: 살육
  alternatives_korean:
  - 살인
  - 학살
  - 피 흘림
  lexicon: LSJ
  rationale: 이 명사는 단순한 살해보다 폭력적 살육의 성격을 띠므로, 윤리적 비난을 유지하면서도 한국어 성경 문맥에서 다소 강하게 들리는 ‘살육’이 가장 가깝습니다.
- source_word: ὑπερηφανίαν μεγάλην
  english_pob_choice: great arrogance
  chosen_korean: 큰 오만
  alternatives_korean:
  - 큰 교만
  - 큰 거만
  - 심한 오만
  lexicon: LSJ
  rationale: 본문은 형용사적 부사가 아니라 ‘오만’이라는 명사구를 쓰므로, 영어 POB의 주석처럼 명사 구조를 유지해 ‘큰 오만’으로 옮겼습니다.
theological_decisions:
- issue: φονοκτονίαν의 도덕적 강도
  chosen_reading: 살육
  alternative_readings:
  - 살인
  - 학살
  - 피 흘림
  rationale: 이 본문은 단순한 죽임이 아니라 폭력적이고 비난받는 행위를 서술하므로, 완곡화하지 않고 강한 도덕적 무게를 드러내는 번역이 적절합니다.
  doctrine_reference: 원어 우선 원칙; 서술자의 평가를 약화시키지 않는 직역-의역 균형
