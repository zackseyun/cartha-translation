lexical_decisions:
- source_word: ἐσείσθη
  english_pob_choice: shook
  chosen_korean: 흔들렸으며
  alternatives_korean:
  - 떨렸으며
  - 요동했으며
  lexicon: LSJ
  rationale: σείω의 수동형이므로 '흔들리다'가 가장 직접적이며, 현대 한국어에서도 자연스럽고 비유적·문자적 가능성을 함께 열어 둡니다.
- source_word: ἡ γῆ
  english_pob_choice: the earth
  chosen_korean: 그 땅
  alternatives_korean:
  - 그 땅 전체
  - 온 땅
  - 그 땅 곧 세상
  lexicon: LSJ
  rationale: POB의 주석처럼 γῆ는 'earth'와 'land' 모두 가능하므로, 한국어에서는 과도한 우주적 확장을 피하면서도 넓은 의미를 살릴 수 있는 '그 땅'으로 옮겼습니다.
- source_word: πᾶς ὁ οἶκος Ἰακώβ
  english_pob_choice: the whole house of Jacob
  chosen_korean: 야곱의 온 집
  alternatives_korean:
  - 야곱 집안 전체
  - 온 이스라엘
  - 야곱의 모든 집
  lexicon: LSJ
  rationale: 문자 그대로의 언약-민족적 표현을 유지하기 위해 직역에 가까운 '야곱의 온 집'을 택했고, 해석적 확장인 '온 이스라엘'은 피했습니다.
- source_word: ἐνεδύσατο αἰσχύνην
  english_pob_choice: clothed itself with shame
  chosen_korean: 수치를 입었습니다
  alternatives_korean:
  - 수치로 옷 입었습니다
  - 수치로 둘러싸였습니다
  - 수치를 두르고 있었습니다
  lexicon: LSJ
  rationale: '''입다''는 옷의 은유를 한국어에서 자연스럽게 유지하며, αἰσχύνη의 공적 수치·망신의 뉘앙스도 함께 전달합니다.'
