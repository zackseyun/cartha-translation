translation:
  language: ko
  text: 그의 영광에 비례하여[a] 그의 수치는 늘어났고, 그의 높은 지위[b]는 애도로 바뀌었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘비례하여’는 κατά + 대격이 나타내는 대응 또는 비례의 관계를 옮긴 표현입니다. ‘영광에 따라’ 또는 ‘영광만큼’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘높은 지위’는 ὕψος의 비유적 용법을 옮긴 것입니다. 이 말은 ‘높이’, ‘높아짐’, 또는 ‘존귀함’으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὴν δόξαν αὐτῆς
  english_pob_choice: According to her glory
  chosen_korean: 그의 영광에 비례하여
  alternatives_korean:
  - 그의 영광에 따라
  - 그의 영광대로
  - 그의 영광에 맞게
  lexicon: LSJ
  rationale: κατά + 대격은 단순한 ‘따라서’보다 대응·비례의 뜻이 강하므로, 관계를 드러내는 ‘비례하여’로 옮겼습니다.
- source_word: δόξαν
  english_pob_choice: glory
  chosen_korean: 영광
  alternatives_korean:
  - 명예
  - 존귀
  - 광채
  lexicon: LSJ
  rationale: δόξα는 명예·명성·영광을 아우르지만, 본문은 수치와 대조되므로 ‘영광’이 가장 직접적으로 대응합니다.
- source_word: ἐπληθύνθη ἀτιμασμὸς αὐτῆς
  english_pob_choice: her dishonor was multiplied
  chosen_korean: 그의 수치가 더욱 커졌고
  alternatives_korean:
  - 그의 불명예가 더해졌고
  - 그의 치욕이 늘어났고
  - 그의 수치가 증가했고
  lexicon: LSJ
  rationale: ἀτιμασμός는 추상명사로 ‘수치/불명예/치욕’의 뜻이 있으며, ‘더욱 커졌다’는 ἐπληθύνθη의 증대감을 자연스럽게 살립니다.
- source_word: τὸ ὕψος αὐτῆς
  english_pob_choice: her exaltation
  chosen_korean: 그의 높음
  alternatives_korean:
  - 그의 높이
  - 그의 높아짐
  - 그의 존귀함
  lexicon: LSJ
  rationale: ὕψος는 문자적 ‘높이’와 비유적 ‘높아짐/존귀함’을 함께 가질 수 있어, 과도한 해석을 피하면서도 비유를 살리는 ‘높음’을 택했습니다.
- source_word: ἐστράφη εἰς πένθος
  english_pob_choice: was turned into mourning
  chosen_korean: 슬픔으로 바뀌었습니다
  alternatives_korean:
  - 애도로 바뀌었습니다
  - 애곡으로 변했습니다
  - 슬퍼함이 되었습니다
  lexicon: LSJ
  rationale: 전환을 나타내는 수동 구조를 살리되, 한국어에서 자연스러운 변화 표현으로 옮겼습니다. πένθος는 ‘애도/애곡’도 가능하지만 여기서는 상태의 전환을 드러내는 ‘슬픔’이 무난합니다.
theological_decisions:
- issue: 수치와 영광의 역전 이미지
  chosen_reading: 문장 전체를 사회적·역사적 역전의 진술로 읽고, 과장 없이 원문의 대비를 보존했습니다.
  alternative_readings:
  - 도덕적 타락의 진술로 좁혀 읽기
  - 개인적 감정 상태로 완화하기
  rationale: 본문은 공동체의 몰락을 수사적으로 묘사하는 문맥이므로, 영광-수치-높음-슬픔의 대조를 그대로 유지하는 것이 소스에 충실합니다.
  doctrine_reference: 문맥적 서술; 1 Maccabees 1장의 역사 서사
