  text: 그는 땅의 끝들까지 지나가며 수많은 민족에게서 전리품을 거두었고, 땅은 그의 앞에서 잠잠해졌으며, 그는 높아졌고, 그의 마음은 높아졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
