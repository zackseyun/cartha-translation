lexical_decisions:
- source_word: οἰκοδομῆσαι
  english_pob_choice: to build
  chosen_korean: 세우고
  alternatives_korean:
  - 짓고
  - 건축하고
  lexicon: LSJ
  rationale: 제단·신당·우상이라는 연속된 cultic 대상을 자연스럽게 이어 주는 동사로는 ‘세우다’가 가장 간결하고 현대 한국어에서도 잘 통합니다.
- source_word: βωμοὺς
