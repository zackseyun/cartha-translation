  rationale: 이 절은 율법을 거슬러 우상 제의와 정결 규정을 함께 침해하는 행위를 열거하므로, 독자가 저항의 강도를 바로 이해하도록 ‘부정한’으로 옮기는 것이 본문 의도에 더 충실합니다.
