  - 단들
  lexicon: LSJ
  rationale: βωμός는 제물 드리는 제단을 가리키므로 교회적 ‘제대’보다 직접적인 ‘제단’이 source에 더 가깝습니다.
- source_word: τεμένη
  english_pob_choice: shrines
  chosen_korean: 제단 신당들
  alternatives_korean:
  - 신당들
  - 성소들
  - 성역들
  lexicon: LSJ
  rationale: τέμενος는 거룩하게 구분된 cultic 공간을 뜻하므로, 이 맥락에서는 단순 건물보다 우상 숭배를 위한 신성 구역/신당의 느낌을 살리는 ‘신당’이 적절합니다.
- source_word: κοινά
  english_pob_choice: unclean animals
  chosen_korean: 부정한 짐승들
  alternatives_korean:
