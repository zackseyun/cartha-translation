  - 일반 짐승들
  lexicon: LSJ
  rationale: κοινός의 문자값은 ‘공통된/보통의’이지만, 유대 정결 문맥에서는 ‘부정한’의 의미가 강하므로 POB의 해석을 따라 그 정결 함의를 드러냈습니다.
theological_decisions:
