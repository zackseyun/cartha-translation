    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς νυμφίος
  english_pob_choice: Every bridegroom
  chosen_korean: 모든 신랑은
  alternatives_korean:
  - 모든 신랑마다
  - 각 신랑은
  lexicon: LSJ
  rationale: νυμφίος는 혼인 맥락의 ‘신랑’이 자연스럽고, πᾶς는 분배적 의미를 살려 ‘모든’으로 옮기는 것이 원문의 범위를 보존합니다.
- source_word: ἀνέλαβε θρῆνον
  english_pob_choice: took up lamentation
  chosen_korean: 애가를 불렀습니다
  alternatives_korean:
  - 애가를 들어올렸습니다
  - 탄식을 시작했습니다
  - 슬픔을 불러일으켰습니다
  lexicon: LSJ
  rationale: θρῆνον은 단순한 슬픔보다 ‘애가/탄식’의 소리를 가리키므로, 한국어에서는 관용적으로 ‘애가를 부르다’가 압축된 시적 표현을 잘 살립니다.
- source_word: καθημένη ἐν παστῷ
  english_pob_choice: she who sat in the bridal chamber
  chosen_korean: 신부가 잠자리에 앉아 있던 이는
  alternatives_korean:
  - 신부방에 앉아 있던 이는
  - 혼인 방에 앉아 있던 이는
  - 혼례 처소에 있던 이는
  lexicon: LSJ
  rationale: καθημένη는 ‘앉아 있던’의 상태를, παστός는 혼인 침상/혼례 공간을 가리키므로 ‘잠자리에 앉아 있던’으로 옮겨 혼례의 시적 이미지를 살렸습니다.
- source_word: ἐγένετο ἐν πένθει
  english_pob_choice: became one in mourning
  chosen_korean: 슬픔 가운데 있게 되었습니다
  alternatives_korean:
  - 애통 가운데 있게 되었습니다
  - 애곡하는 처지가 되었습니다
  - 상중에 있게 되었습니다
  lexicon: LSJ
  rationale: ἐγένετο는 상태 변화의 동사를, ἐν πένθει는 ‘애도/슬픔의 상태’를 나타내므로, 결과 상태를 드러내는 ‘슬픔 가운데 있게 되었습니다’가 가장 무리 없습니다.
theological_decisions:
- issue: 시적 압축의 보존
  chosen_reading: 문장 구조를 직역보다 압축된 시어로 살리되, 의미는 ‘혼인 기쁨이 슬픔으로 뒤집힌 상태’가 드러나게 했습니다.
  alternative_readings:
  - 모든 신랑은 애도했습니다; 신부가 있던 이는 슬픔에 빠졌습니다.
  - 모든 신랑은 탄식했습니다; 신부가 앉아 있던 곳은 상중이 되었습니다.
  rationale: 헬라어는 매우 압축된 병렬 시구이므로, 한국어도 설명을 늘이기보다 이미지와 상태 변화를 보존하는 편이 원문의 정서를 더 잘 전달합니다.
  doctrine_reference: 문학적/수사학적 관찰
