base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/010.yaml
  text: And from them came forth a sinful root[a], Antiochus Epiphanes, son of King Antiochus, who had been a hostage in Rome[b]. And he reigned in the one hundred forty-seventh year of the kingdom of the Greeks.
  footnotes:
  - marker: a
    text: 'Or ''a wicked root'' or ''a sinful shoot.'' The Greek keeps the plant metaphor literally: ''root.'''
    reason: lexical_alternative
  - marker: b
    text: That is, according to the Seleucid era dating system, 'the kingdom of the Greeks.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그들 가운데서 죄 많은 뿌리인 안티오코스 에피파네스가 나왔습니다. 그는 왕 안티오코스의 아들로서, 로마에서 인질이었습니다. 그리고 그는 헬라인 왕국의 백사십칠년에 왕이 되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘죄 많은 뿌리’입니다. 이 표현은 식물 은유를 그대로 살린 것입니다.
    reason: lexical_alternative
  - marker: b
    text: 즉, 헬라 제국의 통치 시기를 기준으로 한 연대 표기입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἐξῆλθεν ἐξ αὐτῶν
  english_pob_choice: came forth from them
  chosen_korean: 그들 가운데서 …가 나왔습니다
  alternatives_korean:
  - 그들로부터 나왔습니다
  - 그들 가운데서 나왔습니다
  lexicon: LSJ
  rationale: 출현·계보의 이미지를 살리기 위해 단순한 기원 표현보다 ‘나왔습니다’를 택했고, ἐξ αὐτῶν의 관계를 ‘그들 가운데서’로 자연스럽게 드러냈습니다.
- source_word: ῥίζα ἁμαρτωλός
  english_pob_choice: a sinful root
  chosen_korean: 죄 많은 뿌리
  alternatives_korean:
  - 죄 있는 뿌리
  - 악한 뿌리
  - 죄의 뿌리
  lexicon: LSJ
  rationale: 기본 은유인 ‘뿌리’를 유지해 본문의 평가적 이미지와 서사적 힘을 보존했고, ἁμαρτωλός는 ‘죄 많은’으로 옮겨 도덕적 성격을 드러냈습니다.
- source_word: ὅμηρα
  english_pob_choice: a hostage
  chosen_korean: 인질
  alternatives_korean:
  - 볼모
  - 포로
  lexicon: LSJ
  rationale: 정치적 담보로 잡힌 사람이라는 뜻을 가장 직접적으로 드러내는 현대어로 ‘인질’을 선택했습니다.
- source_word: ἔτει ἑκατοστῷ καὶ ἑβδόμῳ καὶ τεσσαρακοστῷ
  english_pob_choice: in the one hundred forty-seventh year
  chosen_korean: 백사십칠년에
  alternatives_korean:
  - 백사십칠 해에
  - 백사십칠 년에
  lexicon: LSJ
  rationale: 헬라식 연대 표기를 한국어에서도 간결하고 자연스럽게 재현했습니다.
theological_decisions:
- issue: ῥίζα ἁμαρτωλός의 비유적·도덕적 평가를 어떻게 유지할지
  chosen_reading: ‘죄 많은 뿌리’로 직역 쪽의 비유를 유지했습니다.
  alternative_readings:
  - ‘악한 사람’처럼 의미를 평탄화하기
  - ‘죄의 새싹’처럼 식물 은유를 바꾸기
  rationale: 본문은 안티오코스를 강한 식물 은유로 규정하므로, 해석을 덜어내고 비유 자체가 주는 도덕적 판단을 그대로 남겼습니다.
  doctrine_reference: 'DOCTRINE.md: 원문이 가진 긴장과 평가를 해소하지 말고 보존한다.'
