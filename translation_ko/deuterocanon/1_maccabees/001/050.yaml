  text: And whoever does not act according to the word of the king shall die[a].
  footnotes:
  - marker: a
    text: Or 'according to the king’s command.' The Greek says 'according to the word of the king,' which in context refers to his order.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 왕의 말씀에 따라 행하지 않는 자는 죽을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕의 명령에 따라’. 그리스어는 ‘왕의 말’이라고 되어 있으며, 문맥상 그의 명령을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἂν μὴ ποιήσῃ
  english_pob_choice: whoever does not act
  chosen_korean: 행하지 않는 자는
  alternatives_korean:
  - 하지 않는 자는
  - 실행하지 않는 자는
  - 따르지 않는 자는
  lexicon: BDAG
  rationale: 일반적 조건문으로서의 ὃς ἂν μὴ와, 명령 수행의 의미를 담은 ποιέω를 한국어에서 자연스럽게 살려 ‘행하다’로 옮겼습니다.
- source_word: κατὰ τὸ ῥῆμα
  english_pob_choice: according to the word
  chosen_korean: 왕의 말씀에 따라
  alternatives_korean:
  - 왕의 말에 따라
  - 왕의 명령에 따라
  - 왕의 칙령에 따라
  lexicon: BDAG
  rationale: ῥῆμα는 문자적으로 ‘말씀/말’이지만, 왕의 명령 문맥에서는 실제로 지시·명령을 가리키므로 원문 표현을 유지하면서도 한국어에서는 이해 가능한 ‘말씀에 따라’로 옮겼습니다.
- source_word: τοῦ βασιλέως
  english_pob_choice: of the king
  chosen_korean: 왕의
  alternatives_korean:
  - 임금의
  - 군주의
  lexicon: BDAG
  rationale: 기본 의미를 그대로 살려 ‘왕의’로 옮겼습니다. 이 문맥은 특정 통치자의 명령을 가리키므로 추가 설명이 필요하지 않습니다.
- source_word: ἀποθανεῖται
  english_pob_choice: shall die
  chosen_korean: 죽을 것입니다
  alternatives_korean:
  - 죽습니다
  - 사형을 당할 것입니다
  - 처형될 것입니다
  lexicon: BDAG
  rationale: 그리스어는 행위 주체를 명시하지 않고 단순히 ‘죽다’를 말하므로, 한국어에서도 직접적이면서도 원문보다 더 구체화하지 않는 미래 표현으로 처리했습니다.
theological_decisions:
- issue: 왕의 말/명령을 어떻게 드러낼지
  chosen_reading: 원문의 ῥῆμα를 직역 쪽에 가깝게 살리되, 문맥상 왕의 명령이라는 점을 한국어 문장에 과도하게 해설하지 않았습니다.
  alternative_readings:
  - 왕의 명령에 따라
  - 왕의 칙령에 따라
  rationale: 본문은 특정 어휘(ῥῆμα)를 사용해 ‘말’ 자체를 남겨 두고 있으므로, 의미는 드러내되 행정용어로 완전히 치환하지 않는 편이 원문 긴장을 보존합니다.
  doctrine_reference: 원문 어휘 보존과 문맥적 함의의 균형
