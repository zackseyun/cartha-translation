  text: And on the twenty-fifth day of the month they were sacrificing on the altar that was upon the altar of burnt offering[a].
  footnotes:
  - marker: a
    text: 'Greek uses two different words here: ''altar'' (βωμός) and ''altar of burnt offering'' (θυσιαστήριον), indicating an altar set upon the temple altar.'
