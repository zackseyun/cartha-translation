    text: 헬라어는 여기서 서로 다른 두 낱말, ‘제단’(βωμός)과 ‘번제단’(θυσιαστήριον)을 사용합니다. 이는 제단이 성전의 번제단 위에 있었음을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέμπτῃ καὶ εἰκάδι
