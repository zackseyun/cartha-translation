  rationale: 진행상의 제의 행위를 현대 합쇼체 서술로 자연스럽게 나타냈습니다.
- source_word: βωμός / θυσιαστήριον
  english_pob_choice: altar / altar of burnt offering
  chosen_korean: 제단 / 번제단
  alternatives_korean:
  - 제단 / 번제의 제단
