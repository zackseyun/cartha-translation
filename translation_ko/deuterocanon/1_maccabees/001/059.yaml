  lexicon: LSJ
  rationale: 원문이 서로 다른 두 제의 용어를 구별하므로, 앞의 βωμός는 일반적인 ‘제단’, 뒤의 θυσιαστήριον은 성전의 ‘번제단’으로 구분해 반영했습니다.
theological_decisions:
- issue: 두 제의 용어의 구별을 한국어에서 어떻게 보존할지
  chosen_reading: ‘제단 위에 있는 번제단’으로 옮겨, 작은 제단이 성전의 মূল 번제단 위에 놓인 상황을 드러냈습니다.
  alternative_readings:
  - 두 단어 모두 단순히 ‘제단’으로 번역하기
  - ‘우상 제단’처럼 해석을 본문에 직접 넣기
  rationale: 본문은 βωμός와 θυσιαστήριον을 의도적으로 구별하지만, 이 절 자체에는 ‘우상’이라는 단어가 없습니다. 그래서 해석을 덧붙이지 않고 구조적 대비만 보존했습니다.
  doctrine_reference: 번역 원칙 §§1, 5
