  text: 그들은 무기와 식량을 비축하고, 예루살렘의 전리품을 모아 그곳에 두었습니다. 그것은 큰 올무가 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘예루살렘의 전리품’은 ‘예루살렘에 속한 전리품’ 또는 ‘예루살렘에서 온 전리품’으로도 이해될 수 있습니다.
