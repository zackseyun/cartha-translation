translation:
  language: ko
  text: 그리고 그들은 무기와 식량을 비축하였으며, 예루살렘의 전리품을 모아 거기에 두었습니다. 그리고 그것은 큰 올무가 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘전리품’은 여기서 ‘예루살렘의 전리품’이라는 출처를 자연스럽게 드러내며, 영어 POB의 ‘of/from Jerusalem’에 해당하는 속격의 해석을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέθεντο
  english_pob_choice: stored up
  chosen_korean: 비축하였으며
  alternatives_korean:
  - 저장하였으며
  - 쌓아 두었으며
  - 보관하였으며
  lexicon: LSJ
  rationale: 군사 물자와 식량을 목적 있게 모아 두는 뉘앙스를 살리기 위해, 단순한 ‘두다’보다 축적의 뜻이 드러나는 ‘비축하다’를 택했습니다.
- source_word: ὅπλα
  english_pob_choice: weapons
  chosen_korean: 무기
  alternatives_korean:
  - 병기
  - 무장
  lexicon: LSJ
  rationale: 전투용 장비를 현대 한국어로 자연스럽게 옮기기 위해 ‘무기’로 렌더링했습니다.
- source_word: τροφήν
  english_pob_choice: provisions
  chosen_korean: 식량
  alternatives_korean:
  - 보급품
  - 양식
  - 식량품
  lexicon: LSJ
  rationale: 군사적 비축 맥락에서 단순한 음식보다 전투 지속에 필요한 먹을거리를 가리키므로 ‘식량’이 가장 직접적입니다.
- source_word: τὰ σκῦλα Ἰερουσαλήμ
  english_pob_choice: the spoils of Jerusalem
  chosen_korean: 예루살렘의 전리품
  alternatives_korean:
  - 예루살렘에서 나온 전리품
  - 예루살렘에서 빼앗은 전리품
  lexicon: LSJ
  rationale: 영어 POB의 유연한 속격 처리를 따라, 출처를 표시하면서도 자연스러운 명사구인 ‘예루살렘의 전리품’으로 옮겼습니다.
- source_word: εἰς μεγάλην παγίδα
  english_pob_choice: it became a great snare
  chosen_korean: 큰 올무가 되었습니다
  alternatives_korean:
  - 큰 함정이 되었습니다
  - 큰 덫이 되었습니다
  lexicon: LSJ
  rationale: 비유적이고 위험한 함정의 이미지를 한국어 성경 문맥에 맞게 살리기 위해 ‘올무’를 택했습니다.
theological_decisions:
- issue: μεγάλην παγίδα의 비유적 힘 보존
  chosen_reading: ‘큰 올무’로 옮겨, 그 장소와 축적된 것들이 이스라엘에 대한 위험한 함정이 되었다는 암시를 그대로 남겼습니다.
  alternative_readings:
  - ‘큰 함정’으로 완화하여 표현하기
  - 누가 누구를 올무에 빠뜨렸는지 명시하기
  rationale: 본문은 비유를 통해 위협성을 드러내지만, 누구에게 어떻게 걸렸는지를 즉시 해설하지 않습니다. 해석을 앞당기지 않고 긴장감을 유지하는 것이 원문에 더 가깝습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
