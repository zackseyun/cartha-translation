  naturalness: ‘곧 그는 아버지 다음에 대제사장이 된 때부터입니다’는 한국어 문장으로 미완결적이며, ‘아버지 다음에’도 직위 계승 문맥에서는 부자연스럽습니다. ‘아버지의 뒤를 이어’와 관형절 구조가 현대 합쇼체에서 자연스럽습니다.
