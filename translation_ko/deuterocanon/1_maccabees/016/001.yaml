base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/016/001.yaml
  text: And John came up from Gazara and reported to Simon his father what Cendebeus was doing[a].
  footnotes:
  - marker: a
    text: Or 'what Cendebeus was doing' or 'what Cendebeus was carrying out.' The Greek verb can denote ongoing action or the execution of a plan.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 요한이 가자라에서 올라와 자기 아버지 시몬에게 켄데바이오스가 하고 있는 일을 보고했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 συνετέλει는 ‘하고 있었다’는 진행 의미와 ‘수행하고 있었다/실행하고 있었다’는 실행 의미를 모두 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη
  english_pob_choice: came up
  chosen_korean: 올라와
  alternatives_korean:
  - 올라가
  - 올라왔습니다
  lexicon: BDAG
  rationale: 지명에서 다른 지점으로 ‘올라가다’는 이동 방향을 살리면서, 서술문 안에서 자연스럽게 이어지도록 ‘올라와’로 옮겼습니다.
- source_word: Γαζάρων
  english_pob_choice: Gazara
  chosen_korean: 가자라
  alternatives_korean:
  - 가자르
  - 게셀
  lexicon: LSJ
  rationale: 헬라어 본문의 지명형을 따라 ‘가자라’로 음역해, 히브리어형보다 그리스어 증거를 드러냈습니다.
- source_word: ἀπήγγειλεν
  english_pob_choice: reported
  chosen_korean: 보고했습니다
  alternatives_korean:
  - 알렸습니다
  - 전했습니다
  lexicon: BDAG
  rationale: 군사·정치적 맥락에서 단순한 ‘말하다’보다 공식적으로 소식을 전한다는 뉘앙스를 살려 ‘보고했습니다’를 택했습니다.
- source_word: συνετέλει
  english_pob_choice: was doing / was accomplishing
  chosen_korean: 하고 있는 일
  alternatives_korean:
  - 진행하고 있는 일
  - 수행하고 있는 일
  - 해 나가고 있는 일
  lexicon: BDAG
  rationale: 불완료 과거의 진행성을 살리면서도, EN POB가 제시한 ‘was doing’/‘was accomplishing’의 의미 긴장을 무리 없이 담기 위해 중립적인 ‘하고 있는 일’로 옮겼습니다.
- source_word: Κενδεβαῖος
  english_pob_choice: Cendebeus
  chosen_korean: 켄데바이오스
  alternatives_korean:
  - 켄데베우스
  - 센데베우스
  lexicon: LSJ
  rationale: 인명은 그리스어 형태가 보이도록 음역했으며, 한국어 표기 관행을 고려해 ‘켄데바이오스’를 선택했습니다.
