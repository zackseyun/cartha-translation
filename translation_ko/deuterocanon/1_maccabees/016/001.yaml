  terminology: ‘가자라’와 ‘켄데바이오스’는 그리스어 형태를 따르는 일관된 음역이며, 신학 용어상 문제는 없습니다. 각주 표지는 본문상의 의미 선택 지점에 적절히 연결됩니다.
