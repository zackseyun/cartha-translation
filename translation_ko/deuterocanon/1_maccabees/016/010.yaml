    rationale: 원문은 앞의 복수 ‘망대들’ 뒤에 여성 단수 대명사를 사용합니다. ‘그곳’을 사용하면 한국어는 자연스러워지지만, 선행사가 명시되지 않은 원문의 문법적 난점을 주석으로 밝혀야 합니다.
