  source_fidelity: 대체로 원문을 충실히 옮겼습니다. 다만 Ἀζώτου는 그리스어 음역을 따른다면 ‘아조토스’가 더 정확하며, ἄνδρας의 남성 지시를 ‘사람’으로 중화하지 않는 편이 좋습니다. 여성 단수 대명사 αὐτήν은 복수 ‘망대들’과 문법적으로 일치하지 않으므로, 집합적 장소를 가리킬 수 있는 한국어 표현과 주석으로 그 모호성을 보존해야 합니다.
  naturalness: ‘도망하였고’, ‘망대들’, ‘평안히’는 현대의 격식 있는 성경 문체에서 자연스럽습니다. 다만 복수 선행사 뒤의 ‘그것’은 한국어에서 다소 부자연스러우므로 ‘그곳’을 쓰되, 원문의 단수 지시와 정확한 선행사가 불분명함을 주석으로 밝혀야 합니다.
  terminology: 그리스어 지명 Ἄζωτος(여기서는 속격 Ἀζώτου)는 ‘아조토스’로 옮기고, 익숙한 히브리어계 지명 ‘아스돗’을 주석에 제시하는 것이 일관됩니다. 전투 맥락의 ἄνδρας는 ‘남자’로 보존합니다.
