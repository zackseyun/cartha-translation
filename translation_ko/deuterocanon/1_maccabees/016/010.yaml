  - 시골의 망대들
  lexicon: LSJ
  rationale: πύργους는 문자적으로 ‘망대/탑’이지만, 방어시설 맥락에서는 ‘망대’가 한국어로 더 자연스럽고 구체적입니다.
- source_word: Ἀζώτου
  english_pob_choice: Azotus
  chosen_korean: 아소돗
  alternatives_korean:
  - 아스돗
  - 아조토스
  lexicon: LSJ
  rationale: 그리스어 지명을 현대 음역으로 옮기되, 한국어 성경 독자가 바로 인식할 수 있는 형태를 우선했습니다.
- source_word: ἐνεπύρισεν αὐτὴν ἐν πυρί
  english_pob_choice: he burned it with fire
  chosen_korean: 그것을 불로 태웠으며
  alternatives_korean:
  - 그들을 불로 태웠으며
  - 불을 질렀으며
  lexicon: LSJ
  rationale: 단수 대명사 αὐτήν을 따라 집합적 방어거점 전체를 가리키는 ‘그것’을 유지했고, ἐν πυρί는 직역에 가까운 ‘불로’로 살렸습니다.
- source_word: ἔπεσον ἐξ αὐτῶν εἰς ἄνδρας χιλίους
  english_pob_choice: about a thousand men fell from among them
  chosen_korean: 그들 가운데서 약 천 명의 사람이 쓰러졌고
  alternatives_korean:
  - 그들 가운데 약 천 명이 쓰러졌고
  - 그들 가운데서 천 명가량의 남자가 쓰러졌고
  lexicon: LSJ
  rationale: χιλίους의 수량 감각을 살리기 위해 ‘약’을 넣었고, ἄνδρας는 성별이 드러나는 ‘사람들/남자들’ 중 문맥상 무난한 ‘사람의’로 옮겼습니다.
- source_word: ἀπέστρεψεν εἰς τὴν Ἰουδαίαν μετʼ εἰρήνης
  english_pob_choice: he returned to Judea in peace
  chosen_korean: 평안히 유대로 돌아왔습니다
  alternatives_korean:
  - 평화롭게 유대로 돌아왔습니다
  - 평안을 가지고 유대로 돌아왔습니다
  lexicon: LSJ
  rationale: μετʼ εἰρήνης의 관용적 의미를 한국어 부사 ‘평안히’로 자연스럽게 옮겼습니다.
