base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/016/010.yaml
  text: And they fled into the towers in the fields of Azotus[a], and he burned it with fire; and about a thousand men fell from among them[c][b], and he returned to Judea in peace.
  footnotes:
  - marker: a
    text: Azotus is the Greek name for Ashdod.
    reason: lexical_alternative
  - marker: b
    text: The Greek says 'he burned it with fire'; the singular 'it' may refer collectively to the stronghold area rather than to the plural 'towers' taken individually.
    reason: lexical_alternative
  - marker: c
    text: Or 'a thousand men'; the Greek expression may indicate an approximate total.
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 아소돗[a] 들판에 있는 망대들로 도망하였고, 그는 그것을 불로 태웠으며, 그들 가운데서 약 천 명의 사람이 쓰러졌고, 그는 평안히 유대로 돌아왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아소돗은 그리스어 지명으로, 히브리어 אשדוד(아스돗/아슈도드)에 해당합니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἔφυγον
  english_pob_choice: they fled
  chosen_korean: 도망하였고
  alternatives_korean:
  - 달아났고
  - 피하여 갔고
  lexicon: LSJ
  rationale: 전투 상황의 급박한 후퇴를 자연스럽게 살리면서도, 과도하게 해석하지 않는 기본 동사를 택했습니다.
- source_word: πύργους τοὺς ἐν τοῖς ἀγροῖς
  english_pob_choice: the towers in the fields
  chosen_korean: 들판에 있는 망대들
  alternatives_korean:
