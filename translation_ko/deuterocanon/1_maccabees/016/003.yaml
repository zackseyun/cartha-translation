review_pass:
  verdict: revise
  source_fidelity: 'The draft generally conveys the Greek accurately: Simon has grown old; the listeners are sufficiently mature in age through unspecified mercy; they are to take the place of him and his brother, defend their nation, and receive help from heaven. However, ‘나이에 있어 충분합니다’ is not idiomatic Korean and weakens the contextual sense of being adequately mature. The placement of all three anchors at the end also obscures what each note qualifies.'
  naturalness: ‘제 대신과 제 형제의 대신이 되십시오’ is an unnatural and potentially confusing repetition in Korean. ‘저와 제 형제를 대신하십시오’ naturally expresses the substitutional force of ἀντί. ‘여러분도 자비로 말미암아 나이가 충분히 들었습니다’ is formal, natural, and retains the source’s unspecified mercy.
  terminology: ‘우리 민족을 위해 싸우십시오’ suitably renders ὑπερμαχεῖτε ὑπὲρ τοῦ ἔθνους ἡμῶν in this context. ‘하늘에서 오는 도움’ preserves the indirect divine reference without inserting 하나님 into the text. The respectful ‘저/제’ register is coherent for a formal address.
  issues:
  - severity: medium
    issue: ‘나이에 있어 충분합니다’ is unnatural Korean.
    rationale: Although it attempts to render ἱκανοί ἐστε ἐν τοῖς ἔτεσιν literally, Korean does not naturally describe a person as ‘sufficient in age.’ The phrase means that the hearers have reached an adequate or mature age.
  - severity: medium
    issue: The substitution phrase is awkward and ambiguous.
    rationale: ‘제 대신과 제 형제의 대신이 되십시오’ sounds like two abstract ‘substitutes’ rather than an instruction to take the speaker’s and his brother’s place. ‘저와 제 형제를 대신하십시오’ retains the substitutional meaning clearly.
  - severity: low
    issue: Footnote anchors are all placed after the final clause.
    rationale: 'Each marker should follow the expression it explains: mercy, substitution, and help from heaven respectively.'
  revised_text: 그러나 저는 이제 늙었고, 여러분도 자비로 말미암아 나이가 충분히 들었습니다.[a] 저와 제 형제를 대신하십시오.[b] 나가서 우리 민족을 위해 싸우십시오. 하늘에서 오는 도움이 여러분과 함께 있기를 바랍니다.[c]
