- source_word: γίνεσθε ἀντʼ ἐμοῦ καὶ τοῦ ἀδελφοῦ μου
  english_pob_choice: Become my replacements, and my brother’s
  chosen_korean: 제 대신과 제 형제의 대신이 되십시오
  alternatives_korean:
  - 제 자리를 대신하십시오
  - 저와 제 형제의 자리를 맡으십시오
  lexicon: LSJ
  rationale: ἀντί의 대치 의미를 살리되 한국어에서 자연스럽게 읽히도록 ‘대신’ 반복 구조로 옮겼습니다.
- source_word: ὑπερμαχεῖτε
  english_pob_choice: fight on behalf of
  chosen_korean: 싸우십시오
  alternatives_korean:
