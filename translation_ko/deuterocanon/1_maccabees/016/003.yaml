  rationale: 완료형이 나타내는 현재적 상태를 자연스러운 합쇼체로 옮기기 위해 단순한 상태 진술인 ‘늙었고’를 택했습니다.
- source_word: ἐν τῷ ἐλέει
  english_pob_choice: by mercy
  chosen_korean: 자비로 말미암아
