  - 천상으로부터의 도움
  lexicon: LSJ
  rationale: ‘하늘’은 하나님의 직접 명칭을 피하면서도 신적 원조를 암시하는 원문 이미지를 보존하므로, 한국어에서는 출처를 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 원문이 말하는 신적 도움의 암시를 어디까지 드러낼지
  chosen_reading: ‘하늘로부터 오는 도움’으로 유지하고, 본문에는 하나님을 덧붙이지 않았습니다.
