  - 지켜 싸우십시오
  - 위해 싸우십시오
  lexicon: LSJ
  rationale: 이 동사는 수호·옹호를 포함한 전투 행위를 가리키므로, 문맥상 명확한 대상과 함께 쓰인 점을 살려 ‘싸우십시오’로 간결하게 옮기고 앞뒤 문맥이 그 목적을 드러내게 했습니다.
- source_word: ἐκ τοῦ οὐρανοῦ βοήθεια
  english_pob_choice: the help from heaven
  chosen_korean: 하늘로부터 오는 도움
  alternatives_korean:
