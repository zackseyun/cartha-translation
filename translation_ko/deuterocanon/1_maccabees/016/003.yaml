revisions:
- from: 그러나 저는 이제 늙었고, 여러분도 자비로 말미암아 나이에 있어 충분합니다. 제 대신과 제 형제의 대신이 되십시오. 그리고 나가서 우리 민족을 위해 싸우십시오. 그리고 하늘로부터 오는 도움이 여러분과 함께 있기를 바랍니다.[a][b][c]
  to: 그러나 저는 이제 늙었고, 여러분도 자비로 말미암아 나이가 충분히 들었습니다.[a] 저와 제 형제를 대신하십시오.[b] 나가서 우리 민족을 위해 싸우십시오. 하늘에서 오는 도움이 여러분과 함께 있기를 바랍니다.[c]
  rationale: 문맥상 ‘충분한 나이’라는 뜻을 자연스러운 현대 한국어로 옮기고, 저자와 그의 형제를 대신하라는 명령을 명료하게 다듬었습니다. 원문에 명시되지 않은 자비의 주체나 하나님의 이름은 본문에 추가하지 않았으며, 각 주석 표지는 해당 표현 바로 뒤로 옮겼습니다.
