base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/016/003.yaml
  text: But now I have grown old[a], and you also, by mercy, are mature in years. Become my replacements, and my brother’s, and go out and fight on behalf of our nation[c][b], and may the help from heaven be with you.
  footnotes:
  - marker: a
    text: Or 'through mercy'; the Greek does not explicitly say whose mercy, though the context naturally suggests divine mercy.
    reason: lexical_alternative
  - marker: b
    text: Or 'Take my place and my brother’s.' The Greek expresses substitution with 'instead of.'
    reason: alternative_reading
  - marker: c
    text: '''Help from heaven'' is a reverent way of speaking of divine aid without naming God directly.'
    reason: cultural_note
translation:
  language: ko
  text: 그러나 저는 이제 늙었고, 여러분도 자비로 말미암아 나이에 있어 충분합니다. 제 대신과 제 형제의 대신이 되십시오. 그리고 나가서 우리 민족을 위해 싸우십시오. 그리고 하늘로부터 오는 도움이 여러분과 함께 있기를 바랍니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 자비의 주체를 분명히 밝히지 않으므로, 본문은 이를 특정하지 않았습니다.
    reason: source_note
  - marker: b
    text: ‘대신’은 ἀντί의 대치 의미를 반영한 것입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘하늘로부터 오는 도움’은 하나님을 직접 부르지 않으면서도 신적 원조를 가리키는 완곡 표현입니다.
    reason: cultural_note
lexical_decisions:
