revisions:
- from: 그들이 아침 일찍 일어나 평야로 나아가는데, 보십시오, 큰 군대가 그들을 맞으러 오고 있었고 — 보병과 기병이었으며 — 그들 사이에는 와디가 있었습니다.[a]
  to: 그들이 아침 일찍 일어나 평야로 나아갔습니다. 그런데 보십시오, 보병과 기병으로 이루어진 큰 병력이 그들을 맞으러 왔고, 그들 사이에는 와디가 있었습니다.[a]
  rationale: 원문의 사건 순서와 ἰδού의 주의 환기 기능을 유지하면서, 병력의 구성 관계를 한국어에서 명확히 했습니다. ‘큰 병력’으로 δύναμις의 군사적 의미를 보존하되 정규 군대라는 의미를 과도하게 부여하지 않았습니다. ‘와디’는 유지하고, 각주를 통해 χειμάρρους의 계절성 물길 및 수로라는 의미 범위를 밝혔습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:47:00Z'
