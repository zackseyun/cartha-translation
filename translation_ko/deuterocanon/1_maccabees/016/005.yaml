  text: And when they rose early in the morning[a], they went into the plain; and behold, a large force came to meet them, infantry and cavalry, and a wadi was between them.
  footnotes:
  - marker: a
    text: Or 'a torrent-bed' or 'a seasonal stream.' The Greek term refers to a winter-flowing watercourse and may denote either the stream itself or its channel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 아침 일찍 일어나 평야로 나아가는데, 보십시오, 큰 군대가 그들을 맞으러 오고 있었고 — 보병과 기병이었으며 — 그들 사이에는 와디가 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘급류 골짜기’, ‘계절 하천’. 이 그리스어는 겨울에 물이 흐르는 물길을 가리키며, 물줄기 자체 또는 그 물길의 골짜기를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες τὸ πρωὶ
  english_pob_choice: when they rose early in the morning
  chosen_korean: 아침 일찍 일어나
  alternatives_korean:
  - 아침에 일어나
  - 새벽에 일어나
  lexicon: BDAG
  rationale: 분사와 시간 부사를 자연스러운 선행 동작으로 풀어, 아침 일찍 일어난 뒤 이동이 시작되었음을 보여 줍니다.
- source_word: ἐπορεύοντο εἰς τὸ πεδίον
  english_pob_choice: they went into the plain
  chosen_korean: 평야로 나아가는데
  alternatives_korean:
  - 평야로 갔는데
  - 평야로 진군하는데
  lexicon: BDAG
  rationale: 미완료 시상의 진행성을 살려 ‘나아가는데’로 옮겼고, πεδίον은 군사적 맥락에서 자연스러운 ‘평야’로 옮겼습니다.
- source_word: δύναμις πολλὴ
  english_pob_choice: a large force
  chosen_korean: 큰 군대
  alternatives_korean:
  - 큰 병력
  - 많은 군세
  lexicon: BDAG
  rationale: 군사 문맥의 δύναμις를 한국어에서 즉시 이해되는 집합명사 ‘군대’로 옮기되, 수량감은 ‘큰’으로 반영했습니다.
- source_word: χειμάρρους
  english_pob_choice: a wadi
  chosen_korean: 와디
  alternatives_korean:
  - 급류 골짜기
  - 계곡물
  lexicon: LSJ
  rationale: χειμάρρους의 계절성 물길 의미를 지키기 위해 ‘와디’를 유지했습니다. 이는 상시 하천보다 더 정확하게 사막·근동 지형을 드러냅니다.
theological_decisions:
- issue: 군사적 대치 장면의 긴장감 표현
  chosen_reading: ‘보십시오’와 대시를 사용해 급작스런 출현과 대치 구도를 드러냈습니다.
  alternative_readings:
  - 단순히 ‘그리고 보니’로 완화하기
  - 쉼표만으로 나열하기
  rationale: 본문의 ἰδοὺ는 서술 전환과 놀라움을 표시하므로, 한국어에서도 주의를 환기하는 표현이 필요합니다.
  doctrine_reference: 서사적 강조 표지의 전달 원칙
- issue: ‘와디’의 보존
  chosen_reading: 지형의 계절성 물길을 특별한 문화어휘로 보존했습니다.
  alternative_readings:
  - 하천
  - 시냇물
  - 골짜기
  rationale: 일반적인 하천이나 시냇물은 상시 흐르는 느낌을 주어 원문의 지형 감각을 약화시킬 수 있습니다.
  doctrine_reference: 근동 지리 배경의 의미 보존
