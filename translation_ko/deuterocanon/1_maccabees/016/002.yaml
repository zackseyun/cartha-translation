  text: And Simon called his two older sons, Judas and John, and said to them, “I and my brothers and my father’s house have fought the wars of Israel from youth until this day, and it has prospered in our hands to deliver Israel many times.”
  footnotes:
  - marker: a
    text: Or, more dynamically, “we have succeeded in delivering Israel many times.” The Greek says literally, “it has prospered in our hands to deliver Israel many times.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 시몬이 자기의 두 나이 많은 아들, 유다와 요한을 불러 그들에게 말했습니다. “나와 내 형제들, 그리고 내 아버지의 집안은 젊을 때부터 오늘에 이르기까지 이스라엘의 전쟁들을 치러 왔으며, 우리 손에 이스라엘을 여러 번 구출하는 일이 잘 이루어졌습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “우리 손에 이스라엘을 여러 번 구출하는 것이 잘 되었다”에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς δύο υἱοὺς αὐτοῦ τοὺς πρεσβυτέρους
  english_pob_choice: his two older sons
  chosen_korean: 자기의 두 나이 많은 아들
  alternatives_korean:
  - 자기의 두 맏아들
  - 자기의 두 형인 아들
  lexicon: LSJ
  rationale: πρεσβυτέρους는 ‘더 나이 많은/연장된’의 비교급이므로, 한국어에서는 자연스러운 합쇼체로 ‘나이 많은’이라고 옮겨 나이 순서를 분명히 했습니다.
- source_word: ἐπολεμήσαμεν
  english_pob_choice: have fought
  chosen_korean: 전쟁들을 치러 왔으며
  alternatives_korean:
  - 전쟁들을 싸워 왔으며
  - 전쟁들을 해 왔으며
  lexicon: LSJ
  rationale: 현재완료적 지속성을 살리기 위해 ‘-쳐 왔으며’ 구조를 택했고, πολέμους와 맞물려 군사적 행위를 자연스럽게 드러내는 ‘치르다’를 사용했습니다.
- source_word: τοὺς πολέμους Ἰσραήλ
  english_pob_choice: the wars of Israel
  chosen_korean: 이스라엘의 전쟁들
  alternatives_korean:
  - 이스라엘의 싸움들
  - 이스라엘의 전투들
  lexicon: LSJ
  rationale: 속격 관계를 직접 반영하되, πολέμους의 범위를 좁히지 않도록 ‘전투들’보다 넓은 ‘전쟁들’을 유지했습니다.
- source_word: ῥύσασθαι
  english_pob_choice: to deliver
  chosen_korean: 구출하는 일
  alternatives_korean:
  - 구해 내는 일
  - 건져 내는 일
  lexicon: LSJ
  rationale: 군사적 구원 맥락에서 ‘deliver’에 해당하는 한국어로 ‘구출하다’를 택해, 단순한 도움보다 압제/위기에서 건져내는 의미를 살렸습니다.
- source_word: εὐώδωθη ἐν ταῖς χερσὶν ἡμῶν
  english_pob_choice: it has prospered in our hands
  chosen_korean: 우리 손에 … 일이 잘 이루어졌습니다
  alternatives_korean:
  - 우리 손에서 번성했습니다
  - 우리 손에서 형통했습니다
  lexicon: LSJ
  rationale: 직역하면 어색한 관용구이므로, 손의 이미지(ἐν ταῖς χερσὶν ἡμῶν)는 살리면서도 ‘잘 이루어지다’로 성공/형통의 뜻을 전달했습니다.
theological_decisions:
- issue: 인간 행위와 성공의 귀속
  chosen_reading: 본문의 성공은 하나님의 이름을 직접 언급하지 않고, 시몬의 가문이 수행한 구출 행위가 ‘잘 이루어졌다’는 식으로 진술합니다.
  alternative_readings:
  - 하나님의 도우심을 암시하는 표현으로 더 신앙적으로 풀어쓸 수 있습니다.
  rationale: 그리스어 본문이 명시적으로 하나님을 주어로 삼지 않으므로, 인간 행위의 서술을 유지해 신학적 긴장을 보존했습니다.
  doctrine_reference: 본문의 서술 주체를 임의로 바꾸지 않고 인간-섭리 관계의 긴장을 유지합니다.
