base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/016/011.yaml
  text: And Ptolemy son of Abubus had been appointed governor over the plain of Jericho[a], and he had much silver and gold;
  footnotes:
  - marker: a
    text: Greek στρατηγός can also mean 'general' or 'military governor.' Here it is rendered 'governor' because the phrase describes authority over a district rather than only battlefield command.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 아부부의 아들 프톨레마이오스는 여리고 평원의 총독으로 임명되어 있었고, 많은 은과 금을 가지고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 στρατηγός는 ‘장군’이나 ‘군정관’도 뜻할 수 있습니다. 여기서는 전장 지휘보다 지역 관할을 가리키므로 ‘총독’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πτολεμαῖος
  english_pob_choice: Ptolemy
  chosen_korean: 프톨레마이오스
  alternatives_korean:
  - 프톨레미
  - 톨레미
  lexicon: 고유명사 음역
  rationale: 헬라어 인명을 현대 표기법에 따라 음역했습니다. 한국어 성서에서 익숙한 관용형이 없어 원음에 가까운 프톨레마이오스를 택했습니다.
- source_word: ὁ τοῦ Ἀβούβου
  english_pob_choice: son of Abubus
  chosen_korean: 아부부의 아들
  alternatives_korean:
  - 아부부의 아들인
  - 아부부에게서 난
  lexicon: 친족 표지 구문
  rationale: 속격으로 된 부친 표지는 한국어에서 자연스러운 소유·계보 표현인 ‘~의 아들’로 옮기는 것이 가장 분명합니다.
- source_word: ἦν καθεστημένος
  english_pob_choice: had been appointed
  chosen_korean: 임명된
  alternatives_korean:
  - 임명되어 있던
  - 세워진
  - 배치된
  lexicon: LSJ
  rationale: 과거의 임명으로 인해 유지되는 상태를 나타내므로, 능동적 행위보다 결과 상태를 드러내는 ‘임명된’이 적절합니다.
- source_word: στρατηγὸς
  english_pob_choice: governor
  chosen_korean: 총독
  alternatives_korean:
  - 지휘관
  - 장군
  - 군정관
  lexicon: LSJ
  rationale: 본문은 전투 지휘보다 지역에 대한 관할을 묘사하므로, 군사성과 행정성이 함께 드러나는 ‘총독’이 문맥에 가장 잘 맞습니다.
- source_word: εἰς τὸ πεδίον Ἰεριχώ
  english_pob_choice: over the plain of Jericho
  chosen_korean: 여리고 평원 위에
  alternatives_korean:
  - 여리고 평원에
  - 여리고 평원에 대한
  - 여리고 평원 지역을
  lexicon: LSJ
  rationale: εἰς는 여기서 관할 범위를 나타내므로 ‘위에’로 행정적 지배를 살렸고, πεδίον은 ‘평원’으로 유지했습니다.
- source_word: ἀργύριον καὶ χρυσίον πολύ
  english_pob_choice: much silver and gold
  chosen_korean: 은과 금이 매우 많았습니다
  alternatives_korean:
  - 은과 금이 많았습니다
  - 많은 은과 금을 가지고 있었습니다
  - 은과 금을 많이 소유했습니다
  lexicon: LSJ
  rationale: 단순한 소유 진술을 자연스러운 한국어로 옮기되, πολύ의 강조를 ‘매우’로 반영했습니다.
