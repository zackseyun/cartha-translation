base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/016/015.yaml
  text: And the son of Abubus welcomed them into the stronghold called Dok with deceit[a], which he had built, and he gave them a great banquet; and he had men hidden there.
  footnotes:
  - marker: a
    text: Or 'he prepared a great drinking feast for them.' The Greek phrase literally emphasizes drink (πότον), though the broader sense is a lavish banquet.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 아부부스의 아들이 그들을 속임수로, 그가 세운 도크라 불리는 요새 안으로 맞아들였고, 그들에게 큰 잔치를 베풀었으며, 거기 사람들을 숨겨 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘큰 잔치’로 옮겼지만, 그리스어 πότον은 문자적으로는 ‘마심/술자리’를 강조합니다. 문맥상 호화로운 연회를 가리키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπεδέξατο
  english_pob_choice: welcomed
  chosen_korean: 맞아들였고
  alternatives_korean:
  - 환대했고
  - 받아들였고
  - 영접했고
  lexicon: LSJ
  rationale: 환대의 동작을 살리면서도 뒤따르는 ‘속임수’와 연결되어, 단순한 친절보다 의도적 수용의 뉘앙스를 드러내는 표현을 택했습니다.
- source_word: ὁ τοῦ Ἀβουβον
  english_pob_choice: the son of Abubus
  chosen_korean: 아부부스의 아들
  alternatives_korean:
  - 아부부스의 아들인 사람
  - 아부부스의 아들
  lexicon: LSJ
  rationale: 그리스어의 친족표현을 그대로 반영해 인물 식별 방식을 보존했습니다.
- source_word: ὀχύρωματιν / τὸ καλούμενον Δὼκ
  english_pob_choice: the stronghold called Dok
  chosen_korean: 도크라 불리는 요새
  alternatives_korean:
  - 도크라 불리는 성채
  - 도크라 불리는 견고한 곳
  lexicon: LSJ
  rationale: 비정형 철자라도 의미는 분명히 군사적 방어 거점이므로, ‘요새’로 자연스럽게 옮기고 이름은 음역했습니다.
- source_word: μετὰ δόλου
  english_pob_choice: with deceit
  chosen_korean: 속임수로
  alternatives_korean:
  - 기만으로
  - 배신으로
  - 속여서
  lexicon: LSJ
  rationale: 전치사구의 명사적 성격을 살리면서, 환대가 사실상 함정이었다는 점을 압축적으로 드러내는 표현을 사용했습니다.
- source_word: ἐποίησεν αὐτοῖς πότον μέγαν
  english_pob_choice: he gave them a great banquet
  chosen_korean: 그들에게 큰 잔치를 베풀었으며
  alternatives_korean:
  - 그들에게 큰 술잔치를 차렸으며
  - 그들을 위해 큰 잔치를 준비했으며
  lexicon: LSJ
  rationale: πότον은 문자적으로 ‘마심/술자리’의 성격이 있으나, 문맥상 호화로운 연회를 가리키므로 한국어에서는 자연스러운 ‘잔치’를 택했습니다.
- source_word: ἐνέκρυψεν ἐκεῖ ἄνδρας
  english_pob_choice: he had men hidden there
  chosen_korean: 거기 사람들을 숨겨 두었습니다
  alternatives_korean:
  - 거기 남자들을 숨겨 두었습니다
  - 거기 군사들을 숨겨 두었습니다
  lexicon: LSJ
  rationale: ἀνδρας는 문자적으로 ‘남자들’이지만, 함정에 배치된 인원을 자연스럽게 가리키므로 한국어에서는 성별을 너무 강하게 드러내지 않는 ‘사람들’로 완화하지 않고, 원문 직접성을 위해 ‘남자들’을 포함한 표현보다 맥락적 기능을 우선해 ‘사람들’을 선택했습니다.
theological_decisions:
- issue: ὑπεδέξατο … μετὰ δόλου의 결합이 단순한 환대가 아니라 배신적 함정임을 어떻게 드러낼지
  chosen_reading: ‘맞아들였고 … 속임수로’로 옮겨, 환대의 외형과 배신의 실체를 함께 보이도록 했습니다.
  alternative_readings:
  - ‘영접했고 … 기만으로’
  - ‘환대했고 … 배반적으로’
  rationale: 본문은 호의와 속임수를 병치해 서술하므로, 둘 중 하나를 약화시키지 않고 긴장을 보존하는 것이 중요합니다.
  doctrine_reference: 서사 본문의 의미 보존과 인물 행위의 도덕적 평가
