  to: 그리고 아부부스의 아들은 속임수로 그들을 자신이 세운 도크라 불리는 요새 안으로 맞아들였고, 그들에게 큰 잔치를 베풀었으며[a], 그곳에 남자들을 숨겨 두었습니다.
