  text: καὶ ὑπεδέξατο αὐτοὺς ὁ τοῦ Ἀβουβον εἰς τὸ ὀχύρωματιν τὸ καλούμενον Δὼκ μετὰ δόλου, ὃ ᾠκοδόμησεν, καὶ ἐποίησεν αὐτοῖς πότον μέγαν· καὶ ἐνέκρυψεν ἐκεῖ ἄνδρας.
