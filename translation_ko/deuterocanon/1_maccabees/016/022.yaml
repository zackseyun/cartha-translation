    rationale: “그가 그것을 듣고 크게 놀라,” 뒤에 별도 주어를 가진 문장이 이어져, 번역문으로서 다소 매끄럽지 않습니다. 원문의 두 주절을 한국어에서도 분명히 나누는 것이 좋습니다.
