  source_fidelity: 핵심 사건 순서와 의미는 대체로 충실합니다. 다만 첫 절의 연결형 종결(“크게 놀라,”)은 문장 구조상 부자연스럽고, ἐξέστη σφόδρα의 위기 상황에서의 강한 동요는 “몹시 당황했습니다”가 더 적절히 드러냅니다. ἀπολέσαι의 두 용례를 ‘죽이다’로 일관되게 옮긴 것은 이 문맥에서 타당합니다.
  naturalness: 초안의 “그가 그것을 듣고 크게 놀라,”는 쉼표 뒤에 이어지는 절과 문법적으로 연결될 수는 있으나, 현대 한국어 합쇼체 성경 문장으로는 종결을 분명히 하는 편이 자연스럽습니다. “그 사람들”의 지시성도 원문에 없는 강조이므로 “사람들”로 간결하게 고쳤습니다.
  terminology: ‘붙잡아’, ‘죽였습니다’는 συνέλαβεν 및 ἀπέκτεινεν에 자연스럽고 정확합니다. ‘죽이러’와 ‘죽이려’는 원문의 반복된 ἀπολέσαι를 문맥상 충실하게 반영합니다.
