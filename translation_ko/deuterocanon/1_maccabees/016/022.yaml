  text: And when he heard, he was greatly alarmed, and he seized the men who had come to destroy him and killed them, for he knew that they were seeking to destroy him.
translation:
  language: ko
  text: 그가 듣고 몹시 당황했습니다. 그리고 자기를 죽이러 온 사람들을 붙잡아 죽였습니다. 그들이 자기를 죽이려 하고 있었음을 알았기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξέστη σφόδρα
  english_pob_choice: he was greatly alarmed
  chosen_korean: 크게 놀라
  alternatives_korean:
  - 몹시 당황하여
  - 크게 두려워하여
  - 몹시 놀라
  lexicon: BDAG
  rationale: 여기서는 단순한 ‘놀람’보다 위협을 감지한 급박한 반응이 중요하므로, ‘크게 놀라’가 문맥을 가장 자연스럽게 살립니다.
- source_word: συνέλαβεν
  english_pob_choice: he seized
  chosen_korean: 붙잡아
  alternatives_korean:
  - 체포하여
  - 사로잡아
  - 붙들어
  lexicon: BDAG
  rationale: 법적 절차의 뉘앙스를 더하는 ‘체포하여’보다, 즉각적으로 손에 넣어 제압하는 의미를 살리는 ‘붙잡아’가 본문 상황에 맞습니다.
- source_word: ἀπολέσαι / ἀπολέσαι αὐτόν
  english_pob_choice: destroy him
  chosen_korean: 죽이러
  alternatives_korean:
  - 멸망시키러
  - 없애려
  - 죽게 하려고
  lexicon: BDAG
  rationale: ἀπόλλυμι는 넓게는 ‘파멸시키다/없애다’이지만, 이 절의 반복과 암살 맥락에서는 실제 살해 의도가 분명하므로 자연스럽게 ‘죽이러’로 옮겼습니다.
- source_word: ἀπέκτεινεν αὐτούς
  english_pob_choice: killed them
  chosen_korean: 죽였습니다
  alternatives_korean:
  - 죽여 버렸습니다
  - 처형했습니다
  - 살해했습니다
  lexicon: BDAG
  rationale: 직설적이고 현대적인 표현인 ‘죽였습니다’가 본문의 사건 전개를 분명하게 전달합니다.
theological_decisions:
- issue: 동일 어근 ἀπολέσαι의 반복 처리
  chosen_reading: 앞의 목적절과 뒤의 종속절 모두를 한국어에서 ‘죽이려’로 통일해, 반복되는 의도와 행위의 긴장을 드러냈습니다.
  alternative_readings:
  - 앞은 ‘멸망시키러’, 뒤는 ‘죽이려’로 구분
  - 둘 다 ‘없애려’로 완화
  rationale: 이 장면은 ‘destroy’보다 암살 의도가 핵심이므로, 반복되는 동사를 일관되게 드러내는 편이 서술의 힘을 보존합니다.
  doctrine_reference: 본문 의미 보존과 서사적 일관성
- issue: ἐξέστη σφόδρα의 정서 강도
  chosen_reading: ‘크게 놀라’로 옮겨, 단순한 경탄이 아니라 즉각적 위협 인식에서 오는 충격을 나타냈습니다.
  alternative_readings:
  - ‘몹시 놀라’
  - ‘완전히 넋을 잃고’
  - ‘몹시 당황하여’
  rationale: 문맥상 감탄보다 위기 반응이 자연스러우므로, 독자가 사건의 긴박함을 바로 느끼게 하는 방향을 택했습니다.
  doctrine_reference: 서사 맥락과 정서 강도
