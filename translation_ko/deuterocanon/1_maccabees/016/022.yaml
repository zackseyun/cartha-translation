revisions:
- from: 그가 그것을 듣고 크게 놀라, 자기를 죽이러 온 그 사람들을 붙잡아 죽였습니다. 그가 그들이 자기를 죽이려 하고 있음을 알았기 때문입니다.
  to: 그가 듣고 몹시 당황했습니다. 그리고 자기를 죽이러 온 사람들을 붙잡아 죽였습니다. 그들이 자기를 죽이려 하고 있었음을 알았기 때문입니다.
  rationale: 원문의 시간적 분사(ἀκούσας)와 이어지는 두 주절을 자연스러운 한국어 문장으로 재구성했습니다. ἐξέστη σφόδρα는 단순한 경탄보다는 살해 위협을 들은 뒤의 심한 동요를 가리키므로 ‘몹시 당황했습니다’로 옮겼습니다. 살해 의도를 나타내는 반복된 ἀπολέσαι는 ‘죽이러/죽이려’로 유지했으며, ζητέω의 미완료적·진행적 성격은 ‘죽이려 하고 있었음’으로 반영했습니다.
