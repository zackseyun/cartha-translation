translation:
  language: ko
  text: 시몬과 그의 아들들이 술에 취하자, 프톨레마이오스와 그와 함께 있던 자들이 일어나 자기들의 무기를 집어 들고 시몬이 있는 연회[a] 자리로 들이닥쳐, 그와 그의 아들들과 그의 젊은 시종들 몇 명을 죽였습니다.
  philosophy: optimal-equivalence
  footnotes:
