  text: And when Simon and his sons became drunk[a], Ptolemy and those with him rose up and took their weapons, and entered the banquet against Simon, and killed him and his sons, and some of his young servants.
  footnotes:
  - marker: a
    text: Or 'drinking party' for 'banquet'; the Greek term can refer specifically to a drinking feast.
    reason: lexical_alternative
translation:
  language: ko
  text: 시몬과 그의 아들들이 술에 취하자, 프톨레마이오스와 그와 함께 있던 자들이 일어나 자기들의 무기를 잡고, 시몬을 향해 연회에 들어가 그와 그의 아들들을 죽였으며, 그의 하인들 가운데 몇 사람도 죽였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘술잔치’입니다. 그리스어 용어는 특히 술자리 성격의 잔치를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμεθύσθη
  english_pob_choice: became drunk
  chosen_korean: 술에 취하자
  alternatives_korean:
  - 취하자
  - 술에 취했을 때
  lexicon: LSJ
  rationale: aorist passive의 사건 발생성을 살려 상태 묘사보다 ‘취하자’로 처리했고, 현대 한국어에서 자연스럽습니다.
- source_word: οἱ μετʼ αὐτοῦ
  english_pob_choice: those with him
  chosen_korean: 그와 함께 있던 자들이
  alternatives_korean:
  - 그와 함께한 사람들
  - 그의 사람들도
  lexicon: LSJ
  rationale: 원문은 동행자들의 신분을 특정하지 않으므로, 관계를 과도하게 좁히지 않는 표현을 택했습니다.
- source_word: ἐπεισῆλθοσαν
  english_pob_choice: entered the banquet against
  chosen_korean: 시몬을 향해 연회에 들어가
  alternatives_korean:
  - 연회에 들어가 시몬을 공격하여
  - 시몬에게 들이닥쳐 연회에 들어가
  lexicon: LSJ
  rationale: 방향성과 적대적 침입의 뉘앙스를 함께 살리되, 한국어 문장으로는 ‘향해 … 들어가’가 가장 자연스럽습니다.
- source_word: συμπόσιον
  english_pob_choice: banquet
  chosen_korean: 연회
  alternatives_korean:
  - 잔치
  - 술잔치
  lexicon: LSJ
  rationale: 직역하면 ‘술잔치’의 뉘앙스가 있지만, 문맥상 궁정 연회로도 읽히므로 기본적으로는 ‘연회’로 두고 음주 맥락은 앞절에서 반영했습니다.
- source_word: παιδαρίων
  english_pob_choice: young servants
  chosen_korean: 하인들 가운데 몇 사람
  alternatives_korean:
  - 젊은 하인들 가운데 몇 사람
  - 어린 하인들 가운데 몇 사람
  - 종들 가운데 몇 사람
  lexicon: LSJ
  rationale: παιδάριον은 나이 어린 종/시종을 가리킬 수 있으나, 한국어에서 ‘어린 하인들’은 어색할 수 있어 신분 의미를 우선한 완곡한 표현을 택했습니다.
