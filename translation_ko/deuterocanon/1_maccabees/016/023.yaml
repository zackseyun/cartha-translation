  text: And the rest of the accounts concerning John, and his wars, and his mighty deeds that he did, and the building of the walls that he built, and his acts—
translation:
  language: ko
  text: 그리고 요한에 관한 나머지 기록과 그의 전쟁들, 그가 행한 용맹한 업적들, 그가 성벽들을 세운 일, 그리고 그의 행적들에 대해서는—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ λοιπὰ
  english_pob_choice: the rest
  chosen_korean: 나머지
  alternatives_korean:
  - 남은 것들
  - 남은 기록
  lexicon: LSJ
  rationale: 서술을 마무리하는 요약 공식을 자연스럽게 살리면서, 이어지는 목록의 성격을 반영하는 간결한 표현으로 옮겼습니다.
- source_word: λόγων
  english_pob_choice: accounts
  chosen_korean: 기록
  alternatives_korean:
  - 말들
  - 사실들
  - 기록들
  lexicon: LSJ
  rationale: 여기서는 단순한 ‘말’이 아니라 요한에 관한 역사적 서술 항목들을 가리키므로, 한국어로는 ‘기록’이 문맥에 가장 잘 맞습니다.
- source_word: ἀνδραγαθιῶν
  english_pob_choice: mighty deeds
  chosen_korean: 용맹한 업적들
  alternatives_korean:
  - 용감한 일들
  - 영웅적인 업적들
  - 무훈들
  lexicon: LSJ
  rationale: 용맹과 공적의 뉘앙스를 함께 살리되, 한국어에서 과도하게 고풍스럽지 않도록 옮겼습니다.
- source_word: οἰκοδομῆς τῶν τειχέων
  english_pob_choice: the building of the walls
  chosen_korean: 성벽의 건축
  alternatives_korean:
  - 성벽을 세운 일
  - 성벽의 건설
  - 방어벽의 건축
  lexicon: LSJ
  rationale: τειχέων은 방어용 성벽을 가리키므로 ‘성벽’으로 구체화했고, οἰκοδομή는 건축 행위를 뜻해 문어체로 자연스럽게 연결했습니다.
- source_word: πράξεων
  english_pob_choice: acts
  chosen_korean: 행적들
  alternatives_korean:
  - 행동들
  - 업적들
  - 일들
  lexicon: LSJ
  rationale: 마지막 열거 항목으로서 포괄성을 유지하면서, 역사 서술에서 흔한 ‘행적’으로 마무리했습니다.
