base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/016/008.yaml
  text: And they sounded the trumpets[a], and Cendebeus and his camp were thrown into confusion, and many of them fell wounded[b]; but those who were left fled into the stronghold.
  footnotes:
  - marker: a
    text: Or 'were routed' / 'were put to flight' for 'were thrown into confusion' (ἐτροπώθη). The Greek military verb can carry the stronger sense of defeat and dispersal.
    reason: lexical_alternative
  - marker: b
    text: '''Fell wounded'' reflects the Greek closely and need not mean all died; it can denote men struck down in battle as wounded.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 나팔을 불었고, 켄데바이오스와 그의 진영은 혼란에 빠졌으며[a], 그들 가운데 많은 사람이 부상당해 쓰러졌습니다.[b] 그러나 남은 사람들은 요새로 도망쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἐτροπώθη는 군사 문맥에서 ‘패주하다’ 또는 ‘패하여 도주하다’라는 더 강한 뜻을 나타낼 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘부상당해 쓰러졌다’는 표현은 그리스어를 가깝게 따른 것으로, 반드시 모두 죽었다는 뜻은 아닙니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐσάλπισαν / ταῖς σάλπιγξιν
  english_pob_choice: sounded the trumpets
  chosen_korean: 나팔을 불었고
  alternatives_korean:
  - 나팔을 불었으며
  - 나팔을 울렸고
  lexicon: LSJ
  rationale: 군사 신호를 나타내는 동사를 자연스러운 한국어로 옮기되, 도구격 의미를 살려 직접적으로 ‘나팔을 불다’로 렌더링했습니다.
- source_word: ἐτροπώθη
  english_pob_choice: were thrown into confusion
  chosen_korean: 혼란에 빠졌으며
  alternatives_korean:
  - 패주했으며
  - 도주하게 되었으며
  - 흩어졌으며
  lexicon: LSJ
  rationale: 이 동사는 군사적 맥락에서 패배·혼란·분산을 뜻할 수 있으므로, 뒤의 도주를 따로 말하는 본문 구조를 살려 즉각적 결과인 ‘혼란에 빠지다’로 옮겼습니다.
- source_word: παρεμβολὴ
  english_pob_choice: camp
  chosen_korean: 진영
  alternatives_korean:
  - 군대
  - 진지
  - 야영지
  lexicon: LSJ
  rationale: 여기서는 군사 집단을 가리키는 말이므로, 구체적이면서도 집합적 의미를 살릴 수 있는 ‘진영’이 적절합니다.
- source_word: τραυματίαι
  english_pob_choice: wounded
  chosen_korean: 부상당해 쓰러졌습니다
  alternatives_korean:
  - 부상자들이 생겼습니다
  - 부상당했습니다
  - 상처 입은 사람들이 있었습니다
  lexicon: LSJ
  rationale: 그리스어는 ‘죽었다’가 아니라 ‘부상당한 채 쓰러진’ 상태를 말하므로, 전투에서 맞아 쓰러졌다는 뜻을 드러내면서도 사망 여부를 단정하지 않도록 옮겼습니다.
- source_word: ὀχύρωμα
  english_pob_choice: stronghold
  chosen_korean: 요새
  alternatives_korean:
  - 요새화된 곳
  - 견고한 피난처
  - 성채
  lexicon: LSJ
  rationale: ὀχύρωμα는 방어 시설을 뜻하므로, 한국어로 가장 자연스럽고 군사적 맥락에 맞는 ‘요새’로 번역했습니다.
theological_decisions:
- issue: τραυματίαι의 전투 결과를 사망으로 단정할지 여부
  chosen_reading: ‘부상당해 쓰러졌습니다’로 옮겨, 부상과 전투 불능을 말하되 죽음은 단정하지 않았습니다.
  alternative_readings:
  - ‘죽거나 다쳤습니다’
  - ‘전사했습니다’
  rationale: 본문과 영어 주석 모두 이 표현이 반드시 사망을 뜻하지 않는다고 보므로, 해석을 확장하지 않고 열린 의미를 유지했습니다.
  doctrine_reference: 본문사실성 / 과잉해석 방지
