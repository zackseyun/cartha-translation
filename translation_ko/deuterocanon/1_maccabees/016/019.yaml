  yaml_path: translation/deuterocanon/1_maccabees/016/019.yaml
  text: And he sent others to Gazara to take John[a], and to the commanders of thousands he sent letters to come to him[b], so that he might give them silver and gold and gifts.
  footnotes:
  - marker: a
    text: Or 'to remove John'; the Greek infinitive can denote taking away or carrying off, and the context suggests hostile intent without requiring a more specific verb such as 'seize.'
    reason: lexical_alternative
  - marker: b
    text: Gazara is the Greek place-name form in the source text; it corresponds to the better-known Gezer.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그는 다른 이들을 가자라[b]로 보내 요한을 데려가게[a] 하고, 천인대장들에게는 자기에게 오라고 편지를 보냈습니다. 이는 그가 그들에게 은과 금과 선물을 주기 위해서였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘데려가다’는 αἴρω의 가능한 의미를 반영한 것입니다. 이 동사는 문맥에 따라 ‘옮기다’, ‘제거하다’, ‘데려가다’ 등의 의미 범위를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 가자라는 원문의 그리스어 지명형 Γάζαρα를 반영한 음역입니다. 이는 더 널리 알려진 지명 ‘게셀’에 해당합니다.
    reason: cultural_note
