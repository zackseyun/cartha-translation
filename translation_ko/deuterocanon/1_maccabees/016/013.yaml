  text: καὶ ὑψώθη ἡ καρδία αὐτοῦ, καὶ ἐβουλήθη κατακρατῆσαι τῆς χώρας, καὶ ἐβούλευετο δόλῳ κατὰ Σίμωνος καὶ κατὰ τῶν υἱῶν αὐτοῦ ἆραι αὐτούς.
