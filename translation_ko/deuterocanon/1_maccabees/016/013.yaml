base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/016/013.yaml
  text: And his heart was lifted up[a], and he intended to seize control of the country, and he was plotting deceitfully against Simon and against his sons[b], to remove them.
  footnotes:
  - marker: a
    text: Or 'he became proud'; literally, 'his heart was lifted up.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to do away with them.' The Greek says 'to remove them,' which in context likely implies violent elimination.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그의 마음이 높아져, 그는 그 땅을 장악하려 했으며, 시몬과 그의 아들들을 상대로 속임수로 그들을 제거하려고 음모를 꾸몄습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 마음이 교만해졌다’. 직역하면 ‘그의 마음이 높아졌다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들을 없애려고’. 그리스어는 ‘그들을 제거하다’라고 말하며, 문맥상 폭력적 제거를 뜻할 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὑψώθη ἡ καρδία αὐτοῦ
  english_pob_choice: his heart was lifted up
  chosen_korean: 그의 마음이 높아져
  alternatives_korean:
  - 그의 마음이 교만해져
  - 그의 마음이 높여져
  lexicon: LSJ
  rationale: 그리스어 관용구의 상승 이미지를 살리면서, 문맥상 교만의 의미도 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: κατακρατῆσαι τῆς χώρας
  english_pob_choice: to seize control of the country
  chosen_korean: 그 땅을 장악하려 했으며
  alternatives_korean:
  - 그 지역을 장악하려 했으며
  - 그 나라를 차지하려 했으며
  lexicon: LSJ
  rationale: κατακρατέω의 지배·장악 의미를 살리되, χώρα를 정치적·영토적 맥락에서 자연스러운 한국어로 옮겼습니다.
- source_word: ἐβούλευετο δόλῳ
  english_pob_choice: he was plotting deceitfully
  chosen_korean: 속임수로 … 음모를 꾸몄습니다
  alternatives_korean:
  - 간계로 … 꾀했습니다
  - 속여서 … 꾀했습니다
  lexicon: LSJ
  rationale: 지속적이고 악의적인 계획을 나타내는 문맥이므로 ‘음모를 꾸미다’로 옮기고, δόλῳ는 수단을 나타내는 말로 ‘속임수로’ 처리했습니다.
- source_word: ἆραι αὐτούς
  english_pob_choice: to remove them
  chosen_korean: 그들을 제거하려고
  alternatives_korean:
  - 그들을 없애려고
  - 그들을 없애 버리려고
  lexicon: LSJ
  rationale: αἴρω의 기본 의미는 ‘치우다/제거하다’이지만, 적대적 문맥상 해악을 내포하므로 한국어도 과도하게 완곡하지 않게 옮겼습니다.
theological_decisions:
- issue: 본문의 폭력적 의도 표현
  chosen_reading: ‘제거하려고’로 옮겨, 단순한 축출이 아니라 해악을 수반할 수 있는 의도를 드러냈습니다.
  alternative_readings:
  - ‘없애려고’
  - ‘죽이려고’
  rationale: 그리스어는 문자적으로 ‘옮기다/제거하다’에 가깝지만, 문맥상 적대적 제거를 뜻합니다. 다만 본문이 명시적으로 살해 방법을 적지는 않으므로 지나친 특정화는 피했습니다.
  doctrine_reference: 역사서의 서술적 절제와 문맥 기반 번역 원칙
