  text: And he ran on ahead and reported to John in Gazara that his father and his brothers had perished[a], and that he had sent men to kill you also.
  footnotes:
  - marker: a
    text: Or, more literally, 'and that he has sent also you to be killed.' The Greek leaves the implied object of 'sent' unstated; English supplies 'men' for clarity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 앞서 달려 가자라의 요한에게 가서, 그의 아버지와 형제들이 죽었으며[a], 또한 자기를 죽이도록 사람을 보냈다고 알렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘또 당신을 죽이도록 보냈다’입니다. 그리스어는 ‘보냈다’의 목적어를 직접 말하지 않으므로 영어는 명확성을 위해 ‘men’을 보탰습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προδραμὼν
  english_pob_choice: ran on ahead
  chosen_korean: 앞서 달려
  alternatives_korean:
  - 앞질러 달려
  - 달려 앞서
  lexicon: LSJ
  rationale: 앞서 달려는 서둘러 먼저 나아간다는 동작과 긴박함을 함께 살려, 단순한 선행보다 원문의 움직임을 더 자연스럽게 옮깁니다.
- source_word: ἀπήγγειλεν
  english_pob_choice: reported
  chosen_korean: 알렸습니다
  alternatives_korean:
  - 보고했습니다
  - 전했습니다
  - 보고하였습니다
  lexicon: BDAG
  rationale: 사신이 전달하는 메시지의 성격을 살리면서도 현대 한국어에서 자연스럽고 과도하게 공문체로 치우치지 않게 합니다.
- source_word: ἀπώλετο
  english_pob_choice: had perished
  chosen_korean: 죽었으며
  alternatives_korean:
  - 멸망했으며
  - 숨졌으며
  - 죽임을 당했으며
  lexicon: BDAG
  rationale: 본문은 폭력적 죽음을 말하지만 동사 자체는 결과를 간결히 진술하므로, ‘죽었습니다’ 계열이 가장 직접적입니다. 한국어에서는 과거 완료의 뉘앙스를 문맥상으로 충분히 전달할 수 있습니다.
- source_word: Ἀπέσταλκεν καὶ σὲ ἀποκτεῖναι
  english_pob_choice: he had sent men to kill you also
  chosen_korean: 자기를 죽이도록 사람을 보냈다고
  alternatives_korean:
  - 당신도 죽이려고 사람을 보냈다고
  - 당신을 죽이도록 보냈다고
  - 당신을 죽이게 하려고 사람을 보냈다고
  lexicon: BDAG
  rationale: 그리스어는 ‘보내다’의 목적이 뒤의 부정사에 의해 드러나며, 영어 POB처럼 ‘사람들’이 함축되어 있습니다. 한국어는 그 함축을 살려 ‘사람을 보냈다’로 옮기되, 목적은 ‘죽이도록’으로 풀어 자연스럽게 표현했습니다.
