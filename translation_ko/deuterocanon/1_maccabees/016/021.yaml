    rationale: 그리스어 σέ는 요한을 가리키는 2인칭 목적어입니다. 한국어 재귀대명사 ‘자기’는 주절 주어인 전달자를 가리키기 쉬워 원문의 표적을 바꿉니다.
  - severity: medium
    issue: ‘가자라의 요한에게 가서’가 이동을 중복·첨가할 수 있음
    rationale: προδραμών은 전달자가 앞서 달려간 동작이고, εἰς Γάζαρα는 요한이 있는 장소를 나타냅니다. ‘가자라에 있는 요한에게’가 관계와 장소를 더 정확히 드러냅니다.
  - severity: medium
    issue: 각주의 언어 및 앵커 불일치
    rationale: 한국어 번역 각주에 영어 ‘men’을 언급하고 있으며, 내용은 ‘보냈다’의 생략 목적어에 관한 것인데 표지가 ‘죽었으며’ 뒤에 놓여 있습니다. 한국어로 고치고 해당 절 뒤로 옮겨야 합니다.
