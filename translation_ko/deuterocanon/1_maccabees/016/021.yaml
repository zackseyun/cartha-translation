review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘자기를’는 문법상 전달자 자신을 가리키므로, 수신자인 요한(그리스어 σέ)을 죽이려 한다는 원문 뜻을 바꿉니다. 또한 ‘가자라의 요한에게 가서’는 전달자가 요한에게 실제로 갔다는 뜻을 덧붙일 수 있습니다. 원문은 앞서 달려가 가자라에 있는 요한에게 소식을 알렸다고 말합니다.
  naturalness: ‘앞서 달려가’, ‘가자라에 있는 요한에게’, ‘알렸습니다’는 현대 표준 한국어 합쇼체에서 자연스럽습니다. ‘요한도 죽이려고 사람들을 보냈다’는 긴박한 보고의 문맥을 매끄럽게 전달합니다.
  terminology: 인명 ‘요한’과 지명 ‘가자라’는 일관되게 유지했습니다. ἀπώλετο는 사망의 방식 자체를 동사가 특정하지 않으므로 ‘죽었다’로 중립적으로 옮겼습니다. ἀπέσταλκεν의 목적어는 그리스어에 명시되지 않았지만, 한국어의 자연스러운 표현을 위해 문맥상 함축된 ‘사람들’을 보충하고 각주로 밝혔습니다.
  issues:
