review_pass:
  verdict: revise
  source_fidelity: 원문의 주어 전환을 보존해야 합니다. ἐπέλεξεν은 ‘그가 선발했다’이고, 이어지는 복수형 ἐπορεύθησαν 및 ἐκοιμήθησαν은 선발된 군대가 ‘진군하고 야영했다’는 뜻입니다. 초안의 ‘진군하게 했습니다’는 원문에 없는 사역 의미를 더합니다.
  naturalness: ‘전투에 나설 만한 사람’은 πολεμιστῶν의 직접적 군사 명칭보다 완곡하며, ‘전투병’이 더 간결하고 자연스럽습니다. ‘야영했습니다’는 군사 서술에 자연스럽고 합쇼체 문체에도 맞습니다.
  terminology: ἱππεῖς는 ‘기병’으로 적절합니다. Κενδεβαῖον은 목적어를 취해 ‘켄데바이오스를 치러’로 옮기면 ἐπί+대격의 적대적 방향을 자연스럽게 반영합니다. 지명은 영어 POB의 Modein 및 널리 쓰이는 한국어 표기에 맞춰 ‘모데인’으로 통일합니다.
  issues:
  - severity: high
    issue: ‘켄데바이오스에게로 진군하게 했습니다’가 사역 구문으로 번역됨
    rationale: 그리스어 ἐπορεύθησαν은 복수 능동 의미로, 군대가 직접 진군했다는 뜻입니다. ‘하게 했다’는 지휘·사역 행위를 추가합니다.
  - severity: medium
    issue: ‘전투에 나설 만한 사람’이 πολεμιστῶν을 완곡하게 처리함
    rationale: 원문은 ‘싸우는/전투하는 남자들’을 명시하므로 군사 집단 명칭인 ‘전투병’이 의미를 더 직접적으로 전달합니다.
  - severity: low
    issue: 지명 표기가 영어 POB의 Modein과 불일치함
    rationale: ‘모데인’은 Modein에 대응하며 한국어 성서·역사 서술에서도 더 알아보기 쉬운 표기입니다.
