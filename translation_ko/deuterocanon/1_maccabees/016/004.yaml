  text: And he selected from the country twenty thousand fighting men and horsemen[a], and they marched against Kendebaios, and camped in Modein.
  footnotes:
  - marker: a
    text: Or, more literally, 'slept in Modein'; in this military context the sense is that they camped there for the night.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그 땅에서 전투에 나설 만한 사람과 기병 이만 명을 뽑아, 켄데바이오스에게로 진군하게 했습니다. 그들은 모대임에 진을 치고 밤을 지냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘모대임에서 잠들었다’이지만, 여기서는 군사적 문맥상 그곳에 야영했다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέλεξεν
  english_pob_choice: selected
  chosen_korean: 뽑아
  alternatives_korean:
  - 선택하여
  - 선발하여
  lexicon: LSJ
  rationale: 군사적 문맥에서 다수 가운데 전투 인원을 가려 뽑는 뜻이므로, 현대 한국어로는 간결한 ‘뽑아’가 가장 자연스럽고 원문의 선별성을 살립니다.
- source_word: εἴκοσι χιλιάδας ἀνδρῶν πολεμιστῶν
