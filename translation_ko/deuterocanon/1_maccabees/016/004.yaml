  lexicon: LSJ
  rationale: ἀνδρῶν과 πολεμιστῶν의 중첩된 군사성을 살리면서도, 현대 한국어에서 남성 명사를 어색하게 누적하지 않도록 ‘전투에 나설 만한 사람’으로 옮겼습니다.
- source_word: ἱππεῖς
  english_pob_choice: horsemen
  chosen_korean: 기병
  alternatives_korean:
  - 말 탄 사람들
  - 말탄 전사들
  lexicon: LSJ
  rationale: ἱππεῖς는 문자적으로는 ‘말 탄 사람들’이지만, 군사 편제 용어로는 ‘기병’이 한국어에서 가장 정확하고 읽기 쉽습니다.
- source_word: ἐπορεύθησαν ἐπὶ τὸν Κενδεβαῖον
  english_pob_choice: they marched against Kendebaios
  chosen_korean: 켄데바이오스에게로 진군하게 했습니다
  alternatives_korean:
  - 켄데바이오스를 향해 행군하게 했습니다
  - 켄데바이오스를 치러 나아가게 했습니다
  lexicon: LSJ
  rationale: ἐπί + 대격의 적대적 이동을 반영해 단순한 ‘가다’보다 군사적 압박이 드러나는 ‘진군하다’를 택했습니다.
- source_word: ἐκοιμήθησαν
  english_pob_choice: camped
  chosen_korean: 진을 치고 밤을 지냈습니다
  alternatives_korean:
  - 야영했습니다
  - 숙영했습니다
  lexicon: LSJ
  rationale: 직역하면 ‘잠들다’이지만, POB 주석처럼 군사 상황에서는 야간 숙영을 뜻하므로 ‘진을 치고 밤을 지냈습니다’로 풀어 의미를 분명히 했습니다.
