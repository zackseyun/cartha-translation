  rationale: 적을 적극적으로 뒤쫓는 뉘앙스를 살리기 위해 ‘추격하다/쫓다’를 결합해 서술했습니다.
- source_word: ἕως ἐλθεῖν εἰς Κεδρών
  english_pob_choice: until he came to Kedron
  chosen_korean: 케드론에 이를 때까지
  alternatives_korean:
