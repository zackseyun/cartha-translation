  yaml_path: translation/deuterocanon/1_maccabees/016/009.yaml
  text: Then Judas[a], the brother of John, was wounded; but John pursued them until he came to Kedron[b], which he had built.
  footnotes:
  - marker: a
    text: Or 'Cedron.' The Greek place name Κεδρών may be represented in English with either K or the traditional Latinized C.
    reason: lexical_alternative
  - marker: b
    text: The clause 'which he had built' most naturally refers to Kedron as a place previously built by John, though the Greek does not expand the antecedent further.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 요한의 형제 유다가 부상을 입었습니다. 그러나 요한은 케드론, 곧 그가 세운 곳에 이를 때까지 그들을 추격했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘케드론’은 그리스어 Κεδρών의 직접 음역입니다. 전통적인 라틴화 형태로는 ‘세드론’이라고도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그가 세운 곳’은 케드론이라는 지명이 요한의 건축 행위와 연결된다고 보는 것이 가장 자연스럽지만, 그리스어는 그 선행사를 더 풀어 설명하지는 않습니다.
    reason: alternative_reading
