  lexicon: LSJ
  rationale: 장소를 새로 ‘세우다’는 의미를 간결하게 살리며, 한국어 성경 문체에서도 지명/거점을 세우는 표현으로 자연스럽습니다.
theological_decisions:
- issue: place-name transliteration for Κεδρών
  chosen_reading: 케드론
  alternative_readings:
