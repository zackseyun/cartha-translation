  source_fidelity: 그리스어의 사건 순서와 핵심 의미는 대체로 정확합니다. 다만 κατεδίωξεν은 한 번의 ‘추격하다’로 충분한데, 현 본문의 ‘추격하여 … 쫓았습니다’는 같은 행위를 중복하여 표현합니다. ἕως ἐλθεῖν의 주어는 요한으로 이해하는 것이 자연스럽고, 개정문은 이를 분명히 유지합니다. ἣν οἰκοδόμησεν은 케드론을 수식하며, ‘그가 세운 케드론’으로 옮길 수 있습니다.
  naturalness: 현 문장은 ‘추격하여 … 쫓았습니다’가 동의어를 겹쳐 현대 한국어 문장으로 다소 군더더기입니다. ‘케드론, 곧 그가 세운 곳에 이를 때까지 그들을 추격했습니다’는 관계절의 선행사와 요한을 모두 분명히 하면서도 합쇼체 서술에 자연스럽습니다.
