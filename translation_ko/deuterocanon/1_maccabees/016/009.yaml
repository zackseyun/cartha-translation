  rationale: 그리스어 Κεδρών의 음가를 직접 반영하는 형태를 택해, 본문이 특정 지명을 가리킨다는 점을 드러냈습니다. 전통적 음역 ‘기드론’은 다른 성경 지명과 혼동 소지가 있어 보류했습니다.
  doctrine_reference: proper noun transliteration consistency
