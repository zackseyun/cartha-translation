translation:
  language: ko
  text: 그리고 그는 큰 배신을 저질렀으며,[a] 선을 악으로 갚았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘큰 불신실함’ 또는 ‘신의에 대한 중대한 위반’으로 옮길 수 있습니다. 그리스어는 신뢰나 의무를 어기는 위반을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν ἀθεσίαν μεγάλην
  english_pob_choice: committed a great act of treachery
  chosen_korean: 큰 배신을 저질렀으며
  alternatives_korean:
  - 큰 불신실함을 행하였으며
  - 큰 불충을 저질렀으며
  - 큰 법어김을 저질렀으며
  lexicon: LSJ; BDAG
  rationale: ἀθεσίαν은 단순한 ‘법률 위반’보다 신뢰와 의무를 깨뜨리는 배신의 뉘앙스가 강하므로, 서사적 맥락을 살려 ‘배신을 저지르다’로 옮겼습니다. ἐποίησεν은 이와 결합해 ‘행하다’보다 ‘저지르다’가 더 자연스럽고 도덕적 무게도 잘 드러냅니다.
- source_word: μεγάλην
  english_pob_choice: great
  chosen_korean: 큰
  alternatives_korean:
  - 심각한
  - 중대한
  lexicon: BDAG
  rationale: 형용사의 강도는 한국어의 ‘큰’으로 충분히 전달되며, 뒤의 명사구가 이미 행위의 도덕적 성격을 분명히 합니다.
- source_word: ἀνταπέδωκεν κακὰ ἀντὶ ἀγαθῶν
  english_pob_choice: repaid evil for good
  chosen_korean: 선을 악으로 갚았습니다
  alternatives_korean:
  - 좋은 것에 대하여 악으로 갚았습니다
  - 은혜를 악으로 갚았습니다
  - 좋은 일에 악으로 보답했습니다
  lexicon: BDAG
  rationale: 대조 구조를 분명히 하기 위해 ‘선/악’으로 옮겼습니다. ἀντὶ ἀγαθῶν은 ‘good’의 단순 반복보다, 한국어에서 관용적인 반전 표현인 ‘선을 악으로 갚다’가 교환·보복의 의미를 더 선명하게 드러냅니다.
theological_decisions:
- issue: ἀθεσίαν의 의미 범위
  chosen_reading: ‘배신’으로 옮겨, 추상적 ‘불법/무법’보다 관계적·도덕적 파기라는 서술 의도를 살렸습니다.
  alternative_readings:
  - 법어김
  - 불신실함
  - 믿음 없음
  rationale: 문맥상 문제는 일반적 법률 위반이 아니라 신뢰와 의무를 깨뜨린 구체적 행위이므로, 독자가 사건의 윤리적 충격을 즉시 이해하도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 5
