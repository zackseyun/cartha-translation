  text: Now Simon was making a circuit of the cities in the country and taking care of their administration[a], and he went down to Jericho, he and Mattathias and Judas his sons, in the one hundred seventy-seventh year, in the eleventh month—that is, the month Shebat.
  footnotes:
  - marker: a
    text: 'Greek: ''the month Sabat''; rendered ''Shebat'' as a standard English transliteration of the month name.'
    reason: lexical_alternative
translation:
  language: ko
  text: 시몬은 그 땅에 있는 도시들을 순회하며 그 도시들의 행정을 돌보고 있었습니다. 시몬 자신과 그의 아들들인 마타디아스와 유다는 제177년 열한째 달, 곧 사밧월에 예리코로 내려갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사밧월’은 그리스어 Σαβάτ를 음역한 달 이름입니다.
    reason: source_note
