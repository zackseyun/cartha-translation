  lexicon: LSJ
  rationale: χώρᾳ의 ‘country/region’ 뜻을 자연스럽게 반영하되, 개별 도시들과 넓은 지방을 구분해 주는 표현으로 다듬었습니다.
- source_word: φροντίζω τὰς ἐπιμελίας αὐτῶν
  english_pob_choice: taking care of their administration
  chosen_korean: 그들의 행정을 돌보고
