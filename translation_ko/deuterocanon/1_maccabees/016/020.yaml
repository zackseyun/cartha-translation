  source_fidelity: 그리스어 καὶ ἑτέρους ἀπέστειλεν καταλαβέσθαι는 ‘그리고 그가 다른 이들을 보내어 장악/점령하게 했다’는 뜻이며, 초안의 핵심 의미는 이를 충실히 반영합니다. 다만 τὸ ὄρος τοῦ ἱεροῦ에서 ἱερόν은 이 문맥에서 성전(성전 구역)을 가리키므로, ‘성소의 산’보다 ‘성전 산’이 더 정확하고 통용되는 표현입니다.
