  text: And he himself and his people encamped opposite them; and when he saw the people afraid to cross the wadi[a], he crossed first, and the men saw him and crossed after him.
  footnotes:
  - marker: a
    text: Or 'the torrent' or 'the stream-bed'; the Greek term refers to a seasonal watercourse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그와 그의 백성은 그들 맞은편에 진을 쳤습니다. 그가 백성이 그 와디[a]를 건너기를 두려워하는 것을 보고 먼저 건넜고, 사람들은 그를 보고 그의 뒤를 따라 건넜습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘와디’는 계절성 물길이나 마른 개울바닥을 가리키는 지형 용어입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρενέβαλεν
  english_pob_choice: encamped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 캠프를 쳤습니다
  - 숙영했습니다
  - 주둔했습니다
  lexicon: LSJ
  rationale: 군사적 상황에서 ‘진을 치다’가 원문의 전투 배치를 가장 자연스럽고 정확하게 드러냅니다.
- source_word: κατὰ πρόσωπον αὐτῶν
  english_pob_choice: opposite them
  chosen_korean: 그들 맞은편에
  alternatives_korean:
  - 그들 앞에
  - 그들을 마주하고
  - 그들 앞쪽에
  lexicon: LSJ
  rationale: 상대편과 마주 선 위치를 나타내므로 ‘맞은편에’가 전술적 대비를 잘 살립니다.
- source_word: τὸν χειμάρρουν
  english_pob_choice: the wadi
  chosen_korean: 그 와디
  alternatives_korean:
  - 그 급류 계곡
  - 그 시내바닥
  - 그 계곡물
  lexicon: LSJ
  rationale: χείμαρρους는 계절성 물길을 가리키므로, 영어 POB의 선택을 따라 지형적 특성을 살린 ‘와디’를 유지하는 것이 적절합니다.
- source_word: κατόπισθεν αὐτοῦ
  english_pob_choice: after him
  chosen_korean: 그의 뒤를 따라
  alternatives_korean:
  - 그 뒤를 따라
  - 그 뒤에서
  - 그를 뒤따라
  lexicon: LSJ
  rationale: 단순한 시간적 ‘뒤에’보다, 실제로 그의 본을 따라 건넌 흐름을 드러내기 위해 ‘그의 뒤를 따라’로 옮겼습니다.
