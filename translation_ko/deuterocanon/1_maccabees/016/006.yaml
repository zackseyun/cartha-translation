  text: And he himself and his people encamped opposite them; and when he saw the people afraid to cross the wadi[a], he crossed first, and the men saw him and crossed after him.
  footnotes:
  - marker: a
    text: Or 'the torrent' or 'the stream-bed'; the Greek term refers to a seasonal watercourse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그와 그의 백성은 그들 맞은편에 진을 쳤습니다. 그가 백성이 그 와디를 건너기를 두려워하는 것을 보고 먼저 건넜고, 남자들은 그를 보고 그의 뒤를 따라 건넜습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘와디’는 계절성 물길이나 마른 개울바닥을 가리키는 지형 용어입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρενέβαλεν
  english_pob_choice: encamped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 캠프를 쳤습니다
