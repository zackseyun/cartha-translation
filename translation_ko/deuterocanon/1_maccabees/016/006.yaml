  - 그를 뒤따라
  lexicon: LSJ
  rationale: 단순한 시간적 ‘뒤에’보다, 실제로 그의 본을 따라 건넌 흐름을 드러내기 위해 ‘그의 뒤를 따라’로 옮겼습니다.
