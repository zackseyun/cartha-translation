  text: And Ptolemy wrote these things and sent word to the king that he should send him forces as help, and hand over their country and the cities.
translation:
  language: ko
  text: 그리고 프톨레마이오스는 이 일들을 기록하고, 왕에게 사람을 보내어 그에게 도움으로 쓸 군대와 그들의 나라와 도시들을 넘겨 달라고 했습니다.
  philosophy: formal
lexical_decisions:
- source_word: ἔγραψεν ταῦτα
  english_pob_choice: wrote these things
  chosen_korean: 이 일들을 기록하고
  alternatives_korean:
  - 이것들을 적고
  - 이 일들을 써서
  lexicon: γράφω
  rationale: ταῦτα를 지시대명사 그대로 살려 ‘이 일들’로 옮기고, 서술 행위는 문어체인 ‘기록하다’로 표현해 단순 필기보다 공식적 기록의 뉘앙스를 반영했습니다.
- source_word: ἀπέστειλεν τῷ βασιλεῖ
  english_pob_choice: sent word to the king
  chosen_korean: 왕에게 사람을 보내어
  alternatives_korean:
  - 왕에게 소식을 보내어
  - 왕에게 편지를 보내어
  lexicon: ἀποστέλλω
  rationale: 원문은 ‘보내다’와 수신자 여격만 주며 전달 수단을 특정하지 않으므로, 한국어에서는 자연스럽게 ‘사람을 보내어’로 풀어 전달 행위를 드러냈습니다.
- source_word: δυνάμεις εἰς βοήθειαν
  english_pob_choice: forces as help
  chosen_korean: 도움으로 쓸 군대
  alternatives_korean:
  - 도움을 위한 군대
  - 원조로 보낼 병력
  lexicon: δύναμις
  rationale: δυνάμεις는 여기서 군사적 ‘병력’을 가리키며, εἰς βοήθειαν은 목적/용도의 관계이므로 ‘도움으로 쓸’로 옮겨 문맥상 의도를 분명히 했습니다.
- source_word: παραδῷ τὴν χώραν αὐτῶν καὶ τὰς πόλεις
  english_pob_choice: hand over their country and the cities
  chosen_korean: 그들의 나라와 도시들을 넘겨 달라고
  alternatives_korean:
  - 그들의 땅과 도시들을 넘겨 달라고
  - 그들의 영토와 도시들을 넘겨 달라고
  lexicon: παραδίδωμι
  rationale: παραδῷ는 단순 ‘주다’보다 지배권 이전의 ‘넘겨주다/인도하다’에 가깝고, χώρα는 여기서 영토적·정치적 ‘나라’의 성격이 강해 ‘나라와 도시들’로 옮겼습니다.
