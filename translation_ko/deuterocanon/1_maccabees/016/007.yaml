  text: And he divided the people and the horsemen among the foot soldiers; but the cavalry of the enemy was very numerous.
translation:
  language: ko
  text: 그는 백성과 기병을 보병들 사이에 나누어 배치하였습니다. 그러나 적의 기병은 매우 많았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διεῖλεν
  english_pob_choice: divided
  chosen_korean: 나누어 배치하였습니다
  alternatives_korean:
  - 나누었습니다
  - 분배하였습니다
  - 갈라놓았습니다
  lexicon: LSJ
  rationale: 단순히 ‘나누다’의 의미를 살리되, 군사적 배치 맥락이 드러나도록 ‘나누어 배치하다’로 옮겼습니다. 영어 POB의 ‘divided’보다 조금 더 자연스럽게 전술적 배치를 전달합니다.
- source_word: τὸν λαόν
  english_pob_choice: the people
  chosen_korean: 백성
  alternatives_korean:
  - 사람들
  - 무리
  - 군사들
  lexicon: LSJ
  rationale: 직역하면 ‘백성’이지만, 이 문맥에서는 지휘 아래 있는 전투 집단을 가리키므로 너무 평이한 ‘사람들’보다 ‘백성’이 원문 어감을 더 잘 보존합니다.
- source_word: τοὺς ἱππεῖς / ἡ δὲ ἵππος
  english_pob_choice: the horsemen / the cavalry
  chosen_korean: 기병 / 기병
  alternatives_korean:
  - 말 탄 사람들 / 기병대
  - 말탄 군사들 / 기마부대
  lexicon: LSJ
  rationale: ἱππεῖς와 συλλεκτικός ἵππος는 모두 기마 전력을 가리키므로 한국어 군사어휘인 ‘기병’으로 일관되게 옮겼습니다. 앞절과 뒷절의 차이는 단수·복수보다 문맥상 집단성과 규모에 있습니다.
- source_word: ἐν μέσῳ τῶν πεζῶν
  english_pob_choice: among the foot soldiers
  chosen_korean: 보병들 사이에
  alternatives_korean:
  - 보병들 가운데
  - 보병들 한가운데
  - 보병들 속에
  lexicon: LSJ
  rationale: πεζῶν은 ‘보병’을 뜻하며, ‘사이에’는 기병을 보병 대열 속에 끼워 넣은 배치 관계를 자연스럽게 드러냅니다.
- source_word: πολλὴ σφόδρα
  english_pob_choice: very numerous
  chosen_korean: 매우 많았습니다
  alternatives_korean:
  - 대단히 많았습니다
  - 엄청나게 많았습니다
  - 매우 많은 편이었습니다
  lexicon: LSJ
  rationale: 수량의 많음을 강조하는 표현이므로 ‘매우 많았습니다’가 가장 간결하고 직설적으로 원문의 강도를 전달합니다.
