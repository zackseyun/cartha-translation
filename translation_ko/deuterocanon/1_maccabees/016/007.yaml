  terminology: ‘기병’과 ‘보병’은 적절하고 일관된 군사 용어입니다. τὸν λαόν을 ‘백성’으로 둔 것은 직역적 표현을 보존하며, 문맥상 군사 집단이라는 의미도 문장 전체에서 이해 가능합니다.
