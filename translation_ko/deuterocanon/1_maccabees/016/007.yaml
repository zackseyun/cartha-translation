  source_fidelity: 그리스어의 διεῖλεν(나누다/배치하다), τὸν λαόν(백성), ἱππεῖς(기병), ἐν μέσῳ τῶν πεζῶν(보병들 사이에), 그리고 적군 기병의 수적 우세를 충실히 반영합니다. ‘나누어 배치하였습니다’는 원문의 군사적 조직·배치 맥락을 자연스럽게 전달하면서도 전술의 세부를 과도하게 확정하지 않습니다.
