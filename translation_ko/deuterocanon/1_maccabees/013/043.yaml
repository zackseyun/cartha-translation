translation:
  language: ko
  text: 그때에 그는 가자를 향하여 진을 치고, 진영들로 그것을 에워쌌으며, 공성무기 하나를 만들어 그 도시까지 가져갔습니다. 그리고 한 망대를 쳐서 그것을 점령했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘공성무기’는 여기의 ἑλέποιν(helepolis)을 기능 중심으로 옮긴 것입니다. 원어는 특정한 공성 기계를 가리키며, 영어 본문도 이를 더 넓게 ‘siege engine’으로 처리합니다.
    reason: lexical_alternative
