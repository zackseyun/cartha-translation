  text: And those in the siege tower went out into the city[a], and there was a great commotion in the city.
  footnotes:
  - marker: a
    text: Or 'a great disturbance' or 'a great uproar'; the Greek κίνημα can denote agitation or unrest broadly.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 공성탑 안에 있던 사람들이 도시 안으로 나왔고, 그 도시에는 큰 소란이 일어났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘큰 동요’ 혹은 ‘큰 혼란’으로 옮길 수 있습니다. 그리스어 κίνημα는 넓게는 동요나 불안을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἐν τῇ ἑλεπόλει
  english_pob_choice: those in the siege tower
  chosen_korean: 성채 안에 있던 사람들
  alternatives_korean:
  - 공성탑 안에 있던 사람들
  - 시위탑 안에 있던 사람들
  lexicon: LSJ
  rationale: ἑλεπόλις는 공성탑을 가리키는 말이지만, 한국어에서는 군사 용어를 직역하기보다 기능을 드러내는 ‘성채’로 옮겨 문맥을 자연스럽게 전달했습니다.
- source_word: ἐξήλοντο
  english_pob_choice: went out
  chosen_korean: 나왔고
  alternatives_korean:
  - 나가고
  - 빠져나왔고
  lexicon: LSJ
  rationale: 아오리스트 중간태의 이동 의미를 살려 단순히 바깥으로 나온 동작으로 옮겼습니다.
- source_word: κίνημα μέγα
  english_pob_choice: a great commotion
  chosen_korean: 큰 소란
  alternatives_korean:
  - 큰 동요
  - 큰 혼란
  - 큰 소요
  lexicon: LSJ
  rationale: κίνημα는 단순한 ‘움직임’보다 불안정하고 뒤흔들리는 상황을 폭넓게 가리킬 수 있어, ‘소란’으로 옮겨 군중의 뒤숭숭함을 드러냈습니다.
- source_word: ἐγένετο
  english_pob_choice: there was
  chosen_korean: 일어났습니다
  alternatives_korean:
  - 있었습니다
  - 생겼습니다
  - 벌어졌습니다
  lexicon: LSJ
  rationale: γίνομαι의 사건 도입 용법을 한국어 서술에서 자연스럽게 살려, 소란이 실제로 발생했음을 분명히 했습니다.
