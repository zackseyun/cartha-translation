  yaml_path: translation/deuterocanon/1_maccabees/013/019.yaml
  text: And he sent the young men and the hundred talents[a], but he broke his word and did not release Jonathan.
  footnotes:
  - marker: a
    text: Or, 'he deceived him' or 'he acted falsely.' The Greek verb can denote deceit generally; here it specifically refers to failing to keep the promised terms after receiving the payment and hostages.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그 소년들과 백 달란트를 보냈지만, 약속을 어기고 요나단을 풀어주지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그를 속였다”, “거짓되게 행동했다”로도 옮길 수 있습니다. 이 동사는 일반적인 기만을 뜻할 수 있지만, 여기서는 대가와 인질을 받은 뒤 약속한 조건을 지키지 않은 데 초점이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ παιδάρια
  english_pob_choice: the young men / the boys
  chosen_korean: 그 소년들
  alternatives_korean:
  - 그 젊은이들
  - 그 아이들
  - 그 하인들
  lexicon: LSJ
  rationale: παιδάριον은 문맥에 따라 어린 소년이나 젊은 하인을 가리킬 수 있으나, 여기서는 인질로 보내진 대상이므로 연령 감각을 살린 '소년들'이 가장 자연스럽습니다.
- source_word: τὰ ἑκατὸν τάλαντα
  english_pob_choice: the hundred talents
  chosen_korean: 백 달란트
  alternatives_korean:
  - 한 백 달란트
  - 그 백 달란트
  lexicon: LSJ
  rationale: 숫자 표현은 한국어에서 자연스러운 '백 달란트'로 옮겨, 금액의 단위를 그대로 보존했습니다.
- source_word: διεψεύσατο
  english_pob_choice: broke his word
  chosen_korean: 약속을 어기고
  alternatives_korean:
  - 그를 속이고
  - 거짓으로 대하고
  - 말을 저버리고
  lexicon: LSJ
  rationale: 이 동사는 단순한 거짓말보다 약속 불이행과 기만을 함께 함축하므로, 문맥상 가장 직접적인 '약속을 어기고'가 적절합니다.
- source_word: οὐκ ἀφῆκεν
  english_pob_choice: did not release
  chosen_korean: 풀어주지 않았습니다
  alternatives_korean:
  - 놓아주지 않았습니다
  - 석방하지 않았습니다
  lexicon: BDAG
  rationale: 포로 상태의 요나단에게는 'release'보다 구어적이면서도 문맥에 맞는 '풀어주다'가 자연스럽습니다.
