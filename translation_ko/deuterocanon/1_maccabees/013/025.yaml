  yaml_path: translation/deuterocanon/1_maccabees/013/025.yaml
  text: And Simon sent and took the bones of Jonathan his brother[a], and buried him in Modein, the city of his fathers.
  footnotes:
  - marker: a
    text: Or 'the city of his ancestors.' The Greek literally reads 'the city of his fathers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 시몬은 사람을 보내어 자기 형제 요나단의 뼈를 가져다가, 그를 모데인에 있는 그의 조상들의 도시에 묻었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 조상들의 도시’입니다. 그리스어는 문자 그대로 ‘그의 아버지들의 도시’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  english_pob_choice: sent
  chosen_korean: 사람을 보내어
  alternatives_korean:
  - 보냈고
  - 보내었고
  lexicon: BDAG
  rationale: 그리스어는 ‘보내다’의 단순한 행위를 말하며, 누가 무엇을 보냈는지는 명시하지 않습니다. 한국어에서는 자연스럽게 보낸 대상을 보완하되, 영어보다 더 구체화하지 않기 위해 ‘사람을 보내어’로 옮겼습니다.
- source_word: τὰ ὀστᾶ
  english_pob_choice: the bones
  chosen_korean: 뼈를
  alternatives_korean:
  - 유해를
  - 시신을
  lexicon: BDAG
  rationale: 원문은 문자 그대로 ‘뼈들’이라고 말하므로, 그 구체성을 살려 ‘뼈를’로 옮겼습니다. ‘유해’는 매끄럽지만 원문의 직접성을 약화시킵니다.
- source_word: ἔθαψεν
  english_pob_choice: buried
  chosen_korean: 묻었습니다
  alternatives_korean:
  - 장사했습니다
  - 매장했습니다
  lexicon: BDAG
  rationale: 일반적인 매장 행위를 뜻하므로, 현대 한국어에서 직접적이면서도 품위 있는 ‘묻었습니다’를 택했습니다.
- source_word: πόλει τῶν πατέρων αὐτοῦ
  english_pob_choice: the city of his fathers
  chosen_korean: 그의 조상들의 도시
  alternatives_korean:
  - 그의 아버지들의 도시
  - 조상의 도시
  lexicon: BDAG
  rationale: 직역하면 ‘그의 아버지들의 도시’이지만, 한국어에서는 ‘아버지들’의 복수 표현이 다소 부자연스러워서, 혈연·조상 계보를 살리되 자연스러운 ‘조상들의 도시’로 옮겼습니다.
theological_decisions:
- issue: 유해를 다루는 서술의 직설성
  chosen_reading: ‘뼈를 가져다가… 묻었습니다’로 원문의 구체적·서술적 어조를 유지했습니다.
  alternative_readings:
  - ‘유해를 수습하여… 안장했습니다’
  - ‘시신을 거두어… 장사했습니다’
  rationale: 본문은 경건한 완곡어법보다 사건의 사실성을 강조합니다. 따라서 정서적으로 완화하지 않고 원문의 직접성을 보존했습니다.
  doctrine_reference: 성경 서술의 사실성 유지
