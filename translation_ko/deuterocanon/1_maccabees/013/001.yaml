  yaml_path: translation/deuterocanon/1_maccabees/013/001.yaml
  text: And Simon heard that Tryphon was gathering a large force to come into the land of Judah and destroy it[a].
  footnotes:
  - marker: a
    text: Or 'the land of Judea.' The Greek reads 'the land of Judah,' which may denote the territory historically associated with Judah rather than using later administrative terminology.
    reason: lexical_alternative
translation:
  language: ko
  text: 시몬은 트리폰이 유다 땅에 들어와 그것을 멸하려고 많은 군사를 모으고 있다는 소식을 들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '유대 땅'으로도 옮길 수 있습니다. 그리스어는 '유다 땅'이라고 되어 있어, 후대의 행정 용어보다 유다와 역사적으로 연관된 지역을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  english_pob_choice: heard
  chosen_korean: 소식을 들었습니다
  alternatives_korean:
  - 들었습니다
  - 알게 되었습니다
  - 전해 들었습니다
  lexicon: BDAG
  rationale: ἀκούω의 보고 수용 의미를 자연스럽게 살리면서, 뒤의 간접화법과 잘 어울리는 한국어 표현으로 옮겼습니다.
- source_word: συνῆγεν δύναμιν πολλὴν
  english_pob_choice: was gathering a large force
  chosen_korean: 많은 군사를 모으고 있다는
  alternatives_korean:
  - 큰 군대를 모으고 있다는
  - 많은 병력을 집결하고 있다는
  - 큰 힘을 모으고 있다는
  lexicon: BDAG
  rationale: 군사적 문맥의 δύναμις를 '군사'로 풀어, 단순한 추상적 '힘'보다 무장한 인원을 분명하게 드러냈습니다.
- source_word: γῆν Ἰούδα
  english_pob_choice: the land of Judah
  chosen_korean: 유다 땅에
  alternatives_korean:
  - 유다의 땅에
  - 유대 땅에
  - 유다 지역에
  lexicon: BDAG
  rationale: 그리스어의 직역적 지리 표현을 따라 '유다 땅'으로 옮겨, 후대 행정 구역인 '유대'와 구별했습니다.
- source_word: τοῦ ἐκτρῖψαι αὐτήν
  english_pob_choice: and destroy it
  chosen_korean: 그것을 멸하려고
  alternatives_korean:
  - 그것을 파괴하려고
  - 그것을 없애려고
  - 그것을 멸망시키려고
  lexicon: BDAG
  rationale: ἐκτρίβω의 강한 파괴·소멸 의미를 살리되, 한국어에서 자연스럽고 성경 문체에 어울리는 '멸하다'를 택했습니다.
theological_decisions:
- issue: 유다 땅의 지리명 표기
  chosen_reading: '''유다 땅''을 본문에 유지했습니다.'
  alternative_readings:
  - '''유대 땅''으로 표기'
  - '''유다의 땅''으로 완화'
  rationale: 본문의 γῆν Ἰούδα는 문자적으로 '유다 땅'이며, 이는 역사적으로 유다 지파와 연관된 지역을 가리키므로 후대 행정명칭인 '유대'로 평탄화하지 않았습니다.
  doctrine_reference: 역사-지리적 본문 충실성
