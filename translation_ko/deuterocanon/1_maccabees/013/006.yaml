  text: But I will take vengeance for my nation[a], and for the sanctuary, and for our women and children[c][b], because all the nations have gathered to wipe us out out of hatred.
  footnotes:
  - marker: a
    text: Or 'the holy things' or 'the holy places'; the Greek literally has 'the holy [things/places].'
    reason: lexical_alternative
  - marker: b
    text: Or 'our wives and children.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'for the sake of hatred' or 'because of enmity.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 나는 내 민족과 성소와 우리의 여인들과 자녀들을 위해 보복하겠습니다. 모든 민족이 우리를 증오하는 마음으로 우리를 멸하려고 모여들었기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 문자적으로 ‘거룩한 [것들/곳들]’입니다.
    reason: lexical_alternative
  - marker: b
    text: 문맥상 ‘우리의 아내들과 자녀들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 원문은 문자적으로 ‘증오를 위해’ 또는 ‘적대감 때문에’의 뜻입니다.
    reason: lexical_alternative
