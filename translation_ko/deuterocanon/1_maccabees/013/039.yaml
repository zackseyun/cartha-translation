  text: But we forgive you the oversights and the sins up to this present day[a], and the crown tax that you owed; and if anything else was being levied in Jerusalem[b], let it no longer be levied.
  footnotes:
  - marker: a
    text: Or 'errors done in ignorance' for 'oversights.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'the crown'; likely a royal levy or tax owed to the crown.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 우리는 오늘 이 시점까지의 부주의한 일들과 죄를[a], 그리고 여러분이 갚아야 했던 왕관 세금[b]을 용서합니다. 또 예루살렘에서 다른 어떤 것이라도 징수되고 있었다면, 더 이상 징수되지 않게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무지에서 나온 잘못들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘왕관’이지만, 여기서는 왕권에 속한 조세나 부과금을 가리키는 것으로 보입니다.
    reason: lexical_alternative
