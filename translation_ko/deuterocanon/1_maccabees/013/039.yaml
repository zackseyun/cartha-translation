    reason: lexical_alternative
  - marker: b
    text: Literally 'the crown'; likely a royal levy or tax owed to the crown.
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 우리는 오늘까지의 무지로 저지른 잘못들과 죄를[a], 그리고 여러분이 갚아야 했던 왕실 세금[b]을 용서합니다. 그 밖에 예루살렘에서 징수되던 것이 있다면, 더 이상 징수되지 않게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무지에서 나온 잘못들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘왕관’이지만, 여기서는 왕권에 속한 조세나 부과금을 가리키는 것으로 보입니다.
    reason: lexical_alternative
