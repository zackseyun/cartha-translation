  source_fidelity: 첫 절의 그리스어 ὅσα는 ‘무엇이든/모든 것’을 뜻하는 중성 복수 관계사로, 구체적 대상은 밝히지 않습니다. 초안의 ‘우리가 여러분과 맺은 것은’은 문맥상 가능하지만 ‘맺다’가 합의·협약을 다소 강하게 특정하며, ὅσα의 포괄성도 충분히 드러내지 못합니다. ‘여러분과 정해 둔 모든 것’은 외교·행정 문맥을 살리면서도 대상의 불명시성을 보존합니다. ἔστηκεν의 계속적 효력과 ὑπαρχέτω ὑμῖν의 계속된 소유 허가는 각각 ‘그대로 효력이 있으며’와 ‘여러분의 것으로 남을 것입니다’로 적절히 반영됩니다.
  naturalness: 개정문은 현대 표준 한국어의 공식적 문체로 자연스럽습니다. ‘그대로 효력이 있으며’는 협정이나 결정의 지속적 유효성을 나타내기에 알맞고, ‘요새들은 여러분의 것으로 남을 것입니다’도 공식 선언의 어조에 맞습니다.
