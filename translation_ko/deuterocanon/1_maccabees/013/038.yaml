  text: And whatever we established with you stands[a], and the strongholds that you built shall remain yours.
  footnotes:
  - marker: a
    text: Or 'whatever we established with you remains in force.' The Greek leaves the object of 'established' implicit; the translation supplies 'agreements' from the diplomatic context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 우리가 여러분과 맺은 것은 그대로 유효하며, 여러분이 세운 요새들은 여러분의 것으로 남을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '우리가 여러분과 맺은 어떤 것이라도 효력을 유지한다.' 그리스어는 '맺은 것'의 구체적 대상을 명시하지 않으므로, 문맥상 합의된 사항을 뜻한다고 풀이할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσα ἐστήσαμεν πρὸς ὑμᾶς
  english_pob_choice: whatever agreements we established with you
  chosen_korean: 우리가 여러분과 맺은 것은
  alternatives_korean:
  - 우리가 여러분과 정한 것은
  - 우리가 여러분과 확정한 것은
  - 우리가 여러분과 세운 것은
  lexicon: LSJ
  rationale: ὅσα는 여기서 구체 명사 없이 앞서 합의된 사항들을 가리키는 중성 복수 관계대명사로 보이며, 한국어에서는 자연스럽게 '맺은 것'으로 풀어 주는 것이 외교적 합의의 성격을 드러냅니다.
- source_word: ἔστηκεν
  english_pob_choice: stands
  chosen_korean: 그대로 유효하며
  alternatives_korean:
  - 서 있으며
  - 유지되며
  - 효력을 유지하며
  lexicon: LSJ
  rationale: 완료형 ἔστηκεν은 단순한 존재가 아니라 계속 유효함을 뜻하므로, 법적·외교적 문맥에 맞게 '그대로 유효하다'로 옮겼습니다.
- source_word: ὀχυρώματα
  english_pob_choice: strongholds
  chosen_korean: 요새들
  alternatives_korean:
  - 성채들
  - 성루들
  - 요새지들
  lexicon: LSJ
  rationale: ὀχυρώματα는 축성된 방어 시설을 가리키므로, 한국어에서는 본문의 군사적 실물을 드러내는 '요새들'이 가장 무난합니다.
- source_word: ὑπαρχέτω ὑμῖν
  english_pob_choice: shall remain yours
  chosen_korean: 여러분의 것으로 남을 것입니다
  alternatives_korean:
  - 여러분에게 속할 것입니다
  - 여러분의 소유로 남게 하십시오
  - 여러분의 것이 되게 하십시오
  lexicon: LSJ
  rationale: 명령형 같은 형태가 여기서는 소유권의 지속적 승인을 나타내므로, 단순 소유가 아니라 계속 보유함을 뜻하는 표현으로 옮겼습니다.
theological_decisions:
- issue: 조약/행정 문맥의 법적 효력 표현
  chosen_reading: 합의된 사항이 계속 유효하다는 뜻을 살려 문장을 법적 승인 선언처럼 번역했습니다.
  alternative_readings:
  - 단순히 '서 있다'로 직역
  - '''계속 남아 있다''로만 완화'
  rationale: 마카베오기 상권 13:38은 군사 점령이 아니라 협정 확인의 문맥이므로, 본문의 지속 효력을 한국어로 분명하게 드러내는 것이 적절합니다.
  doctrine_reference: 본문은 교리 진술보다 역사적-외교적 확증에 관한 표현입니다.
