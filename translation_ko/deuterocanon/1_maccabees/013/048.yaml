base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/048.yaml
  text: And he drove out from it every impurity[a], and settled in it men who practice the law, and fortified it[b], and built for himself a residence in it.
  footnotes:
  - marker: a
    text: Or 'every uncleanness' or 'every defilement.' The Greek can refer broadly to impurity, including ritual or moral contamination.
    reason: lexical_alternative
  - marker: b
    text: Or 'fortified it' simply; the compound verb may imply additional strengthening.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 그곳에서 모든 부정한 것을 쫓아내고[a], 율법을 행하는 남자들을 그 안에 정착시켰으며, 그곳을 더욱 요새화하고[b], 그 안에 자기를 위한 거처를 지었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 부정함’, ‘모든 더러움’, ‘모든 불결함’. 그리스어는 의례적 또는 도덕적 오염을 포함하는 넓은 의미로 쓰일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그곳을 요새화했다’. 접두사가 붙은 동사는 추가적인 강화의 뉘앙스를 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέβαλεν
  english_pob_choice: drove out
  chosen_korean: 쫓아내고
  alternatives_korean:
  - 몰아내고
  - 내쫓고
  lexicon: LSJ
  rationale: 강제로 제거하는 동작을 자연스러운 현대 한국어로 옮겼습니다. '쫓아내다'는 폭력적·결정적 제거의 의미를 잘 살립니다.
- source_word: ἀκαθαρσίαν
  english_pob_choice: impurity
  chosen_korean: 부정한 것
  alternatives_korean:
  - 부정
  - 더러움
  - 불결함
  lexicon: LSJ
  rationale: 이 단어는 의례적·도덕적·종교적 오염을 모두 포괄할 수 있으므로, 특정 범주로 좁히지 않기 위해 '부정한 것'으로 넓게 옮겼습니다.
- source_word: τὸν νόμον ποιοῦσιν
  english_pob_choice: who practice the law
  chosen_korean: 율법을 행하는 사람들
  alternatives_korean:
  - 율법을 지키는 사람들
  - 율법을 실행하는 사람들
  lexicon: LSJ
  rationale: ποιέω with νόμος의 지속적 실천 의미를 살리면서, 한국어에서 자연스럽고 성경적인 표현을 유지했습니다. '행하다'는 단순 준수보다 실제적 실천성을 드러냅니다.
- source_word: προσοχύρωσεν
  english_pob_choice: fortified it
  chosen_korean: 더 견고하게 만들고
  alternatives_korean:
  - 더 요새화하고
  - 더 튼튼하게 하고
  lexicon: LSJ
  rationale: 접두사가 붙은 동사이므로 단순한 '견고하게 했다'보다 강화의 뉘앙스를 반영했습니다. 다만 지나치게 군사적 용어로 굳히지 않기 위해 자연스러운 표현을 택했습니다.
- source_word: οἴκησιν
  english_pob_choice: residence
  chosen_korean: 거처
  alternatives_korean:
  - 주거
  - 집
  - 거주지
  lexicon: LSJ
  rationale: 자기 자신을 위한 실제 거주 공간을 가리키므로, 문맥상 가장 간결하고 자연스러운 '거처'로 옮겼습니다.
theological_decisions:
- issue: ἀκαθαρσία의 범위
  chosen_reading: 부정한 것
  alternative_readings:
  - 의례적 부정
  - 도덕적 부정
  - 더러움
  rationale: 본문은 제거된 오염의 성격을 규정하지 않으므로, 의례적·도덕적·공동체적 오염 가능성을 모두 열어 두는 번역이 원문의 긴장을 보존합니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
- issue: ἄνδρας의 성별 표지
  chosen_reading: 사람들
  alternative_readings:
  - 남자들
  rationale: 원문은 남성 복수를 사용하지만, 여기서는 공동체에 정착된 주민의 기능이 핵심이므로 한국어에서는 자연성을 위해 중립적 집합명사로 처리했습니다.
  doctrine_reference: DOCTRINE.md §4 Gender-accurate over gender-neutral
