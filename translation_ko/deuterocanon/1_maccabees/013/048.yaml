  rationale: 원문은 남성 복수를 사용하지만, 여기서는 공동체에 정착된 주민의 기능이 핵심이므로 한국어에서는 자연성을 위해 중립적 집합명사로 처리했습니다.
  doctrine_reference: DOCTRINE.md §4 Gender-accurate over gender-neutral
