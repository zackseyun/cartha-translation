  text: καὶ ἐξέβαλεν ἐξ αὐτῆς πᾶσαν ἀκαθαρσίαν, καὶ κατῴκισεν ἐν αὐτῇ ἄνδρας οἵτινες τὸν νόμον ποιοῦσιν καὶ προσοχύρωσεν αὐτήν, καὶ ᾠκοδόμησεν ἑαυτῷ ἐν αὐτῇ οἴκησιν.
