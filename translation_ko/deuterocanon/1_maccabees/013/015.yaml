  rationale: συνέχομεν은 문자적으로는 ‘붙들다/억누르다’이지만, 여기서는 왕실이 채무를 풀어 주는 맥락이므로 채무 면제의 뜻으로 처리하는 것이 문맥상 더 적절합니다.
theological_decisions:
- issue: 왕실 채무를 다루는 법정·행정 문맥의 표현 선택
  chosen_reading: 본문을 구속/면제의 행정적 선언으로 읽고, 도덕적 정죄 표현으로 바꾸지 않았습니다.
  alternative_readings:
  - 그에게 책임을 물었습니다
  - 그를 억류했습니다
  - 그에게서 빚을 탕감했습니다
  rationale: 문맥은 왕실 문서의 채무 처리이므로, 채무 부과가 아니라 해제·면제의 뉘앙스를 살리는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 문맥 우선 원칙; 역사서의 행정 문장 해석
- issue: διʼ ἃς εἶχεν χρείας의 의미 범위
  chosen_reading: ‘그가 맡았던 직무로 인한 필요’로 옮겨 개인적 필요보다 공적 기능을 드러냈습니다.
  alternative_readings:
  - 그가 가진 필요
  - 그가 지닌 의무
  - 그가 수행한 업무
  rationale: 헬라어 χρεία는 필요/용무/직무적 필요를 포괄하므로, 왕실 채무의 이유로서 가장 자연스러운 공적 기능을 드러내는 쪽을 택했습니다.
  doctrine_reference: 역사서 문맥의 어휘 범위 보존
