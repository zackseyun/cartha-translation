- source_word: συνέχομεν
  english_pob_choice: we have held him liable for it
  chosen_korean: 우리는 그에게서 그것을 면제해 주었습니다
  alternatives_korean:
  - 우리는 그를 그것에 묶어 두었습니다
  - 우리는 그에게 그것을 부과했습니다
  - 우리는 그에 대해 그것을 계속 요구했습니다
