base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/015.yaml
  text: As for the silver that your brother Jonathan owed to the royal treasury because of the needs he had[b][a], we have held him liable for it.
  footnotes:
  - marker: a
    text: Or, 'because of the needs he had.' The Greek phrase can refer more broadly to needs, obligations, or official functions; the main text takes it in an administrative sense suited to the context of royal debt.
    reason: lexical_alternative
  - marker: b
    text: The Greek verb literally can mean 'hold fast' or 'constrain.' In this context it is understood as remitting or releasing the debt, since the speaker is granting Jonathan favor rather than imposing liability.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 형 요나단이 왕실 금고에 빚진 은은, 그가 맡았던 직무로 인한 필요 때문에 생긴 것이므로, 우리는 그에게서 그것을 면제해 주었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: χρεία는 ‘필요’ 외에도 ‘용무’, ‘의무’, ‘직무상의 필요’까지 가리킬 수 있습니다. 본문은 왕실 채무의 이유를 설명하는 행정적 문맥으로 읽었습니다.
    reason: lexical_alternative
  - marker: b
    text: συνέχομεν은 문자적으로 ‘붙들다’, ‘억누르다’라는 뜻이지만, 여기서는 채무를 해제하거나 면제하는 왕실 문맥으로 이해했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ ἀργυρίου
  english_pob_choice: As for the silver
  chosen_korean: 당신의 형 요나단이 왕실 금고에 빚진 은은
  alternatives_korean:
  - 은에 관해서는
  - 그 은에 관해서는
  - 요나단이 왕실에 진 은은
  lexicon: LSJ
  rationale: Περὶ는 문맥상 화제를 여는 표현이므로 한국어에서는 자연스럽게 화제 표지로 풀었고, ἀργυρίου는 문자적으로 ‘은’이지만 여기서는 금전 채무를 가리켜 ‘은’으로 유지했습니다.
- source_word: εἰς τὸ βασιλικόν
  english_pob_choice: to the royal treasury
  chosen_korean: 왕실 금고에
  alternatives_korean:
  - 왕실 재정에
  - 왕의 금고에
  - 왕실 재무에
  lexicon: LSJ
  rationale: 왕에게 속한 재정적 귀속을 가리키므로, 행정적 문맥을 살려 ‘왕실 금고’로 옮겼습니다.
- source_word: διʼ ἃς εἶχεν χρείας
  english_pob_choice: because of the needs he had
  chosen_korean: 그가 맡았던 직무로 인한 필요 때문에 생긴 것이므로
  alternatives_korean:
  - 그가 지닌 필요 때문에
  - 그가 가진 의무 때문에
  - 그가 맡은 직책 때문에
  lexicon: LSJ
  rationale: χρεία는 필요, 용무, 직무적 필요까지 아우를 수 있어 단순한 개인적 필요보다 왕실 관련 직무의 맥락을 살려 옮겼습니다.
- source_word: συνέχομεν
  english_pob_choice: we have held him liable for it
  chosen_korean: 우리는 그에게서 그것을 면제해 주었습니다
  alternatives_korean:
  - 우리는 그를 그것에 묶어 두었습니다
  - 우리는 그에게 그것을 부과했습니다
  - 우리는 그에 대해 그것을 계속 요구했습니다
  lexicon: LSJ
  rationale: συνέχομεν은 문자적으로는 ‘붙들다/억누르다’이지만, 여기서는 왕실이 채무를 풀어 주는 맥락이므로 채무 면제의 뜻으로 처리하는 것이 문맥상 더 적절합니다.
theological_decisions:
- issue: 왕실 채무를 다루는 법정·행정 문맥의 표현 선택
  chosen_reading: 본문을 구속/면제의 행정적 선언으로 읽고, 도덕적 정죄 표현으로 바꾸지 않았습니다.
  alternative_readings:
  - 그에게 책임을 물었습니다
  - 그를 억류했습니다
  - 그에게서 빚을 탕감했습니다
  rationale: 문맥은 왕실 문서의 채무 처리이므로, 채무 부과가 아니라 해제·면제의 뉘앙스를 살리는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 문맥 우선 원칙; 역사서의 행정 문장 해석
- issue: διʼ ἃς εἶχεν χρείας의 의미 범위
  chosen_reading: ‘그가 맡았던 직무로 인한 필요’로 옮겨 개인적 필요보다 공적 기능을 드러냈습니다.
  alternative_readings:
  - 그가 가진 필요
  - 그가 지닌 의무
  - 그가 수행한 업무
  rationale: 헬라어 χρεία는 필요/용무/직무적 필요를 포괄하므로, 왕실 채무의 이유로서 가장 자연스러운 공적 기능을 드러내는 쪽을 택했습니다.
  doctrine_reference: 역사서 문맥의 어휘 범위 보존
