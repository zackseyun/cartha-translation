  text: And those in the city went up onto the wall with their wives and children, having torn their garments, and they cried out with a loud voice, asking Simon to give them his right hand.
  footnotes:
  - marker: a
    text: Or, 'give them a pledge' or 'grant them terms of peace.' The Greek literally says 'give right hands,' an idiom for offering a pledge of good faith or peaceful terms.
    reason: lexical_alternative
  - marker: b
    text: Tearing one's garments was a customary sign of grief, distress, or urgent supplication.
    reason: cultural_note
translation:
  language: ko
  text: 성 안에 있던 사람들은 아내들과 자녀들을 데리고 성벽으로 올라와 자기들의 옷을 찢어 입고, 큰 소리로 외치며 시몬에게 자기들의 오른손을 달라고 요청했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘오른손들’을 주다로, 대개 화친이나 안전보장의 담보를 뜻하는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 옷을 찢는 행위는 통상 슬픔, 절박함, 간구를 나타내는 관습적 표지입니다.
    reason: cultural_note
