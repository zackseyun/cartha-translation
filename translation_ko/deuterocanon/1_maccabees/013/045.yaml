  rationale: 이 구절의 핵심은 군사적 항복/화친의 요구이지만, 그 표현 자체가 ‘오른손’이라는 구체적 이미지를 사용하므로 이를 본문에서 보존하는 편이 원문 충실성과 감사 가능성에 더 부합합니다.
