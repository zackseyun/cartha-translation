  text: 그리고 그는 아브살롬의 아들 요나단과 상당한 병력을 함께 욥바로 보내어, 그 안에 있던 사람들을 몰아내고 그곳에 머물렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
