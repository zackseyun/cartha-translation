  text: And Jonathan son of Absalom sent a considerable force with him to Joppa[a], and he drove out those who were in it and remained there.
  footnotes:
  - marker: a
    text: Greek literally, 'remained there in it.' The double locative likely emphasizes that he stayed in the city itself.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 요나단, 아삽살롬의 아들은 그와 함께 상당한 군대를 욥바로 보내어, 그 안에 있던 사람들을 몰아내고 거기 그대로 머물렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ἐκεῖ ἐν αὐτῇ로 ‘거기 그 안에’에 해당하는 이중 장소 표지를 사용하여, 그가 도시 자체 안에 머물렀음을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰωνάθαν τὸν τοῦ Ἀψαλώμου
  english_pob_choice: Jonathan son of Absalom
  chosen_korean: 요나단, 아삽살롬의 아들
  alternatives_korean:
  - 아삽살롬의 아들 요나단
  - 요나단, 아삽살롬의 아들
  lexicon: LSJ
  rationale: 원문은 인명 뒤에 속격으로 혈통 표지를 붙여 인물을 특정하므로, 한국어에서도 ‘아삽살롬의 아들’로 친연관계를 분명히 드러냈습니다.
- source_word: δύναμιν ἱκανὴν
  english_pob_choice: a considerable force
  chosen_korean: 상당한 군대
  alternatives_korean:
  - 충분한 군대
  - 꽤 많은 군대
  lexicon: LSJ
  rationale: δύναμις는 여기서 추상적 ‘힘’이 아니라 군사적 병력/전력을 가리키므로 ‘군대’로 옮겼고, ἱκανήν은 규모가 적지 않다는 뜻을 살려 ‘상당한’으로 옮겼습니다.
- source_word: ἐξέβαλεν τοὺς ἐν αὐτῇ ὄντας
  english_pob_choice: he drove out those who were in it
  chosen_korean: 그 안에 있던 사람들을 몰아내고
  alternatives_korean:
  - 그 안에 있던 자들을 내쫓고
  - 그곳에 있던 사람들을 쫓아내고
  lexicon: LSJ
  rationale: 원문은 그 도시에 ‘있던’ 이들을 폭넓게 지칭하므로, 정착 주민으로 한정하지 않고 ‘사람들’로 옮겨 범위를 보존했습니다.
- source_word: ἔμεινεν ἐκεῖ ἐν αὐτῇ
  english_pob_choice: remained there
  chosen_korean: 거기 그대로 머물렀습니다
  alternatives_korean:
  - 거기에 머물렀습니다
  - 그곳에 그대로 머물렀습니다
  lexicon: LSJ
  rationale: ἐκεῖ와 ἐν αὐτῇ의 이중 장소 표지는 POB처럼 중복된 위치성을 강조하므로, ‘거기 그대로’로 약하게 반영했습니다.
theological_decisions:
- issue: 군사 서술의 톤
  chosen_reading: 역사 서술의 단정한 군사 행동 묘사로 처리하고, 의미를 완화하지 않았습니다.
  alternative_readings:
  - 보다 중립적인 ‘보냈습니다’만으로 처리
  - ‘추격하여 쫓아냈다’처럼 해석을 덧붙임
  rationale: 원문 동사는 실제로 밀어내고 점거하는 행위를 말하므로, 본문이 가진 정치·군사적 긴장감을 그대로 살리는 것이 적절합니다.
  doctrine_reference: 역사서 본문 해석 원칙
- issue: 이중 장소 표현
  chosen_reading: ‘거기 그대로’로 두 번째 장소 표지를 약하게나마 살렸습니다.
  alternative_readings:
  - 단순히 ‘거기 머물렀습니다’
  - ‘그 안에 그대로 머물렀습니다’
  rationale: 그리스어의 ἐκεῖ ἐν αὐτῇ는 단순 반복을 넘어 성 안에 실제로 점유하며 머문다는 뉘앙스를 강화하므로, 한국어에서도 그 강조를 일부 반영했습니다.
  doctrine_reference: 본문 세부 강조 보존
