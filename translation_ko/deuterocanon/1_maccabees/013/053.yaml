  text: And Simon saw that John his son was a man[a], and he appointed him commander over all the forces; and he lived in Gazara.
  footnotes:
  - marker: a
    text: Gazara is the Greek form of the site more commonly known as Gezer.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 시몬은 자기 아들 요한이 장정임을 보고, 그를 모든 군대의 지휘관으로 세웠으며, 그가 가자르에서 살았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 가자르는 더 흔히 알려진 지명 게셀의 그리스어 형태입니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἀνὴρ ἐστίν
  english_pob_choice: was a man
  chosen_korean: 장정임을
  alternatives_korean:
  - 사내임을
  - 성년이 되었음을
  - 어른이 되었음을
  lexicon: LSJ
  rationale: 여기서는 단순한 생물학적 남성보다 성년의 군사적 자격을 드러내는 표현이므로, 현대 한국어에서 그 뉘앙스를 가장 자연스럽게 살리는 ‘장정’이 적절합니다.
- source_word: ἔθετο ἡγούμενον
  english_pob_choice: appointed commander
  chosen_korean: 지휘관으로 세웠으며
  alternatives_korean:
  - 임명하여 지휘하게 했으며
  - 지휘관으로 임명했으며
  - 우두머리로 세웠으며
  lexicon: LSJ
  rationale: ‘ἔθετο’의 임명 행위와 ‘ἡγούμενον’의 군사 지휘 역할을 함께 살려, 행정적이면서도 군사적인 임명을 ‘지휘관으로 세웠다’로 옮겼습니다.
- source_word: τῶν δυνάμεων πάσων
  english_pob_choice: over all the forces
  chosen_korean: 모든 군대의
  alternatives_korean:
  - 모든 병력의
  - 모든 군사력의
  - 온 군대의
  lexicon: LSJ
  rationale: δυνάμεις는 여기서 군사 부대를 가리키므로, 한국어에서는 자연스럽고 넓은 의미를 지닌 ‘군대’로 옮기되 ‘모든’으로 범위를 보존했습니다.
- source_word: ᾤκει ἐν Γαζάροις
  english_pob_choice: he lived in Gazara
  chosen_korean: 가자르에서 살았습니다
  alternatives_korean:
  - 가자라에서 살았습니다
  - 게셀에서 살았습니다
  - 가자라에 거주했습니다
  lexicon: LSJ
  rationale: 본문의 지명 형태를 따라 음역한 ‘가자르’를 본문에 두고, 지속적 거주를 나타내는 ᾤκει는 현대적이고 자연스러운 ‘살았습니다’로 옮겼습니다.
