  source_fidelity: 개정이 필요합니다. 원문의 마지막 동사 ᾤκει의 주어는 문맥상 요한이며, 한국어 초안의 ‘그가’는 시몬을 가리킬 수도 있어 모호합니다. 또한 Γαζάροις 및 영어 POB의 Gazara에 맞추어 지명 음역은 ‘가자라’가 더 적절합니다.
  naturalness: ‘장정’은 현대 표준어 성경 문맥에서 다소 낡고 병역·노동력 관련 의미를 연상시킬 수 있습니다. ‘성인이 된 것’이 ἀνὴρ의 성년·성숙의 의미를 자연스럽게 전달합니다.
  terminology: 군사적 ἡγούμενον과 δυνάμεων πάσων은 ‘모든 군대의 지휘관’으로 충실히 옮겨졌습니다. 본문의 그리스어 지명 형태는 ‘가자라’로 음역하고, 통용 지명 ‘게셀’은 각주로 제시합니다.
  issues:
