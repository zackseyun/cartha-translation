    issue: 마지막 절의 주어가 ‘그가’로 모호함
    rationale: 원문의 서술과 문맥은 요한의 가자라 거주를 가리키지만, 한국어에서는 바로 앞 주어인 시몬으로도 읽힐 수 있습니다. ‘요한은’으로 명시해야 합니다.
  - severity: low
    issue: 지명 음역 ‘가자르’
    rationale: 그리스어 Γαζάροις와 영어 POB 본문의 Gazara에 대응하는 한국어 음역은 ‘가자라’가 일관됩니다.
  - severity: low
