  text: And Simon saw that John his son was a man[a], and he appointed him commander over all the forces; and he lived in Gazara.
  footnotes:
  - marker: a
    text: Gazara is the Greek form of the site more commonly known as Gezer.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 시몬은 자기 아들 요한이 성인이 된 것을 보고, 그를 모든 군대의 지휘관으로 세웠으며, 요한은 가자라[a]에서 살았습니다.
  philosophy: optimal-equivalence
  footnotes:
