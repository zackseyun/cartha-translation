  text: And Simon built over the tomb of his father and his brothers[a], and he raised it high to be seen[b], with dressed stone at the back and at the front.
  footnotes:
  - marker: a
    text: Or 'in appearance'; the Greek phrase may describe the monument as visually impressive or striking to the eye.
    reason: lexical_alternative
  - marker: b
    text: Or 'with polished stone.' The Greek can denote stone that has been scraped smooth or otherwise finely worked.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 시몬은 아버지와 형제들의 무덤 위에 건축하고, 그것이 눈에 띄도록 높이 세웠으며, 뒤와 앞에는 다듬은 돌을 썼습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘겉보기에’로도 옮길 수 있습니다. 그리스어 구는 기념물이 시각적으로 두드러지거나 눈에 띄는 인상을 준다는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘다듬은 돌로’로도 옮길 수 있습니다. 그리스어는 긁어 매끈하게 하거나 정교하게 손질한 돌을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησεν
  english_pob_choice: built
  chosen_korean: 건축하고
  alternatives_korean:
  - 세우고
  - 지어
  lexicon: LSJ
  rationale: 무덤 위에 기념물을 세운다는 문맥에서 단순한 ‘지었다’보다 구조물을 올려 세우는 의미를 살리기 위해 ‘건축하고’를 택했습니다.
- source_word: ἐπὶ τὸν τάφον
  english_pob_choice: over the tomb
  chosen_korean: 무덤 위에
  alternatives_korean:
  - 무덤 위에 걸쳐
  - 무덤에
  lexicon: LSJ
  rationale: ἐπί + 대격의 위치 관계를 반영해, 장식물이 무덤의 위치를 덮거나 그 위에 놓인다는 뜻을 자연스럽게 나타냈습니다.
- source_word: ὕψωσεν αὐτὸν τῇ ὁράσει
  english_pob_choice: he raised it high to be seen
  chosen_korean: 그것이 눈에 띄도록 높이 세웠으며
  alternatives_korean:
  - 그것을 높이 들어 보이게 했으며
  - 그것을 높여서 보이게 했으며
  lexicon: LSJ
  rationale: τῇ ὁράσει를 단순한 ‘모양’이 아니라 시각적으로 두드러지게 된다는 결과로 이해해 ‘눈에 띄도록’으로 옮겼습니다.
- source_word: λίθῳ ξυστῷ
  english_pob_choice: with dressed stone
  chosen_korean: 다듬은 돌을 썼습니다
  alternatives_korean:
  - 매끈하게 손질한 돌을 썼습니다
  - 정제한 돌을 썼습니다
  lexicon: LSJ
  rationale: ξύστος의 ‘깎아 매끈하게 한’ 뜻을 반영하되, 건축 재료 표현으로 자연스러운 ‘다듬은 돌’이 가장 적절합니다.
theological_decisions:
- issue: τῇ ὁράσει의 의미 범위
  chosen_reading: 기념물이 물리적으로 높고 눈에 띄게 세워졌다는 뜻으로 옮겼습니다.
  alternative_readings:
  - ‘겉모습으로는’
  - ‘보기에는’
  - ‘외관상’
  rationale: 본문은 단순한 외양 평가보다 시각적으로 두드러진 기념비적 조성을 말하므로, ‘눈에 띄도록’이 가장 덜 해석적이면서도 자연스럽습니다.
  doctrine_reference: 문맥 중심 번역 원칙
- issue: 아버지와 형제들의 무덤에 대한 기념 행위
  chosen_reading: 장례 기념물의 건립으로 이해해 중립적으로 번역했습니다.
  alternative_readings:
  - 무덤을 장식했다
  - 묘비를 세웠다
  rationale: 본문은 정교한 기념 구조물의 설치를 묘사하지만, 묘비인지 기념관인지 특정하지 않도록 여지를 남겨야 합니다.
  doctrine_reference: 역사서 본문 해석 원칙
