  rationale: The revision corrects the Korean action verb to convey that the subject inflicted, rather than suffered, the great blow. It uses the natural term ‘왕관’ for the royal diadem and relocates both notes to their corresponding words. ‘그를 대신하여’ retains the replacement force of ἀντʼ αὐτοῦ without adding a merely temporal sense.
