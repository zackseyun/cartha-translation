  text: And he reigned in his place[a], and put on the crown of Asia[b], and inflicted a great blow on the land.
  footnotes:
  - marker: a
    text: Or 'the diadem' instead of 'the crown'; the Greek term refers specifically to the royal headband or emblem of kingship.
    reason: lexical_alternative
  - marker: b
    text: Or 'caused great devastation in the land.' The Greek says literally 'made a great blow/strike upon the land,' an idiom for severe harm or calamity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그를 대신하여 왕이 되었고, 아시아의 왕관[a]을 쓰고, 그 땅에 큰 타격[b]을 가했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘왕관’보다 더 문자적으로는 ‘디아뎀’이며, 왕권을 상징하는 머리띠 또는 표장을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그 땅에 큰 타격을 가했다’이며, 큰 해악이나 재앙을 뜻하는 관용적 표현일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβασίλευσεν ἀντʼ αὐτοῦ
  english_pob_choice: reigned in his place
  chosen_korean: 그의 뒤를 이어 왕이 되었고
  alternatives_korean:
  - 그의 자리를 이어 다스렸고
  - 그 대신 왕이 되었고
  lexicon: LSJ
  rationale: ἐβασίλευσεν은 단순히 통치했다기보다 왕권을 행사했다는 뜻이므로 ‘왕이 되었다’로 살리고, ἀντʼ αὐτοῦ는 계승·대체 관계를 드러내는 ‘그의 뒤를 이어’로 옮겼습니다.
- source_word: τὸ διάδημα τῆς Ἀσίας
  english_pob_choice: the crown of Asia
  chosen_korean: 아시아의 관
  alternatives_korean:
  - 아시아의 왕관
  - 아시아의 디아뎀
  lexicon: LSJ
  rationale: διάδημα는 왕권을 표시하는 머리장식이므로, 본문 이미지가 자연스럽게 전달되도록 ‘관’으로 옮기되 왕권의 상징성을 유지했습니다.
- source_word: ἐποίησεν πληγὴν μεγάλην
  english_pob_choice: inflicted a great blow
  chosen_korean: 큰 타격을 입혔습니다
  alternatives_korean:
  - 큰 상처를 입혔습니다
  - 큰 재앙을 가져왔습니다
  lexicon: LSJ
  rationale: πληγή는 문자적으로 ‘치기/타격’이지만 여기서는 정치·군사적 피해를 가리키는 관용적 표현이므로, 한국어로도 비유를 살린 ‘큰 타격’을 선택했습니다.
- source_word: ἐπὶ τῆς γῆς
  english_pob_choice: on the land
  chosen_korean: 땅에
  alternatives_korean:
  - 그 땅에
  - 그 나라에
  lexicon: LSJ
  rationale: γῆ는 문맥상 지역적 ‘땅/땅 위’를 뜻하므로, 과도한 해석을 피하고 가장 직접적인 ‘땅에’로 옮겼습니다.
