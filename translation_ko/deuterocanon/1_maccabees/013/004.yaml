  - 더 해석적으로 '희생되었다'로 처리
  rationale: 본문은 공동체를 위한 희생의 맥락을 말하지만, 그 희생의 구체적 결과를 흐리지 않는 것이 원문과 영문 POB의 'were destroyed'를 가장 잘 반영합니다.
