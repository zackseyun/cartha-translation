translation:
  language: ko
  text: 그리고 여러분 가운데 누구든지 우리 편 사람들 가운데 들어오기에 적합한 사람이 있으면, 그를 등록하십시오. 그리고 우리 사이에 평강이 있게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
