theological_decisions:
- issue: 등록과 평강의 병렬 구조
  chosen_reading: 편입 요청과 관계 회복을 함께 말하는 정치적 화해 공식으로 읽고, 과도한 영적 의미를 덧씌우지 않았습니다.
  alternative_readings:
  - 종교적 회심이나 신앙 공동체 가입으로만 제한하는 읽기
  - 단순한 외교 인사말로만 축소하는 읽기
  rationale: 그리스어 본문은 행정적 등록과 상호 평강을 병렬로 제시하므로, 정치적·사회적 화해의 의미를 보존하는 것이 본문의 힘을 가장 잘 드러냅니다.
  doctrine_reference: 1 Maccabees 13:40의 역사서적 문맥
- issue: ‘우리 편 사람들’의 공동체성
  chosen_reading: 단순한 지리적 근접이 아니라, 한 편에 속하는 집단 편입을 뜻하는 표현으로 처리했습니다.
  alternative_readings:
  - 중립적인 ‘우리 주변 사람들’로 번역하는 읽기
  - 혈연 공동체만 가리킨다고 제한하는 읽기
  rationale: 토쿼스 ‘τοὺς περὶ ἡμᾶς’는 문자적으로는 ‘우리 주변의 사람들’이지만, POB가 지적하듯 실제 의미는 소속 집단의 편입이므로 그 긴장을 한국어로 드러냈습니다.
  doctrine_reference: POB ot/lexical note on τοὺς περὶ ἡμᾶς
