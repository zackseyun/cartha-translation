  terminology: ἐπιτήδειοι는 ‘적합한 이들’로, 두 등록 관련 표현은 ‘등록되기에/등록되게’로 유지하는 것이 적절합니다. εἰρήνη는 이 정치적·상호 관계의 문맥에서 종교적 뉘앙스를 더할 수 있는 ‘평강’보다 ‘평화’가 중립적이고 정확합니다. τοὺς περὶ ἡμᾶς의 해석적 표현은 각주로 문자적 의미를 밝혀야 합니다.
