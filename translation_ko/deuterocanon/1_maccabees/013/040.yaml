translation:
  language: ko
  text: 그리고 여러분 가운데 우리 편 사람들의 명부에 등록되기에 적합한 이들이 있으면, 그들이 등록되게 하십시오. 우리 사이에는 평화가 있게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘우리 주변의 사람들 가운데’입니다. 여기서는 화자 측의 사람들 또는 공동체에 편입되는 뜻으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιτήδειοι
  english_pob_choice: fit
  chosen_korean: 적합한
  alternatives_korean:
  - 알맞은
  - 자격이 있는
  - 선정될 만한
  - 적당한
  lexicon: LSJ
  rationale: 행정적 문맥에서 ‘fit’이 뜻하는 실질적 적합성·자격을 자연스럽게 살리되, 법적 자격을 지나치게 단정하지 않기 위해 ‘적합한’으로 옮겼습니다.
- source_word: γράφῃναι / ἐγγραφέσθωσαν
  english_pob_choice: to be enrolled / let them be enrolled
  chosen_korean: 등록하십시오
  alternatives_korean:
  - 명부에 올리십시오
  - 기록하십시오
  - 입적시키십시오
  - 등재하십시오
  lexicon: LSJ
  rationale: 두 표현이 모두 행정적 ‘등록/명부 편입’의 의미를 반복하므로, 한국어에서는 중복을 줄이면서도 절차적 뉘앙스를 살려 ‘등록하십시오’로 통일했습니다.
- source_word: τοὺς περὶ ἡμᾶς
  english_pob_choice: among our people
  chosen_korean: 우리 편 사람들 가운데
  alternatives_korean:
  - 우리 주변에 있는 사람들 가운데
  - 우리 무리 가운데
  - 우리에게 속한 사람들 가운데
  lexicon: LSJ
  rationale: 직역하면 ‘우리 주위의 사람들’이지만, 문맥상 정치적·집단적 편입을 가리키므로 POB의 취지를 따라 소속 관계가 드러나는 표현으로 옮겼습니다.
- source_word: εἰρήνη
  english_pob_choice: peace
  chosen_korean: 평강
  alternatives_korean:
  - 평화
  - 화평
  - 평안
  lexicon: standard-biblical
  rationale: 본문의 관계적 화해 선언을 한국어 성경 용례에 맞게 ‘평강’으로 옮기되, 단순한 내적 평안보다 상호 간의 질서와 화목을 함께 담게 했습니다.
theological_decisions:
- issue: 등록과 평강의 병렬 구조
  chosen_reading: 편입 요청과 관계 회복을 함께 말하는 정치적 화해 공식으로 읽고, 과도한 영적 의미를 덧씌우지 않았습니다.
  alternative_readings:
  - 종교적 회심이나 신앙 공동체 가입으로만 제한하는 읽기
  - 단순한 외교 인사말로만 축소하는 읽기
  rationale: 그리스어 본문은 행정적 등록과 상호 평강을 병렬로 제시하므로, 정치적·사회적 화해의 의미를 보존하는 것이 본문의 힘을 가장 잘 드러냅니다.
  doctrine_reference: 1 Maccabees 13:40의 역사서적 문맥
- issue: ‘우리 편 사람들’의 공동체성
  chosen_reading: 단순한 지리적 근접이 아니라, 한 편에 속하는 집단 편입을 뜻하는 표현으로 처리했습니다.
  alternative_readings:
  - 중립적인 ‘우리 주변 사람들’로 번역하는 읽기
  - 혈연 공동체만 가리킨다고 제한하는 읽기
  rationale: 토쿼스 ‘τοὺς περὶ ἡμᾶς’는 문자적으로는 ‘우리 주변의 사람들’이지만, POB가 지적하듯 실제 의미는 소속 집단의 편입이므로 그 긴장을 한국어로 드러냈습니다.
  doctrine_reference: POB ot/lexical note on τοὺς περὶ ἡμᾶς
