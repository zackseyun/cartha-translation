  text: 온 이스라엘은 그를 두고 크게 애통하였으며, 여러 날 동안 그를 슬퍼하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어의 κόπτομαι와 κοπετός는 단순한 ‘슬픔’보다 애통과 곡을 나타내는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκοψαντο ... κοπετὸν μέγαν
  english_pob_choice: made great mourning
  chosen_korean: 크게 애통하였고
  alternatives_korean:
  - 크게 애도하였고
  - 크게 슬퍼하였고
  - 큰 통곡을 하였고
  lexicon: LSJ
  rationale: κόπτομαι/κοπετός의 관용적 ‘공적 애통’ 표현을 한국어로는 직접적인 관용구가 자연스러워 ‘애통하다’로 옮기되, 단순한 개인 감정보다 공동체적 상실의 강도를 살렸습니다.
- source_word: πᾶς Ἰσραήλ
  english_pob_choice: all Israel
  chosen_korean: 온 이스라엘
  alternatives_korean:
  - 모든 이스라엘
  - 이스라엘 온 백성이
  - 온 이스라엘 백성
  lexicon: LSJ
  rationale: 집합적 표현을 자연스럽게 살리면서도 전체 공동체를 가리키는 느낌을 유지하기 위해 ‘온 이스라엘’을 택했습니다.
- source_word: ἐπένθησαν
  english_pob_choice: they mourned
  chosen_korean: 그를 슬퍼하였습니다
  alternatives_korean:
  - 그를 애도하였습니다
  - 그를 애통해하였습니다
  - 그를 통곡하였습니다
  lexicon: LSJ
  rationale: 앞의 ‘애통’과 구별해, 뒤의 ἐπένθησαν은 지속적인 슬픔과 애도의 행위를 나타내므로 현대 문체에서 자연스러운 ‘슬퍼하다’로 옮겼습니다.
- source_word: ἡμέρας πολλὰς
  english_pob_choice: many days
  chosen_korean: 여러 날 동안
  alternatives_korean:
  - 많은 날 동안
  - 오랫동안
  - 여러 날에 걸쳐
  lexicon: LSJ
  rationale: 기간의 지속을 한국어로 매끈하게 드러내기 위해 ‘여러 날 동안’을 선택했습니다.
