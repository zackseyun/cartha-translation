  rationale: 앞의 ‘애통’과 구별해, 뒤의 ἐπένθησαν은 지속적인 슬픔과 애도의 행위를 나타내므로 현대 문체에서 자연스러운 ‘슬퍼하다’로 옮겼습니다.
- source_word: ἡμέρας πολλὰς
