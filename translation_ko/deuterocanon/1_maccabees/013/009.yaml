translation:
  language: ko
  text: 우리의 싸움을 싸우시고, 우리에게 말씀하시는 모든 것을 우리가 행하겠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολέμησον
  english_pob_choice: Fight
  chosen_korean: 싸우시고
  alternatives_korean:
  - 싸워 주시고
  - 전쟁해 주시고
  - 싸워 주십시오
  lexicon: LSJ
  rationale: 명령형의 긴박한 군사적 요청을 살리되, 한국어에서는 자연스럽게 ‘싸우다’로 옮겼습니다. 대상에게 직접 행동을 청하는 문맥이므로 공손한 청유형보다 요청형 연결을 택했습니다.
- source_word: τὸν πόλεμον ἡμῶν
  english_pob_choice: our battle
  chosen_korean: 우리의 싸움
  alternatives_korean:
  - 우리의 전쟁
  - 우리의 전투
  lexicon: LSJ
  rationale: πόλεμος의 기본 뜻을 살리면서도, 한국어에서는 ‘전쟁’보다 ‘싸움’이 보다 직접적이고 구체적인 호소를 전달합니다. 소유 대명사 ἡμῶν은 ‘우리의’로 분명히 반영했습니다.
- source_word: πάντα ὅσα ἐὰν εἴπῃς ἡμῖν
  english_pob_choice: everything that you tell us
  chosen_korean: 우리에게 말씀하시는 모든 것
  alternatives_korean:
  - 우리에게 말하시는 모든 것
  - 우리에게 말씀하실 모든 것
  - 우리에게 이르시는 모든 것
  lexicon: LSJ
  rationale: 조건적·포괄적 수용을 나타내는 구조를 한국어의 ‘~하시는 모든 것’으로 옮겨, 미래적 지시를 기다리는 뉘앙스를 살렸습니다. POB의 최신 영어를 따라 ‘everything’의 포괄성을 유지했습니다.
- source_word: ποιήσομεν
  english_pob_choice: we will do
  chosen_korean: 우리가 행하겠습니다
  alternatives_korean:
  - 우리가 하겠습니다
  - 우리가 따르겠습니다
  - 우리가 실행하겠습니다
  lexicon: LSJ
  rationale: 단순한 수행보다 명령 이행의 의지를 드러내기 위해 ‘행하다’를 택했습니다. 미래형으로 응답의 결단을 분명히 했습니다.
