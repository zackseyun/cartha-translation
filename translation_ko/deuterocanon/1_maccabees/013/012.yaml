  rationale: 원문의 서술은 군사 이동과 억류라는 사실을 함께 제시하므로, 두 요소를 모두 분명히 살려 독자가 사건의 긴장감을 이해하도록 했습니다.
  doctrine_reference: 역사서 본문 해석 원칙
