lexical_decisions:
- source_word: ἀπῆρεν
  english_pob_choice: set out
  chosen_korean: 떠나
  alternatives_korean:
  - 출발하여
  - 길을 나서
  lexicon: LSJ
  rationale: 군사적 이동 문맥에서 ἀπῆρεν은 단순한 떠남을 가리키므로, 목적지보다 출발 행위를 자연스럽게 드러내는 ‘떠나’로 옮겼습니다.
- source_word: μετὰ δυνάμεως πολλῆς
  english_pob_choice: with a large force
  chosen_korean: 큰 군대를 거느리고
  alternatives_korean:
  - 큰 병력을 거느리고
  - 막강한 무력을 가지고
  lexicon: LSJ
  rationale: δύναμις는 여기서 추상적 ‘힘’보다 병력의 의미가 분명하므로, 군사적 뉘앙스를 살려 ‘큰 군대’로 옮겼습니다.
- source_word: εἰσελθεῖν εἰς γῆν Ἰούδα
  english_pob_choice: to enter the land of Judah
  chosen_korean: 유다 땅으로 들어가려 하였고
  alternatives_korean:
  - 유다 땅에 들어가려 하였고
  - 유다 지역으로 침입하려 하였고
  lexicon: LSJ
  rationale: 그리스어는 목적을 나타내는 부정사이므로 ‘들어가려 하였고’로 자연스럽게 연결했고, ‘침입’은 본문 자체보다 강한 적대 뉘앙스를 더하므로 피했습니다.
- source_word: ἐν φυλακῇ
  english_pob_choice: in custody
  chosen_korean: 감금되어 있었습니다
  alternatives_korean:
  - 구금되어 있었습니다
  - 감시 아래 있었습니다
  - 감옥에 있었습니다
  lexicon: LSJ
  rationale: ἐν φυλακῇ는 ‘감옥’보다 더 넓게 ‘구금/감금 상태’를 뜻할 수 있어, 장면의 상태를 분명히 하면서도 장소를 과도하게 특정하지 않는 ‘감금되어 있었습니다’를 택했습니다.
