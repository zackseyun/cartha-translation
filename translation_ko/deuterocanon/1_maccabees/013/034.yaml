  yaml_path: translation/deuterocanon/1_maccabees/013/034.yaml
  text: And Simon chose men and sent them to Demetrius the king to grant remission to the land[a], because all the acts of Tryphon were acts of plundering.
  footnotes:
  - marker: a
    text: Or 'to grant remission to the land'; the Greek term can denote release or remission, likely in an administrative or fiscal sense here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 시몬은 사람들을 선택하여 데메트리우스 왕에게 보내어, 그 땅에 면제[a]를 주게 하였습니다. 이는 트뤼폰의 모든 행위가 약탈이었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅에 면제/감면을 주게 하다’. 여기의 그리스어는 행정적·재정적 면제를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπελέξατο
  english_pob_choice: chose
  chosen_korean: 선택하여
  alternatives_korean:
  - 뽑아
  - 골라
  lexicon: LSJ
  rationale: 중간태 ἐπελέξατο는 여기서 단순히 사람들을 고른다는 뜻이므로, 자연스러운 현대어인 ‘선택하여’로 옮겼습니다.
- source_word: ἄνδρας
  english_pob_choice: men
  chosen_korean: 사람들
  alternatives_korean:
  - 남자들
  - 사내들
  lexicon: LSJ
  rationale: 본문의 정치적 파견 대상은 대표단으로 읽히므로, 한국어에서는 성별을 과도하게 드러내지 않는 ‘사람들’이 문맥에 더 자연스럽습니다.
- source_word: τοῦ ποιῆσαι ἄφεσιν τῇ χώρᾳ
  english_pob_choice: to grant remission to the land
  chosen_korean: 그 땅에 면제를 주게 하다
  alternatives_korean:
  - 그 땅에 사면을 주게 하다
  - 그 땅에 탕감을 주게 하다
  - 그 땅에 구제를 주게 하다
  lexicon: LSJ
  rationale: ἄφεσις는 여기서 행정·재정적 완화, 곧 면제/감면의 의미가 가장 자연스러우므로, 의미를 드러내는 ‘면제’를 택했습니다.
- source_word: ἁρπασίαι
  english_pob_choice: acts of plundering
  chosen_korean: 약탈
  alternatives_korean:
  - 강탈
  - 침탈
  - 약탈 행위
  lexicon: LSJ
  rationale: πράξεις를 수식하는 술어적 명사로서 ἁρπασίαι는 폭력적 약탈을 가리키므로, 간결하게 ‘약탈’로 옮겼습니다.
theological_decisions:
- issue: ἄφεσις의 행정·재정적 의미 보존
  chosen_reading: ‘면제’로 번역해, 정치적 청원—특히 부담 완화나 세금/의무 면제의 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘용서’
  - ‘사면’
  - ‘감면’
  rationale: 문맥은 죄 사함이 아니라 통치권자에게 요청하는 행정적 완화이므로, 교회적·도덕적 용어로 오해될 수 있는 번역은 피했습니다.
  doctrine_reference: 역사서 문맥과 ἄφεσις의 행정적 용법
- issue: ἁρπασίαι의 폭력성 유지
  chosen_reading: ‘약탈’로 직역해 트뤼폰의 행위를 정당화 없이 부정적으로 규정했습니다.
  alternative_readings:
  - ‘강도질’
  - ‘침탈’
  rationale: 본문은 행위를 단순한 정권 교체가 아니라 폭력적 착취로 평가하므로, 완화하지 않고 강한 부정 평가를 유지했습니다.
  doctrine_reference: 본문의 역사적·정치적 판단
