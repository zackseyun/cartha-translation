  - 사내들
  lexicon: LSJ
  rationale: 본문의 정치적 파견 대상은 대표단으로 읽히므로, 한국어에서는 성별을 과도하게 드러내지 않는 ‘사람들’이 문맥에 더 자연스럽습니다.
- source_word: τοῦ ποιῆσαι ἄφεσιν τῇ χώρᾳ
  english_pob_choice: to grant remission to the land
  chosen_korean: 그 땅에 면제를 주게 하다
  alternatives_korean:
