  - 그 땅에 탕감을 주게 하다
  - 그 땅에 구제를 주게 하다
  lexicon: LSJ
  rationale: ἄφεσις는 여기서 행정·재정적 완화, 곧 면제/감면의 의미가 가장 자연스러우므로, 의미를 드러내는 ‘면제’를 택했습니다.
- source_word: ἁρπασίαι
  english_pob_choice: acts of plundering
  chosen_korean: 약탈
  alternatives_korean:
  - 강탈
  - 침탈
  - 약탈 행위
  lexicon: LSJ
  rationale: πράξεις를 수식하는 술어적 명사로서 ἁρπασίαι는 폭력적 약탈을 가리키므로, 간결하게 ‘약탈’로 옮겼습니다.
theological_decisions:
- issue: ἄφεσις의 행정·재정적 의미 보존
  chosen_reading: ‘면제’로 번역해, 정치적 청원—특히 부담 완화나 세금/의무 면제의 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘용서’
  - ‘사면’
  - ‘감면’
  rationale: 문맥은 죄 사함이 아니라 통치권자에게 요청하는 행정적 완화이므로, 교회적·도덕적 용어로 오해될 수 있는 번역은 피했습니다.
  doctrine_reference: 역사서 문맥과 ἄφεσις의 행정적 용법
- issue: ἁρπασίαι의 폭력성 유지
  chosen_reading: ‘약탈’로 직역해 트뤼폰의 행위를 정당화 없이 부정적으로 규정했습니다.
  alternative_readings:
  - ‘강도질’
  - ‘침탈’
  rationale: 본문은 행위를 단순한 정권 교체가 아니라 폭력적 착취로 평가하므로, 완화하지 않고 강한 부정 평가를 유지했습니다.
  doctrine_reference: 본문의 역사적·정치적 판단
