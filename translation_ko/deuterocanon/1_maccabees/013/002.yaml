lexical_decisions:
- source_word: ἔντρομος
  english_pob_choice: trembling
  chosen_korean: 떨며
  alternatives_korean:
  - 몸을 떨며
  - 전율하며
  lexicon: ἔντρομος
  rationale: 신체적 떨림과 심리적 동요를 함께 담되, 문맥상 자연스러운 현대 한국어로 간결하게 옮겼습니다.
- source_word: ἔκφοβος
  english_pob_choice: afraid
  chosen_korean: 두려워하는
  alternatives_korean:
  - 무서워하는
  - 겁먹은
  lexicon: ἔκφοβος
  rationale: English POB의 'afraid'를 따라 단순한 감정 상태를 직접적으로 표현했습니다.
- source_word: ἀνέβη εἰς Ἰερουσαλήμ
  english_pob_choice: he went up to Jerusalem
  chosen_korean: 예루살렘으로 올라가
  alternatives_korean:
