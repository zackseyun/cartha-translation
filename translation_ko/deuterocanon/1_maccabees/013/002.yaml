  - 예루살렘에 올라가
  lexicon: ἀναβαίνω
  rationale: 지리적 상승을 반영하는 '올라가'를 유지하여 예루살렘 순례/이동의 서술 감각을 살렸습니다.
- source_word: ἤθροισεν τὸν λαόν
  english_pob_choice: assembled the people
  chosen_korean: 백성을 모았습니다
  alternatives_korean:
  - 사람들을 모았습니다
  - 백성을 집결시켰습니다
  lexicon: ἀθροίζω
  rationale: 공동체 전체를 다시 모으는 행위를 자연스럽게 나타내는 '모았습니다'를 택했습니다.
