  rationale: 군사적 맥락의 παρεμβάλλω aorist는 ‘진을 치다/주둔하다’의 뜻이므로, 자연스럽고 군사적 뉘앙스를 살리기 위해 ‘진을 치다’를 택했습니다.
- source_word: ἐν Ἀδείδοις
