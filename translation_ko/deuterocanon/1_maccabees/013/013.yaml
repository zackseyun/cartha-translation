  lexicon: LSJ
  rationale: 군사적 맥락의 παρεμβάλλω aorist는 ‘진을 치다/주둔하다’의 뜻이므로, 자연스럽고 군사적 뉘앙스를 살리기 위해 ‘진을 치다’를 택했습니다.
- source_word: ἐν Ἀδείδοις
  english_pob_choice: at Adida
  chosen_korean: 아데이드스에
  alternatives_korean:
  - 아디다에
  - 아데이다에
  lexicon: 고유명사 음역
  rationale: 지명 Ἀδείδοις는 현대 한국어 음역으로 옮기되, 본문 흐름상 장소 부사격 ‘-에’를 사용했습니다.
- source_word: κατὰ πρόσωπον τοῦ πεδίου
  english_pob_choice: opposite the plain
  chosen_korean: 평야를 마주하고
  alternatives_korean:
  - 평야 맞은편에
  - 평야 앞에
  - 평야를 향하여
  lexicon: LSJ
  rationale: κατὰ πρόσωπον은 여기서 공간적 위치를 나타내므로, 단순한 ‘앞’보다 ‘마주하고/맞은편에’가 지형적 대치를 더 정확히 드러냅니다.
- source_word: δὲ
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 그리고
  - 또
  lexicon: LSJ
  rationale: 완강한 대조는 아니지만 서술 전환을 표시하므로, 한국어에서는 자연스러운 담화 연결어 ‘그러나’로 옮겼습니다.
