  rationale: 지명 Ἀδείδοις는 현대 한국어 음역으로 옮기되, 본문 흐름상 장소 부사격 ‘-에’를 사용했습니다.
- source_word: κατὰ πρόσωπον τοῦ πεδίου
  english_pob_choice: opposite the plain
  chosen_korean: 평야를 마주하고
  alternatives_korean:
