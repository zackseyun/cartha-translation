  - 평야 앞에
  - 평야를 향하여
  lexicon: LSJ
  rationale: κατὰ πρόσωπον은 여기서 공간적 위치를 나타내므로, 단순한 ‘앞’보다 ‘마주하고/맞은편에’가 지형적 대치를 더 정확히 드러냅니다.
- source_word: δὲ
