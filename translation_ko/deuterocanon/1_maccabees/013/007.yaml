  text: and the spirit of his people was rekindled when they heard these words;
translation:
  language: ko
  text: 그리고 그의 백성의 영은 이 말씀들을 들을 때에 다시 타올랐습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνεζωπύρισεν
  english_pob_choice: was rekindled
  chosen_korean: 다시 타올랐습니다
  alternatives_korean:
  - 다시 살아났습니다
  - 다시 불붙었습니다
  - 재점화되었습니다
  lexicon: LSJ
  rationale: 동사는 ‘다시 불을 지피다/되살리다’는 뜻으로, 여기서는 백성의 내적 기세가 다시 살아나는 이미지를 살리는 것이 자연스럽습니다. ‘타올랐습니다’는 수동적 결과와 불의 은유를 함께 담습니다.
- source_word: τὸ πνεῦμα
  english_pob_choice: the spirit
  chosen_korean: 영
  alternatives_korean:
  - 마음
  - 기운
  - 의욕
  lexicon: LSJ
  rationale: 본문은 직역하면 ‘영’이지만, 문맥상 공동체의 내적 결의와 활력을 가리킵니다. 그래도 은유를 지키기 위해 뜻풀이보다 ‘영’을 택했습니다.
- source_word: τοῦ λαοῦ αὐτοῦ
  english_pob_choice: of his people
  chosen_korean: 그의 백성의
  alternatives_korean:
  - 그 백성의
  - 그의 민족의
  lexicon: LSJ
  rationale: 소유를 나타내는 αὐτοῦ를 반영해 관계성을 살렸습니다. ‘백성’은 단순한 집단보다 인격적 소속감을 더 잘 드러냅니다.
- source_word: ἀκοῦσαι τῶν λόγων τούτων
  english_pob_choice: when they heard these words
  chosen_korean: 이 말씀들을 들을 때에
  alternatives_korean:
  - 이 말을 들었을 때
  - 이 말씀을 들을 때에
  - 이 말을 들으면서
  lexicon: LSJ
  rationale: 부정사 ἀκοῦσαι는 여기서 계기나 상황을 나타내므로 ‘~을 들을 때에’로 옮겼습니다. λόγοι는 앞선 발언을 가리키므로 ‘말씀들’이 가장 직접적입니다.
theological_decisions:
- issue: τὸ πνεῦμα의 의미를 심리적 ‘마음’으로 좁힐지 여부
  chosen_reading: 공동체의 내적 기세를 가리키되, 본문 표면의 ‘영’ 이미지를 유지했습니다.
  alternative_readings:
  - 마음이 북받쳤다
  - 사기가 올랐다
  - 용기가 되살아났다
  rationale: 본문은 결과적으로 용기와 결의의 회복을 뜻하지만, 원문은 ‘영’이라는 은유를 사용합니다. 의미를 풀어 쓰기보다 이미지와 효과를 함께 살리는 쪽이 본문의 힘을 더 잘 보존합니다.
  doctrine_reference: 본문 주해/표현 선택
