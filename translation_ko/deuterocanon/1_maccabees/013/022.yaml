  text: And Tryphon prepared all his cavalry to come; but on that night there was a very great snowfall[a], and he did not come because of the snow. So he broke camp and went into the Gilead region.
  footnotes:
  - marker: a
    text: 'Greek: ''into the Galaaditis/Gileaditis,'' that is, the region of Gilead.'
    reason: lexical_alternative
translation:
  language: ko
  text: 트리폰은 자기 모든 기병이 오도록 준비하였습니다. 그러나 그날 밤에는 눈이 매우 많이 내렸고, 그는 눈 때문에 오지 못하였습니다. 그래서 그는 진을 걷고 길르앗 지방으로 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 지명은 ‘갈라아디티스/길르앗티스’, 곧 길르앗 지역을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡτοίμασεν
  english_pob_choice: prepared
  chosen_korean: 준비하였습니다
  alternatives_korean:
  - 마련하였습니다
  - 예비하였습니다
  lexicon: LSJ
  rationale: 군사적 맥락에서 단순한 사전 준비를 자연스럽게 표현하되, 과도한 해석을 더하지 않기 위해 ‘준비하다’를 택했습니다.
- source_word: πᾶσαν τὴν ἵππον αὐτοῦ
  english_pob_choice: all his cavalry
  chosen_korean: 자기 모든 기병
  alternatives_korean:
  - 자기 모든 마병
  - 그의 모든 기병대
  lexicon: LSJ
  rationale: ἵππος의 군사적 집합 표현을 현대 한국어에서는 ‘기병’으로 옮기는 것이 가장 자연스럽고, ‘모든’으로 총동원을 살렸습니다.
- source_word: ἀπῆρεν
  english_pob_choice: broke camp
  chosen_korean: 진을 걷고
  alternatives_korean:
  - 출발하고
  - 떠나고
  - 철수하고
  lexicon: LSJ
  rationale: 이 동사는 단순 이동보다 군사적으로 진을 거두고 이동하는 뉘앙스가 있어, ‘진을 걷고’가 영어 POB의 ‘broke camp’와 원문의 상황을 잘 반영합니다.
- source_word: Γαλααδῖτιν
  english_pob_choice: the Gilead region
  chosen_korean: 길르앗 지방
  alternatives_korean:
  - 길르앗 지역
  - 갈라아디스
  lexicon: LSJ
  rationale: 그리스어의 지역명은 독자 이해를 위해 지명 음역형보다 의미역인 ‘길르앗 지방’으로 옮겼습니다.
theological_decisions:
- issue: 폭설로 인해 이동이 지연된 서술의 어조
  chosen_reading: 원문이 말하는 사실 관계—눈이 매우 많이 내려 트리폰이 오지 못했고, 결국 다른 곳으로 이동했다는 점—만 간결하게 반영했습니다.
  alternative_readings:
  - ‘갈 수 없었습니다’처럼 능력 부재를 강조하는 번역
  - ‘폭설로 발이 묶였습니다’처럼 관용적 재서술
  rationale: 그리스어는 불능 자체보다 ‘오지 못했다’는 결과와 ‘눈 때문에’라는 원인을 직접 말하므로, 인과를 유지하되 과장된 관용 표현은 피했습니다.
  doctrine_reference: 문학적 서술의 사실성 유지
