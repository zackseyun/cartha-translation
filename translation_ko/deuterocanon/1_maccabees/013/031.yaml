  lexicon: LSJ
  rationale: 동사의 직접적인 의미를 따라 과도한 법적·도덕적 뉘앙스를 덧붙이지 않고 평이한 서술형으로 옮겼습니다.
theological_decisions:
- issue: δόλῳ의 의미를 어떻게 살릴지
  chosen_reading: ‘속임수로’로 번역해, 행위의 방식이 명시적으로 불의하고 기만적이라는 점을 드러냈습니다.
  alternative_readings:
  - ‘기만으로’
  - ‘속여서’
  - ‘배신적으로’
  rationale: 본문은 단순한 이동이 아니라 기만적 행위를 함께 말하므로, 한국어에서도 도덕적 평가가 포함된 방식 부사를 유지하는 것이 원문의 힘을 보존합니다.
  doctrine_reference: 서사 본문의 직설적 묘사 원칙
- issue: μετὰ Ἀντιόχου의 관계를 어떻게 이해할지
  chosen_reading: 겉문자상 ‘안티오코스에게’로 옮기되, 적대 관계를 본문 밖에서 미리 주입하지 않았습니다.
  alternative_readings:
  - ‘안티오코스와 함께’
  - ‘안티오코스를 상대로’
  rationale: 그리스어는 동반을 뜻하지만, 전체 이야기에서는 적대적 결과가 드러납니다. 번역문은 현재 절의 표면 의미를 보존하고, 해석은 독자에게 맡기는 편이 더 안전합니다.
  doctrine_reference: 문맥 우선, 과잉 해석 절제
