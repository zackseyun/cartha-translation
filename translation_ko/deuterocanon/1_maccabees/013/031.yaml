  lexicon: LSJ
  rationale: μετά + 속격의 기본값인 동반/동행을 살리되, 문맥상 트리폰의 접근 대상이 안티오코스라는 점이 분명하므로 한국어에서는 자연스럽게 ‘안티오코스에게’로 정리했습니다.
- source_word: τοῦ βασιλέως τοῦ νεωτέρου
