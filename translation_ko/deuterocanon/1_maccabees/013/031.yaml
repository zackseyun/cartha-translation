  rationale: νεώτερος의 비교급 의미를 반영해 구별 표지로 기능하게 했습니다. 한국어에서는 이름 뒤에 덧붙는 설명구로 ‘어린 왕’을 택해 간결하게 처리했습니다.
- source_word: ἀπέκτεινεν
