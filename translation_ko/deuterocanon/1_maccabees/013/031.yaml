  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘속임수를 쓰며 다니고 있었고’는 진행 중인 과거 행동을 무리 없이 나타내며, 뒤의 죽임과 구별됩니다.
  terminology: 트리폰과 안티오코스의 음역은 적절합니다. ‘더 어린 왕’은 동일 이름의 다른 왕과 구별하는 원문의 비교급 표현을 보존합니다. ‘죽였습니다’는 ἀπέκτεινεν에 불필요한 법적 판단을 추가하지 않습니다.
