  lexicon: LSJ
  rationale: ἐπορεύετο의 진행상과 δόλῳ의 수단/방법을 함께 살려, 단순한 상태 진술보다 ‘속임수로 접근했다’는 서사적 흐름으로 옮겼습니다.
- source_word: μετὰ Ἀντιόχου
