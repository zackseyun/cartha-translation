review_pass:
  verdict: revise
  source_fidelity: τῶν χρειῶν은 ‘여러분에게 필요한 일들’이 아니라 행정 업무·사무를 맡은 관리들을 가리킵니다. 또한 γράφειν은 이들에게 ‘기록하다’가 아니라 편지를 보내거나 წერ을 준비가 되어 있다는 뜻입니다. 나머지 핵심 표현, 곧 금관, 종려 가지, 큰 평화, 면제의 폭넓은 의미는 유지할 수 있습니다.
  naturalness: ‘유대인의 민족’은 현대 한국어의 공식 문체에서도 부자연스러우므로 ‘유대 민족’으로 고쳤습니다. ‘큰 평화를 맺다’, ‘업무를 맡은 관리들에게 편지를 쓰다’, ‘면제를 허락해 주도록’은 합쇼체의 외교적 문맥에 맞는 자연스러운 표현입니다.
  terminology: πρεσβυτέροις는 공동체 지도자라는 문맥상 ‘장로들’로 유지했습니다. βαΐν은 ‘종려 가지’로, ἀφέματα는 세금으로 한정하지 않는 ‘면제’로 옮겼습니다. ‘면제’가 복수형 원문의 집합적 성격을 한국어에서 충분히 전달합니다.
  issues:
