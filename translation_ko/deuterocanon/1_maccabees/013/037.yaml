base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/037.yaml
  text: And to the elders and the nation of the Jews[a], greetings. We have received the gold crown and the palm branch that you sent[b], and we are ready to make great peace with you and to write to the officials in charge to grant you remissions.
  footnotes:
  - marker: a
    text: Or 'the palm frond' or 'the bough'; the Greek term denotes a palm branch used ceremonially or honorifically.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'grant you remissions' likely refers to administrative or fiscal exemptions, though the Greek itself does not specify the exact kind here.
    reason: cultural_note
translation:
  language: ko
  text: 유대 민족과 장로들에게 문안합니다. 우리는 여러분이 보내신 금관과 종려 가지를 받았으며,[a] 여러분과 큰 평화를 맺고, 업무를 맡은 관리들에게 여러분에게 면제를 허락해 주도록 편지를 쓸 준비가 되어 있습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘종려 가지’는 그리스어 βαΐν의 번역입니다. 이 말은 의례적 또는 명예적 용도로 쓰이는 종려나무 가지를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘면제’는 그리스어 ἀφέματα의 넓은 행정·재정적 의미를 살린 번역입니다. 본문은 면제의 정확한 종류를 밝히지 않으며, 세금 감면이나 다른 행정상의 면제를 가리킬 수 있습니다.
    reason: cultural_note
