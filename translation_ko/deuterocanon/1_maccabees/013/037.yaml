revisions:
- from: 그리고 장로들과 유대인의 민족에게 문안합니다. 우리는 여러분이 보내신 금관과 종려나무 가지를 받았으며, 여러분과 큰 평화를 이루고 여러분에게 필요한 일들을 맡은 관리들에게 여러분을 위한 면제들을 허락하도록 기록할 준비가 되어 있습니다.[a][b]
  to: 유대 민족과 장로들에게 문안합니다. 우리는 여러분이 보내신 금관과 종려 가지를 받았으며,[a] 여러분과 큰 평화를 맺고, 업무를 맡은 관리들에게 여러분에게 면제를 허락해 주도록 편지를 쓸 준비가 되어 있습니다.[b]
  rationale: 행정 담당 관리들을 가리키는 원문의 표현과 그들에게 편지를 쓰겠다는 동사를 정확히 반영하도록 문장을 고쳤습니다. 동시에 외교 서신의 격식, ‘큰 평화’의 강조, 그리고 ἀφέματα의 의도적인 폭넓음을 보존했습니다. 각 주석 표지는 해당 어휘가 나오는 위치에 배치했습니다.
