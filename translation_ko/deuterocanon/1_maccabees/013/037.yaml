    issue: ‘여러분에게 필요한 일들을 맡은 관리들’
    rationale: τοῖς ἐπὶ τῶν χρειῶν은 ‘필요한 일들을 맡은’ 관리들이 아니라 국가·행정의 업무 또는 사무를 담당한 관리들입니다. ‘여러분에게’는 뒤의 ὑμῖν에 속합니다.
  - severity: medium
    issue: ‘...허락하도록 기록할’
    rationale: γράφειν은 이 문맥에서 관리들에게 편지를 쓰거나 지시를 보내는 행위입니다. 한국어 ‘기록하다’는 단순히 문서에 적는다는 뜻이어서 외교·행정적 행위를 충분히 옮기지 못합니다.
  - severity: low
    issue: ‘유대인의 민족’
    rationale: ἔθνει Ἰουδαίων의 공식적 집단 호칭은 유지하되, 현대 표준 한국어에서는 ‘유대 민족’이 자연스럽습니다.
