base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/020.yaml
  text: And after these things Tryphon came to enter the city and wipe it out[a], and he encircled the road to Adora[b]; and Simon and his camp marched opposite him to every place where he went.
  footnotes:
  - marker: a
    text: Or 'blocked the road to Adora.' The Greek literally says 'encircled the road to Adora,' which may describe a military maneuver intended to cut off access.
    reason: lexical_alternative
  - marker: b
    text: Or 'marched alongside him' or 'advanced opposite him.' The Greek verb suggests Simon's force matched Tryphon's movements from place to place.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 뒤에 트리폰은 그 도시로 들어가 그것을 멸망시키려고 왔으며[a], 아도라로 가는 길을 둘러쌌습니다[b]. 그리고 시몬과 그의 군대는 그가 가는 곳마다 그와 맞서 나아갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아도라로 가는 길을 막았다.’ 그리스어는 문자적으로는 ‘아도라로 가는 길을 둘러쌌다’라고 말하며, 접근을 차단하는 군사적 기동을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그와 나란히 진군했다’ 또는 ‘그와 맞서 전진했다.’ 그리스어 동사는 시몬의 군대가 트리폰의 움직임에 맞추어 곳곳에서 대응했음을 시사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ταῦτα
  english_pob_choice: after these things
  chosen_korean: 그 뒤에
  alternatives_korean:
  - 그 일 후에
  - 그런 뒤에
  lexicon: LSJ
  rationale: 시간 전환을 자연스럽게 드러내되, 서술의 연속성을 살리기 위해 간결한 한국어 표현을 택했습니다.
- source_word: τοῦ ἐμβατεῦσαι εἰς τὴν πόλιν
  english_pob_choice: to enter the city
  chosen_korean: 그 도시로 들어가
  alternatives_korean:
  - 그 도시에 들어가
  - 그 도시로 침입하여
  lexicon: LSJ
  rationale: 목적 부정사의 기능을 살리면서도, 뒤의 파괴 의도는 다음 절에 맡기고 과도한 해석어를 피했습니다.
- source_word: ἐκτρῖψαι αὐτήν
  english_pob_choice: wipe it out
  chosen_korean: 그것을 멸망시키려고
  alternatives_korean:
  - 그것을 없애려고
  - 그것을 파괴하려고
  lexicon: LSJ
  rationale: 군사적 맥락에서 ἐκτρίβω의 강한 소멸 의미를 반영해, 단순 파괴보다 더 강한 ‘멸망’으로 옮겼습니다.
- source_word: ἐκύκλωσεν ὁδὸν τὴν εἰς Ἄδωρά
  english_pob_choice: he encircled the road to Adora
  chosen_korean: 아도라로 가는 길을 둘러쌌습니다
  alternatives_korean:
  - 아도라로 가는 길을 포위했습니다
  - 아도라로 가는 길을 막아섰습니다
  lexicon: LSJ
  rationale: 직역 이미지인 ‘둘러싸다’를 살리되 한국어에서 어색하지 않게 목적어를 앞세워 표현했습니다.
- source_word: ἀντιπαρῆγεν αὐτῷ εἰς πάντα τόπον οὗ ἐπορεύετο
  english_pob_choice: marched opposite him to every place where he went
  chosen_korean: 그가 가는 곳마다 그와 맞서 나아갔습니다
  alternatives_korean:
  - 그가 가는 곳마다 그와 나란히 맞섰습니다
  - 그가 가는 곳마다 그의 움직임에 맞추어 나아갔습니다
  lexicon: LSJ
  rationale: 군사적 대치와 동행적 추적의 긴장을 함께 담기 위해, ‘맞서 나아가다’로 관계적 움직임을 압축했습니다.
theological_decisions:
- issue: 군사 서술의 강도와 목적 표현
  chosen_reading: 트리폰의 의도를 ‘그 도시로 들어가 그것을 멸망시키려고’로 직접 드러내어, 서사의 적대성과 파괴 의도를 약화시키지 않았습니다.
  alternative_readings:
  - ‘그 도시로 들어가 파괴하려고’
  - ‘그 도시를 치려고’
  rationale: 원문과 POB가 모두 적대적 군사 행동을 분명히 하므로, 완곡한 표현보다 목적을 명시하는 번역이 적절합니다.
  doctrine_reference: 본문 해석상의 명확성 원칙
- issue: ἀντιπαρῆγεν의 관계성
  chosen_reading: ‘그와 맞서 나아갔습니다’로 옮겨, 단순한 병행 이동이 아니라 대치하며 따라붙는 군사적 대응을 반영했습니다.
  alternative_readings:
  - ‘그와 나란히 갔습니다’
  - ‘그의 곁을 따라갔습니다’
  rationale: POB의 주석처럼 이 동사는 단순한 동행보다 상호 대응하는 이동을 시사하므로, 대치의 뉘앙스를 살렸습니다.
  doctrine_reference: 본문 맥락에 따른 의미 보존
