base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/005.yaml
  text: And now[a], far be it from me to spare my life in any time of distress; for I am not better than my brothers.
  footnotes:
  - marker: a
    text: Or 'to spare myself'; literally 'to spare my life/soul.' Here ψυχή refers to life rather than the immaterial soul.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이제는, 어떤 환난의 때에도 내 목숨을 아끼는 일이 내게 결코 없기를 바랍니다. 왜냐하면 나는 내 형제들보다 낫지 않기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 ‘내 자신을 아끼는 일’로도 옮길 수 있습니다. 문자적으로는 ‘내 목숨/영혼을 아끼는 것’인데, 여기서 ψυχή는 비물질적 영혼이 아니라 생명을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μή μοι γένοιτο
  english_pob_choice: far be it from me
  chosen_korean: 내게 결코 없기를 바랍니다
  alternatives_korean:
  - 그런 일이 내게 일어나지 않기를 바랍니다
  - 내게 그런 일이 없기를 바랍니다
  lexicon: BDAG
  rationale: 강한 부정과 거절의 관용구로서, 한국어에서는 ‘결코 없기를 바랍니다’가 과도하게 직역하지 않으면서도 단호한 반대를 살립니다.
- source_word: φείσασθαί μου τῆς ψυχῆς
  english_pob_choice: to spare my life
  chosen_korean: 내 목숨을 아끼는 일
  alternatives_korean:
  - 내 생명을 보존하는 일
  - 내 영혼을 아끼는 일
  - 나 자신을 아끼는 일
  lexicon: LSJ
  rationale: ψυχή는 여기서 비물질적 ‘영혼’보다 ‘목숨/생명’을 가리키므로, 독자가 오해하지 않도록 ‘목숨’으로 옮겼습니다.
- source_word: ἐν παντὶ καιρῷ θλίψεως
  english_pob_choice: in any time of distress
  chosen_korean: 어떤 환난의 때에도
  alternatives_korean:
  - 모든 고난의 때에
  - 환난의 모든 때에
  - 곤란한 때마다
  lexicon: LSJ
  rationale: παντί와 θλίψεως의 분포적·상황적 뉘앙스를 살리면서도, 한국어 문맥에서 자연스러운 ‘어떤 환난의 때에도’로 표현했습니다.
- source_word: οὐ γάρ εἰμι κρείσσων
  english_pob_choice: for I am not better
  chosen_korean: 왜냐하면 나는 … 낫지 않기 때문입니다
  alternatives_korean:
  - 왜냐하면 나는 … 더 낫지 않기 때문입니다
  - 왜냐하면 나는 … 더 뛰어나지 않기 때문입니다
  lexicon: LSJ
  rationale: κρείσσων은 여기서 도덕적·지위상의 우월성을 가리키므로, 한국어에서는 비교의 자연스러운 표현인 ‘낫지 않기’로 옮겼습니다.
- source_word: τῶν ἀδελφῶν μου
  english_pob_choice: than my brothers
  chosen_korean: 내 형제들보다
  alternatives_korean:
  - 내 형제들보다
  - 내 형제들보다 더
  - 내 형제들보다 낫지 않
  lexicon: BDAG
  rationale: 문맥상 실제 혈연 형제들을 가리키므로, 전통적 교회어 ‘형제들’을 유지하되 비교 대상이 분명하도록 ‘보다’를 살렸습니다.
theological_decisions:
- issue: ψυχή의 의미를 ‘영혼’으로 둘지 ‘목숨/생명’으로 둘지
  chosen_reading: 여기서는 ‘목숨’으로 번역해, 자기 보존을 포기하겠다는 뜻을 드러냈습니다.
  alternative_readings:
  - ‘영혼’으로 옮겨 존재 전체를 가리키는 표현으로 읽기
  - ‘자기 자신’을 뜻하는 반사적 표현으로 읽기
  rationale: POB의 영어 주해가 이미 ψυχή를 immaterial soul이 아니라 life로 본다고 밝혔으므로, 본문 의미를 흐리지 않도록 같은 방향을 따랐습니다.
  doctrine_reference: 1 Maccabees 13:5의 문맥상 자기희생/충성의 강조
- issue: μή μοι γένοιτο의 강한 거절을 한국어에서 어떻게 보일지
  chosen_reading: 완곡한 소망문이 아니라 강한 부정의 표현으로 처리했습니다.
  alternative_readings:
  - ‘그럴 수 없습니다’
  - ‘그런 일은 없기를 바랍니다’
  rationale: 본문 화자의 결연한 자기부정과 다짐을 살리기 위해, 단순한 금지나 소망보다 강한 거절감을 주는 표현을 택했습니다.
  doctrine_reference: 서사 본문에서의 결단과 충성의 수사
