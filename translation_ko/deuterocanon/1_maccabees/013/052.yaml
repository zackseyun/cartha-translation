  source_fidelity: 첫 문장의 ‘해마다의 절기’는 κατʼ ἐνιαυτὸν이 나타내는 연례적 준수를 부자연스럽게 명사화합니다. 또한 τὸ ὄρος ... τὸ παρὰ τὴν ἄκραν은 ‘성채 곁에 있는 성전의 언덕’으로 수식 관계를 분명히 하는 편이 정확합니다. προσωχύρωσεν의 접두적 의미(추가로/더)를 반영했습니다.
  naturalness: ‘해마다 이 날을 기념하도록 정하였습니다’가 현대 표준 한국어 합쇼체에서 자연스럽고 의미도 명료합니다. ‘그와 함께한 이들과 그곳에 살았습니다’는 집단을 과도하게 특정하지 않으면서 원문의 병렬을 자연스럽게 옮깁니다.
  terminology: ἱερόν은 ‘성전’으로, ἄκρα는 본문에서 ‘성채’로 유지하되 특정 셀레우코스 요새인 아크라일 수 있다는 가능성을 해당 단어에 각주로 보존했습니다. ‘절기’는 원문이 명시하지 않는 종교 절기 범주를 다소 강화하므로 삭제했습니다.
