  text: And he established it as a yearly observance to celebrate this day. And he fortified the hill of the sanctuary beside the citadel[a], and he lived there, he and those with him.
  footnotes:
  - marker: a
    text: Or 'near the Akra'; ἄκρα may refer specifically to the Seleucid fortress in Jerusalem rather than a citadel in a generic sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 이 날을 기념하는 해마다의 절기로 정하였습니다. 그리고 그는 성전의 언덕을 성채 곁에 요새화하였고, 자기와 함께한 이들과 함께 거기에서 살았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아크라 곁에’. ἄκρα는 일반적인 ‘성채’일 수도 있으나, 예루살렘의 셀레우코스 요새인 특정 ‘아크라’를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησεν
  english_pob_choice: established
  chosen_korean: 정하였습니다
  alternatives_korean:
  - 세웠습니다
  - 설립하였습니다
  - 지정하였습니다
  lexicon: LSJ
  rationale: 반복되는 연례 행사를 제도적으로 마련했다는 뜻을 살리면서, 한국어에서 자연스럽고 과도하게 종교화되지 않는 표현으로 옮겼습니다.
- source_word: κατʼ ἐνιαυτόν τοῦ ἄγειν τὴν ἡμέραν ταύτην
  english_pob_choice: as a yearly observance to celebrate this day
  chosen_korean: 이 날을 기념하는 해마다의 절기
  alternatives_korean:
  - 해마다 이 날을 기념하는 행사
  - 매년 이 날을 지키는 절기
  - 이 날을 해마다 기념하도록 하는 절기
  lexicon: LSJ
  rationale: κατʼ ἐνιαυτόν의 반복성과 ἄγειν + ἡμέραν의 ‘기념/지키다’ 의미를 함께 반영해, 단순한 연도 표기가 아니라 연례 기념일의 설정임을 드러냈습니다.
- source_word: τὸ ὄρος τοῦ ἱεροῦ τὸ παρὰ τὴν ἄκραν
  english_pob_choice: the hill of the sanctuary beside the citadel
  chosen_korean: 성전의 언덕을 성채 곁에
  alternatives_korean:
  - 성전의 산을 성채 곁에
  - 성소의 언덕을 성채 옆에
  - 성전산을 성채 곁에
  lexicon: LSJ
  rationale: ὄρος의 문자적 ‘산/언덕’과 ἱεροῦ의 ‘성전/성소’ 의미를 따라 ‘성전의 언덕’으로 옮겼고, ἄκρα는 본문 흐름상 일반명사 ‘성채’로 두었습니다.
- source_word: οἱ παρʼ αὐτοῦ
  english_pob_choice: those with him
  chosen_korean: 자기와 함께한 이들
  alternatives_korean:
  - 그와 함께한 사람들
  - 그와 함께 있던 이들
  - 그의 동행자들
  lexicon: LSJ
  rationale: 동반 집단을 지나치게 특정하지 않고, Greek의 폭넓은 표현을 자연스러운 현대 한국어로 살렸습니다.
theological_decisions:
- issue: ἄκρα의 지칭
  chosen_reading: 본문은 일반명사 ‘성채’로 옮기되, 특정한 셀레우코스 요새인 Akra라는 역사적 가능성은 각주로 남길 수 있게 했습니다.
  alternative_readings:
  - ‘아크라’로 음역
  - ‘아크라 곁에’로 직역
  rationale: 본문 자체는 위치 설명을 하고 있으나, 1 Maccabees의 역사적 배경에서는 고유명사적 지시가 가능합니다. 본문은 독해를 위해 투명한 일반명사로 두고, 본문 확정성을 과장하지 않도록 했습니다.
  doctrine_reference: 역사-지리적 본문 처리 원칙
- issue: ἡμέραν ταύτην의 의미
  chosen_reading: 단순한 날짜 표기가 아니라 공동체가 반복해서 기념하는 날로 이해했습니다.
  alternative_readings:
  - ‘이 날을 지키는’
  - ‘이 날을 축하하는’
  rationale: 서술 맥락상 이는 개인적 일정이 아니라 공적 기념일의 제정입니다. 따라서 ‘절기’와 ‘기념’의 조합으로 의미를 드러냈습니다.
  doctrine_reference: 공동체 기억과 절기 제정
