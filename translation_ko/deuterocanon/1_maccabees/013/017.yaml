- from: 그리고 시몬은 그들이 자신에게 속임수로 말하고 있음을 알아차렸습니다. 그러나 그는 돈과 소년들을 보냈습니다. 이는 백성에게 큰 적대감이 일어나지 않게 하려는 것이었습니다.[a][b]
  to: 그리고 시몬은 그들이 자신에게 속임수를 쓰며 말하고 있음을 알아차렸습니다. 그러나 그는 돈[a]과 소년들을 보냈습니다. 이는 백성에 대한 큰 적대감을 불러일으키지 않기 위해서였습니다.[b]
  rationale: ἀργύριον과 πρὸς τὸν λαόν에 대한 각주를 각각 해당 어구에 연결했습니다. 본문은 영어 POB의 ‘against the people’ 및 그리스어 전치사구의 방향성을 반영하여 ‘백성에 대한’으로 옮겼고, 가능한 다른 관계적 이해는 각주에 보존했습니다. 목적 표현도 한국어 합쇼체에 맞게 간결하게 다듬었습니다.
