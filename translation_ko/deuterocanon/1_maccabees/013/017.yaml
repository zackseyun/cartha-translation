  lexicon: LSJ
  rationale: 직역의 ‘원한/적의’보다 공동체 내 긴장과 충돌을 넓게 드러내는 ‘적대감’이 동사의 결과적 의미를 잘 드러냅니다.
theological_decisions:
- issue: πρὸς τὸν λαόν의 관계 방향
  chosen_reading: ‘백성에게’로 옮겨, 시몬의 행동이 백성 쪽으로 향하는 적대의 발생을 피하려는 뜻을 살렸습니다.
  alternative_readings:
  - 백성 가운데
  - 백성에 대하여
  - 백성에게
  rationale: 이 구절은 시몬이 백성과의 관계에서 대규모 적대가 일어나는 것을 피하려는 맥락이므로, 방향성을 드러내되 과도한 해석은 피했습니다.
  doctrine_reference: 역사서 문맥의 사회적-정치적 결과 진술
