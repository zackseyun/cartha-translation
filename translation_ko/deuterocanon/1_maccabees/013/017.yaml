  rationale: 문맥상 인질로 넘겨지는 자녀들을 가리키며, μικρό한 유년이 아니라 아들들을 지칭하는 뉘앙스를 살리기 위해 ‘소년들’로 옮겼습니다.
- source_word: ἔχθραν ἄρῃ μεγάλην
  english_pob_choice: great hostility
