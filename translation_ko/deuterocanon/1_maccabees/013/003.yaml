  text: And he encouraged them and said to them[a], “You yourselves know what I and my brothers and my father’s house have done for the laws and the holy things, and the wars and the distresses.”
  footnotes:
  - marker: a
    text: Or 'for the laws and the sanctuary.' The Greek says 'the holy things,' which may refer more broadly to the sanctuary and other sacred matters.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그들을 격려하고 그들에게 말했습니다. “여러분 자신이 나와 내 형제들과 내 아버지의 집안이 율법과 거룩한 것들[a]을 위하여 무엇을 했는지, 또 우리가 어떤 전쟁들과 고난들을 겪었는지 알고 있습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거룩한 것들’은 문맥상 성소를 포함할 수 있으나, 성소와 그 밖의 성스러운 사안들을 더 넓게 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλεσεν
  english_pob_choice: encouraged
  chosen_korean: 격려하며
  alternatives_korean:
  - 권면하며
  - 간청하며
  - 위로하며
  lexicon: BDAG
  rationale: 문맥상 군중을 북돋워 지난 행동을 상기시키는 말이므로, 단순한 ‘권면’보다 지원적 뉘앙스가 있는 ‘격려하다’가 가장 자연스럽습니다.
- source_word: Αὐτοὶ οἴδατε
  english_pob_choice: You yourselves know
  chosen_korean: 너희 자신이 알고 있습니다
  alternatives_korean:
  - 너희가 알고 있습니다
  - 너희는 잘 알고 있습니다
  lexicon: BDAG
  rationale: αὐτοὶ의 강조를 살려 ‘너희 자신이’로 옮겼고, 직접 청중에게 하는 말투는 합쇼체로 정리했습니다.
- source_word: οἶκος τοῦ πατρός μου
  english_pob_choice: my father’s house
  chosen_korean: 내 아버지의 집
  alternatives_korean:
  - 내 아버지의 가문
  - 내 아버지의 집안
  lexicon: BDAG
  rationale: 가문 전체를 가리키는 관용구이지만, 본문의 집-가족 표상을 그대로 드러내는 ‘내 아버지의 집’이 가장 투명합니다.
- source_word: τῶν νόμων καὶ τῶν ἁγίων
  english_pob_choice: the laws and the holy things
  chosen_korean: 율법들과 거룩한 것들을 위해
  alternatives_korean:
  - 율법과 성소를 위해
  - 율법들과 성소와 거룩한 일들을 위해
  - 율법들과 성물들을 위해
  lexicon: BDAG
  rationale: νόμων의 복수를 살려 ‘율법들’로 옮기고, τῶν ἁγίων은 본문이 넓게 말하는 ‘거룩한 것들’로 유지해 ‘성소’로 너무 좁히지 않았습니다.
- source_word: τοὺς πολέμους καὶ τὰς στενοχωρίας
  english_pob_choice: the wars and the distresses
  chosen_korean: 전쟁들과 고난들을
  alternatives_korean:
  - 전쟁들과 환난들을
  - 전쟁들과 어려움들을
  - 전쟁들과 압박들을
  lexicon: BDAG
  rationale: πολέμους와 στενοχωρίας의 병렬을 살리되, 한국어에서는 관용적으로 이해되는 복수 표현 ‘고난들’로 정리해 의미를 자연스럽게 전달했습니다.
theological_decisions:
- issue: τῶν ἁγίων의 범위
  chosen_reading: ‘거룩한 것들’로 두어 성소에만 한정하지 않았습니다.
  alternative_readings:
  - 성소
  - 거룩한 일들
  - 성물들
  rationale: 그리스어 복수 명사는 성소를 포함할 수 있지만 그보다 넓은 성스러운 사물·사역 전체를 가리킬 수 있으므로, 해석을 미리 고정하지 않는 번역을 택했습니다.
  doctrine_reference: '원문 우선 원칙: 모호성이 있는 성경 용어는 번역에서 과도하게 축소하지 않습니다.'
