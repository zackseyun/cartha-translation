  text: And he set up seven pyramids[a], one opposite the other, for his father and mother and four brothers.
  footnotes:
  - marker: a
    text: Or 'one facing another.' The Greek phrase describes the monuments as arranged opposite each other.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그의 아버지와 어머니와 네 형제를 위하여 피라미드 일곱을 세웠습니다. 하나는 다른 하나의 맞은편에 세웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나가 다른 하나를 마주 보게’. 그리스어 표현은 피라미드들이 서로 맞은편에 배치되었음을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησεν
  english_pob_choice: set up
  chosen_korean: 세웠는데
  alternatives_korean:
  - 설치했는데
  - 건립했는데
  lexicon: BDAG
  rationale: 기념물을 세우는 구체적 행위를 자연스러운 현대 한국어로 옮기되, ‘설치하다’보다 기념비 맥락의 세움 의미를 더 잘 살립니다.
- source_word: ἑπτὰ πυραμίδας
  english_pob_choice: seven pyramids
  chosen_korean: 기념비를 일곱 개
  alternatives_korean:
  - 피라미드를 일곱 개
  - 피라미드 모양의 기념비를 일곱 개
  lexicon: LSJ
  rationale: 한국어에서 ‘피라미드’는 현대적으로는 이집트식 건축물을 먼저 떠올리기 쉬워, 문맥상 장례/추모용 표지를 분명히 하도록 ‘기념비’를 채택했습니다. 수량과 개체성을 유지하기 위해 ‘일곱 개’를 붙였습니다.
- source_word: μίαν κατέναντι τῆς μιᾶς
  english_pob_choice: one opposite another
  chosen_korean: 하나는 다른 하나를 마주 보게
  alternatives_korean:
  - 하나는 다른 하나 맞은편에
  - 하나는 서로 마주 보게
  lexicon: LSJ
  rationale: 두 구조물의 상호 배치라는 점을 자연스럽게 드러내면서, 단순한 위치보다 ‘마주 봄’의 대응 관계를 살렸습니다.
- source_word: τῷ πατρὶ καὶ τῇ μητρὶ καὶ τέσσαρσιν ἀδελφοῖς
  english_pob_choice: for his father and mother and four brothers
  chosen_korean: 자기 아버지와 어머니와 네 형제를 위함
  alternatives_korean:
  - 그의 아버지와 어머니와 네 형제를 위해
  - 아버지와 어머니와 네 형제를 위해
  lexicon: BDAG
  rationale: 여격은 기념/헌정의 목적을 나타내므로 ‘위함’으로 옮겼고, 문맥상 암시되는 소유 관계는 ‘자기’로 자연스럽게 보완했습니다.
theological_decisions:
- issue: 기념비의 성격을 특정하는 문제
  chosen_reading: 본문의 πυραμίδας를 문자적으로 받되, 한국어에서는 문맥상 추모용 기념비로 풀어 옮겼습니다.
  alternative_readings:
  - 피라미드
  - 피라미드형 기념물
  rationale: 한국어 ‘피라미드’는 본문의 장례적 기념물이라는 기능을 바로 전달하지 못할 수 있어, 원문의 형상을 과잉 단정하지 않으면서도 의미 기능을 분명히 하는 쪽을 택했습니다.
  doctrine_reference: 본문의 역사 서술과 추모 행위의 기능을 우선하는 번역 원칙
