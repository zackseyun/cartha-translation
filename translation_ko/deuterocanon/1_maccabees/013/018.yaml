  lexicon: LSJ
  rationale: 분사적 도입어로서 뒤의 직접인용을 여는 기능을 살려, 한국어에서도 자연스러운 보고표지인 ‘말하기를’을 택했습니다.
- source_word: τὸ ἀργύριον
  english_pob_choice: the silver
