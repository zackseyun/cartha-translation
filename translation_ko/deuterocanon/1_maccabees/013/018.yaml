  text: saying[a], “Because I did not send him the silver and the servants[b], he perished.”
  footnotes:
  - marker: a
    text: Or “the servants” or “the attendants” for “the boys” (τὰ παιδάρια). The Greek term can refer either to children/youths or to young servants, and the immediate context does not require a more specific rendering.
    reason: lexical_alternative
  - marker: b
    text: Or “he perished” / “he was destroyed” for “he was ruined” (ἀπώλετο). The Greek allows a range of destruction-language, and the exact nuance is not explicit in this clause alone.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 말하기를 “내가 그에게 은과 그 소년들을 보내지 않았기 때문에, 그는 죽었습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘말하기를’은 뒤따르는 직접인용을 여는 분사구의 기능을 반영한 것입니다.
    reason: source_note
  - marker: b
    text: τὰ παιδάρια는 ‘소년들’ 외에 ‘하인들’ 또는 ‘시종들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  english_pob_choice: saying
  chosen_korean: 말하기를
  alternatives_korean:
  - 말하며
  - 이르기를
  lexicon: LSJ
  rationale: 분사적 도입어로서 뒤의 직접인용을 여는 기능을 살려, 한국어에서도 자연스러운 보고표지인 ‘말하기를’을 택했습니다.
- source_word: τὸ ἀργύριον
  english_pob_choice: the silver
  chosen_korean: 은
  alternatives_korean:
