    text: Or “he perished” / “he was destroyed” for “he was ruined” (ἀπώλετο). The Greek allows a range of destruction-language, and the exact nuance is not explicit in this clause alone.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 이렇게 말하였습니다. “내가 그에게 은과 그 소년들[a]을 보내지 않았기 때문에 그는 죽었습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘소년들’(τὰ παιδάρια)은 ‘하인들’ 또는 ‘시종들’로도 옮길 수 있습니다. 이 말은 소년·젊은이를 가리킬 수도 있고 젊은 하인이나 수행원을 가리킬 수도 있으며, 이 절만으로는 더 구체적으로 정하기 어렵습니다.
    reason: lexical_alternative
