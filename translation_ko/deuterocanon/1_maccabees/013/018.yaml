  lexicon: LSJ
  rationale: 문자적으로는 ‘은’이지만, 한국어에서는 화폐 의미가 분명하므로 ‘은’으로 옮겨 원문 이미지와 재정적 의미를 함께 살렸습니다.
- source_word: τὰ παιδάρια
  english_pob_choice: the boys
  chosen_korean: 그 소년들
  alternatives_korean:
  - 그 아이들
  - 그 하인들
  - 그 시종들
  lexicon: LSJ
  rationale: παιδάρια는 어린 소년들부터 어린 종들까지 가리킬 수 있으므로, 원문의 폭을 보존하면서도 문맥상 자연스러운 ‘소년들’을 택했습니다.
- source_word: ἀπώλετο
  english_pob_choice: he perished
  chosen_korean: 그는 죽었습니다
  alternatives_korean:
  - 그는 멸망했습니다
  - 그는 망했습니다
  - 그는 소멸되었습니다
  lexicon: LSJ
  rationale: 동사의 파괴·멸망 의미를 한국어의 자연스러운 서술로 옮기되, 과도하게 해석적이지 않도록 직설적인 ‘죽었습니다’를 사용했습니다.
theological_decisions:
- issue: ἀπώλετο의 파괴/소멸 어감 처리
  chosen_reading: 직접적 죽음 표현보다는 사건의 결과로서 ‘죽었습니다’라고 옮겨, 원문의 파괴·소멸 뉘앙스를 과장 없이 전달했습니다.
  alternative_readings:
  - 그는 멸망했습니다
  - 그는 망했습니다
  rationale: 이 절은 사실 보고의 문맥이므로, 종교적 용례처럼 확대 해석하지 않고 보고된 결과를 간결하게 전달하는 쪽이 적절합니다.
  doctrine_reference: 문맥 우선 번역 원칙
