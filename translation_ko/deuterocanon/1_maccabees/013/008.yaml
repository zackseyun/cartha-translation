translation:
  language: ko
  text: 그들이 큰 소리로 대답했습니다. “당신은 유다와 당신의 형제인 요나단을 대신하는 우리의 지도자입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν
  english_pob_choice: answered
  chosen_korean: 대답했습니다
  alternatives_korean:
  - 응답했습니다
  - 말했습니다
  lexicon: BDAG
  rationale: 대화의 응답을 직접 나타내는 가장 자연스러운 합쇼체 표현으로, 서술적 흐름을 유지하면서도 원문의 ‘대답하다’ 의미를 분명히 드러냅니다.
- source_word: φωνῇ μεγάλῃ
  english_pob_choice: with a loud voice
  chosen_korean: 큰 소리로
  alternatives_korean:
  - 큰 음성으로
  - 크게
  lexicon: BDAG
  rationale: 그리스어의 방식 부사적 표현을 한국어에서 가장 간결하고 자연스럽게 옮겼습니다. ‘큰 소리로’는 구체성과 가독성을 함께 살립니다.
- source_word: ἡγούμενος
  english_pob_choice: leader
  chosen_korean: 지도자
  alternatives_korean:
  - 인도자
  - 통치자
  - 지휘관
  lexicon: BDAG
  rationale: 본문은 왕권이나 공식 관직을 명시하지 않으므로, 정치·군사적 맥락을 담되 과도하게 좁히지 않는 ‘지도자’가 가장 적절합니다.
- source_word: ἀντὶ
  english_pob_choice: in place of
  chosen_korean: 대신하는
  alternatives_korean:
  - 대신하여
  - 자리를 이어
  - …의 후임으로
  lexicon: BDAG
  rationale: ἀντί의 대체·승계 의미를 살려, 유다와 요나단의 자리를 이어 맡는다는 뉘앙스를 자연스럽게 전달합니다.
- source_word: τοῦ ἀδελφοῦ σου
  english_pob_choice: your brother
  chosen_korean: 당신의 형제
  alternatives_korean:
  - 당신의 오라비
  - 당신의 동생
  lexicon: BDAG
  rationale: 요나단이 시몬의 형제임을 분명히 밝히는 직접적 표현을 유지했습니다. 한국어의 ‘형제’는 혈연 관계를 무난하게 포괄합니다.
theological_decisions:
- issue: ἡγούμενος의 직함 강도
  chosen_reading: ‘지도자’로 옮겨 본문이 말하는 인정된 নেতৃত্ব을 드러내되, 후대의 왕조적·제도적 의미를 덧붙이지 않았습니다.
  alternative_readings:
  - ‘통치자’로 번역해 권한을 더 강하게 보이게 하는 읽기
  - ‘지휘관’으로 번역해 군사 직책으로 한정하는 읽기
  rationale: 그리스어는 시몬의 역할을 분명히 인정하지만, 왕이나 총독 같은 특정 제도를 요구하지 않습니다. 따라서 중립적이면서도 권위를 지닌 ‘지도자’가 본문의 범위를 가장 잘 보존합니다.
  doctrine_reference: '역사 서술의 직함 번역 원칙: 본문이 확정하지 않은 제도적·신학적 의미를 과도하게 부여하지 않음.'
