  lexicon: LSJ
  rationale: ὀχύρωμα는 ‘요새/성채’인 방어 시설을 가리키므로 ‘요새’가 가장 직접적이며, 속격은 ‘유대의’로 단순하게 옮겼습니다.
- source_word: πύργοις ὑψηλοῖς ... πύργοις καὶ πύλαις καὶ μοχλοῖς
  english_pob_choice: with high towers ... and towers and gates and bars
  chosen_korean: 높은 탑들과 큰 성벽들과 탑들과 문들과 빗장
  alternatives_korean:
  - 높은 망대들과 큰 성벽들과 망대들과 문들과 빗장
  - 높은 탑들과 큰 성벽들과 탑들과 문들과 빗장쇠
  lexicon: LSJ
  rationale: 그리스어는 πύργοις를 반복하므로 반복을 유지했고, μοχλοῖς는 문을 잠그는 ‘빗장’이 문맥에 가장 잘 맞습니다.
- source_word: ἔθετο βρώματα
  english_pob_choice: he placed provisions
  chosen_korean: 식량을 두었습니다
  alternatives_korean:
  - 양식을 두었습니다
  - 보급품을 두었습니다
  - 식량을 저장해 두었습니다
  lexicon: LSJ
  rationale: βρώματα는 문자적으로 ‘먹을 것들’이지만, 성벽·요새 문맥에서는 저장된 식량이므로 ‘식량’을 택했습니다.
theological_decisions:
- issue: 반복되는 πύργοις를 보존할지 여부
  chosen_reading: ‘탑들과 … 탑들과’의 반복을 그대로 유지했습니다.
  alternative_readings:
