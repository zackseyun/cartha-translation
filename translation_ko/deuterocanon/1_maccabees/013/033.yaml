  yaml_path: translation/deuterocanon/1_maccabees/013/033.yaml
  text: And Simon built up the stronghold of Judea[a], and he surrounded it with high towers and great walls and gates and bars[b], and he placed provisions in the strongholds.
  footnotes:
  - marker: a
    text: Greek repeats 'towers' twice in the list of fortifications; the translation preserves the repetition rather than smoothing it away.
    reason: lexical_alternative
  - marker: b
    text: Or 'he stored food in the fortresses.' The noun can refer more specifically to food, but 'provisions' better fits the military setting.
    reason: lexical_alternative
translation:
  language: ko
  text: 시몬은 유대의 요새를 세우고, 높은 탑들과 큰 성벽들과 탑들[a]과 문들과 빗장으로 그것을 둘러쌌으며, 요새들 안에 식량[b]을 두었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 방어 시설 목록에서 ‘탑들’을 두 번 반복합니다. 한국어도 이 반복을 그대로 살렸습니다.
    reason: source_note
  - marker: b
    text: βρώματα는 문자적으로는 ‘먹을 것들’이지만, 군사적 문맥에서는 ‘식량’이나 ‘보급품’으로 옮길 수 있습니다. 여기서는 ‘식량’을 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησεν
  english_pob_choice: built up
  chosen_korean: 세우고
  alternatives_korean:
