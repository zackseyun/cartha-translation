  lexicon: LSJ
  rationale: οἰκοδομέω는 기본적으로 ‘짓다/세우다’이며, 군사적 문맥에서 ‘세우고’는 과도한 해석 없이 요새 구축을 자연스럽게 드러냅니다.
- source_word: τὸ ὀχύρωμα τῆς Ἰουδαίας
  english_pob_choice: the stronghold of Judea
  chosen_korean: 유대의 요새
  alternatives_korean:
