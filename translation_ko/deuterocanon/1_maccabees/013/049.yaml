base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/049.yaml
  text: But those in the citadel at Jerusalem were prevented from going out into the country and from buying and selling[a]; and they became very hungry[b], and many of them perished from famine.
  footnotes:
  - marker: a
    text: Or 'the Acra at Jerusalem.' The Greek ἄκρα can function as a common noun ('citadel') or as the well-known designation of the Seleucid stronghold in Jerusalem.
    reason: lexical_alternative
  - marker: b
    text: The Greek text reads 'and and buying and selling' (καὶ καὶ ἀγοράζειν καὶ πωλεῖν); the sense is clear despite the duplicated conjunction, which is likely a scribal or transcriptional repetition rather than a meaningful variant.
    reason: textual_variant
translation:
  language: ko
  text: 그러나 예루살렘의 아크라에 있는 자들은 시골로 나가거나 사고파는 일을 할 수 없게 되었습니다[a]. 그래서 그들은 몹시 굶주렸고, 그들 가운데 많은 사람이 기근으로 죽었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예루살렘의 아크라’입니다. 그리스어 ἄκρα는 ‘성채’ 같은 일반 명사로도, 예루살렘의 셀레우코스 요새를 가리키는 고유 지칭으로도 쓰일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄκρας
  english_pob_choice: the citadel
  chosen_korean: 아크라
  alternatives_korean:
  - 성채
  - 요새
  lexicon: LSJ
  rationale: 여기서는 일반 명사인 ‘citadel’ 의미도 가능하지만, 예루살렘의 셀레우코스 요새로 알려진 고유 지칭을 살려 ‘아크라’로 옮기면 역사적 특수성이 보존됩니다.
- source_word: ἐκωλύοντο ἐκπορεύεσθαι
  english_pob_choice: were prevented from going out
  chosen_korean: 나가거나
  alternatives_korean:
  - 나가는 것이 막히거나
  - 밖으로 나가거나
  lexicon: BDAG
  rationale: 수동의 지속적 제약을 한국어로 자연스럽게 풀어 ‘나가거나’로 옮기되, 앞의 ‘할 수 없게 되었습니다’로 전체 구속 상태를 드러냈습니다.
- source_word: ἀγοράζειν καὶ πωλεῖν
  english_pob_choice: from buying and selling
  chosen_korean: 사고파는 일
  alternatives_korean:
  - 사고팔 수 없게
  - 매매할 수 없게
  lexicon: BDAG
  rationale: 중복된 결합형을 한국어에서는 시장 활동 전체를 뜻하는 관용적 표현으로 압축해, 구매와 판매의 양쪽 제한을 함께 살렸습니다.
- source_word: τῷ λιμῷ
  english_pob_choice: from famine
  chosen_korean: 기근으로
  alternatives_korean:
  - 기아로
  - 굶주림으로
  lexicon: BDAG
  rationale: λιμός는 단순한 배고픔보다 공동체적 재난인 ‘기근’이 핵심이므로, 원인 표지를 살려 ‘기근으로’가 가장 정확합니다.
theological_decisions:
- issue: ἄκρα의 일반명사/고유명사 가능성
  chosen_reading: 본문에서는 예루살렘의 셀레우코스 요새를 가리키는 고유 지칭으로 이해해 ‘아크라’로 유지했습니다.
  alternative_readings:
  - ‘성채’로 일반화하여 번역
  - ‘예루살렘의 성채’로 설명적 번역
  rationale: 영어 POB도 일반 명사 의미와 고유 지칭 가능성을 함께 인정하지만, 역사 서술의 대상이 특정 요새이므로 고유명사를 보존하는 편이 본문 이해에 더 유리합니다.
  doctrine_reference: 역사서 해석 원칙; 지리·역사적 고유명 보존
