  text: But those in the citadel kept sending envoys and urgently pressing him to come to them through the wilderness and to send them provisions[a].
  footnotes:
  - marker: a
    text: 'Greek: ''to come to him''; the context suggests the collective sense ''to them,'' referring to those in the citadel.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 요새에 있던 자들은 사신들을 계속 보내어, 그가 광야를 지나 자기들에게 오도록 하고, 또 자기들에게 양식을 보내도록 그를 간절히 재촉하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 본문은 “그에게”로 되어 있지만, 문맥상 요새에 있는 사람들 전체를 가리키므로 “자기들에게”로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ ἐκ τῆς ἄκρας
  english_pob_choice: those in the citadel
  chosen_korean: 요새에 있던 자들
  alternatives_korean:
  - 성채에 있던 자들
  - 요새 사람들
  lexicon: LSJ
  rationale: ἄκρα는 1 Maccabees에서 예루살렘의 요새를 가리키는 말이므로, 군사적 맥락을 살려 자연스럽게 ‘요새에 있던 자들’로 옮겼습니다.
- source_word: ἀπέστελλον πρεσβεύτας
  english_pob_choice: kept sending envoys
  chosen_korean: 사신들을 계속 보내어
  alternatives_korean:
  - 계속 외교 사절을 보내어
  - 계속 전령들을 보내어
  lexicon: LSJ
  rationale: 미완료시제의 반복·지속을 ‘계속’으로 살리고, πρεσβεύτας는 단순한 전령보다 공식 대표라는 점이 있어 ‘사신들’이 적절합니다.
- source_word: κατεσπούδαζον
  english_pob_choice: urgently pressing
  chosen_korean: 간절히 재촉하였습니다
  alternatives_korean:
  - 급히 आग्रह하였습니다
  - 강하게 재촉하였습니다
  lexicon: LSJ
  rationale: 이 동사는 강한 촉구와 긴박함을 나타내므로, 한국어에서는 의미를 살리면서도 문맥에 자연스러운 ‘간절히 재촉하였습니다’로 옮겼습니다.
- source_word: διὰ τῆς ἐρήμου
  english_pob_choice: through the wilderness
  chosen_korean: 광야를 지나
  alternatives_korean:
  - 광야를 통해
  - 사막을 지나
  lexicon: LSJ
  rationale: διά + 속격은 경로를 나타내므로 ‘광야를 지나’가 가장 자연스럽고, ἐρήμος는 ‘광야/사막’ 중 범위가 넓은 ‘광야’로 옮겼습니다.
