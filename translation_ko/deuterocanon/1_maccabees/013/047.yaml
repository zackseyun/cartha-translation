revisions:
- from: 그리고 시몬은 그들과 타협하고 그들과 싸우지 않았습니다. 그는 그들을 도시에서 쫓아내고, 우상들이 있던 집들을 정결하게 했으며, 마침내 그곳에 찬송과 축복을 드리며 들어갔습니다.[a][b]
  to: 그리고 시몬은 그들과 합의하고[a] 그들과 싸우지 않았습니다. 그는 그들을 도시에서 쫓아내고, 우상들이 있던 집들을 정결하게 했습니다.[b] 그리고 그렇게 그 도시에 찬송하고 축복하며 들어갔습니다.
  rationale: 중립적인 ‘합의하고’로 συνευδών의 문맥적 의미를 보존하고, οὕτως를 ‘그렇게’로 옮겨 시간적 첨가를 제거했습니다. 정결 행위의 종교적 함의는 유지하되 물리적 측면을 배제하는 각주 단정은 삭제했습니다. 각주 표지는 각각 해당 어구 뒤에 배치했습니다.
