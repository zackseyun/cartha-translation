  lexicon: LSJ
  rationale: 군사적 충돌의 부정을 자연스러운 현대 한국어로 옮기되, 전쟁의 의미를 과도하게 확대하지 않기 위해 이렇게 렌더링했습니다.
- source_word: ἐκαθάρισεν τὰς οἰκίας ἐν αἷς ἦν τὰ εἴδωλα
  english_pob_choice: cleansed the houses in which the idols were
  chosen_korean: 우상들이 있던 집들을 정결하게 했으며
  alternatives_korean:
  - 우상들이 있던 집들을 깨끗하게 했으며
  - 우상들을 치운 집들을 정결하게 했으며
  lexicon: LSJ
  rationale: 단순 청소가 아니라 우상으로 인한 부정의 제거라는 종교적 의미를 살려 ‘정결하게 했습니다’를 사용했습니다.
- source_word: ὑμνῶν καὶ εὐλογῶν
  english_pob_choice: with hymns and blessings
  chosen_korean: 찬송과 축복을 드리며
  alternatives_korean:
  - 찬송하며 복을 빌며
  - 찬송과 축복으로
  lexicon: LSJ
  rationale: 두 분사 구조를 한국어로 병렬화하되, 입성의 예배적 성격을 드러내기 위해 ‘찬송’과 ‘축복’의 결합을 유지했습니다.
theological_decisions:
- issue: 우상으로 더럽혀진 집들의 정결 행위의 성격
  chosen_reading: ‘정결하게 했으며’로 옮겨, 물리적 청소를 넘어 종교적 정결의 의미를 보존했습니다.
  alternative_readings:
  - 깨끗하게 했으며
  - 정화했으며
  rationale: 문맥상 우상의 존재가 핵심이므로, 단순한 청소가 아니라 예배적·정결례적 제거를 드러내는 표현이 필요합니다.
