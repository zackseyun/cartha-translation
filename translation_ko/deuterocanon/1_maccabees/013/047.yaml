  yaml_path: translation/deuterocanon/1_maccabees/013/047.yaml
  text: And Simon came to terms with them and did not fight against them[a]. He drove them out of the city and cleansed the houses in which the idols were[b], and so he entered it with hymns and blessings.
  footnotes:
  - marker: a
    text: Or 'made an agreement with them.' The Greek participle can suggest reaching an accommodation rather than engaging them in battle.
    reason: lexical_alternative
  - marker: b
    text: That is, houses where idol-images had been kept; the cleansing is likely religious as well as physical.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 시몬은 그들과 합의하고[a] 그들과 싸우지 않았습니다. 그는 그들을 도시에서 쫓아내고, 우상들이 있던 집들을 정결하게 했습니다.[b] 그리고 그렇게 그 도시에 찬송하고 축복하며 들어갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 분사는 그들과 싸우는 대신 실질적인 합의나 타결에 이르렀다는 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 우상들이 있던 집들을 ‘정결하게 했다’는 말은 단순한 청소를 넘어 우상과 관련된 부정을 제거하는 종교적 정화의 함의를 지닙니다.
    reason: cultural_note
