  yaml_path: translation/deuterocanon/1_maccabees/013/047.yaml
  text: And Simon came to terms with them and did not fight against them[a]. He drove them out of the city and cleansed the houses in which the idols were[b], and so he entered it with hymns and blessings.
  footnotes:
  - marker: a
    text: Or 'made an agreement with them.' The Greek participle can suggest reaching an accommodation rather than engaging them in battle.
    reason: lexical_alternative
  - marker: b
    text: That is, houses where idol-images had been kept; the cleansing is likely religious as well as physical.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 시몬은 그들과 타협하고 그들과 싸우지 않았습니다. 그는 그들을 도시에서 쫓아내고, 우상들이 있던 집들을 정결하게 했으며, 마침내 그곳에 찬송과 축복을 드리며 들어갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘타협하고’는 그리스어 분사가 전투를 피하면서 실질적 조정이나 합의에 이르렀다는 뉘앙스를 담을 수 있기 때문입니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘정결하게 했으며’는 집 자체를 씻었다는 뜻이 아니라, 우상과 관련된 부정을 제거했다는 종교적 의미를 반영합니다.
    reason: cultural_note
lexical_decisions:
- source_word: συνευδὼν
  english_pob_choice: came to terms with
  chosen_korean: 타협하고
  alternatives_korean:
