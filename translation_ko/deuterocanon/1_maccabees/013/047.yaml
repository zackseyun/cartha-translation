  - 화해하고
  lexicon: LSJ
  rationale: 상대와의 충돌 대신 실질적 합의나 조정에 이르는 뉘앙스를 살리기 위해 ‘타협하고’를 택했습니다.
- source_word: ἐπολέμησεν
  english_pob_choice: fight against
  chosen_korean: 싸우지 않았습니다
  alternatives_korean:
  - 전쟁을 일으키지 않았습니다
