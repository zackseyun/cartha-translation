  source_fidelity: 원문의 연대 표지(Ἔτους πρώτου ἐπὶ Σίμωνος)는 시몬의 직함을 수식하는 말이 아니라, 시몬의 재임 아래 시작되는 제1년이라는 문서상의 연호입니다. 초안은 ‘시몬의 제1년’ 뒤에 다시 ‘시몬의 해’를 덧붙여 시몬을 중복하고 연대 공식의 구조를 흐렸습니다. 또한 μεγάλου를 반영한 ‘큰 대제사장’은 한국어 직함으로 부자연스럽습니다.
