  yaml_path: translation/deuterocanon/1_maccabees/013/042.yaml
  text: And the people of Israel began to write in documents and contracts[a], “Year one of Simon, the great high priest and general and leader of the Jews.”
  footnotes:
  - marker: a
    text: Or “of the Judeans.” The Greek ethnonym can denote either the Jewish people broadly or the people of Judea more specifically.
    reason: lexical_alternative
translation:
  language: ko
  text: 이에 이스라엘 백성은 문서와 계약서에 “위대한 대제사장, 장군, 유대인의 지도자인 시몬의 제1년[a]”이라고 쓰기 시작했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “유대 지역 사람들의.” 그리스어 민족명은 넓게 유대 민족을 가리킬 수도 있고, 더 구체적으로 유대 지역의 사람들을 가리킬 수도 있습니다.
    reason: Ἰουδαίων의 민족적·지리적 의미 범위에 관한 어휘적 대안을 보존합니다.
lexical_decisions:
- source_word: καὶ ἤρξατο
  english_pob_choice: began
  chosen_korean: 쓰기 시작했습니다
  alternatives_korean:
  - 기록하기 시작했습니다
  - 쓰기를 시작했습니다
  lexicon: LSJ
  rationale: ἤρξατο 뒤의 부정법은 어떤 관행의 개시를 나타내므로, 한국어에서도 ‘쓰기 시작했습니다’로 자연스럽게 시작 동작을 드러냈습니다.
- source_word: ἐν ταῖς συγγραφαῖς καὶ συναλλάγμασιν
  english_pob_choice: in documents and contracts
  chosen_korean: 문서와 계약서에
  alternatives_korean:
  - 기록과 계약서에
  - 문서와 거래서류에
  lexicon: LSJ
  rationale: συγγραφαί와 συναλλάγματα는 공식적인 문서와 계약 문맥을 가리키므로, 현대 한국어에서 행정·법률 문체에 맞는 ‘문서와 계약서’로 옮겼습니다.
- source_word: Ἔτους πρώτου ἐπὶ Σίμωνος
  english_pob_choice: Year one of Simon / under Simon
  chosen_korean: “시몬의 제1년—…시몬의 해”
  alternatives_korean:
  - “시몬 통치 제1년”
  - “시몬 아래 첫해”
  lexicon: LSJ
  rationale: 연대 표지 공식이므로 ‘제1년’으로 압축하되, ἐπὶ Σίμωνος의 지배·재임 배경을 살려 한국어 안에서 자연스러운 공식 표현으로 구성했습니다.
- source_word: ἀρχιερέως μεγάλου καὶ στρατηγοῦ καὶ ἡγουμένου
  english_pob_choice: the great high priest and general and leader
  chosen_korean: 큰 대제사장이며 장군이며 지도자인
  alternatives_korean:
  - 위대한 대제사장이며 장군이며 통치자인
  - 대제사장이며 군사령관이며 지도자인
  lexicon: LSJ
  rationale: 세 칭호를 모두 보존해 시몬에게 부여된 공적 직함의 누적 효과를 살렸고, μεγάλου는 단순 수식어가 아니라 직함의 격을 더하므로 ‘큰’으로 반영했습니다.
- source_word: Ἰουδαίων
  english_pob_choice: of the Jews
  chosen_korean: 유대인
  alternatives_korean:
  - 유대인들
  - 유대인들의
  lexicon: LSJ
  rationale: 이 문맥에서는 공적 칭호의 귀속 대상이므로 자연스러운 현대 한국어로 ‘유대인의’로 처리했으며, ethnonym의 집단적 의미를 유지했습니다.
theological_decisions:
- issue: Ἰουδαίων의 민족명/지명 연관성
  chosen_reading: 유대인의
  alternative_readings:
  - 유대지역 사람들의
  - 유대인들의
  rationale: 본문은 정치·행정적 표제이므로 민족적 집단으로 읽는 것이 가장 자연스럽지만, ‘유대인’이 유대 지역 주민을 포괄할 수 있다는 긴장도 함께 보존했습니다.
  doctrine_reference: 문맥 우선의 번역 원칙; 1 Maccabees의 Ἰουδαῖοι 용례
