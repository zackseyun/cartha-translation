base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/014.yaml
  text: And Tryphon learned that Simon had arisen in place of Jonathan his brother, and that he was about to engage him in war; and he sent envoys to him, saying,
  footnotes:
  - marker: a
    text: Or 'had taken Jonathan's place' / 'had risen up instead of Jonathan.' The Greek ἀνέστη with ἀντί can denote emergence as a successor, not merely physical rising.
    reason: lexical_alternative
  - marker: b
    text: Or 'to join battle with him' or 'to make war against him.' The Greek expression συνάπτειν αὐτῷ εἰς πόλεμον is an idiom for entering into armed conflict.
    reason: lexical_alternative
translation:
  language: ko
  text: '그리고 트뤼폰은 시몬이 시몬의 형제인 요나단을 대신하여 일어섰고, 자신과 전쟁을 벌이려 한다는 것을 알게 되었습니다. 그래서 그는 그에게 사절들을 보내어 이렇게 말하였습니다:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνω
  english_pob_choice: learned
  chosen_korean: 알게 되었습니다
  alternatives_korean:
  - 알았습니다
  - 깨달았습니다
  - 알아차렸습니다
  lexicon: BDAG
  rationale: aorist γινώσκω의 사건적 의미를 살려, 단순 상태보다 새로 인지하게 된 동작을 자연스럽게 표현했습니다.
- source_word: ἀνέστη + ἀντὶ Ἰωνάθου
  english_pob_choice: had arisen in place of Jonathan
  chosen_korean: 요나단의 자리를 대신하여 일어섰고
  alternatives_korean:
  - 요나단 대신 일어났고
  - 요나단의 뒤를 이어 일어섰고
  - 요나단의 자리를 차지하고
  lexicon: BDAG
  rationale: ἀνίστημι와 ἀντί의 결합이 단순한 ‘일어남’이 아니라 후계·대체의 뉘앙스를 가지므로, ‘자리를 대신하여 일어섰다’로 그 긴장을 유지했습니다.
- source_word: συνάπτειν αὐτῷ ... εἰς πόλεμον
  english_pob_choice: to engage in war against him
  chosen_korean: 그와 전쟁을 벌이려 한다는
  alternatives_korean:
  - 그와 전쟁을 치르려 한다는
  - 그를 상대로 전쟁을 일으키려 한다는
  - 그와 전쟁에 들어가려 한다는
  lexicon: LSJ
  rationale: 관용적으로 ‘전쟁을 벌이다’가 ελλην어의 적대적 군사 충돌을 자연스럽게 옮기며, 목적어 ‘그와’를 통해 상대방을 분명히 했습니다.
- source_word: πρέσβεις
  english_pob_choice: envoys
  chosen_korean: 사절들
  alternatives_korean:
  - 사신들
  - 외교 사절들
  - 사절단
  lexicon: BDAG
  rationale: πρέσβεις는 일반 전달자가 아니라 외교적 대표를 가리키므로, 문맥에 맞는 ‘사절들’로 옮겼습니다.
