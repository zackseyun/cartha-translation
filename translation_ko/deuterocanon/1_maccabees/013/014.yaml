review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 원문의 λέγων은 다음 절의 사절 메시지를 도입하므로, 현 번역의 ‘사절들을 보내며, 말하였습니다.’는 문장 연결과 화행 관계가 어색합니다. 또한 ‘자기 형제 요나단’은 문법상 이해 가능하지만, ‘자기’의 선행사가 혼동될 여지가 있어 시몬과 요나단의 형제 관계를 명시하는 편이 안전합니다.
  naturalness: ‘보내며, 말하였습니다’는 현대 한국어에서 부자연스럽고, 다음 절에 이어지는 발화를 마침표로 닫아서는 안 됩니다. ‘보내어 이렇게 말하였습니다:’가 합쇼체 문체와 연속 인용의 형식에 자연스럽습니다.
  terminology: ‘트뤼폰’, ‘시몬’, ‘요나단’, ‘사절들’, ‘전쟁을 벌이다’는 적절합니다. ‘요나단을 대신하여 일어섰다’는 ἀνέστη와 ἀντί가 지닌 후계·대체의 의미를 보존하며, 특정 직위나 제도적 지위를 과도하게 보태지 않습니다.
  issues:
  - severity: medium
    issue: λέγων을 ‘보내며, 말하였습니다.’로 옮겨 문장 연결이 어색하고 다음 절의 메시지 도입이 마침표로 종결되어 있습니다.
    rationale: 원문은 ‘그에게 사절들을 보내어, 말하며/이르되’라는 구조로 다음 절의 발화 내용을 이끕니다. 한국어에서는 ‘보내어 이렇게 말하였습니다:’와 콜론으로 이어 주어야 자연스럽고 충실합니다.
  - severity: low
