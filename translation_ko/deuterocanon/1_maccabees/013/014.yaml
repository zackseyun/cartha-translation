  text: καὶ ἔγνω Τρύφων ὅτι ἀνέστη Σίμων ἀντὶ Ἰωνάθου τοῦ ἀδελφοῦ αὐτοῦ, καὶ ὅτι συνάπτειν αὐτῷ μέλλει εἰς πόλεμον· καὶ ἀπέστειλεν πρὸς αὐτὸν πρέσβεις, λέγων
