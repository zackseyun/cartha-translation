  text: And he made these as devices, setting up great pillars; and on the pillars he made suits of armor for an everlasting memorial, and beside the armor, ships engraved, to be seen by all who sail the sea.
translation:
  language: ko
  text: 그는 이것들을 장치로 만들고, 큰 기둥들을 세웠습니다. 그리고 기둥들 위에는 영원한 기념물로 갑옷들을 만들었고, 갑옷들 곁에는 새겨진 배들을 두어 바다를 항해하는 모든 사람이 보게 했습니다.
  philosophy: formal
lexical_decisions:
- source_word: μηχανήματα
  english_pob_choice: devices
  chosen_korean: 장치
  alternatives_korean:
  - 기계
  - 장비
  - 장치물
  lexicon: μηχάνημα
  rationale: 문맥상 인물의 기념 구조물을 가리키므로, 영어 POB의 ‘devices’를 따라 인공적으로 꾸민 구조물의 느낌이 살아 있는 ‘장치’로 옮겼습니다.
- source_word: στύλους μεγάλους
  english_pob_choice: great pillars
  chosen_korean: 큰 기둥들
  alternatives_korean:
  - 거대한 기둥들
  - 웅장한 기둥들
  lexicon: στῦλος
  rationale: 직역에 가깝게 복수형을 살리되, 과장되지 않은 ‘큰 기둥들’로 자연스럽게 표현했습니다.
- source_word: πανοπλίας
  english_pob_choice: suits of armor
  chosen_korean: 갑옷들
  alternatives_korean:
  - 완전무장
  - 무장구
  - 무구
  lexicon: πανοπλία
  rationale: 여기서는 한 벌의 전신 갑옷보다 기념 장식물로서의 ‘갑옷’이 핵심이므로, 영어 POB의 복수형 감각을 살려 ‘갑옷들’로 옮겼습니다.
- source_word: εἰς ὄνομα αἰώνιον
  english_pob_choice: for an everlasting memorial
  chosen_korean: 영원한 기념물로
  alternatives_korean:
  - 영원한 이름을 위하여
  - 영원한 명예로
  - 영구한 표지로
  lexicon: ὄνομα, αἰώνιος
  rationale: 직역하면 ‘영원한 이름’이지만, 한국어에서는 기념비적 목적을 드러내는 ‘기념물’이 더 분명하여 의미를 보존하는 방향으로 옮겼습니다.
- source_word: ἐγγεγλυμμένα
  english_pob_choice: engraved
  chosen_korean: 새겨진
  alternatives_korean:
  - 조각된
  - 음각된
  - 파놓은
  lexicon: ἐγγλύφω
  rationale: 배의 도상이 표면에 새겨진 상태를 간결하게 나타내는 표준적 표현으로 처리했습니다.
