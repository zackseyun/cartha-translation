  text: And he entered it on the twenty-third day of the second month, in the one hundred seventy-first year, with praise and palm branches and with harps and cymbals and stringed instruments and with hymns and songs, because a great enemy had been crushed out of Israel.
  footnotes:
  - marker: a
    text: Or 'lyres' for 'harps' (κινύραις); the exact ancient instrument is not fully certain in modern English.
    reason: lexical_alternative
  - marker: b
    text: Or 'harps' or 'psalteries' for 'stringed instruments' (νάβλαις); the Greek names a specific stringed instrument, but exact identification is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 그 달 둘째 달의 스물셋째 날, 백칠십일년에 그 안으로 들어갔습니다. 그는 찬양과 종려 가지와 수금과 심벌즈와 현악기들과 함께, 찬송과 노래로 들어갔습니다. 이는 큰 원수 하나가 이스라엘에서 무너졌기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: κινύραις는 악기 이름으로, 한국어의 '수금'은 전통적으로 이 계열을 가리키는 번역어입니다.
    reason: lexical_alternative
  - marker: b
    text: νάβλαις는 정확한 고대 악기 대응이 확정적이지 않아, 여기서는 기능을 살린 '현악기들'로 옮겼습니다.
    reason: lexical_alternative
