    text: Or 'lyres' for 'harps' (κινύραις); the exact ancient instrument is not fully certain in modern English.
    reason: lexical_alternative
  - marker: b
    text: Or 'harps' or 'psalteries' for 'stringed instruments' (νάβλαις); the Greek names a specific stringed instrument, but exact identification is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 둘째 달 스물셋째 날, 백칠십일년에 찬양과 종려 가지를 들고 수금[a]과 심벌즈와 현악기[b], 찬송과 노래를 함께하며 그곳에 들어갔습니다. 이는 이스라엘 가운데서 큰 원수가 꺾였기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: κινύραις는 현악기의 한 종류를 가리킵니다. ‘수금’은 전통적인 번역어이며, 현대의 어느 악기와 정확히 같은지는 확정하기 어렵습니다.
    reason: lexical_alternative
  - marker: b
    text: νάβλαις는 특정 고대 현악기의 이름입니다. 정확한 현대 악기 대응이 확정적이지 않아 ‘현악기’로 옮겼습니다.
    reason: lexical_alternative
