  text: And he gathered all the fighting men, and hastened to finish the walls of Jerusalem, and fortified it all around.
translation:
  language: ko
  text: 그는 모든 전투원들을 모으고, 예루살렘 성벽을 완공하려고 서둘렀으며, 그것을 사방으로 견고하게 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘전투원들’은 남성형 ἄνδρας와 군사적 명사 πολεμιστάς를 함께 반영한 표현입니다.
    reason: theological_note
lexical_decisions:
- source_word: συνήγαγεν πάντας τοὺς ἄνδρας τοὺς πολεμιστάς
  english_pob_choice: gathered all the fighting men
  chosen_korean: 모든 전투원들을 모으고
  alternatives_korean:
  - 모든 싸우는 남자들을 모으고
  - 모든 용사들을 모으고
  lexicon: LSJ
  rationale: συνάγω는 사람들을 한데 모으는 뜻이고, πολεμιστάς는 군사적 성격의 ‘전투하는 사람들’을 가리키므로, ‘전투원들’이 현대적이면서도 의미를 잘 보존합니다.
- source_word: ἐτάχυνεν τοῦ τελέσαι
  english_pob_choice: hastened to finish
  chosen_korean: 예루살렘 성벽을 완공하려고 서둘렀으며
  alternatives_korean:
  - 예루살렘 성벽을 끝내려고 서둘렀으며
  - 예루살렘 성벽을 완성하려고 급히 했으며
  lexicon: LSJ
  rationale: ἐτάχυνεν과 목적 부정사 구조는 ‘서둘러 ~하려 했다’는 목적성을 가지므로, τελέσαι는 공사 맥락에 맞게 ‘완공하다’로 옮기는 것이 자연스럽습니다.
- source_word: ὠχύρωσεν αὐτὴν κυκλόθεν
  english_pob_choice: fortified it all around
  chosen_korean: 그것을 사방으로 견고하게 했습니다
  alternatives_korean:
  - 그것을 사방으로 요새화했습니다
  - 그것을 둘레로 요새를 세웠습니다
  lexicon: LSJ
  rationale: ὠχυρόω는 군사적 의미의 ‘견고하게 하다/요새화하다’이지만, 한국어에서는 성벽을 이미 언급한 뒤라 ‘견고하게 했다’가 과도한 재진술 없이 fortify의 기능을 살립니다.
theological_decisions:
- issue: 남성 지시의 보존
  chosen_reading: 전투원들
  alternative_readings:
  - 전사들
  - 군인들
  rationale: ἄνδρας와 πολεμιστάς는 명시적으로 남성형이므로, 중성화한 ‘군인들’보다 남성 지시를 유지하는 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
