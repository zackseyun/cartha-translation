  source_fidelity: ‘전투원들’은 군사적 의미는 전달하지만, 명시적으로 남성을 뜻하는 ἄνδρας를 드러내지 못합니다. 또한 ‘그것’은 직전의 ‘성벽’을 가리키는 것으로 읽히기 쉬우나, αὐτή는 예루살렘을 가리킵니다.
  naturalness: ‘싸우는 모든 남자들’은 현대 표준 한국어에서 자연스럽고, ‘예루살렘을 사방으로 요새화했습니다’는 도시 전체를 둘러 방비했다는 뜻을 분명히 합니다.
  terminology: ‘요새화했습니다’는 ὠχύρωσεν의 군사적·방어적 의미를 정확히 살립니다. ‘완공하기 위해 서둘렀으며’는 τοῦ τελέσαι를 목적의 의미로 무리 없이 반영합니다.
  issues:
