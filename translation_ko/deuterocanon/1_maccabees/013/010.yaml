    issue: ‘전투원들’이 ἄνδρας의 남성 지시를 명시적으로 보존하지 못합니다.
    rationale: 원문은 πολεμιστάς뿐 아니라 ἄνδρας(남자들)를 함께 사용합니다. 현행 각주는 이를 반영했다고 하나, 본문 표현 자체는 성별을 드러내지 않습니다.
  - severity: medium
    issue: ‘그것을 사방으로 견고하게 했습니다’의 지시 대상이 모호합니다.
    rationale: 원문의 여성 단수 대명사 αὐτή는 예루살렘을 가리키지만, 한국어 문맥에서는 ‘그것’이 바로 앞의 ‘성벽’을 가리키는 듯 읽힐 수 있습니다. 또한 ὠχυρόω의 군사적 의미에는 ‘요새화하다’가 더 직접적입니다.
  revised_text: 그는 싸우는 모든 남자들을 모으고 예루살렘 성벽을 완공하기 위해 서둘렀으며, 예루살렘을 사방으로 요새화했습니다.
