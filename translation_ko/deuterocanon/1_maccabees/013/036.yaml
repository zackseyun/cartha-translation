theological_decisions:
- issue: 서신 머리말 형식의 불완전한 문장 처리
  chosen_reading: 이 구절은 독립 문장이 아니라 다음 절로 이어지는 표제식 호칭이므로, 한국어도 종결을 보류하는 형태로 옮겼습니다.
  alternative_readings:
  - 문장부호를 넣어 완결된 문장처럼 처리
  - 괄호로 보충하여 설명문처럼 처리
  rationale: 영문 POB의 주석과 그리스어 표제형 문맥이 모두 다음 절로 이어짐을 보여 주므로, 본문의 미완결성을 보존하는 것이 더 충실합니다.
  doctrine_reference: 본문 구조와 담화 형식 보존
- issue: ‘φίλῳ βασιλέων’의 궁정 칭호 보존
  chosen_reading: ‘왕들의 친구’로 직역하여 정치적·궁정적 칭호의 뉘앙스를 유지했습니다.
  alternative_readings:
  - ‘왕실의 벗’으로 의역
  - ‘왕의 총애를 받는 자’로 해설적 번역
  rationale: 문맥상 단순한 우정이 아니라 왕실에서 쓰는 공식 호칭이므로, 전통적 교회어보다 원문의 사회적 뉘앙스를 살리는 쪽이 적절합니다.
  doctrine_reference: 역사서의 칭호 번역 원칙
