  text: 그리고 그들이 말했습니다. “우리의 악행대로 우리를 대하지 마시고, 당신의 자비대로 대해 주십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ εἶπαν
  english_pob_choice: And they said
  chosen_korean: 그리고 그들이 말했습니다
  alternatives_korean:
  - 그리고 그들은 말했습니다
  - 그들이 말했습니다
  lexicon: NA
  rationale: 서술 연결을 자연스럽게 살리되, 합쇼체 서술로 맞추었습니다.
- source_word: Μὴ ἡμῖν χρήσῃ
  english_pob_choice: Do not deal with us
  chosen_korean: 우리를 다루지 마시고
  alternatives_korean:
  - 우리를 대하지 마시고
  - 우리를 취급하지 마시고
  lexicon: LSJ
  rationale: χράομαι의 중간태 용법은 단순한 ‘사용하다’보다 ‘어떻게 대하다/다루다’의 관계적 의미가 강하므로, 현대 한국어에서도 그 뜻이 드러나는 ‘다루지 마시고’를 택했습니다.
- source_word: κατὰ τὰς πονηρίας ἡμῶν
  english_pob_choice: according to our wickedness
  chosen_korean: 우리의 악함에 따라
  alternatives_korean:
  - 우리의 악행에 따라
  - 우리의 사악함에 따라
  lexicon: LSJ
  rationale: πoνηρία의 복수는 악한 행위들의 누적을 가리키지만, 한국어에서는 집합적 표현인 ‘악함’이 가장 자연스럽고 원문의 도덕적 무게를 유지합니다.
- source_word: κατὰ τὸ ἔλεός σου
  english_pob_choice: according to your mercy
  chosen_korean: 당신의 자비에 따라
  alternatives_korean:
  - 당신의 긍휼에 따라
  - 당신의 자비를 따라
  lexicon: LSJ
  rationale: ἔλεος는 ‘자비/긍휼’로 옮길 수 있으나, 본문의 대조 구조에서 현대 한국어의 직접적이고 명료한 대응인 ‘자비’가 적절합니다.
theological_decisions:
- issue: 회개의 청원 구조
  chosen_reading: 죄에 합당한 대우를 구하지 않고, 자비에 따른 대우를 구하는 탄원으로 그대로 옮겼습니다.
  alternative_readings:
  - 회개문처럼 풀어쓰는 해석
  - 하나님의 공의와 자비를 설명을 덧붙이는 번역
  rationale: 그리스어는 정죄를 인정하면서도 자비를 호소하는 짧은 청원문이므로, 설명을 덧붙여 긴장감을 풀지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
