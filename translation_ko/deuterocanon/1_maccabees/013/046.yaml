translation:
  language: ko
  text: 그리고 그들이 말했습니다. “우리의 악함에 따라 우리를 다루지 마시고, 오히려 당신의 자비에 따라 다루소서.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
