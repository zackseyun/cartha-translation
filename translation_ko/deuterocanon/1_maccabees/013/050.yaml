  source_fidelity: ‘화친의 오른손’은 원문의 ‘오른손들’ 관용구와 연관되지만, ‘화친’은 그리스어가 명시하지 않는 화해·평화 조약의 내용을 덧붙입니다. δεξιὰς λαβεῖν은 신의 또는 안전에 관한 공식적 보증을 요청하는 뜻으로 자연스럽게 옮기는 편이 충실합니다. ἔδωκεν αὐτοῖς의 생략된 목적어도 한국어에서는 ‘그 보증을 해 주었다’로 명시할 수 있습니다. ‘부정한 것들’은 복수형 μιασμάτων 및 의례적 오염의 뉘앙스를 보존합니다.
  naturalness: 현 문장은 ‘화친의 오른손을 받아 달라고’와 ‘그 더러움에서 정결하게 하다’가 현대 표준 한국어에서 다소 부자연스럽습니다. 관용구의 뜻을 본문에서 명료하게 제시하고, 주석에서 문자적 표현을 설명하면 읽기 쉽고 격식 있는 합쇼체가 됩니다.
  terminology: ‘성채’는 ἄκρα에 적절하며, ‘아크라’라는 역사적 지명 가능성은 주석으로 유지하는 것이 좋습니다. μίασμα에는 단순한 물리적 더러움보다 ‘부정한 것들’이 종교·의례적 뉘앙스를 더 잘 전달합니다.
