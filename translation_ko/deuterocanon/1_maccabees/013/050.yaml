base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/050.yaml
  text: And they cried out to Simon to receive pledges of good faith[a], and he gave them to them, and he drove them out from there[b], and he cleansed the citadel from its defilements.
  footnotes:
  - marker: a
    text: Greek literally, 'to receive right hands,' an idiom for receiving assurances or pledges of good faith.
    reason: lexical_alternative
  - marker: b
    text: Or 'the Akra,' the fortified citadel in Jerusalem.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그들은 시몬에게 화친의 오른손을 받아 달라고 외쳤고, 그는 그것을 그들에게 주었으며, 그들을 그곳에서 내쫓고 그 성채를 그 더러움에서 정결하게 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘오른손을 받다’이며, 화친·보증을 뜻하는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘아크라’로, 예루살렘의 요새화된 성채를 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐβόησαν πρὸς Σίμωνα
  english_pob_choice: they cried out to Simon
  chosen_korean: 시몬에게 외쳤고
  alternatives_korean:
  - 시몬에게 부르짖었고
  - 시몬에게 크게 외쳤고
  lexicon: LSJ
  rationale: βοάω의 강한 음성적 호소를 살리되, 한국어에서는 자연스럽게 “외쳤고”로 옮겨 긴급한 요청의 뉘앙스를 유지했습니다.
- source_word: δεξιὰς λαβεῖν
  english_pob_choice: to receive pledges of good faith
  chosen_korean: 화친의 오른손을 받아 달라고
  alternatives_korean:
  - 오른손을 받아 달라고
  - 우호의 오른손을 받아 달라고
  - 화친의 보증을 받아 달라고
  lexicon: LSJ
  rationale: 직역하면 “오른손”이지만, 문맥상 언약적/외교적 보증을 뜻하는 관용구이므로 의미를 드러내는 방향으로 “화친의 오른손”을 택했습니다.
- source_word: ἐξέβαλεν αὐτοὺς ἐκεῖθεν
  english_pob_choice: he drove them out from there
  chosen_korean: 그들을 그곳에서 내쫓고
  alternatives_korean:
  - 그들을 그곳에서 몰아내고
  - 그들을 그곳에서 쫓아내고
  - 그들을 그곳에서 내몰고
  lexicon: LSJ
  rationale: ἐξέβαλεν의 강한 추방·축출 의미를 살려 “내쫓다”로 옮겼습니다.
- source_word: τὴν ἄκραν
  english_pob_choice: the citadel
  chosen_korean: 그 성채
  alternatives_korean:
  - 그 요새
  - 아크라
  - 그 감시탑
  lexicon: LSJ
  rationale: 본문의 일반명사적 뜻을 살려 “성채”로 번역하되, 역사적 고유명사 가능성은 본문에 과도하게 넣지 않았습니다.
- source_word: ἀπὸ τῶν μιασμάτων
  english_pob_choice: from its defilements
  chosen_korean: 그 더러움에서 정결하게 했습니다
  alternatives_korean:
  - 그 부정함에서 정결하게 했습니다
  - 그 오염에서 깨끗하게 했습니다
  - 그 더러움에서 깨끗하게 했습니다
  lexicon: LSJ
  rationale: μίασμα의 종교적·의례적 오염 의미를 살리면서, 한국어에서는 “정결하게 하다”가 가장 직접적으로 그 정화 행위를 전달합니다.
theological_decisions:
- issue: δεξιὰς λαβεῖν의 관용구를 어떻게 옮길지
  chosen_reading: 화친의 오른손을 받아 달라고
  alternative_readings:
  - 오른손을 받아 달라고
  - 화평의 오른손을 받아 달라고
  rationale: 단순한 신체 접촉이 아니라 상호 보증과 화해를 뜻하는 표현이므로, 관용적 의미를 드러내되 원문의 손 이미지도 남겼습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 6
- issue: τὴν ἄκραν의 일반명사와 고유명사 가능성
  chosen_reading: 그 성채
  alternative_readings:
  - 아크라
  - 그 요새
  rationale: 이 절에서는 문맥상 요새/성채라는 기능이 우선이므로 본문에는 일반명사로 두고, 역사적 장소명 해석은 주석적 차원에 맡겼습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§5, 6
