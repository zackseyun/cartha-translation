revisions:
- from: 그리고 그들은 시몬에게 화친의 오른손을 받아 달라고 외쳤고, 그는 그것을 그들에게 주었으며, 그들을 그곳에서 내쫓고 그 성채를 그 더러움에서 정결하게 했습니다.[a][b]
  to: 그들은 시몬에게 신의의 보증을 해 달라고 소리쳐 청하였습니다.[a] 시몬은 그들에게 그 보증을 해 주었으며, 그들을 그곳에서 내쫓고 그 성채[b]에서 부정한 것들을 없애 정결하게 하였습니다.
  rationale: 화친이라는 추가 의미를 제거하고 관용구의 기능인 공식적 보증을 본문에 반영했습니다. 생략된 목적어는 앞선 보증을 받아 자연스럽게 보충했으며, 성채 정화는 복수의 의례적 부정을 제거하는 행위로 표현했습니다. 각주 표지는 각각의 관련 어구 뒤로 옮겼습니다.
