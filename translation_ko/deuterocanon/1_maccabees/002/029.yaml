  lexicon: LSJ
  rationale: ἔρημος의 성서적·역사적 뉘앙스를 살리면서도 단순한 지리적 사막보다 넓은 무인 지역을 가리키는 ‘광야’가 적합합니다.
- source_word: καθίσαι ἐκεῖ
  english_pob_choice: to settle there
  chosen_korean: 그곳에 자리 잡았습니다
