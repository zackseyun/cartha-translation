  text: And they said to them[a], “Until now—come out and do according to the word of the king[b], and you will live.”
  footnotes:
  - marker: a
    text: Or “Until now.” The Greek opening is terse and may signal a final chance to comply.
    reason: lexical_alternative
  - marker: b
