  yaml_path: translation/deuterocanon/1_maccabees/002/033.yaml
  text: And they said to them[a], “Until now—come out and do according to the word of the king[b], and you will live.”
  footnotes:
  - marker: a
    text: Or “Until now.” The Greek opening is terse and may signal a final chance to comply.
    reason: lexical_alternative
  - marker: b
    text: “According to the word of the king” could also be rendered “according to the command of the king.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들이 그들에게 말하였습니다. “지금까지는—나와서 왕의 말대로 하십시오. 그러면 살게 될 것입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “지금까지는”은 그리스어의 간결한 시간 표현을 살린 것으로, 더 자연하게는 “이제까지”로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: “왕의 말”은 문맥상 “왕의 명령”으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕως τοῦ νῦν
  english_pob_choice: Until now
  chosen_korean: 지금까지는
  alternatives_korean:
  - 지금까지
  - 이제까지
  lexicon: LSJ
  rationale: 짧고 단호한 시간 한계를 한국어로 자연스럽게 살리되, ‘지금까지는’으로 마지막 기회라는 뉘앙스를 유지했습니다.
- source_word: ἐξέλθοντες
  english_pob_choice: come out
  chosen_korean: 나와서
  alternatives_korean:
  - 나오고
  - 밖으로 나와
  lexicon: LSJ
  rationale: 분사형의 촉구를 한국어 명령 흐름 속에서 ‘나와서’로 옮겨, 숨거나 머무는 상태에서 벗어나라는 직접성을 살렸습니다.
- source_word: κατὰ τὸν λόγον τοῦ βασιλέως
  english_pob_choice: according to the word of the king
  chosen_korean: 왕의 말대로
  alternatives_korean:
  - 왕의 명령대로
  - 왕의 말씀대로
  lexicon: LSJ
  rationale: λόγος의 기본 뜻인 ‘말’을 유지하면서도, 문맥상 왕의 요구를 따르라는 뜻이 분명하므로 한국어에서는 ‘말대로’가 가장 간결하고 원문에 가깝습니다.
- source_word: ζήσεσθε
  english_pob_choice: you will live
  chosen_korean: 살게 될 것입니다
  alternatives_korean:
  - 살 것입니다
  - 목숨을 건지게 될 것입니다
  lexicon: LSJ
  rationale: 미래형의 약속/조건을 한국어에서 자연스럽게 풀어, 단순 생존의 가능성과 생명의 보장을 함께 드러냈습니다.
