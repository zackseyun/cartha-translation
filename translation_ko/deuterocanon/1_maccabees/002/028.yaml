lexical_decisions:
- source_word: ἐγκατέλιπον
  english_pob_choice: they left behind
  chosen_korean: 남겨 두었습니다
  alternatives_korean:
  - 버려 두었습니다
  - 두고 왔습니다
  - 내버려 두었습니다
  lexicon: ἐγκαταλείπω
  rationale: 영어 POB의 ‘left behind’를 따라 단순한 ‘버리다’보다 의도적인 포기까지 강하게 단정하지 않는 ‘남겨 두다’로 옮겼습니다.
- source_word: τὰ ὄρη
  english_pob_choice: the mountains
  chosen_korean: 산으로
  alternatives_korean:
  - 산들로
  - 산지로
  lexicon: ὄρος
  rationale: 복수형의 집합적 의미를 자연스러운 한국어로 풀어 ‘산으로’라고 옮겼습니다.
- source_word: οἱ υἱοὶ αὐτοῦ
  english_pob_choice: his sons
  chosen_korean: 아들들과 함께
  alternatives_korean:
  - 그의 아들들과 함께
  - 아들들과
  lexicon: υἱός
  rationale: 본문의 아들들을 자연스럽게 드러내되, 소유격 관계는 한국어에서 이미 ‘그의’로 중복되지 않도록 했습니다.
- source_word: ὅσα εἶχον ἐν τῇ πόλει
  english_pob_choice: whatever they had in the city
  chosen_korean: 성읍에 있던 그들의 소유를 모두
  alternatives_korean:
  - 성읍에 있던 가진 것들을 모두
  - 도시에 있던 그들이 가진 모든 것을
  lexicon: ὅσα + εἶχον
  rationale: ‘무엇이든 그들이 가지고 있던 것’의 범위를 살리기 위해 ‘그들의 소유를 모두’로 옮겨 소지품과 재산을 포괄했습니다.
