  source_fidelity: 첫 절은 μὴ φοβηθῆτε와 λόγου를 충실히 옮겼습니다. 그러나 ἀνδρός의 남성 단수는 '죄인인 사람'에서 희미해졌고, εἰς κόπρια καὶ εἰς σκώληκας가 나타내는 비참한 귀결은 단순 동격 서술인 '배설물과 구더기입니다'보다 결과를 드러내어 옮기는 편이 정확합니다. σκώληκας는 문맥상 구더기를 포함할 수 있으나, 원문의 포괄성과 영어 감사 번역을 따라 '벌레'가 안전합니다.
  naturalness: '''죄 많은 남자의 말''과 ''배설물과 벌레로 끝날 것입니다''는 현대 표준어 합쇼체에서 자연스럽고, 본문의 준엄한 경고 어조를 유지합니다. ''죄인인 사람''은 다소 중복적이며, ''영광은 배설물과 구더기입니다''는 한국어에서 영광과 사물의 직접 동일시로 읽혀 다소 부자연스럽습니다.'
  terminology: '''영광''은 δόξα의 높고 아이러니한 어조를 잘 보존합니다. κόπρια에는 ''배설물'', σκώληκας에는 특정한 ''구더기''보다 넓은 ''벌레''를 사용합니다. ἀνήρ의 남성 단수는 ''남자''로 반영하되, 신학적 해석을 덧붙이지 않았습니다.'
  issues:
