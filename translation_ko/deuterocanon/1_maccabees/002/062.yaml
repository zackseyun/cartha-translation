translation:
  language: ko
  text: 그리고 죄 많은 남자의 말을 두려워하지 마십시오. 그의 영광은 배설물과 벌레로 끝날 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '죄 많은 남자가 하는 말을 두려워하지 마십시오.' 그리스어는 문자적으로 '죄 많은 남자의 말로부터'라고 되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ φοβηθῆτε
  english_pob_choice: do not fear
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 무서워하지 마십시오
  - 겁내지 마십시오
  lexicon: LSJ
  rationale: 부정 명령의 직접성을 살리면서 현대 한국어에서 가장 자연스럽고 공적 문체에 맞게 옮겼습니다.
- source_word: λόγου
  english_pob_choice: the word
  chosen_korean: 말
  alternatives_korean:
  - 말씀
  - 발언
  - 하는 말
  lexicon: LSJ
  rationale: ἀπό + λόγου는 문자 그대로는 '말로부터/말에 대하여'이지만, 문맥상 죄인의 발화 내용을 가리키므로 한국어에서는 간결하게 '말'이 가장 자연스럽습니다.
- source_word: ἀνδρὸς ἁμαρτωλοῦ
  english_pob_choice: of a sinful man
  chosen_korean: 죄인인 사람
  alternatives_korean:
  - 죄인인 남자
  - 죄 많은 사람
  lexicon: LSJ
  rationale: ἀνήρ는 남성을 가리키지만 한국어에서는 남성성 자체보다 죄성의 성격이 더 핵심이므로, 어색한 직역을 피하면서도 원문의 '사람'을 유지했습니다.
- source_word: δόξα
  english_pob_choice: glory
  chosen_korean: 영광
  alternatives_korean:
  - 명예
  - 체면
  - 영화
  lexicon: LSJ
  rationale: 문맥의 아이러니를 살리기 위해 '명예'보다 격조가 높은 '영광'을 택했고, 뒤의 부정한 결말과 대비가 분명해집니다.
- source_word: εἰς κόπρια καὶ εἰς σκώληκας
  english_pob_choice: is for dung and worms
  chosen_korean: 배설물과 구더기입니다
  alternatives_korean:
  - 똥과 벌레입니다
  - 분뇨와 벌레입니다
  lexicon: LSJ
  rationale: 출구를 향한 전치사 εἰς의 반복은 한국어에서 '...입니다'로 과도한 해석 없이 종결시키는 것이 가장 자연스럽습니다. κόπρια는 문맥상 부패·모욕의 이미지를 살리는 '배설물'이 적절하고, σκώληκας는 시체 부패를 드러내는 '구더기'가 더 구체적입니다.
theological_decisions:
- issue: 반복되는 εἰς의 처리와 결말 이미지의 강도
  chosen_reading: 직설적 부패 이미지인 '배설물과 구더기'를 유지했습니다.
  alternative_readings:
  - 영광은 헛되이 사라집니다
  - 영광은 썩어 없어집니다
  - 영광은 분뇨와 벌레가 됩니다
  rationale: 이 경고의 힘은 죄인의 영광이 결국 얼마나 비참하고 더럽게 끝나는지에 있습니다. 완곡한 표현은 본문의 조롱과 경고를 약화시킵니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 1, 6
