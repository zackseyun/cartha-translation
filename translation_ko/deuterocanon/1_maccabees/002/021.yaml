  - 법도
  lexicon: LSJ
  rationale: 유대인의 언약적 규범을 가리키므로, 일반적인 ‘법’보다 성경적·공동체적 함의를 지닌 ‘율법’이 적절합니다.
- source_word: δικαιώματα
  english_pob_choice: the ordinances
  chosen_korean: 규례들
  alternatives_korean:
