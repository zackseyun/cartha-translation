translation:
  language: ko
  text: 우리가 율법과 규례들을 버리다니, 결코 그럴 수 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “우리가 율법과 규례들을 버리는 일에 대하여 우리에게 자비로우시기를”입니다. 그리스어는 어떤 행동을 강하게 거부하는 관용구를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵλεως ἡμῖν
  english_pob_choice: Far be it from us
  chosen_korean: 결코 있을 수 없습니다
  alternatives_korean:
  - 우리가 그런 일을 하다니 말도 안 됩니다
  - 그럴 수 없습니다
  lexicon: LSJ
  rationale: ἵλεως ἡμῖν은 단순한 ‘긍휼’ 요청이 아니라 어떤 행동을 강하게 거부하는 관용구이므로, 한국어에서는 부정의 강도를 살린 표현으로 옮겼습니다.
- source_word: καταλεῖπειν
  english_pob_choice: to abandon
  chosen_korean: 버리는
  alternatives_korean:
  - 떠나는
  - 저버리는
  lexicon: LSJ
  rationale: 언약적 충성을 저버리는 뉘앙스를 살리기 위해 ‘버리다’를 택했고, 단순한 이탈보다 의도적 포기를 더 분명히 드러냅니다.
- source_word: νόμον
  english_pob_choice: the law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 법도
  lexicon: LSJ
  rationale: 유대인의 언약적 규범을 가리키므로, 일반적인 ‘법’보다 성경적·공동체적 함의를 지닌 ‘율법’이 적절합니다.
- source_word: δικαιώματα
  english_pob_choice: the ordinances
  chosen_korean: 규례들
  alternatives_korean:
  - 율례들
  - 규정들
  - 법규들
  lexicon: LSJ
  rationale: 율법에 속한 구체적 준수 조항들을 가리키는 말로 보고, 한국어 성경에서 익숙한 ‘규례들’을 사용해 ‘율법’과의 병렬을 살렸습니다.
theological_decisions:
- issue: 율법과 규례들의 언약적 무게
  chosen_reading: 이 구절은 압박 아래서 조상들의 유대 율법을 저버리지 않겠다는 충성을 선언하는 말로 읽었습니다.
  alternative_readings:
  - 일반적인 종교 규정 준수 선언으로 읽기
  - 윤리적 원칙 준수로 완화해 읽기
  rationale: 문맥상 ‘율법과 규례들’은 단순한 규칙이 아니라 이스라엘의 언약적 정체성을 지키는 대상이므로, 그 무게를 유지해 번역했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 5
