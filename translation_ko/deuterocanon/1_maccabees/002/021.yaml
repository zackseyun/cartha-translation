  - 그럴 수 없습니다
  lexicon: LSJ
  rationale: ἵλεως ἡμῖν은 단순한 ‘긍휼’ 요청이 아니라 어떤 행동을 강하게 거부하는 관용구이므로, 한국어에서는 부정의 강도를 살린 표현으로 옮겼습니다.
