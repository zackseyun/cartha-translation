  lexicon: LSJ
  rationale: 율법에 속한 구체적 준수 조항들을 가리키는 말로 보고, 한국어 성경에서 익숙한 ‘규례들’을 사용해 ‘율법’과의 병렬을 살렸습니다.
theological_decisions:
- issue: 율법과 규례들의 언약적 무게
  chosen_reading: 이 구절은 압박 아래서 조상들의 유대 율법을 저버리지 않겠다는 충성을 선언하는 말로 읽었습니다.
  alternative_readings:
  - 일반적인 종교 규정 준수 선언으로 읽기
  - 윤리적 원칙 준수로 완화해 읽기
  rationale: 문맥상 ‘율법과 규례들’은 단순한 규칙이 아니라 이스라엘의 언약적 정체성을 지키는 대상이므로, 그 무게를 유지해 번역했습니다.
