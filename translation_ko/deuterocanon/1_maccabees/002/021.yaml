  rationale: 언약적 충성을 저버리는 뉘앙스를 살리기 위해 ‘버리다’를 택했고, 단순한 이탈보다 의도적 포기를 더 분명히 드러냅니다.
- source_word: νόμον
  english_pob_choice: the law
  chosen_korean: 율법
