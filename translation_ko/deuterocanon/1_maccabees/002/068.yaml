    rationale: ἀνταπόδομα는 여기서 단순한 긍정적 ‘보상’이 아니라 행위에 상응하는 갚음/보응을 뜻합니다. ‘보복의 보상’은 이중적이고 어색한 표현이며, ‘갚아 주다’의 수혜적 뉘앙스도 불필요합니다.
