  source_fidelity: 첫 절의 ‘보복의 보상을 갚아 주고’는 ἀνταποδίδοτε ἀνταπόδομα의 동족어 강조를 반영하려 하나, ‘보상’은 수혜적·중립적 의미가 강하고 ‘보복의 보상’은 원문에 없는 의미 관계를 만들며 한국어로도 부자연스럽습니다. ‘보응을 갚으십시오’는 상응하는 응징적 갚음과 명사 목적어의 강조를 더 충실히 드러냅니다. δεύτε 절은 προσέχετε의 ‘주의 깊게 유의하다’와 προστάγματα τοῦ νόμου의 의미를 적절히 보존합니다.
  naturalness: ‘보응을 갚으십시오’는 다소 격식 있는 성서 문체이지만 현대 공식 문체 안에서 이해 가능하며, 기존의 ‘보복의 보상을 갚아 주고’보다 훨씬 자연스럽습니다. 접속도 두 명령을 균형 있게 연결하도록 ‘갚으십시오. 그리고’로 정리했습니다.
  terminology: ‘민족들’은 ἔθνη의 민족·정치적 집단이라는 폭을 보존하며, ‘이방인’으로 한정하지 않습니다. νόμος는 이 문맥상 ‘율법’이 적절하고, προστάγματα는 ‘명령들’로 유지합니다. ἀνταπόδομα에는 ‘보상’보다 문맥상 더 적합한 ‘보응’을 사용합니다.
