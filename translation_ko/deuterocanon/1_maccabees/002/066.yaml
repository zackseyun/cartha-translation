translation:
  language: ko
  text: 유다 마카베오 자신은 젊은 시절부터[a] 큰 힘을 지닌 사람이니, 그가 여러분의 군대 지휘관이 될 것이며, 여러분은 민족들과 전쟁을 치를 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 본문은 문자적으로 ‘그에게서, 그의 젊은 시절부터 힘에 강한’에 가까운 난해한 표현입니다. 본문은 유다가 젊은 시절부터 강했다는 분명한 뜻을 따라 옮겼습니다.
    reason: textual_variant
lexical_decisions:
- source_word: Ἰούδας ὁ Μακκαβαῖος
  english_pob_choice: Judas Maccabeus
  chosen_korean: 마카베오 사람 유다
  alternatives_korean:
