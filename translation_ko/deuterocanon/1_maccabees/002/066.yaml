translation:
  language: ko
  text: 그리고 마카베오 사람 유다 자신은, 젊은 시절부터 능력에 강한 사람이니, 그가 여러분의 군대 지휘관이 될 것이며, 여러분은 민족들과의 전쟁을 치를 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 본문은 문자적으로는 ‘그에게서, 그의 젊은 시절부터 강한’에 가까워 다소 어색합니다. 본문은 분명한 뜻을 따라 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: Ἰούδας ὁ Μακκαβαῖος
  english_pob_choice: Judas Maccabeus
  chosen_korean: 마카베오 사람 유다
  alternatives_korean:
  - 유다 마카베오
  - 마카베오의 유다
  lexicon: 고유명사 처리
  rationale: Ἰούδας는 한국어 성경에서 통상 유다로 옮기되, ὁ Μακκαβαῖος는 별칭이므로 '마카베오 사람'으로 풀어 인물의 표지를 살렸습니다.
- source_word: ἰσχυρὸς δυνάμει
  english_pob_choice: strong in might
  chosen_korean: 능력에 강한
  alternatives_korean:
  - 힘이 센
  - 권능에 강한
  lexicon: LSJ
  rationale: δύναμις의 중첩적 강조를 반영하되, '능력에 강한'으로 과도하게 장엄하거나 신학적으로 치우치지 않게 했습니다.
- source_word: ἄρχοντα στρατιᾶς
  english_pob_choice: commander of the army
  chosen_korean: 군대 지휘관
  alternatives_korean:
  - 군대의 통솔자
  - 군대의 사령관
  lexicon: LSJ
  rationale: ἄρχων의 통치적 의미보다 여기서는 군사적 지휘 기능이 핵심이므로 현대 한국어로 자연스러운 '지휘관'을 택했습니다.
- source_word: πολεμήσετε πόλεμον
  english_pob_choice: you shall fight the battle
  chosen_korean: 전쟁을 치를 것입니다
  alternatives_korean:
  - 싸움을 하게 될 것입니다
  - 전투를 벌일 것입니다
  lexicon: LSJ
  rationale: 동사-명사 결합의 강조를 한국어에서 가장 자연스럽게 살리는 방식으로 옮겼습니다. POB 영어본의 'battle'은 한국어에서는 여기서 '전쟁을 치르다'가 더 직접적입니다.
- source_word: λαῶν
  english_pob_choice: the nations
  chosen_korean: 민족들
  alternatives_korean:
  - 나라들
  - 열국
  lexicon: LSJ
  rationale: λαοί는 '민족들' 또는 '백성들'이 가능하지만, 적대 집단을 가리키는 군사 문맥에서는 '민족들'이 가장 무난합니다.
theological_decisions:
- issue: ἐκ αὐτοῦ ἐκ νεότητος αὐτοῦ의 처리
  chosen_reading: 난해한 반복 전치사는 의미를 따라 '젊은 시절부터'로 풀어, 유다가 어린 시절부터 강했다고 이해되게 했습니다.
  alternative_readings:
  - '''그에게서, 그의 젊은 시절부터''처럼 더 문자적으로 옮김'
  - 원문의 어색함을 그대로 드러내는 직역
  rationale: 원문의 첫 ἐκ αὐτοῦ는 한국어로 그대로 재현하면 의미가 흐려지므로, 본문이 말하려는 칭찬의 요지를 보존하는 쪽을 택했습니다. 이는 교리 문제가 아니라 가독성과 의미 전달의 문제입니다.
  doctrine_reference: '번역 원칙: source primacy with recoverable sense'
