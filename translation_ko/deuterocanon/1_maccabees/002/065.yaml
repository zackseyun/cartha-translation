  text: And look, Simeon your brother—I know that he is a man of counsel. Listen to him all your days; he will be a father to you.
translation:
  language: ko
  text: 보십시오, 여러분의 형제 시므온은 내가 알기로는 지혜로운 사람입니다. 평생 그에게서 들으십시오. 그는 여러분에게 아버지와 같을 것입니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 직역하면 ‘사람’의 ‘모략/계획’이지만, 여기서는 지혜로운 판단과 조언 능력을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  english_pob_choice: And look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  - 봐라
  lexicon: ἰδοὺ
  rationale: 주의를 끄는 감탄사로서, 현대 합쇼체에서 자연스럽고 직접적인 호소를 살리기 위해 ‘보십시오’로 옮겼습니다.
- source_word: ἀνὴρ βουλῆς
  english_pob_choice: a man of counsel
  chosen_korean: 지혜로운 사람
  alternatives_korean:
  - 모략의 사람
  - 의논할 줄 아는 사람
  - 책략가
  lexicon: ἀνήρ / βουλή
  rationale: βουλή의 핵심을 단순한 ‘조언’보다 분별과 판단을 포함한 인격적 자질로 보아, 한국어에서는 자연스러운 ‘지혜로운 사람’으로 표현했습니다.
- source_word: πάσας τὰς ἡμέρας
  english_pob_choice: all your days
  chosen_korean: 평생
  alternatives_korean:
  - 모든 날에
  - 여생 동안
  - 날마다
  lexicon: πᾶς + ἡμέρα
  rationale: 직역보다 지속 기간을 한국어에서 가장 간결하게 드러내는 표현으로, 명령의 지속성을 살려 ‘평생’으로 옮겼습니다.
- source_word: ἔσται εἰς πατέρα
  english_pob_choice: he will be a father to you
  chosen_korean: 아버지와 같을 것입니다
  alternatives_korean:
  - 여러분의 아버지가 될 것입니다
  - 아버지가 되어 줄 것입니다
  lexicon: εἰς + πατήρ
  rationale: 문맥상 생물학적 아버지라기보다 지도자·보호자의 역할을 가리키므로, 관계적 의미를 살려 ‘아버지와 같을 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 시므온에 대한 아버지 역할의 의미
  chosen_reading: 혈연적 아버지라기보다 공동체를 돌보고 인도하는 아버지 같은 지도자로 이해했습니다.
  alternative_readings:
  - 실제 부친으로 이해하는 읽기
  - 단순한 존칭으로 약화하는 읽기
  rationale: 문맥의 권면과 후계 지시에서 상징적·목회적 의미가 분명하므로, 역할적 의미를 보존하는 것이 원문 의도를 더 잘 드러냅니다.
  doctrine_reference: 공동체 지도와 영적 돌봄의 비유적 언어
- issue: ὑμῶν / ὑμῖν의 복수 대상
  chosen_reading: 복수 مخاطب을 유지해 ‘여러분’으로 일관했습니다.
  alternative_readings:
  - 당신으로 단수화
  - 너희로 구어화
  rationale: 원문이 공동체 전체를 향해 말하므로 한국어에서도 복수 호칭을 분명히 해야 합니다.
  doctrine_reference: 본문의 수신자 보존
