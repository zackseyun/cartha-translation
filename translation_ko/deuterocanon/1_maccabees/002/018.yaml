base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/018.yaml
  text: Now then[a], come forward first and carry out the king’s command, as all the nations have done, and the rulers of Judah, and those left in Jerusalem; and you and your house will be among the king’s Friends[b], and you and your sons will be honored with silver and gold and many gifts.
  footnotes:
  - marker: a
    text: Or 'the king’s friends'; the Greek may refer to the royal court title 'Friends,' a recognized class of favored advisers and companions.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'many gifts' translates a term that can denote royal benefits or distributions; the sense here is additional rewards beyond silver and gold.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 먼저 나아가서 왕의 명령을 실행하십시오. 모든 민족과 유다의 통치자들, 그리고 예루살렘에 남아 있는 사람들처럼 하십시오. 그러면 당신과 당신의 집은 왕의 친구들 가운데 있게 될 것이며, 당신과 당신의 아들들은 은과 금과 많은 선물로 영광을 받을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모든 민족’으로 옮긴 말은 여기서 유다와 예루살렘에 대한 넓은 정치적 대조를 나타내며, 반드시 기술적 의미의 ‘이방인들’을 뜻하는 것은 아닙니다.
    reason: source_note
  - marker: b
    text: ‘왕의 친구들’은 헬레니즘 궁정에서 쓰인 공식적 호칭일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘많은 선물’에 해당하는 말은 은과 금 외에 추가 보상이나 배분을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν πρόσελθε πρῶτος
  english_pob_choice: Now then, come forward first
  chosen_korean: 이제 먼저 나아가서
  alternatives_korean:
  - 이제 첫째로 앞으로 나오십시오
  - 이제 먼저 다가오십시오
  lexicon: LSJ
  rationale: πρόσελθε는 단순한 ‘가까이 오다’보다 공개적으로 앞으로 나서는 뉘앙스가 있어 ‘나아가서’로 옮겼고, πρῶτος는 순서상 선행을 나타내므로 ‘먼저’로 간결하게 반영했습니다.
- source_word: ποίησον τὸ πρόσταγμα τοῦ βασιλέως
  english_pob_choice: carry out the king’s command
  chosen_korean: 왕의 명령을 실행하십시오
  alternatives_korean:
  - 왕의 명령을 따르십시오
  - 왕의 명령을 시행하십시오
  lexicon: LSJ
  rationale: πρόσταγμα은 권위 있는 명령이므로 ‘명령’으로 옮겼고, ‘carry out’의 실행/이행 의미를 살려 ‘실행하십시오’로 표현했습니다.
- source_word: τὰ ἔθνη, καὶ οἱ ἄρχοντες Ἰούδα, καὶ οἱ καταλειφθέντες ἐν Ἰερουσαλήμ
  english_pob_choice: the nations ... the rulers of Judah ... those left in Jerusalem
  chosen_korean: 모든 민족과 유다의 통치자들, 그리고 예루살렘에 남아 있는 사람들
  alternatives_korean:
  - 열국과 유다의 지도자들, 그리고 예루살렘에 남은 자들
  - 민족들과 유다의 관리들, 그리고 예루살렘에 남아 있는 이들
  lexicon: LSJ
  rationale: τὰ ἔθνη는 여기서 넓은 정치적 대조를 이루므로 ‘모든 민족’으로, ἄρχοντες는 통치 권위를 지닌 자들이므로 ‘통치자들’로, καταλειφθέντες는 남겨진 자들을 가리키므로 ‘남아 있는 사람들’로 옮겼습니다.
- source_word: τῶν φίλων τοῦ βασιλέως
  english_pob_choice: among the king’s Friends
  chosen_korean: 왕의 친구들 가운데
  alternatives_korean:
  - 왕의 친구들 가운데서
  - 왕의 벗들 가운데
  lexicon: LSJ
  rationale: Greek court title의 가능성을 유지하면서도 한국어에서 자연스럽게 읽히도록 직역에 가까운 ‘왕의 친구들 가운데’로 옮겼습니다.
- source_word: δοξασθήσεσθε ἀργυρίῳ καὶ χρυσῷ καὶ ἀποστολαῖς πολλαῖς
  english_pob_choice: will be honored with silver and gold and many gifts
  chosen_korean: 은과 금과 많은 선물로 영광을 받을 것입니다
  alternatives_korean:
  - 은과 금과 많은 선물로 존귀를 얻을 것입니다
  - 은과 금과 많은 선물로 높임을 받을 것입니다
  lexicon: LSJ
  rationale: δοξασθήσεσθε는 이 문맥에서 신적 ‘영광’이 아니라 왕이 주는 지위 상승과 보상을 뜻하므로 ‘영광을 받을 것입니다’로 살리되, 수단격 배열을 그대로 반영했습니다.
theological_decisions:
- issue: τῶν φίλων τοῦ βασιλέως의 궁정 칭호 가능성
  chosen_reading: 본문에는 자연스러운 한국어로 ‘왕의 친구들 가운데’라고 두되, 궁정 칭호로서의 함의를 보존합니다.
  alternative_readings:
  - 왕의 친구들 가운데
  - 왕의 측근들 가운데
  rationale: 본문은 정치적 유인책을 제시하는 장면이므로, 지나친 해설 없이도 헬레니즘 궁정의 공식적 ‘친구들’ 개념을 드러낼 수 있는 표현이 적절합니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: δοξασθήσεσθε의 의미
  chosen_reading: ‘영광을 받을 것입니다’로 번역하되, 여기서의 영광은 신학적 영화가 아니라 왕의 보상과 명예 부여입니다.
  alternative_readings:
  - 존귀를 얻을 것입니다
  - 높임을 받을 것입니다
  rationale: 문맥상 은·금·선물과 병렬되는 정치적 보상으로서의 명예이므로, 독자가 오해하지 않도록 의미를 분명히 했습니다.
  doctrine_reference: Translation philosophy §1, §5
