  text: And you[a], gather to yourselves all who practice the law[b], and take vengeance for your people.
  footnotes:
  - marker: a
    text: Or 'all the doers of the law.' The Greek expression is more literally 'all the doers/practitioners of the law.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'avenge vengeance of your people,' a Greek cognate construction intensifying the command to avenge them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너희는 율법을 실천하는 모든 사람을[a] 너희 곁으로 불러모으고, 너희 백성을 위해 복수하십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '율법을 행하는 모든 사람'입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 직역하면 '너희 백성의 복수를 복수하라'는 동족어 반복으로, 복수하라는 명령을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσάξετε πρὸς ὑμᾶς
  english_pob_choice: gather to yourselves
  chosen_korean: 너희에게 모으고
  alternatives_korean:
  - 너희에게 데려오고
  - 너희 편으로 끌어모으고
  - 너희 곁으로 모으고
  lexicon: LSJ
  rationale: 사람들을 자기 편과 자기 무리 안으로 불러모으는 동작을 자연스러운 현대 한국어로 옮겼습니다. '모으다'는 집결의 의미를 살리면서도 과도하게 해석하지 않습니다.
- source_word: πάντας τοὺς ποιητὰς τοῦ νόμου
  english_pob_choice: all who practice the law
  chosen_korean: 율법을 실천하는 사람들 모두
  alternatives_korean:
  - 율법을 지키는 사람들 모두
  - 율법의 행위자들 모두
  - 율법을 행하는 모든 사람들
  lexicon: LSJ
  rationale: ποιηταί는 '만드는 사람'이 아니라 '행하는 사람/실천하는 사람'이므로, Maccabean 유대 문맥에서 '율법을 실천하는 사람들'로 옮겨 의미를 분명히 했습니다.
- source_word: ἐκδικήσατε ἐκδίκησιν
  english_pob_choice: take vengeance
  chosen_korean: 원수를 갚으십시오
  alternatives_korean:
  - 복수하십시오
  - 원한을 갚으십시오
  - 보복하십시오
  lexicon: LSJ
  rationale: 그리스어의 동족 목적어 구조가 강한 응보 명령을 강조하지만, 한국어에서는 과도한 직역보다 '원수를 갚다'가 명령의 힘을 가장 자연스럽게 전달합니다.
- source_word: τοῦ λαοῦ ὑμῶν
  english_pob_choice: for your people
  chosen_korean: 너희 백성을 위해
  alternatives_korean:
  - 너희 백성을 위하여
  - 너희 ժողովրդի를 위해
  - 너희 백성의 일로
  lexicon: LSJ
  rationale: 문법적으로는 '너희 백성의'에 가깝지만, 한국어에서는 행위의 목적/대상을 드러내는 '위해'가 더 자연스럽고, 원문의 대리적 의미도 유지합니다.
theological_decisions:
- issue: 율법의 번역어 선택
  chosen_reading: 율법
  alternative_readings:
