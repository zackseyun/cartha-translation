  - 법
  - 토라
  rationale: 마카베오기 문맥의 τοῦ νόμου는 유대 전통의 토라를 가리키므로, POB 기본 용례에 따라 '율법'을 사용했습니다. 대문자화 없이도 문맥상 충분히 식별됩니다.
