translation:
  language: ko
  text: 그가 그들에게 복을 빌어 주고, 그의 조상들에게로 더해졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 조상들에게로 더해졌습니다’이며, 이는 죽음을 가리키는 전통적 관용구입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ηὐλόγησεν
  english_pob_choice: blessed
  chosen_korean: 복을 빌어 주고
  alternatives_korean:
  - 축복하고
  - 복을 내리고
  - 복을 빌어 주셨고
  lexicon: LSJ
  rationale: 여기서는 일반적인 종교적 ‘축복’ 행위보다 사람들에게 복을 선언해 주는 동작이므로, 동사성을 살린 ‘복을 빌어 주고’가 원문의 행위를 비교적 직접적으로 드러냅니다.
- source_word: προσετέθη
  english_pob_choice: was added
  chosen_korean: 더해졌습니다
  alternatives_korean:
  - 추가되었습니다
  - 더하여졌습니다
  - 합쳐졌습니다
  lexicon: LSJ
  rationale: προστίθημι의 기본 의미를 살려 ‘더해지다’로 옮겼습니다. 죽음 관용구로 읽을 여지는 남기되, 원문의 표면 의미를 흐리지 않도록 했습니다.
- source_word: πρὸς τοὺς πατέρας αὐτοῦ
  english_pob_choice: to his fathers
  chosen_korean: 그의 조상들에게로
  alternatives_korean:
  - 그의 아버지들에게로
  - 그의 선조들에게로
  - 조상들 곁으로
  lexicon: LSJ
  rationale: 죽음을 가리키는 관용구를 한국어에서 바로 알아볼 수 있게 하면서도, ‘πατέρες’를 직역해 ‘아버지들’로 좁히지 않기 위해 ‘조상들’로 옮겼습니다.
theological_decisions:
- issue: 죽음 관용구 προσετέθη πρὸς τοὺς πατέρας αὐτοῦ의 처리
  chosen_reading: ‘더해졌습니다’로 본문을 유지하여 죽음의 완곡 표현과 표면 의미를 함께 남김
  alternative_readings:
  - ‘조상들에게로 거두어졌습니다’
  - ‘조상들 곁으로 모여들었습니다’
  rationale: 이 표현은 성경적 죽음 관용구이지만, 본문은 그 관용구를 직접적으로 재현합니다. 한국어 본문도 이를 너무 풀어 쓰지 않고, 원문의 문장 구조를 따라 긴장을 유지했습니다.
  doctrine_reference: 표현상의 긴장 보존; 죽음 관용구의 직설성과 전통적 완곡성을 함께 드러냄
