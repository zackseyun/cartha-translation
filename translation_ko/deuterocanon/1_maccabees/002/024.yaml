  to: 그리고 마타티아스가 그것을 보고 열심을 품었으며, 그의 속이 떨렸습니다.[a] 그는 판결에 따라[b] 분노를 터뜨렸으며, 달려가 그를 제단 위에서 잡아 죽였습니다.
