  text: And Mattathias saw it and was zealous, and his inward parts trembled, and he brought up wrath according to the judgment, and running up he slaughtered him on the altar.
  footnotes:
  - marker: a
    text: Literally, 'his kidneys trembled,' a Hebrew-style expression for deep inner agitation or emotion.
    reason: cultural_note
  - marker: b
    text: Or 'as the judgment required' / 'in accordance with the ordinance.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 마타티아스가 그것을 보고 열심을 품었으며, 그의 속이 떨렸습니다.[a] 그는 판결에 따라[b] 분노를 터뜨렸으며, 달려가 그를 제단 위에서 잡아 죽였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “그의 신장들이 떨렸다”는 뜻으로, 히브리식 표현에서 깊은 내적 동요를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 또는 “심판에 따라” 또는 “규정에 따라”로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήλωσεν
  english_pob_choice: was zealous
  chosen_korean: 열심을 품었고
  alternatives_korean:
  - 질투했습니다
  - 열심히 분개했습니다
  - 분노했습니다
  lexicon: LSJ
  rationale: ζηλόω는 단순 감정보다 언약적 열심과 격분을 함께 담을 수 있으므로, 본문이 지닌 열심의 뉘앙스를 살려 ‘열심을 품었고’로 옮겼습니다.
- source_word: οἱ νεφροὶ αὐτοῦ
  english_pob_choice: his inward parts
  chosen_korean: 그의 속이 떨렸으며
  alternatives_korean:
  - 그의 내장들이 떨렸으며
  - 그의 신장들이 떨렸으며
  - 그의 속사람이 떨렸으며
  lexicon: LSJ
  rationale: 직역하면 ‘그의 신장들’이지만, 히브리식 내적 동요를 가리키는 관용을 한국어로 자연스럽게 드러내기 위해 ‘그의 속이 떨렸으며’로 처리했습니다.
- source_word: ἀνήνεγκεν θυμὸν
  english_pob_choice: he brought up wrath
  chosen_korean: 분노를 일으켰고
  alternatives_korean:
  - 분노를 끌어올렸고
  - 분노를 쏟았고
  - 분노를 표출했고
  lexicon: LSJ
  rationale: 동사적 이미지(‘올려 바치다/일으키다’)와 θυμός의 격렬함을 함께 살리면서도 한국어로는 ‘분노를 일으키다’가 가장 자연스럽고 덜 약화됩니다.
- source_word: κατὰ τὸ κρίμα
  english_pob_choice: according to the judgment
  chosen_korean: 심판에 따라
  alternatives_korean:
  - 판결에 따라
  - 판정에 따라
  - 그 심판에 따라
  lexicon: LSJ
  rationale: κρίμα는 판단/판결/심판을 아우르므로, 이 문맥의 공적·재판적 성격을 살려 ‘심판에 따라’로 옮겼습니다.
- source_word: ἔσφαξεν
  english_pob_choice: slaughtered
  chosen_korean: 죽였습니다
  alternatives_korean:
  - 도살했습니다
  - 도륙했습니다
  - 잡아죽였습니다
  lexicon: LSJ
  rationale: σφάζω는 매우 거친 살해를 뜻하지만, 한국어에서는 제단 위에서의 즉각적 살해 장면을 유지하면서도 문체상 과도하게 잔혹한 어휘를 피하기 위해 ‘죽였습니다’로 옮겼습니다.
theological_decisions:
- issue: 본절의 ‘열심’과 ‘심판’의 관계를 어떻게 드러낼 것인가
  chosen_reading: 열심과 분노, 그리고 심판을 서로 구분된 요소로 함께 보존했습니다.
  alternative_readings:
  - ‘의분을 품어’로 통합해 윤리적 행위처럼 정리하기
  - ‘율법대로 처형했다’로 해석을 앞세우기
  rationale: 본문은 마타티아스의 행위를 열심과 분노, 심판의 언어로 묘사하며 긴장을 남깁니다. 한국어도 이 긴장을 풀지 않고 그대로 드러내는 편이 원문의 힘을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; original-language primacy over translation tradition.'
