  source_fidelity: ‘죽였습니다’는 σφάζω가 지닌 거칠고 희생제의적일 수 있는 살해의 뉘앙스를 다소 약화합니다. 또한 δραμών은 단지 ‘달려’라는 신속한 행동을 뜻하므로 ‘달려 올라가’의 ‘올라가’는 본문에 명시되지 않은 방향성을 더합니다. κρίμα는 ‘심판’보다 여기서 ‘판결’이 더 자연스럽게 재판적 의미를 보존합니다.
  naturalness: ‘분노를 일으켰고’는 한국어에서 분노를 야기했다는 뜻으로도 읽혀, 마타티아스 자신이 분노를 표출했다는 문맥에 덜 자연스럽습니다. ‘분노를 터뜨렸으며’가 현대 한국어로 자연스럽습니다. 각주 표지는 해당 어구 바로 뒤에 놓아야 합니다.
  terminology: ‘열심을 품었으며’는 ζηλόω의 열심/격분의 긴장을 유지합니다. ‘속이 떨렸으며’는 νεφροί의 관용적 의미를 자연스럽게 전달하고, 각주에서 문자적 ‘신장들’을 밝혀 보완합니다. ‘판결’은 κρίμα의 법적 의미를 보존하되 그것이 어떤 판결인지는 해석적으로 특정하지 않습니다.
