translation:
  language: ko
  text: 그는 율법을 향해 열심을 내었으며, 마치 파인하스가 살롬의 아들 잠브리를 대하였던 것과 같았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 이름은 여기서 잠브리와 살롬이며, 더 널리 알려진 민수기 25장의 이름은 시므리와 살루입니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἐζήλωσεν
  english_pob_choice: was zealous / burned with zeal
  chosen_korean: 열심을 내었습니다
  alternatives_korean:
  - 열정을 보였습니다
  - 질투했습니다
  lexicon: BDAG
  rationale: ζηλόω의 문맥상 의미는 단순한 감정보다 행동으로 나타나는 강한 열심이므로, 한국어에서는 관용적이면서도 힘을 살리는 ‘열심을 내었습니다’로 옮겼습니다.
- source_word: τῷ νόμῳ
  english_pob_choice: for the law
  chosen_korean: 율법을 향해
  alternatives_korean:
  - 율법을 위하여
  - 율법에 대하여
  lexicon: BDAG
  rationale: 여기서 νόμος는 일반적 ‘법’이 아니라 유대적 토라를 가리키므로 기본 용례에 따라 ‘율법’으로 옮겼고, ζηλόω와의 결합은 목적·대상을 드러내는 한국어 표현으로 자연스럽게 처리했습니다.
- source_word: Φινεὲς / τῷ Ζαμβρὶ υἱῷ Σαλώμ
  english_pob_choice: Phinehas ... Zambri son of Salom
  chosen_korean: 파인하스가 살롬의 아들 잠브리를 대하였던 것
  alternatives_korean:
  - 비느하스가 살루의 아들 시므리를 대하였던 것
  - 파인하스가 잠브리에게 행하였던 것
  lexicon: LSJ
  rationale: 그리스어 본문에 나온 이름 형태를 따라 파인하스, 잠브리, 살롬으로 음역하되, dative 관계를 한국어에서는 ‘대하다’로 풀어 역사적 비교의 의미를 분명히 했습니다.
theological_decisions:
- issue: 비느하스/파인하스의 열심과 폭력적 행위의 비교를 어떻게 처리할지
  chosen_reading: 비유와 대조를 약화시키지 않고 본문의 비교를 직설적으로 유지했습니다.
  alternative_readings:
  - 설명을 덧붙여 완화하기
  - 폭력성을 피하려고 열심 표현을 부드럽게 바꾸기
  rationale: 본문은 마카비오스의 열심을 민수기 25장의 파인하스 사건과 직접 비교하므로, 그 신학적 긴장과 서술의 강도를 그대로 드러내는 편이 원문에 충실합니다.
  doctrine_reference: 'DOCTRINE.md: 원문의 비교·긴장을 보존하고, 번역 전통이 이를 완화하지 않도록 한다.'
