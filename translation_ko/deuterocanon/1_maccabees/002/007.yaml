  text: And he said[a], “Alas! Why was I born to see the ruin of my people and the ruin of the holy city, and to sit there while it was given into the hand of enemies[b], and the sanctuary into the hand of foreigners?”
  footnotes:
  - marker: a
    text: Or 'the wreckage/destruction of my people'; the Greek uses a plural form that may emphasize the extent of the devastation.
    reason: lexical_alternative
  - marker: b
    text: Literally 'into the hand of enemies ... into the hand of foreigners,' a biblical idiom for being handed over to their power.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 말했습니다[a]. 「아아! 왜 내가 태어나 내 백성의 무너짐과 거룩한 성의 무너짐을 보고, 그것이 원수들의 손에 넘겨졌을 때 거기에 앉아 있어야 합니까? 또 성소가 이방인들의 손에 들어가는 것을 보아야 합니까?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 백성의 파괴/참혹함’을 뜻할 수 있습니다. 그리스어 복수형은 파괴의 범위와 심각성을 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴμοι
  english_pob_choice: Alas!
  chosen_korean: 아아!
  alternatives_korean:
  - 슬프도다!
  - 아!
  lexicon: LSJ
  rationale: 탄식의 감탄사를 현대 합쇼체에서 자연스럽게 살리되, 지나치게 교회문어체인 표현은 피했습니다.
- source_word: ἐγενήθην ἰδεῖν
  english_pob_choice: was I born to see
  chosen_korean: 태어나 … 보고
  alternatives_korean:
  - 태어나 … 목격하고
  - 살아남아 … 보게 되고
  lexicon: LSJ
  rationale: ‘~하도록 태어나다’의 비통한 뉘앙스를 한국어에서는 ‘태어나 … 보다’로 풀어 원문의 탄식 강도를 유지했습니다.
- source_word: τὰ συντρίμματα / τὸ σύντριμμα
  english_pob_choice: the ruin / the ruin
  chosen_korean: 무너짐 / 무너짐
  alternatives_korean:
  - 파괴 / 파괴
  - 폐허 / 폐허
  lexicon: LSJ
  rationale: 복수형과 단수형이 병렬로 나오지만 의미상 집합적 파괴를 가리키므로, 두 번 반복된 평행 구조를 살려 ‘무너짐’으로 통일했습니다.
- source_word: ἐν χειρὶ ἐχθρῶν / ἐν χειρὶ ἀλλοτρίων
  english_pob_choice: into the hand of enemies / into the hand of foreigners
  chosen_korean: 원수들의 손에 / 이방인들의 손에
  alternatives_korean:
  - 적들의 손에 / 외인들의 손에
  - 원수의 권세 아래 / 타국인들의 권세 아래
  lexicon: LSJ
  rationale: 성경적 관용구인 ‘손에’ 이미지를 보존해, 단순히 ‘권세 아래’로 완화하지 않았습니다.
- source_word: τὸ ἁγίασμα
  english_pob_choice: the sanctuary
  chosen_korean: 성소
  alternatives_korean:
  - 성역
  - 성전
  lexicon: LSJ
  rationale: ἁγίασμα은 거룩한 예배 공간을 가리키므로, 한국어 성경어휘에서 직접적인 대응인 ‘성소’를 택했습니다.
theological_decisions:
- issue: 거룩한 성과 성소의 파괴를 함께 병렬로 탄식하는 구조
  chosen_reading: ‘거룩한 성’과 ‘성소’를 각각 보존하여, 도시 전체의 황폐와 예배 중심의 모독을 동시에 드러냈습니다.
  alternative_readings:
  - ‘예루살렘’으로 구체화
  - ‘성전’으로 풀이
  rationale: 원문은 일반명사적 표현을 사용해 공동체와 예배 공간의 상실을 함께 말하므로, 특정 명칭을 덧붙이기보다 원문의 범위를 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
