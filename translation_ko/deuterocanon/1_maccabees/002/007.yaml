  text: And he said[a], “Alas! Why was I born to see the ruin of my people and the ruin of the holy city, and to sit there while it was given into the hand of enemies[b], and the sanctuary into the hand of foreigners?”
  footnotes:
  - marker: a
    text: Or 'the wreckage/destruction of my people'; the Greek uses a plural form that may emphasize the extent of the devastation.
    reason: lexical_alternative
  - marker: b
    text: Literally 'into the hand of enemies ... into the hand of foreigners,' a biblical idiom for being handed over to their power.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 말했습니다[a]. 「아아! 어찌하여 나는 내 백성의 파멸과 거룩한 성의 파멸을 보고, 그 성이 원수들의 손에 넘겨지고 성소가 이방인들의 손에 넘겨질 때 그곳에 앉아 있으려고 태어났습니까?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 백성의 파괴/참혹한 재난’을 뜻할 수 있습니다. 그리스어의 복수형은 파괴의 범위와 심각성을 강조할 수 있습니다.
    reason: lexical_alternative
