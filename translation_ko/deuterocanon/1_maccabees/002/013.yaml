lexical_decisions:
- source_word: ἵνα τί
  english_pob_choice: Why should
  chosen_korean: 이제 우리가 왜 더 살아야 합니까?
  alternatives_korean:
  - 왜 우리가 아직 살아야 합니까?
  - 무슨 이유로 우리가 더 살아야 합니까?
  lexicon: LSJ
  rationale: ἵνα τί는 코이네에서 관용적으로 ‘왜?’의 뜻으로 쓰이므로, 한국어에서도 원인·이유를 묻는 자연스러운 질문형으로 옮겼습니다. 감정적 탄식의 뉘앙스를 살리기 위해 문맥상 ‘이제’와 ‘더’를 더했습니다.
- source_word: ἡμῖν
  english_pob_choice: we / for us
  chosen_korean: 우리가
  alternatives_korean:
  - 우리에게
  - 우리를
  lexicon: BDAG
  rationale: 원문의 여격 ἡμῖν은 ‘우리에게’라는 직역보다, ἡμῖν … ζῇν 관용구를 한국어 질문문으로 자연스럽게 풀어 ‘우리가’로 표현하는 편이 의미를 더 분명하게 전달합니다.
- source_word: ἔτι
  english_pob_choice: still
  chosen_korean: 더
  alternatives_korean:
  - 아직
  - 여전히
  lexicon: BDAG
  rationale: ἔτι의 계속성은 여기서 ‘살아야 합니까’ 앞의 ‘더’로 옮겨, 이미 삶의 지속이 더 이상 견딜 만하지 않다는 탄식의 뉘앙스를 드러냈습니다.
- source_word: ζῇν
  english_pob_choice: live
  chosen_korean: 살아야
  alternatives_korean:
  - 살아 있어야
  - 계속 살아야
  lexicon: BDAG
  rationale: 동사 ζῇν은 단순한 생존이 아니라 계속되는 삶을 가리키므로, 한국어에서도 ‘살다’의 계속·의무 뉘앙스를 살려 ‘살아야’로 옮겼습니다.
theological_decisions:
- issue: 탄식형 수사 의문문의 어조
  chosen_reading: 이 구절을 정보 질문이 아니라 절망과 항의가 섞인 탄식으로 읽고, 한국어도 종결어미 ‘-합니까?’로 유지했습니다.
  alternative_readings:
  - 중립적 질문으로 옮겨 ‘왜 우리가 아직 살아 있습니까?’라고 할 수 있음
  - 더 직접적인 감탄형으로 바꿀 수 있음
  rationale: 영문 POB가 이 구절을 lamenting question으로 주석한 것에 따라, 의미를 약화시키지 않으면서도 현대 한국어의 공손한 질문형으로 긴박감을 보존했습니다.
  doctrine_reference: 수사학/문체
- issue: 삶의 지속에 대한 절망
  chosen_reading: ‘더 살아야 합니까’로 번역하여 단순 생존이 아니라 계속 살아야 하는 상황 자체에 대한 절망을 드러냈습니다.
  alternative_readings:
  - ‘왜 아직 살아야 합니까’
  - ‘왜 계속 살아야 합니까’
  rationale: 원문의 ἔτι와 ζῇν이 함께 만드는 ‘계속 삶’의 부담을 한국어에서 자연스럽게 전달하기 위한 선택입니다.
  doctrine_reference: 본문 수사
