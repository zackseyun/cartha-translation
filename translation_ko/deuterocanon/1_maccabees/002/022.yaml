  text: We will not obey the king’s decree by turning aside from our worship, to the right or to the left.
  footnotes:
  - marker: a
    text: Or 'We will not listen to the king’s law.' The Greek verb can mean 'listen to' or 'obey,' and 'law' is a more literal rendering of νόμος.
