    text: 또는 ‘우리는 왕의 법에 귀를 기울이지 않겠습니다.’ 그리스어 동사는 ‘듣다’ 또는 ‘복종하다’의 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν νόμον τοῦ βασιλέως
  english_pob_choice: the king’s decree / command
  chosen_korean: 왕의 법
  alternatives_korean:
  - 왕의 명령
  - 왕의 조서
  - 왕의 칙령
  lexicon: LSJ
  rationale: νόμος는 문자적으로 ‘법’이지만, 여기서는 왕이 강요하는 권위 있는 규정이라는 점을 드러내면서도 원문의 표현을 살리기 위해 ‘왕의 법’으로 옮겼습니다.
- source_word: ἀκουσόμεθα
  english_pob_choice: will obey
  chosen_korean: 따르지 않겠습니다
  alternatives_korean:
  - 듣지 않겠습니다
  - 복종하지 않겠습니다
  - 순종하지 않겠습니다
  lexicon: BDAG
  rationale: ‘듣다/듣고 따르다’의 뜻을 지니지만, 문맥상 왕의 법을 수용하지 않겠다는 거부이므로 현대 한국어에서는 ‘따르다’가 가장 자연스럽고 뜻을 잘 전합니다.
- source_word: παρελθεῖν
  english_pob_choice: by turning aside
  chosen_korean: 떠나
  alternatives_korean:
  - 벗어나
  - 치우쳐
  - 벗어나며
  lexicon: LSJ
  rationale: 기존의 경로에서 이탈하는 이미지를 살려 ‘떠나’로 옮겼고, 뒤의 방향성 관용구와도 어울리게 했습니다.
- source_word: δεξιὰν ἢ ἀριστεράν
  english_pob_choice: to the right or to the left
  chosen_korean: 오른쪽으로도 왼쪽으로도
  alternatives_korean:
  - 좌로나 우로나
  - 오른편으로도 왼편으로도
  lexicon: LSJ
  rationale: 원문의 고정 관용구를 그대로 살려 어떤 방향으로도 벗어나지 않겠다는 의미를 분명히 했습니다.
