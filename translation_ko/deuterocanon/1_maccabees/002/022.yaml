translation:
  language: ko
  text: 우리는 왕의 법을 따르지 않겠으며, 우리 예배를 떠나 오른쪽으로도 왼쪽으로도 치우치지 않겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
