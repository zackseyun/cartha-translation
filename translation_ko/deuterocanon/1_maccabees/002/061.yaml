lexical_decisions:
- source_word: ἐννοήθητε
  english_pob_choice: consider
  chosen_korean: 생각하십시오
  alternatives_korean:
  - 생각해 보십시오
  - 마음에 새기십시오
  - 헤아리십시오
  lexicon: LSJ
  rationale: aorist imperative 복수형의 권면을 자연스러운 현대 한국어 명령으로 옮겼습니다. 문맥상 단순 인지보다 숙고를 요구하므로 ‘생각하십시오’가 가장 간결합니다.
- source_word: κατὰ γενεὰν
  english_pob_choice: from generation to generation
  chosen_korean: 대대로
  alternatives_korean:
  - 세대마다
  - 세대에서 세대로
  - 대대에 걸쳐
  lexicon: LSJ
  rationale: 여러 세대를 가로지르는 역사적 범위를 한국어 관용 표현으로 압축해 전달합니다.
- source_word: ἐλπίζοντες ἐπʼ αὐτόν
  english_pob_choice: hope in him
  chosen_korean: 그분을 바라는
  alternatives_korean:
  - 그분께 소망을 두는
  - 그분을 신뢰하는
  lexicon: LSJ
  rationale: ἐλπίζω의 기본 의미를 살리면서 한국어에서 자연스러운 신앙적 표현으로 옮겼습니다. 전치사구의 방향성을 ‘~을 바라는’으로 반영했습니다.
- source_word: ἀσθενήσουσιν
  english_pob_choice: will not grow weak
  chosen_korean: 약해지지 않을 것입니다
  alternatives_korean:
  - 약해지지 않을 것입니다
  - 힘을 잃지 않을 것입니다
  - 쓰러지지 않을 것입니다
  lexicon: LSJ
  rationale: ‘become weak’의 동사적 의미를 살려 ‘약해지다’로 옮겼습니다. POB의 여지를 따라 ‘fail’까지는 본문에 넣지 않았습니다.
