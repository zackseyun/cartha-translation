  source_fidelity: 본문의 권면, 세대에 걸친 관점, 하나님께 희망을 두는 이들, 그리고 미래의 부정적 결과를 대체로 충실히 반영합니다. 다만 ‘그분을 바라는’은 한국어에서 그분을 만나거나 얻기를 원한다는 뜻으로도 쉽게 읽혀 ἐλπίζοντες ἐπʼ αὐτόν의 ‘그분께 소망을 두다’라는 의존·신뢰의 의미를 충분히 드러내지 못합니다.
  naturalness: ‘대대로 이렇게 생각하십시오’는 이해 가능하나 다소 직역투이며, ‘이처럼 헤아리십시오’가 숙고하라는 권면과 현대 격식체의 자연스러움을 더 잘 살립니다. ‘그분께 소망을 두는’은 표준 한국어 성서 문체에서도 자연스럽습니다.
  terminology: ‘그분’은 원문의 남성 단수 대명사와 문맥상 하나님이라는 지시 대상을 절제하여 보존합니다. ‘소망을 두는’은 ἐλπίζω의 핵심 의미를, ‘약해지지 않을 것입니다’는 ἀσθενήσουσιν의 약화/무력화 의미를 유지합니다.
