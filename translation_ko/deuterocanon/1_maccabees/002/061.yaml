  to: 그러므로 대대로 이처럼 헤아리십시오[a]. 곧 그분께 소망을 두는 모든 사람은 약해지지 않을 것입니다[b].
  rationale: ‘생각하십시오’를 문맥상 숙고와 깨달음을 나타내는 ‘헤아리십시오’로 다듬고, ἐλπίζοντες ἐπʼ αὐτόν을 ‘그분께 소망을 두는’으로 고쳐 희망의 대상에 대한 의지적 신뢰를 분명히 했습니다. 원문의 대명사, 미래 시제, 그리고 ἀσθενέω의 비교적 넓은 의미는 보존했으며, 대안 의미는 각주에 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:39:31Z'
