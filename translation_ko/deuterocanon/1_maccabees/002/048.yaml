  yaml_path: translation/deuterocanon/1_maccabees/002/048.yaml
  text: And they rescued the law from the hand of the nations and from the hand of the kings[a], and they did not give a horn to the sinner.
  footnotes:
  - marker: a
    text: Or, 'they did not give the sinner strength' or 'they did not allow the sinner to gain power.' The 'horn' is a biblical image for power or exaltation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 이방 민족들의 손과 왕들의 손에서 율법을 구해 내고, 죄인에게 뿔을 주지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죄인에게 힘을 주지 않았다’, 혹은 ‘죄인이 권세를 얻지 못하게 했다’. ‘뿔’은 힘이나 높아지게 함을 가리키는 성경적 이미지입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντελάβοντο
  english_pob_choice: rescued
  chosen_korean: 구해 내고
  alternatives_korean:
  - 붙들고
  - 도왔고
  - 변호했고
  lexicon: LSJ
  rationale: 문맥상 율법을 적대 세력의 손에서 건져 내는 뜻이므로, 단순한 ‘도움’보다 적극적 구출을 드러내는 ‘구해 내다’가 가장 가깝습니다.
- source_word: ἐκ χειρὸς
  english_pob_choice: from the hand of
  chosen_korean: 손에서
  alternatives_korean:
  - 권세에서
  - 힘에서
  - 손아귀에서
  lexicon: LSJ
  rationale: 헬라어의 구체적 비유를 살리기 위해 ‘손에서’를 유지했습니다. 이는 지배·통제의 이미지를 자연스럽게 전달합니다.
- source_word: τῶν ἐθνῶν / τῶν βασιλέων
  english_pob_choice: the nations / the kings
  chosen_korean: 이방 민족들의 / 왕들의
  alternatives_korean:
  - 열국의 / 통치자들의
  - 나라들의 / 왕들의
  - 이방인들의 / 군왕들의
  lexicon: LSJ
  rationale: ἐθνῶν은 문자적으로 ‘민족들’이지만, 유대 문맥에서 비유대 세력을 가리키므로 ‘이방 민족들’이 원문과 뜻을 함께 살립니다. βασιλέων은 직접적으로 ‘왕들’입니다.
- source_word: οὐκ ἔδωκαν κέρας
  english_pob_choice: did not give a horn
  chosen_korean: 뿔을 주지 않았습니다
  alternatives_korean:
  - 뿔을 주지 않았습니다
  - 힘을 주지 않았습니다
  - 권세를 주지 않았습니다
  - 높임을 주지 않았습니다
  lexicon: LSJ
  rationale: κέρας의 문자적 이미지인 ‘뿔’을 보존해 성경적 상징을 유지했습니다. 한국어에서는 자연스럽게 목적어를 앞세워 ‘뿔을 주지 않았다’고 옮기되, 은유적 힘은 그대로 남깁니다.
- source_word: τῷ ἁμαρτωλῷ
  english_pob_choice: the sinner
  chosen_korean: 죄인에게는
  alternatives_korean:
  - 죄인에게는
  - 악인에게는
  - 죄인에게
  - 죄인에게도
  lexicon: LSJ
  rationale: 단수 표현인 τῷ ἁμαρτωλῷ를 직역해 ‘죄인’으로 옮겼습니다. 조사 ‘-에게는’은 대조를 분명히 하여 문장의 리듬도 살립니다.
theological_decisions:
- issue: 마지막 절의 ‘뿔’ 은유
  chosen_reading: 본문에는 은유를 그대로 유지하고, 한국어 본문도 ‘뿔’로 직역했습니다.
  alternative_readings:
  - 힘
  - 권세
  - 높임
  rationale: ‘뿔’은 성경에서 힘·승귀의 상징으로 널리 쓰이므로, 의미를 미리 풀어 쓰기보다 이미지를 보존하는 것이 본문과 상호본문성을 더 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: 본문의 비유를 해소하지 말고, 의미는 주석적 장치로 보완한다.'
