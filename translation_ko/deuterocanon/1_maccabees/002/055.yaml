  lexicon: 고유명사 표기 관례
  rationale: 이 문맥의 인물은 예수님이 아니라 여호수아이므로, 혼동을 피하고 구약 인물을 분명히 드러내는 표기를 택했습니다.
- source_word: ἐν τῷ πληρῶσαι
  english_pob_choice: in fulfilling
  chosen_korean: 그 말씀을 이루는 가운데
  alternatives_korean:
