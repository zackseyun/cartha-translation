  - 그 말씀을 이루어
  lexicon: 문맥상 관용 표현
  rationale: 전치사구와 부정사의 결합이 시간적·수단적 뉘앙스를 모두 열어 두므로, 한국어에서는 자연스럽게 ‘~하는 가운데’로 옮겨 문맥적 유연성을 살렸습니다.
- source_word: λόγον
  english_pob_choice: the word
  chosen_korean: 그 말씀
  alternatives_korean:
  - 그 명령
  - 그 약속
  - 그 일
  lexicon: LSJ
  rationale: λόγος는 넓은 의미를 지니지만, 여기서는 여호수아의 신실한 순종을 가리키는 말로 보이므로 ‘말씀’이 원문 압축성을 유지하면서도 신학적 여지를 과도하게 좁히지 않습니다.
- source_word: κριτὴς
  english_pob_choice: a judge
  chosen_korean: 재판관
  alternatives_korean:
  - 사사
  - 판관
  - 지도자
  lexicon: 성경 용례
  rationale: 이스라엘의 역사적 직분을 나타내는 말로서, 단순한 법정 판사보다 구약적 직분을 더 잘 드러내는 ‘재판관’을 택했습니다.
theological_decisions:
- issue: λόγον의 범위
  chosen_reading: ‘그 말씀’으로 일반적으로 옮겨, 명령·약속·사건 중 어느 하나로 확정하지 않았습니다.
  alternative_readings:
  - 그 명령
  - 그 약속
  - 그 일
  rationale: 원문은 λόγον의 구체적 대상을 분명히 규정하지 않으므로, 해석을 조급하게 고정하지 않고 신학적 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
