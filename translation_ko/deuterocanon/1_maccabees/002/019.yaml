  alternative_readings:
  - ‘만일 … 한다 해도’
  - ‘…하더라도’
  rationale: 원문은 군중의 보편적 순응을 가정하는 양보적 뉘앙스를 가지므로, 이를 분명히 드러내는 표현이 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §5
