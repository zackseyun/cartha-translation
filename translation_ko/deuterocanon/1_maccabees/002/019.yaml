    text: 원문은 직역하면 ‘왕의 왕국의 집 안에 있는’이라는 다소 이례적인 표현입니다. 문맥상 ‘왕의 왕국’ 또는 ‘왕의 영역’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘귀를 기울이다’는 원문의 기본 의미인 ‘듣다’에 가깝습니다. 문맥상 순종의 의미가 함의됩니다.
    reason: lexical_alternative
