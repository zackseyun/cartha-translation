  - 백성들
  lexicon: LSJ
  rationale: 여기서는 왕권 아래 놓인 여러 집단을 가리키므로, 문맥상 ‘민족’이 가장 무난하게 원문을 반영합니다.
- source_word: ἀκούουσιν αὐτοῦ
  english_pob_choice: listen to him
  chosen_korean: 그에게 귀를 기울일지라도
  alternatives_korean:
  - 그의 말을 들을지라도
  - 그에게 순종할지라도
  lexicon: LSJ
  rationale: 동사의 기본값인 ‘듣다/귀를 기울이다’를 살리되, 문맥상 복종의 함의도 너무 약해지지 않게 했습니다.
- source_word: λατρίας πατέρων αὐτοῦ
  english_pob_choice: the worship of his fathers
  chosen_korean: 자기 조상들의 예배
  alternatives_korean:
  - 조상들의 종교
  - 선조들의 예배
  lexicon: LSJ
  rationale: λατρεία의 예배/종교적 섬김 의미를 살려, 조상 대대로 전승된 종교적 실천을 자연스럽게 표현했습니다.
- source_word: ᾑρετίσαντο ἐν ταῖς ἐντολαῖς αὐτοῦ
  english_pob_choice: have chosen his commandments
  chosen_korean: 그의 명령들을 택하였습니다
  alternatives_korean:
  - 그의 계명들을 선택하였습니다
  - 그의 명령을 따르기로 하였습니다
  lexicon: LSJ
  rationale: ἐντολαί의 권위 있는 명령 의미를 살리면서, 선택의 결과를 드러내는 동사 ‘택하다’를 사용했습니다.
theological_decisions:
