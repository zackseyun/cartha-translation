  text: 마타티아스가 큰 소리로 대답하여 말했습니다. “왕의 왕국 안에 있는[a] 모든 민족이 그에게 귀를 기울이고[b], 저마다 자기 조상들의 예배를 버리고 그의 명령들을 택한다 해도,”
  philosophy: optimal-equivalence
  footnotes:
