  text: And Mattathias answered and said with a loud voice[a], “Even if all the nations in the kingdom of the king listen to him, each one turning away from the worship of his fathers[b], and have chosen his commandments,”
  footnotes:
  - marker: a
    text: 'Or ''the realm of the king.'' The Greek phrase is unusually worded: literally, ''the house of the kingdom of the king.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'obey him.' The Greek more literally says 'listen to him,' though obedience is implied by the context.
    reason: lexical_alternative
translation:
  language: ko
  text: 마타티아스가 큰 소리로 대답하여 말했습니다. 「비록 왕의 왕국 안에 있는 모든 민족이 그에게 귀를 기울일지라도, 각 사람은 자기 조상들의 예배에서 돌아서서 그의 명령들을 택하였습니다」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 직역하면 ‘왕의 왕국 안에 있는’이지만, 의미상 ‘왕의 왕국’ 또는 ‘왕의 영역’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘귀를 기울이다’는 원문의 ‘듣다’에 가깝고, 문맥상 순종의 의미가 함의됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνῇ μεγάλῃ
  english_pob_choice: with a loud voice
  chosen_korean: 큰 소리로
  alternatives_korean:
