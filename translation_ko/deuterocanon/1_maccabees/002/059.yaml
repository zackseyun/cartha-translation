  text: 아나니아, 아자리야, 미사엘은 믿었기 때문에 불길에서 구원을 받았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 ‘아나니아스, 아자리아스, 미사엘’의 형태이지만, 문맥상 다니엘 3장의 세 청년을 가리키므로 한국어에서는 더 익숙한 인물 식별을 위해 그리스어에 가까운 음역을 유지했습니다.
    reason: lexical_alternative
  - marker: b
    text: πιστεύσαντες는 문자적으로는 ‘믿은’ 또는 ‘믿고서’에 가깝지만, 한국어에서는 분사 관계를 풀어 ‘믿었기 때문에’로 옮길 수 있습니다.
    reason: alternative_reading
