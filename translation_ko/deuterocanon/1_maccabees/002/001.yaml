  text: In those days Mattathias son of John, son of Simeon, a priest of the sons of Joarib, rose up from Jerusalem and settled in Modein.
translation:
  language: ko
  text: 그때에 요한의 아들이며 시므온의 손자인 맛다디아, 곧 요아립 자손 계열의 제사장이 예루살렘에서 일어나 모데인에 정착했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ταῖς ἡμέραις ἐκείναις
  english_pob_choice: In those days
  chosen_korean: 그때에
  alternatives_korean:
  - 그날들에
  - 그 무렵에
  lexicon: source phrase temporal idiom
  rationale: 헬라어 관용구를 자연스러운 서술 시점 표현으로 옮기되, 역사 서술의 시작을 분명히 드러내기 위해 간결한 ‘그때에’를 택했습니다.
- source_word: ἀνέστη
  english_pob_choice: rose up
  chosen_korean: 일어나
  alternatives_korean:
  - 일어섰습니다
  - 나타났습니다
  - 기지개를 켰습니다
  lexicon: ἀνίστημι
  rationale: 영어 POB의 ‘rose up’는 단순 이동보다 공적 출현·행동 개시를 가리키므로, 맥락에 맞게 ‘일어나’로 옮겼습니다.
- source_word: ἱερεὺς τῶν υἱῶν Ἰωαρίβ
  english_pob_choice: a priest of the sons of Joarib
  chosen_korean: 요아립의 아들들 가운데 한 제사장
  alternatives_korean:
  - 요아립의 자손들 가운데 한 제사장
  - 요아립 가문의 제사장
  lexicon: ἱερεύς / υἱοί
  rationale: ‘sons of Joarib’는 혈연적 아들들이 아니라 제사장 집단을 가리키므로, 한국어로는 집단 소속을 드러내는 ‘가운데 한 제사장’이 오해를 줄입니다.
- source_word: ἐκάθισεν ἐν Μωδεείν
  english_pob_choice: settled in Modein
  chosen_korean: 모데인에 머물렀습니다
  alternatives_korean:
  - 모데인에 정착했습니다
  - 모데인에 살게 되었습니다
  lexicon: καθίζω
  rationale: 문맥상 단순히 ‘앉다’가 아니라 거주를 시작한 뜻이므로, English audit trail의 ‘settled in’에 맞추어 ‘머물렀습니다’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 이동 동사의 방향성
  chosen_reading: ἀνέστη는 지리적 이동보다 ‘공적 출현/일어섬’의 뉘앙스를 살려 번역했습니다.
  alternative_readings:
  - 예루살렘에서 나왔습니다
  - 떠났습니다
  rationale: 개정 경향의 ‘came from Jerusalem’보다 본문이 가진 행위 개시의 힘을 유지하는 것이 POB의 audit trail과 더 잘 부합합니다.
  doctrine_reference: 서술 어휘의 의미 보존
