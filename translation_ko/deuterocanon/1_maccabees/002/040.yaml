  text: And one man said to his neighbor[a], “If we all do as our brothers did, and do not fight against the Gentiles for our lives and our rights[b], they will quickly destroy us from the land.”
  footnotes:
  - marker: a
    text: Or “the nations.” The Greek term often means “nations,” but here likely refers specifically to non-Jewish peoples opposed to the Jews.
    reason: lexical_alternative
  - marker: b
    text: Or “our ordinances” or “our legal claims.” The Greek can refer to established rights, legal norms, or customary claims.
    reason: lexical_alternative
translation:
  language: ko
  text: 한 사람이 자기 이웃에게 말했습니다. 「우리가 모두 우리 형제들이 한 것처럼 하고, 우리 생명과 우리의 권리를 위해 이방인들과 싸우지 않는다면, 그들은 곧 우리를 이 땅에서 멸망시킬 것입니다」.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “열국.” 그러나 여기서는 유대인을 대적하는 비유대인들을 가리키는 뜻이 더 강합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “우리의 율례들” 혹은 “우리의 법적 주장들.” 그리스어는 확립된 권리, 법적 규범, 관습적 주장까지 아울러 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ
  english_pob_choice: one man
  chosen_korean: 한 사람
  alternatives_korean:
  - 한 남자
  - 어떤 사람
  lexicon: LSJ
  rationale: 문맥의 분배적 단수 화자를 자연스럽게 드러내면서도, 한국어에서는 성별을 굳이 표지하지 않는 것이 간결하고 정확합니다.
- source_word: πλησίον
  english_pob_choice: neighbor
  chosen_korean: 이웃
  alternatives_korean:
  - 가까운 사람
  - 동료
  lexicon: LSJ
  rationale: 직역하면 ‘가까이 있는 사람’이지만, 여기서는 동료 집단 안의 상대를 가리키므로 한국어의 기본 대응인 ‘이웃’이 가장 무난합니다.
- source_word: τὰ ἔθνη
  english_pob_choice: the Gentiles
  chosen_korean: 이방인들
  alternatives_korean:
  - 열국
  - 민족들
  lexicon: LSJ
  rationale: 유대 공동체와 대비되는 비유대인 집단을 가리키므로, 단순한 ‘나라들’보다 종교·사회적 구분을 살리는 ‘이방인들’이 더 적절합니다.
- source_word: δικαιωμάτων
  english_pob_choice: rights
  chosen_korean: 권리
  alternatives_korean:
  - 법적 주장
  - 율례
  - 정당한 요구
  lexicon: LSJ
  rationale: 이 구절은 공동체의 생존과 함께 침해받는 합법적 권리를 말하므로, 현대 한국어에서 즉시 이해되는 ‘권리’가 본문 의미를 가장 분명히 전달합니다.
- source_word: ὀλεθρεύσουσιν
  english_pob_choice: destroy
  chosen_korean: 멸망시킬 것입니다
  alternatives_korean:
  - 파멸시킬 것입니다
  - 없애버릴 것입니다
  lexicon: LSJ
  rationale: 강한 파괴·멸절의 뉘앙스를 살리되, 과도하게 장식적이지 않은 한국어로 옮겼습니다.
theological_decisions:
- issue: τὰ ἔθνη의 번역을 한국어에서 어떻게 처리할지
  chosen_reading: 이방인들
  alternative_readings:
