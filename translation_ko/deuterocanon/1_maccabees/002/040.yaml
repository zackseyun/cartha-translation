  - 민족들
  rationale: 이 문맥은 ‘우리 형제들’과 대조되는 비유대인 세력을 가리키므로, 한국어 독자가 즉시 관계 구도를 이해하도록 ‘이방인들’로 옮겼습니다.
  doctrine_reference: 원문 우선 번역; 유대-이방 대조의 문맥 보존
