- source_word: τὰ ἔθνη
  english_pob_choice: the Gentiles
  chosen_korean: 이방인들
  alternatives_korean:
  - 열국
  - 민족들
  lexicon: LSJ
  rationale: 유대 공동체와 대비되는 비유대인 집단을 가리키므로, 단순한 ‘나라들’보다 종교·사회적 구분을 살리는 ‘이방인들’이 더 적절합니다.
- source_word: δικαιωμάτων
  english_pob_choice: rights
  chosen_korean: 권리
  alternatives_korean:
  - 법적 주장
  - 율례
  - 정당한 요구
  lexicon: LSJ
  rationale: 이 구절은 공동체의 생존과 함께 침해받는 합법적 권리를 말하므로, 현대 한국어에서 즉시 이해되는 ‘권리’가 본문 의미를 가장 분명히 전달합니다.
- source_word: ὀλεθρεύσουσιν
  english_pob_choice: destroy
  chosen_korean: 멸망시킬 것입니다
  alternatives_korean:
  - 파멸시킬 것입니다
  - 없애버릴 것입니다
  lexicon: LSJ
  rationale: 강한 파괴·멸절의 뉘앙스를 살리되, 과도하게 장식적이지 않은 한국어로 옮겼습니다.
theological_decisions:
