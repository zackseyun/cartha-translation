lexical_decisions:
- source_word: Δαυεὶδ
  english_pob_choice: David
  chosen_korean: 다윗
  alternatives_korean:
  - 데이비드
  lexicon: 고유명사 표기 관행
  rationale: 성경 인명은 한국어에서 확립된 표기인 다윗을 사용하는 것이 자연스럽고 식별성이 높습니다.
- source_word: ἐν τῷ ἐλέει αὐτοῦ
  english_pob_choice: because of his mercy
  chosen_korean: 그의 자비로 말미암아
  alternatives_korean:
  - 그의 자비 안에서
  - 그의 자비 때문에
  - 그의 인자하심으로
  lexicon: LSJ
  rationale: ἐν + 여격은 원인·수단의 뉘앙스를 가질 수 있으므로, 한국어에서는 결과를 낳는 원인 표현인 ‘-로 말미암아’를 택해 의미를 자연스럽게 살렸습니다.
- source_word: ἐκληρονόμησεν
  english_pob_choice: inherited
  chosen_korean: 상속받았습니다
  alternatives_korean:
  - 상속하였습니다
  - 물려받았습니다
  - 유업으로 받았습니다
  lexicon: LSJ
  rationale: κληρονομέω의 핵심 의미인 ‘유업으로 받다/상속받다’를 살리되, 현대 한국어에서 읽기 자연한 ‘상속받다’를 사용했습니다.
- source_word: βασιλείας αἰωνίας
  english_pob_choice: of an everlasting kingdom
  chosen_korean: 영원한 나라의
  alternatives_korean:
  - 영원한 왕국의
  - 영원한 왕권의
  lexicon: LSJ
  rationale: αἰωνίας는 지속성·영속성을 가리키므로 ‘영원한’으로 옮겼고, βασιλεία는 문맥상 통치 영역을 가리켜 ‘나라’로 옮겼습니다.
theological_decisions:
- issue: ἐν τῷ ἐλέει αὐτοῦ의 대명사 αὐτοῦ가 다윗을 가리키는지 하나님을 가리키는지
  chosen_reading: 본문에는 문맥상 가장 가까운 선행사인 다윗을 반영해 ‘그의 자비’로 두되, ‘그의’가 하나님을 가리킬 수 있다는 대안 해석은 주석으로 보존했습니다.
  alternative_readings:
  - 하나님의 자비로
  - 주님의 자비로
  rationale: 이 구절은 문법적으로 다윗을 가리키는 해석이 가장 자연스럽지만, 지혜문학적·경건 문맥에서 신적 자비로 읽는 가능성도 있으므로 긴장을 해소하지 않고 남겨 두는 것이 적절합니다.
  doctrine_reference: 해석의 긴장 보존
