  text: And as soon as he had finished speaking these words[a], a Jewish man came forward in the sight of all to offer sacrifice on the altar in Modein, according to the king's command.
  footnotes:
  - marker: a
    text: Or 'a Jew' or 'a Judean man.' The Greek Ἰουδαῖος can denote Jewish identity or Judean origin; here the broader Jewish identity is likely in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 이런 말을 마치자마자, 한 유대인 남자가 모든 사람이 보는 앞에 나와 모데임의 제단 위에서 왕의 명령에 따라 제사를 드리려고 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘유대인’은 ‘유다 사람’으로도 옮길 수 있습니다. 그리스어 Ἰουδαῖος는 유대인이라는 정체성이나 유다 지역 출신을 가리킬 수 있으며, 여기서는 문맥상 유대인이라는 정체성을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
