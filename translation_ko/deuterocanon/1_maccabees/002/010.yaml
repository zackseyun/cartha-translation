base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/010.yaml
  text: What nation has not inherited a kingdom and taken hold of its spoils?[a]
  footnotes:
  - marker: a
    text: Or 'its plunder' or 'its booty.' The Greek σκῦλα denotes spoils taken from conquest or war.
    reason: lexical_alternative
translation:
  language: ko
  text: 어느 민족이 한 왕국을 상속받지 않았으며, 그 왕국의 전리품을 차지하지 않았습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 왕국의 노획물’, ‘그 왕국의 약탈물’. 헬라어 σκῦλα는 정복이나 전쟁에서 얻은 전리품을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποῖον ἔθνος
  english_pob_choice: What nation
  chosen_korean: 어느 민족
  alternatives_korean:
  - 어느 나라
  - 어떤 민족
  lexicon: LSJ
  rationale: 수사적 질문이므로 ‘어느’가 자연스럽고, ἔθνος의 정치·집단적 의미를 살려 ‘민족’으로 옮겼습니다.
- source_word: ἐκληρονόμησεν
  english_pob_choice: has not inherited
  chosen_korean: 상속받지 않았으며
  alternatives_korean:
  - 유업으로 받지 않았으며
  - 물려받지 않았으며
  lexicon: LSJ
  rationale: κληρονομέω의 유업·상속 이미지를 살리되, 한국어에서 문맥상 가장 자연스러운 동사로 ‘상속받다’를 택했습니다.
- source_word: βασιλείαν
  english_pob_choice: a kingdom
  chosen_korean: 한 왕국
  alternatives_korean:
  - 한 나라
  - 왕권
  lexicon: LSJ
  rationale: 여기서는 통치권보다 구체적인 정치 실체가 어울리므로 ‘왕국’으로 옮겼고, 관사를 반영해 ‘한’을 붙였습니다.
- source_word: τῶν σκύλων αὐτῆς
  english_pob_choice: its spoils
  chosen_korean: 그 전리품
  alternatives_korean:
  - 그 노획물
  - 그 약탈물
  lexicon: LSJ
  rationale: σκῦλα는 전쟁에서 빼앗은 전리품을 가리키므로 ‘전리품’이 가장 직접적입니다. 소유대명사는 자연스러운 한국어를 위해 ‘그’로 풀었습니다.
