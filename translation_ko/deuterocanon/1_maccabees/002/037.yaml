  - marker: b
    text: Literally “without judgment” or “without trial,” expressing that they are being killed without proper examination or justice.
    reason: lexical_alternative
translation:
  language: ko
  text: 말하며[a] 「우리 모두 결백한 채 죽읍시다. 하늘과 땅이 당신들이 우리를 부당하게[b] 죽이고 있음을 증언합니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리의 단순함 가운데서”, “우리의 성실함 가운데서”, 또는 “우리의 순전함 가운데서”; 그리스어 ἁπλότης는 단순함이나 한결같음을 뜻할 수 있으나, 여기서는 결백과 무흠함을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “판단 없이” 또는 “재판 없이”입니다. 적절한 조사와 판결 없이 죽임을 당하고 있다는 뜻입니다.
    reason: lexical_alternative
