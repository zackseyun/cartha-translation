  source_fidelity: 원문의 권유법 Ἀποθάνωμεν은 ‘죽읍시다’로, 복수 주어의 포괄성은 ‘우리 모두’로 적절히 살릴 수 있습니다. ἁπλότης는 이 문맥에서 결백·순전함을 가리킬 가능성이 크므로 ‘결백한 채’는 안전한 문맥 번역입니다. ἀπόλλυτε의 직접적인 2인칭 복수는 ‘당신들이 우리를 ... 죽이고 있음을’으로 명시해야 합니다. μαρτυρεῖ ἐφʼ ἡμᾶς의 정확한 전치사 관계는 다소 논의될 수 있으므로, 본문에서는 ‘하늘과 땅이 ... 증언합니다’로 옮겨 불필요하게 ‘우리 편에서’ 또는 ‘당신들을 대적하여’를 보태지 않았습니다.
  naturalness: ‘무죄한 가운데서’는 현대 한국어에서 어색하며, ‘우리 모두 결백한 채 죽읍시다’가 현대적이면서도 합쇼체의 엄숙한 발화를 자연스럽게 나타냅니다. 또한 ‘우리에게 대하여 당신들이’라는 연쇄는 부자연스럽고 수식 관계가 불명확합니다.
