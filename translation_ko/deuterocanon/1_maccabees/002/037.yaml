  - 이르며
  lexicon: LSJ
  rationale: 분사 도입어로서 뒤의 인용문을 자연스럽게 이끄는 현재형 연결을 살렸습니다.
- source_word: ἁπλότητι ἡμῶν
  english_pob_choice: in our innocence
  chosen_korean: 무죄한 가운데서
  alternatives_korean:
  - 우리의 단순함 가운데서
  - 우리의 성실함 가운데서
  - 우리의 순전함 가운데서
  lexicon: LSJ
  rationale: 문맥이 순진함보다 도덕적 무흠함과 피해자성을 강조하므로, 한국어에서는 법적·윤리적 뉘앙스를 살린 표현을 택했습니다.
- source_word: μαρτυρεῖ ἐφʼ ἡμᾶς
  english_pob_choice: testify against you concerning us
  chosen_korean: 우리에 대하여 … 증언합니다
  alternatives_korean:
  - 우리를 두고 증언합니다
  - 우리 편에서 증언합니다
  - 우리에게 불리하게 증언합니다
  lexicon: LSJ
  rationale: ἐφʼ ἡμᾶς의 관계 방향을 반영해 ‘우리에 대하여’로 옮기고, 문맥상 하늘과 땅의 증언 대상이 가해자임을 문장 안에서 드러냈습니다.
- source_word: ἀκρίτως
  english_pob_choice: unjustly
  chosen_korean: 불의하게
  alternatives_korean:
  - 재판 없이
  - 판단 없이
  - 부당하게
  lexicon: LSJ
  rationale: 영어 본문의 주해처럼 절차상 ‘재판 없이’의 뜻을 포함하지만, 본문은 더 넓은 도덕적·법적 부당성을 드러내는 ‘불의하게’가 적절합니다.
theological_decisions:
- issue: ἁπλότης의 의미 범위
  chosen_reading: 무죄함과 결백을 드러내는 표현으로 번역
  alternative_readings:
  - 단순함
  - 성실함
  - 일편단심
  rationale: 순교적 항변의 맥락에서는 생활양식의 ‘단순함’보다 죄 없음과 비폭력성을 호소하는 뜻이 중심이므로, 한국어도 그 항변의 힘을 살렸습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: ἀκρίτως의 절차적·윤리적 중의성
  chosen_reading: 불의하게
  alternative_readings:
  - 재판 없이
  - 판단 없이
  - 부당하게
  rationale: 본문은 단순한 절차 위반만이 아니라 부정의한 살해를 고발하므로, 본문에는 포괄적 표현을 두고 대안 뉘앙스는 각주로 보존했습니다.
  doctrine_reference: Translation philosophy §6; transparency principle
