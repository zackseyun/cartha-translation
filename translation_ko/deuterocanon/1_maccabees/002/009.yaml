  source_fidelity: 그리스어의 강제적 포로 이송, 유아들의 살해, 원수의 칼에 의한 젊은이들의 죽음이라는 기본 뜻은 대체로 충실히 반영합니다. 그러나 여성형 소유대명사 αὐτῆς를 남성 인칭인 ‘그의’로 옮긴 것은 도시 의인화의 문법적 표지를 바꾸며, ‘쓰러졌습니다’는 ἀπεκτάθη의 피살 의미를 다소 약화합니다.
  naturalness: ‘그의 영광의 그릇들’과 ‘그의 거리들’은 한국어에서 어색하며, 의인화된 도시를 가리킨다는 주해와도 호응하지 않습니다. ‘그녀의’는 의인화 표현으로 문맥상 허용되며, ‘거리에서’는 복수형을 한국어의 집합적 장소 표현으로 자연스럽게 처리합니다.
  terminology: ‘영광의 그릇들’은 σκεύη τῆς δόξης의 직역적 범위를 보존합니다. ‘포로로 끌려가다’, ‘아기들’, ‘젊은이들’, ‘원수의 칼’도 적절합니다. 다만 죽임을 나타내는 동사는 두 절에서 명시하여 원문의 폭력성과 병렬을 유지하는 편이 낫습니다.
