  yaml_path: translation/deuterocanon/1_maccabees/002/009.yaml
  text: The vessels of her glory were carried away captive[a]; her infants were slain in her streets[b], her young men by the enemy’s sword.
  footnotes:
  - marker: a
    text: Or 'were led away as captives.' The Greek expresses forcible removal into captivity.
    reason: lexical_alternative
  - marker: b
    text: The repeated 'her' refers to the city personified in the surrounding context, likely Jerusalem/Zion.
    reason: cross_reference
translation:
  language: ko
  text: 그녀의 영광의 그릇들은 포로로 끌려갔고[a], 그녀의 아기들은 그녀의 거리에서 죽임을 당했으며[b], 그녀의 젊은이들은 원수의 칼에 죽임을 당했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사로잡혀 끌려갔습니다.’ 그리스어는 강제로 끌려가 포로가 되었음을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 반복되는 ‘그녀의’는 앞뒤 문맥에서 의인화된 도시를 가리킵니다. 이 절 자체는 그 도시를 더 구체적으로 밝히지 않습니다.
    reason: cross_reference
lexical_decisions:
- source_word: σκεύη τῆς δόξης
  english_pob_choice: the vessels of her glory
  chosen_korean: 그의 영광의 그릇들
  alternatives_korean:
  - 영광의 기구들
  - 영광의 물품들
  lexicon: LSJ
  rationale: σκεῦη는 문맥상 그릇, 기구, 물품을 가리킬 수 있으나, POB의 ‘vessels’를 따라 ‘그릇들’로 옮기면 성전/도시의 귀중한 물건이라는 함의를 과도하게 좁히지 않으면서도 문맥의 장중함을 살릴 수 있습니다.
- source_word: αἰχμάλωτα ἀπήχθη
  english_pob_choice: were carried away captive
  chosen_korean: 포로로 끌려갔고
  alternatives_korean:
  - 포로로 잡혀갔고
  - 끌려가 포로가 되었고
  lexicon: LSJ
  rationale: 이 구문은 단순한 이동이 아니라 강제적 포로 이송을 뜻하므로, 한국어에서도 ‘포로로 끌려가다’로 능동적 폭력을 드러내는 것이 가장 자연스럽습니다.
- source_word: ἀπεκτάθη
  english_pob_choice: were slain
  chosen_korean: 죽임을 당했으며
  alternatives_korean:
  - 살해되었으며
  - 죽었으며
  lexicon: LSJ
  rationale: ἀπεκτάθη는 살해를 뜻하므로, 비극성과 수동성을 함께 살리는 ‘죽임을 당하다’가 ‘죽다’보다 원문의 폭력을 더 분명히 반영합니다.
- source_word: νῆπια / πλατείαις / νεανίσκοι
  english_pob_choice: infants / streets / young men
  chosen_korean: 아기들 / 거리들 / 젊은이들
  alternatives_korean:
  - 유아들 / 길들 / 청년들
  - 어린아이들 / 광장들 / 소년들
  lexicon: LSJ
  rationale: νήπια는 매우 어린 아이들이므로 ‘아기들’이 가장 직접적이고, πλατεῖαι는 넓은 거리나 공적 공간이 될 수 있으나 여기서는 ‘거리들’이 가장 무난하며, νεανίσκοι는 어린 소년보다 성인 직전의 젊은 남자들을 가리키므로 ‘젊은이들’이 적절합니다.
theological_decisions:
- issue: 인칭대명사 ‘her’의 한국어 처리
  chosen_reading: 문맥상 도시를 가리키는 여성형 인칭을 유지하되, 본절 안에서는 ‘그의’로 옮기고 주해적으로 풀지 않았습니다.
  alternative_readings:
  - ‘그 도시의’로 명시
  - ‘예루살렘의’로 명시
  rationale: 그리스어의 반복되는 αὐτῆς는 주변 문맥이 제공하는 도시 의인화에 기대고 있으므로, 본절에서 antecedent를 과도하게 확정하지 않고 시적 애가의 흐름을 유지하는 것이 원문에 더 가깝습니다.
  doctrine_reference: 문맥이 제공하는 의인화와 지시 대상을 보존합니다.
