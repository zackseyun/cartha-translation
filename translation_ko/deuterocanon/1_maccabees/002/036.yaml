theological_decisions:
- issue: 본절의 행위 열거가 담는 수동적 비대응과 장소 봉쇄의 대비
  chosen_reading: 그들은 직접적으로 맞서지 않았고, 공격 행동도, 은폐 공간을 차단하는 행동도 하지 않았습니다.
  alternative_readings:
  - 단순히 소극적으로 아무 일도 하지 않았다는 뜻
  - 은신처를 파괴하지 않았다는 뜻
  rationale: 세 개의 동사가 차례로 부정되며 저항이 없었음을 드러내므로, 문맥의 전개를 해치지 않는 범위에서 행동의 층위를 구분해 살렸습니다.
  doctrine_reference: 문맥 해석
- issue: ‘숨을 곳들’의 대상이 사람인지 장소인지
  chosen_reading: 장소, 곧 은폐 지점들을 가리키는 것으로 읽었습니다.
  alternative_readings:
  - 숨은 사람들
  - 비유적 표현으로서의 은닉된 무리
  rationale: 영어 POB 주석과 그리스어 표현 모두 공간적 은폐처를 가리키는 쪽이 더 강하므로, 사람을 가리키는 오독을 피했습니다.
  doctrine_reference: 주석적/어휘적 판독
