    text: 또는 ‘숨은 곳들’ 혹은 ‘은밀한 곳들’로도 옮길 수 있습니다. 그리스어 표현은 사람보다 은폐 장소를 가리키는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν
  english_pob_choice: did not answer
