    text: 또는 ‘숨은 곳들’ 혹은 ‘은밀한 곳들’로 옮길 수 있습니다. 그리스어 표현은 사람들보다 은폐 장소들을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
