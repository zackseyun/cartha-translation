  lexicon: LSJ
  rationale: 미래 중간태의 ἐξέρχομαι를 자연스러운 현대 한국어로 옮기되, 은신처에서 ‘밖으로 나오다’는 맥락을 살려 기본적으로 직역에 가깝게 표현했습니다.
- source_word: ποιήσομεν τὸν λόγον τοῦ βασιλέως
  english_pob_choice: we will not do the king’s word
