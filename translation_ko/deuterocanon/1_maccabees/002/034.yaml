  text: And they said, “We will not come out, nor will we do the king’s word, to profane the Sabbath day.”
translation:
  language: ko
  text: 그리고 그들은 말했습니다. “우리는 나오지 않겠고, 안식일을 더럽히는 왕의 명령[a]도 따르지[b] 않겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘왕의 말을 하다/행하다’입니다. 여기서 ‘왕의 말’은 왕의 명령을 뜻하므로, 한국어에서는 ‘왕의 명령’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘더럽히다’는 육체적 오염이 아니라, 거룩한 안식일을 속된 것으로 취급하여 그 거룩함을 훼손한다는 종교적 의미입니다.
    reason: theological_note
