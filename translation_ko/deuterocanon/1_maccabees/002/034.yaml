  text: And they said, “We will not come out, nor will we do the king’s word, to profane the Sabbath day.”
translation:
  language: ko
  text: 그리고 그들이 말했습니다. 「우리는 나오지 않겠고, 왕의 말을 따르지도 않겠습니다. 안식일을 더럽히게 하려는 것입니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘왕의 말을 하다/행하다’이지만, 한국어에서는 왕의 명령에 순응한다는 뜻을 자연스럽게 드러내기 위해 ‘따르다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘더럽히다’는 여기서 육체적 오염이 아니라, 안식일을 거룩하지 않게 취급하는 종교적 의미를 가리킵니다.
    reason: theological_note
lexical_decisions:
- source_word: ἐξελευσόμεθα
  english_pob_choice: we will not come out
  chosen_korean: 우리는 나오지 않겠고
  alternatives_korean:
  - 우리는 나가지 않겠고
  - 우리는 밖으로 나오지 않겠고
  lexicon: LSJ
  rationale: 미래 중간태의 ἐξέρχομαι를 자연스러운 현대 한국어로 옮기되, 은신처에서 ‘밖으로 나오다’는 맥락을 살려 기본적으로 직역에 가깝게 표현했습니다.
- source_word: ποιήσομεν τὸν λόγον τοῦ βασιλέως
  english_pob_choice: we will not do the king’s word
  chosen_korean: 왕의 말을 따르지도 않겠습니다
  alternatives_korean:
  - 왕의 말을 하지도 않겠습니다
  - 왕의 명령을 실행하지도 않겠습니다
  - 왕의 말씀을 행하지도 않겠습니다
  lexicon: LSJ
  rationale: 직역하면 ‘왕의 말을 하다/행하다’이지만, 한국어에서는 왕의 명령에 순응하는 뜻을 분명히 드러내는 ‘따르다’가 가장 자연스럽고 문맥에 맞습니다.
- source_word: βεβηλῶσαι
  english_pob_choice: to profane
  chosen_korean: 더럽히게 하려는 것입니다
  alternatives_korean:
  - 속되게 하려는 것입니다
  - 성스럽지 않게 하려는 것입니다
  - 모독하게 하려는 것입니다
  lexicon: LSJ
  rationale: 안식일을 ‘거룩한 날을 일반적인 것으로 취급하다’는 종교적 뉘앙스를 한국어 ‘더럽히다’로 옮겼습니다. 여기서는 의례적·언약적 부정이 핵심입니다.
- source_word: ἡμέραν τῶν σαββάτων
  english_pob_choice: the Sabbath day
  chosen_korean: 안식일
  alternatives_korean:
  - 안식일 날
  - 안식의 날
  - 안식일의 날
  lexicon: LSJ
  rationale: 형식상 복수 표현이지만 관용적으로 단수 ‘안식일’을 가리키므로, 한국어 성경 용례에 맞게 간결하게 처리했습니다.
theological_decisions:
- issue: 안식일을 더럽히는 행위의 종교적 성격
  chosen_reading: 단순한 정치적 불복종이 아니라, 거룩한 날을 훼손하는 행위를 거부하는 고백으로 읽었습니다.
  alternative_readings:
  - 왕명 거부라는 시민적 저항에 초점을 둘 수 있습니다.
  - ‘모독하다/범하다’처럼 더 강한 표현으로 옮길 수 있습니다.
  rationale: 본문의 목적절(βεβηλῶσαι)이 안식일의 거룩함을 전제로 하므로, 종교적 긴장을 살리되 한국어에서 과도하게 거칠지 않게 표현했습니다.
  doctrine_reference: Translation philosophy §§1, 6
