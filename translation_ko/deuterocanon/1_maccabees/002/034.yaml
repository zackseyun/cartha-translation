  lexicon: LSJ
  rationale: 안식일을 ‘거룩한 날을 일반적인 것으로 취급하다’는 종교적 뉘앙스를 한국어 ‘더럽히다’로 옮겼습니다. 여기서는 의례적·언약적 부정이 핵심입니다.
- source_word: ἡμέραν τῶν σαββάτων
  english_pob_choice: the Sabbath day
  chosen_korean: 안식일
  alternatives_korean:
  - 안식일 날
  - 안식의 날
  - 안식일의 날
  lexicon: LSJ
  rationale: 형식상 복수 표현이지만 관용적으로 단수 ‘안식일’을 가리키므로, 한국어 성경 용례에 맞게 간결하게 처리했습니다.
theological_decisions:
- issue: 안식일을 더럽히는 행위의 종교적 성격
  chosen_reading: 단순한 정치적 불복종이 아니라, 거룩한 날을 훼손하는 행위를 거부하는 고백으로 읽었습니다.
  alternative_readings:
  - 왕명 거부라는 시민적 저항에 초점을 둘 수 있습니다.
  - ‘모독하다/범하다’처럼 더 강한 표현으로 옮길 수 있습니다.
  rationale: 본문의 목적절(βεβηλῶσαι)이 안식일의 거룩함을 전제로 하므로, 종교적 긴장을 살리되 한국어에서 과도하게 거칠지 않게 표현했습니다.
  doctrine_reference: Translation philosophy §§1, 6
