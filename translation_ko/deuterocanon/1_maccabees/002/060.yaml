  rationale: 이 절은 다니엘의 덕성을 요약하는 문맥이지만, ἁπλότης 자체가 단일한 한국어 대응어로 고정되기 어렵습니다. 본문에는 영어 POB의 직접성을 유지하고, 각주에서 대체 의미를 안내하는 편이 소스의 긴장을 더 잘 보존합니다.
