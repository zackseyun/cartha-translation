translation:
  language: ko
  text: 왕에게서 온 사람들[a]이 대답하여 맛다디아에게 말하였습니다. “당신은 이 도시에서 통치자이시며, 존귀하고 위대하신 분입니다. 또 아들들과 형제들로 말미암아 굳게 서 계십니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕의 사람들’. 문맥상 왕의 대표자들이나 사절들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘아들들과 형제들 가운데서 굳게 서 계십니다’. 그리스어는 가족의 지지를 받는다는 뜻이나 가족을 통해 확고한 지위에 있다는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ παρὰ τοῦ βασιλέως
  english_pob_choice: those from the king
  chosen_korean: 왕에게서 온 사람들
  alternatives_korean:
  - 왕의 사람들
  - 왕이 보낸 사람들
  lexicon: LSJ
  rationale: 직역의 ‘왕에게서’라는 출발점을 살리면서, 문맥상 왕의 대표자들을 가리키는 기능도 자연스럽게 드러내기 위해 ‘온 사람들’로 옮겼습니다.
- source_word: Ἄρχων
  english_pob_choice: ruler
  chosen_korean: 통치자
  alternatives_korean:
  - 지도자
  - 지배자
  lexicon: LSJ
  rationale: 공적 권위와 지위가 강조되므로, 단순한 ‘지도자’보다 ‘통치자’가 더 직접적으로 대응합니다.
- source_word: ἔνδοξος καὶ μέγας
  english_pob_choice: honored and great
  chosen_korean: 존귀하고 위대한
  alternatives_korean:
  - 존경받고 큰
  - 유명하고 큰
  lexicon: LSJ
  rationale: 두 형용사가 함께 높임과 탁월함을 나타내므로, ‘존귀하고 위대한’으로 격조를 살리되 과도하게 신학화하지 않았습니다.
- source_word: ἐστηριγμένος ἐν υἱοῖς καὶ ἀδελφοῖς
  english_pob_choice: supported by sons and brothers
  chosen_korean: 아들과 형제들로 말미암아 든든히 서 있습니다
  alternatives_korean:
  - 아들과 형제들로 지탱되고 있습니다
  - 아들과 형제들 가운데서 굳게 서 있습니다
  lexicon: LSJ
  rationale: ἐστηριγμένος의 ‘굳게 서다/든든히 세워지다’와 뒤의 친족 표지를 함께 살리기 위해, 단순한 ‘지지받다’보다 ‘든든히 서 있습니다’를 택했습니다.
