translation:
  language: ko
  text: 그러나 나와 내 아들들과 내 형제들은 우리 조상들의 언약을 따라 살아가겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘우리 조상들의 언약 안에서 갈 것입니다’입니다. 이 그리스어 관용구는 언약에 신실하게 살아간다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγώ
  english_pob_choice: But I
  chosen_korean: 그러나 나
  alternatives_korean:
  - 그리고 나
  - 나도
  lexicon: LSJ
  rationale: 앞선 문맥과의 대조를 살려 역접을 분명히 하되, 1인칭 강조를 유지했습니다.
- source_word: οἱ υἱοί μου
  english_pob_choice: my sons
  chosen_korean: 내 아들들
  alternatives_korean:
  - 내 자녀들
  lexicon: LSJ
  rationale: υἱοί는 성별이 특정된 ‘아들들’이므로 이를 유지했습니다.
- source_word: πορευσόμεθα
  english_pob_choice: will walk
  chosen_korean: 걸어가겠습니다
  alternatives_korean:
  - 살아가겠습니다
  - 가겠습니다
  lexicon: LSJ
  rationale: 직역의 ‘가겠습니다’보다 언약적 삶의 지속성을 드러내는 ‘걸어가겠습니다’가 문맥상의 관용을 더 잘 살립니다.
- source_word: ἐν διαθήκῃ πατέρων ἡμῶν
  english_pob_choice: in the covenant of our fathers
  chosen_korean: 우리 조상들의 언약 안에서
  alternatives_korean:
  - 우리 조상들의 언약 속에서
  - 우리 조상들의 언약에 따라
  lexicon: LSJ
  rationale: διαθήκη를 ‘언약’으로 유지하고 ἐν의 관계를 ‘안에서’로 옮겨, 언약 안에 머무르며 그에 따라 행한다는 관용을 자연스럽게 반영했습니다.
theological_decisions:
- issue: πορευσόμεθα ἐν διαθήκῃ의 관용적 의미
  chosen_reading: 언약 안에서 걸어가겠습니다
  alternative_readings:
  - 언약 안에서 가겠습니다
  - 언약에 따라 살아가겠습니다
  rationale: 이 표현은 단순 이동이 아니라 언약에 대한 지속적 충성을 뜻하므로, ‘걷다’의 성경적 관용을 살렸습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 5, 6
- issue: 가족/언약 언어의 보존
  chosen_reading: 내 아들들 ... 내 형제들 ... 우리 조상들
  alternative_readings:
  - 내 자녀들 ... 내 친족들 ... 우리 선조들
  rationale: 원문의 남성형 친족어와 족장적 언약 언어를 희석하지 않도록, 보다 구체적인 친족 표현을 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
