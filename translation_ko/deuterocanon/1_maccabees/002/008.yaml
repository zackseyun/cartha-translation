translation:
  language: ko
  text: 그분의 성소는 영광스러운 사람과 같이 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀의 성소는 영광스러운 사람과 같이 되었습니다.’ 그리스어 ναός는 ‘성전’이나 ‘성소’로 옮길 수 있고, ἔνδοξος는 ‘영광스러운’ 또는 ‘존귀한’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  english_pob_choice: became
  chosen_korean: 되었습니다
  alternatives_korean:
  - 되었습니다
  - 되어 갔습니다
  lexicon: LSJ
  rationale: 상태의 변화를 나타내는 aorist γίνομαι를 자연스러운 서술형으로 옮겼습니다.
- source_word: ναὸς
  english_pob_choice: sanctuary
  chosen_korean: 성소
  alternatives_korean:
  - 성전
  - 성막
  lexicon: LSJ
  rationale: 여기서는 ירושלים을 가리키는 의인화된 소유격 문맥이어서, 전체 성전 건물보다 예배의 핵심 공간이라는 뉘앙스를 살리는 ‘성소’가 적합합니다.
- source_word: ἔνδοξος
  english_pob_choice: of honor / honored / glorious
  chosen_korean: 영광스러운
  alternatives_korean:
  - 존귀한
  - 명예로운
  - 영예로운
  lexicon: LSJ
  rationale: ἔνδοξος는 ‘영광스러운, 존귀한, 명성이 있는’의 범위를 가지므로, 문맥상 사람의 지위와 빛남을 함께 담는 ‘영광스러운’으로 옮겼습니다.
- source_word: ὡς ἀνὴρ ἔνδοξος
  english_pob_choice: like a man of honor
  chosen_korean: 영광스러운 사람과 같이
  alternatives_korean:
  - 존귀한 사람과 같이
  - 영예로운 사람과 같이
  lexicon: LSJ
  rationale: 비교 구문을 유지하면서 성별을 과도하게 살리지 않기 위해 ‘사람’으로 풀고, ἔνδοξος의 존귀/영광 의미를 반영했습니다.
theological_decisions:
- issue: Jerusalem/temple personification through feminine possessive αὐτῆς
  chosen_reading: ‘그분의’로 직접 대체하지 않고, 문맥상 ירושלים의 의인화를 살려 ‘그분의 성소’ 대신 ‘그녀의 성소’류 표현을 피하면서 자연스러운 한국어로 처리했습니다.
  alternative_readings:
  - 그녀의 성소는
  - 그것의 성소는
  rationale: 한국어에서는 도시 의인화를 그대로 반복하면 어색할 수 있어, 본문 의미를 해치지 않는 범위에서 중성적이면서도 문맥상 대상을 가리키는 표현으로 정리했습니다.
  doctrine_reference: 시가적/예언적 의인화 표현의 번역 관행
- issue: ἔνδοξος의 긍정/비극적 대비
  chosen_reading: ‘영광스러운’으로 옮겨 원문의 품위 있는 비교 이미지를 유지했습니다.
  alternative_readings:
  - 존귀한
  - 명예로운
  - 영예로운
  rationale: 이 절은 폐허의 문맥 속에서 한때의 위엄을 떠올리게 하는 비교이므로, 지나치게 도덕적 평가로 좁히지 않고 품위와 빛남을 함께 담는 번역이 적절합니다.
  doctrine_reference: 문맥에 따른 수사적 비교 보존
