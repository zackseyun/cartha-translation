    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ κόσμος
  english_pob_choice: All her glory
  chosen_korean: 그의 모든 영광
  alternatives_korean:
  - 그의 모든 장식
  - 그의 모든 화려함
  - 그의 모든 존귀
  lexicon: LSJ
  rationale: κόσμος는 여기서 ‘세계’가 아니라 장식, 화려함, 영광/존귀를 뜻하므로, 문맥의 애도와 몰락을 살려 ‘영광’으로 옮겼습니다.
- source_word: ἀφηρέθη
  english_pob_choice: was taken away
  chosen_korean: 빼앗겼습니다
  alternatives_korean:
  - 빼앗겨졌습니다
  - 제거되었습니다
  - 거두어졌습니다
  lexicon: LSJ
  rationale: 수동 부정과 외부에 의한 박탈을 분명히 드러내기 위해, 자연스러운 한국어로 ‘빼앗겼습니다’를 선택했습니다.
- source_word: ἐλευθέρας ... δούλην
  english_pob_choice: instead of being free ... she became a slave
  chosen_korean: 자유롭던 대신에 ... 노예가 되었습니다
  alternatives_korean:
  - 자유인의 대신에 ... 종이 되었습니다
  - 자유하던 데서 ... 종이 되었습니다
  - 자유로운 여자였던 대신에 ... 노예가 되었습니다
  lexicon: LSJ
  rationale: ἐλευθέρα/δούλη의 대비를 살리되, δοῦλος 계열은 프로젝트 기본에 따라 ‘노예’로 옮겨 자유의 상실을 더 강하게 드러냈습니다.
theological_decisions:
- issue: 도시/공동체의 여성 의인화와 성별 표지
  chosen_reading: 원문의 여성 인칭을 살려 ‘그의’와 ‘자유롭던’의 서술로 자연화하되, 대상은 공동체/도시의 의인화된 상태를 뜻한다고 보았습니다.
  alternative_readings:
  - 그녀의 ... 그녀가
  - 그 성읍의 ...
  rationale: 헬라어는 여성형을 사용하지만 한국어에서는 동일한 의인화를 노골적으로 반복하기보다 문맥상 대상의 치욕과 전락을 더 자연스럽게 전달하는 편이 적절합니다.
  doctrine_reference: Translation philosophy §1; source-context of lament/personification
