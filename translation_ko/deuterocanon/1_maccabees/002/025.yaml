lexical_decisions:
- source_word: τὸν ἄνδρα τοῦ βασιλέως
  english_pob_choice: the king’s man
  chosen_korean: 왕의 사람
  alternatives_korean:
  - 왕의 관리
  - 왕의 대리인
  - 왕의 부하
  lexicon: LSJ
  rationale: ἄνδρα와 τοῦ βασιλέως의 직접적인 소속 관계를 살리면서, 직함을 지나치게 특정하지 않고 ‘왕의 사람’으로 옮겨 왕의 대리적 인물을 드러냈습니다.
- source_word: τὸν ἀναγκάζοντα θύειν
  english_pob_choice: who was compelling them to sacrifice
  chosen_korean: 제사드리도록 강요하던
  alternatives_korean:
  - 희생제사를 강요하던
  - 제사를 드리게 하던
  - 제사하도록 강제하던
  lexicon: BDAG
  rationale: ἀναγκάζω의 강압성을 ‘강요하다’로 옮기고, θύειν은 문맥상 우상제사/희생제사를 뜻하므로 ‘제사드리도록’으로 처리했습니다.
- source_word: ἀπέκτεινεν
  english_pob_choice: killed
  chosen_korean: 죽이고
  alternatives_korean:
  - 죽였고
  - 살해하고
  - 죽여
  lexicon: BDAG
  rationale: aorist의 단순한 살해 행위를 현대 한국어의 자연스러운 서술형으로 반영했습니다.
- source_word: τὸν βωμὸν καθεῖλεν
  english_pob_choice: he tore down the altar
  chosen_korean: 제단을 허물어뜨렸습니다
  alternatives_korean:
  - 제단을 헐었습니다
  - 제단을 무너뜨렸습니다
  - 제단을 부쉈습니다
  lexicon: BDAG
  rationale: καθαιρέω의 ‘내려뜨리다/철거하다’의 물리적 파괴감을 살리면서, 제의적 구조물을 무너뜨리는 행위를 자연스럽게 표현했습니다.
theological_decisions:
- issue: θύειν의 제의적 의미
  chosen_reading: ‘제사드리다’로 옮겨, 단순한 일반적 ‘희생’보다 이교 제의 강요의 문맥을 드러냈습니다.
  alternative_readings:
  - ‘희생하다’
  - ‘제사하다’
  - ‘희생제사를 드리다’
  rationale: 1 Maccabees 2장의 문맥은 율법에 반하는 강제 제사이므로, 제의적 강압을 명확히 보이도록 했습니다.
  doctrine_reference: Translation philosophy §1, §5
