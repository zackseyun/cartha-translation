  source_fidelity: 그리스어는 왕에게 속하거나 왕을 대표하는 사람을 가리키며, 그가 제사를 드리도록 강요하던 자였다고 말합니다. 초안의 ‘왕의 사람으로서 … 사람’은 수식 관계가 다소 불분명하고 중복되어 있습니다. ‘왕의 사람’을 강요 행위의 주체로 직접 수식하면 원문의 구조와 의미를 더 정확히 살릴 수 있습니다.
  naturalness: ‘그 당시’보다 문어적 성경 번역의 합쇼체에 자연스러운 ‘그때에’가 적절합니다. ‘제사드리도록’은 띄어 ‘제사를 드리도록’으로 쓰는 것이 현대 표준어에 맞습니다. ‘허물어뜨렸습니다’도 가능하나, 제단에 대한 καθαιρέω에는 간결한 ‘헐었습니다’가 자연스럽습니다.
  terminology: ‘왕의 사람’은 직위를 단정하지 않으면서 τὸν ἄνδρα τοῦ βασιλέως의 직역적 뉘앙스를 보존합니다. 각주에서 왕의 관리나 대리인일 가능성을 밝혀 이해를 돕습니다. θύειν은 문맥상 ‘제사를 드리다’로 옮겼습니다.
