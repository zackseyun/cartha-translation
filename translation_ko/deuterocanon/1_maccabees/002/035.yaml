  alternatives_korean:
  - 그들 위에
  - 그들에 대하여
  - 그들을 향해
  lexicon: BDAG
  rationale: 적대적 군사 행동의 방향을 한국어에서는 목적어형 ‘그들에게’로 자연스럽게 표현할 수 있어, 원문의 공격 방향을 유지했습니다.
- source_word: πόλεμον
  english_pob_choice: war
  chosen_korean: 전쟁
  alternatives_korean:
  - 전투
  - 공격
