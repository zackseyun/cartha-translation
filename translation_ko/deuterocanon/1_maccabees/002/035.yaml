translation:
  language: ko
  text: 그리고 그들은 그들을 상대로 서둘러 전쟁을 벌였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들은 그들을 상대로 전쟁을 서둘러 일으켰습니다” 또는 “그들은 그들을 공격하기 시작했습니다.” 그리스어는 매우 간결하며, 직역하면 “그들은 그들을 상대로 전쟁을 재촉했습니다” 정도입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτάχυναν
  english_pob_choice: they hastened
  chosen_korean: 서둘러 일으켰습니다
  alternatives_korean:
  - 서둘렀습니다
  - 재빨리 일으켰습니다
  - 급히 시작했습니다
  lexicon: LSJ
  rationale: ταχύνω의 기본 뜻인 ‘서두르게 하다/재촉하다’를 살리면서, 전쟁을 ‘일으키다’로 옮겨 군사적 행위를 자연스럽게 드러냈습니다.
- source_word: ἐπʼ αὐτούς
