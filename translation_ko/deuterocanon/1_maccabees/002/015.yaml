  text: And the king’s agents, who were compelling apostasy, came to Modein
translation:
  language: ko
  text: 그리고 왕에게서 온 그 사람들, 곧 배교를 강요하던 사람들이 모데인에 이르렀습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ παρὰ τοῦ Βασιλέως
  english_pob_choice: the king’s agents
  chosen_korean: 왕에게서 온 그 사람들
  alternatives_korean:
  - 왕의 대리인들
  - 왕의 사자들
  - 왕의 사람들
  lexicon: LSJ
  rationale: 직역하면 ‘왕에게서 온 사람들’이지만, 본문 맥락상 왕권을 위임받아 파견된 인물들이므로 한국어에서는 신분을 단정적으로 좁히지 않으면서도 파견성을 드러내는 표현을 택했습니다.
- source_word: καταναγκάζοντες
  english_pob_choice: compelling
  chosen_korean: 강요하던
  alternatives_korean:
  - 억지로 시키던
  - 강제하던
  - 압박하던
  lexicon: LSJ
  rationale: 이 분사는 단순한 권고가 아니라 강제적 압박을 뜻하므로, 현대 한국어에서 자연스럽고 힘이 있는 ‘강요하다’를 선택했습니다.
- source_word: τὴν ἀποστασίαν
  english_pob_choice: apostasy
  chosen_korean: 배교
  alternatives_korean:
  - 배반
  - 반역
  - 신앙 포기
  lexicon: LSJ
  rationale: 이 문맥의 ἀποστασία는 정치적 반란보다 조상들의 신앙과 관행을 버리게 하는 종교적 이탈을 가리키므로, 그 의미를 분명히 하는 ‘배교’가 가장 적절합니다.
- source_word: εἰς Μωδεείν
  english_pob_choice: to Modein
  chosen_korean: 모데인에
  alternatives_korean:
  - 모데인으로
  - 모데인까지
  lexicon: LSJ
  rationale: 도착을 나타내는 동사와 함께 쓰인 εἰς는 한국어에서 자연스럽게 목적지 처소를 나타내는 조사 ‘-에’로 옮겼습니다.
theological_decisions:
- issue: ἀποστασία의 의미가 정치적 반역인지 종교적 배교인지
  chosen_reading: 종교적 배교로 이해하여 본문에 드러냈습니다.
  alternative_readings:
  - 정치적 반역
  - 일반적 이탈
  rationale: 마카베오 문맥 전체가 유대 신앙과 관행을 버리도록 압박하는 상황이므로, 독자가 본문의 신학적 긴장을 놓치지 않도록 ‘배교’로 분명히 옮겼습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3, 5
