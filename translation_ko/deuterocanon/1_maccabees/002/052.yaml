  text: Was not Abraham found faithful in testing[b][a], and was it counted to him as righteousness?
  footnotes:
  - marker: a
    text: Or 'in trial'; the Greek term can also mean 'temptation,' but here it refers to Abraham's being tested.
    reason: lexical_alternative
  - marker: b
    text: An allusion to Gen 15:6, linked here with Abraham's testing.
    reason: cross_reference
translation:
  language: ko
  text: 아브라함은 시험[a] 가운데서 충실한 것으로 드러나지 않았습니까? 또 그에게 의로 여겨지지 않았습니까?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시련 가운데서’. 그리스어 용어는 ‘유혹’도 뜻할 수 있으나, 여기서는 아브라함이 시험받은 것을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 창세기 15:6에 대한 암시로, 여기서는 아브라함의 시험과 연결됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: Ἀβραὰμ
  english_pob_choice: Abraham
