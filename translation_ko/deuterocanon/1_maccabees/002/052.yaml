  yaml_path: translation/deuterocanon/1_maccabees/002/052.yaml
  text: Was not Abraham found faithful in testing[b][a], and was it counted to him as righteousness?
  footnotes:
  - marker: a
    text: Or 'in trial'; the Greek term can also mean 'temptation,' but here it refers to Abraham's being tested.
    reason: lexical_alternative
  - marker: b
    text: An allusion to Gen 15:6, linked here with Abraham's testing.
    reason: cross_reference
translation:
  language: ko
  text: 아브라함은 시험 가운데서 충실하다고 드러나지 않았습니까? 그리고 그것이 그에게 의로 여겨지지 않았습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '시련 가운데서'. 그리스어 용어는 '유혹'도 뜻할 수 있으나, 여기서는 아브라함이 시험받은 것을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 창세기 15:6에 대한 암시로, 여기서는 아브라함의 시험과 연결됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: Ἀβραὰμ
  english_pob_choice: Abraham
  chosen_korean: 아브라함
  alternatives_korean:
  - 아브람
  lexicon: 고유명사
  rationale: 족장 이름은 통용되는 성경 표기를 따르는 것이 자연스럽습니다.
- source_word: ἐν πειρασμῷ
  english_pob_choice: in testing
  chosen_korean: 시험 가운데서
  alternatives_korean:
  - 시험 속에서
  - 시련 가운데서
  - 유혹 가운데서
  lexicon: BDAG
  rationale: 여기서는 아브라함이 죄에 빠지도록 유혹받았다는 뜻이 아니라, 하나님께 시험받은 문맥이므로 '시험'이 source의 의미를 가장 잘 드러냅니다.
- source_word: εὑρέθη πιστός
  english_pob_choice: was found faithful
  chosen_korean: 충실하다고 드러나지 않았습니까
  alternatives_korean:
  - 신실하다고 여겨지지 않았습니까
  - 충실한 사람으로 판명되지 않았습니까
  lexicon: BDAG
  rationale: 수동태와 술어적 형용사는 단순 판정보다 '드러나다/판명되다'의 뉘앙스를 띠므로, 시험을 통해 충실함이 입증된 의미를 살렸습니다.
- source_word: δικαιοσύνη
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 의로 여김
  lexicon: BDAG
  rationale: 본문의 회계적·언약적 표현을 살리기 위해 '의'로 옮겼고, 뒤의 '여겨지다'와 함께 히브리서/창세기 15:6과 연결되는 평가적 의미를 유지했습니다.
theological_decisions:
- issue: 아브라함의 시험과 의로 여김의 관계
  chosen_reading: 두 절을 억지로 조화시키지 않고, 수사적 질문의 연결을 그대로 살려 아브라함의 시험과 의로 여김을 함께 제시했습니다.
  alternative_readings:
  - 창세기 22장과 15:6을 하나의 신학적 요약으로 풀어 쓰기
  - '''시험''을 ''고난''으로 완화해 해석하기'
  rationale: 그리스어는 아브라함의 시험과 의로 여김을 직접 연결하는 질문형 문장을 제시하므로, 해설을 덧붙여 흐리기보다 본문의 연결을 보존하는 것이 더 충실합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
