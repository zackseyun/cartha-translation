  text: And it was reported to the king’s men and to the forces that were in Jerusalem[a], the city of David, that men who had scattered because of the king’s command had gone down into the hidden places in the wilderness.
  footnotes:
  - marker: a
    text: Or, 'that men who had disregarded the king’s command had gone down into hiding places in the wilderness.' The Greek clause is compressed and can be understood either as dispersal in response to the decree or as violation of it.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그것이 예루살렘, 다윗 성에 있던 왕의 사람들과 군대에 보고되었는데, 왕의 명령 때문에 흩어진 사람들이 광야의 숨은 곳들로 내려갔다는 것이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνηγγέλη
  english_pob_choice: it was reported
  chosen_korean: 보고되었는데
  alternatives_korean:
  - 알려졌는데
  - 전해졌는데
  lexicon: LSJ
  rationale: 수동 과거형의 공시적 보고 표현을 한국어의 무인칭·수동 보고문으로 자연스럽게 옮겼습니다.
- source_word: τοῖς ἀνδράσιν τοῦ βασιλέως
  english_pob_choice: to the king’s men
  chosen_korean: 왕의 사람들
  alternatives_korean:
  - 왕의 신하들
  - 왕의 부하들
  lexicon: LSJ
  rationale: ἄνδρες의 기본 의미인 ‘사람들/남자들’을 살리면서도 군사·행정 문맥의 소속감을 드러내기 위해 ‘왕의 사람들’로 옮겼습니다.
- source_word: ταῖς δυνάμεσιν
  english_pob_choice: the forces
  chosen_korean: 군대
  alternatives_korean:
  - 병력
  - 군세
  lexicon: LSJ
  rationale: δυνάμεις가 여기서는 무장 병력을 가리키므로, 문맥상 가장 자연스러운 한국어로 ‘군대’를 선택했습니다.
- source_word: διεσκέδασαν τὴν ἐντολὴν τοῦ βασιλέως
  english_pob_choice: had scattered because of the king’s command
  chosen_korean: 왕의 명령 때문에 흩어진
  alternatives_korean:
  - 왕의 명령을 어긴
  - 왕의 명령을 저버린
  lexicon: LSJ
  rationale: 동사 διεσκέδασαν의 핵심인 ‘흩어지다/분산되다’를 유지하고, 목적어와의 긴장을 한국어에서는 원인구로 풀어 의미를 분명하게 했습니다.
- source_word: εἰς τοὺς κρυφοὺς
  english_pob_choice: into the hidden places
  chosen_korean: 숨은 곳들로
  alternatives_korean:
  - 숨은 장소들로
  - 은신처들로
  lexicon: LSJ
  rationale: 형용사적 substantival 표현을 ‘숨은 곳들’로 옮겨, 은폐된 장소라는 기본 이미지를 유지했습니다.
theological_decisions:
- issue: διεσκέδασαν τὴν ἐντολὴν τοῦ βασιλέως의 의미 긴장
  chosen_reading: 본문의 핵심 이미지는 ‘흩어진 사람들’이며, 왕의 명령과의 관계는 ‘때문에’로 풀어 문장으로 드러냈습니다.
  alternative_readings:
  - 왕의 명령을 어겼다
  - 왕의 명령을 무시했다
  rationale: 그리스어는 ‘흩어지다’와 ‘명령’ 사이가 압축되어 있어, 본문이 말하는 이동/도피의 흐름을 살리면서도 불편한 긴장을 과도하게 해소하지 않도록 했습니다.
  doctrine_reference: 원어 우선 원칙에 따라 문맥상 가능한 긴장을 보존합니다.
