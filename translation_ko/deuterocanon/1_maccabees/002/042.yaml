    text: 또는 ‘하시딤’ 또는 ‘아시대인’으로도 옮길 수 있으며, 율법에 열심을 가진 것으로 알려진 유대 집단을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: συναγωγὴ Ἀσιδαίων
  english_pob_choice: a company of Hasideans
  chosen_korean: 아시다이인들의 한 무리
  alternatives_korean:
  - 하시딤의 무리
  - 아시대인들의 집단
  - 아시다인들의 회중
  lexicon: LSJ
  rationale: Ἀσιδαίων은 설명적 형용사보다 고유한 집단명으로 기능하므로 음역을 유지했고, συναγωγὴ는 종교적 ‘회당’이 아니라 모인 집단이라는 뜻을 살려 ‘한 무리’로 옮겼습니다.
- source_word: ἰσχυρὰ δυνάμει
  english_pob_choice: mighty in strength
  chosen_korean: 힘이 강한
  alternatives_korean:
  - 강력한
  - 권능이 큰
  - 힘센
  lexicon: LSJ
  rationale: 원문은 힘과 능력을 겹쳐 강조하므로, 한국어에서도 중복된 강조를 살려 직역에 가깝되 자연스럽게 ‘힘이 강한’으로 표현했습니다.
- source_word: πᾶς ὁ ἑκουσιαζόμενος τῷ νόμῳ
  english_pob_choice: everyone who willingly devoted himself to the law
  chosen_korean: 율법에 스스로 기꺼이 헌신한 사람이면 누구나
  alternatives_korean:
  - 율법에 자원한 사람은 누구나
  - 율법에 기꺼이 자신을 바친 사람은 누구나
  - 율법을 자발적으로 따르는 사람은 누구나
  lexicon: LSJ
  rationale: ἑκουσιαζόμενος는 단순한 자원 이상으로 자의적·자발적 헌신을 뜻하므로 ‘스스로 기꺼이 헌신한’으로 옮겨, 율법에 대한 개인적 결단을 분명히 했습니다.
- source_word: τῷ νόμῳ
  english_pob_choice: to the law
  chosen_korean: 율법에
  alternatives_korean:
  - 율법을 위해
  - 율법을 향해
  - 율법으로
  lexicon: LSJ
  rationale: 여기서 νόμος는 모세 율법을 가리키므로 프로젝트 기본어인 ‘율법’을 유지했고, ἑκουσιαζόμενος와의 결합을 살려 여격의 관계를 한국어 조사로 자연스럽게 처리했습니다.
theological_decisions:
- issue: Ἀσιδαίων의 집단 정체성 보존
  chosen_reading: 아시다이인들의 한 무리로 음역해, 특정 역사적 유대 집단명으로 읽히게 했습니다.
  alternative_readings:
  - 경건한 사람들
  - 하시딤
  - 아시대인들
  rationale: 본문은 성향 묘사보다 역사적 집단 지칭에 가깝기 때문에, 의미로 풀지 않고 고유명사적 성격을 유지하는 편이 원문 의도에 더 가깝습니다.
  doctrine_reference: 이름은 번역보다 음역을 우선한다는 원칙
- issue: 율법에 대한 자발적 헌신의 뉘앙스
  chosen_reading: ‘율법에 스스로 기꺼이 헌신한’으로, 단순한 준수보다 자원한 충성을 드러냈습니다.
  alternative_readings:
  - 율법을 지킨
  - 율법에 열심인
  - 율법에 자원한
  rationale: 헬라어 분사는 단지 규범 준수를 말하기보다, 율법에 대한 적극적이고 자발적인 결속을 나타냅니다. 이를 약화시키지 않기 위해 ‘헌신’이라는 표현을 사용했습니다.
  doctrine_reference: 문맥이 허락하는 긴장을 유지하고 평탄화하지 않는다
