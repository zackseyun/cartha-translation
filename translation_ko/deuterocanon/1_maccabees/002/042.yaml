translation:
  language: ko
  text: 그때 이스라엘 출신으로 강한 힘을 지닌 아시다이인들의 한 무리가 그들에게 모여들었습니다[a]. 그들은 모두 율법에 스스로 기꺼이 헌신한 사람들이었습니다.
