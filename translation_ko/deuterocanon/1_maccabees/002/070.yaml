translation:
  language: ko
  text: 그리고 그는 제백사십육년[a]에 죽었습니다. 그의 아들들이 그를 모드인에 있는 조상들의 무덤들에 장사하였고, 온 이스라엘이 그를 두고 크게 애곡하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉, 아마도 셀레우코스 연대의 제백사십육년을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπέθανεν
  english_pob_choice: died
  chosen_korean: 죽었습니다
  alternatives_korean:
  - 별세했습니다
  - 세상을 떠났습니다
  lexicon: BDAG
  rationale: 그리스어 aorist는 단순한 죽음을 진술하므로, 완곡어법보다 직접적인 ‘죽었습니다’가 원문의 평이한 서술을 잘 살립니다.
- source_word: ἐν τῷ ἕκτῳ καὶ τεσσερακοστῷ καὶ ἑκατοστῷ ἔτει
  english_pob_choice: in the one hundred forty-sixth year
  chosen_korean: 제백사십육년
  alternatives_korean:
  - 백사십육년
  - 제146년
  lexicon: LSJ
  rationale: 연대 공식의 서수적 의미를 살려 자연스러운 한국어 역사 서술로 옮겼습니다.
- source_word: τάφοις πατέρων αὐτοῦ
  english_pob_choice: the tombs of his fathers
  chosen_korean: 조상들의 무덤들
  alternatives_korean:
  - 그의 아버지들의 무덤들
  - 선조들의 무덤
  lexicon: LSJ
  rationale: τάφος는 무덤/묘를 뜻하고, 여기서는 가족·조상 계열의 매장을 드러내므로 ‘조상들의 무덤들’이 원문의 친족적 뉘앙스를 비교적 투명하게 전합니다.
- source_word: ἐκόψαντο αὐτὸν πᾶς Ἰσραὴλ κοπετὸν μέγαν
  english_pob_choice: all Israel mourned for him with great mourning
  chosen_korean: 온 이스라엘이 그를 두고 크게 애곡하였습니다
  alternatives_korean:
  - 온 이스라엘이 그를 두고 크게 슬퍼하였습니다
  - 온 이스라엘이 그를 위해 큰 애곡을 하였습니다
  lexicon: BDAG
  rationale: ἐκόψαντο와 κοπετὸν μέγαν의 애도·통곡 뉘앙스를 살리기 위해 일반적 ‘슬퍼하다’보다 ‘애곡하다’를 택했습니다.
theological_decisions:
- issue: 연대 표기의 역사적 해석을 본문에 넣을지 여부
  chosen_reading: 본문에는 단순히 ‘제백사십육년’으로 두고, 셀레우코스 연대라는 해석은 각주로 처리했습니다.
  alternative_readings:
  - 제백사십육년, 곧 셀레우코스 연대
  - 제백사십육년(셀레우코스 왕조 연호)
  rationale: 그리스어 본문 자체는 연대만 제시하므로, 역사적 동일시를 본문에 삽입하기보다 주석으로 분리해 원문 수준의 절제를 유지했습니다.
  doctrine_reference: 원문 우선 원칙; 역사적 해석과 본문 번역의 구분
