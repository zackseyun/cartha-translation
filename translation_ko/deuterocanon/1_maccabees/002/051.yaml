  source_fidelity: 그리스어는 조상들이 ‘그들의 세대들 가운데’ 행한 행적을 기억하라는 단일 명령 뒤에 영광을 받으라는 명령을 둡니다. 초안은 ‘기억하십시오’가 두 번 반복되어 원문에 없는 명령과 중복을 만들었습니다. ‘각자의 시대에’는 ταῖς γενεαῖς αὐτῶν의 문맥상 의미를 자연스러운 한국어로 보존합니다.
  naturalness: 합쇼체와 어휘 선택은 대체로 자연스럽습니다. 다만 첫 문장 뒤에 다시 ‘기억하고’를 반복한 구조는 부자연스럽고 의미상 중복됩니다. 한 문장으로 정리하면 원문의 병렬 명령과 한국어 흐름이 모두 살아납니다.
