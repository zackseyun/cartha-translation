  lexicon: BDAG
  rationale: 문자적으로는 '우리의 아버지들'이지만, 문맥상 이스라엘의 선조들을 가리키므로 한국어에서는 더 자연스러운 '조상들'을 택하되 소유격 구조는 유지했습니다.
- source_word: ἔργα ... ἐποίησαν
  english_pob_choice: deeds ... which they did
  chosen_korean: 행적 ... 행한 일들
  alternatives_korean:
  - 일들 ... 한 일들
  - 업적 ... 이룬 일들
  lexicon: BDAG
  rationale: ἔργα는 단순한 '일'보다 눈에 띄는 행동과 성취를 가리키므로, 기억하라는 권면에 맞게 '행적'과 '행한 일들'로 옮겼습니다.
- source_word: δόξαν μεγάλην καὶ δόξαν αἰώνιον
  english_pob_choice: great glory and everlasting glory
  chosen_korean: 큰 영광과 영원한 영광
  alternatives_korean:
  - 큰 영광과 영원한 명예
  - 큰 영광과 영원한 영예
  lexicon: BDAG
  rationale: δόξα의 반복을 한국어에서도 그대로 살려 '영광'을 두 번 유지했습니다. δεύτερη δόξα는 지속성을 강조하는 수식인 '영원한'과 결합해 직역에 가깝게 처리했습니다.
