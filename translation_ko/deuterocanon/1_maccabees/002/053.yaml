translation:
  language: ko
  text: 요셉은 환난의 때에 명령을 지켰고, 이집트의 주가 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘명령 하나’ 혹은 ‘그 명령’일 수 있습니다. 그리스어는 여기서 어떤 명령인지 특정하지 않으며, 요셉의 전반적 순종을 요약할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰωσὴφ
  english_pob_choice: Joseph
  chosen_korean: 요셉
  alternatives_korean:
  - 요제프
  lexicon: 고유명사 관용 표기
  rationale: 성경에서 널리 통용되는 한국어 이름을 유지했습니다.
- source_word: ἐν καιρῷ στενοχωρίας αὐτοῦ
  english_pob_choice: in the time of his distress
  chosen_korean: 환난의 때에
  alternatives_korean:
  - 그의 고난의 때에
  - 그의 곤란의 때에
  lexicon: LSJ
  rationale: στενοχωρία의 압박·곤궁 의미를 살리되, 한국어에서 자연스럽고 성경적 문맥에 맞는 표현으로 압축했습니다.
- source_word: ἐφύλαξε ἐντολήν
  english_pob_choice: kept the commandment
  chosen_korean: 명령을 지켰고
  alternatives_korean:
  - 계명을 지켰고
  - 그 명령을 지켰고
  lexicon: BDAG
  rationale: ἔντολήν은 여기서 특정 조항을 지시하지 않는 일반적 단수이므로, 영어 주석처럼 ‘the commandment’로 고정하기보다 한국어에서는 범용적인 ‘명령’으로 옮겨 특정화를 피했습니다.
- source_word: κύριος Αἰγύπτου
  english_pob_choice: lord of Egypt
  chosen_korean: 이집트의 주가 되었습니다
  alternatives_korean:
  - 이집트의 통치자가 되었습니다
  - 이집트의 주인이 되었습니다
  lexicon: BDAG
  rationale: κύριος가 여기서는 신적 호칭이 아니라 지위·권세를 가리키므로, ‘주’로 옮겨 높은 권위를 살리면서도 ‘주인’보다 덜 사적인 표현을 택했습니다.
theological_decisions:
- issue: 요셉이 지킨 ‘명령’의 범위
  chosen_reading: 본문이 특정 계명을 밝히지 않으므로, 요셉의 일반적인 순종을 가리키는 말로 남겨 둡니다.
  alternative_readings:
  - 보디발의 아내 유혹 거절 같은 특정 사건을 암시하는 말로 좁혀 읽기
  rationale: 그리스어는 무엇을 가리키는지 명시하지 않으므로, 해석을 좁히지 않고 원문의 요지를 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
