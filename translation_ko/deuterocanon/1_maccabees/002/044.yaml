base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/044.yaml
  text: They joined them and became a support for them[a]. They also formed a force and struck down sinners in their anger, and lawless men in their wrath[b]; and the rest fled to the nations to save themselves.
  footnotes:
  - marker: a
    text: Or 'were added to them.' The Greek verb can be rendered more formally as accession to the group.
    reason: lexical_alternative
  - marker: b
    text: '''To the nations'' likely means to surrounding non-Jewish peoples or territories; compare the related sense ''to the Gentiles.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그들에게 합류하여 그들의 버팀목이 되었습니다[a]. 또 그들은 군대를 조직하여, 자기들의 분노로 죄인들을 쳐서 쓰러뜨리고 자기들의 격분으로 무법한 남자들을 쳐서 쓰러뜨렸습니다. 그리고 나머지는 살아남으려고 민족들에게로 도망쳤습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들에게 더해졌다’ 또는 ‘그들에게 붙었다’입니다. 여기서는 한 무리에 새로 가담한 뜻을 자연스럽게 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘민족들’은 이 마카베오기 문맥에서 주변의 비유대 민족들 또는 그들의 영역을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσετέθησαν
  english_pob_choice: joined
  chosen_korean: 합류하여
  alternatives_korean:
  - 더해져
  - 합쳐져
  - 붙어
  lexicon: LSJ
  rationale: 사람들이 어떤 집단에 새로 가담하는 뜻을 자연스럽게 살리되, 단순한 수적 증가만이 아니라 편입·가담의 의미를 드러내기 위해 「합류하다」를 택했습니다.
- source_word: εἰς στήριγμα
  english_pob_choice: a support
  chosen_korean: 버팀목
  alternatives_korean:
  - 지지
  - 도움
  - 받침
  lexicon: LSJ
  rationale: στήριγμα은 실제로 받쳐 주는 ‘지지대’의 뉘앙스가 있어, 문맥의 군사적·공동체적 강도를 살리면서도 과도하게 해석하지 않는 「버팀목」이 적절합니다.
- source_word: ἐπάταξαν
  english_pob_choice: struck down
  chosen_korean: 쳐서 넘어뜨리고
  alternatives_korean:
  - 쳐서 쓰러뜨리고
  - 쓰러뜨리고
  - 쳐 죽이고
  lexicon: LSJ
  rationale: πατάσσω의 강한 타격감을 보존하되, 반드시 살해를 뜻한다고 단정하지 않기 위해 「쳐서 넘어뜨리다」로 옮겼습니다.
- source_word: ἁμαρτωλοὺς
  english_pob_choice: sinners
  chosen_korean: 죄인들
  alternatives_korean:
  - 죄인
  - 죄 많은 사람들
  - 악인들
  lexicon: LSJ
  rationale: 원문은 단순한 정치적 반대자가 아니라 도덕·종교적 평가어를 사용하므로, 그 판단을 약화시키지 않는 「죄인들」을 유지했습니다.
- source_word: ἄνδρας ἀνόμους
  english_pob_choice: lawless men
  chosen_korean: 불법한 사람들
  alternatives_korean:
  - 불법한 남자들
  - 율법 없는 사람들
  - 악한 사람들
  lexicon: LSJ
  rationale: ἀνόμους의 ‘율법 없음/불법함’을 살리면서도 한국어에서 보다 자연스럽게 들리도록 「불법한 사람들」로 옮겼습니다. 원문의 남성형은 이 문맥에서 한국어 관용상 과도하게 노출하지 않았습니다.
- source_word: εἰς τὰ ἔθνη
  english_pob_choice: to the nations
  chosen_korean: 민족들로
  alternatives_korean:
  - 나라들로
  - 이방 민족들로
  - 이방인들에게
  lexicon: LSJ
  rationale: 마카베오기 문맥의 ἔθνη는 주변 비유대 민족들을 가리키므로, NT식 고유어인 ‘이방인들’보다 문맥적으로 더 넓고 직접적인 「민족들」을 택했습니다.
- source_word: σωθῆναι
  english_pob_choice: to save themselves
  chosen_korean: 살아남으려고
  alternatives_korean:
  - 구원받으려고
  - 자기들을 구하려고
  - 도피하려고
  lexicon: LSJ
  rationale: 여기서는 신학적 ‘구원’보다 전투에서 목숨을 건짐이라는 실질적 목적이 두드러지므로, 한국어로는 「살아남으려고」가 가장 자연스럽고 의미를 보존합니다.
theological_decisions:
- issue: ἁμαρτωλοί와 ἀνόμοι를 도덕적 평가어로 유지할지 여부
  chosen_reading: ‘죄인들’과 ‘불법한 사람들’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 반역자들
  - 악인들
  - 무법자들
  rationale: 본문은 전쟁 서술이지만 이를 단순한 정치 충돌로 환원하지 않고, 공동체 내부의 도덕·율법적 판단을 그대로 드러냅니다.
  doctrine_reference: Translation philosophy §§1, 5
- issue: σωθῆναι의 의미를 ‘구원’으로 볼지 ‘생존’으로 볼지
  chosen_reading: 문맥상 전투 후 도피의 목적이므로 ‘살아남으려고’로 번역했습니다.
  alternative_readings:
  - 구원받으려고
  - 안전하려고
  - 도망치려고
  rationale: 문맥은 종말론적 구원보다 생존을 위한 피난을 말하므로, 신학어를 덧씌우기보다 서술의 실제 목적을 분명히 하는 편이 원문 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3
