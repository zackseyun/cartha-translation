  source_fidelity: 전체 구조와 핵심 어휘는 대체로 원문에 충실합니다. 그러나 ἐπάταξαν은 두 목적어에 공통으로 걸리는 동사인데, 초안은 ‘쳐서 넘어뜨리고’와 ‘쳐부쉈습니다’로 서로 다른 결과·강도의 동작으로 나누어 옮겨 원문의 병렬을 약간 흐립니다. 또한 ἄνδρας의 명시된 남성성을 ‘사람들’로 중화하지 않는 편이 더 충실합니다.
  naturalness: ‘그들을 떠받치는 버팀목’은 ‘버팀목’ 자체에 이미 지지·받침의 뜻이 있어 다소 중복됩니다. ‘그들의 버팀목’이 자연스럽고 간결합니다. ‘무법한 남자들’은 현대 한국어에서 다소 딱딱하지만, 이 문맥에서는 원문의 남성 명시와 평가적 어조를 보존하는 안전한 표현입니다.
  terminology: ‘죄인들’은 ἁμαρτωλούς의 도덕·종교적 평가를 적절히 보존합니다. ἀνόμους는 법률상의 단순 위법보다 규범·율법을 무시하는 뜻을 포함하므로 ‘무법한’이 ‘불법한’보다 적합합니다. ‘민족들’은 τὰ ἔθνη를 직접적으로 유지하며, 문맥상 비유대 민족이라는 가능성은 각주로 제시하는 것이 좋습니다.
  issues:
  - severity: medium
    issue: 각주 b의 표지가 ‘민족들’이 아니라 앞선 폭력 서술 뒤에 붙어 있습니다.
    rationale: 각주 b는 εἰς τὰ ἔθνη/‘민족들’을 설명하므로 해당 어구에 직접 표지를 붙여야 독자가 각주의 지시 대상을 혼동하지 않습니다.
  - severity: medium
    issue: 두 병렬 목적어에 대한 ἐπάταξαν의 번역이 ‘쳐서 넘어뜨리고’와 ‘쳐부쉈습니다’로 달라졌습니다.
    rationale: 원문은 한 동사로 ‘죄인들’과 ‘무법한 남자들’을 병렬로 연결합니다. 결과를 더 강하게 암시하는 ‘쳐부수다’를 후반부에만 쓰면 원문에 없는 차이가 생깁니다.
  - severity: low
    issue: ‘그들을 떠받치는 버팀목’이 어휘적으로 중복됩니다.
    rationale: στήριγμα은 ‘버팀목’만으로 지지의 의미가 충분히 드러납니다.
  - severity: low
    issue: ἄνδρας를 ‘사람들’로 옮겨 원문의 명시적 남성성을 반영하지 못합니다.
    rationale: 본문은 ἀνόμους를 수식하는 남성 복수 명사 ἄνδρας를 사용하므로, 자연성을 해치지 않는 범위에서 ‘남자들’을 유지하는 편이 원문 및 프로젝트의 성별 정확성 원칙에 맞습니다.
