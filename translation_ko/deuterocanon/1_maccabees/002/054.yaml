  lexicon: LSJ
  rationale: 동족어 반복의 강조를 살리기 위해 ‘열심’과 ‘열심을 내어’의 중첩을 유지했습니다. 한국어에서 ‘질투’보다 여기서는 종교적 열심의 의미가 분명하므로 ‘열심’이 더 적절합니다.
- source_word: διαθήκην ἱερωσύνης ἁγίας
