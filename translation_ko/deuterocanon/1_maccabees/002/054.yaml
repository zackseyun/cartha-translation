    text: 또는 더 매끄럽게는 ‘열심을 보였을 때’입니다. 그리스어는 강조를 위해 문자적으로는 ‘열심으로 열심을 내어’라는 동족어 표현을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Φινεὲς
  english_pob_choice: Phinehas
  chosen_korean: 비느하스
  alternatives_korean:
  - 피느하스
  - 비네하스
  lexicon: 고유명사 표기 관례
  rationale: 성경 인명으로 널리 통용되는 한국어 음역을 따랐습니다.
- source_word: ὁ πατὴρ ἡμῶν
  english_pob_choice: our father
  chosen_korean: 우리의 조상
  alternatives_korean:
  - 우리의 아버지
  - 우리 조상
  lexicon: 문맥 기반 어휘 대응
  rationale: 직역하면 ‘우리의 아버지’이지만, 여기서는 혈연 호칭보다 조상-전승을 가리키므로 한국어에서 자연스럽고 의미를 보존하는 ‘조상’으로 옮겼습니다.
- source_word: ἐν τῷ ζηλῶσαι ζῆλον
  english_pob_choice: because he was zealous with zeal
  chosen_korean: 열심으로 열심을 내어
  alternatives_korean:
  - 열심을 품어
  - 열심히 열심을 내어
  - 열정을 가지고 열심을 내어
  lexicon: LSJ
  rationale: 동족어 반복의 강조를 살리기 위해 ‘열심’과 ‘열심을 내어’의 중첩을 유지했습니다. 한국어에서 ‘질투’보다 여기서는 종교적 열심의 의미가 분명하므로 ‘열심’이 더 적절합니다.
- source_word: διαθήκην ἱερωσύνης ἁγίας
  english_pob_choice: a covenant of holy priesthood
  chosen_korean: 거룩한 제사장직의 언약
  alternatives_korean:
  - 거룩한 제사장직의 언약
  - 성스러운 제사장직의 언약
  - 거룩한 제사장 직분의 언약
  lexicon: LSJ
  rationale: ‘διαθήκη’를 ‘언약’으로, ‘ἱερωσύνη’를 제도적 직분을 드러내는 ‘제사장직’으로 옮겼습니다. ‘거룩한’은 제사장직의 성격을 직접 수식하도록 배치했습니다.
theological_decisions:
- issue: Phinehas 전승의 언약 표현과 신학적 중량감
  chosen_reading: ‘거룩한 제사장직의 언약’으로 옮겨, 비느하스 전승이 단순 보상이 아니라 언약적 수여임을 분명히 했습니다.
  alternative_readings:
  - 제사장직의 성스러운 언약
  - 거룩한 제사장직에 관한 언약
  rationale: 원문의 διαθήκη는 단순 합의가 아니라 언약이므로 이를 약화시키지 않았습니다. 또한 ‘거룩한’은 제사장직의 성별된 성격을 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.'
