  text: And now[a], children, be zealous for the law[b], and give your lives for the covenant of our fathers.
  footnotes:
  - marker: a
    text: Or 'sons' for 'children.' The Greek term is τέκνα, a familial address that can denote offspring generally.
    reason: lexical_alternative
  - marker: b
    text: Or 'for the sake of the covenant of our fathers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이제, 자녀들아, 율법에 열심을 내고 우리 조상들의 언약을 위하여 너희의 목숨을 바치십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: τέκνα는 문자적으로 ‘자녀들’이지만, ‘아들들’이라는 성별 특정 호칭으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ὑπέρ는 여기서 ‘~을 위하여’라는 희생적 의미를 띠므로, ‘우리 조상들의 언약을 위하여’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνα
  english_pob_choice: children
  chosen_korean: 자녀들아
  alternatives_korean:
  - 아이들아
  - 아들들아
  lexicon: LSJ
  rationale: 가족적 호칭을 살리면서도 남성으로 한정하지 않는 직접호칭으로 옮겼습니다. 마카베오스 문맥의 아들들에게 말하지만, ελλην어 τέκνα의 일반적 친족 호칭을 그대로 반영합니다.
- source_word: ζηλώσατε
  english_pob_choice: be zealous for
  chosen_korean: 율법에 열심을 내고
  alternatives_korean:
  - 율법을 위하여 열심히 하고
  - 율법을 질투하며
  lexicon: LSJ
  rationale: 명령형의 강한 헌신 촉구를 한국어의 관용적 표현으로 살렸습니다. ‘질투하다’는 현대어에서 오해를 부르므로 피했습니다.
- source_word: τῷ νόμῳ
  english_pob_choice: the law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 모세의 율법
  lexicon: LSJ
  rationale: 유대 경전 맥락의 νόμος이므로 일반적인 ‘법’보다 토라를 가리키는 ‘율법’이 더 정확합니다.
- source_word: δότε τὰς ψυχὰς ὑμῶν ὑπὲρ
  english_pob_choice: give your lives for
  chosen_korean: 너희의 목숨을 바치십시오
  alternatives_korean:
  - 너희의 생명을 내어주십시오
  - 너희의 영혼을 주십시오
  lexicon: LSJ
  rationale: ψυχή는 여기서 불멸의 영혼보다 생명 자체를 뜻하므로 ‘목숨’이 가장 자연스럽습니다. ‘바치다’는 희생적 헌신의 뉘앙스를 전달합니다.
- source_word: διαθήκης πατέρων ἡμῶν
  english_pob_choice: the covenant of our fathers
  chosen_korean: 우리 조상들의 언약
  alternatives_korean:
  - 우리 조상들의 계약
  - 우리 아버지들의 언약
  lexicon: LSJ
  rationale: διαθήκη는 성경적 맥락에서 ‘언약’이 적절하며, πατέρων ἡμῶν은 문자적으로 ‘우리 조상들의/우리 아버지들의’이지만 한국어에서는 ‘조상들’이 자연스럽고 문맥상도 분명합니다.
theological_decisions:
- issue: ψυχή의 의미
  chosen_reading: 목숨
  alternative_readings:
  - 영혼
  - 자기 자신
  rationale: 이 절은 순교적 결단을 촉구하므로 ψυχή를 존재론적 ‘영혼’이 아니라 희생할 수 있는 생명으로 읽는 것이 본문 의도에 맞습니다.
  doctrine_reference: Translation philosophy 1, 6
