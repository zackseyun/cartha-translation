  - 우리 아버지들의 언약
  lexicon: LSJ
  rationale: διαθήκη는 성경적 맥락에서 ‘언약’이 적절하며, πατέρων ἡμῶν은 문자적으로 ‘우리 조상들의/우리 아버지들의’이지만 한국어에서는 ‘조상들’이 자연스럽고 문맥상도 분명합니다.
