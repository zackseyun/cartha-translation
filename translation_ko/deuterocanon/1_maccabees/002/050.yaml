translation:
  language: ko
  text: 그리고 이제, 자녀들아, 율법에 열성을 보이고 우리 조상들의 언약을 위해 너희 목숨을 바치십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: τέκνα는 문자적으로 ‘자녀들’이며, 이 문맥에서는 ‘아들들’로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리 조상들의 언약을 위하여’로 옮길 수 있습니다. ὑπέρ는 여기서 그 언약을 위해 목숨을 내어놓는다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνα
  english_pob_choice: children
  chosen_korean: 자녀들아
