  text: And the days drew near for Mattathias to die[a], and he said to his sons, “Now arrogance and reproach have grown strong[b], and it is a time of ruin and furious wrath.”
  footnotes:
  - marker: a
    text: Or 'have been established' for 'have grown strong'; the Greek verb can emphasize that arrogance and reproach have become firmly entrenched.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'furious wrath' literally combines two closely related Greek terms for anger, intensifying the sense. The text does not specify whose wrath is meant.
    reason: lexical_alternative
translation:
  language: ko
  text: 마타티아스가 죽을 날이 다가왔고[a], 그가 아들들에게 말했습니다. 「이제 교만과 비난이 굳어졌고[b], 파멸의 때와 격렬한 진노의 때입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죽을 때가 다가왔고’. 그리스어는 ‘죽기 위한 날들’이라는 식의 표현을 써서 임박한 죽음을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘굳게 서 있습니다’/‘확립되었습니다’. 동사는 교만과 비난이 단단히 자리 잡은 상태를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγγισαν αἱ ἡμέραι ... ἀποθανεῖν
  english_pob_choice: the days drew near ... to die
  chosen_korean: 죽을 날이 다가왔고
  alternatives_korean:
