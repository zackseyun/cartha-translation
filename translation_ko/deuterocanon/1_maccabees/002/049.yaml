  - 죽음의 날이 다가왔고
  lexicon: LSJ
  rationale: 그리스어의 시간표현을 자연스러운 한국어로 옮기되, 임박한 죽음을 직접적으로 드러내는 흐름을 유지했습니다.
- source_word: ἐστηρίχθη
  english_pob_choice: have grown strong
  chosen_korean: 굳어졌고
  alternatives_korean:
  - 굳게 서 있었고
  - 강해졌고
  - 확립되었고
  lexicon: LSJ
  rationale: 수동형의 결과 상태를 살려, 교만과 비난이 단지 강해진 것이 아니라 굳게 자리 잡은 상태를 나타내도록 했습니다.
- source_word: ὑπερηφανία
  english_pob_choice: arrogance
  chosen_korean: 교만
  alternatives_korean:
  - 오만
  - 거만
  lexicon: LSJ
  rationale: 이 문맥에서 도덕적 결함을 직접 가리키는 표현으로, 표준적인 성서 한국어 독해에 가장 잘 맞는 '교만'을 택했습니다.
- source_word: ἔλεγμος
  english_pob_choice: reproach
  chosen_korean: 비난
  alternatives_korean:
  - 꾸짖음
  - 수치
  - 모욕
  lexicon: LSJ
  rationale: 말로 하는 책망보다, 공동체적·도덕적 책망의 상태를 드러내는 표현으로 '비난'이 문맥에 적합합니다.
- source_word: καιρὸς καταστροφῆς καὶ ὀργὴ θυμοῦ
  english_pob_choice: a time of ruin and furious wrath
  chosen_korean: 파멸의 때와 격렬한 진노의 때
  alternatives_korean:
  - 파괴의 때와 격렬한 분노의 때
  - 멸망의 때와 타오르는 진노의 때
  lexicon: LSJ
  rationale: καταστροφή의 파국성을 '파멸'로 살리고, θυμός가 더해진 ὀργή의 강도를 '격렬한 진노'로 옮겨 중첩된 분노의 세기를 보존했습니다.
theological_decisions:
- issue: ὀργὴ θυμοῦ의 분노가 누구의 것인지
  chosen_reading: 분노의 주체를 밝히지 않고, 본문이 제시하는 위기 진단 자체를 그대로 유지했습니다.
  alternative_readings:
  - 하나님의 진노로 명시하기
  - 인간의 분노나 박해로 해석하기
  rationale: 그리스어는 진노를 말하지만 주체를 명시하지 않으므로, 해석을 덧씌우지 않고 긴장을 보존했습니다.
  doctrine_reference: 서술의 모호성을 유지하여 본문 수준의 의미를 보존함.
