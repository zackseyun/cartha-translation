  lexicon: LSJ
  rationale: καταστροφή의 파국성을 '파멸'로 살리고, θυμός가 더해진 ὀργή의 강도를 '격렬한 진노'로 옮겨 중첩된 분노의 세기를 보존했습니다.
theological_decisions:
- issue: ὀργὴ θυμοῦ의 분노가 누구의 것인지
  chosen_reading: 분노의 주체를 밝히지 않고, 본문이 제시하는 위기 진단 자체를 그대로 유지했습니다.
  alternative_readings:
  - 하나님의 진노로 명시하기
  - 인간의 분노나 박해로 해석하기
  rationale: 그리스어는 진노를 말하지만 주체를 명시하지 않으므로, 해석을 덧씌우지 않고 긴장을 보존했습니다.
  doctrine_reference: 서술의 모호성을 유지하여 본문 수준의 의미를 보존함.
