  naturalness: ‘그리고 악에서 도망치는 사람들은 모두’는 한국어에서 주제 표지와 ‘모두’가 겹쳐 미완결 절로서도 다소 부자연스럽습니다. ‘그리고 악한 것들을 피해 달아나는 모든 이들이’는 원문의 분사적·미완결 구조를 유지하면서 더 자연스럽습니다.
