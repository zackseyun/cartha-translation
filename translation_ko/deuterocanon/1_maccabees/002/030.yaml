translation:
  language: ko
  text: 그들과 그들의 아들들과 그들의 아내들과 그들의 가축들까지도, 이는 그들에게 닥친 재앙들이 심각해졌기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘고난들’ 또는 ‘재난들이 그들 위에 심해졌다’로 볼 수 있습니다. 그리스어 표현은 관용적으로 고난이나 역경을 뜻하는 ‘악들’을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱοὶ
  english_pob_choice: sons
  chosen_korean: 아들들
  alternatives_korean:
  - 자녀들
  lexicon: LSJ
  rationale: 그리스어는 성중립적인 ‘자녀들’이 아니라 분명히 ‘아들들’을 말하므로, 가족 목록에서도 이를 그대로 반영했습니다.
- source_word: γυναῖκες
  english_pob_choice: wives
  chosen_korean: 아내들
  alternatives_korean:
  - 여인들
  - 여자들
  lexicon: LSJ
  rationale: ‘그들의’와 결합된 가정 목록 문맥에서는 일반적인 ‘여자들’보다 ‘아내들’이 소유 관계와 가정적 맥락을 더 정확히 드러냅니다.
- source_word: κτήνη
  english_pob_choice: livestock
  chosen_korean: 가축들
  alternatives_korean:
  - 집짐승들
  - 가축
  lexicon: LSJ
  rationale: 가정의 재산으로서 길들여진 동물들을 가리키므로 현대 한국어에서는 ‘가축들’이 자연스럽고 넓은 범위를 포괄합니다.
- source_word: τὰ κακά
  english_pob_choice: the evils
  chosen_korean: 재앙들이
  alternatives_korean:
  - 고통들이
  - 불행들이
  - 악한 일들이
  lexicon: LSJ
  rationale: 직역의 ‘악들’은 한국어에서 오해를 부를 수 있어, 문맥상 닥친 고난·재난의 의미를 살리면서도 본문의 압박감을 유지하는 ‘재앙들’로 옮겼습니다.
theological_decisions:
- issue: ἐσκληρύνθη ἐπʼ αὐτοὺς τὰ κακά의 관용적 의미
  chosen_reading: ‘그들에게 닥친 재앙들이 심각해졌기 때문입니다’로 옮겨, ‘악들’이라는 형식보다 고난의 압박이 점점 커진다는 뜻을 드러냈습니다.
  alternative_readings:
  - ‘그들에게 닥친 악들이 굳어졌기 때문입니다’
  - ‘재앙들이 그들 위에 거세졌기 때문입니다’
  rationale: 이 표현은 도덕적 ‘악’의 증가라기보다, 실제로 그들을 짓누르는 재난과 고난의 심화를 가리키는 관용적 용법으로 읽는 것이 문맥에 더 적합합니다.
  doctrine_reference: 문맥적 의미론 / 관용구 처리
