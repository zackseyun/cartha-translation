  text: 그들은 안식일에 전투 중에 그들을 향해 일어났고, 그들과 그들의 아내들과 그들의 자녀들과 그들의 가축이 죽었습니다 — 사람 약 천 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
