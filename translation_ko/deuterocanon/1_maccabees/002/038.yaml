    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέστησαν ἐπʼ αὐτοὺς
  english_pob_choice: rose up against them
  chosen_korean: 그들을 향해 일어났고
  alternatives_korean:
  - 그들에게 맞서 일어났고
  - 그들을 공격했고
  lexicon: LSJ
  rationale: 반역적·적대적 행동의 관용을 살리되, 한국어에서는 ‘일어나다’와 ‘향하다’를 함께 써서 원문의 동작성과 적대성을 자연스럽게 드러냈습니다.
- source_word: ἐν τῷ πολέμῳ
  english_pob_choice: in battle
  chosen_korean: 전투 중에
  alternatives_korean:
  - 전쟁에서
  - 싸움 중에
  lexicon: LSJ
  rationale: 지속적인 전쟁 일반보다 그 순간의 충돌을 가리키므로, 현대 한국어로는 ‘전투 중에’가 가장 직접적입니다.
- source_word: τοῖς σάββασιν
  english_pob_choice: on the Sabbath
  chosen_korean: 안식일에
  alternatives_korean:
  - 안식일들에
  - 안식일에
  lexicon: LSJ
  rationale: 그리스어 복수형이지만 여기서는 특정한 안식일 사건을 가리키는 관용적 표현으로 이해되어, 한국어에서는 단수형 ‘안식일에’로 옮겼습니다.
- source_word: ἕως χιλίων ψυχῶν ἀνθρώπων
  english_pob_choice: about a thousand persons
  chosen_korean: 사람 약 천 명이었습니다
  alternatives_korean:
  - 최대 천 명가량이었습니다
  - 약 천 명의 사람들입니다
  lexicon: LSJ
  rationale: ἕως가 정확한 집계를 넘어 상한 또는 대략을 나타낼 수 있으므로, ‘약 천 명’으로 근사치를 살리고 ψυχῶν ἀνθρώπων의 인명 계산을 반영했습니다.
