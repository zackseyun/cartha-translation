  alternative_readings:
  - 안식일을 범한 공격으로 풀어 도덕적 함의를 앞세우는 읽기
  - 완곡하게 단순한 전투 시점으로만 만드는 읽기
  rationale: 원문은 사건의 사실관계를 진술하며, 본문 자체가 독자가 느껴야 할 긴장을 충분히 담고 있으므로 추가 해석을 삽입하지 않는 편이 더 충실합니다.
  doctrine_reference: 본문-우선 역사 서술 원칙
