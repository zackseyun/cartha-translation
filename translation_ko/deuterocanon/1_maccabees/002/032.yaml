translation:
  language: ko
  text: 그리고 많은 사람이 그들을 뒤쫓아 갔습니다. 그들을 따라잡자 그들에 맞서 진을 치고, 안식일에 그들과 전쟁을 벌였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로는 '안식일들의 날'이지만, 관용적으로는 '안식일'을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδραμον ὀπίσω αὐτῶν
  english_pob_choice: ran after them
  chosen_korean: 그들을 뒤쫓아 갔습니다
  alternatives_korean:
  - 그들을 따라 달렸습니다
  - 그들을 쫓아갔습니다
  lexicon: LSJ
  rationale: 추격의 동작을 자연스럽게 살리면서도, 단순한 위치 표현인 '뒤에 달렸다'보다 원문의 역동성을 더 잘 드러냅니다.
- source_word: καταλαβόντες αὐτούς
  english_pob_choice: when they caught up with them
  chosen_korean: 그들을 따라잡자
  alternatives_korean:
  - 그들을 따라잡은 뒤
  - 그들을 붙잡자
  lexicon: LSJ
  rationale: 문맥상 '붙잡다'보다 '따라잡다/추월하다'가 추격 장면에 맞으며, 이어지는 군사 행동의 순서를 자연스럽게 연결합니다.
- source_word: παρενέβαλον ἐπʼ αὐτούς
  english_pob_choice: they encamped against them
  chosen_korean: 그들에 맞서 진을 치고
  alternatives_korean:
  - 그들에 맞서 진을 쳤고
  - 그들 맞은편에 진을 치고
  lexicon: LSJ
  rationale: 군사적 배치인 παρεμβάλλω의 뜻을 살려 '진을 치다'로 옮기고, ἐπί의 대립적 방향을 '맞서'로 드러냈습니다.
- source_word: συνεστείλαντο πρὸς αὐτοὺς πόλεμον
  english_pob_choice: joined battle with them
  chosen_korean: 그들과 전쟁을 벌였습니다
  alternatives_korean:
  - 그들과 싸움을 벌였습니다
  - 그들과 전투를 벌였습니다
  lexicon: LSJ
  rationale: 단순한 '싸움'보다 전쟁/전투의 군사적 성격이 분명하므로, POB의 결정을 따라 전쟁 행동을 자연스럽게 표현했습니다.
- source_word: ἐν τῇ ἡμέρᾳ τῶν σαββάτων
  english_pob_choice: on the Sabbath day
  chosen_korean: 안식일에
  alternatives_korean:
  - 안식일 날
  - 안식일에 있었던 날
  lexicon: LSJ
  rationale: 그리스어는 직역하면 '안식일들의 날'이지만 관용적으로 단수 의미이므로, 한국어에서는 가장 자연스러운 '안식일에'로 옮겼습니다.
theological_decisions:
- issue: 안식일(σαββάτων)의 관용적 복수형 처리
  chosen_reading: 안식일에
  alternative_readings:
  - 안식일 날에
  - 안식일들의 날에
  rationale: 유대력 맥락을 유지하면서도 한국어 독자가 실제 의미를 즉시 이해하도록, 관용적 단수 의미를 반영했습니다.
  doctrine_reference: 성경 번역의 명료성 우선; 유대적 절기 맥락 보존
