  text: 그리고 많은 사람이 그들을 뒤쫓아 달려갔습니다. 그들을 따라잡은 뒤 그들을 맞아 진을 치고, 안식일에 그들과 전투를 벌였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
