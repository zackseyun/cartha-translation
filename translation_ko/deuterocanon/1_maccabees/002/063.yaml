base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/063.yaml
  text: Today he will be exalted[a], and he will surely not be found, because he has returned to his dust[b], and his plans have perished.
  footnotes:
  - marker: a
    text: Or 'will be exalted.' The Greek 'will be lifted up' may refer to being raised in status or prominence.
    reason: lexical_alternative
  - marker: b
    text: '''His thought'' can also be rendered ''his plan'' or ''his reasoning.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 오늘 그는 높아질 것이며[a], 반드시 찾아지지 않을 것입니다. 그가 자기의 흙으로 돌아갔고, 그의 생각이 사라졌기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘들려 올려질 것입니다.’ 여기서 그리스어는 높임이나 지위의 상승을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘생각’은 ‘계획’ 또는 ‘숙고’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σήμερον
  english_pob_choice: Today
  chosen_korean: 오늘
  alternatives_korean:
  - 이날
  - 지금
  lexicon: LSJ
  rationale: 즉시성과 격언적 단정을 자연스러운 현대 한국어로 살리기 위해 ‘오늘’을 택했습니다.
- source_word: ἐπαρθήσεται
  english_pob_choice: will be lifted up
  chosen_korean: 높아질 것이며
  alternatives_korean:
  - 들려 올려질 것이며
  - 들어올려질 것이며
  - 높임을 받을 것이며
  lexicon: LSJ
  rationale: 직역의 위로-올라감 이미지를 유지하면서도, 이 문맥에서의 상승/고양 뉘앙스를 한국어로 자연스럽게 표현했습니다.
- source_word: οὐ μὴ εὑρεθῇ
  english_pob_choice: he will surely not be found
  chosen_korean: 반드시 찾아지지 않을 것입니다
  alternatives_korean:
  - 결코 찾아지지 않을 것입니다
  - 틀림없이 발견되지 않을 것입니다
  lexicon: BDAG
  rationale: οὐ μή의 강한 부정을 살려, 단순 미래 부정보다 강조된 부정을 담았습니다.
- source_word: διαλογισμὸς
  english_pob_choice: his thought / plans
  chosen_korean: 그의 생각
  alternatives_korean:
  - 그의 계획
  - 그의 궁리
  - 그의 판단
  lexicon: BDAG
  rationale: 단어가 생각, 숙고, 계획을 아울러 가리킬 수 있으므로, 본문의 사멸 진술에 가장 포괄적인 ‘생각’을 택했습니다.
theological_decisions:
- issue: 죽음 이후의 인간 내면 소멸을 어떻게 표현할지
  chosen_reading: ‘그의 생각이 사라졌기 때문입니다’라고 옮겨, 인물 자체나 영혼의 소멸을 단정하지 않고 사유/계획의 종결을 드러냈습니다.
  alternative_readings:
  - 그의 계획이 끝났기 때문입니다
  - 그의 사고가 끊어졌기 때문입니다
  rationale: 본문은 죽음으로 인해 인간의 생각과 계획이 더 이상 작동하지 않음을 말할 뿐, 영혼의 존재론적 소멸을 교리적으로 선언하지 않습니다.
  doctrine_reference: 본문이 말하는 범위를 넘는 신학적 단정을 피하고, 본문의 긴장을 보존합니다.
