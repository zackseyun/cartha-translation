lexical_decisions:
- source_word: ἰδὼν
  english_pob_choice: seeing
  chosen_korean: 보고
  alternatives_korean:
  - 보며
  - 보았고
  lexicon: BDAG
  rationale: 부사적 분사로서 뒤의 행동과 자연스럽게 연결되도록 간결한 ‘보고’를 선택했습니다.
- source_word: βλασφημίας
  english_pob_choice: blasphemies
  chosen_korean: 신성모독들
  alternatives_korean:
  - 모독들
  - 신을 모독하는 행위들
  - 사악한 행위들
  lexicon: BDAG
  rationale: 단순한 일반적 ‘모욕’보다 종교적 성격을 분명히 드러내는 표현이므로, 그리스어의 종교적 위반성을 살려 ‘신성모독들’로 옮겼습니다.
- source_word: τὰς γινομένας
  english_pob_choice: being committed
  chosen_korean: 자행되고 있는
  alternatives_korean:
  - 행해지고 있는
  - 일어나고 있는
  lexicon: BDAG
  rationale: 유다와 예루살렘에서 계속 진행 중인 잘못된 행위를 드러내기 위해, 도덕적 책임감을 띠는 ‘자행되고 있는’을 택했습니다.
- source_word: ἐν Ἰούδᾳ
  english_pob_choice: in Judah
  chosen_korean: 유다에서
  alternatives_korean:
  - 유대에서
  lexicon: BDAG
  rationale: 본문의 Ἰούδα를 행정적 의미의 ‘유대’보다 지명·민족적 울림이 남는 ‘유다’로 옮겼습니다.
theological_decisions:
- issue: βλασφημίας의 종교적 무게 보존
  chosen_reading: ‘신성모독들’로 번역해 단순한 사회적 ‘폭력’이나 일반적 ‘타락’으로 약화시키지 않았습니다.
  alternative_readings:
  - 모독들
  - 사악한 일들
  - 신을 모독하는 행위들
  rationale: 이 절은 하나님과 거룩한 것들에 대한 모독을 전제하므로, 종교적 위반이라는 무게를 직접 드러내는 표현이 필요합니다.
  doctrine_reference: '번역 원칙: 원문이 가진 신학적 긴장을 평탄화하지 않고 보존'
