  source_fidelity: 원문의 ἔγνω는 앞선 사건의 소식을 접했다는 뜻으로 ‘그 소식을 듣고’가 충실합니다. ἐπʼ αὐτούς도 ‘그들을 두고’로 적절히 반영되었습니다. 다만 ἐπένθησαν은 단순한 슬픔보다 죽은 이들을 향한 깊은 애통·애도의 뜻이므로, 이를 더 분명히 하는 편이 좋습니다.
  naturalness: ‘매우 크게 슬퍼했습니다’는 한국어에서 정도 부사와 서술어의 결합이 다소 어색합니다. ‘몹시 애통해했습니다’는 현대 표준어 합쇼체에서 자연스럽고 원문의 강한 애도 표현을 잘 전달합니다.
  terminology: ‘마타티아스’는 현 초안의 음역을 유지해도 무방합니다. 신학적 전문 용어 또는 주석이 필요한 본문은 아닙니다.
