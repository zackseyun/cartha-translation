lexical_decisions:
- source_word: ἔγνω
  english_pob_choice: learned of it
  chosen_korean: 그 소식을 듣고
  alternatives_korean:
  - 그 일을 알게 되고
  - 그 소식을 알아차리고
  - 그것을 알게 되고
  lexicon: BDAG
  rationale: aorist of γινώσκω는 단순한 지식보다 사건에 대한 인지·통보의 수용을 가리키므로, 자연스러운 한국어로는 ‘그 소식을 듣고’가 가장 직접적입니다.
- source_word: οἱ φίλοι αὐτοῦ
  english_pob_choice: his friends
  chosen_korean: 그의 친구들은
  alternatives_korean:
  - 그의 동료들은
  - 그와 함께한 이들은
  - 그의 벗들은
  lexicon: LSJ
  rationale: φίλοι는 문맥상 마타티아스의 가까운 동반자들을 가리키지만, 한국어에서는 관계의 친밀함과 서술의 자연스러움을 함께 살리는 ‘친구들’이 무난합니다.
- source_word: ἐπένθησαν
  english_pob_choice: they mourned
  chosen_korean: 슬퍼했습니다
  alternatives_korean:
  - 애도했습니다
  - 애통해했습니다
  - 곡했습니다
  lexicon: BDAG
  rationale: 직접적인 죽음의 애도 의미가 있으나, 한국어 합쇼체 서술에서는 지나치게 의례적인 ‘애도하다’보다 문맥의 비통함을 드러내는 ‘슬퍼하다’가 자연스럽습니다.
- source_word: ἕως σφόδρα
  english_pob_choice: very greatly
  chosen_korean: 매우 크게
  alternatives_korean:
  - 심히
  - 극도로
  - 대단히
  lexicon: LSJ
  rationale: 강조 부사구를 한국어의 정도 표현으로 옮기되, 옛말투를 피하고 문장 흐름을 유지하기 위해 ‘매우 크게’로 처리했습니다.
