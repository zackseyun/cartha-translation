translation:
  language: ko
  text: 성으로 가서 희생 제물을 바치게 하려는 것이었습니다. 그런데 이스라엘 가운데 많은 이들이 그들에게로 나아갔고, 마타디아와 그의 아들들은 함께 모였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들에게 합류했다’, ‘그들 편으로 넘어갔다’로 옮길 수도 있습니다. 그리스어는 문자 그대로 ‘그들에게로/그들을 향하여 왔다’는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 전해진 그리스어 본문은 여기서 문장 중간부터 시작하므로, ‘성으로’는 앞선 문맥을 이어 받는 표현입니다.
    reason: textual_variant
