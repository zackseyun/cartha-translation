lexical_decisions:
- source_word: Χαλὲβ
  english_pob_choice: Caleb
  chosen_korean: 갈렙
  alternatives_korean:
  - 칼렙
  - 갈레브
  lexicon: 고유명사 표기 관례
  rationale: 히브리 성경과 한국어 성경의 통용 표기를 따라 인명을 음역했습니다.
- source_word: ἐν τῷ ἐπιμαρτυρῆσαι
  english_pob_choice: when he testified
  chosen_korean: 증언할 때
  alternatives_korean:
  - 증언하면서
  - 증언했을 때
  - 증언할 때에
  lexicon: LSJ
  rationale: 부정사구가 시간적 상황을 나타내므로 한국어에서는 자연스럽게 ‘-할 때’로 옮겼고, ἐπιμαρτυρέω의 증언/증거 의미를 살렸습니다.
- source_word: τῇ ἐκκλησίᾳ
  english_pob_choice: the assembly
  chosen_korean: 회중 앞에서
  alternatives_korean:
  - 회중에서
  - 회중에게
  - 모임 앞에서
  lexicon: LSJ
  rationale: 이 용례는 후기 교회 제도가 아니라 이스라엘의 모인 공동체를 가리키므로 ‘교회’ 대신 ‘회중’을 택했고, dative와 함께 증언 장면의 대상을 자연스럽게 드러내기 위해 ‘앞에서’로 처리했습니다.
- source_word: ἔλαβε γῆν κληρονομίαν
  english_pob_choice: received the land as an inheritance
  chosen_korean: 그 땅을 상속으로 받았습니다
  alternatives_korean:
  - 그 땅을 유업으로 받았습니다
  - 그 땅을 기업으로 받았습니다
  - 그 땅을 유산으로 받았습니다
  lexicon: LSJ
  rationale: κληρονομία의 상속/유업 의미를 살리되 현대 한국어에서 이해하기 쉬운 ‘상속으로 받다’로 옮겼습니다.
theological_decisions:
- issue: ἐκκλησία의 번역을 후기 기독교 용례로 오해하지 않도록 하는 문제
  chosen_reading: ‘회중’으로 번역해 역사적 이스라엘 공동체를 가리키게 했습니다.
  alternative_readings:
  - 교회
  - 공동체
  - 집회
  rationale: 문맥은 가나안 분배와 광야 전승에 대한 언급이므로, 한국 교회 용어인 ‘교회’는 시대착오적입니다. ‘회중’이 원문의 역사적 범위를 가장 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: source-text plain sense 우선, 시대착오적 교회 용어 회피'
