translation:
  language: ko
  text: 엘리야는 율법을 위하여 열심을 내다가, 마치 하늘에 이르기라도 하듯 들려 올라갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 직역하면 ‘하늘로처럼/하늘로 가는 듯이’라는 뜻의 ὡς εἰς τὸν οὐρανόν을 사용합니다. ὡς는 하늘이라는 목적지를 단순히 단정하기보다 비교·양태의 뉘앙스를 더할 수 있습니다.
    reason: alternative_reading
