lexical_decisions:
- source_word: Ἠλίας
  english_pob_choice: Elijah
  chosen_korean: 엘리야
  alternatives_korean:
  - 일리아스
  - 엘리야 선지자
  lexicon: 고유명사 표기 관례
  rationale: 히브리어/그리스어 인물명 Ἠλίας는 한국어 성경에서 널리 정착된 ‘엘리야’로 옮기는 것이 가장 자연스럽습니다.
- source_word: ἐν τῷ ζηλῶσαι ζῆλον
  english_pob_choice: in his zeal for the law
  chosen_korean: 율법을 향한 열심 가운데서
  alternatives_korean:
  - 율법에 대한 열심으로
  - 율법을 위하여 열심을 내어
  lexicon: LSJ
  rationale: 전치사구와 부정사 구조가 ‘~하는 가운데/때에’의 상황적 의미를 띠므로, 단순 원인보다 사건의 상황을 드러내는 ‘가운데서’로 옮겼습니다. ‘ζηλῶσαι ζῆλον’의 중첩 강조는 ‘열심’으로 자연스럽게 반영했습니다.
- source_word: νόμου
  english_pob_choice: the law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 율법서
  lexicon: 표준 성경 용례
  rationale: 마카베오 문맥의 νόμος는 유대의 토라를 가리키므로, 일반적 ‘법’보다 ‘율법’이 원문 의미를 더 정확히 전달합니다.
- source_word: ὡς εἰς τὸν οὐρανόν
  english_pob_choice: as into heaven
  chosen_korean: 하늘로 올라간 것같이
  alternatives_korean:
  - 하늘로
  - 하늘에 이르듯
  - 마치 하늘로
  lexicon: LSJ
  rationale: ὡς의 비교·양태 뉘앙스를 살리기 위해 단정적인 목적지 표현을 피하고 ‘-것같이’로 처리했습니다. εἰς τὸν οὐρανόν은 ‘하늘로’로 보존했습니다.
theological_decisions:
- issue: Ἠλίας의 승천을 단정적 사실 진술로 평탄화할지 여부
  chosen_reading: ‘하늘로 올라간 것같이 들려 올려졌습니다’로 옮겨, ὡς가 주는 비교/양태의 여지를 남겼습니다.
  alternative_readings:
  - 하늘로 들려 올려졌습니다
  - 마치 하늘로 올라간 듯 들려 올려졌습니다
  rationale: 원문은 ὡς를 포함해 엘리야의 이동을 ‘~처럼/마치’의 방식으로 표현하므로, 이를 숨기지 않고 번역에 드러내는 것이 본문 투명성에 부합합니다.
  doctrine_reference: source transparency; preserve modal nuance
