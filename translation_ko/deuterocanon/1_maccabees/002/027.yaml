translation:
  language: ko
  text: 그리고 마타티아스는 그 도성 안에서 큰 소리로 외치며 말했습니다. “율법을 열심히 따르고 언약을 지키는 사람은 모두 나를 따라 나오십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέκραξεν
  english_pob_choice: cried out
  chosen_korean: 큰 소리로 외치며
  alternatives_korean:
  - 외쳤습니다
  - 소리쳐 말했습니다
  lexicon: LSJ
  rationale: 공적이고 강한 외침이라는 힘을 살리되, 현대 한국어에서 자연스럽고 격에 맞는 표현으로 옮겼습니다.
- source_word: ἐν τῇ πόλει
  english_pob_choice: in the city
  chosen_korean: 그 도성 안에서
  alternatives_korean:
  - 도성에서
  - 그 성 안에서
  lexicon: LSJ
  rationale: 단순한 위치 표지이지만, 이야기 문맥상 한 도시 내부의 공개적 외침임을 살려 자연스럽게 처리했습니다.
- source_word: Πᾶς ὁ ζηλῶν τῷ νόμῳ
  english_pob_choice: Everyone who is zealous for the law
  chosen_korean: 율법을 열심히 따르고
  alternatives_korean:
  - 율법에 열심인
  - 율법에 열성을 가진
  lexicon: LSJ
  rationale: ζηλῶν의 열성/열심을 한국어 관용에 맞게 풀어, 단순 감정이 아니라 율법에 대한 적극적 충성의 의미를 드러냈습니다.
- source_word: ἱστῶν διαθήκην
  english_pob_choice: upholds the covenant
  chosen_korean: 언약을 지키는
  alternatives_korean:
  - 언약을 붙드는
  - 언약을 굳게 지키는
  lexicon: LSJ
  rationale: ἱστῶν은 언약을 세우는 것이 아니라 유지·견지하는 뜻이므로, 관계적 충실성을 드러내는 ‘지키는’으로 옮겼습니다.
theological_decisions:
- issue: νόμος/διαθήκη의 유대교적·언약적 무게
  chosen_reading: 율법 / 언약
  alternative_readings:
  - 법 / 계약
  - 율법 / 계약
  rationale: 1마카베오스의 문맥에서는 토라와 하나님과의 언약이 중심이므로, 교회 전통어를 넘어서 본래의 유대적 범주를 그대로 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: 핵심 신학 용어의 의미를 보존하고, 문맥상 무게를 약화하지 말 것.'
