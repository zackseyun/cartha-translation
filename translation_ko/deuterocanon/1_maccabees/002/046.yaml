  yaml_path: translation/deuterocanon/1_maccabees/002/046.yaml
  text: And they circumcised the uncircumcised boys[a], as many as they found within the borders of Israel[b], by force.
  footnotes:
  - marker: a
    text: Or 'in the territory/regions of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'with strength'; here the sense is coercive, hence 'by force.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 이스라엘의 경계 안에서 찾아낸, 할례를 받지 않은 소년들을 모두 강제로 할례하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘의 영토/지역 안에서’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘힘으로’이며, 여기서는 강압의 뜻이므로 ‘강제로’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιέτεμον
  english_pob_choice: they circumcised
  chosen_korean: 할례하였습니다
  alternatives_korean:
  - 할례를 행하였습니다
  - 할례를 베풀었습니다
  lexicon: LSJ
  rationale: 표준적인 할례 행위를 직접적으로 옮겼습니다. 현대 한국어에서 가장 자연스럽고 정확합니다.
- source_word: τὰ παιδάρια
  english_pob_choice: the ... boys
  chosen_korean: 소년들을
  alternatives_korean:
  - 아이들을
  - 어린 남자아이들을
  lexicon: LSJ
  rationale: 할례 문맥상 유아 일반보다 남자 아이들을 가리키는 뜻이 분명하므로, 과도하게 넓지 않은 ‘소년들’을 택했습니다.
- source_word: ἐν ὁρίοις Ἰσραήλ
  english_pob_choice: within the borders of Israel
  chosen_korean: 이스라엘의 경계 안에서
  alternatives_korean:
  - 이스라엘의 땅 안에서
  - 이스라엘의 지역들 안에서
  lexicon: LSJ
  rationale: ὅρια의 기본 의미인 경계/영역을 살려 영토적 범위를 드러냈습니다. 영어 주석의 ‘territory/regions’ 가능성도 함께 포괄합니다.
- source_word: ἐν ἰσχύϊ
  english_pob_choice: by force
  chosen_korean: 강제로
  alternatives_korean:
  - 힘으로
  - 권세로
  lexicon: LSJ
  rationale: 문맥상 단순한 힘이 아니라 강압적 수행을 뜻하므로, ‘강제로’가 가장 분명하게 그 뉘앙스를 드러냅니다.
theological_decisions:
- issue: 행위의 도덕적 평가를 본문에 덧씌우지 않는 문제
  chosen_reading: 사건을 서술적으로 옮기고, 강압성을 ‘강제로’로만 드러냈습니다.
  alternative_readings:
  - 열심히
  - 권세 있게
  rationale: 원문 ἐν ἰσχύϊ는 행위의 방식이 강압적이었음을 말할 뿐, 칭찬이나 정죄를 추가로 해설하지 않습니다. 그래서 평가를 보태지 않고 사실성을 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
