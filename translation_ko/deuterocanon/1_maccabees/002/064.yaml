translation:
  language: ko
  text: 그리고 너희도, 자녀들아, 너희 율법 안에서 강해지고 남자답게 행동하십시오[a]. 이는 그 안에서 너희가 영광을 받을 것이기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘용감하십시오.’ 그리스어는 문자적으로 남성적 이미지를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘영광을 얻을 것입니다’ 혹은 ‘존귀를 받을 것입니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: τέκνα
  english_pob_choice: children
  chosen_korean: 자녀들
  alternatives_korean:
  - 아이들
  - 아들들
  lexicon: LSJ
  rationale: τέκνα는 성별을 좁히지 않는 포괄적 호칭이므로, 집합적이고 자연스러운 한국어인 ‘자녀들’로 옮겼습니다.
- source_word: ἰσχύετε
  english_pob_choice: be strong
  chosen_korean: 강해지고
  alternatives_korean:
  - 강하십시오
  - 힘을 내십시오
  lexicon: LSJ
  rationale: 명령형의 지속적 권면을 살리기 위해 ‘강해지고’로 옮겨 앞뒤 병렬 명령과 연결했습니다.
- source_word: ἀνδρίζεσθε
  english_pob_choice: act like men
  chosen_korean: 용감하게 행동하십시오
  alternatives_korean:
  - 남자답게 행동하십시오
  - 사내답게 행동하십시오
  - 용감하십시오
  lexicon: LSJ
  rationale: 그리스어의 남성적 이미지를 한국어에서 직역하면 지나치게 낯설거나 오해를 부를 수 있어, 본문의 핵심 권면인 용기와 결단을 드러내는 표현으로 옮겼습니다.
- source_word: ἐν τῷ νόμῳ ὑμῶν
  english_pob_choice: in your law
  chosen_korean: 너희 율법 안에서
  alternatives_korean:
  - 너희 법 안에서
  - 너희 율법 가운데
  lexicon: LSJ
  rationale: νόμος는 여기서 유대인의 토라를 가리키므로 전통적이면서도 본문 맥락에 맞는 ‘율법’을 사용했고, ἐν의 영역적 의미를 ‘안에서’로 살렸습니다.
- source_word: δοξασθήσεσθε
  english_pob_choice: you will be glorified
  chosen_korean: 영광을 받을 것입니다
  alternatives_korean:
  - 영화될 것입니다
  - 존귀를 받을 것입니다
  - 영광스럽게 될 것입니다
  lexicon: LSJ
  rationale: 수동태의 핵심은 ‘영광이 주어지는 것’이므로, 한국어에서 자연스럽고 의미를 보존하는 ‘영광을 받을 것입니다’를 택했습니다.
theological_decisions:
- issue: ἀνδρίζεσθε의 남성적 이미지 처리
  chosen_reading: ‘용감하게 행동하십시오’로 옮기되, 본문이 요구하는 결단성과 담대함을 살렸습니다.
  alternative_readings:
  - 남자답게 행동하십시오
  - 사내답게 행동하십시오
  - 용감하십시오
  rationale: 직역형 남성 표현은 현대 한국어에서 의미가 좁거나 문화적 뉘앙스가 강하므로, 본문 의도인 용기와 굳셈을 보존하는 방향을 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: δοξασθήσεσθε의 결과 표지
  chosen_reading: ‘영광을 받을 것입니다’
  alternative_readings:
  - 영광스럽게 될 것입니다
  - 존귀를 받을 것입니다
  - 영광을 얻을 것입니다
  rationale: 주체가 누구에게서 어떤 방식으로 영광을 받는지는 본문이 명시하지 않으므로, 의미를 과잉 해석하지 않는 수동적 표현을 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
