review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders τέκνα, νόμος, and the future passive δοξασθήσεσθε. However, it omits the explicit masculine imagery of ἀνδρίζεσθε from the main text, despite that imagery being retained in the source and English audit trail. It also leaves the causal force of ὅτι unexpressed.
  naturalness: ‘강해지고 남자답게 행동하십시오’ is intelligible, formal-polite Korean and appropriately preserves the paired imperatives. Rendering the final clause with ‘이는 … 때문입니다’ makes the causal relationship explicit and natural.
  terminology: ‘자녀들,’ ‘율법,’ and ‘영광을 받을 것입니다’ are suitable. ‘남자답게 행동하십시오’ preserves the source’s marked masculine expression; the footnote supplies the idiomatic alternative ‘용감하십시오.’
  issues:
  - severity: medium
    issue: 본문에서 ἀνδρίζεσθε의 남성적 이미지가 중화되었습니다.
    rationale: ‘용감하게 행동하십시오’는 관용적 의미를 전달하지만, 그리스어의 명시적인 남성적 수사 표현을 본문에서 보존하지 않습니다. 영어 POB의 선택 및 주석 방침과도 맞지 않습니다.
  - severity: low
    issue: ὅτι의 인과 관계가 본문에 드러나지 않습니다.
    rationale: ‘그 안에서 너희가 영광을 받을 것입니다’만으로는 ‘because’의 근거 제시 기능이 약화됩니다.
  revised_text: 그리고 너희도, 자녀들아, 너희 율법 안에서 강해지고 남자답게 행동하십시오[a]. 이는 그 안에서 너희가 영광을 받을 것이기 때문입니다[b].
