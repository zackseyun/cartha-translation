lexical_decisions:
- source_word: διέρρηξεν ... τὰ ἱμάτια
  english_pob_choice: tore their clothes
  chosen_korean: 옷을 찢고
  alternatives_korean:
  - 옷을 찢어
  - 의복을 찢고
  - 겉옷을 찢고
  lexicon: LSJ
  rationale: 그리움과 격분의 표지로 옷을 찢는 장면을 자연스러운 현대 한국어로 옮겼습니다. ἱμάτια는 특정 예복보다 넓게 ‘옷’으로 처리하는 것이 가장 무난합니다.
- source_word: περιεβάλοντο σάκκους
  english_pob_choice: put on sackcloth
  chosen_korean: 삼베옷을 입고
  alternatives_korean:
  - 베옷을 입고
  - 삼베를 두르고
  - 애도의 베옷을 입고
  lexicon: LSJ
  rationale: σάκκους는 애도의 표지인 자루천/베옷을 가리키므로, 한국어에서는 통용되는 ‘삼베옷’으로 옮겨 문맥을 살렸습니다.
- source_word: ἐπένθησαν σφόδρα
  english_pob_choice: mourned greatly
  chosen_korean: 몹시 슬퍼했습니다
  alternatives_korean:
  - 크게 애도했습니다
  - 몹시 애도했습니다
  - 심히 슬퍼했습니다
  lexicon: LSJ
  rationale: ἐπένθησαν은 단순 감정표현보다 애도 행위를 뜻하지만, 한국어에서는 앞의 상징 행동과 함께 읽힐 때 ‘몹시 슬퍼했습니다’가 가장 자연스럽고 과도하게 의례화되지 않습니다.
- source_word: Ματταθίας
  english_pob_choice: Mattathias
  chosen_korean: 마타디아스
  alternatives_korean:
  - 맛다디아스
  - 마타시아스
  lexicon: proper-noun transliteration
  rationale: 현대 외래어 표기 관행에 맞춰 음역했습니다. 본문 내 인명은 독자 친화성을 위해 표준적인 음역을 유지했습니다.
theological_decisions:
- issue: 애도 표현의 강도와 의례성
  chosen_reading: 옷을 찢고 삼베옷을 입는 외적 애도 행동과 ‘몹시 슬퍼했습니다’를 함께 살렸습니다.
  alternative_readings:
  - ‘크게 애도했습니다’로 더 의례적으로 옮김
  - ‘비탄에 잠겼습니다’로 감정 중심으로 옮김
  rationale: 본문은 단순한 감정이 아니라 유대식 애도 관습(옷 찢기, 삼베옷)을 제시하므로, 행동과 감정을 함께 드러내야 합니다. 한국어에서는 이를 너무 종교화하거나 약화시키지 않도록 균형 있게 표현했습니다.
  doctrine_reference: 애도와 회개의 외적 표지에 대한 성경적 서술
