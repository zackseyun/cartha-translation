  text: 그리고 그들은 오만한 자들을 추격했고[a], 그들의 손을 통해 그 일이 성공을 거두었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘오만의 자식들’입니다. 이는 ‘오만한 자들’ 또는 ‘교만의 자식들’을 뜻하는 셈어식 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들의 손 안에서’입니다. 이는 그들이 수행하거나 주도한 일이 성공했다는 관용적 표현입니다.
    reason: lexical_alternative
