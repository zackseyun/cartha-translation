  text: And they pursued the sons of arrogance[b][a], and the work prospered in their hands.
  footnotes:
  - marker: a
    text: Or 'the arrogant' or 'the sons of pride.' The Greek uses a literal expression, 'sons of arrogance.'
    reason: lexical_alternative
  - marker: b
    text: That is, the undertaking succeeded under their direction; literally, 'the work prospered in their hand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 오만의 자식들을 추격하였으며, 그들의 손에서 일이 잘 풀렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘오만의 자식들’입니다. 이는 ‘오만한 자들’ 또는 ‘교만의 자식들’이라는 뜻으로 이해할 수 있는 셈어식 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들의 손에서’입니다. 이는 그들의 주도 아래 일이 성공했다는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίωξαν
  english_pob_choice: pursued
  chosen_korean: 추격하였으며
  alternatives_korean:
  - 쫓았습니다
  - 추적하였습니다
  - 뒤쫓았습니다
  lexicon: BDAG
  rationale: 전투적·적대적 추격의 동사를 살리되, 결과를 과도하게 특정하지 않도록 ‘추격하다’로 옮겼습니다.
- source_word: τοὺς υἱοὺς τῆς ὑπερηφανίας
  english_pob_choice: the sons of arrogance
  chosen_korean: 오만의 자식들
  alternatives_korean:
  - 오만한 자들
  - 교만의 자식들
  - 교만한 자들
  lexicon: LEH
  rationale: 헬라어의 히브리식 직설 표현을 보존하기 위해 ‘자식들’을 살렸고, ὑπερηφανία의 비난적 뉘앙스는 ‘오만’으로 옮겼습니다.
- source_word: κατευωδώθη
  english_pob_choice: prospered
  chosen_korean: 잘 풀렸습니다
  alternatives_korean:
  - 번영했습니다
  - 형통했습니다
  - 성공했습니다
  lexicon: LEH
  rationale: 문맥상 전쟁·사업의 진행이 성공적으로 이루어졌다는 뜻이므로, 현대 한국어에서 자연스럽고 결과를 분명히 하는 표현을 택했습니다.
- source_word: ἐν χειρὶ αὐτῶν
  english_pob_choice: in their hands
  chosen_korean: 그들의 손에서
  alternatives_korean:
  - 그들의 손 안에서
  - 그들의 손으로
  - 그들의 지도 아래
  lexicon: LEH
  rationale: ‘손’의 관용적 주도권/행위 주체성을 살리면서, 한국어에서도 자연스러운 관용으로 옮겼습니다.
theological_decisions:
- issue: 유대 반란 서술에서 성공의 귀속 방식
  chosen_reading: ‘그들의 손에서 일이 잘 풀렸습니다’로 옮겨, 성공이 그들의 행위와 지도 아래 일어났음을 드러냈습니다.
  alternative_readings:
  - ‘그 일이 그들의 손에서 번영했습니다’
  - ‘그들의 손에서 그 일은 형통했습니다’
  rationale: 헬라어의 수동형과 관용구를 그대로 살리되, 현대 독자에게는 ‘일이 잘 풀리다’가 의미를 가장 직접적으로 전달합니다.
  doctrine_reference: 서사 본문 해석 원리
