  text: And Alcimus died at that time after great torment[a].
  footnotes:
  - marker: a
    text: Or 'with great torment.' The Greek phrase μετὰ βασάνου μεγάλης can be taken as describing either the accompanying circumstance of his death or the severe suffering that preceded it.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 알키모스는 그때 큰 고통 가운데 죽었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘큰 고통과 함께’. 헬라어 구문 μετὰ βασάνου μεγάλης는 그의 죽음에 앞선 상태를 나타내는 것으로도, 죽음과 함께한 정황을 나타내는 것으로도 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλκιμος
  english_pob_choice: Alcimus
  chosen_korean: 알키모스
  alternatives_korean:
  - 알킴
  - 알키무스
  lexicon: 고유명사 음역
  rationale: 헬라어 고유명사 Ἄλκιμος를 현대 한국어 음역으로 옮겼습니다. 통용되는 성서 음역과 과도한 변형을 피하는 쪽을 택했습니다.
- source_word: ἀπέθανεν
  english_pob_choice: died
  chosen_korean: 죽었습니다
  alternatives_korean:
  - 사망했습니다
  - 세상을 떠났습니다
  lexicon: BDAG
  rationale: 단순한 사망 사건을 서술하는 부정과거이므로, 가장 직접적이고 서사적인 ‘죽었습니다’가 적절합니다.
- source_word: ἐν τῷ καιρῷ ἐκείνῳ
  english_pob_choice: at that time
  chosen_korean: 그때
  alternatives_korean:
  - 그 시기에
  - 그 무렵
  lexicon: BDAG
  rationale: 특정 시점을 가리키는 시간표현으로, 한국어에서는 간결한 ‘그때’가 자연스럽고 원문의 지시성을 유지합니다.
- source_word: μετὰ βασάνου μεγάλης
  english_pob_choice: after great torment
  chosen_korean: 큰 고통 가운데
  alternatives_korean:
  - 큰 고통 후에
  - 큰 고통과 함께
  - 심한 고통 속에서
  lexicon: BDAG
  rationale: μετά + 속격은 여기서 죽음에 앞선 혹은 동반한 격심한 고통을 나타내므로, 한국어에서는 서술 흐름에 맞게 ‘큰 고통 가운데’로 옮겨 강도를 보존했습니다.
theological_decisions:
- issue: μετὰ βασάνου μεγάλης의 관계가 ‘after’인지 ‘with/in’인지의 여지
  chosen_reading: 본문의 핵심은 알키모스의 죽음이 격심한 고통과 연결되어 있다는 점이므로, 한국어 본문은 사건 서술을 자연스럽게 하면서도 고통의 강도를 드러내는 표현을 택했습니다.
  alternative_readings:
  - 큰 고통 후에
  - 큰 고통과 함께
  rationale: 영어 POB도 이 구절을 해석상 여지가 있는 표현으로 처리하고 있으며, 한국어에서도 단정적으로 원인·순서를 과도하게 못 박지 않으면서 의미 범위를 살리는 것이 적절합니다.
  doctrine_reference: 서술적 역사본문의 의미 범위 보존
