  yaml_path: translation/deuterocanon/1_maccabees/009/036.yaml
  text: And the sons of Jambri came out from Medaba[a], and they seized John and everything he had, and went away with them.
  footnotes:
  - marker: a
    text: Or 'went away taking him and all his possessions.' The Greek literally says 'went away having [them],' referring back to John and everything he had.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 야므브리의 아들들이 메다바에서 나와 요한과 그가 가진 모든 것을 붙잡은 채 떠났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἔχοντες는 직역하면 ‘[그들을] 지닌 채’ 또는 ‘데리고 있는 채’입니다. 문맥상 앞의 ‘요한과 그가 가진 모든 것’을 계속 장악한 채 떠났다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰαμβρεὶ
  english_pob_choice: the sons of Jambri
  chosen_korean: 야므브리의 아들들
  alternatives_korean:
  - 자므브리의 아들들
  - 얌브리의 아들들
  lexicon: LSJ
  rationale: υἱοὶ는 직역해 ‘아들들’로 두고, Ἰαμβρεὶ는 인명으로 음역하되 한국어 음운에 맞게 옮겼습니다. 특정 가문이나 집단을 가리키는 표현이므로 개인 이름보다 집단 명칭의 뉘앙스를 살렸습니다.
- source_word: ἐκ Μηδαβά
  english_pob_choice: from Medaba
  chosen_korean: 메다바에서 나와
  alternatives_korean:
  - 메다바에서
  - 메다바로부터
  lexicon: LSJ
  rationale: ἐκ의 출발점 의미를 살려 ‘에서 나와’로 옮겨, 단순 출신 표시보다 실제 이동 동작을 드러냈습니다. 지명은 음역을 유지했습니다.
- source_word: συνέλαβον
  english_pob_choice: seized
  chosen_korean: 붙잡고
  alternatives_korean:
  - 사로잡고
  - 붙들고
  - 체포하고
  lexicon: BDAG
  rationale: 문맥상 적대적 포획 행위이므로 강한 동작을 살리되, 법적 체포를 뜻하는 ‘체포하고’는 피했습니다. 한국어에서는 연속 동작을 자연스럽게 이어 주는 ‘붙잡고’가 적절합니다.
- source_word: πάντα ὅσα εἶχεν
  english_pob_choice: everything he had
  chosen_korean: 그가 가진 모든 것
  alternatives_korean:
  - 그가 가진 전부
  - 그가 소유한 모든 것
  lexicon: LSJ
  rationale: 총체성을 나타내는 πάντ᾽ ὅσα를 자연스러운 현대 한국어로 풀어, 소유물 전체를 가리키는 의미를 분명히 했습니다.
- source_word: ἀπῆλθον ἔχοντες
  english_pob_choice: went away with them
  chosen_korean: 그것들을 가지고 떠났습니다
  alternatives_korean:
  - 그들을 데리고 떠났습니다
  - 그것을 가지고 떠났습니다
  lexicon: LSJ
  rationale: ἔχοντες는 앞선 목적어를 ‘가지고 있는’ 상태를 뜻하므로, 빼앗은 사람과 재산을 함께 지닌 채 떠났다는 의미를 한국어로 자연스럽게 압축했습니다. 영어 POB의 복수 지시를 따라 ‘그것들’로 처리했습니다.
