  text: And he was dismayed[a], and said to those who were left, “Let us rise and go up against our adversaries, if perhaps we are able to fight them.”
  footnotes:
  - marker: a
    text: Or 'was weakened' or 'lost heart'; the Greek verb can denote being physically or emotionally undone.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 낙심하여, 남아 있는 사람들에게 말했습니다. 「일어나 우리를 대적하는 자들에게로 올라가자. 혹시 우리가 그들과 싸울 수 있을지 모른다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἐξελύθη는 ‘낙심하였다’ 외에도 ‘기력이 풀렸다’, ‘당황하였다’로도 옮길 수 있습니다. 이 동사는 육체적·정서적 무너짐을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελύθη
  english_pob_choice: was dismayed
  chosen_korean: 낙심하여
  alternatives_korean:
  - 기력이 풀려
  - 당황하여
  - 무너져
  lexicon: LSJ
  rationale: ἐκλύω의 수동형은 지치거나 힘이 풀리거나 마음이 꺾이는 뜻을 가질 수 있으므로, 전투 문맥에서 내적 좌절을 드러내는 ‘낙심하여’가 가장 자연스럽습니다.
- source_word: τοῖς καταλειφθεῖσιν
  english_pob_choice: to those who were left
  chosen_korean: 남아 있는 사람들에게
  alternatives_korean:
  - 남겨진 사람들에게
  - 남은 자들에게
  - 뒤에 남은 사람들에게
  lexicon: LSJ
  rationale: καταλείπω의 분사 의미를 살리면서도 한국어에서 군사적 잔여 집단을 자연스럽게 가리키는 표현으로 옮겼습니다.
- source_word: Ἀναστῶμεν καὶ ἀναβῶμεν
  english_pob_choice: Let us rise and go up
  chosen_korean: 일어나 … 올라가자
  alternatives_korean:
  - 일어나 … 가자
  - 일어나 … 진군하자
  - 일어나 … 올라가 보자
  lexicon: LSJ
  rationale: 두 개의 hortatory subjunctive를 한국어 청유형으로 살리되, ἀναβῶμεν의 상향 이동/전진 뉘앙스를 ‘올라가자’로 보존했습니다.
- source_word: τοὺς ὑπεναντίους ἡμῶν
  english_pob_choice: our adversaries
  chosen_korean: 우리를 대적하는 자들
  alternatives_korean:
  - 우리의 적들
  - 우리의 대적들
  - 우리에게 맞서는 자들
  lexicon: LSJ
  rationale: ὑπεναντίος는 단순한 적보다 ‘맞서 반대하는 자’의 성격이 있어, 관계적 대립을 드러내는 표현을 선택했습니다.
- source_word: ἐὰν ἄρα δυνώμεθα πολεμῆσαι αὐτούς
  english_pob_choice: if perhaps we are able to fight them
  chosen_korean: 혹시 우리가 그들과 싸울 수 있을지 모른다
  alternatives_korean:
  - 만일 우리가 그들과 싸울 수 있다면
  - 어쩌면 우리가 그들과 싸울 수 있을지 모른다
  - 우리가 그들과 싸울 수 있을지
  lexicon: LSJ
  rationale: ἐὰν ἄρα가 지닌 불확실성과 시도성을 ‘혹시 … 모른다’로 반영하고, πολεμῆσαι는 전쟁 일반보다 직접적인 ‘싸울 수’로 옮겼습니다.
theological_decisions:
- issue: 장려문 두 동사의 한국어 처리
  chosen_reading: ‘일어나 … 올라가자’로 두 hortatory subjunctive를 청유형으로 보존했습니다.
  alternative_readings:
  - ‘일어나자 그리고 올라가자’
  - ‘일어나서 올라가자’
  rationale: 원문은 단순한 서술이 아니라 집단 행동을 촉구하는 발화이므로, 명령적 긴박감을 해치지 않으면서도 한국어 청유형으로 힘 있게 재현하는 것이 적절합니다.
  doctrine_reference: 서사적 군사 발화의 화행 보존
