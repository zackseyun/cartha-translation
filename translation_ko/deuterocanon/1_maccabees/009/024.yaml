  source_fidelity: ‘그 땅이 그들과 함께 변절하였습니다’는 αὐτομόλησεν의 정치적 이탈 의미를 전달하지만, 한국어에서 ‘변절하다’는 대체로 개인이나 집단 구성원이 신념·노선을 바꾸는 경우에 쓰여 ‘땅/지역’이라는 집합적 주어와의 결합이 부자연스럽습니다. 또한 μετʼ αὐτῶν은 여기서 단순 동반이라기보다 같은 편으로 합류하는 맥락을 나타내므로 ‘그들 편으로’가 더 정확하고 자연스럽습니다.
  naturalness: ‘매우 큰 기근’은 이해되지만 한국어에서는 ‘매우 심한 기근’ 또는 ‘극심한 기근’이 자연스럽습니다. 원문의 μεγάλη σφόδρα의 강한 강조를 ‘매우 심한’으로 무리 없이 보존할 수 있습니다. ‘그 나라가 그들 편으로 넘어갔습니다’는 집합적 χώρα를 자연스럽게 살리며, 현대 격식체에도 맞습니다.
  terminology: χώρα는 현대 국가 개념으로 한정되지 않는 ‘땅/지역/나라’입니다. 본문에서는 그 지역의 주민과 정치적 귀속을 포괄하는 집합 표현이므로 ‘그 나라’가 자연스럽습니다. αὐτομολέω는 ‘다른 편으로 넘어가다/이탈하다’를 뜻하므로 본문은 ‘그들 편으로 넘어갔습니다’로 옮기고, 각주에서 ‘이탈하거나 다른 편으로 넘어가다’라는 어휘 범위를 밝혀 두는 것이 적절합니다.
