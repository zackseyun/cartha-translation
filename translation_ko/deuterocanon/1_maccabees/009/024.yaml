lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  english_pob_choice: In those days
  chosen_korean: 그때에
  alternatives_korean:
  - 그날들에
  - 그 시절에
  lexicon: LSJ
  rationale: 서사 도입의 관용구로, 시간 표지를 자연스럽고 간결하게 살리면서 현대 한국어 흐름에 맞췄습니다.
- source_word: ἐγενήθη
