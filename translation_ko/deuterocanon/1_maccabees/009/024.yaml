  - 되었고
  lexicon: LSJ
  rationale: 사건 발생을 나타내는 동사로, 기근의 사건성을 드러내는 가장 자연스러운 표현을 선택했습니다.
- source_word: λιμὸς μεγάλη σφόδρα
  english_pob_choice: a very great famine
  chosen_korean: 매우 큰 기근
  alternatives_korean:
  - 극심한 기근
  - 대단히 심한 기근
  - 매우 심한 기근
  lexicon: LSJ
  rationale: λιμός는 ‘기근’이고, μεγάλη σφόδρα의 강한 강조를 ‘매우 큰’으로 간결하게 반영했습니다.
- source_word: αὐτομόλησεν ἡ χώρα μετʼ αὐτῶν
  english_pob_choice: the land defected with them
  chosen_korean: 그 땅이 그들과 함께 변절하였습니다
  alternatives_korean:
  - 그 땅이 그들 편으로 넘어갔습니다
  - 그 땅이 그들과 함께 넘어갔습니다
  - 그 땅이 그들 편에 붙었습니다
  lexicon: LSJ
  rationale: αὐτομολέω의 핵심은 정치적·군사적 ‘변절/도주’이므로, 단순한 ‘넘어가다’보다 그 의미를 더 직접적으로 드러냈습니다. μετʼ αὐτῶν은 동반·동조의 관계를 살려 ‘그들과 함께’로 옮겼습니다.
theological_decisions:
- issue: 의인화된 ‘땅’이 변절하는 표현의 보존
  chosen_reading: 원문이 허용하는 과장법과 서사적 의인화를 살려, 주어를 문자 그대로 ‘그 땅’으로 두고 정치적 배반의 동사를 유지했습니다.
  alternative_readings:
  - ‘그 나라가 그들 편으로 넘어갔습니다’처럼 의역하여 의미를 완화하는 읽기
  - ‘지역이 그들에게 붙었습니다’처럼 중립화하는 읽기
  rationale: 본문의 충격 효과는 기근과 더불어 공동체 전체의 배반을 병치하는 데 있으므로, 이를 완화하지 않고 유지하는 편이 원문의 힘을 더 잘 전달합니다.
  doctrine_reference: 문학적 수사와 역사 서술의 보존
- issue: ‘변절하였습니다’의 공적·정치적 뉘앙스
  chosen_reading: 현대 한국어에서 배반/이탈의 공적 의미를 갖는 ‘변절하였습니다’를 사용했습니다.
  alternative_readings:
  - ‘배신하였습니다’
  - ‘넘어갔습니다’
  rationale: 여기서는 개인 감정의 배신보다 집단적 충성 전환이 핵심이므로, 정치적 함의를 지닌 표현이 원문에 더 가깝습니다.
  doctrine_reference: 어휘-수사 일치
