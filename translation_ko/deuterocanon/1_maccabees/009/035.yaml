  text: And he sent his brother as leader of the crowd[a], and he urged his Nabatean friends to take charge of their abundant baggage for them.
  footnotes:
  - marker: a
    text: Or 'receive their large amount of baggage in trust.' The Greek infinitive can carry the sense of receiving and safeguarding property for someone.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 자기 형제를 무리의 지도자로 보냈습니다. 또 그는 자기의 나바테아인 친구들에게 그들의 많은 짐을 대신 맡아 달라고 간청했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들의 많은 짐을 신탁받아 맡아 달라”는 뜻일 수 있습니다. 그리스어 부정법은 물건을 받아 보관하는 의미를 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  english_pob_choice: sent
  chosen_korean: 보냈습니다
  alternatives_korean:
  - 파견했습니다
  - 보냈습니다
  lexicon: LSJ
  rationale: 서술문에서 가장 자연스럽고 직접적인 대응이며, 군사적 뉘앙스를 과도하게 덧붙이지 않습니다.
- source_word: ἡγούμενον τοῦ ὄχλου
  english_pob_choice: as leader of the crowd
  chosen_korean: 무리의 지도자로
  alternatives_korean:
  - 무리를 이끄는 사람으로
  - 무리의 인도로
  lexicon: LSJ
  rationale: ἡγούμενον의 ‘앞장섬/이끎’과 명사적 기능을 살려, 단순 동사보다 ‘지도자’가 문맥상 더 분명합니다.
- source_word: παρεκάλεσεν
  english_pob_choice: urged
  chosen_korean: 간청했습니다
  alternatives_korean:
  - 권했습니다
  - 부탁했습니다
  - 촉구했습니다
  lexicon: LSJ
  rationale: 단순한 요청보다 더 강한 호소의 뉘앙스를 살리되, 한국어로는 격식을 갖춘 ‘간청하다’가 가장 가깝습니다.
- source_word: παραθέσθαι αὐτοῖς τὴν ἀποσκευήν αὐτῶν τὴν πολλήν
  english_pob_choice: to take charge of their abundant baggage for them
  chosen_korean: 그들의 많은 짐을 대신 맡아 달라고
  alternatives_korean:
  - 그들의 많은 짐을 보관해 달라고
  - 그들의 많은 짐을 맡아 지켜 달라고
  lexicon: LSJ
  rationale: παραθέσθαι는 단순 수령이 아니라 맡아 보관하는 의미가 있어 ‘대신 맡아’로 옮겼고, ἀποσκευή는 여행용 짐에 맞게 ‘짐’으로 처리했습니다.
theological_decisions:
- issue: ὄχλος의 공동체/군중 뉘앙스
  chosen_reading: 여기서는 종교적 ‘회중’이 아니라 동행하는 사람들의 무리라는 뜻으로 이해해 ‘무리’로 옮겼습니다.
  alternative_readings:
  - 회중
  - 군중
  - 일행
  rationale: 맥락이 이동 중인 집단이므로 ‘무리’가 가장 중립적이며, 원문의 집단성도 유지합니다.
  doctrine_reference: 문맥 우선 원칙
