  text: And he sent his brother as leader of the crowd[a], and he urged his Nabatean friends to take charge of their abundant baggage for them.
  footnotes:
  - marker: a
    text: Or 'receive their large amount of baggage in trust.' The Greek infinitive can carry the sense of receiving and safeguarding property for someone.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 자기 형제를 그 무리의 지도자로 보냈습니다. 또 그는 자기 나바테아인 친구들에게 그들이 가진 많은 짐을 맡아 보관해 달라고 부탁했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들의 많은 짐을 받아 보관해 달라”라는 뜻일 수 있습니다. 그리스어 부정법은 남의 재산을 받아 맡아 지켜 주는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  english_pob_choice: sent
  chosen_korean: 보냈습니다
  alternatives_korean:
  - 파견했습니다
  - 보냈습니다
  lexicon: LSJ
  rationale: 서술문에서 가장 자연스럽고 직접적인 대응이며, 군사적 뉘앙스를 과도하게 덧붙이지 않습니다.
- source_word: ἡγούμενον τοῦ ὄχλου
  english_pob_choice: as leader of the crowd
  chosen_korean: 무리의 지도자로
  alternatives_korean:
