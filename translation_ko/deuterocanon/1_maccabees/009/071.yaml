  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ἐκζητῆσαι αὐτῷ κακόν은 단순히 해를 실제로 끼치지 않는다는 결과보다 그에게 해를 도모하거나 추구하지 않는다는 뜻을 포함하므로, 이를 더 드러내는 표현이 적절합니다.
  naturalness: 현 번역의 “그에게 평생 그에게”는 동일한 여격 대명사가 연속되어 어색하고, 누가 맹세의 상대이며 누가 해를 입지 않는 대상인지 즉시 파악하기 어렵습니다. 문장을 정리하면 현대 표준 한국어 합쇼체로 자연스럽습니다.
