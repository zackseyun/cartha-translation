  text: 그가 이를 받아들였고, 그의 말대로 행하였으며, 그에게 평생 그에게 해를 끼치지 않겠다고 맹세하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '그에게 악을 찾지 않겠다'라는 뜻일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεδέξατο
  english_pob_choice: accepted
  chosen_korean: 받아들였고
  alternatives_korean:
  - 받아들였고 동의하였고
  - 수락하였고
  lexicon: LSJ
  rationale: 중간태의 뉘앙스를 살려 제안을 수용했다는 뜻으로 옮겼습니다. '받아들이다'가 간결하면서도 단순한 물리적 수령보다 합당한 응답을 드러냅니다.
- source_word: ἐποίησεν κατὰ τοὺς λόγους αὐτοῦ
  english_pob_choice: did according to his words
  chosen_korean: 그의 말대로 행하였으며
  alternatives_korean:
  - 그의 말에 따라 행동하였으며
  - 그가 말한 대로 하였으며
  lexicon: LSJ
  rationale: 직역의 투명성을 유지하면서 한국어로 자연스럽게 옮겼습니다. '행하다'는 단순 실행을 넘어 약속이나 조건에 따른 이행의 뉘앙스를 살립니다.
- source_word: μὴ ἐκζητῆσαι αὐτῷ κακὸν
  english_pob_choice: not to seek harm against him
  chosen_korean: 그에게 해를 끼치지 않겠다고
  alternatives_korean:
  - 그에게 악을 구하지 않겠다고
  - 그를 해치려 하지 않겠다고
  lexicon: LSJ
  rationale: κακόν을 '악'으로 직역할 수 있으나, 이 문맥에서는 상대에게 해를 가하려는 의도를 가리키므로 '해를 끼치다'가 더 분명합니다. 한국어의 맹세문으로도 자연스럽습니다.
- source_word: πάσας τὰς ἡμέρας τῆς ζωῆς αὐτοῦ
  english_pob_choice: all the days of his life
  chosen_korean: 평생
  alternatives_korean:
  - 그의 생애의 모든 날 동안
  - 살아 있는 모든 날 동안
  lexicon: LSJ
  rationale: 관용적 생애 기간 표현을 한국어의 간결한 대응인 '평생'으로 옮겼습니다. 시간 범위를 충분히 보존하면서 문장을 매끄럽게 합니다.
