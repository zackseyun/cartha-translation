  source_fidelity: 그리스어의 열거와 군사적 의미는 대체로 잘 반영되었습니다. 다만 αὐταῖς는 앞서 열거된 복수의 장소를 가리키므로 ‘그 안에’보다 ‘그곳들에’가 더 정확합니다. παραθέσεις βρωμάτων은 각 거점에 둔 식량 비축분을 뜻하므로, 병력의 배치와 식량의 비축을 구분해 표현하는 것이 자연스럽고 분명합니다.
