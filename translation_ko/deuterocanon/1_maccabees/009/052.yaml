  text: And they fortified the city[a], and Beth-zur, and Gazara, and the citadel[b], and they stationed forces in them and supplies of food.
  footnotes:
  - marker: a
    text: Or 'the Acra,' a historical name for the fortified stronghold in Jerusalem.
    reason: lexical_alternative
  - marker: b
    text: Gazara reflects the Greek form; the site is often identified with Gezer.
