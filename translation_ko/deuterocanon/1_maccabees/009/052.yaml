  terminology: ‘성채’는 ἄκρα의 적절한 일반 명사 번역이며, 각주에서 ‘아크라’라는 역사적 명칭을 제시하는 방식도 적절합니다. Γάζαρα를 ‘가자라’로 음역한 것은 그리스어 본문에 충실합니다. 다만 각주 표지는 해당 낱말 바로 뒤에 붙어야 합니다.
