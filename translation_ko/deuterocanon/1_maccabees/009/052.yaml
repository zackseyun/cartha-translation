  text: And they fortified the city[a], and Beth-zur, and Gazara, and the citadel[b], and they stationed forces in them and supplies of food.
  footnotes:
  - marker: a
    text: Or 'the Acra,' a historical name for the fortified stronghold in Jerusalem.
    reason: lexical_alternative
  - marker: b
    text: Gazara reflects the Greek form; the site is often identified with Gezer.
    reason: cross_reference
translation:
  language: ko
  text: 그들은 그 도시와 베스-추르와 가자라와 성채를 견고히 하고, 그 안에 군대와 식량 비축을 두었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아크라’로 번역할 수 있습니다. 이는 예루살렘의 요새화된 거점에 대한 역사적 이름입니다.
    reason: lexical_alternative
  - marker: b
    text: 가자라는 그리스어 형태를 따른 표기입니다. 이곳은 흔히 게셀과 같은 장소로 연결됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: ὠχύρωσαν
  english_pob_choice: fortified
  chosen_korean: 견고히 하고
  alternatives_korean:
  - 요새화하고
  - 성벽을 강화하고
  - 방비를 강화하고
  lexicon: LSJ
  rationale: 성읍과 요새를 대상으로 한 군사적 조처이므로, 단순한 ‘강하다’보다 방어시설을 갖추어 안전하게 만든다는 뜻을 살린 ‘견고히 하다’를 택했습니다.
- source_word: Βεθοσούραν
  english_pob_choice: Beth-zur
  chosen_korean: 베스-추르
  alternatives_korean:
  - 벧-수르
  - 벳-수르
  lexicon: 고유명사 음역
  rationale: 지명은 번역하지 않고 음역하되, 현대 한국어 표기에 맞게 간결하게 적었습니다.
- source_word: Γάζαρα
  english_pob_choice: Gazara
  chosen_korean: 가자라
  alternatives_korean:
  - 게셀
  - 게자라
  lexicon: 고유명사 음역
  rationale: 본문의 그리스어 형태 Γάζαρα를 따라 음역했습니다. 더 익숙한 지명형이 있더라도, 여기서는 그리스어 증거를 직접 반영하는 것이 우선입니다.
- source_word: ἄκραν
  english_pob_choice: the citadel
  chosen_korean: 성채
  alternatives_korean:
  - 아크라
  - 요새
  - 산성
  lexicon: LSJ
  rationale: ἄκρα는 성채 또는 요새를 뜻할 수 있으며, 여기서는 예루살렘의 요새화된 거점을 가리키므로 일반 독자에게 분명한 ‘성채’로 옮겼습니다.
- source_word: παραθέσεις βρωμάτων
  english_pob_choice: supplies of food
  chosen_korean: 식량 비축
  alternatives_korean:
  - 식량 공급
  - 식량 저장
  - 식량 보급품
  lexicon: LSJ
  rationale: παραθέσεις는 ‘쌓아 둠/비축’의 뜻이 강하고 βρώματα는 식량을 가리키므로, 군사 거점에 저장해 둔 식량이라는 의미를 살려 ‘식량 비축’으로 옮겼습니다.
theological_decisions:
- issue: ἄκραν의 역사적 지시 대상
  chosen_reading: 본문의 성채는 예루살렘의 특정한 요새 거점을 가리키는 일반 명사로 번역하되, 고유명사화는 하지 않았습니다.
  alternative_readings:
  - 아크라
  - 시타델/아크라를 특정한 고유명으로 처리
  rationale: 이 절은 도시와 함께 여러 요새를 열거하는 군사적 맥락이므로, 본문 자체의 일반적 표현을 유지하는 편이 더 직접적입니다.
  doctrine_reference: 역사-지리적 본문 이해
