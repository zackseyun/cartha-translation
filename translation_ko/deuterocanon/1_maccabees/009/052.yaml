translation:
  language: ko
  text: 그들은 그 도시와 벳수르와 가자라[b]와 성채[a]를 요새화하고, 그곳들에 병력을 배치하고 식량을 비축해 두었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아크라’로 번역할 수 있습니다. 이는 예루살렘의 요새화된 거점에 대한 역사적 이름입니다.
    reason: lexical_alternative
  - marker: b
    text: 가자라는 그리스어 형태를 따른 표기입니다. 이곳은 흔히 게셀과 같은 장소로 연결됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: ὠχύρωσαν
  english_pob_choice: fortified
  chosen_korean: 견고히 하고
  alternatives_korean:
