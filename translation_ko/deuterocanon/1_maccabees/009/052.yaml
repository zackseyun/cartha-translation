  lexicon: 고유명사 음역
  rationale: 지명은 번역하지 않고 음역하되, 현대 한국어 표기에 맞게 간결하게 적었습니다.
- source_word: Γάζαρα
  english_pob_choice: Gazara
  chosen_korean: 가자라
  alternatives_korean:
