- source_word: ἄκραν
  english_pob_choice: the citadel
  chosen_korean: 성채
  alternatives_korean:
  - 아크라
  - 요새
  - 산성
  lexicon: LSJ
  rationale: ἄκρα는 성채 또는 요새를 뜻할 수 있으며, 여기서는 예루살렘의 요새화된 거점을 가리키므로 일반 독자에게 분명한 ‘성채’로 옮겼습니다.
- source_word: παραθέσεις βρωμάτων
  english_pob_choice: supplies of food
  chosen_korean: 식량 비축
  alternatives_korean:
  - 식량 공급
  - 식량 저장
  - 식량 보급품
  lexicon: LSJ
  rationale: παραθέσεις는 ‘쌓아 둠/비축’의 뜻이 강하고 βρώματα는 식량을 가리키므로, 군사 거점에 저장해 둔 식량이라는 의미를 살려 ‘식량 비축’으로 옮겼습니다.
theological_decisions:
- issue: ἄκραν의 역사적 지시 대상
  chosen_reading: 본문의 성채는 예루살렘의 특정한 요새 거점을 가리키는 일반 명사로 번역하되, 고유명사화는 하지 않았습니다.
  alternative_readings:
