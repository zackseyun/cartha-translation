  - 성벽을 강화하고
  - 방비를 강화하고
  lexicon: LSJ
  rationale: 성읍과 요새를 대상으로 한 군사적 조처이므로, 단순한 ‘강하다’보다 방어시설을 갖추어 안전하게 만든다는 뜻을 살린 ‘견고히 하다’를 택했습니다.
