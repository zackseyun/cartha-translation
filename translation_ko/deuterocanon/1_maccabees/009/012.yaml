  text: But Bacchides was on the right wing[a], and the phalanx came near from both sides, and they were sounding the trumpets[b], and those with Judas also sounded the trumpets, they too.
  footnotes:
  - marker: a
    text: Greek literally, 'in the right horn,' a military expression for the right wing or flank.
    reason: lexical_alternative
  - marker: b
    text: Or 'approached from the two sides.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 바키데스는 오른쪽 날개에 있었고, 팔랑크스는 양쪽에서 가까이 다가왔으며, 그들은 나팔을 불었고, 유다와 함께한 이들도 나팔을 불었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘오른쪽 뿔’이지만, 군사 문맥에서는 오른쪽 날개나 측면을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘두 측면에서 다가왔으며’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Βακχίδης
  english_pob_choice: Bacchides
  chosen_korean: 바키데스
  alternatives_korean:
  - 바크히데스
  - 바키드스
  lexicon: 고유명사 표기
  rationale: 고유명사는 현대 외래어 표기 관행에 따라 음역하고, 본문 인물명을 식별 가능하게 유지합니다.
- source_word: ἐν τῷ δεξιᾷ κέρατι
  english_pob_choice: on the right wing
  chosen_korean: 오른쪽 날개에
  alternatives_korean:
  - 오른쪽 뿔에
  - 오른쪽 측면에
  lexicon: 군사 문맥 용례
  rationale: κέρας의 문자적 의미는 ‘뿔’이지만, 군사 배치에서는 ‘날개’/‘측면’을 뜻하므로 한국어에서도 전투 배열의 관용적 표현인 ‘오른쪽 날개’로 옮깁니다.
- source_word: ἤγγισεν
  english_pob_choice: came near
  chosen_korean: 가까이 다가왔으며
  alternatives_korean:
  - 다가왔으며
  - 가까이 왔으며
  lexicon: ἐγγίζω
  rationale: 접근 동작을 자연스럽게 살리되, 전투 장면의 긴박한 진행을 드러내기 위해 ‘가까이 다가오다’로 번역합니다.
- source_word: ἐφώνουν ταῖς σάλπιγξιν / ἐσάλπισαν
  english_pob_choice: were sounding the trumpets / sounded the trumpets
  chosen_korean: 나팔을 불었고 / 나팔을 불었습니다
  alternatives_korean:
  - 나팔 소리를 냈고 / 나팔을 불었습니다
  - 나팔을 불며 / 나팔을 불었습니다
  lexicon: σάλπιγξ
  rationale: 군사 신호의 반복을 살리기 위해 두 동사를 모두 ‘나팔을 불다’로 대응시켜, 서로 맞부딪치는 전투 경고의 리듬을 유지합니다.
- source_word: οἱ παρὰ Ἰούδαν
  english_pob_choice: those with Judas
  chosen_korean: 유다와 함께한 이들
  alternatives_korean:
  - 유다 편의 사람들
  - 유다 곁에 있던 이들
  lexicon: παρά + 인명
  rationale: 단순한 소속보다 동행·동참의 관계를 드러내는 표현이어서 ‘유다와 함께한 이들’로 옮깁니다.
theological_decisions:
- issue: 전투 서술의 긴장과 반복된 대응
  chosen_reading: 앞의 ‘나팔을 불었고’와 뒤의 ‘나팔을 불었습니다’를 반복해, 양측이 서로 맞응하는 전투 신호의 긴박함을 그대로 드러냈습니다.
  alternative_readings:
  - 앞의 동사를 ‘나팔을 불며’로 완화하기
  - 뒤의 반복을 줄여 문장을 압축하기
  rationale: 본문은 두 진영의 신호가 주고받아지는 장면을 병렬적으로 제시하므로, 반복을 줄이면 원문의 맞대응 효과가 약해집니다.
  doctrine_reference: 본문 서술 보존 원칙
