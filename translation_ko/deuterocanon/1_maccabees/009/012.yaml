  text: But Bacchides was on the right wing[a], and the phalanx came near from both sides, and they were sounding the trumpets[b], and those with Judas also sounded the trumpets, they too.
  footnotes:
  - marker: a
    text: Greek literally, 'in the right horn,' a military expression for the right wing or flank.
    reason: lexical_alternative
  - marker: b
    text: Or 'approached from the two sides.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 바키데스는 오른쪽 날개에 있었습니다.[a] 팔랑크스는 양쪽에서 가까이 다가왔고,[b] 그들은 나팔을 불어 대고 있었습니다. 유다와 함께한 이들도 나팔을 불었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘오른쪽 뿔’이지만, 군사 문맥에서는 오른쪽 날개나 측면을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘두 측면에서 다가왔고’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Βακχίδης
  english_pob_choice: Bacchides
  chosen_korean: 바키데스
  alternatives_korean:
