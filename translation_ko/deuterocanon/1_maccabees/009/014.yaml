  text: And Judas saw that Bacchides and the main strength of the camp were on the right[b][a], and all the men courageous in heart gathered around him.
  footnotes:
  - marker: a
    text: Or 'the main strength of the camp.' The Greek expression refers to the firm or strongest body of Bacchides's forces.
    reason: lexical_alternative
  - marker: b
    text: Literally 'all the courageous in heart.'
    reason: lexical_alternative
translation:
  language: ko
  text: 유다는 바키데스와 진영의 가장 견고한 부대가 오른쪽에 있는 것을 보고, 마음이 담대한 사람들 모두가 그에게 모여들었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘진영의 가장 견고한 부대’는 στερέωμα τῆς παρεμβολῆς의 직역으로, 여기서는 진영의 물리적 요새라기보다 가장 단단하고 강한 병력 집단을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘마음이 담대한 모든 사람들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδεν
