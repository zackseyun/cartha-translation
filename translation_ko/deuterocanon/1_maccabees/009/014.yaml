  chosen_korean: 마음이 담대한 사람들 모두
  alternatives_korean:
  - 마음이 담대한 모든 사람
  - 심지가 담대한 모든 사람들
  - 마음이 용감한 모든 사람들
  lexicon: LSJ
  rationale: εὔψυχοι τῇ καρδίᾳ의 관용적 표현을 ‘마음이 담대하다’로 살리고, 집합적 복수를 자연스럽게 표현했습니다.
- source_word: συνῆλθον αὐτῷ
  english_pob_choice: gathered to him
  chosen_korean: 그에게 모여들었습니다
  alternatives_korean:
  - 그에게 모였습니다
  - 그와 함께 모였습니다
  - 그에게 합류했습니다
  lexicon: LSJ
  rationale: αὐτῷ의 방향성을 살려 ‘그에게’로 옮기고, 집결의 동세를 자연스럽게 나타냈습니다.
