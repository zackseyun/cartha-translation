  lexicon: LSJ
  rationale: 군사적 배열의 위치를 간결하게 전달하되, 문맥상 오른편/우익의 의미가 드러나도록 했습니다.
- source_word: πάντες οἱ εὔψυχοι τῇ καρδίᾳ
