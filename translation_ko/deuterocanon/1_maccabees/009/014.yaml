  text: 유다는 바키데스와 진영의 주력[a]이 오른쪽에 있는 것을 보았고, 마음이 담대한 사람들[b]은 모두 그에게 모여들었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 στερέωμα τῆς παρεμβολῆς는 직역하면 ‘진영의 견고한 부분’입니다. 여기서는 물리적 요새가 아니라 진영의 주력, 곧 가장 강한 병력 집단을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘마음에 담대한 모든 사람들’입니다.
    reason: lexical_alternative
