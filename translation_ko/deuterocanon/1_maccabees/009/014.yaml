  lexicon: LSJ
  rationale: στερέωμα의 ‘견고함/강함’ 의미를 살리되, 전투 문맥에서 물리적 성벽보다 병력의 견실한 주력을 가리키는 뜻으로 옮겼습니다.
- source_word: ἐν τοῖς δεξιοῖς
