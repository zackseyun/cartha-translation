  lexicon: LSJ
  rationale: 그리스어의 문자적 표현을 따라 ‘유다 땅’으로 옮겨, 후대 지명인 ‘유대’로 미리 바꾸지 않았습니다.
- source_word: τὸ δεξιὸν κέρας
  english_pob_choice: the right wing
  chosen_korean: 오른쪽 날개
  alternatives_korean:
  - 오른쪽 뿔
  - 오른쪽 측면
  - 오른쪽 군단
  lexicon: LSJ
  rationale: 군사 용례에서 κέρας가 ‘날개/측면’을 뜻하므로, 본문 의미를 분명히 하면서도 원래 비유적 표현을 살렸습니다.
theological_decisions:
- issue: 군사 용어 κέρας의 직역 여부
  chosen_reading: ‘오른쪽 날개’로 옮겨, 문자적 ‘뿔’을 피하고 군사 배치를 드러냈습니다.
  alternative_readings:
  - ‘오른쪽 뿔’
  - ‘오른쪽 측면’
  rationale: 본문은 동물의 뿔이 아니라 전투 진형을 가리키므로, 오해를 줄이면서도 원문의 은유를 보존하는 번역이 적절합니다.
  doctrine_reference: 문맥 해석과 역사서 번역 원칙
- issue: προσέθετο ... ἀποστεῖλαι의 반복/재파견 뉘앙스
  chosen_reading: ‘두 번째로 보내고’로 옮겨, 재파견의 의미를 분명히 했습니다.
  alternative_readings:
  - ‘다시 보내고’
  - ‘보내기로 하고’
  rationale: ἐκ δευτέρου가 반복을 명시하므로, 단순한 ‘다시’보다 숫자적 반복을 드러내는 표현이 더 정확합니다.
  doctrine_reference: 본문의 서사적 반복 표시
