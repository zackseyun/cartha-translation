  - 전쟁을 수행했다는
  lexicon: LSJ
  rationale: 직역의 힘을 유지하되 한국어에서 자연한 관용으로 풀어, ‘전쟁을 하다’의 적극적 행위를 드러냈습니다.
- source_word: γῆν Ἰούδα
  english_pob_choice: the land of Judah
  chosen_korean: 유다 땅
  alternatives_korean:
