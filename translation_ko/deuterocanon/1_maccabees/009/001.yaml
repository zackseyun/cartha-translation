base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/001.yaml
  text: And Demetrius heard that Nicanor and his forces had made war[a], and he sent Bacchides and Alcimus into the land of Judah a second time, and the right wing with them.
  footnotes:
  - marker: a
    text: Literally, 'the right horn'; in military usage this refers to the right wing or flank of the army.
    reason: lexical_alternative
translation:
  language: ko
  text: 데메트리오스는 니카노르와 그의 군대가 전쟁을 벌였다는 소식을 듣고, 바키데스와 알키모스를 두 번째로 유다 땅에 보냈으며, 그들과 함께 우익 부대도 보냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘오른쪽 뿔’이지만, 군사 용어로는 군대의 오른쪽 날개, 곧 우익을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  english_pob_choice: heard
  chosen_korean: 소식을 듣고
  alternatives_korean:
  - 들었고
  - 알게 되었고
  - 전해 듣고
  lexicon: BDAG
  rationale: 단순한 서술 동사를 과도하게 해석하지 않고, 사건 보고의 성격을 살려 자연스러운 현대 한국어로 옮겼습니다.
- source_word: ἐποίησεν ... πόλεμον
  english_pob_choice: had made war
  chosen_korean: 전쟁을 벌였다는
  alternatives_korean:
  - 전쟁을 했다는
  - 전쟁을 일으켰다는
  - 전쟁을 수행했다는
  lexicon: LSJ
  rationale: 직역의 힘을 유지하되 한국어에서 자연한 관용으로 풀어, ‘전쟁을 하다’의 적극적 행위를 드러냈습니다.
- source_word: γῆν Ἰούδα
  english_pob_choice: the land of Judah
  chosen_korean: 유다 땅
  alternatives_korean:
  - 유대 땅
  - 유다 지역
  - 유다의 땅
  lexicon: LSJ
  rationale: 그리스어의 문자적 표현을 따라 ‘유다 땅’으로 옮겨, 후대 지명인 ‘유대’로 미리 바꾸지 않았습니다.
- source_word: τὸ δεξιὸν κέρας
  english_pob_choice: the right wing
  chosen_korean: 오른쪽 날개
  alternatives_korean:
  - 오른쪽 뿔
  - 오른쪽 측면
  - 오른쪽 군단
  lexicon: LSJ
  rationale: 군사 용례에서 κέρας가 ‘날개/측면’을 뜻하므로, 본문 의미를 분명히 하면서도 원래 비유적 표현을 살렸습니다.
theological_decisions:
- issue: 군사 용어 κέρας의 직역 여부
  chosen_reading: ‘오른쪽 날개’로 옮겨, 문자적 ‘뿔’을 피하고 군사 배치를 드러냈습니다.
  alternative_readings:
  - ‘오른쪽 뿔’
  - ‘오른쪽 측면’
  rationale: 본문은 동물의 뿔이 아니라 전투 진형을 가리키므로, 오해를 줄이면서도 원문의 은유를 보존하는 번역이 적절합니다.
  doctrine_reference: 문맥 해석과 역사서 번역 원칙
- issue: προσέθετο ... ἀποστεῖλαι의 반복/재파견 뉘앙스
  chosen_reading: ‘두 번째로 보내고’로 옮겨, 재파견의 의미를 분명히 했습니다.
  alternative_readings:
  - ‘다시 보내고’
  - ‘보내기로 하고’
  rationale: ἐκ δευτέρου가 반복을 명시하므로, 단순한 ‘다시’보다 숫자적 반복을 드러내는 표현이 더 정확합니다.
  doctrine_reference: 본문의 서사적 반복 표시
