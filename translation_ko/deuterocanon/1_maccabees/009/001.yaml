translation:
  language: ko
  text: 데메트리오스는 니카노르와 그의 군대가 전쟁을 벌였다는 소식을 듣고, 바키데스와 알키모스를 유다 땅으로 두 번째로 보내고, 그들과 함께 오른쪽 날개도 보냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘오른쪽 뿔’이지만, 군사용어로는 군대의 오른쪽 날개나 측면을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  english_pob_choice: heard
  chosen_korean: 소식을 듣고
  alternatives_korean:
