  text: And they kept seeking out and searching for the friends of Judas[a], and they were bringing them to Bacchides[b], and he took vengeance on them and mocked them.
  footnotes:
  - marker: a
    text: Or 'the supporters/allies of Judas.' The Greek literally says 'the friends of Judas,' which can also denote political or military adherents in context.
    reason: lexical_alternative
  - marker: b
    text: The Greek verb can mean 'punished,' 'exacted justice from,' or 'took vengeance on.' The chosen rendering reflects the hostile, retributive sense in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 유다의 친구들을 계속 찾아내고 수색하여 바키데스에게 끌고 갔으며, 그는 그들에게 복수하고 그들을 조롱했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘유다의 친구들’은 문맥상 정치적·군사적 추종자들을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ἐξεδίκα는 여기서 ‘처벌했다’보다 ‘복수했다/응징했다’에 가까운 적대적 의미로 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεζήτουν καὶ ἐξηραύνων
  english_pob_choice: kept seeking out and searching for
  chosen_korean: 계속 찾아내고 수색하여
  alternatives_korean:
  - 계속 찾고 찾으며
  - 계속 뒤지고 수색하며
  lexicon: BDAG/LSJ
  rationale: 두 미완료형의 중첩된 지속·집요성을 한국어에서 가장 자연스럽게 살리기 위해 ‘계속’과 ‘수색하다’를 함께 써서 반복적 추적의 뉘앙스를 반영했습니다.
- source_word: τοὺς φίλους Ἰούδου
  english_pob_choice: the friends of Judas
  chosen_korean: 유다의 친구들
  alternatives_korean:
  - 유다의 지지자들
  - 유다의 동맹자들
  lexicon: LSJ
  rationale: 본문의 문자적 표현을 유지하되, 정치·군사적 연루 가능성은 주석 없이 본문을 지나치게 해석하지 않도록 두었습니다.
- source_word: ἦγον αὐτοὺς πρὸς Βακχίδην
  english_pob_choice: they were bringing them to Bacchides
  chosen_korean: 바키데스에게 끌고 갔으며
  alternatives_korean:
  - 바키데스에게 데려갔으며
  - 바키데스 앞으로 끌고 갔으며
  lexicon: BDAG
  rationale: ἦγον의 반복적 진행과 포로 이송의 강제성을 함께 드러내기 위해 ‘끌고 갔다’를 선택했습니다.
- source_word: ἐξεδίκα αὐτούς
  english_pob_choice: he took vengeance on them
  chosen_korean: 그들에게 복수하고
  alternatives_korean:
  - 그들에게 보복하고
  - 그들에게 앙갚음하고
  lexicon: LSJ
  rationale: 문맥이 hostile/retributive이므로 중립적 ‘처벌하다’보다 응보적 의미를 직접 드러내는 ‘복수하다’를 택했습니다.
- source_word: ἐνέπαιζον αὐτοῖς
  english_pob_choice: mocked them
  chosen_korean: 그들을 조롱했습니다
  alternatives_korean:
  - 그들을 비웃었습니다
  - 그들을 희롱했습니다
  lexicon: BDAG
  rationale: 모욕과 경멸의 의미를 현대 한국어에서 가장 분명하게 전달하는 동사로 ‘조롱하다’를 선택했습니다.
theological_decisions:
- issue: Ἐξεδίκα의 법정적/응보적 뉘앙스
  chosen_reading: ‘복수하다’로 옮겨, 바키데스의 행위가 단순한 행정 처분이 아니라 적대적 보복임을 드러냈습니다.
  alternative_readings:
  - ‘처벌하다’
  - ‘응징하다’
  rationale: 이 절은 피해자에 대한 적대적 행위를 묘사하므로, 본문이 가진 폭력성과 억압성을 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 역사서 본문의 서술적 정확성 및 폭력 묘사 보존
