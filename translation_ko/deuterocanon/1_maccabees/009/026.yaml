  source_fidelity: 수정이 필요합니다. ἐνέπαιζον은 복수형이므로, 바키데스가 복수하고 조롱했다는 현 번역은 그리스어의 주어 전환을 지우고 있습니다. ἐξεδίκα는 단수형으로 바키데스의 행위로 이해되며, ἦγον과 ἐνέπαιζον은 앞선 복수 주어(그들)의 행위입니다. 또한 두 미완료형 ἐξεζήτουν·ἐξηραύνων 및 ἦγον의 반복·지속성을 ‘계속’과 ‘-곤 했다’로 반영했습니다.
  naturalness: ‘찾아내고 수색하여’는 사람을 대상으로 할 때 다소 부자연스럽고 의미가 중복됩니다. ‘계속 찾아다니며 추적하여’가 집요한 수색의 뜻을 자연스럽게 전달합니다. 주어가 달라지는 뒤 절은 ‘그들은’과 ‘그들을’을 명시하여 현대 한국어에서 혼동을 피했습니다.
  terminology: ‘유다의 친구들’은 φίλοι의 문자적 표현을 보존하며, 정치적·군사적 지지자라는 가능한 문맥적 의미는 각주로 제시합니다. Βακχίδης는 통용 표기인 ‘바키데스’로 유지합니다. ἐξεδίκα는 문맥상 적대적 응보를 나타내므로 ‘보복했습니다’로 옮기되, 각주에서 ‘처벌했다/응징했다’라는 가능한 어휘 범위를 밝혔습니다.
