  - severity: medium
    issue: ‘찾아내고 수색하여’가 사람을 대상으로 한 두 동사의 지속적 추적 의미를 부자연스럽게 처리합니다.
    rationale: ἐξεζήτουν과 ἐξηραύνων은 반복적이고 집요한 탐색·추적을 병렬로 표현합니다. ‘계속 찾아다니며 추적하여’가 한국어 용법과 미완료상의 뉘앙스를 더 잘 보존합니다.
