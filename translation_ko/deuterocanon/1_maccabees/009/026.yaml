  text: And they kept seeking out and searching for the friends of Judas[a], and they were bringing them to Bacchides[b], and he took vengeance on them and mocked them.
  footnotes:
  - marker: a
    text: Or 'the supporters/allies of Judas.' The Greek literally says 'the friends of Judas,' which can also denote political or military adherents in context.
    reason: lexical_alternative
  - marker: b
    text: The Greek verb can mean 'punished,' 'exacted justice from,' or 'took vengeance on.' The chosen rendering reflects the hostile, retributive sense in context.
