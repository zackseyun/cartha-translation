translation:
  language: ko
  text: 그들은 유다의 친구들[a]을 계속 찾아다니며 추적하여 바키데스에게 데려가곤 했습니다. 그는 그들에게 보복했으며,[b] 그들은 그들을 조롱했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘유다의 친구들’은 문맥상 유다의 정치적·군사적 지지자들 또는 동맹자들을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 동사는 ‘처벌했다’, ‘정의를 집행했다’, 또는 ‘보복했다’로 옮길 수 있습니다. 여기서는 적대적·응보적 문맥을 따라 ‘보복했다’로 옮겼습니다.
    reason: lexical_alternative
