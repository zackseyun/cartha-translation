  yaml_path: translation/deuterocanon/1_maccabees/009/020.yaml
  text: And they mourned for him there[a], and all Israel mourned for him with great mourning, and they grieved for many days and said,
  footnotes:
  - marker: a
    text: 'The Greek uses repeated mourning language: first a verb for lamenting/mourning, then the noun ''great mourning,'' then a second verb meaning ''they grieved.'' The English preserves this buildup rather than smoothing it away.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그곳에서 그를 애도하였고, 온 이스라엘이 큰 애통으로 그를 애도하였으며, 여러 날 동안 슬퍼하고 말하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어는 애도를 나타내는 표현을 거듭 사용합니다. 먼저 ‘애도하다’에 해당하는 동사를 쓰고, 이어 ‘큰 애통’이라는 명사를 사용한 뒤, 다시 ‘슬퍼하다’라는 동사를 씁니다. 본문은 이 점층적 반복을 한 표현으로 평탄화하지 않았습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκόψαντο
  english_pob_choice: mourned
  chosen_korean: 애도하였고 / 애도하였으며
  alternatives_korean:
  - 슬퍼하였고
  - 통곡하였고
  - 애곡하였고
  lexicon: LSJ
  rationale: μ mourning 문맥의 κόπτω 중간태를 한국어에서 가장 자연스럽게 드러내는 말로 ‘애도하다’를 택하되, 반복을 살려 두 번 옮겼습니다.
- source_word: πᾶς Ἰσραήλ
  english_pob_choice: all Israel
  chosen_korean: 온 이스라엘
  alternatives_korean:
  - 모든 이스라엘
  - 이스라엘 온 백성
  lexicon: LSJ
  rationale: 공동체 전체를 가리키는 집합 표현이므로, 성경적 관용을 살리면서도 현대 한국어에서 자연스러운 ‘온 이스라엘’을 사용했습니다.
- source_word: κοπετὸν μέγαν
  english_pob_choice: with great mourning
  chosen_korean: 큰 애통함으로
  alternatives_korean:
  - 큰 애도와 함께
  - 큰 통곡으로
  - 큰 애곡으로
  lexicon: LSJ
  rationale: 앞선 동사와 같은 어근 계열의 명사를 반영해 ‘애통함’으로 옮기고, 전치적 수식 관계를 ‘-으로’로 자연스럽게 처리했습니다.
- source_word: ἔπενθουν ἡμέρας πολλὰς
  english_pob_choice: they grieved for many days
  chosen_korean: 여러 날 동안 슬퍼하고
  alternatives_korean:
  - 여러 날 동안 애도하고
  - 오랫동안 슬퍼하고
  - 많은 날 동안 애도하였고
  lexicon: LSJ
  rationale: πενθέω는 앞의 애도와 어휘적으로 조금 달라서, 반복을 완전히 지우지 않으면서도 변화가 느껴지도록 ‘슬퍼하다’로 옮겼습니다.
