  text: 그 팔랑크스는, 군대가 무너져 흩어졌기 때문입니다. 그들은 그에게서 짓눌리고 도망쳤습니다. 또 기병은 평원에 흩어졌고, 그들은 …로 도망쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
