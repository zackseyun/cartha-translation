translation:
  language: ko
  text: 팔랑크스를[a], 기병대가 와해되었기 때문입니다. 그들은 그에게 짓눌려 달아났습니다. 또 기병대는 평원에 흩어졌고, 그들은 …로 달아났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 스웨테 판의 현전 그리스어 본문은 이 절의 문장 중간에서 시작하여 대격 ‘팔랑크스를’로 시작하며, 마지막도 ‘그들은 …로 달아났다’에 해당하는 말에서 끝납니다. 따라서 번역도 빠진 내용을 보충하지 않고 시작과 끝의 불완전함을 보존했습니다.
    reason: textual_variant
