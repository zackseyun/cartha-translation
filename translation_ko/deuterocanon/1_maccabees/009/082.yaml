revisions:
- from: 그 팔랑크스는, 군대가 무너져 흩어졌기 때문입니다. 그들은 그에게서 짓눌리고 도망쳤습니다. 또 기병은 평원에 흩어졌고, 그들은 …로 도망쳤습니다.[a]
  to: 팔랑크스를[a], 기병대가 와해되었기 때문입니다. 그들은 그에게 짓눌려 달아났습니다. 또 기병대는 평원에 흩어졌고, 그들은 …로 달아났습니다.
  rationale: 현전 그리스어의 대격으로 시작하는 단편과 εἰς에서 끊기는 결말을 보존했습니다. 두 차례의 ἵππος는 모두 집합적 군사 용어인 ‘기병대’로 일관되게 옮겼고, 전투 문맥의 ἀπʼ αὐτοῦ는 ‘그에게 짓눌려’로 번역했습니다. 원문에 없는 선행 문맥·목적지·행위 주체는 보충하지 않았습니다.
