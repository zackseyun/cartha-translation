  yaml_path: translation/deuterocanon/1_maccabees/009/047.yaml
  text: And the battle grew intense[a], and Jonathan stretched out his hand to strike Bacchides[b], but he turned away from him to the rear.
  footnotes:
  - marker: a
    text: Or 'And the battle closed in' or 'And the fighting tightened.' The Greek verb suggests the conflict drawing together or intensifying.
    reason: lexical_alternative
  - marker: b
    text: Or 'but he swerved away from him backward.' The Greek can be rendered more literally with emphasis on Bacchides' evasive movement.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 전투가 치열해졌고,[a] 요나단은 바키데스를 치려고 손을 뻗었으나, 바키데스는 그에게서 뒤로 물러섰습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “전투가 조여 왔고” 또는 “싸움이 한데 맞물려 격해졌고.” 그리스어 συνῆγεν은 싸움이 서로 몰려들며 긴박해지는 뉘앙스를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그에게서 뒤로 비켰습니다.” 그리스어는 바키데스가 요나단에게서 방향을 돌려 뒤쪽으로 물러난 움직임을 더 문자적으로 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆγεν ὁ πόλεμος
  english_pob_choice: the battle grew intense
  chosen_korean: 전투가 치열해졌으며
  alternatives_korean:
  - 전투가 조여 왔으며
  - 전투가 맞물려 들어왔으며
  - 전투가 격해졌으며
  lexicon: LSJ
  rationale: συνάγω의 전투 맥락은 단순한 ‘모임’이 아니라 싸움이 한데 조여들며 격해지는 움직임이므로, 자연스러운 현대어로 ‘치열해졌으며’가 그 긴장을 잘 살립니다.
- source_word: ἐξέτεινεν ... τὴν χεῖρα αὐτοῦ
  english_pob_choice: stretched out his hand
  chosen_korean: 손을 내밀었지만
  alternatives_korean:
  - 손을 뻗었지만
  - 손을 뻗어
  - 손을 내밀어
  lexicon: LSJ
  rationale: ‘손을 내밀다’는 한국어에서 무기를 들어 치려는 동작을 포함할 수 있는 자연스러운 표현으로, 원문의 관용구와 뒤이은 공격 의도를 함께 드러냅니다.
- source_word: πατάξαι
  english_pob_choice: to strike
  chosen_korean: 치려고
  alternatives_korean:
  - 때리려고
  - 쳐서
  - 공격하려고
  lexicon: LSJ
  rationale: πατάσσω 계열의 핵심은 ‘치다/내리치다’이므로, ‘치려고’가 가장 직설적이면서도 과도한 해석 없이 공격 동작을 전달합니다.
- source_word: ἐξέκλινεν ... εἰς τὰ ὀπίσω
  english_pob_choice: turned away from him to the rear
  chosen_korean: 그에게서 뒤로 물러섰습니다
  alternatives_korean:
  - 그에게서 뒤로 비켰습니다
  - 그에게서 뒤로 돌아섰습니다
  - 뒤로 피했습니다
  lexicon: LSJ
  rationale: 이 구절은 바키데스가 공격을 피하며 뒤쪽으로 방향을 틀었다는 뜻이므로, 군사적 맥락에서 자연한 ‘뒤로 물러섰습니다’가 방향성과 회피를 함께 담습니다.
- source_word: Βακχίδην
  english_pob_choice: Bacchides
  chosen_korean: 바키데스
  alternatives_korean:
  - 바키데스
  - 박키데스
  lexicon: proper noun
  rationale: 고유명사는 현대 외래어 표기 관행에 따라 음역하되, 한국어 독자가 익숙한 형태인 ‘바키데스’를 택했습니다.
