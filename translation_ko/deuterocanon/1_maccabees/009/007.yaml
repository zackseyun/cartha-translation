translation:
  language: ko
  text: 그리고 유다가 자기 진영이 무너지고 있음을 보았습니다. 전투가 그를 세차게 압박하고 있었기 때문입니다. 또한 그는 마음이 짓눌렸습니다. 그들을 모을 시간이 없었기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεμβολὴ αὐτοῦ
  english_pob_choice: his camp
  chosen_korean: 자기 진영
  alternatives_korean:
  - 그의 진영
  - 그의 군대
  - 그의 야영지
  lexicon: LSJ
  rationale: 군사적 문맥에서 παρεμβολή는 진영이나 주둔한 부대를 가리킬 수 있으므로, ‘자기 진영’으로 옮겨 구체성과 집단성을 함께 살렸습니다.
- source_word: ἔθλιβεν αὐτόν
  english_pob_choice: the battle was pressing hard on him
  chosen_korean: 전투가 그를 세차게 압박하고 있었기 때문입니다
  alternatives_korean:
  - 전투가 그를 짓누르고 있었기 때문입니다
  - 전쟁이 그를 압박하고 있었기 때문입니다
  lexicon: LSJ
  rationale: θλίβω의 핵심인 ‘압박하다, 짓누르다’를 살리되, 문맥상 넓은 ‘전쟁’보다 현재 벌어지는 전투를 택했습니다.
- source_word: συνετρίβη τῇ καρδίᾳ
  english_pob_choice: he was crushed in heart
  chosen_korean: 마음이 짓눌렸습니다
  alternatives_korean:
  - 마음이 부서졌습니다
  - 그는 마음이 상했습니다
  lexicon: LSJ
  rationale: 직역의 이미지인 ‘부서짐/짓눌림’을 유지하면서 한국어로 자연스럽고 강한 표현을 택했습니다.
- source_word: καιρὸν συναγαγεῖν αὐτούς
  english_pob_choice: no time to gather them together
  chosen_korean: 그들을 모을 시간이 없었기 때문입니다
  alternatives_korean:
  - 그들을 모을 기회가 없었기 때문입니다
  - 그들을 집결시킬 시간이 없었기 때문입니다
  lexicon: LSJ
  rationale: καιρός의 ‘적절한 시간/기회’ 뉘앙스가 있으나, 긴급한 전투 상황에서는 ‘시간’이 가장 자연스럽고 원문의 급박함을 잘 전달합니다.
