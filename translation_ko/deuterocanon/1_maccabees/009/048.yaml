  yaml_path: translation/deuterocanon/1_maccabees/009/048.yaml
  text: And Jonathan and those with him jumped into the Jordan and swam across to the other side[a], and they did not cross the Jordan after them.
  footnotes:
  - marker: a
    text: Or 'they did not cross the Jordan after them' or 'to attack them.' The Greek phrase is compressed and can indicate hostile movement toward Jonathan's group.
    reason: lexical_alternative
translation:
  language: ko
  text: 요나단과 그와 함께한 이들은 요르단 강으로 뛰어들어 저편으로 헤엄쳐 건넜습니다[a]. 그리고 그들은 그들을 뒤따라 요르단 강을 건너지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 향해 요르단 강을 건너지 않았다’ 또는 ‘그들에게 맞서 요르단 강을 건너지 않았다’. 그리스어 표현은 압축적이며, 문맥상 요나단 일행을 향한 추격 또는 적대적 움직임을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεπήδησεν
  english_pob_choice: jumped into
  chosen_korean: 뛰어들어
  alternatives_korean:
  - 달려 들어
  - 점프하여 들어
  lexicon: LSJ
  rationale: 갑작스럽고 단호한 동작을 나타내므로, 자연스러운 현대 한국어인 ‘뛰어들어’가 원문의 급박함을 잘 살립니다.
- source_word: οἱ μετ᾿ αὐτοῦ
  english_pob_choice: those with him
  chosen_korean: 그와 함께한 이들은
  alternatives_korean:
  - 그의 동료들은
  - 그와 함께 있던 사람들은
  lexicon: LSJ
  rationale: 원문은 성별이나 신분을 특정하지 않으므로, 넓은 의미를 유지하는 ‘그와 함께한 이들’이 가장 가깝습니다.
- source_word: διεκολύμβησαν εἰς τὸ πέραν
  english_pob_choice: swam across to the other side
  chosen_korean: 저편으로 헤엄쳐 건넜습니다
  alternatives_korean:
  - 건너편으로 헤엄쳐 갔습니다
  - 헤엄쳐서 맞은편에 이르렀습니다
  lexicon: LSJ
  rationale: ‘헤엄쳐’는 수영으로 건넜다는 방식을 분명히 하고, ‘저편’은 관용적인 방향 표현을 자연스럽게 옮깁니다.
- source_word: οὐ διέβησαν ἐπ᾿ αὐτοὺς τὸν Ἰορδάνην
  english_pob_choice: they did not cross the Jordan against them
  chosen_korean: 그들은 그들 뒤로 요르단 강을 건너지 않았습니다
  alternatives_korean:
  - 그들을 따라 요르단 강을 건너지 않았습니다
  - 그들에게 맞서 요르단 강을 건너지 않았습니다
  lexicon: LSJ
  rationale: 원문의 ἐπί + 대격은 문맥상 ‘그들을 향해/뒤쫓아’의 뉘앙스를 가질 수 있어, POB의 잠정 해석을 반영하되 한국어에서는 ‘그들 뒤로’로 압축해 애매성을 보존했습니다.
- source_word: Ἰορδάνην
  english_pob_choice: the Jordan
  chosen_korean: 요르단 강
  alternatives_korean:
  - 요르단
  - 요단강
  lexicon: LSJ
  rationale: 한국어에서는 강 이름으로서의 식별성을 높이기 위해 ‘요르단 강’을 택했습니다.
