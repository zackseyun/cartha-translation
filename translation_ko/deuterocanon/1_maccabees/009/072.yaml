  text: And he returned to him the captives whom he had formerly taken captive from the land of Judah[a], and he turned back and went away to his own land[b], and he no longer came again into their borders.
  footnotes:
  - marker: a
    text: Greek literally 'the captivity,' used here for the body of people taken captive; hence 'the captives.'
    reason: lexical_alternative
  - marker: b
    text: The Greek idiom 'did not add still to come' means that he did not come again or no longer kept coming into their territory.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 유다 땅에서 전에 사로잡았던 포로들을 그에게 돌려주었고[a], 돌아서서 자기 땅으로 떠났으며[b], 더 이상 그들의 경계 안으로 들어오지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어의 ‘포로 상태’는 여기서 사로잡혀 간 사람들의 집단을 가리키므로, 한국어에서는 ‘포로들’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 관용구 ‘더 이상 오다를 더하지 않았다’는 그가 다시 오지 않았거나 더 이상 반복해서 들어오지 않았다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν αἰχμαλωσίαν
  english_pob_choice: the captives
  chosen_korean: 포로들
  alternatives_korean:
  - 포로 상태
  - 사로잡힌 무리
  - 사로잡힌 사람들
  lexicon: LSJ
  rationale: 문맥상 ‘포로 상태’라는 추상명사보다 실제로 잡혀 간 사람들을 가리키므로, 한국어에서도 구체적인 사람 표현인 ‘포로들’로 옮겼습니다.
- source_word: ᾐχμαλώτευσεν
  english_pob_choice: had ... taken captive
  chosen_korean: 사로잡았던
  alternatives_korean:
  - 포로로 잡았던
  - 사로잡아 끌고 갔던
  lexicon: LSJ
  rationale: αἰχμαλωσίαν과의 어휘 연결을 살리기 위해 같은 어근의 의미를 반영한 ‘사로잡았던’을 선택했습니다.
- source_word: ἀποστρέψας ἀπῆλθεν εἰς τὴν γῆν αὐτοῦ
  english_pob_choice: he turned back and went away to his own land
  chosen_korean: 돌아서서 자기 땅으로 떠났으며
  alternatives_korean:
  - 되돌아가 자기 땅으로 갔으며
  - 몸을 돌려 자기 땅으로 돌아갔으며
  lexicon: BDAG
  rationale: 분사와 본동사의 연속 동작을 자연스러운 한국어 서술로 살리되, ‘자기 땅’이 지닌 소유격의 뉘앙스를 유지했습니다.
- source_word: οὐ προσέθετο ἔτι ἐλθεῖν εἰς τὰ ὅρια αὐτῶν
  english_pob_choice: he no longer came again into their borders
  chosen_korean: 더 이상 그들의 경계 안으로 들어오지 않았습니다
  alternatives_korean:
  - 더는 그들의 경계 안으로 오지 않았습니다
  - 그들의 지역 안으로 다시 오지 않았습니다
  lexicon: BDAG
  rationale: ‘προστίθημι + 부정사’의 관용적 의미를 한국어에서는 반복적 출입의 중단으로 풀어, 침입이 멈췄다는 군사적 함의를 분명히 했습니다.
theological_decisions:
- issue: 반복 출입을 가리키는 관용구의 해석
  chosen_reading: ‘더 이상 ... 들어오지 않았습니다’로 옮겨, 단순한 위치 이동이 아니라 반복적 군사 침입의 중단을 드러냈습니다.
  alternative_readings:
  - ‘더 이상 오지 않았습니다’
  - ‘다시 들어오지 않았습니다’
  rationale: 문맥상 국경/경계 표현(ὅρια)과 결합해 반복적 침공을 가리키므로, 한국어에서도 그 의미가 드러나도록 했습니다.
  doctrine_reference: 본문 문맥에 따른 역사 서술
