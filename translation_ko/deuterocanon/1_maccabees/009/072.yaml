  text: And he returned to him the captives whom he had formerly taken captive from the land of Judah[a], and he turned back and went away to his own land[b], and he no longer came again into their borders.
  footnotes:
  - marker: a
    text: Greek literally 'the captivity,' used here for the body of people taken captive; hence 'the captives.'
    reason: lexical_alternative
  - marker: b
    text: The Greek idiom 'did not add still to come' means that he did not come again or no longer kept coming into their territory.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 전에 유다 땅에서 사로잡았던 포로들을 그에게 돌려주었고[a], 발길을 돌려 자기 땅으로 떠났으며, 더 이상 그들의 영토로 다시 오지 않았습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 직역하면 ‘포로 상태’이지만, 여기서는 사로잡혀 간 사람들의 집단을 가리킵니다. ამიტომ ‘포로들’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어의 ‘더 이상 오는 일을 계속하지 않았다’라는 관용적 표현은 그가 그들의 영토로 다시 오지 않았다는 뜻입니다.
    reason: lexical_alternative
