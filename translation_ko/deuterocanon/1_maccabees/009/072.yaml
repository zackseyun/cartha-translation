- source_word: οὐ προσέθετο ἔτι ἐλθεῖν εἰς τὰ ὅρια αὐτῶν
  english_pob_choice: he no longer came again into their borders
  chosen_korean: 더 이상 그들의 경계 안으로 들어오지 않았습니다
  alternatives_korean:
