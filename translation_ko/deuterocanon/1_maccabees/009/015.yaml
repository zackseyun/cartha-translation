  verdict: revise
  source_fidelity: κέρα스는 전투 대형의 ‘우익’을 뜻하는 군사 비유이므로, 본문의 ‘오른쪽 뿔’은 한국어 본문에서는 지나치게 문자적이고 의미가 불분명합니다. ‘우익’으로 옮기고 문자적 ‘뿔’은 각주로 보존하는 것이 원문과 전투 문맥을 가장 충실히 반영합니다. συνετρίβη에는 군사적 붕괴를 나타내는 ‘무너졌고’가 적절합니다. ἔδωκεν ὀπίσω αὐτῶν의 단수 주어와 추격 의미도 유지했습니다.
  naturalness: ‘그들의 오른쪽 뿔이 그들 앞에서 부러졌고’는 동일한 대명사의 반복 때문에 지시 관계가 불명확하고, 군대에 ‘뿔이 부러지다’라는 표현도 현대 표준 한국어에서 부자연스럽습니다. ‘그들의 우익이 그들 앞에서 무너졌고’는 원문의 대명사 모호성을 불필요하게 해소하지 않으면서도 자연스럽습니다. 성경 및 역사 지명으로 통용되는 ‘아소도’를 사용했습니다.
  terminology: 군사 용어는 ‘우익’으로 정정합니다. ‘아소도’는 Ἄζωτος의 통용 한국어 성경 지명 표기이며, 속격 관계는 ‘아소도의 산’으로 보존합니다. 각주에서 ‘오른쪽 뿔’과 ‘아소도 산’이라는 가능한 직역을 제시합니다.
  issues:
