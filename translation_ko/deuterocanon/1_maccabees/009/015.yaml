    rationale: κέρας는 문자적으로는 ‘뿔’이지만 이 문맥에서는 군대의 날개 또는 우익입니다. 한국어 본문에는 ‘우익’을 쓰고, 문자적 은유는 각주로 남기는 편이 의미와 문체를 모두 보존합니다.
