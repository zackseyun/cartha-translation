    reason: lexical_alternative
  - marker: b
    text: 또는 ‘아소도 산까지’. 헬라어 표현은 특정한 산을 가리킬 수도 있고, 아소도와 관련된 산지나 구릉지를 가리킬 수도 있습니다.
    reason: alternative_reading
