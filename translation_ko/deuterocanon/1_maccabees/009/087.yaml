    reason: lexical_alternative
lexical_decisions:
- source_word: στρεψεν
  english_pob_choice: returned
  chosen_korean: 돌아와
  alternatives_korean:
  - 되돌아와
  - 돌아갔습니다
  lexicon: LSJ
  rationale: 전투 서술에서 στρέφω의 완료적 이동 의미를 자연스럽게 살려 ‘돌아오다’로 옮겼습니다.
- source_word: σὺν τοῖς παρʼ αὐτοῦ
  english_pob_choice: with those who were with him
  chosen_korean: 자기와 함께 있던 사람들과 함께
  alternatives_korean:
  - 그와 함께 있던 자들과 함께
  - 그의 사람들과 함께
  lexicon: LSJ
  rationale: 직역의 구조를 유지하되, 한국어에서는 반복된 ‘함께’를 통해 동행 관계를 분명히 드러냈습니다.
- source_word: ἔχοντες σκῦλα πολλά
  english_pob_choice: carrying much plunder
  chosen_korean: 많은 전리품을 가지고 있었습니다
  alternatives_korean:
  - 많은 노획물을 가지고 있었습니다
  - 많은 전리품을 지니고 있었습니다
  lexicon: LSJ
  rationale: σκῦλα는 전투에서 얻은 노획물/전리품이므로 ‘전리품’이 가장 자연스럽고, ἔχοντες는 소유 상태를 나타내어 ‘가지고 있었습니다’로 옮겼습니다.
theological_decisions:
- issue: 전리품의 윤리적/신학적 평가를 본문에 덧붙일지 여부
  chosen_reading: 본문은 단순히 귀환과 전리품 소지를 서술하며, 평가적 표현은 넣지 않았습니다.
  alternative_readings:
  - 전승적 뉘앙스를 살려 승리의 약탈로 해석하기
  - 도덕적 평가를 암시하는 표현을 덧붙이기
  rationale: 그리스어는 사실 서술에 머물며, 원문에 없는 판단을 추가하지 않는 것이 적절합니다.
  doctrine_reference: 서술의 중립성 유지
- issue: ‘돌아오다’와 ‘되돌아가다’의 선택
  chosen_reading: 귀환의 방향성을 살려 ‘돌아와’로 처리했습니다.
  alternative_readings:
  - 되돌아가
  - 돌아갔습니다
  rationale: 문맥상 이전 장소로의 복귀를 말하므로 ‘돌아오다’가 가장 간결하고 자연스럽습니다.
  doctrine_reference: 서사 동사 의미 보존
