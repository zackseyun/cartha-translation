  text: And Jonathan took up the leadership at that time, and arose in place of Judas his brother.
translation:
  language: ko
  text: 그때 요나단이 지도권을 맡았고, 형제 유다의 뒤를 이어 일어섰습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπεδέξατο
  english_pob_choice: took up
  chosen_korean: 맡았고
  alternatives_korean:
  - 받아들였고
  - 이어받았고
  lexicon: LSJ
  rationale: 여기서는 직책이나 권한을 수임하는 뜻이므로, 한국어로는 자연스럽고 문맥에 맞는 ‘맡다’를 택해 지도권의 승계를 드러냈습니다.
- source_word: ἡγεσίαν
  english_pob_choice: the leadership
  chosen_korean: 지도권
  alternatives_korean:
  - 지도
  - 지휘권
  - 통솔
  lexicon: LSJ
  rationale: ἡγεσία는 단순한 추상 명사 ‘지도’보다 공동체를 이끄는 권한을 가리키므로, 승계 맥락을 살려 ‘지도권’으로 옮겼습니다.
- source_word: ἀνέστη
  english_pob_choice: arose
  chosen_korean: 일어섰습니다
  alternatives_korean:
  - 일어났습니다
  - 나섰습니다
  - 등장했습니다
  lexicon: LSJ
  rationale: 사역이나 직임의 인수 맥락에서 ἀνέστη는 단순한 물리적 기립보다 ‘일어섰다/나섰다’의 진취성을 지니므로, 격식 있는 서술로 ‘일어섰습니다’를 택했습니다.
- source_word: ἀντί
  english_pob_choice: in place of
  chosen_korean: 뒤를 이어
  alternatives_korean:
  - 대신하여
  - 자리를 대신해
  - 자리에 들어
  lexicon: LSJ
  rationale: ἀντί는 대체·계승을 표시하므로, ‘뒤를 이어’로 자연스럽게 표현해 유다의 직분을 계승했다는 뜻을 분명히 했습니다.
theological_decisions:
- issue: 형제 유다의 죽음 이후 지도권 승계 표현
  chosen_reading: 요나단이 유다의 자리를 이어 공동체의 지도권을 맡은 것으로 번역했습니다.
  alternative_readings:
  - 정치적 지휘권으로만 좁혀 번역할 수 있습니다.
  - ‘왕위’처럼 과도하게 군주제적으로 읽을 수 있습니다.
  rationale: ἡγεσία와 ἀντί의 결합은 특정 왕권보다 지도적 직무의 승계를 가리키므로, 본문의 역사 서술을 훼손하지 않으면서도 과장하지 않는 표현을 택했습니다.
  doctrine_reference: 역사서의 직분 승계 표지
