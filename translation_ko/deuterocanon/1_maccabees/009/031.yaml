    rationale: τοῦ ἀδελφοῦ αὐτοῦ는 ‘그의 형제’를 뜻하고, ἀντί는 ‘대신하여/in place of’를 직접 표시합니다. ‘그의 형제 유다를 대신하여’가 두 요소를 모두 더 정확히 반영합니다.
