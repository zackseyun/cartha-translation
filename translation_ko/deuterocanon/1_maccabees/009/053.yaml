  text: And they took the sons of the leaders of the land as hostages[a], and placed them under guard in the citadel in Jerusalem.
  footnotes:
  - marker: a
    text: Or 'in the Acra,' the fortified citadel in Jerusalem.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 그 땅 지도자들의 아들들을 인질로 잡아, 예루살렘의 성채 안에 감시 아래 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아크라에’. 예루살렘에 있던 요새화된 성채를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς υἱοὺς
  english_pob_choice: the sons
  chosen_korean: 아들들
  alternatives_korean:
  - 자녀들
  lexicon: BDAG
  rationale: 그리스어가 성별이 분명한 복수형 ‘아들들’을 사용하므로, 의미를 희석하는 중성화 대신 이를 그대로 반영했습니다.
- source_word: τῶν ἡγουμένων τῆς χώρας
  english_pob_choice: of the leaders of the land
  chosen_korean: 그 땅의 지도자들의
  alternatives_korean:
  - 그 땅의 통치자들의
  - 그 지역의 지도자들의
  lexicon: BDAG
  rationale: ἡγούμενοι는 공식 직함보다 폭넓게 ‘앞서 이끄는 사람들’의 뜻이어서, 과도하게 정치화하지 않는 ‘지도자들’이 자연스럽습니다.
- source_word: ὁμήρα
  english_pob_choice: as hostages
  chosen_korean: 인질로 잡고
  alternatives_korean:
  - 인질로 삼고
  - 인질로
  lexicon: LSJ
  rationale: ὁμήρα는 단순히 ‘인질’이 아니라 인질 상태로 삼는 행위를 나타내므로, 동사화해 문맥을 분명히 했습니다.
- source_word: ἐν τῇ ἄκρᾳ
  english_pob_choice: in the citadel
  chosen_korean: 시타델 안에
  alternatives_korean:
  - 성채 안에
  - 아크라에
  lexicon: LSJ
  rationale: 1 마카베오기에서 ἄκρα는 예루살렘의 특정 요새인 아크라를 가리킬 수 있으므로, 본문은 읽기 쉬운 ‘시타델’로 두고 기술적 명칭은 각주로 보완했습니다.
- source_word: ἐν φυλακῇ
  english_pob_choice: under guard
  chosen_korean: 감금해 두었습니다
  alternatives_korean:
  - 감시 아래 두었습니다
  - 구금해 두었습니다
  lexicon: BDAG
  rationale: φυλακή는 단순한 ‘감시’보다 구금 상태를 더 강하게 시사하므로, 요새 안에 억류했다는 의미를 살려 ‘감금해 두었습니다’로 옮겼습니다.
