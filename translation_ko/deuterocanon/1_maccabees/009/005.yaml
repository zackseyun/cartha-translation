translation:
  language: ko
  text: 그리고 유다는 알라사에 진을 치고 있었고, 선택된 삼천 명이 그와 함께 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεβεβληκὼς
  english_pob_choice: was encamped
  chosen_korean: 진을 치고 있었고
  alternatives_korean:
  - 진을 친 채 있었고
  - 주둔하고 있었고
  lexicon: LSJ
  rationale: 군사적 문맥에서 ‘진을 치다’가 파생된 주둔 상태를 자연스럽게 드러냅니다. 진행 중 상태를 살리기 위해 ‘있었고’를 붙였습니다.
- source_word: ἐν Ἀλασά
  english_pob_choice: at Alasa
  chosen_korean: 알라사에
  alternatives_korean:
  - 알라사에서
  - 알라사 안에
  lexicon: LSJ
  rationale: 지명 앞의 ἐν은 한국어에서 장소 부사격 ‘-에’로 가장 자연스럽게 옮겼습니다. 지명은 음역을 유지했습니다.
- source_word: τρισχίλιοι ἄνδρες ἐκλεκτοὶ
  english_pob_choice: three thousand chosen men
  chosen_korean: 선택된 삼천 명
  alternatives_korean:
  - 선발된 삼천 명
  - 뽑힌 삼천 명
  lexicon: LSJ
  rationale: ἄνδρες를 한국어에서 성별 표지 없이 수량명사구로 자연스럽게 처리하면서, ἐκλεκτοί의 ‘선별된/선택된’ 의미를 살렸습니다. ‘명’은 인원을 세는 표준 한국어 표현입니다.
- source_word: μετʼ αὐτοῦ
  english_pob_choice: were with him
  chosen_korean: 그와 함께 있었습니다
  alternatives_korean:
  - 그와 함께 있었습니다
  - 그를 따르고 있었습니다
  lexicon: LSJ
  rationale: 단순한 동반 관계를 나타내므로, 해석을 덧붙이지 않는 직설적인 표현을 택했습니다.
