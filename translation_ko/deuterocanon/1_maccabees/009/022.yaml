lexical_decisions:
- source_word: τὰ περισσὰ τῶν λόγων
  english_pob_choice: the rest of the accounts
  chosen_korean: 나머지 기록들
  alternatives_korean:
  - 남은 이야기들
  - 남은 기록들
  - 나머지 사연들
  lexicon: LSJ
  rationale: περισσά는 앞서 언급된 내용에 더해 남은 항목들을 가리키므로, 문맥상 ‘나머지 기록들’이 가장 자연스럽고 공문서적 요약 어조도 살립니다.
- source_word: λόγων
  english_pob_choice: the accounts
  chosen_korean: 기록들
  alternatives_korean:
  - 말들
  - 사실들
  - 사연들
  lexicon: LSJ
  rationale: 이 문맥의 λόγοι는 단순한 ‘말’이 아니라 역사적 서술의 단위를 뜻하므로, 한국어에서는 ‘기록들’이 의미를 가장 잘 반영합니다.
- source_word: ἀνδραγαθιῶν
  english_pob_choice: brave deeds
  chosen_korean: 용맹한 행적들
  alternatives_korean:
  - 용맹한 일들
  - 영웅적 행적들
  - 무용한 행위들
  lexicon: LSJ
  rationale: ἀνδραγαθίαι는 칭찬하는 의미의 용맹·영웅적 행동을 가리키므로, ‘용맹한 행적들’이 현대 한국어에서 품위 있고 정확합니다.
- source_word: κατεγράφη
  english_pob_choice: were not recorded
  chosen_korean: 기록되지 않았습니다
  alternatives_korean:
  - 기록되지 않았습니다
  - 글로 남겨지지 않았습니다
  - 서술되지 않았습니다
  lexicon: LSJ
  rationale: 수동태로 ‘문서에 남겨지지 않았다’는 뜻이므로, 가장 간결하고 직역에 가까운 ‘기록되지 않았습니다’를 택했습니다.
