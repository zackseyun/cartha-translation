  chosen_korean: 우리 앞
  alternatives_korean:
  - 우리 앞쪽
  - 우리 앞에
  lexicon: LSJ
  rationale: 전술적 포위 상황에서의 공간 대조를 살려, 영어 POB의 before us에 해당하는 직접적인 공간 표현으로 옮겼습니다.
- source_word: ἔνθεν καὶ ἔνθεν
  english_pob_choice: on this side and on that
