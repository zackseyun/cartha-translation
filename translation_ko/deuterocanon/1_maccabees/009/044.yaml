  rationale: 문맥상 실제 전투 참여를 뜻하므로 현대 한국어에서 자연한 ‘싸우다’를 사용했고, 앞뒤 문맥을 연결하는 의도로 연결형을 썼습니다.
- source_word: ὑπὲρ τῶν ψυχῶν ἡμῶν
  english_pob_choice: for our lives
  chosen_korean: 우리 생명을 지킵시다
  alternatives_korean:
  - 우리 목숨을 위하여
  - 우리 영혼을 위하여
  lexicon: LSJ
  rationale: ψυχή는 이 전투 문맥에서 ‘영혼’보다 ‘생명/목숨’의 뜻이 분명하므로, 생존을 위해 싸운다는 의미가 드러나도록 옮겼습니다.
- source_word: ὡς ἐχθὲς καὶ τρίτην ἡμέραν
  english_pob_choice: as yesterday and the day before
  chosen_korean: 어제와 그 전날과 같지 않기 때문입니다
  alternatives_korean:
  - 어제와 셋째 날과 같지 않기 때문입니다
  - 어제와 그저께와 같지 않기 때문입니다
  lexicon: LSJ
  rationale: 직역하면 ‘어제와 셋째 날’이지만 한국어에서는 관용적으로 ‘어제와 그 전날/그저께’가 의미를 더 분명하게 전달합니다.
- source_word: ἀδελφοῖς
  english_pob_choice: brothers
  chosen_korean: 자기 형제들
  alternatives_korean:
  - 형제들에게
  - 동료들에게
  - 친족들에게
  lexicon: LSJ
  rationale: 본문의 남성 복수 친족 표현을 그대로 살리되, 요나단의 가까운 동료 전사들을 포함할 수 있어 ‘자기 형제들’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: ψυχή의 의미를 ‘영혼’으로 둘지 ‘생명’으로 둘지
  chosen_reading: 전투 상황의 ψυχή는 생명/목숨을 가리키므로 ‘우리 생명을 지킵시다’로 번역했습니다.
  alternative_readings:
  - 우리 영혼을 위해 싸웁시다
  - 우리 목숨을 위해 싸웁시다
  rationale: 맥락이 영혼의 불멸이나 내면적 실체가 아니라 즉각적인 생존 위협이므로, 독자가 오해하지 않도록 생명 의미를 드러냈습니다.
  doctrine_reference: 사전-문맥 우선의 어휘 결정
