translation:
  language: ko
  text: 요나단이 형제들에게 말했습니다. 「이제 일어나 우리 목숨을 위해 싸웁시다. 오늘은 어제와 그 전날 같지 않습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어를 직역하면 “어제와 셋째 날과 같지 않다”입니다. 여기서는 “어제와 그 전날과 같지 않다”라는 뜻의 시간 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστῶμεν
  english_pob_choice: Let us rise
  chosen_korean: 우리가 일어나
  alternatives_korean:
  - 우리가 일어서
  - 우리가 일어나자
  lexicon: LSJ
  rationale: 호소형 용법의 아오리스트 접속법을 자연스러운 한국어 명령/권유로 옮기되, 군사적 긴박감을 살리기 위해 ‘일어나’를 택했습니다.
- source_word: πολεμήσωμεν
