  - 괄호나 생략표시로 미완성을 강조하는 번역
  rationale: 주어진 본문은 여기서 끊기므로, 해석적 보충을 피하고 본문이 실제로 제시하는 문장 종결을 그대로 드러내는 것이 감사추적에 적합합니다.
  doctrine_reference: 본문비평/번역충실성
