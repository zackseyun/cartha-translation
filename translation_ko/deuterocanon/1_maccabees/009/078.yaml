translation:
  language: ko
  text: 그는 아스돗까지 그를 뒤쫓았습니다. 그리고 진영들이[a] 그의 뒤에서 전투를 벌였습니다. 그리고 아폴로니오스는 천 명의 기병을 남겨 두었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어의 αἱ παρεμβολαὶ는 문자적으로는 ‘진영들’이지만, 문맥상 군사 집단들이 전투에 가담한 것으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 현전 그리스어 본문은 ‘아폴로니오스는 천 명의 기병을 남겨 두었습니다’에서 끝나며, 다음 절로 이어지는 미완성 문장처럼 보입니다.
    reason: textual_variant
lexical_decisions:
- source_word: δίωξεν ὀπίσω αὐτοῦ
  english_pob_choice: He pursued after him
  chosen_korean: 그는 아조트까지 그를 뒤쫓았습니다
  alternatives_korean:
  - 그는 그를 쫓아갔습니다
  - 그는 그 뒤를 추격했습니다
  lexicon: LSJ
  rationale: δίωκω는 군사 서술에서 ‘뒤쫓다/추격하다’가 자연스럽고, ὀπίσω αὐτοῦ는 목적어를 따라붙는 추격 방향을 살려 ‘그를 뒤쫓았습니다’로 옮겼습니다.
- source_word: εἰς Ἄζωτον
  english_pob_choice: as far as Azotus
  chosen_korean: 아조트까지
  alternatives_korean:
  - 아조토스까지
  - 아조트로
  lexicon: LSJ
  rationale: 추격의 도달 범위를 나타내는 εἰς는 여기서 단순한 목적지보다 ‘-까지’가 더 정확하여, 고유명사는 현대 음역형 ‘아조트’를 택했습니다.
- source_word: αἱ παρεμβολαὶ
  english_pob_choice: the camps
  chosen_korean: 진영들은
  alternatives_korean:
  - 캠프들은
  - 군대들은
  - 진지들은
  lexicon: LSJ
  rationale: παρεμβολή는 문자적으로 ‘진영/막사’이므로, 복수형을 살리되 한국어 군사 문맥에서 자연한 ‘진영들’로 옮겼습니다.
- source_word: συνῆψαν ... εἰς πόλεμον
  english_pob_choice: joined battle
  chosen_korean: 전투를 벌였습니다
  alternatives_korean:
  - 전투에 합류했습니다
  - 맞붙었습니다
  - 교전했습니다
  lexicon: LSJ
  rationale: συνάπτω의 군사적 용법은 ‘교전하다/전투를 벌이다’의 뜻이므로, ‘진영들이 … 전투를 벌였습니다’로 전투의 개시를 자연스럽게 표현했습니다.
- source_word: ἀπέλειπεν Ἀπολλώνιος χιλίαν ἵππον
  english_pob_choice: Apollonius left behind a thousand horsemen
  chosen_korean: 아폴로니오스는 천 명의 기병을 남겨 두었습니다
  alternatives_korean:
  - 아폴로니오스는 천 기병을 남겼습니다
  - 아폴로니오스는 천 명의 말을 남겨 두었습니다
  lexicon: LSJ
  rationale: ἵππος는 군사적 계수에서 ‘기병’의 메톤미로 쓰이므로, 한국어 독자가 의미를 즉시 이해하도록 ‘천 명의 기병’을 택했습니다.
theological_decisions:
- issue: 문장 말미가 다음 절로 이어질 듯한 미완 결구로 끝나는지 여부
  chosen_reading: 현전 그리스어 본문이 끝내는 대로 ‘아폴로니오스는 천 명의 기병을 남겨 두었습니다’로 마무리하고, 절 자체의 미완성을 보존했습니다.
  alternative_readings:
