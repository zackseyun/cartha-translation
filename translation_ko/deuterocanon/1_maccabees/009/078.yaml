review_pass:
  verdict: revise
  source_fidelity: 전체 의미는 대체로 충실합니다. 다만 Ἄζωτος는 한국어 성경 지명 관례상 ‘아스돗’으로 옮기는 것이 적절하며, δεύτε 문장의 αἱ παρεμβολαὶ가 실제 전투 주체를 가리키는 문맥적 문제는 각주를 해당 표현에 직접 연결하는 편이 원문 및 영어 감사 기록을 더 정확히 반영합니다. ἀπέλειπεν의 미완료상은 문맥상 ‘남겨 두었습니다’로 무리 없이 번역될 수 있고, 본문이 이 절에서 끝나는 상태도 보존되었습니다.
  naturalness: ‘진영들은’은 문자적으로 가능하지만 전투의 주체로서는 다소 부자연스러울 수 있습니다. 그러나 ‘진영들’이라는 가까운 번역을 유지하고 각주에서 군사 집단이라는 문맥적 이해를 밝히면, 과도한 의역 없이 자연성을 확보할 수 있습니다. 각주 표지는 관련 어구와 문장 끝에 각각 두는 것이 읽기에 자연스럽습니다.
  terminology: ‘아스돗’은 Ἄζωτος에 대응하는 통용 한국어 성경 지명입니다. ‘아폴로니오스’, ‘기병’, ‘전투를 벌였습니다’는 적절합니다. 본문이 다음 절로 이어지는 듯한 현전 그리스어의 종결 문제는 교리적 해석 없이 본문비평적 각주로 처리해야 합니다.
  issues:
  - severity: medium
    issue: 지명 ‘아조트’
    rationale: Ἄζωτος는 히브리어 아스돗(Ashdod)에 해당하며, 표준 한국어 성경 지명 관례에서는 ‘아스돗’이 자연스럽고 식별 가능성이 높습니다.
  - severity: low
    issue: 각주 a의 표지 위치
    rationale: 각주 a는 αἱ παρεμβολαὶ/‘진영들’의 어휘·문맥 문제를 설명하므로, 절 끝이 아니라 ‘진영들이’ 뒤에 붙여야 앵커와 설명 대상이 일치합니다.
  - severity: low
    issue: 각주 b의 ‘미완의 절구’ 표현
    rationale: ‘절구’는 문법적 절(clause)을 가리키는 자연한 한국어 용어가 아닙니다. ‘미완성 문장처럼 보입니다’로 고치면 의미가 명료합니다.
  revised_text: 그는 아스돗까지 그를 뒤쫓았습니다. 그리고 진영들이[a] 그의 뒤에서 전투를 벌였습니다. 그리고 아폴로니오스는 천 명의 기병을 남겨 두었습니다.[b]
