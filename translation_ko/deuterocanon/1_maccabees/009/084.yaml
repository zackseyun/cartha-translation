  lexicon: LSJ
  rationale: σκῦλα는 전쟁에서 얻은 전리품이므로 ‘전리품’이 가장 자연스럽고, ‘약탈품’보다 중립적입니다.
- source_word: τὸ ἱερὸν Δαγὼν
  english_pob_choice: the temple of Dagon
  chosen_korean: 다곤의 신전
  alternatives_korean:
