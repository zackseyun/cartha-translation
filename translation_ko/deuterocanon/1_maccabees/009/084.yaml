translation:
  language: ko
  text: 그리고 그는 그들의 전리품을 빼앗았으며, 다곤의 신전과 그 신전도 불로 태웠습니다. 그리고 칼에 쓰러진 자들은[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존하는 그리스어 발췌는 이 절의 시작과 끝에서 모두 불완전합니다. 따라서 번역도 제공된 현행 구절에만 근거하며, 마지막 절은 여기서 끊어집니다.
    reason: textual_variant
  - marker: b
    text: 그리스어의 여성형 대명사 αὐτῆς는 직전의 여성형 선행사(아마도 도시)를 가리킬 수 있습니다. 그래서 ‘그 신전’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβεν
  english_pob_choice: he took
  chosen_korean: 빼앗았으며
  alternatives_korean:
