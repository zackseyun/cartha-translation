  - 다곤의 성소
  lexicon: LSJ
  rationale: ἱερόν은 여기서 이방 신의 신전/신전 구역을 가리키므로, 한국어로는 ‘신전’이 가장 직접적입니다.
- source_word: τὸ ἱερὸν αὐτῆς
  english_pob_choice: her temple
  chosen_korean: 그 신전도
  alternatives_korean:
  - 그 여신전도
  - 그것의 신전도
  lexicon: LSJ
  rationale: 남은 그리스어는 여성형 대명사 αὐτῆς를 보존하지만, 한국어에서는 문맥상 앞의 ‘다곤의 신전’과 병렬되는 두 번째 신전을 가리키는 것으로만 확정할 수 있어 성별을 단정하지 않고 ‘그 신전도’로 처리했습니다.
