  - severity: medium
    issue: 각주 b가 ‘직전의 여성형 선행사’를 언급함
    rationale: 현존 발췌문에서 τὸ ἱερὸν αὐτῆς 앞의 직접적인 명사는 중성 ἱερόν과 Δαγών이며, 확정 가능한 여성형 선행사는 보이지 않습니다. 여성형 대명사가 결손된 앞 문맥의 여성 명사(가령 도시)를 가리킬 가능성으로 제한해야 합니다.
  - severity: low
    issue: ‘빼앗았으며’가 ἔλαβεν보다 강함
    rationale: λαμβάνω는 ‘취하다/거두다’이며, 전리품 문맥상 약탈을 함의할 수는 있어도 동사 자체가 반드시 강탈을 명시하지는 않습니다.
