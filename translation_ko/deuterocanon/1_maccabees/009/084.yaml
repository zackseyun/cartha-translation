  - 취했으며
  lexicon: LSJ
  rationale: 전리품을 대상으로 한 전쟁 서술이므로 단순한 ‘받다’보다 약탈적 뉘앙스를 살린 ‘빼앗다’가 source의 군사적 의미를 더 분명히 드러냅니다.
- source_word: τὰ σκῦλα
