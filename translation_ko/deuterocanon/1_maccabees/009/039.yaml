  text: And they lifted up their eyes and looked, and behold, a noisy procession and much baggage; and the bridegroom came out to meet them, with his friends and his brothers, with tambourines and musicians and many weapons.
translation:
  language: ko
  text: 그들이 눈을 들어 바라보니, 보라, 시끄러운 행렬과 많은 짐이 있었고, 신랑이 그의 친구들과 그의 형제들과 함께 북과 음악과 많은 무기를 거느리고 그들을 맞으러 나왔습니다.
  philosophy: formal
lexical_decisions:
- source_word: ἦραν τοὺς ὀφθαλμοὺς αὐτῶν καὶ εἶδαν
  english_pob_choice: they lifted up their eyes and looked
  chosen_korean: 눈을 들어 바라보니
  alternatives_korean:
  - 눈을 들어 보니
  - 눈을 들어 보았습니다
  lexicon: ὀφθαλμός / ἴδον
  rationale: 영어 POB의 revised reading인 'looked'를 따라, 단순히 '보았다'보다 장면 전환의 동작성을 살리는 표현으로 옮겼습니다.
- source_word: θροῦς καὶ ἀποσκευή πολλή
  english_pob_choice: a noisy procession and much baggage
  chosen_korean: 시끄러운 행렬과 많은 짐
  alternatives_korean:
  - 소란스러운 행렬과 많은 짐보따리
  - 떠들썩한 행렬과 많은 짐
  lexicon: θροῦς / ἀποσκευή
  rationale: θροῦς의 소란스러움과 ἀποσκευή의 짐·휴대품 의미를 반영해, 과장 없이도 행렬의 소음과 이동성을 함께 드러내는 말로 옮겼습니다.
- source_word: ὁ νυμφίος ἐξῆλθεν ... εἰς συνάντησιν αὐτῶν
  english_pob_choice: the bridegroom came out to meet them
  chosen_korean: 신랑이 ... 그들을 맞으러 나왔습니다
  alternatives_korean:
  - 신랑이 ... 마중 나왔습니다
  - 신랑이 ... 만나러 나왔습니다
  lexicon: νυμφίος / συνάντησις
  rationale: νυμφίος는 혼인 맥락의 '신랑'이 가장 직접적이며, εἰς συνάντησιν αὐτῶν은 '맞으러'로 자연스럽게 살렸습니다.
- source_word: μετὰ τυμπάνων καὶ μουσικῶν καὶ ὅπλων πολλῶν
  english_pob_choice: with tambourines and musicians and many weapons
  chosen_korean: 북과 음악과 많은 무기를 거느리고
  alternatives_korean:
  - 북과 악사들과 많은 무기와 함께
  - 북과 음악과 많은 무기와 함께
  lexicon: τύμπανον / μουσικός / ὅπλον
  rationale: μουσικῶν을 '음악'으로 유지하되, 동반된 흥겨운 연주를 포괄하는 방식으로 처리했고, ὅπλα는 '무기'로 직역해 장면의 대비를 살렸습니다.
theological_decisions:
- issue: 행렬의 성격을 '혼례' 분위기로 드러낼지 여부
  chosen_reading: '''신랑''과 ''북과 음악''을 그대로 살려 혼례 행렬로 읽히는 장면을 암시하되, 본문에 없는 ''결혼식'' 같은 해설어는 넣지 않았습니다.'
  alternative_readings:
  - 혼례 행렬로 의역
  - 웨딩 퍼레이드로 해설
  rationale: 그리스어 본문은 장면을 묘사할 뿐이므로, 독자가 혼례 맥락을 유추할 수 있게 하면서도 서술의 직접성을 유지하는 편이 원문에 충실합니다.
  doctrine_reference: 원문 서사 존중 및 과잉해석 자제
