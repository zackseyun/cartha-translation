translation:
  language: ko
  text: 요나단과 시몬이 자기 형제 유다를 들어 메워딤에 있는 그의 조상들의 무덤에 장사하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 직역하면 ‘그의 형제’이지만, 공동 주어가 있으므로 뜻은 ‘그들의 형제’입니다.
    reason: lexical_alternative
  - marker: b
    text: 지명은 ‘메워딤에’로 음역할 수도 있고, ‘메워딤에서’처럼 위치를 풀어 옮길 수도 있습니다.
    reason: lexical_alternative
