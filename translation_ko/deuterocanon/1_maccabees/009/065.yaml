  text: And Jonathan left Simon his brother in the city[a], and went out into the country, and came with a number of men.
  footnotes:
  - marker: a
    text: Greek literally, 'came with a number.' The expression is elliptical and likely means he came with a numbered group or company of men.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 요나단은 자기 형제 시몬을 성 안에 남겨 두고, 밖으로 나가 들판으로 갔으며, 일정한 수의 사람들과 함께 왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘수효로 왔다’에 가깝습니다. 이 표현은 생략적이어서, 아마도 수를 이룬 부대나 무리를 거느리고 왔다는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέλιπεν
  english_pob_choice: left
  chosen_korean: 남겨 두고
  alternatives_korean:
  - 두고 떠나
  - 남기고 떠나
  lexicon: LSJ
  rationale: 여기서는 요나단이 시몬을 그곳에 두고 자신은 떠나는 동작이므로, 단순히 ‘떠났습니다’보다 관계와 상황을 드러내는 ‘남겨 두고’가 원문의 행동을 더 잘 살립니다.
- source_word: ἐν τῇ πόλει
  english_pob_choice: in the city
  chosen_korean: 성 안에
  alternatives_korean:
  - 도시에
  - 읍내에
  lexicon: LSJ
  rationale: πόλις를 일반적인 ‘도시’로 옮길 수도 있지만, 문맥상 특정 성읍 안에 남겨 두었다는 대비가 자연스러워 한국어에서는 ‘성 안에’가 더 간결하고 현장감을 줍니다.
- source_word: ἐξῆλθεν εἰς τὴν χώραν
  english_pob_choice: went out into the country
  chosen_korean: 밖으로 나가 들판으로 갔으며
  alternatives_korean:
  - 나라로 나갔으며
  - 시골로 나갔으며
  lexicon: LSJ
  rationale: χώρα는 도시 바깥의 열린 지역을 가리킬 수 있으므로, ‘들판’은 ‘성 안’과의 대비를 살리면서도 과도하게 현대적 정치단위인 ‘나라’로 오해되지 않게 합니다.
- source_word: ἦλθεν ἀρίθμῳ
  english_pob_choice: came with a number of men
  chosen_korean: 일정한 수의 사람들과 함께 왔습니다
  alternatives_korean:
  - 수효를 이루어 왔습니다
  - 여럿과 함께 왔습니다
  - 많은 사람과 함께 왔습니다
  lexicon: LSJ
  rationale: ἀρίθμῳ는 문자적으로는 ‘수효로, 수를 이루어’의 뜻이라서, POB가 지적한 대로 동반 집단을 드러내되 추정이 과하지 않도록 ‘일정한 수의 사람들과 함께’로 풀었습니다.
