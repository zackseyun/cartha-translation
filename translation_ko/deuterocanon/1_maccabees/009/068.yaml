base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/068.yaml
  text: And they fought against Bacchides[a], and he was crushed by them, and they pressed him hard, because his plan and his attack were in vain.
  footnotes:
  - marker: a
    text: Or 'because his plan and his assault were futile.' The Greek literally says 'empty.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 바키데스와 싸웠고, 그는 그들에게 짓눌렸으며, 그들은 그를 몹시 압박했습니다. 그의 계획과 공격이 헛되었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 계획과 공격은 무익했다’로 옮길 수 있습니다. 그리스어는 문자적으로 ‘비어 있었다’라고 표현합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπολέμησαν πρὸς
  english_pob_choice: fought against
  chosen_korean: 향해 싸웠고
  alternatives_korean:
  - 맞서 싸웠고
  - 대항하여 싸웠고
  lexicon: LSJ
  rationale: πρός + 대격이 적대적 방향을 나타내므로, 현대 한국어에서는 ‘향해 싸우다’보다 더 자연스러운 ‘맞서 싸우다’도 가능하지만, 문맥의 적대성을 살리면서 군사적 충돌을 간결하게 드러내는 표현으로 정리했습니다.
- source_word: συνετρίβη
  english_pob_choice: was crushed
  chosen_korean: 짓눌렸으며
  alternatives_korean:
  - 부서졌으며
  - 산산이 부서졌으며
  - 패배했으며
  lexicon: LSJ
  rationale: 직역의 ‘부서지다’보다 전투 맥락에서 상대에게 눌려 꺾이는 이미지를 살리는 ‘짓눌리다’를 택해, POB의 강한 물리적 비유를 보존했습니다.
- source_word: ἔθλιβον αὐτὸν σφόδρα
  english_pob_choice: they pressed him hard
  chosen_korean: 매우 거세게 그를 압박했습니다
  alternatives_korean:
  - 몹시 그를 눌렀습니다
  - 심하게 그를 몰아붙였습니다
  - 가혹하게 그를 압박했습니다
  lexicon: LSJ
  rationale: θλίβω의 ‘누르다/압박하다’ 의미를 살리되, σφόδρα의 강도를 반영해 전투 상황에 자연스러운 ‘압박했습니다’로 옮겼습니다.
- source_word: βουλή … κενή
  english_pob_choice: his plan and his attack were in vain
  chosen_korean: 그의 계획과 그의 공격은 헛되었기 때문입니다
  alternatives_korean:
  - 그의 계획과 그의 공격은 공허했기 때문입니다
  - 그의 계획과 그의 공격은 무효였기 때문입니다
  - 그의 계획과 그의 공격은 소용없었기 때문입니다
  lexicon: LSJ
  rationale: κενή의 기본 뜻은 ‘비어 있는’이지만, 여기서는 계획과 공격이 실패로 돌아갔다는 결말을 드러내는 한국어 관용으로 ‘헛되다’를 사용했습니다.
- source_word: Βακχίδην
  english_pob_choice: Bacchides
  chosen_korean: 바키데스
  alternatives_korean:
  - 바키스
  - 바키디스
  lexicon: 고유명사 표기
  rationale: 고유명사는 현행 외래어 표기 관행에 따라 음역했습니다.
theological_decisions:
- issue: 전투 서술의 강도 표현
  chosen_reading: ‘짓눌렸으며’, ‘매우 거세게’로 원문의 압박과 패배의 강한 이미지를 살렸습니다.
  alternative_readings:
  - ‘패배했으며’로 평준화할 수 있음
  - ‘심하게 고통받았다’로 완화할 수 있음
  rationale: 본문은 단순한 결과 보고가 아니라 전투의 압도감을 드러내므로, 물리적 비유를 약화시키지 않는 쪽이 원문 효과에 더 가깝습니다.
  doctrine_reference: 서술 본문 해석 원칙
- issue: κενή의 의미 처리
  chosen_reading: ‘헛되다’로 옮겨 계획과 공격의 실패·무효를 함께 드러냈습니다.
  alternative_readings:
  - ‘비어 있다’
  - ‘공허하다’
  - ‘무익하다’
  rationale: 문맥상 형용사 κενή는 문자적 ‘비어 있음’보다 성과 없음, 좌절, 무효를 뜻하므로 한국어에서도 결과적 의미를 드러내는 것이 적절합니다.
  doctrine_reference: 문맥 우선 번역 원칙
