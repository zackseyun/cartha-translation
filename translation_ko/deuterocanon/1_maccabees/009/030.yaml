  to: 그러므로 이제 우리는 오늘 너를 그를 대신하여 우리의 통치자와 지도자로 뽑았습니다. 이는 네가 우리의 전쟁을 치르게 하려는 것입니다.
  rationale: 원문의 선택 행위와 그 목적을 두 문장으로 명확히 연결했습니다. ‘그를 대신하여’는 ἀντʼ αὐτοῦ의 대체·계승 관계를 유지하며, ‘통치자와 지도자’는 두 직함을 합치지 않고 보존합니다. ‘우리의 전쟁을 치르게 하려는 것’은 전쟁 수행을 위한 선임이라는 목적을 자연스러운 합쇼체로 드러냅니다.
