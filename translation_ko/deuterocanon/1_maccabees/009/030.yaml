  text: Now therefore we have chosen you today to be for us, in his place, a ruler and leader, to fight our war.
translation:
  language: ko
  text: 그러므로 이제 우리는 오늘 너를 그를 대신하여 우리의 통치자와 지도자로 뽑았습니다. 이는 네가 우리의 전쟁을 치르게 하려는 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡρετισάμεθα
  english_pob_choice: we have chosen
  chosen_korean: 우리는 … 삼았으니
  alternatives_korean:
  - 우리는 선택하였으니
  - 우리는 임명하였으니
  lexicon: LSJ
  rationale: 중간태의 ‘선택하다/뽑다’의 뜻을 살리되, 인물 선임의 결과를 자연스럽게 드러내기 위해 ‘삼다’를 썼습니다.
- source_word: ἀντʼ αὐτοῦ
  english_pob_choice: in his place
  chosen_korean: 그를 대신하여
  alternatives_korean:
  - 그의 자리에
  - 그 대신에
  lexicon: LSJ
  rationale: 앞사람의 자리를 이어받는 대체 관계를 분명히 하면서도 한국어에서 가장 자연스러운 표현으로 옮겼습니다.
- source_word: ἄρχοντα καὶ ἡγούμενον
  english_pob_choice: a ruler and leader
  chosen_korean: 한 통치자와 지도자
  alternatives_korean:
  - 한 치리자와 인도자
  - 한 군주와 인도자
  lexicon: LSJ
  rationale: 두 호칭을 각각 살려서 권위와 인도 기능을 함께 드러내되, 후대의 특정 관직명으로 좁히지 않았습니다.
- source_word: τοῦ πολεμῆσαι τὸν πόλεμον ἡμῶν
  english_pob_choice: to fight our war
  chosen_korean: 우리 전쟁을 치르도록 하려는 것입니다
  alternatives_korean:
  - 우리 전쟁을 싸우도록 하려는 것입니다
  - 우리의 전쟁을 수행하도록 하려는 것입니다
  lexicon: LSJ
  rationale: 목적을 나타내는 구조를 한국어 목적절로 자연스럽게 풀어 ‘전쟁을 치르다’로 옮겨 군사적 의미를 유지했습니다.
theological_decisions:
- issue: ἄρχοντα καὶ ἡγούμενον의 직함 뉘앙스
  chosen_reading: ‘통치자와 지도자’로 두 표현을 구분해 번역합니다.
  alternative_readings:
  - ‘군주와 지휘관’
  - ‘총독과 인도자’
  rationale: 이 구절은 정치적 권위와 지도 기능을 함께 말하므로, 두 항을 하나의 관직명으로 합치지 않고 구별해 드러냈습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
