  yaml_path: translation/deuterocanon/1_maccabees/009/033.yaml
  text: And Jonathan and Simon his brother[a], and all those with him, learned of it[b], and they fled into the wilderness of Tekoa and encamped by the water of the cistern of Asphar.
  footnotes:
  - marker: a
    text: Or 'found out.' The Greek simply says they came to know, with the object implied by the context.
    reason: lexical_alternative
  - marker: b
    text: '''Cistern'' could also be rendered ''pit'' or ''well,'' but the phrase ''water of the cistern'' suggests a water source or reservoir.'
    reason: lexical_alternative
translation:
  language: ko
  text: 요나단과 그의 형 시몬과 그와 함께한 모든 사람이 그것을 알게 되었습니다[a]. 그래서 그들은 테고아 광야로 도망하여 아스바르의 못 물가에 진을 쳤습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘알게 되었습니다’는 Greek ἔγνω의 사건적 인지를 반영한 번역입니다. 영어 POB의 ‘learned of it’처럼, 단순한 상태 동사 ‘알았습니다’보다 새로 정보를 접했다는 뜻을 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: λάκκου는 문자적으로 ‘구덩이/못/우물’일 수 있으나, 여기서는 ‘물’과 함께 쓰여 물을 저장하는 시설을 가리키는 것으로 보입니다. 그래서 ‘못’으로 옮겼습니다.
    reason: lexical_alternative
