theological_decisions:
- issue: 안식일 표현의 관용구 처리
  chosen_reading: ‘τῇ ἡμέρᾳ τῶν σαββάτων’을 직역형 어색함보다 관용적 의미인 ‘안식일’로 옮겼습니다.
  alternative_readings:
  - ‘안식일들의 날에’ 같은 직역
  - ‘사바트의 날에’ 같은 음차
  rationale: 유대 그리스어 관용구를 한국어 독자가 즉시 알아들을 수 있게 하면서도, 본문의 시간적 긴박감과 유대적 배경은 유지됩니다.
  doctrine_reference: 성경 번역의 관용구 처리 원칙
