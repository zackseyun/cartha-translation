  lexicon: LSJ
  rationale: κρηπίς는 지형에 따라 기슭·둑·강변 등을 가리킬 수 있는데, 여기서는 도착 지점을 나타내므로 ‘언덕’으로 옮겨 강가의 지형적 경계를 살렸습니다.
