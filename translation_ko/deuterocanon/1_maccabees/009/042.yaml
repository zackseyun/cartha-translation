  text: And they avenged the blood of their brother[b][a], and returned to the hill country of the Jordan.
  footnotes:
  - marker: a
    text: Greek literally, 'they avenged the vengeance of blood of their brother,' an emphatic expression for blood-revenge.
    reason: lexical_alternative
  - marker: b
    text: Or 'to the mountain of the Jordan.' The Greek ὄρος may denote mountainous or hill-country terrain rather than a single peak.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 자기들의 형제의 피에 대한 복수를 갚고, 요단의 산지로 돌아갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로는 ‘그들의 형제의 피의 복수를 복수했다’는 식의 중첩된 표현으로, 피의 복수를 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: ὄρος는 단일한 산봉우리보다 산지나 구릉지대를 가리킬 수 있습니다.
    reason: lexical_alternative
