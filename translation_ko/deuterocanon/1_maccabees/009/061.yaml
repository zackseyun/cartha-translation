translation:
  language: ko
  text: 그들은 그 지방의 남자들 가운데서 악의 주모자들인 사람 오십 명을 붙잡아, 그들을 죽였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 직역하면 ‘악의 지도자들’에 가깝습니다. 문맥상 ‘악을 주도한 사람들’ 또는 ‘악행의 우두머리들’로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέλαβον
  english_pob_choice: seized
  chosen_korean: 붙잡아
  alternatives_korean:
  - 붙들어
  - 체포하여
  - 사로잡아
  lexicon: BDAG
  rationale: 사람을 강하게 잡아 가두는 동작을 자연스럽게 살리되, 법적 절차를 뜻하는 ‘체포하여’는 피했습니다.
- source_word: ἀπὸ τῶν ἀνδρῶν τῆς χώρας
  english_pob_choice: from the men of the country
  chosen_korean: 그 지방의 남자들 가운데서
  alternatives_korean:
  - 그 땅의 남자들 가운데서
  - 그 지역의 남자들 가운데서
  - 그 나라의 남자들 가운데서
  lexicon: LSJ
  rationale: ἀπό의 분리·선택 감각을 ‘가운데서’로 살리고, χώρα는 문맥상 ‘지방/지역’으로 옮겨 한국어에서 자연스럽게 만들었습니다.
- source_word: τῶν ἀρχηγῶν τῆς κακίας
  english_pob_choice: who were leaders of wickedness
  chosen_korean: 악의 주모자들인 사람
  alternatives_korean:
  - 악을 주도한 자들인 사람
  - 악한 일의 지도자들인 사람
  - 악행의 우두머리들인 사람
  lexicon: LSJ
  rationale: ἀρχηγός의 ‘앞장서는 사람들’과 κακία의 ‘악/악행’ 감각을 함께 살려, 단순한 성격 묘사보다 ‘주모자’라는 실행적 의미를 드러냈습니다.
- source_word: ἀπέκτεινεν
  english_pob_choice: he killed them
  chosen_korean: 그들을 죽였습니다
  alternatives_korean:
  - 그들을 처형했습니다
  - 그들을 죽여 버렸습니다
  - 그들을 죽였습니다
  lexicon: BDAG
  rationale: 원문의 단순 과거를 따라 기본 의미인 ‘죽였습니다’를 택했고, ‘처형했습니다’는 사법적 뉘앙스를 덧붙일 수 있어 피했습니다.
theological_decisions:
- issue: 동사 수의 긴장 보존
  chosen_reading: 마지막 절의 단수 동사 감각을 한국어에서는 주어를 반복하지 않고 ‘그들을 죽였습니다’로 옮겨, 본문이 가진 주어 전환의 긴장을 과도하게 평준화하지 않았습니다.
  alternative_readings:
  - ‘그들이 그들을 죽였습니다’로 복수화하여 매끈하게 만들기
  - 선행 주어를 특정 인물로 명시하기
  rationale: 본문은 ‘그들이 붙잡았다’ 뒤에 ‘그가 죽였다’로 수가 바뀌지만, 확실한 보정 근거가 없으므로 본문의 서술 긴장을 유지하는 편이 더 충실합니다.
  doctrine_reference: DOCTRINE.md §3
- issue: τῆς κακίας의 해석
  chosen_reading: ‘악의’로 옮겨, 추상적 악 자체와 악을 행하는 집단/행위 모두를 열어 두었습니다.
  alternative_readings:
  - ‘악행의’
  - ‘악한 무리의’
  - ‘사악함의’
  rationale: English POB가 ‘leaders of wickedness’로 풀었으나, 그리스어는 직역하면 ‘악의 지도자들’에 가깝습니다. 한국어는 의미를 지나치게 좁히지 않도록 열어 두었습니다.
  doctrine_reference: DOCTRINE.md §2
