  lexicon: LSJ
  rationale: 원문은 문자적으로는 ‘이천 마리의 말’이지만, 영어 POB의 주석처럼 실제 의미는 기마 병력입니다. 한국어에서는 독자가 군사 규모를 즉시 이해하도록 ‘기병’으로 옮겼습니다.
