  - 이만 명의 군사
  lexicon: LSJ
  rationale: 문맥상 군사 수효를 말하므로 일반적인 ‘남자들’보다 군사적 기능이 드러나는 ‘보병’이 한국어에서 더 정확합니다. 다만 원문의 ἀνδρῶν이 단순히 성별이 아니라 병력 단위를 가리킨다는 점을 반영한 선택입니다.
- source_word: δισχιλίοις ἵπποις
  english_pob_choice: two thousand horsemen
  chosen_korean: 이천 명의 기병
  alternatives_korean:
