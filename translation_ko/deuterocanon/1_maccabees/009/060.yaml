  source_fidelity: 주절 ἀπῆρεν τοῦ ἐλθεῖν은 ‘오기를 그만두다/오려는 것을 단념하다’라는 뜻으로 옮겨야 하며, 현 번역의 기본 방향은 적절합니다. 다만 ‘큰 군대를 거느리고 오기’는 한국어에서 다소 어색하고 δύναμις의 비교적 넓은 ‘병력’ 의미를 ‘군대’로 다소 좁힙니다. 후반의 ‘그들은’은 원문의 단수 동사 οὐκ ἠδύνατο를 집단적으로 이해한 영어 POB의 해석을 따르지만, 그 문법적 긴장은 각주에서 명시하는 편이 좋습니다. 마지막 수동 구문은 음모가 요나단 측에 알려졌다는 문맥적 의미를 본문과 각주가 함께 충실히 전달합니다.
  naturalness: ‘많은 병력을 이끌고 오는 것을 그만두고’와 ‘붙잡으라고’가 현대 표준어 합쇼체 서술에서 더 자연스럽습니다. ‘편지들을’보다 집합 명사인 ‘편지를’가 자연스럽고, 복수성도 문맥상 손실되지 않습니다.
  terminology: ‘동맹자들’, ‘요나단’, ‘붙잡다’, ‘계획’은 적절합니다. ‘병력’은 군사적 δύναμις를 지나치게 특정하지 않으면서 자연스럽게 나타냅니다.
