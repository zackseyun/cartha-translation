    rationale: μετὰ δυνάμεως πολλῆς는 많은 군사력·병력을 동반한다는 뜻입니다. ‘많은 병력을 이끌고 오는 것을 그만두고’가 의미 범위와 한국어 문체를 더 잘 살립니다.
