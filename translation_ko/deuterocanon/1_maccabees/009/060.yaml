  to: 그리고 그는 많은 병력을 이끌고 오는 것을 그만두고[a], 유대에 있는 자기의 모든 동맹자들에게 몰래 편지를 보내, 요나단과 그와 함께 있는 사람들을 붙잡으라고 하였습니다. 그러나 그들의 계획이 드러났기 때문에, 그들은 그렇게 할 수 없었습니다[b].
