base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/060.yaml
  text: And he refrained from coming with a large force[a], and secretly sent letters to all his allies in Judea, so that they might seize Jonathan and those with him; but they were not able[b], because their plan became known to them.
  footnotes:
  - marker: a
    text: Or, 'he was not able,' taking the singular verb as referring to the principal plotter rather than the conspirators collectively.
    reason: lexical_alternative
  - marker: b
    text: The final clause means that the conspiracy was exposed to the intended targets, i.e., Jonathan and those with him.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 큰 군대를 거느리고 오기를 그만두고[a], 몰래 편지들을 보내 유대에 있는 자기의 모든 동맹자들에게, 요나단과 그와 함께 있는 사람들을 붙잡게 하려 하였으나, 그들의 계획이 드러났기 때문에 그들은 그렇게 할 수 없었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 오지 못했다’로 볼 수 있습니다. 단수 동사를 주모자 개인을 가리키는 것으로 이해할 수 있기 때문입니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 그들의 음모가 의도된 대상들, 곧 요나단과 그와 함께 있는 사람들에게 드러났다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆρεν τοῦ ἐλθεῖν
  english_pob_choice: refrained from coming
  chosen_korean: 오기를 그만두고
  alternatives_korean:
  - 오는 것을 멈추고
  - 오기를 포기하고
  - 오지 않기로 하고
  lexicon: LSJ
  rationale: ἀπῆρεν τοῦ ἐλθεῖν은 오려는 행동에서 물러서는 뜻이므로, ‘오기를 그만두고’가 현대 한국어에서 가장 자연스럽고 원문 의미를 과장하지 않습니다.
- source_word: μετὰ δυνάμεως πολλῆς
  english_pob_choice: with a large force
  chosen_korean: 큰 군대를 거느리고
  alternatives_korean:
  - 큰 병력을 가지고
  - 막강한 군세로
  - 많은 군사와 함께
  lexicon: LSJ
  rationale: δύναμις는 여기서 군사력, 곧 병력/군대를 가리키므로 ‘큰 군대를 거느리고’가 문맥상 자연스럽고 전쟁 서술에도 잘 맞습니다.
- source_word: ἐπιστολὰς λάθρᾳ
  english_pob_choice: secretly sent letters
  chosen_korean: 몰래 편지들을 보내
  alternatives_korean:
  - 은밀히 편지들을 보내
  - 비밀리에 서한을 보내
  - 몰래 서신을 보내
  lexicon: LSJ
  rationale: λάθρᾳ는 행위의 은밀성을 나타내므로 ‘몰래’로 간결하게 옮겼고, ἐπιστολάς는 복수형을 살려 ‘편지들을’로 표현했습니다.
- source_word: τοῖς συμμάχοις αὐτοῦ
  english_pob_choice: to all his allies
  chosen_korean: 자기의 모든 동맹자들에게
  alternatives_korean:
  - 자기 동맹자들에게
  - 자기의 모든 동맹들에게
  - 자기 편의 모든 사람들에게
  lexicon: LSJ
  rationale: σύμμαχος는 정치·군사적 동맹자를 뜻하므로 ‘동맹자들’이 가장 직접적입니다. αὐτοῦ는 소유를 살려 ‘자기의’로 옮겼습니다.
- source_word: ὅπως συλλάβωσι
  english_pob_choice: so that they might seize
  chosen_korean: 붙잡게 하려 하였으나
  alternatives_korean:
  - 붙잡도록 하려 하였으나
  - 체포하게 하려 하였으나
  - 사로잡게 하려 하였으나
  lexicon: LSJ
  rationale: συλλαμβάνω는 여기서 잡다/붙잡다의 뜻이므로, 법적 뉘앙스를 덧붙이지 않는 ‘붙잡게 하려’가 가장 무난합니다.
- source_word: ἔγνωσθη αὐτοῖς ἡ βουλὴ αὐτῶν
  english_pob_choice: their plan became known to them
  chosen_korean: 그들의 계획이 드러났기 때문에
  alternatives_korean:
  - 그들의 계략이 알려졌기 때문에
  - 그들의 계획이 그들에게 알려졌기 때문에
  - 그들의 음모가 탄로 났기 때문에
  lexicon: LSJ
  rationale: βουλή는 여기서 계획/의도이며, 수동형 ἔγνωσθη는 계획이 폭로되었음을 뜻합니다. 한국어에서는 결과를 자연스럽게 풀어 ‘드러났기 때문에’로 옮겼습니다.
theological_decisions:
- issue: οὐκ ἠδύνατο의 주어를 단수로 볼지 복수로 볼지
  chosen_reading: 문맥상 암시되는 공모자 집단을 주어로 보고 ‘그들은 그렇게 할 수 없었습니다’로 옮겼습니다.
  alternative_readings:
  - ‘그는 그렇게 할 수 없었습니다’
  - ‘그들은 그렇게 하지 못했습니다’
  rationale: 형태는 단수지만 뒤의 복수형 대명사들과 전체 문맥이 공모자 집단을 가리키므로, POB의 영어 각주 취지를 따라 집합적 의미를 살렸습니다.
  doctrine_reference: 본문 해석상의 문법·문맥 결정
- issue: ἔγνωσθη αὐτοῖς ἡ βουλὴ αὐτῶν의 대상
  chosen_reading: 계획이 대상자들에게 알려져 작전이 노출되었다는 뜻으로 이해했습니다.
  alternative_readings:
  - 그들의 계획이 자기들 자신에게 알려졌다
  - 그들의 계획이 발각되었다
  rationale: αὐτοῖς의 지시 대상이 압축적으로 제시되어 있어, 영어 POB 각주대로 음모가 의도된 대상에게 드러났다는 의미를 반영했습니다.
  doctrine_reference: 본문 해석상의 문맥 결정
