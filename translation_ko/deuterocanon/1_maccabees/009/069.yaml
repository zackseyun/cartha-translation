base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/069.yaml
  text: And he became angry with those lawless men who had advised him to come into the country[a], and he killed many of them, and he decided to depart to his own land.
  footnotes:
  - marker: a
    text: 'Greek manuscripts as represented by Swete read literally, ''and they killed many of them.'' Because the surrounding verbs are singular and the sense is that the same leader acted, the main text renders the clause as singular: ''he killed many of them.'''
    reason: textual_variant
translation:
  language: ko
  text: 그리고 불법한 그 사람들에게 화를 냈는데, 그들은 그에게 그 지방으로 들어오라고 सलाह한 사람들이었습니다. 그는 그들 가운데 많은 사람을 죽였고, 자기 땅으로 떠나기로 결심했습니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 일부 그리스어 사본 전승은 문자적으로 ‘그들이 그들 가운데 많은 사람을 죽였다’로 읽습니다. 그러나 앞뒤 동사들이 단수이고 의미상 같은 지도자의 행동으로 이해되므로, 본문은 단수로 옮겼습니다.
    reason: textual_variant
lexical_decisions:
- source_word: τοῖς ἀνόμοις
  english_pob_choice: lawless men
  chosen_korean: 불법한 그 사람들
  alternatives_korean:
  - 율법 없는 사람들
  - 무법한 사람들
  - 악한 사람들
  lexicon: ἀνόμος
  rationale: ἀνόμοις는 단순한 도덕적 악함보다 율법을 무시하는 성격을 드러내므로, ‘불법한’으로 옮겨 원문의 법적·윤리적 뉘앙스를 살렸습니다.
- source_word: ἐλθεῖν εἰς τὴν χώραν
  english_pob_choice: come into the country
  chosen_korean: 그 지방으로 들어오다
  alternatives_korean:
  - 그 땅으로 들어오다
  - 그 지역으로 들어오다
  - 나라 안으로 들어오다
  lexicon: χώρα
  rationale: χώρα는 여기서 특정 정치·지리적 ‘지역/지방’을 가리키므로, 너무 포괄적인 ‘땅’보다 ‘그 지방’이 문맥상 더 분명합니다.
- source_word: ἀπέκτειναν ἐξ αὐτῶν πολλούς
  english_pob_choice: he killed many of them
  chosen_korean: 그들 가운데 많은 사람을 죽였고
  alternatives_korean:
  - 그들 가운데 많은 사람을 죽였고
  - 그들 중 많은 사람을 죽였고
  - 그들 가운데 많은 이들을 죽였고
  lexicon: ἀποκτείνω
  rationale: 주변 동사가 단수이고 의미상 동일한 주체의 행동이 이어지므로, 영어 POB의 처리처럼 단수 주체를 반영해 자연스럽게 옮겼습니다.
- source_word: γῆν αὐτοῦ
  english_pob_choice: his own land
  chosen_korean: 자기 땅
  alternatives_korean:
  - 자기 나라
  - 자기 고향 땅
  - 자기 땅
  lexicon: γῆ
  rationale: γῆν αὐτοῦ는 소유 관계가 분명한 귀환 목적지를 가리키므로, 간결하게 ‘자기 땅’으로 옮겼습니다.
theological_decisions:
- issue: 문장 주체의 일치와 폭력 행위 서술
  chosen_reading: 그가 화를 내고 많은 사람을 죽였으며 떠나기로 결심한 동일 주체의 연속된 행위로 읽었습니다.
  alternative_readings:
  - ‘그들이 많은 사람을 죽였다’는 복수 주어 해석
  - 문장들을 분리해 행위 주체를 불확정으로 두는 해석
  rationale: 주변 문맥과 동사의 연속 구조가 동일한 지도자의 행위 흐름을 가리키므로, 본문 의미를 가장 직접적으로 드러내는 단수 해석을 택했습니다.
  doctrine_reference: 본문비평/문맥 해석
- issue: direct speech/register
  chosen_reading: 서술문이므로 합쇼체의 평서형을 유지하고, 인물의 직접 화법은 없으므로 등록 변화는 적용하지 않았습니다.
  alternative_readings:
  - 구어체적 서술
  - 더 문어적인 종결
  rationale: 역사 서술의 간결성과 현대 표준어의 균형을 위해 합쇼체를 유지했습니다.
  doctrine_reference: 번역 शैली 원칙
