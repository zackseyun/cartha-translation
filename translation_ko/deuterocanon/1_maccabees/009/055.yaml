base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/055.yaml
  text: At that time Alcimus was struck down[a], and his works were hindered; his mouth was stopped up, and he was paralyzed, and he could no longer speak a word or give orders concerning his house.
  footnotes:
  - marker: a
    text: Or 'his household' or 'his affairs'; Greek 'house' (οἶκος) can refer to the household establishment, not only the physical building.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 알키모스가 쓰러졌고[a], 그의 일들이 방해를 받았으며, 그의 입이 막혔고, 그는 마비되었으며, 더 이상 한마디도 말할 수 없었고 자기 집에 관하여 명령할 수도 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그의 집안'이나 '그의 일들'; 그리스어 '집'(οἶκος)은 단지 물리적 건물만이 아니라 가정과 집안 체제를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήγη
  english_pob_choice: was struck down
  chosen_korean: 쓰러졌고
  alternatives_korean:
  - 타격을 입었고
  - 쳐졌고
  - 쓰러졌습니다
  lexicon: LSJ
  rationale: 깊은 타격으로 인한 급격한 무력화라는 뉘앙스를 자연스럽게 살리기 위해, 단순한 '맞았다'보다 결과를 드러내는 '쓰러졌고'를 선택했습니다.
- source_word: ἐνεποδίσθη τὰ ἔργα αὐτοῦ
  english_pob_choice: his works were hindered
  chosen_korean: 그의 일들이 방해를 받았으며
  alternatives_korean:
  - 그의 일들이 저지되었으며
  - 그의 행적이 막혔으며
  - 그의 사업이 방해를 받았으며
  lexicon: LSJ
  rationale: ἔργα를 좁게 '행위'나 '선행'으로 한정하지 않고, 문맥상 그가 추진하던 일련의 활동을 가리키는 넓은 뜻으로 살려 '일들'로 옮겼습니다.
- source_word: ἀπεφράγη τὸ στόμα αὐτοῦ
  english_pob_choice: his mouth was stopped up
  chosen_korean: 그의 입이 막혔고
  alternatives_korean:
  - 그의 입이 봉해졌고
  - 그의 입이 닫혔고
  - 그의 말문이 막혔고
  lexicon: LSJ
  rationale: 동사의 이미지가 '막히다/봉해지다'에 가깝기 때문에, 신체적이고 구체적인 표현을 유지하면서도 한국어로 자연스러운 '입이 막혔고'를 택했습니다.
- source_word: οὐκ ἠδύνατο ἔτι λαλῆσαι λόγον
  english_pob_choice: he could no longer speak a word
  chosen_korean: 더 이상 한마디도 말할 수 없었고
  alternatives_korean:
  - 더 이상 아무 말도 할 수 없었고
  - 더는 한 마디도 말하지 못했고
  - 더 이상 말을 할 수 없었고
  lexicon: LSJ
  rationale: '''ἔτι''의 ''더 이상''을 살리고, ''λαλῆσαι λόγον''의 관용적 감각을 한국어의 ''한마디도 말하다''로 옮겨 말문이 완전히 끊긴 상태를 드러냈습니다.'
- source_word: ἐντείλασθαι περὶ τοῦ οἴκου αὐτοῦ
  english_pob_choice: give orders concerning his house
  chosen_korean: 자기 집에 관하여 명령할 수도 없었습니다
  alternatives_korean:
  - 자기 집에 관하여 지시할 수도 없었습니다
  - 자기 집안에 대해 명령할 수도 없었습니다
  - 자기 가정에 대해 지시할 수도 없었습니다
  lexicon: LSJ
  rationale: οἶκος는 건물만이 아니라 가정/가구/집안 체계를 가리킬 수 있으나, POB의 'house'를 따라 '집'을 기본으로 두고, 명령권의 상실을 분명히 했습니다.
theological_decisions:
- issue: 알키모스의 병증을 어떻게 해석할 것인가
  chosen_reading: 본문이 말하는 급격한 무력화와 언어 상실을 그대로 살리되, 구체적 의학 진단이나 명시적 신적 원인을 덧붙이지 않았습니다.
  alternative_readings:
  - 하나님의 심판으로 명시하기
  - 뇌졸중/발작 같은 의학적 진단으로 특정하기
  rationale: 본문은 연속된 수동 표현으로 사건의 결과를 묘사할 뿐, 여기서 원인과 병명을 분명히 밝히지 않으므로 해석을 과도하게 확정하지 않는 편이 원문에 충실합니다.
  doctrine_reference: 원문의 불확정성을 보존하여 신학적 긴장을 유지함.
