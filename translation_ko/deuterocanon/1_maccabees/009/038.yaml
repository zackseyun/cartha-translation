  source_fidelity: 그리스어는 그들이 ‘그들의 형제 요한’을 기억한 뒤 올라가 산의 σκέπη 아래에 숨었다고 말합니다. 초안의 ‘덮개’는 σκέπη의 어휘 범위에 닿지만, ‘산의 덮개 아래’는 한국어에서 산의 실제 덮개라는 부자연스럽고 불명료한 이미지를 만듭니다. ‘산의 그늘 아래’는 산이 제공하는 가림·은폐의 공간이라는 문맥적 이미지를 자연스럽게 전달하며, 별도의 지형을 보태지 않습니다.
  naturalness: ‘자기들의 형제’와 특히 ‘산의 덮개 아래’는 현대 표준 한국어의 자연스러운 서술이 아닙니다. ‘그들의 형제’ 및 ‘산의 그늘 아래’가 합쇼체 서술에 자연스럽습니다.
  terminology: 요한은 그리스어 Ἰωάνου에 대한 통상적인 한국어 성서식 인명입니다. σκέπη는 ‘그늘’로 문맥상 옮기되, 각주에서 ‘덮개/피난처/보호’라는 어휘적 가능성을 밝혀 의미를 한정하지 않습니다.
