  lexicon: ἀποκτείνω
  rationale: 본문은 단순히 해를 끼치는 것이 아니라 죽이려는 의도를 말하므로, 형식적 처형 뉘앙스가 없는 직접적인 ‘죽이려고’가 적절합니다.
