  lexicon: γινώσκω
  rationale: 여기서는 단순한 지식 보유보다 사건에 대한 인지·파악의 의미가 강하므로, POB의 ‘found out’에 맞게 ‘그 일을 알고’로 자연스럽게 옮겼습니다.
- source_word: ἐζήτει
