  text: And Bacchides learned of it on the Sabbath day[b][a], and he himself and all his army came to the other side of the Jordan.
  footnotes:
  - marker: a
    text: Greek literally, 'on the day of the Sabbaths,' an idiom meaning 'on the Sabbath day.'
    reason: lexical_alternative
  - marker: b
    text: Or 'beyond the Jordan.' The Greek expression can denote the region across the river or movement to the other side.
    reason: alternative_reading
translation:
  language: ko
  text: 바키데스는 안식일에 그 일을 알게 되었습니다. 그리고 바키데스 자신과 그의 온 군대가 요단강 건너편으로 왔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어를 문자적으로 옮기면 ‘안식들의 날에’이지만, 이는 관용적으로 ‘안식일에’를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘요단강 저편에’ 또는 ‘요단강 반대편으로’. 헬라어 πέραν은 강 건너의 지역을 가리킬 수도 있고, 그쪽으로의 이동을 나타낼 수도 있습니다.
    reason: alternative_reading
