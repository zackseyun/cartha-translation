  - 안식일 날에
  lexicon: LSJ
  rationale: 헬라어 관용구가 ‘안식일’을 뜻하므로 의미는 분명히 전달하되, 한국어에서는 평이하게 ‘안 그 날에’로 옮겨 주었습니다.
- source_word: πέραν τοῦ Ἰορδάνη
