  text: And Bacchides learned of it on the Sabbath day[b][a], and he himself and all his army came to the other side of the Jordan.
  footnotes:
  - marker: a
    text: Greek literally, 'on the day of the Sabbaths,' an idiom meaning 'on the Sabbath day.'
    reason: lexical_alternative
  - marker: b
    text: Or 'beyond the Jordan.' The Greek expression can denote the region across the river or movement to the other side.
    reason: alternative_reading
translation:
  language: ko
  text: 백기디스는 그 일을 안 그 날에 알게 되었고, 그 자신과 그의 모든 군대는 요단강 건너편으로 왔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어는 문자적으로 ‘안식들의 날에’이지만, 관용적으로 ‘안식일에’를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘요단강 건너편으로’는 ‘요단강 저편/반대편으로’의 자연스러운 번역으로, πέραν이 가리킬 수 있는 이동 방향을 살린 표현입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγνω
  english_pob_choice: learned of it
  chosen_korean: 알게 되었고
