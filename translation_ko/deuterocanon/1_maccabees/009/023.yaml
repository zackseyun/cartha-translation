translation:
  language: ko
  text: 그리고 유다의 죽음 뒤에 불법한 자들이 이스라엘의 모든 지역에서 모습을 드러냈고, 의를 행하지 않는 자들 모두가 일어났습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '불법한 자들'이 아니라 단순히 '불법한 이들'로도 옮길 수 있습니다. 그리스어 남성 복수는 실명사적으로 쓰일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '불의를 행하는 자들'로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο μετὰ τὴν τελευτὴν Ἰούδου
  english_pob_choice: it happened that after the death of Judas
  chosen_korean: 유다의 죽음 뒤에
  alternatives_korean:
  - 유다가 죽은 뒤에
  - 유다의 사망 뒤에
  - 유다의 종말 뒤에
  lexicon: LSJ
  rationale: 서사 전환 공식은 한국어에서 매끄러운 시간부사구로 옮기고, τελευτήν은 문맥상 추상적 '끝'이 아니라 실제 죽음을 가리키므로 '죽음'으로 렌더링했습니다.
- source_word: οἱ ἄνομοι
  english_pob_choice: the lawless
  chosen_korean: 불법한 자들
  alternatives_korean:
  - 법 없는 자들
  - 율법을 어기는 자들
  - 무법자들
  lexicon: LSJ
  rationale: ἄνομοι의 핵심은 법/율법에 대한 불순종이므로, 도덕적 색채를 살리되 한국어에서 자연스러운 실명사형 표현인 '불법한 자들'을 택했습니다.
- source_word: ἐν πᾶσιν τοῖς ὁρίοις Ἰσραήλ
  english_pob_choice: in all the territories of Israel
  chosen_korean: 이스라엘의 모든 지역에서
  alternatives_korean:
  - 이스라엘의 모든 경계 안에서
  - 이스라엘의 모든 영토에서
  - 이스라엘의 모든 지경에서
  lexicon: LSJ
  rationale: ὁρίοις는 단순한 경계선보다 분포된 지역 전체를 가리키므로, 현대 독자가 이해하기 쉬운 '지역'으로 옮겼습니다.
- source_word: οἱ ἐργαζόμενοι τὴν ἀδικίαν
  english_pob_choice: those who worked unrighteousness
  chosen_korean: 의를 행하지 않는 자들 모두가
  alternatives_korean:
  - 불의를 행하는 자들 모두가
  - 불의를 저지르는 자들 모두가
  - 부정의를 행하는 자들 모두가
  lexicon: BDAG
  rationale: ἐργάζομαι + ἀδικία는 지속적 행위를 나타내므로, 한국어에서는 행위의 부재를 드러내는 부정 표현으로 풀어 '의를 행하지 않는 자들'이라고 옮겨 본문 대비를 살렸습니다.
theological_decisions:
- issue: ἀδικία의 렌더링에서 '의'와 '불의'의 긴장 유지
  chosen_reading: 본문의 대조를 살려 '의를 행하지 않는 자들'로 옮겼습니다.
  alternative_readings:
  - 불의를 행하는 자들
  - 부정의를 행하는 자들
  - 불의한 행위를 하는 자들
  rationale: 이 절은 '불법한 자들'과 '의를 행하지 않는 자들'을 병치하므로, 단순히 '나쁜 사람들'로 완화하지 않고 율법/의의 언어를 유지하는 편이 원문 효과에 가깝습니다.
  doctrine_reference: 'DOCTRINE.md: moral vocabulary and covenantal texture'
- issue: σπαν정? substantive plural의 성별 형식
  chosen_reading: '''자들''을 붙여 남성 복수의 실명사적 용법을 한국어에서 중립적으로 살렸습니다.'
  alternative_readings:
  - 불법한 이들
  - 불법한 사람들
  rationale: 그리스어 남성 복수는 성중립적 집단 지칭으로도 기능하므로, 한국어에서는 과도한 성별 표지를 피하면서도 집단성을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: source-sensitive gender rendering'
