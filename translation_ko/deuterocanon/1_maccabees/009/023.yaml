  source_fidelity: 초안의 ‘의를 행하지 않는 자들’은 ἀδικίαν(불의·부정)을 행한다는 적극적 표현을 단순히 ‘의를 행하지 않는다’로 바꾸어 의미 범위를 넓히고 원문의 도덕적 비난을 약화합니다. 이를 ‘불의를 행하는 자들’로 바로잡아야 합니다. 또한 각주 표지가 해당 어구가 아닌 ‘유다’와 ‘이스라엘’ 뒤에 놓여 있어, 각주 대상이 명확하지 않습니다.
  naturalness: ‘무법한 자들’, ‘불의를 행하는 자들’, ‘모두 일어났습니다’는 현대 표준 한국어의 격식 있는 성경 문체에 자연스럽습니다. ‘모습을 드러냈고’는 ἐξέκυψαν의 출현·드러남을 적절히 반영합니다.
