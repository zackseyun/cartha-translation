  to: 그는 욥바를 향해 진을 쳤으나, 그 도시 사람들이 그를 들이지 않았습니다. 욥바에 아폴로니오스의 수비대가 있었기 때문입니다. 그리고 그들은 그 도시와 싸웠습니다.[a]
