base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/075.yaml
  text: And he encamped against Joppa[a], but those from the city shut him out, because a garrison of Apollonius was in Joppa; and they fought against it.
  footnotes:
  - marker: a
    text: 'Greek: ''they fought against it.'' The subject shifts to plural in the source text after the earlier singular verbs, and the pronouns likely refer to Jonathan and his forces on the one hand and to Joppa on the other. The wording is retained rather than smoothed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 욥바를 향해 진을 쳤으나, 그 도시 사람들이 그를 들이지 않았습니다. 욥바에 아폴로니오스의 수비대가 있었기 때문입니다. 그리고 그들은 그 도시와 싸웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어는 앞부분의 단수 동사에서 여기서 복수 동사로 주어가 바뀝니다. 복수 주어는 요나단과 그의 군대를, 여성 단수 목적어는 욥바를 가리키는 것으로 보이지만, 원문의 갑작스러운 전환은 그대로 남겨 두었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρενέβαλεν ἐπὶ
  english_pob_choice: encamped against
  chosen_korean: 진을 쳤으나
  alternatives_korean:
  - 얍바에 진을 쳤으나
  - 얍바를 향해 진을 쳤으나
  - 얍바를 상대로 진을 쳤으나
  lexicon: LSJ
  rationale: 군사적으로 적대적인 접근을 나타내므로, 단순 위치보다 ‘진을 치다’의 전투적 뉘앙스를 살렸습니다.
- source_word: ἀπέκλεισαν αὐτόν
  english_pob_choice: shut him out
  chosen_korean: 그를 들이지 않았습니다
  alternatives_korean:
  - 그를 막아들였습니다
  - 그를 밖으로 막았습니다
  - 그를 거절했습니다
  lexicon: LSJ
  rationale: 도시 주민들이 입성을 거부하고 차단했다는 뜻을 자연스럽게 드러내면서, αὐτόν의 목적어 관계를 보존했습니다.
- source_word: οἱ ἐκ τῆς πόλεως
  english_pob_choice: those from the city
  chosen_korean: 그 성읍 사람들이
  alternatives_korean:
  - 성읍에서 나온 이들이
  - 그 성읍의 주민들이
  - 성읍 사람들은
  lexicon: LSJ
  rationale: 원문의 중립적 표현을 살리되 한국어에서는 행위 주체가 분명하도록 ‘사람들’로 옮겼습니다.
- source_word: φρουρὰ Ἀπολλωνίου
  english_pob_choice: a garrison of Apollonius
  chosen_korean: 아폴로니우스의 수비대
  alternatives_korean:
  - 아폴로니우스의 주둔군
  - 아폴로니우스의 경비대
  - 아폴로니우스의 군대
  lexicon: LSJ
  rationale: φρουρά는 여기서 성읍 안에 주둔한 군사력을 가리키므로, 한국어 군사 용어로 ‘수비대’가 가장 자연스럽습니다.
- source_word: ἐπολέμησαν αὐτήν
  english_pob_choice: they fought against it
  chosen_korean: 그들은 그 성읍과 싸웠습니다
  alternatives_korean:
  - 그들은 그것과 싸웠습니다
  - 그들은 그 성읍을 공격했습니다
  - 그들은 그것을 상대로 싸웠습니다
  lexicon: LSJ
  rationale: 원문은 복수 주어와 여성 단수 대명사를 유지하므로, 대상이 성읍임을 드러내는 동시에 대명사 지시를 흐리지 않도록 처리했습니다.
theological_decisions:
- issue: 복수 주어와 단수 대명사로 인한 갑작스러운 전환
  chosen_reading: ‘그들은 그 성읍과 싸웠습니다’로 옮겨, 원문의 주어 전환을 매끈하게 삭제하지 않고 유지했습니다.
  alternative_readings:
  - ‘그는 그 성읍과 싸웠습니다’로 단수화
  - ‘그들은 그것과 싸웠습니다’로 대상을 모호하게 처리
  rationale: 영어 POB 주석이 지적하듯 원문은 싱귤러에서 플루럴로 전환됩니다. 이를 조화시키지 않고 남겨 두는 편이 사본의 문장 흐름을 더 충실히 반영합니다.
  doctrine_reference: 본문-비평 및 서사 충실성
