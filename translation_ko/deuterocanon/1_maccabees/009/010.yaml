- from: 유다는 말했습니다. 「그런 일을 하여 그들로부터 도망치는 것은 내게서 멀리 떠나야 합니다. 우리의 때가 가까이 왔으니, 우리 형제들을 위하여 용맹하게 죽읍시다. 그리고 우리 영광에 대한 비난거리를 남기지 맙시다」.[a][b]
  to: 유다는 말했습니다. 「내가 그런 일, 곧 그들에게서 도망치는 일을 하다니, 결코 있을 수 없습니다. 이제 우리의 때가 가까이 왔으니, 우리 형제들을 위하여 용맹하게[a] 죽읍시다. 그리고 우리의 명예에 비난받을 빌미를 남기지 맙시다[b].」
  rationale: Μή μοι γένοιτο를 한국어의 강한 거부 표현인 “결코 있을 수 없습니다”로 고쳤고, ‘그런 일’과 부정사의 내용을 동격으로 풀어 원문의 명시적 목적어와 ‘그들에게서 도망치다’를 모두 보존했습니다. ἤγγικεν의 완료적 현재 상태는 “가까이 왔으니”로 옮겼습니다. 마지막 절은 교파적 해석을 더하지 않고, 명예·평판을 해칠 비난의 근거를 남기지 말자는 원문의 수사적 뜻을 자연스럽게 반영했습니다.
