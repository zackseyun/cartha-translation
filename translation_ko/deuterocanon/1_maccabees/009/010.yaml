base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/010.yaml
  text: And Judas said[a], “Far be it from me to do this thing—to flee from them. And if our time has drawn near, let us die bravely for the sake of our brothers[b], and let us not leave a cause for reproach to our glory.”
  footnotes:
  - marker: a
    text: Or 'let us die with courage'; more literally, 'let us die manfully.' The Greek expression uses a term associated with courage or valor.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'our glory' can also be understood as 'our honor' or 'our reputation' in this context.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다는 말했습니다. 「그런 일을 하여 그들로부터 도망치는 것은 내게서 멀리 떠나야 합니다. 우리의 때가 가까이 왔으니, 우리 형제들을 위하여 용맹하게 죽읍시다. 그리고 우리 영광에 대한 비난거리를 남기지 맙시다」.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἀνδρίᾳ는 ‘용맹하게, 담대하게’라는 뜻으로 이해할 수 있으며, 직역하면 ‘남자답게’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: τῇ δόξῃ ἡμῶν은 문맥상 ‘우리의 영광’뿐 아니라 ‘우리의 명예/평판’으로도 읽힐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μή μοι γένοιτο ποιῆσαι τὸ πρᾶγμα τοῦτο
  english_pob_choice: Far be it from me to do this thing
  chosen_korean: 그런 일을 하여 ... 것은 내게서 멀리 떠나야 합니다
  alternatives_korean:
  - 그런 일을 하는 것은 절대로 안 됩니다
  - 그런 일을 하게 될 리 없습니다
  lexicon: LSJ
  rationale: 거부의 관용구를 한국어에서 자연스럽게 옮기되, 단순한 금지보다 강한 개인적 거절의 뉘앙스를 살렸습니다.
- source_word: φυγεῖν ἀπʼ αὐτῶν
  english_pob_choice: to flee from them
  chosen_korean: 그들로부터 도망치는
  alternatives_korean:
  - 그들로부터 도망하는
  - 그들로부터 달아나는
  lexicon: LSJ
  rationale: φυγεῖν의 기본 뜻인 ‘도망치다/달아나다’를 살리고, ἀπʼ αὐτῶν의 분리 의미를 분명히 했습니다.
- source_word: ἀποθάνωμεν ἀνδρίᾳ
  english_pob_choice: let us die bravely
  chosen_korean: 용맹하게 죽읍시다
  alternatives_korean:
  - 용기를 가지고 죽읍시다
  - 남자답게 죽읍시다
  lexicon: LSJ
  rationale: ἀνδρίᾳ의 용맹·담대함을 현대 한국어에서 가장 자연스럽게 전달하면서, 성별화된 오해를 줄였습니다.
- source_word: μὴ καταλίπωμεν αἰτίαν τῇ δόξῃ ἡμῶν
  english_pob_choice: let us not leave a cause for reproach to our glory
  chosen_korean: 우리 영광에 대한 비난거리를 남기지 맙시다
  alternatives_korean:
  - 우리 영예에 대한 비난거리를 남기지 맙시다
  - 우리 명예에 흠이 남지 않게 합시다
  lexicon: LSJ
  rationale: αἰτία를 ‘비난거리’로 옮겨 책임의 근거라는 뜻을 드러냈고, δόξα는 문맥상 ‘영광/명예’의 범위가 있어 ‘영광’으로 두되 한국어에서는 ‘비난거리’와 결합시켜 수치를 피하려는 뜻을 분명히 했습니다.
