  text: After these words it was reported to Jonathan and Simon his brother that the sons of Jambri were holding a great wedding[a], and were bringing the bride from Nadabath, the daughter of one of the great nobles of Canaan, with a large escort.
  footnotes:
  - marker: a
    text: Or 'with a great procession.' The Greek παραπομπή can denote the accompanying escort or the festive procession itself.
    reason: lexical_alternative
translation:
  language: ko
  text: 이런 말들이 있은 뒤에, 요나단과 그의 형 시몬에게 Jambri의 아들들이 큰 혼인잔치를 벌이고 있으며, 가나안의 큰 귀족들 가운데 한 사람의 딸인 신부를 Nadabath에서 데려오고 있다는 보고가 전해졌습니다. 그것도 큰 호위 행렬과 함께였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘큰 행렬과 함께’로도 옮길 수 있습니다. 그리스어 παραπομπή는 동반 호위나 축제 행렬 자체를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ τοὺς λόγους τούτους
  english_pob_choice: After these words
  chosen_korean: 이런 말들이 있은 뒤에
  alternatives_korean:
  - 이 말들 뒤에
  - 이 일들 뒤에
  lexicon: LSJ
  rationale: λόγοι를 단순히 ‘말들’로 살리되, 앞뒤 연결이 자연스럽도록 시간 전환 표현으로 옮겼습니다.
- source_word: ἀπηγγέλησαν
  english_pob_choice: it was reported
  chosen_korean: 보고가 전해졌습니다
  alternatives_korean:
  - 전해졌습니다
  - 알려졌습니다
  lexicon: LSJ
  rationale: 그리스어의 비인칭 수동을 살려 주어를 덧붙이지 않았고, ‘보고’로 소식 전달의 성격을 분명히 했습니다.
- source_word: ποιοῦσιν γάμον μέγαν
  english_pob_choice: were holding a great wedding
  chosen_korean: 큰 혼인잔치를 벌이고 있으며
  alternatives_korean:
  - 큰 혼인을 치르고 있으며
  - 큰 결혼잔치를 열고 있으며
  lexicon: LSJ
  rationale: γάμον을 단순한 ‘결혼’보다 잔치의 뉘앙스가 드러나도록 ‘혼인잔치’로 옮겼고, μέγαν의 강조를 유지했습니다.
- source_word: μετὰ παραπομπῆς μεγάλης
  english_pob_choice: with a large escort
  chosen_korean: 큰 호위 행렬과 함께였습니다
  alternatives_korean:
  - 큰 수행단과 함께였습니다
  - 큰 행렬과 함께였습니다
  lexicon: LSJ
  rationale: παραπομπή는 호위와 행렬의 양쪽 뜻이 가능하므로, 본문 흐름상 둘 다 포괄할 수 있는 ‘호위 행렬’로 옮겼습니다.
theological_decisions:
- issue: 혼인잔치와 호위 행렬의 문화적 장면 묘사
  chosen_reading: 문학적 배경을 살리되 의미를 과장하지 않고, 실제 이동과 축제 준비가 함께 보이도록 옮겼습니다.
  alternative_readings:
  - ‘큰 결혼식’으로 단순화할 수 있음
  - ‘큰 행렬’로만 옮길 수 있음
  rationale: 본문은 사건의 위협이나 상징보다 실제 축제 상황을 묘사하므로, 문화적 장면을 독자가 바로 이해하도록 유지했습니다.
  doctrine_reference: 서사 본문의 장면 묘사 원칙
