  naturalness: ‘큰 영예를 가지고 나와’는 현대 표준 한국어에서 부자연스럽습니다. ‘큰 영예를 표하며 나와 그를 맞이하였습니다’가 공적인 존중을 나타내는 ἐν δόξῃ μεγάλῃ를 자연스럽게 전달합니다.
