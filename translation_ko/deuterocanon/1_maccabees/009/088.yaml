    rationale: πόρπη는 버클만이 아니라 브로치나 장식용 걸쇠를 포함할 수 있습니다. 본문은 더 포괄적인 ‘걸쇠’로 두고 각주에서 가능한 형태를 밝혀야 합니다.
  - severity: low
    issue: ‘계속해서 요나단에게 영예를 더했으며’의 중복되고 어색한 표현
