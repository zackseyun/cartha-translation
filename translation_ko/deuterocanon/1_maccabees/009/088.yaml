  - 이 소식
  - 이 이야기들
  lexicon: LSJ
  rationale: λόγοι는 문맥상 단순한 발화 내용이므로, 과도하게 해석하지 않고 직역에 가까운 ‘이 말들’로 옮겼습니다.
- source_word: προσέθετο δοξάσαι
  english_pob_choice: he continued to honor
  chosen_korean: 계속해서 ... 영예를 더했습니다
  alternatives_korean:
  - 계속해서 존경했습니다
  - 더욱 영광스럽게 했습니다
  - 계속해서 높였습니다
  lexicon: LSJ
  rationale: δοξάσαι를 단순 종교어휘인 ‘영광롭게 하다’로 좁히기보다, 왕실 맥락의 ‘영예를 더하다’로 옮겨 존중의 행위를 드러냈습니다.
- source_word: πόρπην
  english_pob_choice: a clasp
  chosen_korean: 버클
  alternatives_korean:
  - 브로치
  - 걸쇠
  - 장식용 걸이
  lexicon: LSJ
  rationale: πόρπη는 고정 장치이자 장식품을 가리킬 수 있어, 기능을 살리면서도 현대 한국어에서 이해하기 쉬운 ‘버클’로 번역했습니다.
theological_decisions:
- issue: 왕이 요나단을 계속 높이는 정치적 표현의 뉘앙스
  chosen_reading: 종교적 ‘영광’보다 왕실 예우의 연속성을 드러내는 서술로 옮겼습니다.
  alternative_readings:
  - 그를 영화롭게 했습니다
  - 그를 존귀하게 했습니다
  rationale: 문맥은 예배적 찬양이 아니라 왕의 호의 확대이므로, 신학적 과잉 해석을 피하고 서술의 정치적 의미를 유지했습니다.
  doctrine_reference: 문맥 우선 원칙
