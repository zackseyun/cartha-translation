translation:
  language: ko
  text: 알렉산드로스 왕이 이 말을 듣자, 그는 요나단에게 더욱 큰 영예를 베풀고 그에게 걸쇠를 보냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘걸쇠’로 번역한 그리스어 πόρπη는 옷이나 장신구를 고정하는 장식물을 가리킵니다. ‘브로치’나 ‘버클’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ὡς
  english_pob_choice: And it happened that when
  chosen_korean: ~했을 때
  alternatives_korean:
  - 그리고 ~하자
  - ~하고 나서
  lexicon: LSJ
  rationale: 사건 전환을 나타내는 서술 공식이므로, 한국어에서는 자연스러운 시간 부사절로 풀어 간결하게 옮겼습니다.
- source_word: τοὺς λόγους τούτους
  english_pob_choice: these words
  chosen_korean: 이 말들
  alternatives_korean:
