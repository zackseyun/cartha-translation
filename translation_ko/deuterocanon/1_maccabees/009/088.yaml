  text: καὶ ἐγένετο ὡς ἤκουσεν Ἀλέξανδρος ὁ βασιλεὺς τοὺς λόγους τούτους, καὶ προσέθετο δοξάσαι τὸν Ἰωναθάν. καὶ ἀπέστειλεν αὐτῷ πόρπην
