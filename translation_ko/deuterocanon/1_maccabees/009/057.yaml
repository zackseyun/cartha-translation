  text: And Bacchides saw that Alcimus had died, and he returned to the king, and the land of Judah was quiet for two years.
translation:
  language: ko
  text: 그리고 바키데스는 알키모스가 죽었다는 것을 보고 왕에게로 돌아갔으며, 유다 땅은 두 해 동안 조용했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέθανεν
  english_pob_choice: had died
  chosen_korean: 죽었다는 것을
  alternatives_korean:
  - 죽었다
  - 이미 죽었다는 것을
  lexicon: LSJ
  rationale: 그리스어 aorist의 사건성을 살리되, 바키데스가 그 사실을 인지했다는 흐름을 자연스럽게 드러내기 위해 ‘죽었다는 것을’으로 옮겼습니다.
- source_word: ἀπέστρεψεν πρὸς τὸν βασιλέα
  english_pob_choice: returned to the king
  chosen_korean: 왕에게로 돌아갔으며
  alternatives_korean:
  - 왕에게 돌아갔으며
  - 왕에게로 되돌아갔으며
  lexicon: LSJ
  rationale: πρὸς + 대격의 이동 방향을 한국어 ‘-에게로’로 살렸고, 서술 연결을 위해 ‘돌아갔으며’로 처리했습니다.
- source_word: ἡσύχασεν
  english_pob_choice: was quiet
  chosen_korean: 조용했습니다
  alternatives_korean:
  - 평안했습니다
  - 고요했습니다
  - 잠잠했습니다
  lexicon: LSJ
  rationale: 여기서는 종교적 ‘평강’보다 정치적·사회적 정적을 나타내는 중립적 표현이 적절하므로 ‘조용했습니다’를 택했습니다.
- source_word: ἡ γῆ Ἰούδα
  english_pob_choice: the land of Judah
  chosen_korean: 유다 땅
  alternatives_korean:
  - 유다의 땅
  - 유대 땅
  lexicon: LSJ
  rationale: γῆ의 ‘땅’을 유지하면서 Ἰούδα를 고유 지명 ‘유다’로 옮겨 성경적 지리 표현을 간결하게 살렸습니다.
theological_decisions:
- issue: ἡσύχασεν의 정황적 의미
  chosen_reading: ‘조용했습니다’로 옮겨 군사적 소요가 멈춘 상태를 표현했습니다.
  alternative_readings:
  - 평안했습니다
  - 잠잠했습니다
  rationale: 본문은 신학적 ‘평강’ 선언이 아니라 사건 서술이므로, 과도한 신학화 없이 정황적 정지를 나타내는 표현을 택했습니다.
  doctrine_reference: 서사 문맥 보존
