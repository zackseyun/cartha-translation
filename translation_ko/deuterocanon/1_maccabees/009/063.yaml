base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/063.yaml
  text: And Bacchides learned of it and gathered all his forces[c][b][a], and he gave orders to those from Judea.
  footnotes:
  - marker: a
    text: Or 'came to know' or 'found out.' The Greek verb can denote receiving news of a situation.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'all his multitude.' In context this likely means the full body of troops or supporters under his command.
    reason: lexical_alternative
  - marker: c
    text: Or 'those in Judea.' The Greek phrase literally reads 'those from Judea,' which may refer to Judean associates rather than only inhabitants currently located there.
    reason: lexical_alternative
translation:
  language: ko
  text: 바키데스는 그것을 알고 자기 모든 무리를 모았으며, 유대에서 온 이들에게 명령을 내렸습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘알게 되다’, ‘소식을 듣다’. 이 동사는 상황에 대한 정보를 접해 알게 되는 뜻일 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘그의 모든 무리’입니다. 여기서는 그의 지휘 아래 있는 전력 전체를 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘유대에 있는 이들’. 그리스어는 문자적으로 ‘유대에서 온 이들’이라고 되어 있어, 단순한 거주지 표현보다 출신·소속 집단을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγνω
  english_pob_choice: learned of it
  chosen_korean: 그것을 알고
