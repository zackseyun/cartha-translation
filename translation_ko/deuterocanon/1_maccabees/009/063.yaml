  lexicon: BDAG
  rationale: ἐκ의 방향성인 ‘~에서/부터’ 를 살려, 단순한 위치보다 출신·소속의 뉘앙스를 담는 표현을 택했습니다.
- source_word: παρήγγειλεν
  english_pob_choice: he gave orders
  chosen_korean: 명령을 내렸습니다
  alternatives_korean:
  - 지시했습니다
  - 명령했습니다
  - 지시를 내렸습니다
  lexicon: BDAG
  rationale: 군사적 상황에 맞는 지시 행위를 나타내므로, 한국어에서 가장 자연스럽고 분명한 ‘명령을 내리다’로 옮겼습니다.
