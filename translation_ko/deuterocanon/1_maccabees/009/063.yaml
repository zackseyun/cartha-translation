  rationale: 이 동사는 단순한 인지보다 상황을 접하고 알게 된 것을 가리킬 수 있으므로, 문맥의 진행을 살려 ‘그것을 알고’로 옮겼습니다.
- source_word: πᾶν τὸ πλῆθος αὐτοῦ
