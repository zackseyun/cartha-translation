  lexicon: BDAG
  rationale: 직역하면 ‘그의 모든 무리’이지만, 군사적 문맥에서 그의 휘하 집단 전체를 가리키므로 ‘무리’로 두되 ‘모든’을 살려 범위를 유지했습니다.
- source_word: τοῖς ἐκ τῆς Ἰουδαίας
  english_pob_choice: those from Judea
  chosen_korean: 유대에서 온 이들에게
  alternatives_korean:
