    text: 또는 “그들의 악기들의 소리”로도 옮길 수 있습니다. 그리스어 μουσικῶν은 음악가들을 가리킬 수도 있고, 음악 연주나 악기를 가리킬 수도 있습니다.
    reason: lexical_alternative
