  text: And the wedding was turned into mourning[a], and the sound of their musicians into lamentation.
  footnotes:
  - marker: a
    text: Or, 'the sound of their musical instruments.' The Greek μουσικῶν can refer either to musicians or to musical performance/instrumentation.
