  text: 그리고 혼인 잔치가 애도로 변하고, 그들의 음악가들이 내는 소리는 애가로 변했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들의 악기 소리”로 옮길 수 있습니다. 그리스어 μουσικῶν은 음악가들을 가리킬 수도 있고, 음악 연주나 악기를 가리킬 수도 있습니다.
    reason: lexical_alternative
