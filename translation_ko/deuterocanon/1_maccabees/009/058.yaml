  yaml_path: translation/deuterocanon/1_maccabees/009/058.yaml
  text: And all the lawless men took counsel, saying, “Look, Jonathan and those with him are living in peace, confident; so now let us bring Bacchides, and he will seize them all in a single night.”
  footnotes:
  - marker: a
    text: Or 'dwelling quietly, confident.' The Greek combines quiet residence (ἐν ἡσυχίᾳ κατοικοῦσιν) with a participle meaning 'being confident' or 'trusting.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 무법자들이 의논하여 말했습니다. “보십시오, 요나단과 그와 함께 있는 이들은 평온히 살며 확신하고 있습니다.[a] 이제 바키데스를 데려오자. 그러면 그가 하룻밤에 그들을 모두 붙잡을 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “평온히 거주하며 신뢰하고 있습니다.” 그리스어는 ‘조용하고 평온한 거주’(ἐν ἡσυχίᾳ κατοικοῦσιν)와 ‘확신하는/신뢰하는’ 의미의 분사(πεποιθότες)를 함께 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἄνομοι
  english_pob_choice: the lawless men
  chosen_korean: 모든 불법자들
  alternatives_korean:
  - 법 없는 자들
  - 악한 자들
  - 무법자들
  lexicon: LSJ
  rationale: ἄνομοι는 단순한 ‘악한 사람들’보다 법과 질서를 거스르는 집단이라는 공적·도덕적 성격을 강하게 드러내므로, 직역에 가까운 ‘불법자들’을 택했습니다.
- source_word: ἐβουλεύσαντο
  english_pob_choice: took counsel
  chosen_korean: 모의하여
  alternatives_korean:
  - 의논하여
  - 계책을 세워
  - 상의하여
  lexicon: LSJ
  rationale: 중간태는 서로 의논하는 의미를 가지지만, 여기서는 적대적 상황이 분명하므로 한국어에서 자연스럽게 음모적 뉘앙스를 살리는 ‘모의하여’로 옮겼습니다.
- source_word: ἐν ἡσυχίᾳ κατοικοῦσιν πεποιθότες
  english_pob_choice: are living in peace, confident
  chosen_korean: 평안히, 또 확신 가운데 살고 있습니다
  alternatives_korean:
  - 조용히 살고 있으며 자신만만합니다
  - 평온히 살며 확신하고 있습니다
  - 고요히 거주하며 신뢰하고 있습니다
  lexicon: LSJ
  rationale: ‘ἐν ἡσυχίᾳ’의 안정된 거주와 ‘πεποιθότες’의 확신/신뢰를 함께 살리되, 한국어에서는 ‘평안히, 또 확신 가운데’로 병렬해 두 요소를 분명히 드러냈습니다.
- source_word: ἄξομεν τὸν Βακχίδην
  english_pob_choice: let us bring Bacchides
  chosen_korean: 이제 바키데스를 데려오면
  alternatives_korean:
  - 이제 바키데스를 데려오자
  - 이제 바키데스를 불러오면
  - 이제 바키데스를 데려가면
  lexicon: LSJ
  rationale: 본문의 화자들은 바키데스를 자기들 쪽으로 ‘데려오는’ 계획을 말하므로, 군사적 동원감을 과도하게 넣지 않으면서도 구체적인 행위를 드러내는 ‘데려오면’으로 옮겼습니다.
- source_word: συλλήψεται αὐτοὺς πάντας
  english_pob_choice: he will seize them all
  chosen_korean: 그가 그들을 모두 붙잡을 것입니다
  alternatives_korean:
  - 그가 그들을 모두 사로잡을 것입니다
  - 그가 그들 모두를 체포할 것입니다
  - 그가 그들을 모두 잡을 것입니다
  lexicon: LSJ
  rationale: συλλαμβάνω는 ‘붙잡다/사로잡다’의 폭을 가지며, 여기서는 기습 포획의 의미가 적절하므로 법정적 뉘앙스가 강한 ‘체포하다’는 피했습니다.
theological_decisions:
- issue: ‘평안히’와 ‘확신 가운데’의 결합을 어떻게 전달할지
  chosen_reading: 안전한 상태와 내적 확신을 함께 드러내는 병렬 표현으로 옮겼습니다.
  alternative_readings:
  - ‘평안히 살며 확신하고 있습니다’
  - ‘조용히 살며 자신만만합니다’
  rationale: 본문은 단순히 조용히 사는 상태만이 아니라, 그 상태에서 나온 확신까지 함께 묘사하므로 두 요소를 분리해 번역하는 것이 원문의 긴장을 더 잘 보존합니다.
  doctrine_reference: 서사 문맥의 의미 보존 원칙
