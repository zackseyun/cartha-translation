  text: 그날 바키데스 편에서 약 천 명의 사람들이 쓰러졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그날 바키데스의 편에서 약 천 명의 사람들이 쓰러졌습니다.” 그리스어의 παρά는 직접적 행위자보다 바키데스와의 연관이나 소속을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: διέπεσαν
  english_pob_choice: fell
  chosen_korean: 쓰러졌습니다
  alternatives_korean:
  - 죽었습니다
  - 전사했습니다
  - 넘어졌습니다
  lexicon: LSJ
  rationale: 전투 문맥에서 ‘fell’의 전사 의미를 살리되, 한국어에서는 자연스럽고 간결한 ‘쓰러졌습니다’로 옮겼습니다.
- source_word: παρὰ Βακχίδα
  english_pob_choice: beside Bacchides
  chosen_korean: 바키데스 편에서
  alternatives_korean:
  - 바키데스 곁에서
  - 바키데스와 함께
  - 바키데스 쪽에서
  lexicon: LSJ
  rationale: παρά + 대격은 여기서 직접적 행위자보다 ‘~편/측’의 연관을 나타낼 수 있으므로, 바키데스의 진영을 뜻하는 뉘앙스를 살려 ‘편에서’로 옮겼습니다.
- source_word: εἰς χιλίους ἄνδρας
  english_pob_choice: about a thousand men
  chosen_korean: 약 천 명의 사람들
  alternatives_korean:
  - 천 명쯤의 남자들
  - 천 명의 사람들
  lexicon: LSJ
  rationale: εἰς + 수사는 대체로 ‘~에 이르기까지’의 총량을 나타내므로, POB의 ‘about a thousand’에 맞춰 ‘약 천 명’으로 자연스럽게 표현했습니다.
theological_decisions:
- issue: παρὰ Βακχίδα의 관계를 직접적 원인으로 단정할지 여부
  chosen_reading: 바키데스와 연관된 편/진영을 가리키는 표현으로 두고, 직접적 주어-행위 관계는 확정하지 않았습니다.
  alternative_readings:
  - 바키데스에게서 죽었습니다
  - 바키데스의 편에 있던 사람들이 쓰러졌습니다
  rationale: 그리스어 παρά는 여기서 소속·연관의 가능성을 열어 두며, 영어 POB 주석도 직접 원인보다 연관성을 경고합니다. 따라서 본문은 과도한 해석을 피했습니다.
