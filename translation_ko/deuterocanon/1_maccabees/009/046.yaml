translation:
  language: ko
  text: 그러니 이제, 여러분이 우리의 원수들의 손에서 구출받을 수 있도록 하늘을 향해[a] 부르짖으십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님께’. 그리스어는 ‘하늘’이라고 하며, 이는 하나님이나 신적 영역을 공경적으로 가리키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  english_pob_choice: Now then
  chosen_korean: 그러므로 이제
  alternatives_korean:
  - 이제 그러므로
  - 그러니 지금
  lexicon: LSJ
  rationale: 추론적 전환과 긴급성을 함께 나타내므로, 한국어에서는 자연스럽게 이어지는 「그러므로 이제」로 옮겼습니다.
- source_word: κεκράξατε
  english_pob_choice: cry out
  chosen_korean: 부르짖으십시오
  alternatives_korean:
