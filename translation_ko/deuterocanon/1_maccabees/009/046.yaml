  text: Now then[a], cry out to heaven, so that you may be delivered from the hand of our enemies.
  footnotes:
  - marker: a
    text: Or 'to God'; the Greek reads 'to heaven,' using 'heaven' as a reverential way of referring to the divine realm or to God himself.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이제 하늘을 향해 부르짖으십시오. 그래야 여러분이 우리의 원수들의 손에서 구출될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님께’. 그리스어는 ‘하늘’을 사용하며, 이는 하나님이나 신적 영역을 공경적으로 가리키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  english_pob_choice: Now then
  chosen_korean: 그러므로 이제
  alternatives_korean:
  - 이제 그러므로
  - 그러니 지금
  lexicon: LSJ
  rationale: 추론적 전환과 긴급성을 함께 나타내므로, 한국어에서는 자연스럽게 이어지는 「그러므로 이제」로 옮겼습니다.
- source_word: κεκράξατε
  english_pob_choice: cry out
  chosen_korean: 부르짖으십시오
  alternatives_korean:
  - 외치십시오
  - 소리치십시오
  lexicon: LSJ
  rationale: 단순한 큰 소리보다 절박한 간구의 뉘앙스가 있으므로, 간청의 강도를 살리는 「부르짖으십시오」가 적절합니다.
- source_word: εἰς οὐρανόν
  english_pob_choice: to heaven
  chosen_korean: 하늘을 향해
  alternatives_korean:
  - 하늘에
  - 하늘로
  lexicon: LSJ
  rationale: 그리스어는 문자적으로 ‘하늘’이지만, 여기서는 하나님께 드리는 경건한 지시 대상이므로 방향성을 살려 「하늘을 향해」로 옮겼습니다.
- source_word: διασωθῆτε ἐκ χειρὸς ἐχθρῶν ἡμῶν
  english_pob_choice: you may be delivered from the hand of our enemies
  chosen_korean: 여러분이 우리의 원수들의 손에서 구출될 것입니다
  alternatives_korean:
  - 여러분이 우리의 원수들의 손에서 건짐받을 것입니다
  - 여러분이 원수들의 손에서 벗어날 것입니다
  lexicon: LSJ
  rationale: 군사적 위기에서의 구조를 가리키므로, 신학적 ‘구원’보다 상황에 맞는 「구출될 것입니다」가 소스의 의미를 더 직접적으로 반영합니다.
theological_decisions:
- issue: εἰς οὐρανόν의 신학적 완곡어법을 한국어에서 어떻게 유지할지
  chosen_reading: ‘하늘’의 직접 표현을 유지하되, 대상은 하나님께 드리는 부르짖음으로 드러내는 방식
  alternative_readings:
  - 하나님께 부르짖으십시오
  - 주님께 부르짖으십시오
  rationale: 본문은 ‘하늘’이라고 말하며 하나님을 명시하지 않으므로, 그 완곡법을 그대로 살려 소스의 절제를 유지했습니다.
  doctrine_reference: 원문 우선 원칙; 신학적 긴장 보존
