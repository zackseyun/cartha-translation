  - 소리치십시오
  lexicon: LSJ
  rationale: 단순한 큰 소리보다 절박한 간구의 뉘앙스가 있으므로, 간청의 강도를 살리는 「부르짖으십시오」가 적절합니다.
- source_word: εἰς οὐρανόν
  english_pob_choice: to heaven
  chosen_korean: 하늘을 향해
  alternatives_korean:
  - 하늘에
  - 하늘로
  lexicon: LSJ
  rationale: 그리스어는 문자적으로 ‘하늘’이지만, 여기서는 하나님께 드리는 경건한 지시 대상이므로 방향성을 살려 「하늘을 향해」로 옮겼습니다.
- source_word: διασωθῆτε ἐκ χειρὸς ἐχθρῶν ἡμῶν
  english_pob_choice: you may be delivered from the hand of our enemies
  chosen_korean: 여러분이 우리의 원수들의 손에서 구출될 것입니다
  alternatives_korean:
  - 여러분이 우리의 원수들의 손에서 건짐받을 것입니다
  - 여러분이 원수들의 손에서 벗어날 것입니다
  lexicon: LSJ
  rationale: 군사적 위기에서의 구조를 가리키므로, 신학적 ‘구원’보다 상황에 맞는 「구출될 것입니다」가 소스의 의미를 더 직접적으로 반영합니다.
