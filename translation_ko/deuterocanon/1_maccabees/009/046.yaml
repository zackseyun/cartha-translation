  rationale: 본문은 ‘하늘’이라고 말하며 하나님을 명시하지 않으므로, 그 완곡법을 그대로 살려 소스의 절제를 유지했습니다.
  doctrine_reference: 원문 우선 원칙; 신학적 긴장 보존
