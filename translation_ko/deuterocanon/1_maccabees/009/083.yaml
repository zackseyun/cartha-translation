base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/083.yaml
  text: to Azotus[a], and they entered Beth-dagon, their idol temple, to be saved[b]. And Jonathan burned Azotus and the cities around it.
  footnotes:
  - marker: a
    text: Azotus is the Greek name for Ashdod.
    reason: lexical_alternative
  - marker: b
    text: Or possibly, more literally, 'their idol'; the Greek likely refers to the idol sanctuary at Beth-dagon rather than only to a statue.
    reason: lexical_alternative
translation:
  language: ko
  text: 아소돗[a]에 이르러, 그들은 베드다곤으로 들어갔는데, 그것은 그들의 우상 신전이었으며[b], 구원을 얻고자 함이었습니다. 그리고 요나단은 아소돗과 그 둘레의 여러 도시를 불태웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아소돗은 그리스어 지명형이며, 히브리어 지명 아스돗(Ashdod)에 해당합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들의 우상’이지만, 문맥상 베드다곤에 있는 우상 성소/신전을 가리키는 것으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄζωτον
  english_pob_choice: Azotus
  chosen_korean: 아소돗
  alternatives_korean:
  - 아소두스
  - 아스돗
  lexicon: LSJ
  rationale: 그리스어 지명형을 반영하되, 히브리어 대응지명인 아스돗을 각주로 밝혀 독자가 본문 위치를 식별할 수 있게 했습니다.
- source_word: εἰσῆλθον
  english_pob_choice: they entered into
  chosen_korean: 들어갔는데
  alternatives_korean:
  - 들어갔습니다
  - 들어갔습니다
  lexicon: BDAG
  rationale: 단순한 이동 동사를 자연스러운 서술문으로 옮기되, 원문의 진입 방향성을 유지했습니다.
- source_word: τὸ εἴδωλον αὐτῶν
  english_pob_choice: their idol temple
  chosen_korean: 그들의 우상 신전
  alternatives_korean:
  - 그들의 우상
  - 그들의 형상
  - 그들의 우상 성소
  lexicon: LSJ
  rationale: 직역하면 ‘그들의 우상’이지만, 문맥상 베드다곤의 신전/성소를 가리키므로 우상만이 아니라 신전 기능까지 드러내는 표현을 택했습니다.
- source_word: τοῦ σωθῆναι
  english_pob_choice: to be saved
  chosen_korean: 구원을 얻고자 함
  alternatives_korean:
  - 살아남고자 함
  - 피신하고자 함
  - 구출되기 위함
  lexicon: BDAG
  rationale: 여기서는 신학적 ‘구원’이 아니라 전투 상황에서의 보호·탈출 목적이므로, 그 목적성을 살리되 문맥적 안전/구출 의미를 한국어로 자연스럽게 표현했습니다.
- source_word: ἐνεπύρισεν
  english_pob_choice: burned
  chosen_korean: 불태웠습니다
  alternatives_korean:
  - 태웠습니다
  - 불살랐습니다
  - 불을 질렀습니다
  lexicon: LSJ
  rationale: 동사의 강한 소각 의미를 분명히 하면서도, 현대 한국어 서술에서 가장 직접적인 표현을 사용했습니다.
theological_decisions:
- issue: σωθῆναι의 의미 범위
  chosen_reading: 전투적 맥락의 물리적 보호/탈출
  alternative_readings:
