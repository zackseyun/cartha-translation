  text: Ἄζωτον, καὶ εἰσῆλθον εἰς Βηθδαγὼν τὸ εἴδωλον αὐτῶν τοῦ σωθῆναι. καὶ ἐνεπύρισεν Ἰωναθὰν τὴν Ἄζωτον καὶ τὰς πόλεις τὰς κύκλῳ
