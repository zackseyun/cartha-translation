  terminology: ‘아소돗’은 그리스어 Ἄζωτος를 반영하는 음역으로 가능하며, 아스돗 대응 정보는 각주로 충분합니다. ‘베드다곤’도 적절합니다. τὸ εἴδωλον αὐτῶν은 문자적으로 ‘그들의 우상’이지만 문맥상 성소를 가리키는 것으로 이해될 수 있으므로, 본문의 ‘우상 신전’은 유지하되 각주에서 직역과 문맥적 이해를 밝혀야 합니다. σωθῆναι는 신학적 의미보다 피신·생존의 의미로 옮겨야 합니다.
