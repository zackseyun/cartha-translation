  rationale: 본문은 이교 신전으로 피신하는 군사 서사이므로, ‘구원’은 종교적 구원론이 아니라 생존을 위한 피난 목적을 가리킨다고 보아야 합니다.
  doctrine_reference: 문맥 우선 원칙; 구원론적 의미를 본문에 과잉 주입하지 않음
