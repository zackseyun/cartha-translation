  text: And he came and encamped against Bethbasi[a], and fought against it for many days, and made siege engines.
  footnotes:
  - marker: a
    text: Or 'constructed machines'; the Greek term refers to military devices used in a siege.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 와서 베트바시 앞에 진을 치고, 여러 날 동안 그것과 싸우며, 공성 기구들을 만들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기계를 만들었다’로도 옮길 수 있습니다. 여기서 그리스어는 포위전에서 쓰는 군사 장치를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεβάλεν ἐπὶ
  english_pob_choice: encamped against
  chosen_korean: 앞에 진을 치고
  alternatives_korean:
  - 대항하여 진을 치고
  - 맞서 진을 치고
  - 포위하여 진을 치고
  lexicon: LSJ
  rationale: 군사적 맥락의 παρεβάλλω + ἐπί는 대상을 향해 진을 치는 뜻이므로, ‘앞에 진을 치고’로 자연스럽게 옮기되 아직 완전한 포위전으로 과잉 해석하지 않았습니다.
- source_word: Βεθβασί
  english_pob_choice: Bethbasi
  chosen_korean: 베트바시
  alternatives_korean:
  - 벳바시
  - 베스바시
  lexicon: 고유명사 음역
  rationale: 지명을 음역하여 원문 고유성을 살렸고, 현대 한국어 표기 관행에 맞춰 ‘베트바시’로 옮겼습니다.
- source_word: ἐπολέμησεν αὐτήν
  english_pob_choice: fought against it
  chosen_korean: 그것과 싸우며
  alternatives_korean:
  - 그것을 치며
  - 그것과 전쟁을 벌이며
  - 그곳을 공격하며
  lexicon: LSJ
  rationale: 폴레메오의 핵심인 ‘전투하다/싸우다’를 살리면서 대상이 도시를 가리키는 중성 지시대명사임을 반영해 ‘그것과’로 옮겼습니다.
- source_word: ἐποίησεν μηχανάς
  english_pob_choice: made siege engines
  chosen_korean: 공성 기구들을 만들었습니다
  alternatives_korean:
  - 공성 장비들을 만들었습니다
  - 포위 무기들을 만들었습니다
  - 공성 병기를 만들었습니다
  lexicon: LSJ
  rationale: μηχαναί는 포위전에서 쓰는 군사 장치이므로, 영어 POB의 설명을 따라 ‘공성 기구들’로 구체화해 현대 독자가 기능을 이해하도록 했습니다.
theological_decisions:
- issue: 전투 서술의 직설성
  chosen_reading: 문맥의 군사 행위를 완곡하게 낮추지 않고 ‘진을 치고’, ‘싸우며’, ‘공성 기구들을 만들었습니다’로 직접적으로 옮겼습니다.
  alternative_readings:
  - 더 완곡하게 ‘대치하며’로 번역
  - ‘공격했습니다’로 단순화
  rationale: 마카베오기 하권의 역사 서술은 실제 전쟁 행위를 있는 그대로 전달하는 것이 중요하므로, 원문의 군사적 긴장을 유지하는 쪽을 택했습니다.
  doctrine_reference: 역사 서술의 직역 원칙
