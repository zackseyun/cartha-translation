  verdict: revise
  source_fidelity: 원문의 세 개의 부정과거 동사는 연속된 군사 행동을 서술합니다. 초안의 ‘싸우며’는 뒤의 ‘만들었습니다’에 종속되어, 독립된 과거 사건인 ἐπολέμησεν의 서술성을 다소 약화합니다. 또한 장소를 가리키는 여성 목적어 αὐτήν은 한국어에서 ‘그것과’보다 ‘그곳을 상대로’라고 하는 편이 자연스럽습니다.
  naturalness: ‘베트바시 앞에 진을 치고’는 이해되지만, ἐπί의 대항 방향을 ‘베트바시를 향해 진을 치고’로 표현하면 더 자연스럽고 분명합니다. 각 동사를 대등하게 연결한 문장이 현대 표준어 합쇼체 역사 서술에 더 적절합니다.
  terminology: ‘공성 기구들’은 μηχαναί의 군사·포위전 문맥을 적절히 반영합니다. 각주에서 ‘기계’는 현대 한국어에서 지나치게 일반적이므로 ‘장치’라는 대안을 제시하는 것이 정확합니다. ‘베트바시’는 원문의 지명 음역으로 유지할 수 있습니다.
  issues:
  - severity: medium
    issue: ‘그것과 싸우며’가 독립 과거 동사를 종속적 진행 동작처럼 처리함
    rationale: ἐπολέμησεν은 ἐλθών을 제외한 다른 서술 동사들과 마찬가지로 부정과거 직설법입니다. ‘싸웠으며’로 옮겨 사건의 병렬성과 완료된 서술을 보존하는 것이 안전합니다.
  - severity: low
    issue: 장소를 받는 ‘그것과 싸우며’의 한국어 어색함
    rationale: αὐτήν은 베트바시를 가리키지만, 한국어에서는 장소·성읍을 ‘그것과’ 싸운다고 하기보다 ‘그곳을 상대로 싸우다’라고 하는 편이 자연스럽습니다.
  - severity: low
    issue: 각주의 ‘기계’ 대안이 μηχαναί의 군사 장치 의미를 충분히 드러내지 못함
    rationale: 문맥상 μηχαναί는 일반 기계가 아니라 포위전에 쓰는 장치들입니다. ‘장치’로 제시하고 설명에서 군사적 기능을 밝히는 편이 명료합니다.
