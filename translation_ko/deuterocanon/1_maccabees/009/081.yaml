    text: 그리스어 본문은 이 절이 ‘τὴν’에서 중간에 끊기므로, 본 번역도 그 미완성을 그대로 보존했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ὑστήκει
  english_pob_choice: it stood
  chosen_korean: 서 있었습니다
  alternatives_korean:
  - 그대로 있었습니다
  - 멈춰 서 있었습니다
  lexicon: LSJ
  rationale: 주어가 이어진 문맥에서 완전히 분명하지 않으므로, 영어 POB의 모호성을 살려 ‘서 있었습니다’로 옮겨 상태 지속을 자연스럽게 표현했습니다.
- source_word: καθὼς ἐπέταξεν Ἰωναθάν
  english_pob_choice: as Jonathan had commanded
  chosen_korean: 요나단이 명령한 대로
  alternatives_korean:
  - 요나단이 명령한 것처럼
  - 요나단이 지시한 대로
  lexicon: BDAG
  rationale: καθώς의 대응 관계를 한국어의 ‘-한 대로’로 자연스럽게 옮기고, ἐπιτάσσω의 지시/명령 의미는 ‘명령하다’가 가장 सीधे합니다.
- source_word: ἐκοπίασαν
  english_pob_choice: grew weary
  chosen_korean: 지쳤습니다
  alternatives_korean:
  - 피곤해졌습니다
  - 기진맥진했습니다
  lexicon: BDAG
  rationale: 전쟁 서술에서 말들이 점차 소진되는 뉘앙스를 간결하게 살리면서도, ‘기진맥진’보다 과장되지 않게 했습니다.
- source_word: ἐξέλυσεν Σίμων τὴν δύναμιν αὐτοῦ
  english_pob_choice: Simon deployed his force
  chosen_korean: 시몬이 자기 군대를 전개하고
  alternatives_korean:
  - 시몬이 자기 군대를 풀어놓고
  - 시몬이 자기 군대를 내보내고
  lexicon: LSJ
  rationale: ἐξέλυσεν의 문자적 ‘풀어놓다’보다 군사적 문맥에서의 작전 전개를 드러내는 ‘전개하다’가 source-direct이면서도 한국어로 자연스럽습니다.
- source_word: συνῆψεν πρὸς τὴν
  english_pob_choice: joined battle with the
  chosen_korean: 그와 싸움을 시작하였는데…
  alternatives_korean:
  - 그와 전투를 벌였는데…
  - 그와 싸움에 합류하였는데…
  lexicon: LSJ
  rationale: 원문과 영어가 모두 문장이 중간에서 끊기므로, 완료된 전투 결과를 덧붙이지 않고 ‘싸움을 시작하였는데…’로 미완성을 드러냈습니다.
theological_decisions:
- issue: 미완성 절의 처리
  chosen_reading: 원문이 τὴν에서 끊기므로, 한국어도 문장 미완성을 그대로 보존했습니다.
  alternative_readings:
  - 문맥을 보충해 완성형으로 옮김
  - 다른 사본/판본을 따라 이어 붙임
  rationale: 저본의 불완전성을 숨기지 않고, 번역이 아니라 현전하는 증언을 전달해야 한다는 원칙에 맞춥니다.
  doctrine_reference: 텍스트 비평과 번역 윤리
