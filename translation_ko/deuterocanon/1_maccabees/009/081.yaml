  text: 그것은 요나단이 명령한 대로 서 있었습니다[a]. 그리고 그들의 말들은 지쳤습니다. 그때 시몬이 자기 군대를 전개하고 그와 싸움을 시작하였는데…
  philosophy: optimal-equivalence
  footnotes:
