  source_fidelity: 첫 절의 주어는 그리스어에서 명시되지 않았으므로 ‘그것은’으로 불특정성을 유지한 점은 적절합니다. 그러나 마지막의 ‘그와’는 원문에 없는 남성 단수 대상을 보충하며, 원문은 여성 단수 정관사 τὴν에서 중단됩니다. 이 보충은 피해야 합니다.
  naturalness: ‘그것은 … 서 있었습니다’는 선행 문맥 없이 다소 어색하지만, 주어의 불확정성을 보존하는 데 필요한 최소한의 표현으로 수용 가능합니다. 마지막은 생략 부호와 조사 결합을 통해 한국어에서도 중단을 분명히 나타내는 편이 자연스럽고 충실합니다.
  terminology: ‘명령한 대로’, ‘말들’, ‘군대를 전개하여’, ‘전투를 벌였습니다’는 각각 원문의 군사 문맥과 의미 범위에 잘 맞습니다. ‘지쳐 갔습니다’는 ἐκοπίασαν의 피로 누적 의미를 자연스럽게 전달합니다.
