  yaml_path: translation/deuterocanon/1_maccabees/009/002.yaml
  text: And they traveled on the road to Galgala[a], and encamped against Mesaloth in Arbela, and captured it[b], and destroyed many people.
  footnotes:
  - marker: a
    text: The Greek verb rendered 'took it beforehand' (προκατελίβοντο) is uncommon and difficult; it may also be understood as 'seized it first' or more generally 'overran it.'
    reason: lexical_alternative
  - marker: b
    text: Greek literally, 'destroyed many lives of men,' an idiom meaning that many people were killed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 갈갈라로 가는 길을 따라 갔고, 아르벨라에 있는 메살롯 맞은편에 진을 쳤으며, 그것을 선점했고, 많은 사람의 생명을 멸하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 동사 προκατελίβοντο는 드물고 해석이 까다로워, ‘미리 차지했다’ 또는 더 넓게는 ‘앞질러 점거했다’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 문자적으로 ‘많은 사람의 생명들’을 뜻하는 관용구로, 실제 의미는 많은 사람이 죽었다는 것입니다.
    reason: lexical_alternative
