  rationale: 그리스어는 목적어를 생략하지만, 군사적 성읍 문맥상 열리는 대상이 성문임이 분명하므로 한국어에서는 최소한의 보충으로 ‘문을’ 넣어 의미를 분명하게 했습니다.
