  lexicon: LSJ
  rationale: κυριεύω의 ‘지배권을 쥐다/장악하다’라는 힘의 뉘앙스를 살리되, 한국어 군사 서술에서 자연스럽고 ‘captured’보다 덜 협소한 표현을 택했습니다.
