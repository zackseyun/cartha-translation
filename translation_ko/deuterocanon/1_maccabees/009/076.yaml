translation:
  language: ko
  text: 그리고 그들이 두려워하여 성읍 사람들은 문을 열었고, 요나단이 야포를 장악하였습니다. 그리고 아폴로니오스가 듣고,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘열다’의 목적어를 생략합니다. 군사적 성읍 문맥에서는 성문을 가리키는 것으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절은 제공된 사본 증거에서 ‘그리고 아폴로니오스가 듣고, 그리고’에서 끝나므로, 여기서는 미완결성을 그대로 반영했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: φοβηθέντες
