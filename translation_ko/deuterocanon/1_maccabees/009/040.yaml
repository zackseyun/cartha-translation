  yaml_path: translation/deuterocanon/1_maccabees/009/040.yaml
  text: And they rose up against them from the ambush and killed them[a]; and many fell wounded, and the rest fled to the mountain[b], and they took all their equipment.
  footnotes:
  - marker: a
    text: Or 'many fell as casualties.' The Greek τραυματίαι can denote wounded men or battle casualties more broadly.
    reason: lexical_alternative
  - marker: b
    text: Or 'their baggage' or 'their gear.' The Greek σκεύη is a broad term for articles or equipment; here the military setting favors personal or campaign equipment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 매복한 곳에서 일어나 그들을 쳐죽였고[a], 많은 사람이 부상을 입고 쓰러졌으며, 나머지는 산으로 도망하였고[b], 그들의 장비를 모두 빼앗았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘많은 사람이 전상자가 되었다.’ 그리스어 τραυματίαι는 부상자뿐 아니라 더 넓게 전투 중 피해자를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘산지로.’ 그리스어 εἰς τὸ ὄρος는 직역하면 ‘그 산/산으로’이며, 문맥상 산악 지대를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξανέστησαν ἐπʼ αὐτούς
  english_pob_choice: rose up against them
  chosen_korean: 매복한 곳에서 일어나 그들을 쳐
  alternatives_korean:
  - 그들 위로 일어나
  - 그들을 향해 일어나
  lexicon: LSJ
  rationale: ‘일어나’의 동작 이미지를 살리되, 전투 문맥상 단순한 기상이 아니라 공격 개시를 드러내기 위해 ‘쳐’와 결합해 자연스럽게 옮겼습니다.
- source_word: ἀπὸ τοῦ ἐνέδρου
  english_pob_choice: from the ambush
  chosen_korean: 매복한 곳에서
  alternatives_korean:
  - 매복에서
  - 은신한 곳에서
  lexicon: LSJ
  rationale: ἐνέδρα는 ‘매복’이지만, 한국어에서는 장소성을 살린 ‘매복한 곳에서’가 문맥상 더 분명합니다.
- source_word: ἔπεσαν τραυματίαι πολλοί
  english_pob_choice: many fell wounded
  chosen_korean: 많은 사람이 부상을 입고 쓰러졌으며
  alternatives_korean:
  - 많은 사람이 다쳐 쓰러졌으며
  - 많은 사람이 전상자로 쓰러졌으며
  lexicon: LSJ
  rationale: τραυματίαι는 ‘부상당한 사람들’ 또는 더 넓게는 전상자를 가리킬 수 있어, 죽음 여부를 단정하지 않고 ‘부상을 입고 쓰러졌으며’로 옮겼습니다.
- source_word: τὰ σκεύη αὐτῶν
  english_pob_choice: their equipment
  chosen_korean: 그들의 장비를 모두 빼앗았습니다
  alternatives_korean:
  - 그들의 장비를 모두 차지했습니다
  - 그들의 기구를 모두 빼앗았습니다
  lexicon: LSJ
  rationale: 전투 서술에서 σκεύη는 개인 소지품보다 군사 장비·휴대 장구를 뜻하는 폭이 넓어, 문맥에 맞게 ‘장비’로 옮겼습니다.
theological_decisions:
- issue: τραυματίαι πολλοί의 의미 범위
  chosen_reading: ‘많은 사람이 부상을 입고 쓰러졌으며’로 번역해, 사망 여부를 확정하지 않고 전상자의 넓은 의미를 남겼습니다.
  alternative_readings:
  - ‘많은 사람이 죽거나 다쳤으며’
  - ‘많은 전사자가 생겼으며’
  rationale: 그리스어는 부상자/전상자 모두를 포괄할 수 있어, 본문의 전투 결과를 과도하게 좁히지 않는 번역이 원문에 더 충실합니다.
  doctrine_reference: source-text precision
