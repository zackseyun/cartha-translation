  rationale: 무기 종류를 분명히 드러내는 표준 군사어인 ‘투석병’과 ‘궁수’를 택했습니다.
- source_word: πρωταγωνισταὶ πάντες οἱ δυνατοί
  english_pob_choice: all the mighty men were in the front ranks
  chosen_korean: 모든 용사들은 전열에 있었습니다
  alternatives_korean:
  - 모든 ძლ한 자들은 전열에 있었습니다
  - 모든 용사들은 선두에 있었습니다
  lexicon: LSJ
  rationale: πρωταγωνισταί는 이 문맥에서 전열을 이루는 선봉 병력을 가리키므로, POB의 해석을 따라 ‘전열’로 옮기고 δυνατοί는 전투적 뉘앙스가 있는 ‘용사들’로 처리했습니다.
