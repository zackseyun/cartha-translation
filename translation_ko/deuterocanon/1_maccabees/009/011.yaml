  rationale: δύναμις는 여기서 전투 편제의 군대를 가리키므로 ‘군대’로 옮기고, παρεμβολή는 군사적 ‘진영’이 자연스럽습니다.
- source_word: ἔστησαν εἰς συνάντησιν αὐτοῖς
