  rationale: 직역의 ‘서다’보다 전투 상황에서의 대치와 맞섬을 드러내기 위해 ‘맞서려고 나아가다’로 옮겼습니다.
- source_word: ἡ ἵππος
  english_pob_choice: the cavalry
  chosen_korean: 기병
  alternatives_korean:
