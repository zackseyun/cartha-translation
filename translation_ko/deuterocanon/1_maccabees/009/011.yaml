  text: And the force moved out from the camp and took their stand to meet them[a], and the cavalry was divided into two parts, and the slingers and the archers went before the force, and all the mighty men were in the front ranks.
  footnotes:
  - marker: a
    text: Or 'all the mighty men were the front-line fighters.' The Greek phrase καὶ οἱ πρωταγωνισταὶ πάντες οἱ δυνατοί is compressed, and 'πρωταγωνισταί' likely refers to those fighting in the foremost position.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 군대는 진영에서 떠나 그들과 맞서려고 나아갔으며, 기병은 두 부대로 나뉘었고, 투석병들과 궁수들은 군대보다 앞서 나갔으며, 모든 용사들은 전열에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 용사들은 전열에서 싸우는 병사들이었다.’ 그리스어 구문 καὶ οἱ πρωταγωνισταὶ πάντες οἱ δυνατοί는 압축되어 있으며, πρωταγωνισταί는 아마도 가장 앞선 위치에서 싸우는 이들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆρεν ἡ δύναμις ἀπὸ τῆς παρεμβολῆς
  english_pob_choice: the force moved out from the camp
  chosen_korean: 군대는 진영에서 떠나
