  lexicon: LSJ
  rationale: δύναμις는 여기서 전투 편제의 군대를 가리키므로 ‘군대’로 옮기고, παρεμβολή는 군사적 ‘진영’이 자연스럽습니다.
- source_word: ἔστησαν εἰς συνάντησιν αὐτοῖς
  english_pob_choice: took their stand to meet them
  chosen_korean: 그들과 맞서려고 나아갔으며
  alternatives_korean:
  - 그들을 맞으려고 자리를 잡았으며
  - 그들과 만나려고 진을 쳤으며
  lexicon: LSJ
  rationale: 직역의 ‘서다’보다 전투 상황에서의 대치와 맞섬을 드러내기 위해 ‘맞서려고 나아가다’로 옮겼습니다.
- source_word: ἡ ἵππος
  english_pob_choice: the cavalry
  chosen_korean: 기병
  alternatives_korean:
  - 마병
  - 말 부대
  lexicon: LSJ
  rationale: 군사 문맥에서 ἵππος는 집합적으로 ‘기병’을 뜻하므로, 현대 한국어 군사용어에 맞게 간결하게 처리했습니다.
- source_word: σφενδονῆται καὶ οἱ τοξόται
  english_pob_choice: the slingers and the archers
  chosen_korean: 투석병들과 궁수들은
  alternatives_korean:
  - 돌팔매병들과 활잡이들은
  - 슬링병들과 궁병들은
  lexicon: LSJ
  rationale: 무기 종류를 분명히 드러내는 표준 군사어인 ‘투석병’과 ‘궁수’를 택했습니다.
- source_word: πρωταγωνισταὶ πάντες οἱ δυνατοί
  english_pob_choice: all the mighty men were in the front ranks
  chosen_korean: 모든 용사들은 전열에 있었습니다
  alternatives_korean:
  - 모든 ძლ한 자들은 전열에 있었습니다
  - 모든 용사들은 선두에 있었습니다
  lexicon: LSJ
  rationale: πρωταγωνισταί는 이 문맥에서 전열을 이루는 선봉 병력을 가리키므로, POB의 해석을 따라 ‘전열’로 옮기고 δυνατοί는 전투적 뉘앙스가 있는 ‘용사들’로 처리했습니다.
theological_decisions:
- issue: 전투 진술의 압축된 마지막 구절 해석
  chosen_reading: ‘모든 용사들은 전열에 있었습니다’로 옮겨, δυνατοί가 단순한 ‘강한 사람들’이 아니라 전투에서 앞자리를 맡은 정예 병력을 가리킨다는 점을 살렸습니다.
  alternative_readings:
  - ‘모든 강한 사람들은 전열에 있었습니다’
  - ‘모든 용사들은 선두에 있었습니다’
  rationale: 본문은 짧게 압축되어 있어, POB가 제시한 해석 가능성을 반영하되 한국어에서는 전열 배치를 분명히 드러내는 쪽이 본문의 군사적 긴장을 더 잘 전달합니다.
  doctrine_reference: source-critical / military narrative
