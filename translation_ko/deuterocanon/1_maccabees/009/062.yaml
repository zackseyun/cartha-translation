  yaml_path: translation/deuterocanon/1_maccabees/009/062.yaml
  text: And Jonathan and Simon and those with them withdrew to Beth-basi in the wilderness[b][a], and rebuilt its ruins and fortified it.
  footnotes:
  - marker: a
    text: 'Greek: ''those with him.'' The translation uses ''those with them'' because the sentence names both Jonathan and Simon as the leading subjects, and English idiom naturally treats the accompanying group as attached to both.'
    reason: lexical_alternative
  - marker: b
    text: Or 'built what had been torn down there' or 'restored its ruins.'
    reason: alternative_reading
translation:
  language: ko
  text: 그때 요나단과 시몬과 그와 함께한 이들이 광야에 있는 베트바시로 물러갔습니다. 그리고 그는 그곳의 허물어진 부분들을 다시 세우고 그곳을 요새화하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘그와 함께한 이들’에서 단수 ‘그’를 쓰며, 이어지는 ‘다시 세우고’와 ‘요새화하였습니다’도 단수 동사로 씁니다. 이 ‘그’가 누구를 가리키는지는 문맥상 요나단일 가능성이 있으나, 본문은 여기서 이름을 다시 밝히지 않습니다.
    reason: source_grammar_and_ambiguity
