  yaml_path: translation/deuterocanon/1_maccabees/009/062.yaml
  text: And Jonathan and Simon and those with them withdrew to Beth-basi in the wilderness[b][a], and rebuilt its ruins and fortified it.
  footnotes:
  - marker: a
    text: 'Greek: ''those with him.'' The translation uses ''those with them'' because the sentence names both Jonathan and Simon as the leading subjects, and English idiom naturally treats the accompanying group as attached to both.'
    reason: lexical_alternative
  - marker: b
    text: Or 'built what had been torn down there' or 'restored its ruins.'
    reason: alternative_reading
translation:
  language: ko
  text: 그때 요나단과 시몬과 그들과 함께한 이들이 광야에 있는 베트바시에 물러가서, 그 무너진 곳들을 다시 세우고 그곳을 견고하게 하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξεχώρησεν
  english_pob_choice: withdrew
  chosen_korean: 물러가서
  alternatives_korean:
  - 떠나서
  - 후퇴하여
  - 가서
  lexicon: LSJ
  rationale: 전투·위기 문맥에서 단순한 이동보다 위험을 피하며 자리를 옮기는 뜻을 살려 ‘물러가서’로 옮겼습니다.
- source_word: οἱ μετʼ αὐτοῦ
  english_pob_choice: those with them
  chosen_korean: 그들과 함께한 이들
  alternatives_korean:
  - 그와 함께한 이들
  - 그 일행
  - 그들을 따르던 이들
  lexicon: LSJ
  rationale: 그리스어는 단수 대명사를 쓰지만, 문맥상 요나단과 시몬이 공동 주어이므로 한국어에서는 자연스럽게 공동체 전체를 ‘그들과 함께한 이들’로 나타냈습니다.
- source_word: τὰ καθηρημένα αὐτῆς
  english_pob_choice: its demolished parts
  chosen_korean: 그 무너진 곳들
  alternatives_korean:
  - 그 무너진 부분들
  - 그 허물어진 것들
  - 그 폐허
  lexicon: LSJ
  rationale: καθηρημένα는 ‘무너뜨린/헐어버린 것들’의 복수 중성형이므로, 단일한 ‘폐허’보다 파괴된 부분들을 가리키는 복수 감각을 살렸습니다.
- source_word: ἐστερέωσεν
  english_pob_choice: fortified
  chosen_korean: 견고하게 하였습니다
  alternatives_korean:
  - 요새화하였습니다
  - 굳게 하였습니다
  - 튼튼하게 하였습니다
  lexicon: LSJ
  rationale: 성곽 방어를 암시하지만, 한국어에서 과도하게 군사 기술화하지 않도록 ‘견고하게 하다’로 번역하되 방어 강화의 뜻을 유지했습니다.
