- source_word: τὰ καθηρημένα αὐτῆς
  english_pob_choice: its demolished parts
  chosen_korean: 그 무너진 곳들
  alternatives_korean:
  - 그 무너진 부분들
  - 그 허물어진 것들
  - 그 폐허
  lexicon: LSJ
  rationale: καθηρημένα는 ‘무너뜨린/헐어버린 것들’의 복수 중성형이므로, 단일한 ‘폐허’보다 파괴된 부분들을 가리키는 복수 감각을 살렸습니다.
