  - 굳게 하였습니다
  - 튼튼하게 하였습니다
  lexicon: LSJ
  rationale: 성곽 방어를 암시하지만, 한국어에서 과도하게 군사 기술화하지 않도록 ‘견고하게 하다’로 번역하되 방어 강화의 뜻을 유지했습니다.
