translation:
  language: ko
  text: 그들의 진영에서 땅이 흔들렸고, 전투는 아침부터 저녁까지 치열하게 이어졌습니다.
  philosophy: formal
lexical_decisions:
- source_word: ἀπὸ τῶν παρεμβολῶν αὐτῶν
  english_pob_choice: from their encampments
  chosen_korean: 그들의 진영에서
  alternatives_korean:
  - 그들의 진영들에서
  - 그들의 진지에서
  lexicon: παρεμβολή
  rationale: παρεμβολή는 군사적 ‘진영/진지’의 뜻이 자연스럽기 때문에, 위치 출발점을 살리면서도 한국어에서 문맥상 가장 직접적인 ‘그들의 진영에서’로 옮겼습니다.
- source_word: ἐσείσθη ἡ γῆ
  english_pob_choice: the earth shook
  chosen_korean: 땅이 흔들렸고
  alternatives_korean:
  - 땅이 진동했고
  - 땅이 흔들렸습니다
  lexicon: σείω
  rationale: 지면의 물리적 요동을 직역에 가깝게 전달하기 위해 ‘흔들렸고’를 선택했습니다.
- source_word: ἐγένετο ὁ πόλεμος συνηγμένος
  english_pob_choice: the battle raged
  chosen_korean: 전투는 … 치열하게 이어졌습니다
  alternatives_korean:
  - 전투가 격렬하게 벌어졌습니다
  - 전투가 맹렬히 계속되었습니다
  lexicon: πόλεμος + συνηγμένος
  rationale: 직역하면 ‘전투가 모여 있었다’가 되지만, 영어 POB의 ‘raged’는 전투의 격렬한 지속을 해석한 것이므로, 그 힘을 살리되 한국어로 자연스럽게 ‘치열하게 이어졌습니다’로 표현했습니다.
- source_word: ἀπὸ πρωΐθεν ἕως ἑσπέρας
  english_pob_choice: from morning until evening
  chosen_korean: 아침부터 저녁까지
  alternatives_korean:
  - 새벽부터 저녁까지
  - 아침부터 해질 무렵까지
  lexicon: time expression
  rationale: 시간 범위를 그대로 살려 하루 전체의 지속성을 분명히 하기 위해 가장 직관적인 표준어 표현을 사용했습니다.
