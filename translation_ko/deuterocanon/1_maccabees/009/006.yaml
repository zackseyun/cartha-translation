  lexicon: LSJ
  rationale: σφόδρα의 강한 강조를 살리면서도 현대 한국어에서 자연스러운 서술로 옮겼습니다.
- source_word: ἐξερρύησαν
  english_pob_choice: fled from the camp
  chosen_korean: 진영에서 빠져나갔고
  alternatives_korean:
