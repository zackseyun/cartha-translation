  lexicon: LSJ
  rationale: πλῆθος의 ‘무리/많은 수’와 δυνάμεις의 군사적 ‘병력/군대’를 함께 살려, 단순한 숫자보다 압도적인 병력의 규모를 드러내도록 했습니다.
- source_word: ἐφοβήθησαν σφόδρα
