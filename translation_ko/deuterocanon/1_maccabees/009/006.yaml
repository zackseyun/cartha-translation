  text: And they saw the multitude of the forces[a], that they were many, and they were greatly afraid; and many fled from the camp, and none of them were left except eight hundred men.
  footnotes:
  - marker: a
    text: Or 'fled away from the camp.' The Greek verb can suggest either slipping away or fleeing off.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 대군을 보고 그 수가 매우 많았기 때문에 몹시 두려워하였습니다. 많은 사람이 진영에서 빠져나갔으며[a], 그들 가운데 남은 사람은 팔백 명뿐이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “진영에서 달아났으며.” 그리스어 동사는 진영에서 흘러나가듯 빠져나가거나 달아나는 것을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πλῆθος τῶν δυνάμεων
  english_pob_choice: the multitude of the forces
  chosen_korean: 군대의 무리
  alternatives_korean:
