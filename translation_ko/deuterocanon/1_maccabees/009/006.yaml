  text: 그들은 군대의 무리를 보고 그들이 많음을 알고 몹시 두려워하였으며, 많은 사람이 진영에서 빠져나갔고, 그들 가운데 남은 사람은 팔백 명뿐이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πλῆθος τῶν δυνάμεων
  english_pob_choice: the multitude of the forces
  chosen_korean: 군대의 무리
  alternatives_korean:
  - 군대의 많은 수
  - 병력의 대무리
