  lexicon: LSJ
  rationale: 이 동사는 ‘흘러나가다/미끄러져 나오다’의 뉘앙스가 있어, POB의 영어 해석처럼 단순한 질주보다 무리에서 빠져나가는 느낌을 살렸습니다.
- source_word: παρεμβολῆς
  english_pob_choice: camp
  chosen_korean: 진영
  alternatives_korean:
  - 캠프
  - 야영지
  - 진지
  lexicon: LSJ
  rationale: 군사 문맥의 παρεμβολή를 한국어 성서 문체에서 자연스러운 ‘진영’으로 옮겼습니다.
