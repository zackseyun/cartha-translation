translation:
  language: ko
  text: 형제여, 당신의 형 유다께서 죽은 이후로는 그와 같은 사람이 없어서, 나가서 원수들과 바키데스를 대적하고 우리 민족을 미워하는 자들을 맞설 수가 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘바키데스’ 뒤의 구문이 다소 어색합니다(직역하면 ‘그리고 우리 민족을 미워하는 자들 안에서/가운데’). 번역은 문맥상 분명한 뜻, 곧 또 다른 적대 집단을 가리키는 것으로 옮겼습니다.
    reason: lexical_alternative
