  rationale: ἀδελφός는 친족 관계를 뜻하지만, 문맥상 대화 상대에게 드리는 호칭으로는 ‘형’이 가장 자연스럽고, 이미 확립된 1마카베오기 인명 관용형 ‘유다’를 썼습니다.
- source_word: τετελεύτηκεν
