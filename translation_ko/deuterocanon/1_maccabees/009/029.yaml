  lexicon: LSJ
  rationale: 완료 시상의 결과 상태를 살리면서도 한국어 문장 안에서 매끄럽게 연결되도록 ‘죽은’으로 옮겼습니다.
- source_word: ἐξελθεῖν πρὸς τοὺς ἐχθροὺς καὶ Βακχίδην, καὶ ἐν τοῖς ἐχθαίνουσιν τοῦ ἔθνους ἡμῶν
  english_pob_choice: to go out against the enemies and Bacchides, and those who hate our nation
  chosen_korean: 나가서 원수들과 바키데스를 대적하고 우리 민족을 미워하는 자들을 맞설 수가 없습니다
  alternatives_korean:
  - 나가서 원수들과 바키데스를 치고 우리 민족을 미워하는 자들을 대적할 수가 없습니다
  - 나가서 원수들과 바키데스를 상대하고 우리 민족을 미워하는 자들을 맞설 수가 없습니다
  lexicon: LSJ
  rationale: ἐξελθεῖν πρὸς는 군사적 ‘나가서 맞서다’로, ἐχθροί는 ‘원수들’로, Βακχίδην은 음역 ‘바키데스’로, ἐχθαίνουσιν은 현재 분사로 지속적 적대성을 나타내어 ‘미워하는 자들’로 옮겼습니다. POB의 문맥 판단을 따라 마지막 대상을 별도의 적대 집단으로 자연스럽게 드러냈습니다.
- source_word: ἔθνος ἡμῶν
  english_pob_choice: our nation
  chosen_korean: 우리 민족
  alternatives_korean:
  - 우리 나라
  - 우리 백성
  - 우리 민족 공동체
  lexicon: LSJ
  rationale: 마카베오기에서 ἔθνος는 이스라엘의 민족적·정치적 공동체를 가리키므로, ‘나라’보다 집단성을 살리는 ‘민족’이 더 적절합니다.
theological_decisions:
- issue: 적대 대상을 어떻게 재구성할 것인가
  chosen_reading: ‘원수들과 바키데스’와 ‘우리 민족을 미워하는 자들’을 병렬된 두 적대 집단으로 읽어 번역했습니다.
  alternative_readings:
  - ‘원수들과 바키데스, 그리고 우리 민족을 미워하는 자들’로 직역
  - ‘원수들과 바키데스와 우리 민족을 미워하는 자들’로 한 덩어리로 처리
  rationale: 그리스어의 ἐν τοῖς ἐχθαίνουσιν은 직역하면 다소 비정상적이지만, 문맥상 대항해야 할 또 다른 적대 집단을 가리키는 것으로 읽는 것이 의미를 가장 충실히 전달합니다.
