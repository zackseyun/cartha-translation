translation:
  language: ko
  text: 그리고 왼쪽 날개에 있던 자들은 오른쪽 날개가 무너진 것을 보고, 유다와 그와 함께한 사람들의 뒤를 바짝 따라 돌아섰습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘왼쪽 뿔’과 ‘오른쪽 뿔’이지만, 여기서는 군사적으로 ‘날개’ 또는 ‘측면’을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘유다와 그와 함께한 사람들의 뒤를 발꿈치처럼 바짝 따르며, 뒤에서’라는 뜻으로, 후방 추격을 나타내는 관용구입니다.
    reason: lexical_alternative
