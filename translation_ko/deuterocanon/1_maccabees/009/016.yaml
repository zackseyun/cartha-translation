  text: 그리고 왼쪽 부대에 있던 사람들은 오른쪽 부대가 격파된 것을 보고, 돌아서서 유다와 그와 함께한 사람들을 뒤에서 바짝 추격했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘왼쪽 뿔’과 ‘오른쪽 뿔’입니다. 여기서 ‘뿔’은 군대의 왼쪽과 오른쪽 날개, 곧 측면 부대를 가리키는 군사 용어입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘유다와 그와 함께한 사람들의 발뒤꿈치에 맞추어, 뒤에서’입니다. 뒤에서 바짝 뒤쫓는다는 뜻의 표현입니다.
    reason: lexical_alternative
