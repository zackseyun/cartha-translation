  - 그가 기병이 많아서 그것을 신뢰했기 때문입니다
  lexicon: LSJ
  rationale: 원문의 이유절을 그대로 살리며, 대명사 αὐτήν의 지시 대상을 굳이 좁히지 않고 ‘그것’으로 보존했습니다.
theological_decisions:
- issue: 마카베오서의 군사 서술에서 기만적 행진을 어떻게 드러낼지
  chosen_reading: ‘마치 지나가는 듯이’로 옮겨, 단순한 이동이 아니라 외양상 속임수의 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘그저 지나가는 것처럼’
  - ‘지나가는 체하며’
  rationale: ὡς διοδεύων은 실제 목적과 외형이 어긋나는 표현이므로, 평이하지만 기만성을 유지하는 번역이 본문의 의도를 더 잘 드러냅니다.
  doctrine_reference: source semantics and narrative intent
