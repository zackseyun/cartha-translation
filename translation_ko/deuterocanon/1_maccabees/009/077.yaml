- source_word: διὰ τὸ ἔχειν αὐτὸν πλῆθος ἵππου καὶ πεποιθέναι ἐπʼ αὐτήν
  english_pob_choice: because he had a multitude of cavalry and trusted in it
  chosen_korean: 그가 많은 기병을 거느리고 그것을 믿었기 때문입니다
