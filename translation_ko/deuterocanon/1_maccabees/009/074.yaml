base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/074.yaml
  text: When Jonathan heard the words of Apollonius[a], he was stirred in his mind, and he chose ten thousand men and went out from Jerusalem; and Simon his brother met him to help him.
  footnotes:
  - marker: a
    text: 'Greek literally, ''met him for his help.'' The rendering ''joined him to help him'' brings out the likely sense in context: Simon came to support Jonathan rather than merely to encounter him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 요나단은 아폴로니우스의 말을 듣고 마음이 동요되어, 만 명을 뽑아 예루살렘에서 나갔습니다. 그리고 그의 형제 시몬은 요나단을 돕기 위해 그를 만났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어는 문자적으로 ‘그를 돕기 위해 그를 만났다’는 뜻입니다. 문맥상 시몬이 단순히 조우한 것이 아니라 요나단을 지원하려고 만난 것으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκινήθη τῇ διανοίᾳ
  english_pob_choice: he was stirred in his mind
  chosen_korean: 마음이 동요되어
  alternatives_korean:
  - 마음이 흔들려
  - 생각이 자극되어
  - 속이 동요되어
  lexicon: LSJ
  rationale: διανοία를 단순한 감정이 아니라 내면의 사고·마음 영역으로 보고, ‘동요되어’로 자연스럽게 옮겨 정신적 동요를 살렸습니다.
- source_word: ἐπέλεξεν δέκα χιλιάδας ἀνδρῶν
  english_pob_choice: he chose ten thousand men
  chosen_korean: 만 명을 뽑아
  alternatives_korean:
  - 만 명의 남자들을 뽑아
  - 만 명을 선택하여
  - 만 명의 사람들을 뽑아
  lexicon: LSJ
  rationale: ἀνδρῶν의 문자적 의미를 고려하되 한국어에서는 군사적 문맥에서 ‘만 명을 뽑다’가 자연스럽고, 원문의 수량감을 유지합니다.
- source_word: ἐξῆλθεν ἐξ Ἱερουσαλήμ
  english_pob_choice: went out from Jerusalem
  chosen_korean: 예루살렘에서 나갔습니다
  alternatives_korean:
  - 예루살렘에서 떠났습니다
  - 예루살렘을 나섰습니다
  - 예루살렘에서 출발했습니다
  lexicon: LSJ
  rationale: 원문의 단순한 이동 표현을 유지하되, 현대 한국어에서 가장 직접적인 ‘나갔습니다’로 옮겼습니다.
- source_word: συνήντησεν αὐτῷ ἐπὶ βοήθειαν αὐτοῦ
  english_pob_choice: met him to help him
  chosen_korean: 그를 도우려고 그를 만나러 왔습니다
  alternatives_korean:
  - 그를 도우려고 그와 만났습니다
  - 그를 돕기 위해 그에게 합류했습니다
  - 그를 돕기 위해 그를 만났습니다
  lexicon: LSJ
  rationale: POB가 지적한 것처럼 συνήντησεν은 단순한 ‘만남’보다 도움을 위한 합류의 의미가 강하므로, ‘만나러 왔습니다’와 ‘도우려고’를 함께 써서 기능적 의미를 드러냈습니다.
theological_decisions:
- issue: 형제 시몬의 동작을 단순 면담이 아니라 지원 행위로 번역할지
  chosen_reading: ‘그를 도우려고 그를 만나러 왔습니다’로 옮겨, 합류와 지원의 목적을 함께 드러냈습니다.
  alternative_readings:
  - 그를 만났습니다
  - 그에게 합류했습니다
  rationale: 본문의 ἐπὶ βοήθειαν αὐτοῦ가 목적을 분명히 하므로, 단순한 조우로 약화하지 않고 지원의 의도를 분명히 표현했습니다.
  doctrine_reference: 문맥상 서술적 정확성
