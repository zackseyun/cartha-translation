  yaml_path: translation/deuterocanon/1_maccabees/009/070.yaml
  text: And Jonathan learned of it[b][a], and sent ambassadors to him to make peace with him and to return the captives to them.
  footnotes:
  - marker: a
    text: Or 'envoys' for 'ambassadors.' The Greek term denotes official diplomatic representatives.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the captivity'; here it refers to the people who had been taken captive, hence 'the captives.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 요나단은 그 소식을 알고, 그에게 사절들을 보내어 그와 평화를 맺고 포로들을 그들에게 돌려보내게 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사절들’은 공식적 외교 대표를 가리키는 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘포로 상태’이지만, 여기서는 사로잡힌 사람들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  english_pob_choice: learned of it
  chosen_korean: 그 소식을 알고
  alternatives_korean:
  - 알게 되고
  - 그 일을 듣고
  - 알아차리고
  lexicon: LSJ
  rationale: aorist of γινώσκω가 새 소식을 접해 알게 됨을 나타내므로, 단순한 ‘알다’보다 사건성을 살린 표현을 택했습니다.
- source_word: πρέσβεις
  english_pob_choice: ambassadors
  chosen_korean: 사절들
  alternatives_korean:
  - 외교 사절들
  - 사신들
  - 외교관들
  lexicon: LSJ
  rationale: 공식적 대표를 가리키지만 현대 한국어에서 ‘ambassadors’의 외교적 격식을 직접 살리되, 성경 문맥에 맞게 과도한 현대 외교 용어는 피했습니다.
- source_word: τοῦ συνθέσθαι ... εἰρήνην
  english_pob_choice: to make peace
  chosen_korean: 평화를 맺고
  alternatives_korean:
  - 평화를 이루고
  - 화친을 맺고
  - 평화 협정을 맺고
  lexicon: LSJ
  rationale: 목적을 나타내는 부정사 구문을 자연스러운 한국어로 옮기면서, ‘평화’를 직접 목적어로 취하는 동사의 결합을 유지했습니다.
- source_word: τὴν αἰχμαλωσίαν
  english_pob_choice: the captives
  chosen_korean: 포로들
  alternatives_korean:
  - 포로 상태
  - 포로의 무리
  - 사로잡힌 사람들
  lexicon: LSJ
  rationale: 직역하면 ‘포로 상태’이지만 문맥상 실제로 돌려보내는 대상은 사람들입니다. 따라서 POB의 해석을 따라 구체적 대상인 ‘포로들’로 옮겼습니다.
theological_decisions:
- issue: 사절/외교 대표의 성격
  chosen_reading: 전쟁 상황 속에서도 정식 대표를 보내 평화를 교섭하는 정치·외교적 행동으로 읽었습니다.
  alternative_readings:
  - 단순한 심부름꾼으로 읽을 수 있음
  - 일반적인 전달인으로 약화시킬 수 있음
  rationale: πρέσβεις는 단순 전달자가 아니라 공식 대표를 뜻하므로, 본문의 외교적 긴장을 약화시키지 않도록 했습니다.
  doctrine_reference: 본문 맥락 주해
