revisions:
- from: 그리고 요나단은 그 소식을 알고, 그에게 사절들을 보내어 그와 평화를 맺고 포로들을 그들에게 돌려보내게 하였습니다.[a][b]
  to: 그리고 요나단은 그 소식을 알게 되자, 그에게 사절들을 보내어 그와 평화를 맺고 포로들을 그들에게 돌려주기 위해 하였습니다.[a][b]
  rationale: '사동 표현을 제거하고 목적을 나타내는 ‘…하기 위해’로 바꾸어 τοῦ συνθέσθαι … καὶ ἀποδοῦναι의 기능을 보존했습니다. 또한 ἔγνω의 새로 알게 됨을 ‘알게 되자’로 반영했습니다. 다만 수정문 중 ‘돌려주기 위해 하였습니다’는 한국어 결합상 부자연스러울 수 있으므로, 최종 문장은 아래처럼 ‘보냈습니다’로 종결하는 것이 안전합니다: ‘그리고 요나단은 그 소식을 알게 되자, 그에게 사절들을 보내어 그와 평화를 맺고 포로들을 그들에게 돌려주도록 하였습니다.’ 그러나 이는 다시 사동 뉘앙스를 낳습니다. 따라서 가장 자연스럽고 충실한 완성문은 ‘그리고 요나단은 그 소식을 알게 되자, 그와 평화를 맺고 포로들을 그들에게 돌려주기 위해 그에게 사절들을 보냈습니다.[a][b]’입니다.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:40:13Z'
