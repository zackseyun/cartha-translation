  source_fidelity: 수정이 필요합니다. 초안의 ‘돌려보내게 하였습니다’는 ἀποδοῦναι(돌려주다/돌려보내다)의 목적 부정사를 사동 표현으로 바꾸어, 요나단이 사절들에게 그 일을 시켰다는 뜻을 불필요하게 덧붙입니다. ‘…하기 위해’로 옮기면 사절 파견의 목적을 충실히 보존하며, 누가 실제 반환을 수행하는지에 관한 그리스어의 문맥적 여지를 과도하게 확정하지 않습니다.
  naturalness: ‘그 소식을 알고’도 이해되지만, 여기의 ἔγνω는 새 사실을 알게 된 사건을 나타내므로 ‘그 소식을 알게 되자’가 현대 한국어에서 더 자연스럽고 정확합니다. ‘평화를 맺다’와 ‘포로들을 그들에게 돌려주다’는 자연스럽고 격식에 맞습니다.
  terminology: ‘사절들’은 πρέσβεις의 외교적 대표성을 적절히 나타냅니다. ‘포로들’은 τὴν αἰχμαλωσίαν의 집합적·구체적 용법을 문맥에 맞게 전달합니다. 수령자 αὐτοῖς는 선행 대상을 명시하지 않고 ‘그들에게’로 유지해야 합니다.
