translation:
  language: ko
  text: 그리고 바키데스는 불경한 사람들을 골라 그들을 그 땅의 통치자로 세웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅의 주인들.’ 그리스어는 문자적으로 ‘주인들’ 또는 ‘주들’에 해당하는 표현을 쓰지만, 여기서는 아마 정치적 통치자를 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέλεξεν
  english_pob_choice: chose
  chosen_korean: 골라
  alternatives_korean:
  - 선택하여
  - 뽑아
  lexicon: LSJ
  rationale: 아오리스트의 단순한 선택 행위를 자연스럽게 옮기되, 정치적 임명 앞의 선별이라는 느낌을 살리기 위해 ‘골라’로 번역했습니다.
- source_word: τοὺς ἀσεβεῖς ἄνδρας
  english_pob_choice: wicked men
  chosen_korean: 불경한 사람들
  alternatives_korean:
  - 악한 사람들
  - 경건하지 않은 사람들
  - 악인들
  lexicon: LSJ
  rationale: ἀσεβεῖς는 단순한 도덕 악보다 ‘불경함/경건하지 않음’의 종교적 색채가 강하므로, 정치적 맥락에서도 그 긴장을 살려 ‘불경한 사람들’로 옮겼습니다.
- source_word: κατέστησεν
  english_pob_choice: appointed
  chosen_korean: 세웠습니다
  alternatives_korean:
  - 임명했습니다
  - 배치했습니다
  - 설정했습니다
  lexicon: LSJ
  rationale: 사람을 어떤 지위에 ‘세우다’라는 한국어가 임명과 설치의 의미를 함께 담아, 문맥상 권력 부여를 자연스럽게 전달합니다.
- source_word: κυρίους τῆς χώρας
  english_pob_choice: rulers over the land
  chosen_korean: 그 땅의 통치자로
  alternatives_korean:
  - 그 땅의 주인으로
  - 그 땅의 지배자로
  - 그 땅의 군주로
  lexicon: LSJ
  rationale: κυρίους의 문자적 ‘주인/주인들’ 의미를 그대로 살리면 한국어에서 사유 재산의 뉘앙스가 강해지므로, 영어 POB의 주석 취지에 맞게 정치적 권위의 기능을 드러내는 ‘통치자’로 옮겼습니다.
theological_decisions:
- issue: κυρίους의 직역 가능성과 정치적 기능 의미
  chosen_reading: ‘주인/주들’의 문자성을 보존하기보다, 본문이 가리키는 통치 권한을 드러내는 번역을 채택했습니다.
  alternative_readings:
  - 그 땅의 주인으로
  - 그 땅의 주들로
  rationale: 영어 POB도 각주에서 ‘lords of the land’의 문자 의미와 정치적 통치 의미를 구분해 설명하므로, 본문에는 이해 가능한 기능적 번역을 두고 문자성은 주석으로 처리하는 편이 본문 이해에 더 유익합니다.
  doctrine_reference: 번역학적 판단; 본문 의미의 명료화
