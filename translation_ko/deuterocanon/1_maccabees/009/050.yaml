translation:
  language: ko
  text: 그들은 예루살렘으로 돌아와 유대에 견고한 성읍들을 세웠습니다. 곧 여리고에 있는 요새와 에마오와 벧호론과 벧엘과 테마나타-파라톤[a]과 테폰[b]을 높은 성벽과 문과 빗장으로 세웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘테마나타-파라톤’은 다른 전승에서 ‘팀낫-파라톤’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘테폰’은 그리스어 형태를 따른 음역이며, 일부 전승에서는 ‘타폰’과 같은 다른 철자형이 나타납니다.
    reason: lexical_alternative
