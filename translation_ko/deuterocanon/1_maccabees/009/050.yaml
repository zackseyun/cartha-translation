    reason: lexical_alternative
  - marker: b
    text: Tephon is a transliteration of the Greek form; some traditions reflect a different spelling such as 'Taphon.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 예루살렘으로 돌아와 유대에 요새화된 성읍들을 건설하였습니다. 곧 여리고의 요새, 에마오, 벧호론, 벧엘, 다남나-파라톤과 테폰을 높은 성벽과 문과 빗장으로 갖추었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다남나-파라톤’은 다른 전승에서 ‘팀낫-파라톤’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘테폰’은 그리스어 형태를 따른 음역이며, 일부 전승에서는 다른 철자형이 나타납니다.
    reason: lexical_alternative
