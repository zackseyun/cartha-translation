  text: 그리고 이스라엘에 큰 환난이 일어났으니, 그 환난은 예언자가 더 이상 그들 가운데서 보이지 않던 날 이후로는 없었던 것이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예언자가 그들 가운데 나타나지 않던 날 이후로는 없었던 것’으로도 옮길 수 있습니다. 그리스어 수동형 ‘보이다’는 ‘나타나다’로도 이해될 수 있습니다.
    reason: lexical_alternative
