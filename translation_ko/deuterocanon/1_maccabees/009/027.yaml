    text: 또는 ‘예언자가 그들 가운데 나타나지 않게 된 날부터 그런 환난은 없었습니다’로 옮길 수 있습니다. 그리스어 수동형 ‘보이다’는 ‘나타나다’로도 이해될 수 있습니다.
    reason: lexical_alternative
