    issue: 생략된 명사의 보충어가 ‘황금 끈’으로 되어 있음
    rationale: 그리스어 본문에는 여성형 형용사만 있으나, 제공된 영어 감사 기록은 앞문맥의 함축된 물건을 ‘buckle’로 식별합니다. ‘끈’은 버클 자체가 아니라 끈/줄을 뜻하므로 의미가 달라집니다.
  - severity: high
