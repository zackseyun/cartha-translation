translation:
  language: ko
  text: 황금 끈[a], 곧 왕들의 친족에게 주는 것이 관례인 그것을 주었고[b], 그에게 아카론과 그 모든 영토를 유산으로 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문에는 여성형 형용사 '황금'만 남아 있고, 앞문맥에서 생략된 명사를 한국어로 보완했습니다.
    reason: lexical_alternative
  - marker: b
    text: Accaron은 그리스어 지명형이며, 영어에서 더 익숙한 이름은 Ekron입니다.
    reason: alternative_reading
