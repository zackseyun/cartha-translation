  lexicon: LSJ
  rationale: 관용구의 뜻을 살려 자연스러운 현대 문장으로 옮겼고, '관례'로 규범적 반복성을 분명히 했습니다.
- source_word: συγγενεῦσιν τῶν βασιλέων
  english_pob_choice: the kinsmen of kings
  chosen_korean: 왕들의 친족
