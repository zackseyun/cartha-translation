  text: a gold buckle[a], as is customary to give to the kinsmen of kings[b]; and he gave him Accaron and all its territories as an inheritance.
  footnotes:
  - marker: a
    text: Greek has only 'gold' (feminine), with the noun implied from the previous context; 'buckle' is supplied to make the English sentence complete. Other possibilities include 'brooch' or 'ornament.'
    reason: lexical_alternative
  - marker: b
    text: Accaron is the Greek form of the place-name more commonly known in English as Ekron.
    reason: alternative_reading
translation:
  language: ko
  text: 황금 버클[a]을 주었는데, 이는 왕들의 친족에게 주는 것이 관례였습니다. 또 그에게 아카론[b]과 그 모든 영토를 상속 재산으로 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문에는 여성형 형용사 ‘황금’만 남아 있고, 명사는 앞문맥에서 생략되어 있습니다. 여기서는 문맥에 따라 ‘버클’을 보충했습니다. ‘브로치’나 ‘장식품’으로 이해할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 아카론은 그리스어 지명형입니다. 더 널리 알려진 지명형은 에그론입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: χρυσῆν
