  - 경역
  - 변경
  lexicon: LSJ
  rationale: 단순한 경계선이 아니라 실제로 분배되는 지역 전체를 가리키므로, 한국어에서는 '영토'가 문맥상 가장 분명합니다.
- source_word: εἰς κληρονομίαν
  english_pob_choice: as an inheritance
  chosen_korean: 유산으로
  alternatives_korean:
  - 상속 재산으로
  - 기업으로
  lexicon: LSJ
  rationale: 법적·세습적 수여를 뜻하는 표현이므로, 결과 상태를 드러내는 '유산으로'를 택해 문장의 흐름을 자연스럽게 했습니다.
theological_decisions:
- issue: 왕에게서 받는 선물의 성격과 세습성
  chosen_reading: 이 선물은 단순한 호의가 아니라 왕실 친족에게 통상 주어지는 명예적 수여로 제시됩니다.
  alternative_readings:
  - 단순한 사은품으로 이해
  - 정복지 분배의 행정 행위로만 이해
  rationale: 문맥의 '관례'와 '유산'은 선물의 명예성과 지속적 소유권을 함께 보여 주므로, 둘 다 살려 번역했습니다.
  doctrine_reference: 역사서 문맥의 서술 의도
