- source_word: Ἀκκαρὼν
  english_pob_choice: Accaron
  chosen_korean: 아카론
  alternatives_korean:
  - 아카라온
  - 에크론
  lexicon: LSJ
  rationale: 고유명사는 음역 원칙에 따라 그리스어 형태를 반영해 옮겼으며, 전통적 한국어/영어 지명형인 '에크론'은 각주로 처리할 수 있으나 본문은 원형 가독성을 우선했습니다.
- source_word: ὅρια
  english_pob_choice: territories
  chosen_korean: 영토
  alternatives_korean:
