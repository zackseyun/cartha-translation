  source_fidelity: 그리스어의 χρυσῆν은 앞문맥에서 명사가 생략된 여성형 ‘황금/금빛’이므로 보충 번역과 각주가 필요합니다. 현행 ‘끈’은 영어 감사 기록의 ‘buckle’ 및 궁정 수여 문맥과 맞지 않아 ‘버클’이 더 안전합니다. ὅρια는 ‘모든 영토’로, εἰς κληρονομίαν은 세습적 소유로 주는 뜻을 살려 ‘상속 재산으로’ 옮겼습니다.
  naturalness: 현행 문장은 ‘그것을’이 무엇을 가리키는지 다소 불분명하고, 각주 표지가 해당 어구와 연결되지 않습니다. 문장을 두 절로 분명히 나누고 현대 한국어 합쇼체로 다듬었습니다.
  terminology: ‘왕들의 친족’은 συγγενεῦσιν τῶν βασιλέων을 과도하게 제도화하지 않고 충실히 반영합니다. ‘아카론’은 그리스어 Ἀκκαρών의 음역으로 유지하고, 통용 지명 ‘에그론’은 각주에서 제시합니다.
  issues:
