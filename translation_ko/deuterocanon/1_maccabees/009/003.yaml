translation:
  language: ko
  text: 그리고 제152년 첫째 달에 그들은 예루살렘에 진을 쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로는 ‘예루살렘 안으로 진을 쳤다’에 가깝습니다. 한국어에서는 군대의 진영 위치를 자연스럽게 나타내기 위해 ‘예루살렘에 진을 쳤습니다’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ μηνὸς τοῦ πρώτου
  english_pob_choice: in the first month
  chosen_korean: 첫째 달에
  alternatives_korean:
  - 첫 달에
  - 첫째 달 동안
  lexicon: LSJ
  rationale: 달을 가리키는 시간 부사구로 이해하여 자연스러운 현대 한국어 시간 표현인 ‘첫째 달에’로 옮겼습니다.
- source_word: ἔτους δευτέρου καὶ πεντηκοστοῦ καὶ ἑκατοστοῦ
  english_pob_choice: of the one hundred and fifty-second year
  chosen_korean: 제152년
  alternatives_korean:
  - 백오십이 년
  - 152년
  lexicon: LSJ
  rationale: 헬라어의 가산식 연대 표기를 한국어 관용에 맞게 서수형 숫자 표기로 압축해, 연대 정보가 한눈에 드러나도록 했습니다.
- source_word: παρενέβαλον
  english_pob_choice: they encamped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 캠프를 쳤습니다
  - 야영했습니다
  - 주둔했습니다
  lexicon: LSJ
  rationale: 군사적 이동과 배치를 나타내는 동사로 보아, 군사적 뉘앙스를 살리는 ‘진을 치다’가 가장 적합합니다.
- source_word: εἰς Ἱερουσαλήμ
  english_pob_choice: in Jerusalem
  chosen_korean: 예루살렘에
  alternatives_korean:
  - 예루살렘 안에
  - 예루살렘으로
  lexicon: LSJ
  rationale: ἐς/εἰς와 함께 ‘진을 치다’가 이루는 결과 위치를 한국어에서는 목적지/위치 겸용의 ‘-에’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 전쟁 서술의 군사적 어조 유지
  chosen_reading: ‘진을 쳤습니다’로 번역해 단순한 도착이 아니라 군사적 배치를 드러냈습니다.
  alternative_readings:
  - ‘도착했습니다’
  - ‘머물렀습니다’
  rationale: 본문의 παρενέβαλον은 군사적 진영 설치를 뜻하므로, 중립적 이동 동사로 완화하지 않고 전투 맥락을 보존했습니다.
  doctrine_reference: 서사 문맥 보존 원칙
