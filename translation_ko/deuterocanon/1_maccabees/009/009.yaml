  text: But they turned away from him[a], saying, “We certainly cannot do it. Instead, let us save our own lives for now. Let us return with our brothers and fight against them[b], but we are few.”
  footnotes:
  - marker: a
    text: Or, 'they rejected him,' since the Greek expression can imply refusing his counsel rather than merely physically turning away.
    reason: lexical_alternative
  - marker: b
    text: '''Lives'' translates Greek ''souls'' (psychas), a common idiom for preserving one''s life in danger.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들은 그에게서 돌아서며 말했습니다. 「우리는 결코 할 수 없습니다. 대신 지금은 우리의 생명들을 구합시다. 우리의 형제들과 함께 돌아가 그들과 싸웁시다. 우리는 수가 적기 때문입니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 거절하였다’일 수 있습니다. 그리스어 표현은 단순히 물리적으로 돌아선 것보다 그의 제안을 거부하는 뜻을 담을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 여기서 ‘생명들’은 그리스어 psychas(혼/영혼)가 위험한 상황에서 생명을 가리키는 관용적 표현을 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστρεψαν αὐτόν
  english_pob_choice: they turned away from him
  chosen_korean: 그에게서 돌아서며
  alternatives_korean:
  - 그를 거절하며
  - 그에게서 물러서며
  lexicon: LSJ
  rationale: 단순한 물리적 회전보다 제안을 받아들이지 않고 물러나는 관계적 거절의 뉘앙스를 살리되, 과잉 해석은 피했습니다.
- source_word: Οὐ μὴ δυνώμεθα
  english_pob_choice: We certainly cannot do it
  chosen_korean: 우리는 결코 할 수 없습니다
  alternatives_korean:
  - 우리는 절대로 할 수 없습니다
  - 우리는 할 수 없습니다
  lexicon: BDAG
  rationale: οὐ μή의 강한 부정을 한국어의 ‘결코’로 옮겨 단호한 거절을 자연스럽게 표현했습니다.
- source_word: σώσωμεν τὰς ἑαυτῶν ψυχὰς
  english_pob_choice: let us save our own lives
  chosen_korean: 우리의 생명들을 구합시다
  alternatives_korean:
  - 우리 목숨을 살립시다
  - 우리 영혼을 구합시다
  lexicon: BDAG
  rationale: 전투 맥락의 ψυχή는 신학적 ‘영혼’보다 생명을 뜻하므로 ‘생명들’로 옮겼습니다.
- source_word: μετὰ τῶν ἀδελφῶν ἡμῶν
  english_pob_choice: with our brothers
  chosen_korean: 우리의 형제들과 함께
  alternatives_korean:
  - 우리 형제들과
  - 형제들과 더불어
  lexicon: BDAG
  rationale: μετά + 속격의 동반 의미를 분명히 하면서, ἀδελφῶν은 남성 복수의 직역인 ‘형제들’로 유지했습니다.
- source_word: ἡμεῖς δὲ ὀλίγοι
  english_pob_choice: but we are few
  chosen_korean: 우리는 수가 적기 때문입니다
  alternatives_korean:
  - 그러나 우리는 적습니다
  - 우리는 소수이기 때문입니다
  lexicon: BDAG
  rationale: δέ의 대조와 함께 뒤 문장이 이유를 제시하는 흐름을 한국어에서 가장 자연스럽게 드러냈습니다.
theological_decisions:
- issue: ψυχή의 의미를 ‘영혼’으로 신학화할지 여부
  chosen_reading: 전투 상황의 ‘생명’으로 번역했습니다.
  alternative_readings:
  - 영혼
  - 자기 존재
  rationale: 본문은 영혼론이 아니라 즉각적인 생존 판단을 말하므로, 독자가 원문 의도보다 넓은 신학적 의미를 읽어들이지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: ἀδελφοί의 호칭을 중성화할지 여부
  chosen_reading: ‘형제들’로 유지했습니다.
  alternative_readings:
  - 동료들
  - 형제자매들
  rationale: 원문이 남성 복수이며, 본문의 집단적 친족/동료 호칭을 보존하는 편이 source-direct합니다.
  doctrine_reference: Translation philosophy §4
