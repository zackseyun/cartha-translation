revisions:
- from: 그러나 그들은 그에게서 돌아서며 말했습니다. 「우리는 결코 할 수 없습니다. 대신 지금은 우리의 생명들을 구합시다. 우리의 형제들과 함께 돌아가 그들과 싸웁시다. 우리는 수가 적기 때문입니다.」[a][b]
  to: 그러나 그들은 그에게서 돌아서서[a] 말했습니다. 「우리는 결코 할 수 없습니다. 오히려 지금은 우리 목숨을 구합시다[b]. 우리 형제들과 함께 돌아가 그들과 싸웁시다. 그러나 우리는 수가 적습니다.」
  rationale: 한국어 관용에 맞게 ‘생명들’을 ‘목숨’으로 고치고, 원문의 δέ가 지닌 대조를 ‘그러나’로 유지했습니다. 또한 각주 표지를 해당 번역어에 직접 붙였으며, ‘돌아서서’는 ἀπέστρεψαν αὐτόν의 관계적 거리두기와 거절의 뉘앙스를 과도하게 확정하지 않고 보존합니다.
