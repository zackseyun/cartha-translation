    reason: cross_reference
translation:
  language: ko
  text: 어찌 그 용사가 넘어졌으며, 이스라엘을 구원하던 그가 쓰러졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 표현은 “어찌 그 용사들이 넘어졌는가”라는 성경적 애가 공식(2사무엘 1:19, 25, 27)을 떠올리게 합니다.
    reason: cross_reference
lexical_decisions:
- source_word: Πῶς
  english_pob_choice: How
  chosen_korean: 어찌
  alternatives_korean:
  - 어떻게
  - 아, 어찌
  lexicon: LSJ
  rationale: 애가(哀歌)에서 쓰이는 감탄형을 살리기 위해 정보 질문이 아닌 탄식의 ‘어찌’로 옮겼습니다.
- source_word: ἔπεσεν
  english_pob_choice: has fallen
  chosen_korean: 넘어졌으며
  alternatives_korean:
  - 떨어졌으며
  - 쓰러졌으며
  lexicon: LSJ
  rationale: 죽음/패배를 드러내는 시적 표현으로 ‘넘어지다’를 택해 탄식의 운율을 살렸습니다.
- source_word: δυνατός
  english_pob_choice: the mighty one
  chosen_korean: 그 용사
  alternatives_korean:
  - 그 강한 이
  - 그 능한 자
  - 그 힘센 이
  lexicon: LSJ
  rationale: 단수 명사화된 형용사로서 인물의 위력을 나타내는 호칭이므로, 한국어에서는 자연스럽고 장중한 ‘용사’를 선택했습니다.
- source_word: σώζων τὸν Ἰσραήλ
  english_pob_choice: he who was saving Israel
  chosen_korean: 이스라엘을 구원하던 그
  alternatives_korean:
  - 이스라엘을 구원하는 이
  - 이스라엘을 구원하던 자
  - 이스라엘을 구원하던 분
  lexicon: LSJ
  rationale: 현재분사 σώζων의 계속적/특성적 뉘앙스를 살려 완료형으로 굳히지 않고 ‘구원하던’으로 옮겼으며, 목적어는 관사 유무와 무관하게 ‘이스라엘’로 간결히 처리했습니다.
theological_decisions:
- issue: 이 구절의 애가적 공명 보존
  chosen_reading: 2사무엘 1장의 ‘어찌… 넘어졌는가’ 계열 탄식 공식을 한국어에서도 분명히 드러냈습니다.
  alternative_readings:
  - 단순 서술형으로 평평하게 번역하기
  - ‘슬프다’ 같은 감탄사를 추가하기
  rationale: 원문 자체가 애가 공식의 울림을 지니므로, 의미를 완화하거나 감정어를 덧붙이지 않고 탄식형 구조를 유지하는 것이 본문의 문학적·신학적 힘을 더 잘 보존합니다.
  doctrine_reference: 문학적 상호본문성 보존
- issue: 미상 인물의 지칭 방식
  chosen_reading: 직역적 호칭인 ‘그 용사’를 써서 인물의 정체를 본문 밖에서 특정하지 않았습니다.
  alternative_readings:
  - 유다를 명시하기
  - ‘강한 자’로 더 추상화하기
  rationale: 본문은 이름을 말하지 않고 장중한 서술만 제시하므로, 역사적 맥락을 아는 독자가 이해할 수 있도록 하되 본문에 없는 식별 정보는 추가하지 않았습니다.
  doctrine_reference: 본문 충실성 원칙
