translation:
  language: ko
  text: 그는 오도메라와 그의 형제들과 파시론의 아들들을 그들의 진영에서 쳤으며, 또 자기 군대와 함께 치고 올라가기 시작했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어의 직역은 ‘그들의 천막/거처에서’이지만, 군사 문맥에서는 ‘진영’ 또는 ‘주둔지’의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 문자적으로 ‘치기 시작하고 올라가기 시작하다’에 가깝지만, 여기서는 전투 문맥상 ‘공격하고 진격하다’의 뜻으로 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπάτεξεν
  english_pob_choice: struck
  chosen_korean: 쳤으며
  alternatives_korean:
  - 공격했습니다
  - 내리쳤습니다
  lexicon: LSJ
  rationale: 파타소의 군사적 ‘치다/내리치다’의 구체적 동작을 살리되, 현대 한국어에서 자연스러운 서술로 옮겼습니다.
- source_word: ἐν τῷ σκηνώματι αὐτῶν
  english_pob_choice: in their camp
  chosen_korean: 그들의 진영에서
  alternatives_korean:
