translation:
  language: ko
  text: 그는 오도메라와 그의 형제들과 파시론의 아들들을 그들의 진영에서[a] 쳤으며, 병력과 함께 치고 올라가기 시작했습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어의 직역은 ‘그들의 천막/거처에서’이지만, 군사 문맥에서는 ‘진영’ 또는 ‘주둔지’로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 문자적으로 ‘치고 올라가기 시작했다’입니다. ‘올라가다’는 전투 문맥에서 진격을 가리킬 수 있습니다.
    reason: lexical_alternative
