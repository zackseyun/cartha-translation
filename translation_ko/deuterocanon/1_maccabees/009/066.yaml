  - 그들의 주둔지에서
  lexicon: LSJ
  rationale: σκηνῶμα의 문자적 뜻은 ‘천막/거처’이지만, 전투 문맥에서는 ‘진영’이 더 정확하고 자연스럽습니다.
- source_word: ἐξηρξατο τύπτειν καὶ ἀναβαίνειν
  english_pob_choice: he began to strike and to advance
  chosen_korean: 치고 올라가기 시작했습니다
  alternatives_korean:
  - 때리기 시작하고 올라가기 시작했습니다
  - 공격을 시작하고 진격하기 시작했습니다
  lexicon: BDAG/LSJ
  rationale: ‘begin’의 시작상과 τύπτειν/ἀναβαίνειν의 병렬을 살리면서, 전투 문맥의 ἀναβαίνειν을 ‘진격하다/올라가다’의 군사적 감각으로 옮겼습니다.
- source_word: ἐν ταῖς δυνάμεσιν
  english_pob_choice: with his forces
  chosen_korean: 자기 군대와 함께
  alternatives_korean:
  - 그의 병력과 함께
  - 그의 군대들 가운데
  lexicon: BDAG
  rationale: δυνάμεις의 복수는 군사적 ‘병력/군대’를 가리키므로, 문맥상 행위 주체가 자기 병력과 함께 움직인다는 뜻을 자연스럽게 반영했습니다.
theological_decisions:
- issue: 전투 서술의 반복 동사 유지
  chosen_reading: ‘쳤으며… 치고 올라가기 시작했습니다’로 두 동사의 반복을 살렸습니다.
  alternative_readings:
  - 한 번의 ‘공격했습니다’로 평탄화함
  - ‘타격하고 진격했습니다’로 의미를 한 번에 묶음
  rationale: 그리스어는 ἐπάτεξεν과 τύπτειν을 반복해 공격의 연속성과 격렬함을 강조하므로, 이를 평탄화하지 않고 드러내는 것이 본문 효과를 더 잘 보존합니다.
  doctrine_reference: 서사적 강조와 행위의 반복 표현
- issue: ἀναβαίνειν의 군사적 방향성
  chosen_reading: ‘올라가기’의 문자성을 과도하게 풀지 않고 전투적 진격 의미를 살린 ‘올라가기 시작했습니다’로 옮겼습니다.
  alternative_readings:
  - 그가 올라가기 시작했습니다
  - 그가 진격하기 시작했습니다
  rationale: 문자적으로는 ‘올라가다’이지만, 전쟁 서술에서는 지형을 향한 진군/공세의 관용적 표현일 수 있어, 의미를 유지하면서도 한국어로 이해 가능하게 처리했습니다.
  doctrine_reference: 전쟁 서술의 관용적 공간 표현
