  yaml_path: translation/deuterocanon/1_maccabees/009/018.yaml
  text: And Judas fell[a], and the rest fled.
  footnotes:
  - marker: a
    text: Or 'was struck down' / 'died.' The Greek says 'fell,' a common battle expression that can imply death without stating it more explicitly.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 유다가 쓰러졌고, 나머지는 도망쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘쓰러졌고’는 그리스어 ἔπεσεν의 문자적 의미를 살린 번역입니다. 전투 문맥에서는 죽음을 암시할 수 있지만, 본문은 그것을 명시적으로 말하지는 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰούδας
  english_pob_choice: Judas
  chosen_korean: 유다
  alternatives_korean:
  - 유대
  - 유다스
  lexicon: 고유명사 관행
  rationale: 1마카베오의 인물은 마카베오 유다이므로, 한국어 성경 관행에 따라 ‘유다’로 옮겼습니다.
- source_word: ἔπεσεν
  english_pob_choice: fell
  chosen_korean: 쓰러졌고
  alternatives_korean:
  - 떨어졌고
  - 죽었고
  - 전사했고
  lexicon: LSJ
  rationale: 그리스어 ἔπεσεν은 문자적으로 ‘떨어지다/쓰러지다’이며 전투 문맥에서는 죽음을 암시할 수 있으나 단정하지는 않으므로, POB의 ‘fell’에 맞춰 ‘쓰러졌고’로 옮겼습니다.
- source_word: οἱ λοιποὶ
  english_pob_choice: the rest
  chosen_korean: 나머지는
  alternatives_korean:
  - 다른 이들은
  - 남은 사람들은
  lexicon: LSJ
  rationale: λοιποί는 지명된 인물 외의 나머지를 가리키므로, 간결하고 자연스러운 ‘나머지는’이 적절합니다.
- source_word: ἔφυγον
  english_pob_choice: fled
  chosen_korean: 도망쳤습니다
  alternatives_korean:
  - 달아났습니다
  - 도망갔습니다
  - 피했습니다
  lexicon: LSJ
  rationale: φύγω는 위험에서 달아나다는 뜻이므로, 전투 장면의 급박함을 살리는 ‘도망쳤습니다’로 옮겼습니다.
