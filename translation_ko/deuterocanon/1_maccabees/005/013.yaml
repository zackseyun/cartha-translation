    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 우리 형제들 가운데 투비오 지역에 있는 이들은 모두 죽임을 당했고[a], 그들의 아내들과 자녀들과 재산도 사로잡혔으며[b], 거기에서 약 천 명의 남자들이 멸망했습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Greek: ‘in the [place/people] of Toubiou’; the exact place-name form is difficult, and ‘투비오 지역’은 지리적 의미를 살린 옮김입니다.'
    reason: lexical_alternative
  - marker: b
    text: ὑποσκευήν은 ‘짐’ ‘소지품’ ‘재산’까지 아우를 수 있어, 여기서는 전리품 맥락의 포괄적 의미를 살린 ‘재산’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: ὡς μίαν χιλιάδα ἀνδρῶν은 ‘약 천 명의 남자들’이라는 근사 표현입니다.
    reason: lexical_alternative
