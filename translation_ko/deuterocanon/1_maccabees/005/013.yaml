  - ‘패배했습니다’로 일반화
  rationale: 본문은 단순한 패전이 아니라 살해, 포로화, 약탈, 전멸을 나란히 열거하므로, 이를 완화하면 서술의 충격과 고발성이 약해집니다.
  doctrine_reference: 본문 서술의 사실성 및 전쟁 서사의 직접성
