- issue: 전쟁 보고문의 잔혹한 행위를 완화하지 않을지
  chosen_reading: ‘죽임을 당했고… 사로잡혔으며… 멸망했습니다’처럼 수동·피해 중심 표현을 유지해 원문의 전투 피해 보고를 직접 드러냈습니다.
  alternative_readings:
