base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/013.yaml
  text: And all our brothers who are in the region of Tob have been killed[a], and they have taken their wives and children captive, along with their possessions[c][b], and have destroyed about one thousand men there.
  footnotes:
  - marker: a
    text: 'Greek: ''in the [place/people] of Toubiou''; the exact place-name form is difficult, and ''the region of Tob'' reflects the likely geographic sense.'
    reason: lexical_alternative
  - marker: b
    text: Or 'their baggage' or 'their property' for 'their goods' (Greek ὑποσκευήν).
    reason: lexical_alternative
  - marker: c
    text: Or 'they killed about one thousand men there'; Greek literally, 'they destroyed about one thousand men there.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 우리 형제들 가운데 투비오 지역에 있는 이들은 모두 죽임을 당했고[a], 그들의 아내와 자녀와 소유물을 사로잡아 갔으며[b], 그곳에서 약 천 명의 남자들을 죽였습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘투비오의 [장소/사람들] 안에’라고 합니다. 정확한 지명 형태는 확정하기 어려우며, ‘투비오 지역’은 지리적 의미를 살린 옮김입니다.
    reason: lexical_alternative
  - marker: b
    text: ὑποσκευήν은 ‘짐’, ‘소지품’, ‘소유물’을 뜻할 수 있습니다. 여기서는 빼앗긴 이동 가능한 물품·재산을 포괄하는 뜻으로 ‘소유물’로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: ὡς μίαν χιλιάδα ἀνδρῶν은 ‘약 천 명의 남자들’이라는 근사 표현입니다. ἀπώλεσαν은 직역하면 ‘없애 버렸다/파괴했다’이며, 사람을 목적어로 하는 이 문맥에서는 ‘죽였다’로 옮겼습니다.
    reason: lexical_alternative
