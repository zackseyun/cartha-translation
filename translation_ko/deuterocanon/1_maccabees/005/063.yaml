translation:
  language: ko
  text: 그리고 유다라는 사람과 그의 형제들은 온 이스라엘과 모든 민족들 앞에서 크게 영광을 받았으며, 그들의 이름이 들리는 곳마다 그러하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘유다라는 사람’은 그리스어의 ὁ ἀνήρ를 살린 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἀνὴρ Ἰούδας
  english_pob_choice: the man Judas
  chosen_korean: 유다라는 사람
  alternatives_korean:
  - 유다
  - 유다라는 남자
  - 사람 유다
  lexicon: LSJ
  rationale: 그리스어는 고유명사 앞에 ὁ ἀνήρ를 덧붙여 apposition을 이루므로, 이를 완전히 지우기보다 한국어로 자연스럽게 살려 ‘유다라는 사람’으로 옮겼습니다.
- source_word: ἐδοξάζοντο σφόδρα
  english_pob_choice: were greatly glorified
  chosen_korean: 크게 영광을 받았으며
  alternatives_korean:
  - 크게 존중받았으며
  - 크게 영광되었으며
  - 크게 높임을 받았으며
  lexicon: LSJ
  rationale: δοξάζω의 수동은 단순한 평판이 아니라 ‘영광/존귀’를 받는 의미를 담으므로, 문맥에 맞는 자연스러운 한국어로 ‘크게 영광을 받다’를 택했습니다.
- source_word: ἐναντίον παντὸς Ἰσραὴλ καὶ τῶν ἐθνῶν πάντων
  english_pob_choice: before all Israel and all the nations
  chosen_korean: 온 이스라엘과 모든 민족들 앞에서
  alternatives_korean:
  - 온 이스라엘과 모든 나라들 앞에서
  - 온 이스라엘과 모든 민족들의 눈앞에서
  lexicon: LSJ
  rationale: ἐναντίον은 여기서 ‘~앞에서/눈앞에서’의 공개적·평가적 장면을 나타내므로 ‘앞에서’로 옮겼고, ἔθνη는 이 역사서 문맥에서 신학적 ‘이방인’보다 정치·민족적 ‘민족들’이 더 정확합니다.
- source_word: οὗ ἠκούετο τὸ ὄνομα αὐτῶν
  english_pob_choice: wherever their name was heard
  chosen_korean: 그들의 이름이 들리는 곳마다
  alternatives_korean:
  - 그들의 이름이 알려지는 곳마다
  - 그들에 대한 소문이 들리는 곳마다
  - 그들의 이름이 들려오는 곳마다
  lexicon: LSJ
  rationale: 직역하면 ‘그들의 이름이 들리던 곳마다’이지만, 한국어에서는 ‘이름이 들리는 곳마다’가 소문과 명성을 함께 포괄하는 자연스러운 관용으로 기능합니다.
