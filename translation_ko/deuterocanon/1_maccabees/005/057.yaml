translation:
  language: ko
  text: 그들이 말했습니다. 「우리도 명성을 얻읍시다[a]. 우리 주변의 민족들과 전쟁하러 갑시다[b].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘우리 자신을 위해 이름을 만들자’입니다. 또는 ‘우리도 이름을 떨칩시다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리 주변의 이방 민족들.’ 그리스어 ἔθνη는 문맥에 따라 주변의 비유대 민족들을 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Ποιήσωμεν ... ἑαυτοῖς ὄνομα
  english_pob_choice: Let us also make a name for ourselves
  chosen_korean: 우리를 위해 이름을 하나 만들어 봅시다
  alternatives_korean:
  - 우리를 위해 명성을 얻읍시다
  - 우리에게 이름을 남겨 봅시다
  lexicon: LSJ
  rationale: ποιέω + ὄνομα의 관용구를 한국어에서 직역에 가깝게 살리되, ‘이름을 만들다’가 어색하게 들리지 않도록 합쇼체로 다듬었습니다.
- source_word: καὶ αὐτοὶ
  english_pob_choice: also
  chosen_korean: 우리도
  alternatives_korean:
  - 또한 우리도
  - 심지어 우리도
  lexicon: LSJ
  rationale: 대조적 추가 의미를 자연스럽게 드러내기 위해 ‘우리도’로 옮겼습니다.
- source_word: πορευθῶμεν πολεμῆσαι
  english_pob_choice: let us go to fight
  chosen_korean: 싸우러 갑시다
  alternatives_korean:
  - 전쟁하러 갑시다
  - 전쟁을 일으키러 갑시다
  lexicon: LSJ
  rationale: πορεύομαι + 부정사 구문은 목적을 가진 이동을 나타내므로 ‘-하러 갑시다’로 자연스럽게 처리했고, πολεμέω는 여기서 전면적 전쟁 행위보다 ‘싸우다’가 과도한 확대 없이 대응됩니다.
- source_word: τὰ ἔθνη τὰ κύκλῳ ἡμῶν
  english_pob_choice: the nations around us
  chosen_korean: 우리 주위의 민족들
  alternatives_korean:
  - 우리 주변의 민족들
  - 우리 둘레의 나라들
  lexicon: LSJ
  rationale: ἔθνη는 문맥상 이웃한 비유대 민족들을 가리키므로 ‘민족들’로 옮기고, κύκλῳ ἡμῶν은 ‘우리 주위의’로 간결하게 반영했습니다.
theological_decisions:
- issue: ἔθνη의 번역 범위
  chosen_reading: ‘민족들’로 옮겨 역사적·지리적 의미를 우선 살렸습니다.
  alternative_readings:
  - ‘이방인들’로 옮길 수 있습니다.
  - ‘열국’으로 옮길 수 있습니다.
  rationale: 이 절은 군사적 발화이므로 신학적 대비를 전면화하기보다, 주변의 실제 대상을 가리키는 일반 의미를 유지하는 편이 원문 의도에 가깝습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: 직접화법의 호소형 문체
  chosen_reading: 동사의 청유형을 ‘갑시다’로 살려 집단 결의의 강도를 유지했습니다.
  alternative_readings:
  - ‘가자’로 더 구어적으로 옮길 수 있습니다.
  - ‘가도록 합시다’로 더 완곡하게 옮길 수 있습니다.
  rationale: 원문은 두 개의 hortatory subjunctive를 사용해 결의를 표현하므로, 합쇼체 안에서 청유의 힘이 유지되도록 했습니다.
  doctrine_reference: Korean target style guide
