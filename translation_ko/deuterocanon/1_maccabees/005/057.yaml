  source_fidelity: 원문은 ‘그들이 말하였다’ 뒤에 두 청유형을 직접화법으로 제시합니다. καὶ αὐτοὶ는 ‘우리도’로, ποιεῖν ὄνομα ἑαυτοῖς는 명성을 얻고자 한다는 관용적 의미로, πορευθῶμεν πολεμῆσαι는 전쟁을 위해 가자는 뜻으로 옮기는 것이 적절합니다. τὰ ἔθνη τὰ κύκλῳ ἡμῶν은 ‘우리 주변의 민족들’로 유지할 수 있습니다.
  naturalness: ‘우리를 위해 이름을 하나 만들어 봅시다’는 한국어 관용상 부자연스럽고, ‘-아/어 봅시다’는 원문의 결의에 없는 시험적·완곡한 뉘앙스를 더합니다. ‘우리도 명성을 얻읍시다’가 현대의 격식 있는 합쇼체에서 자연스럽습니다. πολεμέω의 군사적 의미는 ‘전쟁하러 갑시다’가 ‘싸우러 갑시다’보다 더 분명하게 반영합니다.
  terminology: ‘민족들’은 ἔθνη의 넓은 역사적 의미를 보존하며, 각주에서 문맥상 비유대 민족들을 가리킬 수 있음을 알리는 방식도 적절합니다. 다만 현 초안의 각주 표지는 각각 설명 대상과 맞지 않으므로 옮겨야 합니다.
