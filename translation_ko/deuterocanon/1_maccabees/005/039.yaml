  text: And Arabs had been hired to help them[a], and they were encamped beyond the wadi, ready to come against you in battle[b]. And Judas went out to meet them.
  footnotes:
  - marker: a
    text: Or 'across the torrent.' The Greek word can denote a seasonal streambed or rushing brook; 'wadi' is used here to reflect the likely terrain.
    reason: lexical_alternative
  - marker: b
    text: The Greek says 'against you' in the singular, reflecting the direct report being relayed to Judas.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 아라비아 사람들은 그들을 돕기 위해 고용되었고, 그들은 와디 건너편에 진을 치고 있었으며, 전쟁하러 당신에게 오려고 준비하고 있었습니다. 그러자 유다서는 그들을 맞으러 나갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘와디’는 계절 하천이나 건천을 가리키는 근동 지형을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 단수 2인칭 ‘당신에게’를 사용하여, 전달되는 보고가 유다를 직접 겨냥함을 드러냅니다.
    reason: lexical_alternative
