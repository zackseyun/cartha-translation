  - marker: b
    text: The Greek says 'against you' in the singular, reflecting the direct report being relayed to Judas.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 아랍인들이 그들을 돕기 위해 고용되었으며, 와디[a] 건너편에 진을 치고 전쟁을 하려고 당신을 치러 올 준비를 하고 있었습니다[b]. 그러자 유다는 그들을 맞으러 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘와디’는 계절에 따라 물이 흐르거나 마른 하천 바닥이 되는 근동의 지형을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 단수 2인칭 ‘당신을’을 사용합니다. 이는 유다에게 전달된 보고의 직접적인 호칭을 반영합니다.
    reason: lexical_alternative
