  to: 그리고 아랍인들이 그들을 돕기 위해 고용되었으며, 와디[a] 건너편에 진을 치고 전쟁을 하려고 당신을 치러 올 준비를 하고 있었습니다[b]. 그러자 유다는 그들을 맞으러 갔습니다.
