  text: And Arabs had been hired to help them[a], and they were encamped beyond the wadi, ready to come against you in battle[b]. And Judas went out to meet them.
  footnotes:
  - marker: a
    text: Or 'across the torrent.' The Greek word can denote a seasonal streambed or rushing brook; 'wadi' is used here to reflect the likely terrain.
