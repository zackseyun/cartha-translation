  text: And Joseph and Azariah were routed and were pursued as far as the borders of Judea[a]; and on that day about two thousand men of the people of Israel fell.
  footnotes:
  - marker: a
    text: Greek literally, 'fell ... to two thousand men'; the expression likely gives an approximate total, hence 'about two thousand men.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 요셉과 아자랴는 패주하여 유다의 경계까지 쫓겼으며, 그날 이스라엘 백성 가운데서 약 이천 명이 쓰러졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘약’은 그리스어 εἰς δισχιλίους ἄνδρας가 정확한 수라기보다 대략적 총계를 가리킬 수 있다는 점을 반영한 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτροπώθη
  english_pob_choice: were routed
  chosen_korean: 패주하여
  alternatives_korean:
  - 패배하여
  - 도주하게 되어
  - 무너져
  lexicon: LSJ
  rationale: 군사적 맥락에서 단순한 ‘패배’보다 진형이 무너져 도망치는 뉘앙스를 살리는 말로 옮겼습니다.
- source_word: ἐδιώχθησαν
  english_pob_choice: were pursued
  chosen_korean: 쫓겼으며
  alternatives_korean:
  - 추격당했으며
  - 추격을 받았으며
  - 뒤쫓겼으며
  lexicon: LSJ
  rationale: 패주 뒤에 이어지는 적대적 추격을 자연스러운 현대 한국어로 표현했습니다.
- source_word: ἕως τῶν ὁρίων τῆς Ἰουδαίας
  english_pob_choice: as far as the borders of Judea
  chosen_korean: 유다의 경계까지
  alternatives_korean:
  - 유다의 변경까지
  - 유다의 국경까지
  - 유다 땅의 경계까지
  lexicon: LSJ
  rationale: ὅρια의 기본 의미인 ‘경계/경계선’을 살려, 과도한 국가적 뉘앙스가 없는 ‘경계’로 옮겼습니다.
- source_word: εἰς δισχιλίους ἄνδρας
  english_pob_choice: about two thousand men
  chosen_korean: 약 이천 명
  alternatives_korean:
  - 이천 명가량
  - 대략 이천 명
  - 이천 명에 이르렀습니다
  lexicon: LSJ
  rationale: εἰς가 수량의 대략적 도달을 나타낼 수 있으므로, POB의 ‘about’에 맞게 ‘약’을 넣어 정확한 수를 단정하지 않았습니다.
theological_decisions:
- issue: 전투 서술에서 ‘fell’의 의미 범위
  chosen_reading: ‘쓰러졌습니다’로 번역하여 전투 중 사망을 직접 단정하지 않되, 문맥상 전사함을 충분히 암시하도록 했습니다.
  alternative_readings:
  - 죽었습니다
  - 전사했습니다
  - 살해당했습니다
  rationale: ἔπεσον은 전투 서술의 관용적 표현으로, 본문이 직접 말하는 수준을 넘지 않으면서도 결과를 분명히 전달하는 것이 적절합니다.
  doctrine_reference: 서사 본문 번역 원칙
- issue: 이스라엘 집단 지칭의 범위
  chosen_reading: ‘이스라엘 백성 가운데서’로 옮겨, 전투에서 쓰러진 자들이 이스라엘 공동체 소속임을 분명히 했습니다.
  alternative_readings:
  - 이스라엘 사람들 가운데서
  - 이스라엘 가운데서
  - 이스라엘의 백성 중에서
  rationale: ἐκ τοῦ λαοῦ Ἰσραήλ은 소속 관계를 드러내므로, 자연스러운 현대 한국어로 공동체적 소속을 살렸습니다.
  doctrine_reference: 서사 본문 번역 원칙
