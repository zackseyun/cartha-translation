  lexicon: LSJ
  rationale: 전쟁 문맥의 ἐπί+대격이 지닌 적대 방향을 한국어에서 가장 분명하게 드러내기 위해 ‘대적하여’를 선택했습니다.
- source_word: ἀλλοφύλων
  english_pob_choice: foreigners
  chosen_korean: 이방인의
  alternatives_korean:
  - 외국인의
  - 이방 사람들의
  - 타민족의
  lexicon: LSJ
  rationale: 이 단어는 여기서 신학적 범주보다 민족·정치적 타자를 가리키므로, 직역에 가까운 ‘이방인의’로 옮겨 원문의 뉘앙스를 보존했습니다.
- source_word: τοῦ ἐξαναλῶσαι ἡμᾶς
  english_pob_choice: to wipe us out
  chosen_korean: 우리를 멸하려고
  alternatives_korean:
  - 우리를 진멸하려고
  - 우리를 완전히 없애려고
  - 우리를 소멸시키려고
  lexicon: LSJ
  rationale: 목적을 나타내는 부정사 구문을 한국어의 ‘-려고’로 옮겼고, ἐξαναλῶσαι의 완전 파괴 의미는 ‘멸하다’로 간결하게 살렸습니다.
theological_decisions:
