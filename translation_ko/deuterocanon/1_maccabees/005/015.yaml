translation:
  language: ko
  text: “말하기를, ‘사람들이 우리를 멸하려고 프톨레마이스와 두로와 시돈과 이방인의 온 갈릴리에서 그들을 대적하여 모여들었습니다.’”[a]
  philosophy: optimal-equivalence
  footnotes:
