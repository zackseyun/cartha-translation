    text: 또는 “이방인의 온 갈릴리”로 옮길 수 있습니다. 그리스어는 ‘이방인들’에 해당하는 표현을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπισυνήχθη
  english_pob_choice: A gathering has been assembled
  chosen_korean: 모여들었습니다
  alternatives_korean:
  - 집결하였습니다
  - 소집되었습니다
  - 한 무리가 모였습니다
  lexicon: LSJ
  rationale: 수동형의 의미를 살리면서도 현대 한국어에서 자연스럽게 읽히도록 ‘모여들었습니다’로 옮겼습니다. 능동적 재구성으로 바꾸지 않고 집합된 상태를 드러냅니다.
- source_word: ἐπʼ αὐτούς
  english_pob_choice: against them
  chosen_korean: 그들을 대적하여
  alternatives_korean:
  - 그들을 향하여
  - 그들 위에
  - 그들에게
  lexicon: LSJ
  rationale: 전쟁 문맥의 ἐπί+대격이 지닌 적대 방향을 한국어에서 가장 분명하게 드러내기 위해 ‘대적하여’를 선택했습니다.
- source_word: ἀλλοφύλων
  english_pob_choice: foreigners
  chosen_korean: 이방인의
  alternatives_korean:
  - 외국인의
  - 이방 사람들의
  - 타민족의
  lexicon: LSJ
  rationale: 이 단어는 여기서 신학적 범주보다 민족·정치적 타자를 가리키므로, 직역에 가까운 ‘이방인의’로 옮겨 원문의 뉘앙스를 보존했습니다.
- source_word: τοῦ ἐξαναλῶσαι ἡμᾶς
  english_pob_choice: to wipe us out
  chosen_korean: 우리를 멸하려고
  alternatives_korean:
  - 우리를 진멸하려고
  - 우리를 완전히 없애려고
  - 우리를 소멸시키려고
  lexicon: LSJ
  rationale: 목적을 나타내는 부정사 구문을 한국어의 ‘-려고’로 옮겼고, ἐξαναλῶσαι의 완전 파괴 의미는 ‘멸하다’로 간결하게 살렸습니다.
theological_decisions:
- issue: ἀλλόφυλοι의 번역 범주
  chosen_reading: ‘이방인’ 계열을 유지하되, 본문에는 ‘이방인의’로 제한적으로 반영합니다.
  alternative_readings:
  - ‘외국인의’
  - ‘이방 사람들의’
  rationale: 이 구절의 ἀλλόφυλοι는 후대의 신학적 용어라기보다 적대 집단을 가리키는 민족·지리적 표현이므로, 전통 교회어 ‘이방인’의 범주를 쓰되 문맥상 과도한 신학화는 피했습니다.
  doctrine_reference: original-language primacy; deuterocanonical historical context
