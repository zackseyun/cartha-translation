  alternative_readings:
  - ‘외국인의’
  - ‘이방 사람들의’
  rationale: 이 구절의 ἀλλόφυλοι는 후대의 신학적 용어라기보다 적대 집단을 가리키는 민족·지리적 표현이므로, 전통 교회어 ‘이방인’의 범주를 쓰되 문맥상 과도한 신학화는 피했습니다.
