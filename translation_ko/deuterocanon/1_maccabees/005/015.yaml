lexical_decisions:
- source_word: Ἐπισυνήχθη
  english_pob_choice: A gathering has been assembled
  chosen_korean: 모여들었습니다
  alternatives_korean:
  - 집결하였습니다
  - 소집되었습니다
  - 한 무리가 모였습니다
  lexicon: LSJ
  rationale: 수동형의 의미를 살리면서도 현대 한국어에서 자연스럽게 읽히도록 ‘모여들었습니다’로 옮겼습니다. 능동적 재구성으로 바꾸지 않고 집합된 상태를 드러냅니다.
- source_word: ἐπʼ αὐτούς
