    rationale: ‘우리가 건너가고 강 건너편에 진을 치면’은 첫 동작이 단순 연결되고 둘째 동작에만 조건 어미가 붙은 듯 들립니다. 그리스어에서는 두 동작 모두 ἐὰν 아래의 조건을 이루므로 ‘건너가 … 진을 치면’이 더 정확하고 자연스럽습니다.
