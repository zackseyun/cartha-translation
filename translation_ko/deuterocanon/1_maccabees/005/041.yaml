review_pass:
  verdict: revise
  source_fidelity: 원문의 조건절(ἐὰν … διέλθωμεν καὶ παρεμβάλῃ)과 미래 귀결절(διαπεράσομεν)을 대체로 충실히 반영했습니다. 다만 한국어 본문의 ‘건너가고 … 치면’은 조건 범위가 다소 불균형하게 들리므로, 두 동작이 함께 조건을 이루도록 고치는 것이 더 정확합니다. πρὸς αὐτόν의 중립적인 방향성은 본문의 ‘그에게로’로 보존할 수 있습니다.
  naturalness: ‘우리가 건너가 강 건너편에 진을 치면’이 현대 표준 한국어의 조건 연결로 자연스럽고 명확합니다. ‘그러나’와 합쇼체 미래형은 문맥과 등록에 적절합니다.
  terminology: ‘진을 치다’는 군사적 παρεμβάλῃ에 적합하며, ‘강 건너편’은 πέραν τοῦ ποταμοῦ를 잘 반영합니다. 각주에서는 본문의 중립적 표현과 ‘그를 향해’라는 문맥적 뉘앙스를 명확히 구별해야 합니다.
