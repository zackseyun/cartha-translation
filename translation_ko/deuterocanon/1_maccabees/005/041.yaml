  yaml_path: translation/deuterocanon/1_maccabees/005/041.yaml
  text: But if we cross over and camp beyond the river[a], we will cross over to him.
  footnotes:
  - marker: a
    text: Or 'toward him.' The Greek phrase can be read more neutrally, but in this battle context it likely means advancing against him.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 우리가 건너가 강 건너편에 진을 치면, 그에게로 건너갈 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 향해’. 그리스어 표현은 중립적으로 ‘그에게로’라고도 읽을 수 있지만, 이 전투 문맥에서는 그를 향해 진군한다는 뜻일 가능성이 큽니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν δὲ διέλθωμεν
  english_pob_choice: But if we cross over
  chosen_korean: 그러나 우리가 건너가고
  alternatives_korean:
  - 우리가 건너가면
  - 우리가 넘어가면
  lexicon: LSJ
  rationale: ἐὰν + 접속법은 조건을 나타내므로 ‘-면’으로 옮기되, 군사적 이동의 느낌을 살려 ‘건너가다’를 택했습니다.
- source_word: παρεμβάλῃ
  english_pob_choice: camp
  chosen_korean: 진을 치면
  alternatives_korean:
  - 캠프하면
  - 주둔하면
  - 야영하면
  lexicon: LSJ
  rationale: 전쟁 맥락에서 παρεμβάλλω는 단순한 야영보다 ‘진을 치다’가 더 정확하고 한국어로도 자연스럽습니다.
- source_word: πέραν τοῦ ποταμοῦ
  english_pob_choice: beyond the river
  chosen_korean: 강 건너편에
  alternatives_korean:
  - 강 너머에
  - 강을 건너서
  lexicon: LSJ
  rationale: πέραν은 ‘~의 저편/건너편’의 공간적 위치를 가리키므로 ‘강 건너편에’가 의미를 가장 분명하게 드러냅니다.
- source_word: διαπεράσομεν πρὸς αὐτόν
  english_pob_choice: we will cross over to him
  chosen_korean: 그에게로 건너갈 것입니다
  alternatives_korean:
  - 그를 향해 건너갈 것입니다
  - 그에게로 넘어갈 것입니다
  lexicon: LSJ
  rationale: πρὸς αὐτόν은 중립적 ‘~에게로’도 가능하지만, 문맥상 상대를 향해 접근하는 군사 행동이므로 ‘그에게로 건너가다’로 옮겼습니다.
theological_decisions:
- issue: πρὸς αὐτόν의 방향성 해석
  chosen_reading: 군사적 맥락을 반영해 중립적 접근이 아니라 상대를 향한 진군으로 이해했습니다.
  alternative_readings:
  - 그에게로
  - 그를 향하여
  rationale: 이 절은 전투 준비의 흐름 속에 있으므로, 단순 이동보다 공격적 접근의 함의를 살리는 것이 원문과 영어 POB 주석의 취지를 더 잘 따릅니다.
  doctrine_reference: 내러티브 문맥 우선 해석 원칙
