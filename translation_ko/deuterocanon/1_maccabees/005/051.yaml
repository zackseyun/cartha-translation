base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/051.yaml
  text: And he destroyed every male with the edge of the sword[a], and uprooted it, and took the plunder of the city[b], and passed through the city over the slain.
  footnotes:
  - marker: a
    text: Literally, 'in the mouth of the sword,' an idiom meaning 'with the edge of the sword.'
    reason: lexical_alternative
  - marker: b
    text: Or 'rooted it out' / 'eradicated it.' The verb keeps the image of uprooting by the roots.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 칼날로 모든 남자를 멸하고, 그 성을 뿌리째 뽑아 버리고, 성의 노략물을 취하고, 성안에서 죽임당한 자들의 위를 지나갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘칼의 입으로’이지만, 이 히브리식/셈어식 관용은 ‘칼날로’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘뿌리째 뽑아 버리고’는 문자적으로는 식물을 뽑아내는 이미지로, 도시의 완전한 파괴를 비유적으로 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώλεσεν
  english_pob_choice: destroyed
  chosen_korean: 멸하고
  alternatives_korean:
  - 파괴하고
  - 죽이고
  - 멸망시키고
  lexicon: LSJ
  rationale: 전쟁 서술에서 ἀπόλλυμι의 강한 파괴·멸절 의미를 살리되, 한국어에서 자연스럽고 문맥에 맞게 과도하게 좁히지 않도록 ‘멸하다’를 썼습니다.
- source_word: πᾶν ἀρσενικόν
  english_pob_choice: every male
  chosen_korean: 모든 남자
  alternatives_korean:
  - 모든 남성
  - 남자들 모두
  - 각 남자
  lexicon: LSJ
  rationale: 성별을 분명히 하는 포괄 표현을 유지했습니다. ‘남성’보다 서사 문맥에서 더 직설적이며, 원문의 가혹함도 덜어내지 않습니다.
- source_word: ἐν στόματι ῥομφαίας
  english_pob_choice: with the edge of the sword
  chosen_korean: 칼날로
  alternatives_korean:
  - 칼의 입으로
  - 검날로
  - 칼끝으로
  lexicon: LSJ
  rationale: 직역형 은유인 ‘칼의 입으로’는 한국어에서 부자연스러워, 관용적 대응인 ‘칼날로’를 택해 원문 이미지와 폭력을 함께 전달했습니다.
- source_word: ἐξερρίζωσεν
  english_pob_choice: uprooted it
  chosen_korean: 뿌리째 뽑아 버리고
  alternatives_korean:
  - 뿌리 뽑고
  - 근본부터 없애고
  - 근절하고
  lexicon: LSJ
  rationale: 동사의 식물 비유를 살려 ‘뿌리째 뽑다’로 옮겼습니다. 단순히 ‘없애다’로 약화시키지 않고, 도시의 완전한 제거 이미지를 보존했습니다.
- source_word: τὰ σκῦλα τῆς πόλεως
  english_pob_choice: the plunder of the city
  chosen_korean: 성의 노략물
  alternatives_korean:
  - 도시의 전리품
  - 그 성의 약탈물
  - 성의 전리품
  lexicon: LSJ
  rationale: 전쟁에서 취한 전리품이라는 뜻을 분명히 하면서도, 한국어 성경체에서 자연스러운 ‘노략물’을 사용해 약탈의 성격을 드러냈습니다.
theological_decisions:
- issue: 전쟁 폭력의 강도와 범위
  chosen_reading: ‘모든 남자’, ‘칼날로’, ‘뿌리째 뽑아 버리고’처럼 원문의 잔혹한 전쟁 묘사를 완화하지 않고 그대로 드러냈습니다.
  alternative_readings:
  - ‘패배시키고’로 완화
  - ‘도시를 점령하고’로 완화
  - 파괴 이미지를 생략
  rationale: 본문은 전멸에 가까운 폭력의 규모를 서술합니다. 번역이 이를 누그러뜨리면 저자의 의도와 독자가 받아야 할 충격이 약화되므로, 강한 표현을 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 6
