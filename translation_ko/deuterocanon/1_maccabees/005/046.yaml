  yaml_path: translation/deuterocanon/1_maccabees/005/046.yaml
  text: And they came as far as Ephron. This was a large city at the entrance[a], very strong. There was no way to turn aside from it to the right or to the left, but only to go through the middle of it.
  footnotes:
  - marker: a
    text: Or 'at the pass' or 'at the approach'; the Greek phrase identifies Ephron as controlling the entrance route, which explains why they could not go around it.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 에브론에까지 이르렀습니다. 이곳은 입구[a]에 있는 큰 성읍으로, 매우 견고하였습니다. 그곳을 비켜 오른쪽으로나 왼쪽으로나 돌아갈 길이 없었고, 오직 그 한가운데를 지나가야만 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘입구’는 문자적으로는 εἰσόδου의 기본 의미를 따른 것이며, 문맥상 길목·접근로의 의미도 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον ἕως Ἐφρών
  english_pob_choice: they came as far as Ephron
  chosen_korean: 에브론에까지 이르렀습니다
  alternatives_korean:
  - 에브론에 도착했습니다
  - 에브론에 이르렀습니다
  lexicon: LSJ
  rationale: ἕως + 지명은 도착점의 한계까지 갔음을 나타내므로, 한국어에서도 ‘-에까지 이르렀습니다’로 범위를 살렸습니다.
- source_word: αὕτη ἡ πόλις μεγάλη
  english_pob_choice: This was a large city
  chosen_korean: 이곳은 입구에 있는 큰 성읍으로
  alternatives_korean:
  - 이 성읍은 큰 성읍이었습니다
  - 이 도시는 큰 도시였습니다
  lexicon: LSJ
  rationale: αὕτη를 단순히 지시어로만 두기보다 앞선 지명에 대한 설명문으로 풀어, 자연스러운 현대 한국어의 설명 구조를 유지했습니다.
- source_word: ἡ τῆς εἰσόδου
  english_pob_choice: at the entrance
  chosen_korean: 입구에 있는
  alternatives_korean:
  - 입구의
  - 접근로에 있는
  - 고개목에 있는
  lexicon: LSJ
  rationale: 여기서의 속격구는 성읍의 전략적 위치를 가리키므로, 문맥상 ‘입구에 있는’이 가장 직접적이고 이해하기 쉽습니다.
- source_word: οὐκ ἦν ἐκκλῖναι ἀπ’ αὐτῆς δεξιὰν ἢ ἀριστεράν
  english_pob_choice: There was no turning aside from it to the right or to the left
  chosen_korean: 그곳을 비켜 오른쪽으로나 왼쪽으로나 돌아갈 길이 없었고
  alternatives_korean:
  - 그곳에서 오른쪽이나 왼쪽으로 비켜갈 수 없었고
  - 그곳을 오른쪽이나 왼쪽으로 돌아 피할 수 없었고
  lexicon: LSJ
  rationale: 부정사구가 가능성 부재를 나타내므로, ‘돌아갈 길이 없었고’로 자연스럽게 옮기되 우회 불가능이라는 의미를 보존했습니다.
- source_word: διὰ μέσου αὐτῆς πορεύεσθαι
  english_pob_choice: to go through the middle of it
  chosen_korean: 오직 그 한가운데를 지나가야만 했습니다
  alternatives_korean:
  - 오직 그 한복판을 통과해야 했습니다
  - 오직 그 가운데를 지나야 했습니다
  lexicon: LSJ
  rationale: διὰ μέσου는 ‘가운데를 통하여’라는 뜻이므로, 경로가 성읍 내부를 직접 통과해야 했다는 점을 분명히 했습니다.
theological_decisions:
- issue: 전략적 지형 묘사의 직설성 유지
  chosen_reading: ‘입구에 있는 큰 성읍’과 ‘그 한가운데를 지나가야만 했습니다’로, 우회 불가능한 지형적 압박을 그대로 드러냈습니다.
  alternative_readings:
  - ‘통로에 있는 성읍’처럼 완화하여 표현
  - ‘에둘러 갈 수 없었습니다’로만 일반화
  rationale: 본문은 단순한 크기 묘사가 아니라 길목을 장악한 요새 도시의 현실을 강조하므로, 그 긴장을 약화시키지 않았습니다.
  doctrine_reference: 서사 문맥의 역사·지리적 사실성 보존
- issue: 성읍/도시 용어 선택
  chosen_reading: ‘성읍’을 사용해 요새화된 거점의 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘도시’
  - ‘성’
  rationale: πόλις가 일반적으로 ‘도시’이지만, 여기서는 군사적·전략적 함의가 강해 한국어의 ‘성읍’이 문맥상 더 적합합니다.
  doctrine_reference: 본문 맥락의 지리적·군사적 의미 보존
