  text: And Timothy’s camp recognized that it was Maccabeus[a], and they fled from before him; and he struck them with a great blow, and as many as eight thousand of them fell on that day.
  footnotes:
  - marker: a
    text: Or “eight thousand men”; the Greek expression may be read as an approximate or rounded total.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 티모테오의 진영은 그것이 마카베오인 줄 알고 그 앞에서 도망하였으며, 그가 그들을 크게 쳐서 그날에 그들 가운데 무려 팔천 명가량이 쓰러졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “팔천 명의 남자들”; 헬라어 표현은 대략적이거나 반올림된 수로 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ παρεμβολὴ Τιμοθέου
  english_pob_choice: Timothy’s camp
  chosen_korean: 티모테오의 진영
  alternatives_korean:
  - 티모테오의 야영지
  - 티모테오의 군대
  lexicon: LSJ
  rationale: παρεμβολή는 군사적 ‘진영, 캠프’의 뜻이 자연스러워 ‘진영’으로 옮겼습니다. 고유명은 한국어 음역 관행에 맞게 티모테오로 적었습니다.
- source_word: ἐπέγνω ... ὅτι
  english_pob_choice: recognized that
  chosen_korean: '...인 줄 알고'
  alternatives_korean:
  - '...임을 알아보고'
  - '...라는 것을 알아차리고'
  lexicon: BDAG
  rationale: 전투 상황에서 상대를 식별해 알아차리는 뜻이므로, ‘알고’보다 조금 더 분명한 인지 결과를 드러내는 ‘인 줄 알고’를 택했습니다.
- source_word: ἔφυγον ἀπὸ προσώπου αὐτοῦ
  english_pob_choice: fled from before him
  chosen_korean: 그 앞에서 도망하였으며
  alternatives_korean:
  - 그 앞에서 달아났으며
  - 그의 앞에서 도망쳤으며
  lexicon: LSJ
  rationale: ‘from before his face/presence’라는 셈어적 표현을 한국어에서 자연스럽게 살리되, 과도하게 직역된 느낌은 피했습니다.
- source_word: εἰς ὀκτακισχιλίους ἄνδρας
  english_pob_choice: as many as eight thousand of them
  chosen_korean: 무려 팔천 명가량이
  alternatives_korean:
  - 팔천 명에 이르렀습니다
  - 팔천 명이나
  lexicon: LSJ
  rationale: εἰς ὀκτακισχιλίους는 대략적 또는 한계치에 가까운 수량으로 읽을 수 있어, POB의 주석 취지를 반영해 ‘팔천 명가량’으로 옮겼습니다.
theological_decisions:
- issue: 전투 결과를 나타내는 동사와 수량 표현
  chosen_reading: ‘그가 그들을 크게 쳐서 ... 무려 팔천 명가량이 쓰러졌습니다’로, 전술적 패배를 직접적으로 드러냈습니다.
  alternative_readings:
  - ‘크게 패배시켰습니다’
  - ‘큰 타격을 주었습니다’
  rationale: 헬라어의 ‘쳤다/때렸다’와 ‘쓰러졌다’의 직설성을 보존하는 편이 본문이 전하는 압도적 전투 결과를 더 선명하게 전달합니다.
  doctrine_reference: 서사 본문 번역 원칙
