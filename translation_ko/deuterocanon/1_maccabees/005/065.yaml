  yaml_path: translation/deuterocanon/1_maccabees/005/065.yaml
  text: And Judas and his brothers went out[a], and they fought the sons of Esau in the land to the south, and he struck Hebron and its daughter towns; he tore down its fortress[b], and he burned its towers all around.
  footnotes:
  - marker: a
    text: Or 'the Edomites' (literally, 'the sons of Esau').
    reason: alternative_reading
  - marker: b
    text: '''Daughter towns'' refers to smaller settlements dependent on a main city.'
    reason: cultural_note
translation:
  language: ko
  text: 유다와 그의 형제들이 나가서 남쪽 땅에서 에서의 자손들과[a] 싸웠습니다. 유다는 헤브론과 그 딸 마을들[b]을 쳤고, 그 성채를 헐어 버렸으며, 사방의 탑들을 불태웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘에돔 사람들’(직역하면 ‘에서의 아들들’)입니다.
    reason: alternative_reading
  - marker: b
    text: ‘딸 마을들’은 주요 도시를 중심으로 의존하는 작은 정착지를 가리키는 관용적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: τοὺς υἱοὺς Ἠσαῦ
  english_pob_choice: the sons of Esau
  chosen_korean: 에서의 자손들
  alternatives_korean:
  - 에돔 사람들
  - 에서의 아들들
  lexicon: LSJ
  rationale: 그리스어의 직역인 ‘에에서의 아들들/자손들’ 구조를 살리면서, 한국어에서는 자연스러운 혈통 표현인 ‘자손들’을 택했습니다. 이는 영어 POB의 문자적 선택과도 맞물립니다.
- source_word: ἐν τῇ γῇ τῇ πρὸς νότον
  english_pob_choice: in the land to the south
  chosen_korean: 남쪽 땅에서
  alternatives_korean:
  - 남쪽 땅에서
  - 남방의 땅에서
  - 네겝에서
  lexicon: LSJ
  rationale: 그리스어의 ‘남쪽을 향한/남쪽에 있는 땅’이라는 지시를 간결하게 옮겼습니다. 본문이 지명 자체보다 방향성을 말하므로 ‘네겝’으로 특정하지 않았습니다.
- source_word: τὰς θυγατέρας αὐτῆς
  english_pob_choice: its daughter towns
  chosen_korean: 그 딸 마을들
  alternatives_korean:
  - 그 딸 도시들
  - 그 속주 마을들
  - 그 종속 마을들
  lexicon: LSJ
  rationale: ‘딸들’은 본문에 있는 지리적 관용구를 반영합니다. 한국어에서는 직접적이되 이해 가능한 ‘딸 마을들’로 옮겨 하위 정착지라는 뜻을 살렸습니다.
- source_word: τὸ ὀχύρωμα αὐτῆς
  english_pob_choice: its fortress
  chosen_korean: 그 성채
  alternatives_korean:
  - 그 요새
  - 그 요새진
  - 그 견고한 방어시설
  lexicon: LSJ
  rationale: ὀχύρωμα는 방어를 위한 견고한 구조물을 가리키므로, 군사적 문맥에서 자연스러운 ‘성채’를 선택했습니다.
theological_decisions:
- issue: τοὺς υἱοὺς Ἠσαῦ를 민족명으로 풀지 않고 혈통 표현을 유지할지 여부
  chosen_reading: ‘에서의 자손들’로 직역해 혈연-역사적 표현을 유지했습니다.
  alternative_readings:
  - 에돔 사람들
  - 에서의 아들들
  rationale: 본문의 상호본문성은 ‘에서’라는 조상 이름을 유지할 때 더 분명해집니다. 영어 POB도 ‘the sons of Esau’를 택해 해석을 절제했으므로 이를 따랐습니다.
  doctrine_reference: Translation philosophy §§1, 5
