revisions:
- from: 그리고 유다와 그의 형제들이 나가서 남쪽 땅에서 에서의 자손들과 싸웠습니다. 그들은 헤브론과 그 딸 마을들을 쳤고, 그 성채를 헐어 버렸으며, 그 탑들을 사방으로 불살랐습니다.[a][b]
  to: 유다와 그의 형제들이 나가서 남쪽 땅에서 에서의 자손들과[a] 싸웠습니다. 유다는 헤브론과 그 딸 마을들[b]을 쳤고, 그 성채를 헐어 버렸으며, 사방의 탑들을 불태웠습니다.
  rationale: 원문의 서술 구조에 따라 첫 행위는 유다와 그의 형제들의 공동 행위로, 이어지는 세 행위는 단수형이 가리키는 유다의 행위로 번역했습니다. 혈통 표현과 지리적 관용구는 유지하고, 각주 표지를 해당 표현에 연결했습니다.
