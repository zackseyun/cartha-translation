base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/022.yaml
  text: And he pursued them as far as the cities of Ptolemais[a]; and about three thousand men from the nations fell[b], and he took their spoils.
  footnotes:
  - marker: a
    text: Or 'three thousand men' without the nuance of approximation; the Greek expression εἰς τρισχιλίους ἄνδρας can be read as an approximate total or as a simple count.
    reason: lexical_alternative
  - marker: b
    text: '''From the nations'' refers to non-Israelite peoples in the opposing forces; some translations render this ''of the Gentiles.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 그들을 프톨레마이스의 여러 성읍들까지 추격하였으며, 그 민족들 가운데서 약 삼천 명의 사람이 쓰러졌고, 그는 그들의 전리품을 차지하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 표현 εἰς τρισχιλίους ἄνδρας는 대략적인 수량일 수도 있고, 단순히 ‘삼천 명’이라는 총수를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 민족들’은 전투에 참여한 비이스라엘계 집단을 가리키며, 일부 번역은 이를 ‘이방인들’로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίωξεν
  english_pob_choice: pursued
  chosen_korean: 추격하였으며
  alternatives_korean:
  - 뒤쫓았으며
  - 추적하였으며
  lexicon: BDAG
  rationale: 전투 서술에서 계속 뒤를 좇는 뜻을 현대 한국어에서 가장 자연스럽게 나타내는 동사로 보았습니다.
- source_word: ἕως τῶν πόλεων Πτολεμαΐδος
  english_pob_choice: as far as the cities of Ptolemais
  chosen_korean: 프톨레마이스의 여러 성읍들까지
  alternatives_korean:
  - 프톨레마이스의 도시들까지
  - 프톨레마이스 성읍들까지
  lexicon: LSJ
  rationale: 복수형 πόλεων을 살려 ‘여러 성읍들’로 옮기고, ἕως의 도달 범위를 ‘~까지’로 드러냈습니다.
- source_word: ἐκ τῶν ἐθνῶν
  english_pob_choice: from the nations
  chosen_korean: 그 민족들 가운데서
  alternatives_korean:
  - 민족들 가운데서
  - 이방 민족들 가운데서
  lexicon: BDAG
  rationale: 문맥상 대적 진영의 비이스라엘계 집단을 가리키지만, 후대적인 ‘이방인’ 용어보다 원문의 넓은 민족적 표현을 유지했습니다.
- source_word: τὰ σκῦλα
  english_pob_choice: their spoils
  chosen_korean: 그들의 전리품을 차지하였습니다
  alternatives_korean:
  - 그들의 노획물을 취하였습니다
  - 그들의 전리품을 빼앗았습니다
  lexicon: LSJ
  rationale: 전쟁에서 얻은 노획물을 뜻하므로 ‘전리품’이 적합하며, 동사는 소유를 얻는 결과를 자연스럽게 보이도록 ‘차지하다’로 옮겼습니다.
theological_decisions:
- issue: εἰς τρισχιλίους ἄνδρας의 수량 표현
  chosen_reading: ‘약 삼천 명’으로 옮겨 근사치를 드러냈습니다.
  alternative_readings:
  - 삼천 명
  - 삼천 명에 이르렀다
  rationale: εἰς가 수량의 대략성을 띨 수 있으므로, 영어 POB의 처리와 일치하게 근사 표현을 살렸습니다.
  doctrine_reference: 서술의 정확성/수량 표현
- issue: 전투 서술의 결과 동사 ἔπεσον
  chosen_reading: ‘쓰러졌고’로 번역해 전투 맥락의 낙하/전사 이미지를 유지했습니다.
  alternative_readings:
  - 죽었고
  - 전사하였고
  rationale: 직역적 ‘fell’의 군사적 관용을 보존하되, 현대 한국어에서 자연스럽고 완곡하지 않게 전투 피해를 나타냈습니다.
  doctrine_reference: 서사 문체의 충실성
