  yaml_path: translation/deuterocanon/1_maccabees/005/009.yaml
  text: And the nations in Gilead gathered together against the Israelites who were within their borders[a], to wipe them out; and they fled into the stronghold at Dathema.
  footnotes:
  - marker: a
    text: Or 'to destroy them' or 'to root them out.' The Greek expression conveys an intent to remove them completely.
    reason: lexical_alternative
translation:
  language: ko
  text: 길르앗에 있던 민족들이 자기들의 영토 안에 있던 이스라엘 사람들을 모조리 없애려고[a] 그들을 대적하여 함께 모였습니다. 이스라엘 사람들은 다테마의 요새로 도망쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘멸망시키려고’, ‘뿌리 뽑으려고’. 그리스어 표현은 그들을 완전히 제거하려는 의도를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισυνήχθησαν
  english_pob_choice: gathered together
  chosen_korean: 함께 모였으므로
  alternatives_korean:
  - 모여들었으므로
  - 집결하였으므로
  lexicon: LSJ
  rationale: 복합동사가 지닌 집합·결집의 뉘앙스를 살리면서, 적대적 상황의 서술에 자연스럽게 맞추었습니다.
- source_word: τὰ ἔθνη
  english_pob_choice: the nations
  chosen_korean: 그 민족들
  alternatives_korean:
  - 그 나라들
  - 그 이방 민족들
  lexicon: LSJ
  rationale: 여기서는 주변 비이스라엘 집단들을 가리키므로, 문맥상 이해가 쉬운 ‘민족들’을 택하되 과도한 교회식 용어인 ‘이방인’은 피했습니다.
- source_word: τοὺς ὄντας ἐπὶ τοῖς ὁρίοις αὐτῶν
  english_pob_choice: who were within their borders
  chosen_korean: 자기들의 경계 안에 있는
  alternatives_korean:
  - 자기들의 경계에 있는
  - 자기들의 경계선 안쪽에 있는
  lexicon: LSJ
  rationale: 영문 POB의 수정판과 그리스어가 가리키는 영토 내부의 위치를 반영하여, 경계 ‘안’에 있음을 분명히 했습니다.
- source_word: τοῦ ἐξᾶραι αὐτούς
  english_pob_choice: to wipe them out
  chosen_korean: 모조리 없애려고
  alternatives_korean:
  - 완전히 없애려고
  - 뿌리 뽑으려고
  lexicon: LSJ
  rationale: 완전 제거 의도를 드러내는 동사구이므로, 현대 한국어에서 강도를 분명히 전달하는 표현을 택했습니다.
- source_word: τὸ ὀχύρωμα
  english_pob_choice: the stronghold
  chosen_korean: 요새
  alternatives_korean:
  - 성채
  - 산성
  lexicon: LSJ
  rationale: 방어용으로 요새화된 장소라는 뜻을 간결하고 자연스럽게 전달하는 표준적인 번역어입니다.
theological_decisions:
- issue: τὰ ἔθνη의 범주를 어떻게 옮길지
  chosen_reading: 주변 비이스라엘 집단을 가리키는 역사적 서술로 보고 ‘그 민족들’로 옮겼습니다.
  alternative_readings:
  - 그 이방 민족들
  - 그 나라들
  rationale: 마카베오기에서는 ‘the nations’가 특정한 비이스라엘 세력을 가리키는 역사적 표현이므로, 후대 신약 용례의 신학적 색채를 덧씌우지 않으면서도 문맥을 분명히 했습니다.
  doctrine_reference: 역사-서술 맥락의 민족 용례
- issue: ἐξᾶραι의 강도를 어떻게 표현할지
  chosen_reading: ‘모조리 없애려고’로 강한 제거 의도를 드러냈습니다.
  alternative_readings:
  - 없애려고
  - 뿌리 뽑으려고
  rationale: 단순한 해치기보다 집단을 완전 제거하려는 의도를 가진 표현이므로, 본문의 폭력성을 약화시키지 않는 방향으로 옮겼습니다.
  doctrine_reference: 본문의 서술적 폭력성 보존
