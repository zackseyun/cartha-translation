  source_fidelity: 개정이 필요합니다. τέμενος는 건물 하나인 ‘성소’보다 신성한 구획을 뜻하므로 ‘신전 경내’가 더 정확합니다. 또한 ‘성소를 불로 태워 그 안에 있던 모든 사람과 함께 멸하였다’는 한국어에서 ‘사람과 함께’의 결속 관계가 불명확하고, ‘멸하였다’가 원문의 불태움과 별개의 살해 행위를 덧붙이는 듯 들릴 수 있습니다. 카르나인이 더 이상 유다를 직접 맞서 견디지 못했다는 결말도 명시하는 편이 좋습니다.
  naturalness: ‘신전 경내를 그 안에 있던 모든 사람과 함께 불태웠으며’는 원문의 결속 관계를 자연스럽게 드러냅니다. ‘유다와 맞서 버틸 수 없었습니다’는 전투 문맥의 ὑποστῆναι 및 κατὰ πρόσωπον을 현대 한국어 합쇼체로 자연스럽게 옮깁니다.
  terminology: τέμενος는 ‘신전 경내’로 옮겨 성스러운 경계·구획이라는 범위를 보존했습니다. ‘카르나인’과 ‘유다’는 유지했습니다. ‘패배하여’는 도시명으로 표현된 집단의 군사적 패배를 한국어에서 무리 없이 나타냅니다.
