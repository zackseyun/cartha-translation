  text: And they seized the city[a], and they burned the temple precinct with fire, together with all who were in it; and Karnain was routed, and it could no longer stand before Judas.
  footnotes:
  - marker: a
    text: Or 'with all that was in it.' The Greek phrase could be read more broadly, though in context it likely refers to the people inside the sacred precinct.
