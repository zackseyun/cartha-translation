  text: And they seized the city[a], and they burned the temple precinct with fire, together with all who were in it; and Karnain was routed, and it could no longer stand before Judas.
  footnotes:
  - marker: a
    text: Or 'with all that was in it.' The Greek phrase could be read more broadly, though in context it likely refers to the people inside the sacred precinct.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그 도시를 점령하고, 성소를 불로 태워 그 안에 있던 모든 사람과 함께 멸하였으며, 카르나인은 격파되어 더 이상 유다 앞에 설 수 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 안에 있던 모든 것’으로도 읽을 수 있습니다. 다만 문맥상 사람들을 가리키는 뜻이 더 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προκατελάβοντο
  english_pob_choice: seized the city
  chosen_korean: 점령하고
  alternatives_korean:
  - 먼저 차지하고
  - 사로잡고
  - 선점하고
  lexicon: LSJ
  rationale: 전쟁 문맥에서 πόλιν을 취하는 뜻이므로, 한국어에서는 자연스럽고 강한 군사적 의미를 살리는 ‘점령하다’로 옮겼습니다.
- source_word: τέμενος
  english_pob_choice: temple precinct
  chosen_korean: 성소
  alternatives_korean:
  - 성전 구역
  - 신성한 경내
  - 성전 뜰
  lexicon: LSJ
  rationale: τέμενος는 단순한 건물보다 신성한 구획 전체를 가리키므로, 문맥상 성전 영역 전체를 포괄하는 ‘성소’로 번역했습니다.
- source_word: σὺν πᾶσιν τοῖς οὖσιν ἐν αὐτῷ
  english_pob_choice: together with all who were in it
  chosen_korean: 그 안에 있던 모든 사람과 함께
  alternatives_korean:
  - 그 안에 있던 모든 것과 함께
  - 그 안에 있던 모든 자와 함께
  lexicon: LSJ
  rationale: 이 구절은 문법상 넓게는 ‘그 안에 있던 모든 것’도 가능하지만, 군사 서술의 흐름상 사람을 가리키는 뜻이 가장 자연스러워 이를 본문에 반영했습니다.
- source_word: ἐτροπώθη
  english_pob_choice: was routed
  chosen_korean: 격파되어
  alternatives_korean:
  - 패주하여
  - 무너져
  - 도주하여
  lexicon: LSJ
  rationale: 전투에서 밀려 무너지는 뜻을 살리기 위해, 단순한 패배보다 강한 ‘격파되다’를 선택했습니다.
- source_word: κατὰ πρόσωπον Ἰούδα
  english_pob_choice: before Judas
  chosen_korean: 유다 앞에
  alternatives_korean:
  - 유다의 면전에서
  - 유다와 맞서
  - 유다를 마주하고
  lexicon: LSJ
  rationale: 직역적 ‘면전에서’는 한국어에서 다소 경직되므로, 대결 상황을 자연스럽게 드러내는 ‘유다 앞에’로 옮겼습니다.
theological_decisions:
- issue: 성소(τέμενος)의 범위
  chosen_reading: 성전 건물만이 아니라 신성한 경내 전체가 불탔다는 넓은 의미를 본문에 반영했습니다.
  alternative_readings:
  - 성전 건물만 불탔다고 제한해 읽는 번역
  - 성전 뜰로 좁혀 읽는 번역
  rationale: 영어 POB도 ‘temple precinct’로 범위를 넓게 잡고 있으며, 그 안의 사람들까지 함께 언급되므로 성소/경내의 포괄성을 유지하는 것이 문맥에 더 충실합니다.
  doctrine_reference: 문맥-서술적 판단
