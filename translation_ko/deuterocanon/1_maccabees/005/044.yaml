    rationale: ἐνεπύρισαν은 경내와 그 안의 이들을 함께 불태웠다는 한 행위를 서술합니다. ‘멸하였다’는 별도의 전멸 행위처럼 들릴 수 있으므로, ‘함께 불태웠다’로 결속 관계를 명료하게 해야 합니다.
