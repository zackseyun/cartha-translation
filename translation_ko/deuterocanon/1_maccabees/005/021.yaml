  text: And Simon went into Galilee, and fought many battles against the nations; and the nations were crushed before him.
translation:
  language: ko
  text: 시몬은 갈릴리로 가서 여러 민족들과 많은 전투를 벌였고, 그 민족들은 그의 앞에서 산산이 무너졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπορεύθη
  english_pob_choice: went
  chosen_korean: 가서
  alternatives_korean:
  - 갔습니다
  - 여행했습니다
  - 행진했습니다
  lexicon: LSJ
  rationale: ἐπορεύθη는 기본적으로 ‘가다/가서’의 의미이므로, 군사적 문맥을 유지하면서도 과도하게 특정화하지 않는 ‘가서’가 가장 자연스럽습니다.
- source_word: εἰς τὴν Γαλιλαίαν
  english_pob_choice: into Galilee
  chosen_korean: 갈릴리로
  alternatives_korean:
  - 갈릴리 안으로
  - 갈릴리까지
  lexicon: LSJ
  rationale: εἰς의 방향성을 한국어 조사 ‘-로’로 간결하게 옮겨 이동의 방향을 살렸습니다.
- source_word: συνῆψεν πόλεμους πολλοὺς
  english_pob_choice: fought many battles
  chosen_korean: 여러 차례 … 싸웠으며
  alternatives_korean:
  - 많은 전쟁을 벌였으며
  - 많은 전투를 치렀으며
  - 여러 전투를 벌였으며
  lexicon: LSJ
  rationale: πόλεμους πολλοὺς는 전쟁/전투의 복수적 반복을 나타내므로, 한국어에서는 ‘여러 차례’와 ‘싸웠으며’로 자연스럽게 풀어 반복적 군사 충돌의 뉘앙스를 살렸습니다.
- source_word: τὰ ἔθνη
  english_pob_choice: the nations
  chosen_korean: 그 민족들
  alternatives_korean:
  - 그 나라들
  - 이방 민족들
  - 민족들
  lexicon: LSJ
  rationale: 여기서는 신학적 용어로서의 ‘이방인’보다 군사적 상대 집단을 가리키므로, 문맥상 자연한 ‘그 민족들’을 택했습니다.
- source_word: συνετρίβη
  english_pob_choice: were crushed
  chosen_korean: 무너졌습니다
  alternatives_korean:
  - 산산이 부서졌습니다
  - 깨어졌습니다
  - 패배했습니다
  lexicon: LSJ
  rationale: συντρίβω의 ‘부서지다/짓눌려 무너지다’라는 강한 상을 한국어 동사 ‘무너지다’로 옮겨, 단순한 패배보다 더 강한 붕괴의 이미지를 보존했습니다.
- source_word: ἀπὸ προσώπου αὐτοῦ
  english_pob_choice: before him
  chosen_korean: 그의 앞에서
  alternatives_korean:
  - 그의 면전에서
  - 그 앞에서
  - 그의 존재 앞에서
  lexicon: LSJ
  rationale: 관용구적으로 ‘앞에서/면전에서’의 뜻이므로, 전투 장면에 자연한 ‘그의 앞에서’로 처리했습니다.
theological_decisions:
- issue: τὰ ἔθνη의 번역어 선택
  chosen_reading: ‘그 민족들’로 옮겨, 군사 서술의 대상 집단을 가리키는 의미를 우선했습니다.
  alternative_readings:
  - ‘이방 민족들’
  - ‘그 나라들’
  rationale: 본문은 선교적·구원사적 용례보다 전투 서술이 중심이므로, 특정한 신학적 색채를 덧씌우지 않는 표현을 택했습니다.
  doctrine_reference: 역사 서술의 문맥적 의미 우선
