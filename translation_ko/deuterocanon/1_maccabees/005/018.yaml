  text: And he left Joseph son of Zechariah and Azariah[a], leaders of the people, with the rest of the forces in Judea for defense.
  footnotes:
  - marker: a
    text: Or 'for guarding' or 'for protection.' The Greek phrase εἰς τήρησιν emphasizes keeping watch or guarding.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 요셉—자카리아의 아들—과 백성의 지도자 아자리아를 유다에 남겨, 나머지 군대와 함께 지키게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지키기 위해’ 또는 ‘보호하기 위해’일 수 있습니다. 그리스어 표현 εἰς τήρησιν은 감시하거나 지키는 뜻을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέλιπεν
  english_pob_choice: left
  chosen_korean: 남겨
  alternatives_korean:
  - 두고 갔습니다
  - 남겨 두었습니다
  lexicon: LSJ
  rationale: 군사적 파견 맥락에서 단순히 ‘남기다/남겨 두다’가 원문의 ‘left behind’와 가장 직접적으로 맞고, 뒤의 목적절과도 자연스럽게 연결됩니다.
- source_word: Ἰώσηφον τὸν τοῦ Ζαχαρίου
  english_pob_choice: Joseph son of Zechariah
  chosen_korean: 요셉—자카리아의 아들—
  alternatives_korean:
  - 요셉, 자카리아의 아들
  - 자카리아의 아들 요셉
  lexicon: LSJ
  rationale: 그리스어의 친족표현 τὸν τοῦ + genitive를 한국어의 ‘~의 아들’로 옮기되, 문장 흐름을 해치지 않도록 삽입 표지로 묶었습니다.
- source_word: ἡγούμενον τοῦ λαοῦ
  english_pob_choice: leader of the people
  chosen_korean: 백성의 지도자
  alternatives_korean:
  - 백성의 인도자
  - 백성을 다스리는 자
  lexicon: LSJ
  rationale: ἡγούμενος는 단순한 직함보다 ‘앞서 이끄는 사람’의 뜻이 강하므로, 과도하게 관료화하지 않고 ‘지도자’로 옮겼습니다.
- source_word: εἰς τήρησιν
  english_pob_choice: for defense
  chosen_korean: 지키게 하였습니다
  alternatives_korean:
  - 보호하게 하였습니다
  - 경계하게 하였습니다
  - 수비하게 하였습니다
  lexicon: LSJ
  rationale: τήρησις는 ‘지킴, 감시, 보호’의 의미권을 가지며, 이 문맥에서는 남겨진 병력의 목적을 ‘지키다’로 드러내는 것이 가장 직접적입니다.
- source_word: μετὰ τῶν ἐπιλοίπων τῆς δυνάμεως
  english_pob_choice: with the rest of the forces
  chosen_korean: 나머지 군대와 함께
  alternatives_korean:
  - 남은 군대와 함께
  - 나머지 병력과 함께
  lexicon: LSJ
  rationale: δύναμις는 군사 문맥에서 병력/군대를 가리키므로 ‘군대’로 자연스럽게 옮겼고, ἐπίλοιπος는 ‘남은, 나머지’의 뜻을 살렸습니다.
theological_decisions:
- issue: τήρησις의 목적을 군사적 수비로 어떻게 전달할지
  chosen_reading: ‘지키게 하였습니다’로 옮겨, 단순한 정주가 아니라 경계·보호의 행위를 드러냈습니다.
  alternative_readings:
  - 수비하게 하였습니다
  - 보호하게 하였습니다
  rationale: 본문은 유다 땅에 남겨 둔 병력의 기능을 설명하므로, 전투적·보호적 뉘앙스를 유지하되 과도한 해석을 피하는 표현이 적절합니다.
  doctrine_reference: 문맥상 역사 서술; 별도의 교리 쟁점 없음
