    reason: lexical_alternative
  - marker: b
    text: ‘우리 형제들’은 혈연 형제들만이 아니라 동족 이스라엘을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς ἀνδράσιν τῆς δυνάμεως
  english_pob_choice: to the men of the force
  chosen_korean: 그 힘의 사람들에게
  alternatives_korean:
  - 그 군사들에게
  - 그 전사들에게
  lexicon: LSJ
  rationale: ἀνήρ와 δύναμις의 결합을 직역하면 ‘힘의 사람들’이 되며, 군사 집단을 가리키는 원문 감각을 살리면서도 한국어에서 자연스럽게 읽히도록 했습니다.
- source_word: Πολεμήσατε
  english_pob_choice: Fight
  chosen_korean: 싸우십시오
  alternatives_korean:
  - 전투하십시오
  - 전쟁하십시오
  lexicon: LSJ
  rationale: 긴급한 전투 명령을 현대 한국어의 직접적 명령형으로 옮겼습니다. ‘싸우십시오’가 명령의 즉시성과 구어적 자연스러움을 함께 살립니다.
- source_word: σήμερον
  english_pob_choice: today
  chosen_korean: 오늘
  alternatives_korean:
  - 이날
  - 지금
  lexicon: LSJ
  rationale: σήμερον의 현재성·긴급성을 가장 자연스럽게 드러내는 표준어 표현입니다.
- source_word: τῶν ἀδελφῶν ἡμῶν
  english_pob_choice: our brothers
  chosen_korean: 우리 형제들
  alternatives_korean:
  - 우리 형제자매들
  - 우리 동족
  lexicon: LSJ
  rationale: 그리스어 남성 복수형을 따라 ‘형제들’로 옮겨 공동체적 연대를 보존했습니다. 이 표현은 문맥상 혈연만이 아니라 동족/동료 이스라엘인을 포괄할 수 있습니다.
theological_decisions:
- issue: 형제들의 범위
  chosen_reading: ‘우리 형제들’은 문자적으로 형제들을 가리키되, 문맥상 동족 이스라엘 전체를 포함할 수 있습니다.
  alternative_readings:
  - 우리 형제자매들
  - 우리 동족
  rationale: 원문 ἀδελφῶν의 남성 복수형을 지키면서도, 이 전투 호소가 단순한 혈연보다 공동체적 연대를 가리킬 수 있음을 훼손하지 않도록 했습니다.
  doctrine_reference: 'DOCTRINE.md §Translation philosophy #4'
