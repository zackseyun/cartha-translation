  text: 그리고 그들 중 많은 사람이 보소라와 보소르[a], 알라미스, 카스포르, 마케드, 카르나임에 갇혀 있습니다. 이 모든 도시는 요새화되어 있고 큽니다.
  philosophy: optimal-equivalence
  footnotes:
