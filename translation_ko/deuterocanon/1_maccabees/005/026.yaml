  source_fidelity: 전반적으로 그리스어 본문을 충실히 옮겼습니다. συνειλημμένοι는 ‘갇혀 있습니다’로 무리 없이 반영되었고, 열거된 지명들 안에 많은 사람이 갇혀 있다는 뜻과 ‘모든 이 도시들은 요새화되어 있고 크다’는 결론도 보존되었습니다. 다만 Ἀλάμοις 및 영어 감사 기록의 Alamis에 비추어 ‘알라모스’는 음역상 덜 정확하므로 ‘알라미스’로 고치는 것이 안전합니다.
  naturalness: 합쇼체 문장과 문체는 자연스럽습니다. 둘째 문장의 ‘크기 또한 큽니다’는 원문의 단순 병렬보다 약간 부연적이므로, ‘요새화되어 있고 큽니다’가 더 간결하고 직접적입니다.
  terminology: ‘요새화되어 있고’는 ὀχυραὶ의 방어적 의미를 정확히 전달합니다. 지명은 스웨테 본문에 가까운 보수적 음역 원칙을 유지하되, Ἀλάμοις는 ‘알라미스’로 표기하는 편이 영어 POB 감사 기록 및 한국어 음역의 일관성에 맞습니다.
