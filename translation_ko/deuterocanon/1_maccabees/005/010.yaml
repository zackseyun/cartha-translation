  source_fidelity: 그리스어의 핵심 내용은 대체로 충실합니다. 다만 ἐπισυνηγμένοι εἰσιν은 완료의 결과로 현재 집결해 있는 상태를 나타내므로, ‘함께 모였습니다’보다 ‘함께 모여 있습니다’가 더 잘 반영합니다. 또한 원문은 인용된 호소가 다음 절로 이어지는 문장이므로, 이 절 끝의 쉼표를 보존하는 편이 적절합니다.
  naturalness: ‘우리에게 맞서 함께 모였습니다’는 이해 가능하지만, ‘우리를 대적하여 함께 모여 있습니다’가 현대의 격식 있는 성경 문체에서 더 자연스럽고 결속이 좋습니다. 직접 인용의 시작은 마침표보다 콜론으로 처리하는 것이 자연스럽습니다.
  terminology: ‘유다’, ‘그의 형제들’, ‘편지’, ‘주위의 민족들’은 적절합니다. ἐξᾶραι의 제거·파멸 의도는 ‘우리를 멸하려고’로 보존할 수 있습니다. 각주 표지는 해당 어구 바로 뒤에 두어 대체 어휘의 적용 범위를 명확히 했습니다.
