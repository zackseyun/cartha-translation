  text: Now then[a], come and rescue us from their hand[b], because a great number of our people has fallen.
  footnotes:
  - marker: a
    text: Or 'deliver us from their power.' The Greek says literally 'from their hand,' a common idiom for hostile control.
    reason: lexical_alternative
  - marker: b
    text: Or 'many from among us have fallen.' The Greek does not specify whether 'fallen' emphasizes death, defeat, or both.
    reason: alternative_reading
translation:
  language: ko
  text: 그러니 이제 오셔서 그들의 손에서[a] 우리를 구원하소서. 우리 가운데 많은 사람이 쓰러졌습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들의 손에서’입니다. 적대적인 지배나 세력을 가리키는 흔한 관용 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: πέπτωκεν은 문자적으로 ‘쓰러졌다’는 뜻입니다. 여기서는 죽음과 패배 가운데 어느 하나만을 특정하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: νῦν οὖν
