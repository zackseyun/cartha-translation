  - marker: b
    text: Or 'many from among us have fallen.' The Greek does not specify whether 'fallen' emphasizes death, defeat, or both.
    reason: alternative_reading
translation:
  language: ko
  text: 이제 그러하니, 오셔서 그들의 손에서 우리를 구원하소서. 많은 우리 사람들이 쓰러졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '그들의 손에서'입니다. 적대적 지배를 가리키는 흔한 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: πέπτωκεν은 문자적으로 '쓰러졌다'는 뜻이며, 여기서는 죽음과 패배를 모두 열어 둡니다.
    reason: alternative_reading
lexical_decisions:
- source_word: νῦν οὖν
