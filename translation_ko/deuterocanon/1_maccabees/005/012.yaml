theological_decisions:
- issue: 구원 청원의 직접성
  chosen_reading: 명령형 청원을 한국어 기도체로 살려 '오셔서 … 구원하소서'로 번역했습니다.
  alternative_readings:
  - 오셔서 우리를 구원해 주십시오
  - 오셔서 우리를 건져 내소서
  rationale: 본문은 단순 정보가 아니라 위기 속 탄원으로 제시되므로, 한국어에서도 간청의 절박함이 드러나야 합니다.
  doctrine_reference: lament/prayer register
- issue: πέπτωκεν의 의미 범위
  chosen_reading: '''쓰러졌습니다''로 옮겨, 죽음과 패배의 둘 다를 열어 둔 채 상황적 비참을 드러냈습니다.'
  alternative_readings:
  - 죽었습니다
  - 패배했습니다
  rationale: 그리스어는 구체적으로 죽음만을 지시하지 않으므로, 해석을 과도하게 좁히지 않는 표현이 필요합니다.
  doctrine_reference: semantic ambiguity
