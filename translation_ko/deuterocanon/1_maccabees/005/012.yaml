  rationale: 부르짖는 청원문이므로 동작을 나란히 이어 주는 형태로 옮기되, ἔξελου의 구조적·상황적 의미를 '구원하소서'로 살렸습니다.
- source_word: ἐκ χειρὸς αὐτῶν
  english_pob_choice: from their hand
  chosen_korean: 그들의 손에서
  alternatives_korean:
  - 그들의 권세에서
  - 그들의 손아귀에서
  lexicon: LSJ
  rationale: 직역적 은유를 유지하여 적대적 통제라는 관용구의 힘을 살렸고, 한국어에서도 그대로 이해되도록 했습니다.
- source_word: πέπτωκεν ἐξ ἡμῶν πλῆθος
  english_pob_choice: a great number of our people has fallen
  chosen_korean: 많은 우리 사람들이 쓰러졌습니다
  alternatives_korean:
  - 우리 가운데 큰 무리가 쓰러졌습니다
  - 우리 사람들 가운데 많은 이들이 쓰러졌습니다
  lexicon: LSJ
  rationale: πλῆθος의 양적 강조를 '많은'으로, πέπτωκεν의 결과적 붕괴를 '쓰러졌습니다'로 옮겨 죽음·패배의 여지를 지나치게 한정하지 않았습니다.
theological_decisions:
- issue: 구원 청원의 직접성
  chosen_reading: 명령형 청원을 한국어 기도체로 살려 '오셔서 … 구원하소서'로 번역했습니다.
  alternative_readings:
  - 오셔서 우리를 구원해 주십시오
  - 오셔서 우리를 건져 내소서
  rationale: 본문은 단순 정보가 아니라 위기 속 탄원으로 제시되므로, 한국어에서도 간청의 절박함이 드러나야 합니다.
  doctrine_reference: lament/prayer register
- issue: πέπτωκεν의 의미 범위
  chosen_reading: '''쓰러졌습니다''로 옮겨, 죽음과 패배의 둘 다를 열어 둔 채 상황적 비참을 드러냈습니다.'
  alternative_readings:
  - 죽었습니다
  - 패배했습니다
  rationale: 그리스어는 구체적으로 죽음만을 지시하지 않으므로, 해석을 과도하게 좁히지 않는 표현이 필요합니다.
  doctrine_reference: semantic ambiguity
