  lexicon: LSJ
  rationale: 급박한 요청에 담긴 시간적·결론적 연결을 함께 살리기 위해 '이제 그러하니'로 옮겼습니다.
- source_word: ἐλθὼν ἔξελου
  english_pob_choice: come and rescue
  chosen_korean: 오셔서 … 구원하소서
