base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/061.yaml
  text: And there was a great rout among the people[a], because they had not listened to Judas and his brothers[b], thinking that they themselves would act bravely.
  footnotes:
  - marker: a
    text: Or 'a great defeat' or 'a great panic'; the Greek term denotes a turning to flight, hence 'rout.'
    reason: lexical_alternative
  - marker: b
    text: Or 'thinking that they would prove themselves valiant.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 백성 가운데 큰 패주가 일어났습니다.[a] 이는 그들이 유다와 그의 형제들의 말을 듣지 않고, 자신들이 용감히 행동할 수 있다고 생각했기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘큰 패배’나 ‘큰 공황’이라고도 옮길 수 있습니다. 그리스어 τροπή는 본래 도주로 돌아서는 것을 가리키므로, 여기서는 ‘패주’가 가장 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자신들이 용맹함을 입증할 것이라고 생각하며’라고도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τροπὴ μεγάλη
  english_pob_choice: a great rout
  chosen_korean: 큰 패주
  alternatives_korean:
  - 큰 패배
  - 큰 혼란
  - 큰 도주
  lexicon: LSJ
  rationale: τροπή는 군사적 문맥에서 단순한 ‘변화’가 아니라 패전으로 인한 무너짐과 도주를 가리키므로, 한국어로는 군사적 뉘앙스를 살린 ‘패주’가 가장 가깝습니다.
- source_word: ἐν τῷ λαῷ
  english_pob_choice: among the people
  chosen_korean: 백성들 가운데
  alternatives_korean:
  - 사람들 가운데
  - 그 백성 가운데
  - 군중 가운데
  lexicon: LSJ
  rationale: λαός를 문맥상 전투 집단으로만 좁히지 않고, 원문의 넓은 지시를 살려 ‘백성들 가운데’로 옮겼습니다.
- source_word: οὐκ ἤκουσαν
  english_pob_choice: had not listened to
  chosen_korean: 말을 듣지 않았기 때문입니다
  alternatives_korean:
  - 귀를 기울이지 않았기 때문입니다
  - 순종하지 않았기 때문입니다
  lexicon: LSJ
  rationale: ἀκούω + 속격은 단순 청취보다 ‘듣고 따르다/주의를 기울이다’의 뜻을 띠므로, 원문의 인과관계를 자연스럽게 드러내는 ‘말을 듣지 않았다’로 옮겼습니다.
- source_word: ἀνδραγαθῆσαι
  english_pob_choice: would act bravely
  chosen_korean: 용감하게 싸울 수 있다고
  alternatives_korean:
  - 용맹을 떨칠 수 있다고
  - 영웅적으로 행동할 수 있다고
  lexicon: LSJ
  rationale: 동사는 ‘남자답게 훌륭한 용맹을 보이다’의 뜻이지만, 직역투를 피하면서도 전투 상황의 의미를 살려 ‘용감하게 싸우다’로 옮겼습니다.
theological_decisions:
- issue: 자기 확신에 대한 강조와 책임의 인과 관계
  chosen_reading: 그들의 패주는 유다와 형제들의 말을 듣지 않은 데서 비롯되었고, 그들은 자기들만의 용맹을 기대했습니다.
  alternative_readings:
  - 단순한 서술적 배경으로만 읽을 수 있습니다.
  - 도덕적 책임을 강하게 부각하지 않고 중립적으로 읽을 수 있습니다.
  rationale: ὅτι는 앞선 ‘큰 패주’의 이유를 분명히 제시하므로, 원문의 역사적·서사적 인과를 흐리지 않도록 그대로 반영했습니다.
  doctrine_reference: 서사적 인과를 보존하되, 텍스트 밖의 신학적 확장이나 판단은 덧붙이지 않습니다.
