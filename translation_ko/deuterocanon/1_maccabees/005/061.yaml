  text: καὶ ἐγενήθη τροπὴ μεγάλη ἐν τῷ λαῷ, ὅτι οὐκ ἤκουσαν Ἰούδα καὶ τῶν ἀδελφῶν αὐτοῦ, οἰόμενοι ἀνδραγαθῆσαι αὐτοί.
