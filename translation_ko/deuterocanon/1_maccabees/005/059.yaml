  text: And Gorgias came out from the city, and his men, to meet them in battle.
translation:
  language: ko
  text: 고르기아스가 그 도시에서 나왔고, 그의 부하들도 그들을 맞아 싸우려고 나왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν
  english_pob_choice: came out
  chosen_korean: 나왔으며
  alternatives_korean:
  - 나갔으며
  - 밖으로 나왔으며
  lexicon: BDAG
  rationale: ἐξέρχομαι의 이동 방향을 살려 ‘나왔으며’로 옮겼고, 서술 흐름상 자연스러운 합쇼체 연결로 처리했습니다.
- source_word: πόλεως
  english_pob_choice: city
  chosen_korean: 성
  alternatives_korean:
  - 도시
  - 읍
  lexicon: BDAG
  rationale: 군사적·방어적 맥락에서 πόλις를 단순 행정 단위보다 ‘성’으로 옮기면 출정 장면의 이미지가 더 분명해집니다.
- source_word: οἱ ἄνδρες αὐτοῦ
  english_pob_choice: his men
  chosen_korean: 그의 부하들
  alternatives_korean:
  - 그의 사람들
  - 그의 병사들
  lexicon: BDAG
  rationale: 직역상 ‘그의 남자들’이지만 한국어에서는 전투를 따르는 수행 무리를 자연스럽게 가리키는 ‘부하들’이 문맥에 맞습니다.
- source_word: εἰς συνάντησιν αὐτοῖς εἰς πόλεμον
  english_pob_choice: to meet them in battle
  chosen_korean: 그들과 만나 전쟁하려고
  alternatives_korean:
  - 그들과 마주치려고 전쟁터로
  - 그들과 맞서 싸우려고
  lexicon: BDAG
  rationale: εἰς συνάντησιν은 ‘만나’로, 뒤의 εἰς πόλεμον은 목적을 드러내는 ‘전쟁하려고’로 풀어 두 군사적 요소를 모두 살렸습니다.
theological_decisions:
- issue: 전투 동사의 결합을 한국어에서 어떻게 드러낼지
  chosen_reading: ‘만나 전쟁하려고’로 옮겨, 단순 조우가 아니라 적대적 교전을 향한 움직임임을 분명히 했습니다.
  alternative_readings:
  - ‘맞닥뜨리려고 싸우려’
  - ‘대면하여 전투하려고’
  rationale: 본문은 συνάντησις와 πόλεμον을 병치해 ‘만남’이 곧 전투로 이어짐을 강조하므로, 의미를 약화시키지 않는 방향이 적절합니다.
  doctrine_reference: 서사 문맥 보존
- issue: 고유명사 Gorgias의 음역
  chosen_reading: ‘고르기아스’로 음역했습니다.
  alternative_readings:
  - ‘조르기아스’
  - ‘고르기오스’
  rationale: 한국어 성서 관행과 현대 외래어 표기 감각을 함께 고려한 표준적인 음역입니다.
  doctrine_reference: 고유명사 표기
