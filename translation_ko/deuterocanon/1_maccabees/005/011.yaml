  text: And they are preparing to come and seize the stronghold into which we have fled[b][a]; and Timothy is leading their camp.
  footnotes:
  - marker: a
    text: Or 'to take the stronghold before us' or 'to occupy the stronghold first.' The Greek verb emphasizes preemptive seizure.
    reason: lexical_alternative
  - marker: b
    text: '''Camp'' here refers to the hostile military encampment, and by extension the force associated with it.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그들은 와서 우리가 피신한 요새를 점령하려고 준비하고 있으며, 티모테오가 그들의 진영을 이끌고 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 προκαταλαβέσθαι는 단순히 ‘가다’가 아니라, 먼저 가서 차지하거나 선점하는 적극적 점거를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘진영’은 적군의 군사적 야영지와 그 집단 전체를 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἑτοιμάζοντές εἰσιν
  english_pob_choice: are preparing
  chosen_korean: 준비하고 있으며
  alternatives_korean:
  - 준비하고 있습니다
  - 채비하고 있으며
  lexicon: LSJ
  rationale: 현재 진행 중인 준비 상태를 나타내는 periphrastic present로 읽어, 단순 미래보다 진행성을 살린 표현을 택했습니다.
- source_word: προκαταλαβέσθαι
  english_pob_choice: to seize
  chosen_korean: 점령하려고
  alternatives_korean:
  - 빼앗으려고
  - 선점하려고
  - 먼저 차지하려고
  lexicon: LSJ
  rationale: 강한 적대적 점거·선점의 뉘앙스를 반영하되, 한국어에서는 ‘점령하다’가 가장 자연스럽고 군사적 맥락에 맞습니다.
- source_word: τὸ ὀχύρωμα
  english_pob_choice: the stronghold
  chosen_korean: 요새
  alternatives_korean:
  - 요새화된 곳
  - 성채
  - 강한 보루
  lexicon: LSJ
  rationale: ὀχύρωμα는 방어가 갖춰진 거점을 가리키므로, ‘요새’가 가장 مستقیم하고 현대 한국어에서도 자연스럽습니다.
- source_word: τῆς παρεμβολῆς αὐτῶν
  english_pob_choice: their camp
  chosen_korean: 그들의 진영
  alternatives_korean:
  - 그들의 캠프
  - 그들의 야영지
  - 그들의 군영
  lexicon: LSJ
  rationale: παρεμβολή의 군사적 ‘진영/군영’ 뜻을 살려, 단순 야영보다 전투 집결지를 드러내는 ‘진영’을 택했습니다.
theological_decisions:
- issue: 서술 시점과 화자 포함 여부
  chosen_reading: ‘우리가 피신한’으로 번역해, 화자가 자신들을 요새 안에 있는 피난자로 포함하는 시점을 유지했습니다.
  alternative_readings:
  - ‘우리가 도망한’
  - ‘우리가 피난한 곳’
  rationale: κατεφύγομεν은 단순 이동이 아니라 피난·도피를 뜻하므로, 공동체가 위협을 피해 들어온 상황을 분명히 드러내는 쪽이 원문에 가깝습니다.
  doctrine_reference: narrative precision
- issue: 티모테오의 역할
  chosen_reading: ‘이끌고 있습니다’로 번역해 지휘권을 직접 과장하지 않고, 군사적 선두 역할을 드러냈습니다.
  alternative_readings:
  - ‘지휘하고 있습니다’
  - ‘앞장서고 있습니다’
  rationale: ἡγεῖται는 ‘이끌다/인도하다/통솔하다’의 범위를 가지므로, 문맥상 군사 지휘를 함축하되 원문보다 강하게 확정하지 않는 번역이 적절합니다.
  doctrine_reference: lexical caution
