base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/003.yaml
  text: And Judas fought against the sons of Esau in Judea[a], in the Akrabattene region, because they were hemming in Israel. And he struck them with a great blow, and humbled them[b], and took their spoils.
  footnotes:
  - marker: a
    text: Or 'the descendants of Esau'; that is, likely the Edomites. The Greek reads 'the sons of Esau.'
    reason: lexical_alternative
  - marker: b
    text: Akrabattene is a regional place name in Judea; the Greek syntax is compressed and may also be understood as 'in Judea, at Akrabattene.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 유다는 유대의 아크라바테네 지역에서 에서의 자손들과 싸웠습니다. 그들이 이스라엘을 포위하고 있었기 때문입니다. 그는 그들에게 큰 타격을 가하고, 그들을 굴복시켰으며, 그들의 전리품을 빼앗았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘에서의 자손들’은 직역이며, 역사적으로는 에돔 사람들을 가리키는 것으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아크라바테네’는 유대의 지역명입니다. 그리스어 구문은 압축적이어서 ‘유대에서, 아크라바테네에서’로도 이해될 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπολέμει ... πρὸς
  english_pob_choice: fought against
  chosen_korean: 싸웠습니다
  alternatives_korean:
  - 전쟁을 벌였습니다
  - 맞서 싸웠습니다
  lexicon: LSJ
  rationale: ἐπολέμει는 계속된 전투 행위를 나타내며, πρὸς는 적대적 대상을 분명히 합니다. 한국어로는 간결한 ‘싸웠습니다’가 가장 자연스럽습니다.
- source_word: υἱοὺς Ἠσαῦ
  english_pob_choice: the sons of Esau
  chosen_korean: 에서의 자손들
  alternatives_korean:
  - 에서의 아들들
  - 에돔 사람들
  lexicon: LSJ
  rationale: 본문의 친족-계보적 표현을 그대로 살려 ‘에서의 자손들’로 옮겼습니다. 역사적 해석어인 ‘에돔 사람들’은 풀이이므로 본문어를 우선했습니다.
- source_word: τὴν Ἀκραβαττήνην
  english_pob_choice: the Akrabattene region
  chosen_korean: 아크라바테네 지역
  alternatives_korean:
  - 아크라바테네에서
  - 아크라바테네 지방
  lexicon: LSJ
  rationale: 영어 POB와 같이 지명 자체를 지역명으로 이해해 자연스럽게 옮겼습니다. 본문의 압축된 지리 표현을 과도하게 풀지 않았습니다.
- source_word: ἐπάταξεν αὐτοῖς πληγὴν μεγάλην ... συνέστειλεν αὐτούς
  english_pob_choice: struck them with a great blow ... humbled them
  chosen_korean: 그들에게 큰 타격을 가하고, 그들을 굴복시켰으며
  alternatives_korean:
  - 그들에게 큰 타격을 입히고, 그들을 낮추었으며
  - 그들을 크게 쳐부수고, 꺾었으며
  lexicon: LSJ
  rationale: ‘큰 타격’은 πληγὴν μεγάλην의 군사적 패배 관용구를 살리고, συνέστειλεν은 완전한 멸절보다 ‘굴복시키다’가 더 적절합니다.
- source_word: τὰ σκῦλα
  english_pob_choice: their spoils
  chosen_korean: 그들의 전리품
  alternatives_korean:
  - 그들의 노획물
  - 그들의 약탈물
  lexicon: LSJ
  rationale: 전쟁에서 빼앗은 물건이라는 의미를 간결하게 드러내는 표준어로 옮겼습니다.
theological_decisions:
- issue: 유대의 지리구문 해석
  chosen_reading: ‘유대의 아크라바테네 지역’으로 읽어, 전투 장소를 유대 안의 지역명으로 제시했습니다.
  alternative_readings:
  - ‘유대에서, 아크라바테네에서’
  - ‘유대의 아크라바테네에서’
  rationale: 그리스어 구문이 압축되어 있어 위치 관계를 한 가지로 단정하기보다, 영어 POB의 판단처럼 지역명 용법을 반영하는 것이 가장 안전합니다.
  doctrine_reference: 본문 지리 해석
