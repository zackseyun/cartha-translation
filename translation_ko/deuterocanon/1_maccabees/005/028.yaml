  text: And Judas and his camp turned suddenly by the road into the wilderness toward Bosor; and he captured the city and killed every male with the edge of the sword[a], and took all their spoils, and burned it with fire.
  footnotes:
  - marker: a
    text: Greek literally, 'in the mouth of the sword,' a standard idiom meaning death by the sword.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 유다와 그의 군대는 길을 따라 광야로, 보소르 쪽으로 갑자기 방향을 돌렸습니다. 그는 그 성을 점령하고, 칼날에 닿는 대로 남자마다[a] 죽였으며, 그들의 모든 전리품을 빼앗고, 그것을 불로 태웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘칼의 입 안에서’이지만, 칼에 의한 죽음을 뜻하는 관용적 표현입니다.
