translation:
  language: ko
  text: 그리고 유다는 자기 진영과 함께 갑자기 방향을 돌려 광야로 가는 길을 따라 보소르로 갔습니다. 그는 그 성을 점령하고 모든 남자를 칼로[a] 죽였으며, 그들의 모든 전리품을 빼앗고 그 성을 불로 태웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘칼의 입 안에서’이지만, 칼에 의한 죽임을 뜻하는 관용적 표현입니다.
    reason: lexical_alternative
