  text: And he took them from Galilee and from Arbactis[a], together with the women and the children and all that belonged to them[b], and they brought them into Judea with great rejoicing.
  footnotes:
  - marker: a
    text: The Greek text shifts from singular ('he took') to plural ('they brought'). The translation preserves this as transmitted rather than harmonizing it.
    reason: textual_variant
  - marker: b
    text: Or 'in Arbactis.' The Greek uses 'in' with the place-name, though English idiom in this context may be expressed as 'from Arbactis.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 갈릴리와 아르바크토스에서[a] 그 사람들을 여자들과 아이들과 그들이 가진 모든 것과 함께 데려왔고, 그들은[b] 큰 기쁨으로 그들을 유다로 이끌었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 갈릴리에는 ‘~에서’를 뜻하는 ἐκ를, 아르바크토스에는 문자상 ‘~에’를 뜻하는 ἐν을 사용합니다. 이동 문맥과 병렬 구조에 따라 여기서는 둘 다 출발 지점으로 옮겼습니다. ‘아르바크토스에 있는’으로 이해할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 본문은 앞에서는 단수 동사(‘그가 데려왔다’)를, 여기서는 복수 동사(‘그들이 이끌었다’)를 사용합니다. 번역은 이 수의 전환을 전승된 대로 보존합니다.
    reason: textual_variant
