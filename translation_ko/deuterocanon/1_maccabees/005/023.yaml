  text: And he took them from Galilee and from Arbactis[a], together with the women and the children and all that belonged to them[b], and they brought them into Judea with great rejoicing.
  footnotes:
  - marker: a
    text: The Greek text shifts from singular ('he took') to plural ('they brought'). The translation preserves this as transmitted rather than harmonizing it.
    reason: textual_variant
  - marker: b
    text: Or 'in Arbactis.' The Greek uses 'in' with the place-name, though English idiom in this context may be expressed as 'from Arbactis.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 그들을 갈릴리와 아르바크토스에서, 여자들과 아이들과 그들에게 속한 모든 것을 함께 데려와서, 큰 기쁨과 함께 유다로 이끌었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ἐκ과 ἐν이 함께 쓰이지만, 문맥상 두 지명 모두 출발 지점으로 읽는 것이 자연스럽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: παρέλαβεν
  english_pob_choice: took
  chosen_korean: 데려와서
  alternatives_korean:
  - 데리고 와서
  - 가져와서
  lexicon: LSJ
  rationale: 사람들을 안전하게 함께 이동시키는 서술이므로 단순한 ‘받다’보다 포괄적이고 자연스러운 ‘데려오다’ 계열이 적절합니다.
- source_word: ἐκ τῆς Γαλιλαίας
  english_pob_choice: from Galilee
  chosen_korean: 갈릴리에서
  alternatives_korean:
  - 갈릴리로부터
  lexicon: LSJ
  rationale: ἐκ는 출발점을 나타내므로 한국어에서는 자연스럽게 ‘갈릴리에서’로 옮겼습니다.
- source_word: ἐν Ἀρβάκτοις
  english_pob_choice: from Arbactis / in Arbactis
  chosen_korean: 아르바크토스에서
  alternatives_korean:
  - 아르바크토스 안에서
  - 아르바크토스에서부터
  lexicon: LSJ
  rationale: 영어 주석이 지적하듯 전치사는 ἐν이지만 이 문맥에서는 이동의 출발 지점처럼 기능하므로 한국어는 방향성을 살려 ‘에서’로 처리했습니다.
- source_word: σὺν ταῖς γυναιξὶν καὶ τοῖς τέκνοις
  english_pob_choice: together with the women and the children
  chosen_korean: 여자들과 아이들과
  alternatives_korean:
  - 아내들과 아이들과
  - 여인들과 자녀들과
  lexicon: LSJ
  rationale: 원문은 ‘아내들’이 아니라 일반적인 ‘여자들’을 말하므로 더 좁은 가족관계로 한정하지 않았습니다.
- source_word: πάντα ὅσα ἦν αὐτοῖς
  english_pob_choice: all that belonged to them
  chosen_korean: 그들에게 속한 모든 것
  alternatives_korean:
  - 그들이 가진 모든 것
  - 그들의 소유 전부
  lexicon: LSJ
  rationale: 소유물 전반을 가리키는 표현이므로 소유의 범위를 넓게 유지하는 번역이 적절합니다.
- source_word: ἤγαγον
  english_pob_choice: they brought
  chosen_korean: 이끌었습니다
  alternatives_korean:
  - 데려갔습니다
  - 가져갔습니다
  lexicon: LSJ
  rationale: 전승된 그리스어가 복수형이므로 주어의 수를 평탄화하지 않고, 행진·이송의 의미를 살릴 수 있는 ‘이끌다’ 계열로 옮겼습니다.
- source_word: μετʼ εὐφροσύνης μεγάλης
  english_pob_choice: with great rejoicing
  chosen_korean: 큰 기쁨과 함께
  alternatives_korean:
  - 큰 즐거움과 함께
  - 크게 기뻐하며
  lexicon: LSJ
  rationale: εὐφροσύνη는 축하의 즐거움·기쁨을 가리키므로 공적이고 공동체적인 분위기를 살려 ‘큰 기쁨’으로 옮겼습니다.
theological_decisions:
- issue: 전치사 ἐν의 처리와 출발점 의미
  chosen_reading: ‘아르바크토스에서’로 번역해, 위치보다 이송의 출발 지점을 드러냈습니다.
  alternative_readings:
  - ‘아르바크토스 안에서’
  - ‘아르바크토스로부터’
  rationale: 영어 POB 주석처럼 본문은 ἐν을 쓰지만 이동 동사와 병렬 구조 안에서는 한국어가 목적지로 향하는 출발점으로 이해하는 편이 자연스럽습니다.
  doctrine_reference: 본문 해석상의 문법·문맥 결정
