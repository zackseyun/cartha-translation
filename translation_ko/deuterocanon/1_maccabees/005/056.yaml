  source_fidelity: 현 번역은 첫 인물의 부계 표지(‘사가랴의 아들’)를 빠뜨려 Ἰωσὴφ ὁ τοῦ Ζαχαρία를 충분히 옮기지 못했습니다. 또한 τοῦ πολέμου는 직접적으로 ‘전쟁’을 가리키므로 ‘전쟁에서의 공적’은 해석을 더한 표현입니다. 문맥상 둘째 이름을 아사랴로 채택할 수 있으나, 스웨트 본문의 사가랴 읽기는 각주로 분명히 밝혀야 합니다.
