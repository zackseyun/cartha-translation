  rationale: 영어 POB가 본문과 각주에서 텍스트 변이를 명시하므로, 한국어도 본문 가독성을 유지하면서 변이 정보를 보존하는 쪽이 가장 투명합니다.
  doctrine_reference: textual criticism / source transparency
