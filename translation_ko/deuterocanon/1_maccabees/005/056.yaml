  text: Joseph son of Zechariah and Azariah[a], commanders of the forces, heard of the brave deeds and of the warlike exploits that they had done.
  footnotes:
  - marker: a
    text: Greek source as transcribed in Swete appears to read 'Zechariah' for the second name; the narrative context and standard text tradition support 'Azariah' here.
    reason: textual_variant
translation:
  language: ko
  text: 요셉과 아자리야[a], 곧 군대의 지휘관들은 그들이 해낸 용감한 일들과 전쟁에서의 공적을 들었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 스웨트 본문은 둘째 이름을 ‘Zechariah’로 읽는 듯하지만, 서술 맥락과 표준 전승은 여기서 ‘Azariah’를 지지합니다.
    reason: textual_variant
