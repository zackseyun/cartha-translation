translation:
  language: ko
  text: 스가랴의 아들 요셉과 아사랴[a], 곧 군대의 지휘관들은 그들이 행한 용맹한 일들과 치른 전쟁을 전해 들었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 스웨트가 전사한 그리스어 본문은 둘째 이름을 ‘스가랴’로 읽는 듯합니다. 그러나 서술 맥락과 표준 본문 전승은 여기서 ‘아사랴’를 지지합니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἤκουσεν
  english_pob_choice: heard of
  chosen_korean: 들었습니다
  alternatives_korean:
  - 들었다
  - 알게 되었습니다
  lexicon: LSJ
  rationale: ἤκουσεν은 단순 청취보다 ‘전해 들음/알게 됨’의 뉘앙스를 가지므로, 문맥에 맞게 자연스러운 과거 서술인 ‘들었습니다’로 옮겼습니다.
- source_word: Ἰωσὴφ ὁ τοῦ Ζαχαρία καὶ Ζαχαρίας
  english_pob_choice: Joseph son of Zechariah and Azariah
  chosen_korean: 요셉과 아자리야
  alternatives_korean:
  - 요셉과 사가랴
  - 요셉, 곧 사가랴의 아들인 아자리야
  lexicon: 고유명사 표기 관행
  rationale: 영어 POB의 본문과 각주를 따라 두 인물을 한국어 음역으로 옮기되, 본문은 간결하게 처리하고 텍스트 변이 정보는 각주로 남겼습니다.
- source_word: ἄρχοντες τῶν δυνάμεων
  english_pob_choice: commanders of the forces
  chosen_korean: 군대의 지휘관들
  alternatives_korean:
  - 군세의 지휘관들
  - 부대의 지휘관들
  - 군대의 장관들
  lexicon: LSJ
  rationale: ἄρχοντες와 τῶν δυνάμεων의 군사적 직분을 한국어에서 가장 자연스럽게 드러내는 표현으로 ‘군대의 지휘관들’을 선택했습니다.
- source_word: ἀνδραγαθήσεων
  english_pob_choice: brave deeds
  chosen_korean: 용감한 일들
  alternatives_korean:
  - 용맹한 행위들
  - 용사의 업적들
  - 무용의 행적들
  lexicon: LSJ
  rationale: ἀνδραγαθήσεων은 용기와 무용을 나타내므로, 현대 한국어에서 지나치게 고어적이거나 성별 함의가 있는 표현을 피하고 ‘용감한 일들’로 옮겼습니다.
- source_word: τοῦ πολέμου
  english_pob_choice: warlike exploits
  chosen_korean: 전쟁에서의 공적
  alternatives_korean:
  - 전쟁의 공훈
  - 전투 공적
  - 전쟁의 전과
  lexicon: LSJ
  rationale: τοῦ πολέμου는 단순한 ‘전쟁’보다 전쟁과 관련된 군사적 성취를 가리키므로, 그 성격을 살린 ‘전쟁에서의 공적’으로 번역했습니다.
- source_word: οἷα ἐποίησαν
  english_pob_choice: that they had done
  chosen_korean: 해낸
  alternatives_korean:
  - 행한
  - 한
  - 이룬
  lexicon: LSJ
  rationale: 직전 명사구들을 받는 회고적 표현이므로, ‘해낸’으로 과거의 성취를 자연스럽게 이어 주었습니다.
theological_decisions:
- issue: 본문의 두 이름 중 두 번째 인명 변이
  chosen_reading: 본문에는 아자리야로 두었고, 각주로 스웨트 본문의 Ζαχαρίας 읽기와 전승상 아자리야를 병기했습니다.
  alternative_readings:
  - 사가랴
  - 스웨트 본문의 Ζαχαρίας를 그대로 반영
  rationale: 영어 POB가 본문과 각주에서 텍스트 변이를 명시하므로, 한국어도 본문 가독성을 유지하면서 변이 정보를 보존하는 쪽이 가장 투명합니다.
  doctrine_reference: textual criticism / source transparency
