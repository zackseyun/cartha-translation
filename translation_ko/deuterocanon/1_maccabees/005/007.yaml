  text: And he joined many battles against them, and they were crushed before him, and he struck them down.
translation:
  language: ko
  text: 그리고 그가 그들과 여러 차례 전투를 벌였으며, 그들은 그의 앞에서 무너졌고, 그가 그들을 쳤습니다.
