lexical_decisions:
- source_word: συνῆψεν πρὸς αὐτοὺς πολέμους πολλούς
  english_pob_choice: he joined many battles against them
  chosen_korean: 그가 그들과 여러 차례 전투를 벌였으며
  alternatives_korean:
  - 그가 그들에게 많은 전쟁을 일으켰으며
  - 그가 그들과 많은 전투를 치렀으며
  lexicon: συνάπτω + πόλεμος
  rationale: 직역식으로 ‘전쟁들을 붙이다’보다는, POB의 ‘joined many battles against them’이 가리키는 반복적 교전의 의미를 살려 ‘여러 차례 전투를 벌이다’로 옮겼습니다.
- source_word: συνετρίβησαν
  english_pob_choice: they were crushed
  chosen_korean: 그들은 그의 앞에서 무너졌고
  alternatives_korean:
  - 그들은 산산이 부서졌고
  - 그들은 짓눌렸고
  lexicon: συντρίβω
  rationale: 물리적 파괴와 패배의 중첩을 살리되, 한국어에서 자연스럽고 서사적인 표현인 ‘무너지다’를 사용해 패배의 결과를 드러냈습니다.
- source_word: ἐπάταξεν αὐτούς
  english_pob_choice: he struck them down
  chosen_korean: 그가 그들을 쳤습니다
  alternatives_korean:
  - 그가 그들을 쳐서 쓰러뜨렸습니다
  - 그가 그들을 타격했습니다
  lexicon: πατάσσω
  rationale: 원문의 타격/격파 동사를 과도하게 해석하지 않고, POB의 직접적 표현을 따라 ‘치다’로 옮겼습니다.
