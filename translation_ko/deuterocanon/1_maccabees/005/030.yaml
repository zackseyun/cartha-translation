  rationale: 이 절은 신학적 용어보다 전투 서사의 사실성과 속도가 핵심이므로, 원문의 군사적 긴장감을 현대 한국어로 직접 전달했습니다.
  doctrine_reference: 서사 본문 번역 원칙
