  text: And when morning came, they lifted up their eyes, and behold, a great multitude, beyond number, carrying ladders and siege engines to capture the stronghold; and they were fighting them.
  footnotes:
  - marker: a
    text: Or 'without number' or 'too many to count.'
    reason: lexical_alternative
  - marker: b
    text: Greek μηχανάς refers to siege devices or engines used in an assault on a fortified place.
    reason: cultural_note
translation:
  language: ko
  text: 아침이 되자 그들이 눈을 들어 보니, 보십시오, 수효를 헤아릴 수 없는 큰 무리가 사다리와 공성 장비를 가지고 요새를 점령하려고 하고 있었습니다.[a][b] 그 큰 무리는 그들과 싸우고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘수없이 많은’ 또는 ‘셀 수 없는’.
    reason: οὗ οὐκ ἦν ἀριθμός의 직역적 의미와 자연스러운 대안을 제시합니다.
  - marker: b
    text: ‘공성 장비’는 요새나 성벽을 공격할 때 쓰는 장치들을 가리킵니다.
    reason: μηχαναί의 군사·역사적 의미를 설명합니다.
