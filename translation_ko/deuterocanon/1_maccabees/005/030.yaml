  text: And when morning came, they lifted up their eyes, and behold, a great multitude, beyond number, carrying ladders and siege engines to capture the stronghold; and they were fighting them.
  footnotes:
  - marker: a
    text: Or 'without number' or 'too many to count.'
    reason: lexical_alternative
  - marker: b
    text: Greek μηχανάς refers to siege devices or engines used in an assault on a fortified place.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 아침이 되자 그들이 눈을 들어 보니, 보시니 수효를 헤아릴 수 없는 큰 무리가 사다리들과 공성 장비들을 들고 요새를 점령하려 하고 있었으며, 그들이 그들을 치고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘수효를 헤아릴 수 없는’은 ‘beyond number’의 직역적 뉘앙스를 살린 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἑωθινή
  english_pob_choice: when morning came
  chosen_korean: 아침이 되자
  alternatives_korean:
  - 아침이 왔습니다
  - 동이 트자
  lexicon: LSJ
  rationale: 시간 전환을 자연스럽게 살리면서, 서사적 진행을 나타내는 ἐγένετο의 감각을 간결하게 반영했습니다.
- source_word: ἦραν τοὺς ὀφθαλμοὺς αὐτῶν
  english_pob_choice: they lifted up their eyes
  chosen_korean: 그들이 눈을 들어 보니
  alternatives_korean:
  - 그들이 눈을 들어
  - 그들이 올려다보니
  lexicon: LSJ
  rationale: 성서적 관용구를 한국어에서 자연스럽게 살리되, 시각적 발견의 순간을 분명하게 했습니다.
- source_word: λαὸς πολὺς οὗ οὐκ ἦν ἀριθμός
  english_pob_choice: a great multitude, beyond number
  chosen_korean: 수효를 헤아릴 수 없는 큰 무리
  alternatives_korean:
  - 헤아릴 수 없이 많은 큰 무리
  - 끝없이 많은 큰 무리
  lexicon: LSJ
  rationale: ἀριθμός의 부정 표현을 직역에 가깝게 살려 ‘헤아릴 수 없음’을 드러냈고, λαὸς πολὺς는 ‘큰 무리’로 옮겼습니다.
- source_word: μηχανὰς
  english_pob_choice: siege engines
  chosen_korean: 공성 장비들
  alternatives_korean:
  - 공성기들
  - 포위 공격 장비들
  lexicon: LSJ
  rationale: 군사적 문맥에서의 μηχανάς를 현대 독자가 이해할 수 있게 하되, 단순한 ‘기계’로 축소되지 않도록 했습니다.
- source_word: καταλαβεῖσθαι τὸ ὀχύρωμα
  english_pob_choice: to capture the stronghold
  chosen_korean: 요새를 점령하려 하고 있었으며
  alternatives_korean:
  - 요새를 빼앗으려 하고 있었으며
  - 요새를 함락하려 하고 있었으며
  lexicon: LSJ
  rationale: ὀχύρωμα를 군사적 방어 거점으로 보아 ‘요새’로 옮겼고, 목적 부정사의 뉘앙스를 살려 의도를 나타냈습니다.
- source_word: ἐπολέμουν αὐτούς
  english_pob_choice: they were fighting them
  chosen_korean: 그들이 그들을 치고 있었습니다
  alternatives_korean:
  - 그들이 그들과 싸우고 있었습니다
  - 그들이 그들에게 전쟁을 벌이고 있었습니다
  lexicon: LSJ
  rationale: 미완료 시제의 지속성을 살리면서, 한국어에서 자연스러운 전투 서술인 ‘치다’를 택해 공격적 긴박감을 유지했습니다.
theological_decisions:
