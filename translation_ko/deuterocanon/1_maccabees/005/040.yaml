  - severity: medium
    issue: ‘그를 막아 설 수’의 비자연스러운 결합
    rationale: 한국어에서는 ‘그에게 맞서 버티다’ 또는 ‘그를 당해 내다’가 자연스럽게 ὑποστῆναι의 전투적 의미를 전달합니다.
  - severity: medium
    issue: 각주 표지 위치 및 각주 언어 불일치
    rationale: a는 ‘와디’에, b는 ‘우리를 이길’이라는 해석적 표현에 연결되어야 하며, 한국어 번역문에는 한국어 각주가 필요합니다.
