  text: καὶ εἶπεν Τιμόθεος τοῖς ἄρχουσιν τῆς δυνάμεως αὐτοῦ ἐν τῷ ἐγγίζειν Ἰούδαν καὶ τὴν παρεμβολὴν αὐτοῦ Λ ἐπὶ τοῦ χειμάρρουν τοῦ ὕδατος Ἐὰν διαβῇ πρὸς ἡμᾶς πρότερος, οὐ δυνησόμεθα ὑποστῆναι αὐτόν, ὅτι δυνήσεται πρὸς ἡμᾶς.
