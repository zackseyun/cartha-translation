  text: And Timotheus said to the commanders of his forces[a], when Judas and his camp were drawing near to the wadi, “If he crosses over to us first, we will not be able to withstand him[b], because he will surely prevail against us.”
  footnotes:
  - marker: a
    text: Greek literally, 'the torrent/stream of water.' The expression likely refers to a wadi or seasonal watercourse rather than a major river.
    reason: cultural_note
  - marker: b
    text: Or, more literally, 'he will be able against us.' The sense in context is that Judas would overpower them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 티모테오스는 자기 군대의 지휘관들에게 말했습니다. 유다와 그의 군대가 그 와디에 가까이 다가오고 있을 때, “그가 우리에게 먼저 건너오면, 우리는 그를 막아 설 수 없을 것입니다. 그가 우리를 능히 이길 것이기 때문입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greek literally, 'the torrent/stream of water.' The expression likely refers to a wadi or seasonal watercourse rather than a major river.
    reason: cultural_note
  - marker: b
    text: Or, more literally, 'he will be able against us.' The sense in context is that Judas would overpower them.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρχουσιν
  english_pob_choice: commanders
  chosen_korean: 지휘관들
  alternatives_korean:
  - 사령관들
  - 지휘자들
  - 지도자들
  lexicon: BDAG
  rationale: 군사 문맥에서 부대를 통솔하는 사람들을 가리키므로, 기능을 분명히 드러내는 ‘지휘관들’이 가장 자연스럽습니다.
- source_word: δυνάμεως
  english_pob_choice: forces
  chosen_korean: 군대
  alternatives_korean:
  - 병력
  - 군사력
  - 부대
  lexicon: BDAG
  rationale: 여기서는 추상적 ‘힘’보다 실제 전투 병력을 가리키므로, 문맥상 ‘군대’가 가장 직접적입니다.
- source_word: χειμάρρουν τοῦ ὕδατος
  english_pob_choice: wadi
  chosen_korean: 와디
  alternatives_korean:
  - 급류 골짜기
  - 시내 골짜기
  - 계곡 물길
  lexicon: LSJ
  rationale: 예루살렘 인근 지형을 떠올리게 하는 계절성 물길/건천의 뜻을 살리기 위해 음역어 ‘와디’를 유지했습니다.
- source_word: ὑποστῆναι
  english_pob_choice: withstand
  chosen_korean: 막아 설 수
  alternatives_korean:
  - 버틸 수
  - 대항할 수
  - 저항할 수
  lexicon: BDAG
  rationale: 전투 상황에서 맞서 버틴다는 뜻이므로, 한국어로는 ‘막아 서다’가 가장 생생하면서도 과도하게 해석적이지 않습니다.
- source_word: δυνήσεται πρὸς ἡμᾶς
  english_pob_choice: he will surely prevail against us
  chosen_korean: 그가 우리를 능히 이길
  alternatives_korean:
  - 그가 우리를 이길 수 있을
  - 그가 우리보다 강할
  - 그가 우리에게 이길
  lexicon: BDAG
  rationale: 그리스어의 압축된 표현은 문맥상 ‘우리를 압도하다/이기다’는 뜻이므로, 결과를 분명히 하는 ‘능히 이길’로 옮겼습니다.
- source_word: Τιμόθεος
  english_pob_choice: Timotheus
  chosen_korean: 티모테오스
  alternatives_korean:
  - 디모데
  - 티모테우스
  lexicon: LSJ
  rationale: 이 책의 그리스어 고유명사 형태를 따라, 신약 인명 ‘디모데’가 아니라 헬라식 음역 ‘티모테오스’를 사용했습니다.
theological_decisions:
