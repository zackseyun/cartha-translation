revisions:
- from: 그리고 티모테오스는 자기 군대의 지휘관들에게 말했습니다. 유다와 그의 군대가 그 와디에 가까이 다가오고 있을 때, “그가 우리에게 먼저 건너오면, 우리는 그를 막아 설 수 없을 것입니다. 그가 우리를 능히 이길 것이기 때문입니다.”[a][b]
  to: 그리고 티모테오스가 자기 군대의 지휘관들에게 말했습니다. 유다와 그의 진영이 그 와디[a] 가까이 다가오고 있을 때에 말했습니다. “그가 먼저 우리 쪽으로 건너오면, 우리는 그에게 맞서 버틸 수 없을 것입니다. 그가 우리를 이길 것이기 때문입니다.[b]”
  rationale: 원문의 의미와 불확정성을 유지하면서 ‘진영’과 ‘그에게 맞서 버티다’로 군사 장면을 자연스럽게 옮겼습니다. 와디와 압도한다는 의미에 관한 각주는 한국어로 번역하고 해당 어구에 각각 연결했습니다.
