  lexicon: LSJ
  rationale: 단순한 파괴보다 성전적 전쟁의 ‘바침/금지’ 뉘앙스를 살리기 위해, ‘멸망에 바치다’로 옮겼습니다.
- source_word: σὺν πᾶσιν τοῖς ἐνοῦσιν
  english_pob_choice: along with all who were in them
  chosen_korean: 그 안에 있던 모든 사람도 함께였습니다
  alternatives_korean:
  - 그 안에 있던 모든 이들과 함께였습니다
  - 그 안에 있는 모든 사람과 함께였습니다
  - 그 안에 있던 모든 사람을 포함하여
  lexicon: LSJ
  rationale: 전치사구의 총체성을 살리면서도 한국어에서 중복되는 ‘그 안에…’ 표현을 자연스럽게 정리했습니다.
theological_decisions:
- issue: ἀνεθεμάτισεν의 성전적 전쟁 언어 처리
  chosen_reading: ‘멸망에 바쳤다’는 표현으로, 일반적 파괴가 아니라 바침/금지의 종교적-군사적 의미를 드러냈습니다.
  alternative_readings:
  - ‘저주했다’
  - ‘완전히 멸했다’
  - ‘진멸에 바쳤다’
  rationale: 본문은 단순한 군사 승리를 넘어 ‘바침’과 ‘멸망’이 결합된 고대 성전전(holy war) 어휘를 사용하므로, 그 신학적 무게를 보존해야 합니다.
  doctrine_reference: Translation philosophy §§1, 5
