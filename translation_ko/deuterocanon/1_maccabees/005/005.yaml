  rationale: 기본 의미는 ‘탑’이므로, 군사적 기능은 문맥으로 드러나게 두고 본래 명사를 유지했습니다.
- source_word: ἀνεθεμάτισεν
  english_pob_choice: devoted them to destruction
  chosen_korean: 그들을 멸망에 바쳤으며
  alternatives_korean:
  - 그들을 저주했으며
  - 그들을 진멸에 바쳤으며
