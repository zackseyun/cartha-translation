  - marker: b
    text: The Greek has a singular pronoun, literally 'its towers,' likely referring to the city in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 그에게서 탑들 안에 갇혔고, 그는 그들을 향해 진을 치고, 그들을 멸망에 바쳤으며, 그 도시의 탑들을 불로 태웠습니다. 그리고 그 안에 있던 모든 사람도 함께였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘멸망에 바쳤다’는 표현은 헬라어 ἀνεθεμάτισεν의 의미를 살린 것으로, 단순히 저주했다는 뜻만은 아닙니다.
    reason: theological_note
  - marker: b
    text: 헬라어는 문자적으로 ‘그의 탑들’이 아니라 여성 단수 소유대명사를 써서, 문맥상 도시를 가리키는 것으로 보입니다.
    reason: lexical_alternative
