  text: And they were shut up by him in the towers[a], and he encamped against them, and he devoted them to destruction, and he burned its towers with fire[b], along with all who were in them.
  footnotes:
  - marker: a
    text: Or 'put them under the ban.' The Greek verb carries the sense of devoting persons or things to destruction, not merely cursing them.
    reason: lexical_alternative
  - marker: b
    text: The Greek has a singular pronoun, literally 'its towers,' likely referring to the city in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 그들을 탑들 안에 가두었고, 그들을 향해 진을 쳤으며, 그들을 멸망에 바쳤고[a], 그 성읍의 탑들을 불태우고 그 안에 있던 모든 사람도 함께 불태웠습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘멸망에 바쳤다’는 헬라어 ἀνεθεμάτισεν의 의미를 살린 표현입니다. 이는 단순히 저주했다는 뜻이 아니라, 멸망을 위해 바치거나 진멸 아래 두는 뜻을 포함합니다.
    reason: theological_note
  - marker: b
    text: 헬라어는 ‘그 성읍의 탑들’에서 ‘그 성읍의’에 해당하는 말로 여성 단수 대명사를 사용합니다. 문맥상 성읍을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
