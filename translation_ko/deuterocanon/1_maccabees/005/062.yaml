lexical_decisions:
- source_word: αὐτοὶ δὲ
  english_pob_choice: But they
  chosen_korean: 그러나 그들은
  alternatives_korean:
  - 하지만 그들은
  - 그런데 그들은
  lexicon: BDAG
  rationale: δέ의 대조를 살려 앞선 문맥과의 대비를 분명히 했습니다.
- source_word: ἐκ τοῦ σπέρματος
  english_pob_choice: from the offspring
  chosen_korean: 씨에서 난 자들
  alternatives_korean:
  - 후손
  - 자손
  - 씨
  lexicon: BDAG
  rationale: σπέρμα의 혈통·출생 계열 의미를 살리면서, 현대 한국어에서 자연스럽고 직역에 치우치지 않게 풀었습니다.
- source_word: τῶν ἀνδρῶν ἐκείνων
  english_pob_choice: of those men
  chosen_korean: 이 사람들의
  alternatives_korean:
  - 그 남자들의
  - 그 사람들의
  lexicon: BDAG
  rationale: ὁ ἀνήρ의 남성 복수를 반영하되, 한국어에서는 소유·출신 관계를 자연스럽게 전달하기 위해 ‘사람들’보다 문맥상 덜 어색한 표현을 택했습니다.
- source_word: διὰ χειρὸς αὐτῶν
  english_pob_choice: through their hand
  chosen_korean: 그들의 손을 통해
  alternatives_korean:
  - 그들의 손으로
  - 그들을 통해
  lexicon: BDAG
  rationale: 히브리계 관용구의 도구·매개 이미지를 살리면서도 한국어에서 이해 가능한 형태로 옮겼습니다.
