  text: And he crossed over to them first[a], and all his people were before him; and all the nations were crushed before him[b], and they threw down all their weapons and fled into the sanctuary at Carnain.
  footnotes:
  - marker: a
    text: Or 'against them'; the Greek πρὸς αὐτούς can carry either a directional sense ('to/toward them') or, in context, a hostile sense.
    reason: lexical_alternative
  - marker: b
    text: Or 'shrine' or 'temple precinct'; the Greek τέμενος refers to a sacred enclosure or sanctuary.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 먼저 그들에게 건너갔고, 그의 모든 백성은 그의 앞에 있었습니다. 그리고 모든 민족은 그의 앞에서 무너졌으며, 그들은 무기를 내던지고 카르나인에 있는 성소로 달아났습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 향하여’일 수 있습니다. 그리스어 πρὸς αὐτούς는 방향성을 나타낼 수도 있고, 전투 문맥에서는 ‘대적하여’의 뜻으로도 읽힐 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘신전 구역’ 또는 ‘신성한 구내’입니다. 그리스어 τέμενος는 신성하게 구별된 구역이나 성소를 가리킵니다.
    reason: lexical_alternative
