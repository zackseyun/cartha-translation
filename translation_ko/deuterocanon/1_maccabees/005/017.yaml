  rationale: 본문의 직접 표현을 보존하여 ἀδελφούς의 친족 언어를 약화시키지 않았습니다.
  doctrine_reference: 문맥 기반 어휘 보존
- issue: 지리명 ‘Γαλααδῖτις’의 처리
  chosen_reading: ‘길르앗 지역’으로 옮겨, 고유한 지역명 형식을 유지하되 과도한 음역은 피했습니다.
  alternative_readings:
