  text: And Judas said to Simon his brother[a], “Choose men for yourself, and go and rescue your brothers in Galilee; but I and Jonathan my brother will go into Gileaditis.”
  footnotes:
  - marker: a
    text: Or “into Gilead.” The Greek names the region as “Gileaditis,” a more specific regional form.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다는 그의 형제 시몬에게 말했습니다. “네 자신을 위해 사람들을 선택하고 가서 갈릴래아에 있는 너희 형제들을 구출하라. 그러나 나와 내 형제 요나단은 길르앗 지역으로 가겠다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘길르앗 지역’은 그리스어의 더 구체적인 지역명 형식을 반영한 번역입니다. 영어 본문의 “Gileaditis”에 해당합니다.
    reason: lexical_alternative
