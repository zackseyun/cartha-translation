  text: And Judas said to Simon his brother[a], “Choose men for yourself, and go and rescue your brothers in Galilee; but I and Jonathan my brother will go into Gileaditis.”
  footnotes:
  - marker: a
    text: Or “into Gilead.” The Greek names the region as “Gileaditis,” a more specific regional form.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다는 자기 형제 시몬에게 말했습니다. “자신을 위해 사람들을 뽑아 가서 갈릴래아에 있는 형제들을 구출하십시오. 한편 나와 내 형제 요나단은 길르앗 지역으로[a] 가겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “길르앗으로.” 그리스어는 길르앗에서 파생된 더 구체적인 지역 명칭(Γαλααδῖτις)을 사용합니다.
    reason: lexical_alternative
