  yaml_path: translation/deuterocanon/1_maccabees/005/048.yaml
  text: And Judas sent them peaceful words[a], saying, “We will pass through your land to go to our own land, and no one will harm you; we will only pass through on foot.” But they were not willing to open to him.
  footnotes:
  - marker: a
    text: That is, they would grant neither entry nor passage, with the implied object of 'open' left unstated in the Greek.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 유다는 그들에게 평화의 말[a]을 전하며 이렇게 말했습니다. “우리는 여러분의 땅을 지나 우리 땅으로 가겠습니다. 아무도 여러분에게 해를 끼치지 않을 것입니다. 우리는 다만 걸어서 지나가겠습니다.” 그러나 그들은 그에게 열어 주려 하지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉, 그들은 입성이나 통과를 허락하지 않겠다는 뜻이며, ‘열다’의 목적어는 그리스어에서 생략되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγους εἰρηνικούς
  english_pob_choice: peaceful words
  chosen_korean: 평화의 말
  alternatives_korean:
  - 평안한 말
  - 화평의 말
  lexicon: LSJ
  rationale: 명사구의 직역을 유지하면서도 한국어에서 자연스럽게 읽히는 외교적 표현으로 옮겼습니다. '평화의 말'이 말의 내용이 평화를 지향함을 가장 직접적으로 드러냅니다.
- source_word: Διελευσόμεθα
  english_pob_choice: We will pass through
  chosen_korean: 우리는 ... 지나겠습니다
  alternatives_korean:
  - 우리는 ... 통과하겠습니다
  - 우리는 ... 지나갈 것입니다
  lexicon: LSJ
  rationale: 여기서는 영토를 가로질러 가는 이동을 뜻하므로 '지나가겠습니다'가 가장 자연스럽고, 미래 의지를 나타내는 뜻도 잘 살립니다.
- source_word: πλὴν τοῖς ποσὶν παρελευσόμεθα
  english_pob_choice: we will only pass through on foot
  chosen_korean: 우리는 다만 걸어서 지나가겠습니다
  alternatives_korean:
  - 우리는 다만 도보로 지나가겠습니다
  - 우리는 다만 발로 지나가겠습니다
  lexicon: LSJ
  rationale: '''τοῖς ποσίν''의 이미지를 한국어에서 가장 매끄럽게 살리는 표현은 ''걸어서''입니다. ''다만''으로 제한의 의미도 함께 드러냈습니다.'
- source_word: οὐκ ἠβούλοντο ἀνοῖξαι αὐτῷ
  english_pob_choice: they were not willing to open to him
  chosen_korean: 그들은 그에게 열어 주려 하지 않았습니다
  alternatives_korean:
  - 그들은 그에게 열어 주기를 원하지 않았습니다
  - 그들은 그에게 문을 열어 주려 하지 않았습니다
  lexicon: LSJ
  rationale: 그리스어가 열어 주는 대상의 구체적 객체를 생략한 채 말하므로, 한국어도 이를 과도하게 특정하지 않고 '열어 주다'로 옮겼습니다. 이는 성문이나 통행 허용을 모두 포괄할 수 있습니다.
theological_decisions:
- issue: 전쟁 상황 속에서도 유다가 먼저 평화적 통행을 제안하는 표현
  chosen_reading: '''평화의 말''과 ''해를 끼치지 않을 것입니다''를 통해, 무력 충돌보다 비적대적 통행 의사를 분명히 드러내는 쪽으로 옮겼습니다.'
  alternative_readings:
  - 중립적으로 '좋은 말'로 완화하는 번역
  - 협상 어조를 약화시키는 번역
  rationale: 본문은 군사적 맥락 속 협상 문서이므로, 평화 제안의 성격을 약화하지 않는 것이 원문의 의도에 맞습니다.
  doctrine_reference: 문맥상 역사 서술; 교리적 쟁점 없음
