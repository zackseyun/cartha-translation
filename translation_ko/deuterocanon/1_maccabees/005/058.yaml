  text: And they gave orders to those of the force with them[a], and they marched against Jamnia.
  footnotes:
  - marker: a
    text: Or 'to Jamnia.' The Greek phrase can denote movement toward a place, but in this military context it likely implies hostile advance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그들과 함께 있던 군대에 속한 사람들에게 명령을 내리고, 얌니아를 향해 진군했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 표현은 문맥에 따라 ‘얌니아로’ 또는 적대적 뉘앙스의 ‘얌니아를 향해’로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγειλαν
  english_pob_choice: gave orders
  chosen_korean: 명령을 내리고
  alternatives_korean:
  - 지시하고
  - 명령했습니다
  lexicon: BDAG
  rationale: 군사적 문맥에서 단순한 안내보다 권위 있는 명령 전달을 드러내는 표현으로 옮겼습니다.
- source_word: τοῖς ἀπὸ τῆς δυνάμεως τῆς μετʼ αὐτῶν
  english_pob_choice: to those of the force with them
  chosen_korean: 자기들과 함께한 군대의 사람들에게
  alternatives_korean:
  - 자기들과 함께한 군세의 이들에게
  - 자기들과 함께한 군대에서 온 사람들에게
  lexicon: LSJ
  rationale: ἀπό의 소속/부분적 뉘앙스를 살리면서도 한국어에서 자연스럽게 읽히도록 ‘군대의 사람들’로 풀었습니다.
- source_word: ἐπορεύθησαν
  english_pob_choice: they marched
  chosen_korean: 진군했습니다
  alternatives_korean:
  - 행군했습니다
  - 갔습니다
  lexicon: BDAG
  rationale: 전투 서술에서 단순 이동보다 군대의 전진을 분명히 드러내는 말로 옮겼습니다.
- source_word: ἐπὶ Ἰαμνίαν
  english_pob_choice: against Jamnia
  chosen_korean: 야므니아를 향해
  alternatives_korean:
  - 야므니아에 맞서
  - 야므니아로
  lexicon: LSJ
  rationale: ἐπί + 대격이 문맥상 적대적 진격을 암시할 수 있지만, 한국어 본문에서는 그 뉘앙스를 과도하게 단정하지 않고 방향성을 우선 살렸습니다.
