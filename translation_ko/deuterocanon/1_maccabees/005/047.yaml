lexical_decisions:
- source_word: ἀπέκλεισαν
  english_pob_choice: shut them in
  chosen_korean: 그들을 가두고
  alternatives_korean:
  - 그들을 안에 가두고
  - 그들을 봉쇄하고
  - 그들을 에워싸고
  lexicon: LSJ
  rationale: 문맥상 도시 안에 있던 이들을 빠져나가지 못하게 막는 뜻이므로, 한국어에서는 자연스러운 ‘가두다’로 옮겨 포위·차단의 효과를 살렸습니다.
- source_word: οἱ ἐκ τῆς πόλεως
  english_pob_choice: the men from the city
  chosen_korean: 그 성읍 사람들이
  alternatives_korean:
  - 그 성읍에서 나온 사람들
  - 성읍의 주민들이
  - 그 성읍의 남자들이
  lexicon: LSJ
  rationale: 그리스어는 문자적으로 ‘성읍에서 나온 자들’이지만, 군사적 상황에서 도시 방어에 가담한 집단을 가리키므로 과도하게 성별을 고정하지 않는 ‘성읍 사람들’이 적절합니다.
- source_word: ἐνέφραξαν
  english_pob_choice: blocked
  chosen_korean: 돌로 막았습니다
  alternatives_korean:
  - 돌로 봉했습니다
  - 돌로 차단했습니다
  - 돌로 닫아버렸습니다
  lexicon: LSJ
  rationale: 문이 돌로 막혀 더 이상 열 수 없게 된 물리적 행동을 분명히 드러내면서, 간결하고 현대적인 표현을 택했습니다.
- source_word: τὰς πύλας
  english_pob_choice: the gates
  chosen_korean: 성문들을
  alternatives_korean:
  - 문들을
  - 문지방들을
  - 출입문들을
  lexicon: LSJ
  rationale: 도시 문맥의 복수형 ‘성문들’을 유지해 성의 방어 구조를 살렸습니다.
