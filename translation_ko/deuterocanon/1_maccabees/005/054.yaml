  yaml_path: translation/deuterocanon/1_maccabees/005/054.yaml
  text: And they went up to Mount Zion with gladness and joy[a], and they offered whole burnt offerings, because not one of them had fallen until they returned in peace.
  footnotes:
  - marker: a
    text: Or simply, “burnt offerings.” The Greek term refers to offerings wholly consumed on the altar.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 기쁨과 즐거움으로 시온 산에 올라가 번제[a]를 드렸습니다. 이는 그들 가운데 한 사람도 쓰러지지 않고 평안히 돌아왔기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘번제’는 제단에서 완전히 불태우는 제사를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβησαν εἰς τὸ ὄρος Σιὼν
  english_pob_choice: went up to Mount Zion
  chosen_korean: 시온 산에 올라가서
  alternatives_korean:
  - 시온 산으로 올라가서
  - 시온 산에 올랐고
  lexicon: LSJ
  rationale: ἀνέβησαν의 기본 의미인 ‘올라가다’를 살리고, 예배 장소로서 시온 산을 자연스럽게 표현했습니다.
- source_word: ἐν εὐφροσύνῃ καὶ χαρᾷ
  english_pob_choice: with gladness and joy
  chosen_korean: 기쁨과 즐거움으로
  alternatives_korean:
  - 즐거움과 기쁨으로
  - 기쁨과 환희로
  lexicon: LSJ
  rationale: 두 명사가 모두 긍정적 축제를 가리키므로, 서로 다른 어감을 살리되 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: προσήγαγον ὁλοκαυτώματα
  english_pob_choice: they offered whole burnt offerings
  chosen_korean: 번제물을 바쳤습니다
  alternatives_korean:
  - 온전히 불살라 드리는 제물을 바쳤습니다
  - 전번제를 드렸습니다
  lexicon: LSJ
  rationale: ὁλοκαυτώματα는 제단에서 전부 불태우는 제사를 가리키므로 ‘번제물’로 옮기되, 문맥상 제의 행위를 분명히 했습니다.
- source_word: οὐκ ἔπεσεν ἐξ αὐτῶν οὐθεὶς
  english_pob_choice: not one of them had fallen
  chosen_korean: 한 사람도 쓰러지지 않은 채
  alternatives_korean:
  - 그들 가운데 아무도 죽지 않은 채
  - 한 명도 전사하지 않은 채
  lexicon: LSJ
  rationale: 군사적 맥락에서 ‘쓰러지다’는 전사/사망을 완곡하게 반영하며, 원문의 부정을 자연스럽게 전달합니다.
- source_word: ἕως τοῦ ἐπιστρέψαι ἐν εἰρήνῃ
  english_pob_choice: until they returned in peace
  chosen_korean: 평안히 돌아오기까지
  alternatives_korean:
  - 평안 가운데 돌아오기까지
  - 무사히 돌아오기까지
  lexicon: LSJ
  rationale: ἐν εἰρήνῃ는 단순히 ‘무사히’보다 더 넓게 평화롭고 안전한 귀환을 뜻하므로, ‘평안히’로 균형 있게 옮겼습니다.
theological_decisions:
- issue: ὁλοκαυτώματα의 제의적 뉘앙스
  chosen_reading: 번제물
  alternative_readings:
  - 번제
  - 온전히 불태워 드리는 제물
  rationale: 이 절은 전쟁의 승리 후 성전 예배를 묘사하므로, 제물이 전부 불살라지는 제의라는 점을 드러내는 ‘번제물’이 적절합니다.
  doctrine_reference: 제의 용어의 직접성 유지; 본문 맥락의 성전 예배 반영
