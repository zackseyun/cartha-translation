  text: And it happened that when the surrounding nations heard that the altar had been rebuilt and the sanctuary rededicated as before, they became very angry.
translation:
  language: ko
  text: 주변의 민족들이 제단이 다시 세워지고 성소가 전과 같이 새로 봉헌되었다는 말을 듣자, 몹시 분노했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἔθνη
  english_pob_choice: the surrounding nations
  chosen_korean: 주변의 민족들
  alternatives_korean:
  - 주변의 이방인들
  - 주변 나라들
  lexicon: LSJ
  rationale: 여기서는 유대 공동체를 둘러싼 비유대 민족들을 가리키므로, 한국어로는 문맥을 살려 ‘민족들’이 가장 직접적입니다.
- source_word: ᾠκοδομήθη
  english_pob_choice: had been rebuilt
  chosen_korean: 다시 세워지고
  alternatives_korean:
  - 재건되고
  - 다시 건축되고
  lexicon: LSJ
  rationale: 제단의 복구를 가리키므로 ‘세우다’가 자연스럽고, ‘다시’로 회복의 의미를 분명히 했습니다.
- source_word: ἐνεκαινίσθη
  english_pob_choice: rededicated
  chosen_korean: 새로 봉헌되었다
  alternatives_korean:
  - 다시 봉헌되었다
  - 새로 헌납되었다
  lexicon: LSJ
  rationale: 성소의 예배적 갱신을 나타내므로, 단순한 ‘헌납’보다 종교적 재봉헌을 드러내는 ‘새로 봉헌되었다’가 적절합니다.
- source_word: ὡς τὸ πρότερον
  english_pob_choice: as before
  chosen_korean: 전과 같이
  alternatives_korean:
  - 이전처럼
  - 예전과 같이
  lexicon: LSJ
  rationale: 복원된 상태가 이전의 정상 상태와 같아졌음을 간결하게 옮기는 표현입니다.
- source_word: ὠργίσθη σφόδρα
  english_pob_choice: they became very angry
  chosen_korean: 몹시 분노했습니다
  alternatives_korean:
  - 크게 화를 냈습니다
  - 극도로 분노했습니다
  lexicon: LSJ
  rationale: 강한 분노를 뜻하므로 ‘몹시’로 강도를 살리면서도 현대 한국어에서 자연스럽게 읽히도록 했습니다.
theological_decisions:
- issue: ἁγίασμα의 예배적 의미
  chosen_reading: 성소
  alternative_readings:
  - 성전
  - 거룩한 곳
  rationale: 본문은 제단과 짝을 이루는 성전 구역의 재봉헌을 말하므로, 예배적·공간적 의미를 함께 담는 ‘성소’가 가장 적합합니다.
  doctrine_reference: 'DOCTRINE.md: source-led rendering; cultic terminology consistency'
