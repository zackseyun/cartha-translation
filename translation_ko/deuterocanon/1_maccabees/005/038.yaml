  text: And Judas sent men to spy out the camp[a], and they reported to him, saying, “All the nations around you have gathered together against them—a very great force.”
  footnotes:
  - marker: a
    text: 'Greek: ''against them.'' The pronouns in this report are somewhat unexpected in context (''around you ... against them''), but the translation preserves the transmitted wording rather than smoothing it to ''against you'' or ''around us.'''
    reason: textual_variant
translation:
  language: ko
  text: 그리고 유다는 진영을 정탐하도록 사람들을 보냈습니다. 그들은 그에게 이렇게 보고했습니다. “여러분 주위의 모든 민족이 그들을 대적하여[a] 모여 있습니다. 병력이 매우 큽니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘그들을 대적하여’라고 읽습니다. 이 보고에는 ‘여러분 주위의’라는 2인칭 복수 표현 뒤에 예상 밖의 3인칭 복수 ‘그들을’이 나옵니다. 문맥에 맞추어 ‘여러분을’ 또는 ‘우리를’로 고치지 않고, 전승된 표현을 보존했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπέστειλεν
  english_pob_choice: sent
  chosen_korean: 보냈습니다
  alternatives_korean:
  - 파견했습니다
  - 보냈습니다
  lexicon: BDAG
  rationale: 군사적 서술에서 자연스러운 과거 서술로 처리하되, ‘파견하다’보다 간결한 ‘보냈습니다’가 본문 흐름을 잘 살립니다.
- source_word: κατασκοπῆσαι τὴν παρεμβολήν
  english_pob_choice: to spy out the camp
  chosen_korean: 진영을 정탐하도록
  alternatives_korean:
  - 진영을 염탐하도록
  - 진영을 살피도록
  lexicon: LSJ
  rationale: κατασκοπέω의 군사적 정탐 의미를 살리기 위해 ‘정탐하다’를 택했고, παρεμβολή는 전투 맥락의 ‘진영’으로 옮겼습니다.
- source_word: Ἐπισυνηγμένοι εἰσὶν
  english_pob_choice: have gathered together
  chosen_korean: 함께 모였습니다
  alternatives_korean:
  - 모여 있습니다
  - 함께 모여 있습니다
  lexicon: BDAG
  rationale: 완료적 상태를 드러내면서도 한국어 문맥에 자연스러운 현재 결과 상태로 옮겼습니다.
- source_word: πρὸς αὐτοὺς
  english_pob_choice: against them
  chosen_korean: 그들을 대항하여
  alternatives_korean:
  - 그들에 맞서
  - 그들에게
  lexicon: BDAG
  rationale: 전쟁 맥락의 πρὸς는 단순한 방향이 아니라 적대적 대치를 뜻하므로 ‘대항하여’로 옮겼습니다. 영어 POB처럼 대명사 불일치의 흔적을 평준화하지 않았습니다.
- source_word: πάντα τὰ ἔθνη τὰ κύκλῳ ὑμῶν
  english_pob_choice: all the nations around you
  chosen_korean: 당신들 둘레의 모든 민족
  alternatives_korean:
  - 여러분 주위의 모든 민족
  - 주위의 모든 민족
  lexicon: BDAG
  rationale: ἔθνη는 여기서 정치·민족 집단을 가리키므로 ‘민족’이 가장 덜 해석적인 대응입니다. κύκλῳ ὑμῶν의 2인칭 복수를 살려 ‘당신들 둘레의’로 옮겼습니다.
- source_word: δύναμις πολλὴ σφόδρα
  english_pob_choice: a very great force
  chosen_korean: 매우 큰 군대입니다
  alternatives_korean:
  - 대단히 큰 힘입니다
  - 매우 큰 병력입니다
  lexicon: BDAG
  rationale: δύναμις는 군사 서술에서 ‘군대/병력’의 뜻이 자연스럽고, πολλὴ σφόδρα의 중첩 강조를 ‘매우 큰’으로 압축해 살렸습니다.
theological_decisions:
- issue: 대명사 불일치 보존
  chosen_reading: ‘당신들 둘레의 모든 민족이 그들을 대항하여 함께 모였습니다’로 옮겨, Greek 텍스트의 αὐτούς를 평준화하지 않았습니다.
  alternative_readings:
  - ‘당신들 둘레의 모든 민족이 당신들을 대항하여 함께 모였습니다’
  - ‘주위의 모든 민족이 우리를 대항하여 모였습니다’
  rationale: 본문은 보고문의 시점 전환과 전해진 문장 그대로의 어색함을 보여 주므로, 번역에서도 그 흔적을 보존하는 것이 텍스트 비평적으로 더 충실합니다.
  doctrine_reference: Textual criticism / source fidelity
