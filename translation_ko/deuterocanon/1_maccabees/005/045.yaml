  lexicon: LSJ
  rationale: 여기서의 πάντα Ἰσραήλ은 추상적 민족 전체가 아니라 그곳에 있던 이스라엘 사람들을 가리키므로, 장소를 분명히 살려 옮겼습니다.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  english_pob_choice: from the least to the greatest
  chosen_korean: 적은 사람부터 많은 사람까지
  alternatives_korean:
  - 가장 작은 자부터 가장 큰 자까지
  - 어린 사람부터 늙은 사람까지
  lexicon: LSJ
  rationale: 관용구가 포괄성의 범위를 나타내므로, 연령으로만 좁히지 않고 사회적 규모의 전면성을 살렸습니다.
- source_word: ἀποσκευὴν
  english_pob_choice: baggage
  chosen_korean: 짐
  alternatives_korean:
  - 소지품
  - 휴대품
  - 장비
  lexicon: LSJ
  rationale: 이동 중인 무리와 함께하는 휴대 물품을 가장 간결하게 드러내는 한국어로 옮겼습니다.
- source_word: παρεμβολὴν μεγάλην σφόδρα
  english_pob_choice: a very great company
  chosen_korean: 매우 큰 무리
  alternatives_korean:
  - 매우 큰 진영
  - 아주 큰 집단
  - 대단히 큰 무리
  lexicon: LSJ
  rationale: παρεμβολή는 군사적 ‘진영’일 수도 있지만, 여기서는 가족과 짐까지 포함한 모인 사람들의 집합을 가리키므로 ‘무리’로 옮겨 의미를 과도하게 군사화하지 않았습니다.
- source_word: ἐλθεῖν εἰς γῆν Ἰούδα
  english_pob_choice: to come into the land of Judah
  chosen_korean: 유다 땅으로 오려고 했습니다
  alternatives_korean:
  - 유다 땅으로 들어가려고 했습니다
  - 유다 땅에 이르려고 했습니다
  lexicon: LSJ
  rationale: 원문의 목적 부정사 의미를 살리면서 한국어로 자연스럽게 목적을 드러냈습니다.
