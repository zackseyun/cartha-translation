base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/045.yaml
  text: And Judas gathered all Israel who were in Gilead[a], from the least to the greatest, along with their wives and their children and their baggage, a very great company, to come into the land of Judah.
  footnotes:
  - marker: a
    text: Or 'a very large camp.' The Greek παρεμβολή can denote a camp, especially in military contexts, but here it refers broadly to the gathered company with families and baggage.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다는 길르앗에 있는 모든 이스라엘 사람을, 작은 이부터 큰 이에 이르기까지, 그들의 아내들과 자녀들과 짐과 함께 모았습니다. 그들은 매우 큰 무리를 이루어 유다 땅으로 가려고 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 παρεμβολή는 ‘진영’ 또는 ‘군영’을 뜻할 수 있지만, 여기서는 가족과 짐을 포함하여 함께 모인 매우 큰 무리 전체를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγεν
  english_pob_choice: gathered
