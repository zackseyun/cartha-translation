lexical_decisions:
- source_word: Μετὰ δὲ τὰ ῥήματα ταῦτα
  english_pob_choice: After these words
  chosen_korean: 이 말들 뒤에
  alternatives_korean:
  - 이 일들 뒤에
  - 이 말을 한 뒤에
  lexicon: LSJ
  rationale: ῥήματα는 여기서 바로 앞의 발언을 가리키는 말로 읽히므로, 한국어는 자연스럽게 ‘이 말들 뒤에’로 옮겨 앞뒤 문맥의 시간 전환을 살렸습니다.
- source_word: συνήγαγεν παρεμβολὴν ἄλλην
  english_pob_choice: gathered another camp
  chosen_korean: 또 다른 진을 모아
  alternatives_korean:
  - 또 다른 군대를 소집하여
  - 다른 진을 집결시켜
  lexicon: LSJ
  rationale: παρεμβολή는 여기서 군사적 ‘진/주둔지’를 뜻하므로, POB의 ‘camp’에 맞춰 ‘진’을 택했고 συνήγαγεν은 ‘모으다’로 살렸습니다.
- source_word: παρενέβαλεν κατὰ πρόσωπον Ῥαφὼν
  english_pob_choice: encamped opposite Raphon
  chosen_korean: 라폰 맞은편에 진을 쳤습니다
  alternatives_korean:
  - 라폰 앞에 진을 쳤습니다
  - 라폰을 마주 보고 진을 쳤습니다
  lexicon: LSJ
  rationale: κατὰ πρόσωπον은 군사·지리 문맥에서 ‘맞은편/마주한 곳’을 뜻하므로 ‘맞은편에’가 가장 자연스럽습니다. παρενέβαλεν은 군사적으로 ‘진을 치다’가 적절합니다.
- source_word: ἐκ πέραν τοῦ χειμάρρου
  english_pob_choice: beyond the stream
  chosen_korean: 시내 건너편
  alternatives_korean:
  - 개울 건너편
  - 와디 건너편
  - 시내의 저편
  lexicon: LSJ
  rationale: χειμάρρου는 계절성 수로나 급류를 가리킬 수 있으므로, 너무 해석적인 ‘와디’보다 읽기 쉬운 ‘시내’로 옮기되, ‘건너편’으로 지리적 관계를 분명히 했습니다.
