    issue: ‘나팔들을 불게 하였고’가 원문의 단수 능동 동사를 사역 표현으로 변경함
    rationale: ἐσάλπισεν은 ‘그가 나팔을 불었다/나팔을 울렸다’라는 단수 능동형이며, 누군가에게 불게 했다는 뜻을 나타내지 않습니다.
