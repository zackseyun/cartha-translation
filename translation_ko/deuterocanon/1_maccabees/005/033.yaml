translation:
  language: ko
  text: 그리고 그는 세 부대로 나뉘어 그들 바깥으로 나아가, 나팔을 불었고[a] 그들은 기도하며 외쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘나팔을 불었다’(ἐσάλπισεν)를 단수로, 이어지는 ‘외쳤다’(ἐβόησαν)를 복수로 표현합니다. 번역은 이 수의 변화를 보존했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἐξῆλθεν
  english_pob_choice: went out against
  chosen_korean: 나가서
  alternatives_korean:
  - 맞서 나가서
  - 공격하러 나가서
  lexicon: LSJ
  rationale: 전투 문맥이므로 단순한 '나갔습니다'보다 적대적 접촉을 암시하는 서술이 필요하지만, 본문 자체가 직접 동사의 대상을 명시하지는 않으므로 과도한 해석은 피하고 '나가서'에 앞뒤 문맥으로 대립성을 살렸습니다.
- source_word: ἐν τρισὶν ἀρχαῖς
  english_pob_choice: in three divisions
  chosen_korean: 세 부대로
  alternatives_korean:
  - 세 대열로
  - 세 분대로
  - 세 진영으로
  lexicon: LSJ
  rationale: ἀρχαί는 군사 문맥에서 조직된 전투 단위를 가리킬 수 있으므로, 한국어에서는 자연스럽고 군사적인 '부대'가 가장 적절합니다.
- source_word: ἔξωθεν αὐτῶν
  english_pob_choice: from outside them
  chosen_korean: 바깥에서 그들 맞은편으로
  alternatives_korean:
  - 그들 바깥에서
  - 그들 밖에서
  - 그들 맞은편에서
  lexicon: LSJ
  rationale: ἔξωθεν의 기본 의미인 '밖에서/바깥에서'를 살리되, 전투 상황에서의 방향성을 드러내기 위해 '맞은편으로'를 덧붙여 너무 기계적이지 않게 옮겼습니다.
- source_word: ἐσάλπισεν ταῖς σάλπιγξιν
  english_pob_choice: they sounded the trumpets
  chosen_korean: 나팔들을 불게 하였고
  alternatives_korean:
  - 나팔을 불었습니다
  - 나팔 소리를 내게 하였고
  lexicon: LSJ
  rationale: 그리스어 본문은 형태상 단수 동사이지만 영어 POB가 집합적 의미를 따라 복수로 풀었고, 한국어에서도 군사 신호의 관용적 표현인 '나팔을 불다'를 사용하되 행위 주체의 집합성을 문맥상 살렸습니다.
- source_word: ἐβόησαν
  english_pob_choice: cried out
  chosen_korean: 소리쳤습니다
  alternatives_korean:
  - 외쳤습니다
  - 큰 소리로 부르짖었습니다
  lexicon: LSJ
  rationale: 군사적 환호나 외침의 강도를 담는 가장 직접적인 표현으로 '소리쳤습니다'를 택했습니다.
theological_decisions:
