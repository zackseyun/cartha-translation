  source_fidelity: 수정이 필요합니다. 초안의 ‘나팔들을 불게 하였고’는 단수형 ἐσάλπισεν을 사역 표현으로 바꾸어, 본문에 없는 사역 의미를 더합니다. 또한 그리스어의 단수 ‘그가 나팔을 불었고’와 뒤따르는 복수 ‘그들은 … 외쳤습니다’의 수 일치를 본문에서 평준화하지 않는 편이 원문 충실성에 더 적합합니다.
  naturalness: ‘바깥에서 그들 맞은편으로’는 현대 한국어로 다소 부자연스럽고 ‘맞은편’은 원문에 없는 방향 관계를 첨가합니다. ‘그들 바깥으로’는 원문의 다소 특이한 공간 표현을 과도하게 해석하지 않으면서 더 자연스럽게 전달합니다. ‘세 부대로 나뉘어’는 군사 편성 문맥에서 자연스럽습니다.
  terminology: ‘세 부대’, ‘나팔을 불다’, ‘기도하며 외치다’는 군사·종교 문맥에 적절합니다. 원문의 주어 수 변화는 본문과 각주에서 보존해야 하며, 영어 번역의 평준화 방식을 한국어 본문에 따를 필요는 없습니다.
