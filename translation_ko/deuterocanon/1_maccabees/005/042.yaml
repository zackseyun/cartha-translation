  yaml_path: translation/deuterocanon/1_maccabees/005/042.yaml
  text: And when Judas came near to the wadi[a], he stationed the scribes of the people at the wadi and commanded them, saying, “Do not let anyone camp[b], but let them all come into the battle.”
  footnotes:
  - marker: a
    text: Or 'torrent,' 'brook,' or 'streambed.' The Greek refers to a seasonal watercourse; 'wadi' is chosen to preserve the terrain sense.
    reason: lexical_alternative
  - marker: b
    text: '''Scribes of the people'' may denote administrative officers or record-keepers serving the army, but the translation preserves the literal term ''scribes.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 유다가 물이 흐르는 와디에 가까이 이르자, 그는 백성의 서기관들을 와디에 세워 두고 그들에게 명령하며 말했습니다. “아무도 진을 치지 못하게 하십시오. 모두 전투로 들어오게 하십시오.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''와디''는 계절에 따라 물이 흐르는 건천이나 골짜기 물길을 가리킵니다.'
    reason: lexical_alternative
  - marker: b
    text: '''진을 치다''는 군사적 맥락의 παρεμβάλλω를 살린 표현입니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χειμάρρουν τοῦ ὕδατος
  english_pob_choice: wadi of water
  chosen_korean: 물이 흐르는 와디
  alternatives_korean:
  - 와디
  - 급류
  - 개울바닥
  lexicon: LSJ
  rationale: χειμάρρους는 계절성 물길이나 건천을 가리키므로, 지형 감각을 살리되 한국어에서 이해 가능한 표현인 '물이 흐르는 와디'로 옮겼습니다. 영어의 'of water'에 해당하는 물길 성격도 함께 드러냅니다.
- source_word: ἔστησεν
  english_pob_choice: stationed
  chosen_korean: 세워 두고
  alternatives_korean:
  - 배치하고
  - 주둔시키고
  - 세우고
  lexicon: LSJ
  rationale: 군사적 맥락에서 단순한 '세우다'보다 위치와 임무를 맡겨 두는 의미가 살아 있는 표현으로 옮겼습니다.
- source_word: γραμματεῖς τοῦ λαοῦ
  english_pob_choice: the scribes of the people
  chosen_korean: 백성의 서기관들
  alternatives_korean:
  - 백성의 관리들
  - 백성의 서기들
  lexicon: LSJ
  rationale: 본문의 직접 어휘는 '서기관들'이므로 그 형태를 보존했습니다. 다만 문맥상 행정·군사 보조 역할을 암시할 수는 있어도, 이를 '관리들'로 바꾸지 않았습니다.
- source_word: Μὴ ἀφῆτε ἄνθρωπον παρεμβαλεῖν
  english_pob_choice: Do not let any man camp
  chosen_korean: 아무도 진을 치지 못하게 하십시오
  alternatives_korean:
  - 아무도 야영하지 못하게 하십시오
  - 어느 누구도 캠프를 치지 못하게 하십시오
  lexicon: LSJ
  rationale: παρεμβάλλω는 군사적 용례에서 진을 치다/야영하다의 뜻이므로 한국어 군사 문맥에 자연스러운 '진을 치다'를 택했습니다. ἄνθρωπον은 여기서 전투원 일반을 가리키는 단수 표현으로 보아 '아무도'로 풀었습니다.
- source_word: ἐρχέσθωσαν πάντες εἰς τὸν πόλεμον
  english_pob_choice: let them all come into the battle
  chosen_korean: 모두 전투로 들어오게 하십시오
  alternatives_korean:
  - 모두 전투에 나아오게 하십시오
  - 모두 싸움으로 들어오게 하십시오
  lexicon: LSJ
  rationale: 전군이 참여하라는 명령의 힘을 살리되, εἰς τὸν πόλεμον의 이동 이미지를 유지하기 위해 '전투로 들어오게'라고 옮겼습니다.
theological_decisions:
- issue: 직접 명령문과 인용문 안의 문체
  chosen_reading: 바깥 서술은 합쇼체로 유지하고, 인용문 안의 명령도 공손한 명령형인 '-십시오'로 통일했습니다.
  alternative_readings:
  - 인용문 안을 평서형으로 약화
  - 더 고어적인 명령형 사용
  rationale: 본문은 군사 지시이지만 한국어 성경 독자에게는 현대적이면서도 엄정한 명령조가 가장 자연스럽습니다. 원문의 명령 강도는 유지하되 고어화는 피했습니다.
  doctrine_reference: 문체 일관성 및 성경 번역 관행
