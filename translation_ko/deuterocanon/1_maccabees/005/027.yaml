  text: καὶ ἐν ταῖς λοιπαῖς πόλεσιν τῆς Γαλααδίτιδος εἰσὶν συνειλημμένοι· εἰς αὔριον πάσονται παρεμβαλεῖν ἐπὶ τὰ ὀχυρώματα, καὶ καταλαβέσθαι καὶ ἐξᾶραι ἅπαντας αὐτοὺς ἐν ἡμέρᾳ μιᾷ.
