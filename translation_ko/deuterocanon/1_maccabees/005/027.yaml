base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/027.yaml
  text: And in the other cities of Gilead they are shut in[a]; tomorrow they will encamp against the strongholds, capture them[c][b], and destroy all of them in a single day.
  footnotes:
  - marker: a
    text: Or 'are hemmed in' or 'are besieged' for 'are shut in.' The Greek describes people confined under threat, without requiring a more technical siege term.
    reason: lexical_alternative
  - marker: b
    text: Or 'they are about to' instead of 'they are set to'; the Greek verb conveys imminent intention.
    reason: lexical_alternative
  - marker: c
    text: '''Destroy all of them'' could also be rendered ''wipe them all out''; the Greek is forceful and likely refers to total destruction.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 길르앗의 나머지 도시들에는 그들이 갇혀 있습니다[a]. 내일 그들은 요새들에 맞서 진을 치고, 그것들을 점령하며[b], 한 날에 그들 모두를 없앨 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘포위되어 있습니다’, ‘둘러싸여 있습니다’로도 옮길 수 있습니다. 그리스어는 보다 일반적으로 압박 아래 갇힌 상태를 가리키며, 반드시 기술적인 ‘공성전’ 용어를 요구하지는 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘정복하며’로도 옮길 수 있습니다. καταλαβέσθαι는 성채를 점거하거나 장악하는 뜻을 포함합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘멸할 것입니다’, ‘쓸어버릴 것입니다’로도 옮길 수 있습니다. 그리스어는 매우 강한 총체적 파괴를 시사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λοιπαῖς πόλεσιν
  english_pob_choice: the other cities
  chosen_korean: 나머지 도시들
  alternatives_korean:
  - 다른 도시들
  - 남은 도시들
  lexicon: LSJ
  rationale: λοιπός의 기본 의미인 ‘남은/나머지’를 살리면서, 길르앗 안의 다른 도시들을 자연스럽게 가리키는 표현으로 옮겼습니다.
- source_word: συνειλημμένοι
  english_pob_choice: are shut in
  chosen_korean: 갇혀 있습니다
  alternatives_korean:
  - 포위되어 있습니다
  - 둘러싸여 있습니다
  - 막혀 있습니다
  lexicon: LSJ
  rationale: 이 분사는 단순한 ‘성채 포위’보다도 압박 아래 갇힌 상태를 나타내므로, 기술적 군사 용어보다 상태를 드러내는 표현을 택했습니다.
- source_word: παρεμβαλεῖν ἐπὶ τὰ ὀχυρώματα
  english_pob_choice: encamp against the strongholds
  chosen_korean: 요새들에 맞서 진을 치고
  alternatives_korean:
  - 요새들에 대항하여 진을 치고
  - 요새들 앞에 진을 치고
  - 요새들을 치려고 진을 치고
  lexicon: LSJ
  rationale: παρεμβαλεῖν의 군사적 뉘앙스인 ‘진을 치다’를 살리되, ἐπὶ τὰ ὀχυρώματα의 적대 방향을 ‘맞서’로 드러냈습니다.
- source_word: καταλαβέσθαι
  english_pob_choice: capture
  chosen_korean: 점령하며
  alternatives_korean:
  - 사로잡으며
  - 붙들며
  - 차지하며
  lexicon: LSJ
  rationale: 요새를 대상으로 한 καταλαβέσθαι는 단순 포획보다 ‘장악/점거’의 뜻이 자연스러워 군사적 맥락을 반영한 ‘점령하다’를 택했습니다.
- source_word: ἐξᾶραι ἅπαντας αὐτοὺς
  english_pob_choice: destroy all of them
  chosen_korean: 그들 모두를 없앨 것입니다
  alternatives_korean:
  - 그들 모두를 멸할 것입니다
  - 그들 모두를 쓸어버릴 것입니다
  - 그들 모두를 멸망시킬 것입니다
  lexicon: LSJ
  rationale: ἐξᾶραι는 이 전쟁 문맥에서 완전한 제거/파괴를 뜻하므로, 강도를 유지하면서도 과도하게 확장하지 않는 ‘없애다’로 옮겼습니다.
- source_word: ἐν ἡμέρᾳ μιᾷ
  english_pob_choice: in a single day
  chosen_korean: 한 날에
  alternatives_korean:
  - 하루 만에
  - 한날에
  - 단 하루에
  lexicon: LSJ
  rationale: 단일성과 신속성을 간결하게 살리기 위해 직역에 가까운 ‘한 날에’를 사용했습니다.
theological_decisions:
- issue: 전승되는 군사적 파멸 표현의 강도
  chosen_reading: ‘없앨 것입니다’로 번역해 총체적 파괴의 강도를 드러냈습니다.
  alternative_readings:
  - ‘멸할 것입니다’
  - ‘쓸어버릴 것입니다’
  rationale: 본문의 ἅπαντας αὐτούς와 ἐξᾶραι는 단순 제압이 아니라 전면적 제거를 가리키므로, 완화하지 않고 그대로 전달했습니다.
  doctrine_reference: 본문 의미 보존 원칙
