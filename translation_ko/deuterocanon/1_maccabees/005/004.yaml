    text: 또는 ‘바에안의 아들들’. 그리스어 고유명사 Βαιάν은 여러 방식으로 음역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμνήσθη
  english_pob_choice: remembered
  chosen_korean: 기억했는데
  alternatives_korean:
