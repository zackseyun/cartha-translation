  text: And he remembered the evil of the sons of Baian[a], who were a snare and a stumbling block to the people, lying in ambush for them on the roads.
  footnotes:
  - marker: a
    text: Or 'the sons of Baean'; the Greek proper name Βαιάν can be transliterated in more than one way.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 바얀[a]의 아들들의 악행을 기억하였습니다. 그들은 여러 길에서 백성을 매복하여 노렸으므로, 백성에게 올무와 걸림돌이 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바에안’. 그리스어 고유명사 Βαιάν은 여러 방식으로 음역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμνήσθη
  english_pob_choice: remembered
  chosen_korean: 기억했는데
  alternatives_korean:
  - 상기했는데
  - 떠올렸는데
  lexicon: BDAG
  rationale: aorist 중간태 μιμνῄσκομαι의 서술적 용법을 자연스럽게 살려, 단순 정보가 아니라 이전의 적대 행위를 마음에 되새기는 뜻을 담았습니다.
- source_word: τῆς κακίας
  english_pob_choice: the evil
  chosen_korean: 악행
  alternatives_korean:
  - 악
  - 사악함
  - 악의
  lexicon: BDAG
  rationale: 여기서는 추상적 성격의 '악'보다 사람들의 해코지와 적대 행위를 가리키는 문맥이므로, 행위성을 드러내는 '악행'이 가장 분명합니다.
- source_word: υἱῶν Βαιάν
  english_pob_choice: the sons of Baian
  chosen_korean: 바얀의 아들들
  alternatives_korean:
  - 바에안의 아들들
  - 바이안의 아들들
  - 바얀의 자손들
  lexicon: LSJ
  rationale: 고유명사는 음역을 유지했고, υἱοί + 고유명사의 집단 지칭을 직역하여 혈통/세력을 함께 암시하는 표현을 살렸습니다.
- source_word: παγίδα καὶ εἰς σκάνδαλον
  english_pob_choice: a snare and a stumbling block
  chosen_korean: 함정이자 걸림돌이었으며
  alternatives_korean:
  - 올무이자 걸림돌이었으며
  - 덫이자 실족하게 하는 것이었으며
  lexicon: BDAG
  rationale: παγίς의 사냥/포획 이미지는 '함정'이 가장 직접적이고, σκάνδαλον은 표준적인 '걸림돌'로 옮겨 두 병렬 이미지를 자연스럽게 보존했습니다.
- source_word: ἐν τῷ ἐνεδρεύειν αὐτοὺς ἐν ταῖς ὁδοῖς
  english_pob_choice: lying in ambush for them on the roads
  chosen_korean: 길들에서 그들을 매복하고 있었습니다
  alternatives_korean:
  - 길에서 그들을 매복하고 있었습니다
  - 길목에서 그들을 노리고 있었습니다
  - 길들에서 그들에게 매복하고 있었습니다
  lexicon: BDAG
  rationale: articular infinitive의 상황/수단 의미를 동사구로 풀어, '매복하다'의 지속적 행동과 장소성('길들에서')을 함께 드러냈습니다.
theological_decisions:
- issue: 이 절의 악의 묘사와 공동체에 대한 위협의 표현
  chosen_reading: 가해자들의 행위를 도덕적 추상어로만 두지 않고, 백성에게 실제로 위험이 된 매복 행위로 번역했습니다.
  alternative_readings:
  - '''악''으로만 옮겨 보다 일반적인 도덕 평가로 처리'
  - '''실족'' 중심으로만 옮겨 관계적 위협을 약화'
  rationale: 원문은 단순한 평가가 아니라 '함정/걸림돌/매복'의 복합 이미지를 통해 공동체적 위협을 구체화하므로, 그 긴장을 보존하는 쪽이 본문의 힘을 더 잘 드러냅니다.
  doctrine_reference: '서사 본문 해석 원칙: 본문의 적대와 구원사적 긴장을 희석하지 않음'
