  - 사악함
  - 악의
  lexicon: BDAG
  rationale: 여기서는 추상적 성격의 '악'보다 사람들의 해코지와 적대 행위를 가리키는 문맥이므로, 행위성을 드러내는 '악행'이 가장 분명합니다.
- source_word: υἱῶν Βαιάν
  english_pob_choice: the sons of Baian
  chosen_korean: 바얀의 아들들
