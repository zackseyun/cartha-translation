translation:
  language: ko
  text: 그리고 그는 바얀의 아들들의 악행을 기억했는데, 그들은 백성에게 함정이자 걸림돌이었으며, 길들에서 그들을 매복하고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
