  text: καὶ Α ἐξέκλινεν Ἰούδας εἰς Ἄζωτον γῆν ἀλλοφύλων, καὶ καθεῖλεν τοὺς βωμοὺς αὐτῶν, καὶ τὰ γλυπτὰ τῶν θεῶν αὐτῶν κατέκαυσαν, καὶ ἐσκύλευσεν τὰ σκῦλα τῶν πόλεων, καὶ ἐπέστρεψεν εἰς τὴν Ἰουδαίαν.
