revisions:
- from: 유다는 아조도스, 곧 이방인의 땅으로 돌아섰고, 그들의 제단들을 허물었으며, 그들의 신들의 새긴 형상들을 불로 태웠고, 그 도시들의 전리품을 약탈하고 유대로 돌아왔습니다.[a][b]
  to: 유다는 아조토스, 곧 이방인의 땅[a] 쪽으로 방향을 돌려 그들의 제단들을 허물었습니다. 그들은 그들의 신들의 조각상들을 태웠으며[b], 유다는 그 도시들의 전리품을 약탈하고 유대로 돌아왔습니다.
  rationale: 복수 동사의 수 정보를 본문에 보존하고, 그리스어에 명시되지 않은 ‘불로’를 삭제했습니다. 지명은 그리스어 형태에 맞추어 음역했으며, 어색한 직역 표현을 현대 표준 한국어의 자연스러운 합쇼체 문장으로 조정했습니다. 각주 표지도 각각의 관련 어구와 동사에 배치했습니다.
