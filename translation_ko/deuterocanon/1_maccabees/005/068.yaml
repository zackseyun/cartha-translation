base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/068.yaml
  text: And Judas turned aside into Azotus[a], the land of foreigners, and he tore down their altars, and burned the carved images of their gods with fire, and plundered the spoil of the cities[b], and returned to Judea.
  footnotes:
  - marker: a
    text: Or, more specifically in historical context, 'the land of the Philistines.' The Greek reads more literally 'the land of foreigners.'
    reason: alternative_reading
  - marker: b
    text: The Greek verb here is plural ('they burned'), though the surrounding verbs are singular. This likely refers to Judas's forces rather than Judas alone.
    reason: textual_variant
translation:
  language: ko
  text: 유다는 아조토스, 곧 이방인의 땅[a] 쪽으로 방향을 돌려 그들의 제단들을 허물었습니다. 그들은 그들의 신들의 조각상들을 태웠으며[b], 유다는 그 도시들의 전리품을 약탈하고 유대로 돌아왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘이방인의 땅’이라고 합니다. 역사적 맥락에서는 ‘블레셋 사람들의 땅’으로 이해될 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어 동사는 복수형입니다. 앞뒤 동사들은 유다를 단수 주어로 삼지만, 여기서는 문맥상 유다의 군사들을 가리키는 것으로 보입니다.
    reason: textual_variant
lexical_decisions:
- source_word: Ἄζωτον
  english_pob_choice: Azotus
  chosen_korean: 아조도스
  alternatives_korean:
  - 아스돗
  lexicon: SBLGNT/헬라어 고유명사 관행
  rationale: 그리스어 본문이 헬라화된 지명 Ἄζωτον을 쓰므로, 본문 형태를 살려 음역했습니다.
- source_word: γῆν ἀλλοφύλων
  english_pob_choice: the land of foreigners
  chosen_korean: 이방인의 땅
  alternatives_korean:
  - 블레셋 사람들의 땅
  - 외국인의 땅
  lexicon: LSJ
  rationale: ἀλλόφυλοι의 문자적 의미를 살리되, 한국어에서는 자연스러운 표현인 ‘이방인’으로 옮겼습니다. 역사적 식별은 본문 바깥에서만 가능하므로 주석으로 넘기지 않았습니다.
- source_word: γλυπτὰ τῶν θεῶν αὐτῶν
  english_pob_choice: carved images of their gods
  chosen_korean: 그들의 신들의 새긴 형상들
  alternatives_korean:
  - 그들의 조각한 우상들
  - 그들의 새긴 우상들
  lexicon: LSJ
  rationale: γλυπτά는 ‘새겨 만든 것/조각품’의 물질성을 드러내므로, 단순히 ‘우상’으로만 처리하지 않고 ‘새긴 형상들’로 옮겼습니다.
- source_word: ἐσκύλευσεν τὰ σκῦλα
  english_pob_choice: plundered the spoil
  chosen_korean: 전리품을 약탈하고
  alternatives_korean:
  - 노략질하고
  - 노획물을 빼앗고
  lexicon: LSJ
  rationale: σκῦλα/σκύλευω의 전쟁 포획 의미를 살려 ‘전리품을 약탈하다’로 옮겼습니다. 한국어에서는 같은 어근을 반복하기보다 자연스러운 서술로 정리했습니다.
theological_decisions:
- issue: ἀλλόφυλοι의 번역에서 역사적 지명 해석을 본문에 넣을지 여부
  chosen_reading: 이방인의 땅
  alternative_readings:
  - 블레셋 사람들의 땅
  rationale: 그리스어 자체는 더 넓은 민족적 표현을 쓰므로, 본문에는 문자적 의미를 유지하고 역사적 동일시는 명시하지 않았습니다.
  doctrine_reference: 번역 원칙 §1, §5
- issue: plural verb κατέκαυσαν의 주어 처리
  chosen_reading: 그들의 신들의 새긴 형상들을 불로 태웠고
  alternative_readings:
  - 그가 불로 태웠고
  rationale: 그리스어 복수형을 한국어 본문에서 굳이 주어로 드러내지 않아도, 앞뒤 문맥상 군사적 행위의 집단성이 자연스럽게 전달됩니다. 따라서 헬라어의 수 정보는 과도하게 평탄화하지 않되, 한국어 문장에서는 매끄럽게 처리했습니다.
  doctrine_reference: 투명성 원칙
