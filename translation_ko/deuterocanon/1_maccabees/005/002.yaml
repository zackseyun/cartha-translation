  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ἐβουλεύοντο는 미완료형이므로 완료된 사건처럼 들리는 ‘음모를 꾸몄고’보다 지속적인 계획·모의를 드러내는 표현이 더 적절합니다. 또한 τοὺς ὄντας ἐν μέσῳ αὐτῶν은 ‘야곱의 후손’을 수식하므로 이를 바로 인접시켜 명확히 하는 것이 좋습니다. ἐν τῷ λαῷ의 압축된 표현은 본문에서 ‘백성 가운데 있는 자들’로 자연스럽게 보존할 수 있습니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘자기들 가운데 있는 야곱의 후손’은 원문의 수식 관계를 분명히 하며, ‘음모를 꾸미고 있었으며’는 문맥의 적대성과 지속성을 함께 전달합니다.
  terminology: ‘야곱의 후손’은 γένος의 혈통·계보 의미를 자연스럽게 전달합니다. ‘멸절하기’는 ἐξαίρειν이 앞선 ‘죽이고’와 결합하여 나타내는 제거·근절의 강한 의미를 보존합니다. 각주 표지는 해당 어구 바로 뒤에 배치하고, 각주 b의 부자연스러운 ‘파편적 표현’은 ‘압축된 표현’으로 고칩니다.
