  text: And they were plotting to remove the offspring of Jacob who were among them[b][a], and they began to kill and wipe out those among the people.
  footnotes:
  - marker: a
    text: Or 'the race of Jacob' or 'the people of Jacob.' The Greek γένος emphasizes descent or kinship.
    reason: lexical_alternative
  - marker: b
    text: Or 'among the people.' The Greek phrase ἐν τῷ λαῷ is somewhat compressed and may be understood locatively or partitivally in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 자기들 가운데 있는 야곱의 후손[a]을 없애려고 음모를 꾸미고 있었으며, 백성 가운데 있는 자들[b]을 죽이고 멸절하기 시작했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야곱의 족속’, ‘야곱의 민족’. 그리스어 γένος는 혈통과 친족 관계를 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘백성 가운데서’. 그리스어 ἐν τῷ λαῷ는 문맥상 ‘그들 가운데 있는 자들’로도, ‘백성 가운데’라는 압축된 표현으로도 이해될 수 있습니다.
    reason: lexical_alternative
