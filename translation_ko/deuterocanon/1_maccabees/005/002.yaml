    rationale: 원문은 그들이 계속 모의하거나 계획하고 있던 상태를 나타냅니다. ‘음모를 꾸미고 있었으며’가 시상과 적대적 뉘앙스를 더 잘 보존합니다.
  - severity: low
    issue: τοὺς ὄντας ἐν μέσῳ αὐτῶν의 수식 관계가 한국어 어순상 다소 느슨합니다.
    rationale: ‘야곱의 후손’ 앞에 ‘자기들 가운데 있는’을 두면, 그들 가운데 거주하던 야곱의 후손이 표적이라는 원문의 관계가 명확해집니다.
