theological_decisions:
- issue: βουλομένου αὐτοῦ ἀνδραγαθῆσαι의 주어 처리
  chosen_reading: 문맥상 ‘그가’로 두되, 번역은 원문의 단수 절 구조를 따라 개인의 용맹 욕구가 원인이 되었음을 드러냈습니다.
  alternative_readings:
  - 문맥의 복수 주어를 따라 ‘그들이’로 옮길 수 있음
  - 보다 중성적으로 ‘용맹을 떨치려 했기 때문입니다’라고만 처리할 수 있음
  rationale: 본문의 그리스어는 단수 속격 절을 제시하므로, 문맥에 기대어 복수화하지 않고 원문의 문법적 긴장을 보존했습니다.
  doctrine_reference: 원문 우선 원칙; 문법적 불일치를 평준화하지 않음.
