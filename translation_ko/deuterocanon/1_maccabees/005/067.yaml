  text: On that day priests fell in battle[a], because they wanted to act bravely[b], when they went out into battle without counsel.
  footnotes:
  - marker: a
    text: Or 'to distinguish himself' or 'to perform a heroic deed.' The Greek verb conveys showing valor.
    reason: lexical_alternative
  - marker: b
    text: Or 'without deliberation' or 'rashly.' The Greek literally means 'without counsel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그날 제사장들은, 그가 용맹을 드러내고자 했기 때문에[a], 그들이 아무런 의논도 없이 전투에 나갔을 때 전투에서 쓰러졌습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두드러지게 자신을 보이고자 했기 때문에’, ‘영웅적 행위를 하고자 했기 때문에’. 그리스어 동사는 용맹을 보이거나 영웅적 행위를 한다는 뜻을 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘숙고 없이’, ‘성급하게’. 그리스어는 문자적으로 ‘의논 없이’라는 뜻입니다.
    reason: lexical_alternative
