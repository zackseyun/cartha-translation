base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/067.yaml
  text: On that day priests fell in battle[a], because they wanted to act bravely[b], when they went out into battle without counsel.
  footnotes:
  - marker: a
    text: Or 'to distinguish himself' or 'to perform a heroic deed.' The Greek verb conveys showing valor.
    reason: lexical_alternative
  - marker: b
    text: Or 'without deliberation' or 'rashly.' The Greek literally means 'without counsel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에 제사장들이 전투에서 쓰러졌습니다[a]. 이는 그가 용맹을 떨치고자 했기 때문입니다[b]—그들이 아무런 계책 없이 전투로 나갔기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전사했습니다’, ‘죽었습니다’. 여기서는 전투 맥락의 죽음을 살려 ‘쓰러졌습니다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘두드러지게 자신을 보이고자 했기 때문입니다’, ‘영웅적 행위를 하고자 했기 때문입니다’. 그리스어는 용맹을 드러내는 뜻을 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσαν
  english_pob_choice: fell
  chosen_korean: 쓰러졌습니다
  alternatives_korean:
  - 죽었습니다
  - 전사했습니다
  lexicon: BDAG
  rationale: 전투 맥락의 죽음을 자연스럽게 살리되, 단순 사망보다 전투적 함의를 가진 ‘쓰러지다’로 옮겼습니다.
- source_word: ἱερεῖς
  english_pob_choice: priests
  chosen_korean: 제사장들이
  alternatives_korean:
  - 사제들이
  - 제사장들
  lexicon: BDAG
  rationale: 유대 문맥의 priest는 ‘제사장’이 가장 분명하며, 정관이 없어도 집단 일반을 가리키는 복수로 처리했습니다.
- source_word: ἀνδραγαθῆσαι
  english_pob_choice: to act bravely
  chosen_korean: 용맹을 떨치고자 했기 때문입니다
  alternatives_korean:
  - 용감하게 행동하고자 했기 때문입니다
  - 영웅적 행위를 하고자 했기 때문입니다
  - 두드러지게 용맹을 보이고자 했기 때문입니다
  lexicon: LSJ
  rationale: ‘남자답게/용맹하게 행동하다’의 뉘앙스를 현대 한국어에서 직역보다 자연스럽게 살리기 위해 ‘용맹을 떨치다’로 옮겼습니다.
- source_word: ἀβουλεύτως
  english_pob_choice: without counsel
  chosen_korean: 아무런 계책 없이
  alternatives_korean:
  - 숙고 없이
  - 충고 없이
  - 아무런 의논도 없이
  lexicon: LSJ
  rationale: ‘counsel’의 핵심인 신중한 판단·조언의 부재를 담기 위해 ‘아무런 계책 없이’로 번역해, 단순한 성급함보다 계획 부재를 드러냈습니다.
theological_decisions:
- issue: βουλομένου αὐτοῦ ἀνδραγαθῆσαι의 주어 처리
  chosen_reading: 문맥상 ‘그가’로 두되, 번역은 원문의 단수 절 구조를 따라 개인의 용맹 욕구가 원인이 되었음을 드러냈습니다.
  alternative_readings:
  - 문맥의 복수 주어를 따라 ‘그들이’로 옮길 수 있음
  - 보다 중성적으로 ‘용맹을 떨치려 했기 때문입니다’라고만 처리할 수 있음
  rationale: 본문의 그리스어는 단수 속격 절을 제시하므로, 문맥에 기대어 복수화하지 않고 원문의 문법적 긴장을 보존했습니다.
  doctrine_reference: 원문 우선 원칙; 문법적 불일치를 평준화하지 않음.
