  text: 그는 이방인들의 땅[a]으로 가려고 떠났고, 사마리아를 지나갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘블레셋 사람들의 땅’. 헬라어 ἀλλόφυλοι는 성경 용례에서 블레셋 사람들을 가리키는 관용적 표현으로도 쓰일 수 있습니다. 그러나 이 절 자체는 이를 더 좁게 특정하지 않으므로 ‘이방인들’로 옮겼습니다.
    reason: lexical_alternative
