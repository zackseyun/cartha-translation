  text: And he set out to go into the land of the foreigners[a], and he passed through Samaria.
  footnotes:
  - marker: a
    text: Or, possibly, 'the land of the Philistines,' since Greek ἀλλόφυλοι can function as a conventional designation for Philistines in biblical usage; here the broader rendering 'foreigners' is retained because the verse itself does not specify more narrowly.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 이방인의 땅으로 가려고 떠났고, 사마리아를 지나갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘블레셋 사람들의 땅’일 수 있습니다. 헬라어 ἀλλόφυλοι는 성경 용례에서 블레셋을 가리키는 관용적 표현으로도 쓰일 수 있지만, 이 절 자체는 더 좁은 식별을 분명히 하지 않으므로 ‘이방인’으로 옮겼습니다.
    reason: lexical_alternative
