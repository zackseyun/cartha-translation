  yaml_path: translation/deuterocanon/1_maccabees/005/025.yaml
  text: And they met the Nabateans[a], and they greeted them peaceably, and they told them everything that had happened to their brothers in Gilead,
  footnotes:
  - marker: a
    text: Or 'they greeted them peacefully' or 'they met them in peace.' The Greek verb can denote going out to meet or receiving someone, and the adverb emphasizes peaceful intent.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 나바테아인들을 만났습니다. 나바테아인들은 그들을 평화롭게 맞이하고, 길르앗에 있는 그들의 형제들에게 일어난 모든 일을 그들에게 자세히 이야기해 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘평화롭게 맞이하고’는 ὑπήντησαν αὐτοῖς εἰρηνικῶς를 옮긴 것입니다. 이 동사는 ‘마중 나가 맞이하다’, ‘만나 응대하다’ 또는 ‘평화롭게 만나다’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήντησαν τοῖς Ναβαταίοις
  english_pob_choice: they met the Nabateans
  chosen_korean: 나바테아인들에게 다가갔습니다
  alternatives_korean:
  - 나바테아인들을 만났습니다
  - 나바테아인들과 마주쳤습니다
  lexicon: LSJ
  rationale: συνήντησαν은 단순히 ‘만나다’보다 ‘다가가서 만나다’의 사건성을 띠므로, 문맥의 중립적 만남을 살려 ‘다가가다’로 옮겼습니다. Ναβαταίοις는 인명군 표기로 ‘나바테아인들’이 적절합니다.
- source_word: ὑπήντησαν αὐτοῖς εἰρηνικῶς
  english_pob_choice: they greeted them peaceably
  chosen_korean: 평화롭게 그들을 맞이하고
  alternatives_korean:
  - 평화롭게 그들에게 인사하고
  - 평화롭게 그들을 영접하고
  lexicon: BDAG
  rationale: ὑπαντάω는 ‘마중 나가 맞이하다/맞아들이다’의 뜻이 가능하고, εἰρηνικῶς가 비적대적 태도를 분명히 하므로 ‘평화롭게 맞이하다’가 원문의 뉘앙스를 가장 자연스럽게 반영합니다.
- source_word: διηγήσαντο
  english_pob_choice: they told
  chosen_korean: 그들에게 말했습니다
  alternatives_korean:
  - 그들에게 자세히 전했습니다
  - 그들에게 이야기했습니다
  lexicon: BDAG
  rationale: διηγήσαντο는 자세히 서술하다/전하다의 뜻이 있으나, 뒤의 목적어 ‘모든 일’을 통해 설명성이 이미 확보되므로 한국어에서는 간결하게 ‘말했습니다’로 옮겼습니다.
- source_word: ἅπαντα τὰ συμβεβηκότα
  english_pob_choice: everything that had happened
  chosen_korean: 일어난 모든 일
  alternatives_korean:
  - 발생한 모든 일
  - 겪은 모든 일
  lexicon: BDAG
  rationale: ἅπαντα는 총괄성을 가지므로 ‘모든 일’로 보존하고, συμβεβηκότα는 이미 일어난 사건들을 가리켜 ‘일어난’이 가장 직접적입니다.
- source_word: τοῖς ἀδελφοῖς αὐτῶν
  english_pob_choice: their brothers
  chosen_korean: 자기들의 형제들에게
  alternatives_korean:
  - 그들의 형제들에게
  - 동족들에게
  lexicon: BDAG
  rationale: ἀδελφοί는 문자적으로 ‘형제들’이므로 그 친족적 표현을 유지했습니다. 이 문맥에서는 단순한 혈연보다 같은 편의 공동체를 가리키는 말이지만, 원문의 관계어를 살리는 편이 더 좋습니다.
- source_word: ἐν τῇ Γαλααδίτιδι
  english_pob_choice: in Gilead
  chosen_korean: 길르앗에서
  alternatives_korean:
  - 길르앗 땅에서
  - 길르앗 지역에서
  lexicon: LSJ
  rationale: 지명은 한국어 성경에서 널리 쓰이는 ‘길르앗’이 가장 자연스럽고, 전치사 ἐν은 장소를 나타내므로 ‘-에서’로 처리했습니다.
theological_decisions:
- issue: 이 구절의 인사 표현과 만남의 성격
  chosen_reading: 나바테아인들과의 접촉을 적대적 충돌이 아니라 평화적 수용으로 제시하는 역사 서술로 옮겼습니다.
  alternative_readings:
  - 단순히 만났다고 중화하는 번역
  - ‘영접하다’로 더 공식적인 환대 뉘앙스를 주는 번역
  rationale: 본문의 εἰρηνικῶς는 단순 중립이 아니라 평화적 의도를 분명히 하므로, 이를 약화시키지 않으면서도 과도하게 의례화하지 않는 표현을 택했습니다.
  doctrine_reference: 역사서 본문의 서술 의도와 평화 표지의 보존
