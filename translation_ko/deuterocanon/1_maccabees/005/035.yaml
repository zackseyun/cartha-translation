review_pass:
  verdict: revise
  source_fidelity: 그리스어의 사건 순서와 핵심 내용(마아파로 방향을 돌림, 교전, 점령, 모든 남성 살해, 전리품 획득, 방화)은 대체로 충실히 반영되었습니다. 다만 ‘그곳과 싸워’는 장소를 상대로 하는 한국어 표현으로 다소 어색하므로, 대상을 명확히 하는 표현으로 다듬는 것이 좋습니다.
  naturalness: 합쇼체 문체는 적절합니다. 그러나 ‘마아파로 돌아서서 그곳과 싸워 그것을 점령하고’는 지시 대상이 연달아 바뀌어 다소 뻣뻣합니다. ‘마아파 쪽으로 방향을 돌려 그곳을 상대로 싸우고’가 원문의 이동 뉘앙스와 현대 한국어의 자연스러움을 함께 살립니다.
  terminology: ‘전리품’은 τὰ σκῦλα에 적절하며, ‘불에 태웠습니다’는 ἐν πυρί를 보존합니다. Μααφὰ의 음역인 ‘마아파’도 유지할 수 있습니다. 별도 음역 각주는 독자의 이해에 필수적이지 않아 삭제했습니다.
  issues:
  - severity: low
    issue: ‘그곳과 싸워’의 결합이 다소 부자연스럽습니다.
    rationale: ἐπολέμησεν αὐτήν은 도시를 상대로 전쟁을 벌였다는 뜻입니다. 한국어에서는 ‘그곳을 상대로 싸우고’ 또는 ‘그곳과 전쟁을 벌이고’가 더 자연스럽고 의미도 정확합니다.
  - severity: low
