  to: 그리고 그는 마아파 쪽으로 방향을 돌려 그곳을 상대로 싸우고, 그곳을 점령하여 그 안의 모든 남자를 죽였으며, 그 전리품을 빼앗고 그곳을 불에 태웠습니다.
  rationale: 원문의 ἀπέκλινεν이 나타내는 경로 전환을 ‘마아파 쪽으로 방향을 돌려’로 명확히 하고, 도시를 대상으로 한 ἐπολέμησεν αὐτήν을 자연스러운 한국어로 옮겼습니다. 살해·전리품 획득·방화의 직설적 순서와 범위는 완화하지 않았습니다.
