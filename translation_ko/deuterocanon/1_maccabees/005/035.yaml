  text: And he turned aside to Maapha and fought against it, and he captured it and killed every male in it, and he took its spoils and burned it with fire.
translation:
  language: ko
  text: 그리고 그는 마아파 쪽으로 방향을 돌려 그곳을 상대로 싸우고, 그곳을 점령하여 그 안의 모든 남자를 죽였으며, 그 전리품을 빼앗고 그곳을 불에 태웠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέκλινεν
  english_pob_choice: turned aside
  chosen_korean: 돌아서서
  alternatives_korean:
  - 옆길로 가서
  - 우회하여
  lexicon: LSJ
  rationale: 전진의 정형화된 군사 표현으로 과잉해석하지 않고, 경로를 벗어나 마아파로 향하는 움직임을 간결하게 살렸습니다.
- source_word: ἐπολέμησεν αὐτήν
  english_pob_choice: fought against it
  chosen_korean: 그곳과 싸워
  alternatives_korean:
  - 그곳과 전쟁을 벌여
  - 그곳을 공격하여
  lexicon: BDAG
  rationale: 도시를 상대로 한 군사 충돌을 자연스러운 한국어로 옮기되, 단순히 ‘공격하다’로 좁히지 않았습니다.
- source_word: πᾶν ἀρσενικὸν αὐτῆς
  english_pob_choice: every male in it
  chosen_korean: 그 안의 모든 남자
  alternatives_korean:
  - 그곳의 모든 남성
  - 그 안의 모든 남성
  lexicon: LSJ
  rationale: ἀρσενικόν의 성별 표지를 분명히 하면서, 집단의 전면적 파괴라는 의미를 유지했습니다.
- source_word: τὰ σκῦλα
  english_pob_choice: its spoils
  chosen_korean: 전리품
  alternatives_korean:
  - 노획물
  - 약탈물
  lexicon: BDAG
  rationale: 전쟁 맥락의 약탈물을 뜻하는 표준 한국어로 압축해, 이어지는 파괴 동작들과 자연스럽게 연결했습니다.
theological_decisions:
- issue: 전쟁 서술의 직설성
  chosen_reading: 완곡하게 바꾸지 않고, 도시 점령·남자 살해·전리품 탈취·방화의 순서를 그대로 드러냈습니다.
  alternative_readings:
  - 더 일반적인 ‘제압했다’로 완화
  - ‘남자들’을 생략하거나 약화
  rationale: 본문은 승리 서술이 아니라 전쟁의 참혹한 결과를 직접 제시하므로, 소스의 충격성을 유지하는 것이 의미 보존에 더 충실합니다.
  doctrine_reference: 서사 본문 해석 원칙; 본문 고유의 폭력 서술 보존
