  text: And the men of the city encamped, and they fought against the city all that day and all that night, and the city was delivered into his hands.
  footnotes:
  - marker: a
    text: 'Greek: ''into his hands'' (singular). Some translators smooth this to ''their hands'' to match the earlier plural subjects, but the source text here reads singular.'
