    rationale: ἐπολέμησαν τὴν πόλιν은 πόλιν을 직접 목적어로 취합니다. ‘그 도시를 상대로 싸우다’가 이 관계를 더 명확히 하면서도 한국어로 자연스럽습니다.
  - severity: low
    issue: 시간 표현의 어색함과 반복 강조의 약화 가능성
    rationale: ‘그날 온종일과 그 밤새도록’은 결합이 다소 어색합니다. ‘그날 내내와 그 밤 내내’는 ὅλην의 반복과 ἐκείνην의 지시를 자연스럽게 보존합니다.
