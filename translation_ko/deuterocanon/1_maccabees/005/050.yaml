  yaml_path: translation/deuterocanon/1_maccabees/005/050.yaml
  text: And the men of the city encamped, and they fought against the city all that day and all that night, and the city was delivered into his hands.
  footnotes:
  - marker: a
    text: 'Greek: ''into his hands'' (singular). Some translators smooth this to ''their hands'' to match the earlier plural subjects, but the source text here reads singular.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그 도시의 남자들은 진을 치고, 그날 내내와 그 밤 내내 그 도시를 상대로 싸웠으며, 그 도시는 그의 손에 넘겨졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 본문은 마지막 구절에서 단수 αὐτοῦ(‘그의’)를 사용합니다. 앞부분의 복수 주어에 맞추어 ‘그들의 손’으로 매끄럽게 옮길 수도 있지만, 여기서는 원문의 단수를 그대로 반영했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: παρενέβαλον
  english_pob_choice: encamped
  chosen_korean: 진을 치고
  alternatives_korean:
  - 야영했고
  - 진을 쳤고
  - 주둔했고
  lexicon: LSJ
  rationale: 군사적 맥락에서 παρενέβαλον의 기본 의미를 자연스럽게 살려, 전투 위치를 잡는 행위를 간결하게 표현했습니다.
- source_word: οἱ ἄνδρες τῆς πόλεως
  english_pob_choice: the men of the city
  chosen_korean: 도시의 남자들
  alternatives_korean:
  - 그 도시의 남자들
  - 도시의 남성들
  - 그 도시의 사람들
  lexicon: LSJ
  rationale: ἄνδρες는 일반 주민이 아니라 ‘남자들’이므로 성별을 흐리지 않고 직역에 가깝게 옮겼습니다.
- source_word: ἐπολέμησαν τὴν πόλιν
  english_pob_choice: they fought against the city
  chosen_korean: 그 도시와 싸웠으며
  alternatives_korean:
  - 그 도시에 맞서 싸웠으며
  - 그 도시를 상대로 싸웠으며
  - 그 도시를 공격했으며
  lexicon: LSJ
  rationale: 동사 ἐπολέμησαν은 단순한 공격보다 ‘싸우다/전쟁하다’에 가깝고, 목적어 πόλιν은 한국어에서 자연스럽게 ‘-와 싸우다’로 처리했습니다.
- source_word: ὅλην τὴν ἡμέραν ἐκείνην καὶ ὅλην τὴν νύκτα
  english_pob_choice: all that day and all that night
  chosen_korean: 그날 온종일과 그 밤새도록
  alternatives_korean:
  - 그 온종일과 그 밤새도록
  - 그 하루 종일과 그 밤새도록
  - 그날 하루 종일과 밤새도록
  lexicon: LSJ
  rationale: 반복되는 ὅλην의 강조를 살려, 시간의 지속을 현대 한국어의 자연스러운 표현으로 옮겼습니다.
- source_word: ἐν χερσὶν αὐτοῦ
  english_pob_choice: into his hands
  chosen_korean: 그의 손에 넘겨졌습니다
  alternatives_korean:
  - 그의 손에 주어졌습니다
  - 그의 손에 맡겨졌습니다
  - 그의 손에 넘어갔습니다
  lexicon: LSJ
  rationale: 수동태 παρεδόθη를 ‘넘겨지다’로 살려 결과를 명확히 했고, αὐτοῦ의 단수를 한국어에서도 그대로 반영했습니다.
theological_decisions:
- issue: 문장 끝의 단수 소유격 αὐτοῦ 반영
  chosen_reading: ‘그의 손’으로 단수를 유지했습니다.
  alternative_readings:
  - 복수 상황에 맞춰 ‘그들의 손’으로 완화함
  - 주체를 일반화하여 소유 표현을 약화함
  rationale: 원문은 앞부분의 복수 동사와 달리 결말에서 단수 αὐτοῦ를 사용하므로, 이를 평준화하지 않고 그대로 드러내는 것이 원문 투명성에 더 맞습니다.
  doctrine_reference: '번역 원칙: 원문 증거 우선, 해석적 평준화 지양'
