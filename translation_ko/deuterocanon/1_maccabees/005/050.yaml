review_pass:
  verdict: revise
  source_fidelity: 원문의 군사 동사 παρενέβαλον을 ‘진을 치고’로, ἐπολέμησαν τὴν πόλιν을 도시를 대상으로 싸운 행위로, παρεδόθη를 수동형 ‘넘겨졌습니다’로 옮긴 점은 충실합니다. 결말의 αὐτοῦ 단수도 ‘그의’로 유지되어야 합니다. 다만 ‘그 도시와 싸웠으며’는 원문의 타동사적 목적어 관계를 다소 흐리고, 한국어에서는 도시 자체가 상호 교전 당사자인 듯 들릴 수 있으므로 ‘그 도시를 상대로 싸웠으며’가 더 직접적입니다.
  naturalness: ‘그날 온종일과 그 밤새도록’보다 ‘그날 내내와 그 밤 내내’가 현대 표준어에서 더 자연스럽고, 원문의 ‘그날’과 ‘그 밤’ 및 양쪽의 전체성을 모두 드러냅니다. ‘그 도시의 남자들’도 문맥상 지시를 더 분명히 합니다.
  terminology: ‘진을 치다’, ‘남자들’, ‘손에 넘겨지다’는 군사적·서술적 문맥과 합쇼체에 적절합니다. 도시의 남성 전투 집단이라는 ἄνδρες의 성별 표지는 보존합니다.
  issues:
