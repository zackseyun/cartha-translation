lexical_decisions:
- source_word: διέβησαν
  english_pob_choice: crossed
  chosen_korean: 건너
  alternatives_korean:
  - 지나갔습니다
  - 건넜습니다
  lexicon: LSJ
  rationale: 여행 서술에서 διαβαίνω의 의미를 자연스럽게 살리면서, 목적어 ‘요르단’을 따라 이동의 방향성을 분명히 드러냅니다.
- source_word: τὸν Ἰορδάνην
  english_pob_choice: the Jordan
  chosen_korean: 요르단
  alternatives_korean:
  - 요르단 강
  lexicon: LSJ
  rationale: 본문의 고유명사를 직접 옮겨, 영어 POB처럼 불필요한 보충어를 덧붙이지 않았습니다.
- source_word: τὸ πεδίον τὸ μέγα
  english_pob_choice: the great plain
  chosen_korean: 큰 평야
  alternatives_korean:
  - 넓은 평야
  - 큰 평지
  lexicon: LSJ
  rationale: πεδίον의 평탄한 지형 의미를 살리되, 현대 한국어에서 자연스러운 지리 표현으로 옮겼습니다.
- source_word: Βαισάν
  english_pob_choice: Baisan
  chosen_korean: 베사안
  alternatives_korean:
  - 바이산
  - 벳산
  lexicon: LSJ
  rationale: 그리스어 형태 Βαισάν을 음역해, 영어 POB의 방침에 맞게 히브리어화된 지명을 직접 대체하지 않았습니다.
