  text: 그리고 그가 그들에게 명령하며 말하였습니다. 「이 백성을 돌보십시오. 우리가 돌아올 때까지는 민족들과 전투를 벌이지 마십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
