  source_fidelity: 그리스어 원문의 명령 구조와 핵심 의미는 대체로 충실합니다. Πρόσεχετε는 이 문맥에서 백성을 보호하며 돌보라는 뜻으로 자연스럽게 옮겼고, μὴ συνάψητε πόλεμον과 ἕως τοῦ ἐπιστρέψαι ἡμᾶς도 각각 전투 금지와 ‘우리가 돌아올 때까지’라는 시간 제한을 잘 반영합니다.
  naturalness: ‘그가 그들에게 명령하며 말하였습니다’는 현대 한국어 합쇼체 산문에서 다소 직역투이고 어색합니다. ‘그는 그들에게 이렇게 명령하였습니다’가 자연스럽고 원문의 말하기 도입 기능도 보존합니다. 각주에서 ‘보호적 감시’는 감시·감찰의 뉘앙스를 낼 수 있으므로 ‘보호를 위한 주의’로 고치는 편이 적절합니다.
  terminology: ‘백성’, ‘돌보십시오’, ‘민족들’, ‘전투를 벌이지 마십시오’는 문맥과 현대 한국어에 적합합니다. τὰ ἔθνη를 ‘이방 민족들’로 한정하지 않고 ‘민족들’로 둔 것은 원문의 표현을 불필요하게 해석적으로 좁히지 않습니다.
