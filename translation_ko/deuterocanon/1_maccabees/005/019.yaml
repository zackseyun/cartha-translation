    text: 또는 “이 백성을 지키십시오.” 그리스어 명령형은 일반적 주의보다 보호적 감시를 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνετείλατο
  english_pob_choice: commanded
  chosen_korean: 명령하였습니다
  alternatives_korean:
  - 지시하였습니다
  - 명령을 내렸습니다
  lexicon: BDAG
  rationale: ἐντέλλομαι의 중간태는 권위를 가진 지시를 뜻하므로, 완화된 표현보다 ‘명령하였습니다’가 원문의 강한 어조를 잘 드러냅니다.
- source_word: Πρόσεχετε
  english_pob_choice: Take care of
  chosen_korean: 돌보십시오
  alternatives_korean:
  - 살피십시오
  - 주의하십시오
  - 지켜보십시오
  lexicon: BDAG
  rationale: 여기서는 단순한 주의보다 προστατευ적 돌봄과 감시의 뉘앙스가 있어, 목적어 ‘이 백성’을 대상으로 한 책임 있는 보호를 담는 ‘돌보십시오’가 적절합니다.
- source_word: μὴ συνάψητε πόλεμον
  english_pob_choice: do not join battle
  chosen_korean: 전투를 벌이지 마십시오
  alternatives_korean:
  - 전쟁에 가담하지 마십시오
  - 전쟁을 시작하지 마십시오
  - 싸우지 마십시오
  lexicon: LSJ
  rationale: συνάπτειν πόλεμον은 전투/분쟁에 들어가다의 관용적 표현이므로, 과도하게 확대하지 않으면서 군사적 충돌을 자연스럽게 옮기는 표현을 택했습니다.
- source_word: τὰ ἔθνη
  english_pob_choice: the nations
  chosen_korean: 민족들
  alternatives_korean:
  - 열국
  - 이방 민족들
  - 나라들
  lexicon: BDAG
  rationale: 1 Maccabees의 ἔθνη는 주변 비유대 민족들을 가리키므로, 해석을 덜 덧붙이면서도 복수 집단성을 살리는 ‘민족들’이 적절합니다.
theological_decisions:
- issue: 보호 명령의 초점
  chosen_reading: 지휘관이 백성을 공격적으로 동원하기보다 보호하며 기다리라는 명령으로 읽었습니다.
  alternative_readings:
  - 단순한 병참 지시로 볼 수 있습니다.
  - 군사적 소극성만을 강조할 수 있습니다.
  rationale: 문맥상 아직 ‘돌아올 때까지’ 전투를 피하라는 지시가 핵심이므로, 보호 책임과 절제된 군사 행동을 함께 드러내는 것이 원문 의도에 가깝습니다.
  doctrine_reference: 문맥 해석 / 내러티브 신학
