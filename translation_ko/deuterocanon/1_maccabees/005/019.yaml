  text: 그리고 그는 그들에게 이렇게 명령하였습니다. 「이 백성을 돌보십시오[a]. 우리가 돌아올 때까지 민족들과 전투를 벌이지 마십시오.」
  philosophy: optimal-equivalence
  footnotes:
