  text: When Judas and the people heard these words[b][a], a great assembly gathered to consider what they should do for their brothers who were in distress and being attacked by them.
  footnotes:
  - marker: a
    text: Or 'these reports' / 'these things'; Greek 'these words.'
    reason: lexical_alternative
  - marker: b
    text: '''Brothers'' here refers to their fellow members of the Jewish people who were under pressure.'
    reason: cultural_note
translation:
  language: ko
  text: 주다와 백성이 이 말을 들었을 때, 자기 형제들—고난 가운데 있고 그들에게 공격을 받고 있는—을 위해 무엇을 해야 할지 의논하려고 큰 회중이 모였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘말’은 ‘보고’나 ‘소식’으로도 옮길 수 있습니다. 그리스어는 문자 그대로 ‘이 말들’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘형제들’은 문자적으로는 형제들을 뜻하지만, 문맥상 그들의 민족 공동체 구성원을 가리킵니다.
    reason: cultural_note
