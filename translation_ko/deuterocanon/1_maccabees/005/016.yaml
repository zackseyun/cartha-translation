translation:
  language: ko
  text: 유다와 백성이 이 말[a]을 듣자, 큰 집회가 모여 고난을 겪고 있으며 그들의 공격을 받고 있는 자기 형제들[b]을 위해 무엇을 해야 할지 의논했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘말’은 ‘보고’나 ‘소식’으로도 옮길 수 있습니다. 그리스어는 문자 그대로 ‘이 말들’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘형제들’은 문자적으로는 형제들을 뜻하지만, 문맥상 같은 민족 공동체의 구성원들을 가리킵니다.
    reason: cultural_note
