  terminology: ‘성읍’과 ‘길르앗’은 성경 문체 및 지명 관행에 잘 맞습니다. 지명은 원문의 형태를 더 가깝게 반영하여 Χασφώθ를 ‘하스포트’, Μακέδ를 ‘마케드’로 바로잡았습니다. ‘점령하다’는 이 문맥의 군사적 장악을 자연스럽게 전달합니다.
