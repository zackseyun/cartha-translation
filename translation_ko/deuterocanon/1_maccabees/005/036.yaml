  - 출발하여
  - 떠나서
  lexicon: ἀπέρχομαι
  rationale: 여기서는 단순한 이동이 아니라 다음 정복 행동으로 이어지는 출발을 자연스럽게 나타내기 위해 ‘떠나’로 옮겼습니다.
- source_word: προκατελάβετο
  english_pob_choice: took
  chosen_korean: 점령하였습니다
  alternatives_korean:
  - 취하였습니다
  - 차지하였습니다
  - 빼앗았습니다
  lexicon: προκαταλαμβάνω
  rationale: 문맥상 도시들을 군사적으로 먼저 장악했다는 뜻이므로, 영어 POB의 중립적 ‘took’보다 한국어에서는 결과를 분명히 드러내는 ‘점령하다’가 가장 정확합니다.
