translation:
  language: ko
  text: 그곳에서 떠나 하스포트, 마케드, 보소르와 길르앗의 나머지 성읍들을 먼저 점령하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆρεν
  english_pob_choice: he departed
  chosen_korean: 떠나
  alternatives_korean:
  - 출발하여
  - 떠나서
  lexicon: ἀπέρχομαι
  rationale: 여기서는 단순한 이동이 아니라 다음 정복 행동으로 이어지는 출발을 자연스럽게 나타내기 위해 ‘떠나’로 옮겼습니다.
- source_word: προκατελάβετο
  english_pob_choice: took
  chosen_korean: 점령하였습니다
  alternatives_korean:
  - 취하였습니다
  - 차지하였습니다
  - 빼앗았습니다
  lexicon: προκαταλαμβάνω
  rationale: 문맥상 도시들을 군사적으로 먼저 장악했다는 뜻이므로, 영어 POB의 중립적 ‘took’보다 한국어에서는 결과를 분명히 드러내는 ‘점령하다’가 가장 정확합니다.
- source_word: Χασφώθ, Μακέδ, Βοσόρ
  english_pob_choice: Hasphoth, Maked, Bosor
  chosen_korean: 하스포스, 막셋, 보소르
  alternatives_korean:
  - 하스포스, 마케드, 보소르
  - 하스포트, 막엣, 보소르
  lexicon: 고유명사 표기
  rationale: 헬라어 음가를 따라 현대 외래어 표기법에 가깝게 옮기되, 기존 한국어 성경에서 통용되는 형태를 우선 반영했습니다.
- source_word: τὰς λοιπὰς πόλεις τῆς Γαλααδίτιδος
  english_pob_choice: the rest of the cities of Gilead
  chosen_korean: 길르앗의 나머지 성읍들
  alternatives_korean:
  - 길르앗의 다른 도시들
  - 길르앗의 남은 성읍들
  lexicon: λοιπός / πόλις / Γαλααδίτις
  rationale: ‘λοιπὰς’는 남은/나머지의 뜻이고 ‘πόλεις’는 도시보다 성읍이 본문 분위기에 맞아, 기존 성경 용례를 살리면서도 정확성을 유지했습니다.
