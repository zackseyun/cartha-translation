  source_fidelity: ἀπῆρεν은 ‘떠나’로, τὰς λοιπὰς πόλεις τῆς Γαλααδίτιδος는 ‘길르앗의 나머지 성읍들’로 충실하게 옮겼습니다. 그러나 προκατελάβετο의 προ-가 나타내는 선점의 뉘앙스를 ‘먼저’로 반영하는 것이 더 정확합니다. 또한 Μακέδ는 끝 자음 δ를 보존하여 ‘마케드’로 표기해야 합니다.
