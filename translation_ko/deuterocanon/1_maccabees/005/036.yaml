  - severity: low
    issue: προκατελάβετο의 προ- 뉘앙스 미반영
    rationale: 동사는 단순히 취하거나 점령한 것뿐 아니라 앞서/먼저 장악한 뜻을 포함합니다. 한국어 본문에 ‘먼저’를 보태면 원문의 의미를 보존할 수 있습니다.
