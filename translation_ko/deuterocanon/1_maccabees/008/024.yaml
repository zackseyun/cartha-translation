lexical_decisions:
- source_word: ἐὰν δὲ ἐνστῇ πόλεμος
  english_pob_choice: But if war comes
  chosen_korean: 그러나 전쟁이 … 일어나면
  alternatives_korean:
  - 그러나 전쟁이 … 닥치면
  - 그러나 전쟁이 … 일어난다면
  lexicon: ἐνίστημι / πόλεμος
  rationale: ἐνστῇ는 단순히 ‘오다’보다 ‘일어나다/발생하다’가 더 직접적이어서, 전쟁의 발생을 자연스럽게 살렸습니다.
- source_word: Ῥώμῃ
  english_pob_choice: to Rome
  chosen_korean: 로마에
  alternatives_korean:
  - 로마로
  - 로마에게
  lexicon: Ῥώμη
  rationale: 전쟁이 ‘로마에’ 먼저 일어난다는 방향을 한국어 조사로 가장 자연스럽게 반영했습니다.
- source_word: προτέρα ἢ
  english_pob_choice: first
  chosen_korean: 먼저
  alternatives_korean:
  - 앞서
  - 우선
  lexicon: πρότερος
  rationale: 시간적 우선성을 간결하게 나타내는 말로 ‘먼저’가 가장 분명합니다.
- source_word: ἐν πάσῃ κυρίᾳ αὐτῶν
  english_pob_choice: anywhere within their dominion
  chosen_korean: 그들의 모든 영토 안에서
  alternatives_korean:
  - 그들의 모든 통치 구역 안에서
  - 그들의 지배 아래 있는 모든 땅에서
  lexicon: κυρία
  rationale: κυρίᾳ는 ‘주권/통치권’의 영역을 가리키므로, 한국어에서는 문맥상 이해되는 ‘영토’로 옮기되 ‘안에서’를 덧붙여 범위를 분명히 했습니다.
theological_decisions:
- issue: 로마와 동맹국들의 정치적 주권 범위 표현
  chosen_reading: ‘그들의 모든 영토 안에서’로 번역해 본문의 국제조약적, 정치적 범위를 드러냈습니다.
  alternative_readings:
  - ‘그들의 모든 통치 아래에서’
  - ‘그들의 지배권 안에서’
  rationale: 이 절은 신학적 용어보다 정치·외교적 조건을 제시하므로, 과도하게 신학화하지 않고 원문의 주권 범위를 정확히 전달하는 데 초점을 맞췄습니다.
  doctrine_reference: 1 Maccabees 8:24의 로마 조약 조항
