  yaml_path: translation/deuterocanon/1_maccabees/008/026.yaml
  text: To those who make war on them they shall neither give nor supply grain[a], weapons, silver, or ships, as Rome has decided; and they shall keep their obligations, taking nothing.
  footnotes:
  - marker: a
    text: Or 'they shall observe their terms' or 'they shall keep their treaty provisions' for 'they shall keep their obligations.' The Greek uses a cognate expression, literally 'they shall keep their things-to-be-kept,' in a treaty context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게 전쟁을 거는 자들에게는 곡식이나 무기, 은이나 배를 주지도 공급하지도 않을 것입니다. 이는 로마가 결정한 대로입니다. 그리고 그들은 아무것도 받지 않고 자기들의 의무를 지킬 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 조건을 지킬 것입니다’, ‘그들의 조약 조항을 지킬 것입니다’. 그리스어는 조약 문맥에서 ‘지켜야 할 것들’을 뜻하는 동족어 표현을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς πολεμοῦσιν
  english_pob_choice: to those who make war on them
  chosen_korean: 그들에게 전쟁을 거는 자들
  alternatives_korean:
  - 그들과 싸우는 자들
  - 전쟁을 벌이는 자들
  - 그들을 공격하는 자들
  lexicon: LSJ
  rationale: 분사구가 적대 행위를 하는 집단을 가리키므로, 한국어에서는 행위의 방향을 분명히 드러내는 ‘그들에게 전쟁을 거는 자들’로 옮겼습니다.
- source_word: οὐ δώσουσιν οὐδὲ ἐπαρκέσουσιν
  english_pob_choice: they shall neither give nor supply
  chosen_korean: 주지도 공급하지도 않을 것입니다
  alternatives_korean:
  - 주지도 도와주지도 않을 것입니다
  - 주지도 채워주지도 않을 것입니다
  - 주지도 제공하지도 않을 것입니다
  lexicon: LSJ
  rationale: δώσει와 ἐπαρκέω의 이중 금지를 각각 ‘주다’와 ‘공급하다’로 살려, 단순 제공과 보급·보충의 뉘앙스를 구분했습니다.
- source_word: σῖτον, ὅπλα, ἀργύριον, πλοῖα
  english_pob_choice: grain, weapons, silver, or ships
  chosen_korean: 곡식이나 무기, 은이나 배
  alternatives_korean:
  - 곡물이나 무기, 은이나 배
  - 식량이나 무기, 은이나 배
  - 곡식, 무기, 은, 배
  lexicon: LSJ
  rationale: σῖτον은 여기서 식량 일반보다 구체적인 ‘곡식’이 적절하고, ἀργύριον은 화폐 의미를 넘어서 원문 그대로 ‘은’을 보존하는 편이 고대적 상황을 더 잘 드러냅니다.
- source_word: φυλάξονται τὰ φυλάγματα αὐτῶν
  english_pob_choice: they shall keep their obligations
  chosen_korean: 자기들의 의무를 지킬 것입니다
  alternatives_korean:
  - 자기들의 조항을 지킬 것입니다
  - 자기들의 약속을 지킬 것입니다
  - 자기들의 지켜야 할 것들을 지킬 것입니다
  lexicon: LSJ
  rationale: 동족어 표현은 조약 문맥에서 ‘지켜야 할 의무/조항’을 뜻하므로, 직역의 어색함을 피하면서도 법적 구속력을 살리는 ‘의무’로 옮겼습니다.
theological_decisions:
- issue: 로마의 판단을 나타내는 관용구
  chosen_reading: ‘로마가 결정한 대로입니다’로 옮겨 공식적 결정을 드러냈습니다.
  alternative_readings:
  - 로마에 기쁘게 된 대로
  - 로마가 좋다고 여긴 대로
  rationale: ἔδοξεν + dative는 단순한 ‘좋게 보이다’보다 공적 결의나 판정의 의미가 강하므로, 조약 문맥에 맞게 명시적으로 풀었습니다.
  doctrine_reference: source_context_treaty_language
