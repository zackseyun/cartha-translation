translation:
  language: ko
  text: 안티오코스 — 아시아의 위대한 왕이 — 그들을 치러 전쟁을 벌이러 왔고, 백이십 마리의 코끼리와 기병과 전차와 매우 큰 군대를 거느렸으나, 그들에게 꺾였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
