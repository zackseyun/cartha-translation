  source_fidelity: 첫 문장의 κατεδουλώσαντο와 ἕως τῆς ἡμέρας ταύτης는 ‘노예로 삼았습니다’와 ‘오늘날까지’로 정확히 반영됩니다. 후반부의 κατέφθειραν 및 ἐδούλωσαν αὐτοῖς도 각각 ‘파괴하고’와 ‘그들에게 노예로 삼았습니다’로 보존됩니다. 다만 원문의 다소 느슨한 관계절(ὅσοι ποτέ ἀντέστησαν αὐτοῖς)은 사람을 가리키므로, 현 번역처럼 ‘왕국들과 섬들’ 자체를 ‘저항한 자들’과 동격으로 두면 한국어 문법과 지시 대상이 충돌합니다. ‘가운데 … 모든 이들’로 처리하여 원문의 포괄성과 대상의 인칭성을 보존했습니다.
  naturalness: 현안의 ‘섬들, 곧 … 저항한 자들은’은 섬과 사람을 직접 동격 처리하여 부자연스럽고 의미상 어색합니다. 수정문은 현대 표준어 합쇼체에서 자연스럽게 읽히며, 군사·정치적 지배를 서술하는 문체에도 맞습니다.
  terminology: ‘노예로 삼았습니다’는 두 δουλόω 계열 동사의 강한 예속 의미를 완곡하게 약화하지 않습니다. ‘파괴하고’는 καταφθείρω의 파괴적 의미를 무리하게 완전한 절멸로 한정하지 않습니다. ‘오늘날까지’는 원문의 현재 시점까지 지속된 상태를 자연스럽게 나타냅니다.
