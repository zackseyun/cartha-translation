translation:
  language: ko
  text: 그들은 그들을 오늘날까지 노예로 삼았습니다[a]. 또 그 밖의 왕국들과 섬들 가운데 일찍이 그들에게 저항한 모든 이들을 파괴하고[b] 그들에게 노예로 삼았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 날까지’.
    reason: ἕως τῆς ἡμέρας ταύτης의 직역에 가까운 표현입니다.
  - marker: b
    text: 또는 ‘멸하고’ 또는 ‘황폐하게 하고’; 그리스어 동사는 심한 파괴나 황폐화를 뜻할 수 있습니다.
    reason: κατέφθειραν의 어휘적 대안을 제시합니다.
lexical_decisions:
- source_word: κατεδουλώσαντο
  english_pob_choice: enslaved
  chosen_korean: 노예로 삼았습니다
  alternatives_korean:
  - 종속시켰습니다
  - 복속시켰습니다
  lexicon: LSJ
  rationale: δουλόω 계열의 강한 예속·노예화 의미를 살리기 위해 완곡한 ‘종속’보다 직접적인 ‘노예로 삼다’를 택했습니다.
- source_word: ἕως τῆς ἡμέρας ταύτης
  english_pob_choice: to this day
  chosen_korean: 오늘까지
  alternatives_korean:
  - 이 날까지
  - 지금까지
  lexicon: LSJ
  rationale: 현재까지 계속된 상태를 나타내는 관용구이므로, 현대 한국어에서 자연스러운 ‘오늘까지’로 옮겼습니다.
- source_word: κατέφθειραν
  english_pob_choice: they destroyed
  chosen_korean: 그들을 파괴하고
  alternatives_korean:
  - 그들을 멸망시키고
  - 그들을 황폐하게 하고
  lexicon: LSJ
  rationale: καταφθείρω의 파괴·황폐화의 강한 의미를 살리되, 여기서는 완전 소멸보다 폭넓은 파괴를 드러내는 ‘파괴하다’를 선택했습니다.
- source_word: ἐδούλωσαν αὐτοῖς
  english_pob_choice: enslaved to them
  chosen_korean: 그들에게 노예로 삼았습니다
  alternatives_korean:
  - 그들에게 복속시켰습니다
  - 그들을 그들에게 종속시켰습니다
  lexicon: LSJ
  rationale: 여기서의 여격 αὐτοῖς는 ‘그들에게’로 분명히 드러나야 하며, 동사도 다시 한 번 노예화의 강도를 유지하는 표현으로 옮겼습니다.
theological_decisions:
- issue: δουλόω 계열의 정치·군사 문맥 번역
  chosen_reading: ‘노예로 삼다’라는 직접 표현을 유지했습니다.
  alternative_readings:
  - 복속시키다
  - 종속시키다
  rationale: 이 구절은 신학 논쟁이 아니라 지배와 예속의 폭력을 묘사하므로, 본문의 강도를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: DOCTRINE.md의 bonded-status 용어 지침 및 프로젝트 번역 원칙
- issue: κατέφθειραν과 ἐδούλωσαν의 연속 동작
  chosen_reading: ‘파괴하고 … 노예로 삼았습니다’로 두 동작의 순서를 살렸습니다.
  alternative_readings:
  - 파괴하여 예속시켰습니다
  - 멸하고 복속시켰습니다
  rationale: 본문은 먼저 광범위한 파괴를, 이어서 예속을 말하므로 두 행위를 분리해 역사적·수사적 흐름을 보존했습니다.
