  text: And they established a council for themselves, and every day three hundred and twenty would deliberate, continually taking counsel concerning the multitude, to govern themselves well.
  footnotes:
  - marker: a
    text: Or 'about the people ... to keep themselves in good order.' The Greek can be rendered more literally, but the main text brings out the civic sense in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 자기들을 위해 평의회를 세웠고, 매일 삼백이십 명이 계속해서 온 백성에 관해 의논하며, 자기들을 잘 질서 있게 다스리도록 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘백성에 관하여 … 자기들을 좋은 질서로 유지하도록’으로도 옮길 수 있습니다. 헬라어는 더 문자적으로도 번역할 수 있지만, 본문 문맥에서는 공적·시민적 의미가 더 분명합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλευτήριον
  english_pob_choice: council
  chosen_korean: 평의회
  alternatives_korean:
  - 공의회
  - 의회
  - 상담회
  lexicon: LSJ
  rationale: βουλευτήριον은 공적 의사결정을 위한 심의 기구를 가리키므로, 현대 한국어에서는 ‘평의회’가 가장 자연스럽고 기능적으로 대응됩니다.
- source_word: ἐποίησαν ἑαυτοῖς
  english_pob_choice: they established for themselves
  chosen_korean: 자기들을 위해 세웠고
  alternatives_korean:
  - 자기들을 위해 만들었고
  - 자기들을 위해 설치했고
  - 자기들을 위해 마련했고
  lexicon: LSJ
  rationale: 기관을 가리키는 문맥에서 단순한 ‘만들다’보다 ‘세우다’가 제도 설립의 뜻을 더 잘 드러냅니다.
- source_word: βουλευόμενοι διὰ παντός
  english_pob_choice: continually taking counsel
  chosen_korean: 계속해서 온 백성에 관해 의논하며
  alternatives_korean:
  - 끊임없이 의논하며
  - 항상 상의하며
  - 늘 협의하며
  lexicon: LSJ
  rationale: 현재분사는 지속적 행위를 나타내므로, ‘계속해서’로 그 지속성을 살리고 ‘의논하다’로 심의의 성격을 드러냈습니다.
- source_word: περὶ τοῦ πλήθους
  english_pob_choice: concerning the multitude
  chosen_korean: 온 백성에 관해
  alternatives_korean:
  - 무리를 두고
  - 군중에 관해
  - 백성에 대하여
  lexicon: LSJ
  rationale: πλῆθος는 여기서 단순한 군중보다 공동체 전체를 가리키는 집합명사로 보이므로, 문맥상 ‘온 백성’이 가장 분명합니다.
- source_word: τοῦ εὐκοσμεῖν ἑαυτούς
  english_pob_choice: to govern themselves well
  chosen_korean: 자기들을 잘 질서 있게 다스리도록
  alternatives_korean:
  - 자기들을 잘 정돈하도록
  - 자기들을 바르게 질서 잡도록
  - 자기들을 잘 다스리도록
  lexicon: LSJ
  rationale: εὐκοσμέω는 ‘질서 있게 하다, 단정하게 하다’의 뜻이 핵심이므로, 통치의 뉘앙스를 완전히 지우지 않으면서도 ‘질서 있게’로 원의미를 반영했습니다.
theological_decisions:
- issue: 정치 제도 용어의 현대화
  chosen_reading: 고대 유대 공동체의 공적 심의 기구를 현대 한국어로는 ‘평의회’로 옮겨 기능을 분명히 했습니다.
  alternative_readings:
  - 공의회
  - 의회
  - 원로회
  rationale: 본문은 종교기구보다 행정·정치적 심의 기구를 말하므로, 전통 교회 용어보다 제도 기능을 드러내는 번역이 원문 의도에 더 가깝습니다.
  doctrine_reference: 역사서 문맥의 제도 번역 원칙
- issue: εὐκοσμεῖν의 의미 범위
  chosen_reading: ‘질서 있게 다스리도록’으로 옮겨, 단순한 개인적 품행이 아니라 공동체 운영의 질서성을 강조했습니다.
  alternative_readings:
  - 잘 다스리도록
  - 바르게 정돈되도록
  - 좋은 질서를 유지하도록
  rationale: 영어 POB가 보류했던 ‘order themselves well’의 의미를 반영하되, 문맥상 공공 질서와 자기 통제의 두 층위를 함께 살렸습니다.
  doctrine_reference: 헬라어 어휘 의미와 역사적 문맥
