  yaml_path: translation/deuterocanon/1_maccabees/008/008.yaml
  text: and the land of India and Media and Lydia[a], some of the finest of their lands—they took them from him and gave them to King Eumenes.
  footnotes:
  - marker: a
    text: Or 'from their choicest territories.' The Greek literally says 'from their most beautiful lands,' an idiom for especially desirable or excellent regions.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 인도와 메디아와 리디아 지역, 곧 그들의 가장 좋은 영토들 가운데 일부를 그에게서 가져다가 에우메네스 왕에게 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 가장 좋은 영토들에서’라고 옮길 수 있습니다. 그리스어는 문자적으로 ‘그들의 가장 아름다운 땅들에서’라고 하며, 특히 바람직하거나 뛰어난 지역을 가리키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: χώραν τὴν Ἰνδικὴν καὶ Μηδίαν καὶ Λυδίαν
  english_pob_choice: the land of India and Media and Lydia
  chosen_korean: 인도와 메디아와 리디아의 땅
  alternatives_korean:
  - 인도의 땅과 메디아와 리디아
  - 인도 땅과 메디아와 리디아의 땅
  lexicon: LSJ
  rationale: χώρα를 지명들과 함께 병렬로 둘 때는 한국어에서 자연스러운 ‘…의 땅’ 구성이 가장 직역성과 가독성을 함께 살립니다.
- source_word: ἀπὸ τῶν καλλίστων χωρῶν αὐτῶν
  english_pob_choice: some of the finest of their lands
  chosen_korean: 그들의 가장 좋은 땅들 중 일부
  alternatives_korean:
  - 그들의 가장 아름다운 땅들 중 일부
  - 그들의 최선의 영토들 중 일부
  lexicon: LSJ
  rationale: καλλίστων은 문자적으로 ‘가장 아름다운/좋은’이지만, 여기서는 지리·정치적 맥락이므로 ‘가장 좋은’이 한국어로 더 자연스럽고, partitive 의미는 ‘중 일부’로 드러냅니다.
- source_word: λαβόντες αὐτὰς παρ' αὐτοῦ
  english_pob_choice: they took them from him
  chosen_korean: 그들은 그것들을 그에게서 빼앗아
  alternatives_korean:
  - 그들은 그것들을 그에게서 가져가
  - 그들은 그것들을 그에게서 받들어
  lexicon: LSJ
  rationale: λαβόντες는 단순히 ‘받다/취하다’이지만, 앞뒤 문맥상 영토가 강제로 이전된 뉘앙스가 있어 ‘빼앗아’가 소스의 역사적 긴장을 더 잘 드러냅니다.
- source_word: Εὐμενεῖ τῷ βασιλεῖ
  english_pob_choice: King Eumenes
  chosen_korean: 에우메네스 왕
  alternatives_korean:
  - 왕 에우메네스
  - 에우메네스 대왕
  lexicon: LSJ
  rationale: τῷ βασιλεῖ는 칭호를 앞세운 표현이지만 현대 한국어에서는 이름 뒤의 ‘왕’이 가장 자연스럽고, 과도한 존칭화는 피합니다.
theological_decisions:
- issue: 이 구절은 신학적 용어보다 정치·지리적 서술이 중심이므로 용어를 교리화하지 않는 문제
  chosen_reading: 지명과 왕호를 그대로 옮기고, 서술의 강제적 영토 이전 뉘앙스를 살리는 데 집중했습니다.
  alternative_readings:
  - 완만하게 ‘가져가’로 처리하여 중립화
  - 전통적 성서어법으로 더 격식 있게 표현
  rationale: 본문은 전쟁과 조약의 결과로 영토가 이전되는 역사 서술이어서, 의미를 약화시키지 않는 범위에서 사실성을 우선했습니다.
  doctrine_reference: 역사서술의 서사적 충실성
