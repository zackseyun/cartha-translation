  text: And this is the copy of the document that they copied onto bronze tablets and sent to Jerusalem, to be there among them as a memorial of peace and alliance.
translation:
  language: ko
  text: 그리고 이것은 그들이 놋판들에 써서 예루살렘으로 보낸 그 문서의 사본입니다. 그것이 그곳에서 그들 가운데 평화와 동맹의 기념물이 되게 하려는 것이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντίγραφον τῆς γραφῆς
  english_pob_choice: the copy of the document
  chosen_korean: 그 문서의 사본
  alternatives_korean:
  - 그 기록의 사본
  - 그 문서의 복사본
  lexicon: LSJ
  rationale: γραφή는 여기서 성경이 아니라 공식 문서를 가리키므로, ‘문서’로 옮기고 ἀντίγραφον은 ‘사본’으로 자연스럽게 대응했습니다.
- source_word: ἀντέγραψαν
  english_pob_choice: they copied
  chosen_korean: 써서
  alternatives_korean:
  - 필사하여
  - 베껴 써서
  lexicon: LSJ
  rationale: 반복된 어근의 의미를 살리되 한국어에서는 행위 결과가 드러나는 ‘써서’가 가장 간결하고 행정 문맥에도 맞습니다.
- source_word: ἐπὶ δέλτους χαλκαῖς
  english_pob_choice: onto bronze tablets
  chosen_korean: 놋판들에
  alternatives_korean:
  - 놋판 위에
  - 청동 판들에
  lexicon: LSJ
  rationale: δέλτοι는 쓰는 판을 뜻하므로 ‘판들’로 옮겼고, χαλκαῖς는 성경 한국어에서 통용되는 ‘놋’이 소재를 자연스럽게 드러냅니다.
- source_word: μνημόσυνον εἰρήνης καὶ συμμαχίας
  english_pob_choice: as a memorial of peace and alliance
  chosen_korean: 평화와 동맹의 기념물
  alternatives_korean:
  - 평화와 동맹을 기념하는 표지
  - 평화와 동맹의 기념
  lexicon: LSJ
  rationale: μνημόσυνον은 단순한 ‘기억’보다 공식적으로 남겨 두는 기념물을 뜻하므로 ‘기념물’이 문맥상 적절합니다.
theological_decisions:
- issue: εἰρήνης καὶ συμμαχίας의 관계를 어떻게 한국어로 드러낼지
  chosen_reading: ‘평화와 동맹’으로 직역하여, 외교적 조약의 기념적 성격을 보존했습니다.
  alternative_readings:
  - ‘평화조약과 동맹’
  - ‘평화 협정과 동맹’
  rationale: 원문은 각각의 명사를 병렬로 제시하므로, 한국어에서도 해석을 덧붙여 특정 조약 형태로 좁히기보다 원문의 범위를 유지하는 것이 더 충실합니다.
  doctrine_reference: 문맥 해석 원칙
