base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/012.yaml
  text: But with their allies and with those who relied on them they maintained friendship[a], and they gained control over the kingdoms near and far[b]; and all who heard their name feared them.
  footnotes:
  - marker: a
    text: Or 'their friends' for 'their allies'; the Greek φίλοι can denote personal friends or political allies, and the diplomatic context favors 'allies.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'heard their name,' an expression that can mean hearing of their reputation or renown.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들은 자기들의 동맹국들과 그들에게 의지하는 이들과 우호 관계를 유지하였고, 가까운 왕국들과 먼 왕국들을 장악하였으며, 그들의 이름을 들은 모든 이가 그들을 두려워하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν φίλων αὐτῶν
  english_pob_choice: their allies
  chosen_korean: 그들의 동맹들
  alternatives_korean:
  - 그들의 친구들
  lexicon: LSJ
  rationale: φίλοι는 문자적으로 ‘친구들’일 수 있지만, 여기서는 정치·외교적 문맥이어서 ‘동맹들’이 관계의 성격을 더 정확히 드러냅니다.
- source_word: τῶν ἐπαναπαυομένων αὐτοῖς
  english_pob_choice: those who relied on them
  chosen_korean: 그들에게 의지하던 이들
  alternatives_korean:
  - 그들을 신뢰하던 이들
  - 그들에 기대던 이들
  lexicon: LSJ
  rationale: ἐπαναπαύομαι는 어떤 대상에게 의지하거나 기대어 안심하는 뜻이므로, ‘의지하다’가 문맥상 가장 자연스럽고 직접적입니다.
- source_word: συνετήρησαν αὐτοῖς φιλίαν
  english_pob_choice: they maintained friendship
  chosen_korean: 우정을 유지하였고
  alternatives_korean:
  - 그들과 우정을 지켰고
  - 그들을 향한 우정을 보존하였고
  lexicon: LSJ
  rationale: συντηρέω는 ‘지키다/유지하다’의 뜻이고, φιλία는 여기서 외교적 ‘우정’이므로 합성적으로 ‘우정을 유지하다’가 가장 무난합니다.
- source_word: κατεκράτησαν τῶν βασιλειῶν τῶν ἐγγὺς καὶ τῶν μακρῶν
  english_pob_choice: they gained control over the kingdoms near and far
  chosen_korean: 가까운 왕국들과 먼 왕국들을 지배하였으며
  alternatives_korean:
  - 가까운 왕국들과 먼 왕국들을 장악하였으며
  - 가까운 왕국들과 먼 왕국들 위에 군림하였으며
  lexicon: LSJ
  rationale: κατακρατέω는 단순한 영향력이 아니라 우세하게 눌러 ‘지배하다/장악하다’는 뜻이 강하므로, ‘지배하다’가 문맥의 힘을 잘 살립니다.
- source_word: ὅσοι ἤκουσαν τὸ ὄνομα αὐτῶν
  english_pob_choice: all who heard their name
  chosen_korean: 그들의 이름을 들은 모든 이가
  alternatives_korean:
  - 그들에 대해 들은 모든 이가
  - 그들의 명성을 들은 모든 이가
  lexicon: LSJ
  rationale: 직역하면 ‘그들의 이름을 들은’이지만, 한국어에서는 자연스러운 구조로 옮기되 ‘이름’이라는 원문 이미지를 유지했습니다.
theological_decisions:
- issue: ‘이름을 듣다’의 의미 범위
  chosen_reading: 명성이나 소문을 암시하되, 본문은 원문 표현대로 ‘이름’을 유지했습니다.
  alternative_readings:
  - ‘그들에 대해 들었다’로 의미만 풀어 쓰기
  - ‘그들의 명성을 들은’으로 해석을 노출하기
  rationale: 헬라어는 문자적으로 ‘그들의 이름을 들은’이라 하며, 이는 통상 평판을 뜻할 수 있지만 본문이 가진 표현력을 보존하는 편이 더 충실합니다.
  doctrine_reference: source-language precision
- issue: φιλία의 성격
  chosen_reading: 개인적 우정보다는 국가 간 외교적 우정/우호 관계로 읽었습니다.
  alternative_readings:
  - 개인적 친구 관계
  - 일반적 친교
  rationale: 앞뒤가 왕국들의 지배와 결부되어 있어, φιλία는 사적인 친분보다 정치적 우호 관계를 가리키는 것이 더 적절합니다.
  doctrine_reference: historical-context reading
