  yaml_path: translation/deuterocanon/1_maccabees/008/001.yaml
  text: And Judas heard the name of the Romans[a], that they are mighty in strength, and that they are well disposed toward all who attach themselves to them, and that as many as come to them obtain friendship with them[b],
  footnotes:
  - marker: a
    text: Or 'the reputation of the Romans.' The Greek says literally 'the name of the Romans,' with 'name' carrying the sense of renown or report.
    reason: lexical_alternative
  - marker: b
    text: '''Friendship'' here likely includes formal political friendship or alliance, not merely personal affection.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 유다는 로마인의 이름을 들었는데, 그들이 힘에 있어 강하며, 그들에 합류한 모든 이들을 잘 대하고, 누구든지 그들에게 오면 그들과 우정을 얻는다는 것을 들었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이름’은 여기서 단순한 명칭이 아니라 ‘명성’ 또는 ‘평판’의 뜻을 띨 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘우정’은 여기서 개인적 친밀감뿐 아니라 외교적 우호 관계나 동맹까지 포함할 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: τὸ ὄνομα τῶν Ῥωμαίων
  english_pob_choice: the name of the Romans
  chosen_korean: 로마인의 이름
  alternatives_korean:
  - 로마인의 명성
  - 로마에 대한 소문
  lexicon: LSJ
  rationale: 그리스어의 직역 구조를 살리되, 이어지는 절들에서 그 ‘이름’이 곧 평판과 소문을 가리킨다는 점이 드러나므로 한국어도 ‘이름’으로 유지했습니다.
- source_word: δυνατοὶ ἐν ἰσχύϊ
  english_pob_choice: mighty in strength
  chosen_korean: 힘에 있어 강하며
  alternatives_korean:
  - 강한 힘을 지니며
  - 권세 있어 강하며
  lexicon: LSJ
  rationale: 중복적 강조가 있는 표현이므로, ‘힘’과 ‘강함’을 함께 살려 다소 중첩된 뉘앙스를 한국어에서도 반영했습니다.
- source_word: εὐδοκοῦσιν ἐν πᾶσιν τοῖς προστεθειμένοις αὐτοῖς
  english_pob_choice: are well disposed toward all who attach themselves to them
  chosen_korean: 그들에 합류한 모든 이들을 잘 대하고
  alternatives_korean:
  - 그들에게 붙은 모든 이들을 호의적으로 대하고
  - 그들과 연합한 모든 이들에게 호의를 보이고
  lexicon: BDAG
  rationale: 여기서 εὐδοκοῦσιν은 단순한 감정이 아니라 정치적·관계적 호의를 뜻하므로 ‘잘 대하다’로 옮겨 관계적 처신을 드러냈습니다.
- source_word: ἐσπῶντο αὐτοῖς φιλίαν
  english_pob_choice: obtain friendship with them
  chosen_korean: 그들과 우정을 얻는다는 것을 들었습니다
  alternatives_korean:
  - 그들과 친분을 얻는다는 것을 들었습니다
  - 그들과 우호 관계를 맺는다는 것을 들었습니다
  lexicon: LSJ
  rationale: φιλία의 기본 의미인 ‘우정’을 살리되, 문맥상 외교적 우호 관계까지 포괄할 수 있어 한국어도 ‘우정’을 기본으로 두었습니다.
theological_decisions:
- issue: φιλία의 관계 성격
  chosen_reading: ‘우정’이라고 하되, 문맥상 단순 사적인 친분보다 정치적 우호 관계를 포함할 수 있게 번역했습니다.
  alternative_readings:
  - ‘동맹’으로 옮기기
  - ‘친분’으로 옮기기
  rationale: 1 마카베오스 8장은 로마와의 외교적 관계를 다루므로, 단순 감정적 친교로 축소하지 않으면서도 본문의 단어를 보존하는 절충이 필요합니다.
  doctrine_reference: 역사-외교 문맥의 의미 범위 보존
