  - 그들과 우호 관계를 맺는다는 것을 들었습니다
  lexicon: LSJ
  rationale: φιλία의 기본 의미인 ‘우정’을 살리되, 문맥상 외교적 우호 관계까지 포괄할 수 있어 한국어도 ‘우정’을 기본으로 두었습니다.
