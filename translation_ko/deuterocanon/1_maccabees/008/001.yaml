- source_word: εὐδοκοῦσιν ἐν πᾶσιν τοῖς προστεθειμένοις αὐτοῖς
  english_pob_choice: are well disposed toward all who attach themselves to them
  chosen_korean: 그들에 합류한 모든 이들을 잘 대하고
  alternatives_korean:
