  to: 유다는 로마인의 이름을 들었습니다.[a] 곧 그들이 강한 힘을 지녔고, 그들에게 가담한 모든 사람에게 호의적이며, 누구든지 그들에게 나아간 사람과는 우호 관계를 맺었다는 것이었습니다.[b]
