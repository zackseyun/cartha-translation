    text: ‘이름’은 여기서 단순한 명칭이 아니라 ‘명성’ 또는 ‘평판’의 뜻을 띨 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘우호 관계’는 여기서 개인적 친밀감뿐 아니라 외교적 우호 관계나 동맹까지 포함할 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: τὸ ὄνομα τῶν Ῥωμαίων
  english_pob_choice: the name of the Romans
  chosen_korean: 로마인의 이름
  alternatives_korean:
