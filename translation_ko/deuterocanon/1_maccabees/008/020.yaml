  text: Judas[a], who is also called Maccabeus, and his brothers and the multitude of the Jews sent us to you, to establish an alliance and peace with you, and to have us enrolled as your allies and friends.
  footnotes:
  - marker: a
    text: Or 'that we might be registered/written down as your allies and friends.' The Greek likely refers to formal diplomatic enrollment or inscription.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다, 곧 마카베오라고도 불리는 사람과 그의 형제들과 유다인들의 큰 무리가 우리를 당신들에게 보내어, 당신들과 동맹과 평화를 맺고, 우리를 당신들의 동맹자와 친구로 등록하게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 γραφῆναι는 공식 문서에 ‘기록/등록’되는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰούδας ὁ καὶ Μακκαβαῖος
  english_pob_choice: Judas, who is also called Maccabeus
  chosen_korean: 유다, 곧 마카베오라고도 불리는 사람
  alternatives_korean:
  - 유다, 마카베오라고도 하는 자
  - 마카베오라고도 불리는 유다
  lexicon: LSJ
  rationale: Ἰούδας를 인명으로 음역하되, ὁ καὶ + 이름의 별칭 구조를 자연스럽게 드러내기 위해 ‘곧 …라고도 불리는’으로 옮겼습니다.
- source_word: τὸ πλῆθος τῶν Ἰουδαίων
  english_pob_choice: the multitude of the Jews
  chosen_korean: 유다인들의 큰 무리
  alternatives_korean:
  - 유다인들의 무리
  - 유다인들의 군중
  lexicon: LSJ
  rationale: πλῆθος의 집합적 의미를 살리되, 한국어에서 과도하게 문어적인 ‘다수’보다 ‘큰 무리’가 자연스럽고 본문의 집단성을 유지합니다.
- source_word: συμμαχίαν καὶ εἰρήνην
  english_pob_choice: an alliance and peace
  chosen_korean: 동맹과 평화
  alternatives_korean:
  - 동맹과 화평
  - 동맹 조약과 평화
  lexicon: LSJ
  rationale: συμμαχία는 외교적 ‘동맹’이 적절하고, εἰρήνη는 여기서 단순한 ‘평화’로 옮겨 원문이 명시하지 않은 ‘조약’을 덧붙이지 않았습니다.
- source_word: γραφῆναι ἡμᾶς συμμάχους καὶ φίλους ὑμῶν
  english_pob_choice: to have us enrolled as your allies and friends
  chosen_korean: 우리를 당신들의 동맹자와 친구로 등록하게 하였습니다
  alternatives_korean:
  - 우리를 당신들의 동맹자와 친구로 기록하게 하였습니다
  - 우리를 당신들의 동맹자와 친구로 등재하게 하였습니다
  lexicon: LSJ
  rationale: γραφῆναι의 수동 부정사로서 공식 문서상의 ‘등록/기록’ 의미를 살리기 위해 ‘등록하게 하였습니다’를 택했습니다.
theological_decisions:
- issue: 공식 외교 문구의 번역 수준
  chosen_reading: ‘동맹과 평화’ 및 ‘등록’으로 옮겨 외교적·공문서적 분위기를 드러냈습니다.
  alternative_readings:
  - ‘화평’으로 순화
  - ‘등재’로 문어화
  rationale: 이 절은 신학적 용어보다 헬라어 외교 문서 표현이 핵심이므로, 원문의 제도적 뉘앙스를 보존하는 쪽을 선택했습니다.
  doctrine_reference: 서사적 역사문맥
