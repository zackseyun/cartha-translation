translation:
  language: ko
  text: 그들이 여전히 당신에게 대항하여 호소하면, 우리는 그들에게 판결을 집행하고, 바다와 육지로 그들과 싸우겠습니다.ᵃ[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 문자적으로 ‘우리가 너를 바다와 육지로 치겠다’로 읽히지만, 문맥상 ‘그들’ 또는 ‘그대의 편에서’로 이해해야 할 전승상 난점이 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἐὰν οὖν ἔτι
  english_pob_choice: If they still
