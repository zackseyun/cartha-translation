  lexicon: BDAG
  rationale: ἐντύχωσιν은 단순한 물리적 공격보다 대항하는 청원·호소의 성격이 강하므로, 법적·외교적 적대 행위를 드러내는 표현으로 옮겼습니다.
- source_word: ποιήσομεν αὐτοῖς τὴν κρίσιν
  english_pob_choice: we will execute judgment on them
  chosen_korean: 우리는 그들에게 판결을 집행하고
  alternatives_korean:
  - 우리는 그들에게 심판을 내리고
  - 우리는 그들에게 판결을 시행하고
  lexicon: BDAG
  rationale: τὴν κρίσιν은 여기서 ‘판결/심판’의 집행을 뜻하므로, 선언적이고 공식적인 ‘판결을 집행하다’로 옮겼습니다.
- source_word: πολεμήσομέν σε διὰ τῆς θαλάσσης καὶ διὰ τῆς ξηρᾶς
  english_pob_choice: we will fight against them by sea and by land
  chosen_korean: 바다와 육지로 그들과 싸우겠습니다
  alternatives_korean:
  - 바다와 육지에서 그들과 싸우겠습니다
  - 바다와 뭍으로 그들과 전쟁하겠습니다
  lexicon: BDAG
  rationale: 그리스어 본문은 전승상 ‘you’가 남아 있으나, 문맥상 ‘그들’이 가리키는 대상과의 일치가 더 자연스러우므로, 본문의 전승 문제를 반영하는 각주를 두고 한국어 본문은 문맥을 따라 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 대명사 불일치와 전승상 난점
  chosen_reading: 본문에서는 문맥에 맞게 ‘그들과 싸우겠습니다’로 옮기고, 각주로 그리스어의 전승상 난점을 밝혔습니다.
  alternative_readings:
  - 그대와 싸우겠습니다
  - 그대의 편에서 싸우겠습니다
  rationale: 현전 그리스어는 πολεμήσομέν σε(‘우리를 너와 싸우겠다’)로 읽혀 문맥과 어긋나므로, 번역문은 의미 흐름을 살리되 본문 전승의 긴장을 각주로 보존했습니다.
  doctrine_reference: 원문 우선 및 전승 난점 보존
- issue: κρίσις의 공적·사법적 뉘앙스
  chosen_reading: ‘판결을 집행하다’로 옮겨 공적 사법 행위를 드러냈습니다.
  alternative_readings:
  - 심판을 내리다
  - 판결을 시행하다
  rationale: 이 문맥의 κρίσις는 단순한 추상적 ‘판단’이 아니라 실제 조치로 이어지는 공적 판결을 가리키므로, 그 성격을 흐리지 않는 표현을 택했습니다.
  doctrine_reference: 공적 정의와 판결의 실행
