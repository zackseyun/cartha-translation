review_pass:
  verdict: revise
  source_fidelity: 현전 그리스어의 마지막 목적어는 σε(‘당신을’)입니다. 초안 본문의 ‘그들과’는 문맥상 매끄럽지만, 본문을 ‘그들’로 바꾸어 전승상의 난점을 해소하므로 원문 우선 원칙에 맞지 않습니다. 이 긴장은 본문에 보존하고 각주에서만 설명하는 것이 안전합니다.
  naturalness: ‘당신을 상대로 호소해 온다면’, ‘그들에게 판결을 집행하고’, ‘바다와 육지에서 … 싸우겠습니다’는 현대 표준 한국어의 공식적이고 자연스러운 합쇼체입니다. 기존의 ‘바다와 육지로’보다 ‘바다와 육지에서’가 군사 행동의 영역을 나타내는 데 자연스럽습니다.
  terminology: ἐντυγχάνω는 이 문맥에서 적대적인 청원·고소를 가리킬 수 있으므로 ‘당신을 상대로 호소하다’가 적절합니다. κρίσις는 공적 사법 조치를 나타내므로 ‘판결을 집행하다’로 유지할 수 있습니다. πολεμέω는 ‘싸우다’이며, 각주의 ‘치겠다’는 지나치게 좁고 원문 어휘와 맞지 않아 고쳐야 합니다.
  issues:
  - severity: high
    issue: 마지막 절의 σε를 본문에서 ‘그들과’로 변경함
    rationale: 그리스어는 명시적으로 ‘우리는 당신과 싸우겠습니다’라고 읽습니다. 문맥상 문제를 해결하려는 번역은 각주로 처리해야 하며, 본문은 논쟁적·곤란한 대명사 사용을 보존해야 합니다.
  - severity: medium
    issue: 각주가 πολεμήσομέν σε를 ‘너를 … 치겠다’로 설명함
    rationale: πολεμέω의 기본 뜻은 ‘싸우다/전쟁하다’입니다. ‘치다’는 표현은 원문의 군사적 상호 행동을 불필요하게 축소합니다.
  - severity: low
    issue: 본문에 각주 표지가 ‘ᵃ[a]’로 중복됨
    rationale: 하나의 각주에는 하나의 표지만 두어야 합니다.
  revised_text: 그들이 여전히 당신을 상대로 호소해 온다면, 우리는 그들에게 판결을 집행하고, 바다와 육지에서 당신과 싸우겠습니다.ᵃ
  revised_footnotes:
