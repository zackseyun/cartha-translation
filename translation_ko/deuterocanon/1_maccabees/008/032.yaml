    text: 그리스어는 문자적으로 ‘우리는 바다와 육지에서 당신과 싸우겠다’라고 읽습니다. 그러나 문맥상 이는 ‘그들과 싸우겠다’ 또는 ‘당신을 위해 싸우겠다’를 뜻할 가능성이 제기되는 전승상의 난점입니다.
    reason: textual_variant
  revision_rationale: 현전 그리스어의 σε를 본문에서 그대로 ‘당신과’로 옮겨, 문맥과 어긋나 보이는 전승상의 난점을 보존했습니다. 문맥적 대안들은 단정하지 않고 각주에 제시했습니다. 또한 각주의 동사를 원문에 맞게 ‘싸우다’로 바로잡고, 중복된 각주 표지를 하나로 정리했습니다.
