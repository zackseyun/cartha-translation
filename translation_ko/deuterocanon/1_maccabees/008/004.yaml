  text: And they gained control of the whole region by their counsel and by the sword—though the region was very far away from them—and of the kings who came against them from the end of the earth[a], until they crushed them and struck them with a great blow[b]; and the rest give them tribute year by year.
  footnotes:
  - marker: a
    text: Greek literally, 'from the end of the earth,' an idiom for from a very great distance.
    reason: lexical_alternative
  - marker: b
    text: The final clause refers to the remaining rulers or peoples as continuing to pay annual tribute.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그들의 계략과 칼로 그 온 지역을 장악하였습니다—그 지역은 그들로부터 매우 멀리 떨어져 있었지만—그리고 세상의 끝에서 그들에게 맞서 올라온 왕들을 무너뜨리고 그들 가운데 큰 타격을 가하였으며, 남은 자들은 해마다 그들에게 조공을 바쳤습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘세상의 끝’은 지리적 종말이라기보다 매우 먼 곳에서라는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘조공을 바쳤습니다’는 여기서 정복 이후의 지속적 복속 상태를 가리킵니다.
    reason: lexical_alternative
