    text: Greek literally, 'from the end of the earth,' an idiom for from a very great distance.
    reason: lexical_alternative
  - marker: b
    text: The final clause refers to the remaining rulers or peoples as continuing to pay annual tribute.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 자기들의 정책과 칼로 그 지역 전체를 장악하였습니다—그 지역은 그들에게서 아주 멀리 떨어져 있었습니다—그리고 세상 끝에서 그들에게 맞서 온 왕들까지도, 그들을 완전히 무너뜨리고 큰 타격을 입힐 때까지 장악하였습니다.[a] 남은 자들은 해마다 그들에게 조공을 바칩니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘세상 끝에서’는 지리적 종말이라기보다 매우 먼 곳에서라는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘남은 자들’은 문맥상 남은 왕들이나 민족·집단을 가리킬 수 있습니다. 이들은 해마다 계속 조공을 바칩니다.
    reason: lexical_alternative
