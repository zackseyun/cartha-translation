base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/028.yaml
  text: And grain[a], weapons, or silver shall not be given to the allies, as it seemed good to Rome; and they shall keep these provisions[b], and not with deceit.
  footnotes:
  - marker: a
    text: Or 'these provisions' or 'these stipulations' for 'these obligations.' The Greek phrase is literally 'these things to be kept,' in a treaty context.
    reason: lexical_alternative
  - marker: b
    text: The clause 'as it seemed good to Rome' is formal diplomatic language, meaning effectively 'as Rome decided' or 'as Rome resolved.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 동맹국들에게는 곡식과 무기와 은이 주어지지 않을 것입니다. 이는 로마가 결정한 대로입니다.[a] 그리고 그들은 속임수 없이 이 규정들을 지킬 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘로마가 결정한 대로’는 문자적으로는 ‘로마에 좋게 보인 대로’라는 공식 외교·결의 관용구입니다.
    reason: cultural_note
  - marker: b
    text: ‘이 규정들’은 문자적으로 ‘이 지켜야 할 것들’에 해당하며, 조약 문맥에서는 준수해야 할 규정 또는 조항을 가리킵니다.
    reason: lexical_alternative
