  - 동맹자들
  lexicon: LSJ
  rationale: 정치·군사 조약 문맥의 복수 여격이므로 ‘동맹국들’이 가장 자연스럽고, 단순한 협력자보다 국가 간 동맹의 뉘앙스를 잘 살립니다.
- source_word: δοθήσεται σῖτος, ὅπλα, ἀργύριον
  english_pob_choice: there shall not be given grain, weapons, or silver
  chosen_korean: 곡식과 무기와 은이 주어지지 않을 것입니다
  alternatives_korean:
  - 곡식과 무기와 은이 지급되지 않을 것입니다
  - 곡식, 무기, 은을 주지 않을 것입니다
  lexicon: LSJ / BDAG
  rationale: 무주어 수동 구조를 살려 조약문체를 유지했고, ἀργύριον은 문맥상 화폐적 기능이 있어도 본문 표면형인 ‘은’을 우선 반영했습니다.
- source_word: ὡς ἔδοξεν Ῥώμῃ
  english_pob_choice: as it seemed good to Rome
  chosen_korean: 로마가 좋게 여긴 대로입니다
  alternatives_korean:
  - 로마가 결정한 대로입니다
  - 로마에 합당하게 여겨진 대로입니다
  lexicon: LSJ
  rationale: 공식 외교 문서의 관용구를 한국어로 자연스럽게 옮기되, ‘로마가…’라는 주어와 결정의 뉘앙스를 함께 보존했습니다.
- source_word: τὰ φυλάγματα ταῦτα
  english_pob_choice: these obligations / these provisions
  chosen_korean: 이 의무들
  alternatives_korean:
  - 이 규정들
  - 이 조항들
  - 이 약정들
  lexicon: LSJ
  rationale: 직역하면 ‘지켜야 할 것들’이지만, 조약 맥락에서 실제로 요구되는 구속력을 살리기 위해 ‘의무들’로 옮겼습니다.
- source_word: οὐ μετὰ δόλου
  english_pob_choice: not with deceit
  chosen_korean: 속임수 없이 그렇게 할 것입니다
  alternatives_korean:
  - 기만 없이
  - 속임수로 하지 않을 것입니다
  lexicon: LSJ
  rationale: 부사적 부정구를 한국어에서 자연스럽게 풀어 ‘속임수 없이’로 옮기되, 앞 절의 ‘지킬 것’에 걸려 문장이 매끄럽게 이어지도록 했습니다.
theological_decisions:
- issue: 조약문체의 수동·공식 어법 유지
  chosen_reading: ‘주어지지 않을 것입니다’와 ‘로마가 좋게 여긴 대로입니다’를 살려 법적·외교적 문체를 보존했습니다.
  alternative_readings:
  - ‘주지 않을 것입니다’처럼 능동으로 바꾸는 방식
  - ‘로마가 결정한 대로입니다’로 완전한 의역
  rationale: 이 절은 서사보다 조약 조항에 가까우므로, 원문의 공문서적 무게를 약화시키지 않도록 수동과 관용구를 유지했습니다.
  doctrine_reference: 본문의 역사·법적 맥락 보존 원칙
