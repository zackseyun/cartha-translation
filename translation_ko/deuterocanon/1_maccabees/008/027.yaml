  text: Likewise[a], if war should first come upon the nation of the Jews, the Romans will fight as allies wholeheartedly[b], as the occasion may direct them.
  footnotes:
  - marker: a
    text: Or 'wholeheartedly' for 'with full commitment' (ἐκ ψυχῆς).
    reason: lexical_alternative
  - marker: b
    text: The final clause may also be rendered 'as circumstances may suggest to them' or 'as the time may prescribe to them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 마찬가지로[a], 유대인의 나라에 먼저 전쟁이 닥치면 로마인들은 마음을 다해[b] 동맹군으로 싸울 것이며, 그때의 상황이 그들에게 지시하는 대로 싸울 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마음을 다해’로도 옮길 수 있습니다(ἐκ ψυχῆς).
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그때의 형편이 그들에게 정하는 대로’ 또는 ‘그때의 상황이 그들에게 시사하는 대로’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὰ αὐτὰ
  english_pob_choice: Likewise
  chosen_korean: 마찬가지로
  alternatives_korean:
  - 같은 방식으로
  - 그와 같이
  lexicon: LSJ
  rationale: 앞선 조약 조건을 이어 주는 전환 표현이므로, 자연스럽고 간결한 ‘마찬가지로’가 비교적 정확하게 대응합니다.
- source_word: ἔθνει Ἰουδαίων
  english_pob_choice: the nation of the Jews
  chosen_korean: 유대인의 나라
  alternatives_korean:
  - 유대인의 민족
  - 유대 민족
  lexicon: LSJ
  rationale: ἔθνος는 여기서 민족 집단이 아니라 하나의 정치·사회적 공동체를 가리키므로, 조약 문맥에 맞는 ‘나라’로 옮겼습니다.
- source_word: ἐκ ψυχῆς
  english_pob_choice: wholeheartedly
  chosen_korean: 마음을 다해
  alternatives_korean:
  - 전심으로
  - 온 마음으로
  lexicon: LSJ
  rationale: 직역적 ‘영혼으로부터’보다, 조약의 충실한 군사 지원이라는 문맥을 살리는 한국어 관용구가 더 적절합니다.
- source_word: ὡς ἂν αὐτοῖς ὁ καιρὸς ὑπογράφῃ
  english_pob_choice: as the occasion may direct them
  chosen_korean: 그때의 상황이 그들에게 지시하는 대로
  alternatives_korean:
  - 그때의 형편이 그들에게 정하는 대로
  - 상황이 그들에게 시사하는 대로
  lexicon: LSJ
  rationale: ὁ καιρός는 단순한 시간보다 ‘때/상황’이며, ὑπογράφῃ는 그에 따라 행동 기준을 제시하는 뉘앙스가 있어 ‘지시하는 대로’로 반영했습니다.
