translation:
  language: ko
  text: 마찬가지로, 유대 민족에게 먼저 전쟁이 닥치면, 로마인들은 그때의 상황이 그들에게 지시하는 대로 동맹으로서 온 마음을 다해[a] 싸울 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전심으로’ 또는 ‘마음을 다해’로도 옮길 수 있습니다(ἐκ ψυχῆς).
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그때의 형편이 그들에게 정하는 대로’ 또는 ‘그때의 상황이 그들에게 시사하는 대로’로도 옮길 수 있습니다.
    reason: lexical_alternative
