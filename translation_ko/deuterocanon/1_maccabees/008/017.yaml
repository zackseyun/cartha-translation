  lexicon: LSJ
  rationale: φιλία는 단순 감정적 우정보다 외교적 ‘우호 관계’가 더 정확하고, συμμαχία는 ‘동맹’이 표준적이어서 두 표현의 외교적 의미를 살렸습니다.
