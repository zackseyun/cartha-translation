translation:
  language: ko
  text: 그리고 유다는 요한의 아들, 아코스의 손자 유폴레모스[a]와 엘르아살의 아들 야손을 뽑아 로마로 보내어, 로마인들과 우호 관계와 동맹을 맺게 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
