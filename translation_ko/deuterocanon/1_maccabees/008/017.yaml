  lexicon: BDAG
  rationale: 군사·외교 사절을 사람들 가운데서 고르는 문맥이므로, 단순한 선택보다 자연스러운 ‘뽑다’가 원문의 결정을 잘 살립니다.
- source_word: ἀπέστειλεν
  english_pob_choice: sent
  chosen_korean: 보내어
  alternatives_korean:
  - 파견하여
  - 보내서
  lexicon: BDAG
  rationale: 사절을 로마로 보내는 서술이므로 현대 한국어에서는 ‘보내어’가 가장 자연스럽고, 공식적 파견의 뉘앙스도 충분히 담습니다.
- source_word: στῆσαι αὐτοῖς φιλίαν καὶ συμμαχίαν
  english_pob_choice: to establish friendship and alliance with them
  chosen_korean: 우호 관계와 동맹을 맺게 하였습니다
  alternatives_korean:
  - 우정을 맺고 동맹을 세우게 하였습니다
  - 친선을 이루고 동맹을 맺게 하였습니다
  lexicon: LSJ
  rationale: φιλία는 단순 감정적 우정보다 외교적 ‘우호 관계’가 더 정확하고, συμμαχία는 ‘동맹’이 표준적이어서 두 표현의 외교적 의미를 살렸습니다.
- source_word: τοῦ Ἀκχώς
  english_pob_choice: the son of Accos
  chosen_korean: 아코스의 손자
  alternatives_korean:
  - 아코스의 아들
  - 아코스 가문의
  lexicon: LSJ
  rationale: Greek의 υἱὸν Ἰωάνου τοῦ Ἀκχώς 구조를 따라 ‘요한의 아들, 아코스의 손자’로 풀어 쓰는 것이 친족 관계를 가장 투명하게 드러냅니다.
