  yaml_path: translation/deuterocanon/1_maccabees/008/016.yaml
  text: And they entrust one man to rule over them each year and to exercise lordship over all their land[a], and all listen to the one, and there is no envy or jealousy among them.
  footnotes:
  - marker: a
    text: Or 'obey the one man.' The Greek says literally 'all listen to the one,' which can imply obedience in this governing context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 해마다 한 사람에게 자신들을 다스리고 그들의 온 땅을 지배하는 일을 맡기며, 모두 그 한 사람의 말을 듣고[a], 그들 가운데에는 시기도 질투도 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 한 사람에게 순종한다’. 그리스어는 문자적으로 ‘모두가 그 한 사람의 말을 듣는다’라고 되어 있어, 통치 문맥에서는 복종의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύουσιν
  english_pob_choice: entrust
  chosen_korean: 한 사람에게 자기들을 다스리게 하고
  alternatives_korean:
  - 한 사람을 맡기고
  - 한 사람을 세우고
  - 한 사람에게 권한을 맡기고
  lexicon: LSJ
  rationale: 정치적 문맥에서 단순한 ‘믿다’보다 권한을 위임한다는 뜻이 분명하므로, ‘다스리게 하다’와 함께 권한 위임의 의미를 살렸습니다.
- source_word: ἑνὶ ἀνθρώπῳ
  english_pob_choice: one man
  chosen_korean: 한 사람
  alternatives_korean:
  - 한 남자
  - 한 인물
  lexicon: LSJ
  rationale: 원문의 남성형 단수는 분명하지만, 한국어에서는 성별을 과도하게 드러내지 않는 ‘한 사람’이 자연스러워 기본 의미를 보존했습니다.
- source_word: κυριεύειν
  english_pob_choice: to exercise lordship over
  chosen_korean: 지배하게 하며
  alternatives_korean:
  - 주권을 행사하게 하며
  - 군림하게 하며
  - 다스리게 하며
  lexicon: LSJ
  rationale: 두 번째 동사는 단순 통치보다 더 강한 지배의 뉘앙스를 가지므로, ‘지배하다’로 더 직접적으로 옮겼습니다.
- source_word: ἀκούουσιν τοῦ ἑνός
  english_pob_choice: listen to the one
  chosen_korean: 그 한 사람의 말을 들으며
  alternatives_korean:
  - 그 한 사람에게 순종하며
  - 그 한 사람을 듣고
  lexicon: LSJ
  rationale: 직역하면 ‘한 사람에게 귀를 기울이다’이지만, 통치 문맥에서는 실제 복종을 뜻할 수 있어 한국어로는 자연스럽게 ‘말을 듣다’로 옮겼습니다.
theological_decisions:
- issue: 형제적 정치 질서의 묘사에서 반복되는 ‘한 사람’과 ‘말을 듣다’의 권위 구조를 어떻게 처리할지
  chosen_reading: 직접적인 위임과 복종의 질서를 드러내되, ‘지배’와 ‘말을 듣다’라는 표현을 유지해 본문의 정치적 강도를 살렸습니다.
  alternative_readings:
  - 더 완곡한 ‘통치하다 / 따르다’로 완화
  - ‘순종하다’로 명시적으로 해석
  rationale: 원문은 내부의 질서와 충성을 칭찬하는 맥락이므로, 의미를 약화시키지 않으면서도 과도한 해석은 피하는 쪽이 적절합니다.
  doctrine_reference: 본문 맥락상 정치-공동체 질서의 서술이며, 교리적 쟁점은 없습니다.
