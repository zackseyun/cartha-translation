  source_fidelity: ‘빌립보’는 Φίλιππος(Philip)의 인명으로는 부정확합니다. ‘빌립’으로 고쳐야 합니다. 또한 συνέτριψαν의 군사적 강도를 ‘쳐부수다’로, κατεκράτησαν αὐτῶν을 ‘제압하다’로 옮기면 원문의 연속된 승리 표현을 더 충실히 반영합니다. Κιτιέων은 해석적으로 ‘마케도니아인들’을 뜻할 가능성이 있으나, 본문은 민족명을 사용하므로 ‘키티온 사람들’을 유지하는 것이 적절합니다.
  naturalness: 수정문은 현대 표준 한국어의 합쇼체로 자연스럽습니다. ‘그들’의 지시 대상은 그리스어 원문에도 문맥 의존적으로 남아 있으므로, 번역에서 불필요하게 역사적 주어를 보충하지 않았습니다.
  terminology: Φίλιππος는 한국어 성서 인명 표기상 ‘빌립’이 적절하며, ‘빌립보’는 도시명으로 널리 쓰여 혼동을 일으킵니다. ‘키티온 사람들’은 Κιτιέων의 복수 민족명을 보존합니다. 본문의 반복된 καὶ는 이문이라고 단정하기보다 전승 본문의 문헌적 불규칙으로 설명하는 편이 정확합니다.
