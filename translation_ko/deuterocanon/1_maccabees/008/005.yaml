  text: And Philip[a], and Perseus king of the Kittians[b], and those who rose up against them—they crushed them in war and prevailed over them.
  footnotes:
  - marker: a
    text: Greek 'king of the Kittians.' The expression may refer historically to the Macedonian realm; some translations render the sense rather than the ethnicon.
    reason: alternative_reading
  - marker: b
    text: The Greek text as transmitted here contains repeated καὶ ('and and and'); this appears to be a textual irregularity, but it does not materially change the sense.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 빌립보와 키티온 사람들의 왕 페르세우스와 그들에 맞서 일어난 자들을, 그들은 전쟁에서 무너뜨리고 그들 위에 우세를 점했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 민족명 Κιτιέων을 직역해 ‘키티온 사람들’로 옮겼습니다. 역사적으로는 마케도니아 왕조를 가리키는 것으로 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 전승된 그리스어 본문에는 καὶ(“그리고”)가 반복되어 있습니다. 본문의 뜻을 크게 바꾸지는 않는 이문입니다.
    reason: textual_variant
lexical_decisions:
- source_word: Φίλιππον
  english_pob_choice: Philip
  chosen_korean: 빌립보
  alternatives_korean:
  - 빌립
  - 필립
  lexicon: 전통 인명 표기
  rationale: 이 본문은 마케도니아 왕 필립을 가리키므로, 한국어 성서에서 널리 알려진 전통형 인명 표기인 빌립보를 따랐습니다.
- source_word: Περσέα Κιτιέων βασιλέα
  english_pob_choice: Perseus king of the Kittians
  chosen_korean: 키티온 사람들의 왕 페르세우스
  alternatives_korean:
  - 키티온의 왕 페르세우스
  - 시티움 사람들의 왕 페르세우스
  lexicon: LSJ
  rationale: 그리스어의 민족명 복수형 Κιτιέων을 살려 ‘키티온 사람들’로 옮기고, 왕 칭호를 뒤에 붙여 원문의 어순과 수식을 유지했습니다.
- source_word: τοὺς ἐπηρμένους ἐπʼ αὐτοὺς
  english_pob_choice: those who rose up against them
  chosen_korean: 그들에 맞서 일어난 자들
  alternatives_korean:
  - 그들에 대하여 높아진 자들
  - 그들 위로 들린 자들
  lexicon: LSJ
  rationale: ἐπαίρω의 문자적 ‘들어 올리다’보다 이 문맥의 적대적 봉기를 드러내는 관용적 의미를 살려 옮겼습니다.
- source_word: συνέτριψαν αὐτοὺς πολέμῳ καὶ κατεκράτησαν αὐτῶν
  english_pob_choice: they crushed them in war and prevailed over them
  chosen_korean: 전쟁에서 무너뜨리고 그들 위에 우세를 점했습니다
  alternatives_korean:
  - 전쟁에서 짓부수고 그들을 제압했습니다
  - 전쟁으로 그들을 꺾고 그들을 지배했습니다
  lexicon: LSJ
  rationale: συνέτριψαν의 강한 파괴성을 ‘무너뜨리다’로, κατεκράτησαν의 결과적 우세를 ‘우세를 점하다’로 옮겨 전쟁 맥락의 승리를 자연스럽게 살렸습니다.
theological_decisions:
- issue: ‘킹 오브 더 키티안스’의 역사적 지시와 문자적 표기
  chosen_reading: 본문의 민족명 표기를 보존해 ‘키티온 사람들의 왕’으로 옮기고, 역사적 식별은 본문 바깥에서 검토할 수 있게 남겨 두었습니다.
  alternative_readings:
  - ‘시티움의 왕’
  - ‘마케도니아의 왕’
  rationale: 이 구절은 신학 논쟁점은 아니지만, 원문이 실제로는 민족명 복수형을 사용하므로 역사적 재해석으로 바꾸지 않는 것이 원문 충실성에 더 부합합니다.
  doctrine_reference: 원어 우선 원칙 / 역사적 식별은 주석의 역할
