  yaml_path: translation/deuterocanon/1_maccabees/008/031.yaml
  text: And concerning the wrongs that King Demetrius is doing to them[a], we wrote to him, saying, “Why have you made your yoke heavy upon our friends and allies, the Jews?”
  footnotes:
  - marker: a
    text: Or 'the evils' or 'the harms' that King Demetrius is bringing upon them.' The Greek expression can denote injurious acts or oppressive measures, not only moral evil in the abstract.
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 왕 데메트리우스가 그들에게 가하고 있는 해악에 관해서는[a], 우리가 그에게 이렇게 편지를 썼습니다. “왜 우리의 친구이자 동맹인 유대인들에게 당신의 멍에를 무겁게 지우셨습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악들’ 또는 ‘불의들’로 옮길 수 있습니다. 그리스어 표현은 추상적인 도덕악만이 아니라, 그들에게 가해지는 해로운 행위나 압제적 조치를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ τῶν κακῶν
  english_pob_choice: concerning the wrongs
  chosen_korean: 불의에 관해서는
  alternatives_korean:
  - 악들에 관해서는
  - 해악에 관해서는
  - 고난에 관해서는
  lexicon: LSJ
  rationale: κακά는 여기서 추상적 도덕악보다 유대인들에게 가해진 가해·압박을 가리키므로, 문맥상 ‘불의’가 가장 자연스럽고 원문 의미를 잘 드러냅니다.
- source_word: συντελεῖται εἰς αὐτούς
  english_pob_choice: is doing to them
  chosen_korean: 그들에게 행하고 있는
  alternatives_korean:
  - 그들에게 하고 있는
  - 그들에게 가하고 있는
  - 그들에게 저지르고 있는
  lexicon: LSJ
  rationale: 진행 중인 가해 행위를 나타내므로 현재분사적 흐름을 살려 ‘행하고 있는’으로 옮겼습니다.
- source_word: τὸν ζυγόν σου
  english_pob_choice: your yoke
  chosen_korean: 당신의 멍에
  alternatives_korean:
  - 당신의 짐
  - 당신의 압제
  lexicon: LSJ
  rationale: ζυγός의 문자적 이미지가 통치의 압박을 비유하므로, 비유를 보존하는 ‘멍에’를 유지했습니다.
- source_word: ἐπὶ τοὺς φίλους ἡμῶν τοὺς συμμάχους Ἰουδαίους
  english_pob_choice: upon our friends and allies, the Jews
  chosen_korean: 우리의 친구요 동맹인 유대인들 위에
  alternatives_korean:
  - 우리의 친구이자 동맹인 유대인들에게
  - 우리의 유대인 친구들과 동맹들 위에
  lexicon: LSJ
  rationale: 그리스어의 동격 구조를 살려 유대인들이 ‘친구’이자 ‘동맹’임을 함께 드러냈습니다.
theological_decisions:
- issue: 압제 비유로서의 ‘멍에’
  chosen_reading: 문자적 ‘멍에’를 유지하여 왕권의 억압성과 무게를 드러냈습니다.
  alternative_readings:
  - ‘짐’으로 완화하여 옮김
  - ‘압제’로 의미만 풀이함
  rationale: 본문의 질문은 정치적 억압을 상징하는 멍에 이미지를 통해 왕의 행위를 고발하므로, 비유를 풀지 않고 그대로 살리는 것이 원문의 힘을 보존합니다.
  doctrine_reference: 역사서 본문 해석 원칙
