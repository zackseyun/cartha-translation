  - 무용(武勇)의 행적
  - 용감한 행위
  lexicon: LSJ
  rationale: 이 단어는 단순한 ‘용감함’보다 전투적 공로와 무용을 가리키므로 ‘용맹한 행적’이 의미를 가장 잘 드러냅니다.
- source_word: ὑπὸ φόρον
  english_pob_choice: under tribute
  chosen_korean: 조공 아래 두었다
  alternatives_korean:
  - 조공을 바치게 했다
  - 조세를 부과했다
  - 조공에 복속시켰다
  lexicon: LSJ
  rationale: 지배 관계를 나타내는 관용구이므로, 단순 과세보다 복속 상태를 분명히 하는 표현을 택했습니다.
