  text: 그들이 힘으로 강하다는 것과, 갈라티아 사람들 가운데서 한 그들의 전쟁과 용맹한 행적[a], 그리고 그들이 그들을 굴복시켜 조공 아래 두었다는 것도 전해 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
