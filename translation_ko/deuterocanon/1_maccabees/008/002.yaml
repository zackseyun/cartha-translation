translation:
  language: ko
  text: 또 그들이 힘이 강하다는 것과, 그들의 전쟁들과 갈라티아 사람들 가운데에서 행한 용맹한 행적[a]을 그에게 들려주었으며, 그들을 정복하여 조공을 바치게 하였다는 것도 전해 주었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘용맹한 행위’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘갈라티아 사람들 가운데에서’입니다. 이 표현은 로마인들의 활동이 갈라티아 사람들과 관련되었거나 갈라티아 지역에서 이루어졌음을 가리킬 수 있습니다.
    reason: lexical_alternative
