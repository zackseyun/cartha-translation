  lexicon: LSJ
  rationale: 단순 보고가 아니라 왕에게 전하는 서술을 자연스럽게 담기 위해 ‘전해 주었습니다’로 옮겼습니다.
- source_word: ἀνδραγαθίας
  english_pob_choice: brave deeds
  chosen_korean: 용맹한 행적
  alternatives_korean:
