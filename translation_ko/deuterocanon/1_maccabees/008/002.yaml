lexical_decisions:
- source_word: δυνατοὶ ἰσχύϊ
  english_pob_choice: mighty in strength
  chosen_korean: 힘으로 강하다
  alternatives_korean:
  - 강대한 힘을 지니다
  - 강력한 힘을 지니다
  lexicon: LSJ
  rationale: Greek의 중첩된 강세를 한국어의 ‘힘으로 강하다’로 살려 군사적 역량을 강조했습니다.
- source_word: διηγήσαντο αὐτῷ
