  lexicon: LSJ
  rationale: κατακρατέω는 단순한 획득보다 지배적 통제를 뜻하므로, ‘장악하다’가 목적의 뉘앙스를 가장 잘 살립니다.
- source_word: τῶν μετάλλων τοῦ ἀργυρίου καὶ τοῦ χρυσίου
  english_pob_choice: the silver and gold mines there
  chosen_korean: 은과 금의 광산들을
  alternatives_korean:
