lexical_decisions:
- source_word: χώρᾳ Σπανίας
  english_pob_choice: in the land of Spain
  chosen_korean: 스페인 땅에서
  alternatives_korean:
  - 스페인 지역에서
  - 히스파니아 땅에서
  lexicon: LSJ
  rationale: χώρα는 이 문맥에서 현대 국가명보다 넓은 ‘땅/지역’의 뜻이 자연스럽고, 스페인은 독자에게 익숙한 지명으로 옮기는 것이 가장 직접적입니다.
- source_word: τοῦ κατακρατῆσαι
  english_pob_choice: to gain control of
  chosen_korean: 장악하려
  alternatives_korean:
  - 빼앗으려
  - 차지하려
  - 지배하려
  lexicon: LSJ
  rationale: κατακρατέω는 단순한 획득보다 지배적 통제를 뜻하므로, ‘장악하다’가 목적의 뉘앙스를 가장 잘 살립니다.
- source_word: τῶν μετάλλων τοῦ ἀργυρίου καὶ τοῦ χρυσίου
  english_pob_choice: the silver and gold mines there
  chosen_korean: 은과 금의 광산들을
  alternatives_korean:
  - 은과 금의 자원들을
  - 은광과 금광을
  lexicon: LSJ
  rationale: μέταλλα는 ‘금속’일 수도 있지만 여기서는 뒤의 소유격과 함께 광산/채굴지를 가리키는 맥락이므로 ‘광산들’이 영어 POB의 의미를 한국어로 가장 분명하게 옮깁니다.
- source_word: τοῦ ἐκεῖ
  english_pob_choice: there
  chosen_korean: 거기 있는
  alternatives_korean:
  - 그곳의
  - 거기에 있는
  lexicon: LSJ
  rationale: ἐκεῖ는 위치를 가리키는 부사이므로, 앞의 광산들을 수식하는 자연스러운 한국어로 ‘거기 있는’을 택했습니다.
