translation:
  language: ko
  text: 그런데 이 조항들 뒤에 이 사람들과 저 사람들이 무엇을 더하거나 빼기로 결의하면, 그들은 자기 결정에 따라 그렇게 할 것이며, 그들이 더하거나 뺀 것은 모두 유효할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이 사람들과 저 사람들’은 헬라어의 반복된 지시대명사를 살린 것으로, 두 당사자를 가리킵니다.
    reason: source_note
  - marker: b
    text: ‘유효할 것입니다’는 이 법적 문맥의 κύρια를 따른 것으로, ‘구속력을 가질 것입니다’ 또는 ‘효력이 있을 것입니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
