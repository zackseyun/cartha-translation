  text: And they went to Rome—the journey was very long indeed—and entered the council chamber and answered[b][a],
  footnotes:
  - marker: a
    text: Or 'the road was exceedingly long.' The Greek phrase is literally about the 'way/road' being very great, but in context it refers to the length of the journey.
    reason: lexical_alternative
  - marker: b
    text: Or 'the senate house.' The Greek names the place where the council met; 'council chamber' is a less interpretive rendering.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 로마로 갔는데, 그 여정은 몹시 길었습니다. 그들은 의회 회의장에 들어가 대답했습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 길은 몹시 길었습니다.’ 그리스어 표현은 문자적으로 길이 매우 크거나 길다는 뜻이지만, 문맥에서는 여정의 긴 거리를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘원로원 회의장.’ 그리스어는 의회가 모이는 장소를 가리키며, ‘의회 회의장’은 이를 지나치게 특정하지 않고 옮긴 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύθησαν / εἰς Ῥώμην
  english_pob_choice: went to Rome
  chosen_korean: 로마로 갔습니다
  alternatives_korean:
  - 로마로 여행했습니다
  - 로마로 떠났습니다
  lexicon: LSJ
  rationale: 여기서는 단순한 이동 서술이므로 ‘갔습니다’가 가장 자연스럽고, 방향을 나타내는 εἰς도 ‘-로’로 충분히 반영됩니다.
- source_word: ἡ ὁδὸς πολλὴ σφόδρα
  english_pob_choice: the journey was very long indeed
  chosen_korean: 그 여정은 매우 길었습니다
  alternatives_korean:
  - 그 길은 매우 길었습니다
  - 그 여정은 몹시 길었습니다
  lexicon: LSJ
  rationale: 직역하면 ‘길/길이 매우 컸다’에 가깝지만 문맥상 이동의 길이를 말하므로 ‘여정’으로 옮겼습니다. 영어 본문의 강세를 ‘매우’로 살리되, 한국어 문장에서는 과도한 중첩을 피했습니다.
- source_word: τὸ βουλευτήριον
  english_pob_choice: the council chamber
  chosen_korean: 회의실
  alternatives_korean:
  - 공의회 회의장
  - 원로원 회의실
  lexicon: LSJ
  rationale: βουλευτήριον은 회의가 열리는 장소를 가리키므로, 로마 정치 맥락을 지나치게 특정하지 않으면서도 기능을 드러내는 ‘회의실’이 가장 투명합니다.
- source_word: ἀπεκρίθησαν
  english_pob_choice: answered
  chosen_korean: 대답했습니다
  alternatives_korean:
  - 응답했습니다
  - 답했습니다
  lexicon: LSJ
  rationale: 문맥상 다음 절의 발화로 이어지는 서술 동사이므로 ‘대답했습니다’가 가장 직접적입니다.
