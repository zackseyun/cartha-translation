translation:
  language: ko
  text: 그리고 그를 살아 있는 채로 붙잡았으며, 그의 뒤를 이어 다스릴 이들까지도 함께, 그와 더불어 큰 조공을 바치고 인질을 내주며 영토를 양도하도록 그들에게 부과하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 생포하였다.’
    reason: lexical_alternative
  - marker: b
    text: 그리스어 διαστολήν은 여기서 영토의 구획, 분할, 양도 같은 의미를 가리킬 수 있는 난해한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβον αὐτὸν ζῶντα
  english_pob_choice: they took him alive
  chosen_korean: 그를 살아 있는 채로 붙잡았으며
  alternatives_korean:
  - 그를 살아서 잡았으며
  - 그를 산 채로 사로잡았으며
  lexicon: LSJ
  rationale: ζῶντα는 죽이지 않고 생포했다는 뜻이므로, 한국어에서는 문맥에 맞게 ‘살아 있는 채로’로 살렸습니다.
- source_word: ἔστησαν αὐτοῖς διδόναι
  english_pob_choice: imposed on them that ... should pay / give
  chosen_korean: …하도록 그들에게 부과하였습니다
  alternatives_korean:
  - …하도록 그들에게 강요하였습니다
  - …하도록 그들에게 요구하였습니다
  lexicon: LSJ
  rationale: ἔστησαν plus infinitive는 단순 요청이 아니라 의무를 정해 부과하는 법적·정치적 표현이므로 ‘부과하다’가 가장 가깝습니다.
- source_word: φόρον μέγαν
  english_pob_choice: a great tribute
  chosen_korean: 큰 조공을
  alternatives_korean:
  - 무거운 조공을
  - 큰 세금을
  lexicon: LSJ
  rationale: φόρος는 이 정치 문맥에서 ‘세금’보다 속국이 바치는 ‘조공’이 더 정확하며, μέγαν은 직역하여 ‘큰’으로 옮겼습니다.
- source_word: ὅμηρα
  english_pob_choice: hostages
  chosen_korean: 인질을
  alternatives_korean:
  - 볼모를
  - 담보 인원을
  lexicon: LSJ
  rationale: ὅμηρα는 정치적 안전장치로 내주는 사람들을 가리키므로, 현대 한국어에서는 뜻이 분명한 ‘인질’이 적절합니다.
- source_word: διαστολήν
  english_pob_choice: a cession of territory
  chosen_korean: 영토를 양도하며
  alternatives_korean:
  - 영토를 내주며
  - 영토 분할을
  lexicon: LSJ
  rationale: διαστολήν은 문맥상 영토적 양도·구획을 시사하지만 단어 자체가 난해하므로, POB의 해석을 따라 ‘영토를 양도하다’로 옮겨 정치적 결과를 드러냈습니다.
theological_decisions:
- issue: 왕권 계승자까지 포함한 항복 조건의 범위
  chosen_reading: ‘그의 뒤를 이어 다스릴 이들까지도’로 옮겨, 현재 왕뿐 아니라 후계 통치자들까지 같은 의무를 지는 범위를 분명히 했습니다.
  alternative_readings:
  - ‘그 뒤에 통치할 자들’
  - ‘그 후에 왕이 될 이들’
  rationale: αὐτόν τε καὶ τοὺς βασιλεύοντας μετʼ αὐτόν은 현 왕과 그 후계자들을 함께 묶어 조공 의무를 부과하는 표현이므로, 범위를 넓히지 않고 함께 드러냈습니다.
  doctrine_reference: 역사 서술의 정치적 조약 표현
