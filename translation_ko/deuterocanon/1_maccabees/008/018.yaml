  naturalness: ‘그들의 멍에를 벗기기’는 한국어에서 멍에를 누구에게서 벗기는지 다소 불분명합니다. ‘그들에게 씌워진 멍에를 벗겨 주기’는 멍에의 비유를 유지하면서 자연스럽습니다. 문맥상 앞 절의 내용을 잇는 문장 단편 구조는 유지하되, ‘이는’으로 인과 관계를 매끄럽게 연결했습니다.
