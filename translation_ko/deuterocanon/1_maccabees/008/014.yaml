translation:
  language: ko
  text: 이 모든 일에서 그들 가운데 아무도 왕관을 쓰지 않았고[a], 자색 옷을 걸쳐[b] 그것으로 스스로를 높이려 하지도 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘왕관’은 여기서 왕권을 상징하는 디아뎀(διάδημα), 곧 왕의 머리띠를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 자색은 왕권이나 높은 신분의 표지로 쓰였습니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ἅπασιν τούτοις
  english_pob_choice: in all these matters
  chosen_korean: 이 모든 일에
  alternatives_korean:
  - 이 모든 일들에서
  - 이 모든 것들에
  lexicon: LSJ
  rationale: 앞뒤 문맥에 제시된 로마의 정치적 관행 전체를 가리키므로, 한국어에서는 자연스럽고 범위가 분명한 ‘이 모든 일에’로 옮겼습니다.
- source_word: ἐπέθετο ... διάδημα
  english_pob_choice: put on a crown
  chosen_korean: 관을 쓰지 않았고
  alternatives_korean:
  - დი아뎀을 쓰지 않았고
  - 왕관을 쓰지 않았고
  lexicon: LSJ
  rationale: διάδημα는 원래 왕권을 상징하는 머리띠이지만, 본문에서는 왕권 표지 전반을 가리키므로 읽기 쉬운 ‘관’으로 옮기되, 동작은 ‘쓰다’로 자연스럽게 표현했습니다.
- source_word: πορφύραν
  english_pob_choice: purple
  chosen_korean: 자색 옷을 걸치지도 않았고
  alternatives_korean:
  - 자주색 옷을 입지도 않았고
  - 보라색 옷을 걸치지도 않았고
  lexicon: LSJ
  rationale: 그리스어는 염료/천의 색을 메톤미적으로 말하므로, 왕권·고위 신분의 표지라는 뉘앙스를 살려 ‘자색 옷’으로 옮겼습니다.
- source_word: ἁδρυνθῆναι ἐν αὐτῇ
  english_pob_choice: to exalt themselves by it
  chosen_korean: 그것으로 스스로를 높이려는 것이었습니다
  alternatives_korean:
  - 그것으로 스스로를 크게 보이려는 것이었습니다
  - 그것으로 스스로를 과시하려는 것이었습니다
  lexicon: LSJ
  rationale: 목적/의도 표현이므로 ‘~하려는 것이었습니다’로 풀고, 자색 옷을 통한 자가 과시·자기 고양의 뜻을 ‘스스로를 높이다’로 담았습니다.
theological_decisions:
- issue: 왕권 표지(관/자색)의 의미를 어떻게 드러낼지
  chosen_reading: 본문의 외적 표지 자체를 서술하되, 그 목적을 ‘스스로를 높이려는 것’으로 밝혀 권력 과시의 의미를 드러냈습니다.
  alternative_readings:
  - 단순히 예복 묘사로 약화시키는 읽기
  - 도덕적 비난을 지나치게 강하게 덧씌우는 읽기
  rationale: 문맥상 핵심은 왕권적 장식의 거절과 그 장식이 지닌 자기 고양의 의미이므로, 장식 자체와 의도를 함께 보존하는 쪽이 원문 의도에 가깝습니다.
  doctrine_reference: 문맥 주해(헬라스-로마 권력 상징)
