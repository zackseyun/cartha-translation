lexical_decisions:
- source_word: ἤρεσεν
  english_pob_choice: pleased
  chosen_korean: 좋게 여겨졌습니다
  alternatives_korean:
  - 기뻐했습니다
  - 마음에 들었습니다
  - 좋았습니다
  lexicon: LSJ
  rationale: ἀρέσκω의 aorist는 여기서 제안이 승인·호감을 얻었다는 뜻이므로, 한국어에서는 인물의 감정 반응보다 ‘판단상 좋게 받아들여짐’을 살려 표현하는 것이 source에 더 가깝습니다.
- source_word: ὁ λόγος
  english_pob_choice: the proposal
  chosen_korean: 그 말
  alternatives_korean:
  - 그 제안
  - 그 말씀
  - 그 일
  lexicon: LSJ
  rationale: 이 문맥의 λόγος는 단순한 ‘말씀’이나 추상적 ‘일’보다 앞서 제시된 협상/제의의 내용을 가리키므로, 본문 흐름을 과장하지 않는 범위에서 ‘그 말’로 옮겼습니다.
- source_word: ἐνώπιον αὐτῶν
  english_pob_choice: them
  chosen_korean: 그들 앞에서
  alternatives_korean:
  - 그들 앞에
  - 그들 보기에
  - 그들의 면전에서
  lexicon: LSJ
  rationale: 직역하면 ‘그들 앞에서’이지만, 한국어에서는 ‘좋게 여겨졌습니다’와 결합할 때 자연스럽게 승인 주체를 드러내는 부사어로 처리했습니다.
