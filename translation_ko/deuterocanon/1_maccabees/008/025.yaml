translation:
  language: ko
  text: 유대인의 민족은 그들에게 주어진 때에 따라 협력할 것이며, 온 마음으로 할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘충만한 마음으로’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: συμμαχήσει
  english_pob_choice: shall be an ally
  chosen_korean: 협력할 것이며
  alternatives_korean:
  - 동맹이 될 것입니다
  - 함께 싸울 것입니다
  - 공동 보조할 것입니다
  lexicon: LSJ
  rationale: συμμαχέω는 동맹 관계에 들어가거나 함께 협력한다는 뜻이므로, 문맥상 군사 행동을 과도하게 구체화하지 않으면서도 자연스러운 한국어로 ‘협력할 것’으로 옮겼습니다.
- source_word: τὸ ἔθνος τῶν Ἰουδαίων
  english_pob_choice: the nation of the Jews
  chosen_korean: 유대인의 민족
  alternatives_korean:
  - 유대 민족
  - 유대인들의 백성
  - 유대인의 나라
  lexicon: LSJ
  rationale: ἔθνος의 정치·집단적 의미를 살려 ‘민족’으로 옮기고, 속격은 소유보다 소속을 나타내는 평이한 표현으로 처리했습니다.
- source_word: ὡς ἂν ὁ καιρὸς ὑπογράφῃ αὐτοῖς
  english_pob_choice: as the occasion may indicate for them
  chosen_korean: 그들에게 주어진 때에 따라
  alternatives_korean:
  - 상황이 그들에게 지시하는 대로
  - 때가 그들에게 정해 주는 대로
  - 그들에게 맞는 때에 따라
  lexicon: LSJ
  rationale: καιρός는 단순한 시간보다 ‘적절한 때/상황’에 가깝고, ὑπογράφῃ는 문맥상 ‘지시하다’보다 ‘정해 주다/규정하다’의 뉘앙스를 가질 수 있어, 한국어에서는 자연스럽게 ‘그들에게 주어진 때에 따라’로 압축했습니다.
- source_word: καρδίᾳ πλήρει
  english_pob_choice: with a full heart
  chosen_korean: 온 마음으로
  alternatives_korean:
  - 마음이 충만하여
  - 온전한 마음으로
  - 마음 가득
  lexicon: LSJ
  rationale: 직역하면 ‘충만한 마음으로’이지만, 관용적 뜻이 ‘wholeheartedly’이므로 한국어에서는 과도한 문자주의를 피하면서도 원문의 진정성 강조를 살려 ‘온 마음으로’로 옮겼습니다.
theological_decisions:
- issue: 동맹/협력의 정치적·공동체적 의미
  chosen_reading: 본문은 종교적 영적 연합이 아니라 유대 민족과 타자 사이의 정치적 협력 약속을 말하므로, 교회적 용어로 완화하지 않고 ‘협력’으로 유지했습니다.
  alternative_readings:
  - 교제할 것입니다
  - 연합할 것입니다
  - 한마음이 될 것입니다
  rationale: 헬라어 συμμαχέω의 기본 의미와 마카베오기의 외교적 문맥을 보존하기 위한 선택입니다.
  doctrine_reference: 역사서의 문맥 보존 원칙
- issue: ‘온 마음’의 진정성 표현
  chosen_reading: ‘καρδίᾳ πλήρει’를 한국어 관용에 맞게 ‘온 마음으로’로 옮겨, 형식적 직역보다 진정성의 강도를 드러냈습니다.
  alternative_readings:
  - 마음이 가득한 채로
  - 충만한 마음으로
  - 전심으로
  rationale: 원문의 수사적 강조를 자연스러운 한국어로 전달하기 위한 표현이며, 의미상 ‘wholeheartedly’와 상응합니다.
  doctrine_reference: 의도-효과 등가 원칙
