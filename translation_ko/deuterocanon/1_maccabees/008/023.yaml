translation:
  language: ko
  text: 로마인들과 유대인의 민족에게 바다에서나 육지에서나 영원히 잘되게 하시고, 칼과 원수가 그들로부터 멀리 떠나게 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바다에서나 육지에서나’는 모든 영역을 포괄하는 관용적 병렬입니다.
    reason: cross_reference
  - marker: b
    text: ‘칼’은 여기서 전쟁을 가리키는 환유일 가능성이 있으나, 본문은 그 구체적 표현을 그대로 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλῶς γένοιτο
  english_pob_choice: May it go well
  chosen_korean: 잘되게 하시고
  alternatives_korean:
  - 복되게 하시고
  - 평안하게 하시고
  - 좋게 되게 하시고
  lexicon: LSJ
  rationale: 축복/기원의 optative를 한국어의 기원형으로 옮기되, 현대 합쇼체에서 자연스럽고 문맥상 포괄적인 표현인 ‘잘되게 하시고’를 택했습니다.
- source_word: Ῥωμαίοις
  english_pob_choice: the Romans
  chosen_korean: 로마인들
  alternatives_korean:
  - 로마 사람들
  - 로마인들
  lexicon: LSJ
  rationale: 로마 민족/백성을 가리키는 복수 여격이므로, 기사형을 덧붙이지 않고 집단을 직접 지시하는 ‘로마인들’이 간결합니다.
- source_word: τῷ ἔθνει τῶν Ἰουδαίων
  english_pob_choice: the nation of the Jews
  chosen_korean: 유대인의 민족
  alternatives_korean:
  - 유대 민족
  - 유대인들의 나라
  - 유대인의 백성
  lexicon: LSJ
  rationale: ἔθνος의 민족-집단 의미를 살려 ‘민족’으로 옮기고, 소유격을 그대로 반영해 ‘유대인의’로 연결했습니다.
- source_word: ἐν τῇ θαλάσσῃ καὶ ἐπὶ τῆς ξηρᾶς
  english_pob_choice: on sea and on land
  chosen_korean: 바다에서나 육지에서나
  alternatives_korean:
  - 바다에서도 땅에서도
  - 바다와 육지에서
  - 바다에서든 육지에서든
  lexicon: LSJ
  rationale: 해상과 육상의 전 영역을 뜻하는 관용적 병렬을 한국어의 상응 표현으로 자연스럽게 살렸습니다.
- source_word: ῥομφαία
  english_pob_choice: sword
  chosen_korean: 칼
  alternatives_korean:
  - 칼날
  - 검
  - 도검
  lexicon: LSJ
  rationale: 무기 표지를 구체적으로 유지하되, 현대 한국어에서 가장 직접적이고 문맥상 자연스러운 ‘칼’을 택했습니다.
