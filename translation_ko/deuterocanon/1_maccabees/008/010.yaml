translation:
  language: ko
  text: 그리고 그 소식이 그들에게 알려지자, 그들은 한 장군을 그들을 치러 보내어 그들과 싸웠고, 그들 가운데 많은 사람이 부상당한 채 쓰러졌으며, 그들의 아내들과 자녀들을 포로로 사로잡고, 그들을 약탈하고, 그들의 땅을 장악하고, 그들의 요새들을 무너뜨리고, 그들을 약탈하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 끝부분에 ‘그들을 약탈하고’를 한 번 더 반복합니다. 한국어 본문에도 이 반복을 그대로 반영했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγνώσθη ὁ λόγος
  english_pob_choice: the report became known
  chosen_korean: 그 소식이 … 알려지자
  alternatives_korean:
  - 그 일이 알려지자
  - 그 보고가 알려지자
  - 그 소식이 전해지자
  lexicon: LSJ
  rationale: λόγος는 여기서 단순한 ‘말’이 아니라 전황과 관련해 ‘소식/보고’로 이해하는 것이 자연스럽고, 수동형은 ‘알려지다’로 옮기는 것이 한국어에 맞습니다.
- source_word: ἀπέστειλαν ἐπʼ αὐτοὺς στρατηγὸν ἕνα
  english_pob_choice: they sent one general against them
  chosen_korean: 한 장군을 그들에 맞서 보내어
  alternatives_korean:
  - 한 장군을 그들에게 보내어
  - 한 지휘관을 그들에 맞서 보내어
  - 한 장군을 파견하여
  lexicon: LSJ
  rationale: στρατηγός는 이 군사 문맥에서 ‘장군’이 가장 직접적이고, ἕνα의 ‘one’은 공격에 투입된 단수성을 살려 ‘한’으로 반영했습니다.
- source_word: ᾐχμαλώτισαν τὰς γυναῖκας αὐτῶν καὶ τὰ τέκνα αὐτῶν
  english_pob_choice: they took their wives and their children captive
  chosen_korean: 그들의 아내들과 자녀들을 포로로 잡아가고
  alternatives_korean:
  - 그들의 아내들과 자녀들을 포로로 삼고
  - 그들의 아내들과 자녀들을 사로잡고
  - 그들의 아내들과 자녀들을 포로로 끌고 가고
  lexicon: LSJ
  rationale: ᾐχμαλώτισαν은 전쟁 포로로 ‘사로잡다’의 뜻이므로, 여성과 자녀를 함께 대상으로 한 폭력을 드러내는 ‘포로로 잡아가다’가 문맥에 맞습니다.
- source_word: ἐπρονόμευσαν αὐτούς
  english_pob_choice: plundered them
  chosen_korean: 그들을 약탈하고 … 그들을 다시 약탈하였습니다
  alternatives_korean:
  - 그들을 노략하고 … 그들을 다시 노략하였습니다
  - 그들을 탈취하고 … 그들을 다시 탈취하였습니다
  - 그들을 약탈하고 … 다시 약탈하였습니다
  lexicon: LSJ
  rationale: 이 동사는 전리품을 빼앗는 행위를 뜻하므로 ‘약탈하다’가 가장 명료하며, 본문의 반복을 한국어에서도 그대로 드러내기 위해 뒤의 반복도 살렸습니다.
- source_word: καθεῖλον τὰ ὀχυρώματα αὐτῶν
  english_pob_choice: pulled down their strongholds
  chosen_korean: 그들의 요새들을 무너뜨리고
  alternatives_korean:
  - 그들의 성채들을 허물고
  - 그들의 견고한 곳들을 무너뜨리고
  - 그들의 요새들을 헐어버리고
  lexicon: LSJ
  rationale: ὀχυρώματα는 방어용 요새/성채를 가리키므로, 현대 한국어에서 가장 이해하기 쉬운 ‘요새’로 옮기되 파괴 동사는 ‘무너뜨리다’로 살렸습니다.
theological_decisions:
- issue: 전쟁 서술의 반복과 누적
  chosen_reading: 본문의 연속된 동사열과 마지막 ‘그들을 다시 약탈하였습니다’는 중복이라기보다 공격의 잔혹성과 완전한 정복을 강조하는 효과로 유지했습니다.
  alternative_readings:
  - 마지막 반복을 생략해 문장을 매끈하게 다듬는 읽기
  - 반복을 각주로 처리하는 읽기
  rationale: 그리스어 본문에 있는 반복을 삭제하면 저자의 전쟁 묘사 강도가 약해지므로, 의미상 어색하더라도 본문에 남겨 투명성을 보존했습니다.
  doctrine_reference: 본문 비평 및 서사 수사
