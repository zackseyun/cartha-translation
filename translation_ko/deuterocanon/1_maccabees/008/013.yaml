  yaml_path: translation/deuterocanon/1_maccabees/008/013.yaml
  text: Whomever they wish to help and to make king[a], they make king; and whomever they wish, they remove[b], and they have become very great.
  footnotes:
  - marker: a
    text: Or 'they depose' for 'they remove'; the Greek verb can carry the sense of removing someone from office in a political setting.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'they were exalted greatly'; the phrase summarizes their rise to great power.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 돕고 왕으로 세우고자 하는 자는 왕으로 세우고, 그들이 원하면 누구든지 물러나게 하며, 그들은 매우 크게 되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘왕으로 만들다/통치하게 하다’에 가깝지만, 정치적 문맥에서는 ‘왕으로 세우다’가 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘매우 높아졌다’이지만, 여기서는 로마의 급격한 부상과 위세를 가리키는 요약 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς δʼ ἂν βούλωνται
  english_pob_choice: Whomever they wish
  chosen_korean: 그들이 원하면 누구든지
  alternatives_korean:
  - 그들이 원하는 자는 누구든지
  - 그들이 바라는 대로 누구든지
  lexicon: BDAG
  rationale: 부정 관계대명사적 용법을 살려 범위를 열어 두되, 한국어에서는 자연스러운 ‘누구든지’로 옮겼습니다.
- source_word: βοηθεῖν
  english_pob_choice: to help
  chosen_korean: 돕고
  alternatives_korean:
  - 도와주고
  - 원조하고
  lexicon: BDAG
  rationale: 정치·군사적 맥락에서 단순하고 직접적인 ‘돕다’가 가장 무난하며, 과도한 설명을 덧붙이지 않습니다.
- source_word: καὶ βασιλεύειν / βασιλεύουσιν
  english_pob_choice: and make king / they make king
  chosen_korean: 왕으로 세우고 / 왕으로 세우고
  alternatives_korean:
  - 왕으로 만들고 / 왕으로 만듭니다
  - 통치하게 하고 / 통치하게 합니다
  lexicon: LSJ
  rationale: 본문은 누군가를 왕위에 앉히는 정치적 행위를 말하므로, 관용적으로 ‘왕으로 세우다’를 택해 행위의 방향을 분명히 했습니다.
- source_word: μεθιστῶσιν
  english_pob_choice: they remove
  chosen_korean: 물러나게 하며
  alternatives_korean:
  - 폐위하며
  - 제거하며
  - 끌어내리며
  lexicon: LSJ
  rationale: 문맥상 직책에서 치우게 하는 뜻이므로, POB의 ‘remove’에 대응하면서도 한국어에서 지나치게 강한 ‘폐위하다’보다 넓은 ‘물러나게 하다’를 썼습니다.
- source_word: ὑψώθησαν σφόδρα
  english_pob_choice: they have become very great
  chosen_korean: 매우 크게 되었습니다
  alternatives_korean:
  - 지극히 높아졌습니다
  - 매우 높이 들어 올려졌습니다
  - 크게 번성했습니다
  lexicon: LSJ
  rationale: 직역하면 ‘크게 높아지다/들려 올려지다’이지만, 문맥상 로마의 현저한 부상과 위세를 요약하므로 한국어에서는 결과 상태를 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 로마의 ‘높아짐’의 의미
  chosen_reading: 본절의 ὑψώθησαν σφόδρα를 정치적·역사적 위상 상승으로 이해해 ‘매우 크게 되었습니다’로 옮겼습니다.
  alternative_readings:
  - ‘매우 높아졌습니다’처럼 보다 형식적으로 직역
  - ‘지극히 강대해졌습니다’처럼 역동적으로 의역
  rationale: 문맥이 제국의 힘과 영향력의 증대를 요약하므로, 영적 승귀로 오해되지 않도록 역사적 상승을 드러내는 표현을 택했습니다.
  doctrine_reference: 역사서 문맥의 서술 의도
