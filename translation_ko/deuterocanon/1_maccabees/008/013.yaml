translation:
  language: ko
  text: 그들이 돕고 왕으로 세우고자 하는 이들은 왕으로 세우며[a], 그들이 원하는 이들은 내치고, 그들은 매우 강대해졌습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘왕이 되게 하다’ 또는 ‘통치하게 하다’에 가깝습니다. 여기서는 정치적 문맥에 따라 ‘왕으로 세우다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘매우 높아졌습니다’ 또는 ‘크게 높임을 받았습니다’입니다. 여기서는 로마의 권세와 위상이 크게 높아진 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς δʼ ἂν βούλωνται
