- from: 그들은 로마로 갔고, 의회 회의장에 들어가서 이렇게 말했습니다. “대제사장 요나단과 유대인 민족이 우리를 보내어, 그들과의 동맹을 전처럼 갱신하게 했습니다.”[a]
  to: 그들은 로마로 가서 평의회 회의장[a]에 들어가 이렇게 말했습니다. “대제사장 요나단과 유대 민족이 그들과의 동맹을 전처럼 갱신하려고 우리를 보냈습니다.”
