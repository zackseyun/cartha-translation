  yaml_path: translation/deuterocanon/1_maccabees/012/003.yaml
  text: And they went to Rome[a], and they entered the council chamber, and said, “Jonathan the high priest and the nation of the Jews have sent us to renew with them the alliance as before.”
  footnotes:
  - marker: a
    text: Or “senate house” / “council hall”; the Greek names the meeting place of the governing council rather than using a formal Roman institutional title.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 로마로 갔고, 의회 회의장에 들어가서 이렇게 말했습니다. “대제사장 요나단과 유대인 민족이 우리를 보내어, 그들과의 동맹을 전처럼 갱신하게 했습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘원로원 회의장’/‘의회 회의실’. 그리스어는 공식 기관명보다 통치 회의가 열리는 장소를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύθησαν
  english_pob_choice: went
  chosen_korean: 갔고
  alternatives_korean:
  - 여행했습니다
  - 떠났습니다
  lexicon: LSJ
  rationale: 단순한 이동을 나타내므로, 현대 한국어에서는 군더더기 없는 ‘갔고’가 가장 자연스럽습니다.
- source_word: βουλευτήριον
  english_pob_choice: council chamber
  chosen_korean: 의회 회의장
  alternatives_korean:
  - 원로원 회의장
  - 회의장
  - 평의회
  lexicon: LSJ
  rationale: 그리스어는 특정 로마 제도명보다 ‘회의가 열리는 장소’를 가리키므로, 제도명을 과도하게 해석하지 않는 물리적 장소 표현을 택했습니다.
- source_word: Ἰωναθὰν ὁ ἀρχιερεύς
  english_pob_choice: Jonathan the high priest
  chosen_korean: 대제사장 요나단
  alternatives_korean:
  - 최고제사장 요나단
  - 요나단 대제사장
  lexicon: LSJ
  rationale: ἀρχιερεύς는 여기서 표준적인 ‘대제사장’이 가장 직접적이며, 한국어에서도 인물명 앞에 직분을 두어 자연스럽게 정리했습니다.
- source_word: τὸ ἔθνος τῶν Ἰουδαίων
  english_pob_choice: the nation of the Jews
  chosen_korean: 유대인 민족
  alternatives_korean:
  - 유대인의 민족
  - 유대 민족
  - 유대 사람들의 민족
  lexicon: LSJ
  rationale: ἔθνος의 집단적·민족적 의미를 살리되, 한국어에서는 ‘유대인 민족’이 가장 간결하고 문맥상 이해되기 쉽습니다.
- source_word: ἀνανεώσασθαι αὐτοῖς καὶ τὴν συμμαχίαν
  english_pob_choice: to renew with them the alliance
  chosen_korean: 그들과의 동맹을 갱신하게 했습니다
  alternatives_korean:
  - 그들과 맺은 동맹을 새롭게 하게 했습니다
  - 그들과의 동맹을 다시 맺게 했습니다
  lexicon: LSJ
  rationale: ἀνανεόω는 ‘다시 새롭게 하다/갱신하다’의 뜻이므로 ‘갱신하다’를 택했고, συμμαχίαν은 정치적 관계를 가리켜 ‘동맹’이 가장 정확합니다.
theological_decisions:
- issue: 로마의 공적 공간을 지칭하는 βουλευτήριον의 처리
  chosen_reading: ‘의회 회의장’으로 옮겨, 그 장소가 행정·정치적 회의가 열리는 공간임을 드러냈습니다.
  alternative_readings:
  - ‘원로원’
  - ‘의회’
  rationale: 본문은 제도명 자체보다 회의 장소를 말하므로, 특정 기관명으로 굳히기보다 장소성을 유지하는 번역이 원문에 더 충실합니다.
  doctrine_reference: 역사 서술의 표지 보존
