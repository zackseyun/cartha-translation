  yaml_path: translation/deuterocanon/1_maccabees/012/007.yaml
  text: Even earlier[a], letters were sent to Onias the high priest from Areus, who was ruling among you, saying, ‘You are our brothers,’ as the copy laid out here shows.
  footnotes:
  - marker: a
    text: Or 'as the copy below shows.' The Greek expression indicates that a copy of the earlier letter is being presented or appended.
    reason: lexical_alternative
translation:
  language: ko
  text: 그보다도 앞서[a], 여러분 가운데서 통치하던 아레우스가 오니아스 대제사장에게 편지들을 보내어, ‘여러분은 우리의 형제들입니다’라고 하였습니다. 아래에 제시된 사본에서 이를 볼 수 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여기에 제시된 사본에서 이를 볼 수 있습니다.’ 그리스어 표현은 앞선 편지의 사본이 현재 문맥에 제시되거나 부속되어 있음을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι πρότερον
  english_pob_choice: Even earlier
  chosen_korean: 이보다 더 이전에
  alternatives_korean:
  - 더 전에
  - 훨씬 이전에
  lexicon: LSJ
  rationale: πρότερον의 시간상 선행을 살리면서 ἔτι의 강조를 반영하기 위해, 자연스러운 현대 한국어로 ‘이보다 더 이전에’라고 옮겼습니다.
- source_word: ἀπεστάλησαν ἐπιστολαὶ
  english_pob_choice: letters were sent
  chosen_korean: 편지들이 보내졌는데
  alternatives_korean:
  - 편지들이 발송되었는데
  - 서신들이 보내졌는데
  lexicon: LSJ
  rationale: 복수형 ἐπιστολαὶ를 살려 ‘편지들’로 번역했고, 수동 표현도 유지했습니다.
- source_word: ὅτι ἐστὲ ἀδελφοὶ ἡμῶν
  english_pob_choice: saying, ‘You are our brothers,’
  chosen_korean: 「너희는 우리의 형제들이다」라고
  alternatives_korean:
  - 「너희는 우리의 형제들이다」라고 하여
  - 「너희는 우리의 형제들입니다」라고
  lexicon: LSJ
  rationale: 여기서 ὅτι는 내용절을 이끄는 말로 이해해 직접 인용을 살렸고, ἀδελφοί는 혈연·동족적 친연성을 드러내는 직접적 표현인 ‘형제들’로 옮겼습니다.
- source_word: ὡς τὸ ἀντίγραφον ὑπόκειται
  english_pob_choice: as the copy laid out here shows
  chosen_korean: 그 사본이 여기 제시되어 있습니다
  alternatives_korean:
  - 그 사본이 아래에 제시되어 있습니다
  - 그 사본이 여기 첨부되어 있습니다
  lexicon: LSJ
  rationale: ἀντίγραφον은 문서의 사본/필사본이고, ὑπόκειται는 ‘아래에 놓여 있다’는 뜻에서 문서가 제시·부속되어 있음을 나타내므로, 의미를 자연스럽게 풀어 ‘여기 제시되어 있습니다’로 옮겼습니다.
