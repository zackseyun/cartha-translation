  terminology: ‘요나단’과 ‘백성’은 적절합니다. ‘이 온 백성’은 단수 λαός와 지시사 및 전체성을 자연스럽게 반영합니다. ‘쳐서 쓰러뜨리다’는 특정한 살해 방식이나 완전한 섬멸을 단정하지 않으면서 κόπτω의 폭력적 군사 문맥을 보존합니다.
