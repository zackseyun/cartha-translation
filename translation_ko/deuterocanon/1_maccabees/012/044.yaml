  text: And he said to Jonathan[a], “Why have you cut down all this people, when no war is pressing upon us?”
  footnotes:
  - marker: a
    text: Greek literally, 'Why have you cut off all this people, with war not being present to us?' The wording is somewhat abrupt in Greek; the translation smooths the idiom but preserves the sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 요나단에게 말했습니다. 「어찌하여 전쟁이 우리에게 닥쳐오지도 않았는데 이 모든 백성을 무너뜨렸습니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 직역하면 ‘왜 전쟁이 우리에게 있지 않은데 이 모든 백성을 잘랐습니까?’에 가깝습니다. 한국어는 관용적으로 다듬었지만, 갑작스러운 짧은 의문문의 느낌은 유지했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίνα τί
  english_pob_choice: Why
  chosen_korean: 어찌하여
  alternatives_korean:
  - 왜
  - 무슨 이유로
  lexicon: LSJ
  rationale: 그리스어의 어색한 이중 의문형을 한국어에서는 자연스럽게 하나의 이유 질문으로 풀어, 본문의 뜻을 분명하게 했습니다.
- source_word: ἔκοψας
  english_pob_choice: have you cut down / have you cut off
  chosen_korean: 무너뜨렸습니까
  alternatives_korean:
  - 쳐서 쓰러뜨렸습니까
  - 도려내셨습니까
  - 베어 버렸습니까
  lexicon: LSJ
  rationale: κόπτω의 기본 이미지인 ‘치다/베다’와 전쟁 문맥에서의 ‘쓰러뜨리다’ 뉘앙스를 살리되, 한국어에서 사람을 대상으로 한 직설적 폭력 표현을 과도하게 단정하지 않도록 ‘무너뜨리다’로 옮겼습니다.
- source_word: πάντα τὸν λαὸν τοῦτον
  english_pob_choice: all this people
  chosen_korean: 이 모든 백성
  alternatives_korean:
  - 이 온 백성
  - 이 모든 사람들
  - 이 모든 민족
  lexicon: LSJ
  rationale: λαός는 특정 집단을 가리키는 ‘백성’이 자연스럽고, 단수+지시형의 결합을 한국어에서는 ‘이 모든 백성’으로 간결하게 살렸습니다.
- source_word: πολέμου μὴ ἐνεστῶτος ἡμῖν
  english_pob_choice: when no war is pressing upon us
  chosen_korean: 전쟁이 우리에게 닥쳐오지도 않았는데
  alternatives_korean:
  - 전쟁이 우리 앞에 있지도 않은데
  - 전쟁이 우리에게 임하지도 않았는데
  - 전쟁이 우리를 압박하지도 않았는데
  lexicon: LSJ
  rationale: ἐνεστῶτος는 ‘다가와 있는, 닥쳐 있는’의 현재적 압박을 뜻하므로, 전쟁이 아직 현실화되지 않았다는 점을 자연스러운 한국어 관용으로 표현했습니다.
theological_decisions:
- issue: 전쟁의 부재를 강조하는 질문의 어조
  chosen_reading: 본문은 단순한 정보 요청이 아니라, 전쟁이 임박하지 않은데 왜 백성에게 큰 피해를 주었는지 따지는 비난조 질문으로 읽었습니다.
  alternative_readings:
  - 중립적인 이유 질문
  - 전술적 상황 확인 질문
  rationale: 그리스어 문맥과 영어 POB의 'Why have you cut down all this people'는 책망의 뉘앙스를 강하게 띠므로, 한국어도 그 긴장감을 유지했습니다.
  doctrine_reference: 문맥 및 서사적 수사
- issue: 번역어 '백성'의 선택
  chosen_reading: λαός를 '백성'으로 옮겨 공동체 전체를 가리키는 집단성을 드러냈습니다.
  alternative_readings:
  - 군대
  - 사람들
  rationale: 이 구절은 단순 병력보다 공동체 전체를 가리키는 말로 읽히므로, 성서 한국어에서 자연스럽고도 집단적 의미를 유지하는 '백성'이 적절합니다.
  doctrine_reference: 어휘 의미론
