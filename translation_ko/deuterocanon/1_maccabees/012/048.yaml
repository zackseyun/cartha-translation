  yaml_path: translation/deuterocanon/1_maccabees/012/048.yaml
  text: But when Jonathan entered Ptolemais[a], the men of Ptolemais shut the gates and seized him, and they killed with the sword all who had come with him.
  footnotes:
  - marker: a
    text: Or, more literally, 'all those who had come together with him.' The context of entering the city supports 'come in with him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 요나단이 프톨레마이스에 들어가자, 프톨레마이스 사람들은 성문을 닫고 그를 붙잡았으며, 그와 함께 온 사람들 모두를 칼로 죽였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그와 함께 들어온 모든 사람들’. 원문은 ‘그와 함께 온 사람들’을 뜻하며, 앞의 입성 장면 때문에 함께 성 안으로 들어온 이들로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  english_pob_choice: But when
  chosen_korean: 그러나 …하자
  alternatives_korean:
  - 그리고 …하자
  - 그런데 …하자
  lexicon: LSJ
  rationale: 서사의 전환과 반전을 함께 나타내기 위해 ‘그러나’를 두고, 시간적 종속 관계는 ‘-하자’로 자연스럽게 옮겼습니다.
- source_word: Πτολεμαΐδα
  english_pob_choice: Ptolemais
  chosen_korean: 프톨레마이스
  alternatives_korean:
  - 프톨레마이다
  - 프톨레마이오스
  lexicon: 고유명사 외래어 표기
  rationale: 지명은 현대 한국어 외래어 표기법에 맞춰 음역했고, 도시명으로 읽히는 형태를 유지했습니다.
- source_word: ἀπέκλεισαν
  english_pob_choice: shut
  chosen_korean: 성문을 닫고
  alternatives_korean:
  - 문을 닫고
  - 성문을 걸어 잠그고
  lexicon: LSJ
  rationale: 공격적 봉쇄의 맥락을 살리면서도 과도한 해석은 피하기 위해 ‘성문을 닫고’로 옮겼습니다.
- source_word: συνέλαβον
  english_pob_choice: seized
  chosen_korean: 붙잡았으며
  alternatives_korean:
  - 사로잡았으며
  - 체포했으며
  lexicon: LSJ
  rationale: 즉각적이고 배신적인 억류를 나타내므로 법적 뉘앙스가 강한 ‘체포’보다 ‘붙잡다’를 선택했습니다.
- source_word: πάντας τοὺς συνελθόντας μετʼ αὐτοῦ
  english_pob_choice: all who had come with him
  chosen_korean: 그와 함께 들어온 사람들 모두를
  alternatives_korean:
  - 그와 함께 온 사람들 모두를
  - 그와 함께 모여온 사람들 모두를
  lexicon: LSJ
  rationale: 문맥상 도시 안으로 함께 들어온 무리를 가리키므로, POB의 의미를 따라 ‘들어온’으로 구체화했습니다.
- source_word: ἐν ῥομφαίᾳ
  english_pob_choice: with the sword
  chosen_korean: 칼로
  alternatives_korean:
  - 검으로
  - 칼날로
  lexicon: LSJ
  rationale: 그리스어 관용적 살해 표현을 한국어로 간결하게 옮겨, 도구를 통한 살해 행위를 분명히 했습니다.
