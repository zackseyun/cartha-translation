lexical_decisions:
- source_word: ἐπέστρεψεν
  english_pob_choice: returned
  chosen_korean: 돌아왔습니다
  alternatives_korean:
  - 되돌아왔습니다
  - 다시 왔습니다
  lexicon: LSJ
  rationale: 물리적으로 이전 장소로 돌아오는 동작이므로, 회개를 뜻할 수 있는 다른 의미를 배제하고 자연스러운 서술형 ‘돌아왔습니다’로 옮겼습니다.
- source_word: ἐξεκκλησίασεν
  english_pob_choice: assembled
  chosen_korean: 불러 모으고
  alternatives_korean:
  - 소집하고
  - 회집시켜
  lexicon: LSJ
  rationale: 장로들을 공적 목적을 위해 모으는 뜻이므로, 다소 행정적인 ‘소집하다’보다 서술이 매끄러운 ‘불러 모으다’를 택했습니다.
- source_word: πρεσβυτέρους
  english_pob_choice: elders
  chosen_korean: 장로들
  alternatives_korean:
  - 나이 많은 사람들
  - 어른들
  lexicon: LSJ
  rationale: 단순한 연장자가 아니라 공동체의 공적 지도자들을 가리키므로, 표준적인 공동체 직함인 ‘장로들’이 적절합니다.
- source_word: ἐβουλεύσατο μετ’ αὐτῶν
  english_pob_choice: he took counsel with them
  chosen_korean: 그들과 함께 의논했습니다
  alternatives_korean:
  - 그들과 상의했습니다
  - 그들과 자문했습니다
  lexicon: LSJ
  rationale: 중간태의 협의·숙의 뉘앙스를 살리되 현대 한국어에서 자연스럽고 공적 맥락에 맞는 표현으로 처리했습니다.
- source_word: ὀχυρώματα
  english_pob_choice: fortresses
  chosen_korean: 요새들
  alternatives_korean:
  - 성채들
  - 성곽들
  - 방어시설들
  lexicon: LSJ
  rationale: 실제 방어용 축성물을 가리키므로, 개별 거점의 이미지를 주는 ‘요새들’이 가장 직접적입니다.
