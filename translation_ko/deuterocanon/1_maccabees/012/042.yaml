  text: And Tryphon saw that he had come with a large force[a], and he was afraid to stretch out his hands against him.
  footnotes:
  - marker: a
    text: Or, 'to lay hands on him.' The Greek idiom 'stretch out his hands against him' can denote hostile action more generally.
    reason: lexical_alternative
translation:
  language: ko
  text: 트뤼폰은 그가 많은 병력을 거느리고 온 것을 보고, 그에게 손을 대려고 하는 것을 두려워했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “그에게 손을 뻗다”이지만, 그리스어 관용구로서 적대적 행동 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
