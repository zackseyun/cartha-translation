base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/010.yaml
  text: We have tried to renew the brotherhood and friendship with you by sending word[a], so that we might not become estranged from you; for many times have passed since you sent to us.
  footnotes:
  - marker: a
    text: Or 'for many periods have passed'; the Greek καιροί refers broadly to intervals or appointed times, not necessarily literal seasons.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 여러분과의 형제 관계와 우정을 새롭게 하려고 전갈을 보내려 했습니다. 이는 여러분과 소원해지지 않기 위해서입니다. 여러분이 우리에게 보낸 뒤로 여러 시기[a]가 지났기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘여러 시기’는 그리스어 καιροί의 넓은 뜻을 반영한 것으로, 특정한 계절만이 아니라 경과한 기간이나 때들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειράθημεν
  english_pob_choice: We have tried
  chosen_korean: 우리는 … 하려고 했습니다
  alternatives_korean:
  - 우리는 … 하려고 노력했습니다
  - 우리는 … 하려 했습니다
  lexicon: LSJ
  rationale: 시도·노력을 나타내므로, 완료된 성과보다 의도와 시도를 드러내는 ‘하려고 했습니다’로 자연스럽게 옮겼습니다.
- source_word: ἀποστεῖλαι
  english_pob_choice: to send word
  chosen_korean: 편지를 보내려
  alternatives_korean:
  - 말을 전하려
  - 소식을 보내려
  lexicon: LSJ
  rationale: 원문은 ‘보내다’이지만, 앞뒤가 외교적 소통 맥락이므로 한국어에서는 구체적이고 자연스러운 ‘편지를 보내다’로 옮겼습니다.
- source_word: τὴν πρὸς ὑμᾶς ἀδελφότητα καὶ φιλίαν
  english_pob_choice: the brotherhood and friendship with you
  chosen_korean: 여러분과의 형제 관계와 우정
  alternatives_korean:
  - 여러분과의 형제됨과 우정
  - 여러분과의 형제애와 우정
  lexicon: LSJ
  rationale: ἀδελφότης와 φιλία의 관계적·외교적 뉘앙스를 살려 ‘형제 관계와 우정’으로 옮겼습니다.
- source_word: πρὸς τὸ μὴ ἐξαλλοτριωθῆναι ὑμῶν
  english_pob_choice: so that we might not become estranged from you
  chosen_korean: 여러분에게서 멀어지지 않기 위해서입니다
  alternatives_korean:
  - 여러분에게서 소원해지지 않기 위해서입니다
  - 여러분과 낯설어지지 않기 위해서입니다
  lexicon: LSJ
  rationale: ἐξαλλοτριωθῆναι의 ‘소외되다/멀어지다’ 의미를 관계적 거리감으로 옮겨, 자연스러운 현대 한국어 표현을 택했습니다.
- source_word: πολλοὶ γὰρ καιροὶ διῆλθον
  english_pob_choice: for many seasons have passed
  chosen_korean: 이미 여러 때가 지났기 때문입니다
  alternatives_korean:
  - 이미 많은 시기가 지났기 때문입니다
  - 오랜 시간이 지났기 때문입니다
  lexicon: LSJ
  rationale: καιροί의 폭넓은 ‘시기/때’ 의미를 반영해 literal한 ‘계절’보다, 본문이 말하는 경과한 기간을 자연스럽게 드러내는 ‘여러 때’로 옮겼습니다.
- source_word: ἀφʼ οὗ ἀπεστείλατε πρὸς ἡμᾶς
  english_pob_choice: since you sent to us
  chosen_korean: 여러분이 우리에게 사람을 보낸 지
  alternatives_korean:
  - 여러분이 우리에게 보낸 지
  - 여러분이 우리에게 소식을 보낸 지
  lexicon: LSJ
  rationale: 원문은 목적어를 생략하고 있으므로, 한국어에서는 관계 회복을 요청하는 왕래 맥락에 맞게 ‘사람을 보냈다’로 최소한만 보충했습니다.
theological_decisions:
- issue: 형제 관계와 우정의 외교적·공동체적 의미
  chosen_reading: 본문의 ἀδελφότητα/φιλία를 신앙 공동체 용어로 과도하게 신학화하지 않고, 정치·외교 문맥이 드러나는 관계 표현으로 유지했습니다.
  alternative_readings:
  - 형제애와 우정
  - 형제됨과 우정
  rationale: 마카베오서는 동맹 갱신의 문맥이 강하므로, 교회적 어휘로 덮지 않고 본문이 말하는 관계의 복원 의도를 드러내는 것이 적절합니다.
  doctrine_reference: 문맥 우선 원칙; 외교적 조약 갱신 문맥
- issue: ἐξαλλοτριωθῆναι의 소원·분리 감각
  chosen_reading: ‘멀어지지 않기 위해서’로 옮겨 관계의 단절 위험을 강조했습니다.
  alternative_readings:
  - 소원해지지 않기 위해서
  - 소외되지 않기 위해서
  rationale: 원문의 목적절은 단순 정보가 아니라 관계 단절을 피하려는 의도를 말하므로, 독자가 즉시 이해할 수 있는 거리감 표현을 선택했습니다.
  doctrine_reference: 문맥상의 목적절 해석
