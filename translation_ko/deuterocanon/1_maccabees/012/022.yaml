  lexicon: BDAG
  rationale: 원문의 인과·시간 결합을 살리되, 한국어에서는 원인 제시가 분명한 「-았으니」로 자연스럽게 옮겼습니다.
- source_word: καλῶς ποιήσετε γράφοντες ἡμῖν
  english_pob_choice: you will do well to write to us
  chosen_korean: 우리에게 편지를 써 주시면 좋겠습니다
  alternatives_korean:
  - 우리에게 써 주시면 좋겠습니다
  - 우리에게 편지를 쓰는 것이 좋겠습니다
  lexicon: LSJ
  rationale: 서간체의 권고 표현을 직역보다 자연스러운 공손 요청으로 살리되, 본문의 권면 기능은 유지했습니다.
- source_word: περὶ τῆς εἰρήνης ὑμῶν
  english_pob_choice: concerning your peace
  chosen_korean: 여러분의 평강에 관하여
  alternatives_korean:
  - 여러분의 평안에 관하여
  - 여러분의 안녕에 관하여
  lexicon: LSJ
  rationale: εἰρήνη의 기본값을 「평강」으로 두어 POB 용례를 따르면서, 관계·안정 상태를 함께 가리키는 외교적 뉘앙스를 반영했습니다.
theological_decisions:
- issue: εἰρήνη의 범위
  chosen_reading: 여기서는 단순한 전쟁 부재뿐 아니라 상대의 안녕·평정 상태까지 아우르는 「평강」으로 번역했습니다.
  alternative_readings:
  - 평안
  - 안녕
  - 평화
  rationale: 문맥상 상호 안부를 묻는 서신 표현이므로, 한국어 「평강」이 원문의 의미 범위를 가장 균형 있게 드러냅니다.
