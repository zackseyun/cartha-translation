translation:
  language: ko
  text: 그리고 이제 우리가 이 일을 알게 되었으니, 여러분이 여러분의 평안에 관하여 우리에게 편지를 써 주시면 좋겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분의 안녕에 관하여’ 또는 ‘여러분의 평화에 관하여’. 헬라어 ‘평안’은 평화뿐 아니라 안녕이나 잘됨을 뜻할 수도 있습니다.
    reason: lexical_alternative
