    text: 또는 ‘여러분의 안녕에 관하여’. 헬라어 ‘평강’은 ‘잘됨’이나 ‘복지’의 뜻도 지닐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 이제는
  lexicon: LSJ
  rationale: 문맥을 이어 주는 전환 표현으로, 현대 한국어에서는 간결한 「이제」가 가장 자연스럽습니다.
- source_word: ἀφʼ οὗ ἔγνωμεν ταῦτα
  english_pob_choice: since we have learned these things
  chosen_korean: 우리가 이것들을 알았으니
  alternatives_korean:
