  text: And Jonathan turned aside against the Arabs called the Zabadeans, and struck them, and took their spoils.
translation:
  language: ko
  text: 요나단은 자바대인이라 불리는 아라비아 사람들을 향해 방향을 돌려 그들을 쳤고, 그들의 전리품을 차지했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξέκλινεν
  english_pob_choice: turned aside against
  chosen_korean: 방향을 돌려
  alternatives_korean:
  - 돌아서서 공격했고
  - 우회하여 공격했고
  - 돌아섰습니다
  lexicon: LSJ
  rationale: 전쟁 서술에서 단순한 이동이 아니라 목표를 바꾸어 공격하러 가는 뉘앙스를 살리기 위해 ‘방향을 돌려’로 옮겼습니다.
- source_word: Ἀράβας
  english_pob_choice: Arabs
  chosen_korean: 아라비아 사람들
  alternatives_korean:
  - 아랍 사람들
  - 아라비아인들
  lexicon: LSJ
  rationale: 그리스어가 가리키는 민족/집단명을 현대 한국어로 자연스럽게 풀어 옮기되, ‘아랍’이라는 후대 지명·종교 연상을 과도하게 불러오지 않도록 했습니다.
- source_word: τοὺς καλουμένους Ζαβαδαίους
  english_pob_choice: called the Zabadeans
  chosen_korean: 자바대인이라 불리는
  alternatives_korean:
  - 자바대인으로 불리는
  - 자바대 사람이라 불리는
  lexicon: LSJ
  rationale: ‘called’의 수동 분사 구조를 그대로 반영해 별칭/집단명을 표시했고, Ζαβαδαίους는 음역을 유지했습니다.
- source_word: σκῦλα
  english_pob_choice: spoils
  chosen_korean: 전리품
  alternatives_korean:
  - 노획물
  - 약탈물
  - 노획한 물품
  lexicon: LSJ
  rationale: 전쟁에서 빼앗은 물건이라는 의미를 가장 직접적으로 드러내는 표준어로 옮겼습니다.
theological_decisions:
- issue: 전쟁 서술의 동사 강도
  chosen_reading: ‘쳤고’로 단순한 타격보다 군사적 공격의 결과를 드러내면서도 원문의 직접성을 유지했습니다.
  alternative_readings:
  - ‘때렸고’
  - ‘무찔렀고’
  rationale: ἐπάταξεν은 기본적으로 ‘치다/타격하다’의 의미이므로, 과도한 승전 해석인 ‘무찔렀다’보다 직접적인 표현을 택했습니다.
  doctrine_reference: 역사 서술의 문맥 충실성
- issue: 민족명 표기
  chosen_reading: ‘아라비아 사람들’로 현대 한국어 독자의 이해 가능성을 확보했습니다.
  alternative_readings:
  - ‘아랍 사람들’
  - ‘아라비아인들’
  rationale: 원문의 민족 집단 표지를 유지하되, 후대의 종교·정치적 함의를 불필요하게 덧씌우지 않도록 했습니다.
  doctrine_reference: 역사-문맥상 민족 표지 유지
