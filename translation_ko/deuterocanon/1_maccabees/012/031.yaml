revisions:
- from: 그때 요나단은 아라비아 사람들 가운데서 자바대인이라 불리는 이들에게로 방향을 돌려 그들을 쳤고, 그들의 전리품을 빼앗았습니다.
  to: 요나단은 자바대인이라 불리는 아라비아 사람들을 향해 방향을 돌려 그들을 쳤고, 그들의 전리품을 차지했습니다.
  rationale: 시간 부사 ‘그때’를 제거하여 원문의 접속 수준을 보존하고, ἐξέκλινεν ἐπί의 방향 및 군사적 대립을 ‘~을 향해 방향을 돌려’로 명료하게 옮겼습니다. 고유명과 전쟁 서술의 직접성은 유지했으며, 문장을 현대 합쇼체로 자연스럽게 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:46:17Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 καὶ는 단순 접속이며, 초안의 ‘그때’는 본절 자체에 없는 시간 지시를 더합니다. 또한 ἐξέκλινεν ἐπί의 ‘~을 향해/대항하여 방향을 돌리다’라는 방향성과 적대 관계를 더 분명히 드러내는 편이 좋습니다. ἐπάταξεν의 직접적인 ‘치다’와 τὰ σκῦλα αὐτῶν의 ‘그들의 전리품’은 유지할 수 있습니다.
  naturalness: ‘아라비아 사람들 가운데서 자바대인이라 불리는 이들에게로’는 수식 범위와 이동 방향이 다소 무겁고 어색합니다. ‘자바대인이라 불리는 아라비아 사람들을 향해’가 현대 표준 한국어 문장으로 더 자연스럽습니다.
  terminology: ‘아라비아 사람들’, ‘자바대인’, ‘전리품’은 원문의 민족 집단명, 음역 민족명, 전쟁 노획물의 의미를 무리 없이 전달합니다. ‘빼앗았습니다’도 가능하지만, σκῦλα가 이미 전쟁에서 얻은 물품을 가리키므로 ‘차지했습니다’가 불필요한 뉘앙스 없이 더 중립적입니다.
  issues:
  - severity: low
    issue: ‘그때’가 원문에 없는 시간 지시를 추가함
    rationale: καὶ는 ‘그리고/또’의 접속사일 뿐, 본절만으로 특정한 시간 지시를 명시하지 않습니다.
  - severity: low
    issue: ἐξέκλινεν ἐπί의 적대적 방향성이 약하게 표현됨
    rationale: ‘이들에게로 방향을 돌려’보다 ‘~을 향해 방향을 돌려’가 원문의 ‘turned aside against’를 더 명확히 반영합니다.
  - severity: low
    issue: 문장 수식 구조가 다소 부자연스러움
    rationale: 민족명과 호칭을 먼저 결합해 ‘자바대인이라 불리는 아라비아 사람들’로 두면 수식 관계가 분명해집니다.
  revised_text: 요나단은 자바대인이라 불리는 아라비아 사람들을 향해 방향을 돌려 그들을 쳤고, 그들의 전리품을 차지했습니다.
