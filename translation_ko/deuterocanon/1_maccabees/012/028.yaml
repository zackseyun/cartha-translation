  yaml_path: translation/deuterocanon/1_maccabees/012/028.yaml
  text: And when the adversaries heard that Jonathan and those with him were prepared for war[a], they were afraid and lost heart, and they lit fires in their camp.
  footnotes:
  - marker: a
    text: Literally, 'they fixed/froze their heart,' an idiom expressing discouragement or loss of courage.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 대적들이 요나단과 그와 함께한 사람들이 전쟁을 위해 준비되었다는 소식을 듣고, 두려워하여 마음이 굳어졌으며, 자기 진영에 불을 피웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들의 마음을 굳게/얼게 했다’는 뜻으로, 두려움으로 기운을 잃고 위축되었다는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ὑπεναντίοι
  english_pob_choice: the adversaries
  chosen_korean: 대적들
  alternatives_korean:
  - 적들
  - 대항하는 자들
  lexicon: LSJ
  rationale: 상대편에 서서 맞서는 집단이라는 대립적 의미를 살리되, 지나치게 감정적이거나 설명적인 표현은 피했습니다.
- source_word: ἔπηξαν τὴν καρδίαν αὐτῶν
  english_pob_choice: lost heart
  chosen_korean: 마음이 굳어졌으며
  alternatives_korean:
  - 마음이 얼어붙었으며
  - 낙심했으며
  lexicon: LSJ
  rationale: 직역하면 마음이 ‘굳어/얼어’ 두려움으로 무뎌지는 이미지이므로, 관용적 의미인 낙심을 너무 앞세우지 않고 원문의 비유를 살렸습니다.
- source_word: ἀνέκαυσαν πυρὰς
  english_pob_choice: they lit fires
  chosen_korean: 불을 피웠습니다
  alternatives_korean:
  - 불을 지폈습니다
  - 모닥불을 피웠습니다
  lexicon: LSJ
  rationale: 군사 진영 맥락에서 단순히 불을 ‘켰다’보다 ‘피우다’가 원문 동작과 더 가깝고 자연스럽습니다.
- source_word: ἐν τῇ παρεμβολῇ αὐτῶν
  english_pob_choice: in their camp
  chosen_korean: 자기 진영에
  alternatives_korean:
  - 그들의 진영에
  - 그들의 캠프에
  lexicon: LSJ
  rationale: παρεμβολή는 군사적 ‘진영/진중’을 뜻하므로, 현대 한국어에서 가장 자연스럽고 문맥에 맞는 ‘진영’으로 옮겼습니다.
theological_decisions:
- issue: 마음이 굳어졌다는 표현의 이미지와 의미를 어떻게 살릴 것인가
  chosen_reading: 두려움으로 인한 내적 동요와 기력 상실을, 직역적 이미지인 ‘마음이 굳어지다’로 보존했습니다.
  alternative_readings:
  - 낙심했습니다
  - 겁을 먹었습니다
  rationale: 원문은 단순한 감정 묘사가 아니라 두려움이 심장을 굳게 만드는 강한 관용구이므로, 의미와 이미지를 함께 드러내는 쪽을 택했습니다.
  doctrine_reference: 서사적 묘사이며 교리 쟁점은 없음
