  source_fidelity: 그리스어의 사건 순서와 주요 어휘는 대체로 반영되었습니다. 그러나 ἔπηξαν τὴν καρδίαν αὐτῶν은 문맥상 두려움으로 낙심하거나 용기를 잃은 것을 뜻하는 관용 표현인데, 본문의 ‘마음이 굳어졌으며’는 한국어에서 오히려 결의를 굳히거나 용기를 낸 뜻으로 읽힐 수 있어 의미가 불명확합니다.
  naturalness: ‘요나단과 그와 함께한 사람들이 전쟁을 위해 준비되었다’보다 ‘요나단과 그와 함께 있던 이들이 전쟁할 준비를 갖추었다’가 현대 표준 한국어로 더 자연스럽습니다. ‘낙심했으며’는 문맥과 연결도 명료합니다.
