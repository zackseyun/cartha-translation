  yaml_path: translation/deuterocanon/1_maccabees/012/043.yaml
  text: And he received him honorably[a], introduced him to all his friends, gave him gifts[b], and commanded his friends and his forces likewise to obey him.
  footnotes:
  - marker: a
    text: Or 'presented him to all his friends.' The Greek verb can denote introducing or presenting someone publicly.
    reason: lexical_alternative
  - marker: b
    text: '''Friends'' may carry a courtly-political sense in a Hellenistic royal setting, referring to members of the king''s circle rather than merely personal companions.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그는 그를 크게 예우하며 맞이했고, 자기의 모든 친구들[b]에게 그를 소개했으며[a], 그에게 선물을 주고, 또 자기의 친구들과 군대에게도 마찬가지로 그에게 순종하라고 명령했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그는 그를 모든 친구들에게 소개했거나, 모든 친구들 앞에 내보였다는 뜻일 수 있습니다. 그리스어 동사는 사람을 공개적으로 소개하거나 제시하는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘친구들’은 헬레니즘 왕실에서 단순한 사적 친구가 아니라 왕의 측근 집단을 가리킬 수 있습니다.
    reason: cultural_note
