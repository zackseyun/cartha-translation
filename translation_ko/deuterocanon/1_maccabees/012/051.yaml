lexical_decisions:
- source_word: οἱ διώκοντες
  english_pob_choice: the pursuers
  chosen_korean: 추격하던 자들
  alternatives_korean:
  - 쫓던 자들
  - 추적하던 자들
  lexicon: LSJ
  rationale: 현재분사 άρθρο+분사구는 추격 중인 집단을 가리키므로, 군사적·서사적 뉘앙스를 살려 ‘추격하던 자들’로 옮겼습니다.
- source_word: ὅτι περὶ ψυχῆς ἐστιν αὐτοῖς
  english_pob_choice: that it was a matter of life for them
  chosen_korean: 자기들에게 생명이 달린 일임을
  alternatives_korean:
  - 자기들의 생사가 걸린 일임을
  - 자기들의 목숨이 위태로운 일임을
  lexicon: LSJ
  rationale: περὶ ψυχῆς는 문자적으로는 ‘생명/혼에 관하여’이지만, 여기서는 목숨이 위태로운 상황을 뜻하므로 ‘생명이 달린 일’로 자연스럽게 살렸습니다.
- source_word: ψυχῆς
  english_pob_choice: life
  chosen_korean: 생명
  alternatives_korean:
  - 목숨
  - 혼
  lexicon: LSJ
  rationale: 이 관용구에서는 비물질적 ‘혼’이 아니라 육체적 생명이 뜻이므로, 문맥에 맞는 ‘생명’을 선택했습니다.
- source_word: ἐπέστρεψαν
  english_pob_choice: they turned back
  chosen_korean: 물러갔습니다
  alternatives_korean:
  - 되돌아갔습니다
  - 돌아서 갔습니다
  lexicon: LSJ
  rationale: 추격 맥락에서 단순한 귀환보다 진로를 바꾸어 후퇴하는 의미가 강하므로, 서사에 자연스러운 ‘물러갔습니다’로 옮겼습니다.
