lexical_decisions:
- source_word: ἐπολέμησαν
  english_pob_choice: fought against
  chosen_korean: 싸웠습니다
  alternatives_korean:
  - 전쟁을 일으켰습니다
  - 우리에게 전쟁을 걸었습니다
  lexicon: BDAG
  rationale: πολεμέω의 핵심 의미는 전쟁을 벌이거나 적대적으로 싸우는 것이므로, 간결한 동사 '싸우다'로 옮겨 적대행위를 자연스럽게 드러냈습니다.
- source_word: οἱ βασιλεῖς
  english_pob_choice: the kings
  chosen_korean: 왕들이
  alternatives_korean:
  - 그 왕들이
  - 주변의 왕들이
  lexicon: BDAG
  rationale: 정관사와 복수형이 가리키는 주변의 특정한 통치자들을 한국어에서는 자연스럽게 복수 주어 '왕들'로 옮겼습니다.
- source_word: οἱ κύκλῳ ἡμῶν
  english_pob_choice: around us
  chosen_korean: 우리 주변의
  alternatives_korean:
  - 우리 둘레의
  - 우리 사방의
  - 우리를 둘러싼
  lexicon: BDAG
  rationale: κύκλῳ ἡμῶν은 지리적으로 둘러싼 위치를 뜻하므로, 문맥에 맞는 현대 한국어 표현 '우리 주변의'를 선택했습니다.
theological_decisions:
- issue: 전쟁 행위의 강도 표현
  chosen_reading: 단순한 '싸움'보다 적대적 군사행동을 암시하는 문맥을 유지하되, 한국어 본문은 과도하게 장황하게 확장하지 않았습니다.
  alternative_readings:
  - 전쟁을 일으켰습니다
  - 우리를 상대로 전쟁을 벌였습니다
  rationale: 그리스어 aorist πολεμέω는 단순 충돌이 아니라 전쟁 수행까지 포함할 수 있지만, 본 절은 서술이 짧아 핵심 의미를 간결하게 보존하는 것이 적절합니다.
