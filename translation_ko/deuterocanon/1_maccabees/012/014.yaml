  yaml_path: translation/deuterocanon/1_maccabees/012/014.yaml
  text: We have tried to send to you and renew the brotherhood and friendship[a], so that we might not become estranged from you; for many years have passed since you sent to us.
  footnotes:
  - marker: a
    text: Or 'for many periods have passed' or 'for a long time has passed.' The Greek uses the plural καιροί, literally 'times' or 'seasons.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 여러분에게 형제애와 우정을 전하고 이를 새롭게 하려고 애썼습니다. 이는 여러분과 소원해지지 않기 위해서입니다. 여러분이 우리에게 보낸 지 오랜 세월이 지났기 때문입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘많은 기간이 지났다’ 또는 ‘오랜 시간이 지났다’로 옮길 수 있습니다. 그리스어 καιροί는 문자적으로 ‘때들’ 또는 ‘계절들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειράθημεν
  english_pob_choice: We have tried
  chosen_korean: 우리는 … 하려 했습니다
  alternatives_korean:
  - 우리는 … 하려고 시도했습니다
  - 우리는 … 하려 애썼습니다
  lexicon: LSJ
  rationale: 과거의 시도와 의도를 자연스럽게 드러내면서도, 성공 여부를 본문에 없는 방식으로 단정하지 않도록 했습니다.
- source_word: ἀδελφότητα καὶ φιλίαν
  english_pob_choice: the brotherhood and friendship
  chosen_korean: 형제애와 우정
  alternatives_korean:
  - 형제 관계와 우정
  - 형제됨과 우정
  lexicon: LSJ
  rationale: ἀδελφότης와 φιλία의 관계적 의미를 살리되, 한국어에서 공문·서신체로도 자연스러운 두 명사로 옮겼습니다.
- source_word: ἀνανεώσασθαι
  english_pob_choice: renew
  chosen_korean: 새롭게 하다
  alternatives_korean:
  - 갱신하다
  - 회복하다
  lexicon: LSJ
  rationale: 관계의 재개·갱신을 뜻하는 동작을 현대 한국어로 직접적으로 표현했습니다.
- source_word: πρὸς τὸ μὴ ἐξαλλοτριωθῆναι ὑμῶν
  english_pob_choice: so that we might not become estranged from you
  chosen_korean: 여러분과 멀어지지 않으려
  alternatives_korean:
  - 여러분에게서 소원해지지 않으려
  - 여러분과 소외되지 않으려
  lexicon: LSJ
  rationale: ἐξαλλοτριωθῆναι의 ‘소원해지다/멀어지다’ 의미를 살려 관계적 거리감을 간결하게 옮겼습니다.
- source_word: πολλοὶ γὰρ καιροὶ διῆλθον
  english_pob_choice: for many years have passed
  chosen_korean: 오랜 세월이 지났기 때문입니다
  alternatives_korean:
  - 여러 때가 흘렀기 때문입니다
  - 많은 시기가 지났기 때문입니다
  lexicon: LSJ
  rationale: καιροί의 복수성을 너무 납작하게 만들지 않으면서도, 이 역사적 서신 문맥에서는 한국어의 자연스러운 집합 표현인 ‘오랜 세월’이 가장 적합합니다.
theological_decisions:
- issue: 관계 복원 언어의 톤
  chosen_reading: 서신의 외교적·형제적 관계 복원을 ‘형제애와 우정을 새롭게 하려 했다’로 직설적으로 표현했습니다.
  alternative_readings:
  - 관계를 회복하려 했다
  - 형제관계와 친선을 갱신하려 했다
  rationale: 본문은 단순한 감정이 아니라 공동체/정치적 관계의 재확인을 말하므로, 완곡하게 약화시키지 않고 관계적 언어를 유지했습니다.
  doctrine_reference: 문맥 주도 번역 원칙
- issue: πρὸς ὑμᾶς의 관계 방향
  chosen_reading: ‘여러분과 멀어지지 않으려’로 옮겨, 관계가 ‘여러분을 향한’ 방향성을 분명히 했습니다.
  alternative_readings:
  - 여러분에게서 멀어지지 않으려
  - 여러분 쪽으로부터 소원해지지 않으려
  rationale: πρὸς ὑμᾶς는 단순히 대상 지시가 아니라 관계 지향을 담으므로, 한국어에서도 그 방향성을 드러내는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 문법-의미 대응 원칙
