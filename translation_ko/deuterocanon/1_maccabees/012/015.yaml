  - 동포들
  rationale: 원문은 남성 복수의 친족/동맹 공동체 지칭이며, 여기서는 문맥상 정치·종교적 연대 관계를 가리키므로 성중립 확장 없이 ‘형제들’로 두었습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
