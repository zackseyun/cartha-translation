    text: ‘절기들’은 종교적 축제나 잔치를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘정해진 날들’은 지켜야 하거나 규정된 관행의 날들을 가리킵니다.
    reason: cultural_note
