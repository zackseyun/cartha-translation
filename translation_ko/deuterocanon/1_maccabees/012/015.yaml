  to: 그러므로 우리는 모든 때에 끊임없이, 곧 절기들[a]과 그 밖의 정해진 날들[b]에 제사를 드리고 기도할 때 여러분을 기억합니다. 형제들을 기억하는 것은 마땅하고도 합당한 일이기 때문입니다.
  rationale: 원문의 시간·예배 상황(‘절기들과 그 밖의 정해진 날들에, 제사를 드리고 기도할 때’)을 ‘여러분을 기억합니다’에 직접 연결했습니다. 마지막 문장은 원문의 δέον/πρέπον의 정당화 의미를 한국어의 자연스러운 인과 표현으로 살리되, 기억의 대상인 ‘형제들’이 앞의 ‘여러분’을 가리키는 문맥을 유지했습니다. 각주 표지는 해당 어휘 바로 뒤에 배치했습니다.
