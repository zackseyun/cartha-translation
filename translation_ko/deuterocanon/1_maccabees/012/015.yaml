base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/015.yaml
  text: Therefore we continually remember you at all times[a], at the festivals and on the other appointed days, when we offer sacrifices and in our prayers[b], as it is right and fitting to remember brothers.
  footnotes:
  - marker: a
    text: Or "feasts" for "festivals."
    reason: lexical_alternative
  - marker: b
    text: '"Appointed days" renders a phrase meaning the other days that are due or prescribed for observance.'
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 우리는 모든 때에, 곧 축제들과 그 밖의 지정된 날들에 여러분을 끊임없이 기억합니다. 그때 우리는 제사를 드리고 기도드리면서 형제들을 기억하는 것이 마땅하고도 적절하기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘축제들’은 종교적 절기/잔치를 포괄하는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘지정된 날들’은 지켜야 하거나 규정된 관행의 날들을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἀδιαλείπτως
  english_pob_choice: continually
  chosen_korean: 끊임없이
  alternatives_korean:
  - 늘
  - 쉬지 않고
  lexicon: LSJ
  rationale: 반복되는 예배적 기억의 지속성을 자연스럽게 살리면서도, 문자적으로 ‘한순간도 멈추지 않음’까지 과장하지 않기 위해 ‘끊임없이’를 택했습니다.
- source_word: ἑορταῖς
  english_pob_choice: festivals
  chosen_korean: 축제들
  alternatives_korean:
  - 절기들
  - 명절들
  lexicon: LSJ
  rationale: 종교 달력의 기념일을 가리키는 일반적 의미를 살리되, 현대 한국어에서 알아듣기 쉬운 표현으로 옮겼습니다.
- source_word: καθηκούσαις ἡμέραις
  english_pob_choice: appointed days
  chosen_korean: 지정된 날들
  alternatives_korean:
  - 마땅한 날들
  - 정해진 날들
  - 지켜야 할 날들
  lexicon: LSJ
  rationale: ‘도래하여 마땅한/규정된’ 날이라는 뜻을 한국어에서 가장 직접적으로 드러내는 표현으로, 관습적·규정적 달력의 의미를 유지했습니다.
- source_word: ἐφʼ ὧν
  english_pob_choice: when
  chosen_korean: 그때
  alternatives_korean:
  - 그 기간에
  - 그때마다
  lexicon: LSJ
  rationale: 제사와 기도가 이루어지는 시점을 앞의 절기·지정일과 자연스럽게 연결하는 시간적 관계를 살렸습니다.
- source_word: μνημονεύειν ἀδελφῶν
  english_pob_choice: to remember brothers
  chosen_korean: 형제들을 기억하는 것
  alternatives_korean:
  - 형제들을 생각하는 것
  - 형제들을 상기하는 것
  lexicon: LSJ
  rationale: 단순한 회상이 아니라 언약적·공동체적 기억이라는 뉘앙스를 살리면서도, 문맥상 남성 복수의 친족/동포 지칭을 그대로 반영했습니다.
theological_decisions:
- issue: ἀδελφῶν의 호칭과 성별 포함 여부
  chosen_reading: 형제들
  alternative_readings:
