  text: 그러므로 우리는 모든 때에 끊임없이, 곧 절기들[a]과 그 밖의 정해진 날들[b]에 제사를 드리고 기도할 때 여러분을 기억합니다. 형제들을 기억하는 것은 마땅하고도 합당한 일이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
