lexical_decisions:
- source_word: ἀναζεύξας
  english_pob_choice: after breaking camp
  chosen_korean: 진을 거둔 뒤
  alternatives_korean:
  - 출발한 뒤
  - 길을 떠난 뒤
  - 진군을 멈추고
  lexicon: LSJ
  rationale: 군사적 이동의 뉘앙스를 살리기 위해 단순한 ‘출발’보다 ‘진을 거두다’가 더 가깝습니다.
- source_word: ἦλθεν εἰς Δαμασκόν
  english_pob_choice: he came to Damascus
  chosen_korean: 다마스쿠스에 이르러
  alternatives_korean:
  - 다마스쿠스에 가서
  - 다마스쿠스에 도착하여
  lexicon: BDAG
  rationale: ‘이르다’는 목적지 도달을 자연스럽게 나타내며, 본문의 진행문맥과도 잘 맞습니다.
- source_word: διώδευσεν
  english_pob_choice: traveled through
  chosen_korean: 두루 다녔습니다
  alternatives_korean:
  - 지나갔습니다
  - 통과했습니다
  - 여행했습니다
  lexicon: LSJ
  rationale: 영역을 가로질러 이동하는 동작을 살리기 위해 단순 통과보다 ‘두루 다니다’가 한국어로 더 생동감 있습니다.
- source_word: ἐν πάσῃ τῇ χώρᾳ
  english_pob_choice: through the whole region
  chosen_korean: 온 지역
  alternatives_korean:
  - 온 땅
  - 전체 지역
  - 그 온 땅
  lexicon: BDAG
  rationale: χώρα는 현대 국가보다 넓은 ‘지역/영토’가 자연스럽기 때문에, ‘온 지역’으로 옮겨 지리적 범위를 과장하지 않았습니다.
