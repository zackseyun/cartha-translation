  lexicon: LSJ
  rationale: 군사적 이동의 뉘앙스를 살리기 위해 단순한 ‘출발’보다 ‘진을 거두다’가 더 가깝습니다.
- source_word: ἦλθεν εἰς Δαμασκόν
  english_pob_choice: he came to Damascus
  chosen_korean: 다마스쿠스에 이르러
