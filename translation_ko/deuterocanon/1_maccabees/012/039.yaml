base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/039.yaml
  text: And Tryphon sought to rule over Asia[a], to put on the crown[b], and to lay hands on Antiochus the king.
  footnotes:
  - marker: a
    text: “Asia” here refers to the Hellenistic kingdom in view, not the modern continent.
    reason: cultural_note
  - marker: b
    text: Or “to attack Antiochus the king”; literally, “to stretch out hands against Antiochus the king.”
    reason: lexical_alternative
translation:
  language: ko
  text: 트리폰은 아시아[a]를 다스리고자 하였고, 왕관을 쓰고자 하였으며, 안티오코스 왕을 향해 손을 뻗고자 하였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘아시아’는 현대의 대륙이 아니라 헬레니즘 시대에 이해된 셀레우코스 왕국의 정치적 영역을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 직역하면 “안티오코스 왕을 향해 손을 뻗다”입니다. 이는 그에게 적대적으로 행동하거나 공격하려 했다는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτησεν
  english_pob_choice: sought
  chosen_korean: 다스리고자 하였고
  alternatives_korean:
  - 추구하였고
  - 원하였고
  - 시도하였고
  lexicon: BDAG
  rationale: ζητέω의 aorist는 단순한 탐색이 아니라 의도와 목표를 나타내므로, 한국어에서는 목적을 드러내는 '-고자 하다'로 옮겨 왕권 장악 의도를 분명히 했습니다.
- source_word: βασιλεῦσαι τῆς Ἀσίας
  english_pob_choice: to rule over Asia
  chosen_korean: 아시아를 다스리고자
  alternatives_korean:
  - 아시아를 통치하고자
  - 아시아 위에 군림하고자
  - 아시아의 왕이 되고자
  lexicon: LSJ
  rationale: βασιλεύω는 왕으로 군림하거나 통치하는 뜻이므로, 본문 흐름상 정치적 지배 의도를 자연스럽게 드러내는 ‘다스리다’를 택했습니다.
- source_word: τὸ διάδημα
  english_pob_choice: to put on the crown
  chosen_korean: 왕관을 쓰고자
  alternatives_korean:
  - 디아뎀을 쓰고자
  - 왕관을 머리에 얹고자
  - 왕권의 관을 쓰고자
  lexicon: LSJ
  rationale: διάδημα는 왕권의 상징인 왕관/관을 가리키며, 한국어에서는 낯선 음역보다 ‘왕관’이 소스를 충분히 반영하면서도 읽기 쉽습니다.
- source_word: ἐκτεῖναι χεῖρας ἐπ’ Ἀντίοχον τὸν βασιλέα
  english_pob_choice: to lay hands on Antiochus the king
  chosen_korean: 안티오코스 왕에게 손을 대고자 하였습니다
  alternatives_korean:
  - 안티오코스 왕을 공격하고자 하였습니다
  - 안티오코스 왕에게 손을 뻗고자 하였습니다
  - 안티오코스 왕에게 해를 끼치고자 하였습니다
  lexicon: LSJ
  rationale: 직역하면 ‘손을 뻗다’이지만, 이 관용구는 해로운 행동을 예고하므로 한국어에서는 ‘손을 대다’로 옮겨 공격 의도를 남기되 과도하게 특정하지 않았습니다.
theological_decisions:
- issue: 왕위 찬탈 의도와 폭력적 야심의 표현
  chosen_reading: 본문은 트리폰의 정치적 야심이 왕관 착용과 안티오코스에 대한 폭력적 행위 의도로 함께 제시된 것으로 읽었습니다.
  alternative_readings:
  - 단순히 왕권을 얻으려는 정치적 포부로만 읽기
  - 안티오코스에 대한 직접적 공격을 강하게 특정하기
  rationale: 그리스어 병렬구조가 지배 욕망과 폭력적 행위를 함께 묶고 있으므로, 둘 다 살리되 한국어에서는 각각 ‘다스리고자’와 ‘손을 대고자’로 균형 있게 표현했습니다.
  doctrine_reference: 본문 문맥 이해
