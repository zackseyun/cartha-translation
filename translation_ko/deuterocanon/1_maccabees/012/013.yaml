lexical_decisions:
- source_word: ἀπρόσδεοι
  english_pob_choice: having no need
  chosen_korean: 필요하지 않으면서도
  alternatives_korean:
  - 필요가 없으면서도
  - 결핍이 없으면서도
  lexicon: LSJ
  rationale: 부정적 필요 없음의 뜻을 자연스러운 합쇼체로 옮기되, 문맥상 대조를 살리기 위해 ‘-면서도’를 사용했습니다.
- source_word: παράκλησιν
  english_pob_choice: encouragement
  chosen_korean: 격려
  alternatives_korean:
  - 위로
  - 권면
  - 위안
  lexicon: BDAG
  rationale: 여기서는 단순한 정서적 위로보다 성경이 주는 내적 지지와 북돋움을 가리키므로 ‘격려’가 가장 무난합니다.
- source_word: τὰ βιβλία τὰ ἅγια
  english_pob_choice: the holy books
  chosen_korean: 거룩한 책들
  alternatives_korean:
  - 성스러운 책들
  - 거룩한 서책들
  - 성경책들
  lexicon: LSJ
  rationale: 그리스어의 구체적 표현인 ‘책들’을 살리면서, 후대의 정형화된 ‘성경’으로 좁히지 않기 위해 직역에 가깝게 옮겼습니다.
- source_word: τὰ ἐν ταῖς χερσὶν ἡμῶν
  english_pob_choice: that are in our hands
  chosen_korean: 우리 손에 있는
  alternatives_korean:
  - 우리의 소유인
  - 우리의 손안에 있는
  - 우리의 보관 아래 있는
  lexicon: LSJ
  rationale: 직역의 이미지인 ‘손에 있는’을 보존하여, 단순한 소유 이상의 가까이 있음과 즉시성을 드러냈습니다.
theological_decisions:
- issue: ‘거룩한 책들’의 범위
  chosen_reading: 후대의 확정된 정경 용어로 바꾸지 않고, 본문이 말하는 그대로 ‘거룩한 책들’로 유지했습니다.
  alternative_readings:
  - 성경
  - 성서
  - 거룩한 성경
  rationale: 그리스어는 특정한 후대 정경 범주를 설명하지 않으므로, 본문의 자체 주장만 보존하고 범위를 확정하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Original-language primacy; Preserve theological tension rather than resolve it.'
