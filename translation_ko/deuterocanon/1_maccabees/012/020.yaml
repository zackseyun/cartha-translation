lexical_decisions:
- source_word: Ἄρης
  english_pob_choice: Arius
  chosen_korean: 아리우스
  alternatives_korean:
  - 아레스
  lexicon: LSJ
  rationale: 본문은 서신 머리말의 고유명사로 기능하므로, 문맥상 인명으로 처리해 POB의 ‘Arius’를 따랐습니다. 그리스 신명 아레스와 철자가 같지만, 역사적 맥락에서는 왕의 이름으로 이해하는 것이 타당합니다.
