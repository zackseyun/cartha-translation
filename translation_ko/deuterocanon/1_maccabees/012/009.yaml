translation:
  language: ko
  text: 그러므로 우리도 이 일들에 필요한 바가 없으면서도, 우리 손에 있는 거룩한 책들을 위로로 가지고 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 ‘위로’는 책들이 주는 마음의 지지나 격려를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘우리 손에 있는 거룩한 책들’입니다. 유대인의 성문서를 가리키는 표현으로 보입니다.
    reason: source_note
lexical_decisions:
- source_word: ἀπροσδεεῖς
  english_pob_choice: having no need
  chosen_korean: 필요한 바가 없으면서도
  alternatives_korean:
  - 이것들이 필요하지 않으면서도
  - 아무 필요가 없으면서도
  lexicon: LSJ
  rationale: ‘필요가 없다’는 핵심을 살리되, 문맥상 상대가 제안한 지원이나 증표를 가리키는 점을 자연스럽게 드러냈습니다.
- source_word: τούτων
  english_pob_choice: these things
  chosen_korean: 이 일들
  alternatives_korean:
  - 이것들
  - 이런 것들
  lexicon: LSJ
  rationale: 중성 복수의 지시어를 그대로 살리면서, 앞문맥의 제안된 것들을 포괄하는 한국어로 옮겼습니다.
- source_word: παράκλησιν
  english_pob_choice: encouragement
  chosen_korean: 위로
  alternatives_korean:
  - 격려
  - 위안
  - 위로와 격려
  lexicon: BDAG
  rationale: 이 문맥에서는 성경이 주는 마음의 지지와 힘이 중심이므로, 지나치게 훈계적으로 들리는 ‘격려’보다 ‘위로’가 더 직접적입니다.
- source_word: τὰ βιβλία τὰ ἅγια
  english_pob_choice: the holy books
  chosen_korean: 거룩한 책들
  alternatives_korean:
  - 성스러운 책들
  - 거룩한 서적들
  - 거룩한 성문서들
  lexicon: LSJ
  rationale: 직역을 유지하면서도 유대교 경전의 뉘앙스를 자연스럽게 담기 위해 ‘책들’로 옮겼습니다.
- source_word: τὰ ἐν ταῖς χερσὶν ἡμῶν
  english_pob_choice: that are in our hands
  chosen_korean: 우리 손에 있는
  alternatives_korean:
  - 우리의 손에 있는
  - 우리의 소유로 가진
  - 우리의 곁에 있는
  lexicon: LSJ
  rationale: ‘손에 있다’는 관용적 소유·접근 가능성의 이미지를 살려, 문자성을 유지했습니다.
theological_decisions:
- issue: 성경 책들의 정체와 기능
  chosen_reading: 예루살렘 공동체가 소유한 거룩한 책들이 외적 지원보다 더 본질적인 위로의 근거라는 뜻으로 읽었습니다.
  alternative_readings:
  - 단순히 서류나 기록을 가리킨다는 읽기
  - 일반적인 종교 문헌을 뜻한다는 읽기
  rationale: 문맥상 유대인의 성문서/경전을 가리키는 표현이 가장 자연스럽고, 그 기능은 ‘위로’로 제시됩니다. 번역은 그 긴장을 그대로 보존했습니다.
  doctrine_reference: '번역 원칙: 문맥이 허용하는 범위 안에서 성경적 실재를 직접 드러내되, 해석을 과도하게 확정하지 않습니다.'
