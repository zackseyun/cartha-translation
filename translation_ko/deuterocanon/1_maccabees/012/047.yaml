  text: 그러나 그는 자기와 함께 삼천 명을 남겨 두었습니다[a]. 그중 약 이천 명은 갈릴리에 남겨 두었고[b], 천 명은 그와 함께 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
