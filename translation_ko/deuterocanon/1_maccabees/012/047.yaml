    text: 그리스어를 직역하면 ‘자기와 함께’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그에게 합류했습니다’; 그리스어 동사는 더 문자적으로는 ‘그와 함께 모여 왔다’는 뜻입니다.
