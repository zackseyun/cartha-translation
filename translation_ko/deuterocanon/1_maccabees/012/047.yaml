  lexicon: LSJ
  rationale: 영문 주석이 지적하듯 그리스어는 직역하면 ‘자기와 함께’이므로, 주어의 반사성을 한국어에서도 그대로 드러냈습니다.
- source_word: ὡς δισχιλίους
  english_pob_choice: about two thousand
  chosen_korean: 약 이천 명
  alternatives_korean:
  - 대략 이천 명
  - 이천 명가량
  lexicon: LSJ
  rationale: ὡς가 수사와 함께 근사치를 나타내므로, ‘약’으로 불확정성을 분명히 했습니다.
- source_word: συνῆλθον αὐτῷ
  english_pob_choice: went with him
  chosen_korean: 그와 함께 갔습니다
  alternatives_korean:
  - 그에게 합류했습니다
  - 그와 함께 모였습니다
  lexicon: LSJ
  rationale: 직역하면 ‘그와 함께 모이다/함께 오다’이지만 문맥상 이동과 동행을 나타내므로, 자연스럽게 ‘함께 갔다’로 옮겼습니다.
