revisions:
- from: 그리고 그는 정탐꾼들을 그들의 진영으로 보냈습니다. 그들은 돌아와서 그에게 보고하기를, 「이렇게 그들은 밤에 그들에게 덮치려고 배치되고 있습니다」라고 했습니다.[a]
  to: 그리고 그는 정탐꾼들을 그들의 진영으로 보냈습니다. 그들은 돌아와 그에게 보고했습니다. “그들은 밤에 그들을 덮치도록 이렇게 배치되어 있습니다.”[a]
  rationale: 군사적 배치를 뜻하는 τάσσονται를 자연스러운 현대 한국어로 옮기면서도, 누가 누구를 공격하는지에 관한 원문의 대명사 수준의 모호성은 그대로 유지했습니다. 각주 표지는 해당 어휘가 번역된 ‘배치되어 있습니다’에 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:46:17Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 군사 정탐·보고 구조와 현재형 τάσσονται의 전술적 배치 의미는 대체로 반영되어 있습니다. 다만 ‘덮치려고 배치되고 있습니다’는 한국어에서 배치의 목적 관계가 다소 부자연스럽고, τάσσονται의 ‘배치되어/진을 갖추어 있는’ 상태를 더 자연스럽게 드러낼 필요가 있습니다.
  naturalness: ‘그들은 돌아와서 그에게 보고하기를’ 및 인용문 뒤의 ‘라고 했습니다’가 겹쳐 다소 무겁습니다. 또한 ‘밤에 그들에게 덮치려고 배치되고 있습니다’는 조사와 어순이 어색합니다. 보고 동사는 ‘보고했습니다’로 간결하게 처리하고, 공격 목적은 ‘덮치도록’으로 표현하는 편이 자연스럽습니다.
  terminology: ‘정탐꾼들’, ‘진영’, ‘덮치다’는 군사 문맥에 적절합니다. τάσσονται는 여기서 단순한 계획이라기보다 전투를 위해 배치되거나 진을 갖추는 뜻이므로 ‘배치되어 있습니다’를 유지하되 목적 표현을 조정합니다.
