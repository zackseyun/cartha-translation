  rationale: 그리스어의 ὅτι 이하 보고문은 말한 내용을 직접 제시하는 효과가 강하므로, 한국어에서도 인용부호로 그 보고의 현장감을 보존했습니다.
  doctrine_reference: 본문 서술 구조 보존
