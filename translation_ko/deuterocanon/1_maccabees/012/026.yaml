  yaml_path: translation/deuterocanon/1_maccabees/012/026.yaml
  text: And he sent scouts into their camp[a], and they returned and reported to him, “Thus they are arraying themselves to fall upon them by night.”
  footnotes:
  - marker: a
    text: Or 'thus they are drawn up to attack them at night.' The Greek τάσσονται can suggest being arranged or deployed in formation, not only making plans.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 정탐꾼들을 그들의 진영으로 보냈습니다. 그들은 돌아와 그에게 보고했습니다. “그들은 밤에 그들을 덮치도록 이렇게 배치되어 있습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 밤에 그들을 치려고 이렇게 진을 갖추고 있습니다.’ τάσσονται는 단순히 계획한다는 뜻만이 아니라 전투를 위해 배치되거나 대형을 갖추는 것을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατασκόπους
  english_pob_choice: scouts
  chosen_korean: 정탐꾼들
  alternatives_korean:
  - 정찰병들
  - 스파이들
  lexicon: LSJ
  rationale: 군사적 상황에서 적의 배치를 살피기 위해 파견된 사람들을 가리키므로, ‘정탐꾼들’이 기능을 살리면서도 ‘스파이들’보다 과장되지 않습니다.
- source_word: παρεμβολὴν
  english_pob_choice: camp
  chosen_korean: 진영
  alternatives_korean:
  - 야영지
  - 군영
  lexicon: LSJ
  rationale: 전투 맥락에서 παρεμβολή는 군대의 주둔지/진영을 뜻하므로 ‘진영’이 간결하고 자연스럽습니다.
- source_word: ἀπήγγειλαν
  english_pob_choice: reported
  chosen_korean: 보고하기를
  alternatives_korean:
  - 알리기를
  - 전하기를
  lexicon: LSJ
  rationale: 정탐 후 돌아와 상황을 전하는 뉘앙스를 살려, 단순한 ‘말하다’보다 정보 보고의 성격이 드러나도록 했습니다.
- source_word: Οὕτως τάσσονται
  english_pob_choice: Thus they are arraying themselves
  chosen_korean: 이렇게 그들은 … 배치되고 있습니다
  alternatives_korean:
  - 이렇게 그들은 … 정렬되고 있습니다
  - 이렇게 그들은 … 진을 치고 있습니다
  - 이렇게 그들은 … 배열되고 있습니다
  lexicon: LSJ
  rationale: τάσσονται는 단순한 계획이 아니라 전투 대형으로 ‘배치되다/정렬되다’는 뜻을 가질 수 있으므로, 진행형으로 현재의 전술적 배치를 드러냈습니다.
- source_word: ἐπιπεσεῖν
  english_pob_choice: to fall upon
  chosen_korean: 덮치려고
  alternatives_korean:
  - 공격하려고
  - 달려들려고
  lexicon: LSJ
  rationale: 호전적이고 급습적인 동작을 나타내므로, 평이한 ‘공격하다’보다 ‘덮치다’가 원문의 긴박감을 더 잘 전달합니다.
- source_word: τὴν νύκτα
  english_pob_choice: by night
  chosen_korean: 밤에
  alternatives_korean:
  - 한밤중에
  - 밤 동안
  lexicon: LSJ
  rationale: 시간 부사구로 자연스럽고 간결하게 옮겼습니다.
