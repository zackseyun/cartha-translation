base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/001.yaml
  text: And when Jonathan saw that the time was favorable to him[b][a], he chose men and sent them to Rome to establish and renew the friendship with them.
  footnotes:
  - marker: a
    text: Or 'that the opportunity favored him' or 'that the time was working in his favor.' The Greek expression is somewhat idiomatic, indicating that circumstances were advantageous to Jonathan.
    reason: lexical_alternative
  - marker: b
    text: '''Friendship'' here likely refers to formal diplomatic relations, not merely private affection.'
    reason: cultural_note
translation:
  language: ko
  text: 요나단은 그때가 자기에게 유리하게 작용하고 있음을 보고, 사람들을 뽑아 로마로 보내어 그들과의 우정을 확립하고 새롭게 하게 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘그때가 자기에게 유리하게 작용하고 있음을’은 ‘기회가 자기 편이었다’ 또는 ‘시기가 자기에게 유리했다’는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘우정’은 개인 감정보다 로마와의 공식적인 우호 관계를 가리키는 말일 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ καιρὸς αὐτῷ συνεργεῖ
  english_pob_choice: the time was favorable to him / was working with him
  chosen_korean: 그때가 자기에게 유리하게 작용하고 있음을
  alternatives_korean:
  - 때가 그를 돕고 있음을
  - 기회가 자기 편임을
  - 그 시기가 자기에게 유리함을
  lexicon: LSJ
  rationale: καιρός와 συνεργεῖ의 결합은 단순한 ‘때’보다 상황이 실제로 그에게 유리하게 움직인다는 뜻이어서, 이를 ‘유리하게 작용하고 있음을’으로 옮겨 원문의 관용적 힘을 살렸습니다.
- source_word: ἐπέλεξεν ἄνδρας
  english_pob_choice: he chose men
  chosen_korean: 사람들을 뽑아
  alternatives_korean:
  - 남자들을 뽑아
  - 사람들을 선택해
  - 남자들을 선택해
  lexicon: LSJ
  rationale: ἄνδρας는 문자상 남성을 가리키지만, 한국어에서는 외교 사절의 선택을 자연스럽게 드러내는 ‘사람들을’이 문맥상 더 매끄러워, 본문 의미를 해치지 않는 범위에서 일반화했습니다.
- source_word: στῆσαι καὶ ἀνανεῶσαι τὴν πρὸς αὐτοὺς φιλίαν
  english_pob_choice: to establish and renew the friendship with them
  chosen_korean: 그들과의 우정을 확립하고 새롭게 하게 했습니다
  alternatives_korean:
  - 그들과의 우정을 세우고 새롭게 하게 했습니다
  - 그들과의 우호 관계를 확립하고 갱신하게 했습니다
  - 그들과의 우의를 맺고 다시 새롭게 하게 했습니다
  lexicon: LSJ
  rationale: φιλία는 개인적 친분보다 공식적인 우호 관계를 가리킬 수 있으나, 본문은 로마와의 외교 관계를 가리키므로 ‘우정’을 기본으로 하되 ‘확립하고 새롭게’로 두 동사의 의미를 분명히 살렸습니다.
