  text: It was found in a writing concerning both the Spartans and the Jews that they are brothers and that they are of the family line of Abraham[a][b].
  footnotes:
  - marker: a
    text: Or 'in a document' or 'in a record.' The Greek term here refers to a written source and does not necessarily mean sacred Scripture.
    reason: lexical_alternative
  - marker: b
    text: That is, a claimed shared descent from Abraham in the written source being cited.
    reason: cultural_note
translation:
  language: ko
  text: 스파르타인들과 유대인들이 형제이며 아브라함의 가계에 속한다는 내용이 어떤 글에서[a] 발견되었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘문서에서’ 혹은 ‘기록에서’. 여기의 그리스어는 기록된 자료를 가리키며, 반드시 성경을 뜻하는 것은 아닙니다.
    reason: lexical_alternative
  - marker: b
    text: 곧, 인용된 기록이 스파르타인들과 유대인들이 아브라함의 가계에 속한다고 주장한다는 뜻입니다.
    reason: cultural_note
