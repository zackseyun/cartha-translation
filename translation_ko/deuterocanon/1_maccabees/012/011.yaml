  yaml_path: translation/deuterocanon/1_maccabees/012/011.yaml
  text: Therefore[a], at all times we continually remember you at the festivals and on the other appointed days, when we offer sacrifices and in our prayers, as it is right and fitting to remember brothers.
  footnotes:
  - marker: a
    text: Or 'the other proper/prescribed days.' The Greek καθηκούσαις can denote days that are fitting, customary, or appointed for observance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 우리는 늘 모든 때에, 축제 때와 그 밖의 정해진 날들에 여러분을 끊임없이 기억합니다. 희생 제사를 드릴 때와 우리의 기도 가운데서도 그렇게 하며, 형제들을 기억하는 것이 마땅하고 합당하기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “정해진”은 καθηκούσαις의 뜻인 ‘마땅한, 관례적인, 정해진’에 해당할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδιαλείπτως
  english_pob_choice: continually
  chosen_korean: 끊임없이
  alternatives_korean:
  - 쉬지 않고
  - 늘
  lexicon: BDAG
  rationale: 반복성과 지속성을 자연스럽게 살리면서, 앞의 “늘”과 중복되더라도 강조를 한국어로도 유지하기 위해 “끊임없이”를 선택했습니다.
- source_word: ἑορταῖς
  english_pob_choice: festivals
  chosen_korean: 축제 때
  alternatives_korean:
  - 절기 때
  - 명절 때
  lexicon: LSJ
  rationale: 종교적 예식이 포함된 경축 시기를 현대 한국어로 분명하게 드러내되, 지나치게 교회식 용어로 굳히지 않기 위해 “축제 때”로 옮겼습니다.
- source_word: λοιπαῖς καθηκούσαις ἡμέραις
  english_pob_choice: the other appointed days
  chosen_korean: 그 밖의 정해진 날들
  alternatives_korean:
  - 그 밖의 마땅한 날들
  - 그 밖의 규정된 날들
  lexicon: LSJ
  rationale: καθηκούσαις의 ‘마땅한/정해진’ 뜻을 살려, 축제 외의 관찰·기념일이라는 대비가 드러나도록 번역했습니다.
- source_word: θυσιῶν
  english_pob_choice: sacrifices
  chosen_korean: 희생 제사
  alternatives_korean:
  - 제사
  - 희생
  lexicon: BDAG
  rationale: 단순한 제사보다 제의적 희생의 성격을 더 분명히 보여 주기 위해 “희생 제사”로 옮겼습니다.
