  rationale: ἕως의 도달 한계를 살려 종착점을 표시했습니다. 고유명사는 현대 외래어 표기법에 따라 ‘아스글론’으로 옮겼습니다.
- source_word: τὰ πλησίον ὀχυρώματα
  english_pob_choice: the nearby strongholds
  chosen_korean: 그 근처의 요새들
