  text: 시몬은 나가서 아스글론까지, 또 그 근처의 요새들을 지나갔으며, 방향을 돌려 욥바로 가서 그것을 미리 차지하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘미리 점령하였습니다’, ‘선점하였습니다’로 옮길 수 있습니다. 그리스어 동사는 다른 세력보다 앞서 먼저 장악한다는 뜻을 담고 있습니다.
    reason: lexical_alternative
