  - 미리 장악하였습니다
  lexicon: LSJ
  rationale: 복합동사는 선점·예취득의 선행성을 담고 있으므로, ‘미리’와 ‘차지하다’를 결합해 시기적 우선성과 실제 점유를 함께 살렸습니다.
