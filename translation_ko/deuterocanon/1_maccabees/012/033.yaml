  text: And Simon went out and passed through as far as Ashkelon and the nearby strongholds[a], and he turned aside to Joppa and took it beforehand.
  footnotes:
  - marker: a
    text: Or 'occupied it beforehand' or 'preemptively captured it'; the Greek verb suggests taking control ahead of another party.
    reason: lexical_alternative
translation:
  language: ko
  text: 시몬은 나가서 아스글론까지 그리고 그 근처의 요새들을 지나갔으며, 돌이켜 야포로 가서 그것을 미리 차지하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘미리 점령하였습니다’, ‘선점하였습니다’로 옮길 수 있습니다. 그리스어 동사는 다른 세력보다 앞서 먼저 장악한다는 뜻을 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διώδευσεν
