  text: And all the nations around them sought to wipe them out[a], for they said, “They have no man to rule and help them. Now then[c][b], let us make war against them and remove their memory from among men.”
  footnotes:
  - marker: a
    text: Or 'blot them out' for 'wipe them out'; the Greek verb conveys eradication.
    reason: lexical_alternative
  - marker: b
    text: Greek 'They have no man ruling and helping them'; alternatively, 'They have no ruler to lead and help them.'
    reason: lexical_alternative
  - marker: c
    text: Or 'erase their remembrance from among humanity.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들 주변의 모든 민족이 그들을 멸하려고 했습니다. 그들이 말하기를 “그들을 다스리고 도와줄 남자가 없습니다. 이제 그들과 싸워, 사람들 가운데서 그들의 기억을 없애 버립시다.” 했기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 지워 버리려고’로 옮길 수 있습니다. 그리스어 동사는 근절·말살의 의미를 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 직역하면 ‘그들을 다스리고 도와줄 남자가 없다’입니다. 또는 ‘그들을 이끌고 도와줄 통치자가 없다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘사람들 가운데서 그들의 기억을 지워 버립시다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτησαν
  english_pob_choice: sought
  chosen_korean: 멸하려고 했습니다
  alternatives_korean:
  - 없애려고 했습니다
  - 찾아 나섰습니다
  - 해치려 했습니다
  lexicon: LSJ
  rationale: 여기서는 단순한 탐색이 아니라 파괴 의도를 드러내므로, 목적성을 살린 ‘멸하려고 했습니다’로 옮겼습니다.
- source_word: πάντα τὰ ἔθνη τὰ κύκλῳ αὐτῶν
  english_pob_choice: all the nations around them
  chosen_korean: 그들 주변의 모든 민족
  alternatives_korean:
  - 그들을 둘러싼 모든 나라들
  - 주변의 모든 이방 민족
  - 그들 둘레의 모든 백성
  lexicon: LSJ
  rationale: ἔθνη는 이 역사적 문맥에서 주변의 정치적·민족적 집단을 가리키므로, 중립적인 ‘민족’이 자연스럽고 원문의 범위를 유지합니다.
- source_word: ἄνδρα ἄρχοντα καὶ βοηθοῦντα
  english_pob_choice: no man to rule and help them
  chosen_korean: 그들을 다스리고 도와줄 남자가 없습니다
  alternatives_korean:
  - 그들을 이끌고 도와줄 통치자가 없습니다
  - 그들을 다스릴 지도자가 없고 도와줄 이도 없습니다
  - 그들을 통치하고 돕는 남자가 없습니다
  lexicon: LSJ
  rationale: 본문의 남성 단수 표현을 살리면서, POB의 ‘man’/‘ruler and help’ 구조를 한국어로 자연스럽게 재현했습니다.
- source_word: τὸ μνημόσυνον αὐτῶν
  english_pob_choice: their memory
  chosen_korean: 그들의 기억
  alternatives_korean:
  - 그들의 기억거리
  - 그들의 기념
  - 그들에 대한 기억
  lexicon: LSJ
  rationale: μνημόσυνον은 ‘기억/기념’의 의미이므로, 여기서는 사람들 사이에서 남는 기억을 뜻하는 ‘기억’으로 옮겼습니다.
theological_decisions:
- issue: 남성형 표현을 완화하지 않을지 여부
  chosen_reading: ‘남자’와 ‘사람들’ 같은 남성/일반 인칭 표현을 유지했습니다.
  alternative_readings:
  - 지도자
  - 사람들 가운데서 그들의 흔적
  - 그들의 기억을 인류 가운데서
  rationale: 그리스어가 ἄνδρα와 ἀνθρώπων을 사용하므로, 성별을 중화해 의미를 흐리기보다 원문의 표현력을 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
