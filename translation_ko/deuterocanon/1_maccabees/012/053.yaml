  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ἄνδρα ἄρχοντα καὶ βοηθοῦντα는 부정사 목적절이라기보다 ‘다스리고 도와주는 한 남자’라는 분사 수식 구조이므로 이를 본문에 반영하는 것이 더 정확합니다. ἐξ ἀνθρώπων은 ‘사람들 가운데서’로 적절하며, μνημόσυνον은 문맥상 ‘그들에 대한 기억’으로 밝혀 주는 편이 자연스럽습니다.
  naturalness: 현행의 ‘그들이 말하기를 … 했기 때문입니다’는 현대 표준 한국어 합쇼체 성경 문장으로 다소 부자연스럽습니다. ‘이는 그들이 …라고 말했기 때문입니다’로 고치고, 인용문 안의 권유를 ‘그러니 이제’로 연결하면 νῦν οὖν과 한국어 흐름을 함께 살릴 수 있습니다.
  terminology: ‘민족’, ‘멸하다’, ‘남자’, ‘기억’은 이 문맥에서 사용 가능합니다. 원문의 남성 단수 ἄνδρα를 ‘남자’로 유지하되, 그 남자가 수행하는 두 분사 ‘다스리고/도와주는’가 남자를 직접 수식하도록 조정합니다. 각 주석 표지는 해당 어구 바로 뒤에 배치합니다.
  issues:
