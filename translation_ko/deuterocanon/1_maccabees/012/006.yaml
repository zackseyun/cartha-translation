  rationale: 본문은 실제 혈연보다 정치적·외교적 친족 표지를 제시하므로, 그 긴장을 해소하지 않고 보존하는 편이 소스에 충실합니다.
  doctrine_reference: DOCTRINE.md §3 (긴장을 보존)
