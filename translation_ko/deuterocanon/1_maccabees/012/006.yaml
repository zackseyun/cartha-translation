  - 유대인 나머지 백성
  - 남은 유대 백성
  lexicon: LSJ; BDAG
  rationale: δῆμος의 ‘백성/민중’이라는 집합적 의미와 τῶν Ἰουδαίων의 소속을 함께 보이기 위해 직역성을 유지했습니다.
- source_word: τοῖς ἀδελφοῖς
  english_pob_choice: brothers
  chosen_korean: 형제들에게
  alternatives_korean:
  - 형제들께
  - 동족들에게
  - 형제라 부르는 이들에게
  lexicon: BDAG
  rationale: 외교 서신의 형제 호칭을 그대로 살려, 실제 혈연이 아니라 우호적·조약적 친족 언어임을 보존했습니다.
- source_word: χαίρειν
  english_pob_choice: greetings
  chosen_korean: 문안합니다
  alternatives_korean:
  - 인사합니다
  - 안부를 전합니다
  - 평안을 빕니다
  lexicon: BDAG
  rationale: 헬라어 서신의 관용적 서두를 한국어 서신체로 자연스럽게 옮기되, 단순한 ‘기뻐하라’보다 문안 인사의 기능을 분명히 했습니다.
theological_decisions:
- issue: 스파르타 사람들을 ‘형제들’로 부르는 외교적 친족 언어
  chosen_reading: ‘형제들에게’라는 표현을 그대로 유지했습니다.
  alternative_readings:
  - 친구들에게
  - 동맹에게
