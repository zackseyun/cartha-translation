- from: 요나단 대제사장과 장로 회의와 제사장들과 유대인들의 나머지 백성이 스파르타 사람들인 형제들에게 문안합니다.[a][b]
  to: 민족의 대제사장 요나단과 장로 회의와 제사장들과 그 밖의 유대[a] 백성이 형제들[b]인 스파르타 사람들에게 문안합니다.
  rationale: 원문에 명시된 τοῦ ἔθνους를 ‘민족의’로 복원했습니다. 또한 δῆμος의 집합적 의미를 ‘유대 백성’으로 유지하되, λοιπός는 자연스러운 표현인 ‘그 밖의’로 옮겼습니다. 스파르타인들을 ‘형제들’이라 부르는 동격적 외교 표현과 서신 인사 χαίρειν은 각각 ‘형제들인 스파르타 사람들’과 ‘문안합니다’로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:46:14Z'
