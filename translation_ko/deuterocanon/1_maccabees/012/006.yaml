  lexicon: LSJ
  rationale: 노년층의 정치·행정 기구라는 뜻을 살리면서도, 현대 독자가 곧바로 이해할 수 있는 투명한 표현으로 옮겼습니다.
- source_word: ὁ λοιπὸς δῆμος τῶν Ἰουδαίων
  english_pob_choice: the rest of the people of the Jews
  chosen_korean: 유대인들의 나머지 백성
  alternatives_korean:
