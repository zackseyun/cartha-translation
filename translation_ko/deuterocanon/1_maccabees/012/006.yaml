  - marker: b
    text: '''Brothers'' reflects the Greek wording of diplomatic kinship; it need not imply literal siblinghood.'
    reason: cultural_note
translation:
  language: ko
  text: 민족의 대제사장 요나단과 장로 회의와 제사장들과 그 밖의 유대[a] 백성이 형제들[b]인 스파르타 사람들에게 문안합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘유대’는 여기서 종교적 정체성뿐 아니라 유대 땅의 민족적·정치적 공동체를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘형제들’은 실제 형제 관계가 아니라 외교적 친족 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἀρχιερεὺς
