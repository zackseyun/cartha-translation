  yaml_path: translation/deuterocanon/1_maccabees/012/006.yaml
  text: Jonathan the high priest of the nation[a], and the council of elders, and the priests, and the rest of the people of the Jews, to their Spartan brothers[b], greetings.
  footnotes:
  - marker: a
    text: Or 'Judeans' for 'Jews'; the Greek term can denote the people of Judea in ethnic-political as well as religious terms.
    reason: lexical_alternative
  - marker: b
    text: '''Brothers'' reflects the Greek wording of diplomatic kinship; it need not imply literal siblinghood.'
    reason: cultural_note
translation:
  language: ko
  text: 요나단 대제사장과 장로 회의와 제사장들과 유대인들의 나머지 백성이 스파르타 사람들인 형제들에게 문안합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘유대인들’은 여기서 민족·정치적 집단을 가리킬 수 있으므로, ‘유대인들의’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘형제들’은 실제 형제 관계가 아니라 외교적 친족 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἀρχιερεὺς
  english_pob_choice: high priest
  chosen_korean: 대제사장
  alternatives_korean:
  - 큰 제사장
  - 최고 제사장
  lexicon: BDAG
  rationale: 성전 체계의 공식 직분을 가리키므로 관용적이면서도 직책성이 분명한 ‘대제사장’이 가장 자연스럽습니다.
- source_word: γερουσία
  english_pob_choice: council of elders
  chosen_korean: 장로 회의
  alternatives_korean:
  - 원로 회의
  - 장로원
  - 원로원
  lexicon: LSJ
  rationale: 노년층의 정치·행정 기구라는 뜻을 살리면서도, 현대 독자가 곧바로 이해할 수 있는 투명한 표현으로 옮겼습니다.
- source_word: ὁ λοιπὸς δῆμος τῶν Ἰουδαίων
  english_pob_choice: the rest of the people of the Jews
  chosen_korean: 유대인들의 나머지 백성
  alternatives_korean:
  - 유대인들의 나머지 사람들
  - 유대인 나머지 백성
  - 남은 유대 백성
  lexicon: LSJ; BDAG
  rationale: δῆμος의 ‘백성/민중’이라는 집합적 의미와 τῶν Ἰουδαίων의 소속을 함께 보이기 위해 직역성을 유지했습니다.
- source_word: τοῖς ἀδελφοῖς
  english_pob_choice: brothers
  chosen_korean: 형제들에게
  alternatives_korean:
  - 형제들께
  - 동족들에게
  - 형제라 부르는 이들에게
  lexicon: BDAG
  rationale: 외교 서신의 형제 호칭을 그대로 살려, 실제 혈연이 아니라 우호적·조약적 친족 언어임을 보존했습니다.
- source_word: χαίρειν
  english_pob_choice: greetings
  chosen_korean: 문안합니다
  alternatives_korean:
  - 인사합니다
  - 안부를 전합니다
  - 평안을 빕니다
  lexicon: BDAG
  rationale: 헬라어 서신의 관용적 서두를 한국어 서신체로 자연스럽게 옮기되, 단순한 ‘기뻐하라’보다 문안 인사의 기능을 분명히 했습니다.
theological_decisions:
- issue: 스파르타 사람들을 ‘형제들’로 부르는 외교적 친족 언어
  chosen_reading: ‘형제들에게’라는 표현을 그대로 유지했습니다.
  alternative_readings:
  - 친구들에게
  - 동맹에게
  - 동족에게
  rationale: 본문은 실제 혈연보다 정치적·외교적 친족 표지를 제시하므로, 그 긴장을 해소하지 않고 보존하는 편이 소스에 충실합니다.
  doctrine_reference: DOCTRINE.md §3 (긴장을 보존)
