  language: ko
  text: 그들은 그가 붙잡혀서 죽었고, 그와 함께한 사람들도 그렇게 되었음을 알게 되었습니다. 그러자 그들은 서로를 격려하고, 전열을 갖춘 채 전쟁에 대비하여 나아갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 용기를 얻었습니다.’ 그리스어는 문자적으로 ‘자기 자신들을 격려했다’라고 되어 있으며, 서로를 북돋우는 재귀 표현입니다.
    reason: lexical_alternative
