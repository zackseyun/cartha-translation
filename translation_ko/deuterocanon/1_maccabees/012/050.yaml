  text: 그들은 그와 그와 함께 있던 이들이 붙잡혀 죽었다는 것을 알게 되었습니다. 그러자 그들은 서로를 격려하고[a], 바짝 모여 전투할 준비를 갖추고 나아갔습니다.
  philosophy: optimal-equivalence
  footnotes:
