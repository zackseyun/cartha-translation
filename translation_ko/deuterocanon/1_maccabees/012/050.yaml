revisions:
- from: 그들은 그가 붙잡혀서 죽었고, 그와 함께한 사람들도 그렇게 되었음을 알게 되었습니다. 그러자 그들은 서로를 격려하고, 전열을 갖춘 채 전쟁에 대비하여 나아갔습니다.[a]
  to: 그들은 그와 그와 함께 있던 이들이 붙잡혀 죽었다는 것을 알게 되었습니다. 그러자 그들은 서로를 격려하고[a], 바짝 모여 전투할 준비를 갖추고 나아갔습니다.
  rationale: 체포와 죽음에 그와 동행한 이들이 포함된다는 점을 명시하되, 죽음의 방식이나 체포와 죽음 사이의 인과관계는 덧붙이지 않았습니다. συνεστραμμένοι는 ‘바짝 모여’로, ἕτοιμοι εἰς πόλεμον은 ‘전투할 준비를 갖추고’로 옮겨 군사적 밀집과 준비 상태를 반영했습니다. 각주 표지는 해당 재귀 표현의 번역 직후로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
