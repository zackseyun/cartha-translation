  text: And Simon rebuilt Adida in the Shephelah[b][a], and fortified it with gates and bars.
  footnotes:
  - marker: a
    text: Or 'built Adida'; the Greek verb can mean either 'built' or 'rebuilt/restored' depending on context.
    reason: lexical_alternative
  - marker: b
    text: '''Shephelah'' is the Judean foothill region; alternatively, ''the lowland.'''
    reason: cultural_note
translation:
  language: ko
  text: 시몬은 세펠라[b]에 있는 아디다를 건설하고[a], 성문과 빗장을 견고하게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아디다를 재건하고’ 또는 ‘복구하고’. 이 동사는 문맥에 따라 ‘짓다’ 또는 ‘재건하다/복구하다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘세펠라’는 유다의 구릉성 저지대 지역을 가리키며, 달리 ‘저지대’로도 옮길 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: ᾠκοδόμησεν
  english_pob_choice: rebuilt
  chosen_korean: 건축하고
  alternatives_korean:
  - 재건하고
  - 지어
  lexicon: LSJ
  rationale: 여기서는 성읍을 새로 세우는 뜻과 보수·복구하는 뜻이 모두 가능하므로, 중립적이면서도 공사 행위를 자연스럽게 드러내는 ‘건축하고’로 옮겼습니다.
- source_word: τὴν Ἀδιδὰ
  english_pob_choice: Adida
  chosen_korean: 아디다
  alternatives_korean:
  - 아디다 성읍
  - 아디다
  lexicon: 고유명사 음역
  rationale: 지명은 번역하지 않고 음역하는 것이 원문 대응에 가장 충실하므로 ‘아디다’로 옮겼습니다.
- source_word: ἐν τῇ σεφηλά
  english_pob_choice: in the Shephelah
  chosen_korean: 세펠라
  alternatives_korean:
  - 셰펠라
  - 저지대
  lexicon: 지리 용어
  rationale: σεφηλά는 유다의 구릉지대로 알려진 지명적 지리 용어이므로, 의미를 풀기보다 고유 지리명으로 유지했습니다.
- source_word: ὠχύρωσεν θύρας καὶ μοχλούς
  english_pob_choice: fortified it with gates and bars
  chosen_korean: 그 성문과 빗장을 견고하게 했습니다
  alternatives_korean:
  - 문과 빗장을 견고하게 했습니다
  - 성문들과 빗장들을 견고히 했습니다
  lexicon: LSJ
  rationale: 도시 방어 맥락에서는 θύρας를 ‘문’보다 ‘성문’으로, μοχλούς를 ‘빗장’으로 옮기는 것이 자연스럽고 원문의 방어 이미지를 더 분명히 살립니다.
theological_decisions:
- issue: 시몬의 행위를 단순 건축인지 복구/재건인지
  chosen_reading: 동사의 의미 범위를 살려 ‘건축하고’로 처리해, 새로 세움과 복구의 긴장을 열어 둡니다.
  alternative_readings:
  - 재건하고
  - 복구하고
  rationale: 영어 POB도 ‘rebuilt’와 ‘built’의 양면 가능성을 주석으로 남기고 있으므로, 한국어 본문에서는 특정 해석을 과도하게 고정하지 않는 편이 원문 충실도에 맞습니다.
  doctrine_reference: 본문 의미 범위 보존
- issue: 세펠라의 지리성
  chosen_reading: ‘세펠라’를 음역해 지역명으로 유지했습니다.
  alternative_readings:
  - 저지대
  - 평야
  rationale: 지리적 일반어로 풀면 원문의 역사·지리적 특수성이 약화되므로, 독자가 각주 없이도 지역명으로 인식할 수 있게 했습니다.
  doctrine_reference: 지명 보존 원칙
