- from: 그는 예루살렘에서 떠나 아마테 지역에서 그들과 맞닥뜨렸습니다. 이는 그가 자기 땅으로 들어오게 할 아무 여유도 주지 않았기 때문입니다.[a][b]
  to: 그는 예루살렘에서 떠나 하맛 땅[a]에서 그들과 마주했습니다. 이는 그들이 그의 땅에 들어올 틈을 조금도 주지 않았기 때문입니다.[b]
  rationale: 원문의 중립적인 만남 동사와, 상대가 그의 영토에 진입할 기회조차 얻지 못하게 했다는 인과 관계를 보존했습니다. 지명은 통용 표기인 ‘하맛’을 채택했으며, 각주 표지도 해당 어구 바로 뒤에 배치했습니다.
