    text: Ἀμαθεῖτις χώρα는 하맛과 관련된 땅 또는 지역을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: ἀνοχή는 여기서 그들이 들어갈 수 있도록 주어지는 틈이나 기회를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆρεν ἐξ Ἰερουσαλήμ
  english_pob_choice: And he set out from Jerusalem
  chosen_korean: 예루살렘에서 떠나
  alternatives_korean:
  - 예루살렘에서 출발하여
  - 예루살렘을 떠나
  lexicon: ἀπέρχομαι/ἀπείρω
  rationale: 출발·이동의 동작을 간결하게 살리되, 현대 한국어에서 자연스러운 서술형으로 옮겼습니다.
- source_word: ἀπήντησεν αὐτοῖς
  english_pob_choice: met them
  chosen_korean: 그들과 맞닥뜨렸습니다
  alternatives_korean:
  - 그들과 만났습니다
  - 그들을 맞이했습니다
  lexicon: ἀπαντάω
  rationale: 단순한 조우보다 전투 맥락의 충돌감을 드러내는 동사를 택해 문맥을 반영했습니다.
- source_word: εἰς τὴν Ἀμαθεῖτιν χώραν
  english_pob_choice: in the land of Hamath
  chosen_korean: 아마테 지역
  alternatives_korean:
  - 하맛 땅
  - 아마드 지방
  lexicon: Ἀμαθεῖτις χώρα
  rationale: 고유지명은 현대 외래어 표기 감각에 맞추되, χώρα의 지역적 의미를 살려 ‘지역’으로 옮겼습니다.
- source_word: οὐ γὰρ ἔδωκεν αὐτοῖς ἀνοχὴν τοῦ ἐμβατεῦσαι
  english_pob_choice: for he gave them no respite to enter
  chosen_korean: 그가 자기 땅으로 들어오게 할 아무 여유도 주지 않았기 때문입니다
  alternatives_korean:
  - 그가 그들이 자기 땅에 들어오도록 잠시도 허락하지 않았기 때문입니다
  - 그가 자기 땅에 들어올 틈을 주지 않았기 때문입니다
  lexicon: ἀνοχή + ἐμβατεύω
  rationale: POB의 ‘respite’를 반영해 ἀνοχή를 ‘여유/숨 고를 틈’ 계열로 살리고, ἐμβατεύω는 침입의 방향성을 담아 ‘들어오게 하다’로 표현했습니다.
theological_decisions:
- issue: 전투 서술의 긴장감과 ἀπαντάω의 뉘앙스
  chosen_reading: 중립적 ‘만나다’보다 전투적 충돌을 암시하는 ‘맞닥뜨리다’를 채택했습니다.
  alternative_readings:
  - 그들과 만났습니다
  - 그들을 마주쳤습니다
  rationale: 이 절은 단순한 조우가 아니라 진군 중인 적과의 대면을 말하므로, 문맥상 긴박함을 드러내는 번역이 더 적절합니다.
  doctrine_reference: 서사 문맥과 행위 동사의 뉘앙스 보존
