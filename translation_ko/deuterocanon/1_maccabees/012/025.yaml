review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. ἀπαντάω는 이 절 자체에서는 ‘만나다/마주하다’라는 뜻이므로, 전투적 충돌을 단정하는 ‘맞닥뜨리다’보다 중립적인 표현이 적절합니다. 또한 ἀνοχὴν τοῦ ἐμβατεῦσαι는 그들이 그의 땅에 들어갈 ‘틈’ 또는 ‘기회’를 주지 않았다는 뜻으로 옮기는 것이 자연스럽고 정확합니다.
  naturalness: ‘자기 땅으로 들어오게 할 아무 여유도 주지 않았다’는 한국어에서 수식 관계가 어색하고, ‘여유’를 주체가 상대에게 준다는 표현도 문맥상 부자연스럽습니다. ‘그들이 그의 땅에 들어올 틈을 조금도 주지 않았다’가 명료합니다.
  terminology: Ἀμαθεῖτις χώρα는 통용 성서 지명인 ‘하맛’을 사용하고 χώρα를 ‘땅’으로 옮기는 것이 적절합니다. 소유 대명사는 문맥상 주어를 가리키므로 ‘그의 땅’으로 명시했습니다.
  issues:
  - severity: medium
    issue: ‘맞닥뜨렸습니다’가 ἀπήντησεν에 전투적 충돌의 의미를 과도하게 부여합니다.
    rationale: 인접 문맥에는 군사 대치가 있으나, 해당 동사는 기본적으로 ‘만나다, 마주하다’입니다. 번역문은 본문 동사 자체가 확정하지 않는 충돌을 단정하지 않아야 합니다.
  - severity: medium
    issue: ‘아무 여유도 주지 않았다’는 ἀνοχή와 부정사의 관계를 부자연스럽게 처리합니다.
    rationale: 여기서는 그들이 들어갈 시간적·행동상의 틈 또는 기회를 허용하지 않았다는 뜻입니다.
  - severity: low
    issue: ‘아마테 지역’보다 ‘하맛 땅’이 한국어 성서 지명 관례 및 χώρα의 의미에 더 적합합니다.
    rationale: Ἀμαθεῖτις는 하맛과 관련된 지명 형용사이며, 한국어 성서 독자에게는 ‘하맛’이 통용되는 표기입니다.
  revised_text: 그는 예루살렘에서 떠나 하맛 땅[a]에서 그들과 마주했습니다. 이는 그들이 그의 땅에 들어올 틈을 조금도 주지 않았기 때문입니다.[b]
