  text: And he set out from Jerusalem and met them in the land of Hamath, for he gave them no respite to enter his land.
translation:
  language: ko
  text: 그는 예루살렘에서 떠나 하맛 땅[a]에서 그들과 마주했습니다. 이는 그들이 그의 땅에 들어올 틈을 조금도 주지 않았기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
