  yaml_path: translation/deuterocanon/1_maccabees/012/008.yaml
  text: And Onias received the man who had been sent with honor[a], and he received the letters[b], in which an alliance and friendship were explained.
  footnotes:
  - marker: a
    text: Or 'welcomed the envoy honorably.' The Greek reads more literally, 'received the man who had been sent with honor.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in which alliance and friendship were set forth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 오니아스는 파견된 그 사람을 존중하여 맞아들였고, 그 편지도 받았는데, 그 편지에는 동맹과 우정이 설명되어 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 사신을 존중하여 맞아들였다’로 옮길 수 있습니다. 그리스어는 더 문자적으로 ‘존중하여 파견된 그 사람’을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 편지에는 동맹과 우정이 제시되어 있었습니다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεδέξατο
  english_pob_choice: received
  chosen_korean: 맞아들였고
  alternatives_korean:
  - 받아들였고
  - 영접하였고
  - 환영하였고
  lexicon: LSJ
  rationale: formal한 외교적 접견 맥락에서 단순 수령보다 사람을 예우하며 받아들이는 뉘앙스를 살리기 위해 ‘맞아들이다’를 택했습니다.
- source_word: ἐνδόξως
  english_pob_choice: with honor / honorably
  chosen_korean: 존중하여
  alternatives_korean:
  - 영예롭게
  - 명예롭게
  - 존귀하게
  lexicon: LSJ
  rationale: 접견의 방식이 ‘존영하게’ 이루어졌다는 뜻을 한국어에서 자연스럽게 드러내기 위해 존대·예우의 의미를 가진 ‘존중하여’로 옮겼습니다.
- source_word: τὸν ἄνδρα τὸν ἀπεσταλμένον
  english_pob_choice: the man who had been sent
  chosen_korean: 파견된 그 사람
  alternatives_korean:
  - 보내진 그 사람
  - 사신
  - 파견된 사람
  lexicon: LSJ
  rationale: 직함을 부여하지 않은 그리스어의 서술적 표현을 따라, ‘사신’으로 좁히지 않고 ‘파견된 그 사람’으로 유지했습니다.
- source_word: διεσάφειτο περὶ συμμαχίας καὶ φιλίας
  english_pob_choice: in which an alliance and friendship were explained
  chosen_korean: 동맹과 우정이 설명되어 있었습니다
  alternatives_korean:
  - 동맹과 우정이 제시되어 있었습니다
  - 동맹과 친교가 분명히 밝혀져 있었습니다
  - 동맹과 우호가 자세히 설명되어 있었습니다
  lexicon: LSJ
  rationale: διεσάφειτο의 ‘분명히 해 두다/자세히 밝히다’는 의미를 살리면서도 문서의 내용을 자연스럽게 전달하기 위해 ‘설명되어 있었습니다’로 옮겼습니다. φιλία는 외교 문맥에서 ‘우정’이 가장 직접적입니다.
theological_decisions:
- issue: 외교적 관계 용어 συμμαχία, φιλία의 번역
  chosen_reading: ‘동맹과 우정’으로 옮겨 군사적·정치적 결속과 개인적 친선을 함께 드러냈습니다.
  alternative_readings:
  - ‘동맹과 친선’
  - ‘동맹과 우호관계’
  rationale: 본문은 단순한 감정이 아니라 조약적·외교적 관계를 말하므로, 의미를 약화시키지 않으면서도 현대 한국어에서 이해되는 표현을 택했습니다.
  doctrine_reference: 문맥상 외교 서신의 내용 설명
