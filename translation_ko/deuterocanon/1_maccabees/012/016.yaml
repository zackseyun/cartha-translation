theological_decisions:
- issue: δόξα의 번역 범위
  chosen_reading: 이 구절에서는 하나님의 영광이 아니라 상대방의 사회적 명예/명성까지 포함하는 의미로 읽어, 본문은 ‘영광’으로 두되 각주에서 ‘명예’와 ‘명성’ 가능성을 밝혔습니다.
  alternative_readings:
  - ‘명예’
  - ‘명성’
  - ‘존귀’
  rationale: 영어 POB 주석이 δόξα의 의미 범위를 명시적으로 열어 두므로, 본문은 고급 문체의 ‘영광’을 유지하되 의미 폭을 지우지 않도록 했습니다.
  doctrine_reference: 번역학적 어휘 선택
