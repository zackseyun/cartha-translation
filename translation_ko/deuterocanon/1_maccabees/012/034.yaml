  alternative_readings:
  - 영적 교훈을 암시하는 식의 의역
  - 승리 서사를 강조하는 표현
  rationale: 본문은 전쟁 상황의 보고와 조치만을 말하므로, 해설을 덧붙이지 않고 원문의 정보 구조를 유지했습니다.
