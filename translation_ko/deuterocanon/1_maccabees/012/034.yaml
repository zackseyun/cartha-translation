  text: For he heard that they intended to hand over the stronghold to those on Demetrius's side, and he stationed a garrison there so that they might guard it.
translation:
  language: ko
  text: 그가 그들이 그 요새를 데메트리오스 편 사람들에게 넘기려 한다는 소식을 들었기 때문에, 그는 거기에 수비대를 두어 그곳을 지키게 했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσεν
  english_pob_choice: he heard
  chosen_korean: 소식을 들었기 때문에
  alternatives_korean:
  - 들었기 때문에
  - 알게 되었기 때문에
  - 전해 들었기 때문에
  lexicon: BDAG
  rationale: aorist ἀκούω의 보고 수용 의미를 살려, 단순 청취보다 자연스러운 ‘소식을 들었습니다’로 옮겼습니다.
- source_word: τὸ ὀχύρωμα
  english_pob_choice: the stronghold
  chosen_korean: 그 요새
  alternatives_korean:
  - 그 성채
  - 그 보루
  - 그 성곽
  lexicon: LSJ
  rationale: 군사적 방어 거점을 가리키므로 ‘요새’가 가장 간결하고 현대 한국어에서도 분명합니다.
- source_word: τοῖς παρὰ Δημητρίου
  english_pob_choice: to those on Demetrius's side
  chosen_korean: 데메트리오스 편 사람들에게
  alternatives_korean:
  - 데메트리오스 진영의 사람들에게
  - 데메트리오스 당파 사람들에게
  - 데메트리오스 편에 있는 사람들에게
  lexicon: LSJ
  rationale: 직역하면 ‘데메트리오스에게서 온/곁의 사람들’이지만, 문맥상 정치적 충성 대상을 나타내므로 ‘편 사람들’이 자연스럽게 그 의미를 전달합니다.
- source_word: φρουράν
  english_pob_choice: a garrison
  chosen_korean: 수비대
  alternatives_korean:
  - 주둔군
  - 경비대
  - 보초병들
  lexicon: LSJ
  rationale: 상시 배치되는 군사 분견대를 가리키므로 ‘수비대’가 가장 정확합니다.
theological_decisions:
