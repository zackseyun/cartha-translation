  text: And he pursued after them, but did not overtake them, for they had crossed the Eleutherus River.
translation:
  language: ko
  text: 그들을 뒤쫓았으나 따라잡지 못했습니다. 그들이 엘레우테로스 강을 건넜기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεδίωξεν
  english_pob_choice: pursued
  chosen_korean: 추격했지만
  alternatives_korean:
  - 뒤쫓았습니다
  - 쫓아갔지만
  lexicon: LSJ
  rationale: 전쟁 서술의 적극적 추적 뉘앙스를 살리기 위해 ‘추격하다’를 택했고, 접속 구조상 뒤의 실패와 연결되도록 과거형으로 처리했습니다.
- source_word: ὀπίσω αὐτῶν
  english_pob_choice: after them
  chosen_korean: 그들 뒤를
  alternatives_korean:
  - 그들 뒤따라
  - 그들 뒤에서
  lexicon: LSJ
  rationale: 직역상 ‘그들 뒤로’이지만, 한국어에서는 추격의 방향을 자연스럽게 드러내는 ‘그들 뒤를’이 가장 간결합니다.
- source_word: οὐκ ἐκατέλαβεν
  english_pob_choice: did not overtake
  chosen_korean: 따라잡지는 못했습니다
  alternatives_korean:
  - 붙잡지는 못했습니다
  - 추격해 미치지 못했습니다
  lexicon: LSJ
  rationale: καταλαμβάνω가 여기서는 도주자를 ‘따라잡다/미치다’는 뜻이므로, 단순히 ‘잡다’보다 ‘따라잡다’가 의미를 더 정확히 반영합니다.
- source_word: τὸν Ἐλεύθερον ποταμόν
  english_pob_choice: the Eleutherus River
  chosen_korean: 엘레우테로스 강
  alternatives_korean:
  - 엘레우테로스 강물
  - 엘레우테로스 নদ?
  - 엘레우테로스 강
  lexicon: LSJ
  rationale: Ἐλεύθερον은 고유명사이므로 음역했고, ποταμόν은 한국어 지명 관용에 따라 ‘강’으로 옮겼습니다.
theological_decisions:
- issue: 이 절은 군사 추격 서술이며 신학적 해석이 개입할 여지가 거의 없습니다.
  chosen_reading: 사건의 순서와 결과(추격했으나 미치지 못함, 이유는 이미 강을 건넜기 때문)를 그대로 유지했습니다.
  alternative_readings:
  - 원인절을 앞세워 더 해설적으로 옮기는 방식
  - ‘도망쳤기 때문’처럼 도주성을 덧붙이는 방식
  rationale: 원문은 단순한 내러티브 사실 진술이므로, 서술을 확대하거나 평가를 덧붙이지 않는 것이 가장 충실합니다.
  doctrine_reference: 문맥상 교리 논점 없음
