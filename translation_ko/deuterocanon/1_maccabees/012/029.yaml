  yaml_path: translation/deuterocanon/1_maccabees/012/029.yaml
  text: But Jonathan and those with him did not know until morning[a], for they saw the fires burning.
  footnotes:
  - marker: a
    text: Greek literally, 'the lights burning.' In context this likely refers to fires left burning in the camp.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 요나단과 그와 함께한 사람들은 아침이 될 때까지 알지 못했습니다. 그들이 불타고 있는 불들을 보고 있었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어는 문자적으로 ‘타고 있는 불들’입니다. 문맥상 이는 진영에 남아 있던 불들을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  english_pob_choice: did not know
  chosen_korean: 알지 못했습니다
  alternatives_korean:
  - 몰랐습니다
  - 깨닫지 못했습니다
  lexicon: BDAG
  rationale: 단순한 과거 부정의 의미를 가장 सीधे하게 살려, 해석적 뉘앙스가 덧붙는 ‘깨닫지 못했습니다’보다 직설적인 표현을 택했습니다.
- source_word: ἕως πρωί
  english_pob_choice: until morning
  chosen_korean: 아침이 될 때까지
  alternatives_korean:
  - 아침까지
  - 새벽까지
  lexicon: LSJ
  rationale: 기준 시점을 분명히 하면서도 한국어에서 자연스러운 종결 표현으로 옮겼습니다. ‘새벽까지’는 조금 더 해석적입니다.
- source_word: τὰ φῶτα
  english_pob_choice: the fires
  chosen_korean: 불들
  alternatives_korean:
  - 등불들
  - 불빛들
  - 캠프파이어들
  lexicon: LSJ
  rationale: 문맥상 보이는 것은 실제로 타고 있는 불이며, 영어 POB의 ‘the fires’를 따라 과도한 구체화 없이 간결하게 옮겼습니다.
- source_word: καιόμενα
  english_pob_choice: burning
  chosen_korean: 불타고 있는
  alternatives_korean:
  - 타고 있는
  - 계속 타고 있는
  - 활활 타고 있는
  lexicon: BDAG
  rationale: 현재 상태를 나타내는 분사를 한국어의 진행형으로 자연스럽게 반영해, 앞절의 ‘알지 못했습니다’에 대한 이유를 분명히 했습니다.
- source_word: οἱ παρʼ αὐτοῦ
  english_pob_choice: those with him
  chosen_korean: 그와 함께한 사람들
  alternatives_korean:
  - 그와 함께 있는 사람들
  - 그의 동료들
  - 그의 사람들
  lexicon: LSJ
  rationale: 군사적 맥락을 지나치게 좁히지 않으면서, 동행 집단이라는 의미를 자연스러운 한국어로 살렸습니다.
