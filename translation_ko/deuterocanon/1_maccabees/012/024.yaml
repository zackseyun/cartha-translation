lexical_decisions:
- source_word: ἤκουσεν
  english_pob_choice: heard
  chosen_korean: 소식을 들었습니다
  alternatives_korean:
  - 들었습니다
  - 알게 되었습니다
  - 전해 들었습니다
  lexicon: BDAG
  rationale: 단순한 청취보다 보고의 수용을 드러내되, 서술체로 자연스러운 ‘소식을 들었습니다’로 옮겼습니다.
- source_word: οἱ ἄρχοντες Δημητρίου
  english_pob_choice: Demetrius’s commanders
  chosen_korean: 데메트리오스의 지휘관들
  alternatives_korean:
  - 데메트리오스의 군관들
  - 데메트리오스의 장수들
  - 데메트리오스의 관리들
  lexicon: LSJ
  rationale: 전투 문맥의 ἄρχοντες는 통치자보다 군사적 지휘자를 가리키는 것이 자연스러워 ‘지휘관들’로 옮겼습니다.
- source_word: μετὰ δυνάμεως πολλῆς
  english_pob_choice: with a much larger force
  chosen_korean: 훨씬 더 큰 병력을 거느리고
  alternatives_korean:
  - 큰 군세를 거느리고
  - 매우 큰 병력을 가지고
  - 많은 군대로
  lexicon: LSJ
  rationale: δύναμις가 여기서는 추상적 ‘힘’이 아니라 병력/군세를 뜻하므로, 비교어 ‘훨씬 더 큰’과 함께 구체적으로 표현했습니다.
- source_word: τοῦ πολεμῆσαι πρὸς αὐτόν
  english_pob_choice: to make war against him
  chosen_korean: 그와 전쟁하려 한다는
  alternatives_korean:
  - 그와 싸우려 한다는
  - 그를 치러 왔다는
  - 그와 전쟁하려는
  lexicon: BDAG
  rationale: πολεμέω의 강한 적대 행위를 살려 단순한 ‘싸우다’보다 ‘전쟁하다’를 택했고, 목적 부정사구의 의도를 한국어로 자연스럽게 풀었습니다.
