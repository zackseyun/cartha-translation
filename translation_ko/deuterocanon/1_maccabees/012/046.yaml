  - 병력들을
  - 부대들을
  lexicon: BDAG
  rationale: 군사 문맥에서 δυνάμεις는 무장 전력을 가리키므로, 복수형 뉘앙스를 살려 ‘군대들을’로 옮겼습니다.
- source_word: εἰς γῆν Ἰούδα
