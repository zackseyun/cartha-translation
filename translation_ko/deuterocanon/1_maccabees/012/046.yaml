translation:
  language: ko
  text: 그리고 그를 신뢰한 그는 자신이 말한 대로 행하고 병력을 파견하였으며, 그들은 유다 땅으로 갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμπιστεύσας
  english_pob_choice: trusting
  chosen_korean: 그를 신뢰하고
  alternatives_korean:
  - 그를 믿고
  - 그에게 신뢰를 두고
  lexicon: BDAG
  rationale: 행동의 근거가 되는 신뢰를 자연스러운 현대 한국어로 옮기되, 단순 감정이 아니라 판단과 의지의 신뢰라는 의미를 살렸습니다.
- source_word: ἐποίησεν καθὼς εἶπεν
  english_pob_choice: he did as he said
  chosen_korean: 그가 말한 대로 행하였으며
  alternatives_korean:
  - 그가 말한 대로 하였으며
  - 그가 한 말대로 하였으며
  lexicon: BDAG
  rationale: 그리스어의 순응 관계를 직접 반영하면서도 한국어 서술문으로 자연스럽게 정리했습니다.
- source_word: τὰς δυνάμεις
  english_pob_choice: the forces
  chosen_korean: 군대들을
  alternatives_korean:
  - 군대
  - 병력들을
  - 부대들을
  lexicon: BDAG
  rationale: 군사 문맥에서 δυνάμεις는 무장 전력을 가리키므로, 복수형 뉘앙스를 살려 ‘군대들을’로 옮겼습니다.
- source_word: εἰς γῆν Ἰούδα
  english_pob_choice: into the land of Judah
  chosen_korean: 유다 땅으로
  alternatives_korean:
  - 유다 땅 안으로
  - 유다 땅에
  - 유다의 땅으로
  lexicon: BDAG
  rationale: 전치사 εἰς는 이동의 목적지를 나타내므로, POB의 이동 맥락을 따라 ‘-으로’로 옮기는 것이 자연스럽습니다.
