  yaml_path: translation/deuterocanon/1_maccabees/012/052.yaml
  text: And they all came in peace into the land of Judah[a], and they mourned for Jonathan and those with him, and they were greatly afraid; and Israel mourned with great mourning.
  footnotes:
  - marker: a
    text: Or 'Israel mourned a great mourning.' The Greek uses an emphatic cognate expression.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들 모두는 평안히 유다 땅에 왔습니다. 그들은 요나단과 그와 함께 있던 이들을 애도하고 크게 두려워했습니다. 이스라엘은 크게 애도했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘이스라엘은 큰 애도를 애도했습니다’입니다. 희랍어는 ‘애도하다’와 같은 어근의 명사를 함께 써서 애도의 강도를 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον πάντες μετʼ εἰρήνης
  english_pob_choice: they all came in peace
  chosen_korean: 그들 모두는 평안히 … 돌아왔습니다
  alternatives_korean:
  - 그들 모두는 평화롭게 … 왔습니다
  - 그들 모두는 안전하게 … 왔습니다
  lexicon: LSJ
  rationale: κείμενον의 이동과 평안의 상태를 함께 살리기 위해 ‘평안히’로 옮기고, 서사 흐름상 ‘돌아왔습니다’를 보태 자연스러운 한국어로 만들었습니다.
- source_word: γῆν Ἰούδα
  english_pob_choice: the land of Judah
  chosen_korean: 유다 땅
  alternatives_korean:
  - 유다의 땅
  - 유대 땅
  lexicon: LSJ
  rationale: Ἰούδα의 지리적·민족적 의미를 따라 ‘유다 땅’으로 옮겨, 후대의 행정 구역 뉘앙스가 강한 표현은 피했습니다.
- source_word: ἐπένθησαν τὸν Ἰωνάθαν καὶ τοὺς μετʼ αὐτοῦ
  english_pob_choice: they mourned for Jonathan and those with him
  chosen_korean: 그들은 요나단과 그와 함께 있던 이들을 애도했고
  alternatives_korean:
  - 그들은 요나단과 그와 함께한 이들을 슬퍼했고
  - 그들은 요나단과 그의 동료들을 애도했고
  lexicon: LSJ
  rationale: ἐπένθησαν의 장례적·공적 슬픔을 ‘애도했습니다’로 살리고, τοὺς μετʼ αὐτοῦ는 지위를 과하게 특정하지 않도록 ‘그와 함께 있던 이들’로 옮겼습니다.
- source_word: ἐφοβήθησαν σφόδρα
  english_pob_choice: they were greatly afraid
  chosen_korean: 크게 두려워했습니다
  alternatives_korean:
  - 몹시 두려워했습니다
  - 심히 두려워했습니다
  lexicon: LSJ
  rationale: σφόδρα의 강도를 자연스럽게 반영하면서도, 수동/디포넌트형의 결과 상태를 한국어 서술로 간결하게 표현했습니다.
- source_word: ἐπένθησεν Ἰσραὴλ πένθος μέγα
  english_pob_choice: Israel mourned with great mourning
  chosen_korean: 이스라엘은 큰 애도로 애도했습니다
  alternatives_korean:
  - 이스라엘은 큰 슬픔으로 슬퍼했습니다
  - 이스라엘은 크게 애도했습니다
  lexicon: LSJ
  rationale: 희랍어의 동족 목적어 강조(ἐπένθησεν … πένθος μέγα)를 살리기 위해 반복 구조를 유지했고, 영어 POB의 “great mourning”에 해당하는 강조를 한국어에서도 드러냈습니다.
theological_decisions:
- issue: 전반 어조의 공적 애도와 두려움의 병렬
  chosen_reading: 애도와 두려움을 모두 강한 공동체적 반응으로 유지했습니다.
  alternative_readings:
  - 두려움만 강조하는 읽기
  - 단순한 슬픔으로 완화하는 읽기
  rationale: 본문은 귀환, 애도, 공포, 이스라엘의 대규모 애도를 연속적으로 배치하므로, 이를 감정적으로 약화하지 않고 공동체 전체의 중대한 사건으로 드러내는 것이 문맥에 충실합니다.
  doctrine_reference: 서사 문맥의 정서적·공동체적 강조
