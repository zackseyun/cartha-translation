base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/023.yaml
  text: 'And we also write back to you: Your livestock and your possessions are ours[a], and ours are yours[c][b]. Therefore we are giving orders that they report this to you accordingly.'
  footnotes:
  - marker: a
    text: Or 'we copy to you' if ἀντιγράφομεν is taken more literally; in this context it likely means 'we write back' or 'we send a written reply.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'Your livestock and your property are ours, and ours are yours'—a diplomatic formula expressing alliance and mutual solidarity, not necessarily abolition of legal ownership.
    reason: cultural_note
  - marker: c
    text: Or 'that they inform you to the same effect.' The Greek leaves the object of 'report' implicit.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 우리도 당신들에게 답장을 보냅니다.[a] 당신들의 가축과 재산은 우리의 것이고, 우리의 것은 당신들의 것입니다.[b] 그러므로 그들이 같은 내용으로 당신들에게 알리도록 명령합니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἀντιγράφομεν은 여기서 단순히 ‘베끼다’보다 서신에 대한 ‘회답하다/답장하다’의 뜻으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 표현은 소유권의 법적 포기를 뜻하기보다 동맹과 상호 연대를 나타내는 외교적 관용구입니다.
    reason: cultural_note
  - marker: c
    text: 그리스어는 ‘알리다/보고하다’의 내용을 명시적으로 반복하지 않습니다. ‘같은 내용으로’는 앞서 진술한 내용과 같은 취지로 알리라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιγράφομεν
  english_pob_choice: write back
  chosen_korean: 답장을 보냅니다
  alternatives_korean:
  - 서면으로 답합니다
  - 되답합니다
  - 답서합니다
  lexicon: LSJ
  rationale: 서신 문맥에서 단순한 ‘베껴 씀’보다 ‘회답함’의 뜻이므로, 현대 한국어로 자연스러운 ‘답장을 보냅니다’로 옮겼습니다.
- source_word: κτήνη
  english_pob_choice: livestock
  chosen_korean: 가축
  alternatives_korean:
  - 짐승
  - 가축떼
  - 동물
  lexicon: LSJ
  rationale: 가축으로 길러지는 재산적 동물을 가리키므로, 현대 한국어의 ‘가축’이 가장 직접적입니다.
- source_word: ὕπαρξις
  english_pob_choice: possessions
  chosen_korean: 재산
  alternatives_korean:
  - 소유물
  - 소유
  - 재물
  lexicon: LSJ
  rationale: 문맥상 물질적 소유와 자산을 뜻하므로, 집합적 소유 개념을 담는 ‘재산’이 적절합니다.
- source_word: ἐντελλόμεθα
  english_pob_choice: we are giving orders
  chosen_korean: 명령합니다
  alternatives_korean:
  - 지시합니다
  - 명합니다
  - 지시를 내립니다
  lexicon: LSJ
  rationale: 공식 외교 문서의 권위 있는 지시를 나타내므로, 간결하고 강한 ‘명령합니다’로 옮겼습니다.
- source_word: κατὰ τὰ αὐτά
  english_pob_choice: accordingly
  chosen_korean: 이와 같이
  alternatives_korean:
  - 같은 방식으로
  - 그에 따라
  - 동일하게
  lexicon: LSJ
  rationale: 앞서 말한 내용과 부합하게 보고하라는 뜻을 드러내며, 한국어 문장에서는 ‘이와 같이’가 가장 자연스럽습니다.
theological_decisions:
- issue: 공동 소유처럼 들리는 외교적 공식의 처리
  chosen_reading: ‘당신들의 가축과 재산은 우리의 것이고, 우리의 것은 당신들의 것입니다’라고 직역해 상호 연대의 외교적 관용구를 드러냈습니다.
  alternative_readings:
  - ‘우리와 당신들이 공유합니다’로 완화
  - ‘서로 소유를 나눕니다’로 의역
  rationale: 헬라어는 법적 소유권의 소멸이 아니라 동맹과 상호 우호를 표현하는 관용구이므로, 이를 완화하지 않고 그대로 드러내는 편이 원문 의도에 더 가깝습니다.
  doctrine_reference: 문맥상 외교적 수사 이해; 본문 의미 보존 원칙
- issue: ‘보고하도록’의 목적어 보완
  chosen_reading: ‘그들이 이와 같이 당신들에게 보고하도록’으로 목적어를 한국어에서 최소한으로 보완했습니다.
  alternative_readings:
  - ‘그들이 당신들에게 알리도록’
  - ‘그들이 이를 보고하도록’
  rationale: 그리스어는 보고의 내용을 명시적으로 반복하지 않으므로, 한국어에서는 과도한 해석 없이 자연스러운 최소 보완을 택했습니다.
  doctrine_reference: 문맥 보완 원칙
