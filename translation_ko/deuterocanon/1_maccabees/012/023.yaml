  source_fidelity: 핵심 어휘의 번역은 대체로 충실합니다. ἀντιγράφομεν의 서신상 호응 의미를 ‘답장을 보냅니다’로, κτήνη를 ‘가축’, ὕπαρξις를 ‘재산’으로 옮긴 것은 적절합니다. 다만 κατὰ τὰ αὐτά는 단순한 방식보다는 앞서 적힌 선언과 ‘같은 내용/같은 취지로’ 알리라는 뜻이므로 그렇게 명시하는 편이 더 정확합니다.
