  text: and to fortify the walls of Jerusalem[a], and to raise a great barrier between the citadel and the city so as to separate it from the city, so that it might stand by itself, in order that they might neither buy nor sell.
  footnotes:
  - marker: a
    text: Or 'the Acra,' the fortified stronghold in Jerusalem.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 예루살렘의 성벽을 보강하고, 성채와 도시 사이에 큰 방벽을 세워 그 성채를 도시와 분리하여, 그것이 따로 있게 하며, 그들이 장사도 사지도 팔지도 못하게 하려는 것이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아크라’—예루살렘에 있던 요새화된 성채.
    reason: lexical_alternative
lexical_decisions:
- source_word: προφυῶσαι
  english_pob_choice: to fortify
  chosen_korean: 보강하고
  alternatives_korean:
  - 튼튼히 하고
  - 강화하고
  - 수축해 덧세우고
  lexicon: LSJ
  rationale: 성벽을 대상으로 한 군사적 보강의 의미를 자연스럽게 살리되, 구체적 공법을 과도하게 특정하지 않기 위해 ‘보강하다’를 택했습니다.
- source_word: ἄκρας
  english_pob_choice: the citadel
  chosen_korean: 성채
  alternatives_korean:
  - 아크라
  - 요새
  - 시타델
  lexicon: LSJ
  rationale: 본문의 역사적 대상은 예루살렘의 요새화된 성채이므로 기능을 드러내는 ‘성채’로 옮기고, 고유 역사명은 본문보다 주석에서 처리하는 편이 적절합니다.
- source_word: ὑψῶσαι ὕψος μέγα
  english_pob_choice: to raise a great barrier
  chosen_korean: 큰 방벽을 세워
  alternatives_korean:
  - 큰 높이를 올려
  - 큰 장벽을 세워
  - 큰 성벽을 높여
  lexicon: LSJ
  rationale: 그리스어는 문자적으로 ‘큰 높이를 세우다/올리다’에 가까우나, 문맥상 도시와 성채를 가르는 차단 구조이므로 한국어에서는 ‘방벽’을 써서 기능을 분명히 했습니다.
- source_word: εἰς τὸ διαχωρίσαι αὐτὴν τῆς πόλεως
  english_pob_choice: so as to separate it from the city
  chosen_korean: 그 성채를 도시와 분리하여
  alternatives_korean:
  - 그것을 도시로부터 갈라놓아
  - 그 성채를 도시에서 떼어놓아
  lexicon: LSJ
  rationale: 목적을 나타내는 구조를 살리면서, 대상이 성채임을 분명히 하기 위해 대상을 앞에 두고 자연스러운 문장으로 조정했습니다.
- source_word: μήτε ἀγοράζωσιν μήτε πωλῶσιν
  english_pob_choice: neither buy nor sell
  chosen_korean: 장사도 사지도 팔지도 못하게
  alternatives_korean:
  - 사고팔지 못하게
  - 매매하지 못하게
  lexicon: LSJ
  rationale: ‘사다/팔다’의 거래 금지를 직접 살리되, 맥락상 상거래 전체를 가리키므로 ‘장사도’로 폭을 드러냈습니다.
theological_decisions:
- issue: 예루살렘 성채와 도시의 분리 목적
  chosen_reading: 성채를 도시와 물리적으로 분리해 독립된 거점으로 만들려는 정치·군사적 의도를 그대로 드러냈습니다.
  alternative_readings:
  - 단순한 도시 방어 강화로 완화해서 읽는 것
  - 성채 내부 거주민의 고립에 초점을 맞추는 것
  rationale: 본문의 목적절은 분리와 고립을 분명히 말하므로, 이를 완화하지 않고 그대로 번역하는 것이 역사서의 긴장을 보존합니다.
  doctrine_reference: 역사 서술의 구체성 보존; 의미 약화 금지 원칙
- issue: 합쇼체 서술과 목적절의 연결
  chosen_reading: 서술 본문은 합쇼체를 유지하고, 결과·목적 표현도 같은 문체 안에서 자연스럽게 연결했습니다.
  alternative_readings:
  - 더 경구체적인 문체로 바꾸는 것
  - 현대 구어로 풀어 쓰는 것
  rationale: 공적 낭독 가능한 표준어 문체를 유지하면서도, 원문의 행위 연쇄와 목적 구조를 선명하게 전달하기 위한 선택입니다.
  doctrine_reference: POB 한국어 문체 지침
