  text: And they gave them letters to the people in each place[b][a], so that they might send them on to the land of Judah in peace.
  footnotes:
  - marker: a
    text: Or 'place by place'; the phrase indicates letters addressed to local people or authorities along the route.
    reason: lexical_alternative
  - marker: b
    text: Or 'escort them onward'; the Greek verb can include the sense of accompanying travelers and helping them on their way.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 그들에게 각 지역의 사람들에게 보내는[a] 편지들을 주었습니다. 이는 그 사람들이 그들을 평안히 유다 땅으로 보내 주게[b] 하려는 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘장소마다’이며, 길을 따라 있는 각 지역의 수신자들을 가리키는 분배적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 προπέμπωσιν은 ‘보내 주다’ 외에 여행자를 동행하여 호송하거나 배웅한다는 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
