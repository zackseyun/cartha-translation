  source_fidelity: 현 초안은 ‘각 지역의 사람들에게’가 편지의 수신자인지, 편지를 받은 여행자들이 누구인지가 문법적으로 불분명하며, 원문의 αὐτοῖς(그들에게)를 사실상 누락합니다. 또한 γῆν Ἰούδα는 ‘유대’보다 ‘유다’가 원문의 지명과 더 직접적으로 대응합니다. 수정문은 편지를 받은 이들과 각 지역의 수신자들을 구별하고, ὅπως의 목적을 보존합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽고, ‘각 지역의 사람들에게 보내는 편지’라는 표현으로 편지의 수신 대상을 명확히 합니다. 두 문장으로 나누어 한국어에서 중첩된 대명사의 혼동을 줄였습니다.
