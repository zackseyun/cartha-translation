  yaml_path: translation/deuterocanon/1_maccabees/012/004.yaml
  text: And they gave them letters to the people in each place[b][a], so that they might send them on to the land of Judah in peace.
  footnotes:
  - marker: a
    text: Or 'place by place'; the phrase indicates letters addressed to local people or authorities along the route.
    reason: lexical_alternative
  - marker: b
    text: Or 'escort them onward'; the Greek verb can include the sense of accompanying travelers and helping them on their way.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 각 지역의 사람들에게 편지를 주어, 그들이 평안히 유대의 땅으로 그들을 보내 주게 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘장소에 따라/장소마다’이며, 각 지역의 수신자들을 가리키는 분배적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: προπέμπωσιν은 ‘보내다’보다 ‘호송하다, 배웅하다’의 의미를 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστολὰς
  english_pob_choice: letters
  chosen_korean: 편지
  alternatives_korean:
  - 서한
  - 공문
  lexicon: LSJ
  rationale: ἐπιστολή는 일반적으로 서면 메시지나 편지를 뜻하므로, 현대 한국어에서는 가장 자연스러운 ‘편지’가 적절합니다.
- source_word: κατὰ τόπον
  english_pob_choice: to the people in each place
  chosen_korean: 각 지역의 사람들에게
  alternatives_korean:
  - 장소마다
  - 각 지역별로
  - 각 장소의 사람들에게
  lexicon: LSJ
  rationale: 직역하면 ‘장소에 따라/장소마다’이지만, 문맥상 길목의 각 지역 수신자를 가리키므로 분배적 의미를 살린 ‘각 지역의 사람들에게’가 가장 분명합니다.
- source_word: προπέμπωσιν
  english_pob_choice: they might send them on
  chosen_korean: 그들이 보내 주게
  alternatives_korean:
  - 그들이 호송하게
  - 그들이 배웅하게
  - 그들이 길을 떠나게 하게
  lexicon: LSJ
  rationale: προπέμπω는 단순히 보내는 것보다 여행 중 동행·호송·배웅의 뉘앙스를 가질 수 있어, 본문 흐름에 맞게 도움을 주며 보내는 뜻을 담았습니다.
- source_word: γῆν Ἰούδα
  english_pob_choice: the land of Judah
  chosen_korean: 유대의 땅
  alternatives_korean:
  - 유다의 땅
  - 유대 땅
  - 유다 지방
  lexicon: LSJ
  rationale: 그리스어의 ‘땅/토지’ 표현을 유지하되, 한국어에서는 역사 지명을 자연스럽게 전달하는 ‘유대의 땅’이 읽기 좋습니다.
- source_word: μετʼ εἰρήνης
  english_pob_choice: in peace
  chosen_korean: 평안히
  alternatives_korean:
  - 평화롭게
  - 안전하게
  - 평강 중에
  lexicon: LSJ
  rationale: 직역의 ‘평안과 함께’보다 여행 맥락에서 자연스럽고, 동시에 ‘평화’와 안전의 뉘앙스를 함께 살릴 수 있습니다.
theological_decisions:
- issue: 무장 이동이 아니라 귀환/호송의 목적을 어떻게 드러낼지
  chosen_reading: ‘보내 주게 했습니다’로 옮겨, 본문의 목적이 단순 이동 허가가 아니라 안전한 귀환 지원임을 드러냈습니다.
  alternative_readings:
  - 그들을 보내게 했습니다
  - 그들을 호송하게 했습니다
  rationale: προπέμπω의 의미 범위와 영어 POB의 ‘send them on’ 선택을 반영하되, 본문이 요구하는 최소한의 도움·안전의 뉘앙스를 유지했습니다.
  doctrine_reference: 본문 문맥에 따른 서술 선택
