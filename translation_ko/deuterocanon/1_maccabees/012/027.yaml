  yaml_path: translation/deuterocanon/1_maccabees/012/027.yaml
  text: When the sun had set, Jonathan commanded those with him to stay awake and remain at their weapons, to be ready for battle through the whole night; and he posted sentries around the camp.
translation:
  language: ko
  text: 해가 지자, 요나단은 자기와 함께 있던 사람들에게 밤새 깨어 있고 무장을 갖춘 채 전투에 대비하라고 명령하였습니다. 또 그는 진영 둘레에 경계병들을 배치하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ ἔδυ ὁ ἥλιος
  english_pob_choice: When the sun had set
  chosen_korean: 해가 지자
  alternatives_korean:
  - 해가 저물자
  - 해가 질 무렵
  lexicon: LSJ
  rationale: 완료된 해짐을 간결하게 드러내며, 뒤따르는 명령 이전에 저녁이 시작되었음을 자연스럽게 표현합니다.
- source_word: γρηγορεῖν
  english_pob_choice: to stay awake
  chosen_korean: 깨어 있으라고
  alternatives_korean:
  - 경계하라고
  - 잠들지 말라고
  lexicon: LSJ
  rationale: 뒤의 경계병 배치와 구별되도록, 단순한 경계 근무보다 ‘깨어 있음’의 기본 의미를 살렸습니다.
- source_word: εἶναι ἐπὶ τοῖς ὅπλοις
  english_pob_choice: remain at their weapons
  chosen_korean: 무기를 든 채로 있으면서
  alternatives_korean:
  - 무기를 손에 든 채 있으면서
  - 무기 곁에 머물면서
  - 무장을 갖춘 채 있으면서
  lexicon: LSJ
  rationale: 무기를 손에 둔 채 전투 태세를 유지하라는 관용구를 한국어로 자연스럽게 옮겼습니다.
- source_word: ἐξέβαλεν προφύλακας
  english_pob_choice: he posted sentries
  chosen_korean: 경계병들을 배치하였습니다
  alternatives_korean:
  - 전초병들을 내보냈습니다
  - 보초들을 세웠습니다
  lexicon: LSJ
  rationale: 직역보다 군사적 관용을 살려, 진영 바깥에 경계 병력을 두었다는 의미를 분명히 했습니다.
