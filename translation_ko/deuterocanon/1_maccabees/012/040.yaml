translation:
  language: ko
  text: 그리고 요나단이 그를 허락하지도 않을까 두려워하고, 또 그에게 맞서 전쟁을 일으킬까 하여 그를 붙잡아 죽일 방법을 찾고 있었으며, 출발하여 벧산에 이르렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그를 허락하지도 않을까’는 그리스어의 직접 목적어 αὐτόν을 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ηὐλαβήθη
  english_pob_choice: became afraid
  chosen_korean: 두려워하고
  alternatives_korean:
  - 무서워하고
  - 염려하고
  lexicon: LSJ
  rationale: 이 동사는 단순한 공포와 조심스러운 우려를 모두 담을 수 있어, 자연스러운 현대 한국어로는 ‘두려워하다’가 가장 무난하게 강한 반응을 살립니다.
- source_word: μὴ ποτε οὐκ ἐάσῃ αὐτὸν
  english_pob_choice: might not permit him
  chosen_korean: 그를 허락하지도 않을까
  alternatives_korean:
  - 그를 허락하지 않을까
  - 그를 허용하지 않을까
  lexicon: LSJ
  rationale: 그리스어의 직접 목적어 αὐτόν을 살려 ‘그를’로 옮겼고, 전면적 거절의 가능성을 나타내는 구문은 ‘허락하지도 않을까’로 자연스럽게 옮겼습니다.
- source_word: πολεμήσῃ πρὸς αὐτόν
  english_pob_choice: might make war against him
  chosen_korean: 그에게 맞서 전쟁을 일으킬까
  alternatives_korean:
  - 그와 싸울까
  - 그에게 전쟁을 걸까
  lexicon: LSJ
  rationale: 군사적 뉘앙스를 유지하기 위해 단순한 ‘싸우다’보다 ‘전쟁을 일으키다’가 더 강하고, πρός의 대항 관계는 ‘맞서’로 반영했습니다.
- source_word: τοῦ συλλαβεῖν αὐτὸν τοῦ ἀποκτεῖναι
  english_pob_choice: to seize him and kill him
  chosen_korean: 그를 붙잡아 죽일 방법을
  alternatives_korean:
  - 그를 붙잡아 죽이려는 방법을
  - 그를 사로잡아 죽일 길을
  lexicon: LSJ
  rationale: 연속된 목적 부정사 구조를 한국어 목적 표현으로 풀어, ‘붙잡아 죽일’이라는 직접적이고 강한 의미를 유지했습니다.
theological_decisions:
- issue: 요나단의 이름과 서술 시제 처리
  chosen_reading: 인명은 ‘요나단’으로 음역하고, 서술은 연속 동작을 보여 주도록 현재진행형 없이 과거 서술로 정리했습니다.
  alternative_readings:
  - 요나단이 그를 허락하지 않을까 두려워하며
  - 그는 요나단이 그를 허락하지 않을까 두려워했다
  rationale: 이 절은 사건 진행의 연쇄를 압축하므로, 한국어에서는 지나친 설명 없이 순차적 서술을 택하는 것이 원문 흐름을 잘 드러냅니다.
  doctrine_reference: 서사문 번역의 시간·행위 연쇄 보존
