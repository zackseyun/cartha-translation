  naturalness: ‘동쪽에 있는 와디의 성벽’은 원문의 관계를 자연스럽고 분명하게 나타냅니다. ‘카페나타라고 불리는 것을 수리했습니다’는 대상의 범주를 보류하는 원문의 모호성을 유지하면서도 현대 한국어 합쇼체 문장으로 수용 가능합니다.
