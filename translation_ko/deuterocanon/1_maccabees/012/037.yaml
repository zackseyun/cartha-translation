base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/037.yaml
  text: And they gathered to build[a], and the wall of the wadi on the east side fell[b], and he repaired what is called Chaphenatha.
  footnotes:
  - marker: a
    text: Or 'the wall of the torrent/ravine on the eastern side.' The Greek phrase is compressed, and χείμαρρος can denote a seasonal watercourse or its ravine bed.
    reason: lexical_alternative
  - marker: b
    text: Chaphenatha is a transliterated place-name; the Greek does not specify more precisely what kind of site or structure it was.
    reason: cultural_note
translation:
  language: ko
  text: 그들은 건축하기 위해 모였고, 동쪽에 있는 와디의 성벽이 무너졌으며, 그는 카페나타라고 불리는 것을 수리했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: χείμαρρος는 ‘와디’처럼 계절성 물길이나 그 골짜기 자체를 가리킬 수 있으므로, 여기서는 동쪽에 있는 와디와 관련된 성벽을 뜻하는 것으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: Χαφεναθά는 음역된 명칭이며, 그리스어는 그것이 정확히 어떤 장소나 구조물인지는 더 밝히지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: συνήχθησαν τοῦ οἰκοδομεῖν
  english_pob_choice: And they gathered to build
  chosen_korean: 그들은 건축하기 위해 모였고
  alternatives_korean:
  - 그들은 모여서 건축했습니다
  - 그들은 건설하려고 모였습니다
  lexicon: LSJ
  rationale: τοῦ + 부정사 구조는 목적을 나타내므로, ‘건축하기 위해’로 옮겨 목적성을 분명히 했습니다. συνήχθησαν은 자연스럽게 ‘모였다’로 렌더링했습니다.
- source_word: τοῦ χειμάρρου
  english_pob_choice: the wadi
  chosen_korean: 와디
  alternatives_korean:
  - 계곡의 급류
  - 개울
  - 우기 하천
  lexicon: LSJ
  rationale: χείμαρρος는 지속적 개천보다 계절성 물길이나 그 골짜기를 가리킬 수 있어, 레반트 지리를 살리는 ‘와디’가 가장 근접합니다.
- source_word: τοῦ ἐξ ἀπηλιώτου
  english_pob_choice: on the east side
  chosen_korean: 동쪽의
  alternatives_korean:
  - 동편의
  - 동쪽 편의
  - 동쪽에서
  lexicon: LSJ
  rationale: ἀπηλιώτης는 동쪽/동풍을 가리키며, 이 문맥에서는 성벽의 방향을 나타내므로 ‘동쪽의’로 압축해 자연스럽게 옮겼습니다.
- source_word: τὸ καλούμενον Χαφεναθά
  english_pob_choice: what is called Chaphenatha
  chosen_korean: 카페나타라 불리는 곳
  alternatives_korean:
  - 카페나타라 불리는 것
  - 카페나타라고 하는 장소
  - 카페나타
  lexicon: LSJ
  rationale: καλούμενον은 ‘불리는’이라는 수동 분사를 드러내며, 그 대상이 장소인지 구조물인지 그리스어가 명시하지 않으므로 ‘곳’으로 과도한 특정화를 피했습니다.
