  yaml_path: translation/deuterocanon/1_maccabees/012/049.yaml
  text: And Tryphon sent forces and cavalry into Galilee[a], into the great plain, to destroy all those who were with Jonathan.
  footnotes:
  - marker: a
    text: Or 'all those on Jonathan’s side.' The Greek phrase literally reads 'all those beside/with Jonathan' and likely refers to his supporters or men.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 트리폰은 갈릴리로, 곧 그 큰 평원으로 군대와 기병을 보내어, 요나단과 함께 있던 모든 사람을 멸하려고 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 παρὰ Ἰωνάθου는 직역하면 ‘요나단 곁에/편에 있는 사람들’이며, 그의 지지자나 부하들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνάμεις
  english_pob_choice: forces
  chosen_korean: 군대
  alternatives_korean:
  - 병력
  - 무장 병력
  lexicon: LSJ
  rationale: 여기서는 추상적 ‘권세’가 아니라 파견된 군사 부대를 가리키므로, 자연스러운 현대 한국어로 ‘군대’가 가장 분명합니다.
- source_word: ἵππον
  english_pob_choice: cavalry
  chosen_korean: 기병
  alternatives_korean:
  - 말탄 군대
  - 기마병
  lexicon: LSJ
  rationale: 단수형이지만 집합적으로 쓰인 기마 전력을 뜻하므로, 군사 문맥에서 통용되는 ‘기병’이 적절합니다.
- source_word: εἰς τὸ πεδίον τὸ μέγα
  english_pob_choice: into the great plain
  chosen_korean: 그 큰 평원으로
  alternatives_korean:
  - 큰 평원으로
  - 그 광활한 평원으로
  lexicon: LSJ
  rationale: 지명성 있는 평원 표현을 살리면서도 한국어로 자연스럽게 옮기기 위해 ‘그 큰 평원’으로 처리했습니다.
- source_word: πάντας τοὺς παρὰ Ἰωνάθου
  english_pob_choice: all those who were with Jonathan
  chosen_korean: 요나단과 함께 있던 모든 사람
  alternatives_korean:
  - 요나단 편에 있던 모든 사람
  - 요나단의 사람들 모두
  lexicon: LSJ
  rationale: παρά + 인명은 단순한 소속보다 동행·동조 관계를 나타내므로, POB의 영어 해석을 따라 ‘함께 있던’으로 옮겼습니다.
theological_decisions:
- issue: τοῦ ἀπολέσαι의 목적 의미
  chosen_reading: ‘멸하려고 했습니다’로 옮겨, 군사 작전의 목적이 단순한 추방이 아니라 제거/파괴임을 드러냈습니다.
  alternative_readings:
  - 죽이려고 했습니다
  - 없애려고 했습니다
  rationale: 문맥상 전투적 폭력을 수반하는 목적이므로, 너무 약화시키지 않으면서도 본문의 폭넓은 파괴 의미를 보존했습니다.
  doctrine_reference: 본문-문맥 우선 원칙
