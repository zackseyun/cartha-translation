base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/045.yaml
  text: And now send them away to their homes, but choose for yourself a few men who will be with you; and come with me to Ptolemais, and I will hand it over to you, along with the rest of the strongholds and the large forces and all those in charge of affairs, and then I will depart after turning back; for this is why I have come.
  footnotes:
  - marker: a
    text: Or 'all the officials' for 'all those in charge of affairs'; the Greek literally refers to those set over the needs or business.
    reason: lexical_alternative
  - marker: b
    text: The clause 'I will depart after turning back' is somewhat compressed in Greek; it indicates that the speaker will first turn back/return and then leave, without specifying the destination.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이제 그들을 각자의 집으로 돌려보내십시오. 그러나 곁에 둘 몇 사람을 택하십시오. 나와 함께 프톨레마이스로 오십시오. 그러면 내가 그 성과 나머지 요새들과 많은 병력과 모든 업무 담당자들을[a] 당신에게 넘겨주겠습니다. 그런 다음 나는 돌아갔다가 떠나겠습니다.[b] 이것이 내가 온 이유이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 관리들’로도 옮길 수 있습니다. 그리스어는 문자적으로는 필요나 업무 위에 세워진 사람들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘돌아갔다가’는 ἐπιστρέψας의 선행 동작을 살린 표현입니다. 원문은 어디로 돌아가는지까지는 말하지 않습니다.
    reason: source_note
lexical_decisions:
- source_word: ἀπόστειλον
  english_pob_choice: send them away
  chosen_korean: 그들을 … 보내십시오
  alternatives_korean:
  - 그들을 … 파견하십시오
  - 그들을 … 돌려보내십시오
  lexicon: LSJ
  rationale: 명령형의 핵심은 현재 자리에서 돌려보내는 것이므로, 단순한 ‘보내다’보다 문맥상 자연스러운 ‘보내십시오’를 택했습니다.
- source_word: εἰς τοὺς οἴκους αὐτῶν
  english_pob_choice: to their homes
  chosen_korean: 그들의 집으로
  alternatives_korean:
  - 그들의 가정으로
  - 그들의 집들로
  lexicon: LSJ
  rationale: οἴκους는 물리적 건물보다 귀가의 목적지를 가리키므로, 현대 한국어에서 가장 자연스러운 ‘집으로’로 옮겼습니다.
- source_word: ἐπίλεξαι δὲ σεαυτῷ ἄνδρας ὀλίγους
  english_pob_choice: choose for yourself a few men
  chosen_korean: 당신을 위해 선택하십시오
  alternatives_korean:
  - 당신 자신을 위해 몇 사람을 고르십시오
  - 함께할 몇 사람을 택하십시오
  lexicon: LSJ
  rationale: 중간태의 ‘자기 몫으로/자기에게 유익하게 선택하다’의 뉘앙스를 살리면서, 바로 뒤의 ‘함께 있을’로 수량과 기능을 보완했습니다.
- source_word: τὰς δυνάμεις τὰς πολλὰς
  english_pob_choice: the large forces
  chosen_korean: 많은 군대
  alternatives_korean:
  - 많은 병력
  - 거대한 병력
  lexicon: LSJ
  rationale: δυνάμεις는 군사적 전력을 가리키므로 ‘군대’보다 집합적 의미가 살아 있는 ‘많은 군대’로 옮겼습니다.
- source_word: πάντας τοὺς ἐπὶ τῶν χρειῶν
  english_pob_choice: all those in charge of affairs
  chosen_korean: 모든 업무 담당자들
  alternatives_korean:
  - 모든 관리들
  - 모든 일 담당자들
  - 모든 사무 책임자들
  lexicon: LSJ
  rationale: 직역하면 ‘필요/사무 위에 세워진 자들’이므로, 행정적 책임자를 뜻하는 점을 살려 ‘업무 담당자들’로 번역했습니다.
- source_word: ἐπιστρέψας ἀπελεύσομαι
  english_pob_choice: I will depart after turning back
  chosen_korean: 돌아갔다가 떠나겠습니다
  alternatives_korean:
  - 돌아간 뒤 떠나겠습니다
  - 되돌아간 후에 떠나겠습니다
  lexicon: LSJ
  rationale: 출발 전에 먼저 ‘되돌아감/되돌아옴’이 선행한다는 순서를 자연스럽게 드러내되, 원문이 구체적 목적지를 말하지 않는 점은 유지했습니다.
