translation:
  language: ko
  text: 그리고 왕은 왕의 벗들[a] 가운데 한 사람으로, 강 건너 지역[b]을 다스리고, 왕국에서 높은 지위에 있으며, 왕에게 충실한 바키데스를 선택했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘왕의 벗들’은 단순한 개인적 우정이 아니라 헬레니즘 시대 궁정의 공식 칭호나 계층을 가리킬 가능성이 큽니다.
    reason: cultural_note
  - marker: b
    text: ‘강 건너 지역’은 단순한 방향 설명이 아니라 행정적으로 정해진 지역 명칭일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέλεξεν
  english_pob_choice: chose
  chosen_korean: 선택했습니다
  alternatives_korean:
  - 뽑았습니다
  - 임명했습니다
  lexicon: LSJ
  rationale: Greek 동사 ἐπέλεξεν은 기본적으로 ‘골랐다/선택했다’의 뜻이므로, 본문 자체의 선택 행위를 드러내는 ‘선택했습니다’가 가장 직접적입니다.
- source_word: τῶν φίλων τοῦ βασιλέως
  english_pob_choice: one of the king’s Friends
  chosen_korean: 왕의 벗들 가운데 하나로서
  alternatives_korean:
  - 왕의 친구들 가운데 하나로서
  - 왕의 친우들 가운데 하나로서
  lexicon: LSJ
  rationale: Hellenistic 궁정 용례에서 φίλοι는 단순한 사적 친구가 아니라 궁정 칭호/신분일 수 있으므로, 한국어도 일반적 우정보다 약간 공식적인 ‘왕의 벗들’로 살렸습니다.
- source_word: κυριεύοντα ἐν τῷ πέραν τοῦ ποταμοῦ
  english_pob_choice: governor of the region beyond the River
  chosen_korean: 강 건너 지역을 다스리는 자이며
  alternatives_korean:
  - 강 건너 지역의 총독이며
  - 강 너머 지역을 통치하는 자이며
  lexicon: LSJ
  rationale: κυριεύοντα는 지배/통치의 의미를 가지며, 본문에서는 직함처럼 기능합니다. ‘다스리는 자’는 행정적·정치적 권한을 자연스럽게 드러내면서도 원문의 분사 구조를 보존합니다.
- source_word: πιστὸν τῷ βασιλεῖ
  english_pob_choice: faithful to the king
  chosen_korean: 왕에게 충실한
  alternatives_korean:
  - 왕에게 신실한
  - 왕에게 충성한
  lexicon: LSJ
  rationale: πιστός는 이 문맥에서 왕에 대한 충성/신뢰성을 뜻하므로, 현대 한국어에서 가장 자연스럽고 넓은 의미를 보존하는 ‘충실한’을 택했습니다.
theological_decisions:
- issue: 왕권과 궁정 칭호의 표현
  chosen_reading: ‘왕의 벗들’은 단순한 사적 친분이 아니라 헬라스-헬레니즘 궁정의 공식적 지위를 시사하는 표현으로 유지했습니다.
  alternative_readings:
  - ‘왕의 친구들’로 평이하게 처리
  - ‘왕의 측근들’로 의미를 풀어씀
  rationale: 본문의 사회-정치적 뉘앙스를 흐리지 않기 위해, 전통적 교회어휘로 환원하지 않고 궁정 칭호 가능성을 살렸습니다.
  doctrine_reference: 역사서 본문의 사회사적 맥락 보존
- issue: ‘강 건너 지역’의 지리적 지정
  chosen_reading: 지리적 방향어로만 풀지 않고 ‘강 건너 지역’이라는 행정적·지역적 지정으로 유지했습니다.
  alternative_readings:
  - ‘유프라테스 강 서편’으로 특정
  - ‘강 너머’로 축약
  rationale: POB 영어 본문도 territorial designation으로 읽고 있으므로, 한국어도 독자가 행정 구역임을 느끼도록 하되 과도한 주석화는 피했습니다.
  doctrine_reference: 본문의 역사적-지리적 의미 보존
