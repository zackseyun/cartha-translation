  text: And the king chose Bacchides[a], one of the king’s Friends, governor of the region beyond the River, and great in the kingdom, and faithful to the king[b],
  footnotes:
  - marker: a
    text: “The king’s Friends” likely reflects an official court rank or recognized class of royal advisers/companions in Hellenistic administration, not merely personal friendship.
