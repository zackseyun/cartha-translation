translation:
  language: ko
  text: 그는 그들과 평화의 말을 하고, 그들에게 맹세하여 말했습니다. “우리는 너희나 너희 친구들에게 해를[a] 도모하지 않겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리는 너희나 너희 친구들에게 악을 도모하지 않겠습니다.” 그리스어 κακόν은 ‘악’이나 ‘해’를 뜻할 수 있는데, 여기서는 해로운 행동을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλησεν μετʼ αὐτῶν
  english_pob_choice: spoke ... with them
  chosen_korean: 그들과 ... 말을 나누고
  alternatives_korean:
  - 그들과 말했고
  - 그들과 이야기했고
  lexicon: BDAG
  rationale: μετά + 속격의 ‘with them’ 관계를 살리면서, λαλέω의 단순 발화를 한국어에서 자연스럽게 표현했습니다.
- source_word: εἰρηνικοὺς λόγους
  english_pob_choice: peaceful words
  chosen_korean: 평화로운 말
  alternatives_korean:
  - 평화의 말
  - 온화한 말
  lexicon: BDAG
  rationale: 직역보다 ‘평화로운 말’이 합쇼체 서술과 잘 맞고, 화해를 가장하는 발화라는 뉘앙스를 과도하게 해석하지 않습니다.
- source_word: ὤμοσεν
  english_pob_choice: swore
  chosen_korean: 맹세하며
  alternatives_korean:
  - 맹세했고
  - 서약하며
  lexicon: BDAG
  rationale: ὄμνυμι의 핵심은 맹세 행위이므로, 한국어에서 동작을 자연스럽게 드러내는 ‘맹세하며’로 옮겼습니다.
- source_word: κακὸν
  english_pob_choice: harm
  chosen_korean: 해
  alternatives_korean:
  - 악
  - 해악
  - 피해
  lexicon: BDAG
  rationale: 이 문맥에서는 추상적 도덕악보다 실제적 위해를 뜻하므로, 영어 POB의 ‘harm’에 맞춰 ‘해’로 옮겼습니다.
theological_decisions:
- issue: κακὸν의 의미 범위
  chosen_reading: ‘해’로 번역해, 맹세의 대상이 도덕적 악이 아니라 실제적 위해임을 드러냈습니다.
  alternative_readings:
  - ‘악’
  - ‘해악’
  rationale: 맥락상 정치적·군사적 안전을 보장하는 맹세이므로, 추상적 도덕어보다 구체적 피해를 가리키는 표현이 더 정확합니다.
  doctrine_reference: 본문의 서약 내용 해석
