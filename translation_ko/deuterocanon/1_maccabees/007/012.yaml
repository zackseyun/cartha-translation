    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισυνήχθησαν
  english_pob_choice: gathered
  chosen_korean: 모여들어
  alternatives_korean:
  - 모였습니다
  - 함께 모였습니다
  lexicon: LSJ
  rationale: 집합의 의미를 자연스럽게 살리면서도, 단순한 정적 상태가 아니라 특정 인물들에게로 모여드는 동작을 드러냅니다.
- source_word: συναγωγὴ
  english_pob_choice: assembly
  chosen_korean: 회중
  alternatives_korean:
  - 모임
  - 집회
  - 회합
  lexicon: LSJ
  rationale: 여기서는 건물로서의 ‘회당’이 아니라 모인 집단을 가리키므로, 기능상 ‘회중’이 가장 간결하고 본문에 맞습니다.
- source_word: γραμματέων
  english_pob_choice: of scribes
  chosen_korean: 서기관들의
  alternatives_korean:
  - 서기들의
  - 문서관들의
  lexicon: LSJ
  rationale: 유대·헬라 문맥에서 γραμματεύς는 통상 ‘서기관’이므로, 성경 독자에게도 의미가 분명한 표준 용어를 유지했습니다.
- source_word: δίκαια
  english_pob_choice: justice / what is right
  chosen_korean: 옳은 일
  alternatives_korean:
  - 정의
  - 정당한 일
  - 바른 일
  lexicon: LSJ
  rationale: 복수 중성형이 지닌 ‘옳고 정당한 것들’의 폭을 살리되, ‘정의’처럼 추상화하거나 법률화하지 않고 한국어로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: δίκαια의 의미 범위
  chosen_reading: ‘옳은 일’로 옮겨 법적 구제, 정치적 협상, 도덕적 정당성의 가능성을 모두 열어 둡니다.
  alternative_readings:
  - 정의
  - 정당한 판결
  - 바른 것
  rationale: 본문 자체가 어떤 종류의 ‘옳음’을 찾는지 특정하지 않으므로, 영어 POB의 의도처럼 의미 범위를 과도하게 좁히지 않는 것이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; optimal equivalence.'
