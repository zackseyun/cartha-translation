  lexicon: LSJ
  rationale: 수동적 의미를 살리면서 한국어에서는 자연스러운 ‘알려지다’로 옮겼습니다. ‘그에게’는 여격의 수혜자/인지자 관계를 보존합니다.
- source_word: τὸ πρᾶγμα
  english_pob_choice: the matter
  chosen_korean: 그 일
