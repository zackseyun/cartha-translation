  lexicon: LSJ
  rationale: 직역하면 ‘그들의 얼굴들’이지만, 한국어 문장에서는 목적격 표지가 필요해 ‘얼굴을’로 옮겼습니다. 이 표현은 영어 POB 주석이 지적한 관용적 의미도 함께 드러냅니다.
