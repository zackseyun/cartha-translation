  rationale: 직역인 ‘보이다’를 유지해 그리스어의 직접성과 금지 명령의 힘을 살렸습니다. 한국어에서는 대상 ‘그들의 얼굴’을 목적어로 두어 원문의 구체성을 유지했습니다.
- source_word: τὰ πρόσωπα αὐτῶν
  english_pob_choice: their faces
  chosen_korean: 그들의 얼굴을
  alternatives_korean:
  - 그들의 얼굴
  - 그들의 모습
