  rationale: 영어 POB가 주석으로 밝혔듯이 이 표현은 관용적으로 ‘그들을 내 앞에 들이지 말라’는 뜻이지만, 본문 이미지를 지우면 원문 감각이 약화됩니다. 따라서 본문은 직역을 유지하고, 관용적 의미는 주석 없이도 읽히도록 했습니다.
