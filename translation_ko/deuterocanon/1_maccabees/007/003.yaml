lexical_decisions:
- source_word: ἐγνώσθη αὐτῷ τὸ πρᾶγμα
  english_pob_choice: And the matter became known to him
  chosen_korean: 그리고 그 일이 그에게 알려지자
  alternatives_korean:
  - 그리고 그 일이 그에게 알려졌고
  - 그리고 그가 그 일을 알게 되자
  lexicon: LSJ
  rationale: 수동적 의미를 살리면서 한국어에서는 자연스러운 ‘알려지다’로 옮겼습니다. ‘그에게’는 여격의 수혜자/인지자 관계를 보존합니다.
- source_word: τὸ πρᾶγμα
  english_pob_choice: the matter
  chosen_korean: 그 일
  alternatives_korean:
  - 그 문제
  - 그 사건
  - 그 사정
  lexicon: LSJ
  rationale: πρᾶγμα의 넓은 의미를 살리되, 문맥상 가장 간결하고 자연스러운 ‘그 일’로 처리했습니다.
- source_word: Μή μοι δείξητε
  english_pob_choice: Do not show me
  chosen_korean: 그들의 얼굴을 내게 보이지 마십시오
  alternatives_korean:
  - 그들을 내 앞에 데려오지 마십시오
  - 내게 그들을 보여주지 마십시오
  lexicon: LSJ
  rationale: 직역인 ‘보이다’를 유지해 그리스어의 직접성과 금지 명령의 힘을 살렸습니다. 한국어에서는 대상 ‘그들의 얼굴’을 목적어로 두어 원문의 구체성을 유지했습니다.
- source_word: τὰ πρόσωπα αὐτῶν
  english_pob_choice: their faces
  chosen_korean: 그들의 얼굴을
  alternatives_korean:
  - 그들의 얼굴
  - 그들의 모습
  - 그들의 사람을
  lexicon: LSJ
  rationale: 직역하면 ‘그들의 얼굴들’이지만, 한국어 문장에서는 목적격 표지가 필요해 ‘얼굴을’로 옮겼습니다. 이 표현은 영어 POB 주석이 지적한 관용적 의미도 함께 드러냅니다.
theological_decisions:
- issue: 명령문의 관용적 의미와 표면적 이미지 사이의 긴장
  chosen_reading: 표면 표현인 ‘그들의 얼굴’을 유지하되, 한국어에서는 문맥상 ‘그들을 내 앞에 데려오지 마십시오’로 완화하지 않고 직역을 보존했습니다.
  alternative_readings:
  - 그들을 내 앞에 데려오지 마십시오
  - 내게 그들을 보여주지 마십시오
  rationale: 영어 POB가 주석으로 밝혔듯이 이 표현은 관용적으로 ‘그들을 내 앞에 들이지 말라’는 뜻이지만, 본문 이미지를 지우면 원문 감각이 약화됩니다. 따라서 본문은 직역을 유지하고, 관용적 의미는 주석 없이도 읽히도록 했습니다.
