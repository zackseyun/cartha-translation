  lexicon: LSJ
  rationale: πρᾶγμα의 넓은 의미를 살리되, 문맥상 가장 간결하고 자연스러운 ‘그 일’로 처리했습니다.
- source_word: Μή μοι δείξητε
  english_pob_choice: Do not show me
  chosen_korean: 그들의 얼굴을 내게 보이지 마십시오
  alternatives_korean:
