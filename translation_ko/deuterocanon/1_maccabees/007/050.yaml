  text: 그리고 유다 땅은 며칠 동안 조용했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡσύχασεν
  english_pob_choice: was quiet
  chosen_korean: 조용했습니다
  alternatives_korean:
  - 평온했습니다
  - 쉬었습니다
  - 안정되었습니다
  lexicon: LSJ
  rationale: ἡσυχάζω의 핵심은 소란이나 전쟁의 소멸로 인해 ‘조용해지다/고요하다’는 뜻이므로, 자연스러운 현대 한국어로 결과 상태를 살린 ‘조용했습니다’를 택했습니다.
- source_word: ἡ γῆ Ἰούδα
  english_pob_choice: the land of Judah
  chosen_korean: 유다 땅
  alternatives_korean:
  - 유다의 땅
  - 유다 지역
  - 유다 나라
  lexicon: LSJ
  rationale: γῆ는 이 문맥에서 영토로서의 ‘땅’을 가리키므로, 지명화된 표현보다 ‘유다 땅’이 원문의 토지적·지리적 감각을 잘 보존합니다.
- source_word: ἡμέρας ὀλίγας
  english_pob_choice: for a few days
  chosen_korean: 며칠 동안
  alternatives_korean:
  - 몇 날 동안
  - 며칠간
  - 며칠 동안만
  lexicon: LSJ
  rationale: 기간을 나타내는 목적격 표현이므로 한국어에서는 자연스럽게 ‘며칠 동안’으로 옮겨, 짧은 기간이라는 ὀλίγας의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: ‘quiet’의 의미를 평화의 선언으로 확장할지 여부
  chosen_reading: 이 구절은 일시적 정적을 말할 뿐, 지속적 평화나 샬롬의 완성으로 확대하지 않았습니다.
  alternative_readings:
  - 평화가 찾아왔다
  - 땅이 평안했다
  rationale: 전후 맥락상 짧은 소강 상태를 묘사하므로, 신학적으로 무게가 큰 ‘평화’보다 원문의 제한된 진술을 따라야 합니다.
  doctrine_reference: 서사 문맥의 서술 범위 제한
