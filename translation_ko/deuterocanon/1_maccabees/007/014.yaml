  text: For they said[a], “A man, a priest from the seed of Aaron, has come with the forces[b], and he will not wrong us.”
  footnotes:
  - marker: a
    text: Or “from the line of Aaron” or “of Aaron’s descendants.” The Greek literally says “from the seed of Aaron,” a genealogical expression emphasizing priestly descent.
    reason: lexical_alternative
  - marker: b
    text: “With the forces” refers to military forces; alternatively, “with the army” or “with the troops.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 이렇게 말했습니다. “아론의 씨에서 난 한 사람, 곧 한 제사장이 군대와 함께 왔으니, 그가 우리를 해치지는 못할 것입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘아론의 씨에서’이며, 이는 ‘아론의 계열에서’ 또는 ‘아론의 후손 가운데서’라는 뜻의 족보적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘군대와 함께’는 군사력 전체를 가리킵니다. 문맥상 ‘병력과 함께’ 또는 ‘군사들과 함께’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνθρωπος ἱερεὺς
  english_pob_choice: A man, a priest
  chosen_korean: 한 사람, 곧 한 제사장
  alternatives_korean:
  - 한 사람, 제사장
  - 한 남자, 한 제사장
  lexicon: BDAG
  rationale: ἄνθρωπος와 ἱερεύς의 apposition을 살려 인물과 직분을 나란히 제시하되, 한국어에서는 ‘곧’으로 자연스럽게 풀어 주었습니다.
- source_word: ἐκ τοῦ σπέρματος Ἀαρών
  english_pob_choice: from the seed of Aaron
  chosen_korean: 아론의 씨에서 난
  alternatives_korean:
  - 아론의 혈통에서 난
  - 아론의 후손인
  lexicon: BDAG
  rationale: σπέρμα의 직역인 ‘씨’를 유지해 아론 계열이라는 혈통 표지를 드러냈고, 문맥상 이해를 위해 ‘난’으로 자연스럽게 연결했습니다.
- source_word: ἐν ταῖς δυνάμεσιν
  english_pob_choice: with the forces
  chosen_korean: 군대와 함께
  alternatives_korean:
  - 군대와 함께
  - 군사들과 함께
  - 병력과 함께
  lexicon: BDAG
  rationale: δυνάμεις의 군사적 복수 용례를 반영해 ‘군대’로 옮겼고, 전치사 ἐν은 동행의 의미로 한국어 자연성에 맞게 처리했습니다.
- source_word: οὐκ ἀδικήσει ἡμᾶς
  english_pob_choice: he will not wrong us
  chosen_korean: 그가 우리를 해치지는 못할 것입니다
  alternatives_korean:
  - 그가 우리를 잘못 대하지는 못할 것입니다
  - 그가 우리에게 해를 끼치지는 못할 것입니다
  - 그가 우리를 해하지는 못할 것입니다
  lexicon: BDAG
  rationale: ἀδικέω의 ‘부당하게 대하다/해치다’ 범위를 한국어에서 자연스럽게 살려, 위협적 군사 맥락에 맞는 ‘해치다’로 옮겼습니다.
theological_decisions:
- issue: 아론 계열의 제사장적 정당성 표지
  chosen_reading: ‘아론의 씨’라는 표현을 살려 혈통에 근거한 제사장 정체성을 직접 드러냈습니다.
  alternative_readings:
  - 아론의 계열
  - 아론의 후손
  rationale: 본문의 논점은 제사장 직분의 혈통적 근거이므로, 완화된 설명보다 원문의 계보적 표현을 보존하는 것이 더 적절합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 4, 5
