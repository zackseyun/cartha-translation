  source_fidelity: 개정이 필요합니다. οὐκ ἀδικήσει는 미래의 의지·행동에 관한 진술인데, 초안의 ‘해치지는 못할 것입니다’는 능력/불가능의 의미를 더합니다. 또한 ἀδικέω의 핵심인 ‘부당하게 대하다, 불의를 행하다’가 단순한 물리적 위해로 좁아졌습니다. γάρ의 설명적 연결은 한국어에서 자연스럽게 약화될 수 있으나, ‘이렇게’는 앞 문맥에 대한 연결을 어느 정도 유지합니다.
  naturalness: ‘아론의 씨에서 난 한 사람’은 직역의 흔적이 강하고 현대 표준어 성경 문장으로는 다소 부자연스럽습니다. 본문은 ‘아론의 후손인’으로 자연스럽게 옮기고, 직역적 계보 표현은 각주에서 보존하는 편이 적절합니다. 각주는 해당 어구 바로 뒤에 배치했습니다.
  terminology: ἱερεύς는 ‘제사장’, δυνάμεις는 문맥상 ‘병력’으로 옮기는 것이 적절합니다. ‘우리에게 부당한 일을 하지는 않을 것입니다’는 ἀδικέω의 윤리적·실질적 범위를 보존하면서 미래 직설법의 의미를 자연스럽게 반영합니다.
