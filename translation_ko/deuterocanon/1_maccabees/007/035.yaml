lexical_decisions:
- source_word: ὤμοσεν
  english_pob_choice: swore
  chosen_korean: 맹세하면서
  alternatives_korean:
  - 맹세했습니다
  - 맹세하며
  lexicon: LSJ
  rationale: ὄμνυμι의 서술은 단순한 말이 아니라 엄숙한 맹세 행위를 가리키므로, 동작성을 살리면서도 문맥에 자연스러운 현재분사형으로 옮겼습니다.
- source_word: μετὰ θυμοῦ
  english_pob_choice: in anger
  chosen_korean: 분노하며
  alternatives_korean:
  - 노하여
  - 격분하여
  lexicon: LSJ
  rationale: θυμός는 분노·격정의 감정을 가리키므로, “분노하며”가 감정 상태와 부사를 함께 살리면서도 과장되지 않습니다.
- source_word: ἡ παρεμβολὴ αὐτοῦ
  english_pob_choice: his camp
  chosen_korean: 그의 진영
  alternatives_korean:
  - 그의 군영
  - 그의 야영지
  lexicon: LSJ
  rationale: παρεμβολή는 여기서 병력 전체보다 군사적 주둔지/진영의 구체적 이미지를 지니므로, “진영”이 문맥에 가장 가깝습니다.
- source_word: εἰς χεῖράς μου
  english_pob_choice: into my hands
  chosen_korean: 내 손에 넘겨지지
  alternatives_korean:
  - 내 손안에 들어오지
  - 내 권세 아래 들어오지
  lexicon: LSJ
  rationale: 관용구를 직역에 가깝게 살리되, 한국어에서는 수동적 결과를 드러내는 “넘겨지다”로 옮겨 통제권의 이미지를 보존했습니다.
theological_decisions:
- issue: 1절 안에서 맹세 문장이 끝나지 않는 불완전한 구문
  chosen_reading: 문장을 다음 절로 이어질 열린 조건문 형태로 유지하고, 한국어에서도 끝맺음을 닫지 않았습니다.
  alternative_readings:
  - 다음 절 내용을 끌어와 완전한 문장으로 매끄럽게 마무리함
  - 이 절만 독립된 완문으로 재구성함
  rationale: 그리스어 본문이 다음 절로 이어지는 미완성 맹세 형식이므로, 소스 형식을 가리지 않도록 한국어에서도 생략표시로 여운을 남겼습니다.
  doctrine_reference: 'PHILOSOPHY.md: original-language primacy; transparency about source form'
