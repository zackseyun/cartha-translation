  timestamp: '2026-07-13T19:39:46Z'
review_pass:
  verdict: revise
  source_fidelity: 그리스어의 미완성 맹세 구문과 다음 절로 이어지는 구조를 유지한 점은 적절합니다. 다만 ὤμοσεν은 과거 서술 동사이므로 ‘맹세하면서’보다 ‘맹세하며’ 또는 ‘맹세하고’가 더 정확하며, 현 번역의 ‘그리고 … 그리고’는 καὶ의 단순 연결을 한국어에서 부자연스럽게 중복합니다. 또한 ἐὰν ἐπιστρέψω ἐν εἰρήνῃ의 조건적 표현을 한국어에서도 ‘돌아오게 된다면’으로 보존하는 편이 안전합니다.
  naturalness: ‘분노하며 맹세하면서 말했습니다’는 두 개의 -면서 구성이 겹쳐 현대 표준 한국어로 다소 어색합니다. ‘분노하여 맹세하며 이렇게 말했습니다’가 자연스럽고, 열린 인용문 및 쉼표는 다음 절로 이어지는 미완결성을 분명히 합니다.
  terminology: ‘유다’, ‘진영’, ‘내 손에 넘겨지다’, ‘평안히 돌아오다’는 군사적·관용적 의미를 무리 없이 전달합니다. ‘진영’은 παρεμβολή의 폭을 보존합니다.
  issues:
  - severity: medium
    issue: ‘맹세하면서’의 상(相)과 문체
    rationale: ὤμοσεν은 완료된 과거의 주동사입니다. ‘맹세하면서’는 진행·동시성을 과도하게 부각하고 ‘분노하며’와 연속되어 문체상 부자연스럽습니다.
  - severity: low
    issue: 연결어 ‘그리고’의 중복
    rationale: 원문의 καὶ는 한국어에서 매번 ‘그리고’로 옮길 필요가 없습니다. 특히 인용문 안의 두 번째 ‘그리고’는 조건절의 관계를 불명료하게 합니다.
  revised_text: 그는 분노하여 맹세하며 이렇게 말했습니다. “만일 유다와 그의 진영이 지금 내 손에 넘겨지지 않고, 내가 평안히 돌아오게 된다면,”[a]
