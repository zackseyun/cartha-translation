- from: 그리고 그는 분노하며 맹세하면서 말했습니다. 「만일 유다와 그의 진영이 지금 내 손에 넘겨지지 않으면, 그리고 내가 평안히 돌아오게 되면…」[a]
  to: 그는 분노하여 맹세하며 이렇게 말했습니다. “만일 유다와 그의 진영이 지금 내 손에 넘겨지지 않고, 내가 평안히 돌아오게 된다면,”[a]
  rationale: 서술 동사 ὤμοσεν을 ‘맹세하며’로 바로 반영하고, 중복된 진행 연결을 제거했습니다. 두 조건적 요소(Ἐὰν …, ἐὰν ἐπιστρέψω)를 한국어에서도 닫히지 않은 조건 구문으로 남겨, 다음 절의 귀결절을 이 절에 보충하지 않았습니다. εἰρήνῃ는 ‘평안히’로 유지했습니다.
