  alternative_readings:
  - 다음 절 내용을 끌어와 완전한 문장으로 매끄럽게 마무리함
  - 이 절만 독립된 완문으로 재구성함
  rationale: 그리스어 본문이 다음 절로 이어지는 미완성 맹세 형식이므로, 소스 형식을 가리지 않도록 한국어에서도 생략표시로 여운을 남겼습니다.
