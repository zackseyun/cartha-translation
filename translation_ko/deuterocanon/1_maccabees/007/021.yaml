lexical_decisions:
- source_word: ἠγωνίσατο
  english_pob_choice: contended
  chosen_korean: 다투었습니다
  alternatives_korean:
  - 경쟁했습니다
  - 분투했습니다
  - 투쟁했습니다
  lexicon: BDAG
  rationale: ἀγωνίζομαι는 단순한 마음속 노력보다 어떤 자리를 두고 벌이는 적극적 대립을 뜻하므로, 여기서는 정치적·공적 갈등을 드러내는 ‘다투었습니다’가 POB의 ‘contended’를 가장 자연스럽게 옮깁니다.
- source_word: Ἄλκιμος
  english_pob_choice: Alcimus
  chosen_korean: 알키모스
  alternatives_korean:
  - 알킴
  - 알시무스
  lexicon: 표준 외래어 표기 관행
  rationale: 고유명사는 한국어 표기 관행에 따라 음역하며, Ἄλκιμος는 ‘알키모스’로 옮기는 것이 가장 무난합니다.
- source_word: ἀρχιερωσύνη
  english_pob_choice: the high priesthood
  chosen_korean: 대제사장직
  alternatives_korean:
  - 대제사장직분
  - 대제사장직위
  - 대제사장 제도
  lexicon: LSJ
  rationale: ἀρχιερωσύνη는 직분이나 지위를 가리키는 말이므로, ‘대제사장직’이 간결하면서도 제도적·공적 의미를 유지합니다.
- source_word: περὶ
  english_pob_choice: for
  chosen_korean: 두고
  alternatives_korean:
  - 위해
  - 대하여
  - 놓고
  lexicon: BDAG
  rationale: 쟁점이 되는 대상을 나타내는 περὶ의 의미를 한국어에서는 ‘~을 두고’가 자연스럽게 살립니다.
theological_decisions:
- issue: ἀρχιερωσύνη의 번역을 전통적 교회 용어와 직분 표현 중 무엇으로 둘지
  chosen_reading: ‘대제사장직’으로 번역해 직분의 성격을 직접 드러냅니다.
  alternative_readings:
  - ‘대제사장권’
  - ‘대제사장 직분’
  rationale: 본문은 신학적 설명보다 알키모스가 실제로 추구한 공적 직위를 서술하므로, 독자가 그 쟁점을 즉시 이해하도록 직분 표현을 택합니다.
  doctrine_reference: 공적 성직/직분 표현의 서술적 번역 원칙
- issue: ἠγωνίσατο의 강도
  chosen_reading: ‘다투었습니다’로 번역해 단순한 희망이 아니라 적극적 경쟁을 나타냅니다.
  alternative_readings:
  - ‘애썼습니다’
  - ‘분투했습니다’
  rationale: 문맥상 알키모스는 대제사장직을 단지 바란 것이 아니라 그것을 차지하려고 공개적으로 경쟁하고 있으므로, 강한 갈등의 뉘앙스를 유지해야 합니다.
  doctrine_reference: 서술문 맥락의 행위 강도 보존 원칙
