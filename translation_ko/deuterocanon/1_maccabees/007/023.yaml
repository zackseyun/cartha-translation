  text: And Judas saw all the evil that Alcimus and those with him had done among the sons of Israel[a], beyond even the nations.
  footnotes:
  - marker: a
    text: Or 'more than the Gentiles.' The Greek phrase means that the evil done by Alcimus and his allies surpassed that of the surrounding nations.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 유다는 알키모스와 그와 함께한 자들이 이스라엘의 아들들 가운데서 행한 온갖 악행을, 그것이 심지어 이방 민족들보다 더했음을 보았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이방인들보다 더’. 그리스어 표현은 알키모스와 그 동맹자들이 주변 민족들보다 더 큰 악을 행했다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴδεν
  english_pob_choice: saw
  chosen_korean: 보았습니다
  alternatives_korean:
  - 바라보았습니다
  - 알아보았습니다
  lexicon: LSJ
  rationale: 서술형 aorist ὁράω는 단순한 시각과 상황 인지를 함께 담을 수 있으므로, 자연스러운 과거 완결형 ‘보았습니다’가 가장 가까우면서도 무난합니다.
- source_word: ἅπαν τὴν κακίαν
  english_pob_choice: all the evil
  chosen_korean: 온갖 악행
  alternatives_korean:
  - 모든 악
  - 온전한 악행
  lexicon: LSJ
  rationale: ἅπαν의 총괄성을 살리면서 κακία의 도덕적 부정성을 한국어에서 자연스럽게 드러내기 위해 ‘온갖 악행’으로 옮겼습니다.
- source_word: ἐν υἱοῖς Ἰσραήλ
  english_pob_choice: among the sons of Israel
  chosen_korean: 이스라엘의 아들들 가운데서
  alternatives_korean:
  - 이스라엘 사람들 가운데서
  - 이스라엘 자손들 가운데서
  lexicon: LSJ
  rationale: 지리적 ‘안에서’보다 사람들 사이의 범위를 뜻하는 ‘가운데서’가 ἐν의 용법을 잘 살리며, υἱοῖς Ἰσραήλ의 직역적 형식을 유지합니다.
- source_word: ὑπὲρ τὰ ἔθνη
  english_pob_choice: beyond even the nations
  chosen_korean: 심지어 이방 민족들보다 더했음
  alternatives_korean:
  - 심지어 여러 민족들보다 더했음
  - 민족들보다도 더했음
  lexicon: LSJ
  rationale: ὑπέρ의 비교적 초과 의미를 한국어 비교구문으로 살리되, 문맥상 대조되는 집단을 ‘이방 민족들’로 풀어 자연스럽게 전달했습니다.
theological_decisions:
- issue: υἱοῖς Ἰσραήλ의 성별·집합성 보존
  chosen_reading: ‘이스라엘의 아들들’이라는 직역적 형식을 유지했습니다.
  alternative_readings:
  - ‘이스라엘 사람들’처럼 중립 집합명사로 완화하는 방식
  - ‘이스라엘 자손들’로 공동체적 표현을 택하는 방식
  rationale: 원문이 남성 복수의 친족-언약 표현을 쓰므로, 문맥이 허락하는 한 이를 평탄화하지 않고 보존하는 것이 본문 감각을 더 잘 드러냅니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: τὰ ἔθνη의 대조 효과
  chosen_reading: ‘이방 민족들’로 옮겨 이스라엘과의 대비를 분명히 했습니다.
  alternative_readings:
  - ‘민족들’
  - ‘이방인들’
  rationale: 이 문맥에서는 단순한 지리적 민족 집단보다 유대 공동체와 대조되는 이방 세력을 가리키므로, 독자가 대비를 즉시 이해하도록 ‘이방 민족들’을 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1
