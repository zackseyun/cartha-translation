  - 왕좌에 올랐습니다
  - 즉위했습니다
  lexicon: LSJ
  rationale: 직역상 ‘앉다’이지만 즉위의 함의를 지니므로, 본문은 원어의 표현을 살리되 왕권 취임의 의미는 문맥이 전달하도록 했습니다.
- source_word: θρόνου βασιλείας αὐτοῦ
  english_pob_choice: the throne of his kingdom
  chosen_korean: 자기 왕국의 왕좌
  alternatives_korean:
  - 그의 왕국의 왕좌
  - 그의 왕권의 왕좌
  - 자기 왕권의 왕좌
  lexicon: LSJ
  rationale: 직역 구조를 유지하면서도 한국어에서 소유 관계를 분명히 하기 위해 ‘자기 왕국의 왕좌’로 옮겼습니다. ‘왕좌’는 θρόνος의 기본 의미를 직접 반영합니다.
