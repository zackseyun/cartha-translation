lexical_decisions:
- source_word: αἱ δυνάμεις
  english_pob_choice: the forces
  chosen_korean: 그들의 군대
  alternatives_korean:
  - 그들의 병력
  - 그들의 군사들
  - 그들의 무력
  lexicon: LSJ
  rationale: 전투 서술 문맥에서 δυνάμεις는 추상적 ‘권세’가 아니라 무장한 군사 세력을 가리키므로, 한국어에서는 자연스럽고 구체적인 ‘군대’로 옮겼습니다.
- source_word: ἀπέκτειναν
  english_pob_choice: killed
  chosen_korean: 죽였고
  alternatives_korean:
  - 처형했고
  - 죽이고
  - 살해했고
  lexicon: LSJ
  rationale: 동사는 단순히 ‘죽이다’를 뜻하므로, Greek의 직접적 의미를 유지하면서도 현대 한국어로 자연스러운 ‘죽였고’를 선택했습니다.
- source_word: ἐκάθισεν
  english_pob_choice: sat
  chosen_korean: 앉았습니다
