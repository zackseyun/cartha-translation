  text: 그가 전투에서 맨 먼저 쓰러졌습니다. 그런데 그의 진영이 니카노르가 쓰러진 것을 보고는, 무기를 내던지고 달아났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
