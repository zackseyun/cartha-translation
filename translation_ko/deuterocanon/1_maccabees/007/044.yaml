lexical_decisions:
- source_word: ἔπεσεν αὐτὸς πρῶτος ἐν τῷ πολέμῳ
  english_pob_choice: he himself fell first in the battle
  chosen_korean: 그가 전투에서 맨 먼저 쓰러졌습니다
  alternatives_korean:
  - 그 자신이 전투에서 먼저 쓰러졌습니다
  - 그가 전투 중 첫 번째로 쓰러졌습니다
  lexicon: LSJ
  rationale: ἔπεσεν은 전투 문맥에서 단순히 ‘쓰러지다’로 옮기면 죽음의 함의를 과도하게 덧붙이지 않으면서도 원문의 직설성을 살릴 수 있습니다. πρῶτος의 순서 강조는 ‘맨 먼저’로 자연스럽게 드러냈습니다.
- source_word: ἡ παρεμβολὴ αὐτοῦ
  english_pob_choice: his camp
  chosen_korean: 그의 진영
  alternatives_korean:
  - 그의 군영
  - 그의 부대
  - 그의 캠프
  lexicon: LSJ
  rationale: παρεμβολή는 여기서 단순한 장소보다 군사 집단을 가리키므로, 현대 한국어에서 군사적 집단성을 살리는 ‘진영’이 적절합니다. POB의 ‘camp’보다 문맥상 더 자연스럽지만, 집결된 군대라는 뜻을 유지합니다.
- source_word: ῥίψαντες τὰ ὅπλα αὐτῶν
  english_pob_choice: they threw down their weapons
  chosen_korean: 무기를 내던지고
  alternatives_korean:
  - 무기를 내팽개치고
  - 무기를 버리고
  lexicon: LSJ
  rationale: ῥίπτω는 ‘던지다’의 강한 동작이어서, 단순한 ‘버리다’보다 ‘내던지고’가 공포 속의 급박함을 더 잘 드러냅니다. ὅπλα는 군사 문맥에서 ‘무기’가 가장 직접적입니다.
- source_word: ἔφυγον
  english_pob_choice: fled
  chosen_korean: 달아났습니다
  alternatives_korean:
  - 도망갔습니다
  - 도주했습니다
  lexicon: LSJ
  rationale: 군사적 패주를 나타내는 동사이므로 ‘달아나다’가 자연스럽고, 문장의 흐름상 직역보다 서술형으로 매끄럽습니다.
theological_decisions:
- issue: 전투 패배의 서술을 죽음과 분리해 표현할지 여부
  chosen_reading: ‘쓰러졌습니다’로 옮겨, 전투에서의 패배/전사 가능성을 암시하되 본문이 직접 말하는 범위를 넘지 않았습니다.
  alternative_readings:
  - ‘죽었습니다’로 명시하기
  - ‘전사했습니다’로 해석하기
  rationale: 본문은 단지 그가 먼저 ‘떨어졌다/쓰러졌다’고 말하며, 뒤 문맥에서 적군의 패주를 서술합니다. 한국어 번역도 원문의 절제된 진술을 유지하는 편이 더 source-grounded합니다.
  doctrine_reference: source-text restraint
