base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/022.yaml
  text: And all those who were troubling their people gathered to him[a], and they gained control of the land of Judah, and they inflicted a great blow in Israel.
  footnotes:
  - marker: a
    text: Or 'among Israel.' The Greek phrase ἐν Ἰσραήλ can denote the blow's occurrence within the people of Israel rather than a geographic reference alone.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 백성을 어지럽히던 자들이 모두 그에게로 모였고, 유다 땅을 장악하였으며, 이스라엘에 큰 타격을 입혔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘에’는 ‘이스라엘 가운데’ 또는 ‘이스라엘 안에서’로도 옮길 수 있습니다. 그리스어 ἐν Ἰσραήλ은 타격이 이스라엘 공동체 안에서 일어났음을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν πρὸς αὐτόν
  english_pob_choice: gathered to him
  chosen_korean: 그에게로 모였고
  alternatives_korean:
  - 그에게로 모였으며
  - 그에게로 집결했고
  - 그에게로 모여들었고
  lexicon: LSJ
  rationale: πρός + 대격은 어떤 인물 쪽으로 모여 합류하는 움직임을 나타내므로, 자연스러운 한국어로 ‘그에게로 모였고’라고 옮겨 집단적 합류를 살렸습니다.
- source_word: πάντες οἱ ταράσσοντες τὸν λαὸν αὐτῶν
  english_pob_choice: all those who were troubling their people
  chosen_korean: 자기 백성을 어지럽히던 자들이 모두
  alternatives_korean:
  - 자기 백성을 괴롭히던 자들이 모두
  - 자기 백성을 소란하게 하던 자들이 모두
  - 그 백성을 어지럽히던 자들이 모두
  lexicon: LSJ
  rationale: ταράσσω는 단순한 ‘방해’보다 혼란과 동요를 일으키는 뜻이 강하므로, ‘어지럽히다’가 문맥의 동요성을 가장 잘 드러냅니다.
- source_word: κατεκράτησαν γῆν Ἰούδα
  english_pob_choice: they gained control of the land of Judah
  chosen_korean: 유다 땅을 장악하였으며
  alternatives_korean:
  - 유다 땅을 점령하였으며
  - 유다 땅을 차지하였으며
  - 유다 땅을 지배하였으며
  lexicon: LSJ
  rationale: κατακρατέω는 단순 소유보다 우세하게 눌러 통제하는 의미가 있어, 영토에 대한 실효적 지배를 살리는 ‘장악하다’가 적절합니다.
- source_word: ἐποίησαν πληγὴν μεγάλην
  english_pob_choice: they inflicted a great blow
  chosen_korean: 큰 타격을 입혔습니다
  alternatives_korean:
  - 큰 상처를 입혔습니다
  - 큰 해를 끼쳤습니다
  - 큰 피해를 입혔습니다
  lexicon: LSJ
  rationale: πληγή는 문자적 ‘때림’에서 확장된 재난·타격의 의미를 가질 수 있으므로, 직역의 어색함을 피하면서도 은유적 강도를 살린 ‘큰 타격’으로 옮겼습니다.
- source_word: ἐν Ἰσραήλ
  english_pob_choice: in Israel
  chosen_korean: 이스라엘에
  alternatives_korean:
  - 이스라엘 가운데
  - 이스라엘 안에서
  - 이스라엘 가운데서
  lexicon: LSJ
  rationale: ἐν Ἰσραήλ은 지리적 위치뿐 아니라 이스라엘 공동체 내부를 가리킬 수 있으므로, 본문은 가장 중립적인 ‘이스라엘에’로 두었습니다.
theological_decisions:
- issue: 본문이 유다 땅과 이스라엘을 동시에 언급하는 방식
  chosen_reading: 유다 땅에 대한 군사적 장악과 이스라엘 내부에 대한 중대한 타격을 함께 말하는 것으로 읽었습니다.
  alternative_readings:
  - ‘이스라엘’은 단순한 지리적 표지일 수 있습니다.
  - ‘큰 타격’은 학살이나 전멸의 완곡어일 수 있습니다.
  rationale: 그리스어는 영토 장악(γῆν Ἰούδα)과 공동체 내부 피해(ἐν Ἰσραήλ)를 구별해 말하므로, 한국어도 두 층위를 구분해 표현했습니다.
  doctrine_reference: 문맥상 역사 서술; 별도 교리 쟁점 없음
