translation:
  language: ko
  text: 그들은 그들의 말을 귀담아듣지 않았습니다[a]. 보십시오[b]. 그들이 큰 군세를 이끌고 왔기 때문입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 말에 주의를 기울이지 않았습니다.’
    reason: lexical_alternative
  - marker: b
    text: 그리스어의 ἴδου는 주의를 환기하는 표현으로, 여기서는 ‘보십시오’로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘큰 군세’는 여기서 상당한 무장 병력이나 군사력을 가리키는 것으로 보입니다.
    reason: cultural_note
lexical_decisions:
- source_word: οὐ προσεῖχον
  english_pob_choice: did not pay attention
  chosen_korean: 주의를 기울이지 않았습니다
  alternatives_korean:
  - 그들의 말을 듣지 않았습니다
  - 귀를 기울이지 않았습니다
  - 그들의 말을 무시했습니다
  lexicon: LSJ
  rationale: προσέχω + 여격은 ‘주의를 기울이다, 유의하다, 귀담아듣다’의 뜻이므로, 현대 한국어에서 자연스럽고 의미를 넓게 보존하는 표현을 택했습니다.
- source_word: τοῖς λόγοις αὐτῶν
  english_pob_choice: to their words
  chosen_korean: 그들의 말에
  alternatives_korean:
  - 그들이 한 말에
  - 그들의 발언에
  lexicon: LSJ
  rationale: λόγοι는 여기서 발화의 내용인 ‘말’로 이해하는 것이 가장 직접적이어서, 문맥을 과도하게 풀이하지 않고 옮겼습니다.
- source_word: ἴδου γὰρ
  english_pob_choice: for behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오,
  - 보십시오—
  lexicon: LSJ
  rationale: ἴδου는 주의를 환기하는 감탄사이므로, 합쇼체 본문에 맞게 ‘보십시오’로 처리해 원문의 촉구 효과를 살렸습니다.
- source_word: μετὰ δυνάμεως πολλῆς
  english_pob_choice: with great force
  chosen_korean: 큰 군세를 거느리고
  alternatives_korean:
  - 큰 힘으로
  - 막강한 세력을 가지고
  - 대군을 이끌고
  lexicon: LSJ
  rationale: δύναμις는 여기서 추상적 ‘힘’보다 군사적 역량/병력을 가리키므로, 문맥상 ‘군세’로 옮겨 군사적 긴장을 드러냈습니다.
theological_decisions:
- issue: μετὰ δυνάμεως πολλῆς의 의미 범위
  chosen_reading: 군사적 ‘군세’로 이해해, 단순한 추상적 힘이 아니라 무장한 병력의 위압을 드러냈습니다.
  alternative_readings:
  - 큰 힘을 가지고
  - 막강한 권세와 함께
  rationale: 이 문맥은 협상이나 말의 진정성을 판단하는 장면이 아니라, 실제로 동반된 무력의 규모를 설명하므로 군사적 뉘앙스를 살리는 것이 본문 의미에 더 충실합니다.
  doctrine_reference: 문맥 주해 원칙
