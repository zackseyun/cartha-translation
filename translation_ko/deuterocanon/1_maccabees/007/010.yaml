  text: And he departed and came into the land of Judah with a large force[a], and he sent messengers to Judas and to his brothers with peaceful words, but with deceit.
  footnotes:
  - marker: a
    text: Or 'words of peace ... with guile.' The Greek contrasts outwardly peaceful speech with deceptive intent.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 떠나 유다 땅으로 많은 군대를 거느리고 왔습니다. 그리고 유다와 그의 형제들에게 평화로운 말들을 전했지만, 속셈은 속임수였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘평화의 말들… 속임수와 함께’입니다. 그리스어는 겉으로는 평화로운 말과 실제 의도의 기만을 대조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἀπῆλθεν καὶ ἦλθεν
  english_pob_choice: And he departed and came
  chosen_korean: 그는 떠나 … 왔습니다
  alternatives_korean:
  - 그는 떠나고 왔습니다
  - 그는 출발하여 도착했습니다
  lexicon: LSJ
  rationale: ἀπῆλθεν/ἦλθεν의 연속된 동작을 한국어에서도 간결한 서술로 살려, 이동의 순서를 자연스럽게 드러냈습니다.
- source_word: μετὰ δυνάμεως πολλῆς
  english_pob_choice: with a large force
  chosen_korean: 많은 군대를 거느리고
  alternatives_korean:
  - 큰 힘과 함께
  - 대군을 이끌고
  lexicon: LSJ
  rationale: δύναμις는 이 군사 문맥에서 추상적 ‘권세’보다 병력/군세를 가리키므로, ‘군대’를 써서 군사적 의미를 분명히 했습니다.
- source_word: γῆν Ἰούδα
  english_pob_choice: the land of Judah
  chosen_korean: 유다 땅으로
  alternatives_korean:
  - 유다의 땅으로
  - 유다 지방으로
  lexicon: LSJ
  rationale: γῆ가 포함된 지리 표현이므로 ‘땅’을 유지해 영문의 audit trail과 원문의 영토적 의미를 반영했습니다.
- source_word: λόγους εἰρηνικοὺς μετὰ δόλου
  english_pob_choice: peaceful words, but with deceit
  chosen_korean: 평화로운 말들을 전했지만, 속셈은 속임수였습니다
  alternatives_korean:
  - 평화의 말들을 전했지만, 속임수가 있었습니다
  - 평화로운 말들을 하였으나, 기만이 있었습니다
  lexicon: LSJ
  rationale: λόγους εἰρηνικοὺς의 외양상 평화로운 발화와 μετὰ δόλου의 내면적 기만을 함께 드러내기 위해, ‘속셈’과 ‘속임수’를 병치했습니다.
theological_decisions:
- issue: 외형상 평화와 실제 의도의 대비
  chosen_reading: 겉으로는 평화로운 말을 했지만 실제로는 속임수가 있었습니다.
  alternative_readings:
  - 평화의 말을 전했으나, 기만이 있었습니다
  - 평화로운 말들이었지만, 간계가 있었습니다
  rationale: 그리스어는 평화로운 내용과 deceitful intent를 대조하므로, 단순한 중립적 전달이 아니라 의도상의 반전을 한국어에서도 분명히 보여 주어야 합니다.
  doctrine_reference: 서술상의 대조와 인간의 기만성
