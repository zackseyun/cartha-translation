  text: And they pursued them for a day's journey from Adasa until they came to Gazera[a], and they sounded the signal trumpets behind them.
  footnotes:
  - marker: a
    text: Or 'they blew the trumpets of signals behind them.' The Greek phrase can be rendered more formally, but 'signal trumpets' communicates the military sense more clearly in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 아다사에서 가제라에 이르기까지 하루 길이로 그들을 추격했고, 그 뒤를 따라 신호용 나팔들을 불었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “신호의 나팔들을 뒤따라 불었습니다.” 그리스어 표현은 더 문자적으로도 옮길 수 있지만, 본문은 군사 신호의 기능을 분명히 하는 쪽이 적절합니다.
    reason: lexical_alternative
