translation:
  language: ko
  text: 그리고 군대들이 아달월 열셋째 날에 전투를 벌였으며, 니카노르의 군대는 산산이 무너졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἱ παρεμβολαὶ
  english_pob_choice: the camps
  chosen_korean: 군대들
  alternatives_korean:
  - 진영들
  - 야영지들
  - 부대들
  lexicon: LSJ
  rationale: παρεμβολή는 문자적으로는 ‘진영/야영지’이지만, 여기서는 실제 군사 주체를 가리키므로 한국어에서는 복수성을 살린 ‘군대들’이 가장 자연스럽고 의미도 분명합니다.
- source_word: συνῆψαν εἰς πόλεμον
  english_pob_choice: joined battle
  chosen_korean: 전투를 벌였으며
  alternatives_korean:
  - 전투에 합류했으며
  - 싸움에 들어갔으며
  - 전투에 돌입했으며
  lexicon: LSJ
  rationale: συνάπτω의 군사적 용법은 단순한 ‘함께하다’가 아니라 맞붙어 싸우다의 뜻이므로, 사건의 개시를 살리되 과도하게 직역하지 않은 표현으로 옮겼습니다.
- source_word: τῇ τρισκαιδεκάτῃ τοῦ μηνὸς Ἀδάρ
  english_pob_choice: on the thirteenth day of the month Adar
  chosen_korean: 아달월 열셋째 날
  alternatives_korean:
  - 아달월 13일
  - 아달월 열세째 날
  - 아달 달의 열셋째 날
  lexicon: LSJ
  rationale: 달력 표현이므로 한국어 독자가 바로 이해할 수 있게 ‘열셋째 날’로 풀되, חודש에 해당하는 ‘월’을 붙여 원문의 날짜 표지를 유지했습니다.
- source_word: συνετρίβη
  english_pob_choice: was crushed
  chosen_korean: 무너졌습니다
  alternatives_korean:
  - 산산이 부서졌습니다
  - 꺾였습니다
  - 패배했습니다
  lexicon: LSJ
  rationale: συντρίβω는 단순 패배보다 더 강한 ‘부서짐/붕괴’의 뉘앙스를 지니므로, 결과의 결정성과 참패의 강도를 살리는 ‘무너졌습니다’를 선택했습니다.
