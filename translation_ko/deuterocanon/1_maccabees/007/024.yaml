base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/024.yaml
  text: And he went out into all the borders of Judea and the surrounding region[a], and he took vengeance on the men and on those who had deserted[c][b], and they were prevented from going into the country.
  footnotes:
  - marker: a
    text: Or 'the surrounding areas.' The Greek adverb κυκλόθεν broadens the scope beyond Judea's borders proper.
    reason: lexical_alternative
  - marker: b
    text: Or 'those who had defected' or 'the deserters.' The Greek refers to people who had gone over to the other side.
    reason: lexical_alternative
  - marker: c
    text: Or 'from entering the region/land.' The Greek χώρα can mean 'country,' 'land,' or 'region.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 유대의 모든 경계와 그 주변 지역[a]으로 나아가, 남자들과 이탈한 사람들[b]에게 보복을 가했으며, 그들은 그 땅[c]으로 들어가지 못하게 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주변 지역’은 κυκλόθεν이 유대의 경계 밖 둘레까지 범위를 넓히는 뜻을 반영한 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이탈한 사람들’은 αὐτομολήσασιν의 ‘상대편으로 넘어간 사람들’, ‘탈주하거나 이탈한 사람들’이라는 뜻을 반영한 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그 땅’은 χώρα가 ‘나라’, ‘땅’, ‘지역’으로 넓게 쓰일 수 있음을 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  english_pob_choice: went out
