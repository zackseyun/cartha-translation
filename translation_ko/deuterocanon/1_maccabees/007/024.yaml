  lexicon: BDAG
  rationale: 직역투보다 한국어에서 자연스러운 보복 표현을 택하되, 원문의 응징·복수 행위를 약화시키지 않도록 했습니다.
- source_word: τοῖς αὐτομολήσασιν
  english_pob_choice: those who had deserted
  chosen_korean: 이탈한 자들
  alternatives_korean:
  - 도망한 자들
  - 배반한 자들
  - 전향한 자들
  lexicon: BDAG
  rationale: αὐτομολέω의 ‘상대편으로 이탈하다/도망하다’ 의미를 살리면서, 문맥상 정치·군사적 이탈을 가장 중립적으로 드러내는 표현을 선택했습니다.
- source_word: ἐνεστάλησαν τοῦ πορεύεσθαι εἰς χώραν
  english_pob_choice: were prevented from going into the country
  chosen_korean: 그들은 그 땅으로 들어가는 것이 막혔습니다
  alternatives_korean:
  - 그 땅에 들어가지 못하게 되었습니다
  - 그 나라로 가는 것이 저지되었습니다
  lexicon: BDAG
  rationale: 수동형의 방해·저지 의미를 자연스럽게 옮기고, χώρα를 문맥상 ‘땅’으로 번역해 팔레스타인 지역 전체를 가리키는 넓은 범위를 유지했습니다.
theological_decisions:
- issue: ἐκδίκησις의 정서적 강도와 법적 뉘앙스
  chosen_reading: 보복으로 옮겨, 개인적 감정의 복수이면서도 공적 응징의 강도를 함께 드러냈습니다.
  alternative_readings:
  - 징벌로 완화해 번역할 수 있음
  - 원수를 갚다로 더 관용적으로 옮길 수 있음
  rationale: 맥락상 단순한 처벌보다 적대자에 대한 응징 성격이 강하므로, 의미를 희석하지 않는 표현을 택했습니다.
  doctrine_reference: 성서 서술의 역사적·군사적 응징 표현
