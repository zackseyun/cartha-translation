  lexicon: BDAG / LSJ
  rationale: ὅρια의 경계·영역 의미와 κυκλόθεν의 ‘주변/사방’ 확장을 함께 살려, 유대 내부와 바깥 둘레까지 포괄하는 범위를 드러냅니다.
- source_word: ἐποίησεν ἐκδίκησιν
  english_pob_choice: took vengeance
  chosen_korean: 보복하였으며
  alternatives_korean:
