  text: So crush this camp before us today[a], and let the rest know that he has spoken wickedly against your holy things; judge him according to his wickedness.
  footnotes:
  - marker: a
    text: Or 'against your sanctuary.' The Greek literally says 'against your holy things' (plural), which may refer broadly to what is sacred to God, including the sanctuary.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이 진을 오늘 우리 앞에서 무너뜨리시고, 남은 자들이 그가 주님의 거룩한 것들에 대하여 악하게 말한 것을 알게 하십시오. 그리고 그의 악함에 따라 그를 심판하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 직역하면 ‘주님의 거룩한 것들’입니다. 여기에는 성소뿐 아니라 하나님께 속한 신성한 것들이 넓게 포함될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σύντριψον
  english_pob_choice: crush
  chosen_korean: 무너뜨리시고
  alternatives_korean:
  - 짓부수시고
  - 산산이 부수시고
  - 꺾어 버리시고
  lexicon: LSJ
  rationale: 전투적 파괴와 심판의 강도를 살리면서도 현대 한국어에서 자연스럽고 공식적인 명령형으로 옮겼습니다.
- source_word: παρεμβολὴν
  english_pob_choice: camp
  chosen_korean: 진
  alternatives_korean:
  - 진영
  - 야영지
  - 군대
  lexicon: LSJ
  rationale: 군사적 ‘camp’의 뜻을 살리되, 문맥상 한국어 성경에서 자연스러운 ‘진’을 택했습니다.
- source_word: τὰ ἅγιά σου
  english_pob_choice: your holy things
  chosen_korean: 주님의 거룩한 것들
  alternatives_korean:
  - 주님의 성소
  - 주님의 거룩한 곳
  - 주님의 성물
  lexicon: LSJ
  rationale: 그리스어 복수형을 유지해 단일 건물인 ‘성소’로 좁히지 않고, 신성한 대상 전반을 가리키는 넓은 뜻을 살렸습니다.
- source_word: κακῶς ἐλάλησεν
  english_pob_choice: has spoken wickedly
  chosen_korean: 악하게 말한
  alternatives_korean:
  - 악한 말을 한
  - 악을 말한
  - 사악하게 말한
  lexicon: LSJ
  rationale: 도덕적 비난을 분명히 하면서도, 한국어에서 과도하게 문어적인 표현은 피했습니다.
theological_decisions:
- issue: ἐπίλοιποι의 대상과 αριθμός(수)의 유지
  chosen_reading: ‘남은 자들’로 옮겨, 남아 있는 이들이 이 일을 알게 하라는 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘그 나머지’
  - ‘살아남은 자들’
  - ‘남은 군사들’
  rationale: 본문은 집단적 적대 세력 안에서 남은 자들을 가리키지만, 영어 POB처럼 ‘survivors’로 좁히지 않고 원문의 넓은 지시를 유지했습니다.
  doctrine_reference: 원문 수사와 지시 대상을 과도하게 특정하지 않음
- issue: κρῖνον αὐτὸν의 법정적 뉘앙스
  chosen_reading: ‘그를 심판하십시오’로 옮겨, 하나님께 드리는 재판적 간구를 분명히 했습니다.
  alternative_readings:
  - ‘그를 판단하십시오’
  - ‘그에게 판결을 내리십시오’
  - ‘그를 정죄하십시오’
  rationale: 문맥은 단순한 평가가 아니라 보응을 구하는 청원입니다. 한국어 ‘심판하다’가 이 재판적·보응적 뉘앙스를 가장 잘 드러냅니다.
  doctrine_reference: 보응과 심판에 대한 성서적 기도 어법
