  source_fidelity: 핵심 의미와 단수 ‘그’를 잘 보존했으며, τὰ ἅγια의 복수성과 넓은 지시 범위도 각주로 적절히 처리했습니다. 다만 οὕτως는 인과를 뜻하는 ‘그러므로’보다 방식·결과를 나타내는 ‘이와 같이’가 더 직접적입니다. 또한 σύντριψον은 단순히 무너지게 한다는 뜻보다 निर्ण정적인 파괴를 뜻하므로 ‘짓부수십시오’가 더 충실합니다.
  naturalness: 현대 합쇼체 문장으로 전반적으로 자연스럽지만, ‘악하게 말한 것’은 다소 어색합니다. ‘악한 말을 한 사실’이 자연스럽고 도덕적 비난의 뜻도 분명히 전달합니다. 세 청원을 한 문장 안에서 연결하면 원문의 기도체 흐름도 더 잘 살아납니다.
