  yaml_path: translation/deuterocanon/1_maccabees/007/025.yaml
  text: But when Alcimus saw that Judas and those with him had grown strong[a], and realized that he was not able to withstand them, he returned to the king and brought wicked charges against them.
  footnotes:
  - marker: a
    text: Greek manuscripts as printed here read literally, 'he knew that he was able to withstand them.' The context strongly suggests the sense 'he was not able to withstand them,' which is followed in the translation.
    reason: textual_variant
translation:
  language: ko
  text: 그런데 알키모스가 유다가 자기와 함께한 이들이 강해진 것과, 그들을 대적해 버틸 수 없다는 것을 보고, 왕에게 돌아가 그들에 대해 악한 말로 고발하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서는 전승된 그리스어가 문자적으로는 ‘그가 그들을 대적할 수 있다고 알았다’고 읽히지만, 문맥상 ‘그들을 대적해 버틸 수 없다는 것을 알았다’는 뜻이 분명합니다.
    reason: textual_variant
lexical_decisions:
- source_word: ὡς δὲ ἴδεν
  english_pob_choice: But when ... saw
  chosen_korean: 그런데 ... 보고
  alternatives_korean:
  - 그리고 ... 보고
  - 또 ... 보고
  lexicon: LSJ
  rationale: δὲ의 전환감을 살리되, 한국어에서는 자연스러운 서술 전환인 ‘그런데’가 적절합니다.
- source_word: ἐνίσχυσεν
  english_pob_choice: had grown strong
  chosen_korean: 강해진 것
  alternatives_korean:
  - 강해진 사실
  - 힘을 얻은 것
  - 세력을 얻은 것
  lexicon: LSJ
  rationale: 문맥상 유다와 동료들이 힘을 회복해 우세해진 상태를 가리키므로, ‘강해진 것’이 간결하고 직역에 가깝습니다.
- source_word: δύναται ὑποστῆναι αὐτούς
  english_pob_choice: he was not able to withstand them
  chosen_korean: 그들을 대적해 버틸 수 없다는 것
  alternatives_korean:
  - 그들을 견디고 맞설 수 없다는 것
  - 그들 앞에 설 수 없다는 것
  lexicon: LSJ
  rationale: 본문의 전승형은 문자적으로는 모순되지만 영어 POB의 검토처럼 문맥상 ‘버틸 수 없다’는 뜻이 요구되므로, 그 의미를 한국어로 분명히 드러냈습니다.
- source_word: κατηγόρησεν αὐτῶν πονηρά
  english_pob_choice: brought wicked charges against them
  chosen_korean: 그들에 대해 악한 말로 고발하였습니다
  alternatives_korean:
  - 그들에 대해 악한 고발을 하였습니다
  - 그들을 악의적으로 고발하였습니다
  - 그들에 대해 악한 혐의를 제기하였습니다
  lexicon: LSJ
  rationale: κατηγορέω의 고발/비난 성격과 πονηρά의 도덕적 평가를 함께 살리되, 한국어에서 자연스러운 법정·비난 표현으로 옮겼습니다.
theological_decisions:
- issue: 본문의 ‘δύναται ὑποστῆναι αὐτούς’가 문맥상 불가능 의미를 요구하는 문제
  chosen_reading: 직역의 모순을 그대로 두지 않고, 문맥이 요구하는 ‘그들을 대적해 버틸 수 없다’는 뜻으로 번역했습니다.
  alternative_readings:
  - 문자형을 따라 ‘그들을 대적할 수 있다’로 옮김
  rationale: 알키모스가 곧바로 왕에게 돌아가는 서술 흐름상, 이 구절은 명백히 능력 부정의 의미로 이해되어야 합니다. POB의 감수 결론을 한국어 본문에 반영하되, 전승상의 긴장은 설명으로 보존합니다.
  doctrine_reference: 본문의 문맥 우선 원칙과 본문비평적 투명성
