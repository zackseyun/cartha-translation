  text: And they established that this day should be observed year by year, on the thirteenth day of Adar.
translation:
  language: ko
  text: 그리고 그들은 이 날을 해마다 지키기로 정하였는데, 곧 아달월 열셋째 날입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지키기로’는 여기서 단순한 행사보다 해마다 반복되는 준수를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησαν
  english_pob_choice: they established
  chosen_korean: 정하였는데
  alternatives_korean:
  - 설립하였는데
  - 제정하였는데
  - 확정하였는데
  lexicon: LSJ
  rationale: 이 동사는 여기서 연례적 준수를 제정하는 뜻이므로, 한국어로는 관습을 세웠다는 의미의 ‘정하다’가 가장 자연스럽고 원문의 제정성을 잘 드러냅니다.
- source_word: τοῦ ἄγειν
  english_pob_choice: should be observed
  chosen_korean: 지키기로
  alternatives_korean:
  - 기념하기로
  - 지키도록
  - 축하하기로
  lexicon: LSJ
  rationale: 연례 행사로 날짜를 ‘행하다’는 뜻이므로, 과도한 축하 뉘앙스를 피하면서도 관례적 준수를 나타내는 ‘지키다’가 적절합니다.
- source_word: κατʼ ἐνιαυτόν
  english_pob_choice: year by year
  chosen_korean: 해마다
  alternatives_korean:
  - 매년
  - 해마다마다
  lexicon: LSJ
  rationale: 해마다 반복되는 주기를 간결하게 살리는 관용 표현입니다.
- source_word: τῇ τρισκαιδεκάτῃ τοῦ Ἀδάρ
  english_pob_choice: on the thirteenth day of Adar
  chosen_korean: 아달월 열셋째 날
  alternatives_korean:
  - 아달월 열세째 날
  - 아달월 십삼일
  - 아달의 열셋째 날
  lexicon: LSJ
  rationale: 달 이름은 음역하고, 날짜는 한국어 관용에 맞게 ‘열셋째 날’로 옮겨 날짜 표지를 분명히 했습니다.
theological_decisions:
- issue: 연례 기념의 성격
  chosen_reading: 이 절은 특정 사건을 해마다 지키도록 공동체가 제정한 날을 말하며, 번역에서는 그 규범성을 살려 ‘지키기로 정하였는데’로 처리했습니다.
  alternative_readings:
  - ‘축하하기로 정하였는데’
  - ‘기념하기로 정하였는데’
  rationale: 원문 ἄγειν은 단순한 잔치보다 ‘기념하여 지키다’에 가깝기 때문에, 축하를 과도하게 강조하지 않는 번역이 더 정확합니다.
  doctrine_reference: 공동체적 기념일 제정
- issue: 달 이름의 표기
  chosen_reading: Ἀδάρ은 고유명사로 음역하여 ‘아달월’로 표기했습니다.
  alternative_readings:
  - ‘아달’
  - ‘아다르’
  rationale: 월 이름은 번역하지 않고 음역하는 것이 원문 고유명사성을 보존하며, 한국어 문맥에서는 월을 밝혀 ‘아달월’로 쓰는 것이 분명합니다.
  doctrine_reference: 고유명사 표기 원칙
