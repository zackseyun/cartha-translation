  lexicon: LSJ
  rationale: ἐκδίκησις의 보복/복수 의미를 살리면서, 한국어에서 가장 직접적인 동사구로 옮겼습니다.
theological_decisions:
- issue: τὸν ἀσεβῆ의 평가적 표현 처리
  chosen_reading: 알키모스를 ‘불경한’ 사람으로 직접 규정했습니다.
  alternative_readings:
  - ‘악한 알키모스’로 완화할 수 있습니다.
  - ‘경건하지 않은’으로 더 중립적으로 옮길 수 있습니다.
  rationale: 본문의 서술자는 알키모스에 대한 도덕적·종교적 판단을 분명히 하고 있으므로, 이를 약화하지 않는 번역이 적절합니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: ἐν τοῖς υἱοῖς Ἰσραήλ의 방향성
  chosen_reading: ‘이스라엘 자손에게’로 번역해 복수의 대상성을 분명히 했습니다.
  alternative_readings:
  - ‘이스라엘 자손 가운데’
  - ‘이스라엘 자손 안에서’
  rationale: 문맥상 복수는 이스라엘을 향한 행위이므로, 한국어에서는 목적어 표지를 드러내어 오해를 줄이는 것이 자연스럽습니다.
  doctrine_reference: Translation philosophy §1, §5
