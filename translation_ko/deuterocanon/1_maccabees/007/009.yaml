base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/009.yaml
  text: And he sent him and Alcimus the ungodly[a], and established the priesthood for him[b], and commanded him to carry out vengeance on the sons of Israel.
  footnotes:
  - marker: a
    text: Or 'appointed him to the priesthood.' The Greek literally says 'established the priesthood for him,' referring to Alcimus's installation in priestly office.
    reason: lexical_alternative
  - marker: b
    text: Or 'against the sons of Israel.' The preposition may be understood as indicating the people within whom the vengeance was to be carried out, with hostile force implied by the context.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 그와 불경한 알키모스를 보냈고, 그를 위해 제사장직을 세워 주었으며, 이스라엘 자손에게 복수를 행하라고 그에게 명령했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게 제사장직을 임명했다.’ 그리스어는 문자적으로 ‘그를 위해 제사장직을 세웠다’라고 말하며, 문맥상 알키모스를 제사장 직무에 설치한 것을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이스라엘 자손에게.’ 전치사 ἐν은 여기서 복수의 대상 범위를 나타내는 것으로 이해할 수도 있지만, 문맥상 적대적 행위의 대상임이 분명합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπέστειλεν
  english_pob_choice: sent
  chosen_korean: 보냈고
  alternatives_korean:
  - 파견했고
  - 보냈습니다
  lexicon: LSJ
  rationale: 서술문에서 자연스럽고 간명한 대응으로, 군사·정치적 맥락의 ‘보내다’ 의미를 살렸습니다.
- source_word: τὸν ἀσεβῆ
  english_pob_choice: the ungodly
  chosen_korean: 불경한
  alternatives_korean:
  - 경건하지 않은
  - 악한
  lexicon: LSJ
  rationale: ἀσεβής의 종교적·도덕적 비난을 반영해, 단순한 도덕성보다 하나님에 대한 불경을 드러내는 표현으로 옮겼습니다.
- source_word: ἔστησαν αὐτῷ τὴν ἱερωσύνην
  english_pob_choice: established the priesthood for him
  chosen_korean: 그를 위해 제사장직을 세워 주었으며
  alternatives_korean:
  - 그에게 제사장직을 세웠으며
  - 그를 제사장직에 임명했으며
  lexicon: LSJ
  rationale: 직역의 구조를 유지하되 한국어에서 이해되도록 ‘그를 위해’와 ‘세워 주다’를 사용해 설치·부여의 의미를 살렸습니다.
- source_word: ποιῆσαι τὴν ἐκδίκησιν
  english_pob_choice: to carry out vengeance
  chosen_korean: 복수를 행하라고
  alternatives_korean:
  - 복수를 집행하라고
  - 원수를 갚으라고
  lexicon: LSJ
  rationale: ἐκδίκησις의 보복/복수 의미를 살리면서, 한국어에서 가장 직접적인 동사구로 옮겼습니다.
theological_decisions:
- issue: τὸν ἀσεβῆ의 평가적 표현 처리
  chosen_reading: 알키모스를 ‘불경한’ 사람으로 직접 규정했습니다.
  alternative_readings:
  - ‘악한 알키모스’로 완화할 수 있습니다.
  - ‘경건하지 않은’으로 더 중립적으로 옮길 수 있습니다.
  rationale: 본문의 서술자는 알키모스에 대한 도덕적·종교적 판단을 분명히 하고 있으므로, 이를 약화하지 않는 번역이 적절합니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: ἐν τοῖς υἱοῖς Ἰσραήλ의 방향성
  chosen_reading: ‘이스라엘 자손에게’로 번역해 복수의 대상성을 분명히 했습니다.
  alternative_readings:
  - ‘이스라엘 자손 가운데’
  - ‘이스라엘 자손 안에서’
  rationale: 문맥상 복수는 이스라엘을 향한 행위이므로, 한국어에서는 목적어 표지를 드러내어 오해를 줄이는 것이 자연스럽습니다.
  doctrine_reference: Translation philosophy §1, §5
