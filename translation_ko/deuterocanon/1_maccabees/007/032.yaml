  source_fidelity: κατὰ는 장소를 나타내므로 ‘~에서’가 적절합니다. 다만 Χαρφαρασαραμά의 음역은 ‘카파르살라마’보다 그리스어 자음군과 음절을 더 충실히 반영한 ‘카르파라사라마’가 안전합니다. 전투 문맥의 ἔπεσαν은 단순히 넘어졌다는 뜻이 아니라 전사·사망을 가리키므로 ‘전사하였습니다’로 명확히 옮기는 것이 필요합니다. ἔφυγον의 주어는 문법상 앞선 니카노르 측 사람들을 가리키며, 생존자라고 명시하지 않고 ‘그들은’으로 남겨 원문의 압축성과 다소 거친 지시를 보존했습니다.
  naturalness: ‘카파르살라마에서였습니다’는 독립된 절로서 현대 한국어에 부자연스럽습니다. 원문의 절 단절을 지나치게 보충하지 않으면서 ‘카르파라사라마에서, …’로 이어 주면 자연스럽고, 합쇼체 서술에도 맞습니다.
  terminology: ‘다윗 성’은 πόλις Δαυείδ에 대한 정착된 성경식 지명 표현으로 적절합니다. 니카노르 역시 통용 음역입니다. 지명 각주는 해당 지명의 표기가 불확실함을 알리되, 본문 음역과 일치시켜야 합니다.
