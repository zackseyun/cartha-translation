  - 전사했고
  lexicon: LSJ
  rationale: 군사 서술에서 ἔπεσαν은 전사 또는 죽음을 뜻하지만, 한국어에서는 간결하고 자연한 ‘쓰러지다’가 원문의 압축성을 가장 잘 살립니다.
- source_word: τῶν παρὰ Νικάνορος
  english_pob_choice: of those with Nicanor
  chosen_korean: 니카노르와 함께 있던 자들 가운데
