  - 니카노르 편에 있던 자들 가운데
  lexicon: LSJ
  rationale: 직역하면 ‘니카노르 곁에 있던 자들’이므로, 소속을 과도하게 해석하지 않으면서도 자연한 한국어로 ‘함께 있던 자들’이라 옮겼습니다.
- source_word: εἰς τὴν πόλιν Δαυείδ
  english_pob_choice: into the city of David
  chosen_korean: 다윗 성으로
  alternatives_korean:
  - 다윗의 성으로
  - 다윗 성 안으로
  lexicon: LSJ
  rationale: εἰς는 이동의 방향을 나타내므로 ‘-으로’가 적절하고, ‘πόλις Δαυείδ’는 성경 지명 관용구인 ‘다윗 성’으로 번역했습니다.
