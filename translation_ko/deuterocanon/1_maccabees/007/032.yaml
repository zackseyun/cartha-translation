  lexicon: LSJ
  rationale: κατά는 여기서 전투의 장소를 나타내는 부사격으로 쓰였으므로 ‘~에서’로 옮겼고, 난해한 지명은 의미를 풀지 않고 음역으로 처리했습니다.
- source_word: ἔπεσαν
