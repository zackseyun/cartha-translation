  - severity: low
    issue: ‘소문’은 원문보다 추정적 뉘앙스를 덧붙일 수 있습니다.
    rationale: ὁ λόγος는 여기서 알려진 일 또는 보고를 뜻하며, ‘그 일’이 더 중립적입니다.
