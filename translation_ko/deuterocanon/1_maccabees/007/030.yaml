  source_fidelity: 첫 문장의 ‘소문’은 λόγος의 가능한 의미이지만, 근거 없는 소문이라는 뉘앙스를 더할 수 있습니다. 또한 ‘그에게로 왔다’는 ἐπ’ αὐτόν의 적대적 방향, 곧 유다를 대적하여 왔다는 뜻을 충분히 드러내지 못합니다. 수정문은 이 두 지점을 보완하고, ἀπ’ αὐτοῦ는 ‘그를 두려워하여’로 옮겨 인물에 대한 반응을 보존합니다.
  naturalness: 현 초안의 두 문장, 특히 ‘곧 그가 … 사실이었습니다’는 다소 번역투이며 지시 대상이 불명확합니다. 수정문은 현대 표준 한국어 합쇼체로 자연스럽게 연결됩니다.
  terminology: ‘속임수’는 μετὰ δόλου에 적절합니다. ‘그 일이’는 λόγος의 넓은 ‘사실/사안’ 의미를 보존하며, 각주에서 ‘보고’라는 어휘 대안을 제시합니다. ‘얼굴을 보려 하지 않았다’는 원문의 표현을 유지합니다.
  issues:
