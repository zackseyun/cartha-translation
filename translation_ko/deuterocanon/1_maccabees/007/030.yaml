translation:
  language: ko
  text: 그 일이[a] 유다에게 알려졌습니다. 곧 그가 속임수로 유다를 치러 왔다는 것이었습니다. 유다는 그를 두려워하여 더 이상 그의 얼굴을 보려 하지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 보고가 유다에게 알려졌다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώσθη ὁ λόγος
  english_pob_choice: the matter became known
  chosen_korean: 그 소문이 유다에게 알려졌습니다
  alternatives_korean:
  - 그 일이 알려졌습니다
  - 그 보고가 알려졌습니다
  - 그 소식이 유다에게 전해졌습니다
  lexicon: LSJ
  rationale: λόγος는 여기서 단순한 ‘말’이 아니라 사건에 관한 보고·소문을 가리키므로, 한국어에서는 자연스럽게 ‘소문/소식’ 계열로 옮기되 수동형의 전달성을 살렸습니다.
- source_word: μετὰ δόλου
  english_pob_choice: with deceit
  chosen_korean: 속임수로
  alternatives_korean:
  - 기만으로
  - 속임수와 함께
  - 간계로
  lexicon: LSJ
  rationale: 전치사구의 수단·방식을 드러내는 표현으로, 현대 한국어에서는 ‘속임수로’가 가장 간결하고 원문의 부정적 의도를 분명하게 전달합니다.
- source_word: ἦλθεν ἐπ’ αὐτόν
  english_pob_choice: had come against him
  chosen_korean: 그에게로 왔다는 사실이었습니다
  alternatives_korean:
  - 그를 향해 왔다는 사실이었습니다
  - 그에게 맞서 왔다는 사실이었습니다
  - 그에게로 접근했다는 사실이었습니다
  lexicon: LSJ
  rationale: 직역하면 ‘그에게로/그 위로 왔다’이지만, 한국어 본문은 앞의 ‘속임수’에 초점을 두어 자연스럽게 연결했고, 적대적 뉘앙스는 앞뒤 문맥으로 유지했습니다.
- source_word: ἐπτοήθη ἀπ’ αὐτοῦ
  english_pob_choice: he was alarmed because of him
  chosen_korean: 유다는 그 때문에 두려워하여
  alternatives_korean:
  - 유다는 그로 인해 놀라
  - 유다는 그 때문에 겁을 먹어
  - 유다는 그 때문에 당황하여
  lexicon: LSJ
  rationale: ἐπτοήθη는 단순 놀람보다 더 강한 동요·두려움을 포함하므로 ‘두려워하여’로 옮겨 심리적 반응을 분명히 했습니다.
- source_word: ἰδεῖν τὸ πρόσωπον αὐτοῦ
  english_pob_choice: to see his face
  chosen_korean: 그의 얼굴을 보려고 하지 않았습니다
  alternatives_korean:
  - 그의 얼굴을 다시 보려 하지 않았습니다
  - 그의 얼굴을 보기 원하지 않았습니다
  - 그를 보려고 하지 않았습니다
  lexicon: LSJ
  rationale: ‘얼굴’을 유지해 원문의 관용적이고 인격적인 표현을 살리면서, ‘더 이상’과 결합해 이후의 의지적 거부를 자연스럽게 표현했습니다.
theological_decisions:
- issue: 직접 인용 없이 서술된 적대적 접근과 두려움의 서술 방식
  chosen_reading: 본문의 역사적 서술을 그대로 따라, 도덕적 평가는 덧붙이지 않고 ‘속임수’, ‘두려워하여’로 사건의 성격을 드러냈습니다.
  alternative_readings:
  - ‘배신’이라는 해석어를 본문에 직접 넣는 방식
  - 심리 묘사를 약화시켜 단순히 ‘놀라서’로 옮기는 방식
  rationale: 1 마카베오서는 사건 전개를 서술하는 문맥이므로, 해석을 과도하게 앞세우지 않으면서도 속임수의 악의성과 유다의 두려움을 충분히 전달하는 것이 적절합니다.
  doctrine_reference: 서사 본문 번역 원칙
