revisions:
- from: 그리고 그 소문이 유다에게 알려졌습니다. 곧 그가 속임수로 그에게로 왔다는 사실이었습니다. 유다는 그 때문에 두려워하여, 더 이상 그의 얼굴을 보려고 하지 않았습니다.[a]
  to: 그 일이[a] 유다에게 알려졌습니다. 곧 그가 속임수로 유다를 치러 왔다는 것이었습니다. 유다는 그를 두려워하여 더 이상 그의 얼굴을 보려 하지 않았습니다.
  rationale: λόγος를 중립적인 ‘그 일’로 옮기고, ἦλθεν ἐπ’ αὐτόν의 적대적 함의를 ‘유다를 치러 왔다’로 명시했습니다. 두려움의 대상은 원문의 ἀπ’ αὐτοῦ를 따라 ‘그’로 유지했으며, ‘얼굴을 보려 하지 않았다’는 원문의 인격적 관용 표현을 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:39:45Z'
