base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/033.yaml
  text: And after these words Nikanor went up to Mount Zion, and some of the priests came out from the sanctuary, and some of the elders of the people, to greet him peaceably and to show him the burnt offering that was being offered for the king.
  footnotes:
  - marker: a
    text: Or 'from the holy place.' The Greek phrase can denote the sanctuary or holy precinct more specifically.
    reason: lexical_alternative
  - marker: b
    text: 'The repeated ''from'' likely has a partitive sense: representatives came out from among the priests and elders, not necessarily every priest and elder.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 말들이 있은 뒤에 니카노르는 시온 산에 올라갔습니다. 성소[a]에서 제사장들 가운데 일부가 나왔고, 백성의 장로들 가운데 일부[b]도 나왔습니다. 그들은 그를 평화롭게 맞이하고 왕을 위하여 드리고 있는 번제물을 그에게 보여 주려고 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성소’는 여기서 제의적 성역을 가리키며, ‘거룩한 곳’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘제사장들 가운데 일부’와 ‘백성의 장로들 가운데 일부’는 반복된 ἀπό의 부분적 의미를 반영한 것으로, 두 집단 전체가 아니라 그들 가운데 나온 사람들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη / τὸ ὄρος Σιών
  english_pob_choice: went up / Mount Zion
  chosen_korean: 시온 산에 올라갔습니다
  alternatives_korean:
  - 시온 산으로 올라갔습니다
  - 시온의 산에 올랐습니다
  lexicon: LSJ
  rationale: Ἀναβαίνω는 지리적 상승과 예루살렘을 향한 접근을 함께 드러내므로, 한국어에서는 자연스러운 ‘올라갔습니다’로 옮기고 고유 지명은 ‘시온 산’으로 유지했습니다.
- source_word: ἐξῆλθαν ἀπὸ τῶν ἱερέων ... καὶ ἀπὸ τῶν πρεσβυτέρων τοῦ λαοῦ
  english_pob_choice: some of the priests ... and some of the elders of the people
  chosen_korean: 제사장들 가운데 일부와 백성의 장로들 가운데 일부
  alternatives_korean:
  - 제사장들 중 일부와 백성의 장로들 중 일부
  - 제사장들과 백성의 장로들
  lexicon: LSJ
  rationale: 반복되는 ἀπό는 전원 전체가 아니라 대표자들을 가리키는 부분적 의미가 자연스러워, ‘가운데 일부’로 그 뉘앙스를 분명히 했습니다.
- source_word: ἐκ τῶν ἁγίων
  english_pob_choice: from the sanctuary
  chosen_korean: 성소에서
  alternatives_korean:
  - 거룩한 곳에서
  - 성소 안에서
  lexicon: LSJ
  rationale: 이 표현은 제의적 성역을 가리키는 말로 쓰였으므로, 문맥상 가장 직접적인 한국어인 ‘성소’로 옮겼습니다.
- source_word: ἀσπάσασθαι αὐτὸν εἰρηνικῶς
  english_pob_choice: to greet him peaceably
  chosen_korean: 그를 평화롭게 맞이하고
  alternatives_korean:
  - 그를 평화롭게 인사하고
  - 그에게 평화롭게 문안하고
  lexicon: LSJ
  rationale: ἀσπάζομαι는 단순한 인사보다 맞이함을 포함할 수 있어, 공식적이고 문맥에 맞는 ‘맞이하고’를 택했고 εἰρηνικῶς는 ‘평화롭게’로 반영했습니다.
- source_word: τὴν ὁλοκαύτωσιν τὴν προσφερομένην ὑπὲρ τοῦ βασιλέως
  english_pob_choice: the burnt offering that was being offered for the king
  chosen_korean: 왕을 위하여 드리고 있는 번제물
  alternatives_korean:
  - 왕을 위하여 바치고 있는 번제물
  - 왕을 위해 드리는 번제물
  lexicon: LSJ
  rationale: ὁλοκαύτωσις는 정해진 제의 용어인 ‘번제물’이 적절하고, προσφερομένην의 진행성을 ‘드리고 있는’으로 살려 제사가 진행 중임을 보여 주었습니다.
theological_decisions:
- issue: 왕을 위한 제사의 방향성(ὑπὲρ τοῦ βασιλέως)
  chosen_reading: ‘왕을 위하여’로 옮겨 제사가 왕의 유익/관련을 위해 드려지고 있음을 그대로 드러냈습니다.
  alternative_readings:
  - 왕을 위하여
  - 왕을 위한 것으로
  rationale: ὑπέρ는 단순한 대리보다 ‘위하여/위해’의 목적·이익 관계를 나타내므로, 신학적 해석을 덧붙이지 않고 문법적으로 열어 두는 번역이 적절합니다.
  doctrine_reference: 중보적·대리적 제사 표현의 문법적 보존
- issue: 제의 공간 표현(ἐκ τῶν ἁγίων)
  chosen_reading: ‘성소’로 번역해 성역의 공간성을 살렸습니다.
  alternative_readings:
  - 거룩한 곳
  - 성소 안
  rationale: 문맥이 제사장과 번제물을 말하므로 추상적인 ‘거룩한 것들’보다 제의 공간인 성소를 가리키는 것으로 이해하는 것이 자연스럽습니다.
  doctrine_reference: 성전/성소 어휘의 문맥적 판정
