  text: And Nikanor learned that his plan had been uncovered, and he went out to meet Judas,
translation:
  language: ko
  text: 그리고 니카노르는 자신의 계획이 드러난 것을 알게 되었고, 유다를 만나러 나갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνω
  english_pob_choice: learned
  chosen_korean: 알게 되었고
  alternatives_korean:
  - 알고는
  - 깨닫고
  lexicon: BDAG
  rationale: aorist γινώσκω는 단순한 상태보다 사실을 새로 알아차린 순간을 나타내므로, 자연스러운 현대 한국어의 ‘알게 되다’로 옮겼습니다.
- source_word: ἀπεκαλύφθη ἡ βουλὴ αὐτοῦ
  english_pob_choice: had been uncovered / his plan
  chosen_korean: 자신의 계획이 드러난
  alternatives_korean:
  - 자신의 계략이 폭로된
  - 자신의 뜻이 밝혀진
  lexicon: BDAG
  rationale: 수동태는 ‘드러나다’로 살렸고, βουλή는 이 문맥의 정치·군사적 의미에 맞게 ‘계획’으로 옮겨 과도한 부정적 뉘앙스인 ‘계략’은 피했습니다.
- source_word: εἰς συνάντησιν τῷ Ἰούδα
  english_pob_choice: to meet Judas
  chosen_korean: 유다를 만나러
  alternatives_korean:
  - 유다와 마주하려고
  - 유다와 만나기 위해
  lexicon: LSJ
  rationale: εἰς συνάντησιν은 ‘만남/대면을 위해’의 목적을 나타내므로, 한국어에서는 목적을 자연스럽게 드러내는 ‘만나러’로 처리했습니다.
- source_word: Νικάνωρ / Ἰούδα
  english_pob_choice: Nikanor / Judas
  chosen_korean: 니카노르 / 유다
  alternatives_korean:
  - 니칸노르 / 유다
  lexicon: transliteration
  rationale: 인명은 현대 외래어 표기 관행에 따라 음역했고, Ἰούδας는 1마카베오의 인물명으로 ‘유다’가 관용적입니다.
