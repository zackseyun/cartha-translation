- from: 그리고 그들에 대한 두려움과 떨림이 온 백성 위에 내렸습니다. 그들이 말하기를, “그들 안에는 진리도 정의도 없습니다. 그들이 그 약속과 자신들이 맹세한 맹세를 깨뜨렸기 때문입니다.”[a]
  to: 그리고 그들에 대한 두려움과 떨림이 온 백성에게 닥쳤습니다. 백성이 말했습니다. “그들 가운데에는 진실도 정의도 없습니다. 그들이 그 약정[a]과 자신들이 맹세한 맹세를 어겼기 때문입니다.”
  rationale: 현대 표준 합쇼체의 자연스러움을 높이고 각주 표지의 대상을 바로잡았습니다. 동시에 ‘그들에 대한’으로 αὐτῶν의 방향성을, ‘약정’과 ‘맹세한 맹세’로 원문의 공식적 합의 및 반복 표현을 보존했습니다.
