review_pass:
  verdict: revise
  source_fidelity: 원문의 αὐτῶν은 온 백성에게 임한 두려움이 ‘그들’을 향한 것임을 나타내므로 이를 유지했습니다. ἀλήθεια καὶ κρίσις는 이 문맥에서 ‘진실과 정의’로, παρῆρσαν은 약정과 맹세의 위반을 뜻하는 ‘어겼습니다’로 옮겼습니다. στάσις는 신학적으로 과도하게 규정하지 않고 ‘약정’으로 번역했습니다.
  naturalness: 초안의 ‘그들이 말하기를’은 현대 표준 합쇼체에서 다소 문어적이고 부자연스럽습니다. 또한 ‘그들 안에는’보다 집단 내부의 도덕적 상태를 나타내는 ‘그들 가운데에는’이 자연스럽습니다. 각주 표지는 해당 어휘인 ‘약정’에 직접 붙였습니다.
  terminology: ‘진실과 정의’는 이 비난의 윤리적·법적 문맥에 알맞으며, ‘약정’은 στάσις의 공식적 합의라는 뜻을 보존하면서 ‘언약’이 줄 수 있는 불필요한 신학적 함의를 피합니다. ‘맹세한 맹세’는 원문의 ὅρκον ὃν ὤμοσαν의 반복을 보존합니다.
  issues:
