    rationale: 각주는 ‘약정’에 직접 붙여야 독자가 대안 번역이 어느 단어에 관한 것인지 분명히 알 수 있습니다.
  - severity: low
    issue: ‘그들이 말하기를’과 ‘그들 안에는’은 현대 한국어 문장으로 다소 부자연스럽습니다.
