  text: And fear and dread fell upon all the people[a], for they said, “There is no truth or justice in them, for they have broken the agreement and the oath that they swore.”
  footnotes:
  - marker: a
    text: Or 'compact' or 'covenant' for 'agreement'; the Greek term can denote a formal arrangement, and the context is strengthened by the accompanying oath.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들에 대한 두려움과 떨림이 온 백성 위에 내렸습니다. 그들이 말하기를, “그들 안에는 진리도 정의도 없습니다. 그들이 그 약속과 자신들이 맹세한 맹세를 깨뜨렸기 때문입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '협약', '언약'으로도 옮길 수 있습니다. 그리스어 στάσις는 공식적 합의를 가리킬 수 있으며, 뒤의 맹세와 함께 나오므로 더 강한 법적·관계적 의미가 분명해집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέπεσεν
  english_pob_choice: fell upon
  chosen_korean: 내렸습니다
  alternatives_korean:
  - 덮쳤습니다
  - 내려왔습니다
  lexicon: LSJ
  rationale: 감정이나 상태가 사람들 위에 갑자기 덮치는 동작을 자연스럽게 살리면서, '두려움과 떨림'에 어울리는 수직적 이미지도 보존합니다.
- source_word: ὁ φόβος / ὁ τρόμος
  english_pob_choice: fear / dread
  chosen_korean: 두려움과 떨림
  alternatives_korean:
  - 두려움과 공포
  - 공포와 떨림
  lexicon: LSJ
  rationale: φόβος와 τρόμος의 병렬을 과도하게 중복하지 않으면서, 감정(두려움)과 몸의 반응(떨림)을 함께 드러냅니다.
- source_word: ἀλήθεια καὶ κρίσις
  english_pob_choice: truth / justice
  chosen_korean: 진리도 정의도
  alternatives_korean:
  - 진실도 정의도
  - 진리도 심판도
  lexicon: LSJ
  rationale: ἀλήθεια는 단순한 사실성보다 신뢰성과 참됨을 포함하므로 '진리'가 적절하고, κρίσις는 여기서 판결 행위보다 올바른 처리를 가리켜 '정의'가 문맥에 맞습니다.
- source_word: παρῆρσαν τὴν στάσιν
  english_pob_choice: have broken the agreement
  chosen_korean: 그 약속을 깨뜨렸기 때문입니다
  alternatives_korean:
  - 그 협약을 어겼기 때문입니다
  - 그 합의를 깨뜨렸기 때문입니다
  lexicon: LSJ
  rationale: στάσις를 지나치게 신학화하지 않고, 맥락상 맺은 공식적 약정의 위반을 한국어의 자연스러운 법적·관계적 표현인 '약속을 깨뜨리다'로 옮겼습니다.
- source_word: τὸν ὅρκον ὃν ὤμοσαν
  english_pob_choice: the oath that they swore
  chosen_korean: 자신들이 맹세한 맹세
  alternatives_korean:
  - 그들이 한 맹세
  - 그들이 서약한 서약
  lexicon: LSJ
  rationale: ὅρκος와 ὤμοσαν의 어근 연결을 한국어에서도 드러내기 위해 반복을 살렸습니다. 다만 '맹세한 맹세'는 의도적 중복으로, 원문의 강조를 반영합니다.
theological_decisions:
- issue: στάσις를 covenant(언약) 수준으로 올릴지 여부
  chosen_reading: 문맥상 공식적 약속이지만, 본문에는 '언약'보다 '약속'을 택했습니다.
  alternative_readings:
  - 언약
  - 협약
  rationale: 이 절은 위반된 관계를 고발하지만, 단어 자체가 곧바로 언약 신학을 요구하지는 않습니다. 영어 POB의 최종 회수본도 'agreement'로 돌아갔으므로, 한국어 역시 과도한 신학적 확대를 피했습니다.
  doctrine_reference: Translation philosophy §1, §5
