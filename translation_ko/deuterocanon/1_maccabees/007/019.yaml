  yaml_path: translation/deuterocanon/1_maccabees/007/019.yaml
  text: And Bacchides departed from Jerusalem and encamped at Bethzaith[a], and he sent and seized many of the men who had deserted to him, and some of the people[c][b], and slaughtered them in the great pit.
  footnotes:
  - marker: a
    text: Or 'had defected to him' or 'had gone over to him.'
    reason: lexical_alternative
  - marker: b
    text: The Greek verb here is literally 'sacrificed'; in context it refers to violent killing, not a legitimate cultic offering.
    reason: lexical_alternative
  - marker: c
    text: Or 'into the great pit' / 'the great well' / 'the great cistern'; the Greek noun can refer to a pit, well, or cistern.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 바키데스가 예루살렘에서 떠나 베크셋에 진을 쳤으며, 사람을 보내어 자기에게 투항한 사람들 가운데 많은 사람들과 백성 가운데 몇 사람을 붙잡고, 그들을 큰 구덩이 속에서 죽였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게로 넘어간’ / ‘그에게 귀순한’의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 동사는 문자적으로는 ‘희생하다’라는 뜻이지만, 여기서는 정당한 제의가 아니라 폭력적인 살해를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘큰 구덩이 안에서’ / ‘큰 우물 안에서’ / ‘큰 저수조 안에서’로도 옮길 수 있습니다. 그리스어 명사는 구덩이, 우물, 저수조를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
