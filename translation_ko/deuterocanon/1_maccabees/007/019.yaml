  rationale: 이 분사구는 적 진영으로 넘어간 사람들을 가리키므로, 한국어에서는 배신과 귀순의 뉘앙스를 함께 담는 ‘투항한’이 가장 무난합니다.
- source_word: ἔθυσεν
  english_pob_choice: slaughtered
  chosen_korean: 죽였습니다
  alternatives_korean:
  - 도살했습니다
  - 희생시켰습니다
  lexicon: LSJ
  rationale: 여기서는 실제 제의가 아니라 폭력적 살해를 뜻하므로, 본문에는 자연스럽게 ‘죽였습니다’로 두고 제의적 뉘앙스는 각주에서 설명합니다.
theological_decisions:
- issue: ἔθυσεν의 제의적 동사 사용을 한국어 본문에서 어떻게 처리할지
  chosen_reading: 본문에는 비제의적 살해 의미를 드러내는 ‘죽였습니다’를 사용하고, 원문의 직설적·잔혹한 표현은 각주로 보존합니다.
  alternative_readings:
  - 희생시켰습니다
  - 도살했습니다
  rationale: 독자는 바키데스가 실제 예식을 행한 것으로 오해하지 않아야 하며, 동시에 원문의 강한 어휘는 약화되지 않도록 각주로 문법적 사실을 남기는 것이 적절합니다.
  doctrine_reference: 원문 우선 원칙; 문맥에 반하는 제의적 해석 배제
