lexical_decisions:
- source_word: ἄνομοι
  english_pob_choice: lawless
  chosen_korean: 불법한 자들
  alternatives_korean:
  - 율법 없는 자들
  - 악한 자들
  lexicon: BDAG
  rationale: 법을 거스르는 성격을 드러내는 표현으로 옮겼습니다. 여기서는 단순한 도덕적 비난보다 공동체의 율법 질서를 어긴다는 뉘앙스가 중요합니다.
- source_word: ἀσεβεῖς
  english_pob_choice: ungodly
  chosen_korean: 불경건한 자들
  alternatives_korean:
  - 경건하지 않은 자들
  - 신을 두려워하지 않는 자들
  lexicon: BDAG
  rationale: 하나님께 대한 경외와 신앙적 불의를 함께 나타내는 말이므로, 현대 한국어에서 자연스러운 ‘불경건한’으로 옮겼습니다.
- source_word: ἐξ Ἰσραήλ
  english_pob_choice: from Israel
  chosen_korean: 이스라엘에서 나온
  alternatives_korean:
  - 이스라엘 출신의
  - 이스라엘 가운데서 나온
  lexicon: BDAG
  rationale: 이 표현은 이들이 이스라엘 안에서 나온 집단임을 밝힙니다. ‘에서 나온’이 원문의 이동/출처 감각을 가장 직접적으로 살립니다.
- source_word: ἱερατεύειν
  english_pob_choice: to be priest
  chosen_korean: 제사장이 되기를 원하였습니다
  alternatives_korean:
  - 제사장으로 섬기기를 원하였습니다
  - 제사장 직분을 얻기를 원하였습니다
  lexicon: LSJ
  rationale: 문맥상 단순한 제사장 봉사보다 제사장 직분 자체를 노리는 뜻이므로, 직역의 딱딱함을 피하면서도 직분 지향을 드러냈습니다.
