  text: And he appointed Alcimus over the country, and left with him a force to help him; and Bacchides went away to the king.
translation:
  language: ko
  text: 그는 알키모스를 그 지역의 통치자로 세우고, 그를 돕도록 한 부대를 그와 함께 남겨 두었습니다. 그리고 바키데스는 왕에게 돌아갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέστησεν τὴν χώραν τῷ Ἀλκίμῳ
  english_pob_choice: appointed Alcimus over the country
  chosen_korean: 알키모스를 그 지역의 통치자로 세우고
  alternatives_korean:
  - 알키모스를 그 나라 위에 임명하고
  - 그 지역을 알키모스에게 맡기고
  - 알키모스를 그 땅에 세우고
  lexicon: BDAG
  rationale: κατέστησεν과 여격 구조는 단순한 배치보다 권한 부여와 통치 위임을 뜻하므로, 한국어로는 ‘통치자로 세우다’가 가장 자연스럽고 원문의 행정적 의미를 살립니다.
- source_word: τὴν χώραν
  english_pob_choice: the country
  chosen_korean: 그 지역
  alternatives_korean:
  - 그 나라
  - 그 땅
  - 그 영토
  lexicon: BDAG
  rationale: 여기서 χώρα는 정치적으로 통제되는 영역을 가리키므로, 현대 한국어에서는 ‘지역’이 지나치게 지리적이지 않으면서도 행정적 범위를 드러냅니다.
- source_word: ἀφῆκεν μετ’ αὐτοῦ δύναμιν
  english_pob_choice: left with him a force
  chosen_korean: 그를 돕도록 한 부대를 그와 함께 남겨 두었습니다
  alternatives_korean:
  - 그와 함께 한 군대를 남겨 두었습니다
  - 그를 돕는 군세를 그와 함께 두었습니다
  - 그를 지원할 병력을 남겨 두었습니다
  lexicon: BDAG
  rationale: δύναμις는 이 군사 서술에서 ‘힘’보다 ‘부대/병력’이 적절하고, μετ’ αὐτοῦ는 동행·주둔의 뉘앙스를 살려 ‘그와 함께 남겨 두었습니다’로 옮겼습니다.
- source_word: τοῦ βοηθεῖν αὐτῷ
  english_pob_choice: to help him
  chosen_korean: 그를 돕도록
  alternatives_korean:
  - 그를 돕기 위하여
  - 그를 지원하도록
  - 그를 도우려는 목적에서
  lexicon: BDAG
  rationale: 정관사-부정사 구조는 목적을 나타내므로, ‘돕도록’이 가장 간결하게 원문의 목적성을 드러냅니다.
- source_word: ἀπῆλθεν Βακχίδης πρὸς τὸν βασιλέα
  english_pob_choice: Bacchides went away to the king
  chosen_korean: 바키데스는 왕에게 돌아갔습니다
  alternatives_korean:
  - 바키데스는 왕에게 갔습니다
  - 바키데스는 왕에게 떠났습니다
  - 바키데스는 왕에게 돌아가 버렸습니다
  lexicon: BDAG
  rationale: πρὸς τὸν βασιλέα는 단순한 ‘향함’이지만, 앞선 상황상 본거지로 되돌아가는 의미가 드러나므로 ‘돌아갔습니다’가 문맥상 자연스럽습니다.
theological_decisions:
- issue: 통치 위임과 군사 주둔의 정치적 의미
  chosen_reading: 알키모스를 그 지역의 통치자로 세우고, 그를 돕도록 한 부대를 그와 함께 남겨 둔 것으로 번역했습니다.
  alternative_readings:
  - ‘그 지역을 알키모스에게 맡기고’처럼 보다 중립적으로 번역할 수 있습니다.
  - ‘군대’로 옮겨 규모를 더 크게 보이게 할 수 있습니다.
  rationale: 본문은 단순한 방문 기록이 아니라 점령지 행정과 군사적 통제를 묘사하므로, 정치·군사적 함의를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 역사 서술의 직역성 및 통치/권력 구조의 명시적 표현
