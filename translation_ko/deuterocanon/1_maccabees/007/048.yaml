translation:
  language: ko
  text: 그리고 백성이 크게 기뻐했고, 그날을 큰 기쁨의 날로 지냈습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ηὐφράνθη ὁ λαὸς σφόδρα
  english_pob_choice: And the people rejoiced greatly
  chosen_korean: 그리고 백성이 크게 기뻐했고
  alternatives_korean:
  - 그리고 백성이 매우 기뻐했습니다
  - 그리고 백성이 크게 즐거워했습니다
  lexicon: LSJ
  rationale: εὐφραίνω의 이 문맥상 결과를 ‘기뻐하다’로 자연스럽게 옮기되, σφόδρα의 강도를 ‘크게’로 살려 과도한 의역 없이 감정의 강도를 전달했습니다.
- source_word: ὁ λαός
  english_pob_choice: the people
  chosen_korean: 백성이
  alternatives_korean:
  - 그 백성이
  - 사람들이
  lexicon: LSJ
  rationale: 본문은 단순히 ‘the people’이라고 하므로, 역사적 맥락을 보태지 않고 가장 सीधे한 ‘백성’으로 옮겼습니다.
- source_word: ἦγαγον τὴν ἡμέραν ἐκείνην ἡμέραν εὐφροσύνης μεγάλην
  english_pob_choice: they made that day a day of great gladness
  chosen_korean: 그날을 큰 기쁨의 날로 지냈습니다
  alternatives_korean:
  - 그날을 큰 즐거움의 날로 삼았습니다
  - 그날을 큰 기쁨의 날로 보냈습니다
  lexicon: LSJ
  rationale: ἄγειν ἡμέραν의 관용구를 한국어의 ‘날로 지내다’로 풀어, 단순히 시간을 보낸 것이 아니라 축제적·기념적 의미로 ‘그날을 … 날로 지내다’는 뜻을 자연스럽게 살렸습니다.
