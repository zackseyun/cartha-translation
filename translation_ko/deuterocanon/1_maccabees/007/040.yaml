  text: And Judas encamped at Adasa with three thousand men, and Judas prayed and said,
translation:
  language: ko
  text: 유다는 아다사에 삼천 명의 사람들과 함께 진을 쳤고, 유다는 기도하고 말했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρενέβαλεν
  english_pob_choice: encamped
  chosen_korean: 진을 쳤고
  alternatives_korean:
  - 캠프를 세웠고
  - 야영했고
  lexicon: LSJ
  rationale: 군사적 이동과 배치의 맥락이므로, 단순한 ‘머물렀다’보다 ‘진을 치다’가 원문의 전투적 뉘앙스를 더 직접적으로 드러냅니다.
- source_word: ἐν Ἀδασὰ
  english_pob_choice: at Adasa
  chosen_korean: 아다사에
  alternatives_korean:
  - 아다사에서
  - 아다사 안에
  lexicon: LSJ
  rationale: 지명 앞의 ἐν은 한국어에서는 주둔·도착 장소를 나타내는 조사 ‘에’가 가장 자연스럽습니다.
- source_word: ἐν τρισχιλίοις ἀνδράσιν
  english_pob_choice: with three thousand men
  chosen_korean: 삼천 명의 사람들과 함께
  alternatives_korean:
  - 삼천 명과 함께
  - 삼천 명의 군사와 함께
  lexicon: LSJ
  rationale: ἀνδράσιν은 문자적으로 ‘사람들/남자들’이지만, 여기서는 전투 병력을 가리키므로 ‘사람들’보다 의미를 살려 ‘함께’ 구조로 자연스럽게 옮겼습니다.
- source_word: προσηύξατο
  english_pob_choice: prayed
  chosen_korean: 기도하고
  alternatives_korean:
  - 기도하였고
  - 기도했습니다
  lexicon: LSJ
  rationale: 다음의 εἶπεν과 병렬되는 서술 구조이므로, 한국어에서는 앞절의 동작을 연결하는 ‘-고’로 처리해 문장 흐름을 보존했습니다.
theological_decisions:
- issue: 전투 서술 속 기도 행위의 의미
  chosen_reading: 유다는 전투 준비 속에서 하나님께 먼저 나아가 기도한 것으로 표현했습니다.
  alternative_readings:
  - 단순한 의례적 기도
  - 전술적 사전 행동
  rationale: 본문은 군사 배치와 기도를 연속적으로 제시해, 전투를 인간 계산만이 아니라 하나님께 의존하는 행위로 읽게 합니다.
  doctrine_reference: 기도와 전쟁 서사의 신학적 연결
