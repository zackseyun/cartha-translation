  text: In the one hundred fifty-first year[a], Demetrius son of Seleucus went out from Rome, and went up with a few men to a city by the sea[b], and reigned there.
  footnotes:
  - marker: a
    text: Or 'to a coastal city.' The Greek says literally 'to a city by the sea.'
    reason: lexical_alternative
  - marker: b
    text: Or 'became king there.' The Greek verb can denote either entering kingship or reigning as king, depending on context.
    reason: alternative_reading
translation:
  language: ko
  text: 제백오십일년에 데메드리오스는 셀레우코스의 아들로서 로마에서 나와, 적은 사람들과 함께 바닷가의 한 도성으로 올라가 그곳에서 다스렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘해안의 한 도시로’. 그리스어는 문자적으로 ‘바닷가의 한 도성으로’라고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그곳에서 왕이 되었습니다’. 그리스어 동사는 문맥에 따라 왕권에 오름 또는 왕으로 다스림을 뜻할 수 있습니다.
    reason: alternative_reading
