  yaml_path: translation/deuterocanon/1_maccabees/007/047.yaml
  text: And they took the spoils and the plunder[a], and they cut off Nikanor’s head and his right hand, which he had stretched out in arrogance, and brought them and displayed them beside Jerusalem.
  footnotes:
  - marker: a
    text: Or 'near Jerusalem.' The Greek says literally 'beside Jerusalem,' without specifying the exact location.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 전리품과 노획물을 차지하고, 니카노르의 머리와 그가 오만하게 내밀고 있던 오른손을 잘라 내어 그것들을 예루살렘 곁에 가져가 펼쳐 놓았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘곁에’는 그리스어 παρά + 대격이 가리키는 위치를 따라 옮긴 것이며, 정확히 어느 지점인지는 본문이 특정하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκῦλα
  english_pob_choice: spoils
  chosen_korean: 전리품
  alternatives_korean:
  - 노획물
  - 노획품
  lexicon: LSJ
  rationale: 전쟁에서 빼앗은 물건이라는 군사적 의미를 살리면서도 현대 한국어로 자연스럽게 들리는 표현입니다.
- source_word: προνομὴν
  english_pob_choice: plunder
  chosen_korean: 노획물
  alternatives_korean:
  - 전리품
  - 약탈물
  lexicon: LSJ
  rationale: 앞의 σκῦλα와 겹치지 않도록, 따로 취한 약탈의 뉘앙스를 살려 분리해 옮겼습니다.
- source_word: ἀφεῖλαν
  english_pob_choice: they cut off
  chosen_korean: 잘라 내어
  alternatives_korean:
  - 베어 내어
  - 잘라서 떼어 내어
  lexicon: LSJ
  rationale: 머리와 오른손에 이어지는 문맥상 단순한 제거가 아니라 절단을 뜻하므로, 그 행위를 분명히 드러냈습니다.
- source_word: ἐν ὑπερηφάνως
  english_pob_choice: in arrogance
  chosen_korean: 오만하게
  alternatives_korean:
  - 거만하게
  - 교만하게
  lexicon: LSJ
  rationale: 행동의 태도에 붙는 부사로서, 단순한 ‘당당하게’보다 도덕적 뉘앙스가 있는 ‘오만하게’가 원문의 색채를 더 잘 반영합니다.
- source_word: παρὰ τὴν Ἰερουσαλήμ
  english_pob_choice: beside Jerusalem
  chosen_korean: 예루살렘 곁에
  alternatives_korean:
  - 예루살렘 근처에
  - 예루살렘 옆에
  lexicon: LSJ
  rationale: παρά + 대격은 정확한 지점을 특정하지 않은 ‘곁/옆/근처’의 의미이므로, 과도하게 해석하지 않는 표현을 택했습니다.
theological_decisions:
- issue: 니카노르의 시신 일부를 예루살렘에 ‘펼쳐 놓음’의 표현 강도
  chosen_reading: 본문의 공개적 조롱과 승리의 행위를 서술적으로 옮기고, 추가적인 도덕 평가는 덧붙이지 않았습니다.
  alternative_readings:
  - ‘전시하다’로 더 강하게 해석하기
  - 장소를 성전 구역이나 성문으로 특정하기
  rationale: 원문은 행위를 분명히 말하지만 위치와 신학적 평가를 더 세밀하게 규정하지 않으므로, 역사 서술의 힘을 유지하면서도 과잉 해석은 피했습니다.
  doctrine_reference: 원문 우선, 해석 절제
- issue: ‘오만하게’의 신학적 함의
  chosen_reading: 니카노르의 손이 단순히 올라간 것이 아니라 교만한 태도의 표지였음을 살렸습니다.
  alternative_readings:
  - 중립적 ‘들어 올린’으로 옮기기
  rationale: 원문이 그 행위의 도덕적 성격을 명시하므로, 한국어에서도 그 판단을 약화시키지 않는 것이 적절합니다.
  doctrine_reference: 교만에 대한 성경적 평가 유지
