  text: And it happened[a], as he was entering the royal house of his fathers, that the forces seized Antiochus and Lysias to bring them to him.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'the royal house of his fathers' or 'the palace of his fathers.' The Greek reads literally 'house of the kingdom of his fathers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 조상들의 왕궁으로 들어가고 있을 때, 군대가 안티오코스와 리시아스를 붙잡아 그에게 데려가려 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘조상들의 왕궁’은 직역하면 ‘그의 조상들의 왕국의 집’입니다. 문맥상 왕궁 또는 왕실 거처를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ὡς
  english_pob_choice: And it happened, when
  chosen_korean: 그리고 그가 …하고 있을 때
  alternatives_korean:
  - 그리고 …하였을 때
  - 그러자 …할 때
  lexicon: LSJ
  rationale: 그리스어의 서사 전환 공식과 진행 중인 상황을 함께 살리기 위해, 단순한 과거보다 진행상으로 옮겼습니다.
- source_word: οἶκον βασιλείας πατέρων αὐτοῦ
  english_pob_choice: the house of the kingdom of his fathers
  chosen_korean: 조상들의 왕국의 집
  alternatives_korean:
  - 조상들의 왕궁
  - 조상들의 왕실
  lexicon: LSJ
  rationale: 영어 POB가 유지한 다소 직역적인 구조를 따라 ‘왕국의 집’을 살려, 궁전/왕궁으로 매끈하게 바꾸지 않고 원문의 특이한 겹구조를 드러냈습니다.
- source_word: συνέλαβον
  english_pob_choice: seized
  chosen_korean: 붙잡아
  alternatives_korean:
  - 체포하여
  - 사로잡아
  lexicon: LSJ
  rationale: 군사적·정치적 맥락에서 ‘붙잡다’가 가장 중립적으로 원문의 포획/체포 의미를 포괄합니다.
- source_word: ἀγαγεῖν αὐτοὺς αὐτῷ
  english_pob_choice: to bring them to him
  chosen_korean: 그를 찾아오게 하였습니다
  alternatives_korean:
  - 그들에게 데려오게 하였습니다
  - 그 앞에 끌고 오게 하였습니다
  lexicon: LSJ
  rationale: 대명사 지시를 한국어에서 자연스럽게 풀어 ‘그를 찾아오게 하다’로 옮겨, 붙잡은 뒤 왕에게 인도하는 목적을 드러냈습니다.
theological_decisions:
- issue: 조상들의 ‘왕국의 집’이라는 표현의 보존
  chosen_reading: ‘왕궁’으로 완전히 바꾸지 않고, 원문의 특이한 표현을 보존해 왕조적·상속적 뉘앙스를 드러냈습니다.
  alternative_readings:
  - 조상들의 왕궁
  - 조상들의 궁전
  rationale: 이 구절은 단순한 건물명이 아니라 왕권의 혈통적 귀속을 암시하므로, 매끈한 의역보다 원문 구조를 살리는 쪽이 독자 이해에 유익합니다.
  doctrine_reference: 본문 의미 보존 원칙
