  text: 그리고 그가 조상들의 왕국의 집으로 들어가고 있을 때, 군대가 안티오코스와 리시아스를 붙잡아 그를 찾아오게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
