translation:
  language: ko
  text: 그리고 그들은 유다 사방의 모든 마을에서 나와 그들을 우회하여 유리한 위치를 차지하였으며[a], 이들이 저들을 향해 돌아섰고[b], 모두 칼에 쓰러졌으며, 그들 가운데 한 사람도 남지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 동사는 이 전투 장면에서 ‘포위하다’, ‘측면에서 우세를 점하다’, 또는 더 넓게 ‘유리한 অবস্থ에 서다’로 이해될 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어는 ‘이들이 저들에게로 돌아섰다’는 압축되고 다소 어색한 표현을 사용합니다. 두 대명사가 각각 누구를 가리키는지는 문맥에 따라 암시될 뿐입니다.
    reason: lexical_alternative
