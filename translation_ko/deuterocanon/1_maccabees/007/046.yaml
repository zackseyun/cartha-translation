  yaml_path: translation/deuterocanon/1_maccabees/007/046.yaml
  text: And they came out from all the villages of Judea all around and outflanked them[a]; and these turned back against them, and they all fell by the sword[b], and not even one of them was left.
  footnotes:
  - marker: a
    text: Greek literally has a compressed and somewhat awkward sequence, 'and these turned back against these,' leaving the exact referents of the pronouns implicit in context.
    reason: lexical_alternative
  - marker: b
    text: The verb rendered 'outflanked' could also be understood more generally as 'surrounded' or 'had the advantage over' in this battle scene.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그들은 유다의 모든 마을들에서 사방으로 나와 그들을 우회하여 공격하였으며[a], 그들은 서로를 향하여 돌아섰고, 모두 칼에 쓰러졌으며, 그들 가운데 남은 자는 하나도 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘이들이 저들에게 돌아섰다’는 식의 압축된 표현을 사용하여, 지시 대상이 문맥에 의존합니다.
    reason: lexical_alternative
