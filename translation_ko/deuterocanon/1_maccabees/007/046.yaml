  text: And they came out from all the villages of Judea all around and outflanked them[a]; and these turned back against them, and they all fell by the sword[b], and not even one of them was left.
  footnotes:
  - marker: a
    text: Greek literally has a compressed and somewhat awkward sequence, 'and these turned back against these,' leaving the exact referents of the pronouns implicit in context.
