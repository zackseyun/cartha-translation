  text: They poured out the flesh of your holy ones and their blood around Jerusalem[c][b][a], and there was no one to bury them.
  footnotes:
  - marker: a
    text: Or 'saints' or 'faithful ones' for 'holy ones.'
    reason: lexical_alternative
  - marker: b
    text: This line closely echoes Psalm 79:2–3 (LXX 78:2–3).
    reason: cross_reference
  - marker: c
    text: Or 'they shed' instead of 'they poured out'; the Greek verb is literally 'poured out.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 당신의 거룩한 이들[a]의 살과 그들의 피를 예루살렘 주위에 쏟았고[c], 그들을 묻어 줄 사람이 없었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성도들’, ‘신실한 이들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 구절은 시편 79:2–3(칠십인역 78:2–3)을 밀접하게 반향합니다.
    reason: cross_reference
  - marker: c
    text: ‘쏟았고’는 그리스어 동사의 문자적 의미를 살린 번역입니다. ‘흘렸고’로도 옮길 수 있습니다.
    reason: lexical_alternative
