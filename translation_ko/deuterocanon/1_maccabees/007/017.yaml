  - 퍼부었고
  lexicon: LSJ
  rationale: 동사의 문자적 의미인 ‘붓다/쏟아내다’를 살리되, 피와 살에 대한 폭력성을 드러내는 한국어로 자연스럽게 다듬었습니다.
- source_word: οὐκ ἦν αὐτοῖς ὁ θάπτων
  english_pob_choice: there was no one to bury them
  chosen_korean: 그들을 묻어 줄 사람이 없었습니다
