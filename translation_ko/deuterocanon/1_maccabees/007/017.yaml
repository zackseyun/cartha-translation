  lexicon: LSJ
  rationale: 후대 교회적 ‘성도’보다 원문의 거룩함/구별됨을 직접 드러내는 ‘거룩한 이들’이 더 소스 친화적입니다.
- source_word: ἐξέχεαν
  english_pob_choice: they poured out
  chosen_korean: 쏟아 버렸고
  alternatives_korean:
