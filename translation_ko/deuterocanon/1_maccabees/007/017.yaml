  source_fidelity: The draft accurately conveys the principal sense of the Greek, including the graphic pairing of ‘flesh’ and ‘blood,’ the location around Jerusalem, and the absence of anyone to bury the dead. However, ‘쏟아 버렸고’ adds the Korean auxiliary ‘버리다,’ which can imply completion with a dismissive or discarding nuance not expressed by ἐξέχεαν. ‘쏟았고’ more closely preserves the source verb without that addition.
  naturalness: The revised wording is clear, modern standard Korean in formal-polite style. Moving each note marker to the word or clause it supports improves anchor clarity.
  terminology: ‘거룩한 이들’ is an appropriately source-near rendering of ὁσίων and avoids prematurely narrowing the expression to an ecclesiastical category. The lexical alternative ‘성인들’ is potentially misleading in Korean because it commonly denotes canonized saints; ‘성도들’ and ‘신실한 이들’ better represent the stated alternatives in this context.
  issues:
  - severity: medium
    issue: ‘쏟아 버렸고’ adds ‘버리다’ to the Greek verb.
    rationale: ἐξέχεαν means ‘they poured out’/‘they shed.’ The auxiliary can add a nuance of throwing away or emphatic disposal that is not required by the source.
  - severity: low
    issue: The lexical footnote gives ‘성인들’ as an alternative for ὁσίων.
    rationale: In contemporary Korean, ‘성인’ readily evokes canonized saints and may introduce a more specific later ecclesiastical sense than the Greek requires.
