revisions:
- from: 지금 그러므로 당신이 신뢰하는 사람 한 명을 보내어, 그가 가서 우리에게와 왕의 땅에 그가 행한 모든 파괴를 보고, 그들을 벌하고 그들을 돕는 모든 사람도 벌하게 하십시오.
  to: 그러므로 왕께서 신뢰하시는 사람을 보내십시오. 그가 가서 우리와 왕의 땅에 그가 가한 모든 파괴를 보고, 그들과 그들을 돕는 모든 사람을 벌하게 하십시오.
  rationale: 조사 오류를 바로잡고, 파견 명령과 그 사람에게 맡기는 확인·처벌 명령을 두 문장으로 분리했습니다. 파괴를 행한 자는 원문의 단수 ‘그가’로, 처벌받을 자들은 원문의 복수 ‘그들’로 보존했습니다. ‘벌하게 하십시오’는 파견된 사람이 처벌하도록 하라는 위임의 명령을 반영합니다.
