  text: Now then, send a man whom you trust, and let him go and see all the destruction that he has done to us and to the king’s land, and let him punish them and all who are helping them.
translation:
  language: ko
  text: 지금 그러므로 당신이 신뢰하는 사람 한 명을 보내어, 그가 가서 우리에게와 왕의 땅에 그가 행한 모든 파괴를 보고, 그들을 벌하고 그들을 돕는 모든 사람도 벌하게 하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόστειλον
  english_pob_choice: send
  chosen_korean: 보내어
  alternatives_korean:
  - 파견하여
  - 보내십시오
  lexicon: LSJ
  rationale: 명령의 힘을 살리면서도 이어지는 목적절과 자연스럽게 연결되는 동사로 ‘보내어’를 택했습니다.
- source_word: ἄνδρα ᾧ πιστεύεις
  english_pob_choice: a man whom you trust
  chosen_korean: 당신이 신뢰하는 사람 한 명
  alternatives_korean:
  - 당신이 믿는 한 사람
  - 신임하는 사람 한 명
  lexicon: LSJ
  rationale: 관계절의 핵심은 그 사람의 일반적 신뢰성이 아니라 보내는 이의 신뢰에 있으므로, ‘신뢰하는 사람’으로 옮겼습니다.
- source_word: τὴν ἐξολέθρευσιν ἅπασαν
  english_pob_choice: all the destruction
  chosen_korean: 모든 파괴
  alternatives_korean:
  - 온갖 파괴
  - 완전한 파멸
  lexicon: LSJ
  rationale: ἐξολέθρευσις의 파괴·멸절 의미를 살리되, ἅπασαν의 총괄성을 ‘모든’으로 반영했습니다.
- source_word: κολάσατο αὐτοὺς καὶ πάντας τοὺς ἐπιβοηθοῦντας αὐτοῖς
  english_pob_choice: let him punish them and all who are helping them
  chosen_korean: 그들을 벌하고 그들을 돕는 모든 사람도 벌하게 하십시오
  alternatives_korean:
  - 그들에게 벌을 내리고 그들을 돕는 모든 사람도 벌하게 하십시오
  - 그들을 징벌하고 그들을 돕는 모든 이까지 징벌하게 하십시오
  lexicon: LSJ
  rationale: κολάζω의 징계/처벌 의미를 직접 반영해 ‘벌하다’로 옮겼고, βοηθέω 계열은 ‘돕다’의 기본 의미를 유지했습니다.
theological_decisions:
- issue: 왕의 명령문 안에서의 행위 주체와 책임의 강조
  chosen_reading: 보내는 사람과 파견된 사람이 모두 책임 있는 조사와 처벌을 수행하도록 요청하는 문장으로 옮겼습니다.
  alternative_readings:
  - 보다 완곡하게 ‘조사하게 하십시오’로 약화할 수 있음
  - ‘보복하다’로 강하게 옮길 수 있음
  rationale: 본문은 단순한 관찰이 아니라 파괴를 직접 확인한 뒤 처벌을 집행하라는 정치적·법적 명령이므로, 조사와 처벌의 긴장을 함께 드러내야 합니다.
  doctrine_reference: 역사서의 서술 윤리와 재판/처벌 어휘의 직접성
