base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/038.yaml
  text: Take vengeance on this man and on his camp[a], and let them fall by the sword. Remember their blasphemies[b], and grant them no survival.
  footnotes:
  - marker: a
    text: Or 'insults' or 'slanders' for 'blasphemies'; the Greek can denote abusive speech more broadly, but here the prayer context favors the more religiously charged sense.
    reason: lexical_alternative
  - marker: b
    text: Or 'give them no abiding place'/'grant them no respite'; the Greek expression may refer either to settled security or to rest from judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 사람과 그의 진영에 보복하시고, 그들이 칼에 쓰러지게 하십시오. 그들의 모독[a]을 기억하시고, 그들에게 머물 자리를 허락하지 마십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘신성모독’, ‘욕설’, ‘비방’으로 옮길 수 있습니다. 그리스어는 더 넓게 모욕적 발언을 가리킬 수 있지만, 여기서는 기도문 문맥상 종교적 모독의 의미가 더 강합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들에게 거처를 주지 마십시오’ 또는 ‘그들에게 머무를 곳을 주지 마십시오’로 옮길 수 있습니다. 그리스어는 정착된 안전이나 체류의 여지를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποίησον ἐκδίκησιν
  english_pob_choice: Take vengeance
  chosen_korean: 보복을 행하시고
  alternatives_korean:
  - 복수를 하시고
  - 징벌을 내리시고
  lexicon: LSJ
  rationale: 직역의 ‘보복을 하다’보다 한국어에서 자연스럽고, 원문의 징벌적 호소를 유지하는 표현으로 ‘보복을 행하다’를 택했습니다.
- source_word: ἐν τῷ ἀνθρώπῳ τούτῳ καὶ ἐν τῇ παρεμβολῇ αὐτοῦ
  english_pob_choice: on this man and on his camp
  chosen_korean: 이 사람과 그의 진영에 대해
  alternatives_korean:
  - 이 사람과 그의 진영에게
  - 이 사람과 그의 진영 위에
  lexicon: LSJ
  rationale: ἐν + 대상의 법정적/적대적 용법을 한국어 ‘~에 대해’로 자연스럽게 옮겨, 보복의 대상임을 분명히 했습니다.
- source_word: πεσάτωσαν ἐν ῥομφαίᾳ
  english_pob_choice: let them fall by the sword
  chosen_korean: 그들이 칼에 쓰러지게 하십시오
  alternatives_korean:
  - 그들이 칼로 쓰러지게 하십시오
  - 그들이 칼에 의해 쓰러지게 하십시오
  lexicon: LSJ
  rationale: ῥομφαία를 한국어 성경에서 널리 통용되는 ‘칼’로 옮기되, ‘쓰러지게 하십시오’로 죽음의 결과를 분명히 했습니다.
- source_word: μνήσθητι τῶν δυσφημιῶν αὐτῶν
  english_pob_choice: Remember their blasphemies
  chosen_korean: 그들의 모독을 기억하시고
  alternatives_korean:
  - 그들의 신성모독을 기억하시고
  - 그들의 욕설을 기억하시고
  lexicon: LSJ
  rationale: δυσφημία는 단순한 욕설보다 신성에 대한 모독을 포함할 수 있어, 원문의 종교적 무게를 살리면서도 한국어에서 자연스러운 ‘모독’을 택했습니다.
- source_word: μὴ δῷς αὐτοῖς μονήν
  english_pob_choice: grant them no survival
  chosen_korean: 그들에게 머물 자리를 허락하지 마십시오
  alternatives_korean:
  - 그들에게 생존을 허락하지 마십시오
  - 그들에게 안식을 허락하지 마십시오
  - 그들에게 거처를 허락하지 마십시오
  lexicon: LSJ
  rationale: μονή는 ‘머묾/거처/정착’을 뜻할 수 있으므로, 문맥상 심판 아래에서의 지속적 안전이나 정착을 부정하는 표현으로 ‘머물 자리’를 택했습니다.
theological_decisions:
- issue: δυσφημιῶν의 성격을 한국어에서 어떻게 살릴지
  chosen_reading: ‘모독’으로 옮겨, 단순한 인간관계의 비난이 아니라 하나님과 거룩한 것에 대한 불경을 포함하는 말로 표현했습니다.
  alternative_readings:
  - 욕설
  - 비방
  - 신성모독
  rationale: 이 구절은 전쟁/심판 기도 안에서 드려지므로, 공격적 언어 일반보다 종교적 모독의 차원을 드러내는 번역이 본문의 힘을 더 잘 보존합니다.
  doctrine_reference: '번역 원칙: 원문이 지닌 종교적·법정적 긴장을 완화하지 않고 드러냄.'
- issue: μονήν을 ‘survival’로 본 영어 POB의 해석을 한국어로 어떻게 반영할지
  chosen_reading: ‘머물 자리’를 허락하지 말라는 표현으로, 지속적 안착·존재의 여지를 거부하는 뜻을 살렸습니다.
  alternative_readings:
  - 생존을 허락하지 마십시오
  - 쉬게 하지 마십시오
  - 머무를 곳을 주지 마십시오
  rationale: μονή는 단순한 휴식보다 ‘머묾/정착/체류’를 가리킬 수 있어, 본문의 심판적 요청에 맞게 존재의 지속을 차단하는 의미를 유지했습니다.
  doctrine_reference: 원문 우선 원칙과, 문맥이 허용하는 의미 범위 안에서의 최적 대응.
