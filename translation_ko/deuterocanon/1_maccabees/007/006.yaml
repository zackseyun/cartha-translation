  source_fidelity: 그리스어의 핵심 의미는 대체로 충실합니다. 다만 ἐσκόρπισεν은 단순히 ‘흩어 버렸다’이며, 보조 동사 ‘버리다’는 원문에 없는 완료·단절의 강조를 더합니다. 또한 인용문의 종결을 합쇼체 직접화법에 자연스럽게 맞추는 편이 좋습니다.
  naturalness: ‘왕 앞에서 백성을 고발하여’와 ‘말하기를’의 결합은 문어적으로 가능하나 다소 무겁습니다. ‘왕 앞에서 백성을 고발하며 말하였습니다’가 현대 표준어 합쇼체에서 더 매끄럽습니다. 직접 인용은 ‘…습니다’로 마무리하는 것이 일관됩니다.
  terminology: ‘백성’, ‘고발하다’, ‘멸망시키다’, ‘친구들’, ‘땅’은 문맥에 맞습니다. φίλοι의 왕실·정치적 용법은 본문에서 ‘친구들’로 유지하고 각주로 대안을 제시하는 것이 적절합니다. 각주의 영어 단어 friends는 한국어 번역 각주에서는 한국어 표제어로 바꾸어야 합니다.
