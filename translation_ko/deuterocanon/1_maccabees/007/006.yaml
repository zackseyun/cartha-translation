  text: And they accused the people before the king[a], saying, “Judas and his brothers have destroyed all your friends, and have scattered us from our land.”
  footnotes:
  - marker: a
    text: Or 'your allies'; in royal contexts 'friends' can refer to the king's political supporters or court associates.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 왕 앞에서 백성을 고발하여 말하기를, 「유다와 그의 형제들이 당신의 모든 친구들을 멸망시켰고, 우리를 우리 땅에서 흩어 버렸습니다」라고 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 동맹자들’. 왕실 맥락에서 friends는 왕의 정치적 지지자나 궁정 인물을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατηγόρησαν
  english_pob_choice: accused
  chosen_korean: 고발하여
  alternatives_korean:
  - 비난하여
  - 책잡아
  lexicon: BDAG
  rationale: 왕 앞에서 제기된 적대적 진술이라는 점을 살려, 단순 서술보다 법적·공적 뉘앙스가 있는 ‘고발하여’로 옮겼습니다.
- source_word: τοῦ λαοῦ
  english_pob_choice: the people
  chosen_korean: 백성
  alternatives_korean:
  - 사람들
  - 나라
  lexicon: BDAG
  rationale: 그리스어의 일반적 집합 명사를 한국어로 자연스럽게 옮기되, 정치적 상황에서 ‘백성’이 가장 직접적이고 문맥상 무리 없는 대응입니다.
- source_word: Ἀπώλεσεν
  english_pob_choice: have destroyed
  chosen_korean: 멸망시켰고
  alternatives_korean:
  - 파괴했고
  - 없애 버렸고
  - 죽였고
  lexicon: BDAG
  rationale: ἀπόλλυμι는 단순 파괴보다 사람들의 파멸·멸망을 포함할 수 있으므로, 대상의 소멸을 강하게 드러내는 ‘멸망시켰고’가 문맥에 맞습니다.
- source_word: οἱ φίλοι σου
  english_pob_choice: your friends
  chosen_korean: 당신의 모든 친구들을
  alternatives_korean:
  - 당신의 모든 동맹자들을
  - 당신의 모든 측근들을
  lexicon: BDAG
  rationale: 헬라어 φίλοι의 궁정적 의미를 살릴 수 있으나, 본문 자체가 명시적으로 요구하는 범위는 ‘친구들’이므로 본문 의미를 과도하게 확장하지 않는 번역을 택했습니다.
- source_word: ἐσκόρπισεν
  english_pob_choice: have scattered
  chosen_korean: 흩어 버렸습니다
  alternatives_korean:
  - 흩었습니다
  - 분산시켰습니다
  - 쫓아냈습니다
  lexicon: BDAG
  rationale: 분산의 이미지를 유지하면서, 추방의 결과를 강하게 드러내는 한국어 표현으로 옮겼습니다.
