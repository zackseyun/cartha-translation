translation:
  language: ko
  text: 그들이 왕 앞에서 백성을 고발하며 말하였습니다. 「유다와 그의 형제들이 당신의 모든 친구들을 멸망시켰고, 우리를 우리 땅에서 흩었습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 동맹자들’. 왕실 맥락에서 ‘친구들’은 왕의 정치적 지지자들이나 궁정의 측근들을 가리킬 수 있습니다.
    reason: lexical_alternative
