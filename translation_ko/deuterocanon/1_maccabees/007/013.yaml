translation:
  language: ko
  text: 그리고 하시대인들은 이스라엘의 자손들 가운데서 처음이었으며, 그들에게서 평강을 구하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들 가운데서’. 그리스어는 전통적인 언약 표현인 ‘이스라엘의 자손들 가운데서’를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσιδαῖοι
  english_pob_choice: Hasideans
  chosen_korean: 하시대인들
  alternatives_korean:
  - 하시딤
  - 아시대인들
  lexicon: LSJ
  rationale: 고유 집단명은 설명적 풀어쓰기보다 음역이 적절하며, 영어 POB의 Hasideans에 맞춰 한국어에서는 외래어 표기상 자연스러운 ‘하시대인들’을 택했습니다.
- source_word: πρῶτοι
  english_pob_choice: the first
  chosen_korean: 처음이었으며
  alternatives_korean:
  - 첫째였으며
  - 가장 먼저였으며
  - 선두였으며
  lexicon: LSJ
  rationale: ἦσαν과 함께 쓰여 우선성/선행성을 나타내므로, 단순한 서열보다 ‘처음이었다’는 뜻을 살려 서술했습니다.
- source_word: ἐν υἱοῖς Ἰσραήλ
  english_pob_choice: among the sons of Israel
  chosen_korean: 이스라엘의 자손들 가운데서
  alternatives_korean:
  - 이스라엘 사람들 가운데서
  - 이스라엘 자손들 가운데서
  - 이스라엘인들 가운데서
  lexicon: LSJ
  rationale: 직역에 가깝게 ‘자손들’로 옮겨 전통적인 언약적 표현을 보존했고, ἐν의 관계를 자연스럽게 드러내기 위해 ‘가운데서’를 사용했습니다.
- source_word: ἐπεζήτουν παρʼ αὐτῶν εἰρήνην
  english_pob_choice: they sought peace from them
  chosen_korean: 그들에게서 평강을 구하였습니다
  alternatives_korean:
  - 그들에게서 평화를 구하였습니다
  - 그들과의 평화를 구하였습니다
  - 그들에게 평화 협정을 요청하였습니다
  lexicon: LSJ
  rationale: ἐπεζήτουν은 ‘구하였다/찾았다’의 진행된 시도를 나타내며, εἰρήνην은 이 구절에서 단순한 ‘평화’보다 관계 회복과 화평의 의미를 담을 수 있어 POB 기본 용례인 ‘평강’으로 옮겼습니다.
theological_decisions:
- issue: 유대 민족을 가리키는 언약적 표현 υἱοῖς Ἰσραήλ의 처리
  chosen_reading: ‘이스라엘의 자손들’로 유지했습니다.
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘인들
  rationale: 그리스어가 실제로 ‘sons of Israel’를 사용하므로, 현대적 중립화보다 원문의 언약적·전승적 표현을 보존하는 쪽이 더 충실합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
