  text: Let there be no battle between me and you. I will come with a few men, so that I may see your faces in peace.
translation:
  language: ko
  text: 나와 너희 사이에 전쟁이 없게 하십시오. 나는 적은 수의 사람들과 함께 가서, 너희의 얼굴을 평안 가운데 보고자 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ ἔστω
  english_pob_choice: Let there be no
  chosen_korean: 전쟁이 없게 하십시오
  alternatives_korean:
  - 나와 너희 사이에 싸움이 없게 하십시오
  - 나와 너희 사이에 전쟁이 없기를 바랍니다
  lexicon: BDAG
  rationale: 부정 명령형의 직접성을 살리면서도 한국어 합쇼체 요청으로 자연스럽게 옮겼습니다. '전쟁'은 μάχη의 군사·정치적 맥락을 반영합니다.
- source_word: ἀνὰ μέσον ἐμοῦ καὶ ὑμῶν
  english_pob_choice: between me and you
  chosen_korean: 나와 너희 사이에
  alternatives_korean:
  - 나와 너희들 사이에
  - 우리 사이에
  lexicon: BDAG
  rationale: 원문의 관계 표현을 그대로 살려, 화자와 청중 사이의 구분을 분명하게 했습니다.
- source_word: ἐν ἀνδράσιν ὀλίγοις
  english_pob_choice: with a few men
  chosen_korean: 적은 수의 사람들과 함께
  alternatives_korean:
  - 몇 사람과 함께
  - 소수의 남자들과 함께
  lexicon: BDAG
  rationale: 수적 적음을 드러내는 표현을 택했고, ἀνδράσιν의 남성성을 한국어에서 과도하게 성별화하지 않으면서도 문맥상 동료/수행원을 자연스럽게 살렸습니다.
- source_word: ὑμῶν τὰ πρόσωπα
  english_pob_choice: your faces
  chosen_korean: 너희의 얼굴을
  alternatives_korean:
  - 너희 얼굴을
  - 너희의 모습을
  lexicon: BDAG
  rationale: 직역에 가까운 '얼굴'을 유지해 원문의 관용적이면서도 구체적인 표현을 보존했습니다.
theological_decisions:
- issue: μετ’ εἰρήνης의 평화/평안 뉘앙스
  chosen_reading: 평안 가운데
  alternative_readings:
  - 평화롭게
  - 평강 가운데
  rationale: 관계의 무사함과 화해적 상태를 함께 드러내기 위해 '평안 가운데'를 택했습니다. '평강'은 교회적 어감이 강해 여기서는 보다 중립적인 표현이 적절합니다.
  doctrine_reference: 공적 화해와 무충돌의 문맥
