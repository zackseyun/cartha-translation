  naturalness: ‘그들이 그를 믿었습니다. 그리고 그들은 그들 중에서 예순 명을 붙잡아, 그는 그들을 하루에 죽였습니다’는 의도적인 주어 전환 때문에 다소 긴장감이 있으나, 원문의 문법적 불일치를 충실히 보존하는 현대 한국어 합쇼체입니다. ‘하루에’는 시간의 범위를 과도하게 보태지 않고 ἐν ἡμέρᾳ μιᾷ를 자연스럽게 반영합니다.
