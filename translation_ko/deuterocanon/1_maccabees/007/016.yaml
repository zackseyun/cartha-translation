translation:
  language: ko
  text: 그들이 그를 신뢰했습니다. 그리고 그들은 그들 중에서 예순 명을 붙잡아[a], 그는 그들을 하루에 죽였습니다. 그가 기록한 말들에 따라 한 일이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 ‘그들이 붙잡았다’(복수) 뒤에 ‘그는 죽였다’(단수)가 이어지는 혼합 구조를 보입니다. 번역은 이 주어의 수적 전환을 그대로 드러냅니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἐνεπίστευσαν
  english_pob_choice: they trusted
  chosen_korean: 그를 믿었습니다
  alternatives_korean:
  - 그를 신뢰했습니다
  - 그를 믿었습니다
  lexicon: BDAG
  rationale: 문맥상 단순한 지적 동의가 아니라 사람에게 신뢰를 둔 의미이므로, 한국어에서는 가장 자연스러운 ‘믿다/신뢰하다’로 옮겼습니다.
- source_word: συνέλαβον ἐξ αὐτῶν ἑξήκοντα ἄνδρας
  english_pob_choice: he seized sixty men from among them
  chosen_korean: 그들 가운데서 예순 명을 붙잡아
  alternatives_korean:
  - 그들 가운데서 예순 명을 체포하여
  - 그들 가운데서 예순 명을 사로잡아
  lexicon: LSJ / BDAG
  rationale: POB의 영어처럼 행위의 주도권을 한 사람에게 두어 서술의 흐름을 살렸고, ‘붙잡다’는 폭력적 체포 행위를 무난하게 드러냅니다.
- source_word: ἐν ἡμέρᾳ μιᾷ
  english_pob_choice: in one day
  chosen_korean: 하루 만에
  alternatives_korean:
  - 하룻날에
  - 하루 안에
  lexicon: BDAG
  rationale: 시간 범위를 자연스러운 현대 한국어로 전달하면서, 짧은 기간 안에 일어난 처형의 급박함을 보존합니다.
- source_word: κατὰ τοὺς λόγους οὓς ἔγραφεν
  english_pob_choice: according to the words that he wrote
  chosen_korean: 그가 쓴 말대로
  alternatives_korean:
  - 그가 기록한 말대로
  - 그가 써 놓은 말대로
  lexicon: BDAG
  rationale: 직역하면 ‘그가 쓴 말들대로’이지만 한국어에서는 서면 발언/기록의 준거를 ‘말대로’로 자연스럽게 나타내며, 뒤따를 인용을 예고하는 성격을 유지합니다.
theological_decisions:
- issue: 그리스어의 혼합된 인칭·수 일치(ἐνεπίστευσαν / συνέλαβον / ἀπέκτεινεν)를 한국어에서 어떻게 처리할지
  chosen_reading: 의미상 주도 행위자를 단수로 보지 않고, 원문의 복수·단수 혼합을 그대로 살려 ‘그들이 … 그들 가운데서 … 그는 …’ 구조로 옮겼습니다.
  alternative_readings:
  - 문맥을 따라 전부 단수 주어로 정리하여 ‘그는 믿는 척하게 하고…’처럼 매끈하게 재구성
  - 모든 동사를 복수로 맞춰 직역
  rationale: 이 절은 원문 자체에 수적 불일치가 있으므로, 이를 평탄화하면 텍스트의 불안정성과 서술 긴장을 지워 버립니다. 한국어 번역도 그 혼합을 드러내어 독자가 본문 상태를 인지하도록 했습니다.
  doctrine_reference: '번역 원칙 §5: 문법적 불일치와 본문 증거의 보존'
