  text: And he sneered at them, and laughed at them and defiled them, and spoke arrogantly.
translation:
  language: ko
  text: 그는 그들을 비웃고, 그들을 조롱하고, 그들을 더럽히고, 오만하게 말했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμυκτήρισεν
  english_pob_choice: sneered at
  chosen_korean: 비웃고
  alternatives_korean:
  - 조롱하고
  - 경멸하고
  - 코웃음치고
  lexicon: LSJ
  rationale: μυκτηρίζω는 상대를 깔보며 조롱하는 뉘앙스가 강하므로, ‘비웃다’가 현대 한국어에서 그 경멸감을 가장 자연스럽게 드러냅니다.
- source_word: κατεγέλασεν
  english_pob_choice: laughed at
  chosen_korean: 조롱하고
  alternatives_korean:
  - 웃어넘기고
  - 비웃고
  - 희롱하고
  lexicon: LSJ
  rationale: καταγελάω는 ‘웃어대며 업신여기다’는 뜻이므로, 앞의 ‘비웃다’와 겹치지 않게 ‘조롱하다’로 옮겨 반복되는 경멸의 누적을 살렸습니다.
- source_word: ἐμίανεν
  english_pob_choice: defiled
  chosen_korean: 더럽히고
  alternatives_korean:
  - 부정하게 하고
  - 모독하고
  - 더럽게 하고
  lexicon: LSJ
  rationale: μιαίνω는 문자적 오염보다도 사람을 모욕하거나 더럽히는 강한 부정의 뉘앙스를 담을 수 있어, 문맥의 강도를 살리면서도 한국어 독자가 바로 이해할 수 있는 ‘더럽히다’를 택했습니다.
- source_word: ἐλάλησεν ὑπερηφάνως
  english_pob_choice: spoke arrogantly
  chosen_korean: 오만하게 말했습니다
  alternatives_korean:
  - 거만하게 말했습니다
  - 뽐내듯 말했습니다
  - 교만하게 말했습니다
  lexicon: LSJ
  rationale: ὑπερηφάνως는 우쭐대는 태도와 교만한 발화를 뜻하므로, 비교적 직설적인 ‘오만하게’가 어조를 가장 정확히 전달합니다.
