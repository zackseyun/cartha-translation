base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/041.yaml
  text: When those from the king were speaking abusively[b][a], your angel went out and struck down one hundred eighty-five thousand among them.
  footnotes:
  - marker: a
    text: Or 'were blaspheming.' The Greek verb can mean speaking abusively, reviling, or speaking impiously; the broader wording is kept in the main text.
    reason: lexical_alternative
  - marker: b
    text: This alludes to the destruction of the Assyrian army in the days of Hezekiah; compare 2 Kings 19:35 and Isaiah 37:36.
    reason: cross_reference
translation:
  language: ko
  text: 왕에게서 온 자들이 모독하는 말을 하고 있을 때, 당신의 천사가 나가 그들 가운데서 십팔만오천 명을 쳐 죽였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘신성모독하고 있었다’. 이 동사는 더 넓게는 모독하는 말을 하다, 헐뜯다, 불경하게 말하다를 뜻할 수 있으므로 본문에는 더 넓은 표현을 유지했습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 표현은 히스기야 시대에 앗시리아 군대가 멸망한 사건을 암시합니다. 열왕기하 19:35와 이사야 37:36을 비교하십시오.
    reason: cross_reference
lexical_decisions:
- source_word: Οἱ παρὰ τοῦ βασιλέως
  english_pob_choice: those from the king
  chosen_korean: 왕의 편에 있던 자들
  alternatives_korean:
  - 왕에게서 온 자들
  - 왕의 사람들
  - 왕이 보낸 자들
  lexicon: LSJ
  rationale: 문맥상 단순한 출신보다 왕을 대표하거나 왕 편에 선 무리를 가리키므로, 한국어에서는 자연스럽게 ‘왕의 편에 있던 자들’로 풀어 원문 관계를 살리면서도 과도하게 특정하지 않았습니다.
- source_word: ἐδυσφήμουν
  english_pob_choice: were speaking abusively
  chosen_korean: 모독적인 말을 하고 있을 때
  alternatives_korean:
  - 신성모독하고 있을 때
  - 비방하고 있을 때
  - 욕설을 퍼붓고 있을 때
  lexicon: LSJ
  rationale: 동사는 ‘욕되게 말하다, 헐뜯다, 신성모독하다’까지 폭이 있어, 본문에서 신학적 함의는 남기되 더 넓은 의미를 살리는 표현으로 옮겼습니다.
- source_word: ἄγγελός σου
  english_pob_choice: your angel
  chosen_korean: 당신의 천사
  alternatives_korean:
  - 당신의 사자
  - 당신의 메신저
  lexicon: LSJ
  rationale: 여기서는 하늘의 심판 집행자로 읽히므로, ἄγγελος를 ‘천사’로 옮겨 역사적 암시와 초월적 주체성을 함께 드러냈습니다.
- source_word: ἐπάταξεν ἐν αὐτοῖς ἑκατὸν ὀγδοήκοντα πέντε χιλιάδας
  english_pob_choice: struck down one hundred eighty-five thousand among them
  chosen_korean: 그들 가운데서 십팔만오천 명을 쳐 죽였습니다
  alternatives_korean:
  - 그들 가운데서 십팔만오천 명을 쳤습니다
  - 그들 가운데서 십팔만오천 명을 멸했습니다
  lexicon: LSJ
  rationale: ἐπάταξεν은 단순한 타격보다 치명적 타격을 뜻하므로, 결과를 분명히 드러내는 ‘쳐 죽였습니다’가 문맥에 가장 맞습니다.
theological_decisions:
- issue: ‘모독적인 말을 하고 있을 때’의 신학적 강도
  chosen_reading: 직접적인 ‘신성모독’보다 넓은 ‘모독적인 말’로 유지했습니다.
  alternative_readings:
  - 신성모독하고 있을 때
  - 야훼를 모독하고 있을 때
  rationale: 원문의 δυσφημέω는 반드시 기술적 ‘신성모독’만 뜻하지 않으므로, 본문이 암시하는 경멸과 반역의 뉘앙스를 남기되 단정적 신학 용어로 좁히지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: ‘당신의 천사’의 존재 양식
  chosen_reading: 하늘의 심판을 집행하는 천사로 이해되는 표현을 그대로 살렸습니다.
  alternative_readings:
  - 당신의 사자
  - 당신의 메신저
  rationale: 역사적 암시는 왕의 군대를 치는 초자연적 존재이므로, 비신화화된 표현으로 완화하지 않고 본문이 전제하는 천사 개념을 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 6
