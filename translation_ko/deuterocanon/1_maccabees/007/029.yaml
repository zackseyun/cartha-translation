base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/029.yaml
  text: And he came to Judas[a], and they greeted one another peaceably[b]; but the enemies were ready to seize Judas.
  footnotes:
  - marker: a
    text: Or 'peacefully' or 'in peace.' The Greek adverb emphasizes the apparently peaceful manner of the meeting.
    reason: lexical_alternative
  - marker: b
    text: The Greek verb can mean 'snatch away' or 'seize suddenly,' highlighting the treacherous intent behind the peaceful greeting.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 유다에게 왔고, 그들은 서로 평화롭게 인사하였습니다. 그러나 원수들은 유다를 덮쳐 붙잡을 준비가 되어 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘평화롭게’, ‘평화 속에서’. 그리스어 부사는 만남의 겉모습이 평화로웠음을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 동사는 ‘갑자기 낚아채다’, ‘순식간에 붙잡다’의 뜻도 될 수 있어, 평화로운 인사 뒤에 숨은 적의 의도를 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν πρὸς Ἰούδαν
  english_pob_choice: came to Judas
  chosen_korean: 유다에게 왔고
  alternatives_korean:
  - 유다에게 다가왔고
  - 유다를 찾아왔고
  lexicon: LSJ
  rationale: πρός + 대격은 사람을 향한 이동을 나타내므로, 현대 한국어에서는 자연스럽게 ‘유다에게 왔고’로 옮기는 것이 직접적입니다.
- source_word: ἠσπάσαντο ἀλλήλους
  english_pob_choice: they greeted one another
  chosen_korean: 서로 인사하였습니다
  alternatives_korean:
  - 서로 맞이하였습니다
  - 서로 문안하였습니다
  lexicon: LSJ
  rationale: ἀσπάζομαι는 기본적으로 인사하다/문안하다의 뜻이므로, 물리적 포옹을 불필요하게 넣지 않고 ‘서로 인사하였습니다’로 옮겼습니다.
- source_word: εἰρηνικῶς
  english_pob_choice: peaceably
  chosen_korean: 평화롭게
  alternatives_korean:
  - 평온하게
  - 화평하게
  lexicon: LSJ
  rationale: 부사형의 외형적 평화로움을 살리되, 앞뒤 문맥의 대비를 자연스럽게 드러내기 위해 ‘평화롭게’를 선택했습니다.
- source_word: ἐξαρπάσαι
  english_pob_choice: to seize
  chosen_korean: 덮쳐 붙잡을
  alternatives_korean:
  - 급히 붙잡을
  - 갑자기 빼앗아 갈
  lexicon: LSJ
  rationale: ἐξαρπάζω는 ‘갑자기 낚아채다/빼앗다’의 뉘앙스가 있어, 매복의 기습성을 살리기 위해 ‘덮쳐 붙잡을’로 옮겼습니다.
theological_decisions:
- issue: 평화로운 인사와 숨은 적대의 대비
  chosen_reading: 겉으로는 평화로운 인사였지만 실제로는 유다를 체포하려는 함정이라는 긴장감을 문장 안에서 유지했습니다.
  alternative_readings:
  - 단순히 평화롭게 인사했다고만 옮기는 방식
  - 적의 의도를 명시적으로 해설하는 방식
  rationale: 원문은 εἰρηνικῶς와 ἕτοιμοι ἐξαρπάσαι의 대비로 아이러니를 형성하므로, 그 긴장을 번역문에서 드러내는 것이 적절합니다.
  doctrine_reference: 본문 서술의 아이러니와 서사적 긴장
