translation:
  language: ko
  text: '그리고 누메니오스와 그와 함께한 사람들이 로마에서 왕들과 여러 나라에 보낸 편지들을 가지고 왔습니다. 그 편지들에는 다음과 같이 적혀 있었습니다:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦλθεν
  english_pob_choice: came back
  chosen_korean: 와서
  alternatives_korean:
  - 돌아와서
  - 왔다
  lexicon: LSJ
  rationale: 문맥상 로마에 다녀온 사절단의 귀환이므로 ‘와서’로 자연스럽게 옮기되, 원문의 단순한 이동 동사를 과도하게 해석하지 않도록 했습니다.
- source_word: οἱ παρʼ αὐτοῦ
  english_pob_choice: those with him
  chosen_korean: 그와 함께 있던 사람들
  alternatives_korean:
  - 그의 동행자들
  - 그와 함께한 이들
  lexicon: LSJ
  rationale: 동반한 무리를 가리키는 관용구이므로, 관계를 분명히 드러내는 한국어로 옮겼습니다.
- source_word: ἔχοντες ἐπιστολάς
  english_pob_choice: bringing letters
  chosen_korean: 편지를 가지고 왔는데
  alternatives_korean:
  - 편지를 들고 왔는데
  - 편지를 지니고 왔는데
  lexicon: LSJ
  rationale: 부가 동작을 나타내는 분사구문이므로, 공식 문서의 소지 상태를 자연스럽게 드러내는 표현을 선택했습니다.
- source_word: τοῖς βασιλεῦσι καὶ ταῖς χώραις
  english_pob_choice: to the kings and the countries
  chosen_korean: 왕들과 여러 나라에
  alternatives_korean:
  - 왕들과 나라들에
  - 왕들과 지역들에
  lexicon: LSJ
  rationale: 편지의 수신 대상을 나타내는 여격을 한국어의 방향격으로 풀었고, χώρα는 여기서 ‘나라/국가’의 뜻이 가장 مستقیم하므로 ‘여러 나라’로 옮겼습니다.
- source_word: ἐν αἷς ἐγέγραπτο τάδε
  english_pob_choice: in which these things had been written
  chosen_korean: 그 편지들에는 다음과 같이 적혀 있었습니다
  alternatives_korean:
  - 그 편지들에는 이렇게 쓰여 있었습니다
  - 그 안에는 다음 내용이 적혀 있었습니다
  lexicon: LSJ
  rationale: ‘이것들/다음 것들’의 복수 뉘앙스를 한국어에서 가장 자연스럽게 살리기 위해 서술 도입구로 옮겼습니다.
theological_decisions:
- issue: 로마에서 온 사절단의 귀환 여부를 어떻게 드러낼지
  chosen_reading: 단순히 ‘와서’로 두되 문맥상 귀환을 암시하게 했습니다.
  alternative_readings:
  - 돌아와서
  - 로마에서 돌아와
  rationale: 원문 ἦλθεν 자체는 단순히 ‘왔다’이지만, 앞선 문맥에서 로마 사절로 파견된 인물이라는 점이 분명하므로, 번역 본문에서는 과도한 해석을 피하면서도 서술의 자연스러움을 살렸습니다.
  doctrine_reference: 문맥 기반 서술 정확성
