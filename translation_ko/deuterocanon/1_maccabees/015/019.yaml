  source_fidelity: 수정이 필요합니다. 원문의 αὐτοῖς/αὐτούς(그들에게/그들을)는 편지를 받는 왕들과 나라들이 아니라, 보호의 대상인 유대인 측을 가리킵니다. 초안의 반복된 ‘우리’는 발신자인 로마 측과 보호 대상의 지시 대상을 혼동합니다. 또한 인쇄본의 ‘Α πόλεις’는 본문 문제를 각주로 밝혀야 합니다.
