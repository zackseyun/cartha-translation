base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/019.yaml
  text: It therefore seemed good to us to write to the kings and the countries[a], that they should not seek harm against them, and should not make war against them and their cities and their countries[b], and that they should not join in alliance with those who are making war against them.
  footnotes:
  - marker: a
    text: Greek has 'countries' (χῶραι) both for the recipients of the letter and for the lands belonging to the Jews; 'lands' or 'territories' are possible alternatives in both places.
    reason: lexical_alternative
  - marker: b
    text: The printed Swete text reads 'A cities' at one point, which appears to reflect an edition/transcription issue; the sense is naturally 'their cities' in context.
    reason: textual_variant
translation:
  language: ko
  text: 그리하여 우리는 왕들과 나라들에 편지를 보내어, 그들이 우리에게 해를 찾지 않게 하고, 우리와 그들의 성읍들과 그들의 나라들에 대하여 전쟁을 일으키지 않게 하며, 우리와 전쟁하는 자들과 동맹을 맺지 않게 하는 것이 좋다고 여겼습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: χώρα는 여기서 왕들과 병렬되는 정치적 실체를 가리킬 수 있어 ‘나라들’로 옮겼습니다. 문맥에 따라 ‘땅들’이나 ‘영토들’도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: 본문의 뒤쪽 χώρας는 그들의 지배 아래 있는 지역을 가리키므로, 한국어에서는 같은 말 ‘나라들’로 일관해도 무리가 없습니다. 더 직역하면 ‘영토들’도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρεσεν οὖν ἡμῖν
  english_pob_choice: it seemed good to us
  chosen_korean: 그리하여 우리는 … 좋다고 여겼습니다
  alternatives_korean:
  - 우리는 … 좋게 여겼습니다
  - 우리에게 … 옳게 보였습니다
  lexicon: LSJ
  rationale: 공적·외교적 결정 공식을 한국어로 자연스럽게 옮기면서도, 원문의 판단/승인 뉘앙스를 유지했습니다.
- source_word: γράψαι
  english_pob_choice: to write
  chosen_korean: 편지를 보내어
  alternatives_korean:
  - 기록하여
  - 쓰게 하여
  lexicon: LSJ
  rationale: 문맥상 단순한 ‘쓰기’가 아니라 왕들과 나라들에 대한 공식 서신 발송이므로, 의미를 해치지 않는 범위에서 한국어 행정문체로 구체화했습니다.
- source_word: ταῖς χώραις
  english_pob_choice: to the countries
  chosen_korean: 나라들
  alternatives_korean:
  - 땅들
  - 영토들
  - 지역들
  lexicon: LSJ
  rationale: χώρα를 여기서는 정치적 실체로 받은 POB의 ‘countries’에 맞추되, 한국어에서는 ‘나라들’이 가장 자연스럽고 문맥상 왕들과 병렬을 이룹니다.
- source_word: μὴ ἐκζητήσωσιν αὐτοῖς κακά
  english_pob_choice: that they should not seek harm against them
  chosen_korean: 그들이 우리에게 해를 찾지 않게 하고
  alternatives_korean:
  - 그들이 우리에게 해를 꾀하지 않게 하고
  - 그들이 우리를 해치려 하지 않게 하고
  lexicon: LSJ
  rationale: ἐκζητέω + κακά의 적극적 ‘추구/모색’ 의미를 살려 ‘해를 찾다’로 직역성을 유지했습니다. ‘해치려 하다’는 결과 중심으로 다소 약해질 수 있습니다.
- source_word: πολεμήσωσιν / συμμαχώσιν τοῖς πολεμοῦσιν αὐτούς
  english_pob_choice: should not make war / should not join in alliance with those who are making war against them
  chosen_korean: 전쟁을 일으키지 않게 하며, 우리와 전쟁하는 자들과 동맹을 맺지 않게
  alternatives_korean:
  - 전쟁하지 않게 하며, 우리를 치는 자들과 연합하지 않게
  - 전쟁을 벌이지 않게 하며, 우리와 싸우는 자들을 돕지 않게
  lexicon: LSJ
  rationale: πολεμέω와 συμμαχέω의 군사·외교적 의미를 각각 ‘전쟁을 일으키다’, ‘동맹을 맺다’로 살려, 단순한 분쟁 회피보다 더 공식적인 적대 금지 조항으로 드러냈습니다.
theological_decisions:
- issue: 공식 칙령/외교 문서의 화법
  chosen_reading: 결정 문구를 ‘좋다고 여겼습니다’와 목적절 연쇄로 옮겨, 왕들과 나라들에 대한 공식 서신의 문체를 유지했습니다.
  alternative_readings:
  - 더 서술적으로 ‘우리는 편지를 보내기로 했습니다’
  - 더 평이하게 ‘우리는 그렇게 하기로 했습니다’
  rationale: 원문은 개인적 의사표현이 아니라 공적 승인·지시의 문서체이므로, 한국어도 행정적·외교적 어조를 보존하는 것이 적절합니다.
  doctrine_reference: 문체/장르 보존
