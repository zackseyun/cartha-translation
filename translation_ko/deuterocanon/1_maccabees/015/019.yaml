- source_word: ταῖς χώραις
  english_pob_choice: to the countries
  chosen_korean: 나라들
  alternatives_korean:
  - 땅들
  - 영토들
  - 지역들
  lexicon: LSJ
  rationale: χώρα를 여기서는 정치적 실체로 받은 POB의 ‘countries’에 맞추되, 한국어에서는 ‘나라들’이 가장 자연스럽고 문맥상 왕들과 병렬을 이룹니다.
- source_word: μὴ ἐκζητήσωσιν αὐτοῖς κακά
  english_pob_choice: that they should not seek harm against them
  chosen_korean: 그들이 우리에게 해를 찾지 않게 하고
  alternatives_korean:
  - 그들이 우리에게 해를 꾀하지 않게 하고
  - 그들이 우리를 해치려 하지 않게 하고
  lexicon: LSJ
  rationale: ἐκζητέω + κακά의 적극적 ‘추구/모색’ 의미를 살려 ‘해를 찾다’로 직역성을 유지했습니다. ‘해치려 하다’는 결과 중심으로 다소 약해질 수 있습니다.
- source_word: πολεμήσωσιν / συμμαχώσιν τοῖς πολεμοῦσιν αὐτούς
  english_pob_choice: should not make war / should not join in alliance with those who are making war against them
  chosen_korean: 전쟁을 일으키지 않게 하며, 우리와 전쟁하는 자들과 동맹을 맺지 않게
  alternatives_korean:
