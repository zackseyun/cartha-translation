review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. ἀφέσθω는 왕령의 선언적 수동 명령으로, ‘탕감해 주어야 합니다’처럼 의무를 나타내는 능동적 표현보다 ‘면제됩니다/면제받습니다’가 더 충실합니다. 또한 ‘왕실 채무’는 현대 한국어에서 왕실이 진 빚으로도 읽힐 수 있으므로, 왕에게 바쳐야 하는 채무라는 재정 문맥을 밝혀야 합니다.
  naturalness: 현 번역은 전반적으로 이해되지만, ‘탕감해 주어야 합니다’는 누가 누구에게 하는지 불분명하고 본문의 포고문 어조와도 맞지 않습니다. ‘당신은 … 면제받습니다’는 현대 한국어 합쇼체에서 자연스럽고 수혜자(σοι)를 분명히 합니다.
  terminology: ὀφείλημα은 여기서 왕에게 납부할 채무·부과금의 성격이므로 ‘왕에게 바쳐야 할 채무’로 옮깁니다. τὰ ἐσόμενα βασιλικά는 세목을 특정하지 않은 장래의 왕실 수입이므로 ‘앞으로 왕실에 들어올 수입’으로 유지합니다. εἰς τὸν ἅπαντα χρόνον은 법령의 지속성을 나타내므로 ‘영구히’가 적절합니다.
  issues:
