    issue: ‘탕감해 주어야 합니다’가 ἀφέσθω의 법령적 수동 명령을 의무 표현으로 바꾸고 행위 주체를 불분명하게 합니다.
    rationale: 원문은 왕이 수신자에게 해당 의무와 장래 수입을 면제하도록 선포하는 형식입니다. 한국어에서는 수혜자를 주어로 하여 ‘면제받습니다’라고 하는 편이 이를 정확히 드러냅니다.
  - severity: medium
    issue: ‘왕실 채무’는 왕실이 지고 있는 채무로 오해될 수 있습니다.
    rationale: 문맥상 면제되는 것은 수신자가 왕에게 부담하던 채무 또는 왕에게 귀속될 재정상 납부액입니다. ‘왕에게 바쳐야 할’로 납부 방향을 명시하는 것이 안전합니다.
  - severity: low
