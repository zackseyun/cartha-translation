  yaml_path: translation/deuterocanon/1_maccabees/015/008.yaml
  text: And let every royal debt[a], and the royal revenues yet to come, from now on and for all time, be remitted to you.
  footnotes:
  - marker: a
    text: Or 'future royal dues' or 'what will accrue to the king.' The Greek does not specify the exact category of income beyond its royal character and future accrual.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 모든 왕실 채무와 앞으로 생길 왕실 수입은 지금부터 영원히 당신에게 탕감해 주어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘왕실 수입’은 그리스어의 τὰ ἐσόμενα βασιλικά를 과도하게 특정하지 않기 위한 번역입니다. 원문은 정확한 세목을 밝히지 않고, 앞으로 왕에게 귀속될 것들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ὀφείλημα βασιλικὸν
  english_pob_choice: every royal debt
  chosen_korean: 모든 왕실 채무
  alternatives_korean:
  - 모든 왕실 부채
  - 각각의 왕실 채무
  - 왕에게 속한 모든 빚
  lexicon: LSJ
  rationale: ὀφείλημα의 핵심은 ‘져야 하는 것/빚’이므로, 재정·법정 문맥에 맞는 ‘채무’로 옮기고 βασιλικὸν은 ‘왕실’로 간결하게 살렸습니다.
- source_word: τὰ ἐσόμενα βασιλικά
  english_pob_choice: the royal revenues yet to come
  chosen_korean: 앞으로 생길 왕실 수입
  alternatives_korean:
  - 앞으로 올 왕실 세입
  - 미래의 왕실 수입
  - 장차 발생할 왕실 수입
  lexicon: LSJ
  rationale: ἐσόμενα는 ‘앞으로 될/생길’의 미래 분사이고, βασιλικά는 구체적 세목을 밝히지 않으므로, 과도하게 특정하지 않으면서 미래 귀속 수입의 뜻을 살린 표현을 택했습니다.
- source_word: ἀφέσθω
  english_pob_choice: be remitted
  chosen_korean: 탕감해 주어야 합니다
  alternatives_korean:
  - 면제되어야 합니다
  - 면제해 주어야 합니다
  - 취소되어야 합니다
  lexicon: LSJ
  rationale: 아피에미의 재정·법적 용법을 살려 ‘탕감하다’로 옮기되, 왕의 포고문 형식에 맞게 수동적 효력보다는 선언적 허가의 느낌을 주었습니다.
- source_word: εἰς τὸν ἅπαντα χρόνον
  english_pob_choice: for all time
  chosen_korean: 영원히
  alternatives_korean:
  - 모든 때까지
  - 항구히
  - 끝없이
  lexicon: LSJ
  rationale: 문맥상 철회 없는 지속을 뜻하므로 한국어의 자연스러운 영속 표현인 ‘영원히’를 택했습니다.
theological_decisions:
- issue: 왕실 채무와 수입의 면제 조치 표현
  chosen_reading: 법적·재정적 특권을 선포하는 왕령으로 읽고, 종교적 ‘용서’가 아니라 행정적 ‘탕감’으로 번역했습니다.
  alternative_readings:
  - 죄 사함의 언어처럼 ‘용서’로 완화하는 번역
  - 단순한 세금 감면으로 좁히는 번역
  rationale: ἀφέσθω는 여기서 부채/세입 취소의 행정 용법이므로, 신학적 용서어휘로 바꾸면 원문의 왕령 성격이 흐려집니다.
  doctrine_reference: 문맥 우선의 행정·법정 어휘 유지
