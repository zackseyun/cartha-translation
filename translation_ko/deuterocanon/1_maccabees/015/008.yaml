revisions:
- from: 그리고 모든 왕실 채무와 앞으로 생길 왕실 수입은 지금부터 영원히 당신에게 탕감해 주어야 합니다.[a]
  to: 그리고 당신은 지금부터 영구히 왕에게 바쳐야 할 모든 채무와 앞으로 왕실에 들어올 모든 수입을 면제받습니다.[a]
  rationale: 수혜자 σοι를 ‘당신은 … 면제받습니다’로 명시하고, ἀφέσθω의 포고문적 수동 명령을 자연스러운 한국어 법령 문체로 반영했습니다. 또한 ‘왕실 채무’의 소유·방향 모호성을 줄이되, 장래 왕실 수입의 구체적 세목은 원문처럼 특정하지 않았습니다.
