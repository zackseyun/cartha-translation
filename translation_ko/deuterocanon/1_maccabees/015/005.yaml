base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/005.yaml
  text: Now therefore I confirm for you all the remissions that the kings before me granted you[b][a], and whatever other remissions they granted you.
  footnotes:
  - marker: a
    text: The Greek text ends with a singular verb, 'he granted you,' after the plural subject 'the kings before me.' This may reflect the transmitted wording as preserved in Swete's text; some readers may expect 'they granted you.'
    reason: textual_variant
  - marker: b
    text: '''Remissions'' refers to royal fiscal concessions or reductions in dues, not necessarily complete exemption from all obligations.'
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 이제 나는 내 앞선 왕들이 너에게 허락한 모든 면제와 그들이 너에게 허락한 그 밖의 모든 면제를 너에게 확정합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 복수 주어 ‘내 앞선 왕들’ 뒤에 단수 동사 형태를 끝에 두고 있습니다. 이는 스웨테 본문에 전해진 문구를 반영한 것으로 보이며, 어떤 독자들은 ‘그들이 너에게 허락했다’고 기대할 수 있습니다.
    reason: textual_variant
  - marker: b
    text: ‘면제’는 반드시 모든 의무의 전면 면제를 뜻하기보다, 왕이 부과하던 조세나 부담의 감면을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: νῦν οὖν
  english_pob_choice: Now therefore
  chosen_korean: 그러므로 이제
  alternatives_korean:
  - 이제 그러므로
  - 그러니 이제
  lexicon: LSJ
  rationale: 두 입자의 인과·전환 기능을 함께 살리면서, 왕의 공식 선언문에 어울리는 자연스러운 한국어 연결로 옮겼습니다.
- source_word: ἵστημί
  english_pob_choice: I confirm
  chosen_korean: 확정합니다
  alternatives_korean:
  - 확인합니다
  - 설정합니다
  - 공포합니다
  lexicon: LSJ
  rationale: 여기서는 물리적으로 ‘세우다’가 아니라 이미 주어진 면제 조치를 행정적으로 유효화하는 뜻이므로, 법적·공적 뉘앙스를 가진 ‘확정하다’가 적절합니다.
- source_word: πάντα τὰ ἀφαιρέματα
  english_pob_choice: all the remissions
  chosen_korean: 모든 면제
  alternatives_korean:
  - 모든 감면
  - 모든 면세
  - 모든 탕감
  lexicon: LSJ
  rationale: ἀφαιρέματα는 왕이 부과 의무나 부담을 덜어 주는 재정적 조치를 가리키므로, 과도하게 좁히지 않으면서도 실질을 드러내는 ‘면제’를 택했습니다.
- source_word: ἃ ἀφῆκάν σοι ... καὶ ὅσα ἄλλα ἀφαιρέματα ἀφῆκέν σοι
  english_pob_choice: that ... granted you / whatever other remissions they granted you
  chosen_korean: 너에게 허락한 ... 그 밖의 모든 면제
  alternatives_korean:
  - 너에게 면제해 준 ... 다른 모든 면제
  - 너에게 부여한 ... 그 밖의 모든 감면
  lexicon: LSJ
  rationale: ἀφίημι는 이 행정 문맥에서 ‘면제해 주다/허락하다’의 뜻으로 쓰이며, 앞의 명사와 함께 자연스럽게 연결되도록 ‘허락한’으로 옮겼습니다. 마지막 절의 단수 동사 형태는 그리스어 전승을 반영한 어색함이 있으나, 한국어에서는 복수 선행사와 맞추어 자연스럽게 처리했습니다.
theological_decisions:
- issue: 본문의 ‘면제(remissions)’가 무엇을 가리키는지
  chosen_reading: 왕이 부과하던 조세·부담에 대한 재정적 감면 또는 면제 조치를 가리키는 행정 용어로 이해했습니다.
  alternative_readings:
  - 완전한 모든 의무 면제
  - 일반적인 은혜로운 특혜
  rationale: 영어 POB의 주석처럼 이 용어는 모든 의무의 전면 면제를 뜻한다기보다, 조세나 부담의 감면을 가리킬 가능성이 높으므로 그 긴장을 유지했습니다.
  doctrine_reference: 헬라어 행정 문맥 해석
- issue: 마지막 동사 형태의 수량 불일치
  chosen_reading: 그리스어 전승에 남은 단수 동사 형태를 본문 어색함으로 숨기지 않고, 한국어에서는 의미상 자연스럽게 복수 선행사에 맞추어 풀었습니다.
  alternative_readings:
  - 원문 어색함을 그대로 드러내는 직역
  - 모두가 아니라 ‘그가’로 기계적으로 옮김
  rationale: 영어 POB도 이 전승상의 긴장을 주석으로 드러내고 있으므로, 본문은 읽기 자연성을 유지하되 주석 없이 원문 불일치를 무시하지 않는 방식이 적절합니다.
  doctrine_reference: 본문비평/전승상 관찰
