  to: 그리고 켄데바이오스가 얌네이아에 이르러, 백성을 자극하고 유대에 침입하여[a] 백성을 포로로 잡고 그들을 죽이기 시작했습니다.[b]
  rationale: 원문의 ἤρξατο(‘시작했다’)가 일련의 부정사들 전체를 이끄는 문법적 관계를 한국어 문장 끝의 ‘시작했습니다’로 보존했습니다. ‘침입하다’는 문맥에 충실하되 문자적 번역 가능성은 각주에 남겼고, 마지막 동사의 암시된 목적어는 ‘그들을’로 밝혀 각주와 본문을 일치시켰습니다.
