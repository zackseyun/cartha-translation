  lexicon: LSJ
  rationale: 그리스어는 앞의 ‘백성’을 계속 가리키므로, 반복 대명사를 보태지 않고 직접적으로 옮겼습니다.
theological_decisions:
- issue: 적대 행위의 강도 표현
  chosen_reading: ‘자극하다 / 침입하다 / 포로로 잡다 / 죽이다’의 연쇄를 그대로 유지해 폭력의 단계적 고조를 드러냈습니다.
  alternative_readings:
  - 완곡하게 ‘괴롭히다’나 ‘들어가다’로 낮춰 표현
  rationale: 본문은 단순 방문이 아니라 공개적 선동과 군사적 침입, 포로화, 살해를 연속적으로 제시하므로 이를 약화시키지 않는 것이 문맥에 충실합니다.
  doctrine_reference: 본문 서사 충실성 및 전쟁 서술의 직접성
