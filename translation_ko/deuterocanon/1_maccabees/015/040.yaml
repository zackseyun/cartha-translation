    rationale: Ἰαμνεία(얌네이아)의 -ει- 음가를 반영한 ‘얌네이아’가 원어 형태에 더 가깝습니다.
  - severity: low
    issue: 각주 b의 보충 대상이 본문에서 명시되지 않음
    rationale: 그리스어에서 φονεύειν 뒤에 목적어가 반복되지 않는 점을 드러내려면 한국어 본문에 ‘그들을’을 명시하는 편이 각주의 설명과 정확히 호응합니다.
