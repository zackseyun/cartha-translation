  verdict: revise
  source_fidelity: 그리스어의 ἤρξατο(‘시작했다’)는 뒤따르는 ‘자극하다, 유대에 들어가다/침입하다, 포로로 잡다, 죽이다’의 연쇄를 지배합니다. 초안은 ‘자극하기 시작하고’ 뒤의 행위들을 완료된 과거 사건으로 처리하여 이 통사적 범위를 충분히 반영하지 못합니다. 또한 Ἰαμνείαν의 음역은 ‘얌네이아’가 그리스어 형태에 더 가깝습니다.
  naturalness: ‘백성을 자극하기 시작하고 … 죽였습니다’는 시제와 병렬이 다소 어색합니다. ‘… 자극하고 … 죽이기 시작했습니다’로 묶으면 현대 한국어 합쇼체 문장으로 자연스럽고 원문의 시작-동사 범위도 보존됩니다.
  terminology: ‘유대’, ‘백성’, ‘포로로 잡다’, ‘죽이다’는 문맥과 어휘에 적절합니다. 적대적 군사 문맥을 고려한 ‘침입하다’도 안전한 번역이나, 문자적 대안은 각주로 유지하는 것이 좋습니다. Κενδεβαῖος는 ‘켄데바이오스’, Ἰαμνεία는 ‘얌네이아’로 음역합니다.
  issues:
