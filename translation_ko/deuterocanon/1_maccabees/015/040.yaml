  text: And Cendebeus came to Jamnia[b][a], and began to provoke the people and to invade Judea and to take the people captive and to kill them.
  footnotes:
  - marker: a
    text: Or 'to enter into Judea'; the Greek verb can be rendered more literally, but the context suggests a hostile military incursion.
    reason: lexical_alternative
  - marker: b
    text: 'The final ''them'' is supplied in English from the repeated object implied by the Greek sequence: ''to take the people captive and to kill [them].'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 켄데바이오스가 얌네아에 이르러, 백성을 자극하기 시작하고 유대에 침입하여 백성을 포로로 잡고 죽였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘침입하다’는 문맥상 적대적 군사 진입을 드러내기 위한 번역입니다. 그리스어는 문자적으로는 ‘들어가다/진입하다’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 마지막 동사는 그리스어에서 앞의 목적어를 다시 반복하지 않으므로, 한국어에서는 ‘백성’을 자연스럽게 보충했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεγενήθη
  english_pob_choice: came
  chosen_korean: 이르러
  alternatives_korean:
  - 왔습니다
  - 도착했습니다
  lexicon: LSJ
  rationale: 단순한 이동보다 특정 장소에 도착해 나타난 뜻을 살려, 서술 흐름에 맞는 ‘이르러’로 옮겼습니다.
- source_word: Κενδεβαῖος
  english_pob_choice: Cendebeus
  chosen_korean: 켄데바이오스
  alternatives_korean:
  - 센데베우스
  - 켄데베우스
  lexicon: 표준 외래어 표기법
  rationale: 고유명사는 현대 음역 원칙에 따라 그리스어 형태를 최대한 가깝게 옮겼습니다.
- source_word: ἤρξατο τοῦ ἐρεθίζειν
  english_pob_choice: began to provoke
  chosen_korean: 자극하기 시작하고
  alternatives_korean:
  - 분노하게 만들기 시작하고
  - 도발하기 시작하고
  lexicon: LSJ
  rationale: ἀρχομαι + 동명사적 표현의 ‘시작’과 ἐρεθίζω의 ‘자극/도발’ 의미를 함께 살리되, 군사적 긴장 속의 선동을 자연스럽게 표현했습니다.
- source_word: ἐμβατεύειν εἰς τὴν Ἰουδαίαν
  english_pob_choice: to invade Judea
  chosen_korean: 유대에 침입하여
  alternatives_korean:
  - 유대로 들어가
  - 유대에 진입하여
  lexicon: LSJ
  rationale: 문자적으로는 ‘들어가다’이지만, 앞뒤 문맥이 포로로 잡고 죽이는 적대적 행위이므로 ‘침입하다’로 반영했습니다.
- source_word: αἰχμαλωτίζειν τὸν λαόν
  english_pob_choice: to take the people captive
  chosen_korean: 백성을 포로로 잡고
  alternatives_korean:
  - 백성을 사로잡고
  - 백성을 포로로 삼고
  lexicon: LSJ
  rationale: 전쟁 포로로 ‘붙잡다’는 의미를 분명히 하면서 한국어 서술에 자연스럽게 맞추었습니다.
- source_word: φονεύειν
  english_pob_choice: to kill them
  chosen_korean: 죽였습니다
  alternatives_korean:
  - 살해했습니다
  - 죽이려고 했습니다
  lexicon: LSJ
  rationale: 그리스어는 앞의 ‘백성’을 계속 가리키므로, 반복 대명사를 보태지 않고 직접적으로 옮겼습니다.
theological_decisions:
- issue: 적대 행위의 강도 표현
  chosen_reading: ‘자극하다 / 침입하다 / 포로로 잡다 / 죽이다’의 연쇄를 그대로 유지해 폭력의 단계적 고조를 드러냈습니다.
  alternative_readings:
  - 완곡하게 ‘괴롭히다’나 ‘들어가다’로 낮춰 표현
  rationale: 본문은 단순 방문이 아니라 공개적 선동과 군사적 침입, 포로화, 살해를 연속적으로 제시하므로 이를 약화시키지 않는 것이 문맥에 충실합니다.
  doctrine_reference: 본문 서사 충실성 및 전쟁 서술의 직접성
