  lexicon: LSJ
  rationale: 전쟁 포로로 ‘붙잡다’는 의미를 분명히 하면서 한국어 서술에 자연스럽게 맞추었습니다.
- source_word: φονεύειν
  english_pob_choice: to kill them
  chosen_korean: 죽였습니다
