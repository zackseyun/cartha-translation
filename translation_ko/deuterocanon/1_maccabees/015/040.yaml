base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/040.yaml
  text: And Cendebeus came to Jamnia[b][a], and began to provoke the people and to invade Judea and to take the people captive and to kill them.
  footnotes:
  - marker: a
    text: Or 'to enter into Judea'; the Greek verb can be rendered more literally, but the context suggests a hostile military incursion.
    reason: lexical_alternative
  - marker: b
    text: 'The final ''them'' is supplied in English from the repeated object implied by the Greek sequence: ''to take the people captive and to kill [them].'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 켄데바이오스가 얌네이아에 이르러, 백성을 자극하고 유대에 침입하여[a] 백성을 포로로 잡고 그들을 죽이기 시작했습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘침입하다’는 문맥상 적대적인 군사 진입을 드러내는 번역입니다. 그리스어는 문자적으로 ‘들어가다’ 또는 ‘진입하다’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어에서 마지막 동사 뒤에는 목적어가 다시 반복되지 않습니다. 한국어에서는 앞선 ‘백성’을 가리키는 ‘그들을’로 자연스럽게 보충했습니다.
    reason: lexical_alternative
