base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/017.yaml
  text: The envoys of the Jews came to us as our friends and allies[a], renewing the friendship and alliance from the beginning, having been sent by Simon the high priest and by the people of the Jews[b];
  footnotes:
  - marker: a
    text: Or 'ambassadors' for 'envoys'; the Greek term denotes official diplomatic representatives.
    reason: lexical_alternative
  - marker: b
    text: '''The people of the Jews'' could also be rendered ''the nation of the Jews'' or ''the assembly of the Jews,'' since the Greek word can denote the people as a civic body.'
    reason: lexical_alternative
translation:
  language: ko
  text: 유대 사람의 사절들이 우리에게 우리의 친구와 동맹자로 왔습니다[a]. 그들은 처음부터 맺은 우정과 동맹을 새롭게 하려고, 대제사장 시몬과 유대 사람의 백성이 보낸 사람들이었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사절들’은 공식 외교 대표를 뜻하며, πρεσβευταί의 자연스러운 현대어 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘유대 사람의 백성’은 ‘유대 사람의 민족’ 또는 ‘유대 사람들의 회중’으로도 옮길 수 있으나, 여기서는 공적 집단을 가장 무리 없이 드러내는 표현을 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρεσβευταὶ
  english_pob_choice: envoys
  chosen_korean: 사절들
  alternatives_korean:
  - 외교 사절들
  - 대사들
  - 사신들
  lexicon: LSJ
  rationale: πρεσβευτής는 공식 대표를 가리키므로, 현대 한국어에서는 외교적 기능을 살리되 자연스러운 ‘사절들’이 가장 적절합니다.
- source_word: φίλοι ἡμῶν καὶ σύμμαχοι
  english_pob_choice: our friends and allies
  chosen_korean: 우리의 친구와 동맹자
  alternatives_korean:
  - 우리의 친구들과 동맹들
  - 우호 동맹국들
  lexicon: LSJ
  rationale: 직역하면 ‘친구들’과 ‘동맹들’이지만, 한국어에서 국가 간 관계를 드러내는 표현으로 ‘동맹자’가 문맥을 더 잘 살립니다.
- source_word: ἀνανεούμενοι
  english_pob_choice: renewing
  chosen_korean: 새롭게 하려고
  alternatives_korean:
  - 갱신하면서
  - 다시 확인하며
  - 새로이 하며
  lexicon: LSJ
  rationale: 관계와 조약을 다시 새롭게 한다는 뜻을 자연스럽게 풀어, 현재 진행의 목적을 드러내는 표현으로 옮겼습니다.
- source_word: τοῦ δήμου τῶν Ἰουδαίων
  english_pob_choice: the people of the Jews
  chosen_korean: 유대 사람의 백성
  alternatives_korean:
  - 유대 사람들의 민족
  - 유대 사람들의 회중
  - 유대인의 국민
  lexicon: LSJ
  rationale: δῆμος는 단순 인구보다 시민적·공적 집단을 가리킬 수 있으나, 본문에서는 과도한 제도적 뉘앙스를 피하고 ‘백성’으로 옮기는 것이 가장 안전합니다.
theological_decisions:
- issue: 공식 외교 관계의 재확인 표현
  chosen_reading: ‘처음부터 맺은 우정과 동맹을 새롭게 하려고’로 옮겨, 단순 친분이 아니라 공적 관계의 갱신임을 드러냈습니다.
  alternative_readings:
  - ‘옛 우정을 되살리며’
  - ‘처음의 우정과 동맹을 확인하며’
  rationale: 이 절은 개인적 우정보다 국가 간 조약 관계를 말하므로, 관계의 공적·정치적 성격을 분명히 해야 합니다.
  doctrine_reference: 역사서 본문의 문맥적 의미 보존
