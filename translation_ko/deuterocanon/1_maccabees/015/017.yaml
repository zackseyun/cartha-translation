  text: οἱ πρεσβευταὶ τῶν Ἰουδαίων ἦλθαν πρὸς ἡμᾶς φίλοι ἡμῶν καὶ σύμμαχοι, ἀνανεούμενοι τὴν ἐξ ἀρχῆς φιλίαν καὶ συμμαχίαν, ἀπεσταλμένοι ἀπὸ Σιμωνος τοῦ ἀρχιερέως καὶ τοῦ δήμου τῶν Ἰουδαίων·
