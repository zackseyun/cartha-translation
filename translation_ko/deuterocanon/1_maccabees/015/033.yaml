  text: And Simon answered and said to him[a], “We have neither taken foreign land nor seized what belongs to others, but only the inheritance of our fathers[b], which at one time was unjustly taken over by our enemies.”
  footnotes:
  - marker: a
    text: Or “another’s land” for “foreign land”; the Greek emphasizes land belonging to others.
    reason: lexical_alternative
  - marker: b
    text: Or “was arbitrarily taken” or “was taken without due process”; the Greek adverb can stress lack of proper judgment as well as injustice.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 시몬이 그에게 대답했습니다. “우리는 남의 땅을 빼앗지도 않았고, 남의 것을 빼앗지도 않았습니다. 다만 우리 조상들의 유산만을 차지했을 뿐입니다. 그것은 한때 우리 원수들에게 부당하게[b] 점거당했습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 “정당한 판결 없이” 또는 “자의적으로”라고 옮길 수 있습니다. 그리스어는 불의함뿐 아니라 적절한 판단이나 심리의 결여를 나타낼 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆν ἀλλοτρίαν
  english_pob_choice: foreign land
  chosen_korean: 남의 땅
  alternatives_korean:
  - 외국 땅
  - 타인의 땅
  - 남의 영토
  lexicon: LSJ
  rationale: ἀλλότριος는 ‘다른 사람의, 남의’라는 뜻이므로, 한국어에서는 자연스럽고 직접적인 ‘남의 땅’이 원문 감각을 가장 잘 살립니다.
- source_word: εἴλημμεν
  english_pob_choice: have taken
  chosen_korean: 빼앗지도 않았습니다
  alternatives_korean:
  - 가져가지도 않았습니다
  - 취하지도 않았습니다
  - 받지도 않았습니다
  lexicon: LSJ
  rationale: 문맥상 불법적 취득을 부인하는 진술이므로, 단순한 ‘가졌다’보다 ‘빼앗다’가 더 분명히 소유 침해를 드러냅니다.
- source_word: ἀλλοτρίων
  english_pob_choice: what belongs to others
  chosen_korean: 남의 것
  alternatives_korean:
  - 다른 사람들의 것
  - 남의 소유
  - 남의 재산
  lexicon: LSJ
  rationale: 지리적 ‘땅’과 병렬되는 더 넓은 대상이므로, 한국어에서는 간결하게 ‘남의 것’으로 옮겨 소유 범위를 포괄했습니다.
- source_word: ἀκρίτως
  english_pob_choice: unjustly
  chosen_korean: 불의하게
  alternatives_korean:
  - 부당하게
  - 정당한 판결 없이
  - 자의적으로
  lexicon: LSJ
  rationale: ἀκρίτως는 ‘판단 없이/정당한 심리 없이’의 뉘앙스를 가지며, 이 문맥에서는 불의한 점거를 뜻하므로 ‘불의하게’가 핵심 의미를 전달합니다.
theological_decisions:
- issue: 조상들의 유산을 민족적·법적 주장으로만 유지하고 신학적 설명을 덧붙이지 않기
  chosen_reading: 다만 우리 조상들의 유산일 뿐입니다
  alternative_readings:
  - 다만 우리 조상들의 조상 대대로의 유산입니다
  - 다만 우리의 유산일 뿐입니다
  rationale: 원문은 상속받은 토지에 대한 정당한 권리를 말할 뿐이므로, 의미를 확장하지 않고 간결하게 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
