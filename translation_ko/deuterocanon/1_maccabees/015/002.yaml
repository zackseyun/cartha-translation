  text: 'And they contained this form: “King Antiochus to Simon the high priest and ethnarch[a], and to the nation of the Jews[b], greetings.”'
  footnotes:
  - marker: a
    text: Or more idiomatically, “they read as follows.”
    reason: lexical_alternative
  - marker: b
    text: Or “the nation of the Judeans.” The Greek Ἰουδαίων can refer either to Jews as a people or to Judeans in a more geographic sense.
    reason: alternative_reading
translation:
  language: ko
  text: '그리고 그 편지들은 다음과 같은 내용을 담고 있었습니다: 「왕 안티오코스가 대제사장과 에스나르크인 시몬에게, 그리고 유대인의 민족에게 문안합니다.」[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 관용적으로, ‘그 편지들은 다음과 같이 적혀 있었습니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘유대인의 나라’. 그리스어 Ἰουδαίων은 문맥에 따라 유대인이라는 민족 전체나 유대 지역의 주민을 가리킬 수 있습니다.
    reason: alternative_reading
