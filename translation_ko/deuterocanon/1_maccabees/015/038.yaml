lexical_decisions:
- source_word: κατέστησεν
  english_pob_choice: appointed
  chosen_korean: 임명하고
  alternatives_korean:
  - 세우고
  - 임관시키고
  - 배치하고
  lexicon: BDAG
  rationale: 행정·군사 직책에 사람을 세우는 문맥이므로 단순한 ‘세우다’보다 공식적 임명이라는 뜻을 분명히 하는 ‘임명하다’가 적절합니다.
- source_word: ἐπιστράτηγον
  english_pob_choice: commander
  chosen_korean: 사령관
  alternatives_korean:
  - 장군
  - 군정관
  - 군사령관
  lexicon: LSJ
  rationale: 지역을 맡는 군직이라는 점을 살리면서도 과도하게 제도화하지 않도록, 현대 한국어에서 자연스러운 군직 명칭인 ‘사령관’을 택했습니다.
- source_word: τῆς παραλίας
  english_pob_choice: of the coastal region
  chosen_korean: 해안 지역
  alternatives_korean:
  - 해안
  - 해변 지역
  - 연안 지역
  lexicon: LSJ
  rationale: 단순 지리적 해안이 아니라 직책이 관할하는 영역임을 드러내기 위해 ‘해안 지역’으로 옮겼습니다.
- source_word: δυνάμεις πεζικὰς καὶ ἱππικὰς
  english_pob_choice: infantry and cavalry forces
  chosen_korean: 보병과 기병 전력
  alternatives_korean:
  - 보병과 기병 부대
  - 보병과 기병 군대
  - 보병과 기병 병력
  lexicon: LSJ
  rationale: 두 형용사가 군사력의 종류를 구분하므로, 한국어에서도 병종 대비를 살리면서도 자연스러운 군사 표현인 ‘보병과 기병 전력’으로 정리했습니다.
theological_decisions:
- issue: 이 절의 정치·군사 서술을 번역할 때의 문체
  chosen_reading: 중립적 역사 서술로 처리하여 해설을 덧붙이지 않았습니다.
  alternative_readings:
  - 왕이 권한을 위임했다는 뉘앙스를 더 강하게 드러내는 해석
  - ‘해안 지역’을 지중해 연안 전체로 확장해 설명하는 해석
  rationale: 본문은 단순한 임명과 병력 제공을 보고하는 역사 서술이므로, 원문이 명시하지 않은 평가나 범위를 덧붙이지 않는 것이 가장 충실합니다.
  doctrine_reference: 역사 서술의 직역 원칙
