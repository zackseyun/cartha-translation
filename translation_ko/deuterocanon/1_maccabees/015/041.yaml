theological_decisions:
- issue: 군사적 목적 절의 표현 방식
  chosen_reading: ‘그들이 나가 유대의 길들을 순찰하게 했습니다’로, 목적과 행위를 자연스럽게 드러냈습니다.
  alternative_readings:
  - ‘나가서 유대의 길들을 지나가게 했습니다’
  - ‘유대의 길들을 따라 다니며 방해하게 했습니다’
  rationale: ἐκπορευόμενοι와 ἐξοδεύωσιν의 결합은 단순 통행이 아니라 군사적 출동과 통제의 뉘앙스를 가지므로, 과도하게 약화하지 않으면서도 한국어로 자연스럽게 옮겼습니다.
  doctrine_reference: 역사서 서술의 문맥 유지
- issue: 왕의 명령을 나타내는 종속절
  chosen_reading: ‘이는 왕이 그에게 명령한 그대로였습니다’로 왕권의 지시성을 분명히 했습니다.
  alternative_readings:
  - ‘왕이 그에게 지시한 대로였습니다’
  - ‘왕이 그에게 명령한 것처럼 했습니다’
  rationale: συνετέταξεν은 권위 있는 명령을 뜻하므로, ‘명령하다’가 가장 직접적이며 군사·정치 문맥에도 맞습니다.
  doctrine_reference: 본문 문맥 보존
