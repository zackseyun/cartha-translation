  text: 왕의 친구인 아테노비오스가 예루살렘에 와서 시몬의 화려함과 금과 은으로 된 여러 기물의 진열[a]과 많은 수행원을 보고 놀랐습니다. 그리고 그에게 왕의 말을 전했습니다.
  philosophy: optimal-equivalence
