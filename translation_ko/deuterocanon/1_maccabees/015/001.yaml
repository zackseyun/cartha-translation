base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/001.yaml
  text: And Antiochus son of King Demetrius sent letters from the islands of the sea to Simon[a], priest and ethnarch of the Jews[b], and to all the nation.
  footnotes:
  - marker: a
    text: Or 'of Judeans' for 'of the Jews'; the Greek term can denote the Jewish people in either an ethnic-religious or regional-political sense depending on context.
    reason: lexical_alternative
  - marker: b
    text: '''Ethnarch'' is a formal title meaning a ruler or leader of a people-group or nation.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 안티오쿠스는 왕 데메트리오스의 아들로서, 바다의 섬들에서 시몬에게 — 유대인의 제사장이며 민족의 통치자인 — 그리고 온 민족에게 편지들을 보냈습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘유대인’은 여기서 민족·종교적 집단을 가리키는 말일 수 있습니다. 문맥에 따라 ‘유다 사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘민족의 통치자’는 ἐθνάρχης의 직함을 풀어 옮긴 것입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπέστειλεν
  english_pob_choice: sent
  chosen_korean: 보냈습니다
  alternatives_korean:
  - 발송했습니다
  - 전달했습니다
  lexicon: BDAG
  rationale: 편지들을 목적어로 삼는 aorist ἀποστέλλω의 기본 의미를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: ἐπιστολάς
  english_pob_choice: letters
  chosen_korean: 편지들
  alternatives_korean:
  - 서신들
  - 글들
  lexicon: BDAG
  rationale: 복수형이므로 단수화하지 않고, 교회문어체인 ‘서신’보다 중립적이고 읽기 쉬운 ‘편지들’을 택했습니다.
- source_word: ἱερεῖ καὶ ἐθνάρχῃ
  english_pob_choice: priest and ethnarch
  chosen_korean: 제사장이며 민족의 통치자인
  alternatives_korean:
  - 제사장이며 민족의 수장인
  - 제사장이며 에트나르흐인
  lexicon: BDAG
  rationale: ἱερεύς는 한국어 성서에서 통용되는 ‘제사장’으로 옮기고, ἐθνάρχης는 직함을 살리면서도 의미를 풀어 ‘민족의 통치자’로 옮겨 역사적 호칭을 드러냈습니다.
- source_word: τῶν Ἰουδαίων
  english_pob_choice: of the Jews
  chosen_korean: 유대인의
  alternatives_korean:
  - 유다 사람들의
  - 유대인들의
  lexicon: BDAG
  rationale: 1 Maccabees에서는 민족·정치적 집단을 가리킬 수 있으므로, 한국어에서는 가장 सीधे하고 통용되는 ‘유대인’ 계열을 택했습니다.
- source_word: παντὶ τῷ ἔθνει
  english_pob_choice: all the nation
  chosen_korean: 온 민족에게
  alternatives_korean:
  - 온 나라에게
  - 온 백성에게
  lexicon: BDAG
  rationale: ἔθνος의 집단적·정치적 의미를 살리되, 한국어에서 ‘온 민족’이 가장 직접적으로 대응합니다.
theological_decisions:
- issue: ἐθνάρχης의 직함 보존 여부
  chosen_reading: 직함을 음역하지 않고 의미를 풀어 ‘민족의 통치자’로 번역했습니다.
  alternative_readings:
  - 에트나르흐
  - 민족의 지도자
  - 총독
  rationale: 이 구절은 신학 논점보다 역사적 관직 표지가 핵심이므로, 의미를 드러내되 현대 독자가 즉시 이해할 수 있도록 했습니다. ‘총독’은 로마식 행정관 이미지를 과도하게 불러올 수 있어 배제했습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
