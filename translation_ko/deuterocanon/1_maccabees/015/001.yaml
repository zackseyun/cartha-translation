revisions:
- from: 그리고 안티오쿠스는 왕 데메트리오스의 아들로서, 바다의 섬들에서 시몬에게 — 유대인의 제사장이며 민족의 통치자인 — 그리고 온 민족에게 편지들을 보냈습니다.[a][b]
  to: 안티오쿠스 왕 데메트리오스의 아들은 바다의 섬들에서 유대인의 제사장이며 유대 민족의 통치자인[b] 시몬과 온 민족에게 편지들을 보냈습니다.[a]
  rationale: ‘왕 데메트리오스의 아들’이라는 원문의 관계를 자연스럽게 유지하고, 시몬과 온 민족이라는 두 수신자를 병렬로 재구성했습니다. 또한 직함 수식의 범위를 명료하게 하고 각주 표지를 해당 표현에 직접 붙였습니다. ‘바다의 섬들’은 특정 지명을 단정하지 않고 원문의 지리적 표현을 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:46:24Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미와 복수형 ‘편지들’은 잘 반영되었습니다. 그러나 원문의 수신자 병렬 구조는 시몬과 ‘온 민족’이며, 시몬의 직함은 유대인들과 관련됩니다. 수정안은 이를 더 분명히 드러냅니다.
  naturalness: 초안의 “시몬에게 — … — 그리고 온 민족에게”는 대시로 삽입된 긴 수식과 접속사 때문에 현대 한국어 문장 흐름이 부자연스럽습니다. 수신자들을 ‘시몬과 온 민족에게’로 병렬 처리하는 편이 자연스럽습니다.
  terminology: ‘제사장’은 적절합니다. ἐθνάρχης는 특정 역사적 정치 직함이므로 ‘민족의 통치자’라는 풀이 번역은 가능한 선택입니다. 다만 ‘유대인의’가 제사장과 통치자 모두의 범위를 충분히 나타내도록 반복해 명시했습니다.
  issues:
  - severity: medium
    issue: 수신자 병렬 구조와 삽입 수식의 문장 연결
    rationale: 원문은 시몬(제사장이자 유대인의 에트나르크)과 온 민족에게 편지들을 보냈다는 구조입니다. 초안의 대시 삽입 뒤 ‘그리고 온 민족에게’는 문법적으로 매끄럽지 않고 수신자 병렬 관계를 흐립니다.
  - severity: low
    issue: 각주 표지의 부착 위치
    rationale: 각주 a와 b가 문장 끝에 함께 붙어 있어 각각 ‘유대인’과 ‘민족의 통치자’라는 해당 표현에 직접 연결되지 않습니다. 해당 낱말 뒤에 배치하는 것이 독자에게 명확합니다.
  - severity: low
    issue: ‘유대인의’의 수식 범위
    rationale: 그리스어의 τῶν Ἰουδαίων은 ‘에트나르크’에 직접 연결되며, 시몬의 유대인 공동체 내 제사장·지도자 역할을 나타냅니다. 한국어에서는 ‘유대 민족의 통치자’라고 명시하면 범위가 더 분명합니다.
