  lexicon: LSJ
  rationale: 중간태의 지속적·강한 견지를 살려 단순 보유보다 능동적이고 결연한 유지의 뉘앙스를 반영했습니다.
- source_word: τῆς κληρονομίας ἡμῶν καὶ τῶν πατέρων ἡμῶν
