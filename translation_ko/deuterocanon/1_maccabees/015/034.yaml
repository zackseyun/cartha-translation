theological_decisions:
- issue: ‘inheritance’의 공동 소유 구조
  chosen_reading: ‘우리와 우리 조상들의 유산’으로 단일한 유산이 세대적으로 이어져 온 소유임을 드러냈습니다.
  alternative_readings:
  - ‘우리의 유산과 우리 조상들의 유산’
  - ‘우리의 상속 재산과 우리 조상들의 상속 재산’
  rationale: 그리스어는 하나의 명사 κληρονομίας에 두 소유격이 붙는 구조이므로, 두 개의 별도 유산이 아니라 같은 유산의 계승성을 살리는 번역이 더 정확합니다.
  doctrine_reference: 본문 역사/소유 개념에 대한 주석적 판단
