  text: 그러나 우리에게 기회가 있으므로[a], 우리는 우리와 우리 조상들의 유산을[b] 굳게 지키고 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: καιρὸν ἔχοντες는 단순한 ‘시간이 있다’가 아니라 ‘적절한 기회가 있다’는 뜻입니다. 문맥에 따라 ‘기회가 있는 동안’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: κληρονομία는 이 문맥에서 단순한 ‘상속’보다 조상 대대로 이어진 ‘유산’, ‘세습 재산’, 또는 ‘기업’의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
