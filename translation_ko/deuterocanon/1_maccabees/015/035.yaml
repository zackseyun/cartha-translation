  text: But concerning Joppa and Gazara, you ask for them. These were inflicting great harm on the people and on our land. For these we will give one hundred talents. And he answered him not a word.
translation:
  language: ko
  text: 그러나 야포와 가자라에 관해서는, 당신은 그 두 도시를 요구합니다. 이 두 도시는 백성과 우리 땅에 큰 해를 끼치고 있었습니다. 그 대가로 우리는 백 달란트를 주겠습니다. 그러나 그는 그에게 한마디도 대답하지 않았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰόππης καὶ Γαζαρηνῶν
  english_pob_choice: Joppa and Gazara
  chosen_korean: 야포와 가자라
  alternatives_korean:
  - 욥바와 가자라
  - 야포와 가사라
  lexicon: 고유명사
  rationale: Ἰόππη는 한국 성경에서 욥바/야포가 모두 가능하지만, 현대 표기와 발음에 맞춰 야포를 택했고, Γαζαρά는 가자라로 옮겨 원지명 대응을 분명히 했습니다.
- source_word: αἰτεῖς
  english_pob_choice: you ask for them
  chosen_korean: 당신이 그것들을 요구하고 있습니다
  alternatives_korean:
  - 당신이 그것들을 청하고 있습니다
  - 당신은 그것들을 구하고 있습니다
  lexicon: αἰτέω
  rationale: 문맥상 단순한 요청보다 상대가 영토/대상을 요구하는 뉘앙스가 강하므로 ‘요구하다’로 옮겨 긴장감을 살렸습니다.
- source_word: ἐποίουν ἐν τῷ λαῷ πληγὴν μεγάλην καὶ τῇ γῇ ἡμῶν
  english_pob_choice: These were inflicting great harm on the people and on our land
  chosen_korean: 이들은 백성과 우리 땅에 큰 해를 끼쳤습니다
  alternatives_korean:
  - 이들은 백성과 우리 땅에 큰 타격을 주었습니다
  - 이들은 백성과 우리 땅에 큰 상처를 입혔습니다
  lexicon: πληγή μεγάλη
  rationale: πληγή는 문자적으로 ‘타격/상처’이지만 여기서는 사람과 땅에 가해진 중대한 피해를 자연스럽게 드러내기 위해 ‘큰 해를 끼치다’로 옮겼습니다.
- source_word: τούτων δώσομεν τάλαντα ἑκατόν
  english_pob_choice: For these we will give one hundred talents
  chosen_korean: 이 때문에 우리는 은 백 달란트를 드리겠습니다
  alternatives_korean:
  - 이들을 위해 우리는 백 달란트를 주겠습니다
  - 이것들 때문에 우리는 백 달란트를 바치겠습니다
  lexicon: τάλαντον
  rationale: τάλαντα는 금액 단위이므로 ‘은’은 한국어 관용상 화폐 가치를 분명히 하는 보충어로 넣되, 본문 의미를 바꾸지 않도록 ‘백 달란트’를 유지했습니다.
theological_decisions:
- issue: 공손한 2인칭 발화의 한국어 처리
  chosen_reading: 직접 발화인 ‘당신이… 요구하고 있습니다’로 옮겨 협상 상황의 긴장과 대면성을 보존했습니다.
  alternative_readings:
  - 더 완곡한 ‘청하십니다’
  - 무인칭적 ‘그것들을 원하십니다’
  rationale: 본문은 외교적 협상에서의 직접 대응이므로, 완곡하게 누그러뜨리기보다 요구의 성격을 드러내는 번역이 더 충실합니다.
  doctrine_reference: 서사/대화의 화행 보존
- issue: 마지막 무응답의 강조
  chosen_reading: ‘한마디도 대답하지 않았습니다’로 옮겨 완전한 침묵을 강조했습니다.
  alternative_readings:
  - ‘아무 대답도 하지 않았습니다’
  - ‘말로 응답하지 않았습니다’
  rationale: οὐκ ἀπεκρίθη αὐτῷ λόγον은 단순 무응답이 아니라 말 한마디도 없었다는 강한 부정을 담으므로 이를 분명히 했습니다.
  doctrine_reference: 서사적 강조
