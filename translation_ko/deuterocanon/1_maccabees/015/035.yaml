  to: 그러나 야포와 가자라에 관해서는, 당신은 그 두 도시를 요구합니다. 이 두 도시는 백성과 우리 땅에 큰 해를 끼치고 있었습니다. 그 대가로 우리는 백 달란트를 주겠습니다. 그러나 그는 그에게 한마디도 대답하지 않았습니다.
