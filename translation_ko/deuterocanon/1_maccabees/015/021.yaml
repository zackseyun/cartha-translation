  verdict: revise
  source_fidelity: 개정이 필요합니다. λοιμοί는 사람들을 향한 강한 모욕적 표현으로, ‘흉악한 자들’은 폭력성·중범죄성을 지나치게 특정합니다. 또한 ὅπως ἐκδικήσει는 단순한 미래 결과라기보다 인도 목적을 나타내므로 ‘처벌하도록’으로 옮기는 편이 가깝습니다. αὐτῶν의 복수와 χώρα의 정치·지리적 의미는 유지해야 합니다.
  naturalness: ‘우리에게로 도망쳐 온’과 ‘넘기십시오’는 자연스럽고 합쇼체 문체에도 적절합니다. 다만 ‘그러면 그는 … 처벌할 것입니다’보다 ‘… 처벌하도록’이 원문의 목적절을 더 자연스럽게 재현합니다.
  terminology: ἀρχιερεῖ는 ‘대제사장’이 적절합니다. νόμον은 문맥상 특정 종교 용어로 한정하지 않고 ‘법’으로 번역하는 것이 안전합니다. λοιμοί는 ‘해악을 끼치는 자들’로 처리하고, 각주에서 원문의 거친 비난어와 전염병 은유를 설명합니다.
  issues:
  - severity: medium
    issue: ‘흉악한 자들’이 λοιμοί의 의미를 과도하게 특정함
    rationale: λοιμοί는 문자적으로 전염병을 뜻하며 사람에게 쓰일 때 해롭고 성가신 자들을 향한 모욕어입니다. ‘흉악한’은 폭력적 악인 또는 중범죄자라는 뜻을 더하여 원문의 비난은 보존하되 의미 범위를 좁힙니다.
