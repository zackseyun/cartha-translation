  text: εἴ τινες οὖν λοιμοὶ διαπεφεύγασιν ἐκ τῆς χώρας αὐτῶν πρὸς ἡμᾶς, παράδοτε αὐτοὺς τῷ Σίμωνι τῷ ἀρχιερεῖ, ὅπως ἐκδικήσει αὐτοὺς κατὰ τὸν νόμον αὐτῶν.
