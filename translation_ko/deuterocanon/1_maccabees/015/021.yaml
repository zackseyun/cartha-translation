  to: 그러므로 만일 그들의 땅에서 우리에게로 도망쳐 온 해악을 끼치는 자들[a]이 있다면, 그들을 대제사장 시몬에게 넘기십시오. 그가 그들의 법에 따라 그들을 처벌하도록[b] 하십시오.
  rationale: 원문의 강한 모욕적 어조는 유지하되, λοιμοί에 없는 폭력 범죄의 함의를 피했습니다. 명령 뒤의 ὅπως 목적절을 ‘…하도록 하십시오’로 반영했고, νόμον을 ‘율법’으로 신학적으로 특정하지 않아 원문의 모호성을 보존했습니다. 각주 표지는 각각 해당 어휘와 목적 표현에 직접 붙였습니다.
