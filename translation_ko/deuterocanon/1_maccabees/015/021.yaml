    rationale: ὅπως ἐκδικήσει는 인도하라는 명령의 목적, 곧 시몬이 법에 따라 조처하게 하려는 취지를 나타냅니다. ‘처벌하도록’이 이 관계를 더 충실히 반영합니다.
