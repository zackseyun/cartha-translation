base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/021.yaml
  text: If[a], then, any pestilent men have escaped from their land to us, hand them over to Simon the high priest[b], so that he may punish them according to their law.
  footnotes:
  - marker: a
    text: Or 'pernicious men,' 'troublemakers,' or more literally 'pestilent men.' The Greek λοιμοί is a harsh term for dangerous or troublesome persons.
    reason: lexical_alternative
  - marker: b
    text: Or 'may exact justice on them' or 'may avenge them.' The Greek can carry either punitive or avenging force, but the legal phrase 'according to their law' favors a judicial sense here.
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 만일 그들의 땅에서 우리에게로 도망쳐 온 해악을 끼치는 자들[a]이 있다면, 그들을 대제사장 시몬에게 넘기십시오. 그가 그들의 법에 따라 그들을 처벌하도록[b] 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 λοιμοί는 문자적으로 ‘전염병들’을 뜻합니다. 여기서는 사람들을 가리키며, ‘해로운 자들’, ‘악질적인 자들’ 또는 ‘재앙 같은 자들’이라는 강한 비난의 뜻으로 쓰였습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 ἐκδικήσει는 ‘처벌하다’ 외에 ‘정의를 집행하다’, ‘응보하다’ 또는 ‘복수하다’로도 옮길 수 있습니다. 뒤따르는 ‘그들의 법에 따라’라는 표현 때문에 여기서는 법적 처벌의 뜻으로 번역했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: λοιμοὶ
  english_pob_choice: pestilent men
  chosen_korean: 흉악한 자들
  alternatives_korean:
  - 해로운 자들
  - 악질적인 자들
  - 재앙 같은 자들
  lexicon: LSJ
  rationale: λοιμοί는 문자적으로는 ‘전염병의’ 뜻이지만 사람을 가리킬 때는 매우 거칠고 비난적인 표현이므로, 한국어에서는 단순한 ‘범죄자들’보다 강한 비난을 살리는 ‘흉악한 자들’로 옮겼습니다.
- source_word: παράδοτε
  english_pob_choice: hand ... over
  chosen_korean: 넘기십시오
  alternatives_korean:
  - 인도하십시오
  - 건네십시오
  - 인계하십시오
  lexicon: LSJ
  rationale: 이 문맥은 도피자를 시몬의 관할로 이송하는 명령이므로, 공문서적이면서도 현대적인 동사를 써서 명령의 힘을 살렸습니다.
- source_word: ἀρχιερεῖ
  english_pob_choice: high priest
  chosen_korean: 대제사장
  alternatives_korean:
  - 수제사장
  - 제사장장
  lexicon: LSJ
  rationale: ἀρχιερεύς의 표준 대응어는 ‘대제사장’이며, 한국어 성서 관용과도 잘 맞습니다.
- source_word: ἐκδικήσει
  english_pob_choice: may punish
  chosen_korean: 처벌할 것입니다
  alternatives_korean:
  - 응징할 것입니다
  - 보복할 것입니다
  - 정의를 집행할 것입니다
  lexicon: LSJ
  rationale: 이 단어는 보복과 사법적 징벌의 뜻을 함께 지니지만, 뒤의 ‘그들의 율법에 따라’가 법정적 의미를 강하게 만들므로 개인적 복수보다 사법적 처벌을 드러냈습니다.
- source_word: κατὰ τὸν νόμον αὐτῶν
  english_pob_choice: according to their law
  chosen_korean: 그들의 율법에 따라
  alternatives_korean:
  - 그들의 법에 따라
  - 자기들의 율법에 따라
  - 그 법에 따라
  lexicon: LSJ
  rationale: νόμος는 여기서 일반 법보다 종교·공동체 규범인 ‘율법’이 더 자연스럽고, 복수 대명사 αὐτῶν도 ‘그들의’로 그대로 살렸습니다.
theological_decisions:
- issue: 'ἐκδικήσει의 성격: 복수/처벌인가, 개인적 보복인가'
  chosen_reading: 법적·공동체적 처벌로 읽어 ‘처벌할 것입니다’로 번역했습니다.
  alternative_readings:
  - 그들을 갚아줄 것입니다
  - 그들에게 복수할 것입니다
  rationale: 문장 전체가 인도 명령과 ‘그들의 율법에 따라’라는 법적 틀 안에 있으므로, 개인 감정의 보복으로 읽지 않도록 했습니다.
  doctrine_reference: 본문의 법정적 긴장을 유지하면서 의미를 과도하게 약화하지 않는 원칙
- issue: ‘우리에게로’의 방향성과 주체 구분
  chosen_reading: 원문의 πρὸς ἡμᾶς를 반영해 ‘우리에게로’로 옮겼습니다.
  alternative_readings:
  - 우리에게
  - 우리 쪽으로
  rationale: 도피자의 이동 방향을 분명히 하고, 외교적·정치적 맥락에서 말하는 주체 집단을 드러내기 위해서입니다.
  doctrine_reference: 문맥의 정치적 실재를 보존하는 원칙
