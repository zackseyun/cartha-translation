  yaml_path: translation/deuterocanon/1_maccabees/015/004.yaml
  text: But I want to go out into the country[a], so that I may pursue those who have devastated our country and laid waste many cities in the kingdom[b];
  footnotes:
  - marker: a
    text: Or 'throughout the land'; the Greek phrase κατὰ τὴν χώραν can denote movement through the territory more generally.
    reason: lexical_alternative
  - marker: b
    text: Or 'proceed against' or 'punish'; the verb μετέλθω can carry the sense of pursuing offenders with hostile intent.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 저는 그 지역을 두루 다니며[a], 우리 지역을 황폐하게 하고 왕국 안의 많은 도시를 황무지로 만든 자들을 추적하고자 합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅을 두루’; 그리스어 κατὰ τὴν χώραν은 더 일반적으로 영토 전체를 가로지르는 이동을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘대항하여 나아가다’, ‘처벌하다’; μετέλθω는 가해자들을 적대적으로 추적하는 뜻을 지닐 수 있습니다.
    reason: lexical_alternative
