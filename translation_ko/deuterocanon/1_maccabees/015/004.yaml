  lexicon: LSJ
  rationale: ἐρημόω의 ‘황폐화하다, 버려지게 하다’라는 뜻을 살리기 위해, 도시의 참혹한 상태를 직설적으로 드러냈습니다.
theological_decisions:
- issue: 왕의 군사적 의도와 보복적 어조
  chosen_reading: 본문의 의도는 단순한 이동이 아니라, 파괴자들을 뒤쫓아 응징하려는 왕의 결단으로 읽었습니다.
  alternative_readings:
  - 중립적 ‘찾아가다’로 완화
  - 법적 의미의 ‘처벌하다’로 명시
  rationale: μετέλθω는 ‘뒤쫓다/대항하여 나아가다’의 공격적 뉘앙스를 가질 수 있으므로, 본문의 보복성을 희석하지 않으면서도 과도한 법률화는 피했습니다.
  doctrine_reference: 문맥상 왕권과 전쟁 서술
- issue: κατὰ τὴν χώραν의 방향성
  chosen_reading: ‘그 지역을 두루 다니며’로 번역해, 단순한 출발보다 영토를 순회하는 방향성을 반영했습니다.
  alternative_readings:
  - ‘그 지역으로 나가며’
  - ‘그 땅을 통하여’
  rationale: 이 표현은 일반적인 ‘밖으로 나가다’보다 영역 전체를 가로지르는 움직임을 암시하므로, 독자가 행동 범위를 이해하도록 했습니다.
  doctrine_reference: 지리·서술 문맥
