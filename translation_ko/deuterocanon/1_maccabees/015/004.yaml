  rationale: 완료 분사가 누적된 파괴의 결과를 가리키므로, 도시와 땅에 대한 강한 훼손을 드러내는 ‘황폐하게 하다’로 옮겼습니다.
- source_word: ἠρημωκότας πόλεις πολλὰς
