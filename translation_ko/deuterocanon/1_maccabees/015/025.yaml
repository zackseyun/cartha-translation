  yaml_path: translation/deuterocanon/1_maccabees/015/025.yaml
  text: But King Antiochus encamped against Dora a second time[a], continually bringing his forces against it and constructing siege engines[b], and he shut Tryphon in so that he could neither go in nor go out.
  footnotes:
  - marker: a
    text: Or, more literally, 'continually bringing hands against it,' an idiom for sustained assault or pressure during a siege.
    reason: lexical_alternative
  - marker: b
    text: The phrase rendered 'a second time' could be understood differently if taken more mechanically, but in this military context it most naturally indicates repeated action.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 안티오코스 왕은 두 번째로 도라를 향해 진을 쳤습니다.[b] 그는 계속해서 그곳에 공격을 가하고[a] 공성기를 만들며, 트뤼폰이 들어가거나 나올 수 없게 가두었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그곳에 손들을 계속 가져감’이지만, 포위전에서 지속적으로 공격하거나 압박한다는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘두 번째로’로 옮긴 표현은 문법적으로 달리 이해될 여지가 있으나, 이 군사 문맥에서는 반복된 행동을 가리키는 것으로 이해하는 것이 가장 자연스럽습니다.
    reason: alternative_reading
