base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/025.yaml
  text: But King Antiochus encamped against Dora a second time[a], continually bringing his forces against it and constructing siege engines[b], and he shut Tryphon in so that he could neither go in nor go out.
  footnotes:
  - marker: a
    text: Or, more literally, 'continually bringing hands against it,' an idiom for sustained assault or pressure during a siege.
    reason: lexical_alternative
  - marker: b
    text: The phrase rendered 'a second time' could be understood differently if taken more mechanically, but in this military context it most naturally indicates repeated action.
    reason: alternative_reading
translation:
  language: ko
  text: 그런데 안티오코스 왕은 두 번째로 도라 앞에 진을 쳐서, 끊임없이 그곳을 공격하며 공성기를 만들고, 트뤼폰을 가두어 들어갈 수도 없고 나올 수도 없게 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그에게 손들을 계속 가져감’이지만, 이는 포위전에서 지속적인 압박을 뜻하는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: μήχανα는 여기서 일반적인 ‘기계’가 아니라 공성전용 장비를 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: παρενέβαλεν ἐπὶ Δωρὰ
  english_pob_choice: encamped against Dora
  chosen_korean: 도라 앞에 진을 쳐서
  alternatives_korean:
  - 도라에 진을 치고
  - 도라를 향해 진을 쳐서
  lexicon: LSJ
  rationale: παρεμβάλλω는 군사적 맥락에서 ‘진을 치다’로 옮기는 것이 자연스럽고, ἐπί는 적대적 방향을 보여 주므로 ‘앞에’가 포위전의 뉘앙스를 살립니다.
- source_word: ἐν τῇ δευτέρᾳ
  english_pob_choice: a second time
  chosen_korean: 두 번째로
  alternatives_korean:
  - 두 번째에
  - 두 번째 시간에
  lexicon: LSJ
  rationale: 전투 서술 맥락에서는 달력상의 ‘둘째 날’보다 반복된 공격의 의미가 더 자연스럽기 때문에 ‘두 번째로’로 옮겼습니다.
- source_word: προσάγων διὰ παντὸς αὐτῇ τὰς χεῖρας
  english_pob_choice: continually bringing his forces against it
  chosen_korean: 끊임없이 그곳을 공격하며
  alternatives_korean:
  - 끊임없이 손을 대며
  - 끊임없이 병력을 들이밀며
  lexicon: LSJ
  rationale: 직역하면 ‘손들을 가져옴’이지만 이는 포위전의 관용적 표현이므로, 무력을 지속적으로 가한다는 뜻을 살려 간결하게 옮겼습니다.
- source_word: μηχανὰς ποιούμενος
  english_pob_choice: constructing siege engines
  chosen_korean: 공성기를 만들고
  alternatives_korean:
  - 기계를 만들고
  - 공성 장비를 준비하고
  lexicon: LSJ
  rationale: μηχαναί는 여기서 일반 ‘기계’가 아니라 공성전용 장비를 가리키므로 ‘공성기’가 가장 직접적입니다.
- source_word: συνέκλεισεν τὸν Τρύφωνα
  english_pob_choice: he shut Tryphon in
  chosen_korean: 트뤼폰을 가두어
  alternatives_korean:
  - 트뤼폰을 봉쇄하여
  - 트뤼폰을 포위하여
  lexicon: LSJ
  rationale: συνέκλεισεν은 안팎의 이동을 막아 ‘가두다/봉쇄하다’는 뜻이므로, 뒤의 부정 부정사 구문과 연결되도록 ‘가두어’로 옮겼습니다.
- source_word: τοῦ εἰσπορεύεσθαι καὶ ἐκπορεύεσθαι
  english_pob_choice: so that he could neither go in nor go out
  chosen_korean: 들어갈 수도 없고 나올 수도 없게
  alternatives_korean:
  - 들어가고 나올 수도 없게
  - 들어가거나 나올 수도 없게
  lexicon: LSJ
  rationale: 목적/결과를 나타내는 부정사 구문을 한국어의 가능 부정으로 풀어, 완전한 차단 상태를 자연스럽게 전달했습니다.
theological_decisions:
- issue: 군사 서술의 강도와 포위전 이미지
  chosen_reading: 본문의 반복 압박과 봉쇄를 약화시키지 않고, ‘진을 치다-공격하다-공성기-가두다’의 연쇄로 긴박한 포위전을 드러냈습니다.
  alternative_readings:
  - 완곡하게 ‘머물렀다’나 ‘주둔했다’로 완화할 수 있음
  - ‘기계’처럼 중립적으로 옮길 수 있음
  rationale: 본문은 단순 이동이 아니라 적을 고립시키는 공격적 포위전을 묘사하므로, 서술의 군사적 긴장감을 보존하는 것이 중요합니다.
  doctrine_reference: 원문 서술의 역사적-군사적 의미 보존
