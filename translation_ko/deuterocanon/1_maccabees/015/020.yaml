  yaml_path: translation/deuterocanon/1_maccabees/015/020.yaml
  text: And it seemed good to us to receive the shield from them[a].
  footnotes:
  - marker: a
    text: Or 'to accept the shield from them.' The Greek ἀσπίς can denote a shield generally; in this diplomatic context it may refer to an honorific gift, traditionally understood as a golden shield.
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 우리는 그들에게서 그 방패[a]를 받는 것이 좋다고 여겼습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들에게서 그 방패를 받아들이는 것.’ 그리스어 아스피스(ἀσπίς)는 일반적으로 방패를 뜻합니다. 이 외교적 맥락에서는 명예의 선물을 가리킬 수도 있으며, 전통적으로 금방패로 이해되기도 합니다.
    reason: ‘방패’라는 본문 번역을 유지하면서 ἀσπίς의 어휘적 대안과 외교적 선물이라는 가능한 역사적 이해를 확정하지 않고 제시합니다.
lexical_decisions:
- source_word: ἔδοξεν δὲ ἡμῖν
  english_pob_choice: it seemed good to us
  chosen_korean: 우리는 … 것이 좋다고 여겼습니다
  alternatives_korean:
  - 우리는 … 것이 마땅하다고 여겼습니다
  - 우리에게 … 하는 것이 좋았습니다
  lexicon: BDAG
  rationale: ἔδοξεν의 판단·결의 뉘앙스를 살리되, 합쇼체에서 너무 직역투가 되지 않도록 ‘좋다고 여겼습니다’로 옮겼습니다. ‘우리에게’보다 주체성을 드러내는 ‘우리는’이 공문서적 문맥에 더 자연스럽습니다.
- source_word: δέξασθαι
  english_pob_choice: to receive
  chosen_korean: 받는 것
  alternatives_korean:
  - 받아들이는 것
  - 수용하는 것
  lexicon: BDAG
  rationale: δέχομαι의 기본 의미를 살려 ‘받다’로 옮겼고, 문장 전체의 공식적 문체에 맞게 명사화했습니다. ‘받아들이다’는 의미가 조금 넓어져 외교적 선물 수령의 구체성이 약해질 수 있습니다.
- source_word: τὴν ἀσπίδα
  english_pob_choice: the shield
  chosen_korean: 그 방패
  alternatives_korean:
  - 그 방패를
  - 그 방패 한 개
  lexicon: LSJ
  rationale: 본문은 단순히 ἀσπίς를 ‘방패’로만 말하므로, 영어 POB처럼 ‘golden’ 같은 해석을 본문에 넣지 않고 그대로 옮겼습니다. 지시관형사 ‘그’를 붙여 앞선 맥락에서 언급된 방패를 자연스럽게 가리키게 했습니다.
- source_word: παρʼ αὐτῶν
  english_pob_choice: from them
  chosen_korean: 그들로부터
  alternatives_korean:
  - 그들에게서
  - 그들 편에서
  lexicon: BDAG
  rationale: παρά+속격의 출처 의미를 살려 ‘로부터’로 옮겼습니다. 외교 문맥이지만 본문 자체는 단순한 출처 표현이므로 과도하게 관용화하지 않았습니다.
