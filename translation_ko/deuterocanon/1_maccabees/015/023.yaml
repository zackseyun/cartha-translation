  text: 그리고 모든 지역과 샘사메와 스파르타 사람들에게, 그리고 델로스와 민두스와 시키온과 카리아와 사모스와 팜필리아와 리키아와 할리카르나소스와 코스와 시데와 아라두스와 로도스와 파셀리스와 고르티나와 크니도스와 키프로스와 키레네에.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘코스’와 ‘크니도스’처럼 일부 지명은 영어 관용형과 더 직접적인 음역형이 모두 가능하지만, 본문에서는 일관된 음역을 택했습니다.
    reason: lexical_alternative
