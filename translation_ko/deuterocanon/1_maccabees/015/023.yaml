  source_fidelity: 그리스어의 수신·발송 목록 구조와 지명 열거는 대체로 충실합니다. 다만 Σαμψάμῃ의 모음은 α이므로 ‘샘사메’보다 ‘삼사메’가 그리스어 형태에 더 가깝습니다. 또한 반복되는 εἰς가 이 행정적 목록에서 ‘~에게/에’라는 발송·수신 방향을 나타내므로, 한국어에서도 그 관계가 더 자연스럽게 드러나도록 다듬는 것이 좋습니다.
  naturalness: 원문의 긴 열거를 유지하면서 ‘또’를 사용해 두 번째 지명군을 자연스럽게 연결했습니다. ‘모든 지방’은 고대의 행정·지리 단위를 현대 국가로 오해하게 하지 않으면서 자연스럽습니다.
  terminology: ‘스파르타 사람들’은 Σπαρτιάταις가 도시가 아니라 사람들을 가리킨다는 점을 잘 반영합니다. 나머지 지명은 통용되는 한국어 음역을 유지했습니다. 샘사메의 불확실한 음역에 관한 주석을 해당 지명에 직접 연결했고, 코스·크니도스의 대체 표기에 관한 주석도 관련 지명에 연결했습니다.
