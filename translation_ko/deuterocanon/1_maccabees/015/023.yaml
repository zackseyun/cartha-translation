  - marker: a
    text: Some place names have alternate English spellings, such as Kos for Cos and Knidos for Cnidus.
    reason: lexical_alternative
  - marker: b
    text: The place name Sampsame is uncertain in English transliteration; the rendering follows the Greek form closely.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 모든 지방과 삼사메[b]와 스파르타 사람들에게, 또 델로스와 민도스와 시키온과 카리아와 사모스와 팜필리아와 리키아와 할리카르나소스와 코스[a]와 시데와 아라두스와 로도스와 파셀리스와 고르티나와 크니도스[a]와 키프로스와 키레네에.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 지명은 다른 음역으로도 표기됩니다. 예를 들어 ‘코스’는 ‘코스’(Kos), ‘크니도스’는 ‘크니도스’(Knidos)로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘삼사메’는 그리스어 형태를 가깝게 옮긴 지명입니다. 이 지명의 통용 음역은 확정되어 있지 않습니다.
    reason: cultural_note
