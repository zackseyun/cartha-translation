  text: 안티오코스는 도라를 향해 진을 쳤고, 그와 함께 전투병 십이만 명과 기병 팔천 명이 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘열두 미리아드’라고 하며, 미리아드는 만을 뜻하는 고대 수 단위입니다. 즉 십이만 명입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 문자적으로 ‘팔천 말’이라고 되어 있으나, 여기서는 기병 또는 말 탄 부대를 가리키는 군사적 집합 표현입니다.
    reason: lexical_alternative
