  text: And Antiochus encamped against Dora[c][b][a], and with him were twelve myriads of fighting men and eight thousand cavalry.
  footnotes:
  - marker: a
    text: Or 'one hundred twenty thousand fighting men.' The Greek says 'twelve myriads,' using the ancient unit 'myriad' for ten thousand.
    reason: lexical_alternative
  - marker: b
    text: The Greek literally has 'eight thousand horse,' a collective military expression meaning mounted troops or cavalry.
    reason: lexical_alternative
  - marker: c
    text: The place name appears here in Greek as 'Dora'; some English traditions use 'Dor.'
    reason: alternative_reading
translation:
  language: ko
  text: 안티오코스는 도라를 향해 진을 쳤고, 그와 함께한 이는 전투하는 사람 열두 마리드와 기병 팔천 명이었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘열두 마리드’는 문자적으로는 ‘열두 만(10,000) 단위’라는 뜻입니다. 따라서 전체 병력은 약 12만 명을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 문자적으로 ‘팔천 말’이라고 되어 있으나, 여기서는 기병·말 탄 부대를 가리키는 군사적 집합 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 지명은 그리스어 본문에 ‘도라’로 나타납니다. 일부 영어 전통은 ‘Dor’를 사용합니다.
    reason: alternative_reading
