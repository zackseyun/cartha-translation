  lexicon: LSJ
  rationale: 경계 구문이 압축되어 있으므로, 영어 POB가 채택한 해석을 따라 ‘경계 밖에 있는’으로 풀어 한국어에서 자연스럽고 의미가 분명하게 만들었습니다.
theological_decisions:
- issue: 경계 구문의 방향성(ἐκ + ὁρίων)
  chosen_reading: ‘유다의 경계 밖에 있는 지역들’로 이해했습니다.
  alternative_readings:
  - ‘유다의 경계에서 온 지역들’
  - ‘유다의 경계로부터’
  rationale: 문맥상 요구되는 것은 유다 고유 경계 바깥에서 취한 도시와 세금의 반환이므로, 독자가 즉시 이해할 수 있도록 영어 POB의 해석을 따라 자연스럽게 풀었습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; 문맥이 요구하는 평이한 의미를 우선하되, 압축된 그리스어 경계 표현의 해석적 성격은 유지합니다.'
