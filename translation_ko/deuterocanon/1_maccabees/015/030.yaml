  text: Now then[a], hand over the cities that you seized, and the taxes of the places over which you gained control, beyond the borders of Judea.
  footnotes:
  - marker: a
    text: Or, more literally, 'from the borders of Judea.' The Greek boundary phrase is somewhat compressed; the translation gives the likely contextual sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그렇다면 이제 여러분이 점령한 도시들과, 유다의 경계 밖에 있는 지역들에서 차지한 세금들을 넘겨주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘유다의 경계로부터’에 가깝습니다. 다만 그리스어의 경계 표현이 압축되어 있어, 문맥상 ‘경계 밖에 있는’이라는 뜻으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
