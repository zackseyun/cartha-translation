  source_fidelity: 개정안은 κατεκυριεύσατε가 수식하는 대상이 세금이 아니라 ‘지역들’임을 분명히 하며, 경계 구문이 그 지역들을 한정한다는 원문의 구조를 더 충실히 드러냅니다. ‘유대’는 Ἰουδαία(Judea)의 통상적인 한국어 지명 표기입니다. 압축된 ἐκ 구문의 해석은 본문과 각주에서 계속 유보합니다.
  naturalness: ‘지역들에서 차지한 세금들’은 세금을 차지했다는 뜻으로 쉽게 읽힐 수 있습니다. ‘여러분이 지배하게 된 지역들의 세금’은 자연스럽고 수식 관계가 명료합니다. ‘그러므로 이제’는 νῦν οὖν의 추론적 전환과 즉시성을 합쇼체 문맥에서 무리 없이 전달합니다.
  terminology: κατελάβετε는 ‘점령한’, παράδοτε는 ‘넘겨주십시오’, φόρους는 ‘세금’, κατακυριεύσατε는 ‘지배하게 된’으로 옮겨 정치적·행정적 의미를 유지했습니다. Ἰουδαία는 ‘유대’로 표기했습니다.
