translation:
  language: ko
  text: 그러므로 이제 여러분이 점령한 도시들과 유대의 경계 밖에 있는, 여러분이 지배하게 된 지역들의 세금을 넘겨주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘유대의 경계로부터’에 가깝습니다. 다만 그리스어의 경계 표현이 압축되어 있어, 문맥상 ‘경계 밖에 있는’이라는 뜻으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
