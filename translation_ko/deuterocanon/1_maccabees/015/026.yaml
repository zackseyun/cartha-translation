  text: And Simon sent him two thousand chosen men to fight alongside him[b][a], and silver and gold and sufficient equipment.
  footnotes:
  - marker: a
    text: Or 'to be his ally' / 'to assist him.' The Greek verb can denote allied support more broadly; the context here favors military assistance.
    reason: lexical_alternative
  - marker: b
    text: Or 'sufficient supplies.' The Greek says 'sufficient/e enough σκεύη,' a broad term that can refer to equipment, gear, or supplies depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 시몬은 그에게 함께 싸우도록 선택된 사람 이천 명과 은과 금과 충분한 장비를 보냈습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλεν
  english_pob_choice: sent
  chosen_korean: 보냈습니다
  alternatives_korean:
  - 파견했습니다
  - 전달했습니다
  lexicon: LSJ
  rationale: 서사 동사의 기본 의미를 자연스럽게 살리면서, 공식적 문체에서도 무리가 없는 표준적 표현입니다.
- source_word: διαχιλίους ἄνδρας ἐκλεκτούς
  english_pob_choice: two thousand chosen men
  chosen_korean: 선택된 사람 이천 명
  alternatives_korean:
  - 뽑힌 사람 이천 명
  - 선발된 군사 이천 명
  lexicon: LSJ
  rationale: ἄνδρας는 기본적으로 ‘사람들/남자들’이므로 ‘군사’로 미리 좁히지 않고, ἐκλεκτούς의 선택된 성격을 살렸습니다.
- source_word: συμμαχῆσαι αὐτῷ
  english_pob_choice: to fight alongside him
  chosen_korean: 함께 싸우도록
  alternatives_korean:
  - 그의 동맹이 되도록
  - 그를 돕도록
  lexicon: LSJ
  rationale: 동맹의 형식적 의미보다 전쟁 지원의 실제 기능이 문맥상 더 분명하므로, ‘함께 싸우다’로 구체화했습니다.
- source_word: σκεύη ἱκανά
  english_pob_choice: sufficient equipment
  chosen_korean: 충분한 장비
  alternatives_korean:
  - 충분한 물품
  - 필요한 장비
  - 넉넉한 보급품
  lexicon: LSJ
  rationale: σκεύη는 넓은 뜻을 가지지만 군사 지원 문맥에서는 ‘장비’가 가장 자연스럽고, ἱκανά는 ‘충분한’으로 옮기는 것이 적절합니다.
theological_decisions:
- issue: συμμαχῆσαι αὐτῷ의 관계를 단순 동맹인지 군사 지원인지 어떻게 드러낼지
  chosen_reading: 군사적 협력과 지원을 나타내는 표현으로 번역했습니다.
  alternative_readings:
  - 정치적 동맹으로 번역할 수 있음
  - 일반적 도움으로 번역할 수 있음
  rationale: 문맥에 은과 금, 장비가 함께 언급되어 실제 전투 지원의 성격이 강하므로, 의미를 흐리지 않도록 했습니다.
  doctrine_reference: 문맥 우선의 역사 서술 해석
- issue: διαχιλίους ἄνδρας를 ‘군사’로 한정할지 여부
  chosen_reading: ‘사람 이천 명’으로 유지해 원문의 직접성을 보존했습니다.
  alternative_readings:
  - 군사 이천 명
  - 병사 이천 명
  rationale: 원문은 ἄνδρας를 사용하므로 직역상 ‘남자들/사람들’이 더 직접적이며, 군사성은 문맥으로 충분히 전달됩니다.
  doctrine_reference: 원문 어휘의 직접 대응
