translation:
  language: ko
  text: 그들은 값이 오천 므나인 금 방패를 가져왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오천 므나의 금 방패’. 그리스어 표현은 더 문자적으로 이렇게 옮길 수 있지만, 여기서는 방패의 가치를 가리키는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνεγκαν
  english_pob_choice: they brought
  chosen_korean: 가져왔는데
  alternatives_korean:
  - 가져왔습니다
  - 바쳤는데
  - 전달했는데
  lexicon: LSJ
  rationale: 문맥상 외교적 선물의 전달을 가리키므로, 단순한 서술 동작을 살리면서도 자연스러운 현대 한국어로 옮겼습니다.
- source_word: ἀσπίδα
  english_pob_choice: shield
  chosen_korean: 방패
  alternatives_korean:
  - 작은 방패
  - 방어구
  lexicon: LSJ
  rationale: ἀσπίδα의 기본 뜻은 일반적인 ‘방패’이므로, 과도하게 구체화하지 않고 표준어로 옮겼습니다.
- source_word: χρυσῆν
  english_pob_choice: gold
  chosen_korean: 금으로 된
  alternatives_korean:
  - 금빛의
  - 황금의
  lexicon: LSJ
  rationale: 형용사적 용법을 재료성으로 풀어 ‘금으로 된’이라고 하여, 바로 뒤의 금액 표지와의 연결도 자연스럽게 했습니다.
- source_word: ἀπὸ μνῶν πεντακισχιλίων
  english_pob_choice: worth five thousand minas
  chosen_korean: 그 값은 오천 므나였습니다
  alternatives_korean:
  - 오천 므나 상당이었습니다
  - 오천 므나의 가치가 있었습니다
  - 오천 므나에서였습니다
  lexicon: LSJ
  rationale: ἀπό + 금액은 여기서 출처보다 가치/평가를 뜻하는 관용적 용법으로 보이므로, 방패의 가격 또는 가치라는 의미를 분명히 했습니다.
- source_word: μνῶν
  english_pob_choice: minas
  chosen_korean: 므나
  alternatives_korean:
  - 미나
  - 은화
  lexicon: LSJ
  rationale: 고대 화폐 단위는 현대 환산보다 음역을 유지하는 것이 역사적 구체성을 보존하므로 ‘므나’로 옮겼습니다.
