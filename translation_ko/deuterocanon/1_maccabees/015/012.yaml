  text: For he knew that troubles had gathered against him[b][a], and the forces had abandoned him.
  footnotes:
  - marker: a
    text: Or 'calamities had gathered against him.' The Greek verb suggests hostile forces or troubles having assembled in a concentrated way.
    reason: lexical_alternative
  - marker: b
    text: Or 'the troops had left him.' The Greek 'the forces' is a military term and likely refers to his armed support.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 재앙들이 그에게 몰려들어 있었다는 것[a]과 군대가 그를 버렸다는 것[b]을 알고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘재앙들이 그에게 집결해 있었습니다.’ κακά는 여기서 도덕적 악이 아니라 적대적인 재난들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘군대가 그를 떠났습니다.’ δυνάμεις는 일반적인 ‘힘’이 아니라 군사적 지원 세력을 가리키는 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  english_pob_choice: he knew
  chosen_korean: 알고 있었습니다
  alternatives_korean:
  - 알았습니다
  - 깨달았습니다
  lexicon: LSJ
  rationale: οἶδα의 과거 상태는 단순한 인식의 지속을 나타내므로, 자연스러운 합쇼체로 ‘알고 있었습니다’가 가장 무난합니다.
- source_word: ἐπισυνῆκται ἐπʼ αὐτὸν κακά
  english_pob_choice: troubles had gathered against him
  chosen_korean: 재앙이 자기에게 몰려들었고
  alternatives_korean:
  - 재난이 그에게 모여들었고
  - 불행이 그를 덮쳤고
  lexicon: LSJ
  rationale: κακά는 여기서 도덕적 ‘악’이 아니라 적대적·재난적 상황을 가리키므로, 군사적 압박의 응집감을 살린 ‘몰려들었고’로 옮겼습니다.
- source_word: αἱ δυνάμεις
  english_pob_choice: the forces
  chosen_korean: 군대가
  alternatives_korean:
  - 병력이
  - 그의 군대가
  - 군세가
  lexicon: LSJ
  rationale: δυνάμεις는 이 문맥에서 무장 병력을 뜻하므로, 한국어 독자에게 분명한 ‘군대’로 옮기되 원문의 군사적 의미를 유지했습니다.
