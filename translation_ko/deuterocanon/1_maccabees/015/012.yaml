  text: 그는 재앙이 자기에게 몰려들었고, 군대가 자신을 버렸다는 것을 알고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘재앙들이 그에게 집결해 있었습니다.’ κακά는 여기서 도덕적 악이 아니라 적대적 재난들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘군대가 그를 떠났습니다.’ δυνάμεις는 일반적인 ‘힘’이 아니라 군사적 지원 세력을 가리키는 말입니다.
    reason: lexical_alternative
