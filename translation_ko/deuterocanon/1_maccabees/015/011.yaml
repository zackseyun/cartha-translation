  source_fidelity: 개정이 필요합니다. φεύγων은 주절 동작과 동시적인 분사로서 그가 도라에 이른 방식/상황, 곧 도망 중이었음을 나타냅니다. 초안의 ‘도망하고 있었습니다’는 완료된 서술(ἦλθεν) 뒤에 진행상을 독립적으로 두어 원문의 결속을 약화합니다. 또한 τὴν ἐπὶ τὴν θάλασσαν은 도라의 해안 입지를 가리키는 것으로 이해할 여지가 강하므로, ‘바다 쪽으로’보다 ‘바닷가에 있는 도라’가 문맥과 영어 감사 기록의 지리적 강조를 더 정확히 반영합니다.
