  terminology: ‘안티오코스 왕’, ‘추격하다’, ‘도라’는 적절합니다. ‘바닷가에 있는 도라’는 지명을 해안으로 잘못 대체하지 않으면서 원문의 지리적 수식을 드러냅니다.
