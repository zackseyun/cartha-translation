  yaml_path: translation/deuterocanon/1_maccabees/015/031.yaml
  text: But if not[a], give five hundred talents of silver in place of them, and another five hundred talents for the destruction that you have caused and for the taxes of the cities. But if not[b], they will come and make war against you.
  footnotes:
  - marker: a
    text: 'Greek: ''and for the destruction that you have caused and for the taxes of the cities, another five hundred talents.'' The syntax is compressed; this translation takes the final sum as an additional payment covering both the damage and the cities'' taxes/tribute.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the tribute of the cities' instead of 'the taxes of the cities.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 그렇지 않으면, 그들을 대신하여 은 다섯백 달란트를 주고, 당신들이 일으킨 그 파괴와 도시들의 세금에 대해 또 은 다섯백 달란트를 주십시오. 그러나 그렇지 않으면, 그들이 와서 당신들과 전쟁을 벌일 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 “그들의 대가로”라는 요구 뒤에 “파괴”와 “도시들의 세금”에 대한 추가 500달란트를 한 번에 이어 말하는 압축된 구문입니다.
    reason: source_note
  - marker: b
    text: φόροι는 여기서 “세금” 또는 “조공”으로 옮길 수 있습니다.
    reason: alternative_reading
