  source_fidelity: 첫 번째 요구는 ‘그것들 대신에’ 은 오백 달란트를 내라는 뜻이고, 이어지는 오백 달란트는 파괴와 도시들의 φόροι에 대하여 추가로 요구되는 금액입니다. 초안의 의미는 대체로 맞지만, ‘그들을’은 선행 대상이 사람인 듯하게 들려 원문의 지시 대상과 문맥을 불필요하게 좁힐 수 있습니다.
