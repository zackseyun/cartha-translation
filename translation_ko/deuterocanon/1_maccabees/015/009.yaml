  - 명백해지게 할 것입니다
  - 알려지게 할 것입니다
  lexicon: LSJ
  rationale: 결과절의 의미를 살려 공개적으로 알려지고 분명해지는 뜻을 자연스럽게 표현했습니다.
- source_word: τὴν δόξαν ὑμῶν
  english_pob_choice: your glory
  chosen_korean: 당신의 영광
  alternatives_korean:
