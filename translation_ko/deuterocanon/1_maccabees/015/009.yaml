  text: ὡς δʼ ἂν καταστήσωμεν τὴν βασιλείαν ἡμῶν, δοξάσωμέν σε καὶ τὸ ἔθνος σου καὶ τὸ ἱερὸν δόξῃ μεγάλῃ, ὥστε φανερὰν γενέσθαι τὴν δόξαν ὑμῶν ἐν πάσῃ τῇ γῇ.
