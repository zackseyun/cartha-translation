  lexicon: LSJ
  rationale: 도구적/수단적 여격의 표현을 한국어 부사어로 옮겨, 반복되는 δόξα 계열의 연결을 유지했습니다.
- source_word: φανερὰν γενέσθαι
  english_pob_choice: may become evident
  chosen_korean: 드러나게 할 것입니다
  alternatives_korean:
