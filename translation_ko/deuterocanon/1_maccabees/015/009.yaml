  lexicon: LSJ
  rationale: δόξα/δοξάζω의 반복을 살리되, 한국어에서는 ‘영화롭게 하다’가 위엄을 부여하는 의미를 가장 직접적으로 전달합니다.
- source_word: ἱερὸν
  english_pob_choice: the sanctuary
  chosen_korean: 성전
  alternatives_korean:
  - 성소
  - 신성한 구역
  - 성역
  lexicon: LSJ
  rationale: ἱερόν은 성전 परिसर/성역을 가리킬 수 있지만, 여기서는 유대인의 성전이라는 정치·종교적 대상이 분명하므로 ‘성전’이 가장 자연스럽습니다.
- source_word: δόξῃ μεγάλῃ
  english_pob_choice: with great glory
  chosen_korean: 큰 영광으로
