base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/009.yaml
  text: And when we establish our kingdom[a], we will honor you and your nation and the sanctuary with great glory[c][b], so that your glory may become evident in all the earth.
  footnotes:
  - marker: a
    text: Or 'glorify ... with great glory ... your glory.' The Greek uses cognate forms of δόξα/δοξάζω throughout; 'honor' is chosen in the main text because the context is diplomatic and political rather than overtly theological.
    reason: lexical_alternative
  - marker: b
    text: '''The sanctuary'' could also be rendered ''the temple,'' since ἱερόν can refer to the sacred precinct.'
    reason: lexical_alternative
  - marker: c
    text: '''In all the earth'' may also be understood as ''throughout all the land/world''; the Greek γῆ can bear more than one geographic scope depending on context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 우리가 우리의 나라를 세우게 되면, 우리는 당신과 당신의 민족과 성전을 큰 영광으로 영화롭게 할 것이니, 그렇게 해서 당신의 영광이 온 땅에서 드러나게 할 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나라를 세우게 되면’은 ὡς δʼ ἂν καταστήσωμεν의 미래적 조건을 살린 표현입니다.
    reason: source_note
  - marker: b
    text: ‘성전’은 ἱερόν이 가리킬 수 있는 성역/성전 परिसर을 한국어에서 가장 자연스럽게 옮긴 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘온 땅’은 γῆ의 범위를 넓게 잡은 번역으로, 문맥에 따라 ‘온 땅/온 나라/온 세계’로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταστήσωμεν
  english_pob_choice: establish
  chosen_korean: 세우게 되면
  alternatives_korean:
  - 설립하면
  - 확립하면
  - 세우면
  lexicon: LSJ
  rationale: 미래적 조건을 나타내는 ὡς δʼ ἂν의 뉘앙스를 살리면서, 정치·왕권 문맥에 자연스러운 한국어로 ‘세우다’를 택했습니다.
- source_word: βασιλείαν
  english_pob_choice: kingdom
  chosen_korean: 나라
  alternatives_korean:
  - 왕국
  - 통치
  - 왕권
  lexicon: LSJ
  rationale: 유대 정치 공동체의 실질적 영역과 통치를 함께 가리키는 표현으로 ‘나라’가 가장 자연스럽고, 본문의 외교적 어조에도 맞습니다.
- source_word: δοξάσωμέν
  english_pob_choice: will honor
  chosen_korean: 영화롭게 할 것이니
  alternatives_korean:
  - 존귀하게 할 것이니
  - 영광스럽게 할 것이니
  - 영예를 돌릴 것이니
  lexicon: LSJ
  rationale: δόξα/δοξάζω의 반복을 살리되, 한국어에서는 ‘영화롭게 하다’가 위엄을 부여하는 의미를 가장 직접적으로 전달합니다.
- source_word: ἱερὸν
  english_pob_choice: the sanctuary
  chosen_korean: 성전
  alternatives_korean:
  - 성소
  - 신성한 구역
  - 성역
  lexicon: LSJ
  rationale: ἱερόν은 성전 परिसर/성역을 가리킬 수 있지만, 여기서는 유대인의 성전이라는 정치·종교적 대상이 분명하므로 ‘성전’이 가장 자연스럽습니다.
- source_word: δόξῃ μεγάλῃ
  english_pob_choice: with great glory
  chosen_korean: 큰 영광으로
  alternatives_korean:
  - 큰 존귀로
  - 크나큰 영예로
  - 위대한 영광으로
  lexicon: LSJ
  rationale: 도구적/수단적 여격의 표현을 한국어 부사어로 옮겨, 반복되는 δόξα 계열의 연결을 유지했습니다.
- source_word: φανερὰν γενέσθαι
  english_pob_choice: may become evident
  chosen_korean: 드러나게 할 것입니다
  alternatives_korean:
  - 분명해지게 할 것입니다
  - 명백해지게 할 것입니다
  - 알려지게 할 것입니다
  lexicon: LSJ
  rationale: 결과절의 의미를 살려 공개적으로 알려지고 분명해지는 뜻을 자연스럽게 표현했습니다.
- source_word: τὴν δόξαν ὑμῶν
  english_pob_choice: your glory
  chosen_korean: 당신의 영광
  alternatives_korean:
  - 당신의 존귀
  - 당신의 명예
  lexicon: LSJ
  rationale: 이 절 전체가 δόξα/δοξάζω의 어근 반복으로 짜여 있으므로, 한국어도 같은 어근의 반복을 살려 ‘영광’으로 통일했습니다.
theological_decisions:
- issue: δόξα/δοξάζω의 번역을 정치 외교 문맥에서도 ‘영광’으로 유지할지 여부
  chosen_reading: 외교적 호의의 의미가 있어도 본문은 의도적으로 반복되는 영광 어휘로 왕의 약속을 구성하므로, 한국어에서도 ‘영광/영화롭게 하다’로 유지했습니다.
  alternative_readings:
  - 존귀/존귀하게 하다로 완화
  - 영예/영예를 돌리다로 완화
  rationale: 본문의 수사 구조를 보존하는 것이 핵심이며, 의미를 일반적 호의로 약화시키면 반복 어휘의 힘이 줄어듭니다.
  doctrine_reference: '번역 원칙: 어휘 반복과 수사 구조 보존'
