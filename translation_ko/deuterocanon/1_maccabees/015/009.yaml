  source_fidelity: 그리스어는 왕국을 세운 뒤 상대를 영화롭게 하겠다는 약속과 그 결과로 ‘여러분의’ 영광이 온 땅에 드러나게 된다는 목적/결과를 표현합니다. 초안의 ‘드러나게 할 것입니다’는 φανερὰν γενέσθαι(‘드러나게 되다’)를 직접 타동적 사역으로 바꾸며, 단수 σε/σου에서 복수 ὑμῶν으로 바뀌는 대명사 전환도 반영하지 못했습니다.
  naturalness: ‘큰 영광으로 영화롭게 하다’는 원문의 동족어 반복을 의식한 표현이나 현대 한국어에서는 다소 중첩되어 어색합니다. ‘크게 영화롭게 하여’는 자연스러우면서도 강도와 반복을 보존합니다. 또한 각주 표지는 해당 어구에 붙이는 편이 명확합니다.
  terminology: βασιλεία는 정치적 왕국/왕권을 가리키므로 ‘우리 왕국’이 ‘우리 나라’보다 정확합니다. ἱερόν은 ‘성전’으로 옮길 수 있으나 성전 건물만이 아니라 성역/성전 구역을 뜻할 수도 있음을 각주에 남깁니다. δόξα/δοξάζω는 이 절의 반복을 살려 ‘영광/영화롭게 하다’로 일관되게 옮길 수 있습니다.
