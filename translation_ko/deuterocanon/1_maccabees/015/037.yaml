  rationale: ἐμβαίνω의 ‘배에 오르다/올라타다’라는 구체적 동작을 자연스러운 현대 한국어로 옮겼습니다. ‘승선하다’보다 덜 관용적이지 않으면서도 원문의 행동성을 유지합니다.
