  alternatives_korean:
  - 달아났습니다
  - 도망갔습니다
  lexicon: LSJ
  rationale: φευγ- 계열의 급박한 이탈을 살리기 위해 단순 이동보다 ‘도망치다’가 더 적절합니다.
- source_word: εἰς Ὀρθωσίαν
  english_pob_choice: to Orthosia
  chosen_korean: 오르토시아로
  alternatives_korean:
