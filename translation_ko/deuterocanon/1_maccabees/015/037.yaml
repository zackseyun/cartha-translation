  - 그때
  rationale: δέ는 단순 접속보다 서술 전환과 약한 대조를 띠므로, 군사적 도주 장면의 급전환을 드러내는 ‘그러나’가 원문의 흐름을 잘 반영합니다.
  doctrine_reference: 서사 접속사 처리
