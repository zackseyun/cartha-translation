  lexicon: 고유명사 음역
  rationale: εἰς + 지명은 목적지 방향을 나타내므로 한국어 조사 ‘-로’를 써서 이동의 방향성을 분명히 했습니다.
theological_decisions:
- issue: δέ의 담화 기능
  chosen_reading: 문두의 ‘그러나’로 앞선 서술과의 약한 대비를 살렸습니다.
  alternative_readings:
