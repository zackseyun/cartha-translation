translation:
  language: ko
  text: 로마의 집정관 루키우스가 프톨레마이오스 왕에게 문안드립니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘[발신자]가 [수신자]에게 χαίρειν’이라고 하는 관례적인 서간 개시 공식을 사용합니다. χαίρειν은 여기서 ‘문안드립니다’로 옮겼습니다.
    reason: cultural_note
lexical_decisions:
- source_word: Λεύκιος
  english_pob_choice: Lucius
  chosen_korean: 루키우스
  alternatives_korean:
  - 루시우스
  - 루키오스
  lexicon: 고유명사 표기 관행
  rationale: 라틴 인명 Lucius는 현대 한국어 음역에서 ‘루키우스’가 가장 자연스럽고, 고유명사는 번역하지 않고 음역하는 것이 적절합니다.
- source_word: ὕπατος
  english_pob_choice: consul
  chosen_korean: 집정관
  alternatives_korean:
  - 총독
  - 최고 행정관
  lexicon: LSJ
  rationale: 헬레니즘기 그리스어에서 로마의 관직 consul에 해당하므로, 한국어로는 역사적으로 정확한 ‘집정관’이 가장 적절합니다.
- source_word: Ῥωμαίων
  english_pob_choice: of the Romans
  chosen_korean: 로마인의
  alternatives_korean:
  - 로마 사람의
  - 로마의
  lexicon: LSJ
  rationale: 직함을 수식하는 속격 복수이므로 ‘로마인의’로 풀어, 관직의 소속을 분명히 드러냈습니다.
- source_word: Πτολεμαίῳ βασιλεῖ
  english_pob_choice: King Ptolemy
  chosen_korean: 왕 프톨레마이오스에게
  alternatives_korean:
  - 프톨레마이오스 왕에게
  - 프톨레마이오스에게
  lexicon: LSJ
  rationale: 서간문 수신자 표지로서 이름과 왕호를 함께 살리되, 한국어 어순에 맞게 ‘왕 프톨레마이오스’로 두었습니다.
- source_word: χαίρειν
  english_pob_choice: greetings
  chosen_korean: 문안합니다
  alternatives_korean:
  - 인사합니다
  - 안부를 전합니다
  lexicon: LSJ
  rationale: 그리스어 서간의 상투적 인사말로, 단순한 ‘기뻐하라’보다 한국어 서간체에 맞는 ‘문안합니다’가 기능적으로 대응합니다.
theological_decisions:
- issue: 서간문 개시 공식을 한국어로 어떻게 옮길지
  chosen_reading: 직역보다 서간 관용표현을 살려, ‘…에게 문안합니다’로 처리했습니다.
  alternative_readings:
  - …에게 인사합니다
  - …에게 평안을 빕니다
  rationale: χαίρειν은 실제 명령이 아니라 서간 개시 공식이므로, 의미 기능을 유지하는 표현이 가장 적절합니다.
  doctrine_reference: 서간체 관용구 번역 원칙
