  lexicon: LSJ
  rationale: δόξα는 여기서 단순한 명예보다 눈에 보이는 위세와 장엄함을 가리키므로, 문맥상 ‘위엄’이 가장 자연스럽습니다.
- source_word: ὠργίσθη ὁ βασιλεὺς ὀργὴν μεγάλην
  english_pob_choice: the king became very angry
  chosen_korean: 왕은 크게 화를 냈습니다
  alternatives_korean:
  - 왕은 크게 분노하였습니다
  - 왕은 몹시 진노하였습니다
  lexicon: LSJ
  rationale: 그리스어의 강한 강조를 살리면서도 현대 한국어에서 자연스럽고 읽기 쉬운 표현으로 옮겼습니다.
theological_decisions:
- issue: δόξα의 의미 범위
  chosen_reading: 시몬의 외적 위세와 장엄함을 가리키는 표현으로 이해해 ‘위엄’으로 옮겼습니다.
  alternative_readings:
  - 시몬의 영광
  - 시몬의 명예
  rationale: 이 문맥은 추상적 명예보다 왕에게 보고될 만한 가시적 장엄함을 가리키는 것으로 보이며, POB의 ‘splendor’ 해석과도 맞습니다.
  doctrine_reference: 문맥 중심 의미 결정
- issue: 감정 표현의 강도
  chosen_reading: ‘크게 화를 냈습니다’로 옮겨, ὀργὴν μεγάλην의 강조를 직접적으로 살렸습니다.
  alternative_readings:
  - 몹시 진노하였습니다
  - 크게 분노하였습니다
  rationale: 원문은 단순한 화남이 아니라 강한 분노를 강조하므로, 과도하게 완화하지 않고 현대어로 분명히 드러냈습니다.
  doctrine_reference: 서술 강조
