  text: But he turned back to the king in anger[a], and reported to him these words and the splendor of Simon and everything that he had seen; and the king became very angry.
  footnotes:
  - marker: a
    text: Or 'the glory of Simon.' The Greek δόξα can denote honor, glory, or visible magnificence; here it likely refers to the impressive display surrounding Simon.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그는 분노한 채 왕에게 돌아와, 이 말들과 시몬의 위엄과 자신이 본 모든 것을 그에게 보고하였습니다. 그러자 왕은 크게 화를 냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시몬의 영광’. 그리스어 δόξα는 명예, 영광, 또는 눈에 보이는 장엄함을 가리킬 수 있으며, 여기서는 시몬을 둘러싼 인상적인 위세를 뜻하는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστρεψεν
  english_pob_choice: turned back
  chosen_korean: 돌아와
  alternatives_korean:
  - 되돌아와
  - 다시 돌아와
  lexicon: LSJ
  rationale: 돌아와는 이동의 방향 전환을 자연스럽게 살리면서도, 보고를 위해 왕에게 되돌아가는 맥락을 잘 드러냅니다.
- source_word: μετὰ θυμοῦ
