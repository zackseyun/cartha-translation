base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/036.yaml
  text: But he turned back to the king in anger[a], and reported to him these words and the splendor of Simon and everything that he had seen; and the king became very angry.
  footnotes:
  - marker: a
    text: Or 'the glory of Simon.' The Greek δόξα can denote honor, glory, or visible magnificence; here it likely refers to the impressive display surrounding Simon.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그는 분노한 채 왕에게 돌아와, 이 말들과 시몬의 위세[a]와 자신이 본 모든 것을 그에게 보고하였습니다. 그러자 왕은 크게 화를 냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시몬의 영광’. 그리스어 δόξα는 명예, 영광, 또는 눈에 보이는 장엄함을 가리킬 수 있으며, 여기서는 시몬을 둘러싼 인상적인 위세를 뜻하는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστρεψεν
  english_pob_choice: turned back
  chosen_korean: 돌아와
  alternatives_korean:
  - 되돌아와
  - 다시 돌아와
  lexicon: LSJ
  rationale: 돌아와는 이동의 방향 전환을 자연스럽게 살리면서도, 보고를 위해 왕에게 되돌아가는 맥락을 잘 드러냅니다.
- source_word: μετὰ θυμοῦ
  english_pob_choice: in anger
  chosen_korean: 분노한 채
  alternatives_korean:
  - 화가 난 채로
  - 노한 채
  lexicon: LSJ
  rationale: 행동의 방식 부사구로 처리해 귀환의 정서를 자연스럽게 표현하되, θυμός의 강한 감정성을 유지합니다.
- source_word: τὴν δόξαν Σίμωνος
  english_pob_choice: the splendor of Simon
  chosen_korean: 시몬의 위엄
  alternatives_korean:
  - 시몬의 영광
  - 시몬의 찬란함
  - 시몬의 화려한 모습
  lexicon: LSJ
  rationale: δόξα는 여기서 단순한 명예보다 눈에 보이는 위세와 장엄함을 가리키므로, 문맥상 ‘위엄’이 가장 자연스럽습니다.
- source_word: ὠργίσθη ὁ βασιλεὺς ὀργὴν μεγάλην
  english_pob_choice: the king became very angry
  chosen_korean: 왕은 크게 화를 냈습니다
  alternatives_korean:
  - 왕은 크게 분노하였습니다
  - 왕은 몹시 진노하였습니다
  lexicon: LSJ
  rationale: 그리스어의 강한 강조를 살리면서도 현대 한국어에서 자연스럽고 읽기 쉬운 표현으로 옮겼습니다.
theological_decisions:
- issue: δόξα의 의미 범위
  chosen_reading: 시몬의 외적 위세와 장엄함을 가리키는 표현으로 이해해 ‘위엄’으로 옮겼습니다.
  alternative_readings:
  - 시몬의 영광
  - 시몬의 명예
  rationale: 이 문맥은 추상적 명예보다 왕에게 보고될 만한 가시적 장엄함을 가리키는 것으로 보이며, POB의 ‘splendor’ 해석과도 맞습니다.
  doctrine_reference: 문맥 중심 의미 결정
- issue: 감정 표현의 강도
  chosen_reading: ‘크게 화를 냈습니다’로 옮겨, ὀργὴν μεγάλην의 강조를 직접적으로 살렸습니다.
  alternative_readings:
  - 몹시 진노하였습니다
  - 크게 분노하였습니다
  rationale: 원문은 단순한 화남이 아니라 강한 분노를 강조하므로, 과도하게 완화하지 않고 현대어로 분명히 드러냈습니다.
  doctrine_reference: 서술 강조
