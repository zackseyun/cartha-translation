  - 노한 채
  lexicon: LSJ
  rationale: 행동의 방식 부사구로 처리해 귀환의 정서를 자연스럽게 표현하되, θυμός의 강한 감정성을 유지합니다.
- source_word: τὴν δόξαν Σίμωνος
  english_pob_choice: the splendor of Simon
  chosen_korean: 시몬의 위엄
  alternatives_korean:
