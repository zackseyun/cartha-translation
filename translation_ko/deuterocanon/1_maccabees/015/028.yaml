theological_decisions:
- issue: 왕국의 소유를 둘러싼 정치적 발화의 직접성
  chosen_reading: '"그것들은 내 왕국의 도시들입니다"라고 직설적으로 옮겨, 영토 주장의 강한 어조를 유지했습니다.'
  alternative_readings:
  - '"내 영토의 도시들입니다"'
  - '"내 나라의 도시들입니다"'
  rationale: βασιλεία를 여기서는 추상적 ‘통치 영역’보다 실제 왕권이 미치는 영역으로 말하는 문맥이므로, 직역에 가까운 ‘왕국’을 유지했습니다.
  doctrine_reference: 역사서 문맥의 정치·지리적 진술
