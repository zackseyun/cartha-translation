base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/028.yaml
  text: And he sent to him Athenobius[a], one of his Friends, to confer with him, saying, “You are holding Joppa and Gazara and the citadel in Jerusalem[b], cities of my kingdom.”
  footnotes:
  - marker: a
    text: Or “the Acra in Jerusalem.” The Greek word means “citadel” or “fortress,” but it can also function here as the established name of Jerusalem’s Seleucid stronghold.
    reason: lexical_alternative
  - marker: b
    text: Gazara is the Greek place-name form; the site is commonly identified with Gezer.
    reason: cross_reference
translation:
  language: ko
  text: 그는 그의 친구들 가운데 한 사람인 아테노비오스를 그에게 보내어 그와 의논하도록 하며 말했습니다. “당신들은 야포와 가자라[b]와 예루살렘의 성채[a]를 차지하고 있습니다. 그것들은 내 왕국의 도시들입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “예루살렘의 아크라”입니다. 그리스어 단어는 “성채” 또는 “요새”를 뜻하지만, 여기서는 예루살렘에 있던 셀레우코스 요새의 통용 이름으로도 쓰일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 가자라는 그리스어 지명형이며, 일반적으로 게셀과 동일한 장소로 식별됩니다.
    reason: cross_reference
