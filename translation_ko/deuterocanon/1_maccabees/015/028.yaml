  - severity: low
    issue: ‘함께 의논하게 하며’는 의논의 상대를 불분명하게 합니다.
    rationale: αὐτῷ는 앞서 언급된 상대방 ‘그’와의 의논을 가리키므로 ‘그와 의논하도록’이 더 정확합니다.
