  lexicon: LSJ
  rationale: 상대가 특정 지역을 실제로 통제하고 있다는 항의의 뉘앙스를 살리되, 원문의 범위를 넘어선 군사적 과잉 해석은 피했습니다.
- source_word: ἄκρας
