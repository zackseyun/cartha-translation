  source_fidelity: 원문의 ἀπέστειλεν ... κοινολογησόμενον αὐτῷ, λέγων은 ‘그에게 보내어 그와 의논하도록 하며 말하였다’라는 목적과 발화의 구조입니다. 초안의 ‘함께 의논하게 하며 말했습니다’는 의논 상대가 누구인지 불명확하고, ‘차지하고 있으니’는 원문에 없는 인과 관계를 더합니다. 또한 πόλεις τῆς βασιλείας μου는 앞의 지명들과 성채에 대한 동격적 설명으로 유지하는 것이 적절합니다.
  naturalness: 현대 한국어 합쇼체에서는 ‘그와 의논하도록 보내며 말했습니다’와 ‘차지하고 있습니다. 그것들은 내 왕국의 도시들입니다’가 자연스럽고 명료합니다. ‘자기의 친구들’보다 ‘그의 친구들’이 서술문에서 더 자연스럽습니다.
  terminology: 아테노비오스, 야포, 가자라, 성채, 왕국은 원문 및 기존 POB 선택을 충실히 반영합니다. φίλων의 궁정 직함 가능성은 본문에서 과도하게 직함화하지 않고 ‘친구들’로 남깁니다. 주석 표지는 해당 어휘 바로 뒤에 배치해야 합니다.
  issues:
  - severity: medium
    issue: ‘차지하고 있으니’가 인과 의미를 추가합니다.
    rationale: κατακρατεῖτε는 ‘차지하고 있다/장악하고 있다’라는 진술이며, 뒤의 πόλεις τῆς βασιλείας μου는 ‘왜냐하면’ 절이 아니라 그 대상들의 성격을 밝히는 동격적 표현입니다.
  - severity: medium
