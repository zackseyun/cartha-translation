- issue: 화폐 발행 권한의 표현 방식
  chosen_reading: ‘고유한 화폐를 만들도록 하십시오’로 옮겨, 단순한 소유가 아니라 국가적 발행 권한의 부여를 드러냈습니다.
  alternative_readings:
  - ‘당신만의 동전을 주조하도록 하십시오’
  - ‘당신 나라의 통화로 쓸 화폐를 만들도록 하십시오’
  rationale: 그리스어는 일반 동사 ποιῆσαι와 화폐 관련 명사들을 결합해, 왕권에 속한 통화 창설 권한을 허락합니다. 한국어에서도 그 권한성과 목적성을 함께 보이도록 했습니다.
  doctrine_reference: 역사적·정치적 본문 이해
