  text: In the one hundred seventy-fourth year, Antiochus went out into the land of his fathers, and all the forces gathered to him, so that only a few were left with Tryphon.
  footnotes:
  - marker: a
    text: Or, 'so that few were with Tryphon.' The Greek states the result tersely; 'were left with' makes the implied sense explicit in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 백칠십사년이 되자 안티오코스가 조상들의 땅으로 나갔고, 모든 군대가 그에게 모여들어 트뤼폰과 함께 있는 사람은 소수에 불과했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그래서 트뤼폰과 함께 있는 사람은 적었습니다.’ 그리스어는 결과를 간결하게 말하므로, 한국어 본문은 그 함의를 풀어 썼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτους τετάρτου καὶ ἑβδομηκοστοῦ καὶ ἑκατοστοῦ
