  rationale: 그리스어의 결과 관계를 한국어에서 자연스럽게 드러내되, POB의 수정 취지처럼 ‘left with’를 덧붙이지 않고 소수라는 결과만 직접 표현했습니다.
  doctrine_reference: 서사적 결과 진술; 해석상 신학 쟁점 없음
