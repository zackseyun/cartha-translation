    text: 또는, ‘그 결과 트리폰과 함께 있는 사람은 소수에 불과했습니다.’ 그리스어는 트리폰과 함께한 이들이 적었다는 결과를 간결하게 진술합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτους τετάρτου καὶ ἑβδομηκοστοῦ καὶ ἑκατοστοῦ
