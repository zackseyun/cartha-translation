  lexicon: LSJ
  rationale: γῆ와 τῶν πατέρων αὐτοῦ의 직결 구조를 살리면서, 한국어에서 자연스럽고 소스-투명한 표현으로 옮겼습니다.
- source_word: πᾶσαι αἱ δυνάμεις
  english_pob_choice: all the forces
  chosen_korean: 모든 군대가
  alternatives_korean:
  - 모든 군사력이
  - 모든 병력은
  - 모든 세력이
  lexicon: LSJ
  rationale: 이 문맥의 δυνάμεις는 군사 집단을 가리키므로 ‘군대’로 옮겼습니다. ‘모든’으로 총체성을 유지했습니다.
