  rationale: 동사의 기본 의미인 ‘나가다’를 유지해, 군사적 함의를 과도하게 덧붙이지 않았습니다.
- source_word: εἰς τὴν γῆν τῶν πατέρων αὐτοῦ
  english_pob_choice: into the land of his fathers
  chosen_korean: 조상들의 땅으로
  alternatives_korean:
