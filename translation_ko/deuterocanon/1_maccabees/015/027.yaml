lexical_decisions:
- source_word: ἠβούλετο
  english_pob_choice: was not willing
  chosen_korean: 받아들이려 하지 않았고
  alternatives_korean:
  - 받을 뜻이 없었고
  - 받기를 원하지 않았고
  lexicon: BDAG
  rationale: 미완료 시제의 지속적 태도와 의지를 살려, 단순한 순간적 거절보다 ‘받아들이려 하지 않다’로 옮겼습니다.
- source_word: δέξασθαι
  english_pob_choice: accept
  chosen_korean: 받아들이다
  alternatives_korean:
  - 받다
  - 수용하다
  lexicon: BDAG
  rationale: 외교적 문맥에서 단순한 ‘받다’보다, 제안·조건·합의를 받아들이는 뜻을 자연스럽게 드러냅니다.
- source_word: ἠθέτησεν
  english_pob_choice: rejected
  chosen_korean: 거부했으며
  alternatives_korean:
  - 무효화했으며
  - 폐기했으며
  - 저버렸으며
  lexicon: BDAG
  rationale: ἀθετέω의 ‘무효화하다/폐하다’ 가능성을 보존하면서도, 문맥상 기존 합의의 부인을 분명히 하는 ‘거부하다’로 옮겼습니다.
- source_word: ἠλλοτριοῦτο
  english_pob_choice: became estranged
  chosen_korean: 그에게서 멀어졌습니다
  alternatives_korean:
  - 그와 소원해졌습니다
  - 그에게서 소원해졌습니다
  - 그와 멀어진 사람처럼 행동했습니다
  lexicon: LSJ
  rationale: 관계의 단절과 소원함을 살리되, 과도하게 심리화하거나 적대화하지 않도록 ‘멀어지다’로 표현했습니다.
theological_decisions:
- issue: 합의 파기의 정도와 관계 단절의 표현
  chosen_reading: ‘거부했으며, 그에게서 멀어졌습니다’로 옮겨 법적 무효화와 관계적 소원함을 함께 드러냈습니다.
  alternative_readings:
  - ‘무효화했으며, 그와 소원해졌습니다’
  - ‘저버렸으며, 그와 멀어졌습니다’
  rationale: 본문은 단순한 의견 차이보다 이전에 맺은 약속의 파기와 관계적 단절을 함께 보여 주므로, 둘 중 하나만 약화하지 않도록 두 표현을 병렬로 살렸습니다.
  doctrine_reference: 역사 서술의 서약 파기·동맹 붕괴 표현
