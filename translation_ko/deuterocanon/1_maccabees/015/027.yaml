  source_fidelity: 원문의 αὐτὰ(‘그것들’), ἠβούλετο…δέξασθαι(받아들이려 하지 않았다), πάντα ὅσα συνέθετο αὐτῷ τὸ πρότερον(그가 전에 그와 합의했던 모든 것), 그리고 관계적 소원함을 나타내는 ἠλλοτριοῦτο를 대체로 충실히 반영합니다. 다만 ἀθετέω는 이미 맺은 합의를 단순히 ‘거부’하는 것보다 그것을 저버리거나 폐기하는 뉘앙스가 더 직접적입니다.
  naturalness: 합쇼체 문장은 자연스럽습니다. 그러나 ‘그에게서 멀어졌습니다’보다 ‘그와 멀어졌습니다’가 관계의 소원함을 현대 한국어에서 더 자연스럽게 나타냅니다.
  terminology: 신학 전문 용어는 해당하지 않습니다. 외교적·관계적 문맥에서 ‘합의’와 ‘저버리다’를 사용하여 원문의 약정 파기와 관계 단절을 과도한 법률 용어 없이 표현했습니다.
