  lexicon: LSJ
  rationale: 배들이 바다 쪽에서 도시를 향해 바짝 붙어 봉쇄를 형성하는 그림을 간결하게 살리되, 과도한 전투 해석은 피했습니다.
- source_word: συνέθλιβεν
