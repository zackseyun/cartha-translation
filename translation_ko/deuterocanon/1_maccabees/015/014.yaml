  lexicon: LSJ
  rationale: ἐκύκλωσεν의 원형적 뜻은 ‘원형으로 둘러싸다’이므로, 군사적 압박의 이미지를 살리면서도 자연스러운 한국어로 옮겼습니다.
- source_word: συνῆψαν
