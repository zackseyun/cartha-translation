  chosen_korean: 압박하였고
  alternatives_korean:
  - 눌렀고
  - 조였고
  - 짓눌렀고
  lexicon: LSJ
  rationale: 미완료 과거의 지속적 압력을 살리기 위해 단회적 ‘눌렀다’보다 진행성이 있는 ‘압박하다’를 택했습니다.
- source_word: ἐκπορεύεσθαι καὶ εἰσπορεύεσθαι
  english_pob_choice: to go out or to go in
  chosen_korean: 나가거나 들어오지 못하게
  alternatives_korean:
  - 나가거나 들어가게
  - 나가고 들어오지 못하게
  - 출입하지 못하게
  lexicon: LSJ
  rationale: 출입 금지를 뜻하는 짝 표현을 직역에 가깝게 살리면서, 한국어에서는 ‘나가거나 들어오지 못하게’가 가장 자연스럽습니다.
theological_decisions:
- issue: 군사 봉쇄와 도시 압박의 누적적 묘사
  chosen_reading: ‘에워쌌고… 압박하였고… 나가거나 들어오지 못하게 하였습니다’로 연쇄 동작을 살려, 봉쇄의 점증적 긴박함을 유지했습니다.
  alternative_readings:
  - ‘포위했고… 눌렀고… 출입하지 못하게 하였습니다’
  - ‘둘러쌌고… 조였고… 나가지도 들어오지도 못하게 하였습니다’
  rationale: 원문의 반복 접속과 두 방향의 압박을 살려야 도시가 완전히 봉쇄되었다는 역사적 상황이 드러납니다.
  doctrine_reference: source narrative fidelity
