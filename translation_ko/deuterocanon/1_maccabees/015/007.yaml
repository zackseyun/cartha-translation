  text: But Jerusalem and the holy places are to be free; and all the weapons that you have made[a], and the strongholds that you have built, which you hold, shall remain yours.
  footnotes:
  - marker: a
    text: Or 'the sanctuary' or 'the holy things' for 'the holy places' (τὰ ἅγια). The Greek plural can refer either to sacred precincts or to holy objects; the broader rendering fits the context of Jerusalem's freedom and possession rights.
    reason: lexical_alternative
translation:
  language: ko
  text: 예루살렘과 거룩한 곳들[a]은 자유롭게 될 것입니다. 또한 당신이 만든 모든 무기와, 당신이 세우고 장악하고 있는 요새들은 당신의 소유로 남을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거룩한 곳들’은 문맥상 성전 구역을 가리킬 수 있으나, 그리스어 복수형 τὰ ἅγια는 ‘성소’ 또는 ‘거룩한 것들’로도 이해될 수 있습니다.
    reason: lexical_alternative
