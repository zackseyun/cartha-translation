  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 εἶναι와 μενέτω는 왕의 칙령에서 앞으로 효력이 발생하는 법적 선언이므로, ‘~해야 합니다’보다 ‘~될 것입니다/남을 것입니다’가 더 정확합니다. 또한 ὧν κρατεῖς는 가장 가까운 선행사인 ‘요새들’을 수식하도록 드러내는 편이 적절합니다.
  naturalness: 초안은 이해하기 쉽지만 ‘자유로워야 합니다’와 ‘남아 있어야 합니다’는 일반적 의무를 말하는 듯하여 칙령 문맥의 선언적 어조가 다소 약합니다. 수정문은 현대 표준어 합쇼체로 자연스럽고 법적 허가·보장의 어조를 살립니다.
  terminology: ‘예루살렘’, ‘거룩한 곳들’, ‘무기’, ‘요새들’은 적절합니다. τὰ ἅγια의 의미 범위는 본문에서 좁히지 않고 각주로 대안을 제시하는 것이 타당합니다.
  issues:
