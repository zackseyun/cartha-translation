    issue: 법적·선언적 미래 표현
    rationale: εἶναι와 μενέτω는 이 왕실 서신에서 예루살렘과 성스러운 영역의 지위 및 보유권을 부여·확인하는 표현입니다. ‘~해야 합니다’는 의무적 뉘앙스를 더하므로 ‘~될 것입니다/남을 것입니다’로 옮기는 것이 안전합니다.
  - severity: low
    issue: 관계절의 수식 범위
    rationale: ὧν κρατεῖς는 문맥과 근접한 선행사상 ‘당신이 세운 요새들’을 수식하는 것으로 명시하는 편이 자연스럽습니다.
  - severity: medium
