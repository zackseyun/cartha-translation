  text: ἐπειδὴ τινες λοιμοὶ κατεκράτησαν τῆς βασιλείας τῶν πατέρων ἡμῶν, βούλομαι δὲ ἀντιποιήσασθαι τῆς βασιλείας, ὅπως ἀποκαταστήσω αὐτὴν ὡς ἦν τὸ πρότερον· ἐξενολό- γησα δὲ πλῆθος δυνάμεων καὶ κατεσκεύασα πλοῖα πολεμικά·
