base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/003.yaml
  text: Since certain pestilent men seized control of the kingdom of our fathers[a], and I want to reclaim the kingdom so that I may restore it as it was before, I have enlisted a multitude of forces and equipped warships[c][b];
  footnotes:
  - marker: a
    text: Or 'certain plagues seized the kingdom of our fathers'; the Greek uses λοιμοί, literally 'plagues/pestilences,' metaphorically for harmful people.
    reason: lexical_alternative
  - marker: b
    text: Or 'I have recruited many troops' or possibly 'I have levied a body of foreign/hired forces'; the verb can carry a military recruitment nuance.
    reason: lexical_alternative
  - marker: c
    text: '''Equipped warships'' may also be rendered ''prepared'' or ''built warships,'' since the Greek verb can cover making ready as well as constructing.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어떤 역병 같은 자들이 우리 조상들의 왕국을 장악했기 때문에, 나는 그 왕국에 대한 권리를 주장하여 그것을 예전과 같이 회복하고자 합니다. 나는 많은 병력을 모집하고 전함들을 마련했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘역병 같은 자들’은 그리스어 λοιμοί를 사람들에게 적용한 비유적·멸시적 표현으로 옮긴 것입니다. 문자적으로는 ‘역병들’ 또는 ‘전염병들’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘많은 병력을 모집하고’는 ἐξενολόγησα의 군사 병력을 모으거나 징집하는 뜻을 반영한 번역입니다. 외국인 또는 고용된 병력을 모집했다는 뉘앙스일 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘전함들을 마련했습니다’는 κατεσκεύασα가 배를 준비하다, 장비하다, 또는 만들다를 뜻할 수 있음을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λοιμοὶ
  english_pob_choice: certain pestilent men
  chosen_korean: 어떤 흉악한 자들
  alternatives_korean:
  - 어떤 전염병 같은 자들
  - 어떤 해로운 사람들
  - 어떤 흉악한 사람들
  lexicon: LSJ
  rationale: λοιμοί는 문자적으로는 ‘전염병/역병’이지만 여기서는 사람들을 비난하는 비유적 표현이므로, 멸시와 악의 뉘앙스를 살리되 한국어에서 자연스러운 욕설성 표현으로 옮겼습니다.
- source_word: κατεκράτησαν
  english_pob_choice: seized control of
  chosen_korean: 장악했기 때문에
  alternatives_korean:
  - 지배했기 때문에
  - 장악하여
  - 빼앗아 차지했기 때문에
  lexicon: LSJ
  rationale: τῆς βασιλείας와 함께 ‘강제로 권세를 잡다’는 정치적 의미가 분명하므로, 단순 소유보다 권력 장악을 드러내는 표현을 택했습니다.
- source_word: ἀντιποιήσασθαι τῆς βασιλείας
  english_pob_choice: to reclaim the kingdom
  chosen_korean: 그 왕국을 되찾아
  alternatives_korean:
  - 그 왕국을 다시 차지하여
  - 그 왕국에 대한 권리를 주장하여
  - 그 왕국을 회복하여
  lexicon: LSJ
  rationale: 중간태 동사는 무엇인가에 대한 권리를 주장하거나 차지하려는 뜻이 있어, 문맥상 ‘되찾다’가 가장 자연스럽지만 원문의 회복 의지도 함께 담을 수 있습니다.
- source_word: ἐξενολόγησα πλῆθος δυνάμεων
  english_pob_choice: I have enlisted a multitude of forces
  chosen_korean: 나는 많은 군대를 모집했고
  alternatives_korean:
  - 나는 많은 병력을 징집했고
  - 나는 많은 군세를 모았고
  - 나는 큰 무리의 군대를 소집했고
  lexicon: LSJ
  rationale: ἐξενολόγησα는 군사력을 모으거나 모집하는 뜻으로, 한국어에서는 ‘군대를 모집하다’가 가장 직접적이며 절차적 뉘앙스를 살립니다.
- source_word: κατεσκεύασα πλοῖα πολεμικά
  english_pob_choice: equipped warships
  chosen_korean: 전투함들을 갖추었습니다
  alternatives_korean:
  - 전함들을 준비했습니다
  - 전함들을 만들었습니다
  - 전투용 함선들을 장비했습니다
  lexicon: LSJ
  rationale: κατεσκεύασα는 ‘준비하다/갖추다/제작하다’까지 포괄하므로, 배를 전쟁에 쓸 수 있도록 마련했다는 뜻을 살려 특정한 제작 여부를 단정하지 않는 표현을 택했습니다.
theological_decisions:
- issue: 본문의 정치적·모욕적 어조를 얼마나 직설적으로 옮길지
  chosen_reading: 원문의 공격적 발언을 완화하지 않고 ‘흉악한 자들’로 직설적으로 옮겼습니다.
  alternative_readings:
  - 완곡하게 ‘해로운 사람들’로 옮길 수 있음
  - 문어적으로 ‘사악한 자들’로 옮길 수 있음
  rationale: 이 구절은 왕위 찬탈에 대한 화자의 정당화이자 강한 비난이므로, 수사적 거침을 보존하는 것이 원문의 효과를 더 잘 전달합니다.
  doctrine_reference: 문학적·역사적 맥락 보존
- issue: ἀποκαταστήσω αὐτὴν ὡς ἦν τὸ πρότερον의 복원 의미
  chosen_reading: ‘예전과 같이 회복하고자 합니다’로 현재 상태를 과거 상태로 되돌리려는 목적을 분명히 했습니다.
  alternative_readings:
  - ‘원래 상태로 복구하고자 합니다’
  - ‘이전과 같게 재건하고자 합니다’
  rationale: 단순한 정치적 복귀가 아니라 이전 질서의 회복을 나타내므로, ‘회복’과 ‘예전과 같이’의 결합이 원문 목적절의 힘을 잘 반영합니다.
  doctrine_reference: 역사적 서술의 목적문 보존
