base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/029.yaml
  text: You have laid waste their borders[a], and you have inflicted a great blow on the land[c][b], and you have gained control of many places in my kingdom.
  footnotes:
  - marker: a
    text: Or 'have devastated their territory'; the Greek can denote making a region desolate.
    reason: lexical_alternative
  - marker: b
    text: Or 'have inflicted great damage on the land'; 'a great blow' renders a term that can also mean wound, stroke, or plague depending on context.
    reason: lexical_alternative
  - marker: c
    text: Or 'have ruled over many places in my kingdom'; the Greek verb denotes exercising mastery or dominion.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 그들의 경계 지역을 황폐하게 하였고, 땅에 큰 타격을 가하였으며, 내 왕국 안의 많은 곳을 장악하였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 영토를 황폐하게 하였다’; 그리스어는 한 지역을 황무지로 만들거나 황폐하게 하는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘땅에 큰 피해를 입혔다’; πληγή는 문맥에 따라 상처, 타격, 재앙을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘내 왕국 안의 많은 곳을 지배하였다’; 그리스어 동사는 지배권을 행사한다는 뜻을 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ὅρια
  english_pob_choice: their borders
  chosen_korean: 그들의 경계
  alternatives_korean:
  - 그들의 영토
  - 그들의 국경
  lexicon: LSJ
  rationale: ὅρια는 경계선, 국경 지대, 영토의 한계를 가리킬 수 있으므로, 군사적·정치적 맥락을 살리면서도 과도하게 행정구역화하지 않는 ‘경계’로 옮겼습니다.
- source_word: ἠρημώσατε
  english_pob_choice: have laid waste
  chosen_korean: 황폐하게 만들었고
  alternatives_korean:
  - 폐허로 만들었고
  - 초토화하였고
  lexicon: LSJ
  rationale: 동사는 ‘황폐하게 하다, 사람이 살지 못하게 만들다’의 뜻이므로, 파괴의 결과를 직접 드러내는 ‘황폐하게 만들다’가 가장 자연스럽습니다.
- source_word: πληγὴν μεγάλην
  english_pob_choice: a great blow
  chosen_korean: 큰 타격
  alternatives_korean:
  - 큰 상처
  - 큰 재앙
  - 큰 피해
  lexicon: LSJ
  rationale: πληγή는 문맥에 따라 ‘타격, 상처, 재난’이 될 수 있는데, 여기서는 전쟁의 피해를 말하므로 질병 뉘앙스를 피하면서도 충격을 살리는 ‘큰 타격’으로 옮겼습니다.
- source_word: ἐκυριεύσατε
  english_pob_choice: have gained control of
  chosen_korean: 장악하였으며
  alternatives_korean:
  - 지배하였으며
  - 주권을 행사하였으며
  - 지배권을 얻었으며
  lexicon: LSJ
  rationale: κυριεύω는 ‘지배하다, 주권을 행사하다’의 뜻이지만, 여기서는 점령·통제의 결과를 강조하므로 ‘장악하다’가 가장 간결하고 문맥에 맞습니다.
theological_decisions:
- issue: 왕권 표현인 βασιλείᾳ μου의 한국어 톤
  chosen_reading: 내 왕국
  alternative_readings:
  - 내 나라
  - 내 왕권의 영역
  - 내 왕국 안에서
  rationale: 여기서는 통치 영역을 가리키는 정치적 표현이므로, 종교적 ‘하나님의 나라’와 혼동되지 않도록 단순히 ‘내 왕국’으로 옮겼습니다.
  doctrine_reference: 문맥적 왕권/영토 표상
- issue: 과거 보고형 진술의 인칭 유지
  chosen_reading: 너희는 … 하였습니다
  alternative_readings:
  - 당신들은 … 하였습니다
  - 그대들은 … 하였습니다
  rationale: 본문의 2인칭 복수 직접 책망을 살리기 위해 한국어에서도 ‘너희는’으로 유지하여 발화의 공격성과 직접성을 보존했습니다.
  doctrine_reference: 화행 보존
