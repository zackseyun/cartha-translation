  text: And he commanded him to encamp opposite Judea[a]; and he commanded him to build Kedron and fortify the cities, and to fight against the people[b]. But the king was pursuing Tryphon.
  footnotes:
  - marker: a
    text: Or 'facing Judea.' The Greek phrase is spatial, indicating position opposite or in front of Judea.
    reason: lexical_alternative
  - marker: b
    text: Or 'build Kedron' or 'rebuild Kedron.' The Greek verb itself does not specify whether the site was being newly built or restored.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 그에게 유다 맞은편에[a] 진을 치라고 명령했습니다. 또 그에게 케드론을 건설하고[b] 도시들을 요새화하며 그 백성과 싸우도록 명령했습니다. 그러나 왕은 트리폰을 추격하고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘유다 맞은편에’는 유다를 마주한 위치를 나타내는 공간적 표현입니다. 이 말 자체가 적대 행위를 반드시 뜻하는 것은 아닙니다.
    reason: lexical_alternative
  - marker: b
    text: ‘케드론을 건설하다’에 쓰인 그리스어 동사는 새로 건설하는 것인지 재건하는 것인지를 명시하지 않습니다. 따라서 ‘재건하다’로 한정하지 않았습니다.
    reason: lexical_alternative
