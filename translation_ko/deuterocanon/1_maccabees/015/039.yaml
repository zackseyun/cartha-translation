  text: And he commanded him to encamp opposite Judea[a]; and he commanded him to build Kedron and fortify the cities, and to fight against the people[b]. But the king was pursuing Tryphon.
  footnotes:
  - marker: a
    text: Or 'facing Judea.' The Greek phrase is spatial, indicating position opposite or in front of Judea.
    reason: lexical_alternative
  - marker: b
    text: Or 'build Kedron' or 'rebuild Kedron.' The Greek verb itself does not specify whether the site was being newly built or restored.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그에게 유다 앞쪽에 진을 치라고 명령했으며, 그에게 케드론을 세우고 도시들을 요새화하며 그 백성과 싸우라고 명령했습니다. 그러나 왕은 트리폰을 추격하고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘유다 앞쪽에’는 지리적 배치를 나타내며, POB 영어 주해의 ‘opposite’처럼 적대적 의미를 반드시 포함하지는 않습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘케드론을 세우다’는 히브리/헬라어 동사가 새로 건설하는지 재건하는지를 명시하지 않으므로, 재건으로 한정하지 않았습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνετείλατο
