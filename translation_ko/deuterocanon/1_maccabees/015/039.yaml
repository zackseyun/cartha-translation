  lexicon: BDAG
  rationale: 군사적·권위적 지시의 강도를 살리면서도 현대 한국어에서 자연스럽게 읽히는 표현입니다.
- source_word: παρεμβάλλειν κατὰ πρόσωπον τῆς Ἰουδαίας
  english_pob_choice: to encamp opposite Judea
  chosen_korean: 유다 앞쪽에 진을 치다
  alternatives_korean:
  - 유다 맞은편에 진을 치다
