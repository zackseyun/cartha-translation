  rationale: 공간적 배치를 나타내는 표현으로 읽히므로, ‘맞은편’의 의미를 살리되 문맥상 자연한 ‘앞쪽에 진을 치다’로 옮겼습니다.
- source_word: οἰκοδομῆσαι τὴν Κεδρὼν
  english_pob_choice: to build Kedron
  chosen_korean: 케드론을 세우다
  alternatives_korean:
  - 케드론을 건축하다
  - 케드론을 다시 세우다
  lexicon: BDAG
  rationale: οἰκοδομέω는 ‘짓다/세우다’의 기본 의미를 가지므로, 재건 여부를 과도하게 특정하지 않는 ‘세우다’가 가장 안전합니다.
- source_word: ὀχυρῶσαι τὰς πόλεις
  english_pob_choice: fortify the cities
  chosen_korean: 도시들을 요새화하다
  alternatives_korean:
  - 도시들을 견고하게 하다
  - 도시들을 굳게 하다
  lexicon: LSJ
  rationale: 군사적 방어 강화를 가리키는 동사이므로 ‘요새화하다’가 가장 직접적입니다.
- source_word: τὸν λαόν
  english_pob_choice: the people
  chosen_korean: 그 백성
  alternatives_korean:
  - 그 사람들
  - 그 민족
  lexicon: BDAG
  rationale: 여기서는 유다인 집단 전체를 가리키므로, 집단성을 드러내는 ‘백성’이 적절합니다.
