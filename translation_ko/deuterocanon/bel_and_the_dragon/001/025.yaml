translation:
  language: ko
  text: 그리고 다니엘이 말했습니다. “나는 주 나의 하나님께 엎드리겠습니다.[a] 그분은 살아 계신 하나님이시기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나는 주 나의 하나님을 예배하겠습니다.” 그리스어 동사는 몸을 굽혀 절하는 행위와 예배를 모두 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκυνήσω
  english_pob_choice: I will bow down
  chosen_korean: 엎드립니다
  alternatives_korean:
  - 경배하겠습니다
  - 절하겠습니다
  - 예배하겠습니다
  lexicon: BDAG
  rationale: 동사는 몸을 굽혀 경배하는 행위를 가리키므로, 현대 한국어에서는 ‘엎드리다/엎드립니다’가 물리적 자세와 경외의 뜻을 함께 가장 자연스럽게 살립니다.
- source_word: Κυρίῳ
  english_pob_choice: the Lord
  chosen_korean: 주
  alternatives_korean:
  - 주님
  - 주께
  - 주님께
  lexicon: BDAG
  rationale: κύριος는 본문에서 다니엘이 하나님께 드리는 호칭이므로, 프로젝트 기본값인 ‘주’를 살리되 조사 결합으로 ‘주께’로 옮겨 자연스러운 목적격을 만들었습니다.
- source_word: τῷ θεῷ μου
  english_pob_choice: my God
  chosen_korean: 나의 하나님이신
  alternatives_korean:
  - 나의 하나님
  - 내 하나님이신
  - 나의 하나님께
  lexicon: BDAG
  rationale: ‘the Lord my God’의 관계를 한국어에서는 호격·관형화로 풀어 ‘나의 하나님이신 주’라고 하여, 소유격과 동일시를 함께 드러냈습니다.
- source_word: θεὸς ζῶν
  english_pob_choice: the living God
  chosen_korean: 살아 계신 하나님
  alternatives_korean:
  - 생존하시는 하나님
  - 살아 있는 하나님
  - 살아 계신 분
  lexicon: BDAG
  rationale: 관용구 ‘the living God’는 하나님이 실제로 살아 역사하시는 분이라는 대조를 내포하므로, 교회용어로 굳어진 ‘살아 계신 하나님’이 가장 정확합니다.
theological_decisions:
- issue: προσκυνήσω의 예배성 vs. 몸을 굽힘의 구체성
  chosen_reading: ‘엎드립니다’로 물리적 경배 행위를 먼저 드러내고, 예배의 의미는 문맥상 보존했습니다.
  alternative_readings:
  - 경배하겠습니다
  - 예배하겠습니다
  rationale: 영어 POB가 ‘bow down’을 택해 물리적 동작을 유지한 것과 같은 방향으로, 한국어도 예배로 평탄화하지 않고 본문의 경외 행위를 직접 보여 주는 표현을 선택했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: optimal equivalence; preserve source sense without paraphrase'
