- from: 그들은 그것들을 완전히 삼켜 버렸습니다. 그 사람들이 나가자 왕은 벨 앞에 음식을 차려 두었고, 다니엘은 자기의 젊은 종들에게 명령하여 재를 가져오게 하고 왕 앞에서만 온 성전 위에 그것을 뿌리게 했습니다. 그런 다음 그들이 나가서 문을 닫고 왕의 인장반지로 봉인한 뒤 떠났습니다.[a]
  to: 그들은 그것들을 완전히 먹어 치웠습니다. 그 사람들이 나가자 왕은 벨 앞에 음식을 차려 두었습니다. 다니엘은 자기의 젊은 시종들에게 명령했고, 그들은 재를 가져와 왕만 보는 앞에서 성전 전체에 뿌렸습니다. তারপর 그들이 나가서 문을 닫고 왕의 인장반지로 봉인한 뒤 떠났습니다.[a]
  rationale: 음식 섭취의 의미, 다니엘의 명령과 시종들의 실행이라는 문장 구조, 그리고 왕의 단독 현존이라는 강조를 더 정확하고 자연스러운 현대 한국어로 반영했습니다. 오기인 비한국어 접속 표현은 최종 본문에서 한국어 ‘그런 다음’으로 바로잡아야 합니다.
