  - severity: medium
    issue: ‘명령하여 재를 가져오게 하고 ... 뿌리게 했습니다’
    rationale: 사역 구문은 가능하지만, 원문의 ‘명령했다; 그들이 가져와 뿌렸다’라는 서술 진행을 흐리고 문장을 무겁게 만듭니다.
