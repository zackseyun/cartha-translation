  text: and they consumed them completely. And it happened that[a], when those men had gone out, the king set the food before Bel, and Daniel commanded his young servants, and they brought ashes and scattered them over the whole temple in the presence of the king alone. Then, after going out, they shut the door and sealed it with the king’s signet ring, and went away.
  footnotes:
  - marker: a
    text: Or 'with only the king present.' The Greek phrase emphasizes that the scattering of the ashes was done before the king and not before a larger group.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그것들을 완전히 삼켜 버렸습니다. 그 사람들이 나가자 왕은 벨 앞에 음식을 차려 두었고, 다니엘은 자기의 젊은 종들에게 명령하여 재를 가져오게 하고 왕 앞에서만 온 성전 위에 그것을 뿌리게 했습니다. 그런 다음 그들이 나가서 문을 닫고 왕의 인장반지로 봉인한 뒤 떠났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘왕 앞에서만’은 재를 뿌리는 행위가 더 큰 무리 앞이 아니라 왕의 단독 현존 아래에서 이루어졌다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διόλου καὶ ἀνήλουν αὐτά
  english_pob_choice: and they consumed them completely
  chosen_korean: 그들은 그것들을 완전히 삼켜 버렸습니다
  alternatives_korean:
  - 그것들을 완전히 먹어 치웠습니다
  - 그것들을 모두 소비했습니다
  lexicon: LSJ
  rationale: 먹는 대상에 대한 완전 소진을 자연스럽게 드러내기 위해 ‘삼켜 버렸습니다’를 택했고, διόλου의 총체성을 ‘완전히’로 살렸습니다.
- source_word: παρέθηκεν τὰ βρώματα τῷ Βήλ
  english_pob_choice: set the food before Bel
  chosen_korean: 벨 앞에 음식을 차려 두었고
  alternatives_korean:
  - 벨 앞에 음식을 두었고
  - 벨 앞에 음식을 올려 두었고
  lexicon: LSJ
  rationale: 제의적 제시의 뉘앙스를 살리면서도 현대 한국어에서 자연스러운 표현으로 ‘차려 두다’를 사용했습니다.
- source_word: ἐπέταξεν Δανιὴλ τοῖς παιδαρίοις αὐτοῦ
  english_pob_choice: Daniel commanded his young servants
  chosen_korean: 다니엘은 자기의 젊은 종들에게 명령하여
  alternatives_korean:
  - 다니엘은 자기의 젊은 하인들에게 지시하여
  - 다니엘은 자기의 어린 종들에게 명령하여
  lexicon: LSJ
  rationale: παιδαρίοις는 단순한 ‘소년들’보다 수행 인력을 가리키는 면이 있어, 영어 POB의 ‘young servants’에 맞춰 ‘젊은 종들’로 옮겼습니다.
- source_word: ἐνώπιον τοῦ βασιλέως μόνου
  english_pob_choice: in the presence of the king alone
  chosen_korean: 왕 앞에서만
  alternatives_korean:
  - 왕만이 보는 앞에서
  - 오직 왕 앞에서
  lexicon: LSJ
  rationale: μόνου가 왕의 단독 현존을 강조하므로, 재를 뿌리는 행위가 다른 목격자 없이 이루어졌음을 간결하게 드러냈습니다.
- source_word: ἐσφραγίσαντο ἐν τῷ δακτυλίῳ τοῦ βασιλέως
  english_pob_choice: sealed it with the king’s signet ring
  chosen_korean: 왕의 인장반지로 봉인한 뒤
  alternatives_korean:
  - 왕의 반지로 봉인한 뒤
  - 왕의 도장반지로 봉인한 뒤
  lexicon: LSJ
  rationale: 문맥상 공식 봉인의 도구를 뜻하므로 ‘인장반지’가 기능을 분명히 합니다.
theological_decisions:
- issue: 재를 뿌린 행위의 목격 범위
  chosen_reading: ‘왕 앞에서만’으로 옮겨, 재를 뿌리는 행위가 공개 군중이 아니라 왕 단독 앞에서 이루어졌음을 드러냈습니다.
  alternative_readings:
  - ‘왕만이 보는 앞에서’
  - ‘오직 왕 앞에서’
  rationale: 본문의 μόνου는 단순한 장소 정보보다 증언 범위를 제한하는 효과가 있으므로, 그 강조점을 보존했습니다.
  doctrine_reference: 본문 주석적 뉘앙스 보존
