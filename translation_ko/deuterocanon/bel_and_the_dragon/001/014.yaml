review_pass:
  verdict: revise
  source_fidelity: 첫 문장의 ἀνήλουν은 제물로 놓인 음식을 ‘소비하다/먹어 치우다’라는 뜻이므로 ‘삼켜 버렸습니다’보다 ‘먹어 치웠습니다’가 문맥에 더 정확합니다. 또한 ἐπέταξεν 뒤의 복수 동사들은 다니엘의 종들이 재를 가져와 뿌린 일을 서술하므로, 이를 직접적인 연속 행위로 명시하는 편이 충실합니다. ἐνώπιον τοῦ βασιλέως μόνου의 ‘왕만 보는 앞에서’는 왕 외의 목격자가 없었음을 자연스럽고 명확하게 보존합니다.
  naturalness: ‘온 성전 위에’는 현대 한국어에서 다소 어색하므로 ‘성전 전체에’로 고쳤습니다. ‘젊은 종들’은 현대 한국어에서 부자연스럽고 신분제를 불필요하게 강하게 연상시킬 수 있어, παιδαρίοις의 연령 및 수행 역할을 함께 살린 ‘젊은 시종들’을 사용했습니다. 문장 연결도 합쇼체 서술에 맞게 정리했습니다.
  terminology: ‘벨’, ‘다니엘’, ‘성전’, ‘재’, ‘인장반지’, ‘봉인하다’는 적절합니다. ‘시종’은 여기서 παιδαρίοις의 수행·봉사 역할을 나타내며, 본문이 확정하지 않는 정확한 신분 관계는 과도하게 규정하지 않습니다.
