  source_fidelity: 수정이 필요합니다. 원문의 ἢ Δανιὴλ은 앞선 ‘죽을 것이다’가 생략된 대안 절로, 제사장들 또는 다니엘 가운데 한쪽이 죽는다는 뜻입니다. 초안의 ‘그렇지 않으면 … 다니엘입니다’는 이 술어를 빠뜨려 의미와 문장 구조가 성립하지 않습니다. 또한 Βήλ은 이 본문에서는 ‘벨’로 음역하는 것이 원문 고유명사와의 대응을 보존합니다.
  naturalness: ‘바알이 다 먹어 치운 것을 모두 찾지 못하면’은 수식 관계가 다소 불분명합니다. ‘모든 것이 벨에게 먹힌 것을 보지 못하면’으로 옮기면 완료 수동분사 βεβρωμένα의 결과 상태와 ὑπό의 행위자 표지를 자연스럽게 드러낼 수 있습니다. ‘그리고 아침에 와서’ 및 대안 절의 명시적 술어는 현대 표준어 합쇼체 문장으로 자연스럽습니다.
  terminology: σφράγισον은 ‘봉인하십시오’로 적절합니다. δακτυλίῳ는 문맥상 인장 기능을 하지만 원문이 별도로 ‘인장’을 명시하지 않으므로 ‘반지’로 유지합니다. Βήλ은 ‘벨’로 통일합니다. ψευδόμενος καθʼ ἡμῶν은 ‘우리를 거슬러 거짓말하는’으로 두어, 거짓 고발이라는 가능한 함의를 각주에서 제시하되 본문에 과도하게 법률 용어를 확정하지 않습니다.
