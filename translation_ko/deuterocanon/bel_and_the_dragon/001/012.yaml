  text: And seal it with your ring. Then[a], when you come in the morning, if you do not find everything eaten by Bel, we will die—or else Daniel, who is lying against us.
  footnotes:
  - marker: a
    text: Or, 'who is falsely accusing us.' The Greek phrase can carry the sense of lying against someone in an accusatory way.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 네 반지로 봉인하십시오. 그러면[a] 아침에 당신이 와서 보았을 때, 만일 바알이 다 먹어 치운 것을 모두 찾지 못하면, 우리는 죽을 것이요, 그렇지 않으면 우리를 향해 거짓말하는 다니엘입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리를 거짓으로 고발하는 다니엘’입니다. 그리스어 표현은 상대를 향해 거짓을 말한다는 뜻으로도 읽힙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σφράγισον τῷ δακτυλίῳ σου
  english_pob_choice: seal it with your ring
  chosen_korean: 네 반지로 봉인하십시오
  alternatives_korean:
  - 네 인장반지로 봉인하십시오
  - 네 반지로 봉인하여 잠그십시오
  lexicon: LSJ
  rationale: σφραγίζω의 핵심은 단순히 닫는 것이 아니라 봉인하는 것이므로 ‘봉인하다’를 택했고, τῷ δακτυλίῳ σου는 기능상 ‘반지’로 옮기되 문맥상 인장 역할을 드러내기 위해 ‘네 반지로’로 처리했습니다.
- source_word: ἐὰν μὴ εὕρῃς πάντα βεβρωμένα
  english_pob_choice: if you do not find everything eaten
  chosen_korean: 만일 … 모두 찾지 못하면
  alternatives_korean:
  - 만일 … 다 먹힌 것을 찾지 못하면
  - 만일 … 전부 먹어 치운 것을 보지 못하면
  lexicon: LSJ
  rationale: εὕρῃς는 ‘찾다/발견하다’의 뜻이고, βεβρωμένα는 이미 먹힌 상태를 가리키므로 한국어에서는 ‘모두 찾지 못하면’과 ‘다 먹어 치운 것’을 함께 살려 결과 상태를 자연스럽게 표현했습니다.
- source_word: ὑπὸ τοῦ Βήλ
  english_pob_choice: by Bel
  chosen_korean: 바알이
  alternatives_korean:
  - 벨이
  - 바알 신이
  lexicon: LSJ
  rationale: 본문의 고유명사는 Bel이지만, 한국어 독자에게는 바알이 더 널리 식별 가능하여 음역을 ‘바알’로 옮겼습니다. 다만 본문 인명 자체는 그리스어 표기와의 대응을 유지했습니다.
- source_word: ὁ ψευδόμενος καθʼ ἡμῶν
  english_pob_choice: who is lying against us
  chosen_korean: 우리를 향해 거짓말하는 다니엘
  alternatives_korean:
  - 우리를 거슬러 거짓말하는 다니엘
  - 우리에 대하여 거짓말하는 다니엘
  lexicon: LSJ
  rationale: ψεύδομαι + κατά는 단순한 ‘거짓말하다’보다 ‘~를 거슬러/향해 거짓말하다’의 대립적 뉘앙스를 가지므로, 한국어에서도 방향성을 살린 ‘우리를 향해 거짓말하는’으로 옮겼습니다.
theological_decisions:
- issue: 다니엘에 대한 진술의 성격
  chosen_reading: 본문의 결말을 ‘거짓말하는 다니엘’로 직접 옮겨, 인물 평가를 완화하지 않았습니다.
  alternative_readings:
  - ‘우리를 거짓으로 고발하는 다니엘’
  - ‘우리에게 거짓말하는 다니엘’
  rationale: 이 구절은 법정적·대결적 긴장을 의도적으로 드러내므로, 의미를 덜 날카롭게 만들 수 있는 ‘고발하다’로 고정하지 않고 원문의 공격적 진술을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.
