- from: 그리고 네 반지로 봉인하십시오. 그러면[a] 아침에 당신이 와서 보았을 때, 만일 바알이 다 먹어 치운 것을 모두 찾지 못하면, 우리는 죽을 것이요, 그렇지 않으면 우리를 향해 거짓말하는 다니엘입니다.
  to: 그리고 당신의 반지로 그것을 봉인하십시오. 그리고 아침에 와서, 모든 것이 벨에게 먹힌 것을 보지 못하면, 우리가 죽을 것입니다. 아니면 우리를 거슬러 거짓말하는 다니엘이[a] 죽을 것입니다.
  rationale: 생략된 ‘죽을 것이다’를 다니엘에 관한 대안 절에 보충하여 원문의 양자택일 구조를 회복했습니다. Βήλ은 ‘벨’로 음역하고, βεβρωμένα의 완료 수동 의미는 ‘모든 것이 … 먹힌 것’으로 명확히 했습니다. 각주는 ‘거짓말하는’ 표현에 직접 연결하되, 본문은 원문의 비난의 성격을 단정적으로 ‘고발’로 좁히지 않았습니다.
