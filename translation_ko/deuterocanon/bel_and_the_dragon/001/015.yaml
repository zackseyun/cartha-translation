lexical_decisions:
- source_word: οἱ δὲ
  english_pob_choice: But the
  chosen_korean: 그러나
  alternatives_korean:
  - 그리고
  - 또한
  lexicon: LSJ
  rationale: δέ는 서술의 전개를 이어 주면서 약한 대비를 보이므로, 한국어에서는 자연스러운 접속사 ‘그러나’로 옮겨 문맥의 전환을 살렸습니다.
- source_word: ἱερεῖς
