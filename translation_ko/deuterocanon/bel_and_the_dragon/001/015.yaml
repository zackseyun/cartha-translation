  - 성직자들
  lexicon: LSJ
  rationale: 성전 문맥의 ἱερεῖς는 한국어 성경에서 통상 ‘제사장들’로 옮기는 것이 가장 직접적이고 오해가 적습니다.
- source_word: τὴν νύκτα
  english_pob_choice: by night
  chosen_korean: 밤에
  alternatives_korean:
  - 한밤중에
  - 밤사이
  lexicon: LSJ
  rationale: 시간 부사구로서의 목적격을 한국어에서는 자연스럽게 ‘밤에’로 풀어 옮겼습니다.
- source_word: κατὰ τὸ ἔθος αὐτῶν
  english_pob_choice: according to their custom
  chosen_korean: 자기들의 관습대로
  alternatives_korean:
  - 그들의 관습에 따라
  - 늘 하던 대로
  lexicon: LSJ
  rationale: ἔθος의 반복적·관습적 의미를 살리면서도 한국어 문장 흐름에 맞게 ‘-대로’ 구조를 사용했습니다.
- source_word: αἱ γυναῖκες
  english_pob_choice: and the women
  chosen_korean: 여자들도
  alternatives_korean:
  - 여인들도
  - 아내들도
  lexicon: LSJ
  rationale: 이 구절의 헬라어는 women/wives 어느 쪽도 될 수 있으나, 본문 자체가 명시하지 않으므로 해석을 더하지 않기 위해 중립적인 ‘여자들’을 택했습니다.
