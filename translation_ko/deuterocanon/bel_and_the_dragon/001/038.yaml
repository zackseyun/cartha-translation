  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/038.yaml
  text: Take the meal that God has sent you. And Daniel said[a], “For you have remembered me, O God, and have not forsaken those who love you.”
  footnotes:
  - marker: a
    text: Or 'the best portion' or 'the choice food'; Greek τὸ ἄριστον can refer to excellent food or a principal meal.
    reason: lexical_alternative
translation:
  language: ko
  text: “하나님께서 네게 보내신 음식을 받아 먹으십시오.” 다니엘이 말했습니다.[a] “하나님, 주께서 저를 기억하셨습니다. 그리고 주를 사랑하는 이들을 버리지 않으셨습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘최고의 몫’, ‘좋은 음식’, ‘선택된 음식’으로도 옮길 수 있습니다. 그리스어 τὸ ἄριστον은 훌륭한 음식이나 주된 식사를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λάβε τὸ ἄριστον
  english_pob_choice: Take the meal
  chosen_korean: “하나님께서 네게 보내신 음식을 받아 먹으십시오.”
  alternatives_korean:
  - “하나님께서 네게 보내신 최고의 것을 받으십시오.”
  - “하나님께서 네게 보내신 좋은 몫을 받으십시오.”
  lexicon: LSJ
  rationale: ἄριστον은 문맥상 단순한 ‘최상급’보다 실제로 차려진 음식/식사를 가리킬 수 있으므로, 한국어에서는 ‘음식’과 ‘받아 먹으십시오’로 자연스럽게 풀어 의미를 드러냈습니다.
- source_word: ὁ θεός / ὁ θεός
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하나님께서
  - 주 하나님
  lexicon: 표준 한국어 성경 관용
  rationale: 본문의 주어와 호칭 모두 θεός이므로 한국어 성경 관용에 따라 ‘하나님’으로 일관되게 옮겼습니다.
- source_word: Ἐμνήσθης
  english_pob_choice: you have remembered
  chosen_korean: “하나님, 주께서 저를 기억하셨습니다.”
  alternatives_korean:
  - “하나님, 주께서 저를 기억하셨습니다.”
  - “하나님, 주께서 제 생각을 하셨습니다.”
  - “하나님, 주께서 저를 기억해 주셨습니다.”
  lexicon: BDAG
  rationale: 기도문/찬양문맥에서 μιμνῄσκομαι의 결과적 의미는 단순 과거보다 ‘기억하셨습니다’가 가장 직접적이며, 여기서는 ‘주께서’로 존칭 호칭을 살렸습니다.
- source_word: ἐγκατέλιπες
  english_pob_choice: have not forsaken
  chosen_korean: “그리고 주를 사랑하는 이들을 버리지 않으셨습니다.”
  alternatives_korean:
  - “그리고 주를 사랑하는 이들을 저버리지 않으셨습니다.”
  - “그리고 주를 사랑하는 이들을 떠나지 않으셨습니다.”
  lexicon: BDAG
  rationale: ἐγκαταλείπω의 강한 의미를 살려 단순한 ‘떠나다’보다 ‘버리다’/‘저버리다’가 더 적절하며, POB의 ‘forsaken’도 이 정서를 반영합니다.
theological_decisions:
- issue: τοὺς ἀγαπῶντάς의 목적어를 한국어에서 명시할지 여부
  chosen_reading: ‘주를 사랑하는 이들’로 명시했습니다.
  alternative_readings:
  - ‘사랑하는 이들’
  - ‘하나님을 사랑하는 이들’
  rationale: 다니엘이 직접 하나님께 말하고 있으므로, 한국어에서는 암시된 목적어를 분명히 해 ‘주를 사랑하는 이들’로 옮기는 것이 의미를 가장 선명하게 보존합니다.
  doctrine_reference: Translation philosophy §1, §3
