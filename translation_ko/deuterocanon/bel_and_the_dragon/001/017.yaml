  text: And he said[a], “Are the seals intact, Daniel?” And he said, “They are intact, O king.”
  footnotes:
  - marker: a
    text: Literally, 'Are the seals safe/sound, Daniel?... Safe/sound, O king.' The translation uses 'intact' because the context concerns whether the seals have remained undisturbed.
