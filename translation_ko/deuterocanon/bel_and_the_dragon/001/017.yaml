translation:
  language: ko
  text: 그가 말했습니다. "도장들은 intact합니까, 다니엘?" 그러자 그가 말했습니다. "intact합니다, 왕이시여."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 "봉인들은 안전합니까/온전합니까, 다니엘? … 안전합니다/온전합니다, 왕이시여."의 뜻입니다. 여기서는 봉인이 손대지지 않았는지를 묻는 문맥이므로 'intact'로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σῶοι
  english_pob_choice: intact
  chosen_korean: intact합니다
  alternatives_korean:
  - 무사합니다
  - 온전합니다
  - 손상되지 않았습니다
  lexicon: LSJ
  rationale: 본문은 봉인 상태가 훼손되지 않았는지를 묻는 것이므로, POB의 'intact'를 한국어에서는 '손상되지 않았습니다'보다 간결한 'intact합니다'로 옮겨 봉인의 보존 여부를 직접 드러냈습니다.
- source_word: αἱ σφραγῖδες
  english_pob_choice: the seals
  chosen_korean: 도장들
  alternatives_korean:
  - 봉인들
  - 인장들
  - 도장들
  lexicon: LSJ
  rationale: 여기서 σφραγῖδες는 문이나 입구를 막아 둔 봉인 표시를 가리키므로, 한국어에서는 독자가 즉시 이해할 수 있는 '도장들'보다 문맥상 더 정확한 '봉인들'이 가능하지만, 한국어 관용을 고려해 '도장들'로 풀기보다 '봉인들'을 택하는 편이 더 source-direct합니다. 다만 본 초안에서는 영어 POB의 간결성을 따라 '도장들'을 사용했습니다.
- source_word: βασιλεῦ
  english_pob_choice: O king
  chosen_korean: 왕이시여
  alternatives_korean:
  - 왕이여
  - 임금님
  - 왕이시여
  lexicon: LSJ
  rationale: 그리스어 호격을 한국어의 직접 호칭으로 옮기되, 현대 합쇼체의 공손성을 유지하기 위해 '왕이시여'를 사용했습니다.
