base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/042.yaml
  text: Daniel[a], and there is no other besides you. And he pulled him up. But he threw those responsible for his destruction into the pit[b], and they were devoured at once before him.
  footnotes:
  - marker: a
    text: The Greek opens abruptly with 'Daniel, and there is no other besides you,' likely continuing speech from the previous verse; some translations smooth this by adding words such as 'the king said.'
    reason: textual_variant
  - marker: b
    text: Or 'into the den.' The Greek word is literally 'pit,' though the context is the lions' pit.
    reason: lexical_alternative
translation:
  language: ko
  text: 다니엘아, 당신 말고는 다른 이가 없습니다. 그가 그를 끌어올렸습니다. 그러나 그는 그의 멸망에 책임이 있는 자들을 굴에 던졌고, 그들은 곧바로 그의 앞에서 먹혀 버렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘다니엘, 그리고 당신 말고는 다른 이가 없습니다’로 갑자기 시작하며, 이전 절의 발화가 이어지는 것으로 보입니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘구덩이’. 그리스어 낱말은 문자적으로 ‘굴/구덩이’를 뜻하지만, 문맥은 사자굴입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔστιν πλὴν σοῦ ἄλλος
  english_pob_choice: there is no other besides you
  chosen_korean: 당신 말고는 다른 이가 없습니다
  alternatives_korean:
  - 당신 외에는 아무도 없습니다
  - 당신 말고 다른 이는 없습니다
  lexicon: LSJ
  rationale: πλὴν σοῦ ἄλλος의 배타성을 자연스러운 현대 한국어로 살리되, 과도한 의역 없이 ‘다른 이가 없습니다’로 압축했습니다.
- source_word: ἀνέσπασεν
  english_pob_choice: pulled him up
  chosen_korean: 그를 끌어올렸습니다
  alternatives_korean:
  - 그를 끌어냈습니다
  - 그를 들어 올렸습니다
  lexicon: LSJ
  rationale: 아래에서 위로 당겨 올리는 동작을 드러내기 위해 ‘끌어올렸습니다’를 택했습니다.
- source_word: τοὺς ... αἰτίους τῆς ἀπωλείας αὐτοῦ
  english_pob_choice: those responsible for his destruction
  chosen_korean: 그의 멸망에 책임이 있는 자들
  alternatives_korean:
  - 그를 멸망시키는 데 책임이 있는 자들
  - 그를 파멸시킨 자들
  lexicon: LSJ
  rationale: αἴτιος의 책임/원인 의미를 반영하여, 결과를 과장하지 않으면서도 유죄성을 드러내는 표현으로 옮겼습니다.
- source_word: ἐνέβαλεν εἰς τὸν λάκκον
  english_pob_choice: threw ... into the pit
  chosen_korean: 굴에 던졌고
  alternatives_korean:
  - 구덩이에 던졌고
  - 구덩이 속에 던졌고
  lexicon: LSJ
  rationale: λάκκος의 직역인 ‘구덩이/굴’ 가운데, 문맥상 사자굴을 떠올리게 하는 한국어 ‘굴’이 가장 자연스럽습니다. 영어 POB의 ‘pit’ 대비를 유지하되 전통적 용례를 과도하게 굳히지 않았습니다.
theological_decisions:
- issue: 서두의 갑작스러운 호격과 생략된 서술어
  chosen_reading: ‘다니엘아’로 직접 호격을 살리고, 본문에 없는 ‘말했다’류의 서술어는 보충하지 않았습니다.
  alternative_readings:
  - ‘다니엘이라고 말했습니다’처럼 매끈하게 보완하는 번역
  - 문맥을 따라 화자를 명시하는 번역
  rationale: 그리스어가 이전 발화의 연속처럼 갑자기 시작하므로, 원문이 가진 단절감을 보존하는 것이 주석적으로 더 정직합니다.
  doctrine_reference: 원문 우선주의와 번역 전통의 매끈한 보완 사이의 긴장 보존
- issue: κατεβρώθησαν의 강한 파괴/포식 이미지
  chosen_reading: ‘먹혀 버렸습니다’로 옮겨, 단순한 처벌이 아니라 사자에 의한 즉각적 포식을 드러냈습니다.
  alternative_readings:
  - ‘삼켜졌습니다’
  - ‘잡아먹혔습니다’
  rationale: 동사 자체의 수동적 포식 의미를 살리되, 한국어에서 가장 직접적이고 서사적인 표현을 택했습니다.
  doctrine_reference: 문자적 포식 묘사의 보존
