  - 거대한
  lexicon: LSJ
  rationale: 여기서 μέγας는 크기와 위상을 함께 담을 수 있지만, 대상이 생물인 점을 살려 ‘큰’으로 옮기면 과장 없이 자연스럽습니다.
- source_word: ἐσέβοντο
  english_pob_choice: worshiped
  chosen_korean: 숭배했습니다
  alternatives_korean:
  - 경배했습니다
  - 존경했습니다
  - 공경했습니다
  lexicon: BDAG
  rationale: σέβομαι 계열은 단순한 존중보다 종교적 경외를 뜻할 수 있으므로, 우상적 대상에 대한 행위를 분명히 드러내는 ‘숭배했습니다’가 가장 적절합니다.
- source_word: οἱ Βαβυλώνιοι
  english_pob_choice: the Babylonians
  chosen_korean: 바빌로니아 사람들
  alternatives_korean:
  - 바빌로니아인들
  - 바빌론 사람들
  lexicon: LSJ
  rationale: 민족/집단 명칭이므로 ‘바빌로니아 사람들’이 현대 한국어에서 자연스럽고, 고유지명 ‘바빌론’과 혼동도 줄입니다.
theological_decisions:
- issue: dragon에 대한 서술을 신화적 존재인지 상징인지로 좁힐지 여부
  chosen_reading: 본문의 표면적 서술을 따라 ‘용’으로 옮기고, 의미 해석은 열어 둡니다.
  alternative_readings:
  - 큰 뱀으로 완화해 번역하기
  - 상징적 존재로 주석적으로 재해석하기
  rationale: 그리스어 본문은 이 존재를 실제 숭배 대상처럼 제시하며, 번역이 그 긴장을 미리 해소하면 서술의 힘이 약해집니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; optimal equivalence'
