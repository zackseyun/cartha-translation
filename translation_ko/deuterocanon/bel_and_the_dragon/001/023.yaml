  text: 그리고 큰 용이 있었는데, 바빌로니아 사람들은 그것을 숭배했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경외했습니다’, ‘존숭했습니다’; 그리스어 동사는 종교적 경외를 뜻할 수 있으며, 여기서는 제의적 숭배를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δράκων
  english_pob_choice: dragon
  chosen_korean: 용
  alternatives_korean:
  - 큰 뱀
  - 뱀
  lexicon: LSJ
  rationale: 그리스어 δράκων은 큰 뱀이나 용을 가리킬 수 있지만, 이 이야기 문맥에서는 영어 POB의 dragon에 맞춰 한국어의 자연스러운 대응인 ‘용’이 가장 직접적입니다.
- source_word: μέγας
  english_pob_choice: great
  chosen_korean: 큰
  alternatives_korean:
