  - 왕에게 대항하여 모여들고
  lexicon: BDAG
  rationale: 동사의 집단적 결집과 ἐπί의 적대 방향성을 함께 살리기 위해 '대적해 모여들다'로 옮겼습니다.
- source_word: Ἰουδαῖος γέγονεν ὁ βασιλεύς
  english_pob_choice: The king has become a Jew
  chosen_korean: 왕이 유대인이 되었다
  alternatives_korean:
  - 왕이 유다 사람이 되었다
  - 왕이 유대인으로 변했다
  lexicon: BDAG
  rationale: Ἰουδαῖος의 기본값을 '유대인'으로 두되, 원문의 조롱 섞인 선언을 살리기 위해 평서형으로 유지했습니다.
- source_word: τὸν Βὴλ κατέσπασεν
  english_pob_choice: he has torn down Bel
  chosen_korean: 벨을 무너뜨리고
  alternatives_korean:
