  - 이렇게 되어 그들이 듣자
  lexicon: BDAG
  rationale: 서사 전환의 관용구를 한국어의 자연스러운 결과절로 옮기되, 원문의 전개감과 즉시성을 과장하지 않도록 했습니다.
- source_word: οἱ Βαβυλώνιοι
  english_pob_choice: the Babylonians
  chosen_korean: 바빌로니아 사람들이
  alternatives_korean:
  - 바빌론 사람들이
  - 바빌로니아인들이
  lexicon: BDAG
  rationale: 민족·도시 집단을 가리키는 말로서, 현대 한국어에서는 '바빌로니아 사람들'이 가장 자연스럽고 직설적인 대응입니다.
- source_word: ἠγανάκτησαν
  english_pob_choice: became indignant
  chosen_korean: 분개하여
  alternatives_korean:
  - 격분하여
  - 노하여
  lexicon: BDAG
  rationale: 단순한 분노보다 강한 불쾌와 반발의 뉘앙스를 살리기 위해 '분개하다'를 택했습니다.
- source_word: συνεστράφησαν ἐπὶ τὸν βασιλέα
  english_pob_choice: gathered together against the king
  chosen_korean: 왕을 대적해 모여들고
  alternatives_korean:
  - 왕에게 맞서 모이고
  - 왕에게 대항하여 모여들고
  lexicon: BDAG
  rationale: 동사의 집단적 결집과 ἐπί의 적대 방향성을 함께 살리기 위해 '대적해 모여들다'로 옮겼습니다.
- source_word: Ἰουδαῖος γέγονεν ὁ βασιλεύς
  english_pob_choice: The king has become a Jew
  chosen_korean: 왕이 유대인이 되었다
  alternatives_korean:
  - 왕이 유다 사람이 되었다
  - 왕이 유대인으로 변했다
  lexicon: BDAG
  rationale: Ἰουδαῖος의 기본값을 '유대인'으로 두되, 원문의 조롱 섞인 선언을 살리기 위해 평서형으로 유지했습니다.
- source_word: τὸν Βὴλ κατέσπασεν
  english_pob_choice: he has torn down Bel
  chosen_korean: 벨을 무너뜨리고
  alternatives_korean:
  - 벨을 허물고
  - 벨을 끌어내리고
  lexicon: BDAG
  rationale: κατασπάω의 '끌어내리다/무너뜨리다' 의미를 한국어에서 우상 파괴 맥락에 맞게 '무너뜨리다'로 자연스럽게 풀었습니다.
- source_word: τὸν δράκοντα ἀπέκτεινεν
  english_pob_choice: killed the dragon
  chosen_korean: 용을 죽였으며
  alternatives_korean:
  - 드래곤을 죽였으며
  - 뱀을 죽였으며
  lexicon: BDAG
  rationale: 본문의 δράκων을 한국어 성경 어휘로는 '용'이 가장 직접적이며, 신화적 존재를 자연스럽게 드러냅니다.
- source_word: τοὺς ἱερεῖς κατέσφαξεν
  english_pob_choice: slaughtered the priests
  chosen_korean: 제사장들을 학살했다
  alternatives_korean:
  - 제사장들을 도륙했다
  - 제사장들을 죽였다
  lexicon: BDAG
  rationale: κατασφάζω의 매우 강한 폭력성을 일반적 '죽이다'보다 강한 '학살하다'로 반영했습니다.
