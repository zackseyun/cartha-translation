base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/028.yaml
  text: And it happened that when the Babylonians heard[a], they became indignant and gathered together against the king and said, “The king has become a Jew; he has torn down Bel and killed the dragon and slaughtered the priests.”
  footnotes:
  - marker: a
    text: Or “The king has become a Judean.” The Greek Ἰουδαῖος can denote either ethnic-religious identity (“Jew”) or geographic-political identity (“Judean”).
    reason: lexical_alternative
translation:
  language: ko
  text: 바빌로니아 사람들이 그 소식을 듣고 분개하여 왕에게 맞서 함께 모여 말했습니다. “왕이 유대인[a]이 되었다. 그가 벨을 무너뜨리고 용을 죽였으며, 제사장들을 학살했다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ἰουδαῖος는 ‘유대인’ 또는 ‘유다 사람(유대 지방 사람)’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐγένετο ὡς ἤκουσαν
  english_pob_choice: And it happened that when ... heard
  chosen_korean: 그들이 이 말을 듣자
  alternatives_korean:
