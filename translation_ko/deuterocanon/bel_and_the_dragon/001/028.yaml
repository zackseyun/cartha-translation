  - 뱀을 죽였으며
  lexicon: BDAG
  rationale: 본문의 δράκων을 한국어 성경 어휘로는 '용'이 가장 직접적이며, 신화적 존재를 자연스럽게 드러냅니다.
- source_word: τοὺς ἱερεῖς κατέσφαξεν
  english_pob_choice: slaughtered the priests
  chosen_korean: 제사장들을 학살했다
  alternatives_korean:
