  - 포도주 여섯 메트레타이
  lexicon: LSJ
  rationale: μετρηταί는 액체의 도량형이므로, 현대 독자가 분량을 바로 이해할 수 있게 ‘여섯 되’로 옮기되 원문의 수량성을 살렸습니다.
- source_word: ἐσέβετο αὐτόν
