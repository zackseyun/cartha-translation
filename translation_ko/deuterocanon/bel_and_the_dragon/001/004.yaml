translation:
  language: ko
  text: 그리고 양 떼 사십과 포도주 여섯 되였습니다. 왕은 그를 공경하였고 매일 그에게 절하러 가곤 하였으나, 다니엘은 자기의 하나님께 절하였습니다. 왕이 그에게 말하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘절하다’는 여기서 προσκυνέω의 물리적 몸짓을 살린 번역이며, 문맥에 따라 ‘경배하다’의 의미도 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρόβατα τεσσεράκοντα
  english_pob_choice: forty sheep
  chosen_korean: 양 떼 사십
  alternatives_korean:
