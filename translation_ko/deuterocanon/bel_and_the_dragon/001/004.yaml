  - 포도주 여섯 메트레타이
  lexicon: LSJ
  rationale: μετρηταί는 액체의 도량형이므로, 현대 독자가 분량을 바로 이해할 수 있게 ‘여섯 되’로 옮기되 원문의 수량성을 살렸습니다.
- source_word: ἐσέβετο αὐτόν
  english_pob_choice: revered him
  chosen_korean: 그를 공경하였고
  alternatives_korean:
  - 그를 경외하였고
  - 그를 숭배하였고
  lexicon: LSJ
  rationale: σέβομαι는 경외/공경의 의미를 가질 수 있으므로, 뒤의 προσκυνέω와 구별되도록 ‘공경하다’로 옮겼습니다.
- source_word: προσκυνεῖν αὐτῷ / προσεκύνει τῷ θεῷ αὐτοῦ
  english_pob_choice: to bow down to him / bowed down to his God
  chosen_korean: 그에게 절하러 가곤 하였으나 / 자기의 하나님께 절하였습니다
  alternatives_korean:
  - 그를 경배하러 가곤 하였으나 / 자기의 하나님께 경배하였습니다
  - 그 앞에 엎드리러 가곤 하였으나 / 자기의 하나님께 엎드렸습니다
  lexicon: LSJ
  rationale: προσκυνέω는 문맥상 물리적 ‘절하다’와 예배적 의미를 함께 가질 수 있어, 왕은 벨에게, 다니엘은 하나님께 하는 행위를 같은 동사군으로 대응시키되 한국어에서는 ‘절하다’로 통일해 대조를 보존했습니다.
- source_word: ὁ βασιλεὺς
  english_pob_choice: the king
  chosen_korean: 왕
  alternatives_korean:
  - 그 왕
  - 그 임금
  lexicon: LSJ
  rationale: 기본 호칭은 단순히 ‘왕’이 가장 직접적이며, 반복되는 서술 흐름에도 자연스럽습니다.
theological_decisions:
- issue: προσκυνέω를 우상과 하나님 모두에 어떻게 처리할지
  chosen_reading: 둘 다 ‘절하다’로 옮기되, 앞에서는 벨에게 가는 왕의 행위, 뒤에서는 다니엘의 하나님께 드리는 행위로 대조를 유지했습니다.
  alternative_readings:
  - 왕은 ‘경배하다’, 다니엘은 ‘절하다’로 구분
  - 둘 다 ‘숭배하다’로 통일
  rationale: 원문은 같은 동사 계열을 반복하여 왕의 우상 숭배와 다니엘의 참된 예배를 문학적으로 대비합니다. 한국어에서도 같은 동작어를 써서 대조를 보존하는 편이 원문 효과를 더 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.'
