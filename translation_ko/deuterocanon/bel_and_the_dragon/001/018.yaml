  to: 그리고 이런 일이 있었습니다. 문들이 열리자 왕이 탁자를 보고 큰소리로 외쳤습니다. 「벨이시여, 당신은 위대하십니다. 당신에게는 속임수가 없습니다.」
  rationale: 서사 전환을 ‘그리고 이런 일이 있었습니다’로 보완하여 καὶ ἐγένετο를 보존했습니다. 나머지 본문은 원문의 시간 관계, 왕의 시선, 큰소리의 외침, 벨을 향한 직접 발화와 ‘속임수 없음’의 진술을 충실히 유지했습니다. 인용부호 안의 문장부호만 한국어 관례에 맞게 정리했습니다.
