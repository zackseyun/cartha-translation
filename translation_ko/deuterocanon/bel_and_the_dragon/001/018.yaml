  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/018.yaml
  text: And it happened, when the doors were opened, that the king looked at the table and cried out with a loud voice, “Great are you, Bel, and there is no deceit with you.”
translation:
  language: ko
  text: 그리고 이런 일이 있었습니다. 문들이 열리자 왕이 탁자를 보고 큰소리로 외쳤습니다. 「벨이시여, 당신은 위대하십니다. 당신에게는 속임수가 없습니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἐγένετο
  english_pob_choice: And it happened
  chosen_korean: 그리고 … 외쳤습니다
  alternatives_korean:
  - 그리고 … 있었습니다
  - 그때 … 되었습니다
  lexicon: BDAG
  rationale: 서사 전환 공식은 한국어의 자연스러운 연결어로 옮기되, 문맥상 핵심 사건인 발화에 초점을 두어 간결하게 처리했습니다.
- source_word: ἅμα τῷ ἀνοῖξαι τὰς θύρας
  english_pob_choice: when the doors were opened
  chosen_korean: 문들이 열리자
  alternatives_korean:
  - 문들이 열렸을 때
  - 문들이 열리는 즉시
  lexicon: BDAG
  rationale: ἅμα τῷ ἀνοῖξαι의 동시적·즉각적 관계를 한국어의 결과형 표현으로 자연스럽게 살렸습니다.
- source_word: ἐπιβλέψας ὁ βασιλεὺς ἐπὶ τὴν τράπεζαν
  english_pob_choice: the king looked at the table
  chosen_korean: 왕이 탁자를 보고
  alternatives_korean:
  - 왕이 탁자를 바라보고
  - 왕이 탁자를 살펴보고
  lexicon: BDAG
  rationale: ἐπιβλέψας는 단순한 시선 행위이므로 과도한 해석 없이 기본 의미를 유지했습니다. τράπεζαν은 제물 탁자라는 배경이 있더라도 본문 자체의 ‘탁자’로 옮겼습니다.
- source_word: ἐβόησεν φωνῇ μεγάλῃ
  english_pob_choice: cried out with a loud voice
  chosen_korean: 큰소리로 외쳤습니다
  alternatives_korean:
  - 큰 음성으로 외쳤습니다
  - 큰소리로 부르짖었습니다
  lexicon: BDAG
  rationale: 동사와 수단구의 중복 효과를 한국어에서 자연스럽게 한 번의 관용 표현으로 처리하되, 소리의 크기와 격렬함은 유지했습니다.
- source_word: Μέγας εἶ, Βήλ
  english_pob_choice: Great are you, Bel
  chosen_korean: 「벨이시여, 당신은 위대하십니다」
  alternatives_korean:
  - 「벨, 당신은 위대하십니다」
  - 「위대하십니다, 벨이시여」
  lexicon: BDAG
  rationale: 헬라어의 직접 호격과 감탄 어순을 한국어 화법에 맞게 옮기면서도, 왕의 직접 발화라는 극적 효과를 살렸습니다.
- source_word: οὐκ ἔστιν παρὰ σοὶ δόλος
  english_pob_choice: there is no deceit with you
  chosen_korean: 당신에게는 속임수가 없습니다
  alternatives_korean:
  - 당신 안에는 속임수가 없습니다
  - 당신 곁에는 속임수가 없습니다
  lexicon: BDAG
  rationale: δόλος는 ‘속임수/사기/간계’의 뜻이 있으나, 여기서는 문맥상 간명한 ‘속임수’가 가장 직접적입니다. παρὰ σοὶ는 한국어에서 자연스럽게 주어의 소유·부재를 나타내는 ‘-에게는’으로 옮겼습니다.
theological_decisions:
- issue: 왕의 찬사에 대한 서술자의 신학적 개입 여부
  chosen_reading: 본문을 왕의 직접 발화로만 옮기고, 서술자가 이를 바로잡거나 풍자적으로 설명하지 않았습니다.
  alternative_readings:
  - 왕의 착오를 암시하는 해설적 번역
  - 예배적 찬양처럼 완화한 번역
  rationale: 그리스어는 왕의 실제 발언을 그대로 제시하므로, 독자가 뒤의 반전을 스스로 읽도록 긴장을 보존했습니다.
  doctrine_reference: 본문의 아이러니와 서사적 긴장 보존
