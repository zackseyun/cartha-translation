  source_fidelity: 원문의 완료형 οὐχ ἑώρακα는 ‘본 적이 없다’로, 현재형 οὐ γινώσκω는 ‘모릅니다’로 옮기는 것이 각각의 시제와 의미를 자연스럽게 보존합니다. λάκκος는 특정한 ‘사자굴’이 아니라 일반적인 구덩이·굴·저수조류의 장소를 뜻하므로 본문에서는 ‘구덩이’를 유지해야 합니다.
  naturalness: 초안의 ‘보지 못했고, ... 알지 못합니다’는 시제가 다소 어색하게 교차합니다. ‘본 적이 없고 ... 모릅니다’는 현대 표준어 합쇼체로 자연스럽고 원문의 대조되는 완료/현재 형태도 잘 드러냅니다.
  terminology: ‘하박국’, ‘주님’, ‘바빌론’, ‘구덩이’는 모두 적절합니다. 각주 대안의 ‘사자굴’은 원문의 일반성을 과도하게 특정하므로 ‘굴’로 고쳐야 하며, ‘cistern’에는 ‘물웅덩이’보다 ‘저수조’가 더 정확합니다.
  issues:
