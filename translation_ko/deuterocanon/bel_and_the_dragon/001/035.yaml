  text: 그리고 하박국이 말했습니다. “주님, 저는 바빌론을 보지 못했고, 그 구덩이도 알지 못합니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 사자굴” 혹은 “그 물웅덩이”; 여기의 그리스어는 구덩이처럼 파인 곳을 가리키는 일반어이며, 여기서는 다니엘이 갇힌 장소를 뜻합니다.
    reason: lexical_alternative
