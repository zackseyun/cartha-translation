lexical_decisions:
- source_word: ΚΑΙ
  english_pob_choice: And
  chosen_korean: 그리고
  alternatives_korean:
  - 또
  - 이제
  lexicon: LSJ
  rationale: 서사의 단순한 접속을 가장 자연스럽게 살리면서, 원문에 없는 시간적 뉘앙스를 덧붙이지 않기 위해 ‘그리고’를 택했습니다.
- source_word: ὁ βασιλεὺς Ἀστυάγης
  english_pob_choice: King Astyages
  chosen_korean: 아스티아게스 왕
  alternatives_korean:
  - 아스티아게스 임금
  - 왕 아스티아게스
  lexicon: 고유명사 표기 관례
  rationale: 고유명사는 현대 외래어 표기법에 따라 음역하고, 지위 명칭은 이름 뒤에 두어 한국어 문장 흐름을 자연스럽게 했습니다.
- source_word: προσετέθη πρὸς τοὺς πατέρας αὐτοῦ
  english_pob_choice: was gathered to his fathers
  chosen_korean: 그의 조상들에게로 돌아갔습니다
  alternatives_korean:
  - 그의 조상들에게 더해졌습니다
  - 그의 조상들에게로 모여들었습니다
  - 죽었습니다
  lexicon: LSJ
  rationale: 직역하면 ‘더해지다’이지만, 문맥상 죽음을 뜻하는 성경적 관용구이므로 의미를 드러내되 이미지가 남는 표현으로 옮겼습니다.
theological_decisions:
- issue: 죽음 관용구 προσετέθη πρὸς τοὺς πατέρας αὐτοῦ의 처리
  chosen_reading: 직설적 ‘죽었습니다’로 풀지 않고, ‘조상들에게로 돌아갔습니다’로 관용구의 사후 귀속 이미지를 살렸습니다.
  alternative_readings:
  - 죽었습니다
  - 그의 조상들에게 더해졌습니다
  rationale: 원문의 문학적·성경적 표현을 보존하면서도 한국어 독자가 의미를 이해할 수 있게 하기 위함입니다.
  doctrine_reference: 'DOCTRINE.md: 의미를 평탄화하기보다 원문의 이미지와 긴장을 보존합니다.'
