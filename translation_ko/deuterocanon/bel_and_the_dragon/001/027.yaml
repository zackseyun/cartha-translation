  rationale: 원문은 ‘숭배의 대상’이라는 의미를 직접 말할 뿐, 가장 강한 비난어를 의무적으로 쓰지는 않으므로, 이야기의 아이러니가 스스로 드러나도록 했습니다.
  doctrine_reference: 원어 우선 번역 원칙; 해석을 본문보다 앞세우지 않음.
