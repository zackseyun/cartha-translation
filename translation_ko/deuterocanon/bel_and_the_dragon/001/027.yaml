  - 너희가 공경하는 것들
  - 너희 우상들
  lexicon: LSJ
  rationale: σεβάσματα는 ‘숭배/공경의 대상들’이라는 중성적 어감을 가지므로, 본문의 조롱 섞인 문맥을 유지하면서도 해석을 과도하게 좁히지 않는 표현으로 옮겼습니다.
