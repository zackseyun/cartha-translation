  - 끓여 섞어
  lexicon: LSJ
  rationale: ἕψω는 ‘삶다/끓이다’의 의미이고 ἐπὶ τὸ αὐτό는 한데 합쳐졌음을 보이므로, 동작과 결합의 뉘앙스를 함께 살린 표현을 선택했습니다.
- source_word: τὰ σεβάσματα ὑμῶν
  english_pob_choice: your objects of worship
  chosen_korean: 너희가 숭배하는 것들
  alternatives_korean:
  - 너희의 신성한 것들
  - 너희가 공경하는 것들
  - 너희 우상들
  lexicon: LSJ
  rationale: σεβάσματα는 ‘숭배/공경의 대상들’이라는 중성적 어감을 가지므로, 본문의 조롱 섞인 문맥을 유지하면서도 해석을 과도하게 좁히지 않는 표현으로 옮겼습니다.
