  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/027.yaml
  text: And Daniel took pitch and fat and hair[a], and boiled them together and made cakes, and put them into the dragon’s mouth; and when the dragon had eaten them, it burst apart. And he said, “See your objects of worship.”
  footnotes:
  - marker: a
    text: Or “your sacred things” or “the things you revere”; the Greek refers to objects held in reverence or worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 다니엘이 역청과 기름과 털[a]을 가져다가 함께 삶아 반죽을 만들어 용의 입에 넣었습니다. 용이 그것을 먹고 나서 산산이 부서졌습니다. 그리고 그가 말하였습니다. 「너희가 숭배하는 것들을 보십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “숭배하는 것들”, “공경하는 것들”. 그리스어는 reverence나 worship의 대상이 되는 것들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίσσαν
  english_pob_choice: pitch
  chosen_korean: 역청
  alternatives_korean:
  - 피치
  - 타르
  lexicon: LSJ
  rationale: πίσσα는 끈적한 수지성 물질을 가리키므로, 한국어 성경 문맥에서 자연스럽고 원어 감각을 살리는 ‘역청’을 택했습니다.
- source_word: στῖρ
