review_pass:
  verdict: revise
  source_fidelity: 원문의 ἐπείγουσιν αὐτὸν σφόδρα는 그들이 왕에게 매우 강한 압력을 가한다는 뜻이며, ‘압박하는’이 ‘재촉하는’보다 이 강압적 의미를 더 직접적으로 보존합니다. ἀναγκασθείς의 수동적 강제성도 ‘강요받아’로 자연스럽고 분명하게 드러납니다. ‘다니엘을 그들에게 넘겨주었습니다’는 παρέδωκεν αὐτοῖς를 충실히 옮깁니다.
  naturalness: 초안의 ‘자기에게 매우 강하게 재촉하는 것’은 현대 표준어에서 다소 어색하며, ‘재촉하다’는 서두르게 한다는 뜻으로도 흔히 이해될 수 있습니다. ‘자신을 몹시 압박하는 것을 보고, 강요받아’가 문맥과 합쇼체 문체에 더 자연스럽습니다.
  terminology: 인명 ‘다니엘’은 표준 표기와 일치합니다. ‘압박하다’, ‘강요받다’, ‘넘겨주다’는 각각 강한 압력, 외부적 강제, 상대방의 권한 아래로 넘김이라는 원문의 의미를 과장 없이 반영합니다.
  issues:
  - severity: medium
    issue: ‘재촉하는’은 ἐπείγουσιν의 강한 압박 의미를 충분히 명시하지 못하고, 서두르게 한다는 의미로 좁게 들릴 수 있습니다.
    rationale: 문맥상 왕에게 가해지는 지속적·강한 압력이며, ‘압박하는’이 이를 더 정확하고 자연스럽게 전달합니다.
  - severity: low
    issue: ‘강요되어’는 문법적으로 가능하나, 사람인 왕이 외부 압력을 받아 행동한다는 수동 의미에는 ‘강요받아’가 더 자연스럽습니다.
    rationale: ἀναγκασθείς는 왕이 외부 압력으로 인해 행동하게 되었음을 나타내므로, 수혜적 수동 표현이 한국어에서 더 명료합니다.
  revised_text: 왕은 그들이 자신을 몹시 압박하는 것을 보고, 강요받아 다니엘을 그들에게 넘겨주었습니다.
