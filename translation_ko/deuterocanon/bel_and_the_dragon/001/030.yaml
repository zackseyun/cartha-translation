  text: And the king saw that they were pressing him very hard, and being compelled, he handed Daniel over to them.
translation:
  language: ko
  text: 왕은 그들이 자신을 몹시 압박하는 것을 보고, 강요받아 다니엘을 그들에게 넘겨주었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπείγουσιν
  english_pob_choice: were pressing him
  chosen_korean: 재촉하는
  alternatives_korean:
  - 강하게 요구하는
  - 압박하는
  - 간청하는
  lexicon: BDAG
  rationale: 지속적이고 강한 압력을 나타내는 동사로, 단순한 요청보다 거센 압박을 드러내는 ‘재촉하다’가 문맥에 맞습니다.
- source_word: σφόδρα
  english_pob_choice: very hard
  chosen_korean: 매우 강하게
  alternatives_korean:
  - 몹시
  - 극도로
  - 아주 심하게
  lexicon: LSJ
  rationale: 앞 동사의 강도를 더하는 부사이므로, 압박의 세기를 자연스럽게 살리는 표현으로 옮겼습니다.
- source_word: ἀναγκασθείς
  english_pob_choice: being compelled
  chosen_korean: 강요되어
  alternatives_korean:
  - 억지로
  - 강제로
  - 압도되어
  lexicon: BDAG
  rationale: 외부 압력에 의해 행동하게 되는 수동적 뉘앙스를 살리기 위해 ‘강요되어’로 옮겼습니다.
- source_word: παρέδωκεν αὐτοῖς τὸν Δανιήλ
  english_pob_choice: he handed Daniel over to them
  chosen_korean: 다니엘을 그들에게 넘겨주었습니다
  alternatives_korean:
  - 다니엘을 그들에게 넘겼습니다
  - 다니엘을 그들의 손에 넘겨주었습니다
  - 다니엘을 그들에게 인도했습니다
  lexicon: BDAG
  rationale: 단순 전달이 아니라 상대편의 처분 아래로 넘기는 의미를 살려 ‘넘겨주다’로 옮겼습니다.
theological_decisions:
- issue: 왕의 행동을 둘러싼 강제성의 정도
  chosen_reading: 왕은 자발적으로 결정한 것이 아니라, 매우 강한 사회적·정치적 압력 아래서 다니엘을 넘겨주었습니다.
  alternative_readings:
  - 그저 설득된 것입니다
  - 물리적으로 강제된 것입니다
  rationale: 본문의 ἐπείγουσιν ... σφόδρα와 ἀναγκασθείς는 강한 압박이 누적되어 compelled action에 이르는 상황을 보여 주므로, 원문이 말하는 범위를 넘기지 않으면서도 압박의 강도를 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
