  lexicon: BDAG
  rationale: 완료된 과거 행위를 배경 이유로 제시하므로, ‘만들어 놓았으므로’가 pluperfect의 선행성을 잘 드러냅니다.
- source_word: κεκρυμμένην εἴσοδον
  english_pob_choice: a hidden entrance
  chosen_korean: 숨겨진 입구
  alternatives_korean:
  - 은밀한 출입구
