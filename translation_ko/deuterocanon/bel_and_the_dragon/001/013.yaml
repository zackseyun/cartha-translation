  lexicon: BDAG
  rationale: 형용사와 명사의 결합을 가장 सीधे하게 반영하면서도 한국어에서 자연스러운 표현인 ‘숨겨진 입구’를 택했습니다.
- source_word: διʼ αὐτῆς εἰσεπορεύοντο
  english_pob_choice: through it they would go in
  chosen_korean: 그 입구를 통해 드나들었습니다
  alternatives_korean:
  - 그것을 통해 들어갔습니다
