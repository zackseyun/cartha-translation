  lexicon: BDAG
  rationale: 문맥상 사람을 향한 노골적 ‘경멸’보다 들키지 않을 것이라는 자신감에서 비롯된 가벼운 취급이므로, POB의 ‘were unconcerned’를 자연스럽게 받는 ‘얕보며’로 옮겼습니다.
- source_word: πεποιήκεσαν
