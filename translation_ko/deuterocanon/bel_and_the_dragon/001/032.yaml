  text: Now there were seven lions in the pit[a], and each day they were given two bodies and two sheep; but then nothing was given to them, so that they might devour Daniel.
  footnotes:
  - marker: a
    text: Or 'two carcasses' or 'two corpses' for 'two bodies'; the Greek says 'bodies' (σώματα), and the context suggests food for the lions.
