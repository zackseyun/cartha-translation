translation:
  language: ko
  text: 그 구덩이에는 사자가 일곱 마리 있었고, 매일 그들에게 시신 두 구[a]와 양 두 마리가 주어졌습니다. 그러나 그때에는 그들에게 아무것도 주어지지 않았습니다. 사자들이 다니엘을 집어삼키도록 하기 위해서였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 σώματα는 문자적으로 ‘몸들’을 뜻합니다. 여기서는 사자들에게 주는 먹이라는 문맥 때문에 ‘시신’으로 옮겼습니다. ‘몸들’ 또는 ‘시체들’로도 옮길 수 있습니다.
