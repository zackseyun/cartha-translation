translation:
  language: ko
  text: 그 구덩이에는 일곱 마리의 사자가 있었고, 매일 그들에게 두 시체와 두 양이 주어졌습니다. 그러나 그때는 그들에게 아무것도 주어지지 않았으니, 그들이 다니엘을 집어삼키게 하려는 것이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘두 시체’는 그리스어 σώματα의 문자적 의미를 따른 번역입니다. 문맥상 사자에게 던져질 먹이를 가리키며, 더 좁게는 ‘두 사체’나 ‘두 시체’로 이해할 수 있습니다.
    reason: lexical_alternative
