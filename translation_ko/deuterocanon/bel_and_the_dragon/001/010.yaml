  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/010.yaml
  text: Daniel said to the king[a], “Let it be according to your word.” And there were seventy priests of Bel, besides women and children[c][b]; and he came in.
  footnotes:
  - marker: a
    text: Greek literally, 'according to your word.' The sense is Daniel's assent to the king's proposal.
    reason: lexical_alternative
  - marker: b
    text: Or 'apart from women and children' / 'not counting women and children.'
    reason: lexical_alternative
  - marker: c
    text: The verse ends with 'and he came,' leaving the destination to be supplied by the following context.
    reason: cross_reference
translation:
  language: ko
  text: 다니엘이 왕에게 말했습니다. 「당신의 말대로 이루어지십시오.」 그리고 바알의 제사장은 여자들과 아이들을 제외하고도 일흔 명이 있었으며, 그가 들어갔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘당신의 말대로 이루어지십시오’는 문자적으로는 ‘당신의 말씀/말에 따라’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 여자들과 아이들을 ‘제외하고도’는 이들이 70명의 수에 포함되지 않았다는 뜻을 밝힙니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 동사는 목적지를 말하지 않아, 다음 문맥을 통해 보완됩니다.
    reason: cross_reference
