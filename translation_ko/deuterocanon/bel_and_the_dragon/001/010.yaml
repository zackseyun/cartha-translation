translation:
  language: ko
  text: 다니엘이 왕에게 말했습니다. “말씀하신 대로 되기를 바랍니다.” 그리고 여자들과 아이들 외에 벨의 제사장이 일흔 명 있었고, 그가 왔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ‘당신의 말에 따라 되라’는 왕의 제안에 동의하는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘여자들과 아이들 외에’는 이들이 일흔 명의 수에 포함되지 않았다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 동사는 단지 ‘그가 왔다’라고 하며, 이 절에서는 목적지를 밝히지 않습니다. 다음 문맥이 이를 보완합니다.
    reason: cross_reference
