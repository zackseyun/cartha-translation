  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/011.yaml
  text: The king went with Daniēl into the house of Bel. And the priests of Bel said, “Look, we are going outside. But you, O king, set out the food, and after mixing the wine, set it out, and shut the door.”
  footnotes:
  - marker: a
    text: Or “temple of Bel.” The Greek literally says “house of Bel,” a common way to refer to a deity’s shrine or temple.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕은 다니엘과 함께 벨의 집[a]으로 들어갔습니다. 벨의 제사장들이 말했습니다. “보십시오, 우리는 밖으로 나갑니다. 그러나 왕이시여, 음식을 차려 놓으시고 포도주를 섞은 다음 차려 놓으시고 문을 닫으십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “벨의 집”입니다. 이 문맥에서는 신의 신전이나 성소를 가리키는 일반적 표현일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ Δανιὴλ
  english_pob_choice: with Daniēl
  chosen_korean: 다니엘과 함께
  alternatives_korean:
  - 다니엘과
  lexicon: LSJ
  rationale: μετά + 속격은 동반을 나타내므로 ‘함께’를 넣어 동행 관계를 분명히 했습니다.
- source_word: εἰς τὸν οἶκον τοῦ Βήλ
  english_pob_choice: into the house of Bel
  chosen_korean: 벨의 집으로
  alternatives_korean:
  - 벨의 성전으로
  - 벨의 집 안으로
  lexicon: LSJ
  rationale: οἶκος의 기본값인 ‘집’을 살리되, 이동 방향을 드러내기 위해 조사와 목적격을 자연스럽게 옮겼습니다.
- source_word: ἡμεῖς ἀποτρέχομεν ἔξω
  english_pob_choice: we are going outside
  chosen_korean: 우리는 밖으로 나갑니다
  alternatives_korean:
  - 우리는 밖으로 달려갑니다
  - 우리는 밖으로 떠납니다
  lexicon: LSJ
  rationale: 문맥상 제사장들이 공간을 잠시 비우는 선언이므로, 과도한 ‘달려감’보다 자연스러운 현재형 이동 표현을 택했습니다.
- source_word: τὸν οἶνον κεράσας θές
  english_pob_choice: after mixing the wine, set it out
  chosen_korean: 포도주를 섞어 놓으신 뒤 그것을 놓으시고
  alternatives_korean:
  - 포도주를 섞고 그것을 놓으시고
  - 포도주를 탄 뒤 그것을 놓으시고
  lexicon: LSJ
  rationale: κεράσας의 ‘섞다’와 뒤이어 오는 θές를 함께 살려, 한국어에서는 ‘섞어 놓으신 뒤’로 순서를 드러냈습니다.
- source_word: ἀπόκλεισον τὴν θύραν
  english_pob_choice: shut the door
  chosen_korean: 문을 닫으십시오
  alternatives_korean:
  - 문을 잠그십시오
  - 문을 닫아 두십시오
  lexicon: LSJ
  rationale: ἀποκλείω는 ‘닫다/닫아 막다’의 뜻이므로 ‘잠그다’로 과잉 번역하지 않고, 자연스러운 명령형 ‘닫으십시오’로 옮겼습니다.
theological_decisions:
- issue: 제사장들의 직접 발화에서의 호칭과 명령형 높임
  chosen_reading: 왕에게는 ‘왕이시여’로 직접 호칭을 살리고, 명령문은 한국어 합쇼체로 유지했습니다.
  alternative_readings:
