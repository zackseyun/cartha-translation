  source_fidelity: 원문의 εἰς τὸν λάκκον τῶν λεόντων은 ‘사자들의 구덩이(안으로)’라는 뜻입니다. 초안의 ‘사자 굴’은 전통적으로 익숙하지만, λάκκος의 ‘구덩이’라는 구체적 어휘를 본문에서 바꾸므로 원문 충실성 면에서 수정하는 것이 안전합니다. ‘던졌고’와 ‘여섯 날 동안 있었습니다’는 각각 ἔβαλον 및 기간을 나타내는 ἡμέρας ἕξ을 적절히 반영합니다.
  naturalness: ‘그런데’는 문두의 δέ가 나타내는 가벼운 전환을 현대 한국어 서사문에서 자연스럽게 옮깁니다. ‘사자들의 구덩이에 던져 넣었고’는 목적지와 강제성을 분명히 하며, 합쇼체 문장으로 자연스럽습니다.
  terminology: ‘구덩이’는 λάκκος의 기본 뜻을 보존합니다. 본문에서는 전통적 ‘사자 굴’을 사용하지 않고, 필요한 경우 각주에서 그 전통적 표현을 어휘적 대안으로만 밝혀 독자가 혼동하지 않게 합니다.
