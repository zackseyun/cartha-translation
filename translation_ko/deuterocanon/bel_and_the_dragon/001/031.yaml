  alternative_readings:
  - 사자 굴
  - 사자 구덩이
  - 사자들의 굴
  rationale: 이 절의 핵심은 장소의 성격보다도 처형에 가까운 격리 행위이므로, 독자가 즉시 이해할 수 있는 관용 표현을 유지하면서도 원문의 폭력성을 약화하지 않았습니다.
  doctrine_reference: 서사 문맥 보존과 직역/관용 번역의 균형
