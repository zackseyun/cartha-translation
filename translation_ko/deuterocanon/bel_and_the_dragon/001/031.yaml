lexical_decisions:
- source_word: οἱ δὲ
  english_pob_choice: But they
  chosen_korean: 그러나 그들은
  alternatives_korean:
  - 그리고 그들은
  - 그런데 그들은
  lexicon: BDAG
  rationale: δέ의 이어짐 속에 역접적 흐름이 있어, 한국어에서는 ‘그러나’로 자연스럽게 이어 주면서 행위 주체를 분명히 했습니다.
- source_word: ἔβαλον
  english_pob_choice: threw
  chosen_korean: 던졌고
  alternatives_korean:
  - 던졌습니다
  - 집어넣었고
  - 넣었고
  lexicon: BDAG
  rationale: βάλλω의 강한 동작성을 살려 ‘던지다’로 옮겼고, 서술 연결을 위해 ‘-었고’로 처리했습니다.
- source_word: εἰς τὸν λάκκον τῶν λεόντων
  english_pob_choice: into the lions' pit
  chosen_korean: 사자 굴
  alternatives_korean:
  - 사자 굴 안에
  - 사자 구덩이
  - 사자들의 굴
  lexicon: LSJ
  rationale: λάκκος는 문자적으로 ‘구덩이/구덩이처럼 파인 곳’이지만, 한국어 성경 문맥에서 가장 자연스럽고 본문이 의도하는 위험한 감금 장소를 잘 드러내는 표현으로 ‘사자 굴’을 택했습니다.
- source_word: ἡμέρας ἕξ
  english_pob_choice: for six days
  chosen_korean: 여섯 날 동안
  alternatives_korean:
  - 엿새 동안
  - 여섯 날 동안을
  - 여섯 날
  lexicon: BDAG
  rationale: 지속 기간을 분명히 하기 위해 ‘동안’을 넣었고, 숫자 표현은 본문의 일수 개념을 그대로 살렸습니다.
theological_decisions:
- issue: 사자 감금 장소의 전통적 번역과 원문 직역 사이의 균형
  chosen_reading: 전통적으로 익숙한 ‘굴’을 쓰되, 본문이 말하는 것은 단순한 ‘우리’가 아니라 위험한 구덩이형 감금 장소라는 점을 유지했습니다.
  alternative_readings:
  - 사자 굴
  - 사자 구덩이
  - 사자들의 굴
  rationale: 이 절의 핵심은 장소의 성격보다도 처형에 가까운 격리 행위이므로, 독자가 즉시 이해할 수 있는 관용 표현을 유지하면서도 원문의 폭력성을 약화하지 않았습니다.
  doctrine_reference: 서사 문맥 보존과 직역/관용 번역의 균형
