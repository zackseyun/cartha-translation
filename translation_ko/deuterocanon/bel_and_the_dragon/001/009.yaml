lexical_decisions:
- source_word: δαπάνην
  english_pob_choice: expense
  chosen_korean: 비용
  alternatives_korean:
  - 경비
  - 지출
  - 비용
  lexicon: LSJ
  rationale: 공적인 지출이나 부담을 가리키는 말로 읽히므로, 현대어에서 자연스럽고 직역성도 유지하는 ‘비용’이 적절합니다.
- source_word: ἀποθανεῖσθε
  english_pob_choice: you will die
  chosen_korean: 너희는 죽을 것이오
  alternatives_korean:
  - 너희는 죽습니다
  - 너희는 죽을 것입니다
  lexicon: BDAG
  rationale: 법정적 위협의 미래형을 살리면서도, 직접 인용 안의 협박성 어조를 반영하기 위해 ‘죽을 것이오’를 택했습니다.
- source_word: δείξητε
  english_pob_choice: you show
  chosen_korean: 입증하면
  alternatives_korean:
  - 보이면
  - 증명하면
  - 입증하면
  lexicon: BDAG
  rationale: 논쟁/시연의 문맥에서 단순히 ‘보이다’보다 사실을 입증한다는 뉘앙스가 분명하므로 ‘입증하다’가 더 정확합니다.
- source_word: ἐβλασφήμησεν εἰς τὸν Βήλ
  english_pob_choice: he has blasphemed against Bel
  chosen_korean: 그가 벨을 모독했기 때문입니다
  alternatives_korean:
  - 그가 벨을 신성모독했기 때문입니다
  - 그가 벨에 대하여 불경을 저질렀기 때문입니다
  lexicon: BDAG
  rationale: 여기서는 참하나님에 대한 교리적 용례가 아니라 이교 신을 향한 모독이므로, 한국어로는 의미를 정확히 전달하는 ‘모독하다’가 자연스럽습니다.
theological_decisions:
- issue: βλασφημέω를 이교 신 벨에게 적용하는 표현
  chosen_reading: ‘벨을 모독했다’로 옮겨, 본문의 고발 내용을 그대로 살리되 벨의 실재적 신성을 승인하지 않습니다.
  alternative_readings:
  - ‘벨을 신성모독했다’
  - ‘벨에 대하여 불경을 저질렀다’
  rationale: 본문은 바벨론 제사장들의 고발을 기록할 뿐이므로, 번역은 그들의 주장과 죄목을 유지하되 신학적 판단을 덧씌우지 않아야 합니다.
  doctrine_reference: 본문의 고발 진술을 그대로 보존하되, 서술자가 벨을 승인하는 것으로 읽히지 않게 함.
