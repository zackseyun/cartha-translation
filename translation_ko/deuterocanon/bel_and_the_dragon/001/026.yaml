translation:
  language: ko
  text: 그러나 임금이시여, 저에게 권한을 주십시오. 그러면 저는 칼과 지팡이 없이 그 용을 죽이겠습니다. 그러자 임금이 말했습니다. “내가 그 권한을 그대에게 주겠습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σὺ δέ
  english_pob_choice: But you
  chosen_korean: 그러나 당신은
  alternatives_korean:
  - 하지만 당신은
  - 그런데 임금이시여, 당신은
  lexicon: BDAG
  rationale: δέ의 전환과 σὺ의 대조적 강조를 살리되, 한국어에서는 문장 첫머리의 ‘그러나’가 자연스럽습니다.
- source_word: βασιλεῦ
  english_pob_choice: O king
  chosen_korean: 임금이시여
  alternatives_korean:
  - 왕이시여
  - 임금님
  lexicon: BDAG
  rationale: 직접 호격을 살려 공적인 존칭을 유지하면서도, 한국어 성경체에 맞게 합쇼체 호칭으로 옮겼습니다.
- source_word: δός μοι ἐξουσίαν
  english_pob_choice: give me authority
  chosen_korean: 저에게 권한을 주십시오
  alternatives_korean:
  - 저에게 권위를 주십시오
  - 저에게 허가를 주십시오
  lexicon: BDAG
  rationale: ἐξουσία는 단순한 허가보다 위임된 권한의 뜻이 강하므로 ‘권한’이 더 정확합니다.
- source_word: ἀποκτενῶ τὸν δράκοντα
  english_pob_choice: I will kill the dragon
  chosen_korean: 그 용을 죽이겠습니다
  alternatives_korean:
  - 그 용을 죽이겠습니다
  - 그 드래곤을 죽이겠습니다
  lexicon: LSJ
  rationale: δράκων은 이 이야기에서 경배 대상이 된 괴물을 가리키므로, 한국어에서는 ‘용’이 문맥상 자연스럽고 힘이 있습니다.
- source_word: ἄνευ μαχαίρας καὶ ῥάβδου
  english_pob_choice: without sword or staff
  chosen_korean: 칼과 막대기 없이
  alternatives_korean:
  - 칼과 지팡이 없이
  - 칼과 몽둥이 없이
  lexicon: BDAG/LSJ
  rationale: ἄνευ + 두 명사의 부정 구조를 자연스럽게 풀어 옮겼고, ῥάβδος는 무기 대조 문맥에서 ‘막대기’가 가장 무난합니다.
- source_word: Δίδωμί σοι
  english_pob_choice: I give it to you
  chosen_korean: 내가 그것을 너에게 주겠다
  alternatives_korean:
  - 내가 그것을 너에게 준다
  - 그것을 너에게 주겠다
  lexicon: BDAG
  rationale: 생략된 목적어는 앞의 ἐξουσίαν을 가리키므로 ‘그것’을 보충해 의미를 분명히 했습니다.
theological_decisions:
- issue: 임금의 직접 발화에서의 높임과 인용문 내부 인칭
  chosen_reading: 서술문은 합쇼체를 유지하되, 왕의 응답은 한국어로 자연스러운 존대형 약속문으로 처리했습니다.
  alternative_readings:
  - “내가 그것을 당신에게 주겠습니다.”
  - “그것을 너에게 주겠다.”
  rationale: 원문의 짧은 왕의 응답을 과도하게 격식화하지 않으면서도, 공적인 화자에 걸맞은 자연스러운 한국어를 택했습니다.
  doctrine_reference: 번역체/문체 일관성
- issue: ῥάβδος의 의미 범위
  chosen_reading: 문맥상 무기의 대비를 살려 ‘막대기’로 옮겼습니다.
  alternative_readings:
  - 지팡이
  - 몽둥이
  rationale: 이 장면은 전투 수단의 부재를 말하므로, 목자의 지팡이보다 일반적 막대기가 문맥에 더 가깝습니다.
  doctrine_reference: 본문 문맥 우선 원칙
