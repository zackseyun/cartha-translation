  source_fidelity: 핵심 의미는 대체로 원문에 충실합니다. 다만 왕의 짧은 허락은 앞서 요청한 ἐξουσίαν(권한)을 받는 말이므로, 한국어에서는 ‘그 권한’을 밝혀 주는 편이 자연스럽고 뜻이 분명합니다.
  naturalness: ‘그러나 당신은, 임금이시여’는 한국어 호격에서 ‘당신은’이 어색하고 불필요하게 대립적입니다. 또한 왕의 인용문 ‘내가 그것을 너에게 주겠다’는 목표 문체인 현대 합쇼체와 맞지 않으며, 본문 안에서 높임 체계도 흔들립니다.
  terminology: ἐξουσίαν은 ‘권한’이 적절합니다. ῥάβδος는 이 문맥에서 ‘지팡이’ 또는 ‘막대기’가 가능하나, ‘칼과 지팡이 없이’가 무기·도구의 문자적 범위를 보존하면서 한국어 성경 문체에도 자연스럽습니다. δράκων은 ‘용’으로 유지할 수 있습니다.
