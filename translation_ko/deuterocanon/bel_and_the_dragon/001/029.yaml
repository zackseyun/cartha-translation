  text: And they came to the king and said[a], “Hand Daniel over to us[b]; otherwise we will kill you and your household.”
  footnotes:
  - marker: a
    text: Or, more formally, “Deliver Daniel to us”; the Greek imperative can also be rendered “Give Daniel up to us.”
    reason: lexical_alternative
  - marker: b
    text: “Your household” translates Greek “your house,” a common expression that can mean the members of one’s household or family, not merely the building.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들이 왕에게 와서 말했습니다[a]. “다니엘을 우리에게 넘기십시오[b]. 그렇지 않으면 우리는 당신과 당신의 집안을 죽이겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 분사구문은 한국어에서 보통 ‘그리고 … 와서’로 자연스럽게 옮길 수 있습니다.
    reason: korean_style_note
  - marker: b
    text: 원문의 παραδίδωμι는 ‘넘기다’ 외에 좀 더 형식적으로 ‘내주다’, ‘인도하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παράδος ἡμῖν
  english_pob_choice: Hand Daniel over to us
  chosen_korean: 다니엘을 우리에게 넘기십시오
