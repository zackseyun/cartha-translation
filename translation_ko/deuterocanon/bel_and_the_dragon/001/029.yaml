  rationale: 수혜·귀속의 여격을 직접 드러내어, 다니엘을 자신들에게 인도하라는 요구를 분명하게 전달합니다.
- source_word: τὸν οἶκόν σου
  english_pob_choice: your household
  chosen_korean: 당신의 집안
  alternatives_korean:
