  rationale: παραδίδωμι의 명령형은 상대를 권력 아래로 ‘인도해 넘기다’는 강한 뉘앙스를 가지므로, 현대 한국어에서는 ‘넘기십시오’가 가장 자연스럽고 위협의 압박도 잘 살립니다.
- source_word: ἡμῖν
