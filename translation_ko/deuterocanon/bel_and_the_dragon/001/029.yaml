  - 당신의 가족
  lexicon: LSJ
  rationale: οἶκος는 건물보다 가족·종속 인원을 포함한 ‘집안’의 의미가 강하므로, 단순한 건물이 아니라 사람들을 가리키는 위협임을 살렸습니다.
- source_word: ἀποκτενοῦμέν σε καὶ τὸν οἶκόν σου
  english_pob_choice: we will kill you and your household
  chosen_korean: 우리는 당신과 당신의 집안을 죽이겠습니다
  alternatives_korean:
  - 우리는 당신과 당신의 집안을 죽여 버리겠습니다
  - 우리는 당신과 당신 집안을 없애겠습니다
  lexicon: LSJ
  rationale: ἀποκτείνω의 직접적 의미는 ‘죽이다’이므로, 법적·완곡한 표현보다 직설적인 위협을 그대로 옮겼습니다.
theological_decisions:
- issue: oἶκος의 범위
  chosen_reading: ‘집안’으로 옮겨, 집 건물만이 아니라 왕에게 속한 사람들까지 포함하는 위협으로 이해하게 했습니다.
  alternative_readings:
  - ‘집’으로 옮겨 건물 중심으로 이해하는 방식
  - ‘가족’으로 좁혀 혈연 중심으로 이해하는 방식
  rationale: 본문은 폭력적 최후통첩이며, 영어 POB도 household를 택해 사람들에 대한 위협을 분명히 합니다. 한국어 ‘집안’은 그 넓은 공동체적 의미를 가장 자연스럽게 전달합니다.
