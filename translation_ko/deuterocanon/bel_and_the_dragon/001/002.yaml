  - 신하들
  rationale: 본문의 어휘 형식을 보존하는 것이 우선이지만, 헬레니즘 왕실 맥락에서 φίλοι가 단순한 사적 친구보다 궁정 측근 집단을 뜻할 수 있어 한국어 본문은 ‘친구들’로 두었습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; documented lexical tension'
- issue: 사역 동사 ‘received’의 접근
  chosen_reading: 왕위의 ‘수령/수여’가 아니라 ‘받았다’로 옮겨, 출처가 명시하지 않는 세부 경위를 과도하게 단정하지 않았습니다.
  alternative_readings:
  - 이어받았다
  - 물려받았다
  - 차지했다
  rationale: παρέλαβεν은 왕국의 소유에 들어감을 말하지만, 양도 방식까지 특정하지 않으므로 중립적인 ‘받았다’가 원문의 폭을 가장 잘 보존합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy'
