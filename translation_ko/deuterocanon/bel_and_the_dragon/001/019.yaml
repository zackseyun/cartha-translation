  - ‘조롱하며’
  rationale: 그리스어 ἐγέλασεν 자체는 기본적으로 ‘웃다’이며, 여기서는 상황상 놀라움이나 확신이 섞인 반응일 수 있으므로 과잉 해석을 피했습니다.
  doctrine_reference: 본문의 화행과 인물 성격 해석에 관한 주석적 판단
