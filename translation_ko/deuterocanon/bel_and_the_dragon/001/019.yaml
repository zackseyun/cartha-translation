    text: 헬라어는 문자적으로 ‘알다’ 또는 ‘인식하다’라는 뜻입니다. 여기서는 바닥에 드러난 것을 주의 깊게 보고 알아차리라는 뜻입니다.
    reason: lexical_alternative
