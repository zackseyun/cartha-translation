  rationale: 기본 의미는 ‘웃다’이므로 이를 유지했습니다. ‘비웃다’는 태도를 과도하게 규정할 수 있어 피했습니다.
- source_word: ἐκράτησεν τὸν βασιλέα τοῦ μὴ εἰσελθεῖν αὐτὸν ἔσω
  english_pob_choice: held the king back from going inside
  chosen_korean: 왕이 안으로 들어가지 못하게 붙잡고
  alternatives_korean:
  - 왕을 말려서 안으로 못 들어가게 하고
  - 왕을 제지하고 안으로 들어가지 못하게 하고
  lexicon: LSJ
  rationale: 예방적 제지를 나타내는 구조를 살려, 한국어에서 자연스러운 ‘~하지 못하게 붙잡고’로 옮겼습니다.
- source_word: Ἴδε δὴ
  english_pob_choice: Now look
  chosen_korean: 이제 바닥을 보시고
  alternatives_korean:
  - 자, 보십시오
  - 이제 보십시오
  lexicon: LSJ
  rationale: 즉시성을 가진 주의를 환기하는 표현으로, 뒤의 대상인 ‘바닥’을 앞에 두어 장면의 관찰 초점을 살렸습니다.
- source_word: τὸ ἔδαφος
