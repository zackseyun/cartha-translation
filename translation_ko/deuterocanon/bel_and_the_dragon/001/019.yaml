translation:
  language: ko
  text: “아무도 없습니다.” 다니엘은 웃으며[a] 왕이 안으로 들어가지 못하게 붙잡고 말했습니다. “이제 바닥을 보시고, 살펴보십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어는 문자적으로는 ‘알다’ 또는 ‘인식하다’에 가깝지만, 여기서는 바닥이 보여 주는 것을 주의 깊게 살펴 알아차리라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ εἷς
  english_pob_choice: Not even one
  chosen_korean: 아무도 없습니다
  alternatives_korean:
