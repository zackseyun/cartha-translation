translation:
  language: ko
  text: “아무도 없습니다.” 다니엘은 웃으며[a] 왕이 안으로 들어가지 못하게 붙잡고 말했습니다. “이제 바닥을 보시고, 살펴보십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어는 문자적으로는 ‘알다’ 또는 ‘인식하다’에 가깝지만, 여기서는 바닥이 보여 주는 것을 주의 깊게 살펴 알아차리라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ εἷς
  english_pob_choice: Not even one
  chosen_korean: 아무도 없습니다
  alternatives_korean:
  - 한 사람도 없습니다
  - 아무도 없네요
  lexicon: LSJ
  rationale: 엘립시스가 있는 강한 부정을 자연스러운 현대 한국어로 옮기되, 문맥상 ‘사람이 하나도 없다’는 뜻을 분명히 했습니다.
- source_word: ἐγέλασεν
  english_pob_choice: laughed
  chosen_korean: 웃으며
  alternatives_korean:
  - 웃었습니다
  - 비웃었습니다
  lexicon: LSJ
  rationale: 기본 의미는 ‘웃다’이므로 이를 유지했습니다. ‘비웃다’는 태도를 과도하게 규정할 수 있어 피했습니다.
- source_word: ἐκράτησεν τὸν βασιλέα τοῦ μὴ εἰσελθεῖν αὐτὸν ἔσω
  english_pob_choice: held the king back from going inside
  chosen_korean: 왕이 안으로 들어가지 못하게 붙잡고
  alternatives_korean:
  - 왕을 말려서 안으로 못 들어가게 하고
  - 왕을 제지하고 안으로 들어가지 못하게 하고
  lexicon: LSJ
  rationale: 예방적 제지를 나타내는 구조를 살려, 한국어에서 자연스러운 ‘~하지 못하게 붙잡고’로 옮겼습니다.
- source_word: Ἴδε δὴ
  english_pob_choice: Now look
  chosen_korean: 이제 바닥을 보시고
  alternatives_korean:
  - 자, 보십시오
  - 이제 보십시오
  lexicon: LSJ
  rationale: 즉시성을 가진 주의를 환기하는 표현으로, 뒤의 대상인 ‘바닥’을 앞에 두어 장면의 관찰 초점을 살렸습니다.
- source_word: τὸ ἔδαφος
  english_pob_choice: the floor
  chosen_korean: 바닥
  alternatives_korean:
  - 마루
  - 땅
  lexicon: LSJ
  rationale: 성전 내부의 맥락에서 ‘바닥’이 가장 무난하고 정확합니다.
- source_word: γνῶθι
  english_pob_choice: take notice
  chosen_korean: 살펴보십시오
  alternatives_korean:
  - 유의하십시오
  - 알아보십시오
  lexicon: LSJ
  rationale: ‘보아 인지하다’는 의미를 한국어 명령형으로 자연스럽게 재현하여, 단순한 지식이 아니라 관찰을 통한 인식을 드러냈습니다.
theological_decisions:
- issue: 다니엘의 반응을 나타내는 동사 선택
  chosen_reading: ‘웃으며’로 옮겨 조롱으로 단정하지 않았습니다.
  alternative_readings:
