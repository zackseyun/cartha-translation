  lexicon: LSJ
  rationale: 성전 내부의 맥락에서 ‘바닥’이 가장 무난하고 정확합니다.
- source_word: γνῶθι
  english_pob_choice: take notice
  chosen_korean: 살펴보십시오
  alternatives_korean:
  - 유의하십시오
  - 알아보십시오
  lexicon: LSJ
  rationale: ‘보아 인지하다’는 의미를 한국어 명령형으로 자연스럽게 재현하여, 단순한 지식이 아니라 관찰을 통한 인식을 드러냈습니다.
theological_decisions:
- issue: 다니엘의 반응을 나타내는 동사 선택
  chosen_reading: ‘웃으며’로 옮겨 조롱으로 단정하지 않았습니다.
