  text: 그때 왕이 화를 내어 제사장들과 그들의 아내들과 자녀들을 잡았습니다. 그러자 그들은 그에게 비밀 문들을 보여 주었는데, 그 문들로 그들은 드나들면서 상 위에 놓인 것을 먹어 치웠습니다.[a][b]
