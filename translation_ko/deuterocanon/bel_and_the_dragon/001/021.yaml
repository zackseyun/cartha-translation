lexical_decisions:
- source_word: ὀργισθεὶς
  english_pob_choice: became angry
  chosen_korean: 화를 내어
  alternatives_korean:
  - 분노하여
  - 성내어
  lexicon: BDAG
  rationale: 부사적 분사로서 왕의 감정 변화를 자연스러운 현대 한국어로 살리되, 강도를 과장하지 않도록 ‘화를 내어’로 옮겼습니다.
- source_word: συνέλαβεν
  english_pob_choice: arrested
  chosen_korean: 잡았습니다
  alternatives_korean:
  - 체포했습니다
  - 붙잡았습니다
  lexicon: BDAG
  rationale: 왕이 제사장들과 그 가족들을 처벌 목적에서 붙잡는 장면이므로, 법적 뉘앙스를 담되 한국어에서 과도하게 관료적인 ‘체포했습니다’보다 서사에 자연한 ‘잡았습니다’를 택했습니다.
- source_word: κρυπτὰς θύρας
  english_pob_choice: secret doors
  chosen_korean: 비밀 문들
  alternatives_korean:
  - 숨은 문들
  - 감춰진 문들
  lexicon: BDAG
  rationale: 사기 행위에 쓰인 숨겨진 출입구라는 점을 분명히 하면서, 평이하고 구체적인 표현으로 옮겼습니다.
- source_word: ἐδαπάνων
  english_pob_choice: consume
  chosen_korean: 먹어 치웠습니다
  alternatives_korean:
  - 먹었습니다
  - 소비했습니다
  lexicon: BDAG
  rationale: 문맥상 탁자 위의 음식을 몰래 먹어 없애는 뜻이므로, 단순한 ‘먹었습니다’보다 행위의 부정성과 반복성을 드러내는 ‘먹어 치웠습니다’가 적절합니다.
