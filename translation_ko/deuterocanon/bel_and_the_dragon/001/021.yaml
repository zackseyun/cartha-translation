  lexicon: BDAG
  rationale: 왕이 제사장들과 그 가족들을 처벌 목적에서 붙잡는 장면이므로, 법적 뉘앙스를 담되 한국어에서 과도하게 관료적인 ‘체포했습니다’보다 서사에 자연한 ‘잡았습니다’를 택했습니다.
- source_word: κρυπτὰς θύρας
