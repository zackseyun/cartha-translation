  chosen_korean: 비밀 문들
  alternatives_korean:
  - 숨은 문들
  - 감춰진 문들
  lexicon: BDAG
  rationale: 사기 행위에 쓰인 숨겨진 출입구라는 점을 분명히 하면서, 평이하고 구체적인 표현으로 옮겼습니다.
- source_word: ἐδαπάνων
  english_pob_choice: consume
  chosen_korean: 먹어 치웠습니다
  alternatives_korean:
  - 먹었습니다
  - 소비했습니다
  lexicon: BDAG
  rationale: 문맥상 탁자 위의 음식을 몰래 먹어 없애는 뜻이므로, 단순한 ‘먹었습니다’보다 행위의 부정성과 반복성을 드러내는 ‘먹어 치웠습니다’가 적절합니다.
