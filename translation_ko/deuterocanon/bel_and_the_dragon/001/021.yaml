  source_fidelity: 그리스어의 사건 순서와 핵심 의미는 대체로 반영합니다. 다만 ἐδαπάνων은 문맥상 먹는 행위를 가리키지만 ‘먹어 치웠습니다’는 원문에 없는 완료·강조의 뉘앙스를 더합니다. 또한 τὰ ἐπὶ τῇ τραπέζῃ는 복수로 ‘상 위에 있는 것들’이 더 가깝습니다. 미완료형 εἰσεπορεύοντο의 반복성은 ‘드나들곤 하면서’로 자연스럽게 보존할 수 있습니다.
  naturalness: ‘비밀 문들’보다 ‘숨겨진 문들’이 현대 한국어 서술에서 더 자연스럽고, ‘그러자’는 단순 접속인 καί에 인과 관계를 다소 보태므로 생략하는 편이 낫습니다. 각주 표지는 해당 표현 바로 뒤에 두어 참조 범위를 분명히 했습니다.
  terminology: ‘제사장들’, ‘아내들’, ‘자녀들’, ‘왕’은 적절합니다. συνέλαβεν의 ‘잡았습니다’도 서사체에서 수용 가능하나, 법적·처벌적 문맥을 더 분명히 하려면 ‘붙잡았습니다’가 적절합니다. ‘먹었습니다’는 δαπανάω의 문맥상 의미를 과장 없이 전달합니다.
