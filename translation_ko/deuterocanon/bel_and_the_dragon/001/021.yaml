translation:
  language: ko
  text: 그때 왕은 화를 내어 제사장들과 그들의 아내들과 자녀들을 붙잡았습니다. 그들은 그에게 숨겨진 문들[a]을 보여 주었고, 그 문들로 드나들곤 하면서 상 위에 있는 것들을 먹었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘비밀 문들’입니다.
    reason: κρυπτὰς θύρας의 어휘 대안입니다.
  - marker: b
    text: 또는 ‘그들은 들어가서 상 위에 있는 것들을 먹었습니다.’입니다.
    reason: διʼ ὧν εἰσεπορεύοντο καὶ ἐδαπάνων의 표현 방식에 관한 대안입니다.
lexical_decisions:
- source_word: ὀργισθεὶς
  english_pob_choice: became angry
  chosen_korean: 화를 내어
  alternatives_korean:
