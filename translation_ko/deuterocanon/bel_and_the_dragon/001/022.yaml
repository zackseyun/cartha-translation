- from: 그리고 왕은 그들을 죽였습니다. 그리고 그는 벨을 다니엘에게 넘겨 주었습니다[a]. 그리고 그는 그것과 그의 신전을 파괴했습니다[b].
  to: 왕은 그들을 죽이고, 벨을 다니엘에게 넘겨주었으며, 벨과 그 신전을 파괴했습니다.
  rationale: The revision removes the contradictory pronoun sequence and repeats ‘벨,’ a natural Korean solution that faithfully represents the Greek referent without imposing either personal or impersonal pronoun semantics. It also removes redundant and interpretively weighted notes and smooths the coordination into idiomatic modern formal-polite Korean.
