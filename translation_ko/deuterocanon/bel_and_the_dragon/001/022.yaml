  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/022.yaml
  text: And the king killed them[a], and he gave Bel over to Daniel[b], and he destroyed him and his temple.
  footnotes:
  - marker: a
    text: Or 'handed Bel over to Daniel.' The Greek expression literally uses 'gave' with an adjective meaning 'given up' or 'surrendered.'
    reason: lexical_alternative
  - marker: b
    text: The Greek pronoun is masculine, so some translations render 'destroyed him and his temple.' Here 'it' is used because the context concerns the idol of Bel being destroyed.
    reason: alternative_reading
translation:
  language: ko
  text: 왕은 그들을 죽이고, 벨을 다니엘에게 넘겨주었으며, 벨과 그 신전을 파괴했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέκτεινεν
  english_pob_choice: killed
  chosen_korean: 죽였습니다
  alternatives_korean:
  - 처형했습니다
  - 죽였습니다
  lexicon: BDAG
  rationale: ἀποκτείνω의 기본 의미는 ‘죽이다/죽게 하다’이므로, 현대 한국어에서 분명하고 자연한 ‘죽였습니다’로 옮겼습니다. 이 문맥은 사법적 표현보다 서술적 표현이 더 적합합니다.
- source_word: ἔδωκεν ... ἔκδοτον
  english_pob_choice: gave ... over
  chosen_korean: 넘겨 주었습니다
  alternatives_korean:
  - 내주었습니다
  - 인도했습니다
  lexicon: LSJ
  rationale: ‘주다’에 ‘넘겨 주다’의 방향성을 더해 ἔδωκεν ... ἔκδοτον이 가진 ‘권력 아래로 넘김/인도함’의 관용을 살렸습니다. ‘인도했습니다’도 가능하지만, 한국어에서는 ‘넘겨 주었습니다’가 더 직접적입니다.
- source_word: τὸν Βὴλ
  english_pob_choice: Bel
  chosen_korean: 벨
  alternatives_korean:
  - 벨
  lexicon: 고유명사 음역
  rationale: 고유명사는 음역을 따르되, 한국어 독자에게 익숙한 ‘벨’을 사용했습니다.
- source_word: κατέστρεψεν
  english_pob_choice: destroyed
  chosen_korean: 파괴했습니다
  alternatives_korean:
  - 무너뜨렸습니다
  - 부숴 버렸습니다
  lexicon: LSJ
  rationale: 이 동사는 파괴와 폐허를 뜻하므로, 우상과 그 신전 모두에 자연스럽게 적용되는 ‘파괴했습니다’가 가장 간명합니다.
- source_word: τὸ ἱερὸν
  english_pob_choice: temple
  chosen_korean: 신전
  alternatives_korean:
  - 성전
  - 성소
  - 절
  lexicon: LSJ
  rationale: 여기서 ἱερόν은 특정 신에게 속한 cultic building을 가리키므로, 기독교 용어인 ‘성전’보다 ‘신전’이 원문의 종교적 배경을 더 정확히 드러냅니다.
theological_decisions:
- issue: 벨과 그 신전의 파괴를 한국어에서 인격화하여 ‘그’를 유지할지, 우상으로서의 대상성을 살릴지
  chosen_reading: ‘그것과 그의 신전’으로 옮겨, 그리스어의 남성 문법형을 존중하되 한국어에서는 우상이라는 대상성을 함께 드러냈습니다.
  alternative_readings:
  - ‘그를 그의 신전과 함께 파괴했습니다’
  - ‘그것과 그 신전을 파괴했습니다’
  rationale: 그리스어는 Βήλ에 남성 대명사를 쓰지만, 서술의 실재는 우상과 그 제의 공간의 파괴입니다. 한국어에서는 문법적 성(性)을 기계적으로 따라가기보다, 남성형 잔향을 최소화하면서도 대상성을 유지하는 쪽이 더 자연스럽습니다.
  doctrine_reference: 문법적 성과 서술 대상의 성격을 구분하여, 우상 파괴 서사를 과도하게 인격화하지 않도록 합니다.
