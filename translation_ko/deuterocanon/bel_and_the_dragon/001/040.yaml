  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/040.yaml
  text: He set Habakkuk down at once in his own place[a]. Then the king came on the seventh day to mourn for Daniel, and he came to the pit and looked in, and behold[b], Daniel was sitting there.
  footnotes:
  - marker: a
    text: Or 'to his own place.' The Greek phrase can be rendered either with 'to' or, after 'set down,' more idiomatically as 'in.'
    reason: lexical_alternative
  - marker: b
    text: Or 'den.' The Greek says 'pit' (λάκκος), a broader term than a specialized word for a lions' den.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 하박국을 곧바로 제자리로 내려놓았습니다[a]. 그러자 왕은 다니엘을 애도하려고 일곱째 날에 와서 구덩이로 가서 들여다보았습니다. 보라[b], 다니엘이 거기에 앉아 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 자리로.’ 그리스어는 직역하면 ‘그의 자리로’이며, ‘내려놓았습니다’ 뒤에서는 ‘제자리에’ 또는 ‘제자리로’로도 자연스럽게 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘굴.’ 그리스어 λάκκος는 ‘사자 굴’로 한정되지 않는, 더 넓은 의미의 ‘구덩이’입니다.
    reason: lexical_alternative
