    text: 제공된 그리스어 증거는 καὶ οὐ에서 끊어져 이 절이 미완성입니다.
    reason: textual_variant
lexical_decisions:
- source_word: πίνει καθʼ ἑκάστην ἡμέραν
  english_pob_choice: Does he drink every day?
  chosen_korean: 그가 날마다 마십니까?
  alternatives_korean:
  - 그가 매일 마십니까?
  - 그는 날마다 마십니까?
  lexicon: LSJ
  rationale: πίνει의 질문형 의미를 살려 자연스러운 현대 한국어 의문문으로 옮겼고, καθʼ ἑκάστην ἡμέραν은 관용적으로 ‘날마다’로 처리했습니다.
- source_word: γελάσας
  english_pob_choice: laughing
  chosen_korean: 웃으며
  alternatives_korean:
  - 웃으면서
  - 웃고
  lexicon: LSJ
  rationale: 부사적 분사로서 다니엘의 말하는 태도를 나타내므로 ‘웃으며’가 가장 간결하고 자연스럽습니다.
- source_word: Μὴ πλανῶ, βασιλεῦ
  english_pob_choice: Do not be deceived, O king
  chosen_korean: 속지 마십시오, 왕이여
  alternatives_korean:
  - 미혹되지 마십시오, 왕이여
  - 왕이여, 속지 마십시오
  lexicon: LSJ
  rationale: πλανῶ의 핵심은 오도/기만을 피하라는 뜻이므로 ‘속다’로 옮겼고, βασιλεῦ는 직접 호격을 살려 ‘왕이여’로 처리했습니다.
- source_word: χαλκός
  english_pob_choice: bronze
  chosen_korean: 놋
  alternatives_korean:
  - 청동
  - 구리
  lexicon: LSJ
  rationale: 성경 한국어에서 금속 표면이나 기물 재료를 가리킬 때 ‘놋’이 널리 쓰이며, 여기서는 물질 대비를 분명히 드러냅니다.
theological_decisions:
- issue: 본문이 제공된 그리스어 증거에서 끊어져 끝나는 문제
  chosen_reading: 완전한 문장을 보충하지 않고, 현전하는 단편만 번역해 끝을 줄표로 남겼습니다.
  alternative_readings:
  - 문맥상 가능한 후속 절을 복원해 완결문으로 번역하기
  - 후대 본문 비평판의 확장을 따라 마무리하기
  rationale: 제공된 증거가 καὶ οὐ에서 끝나므로, 미전승 부분을 임의로 보충하지 않는 것이 원문 우선 원칙과 투명성에 부합합니다.
  doctrine_reference: 'PHILOSOPHY.md: original-language primacy and transparency about source data'
