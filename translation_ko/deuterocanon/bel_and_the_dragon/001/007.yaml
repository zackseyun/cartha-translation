translation:
  language: ko
  text: 그가 날마다 마십니까? 다니엘은 웃으며 말했습니다. 「속지 마십시오, 왕이여. 이것은 속은 진흙이고 겉은 놋입니다. 그리고 결코—」[a]
  philosophy: optimal-equivalence
  footnotes:
