translation:
  language: ko
  text: 그리고 그들의 자녀도 있었는데, 그들은 모든 것을 먹어 치우고 다 마셔 버렸습니다. 그러자 왕이 아침 일찍 일어났고, 다니엘도 그와 함께 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘일찍 일어났다’와 ‘아침에’라는 시간을 중복해 말해, 아침의 이른 시각을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ τέκνα αὐτῶν
  english_pob_choice: their children too
  chosen_korean: 그들의 자녀도
  alternatives_korean:
  - 그들의 아이들도
  - 그들의 자녀들
  lexicon: LSJ
  rationale: τέκνα는 성별이 제한되지 않는 ‘자녀’이므로 이를 반영했고, καί의 누적 의미를 살려 ‘도’를 붙였습니다.
- source_word: κατέφαγον πάντα
  english_pob_choice: they ate up everything
  chosen_korean: 모든 것을 먹어 치우고
  alternatives_korean:
  - 모든 것을 먹고
  - 전부 먹어 버리고
  lexicon: LSJ
  rationale: κατα-가 붙은 동사는 단순히 ‘먹다’보다 강한 소진·소비의 뉘앙스를 가지므로, 한국어에서도 결과성을 드러내는 표현을 택했습니다.
- source_word: ἐξέπιον
  english_pob_choice: drank it all
  chosen_korean: 다 마셔 버렸습니다
  alternatives_korean:
  - 전부 마셨습니다
  - 마셔 버렸습니다
  lexicon: LSJ
  rationale: ‘마셔 버리다’가 ἐκ- 계열의 완전 소진 의미를 가장 자연스럽게 전달하며, 앞의 ‘먹어 치우다’와 평행을 이룹니다.
- source_word: ὤρθρισεν ... πρωί
  english_pob_choice: rose early in the morning
  chosen_korean: 아침 일찍 일어났고
  alternatives_korean:
  - 새벽에 일어났고
  - 이른 아침에 일어났고
  lexicon: LSJ
  rationale: 동사와 부사가 함께 반복해 ‘아침 일찍’의 강조를 이루므로, 이를 한국어 자연문으로 압축해 중복된 시간 강조를 살렸습니다.
- source_word: Δανιὴλ μετʼ αὐτοῦ
  english_pob_choice: Daniel with him
  chosen_korean: 다니엘도 그와 함께 있었습니다
  alternatives_korean:
  - 그리고 다니엘도 그와 함께였습니다
  - 다니엘도 그와 동행했습니다
  lexicon: LSJ
  rationale: 그리스어는 별도 동사 없이 부가적으로 다니엘의 동반을 덧붙이므로, ‘함께 있었습니다’로 간결한 서술을 살렸습니다.
