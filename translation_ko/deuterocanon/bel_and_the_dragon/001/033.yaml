  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/033.yaml
  text: And Habakkuk the prophet was in Judea[a], and he had cooked a stew and crumbled bread into a bowl[c][b], and was going to the field to bring it to the reapers.
  footnotes:
  - marker: a
    text: Or 'Judah.' The Greek Ἰουδαία can denote the region of Judea or, in some contexts, Judah.
    reason: lexical_alternative
  - marker: b
    text: Literally 'boiled food'; 'stew' is a natural English rendering for the prepared dish.
    reason: lexical_alternative
  - marker: c
    text: Greek 'loaves'; English uses 'bread' idiomatically here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 아바쿰 예언자는 유다에 있었으며, 스스로 죽을 끓여 빵을 사발에 부수어 넣고는 추수꾼들에게 가져다주려고 들판으로 가고 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀμβακοὺμ
  english_pob_choice: Habakkuk
  chosen_korean: 아바쿰
  alternatives_korean:
  - 하박국
  lexicon: 고유명사 음역
  rationale: 그리스어 형태를 그대로 반영해 음역했으며, 문맥상 예언자 이름의 통상형보다 원문 근접성을 우선했습니다.
- source_word: ἐν τῇ Ἰουδαίᾳ
  english_pob_choice: in Judea
  chosen_korean: 유다에
  alternatives_korean:
  - 유대에
  - 유다 지방에
  lexicon: LSJ
  rationale: 이 구절의 Ἰουδαία는 지역 명칭보다는 유다(유대인의 땅)라는 성경적 지명으로 자연스럽게 읽히므로, 직접적인 지명 감각을 살렸습니다.
- source_word: ἥψησεν ἕψεμα
  english_pob_choice: had cooked a stew
  chosen_korean: 죽을 끓여
  alternatives_korean:
  - 스튜를 만들고
  - 삶은 음식을 준비하고
  lexicon: LSJ
  rationale: ἕψεμα는 ‘끓여 만든 음식’이므로 한국어에서는 간결하게 ‘죽’으로 옮기고, 동사 ἥψησεν은 ‘끓여’로 처리해 조리 행위를 드러냈습니다.
- source_word: ἐνέθρυψεν ἄρτους
  english_pob_choice: crumbled bread
  chosen_korean: 빵을 ... 부수어 넣고
  alternatives_korean:
  - 떡을 부수어 넣고
  - 빵을 ... 잘게 부숴 넣고
  lexicon: LSJ
  rationale: ἄρτοι의 복수성과 ‘조각내어 넣는’ 동작을 살리되, 한국어에서는 먹는 음식의 일반명사인 ‘빵’으로 자연스럽게 옮겼습니다.
- source_word: σκάφην
  english_pob_choice: a bowl
  chosen_korean: 사발
  alternatives_korean:
  - 그릇
  - 대야
  lexicon: LSJ
  rationale: σκάφη는 음식을 담는 그릇이므로, 현대 한국어에서 가장 자연스러운 식기인 ‘사발’로 옮겼습니다.
- source_word: τοῖς θερισταῖς
  english_pob_choice: the reapers
  chosen_korean: 추수꾼들에게
  alternatives_korean:
  - 거두는 사람들에게
  - 수확하는 일꾼들에게
  lexicon: LSJ
  rationale: 농작물 수확자라는 뜻을 분명히 드러내기 위해 직역적이면서도 자연스러운 ‘추수꾼들’로 옮겼습니다.
theological_decisions:
- issue: αὐτός의 처리
  chosen_reading: ‘스스로’ 정도의 강조를 살리되, 주어 반복을 과도하게 드러내지 않았습니다.
  alternative_readings:
  - 그가 직접
  - 그 자신이
  rationale: 원문 αὐτός는 서술 진행 속에서 주어를 강화하는 용법이지만, 한국어에서는 본문 흐름을 해치지 않도록 가벼운 반사 의미만 반영했습니다.
  doctrine_reference: 서사 문체와 헬라어 강조 용법
