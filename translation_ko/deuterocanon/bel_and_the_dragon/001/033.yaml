  - 유다 지방에
  lexicon: LSJ
  rationale: 이 구절의 Ἰουδαία는 지역 명칭보다는 유다(유대인의 땅)라는 성경적 지명으로 자연스럽게 읽히므로, 직접적인 지명 감각을 살렸습니다.
- source_word: ἥψησεν ἕψεμα
  english_pob_choice: had cooked a stew
  chosen_korean: 죽을 끓여
  alternatives_korean:
  - 스튜를 만들고
  - 삶은 음식을 준비하고
  lexicon: LSJ
  rationale: ἕψεμα는 ‘끓여 만든 음식’이므로 한국어에서는 간결하게 ‘죽’으로 옮기고, 동사 ἥψησεν은 ‘끓여’로 처리해 조리 행위를 드러냈습니다.
- source_word: ἐνέθρυψεν ἄρτους
  english_pob_choice: crumbled bread
  chosen_korean: 빵을 ... 부수어 넣고
