  lexicon: 고유명사 음역
  rationale: 그리스어 형태를 그대로 반영해 음역했으며, 문맥상 예언자 이름의 통상형보다 원문 근접성을 우선했습니다.
- source_word: ἐν τῇ Ἰουδαίᾳ
