translation:
  language: ko
  text: 왕이 다니엘에게 말했습니다. 「너는 이것이 살아 있는 신이 아니라고 말할 수 없습니다. 그리고 그에게 절하십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그를 경배하십시오.” 그리스어 동사는 몸을 굽혀 절하는 행위와, 신에게 드리는 경배를 모두 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ δύνασαι εἰπεῖν
  english_pob_choice: You cannot say
  chosen_korean: 너는 …라고 말할 수 없습니다
  alternatives_korean:
  - 너는 …라고 말할 수 없습니다
  - 너는 …라고 주장할 수 없습니다
  lexicon: BDAG
  rationale: δύναμαι + 부정 부정사구를 자연스러운 한국어 가능 표현으로 옮기되, 왕의 도전적 말투를 살려 단순한 정보 전달보다 ‘말할 수 없다’는 직접적 도전을 유지했습니다.
- source_word: οὐκ ἔστιν οὗτος θεὸς ζῶν
  english_pob_choice: this is not a living god
  chosen_korean: 이것이 살아 있는 신이 아니라고
  alternatives_korean:
  - 이것이 살아 있는 신이 아니라고
  - 이것은 살아 있는 신이 아니라고
  lexicon: BDAG
  rationale: θεὸς ζῶν은 관용적으로 ‘살아 있는 신’으로 옮겨 idol Bel에 대한 왕의 발화를 그대로 드러내며, 문맥상 참하나님 칭호가 아니라 이교 신을 가리키므로 ‘하나님’ 대신 ‘신’을 택했습니다.
- source_word: προσκύνησον αὐτῷ
  english_pob_choice: bow down to him
  chosen_korean: 그에게 절하십시오
  alternatives_korean:
  - 그에게 절하십시오
  - 그를 경배하십시오
  lexicon: BDAG
  rationale: προσκυνέω의 핵심 동작인 몸을 굽혀 엎드림을 우선 살려 ‘절하다’로 옮겼습니다. 문맥상 종교적 경배까지 포함되지만, 본문 자체는 물리적 행위를 직접 말하므로 더 구체적인 표현을 택했습니다.
- source_word: ὁ βασιλεὺς
  english_pob_choice: the king
  chosen_korean: 왕이
  alternatives_korean:
  - 그 왕이
  - 왕이
  lexicon: BDAG
  rationale: 관사는 한국어에서 보통 생략되므로 서사체의 자연스러운 주어 표지로 처리했습니다.
theological_decisions:
- issue: θεὸς ζῶν을 참하나님 칭호처럼 보이게 할지 여부
  chosen_reading: ‘살아 있는 신’으로 소문자적·비고백적 표현을 유지했습니다.
  alternative_readings:
  - ‘살아 계신 하나님’
  - ‘살아 있는 하나님’
  rationale: 발화자는 이스라엘의 고백이 아니라 바벨론 왕이며, 문맥의 아이러니를 보존하려면 하나님의 전통적 칭호로 바꾸지 않는 편이 원문에 가깝습니다.
  doctrine_reference: 원문 우선 원칙; 해석적 신학어의 과잉 주입을 피함.
- issue: προσκυνέω의 종교적 색채를 본문에 얼마나 드러낼지
  chosen_reading: ‘절하십시오’로 물리적 동작을 앞세웠습니다.
  alternative_readings:
  - ‘경배하십시오’
  - ‘예배하십시오’
  rationale: 이 동사는 상황에 따라 경배를 뜻할 수 있지만, 본문 자체는 ‘엎드리다/절하다’의 동작을 말합니다. 종교적 함의는 이야기 전체가 전달하므로 본문에서는 과도한 신학적 확장을 피했습니다.
  doctrine_reference: optimal equivalence; 문맥이 아닌 번역어 자체로 의미를 과잉 규정하지 않음.
