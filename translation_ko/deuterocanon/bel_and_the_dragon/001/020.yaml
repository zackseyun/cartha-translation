  terminology: ‘발자국’은 이 장면의 눈에 보이는 발의 흔적에 알맞고, ‘남자와 여자와 아이들’은 원문의 구별을 현대적이며 중립적인 표준어로 유지합니다. 신학적 용어 및 주석 앵커는 해당 없습니다.
