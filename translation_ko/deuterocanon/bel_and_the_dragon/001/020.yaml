  source_fidelity: 그리스어의 직접 의문 τίνος τὰ ἴχνη ταῦτα와 왕의 발언을 충실히 옮겼습니다. ‘누구의’, ‘발자국’, ‘남자와 여자와 아이들’은 각각 소유를 묻는 의문, 발로 남은 흔적, 성인 남성·여성·어린이의 열거를 적절히 보존합니다. 한국어에서 ‘이 발자국’은 복수의 발자국 무리를 집합적으로 가리킬 수 있어 원문의 복수와 의미상 충돌하지 않습니다.
