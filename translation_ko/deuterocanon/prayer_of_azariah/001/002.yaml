base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/002.yaml
  text: Then Azariah stood and prayed thus[a], and opening his mouth he gave thanks to the Lord together with his companions in the midst of the fire, while the furnace was being intensely heated by the Chaldeans. And they said,
  footnotes:
  - marker: a
    text: Or 'gave thanks' or 'praised'; the Greek verb can carry either confession or thanksgiving/praise depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 아자리야가 일어나 이와 같이 기도하고, 입을 열어 칼대아 사람들이 풀무를 몹시 달구고 있는 동안 불 한가운데에서 자기 동료들과 함께 주님께 감사드렸습니다.[a] 그리고 그들이 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ‘ἐξωμολογεῖτο’는 문맥에 따라 ‘감사드리다’, ‘고백하다’, 또는 ‘찬양하다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: στὰς δὲ Ἀζαρίας
  english_pob_choice: Then Azariah stood
  chosen_korean: 그때 아자리야가 일어나
  alternatives_korean:
  - 그리고 아자리야가 서서
  - 아자리야가 일어나
  lexicon: LSJ
  rationale: 서사적 동작을 자연스러운 합쇼체로 옮기되, 단순히 ‘서다’보다 이어지는 기도 행위로 자연스럽게 연결되는 ‘일어나’로 처리했습니다.
- source_word: προσηύξατο οὕτως
  english_pob_choice: prayed thus
  chosen_korean: 이와 같이 기도하고
  alternatives_korean:
  - 이렇게 기도하고
  - 그와 같이 기도하고
  lexicon: LSJ
  rationale: 기도의 내용을 뒤에 직접 펼칠 것을 예고하는 표현이므로 ‘이와 같이’가 문체와 구조를 가장 잘 살립니다.
- source_word: ἐξωμολογεῖτο
  english_pob_choice: gave thanks
  chosen_korean: 감사드렸습니다
  alternatives_korean:
  - 고백했습니다
  - 찬양했습니다
  lexicon: LSJ
  rationale: 이 동사는 문맥에 따라 감사, 고백, 찬양을 모두 담을 수 있으므로, 영어 POB의 최종 선택을 따라 감사의 뉘앙스를 살리되 한국어에서도 예배적 공손성을 유지했습니다.
- source_word: ἐν μέσῳ τῷ πυρί
  english_pob_choice: in the midst of the fire
  chosen_korean: 불 한가운데에서
  alternatives_korean:
  - 불 가운데에서
  - 불 속 한가운데서
  lexicon: LSJ
  rationale: 장면의 긴박함과 위치 관계를 분명하게 드러내는 자연스러운 표현으로 옮겼습니다.
- source_word: ὑποκαιομένης τῆς καμίνου ὑπὸ τῶν Χαλδαίων σφόδρα
  english_pob_choice: while the furnace was being intensely heated by the Chaldeans
  chosen_korean: 용광로는 칼대아 사람들에 의해 몹시 달궈지고 있었습니다
  alternatives_korean:
  - 용광로는 칼대아 사람들에 의해 매우 뜨겁게 달궈지고 있었습니다
  - 용광로는 칼대아 사람들에 의해 한창 달궈지고 있었습니다
  lexicon: LSJ
  rationale: ὑποκαιομένης의 ‘아래에서 더해지는 가열’ 감각을 ‘달궈지고 있었습니다’로 살리고, σφόδρα는 ‘몹시’로 강화했습니다.  Χαλδαῖοι는 원문대로 ‘칼대아 사람들’로 유지했습니다.
theological_decisions:
- issue: ἐξωμολογεῖτο의 의미 범위
  chosen_reading: 감사드렸습니다
  alternative_readings:
  - 고백했습니다
  - 찬양했습니다
  rationale: 이 절은 찬양만이 아니라 하나님 앞에서의 응답과 인정의 성격을 함께 가지므로, 문맥상 자연스럽고 경건한 ‘감사드렸습니다’를 택하되 다른 가능한 의미를 보존했습니다.
  doctrine_reference: 의미를 하나로 과도하게 환원하지 말고, 문맥이 허용하는 감사·고백·찬양의 긴장을 유지합니다.
- issue: 고대 유대-바빌론 문맥의 고유명사 처리
  chosen_reading: 칼대아 사람들
  alternative_readings:
  - 바빌로니아 사람들
  rationale: 원문이 명시적으로 Χαλδαίων을 사용하므로 역사적 일반화보다 원문 표지를 우선해 번역했습니다.
  doctrine_reference: 원문 고유 표현을 보존해 서사적·신학적 지시를 흐리지 않습니다.
