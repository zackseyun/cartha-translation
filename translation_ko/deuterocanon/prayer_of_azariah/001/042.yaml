  - 주인
  rationale: 예배적 호칭이므로 한국어 독자에게 가장 자연스럽고 경건한 ‘주님’을 택했습니다. 이 구절은 하나님을 향한 직접 찬양이어서 인칭 대명사보다 호칭형이 더 적절합니다.
