translation:
  language: ko
  text: 모든 영들아, 주님을 찬양하십시오. 노래로 찬양하며 그분을 영원히 높이십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘영들’은 ‘바람들’로도 이해될 수 있으나, 여기서는 호칭형 복수로 읽었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  english_pob_choice: Bless
  chosen_korean: 찬양하십시오
  alternatives_korean:
  - 복을 빕니다
  - 축복하십시오
  lexicon: BDAG
  rationale: 여기서는 피조물이 하나님을 향해 드리는 찬양 명령이므로, 한국어로는 ‘축복하다’보다 예배적 의미가 분명한 ‘찬양하다’가 자연스럽고 오해가 적습니다.
- source_word: πάντα τὰ πνεύματα
  english_pob_choice: all spirits
  chosen_korean: 모든 영들
  alternatives_korean:
  - 모든 바람들
  - 모든 숨결들
  lexicon: BDAG
  rationale: 문맥상 호칭형 복수어로 읽는 것이 가장 직접적이어서 ‘영들’로 옮겼습니다. ‘바람들’은 가능한 대안이지만, 본문 흐름상 영적 존재들을 부르는 말로 이해하는 편이 더 적절합니다.
- source_word: ὑμνεῖτε
  english_pob_choice: sing praise
  chosen_korean: 노래로 찬양하며
  alternatives_korean:
  - 찬송하며
  - 찬가를 부르며
  lexicon: BDAG
  rationale: 동사는 노래하는 찬양의 뉘앙스를 가지므로, 단순한 ‘찬양하다’보다 음악적 행위를 드러내는 ‘노래로 찬양하다’가 원문의 힘을 잘 살립니다.
- source_word: ὑπερυψοῦτε
  english_pob_choice: highly exalt
  chosen_korean: 높이십시오
  alternatives_korean:
  - 크게 높이십시오
  - 더없이 높이십시오
  lexicon: BDAG
  rationale: 복합동사의 강조를 살리기 위해 ‘높이다’에 강조를 얹었으며, 한국어에서 과도하게 장황하지 않으면서도 숭고한 어감을 주는 ‘높이십시오’를 선택했습니다.
- source_word: εἰς τοὺς αἰῶνας
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 세세토록
  - 영원까지
  lexicon: BDAG
  rationale: 관용적으로 무한한 지속을 나타내는 표현이므로, 현대 한국어에서 가장 분명한 ‘영원히’로 옮겼습니다.
theological_decisions:
- issue: κύριος의 존칭 처리
  chosen_reading: 주님
  alternative_readings:
