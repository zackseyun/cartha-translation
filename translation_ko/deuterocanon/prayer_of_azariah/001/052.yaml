  text: Bless the Lord, mountains and hills; sing praise and highly exalt him forever.
translation:
  language: ko
  text: 산과 언덕들아, 주를 찬송하여라. 그를 노래로 찬양하고 영원토록 크게 높여라.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘축복하여라’이지만, 한국어에서는 피조물이 하나님을 향해 드리는 찬양의 명령문에 ‘찬송하다’가 더 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  english_pob_choice: Bless
  chosen_korean: 찬송하여라
  alternatives_korean:
  - 축복하여라
  - 찬양하여라
  lexicon: BDAG
  rationale: 대상이 피조물인 산과 언덕이므로 하나님께 선을 ‘빌어 준다’는 직역보다, 이 찬양 문맥에 맞는 예배적 외침인 ‘찬송하다’가 자연스럽고 소스의 도수적 반복을 살립니다.
- source_word: ὄρη καὶ βουνοί
  english_pob_choice: mountains and hills
  chosen_korean: 산과 언덕들
  alternatives_korean:
  - 산들과 언덕들
  - 산과 고개들
  lexicon: LSJ
  rationale: 평행구를 그대로 살리기 위해 두 지형 명사를 병렬로 옮겼고, 시적 호격을 드러내기 위해 ‘-아’ 호소형을 붙였습니다.
- source_word: ὑμνεῖτε
  english_pob_choice: sing praise
  chosen_korean: 노래로 찬양하고
  alternatives_korean:
  - 찬가를 불러
  - 찬송하며
  lexicon: BDAG
  rationale: 단순한 ‘찬양하다’보다 노래 행위가 분명해야 하므로, 음악적 뉘앙스를 드러내는 ‘노래로’와 ‘찬양하다’를 결합했습니다.
- source_word: ὑπερυψοῦτε
  english_pob_choice: highly exalt
  chosen_korean: 크게 높여라
  alternatives_korean:
  - 한없이 높여라
  - 지극히 높여라
  lexicon: LSJ
  rationale: 접두사가 주는 강화를 한국어에서 과장 없이 살리기 위해 ‘크게’로 옮겼습니다. 과도한 종교어법보다 현대 합쇼체 시어에 맞습니다.
theological_decisions:
- issue: κύριον의 호칭 처리
  chosen_reading: 주
  alternative_readings:
  - 야훼
  - 주님
  rationale: 본문은 헬라어 κύριον을 직접 가리키므로, 히브리어 사본의 야훼를 끌어오지 않고 표준적인 예배 호칭 ‘주’를 유지했습니다. 호격 시에서도 본문 장르에 맞는 간결성이 우선합니다.
  doctrine_reference: 'Contested terms: κύριος → 주'
- issue: 반복적 종결구 εἰς τοὺς αἰῶνας의 지속성
  chosen_reading: 영원토록
  alternative_readings:
  - 세세토록
  - 영원히
  rationale: 문맥상 전례적 상투구이지만, 한국어에서는 ‘영원토록’이 반복되는 찬양문과 가장 잘 어울리며 시간적 지속을 분명히 드러냅니다.
  doctrine_reference: Doxological formula
