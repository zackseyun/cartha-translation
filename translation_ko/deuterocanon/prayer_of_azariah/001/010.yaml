lexical_decisions:
- source_word: ἀνοῖξαι τὸ στόμα
  english_pob_choice: open our mouth
  chosen_korean: 입을 열 수 없습니다
  alternatives_korean:
  - 입을 열지 못합니다
  - 말할 수 없습니다
  lexicon: BDAG
  rationale: στόμα를 포함한 관용구를 자연스럽게 살리되, 단순히 ‘말하다’로 평면화하지 않고 발화 불능의 상태를 드러내기 위해 ‘입을 열 수 없습니다’로 옮겼습니다.
- source_word: αἰσχύνη
  english_pob_choice: shame
  chosen_korean: 수치
  alternatives_korean:
  - 부끄러움
  - 치욕
  lexicon: LSJ
  rationale: 공적 맥락에서의 수치스러움을 분명히 하기 위해 ‘수치’를 택했습니다. 뒤의 ὄνειδος와 함께 두 겹의 수치감을 형성합니다.
- source_word: ὄνειδος
  english_pob_choice: reproach
  chosen_korean: 모욕
  alternatives_korean:
  - 비난
  - 치욕
  lexicon: LSJ
  rationale: ὄνειδος의 공개적 조롱·비난의 뉘앙스를 살리기 위해 ‘모욕’을 택했습니다. ‘수치’와 짝지어 외부로부터 받은 수모를 드러냅니다.
- source_word: δούλων σου
  english_pob_choice: your slaves
  chosen_korean: 주님의 종들
  alternatives_korean:
  - 주님의 노예들
  - 주님의 종
  lexicon: BDAG
  rationale: 기본 용례상 δοῦλος는 ‘종’이지만, 본문이 하나님께 속한 의존적 신분을 강조하므로 의미상 종속성을 해치지 않는 범위에서 ‘주님의 종들’로 옮겼습니다. 한국어의 ‘노예들’은 지나치게 현대적·충격적으로 들릴 수 있어 본문 흐름을 해칠 우려가 있습니다.
- source_word: τῶν σεβομένων σε
  english_pob_choice: those who revere you
  chosen_korean: 주님을 경외하는 이들
  alternatives_korean:
  - 주님을 두려워하는 이들
  - 주님을 공경하는 이들
  lexicon: BDAG
  rationale: σεβομένων은 단순한 감정적 ‘두려움’보다 경건한 존중과 예배적 경외를 포함하므로 ‘경외하는 이들’이 가장 균형 있게 전달합니다.
theological_decisions:
- issue: δοῦλοι의 한국어 처리와 하나님께 대한 자기호칭
  chosen_reading: 주님의 종들
  alternative_readings:
  - 주님의 노예들
  - 주님의 종
  rationale: 영어 POB는 δοῦλοι의 소속성과 종속성을 살리기 위해 ‘slaves’를 취했지만, 한국어 본문에서는 예배적 기도문으로서의 수용성을 고려해 ‘종들’을 사용했습니다. 다만 주격·소속 표현인 ‘주님의’로 하나님께 대한 절대적 귀속을 유지했습니다.
