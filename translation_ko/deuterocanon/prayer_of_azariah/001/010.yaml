translation:
  language: ko
  text: 그리고 이제 우리는 입을 열 수 없습니다. 수치와 모욕이 주님의 노예들과 주님을 경외하는 이들 위에 임했습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 종들과’. 그리스어 δοῦλοι는 문자적으로 ‘노예들’을 뜻하며, 소속과 종속의 관계를 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοῖξαι τὸ στόμα
  english_pob_choice: open our mouth
  chosen_korean: 입을 열 수 없습니다
  alternatives_korean:
  - 입을 열지 못합니다
  - 말할 수 없습니다
  lexicon: BDAG
  rationale: στόμα를 포함한 관용구를 자연스럽게 살리되, 단순히 ‘말하다’로 평면화하지 않고 발화 불능의 상태를 드러내기 위해 ‘입을 열 수 없습니다’로 옮겼습니다.
- source_word: αἰσχύνη
  english_pob_choice: shame
  chosen_korean: 수치
  alternatives_korean:
