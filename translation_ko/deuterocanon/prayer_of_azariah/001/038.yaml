  - 하나님
  rationale: 이 찬양 문맥에서 κύριος는 예배 대상에 대한 직접 호칭으로 기능하므로, 한국어 신앙어법에 맞는 '주님'을 사용했습니다.
  doctrine_reference: 'POB contested terms: κύριος → 주님'
- issue: 수신자 범위의 분배적 표현
  chosen_reading: 모든 권능
  alternative_readings:
  - 모든 힘
  - 각 권능
  - 모든 권세
  rationale: 본문은 창조된 모든 힘/능력의 총체를 찬양으로 부르라는 초청이므로, 특정 천상 존재로 한정하거나 정치적 권세로 바꾸지 않았습니다.
  doctrine_reference: 'source syntax: πᾶσα ἡ δύναμις'
