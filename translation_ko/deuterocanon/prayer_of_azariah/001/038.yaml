base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/038.yaml
  text: Let every power bless the Lord[a]; sing praise and highly exalt him forever.
  footnotes:
  - marker: a
    text: Or 'all powers bless the Lord.' The Greek has singular δύναμις with πᾶσα, which may be understood distributively or collectively.
