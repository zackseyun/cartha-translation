translation:
  language: ko
  text: 모든 권능이 주님을 찬송하게 하십시오[a]; 노래하여 찬양하고 영원히 그분을 높이십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “모든 권능이 주님을 찬송하게 하라.” 그리스어는 단수 δύναμις에 πᾶσα가 붙어 있어 분배적으로도, 집합적으로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογείτω
  english_pob_choice: Let ... bless
  chosen_korean: 찬송하게 하십시오
  alternatives_korean:
  - 축복하게 하십시오
  - 복을 빌게 하십시오
  lexicon: BDAG
  rationale: 3인칭 명령형의 권고를 한국어 합쇼체로 자연스럽게 옮기면서, 하나님을 향한 예배적 행위라는 문맥을 살려 '찬송하다'를 택했습니다.
- source_word: πᾶσα ἡ δύναμις
  english_pob_choice: every power
  chosen_korean: 모든 권능
  alternatives_korean:
  - 모든 힘
  - 모든 능력
  - 각 권능
  lexicon: LSJ
  rationale: 단수 δύναμις에 πᾶσα가 붙은 집합적·분배적 표현을 한국어에서는 자연스럽게 '모든 권능'으로 옮겨, 특정 존재군으로 좁히지 않도록 했습니다.
- source_word: ὑμνεῖτε καὶ ὑπερυψοῦτε
  english_pob_choice: sing praise and highly exalt
  chosen_korean: 노래하여 찬양하고 … 높이십시오
  alternatives_korean:
  - 찬송하고 크게 높이십시오
  - 찬가를 부르고 지극히 높이십시오
  lexicon: LSJ
  rationale: ὑμνεῖτε의 노래하는 찬양과 ὑπερυψοῦτε의 강한 고양 의미를 둘 다 살리되, 현대 한국어 예배 문맥에 맞게 압축했습니다.
- source_word: εἰς τοὺς αἰῶνας
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 영원까지
  - 세세토록
  lexicon: BDAG
  rationale: 지속 기간을 관용적으로 전하는 표현으로, 본문의 장구한 시간감을 가장 자연스럽게 전달합니다.
theological_decisions:
- issue: κύριος의 한국어 처리
  chosen_reading: 주님
  alternative_readings:
