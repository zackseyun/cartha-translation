  yaml_path: translation/deuterocanon/prayer_of_azariah/001/066.yaml
  text: Give thanks to the Lord[a], for he is good, for his mercy endures forever.
  footnotes:
  - marker: a
    text: Or, 'his steadfast love endures forever.' The Greek says 'his mercy is forever,' but the phrase may carry broader covenant-loyalty overtones in this liturgical refrain.
    reason: lexical_alternative
translation:
  language: ko
  text: 주께 감사드리십시오[a]. 그분은 선하시며, 그분의 자비는 영원합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분의 변함없는 사랑은 영원합니다.’ 그리스어는 ‘그분의 자비는 영원합니다’라고 말하지만, 이 전례적 반복구는 더 넓은 언약적 충실함의 뉘앙스를 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξομολογεῖσθε
  english_pob_choice: Give thanks
  chosen_korean: 감사드리십시오
  alternatives_korean:
  - 감사하십시오
  - 찬양하십시오
  - 고백하십시오
  lexicon: BDAG
  rationale: 이 전례적 반복구에서는 ἐξομολογέομαι가 죄 고백보다 ‘감사드리다/감사하다’의 뜻으로 쓰이는 것이 자연스럽고, 한국어 예배체에서도 이를 직접적으로 살리는 것이 가장 적절합니다.
- source_word: τῷ κυρίῳ
  english_pob_choice: to the Lord
  chosen_korean: 주께
  alternatives_korean:
  - 주님께
  - 주께서
  lexicon: BDAG
  rationale: 그리스어 κύριος를 프로젝트 기본값에 따라 ‘주’로 옮기되, 감사의 대상임을 분명히 하기 위해 여격 관계를 ‘주께’로 자연스럽게 나타냈습니다.
- source_word: χρηστός
  english_pob_choice: good
  chosen_korean: 선하시며
  alternatives_korean:
  - 좋으시며
  - 인자하시며
  - 자비로우시며
  lexicon: BDAG
  rationale: 이 고정된 찬양 공식에서 χρηστός는 단순한 ‘좋다’보다 하나님의 선하심을 나타내는 예배적 표현으로 한국어 ‘선하시다’가 가장 자연스럽습니다.
- source_word: τὸ ἔλεος αὐτοῦ
  english_pob_choice: his mercy
  chosen_korean: 그분의 자비
  alternatives_korean:
  - 그분의 긍휼
  - 그분의 인자하심
  - 그분의 사랑
  lexicon: BDAG
  rationale: ἔλεος의 직접적인 의미는 ‘자비/긍휼’이므로, 본문에 명시되지 않은 히브리식 언약어를 앞세우지 않고 원문 의미를 가장 곧게 살렸습니다.
theological_decisions:
- issue: ἔλεος의 언약적 뉘앙스 처리
  chosen_reading: 그분의 자비는 영원합니다
  alternative_readings:
  - 그분의 인자하심은 영원합니다
  - 그분의 언약적 사랑은 영원합니다
  rationale: 원문은 ἔλεος를 사용하므로 본문은 ‘자비’로 유지하되, 이 전례적 반복구가 지닐 수 있는 더 넓은 언약적 울림은 직역을 해치지 않는 범위에서만 열어 둡니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
