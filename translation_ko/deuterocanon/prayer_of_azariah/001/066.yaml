base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/066.yaml
  text: Give thanks to the Lord[a], for he is good, for his mercy endures forever.
  footnotes:
  - marker: a
    text: Or, 'his steadfast love endures forever.' The Greek says 'his mercy is forever,' but the phrase may carry broader covenant-loyalty overtones in this liturgical refrain.
