  lexicon: BDAG
  rationale: 동사의 노래하는 성격을 드러내기 위해 ‘노래로’와 ‘찬양하다’를 함께 써서, 단순한 일반 찬양보다 음악적 뉘앙스를 살렸습니다.
- source_word: ὑπερυψοῦτε
