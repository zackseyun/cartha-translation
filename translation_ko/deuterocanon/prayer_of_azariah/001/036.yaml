  text: Bless the Lord, O heavens; sing praise to him and highly exalt him forever.
translation:
  language: ko
  text: 하늘들이여, 주님을 찬송하십시오. 그분을 노래로 찬양하고 영원히 높이 드십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  english_pob_choice: Bless
  chosen_korean: 찬송하십시오
  alternatives_korean:
  - 복을 빌어드리십시오
  - 축복하십시오
  - 찬양하십시오
  lexicon: BDAG
  rationale: 이 문맥에서는 하늘들을 향해 하나님을 향한 예배적 찬송을 명령하므로, 단순한 ‘축복하다’보다 한국어 예배어감이 살아 있는 ‘찬송하십시오’가 자연스럽습니다.
- source_word: οὐρανοί
  english_pob_choice: O heavens
  chosen_korean: 하늘들이여
  alternatives_korean:
  - 오 하늘들이여
  - 하늘이여
  - 하늘들이
  lexicon: LSJ
  rationale: 호격 복수의 직접 호소를 살리기 위해 ‘-이여’를 붙였고, 영어의 감탄형보다 한국어 시적 호격에 맞게 다듬었습니다.
- source_word: ὑμνεῖτε
  english_pob_choice: sing praise
  chosen_korean: 노래로 찬양하고
  alternatives_korean:
  - 찬송하며
  - 노래하며 찬송하고
  - 찬양하십시오
  lexicon: BDAG
  rationale: 동사의 노래하는 성격을 드러내기 위해 ‘노래로’와 ‘찬양하다’를 함께 써서, 단순한 일반 찬양보다 음악적 뉘앙스를 살렸습니다.
- source_word: ὑπερυψοῦτε
  english_pob_choice: highly exalt
  chosen_korean: 높이 드십시오
  alternatives_korean:
  - 크게 높이십시오
  - 지극히 높이십시오
  - 더욱 높이십시오
  lexicon: LSJ
  rationale: 강조 접두사가 있는 동사이므로 ‘높이다’의 강한 명령형으로 옮겨, 과도한 의역 없이 고양된 찬가의 힘을 보존했습니다.
theological_decisions:
- issue: κύριος의 번역을 ‘주님’으로 할지 ‘주’로 할지
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 주인
  rationale: 여기서는 하나님을 향한 찬가의 직접 주소이므로 한국어 예배 문맥에서 가장 자연스럽고 경외감이 분명한 ‘주님’을 택했습니다.
  doctrine_reference: 'POB glossary: κύριος (of Jesus) → 주(主) / 주님; deuterocanonical hymnic address to God'
- issue: εἰς τοὺς αἰῶνας의 시간 표현
  chosen_reading: 영원히
  alternative_readings:
  - 세세토록
  - 영원한 세월까지
  - 세세 무궁하도록
  rationale: 그리스어 관용구의 지속성과 종결 없는 지속을 가장 간결하게 드러내는 한국어 표준 표현으로 옮겼습니다.
