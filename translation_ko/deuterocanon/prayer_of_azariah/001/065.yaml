base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/065.yaml
  text: Bless the Lord[a], Hananiah, Azariah, and Mishael; sing praise to him and highly exalt him forever. For he has delivered us from Hades, and saved us from the hand of death, and rescued us from the midst of the burning flame, and redeemed us from the fire.
  footnotes:
  - marker: a
    text: Or 'from the grave.' The Greek reads 'from Hades,' the realm of the dead.
    reason: alternative_reading
translation:
  language: ko
  text: 하나냐와 아사랴와 미사엘아, 주님을 찬양하십시오. 그분을 노래로 찬송하고 영원토록 지극히 높이십시오. 그분께서 우리를 하데스에서 건져 내셨고, 죽음의 손에서 구원하셨고, 타오르는 불꽃 한가운데서 우리를 구출하셨으며, 불에서 우리를 속량하셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무덤에서’. 그리스어 본문은 죽은 자들의 영역을 가리키는 ‘하데스’를 사용합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐλογεῖτε
  english_pob_choice: Bless
  chosen_korean: 찬양하십시오
  alternatives_korean:
  - 복을 빕니다
  - 축복하십시오
  - 찬송하십시오
  lexicon: BDAG
  rationale: 주님께 향하는 예배적 명령문으로서 ‘bless’의 직설적 힘을 살리면서도 한국어에서는 ‘찬양하십시오’가 가장 자연스럽고 문맥상 적절합니다.
- source_word: τὸν κύριον
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주인
  lexicon: BDAG
  rationale: 이 문맥의 κύριος는 하나님의 칭호이므로 프로젝트 기본값에 따라 ‘주님’으로 옮겼습니다.
- source_word: ὑμνεῖτε καὶ ὑπερυψοῦτε
  english_pob_choice: sing praise ... highly exalt
  chosen_korean: 노래로 찬송하고 ... 지극히 높이십시오
  alternatives_korean:
  - 찬가를 부르고 ... 크게 높이십시오
  - 찬양하며 ... 높이십시오
  lexicon: BDAG
  rationale: ὑμνεῖτε의 음악적 뉘앙스는 ‘노래로 찬송하고’로, ὑπερυψοῦτε의 강조는 ‘지극히 높이십시오’로 살렸습니다.
- source_word: ἐξ ᾅδου
  english_pob_choice: from Hades
  chosen_korean: 하데스에서
  alternatives_korean:
  - 무덤에서
  - 죽은 자들의 세계에서
  lexicon: BDAG
  rationale: 그리스어 본문이 ᾅδης를 직접 사용하므로, 해석적으로 좁히지 않고 음역 ‘하데스’를 유지했습니다.
- source_word: ἐξείλετο / ἔσωσεν / ἐρρύσατο / ἐλυτρώσατο
  english_pob_choice: has delivered / saved / rescued / redeemed
  chosen_korean: 건져 내시고 / 구원하시고 / 건지시며 / 속량하셨기
  alternatives_korean:
  - 구출하시고 / 살리시고 / 건져 주시며 / 해방하셨기
  lexicon: BDAG
  rationale: 네 동사를 모두 같은 말로 평평하게 만들지 않고, 각각의 구원 동작을 구분해 반복의 수사적 강도를 보존했습니다.
theological_decisions:
- issue: ᾅδης의 번역을 ‘무덤’으로 순화할지 여부
  chosen_reading: 하데스
  alternative_readings:
  - 무덤
  - 죽은 자들의 세계
  rationale: 본문은 단순한 ‘죽음’이나 ‘무덤’이 아니라 ᾅδης를 말하므로, 어휘적 투명성과 원문 긴장을 보존하기 위해 음역을 유지했습니다.
  doctrine_reference: 원어 우선과 의미의 긴장 보존
