base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/062.yaml
  text: Bless the Lord[a], slaves[b]; sing praise to him and highly exalt him forever.
  footnotes:
  - marker: a
    text: Or 'servants' or 'bondservants.' Greek δοῦλοι can denote those in service generally or those in bonded status; the main text keeps the stronger sense.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'for the ages.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님을 찬양하십시오[a], 종들[b]. 그분께 노래로 찬미하고 영원히 그분을 높이십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘복을 빌다/축복하다’입니다. 여기서는 예배적 권면이므로 자연스러운 한국어로는 ‘찬양하십시오’가 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘노예들’입니다. 영어 POB는 원문의 강한 소속감을 살려 ‘slaves’를 유지했으며, 한국어 본문은 예배체의 자연스러움을 고려해 ‘종들’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  english_pob_choice: Bless
  chosen_korean: 찬양하십시오
  alternatives_korean:
  - 복을 빌어드리십시오
  - 축복하십시오
  lexicon: BDAG
  rationale: 여기서는 하나님께 드리는 예배적 권면이므로, 한국어로는 자연스럽고 공적 예배에 맞는 ‘찬양하십시오’가 본문의 방향을 잘 살립니다.
- source_word: δοῦλοι
  english_pob_choice: slaves
  chosen_korean: 종들
  alternatives_korean:
  - 노예들
  - 종들(예속된 종들)
  lexicon: BDAG
  rationale: 영어 POB의 본문은 ‘slaves’로 더 강한 소속·예속의 뉘앙스를 유지하지만, 한국어 합쇼체 본문에서 직설적 ‘노예들’은 예배적 호명으로 과도하게 거칠 수 있어 기본어 ‘종들’로 옮기되, 원문의 강한 소속감을 해치지 않도록 주석으로 보완했습니다.
- source_word: ὑμνεῖτε
  english_pob_choice: sing praise
  chosen_korean: 노래로 찬미하고
  alternatives_korean:
  - 찬송하고
  - 찬미하십시오
  lexicon: BDAG
  rationale: 동사 ὑμνέω의 음악적·찬가적 성격을 살리기 위해 ‘노래로 찬미하고’로 옮겼습니다.
- source_word: ὑπερυψοῦτε
  english_pob_choice: highly exalt
  chosen_korean: 높이십시오
  alternatives_korean:
  - 크게 높이십시오
  - 지극히 높이십시오
  lexicon: BDAG
  rationale: 강조 접두사의 의미는 살리되, 한국어에서는 중복된 부사보다 명령형 동사와 문맥으로 힘을 주는 것이 자연스러워 ‘높이십시오’로 간결하게 옮겼습니다.
- source_word: εἰς τοὺς αἰῶνας
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 세세토록
  - 영원토록
  lexicon: BDAG
  rationale: 직역하면 ‘그 시대들/세대들에 걸쳐’의 관용이지만, 한국어에서는 예배적 영속성을 가장 자연스럽게 드러내는 ‘영원히’가 적절합니다.
theological_decisions:
- issue: δοῦλοι의 한국어 처리와 예배적 호칭의 긴장
  chosen_reading: 본문은 예배를 드리는 이들을 ‘종들’로 부르되, 영어 POB가 유지한 예속성의 강도를 과도하게 완화하지 않도록 주석으로 ‘노예들’ 가능성을 밝혔습니다.
  alternative_readings:
  - 노예들
  - 섬기는 이들
  rationale: 원문 δοῦλοι는 단순한 봉사자보다 소속과 예속의 뉘앙스를 가질 수 있으나, 한국어 본문에서는 예배문맥의 수용성을 고려해 ‘종들’로 유지하는 것이 가장 균형적입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table for δοῦλος; Translation philosophy §1'
