  source_fidelity: 수정이 필요합니다. εὐλογεῖτε는 하나님을 향한 예배 언어로 ‘송축하십시오’가 더 직접적으로 대응하며, ὑμνεῖτε와 ὑπερυψοῦτε의 구별 및 후자의 강화 의미도 ‘찬송하고 … 지극히 높이십시오’로 분명히 살릴 수 있습니다. δοῦλοι는 ‘종들아’로 유지하되 주석에서 ‘노예들’이라는 강한 어감을 밝혀 두는 것이 적절합니다.
  naturalness: 현행 ‘그분께 노래로 찬미하고’는 ‘찬미하다’의 목적어 결합이 다소 어색하고, 호격 ‘종들’도 한국어 문장에서는 ‘종들아’가 자연스럽습니다. 수정문은 현대 공적 예배체와 합쇼체에 맞습니다.
  terminology: ‘주님’, ‘종’, ‘송축’, ‘찬송’, ‘지극히 높이다’, ‘영원히’는 본문의 찬양·송영 문맥에 적합합니다. ‘송축’은 하나님을 사람이 복되게 만든다는 뜻이 아니라 하나님을 복되시다고 찬양한다는 예배적 용법으로 이해되어야 합니다.
