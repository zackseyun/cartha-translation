base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/044.yaml
  text: Bless the Lord[a], frost and cold; sing hymns and highly exalt him forever.
  footnotes:
  - marker: a
    text: Or 'Praise the Lord, frost and cold.' The Greek imperative εὐλογεῖτε can be rendered 'bless' or more generally 'praise'; 'bless' is retained to preserve the refrain of the song.
    reason: lexical_alternative
translation:
  language: ko
  text: 서리와 추위도 주님을 찬송하라[a]. 영원히 그분을 찬양하고 크게 높여 드리라.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님을 찬양하라’. 헬라어 εὐλογεῖτε는 ‘복을 빌다’보다 넓게 ‘찬송하다/찬양하다’로 옮길 수 있으나, 이 노래의 반복되는 후렴을 살리기 위해 ‘찬송하라’를 유지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  english_pob_choice: Bless
  chosen_korean: 찬송하라
  alternatives_korean:
  - 찬양하라
  - 복을 빌어라
  lexicon: BDAG
  rationale: 피조물에게 의인화된 명령으로 하나님을 높이게 하는 문맥이므로, 한국어에서는 ‘찬송하라’가 예배적 호소를 가장 자연스럽게 전달합니다. ‘축복하라’는 의미가 어색하고, ‘찬양하라’는 가능하지만 뒤의 ‘노래하라/높여 드리라’와의 반복성을 덜 살립니다.
- source_word: ῥῖγος καὶ ψῦχος
  english_pob_choice: frost and cold
  chosen_korean: 서리와 추위
  alternatives_korean:
  - 서리와 냉기
  - 동결과 추위
  lexicon: LSJ
  rationale: 두 명사를 구별해 자연 현상 두 가지를 병렬로 부르므로, 한국어에서도 의미가 겹치지 않도록 ‘서리’와 ‘추위’로 나누어 옮겼습니다. ‘냉기’는 다소 문어적이고, ‘동결’은 과도하게 기술적입니다.
- source_word: ὑμνεῖτε
  english_pob_choice: sing hymns
  chosen_korean: 찬양하고
  alternatives_korean:
  - 찬송하며
  - 노래하며
  lexicon: BDAG
  rationale: 직역하면 ‘찬송을 부르라’이지만 한국어에서는 동사 하나로 과도하게 노래 행위를 지정하기보다, 앞선 명령과 병렬되는 예배 행위로 풀어 ‘찬양하고’로 옮겼습니다. 뒤의 ‘크게 높여 드리리’와 함께 송영적 의미를 유지합니다.
- source_word: ὑπερυψοῦτε αὐτὸν
  english_pob_choice: highly exalt him
  chosen_korean: 크게 높여 드리라
  alternatives_korean:
  - 극히 높여 드리라
  - 지극히 높여 드리라
  lexicon: BDAG
  rationale: 복합 동사의 강조를 살리되, 현대 한국어에서 자연스럽고 예배적 어조가 되는 ‘크게 높여 드리라’로 옮겼습니다. ‘높이다’보다 ‘높여 드리다’가 대상을 하나님께 향한 찬양으로 분명하게 합니다.
- source_word: εἰς τοὺς αἰῶνας
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 세세토록
  - 영원토록
  lexicon: BDAG
  rationale: 지속성과 종말 없는 찬양을 나타내는 관용구이므로, 표준 현대어인 ‘영원히’로 간결하게 옮겼습니다. ‘세세토록’은 전통적이지만 다소 교회 문어체에 치우칩니다.
theological_decisions:
- issue: 피조물에 대한 의인화된 명령의 어조
  chosen_reading: 서리와 추위도 주님을 찬송하라
  alternative_readings:
  - 서리와 추위도 주님을 찬양하라
  - 서리와 추위여, 주님을 찬송하라
  rationale: 헬라어는 무생물인 자연 현상들을 직접 부르며 명령하는 시적·예전적 형식이므로, 한국어도 이를 살려 자연을 향한 직접 호명형 명령으로 유지했습니다. 쉼표와 어순을 통해 창조 전체가 예배에 참여하는 이미지를 보존합니다.
  doctrine_reference: 시적 의인화와 창조의 찬양 참여
- issue: κύριος의 번역
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 야훼
  rationale: 이 절은 직접적인 YHWH 인용 표지가 아니라 헬라어 찬송문 내부의 호칭이므로, 한국어 예배 문맥에 자연스러운 ‘주님’을 사용했습니다. 본문의 송영적 흐름을 해치지 않으면서도 경배의 대상을 분명히 합니다.
  doctrine_reference: 'POB 용례: κύριος → 주님'
