translation:
  language: ko
  text: 의인들의 영과 혼들아, 주님을 찬송하십시오[a]. 그분께 찬가를 부르고 영원히 지극히 높이십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님을 찬양하십시오.’
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 직역하면 ‘시대들을 향하여’라는 뜻으로, 지속됨 또는 영원함을 나타내는 전형적인 송영 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  english_pob_choice: Bless
  chosen_korean: 찬송하십시오
  alternatives_korean:
  - 복을 빌어 드리십시오
  - 축복하십시오
  - 찬양하십시오
  lexicon: LXX 일반 용례
  rationale: 직역하면 ‘축복하다’이지만, 피조물이 하나님께 드리는 도식에서는 한국어로 ‘찬송하다’가 가장 자연스럽고 예배적 기능을 살립니다. 다만 다음 동사들과 함께 도합된 송영 어조를 유지합니다.
- source_word: πνεύματα καὶ ψυχαὶ δικαίων
  english_pob_choice: spirits and souls of the righteous
  chosen_korean: 의인들의 영들과 혼들
  alternatives_korean:
  - 의인들의 영과 혼
  - 의로운 자들의 영들과 혼들
  - 의인들의 영적 존재와 혼
  lexicon: BDAG / LXX 구문
  rationale: 그리스어의 이중 표현을 그대로 살려 ‘영들’과 ‘혼들’을 구분해 옮겼습니다. ‘의인들의’은 δικαίων을 두 명사 모두에 걸리게 하며, 본문의 의도된 이중성을 흐리지 않습니다.
- source_word: ὑμνεῖτε
  english_pob_choice: sing hymns
  chosen_korean: 찬가로 높이십시오
  alternatives_korean:
  - 찬송가를 부르십시오
  - 찬가를 부르십시오
  - 찬양 노래를 부르십시오
  lexicon: BDAG
  rationale: ὑμνεῖτε는 단순한 일반 찬양보다 ‘찬가를 부르다’는 음악적·예배적 뉘앙스가 강합니다. 앞의 ‘찬송하십시오’와 어휘 중복을 피하면서 송영의 반복성을 살립니다.
- source_word: ὑπερυψοῦτε
  english_pob_choice: highly exalt
  chosen_korean: 높이십시오
  alternatives_korean:
  - 크게 높이십시오
  - 지극히 높이십시오
  - 매우 높이십시오
  lexicon: BDAG
  rationale: 합성어의 강세를 한국어에서 과장 없이 자연스럽게 전달하기 위해 ‘높이십시오’에 문맥상의 상승 강도를 맡겼습니다. 앞의 ‘찬가로’와 함께 “높여 송영하다”는 구조를 형성합니다.
- source_word: εἰς τοὺς αἰῶνας
  english_pob_choice: forever / for the ages
  chosen_korean: 영원히
  alternatives_korean:
  - 세세토록
  - 영원한 세대에 걸쳐
  - 여러 시대에 걸쳐
  lexicon: BDAG
  rationale: POB가 각주에서 밝히듯 이 표현은 전형적인 송영 공식입니다. 현대 한국어 예배 문맥에서 가장 투명한 대응은 ‘영원히’입니다.
theological_decisions:
- issue: 'εὐλογεῖτε의 방향성: 하나님을 ‘복되게 하다’와 ‘찬송하다’의 긴장'
  chosen_reading: 본문은 하나님께 복을 ‘내리는’ 뜻이 아니라, 예배적 송영으로 하나님을 높이며 찬송하라는 뜻으로 읽었습니다.
  alternative_readings:
  - ‘복을 빌어 드리십시오’처럼 축복 행위의 형식을 보존하는 읽기
  - ‘찬양하십시오’로 일반화하는 읽기
  rationale: 유대-헬라 송영 문맥에서 εὐλογεῖτε는 하나님께 대한 경배 행위로 기능하므로, 한국어에서는 그 기능을 분명하게 드러내는 표현이 필요합니다. 다만 ‘찬송하십시오’는 의미를 너무 평면화하지 않고 예배적 성격을 유지합니다.
  doctrine_reference: 송영어의 예배적 기능과 피조물의 하나님 찬양
- issue: ‘영들과 혼들’의 인류 구성론 여부
  chosen_reading: 두 용어를 분리해 옮기되, 인간 존재론의 교리를 확정하지는 않습니다.
  alternative_readings:
  - ‘영혼들’처럼 합쳐 번역하는 읽기
  - 인간의 이분/삼분 구조를 암시하는 교리화된 읽기
  rationale: 영어 POB가 지적하듯 본문은 두 항을 명시적으로 유지합니다. 번역도 그 긴장을 보존해야 하며, 교리적 체계를 본문에 덧씌우지 않아야 합니다.
  doctrine_reference: 본문의 이중 용어 보존
