  naturalness: ‘의인들의 영들과 혼들아’는 문법상 가능하나 현대 표준어에서는 ‘영과 혼’이 더 자연스럽습니다. 그리스어 복수형은 집단 호격에서 한국어 명사의 복수 표지를 반드시 요구하지 않습니다. ‘그분을 영원히 찬가로 높이십시오’는 ‘찬가로 높이다’의 결합이 부자연스럽습니다.
  terminology: ‘주님’, ‘의인’, ‘영’, ‘혼’, ‘찬송’은 문맥에 적절합니다. πνεύματα와 ψυχαί의 이중 표현은 ‘영과 혼’으로 구별하여 보존해야 하며, 이를 특정 인간론으로 해석하지 않습니다. ὑπερυψοῦτε의 강화는 ‘지극히 높이십시오’로 명시하는 편이 안전합니다.
