translation:
  language: ko
  text: 주[주]의 모든 일들아, 주를 찬송하십시오. 그분을 노래로 찬양하고 영원히 높이십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영원들로’. 그리스어 관용구는 문자적으로 ‘세대들/시대들로’에 가깝지만, 여기서는 지속적 찬양을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  english_pob_choice: Bless
  chosen_korean: 찬송하십시오
  alternatives_korean:
  - 복을 빕니다
  - 축복하십시오
  - 찬양하십시오
  lexicon: BDAG
  rationale: 직역하면 ‘복을 빌다/축복하다’이지만, 이 문맥은 피조물 전체를 향한 예배적 명령이므로 한국어에서는 자연스러운 예배 어휘인 ‘찬송하다’가 원문의 도고적·찬양적 힘을 가장 잘 드러냅니다.
- source_word: πάντα τὰ ἔργα Κυρίου
  english_pob_choice: all the works of the Lord
  chosen_korean: 주의 모든 일들아
  alternatives_korean:
  - 주님의 모든 일들아
  - 주의 모든 작품들아
  - 주께서 하신 모든 일들아
  lexicon: BDAG
  rationale: 영어 POB처럼 주의 소유격 관계를 유지하되, 이 찬가의 직접 호칭 성격을 살려 한국어에서는 호격적 표현으로 옮겼습니다. ‘일들’은 δημιουργήματα식의 시적 범주를 과도하게 구체화하지 않으면서 원문의 포괄성을 보존합니다.
- source_word: ὑμνεῖτε καὶ ὑπερυψοῦτε αὐτὸν
  english_pob_choice: sing praise to him and highly exalt him
  chosen_korean: 그분을 노래로 찬양하고 영원히 높이십시오
  alternatives_korean:
  - 그분께 찬송을 드리고 지극히 높이십시오
  - 그분을 찬미하고 크게 높이십시오
  lexicon: BDAG
  rationale: ὑμνέω는 단순한 ‘찬양’보다 ‘노래로 드리는 찬양’의 뉘앙스가 있어 이를 반영했고, ὑπερυψοῦτε는 ‘높이다’의 강한 강조를 살려 ‘높이십시오’로 옮겼습니다.
- source_word: εἰς τοὺς αἰῶνας
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 세세토록
  - 영원까지
  - 그 시대들로
  lexicon: BDAG
  rationale: 헬라어 관용구의 의미는 지속성과 끝없음을 가리키므로, 예배문맥에서 가장 자연스럽고 간결한 ‘영원히’로 옮겼습니다.
theological_decisions:
- issue: 다수형 명령의 대상과 호격 처리
  chosen_reading: ‘주의 모든 일들아’로 보아 창조/피조 세계 전체를 찬송의 대상으로 삼는 호격적 문장으로 처리했습니다.
  alternative_readings:
  - ‘주의 모든 일들’의 서술적 번역
  - ‘주님의 모든 역사들’로 의미를 좁히는 번역
  rationale: 원문의 πάντα τὰ ἔργα Κυρίου는 예배 시편적 호칭으로 기능하므로, 한국어에서도 대상을 불특정한 피조물 범주로 열어 두는 것이 문맥상 더 적절합니다.
  doctrine_reference: Prayer of Azariah 1:34 doxology; liturgical address
- issue: κύριος의 번역
  chosen_reading: 주
  alternative_readings:
  - 주님
  - 여호와
  rationale: 영어 POB가 Lord를 택한 점을 따라 본문 전체의 예배적 호칭을 유지했습니다. 한국어에서는 직접 호칭과 소유격을 모두 자연스럽게 살리기 위해 ‘주’로 통일했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → Lord'
