translation:
  language: ko
  text: 비와 샘들아, 주를 찬송하십시오. 그분을 노래로 찬양하고 영원히 크게 높이십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  english_pob_choice: Bless
  chosen_korean: 찬송하십시오
  alternatives_korean:
  - 복을 빕니다
  - 축복하십시오
  - 찬양하십시오
  lexicon: BDAG
  rationale: 피조물에게 창조주를 향한 경배적 응답을 요구하는 문맥이므로, 한국어에서는 자연스럽고 예전적인 ‘찬송하십시오’로 옮겨 doxology의 성격을 살렸습니다.
- source_word: ὄμβροι καὶ αἱ πηγαί
  english_pob_choice: rains and springs
  chosen_korean: 비와 샘들
  alternatives_korean:
  - 빗물과 샘들
  - 소나기와 샘들
  - 비와 샘물
  lexicon: LSJ
  rationale: 둘 다 자연계의 수원을 가리키므로, 복수성을 살리면서 현대 한국어에서 가장 곧바로 이해되는 표현인 ‘비와 샘들’로 옮겼습니다.
- source_word: ὑμνεῖτε
  english_pob_choice: sing praise
  chosen_korean: 노래로 찬양하고
  alternatives_korean:
  - 찬송하고
  - 찬가를 드리고
  - 노래하여 찬송하고
  lexicon: BDAG
  rationale: 동사가 단순한 말의 찬양보다 노래하는 찬양을 뜻하므로, ‘노래로 찬양하고’로 음악적·예전적 뉘앙스를 드러냈습니다.
- source_word: ὑπερυψοῦτε
  english_pob_choice: highly exalt
  chosen_korean: 크게 높이십시오
  alternatives_korean:
  - 지극히 높이십시오
  - 높이 높이십시오
  - 매우 높이십시오
  lexicon: LSJ
  rationale: 강한 강조를 가진 동사이므로, 직역투를 피하면서도 상승의 강도를 살리는 ‘크게 높이십시오’를 선택했습니다.
- source_word: εἰς τοὺς αἰῶνας
