translation:
  language: ko
  text: 주님께서 그들에게 말씀하시기를, 그들의 씨가 하늘의 별들만큼 수없이 많아지고 바닷가의 모래만큼 많아질 것이라고 하신 대로입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 후손’, ‘그들의 자손’. 그리스어는 ‘그들의 씨’라고 하여 족장들에게 주신 약속의 표현을 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλησας / λέγων
  english_pob_choice: you spoke / saying
  chosen_korean: 말씀하시되
  alternatives_korean:
  - 말씀하셨고
  - 말하며
  - 이르시며
  lexicon: BDAG
  rationale: 하나님께 직접 드리는 회고적 진술로서 ‘말씀하시되’가 원문의 장중함을 살리면서도 한국어 문맥에 자연스럽습니다.
- source_word: πρὸς αὐτοὺς
  english_pob_choice: to them
  chosen_korean: 그들에게
  alternatives_korean:
  - 그들과
  - 그들을 향하여
  lexicon: BDAG
  rationale: πρός + 대격의 방향성을 가장 간결하게 드러내는 표현입니다.
- source_word: τὸ σπέρμα αὐτῶν
  english_pob_choice: their seed
  chosen_korean: 그들의 씨
  alternatives_korean:
  - 그들의 후손
  - 그들의 자손
  lexicon: BDAG
  rationale: 영어 POB의 ‘seed’를 따라 언약적-성경적 울림을 유지했습니다. ‘후손/자손’보다 직역성이 높아 아브라함 언약의 반향을 보존합니다.
- source_word: ὡς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει
  english_pob_choice: like the stars of heaven in number
  chosen_korean: 하늘의 별들처럼 수적으로 많아지고
  alternatives_korean:
  - 하늘의 별들처럼 많아지고
  - 하늘의 별들과 같이 그 수가 많아지고
  lexicon: LSJ
  rationale: τῷ πλήθει를 단순 비교가 아니라 ‘수적 많음’의 기준으로 살려, 의미를 분명히 하기 위해 ‘수적으로 많아지고’로 옮겼습니다.
- source_word: ὡς τὴν ἄμμον τὴν παρὰ τὸ χεῖλος τῆς θαλάσσης
  english_pob_choice: like the sand by the shore of the sea
  chosen_korean: 바다의 해변가에 있는 모래처럼
  alternatives_korean:
  - 바닷가의 모래처럼
  - 바다 해변의 모래처럼
  lexicon: BDAG
  rationale: χείλος의 문자적 ‘끝/가장자리’가 한국어 관용에서 ‘해변가’로 가장 자연스럽게 드러납니다. ‘있는’은 위치 관계를 보완하는 최소한의 보충입니다.
theological_decisions:
- issue: 언약적 σπέρμα의 보존 여부
  chosen_reading: ‘씨’로 옮겨 언약 약속의 상호본문적 울림을 보존했습니다.
  alternative_readings:
  - 후손
  - 자손
  rationale: 이 절은 족장들에게 주신 약속을 직접 상기시키므로, 완곡한 혈통 표현보다 원문적·언약적 어휘를 유지하는 편이 본문 의도를 더 잘 전달합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 5
