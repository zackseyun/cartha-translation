- from: 곧바로 말씀하신 것처럼 그들에게 말씀하시되, 그들의 씨가 하늘의 별들처럼 수적으로 많아지고, 바다의 해변가에 있는 모래처럼 많아질 것이라고 하셨습니다.[a]
  to: 주님께서 그들에게 말씀하시기를, 그들의 씨가 하늘의 별들만큼 수없이 많아지고 바닷가의 모래만큼 많아질 것이라고 하신 대로입니다.[a]
  rationale: ὡς를 ‘~하신 대로’로 바로잡고, 말씀의 내용은 ‘말씀하시기를 … 것이라고 하신’으로 재구성했습니다. πολυπληθῦναι의 미래 약속의 뉘앙스는 ‘많아질 것’으로 유지했으며, τῷ πλήθει는 ‘수없이’로 자연스럽게 반영했습니다. ‘씨’는 본문과 각주 모두에서 유지하여 σπέρμα의 어휘적 반향을 보존했습니다.
