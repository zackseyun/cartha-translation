  source_fidelity: ‘곧바로’는 ὡς(‘~처럼/~대로’)를 시간 부사로 잘못 옮긴 것이므로 수정이 필요합니다. 또한 ἐλάλησας πρὸς αὐτοὺς λέγων은 ‘그들에게 말씀하시기를 … 하신’으로 자연스럽게 재구성할 수 있습니다. σπέρμα의 비유적·언약적 표현인 ‘씨’와 두 비교 표현은 유지했습니다.
  naturalness: 현행 문장은 ‘말씀하신 것처럼 그들에게 말씀하시되’로 동사가 중복되고 연결이 부자연스럽습니다. ‘주님께서 그들에게 말씀하시기를 … 하신 대로입니다’는 독립 절로도 자연스럽고 합쇼체 기도 문맥에 맞습니다. ‘바다의 해변가’는 중복적이므로 ‘바닷가’로 다듬었습니다.
  terminology: ‘씨’는 원문의 σπέρμα 및 족장 약속의 어휘적 반향을 보존하는 적절한 선택입니다. 각주에서 ‘후손’과 ‘자손’을 자연스러운 대안으로 제시하는 것도 적절합니다.
