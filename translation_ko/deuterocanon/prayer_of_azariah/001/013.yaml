    rationale: ὡς는 여기서 ‘~처럼/~대로’를 뜻하는 비교·상응 표현이며, ‘곧바로’(immediately)라는 시간 의미가 아닙니다.
  - severity: medium
    issue: 동사 중복 및 문장 연결의 부자연스러움
    rationale: ‘말씀하신 것처럼 그들에게 말씀하시되’는 ἐλάλησας와 λέγων을 중복적으로 처리하여 한국어 문장이 어색해집니다.
