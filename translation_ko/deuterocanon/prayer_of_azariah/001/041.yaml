    text: 또는 ‘모든 비와 이슬이여’. 그리스어 πᾶς ὄμβρος καὶ δρόσος는 분배적으로 ‘각 비와 이슬’ 또는 집합적으로 ‘모든 비와 이슬’로 읽을 수 있습니다.
    reason: lexical_alternative
