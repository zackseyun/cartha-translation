  text: Bless the Lord[a], all rain and dew; sing praise to him and highly exalt him forever.
  footnotes:
  - marker: a
    text: Or 'all rain and dew.' The Greek phrase πᾶς ὄμβρος καὶ δρόσος can be taken distributively ('every rain and dew') or collectively ('all rain and dew').
