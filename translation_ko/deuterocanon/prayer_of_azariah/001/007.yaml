  text: And we have not obeyed the commands of your law, nor kept them, nor done as you commanded us, so that it might go well with us.
translation:
  language: ko
  text: 그리고 우리는 주님의 율법의 명령들을 따르지 않았고, 그것들을 지키지도 않았으며, 주께서 우리에게 명령하신 대로 행하지도 않았습니다. 그래서 우리에게 잘되게 하려는 것이었습니다.
  philosophy: formal
lexical_decisions:
- source_word: τῶν ἐντολῶν
  english_pob_choice: the commands
  chosen_korean: 명령들
  alternatives_korean:
  - 계명들
  - 명령
  lexicon: ἐντολή
  rationale: POB가 ‘commands’를 택한 점을 따라, 율법 문맥에서 비교적 직접적인 ‘명령들’로 옮겼습니다. ‘계명들’도 가능하지만, 본문은 주님의 법적 지시 전반을 가리키므로 ‘명령들’이 더 중립적입니다.
- source_word: τοῦ νόμου σου
  english_pob_choice: your law
  chosen_korean: 주님의 율법
  alternatives_korean:
  - 주의 법
  - 주님의 법
  lexicon: νόμος
  rationale: νόμος는 여기서 토라/율법을 뜻하므로 ‘율법’으로 옮겼고, 2인칭 소유를 자연스럽게 반영해 ‘주님의’로 표현했습니다.
- source_word: ὑπηκούσαμεν / συνετηρήσαμεν / ἐποιήσαμεν
  english_pob_choice: have not obeyed / nor kept / nor done
  chosen_korean: 따르지 않았고 / 지키지도 않았으며 / 행하지도 않았습니다
  alternatives_korean:
  - 순종하지 않았고 / 보존하지도 않았으며 / 하지도 않았습니다
  - 복종하지 않았고 / 지키지도 않았으며 / 행하지도 않았습니다
  lexicon: ὑπακούω, συντηρέω, ποιέω
  rationale: 세 동사의 누적 부정을 한국어에서도 분명하게 살려, 순종-보존-실행의 책임을 단계적으로 드러냈습니다. ‘지키다’는 νόμος를 단순 보관이 아니라 준수하는 뜻으로 자연스럽게 전달합니다.
- source_word: ἵνα εὖ ἡμῖν γένηται
  english_pob_choice: so that it might go well with us
  chosen_korean: 그래서 우리에게 잘되게 하려는 것이었습니다
  alternatives_korean:
  - 그래서 우리에게 복되게 하려는 것이었습니다
  - 그래서 우리에게 좋게 되게 하려는 것이었습니다
  lexicon: εὖ γίνομαι
  rationale: 목적절의 결과를 한국어에서 자연스럽게 풀어, 하나님 명령의 목적이 ‘우리에게 잘되게 하는 것’이라는 의미를 보존했습니다.
theological_decisions:
- issue: 명령 불순종의 고백을 윤리적 일반화로 약화하지 않을 것
  chosen_reading: 본문의 자기고발적 회개 언어를 그대로 유지했습니다.
  alternative_readings:
  - 단순 과거 실패로 완화하는 표현
  - 일반적 비행으로 넓히는 표현
  rationale: 이 구절은 공동체가 율법에 대한 불순종을 고백하는 회개 맥락이므로, 죄책의 강도를 약화하지 않고 원문의 책임 고백을 유지하는 것이 적절합니다.
  doctrine_reference: 회개와 언약적 책임
