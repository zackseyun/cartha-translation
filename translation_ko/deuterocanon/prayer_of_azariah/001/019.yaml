    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ καταισχύνῃς ἡμᾶς
  english_pob_choice: Do not put us to shame
  chosen_korean: 우리를 수치스럽게 하지 마시고
  alternatives_korean:
  - 우리를 부끄럽게 하지 마시고
  - 우리를 욕되게 하지 마시고
  lexicon: BDAG
  rationale: καταισχύνω의 핵심 의미인 ‘수치/부끄러움을 당하게 하다’를 살리되, 현대 한국어에서 자연스럽고 직접적인 청원형으로 옮겼습니다.
- source_word: ποίησον μεθʼ ἡμῶν ἔλεος
  english_pob_choice: show us mercy / deal with us in mercy
  chosen_korean: 우리에게 은혜를 베푸소서
  alternatives_korean:
  - 우리에게 긍휼을 베푸소서
  - 우리와 함께 긍휼을 행하소서
  lexicon: LEH
  rationale: 직역하면 ‘우리와 함께 자비를 행하소서’에 가깝지만, 한국어에서는 ‘은혜를 베푸소서’가 청원문의 힘을 자연스럽게 전달합니다. 다만 ἔλεος의 자비-긍휼 성격은 뒤의 ‘긍휼’로 유지했습니다.
- source_word: τὴν ἐπιείκειάν σου
  english_pob_choice: your gentleness
  chosen_korean: 주의 온유하심
  alternatives_korean:
  - 주의 관용에 따라
  - 주의 너그러우심에 따라
  - 주의 온화하심
  lexicon: BDAG
  rationale: ἐπιείκεια는 단순한 친절보다 ‘관용/온화한 공정함’에 가까워서, 예배 언어로는 ‘온유하심’이 가장 무리 없이 대응합니다.
- source_word: κατὰ τὸ πλῆθος τοῦ ἐλέους σου
  english_pob_choice: according to the abundance of your mercy
  chosen_korean: 주의 큰 긍휼에 따라
  alternatives_korean:
  - 주의 풍성한 긍휼에 따라
  - 주의 긍휼의 풍성함에 따라
  - 주의 긍휼의 많음에 따라
  lexicon: LEH
  rationale: πλῆθος의 ‘많음/풍성함’을 한국어 기도문 표현으로 압축해 ‘큰 긍휼’로 옮겼습니다. ‘긍휼’은 ἔλεος의 공손하고 성경적인 대응어입니다.
theological_decisions:
- issue: ἐπιείκεια와 ἔλεος의 구분 유지
  chosen_reading: ‘온유하심’과 ‘긍휼’로 구분해, 하나님의 성품과 그 자비의 실현을 각각 드러냈습니다.
  alternative_readings:
  - 둘 다 ‘긍휼’로 통일
  - ‘관용’과 ‘긍휼’로 구분
  rationale: 헬라어 본문은 하나님께서 베푸시는 태도(ἐπιείκεια)와 자비의 풍성함(ἔλεος)을 나란히 둡니다. 둘을 합쳐 버리면 기도의 수사가 약해집니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 5
