  source_fidelity: 개정이 필요합니다. ποίησον μεθʼ ἡμῶν ἔλεος는 하나님께 ‘우리에게 긍휼을 베푸소서’라고 청하는 표현인데, 초안의 ‘우리에게 은혜를 베푸소서’는 ἔλεος의 핵심 의미를 약화하고 뒤의 ἔλεος와의 반복도 흐립니다. πλῆθος는 단순히 ‘큰’이라기보다 긍휼의 많음·풍성함을 나타냅니다.
  naturalness: ‘우리를 수치스럽게 하지 마시고’도 이해되지만, 기도문 문맥에서는 ‘우리가 수치를 당하게 하지 마시고’가 현대 표준어로 더 자연스럽고 원문의 사역적 뉘앙스를 잘 드러냅니다. ‘너그러우심’과 ‘긍휼이 풍성하심’은 합쇼체 기도문으로 자연스럽습니다.
  terminology: ἐπιείκεια는 여기서 ‘온유’보다 판단과 처사에서의 너그러움·관용을 뜻하므로 ‘너그러우심’이 더 정확합니다. ἔλεος는 두 곳 모두 ‘긍휼’로 유지하여 원문의 반복과 구별을 보존합니다.
