base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/037.yaml
  text: Bless the Lord[a], waters and all that are above the heavens; sing praise to him and highly exalt him forever.
  footnotes:
  - marker: a
    text: Or, more literally, 'all things above the heaven.' The Greek phrase can be taken collectively for the cosmic realities above the sky/heaven.
    reason: lexical_alternative
translation:
  language: ko
  text: 물들과 하늘 위의 모든 것들아, 주님을 찬송하십시오[a]. 그분을 찬송하며 영원히 지극히 높이십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘하늘 위에 있는 모든 것들’입니다. 여기서 ‘하늘’은 단수이지만, 하늘 너머 또는 위에 있는 우주적 실재들을 집합적으로 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  english_pob_choice: Bless
  chosen_korean: 찬송하십시오
  alternatives_korean:
  - 복을 빕니다
  - 축복하십시오
  - 찬양하십시오
  lexicon: LSJ / BDAG
  rationale: 창조물에게 하나님을 향해 드리는 예배적 호명을 자연스럽게 살리기 위해 명령형 합쇼체로 옮겼고, 이 문맥에서는 ‘복을 빕니다’보다 찬송의 의미가 분명합니다.
- source_word: ὕδατα
  english_pob_choice: waters
  chosen_korean: 바닷물
  alternatives_korean:
  - 물들
  - 물
  lexicon: LSJ
  rationale: 복수형의 시적·우주적 호칭을 살리되 한국어로는 ‘바닷물’이 가장 자연스럽게 집합적 의미를 전달합니다.
- source_word: πάντα τὰ ἐπάνω τοῦ οὐρανοῦ
  english_pob_choice: all that are above the heavens
  chosen_korean: 하늘 위의 모든 것들
  alternatives_korean:
  - 하늘 위에 있는 모든 것
  - 하늘들 위의 모든 것들
  - 하늘 위의 만물
  lexicon: LSJ
  rationale: 직역의 투명성을 유지하면서도 한국어 표현으로는 ‘하늘 위의 모든 것들’이 우주적 범위를 잘 드러냅니다.
- source_word: ὑμνεῖτε καὶ ὑπερυψοῦτε
  english_pob_choice: sing praise ... and highly exalt
  chosen_korean: 그분께 노래하며 … 높이십시오
  alternatives_korean:
  - 찬송하며 … 크게 높이십시오
  - 찬가를 부르며 … 지극히 높이십시오
  lexicon: BDAG / LSJ
  rationale: ὑμνεῖτε의 노래 부르는 뉘앙스와 ὑπερυψοῦτε의 강조를 함께 살리기 위해 ‘노래하다’와 ‘높이다’를 분리해 옮겼습니다.
- source_word: κύριον / αὐτόν
  english_pob_choice: the Lord / him
  chosen_korean: 주님 / 그분
  alternatives_korean:
  - 주님 / 주님을
  - 주 / 그를
  lexicon: BDAG
  rationale: κύριος는 프로젝트 기본어인 ‘주님’으로 옮기고, 뒤의 대명사 αὐτόν은 한국어에서 자연스러운 존칭 대명사 ‘그분’으로 처리했습니다.
