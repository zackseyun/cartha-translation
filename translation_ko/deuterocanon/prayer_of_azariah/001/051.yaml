  text: Let the earth bless the Lord; let it sing hymns and highly exalt him forever.
translation:
  language: ko
  text: 땅아, 주를 송축하십시오. 그분을 찬송하고 영원히 지극히 높이십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογείτω
  english_pob_choice: let ... bless
  chosen_korean: 찬송할지어다
  alternatives_korean:
  - 복을 빌지어다
  - 찬양할지어다
  lexicon: LXX Greek εὐλογέω
  rationale: 창조세계가 하나님께 드리는 호명형 권고를 한국어의 예배적 명령형으로 살리되, 대상이 하나님일 때의 언어관습에 맞게 ‘찬송하다’를 택했습니다.
- source_word: ἡ γῆ
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 지구
  - 땅과 온 세상
  lexicon: BDAG
  rationale: 이 찬양 구절에서 γῆ는 특정 지역이 아니라 피조세계 전체를 가리키므로, 자연스러운 성경 한국어로 ‘땅’이 적절합니다.
- source_word: ὑμνείτω
  english_pob_choice: let it sing hymns
  chosen_korean: 찬양하며
  alternatives_korean:
  - 찬송하며
  - 찬가를 부르며
  lexicon: BDAG
  rationale: ὑμνέω의 예배적·노래적 뉘앙스를 살리면서도 한국어 문장 흐름을 부드럽게 하기 위해 서술적 동사구로 옮겼습니다.
- source_word: ὑπερυψούτω
  english_pob_choice: let it highly exalt
  chosen_korean: 크게 높일지어다
  alternatives_korean:
  - 지극히 높일지어다
  - 매우 높일지어다
  lexicon: BDAG
  rationale: 복합동사 ὑπερυψόω의 강한 강조를 드러내기 위해 단순한 ‘높이다’보다 강도를 살린 ‘크게 높이다’를 사용했습니다.
theological_decisions:
- issue: κύριος의 번역
  chosen_reading: 주
  alternative_readings:
  - 주님
  - 주인
  rationale: 이 구절은 찬양의 직접 대상인 하나님을 가리키므로, 프로젝트 기본값에 따라 ‘주’가 가장 간결하고 예배적 맥락에 맞습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → 주'
