  rationale: 본문은 κύριον을 사용하므로, 텍스트 근거에 따라 ‘주’로 옮겼습니다. 이는 신명(יהוה) 표지가 아니라 헬라어 호칭이므로 ‘야훼’로 바꾸지 않았습니다.
