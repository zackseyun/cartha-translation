translation:
  language: ko
  text: 하늘의 모든 새들아, 주를 찬송하십시오. 그분을 찬송하며 영원토록 지극히 높이십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하늘의 모든 새들’로 옮긴 πετεινά는 문맥상 새들을 뜻하지만, 더 넓게는 ‘하늘을 나는 모든 것들’을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  english_pob_choice: Bless
  chosen_korean: 찬송하십시오
  alternatives_korean:
  - 복을 빌어 드리십시오
  - 축복하십시오
  - 찬양하십시오
  lexicon: BDAG
  rationale: 직역의 ‘축복하다’보다 이 문맥의 도래형 찬가에 어울리는 공적 호칭으로서의 찬양 행위를 드러내기 위해 ‘찬송하십시오’를 택했습니다.
- source_word: πάντα τὰ πετεινὰ τοῦ οὐρανοῦ
  english_pob_choice: all birds of the sky
  chosen_korean: 하늘의 모든 새들
  alternatives_korean:
  - 하늘의 모든 날짐승
  - 하늘의 모든 새들
  lexicon: LSJ
  rationale: πετεινά는 새들을 가리키는 것이 자연스럽지만, ‘하늘의’가 τοῦ οὐρανοῦ를 충실히 반영하므로 ‘하늘의 모든 새들’로 옮겼습니다.
- source_word: ὑμνεῖτε
  english_pob_choice: sing hymns
  chosen_korean: 노래로 찬양하며
  alternatives_korean:
  - 찬송을 부르며
  - 찬가를 부르며
  lexicon: BDAG
  rationale: ὑμνέω의 ‘찬가를 부르다/찬송하다’라는 음악적 뉘앙스를 살리되, 한국어에서 자연스럽게 읽히도록 동작을 부연해 옮겼습니다.
- source_word: ὑπερυψοῦτε
  english_pob_choice: highly exalt
  chosen_korean: 높이 찬양하십시오
  alternatives_korean:
  - 크게 높이십시오
  - 지극히 높이십시오
  lexicon: LSJ
  rationale: 합성 동사의 강화 의미를 한국어의 ‘높이’로 살리고, 반복되는 찬양 명령의 병렬성을 위해 ‘찬양하십시오’로 마무리했습니다.
theological_decisions:
- issue: κύριος의 한국어 처리
  chosen_reading: 주
  alternative_readings:
