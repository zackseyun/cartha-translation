  source_fidelity: 첫 명령 ‘주를 찬송하십시오’는 εὐλογεῖτε τὸν κύριον을 적절히 옮깁니다. 그러나 ὑπερυψοῦτε는 단순히 다시 ‘찬양하다’가 아니라 ‘매우 높이다/지극히 높이다’라는 강화된 뜻이므로, 현행의 ‘높이 찬양하십시오’는 앞의 ὑμνεῖτε와의 구별을 충분히 살리지 못합니다.
  naturalness: ‘하늘의 모든 새들아’와 합쇼체 명령형은 자연스럽고 이 찬가의 호명 형식에 맞습니다. ‘영원토록 지극히 높이십시오’는 한국어 예배·찬송 문맥에서도 자연스럽습니다.
  terminology: κύριον은 ‘주’로 유지할 수 있으며, εὐλογεῖτε/ὑμνεῖτε/ὑπερυψοῦτε의 연속은 각각 ‘찬송하다/찬송을 부르다/지극히 높이다’로 구별하는 것이 좋습니다. 각주 현행 문구는 ‘문자적으로는’ 뒤에 본문과 같은 표현을 반복하여 대안 의미를 명료하게 제시하지 못합니다.
