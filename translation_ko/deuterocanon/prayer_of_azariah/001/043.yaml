lexical_decisions:
- source_word: εὐλογεῖτε
  english_pob_choice: Bless
  chosen_korean: 찬양하십시오
  alternatives_korean:
  - 복을 빌십시오
  - 축복하십시오
  lexicon: BDAG
  rationale: 피조물에게 명령하는 찬송의 반복구로서, 한국어에서는 ‘복을 빌다’보다 ‘찬양하다’가 문맥상 자연스럽고 예배적 호소를 잘 살립니다.
- source_word: πῦρ καὶ καῦμα
  english_pob_choice: fire and heat
  chosen_korean: 불과 열기
  alternatives_korean:
  - 불과 더위
  - 불과 타는 열기
  lexicon: LSJ
  rationale: πῦρ와 καῦμα의 병렬을 살리되, καῦμα를 πῦρ와 중복되지 않게 ‘열기’로 옮겨 두 요소의 차이를 드러냈습니다.
- source_word: ὑμνεῖτε
  english_pob_choice: sing praise
  chosen_korean: 노래하며
  alternatives_korean:
  - 찬송하며
  - 찬양하며
  lexicon: BDAG
  rationale: 동사 자체에 ‘노래하다/찬송하다’의 뉘앙스가 있으므로, 뒤의 목적어 없이도 찬양 행위를 드러내는 ‘노래하며’를 택했습니다.
- source_word: ὑπερυψοῦτε
  english_pob_choice: highly exalt
  chosen_korean: 높이 높이십시오
  alternatives_korean:
  - 크게 높이십시오
  - 극진히 높이십시오
  lexicon: BDAG
  rationale: 강한 강조를 가진 복합 동사의 힘을 한국어 반복 표현으로 살려, 단순한 ‘높이다’보다 강조가 분명한 형태로 옮겼습니다.
theological_decisions:
- issue: 피조물인 불과 열기의 호명 방식
  chosen_reading: 피조물이 여호와/주님을 찬양하도록 부르는 시적 명령으로 이해하고, 한국어에서도 직접적인 명령형을 유지했습니다.
  alternative_readings:
  - 서술형으로 완화해 ‘불과 열기가 주님을 찬양합니다’로 옮김
  - 의인화 표현을 줄여 자연현상 설명처럼 번역함
  rationale: 원문은 자연물에 대한 직접 호명이므로, 그 예배적·우주적 찬송의 긴장과 울림을 보존하는 것이 본문의 의미를 가장 잘 드러냅니다.
  doctrine_reference: 시편 148편의 피조물 찬양 전통
- issue: κύριος의 번역
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 주인
  rationale: 공동찬양의 문맥에서 κύριος는 하나님의 주권을 가리키는 칭호이므로, 한국어 예배체에 맞는 ‘주님’이 가장 자연스럽습니다.
  doctrine_reference: 'POB contested terms: κύριος → Lord'
