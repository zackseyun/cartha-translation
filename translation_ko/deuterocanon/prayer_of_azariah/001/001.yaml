    text: 이 그리스어 본문은 바빌로니아식 이름이 아니라 하나냐, 아사랴, 미사엘이라는 히브리식 이름을 사용합니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘그들이 풀무에 던져지도록 명령했을 때’로 옮길 수 있습니다.
