  text: Thus Hananiah and Azariah and Mishael prayed[b][a], and they sang praise to the Lord when the king ordered them to be thrown into the furnace.
  footnotes:
  - marker: a
    text: Greek has the Hebrew names Hananiah, Azariah, and Mishael here, not their Babylonian names Shadrach, Meshach, and Abednego.
