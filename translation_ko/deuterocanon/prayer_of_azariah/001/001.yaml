  text: 그리하여 하나냐와 아사랴와 미사엘은[a] 왕이 그들을 풀무에 던져 넣도록 명령했을 때[b] 이렇게 기도하고 주님을 찬양했습니다.
  philosophy: optimal-equivalence
  footnotes:
