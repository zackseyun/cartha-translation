translation:
  language: ko
  text: 이와 같이 하나니야와 아사랴와 미사엘은 기도하고, 왕이 그들을 풀무에 던지라고 명령했을 때 주님께 찬양을 드렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 그리스어 본문은 바빌론식 이름이 아니라 하나니야, 아사랴, 미사엘이라는 히브리식 이름을 사용합니다.
    reason: cross_reference
  - marker: b
    text: ‘풀무에 던지다’ 또는 ‘풀무 속에 던져 넣다’로도 옮길 수 있습니다.
    reason: lexical_alternative
