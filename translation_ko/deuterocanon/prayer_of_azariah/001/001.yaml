  naturalness: 기존 문장도 자연스러우나, ‘왕이 그들을 풀무에 던지라고 명령했을 때’는 왕이 직접 던지라고 지시한 듯한 능동적 표현으로 들릴 수 있습니다. ‘그들을 풀무에 던져 넣도록 명령했을 때’가 원문의 수동 의미를 한국어에서 더 자연스럽게 전달합니다.
