lexical_decisions:
- source_word: εὐλογεῖτε
  english_pob_choice: Bless
  chosen_korean: 찬양하십시오
  alternatives_korean:
  - 복을 빕니다
  - 축복하십시오
  lexicon: BDAG
  rationale: 여기서는 하나님을 향한 예배적 권면이므로, 한국어에서는 ‘Bless’의 직역성보다 공적 찬양의 기능을 드러내는 ‘찬양하십시오’가 자연스럽고도 본문의 호소력을 살립니다.
- source_word: οἱ υἱοὶ τῶν ἀνθρώπων
  english_pob_choice: sons of men
  chosen_korean: 사람의 아들들
  alternatives_korean:
  - 인간들이여
  - 인자들아
  - 사람의 자녀들아
  lexicon: BDAG
  rationale: 그리스어의 남성 복수 관용구를 살리면서도 한국어 예배문으로 읽히게 하기 위해 직역형의 ‘사람의 아들들’을 택했습니다. 이는 POB의 성별 표지를 지나치게 평준화하지 않으면서도 현대 한국어에서 이해 가능한 표현입니다.
- source_word: ὑμνεῖτε
  english_pob_choice: sing praise
  chosen_korean: 찬송하고
  alternatives_korean:
  - 노래로 찬양하고
  - 찬미하고
  lexicon: BDAG
  rationale: ὑμνέω의 음악적·찬가적 뉘앙스를 살려 ‘찬송하다’로 옮겼습니다. ‘찬양하다’와 구별해 앞의 ‘찬양하십시오’와도 의미의 중복을 줄였습니다.
- source_word: ὑπερυψοῦτε
  english_pob_choice: highly exalt
  chosen_korean: 크게 높이십시오
  alternatives_korean:
  - 지극히 높이십시오
  - 크게 높여드리십시오
  lexicon: BDAG
  rationale: 복합어가 주는 강한 상승·고양의 뜻을 한국어에서 가장 직접적으로 드러내는 표현으로 ‘크게 높이십시오’를 택했습니다.
theological_decisions:
- issue: κύριος의 호칭 처리
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 야훼
  rationale: 이 본문은 그리스어 경배문에서 κύριος를 직접 가리키며, 신약 인용으로서의 야훼 표지나 LXX 인용 표시가 요구되는 문맥이 아닙니다. 따라서 한국어 예배어법에 맞는 ‘주님’을 사용했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → 주님'
