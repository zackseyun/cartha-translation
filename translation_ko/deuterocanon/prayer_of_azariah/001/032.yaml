translation:
  language: ko
  text: 주님의 나라[a]의 보좌 위에 계신 주님은 영원토록 찬송받으시며, 크게 찬양받으시고 지극히 높임을 받으십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 왕권의 보좌에’. 헬라어 βασιλεία는 ‘나라’, ‘왕권’, ‘통치’를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογημένος
  english_pob_choice: Blessed
  chosen_korean: 찬송받으시며
  alternatives_korean:
