base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/032.yaml
  text: Blessed are you on the throne of your kingdom[a], and greatly praised and highly exalted forever.
  footnotes:
  - marker: a
    text: Or 'upon the throne of your kingship.' The Greek βασιλεία can mean 'kingdom,' 'kingship,' or 'reign.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님의 나라의 보좌에 계신 주님은 찬송받으시며, 크게 찬양받으시고 높이 들리시어 영원토록 계십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '주님의 왕권의 보좌에'. 헬라어 βασιλεία는 '나라', '왕권', '통치'를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογημένος
  english_pob_choice: Blessed
  chosen_korean: 찬송받으시며
  alternatives_korean:
  - 복되시며
  - 축복받으시며
  lexicon: BDAG
  rationale: 도기(doxology) 문맥에서 εὐλογημένος의 축복 선언을 한국어 예배체로 자연스럽게 살리기 위해 '찬송받으시며'를 택했습니다.
- source_word: ἐπὶ θρόνου
  english_pob_choice: on the throne
  chosen_korean: 보좌에 계신
  alternatives_korean:
  - 보좌 위에
  - 보좌에 앉으신
  lexicon: LSJ
  rationale: ἐπί + 속격의 위치 관계를 유지하되, 한국어에서는 '보좌에 계신'이 가장 자연스럽고 왕권의 이미지도 분명합니다.
- source_word: τῆς βασιλείας σου
  english_pob_choice: of your kingdom
  chosen_korean: 주님의 나라의
  alternatives_korean:
  - 주님의 왕권의
  - 주님의 통치의
  lexicon: LSJ
  rationale: 기본값인 '하나님의 나라' 어휘를 살리면서도, 여기서는 왕좌 이미지와 맞물리는 '나라'가 가장 자연스럽습니다. 각주로 βασιλεία의 의미 범위를 남겼습니다.
- source_word: ὑπερυμνητός καὶ ὑπερυψωμένος
  english_pob_choice: greatly praised and highly exalted
  chosen_korean: 크게 찬양받으시고 높이 들리시어
  alternatives_korean:
  - 지극히 찬양받으시고 지극히 높임받으시어
  - 크게 찬양되시고 높이 높임받으시어
  lexicon: LSJ; BDAG
  rationale: 두 개의 과장법적 형용사를 각각 '찬양받으시고'와 '높이 들리시어'로 살려, 중복된 찬가적 강조를 유지했습니다.
- source_word: εἰς τοὺς αἰῶνας
  english_pob_choice: forever
  chosen_korean: 영원토록
  alternatives_korean:
  - 세세토록
  - 영원히
  lexicon: BDAG
  rationale: 지속의 관용구를 현대 합쇼체 예배문에 자연스럽게 옮기면서도, 끝없음을 분명히 하는 표현을 선택했습니다.
theological_decisions:
- issue: 직접 주소와 존칭 처리
  chosen_reading: 하나님께 직접 드리는 찬가로 읽고, 한국어에서는 2인칭 직접 호칭을 '주님'으로 유지했습니다.
  alternative_readings:
  - 3인칭 서술형으로 완화
  - 명시적 신명(하나님)으로만 바꿈
  rationale: 원문이 직접적으로 하나님을 향해 축복 선언을 하므로, 한국어에서도 대상을 흐리지 않기 위해 직접 호칭을 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 6
- issue: βασιλεία의 번역 범위
  chosen_reading: '''나라''를 본문에 두되, 각주로 ''왕권/통치'' 가능성을 열어 두었습니다.'
  alternative_readings:
  - '''왕권''만 채택'
  - '''통치''만 채택'
  rationale: 문맥상 보좌 이미지와 자연스럽게 결합하는 기본값은 '나라'이지만, βασιλεία의 의미 범위가 넓으므로 단일 의미로 과도하게 고정하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 6
