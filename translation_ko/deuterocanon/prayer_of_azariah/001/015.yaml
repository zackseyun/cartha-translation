theological_decisions:
- issue: 주님 앞에서의 예물 제의와 자비의 간구
  chosen_reading: 문맥상 예루살렘 성전 예배가 끊긴 상태를 한탄하는 말로 보아, ‘주님 앞에 예물을 드리고 자비를 얻을 곳도 없습니다’라고 직역에 가깝게 옮겼습니다.
  alternative_readings:
  - ‘주님 앞에서 예배드릴 곳도 없습니다’
  - ‘주님께 제사를 드릴 곳도 없습니다’
  rationale: 이 구절은 단순한 장소 부재가 아니라 제의 행위와 자비의 간구가 모두 막힌 상태를 함께 말하므로, 두 요소를 모두 드러내는 번역이 원문의 비탄을 보존합니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
