  text: Blessed are you in the firmament of heaven, and praised and glorified forever.
translation:
  language: ko
  text: 하늘의 궁창 안에 계신 당신은 복되시며, 영원히 찬양받고 영광을 받으십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
