  text: Blessed are you in the firmament of heaven, and praised and glorified forever.
translation:
  language: ko
  text: 하늘의 궁창에서 복되신 분이시며, 영원히 찬양받고 영광받으소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘궁창’은 στερέωμα의 전통적 대응어로, 하늘의 견고한 펼침을 가리키는 고전적 우주론 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: εὐλογητὸς εἶ
  english_pob_choice: Blessed are you
  chosen_korean: 복되신 분이시며
  alternatives_korean:
  - 복되십니다
  - 복을 받으신 분이시며
  - 찬송받으실 분이시며
  lexicon: εὐλογητός
  rationale: 감탄적 축복 선언을 한국어에서 자연스럽게 살리기 위해 ‘복되신’으로 옮겼고, 직접 호칭을 유지하기 위해 서술형보다 호칭적 표현을 택했습니다.
- source_word: ἐν τῷ στερεώματι τοῦ οὐρανοῦ
  english_pob_choice: in the firmament of heaven
  chosen_korean: 하늘의 궁창에서
  alternatives_korean:
  - 하늘의 창공에서
  - 하늘 궁창에서
  - 하늘의 궁창 안에서
  lexicon: στερέωμα
  rationale: στερέωμα의 고전적 ‘궁창’ 의미를 보존하되, 한국어 어순에 맞게 ‘하늘의 궁창’으로 옮겨 원문의 우주론적 이미지를 유지했습니다.
- source_word: ὑμνητὸς καὶ δεδοξασμένος
  english_pob_choice: praised and glorified
  chosen_korean: 찬양받고 영광받으소서
  alternatives_korean:
  - 찬송받고 영화롭게 되소서
  - 찬양받고 영광스럽게 되소서
  - 찬미받고 영광받으소서
  lexicon: ὑμνητός / δοξάζω
  rationale: 두 수동형 형용사를 한국어에서 결과 상태보다 하나님께 돌리는 수동적 찬양 표현으로 살려, POB의 ‘praised and glorified’와 직접 대응시켰습니다.
- source_word: εἰς τοὺς αἰῶνας
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 세세토록
  - 영원무궁히
  - 끝없이
  lexicon: αἰών
  rationale: 문맥상 시간의 지속을 간명하게 나타내는 기본어를 택해, 예배적 송축문의 종결감을 살렸습니다.
theological_decisions:
- issue: ‘firmament of heaven’의 우주론적 표현 유지
  chosen_reading: ‘하늘의 궁창’으로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘하늘의 창공’으로 완화
  - ‘하늘 한가운데’로 의역
  rationale: 본문은 하늘의 구조를 묘사하는 예배적 언어이므로, 현대 감각에 맞춘 완화보다 원문 이미지 보존이 우선입니다.
  doctrine_reference: 창세기 1장 창조 세계의 언어적 배경
- issue: 수동형 찬양 표현의 주어 유지
  chosen_reading: ‘찬양받고 영광받으소서’로 하나님께 돌리는 직접적 송축으로 유지했습니다.
  alternative_readings:
  - ‘찬양과 영광을 받으십니다’
  - ‘찬양받으시며 영광스럽습니다’
  rationale: 형용사와 수동형이 결합된 예배문은 단순 진술보다 축원/송축의 성격이 강하므로, 기도체 종결로 그 기능을 드러냈습니다.
  doctrine_reference: 예배와 송축의 언어
