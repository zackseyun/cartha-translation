  text: Bless the Lord, dews and showers; sing praise to him and highly exalt him forever.
translation:
  language: ko
  text: 이슬과 소나기들아, 주님을 찬송하십시오. 그분을 노래하며 높이 들으십시오 영원히.
  philosophy: formal
lexical_decisions:
- source_word: δρόσοι
  english_pob_choice: dews
  chosen_korean: 이슬
  alternatives_korean:
  - 이슬들
  - 이슬비
  lexicon: δρόσος
  rationale: English POB의 복수형 ‘dews’를 반영하되, 한국어에서는 자연스러운 집합명사 ‘이슬’로 옮겨 과도한 복수 표지를 피했습니다.
- source_word: νιφετοί
  english_pob_choice: showers
  chosen_korean: 소나기들
  alternatives_korean:
  - 소나기
  - 소낙눈
  - 폭우
  lexicon: νιφετός
  rationale: POB의 ‘showers’에 맞춰 강한 강수 현상을 드러내되, 원문의 병렬성과 호응하도록 복수형 느낌을 살려 ‘소나기들’로 옮겼습니다.
- source_word: τὸν κύριον
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주를
  - 주
  lexicon: κύριος
  rationale: 여기서는 하나님을 향한 직접 찬송이므로 POB 관례에 따라 ‘주님’이 자연스럽고 경건한 한국어 호칭입니다.
- source_word: ὑπερυψοῦτε
  english_pob_choice: highly exalt
  chosen_korean: 높이 들으십시오
  alternatives_korean:
  - 높이 높이십시오
  - 극히 높이십시오
  - 크게 높이십시오
  lexicon: ὑπερυψόω
  rationale: 영원히 그분을 드높이라는 동작을 한국어 합쇼체로 살리면서, 관용적으로도 이해되는 ‘높이 들다’ 계열 표현을 선택했습니다.
theological_decisions:
- issue: 피조물에 대한 의인화된 명령형 찬송
  chosen_reading: 이슬과 소나기를 실제 자연물에 대한 직접 명령으로 그대로 옮겼습니다.
  alternative_readings:
  - 상징적 자연현상으로 완화해 번역하는 방법
  rationale: 본문은 자연 현상들을 예배적 합창에 초대하는 시적 명령이므로, 이를 완화하지 않고 원문의 수사적 강도를 유지했습니다.
