  source_fidelity: 개정이 필요합니다. 초안은 εὐλογεῖτε를 ‘찬양하다’로 처리하여 대체로 가능한 예배 언어를 사용했지만, ὑμνεῖτε와 ὑπερυψοῦτε의 구별이 무너졌습니다. 특히 ‘높이 높이 찬송하다’는 ‘찬송하다’에 강세를 더할 뿐, ‘지극히 높이다/높이 드높이다’라는 ὑπερυψοῦτε의 의미를 충분히 전달하지 못합니다.
  naturalness: 초안의 ‘하여라’는 요청된 현대 합쇼체와 일치하지 않습니다. ‘송축하십시오/찬송하고 … 높이십시오’는 현대 표준어의 격식 있는 예배 문체로 자연스럽습니다.
  terminology: κύριος는 ‘주님’으로 유지하는 것이 적절합니다. εὐλογεῖτε에는 하나님을 대상으로 하는 전통적이면서도 이해 가능한 ‘송축하십시오’를 사용하고, ὑμνεῖτε는 ‘찬송하고’, ὑπερυψοῦτε는 ‘지극히 높이십시오’로 구별합니다.
  issues:
  - severity: medium
    issue: ὑπερυψοῦτε의 의미가 ‘높이 높이 찬송하여라’에서 불분명해집니다.
