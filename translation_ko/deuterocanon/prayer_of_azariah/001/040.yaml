translation:
  language: ko
  text: 하늘의 별들아, 주님을 송축하십시오. 그분을 찬송하고 영원토록 지극히 높이십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  english_pob_choice: Bless
  chosen_korean: 찬양하여라
  alternatives_korean:
  - 복을 빌어라
  - 축복하여라
  lexicon: BDAG
  rationale: 별들에게 직접 명령하는 예배적 호소로 이해되므로, 한국어에서는 하나님께 드리는 찬미의 기능이 분명한 ‘찬양하다’로 옮겼습니다. ‘축복하다’는 대상이 하나님일 때 한국어 용법상 어색하고 의미가 흐려집니다.
- source_word: ἄστρα τοῦ οὐρανοῦ
  english_pob_choice: stars of heaven
  chosen_korean: 하늘의 별들
  alternatives_korean:
  - 천상의 별들
  - 하늘 별들
  lexicon: LSJ
  rationale: 직역에 충실하되 자연스러운 현대 한국어가 되도록 ‘하늘의 별들’로 옮겼습니다. ‘하늘 나라’ 같은 신학적 용어를 덧씌우지 않고, 천체를 가리키는 직접 의미를 살렸습니다.
- source_word: ὑμνεῖτε καὶ ὑπερυψοῦτε
  english_pob_choice: sing praise ... and highly exalt
  chosen_korean: 그분을 노래하며 높이 높이 찬송하여라
  alternatives_korean:
  - 그분을 찬송하며 크게 높여라
  - 찬가를 부르며 지극히 높여라
  lexicon: BDAG; LSJ
  rationale: ὑμνεῖτε의 노래 부름과 ὑπερυψοῦτε의 강한 높임을 함께 살리기 위해 ‘노래하며’와 ‘높이 높이 찬송하다’를 결합했습니다. ‘높이 높이’는 중복 표현처럼 보일 수 있지만, 원문의 강조를 한국어로 옮기는 데 유효합니다.
- source_word: εἰς τοὺς αἰῶνας
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 세세토록
  - 영원토록
  lexicon: BDAG
  rationale: 예배적 종결 공식으로서 지속성을 나타내므로, 가장 자연스러운 현대 한국어인 ‘영원히’를 택했습니다. 문맥상 시간의 길이를 길게 풀어쓰는 것보다 간결한 종결이 더 적절합니다.
theological_decisions:
- issue: κύριος를 한국어에서 어떻게 호명할지
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 주(主)
  - 야훼
  rationale: 본문은 그리스어 κύριον을 직접 가리키는 찬송이므로, 본문 표층에 나타난 호칭을 따라 ‘주님’으로 옮겼습니다. 이 구절만으로 히브리어 하나님의 이름 대용을 표기할 근거는 없으므로 ‘야훼’는 쓰지 않았습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → Lord'
