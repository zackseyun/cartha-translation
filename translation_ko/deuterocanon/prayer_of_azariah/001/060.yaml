base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/060.yaml
  text: Bless the Lord[a], Israel; sing praise to him and highly exalt him forever.
  footnotes:
  - marker: a
    text: Or 'Praise the Lord, Israel.' The Greek εὐλογεῖτε can also be rendered 'praise' in this worship context.
