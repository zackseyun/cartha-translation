translation:
  language: ko
  text: 이스라엘아, 주님을 찬송하십시오. 그분을 찬양하며 영원히 높이 올려드리십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님을 찬양하십시오, 이스라엘아.’ εὐλογεῖτε는 이 예배적 문맥에서 ‘찬양하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  english_pob_choice: Bless
  chosen_korean: 찬송하십시오
  alternatives_korean:
  - 복을 빌어 드리십시오
  - 찬양하십시오
  - 복되다고 선포하십시오
  lexicon: BDAG
  rationale: 예배 맥락의 εὐλογεῖτε는 하나님께 향한 경배적 찬양을 뜻하므로, 한국어에서는 자연스럽고 경건한 합쇼체 동사인 ‘찬송하십시오’로 옮겼습니다.
- source_word: Ἰσραήλ
  english_pob_choice: Israel
  chosen_korean: 이스라엘아
  alternatives_korean:
  - 이스라엘
  - 오 이스라엘
  lexicon: LSJ
  rationale: 호격이므로 조사 ‘-아’를 붙여 직접 부름을 분명히 했습니다. 영어 POB의 호격 처리와 같은 기능을 한국어로 구현한 것입니다.
- source_word: ὑμνεῖτε
  english_pob_choice: sing praise
  chosen_korean: 찬양하십시오
  alternatives_korean:
  - 노래로 찬양하십시오
  - 찬가를 부르십시오
  - 찬송하십시오
  lexicon: BDAG
  rationale: ὑμνέω는 노래하는 찬양의 뜻을 가지지만, 한국어에서는 반복되는 예배적 병렬 구조 안에서 ‘찬양하십시오’가 가장 자연스럽고 의미를 잘 살립니다.
- source_word: ὑπερυψοῦτε
  english_pob_choice: highly exalt
  chosen_korean: 높이 올려드리십시오
  alternatives_korean:
  - 크게 높이십시오
  - 극진히 높이십시오
  - 지극히 높이십시오
  lexicon: BDAG
  rationale: 강조 접두사가 붙은 ‘매우/지극히 높이다’의 뜻을 살리면서도, 하나님을 높이는 행위의 방향성을 드러내기 위해 ‘높이 올려드리십시오’로 옮겼습니다.
- source_word: εἰς τοὺς αἰῶνας
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 세세토록
  - 세세무궁토록
  - 끝없이
  lexicon: BDAG
  rationale: 찬양의 지속을 나타내는 관용구이므로, 현대 한국어에서 가장 분명한 ‘영원히’를 선택했습니다.
theological_decisions:
- issue: κύριον의 대상과 한국어 관습어 선택
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 야훼
  rationale: 본문의 κύριον은 직접적으로 하나님을 가리키는 예배적 호칭이므로, 합쇼체 문맥에서 자연스럽고 경건한 ‘주님’이 적절합니다. 이 절은 신명기적 인용으로서 Tetragrammaton 표지와의 직접 대응이 아니라는 점도 반영했습니다.
  doctrine_reference: 'DOCTRINE.md: κύριος → 주님; YHWH 표지는 히브리어 텍스트 직접 대응 시 적용'
