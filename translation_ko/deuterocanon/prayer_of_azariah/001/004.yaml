lexical_decisions:
- source_word: δίκαιος
  english_pob_choice: righteous
  chosen_korean: 의로우시며
  alternatives_korean:
  - 옳으시며
  - 공의로우시며
  lexicon: BDAG
  rationale: 하나님의 행위와 성품에 대한 언약적·도덕적 정당성을 드러내는 말이므로, 단순한 ‘옳다’보다 ‘의롭다’가 본문 의도를 더 직접적으로 살립니다.
- source_word: πᾶσιν οἷς ἐποίησας ἡμῖν
  english_pob_choice: in all that you have done to us
  chosen_korean: 우리에게 행하신 모든 일에서
  alternatives_korean:
  - 우리에게 하신 모든 일에서
  - 우리에게 하신 모든 것에서
  lexicon: BDAG
  rationale: 관계대명사절이 가리키는 포괄적 범위를 자연스러운 한국어로 옮기되, 하나님이 ‘우리에게’ 행하신 바를 직접 말하는 구조를 유지했습니다.
- source_word: ἀληθινὰ / ἀληθιναί
  english_pob_choice: 'true'
  chosen_korean: 참되며 / 참됩니다
  alternatives_korean:
  - 진실하며 / 진실합니다
  - 신실하며 / 신실합니다
  lexicon: BDAG
  rationale: 여기서는 작품의 진정성이나 신실성을 넘어, 하나님의 행위와 판단이 현실에 부합하고 거짓이 없다는 선언이므로 ‘참되다’가 가장 직접적입니다.
- source_word: εὐθεῖαι
  english_pob_choice: straight
  chosen_korean: 곧고
  alternatives_korean:
  - 바르고
  - 정직하고
  lexicon: BDAG
  rationale: ‘직선적’이라는 원뜻을 살리기 위해 ‘곧다’를 택했습니다. ‘바르다’는 해석을 더 강하게 넣는 반면, ‘곧다’는 이미지와 의미를 함께 보존합니다.
theological_decisions:
- issue: 하나님의 직접적 행위 진술
  chosen_reading: ‘우리에게 행하신 모든 일’이라는 직접 진술을 유지하여, 고난 속에서도 하나님의 의로움을 고백하는 본문의 긴장을 그대로 살렸습니다.
  alternative_readings:
  - ‘우리에게 허락하신 모든 일’처럼 우회적으로 완화할 수 있습니다.
  rationale: 그리스어는 하나님이 ‘우리에게 행하신’ 것을 분명히 말하므로, 그 직접성을 완화하지 않았습니다. 이는 고난과 하나님의 의를 함께 붙드는 본문의 신학적 긴장을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
