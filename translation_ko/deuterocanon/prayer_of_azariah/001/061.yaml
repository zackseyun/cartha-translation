- source_word: ὑμνεῖτε
  english_pob_choice: sing hymns
  chosen_korean: 찬송하십시오
  alternatives_korean:
  - 찬가를 부르십시오
  - 찬양의 노래를 부르십시오
  lexicon: BDAG
  rationale: ὑμνέω는 단순한 찬양보다 '찬송/찬가를 부르다'의 음악적 행위를 가리키므로, 현대 한국어에서는 자연스럽고도 의미를 보존하는 '찬송하다'를 택했습니다.
- source_word: ὑπερυψοῦτε
