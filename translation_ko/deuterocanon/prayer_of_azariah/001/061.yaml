base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/061.yaml
  text: Bless the Lord[a], priests[b]; sing hymns and highly exalt him forever.
  footnotes:
  - marker: a
    text: Or 'Praise the Lord, priests.' The verb can be rendered more generally as 'praise,' but 'bless' preserves the repeated liturgical wording of the Greek.
    reason: lexical_alternative
  - marker: b
    text: Or 'sing praise and exalt him greatly forever.' The Greek ὑμνεῖτε explicitly carries the sense of hymn-singing.
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장들아, 주님을 송축하십시오[a]. 그분을 찬송하며 영원히 높이 드십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '주님을 찬양하십시오.' εὐλογεῖτε는 반복되는 전례적 문구를 살리기 위해 '송축하다'로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '찬가를 부르며 그분을 크게 높이 드십시오.' ὑμνεῖτε는 특히 찬송가를 부르는 행위를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  english_pob_choice: Bless
  chosen_korean: 송축하십시오
  alternatives_korean:
