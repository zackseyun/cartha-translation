  rationale: 본문은 그리스어 예배문구이며, 여기의 κύριος는 인용된 히브리어 신명 표기를 직접 옮긴 경우가 아니므로 프로젝트 기본어인 '주님'을 유지하는 것이 source-direct합니다.
