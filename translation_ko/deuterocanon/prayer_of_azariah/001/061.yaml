  text: 제사장들아, 주님을 송축하십시오[a]. 그분을 찬송하고 영원히 지극히 높이십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님을 찬양하십시오.’ εὐλογεῖτε는 반복되는 전례적 문구를 살리기 위해 ‘송축하다’로 옮겼습니다.
    reason: lexical_alternative
