base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/061.yaml
  text: Bless the Lord[a], priests[b]; sing hymns and highly exalt him forever.
  footnotes:
  - marker: a
    text: Or 'Praise the Lord, priests.' The verb can be rendered more generally as 'praise,' but 'bless' preserves the repeated liturgical wording of the Greek.
    reason: lexical_alternative
  - marker: b
    text: Or 'sing praise and exalt him greatly forever.' The Greek ὑμνεῖτε explicitly carries the sense of hymn-singing.
    reason: lexical_alternative
translation:
