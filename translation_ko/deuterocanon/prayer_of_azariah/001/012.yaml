review_pass:
  verdict: revise
  source_fidelity: 현 초안은 ἀποστήσῃς와 ἔλεος, 그리고 세 족장을 근거로 드는 διὰ의 기능을 대체로 잘 옮겼습니다. 그러나 Ἰσραὴλ τὸν ἅγιόν σου(“당신의 거룩한 이스라엘”) 가운데 ‘거룩한 이’가 본문에서 누락되어 원문 충실성에 실질적인 결함이 있습니다. 또한 ‘…을 위하여 그러하소서’는 부정 명령의 내용을 멀리서 다시 받는 다소 부자연스러운 문장입니다.
  naturalness: ‘또한 …을 위하여, 우리에게서 당신의 자비를 거두지 마십시오’의 어순이 현대 표준어 합쇼체 기도문으로 자연스럽고, 세 인물을 한 호소의 근거로 묶는 그리스어 구문도 명료하게 드러냅니다.
  terminology: ‘자비’는 ἔλεος에 적절하고, ‘종’은 이 문맥의 δοῦλος에 무난합니다. Ἰσραήλ은 ‘이스라엘’로 보존해야 하며, τὸν ἅγιόν σου는 ‘당신의 거룩한 이스라엘’로 반드시 명시해야 합니다. ‘당신께서 사랑하시는 아브라함’은 ἠγαπημένον ὑπὸ σοῦ의 수동적 의미를 한국어에서 자연스럽게 반영합니다.
  issues:
  - severity: high
    issue: ‘이스라엘’에 수식된 ‘당신의 거룩한 이’가 번역문에서 누락되었습니다.
    rationale: 원문은 아브라함을 ‘당신께 사랑받는 이’, 이삭을 ‘당신의 종’, 이스라엘을 ‘당신의 거룩한 이’로 각각 수식합니다. 마지막 수식어를 빠뜨리면 의미 요소 하나가 소실됩니다.
  - severity: medium
    issue: ‘아브라함 … 과 이삭 … 과 이스라엘을 위하여 그러하소서’의 연결이 부자연스럽습니다.
    rationale: ‘그러하소서’가 앞의 ‘거두지 마십시오’를 되받는 방식은 현대 한국어에서 어색합니다. 근거구를 먼저 두고 부정 명령을 끝에 두면 원문의 호소 구조가 더 분명해집니다.
  - severity: low
    issue: 기존 b 각주는 ‘또는’ 형식이지만 실제로는 번역 대안이 아니라 해설입니다.
    rationale: 구조상 오류는 아니지만, 원문 및 영어 감사 흔적에 없는 해설을 추가할 필요가 없으며, ‘종’의 의미를 별도 해설 없이 본문에서 유지하는 편이 간결합니다.
  revised_text: 또한 당신께서 사랑하시는 아브라함과 당신의 종 이삭과 당신의 거룩한 이스라엘을 위하여, 우리에게서 당신의 자비를 거두지 마십시오[a].
  revised_footnotes:
  - marker: a
    text: 또는 ‘당신의 자비를 우리에게서 거두어 가지 마십시오.’
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘이스라엘’은 족장 야곱의 언약명입니다.
    reason: cross_reference
  revision_rationale: 누락된 τὸν ἅγιόν σου를 ‘당신의 거룩한 이스라엘’로 복원하고, 세 족장을 통한 간구의 근거를 한 문장 안에서 자연스럽게 연결했습니다. 이스라엘이 야곱을 가리킨다는 식별 각주는 유지하되, 본문에 없는 의미를 보태지 않았습니다. 수정문에는 이스라엘 각주 표지가 필요하므로 해당 표지를 본문에 배치했습니다.
