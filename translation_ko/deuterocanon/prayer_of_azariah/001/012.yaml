  text: And do not withdraw your mercy from us[a], for the sake of Abraham your beloved, and Isaac your servant[b], and Israel your holy one.
  footnotes:
  - marker: a
    text: Or 'do not take your mercy away from us.'
    reason: lexical_alternative
  - marker: b
    text: '''Israel'' here refers to the patriarch Jacob under his covenant name.'
    reason: cross_reference
translation:
  language: ko
  text: 그리고 우리에게서 당신의 자비를 거두지 마십시오[a]. 아브라함 — 당신께서 사랑하신 이 — 과 이삭 — 당신의 종[b] — 과 이스라엘[c]을 위하여 그러하소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 자비를 우리에게서 거두어 가지 마십시오.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘종’은 여기서 족장 이삭에 대한 존칭적 호칭입니다.
    reason: cultural_note
  - marker: c
    text: 여기서 ‘이스라엘’은 족장 야곱의 언약명입니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποστήσῃς
  english_pob_choice: withdraw
  chosen_korean: 거두지 마십시오
  alternatives_korean:
  - 거두어 가십시오
  - 물러나게 하십시오
  - 떼어 내지 마십시오
  lexicon: BDAG
  rationale: 자비를 대상에서 ‘치우거나 거둬 가는’ 뉘앙스를 자연스럽게 살리면서, 기도문답게 간청의 어조를 유지합니다.
- source_word: τὸ ἔλεός
  english_pob_choice: mercy
  chosen_korean: 자비
  alternatives_korean:
  - 긍휼
  - 인애
  - 은혜
  lexicon: LEH
  rationale: ἔλεος의 기본 의미를 살리되, 본문 기도체에서 가장 직접적으로 이해되는 표준어로 옮겼습니다.
- source_word: δοῦλόν
  english_pob_choice: servant
  chosen_korean: 종
  alternatives_korean:
  - 종자
  - 노예
  - 시종
  lexicon: BDAG
  rationale: 족장에 대한 존칭적 호칭으로 기능하지만, δοῦλος의 기본 사회적 종속성을 완전히 지우지 않기 위해 프로젝트 기본값인 ‘종’을 유지했습니다.
- source_word: ἅγιόν
  english_pob_choice: holy one
  chosen_korean: 거룩한 이
  alternatives_korean:
  - 성도
  - 거룩한 자
  - 성별된 이
  lexicon: BDAG
  rationale: ἅγιος의 실질적 서술을 따라, 이스라엘/야곱을 하나님께 속한 자로 가리키는 명사적 표현을 한국어 자연문으로 옮겼습니다.
theological_decisions:
- issue: 아브라함·이삭·이스라엘을 근거로 자비를 구하는 διὰ의 호소력
  chosen_reading: ‘~을 위하여’로 번역해 족장들과의 관계를 간구의 근거로 드러냈습니다.
  alternative_readings:
  - ~때문에
  - ~의 덕분에
  rationale: 본문은 족장들의 공로를 선언하기보다 하나님께서 맺으신 관계를 근거로 자비를 청하는 기도입니다. ‘위하여’가 이 간구의 방향성을 가장 잘 드러냅니다.
  doctrine_reference: DOCTRINE.md §1, §3
- issue: 이스라엘의 호칭을 ‘이스라엘’로 둘지 ‘야곱’으로 풀지
  chosen_reading: 본문 표면형을 따라 ‘이스라엘’을 유지하되, 의미상 족장 야곱을 가리키는 호칭으로 읽힙니다.
  alternative_readings:
  - 야곱
  - 이스라엘(야곱)
  rationale: 그리스어 본문은 Ἰσραήλ을 사용하므로 표면형을 존중해야 하며, 기도문이 족장의 언약명으로 그를 부르는 효과도 보존됩니다.
  doctrine_reference: DOCTRINE.md 번역 원칙
