theological_decisions:
- issue: 자연물에 대한 직접 명령의 화행
  chosen_reading: 피조물인 눈서리와 눈을 향한 예배적 부름으로 읽습니다.
  alternative_readings:
  - 단순한 의인화적 시적 장치로만 읽는 것
  - 자연현상에 대한 일반적 찬양 권고로 완화하는 것
  rationale: 원문은 복수 명령형으로 자연현상에 직접 말하며, 이를 약화시키지 않고 창조세계가 주님을 찬양하는 목소리로 보존했습니다.
  doctrine_reference: 창조세계의 찬양, 시적 의인화
- issue: κύριος의 번역
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 야훼
  rationale: 이 구절은 그리스어 유대교 찬양문맥의 일반적인 κύριος로 읽히며, 본문 자체는 야훼 표지를 요구하지 않으므로 POB 기본값인 ‘주님’을 유지합니다.
  doctrine_reference: κύριος → 주님
