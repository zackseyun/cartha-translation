translation:
  language: ko
  text: 그리고 그것이 지나가며, 그 주변에 있던 갈대아 사람들 가운데 그것이 찾아낸 자들을 태워 버렸습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지나가며 불을 지폈다.’ 헬라어 동사들은 좀 더 형식적으로 옮길 수 있지만, 본문은 장면의 파괴력을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διώδευσεν
  english_pob_choice: swept through
  chosen_korean: 지나가며
  alternatives_korean:
  - 통과하며
  - 휩쓸고 지나가며
  - 지나쳤으며
  lexicon: LSJ
  rationale: 동사가 단순한 이동보다 불길의 강한 진행을 가리키므로, 한국어에서는 과장되지 않게 ‘지나가며’로 옮기되 뒤의 ‘태워 버렸습니다’와 함께 파괴적 흐름을 살렸습니다.
- source_word: ἐνεπύρισεν
  english_pob_choice: burned up
  chosen_korean: 태워 버렸습니다
  alternatives_korean:
  - 불태웠습니다
  - 불살랐습니다
  - 태웠습니다
  lexicon: LSJ
  rationale: 문맥상 단순 점화가 아니라 소멸적 피해를 뜻하므로, 결과의 강도를 드러내는 ‘태워 버렸습니다’를 선택했습니다.
- source_word: οὓς εὗρεν
  english_pob_choice: those ... whom it found
  chosen_korean: 그것이 찾아낸 자들
  alternatives_korean:
  - 그것이 발견한 자들
  - 그것이 만난 자들
  - 그것이 찾아낸 이들
  lexicon: LSJ
  rationale: 관계절의 개방성을 살리면서도 한국어 문장 흐름을 자연스럽게 하기 위해, 사람을 가리키는 포괄적 표현으로 옮겼습니다.
- source_word: περὶ τὴν κάμινον
  english_pob_choice: around the furnace
  chosen_korean: 그 주변에 있던
  alternatives_korean:
  - 풀무 주위에 있던
  - 풀무 주변의
  - 그 화덕 주위에 있던
  lexicon: LSJ
  rationale: περί+대격의 위치 관계를 한국어에서 가장 자연스러운 공간 표현으로 풀어, 반복을 줄이면서도 장면의 위치를 분명히 했습니다.
- source_word: τῶν Χαλδαίων
  english_pob_choice: of the Chaldeans
  chosen_korean: 갈대아 사람들
  alternatives_korean:
  - 갈대아인들
  - 칼데아 사람들
  - 바빌론 사람들
  lexicon: LSJ
  rationale: 본문의 민족명 Χαλδαῖοι를 직역해 ‘갈대아 사람들’로 두어, 전통적 의미를 유지하면서도 현대 한국어에서 이해하기 쉽게 했습니다.
theological_decisions:
- issue: 불의 주체를 본문이 어떻게 지시하는지
  chosen_reading: 한국어 본문도 원문처럼 주어를 명시적으로 보충하지 않고 ‘그것이’로 유지해, 불/재앙의 주체가 문맥에서 드러나도록 했습니다.
  alternative_readings:
  - ‘그 불이’로 주어를 보충하는 읽기
  - ‘그가’로 인물 주어를 보충하는 읽기
  rationale: 헬라어 동사는 서술 진행을 따라가며, 문맥상 주어를 과잉 지정하면 장면의 긴장감과 원문의 개방성이 약해집니다.
  doctrine_reference: 원문 서술의 주어 비명시성 유지
