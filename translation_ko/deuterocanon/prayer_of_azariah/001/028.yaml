translation:
  language: ko
  text: 그때 세 사람은 마치 한 입으로 하듯이 용을 찬양하고 하나님께 영광을 돌리며 복을 빌며 풀무 가운데서 말하기를:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 문자적으로 ‘한 입에서 나오듯이’입니다. 이는 세 사람의 찬양이 완전히 하나였음을 강조합니다.
    reason: source_note
lexical_decisions:
- source_word: Τότε
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그때에
  - 그런 다음
  lexicon: LSJ
  rationale: 장면 전환을 자연스럽게 표시하면서도 서술의 간결함을 유지하기 위해 ‘그때’로 옮겼습니다.
- source_word: οἱ τρεῖς
  english_pob_choice: the three
  chosen_korean: 세 사람은
  alternatives_korean:
  - 세 사람
  - 그 세 사람들
  lexicon: LSJ
  rationale: 원문은 명사를 반복하지 않고 ‘세 사람들’만 말하므로, 한국어에서는 이해에 필요한 최소한의 명사를 보충하되 인물 수를 그대로 살렸습니다.
- source_word: ὡς ἐξ ἑνὸς στόματος
  english_pob_choice: as with one mouth
  chosen_korean: 마치 한 입으로 하듯이
  alternatives_korean:
  - 한 목소리로
  - 한 입에서 나오듯이
  lexicon: LSJ
  rationale: 직역적 이미지를 살리면서도 한국어로 자연스럽게 읽히도록 옮겼습니다. ‘한 목소리로’는 의미는 분명하지만 원문의 ‘입’ 이미지를 약화시킵니다.
- source_word: ὕμνουν
  english_pob_choice: were singing hymns
  chosen_korean: 용을 찬양하고
  alternatives_korean:
  - 찬송하며
  - 찬가를 부르며
  lexicon: LSJ
  rationale: 이 본문은 단순한 일반 찬양보다 노래하는 찬송 행위를 가리키므로 ‘찬양하고’로 옮겨 동사열의 병렬을 유지했습니다.
- source_word: ἐδόξαζον
  english_pob_choice: glorifying
  chosen_korean: 하나님께 영광을 돌리며
  alternatives_korean:
  - 영광을 드리며
  - 영화롭게 하며
  lexicon: LSJ
  rationale: 원문의 ‘영광을 돌리다/돌려 드리다’는 하나님께 돌리는 영예의 행위를 분명히 드러내므로 이 표현을 택했습니다.
- source_word: εὐλόγουν
  english_pob_choice: blessing
  chosen_korean: 복을 빌며
  alternatives_korean:
  - 찬송하며
  - 축복하며
  lexicon: LSJ
  rationale: εὐλογέω의 기본 의미인 ‘복을 빌다/축복하다’를 살리되, 하나님을 향한 발화에서는 한국어로 가장 자연스러운 ‘복을 빌다’로 표현했습니다.
- source_word: ἐν τῇ καμίνῳ
  english_pob_choice: in the furnace
  chosen_korean: 풀무 가운데서
  alternatives_korean:
  - 용광로 가운데서
  - 풀무 안에서
  lexicon: LSJ
  rationale: 다니엘의 불가마 문맥에서 κάμινος는 전통적으로 ‘풀무’가 적절하며, 장소감을 살리기 위해 ‘가운데서’로 옮겼습니다.
theological_decisions:
- issue: 찬양 동사의 삼중 병렬
  chosen_reading: ‘찬양하고… 영광을 돌리며… 복을 빌며’로 세 동사를 모두 분리해 번역했습니다.
  alternative_readings:
  - 둘 또는 셋을 묶어 ‘찬양하며 경배하며’로 압축
  - ‘복을 빌다’를 ‘축복하다’로 일반화
  rationale: 원문은 ὕμνουν, ἐδόξαζον, εὐλόγουν을 나란히 두어 예배 행위의 미세한 차이를 강조하므로, 한국어에서도 의미를 합치지 않고 구분해 드러냈습니다.
  doctrine_reference: 본문의 예배 언어와 문학적 강조에 대한 충실성
- issue: 무리의 일치성 표현
  chosen_reading: ‘마치 한 입으로 하듯이’로 원문의 생생한 비유를 유지했습니다.
  alternative_readings:
  - ‘한 목소리로’로 의미 중심 번역
  - ‘한마음으로’로 의역
  rationale: 원문은 단순한 합창 이상의, 완전히 하나 된 발화를 시각적으로 그려 주므로 ‘입’ 이미지를 보존하는 것이 본문의 힘을 더 잘 전달합니다.
  doctrine_reference: 본문의 수사적 강조와 공동체적 일치
