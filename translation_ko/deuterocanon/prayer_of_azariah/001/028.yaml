base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/028.yaml
  text: 'Then the three[a], as with one mouth, were singing hymns and glorifying and blessing God in the furnace, saying:'
  footnotes:
  - marker: a
    text: Or 'with one voice.' The Greek literally says 'as from one mouth,' emphasizing the complete unity of the three in their praise.
