translation:
  language: ko
  text: 주님, 우리 조상의 하나님이신 주님은 찬양을 받으시며 영원히 높임을 받으십니다. 주님의 거룩하고 영광스러운 이름은 찬양을 받으시며 모든 시대에 걸쳐 지극히 찬양받고 높임을 받으십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘주의 영광의 거룩한 이름’에 가까운 압축된 표현이어서, 본문은 의미를 자연스럽게 풀어 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주인이신 분
  lexicon: LSJ
  rationale: 직접 호칭으로 쓰인 κύριε를 한국어 예배 문맥에 자연스럽고도 존칭 있게 옮기기 위해 주님을 택했습니다.
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  english_pob_choice: the God of our fathers
  chosen_korean: 우리 조상의 하나님
  alternatives_korean:
  - 우리 조상들의 하나님
  - 우리 선조들의 하나님
  lexicon: LSJ
  rationale: 집단적 언약 표현을 살리되 현대 한국어에서 더 자연스러운 ‘조상’을 사용했습니다.
- source_word: αἰνετὸς καὶ ὑπερυψούμενος
  english_pob_choice: praised and highly exalted
  chosen_korean: 찬양을 받으시며 영원히 높임을 받으십니다
  alternatives_korean:
  - 찬양받으시며 높임을 받으십니다
  - 찬미받으시며 지극히 높임을 받으십니다
  lexicon: LSJ
  rationale: 형용사적 찬양어구를 한국어에서는 서술적 표현으로 풀어, 수동적 찬양과 높임의 뜻을 함께 드러냈습니다.
- source_word: τὸ ὄνομα τῆς δόξης σου τὸ ἅγιον
  english_pob_choice: your holy, glorious name
  chosen_korean: 주님의 거룩하고 영광스러운 이름
  alternatives_korean:
  - 주님의 거룩한 영광의 이름
  - 주님의 거룩하고 영광된 이름
  lexicon: LSJ
  rationale: 그리스어의 압축된 명사구를 자연스러운 한국어로 옮기되, ‘거룩함’과 ‘영광’의 이중 수식을 보존했습니다.
- source_word: ὑπεραινετὸν καὶ ὑπερυψούμενον
  english_pob_choice: supremely praised and highly exalted
  chosen_korean: 지극히 찬양받고 높임을 받으십니다
  alternatives_korean:
  - 극진히 찬양받고 높임을 받으십니다
  - 지극히 칭송받고 높임을 받으십니다
  lexicon: LSJ
  rationale: ὑπερ-의 강한 강조를 ‘지극히’로 반영하고, 첫 번째 찬양어와 구분되도록 반복 구조를 유지했습니다.
theological_decisions:
- issue: 직접 호칭의 예배문 형식과 한국어 문체
  chosen_reading: 주님… 받으십니다
  alternative_readings:
  - 주님… 받으소서
  - 주여… 받으시나이다
  rationale: 본문은 하나님께 대한 직서술적 축복 선언이므로, 청원형보다 선언형 합쇼체가 원문의 축도 기능을 더 정확히 드러냅니다.
  doctrine_reference: Translation philosophy
