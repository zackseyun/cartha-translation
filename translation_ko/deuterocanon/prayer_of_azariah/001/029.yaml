  yaml_path: translation/deuterocanon/prayer_of_azariah/001/029.yaml
  text: Blessed are you[a], Lord, the God of our fathers, and praised and highly exalted forever; and blessed is your holy, glorious name, and supremely praised and highly exalted through all the ages.
  footnotes:
  - marker: a
    text: Or, more literally, 'the holy name of your glory.' The Greek phrase is compressed, and the main text renders its sense in natural English.
