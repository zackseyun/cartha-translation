translation:
  language: ko
  text: 주님, 주님은 우리 조상의 하나님이시며 복되시고 찬양을 받으시며 영원히 지극히 높임을 받으십니다. 또한 주님의 거룩하고 영광스러운 이름[a]은 복되며, 모든 시대에 걸쳐 더없이 찬양받고 지극히 높임을 받습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 직역하면 ‘주의 영광의 거룩한 이름’에 가까운 압축된 표현입니다. 본문은 그 뜻을 자연스러운 한국어로 옮겼습니다.
    reason: lexical_alternative
