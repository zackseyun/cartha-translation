  - -합니다
  rationale: 본문이 제의적 청원문이므로, 직접 청원은 한국어 기도체를 반영해 ‘-하시옵소서’를 사용하고, 병렬 동사구는 서술적 연결로 처리했습니다.
  doctrine_reference: 'DOCTRINE.md: preserve genre/register while using modern formal Korean'
