  lexicon: LSJ
  rationale: πίων은 살이 오른, 잘 먹은 뜻이므로 희생 제물의 가치와 살진 상태를 살린 ‘살진 어린양’이 자연스럽습니다.
- source_word: ἐξιλάσαι
  english_pob_choice: make atonement
  chosen_korean: 속죄하게 하시며
  alternatives_korean:
  - 화목하게 하시며
