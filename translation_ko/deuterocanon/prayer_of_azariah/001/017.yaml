  lexicon: LSJ
  rationale: 동사는 속죄/화목의 제의적 효력을 가리키므로, 한국어 성경어휘로는 ‘속죄하다’가 가장 직접적입니다. 문맥상 청원형을 살려 ‘속죄하게 하시며’로 옮겼습니다.
- source_word: ὄπισθέν σου
  english_pob_choice: before you / in your presence
  chosen_korean: 주님 앞에서
  alternatives_korean:
  - 주님 앞에
  - 주님의 임재 안에서
  - 주님 앞에 놓이게
  lexicon: LSJ
  rationale: 직역의 ‘뒤에서’는 문맥상 어색하므로, ἐνώπιόν σου와 병행되는 관용적 의미를 살려 ‘주님 앞에서’로 통일했습니다.
theological_decisions:
