  rationale: 본문은 직접적인 여호와 표기보다 주님께 드리는 기도문 형식의 κύριος 사용이므로, 한국어 예배·성경 문맥에 자연스러운 ‘주님’을 택했습니다. 다만 인용적 야훼 환원은 본 절에 해당하지 않습니다.
  doctrine_reference: 'DOCTRINE.md: source-driven divine name handling; prayer register'
- issue: 기도문에서의 직접 호칭과 종결 어미
  chosen_reading: -하시옵소서 / -하시며
  alternative_readings:
