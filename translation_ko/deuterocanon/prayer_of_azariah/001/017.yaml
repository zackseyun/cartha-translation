base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/017.yaml
  text: As with whole burnt offerings of rams and bulls[a], and as with tens of thousands of fat lambs, so let our sacrifice be before you today and make atonement before you, for there is no shame for those who have put their trust in you[b], and let it be brought to completion before you.
  footnotes:
  - marker: a
    text: Greek literally repeats a phrase that can mean 'behind you'; in context it is best understood idiomatically as 'before you' or 'in your presence.'
    reason: lexical_alternative
  - marker: b
    text: Or 'may it be accepted before you.' The Greek verb can carry sacrificial atonement/appeasement force.
    reason: alternative_reading
translation:
  language: ko
  text: 숫양과 황소의 온전한 번제와 수만 마리의 살진 어린양처럼[a], 오늘 우리 제사가 주님 앞에 있게 하시고 주님 앞에서 속죄하게 하시며, 주님을 신뢰하는 이들에게는 수치가 없으니[b], 주님 앞에서 온전하게 하시옵소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 제물 목록과 함께 반복 구조를 이루며, 관용적으로는 ‘주님 앞에서/주님 앞에’의 뜻으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘당신을 신뢰한 이들’이며, POB의 영어처럼 ‘신뢰하다’의 완료-지속 뉘앙스를 살렸습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁλοκαυτώμασι
  english_pob_choice: whole burnt offerings
  chosen_korean: 온전한 번제
  alternatives_korean:
