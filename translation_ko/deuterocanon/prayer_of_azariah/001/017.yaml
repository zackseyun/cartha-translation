  lexicon: LSJ
  rationale: ὁλοκαύτωμα는 전부를 불살라 드리는 제사를 가리키므로, 단순한 ‘번제’보다 제사의 전소 성격을 드러내는 ‘온전한 번제’가 더 정확합니다.
