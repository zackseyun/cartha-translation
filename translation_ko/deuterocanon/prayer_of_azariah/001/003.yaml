review_pass:
  verdict: revise
  source_fidelity: 첫 송축문의 직접 호칭과 ‘우리 조상들의 하나님’이라는 언약적 표현은 대체로 잘 반영했습니다. 그러나 δεδοξασμένον은 이미 ‘영화롭게 된/영광을 받은’ 상태를 나타내는데, ‘영화롭게 됩니다’는 앞으로 그렇게 된다는 변화의 뜻으로 읽혀 원문의 서술과 맞지 않습니다. 또한 각주 b의 ‘세대들’은 αἰῶνας(시대들, 영겁들)를 정확히 반영하지 못합니다.
  naturalness: ‘찬송받으소서’는 기도·예배 문맥에서 자연스럽고 현대 합쇼체로도 사용할 수 있습니다. 다만 ‘찬양받고 영화롭게 됩니다’는 이름을 주어로 삼을 때 다소 부자연스럽고, 미래적·과정적 뉘앙스가 생깁니다. ‘찬양과 영광을 받으십니다’가 자연스럽고 안정적입니다.
  terminology: ‘주님’, ‘우리 조상들의 하나님’, ‘영원토록’은 표준 한국어 성서·예배 문맥에 적절합니다. ‘조상들’은 그리스어의 문자적 ‘아버지들’을 넓게 옮긴 표현이므로 각주에서 이를 투명하게 밝혀야 합니다. ‘영화롭게 됩니다’ 대신 ‘영광을 받으십니다’를 사용해 δεδοξασμένον의 영예·영광 의미를 보존합니다.
