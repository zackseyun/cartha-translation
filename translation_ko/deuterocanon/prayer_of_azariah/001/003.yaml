base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/003.yaml
  text: Blessed are you[a], Lord, the God of our fathers, and praised and glorified is your name forever[b],
  footnotes:
  - marker: a
    text: Or 'the God of our ancestors.' The Greek reads 'our fathers,' a covenantal biblical expression retained in the main text.
    reason: lexical_alternative
  - marker: b
    text: Literally 'into the ages,' an idiom meaning enduring perpetuity.
    reason: lexical_alternative
translation:
  language: ko
  text: 찬송받으소서, 주님, 우리 조상들의 하나님이시며, 주님의 이름은 영원토록 찬양받고 영화롭게 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘우리 아버지들’을 뜻하는 관용구입니다. 한국어 본문은 언약사적 의미를 살려 ‘우리 조상들’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘세대들 안으로’에 가깝지만, 관용적으로는 영원한 지속을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  english_pob_choice: Blessed
  chosen_korean: 찬송받으소서
  alternatives_korean:
  - 복되시나이다
  - 찬송받으실지어다
  lexicon: BDAG
  rationale: 장엄한 축복문/송축문 형식의 서두이므로 단순 서술형보다 직접적 송축 어법을 살렸습니다. 현대 합쇼체로는 ‘찬송받으소서’가 가장 자연스럽고 예배적입니다.
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주인이신 분
  lexicon: BDAG
  rationale: 하나님께 드리는 직접 호칭이므로 한국어 예배 문맥에서 자연스러운 존칭형 ‘주님’을 택했습니다.
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  english_pob_choice: the God of our fathers
  chosen_korean: 우리 조상들의 하나님이시며
  alternatives_korean:
  - 우리 아버지들의 하나님이시며
  - 우리 선조들의 하나님이시며
  lexicon: BDAG
  rationale: Greek의 ‘우리의 fathers’는 언약사적 관용구이므로, 성별을 중화하되 혈연·언약 연속성을 보존하는 ‘조상들’을 사용했습니다.
- source_word: αἰνετὸν καὶ δεδοξασμένον
  english_pob_choice: praised and glorified
  chosen_korean: 찬양받고 영화롭게 됩니다
  alternatives_korean:
  - 찬양받고 영광받습니다
  - 찬양받으시며 영화롭게 되십니다
  lexicon: BDAG
  rationale: 명사구적 찬양 선언을 한국어에서 자연스러운 서술형으로 옮겼습니다. ‘영화롭게 됩니다’는 δεδοξασμένον의 ‘영광을 받음’을 살리면서도 예배적 문체를 유지합니다.
- source_word: εἰς τοὺς αἰῶνας
  english_pob_choice: forever
  chosen_korean: 영원토록
  alternatives_korean:
  - 세세토록
  - 영원히
  lexicon: BDAG
  rationale: ‘into the ages’의 관용적 무한 지속을 현대 한국어에서 가장 자연스럽게 전달하는 표현으로 ‘영원토록’을 택했습니다.
theological_decisions:
- issue: 송축문 첫 구의 어조
  chosen_reading: 찬송받으소서
  alternative_readings:
  - 복되시나이다
  - 찬송받으실지어다
  rationale: 본문은 단순 정보 전달이 아니라 하나님을 향한 직접적 찬양 선언이므로, 한국어에서도 기도·예배의 직접 화법을 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 6
- issue: τῶν πατέρων ἡμῶν의 성별-언어 처리
  chosen_reading: 우리 조상들의 하나님이시며
  alternative_readings:
  - 우리 아버지들의 하나님이시며
  rationale: 그리스어의 문자적 ‘아버지들’은 유지 가능한 관용구이지만, 한국어에서는 언약적 의미를 해치지 않으면서도 성별 고정성을 덜어 주는 ‘조상들’이 본문의 기능을 더 분명히 전달합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
