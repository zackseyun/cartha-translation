translation:
  language: ko
  text: 찬송받으소서, 주님, 우리 조상들의 하나님이시며,[a] 주님의 이름은 영원토록 찬양과 영광을 받으십니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘우리 아버지들의 하나님’이라고 합니다. 이는 언약 전승 안의 선조들을 가리키는 성서적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘시대들에 이르도록’이며, 영원히 지속됨을 뜻하는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  english_pob_choice: Blessed
  chosen_korean: 찬송받으소서
  alternatives_korean:
