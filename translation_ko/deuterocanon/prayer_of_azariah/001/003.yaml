  - severity: medium
    issue: 각주 b의 ‘세대들’
    rationale: αἰῶνας는 ‘세대들’보다 ‘시대들, 영겁들’을 뜻합니다. εἰς τοὺς αἰῶνας는 지속적 영원을 나타내는 관용구이므로 각주는 이를 정확히 설명해야 합니다.
  - severity: low
    issue: 각주 a의 표현 정확성
    rationale: 그리스어가 문자적으로 말하는 것은 ‘우리 아버지들’이며, 그 전체 표현이 성서적 언약 전승을 가리키는 관용적 표현입니다. 현 각주는 이 점을 더 직접적으로 밝히는 편이 좋습니다.
