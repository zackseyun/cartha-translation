lexical_decisions:
- source_word: εὐλογεῖτε
  english_pob_choice: Bless
  chosen_korean: 찬송하십시오
  alternatives_korean:
  - 복을 빕니다
  - 축복하십시오
  - 찬양하십시오
  lexicon: LSJ / BDAG
  rationale: 천체를 향한 직접 호명과 병행되는 예배적 명령이므로, 단순한 ‘축복하다’보다 한국어에서 하나님께 드리는 찬송의 의미를 분명히 하는 ‘찬송하십시오’를 택했습니다.
- source_word: ἥλιος καὶ σελήνη
  english_pob_choice: sun and moon
  chosen_korean: 해와 달아
  alternatives_korean:
  - 해와 달
  - 해님과 달님
  lexicon: LSJ
  rationale: 직접 호격이므로 한국어 호명 어미를 살려 ‘해와 달아’로 옮겨, 피조 세계를 예배의 소환 대상으로 부르는 시적 긴장을 보존했습니다.
- source_word: ὑμνεῖτε
  english_pob_choice: sing praise
  chosen_korean: 노래로 찬양하고
  alternatives_korean:
  - 찬송하고
  - 노래하며 찬양하고
  lexicon: BDAG
  rationale: ὑμνέω의 ‘노래하며 찬양하다’라는 음악적 뉘앙스를 드러내기 위해, 행위와 수단을 함께 살린 표현을 사용했습니다.
- source_word: ὑπερυψοῦτε
  english_pob_choice: highly exalt
  chosen_korean: 크게 높이십시오
  alternatives_korean:
  - 지극히 높이십시오
  - 한없이 높이십시오
  - 크게 높여 드리십시오
  lexicon: LSJ
  rationale: 복합어의 강한 강조를 자연스러운 한국어로 옮기되, 예배적 명령형의 힘을 유지하기 위해 ‘크게 높이십시오’를 선택했습니다.
- source_word: εἰς τοὺς αἰῶνας
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 세세토록
  - 세월이 끝없이 이어지는 동안
  lexicon: BDAG
  rationale: 관용적 표현의 지속성과 종결 없음이 핵심이므로, 현대 한국어에서 가장 분명한 ‘영원히’로 옮겼습니다.
theological_decisions:
- issue: κύριος의 지칭
  chosen_reading: 주
  alternative_readings:
  - 주님
  - 야훼
  rationale: 이 찬가에서 κύριος는 예배의 대상인 하나님을 가리키며, 본문 자체가 LXX 문맥 안에 있으므로 한국어 본문에서는 간결한 ‘주’를 사용했습니다. 인용 표지나 주석 없이 야훼로 특정할 근거는 이 절 단독으로는 부족합니다.
