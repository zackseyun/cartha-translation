translation:
  language: ko
  text: 이는 우리가 모든 일에서 죄를 지었고, 주님에게서 돌아서므로 불법을 행했으며, 모든 일에서 크게 죄를 지었기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡμάρτομεν
  english_pob_choice: we have sinned
  chosen_korean: 우리가 ... 죄를 지었고
  alternatives_korean:
  - 우리가 죄를 지었고
  - 우리가 죄를 범했고
  lexicon: BDAG ἁμαρτάνω
  rationale: 회개의 고백문이므로 완료된 죄책을 자연스러운 현대 한국어로 나타내기 위해 '죄를 지었다'를 썼습니다.
- source_word: ἐν πᾶσι
  english_pob_choice: in all things
  chosen_korean: 모든 일에서
  alternatives_korean:
  - 모든 것에서
  - 전반적으로
  lexicon: BDAG πᾶς
  rationale: 범위를 포괄적으로 살리되, 한국어에서 가장 자연스러운 전치사구인 '모든 일에서'로 옮겼습니다.
- source_word: ἠνομήσαμεν
  english_pob_choice: we have acted lawlessly
  chosen_korean: 불법을 행했으며
  alternatives_korean:
  - 법 없이 행했으며
  - 율법을 어겼으며
  - 불법하게 행했으며
  lexicon: BDAG ἀνομέω
  rationale: '''lawlessly''의 법/율법에 대한 위반성을 보존하려고 관용적이면서도 직접적인 ''불법을 행하다''를 택했습니다.'
- source_word: ἀποστῆναι ἀπὸ σοῦ
  english_pob_choice: by turning away from you
  chosen_korean: 주님에게서 돌아서므로
  alternatives_korean:
  - 주님에게서 떠나므로
  - 주님에게서 돌아서서
  - 주님에게서 멀어지므로
  lexicon: BDAG ἀφίστημι
  rationale: 단순한 공간적 이탈보다 관계적·언약적 이탈을 드러내기 위해 '돌아서다'를 사용했습니다.
- source_word: ἐξημάρτομεν
  english_pob_choice: we have sinned greatly
  chosen_korean: 크게 죄를 지었기
  alternatives_korean:
  - 심히 죄를 지었기
  - 크게 범죄했기
  - 몹시 죄를 지었기
  lexicon: BDAG ἐξαμαρτάνω
  rationale: 첫 번째 '죄를 지었다'보다 더 강한 중첩을 살리기 위해 강도를 나타내는 '크게'를 유지했습니다.
theological_decisions:
- issue: 두 개의 죄 고백 동사(ἡμάρτομεν, ἐξημάρτομεν)의 강도 차이를 한국어에서 구분할지 여부
  chosen_reading: 앞부분은 '죄를 지었고', 끝부분은 '크게 죄를 지었기'로 구분했습니다.
  alternative_readings:
  - 둘 다 '죄를 지었고'로 평준화하기
  - 끝부분을 '심히 죄를 지었기'로 더 강하게 옮기기
  rationale: 본문의 반복은 단순 중복이 아니라 고백의 강화를 이룹니다. 한국어에서도 어조를 구분해 이 수사적 긴장을 보존했습니다.
  doctrine_reference: DOCTRINE.md §5 Consistency of key terms, or documented exception
