base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/067.yaml
  text: Bless the Lord[a], all you who fear the Lord, the God of gods; sing praise and give thanks, for his mercy is forever[b], even forever and ever.
  footnotes:
  - marker: a
    text: Or 'all you who worship the Lord' or 'all you who revere the Lord.'
    reason: lexical_alternative
  - marker: b
    text: Or 'for his steadfast love endures forever.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님을 경외하는 모든 사람들아, 야훼, 곧 신들의 하나님을 찬양하십시오. 노래하며 감사하십시오. 그의 인자하심은 영원합니다. 곧 영원무궁합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “주님을 예배하는 모든 사람들아”, “주님을 공경하는 모든 사람들아”.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그의 자비는 영원합니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  english_pob_choice: Bless the Lord
  chosen_korean: 찬양하십시오
  alternatives_korean:
  - 복을 빌어 주십시오
  - 축복하십시오
  - 찬양하라
  lexicon: LXX/BDAG
  rationale: 여기서는 하나님께 드리는 예배적 호칭이므로 한국어에서는 명령형의 예배 언어인 “찬양하십시오”로 옮겼습니다. “복을 빌어 주십시오”는 의미가 어색하고, “축복하십시오”는 주체가 어긋납니다.
- source_word: πάντες οἱ σεβόμενοι τὸν κύριον
  english_pob_choice: all you who fear the Lord
  chosen_korean: 주님을 경외하는 모든 사람들아
  alternatives_korean:
  - 주님을 예배하는 모든 사람들아
  - 주님을 공경하는 모든 사람들아
  lexicon: BDAG
  rationale: σεβόμενοι는 단순한 감정적 두려움보다 경외와 경배의 태도를 가리키므로, 한국어 성서어법에서 가장 자연스러운 “경외하다”를 택했습니다. 직접 호소형으로는 합쇼체와 조화를 이루도록 “모든 사람들아”를 썼습니다.
- source_word: τὸν θεὸν τῶν θεῶν
  english_pob_choice: the God of gods
  chosen_korean: 신들의 하나님
  alternatives_korean:
  - 신들 위의 하나님
  - 모든 신들의 하나님
  lexicon: BDAG
  rationale: 그리스어의 격 구조를 유지하면서도 한국어에서는 수식 관계가 자연스럽도록 “신들의 하나님”으로 옮겼습니다. 영어 POB의 직역성을 살리되, 한국어에서 어색한 “신들의 신”은 피했습니다.
- source_word: ὑμνεῖτε
  english_pob_choice: sing praise
  chosen_korean: 노래하며
  alternatives_korean:
  - 찬송하며
  - 찬양의 노래를 부르며
  lexicon: BDAG
  rationale: 동사가 찬양의 노래를 부르는 행위를 분명히 가리키므로 “노래하며”로 간결하게 살렸습니다. 앞의 “찬양하십시오”와 함께 두 동작을 분리해 표현합니다.
- source_word: ἐξομολογεῖσθε
  english_pob_choice: give thanks
  chosen_korean: 감사하십시오
  alternatives_korean:
  - 감사드리십시오
  - 고백하십시오
  - 찬양을 고백하십시오
  lexicon: BDAG
  rationale: 이 문맥은 회개의 고백이 아니라 예배적 감사의 응답이므로 “감사하십시오”가 가장 적절합니다. 영어 POB의 해석도 이를 지지합니다.
- source_word: ὅτι εἰς τὸν αἰῶνα τὸ ἔλεος αὐτοῦ
  english_pob_choice: for his mercy is forever
  chosen_korean: 그의 인자하심은 영원합니다
  alternatives_korean:
  - 그의 자비는 영원합니다
  - 그의 사랑은 영원합니다
  lexicon: BDAG/LXX usage
  rationale: ἔλεος는 문맥상 언약적 긍휼을 뜻하므로 한국어 성서 전통의 “인자하심”으로 옮겼습니다. 영어 POB의 ‘mercy’와 병행 가능성을 살리되, 한국어 예배어법에 더 자연스럽습니다.
- source_word: καὶ εἰς τὸν αἰῶνα τῶν αἰώνων
  english_pob_choice: even forever and ever
  chosen_korean: 곧 영원무궁합니다
  alternatives_korean:
  - 영원토록입니다
  - 세세무궁합니다
  lexicon: LXX idiom
  rationale: 동일한 영원 표어를 한 번 더 강화하는 관용구이므로, 한국어에서는 중복을 살리면서도 매끄러운 “영원무궁합니다”로 처리했습니다. 앞절의 “영원합니다”와 짝을 이루도록 “곧”을 보조적으로 넣었습니다.
theological_decisions:
- issue: 한국어에서 κύριος를 ‘주님’으로 옮길지, 본문 뒤의 ‘하나님’을 중심으로 재구성할지
  chosen_reading: 본문 첫 호칭은 ‘주님’으로, 뒤의 동일 대상을 풀어 ‘야훼, 곧 신들의 하나님’으로 옮겼습니다.
  alternative_readings:
  - 주를 경외하는 모든 사람들아
  - 주님을 경외하는 모든 사람들아
  rationale: 본문은 κύριον과 τὸν θεὸν τῶν θεῶν을 병치하므로, 첫 호칭은 일반적인 ‘주님’으로 두고 뒤에서 누구를 가리키는지 설명적으로 풀었습니다. 이렇게 해야 호칭의 반복과 신학적 강조가 모두 보존됩니다.
  doctrine_reference: 'POB translation philosophy: source-transparency and auditable divine-name handling'
- issue: ἔλεος의 한국어 처리
  chosen_reading: ‘인자하심’
  alternative_readings:
  - 자비
  - 자애
  rationale: 이 찬송 문맥에서는 반복되는 예배용 정형구와 맞물려 ‘인자하심’이 가장 자연스럽고, 동시에 단순한 감정보다 언약적 자비의 지속성을 드러냅니다.
  doctrine_reference: POB glossary and LXX hymn diction
