base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/023.yaml
  text: And the king’s attendants who threw them in did not stop feeding the furnace with naphtha and pitch and tow and brushwood[b][a], keeping it burning.
  footnotes:
  - marker: a
    text: Or 'bitumen' for 'naphtha' (ἀφθάλτῳ); the Greek names a highly flammable petroleum-like substance.
    reason: lexical_alternative
  - marker: b
    text: Or 'vine-branches' for 'brushwood' (κληματίδα); the term may refer specifically to cut vine shoots used as fuel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들을 그 안에 던져 넣은 왕의 시종들은 나프타와 역청과 아마 섬유 찌꺼기와 포도나무 가지를 써서 풀무에 계속 불을 지피기를 멈추지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나프타’로 옮긴 ἀφθάλτῳ는 가연성 석유계 물질을 가리킵니다. ‘천연 아스팔트’ 또는 ‘역청’으로 옮길 수도 있으나, 뒤의 πίσσῃ(역청)와 구별하여 번역했습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘포도나무 가지’로 옮긴 κληματίδα는 연료로 쓰는 잘라 낸 포도나무 순을 가리킬 수 있습니다. 일반적으로는 ‘섶’ 또는 ‘잔가지’로도 옮길 수 있습니다.
    reason: lexical_alternative
