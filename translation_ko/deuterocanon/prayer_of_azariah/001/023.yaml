  doctrine_reference: 서사적 강조의 보존
- issue: καίοντες τὴν κάμινον의 동작상 처리
  chosen_reading: ‘용광로를 계속 달구는’으로 현재진행적 지속성을 살렸습니다.
  alternative_readings:
  - ‘용광로를 태우는’ 직역
  - ‘용광로에 불을 지피는’ 완화
  rationale: 한국어에서 용광로는 ‘태운다’보다 ‘달군다’가 더 자연스럽고, 여기서는 이미 타고 있는 불을 계속 유지하는 의미가 핵심이므로 지속 동작을 살렸습니다.
  doctrine_reference: 서사적 의미 보존
