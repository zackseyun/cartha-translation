  text: And the king’s attendants who threw them in did not stop feeding the furnace with naphtha and pitch and tow and brushwood[b][a], keeping it burning.
  footnotes:
  - marker: a
    text: Or 'bitumen' for 'naphtha' (ἀφθάλτῳ); the Greek names a highly flammable petroleum-like substance.
    reason: lexical_alternative
  - marker: b
    text: Or 'vine-branches' for 'brushwood' (κληματίδα); the term may refer specifically to cut vine shoots used as fuel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들을 그 안에 던져 넣은 왕의 시종들은 아스팔트와 역청과 삼밥과 덤불장작으로 풀무질하여 용광로를 계속 달구는 일을 멈추지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἀφθάλτῳ는 가연성 석유계 물질을 가리키며, 영어 POB는 이를 ‘naphtha’로 본문에 두고 ‘bitumen’을 대안으로 제시합니다.
    reason: lexical_alternative
  - marker: b
    text: κληματίδα는 잘라낸 포도나무 순이나 잔가지류를 가리킬 수 있어, 영어 POB는 ‘brushwood’와 ‘vine-branches’를 병기합니다.
    reason: lexical_alternative
