  lexicon: LSJ
  rationale: κληματίς류는 잘린 가지, 특히 연료로 쓰는 포도나무 순을 가리킬 수 있으므로, 기능을 살린 ‘덤불장작’으로 옮겨 연료 목록의 맥락을 유지했습니다.
theological_decisions:
- issue: 불가해한 연료 목록을 과도하게 정리하지 않기
  chosen_reading: 본문의 네 가지 연료를 모두 구별하여 나열했습니다.
