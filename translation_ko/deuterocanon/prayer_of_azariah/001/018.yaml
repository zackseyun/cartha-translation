  rationale: 동사는 단순한 추종보다 ‘뒤를 따라 계속 가다’의 뉘앙스를 가지므로, 한국어에서는 자연스럽게 ‘따르며’로 옮기되 문맥상 대상을 분명히 했습니다.
- source_word: ἐν ὅλῃ καρδίᾳ ἡμῶν
  english_pob_choice: with our whole heart
  chosen_korean: 온 마음으로
  alternatives_korean:
