    reason: alternative_reading
lexical_decisions:
- source_word: ἐξακολουθοῦμεν
  english_pob_choice: we follow after you
  chosen_korean: 주님을 따르며
  alternatives_korean:
  - 주님을 따라가며
  - 주님을 계속 따르며
  - 주님을 뒤따르며
  lexicon: BDAG
  rationale: 동사는 단순한 추종보다 ‘뒤를 따라 계속 가다’의 뉘앙스를 가지므로, 한국어에서는 자연스럽게 ‘따르며’로 옮기되 문맥상 대상을 분명히 했습니다.
- source_word: ἐν ὅλῃ καρδίᾳ ἡμῶν
  english_pob_choice: with our whole heart
  chosen_korean: 온 마음으로
  alternatives_korean:
  - 우리의 온 마음으로
  - 마음을 다해
  - 전심으로
  lexicon: BDAG
  rationale: 히브리식/성서적 관용구를 한국어의 현대적 자연스러움으로 살리면서, 분절된 직역보다 결속된 헌신의 의미를 유지했습니다.
- source_word: φοβούμεθά σε
  english_pob_choice: we fear you
  chosen_korean: 주님을 두려워하고
  alternatives_korean:
  - 주님을 경외하고
  - 주님을 두려워하며
  - 주님을 경외합니다
  lexicon: BDAG
  rationale: 본문은 ‘두려워하다’의 어휘를 직접 사용하므로, 그 신학적 긴장을 약화시키는 ‘경외’만으로 대체하지 않고 본문 그대로의 감정을 살렸습니다.
- source_word: ζητοῦμεν τὸ πρόσωπόν σου
  english_pob_choice: we seek your face
  chosen_korean: 주님의 얼굴을 찾습니다
  alternatives_korean:
  - 주님의 얼굴을 구합니다
  - 주님의 임재를 구합니다
  - 주님을 찾습니다
  lexicon: BDAG
  rationale: 직역상 ‘얼굴’을 유지해 성서적 관용과 이미지성을 보존했으며, 해석적 표현인 ‘임재’는 각주로 돌리는 편이 더 투명합니다.
theological_decisions:
- issue: φοβούμεθά σε의 번역 수위
  chosen_reading: 주님을 두려워하고
  alternative_readings:
  - 주님을 경외하고
  - 주님을 우러러 두려워하고
  rationale: 하나님에 대한 경외를 말하더라도 본문은 ‘두려움’의 어휘를 유지합니다. 본문이 가진 경외/두려움의 긴장을 완화하지 않는 것이 더 충실합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: ζητοῦμεν τὸ πρόσωπόν σου의 관용구 처리
  chosen_reading: 주님의 얼굴을 찾습니다
  alternative_readings:
  - 주님의 임재를 구합니다
  - 주님을 찾습니다
  rationale: ‘얼굴’은 성서에서 하나님의 호의와 임재를 뜻하는 관용구이므로, मुख्य 본문에서는 직유를 유지하고 의미 해설은 각주로 처리합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
