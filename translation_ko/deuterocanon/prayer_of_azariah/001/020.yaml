translation:
  language: ko
  text: 그리고 주의 놀라운 일들에 따라 우리를 건져 내시고, 주여, 주의 이름에 영광을 돌리소서.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελοῦ
  english_pob_choice: deliver
  chosen_korean: 건져 내시고
  alternatives_korean:
  - 구원하시고
  - 구출하시고
  lexicon: BDAG
  rationale: 기도문에서의 aorist imperative ἐξαιρέω는 단순한 이동이 아니라 구원하는 개입을 구하므로, 현대 한국어에서 간결하고 힘 있는 ‘건져 내시고’로 옮겼습니다.
- source_word: κατὰ τὰ θαυμάσιά σου
  english_pob_choice: your wonders
  chosen_korean: 주의 놀라운 일들에 따라
  alternatives_korean:
  - 주의 기이한 일들에 따라
  - 주의 놀라운 행적에 따라
  lexicon: BDAG
  rationale: θαυμάσια는 단순한 ‘기적’보다 하나님의 놀라운 행위들을 가리키므로, POB의 직역성을 살리면서도 자연스러운 ‘주의 놀라운 일들’로 옮겼습니다.
- source_word: δὸς δόξαν
  english_pob_choice: give glory
  chosen_korean: 영광을 돌리소서
  alternatives_korean:
  - 영광을 주시고
  - 영광을 드리소서
  lexicon: BDAG
  rationale: δόξα를 목적어로 둔 관용적 기도 표현은 한국어 성경 전통에서도 ‘영광을 돌리다’가 가장 직접적으로 대응하므로, 의미를 유지하면서도 문장 흐름을 살렸습니다.
- source_word: τῷ ὀνόματί σου
  english_pob_choice: to your name
  chosen_korean: 주의 이름에
  alternatives_korean:
  - 주의 이름에
  - 주의 이름으로
  lexicon: BDAG
  rationale: ‘이름’은 단순한 호칭이 아니라 드러난 인격과 명예를 담는 성경적 관용구이므로, 이를 풀지 않고 ‘주의 이름에’로 유지했습니다.
theological_decisions:
- issue: κύριε의 직접 호칭
  chosen_reading: 주여
  alternative_readings:
  - 주님
  - 주님이시여
  rationale: 여기서 κύριε는 하나님께 드리는 기도의 직접 호칭이므로, 합쇼체 안에서 경어적 부름말인 ‘주여’가 가장 자연스럽고 경외의 뉘앙스를 살립니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → Lord'
- issue: ‘주의 이름’의 신학적 의미
  chosen_reading: 주의 이름에 영광을 돌리소서
  alternative_readings:
  - 주의 이름을 영화롭게 하소서
  - 주의 명성을 높이소서
  rationale: 본문은 하나님의 ‘이름’에 대한 존귀를 구하는 성경적 관용구를 사용하므로, 설명적으로 바꾸지 않고 예배적 의미를 보존했습니다.
  doctrine_reference: DOCTRINE.md §1, §3, §6
