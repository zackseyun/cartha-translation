  source_fidelity: 그리스어의 두 청원(ἐξελοῦ, δὸς)을 ‘건져 내시고 … 영광을 돌리소서’로 충실히 옮겼습니다. κατὰ τὰ θαυμάσιά σου는 ‘주의 놀라운 일들에 따라’로, τῷ ὀνόματί σου는 ‘주의 이름에’로 보존되어 원문의 표현과 의미 범위를 유지합니다.
  naturalness: 현대 표준 한국어 합쇼체 기도문으로 자연스럽습니다. ‘주여’의 문장 중간 배치는 원문의 호격 위치도 어느 정도 반영하면서 한국어 기도 문체에서도 무리가 없습니다.
  terminology: ‘주여’, ‘주의 이름’, ‘영광을 돌리소서’는 경건한 문체에 적절하며, 특정 교리적 해석을 덧붙이지 않습니다. ‘놀라운 일들’은 θαυμάσια의 신적이고 놀라운 행위라는 의미를 무리 없이 전달합니다.
