translation:
  language: ko
  text: 그리고 주께서는 우리와 주의 거룩한 성읍, 곧 우리 조상들의 예루살렘에 내리신 모든 일에 대하여 참된 판결을 내리셨습니다. 이는 주께서 우리의 죄 때문에 진실과 판결[a]에 따라 이 모든 일을 행하셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘진실과 정의에 따라’. 헬라어 구문은 ‘판결’과 ‘정의’로 모두 옮길 수 있으나, 본문에서 반복되는 법정적 어휘를 살리기 위해 ‘판결’을 유지했습니다.
    reason: lexical_alternative
