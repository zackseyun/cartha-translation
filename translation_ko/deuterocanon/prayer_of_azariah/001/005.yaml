  chosen_korean: 참된
  alternatives_korean:
  - 진리의
  - 진실한
  - 참으로
  lexicon: BDAG
  rationale: 헬라어의 ‘진리에 따른/진실한’ 성격을 한국어에서 자연스럽게 드러내기 위해 ‘참된 판결’로 옮겼습니다. ‘진리의 판결’도 가능하지만 문맥상 덜 자연스럽습니다.
- source_word: ἐπὶ τὴν πόλιν σου τὴν ἁγίαν
  english_pob_choice: your holy city
  chosen_korean: 주의 거룩한 도시
  alternatives_korean:
  - 주의 성도시
  - 주의 거룩한 성읍
  lexicon: BDAG
  rationale: πόλις를 현대 독자에게 분명하게 전달하기 위해 ‘도시’를 사용했고, ἁγία는 ‘거룩한’으로 직접 옮겼습니다. ‘성읍’은 고어적 느낌이 강해 본문의 현대 문체와 맞지 않습니다.
- source_word: ἐν ἀληθείᾳ καὶ κρίσει
  english_pob_choice: in truth and judgment
  chosen_korean: 진실과 판결로
  alternatives_korean:
  - 진실과 정의로
  - 진리와 심판으로
  - 진실하게 그리고 의롭게
  lexicon: BDAG
  rationale: 전치사 ἐν의 수단·기준 의미를 한국어 조사 ‘-로’로 살렸고, 반복되는 법정 어휘를 그대로 유지했습니다. ‘정의’는 윤리적 의미로 넓어져 대칭성이 약해집니다.
- source_word: διὰ τὰς ἁμαρτίας ἡμῶν
  english_pob_choice: because of our sins
  chosen_korean: 우리 죄들 때문에
  alternatives_korean:
  - 우리 죄들 때문에
  - 우리의 죄로 말미암아
  - 우리의 죄들로 인하여
  lexicon: BDAG
  rationale: διά + 대격의 원인 의미를 분명히 하기 위해 ‘때문에’로 옮겼습니다. 복수형 ‘죄들’을 유지해 원문의 집합적 고발성을 보존했습니다.
theological_decisions:
