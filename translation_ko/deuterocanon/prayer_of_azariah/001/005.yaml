translation:
  language: ko
  text: 그리고 주께서는 우리에게 가져오신 모든 일과 주의 거룩한 도시[a] 곧 우리 조상들의 예루살렘에 대하여 참된 판결을 행하셨습니다. 이는 진실과 판결로 이 모든 일을 우리 죄들 때문에 행하셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 진실과 정의로’. 헬라어 구문은 ‘판결’과 ‘정의’ 둘 다로 옮길 수 있으나, 본문 내 반복되는 법정적 어휘를 살리기 위해 ‘판결’을 유지했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίματα
  english_pob_choice: judgments
  chosen_korean: 판결
  alternatives_korean:
  - 심판
  - 판정
  - 의로운 판단
  lexicon: BDAG
  rationale: 복수형 κρίματα의 법정적·판결적 뉘앙스를 살리기 위해 ‘판결’을 택했습니다. ‘심판’은 더 포괄적이고, ‘판정’은 다소 현대 행정어처럼 들릴 수 있습니다.
- source_word: ἀληθείας
