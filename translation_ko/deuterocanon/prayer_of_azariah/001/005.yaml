  chosen_reading: ‘판결’과 ‘진실과 판결로’라는 표현을 유지하여, 예루살렘에 임한 일이 죄에 근거한 न्याय적 행위임을 드러냈습니다.
  alternative_readings:
  - ‘정의’나 ‘의로움’으로 넓혀 법정 이미지를 약화시키는 읽기
  - ‘심판’만 반복하여 문장 내 대응 구조를 단순화하는 읽기
  rationale: 본문은 하나님의 행위를 변명 없이 정당화하면서도 그 무게를 약화하지 않습니다. 반복되는 법정 어휘를 살리는 것이 원문의 신학적 긴장을 보존합니다.
