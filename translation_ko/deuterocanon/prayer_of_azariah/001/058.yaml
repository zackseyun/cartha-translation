  text: Bless the Lord, four-footed animals and beasts of the earth; sing praise to him and highly exalt him forever.
translation:
  language: ko
  text: 땅의 네 발 달린 짐승들과 들짐승들아, 주님을 찬송하십시오. 그분을 노래로 찬양하며 영원히 높이 드십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘네 발 달린 것들’이지만, 한국어에서는 자연스러운 동물 분류어인 ‘네 발 달린 짐승들’로 풀었습니다.
    reason: korean_style_note
lexical_decisions:
- source_word: εὐλογεῖτε
  english_pob_choice: Bless
  chosen_korean: 찬송하십시오
  alternatives_korean:
  - 축복하십시오
  - 찬양하십시오
  lexicon: BDAG
  rationale: 피조물들에게 하나님을 향해 드리는 경배적 반응을 명령하는 말이므로, 한국어에서는 직접적인 예배 동사인 ‘찬송하다’가 가장 자연스럽고 소리값도 살립니다.
- source_word: τετράποδα
  english_pob_choice: four-footed animals
  chosen_korean: 네 발 달린 짐승들
  alternatives_korean:
  - 네발짐승들
  - 네 발 짐승들
  lexicon: LSJ
  rationale: 문자적 의미인 ‘네 발 달린’과 동물 분류어 ‘짐승들’을 결합해, 구체적이면서도 현대 한국어에서 읽기 자연스럽게 옮겼습니다.
- source_word: θηρία τῆς γῆς
  english_pob_choice: beasts of the earth
  chosen_korean: 들짐승들
  alternatives_korean:
  - 땅의 짐승들
  - 땅의 들짐승들
  lexicon: LSJ
  rationale: θηρία는 단순한 ‘동물’보다 야생성을 띤 ‘짐승’의 뉘앙스가 있어, 한국어의 ‘들짐승들’로 그 거친 자연성을 살렸습니다.
- source_word: ὑμνεῖτε καὶ ὑπερυψοῦτε
  english_pob_choice: sing praise ... highly exalt
  chosen_korean: 노래로 찬양하며 영원히 높이 드십시오
  alternatives_korean:
  - 찬송하며 크게 높이 드십시오
  - 찬미하며 지극히 높이 드십시오
  lexicon: LSJ
  rationale: ὑμνεῖτε의 찬송/찬양 노래의 성격과 ὑπερυψοῦτε의 강한 높임을 함께 살리기 위해, 두 동사를 분리해 ‘노래로 찬양하다’와 ‘높이 드리다’로 옮겼습니다.
- source_word: εἰς τοὺς αἰῶνας
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 세세토록
  - 영원토록
  lexicon: BDAG
  rationale: 영속성을 나타내는 관용구로서, 현대 표준어 합쇼체 본문에서는 간결한 ‘영원히’가 가장 직접적입니다.
theological_decisions:
- issue: κύριος의 한국어 처리
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 하나님
  rationale: 이 장면은 유대-그리스어 찬송의 예배적 호칭이므로, 프로젝트 기본값에 따라 κύριος를 ‘주님’으로 옮겨 경배의 직접성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → 주님'
