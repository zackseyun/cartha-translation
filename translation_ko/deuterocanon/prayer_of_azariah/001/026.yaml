lexical_decisions:
- source_word: ὁ δὲ
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 그리고
  - 이제
  lexicon: LSJ
  rationale: δέ는 앞선 서술과 이어지면서도 약한 전환을 만들므로, 한국어에서는 ‘그러나’가 장면 전환과 미세한 대비를 가장 자연스럽게 살립니다.
- source_word: ἄγγελος Κυρίου
  english_pob_choice: the angel of the Lord
  chosen_korean: 주님의 천사
  alternatives_korean:
  - 주님의 사자
  - 주님의 천사들
  lexicon: LSJ
  rationale: ἄγγελος Κυρίου는 직역하면 ‘주님의 천사’이며, 한국어 성경에서 굳어진 ‘사자’보다 현대 합쇼체에서는 ‘천사’가 더 직접적이고 읽기 쉽습니다.
- source_word: τοῖς περὶ τὸν Ἀζαρίαν
  english_pob_choice: those around Azariah
  chosen_korean: 아자리아를 둘러선 이들
  alternatives_korean:
  - 아자리아의 동료들
  - 아자리아와 함께한 이들
  lexicon: LSJ
  rationale: 그리스어는 ‘아자리아 주위에 있는 이들’이라는 비교적 넓은 표현이므로, 영어 POB처럼 의미를 좁히지 않고 한국어도 원문 구조를 따라 옮겼습니다.
- source_word: ἐξετίναξεν τὴν φλόγα τοῦ πυρὸς ἐκ τῆς καμίνου
  english_pob_choice: drove the flame of the fire out of the furnace
  chosen_korean: 불꽃을 용광로 밖으로 몰아냈습니다
  alternatives_korean:
  - 불길을 용광로 밖으로 쳐냈습니다
  - 불꽃을 용광로에서 내쫓았습니다
  lexicon: LSJ
  rationale: ἐξετίναξεν은 단순한 이동보다 힘 있게 털어내거나 몰아내는 동작을 나타내므로, ‘몰아냈습니다’가 강한 동작성과 문맥의 긴박함을 잘 살립니다.
