translation:
  language: ko
  text: 그리고 그분은 풀무 한가운데를 마치 서늘한 이슬바람이 휘파람처럼 스쳐 가는 것같이 만드셨고, 불은 그들을 전혀 건드리지 못했으며, 그들에게 고통도 주지 못하고 괴롭히지도 못했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이슬이 내린 바람”, “이슬의 영”으로도 옮길 수 있습니다. 그리스어 πνεῦμα는 “바람”, “숨결”, “영”을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησε
  english_pob_choice: he made
  chosen_korean: 만드셨고
  alternatives_korean:
  - 하셨고
  - 되게 하셨고
  lexicon: BDAG
  rationale: ποιέω의 직접적 동작을 살리면서도 한국어에서는 자연스럽게 “만드셨다”로 옮기는 것이 가장 직역성과 가독성을 함께 지킵니다.
- source_word: τὸ μέσον τῆς καμίνου
  english_pob_choice: the inside of the furnace
  chosen_korean: 풀무 한가운데
  alternatives_korean:
  - 풀무의 내부
  - 풀무 가운데
  lexicon: LSJ
  rationale: μέσον은 여기서 공간의 중심, 곧 내부 영역을 가리키므로 “한가운데”가 문맥에 맞고 자연스럽습니다.
- source_word: ὡς πνεῦμα δρόσου διασυρίζον
  english_pob_choice: like a whistling dew-laden wind
  chosen_korean: 마치 서늘한 이슬바람이 휘파람처럼 스쳐 가는 것같이
  alternatives_korean:
  - 이슬 머금은 바람같이
  - 이슬의 영같이
  lexicon: LSJ
  rationale: πνεῦμα는 이 장면에서 영적 존재보다 바람/숨결의 감각이 우선이므로, POB의 해석을 따라 “이슬바람”으로 살리되 δρόσου의 냉기·습기를 “서늘한”으로 보완했습니다.
- source_word: οὐχ ἥψατο αὐτῶν
  english_pob_choice: did not touch them
  chosen_korean: 전혀 건드리지 못했으며
  alternatives_korean:
  - 그들을 전혀 만지지 못했으며
  - 그들에게 닿지 못했으며
  lexicon: BDAG
  rationale: 단순 접촉 부재보다 실제로 해를 끼치지 못했다는 문맥상 힘을 반영하기 위해 “건드리지 못하다”를 택했습니다.
theological_decisions:
- issue: πνεῦμα의 의미를 바람으로 볼지 영으로 볼지
  chosen_reading: 이 구절은 초자연적 현상 속의 냉각된 바람/숨결의 이미지로 번역했습니다.
  alternative_readings:
  - 영
  - 영적인 바람
  rationale: 화로 안의 물리적 장면이므로 “영”보다 감각적 이미지인 바람이 원문 의도에 더 가깝습니다. 다만 문맥의 기적성은 유지했습니다.
  doctrine_reference: 원문 우선과 문맥적 의미 보존
- issue: 불의 영향에 대한 이중 부정
  chosen_reading: “전혀 건드리지 못했으며, 그들에게 고통도 주지 못하고 괴롭히지도 못했습니다”로 연속 부정을 살렸습니다.
  alternative_readings:
  - 불이 그들을 해치지 못했고
  - 불이 그들을 건드리지도, 괴롭히지도 못했습니다
  rationale: οὐκ ἐλύπησεν / οὐδὲ παρηνώχλησεν의 두 동사를 나란히 살려, 단순 무해함이 아니라 전혀 해를 끼치지 못했다는 중첩된 진술을 보존했습니다.
  doctrine_reference: 문학적 강조 보존
