- source_word: ἐν ψυχῇ συντετριμμένῃ καὶ πνεύματι τεταπεινωμένῳ
  english_pob_choice: with a broken soul and a humbled spirit
  chosen_korean: 부서진 영혼과 낮아진 영으로
