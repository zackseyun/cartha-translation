  lexicon: BDAG
  rationale: 수동 기원의 뉘앙스를 한국어에서 하나님께서 받아 주시는 관계적 표현으로 살리면서, 청원체의 정중함을 유지했습니다.
theological_decisions:
- issue: ψυχή와 πνεῦμα의 병렬을 어떻게 살릴지
  chosen_reading: ‘영혼’과 ‘영’을 구분해 병렬을 유지했습니다.
  alternative_readings:
  - ‘속사람’으로 통합해 표현함
  - ‘마음’과 ‘영’으로 완화함
  rationale: 본문은 두 용어를 평행 구조로 제시하므로, 통합하지 않고 각각 따로 번역해 시적·신학적 긴장을 보존했습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 5
- issue: 청원문 말미의 화행
  chosen_reading: ‘바라옵니다’로 공손한 청원을 드러냈습니다.
  alternative_readings:
  - ‘원합니다’로 평평하게 옮김
  - ‘간구합니다’로 강화함
  rationale: 이 구절은 하나님께 드리는 간청이므로 합쇼체 안에서 경건한 청원 어조를 유지하는 것이 적절합니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 1
