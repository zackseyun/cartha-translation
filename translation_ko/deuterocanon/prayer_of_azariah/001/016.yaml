  rationale: ψυχή와 πνεῦμα를 구분해 각각 ‘영혼’과 ‘영’으로 살리고, συντετριμμένῃ와 τεταπεινωμένῳ의 상태성을 ‘부서진’, ‘낮아진’으로 옮겼습니다.
