base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/056.yaml
  text: Bless the Lord[a], sea creatures and all that move in the waters; sing praise to him and highly exalt him forever.
  footnotes:
  - marker: a
    text: Or 'great sea creatures,' 'whales,' or 'sea monsters.' The Greek κήτη is a broad term for large creatures of the waters.
    reason: lexical_alternative
translation:
  language: ko
  text: 바다 생물들[a]과 물속에서 움직이는 모든 것들아, 주님을 송축하십시오. 그분을 찬송하고 영원히 높이십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘큰 바다 생물들’, ‘고래들’, ‘바다 괴물들’. 그리스어 κήτη는 큰 바다 생물을 포괄하는 넓은 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  english_pob_choice: Bless
  chosen_korean: 찬양하라
  alternatives_korean:
  - 축복하라
  - 복을 빌어라
  - 송축하라
  lexicon: BDAG
  rationale: 문맥상 피조물이 하나님께 복을 빌어 드리는 뜻이 아니라 예배적 호칭을 드리는 명령이므로, 한국어에서는 자연스럽고 회중 낭송에 맞는 ‘찬양하라’로 옮겼습니다.
- source_word: κήτη
  english_pob_choice: sea creatures
  chosen_korean: 바다 생물들
  alternatives_korean:
  - 큰 바다 생물들
  - 고래들
  - 바다 괴물들
  lexicon: LSJ
  rationale: κήτη는 큰 수중 생물을 포괄할 수 있으므로, 특정 종으로 좁히지 않으면서도 현대 한국어에서 무리 없는 ‘바다 생물들’로 넓게 잡았습니다.
- source_word: πάντα τὰ κινούμενα ἐν τοῖς ὕδασι
  english_pob_choice: all that move in the waters
  chosen_korean: 물속에서 움직이는 모든 것들
  alternatives_korean:
  - 물속의 모든 움직이는 것들
  - 물에서 움직이는 모든 것들
  lexicon: BDAG
  rationale: 분사구의 포괄성을 살려 생물뿐 아니라 물속에서 움직이는 존재 전체를 포함하는 표현으로 옮겼습니다. 복수형 ‘waters’는 ‘물속에서’로 자연스럽게 반영했습니다.
- source_word: ὑμνεῖτε καὶ ὑπερυψοῦτε
  english_pob_choice: sing praise ... and highly exalt
  chosen_korean: 노래하며 높이고 또 영원히 높여라
  alternatives_korean:
  - 찬송하며 크게 높여라
  - 노래로 찬양하며 극진히 높여라
  lexicon: BDAG
  rationale: ὑμνεῖτε의 음악적 뉘앙스를 ‘노래하며’로 살리고, ὑπερυψοῦτε의 강화 의미는 ‘높이고’로 단순히 반복하지 않게 연결했습니다. 다만 원문의 두 번째 명령의 강도를 마지막에 다시 한 번 ‘영원히 높여라’로 마무리했습니다.
- source_word: εἰς τοὺς αἰῶνας
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 세세토록
  - 영원토록
  lexicon: BDAG
  rationale: 관용적 의미는 지속성의 강조이므로, 예배적 선언에 자연스러운 ‘영원히’로 옮겼습니다.
theological_decisions:
- issue: κύριον의 한국어 표현
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 주인
  rationale: 그리스어 κύριος는 이 찬가에서 하나님을 가리키는 호칭이므로, 한국어에서는 예배적 직접 호칭을 드러내는 ‘주님’이 가장 적절합니다. 본문이 히브리어 테트라그람마톤을 직접 인용한 것은 아니므로 ‘야훼’로 옮기지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: κύριος → Lord/주님; explicit YHWH only for Hebrew divine-name citations'
