translation:
  language: ko
  text: 주님의 천사들아, 주님을 찬미하십시오. 찬송하며 그분을 영원히 높이 드십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님을 찬양하십시오’. εὐλογεῖτε는 예배 문맥에서 ‘축복하다’와 ‘찬미하다’의 범위를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘찬송을 부르며’. ὑμνεῖτε는 찬가를 노래하는 행위를 구체적으로 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  english_pob_choice: Bless
  chosen_korean: 찬미하십시오
  alternatives_korean:
  - 복을 빌어 주십시오
  - 축복하십시오
  - 찬양하십시오
  lexicon: BDAG
  rationale: εὐλογεῖτε는 예배 문맥에서 ‘복을 빌다/찬미하다’의 범위를 가지므로, 한국어에서는 대상에게 복을 비는 의미를 살리면서도 예전어투를 유지하는 ‘찬미하십시오’가 가장 자연스럽습니다.
- source_word: ἄγγελοι Κυρίου
  english_pob_choice: angels of the Lord
  chosen_korean: 주님의 천사들
  alternatives_korean:
  - 주님의 사자들
  - 주님의 메신저들
  lexicon: BDAG
  rationale: 문맥상 하늘 존재를 가리키므로 ‘천사들’이 적절하며, Κυρίου는 소유격으로 ‘주님의’를 붙여 원문의 호격 구조를 반영했습니다.
- source_word: ὑμνεῖτε
  english_pob_choice: sing hymns
  chosen_korean: 찬송하며
  alternatives_korean:
  - 찬송하고
  - 찬가를 부르며
  - 노래하며
  lexicon: BDAG
  rationale: ὑμνέω의 핵심은 찬가를 부르는 행위이므로, 동작성을 살린 ‘찬송하며’로 옮겨 앞 명령과 병렬을 이루게 했습니다.
- source_word: ὑπερυψοῦτε
  english_pob_choice: highly exalt
  chosen_korean: 높이 드십시오
  alternatives_korean:
  - 크게 높이십시오
  - 지극히 높이십시오
  - 극진히 높이십시오
  lexicon: BDAG
  rationale: 복합동사의 강한 상승·고양 의미를 한국어의 예배적 표현인 ‘높이 드십시오’로 자연스럽게 옮기되, 단순한 ‘높이다’보다 찬양의 행위를 분명히 했습니다.
- source_word: εἰς τοὺς αἰῶνας
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 영원토록
  - 세세토록
  - 세세 무궁하도록
  lexicon: BDAG
  rationale: 관용적 의미는 지속성을 가리키므로 현대 한국어에서 가장 직설적이고 읽기 쉬운 ‘영원히’를 사용했습니다.
theological_decisions:
- issue: κυρίου / τὸν κύριον의 번역 일관성
  chosen_reading: 둘 다 ‘주님’으로 번역해, 천사들이 ‘주님의’ 주님을 찬미하는 삼중적 예배 구조를 드러냈습니다.
  alternative_readings:
  - ‘주님’을 ‘주’로만 통일
  - 첫 번째는 ‘주님’, 두 번째는 ‘하나님’
  rationale: 본문은 천사들의 호명과 찬양 대상이 모두 κύριος에 속하므로, 문맥상 예배적 호칭인 ‘주님’을 유지하는 것이 원문과 POB의 용례에 가장 충실합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → Lord'
