- issue: κυρίου / τὸν κύριον의 번역 일관성
  chosen_reading: 둘 다 ‘주님’으로 번역해, 천사들이 ‘주님의’ 주님을 찬미하는 삼중적 예배 구조를 드러냈습니다.
  alternative_readings:
  - ‘주님’을 ‘주’로만 통일
  - 첫 번째는 ‘주님’, 두 번째는 ‘하나님’
  rationale: 본문은 천사들의 호명과 찬양 대상이 모두 κύριος에 속하므로, 문맥상 예배적 호칭인 ‘주님’을 유지하는 것이 원문과 POB의 용례에 가장 충실합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → Lord'
