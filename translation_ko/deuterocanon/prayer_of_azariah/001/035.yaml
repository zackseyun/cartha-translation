  text: Bless the Lord[a], angels of the Lord[b]; sing hymns and highly exalt him forever.
  footnotes:
  - marker: a
    text: Or 'Praise the Lord' for 'Bless the Lord'; the Greek verb can bear either sense in worship language, but 'bless' more closely follows εὐλογεῖτε.
