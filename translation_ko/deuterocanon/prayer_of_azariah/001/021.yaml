base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/021.yaml
  text: And let all who show evil to your slaves be put to shame[a], and let them be disgraced from all their dominion[c][b], and let their strength be broken.
  footnotes:
  - marker: a
    text: Or 'your servants.' The Greek is 'your slaves' (τοῖς δούλοις σου), emphasizing belonging to God.
    reason: alternative_reading
  - marker: b
    text: Or 'those who inflict evil on your slaves.' The Greek participle literally means 'those who show evil' toward them.
    reason: lexical_alternative
  - marker: c
    text: The phrase 'from all their dominion' may also be understood more loosely as 'in all their power' or 'despite all their dominion.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 당신의 종들에게 악을 행하는 모든 자들이 부끄러움을 당하게 하시고, 그들이 모든 그들의 통치권에서 수치를 당하게 하시며, 그들의 힘이 꺾이게 하십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 노예들에게’. 그리스어는 ‘당신의 종들/노예들’(τοῖς δούλοις σου)로, 하나님께 속한 소속성을 강조합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그들의 악을 행하는 자들’에 가깝게 볼 수 있습니다. 그리스어 분사는 문자적으로는 ‘악을 보이는 자들’입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘모든 그들의 통치권에서’는 ‘그들의 모든 권세 속에서’ 또는 ‘그들의 모든 권세에도 불구하고’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς δούλοις σου
  english_pob_choice: your slaves
  chosen_korean: 당신의 종들에게
  alternatives_korean:
  - 당신의 노예들에게
  - 당신의 종들
  lexicon: LSJ
  rationale: 도구적·신분적 종속을 드러내는 δοῦλος의 강도를 살리되, 한국어 합쇼체 기도문에서는 ‘노예들’보다 ‘종들’이 더 자연스럽고 공손합니다. 하나님께 속한 소속성을 유지하면서도 문체를 과도하게 거칠게 만들지 않았습니다.
- source_word: ἐντραπείησαν
  english_pob_choice: be put to shame
  chosen_korean: 부끄러움을 당하게 하시고
  alternatives_korean:
  - 수치를 당하게 하시고
  - 부끄럽게 되게 하시고
  lexicon: LSJ
  rationale: 기도의 소원형이므로 단순한 내적 감정보다 외적 수치와 공개적 굴욕을 드러내는 표현으로 옮겼습니다.
- source_word: ἀπὸ πάσης τῆς δυναστείας
  english_pob_choice: from all their dominion
  chosen_korean: 모든 그들의 통치권에서
  alternatives_korean:
  - 모든 그들의 권세에서
  - 모든 그들의 지배 아래에서
  lexicon: LSJ
  rationale: δυναστεία는 권세/지배/통치의 영역을 가리키므로, ‘통치권’이 본문의 권력 범주를 가장 직접적으로 담습니다. 전치사 ἀπό의 방향성도 한국어 조사 ‘-에서’로 반영했습니다.
- source_word: συντριβείη
  english_pob_choice: be broken
  chosen_korean: 꺾이게 하십시오
  alternatives_korean:
  - 부서지게 하십시오
  - 산산이 부서지게 하십시오
  lexicon: LSJ
  rationale: 마지막 병렬절은 적의 힘이 결정적으로 무력화되는 장면이므로, 한국어에서는 힘이 ‘꺾이다’가 가장 자연스럽게 대응합니다.
theological_decisions:
- issue: 기도문에서의 청원형 종결
  chosen_reading: ‘하시고/하십시오’로 일관한 소원·청원형
  alternative_readings:
  - 서술형으로 완화
  - ‘되게 하소서’식 전통 기도체
  rationale: 원문의 optative 연쇄가 갖는 청원적 힘을 보존하기 위해 합쇼체 명령·청원형으로 직역에 가깝게 유지했습니다. 전통적 종결을 일부러 쓰지 않아도 공적 기도문의 기능은 충분히 드러납니다.
  doctrine_reference: Prayer register and optative force in LXX prayers
- issue: δούλος의 번역
  chosen_reading: 종
  alternative_readings:
  - 노예
  - 종이 아닌 중립적 표현인 섬기는 이
  rationale: 이 문맥은 하나님께 속한 백성의 소속성과 적대적 압제를 함께 드러내므로, 봉사 일반보다 종속 관계를 더 직접적으로 나타내는 ‘종’이 적절합니다. 다만 한국어 기도체의 문맥상 ‘노예’는 지나치게 거칠어 보일 수 있어 본문에는 사용하지 않았습니다.
  doctrine_reference: Contested terms table for δοῦλος; source-sensitive distinction between status and service
