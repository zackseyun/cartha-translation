  lexicon: BDAG
  rationale: ὅσιος의 성스러운/경건한 의미를 살려, POB의 ‘holy’에 대응하는 기본값으로 ‘거룩한’이 가장 직접적입니다.
- source_word: ταπεινοὶ τῇ καρδίᾳ
