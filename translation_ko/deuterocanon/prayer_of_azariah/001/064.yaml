translation:
  language: ko
  text: 야훼를 송축하십시오, 마음이 거룩하고 겸손한 이들아. 그를 찬송하고 영원히 크게 높이십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경건한’, ‘독실한’으로 옮길 수 있습니다. 그리스어 ὅσιος는 이렇게도 번역될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  english_pob_choice: Bless
  chosen_korean: 송축하십시오
  alternatives_korean:
  - 찬양하십시오
  - 복을 빌어 드리십시오
  lexicon: BDAG
  rationale: 예배적 권고문에서 하나님께 ‘복을 빌어 드리다/송축하다’의 뜻을 살리되, 단순한 찬양보다 경배적 방향이 분명해 한국어 예배문체에 자연스럽습니다.
- source_word: ὅσιοι
  english_pob_choice: holy
  chosen_korean: 거룩한 이들
  alternatives_korean:
  - 경건한 이들
  - 독실한 이들
  lexicon: BDAG
  rationale: ὅσιος의 성스러운/경건한 의미를 살려, POB의 ‘holy’에 대응하는 기본값으로 ‘거룩한’이 가장 직접적입니다.
- source_word: ταπεινοὶ τῇ καρδίᾳ
  english_pob_choice: humble in heart
  chosen_korean: 마음이 겸손한
  alternatives_korean:
  - 마음이 낮은
  - 마음이 겸허한
  lexicon: BDAG
  rationale: 내면의 태도를 가리키는 여격구를 한국어로는 ‘마음이 …한’으로 풀어, 문자적이면서도 자연스럽게 표현했습니다.
- source_word: ὑμνεῖτε καὶ ὑπερυψοῦτε
  english_pob_choice: sing praise ... highly exalt
  chosen_korean: 찬송하고 영원히 크게 높이십시오
  alternatives_korean:
  - 찬송하며 크게 높이십시오
  - 찬미하고 지극히 높이십시오
  lexicon: BDAG
  rationale: ὑμνεῖτε의 찬송/찬가의 뉘앙스와 ὑπερυψοῦτε의 강한 상승 표현을 함께 살렸고, 종결부 εἰς τοὺς αἰῶνας와 결합해 ‘영원히’는 문장 끝의 지속성을 자연스럽게 받도록 옮겼습니다.
theological_decisions:
- issue: κύριος의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 주
  rationale: 이 본문은 그리스어 경배문맥이지만 POB의 기본 원칙에 따라 κύριος가 야훼를 가리키는 예배 호칭으로 이해되므로, 본문에서는 ‘야훼’를 사용해 구약적 지시 대상을 분명히 했습니다.
  doctrine_reference: 'POB glossary: κύριος(야훼를 가리킬 때) → 야훼'
