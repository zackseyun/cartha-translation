  lexicon: BDAG
  rationale: 내면의 태도를 가리키는 여격구를 한국어로는 ‘마음이 …한’으로 풀어, 문자적이면서도 자연스럽게 표현했습니다.
- source_word: ὑμνεῖτε καὶ ὑπερυψοῦτε
  english_pob_choice: sing praise ... highly exalt
  chosen_korean: 찬송하고 영원히 크게 높이십시오
  alternatives_korean:
  - 찬송하며 크게 높이십시오
  - 찬미하고 지극히 높이십시오
  lexicon: BDAG
  rationale: ὑμνεῖτε의 찬송/찬가의 뉘앙스와 ὑπερυψοῦτε의 강한 상승 표현을 함께 살렸고, 종결부 εἰς τοὺς αἰῶνας와 결합해 ‘영원히’는 문장 끝의 지속성을 자연스럽게 받도록 옮겼습니다.
