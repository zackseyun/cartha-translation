translation:
  language: ko
  text: 서리와 추위여, 주님을 찬양하십시오. 그분을 찬송하고 영원히 지극히 높이십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  english_pob_choice: Bless
  chosen_korean: 찬양하십시오
  alternatives_korean:
  - 복을 빌어 주십시오
  - 축복하십시오
  lexicon: LSJ / BDAG
  rationale: 피조물에게 직접 명령하는 찬양 문맥이므로, 한국어에서는 하나님께 드리는 예배적 반응을 가장 자연스럽게 드러내는 ‘찬양하십시오’를 택했습니다. ‘축복하십시오’는 한국어에서 주로 인간이 인간을 향해 쓰는 의미가 강해 어색합니다.
- source_word: πάγος
  english_pob_choice: frost
  chosen_korean: 서리
  alternatives_korean:
  - 얼음
  - 서릿발
  lexicon: LSJ
  rationale: πάγος는 여기서 ψῦχος와 짝을 이루는 기상 현상으로 보이므로 ‘서리’가 가장 자연스럽고 시적입니다. ‘얼음’은 고체 물질 느낌이 강해 병렬성이 약해집니다.
- source_word: ψῦχος
  english_pob_choice: cold
  chosen_korean: 추위
  alternatives_korean:
  - 냉기
  - 차가움
  lexicon: LSJ
  rationale: ψῦχος는 추위, 한기를 뜻하므로 한국어에서는 날씨의 상태를 가리키는 ‘추위’가 가장 직접적입니다. ‘냉기’는 보다 문학적이지만 다소 인위적일 수 있습니다.
- source_word: ὑμνεῖτε καὶ ὑπερυψοῦτε
  english_pob_choice: sing praise ... highly exalt
  chosen_korean: 찬양하십시오 ... 높이 올리십시오
  alternatives_korean:
  - 노래로 찬송하십시오 ... 크게 높이십시오
  - 찬가를 부르십시오 ... 극히 높이십시오
  lexicon: LSJ
  rationale: ὑμνεῖτε의 노래-찬양 뉘앙스와 ὑπερυψοῦτε의 강한 ‘높이다’ 의미를 살리되, 한국어 시문에서는 중복을 피하면서 병렬 구조를 유지해야 하므로 이렇게 옮겼습니다. 동사 둘 다 명령형으로 맞춰 원문의 열거적 리듬을 보존했습니다.
- source_word: εἰς τοὺς αἰῶνας
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 세세토록
  - 끝없이
  lexicon: BDAG
  rationale: 관용구는 지속성과 끝없음을 나타내므로 현대 한국어에서는 ‘영원히’가 가장 간결하고 분명합니다. ‘세세토록’은 전통적이지만 이 문맥의 현대적 합쇼체에는 덜 자연스럽습니다.
theological_decisions:
- issue: κύριον의 호칭 번역
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 야훼
  rationale: 이 절의 κύριον은 예배 찬가에서 하나님을 직접 호칭하는 표현이므로, 한국어 독자가 곧바로 예배 언어로 인식하는 ‘주님’이 가장 적절합니다. 본문 자체가 야훼 표기를 요구하는 문맥은 아니므로 여기서는 일반 호칭을 유지했습니다.
