  - 주권자
  - 주인이시여
  rationale: 본문은 κύριος가 아니라 δέσποτα를 사용하므로, 관습적 번역인 ‘주님’보다 더 강한 주종 관계와 권위를 드러내는 표현을 택해 어휘 구분을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; preserve source meaning over translation tradition.'
