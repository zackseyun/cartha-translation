base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/014.yaml
  text: For[a], Master, we have become smaller than all the nations[b], and today we are humbled in all the earth because of our sins.
  footnotes:
  - marker: a
    text: Or 'we have been reduced below all the nations.' The Greek verb can express being made small or diminished in status.
    reason: lexical_alternative
  - marker: b
    text: Or 'in all the land.' Greek γῇ can mean either 'land' or 'earth'; the broader sense fits the comparison with the nations.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는, 주인님, 우리가 모든 민족보다 더 작아졌고, 오늘날에는 우리의 죄들 때문에 온 땅에서 낮아졌기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘더 작아졌습니다’ 또는 ‘낮아졌습니다’로도 옮길 수 있습니다. 동사는 지위가 축소되거나 비천해진 상태를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘온 땅’은 ‘온 나라/땅’으로도 옮길 수 있습니다. γῇ는 ‘땅’과 ‘지면’, 더 넓게는 ‘세상’을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δέσποτα
  english_pob_choice: Master
  chosen_korean: 주인님
  alternatives_korean:
  - 주님
  - 주인이시여
  - 주권자
  lexicon: BDAG
  rationale: δέσποτα는 κύριος보다 더 직접적으로 절대적 소유권과 권위를 가리키므로, 예배적 관용구인 ‘주님’보다 호칭의 강도를 드러내는 ‘주인님’을 택했습니다.
- source_word: ἐσμικρύνθημεν
  english_pob_choice: we have become smaller
  chosen_korean: 더 작아졌고
  alternatives_korean:
  - 작아졌고
  - 더 작게 되었고
  - 줄어들었고
  lexicon: LSJ
  rationale: 동사는 수적으로만이 아니라 지위와 형편이 낮아지는 의미를 담으므로, 비교 의미를 살린 자연스러운 한국어로 ‘더 작아졌고’라고 옮겼습니다.
- source_word: παρὰ πάντα τὰ ἔθνη
  english_pob_choice: than all the nations
  chosen_korean: 모든 민족보다
  alternatives_korean:
  - 모든 나라보다
  - 모든 민족들보다
  - 열방보다
  lexicon: LSJ
  rationale: παρά의 비교 용법을 반영해 ‘보다’로 처리했고, ἔθνη는 이 문맥에서 주변 집단을 가리키는 ‘민족’이 가장 무난합니다.
- source_word: ἐν πάσῃ τῇ γῇ
  english_pob_choice: in all the earth
  chosen_korean: 온 땅에서
  alternatives_korean:
  - 온 땅 위에서
  - 온 나라에서
  - 온 세상에서
  lexicon: LSJ
  rationale: γῇ는 ‘땅/지면’과 ‘땅/세상’의 폭이 있으나, 뒤의 비교 구조와 공적 수치를 고려해 넓은 범위의 ‘온 땅’으로 옮겼습니다.
- source_word: διὰ τὰς ἁμαρτίας ἡμῶν
  english_pob_choice: because of our sins
  chosen_korean: 우리의 죄들 때문에
  alternatives_korean:
  - 우리 죄 때문에
  - 우리의 죄악 때문에
  - 우리의 허물 때문에
  lexicon: BDAG
  rationale: διά + 대격은 원인을 나타내므로 ‘때문에’로 옮겼고, 복수형 ἁμαρτίας를 살리기 위해 ‘죄들’로 표기했습니다.
theological_decisions:
- issue: δέςποτα 호칭의 한국어 화법
  chosen_reading: 기도문 안에서 하나님께 직접 부르는 말로 ‘주인님’을 사용했습니다.
  alternative_readings:
