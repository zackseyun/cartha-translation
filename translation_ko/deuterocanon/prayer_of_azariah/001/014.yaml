  text: For[a], Master, we have become smaller than all the nations[b], and today we are humbled in all the earth because of our sins.
  footnotes:
  - marker: a
    text: Or 'we have been reduced below all the nations.' The Greek verb can express being made small or diminished in status.
    reason: lexical_alternative
  - marker: b
    text: Or 'in all the land.' Greek γῇ can mean either 'land' or 'earth'; the broader sense fits the comparison with the nations.
    reason: lexical_alternative
translation:
  language: ko
  text: 주권자여, 우리는 모든 민족보다 더 미천해졌고[a], 오늘 우리 죄 때문에 온 땅에서 낮아졌습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 민족보다 더 작아졌습니다.’로 옮길 수 있습니다. 그리스어 동사는 작아지거나 지위와 처지가 낮아지는 것을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘온 나라에서’ 또는 ‘온 땅에서’로 옮길 수 있습니다. 그리스어 γῇ는 ‘땅’ 또는 ‘나라’를 뜻할 수 있으며, 여기서는 모든 민족과의 비교에 비추어 넓은 범위를 가리키는 뜻으로 번역했습니다.
    reason: lexical_alternative
