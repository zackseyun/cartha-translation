base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/011.yaml
  text: Do not give us over utterly for the sake of your name[b][a], and do not break your covenant.
  footnotes:
  - marker: a
    text: Or 'Do not give us over to the end,' that is, 'do not abandon us utterly.'
    reason: lexical_alternative
  - marker: b
    text: Or 'do not annul your covenant' or 'do not break your covenant.' The Greek verb literally means 'scatter' or 'disperse.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님의 이름을 위하여 우리를 완전히 내어주지 마시고,[a] 주님의 언약을 깨뜨리지 마십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리를 끝까지 내어주지 마시고.’ 곧 ‘우리를 완전히 버려두지 마십시오’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘주님의 언약을 흩어 버리지 마십시오.’ 그리스어 동사는 본래 ‘흩다, 분산시키다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ παραδῷς
  english_pob_choice: Do not give us over
  chosen_korean: 우리를 내어주지 마시고
  alternatives_korean:
  - 우리를 넘기지 마시고
  - 우리를 넘겨주지 마시고
  lexicon: BDAG
  rationale: παραδίδωμι는 ‘넘기다/내어주다/넘겨주다’의 뜻이 있어, 기도문 맥락에서 하나님의 보호를 거두지 말아 달라는 뉘앙스를 살리기 위해 ‘내어주다’를 택했습니다.
- source_word: εἰς τέλος
  english_pob_choice: utterly
  chosen_korean: 끝까지
  alternatives_korean:
  - 완전히
  - 철저히
  - 끝내
  lexicon: LSJ
  rationale: 직역의 ‘끝까지’는 ‘전적으로, 끝장나게’라는 관용적 힘을 비교적 자연스럽게 살리며, 시간적 의미만으로 좁아지지 않게 합니다.
- source_word: διὰ τὸ ὄνομά σου
  english_pob_choice: for the sake of your name
  chosen_korean: 주님의 이름을 위해
  alternatives_korean:
  - 주님의 이름 때문에
  - 주님의 이름을 위하여
  lexicon: BDAG
  rationale: 하나님의 이름, 곧 그분의 명예와 언약적 정체성을 근거로 자비를 구하는 표현이므로 ‘주님의 이름을 위해’로 옮겼습니다.
- source_word: μὴ διασκεδάσῃς σου τὴν διαθήκην
  english_pob_choice: do not break your covenant / do not scatter your covenant
  chosen_korean: 주님의 언약을 깨뜨리지 마십시오
  alternatives_korean:
  - 주님의 언약을 흩뜨리지 마십시오
  - 주님의 언약을 무효화하지 마십시오
  lexicon: LSJ
  rationale: διασκεδάζω의 원뜻은 ‘흩다, 흩어버리다’이지만, 대상이 ‘언약’일 때 한국어에서는 그 결과를 드러내는 ‘깨뜨리다’가 가장 자연스럽고 오해가 적습니다.
theological_decisions:
- issue: εἰς τέλος의 기도적 뉘앙스
  chosen_reading: ‘끝까지’로 옮겨, 최종적·완전한 버림을 막아 달라는 간구로 읽히게 했습니다.
  alternative_readings:
  - 완전히
  - 영원히
  - 철저히
  rationale: 문맥상 단순한 시간 표현보다 ‘결정적으로 버려지지 않음’이라는 간구가 핵심이므로, 한국어에서는 ‘끝까지’가 가장 응집력 있게 들립니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 6
- issue: διασκεδάσῃς σου τὴν διαθήκην의 은유 보존
  chosen_reading: ‘언약을 깨뜨리지 마십시오’로 자연스러운 한국어를 택하되, 원문이 지닌 ‘흩다’의 이미지를 과도하게 설명하지는 않았습니다.
  alternative_readings:
  - 주님의 언약을 흩뜨리지 마십시오
  - 주님의 언약을 무효화하지 마십시오
  rationale: 기도의 문맥에서 청원은 분명해야 하므로 한국어 관용 표현을 사용했습니다. 다만 ‘언약’을 법적 문서처럼 좁히지 않고, 관계적·신실성의 차원을 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 5
