  text: Bless the Lord, lightnings and clouds; sing praise to him and highly exalt him forever.
translation:
  language: ko
  text: 번개와 구름아, 주님을 송축하십시오. 그분을 찬양하고 영원히 드높이십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀστραπαὶ
  english_pob_choice: lightnings
  chosen_korean: 번개
  alternatives_korean:
  - 번갯불
  - 번개들
  lexicon: ἀστραπή
  rationale: 영어 POB가 복수형 lightnings로 유지한 점을 따라 복수성을 살리되, 한국어에서는 자연스러운 집합 명사인 ‘번개’로 옮겼습니다.
- source_word: νεφέλαι
  english_pob_choice: clouds
  chosen_korean: 구름
  alternatives_korean:
  - 구름들
  - 구름이여
  lexicon: νεφέλη
  rationale: 피조물에 대한 직접 호명으로서 ‘구름’이 가장 자연스럽고, 시적 병행을 유지합니다.
- source_word: τὸν κύριον
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 야훼
  lexicon: κύριος
  rationale: 본문의 κύριος는 직접 호칭이므로 한국어 경어형 ‘주님’이 가장 자연스럽습니다. 이 절은 시편적 찬양 호소로서 야훼 표기를 본문에 전면화할 근거는 약합니다.
- source_word: ὑμνεῖτε καὶ ὑπερυψοῦτε
  english_pob_choice: sing praise ... and highly exalt
  chosen_korean: 찬양하여라 ... 찬송하고 높이 받들어라
  alternatives_korean:
  - 찬미하여라 ... 높이 높여라
  - 찬송하여라 ... 크게 높여라
  lexicon: ὑμνέω, ὑπερυψόω
  rationale: 두 동사의 병렬을 살려 ‘찬양하다/찬송하다’의 의미 차이를 구분하고, ὑπερυψοῦτε는 단순히 ‘높이다’보다 ‘높이 받들다’가 예배적 뉘앙스를 더 잘 드러냅니다.
theological_decisions:
- issue: 피조물(번개와 구름)의 찬양 소환
  chosen_reading: 천체·기상 현상에 대한 시적 의인화로 보며, 명령형을 그대로 살려 피조물이 창조주를 찬양하도록 부르는 표현으로 옮겼습니다.
  alternative_readings:
  - 단순한 자연 묘사로 완화
  - 비유적 감탄문으로 처리
  rationale: 그리스어 명령형 εὐλογεῖτε/ὑμνεῖτε/ὑπερυψοῦτε가 실제 찬양 호소를 구성하므로, 시적 장치를 약화하지 않았습니다.
  doctrine_reference: 창조주 찬양, 시편적 우주 찬양
