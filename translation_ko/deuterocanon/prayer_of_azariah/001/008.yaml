lexical_decisions:
- source_word: νῦν
  english_pob_choice: now
  chosen_korean: 이제
  alternatives_korean:
  - 지금
  - 이제야
  lexicon: BDAG
  rationale: 현재 시점을 가리키는 부사로, 기도문 맥락에서 자연스럽고 간결한 ‘이제’가 가장 직접적입니다.
- source_word: πάντα ὅσα
  english_pob_choice: all that
  chosen_korean: 모든 것
  alternatives_korean:
  - 모든 일
  - 모든 바
  lexicon: BDAG
  rationale: 반복된 포괄 표현을 한국어에서 가장 자연스럽게 살리기 위해 ‘모든 것’으로 옮겼습니다. 뒤의 두 절에 모두 대응되도록 동일하게 유지했습니다.
- source_word: ἐπήγαγες
  english_pob_choice: have brought upon
  chosen_korean: 가져오신
  alternatives_korean:
  - 불러오신
  - 내리신
  - 가져다 주신
  lexicon: BDAG
  rationale: 여기서는 악재나 징계까지 포함해 ‘위에 가져오다’의 의미가 핵심이므로, 문맥상 ‘가져오신’이 가장 직결됩니다. 다만 한국어에서 ‘upon’의 부담을 완전히 드러내기 위해 ‘우리에게’와 함께 읽히게 했습니다.
- source_word: ἐποίησας ἡμῖν
  english_pob_choice: have done to us
  chosen_korean: 행하신
  alternatives_korean:
  - 대하신
  - 해 주신
  - 하신
  lexicon: BDAG
  rationale: ‘우리에게 행하신’은 행위의 방향성을 살리면서도 한국어 기도문 문체에 맞습니다. ‘해 주신’은 호의적 뉘앙스를 불필요하게 더할 수 있어 피했습니다.
- source_word: ἐν ἀληθινῇ κρίσει
  english_pob_choice: in true judgment
  chosen_korean: 참된 심판으로
  alternatives_korean:
  - 진리의 심판으로
  - 의로운 심판으로
  - 참된 판단으로
  lexicon: BDAG
  rationale: κρίσις는 여기서 단순한 ‘판단’보다 하나님의 공적 판결/심판을 가리키므로 ‘심판’이 더 적절합니다. ἀληθινῇ는 ‘참된’으로 옮겨 POB의 ‘true’와 대응시켰습니다.
theological_decisions:
- issue: 하나님의 행위와 심판의 성격
  chosen_reading: 이 구절은 고난까지 포함한 모든 일이 하나님께서 참된 심판으로 행하신 것이라고 고백합니다.
  alternative_readings:
  - ‘의로운 심판으로’처럼 의미를 해석적으로 좁힐 수 있습니다.
  - ‘참된 판단으로’처럼 더 중립적으로 옮길 수도 있습니다.
  rationale: 원문은 고난의 출처를 하나님께 직접 돌리면서 그 행위를 κρίσις로 평가합니다. 이를 완화하지 않고, 문맥이 요구하는 신정론적 긴장을 그대로 드러내는 것이 적절합니다.
  doctrine_reference: 하나님의 주권과 공의
- issue: 문장 주어의 생략과 호칭
  chosen_reading: 주어는 앞문맥의 하나님으로 이어지므로, 한국어에서는 문맥상 ‘주님’으로 받았습니다.
  alternative_readings:
  - 주어를 생략해 ‘... 참된 심판으로 행하셨습니다’로 둘 수 있습니다.
  - ‘하나님’으로 직접 명시할 수 있습니다.
  rationale: 기도문 흐름에서 대상을 분명히 하기 위해 ‘주님’을 보충했으나, 원문의 의미 범위를 벗어나지 않도록 과도한 해설은 피했습니다.
  doctrine_reference: 문맥 지시와 기도문 관례
