  text: Bless the Lord, all things that grow on the earth; sing hymns and highly exalt him forever.
translation:
  language: ko
  text: 땅 위에서 자라는 모든 것들아, 주님을 찬송하십시오. 노래로 찬미하며 그분을 영원히 높이십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  english_pob_choice: Bless
  chosen_korean: 찬송하십시오
  alternatives_korean:
  - 축복하십시오
  - 찬양하십시오
  lexicon: BDAG
  rationale: 창조물에게 주님을 향해 드리는 호응형 명령으로서, 한국어에서는 예배적 문맥에 자연스럽고 반복되는 후렴의 성격을 살리는 ‘찬송하십시오’가 적절합니다.
- source_word: πάντα τὰ φυόμενα
  english_pob_choice: all things that grow
  chosen_korean: 모든 것들아
  alternatives_korean:
  - 땅에서 자라는 모든 것들아
  - 모든 자라는 것들아
  - 모든 초목이여
  lexicon: LSJ
  rationale: φυόμενα는 ‘자라나는/돋아나는’ 대상을 가리키므로, 본문 호소형을 살려 ‘땅 위에서 자라는 모든 것들아’로 옮겼습니다. ‘초목’은 의미를 좁힐 수 있어 피했습니다.
- source_word: ὑμνεῖτε καὶ ὑπερυψοῦτε
  english_pob_choice: sing hymns and highly exalt him
  chosen_korean: 노래로 찬미하며 … 높이십시오
  alternatives_korean:
  - 찬송하며 … 크게 높이십시오
  - 찬가를 부르며 … 지극히 높이십시오
  lexicon: BDAG
  rationale: ὑμνεῖτε의 노래하는 뉘앙스를 ‘노래로 찬미하며’로, ὑπερυψοῦτε의 강한 상승 의미를 ‘높이십시오’로 살렸습니다. 두 동사의 병렬을 한국어에서는 자연스럽게 부사구+동사로 정리했습니다.
- source_word: εἰς τοὺς αἰῶνας
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 세세토록
  - 영원토록
  lexicon: BDAG
  rationale: 예배적 영속성을 나타내는 관용구이므로, 현대 한국어에서 가장 직접적이고 자연스러운 ‘영원히’를 사용했습니다.
theological_decisions:
- issue: κύριος의 한국어 대응
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 주(主)
  rationale: 문맥상 이 찬양의 대상은 이스라엘의 하나님이므로, 한국어 예배체에서 자연스럽고 존칭을 유지하는 ‘주님’으로 옮겼습니다. 이는 본문의 호명적·전례적 성격도 잘 드러냅니다.
  doctrine_reference: 'POB contested terms: κύριος → 주님'
