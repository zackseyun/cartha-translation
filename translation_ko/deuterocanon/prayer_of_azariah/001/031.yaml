- source_word: αἰνετὸς καὶ ὑπερυψούμενος
  english_pob_choice: praised and highly exalted
  chosen_korean: 찬양받으시고 높임을 받으시는
  alternatives_korean:
  - 찬양을 받으시고 높임을 받으시는
  - 찬양되시고 높임을 받으시는
  lexicon: LEH
  rationale: αἰνετός의 평가적 성격과 ὑπερυψούμενος의 지속적 고양을 함께 살리기 위해 수동형 찬양·존귀 표현을 사용했습니다.
- source_word: εἰς τοὺς αἰῶνας
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 세세토록
  - 영원토록
  lexicon: BDAG
  rationale: 도술송(doxology)의 관용구를 한국어에서 가장 자연스럽게 반복 가능한 방식으로 옮겼습니다.
theological_decisions:
- issue: ἄβυσσος의 우주적 심연 이미지
  chosen_reading: 깊음/깊은 곳의 이미지로 직접 옮겨 하나님이 혼돈의 심연까지 주권적으로 보시는 분임을 드러냈습니다.
