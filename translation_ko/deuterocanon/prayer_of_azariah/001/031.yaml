base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/031.yaml
  text: Blessed are you[a], who look upon the depths, seated upon the cherubim[b], and praised and highly exalted forever.
  footnotes:
  - marker: a
    text: Or 'enthroned above the cherubim.' The Greek more literally says 'seated upon the cherubim.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the abysses.' The phrase evokes the cosmic deep.
    reason: lexical_alternative
translation:
  language: ko
  text: 깊음을 살피시는 분, 그룹들 위에 좌정하신 분, 영원히 찬양받으시고 높임을 받으시는 분이여, 복되십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그룹들 위에 좌정하신 분.” 그리스어는 문자적으로 “그룹들 위에 앉으신”에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “심연들.” 이 표현은 우주적 깊음을 연상시킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογημένος εἶ
  english_pob_choice: Blessed are you
  chosen_korean: 복되십니다
  alternatives_korean:
  - 복을 받으십니다
  - 찬송받으십니다
  lexicon: LEH
  rationale: 직접적인 2인칭 축복 선언으로 읽히므로, 한국어에서는 하나님께 드리는 찬양문답의 흐름을 살려 '복되십니다'로 옮겼습니다.
- source_word: ὁ ἐπιβλέπων ἀβύσσους
  english_pob_choice: who look upon the depths
  chosen_korean: 깊음을 살피시는 분
  alternatives_korean:
  - 깊은 곳을 보시는 분
  - 심연을 바라보시는 분
  lexicon: BDAG / LEH
  rationale: ἐπιβλέπω의 시각적 의미를 살리되, '깊음/심연'의 우주적 이미지를 자연스러운 한국어로 표현하기 위해 '깊음을 살피시는 분'으로 옮겼습니다.
- source_word: καθήμενος ἐπὶ χερουβεὶν
  english_pob_choice: seated upon the cherubim
  chosen_korean: 그룹들 위에 좌정하신 분
  alternatives_korean:
  - 그룹들 위에 앉으신 분
  - 그룹들 위에 앉아 계신 분
  lexicon: LEH
  rationale: 성경적 왕권·보좌 이미지를 지나치게 풀지 않으면서, 한국어 예배체에서 자연스러운 '좌정하다'를 택해 cherubim의 의미를 '그룹들'로 옮겼습니다.
- source_word: αἰνετὸς καὶ ὑπερυψούμενος
  english_pob_choice: praised and highly exalted
  chosen_korean: 찬양받으시고 높임을 받으시는
  alternatives_korean:
  - 찬양을 받으시고 높임을 받으시는
  - 찬양되시고 높임을 받으시는
  lexicon: LEH
  rationale: αἰνετός의 평가적 성격과 ὑπερυψούμενος의 지속적 고양을 함께 살리기 위해 수동형 찬양·존귀 표현을 사용했습니다.
- source_word: εἰς τοὺς αἰῶνας
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 세세토록
  - 영원토록
  lexicon: BDAG
  rationale: 도술송(doxology)의 관용구를 한국어에서 가장 자연스럽게 반복 가능한 방식으로 옮겼습니다.
theological_decisions:
- issue: ἄβυσσος의 우주적 심연 이미지
  chosen_reading: 깊음/깊은 곳의 이미지로 직접 옮겨 하나님이 혼돈의 심연까지 주권적으로 보시는 분임을 드러냈습니다.
  alternative_readings:
  - 단순히 '깊은 곳'으로 완화
  - 비유적으로만 처리
  rationale: 문맥은 단순한 지형 묘사보다 창조 질서 바깥의 심연까지 포괄하는 찬양이므로, 그 긴장을 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §§1, 5
