translation:
  language: ko
  text: 깊은 곳들[a]을 굽어보시고 그룹들[b] 위에 앉아 계시는 분이시여, 영원히 찬양받으시고 지극히 높임을 받으시니 복되십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “심연들.” 이 표현은 우주적 깊음을 연상시킵니다.
    reason: lexical_alternative
