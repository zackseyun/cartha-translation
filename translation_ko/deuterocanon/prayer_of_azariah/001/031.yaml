    text: 또는 “그룹들 위에 좌정하신 분.” 그리스어는 문자적으로 “그룹들 위에 앉아 계시는 분”에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογημένος εἶ
  english_pob_choice: Blessed are you
  chosen_korean: 복되십니다
  alternatives_korean:
