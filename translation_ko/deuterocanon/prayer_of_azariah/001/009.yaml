translation:
  language: ko
  text: 그리고 주께서는 우리를 율법 없는 원수들과 미워하는 배반자들의 손에, 또 온 땅 가운데서도 가장 불의하고 가장 악한 왕에게 넘기셨습니다.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘배반자들’은 ἀποστάτῶν의 ‘떠나 배반한 자들’이라는 뉘앙스를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘율법 없는’은 ἀνόμων의 직역에 가까운 표현으로, ‘무법한’보다 율법-언약적 배경을 더 분명히 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμᾶς εἰς χεῖρας
  english_pob_choice: into the hands of
  chosen_korean: 우리를 … 손에 넘기셨습니다
  alternatives_korean:
  - 우리에게 넘기셨습니다
  - 우리의 손에 맡기셨습니다
  lexicon: παραδίδωμι
  rationale: παραδίδωκας는 단순한 허용보다 ‘넘기다/내어주다’의 강한 인도 의미가 있어, 수동적 허용보다 직접적 처분을 드러내는 표현을 택했습니다.
- source_word: ἐχθρῶν ἡμῶν ἀνόμων
  english_pob_choice: our lawless enemies
  chosen_korean: 율법 없는 원수들
  alternatives_korean:
  - 율법을 어기는 원수들
  - 무법한 원수들
  lexicon: ἄνομος
  rationale: ἀνόμων은 율법에 대한 반항이라기보다 ‘율법 없는/무법한’ 상태를 가리키므로, 프로젝트 기본어인 율법을 살려 ‘율법 없는’으로 옮겼습니다.
- source_word: ἐχθίστων ἀποστατῶν
  english_pob_choice: hateful rebels
  chosen_korean: 미워하는 배반자들
  alternatives_korean:
  - 가장 미운 반역자들
  - 가증한 반역자들
  lexicon: ἐχθιστός + ἀποστάτης
  rationale: ἀποστάται는 단순한 반역자보다 ‘배반하여 떠난 자들’의 뉘앙스가 있어, EN POB의 ‘rebels’를 살리면서도 배반성을 드러내 ‘배반자들’로 옮겼습니다.
- source_word: βασιλεῖ ἀδίκῳ καὶ πονηροτάτῳ
  english_pob_choice: an unjust and most wicked king
  chosen_korean: 가장 불의하고 가장 악한 왕
  alternatives_korean:
  - 불의하고 극히 악한 왕
  - 불공정하고 매우 사악한 왕
  lexicon: ἄδικος + πονηρότατος
  rationale: ἄδικος는 ‘불의한’, πονηρότατος는 최상급을 살린 ‘가장 악한’으로 옮겨 원문의 강도를 유지했습니다.
theological_decisions:
- issue: 배반자/반역자의 뉘앙스
  chosen_reading: ἐχθίστων ἀποστατῶν을 ‘미워하는 배반자들’로 옮겨, 단순 정치적 반란보다 언약적 이탈과 배신의 뉘앙스를 함께 드러냈습니다.
  alternative_readings:
  - 가장 미운 반역자들
  - 가장 미운 배반자들
  rationale: 문맥상 포로로 넘겨진 상황의 도덕적·신학적 평가를 보존하면서도, 한국어에서 자연스러운 비난 강도를 유지하기 위한 선택입니다.
  doctrine_reference: 언약적 불순종과 심판의 언어
