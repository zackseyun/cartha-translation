translation:
  language: ko
  text: 빛과 어둠아, 주님을 찬송하십시오. 그분을 노래로 찬양하고 영원히 크게 높이십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘세대들에 이르기까지’ 또는 ‘세대들 동안’에 가까운 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  english_pob_choice: Bless
  chosen_korean: 찬송하십시오
  alternatives_korean:
  - 복을 빌어 주십시오
  - 축복하십시오
  - 찬양하십시오
  lexicon: BDAG
  rationale: 창조물에게 주님을 향해 올리게 하는 예전적 외침으로 이해하여, 한국어에서는 직설적인 명령형의 예배 언어인 ‘찬송하십시오’로 옮겼습니다. ‘축복하십시오’는 대상이 하나님이 되는 문맥에 어색하고, ‘찬양하십시오’만으로는 εὐλογεῖτε의 ‘복되다/송축하다’의 울림이 조금 약합니다.
- source_word: φῶς καὶ σκότος
  english_pob_choice: light and darkness
  chosen_korean: 빛과 어둠아
  alternatives_korean:
  - 빛과 어둠
  - 광명과 흑암
  lexicon: BDAG
  rationale: 호격으로 부르는 창조 질서의 두 극을 살리기 위해 조사 ‘아’를 붙였습니다. ‘흑암’은 더 고전적이어서, 현대 문체인 본문에서는 ‘어둠’이 자연스럽습니다.
- source_word: ὑμνεῖτε
  english_pob_choice: sing praise
  chosen_korean: 노래로 찬양하고
  alternatives_korean:
  - 찬송하고
  - 노래하십시오
  - 찬미하고
  lexicon: BDAG
  rationale: 이 동사는 단순히 ‘찬양하다’보다 노래로 드리는 찬양의 뉘앙스를 가지므로, 한국어에서 그 기능을 드러내는 ‘노래로 찬양하다’로 풀었습니다.
- source_word: ὑπερυψοῦτε
  english_pob_choice: highly exalt
  chosen_korean: 크게 높이십시오
  alternatives_korean:
  - 한없이 높이십시오
  - 매우 높이십시오
  - 높이고 또 높이십시오
  lexicon: BDAG
  rationale: 복합어의 강한 강조를 반영해 ‘크게’로 높임의 정도를 드러냈습니다. ‘높이다’는 하나님을 향한 찬양의 전형적 한국어 동사로 자연스럽습니다.
- source_word: εἰς τοὺς αἰῶνας
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 세세토록
  - 영원토록
  - 영원히 끝없이
  lexicon: BDAG
  rationale: 문어적이지만 현대적 예배 문체에 맞는 표준 표현으로 옮겼습니다. 영어 POB의 각주가 제시하듯 직역하면 ‘for the ages’이지만, 본문에서는 의미를 자연스럽게 전달하는 ‘영원히’가 적절합니다.
theological_decisions:
- issue: 주님(κύριος)의 예배적 호칭 처리
  chosen_reading: ‘주님’을 사용해 예배적 호칭을 유지했습니다.
  alternative_readings:
  - 주(主)
  - 주님이신 분
  rationale: 이 절은 피조물 전체를 향한 송축의 호출이므로, 한국어 예배 언어에서 가장 자연스럽고 경건한 호칭인 ‘주님’이 적절합니다. 동시에 전통적 ‘여호와’로 바꾸지 않아 원문의 κύριος 호칭을 직접 반영했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος'
- issue: εἰς τοὺς αἰῶνας의 시간 표현
  chosen_reading: ‘영원히’로 옮겼습니다.
  alternative_readings:
  - ‘세세토록’
  - ‘for the ages’의 직역형
  rationale: 이 표현은 찬양의 지속성을 뜻하는 전형적 종결구로, 한국어에서는 ‘영원히’가 가장 분명합니다. 다만 의미상 ‘세세토록’과 같은 고전적 표현도 가능하지만, 본문 문체의 현대성을 우선했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §6
