  naturalness: 개정문은 난해한 첫 비교를 현대 표준 한국어의 자연스러운 관형절 구조로 옮기면서도, ‘뜰들이 에워싸여 있는 것처럼’이라는 원문의 비유 관계를 명확히 합니다. 합쇼체 문체도 일관되게 유지합니다.
  terminology: ‘왕에게 죄를 지어’는 ἠδικηκότι βασιλέα의 법적·도덕적 잘못을 무리 없이 반영합니다. ‘죽음으로 끌려가는’은 ἐπὶ θάνατον ἀπηγμένῳ를 과도하게 ‘사형’으로 한정하지 않습니다. ‘문과 자물쇠와 빗장’은 각각 θυρώματα, κλείθρα, μοχλοί에 대응합니다. ‘그들의 집들’은 οἴκους αὐτῶν의 직역을 유지하며, 지시 대상은 각주에서 문맥적으로 설명합니다.
