- from: 그리고 마치 어떤 사람이 왕을 거슬러 죄를 지은 경우에[a] 죽음으로 끌려가는 자를 둘러싸듯, 제사장들은 도둑들에게 약탈당하지 않도록 자기 집들을 문과 빗장과 빗장들로 튼튼히 지킵니다[b].
  to: 그리고 왕에게 죄를 지어 죽음으로 끌려가는 사람 주위의 뜰들이 에워싸여 있는 것처럼, 제사장들은 도둑들에게 약탈당하지 않도록 그들의 집들을 문과 자물쇠와 빗장으로 튼튼히 지킵니다[a].
  rationale: 원문의 난해한 첫 절에서 ‘뜰들’이 주어인 점을 복원하고, 죽음으로 끌려가는 사람이라는 수식 관계를 유지했습니다. 또한 세 보안 장치를 구별하여 번역했습니다. 기존 a·b 각주는 하나의 각주로 통합하되, 본문 의미를 바꾸지 않고 집들의 문맥상 지시 대상과 난해한 구문만 설명했습니다.
