base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/017.yaml
  text: And just as the courts are secured around one who has wronged a king[a], as one being led away to death, so the priests fortify their houses with doors and locks and bars[b], so that they may not be plundered by robbers.
  footnotes:
  - marker: a
    text: Or 'the courtyards are enclosed around one who has offended the king.' The opening comparison is syntactically difficult, but the sense is that heavy security surrounds a condemned offender.
    reason: lexical_alternative
  - marker: b
    text: '''Their houses'' refers to the houses or temple-buildings of the idols, guarded by the priests.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 마치 어떤 사람이 왕을 거슬러 죄를 지은 경우에[a] 죽음으로 끌려가는 자를 둘러싸듯, 제사장들은 도둑들에게 약탈당하지 않도록 자기 집들을 문과 빗장과 빗장들로 튼튼히 지킵니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕에게 잘못을 저지른 자를 둘러싸듯’입니다. 문장의 첫 비교는 문법적으로 난해하지만, 뜻은 중범죄자를 강하게 포위하는 모습입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘자기 집들’은 우상들의 집이나 신전 건물을 가리키며, 제사장들이 그것들을 지키는 것을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: περιτετράχηλαι εἰσὶν αἱ αὐλαί
  english_pob_choice: the courts are secured around
  chosen_korean: 둘러싸듯
  alternatives_korean:
  - 정원들이 둘러싸여 있듯
  - 뜰이 에워싸여 있듯
  - 안뜰이 둘러싸여 있듯
  lexicon: LSJ
  rationale: 문장 구조가 난해하므로 ‘둘러싸다’ 계열로 압박받는 상황을 살리되, αὐλαί를 특정 건축용어로 과잉 규정하지 않도록 했습니다.
- source_word: τινὶ ἠδικηκότι βασιλέα
  english_pob_choice: one who has wronged a king
  chosen_korean: 어떤 사람이 왕을 거슬러 죄를 지은 경우
  alternatives_korean:
  - 왕에게 죄를 지은 사람
  - 왕을 해친 사람
  - 왕에게 잘못한 사람
  lexicon: BDAG
  rationale: ἠδικέω의 ‘해치다/잘못하다’ 의미를 반영해 법정적·윤리적 뉘앙스를 유지하면서도 한국어로 자연스럽게 옮겼습니다.
- source_word: ὡς ἐπὶ θάνατον ἀπηγμένῳ
  english_pob_choice: as one being led away to death
  chosen_korean: 죽음으로 끌려가는 자
  alternatives_korean:
  - 사형장으로 끌려가는 자
  - 죽임당하러 끌려가는 자
  - 죽음에 넘겨진 자
  lexicon: LSJ
  rationale: ἀπάγω의 ‘끌고 가다’와 종결점인 죽음을 함께 드러내어, 처형 직전의 긴박함을 유지했습니다.
- source_word: ὀχυροῦσιν
  english_pob_choice: fortify
  chosen_korean: 튼튼히 지킵니다
  alternatives_korean:
  - 요새처럼 만듭니다
  - 견고하게 합니다
  - 방비합니다
  lexicon: LSJ
  rationale: 동사의 ‘강화하다, 요새화하다’ 의미를 살리되, 제사장들이 우상 집을 방어시설처럼 다룬다는 풍자를 한국어에서 자연스럽게 전달했습니다.
- source_word: θυρώμασιν τε καὶ κλείθροις καὶ μοχλοῖς
  english_pob_choice: with doors and locks and bars
  chosen_korean: 문과 빗장과 빗장들로
  alternatives_korean:
  - 문과 자물쇠와 빗장들로
  - 문짝과 잠금장치와 빗장으로
  - 문과 자물쇠와 빗장으로
  lexicon: LSJ
  rationale: 세 가지 물리적 장치를 क्रम차적으로 나열하는 효과를 살리되, κλείθροις를 한국어 성경에서 자연스러운 ‘빗장’으로 옮겼습니다.
- source_word: συληθῶσι
  english_pob_choice: be plundered
  chosen_korean: 약탈당하지 않도록
  alternatives_korean:
  - 약탈되지 않도록
  - 털리지 않도록
  - 빼앗기지 않도록
  lexicon: BDAG
  rationale: συλάω의 ‘약탈하다/전리품으로 빼앗다’ 의미를 따라, 단순 도난보다 강한 약탈의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: ‘their houses’의 지시 대상
  chosen_reading: ‘자기 집들’을 그대로 두어, 본문이 우상들의 집/신전 건물들을 가리키는 풍자를 독자가 문맥으로 파악하게 했습니다.
  alternative_readings:
  - 그들의 신전들
  - 그들의 사당들
  rationale: 영어 POB처럼 본문 표현을 보존하면, 제사장들이 우상 관련 건물을 실제 거주지처럼 보호하는 아이러니가 더 분명해집니다.
  doctrine_reference: Translation philosophy §1, §5
