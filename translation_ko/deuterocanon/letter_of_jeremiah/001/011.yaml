  text: But these are not preserved from rust and moths[a], though they are clothed in purple garments.
  footnotes:
  - marker: a
    text: Or 'from corrosion and things that consume them.' The Greek βρωμάτων is broader than 'moths,' but 'moths' best fits the mention of clothing.
