  source_fidelity: 그리스어 οὐ διασώζονται를 물질적 훼손으로부터 ‘보존되지 못합니다’로 옮긴 것은 문맥에 맞습니다. ἀπὸ ἰοῦ는 ‘녹’, βρωμάτων은 의복 문맥에서 ‘좀’으로 번역하되 각주의 더 넓은 의미를 보존했습니다. περιβεβλημένων αὐτῶν ἱματισμὸν πορφυροῦν의 양보적 분사구문도 ‘자주색 옷을 입고 있어도’로 충실히 반영했습니다.
