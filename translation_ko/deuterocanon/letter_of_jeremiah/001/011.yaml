  terminology: ‘녹’, ‘좀’, ‘자주색 옷’은 모두 문맥과 일반적 성서 번역 문체에 적절합니다. 특히 ‘보존’은 여기서 영적 구원으로 오해될 가능성을 줄이면서 우상의 물질적 부패를 나타냅니다.
