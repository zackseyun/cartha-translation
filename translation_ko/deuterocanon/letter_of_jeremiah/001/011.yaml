translation:
  language: ko
  text: 그러나 이들은 녹과 좀으로부터 보존되지 못합니다[a]. 그들이 자주색 옷을 입고 있어도 그렇습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘부식과 그것들을 먹어 없애는 것들로부터.’ 그리스어 βρωμάτων은 ‘좀’보다 넓지만, 옷이 언급되므로 ‘좀’이 가장 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ διασώζονται
  english_pob_choice: are not preserved
  chosen_korean: 보존되지 못합니다
  alternatives_korean:
  - 지켜지지 못합니다
  - 구해지지 못합니다
  lexicon: LSJ
  rationale: 물질적 우상들의 무력함을 드러내는 수동 표현이므로, 영적 ‘구원’보다 ‘보존/유지’의 뜻을 살린 ‘보존되지 못합니다’가 가장 자연스럽습니다.
- source_word: ἀπὸ ἰοῦ
  english_pob_choice: from rust
  chosen_korean: 녹으로부터
  alternatives_korean:
  - 부식으로부터
  - 썩음으로부터
  lexicon: LSJ
  rationale: 이 문맥에서 ἰός는 독보다 금속·물질의 부식, 즉 녹을 가리키는 뜻이 적절하므로 ‘녹’으로 옮겼습니다.
- source_word: βρωμάτων
  english_pob_choice: moths
  chosen_korean: 좀
  alternatives_korean:
  - 좀벌레
  - 먹는 것들
  - 해충
  lexicon: LSJ
  rationale: 직역하면 ‘먹는 것들’이지만, 옷과 연결된 부패 이미지이므로 한국어에서는 가장 간결하고 관용적인 ‘좀’이 본문의 대비를 잘 살립니다.
- source_word: ἱματισμὸν πορφυροῦν
  english_pob_choice: in purple garments
  chosen_korean: 자주색 옷을
  alternatives_korean:
  - 자주색 겉옷을
  - 자주색 의복을
  lexicon: LSJ
  rationale: ἱματισμός는 의복 일반이지만, πορφυροῦν이 자주색 염색 의복의 화려함을 나타내므로 ‘자주색 옷’이 가장 직관적입니다.
theological_decisions:
- issue: διασώζονται의 의미 범위
  chosen_reading: 물리적 부패와 훼손으로부터 지켜지지 못한다는 뜻으로 읽습니다.
  alternative_readings:
  - 영적 구원 여부를 암시하는 표현으로 읽을 수 있습니다.
  - 일반적인 ‘구출’의 의미로 넓게 읽을 수 있습니다.
  rationale: 주변 문맥이 우상의 무력함과 물질적 쇠락을 말하므로, 본문은 신학적 구원보다 실제적인 보존 실패를 강조하는 것으로 번역하는 것이 적절합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
