    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 누구에게서 어떤 해를 입거나 어떤 유익을 받더라도, 그에 대해 되갚을 수 없습니다. 그들은 왕을 세울 수도 없고 없앨 수도 없습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὔτε ἐὰν ... οὔτε ἐὰν
  english_pob_choice: Whether ... or
  chosen_korean: 누구에게서 어떤 해를 입든지, 또는 어떤 좋은 것을 받든지
  alternatives_korean:
  - 해를 입든지 받든지
  - 어떤 해든 어떤 선이든
  lexicon: LSJ
  rationale: 조건을 두 번 병렬로 세운 구조를 한국어에서는 ‘...든지, 또는 ...든지’로 자연스럽게 살려 두 경우 모두를 포괄하도록 했습니다.
- source_word: δυνήσονται ἀνταποδοῦναι
  english_pob_choice: they will not be able to repay it
  chosen_korean: 그 대가를 갚아 줄 수 없습니다
  alternatives_korean:
  - 갚을 수 없습니다
  - 되갚을 수 없습니다
  - 보답할 수 없습니다
  lexicon: LSJ
  rationale: ἀνταποδοῦναι는 단순한 ‘지불’보다 주고받는 상응 행위를 가리키므로, 해와 선 모두에 적용될 수 있는 ‘대가를 갚다’로 옮겼습니다.
- source_word: καταστῆσαι βασιλέα
  english_pob_choice: set up a king
  chosen_korean: 왕을 세울 수도 없고
  alternatives_korean:
  - 왕을 임명할 수도 없고
  - 왕을 세워 둘 수도 없고
  lexicon: LSJ
  rationale: καταστῆσαι는 설치·세움의 뜻을 가지며, 문맥상 정치적 권위를 부여하는 행위를 가리키므로 ‘왕을 세우다’가 가장 직접적입니다.
- source_word: ἀφελέσθαι
  english_pob_choice: remove one
  chosen_korean: 왕을 없앨 수도 없습니다
  alternatives_korean:
  - 왕을 제거할 수도 없습니다
  - 왕을 폐위할 수도 없습니다
  lexicon: LSJ
  rationale: 앞절의 ‘왕’을 이어받는 말로, ἀφελέσθαι의 ‘빼앗다/제거하다’ 의미를 한국어에서 간결하게 살려 ‘없애다’로 옮겼습니다.
theological_decisions:
- issue: 우상들의 무능력 범위
  chosen_reading: 우상들은 해를 입거나 선을 입는 상황 모두에 응답할 수 없고, 정치적으로도 왕을 세우거나 없앨 수 없습니다.
  alternative_readings:
  - 해악에 대한 보복 능력만 없다는 좁은 의미
  - 정치 문구를 더 제도적으로 ‘임명하다/폐위하다’로 옮기는 방식
  rationale: 그리스어는 보복과 호의, 그리고 왕권의 수립과 철폐까지 폭넓게 묶어 우상들의 무능력을 드러내므로, 그 범위를 축소하지 않으면서도 과장하지 않게 번역했습니다.
  doctrine_reference: '번역 원칙: 본문의 평이한 의미와 수사적 폭을 보존하며, 본문이 말하지 않는 신학적 확장을 덧붙이지 않습니다.'
