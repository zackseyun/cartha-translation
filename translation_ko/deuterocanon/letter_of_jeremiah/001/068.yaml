  terminology: ‘신들’은 θεοί의 복수성을 보존하며, ‘그것들’은 문맥상 우상들을 가리키는 αὐτούς를 적절히 드러냅니다. ‘두려워하지 마십시오’도 금지 명령의 격식과 의미에 맞습니다.
