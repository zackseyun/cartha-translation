  source_fidelity: 그리스어의 전면 부정(κατʼ οὐδένα τρόπον), 인식적 서술(ἡμῖν φανερόν), 복수 ‘신들’(θεοί), 그리고 금지 명령(μὴ φοβῆσθε)을 충실히 옮겼습니다. ‘그러므로’와 ‘그러니’는 각각 οὖν 및 διό의 논리적 연결을 자연스럽게 반영합니다.
