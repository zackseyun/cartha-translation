  text: 그러므로 그것들이 신들이라는 것은 우리에게 결코 분명하지 않습니다. 그러니 그것들을 두려워하지 마십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατʼ οὐδένα οὖν τρόπον
  english_pob_choice: in no way
  chosen_korean: 결코
  alternatives_korean:
  - 전혀
  - 어떤 방식으로도
  lexicon: LSJ
  rationale: 총체적 부정을 간결하게 살려, 그들이 신이라는 판단이 전혀 성립하지 않는다는 뜻을 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: φανερὸν
  english_pob_choice: evident
  chosen_korean: 분명하지 않습니다
  alternatives_korean:
  - 명백하지 않습니다
  - 드러나지 않습니다
  - 분명합니다
  lexicon: LSJ
  rationale: φανερόν의 인식론적 의미를 살려, 관찰자들에게 그것이 자명하게 드러나지 않는다는 뜻을 표현했습니다.
- source_word: θεοί
  english_pob_choice: gods
  chosen_korean: 신들
  alternatives_korean:
  - 신격들
  - 신성한 존재들
  lexicon: LSJ
  rationale: 복수형 θεοί를 직역해 우상 숭배 논박의 날카로움을 유지했습니다.
- source_word: μὴ φοβῆσθε αὐτούς
  english_pob_choice: do not fear them
  chosen_korean: 그것들을 두려워하지 마십시오
  alternatives_korean:
  - 그들을 두려워하지 마십시오
  - 그것들을 무서워하지 마십시오
  lexicon: LSJ
  rationale: 지시 대상은 앞서 논의된 우상들이므로 ‘그것들’을 택해 문맥을 분명히 했고, 금지 명령은 현대 합쇼체로 직접 전달했습니다.
theological_decisions:
- issue: αὐτούς의 지시 대상
  chosen_reading: ‘그것들’은 신으로 여겨지는 우상들을 가리킵니다.
  alternative_readings:
