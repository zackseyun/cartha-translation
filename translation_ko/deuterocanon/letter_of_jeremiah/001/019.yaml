  text: They are indeed like a beam from a house[a], but they say that their hearts are licked away; while the creeping things from the ground devour them and their clothing, they do not perceive it.
  footnotes:
  - marker: a
    text: Or 'their insides are licked away.' The Greek says 'their hearts,' preserving the mock-anthropomorphic image.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 참으로 집의 들보와 같으며, 그들의 마음이 핥겨져 없어졌다고들 말합니다. 땅에서 기어 다니는 것들이 그들과 그들의 옷을 집어삼키는데도, 그들은 그것을 깨닫지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 속이 핥겨져 없어졌다고’로 옮길 수 있습니다. 헬라어는 ‘마음들’이라고 하여 목재 우상의 내부를 의인화한 이미지를 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκός
