  - 핥아 없어졌다고
  - 핥아먹혔다고
  lexicon: LSJ
  rationale: ‘핥다’의 감각적이고 조롱적인 뉘앙스를 보존하면서, 수동적 소멸의 의미를 자연스럽게 드러내는 표현을 택했습니다.
- source_word: ἑρπετῶν
  english_pob_choice: creeping things
  chosen_korean: 땅에서 기어 다니는 것들
  alternatives_korean:
  - 기어 다니는 짐승들
  - 기어 다니는 생물들
  - 파충류
  lexicon: LSJ
  rationale: 현대 분류학적 ‘파충류’보다, 본문의 넓은 범주를 살리는 ‘땅에서 기어 다니는 것들’이 원문의 의미 범위를 더 잘 반영합니다.
