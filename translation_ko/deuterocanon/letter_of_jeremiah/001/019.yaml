  verdict: revise
  source_fidelity: 전반적으로 원문을 충실히 옮겼습니다. δοκός는 ‘들보’, ἑρπετά는 ‘땅에서 기어 다니는 것들’, κατεσθίω는 ‘집어삼키다’로 적절합니다. 다만 φασίν의 말하는 주체가 우상인 것처럼 읽히지 않도록 한국어 문장을 조정할 필요가 있습니다.
  naturalness: ‘그들은 … 말합니다’는 앞뒤의 ‘그들’(우상들)과 연결되어 우상들이 자기 마음에 관하여 말하는 듯한 문법적 인상을 줍니다. 또한 ‘핥겨져 없어졌다고들’보다 ‘핥겨 없어졌다고 합니다’가 더 자연스럽고 간결합니다.
  terminology: ‘마음’은 καρδίας의 의인화된 표현을 잘 보존하며, 각주에서 ‘속’이라는 해석적 대안을 제시한 것도 적절합니다. ‘옷’도 ἱματισμός에 자연스럽게 대응합니다.
  issues:
  - severity: medium
    issue: ‘그들은 … 말합니다’의 주어가 우상들로 읽힐 수 있음
