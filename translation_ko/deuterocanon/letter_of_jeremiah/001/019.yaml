  chosen_korean: 들보
  alternatives_korean:
  - 보
  - 기둥
  - 통나무
  lexicon: LSJ
  rationale: 집의 구조재를 가리키는 비유이므로, 건축적 기능이 살아 있는 ‘들보’가 가장 자연스럽고 원문의 이미지를 잘 살립니다.
- source_word: καρδίας
