  alternative_readings:
  - ‘속이 비었다고들 말합니다’처럼 풀어 쓰기
  - ‘내부가 갉아 없어졌다고들 말합니다’로 완화하기
  rationale: 본문은 우상을 살아 있는 것처럼 말하면서 동시에 그 무감각을 조롱합니다. 이 긴장을 약화하지 않기 위해 의인화와 조롱의 이미지를 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
