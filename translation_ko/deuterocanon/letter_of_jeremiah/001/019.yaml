  rationale: 목재 우상 내부를 가리키는 의인화된 표현을 한국어에서도 살리되, 현대 독자가 이해하기 쉬운 ‘마음’으로 옮겼습니다.
- source_word: ἐκλείχεσθαι
  english_pob_choice: are licked away
  chosen_korean: 핥겨져 없어졌다고
  alternatives_korean:
