    text: 또는 ‘그들의 속이 핥겨 없어졌다고’로 옮길 수 있습니다. 헬라어는 ‘마음들’이라고 하여 목재 우상들의 내부를 의인화한 이미지를 보존합니다.
    reason: lexical_alternative
