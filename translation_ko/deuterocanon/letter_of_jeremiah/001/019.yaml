  - severity: low
    issue: 각주 표지의 위치
    rationale: 각주는 ‘마음’의 의미 대안을 설명하므로 문장 끝이 아니라 해당 낱말 바로 뒤에 두는 편이 앵커 기능이 명확합니다.
