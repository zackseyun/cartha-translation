  text: 그들은 참으로 집의 들보와 같지만, 그들의 마음[a]이 핥겨 없어졌다고 합니다. 땅에서 기어 다니는 것들이 그들과 그들의 옷을 집어삼키는데도, 그들은 그것을 깨닫지 못합니다.
  philosophy: optimal-equivalence
  footnotes:
