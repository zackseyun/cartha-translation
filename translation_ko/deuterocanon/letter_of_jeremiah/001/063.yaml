  lexicon: LSJ
  rationale: 앞선 논증을 결론짓는 인과적 연결어로서, 현대 한국어에서는 ‘그러므로’가 가장 자연스럽고 문맥의 추론력을 잘 드러냅니다.
- source_word: νομιεῖσθαι
