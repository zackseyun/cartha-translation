- from: 그와 같이 그들은 재물도 놋쇠도 줄 수 없습니다. 누군가 그들에게 서원하고도 그것을 갚지 않으면, 그들은 결코 그것을 찾지 않을 것입니다.[a][b]
  to: 마찬가지로 그들은 재물도 청동도[a] 결코 줄 수 없습니다. 누군가 그들에게 서원하고도 그것을 이행하지 않으면, 그들은 결코 그것을 요구하지 않을 것입니다.[b]
