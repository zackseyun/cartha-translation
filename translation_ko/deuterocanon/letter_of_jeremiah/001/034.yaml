  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 οὐ μή의 강한 부정은 첫 절에도 ‘결코’로 드러내는 편이 적절합니다. χαλκός는 ‘청동/구리’ 계열 금속을 뜻하므로 현대 표준어에서 ‘청동’이 ‘놋쇠’보다 더 정확하고 분명합니다. ἐπιζητέω는 문맥상 미이행된 서원을 ‘요구하다’라는 뜻이 자연스럽습니다.
  naturalness: ‘그와 같이’보다 문단 연결에서는 ‘마찬가지로’가 자연스럽습니다. 또한 한국어에서 서원은 일반적으로 ‘갚다’보다 ‘이행하다’라고 하므로 이를 수정해야 합니다. ‘그것을 찾지 않을 것입니다’는 한국어에서 무엇을 찾는지와 행위의 의미가 불분명합니다.
  terminology: ‘서원’은 εὐχή에 적합합니다. ‘청동’은 χαλκός의 금속 의미를 보존하며, 각주에서 ‘구리’ 및 재화의 함의를 밝혀 대안을 유지합니다.
