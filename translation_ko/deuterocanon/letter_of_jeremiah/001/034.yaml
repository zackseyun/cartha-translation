  text: Likewise[a], they are certainly not able to give either wealth or bronze; if someone makes a vow to them and does not pay it back[b], they will certainly not seek it.
  footnotes:
  - marker: a
    text: Or 'copper,' possibly implying money or valuables made from bronze.
    reason: lexical_alternative
  - marker: b
    text: Or 'they will certainly not demand it.' The Greek literally says 'seek it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 마찬가지로 그들은 재물도 청동도[a] 결코 줄 수 없습니다. 누군가 그들에게 서원하고도 그것을 이행하지 않으면, 그들은 결코 그것을 요구하지 않을 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘청동’은 문자적으로 청동 또는 구리 계열의 금속을 가리킵니다. 문맥상 금속으로 된 재물이나 가치 있는 물품을 암시할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 문자적으로 ‘그것을 찾지 않을 것이다’라고 말합니다. 이 문맥에서는 이행되지 않은 서원을 요구하거나 독촉하지 않는다는 뜻입니다.
    reason: lexical_alternative
