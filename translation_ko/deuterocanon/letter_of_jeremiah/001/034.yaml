  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/034.yaml
  text: Likewise[a], they are certainly not able to give either wealth or bronze; if someone makes a vow to them and does not pay it back[b], they will certainly not seek it.
  footnotes:
  - marker: a
    text: Or 'copper,' possibly implying money or valuables made from bronze.
    reason: lexical_alternative
  - marker: b
    text: Or 'they will certainly not demand it.' The Greek literally says 'seek it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그와 같이 그들은 재물도 놋쇠도 줄 수 없습니다. 누군가 그들에게 서원하고도 그것을 갚지 않으면, 그들은 결코 그것을 찾지 않을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘놋쇠’는 문자적으로는 청동/구리류 금속을 가리키며, 문맥상 금속 가치나 재화를 암시할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘찾다’이지만, 문맥상 서원을 이행하라고 요구한다는 뜻으로 이해할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσαύτως
  english_pob_choice: Likewise
  chosen_korean: 그와 같이
  alternatives_korean:
  - 이와 같이
  - 마찬가지로
  lexicon: BDAG
  rationale: 앞 구절과의 병렬을 자연스럽게 잇는 연결어로, ‘이와 같이’보다 약간 덜 문어적이면서도 원문의 비교 기능을 유지합니다.
- source_word: πλοῦτον
  english_pob_choice: wealth
  chosen_korean: 재물
  alternatives_korean:
  - 부
  - 재산
  lexicon: BDAG
  rationale: 단순한 화폐보다 더 넓은 소유물을 가리키므로, 문맥상 ‘재물’이 가장 무난하게 원의를 전달합니다.
- source_word: χαλκὸν
  english_pob_choice: bronze
  chosen_korean: 놋쇠
  alternatives_korean:
  - 청동
  - 구리
  lexicon: BDAG
  rationale: 영어 POB의 ‘bronze’에 대응해 금속 자체를 드러내는 표기를 택했으며, 한국어 성경 문맥에서 통용되는 금속명으로 옮겼습니다.
- source_word: οὐ μὴ δύνωνται δοῦναι
  english_pob_choice: they are certainly not able to give
  chosen_korean: 줄 수 없습니다
  alternatives_korean:
  - 결코 줄 수 없습니다
  - 도무지 줄 수 없습니다
  lexicon: BDAG
  rationale: οὐ μή의 강한 부정을 한국어의 단정형으로 옮겨, 우상들의 무능을 직접적으로 표현했습니다.
- source_word: εὐχὴν εὐξάμενος
  english_pob_choice: makes a vow
  chosen_korean: 서원하고
  alternatives_korean:
  - 서원하며
  - 맹세하고
  lexicon: BDAG
  rationale: 동어 반복 구조를 한국어에서 자연스럽게 풀어 ‘서원하다’로 옮겼고, 제의적 약속의 성격을 유지했습니다.
- source_word: μὴ ἀποδῷ
  english_pob_choice: does not pay it back
  chosen_korean: 그것을 갚지 않으면
  alternatives_korean:
  - 그것을 이행하지 않으면
  - 그것을 바치지 않으면
  lexicon: BDAG
  rationale: ἀποδίδωμι의 ‘되돌려 주다/갚다’라는 구체성을 살리되, 서원의 미이행을 한국어로 이해하기 쉽게 표현했습니다.
- source_word: οὐ μὴ ἐπιζητήσωσιν
  english_pob_choice: they will certainly not seek it
  chosen_korean: 결코 그것을 찾지 않을 것입니다
  alternatives_korean:
  - 결코 그것을 요구하지 않을 것입니다
  - 결코 그것을 찾으려 하지 않을 것입니다
  lexicon: BDAG
  rationale: ἐπιζητέω의 기본 의미인 ‘찾다/구하다’를 따라 원문에 가깝게 옮기면서, 문맥상 책임 추궁의 뉘앙스는 과도하게 덧붙이지 않았습니다.
theological_decisions:
- issue: 우상의 무능과 서원 불이행에 대한 반응
  chosen_reading: 우상은 재물이나 금속 가치도 줄 수 없고, 서원을 어겨도 그 책임을 요구하지 못하는 무력한 존재로 묘사됩니다.
  alternative_readings:
  - 마지막 절을 ‘그것을 요구하지 않을 것입니다’로 더 해석적으로 옮길 수 있습니다.
  rationale: 문맥의 조롱과 무력성이라는 신학적 포인트를 살리되, 원문의 표현 범위를 넘겨 우상에 능동적 ‘징벌’ 의미를 덧붙이지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: 원문이 지시하는 우상 비판을 보존하고, 번역이 해석을 과도하게 대체하지 않도록 함.'
