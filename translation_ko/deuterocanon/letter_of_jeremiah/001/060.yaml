  text: Likewise[a], when lightning appears, it is clearly seen; and in the same way the wind blows in every land.
  footnotes:
  - marker: a
    text: Greek πνεῦμα can also mean 'spirit' or 'breath,' but here the context of natural phenomena and the verb 'blows' favors 'wind.'
    reason: lexical_alternative
translation:
  language: ko
  text: 마찬가지로 번개가 나타나면 분명히 보입니다. 또한 그와 같이 바람도 온 땅에서 붑니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 πνεῦμα는 문맥상 ‘영’이 아니라 ‘바람’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσαύτως
  english_pob_choice: Likewise
  chosen_korean: 마찬가지로
  alternatives_korean:
  - 그와 같이
  - 유사하게
  lexicon: LSJ
  rationale: 앞뒤 비교를 잇는 접속부사로 자연스럽고, 영어 POB의 비교적 힘을 그대로 살릴 수 있습니다.
- source_word: ἀστραπὴ ὅταν ἐπιφάνῃ
  english_pob_choice: when lightning appears
  chosen_korean: 번개가 나타나면
  alternatives_korean:
  - 번개가 번쩍이면
  - 번개가 나타날 때
  lexicon: LSJ
  rationale: ἐπιφαίνω의 ‘나타나다/드러나다’ 의미를 살리되, 번개라는 주어와 결합해 한국어로 자연스럽게 옮겼습니다.
- source_word: εὔοπτός ἐστιν
  english_pob_choice: it is clearly seen
  chosen_korean: 분명히 보입니다
  alternatives_korean:
  - 쉽게 보입니다
  - 또렷하게 보입니다
  lexicon: LSJ
  rationale: ‘쉽게 보이는/분명히 보이는’의 뜻을 담아, 시각적으로 뚜렷하다는 점을 간결하게 표현했습니다.
- source_word: πνεῦμα
  english_pob_choice: wind
  chosen_korean: 바람
  alternatives_korean:
  - 영
  - 숨
  lexicon: LSJ
  rationale: 자연 현상과 함께 πνεῖ(붑니다)가 결합되어 있으므로 ‘영’이 아니라 날씨 맥락의 ‘바람’이 적절합니다.
theological_decisions:
- issue: πνεῦμα의 의미를 영적 의미로 열어둘지 여부
  chosen_reading: 자연현상으로서의 바람
  alternative_readings:
  - 영
  - 숨
  rationale: 문맥이 번개와 바람을 나란히 든 감각적 비유이므로, 신학적 의미를 덧씌우지 않고 자연현상인 바람으로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: 원문이 지지하지 않는 신학적 의미를 번역에서 앞서 정하지 말 것.'
