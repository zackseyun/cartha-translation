    text: 그리스어 πνεῦμα는 ‘영’이나 ‘숨’을 뜻할 수도 있지만, 여기서는 자연 현상의 문맥과 ‘분다’라는 동사 때문에 ‘바람’을 뜻하는 것으로 보입니다.
    reason: lexical_alternative
