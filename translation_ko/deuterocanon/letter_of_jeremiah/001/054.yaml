  verdict: revise
  source_fidelity: 본문의 재료 표현, 불이 집 안으로 떨어지는 상황, 제사장들의 도피와 보존, 들보가 타는 비유는 대체로 충실합니다. 그러나 현행 한국어는 서두의 비교가 문법적으로 다소 어색하고, 마지막의 ‘그들은’이 바로 앞의 ‘제사장들’을 가리킬 수 있어 원문의 대조 대상(신들/신상들)을 흐립니다. 또한 각주 b는 원문이 명시하지 않는 ‘밖에 드러난’ 상태와 비유의 확정적 뜻을 덧붙입니다.
  naturalness: ‘왜냐하면 … 것처럼’은 뒤에 대응되는 결론절이 없는 현행 문맥에서 부자연스럽습니다. 원문의 생략적 비교는 유지하되 ‘왜냐하면’을 제거하는 편이 자연스럽습니다. ‘그 신들은’으로 주어를 밝혀 제사장들과의 대조를 분명히 했습니다.
  terminology: οἰκία는 ‘집’으로, ξύλινοι/περιχρύσοι/περιήργυροι는 각각 ‘나무로 된/금으로 입힌/은으로 입힌’으로 유지합니다. θεοί는 본문 표현대로 ‘신들’로 옮기며, 우상이라는 해석적 명사는 본문에 넣지 않았습니다. δοκοὶ μέσοι는 구조물 안쪽 또는 가운데의 들보라는 뜻을 보존하여 ‘가운데의 들보’로 옮겼습니다.
