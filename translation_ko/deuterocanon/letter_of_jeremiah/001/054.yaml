    rationale: 그리스어의 비교는 전승 본문에서 생략적이지만, 한국어의 ‘왜냐하면’은 통상 뒤따르는 이유 절을 요구하여 문장을 더 어색하게 만듭니다. 접속어를 제거하여 원문의 생략성은 남기되 불필요한 문법적 문제를 피해야 합니다.
