  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/054.yaml
  text: For just as a crow is between heaven and earth[a], so also when fire falls into a house of wooden or gold-covered or silver-covered gods, their priests will flee and be saved[b], but they themselves will be burned up like beams in the middle.
  footnotes:
  - marker: a
    text: Or 'a temple of wooden or gold-covered or silver-covered gods.'
    reason: lexical_alternative
  - marker: b
    text: The opening comparison is terse in Greek; the sense is that the idols are as helpless as an exposed crow when disaster comes.
    reason: cultural_note
translation:
  language: ko
  text: 왜냐하면 까마귀가 하늘과 땅 사이에 있는 것처럼, 불이 나무로 된 것이거나 금으로 입힌 것이거나 은으로 입힌 신들의 집에 떨어질 때에도 그들의 제사장들은 도망하여 살아남겠지만, 그들은 중간의 들보처럼 타버릴 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나무로 된 것이거나 금으로 입힌 것이거나 은으로 입힌 신들의 신전’.
    reason: lexical_alternative
  - marker: b
    text: 그리스어의 첫 비교는 매우 간결하며, 뜻은 재앙이 닥칠 때 우상들이 밖에 드러난 까마귀처럼 무력하다는 것입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ὥσπερ γὰρ κορώνη ἀνὰ μέσον τοῦ οὐρανοῦ καὶ τῆς γῆς
  english_pob_choice: For just as a crow is between heaven and earth
  chosen_korean: 왜냐하면 까마귀가 하늘과 땅 사이에 있는 것처럼
  alternatives_korean:
  - 까마귀가 하늘과 땅 사이에 있는 것처럼
  - 왜냐하면 까마귀가 하늘과 땅 사이에 있듯이
  lexicon: LSJ
  rationale: ὥσπερ의 비교 구조를 살려 ‘...처럼’으로 옮기고, κορώνη는 구체적인 새 이미지인 ‘까마귀’로 유지했습니다.
- source_word: οἰκίαν θεῶν ξύλινων ἢ περιχρύσων ἢ περιηργύρων
  english_pob_choice: a house of wooden or gold-covered or silver-covered gods
  chosen_korean: 나무로 된 것이거나 금으로 입힌 것이거나 은으로 입힌 신들의 집
  alternatives_korean:
  - 나무로 된 것이거나 금으로 입힌 것이거나 은으로 입힌 신들의 집
  - 나무나 금도금이나 은도금한 신들의 집
  lexicon: LSJ
  rationale: οἰκίαν은 문자적으로 ‘집’이므로 이를 유지했고, 형용사들은 우상상(偶像像)의 재료/장식을 드러내는 방식으로 풀어 옮겼습니다.
- source_word: φεύξονται καὶ διασωθήσονται
  english_pob_choice: their priests will flee and be saved
  chosen_korean: 그들의 제사장들은 도망하여 살아남겠지만
  alternatives_korean:
  - 그들의 제사장들은 도망하여 살아남겠지만
  - 그들의 제사장들은 도망하고 구원을 받을 것이지만
  lexicon: LSJ
  rationale: 두 동사를 분리해 ‘도망하여’와 ‘살아남다’로 표현해, 피신하는 행위와 보존되는 결과를 함께 살렸습니다.
- source_word: δοκοὶ μέσοι κατακαυθήσονται
  english_pob_choice: they themselves will be burned up like beams in the middle
  chosen_korean: 그들은 중간의 들보처럼 타버릴 것입니다
  alternatives_korean:
  - 그들은 중간의 들보처럼 타버릴 것입니다
  - 그들은 한가운데 들보들처럼 완전히 불타버릴 것입니다
  lexicon: LSJ
  rationale: δοκοί는 건축용 ‘들보’로 옮기고, μέσοι는 ‘중간의’로 처리해 구조물의 내부/가운데라는 비교를 자연스럽게 살렸습니다.
theological_decisions:
- issue: 불이 떨어지는 대상과 우상 신전 표현
  chosen_reading: ‘신들의 집’으로 직역해 우상 신전의 문자적 이미지를 유지했습니다.
  alternative_readings:
  - ‘우상들의 집’
  - ‘신전’
  rationale: 본문은 οἰκίαν θεῶν이라고 하여 ‘집’이라는 표현을 쓰므로, 해석을 앞세운 ‘신전’보다 원문 이미지를 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
- issue: 비유의 급작스러운 서술
  chosen_reading: 서두의 비교를 매끈하게 풀어 ‘왜냐하면 ...처럼’으로 시작했습니다.
  alternative_readings:
  - 비교 구절을 파편처럼 유지하기
  - 설명적으로 확장하기
  rationale: 그리스어의 압축된 비교를 한국어 문장으로 읽히게 하되, 우상 비판의 조롱적 비유 자체는 훼손하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
