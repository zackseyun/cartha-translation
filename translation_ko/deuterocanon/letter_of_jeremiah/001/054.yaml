  - severity: medium
    issue: 각주 b의 해석적 확대
    rationale: 그리스어는 까마귀가 ‘밖에 드러나’ 있다는 말을 하지 않으며, 비교의 정확한 연결 방식도 생략되어 있습니다. 무력함이라는 확정적 해설 대신 본문의 생략성을 알리는 각주가 적절합니다.
