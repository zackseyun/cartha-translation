  text: From the purple and the marble rotting upon them it will be known that they are not gods; and in the end they themselves will be eaten[a], and they will become a disgrace in the land.
  footnotes:
  - marker: a
    text: Or 'afterward they themselves will be consumed/devoured.' The Greek literally says 'will be eaten,' which may refer to physical consumption by decay or creatures.
    reason: lexical_alternative
translation:
  language: ko
  text: 자주색 천과 그 우상들 위에서 썩어 가는 대리석을 보면, 그것들이 신들이 아님을 알게 될 것입니다. 마침내 그 우상들 자신도 먹히게 되고, 그 땅에서 수치거리가 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 뒤에 그 우상들 자신도 소모되거나 먹힐 것입니다.’ 헬라어는 문자적으로 ‘먹히다’라고 하며, 부패나 생물에 의해 소모되는 것을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορφύρας
  english_pob_choice: purple
  chosen_korean: 보라색
  alternatives_korean:
  - 자주색
  - 보라 빛깔의 천
  lexicon: LSJ
  rationale: πορφύρα는 자주색 직물이나 장식을 가리킬 수 있어, 문맥상 우상에 덧입혀진 장식 재료라는 점을 살리면서도 간결하게 옮기기 위해 ‘보라색’으로 렌더링했습니다.
- source_word: μαρμάρου
  english_pob_choice: marble
  chosen_korean: 대리석
  alternatives_korean:
  - 마블
  - 윤기 나는 돌
  lexicon: LSJ
  rationale: μάρμαρον의 기본 뜻은 대리석이므로, 한국어에서도 가장 직접적인 대응인 ‘대리석’을 택했습니다.
- source_word: τῆς ἐπ’ αὐτοὺς σηπομένης
  english_pob_choice: rotting upon them
  chosen_korean: 그 위에 썩어 가는
  alternatives_korean:
  - 그 위에서 부패하는
  - 그들 위에서 썩는
  lexicon: LSJ
  rationale: 현재 분사는 장식 재료가 우상 위에 놓인 채 부패하는 모습을 가리키므로, 자연스럽고도 시각적인 표현인 ‘그 위에 썩어 가는’으로 옮겼습니다.
- source_word: βρωθήσονται
  english_pob_choice: will be eaten
  chosen_korean: 스스로 먹혀 버리고
  alternatives_korean:
  - 먹힐 것입니다
  - 삼켜질 것입니다
  - 잡아먹힐 것입니다
  lexicon: LSJ
  rationale: 동사는 문자적으로 ‘먹히다’이므로 그 구체성을 유지했습니다. 한국어에서는 수동의 결과와 비참한 종결을 살리기 위해 ‘스스로 먹혀 버리고’로 번역했습니다.
theological_decisions:
- issue: 우상과 장식 재료의 관계
  chosen_reading: 문장은 우상의 화려한 장식이 썩어 가는 모습이 그 우상들의 무가함을 드러내며, 이어서 우상 자신이 먹혀 수치가 된다고 말합니다.
  alternative_readings:
  - 후반부의 ‘그것들’은 장식 재료만 가리킨다고 볼 수도 있습니다.
  rationale: 헬라어의 복수 대명사와 문맥상 우상 비판의 흐름을 따라, 장식은 증거로, 우상은 최종 조롱의 대상로 읽는 편이 본문 효과를 더 잘 보존합니다.
  doctrine_reference: 문맥 우선 해석; 우상숭배 비판의 수사적 흐름 보존
