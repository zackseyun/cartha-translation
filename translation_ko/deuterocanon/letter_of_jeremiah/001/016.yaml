translation:
  language: ko
  text: 그들의 신들은[a] 이와 같습니다. 집들 안에 세워져 있고, 그들의 눈은 들어오는 이들의 발에서 일어난 먼지로 가득합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 우상들’. 헬라어 본문은 문자 그대로 ‘그들의 신들’이라고 하며, 민족들이 숭배하는 형상들을 비판적으로 부르는 표현을 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ θεοὶ αὐτῶν
  english_pob_choice: their gods
  chosen_korean: 그들의 신들
  alternatives_korean:
  - 그들의 우상들
  - 그들의 신들
  lexicon: LSJ
  rationale: 본문은 역설적으로 이미지 숭배 대상을 ‘신들’이라 부르므로, 주석적 완화 없이 그 폴레믹 표현을 그대로 살렸습니다.
- source_word: καθιδρυμένων
  english_pob_choice: have been set up
  chosen_korean: 세워져 있습니다
  alternatives_korean:
  - 설치되어 있습니다
  - 세워 두었습니다
  - 세워져 있습니다
  lexicon: LSJ
  rationale: 동상/형상을 집 안에 놓아 둔 상태를 자연스럽게 드러내면서, ‘설치’보다 덜 행정적이고 본문의 우상 풍자를 잘 살립니다.
- source_word: ἐν τοῖς οἴκοις
  english_pob_choice: in houses
  chosen_korean: 집들에
  alternatives_korean:
  - 집 안에
  - 가옥들 안에
  lexicon: LSJ
  rationale: 복수형을 반영해 우상들이 여러 집에 놓인 장면을 자연스럽게 표현했습니다.
- source_word: κονιορτοῦ ἀπὸ τῶν ποδῶν τῶν εἰσπορευομένων
  english_pob_choice: dust from the feet of those who enter
  chosen_korean: 들어오는 자들의 발에서 날아든 먼지
  alternatives_korean:
  - 들어오는 자들의 발에서 온 먼지
  - 들어오는 자들의 발에 묻은 먼지
  lexicon: LSJ
  rationale: ἀπό의 출처 의미를 살려 먼지가 ‘발에서 날아든’ 것으로 옮겨, 우상들이 사람들의 왕래로 더럽혀지는 조롱의 그림을 분명히 했습니다.
theological_decisions:
- issue: ‘their gods’의 직역 유지 여부
  chosen_reading: ‘그들의 신들’로 유지해, 본문이 우상 이미지를 정면으로 ‘신들’이라 부르는 폴레믹을 그대로 드러냈습니다.
  alternative_readings:
  - 그들의 우상들
  rationale: 문맥상 우상임은 분명하지만, 원문은 해석적으로 완화하지 않고 수사적 아이러니를 유지합니다.
  doctrine_reference: '번역 원칙: 원어 우선, 본문의 표면적 진술을 해석으로 대체하지 않음'
