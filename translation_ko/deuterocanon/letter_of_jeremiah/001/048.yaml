  to: 전쟁과 재앙이 그것들에게 닥치면, 제사장들은 그것들과 함께 어디에 숨을지를 서로 의논합니다.[a]
  rationale: ‘찾습니다’를 ‘서로 의논합니다’로 바꾸어 βουλεύονται πρὸς ἑαυτούς와 ποῦ 이하의 내용절 관계를 직접 반영했습니다. ‘그것들에게’는 ἐπʼ αὐτά의 영향을 자연스러운 한국어로 표현하며, 본문의 대명사와 각주 표지는 유지했습니다.
  reviewer_model: gpt-5.6-terra
