  - marker: a
    text: That is, the idols or images mentioned throughout the surrounding passage.
    reason: cross_reference
translation:
  language: ko
  text: 전쟁과 재앙이 그것들 위에 닥치면, 제사장들은 서로 의논하여 어디에 그것들과 함께 숨을지 찾습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉, 앞뒤 문맥에서 언급된 우상이나 형상들을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: ὅταν ... ἐπέλθῃ
  english_pob_choice: when ... come upon
  chosen_korean: …이 그것들 위에 닥치면
  alternatives_korean:
  - …이 그것들 위에 오면
  - …이 그것들 위에 임하면
  lexicon: BDAG
  rationale: Ἐπέλθῃ의 ‘upon’ 방향성을 살리기 위해 ‘위에 닥치면’으로 옮겨, 단순한 도착보다 위협적으로 덮쳐 오는 뉘앙스를 살렸습니다.
- source_word: κακά
  english_pob_choice: calamities / disasters
  chosen_korean: 재앙
  alternatives_korean:
  - 환난
  - 재난
  - 불행
  lexicon: BDAG
  rationale: 여기서 κακά는 도덕적 ‘악’이 아니라 침략과 함께 닥치는 해로운 사건들이므로, 현대 한국어에서 구체적이고 무게감 있는 ‘재앙’을 택했습니다.
- source_word: βουλεύονται πρὸς ἑαυτούς
  english_pob_choice: consult among themselves
  chosen_korean: 서로 의논하여
  alternatives_korean:
  - 서로 상의하여
  - 서로 협의하여
  - 함께 상의하여
  lexicon: BDAG
  rationale: 중간태와 πρὸς ἑαυτούς가 나타내는 상호적 논의를 한국어의 자연스러운 군상 표현인 ‘서로 의논하여’로 옮겼습니다.
- source_word: συγκαρυβῶσι μετʼ αὐτῶν
  english_pob_choice: hide themselves with them
  chosen_korean: 어디에 그것들과 함께 숨을지 찾습니다
  alternatives_korean:
  - 그것들과 함께 숨을 곳을 찾습니다
  - 그것들과 함께 몸을 숨길 곳을 찾습니다
  lexicon: LSJ
  rationale: 희귀 동사의 ‘함께 숨다/숨기다’라는 결합 의미를 살리면서, 한국어에서는 목적절 형태로 풀어 ‘어디에 … 숨을지 찾습니다’가 오해 없이 읽히도록 했습니다.
theological_decisions:
- issue: 대명사 αὐτὰ / αὐτῶν의 지시 대상
  chosen_reading: 주변 문맥의 우상·형상들을 가리키는 것으로 이해하되, 본문에는 ‘그것들’로 유지했습니다.
  alternative_readings:
  - 본문에 ‘우상들’을 직접 넣는 방식
  - 지시 대상을 드러내지 않고 단순히 ‘그것들’만 두는 방식
  rationale: 문맥상 지시 대상은 분명하지만, 그 해석을 본문 속에 선취적으로 삽입하기보다 대명사를 보존하고 주석적 처리를 따르는 편이 원문과 POB의 감수성에 맞습니다.
  doctrine_reference: 원문 우선과 주석적 명시의 균형
