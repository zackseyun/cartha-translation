  text: They even give some of their things to the prostitutes on the roof[b][a]. And they adorn them with clothing like human beings—silver gods and gold gods and wooden ones.
  footnotes:
  - marker: a
    text: Or, more literally, 'from them'; the pronoun likely refers to items associated with the idols in the surrounding context.
    reason: lexical_alternative
  - marker: b
    text: Some interpreters understand 'the prostitutes on the roof' as cult-associated prostitutes, but the Greek does not explicitly say 'temple prostitutes.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 심지어 이것들 중 일부를 지붕 위의 창녀들에게도 줍니다[b][a]. 그리고 사람처럼 옷으로 그것들을 치장합니다. 은으로 만든 신들, 금으로 만든 신들, 나무로 만든 것들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 문자적으로는 ‘그것들로부터’입니다. 대명사는 앞 문맥의 우상 관련 물건을 가리키는 것으로 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: 일부 해석자들은 ‘지붕 위의 창녀들’을 제의적 창녀로 이해하지만, 그리스어는 ‘성전 창녀들’이라고 분명히 말하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: δώσουσιν δὲ ἀπʼ αὐτῶν
  english_pob_choice: They even give some of their things
  chosen_korean: 그들은 심지어 이것들 중 일부를 줍니다
  alternatives_korean:
  - 그들은 심지어 그것들 가운데 일부를 줍니다
  - 그들은 심지어 그것들의 일부를 줍니다
  - 그들은 심지어 그것들에서 나온 일부를 줍니다
  lexicon: LSJ
  rationale: δώσουσιν은 미래형이지만 관용적으로 현재로 옮길 수 있고, ἀπʼ αὐτῶν은 직역하면 ‘그것들로부터/그것들 중에서’의 뜻이므로 문맥상 지시 대상인 우상 관련 물건을 가리키는 자연스러운 한국어로 처리했습니다.
- source_word: ταῖς ἐπὶ τοῦ στέγους πόρναις
  english_pob_choice: the prostitutes on the roof
  chosen_korean: 지붕 위의 창녀들에게도
  alternatives_korean:
  - 지붕 위의 매춘부들에게도
  - 옥상에 있는 창녀들에게도
  - 지붕 위의 창녀들에게도
  lexicon: LSJ
  rationale: πόρναι는 명시적으로 ‘창녀/매춘부’이며, ἐπὶ τοῦ στέγους는 ‘지붕 위’입니다. Greek이 ‘성전 창녀’라고 말하지 않으므로 그 종교적 뉘앙스는 본문에 없는 것으로 두었습니다.
- source_word: κοσμοῦσί τε αὐτοὺς ὡς ἀνθρώπους τοῖς ἐνδύμασιν
  english_pob_choice: And they adorn them with clothing like human beings
  chosen_korean: 그리고 사람처럼 옷으로 그것들을 치장합니다
  alternatives_korean:
  - 그리고 사람처럼 옷으로 그것들을 꾸밉니다
  - 그리고 사람같이 옷을 입혀 장식합니다
  - 그리고 사람처럼 의복으로 그것들을 단장합니다
  lexicon: LSJ
  rationale: κοσμέω는 ‘장식하다, 치장하다’의 뜻이므로 ‘치장합니다’가 문맥의 조롱 섞인 풍자를 살립니다. τοῖς ἐνδύμασιν은 수단/방법의 여격으로 ‘옷으로’가 가장 간결합니다.
- source_word: θεοὺς ἀργυροῦς καὶ θεοὺς χρυσοῦς καὶ ξυλίνους
  english_pob_choice: silver gods and gold gods and wooden ones
  chosen_korean: 은으로 만든 신들, 금으로 만든 신들, 나무로 만든 것들입니다
  alternatives_korean:
  - 은 신들, 금 신들, 나무로 된 것들입니다
  - 은으로 된 신들, 금으로 된 신들, 나무로 된 것들입니다
  - 은과 금과 나무로 만든 신들입니다
  lexicon: LSJ
  rationale: 그리스어는 앞의 두 항목에서 θεούς를 반복하고 마지막은 생략하므로, 반복되는 우상 목록의 조롱적 리듬을 살리면서 한국어에서는 ‘만든 신들/것들’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: πόρναι를 종교적 관행으로 특정할지 여부
  chosen_reading: 본문은 단순히 ‘창녀들’이라고 말하며, cultic/temple prostitution은 암시될 수 있어도 명시되지는 않습니다.
  alternative_readings:
  - 성전 창녀들
  - 제의적 매춘부들
  rationale: 원문이 제공하지 않은 종교적 구체화를 본문에 넣지 않기 위해, 가장 직접적인 의미를 유지했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy and restraint from importing unstated cultic specificity.'
