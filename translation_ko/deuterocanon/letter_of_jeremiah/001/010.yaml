    rationale: 그리스어의 명사구는 κοσμοῦσιν의 목적어(αὐτούς)를 풀어 주는 동격적 열거입니다. 한국어에서는 목적어로 직접 배치해야 문법 관계와 뜻이 분명합니다.
  - severity: low
