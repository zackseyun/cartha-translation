  verdict: revise
  source_fidelity: δώσουσιν은 미래형이므로 ‘줄 것입니다’로 옮겼습니다. 이어지는 κοσμοῦσιν은 현재형으로 유지했습니다. ἀπʼ αὐτῶν의 지시 대상은 본절만으로 완전히 특정되지 않으므로, 문맥상 물건을 가리키는 자연스러운 표현을 쓰되 각주에서 직역과 불확실성을 보존했습니다. 마지막 열거는 동사의 목적어인 은·금·나무 신들을 분명히 드러냈습니다.
  naturalness: 기존의 ‘이것들 중 일부’와 ‘그것들을 치장합니다’는 지시 대상이 다소 불분명하고, 뒤의 명사 열거가 독립 문장처럼 끊어집니다. 수정문은 한국어 어순에 맞추어 목적어를 동사 앞에 두고, ‘사람에게 하듯 옷으로 꾸밉니다’로 자연스럽게 연결했습니다.
  terminology: πόρναι는 본문에서 종교적 직무를 명시하지 않으므로 ‘창녀들’로 유지했습니다. θεούς는 ‘신들’로, ξυλίνους에 생략된 명사도 한국어에서 ‘나무 신들’로 보충하여 지시 대상을 명료하게 했습니다.
  issues:
