  text: They are made by carpenters and goldsmiths; they can become nothing other than what the craftsmen want them to become.
translation:
  language: ko
  text: 그것들은 목수들과 금세공인들에 의해 만들어진 것들입니다. 그것들은 장인들이 그것들이 되기를 바라는 것 외에는 다른 아무것도 될 수 없습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπὸ τεκτόνων καὶ χρυσοχόων
  english_pob_choice: by carpenters and goldsmiths
  chosen_korean: 목수들과 금세공인들이
  alternatives_korean:
  - 장인들이
  - 목수들과 금장인들이
  lexicon: BDAG
  rationale: Ὑπὸ는 행위 주체를 나타내며, τεκτόνων과 χρυσοχόων은 각각 목수와 금세공인을 가리키므로 구체적 제작자들을 살려 번역했습니다.
- source_word: κατεσκευασμένα εἰσίν
  english_pob_choice: are made
  chosen_korean: 만들어 낸 것입니다
  alternatives_korean:
  - 제작된 것입니다
  - 지어진 것입니다
  lexicon: BDAG
  rationale: 우상들이 인간의 손으로 제작된 상태임을 드러내는 수동 의미를 살리면서, 현대 한국어에서 자연스럽고 분명하게 옮겼습니다.
- source_word: οὐθὲν ἄλλο μὴ γένηται ἢ
  english_pob_choice: nothing other than
  chosen_korean: 아무것도 될 수 없습니다
  alternatives_korean:
  - 다른 아무것도 될 수 없습니다
  - 오직 ...일 뿐입니다
  lexicon: BDAG
  rationale: 부정과 제한을 통해 ‘그 이상 될 수 없음’이라는 제약을 나타내므로, 가능한 범위를 봉쇄하는 표현으로 옮겼습니다.
- source_word: βούλονται οἱ τεχνῖται αὐτὰ γενέσθαι
  english_pob_choice: what the craftsmen want them to become
  chosen_korean: 장인들이 그것들을 그렇게 되게 하고자 하는 것
  alternatives_korean:
  - 장인들이 그것들이 되기를 원하는 것
  - 장인들이 그것들이 되게 하려는 것
  lexicon: BDAG
  rationale: βούλονται는 의지/원함을, γενέσθαι는 ‘되다’를 뜻하므로, 장인의 의도와 결과 상태를 함께 드러내는 방식으로 번역했습니다.
theological_decisions:
- issue: 우상의 존재 방식과 능력 부재
  chosen_reading: 이 절은 우상이 인간 제작물이며 제작자의 의지 밖에서는 아무것도 될 수 없음을 강조합니다.
  alternative_readings:
  - 단순히 ‘사람이 만든 것’이라는 기원만 드러내는 읽기
  rationale: 두 절이 인간 제작과 전적 의존성을 나란히 말하므로, 우상의 무능과 종속성을 함께 살려 반우상 논지를 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
