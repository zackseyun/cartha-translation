lexical_decisions:
- source_word: αὐτοί τε
  english_pob_choice: those ... and
  chosen_korean: 그리고 그것들을 만든 자들도
  alternatives_korean:
  - 그들 자신도
  - 그 자들 또한
  lexicon: BDAG
  rationale: 대명사 αὐτοί의 주어 강조와 연결 입자 τε의 접속 기능을 살려, 앞 문맥의 우상 제작자들을 자연스럽게 가리키는 ‘만든 자들’에 ‘도’를 더해 연속성을 표시했습니다.
- source_word: οἱ κατασκευάσαντες αὐτὰ
  english_pob_choice: those who made them
  chosen_korean: 그것들을 만든 자들
  alternatives_korean:
  - 그것들을 제작한 자들
  - 그것들을 만든 사람들
  lexicon: BDAG
  rationale: 우상들을 빚어 만든 장인들을 가리키므로, ‘제작한’보다 직접적이고 일반적인 ‘만든’이 문맥에 가장 알맞습니다.
- source_word: οὐ μὴ γένωνται
  english_pob_choice: will by no means live
  chosen_korean: 결코 ... 못할 것입니다
  alternatives_korean:
  - 결코 ... 되지 않을 것입니다
  - 전혀 ... 살지 못할 것입니다
  lexicon: BDAG
  rationale: οὐ μή의 강한 부정을 한국어에서는 ‘결코 ... 못하다’로 옮겨, 단순한 미래 부정이 아니라 강한 단절과 불가피한 부정을 드러냈습니다.
- source_word: πολυχρόνιοι
  english_pob_choice: live long
  chosen_korean: 오래 살지
  alternatives_korean:
  - 장수하지
  - 오래 지속되지
  lexicon: LSJ
  rationale: 형용사 ‘오래 사는, 장수하는’의 의미를 한국어에서는 자연스러운 동사구 ‘오래 살지’로 옮겨, 영어 POB의 의미를 유지하면서도 문장을 매끄럽게 했습니다.
theological_decisions:
- issue: 강한 부정 οὐ μή의 강조
  chosen_reading: ‘결코 ... 못할 것입니다’로 강한 확정적 부정을 유지했습니다.
  alternative_readings:
  - ‘오래 살지 못할 것입니다’로만 번역해 부정의 강도를 약화하는 읽기
  - ‘반드시 오래 살지 못할 것입니다’처럼 과잉 강조하는 읽기
  rationale: 본문은 단순한 가능성 부정이 아니라 강한 확언 형태이므로, 한국어에서도 그 단호함이 보존되어야 합니다.
  doctrine_reference: 본문의 예언적 경고와 심판 선언의 수사
- issue: 대상 지시어 αὐτά의 회수
  chosen_reading: 문맥상의 우상들을 가리키는 대명사로 보아 ‘그것들’로 옮겼습니다.
  alternative_readings:
  - ‘이것들’로 가까운 지시로 옮기는 읽기
  - ‘그 우상들’처럼 명시적으로 명사 반복하는 읽기
  rationale: 헬라어 대명사는 바로 앞의 우상들을 되받으므로, 과도한 명사 반복 없이 한국어 대명사로 연결하는 것이 원문 구조를 더 잘 보존합니다.
  doctrine_reference: 문맥상 우상 비판의 연속성
