  rationale: 대명사의 강조를 유지하기 위해 단순한 ‘그들은’보다 ‘스스로는’을 택했습니다.
- source_word: νοήσαντες
  english_pob_choice: though they understand
  chosen_korean: 비록 이해하더라도
  alternatives_korean:
  - 이해한 뒤에
