  rationale: 문맥의 풍자를 훼손하지 않으면서, 분사와 명사의 대비를 한국어에서 자연스럽게 드러내는 것이 핵심입니다.
  doctrine_reference: 'DOCTRINE.md: source-direct rendering; preserve rhetorical force and tension'
