  text: And they themselves cannot[a], even though they perceive it, leave them behind, for they have no perception.
  footnotes:
  - marker: a
    text: Or 'having understood, they cannot leave them'; the Greek participle νοήσαντες may be taken more literally, though the sense in context is likely concessive.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 스스로는, 비록 이해하더라도, 그것들을 버려 두고 떠날 수 없습니다. 왜냐하면 그들에게는 지각이 없기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이해한 뒤에도 그들을 버려 두고 떠날 수 없습니다’로 옮길 수 있습니다. Greek 분사 νοήσαντες는 문맥상 양보적으로 읽는 것이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
