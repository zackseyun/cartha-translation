theological_decisions:
- issue: 우상 비판의 논리와 문장 내 대비
  chosen_reading: 이 절은 우상이 스스로 움직이거나 떠날 능력도 없고, 감각적 지각도 없다는 비판을 이어갑니다.
  alternative_readings:
  - ‘이해하더라도’보다 더 직역적으로 ‘이해한 후에도’로 읽을 수 있습니다.
  - ‘지각’ 대신 ‘감각’으로 옮겨 물리적 무감각을 더 강조할 수 있습니다.
  rationale: 문맥의 풍자를 훼손하지 않으면서, 분사와 명사의 대비를 한국어에서 자연스럽게 드러내는 것이 핵심입니다.
