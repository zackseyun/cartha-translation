translation:
  language: ko
  text: 또한 그들 자신은, 비록 이해한다 해도, 그것들을 뒤에 남겨 둘 수 없습니다. 그들에게 지각이 없기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이해한 뒤에 그것들을 뒤에 남겨 둘 수 없습니다’로 옮길 수 있습니다. 그리스어 분사 νοήσαντες는 문맥상 양보적으로 읽는 것이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ δύνανται
  english_pob_choice: cannot
  chosen_korean: 스스로는 … 할 수 없습니다
  alternatives_korean:
  - 할 수 없습니다
  - 능히 … 못합니다
  lexicon: BDAG
  rationale: δύναμαι의 불가능을 자연스러운 합쇼체로 옮기되, αὐτοὶ의 강조를 살려 ‘스스로는’으로 표현했습니다.
- source_word: αὐτοὶ
  english_pob_choice: they themselves
