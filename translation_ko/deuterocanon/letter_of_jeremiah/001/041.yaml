  - 인식
  - 의식
  lexicon: BDAG
  rationale: αἴσθησις는 감각적 인지와 지각을 아우르므로, 우상 비판의 맥락에서 ‘지각’이 가장 간결하고 포괄적입니다.
theological_decisions:
- issue: 우상 비판의 논리와 문장 내 대비
  chosen_reading: 이 절은 우상이 스스로 움직이거나 떠날 능력도 없고, 감각적 지각도 없다는 비판을 이어갑니다.
  alternative_readings:
  - ‘이해하더라도’보다 더 직역적으로 ‘이해한 후에도’로 읽을 수 있습니다.
