  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/066.yaml
  text: They will certainly not show signs in the heavens among the nations[a], nor will they shine like the sun, nor give light like the moon.
  footnotes:
  - marker: a
    text: Or 'in the sky.' The Greek οὐρανός can refer either to heaven or to the sky; the context is celestial phenomena.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 하늘에서 민족들 가운데 표징을 결코 보이지 못할 것이며, 해처럼 빛나지도 못하고 달처럼 빛을 내지도 못할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ‘우라노스’는 ‘하늘’ 또는 ‘공중’을 뜻할 수 있습니다. 여기서는 천체 현상과 관련된 문맥입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖά
  english_pob_choice: signs
  chosen_korean: 표징
  alternatives_korean:
  - 징조
  - 표적
  lexicon: LSJ
  rationale: celestial 현상을 가리키는 σημεῖον의 넓은 뜻을 살리면서도, 단순한 ‘신호’보다 더 성경적인 가시 표지를 드러내는 말로 옮겼습니다.
- source_word: ἐν ἔθνεσιν
  english_pob_choice: among the nations
  chosen_korean: 이방 민족들 가운데
  alternatives_korean:
  - 민족들 가운데
  - 나라들 가운데
  lexicon: LSJ
  rationale: ἔθνη의 기본 의미인 민족/나라를 따르되, 이 문맥의 우상 비판적 뉘앙스를 반영할 수 있어 ‘이방 민족들 가운데’로 옮겼습니다.
- source_word: ἐν οὐρανῷ
  english_pob_choice: in heaven
  chosen_korean: 하늘에서
  alternatives_korean:
  - 하늘 안에서
  - 하늘 가운데
  lexicon: LSJ
  rationale: οὐρανός는 하늘/천상 모두를 가리킬 수 있으므로, 문맥상 천체 현상을 말하는 자연스러운 한국어인 ‘하늘에서’를 선택했습니다.
- source_word: οὐ μὴ δείξωσιν
  english_pob_choice: will certainly not show
  chosen_korean: 결코 보이지 못할 것이며
  alternatives_korean:
  - 절대로 보여 주지 못할 것이며
  - 결코 나타내지 못할 것이며
  lexicon: LSJ
  rationale: οὐ μή + 접속법의 강한 부정을 한국어의 ‘결코 … 못하다’로 살렸고, 표징이 ‘보여지는’ 맥락을 반영했습니다.
theological_decisions:
- issue: 생략된 주어의 보충
  chosen_reading: 문맥상 우상들을 가리키는 복수 주어를 ‘그들’로 최소한만 보충했습니다.
  alternative_readings:
  - ‘그것들은’
  - 주어를 드러내지 않는 무주어 번역
  rationale: 그리스어 원문은 앞 문맥의 대상을 이어받는 복수 동사만 제시하므로, 한국어 문장 성립에 필요한 만큼만 보충해 원문의 논지를 유지했습니다.
  doctrine_reference: 문맥 계승을 존중하고, 본문이 말하는 우상 비판의 범위를 넘겨 확장하지 않음
