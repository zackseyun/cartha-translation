  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/062.yaml
  text: And the fire sent from above[a], to consume mountains and forests, does what it was appointed to do[b]; but these are not comparable to it either in appearance or in power.
  footnotes:
  - marker: a
    text: Or 'does what was commanded/ordered.' The Greek expression can denote what has been arranged, appointed, or commanded.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'are not made like it' or 'are not likened to it' in either appearance or power.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 위로부터 보내진 불은 산들과 숲들을 태워 없애도록 정해진 일을 해내지만, 이들은 그 모습에서도 그 능력에서도 그것과 비슷하지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘명령받은 일을 한다’는 뜻일 수 있습니다. 그리스어 표현은 ‘정해진, 배정된, 명령된’ 것까지 폭넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그것과 같은 모습으로 만들어지지 않았다’ 또는 ‘그것과 비교되지 않는다’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαποσταλὲν ἄνωθεν
  english_pob_choice: sent from above
  chosen_korean: 위로부터 보내진
  alternatives_korean:
  - 위로부터 파견된
  - 위에서 보내진
  lexicon: LSJ
  rationale: ἄνωθεν은 단순히 ‘위에서’라는 방향만이 아니라 위로부터의 기원을 시사하므로, ‘위로부터’로 살리되 원문이 명시하지 않은 ‘하늘’이나 ‘하나님’을 덧붙이지 않았습니다.
- source_word: ἐξαναλῶσαι
  english_pob_choice: to consume
  chosen_korean: 태워 없애도록
  alternatives_korean:
  - 소멸시키도록
  - 삼켜 없애도록
  lexicon: LSJ
  rationale: 불의 목적을 나타내는 부정사로서, 실제 문맥에서의 소모·파괴를 자연스럽게 드러내기 위해 ‘태워 없애도록’으로 옮겼습니다.
- source_word: ποιεῖ τὸ συνταχθέν
  english_pob_choice: does what it was appointed to do
  chosen_korean: 정해진 일을 해내지만
  alternatives_korean:
  - 명령받은 일을 하지만
  - 정해진 것을 행하지만
  lexicon: LSJ
  rationale: τὸ συνταχθέν은 ‘배정된/정해진 것’으로 폭넓게 읽힐 수 있어, ‘명령’으로 좁히지 않고 ‘정해진 일’로 번역해 원문의 유연성을 보존했습니다.
- source_word: οὔτε ταῖς ἰδέαις οὔτε ταῖς δυνάμεσιν
  english_pob_choice: either in appearance or in power
  chosen_korean: 그 모습에서도 그 능력에서도
  alternatives_korean:
  - 그 겉모습에서도 그 힘에서도
  - 외형에서도 능력에서도
  lexicon: LSJ
  rationale: ἰδέα는 눈에 보이는 형상/겉모습을, δύναμις는 유효한 힘·능력을 가리키므로, 병렬성을 살려 ‘모습’과 ‘능력’으로 대응시켰습니다.
- source_word: ἀφωμοιωμένα ἐστίν
  english_pob_choice: are not comparable
  chosen_korean: 비슷하지 않습니다
  alternatives_korean:
  - 비교될 수 없습니다
  - 같아질 수 없습니다
  lexicon: LSJ
  rationale: 완료 수동의 비교 불가 상태를 한국어로 간결하게 드러내기 위해 ‘비슷하지 않습니다’를 선택했습니다. 직역형보다 문장 흐름이 자연스럽습니다.
theological_decisions:
- issue: ‘위로부터’의 출처를 어디까지 명시할지
  chosen_reading: 불의 기원을 ‘위로부터’로만 두고, 하나님/하늘을 본문에 명시하지 않았습니다.
  alternative_readings:
  - 하늘로부터 보내진
  - 하나님께로부터 보내진
  rationale: 원문은 ἄνωθεν으로 상향 기원을 암시하지만, 이 절 자체는 그 출처를 더 구체적으로 밝히지 않습니다. 따라서 암시를 보존하되 과잉 명시는 피했습니다.
  doctrine_reference: Translation philosophy §1, §3
