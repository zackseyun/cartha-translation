  text: In his right hand he holds a dagger and an axe[a], but he cannot rescue himself from war and robbers. Therefore it is evident that they are not gods[b]; so do not fear them.
  footnotes:
  - marker: a
    text: Or 'short sword' for 'dagger.' The Greek ἐγχειρίδιον denotes a hand-weapon.
