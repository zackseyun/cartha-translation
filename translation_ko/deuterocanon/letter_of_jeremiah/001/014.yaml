    reason: lexical_alternative
translation:
  language: ko
  text: 그의 오른손에는 단검[a]과 도끼가 있지만, 전쟁과 강도들[b]로부터 자기 자신을 구해 내지 못합니다. 그러므로 그들이 신들이 아님이 분명합니다. 그러니 그들을 두려워하지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘단검’은 ἐγχειρίδιον의 자연스러운 현대어 대응입니다. 이 단어는 손에 들고 쓰는 무기를 가리켜, ‘짧은 칼’ 정도로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘강도들’은 λῃστῶν의 위협적 뉘앙스를 살린 번역입니다. 문맥에 따라 ‘산적들’ 또는 ‘도적들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγχειρίδιον
  english_pob_choice: dagger
  chosen_korean: 단검
  alternatives_korean:
  - 짧은 칼
  - 손칼
  lexicon: LSJ
  rationale: ἐγχειρίδιον은 손에 들고 쓰는 무기를 가리키므로, 현대 한국어에서는 ‘단검’이 가장 자연스럽고 ‘도끼’와도 병렬이 잘 맞습니다.
- source_word: δεξιᾷ
  english_pob_choice: in his right hand
  chosen_korean: 오른손에는
  alternatives_korean:
  - 오른손에
  - 오른손으로
  lexicon: LSJ
  rationale: ἔχει와 결합한 위치/도구적 의미를 한국어 관용에 맞게 ‘오른손에는’으로 옮기면 소유와 위치가 자연스럽게 드러납니다.
- source_word: ἐξελεῖται
  english_pob_choice: rescue himself
  chosen_korean: 자기 자신을 구해 내지 못합니다
  alternatives_korean:
  - 스스로를 구하지 못합니다
  - 자기 자신을 건져 내지 못합니다
  lexicon: LSJ
  rationale: 중간태의 자기 구출 의미를 살리면서, ‘구해 내지 못합니다’가 전쟁과 강도라는 위협 상황에 가장 직접적입니다.
- source_word: λῃστῶν
  english_pob_choice: robbers
  chosen_korean: 강도들
  alternatives_korean:
  - 도둑들
  - 산적들
  lexicon: LSJ
  rationale: λῃστῶν은 단순 절도범보다 폭력적 위협을 내포하므로, 한국어에서는 문맥상 ‘강도들’이 더 정확합니다.
- source_word: γνῶριμοί εἰσιν οὐκ ὄντες θεοί
  english_pob_choice: it is evident ... they are not gods
  chosen_korean: 그들이 신들이 아님이 분명하니
  alternatives_korean:
  - 그들이 신이 아님이 드러나니
  - 그들이 신이 아니라는 것이 알려져 있으니
  lexicon: LSJ
  rationale: 직역의 ‘알려져 있다’보다, 이 문맥에서는 우상의 무력함에서 도출되는 결론을 ‘분명하니’로 옮겨 논증 흐름을 분명히 했습니다.
theological_decisions:
- issue: 단수 우상 묘사와 복수 결론의 전환
  chosen_reading: 앞 절반은 단수형으로 ‘그의 오른손’, ‘자기 자신’을 유지하고, 결론은 복수형 ‘그들이 신들이 아님’으로 살렸습니다.
