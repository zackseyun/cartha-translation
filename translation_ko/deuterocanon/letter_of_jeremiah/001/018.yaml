  text: They light lamps for them, more than for themselves, though they cannot see a single one of them.
translation:
  language: ko
  text: 그들은 자기들을 위해서보다 더 많은 수의 등불을 켜지만, 그들 가운데 어느 하나도 볼 수 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들 자신에게보다 더 많은’입니다. 한국어에서는 수량 대비를 분명히 하기 위해 이렇게 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνους
  english_pob_choice: lamps
  chosen_korean: 등불
  alternatives_korean:
  - 램프
  - 등
  lexicon: LSJ
  rationale: λύχνος는 빛 자체보다 기름등 같은 구체적 등잔을 가리키므로, 한국어에서도 사물성을 살리는 ‘등불’이 가장 자연스럽습니다.
- source_word: καίουσιν
  english_pob_choice: they light
  chosen_korean: 켜지만
  alternatives_korean:
  - 태우지만
  - 점화하지만
  lexicon: LSJ
  rationale: 문맥상 등불에 불을 붙이는 행위이므로 ‘켜다’가 가장 간명하고 현대 한국어에 자연스럽습니다.
- source_word: πλείους ἢ ἑαυτοῖς
  english_pob_choice: more than for themselves
  chosen_korean: 자기들을 위해서보다 더 많은 수의
  alternatives_korean:
  - 자기들보다 더 많은
  - 자기들에게보다 더 많은
  lexicon: LSJ
  rationale: 그리스어의 비교 표현을 수량 대비로 살려, 우상에게 바치는 등불이 자기 자신을 위해 쓰는 것보다 많다는 대비를 유지했습니다.
- source_word: οὐδένα δύνανται ἰδεῖν
  english_pob_choice: they cannot see a single one of them
  chosen_korean: 그들 가운데 어느 하나도 볼 수 없습니다
  alternatives_korean:
  - 한 개도 볼 수 없습니다
  - 아무것도 볼 수 없습니다
  lexicon: LSJ
  rationale: οὐδένα의 완전한 부정을 살리면서, 지시 대상인 등불을 한국어에서 자연스럽게 받도록 ‘그들 가운데 어느 하나도’로 옮겼습니다.
theological_decisions:
- issue: 보이지 못하는 주체의 지시 대상
  chosen_reading: 우상들이 등불을 보지 못하는 것으로 읽었습니다.
  alternative_readings:
  - 예배자들이 등불을 보지 못한다는 뜻으로도 읽을 수 있습니다.
  rationale: 문맥 전체가 우상의 무감각함을 조롱하므로, 가장 가까운 지시 대상은 우상들입니다. 본문이 허용하는 풍자를 살리기 위해 그 해석을 본문에 반영했습니다.
  doctrine_reference: 문맥 우선 해석; 우상 풍자 본문의 수사 유지
