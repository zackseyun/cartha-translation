lexical_decisions:
- source_word: Τίνι οὖν
  english_pob_choice: To whom, then
  chosen_korean: 그렇다면 누가
  alternatives_korean:
  - 그렇다면 누구에게
  - 그렇다면 누구
  lexicon: LSJ
  rationale: 그리스어의 여격 의문구는 영어 POB의 'To whom'처럼 직역 가능하지만, 한국어에서는 자연스럽게 ‘누가/누구에게’로 풀어야 하므로 문장 기능을 살려 의문 주체를 앞세웠습니다.
- source_word: γνωστὸν ἐστὶν
  english_pob_choice: is it known
  chosen_korean: 알 수 있겠습니까
  alternatives_korean:
  - 알려져 있습니까
  - 알고 있습니까
  lexicon: LSJ
  rationale: 비인칭 표현의 인지 가능성을 나타내므로, 단순 사실 진술보다 ‘알 수 있다’가 원문 힘을 더 잘 살립니다.
- source_word: οὐκ εἰσὶν θεοί
  english_pob_choice: they are not gods
  chosen_korean: 그것들이 신들이 아님
  alternatives_korean:
  - 그것들이 신이 아님
  - 그것들이 신이 아니라는 것
  lexicon: LSJ
  rationale: plural θεοί는 우상 논박 맥락에서 ‘신들’로 옮기되, 원문의 부정 보문 구조를 보존하기 위해 ‘아님’으로 연결했습니다.
theological_decisions:
- issue: 우상 논박의 직설성 유지
  chosen_reading: ‘신들이 아님’을 그대로 드러내어 우상에 대한 부정 선언을 약화시키지 않았습니다.
  alternative_readings:
  - ‘신이 아니다’로 완화하기
  - ‘신들이 아니다’로 평서문화하기
  rationale: 본문은 우상이 신이 아니라는 판정을 묻는 수사 질문이므로, 그 긴장과 공격성을 유지하는 쪽이 원문에 더 가깝습니다.
  doctrine_reference: 원문 우선, 우상 비판의 수사적 강도 보존
