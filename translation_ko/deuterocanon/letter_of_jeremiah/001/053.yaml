  verdict: revise
  source_fidelity: ‘불의한 자’는 불의를 행하는 사람을 뜻하므로, ῥύσωνται ἀδίκημα를 문맥상 ‘불의를 당한 이’를 구출한다는 영어 POB의 구체화와 정반대가 됩니다. 이를 바로잡아야 합니다. κρίσιν … ἑαυτῶν은 자신들과 관련된 법적 사안을 판결한다는 의미로 보고 ‘자기들의 송사’를 유지할 수 있습니다.
  naturalness: ‘자기들의 송사를 판결하지도 못하며, 불의를 당한 이를 구해 내지도 못합니다’는 현대 표준 한국어의 격식 있는 문체로 자연스럽습니다. ‘그들이’보다 문맥상의 우상을 직접 가리키는 ‘그들은’을 사용해 문장 연결을 매끄럽게 했습니다.
  terminology: κρίσις의 법적 뉘앙스는 ‘송사’, διακρίνω는 ‘판결하다’, ῥύομαι는 ‘구해 내다’로 반영했습니다. ἀδίκημα의 추상적 ‘불의/잘못’ 의미와 문맥상 피해자를 가리킬 수 있는 가능성은 각주에 보존했습니다. ‘무능하다’는 ἀδύνατοι의 행위 능력 부재를 정확하고 중립적으로 나타냅니다.
  issues:
