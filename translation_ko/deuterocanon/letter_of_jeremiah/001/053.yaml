  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/053.yaml
  text: They cannot judge their own case[a], nor can they rescue one who is wronged, because they are powerless;
  footnotes:
  - marker: a
    text: Or 'They cannot decide judgment for themselves, nor can they deliver from injustice.' The Greek is compact, and ἀδίκημα may be understood either as 'injustice/wrongdoing' or, by sense in context, the case or person affected by injustice.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 자기들의 송사를 판결하지도 못하며, 불의를 당한 이를 구해 내지도 못합니다. 그들이 무능하기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기들을 위한 판결을 내리지도 못하고, 불의에서 구해 내지도 못합니다.’ 그리스어 표현은 압축적입니다. ἀδίκημα는 ‘불의’ 또는 ‘잘못’을 뜻할 수도 있고, 문맥상 그 불의를 당한 이를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσίν
  english_pob_choice: case
  chosen_korean: 사건
  alternatives_korean:
  - 판결
  - 재판
  - 사안
  lexicon: BDAG
  rationale: κρίσις는 여기서 단순한 ‘심판’보다 분쟁이나 법적 사안의 맥락이 강하므로, ‘사건’으로 옮겨 문맥의 재판적 뉘앙스를 살렸습니다.
- source_word: διακρίνωσιν
  english_pob_choice: judge
  chosen_korean: 판단하지도 못하고
  alternatives_korean:
  - 가려내지도 못하고
  - 재판하지도 못하고
  - 결정하지도 못하고
  lexicon: BDAG
  rationale: κρίσις와 결합해 ‘판단하다/재정하다’의 의미가 되므로, 현대 한국어에서 자연스러운 ‘판단하다’로 옮겼습니다.
- source_word: ἀδίκημα
  english_pob_choice: one who is wronged
  chosen_korean: 불의한 자
  alternatives_korean:
  - 억울한 사람
  - 해를 입은 사람
  - 불의를 당한 자
  lexicon: BDAG
  rationale: 영어 POB가 문맥상 ‘불의/해침의 상황에 놓인 대상’을 구체화했으므로, 한국어에서는 그 대상을 압축해 ‘불의한 자’로 옮겼습니다. 다만 본문의 초점이 ‘구해내지 못함’에 있으므로 피해자 중심의 의미를 함께 염두에 둔 번역입니다.
- source_word: ἀδύνατοι ὄντες
  english_pob_choice: because they are powerless
  chosen_korean: 그들이 무력하기 때문입니다
  alternatives_korean:
  - 그들이 힘이 없기 때문입니다
  - 그들이 능력이 없기 때문입니다
  - 그들이 무능하기 때문입니다
  lexicon: BDAG
  rationale: 원인 분사구는 앞의 불가능함에 대한 이유를 제시하므로, ‘무력하다’로 인격적 행위 능력의 부재를 간명하게 드러냈습니다.
theological_decisions:
- issue: 우상들의 무능을 어떻게 표현할지
  chosen_reading: 이 절은 우상들의 실제적·사법적 무능을 진술하는 것으로 읽고, 본문이 직접 말하지 않는 형이상학적 논증은 덧붙이지 않았습니다.
  alternative_readings:
  - 우상들은 자기들에 관한 판결도 내리지 못하며, 불의를 당한 이도 구해내지 못합니다.
  rationale: 문맥 전체가 우상은 판단하거나 구원할 능력이 없음을 강조하므로, 본문의 압축된 표현을 한국어에서 분명하게 풀되 의미 범위를 넘지 않도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
