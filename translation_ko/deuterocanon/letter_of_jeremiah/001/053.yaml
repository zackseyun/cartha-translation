    rationale: 한국어에서 ‘불의한 자’는 unjust person, 곧 악행자라는 뜻입니다. 그러나 영어 POB의 선택 및 문맥상 구출의 대상은 ‘불의를 당한 이’(wronged person)입니다. 현 번역은 의미를 반전시킵니다.
  - severity: low
    issue: 각주의 ‘불의의 영향을 받는 대상’ 표현
    rationale: 의미는 전달되나 다소 추상적입니다. ‘불의를 당한 이’로 명시하면 본문 선택과 더 잘 연결되고 자연스럽습니다.
  revised_text: 그들은 자기들의 송사를 판결하지도 못하며, 불의를 당한 이를 구해 내지도 못합니다. 그들이 무능하기 때문입니다.[a]
