translation:
  language: ko
  text: 여러분이 하나님께 지은 죄 때문에, 여러분은 바빌로니아 사람들의 왕 느부갓네살에게 사로잡혀 포로가 되어 바빌론으로 끌려갈 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τὰς ἁμαρτίας ὑμῶν
  english_pob_choice: Because of your sins
  chosen_korean: 여러분이 지은 죄들 때문에
  alternatives_korean:
  - 여러분의 죄 때문에
  - 죄들 때문에
  lexicon: BDAG
  rationale: διά + 목적격은 원인/이유를 나타내므로, 현대 한국어에서는 ‘-때문에’가 가장 자연스럽고 원인의 강도를 잘 드러냅니다.
- source_word: ἃς ἡμαρτήκατε
  english_pob_choice: which you sinned
  chosen_korean: 곧 하나님 앞에서 죄를 지은 그 죄들 때문에
  alternatives_korean:
  - 곧 하나님 앞에서 범한 그 죄들 때문에
  - 하나님 앞에서 지은 죄들 때문에
  lexicon: BDAG
  rationale: 그리스어의 명사-동사 어근 반복을 살리기 위해 ‘죄들’과 ‘죄를 지은’의 반복 구조를 유지했습니다.
- source_word: ἐναντίον τοῦ θεοῦ
  english_pob_choice: against God
  chosen_korean: 하나님 앞에서
  alternatives_korean:
  - 하나님을 거슬러
  - 하나님께 대항하여
  lexicon: BDAG
  rationale: 직역의 ‘against’는 한국어에서 다소 거칠 수 있어, 문맥의 도덕적 책임을 드러내는 ‘하나님 앞에서’로 옮기되, 죄의 대적성은 앞뒤 반복 구조로 보완했습니다.
- source_word: ἀχθήσεσθε εἰς Βαβυλῶνα αἰχμάλωτοι
  english_pob_choice: you will be carried away captive to Babylon
  chosen_korean: 포로로 바빌론으로 끌려가게 될 것입니다
  alternatives_korean:
  - 포로로 바빌론에 끌려가게 될 것입니다
  - 바빌론으로 사로잡혀 끌려가게 될 것입니다
  lexicon: BDAG
  rationale: 미래 수동의 강제 이동 의미를 살려 ‘끌려가게 될 것입니다’로 옮기고, αἰχμάλωτοι는 상태를 나타내는 ‘포로로’로 자연스럽게 처리했습니다.
- source_word: ὑπὸ Ναβουχοδονοσὸρ βασιλέως τῶν Βαβυλωνίων
  english_pob_choice: by Nebuchadnezzar king of the Babylonians
  chosen_korean: 바빌론 왕 느부갓네살에게
  alternatives_korean:
  - 바빌론 사람들의 왕 느부갓네살에게
  - 바빌로니아 사람들의 왕 느부갓네살에게
  lexicon: BDAG
  rationale: ὑπό + 수동은 행위 주체를 나타내므로 ‘-에게’로 옮겼고, βασιλέως τῶν Βαβυλωνίων은 왕호를 한국어 관용에 맞게 ‘바빌론 왕’으로 압축했습니다.
theological_decisions:
- issue: 죄의 반복 표현(ἁμαρτίας … ἡμαρτήκατε) 보존
  chosen_reading: ‘여러분이 지은 죄들 때문에 … 죄를 지은 그 죄들 때문에’처럼 반복을 살렸습니다.
  alternative_readings:
  - ‘여러분의 죄 때문에’
  - ‘여러분이 범한 죄들 때문에’
  rationale: 본문의 수사적 중복은 책임과 유죄성을 강조하므로, 한국어에서도 의미를 매끈하게 지우기보다 반복을 유지하는 편이 원문에 더 충실합니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
