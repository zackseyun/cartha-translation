  text: For the gold with which they are adorned for beauty—unless someone wipes off the rust—it will certainly not shine; for not even when they were being cast did they perceive it.
translation:
  language: ko
  text: 그들이 아름다움을 위해 입히는 금은, 누군가 녹을 닦아 내지 않으면 결코 빛나지 못할 것입니다. 심지어 그것을 주조할 때조차 그들은 그것을 느끼지 못했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χρυσίον
  english_pob_choice: gold
  chosen_korean: 금
  alternatives_korean:
  - 황금
  - 금붙이
  lexicon: χρυσίον
  rationale: 일반적인 귀금속 금을 뜻하므로 간결하게 ‘금’으로 옮겼습니다.
- source_word: περιτίθενται εἰς κάλλος
  english_pob_choice: with which they are adorned for beauty
  chosen_korean: 아름다움을 위해 입히는
  alternatives_korean:
  - 아름다움을 위해 두르는
  - 아름다움을 위해 장식하는
  lexicon: περιτίθημι
  rationale: ‘둘러/입혀 장식하다’의 뜻을 살리되 한국어에서는 자연스럽게 ‘입히는’으로 처리했습니다.
- source_word: τὸν ἰόν
  english_pob_choice: the rust
  chosen_korean: 녹
  alternatives_korean:
  - 부식
  - 녹슨 때
  lexicon: ἰός
  rationale: POB의 ‘rust’에 맞추어 금속 표면의 부식 상태를 직설적으로 드러내는 ‘녹’을 택했습니다.
- source_word: στίλψωσιν
  english_pob_choice: shine
  chosen_korean: 빛나지 못할 것입니다
  alternatives_korean:
  - 광택이 나지 않을 것입니다
  - 반짝이지 않을 것입니다
  lexicon: στίλβω
  rationale: 금속의 광택이 드러나지 않는다는 뜻을 현대 문장으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 무생물 금속 비유의 직설성 유지
  chosen_reading: 우상 숭배의 허망함을 설명하는 비유를 완곡하게 바꾸지 않고, 금속이 녹 때문에 빛나지 못한다는 물리적 예시를 그대로 살렸습니다.
  alternative_readings:
  - 상징적으로 풀어 ‘겉모양만 번쩍이는 것’으로 의역
  rationale: 원문은 우상 재료의 실제 상태를 통해 무가치함을 논증하므로, 비유의 물질성을 유지하는 편이 문맥에 충실합니다.
  doctrine_reference: Jeremiah tradition / anti-idolatry satire
