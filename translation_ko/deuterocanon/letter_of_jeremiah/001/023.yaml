review_pass:
  verdict: revise
  source_fidelity: 첫 문장의 ‘금’은 우상을 아름답게 꾸미기 위해 그 위에 입히는 금을 가리킵니다. 현 번역의 ‘그들이 아름다움을 위해 입히는 금’은 누가 무엇에 입히는지 다소 불분명합니다. 또한 마지막 절의 수동형 ‘주조될 때’와 무감각의 주체는 우상들이며, 이를 명시하는 편이 원문의 반어를 충실히 드러냅니다.
  naturalness: ‘그 위에 입히는 금’ 및 ‘아무것도 알아차리지 못했습니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 문맥상 지시 대상도 분명합니다.
  terminology: χρυσίον은 ‘금’, ἰός는 문맥상 ‘녹’, στίλβω는 ‘빛나다’로 적절합니다. περιτίθενται는 우상 위에 금을 입혀 장식하는 행위를 나타내므로 ‘그 위에 입히는’으로 보완했습니다.
  issues:
  - severity: medium
    issue: 장식의 대상이 불분명함
    rationale: ‘그들이 아름다움을 위해 입히는 금’은 한국어에서 금을 입히는 대상이 드러나지 않습니다. 원문의 문맥상 우상들에게 입히는 금이므로 ‘그 우상들 위에 입히는 금’이 정확합니다.
  - severity: medium
    issue: 마지막 문장의 주체 및 수동 의미가 흐려짐
    rationale: ἐχωνεύοντο는 ‘그것들이 주조되고 있을 때’라는 수동형이며, ᾐσθάνοντο의 주체도 우상들입니다. ‘그들은 그것을 느끼지 못했습니다’는 주체와 목적어를 혼동시킵니다.
  revised_text: 아름답게 꾸미려고 그 우상들 위에 입히는 금도, 누군가 녹을 닦아 내지 않으면 결코 빛나지 못할 것입니다. 그 우상들은 주조될 때조차 아무것도 알아차리지 못했습니다.
