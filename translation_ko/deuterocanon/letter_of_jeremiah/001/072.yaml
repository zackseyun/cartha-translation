base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/072.yaml
  text: So a righteous man who has no idols is better[b][a], for he will be far from reproach.
  footnotes:
  - marker: a
    text: Or 'a righteous person.' The Greek has the masculine singular 'man,' used here in a representative sense.
    reason: lexical_alternative
  - marker: b
    text: '''Reproach'' may also be rendered ''disgrace'' or ''shame.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 우상들을 갖지 않은 의로운 사람이 더 낫습니다. 그는 책망에서 멀리 있을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '의로운 사람.' 그리스어는 남성 단수 '사람'을 쓰며, 여기서는 대표적 의미로 쓰였습니다.
    reason: lexical_alternative
  - marker: b
    text: '''책망''은 ''불명예''나 ''수치''로도 옮길 수 있습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρείσσον
  english_pob_choice: better
  chosen_korean: 더 낫습니다
  alternatives_korean:
  - 더 좋습니다
  - 더 뛰어납니다
  - 더 탁월합니다
  lexicon: LSJ
  rationale: 비교급의 판단을 자연스러운 현대 한국어로 살리되, 원문의 평가적 대비를 간결하게 전달합니다.
- source_word: ἄνθρωπος δίκαιος
  english_pob_choice: a righteous man
  chosen_korean: 의로운 사람
  alternatives_korean:
  - 의로운 남자
  - 의로운 자
  - 의로운 사람들
  lexicon: LSJ
  rationale: 그리스어는 남성 단수지만 여기서는 대표적 의미이므로 한국어에서는 성별을 불필요하게 부각하지 않고 자연스럽게 옮겼습니다.
- source_word: οὐκ ἔχων εἴδωλα
  english_pob_choice: who has no idols
  chosen_korean: 우상들을 갖지 않은
  alternatives_korean:
  - 우상들이 없는
  - 우상을 소유하지 않은
  - 우상에 얽매이지 않은
  lexicon: LSJ
  rationale: ἔχω의 소유 의미를 반영해 '갖다'로 옮기고, εἴδωλα를 복수로 유지해 우상 일반을 가리키는 점을 살렸습니다.
- source_word: ὀνειδισμοῦ
  english_pob_choice: reproach
  chosen_korean: 책망
  alternatives_korean:
  - 비난
  - 수치
  - 치욕
  lexicon: LSJ
  rationale: 문맥상 사회적 수치와 모욕을 포함하는 표현이지만, 한국어에서는 '책망'이 지나치게 강하지 않으면서도 원문의 부정적 평가를 전달합니다.
theological_decisions:
- issue: ἄνθρωπος δίκαιος의 대표적 남성 단수 처리
  chosen_reading: '''의로운 사람''으로 옮겨 대표성을 살리되 성별을 명시하지 않았습니다.'
  alternative_readings:
  - '''의로운 남자'''
  - '''의로운 자'''
  rationale: 영어 POB의 주석처럼 원문은 남성 단수이지만 대표적 의미로 쓰였으므로, 한국어 본문에서는 의미를 유지하면서도 현대 독자에게 자연스럽고 포괄적으로 읽히게 했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
