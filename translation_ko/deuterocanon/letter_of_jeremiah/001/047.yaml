  lexicon: BDAG
  rationale: 수사적 질문의 힘을 살리면서, μέλλει의 장차 가능성/지속 불가를 한국어의 ‘오래 견딜 수 있겠습니까’로 자연스럽게 옮겼습니다.
- source_word: τὰ ὑπʼ αὐτῶν κατασκευασθέντα
