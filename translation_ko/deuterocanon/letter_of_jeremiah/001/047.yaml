  text: How then can the things made by them endure? For they have left behind lies and disgrace for those who come after[a][b].
  footnotes:
  - marker: a
    text: Or 'the things made by them.' The Greek participle can denote things constructed or fashioned by human makers.
    reason: lexical_alternative
  - marker: b
    text: Or 'How then will the things made by them last?' The Greek wording is rhetorical and questions the lasting power of these man-made objects.
    reason: alternative_reading
translation:
  language: ko
  text: 그렇다면 그들이 만든 것들이 어떻게 오래 견딜 수 있겠습니까? 그들은 뒤에 오는 이들을 위해 거짓과 수치를 남겼습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 만든 것들’. 그리스어 분사는 사람의 손으로 지은 것 또는 만든 것을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 만든 것들이 어떻게 오래 버티겠습니까?’ 이 수사적 질문은 인간 제작물의 지속 불가능성을 강조합니다.
    reason: alternative_reading
lexical_decisions:
