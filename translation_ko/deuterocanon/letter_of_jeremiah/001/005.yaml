  text: When you see a crowd in front of them and behind them bowing down to them[a], say in your mind, ‘It is you whom one must worship, Master.’
  footnotes:
  - marker: a
    text: Or 'worshiping them' for 'bowing down to them'; the Greek verb προσκυνέω can denote both the bodily act of prostration and the religious act of worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것들 앞과 뒤에서 그것들에게 절하는[a] 무리를 보게 되면, 마음속으로 이렇게 말하십시오. ‘주인님, 오직 당신께 경배해야 합니다.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 προσκυνέω는 몸을 굽혀 절하는 동작을 가리킬 수도 있고, 종교적으로 경배하는 것을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντας ὄχλον
  english_pob_choice: When you see a crowd
  chosen_korean: 무리를 보게 되면
  alternatives_korean:
  - 군중을 보게 되면
  - 많은 무리를 보게 되면
  lexicon: BDAG
  rationale: ἰδόντας는 다음 명령과 결합된 시간적 분사이므로 한국어에서는 조건적·시간적 표현으로 풀어 자연스럽게 옮겼고, ὄχλον은 문맥상 특정한 집단보다 넓은 ‘무리’가 무난합니다.
- source_word: ἔμπροσθεν καὶ ὄπισθεν αὐτῶν
  english_pob_choice: in front of them and behind them
  chosen_korean: 앞에와 뒤에 서서
  alternatives_korean:
  - 그들 앞과 뒤에
  - 그들 앞뒤에
  lexicon: BDAG
  rationale: 우상들을 둘러선 공간적 장면을 살리기 위해 위치 관계를 유지했습니다. 한국어에서는 ‘앞에와 뒤에 서서’가 장면성을 가장 자연스럽게 드러냅니다.
- source_word: προσκυνοῦντας αὐτά
  english_pob_choice: bowing down to them
  chosen_korean: 그것들에게 절하는
  alternatives_korean:
  - 그것들을 향해 엎드리는
  - 그것들에게 경배하는
  lexicon: BDAG
  rationale: 여기서는 종교적 숭배보다 먼저 보이는 몸의 동작이 강조되므로 ‘절하다’로 옮기고, 대상을 중성 지시어 ‘그것들’로 유지해 우상들을 가리키는 비인격성을 살렸습니다.
- source_word: τῇ διανοίᾳ
  english_pob_choice: say in your mind
  chosen_korean: 마음속으로
  alternatives_korean:
  - 생각으로
  - 속으로
  lexicon: BDAG
  rationale: διανοία는 생각과 이해의 자리이므로 ‘마음속으로’가 한국어에서 내면적 발화를 가장 자연스럽게 전달합니다.
- source_word: Σοί δεῖ προσκυνεῖν, Δέσποτα
  english_pob_choice: It is you whom one must worship, Master.
  chosen_korean: ‘당신께만 마땅히 경배해야 합니다, 주인님.’
  alternatives_korean:
  - ‘오직 당신께 경배해야 합니다, 주인님.’
  - ‘당신께 경배해야만 합니다, 주인님.’
  lexicon: BDAG
  rationale: Σοί의 강조를 ‘당신께만’으로 살렸고, δεῖ의 필연성을 ‘마땅히’로 표현했습니다. Δέσποτα는 κύριος가 아니므로 전통적 ‘주님’보다 직접적인 호칭인 ‘주인님’을 택했습니다.
theological_decisions:
- issue: 우상 숭배 장면과 참된 경배의 대조
  chosen_reading: 외적 절함과 내적 경배를 구분하되, 참된 경배는 오직 하나님께만 돌아가야 한다는 대조를 분명히 했습니다.
  alternative_readings:
  - 둘 다 ‘경배’로 평행 처리
  - 둘 다 ‘절하다’로 평행 처리
  rationale: 원문은 우상에 대한 물리적 prostration과 하나님께 드려야 할 worship를 대비합니다. 한국어에서도 동작과 예배를 구분해 긴장을 유지하는 것이 소스에 충실합니다.
  doctrine_reference: 'DOCTRINE.md: source-language distinction between bodily prostration and religious worship'
- issue: Δέσποτα의 호칭
  chosen_reading: ‘주인님’으로 옮겨 Δέσποτα의 예외적 호칭을 보존했습니다.
  alternative_readings:
  - ‘주님’
  - ‘주권자’
  rationale: 이 구절은 κύριος가 아니라 Δέσποτα를 사용하므로, 일반적인 주님 호칭으로 평준화하지 않고 어휘 차이를 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: preserve source lexical distinctions over ecclesial habit'
