  text: 마치 오이밭에 지키는 이가 아무도 없는 것처럼, 그들의 신들은 나무로 만든 것이며 금과 은으로 입힌 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어의 전승이 난해한 부분으로, 뜻은 그 오이밭이 보호받거나 감시받지 못한 상태라는 데 있습니다.
