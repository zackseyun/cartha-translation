  text: For just as in a cucumber patch there is nothing guarding it[a], so their gods are wooden and overlaid with gold and silver.
  footnotes:
  - marker: a
    text: The Greek phrase rendered 'there is nothing guarding it' is textually and lexically difficult; the sense is that the cucumber patch is left unprotected or unwatched.
