  terminology: θεοί가 이 문맥에서 가리키는 물질적 숭배 대상을 ‘신상’으로 옮긴 것은 적절합니다. ὑφαιρούμενοι의 은밀하거나 부정한 뉘앙스는 본문에서 과도하게 확정하지 않고 각주로 제시하는 것이 타당합니다.
