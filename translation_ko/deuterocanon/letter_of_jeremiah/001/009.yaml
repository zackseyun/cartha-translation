  verdict: revise
  source_fidelity: 원문의 반복 상황을 나타내는 ἔστι δὲ καὶ ὅτε, 제사장들이 그들의 신상에서 금과 은을 빼내는 행위, 그리고 그것을 자신들을 위해 소비한다는 뜻을 전반적으로 잘 반영합니다. 다만 ‘그런데도’는 이 절 자체의 δέ보다 강한 양보·역접을 부가하며, ‘자기들만을 위해’의 ‘만’은 원문에 없는 배타성을 더합니다.
