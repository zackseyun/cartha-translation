lexical_decisions:
- source_word: ἔστι δὲ καὶ ὅτε
  english_pob_choice: And there are times when
  chosen_korean: 그런데도 때때로 … 일이 있습니다
  alternatives_korean:
  - 그리고 가끔 … 일이 있습니다
  - 또한 때로는 … 일이 있습니다
  lexicon: LSJ
  rationale: 반복되는 상황을 나타내므로 단발 사건보다 ‘때때로’가 자연스럽고, 앞의 문맥과 연결되는 대비를 ‘그런데도’로 살렸습니다.
- source_word: ὑφαιρούμενοι
  english_pob_choice: taking
  chosen_korean: 떼어 내어
  alternatives_korean:
  - 훔쳐
  - 몰래 빼앗아
  - 가져가
  lexicon: LSJ
  rationale: 원어는 ‘빼내다/떼어내다’의 뜻이 기본이어서, 문맥의 부정성을 과도하게 단정하는 ‘훔쳐’보다 원뜻을 보존하는 표현을 택했습니다.
- source_word: ἀπὸ τῶν θεῶν αὐτῶν
  english_pob_choice: from their gods
  chosen_korean: 자기들의 신상에서
  alternatives_korean:
  - 자기들의 신들로부터
  - 자기들의 우상에서
  lexicon: LSJ
  rationale: 이 문맥의 θεοί는 실제 신들이 아니라 우상들을 가리키므로, 한국어에서 의미를 바로 드러내는 ‘신상’이 적절합니다.
- source_word: εἰς ἑαυτοὺς καταναλοῦσιν
  english_pob_choice: spend it on themselves
  chosen_korean: 자기들만을 위해 써 버리는
  alternatives_korean:
  - 자기들 위해 써 버리는
  - 자기들에게 소비하는
  lexicon: LSJ
  rationale: καταναλοῦσιν은 단순 사용보다 ‘소비/소진’의 뉘앙스가 있으므로, 금과 은을 사사롭게 탕진하는 뜻이 드러나도록 옮겼습니다.
theological_decisions:
- issue: 제사장들의 행위에 담긴 풍자와 비판 유지
  chosen_reading: 제사장들이 우상에서 금과 은을 떼어 내어 자기 유익을 위해 써 버리는 모습으로, 우상의 무력함과 제사장들의 타락을 그대로 드러냈습니다.
  alternative_readings:
  - ‘훔친다’로 더 강하게 옮길 수 있습니다.
  rationale: 원문은 노골적 비난을 향하지만, συμμε어의 범위 안에서 해석을 조금 열어 두는 편이 source-direct합니다.
  doctrine_reference: 번역 원칙 §§1, 3, 6
