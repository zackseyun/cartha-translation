lexical_decisions:
- source_word: ἄνθρωπον
  english_pob_choice: a man
  chosen_korean: 사람
  alternatives_korean:
  - 한 남자
  - 한 사람
  lexicon: BDAG
  rationale: 여기서 ἄνθρωπον은 대표적 단수 인간을 가리키므로, 문맥상 성별을 전면화하기보다 한국어의 자연스러운 대표명사인 ‘사람’으로 옮겼습니다.
- source_word: τυφλὸν εἰς ὅρασιν
  english_pob_choice: blind man upright for seeing
  chosen_korean: 눈먼 사람을 보는 사람으로 세워 주다
  alternatives_korean:
  - 눈먼 사람을 보게 하다
  - 눈먼 사람을 시력 회복시키다
  - 눈먼 사람을 보도록 세우다
  lexicon: BDAG
  rationale: 직역적 구조인 ‘눈먼 사람을…세우다’와 목적구 ‘보는/보도록’을 함께 살려, 단순한 치유 서술로 좁히지 않으면서도 의미를 분명하게 전달했습니다.
- source_word: οὐ μὴ περιστήσωσιν
  english_pob_choice: certainly cannot set ... upright
  chosen_korean: …세워 주지도 못하고
  alternatives_korean:
  - …세우지도 못하고
  - …바로 세우지도 못하고
  - …일어서게 하지도 못하고
  lexicon: BDAG
  rationale: οὐ μή의 강한 불가능을 한국어 부정 반복으로 나타내어 ‘결코/전혀’의 강조를 살렸고, περιστήσωσιν은 문맥상 도움의 행위를 뜻하는 ‘세워 주다’로 옮겼습니다.
- source_word: ἐν ἀνάγκῃ ἄνθρωπον ὄντα
  english_pob_choice: a man when he is in distress
  chosen_korean: 사람이 곤경에 있을 때
  alternatives_korean:
  - 사람이 환난 중에 있을 때
  - 사람이 절박한 상황에 있을 때
  - 사람이 어려움에 처했을 때
  lexicon: BDAG
  rationale: ἀνάγκη는 단순 필요보다 압박과 곤경의 뉘앙스가 있어, 현대 한국어에서 자연스러운 ‘곤경’으로 옮겼습니다.
- source_word: ἐξέλωνται
  english_pob_choice: rescue
  chosen_korean: 구해 내다
  alternatives_korean:
  - 구출하다
  - 건져 내다
  - 구원하다
  lexicon: BDAG
  rationale: ἐξαιρέω의 핵심은 위험에서 건져 내는 행위이므로, 일상적이면서도 구체적인 ‘구해 내다’가 문맥에 가장 잘 맞습니다.
theological_decisions:
- issue: 이 구절의 통렬한 우상 비판을 한국어에서 어떻게 유지할 것인가
  chosen_reading: 무능을 완전히 부정하는 표현으로 유지했습니다.
  alternative_readings:
  - 완곡하게 ‘도와주지 못합니다’로 낮추는 번역
  - 일반적 무능보다 약한 ‘할 수 없습니다’
  rationale: 본문은 οὐ μή의 강한 부정을 사용하므로, 우상의 절대적 무능을 흐리지 않도록 ‘세워 주지도 못하고…구해 내지도 못합니다’로 직설적으로 옮겼습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 6
