  language: ko
  text: 그들은 눈먼 사람을 보는 사람으로 세워 주지도 못하고[a], 사람이 곤경에 있을 때 구해 내지도 못합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘눈먼 사람을 전혀 보게 할 수 없다.’ 그리스어 구문은 매우 압축적이어서, 더 문자적인 ‘눈먼 사람을 보는 사람으로 세우다’보다 넓게 이해될 수 있습니다.
    reason: lexical_alternative
