  lexicon: LSJ
  rationale: 수동 분사 ἐφελκυσθεῖσα는 다른 존재에 의해 끌려가는 물리적 동작을 가리키므로, 완곡한 표현보다 ‘끌려가’가 문맥의 강한 조롱과 강제성을 잘 살립니다.
- source_word: κοιμηθῇ
