base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/043.yaml
  text: But whenever one of them is dragged away by one of the passersby and lies with him[a], she reproaches the one next to her because she was not deemed worthy as she was[c][b], nor was her cord broken.
  footnotes:
  - marker: a
    text: Or 'is drawn away' or 'is enticed away'; the Greek can denote being led off, though the context favors a more physical sense.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'lies with him' renders a Greek euphemism for sexual relations.
    reason: cultural_note
  - marker: c
    text: The 'cord' likely refers to a fastening attached to the idol image; the satire imagines the figures as women competing for sexual attention.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 그들 가운데 하나가 지나가는 사람들 가운데 한 사람에게 끌려가 그와 동침하면[a][b], 그 여자는 곁에 있는 여자를 비난합니다. 그 곁의 여자가 자기처럼 인정을 받지 못했고, 그 여자의 끈도 끊어지지 않았기 때문입니다[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘동침하다’는 그리스어의 성적 완곡어법을 옮긴 것입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘끌려가다’, ‘유혹되어 가다’로도 옮길 수 있으나, 문맥은 물리적으로 끌려가는 뜻이 더 강합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘끈’은 우상 형상에 붙은 고정용 끈을 가리키는 것으로 보이며, 본문은 우상들을 성적 관심을 다투는 여성들처럼 풍자합니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἐφελκυσθεῖσα
  english_pob_choice: is dragged away
  chosen_korean: 끌려가
  alternatives_korean:
  - 끌려나가
  - 이끌려가
  - 잡혀가
  lexicon: LSJ
  rationale: 수동 분사 ἐφελκυσθεῖσα는 다른 존재에 의해 끌려가는 물리적 동작을 가리키므로, 완곡한 표현보다 ‘끌려가’가 문맥의 강한 조롱과 강제성을 잘 살립니다.
- source_word: κοιμηθῇ
  english_pob_choice: lies with him
  chosen_korean: 동침하면
  alternatives_korean:
  - 그와 잠자리를 같이하면
  - 그와 자면
  - 그와 성관계를 가지면
  lexicon: BDAG
  rationale: κοιμάομαι의 성적 완곡어법을 한국어에서도 지나치게 노골적이지 않게 드러내기 위해 ‘동침하다’를 택했습니다.
- source_word: ὀνειδίζει
  english_pob_choice: reproaches
  chosen_korean: 꾸짖습니다
  alternatives_korean:
  - 비난합니다
  - 조롱합니다
  - 모욕합니다
  lexicon: BDAG
  rationale: 문맥상 옆의 형상을 향한 책망·비난의 뉘앙스가 있어, 조롱의 성격을 유지하면서도 자연스러운 한국어인 ‘꾸짖다’를 사용했습니다.
- source_word: οὐκ ἠξίωται ὥσπερ καὶ αὐτή
  english_pob_choice: was not deemed worthy as she was
  chosen_korean: 자기처럼 인정받지 못했고
  alternatives_korean:
  - 자기처럼 합당하다고 여겨지지 않았고
  - 자기처럼 인정되지 못했고
  - 자기처럼 합당하게 여겨지지 않았고
  lexicon: BDAG
  rationale: ἠξιόω의 평가적 수동 의미를 살려 ‘인정받다’로 옮겼으며, 비교구문 ὥσπερ καὶ αὐτή는 ‘자기처럼’으로 간결하게 반영했습니다.
theological_decisions:
- issue: 우상 형상에 대한 의인화와 성적 풍자
  chosen_reading: 본문은 우상들을 여성 인물처럼 의인화하여 성적 경쟁을 벌이는 모습으로 조롱합니다.
  alternative_readings:
  - 우상 숭배 주변의 여성들을 가리키는 표현으로 읽을 수도 있습니다.
  rationale: 문맥 전체와 여성 분사형, 그리고 ‘끈’의 언급이 우상 형상 자체를 여성처럼 묘사하는 풍자에 더 잘 맞습니다. 모호함은 해소하지 않고 유지합니다.
  doctrine_reference: 의도된 풍자와 의인화를 그대로 반영하여 본문의 조롱 효과를 보존합니다.
