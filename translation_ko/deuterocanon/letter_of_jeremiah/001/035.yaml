translation:
  language: ko
  text: 그들은 결코 죽음에서 사람을 구해 내지 못하고, 더 약한 자를 강한 자에게서 빼내지도 못합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ θανάτου
  english_pob_choice: from death
  chosen_korean: 죽음에서
  alternatives_korean:
  - 죽음으로부터
  - 죽음에서 벗어나
  lexicon: BDAG
  rationale: ἐκ는 여기서 위험의 영역에서 벗어남을 가리키므로, 한국어는 간결하게 ‘죽음에서’로 옮겨 원문의 구조를 살렸습니다.
- source_word: ἄνθρωπον
  english_pob_choice: a man
  chosen_korean: 사람
  alternatives_korean:
  - 한 남자
  - 인간
  lexicon: BDAG
  rationale: 문맥상 일반적 인간을 가리키지만, 한국어에서는 단수 남성형을 그대로 드러내면 부자연스러워 ‘사람’으로 자연스럽게 옮겼습니다.
- source_word: οὐ μὴ ῥύσωνται
  english_pob_choice: they will certainly not rescue
  chosen_korean: 반드시 구해 내지 못하며
  alternatives_korean:
  - 결코 구원하지 못하며
  - 절대로 구해 내지 못하며
  lexicon: BDAG
  rationale: οὐ μή의 강한 부정을 한국어의 ‘반드시 … 못하다’로 살려, 단순한 가능성 부정이 아니라 단호한 불능을 표현했습니다.
- source_word: ἥττονα ἀπὸ ἰσχυροῦ
  english_pob_choice: the weaker from the strong
  chosen_korean: 약한 자를 강한 자에게서
  alternatives_korean:
  - 더 약한 이를 강한 자에게서
  - 약자를 강한 자로부터
  lexicon: LSJ, BDAG
  rationale: 비교급 ‘더 약한’의 뉘앙스를 살리되, 한국어에서는 대조를 분명히 하는 ‘약한 자’와 ‘강한 자’로 옮겨 원문의 대비를 드러냈습니다.
theological_decisions:
- issue: 문장의 일반 진술성
  chosen_reading: 이 구절은 특정 개인 사건보다 인간 권세의 한계를 일반적으로 선언하는 문장으로 옮겼습니다.
  alternative_readings:
  - 특정한 구출 실패 사례로 제한하는 해석
  - 과장된 수사로 완화하는 해석
  rationale: 헬라어 문장은 보편적 부정 진술이며, 문맥상 우상들이 할 수 없는 일을 열거하는 흐름이므로 일반 진술로 유지하는 것이 적절합니다.
  doctrine_reference: 문맥 주해
