  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/061.yaml
  text: But when the clouds are commanded by God to move over the whole inhabited world[a], they accomplish what was appointed.
  footnotes:
  - marker: a
    text: Or 'they carry out what was ordered.' The Greek τὸ ταχθέν can emphasize what has been ordered or appointed for them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 구름이 하나님께서 명하시면 온 거주 세계 위로 움직이게 되고, 그것은 맡겨진 것을 이루어 냅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘명령된 것을 수행한다.’ 그리스어 τὸ ταχθέν은 그들에게 ‘명령된 것’ 또는 ‘정해진 것’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: νεφέλαις
  english_pob_choice: the clouds
  chosen_korean: 구름이
  alternatives_korean:
  - 구름들은
  - 그 구름이
  lexicon: LSJ
  rationale: 문맥상 피조물인 구름을 주어로 세우되, 한국어에서는 복수 표지를 굳이 드러내지 않아도 자연스러워서 단수형 느낌의 집합명사로 옮겼습니다.
- source_word: ἐπιταγῇ ὑπὸ τοῦ θεοῦ
  english_pob_choice: are commanded by God
  chosen_korean: 하나님께서 명하시면
  alternatives_korean:
  - 하나님께서 명령하시면
  - 하나님에게서 명을 받으면
  lexicon: BDAG
  rationale: 수동 구조의 신적 주권을 살리면서도 한국어에서는 ‘명하다’가 가장 직접적이고 자연스러운 대응입니다.
- source_word: ἐπιπορεύεσθαι
  english_pob_choice: to move
  chosen_korean: 움직이게 되고
  alternatives_korean:
  - 가게 되고
  - 나아가게 되고
  - 이동하게 되고
  lexicon: LSJ
  rationale: 구름의 물리적 이동을 현대 한국어로 자연스럽게 살리되, 단순한 ‘가다’보다 더 넓은 이동 의미를 유지했습니다.
- source_word: ἐφʼ ὅλην τὴν οἰκουμένην
  english_pob_choice: over the whole inhabited world
  chosen_korean: 온 거주 세계 위로
  alternatives_korean:
  - 온 세상 위로
  - 온 땅 위로
  - 온 인류 거주 세계 위로
  lexicon: BDAG
  rationale: οἰκουμένη의 ‘거주된 세계’라는 범위를 살리기 위해 ‘거주 세계’를 택했고, ‘위로’로 하여 구름의 이동 경로를 드러냈습니다.
- source_word: τὸ ταχθέν
  english_pob_choice: what was appointed
  chosen_korean: 맡겨진 것
  alternatives_korean:
  - 명령된 것
  - 정해진 것
  - 임명된 것
  lexicon: BDAG
  rationale: POB의 ‘appointed’는 단순 명령보다 배정·지정의 뉘앙스를 포함하므로, 행해야 할 일을 받은 대상으로서 ‘맡겨진 것’이 가장 무난합니다.
theological_decisions:
- issue: τὸ ταχθέν의 신적 정함을 어떻게 드러낼지
  chosen_reading: ‘맡겨진 것’으로 옮겨 하나님의 질서에 따른 부여된 과업이라는 뜻을 살리되, 과도한 결정론 용어는 피했습니다.
  alternative_readings:
  - ‘명령된 것’으로 더 직접적으로 옮김
  - ‘정해진 것’으로 더 중립적으로 옮김
  rationale: 문맥은 하나님의 지시 아래 피조물이 그 기능을 수행한다는 뜻이지만, 본문이 요구하는 범위를 넘어 운명론적 뉘앙스를 강화할 필요는 없습니다.
  doctrine_reference: 신적 섭리와 피조물의 순종을 함께 보존
