lexical_decisions:
- source_word: ἀπὸ τοῦ ἱματισμοῦ αὐτῶν
  english_pob_choice: After taking garments from them
  chosen_korean: 그들에게서 옷을 가져간 뒤에
  alternatives_korean:
  - 그들에게서 의복을 가져간 뒤에
  - 그들의 옷을 빼앗은 뒤에
  lexicon: BDAG
  rationale: ἀπό는 여기서 출처와 분리를 나타내며, ἱματισμός는 집합적으로 ‘옷/의복’을 뜻하므로 자연스러운 현대 한국어로 옮겼습니다.
- source_word: οἱ ἱερεῖς
  english_pob_choice: the priests
  chosen_korean: 제사장들은
  alternatives_korean:
  - 그 제사장들은
  - 사제들은
  lexicon: BDAG
  rationale: 문맥상 우상 숭배 제의에 종사하는 제사장들이므로, 한국어 성서어휘에서 직접적이고 이해하기 쉬운 ‘제사장들’을 택했습니다.
- source_word: ἐνδύουσιν
  english_pob_choice: clothe
  chosen_korean: 입힙니다
  alternatives_korean:
  - 옷을 입힙니다
  - 옷을 입혀 줍니다
  lexicon: BDAG
  rationale: ἐνδύω는 누군가에게 옷을 입히는 행위이므로, 간결하고 동작을 분명히 드러내는 ‘입힙니다’로 옮겼습니다.
- source_word: τὰς γυναῖκας αὐτῶν καὶ τὰ παιδία
  english_pob_choice: their wives and children
  chosen_korean: 자기 아내들과 자녀들을
  alternatives_korean:
  - 그들의 아내들과 자녀들을
  - 자기들의 아내들과 아이들을
  lexicon: BDAG
  rationale: αὐτῶν은 직전의 제사장들을 가리키므로, 한국어에서는 소유를 자연스럽게 드러내는 ‘자기’를 사용해 관계를 명확히 했습니다.
theological_decisions:
- issue: 문맥상 '그들에게서'의 지시 대상
  chosen_reading: 본문은 대상을 직접 풀어 쓰지 않고 ‘그들’로 유지하되, 앞뒤 문맥이 그 우상들을 가리키는 것으로 이해합니다.
  alternative_readings:
  - ‘우상들에게서’로 명시적으로 풀어 쓰기
  rationale: 원문이 대명사 αὐτῶν을 사용하므로, 본문에는 이를 보존하고 해석은 문맥에 맡기는 것이 원문 우선 원칙에 맞습니다.
  doctrine_reference: 원문 우선 원칙과 문맥적 해석의 균형
- issue: ‘자기 아내들과 자녀들’의 소유 표현
  chosen_reading: 한국어에서는 관계 소유를 자연스럽게 드러내기 위해 ‘자기’를 사용했습니다.
  alternative_readings:
  - ‘그들의 아내들과 자녀들’
  rationale: 이 표현은 의미를 바꾸지 않으면서, 누가 그 아내들과 자녀들의 가족인지를 더 분명하게 해 줍니다.
  doctrine_reference: 자연스러운 한국어와 원문의 인칭 관계 유지
