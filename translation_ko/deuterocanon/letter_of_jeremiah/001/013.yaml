  text: And he holds a scepter like a man[a], a judge of a country[b], who will not destroy the one who sins against him.
  footnotes:
  - marker: a
    text: Or 'a judge of a country/region.' The Greek χώρας can denote land, country, or region.
    reason: lexical_alternative
  - marker: b
    text: Or 'will not kill' or 'will not remove.' The Greek verb can carry a range from killing to doing away with; here it underscores the idol's inability to punish.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그것은 한 지방[a]의 재판관인 사람처럼 홀을 들고 있으면서도, 자기에게 죄를 짓는 사람을 멸하지 않습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 나라의 재판관’ 또는 ‘한 지역의 재판관’. 헬라어 χώρα는 땅, 나라, 지역을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘죽이지 않습니다’ 또는 ‘없애지 않습니다’. 헬라어 동사는 죽이다나 제거하다를 뜻할 수 있으며, 이 문맥에서는 우상이 처벌할 수 없다는 점을 부각합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκήπτρον
  english_pob_choice: scepter
  chosen_korean: 홀
  alternatives_korean:
  - 왕홀
  - 지팡이
  lexicon: LSJ
  rationale: 통치와 재판 권위를 함께 드러내는 표지이므로, 한국어에서는 ‘홀’이 가장 자연스럽고 간결하게 상징을 살립니다.
- source_word: ὡς ἄνθρωπος
  english_pob_choice: like a man
  chosen_korean: 사람처럼
  alternatives_korean:
  - 인간처럼
  - 한 사람처럼
  lexicon: LSJ
  rationale: 우상에게 부여된 모습이 실제가 아닌 인간적 형상에 불과함을 드러내는 비교이므로, 직역에 가까운 ‘사람처럼’을 택했습니다.
- source_word: κριτὴς χώρας
  english_pob_choice: a judge of a country
  chosen_korean: 한 지방의 재판관
  alternatives_korean:
  - 한 나라의 재판관
  - 한 지역의 재판관
  - 한 지방의 판사
  lexicon: LSJ
  rationale: χώρας는 나라·땅·지역의 범위를 가질 수 있으므로, 과도하게 국가 단위로 고정하지 않고 비교문맥에 맞는 ‘한 지방’으로 옮겼습니다.
- source_word: ἀνελεῖ
  english_pob_choice: will not destroy
  chosen_korean: 멸하지는 못합니다
  alternatives_korean:
  - 죽이지는 못합니다
  - 없애지는 못합니다
  - 제거하지는 못합니다
  lexicon: LSJ
  rationale: POB의 ‘destroy’가 단순 살해보다 더 넓은 무력함을 가리키므로, 판단과 처벌의 불능을 포괄하는 ‘멸하다’로 옮겼습니다.
theological_decisions:
- issue: 우상의 재판관 이미지와 무능의 대비
  chosen_reading: ‘홀을 들고 있으나… 멸하지는 못합니다’로 직설적으로 옮겨, 권위의 상징과 실제 처벌 능력의 부재를 함께 드러냈습니다.
  alternative_readings:
  - ‘멸하지 못한다’를 더 완곡하게 옮기는 방식
  - ‘죽이지 못한다’로 좁히는 방식
  rationale: 이 절은 우상을 조롱하는 문맥에서 법정 권위의 외양과 실제 무력함을 대비시키므로, 긴장을 약화하지 않고 유지하는 번역이 필요합니다.
  doctrine_reference: 원문 우상 비판의 수사와 의미 대조를 보존
