  source_fidelity: 수정이 필요합니다. 원문의 ἀνελεῖ는 직설적으로 ‘멸하지/죽이지 않습니다’라는 미래 진술이며, 초안의 ‘멸하지는 못합니다’는 문맥상 우상의 무능을 잘 드러내지만 동사에 명시되지 않은 능력 양태를 더합니다. 또한 ὡς ἄνθρωπος κριτὴς χώρας는 ‘한 지방의 재판관인 사람처럼’으로 한 번의 비교 구문으로 옮기는 편이 원문의 결속을 더 잘 보존합니다.
  naturalness: ‘한 지방의 재판관인 사람처럼 홀을 들고 있으면서도’는 현대 표준 한국어 합쇼체에서 자연스럽고, 권위의 외양과 실제 행위의 대비도 분명합니다. 우상을 가리키는 문맥에서는 인칭 대명사 ‘그’보다 ‘그것’이 더 중립적이고 자연스럽습니다.
  terminology: ‘홀’은 σκήπτρον의 통치·사법 권위 상징을 적절히 옮깁니다. χώρας는 ‘한 지방’으로 유지하되 각주에서 나라·지역의 가능성을 제시합니다. ἀνελεῖ에는 ‘멸하다’를 유지하고, 대안인 ‘죽이다’와 ‘없애다’를 각주로 둡니다.
