  text: In the same way[a], their wooden gods overlaid with gold and silver are made like a scarecrow in a garden, on which every bird sits, and also like a dead body thrown out in the dark.
  footnotes:
  - marker: a
    text: Or 'a post/watch-figure in a garden.' The Greek term is rare, and the image is of an object set up in a garden on which birds freely perch.
    reason: lexical_alternative
translation:
  language: ko
  text: 같은 방식으로, 그들의 나무로 된 신상들은 금과 은으로 입혀져 있으며, 온갖 새가 그 위에 앉는 정원의 허수아비와 같고, 또 어둠 속에 내던져진 시체와도 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정원에 세운 기둥/감시용 형상’. 그리스어 βάμψος는 드문 단어이며, 새들이 자유롭게 그 위에 앉는 정원의 물체를 가리킵니다.
    reason: lexical_alternative
