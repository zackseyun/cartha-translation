  text: 같은 방식으로, 그들의 나무로 된 신상은 금과 은으로 입혀져 있으며, 정원에 놓인 허수아비처럼, 그 위에 온갖 새가 앉는 것과 같고, 또 어둠 속에 내던져진 죽은 몸과도 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정원에 세운 기둥/감시용 형상’. 희귀한 그리스어이며, 새들이 자유롭게 앉는 물체를 가리킵니다.
