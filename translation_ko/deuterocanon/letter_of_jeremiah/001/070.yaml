  lexicon: LSJ
  rationale: νεκρός와 ἐρριμμένῳ의 구체성과 버려진 이미지를 살리기 위해, 추상화하지 않고 물리적으로 ‘내던져진 죽은 몸’으로 옮겼습니다.
