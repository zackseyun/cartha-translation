  rationale: περί- 접두사의 ‘둘러/겉에’라는 감각을 살리면서도, 우상의 겉장식이라는 의미가 분명히 드러나도록 자연스러운 피동 표현으로 옮겼습니다.
- source_word: τῷ νεκρῷ ἐρριμμένῳ ἐν σκότει
  english_pob_choice: a dead body thrown out in the dark
  chosen_korean: 어둠 속에 내던져진 죽은 몸
