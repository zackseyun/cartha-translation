translation:
  language: ko
  text: 그리고 그들의 집에서 제사장들은 제자리에 앉아 있으며, 찢어진 겉옷을 입고, 머리와 수염을 깎았으며, 그들의 머리는 가려져 있지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 동사 διφρεύουσιν은 문맥상 ‘의자/좌석에 앉다’는 뜻으로도 읽을 수 있으며, 이 실내 맥락에서는 문자적인 ‘마차를 타다’보다 그 뜻이 더 그럴듯합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διφρεύουσιν
  english_pob_choice: sit in state
  chosen_korean: 제자리에 앉아 있으며
  alternatives_korean:
  - 위엄 있게 앉아 있으며
  - 자리에 앉아 있으며
  - 의자에 앉아 있으며
  lexicon: LSJ
  rationale: 실내 맥락에서 문자적인 ‘마차를 타다’보다 의자/좌석에 앉은 자세를 가리키는 뜻이 더 자연스럽고, 한국어에서는 과도하게 해석하지 않으면서도 의례적인 정적인 태도를 살려 ‘제자리에 앉아 있으며’로 옮겼습니다.
- source_word: χιτῶνας
  english_pob_choice: tunics
  chosen_korean: 겉옷
  alternatives_korean:
  - 튠닉스
  - 옷
  - 내의
  lexicon: LSJ
  rationale: χιτών은 기본 의복이지만 한국어 성경문맥에서 ‘겉옷’이 가장 읽히기 쉬우며, 단순한 ‘옷’보다 구체적입니다. 다만 전통적 성직복을 뜻하는 말로 굳히지 않도록 과도한 교회 용어는 피했습니다.
- source_word: διερρωγότας
  english_pob_choice: torn
  chosen_korean: 찢어진
  alternatives_korean:
  - 해어진
  - 찢겨진
  - 터진
  lexicon: LSJ
  rationale: 완료분사로서 이미 찢어져 있는 상태를 나타내므로, 현대 한국어에서 직관적인 ‘찢어진’이 가장 적절합니다.
- source_word: ἐξυρημένους
  english_pob_choice: shaved
  chosen_korean: 깎았으며
  alternatives_korean:
  - 면도한
  - 삭발한
  - 깎아낸
  lexicon: LSJ
  rationale: 머리와 수염에서 털을 제거한 상태를 가리키므로, 머리와 수염 모두에 무리 없이 적용되는 ‘깎았으며’로 옮겼습니다. ‘삭발한’은 머리에는 자연스럽지만 수염에는 덜 어울립니다.
- source_word: ἀκάλυπτοί εἰσιν
  english_pob_choice: their heads uncovered
  chosen_korean: 그들의 머리는 가려져 있지 않습니다
  alternatives_korean:
  - 그들의 머리는 덮이지 않았습니다
  - 그들의 머리는 드러나 있습니다
  - 그들의 머리는 가리지 않았습니다
  lexicon: LSJ
  rationale: ἀκάλυπτος는 ‘덮이지 않은/가려지지 않은’이라는 뜻이므로, 머리의 노출 상태를 직접적으로 살린 표현을 택했습니다. POB의 ‘uncovered’에 맞춰 ‘가려져 있지 않습니다’로 옮겼습니다.
theological_decisions:
- issue: 이 구절의 제사장 행위가 애도인지 의례인지에 대한 해석
  chosen_reading: 구체적 해석을 덧붙이지 않고, 찢어진 옷·깎은 머리와 수염·가려지지 않은 머리라는 보이는 상태를 묘사하는 데 그쳤습니다.
  alternative_readings:
  - 애도 예식으로 풀이하기
  - 우상 제사장의 의례적 좌정으로 강하게 해석하기
  rationale: 원문은 관찰 가능한 외양을 열거할 뿐, 그 의미를 상세히 규정하지 않습니다. 따라서 해석을 확장하지 않고 소스가 말하는 것만 드러내는 것이 번역 원칙에 부합합니다.
