  lexicon: BDAG
  rationale: aorist participle의 인과적·상황적 용법을 자연스러운 한국어로 옮기되, 앞선 판단에 근거한 행위를 드러내기 위해 ‘알고’를 택했습니다.
- source_word: οὖν
  english_pob_choice: therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그러니
  - 그래서
  - 따라서
  lexicon: BDAG
  rationale: 앞선 논증에서 나온 결론을 표시하는 접속어이므로, 현대 문어체에서 가장 분명한 ‘그러므로’가 적절합니다.
- source_word: οὐκ εἰσὶν θεοί
  english_pob_choice: they are not gods
  chosen_korean: 신들이 아님
  alternatives_korean:
  - 하나님들이 아님
  - 신적 존재가 아님
  - 신이 아님
  lexicon: BDAG
  rationale: θεοί를 직접적으로 ‘신들’로 옮겨 우상 숭배 대상의 신성 부정을 보존했습니다. 여기서는 단수 ‘신’보다 복수와 부정의 대조가 원문에 가깝습니다.
- source_word: μὴ φοβῆσθε αὐτούς
  english_pob_choice: do not fear them
  chosen_korean: 그들을 두려워하지 마십시오
  alternatives_korean:
  - 그들을 무서워하지 마십시오
  - 그들을 두려워하지 마세요
  - 그들을 두려워하지 말십시오
  lexicon: BDAG
  rationale: 금지 명령을 합쇼체로 자연스럽게 옮기면서, αὐτούς의 직접 목적어를 ‘그들’로 보존했습니다.
theological_decisions:
- issue: θεοί의 우상 비판적 의미를 한국어로 어떻게 드러낼지
  chosen_reading: ‘신들’로 직역하여 우상들에게 부여된 가짜 신성을 부정하는 표현을 유지했습니다.
  alternative_readings:
  - 하나님들이 아님
  - 신적 존재가 아님
  - 우상일 뿐임
  rationale: 원문은 우상들의 참된 신성을 부정하는 직접 진술이므로, 해석을 덧붙인 완곡어보다 ‘신들’이 논지의 날카로움을 더 정확히 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Original-language primacy over translation tradition; Preserve theological tension rather than resolve it'
