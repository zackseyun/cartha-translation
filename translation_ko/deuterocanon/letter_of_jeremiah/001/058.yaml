  source_fidelity: 초안은 첫 구절에서 ‘왕이 … 그릇보다 … 낫습니다’라고 하여 왕과 그릇을 직접 비교합니다. 그러나 그리스어의 병렬된 ἢ 구문은 왕과 유용한 그릇을 거짓 신들과 대비하는 수사로 이해하는 것이 적절하며, 왕이 그릇보다 낫다는 비교를 만들지 않습니다. 수정문은 이 병렬성과 거짓 신들에 대한 대비를 보존합니다.
