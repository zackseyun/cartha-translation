  text: So a king who displays his own courage is better than the false gods[a], or a useful vessel in a house, which its owner will use, or a door in a house that keeps safe the things in it, or the false gods, and a wooden pillar in palaces is better than the false gods.
  footnotes:
  - marker: a
    text: Greek repeats 'than the false gods' after each comparison for emphasis; the translation preserves that repetition as much as possible.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 자기 용맹을 드러내는 왕이, 집에서 쓰이는 유용한 그릇보다, 곧 그 소유자가 그것을 사용하는 그 그릇보다, 거짓 신들보다 더 낫습니다[a]. 또한 집 안에 있는 것들을 지켜 주는 문이 거짓 신들보다 더 낫고, 궁궐에 있는 나무 기둥도 거짓 신들보다 더 낫습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 각 비교 뒤에 ‘거짓 신들보다’를 반복하여 강조합니다. 번역도 그 반복 효과를 살리려고 했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  english_pob_choice: So
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 이러므로
  lexicon: BDAG
  rationale: 앞선 논증을 잇는 결론 표지이므로, 한국어에서는 자연스러운 추론 접속사인 ‘그러므로’로 옮겼습니다.
- source_word: ἐπιδεικνύμενον τὴν ἑαυτοῦ ἀνδρείαν
  english_pob_choice: who displays his own courage
  chosen_korean: 자기 용맹을 드러내는
  alternatives_korean:
  - 자기 용기를 보이는
  - 자기 용맹을 나타내는
  lexicon: BDAG
  rationale: ἀνδρεία는 단순한 ‘힘’이 아니라 용맹/용기이므로, ἑαυτοῦ의 자기 강조를 살려 ‘자기 용맹을 드러내는’으로 옮겼습니다.
- source_word: σκεῖος χρήσιμον
  english_pob_choice: a useful vessel
  chosen_korean: 유용한 그릇
  alternatives_korean:
  - 쓸모 있는 기물
  - 쓸 만한 용기
  lexicon: BDAG
  rationale: σκεῖος는 넓은 뜻의 용기/그릇이므로, 집안 비유에 자연스러운 ‘그릇’을 택했고 χρήσιμον은 실용성을 드러내는 ‘유용한’으로 옮겼습니다.
- source_word: οἱ ψευδεῖς θεοί
  english_pob_choice: the false gods
  chosen_korean: 거짓 신들
  alternatives_korean:
  - 가짜 신들
  - 허망한 신들
  lexicon: BDAG
  rationale: ψευδεῖς는 ‘거짓된/참이 아닌’의 뜻이므로, 우상 비판의 직접성을 살리는 ‘거짓 신들’로 옮겼습니다.
theological_decisions:
- issue: 반복되는 비교구문과 우상 비판의 수사 유지
  chosen_reading: 각 대상(왕, 그릇, 문, 나무 기둥)이 각각 거짓 신들보다 낫다는 비교를 드러내되, 마지막 문장을 중심으로 한 한국어 문장 안에서 반복을 유지했습니다.
  alternative_readings:
  - 비교를 하나로 묶어 요약적으로 표현하기
  - ‘거짓 신들보다’의 반복을 줄여 문장을 더 매끈하게 만들기
  rationale: 그리스어는 같은 폴렘적 대비를 반복해 우상의 무가치함을 강조하므로, 한국어에서도 그 반복 효과를 보존하는 편이 원문 의도를 더 잘 전달합니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
