  - severity: medium
    issue: 각 비교 뒤에 ‘거짓 신들보다’가 반복된다는 각주가 본문과 정확히 일치하지 않음
    rationale: 제시된 그리스어는 ‘거짓 신들’이라는 표현을 왕 뒤가 아니라 유용한 그릇, 문, 나무 기둥의 병렬 부분에 반복하여 둡니다. 기존 각주는 ‘각 비교 뒤’라고 과도하게 일반화합니다.
