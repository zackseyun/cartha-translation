  lexicon: BDAG
  rationale: οὖν의 추론적 연결을 살려 ‘그렇다면’으로 옮기고, πῶς의 질문 성격은 ‘어떻게’로 자연스럽게 보존했습니다.
- source_word: νομιστέον
