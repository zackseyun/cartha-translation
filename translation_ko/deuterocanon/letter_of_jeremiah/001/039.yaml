  rationale: 임퍼소널한 당위 표현을 한국어의 ‘~여겨야 하며’로 옮겨, 단순 명명 문제가 아니라 그렇게 판단할 근거가 있는지 묻는 뉘앙스를 살렸습니다.
- source_word: κλητέον
  english_pob_choice: called
  chosen_korean: 신이라 불러야 하겠습니까
  alternatives_korean:
  - 신이라 불러야 합니까
  - 신이라 이름해야 하겠습니까
  lexicon: LSJ
  rationale: ‘불러야 하다’가 가장 직접적으로 대응하며, 앞절과 평행을 이루도록 종결형을 조정했습니다.
- source_word: θεούς
  english_pob_choice: gods
  chosen_korean: 신
  alternatives_korean:
  - 신들
  - 신격
  lexicon: BDAG
  rationale: 문맥이 우상 논박이므로 복수형의 ‘gods’에 해당하는 한국어는 자연스럽게 ‘신들’이지만, 질문의 호소력을 높이기 위해 앞뒤를 ‘신’으로 두되 의미상 복수 신격을 가리키도록 했습니다.
