  rationale: 그리스어는 우상에 ‘신’이라는 칭호를 붙이는 타당성을 반문합니다. 한국어도 그 판단의 수사적 압박을 유지해야 하며, 형이상학적 결론을 덧붙이지 않도록 했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; keep rhetorical force intact.'
