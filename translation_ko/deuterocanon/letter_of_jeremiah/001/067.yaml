lexical_decisions:
- source_word: τὰ θηρία
  english_pob_choice: Wild animals
  chosen_korean: 들짐승
  alternatives_korean:
  - 야생 동물
  - 짐승
  lexicon: LSJ
  rationale: θηρία는 문맥상 우상보다 우월한 ‘들짐승/야생 짐승’의 의미이므로, 현대 한국어에서 자연스러운 ‘들짐승’으로 옮겨 대비를 살렸습니다.
- source_word: κρείττω
  english_pob_choice: are better than
  chosen_korean: 낫습니다
  alternatives_korean:
  - 더 낫습니다
  - 우월합니다
  - 더 좋습니다
  lexicon: LSJ
  rationale: 비교급의 핵심은 도덕성이 아니라 실용적 우열이므로, 자연스러운 비교 표현인 ‘낫습니다’를 택했습니다.
- source_word: ἃ δύνανται ἐκφυγόντα εἰς σκέπην
  english_pob_choice: because they can escape into shelter
  chosen_korean: 피하여 도피할 수 있고
  alternatives_korean:
  - 피난처로 도망할 수 있고
  - 숨을 곳으로 피할 수 있고
  lexicon: LSJ
  rationale: δύνανται와 ἐκφυγόντα의 동작성을 살려 ‘피하여 도피할 수 있고’로 옮겨, 피신 가능성을 간결하게 표현했습니다.
- source_word: αὐτὰ ὠφελῆσαι
  english_pob_choice: help themselves
  chosen_korean: 스스로에게 유익을 줄 수 있습니다
  alternatives_korean:
  - 스스로를 도울 수 있습니다
  - 자기 보존에 도움이 됩니다
  lexicon: LSJ
  rationale: ὠφελέω의 기본 의미인 ‘유익을 주다’를 살리면서, 문맥상 자기 보존의 뉘앙스를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 우상과 들짐승의 대조를 드러내는 비교 구문
  chosen_reading: ‘그들보다’로 대상을 직접 드러내어, 문맥상 우상과의 대비가 한국어 문장에서도 분명하게 읽히도록 했습니다.
  alternative_readings:
  - ‘그것들보다’로 더 문자적으로 옮기는 방식
  rationale: 본문의 풍자는 주변 문맥의 우상들을 염두에 둔 비교이므로, 지시 대상을 흐리지 않는 쪽이 수사적 힘을 보존합니다.
  doctrine_reference: 문맥적 일관성, 우상 풍자
- issue: αὐτὰ ὠφελῆσαι의 반사적/실용적 의미
  chosen_reading: ‘스스로에게 유익을 줄 수 있습니다’로 옮겨, 단순한 생존 능력보다 자기 보존의 실용적 효과를 강조했습니다.
  alternative_readings:
  - ‘자기 자신을 도울 수 있습니다’
  - ‘살아남는 데 유리합니다’
  rationale: 본문은 우상이 할 수 없는 반면 동물은 자기에게 유익이 되는 행동을 할 수 있다는 아이러니를 말하므로, ‘유익을 주다’의 의미를 살리는 것이 적절합니다.
  doctrine_reference: 문맥적 풍자, 의미론적 정확성
