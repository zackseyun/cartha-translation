translation:
  language: ko
  text: 그러므로 바빌론에 들어가면, 너희는 그곳에서 여러 해와 긴 세월 동안, 일곱 세대까지[a] 있게 될 것입니다. 그러나 그 후에 내가 너희를 그곳에서 평안히 이끌어 내겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘일곱 세대 동안’으로 옮길 수 있습니다. 그리스어 표현은 문자적으로 ‘일곱 세대까지’를 뜻하며, 포로 기간을 대략적·상징적으로 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθόντες οὖν εἰς Βαβυλῶνα
  english_pob_choice: So when you enter Babylon
  chosen_korean: 그러므로 바빌론에 들어가면
  alternatives_korean:
  - 바빌론으로 들어가면
  - 그러므로 바빌론에 들어간 뒤에
  lexicon: BDAG
  rationale: 오리리스분사와 οὖν의 흐름을 자연스러운 조건/시점 표현으로 살리면서, 미래적 문맥을 해치지 않도록 ‘들어가면’으로 옮겼습니다.
- source_word: ἔτη πλείω καὶ χρόνον μακρὸν
  english_pob_choice: for many years and a long time
  chosen_korean: 여러 해와 긴 세월 동안
  alternatives_korean:
  - 많은 해와 긴 세월 동안
  - 오랜 세월 동안
  lexicon: BDAG
  rationale: 두 개의 지속 기간 표현을 둘 다 살려 반복적 강조를 유지했습니다. ‘여러 해’와 ‘긴 세월’은 의미상 겹치지만, 그 중첩 자체가 원문의 수사 효과입니다.
- source_word: ἕως γενεῶν ἑπτά
  english_pob_choice: until seven generations
  chosen_korean: 곧 일곱 세대까지
  alternatives_korean:
  - 일곱 세대까지
  - 일곱 세대 동안
  lexicon: BDAG
  rationale: ἕως의 한계를 드러내기 위해 ‘까지’를 유지했고, γενεῶν ἑπτά는 직역에 가깝게 ‘일곱 세대’로 옮겼습니다.
- source_word: ἐξάξω ὑμᾶς ἐκεῖθεν
  english_pob_choice: I will bring you out from there
  chosen_korean: 내가 거기에서 너희를 이끌어 내겠습니다
  alternatives_korean:
  - 내가 거기에서 너희를 데리고 나오겠습니다
  - 내가 거기에서 너희를 끌어내겠습니다
  lexicon: BDAG
  rationale: ἐξάξω는 단순 이동이 아니라 ‘밖으로 이끌어 내다’의 뉘앙스를 가지므로, 출애굽적 뉘앙스를 과도하게 강화하지 않으면서도 ‘이끌어 내다’로 살렸습니다.
- source_word: μετʼ εἰρήνης
  english_pob_choice: in peace
  chosen_korean: 평강 가운데
  alternatives_korean:
  - 평안 가운데
  - 평화롭게
  lexicon: BDAG
  rationale: εἰρήνη의 프로젝트 기본어휘를 따라 ‘평강’을 유지했습니다. 전치사구는 상태/방식 표현으로 자연스럽게 ‘가운데’로 옮겼습니다.
theological_decisions:
- issue: 포로 귀환의 성격을 어떻게 표현할 것인가
  chosen_reading: ‘이끌어 내겠습니다’로 번역하여, 본문이 말하는 해방/이동을 유지하되 ‘돌아가게 하다’나 ‘구원하다’ 같은 추가 의미는 넣지 않았습니다.
  alternative_readings:
  - 내가 거기에서 너희를 돌아오게 하겠습니다
  - 내가 거기에서 너희를 구해 내겠습니다
  rationale: 그리스어 ἐξάξω는 장소로부터의 인도/인출을 말할 뿐, 여기서는 귀환이나 구원의 신학을 직접 명시하지 않습니다. 본문이 말하는 범위를 넘기지 않는 것이 원문 충실성에 맞습니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy; preserve source-level tensions and avoid importing unstated restoration language.'
