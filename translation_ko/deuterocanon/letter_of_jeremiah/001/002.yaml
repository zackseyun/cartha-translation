  text: So when you enter Babylon[a], you will be there for many years and a long time, until seven generations; but after this I will bring you out from there in peace.
  footnotes:
  - marker: a
    text: Or 'for seven generations.' The Greek phrase literally reads 'until seven generations,' which may denote the span of exile in a rounded or stylized way.
