    reason: lexical_alternative
lexical_decisions:
- source_word: ὠρύονται
  english_pob_choice: they howl
  chosen_korean: 울부짖으니
  alternatives_korean:
  - 으르렁거리니
  - 울다시피 외치니
  - 포효하니
  lexicon: LSJ
  rationale: 짐승 같은 크고 거친 소리라는 뉘앙스를 살리기 위해 ‘울부짖다’를 택했고, 문맥의 조롱조를 유지했습니다.
- source_word: βοῶντες
  english_pob_choice: shouting
  chosen_korean: 외치며
