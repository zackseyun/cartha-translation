translation:
  language: ko
  text: 그러나 그들은 자기들의 신들 앞에서 외치며 울부짖으니, 마치 죽은 이를 위한 장례 식사에 있는 사람들 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
