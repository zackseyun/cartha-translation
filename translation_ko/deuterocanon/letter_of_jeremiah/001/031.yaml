translation:
  language: ko
  text: 그러나 그들은 자기들의 신들 앞에서 울부짖으며 외칩니다. 마치 어떤 사람들이 죽은 이를 위한 장례 식사 자리에서 하듯이 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘죽은 이를 위한 식사’ 또는 ‘장례 잔치’가 될 수 있습니다. 그리스어는 죽은 사람과 관련된 애도나 장례 식사를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠρύονται
  english_pob_choice: they howl
  chosen_korean: 울부짖으니
  alternatives_korean:
  - 으르렁거리니
  - 울다시피 외치니
  - 포효하니
  lexicon: LSJ
  rationale: 짐승 같은 크고 거친 소리라는 뉘앙스를 살리기 위해 ‘울부짖다’를 택했고, 문맥의 조롱조를 유지했습니다.
- source_word: βοῶντες
  english_pob_choice: shouting
  chosen_korean: 외치며
  alternatives_korean:
  - 소리치며
  - 큰소리로 부르며
  - 부르짖으며
  lexicon: LSJ
  rationale: 현재분사의 병렬감을 살리면서, 앞의 ‘울부짖다’와 겹치지 않도록 소리 높여 말하는 동작을 ‘외치며’로 옮겼습니다.
- source_word: θεῶν
  english_pob_choice: their gods
  chosen_korean: 자기들의 신들
  alternatives_korean:
  - 그들의 신들
  - 우상들
  - 그들의 우상
  lexicon: LSJ
  rationale: 원문이 직접 ‘신들’(θεῶν)이라고 말하므로 본문에서는 그 표현을 유지하되, 문맥상 우상 숭배를 가리키는 점도 자연스럽게 드러나도록 했습니다.
- source_word: ἐν περιδείπνῳ νεκροῦ
  english_pob_choice: at a funeral meal for the dead
  chosen_korean: 죽은 이를 위한 장례 식사에 있는 사람들
  alternatives_korean:
  - 죽은 이를 위한 장례 잔치에 있는 사람들
  - 죽은 자를 위한 장례 식사에 있는 사람들
  - 장례 भोज식에 있는 사람들
  lexicon: LSJ
  rationale: 그리스어는 단순한 ‘식사’가 아니라 죽은 이를 둘러싼 애도/장례 맥락의 식사를 가리키므로, 한국어에서도 그 문화적 배경이 드러나도록 풀어 옮겼습니다.
theological_decisions:
- issue: θεῶν을 본문에서 ‘신들’로 둘지 ‘우상들’로 풀지
  chosen_reading: 본문은 ‘신들’로 유지하고, 전체 문맥이 우상 숭배 비판임을 독자가 알 수 있게 둡니다.
  alternative_readings:
  - 우상들
  - 그들의 우상
  rationale: 원문이 명시적으로 ‘their gods’라고 말하므로, 해석어로 바꾸기보다 원문 표현을 보존하는 쪽이 소스-직결성이 높습니다.
  doctrine_reference: '원어 우선 원칙: 본문 용어와 해석을 구분하여 번역합니다.'
