  lexicon: LSJ
  rationale: 현재분사의 병렬감을 살리면서, 앞의 ‘울부짖다’와 겹치지 않도록 소리 높여 말하는 동작을 ‘외치며’로 옮겼습니다.
- source_word: θεῶν
  english_pob_choice: their gods
  chosen_korean: 자기들의 신들
  alternatives_korean:
  - 그들의 신들
  - 우상들
  - 그들의 우상
  lexicon: LSJ
  rationale: 원문이 직접 ‘신들’(θεῶν)이라고 말하므로 본문에서는 그 표현을 유지하되, 문맥상 우상 숭배를 가리키는 점도 자연스럽게 드러나도록 했습니다.
- source_word: ἐν περιδείπνῳ νεκροῦ
  english_pob_choice: at a funeral meal for the dead
  chosen_korean: 죽은 이를 위한 장례 식사에 있는 사람들
  alternatives_korean:
  - 죽은 이를 위한 장례 잔치에 있는 사람들
  - 죽은 자를 위한 장례 식사에 있는 사람들
  - 장례 भोज식에 있는 사람들
  lexicon: LSJ
  rationale: 그리스어는 단순한 ‘식사’가 아니라 죽은 이를 둘러싼 애도/장례 맥락의 식사를 가리키므로, 한국어에서도 그 문화적 배경이 드러나도록 풀어 옮겼습니다.
