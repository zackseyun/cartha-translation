  text: And the women[a], with cords wrapped around themselves, sit in the streets[b], burning bran.
  footnotes:
  - marker: a
    text: Or 'having put ropes around themselves.' The Greek specifies cords/ropes placed around the women but does not explain their symbolic significance here.
    reason: lexical_alternative
  - marker: b
    text: That is, bran used as a smoking or incense-like offering; the Greek does not use the normal word for incense here.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 여자들은 끈을 몸에 두르고[a] 거리에서 앉아 겨를 태웁니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 σχοινία는 끈이나 밧줄을 가리킬 수 있습니다. 여자들이 끈을 두른 행위의 정확한 상징적 의미는 본문이 설명하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: θυμιάω는 보통 ‘향을 피우다’ 또는 ‘분향하다’라는 뜻이지만, 여기서는 목적어가 πίτυρα(겨)이므로 일반적인 향을 뜻한다고 한정하지 않고 ‘겨를 태우다’로 옮겼습니다.
    reason: cultural_note
