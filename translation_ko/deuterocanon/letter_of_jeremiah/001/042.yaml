  text: And the women[a], with cords wrapped around themselves, sit in the streets[b], burning bran.
  footnotes:
  - marker: a
    text: Or 'having put ropes around themselves.' The Greek specifies cords/ropes placed around the women but does not explain their symbolic significance here.
    reason: lexical_alternative
  - marker: b
    text: That is, bran used as a smoking or incense-like offering; the Greek does not use the normal word for incense here.
    reason: cultural_note
translation:
  language: ko
  text: 그런데 여자들은 끈을 몸에 두르고 길거리들에 앉아 겨를 태웁니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 σχοινία는 끈이나 밧줄을 가리킬 수 있으며, 정확한 상징적 의미는 본문이 설명하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: θυμιάω는 보통 향을 피우다라는 뜻이지만, 여기서는 목적어가 ‘겨’이므로 향 재료가 아니라 겨를 태우는 동작을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: περιθέμεναι σχοινία
  english_pob_choice: with cords wrapped around themselves
  chosen_korean: 끈을 몸에 두르고
  alternatives_korean:
  - 끈을 자신들에게 감고
  - 끈을 둘러맨 채
  lexicon: LSJ
  rationale: περιτίθημι와 σχοινία의 결합은 무언가를 몸 둘레에 두르는 동작을 가리키므로, 한국어에서는 자연스럽게 ‘몸에 두르고’로 옮겨 반사적 의미를 살렸습니다.
- source_word: ἐν ταῖς ὁδοῖς
  english_pob_choice: in the streets
  chosen_korean: 길거리들에
  alternatives_korean:
  - 거리들에
  - 길들에
  lexicon: LSJ
  rationale: 공적인 도시 공간이라는 뉘앙스를 살리기 위해 ‘길거리들’로 옮겼습니다. 단순한 ‘길’보다 실제 노출된 장소감을 더 분명히 드러냅니다.
- source_word: ἐγκάθηνται
  english_pob_choice: sit
  chosen_korean: 앉아
  alternatives_korean:
  - 앉아 있습니다
  - 자리에 앉습니다
  lexicon: LSJ
  rationale: 서술적 현재의 단순 동작을 한국어 현재분사 ‘앉아’로 자연스럽게 표현했습니다.
- source_word: θυμιῶσα τὰ πίτυρα
  english_pob_choice: burning bran
  chosen_korean: 겨를 태웁니다
  alternatives_korean:
  - 겨를 피워 올립니다
  - 겨를 향불처럼 태웁니다
  lexicon: LSJ
  rationale: θυμιάω는 통상 ‘향을 피우다’이지만, 목적어가 πίτυρα(겨)이므로 전형적 ‘향’이 아니라 ‘태우다’로 옮겨 원문의 낯선 재료를 그대로 드러냈습니다.
theological_decisions:
- issue: 여자들의 행위가 지닌 상징성
  chosen_reading: 본문이 말하는 겉으로 드러난 행동만 묘사하고, 그 상징이나 의례적 의미는 확정하지 않았습니다.
  alternative_readings:
  - 불임/풍요를 위한 특정 이교 의식으로 단정하는 읽기
  rationale: 그리스어는 끈과 겨를 태우는 행위를 묘사할 뿐, 그 상징적 뜻을 설명하지 않으므로, 본문이 말하는 만큼만 번역해 해석의 과잉을 피했습니다.
  doctrine_reference: 본문의 묘사와 해석을 구분함
