  alternative_readings:
  - 불임/풍요를 위한 특정 이교 의식으로 단정하는 읽기
  rationale: 그리스어는 끈과 겨를 태우는 행위를 묘사할 뿐, 그 상징적 뜻을 설명하지 않으므로, 본문이 말하는 만큼만 번역해 해석의 과잉을 피했습니다.
  doctrine_reference: 본문의 묘사와 해석을 구분함
