  source_fidelity: ‘끈을 몸에 두르고’와 ‘겨를 태웁니다’는 각각 περιθέμεναι σχοινία와 θυμιῶσα τὰ πίτυρα를 충실히 반영합니다. 다만 ἐν ταῖς ὁδοῖς의 복수형을 ‘길거리들에’로 옮긴 표현은 한국어에서 부자연스럽습니다. ‘거리에서’는 공공의 거리라는 의미를 자연스럽게 전달하면서 원문의 일반적·복수적 용법을 충분히 보존합니다.
  naturalness: 현대 표준어 합쇼체에서는 ‘여자들은 … 앉아 … 태웁니다’가 자연스럽습니다. ‘길거리들에’는 통상 쓰이지 않는 복수 표지이므로 ‘거리에서’로 고치는 것이 좋습니다. 각주 표지도 해당 어구 바로 뒤에 배치하는 편이 명료합니다.
  terminology: ‘끈’, ‘몸에 두르고’, ‘겨’는 적절합니다. θυμιάω에 관한 각주는 ‘향 재료가 아니라’라고 단정하기보다, 이 문맥에서 통상적인 향을 피우는 행위로 한정하지 않고 겨를 태우는 것으로 번역한다는 점을 밝혀야 합니다. 본문은 그 행위의 의례적·상징적 뜻을 설명하지 않습니다.
