- source_word: τὸ πρόσωπον αὐτῶν
  english_pob_choice: their faces
  chosen_korean: 그들의 얼굴은
  alternatives_korean:
  - 그들의 얼굴이
  - 그 얼굴은
  - 그들의 모습은
  lexicon: LSJ
  rationale: 단수형 πρόσωπον이라도 다수 소유자에 대해 한국어에서는 복수형 ‘얼굴들’보다는 ‘그들의 얼굴’이 자연스럽고, 각각의 얼굴이 검게 된 상황을 잘 전달합니다.
- source_word: τοῦ ἐκ τῆς οἰκίας
