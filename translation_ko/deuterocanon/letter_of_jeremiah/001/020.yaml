lexical_decisions:
- source_word: μεμελανωμένον
  english_pob_choice: blackened
  chosen_korean: 검게 그을렸습니다
  alternatives_korean:
  - 검게 되었습니다
  - 새카맣게 되었습니다
  - 검게 변했습니다
  lexicon: LSJ
  rationale: 완료·수동 분사로 나타난 결과 상태를 한국어에서 자연스럽게 드러내면서, 단순한 ‘어두워짐’보다 검은 그을음의 구체적 시각 효과를 살렸습니다.
- source_word: τὸ πρόσωπον αὐτῶν
  english_pob_choice: their faces
  chosen_korean: 그들의 얼굴은
  alternatives_korean:
  - 그들의 얼굴이
  - 그 얼굴은
  - 그들의 모습은
  lexicon: LSJ
  rationale: 단수형 πρόσωπον이라도 다수 소유자에 대해 한국어에서는 복수형 ‘얼굴들’보다는 ‘그들의 얼굴’이 자연스럽고, 각각의 얼굴이 검게 된 상황을 잘 전달합니다.
- source_word: τοῦ ἐκ τῆς οἰκίας
  english_pob_choice: from the house
  chosen_korean: 집에서 나온
  alternatives_korean:
  - 집에서 나온
  - 집으로부터 나온
  - 성전에서 나온
  lexicon: LSJ
  rationale: οἰκία의 기본 의미인 ‘집’을 그대로 살려 원문에 충실하게 옮겼습니다. 문맥상 우상 신당/성소를 가리킬 수 있어도, 여기서는 해석어보다 원어의 평이한 표현을 우선했습니다.
theological_decisions:
- issue: οἰκία를 문맥상 ‘성전/신당’으로 풀어쓸지 여부
  chosen_reading: ‘집’으로 유지
  alternative_readings:
  - 성전
  - 신당
  - 사당
  rationale: 본문은 ειδ한 예배 건물을 지시하는 더 구체적인 단어를 쓰지 않고 일반 명사 οἰκία를 사용합니다. 따라서 해석을 앞서기보다 원문 표면 의미를 보존하는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; do not paraphrase beyond what the source warrants.'
