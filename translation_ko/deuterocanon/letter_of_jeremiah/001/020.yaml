  rationale: 본문은 ειδ한 예배 건물을 지시하는 더 구체적인 단어를 쓰지 않고 일반 명사 οἰκία를 사용합니다. 따라서 해석을 앞서기보다 원문 표면 의미를 보존하는 것이 적절합니다.
