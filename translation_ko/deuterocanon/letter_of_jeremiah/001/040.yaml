  lexicon: LSJ
  rationale: αἰσθέσθαι의 인식·지각 의미를 살리되, 우상의 무능을 드러내는 반어를 자연스러운 한국어로 옮겼습니다.
theological_decisions:
- issue: 벨 앞에 데리고 감(제의적 제시)과 우상의 무능을 드러내는 서술
  chosen_reading: ‘그를 벨 앞으로 데리고 가서’로 옮겨, 단순 이동이 아니라 우상 앞에 제의적으로 내세우는 장면으로 읽었습니다.
  alternative_readings:
  - ‘벨에게 데리고 가서’처럼 단순 방향성으로 읽기
  - ‘벨 앞에 바치고’처럼 더 강한 제의 표현으로 읽기
  rationale: 직역하면 동작의 성격이 흐려지고, 과도하게 의역하면 본문의 조롱적 논지가 세질 수 있으므로, 제의적 제시의 중간 강도로 유지했습니다.
  doctrine_reference: 우상 비판 본문의 수사적 아이러니를 보존합니다.
