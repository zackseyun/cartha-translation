  text: 'Moreover[a], even the Chaldeans themselves dishonor them: whenever they see a mute person unable to speak, they bring him before Bel and ask that he make him speak[c][b], as though he were able to perceive.'
  footnotes:
  - marker: a
    text: Or, 'the Chaldeans themselves dishonor them,' emphasizing that even their own worshipers treat the idols contemptuously.
    reason: lexical_alternative
  - marker: b
    text: Bel was a Babylonian divine name/title associated with Marduk.
    reason: cultural_note
  - marker: c
    text: Or, 'as if he were able to understand' or 'take notice.'
    reason: lexical_alternative
translation:
  language: ko
  text: 더욱이 갈대아 사람들 자신마저[a] 그것들을 모욕합니다. 그들은 말 못 하는 사람, 곧 말할 수 없는 사람을 보면, 벨을[b] 데려와 그 말 못 하는 사람이 말하게 해 달라고 청합니다. 마치 벨이 알아차릴 수라도 있는 것처럼 말입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘갈대아 사람들 자신’은 αὐτῶν τῶν Χαλδαίων의 강조를 반영한 것입니다.
    reason: source_note
  - marker: b
    text: 벨(Bel)은 바벨론의 신 이름 또는 칭호로, 마르둑과 관련된 명칭입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘마치 벨이 알아차릴 수 있는 것처럼’ 또는 ‘마치 벨이 감지할 수 있는 것처럼’.
    reason: alternative_reading
