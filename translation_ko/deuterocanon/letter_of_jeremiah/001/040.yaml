  rationale: 제의적 ‘제시/인도’의 동작을 한국어로 자연스럽게 살리면서, 본문이 요구하는 ‘벨 앞으로’의 의미를 유지했습니다.
- source_word: ὡς δυνατοῦ ὄντος αὐτοῦ αἰσθέσθαι
