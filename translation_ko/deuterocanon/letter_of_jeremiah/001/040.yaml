revisions:
- from: 더욱이 그들의 바로 그 갈대아 사람들마저 그것들을 모욕합니다. 곧 말을 할 수 없는 벙어리를 보게 되면 그를 벨 앞으로 데리고 가서, 그가 그를 말하게 해 달라고 청합니다. 마치 그가 알아차릴 수라도 있는 것처럼 말입니다.[a][b][c]
  to: 더욱이 갈대아 사람들 자신마저[a] 그것들을 모욕합니다. 그들은 말 못 하는 사람, 곧 말할 수 없는 사람을 보면, 벨을[b] 데려와 그 말 못 하는 사람이 말하게 해 달라고 청합니다. 마치 벨이 알아차릴 수라도 있는 것처럼 말입니다.[c]
  rationale: 원문의 명시적 목적어 ‘벨’을 보존하고, 청원의 내용에서 말하게 될 사람을 명시하여 한국어의 대명사 모호성을 제거했습니다. 현대적인 존중 표현으로 바꾸되, ἐνεός와 ‘말할 수 없음’의 중복 묘사, 갈대아 사람들에 대한 강조, 벨의 지각 능력을 전제하는 반어를 모두 유지했습니다.
