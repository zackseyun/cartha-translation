  lexicon: LSJ
  rationale: ἐνεόν과 οὐ δυνάμενον λαλῆσαι의 이중 설명을 살려, ‘벙어리’와 ‘말을 할 수 없는’을 함께 반영했습니다.
- source_word: προσενεγκάμενοι τὸν Βῆλον
