translation:
  language: ko
  text: 따로 앉아 있는 여인들과 산후에 있는 여인들이 그들의 제물에 손을 댑니다. 그러므로[a] 이러한 사실로 그들이 신들이 아님을 알고, 그들을 두려워하지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘의례적으로 분리된 여인들과 해산 후 누워 있는 여인들이 그들의 제물에 손을 댄다’로 옮길 수 있습니다. 그리스어의 첫 표현은 ‘따로 앉아 있다’를 뜻하며 의례적 분리 상태를 시사할 수 있고, 둘째 표현은 일반적으로 산후의 여인을 가리킵니다.
    reason: lexical_alternative
