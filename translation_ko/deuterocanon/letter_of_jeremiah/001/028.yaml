  naturalness: 현 문장은 ‘그들의 제물을 여인들이 떨어져 앉은 채로, 그리고 누운 여인들과 함께 만집니다’에서 수식 범위와 행위 주체가 불명확하고 비문에 가깝습니다. 병렬된 두 부류의 여인이 주어임을 분명히 해야 합니다.
