  chosen_korean: 누운 여인들과 함께
  alternatives_korean:
  - 산후의 여인들과 함께
  - 침상에 있는 여인들과 함께
  - 누워 있는 여인들과 함께
  lexicon: LSJ
  rationale: 문맥상 정결/부정의 상태를 가리키는 압축된 표현이므로, 한국어에서는 ‘누운 여인들과 함께’로 옮겨 관계된 부정한 접촉의 이미지를 드러냈습니다.
