translation:
  language: ko
  text: 그들의 제물을 여인들이 떨어져 앉은 채로, 그리고 누운 여인들과 함께 만집니다. 그러므로[a] 이것들로부터 그들이 신들이 아님을 알고, 그들을 두려워하지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘떨어져 있는 여인들과 침상에 있는 여인들이 그들의 제물을 만진다’로도 볼 수 있습니다. 그리스어가 압축되어 있어 의례적 부정함을 더 직접적으로 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκαθημένη
  english_pob_choice: sitting apart
  chosen_korean: 떨어져 앉은 채로
  alternatives_korean:
  - 따로 앉은 채로
  - 분리되어 앉아
  - 격리된 채로
  lexicon: LSJ
  rationale: 의식적 분리 또는 부정함의 상태를 암시하는 표현이므로, ‘떨어져 앉은 채로’로 원문의 분리 이미지를 살리면서도 과도하게 해석하지 않게 했습니다.
- source_word: λεχὼς
