  text: They touch their sacrifices while sitting apart and lying with women. Therefore[a], knowing from these things that they are not gods, do not fear them.
  footnotes:
  - marker: a
    text: Or possibly, 'while women in seclusion and women in bed touch their sacrifices.' The Greek is compressed and may refer more explicitly to ritual impurity.
