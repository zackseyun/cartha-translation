  lexicon: BDAG
  rationale: 우상 제물과의 접촉이라는 직접적 행위를 가장 간명하게 보여 주는 기본어로 옮겼습니다.
- source_word: μὴ φοβηθῆτε
  english_pob_choice: do not fear
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 무서워하지 마십시오
  - 두려워하지 말십시오
  - 겁내지 마십시오
  lexicon: BDAG
  rationale: 명령형의 직접성을 살리면서 표준적인 현대 경어 표현으로 옮겼습니다.
theological_decisions:
- issue: 여인들의 상태와 우상 제물의 부정함
  chosen_reading: 본문은 여인들이 정결하지 않은 상태로 여겨지는 맥락 속에서 우상 제물을 만지는 장면을 말하며, 그 결과 우상들이 참신이 아님이 드러난다는 논지를 유지합니다.
  alternative_readings:
  - 단순히 여인들이 신전 주변에 앉거나 누워 있는 일반적 장면일 수 있습니다.
  - 정결/부정의 함의를 약화시켜 보다 중립적으로 읽을 수 있습니다.
  rationale: 그리스어의 압축된 병치가 정결/부정의 함의를 강하게 시사하지만, 본문이 그 이상을 명시하지는 않으므로 그 긴장을 그대로 드러내는 번역을 택했습니다.
  doctrine_reference: 본문의 의례적 긴장과 우상 비판을 해소하지 않고 보존합니다.
