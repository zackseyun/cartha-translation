translation:
  language: ko
  text: 나무로 된 것들과 금으로 입힌 것들과 은으로 입힌 것들은 산에서 나온 돌들과 같으며, 그것들을 섬기는 사람들은 수치를 당할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것들을 숭배하는 사람들.’ 그리스어 동사 θεραπεύω는 섬기다와 종교적 숭배를 모두 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς ἀπὸ τοῦ ὄρους λίθοις
  english_pob_choice: stones from the mountain
  chosen_korean: 산에서 나온 돌들
  alternatives_korean:
