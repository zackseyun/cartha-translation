  rationale: 형용사가 명사처럼 쓰인 표현을 직역하되, 한국어에서는 ‘나무로 만든 것들’이 가장 자연스럽고 우상 문맥을 과도하게 덧붙이지 않습니다.
- source_word: τὰ περίχρυσα καὶ τὰ περιάργυρα
  english_pob_choice: the gold-covered and silver-covered things
  chosen_korean: 금 입힌 것들과 은 입힌 것들
  alternatives_korean:
  - 금으로 입힌 것들과 은으로 입힌 것들
  - 금박을 입힌 것들과 은박을 입힌 것들
  lexicon: LSJ
  rationale: περίχρυσος와 περιάργυρος의 ‘겉을 씌우다/입히다’는 의미를 살려, 재질을 덧씌운 외형을 간결하게 드러냈습니다.
- source_word: οἱ δὲ θεραπεύοντες αὐτὰ
  english_pob_choice: those who serve them
  chosen_korean: 그것들을 섬기는 사람들
  alternatives_korean:
  - 그것들을 숭배하는 사람들
  - 그것들을 돌보는 사람들
  lexicon: LSJ
  rationale: θεραπεύω의 넓은 뜻 가운데 본문 문맥상 ‘섬기다’가 가장 잘 맞고, 영어 POB의 ‘serve’와도 대응됩니다.
- source_word: κατασχυνθήσονται
  english_pob_choice: will be put to shame
  chosen_korean: 수치를 당할 것입니다
  alternatives_korean:
  - 부끄러움을 당할 것입니다
  - 수치스럽게 될 것입니다
  lexicon: LSJ
  rationale: 수동 미래의 법정·예언적 뉘앙스를 살리기 위해 ‘수치를 당하다’로 옮겼습니다.
theological_decisions:
- issue: θεραπεύοντες αὐτά의 예배적 뉘앙스
  chosen_reading: 본문에는 ‘섬기는 사람들’로 두어, 우상에 대한 종교적 헌신을 암시하되 번역 본문에서 해석어 ‘숭배하다’로 고정하지 않았습니다.
  alternative_readings:
  - 그것들을 숭배하는 사람들
  - 그것들을 예배하는 사람들
  rationale: 그리스어 θεραπεύω는 ‘섬기다’부터 예배적 섬김까지 포괄할 수 있으므로, 원문의 의미 범위를 보존하는 쪽을 택했습니다.
  doctrine_reference: Translation philosophy §1, §5
