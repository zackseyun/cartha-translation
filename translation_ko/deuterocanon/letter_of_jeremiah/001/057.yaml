translation:
  language: ko
  text: 강한 자들이 그들에게서 금과 은을 빼앗고[a], 그들에게 둘러져 있는 옷을 가지고 떠나갈 것입니다[b]. 그러나 그 우상들은 결코 스스로를 도울 수 없을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘강한 자들’은 ‘권세 있는 자들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들에게 둘러져 있는 옷’은 그들에게 둘러져 있거나 걸쳐 있는 의복을 뜻합니다.
    reason: source_note
lexical_decisions:
- source_word: οἱ ἰσχύοντες
  english_pob_choice: the strong
  chosen_korean: 강한 자들
  alternatives_korean:
  - 힘센 자들
  - 권세 있는 자들
  lexicon: LSJ
  rationale: 현재분사적 실체 표현을 자연스럽게 살리면서, 단순한 신체적 힘과 지배력을 함께 포괄하는 ‘강한 자들’로 옮겼습니다.
- source_word: περιελοῦνται
  english_pob_choice: will strip away
  chosen_korean: 빼앗고
  alternatives_korean:
  - 벗겨 내고
  - 걷어내고
  - 빼앗아
  lexicon: LSJ
  rationale: 우상에게서 금과 은을 강탈하는 문맥이므로, 단순 제거보다 약탈의 함의를 갖는 ‘빼앗고’가 원문 상황을 더 분명히 드러냅니다.
- source_word: τὸν ἱματισμὸν τὸν περικείμενον αὐτοῖς
  english_pob_choice: the clothing that is wrapped around them
  chosen_korean: 그들 위에 걸쳐진 옷
  alternatives_korean:
  - 그들 주위에 둘러진 옷
  - 그들에게 걸린 옷
  lexicon: LSJ
  rationale: περικείμενον의 ‘둘러 있음/걸쳐 있음’ 이미지를 살리되 과도하게 구체화하지 않기 위해 ‘그들 위에 걸쳐진 옷’으로 옮겼습니다.
- source_word: οὔτε ἑαυτοῖς οὐ μὴ βοηθήσωσιν
  english_pob_choice: they certainly will not help themselves
  chosen_korean: 그들은 결코 자기 자신을 도울 수 없습니다
  alternatives_korean:
  - 그들은 결코 스스로를 도울 수 없습니다
  - 그들은 절대로 자기들에게 도움을 주지 못합니다
  lexicon: LSJ
  rationale: οὐ μὴ의 강한 부정을 한국어의 단호한 부정으로 옮겨, 우상의 무력함을 분명하게 드러냈습니다.
theological_decisions:
- issue: 우상의 무력함을 드러내는 반사 대명사
  chosen_reading: ‘자기 자신을’은 우상들이 스스로를 구하거나 보호하지 못한다는 점을 강조하는 것으로 읽었습니다.
  alternative_readings:
  - 일반적인 무력함에 대한 보편적 진술로 완화해 읽을 수 있습니다.
  rationale: 문맥 전체가 우상 비판이므로, 반사적 표현을 약화하지 않고 원문의 조롱적·논박적 힘을 유지했습니다.
