  chosen_reading: ‘자기 자신을’은 우상들이 스스로를 구하거나 보호하지 못한다는 점을 강조하는 것으로 읽었습니다.
  alternative_readings:
  - 일반적인 무력함에 대한 보편적 진술로 완화해 읽을 수 있습니다.
  rationale: 문맥 전체가 우상 비판이므로, 반사적 표현을 약화하지 않고 원문의 조롱적·논박적 힘을 유지했습니다.
  doctrine_reference: 원문 우선 및 문맥적 신학 긴장 보존
