translation:
  language: ko
  text: 그들에게서 강한 자들이 금과 은을 빼앗고, 그들 위에 걸쳐진 옷을 가지고 떠나가겠지만, 그들은 결코 자기 자신을 도울 수 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘강한 자들’은 영어 POB의 ‘the strong’에 대응하며, 문맥상 ‘권세 있는 자들’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘그들 위에 걸쳐진 옷’은 περικείμενον의 ‘둘러진/걸쳐진’ 이미지를 보존한 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: οἱ ἰσχύοντες
  english_pob_choice: the strong
  chosen_korean: 강한 자들
  alternatives_korean:
  - 힘센 자들
  - 권세 있는 자들
  lexicon: LSJ
  rationale: 현재분사적 실체 표현을 자연스럽게 살리면서, 단순한 신체적 힘과 지배력을 함께 포괄하는 ‘강한 자들’로 옮겼습니다.
- source_word: περιελοῦνται
  english_pob_choice: will strip away
  chosen_korean: 빼앗고
  alternatives_korean:
  - 벗겨 내고
  - 걷어내고
  - 빼앗아
  lexicon: LSJ
  rationale: 우상에게서 금과 은을 강탈하는 문맥이므로, 단순 제거보다 약탈의 함의를 갖는 ‘빼앗고’가 원문 상황을 더 분명히 드러냅니다.
- source_word: τὸν ἱματισμὸν τὸν περικείμενον αὐτοῖς
  english_pob_choice: the clothing that is wrapped around them
  chosen_korean: 그들 위에 걸쳐진 옷
  alternatives_korean:
  - 그들 주위에 둘러진 옷
  - 그들에게 걸린 옷
  lexicon: LSJ
  rationale: περικείμενον의 ‘둘러 있음/걸쳐 있음’ 이미지를 살리되 과도하게 구체화하지 않기 위해 ‘그들 위에 걸쳐진 옷’으로 옮겼습니다.
- source_word: οὔτε ἑαυτοῖς οὐ μὴ βοηθήσωσιν
  english_pob_choice: they certainly will not help themselves
  chosen_korean: 그들은 결코 자기 자신을 도울 수 없습니다
  alternatives_korean:
  - 그들은 결코 스스로를 도울 수 없습니다
  - 그들은 절대로 자기들에게 도움을 주지 못합니다
  lexicon: LSJ
  rationale: οὐ μὴ의 강한 부정을 한국어의 단호한 부정으로 옮겨, 우상의 무력함을 분명하게 드러냈습니다.
