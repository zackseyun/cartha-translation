  text: Therefore[a], if one of them falls to the ground, they cannot raise themselves up; and if someone sets it upright, it will not move by itself; and if it is tilted, it will certainly not be made straight. Rather[b], gifts are set before them as before the dead.
  footnotes:
  - marker: a
    text: Or, more literally, 'lest it fall to the ground, to rise through themselves'; the sense is that if an idol falls, it cannot get itself up.
    reason: lexical_alternative
  - marker: b
    text: '''Gifts'' may also be rendered ''offerings'' in this cultic context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로[a] 그들 중 하나가 땅에 떨어지면 스스로 일어나지 못하고, 누가 그것을 세워도 그것은 스스로 움직이지 못하며, 그것이 기울면 결코 바로 세워지지 못합니다. 그러나[b] 죽은 이들에게 하듯이 그들 앞에 예물을 차려 놓습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 매우 압축되어 있어 직역하면 ‘땅에 떨어질까 하여, 스스로 일어서다’ 정도입니다. 문맥상 우상이 땅에 떨어지면 자기 힘으로 다시 일어설 수 없다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘예물’은 이 제의적 문맥에서 ‘제물’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τό
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이 때문에
  - 따라서
  lexicon: LSJ
  rationale: 앞 절의 우상 무력함을 근거로 결론을 이끄는 접속사이므로, 현대 한국어에서 가장 자연스럽고 논리 관계가 분명한 ‘그러므로’를 택했습니다.
- source_word: μή ποτε ἐπὶ τὴν γῆν πέσῃ ... ἀνίστασθαι
  english_pob_choice: if one of them falls to the ground, they cannot raise themselves up
  chosen_korean: 그들 중 하나가 땅에 떨어지면 스스로 일어나지 못하고
  alternatives_korean:
  - 땅에 떨어져도 스스로 일어서지 못하고
  - 땅에 넘어지면 스스로 일어나지 못하고
  lexicon: LSJ
  rationale: 그리스어의 ‘스스로 일어남’이라는 무력함을 살리기 위해 ‘스스로 일어나지 못하고’로 옮겼고, 우상 하나를 가리키는 반복적 일반화를 자연스럽게 처리했습니다.
- source_word: δι' αὐτῶν
  english_pob_choice: raise themselves up
  chosen_korean: 스스로
  alternatives_korean:
  - 자기 힘으로
  - 저들 자신으로
  lexicon: LSJ
  rationale: 직역하면 어색하므로, 자기 스스로 동작을 일으키지 못한다는 뜻을 간결하게 드러내는 ‘스스로’를 사용했습니다.
- source_word: τὰ δῶρα αὐτοῖς παρατίθεται
  english_pob_choice: gifts are set before them
  chosen_korean: 그들 앞에 예물을 차려 놓습니다
  alternatives_korean:
  - 그들 앞에 선물을 놓습니다
  - 그들 앞에 제물을 바칩니다
  lexicon: LSJ
  rationale: δῶρα는 이 우상 숭배 문맥에서 ‘예물/제물’의 뉘앙스를 가지므로, 단순한 선물보다 제의적 의미를 살린 ‘예물’을 택했습니다. παρατίθεται는 식탁에 차리듯 앞에 놓는 동작을 나타내어 ‘차려 놓습니다’가 자연합니다.
theological_decisions:
- issue: 우상에 대한 의인화와 복수 지시 대상의 처리
  chosen_reading: 문맥상 우상들을 집합적으로 말하되, 각 조건절에서는 ‘하나’와 ‘그것’을 써서 개별 우상의 무력함을 드러냈습니다.
  alternative_readings:
  - 처음부터 끝까지 복수형으로 옮기기
  - 전부 단수로 옮겨 대표적 우상 하나만 가리키기
  rationale: 그리스어는 일반적 기술 속에서 단수·복수가 섞여 나타나므로, 한국어에서는 자연스러운 문장 흐름과 원문의 일반화 효과를 함께 살리는 쪽이 가장 충실합니다.
  doctrine_reference: 'Translation philosophy: readable modern Korean, preserving source force without smoothing the imagery.'
