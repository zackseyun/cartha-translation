  text: And their priests[a], taking back their sacrifices, make use of them; likewise their women, preserving some from them[b], give none to the poor or the helpless.
  footnotes:
  - marker: a
    text: Or 'receiving back their sacrifices.' The Greek participle can denote reclaiming or receiving the offerings for their own use.
    reason: lexical_alternative
  - marker: b
    text: The verb translated 'preserving' likely refers to preserving food by salting or curing.
    reason: cultural_note
translation:
  language: ko
  text: 그들의 제사장들은 자기들의 희생제물을 다시 가져다가 그것으로 제 욕을 채웁니다. 또한 그 여자들은 그것들 가운데서 보존한 것을 가난한 사람에게도, 힘없는 사람에게도 나누어 주지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기들의 희생제물을 다시 받아서’. 그리스어 분사는 제물로 바쳐진 것을 되돌려 받는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기의 ‘보존한’은 아마도 소금을 치거나 절여서 음식으로 보존한 것을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποδιδόμενοι
  english_pob_choice: taking back
  chosen_korean: 다시 가져다가
  alternatives_korean:
  - 되돌려 받아
  - 회수하여
  - 다시 받으며
  lexicon: LSJ
  rationale: 희생제물을 제사장들이 다시 자기 쪽으로 돌려받는 뜻을 살리기 위해, 반환과 재취득의 뉘앙스를 담은 표현으로 옮겼습니다.
- source_word: καταχρῶνται
  english_pob_choice: make use of
  chosen_korean: 제 욕을 채웁니다
  alternatives_korean:
  - 이용합니다
  - 마음대로 씁니다
  - 남용합니다
  lexicon: LSJ
  rationale: 단순 사용보다 제사장들이 그것을 자기 목적에 써 버린다는 비판적 뉘앙스를 드러내기 위해, 문맥상 강한 자기 이익 취득 표현을 택했습니다.
- source_word: ταριχεύουσαι
  english_pob_choice: preserving
  chosen_korean: 보존한 것을
  alternatives_korean:
  - 절여 둔 것을
  - 저장한 것을
  - 간하여 둔 것을
  lexicon: LSJ
  rationale: 고대의 염장·보존 관행을 특정 방식으로 한정하지 않으면서, 음식을 오래 두기 위해 처리한 것을 가리키는 일반적 의미를 살렸습니다.
- source_word: ἀδυνάτῳ
  english_pob_choice: the helpless
  chosen_korean: 힘없는 사람
  alternatives_korean:
  - 무력한 사람
  - 도울 수 없는 사람
  - 연약한 사람
  lexicon: BDAG
  rationale: 문맥상 힘이나 형편이 부족한 사람을 가리키므로, ‘가난한 사람’과 짝을 이루는 자연스러운 현대 한국어로 옮겼습니다.
theological_decisions:
- issue: 제사장과 여자들의 행동에 대한 비판의 강도
  chosen_reading: 본문의 묘사 어조를 유지하되, ‘제 욕을 채웁니다’로 문맥상 자기중심적 착취를 드러냈습니다.
  alternative_readings:
  - ‘남용합니다’로 더 직접적으로 비난을 표현할 수 있음
  - ‘사용합니다’로 중립적으로 옮길 수 있음
  rationale: 그리스어는 직접적인 평가어보다 행동 묘사를 통해 우상숭배의 부조리를 드러내므로, 과도한 해설 없이도 비판성이 보이도록 옮겼습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
