  lexicon: BDAG
  rationale: μετά + 속격의 기본 의미를 살려, 동행과 보호의 뉘앙스를 가장 सीधे하게 나타내는 표현으로 옮겼습니다.
- source_word: ἐκζητῶν
  english_pob_choice: is seeking
  chosen_korean: 찾고 있습니다
  alternatives_korean:
  - 살피고 있습니다
  - 지키고 있습니다
  - 돌보고 있습니다
  lexicon: BDAG
  rationale: 동사의 핵심인 ‘찾다/구하다’를 유지하되, 여기서는 단순 탐색이 아니라 생명 보존을 위한 능동적 관심이므로 한국어에서는 자연스럽게 ‘찾고 있습니다’로 옮겼습니다.
- source_word: τὰς ψυχὰς ὑμῶν
  english_pob_choice: your lives
