translation:
  language: ko
  text: 그런데 내 천사가 너희와 함께 있습니다. 그가 바로 너희 생명을 찾고 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희 영혼’. 헬라어 ψυχαί는 ‘영혼’, ‘생명’, ‘사람’ 등을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελός
  english_pob_choice: angel
  chosen_korean: 천사
  alternatives_korean:
  - 사자
  - 메신저
  lexicon: BDAG
  rationale: 하나님의 보호적 동행을 말하는 문맥이므로 인간 ‘사자’보다 초월적 존재를 가리키는 ‘천사’가 더 자연스럽습니다.
- source_word: μεθʼ ὑμῶν
  english_pob_choice: with you
  chosen_korean: 너희와 함께
  alternatives_korean:
  - 너희 가운데
  - 너희와
  lexicon: BDAG
  rationale: μετά + 속격의 기본 의미를 살려, 동행과 보호의 뉘앙스를 가장 सीधे하게 나타내는 표현으로 옮겼습니다.
- source_word: ἐκζητῶν
  english_pob_choice: is seeking
  chosen_korean: 찾고 있습니다
  alternatives_korean:
  - 살피고 있습니다
  - 지키고 있습니다
  - 돌보고 있습니다
  lexicon: BDAG
  rationale: 동사의 핵심인 ‘찾다/구하다’를 유지하되, 여기서는 단순 탐색이 아니라 생명 보존을 위한 능동적 관심이므로 한국어에서는 자연스럽게 ‘찾고 있습니다’로 옮겼습니다.
- source_word: τὰς ψυχὰς ὑμῶν
  english_pob_choice: your lives
  chosen_korean: 너희 생명
  alternatives_korean:
  - 너희 영혼
  - 너희 목숨
  - 너희들
  lexicon: BDAG
  rationale: ψυχή는 ‘생명, 목숨, 영혼, 존재’ 등을 뜻할 수 있지만, 이 문맥에서는 추상적 영혼보다 실제적 보존을 가리키는 ‘생명’이 더 적절합니다.
theological_decisions:
- issue: ψυχή의 의미를 ‘영혼’으로 고정할지 여부
  chosen_reading: ‘너희 생명’으로 번역하여 육체적 보존의 의미를 드러냅니다.
  alternative_readings:
  - 너희 영혼
  - 너희 목숨
  rationale: 본문은 포로 공동체를 향한 보호 약속의 성격이 강하므로, 후대의 이분법적 ‘영혼’ 개념을 앞세우기보다 원문의 실제 보호 의미를 살리는 것이 더 적절합니다.
  doctrine_reference: 원문 우선, 의미 범위 보존
