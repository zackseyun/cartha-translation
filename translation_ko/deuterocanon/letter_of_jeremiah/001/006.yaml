  lexicon: BDAG
  rationale: 하나님의 보호적 동행을 말하는 문맥이므로 인간 ‘사자’보다 초월적 존재를 가리키는 ‘천사’가 더 자연스럽습니다.
- source_word: μεθʼ ὑμῶν
