  verdict: revise
  source_fidelity: 원문의 γάρ는 역접의 ‘그런데’가 아니라 이유를 나타내므로 ‘이는/왜냐하면’으로 옮겨야 합니다. αὐτός의 강조는 ‘친히’로, μεθʼ ὑμῶν은 ‘너희와 함께’로 자연스럽게 반영했습니다. ἐκζητῶν을 직역한 ‘생명을 찾고 있습니다’는 한국어에서 생명을 빼앗거나 잃어버린 생명을 수색하는 뜻으로 오해되기 쉬우므로, 문맥상 돌봄을 위한 관심이라는 의미를 드러내어 ‘살피고 있습니다’로 옮겼습니다. ψυχὰς의 의미 범위는 본문에서 ‘생명’으로 두고 각주에 ‘영혼’을 보존했습니다.
