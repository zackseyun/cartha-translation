  alternatives_korean:
  - 너희 영혼
  - 너희 목숨
  - 너희들
  lexicon: BDAG
  rationale: ψυχή는 ‘생명, 목숨, 영혼, 존재’ 등을 뜻할 수 있지만, 이 문맥에서는 추상적 영혼보다 실제적 보존을 가리키는 ‘생명’이 더 적절합니다.
