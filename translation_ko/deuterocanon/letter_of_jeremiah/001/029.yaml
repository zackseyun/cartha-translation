  - marker: b
    text: παρατιθέασιν은 “앞에 놓다”, “제시하다”의 뜻도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πόθεν ... κληθείησαν
  english_pob_choice: How could they be called
  chosen_korean: 어찌 신이라 불릴 수 있겠습니까?
  alternatives_korean:
  - 어디에서 신이라 불릴 수 있겠습니까?
  - 어찌 신이라 불리겠습니까?
  lexicon: LSJ
  rationale: Πόθεν ... κληθείησαν의 수사적 불가능성을 한국어에서는 자연스러운 반문인 ‘어찌 … 불릴 수 있겠습니까?’로 옮겨, 원문의 논지를 유지했습니다.
- source_word: θεοί
  english_pob_choice: gods
  chosen_korean: 신
  alternatives_korean:
  - 신들
  - 하나님들
  - 우상
  lexicon: LSJ
  rationale: 원문은 우상 비판 속에서도 신들을 뜻하는 θεοί를 그대로 사용하므로, 한국어에서도 ‘우상’으로 풀어버리기보다 반어적 긴장을 살린 ‘신’이 적절합니다.
- source_word: παρατιθέασιν
  english_pob_choice: set out offerings for
  chosen_korean: 제물을 차려 놓고
  alternatives_korean:
  - 앞에 놓고
  - 바쳐 놓고
  - 제물을 드리고
  lexicon: LSJ
  rationale: dative와 함께 쓰인 παρατιθέασιν의 예배적 배치 의미를 살려, 단순한 ‘놓다’보다 제의적 행동이 드러나는 ‘제물을 차려 놓고’로 옮겼습니다.
- source_word: θεοῖς ἀργυροῖς καὶ χρυσοῖς καὶ ξυλίνοις
  english_pob_choice: silver and gold and wooden gods
  chosen_korean: 은과 금과 나무로 된 신들
  alternatives_korean:
  - 은과 금과 나무 신들
  - 은, 금, 나무로 만든 신들
  - 은과 금과 나무 우상
  lexicon: LSJ
  rationale: 원문은 재료를 나열하며 ‘신들’이라고 반복하므로, 한국어도 재료를 먼저 제시하고 ‘나무로 된 신들’로 마무리해 반어성을 유지했습니다.
theological_decisions:
- issue: θεοί를 ‘우상’으로 완전히 치환할지 여부
  chosen_reading: ‘신’으로 유지하여 원문의 반어를 보존합니다.
  alternative_readings:
  - 우상
  - 거짓 신
  rationale: 원문은 우상 비판이지만 실제로는 θεοί를 사용해 그 주장 자체를 뒤집고 있습니다. 한국어에서 이를 곧바로 ‘우상’으로 바꾸면 논증의 날카로움이 약해집니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: παρατιθέασιν의 제의적 의미를 얼마나 드러낼지
  chosen_reading: ‘제물을 차려 놓고’로 최소한의 제의성을 명시합니다.
  alternative_readings:
  - 앞에 놓고
  - 바치고
  - 제사 지내고
  rationale: 문맥상 단순 배치가 아니라 우상 숭배의 제의 행위이므로, 독자가 행동의 성격을 놓치지 않도록 ‘제물’을 보탰습니다.
  doctrine_reference: Translation philosophy §6
