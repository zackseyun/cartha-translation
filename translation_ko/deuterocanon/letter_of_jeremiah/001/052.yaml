lexical_decisions:
- source_word: βασιλέα
  english_pob_choice: a king
  chosen_korean: 왕
  alternatives_korean:
  - 어떤 왕
  - 한 왕
  lexicon: LSJ
  rationale: 문맥상 무정관사적 의미를 살려 특정 인물을 가리키지 않는 일반적인 ‘왕’으로 옮겼습니다.
- source_word: χώρας
  english_pob_choice: for a land
  chosen_korean: 어떤 땅을 위해서도
  alternatives_korean:
  - 나라를 위해서도
  - 지역을 위해서도
  lexicon: LSJ
  rationale: χώρας는 땅, 나라, 지역을 포괄할 수 있으므로, 현대 한국어에서 가장 넓고 자연스러운 ‘땅’으로 유지하되 목적격 조사와 함께 문맥의 범위를 살렸습니다.
- source_word: οὐ μὴ ἀναστήσωσιν
  english_pob_choice: will certainly not raise up
  chosen_korean: 세우지 못하며
  alternatives_korean:
  - 결코 세우지 못하며
  - 일으켜 세우지 못하며
  lexicon: BDAG
  rationale: οὐ μή + 접속법의 강한 부정을 한국어에서 자연스러운 불가능 진술로 옮겼습니다. ‘세우다’는 왕을 임명·수립하는 의미를 잘 드러냅니다.
- source_word: ἀνθρώποις
  english_pob_choice: to men
  chosen_korean: 사람들에게
  alternatives_korean:
  - 사람들에게
  - 인간들에게
  lexicon: BDAG
  rationale: 그리스어 복수형은 보편적 인간 일반을 가리키므로, 한국어에서는 성별 표지를 억지로 드러내기보다 일반 독해가 자연스러운 ‘사람들에게’를 택했습니다.
theological_decisions:
- issue: 우상 신들의 무능을 강조하는 부정의 강도
  chosen_reading: 우상들은 왕도 세우지 못하고 비도 내리지 못하는 존재로 제시됩니다.
  alternative_readings:
  - 단순한 능력 부족 진술로 완화할 수 있습니다.
  - 문화적 풍자 정도로 약화할 수 있습니다.
  rationale: 본문의 이중 부정(οὐ μὴ ... οὔτε οὐ μὴ ...)은 단순한 약한 부정이 아니라 철저한 무능을 강조하므로, 한국어에서도 그 강도를 보존해야 합니다.
  doctrine_reference: Letter of Jeremiah의 우상 비판 문맥
