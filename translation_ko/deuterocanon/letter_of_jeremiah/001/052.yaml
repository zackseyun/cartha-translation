review_pass:
  verdict: revise
  source_fidelity: 그리스어의 οὐ μὴ ... οὔτε ... οὐ μὴ는 두 행위 모두에 대한 강한 미래 부정입니다. 초안의 ‘못하며/못합니다’는 무능의 뜻을 전달하지만, ‘결코’를 더해 강조를 명시하는 것이 적절합니다. 또한 χώρας의 범위는 ‘땅’으로 보존할 수 있으나, ‘어떤 ...도’는 원문의 무정관·단수 표현보다 범위를 다소 확대합니다.
  naturalness: ‘비를 내리다’와 ‘왕을 세우다’는 현대 표준 한국어에서 자연스럽습니다. ‘결코 … 못하고 … 못합니다’는 합쇼체에서 강한 부정을 분명하고 매끄럽게 전달합니다.
  terminology: ‘왕’, ‘땅’, ‘사람들’은 각각 βασιλέα, χώρας, ἀνθρώποις에 적절합니다. ‘사람들’은 성별을 특정하지 않는 인간 일반이라는 문맥적 의미를 자연스럽게 나타냅니다.
