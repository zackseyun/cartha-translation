  text: But now in Babylon you will see gods of silver and gold and wood[a], being carried on shoulders, showing fear to the nations.
  footnotes:
  - marker: a
    text: Or 'causing fear to the nations' / 'inspiring fear among the nations.' The Greek literally says 'showing fear to the nations,' which may describe either the display itself or its effect on observers.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이제 여러분은 바빌론에서 은과 금과 나무로 된 신들이 어깨에 메여 옮겨지는 것과, 민족들에게 두려움을 보이는 것을 보게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘민족들에게 두려움을 보이는’입니다. 문맥상 우상 행렬이 민족들에게 두려움을 일으킨다는 뜻일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  english_pob_choice: But now
  chosen_korean: 그러나 이제
  alternatives_korean:
  - 이제
  - 그리고 이제
  lexicon: LSJ
  rationale: δέ의 대조와 νυνί의 시급성을 함께 살리기 위해 ‘그러나 이제’로 옮겼습니다.
- source_word: ὄψεσθε
  english_pob_choice: you will see
  chosen_korean: 보게 될 것입니다
  alternatives_korean:
  - 보실 것입니다
  - 보게 됩니다
  lexicon: LSJ
  rationale: 미래형의 예고를 자연스러운 합쇼체로 옮겼습니다.
- source_word: θεοὺς ἀργυροῦς καὶ χρυσοῦς καὶ ξυλίνους
  english_pob_choice: gods of silver and gold and wood
  chosen_korean: 은과 금과 나무로 된 신들
  alternatives_korean:
  - 은과 금과 나무로 만든 신들
  - 은, 금, 나무의 신들
  lexicon: LSJ
  rationale: θεοὺς를 ‘신들’로 직접 옮기고, 재질 형용사는 한국어 자연성에 맞게 ‘-로 된’ 구조로 풀었습니다.
- source_word: δεικνύντας φόβον τοῖς ἔθνεσιν
  english_pob_choice: showing fear to the nations
  chosen_korean: 민족들에게 두려움을 보이는 것을
  alternatives_korean:
  - 민족들에게 두려움을 보여 주는 것을
  - 민족들에게 공포를 일으키는 것을
  lexicon: LSJ
  rationale: 직역 성격의 ‘보이는’과 수신처인 ‘민족들에게’를 살려 원문이 지닌 표현의 긴장을 보존했습니다.
theological_decisions:
- issue: θεοὺς의 번역을 ‘신들’로 유지할지 ‘우상들’로 해석할지
  chosen_reading: 신들
  alternative_readings:
  - 우상들
  rationale: 원문은 비판적 판정을 미리 붙이지 않고 θεοὺς를 그대로 말하므로, 조롱의 효과를 살리기 위해 ‘신들’로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: 원문 우선성과 해석의 분리'
- issue: δεικνύντας φόβον τοῖς ἔθνεσιν의 방향성을 어떻게 살릴지
  chosen_reading: 민족들에게 두려움을 보이는 것
  alternative_readings:
  - 민족들에게 두려움을 일으키는 것
  - 민족들에게 두려움을 주는 것
  rationale: 문구의 문자적 구조를 보존해, 이 표현이 두려움을 ‘표시’하는지 ‘유발’하는지의 긴장을 해설로 고정하지 않도록 했습니다.
  doctrine_reference: 'DOCTRINE.md: 신학적 긴장을 해소하지 말고 보존하기'
