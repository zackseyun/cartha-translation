review_pass:
  verdict: revise
  source_fidelity: 원문의 인과 관계와 ‘집에서 나온 먼지’를 유지하되, 현행문의 ‘집의 먼지’는 먼지의 출처를 다소 불분명하게 하고 ‘더 많이 쌓여’는 비교 기준이 없는 ‘더’를 부자연스럽게 남깁니다. ‘집에서 나온 먼지’와 ‘많이 쌓여’가 원문의 뜻을 더 정확하고 자연스럽게 전달합니다.
  naturalness: 합쇼체 문체는 적절합니다. 다만 ‘집의 먼지가 그들 위에 더 많이 쌓여 있으므로’는 수식 관계와 비교 표현이 어색합니다. ‘집에서 나온 먼지가 자기들 위에 많이 쌓여 있기 때문에’가 현대 표준 한국어로 자연스럽습니다.
  terminology: οἰκία를 ‘집’으로 보존한 것은 적절하며, ‘성전’이나 ‘신당’으로 구체화할 필요가 없습니다. ἐκμάσσονται는 ‘닦아 냅니다’로 옮길 수 있습니다. 본문은 그리스어의 문법적 주어를 그대로 유지하므로 우상이 스스로 행동하는 듯한 풍자적 표면도 불필요하게 해소하지 않습니다.
  issues:
