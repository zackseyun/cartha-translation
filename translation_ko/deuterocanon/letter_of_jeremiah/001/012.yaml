    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκμάσσονται
  english_pob_choice: they wipe off
  chosen_korean: 닦아 냅니다
  alternatives_korean:
  - 닦아 냅니다
  - 털어 냅니다
  - 닦아 없앱니다
  lexicon: LSJ
  rationale: 얼굴에 묻은 먼지를 손으로 닦아 내는 구체적 동작을 자연스럽게 살리기 위해 ‘닦아 냅니다’를 택했습니다. 'wipe off'의 직접성을 유지하면서도 한국어 문장으로 매끈합니다.
- source_word: τὸ πρόσωπον αὐτῶν
  english_pob_choice: their faces
  chosen_korean: 자기들의 얼굴
  alternatives_korean:
  - 그들의 얼굴
  - 얼굴
  - 자기 얼굴
  lexicon: LSJ
  rationale: 그 대상이 우상들이라는 문맥을 고려하면 단순히 ‘그들의’보다 ‘자기들의’가 지시 관계를 더 분명히 해 줍니다. 단수/복수의 영어식 자연화를 과도하게 끌지 않고 얼굴의 이미지도 보존합니다.
- source_word: ἐκ τῆς οἰκίας
  english_pob_choice: from the house
  chosen_korean: 집의
  alternatives_korean:
  - 집에서 나온
  - 성전의
  - 신당의
  lexicon: LSJ
  rationale: 원문은 ‘집’이라고만 말하므로, 문맥상 신상들이 놓인 건물이더라도 구체화된 ‘성전/신당’보다 ‘집의’가 더 원문에 가깝습니다. 영어 POB의 보존적 선택을 한국어에서도 따랐습니다.
- source_word: ὃς ἐστιν πλείω ἐπʼ αὐτοῖς
  english_pob_choice: which is thick upon them
  chosen_korean: 그들 위에 더 많이 쌓여 있으므로
  alternatives_korean:
  - 그들 위에 더 두껍게 덮여 있으므로
  - 그들 위에 더 많이 있으므로
  - 그들 위에 무겁게 얹혀 있으므로
  lexicon: LSJ
  rationale: πλείω는 문자적으로 ‘더 많다’이지만, 여기서는 먼지가 우상 위에 과도하게 쌓인 상태를 가리킵니다. ‘더 많이 쌓여’는 수량적 과잉과 시각적 감각을 함께 살려 영어의 idiomatic 의미를 한국어로 옮깁니다.
theological_decisions:
- issue: 우상들이 '닦는' 주체로 보일 수 있는 표현
  chosen_reading: 문맥상 실제 행위자는 우상을 돌보는 사람들로 이해하고, 한국어에서는 그 행동을 자연스럽게 서술했습니다.
  alternative_readings:
  - 우상들이 스스로 얼굴을 닦습니다
  - 그들이 우상의 얼굴을 닦습니다
  rationale: 본문의 풍자는 우상이 스스로 아무것도 할 수 없다는 데 있으므로, 주어를 그대로 두되 한국어에서는 문맥상 자명한 행위자를 따로 강조하지 않는 방식이 가장 적절합니다.
  doctrine_reference: Translation philosophy §1, §6
