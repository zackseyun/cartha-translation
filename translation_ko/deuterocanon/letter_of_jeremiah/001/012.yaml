    issue: ‘집의 먼지’가 ἐκ τῆς οἰκίας의 출처 관계를 충분히 드러내지 못함
    rationale: 전치사 ἐκ은 먼지가 ‘집에서 나온’ 것임을 나타냅니다. ‘집에서 나온 먼지’가 더 명료하고 원문에 가깝습니다.
  - severity: medium
    issue: ‘더 많이 쌓여’의 비교 표현이 한국어에서 부자연스러움
    rationale: πλείω의 문자적 비교 뉘앙스는 문맥상 먼지의 많은 양을 뜻합니다. 한국어 본문에서는 ‘많이 쌓여’로 자연화하고, 문자적 표현은 각주에서 보존하는 것이 적절합니다.
  - severity: low
    issue: 각주의 ‘더 많은 것’ 표현이 원문의 먼지 지시를 흐림
    rationale: 관계절은 먼지를 가리키므로 ‘그들 위에 더 많이 있는’이라고 옮기고, 이것이 먼지가 많이 쌓였다는 뜻임을 설명하는 편이 명료합니다.
  revised_text: 그들은 집에서 나온 먼지가 자기들 위에 많이 쌓여 있기 때문에 자기들의 얼굴을 닦아 냅니다.[a]
