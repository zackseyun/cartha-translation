  text: How then can it be accepted or supposed that they are gods? Wooden gods overlaid with silver and overlaid with gold will certainly not save themselves from thieves or robbers[a][b].
  footnotes:
  - marker: a
    text: Or, 'How then is it to be accepted or considered that they are gods?' The Greek uses two verbal adjectives to press the rhetorical question.
    reason: lexical_alternative
  - marker: b
    text: The Greek says 'wooden gods, silver-covered and gold-covered,' preserving the irony that these supposed gods are merely crafted objects.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 어떻게 그것들을 신들이라고 인정하거나 여길 수 있겠습니까? 나무로 된 신들, 은과 금으로 입힌 신들은 도둑들에게서도 강도들에게서도 결코 자신들을 구해 내지 못할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그러면 어떻게 그것들을 신들이라고 받아들이거나 여길 수 있겠습니까?’ 그리스어는 두 동사형 형용사를 사용하여 수사적 질문을 강하게 제기합니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 직역하면 ‘나무로 된 신들, 은으로 둘러 입힌 신들, 금으로 둘러 입힌 신들’이라고 하여, 이 신들이 나무와 금속으로 만들어진 물체임을 강조합니다.
    reason: lexical_alternative
