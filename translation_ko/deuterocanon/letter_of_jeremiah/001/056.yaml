base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/056.yaml
  text: How then can it be accepted or supposed that they are gods? Wooden gods overlaid with silver and overlaid with gold will certainly not save themselves from thieves or robbers[a][b].
  footnotes:
  - marker: a
    text: Or, 'How then is it to be accepted or considered that they are gods?' The Greek uses two verbal adjectives to press the rhetorical question.
    reason: lexical_alternative
  - marker: b
    text: The Greek says 'wooden gods, silver-covered and gold-covered,' preserving the irony that these supposed gods are merely crafted objects.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 어떻게 그들이 신들로 받아들여지거나 그렇게 여겨질 수 있겠습니까? 도둑이나 강도에게서도 스스로를 구해 내지 못하는, 나무로 만든 신들, 은으로 입히고 금으로 입힌 신들입니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그러면 어떻게 그들이 신들로 받아들여지거나 여겨질 수 있습니까?’ 그리스어는 두 개의 수동적 성격의 분사형 형용사로 수사적 질문을 압박합니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘나무로 된 신들, 은으로 덮인 신들, 금으로 덮인 신들’이라고 말해, 이른바 신들이 사실은 손으로 만든 물체라는 아이러니를 유지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς οὖν ἐκδεκτέον ἢ νομιστέον
  english_pob_choice: How then can it be accepted or supposed
  chosen_korean: 그러면 어떻게 그들이 신들로 받아들여지거나 그렇게 여겨질 수 있겠습니까?
  alternatives_korean:
  - 그러면 어떻게 그들이 신들로 인정되거나 여겨질 수 있겠습니까?
  - 그러면 어찌 그들이 신들이라고 받아들여지거나 생각될 수 있겠습니까?
  lexicon: LSJ
  rationale: 두 분사형 형용사의 수사적 질문을 한국어의 가능·수용 표현으로 살려, ‘받아들여지거나 그렇게 여겨질 수 있겠습니까’로 자연스럽게 옮겼습니다.
- source_word: θεοί
  english_pob_choice: gods
  chosen_korean: 신들
  alternatives_korean:
  - 하나님들
  - 신상들
  - 우상들
  lexicon: LSJ
  rationale: 원문은 조롱의 대상인 ‘θεοί’를 그대로 문제 삼으므로, 해석어인 ‘우상들’보다 원문 어휘를 따라 ‘신들’로 유지했습니다.
- source_word: οὔτε ἀπὸ κλεπτῶν οὔτε ἀπὸ ληστῶν
  english_pob_choice: from thieves or robbers
  chosen_korean: 도둑이나 강도에게서도
  alternatives_korean:
  - 도둑이나 강도에게서도
  - 도둑들에게서도 강도들에게서도
  - 절도범이나 약탈자에게서도
  lexicon: LSJ
  rationale: οὔτε...οὔτε의 부정 병렬을 한국어의 ‘-에게서도’와 ‘도/나’ 구문으로 압축해, 둘 다로부터 전혀 구출되지 못한다는 뜻을 살렸습니다.
- source_word: οὐ μὴ διασώσωνται
  english_pob_choice: will certainly not save themselves
  chosen_korean: 스스로를 구해 내지 못하는
  alternatives_korean:
  - 결코 자신들을 구해 내지 못하는
  - 반드시 스스로를 구원하지 못할
  lexicon: LSJ
  rationale: 강한 부정(οὐ μή)을 반영해 가능성을 완전히 차단하면서, 문맥상 아이러니를 드러내기 위해 ‘스스로를 구해 내지 못하는’으로 옮겼습니다.
- source_word: θεοὶ ξύλινοι καὶ περιάργυροι καὶ περίχρυσοι
  english_pob_choice: Wooden gods overlaid with silver and overlaid with gold
  chosen_korean: 나무로 만든 신들, 은으로 입히고 금으로 입힌 신들
  alternatives_korean:
  - 목재로 만든 신들, 은과 금으로 입힌 신들
  - 나무 신들, 은과 금을 입힌 신들
  lexicon: LSJ
  rationale: ξύλινοι의 재료성을 분명히 하되, περιάργυροι/περίχρυσοι의 ‘둘러 입힌’ 뜻을 한국어의 ‘입히고’로 자연스럽게 재현했습니다.
theological_decisions:
- issue: 원문 θεοί를 해석적으로 ‘우상들’로 바꿀지 여부
  chosen_reading: 본문에서는 ‘신들’을 유지하고, 문맥 전체가 이 주장을 조롱하고 있음을 드러내는 방식으로 번역했습니다.
  alternative_readings:
  - 우상들
  - 소위 신들
  rationale: 그리스어 본문이 실제로 ‘신들’이라고 말하는 만큼, 본문 어휘의 날카로운 반어를 보존하는 것이 더 직접적입니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
