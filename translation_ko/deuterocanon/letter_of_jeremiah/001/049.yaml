base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/049.yaml
  text: How then can one fail to perceive that they are not gods[b][a], since they neither save themselves from war nor from calamities?
  footnotes:
  - marker: a
    text: Or, more literally, 'How then is it not possible to perceive that they are not gods...?' The Greek uses a rhetorical negation to stress how obvious the conclusion is.
    reason: lexical_alternative
  - marker: b
    text: '''Calamities'' translates Greek κακῶν here in the sense of harmful events or disasters; alternatively, ''evils'' or ''troubles.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그들이 신들이 아니라는 것을 어떻게 알아차리지 못하겠습니까?[a] 그들은 전쟁에서도 재난에서도[b] 스스로를 구하지 못합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “그러므로 그들이 신들이 아니라는 것을 어떻게 알아차릴 수 없겠습니까?”입니다. 그리스어의 수사적 부정은 이 결론이 매우 분명함을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: κακῶν은 여기서 도덕적 악이라기보다 전쟁과 함께 언급되는 해악이나 재난을 가리키는 것으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς οὖν οὐκ ἔστιν αἰσθέσθαι
  english_pob_choice: How then can one fail to perceive
  chosen_korean: 그렇다면 어떻게 … 알아차리지 못하겠습니까?
  alternatives_korean:
  - 그렇다면 어떻게 … 깨닫지 못하겠습니까?
  - 그렇다면 어찌 … 알지 못하겠습니까?
  lexicon: LSJ
  rationale: πῶς οὖν의 추론적·수사적 물음을 살리고, οὐκ ἔστιν αἰσθέσθαι의 '분명한 사실을 못 알아차릴 수 없다'는 뜻을 한국어 관용으로 자연스럽게 옮겼습니다.
- source_word: οὐκ εἰσὶν θεοί
  english_pob_choice: that they are not gods
  chosen_korean: 그들이 하나님이 아님
  alternatives_korean:
  - 그들이 신들이 아님
  - 그들이 신이 아님
  lexicon: LSJ
  rationale: θεοί를 단순히 '신들'로 완화하지 않고, 문맥상의 우상 비판을 드러내는 '하나님이 아님'으로 옮겨 본문의 판정적 진술을 보존했습니다.
- source_word: σώζουσιν ἑαυτοὺς
  english_pob_choice: they neither save themselves
  chosen_korean: 스스로를 구하지 못하고
  alternatives_korean:
  - 자기들을 구하지 못하고
  - 자신을 구원하지 못하고
  lexicon: LSJ
  rationale: σώζω의 기본 의미인 '구하다/구원하다'를 유지하되, 앞뒤 병렬 구조에 맞게 '스스로를'을 넣어 우상들의 무능을 강조했습니다.
- source_word: ἐκ πολέμου
  english_pob_choice: from war
  chosen_korean: 전쟁에서도
  alternatives_korean:
  - 전쟁에서
  - 전쟁으로부터도
  lexicon: LSJ
  rationale: ἐκ의 출발·탈출 의미를 한국어 조사 구조로 자연화했고, 뒤의 κακῶν과 대구를 이루도록 '에서도'를 반복했습니다.
- source_word: ἐκ κακῶν
  english_pob_choice: from calamities
  chosen_korean: 재난에서도
  alternatives_korean:
  - 재앙에서도
  - 환난에서도
  - 악에서도
  lexicon: LSJ
  rationale: κακά를 여기서는 도덕적 '악'보다 외적 해악·재난의 뜻으로 이해하는 편이 문맥에 맞아, '재난'으로 옮겼습니다.
theological_decisions:
- issue: θεοί의 번역과 우상 비판의 직설성
  chosen_reading: '''하나님이 아님''으로 직역하여, 본문이 스스로 선언하는 부정(참 하나님 아님)을 드러냈습니다.'
  alternative_readings:
  - '''신들이 아님'''
  - '''우상에 불과함'''
  rationale: 본문은 단순한 비유가 아니라 판정적 선언이므로, 해설을 덧붙여 약화시키기보다 원문의 강한 부정을 보존하는 것이 더 충실합니다.
  doctrine_reference: 원문 우선 원칙; 우상숭배 비판의 수사 보존
- issue: 수사 의문문의 한국어 높임말 톤
  chosen_reading: 문장 전체를 합쇼체로 두되, 반문형 수사의 긴박함을 유지했습니다.
  alternative_readings:
  - 평서형으로 완화
  - 보다 교회적 문체로 조정
  rationale: 예언적·논증적 반문은 독자에게 자명한 결론을 강하게 촉구하므로, 공손하지만 단호한 합쇼체가 가장 적절합니다.
  doctrine_reference: 공적 낭독용 현대 한국어 문체
