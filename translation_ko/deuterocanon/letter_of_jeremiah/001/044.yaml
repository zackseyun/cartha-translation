translation:
  language: ko
  text: 그들에게 일어나는 모든 것은 거짓입니다[a]. 그렇다면 어떻게 그들을 신들이라고 생각하거나 부를 수 있겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그렇다면 어떻게 그들을 신들이라고 생각하거나 부를 수 있겠습니까?’ 그리스어는 끝에 ‘존재하다’는 동사를 분명히 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα τὰ γενόμενα αὐτοῖς
  english_pob_choice: Everything that happens to them
  chosen_korean: 그들에게 일어나는 모든 것은
  alternatives_korean:
  - 그들에게서 생기는 모든 것은
  - 그들에게 일어나는 모든 일은
  - 그들에게 생기는 모든 것은
  lexicon: BDAG
  rationale: γενόμενα의 사건적·발생적 의미를 살려 ‘일어나는’으로 옮기고, πάντα의 포괄성을 ‘모든 것’으로 자연스럽게 보존했습니다.
- source_word: ψευδῆ
  english_pob_choice: 'false'
  chosen_korean: 거짓입니다
  alternatives_korean:
  - 헛됩니다
  - 가짜입니다
  - 거짓된 것입니다
  lexicon: BDAG
  rationale: 문맥상 우상들에 관한 진술의 진위를 부정하는 술어이므로, 현대 한국어에서 분명한 ‘거짓입니다’로 옮겼습니다.
- source_word: νομιστέον ἢ κλητέον
  english_pob_choice: should one suppose or call
  chosen_korean: 생각하거나 부를 수 있겠습니까
  alternatives_korean:
  - 생각하거나 일컬을 수 있겠습니까
  - 여기거나 부를 수 있겠습니까
  - 생각하거나 명명할 수 있겠습니까
  lexicon: LSJ
  rationale: 두 조동형용사의 병렬 구조를 한국어의 ‘생각하거나 부를 수 있겠습니까’로 압축해, 무엇으로 간주하고 지칭할 수 있는지를 살렸습니다.
- source_word: ὡς θεοὺς
  english_pob_choice: gods
  chosen_korean: 신들이라고
  alternatives_korean:
  - 신이라고
  - 하나님들이라고
  - 신적 존재라고
  lexicon: BDAG
  rationale: θεούς는 복수 ‘신들’이므로, 단수화하지 않고 복수형을 유지했습니다. 한국어에서는 서술어 ‘-라고’와 결합해 자연스럽게 표현했습니다.
theological_decisions:
- issue: 우상에 대한 실재성 부정의 강도
  chosen_reading: 이 구절은 우상들이 신으로 불릴 자격이 없음을, 그들의 모든 ‘일어나는 것’이 거짓이라는 진술과 함께 강하게 부정합니다.
  alternative_readings:
  - 단순히 ‘신들이 아니다’라고 평평하게 옮길 수도 있습니다.
  - ‘존재하지 않는다’는 존재론적 부정으로 더 강하게 해석할 수도 있습니다.
  rationale: 본문의 논지는 우상 비판이며, 영어 POB도 존재론적 여운을 과도하게 풀지 않았습니다. 한국어도 ‘거짓입니다’와 수사 의문문을 유지해 긴장을 보존했습니다.
  doctrine_reference: 원문 우선, 해석적 과잉 방지, 우상 비판의 수사 유지
- issue: ὑπάρχειν의 존재 뉘앙스
  chosen_reading: 별도의 존재론 설명을 덧붙이지 않고, ‘신들이라고 생각하거나 부를 수 있겠습니까?’로 처리했습니다.
  alternative_readings:
  - ‘실재한다고’ 같은 존재 뉘앙스를 본문에 직접 넣을 수 있습니다.
  - 영어 POB 각주처럼 ‘존재한다’는 뜻을 본문에 노출할 수 있습니다.
  rationale: 영어 POB의 개정 이력은 ὑπάρχειν의 존재 뉘앙스를 과잉 노출하지 않도록 조정했습니다. 한국어도 본문에서는 자연스러운 수사문으로 유지하고, 필요 시 본문 밖에서만 설명할 수 있게 했습니다.
  doctrine_reference: 텍스트 비평·어휘 뉘앙스 보존
