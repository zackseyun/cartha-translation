lexical_decisions:
- source_word: χήραν
  english_pob_choice: a widow
  chosen_korean: 과부에게는
  alternatives_korean:
  - 한 과부에게는
  - 과부를
  lexicon: LSJ
  rationale: χήραν은 ‘과부’의 단수 목적격으로, 여기서는 대표적 약자를 가리키는 일반 진술이므로 한국어도 목적어 표지로 자연스럽게 처리했습니다.
- source_word: οὐ μὴ ἐλεήσωσιν
  english_pob_choice: will never show mercy
  chosen_korean: 결코 자비를 베풀지
  alternatives_korean:
  - 결코 긍휼히 여기지
  - 반드시 불쌍히 여기지
  lexicon: BDAG
  rationale: οὐ μή의 강한 부정을 ‘결코’로 살리고, ἐλεέω의 윤리적·종교적 뉘앙스는 ‘자비를 베풀다’로 옮겼습니다.
- source_word: ὀρφανῷ
  english_pob_choice: an orphan
  chosen_korean: 고아에게도
  alternatives_korean:
  - 부모 잃은 아이에게도
  - 고아에게는
  lexicon: LSJ
  rationale: ὀρφανῷ는 ‘고아/부모 없는 아이’의 여격 단수이므로, 현대 한국어에서 분명한 ‘고아’로 옮기되 병렬을 살려 ‘도’를 붙였습니다.
- source_word: εὖ ποιήσουσιν
  english_pob_choice: do good to
  chosen_korean: 선을 행하지 않습니다
  alternatives_korean:
  - 잘 대해주지 않습니다
  - 유익을 주지 않습니다
  lexicon: BDAG
  rationale: εὖ ποιέω의 ‘선을 행하다/좋게 대하다’라는 구조를 살려, 단순한 이익보다 도덕적 행위의 부재를 분명히 했습니다.
theological_decisions:
- issue: 심판 맥락에서의 강한 부정 표현
  chosen_reading: ‘결코 … 하지 않습니다’로 반복 불가능한 절대적 거부를 드러냈습니다.
  alternative_readings:
  - ‘전혀 … 하지 않습니다’
  - ‘절대로 … 않습니다’
  rationale: οὐ μή는 단순 부정보다 훨씬 강한 emphatic negation이므로, 한국어에서도 절대적 거부를 분명히 해야 본문의 우상 비판이 약화되지 않습니다.
  doctrine_reference: 'DOCTRINE.md: source-driven precision; preserve rhetorical force'
