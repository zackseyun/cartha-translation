  rationale: 'The revision preserves the Greek sequence and its singular-to-plural shift: the tongue is described as worked by a craftsman, whereas the idols are described as gold- and silver-covered, false, and unable to speak. It also uses clear 합쇼체 and places each footnote at the word or phrase it explains.'
