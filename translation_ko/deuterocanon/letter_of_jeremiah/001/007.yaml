base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/007.yaml
  text: For their tongue has been scraped by a craftsman[a], and they are overlaid with gold and silver[b], but they are false and cannot speak.
  footnotes:
  - marker: a
    text: Or 'has been carved/polished by a craftsman.' The Greek verb emphasizes the artisan's scraping or smoothing work on the idol.
    reason: lexical_alternative
  - marker: b
    text: Or 'they are lies.' The Greek ψευδῆ can characterize the idols as false things or as embodiments of falsehood.
    reason: alternative_reading
translation:
  language: ko
  text: 그들의 혀는 장인의 손으로 깎였고, 또 금과 은으로 입혀졌지만, 그것들은 거짓이며 말할 수 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘긁어 다듬다/깎다’에 가깝습니다. 영어 POB의 ‘scraped smooth’처럼, 장인의 손길로 표면을 인공적으로 다듬은 뜻을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘둘러 금 입힌/둘러 은 입힌’입니다. 금과 은이 표면을 덮는 장식 상태를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γλῶσσα
  english_pob_choice: tongue
  chosen_korean: 혀
  alternatives_korean:
  - 말
  - 언어
  lexicon: LSJ
  rationale: 여기서는 우상의 ‘말할 수 없음’과 대비되는 신체 기관이 강조되므로, 추상적인 ‘언어’보다 ‘혀’가 원문의 구체성을 더 잘 살립니다.
- source_word: κατεξυσμένη
  english_pob_choice: has been scraped smooth
  chosen_korean: 깎였고
  alternatives_korean:
  - 긁어 다듬어졌고
  - 다듬어졌고
  - 깎여 매끈해졌고
  lexicon: LSJ
  rationale: 동사의 핵심은 장인의 손길로 표면을 깎아 만든 인공성을 드러내는 데 있으므로, 과도한 설명 없이 ‘깎였고’로 옮겼습니다.
- source_word: ὑπὸ τέκτονος
  english_pob_choice: by a craftsman
  chosen_korean: 장인의 손으로
  alternatives_korean:
  - 장인에 의해
  - 목수의 손으로
  - 공예인의 손으로
  lexicon: LSJ
  rationale: τέκτων은 단순한 목수보다 더 넓은 제작자이므로, 우상 제작의 맥락을 살려 ‘장인’으로 옮겼습니다.
- source_word: περίχρυσα καὶ περιάργυρα
  english_pob_choice: overlaid with gold and silver
  chosen_korean: 금과 은으로 입혀졌지만
  alternatives_korean:
  - 금과 은으로 입혔지만
  - 금과 은으로 덧입혔지만
  - 금과 은으로 씌웠지만
  lexicon: LSJ
  rationale: 두 형용사는 금·은이 바깥을 둘러싼 상태를 가리키므로, 재료를 드러내는 자연스러운 표현인 ‘입혀졌다’를 택했습니다.
- source_word: ψευδῆ
  english_pob_choice: 'false'
  chosen_korean: 거짓이며
  alternatives_korean:
  - 거짓이고
  - 가짜이며
  - 헛되며
  lexicon: LSJ
  rationale: 원문은 우상들을 ‘거짓된 것들’로 규정하므로, 명사적 뉘앙스를 살린 ‘거짓이며’가 가장 적절합니다.
- source_word: οὐ δύνανται λαλεῖν
  english_pob_choice: cannot speak
  chosen_korean: 말할 수 없습니다
  alternatives_korean:
  - 말하지 못합니다
  - 말할 능력이 없습니다
  - 말할 수 없습니ㄷ
  lexicon: LSJ
  rationale: 우상 비판의 결론을 직접적이고 현대적인 합쇼체로 옮기되, 능력 부재를 분명히 하기 위해 ‘말할 수 없습니다’로 렌더링했습니다.
theological_decisions:
- issue: ψευδῆ의 의미를 ‘거짓’으로 옮길지, ‘거짓말’로 구체화할지
  chosen_reading: ‘거짓이며’로 옮겨 우상 자체가 참되지 않은 실재 없음/허위성을 드러냈습니다.
  alternative_readings:
  - 거짓말하며
  - 속이는 존재이며
  - 그들은 거짓입니다
  rationale: 원문은 우상이 능동적으로 속인다는 말보다, 그것들의 본질이 참되지 않다는 점을 고발합니다. 그래서 행위보다 존재 진술에 가까운 ‘거짓’으로 유지했습니다.
  doctrine_reference: 원문의 존재론적 우상 비판을 보존합니다.
