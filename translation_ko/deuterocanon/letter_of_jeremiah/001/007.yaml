review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders Γλῶσσα as ‘혀,’ τέκτων as ‘장인,’ and the final inability to speak. However, the Greek shifts from the singular ‘their tongue’ (κατεξυσμένη) to plural neuter idols (αὐτά; περίχρυσα καὶ περιάργυρα; ψευδῆ). The Korean should make this shift syntactically clear. The predicate ψευδῆ is best expressed as ‘거짓된 것들입니다,’ rather than the less idiomatic abstract predicate ‘거짓이며.’
  naturalness: ‘그들의 혀는 … 깎였고, 또 금과 은으로 입혀졌지만, 그것들은’ leaves an unclear grammatical transition, since the immediately preceding passive predicates can appear to continue to describe the singular ‘혀.’ Separating the singular clause from the plural idol clauses produces natural, formal Korean.
  terminology: ‘장인,’ ‘금과 은으로 입혀진,’ and ‘말할 수 없습니다’ are suitable modern formal-polite renderings. The lexical footnote for ψευδῆ should be anchored to ‘거짓된 것들’ rather than to the gold-and-silver description; the present footnote b does not correspond to its stated English audit-trail alternative.
  issues:
  - severity: medium
    issue: Singular-to-plural referential shift is unclear in the Korean syntax.
    rationale: The source first describes the singular tongue and then the plural idols themselves. A clause boundary and explicit plural subject preserve this structure.
  - severity: medium
    issue: Footnote b is attached after the final sentence but discusses gold and silver, while the audit trail identifies the relevant alternative as ψευδῆ (‘false’/‘lies’).
    rationale: Relocating and revising the note gives it a clear anchor and preserves the source ambiguity without adding interpretation.
  - severity: low
    issue: ‘거짓이며’ is syntactically possible but less idiomatic for the neuter-plural substantive predicate.
    rationale: ‘거짓된 것들입니다’ naturally identifies the idols as false things and retains the polemical force of ψευδῆ.
  revised_text: 그들의 혀는 장인이 깎은 것이며,[a] 그것들은 금과 은으로 입혀졌지만 거짓된 것들이고[b] 말할 수 없습니다.
  revised_footnotes:
