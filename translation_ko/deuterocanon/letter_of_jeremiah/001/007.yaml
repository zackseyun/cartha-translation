  rationale: 동사의 핵심은 장인의 손길로 표면을 깎아 만든 인공성을 드러내는 데 있으므로, 과도한 설명 없이 ‘깎였고’로 옮겼습니다.
- source_word: ὑπὸ τέκτονος
