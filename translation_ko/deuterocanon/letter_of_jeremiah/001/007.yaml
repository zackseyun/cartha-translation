  - 가짜이며
  - 헛되며
  lexicon: LSJ
  rationale: 원문은 우상들을 ‘거짓된 것들’로 규정하므로, 명사적 뉘앙스를 살린 ‘거짓이며’가 가장 적절합니다.
- source_word: οὐ δύνανται λαλεῖν
  english_pob_choice: cannot speak
  chosen_korean: 말할 수 없습니다
  alternatives_korean:
  - 말하지 못합니다
  - 말할 능력이 없습니다
  - 말할 수 없습니ㄷ
  lexicon: LSJ
  rationale: 우상 비판의 결론을 직접적이고 현대적인 합쇼체로 옮기되, 능력 부재를 분명히 하기 위해 ‘말할 수 없습니다’로 렌더링했습니다.
theological_decisions:
- issue: ψευδῆ의 의미를 ‘거짓’으로 옮길지, ‘거짓말’로 구체화할지
  chosen_reading: ‘거짓이며’로 옮겨 우상 자체가 참되지 않은 실재 없음/허위성을 드러냈습니다.
  alternative_readings:
  - 거짓말하며
  - 속이는 존재이며
  - 그들은 거짓입니다
  rationale: 원문은 우상이 능동적으로 속인다는 말보다, 그것들의 본질이 참되지 않다는 점을 고발합니다. 그래서 행위보다 존재 진술에 가까운 ‘거짓’으로 유지했습니다.
  doctrine_reference: 원문의 존재론적 우상 비판을 보존합니다.
