  chosen_korean: 닮아버려 또 닮아버리지
  alternatives_korean:
  - 동화되어 또 동화되지
  - 흡수되어 또 흡수되지
  - 그들과 같아져 또 같아지지
  lexicon: LSJ
  rationale: 같은 동사를 반복한 강조를 한국어에서도 되살리기 위해 같은 어근을 반복했습니다. '닮다'는 관계적·행동적 유사성을 무리 없이 드러냅니다.
- source_word: τοῖς ἀλλοφύλοις
  english_pob_choice: the foreigners
  chosen_korean: 이방인들
  alternatives_korean:
  - 외국인들
  - 다른 민족 사람들
  - 타민족 사람들
  lexicon: LSJ
  rationale: 문맥상 단순 국적이 아니라 '다른 ժողովուրդ/민족'을 가리키므로, 성서적 용례가 잘 알려진 '이방인들'을 택하되 종교적 기술어로 과도하게 좁히지 않았습니다.
- source_word: φόβος ὑμᾶς λάβῃ ἐπʼ αὐτοῖς
  english_pob_choice: fear seize you because of them
  chosen_korean: 그들로 말미암아 두려움이 너희를 사로잡을까 합니다
  alternatives_korean:
  - 그들 때문에 두려움이 너희를 덮칠까 합니다
  - 그들에 대해 두려움이 너희를 사로잡을까 합니다
  - 그들 때문에 너희가 두려움에 붙들릴까 합니다
  lexicon: LSJ
  rationale: '''사로잡다''는 φόβος의 능동적 인격화를 살리고, ''그들로 말미암아''는 ἐπʼ αὐτοῖς의 문맥상 원인 의미를 자연스럽게 드러냅니다.'
theological_decisions:
- issue: 반복 명령의 수사적 강도
  chosen_reading: 같은 동사를 두 번 반복한 경고를 한국어에서도 동일한 반복으로 살려, 단순한 유사화가 아니라 실제로 그들과 닮아버리는 위험을 강조했습니다.
  alternative_readings:
  - 반복을 한 번으로 줄여 자연스럽게 만들기
  - 의미만 통합해 ‘같아지지 않도록’으로 정리하기
  rationale: 본문은 반복 자체가 강조점이므로, 매끈함보다 경고의 압력을 보존하는 쪽이 source-direct합니다.
  doctrine_reference: DOCTRINE.md § Preserve theological tension rather than resolve it
