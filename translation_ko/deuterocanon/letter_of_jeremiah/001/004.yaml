  lexicon: LSJ
  rationale: 경고의 어조를 살리면서도 현대 한국어에서 자연스러운 주의 촉구로 옮겼습니다. 'beware'에 가까운 직접 경계와 'be on your guard'의 긴박감을 함께 반영합니다.
- source_word: ἀφομοιωθέντες ... ἀφομοιωθῆτε
  english_pob_choice: having become like ... become like
  chosen_korean: 닮아버려 또 닮아버리지
  alternatives_korean:
