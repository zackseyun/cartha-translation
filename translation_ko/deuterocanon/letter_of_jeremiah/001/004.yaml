lexical_decisions:
- source_word: εὐλαβήθητε
  english_pob_choice: be on your guard
  chosen_korean: 조심하십시오
  alternatives_korean:
  - 경계하십시오
  - 경고를 받으십시오
  - 삼가십시오
  lexicon: LSJ
  rationale: 경고의 어조를 살리면서도 현대 한국어에서 자연스러운 주의 촉구로 옮겼습니다. 'beware'에 가까운 직접 경계와 'be on your guard'의 긴박감을 함께 반영합니다.
- source_word: ἀφομοιωθέντες ... ἀφομοιωθῆτε
