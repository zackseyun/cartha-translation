  text: They are bought at every price[a], but there is no breath in them.
  footnotes:
  - marker: a
    text: Or 'there is no spirit in them.' Greek πνεῦμα can mean 'breath,' 'spirit,' or 'wind'; here the sense is that the idols are lifeless.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 어떤 값으로든 사들여졌지만, 그들 안에는 숨결이 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들 안에 영이 없습니다.’ 헬라어 πνεῦμα는 ‘숨결’, ‘영’, ‘바람’을 뜻할 수 있으며, 여기서는 우상이 생명이 없다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ πάσης τιμῆς
  english_pob_choice: at every price
  chosen_korean: 어떤 값으로든
  alternatives_korean:
  - 모든 값으로
  - 값을 치르고
  - 아무 값이나 치르고
  lexicon: LSJ
  rationale: 헬라어는 ‘모든/온갖 값의 대가로’라는 뜻으로, 우상들이 값비싸게 사들여졌다는 점을 전달합니다. 한국어에서는 ‘어떤 값으로든’이 값의 크기를 특정하지 않으면서도 비용을 치러 취득한 의미를 자연스럽게 살립니다.
- source_word: ἠγορασμένα
  english_pob_choice: are bought
  chosen_korean: 사들여졌지만
  alternatives_korean:
  - 구입되었지만
  - 산 것이지만
  - 사들여졌습니다만
  lexicon: BDAG
  rationale: 완료·수동의 매매 표현을 한국어에서는 상태보다 결과를 드러내는 ‘사들여졌지만’으로 옮기면, 문맥상 우상들이 상품처럼 취급된다는 점이 살아납니다.
- source_word: πνεῦμα
  english_pob_choice: breath
  chosen_korean: 숨결
  alternatives_korean:
  - 영
  - 호흡
  - 바람
  lexicon: BDAG
  rationale: 이 우상 비판 문맥에서는 생명 없음이 요지이므로, ‘숨결’이 생기 없는 상태를 구체적으로 드러냅니다. ‘영’은 가능한 번역이지만, 본절의 직접적 대비는 생명력의 부재입니다.
- source_word: ἐν οἷς οὐκ ἔστιν πνεῦμα
  english_pob_choice: there is no breath in them
  chosen_korean: 그들 안에는 숨결이 없습니다
  alternatives_korean:
  - 그들 안에는 영이 없습니다
  - 그들 속에는 숨이 없습니다
  lexicon: BDAG
  rationale: ‘ἐν οἷς’를 자연스럽게 ‘그들 안에는’으로 옮겨 지시 대상을 분명히 하고, 부정문은 단정적으로 처리해 우상들의 무생명성을 분명하게 전달했습니다.
theological_decisions:
- issue: 'πνεῦμα의 번역: ‘숨결’ vs. ‘영’'
  chosen_reading: ‘숨결’로 옮겨 우상이 생명 없는 물체라는 점을 강조했습니다.
  alternative_readings:
  - ‘영’으로 옮겨 더 직역하는 방식
  rationale: 본문의 논지는 우상에게 생기와 생명이 없다는 점입니다. 따라서 ‘숨결’이 문맥상 가장 직접적이며, ‘영’은 가능한 의미이지만 여기서는 더 추상적으로 들릴 수 있습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; prefer the source-direct concrete sense when the context is anti-idol polemic.'
