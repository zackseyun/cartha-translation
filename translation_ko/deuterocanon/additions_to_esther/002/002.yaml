  text: The matter was being hurried along even in Susa; but the king and Haman were reclining at table[a], while the city was in turmoil.
  footnotes:
  - marker: a
    text: Or 'were feasting' or 'were banqueting.' The Greek verb specifically evokes reclining on dining couches at a formal meal.
