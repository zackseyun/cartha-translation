translation:
  language: ko
  text: 그 일은 수산에서도 급히 진행되고 있었습니다. 그러나 왕과 하만은 잔치 자리에 앉아 있었고, 도성은 소란스러웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 동사는 연회 자리에서 기대앉아 먹는 자세를 가리키므로, ‘잔치하다’보다 더 구체적인 장면을 암시합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσπεύδετο
  english_pob_choice: was being hurried along
  chosen_korean: 급히 진행되고 있었습니다
  alternatives_korean:
