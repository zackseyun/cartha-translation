translation:
  language: ko
  text: 그 일은 수산에서도 급히 진행되고 있었습니다. 그러나 왕과 하만은 연회 자리에서 기대어 누워 있었고, 도성은 소란스러웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 정식 식사나 연회에서 침상에 기대어 눕는 자세를 가리킵니다. 또는 “연회를 벌이고 있었다.”
    reason: lexical_alternative
