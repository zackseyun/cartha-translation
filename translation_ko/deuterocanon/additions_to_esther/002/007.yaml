translation:
  language: ko
  text: 그러므로 예전에도 지금도 적대적인 자들이 하루에 폭력적으로 하데스로 내려가, 그 뒤로 영원히 우리에게 안정되고 평온한 상황을 마련하게 하소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무덤’이나 ‘저승’으로 옮길 수 있습니다. 여기서 그리스어 ‘하데스’는 최후 형벌의 장소가 아니라 죽은 자들의 영역을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πάλαι καὶ νῦν δυσμενεῖς
  english_pob_choice: those who were hostile in the past and are hostile now
  chosen_korean: 옛날에도 지금도 적대적인 자들
  alternatives_korean:
  - 과거에도 지금도 적대적인 자들
  - 예전부터 지금까지 우리에게 해로운 자들
  - 옛날에도 지금도 원한을 품은 자들
  lexicon: LSJ
  rationale: δυσμενεῖς는 단순한 불호가 아니라 적대적 태도를 나타내므로 ‘적대적인’이 자연스럽고, πάλαι는 시간상 ‘옛날에도’로 살려 반복된 적대성을 드러냈습니다.
- source_word: ἐν ἡμέρᾳ μιᾷ βιαίως
  english_pob_choice: in a single day / violently
  chosen_korean: 한 날에 폭력적으로
  alternatives_korean:
  - 하루 만에 거칠게
  - 한날에 강제로
  - 하루 만에 폭력으로
  lexicon: LSJ
  rationale: ἡμέρᾳ μιᾷ의 급작성과 βιαίως의 폭력성을 함께 살리기 위해 ‘한 날에 폭력적으로’로 옮겼습니다.
- source_word: εἰς τὸν ἅδην
  english_pob_choice: to Hades
  chosen_korean: 하데스로
  alternatives_korean:
  - 스올로
  - 음부로
  - 죽은 자들의 세계로
  lexicon: LSJ
  rationale: 본문이 ᾅδης를 직접 지칭하므로, POB의 원문-우선 원칙에 따라 전통적 완화어보다 음역 ‘하데스’를 유지했습니다.
- source_word: εὐσταθῆ καὶ ἀτάραχα
  english_pob_choice: stable and undisturbed
  chosen_korean: 안정되고 평온한
  alternatives_korean:
  - 견고하고 동요 없는
  - 안정되고 흔들림 없는
  - 평정되고 동요 없는
  lexicon: LSJ
  rationale: 두 형용사는 국가적 상태의 지속성과 소란 없음에 초점이 있으므로 ‘안정되고 평온한’이 가장 자연스럽고 균형 있게 대응합니다.
- source_word: διὰ τέλους
  english_pob_choice: for all time afterward
  chosen_korean: 이후의 모든 시대에도
  alternatives_korean:
  - 끝까지
  - 영원히
  - 그 뒤로도 계속
  lexicon: LSJ
  rationale: 문맥상 적의 제거 뒤 지속될 상태를 가리키므로, 단순한 종결이 아니라 지속 기간을 드러내는 ‘이후의 모든 시대에도’로 옮겼습니다.
- source_word: τὰ πράγματα
  english_pob_choice: affairs
  chosen_korean: 일
  alternatives_korean:
  - 사정
  - 정세
  - 국정
  lexicon: LSJ
  rationale: τὰ πράγματα는 여기서 광범위한 ‘사태/정무/정세’를 뜻하므로, 한국어에서는 너무 좁지 않게 ‘일들’보다 문어적으로 ‘일’로 압축해 공적 상황을 포괄했습니다.
