theological_decisions:
- issue: 왕의 적대적 규정과 화자의 시각
  chosen_reading: 화자의 비난 수사를 그대로 살려, 본문이 유대 민족에 대한 적대적 왕실 진술임을 드러냈습니다.
  alternative_readings:
  - 서술자를 중립화하여 완곡하게 번역하는 방식
  - 비난의 강도를 약화하는 방식
  rationale: 본문은 왕의 편지 문맥 속 주장으로, 번역에서 그 공격성을 희석하면 원문의 수사와 역사적 긴장이 사라집니다.
  doctrine_reference: 원문 우선과 본문의 수사적 긴장 보존
- issue: τὴν βασιλείαν εὐσταθείας τυγχάνειν
  chosen_reading: 왕국이 안정에 이르지 못하게 한다
  alternative_readings:
  - 왕국이 견고함을 얻지 못하게 한다
  - 왕국이 안정성을 얻지 못하게 한다
  rationale: εὐστάθεια를 정치적 ‘안정’으로 옮겨, 본문의 왕국 질서에 대한 우려를 자연스럽게 전달했습니다.
