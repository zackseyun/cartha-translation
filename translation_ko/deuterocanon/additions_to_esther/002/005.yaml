base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/002/005.yaml
  text: Therefore[a], having recognized that this nation alone stands in opposition to every man, introducing a foreign way of life in its laws, and being ill-disposed toward our affairs, accomplishing the worst evils, so that the kingdom does not attain stability[b],
  footnotes:
  - marker: a
    text: Or 'everyone.' The Greek says 'every man' with generic force.
    reason: lexical_alternative
  - marker: b
    text: The wording about their 'laws' and 'way of life' is rhetorically compressed and hostile; it portrays the nation as practicing customs alien to the empire.
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 우리는 이 민족만이 언제나 모든 사람과 대립하고[a], 그들의 법에 낯선 생활 방식을 들여오며[b], 우리의 국정에 악의를 품고, 가장 큰 악행들을 일으켜 왕국이 안정을 얻지 못하게 한다고 판단하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 이와’. 그리스어는 일반적 의미로 쓰인 단수 남성형을 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘법’과 ‘생활 방식’에 관한 이 표현은 문법적으로 압축되어 있으며 적대적인 수사입니다. 이 민족의 법적·문화적 관습을 제국에 낯선 것으로 묘사합니다.
    reason: cultural_note
