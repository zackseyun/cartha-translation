  rationale: 적대적 정치 수사에서 ἔθνος의 집단성을 살리기 위해 ‘민족’을 택하고, μονώτατον의 배타성을 ‘홀로’로 옮겼습니다.
- source_word: ἐν ἀντιπαραγωγῇ παντὶ διὰ παντὸς ἀνθρώπῳ κείμενον
  english_pob_choice: stands in opposition to every man
  chosen_korean: 모든 사람 앞에 홀로 맞서 있으며
  alternatives_korean:
  - 모든 사람과 대립하며
  - 모든 사람에게 맞서 놓여 있으며
  - 모든 사람과 대항하며
  lexicon: LSJ
  rationale: κείμενον의 지속적 상태와 αντιπαραγωγή의 대항 이미지를 함께 살려, 자연스러운 한국어로 ‘맞서 있으며’라고 옮겼습니다.
- source_word: διαγωγὴν νόμων ξενίζουσαν παραλλάσσον
  english_pob_choice: introducing a foreign way of life in its laws
  chosen_korean: 법들 속에서 낯선 삶의 방식을 도입하고
  alternatives_korean:
  - 법을 바꾸어 낯선 삶의 방식을 들여오며
  - 낯선 법적 관습을 도입하며
  - 법에 따라 외래의 삶의 방식을 들여오며
  lexicon: LSJ
  rationale: 법과 생활양식이 압축되어 결합된 표현이므로, 법적 요소와 문화적 요소를 함께 드러내는 방향으로 옮겼습니다.
- source_word: δυσονοοῦν τοῖς ἡμετέροις πράγμασιν
  english_pob_choice: being ill-disposed toward our affairs
  chosen_korean: 우리의 일에 대하여 좋지 않게 생각하며
  alternatives_korean:
  - 우리의 일에 적대적이며
  - 우리의 일에 불리한 생각을 품으며
  - 우리의 일에 악의를 품으며
  lexicon: LSJ
  rationale: 직접적인 적대감보다 ‘좋지 않게 생각하다’로 옮겨, 악정(惡情)과 정치적 불신의 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 왕의 적대적 규정과 화자의 시각
  chosen_reading: 화자의 비난 수사를 그대로 살려, 본문이 유대 민족에 대한 적대적 왕실 진술임을 드러냈습니다.
  alternative_readings:
  - 서술자를 중립화하여 완곡하게 번역하는 방식
  - 비난의 강도를 약화하는 방식
  rationale: 본문은 왕의 편지 문맥 속 주장으로, 번역에서 그 공격성을 희석하면 원문의 수사와 역사적 긴장이 사라집니다.
  doctrine_reference: 원문 우선과 본문의 수사적 긴장 보존
- issue: τὴν βασιλείαν εὐσταθείας τυγχάνειν
  chosen_reading: 왕국이 안정에 이르지 못하게 한다
  alternative_readings:
  - 왕국이 견고함을 얻지 못하게 한다
  - 왕국이 안정성을 얻지 못하게 한다
  rationale: εὐστάθεια를 정치적 ‘안정’으로 옮겨, 본문의 왕국 질서에 대한 우려를 자연스럽게 전달했습니다.
  doctrine_reference: 정치적 수사와 의미 범위 보존
