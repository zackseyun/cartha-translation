base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/002/001.yaml
  text: 'And this is the copy of the letter: Great King Artaxerxes writes these things to the rulers and local governors of the one hundred twenty-seven provinces from India to Ethiopia[b][a], who are subject to him.'
  footnotes:
  - marker: a
    text: Or 'regions' or 'lands' for 'provinces'; the Greek term is broader, but the context is imperial administration.
    reason: lexical_alternative
  - marker: b
    text: '''Writes these things'' could also be rendered ''writes as follows.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이 편지의 사본은 이러합니다. “대왕 아닥사스다는 인도에서 에티오피아까지 이르는 백스물일곱 지역[a]의 통치자들과 지방 총독들, 곧 그에게 복속된 이들에게 다음과 같이 씁니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지역’(χωρῶν)은 문맥상 제국의 행정 구획을 가리키지만, 반드시 현대적 의미의 ‘도’나 엄밀한 ‘행정구역’으로 한정되지는 않습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘다음과 같이 씁니다’는 문자적으로 ‘이러한 것들을 씁니다’이며, 서한의 도입 형식으로 자연스럽게 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστολῆς / ἀντίγραφον
  english_pob_choice: letter / copy
  chosen_korean: 편지 / 사본
  alternatives_korean:
  - 서신 / 복사본
  - 공문 / 부본
  lexicon: LSJ
  rationale: ἐπιστολή는 자연스럽게 ‘편지’로, ἀντίγραφον은 문서의 ‘사본’으로 옮기는 것이 가장 직접적이며 행정 문서의 형식도 살릴 수 있습니다.
- source_word: Βασιλεὺς μέγας
  english_pob_choice: Great King
  chosen_korean: 위대한 왕
  alternatives_korean:
  - 대왕
  - 큰 왕
  lexicon: LSJ
  rationale: 왕호의 위상을 드러내는 titulary이므로 ‘위대한 왕’이 직역성과 문체를 함께 살립니다.
- source_word: Ἀρταξέρξης
  english_pob_choice: Artaxerxes
  chosen_korean: 아닥사스다고스
  alternatives_korean:
  - 아르타크세르크세스
  - 아닥사스다
  lexicon: 관용 표기
  rationale: 한국어 성경에서 널리 쓰이는 아하수에로/아닥사스다 계열의 왕명 관습을 따르되, 본문은 고유명사 표기를 현대식으로 정리했습니다.
- source_word: χωρῶν
  english_pob_choice: provinces
  chosen_korean: 관할 지역
  alternatives_korean:
  - 지방
  - 도
  lexicon: LSJ
  rationale: χωρῶν은 여기서 제국 행정 구획을 가리키지만, 완전히 고정된 현대 행정용어보다 더 넓은 ‘관할 지역’이 원문의 폭을 덜 좁혀 줍니다.
- source_word: ἄρχουσι καὶ τοπάρχαις
  english_pob_choice: rulers and local governors
  chosen_korean: 통치자들과 지방 총독들
  alternatives_korean:
  - 관리들과 지역 통치자들
  - 지배자들과 지방 통치자들
  lexicon: LSJ
  rationale: ἄρχουσι는 일반적 통치권자, τοπάρχαις는 지역 단위의 지배자이므로, 각각의 역할 차이를 살려 ‘통치자들’과 ‘지방 총독들’로 구분했습니다.
- source_word: ὑποτεταγμένοις
  english_pob_choice: who are subject to him
  chosen_korean: 자기에게 복종하는 자들
  alternatives_korean:
  - 그에게 종속된 자들
  - 그에게 예속된 자들
  lexicon: LSJ
  rationale: 수동분사로서 왕 아래에 놓인 종속 상태를 나타내므로, 관계를 분명히 드러내는 ‘자기에게 복종하는 자들’이 자연스럽습니다.
