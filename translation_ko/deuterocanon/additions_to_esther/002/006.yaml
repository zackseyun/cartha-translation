  rationale: 본문은 여성과 아이들을 포함한 전면적 파괴를 명시하므로, 도덕적·서사적 긴장을 보존하는 것이 स्रोत 충실성에 맞습니다.
  doctrine_reference: Translation philosophy §§1, 6
