base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/002/006.yaml
  text: Therefore we have instructed those writing to you in the documents written by Haman[a], who was appointed over affairs and was our second father, to destroy all of them—together with women and children—root and branch, by the swords of their enemies, without any pity or sparing, on the fourteenth day of Adar, the twelfth month, of this present year[b],
  footnotes:
  - marker: a
    text: Or 'those who are writing to you by dictation.' The Greek participle can refer to officials who draft or dictate the wording of documents.
    reason: lexical_alternative
  - marker: b
    text: Literally 'our second father,' an honorific court expression for Haman's elevated status.
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 우리는 하만[a], 곧 일들을 맡아 다스리던 자이자 우리의 둘째 아버지였던 그가 쓴 문서들에 따라, 너희에게 명령을 전달하는 자들에게, 그해의 열두째 달 아달월 열나흗날에 적들의 칼로 여자들과 아이들까지 모두 뿌리째 멸망시키되, 어떤 연민이나 아낌도 없이 하라고 지시하였습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 일들을 맡아 다스리던 자라는 뜻입니다.
    reason: cultural_note
  - marker: b
    text: 직역하면 ‘우리의 둘째 아버지’로, 하만의 높아진 지위를 나타내는 궁정적 존칭입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ὑποστεῖλαιμεν
  english_pob_choice: we have instructed
  chosen_korean: 우리는 ... 지시하였습니다
  alternatives_korean:
  - 우리는 ... 명령하였습니다
  - 우리는 ... 전달하였습니다
  lexicon: LSJ
  rationale: 왕의 칙령 맥락에서 단순 전달보다 공적 지시의 뉘앙스가 더 맞아, 현대 공문체에 자연스러운 ‘지시하였습니다’로 옮겼습니다.
- source_word: τοῖς ὑπαγρευομένοις ὑμῖν
  english_pob_choice: those who are dictating to you
  chosen_korean: 너희에게 명령을 전달하는 자들
  alternatives_korean:
  - 너희에게 받아 적는 자들
  - 너희에게 받아쓰게 하는 자들
  lexicon: LSJ
  rationale: 해당 분사구는 정확한 직무를 과하게 특정하기보다, 칙령을 작성·전달하는 행정적 기능을 드러내는 쪽이 한국어로도 분명하여 이렇게 옮겼습니다.
- source_word: ὁλορριζεί
  english_pob_choice: root and branch
  chosen_korean: 뿌리째
  alternatives_korean:
  - 뿌리와 가지째
  - 완전히
  lexicon: LSJ
  rationale: 완전한 섬멸의 이미지를 살리면서도 한국어 관용에 맞게 압축해 표현했습니다.
- source_word: γυναιξί καὶ τέκνοις
  english_pob_choice: women and children
  chosen_korean: 여자들과 아이들까지
  alternatives_korean:
  - 부녀자들과 아이들까지
  - 여인들과 자녀들까지
  lexicon: LSJ
  rationale: γυναιξί를 직접적으로 ‘여자들’로 옮겨, 문맥의 잔혹성을 완화하지 않도록 했습니다.
- source_word: ἄνευ παντὸς οἴκτου καὶ φειδοῦς
  english_pob_choice: without any pity or sparing
  chosen_korean: 어떤 연민이나 아낌도 없이
  alternatives_korean:
  - 어떤 불쌍히 여김이나 아낌도 없이
  - 자비나 관용 없이
  lexicon: LSJ
  rationale: 두 명사를 나란히 살리되, 현대 한국어에서 자연스럽고 행정적 문맥에 맞는 부정 표현으로 정리했습니다.
theological_decisions:
- issue: 왕의 칙령이 명하는 폭력의 표현
  chosen_reading: 원문의 파괴 명령을 완화하지 않고 직접적으로 번역했습니다.
  alternative_readings:
  - 완곡하게 ‘처리하다’나 ‘제거하다’로 순화
  rationale: 본문은 여성과 아이들을 포함한 전면적 파괴를 명시하므로, 도덕적·서사적 긴장을 보존하는 것이 स्रोत 충실성에 맞습니다.
  doctrine_reference: Translation philosophy §§1, 6
- issue: ‘둘째 아버지’라는 궁정적 존칭
  chosen_reading: 직역형인 ‘우리의 둘째 아버지’로 유지했습니다.
  alternative_readings:
  - ‘우리의 제2 고문’
  - ‘우리의 최측근’
  rationale: 이 표현은 아람-헬라 권문 문체의 과장된 존칭을 담고 있어, 의미를 평탄화하지 않고 그대로 드러내는 편이 적절합니다.
  doctrine_reference: Courtly honorific usage in Additions to Esther
