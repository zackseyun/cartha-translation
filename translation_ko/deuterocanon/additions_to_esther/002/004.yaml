base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/002/004.yaml
  text: among all the tribes throughout the inhabited world there is mixed in a certain hostile people[a], opposed in its laws to every nation, and continually disregarding the decrees of the kings[c][b], so that the blameless joint-rule directed by us may not be maintained.
  footnotes:
  - marker: a
    text: Or 'contrary in their customs to every nation.' The Greek νόμοι can mean either 'laws' or, more broadly, customary practices.
    reason: lexical_alternative
  - marker: b
    text: The Greek text here is syntactically compressed; 'disregarding the decrees of the kings' reflects a likely sense of passing by or neglecting royal commands.
    reason: lexical_alternative
  - marker: c
    text: Or 'common government' or 'shared rule' for 'joint-rule' (Greek συναρχίαν).
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 민족들 가운데, 곧 온 세상에 흩어진 모든 지파들 사이에 어떤 적대적인 백성이 섞여 있으며, 그들은 자기들의 율법으로 모든 민족과 대립하고 왕들의 명령을 늘 저버리므로, 우리에 의해 흠 없이 이끌리는 공동 통치가 유지되지 못하게 하려는 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 민족과 관습이 다르다’는 뜻일 수 있습니다. Greek νόμοι는 ‘율법’뿐 아니라 넓게는 관습적 실천도 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 문장이 압축되어 있어, 여기서는 왕의 명령을 ‘저버리다/무시하다’는 뜻으로 풀었습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘공동 통치’는 Greek συναρχία를 옮긴 것으로, ‘공동 정부’ 또는 ‘공유 통치’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πάσαις ταῖς κατὰ τὴν οἰκουμένην φυλαῖς
  english_pob_choice: among all the tribes throughout the inhabited world
  chosen_korean: 모든 민족들 가운데, 곧 온 세상에 흩어진 모든 지파들 사이에
  alternatives_korean:
  - 온 세상에 있는 모든 지파들 사이에
  - 거주 세계 전체의 모든 부족들 가운데
  lexicon: LSJ
  rationale: φυλαῖς의 기본값인 ‘지파/부족’을 살리되, οἰκουμένη를 ‘온 세상’으로 옮겨 제국적 범위를 자연스럽게 드러냈습니다.
- source_word: ἀναμεμιγμένον δυσμενῆ λαόν τινα
  english_pob_choice: a certain hostile people
  chosen_korean: 어떤 적대적인 백성이 섞여 있으며
  alternatives_korean:
  - 어떤 원수 같은 백성이 섞여 있으며
  - 어떤 해로운 민족이 뒤섞여 있으며
  lexicon: LSJ
  rationale: dysmenē의 적대성을 살리고, ἀναμεμιγμένον은 단순 존재가 아니라 ‘섞여 있음’으로 옮겨 왕실 비난의 뉘앙스를 유지했습니다.
- source_word: τοῖς νόμοις ἀντίθετον πρὸς πᾶν ἔθνος
  english_pob_choice: opposed in its laws to every nation
  chosen_korean: 자기들의 율법으로 모든 민족과 대립하고
  alternatives_korean:
  - 그들의 법으로 모든 민족에 반대하고
  - 그 관습으로 모든 민족과 거슬리고
  lexicon: LSJ
  rationale: νόμοι는 여기서 율법/법규로도 읽히므로 ‘율법’으로 두되, ἀντίθετον의 대립성을 한국어 동사구로 직접 표현했습니다.
- source_word: τά τε τῶν βασιλέων παραπέμποντας διηνεκῶς προστάγματα
  english_pob_choice: continually disregarding the decrees of the kings
  chosen_korean: 왕들의 명령을 늘 저버리므로
  alternatives_korean:
  - 왕들의 칙령을 늘 무시하므로
  - 왕들의 명령을 끊임없이 지나쳐 버리므로
  lexicon: LSJ
  rationale: 압축된 구문에서 παραπέμπω를 ‘무시하다/저버리다’의 의미로 풀어 왕명 불복종을 분명하게 살렸습니다.
- source_word: τὴν ὑφʼ ἡμῶν κατευθυνομένην ἀμέμπτως συναρχίαν
  english_pob_choice: the blameless joint-rule directed by us
  chosen_korean: 우리에 의해 흠 없이 이끌리는 공동 통치
  alternatives_korean:
  - 우리의 인도로 흠 없이 운영되는 공동 통치
  - 우리에게서 지도받는 흠 없는 연합 통치
  lexicon: LSJ
  rationale: συναρχία를 ‘공동 통치’로, ἀμέμπτως를 ‘흠 없이’로, κατευθυνομένην을 ‘이끌리는’으로 옮겨 정치적 문맥을 살렸습니다.
theological_decisions:
