  chosen_reading: 이 구절의 적대적·선전적 어조를 중화하지 않고 그대로 드러냈습니다.
  alternative_readings:
  - 중립적인 서술로 완화하기
  - ‘다른 관습을 가진 백성’처럼 완곡하게 바꾸기
  rationale: 그리스어 원문은 유대인을 향한 왕실의 비난문이므로, 번역도 그 적대적 시각을 유지해야 본문의 역사적 긴장이 보존됩니다.
  doctrine_reference: 원문 우선 원칙; 긴장 완화 금지
