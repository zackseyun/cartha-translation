  text: And when I asked my counselors how this might be brought to completion[a], Haman showed us the way—he who excelled among us in prudence, had been proved unchanging in goodwill and in steadfast loyalty, and had received the second rank of honor in the kingdom.
  footnotes:
  - marker: a
    text: Or 'Haman pointed it out to us' or 'Haman made it known to us.' The Greek leaves the direct object implicit after 'how this might be brought to completion.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 대신에게 이 일이 어떻게 완수될 수 있는지 물었을 때, 하만이 우리에게 그 방도를 보여 주었습니다[a]. 그는 우리 가운데서 신중함에 뛰어났고, 호의에서는 변함없었으며, 확실한 신실함으로 입증되었고, 왕국에서 둘째 명예를 받아 지녔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하만이 우리에게 그것을 지시했다’ 혹은 ‘하만이 그것을 알려 주었다’로 옮길 수 있습니다. 그리스어는 ‘이 일이 어떻게 완수될 수 있는지’ 뒤에 직접목적어를 분명히 적지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πυθομένου δέ μου τῶν συμβούλων
  english_pob_choice: when I asked my counselors
  chosen_korean: 제가 대신에게 이 일이 어떻게 완수될 수 있는지 물었을 때
  alternatives_korean:
  - 제가 대신들에게 물었을 때
  - 제가 조언자들에게 문의했을 때
  lexicon: LSJ
  rationale: πυθομένου는 ‘묻다/알아보다’의 상황적 분사이므로 자연스러운 과거 종속구문으로 옮겼고, τῶν συμβούλων은 궁정 맥락에서 ‘대신’으로 풀어 왕의 측근 조언자라는 뉘앙스를 살렸습니다.
- source_word: σωφροσύνῃ παρʼ ἡμῖν διενέγκας
  english_pob_choice: he who excelled among us in prudence
  chosen_korean: 그는 우리 가운데서 신중함에 뛰어났고
  alternatives_korean:
  - 그는 우리 가운데서 절제에 뛰어났고
  - 그는 우리 가운데서 건전한 판단으로 두드러졌고
  lexicon: LSJ
  rationale: σωφροσύνη는 절제만이 아니라 분별 있는 판단과 신중함을 포함하므로, 이 궁정-행정 문맥에서는 ‘신중함’이 가장 직접적입니다.
- source_word: ἐν τῇ εὐνοίᾳ ἀπαραλλάκτως καὶ βεβαίᾳ πίστει ἀποδεδειγμένος
  english_pob_choice: unwavering in goodwill and steadfast fidelity
  chosen_korean: 호의에서는 변함없었으며, 확실한 신실함으로 입증되었고
  alternatives_korean:
  - 호의에서는 변동이 없었으며, 굳은 충성으로 입증되었고
  - 호의에서는 흔들림이 없었으며, 확고한 믿음으로 입증되었고
  lexicon: LSJ
  rationale: εὔνοια는 단순한 친절보다 궁정적 ‘호의/선의’가 적절하고, πίστις는 여기서 신앙이 아니라 충성·신뢰성의 의미이므로 ‘신실함’으로 옮겨 의미를 보존했습니다.
- source_word: δεύτερον τῶν βασιλείων γέρας ἀπενηνεγμένος
  english_pob_choice: had received the second rank of honor in the kingdom
  chosen_korean: 왕국에서 둘째 명예를 받아 지녔습니다
  alternatives_korean:
  - 왕국에서 둘째 지위를 받았습니다
  - 왕국의 두 번째 영예를 받았습니다
  lexicon: LSJ
  rationale: γέρας는 ‘명예/상’의 뜻이므로 이를 살리되, βασιλείων은 왕의 영토가 아닌 왕국 전체의 체계를 가리키는 말로 이해하여 간결하게 번역했습니다.
theological_decisions:
- issue: πίστις의 번역이 신앙인지, 충성/신실함인지
  chosen_reading: 여기서는 ‘신실함’으로 번역했습니다.
  alternative_readings:
  - 믿음
  - 충성
  - 충실함
  rationale: 문맥이 종교적 믿음이 아니라 왕실 봉사에서 입증된 인품을 말하므로, 독자가 오해하지 않도록 관계적·도덕적 신뢰성을 드러내는 표현을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: πίστις의 문맥 민감 번역 원칙'
- issue: 직접 화법이 아닌 왕의 회고문체를 합쇼체로 정리하는 문제
  chosen_reading: 서술문 전체를 현대 공식체로 유지했습니다.
  alternative_readings:
  - 더 구어적인 서술
  - 더 문어적인 고어체
  rationale: 원문은 왕의 회고적 보고체이므로, 현대 한국어의 공식 보고문체로 옮겨 장르와 공적 분위기를 유지했습니다.
  doctrine_reference: 'POB Korean style guide: modern formal-polite narrative'
