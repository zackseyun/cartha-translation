lexical_decisions:
- source_word: ἰδοὺ
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: BDAG
  rationale: 갑작스럽고 예언적인 주의 환기 기능을 살리기 위해 합쇼체 명령형인 「보십시오」를 택했습니다. 「보라」는 문체가 더 고전적이고, 「보세요」는 다소 구어적으로 느껴집니다.
- source_word: σκότους / γνόφου
  english_pob_choice: darkness / gloom
  chosen_korean: 어둠과 짙은 어둠
  alternatives_korean:
  - 어둠과 침침함
  - 어둠과 흑암
  lexicon: BDAG
  rationale: 두 어휘의 병렬을 한국어에서도 구분해 살리기 위해 「어둠」과 「짙은 어둠」으로 옮겼습니다. 「흑암」은 교회적 전통어가 강해 본문의 중첩된 시적 효과를 덜 직접적으로 드러냅니다.
- source_word: θλίψις / στενοχωρία
  english_pob_choice: affliction / distress
  chosen_korean: 고난과 곤경
  alternatives_korean:
  - 환난과 고통
  - 압박과 답답함
  lexicon: BDAG
  rationale: 압도적 고통과 옹색한 처지를 함께 드러내는 일반어로서 「고난」과 「곤경」이 가장 자연스럽습니다. 「환난」은 가능하지만 예언·종말론적 뉘앙스가 더 강해질 수 있습니다.
- source_word: κάκωσις
  english_pob_choice: misery
  chosen_korean: 비참함
  alternatives_korean:
  - 참상
  - 비통함
  - 학대
  lexicon: BDAG
  rationale: 이 목록에서 κάκωσις는 특정 가해자보다 비참한 상태 자체를 가리키므로, 결과 상태를 나타내는 「비참함」이 적절합니다. 「학대」는 외적 가해를 지나치게 특정합니다.
- source_word: τάραχος μέγας
  english_pob_choice: great turmoil
  chosen_korean: 큰 소란
  alternatives_korean:
  - 큰 혼란
  - 큰 동요
  - 큰 소동
  lexicon: BDAG
  rationale: τάραχος의 사회적·정서적 뒤흔들림을 살리되, μέγας를 자연스럽게 붙여 「큰 소란」으로 옮겼습니다. 「혼란」은 추상적이고, 「소동」은 다소 일상적입니다.
- source_word: ἐπὶ τῆς γῆς
  english_pob_choice: upon the earth
  chosen_korean: 땅 위에
  alternatives_korean:
  - 땅에
  - 세상에
  - 나라에
  lexicon: BDAG
  rationale: POB의 넓은 범위를 반영하되 한국어에서 가장 자연스러운 공간 표지로 옮겼습니다. 이 어구는 지구 전체라기보다 발화가 덮이는 광범위한 장면을 열어 줍니다.
