  - 세상에
  - 그 땅에
  rationale: 이 절은 재앙의 목록을 시적·전면적으로 제시하므로, 특정 지역을 가리키기보다 넓은 범위를 암시하는 표현이 적절합니다. 한국어에서는 「땅 위에」가 원문의 개방성을 비교적 잘 보존합니다.
  doctrine_reference: 'Translation philosophy: preserve the source''s plain sense and documented scope without over-specifying geography.'
