translation:
  language: ko
  text: 그리고 이것이 그의 꿈이었습니다. 보십시오[a], 소리와 소란, 우레와 지진, 그리고 땅 위의 뒤흔들림이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘소리들와 소동 … 땅 위의 동요.’ 헬라어 단어들은 음성 또는 소리를 뜻할 수 있고, γῆ는 ‘땅’ 또는 ‘땅(지역)’을 뜻할 수 있습니다.
    reason: lexical_alternative
