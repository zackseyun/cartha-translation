translation:
  language: ko
  text: 그들이 하나님께 부르짖었습니다. 그들의 부르짖음에서 마치 작은 샘에서 솟아나듯이 물이 풍성한 큰 강이 생겨났습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβόησαν
  english_pob_choice: cried out
  chosen_korean: 부르짖었습니다
  alternatives_korean:
  - 외쳤습니다
  - 소리쳤습니다
  lexicon: BDAG
  rationale: 하나님을 향한 간절한 호소라는 뉘앙스를 살리기 위해 단순한 고함보다 ‘부르짖다’를 택했습니다.
- source_word: πρὸς τὸν θεόν
  english_pob_choice: to God
  chosen_korean: 하나님께
  alternatives_korean:
  - 하나님을 향해
  - 하나님께로
  lexicon: BDAG
  rationale: πρός는 여기서 기도의 대상 방향을 나타내므로, 한국어에서는 자연스러운 여격 ‘하나님께’로 옮겼습니다.
- source_word: ὡσανεὶ ἀπὸ μικρᾶς πηγῆς ποταμὸς μέγας, ὕδωρ πολύ
  english_pob_choice: as it were, a great river from a little spring, abundant water
  chosen_korean: 마치 작은 샘에서부터 큰 강, 많은 물이 나온 것 같았습니다
  alternatives_korean:
  - 마치 작은 샘에서 큰 강이 솟아난 것 같았습니다
  - 마치 작은 샘에서부터 큰 강, 풍성한 물이 나온 것 같았습니다
  lexicon: LSJ
  rationale: ὡσανεί의 비교·근사 표시를 살려 ‘마치 … 것 같았습니다’로 처리했고, ‘샘/강’의 대비와 ὕδωρ πολύ의 다량성을 함께 드러냈습니다.
theological_decisions:
- issue: 비유적 시각화의 보존
  chosen_reading: ‘마치 … 것 같았습니다’로 처리해 강이 솟는 장면을 곧바로 사실 진술로 단정하지 않았습니다.
  alternative_readings:
  - 서술을 평서문처럼 매끈하게 만들어 비교 표지를 약화시키기
  - ‘…에서 큰 강이 솟아났다’처럼 직설적으로 옮기기
  rationale: 본문의 ὡσανεί는 유사·근사 표현이므로, 이 비교성을 유지해야 원문이 주는 환상적/상징적 긴장을 보존할 수 있습니다.
