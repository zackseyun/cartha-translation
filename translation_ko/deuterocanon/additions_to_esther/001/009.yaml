lexical_decisions:
- source_word: ἐβόησαν
  english_pob_choice: cried out
  chosen_korean: 부르짖었습니다
  alternatives_korean:
  - 외쳤습니다
  - 소리쳤습니다
  lexicon: BDAG
  rationale: 하나님을 향한 간절한 호소라는 뉘앙스를 살리기 위해 단순한 고함보다 ‘부르짖다’를 택했습니다.
