  - marker: b
    text: Or 'courtyard' or 'palace court.' The Greek word can refer to the enclosed court area of a royal residence.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 모르드개는 왕의 궁정에서, 왕궁의 뜰을 지키고 있던 왕의 두 내시 가바다와 다르라와 함께 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘조용히 있었다’, ‘가만히 있었다’, ‘잠잠했다’. 그리스어 동사는 정적 또는 침묵을 나타낼 수 있으므로, 문맥상 가장 무난한 표현을 택했습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘궁궐 뜰’, ‘궁정 뜰’. 그리스어 αὐλή는 왕실의 뜰 또는 궁정 공간을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡσύχασεν
  english_pob_choice: kept quiet
  chosen_korean: 있었습니다
  alternatives_korean:
  - 조용히 있었습니다
  - 가만히 있었습니다
  - 머물러 있었습니다
  lexicon: BDAG
  rationale: 이 동사는 이 문맥에서 단순히 정적 상태나 체류를 가리킬 수 있으므로, 한국어에서는 불필요하게 ‘조용히’라는 추정적 의미를 덧붙이지 않고 중립적인 ‘있었습니다’로 옮겼습니다.
- source_word: ἐν τῇ αὐλῇ
  english_pob_choice: in the court
  chosen_korean: 왕의 궁정에서
  alternatives_korean:
  - 궁정에서
  - 궁궐 뜰에서
  - 왕궁 뜰에서
  lexicon: LSJ
  rationale: αὐλή는 왕실의 뜰이자 궁정 공간을 가리킬 수 있으므로, 서술 맥락에 맞게 ‘왕의 궁정’으로 옮겨 왕실 공간성과 행정적 분위기를 함께 살렸습니다.
- source_word: εὐνούχων
  english_pob_choice: eunuchs
  chosen_korean: 내시
  alternatives_korean:
  - 환관
  - 궁정 관리
  lexicon: BDAG
  rationale: 원문이 구체적으로 ‘eunuchs’라고 말하므로, 완곡한 직함보다 한국어에서 직접 대응하는 ‘내시’를 사용해 원문의 구체성을 유지했습니다.
- source_word: φυλασσόντων τὴν αὐλήν
  english_pob_choice: who were guarding the court
  chosen_korean: 왕궁의 뜰을 지키고 있던
  alternatives_korean:
  - 궁정을 지키고 있던
  - 뜰을 경비하던
  lexicon: BDAG
  rationale: 분사는 진행 중인 경비 책임을 나타내므로 ‘지키고 있던’으로 자연스럽게 옮겼고, αὐλή의 공간성을 살리기 위해 ‘왕궁의 뜰’을 보완했습니다.
- source_word: Γαβὰθα / Θαῤῥὰ
  english_pob_choice: Gabatha / Tharra
  chosen_korean: 가바다와 다르라
  alternatives_korean:
