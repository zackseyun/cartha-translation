  yaml_path: translation/deuterocanon/additions_to_esther/001/012.yaml
  text: And Mordecai remained in the court with Gabatha and Tharra[a], the two eunuchs of the king who were guarding the court[b],
  footnotes:
  - marker: a
    text: Or 'was still' or 'remained quiet.' The Greek verb can denote quietness or stillness; 'kept quiet' is chosen because it fits the narrative setting of palace intrigue.
