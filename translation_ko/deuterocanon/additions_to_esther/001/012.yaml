  - 가바타와 타라
  lexicon: LSJ
  rationale: 그리스어 음가를 현대 한국어 표기법에 맞춰 최대한 직접 옮겼습니다.
theological_decisions:
- issue: ἡσύχασεν의 의미를 ‘침묵’으로 좁힐지, 단순 체류로 둘지
  chosen_reading: 이 절에서는 모르드개의 내적·외적 침묵을 단정하지 않고, 궁정에 함께 머물러 있던 상태를 중립적으로 표현했습니다.
  alternative_readings:
  - 조용히 있었습니다
  - 잠잠했습니다
  rationale: 문맥상 뒤따르는 궁정 음모 장면을 위해 ‘침묵’ 뉘앙스를 살릴 수는 있지만, 원문 자체가 반드시 말하지 않음의 의미만을 뜻한다고 단정할 수는 없으므로 과도한 신학적 해석을 피했습니다.
  doctrine_reference: 서사 본문 해석의 절제와 문맥 우선 원칙
- issue: ‘court’의 번역 범위
  chosen_reading: ‘왕의 궁정’으로 옮겨 공간적 뜰과 왕실 권력 중심이라는 두 의미를 함께 담았습니다.
  alternative_readings:
  - 궁정
  - 궁궐 뜰
  - 뜰
  rationale: αὐλή는 단순한 건축 공간보다 왕실 체제 안의 공적 공간을 가리킬 수 있어, 본문의 궁정 정황을 드러내는 번역을 택했습니다.
  doctrine_reference: 역사서/에스터서의 궁정 배경 해석
