translation:
  language: ko
  text: 그리고 그들의 외침[a]에 모든 민족이 의인들의 민족[b]과 싸우기 위하여 전쟁을 위해 준비되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘목소리’, ‘소리’. 그리스어는 그들이 낸 소음이나 외침을 더 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘의로운 민족’. 이 그리스어 구문은 ‘의인들의 민족’이라는 속격 표현으로도, 더 압축된 수식어로도 읽힐 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: φωνῇ αὐτῶν
  english_pob_choice: their cry
  chosen_korean: 그들의 외침
  alternatives_korean:
  - 그들의 소리
  - 그들의 목소리
  - 그들의 부르짖음
  lexicon: LSJ
  rationale: φωνή는 단순한 '목소리'보다 여기서는 집단적 소란과 선동적 울부짖음을 가리키므로, 전투 문맥에 맞는 '외침'이 가장 자연스럽습니다.
- source_word: ἡτοιμάσθη
  english_pob_choice: was made ready
  chosen_korean: 준비되었으니
  alternatives_korean:
  - 준비되었으니
  - 예비되었으니
  - 갖추어졌으니
  lexicon: LSJ
  rationale: 수동의 완료 감각을 한국어에서 과도하게 풀지 않으면서도, 외부 자극으로 전쟁 태세에 들어간 뉘앙스를 살리기 위해 '준비되다'를 택했습니다.
- source_word: πᾶν ἔθνος
  english_pob_choice: every nation
  chosen_korean: 모든 민족
  alternatives_korean:
  - 모든 나라
  - 각 민족
  - 온 민족
  lexicon: LSJ
  rationale: ἔθνος는 여기서 집단 단위를 가리키므로 '민족'이 적절하며, 분배적 의미를 살려 '모든'으로 옮겼습니다.
- source_word: δικαίων ἔθνος
  english_pob_choice: the nation of the righteous
  chosen_korean: 의인들의 민족
  alternatives_korean:
  - 의로운 민족
  - 의인들의 나라
  - 의인들의 백성
  lexicon: LSJ
  rationale: δικαίων의 속격을 직역해 '의인들의'로 두어, 본문의 묘사적 표현을 유지하고 특정 역사적 동일시를 본문에 미리 넣지 않았습니다.
theological_decisions:
- issue: δικαίων ἔθνος의 식별을 본문에서 어떻게 처리할지
  chosen_reading: 본문은 '의인들의 민족'으로 옮기되, 특정 집단(이스라엘/유대인)으로 명시적으로 풀지 않았습니다.
  alternative_readings:
  - 의로운 민족
  - 유대인의 민족
  - 의인들의 나라
  rationale: 그리스어는 설명적 구문을 사용하므로, 번역이 그 식별을 앞서 결정하지 않도록 해석의 긴장을 보존했습니다.
  doctrine_reference: 원문 우선 원칙과 해석의 긴장 보존
