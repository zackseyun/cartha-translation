translation:
  language: ko
  text: 보십시오[a], 큰 용 두 마리가 모두 싸울 준비가 되어 앞으로 나왔습니다. 그리고 그들에게서 큰 소리가 났습니다[b].
  philosophy: optimal-equivalence
  footnotes:
