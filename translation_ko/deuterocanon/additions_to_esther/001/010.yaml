  text: Light and the sun rose[b][a], and the lowly were exalted and devoured the glorious.
  footnotes:
  - marker: a
    text: Or 'the humble' for 'the lowly.' The Greek can describe either humble disposition or low social status; the main text preserves the reversal of status.
