  rationale: 일상적이면서도 고전적 이미지에 어울리는 표준어 ‘해’를 선택했습니다.
- source_word: ὑψώθησαν
  english_pob_choice: were lifted up
  chosen_korean: 높임을 받았으며
  alternatives_korean:
  - 들려 올려졌으며
  - 높아졌으며
  - 들어 올려졌으며
  lexicon: LSJ
  rationale: 수동형의 ‘높여짐’과 신분 역전의 의미를 자연스러운 한국어로 살리기 위해 ‘높임을 받다’로 옮겼습니다.
- source_word: τοὺς ἐνδόξους
  english_pob_choice: the glorious
  chosen_korean: 영화로운 자들
  alternatives_korean:
  - 존귀한 자들
  - 영예로운 자들
  - 영광스러운 자들
  lexicon: LSJ
  rationale: ἐνδόξους의 ‘영광/명예를 지닌 자들’이라는 뜻을 반영하되, 본문의 대비를 유지하기 위해 ‘영화로운 자들’로 옮겼습니다.
theological_decisions:
- issue: ταπεινοί를 단순한 내적 겸손으로 좁힐지, 사회적 낮은 신분까지 열어둘지
  chosen_reading: ‘낮은 자들’로 옮겨 겸손한 성향과 낮은 사회적 지위를 모두 포괄하게 했습니다.
  alternative_readings:
  - 겸손한 자들
  - 억눌린 자들
  rationale: 영어 POB가 ‘the lowly’를 택해 신분 역전의 이미지를 보존하므로, 한국어도 해석을 과도하게 좁히지 않는 표현이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
