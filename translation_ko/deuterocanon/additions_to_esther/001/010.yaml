  text: Light and the sun rose[b][a], and the lowly were exalted and devoured the glorious.
  footnotes:
  - marker: a
    text: Or 'the humble' for 'the lowly.' The Greek can describe either humble disposition or low social status; the main text preserves the reversal of status.
    reason: lexical_alternative
  - marker: b
    text: Or 'the honored' or 'the noble' for 'the glorious.' The Greek refers to those possessing honor or renown.
    reason: lexical_alternative
translation:
  language: ko
  text: 빛과 해가 떴고, 낮은 자들은 높임을 받았으며, 영화로운 자들은 삼켜졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘겸손한 자들’. 헬라어 ταπεινοί는 내적 겸손과 낮은 사회적 지위를 모두 가리킬 수 있으므로, 본문은 신분 역전의 이미지를 살립니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘존귀한 자들’이나 ‘귀한 자들’. 헬라어 ἐνδόξους는 명예나 명성을 지닌 사람들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς
  english_pob_choice: Light
  chosen_korean: 빛
  alternatives_korean:
