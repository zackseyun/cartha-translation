translation:
  language: ko
  text: 그는 바빌론 왕 느부갓네살이 유다 왕 여고냐와 함께 예루살렘에서 사로잡아 간 포로들[a] 가운데 한 사람이었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘포로 상태에서 [온 사람]’. 그리스어는 문자적으로 ‘포로 상태에서’라고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘유다 왕’은 이 문맥에서 유다 왕국의 왕을 가리킵니다. 그리스어의 표현은 ‘유대/유다아의 왕’에 가깝습니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκ τῆς αἰχμαλωσίας
  english_pob_choice: from the captivity
  chosen_korean: 포로 된 사람들 가운데서 나온
  alternatives_korean:
  - 포로에서 나온
  - 사로잡힌 자들 가운데서 나온
  lexicon: BDAG
  rationale: αἰχμαλωσία는 집단적 포로 상태를 가리키므로, 단순한 지리적 ‘~에서’보다 ‘포로 된 사람들 가운데서 나온’이 의미를 더 분명하게 전합니다.
- source_word: ᾐχμαλώτευσεν
  english_pob_choice: had carried away
  chosen_korean: 사로잡아 간
  alternatives_korean:
  - 포로로 끌고 간
  - 사로잡아 데려간
  lexicon: BDAG
  rationale: 강제 이송의 뉘앙스를 살리면서도 문맥에 자연스러운 한국어 동사구로 옮겼습니다.
- source_word: Ναβουχοδονόσορ βασιλεὺς Βαβυλῶνος
  english_pob_choice: Nebuchadnezzar king of Babylon
  chosen_korean: 바빌론의 왕 느부갓네살
  alternatives_korean:
  - 바빌론 왕 느부갓네살
  - 바벨론의 왕 느부갓네살
  lexicon: 역사적 고유명사 표기
  rationale: 왕호와 왕명을 현대 한국어 관용에 맞게 배열했고, 바빌론은 표준 음역보다 통용되는 ‘바빌론’을 사용했습니다.
- source_word: Ἰεχονίου τοῦ βασιλέως τῆς Ἰουδαίας
  english_pob_choice: Jeconiah king of Judah
  chosen_korean: 유다 왕 여고냐
  alternatives_korean:
  - 유다의 왕 여고냐
  - 유다 왕 여호야긴
  lexicon: 역사적 고유명사 표기
  rationale: Ἰεχονίου는 한국어 성경 전통의 ‘여고냐’로 옮겨 식별성을 확보했고, τῆς Ἰουδαίας는 문맥상 왕호로 자연스럽게 ‘유다 왕’으로 풀었습니다.
theological_decisions:
- issue: τῆς Ἰουδαίας를 지리명 ‘유대’로 둘지, 왕권 문맥의 ‘유다’로 둘지
  chosen_reading: ‘유다 왕 여고냐’로 번역해 왕조적·역사적 맥락을 드러냈습니다.
  alternative_readings:
  - 유대 왕 여고냐
  - 유다 사람들의 왕 여고냐
  rationale: 본문은 포로기와 예루살렘, 느부갓네살의 강제 이송을 배경으로 하므로, 지리명보다 유다 왕국의 왕조적 정체성을 살리는 것이 원문의 역사적 지시를 더 잘 반영합니다.
  doctrine_reference: 번역 원칙 §source-first, 역사적 맥락 보존
- issue: ‘from the captivity’의 상태 표현을 한국어에서 어떻게 처리할지
  chosen_reading: ‘포로 된 사람들 가운데서 나온’으로 상태와 출처를 함께 드러냈습니다.
  alternative_readings:
  - 포로에서 나온
  - 포로들 가운데서 나온
  rationale: 단순한 출생지 표기가 아니라 포로 신분 집단 내부 기원을 나타내므로, 상태와 출처를 함께 살리는 표현이 가장 안전합니다.
  doctrine_reference: 번역 원칙 §source-first, 어휘의 긴장 보존
