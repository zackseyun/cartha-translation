  text: 그리고 모르드개는 이 꿈과 하나님께서 하시기로 뜻하신 일을 본 뒤 깨어나, 그것을 마음에 간직했고[a], 밤이 될 때까지 그것을 모든 면에서 깨닫고자 했습니다[b].
