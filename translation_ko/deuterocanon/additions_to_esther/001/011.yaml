  text: 그리고 모르드개는 이 꿈을 보고, 하나님께서 하시려는 일을 알게 된 뒤 깨어나자, 그것을 자기 마음에 간직했고[a], 밤이 될 때까지 모든 일에서 그것을 이해하려고 했습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문의 ‘ἐν Β τῇ καρδίᾳ’는 인쇄·전사상 오탈자나 편집 흔적으로 보이며, 의미상 ‘마음에’로 읽는 것이 자연스럽습니다.
    reason: textual_variant
  - marker: b
    text: 원문의 ἐν παντὶ λόγῳ는 ‘모든 말’보다 넓게 ‘모든 일/사항/경우’까지 이를 수 있는 표현입니다.
