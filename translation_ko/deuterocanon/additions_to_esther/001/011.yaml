    reason: textual_variant
  - marker: b
    text: 원문의 ἐν παντὶ λόγῳ는 직역하면 ‘모든 말에서’이지만, 여기서는 꿈과 관련된 모든 사항·면·경우를 가리킬 수 있습니다.
