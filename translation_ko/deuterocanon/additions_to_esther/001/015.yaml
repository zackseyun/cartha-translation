  rationale: μνημόσυνον의 기념·기억 보존의 뜻을 한국어에서 자연스럽게 드러내기 위해 ‘기념으로’를 택했습니다.
- source_word: περὶ τῶν λόγων τούτων
  english_pob_choice: concerning these words
  chosen_korean: 이 말들에 관하여
  alternatives_korean:
  - 이 일들에 관하여
  - 이 내용에 관하여
  - 이 사건에 대하여
  lexicon: BDAG
  rationale: περί + 속격의 ‘관하여/대하여’ 의미를 살리면서 앞의 λόγοι 반복도 유지하도록 했습니다.
