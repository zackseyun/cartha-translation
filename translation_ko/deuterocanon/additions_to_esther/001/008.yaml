base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/001/008.yaml
  text: And every righteous nation was thrown into turmoil[a], fearing their own calamities[c][b], and they prepared to perish.
  footnotes:
  - marker: a
    text: Or 'every just nation was troubled.' The Greek δίκαιον can be rendered 'righteous' or 'just,' and ἐταράχθη can be translated 'was troubled' or 'was disturbed.'
    reason: lexical_alternative
  - marker: b
    text: Or 'their own evils' or 'the disasters facing them.' The phrase τὰ ἑαυτῶν κακά refers to the harms or calamities they feared would come upon them.
    reason: lexical_alternative
  - marker: c
    text: Or 'they prepared to be destroyed.' The infinitive ἀπολέσθαι can emphasize either perishing or being destroyed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 모든 의로운 나라가 자기 재앙을 두려워하여 혼란에 빠졌고, 그들은 멸망할 준비를 했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 의로운 나라가 흔들렸다.’ 그리스어 ἐταράχθη는 ‘혼란에 빠지다’ 또는 ‘동요하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자기들의 악들’ 또는 ‘그들 앞에 닥칠 재난들’. τὰ ἑαυτῶν κακά는 그들이 두려워한 해악이나 재앙을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘멸망하도록 준비했다.’ ἀπολέσθαι는 ‘멸망하다’와 ‘파괴되다’의 의미를 모두 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιον πᾶν ἔθνος
  english_pob_choice: every righteous nation
  chosen_korean: 모든 의로운 나라
  alternatives_korean:
  - 모든 공정한 나라
  - 모든 바른 나라
  - 모든 의로운 민족
  lexicon: BDAG
  rationale: δίκαιον은 단순한 법적 ‘정당함’보다 도덕적·종교적 ‘의로움’의 색채를 띠므로 ‘의로운’이 POB의 ‘righteous’를 가장 잘 반영합니다. ἔθνος은 여기서 ‘나라’로 옮기면 집합적 단위를 자연스럽게 살릴 수 있습니다.
- source_word: ἐταράχθη
  english_pob_choice: was thrown into turmoil
  chosen_korean: 혼란에 빠졌고
  alternatives_korean:
  - 소동에 휩싸였고
  - 동요했고
  - 불안해했고
  lexicon: BDAG
  rationale: 수동형 ταράσσω의 강한 동요·교란을 살리면서, 한국어에서는 상태 변화를 자연스럽게 드러내는 ‘혼란에 빠지다’가 가장 적절합니다.
- source_word: τὰ ἑαυτῶν κακά
  english_pob_choice: their own calamities
  chosen_korean: 자기 재앙
  alternatives_korean:
  - 자기들의 재난
  - 자기들의 악한 일
  - 닥칠 재난
  lexicon: BDAG
  rationale: κακά는 문자적으로 ‘악한 것들’이지만, 문맥상 그들이 두려워한 해악·참사를 가리키므로 ‘재앙’이 의미를 분명하게 전달합니다. 소유대명사는 간결하게 ‘자기’로 처리했습니다.
- source_word: ἀπολέσθαι
  english_pob_choice: to perish
  chosen_korean: 멸망할 준비를 했습니다
  alternatives_korean:
  - 망할 준비를 했습니다
  - 죽을 준비를 했습니다
  - 파멸될 준비를 했습니다
  lexicon: BDAG
  rationale: ἀπόλλυμι의 중간/부정사 의미를 ‘멸망하다’로 옮기면 단순한 죽음보다 더 강한 파괴·소멸의 뉘앙스를 살릴 수 있습니다.
theological_decisions:
- issue: δίκαιον의 정서적·도덕적 뉘앙스
  chosen_reading: ‘의로운’으로 옮겨, 단지 ‘공정한/정당한’이 아니라 하나님 앞에서의 도덕적 의로움을 드러냈습니다.
  alternative_readings:
  - ‘공정한’으로 옮길 수 있습니다.
  - ‘정당한’으로 옮길 수 있습니다.
  rationale: 본문은 재앙 앞에서 떨고 있는 대상을 묘사하면서 그들의 무고함/의로움을 암시하므로, 종교적 색채가 약한 ‘공정한’보다 ‘의로운’이 더 적절합니다.
  doctrine_reference: 'DOCTRINE.md: δικαιοσύνη 계열은 가능한 한 신학적 무게를 유지해야 합니다.'
