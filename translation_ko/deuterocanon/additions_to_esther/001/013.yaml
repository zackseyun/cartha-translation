  source_fidelity: 초안은 전반적으로 본문의 사건 순서와 핵심 의미를 잘 반영합니다. 다만 ἠκρόασεν의 주의 깊은 청취는 ‘들었고’보다 ‘귀 기울였고’가 더 적절하며, ἐξηραύνησεν은 ‘알아냈으며’에 흡수하지 않고 ‘자세히 조사했으며’로 명시하는 편이 충실합니다. μερίμνας는 이 문맥에서 ‘의도’로 가능하나, 한국어 복수형 ‘의도들’은 부자연스럽습니다.
  naturalness: ‘계획과 의도들을 들었고’는 병렬 목적어와 복수 접미사 때문에 다소 번역투입니다. 동사를 나누어 ‘계획에 귀 기울이고 그들의 의도를 자세히 조사했으며’로 하면 현대 한국어 문장 흐름이 자연스럽고 원문의 두 동작도 살아납니다. 각주 표지는 해당 관용구 바로 뒤에 두는 것이 명확합니다.
  terminology: ‘아르타크세르크세스 왕’은 그리스어 Ἀρταξέρξῃ의 음역으로 적절합니다. ‘손을 대다’는 원문의 관용구를 보존하지만 한국어만으로 적대 행위가 충분히 드러나지 않을 수 있으므로, 본문은 보존하고 각주에서 공격을 뜻할 수 있음을 밝혀야 합니다. ‘그들에 관해’보다 ‘그들에 관한 일을’이 ὑπέδειξεν ... περὶ αὐτῶν의 보고 내용을 더 자연스럽게 나타냅니다.
