translation:
  language: ko
  text: 그는 그들의 계획에 귀 기울이고 그들의 의도를 자세히 조사했으며, 그들이 아르타크세르크세스 왕에게 손을 대려고[a] 준비하고 있다는 것을 알아냈습니다. 그리고 그들에 관한 일을 왕에게 알렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘아르타크세르크세스 왕에게 손을 대다’입니다. 이 관용구는 적대적인 행동, 더 구체적으로는 공격을 뜻할 수 있습니다.
    reason: lexical_alternative
