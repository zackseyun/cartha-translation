translation:
  language: ko
  text: 그는 그들의 계획과 의도들을 들었고, 그들이 아르타크세르크세스 왕에게 손을 대려고 준비하고 있음을 알아냈으며, 왕에게 그들에 관해 알려 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그에게 손을 대다’입니다. 이 관용구는 적대 행위, 더 구체적으로는 공격을 뜻할 수 있습니다.
    reason: lexical_alternative
