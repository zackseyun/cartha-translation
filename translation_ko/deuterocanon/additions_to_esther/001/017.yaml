  text: And Haman son of Hammedatha[a], the Bougaean, was honored before the king, and he was seeking to harm Mordecai and his people because of the king’s two eunuchs.
  footnotes:
  - marker: a
    text: Greek 'Bougaean.' A more familiar tradition identifies Haman as 'Agagite,' but this Greek witness reads Bougaean.
