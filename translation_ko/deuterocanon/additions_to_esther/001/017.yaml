translation:
  language: ko
  text: 그리고 함므다다의 아들 하만, 곧 부가이 사람[a]은 왕 앞에서 존귀한 자였으며, 왕의 두 내시 때문에 모르드개와 그의 백성을 해치려 하고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 ‘부가이 사람’이라는 명칭인 Βουγαῖος를 읽습니다. 더 익숙한 전승에서는 하만을 ‘아각 사람’으로 부르지만, 이 그리스어 본문은 그렇게 읽지 않습니다.
    reason: alternative_reading
