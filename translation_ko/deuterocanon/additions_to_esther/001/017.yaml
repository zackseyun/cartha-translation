  text: 그리고 아마다드의 아들 하만, 부가이 사람은 왕 앞에서 존귀한 사람이었으며, 그는 왕의 두 내시 때문에 모르드개와 그의 백성을 해치려 하고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
