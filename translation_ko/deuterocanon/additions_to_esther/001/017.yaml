    text: 그리스어 본문은 ‘부가이 사람’을 뜻하는 Βουγαῖος를 읽습니다. 더 익숙한 전승은 하만을 ‘아각 사람’으로 부르지만, 이 증인은 그렇지 않습니다.
    reason: alternative_reading
