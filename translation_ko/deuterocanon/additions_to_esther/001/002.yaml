    reason: lexical_alternative
  - marker: b
    text: 또는 ‘유력한 사람’. 그리스어의 ‘큰’은 왕실 환경에서 지위나 중요성을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘왕의 궁정에서 시중들고 있는’. 이 분사는 봉사뿐 아니라 궁정에서의 대기를 뜻할 수 있습니다.
