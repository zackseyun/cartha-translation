  text: And the king ordered Mordecai to serve in the court[a], and he gave him gifts on account of these things.
  footnotes:
  - marker: a
    text: Or 'at court.' The Greek phrase literally says 'in the court,' referring to service within the royal court or palace precinct.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 왕은 모르드개에게 궁정에서 섬기라고 명하고, 이러한 일들 때문에 그에게 선물들을 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘궁정에서’. 그리스어 표현은 문자적으로는 ‘궁정 안에서’라고 되어 있으며, 왕실 궁정이나 궁궐 구역에서의 섬김을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέταξεν
  english_pob_choice: ordered
  chosen_korean: 명하고
  alternatives_korean:
