  text: 그리고 왕은 모르드개에게 궁정에서[a] 섬기라고 명하였고, 이러한 일들 때문에 그에게 선물을 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘궁중에서’. 그리스어 표현은 문자적으로 ‘궁정 안에서’이며, 왕실 궁정이나 궁궐 구역에서 섬기는 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέταξεν
  english_pob_choice: ordered
  chosen_korean: 명하고
  alternatives_korean:
  - 명령하고
  - 지시하고
  - 임명하고
  lexicon: BDAG
  rationale: 왕의 권위 있는 지시를 자연스러운 현대 문체로 살리면서, ‘임명하다’처럼 직책 부여로 오해될 가능성을 피했습니다.
- source_word: θεραπεύειν
  english_pob_choice: to serve
  chosen_korean: 섬기라고
  alternatives_korean:
  - 봉사하라고
  - 시중들라고
  - 모시라고
  lexicon: LSJ
  rationale: 궁정 문맥의 ‘attendance/service’를 반영하되, 지나치게 종교적인 ‘봉사하다’보다 궁정 섬김의 의미가 드러나도록 했습니다.
- source_word: ἐν τῇ αὐλῇ
  english_pob_choice: in the court
  chosen_korean: 궁정에서
  alternatives_korean:
  - 궁궐 뜰에서
  - 궁중에서
  - 궁정 안에서
  lexicon: LSJ
  rationale: αὐλή의 장소적 의미를 살리면서 한국어로는 왕실 행정 공간을 가장 자연스럽게 드러내는 ‘궁정’을 택했습니다.
- source_word: δόματα
  english_pob_choice: gifts
  chosen_korean: 선물들을
  alternatives_korean:
  - 선물을
  - 증정품을
  - 사은품을
  lexicon: LSJ
  rationale: 왕이 베푼 물건의 성격을 직접적으로 보이게 하되, 보상이라는 해석을 덧붙이지 않도록 중립적인 ‘선물’을 사용했습니다.
- source_word: περὶ τούτων
  english_pob_choice: on account of these things
  chosen_korean: 이러한 일들 때문에
  alternatives_korean:
  - 이 일들 때문에
