  text: …[a] 온통 금과 값비싼 보석으로 덮여 있었고, 그는 몹시 두려운 모습이었습니다. 그는 분노가 극에 달한 가운데 영광으로 불타오르는 얼굴을 들고 바라보았습니다. 그러자 왕비는 쓰러져 실신하며 얼굴빛이 변하였고, 앞서 가던 연약한 시녀의 머리 위로 몸을 숙였습니다.
