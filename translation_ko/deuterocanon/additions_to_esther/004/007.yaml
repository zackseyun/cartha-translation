  source_fidelity: 개시부의 전승상 불완전함을 생략 부호로 드러낸 점은 적절합니다. 다만 πεπυρωμένον은 τὸ πρόσωπον(얼굴)을 수식하므로, ‘얼굴로 바라보았습니다’보다 ‘영광으로 불타오르는 얼굴을 들고 바라보았습니다’로 옮겨 문법적 관계를 분명히 하는 것이 좋습니다. κατέκυψεν ἐπὶ τὴν κεφαλὴν은 시녀의 머리 ‘위에’ 단순히 몸을 굽힌 것보다 그 머리 쪽으로 몸을 숙여 기댄 동작을 나타냅니다.
