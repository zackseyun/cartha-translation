translation:
  language: ko
  text: …온전히 금과 값비싼 돌들로 덮여 있었고, 그는 매우 두려운 모습이었습니다. 그리고 자기 얼굴을 들어 올리자, 분노의 극한에서 영광으로 불타오르는 얼굴로 바라보았습니다. 그러자 왕비는 쓰러지고 실신하여 얼굴빛이 변하였으며, 앞서 가던 부드러운 시녀의 머리 위에 몸을 굽혔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제공된 그리스어 증거는 이 절의 첫 부분이 중간에서 시작하므로, 앞부분을 재구성하지 않고 생략 부호로 표시했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ὅλος διὰ χρυσοῦ καὶ λίθων πολυτελῶν
  english_pob_choice: entirely covered with gold and costly stones
  chosen_korean: 온전히 금과 값비싼 돌들로 덮여 있었고
  alternatives_korean:
  - 금과 귀한 돌들로 온몸을 치장한
  - 모두 금과 보석으로 장식된
  lexicon: LSJ
  rationale: 생략된 서술을 임의로 보충하지 않고, 현전하는 묘사인 ‘금과 값비싼 돌들’의 전면적 덮임을 한국어로 자연스럽게 옮겼습니다.
- source_word: φοβερὸς σφόδρα
  english_pob_choice: very terrifying
  chosen_korean: 매우 두려운 모습이었습니다
  alternatives_korean:
  - 매우 무서운 모습이었습니다
  - 극히 두려운 존재였습니다
  lexicon: LSJ
  rationale: 단순한 감정이 아니라 외양이 주는 압도적 공포를 가리키므로, ‘모습’으로 풀어 인상과 시각적 효과를 살렸습니다.
- source_word: πεπυρωμένον δόξῃ
  english_pob_choice: blazing with splendor
  chosen_korean: 영광으로 불타오르는
  alternatives_korean:
  - 광채로 타오르는
  - 영광의 빛으로 불타는
  lexicon: LSJ
  rationale: πεπυρωμένον의 ‘불타다’와 δόξῃ의 ‘영광/광휘’를 함께 살리기 위해, 직역과 자연스러움 사이에서 ‘영광으로 불타오르는’으로 옮겼습니다.
- source_word: ἐν ἀκμῇ θυμοῦ
  english_pob_choice: at the height of anger
  chosen_korean: 분노의 극한에서
  alternatives_korean:
  - 분노의 절정에서
  - 분노가 최고조에 달했을 때
  lexicon: LSJ
  rationale: ἀκμή의 최고점 의미를 살려, 분노가 절정에 이른 상태임을 간결하게 표현했습니다.
- source_word: μετέβαλε τὸ χρῶμα αὐτῆς ἐν ἐκλύσει
  english_pob_choice: changed color in faintness
  chosen_korean: 실신하여 얼굴빛이 변하였으며
  alternatives_korean:
  - 기절하며 얼굴빛이 변하였으며
  - 기운이 빠져 안색이 달라졌으며
  lexicon: LSJ
  rationale: ἐκλύσει를 단순한 ‘연약함’보다 실제적 붕괴·실신의 상황으로 이해해, 얼굴빛 변화와 함께 한국어로 명확히 드러냈습니다.
- source_word: κατέκυψεν
  english_pob_choice: she bent down
  chosen_korean: 몸을 굽혔습니다
  alternatives_korean:
  - 숙였습니다
  - 엎드렸습니다
  lexicon: LSJ
  rationale: 의도적 예배 동작이 아니라 쓰러짐의 연장선상에 있는 하강 동작이므로, 과도한 종교적 뉘앙스를 피했습니다.
theological_decisions:
- issue: 전승 단절이 있는 첫 부분의 처리
  chosen_reading: 문장 앞에 생략 부호(…)를 두어, 제공된 그리스어가 장면 묘사의 중간에서 시작함을 드러냈습니다.
  alternative_readings:
  - 앞 문맥을 추정해 주어를 보충함
  - 생략 없이 완전한 문장처럼 매끈하게 옮김
  rationale: 제공된 증거가 개시부를 온전히 보존하지 않으므로, 본문 불확정성을 숨기지 않는 것이 POB의 투명성 원칙에 부합합니다.
  doctrine_reference: transparency in source handling; preserve textual uncertainty honestly
- issue: ‘분노’와 ‘영광’의 결합 표현
  chosen_reading: ‘영광으로 불타오르는 얼굴로’와 ‘분노의 극한’으로, 왕의 위압적·광휘적 상태를 함께 살렸습니다.
  alternative_readings:
  - ‘위엄으로 빛나는 얼굴’처럼 완화하여 표현함
  - ‘진노의 한가운데’로만 옮겨 광휘 요소를 약화함
  rationale: 본문은 공포와 광휘를 동시에 제시하므로, 한쪽을 약화하지 않고 긴장감을 유지하는 쪽이 원문 효과에 더 가깝습니다.
  doctrine_reference: source imagery preservation; do not domesticate vivid courtly description
