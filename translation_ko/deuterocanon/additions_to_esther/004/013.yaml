translation:
  language: ko
  text: 그리고 그가 그에게 말했습니다[a], 「임금님, 제가 당신을 하나님의 천사처럼 보았고, 당신의 영광을 두려워하여 제 마음이 흔들렸습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “임금님, 제가 당신을 하나님의 천사와 같이 보았습니다.” 그리스어 ὡς는 ‘처럼’ 또는 ‘같이’로 옮길 수 있으며, 여기서는 상대방을 천사와 동일시하기보다 비교하는 뜻입니다.
    reason: lexical_alternative
