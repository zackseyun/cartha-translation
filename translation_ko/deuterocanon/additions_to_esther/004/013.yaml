- source_word: ὡς ἄγγελον θεοῦ
  english_pob_choice: like an angel of God
  chosen_korean: 하나님의 천사 같은 분
  alternatives_korean:
  - 하나님의 천사처럼
  - 하나님의 천사로
  lexicon: BDAG
  rationale: ὡς의 비교적 성격을 유지하기 위해 동일시가 아니라 유사성으로 옮겼고, ‘천사’는 초월적 광휘와 경외를 살리는 표현으로 보존했습니다.
- source_word: ἐταράχθη ἡ καρδία μου
  english_pob_choice: my heart was troubled
  chosen_korean: 제 마음은 … 흔들렸습니다
  alternatives_korean:
  - 제 마음은 … 괴로워졌습니다
  - 제 마음은 … 불안해졌습니다
  lexicon: BDAG
  rationale: ταράσσω의 내면 동요를 한국어의 자연스러운 심리 동사 ‘흔들리다’로 옮겨, 뒤의 ‘두려움’이 그 원인임을 드러냈습니다.
- source_word: ἀπὸ φόβου τῆς δόξης σου
  english_pob_choice: with fear because of your glory
  chosen_korean: 당신의 영광 때문에 두려움으로
  alternatives_korean:
  - 당신의 영광으로 인한 두려움 때문에
  - 당신의 영광을 보고 두려워서
  lexicon: BDAG
  rationale: ἀπό + 명사구의 원인 의미를 살려 ‘때문에’로 옮기고, δόξα는 신학적 울림을 살려 ‘영광’으로 유지했습니다.
theological_decisions:
- issue: 직접 호칭 κύριε의 한국어 처리
  chosen_reading: 인간 왕에 대한 공손한 직접 호칭으로 두되, 하나님 칭호인 ‘주님’은 사용하지 않았습니다.
  alternative_readings:
  - 주님
  - 임금님
  rationale: 에스더의 문맥은 왕 앞에 나아가는 두려움의 장면이므로, 신적 호칭으로 오해될 수 있는 번역을 피하면서도 존칭을 유지하는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 'DOCTRINE.md: κύριος는 문맥상 인간 통치자일 때 그에 맞게 번역해야 함.'
