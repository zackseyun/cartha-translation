  - marker: b
    text: 또는 ‘그녀가 몸을 추스를 때까지’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘평화의 말로’ 또는 ‘안심시키는 말로’.
    reason: lexical_alternative
