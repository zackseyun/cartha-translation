translation:
  language: ko
  text: 그리고 하나님께서는 왕의 영을 온유로 바꾸셨습니다[a]. 왕은 고통 가운데서 자기의 왕좌에서 벌떡 일어나 그녀를 자기 팔에 안고, 그녀가 진정할 때까지 그렇게 하였으며[b], 평화로운 말로 그녀를 위로했습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕의 성향’ 또는 ‘왕의 마음’. 그리스어는 ‘영’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그녀가 진정할 때까지’가 아니라 ‘그녀가 스스로 가라앉을 때까지’라는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘평화의 말로’ 또는 ‘안심시키는 말로’.
    reason: lexical_alternative
