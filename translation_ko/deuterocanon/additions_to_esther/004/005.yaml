translation:
  language: ko
  text: 그녀는 아름다움이 절정에 이른 채 얼굴을 붉히고[a], 그 얼굴은 다정한 듯 밝았으나[b], 그 마음은 두려움으로 조여 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아름다움이 절정에 이른 채 홍조를 띠고.’ 그리스어는 붉어짐을 나타내는 분사와 ‘아름다움의 절정’이라는 표현을 결합합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 얼굴은 밝고 사랑스러워 보였습니다.’ 그리스어의 비교 표현은 ‘마치’ 또는 ‘…듯’으로도 옮길 수 있습니다.
    reason: lexical_alternative
