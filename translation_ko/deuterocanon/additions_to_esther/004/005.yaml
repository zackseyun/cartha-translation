translation:
  language: ko
  text: 그녀는 자신의 아름다움의 절정에서 붉게 물들었고, 그녀의 얼굴은 마치 사랑받는 사람처럼 즐거웠지만, 그녀의 마음은 두려움 때문에 조여 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아름다움의 절정에서 얼굴이 붉어졌습니다.’ Greek은 ‘붉어짐/홍조’와 ‘아름다움의 절정’이라는 두 요소를 결합합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그녀의 얼굴은 밝고 호감 가는 모습이었습니다.’ ὡς προσφιλές의 비교적 표현을 더 직역한 방식입니다.
    reason: lexical_alternative
