  - 그의 온 궁정 사람들
  - 그의 모든 시종
  lexicon: LSJ
  rationale: 궁정 맥락에서 왕을 가까이 모시는 집단을 가리키므로, 현대 한국어에서 자연스러운 ‘시종들’로 옮겼습니다.
- source_word: παρεκάλει αὐτήν
  english_pob_choice: were comforting her
  chosen_korean: 그녀를 위로하고 있었습니다
  alternatives_korean:
