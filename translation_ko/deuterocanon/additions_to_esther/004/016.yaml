    reason: lexical_alternative
lexical_decisions:
- source_word: ἐταράσσετο
  english_pob_choice: was troubled
  chosen_korean: 불안해하였고
  alternatives_korean:
  - 동요하고 있었고
  - 괴로워하였고
  - 당황하고 있었고
  lexicon: BDAG
  rationale: 지속적인 내적 동요를 나타내는 미완료 과거를 자연스러운 합쇼체로 옮기기 위해 ‘불안해하다’를 선택했습니다.
- source_word: πᾶσα ἡ θεραπεία αὐτοῦ
  english_pob_choice: all his attendants
