  - 그녀를 권고하고 있었습니다
  - 그녀를 달래고 있었습니다
  lexicon: BDAG
  rationale: παρακαλέω는 문맥에 따라 격려, 위로, 권면을 뜻할 수 있는데, 여기서는 여인을 지지하며 마음을 가라앉히는 뉘앙스가 강해 ‘위로하다’가 가장 적절합니다.
