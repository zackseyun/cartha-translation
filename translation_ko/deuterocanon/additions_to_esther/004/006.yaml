  yaml_path: translation/deuterocanon/additions_to_esther/004/006.yaml
  text: And after she had gone in through all the doors[a], she stood before the king; and he was sitting on the throne of his kingdom[b], and was clothed in all the splendor of his majesty.
  footnotes:
  - marker: a
    text: The Greek source as provided ends abruptly at ἐνεδεΒ, evidently a truncated form of a verb meaning 'was clothed' or 'had put on.' The translation reflects the most likely sense of the surviving phrase without claiming more certainty than the source permits.
    reason: textual_variant
  - marker: b
    text: Or 'through all the gateways,' if the palace setting is emphasized rather than interior doors.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 모든 문들을 지나 안으로 들어가자 왕 앞에 섰습니다. 왕은 자기 나라의 왕좌에 앉아 있었고, 자기 위엄의 온갖 화려한 옷을 입고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 ἐνεδεΒ에서 갑자기 끊겨 있습니다. 따라서 마지막 구절은 남아 있는 의미를 바탕으로 가장 가능성 높은 동작인 ‘입고 있었다’로 옮겼습니다.
    reason: textual_variant
  - marker: b
    text: ‘문들’은 궁전의 내부 문들을 가리킬 수 있으며, 경우에 따라 ‘문간들’ 또는 ‘문루들’의 뉘앙스도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθοῦσα πάσας τὰς θύρας
  english_pob_choice: after she had gone in through all the doors
  chosen_korean: 모든 문들을 지나 안으로 들어가자
  alternatives_korean:
  - 모든 문을 지나 들어가자
  - 모든 문들을 통과하여 들어가자
  lexicon: LSJ
  rationale: θύρας는 궁정의 연속된 문들을 가리킬 수 있어, ‘모든 문들’을 살리되 한국어에서는 자연스럽게 ‘지나 안으로 들어가자’로 옮겼습니다.
- source_word: κατέστη ἐνώπιον τοῦ βασιλέως
  english_pob_choice: she stood before the king
  chosen_korean: 왕 앞에 섰습니다
  alternatives_korean:
  - 왕 앞에 나아섰습니다
  - 왕 앞에 서 있었습니다
  lexicon: LSJ
  rationale: κατέστη의 결과 상태를 과거 동작으로 풀어, 궁정 장면에 어울리는 간결한 표현으로 옮겼습니다.
- source_word: θρόνου τῆς βασιλείας αὐτοῦ
  english_pob_choice: the throne of his kingdom
  chosen_korean: 자기 나라의 왕좌
  alternatives_korean:
  - 자기 왕국의 왕좌
  - 그의 나라의 왕좌
  lexicon: LSJ
  rationale: 직역의 ‘왕국의 왕좌’는 한국어에서 다소 어색하므로, βασιλείας의 왕권·영역 감각을 살려 ‘자기 나라의 왕좌’로 옮겼습니다.
- source_word: πᾶσαν στολὴν τῆς ἐπιφανείας αὐτοῦ
  english_pob_choice: was clothed in all the splendor of his majesty
  chosen_korean: 자기 위엄의 온갖 화려한 옷을 입고 있었습니다
  alternatives_korean:
  - 자기 위엄의 모든 화려함을 입고 있었습니다
  - 자기 위엄의 찬란한 옷차림을 하고 있었습니다
  lexicon: LSJ
  rationale: στολή는 옷/옷차림이고 ἐπιφανεία는 눈에 드러나는 화려함·위엄을 가리키므로, 의미를 과도하게 추상화하지 않으면서도 한국어로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 왕권과 위엄의 표현을 어떻게 처리할지
  chosen_reading: 본문은 신학적 술어보다 페르시아 궁정의 가시적 권위를 묘사하는 것으로 보고, ‘왕좌’와 ‘위엄’의 이미지가 드러나게 옮겼습니다.
  alternative_readings:
  - 상징적으로 더 중립적인 ‘자리’로 완화하기
  - ‘영광’으로 더 종교적으로 번역하기
  rationale: 이 절은 서술적 장면묘사이므로, 본문의 정치적·궁정적 긴장감을 유지하는 번역이 적절합니다.
  doctrine_reference: 서사 본문 해석 원칙
