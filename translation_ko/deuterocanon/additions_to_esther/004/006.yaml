  source_fidelity: 첫 절의 이동과 왕 앞에 서는 동작, 왕이 왕국의 왕좌에 앉아 있는 장면은 대체로 충실합니다. 다만 πᾶσαν στολὴν τῆς ἐπιφανείας αὐτοῦ는 왕의 눈에 보이는 화려함/위엄에 관련된 옷차림을 묘사하므로, 기존의 ‘자기 위엄의 온갖 화려한 옷’보다 관계를 더 분명히 하는 표현이 적절합니다. 또한 절단된 ἐνεδεΒ에 관한 주석 표지는 해당 서술어에 붙어야 합니다.
