  lexicon: LSJ
  rationale: στολή는 옷/옷차림이고 ἐπιφανεία는 눈에 드러나는 화려함·위엄을 가리키므로, 의미를 과도하게 추상화하지 않으면서도 한국어로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 왕권과 위엄의 표현을 어떻게 처리할지
  chosen_reading: 본문은 신학적 술어보다 페르시아 궁정의 가시적 권위를 묘사하는 것으로 보고, ‘왕좌’와 ‘위엄’의 이미지가 드러나게 옮겼습니다.
  alternative_readings:
  - 상징적으로 더 중립적인 ‘자리’로 완화하기
  - ‘영광’으로 더 종교적으로 번역하기
  rationale: 이 절은 서술적 장면묘사이므로, 본문의 정치적·궁정적 긴장감을 유지하는 번역이 적절합니다.
  doctrine_reference: 서사 본문 해석 원칙
