  yaml_path: translation/deuterocanon/additions_to_esther/004/006.yaml
  text: And after she had gone in through all the doors[a], she stood before the king; and he was sitting on the throne of his kingdom[b], and was clothed in all the splendor of his majesty.
  footnotes:
  - marker: a
    text: The Greek source as provided ends abruptly at ἐνεδεΒ, evidently a truncated form of a verb meaning 'was clothed' or 'had put on.' The translation reflects the most likely sense of the surviving phrase without claiming more certainty than the source permits.
    reason: textual_variant
  - marker: b
    text: Or 'through all the gateways,' if the palace setting is emphasized rather than interior doors.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 모든 문을 지나 들어가 왕 앞에 섰습니다.[b] 왕은 자기 왕국의 왕좌에 앉아 있었고, 자신의 위엄을 드러내는 온갖 예복을 입고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 ἐνεδεΒ에서 갑자기 끊겨 있습니다. 따라서 마지막 구절은 남아 있는 의미를 바탕으로 가장 가능성 높은 동작인 ‘입고 있었다’로 옮겼습니다.
    reason: textual_variant
  - marker: b
    text: ‘문들’은 궁전의 연속된 출입문들을 가리킬 수 있으며, 문맥에 따라 ‘출입구들’ 또는 ‘관문들’로도 옮길 수 있습니다.
    reason: lexical_alternative
