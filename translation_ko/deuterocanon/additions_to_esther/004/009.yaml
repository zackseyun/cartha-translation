lexical_decisions:
- source_word: Τί ἐστιν
  english_pob_choice: What is it
  chosen_korean: 무슨 일이냐?
  alternatives_korean:
  - 무슨 일이 있느냐?
  - 무엇이냐?
  lexicon: LSJ
  rationale: 직접적인 질문형을 살리되 한국어에서 자연스러운 관용 표현으로 옮겼습니다. 영어 주석의 ‘What is the matter?’ 가능성도 감안했지만, 본문은 간결한 물음 자체를 유지합니다.
- source_word: ἀδελφός
  english_pob_choice: brother
  chosen_korean: 형제
  alternatives_korean:
  - 오라버니
  - 친족
  - 친척
  lexicon: LSJ
  rationale: 원문은 문자적으로 ‘형제’이므로 이를 유지했습니다. 다만 에스더에게 남성 화자가 말하는 상황에서 한국어의 성별·연장자 뉘앙스를 과도하게 특정하지 않기 위해 ‘형제’를 택했습니다.
- source_word: θάρσει
  english_pob_choice: take courage
  chosen_korean: 용기를 내라
  alternatives_korean:
  - 담대하라
  - 힘을 내라
  - 용기를 가지라
  lexicon: LSJ
  rationale: 권면의 명령형을 현대 한국어로 자연스럽게 옮겼습니다. ‘담대하라’는 다소 교회적 어감을 줄 수 있어, 본문의 직접성을 살리는 표현을 선택했습니다.
theological_decisions:
- issue: ἀδελφός의 관계 범위
  chosen_reading: 본문에는 ‘형제’를 두고, 더 넓은 친족 의미로의 해석은 주석에 맡깁니다.
  alternative_readings:
  - 친족
  - 친척
  rationale: 영어 POB도 문자적 ‘brother’를 본문에 유지하고 넓은 관계 가능성은 각주로 처리합니다. 따라서 번역문도 원문 표면 의미를 보존해 독자가 관계의 범위를 판단하도록 남겨 둡니다.
  doctrine_reference: Translation philosophy §1, §5
