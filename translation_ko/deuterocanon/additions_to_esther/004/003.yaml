lexical_decisions:
- source_word: ἐτηρείδετο
  english_pob_choice: was kept under watch
  chosen_korean: 지켜졌고
  alternatives_korean:
  - 감시를 받았고
  - 보호 아래 두어졌고
  - 지켜보아졌고
  lexicon: LSJ
  rationale: τηρέω의 수동·미완료 의미를 살려, 단순한 ‘보호’보다 관찰·관리의 뉘앙스를 담되 한국어에서는 자연스러운 ‘지켜졌고’로 옮겼습니다.
- source_word: τῇ μὲν μιᾷ ... ἡ δὲ
  english_pob_choice: and one ... but the other—
  chosen_korean: 한 사람은 … 다른 사람은—
  alternatives_korean:
  - 하나는 … 그러나 다른 하나는—
  - 한쪽은 … 하지만 다른 쪽은—
  lexicon: LSJ
  rationale: 상호대조 구조를 살리면서도, 남은 그리스어가 절단된 채 끝나는 점을 반영해 한국어도 미완결형으로 마무리했습니다.
- source_word: τρυφερευομένη
  english_pob_choice: being pampered
  chosen_korean: 보살핌을 받으며 호사스럽게 지내도록
  alternatives_korean:
  - 호사스럽게 대접받으며
  - 사치스럽게 대우받으며
  - 부드럽게 대우받으며
  lexicon: LSJ
  rationale: 트루페루오메네의 ‘연하고 사치스러운 생활’ 의미를 단순한 ‘호사’보다 동작성과 상태를 함께 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 절의 끝이 끊긴 채 남아 있는 개방형 문장 처리
  chosen_reading: 마지막을 완결하지 않고 ‘다른 사람은—’으로 끝내어 본문 단절을 그대로 드러냈습니다.
  alternative_readings:
  - 뒤의 문맥을 보충해 완결된 문장으로 옮기기
  - 의미를 추정해 자연스럽게 마무리하기
  rationale: 제공된 증거본이 ‘but the other—’에서 끊기므로, 없는 말을 보태지 않고 열린 대비를 유지하는 것이 본문 충실성에 부합합니다.
  doctrine_reference: 본문 비평 원칙
- issue: ἐτηρείδετο의 상태성 vs 보호성
  chosen_reading: ‘지켜졌고’로 옮겨 관리·감시와 보호의 중간 지점을 남겼습니다.
  alternative_readings:
  - ‘보호를 받았고’로 순화하기
  - ‘감시를 받았고’로 강하게 제한하기
  rationale: 문맥상 custody인지 care인지 단정하지 않고, 원문의 애매성을 한국어에서도 유지했습니다.
  doctrine_reference: 어휘 보존 원칙
