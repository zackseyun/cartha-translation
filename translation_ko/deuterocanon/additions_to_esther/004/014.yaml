lexical_decisions:
- source_word: θαυμαστὸς
  english_pob_choice: wonderful
  chosen_korean: 놀라우신
  alternatives_korean:
  - 경이로우신
  - 기이하신
  - 놀랄 만하신
  lexicon: LSJ
  rationale: θαυμαστός는 놀라움과 경탄의 대상을 뜻하므로, 현대 한국어에서 자연스럽고 경외감을 살리는 ‘놀라우신’이 적절합니다.
- source_word: κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주인이시여
  lexicon: LSJ
  rationale: 하나님께 드리는 직접 호칭이므로, 프로젝트 기본어인 주(主)를 살리되 문장 흐름상 ‘주님’이 가장 자연스럽습니다.
- source_word: πρόσωπόν
  english_pob_choice: face
  chosen_korean: 얼굴
  alternatives_korean:
  - 얼굴빛
  - 존재
  - 용모
  lexicon: LSJ
  rationale: 그리스어의 문자적 이미지를 보존하기 위해 ‘얼굴’로 옮겼습니다. ‘임재’로 풀지 않고 신체적 이미지 자체를 유지합니다.
- source_word: χαρίτων
  english_pob_choice: grace
  chosen_korean: 은혜
  alternatives_korean:
  - 호의
  - 은총
  - 자비
  lexicon: LSJ
  rationale: χάρις 계열은 문맥상 ‘은혜/호의/우아함’의 범위를 가지지만, 하나님을 묘사하는 표현에서는 신학적 울림을 살리는 ‘은혜’가 가장 적절합니다.
- source_word: μεστόν
  english_pob_choice: full of
  chosen_korean: 가득합니다
  alternatives_korean:
  - 충만합니다
  - 가득 차 있습니다
  lexicon: LSJ
  rationale: ‘full of’의 자연스러운 한국어 표현으로, 문장의 명료성과 예배적 어조를 함께 살립니다.
theological_decisions:
- issue: 하나님에 대한 ‘얼굴’의 직설적 신체 이미지
  chosen_reading: 직역에 가까운 ‘당신의 얼굴’을 유지했습니다.
  alternative_readings:
  - 당신의 임재
  - 당신의 존재
  - 당신의 얼굴빛
  rationale: 원문은 πρόσωπον을 직접 사용하므로, 이미지를 추상화하지 않고 보존했습니다. 이는 본문의 경외적 표현을 약화하지 않기 위함입니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3, 6
- issue: χάρις-어휘의 번역
  chosen_reading: ‘은혜’를 사용했습니다.
  alternative_readings:
  - 호의
  - 은총
  - 자비
  rationale: 이 표현은 하나님의 얼굴을 ‘은혜로 가득한’ 것으로 묘사하므로, 한국어 신앙어법과 본문의 신학적 밀도를 함께 살리는 ‘은혜’가 가장 적합합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 5, 6
