translation:
  language: ko
  text: 그리고 그녀가 모습을 드러낸 뒤[a], 만물의 감찰자이시며 구원자이신 하나님께[b] 간구하고서 두 시녀를 데리고 갔습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모습을 드러낸 뒤’는 헬라어의 참여동사 구문을 자연스럽게 옮긴 것이며, ‘나타난 뒤’ 또는 ‘드러나게 된 뒤’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘만물의 감찰자’는 ‘만물을 살피시는 분’, ‘모든 것을 지켜보시는 분’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘시녀’는 에스더를 수행하던 여성 시종을 가리킵니다.
    reason: cultural_note
