base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/004/002.yaml
  text: And when she had become visible[a], having called upon God, the overseer of all and Savior, she took the two maids[c][b],
  footnotes:
  - marker: a
    text: Or 'when she appeared.' The Greek participial phrase can be rendered more idiomatically this way.
    reason: lexical_alternative
  - marker: b
    text: '''Overseer of all'' may also be rendered ''watcher over all'' or ''the all-seeing God.'''
    reason: lexical_alternative
  - marker: c
    text: '''Maids'' refers to female attendants accompanying Esther.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그녀가 드러나게 되었을 때, 만물의 감찰자이신 하나님과 구원자에게 부르짖고 나서, 그녀는 두 하녀를 데리고 갔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘드러나게 되었을 때’는 헬라어의 참여동사 구문을 보다 자연스럽게 옮긴 것이며, ‘나타났을 때’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘만물의 감찰자’는 ‘만물의 감시자’ 또는 ‘모든 것을 살피시는 분’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘하녀’는 에스더를 수행하던 여성 시종을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: γενηθεῖσα ἐπιφανής
  english_pob_choice: when she had become visible
  chosen_korean: 드러나게 되었을 때
  alternatives_korean:
  - 나타났을 때
  - 드러났을 때
  - 공적으로 모습을 드러냈을 때
  lexicon: LSJ
  rationale: 은밀함에서 공적 현시로 바뀌는 상태 변화를 간결하게 살리면서, 'visible'의 기본 의미를 자연스러운 한국어로 옮겼습니다.
- source_word: ἐπικαλεσαμένη
  english_pob_choice: having called upon
  chosen_korean: 부르짖고 나서
  alternatives_korean:
  - 부르며
  - 호소하고 나서
  - 간구하고 나서
  lexicon: BDAG
  rationale: 기도적 호출의 선행 관계를 드러내기 위해 완료·선행 뉘앙스를 살렸고, 문맥상 하나님께 간구하는 행위를 자연스럽게 표현했습니다.
- source_word: τὸν πάντων ἐπόπτην θεὸν
  english_pob_choice: God, the overseer of all
  chosen_korean: 만물의 감찰자이신 하나님
  alternatives_korean:
  - 만물을 감찰하시는 하나님
  - 모든 것을 살피시는 하나님
  - 만물의 감독자이신 하나님
  lexicon: LSJ
  rationale: ἐπόπτης의 ‘살피고 감독하는 분’이라는 뜻을 살리되, 한국어에서 신적 호칭으로 자연스럽고 엄숙한 '감찰자'를 택했습니다.
- source_word: σωτῆρα
  english_pob_choice: Savior
  chosen_korean: 구원자
  alternatives_korean:
  - 구세주
  - 구제자
  - 구해 주시는 분
  lexicon: BDAG
  rationale: 제목적 호칭의 종교적 격식을 유지하면서도, 메시아 호칭으로 굳어지기 쉬운 '구세주'보다 원문의 일반적 의미를 더 직접적으로 반영했습니다.
- source_word: τὰς δύο ἅβρας
  english_pob_choice: the two maids
  chosen_korean: 두 하녀
  alternatives_korean:
  - 두 시녀
  - 두 여종
  - 두 여자 하인
  lexicon: LSJ
  rationale: ἅβρα는 에스더를 수행하는 여성 시종을 가리키므로, 문맥에 맞는 현대 한국어로 '하녀'를 선택했습니다.
theological_decisions:
- issue: 하나님 호칭과 두 속격적 서술(‘만물의 감찰자’와 ‘구원자’)의 관계
  chosen_reading: 두 표현을 나란히 유지해 하나님께서 만물을 감찰하시며 동시에 구원하시는 분이라는 긴장을 그대로 드러냈습니다.
  alternative_readings:
  - ‘만물을 살피시는 구원자’로 통합
  - ‘모든 것을 보시는 하나님’으로 단순화
  rationale: 원문은 하나님의 보편적 감찰과 구원 능력을 함께 진술하므로, 하나로 합쳐 의미를 약화시키지 않도록 병렬 구조를 유지했습니다.
  doctrine_reference: 원문의 이중 술어를 보존하여 신학적 긴장을 해소하지 않음
