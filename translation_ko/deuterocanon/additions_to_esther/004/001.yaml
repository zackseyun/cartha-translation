translation:
  language: ko
  text: 그리고 셋째 날에, 그가 기도하기를 멈췄을 때, 그녀는 섬김의 옷을 벗고 자기의 영화로움을 입었습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀가 섬기던/예배하던 옷’. θεραπεία는 섬김, 시중, 경건한 수행을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자기의 영광’. 여기서는 왕후의 화려한 옷차림이나 위엄을 가리키는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
