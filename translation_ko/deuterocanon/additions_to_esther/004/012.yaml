    text: 또는 ‘그녀에게 인사한’. 그리스어 동사는 ‘인사하다’를 뜻할 수도 있으나, 이 문맥에서는 실제 입맞춤을 뜻하는 것으로 보는 것이 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρας
  english_pob_choice: lifting up
  chosen_korean: 들어
  alternatives_korean:
  - 들어 올려
  - 들어 올리고
  lexicon: BDAG
  rationale: aorist 분사로서 뒤의 주동작을 앞서 이끄는 동작을 자연스럽게 나타내기 위해 ‘들어’로 옮겼습니다.
- source_word: χρυσῆν ῥάβδον
  english_pob_choice: the golden scepter
  chosen_korean: 황금 홀
  alternatives_korean:
  - 황금 지팡이
  - 황금 홀대
  lexicon: LSJ
  rationale: 왕실 문맥의 ῥάβδος는 단순한 막대기보다 권위의 상징인 홀로 이해하는 것이 적절하므로 ‘홀’로 옮겼습니다.
- source_word: ἐπὶ τὸν τράχηλον αὐτῆς
  english_pob_choice: on her neck
  chosen_korean: 그녀의 목에
  alternatives_korean:
  - 그녀의 목 위에
  - 그녀의 목덜미에
  lexicon: BDAG
  rationale: τράχηλος를 한국어에서 가장 직접적으로 드러내는 ‘목’으로 옮겨 신체 접촉의 장면성을 살렸습니다.
- source_word: ἠσπάσατο
  english_pob_choice: kissed
  chosen_korean: 입을 맞추며
  alternatives_korean:
  - 키스하며
  - 그녀에게 인사하며
  lexicon: BDAG
  rationale: 이 동사는 일반적으로 ‘인사하다’도 가능하지만, 바로 앞뒤의 몸짓과 문맥상 물리적 입맞춤이 더 분명하므로 그 의미를 반영했습니다.
theological_decisions:
- issue: 왕의 행동을 어떻게 표현할지
  chosen_reading: 홀을 목에 대고 입을 맞추는 구체적 친근함과 승인 행위를 그대로 드러냈습니다.
  alternative_readings:
  - 왕이 상징적으로 허락만 표하는 식으로 완화하는 번역
  - ‘반겼다’처럼 비신체적 의미로만 처리하는 번역
  rationale: 원문과 POB 영어는 두 동작—홀을 목에 대는 행위와 입맞춤—를 모두 구체적으로 제시하므로, 이를 약화시키지 않고 직역에 가깝게 유지하는 것이 본문의 긴장과 은혜의 표시를 보존합니다.
  doctrine_reference: 본문 서술의 직접성 보존
- issue: 직접화법의 공손한 어조
  chosen_reading: '"나에게 말하십시오."로 공손한 명령을 유지했습니다.'
  alternative_readings:
  - '"말해 보십시오."'
  - '"나에게 말해 주십시오."'
  rationale: 라랄레오의 초청은 왕의 호의적 허락이면서도 명령형이므로, 한국어에서는 합쇼체 명령으로 그 권위와 친근함을 함께 살렸습니다.
  doctrine_reference: 서사 대화의 문체 재현
