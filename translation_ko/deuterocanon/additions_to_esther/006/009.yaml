  text: And God remembered his people[a], and vindicated his inheritance.
  footnotes:
  - marker: a
    text: Or 'justified' or 'did justice to his inheritance.' The Greek verb can carry legal or vindicatory force; here it is rendered in the corporate sense of God's public defense of his people.
    reason: lexical_alternative
