  lexicon: BDAG
  rationale: 그리스어의 동일시 표현을 한국어에서는 자연스럽게 ‘나와 하만입니다’로 풀어, 두 상징 대상과의 직접적인 동일시를 전달했습니다.
- source_word: δέ
  english_pob_choice: But
  chosen_korean: 그런데
