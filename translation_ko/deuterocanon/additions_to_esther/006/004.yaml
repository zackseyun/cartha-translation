  - 하지만
  - 그리고
  lexicon: BDAG
  rationale: δέ의 완만한 전환을 한국어 서술에서 자연스러운 설명적 전환어 ‘그런데’로 옮겼습니다.
- source_word: Ἁμάν
  english_pob_choice: Haman
  chosen_korean: 하만
  alternatives_korean:
  - 함안
  lexicon: Korean biblical proper-name convention
  rationale: 성경에서 널리 정착된 인명 표기를 따라 ‘하만’으로 적었습니다.
theological_decisions:
- issue: 상징적 동일시의 직역 유지
  chosen_reading: 두 용을 곧바로 말하는 화자 자신과 하만으로 동일시하는 구조를 그대로 유지했습니다.
  alternative_readings:
