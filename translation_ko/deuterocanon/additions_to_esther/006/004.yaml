lexical_decisions:
- source_word: οἱ ... δύο δράκοντες
  english_pob_choice: the two dragons
  chosen_korean: 그 두 용
  alternatives_korean:
  - 그 두 뱀
  lexicon: LSJ
  rationale: δράκων은 기본적으로 용 또는 큰 뱀을 가리키므로, POB의 ‘dragons’를 따라 ‘용’으로 옮기되, 각주에서 ‘뱀’ 가능성을 밝혀 원문 이미지의 폭을 보존했습니다.
- source_word: ἐγώ εἰμι
  english_pob_choice: are I
  chosen_korean: 나와 …입니다
  alternatives_korean:
  - 나는 …입니다
  lexicon: BDAG
  rationale: 그리스어의 동일시 표현을 한국어에서는 자연스럽게 ‘나와 하만입니다’로 풀어, 두 상징 대상과의 직접적인 동일시를 전달했습니다.
- source_word: δέ
  english_pob_choice: But
  chosen_korean: 그런데
  alternatives_korean:
  - 하지만
  - 그리고
  lexicon: BDAG
  rationale: δέ의 완만한 전환을 한국어 서술에서 자연스러운 설명적 전환어 ‘그런데’로 옮겼습니다.
- source_word: Ἁμάν
  english_pob_choice: Haman
  chosen_korean: 하만
  alternatives_korean:
  - 함안
  lexicon: Korean biblical proper-name convention
  rationale: 성경에서 널리 정착된 인명 표기를 따라 ‘하만’으로 적었습니다.
