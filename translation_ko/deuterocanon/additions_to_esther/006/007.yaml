  rationale: 속격구조를 한국어 소유·관계 표현으로 옮겨, 공동체적 의미가 드러나는 ‘하나님의 백성’을 사용했습니다.
- source_word: πᾶσι τοῖς ἔθνεσιν
  english_pob_choice: all the nations
  chosen_korean: 모든 민족
  alternatives_korean:
  - 모든 나라들
  - 모든 이방인
  lexicon: BDAG
  rationale: ἔθνη의 기본 의미인 ‘민족들/나라들’을 살리되, 대조적 문맥에서 과도하게 신학화된 ‘이방인’보다 더 넓은 범위를 가진 ‘모든 민족’을 본문에 두었습니다.
theological_decisions:
- issue: ἔθνεσιν의 대비 의미
  chosen_reading: 본문에는 ‘모든 민족’을 두고, 대안 의미로 ‘이방인’ 가능성은 주석적 여지로 남깁니다.
  alternative_readings:
  - 모든 이방인
  - 모든 나라들
  rationale: 본문은 하나님의 백성과 그 밖의 전체 세계를 대조하지만, 여기서 곧바로 민족적·구원사적 범주를 ‘이방인’으로 좁히기보다 원어의 넓은 집합 의미를 보존하는 편이 더 안전합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
