  - 분깃
  lexicon: BDAG
  rationale: κλῆρος는 제비를 뽑아 결정하는 ‘lots’를 가리키므로, 한국어 관용에 맞는 ‘제비’가 가장 직접적입니다.
- source_word: λαῷ τοῦ θεοῦ
  english_pob_choice: the people of God
  chosen_korean: 하나님의 백성
