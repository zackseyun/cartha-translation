  - 모든 나라들
  rationale: 본문은 하나님의 백성과 그 밖의 전체 세계를 대조하지만, 여기서 곧바로 민족적·구원사적 범주를 ‘이방인’으로 좁히기보다 원어의 넓은 집합 의미를 보존하는 편이 더 안전합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
