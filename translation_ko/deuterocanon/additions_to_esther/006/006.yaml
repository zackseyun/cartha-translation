  terminology: ‘내 백성’, ‘구원하셨고/건져 내셨으며’, ‘재앙’, ‘표징’은 적절합니다. τέρατα는 ‘큰 이적들’로 하여 σημεῖα의 ‘표징’과 구별하면서도 성서 문체에 자연스럽게 맞출 수 있습니다.
