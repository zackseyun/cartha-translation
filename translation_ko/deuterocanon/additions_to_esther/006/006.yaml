base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/006/006.yaml
  text: But my people—that is[a], Israel—are those who cried out to God and were saved. And the Lord saved his people, and the Lord rescued us from all these evils, and God did the signs and the great wonders that have not happened among the nations.
  footnotes:
  - marker: a
    text: Or, 'those who sought help from God.' The Greek phrase is somewhat awkward, but the sense is that Israel appealed to God and was delivered by him.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 내 백성—곧 이스라엘—은 하나님께 도움을 구한[a] 이들이며 구원받은 이들입니다. 주께서 그의 백성을 구원하셨고, 주께서 우리를 이 모든 재앙에서 건져 내셨으며, 하나님께서 열방 가운데 아직 일어나지 않은 표징들과 큰 이적들을 행하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님께 도움을 청한 이들’. 그리스어 표현은 다소 어색하지만, 뜻은 이스라엘이 하나님께 도움을 호소하고 그분께 구원받았다는 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνος τὸ ἐμόν
  english_pob_choice: my people
  chosen_korean: 내 백성
  alternatives_korean:
  - 내 민족
  - 내 나라
  lexicon: BDAG
  rationale: ἔθνος은 보통 ‘민족/나라’로도 갈 수 있지만, 여기서는 화자의 소속 집단을 가리키므로 ‘내 백성’이 가장 자연스럽고 언약적 집단성을 잘 드러냅니다.
- source_word: οὗτός ἐστιν Ἰσραήλ
  english_pob_choice: that is, Israel
  chosen_korean: 곧 이스라엘
  alternatives_korean:
  - 이는 이스라엘입니다
  - 이것이 이스라엘입니다
  lexicon: BDAG
  rationale: 앱포지션적 설명이므로 ‘곧’이 한국어에서 가장 자연스럽게 식별 관계를 표시합니다.
- source_word: οἱ βοηθήσαντες πρὸς τὸν θεόν
  english_pob_choice: those who cried out to God
  chosen_korean: 하나님께 도움을 구한 자들
  alternatives_korean:
  - 하나님께 부르짖은 자들
  - 하나님께 도움을 청한 자들
  lexicon: BDAG
  rationale: 직역하면 어색한 구조지만 문맥상 뜻은 하나님께 호소하여 도움을 구한 것입니다. ‘도움을 구한’이 원문의 방향성을 보존하면서도 한국어로 자연스럽습니다.
- source_word: σωθέντες
  english_pob_choice: were saved
  chosen_korean: 구원받은 자들
  alternatives_korean:
  - 구원된 자들
  - 구출받은 자들
  lexicon: BDAG
  rationale: 앞의 도움을 구함과 뒤의 구원을 한 덩어리로 묶어, 단순 과거 수동의 결과 상태를 한국어 명사구로 살렸습니다.
- source_word: ἔσωσεν / ἐρρύσατο
  english_pob_choice: saved / rescued
  chosen_korean: 구원하셨고 / 건져 내셨으며
  alternatives_korean:
  - 구원하셨고 / 구해 내셨으며
  - 살리셨고 / 건져 내셨으며
  lexicon: BDAG
  rationale: 두 동사의 의미를 완전히 평준화하지 않고, ἔσωσεν은 ‘구원하다’, ἐρρύσατο는 위험한 상황에서 ‘건져 내다’로 구별했습니다.
- source_word: τῶν κακῶν τούτων
  english_pob_choice: all these evils
  chosen_korean: 이 모든 재앙
  alternatives_korean:
  - 이 모든 악
  - 이 모든 환난
  - 이 모든 어려움
  lexicon: BDAG
  rationale: κακά는 여기서 개인적 악행보다 공동체에 닥친 해악·재난을 가리키므로 ‘재앙’이 문맥상 가장 적절합니다.
- source_word: σημεῖα καὶ τὰ τέρατα τὰ μεγάλα
  english_pob_choice: the signs and the great wonders
  chosen_korean: 큰 표징들과 큰 놀라운 일들
  alternatives_korean:
  - 표징들과 큰 기적들
  - 표징들과 큰 이적들
  lexicon: BDAG
  rationale: σημεῖα는 단순 ‘기적’보다 의미가 넓은 ‘표징’이 원문에 가깝고, τέρατα는 ‘놀라운 일들’로 옮겨 표징-경이의 구분을 살렸습니다.
theological_decisions:
- issue: οἱ βοηθήσαντες πρὸς τὸν θεόν의 신학적 의미
  chosen_reading: 이스라엘이 하나님을 ‘도운’ 것이 아니라, 하나님께 도움을 구하며 의지한 것으로 읽었습니다.
  alternative_readings:
  - 하나님께 도움을 청한 자들
  - 하나님께 호소한 자들
  rationale: 문맥 전체가 하나님의 구원 행위를 강조하므로, 원문의 난해한 표현을 직역해 인간이 하나님을 돕는 것처럼 보이게 하면 신학적으로 오해를 낳습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 주어의 반복과 구원 동사의 반복
  chosen_reading: 주께서/하나님께서의 반복을 살려 행위 주체를 분명히 하고, 구원·건짐의 중첩을 유지했습니다.
  alternative_readings:
  - 주께서 그의 백성을 구원하시고 우리를 구해 내셨습니다
  - 하나님께서 그의 백성을 구원하시고 우리를 건져 내셨습니다
  rationale: 본문은 같은 구원 사건을 여러 방식으로 되풀이하여 강조하므로, 한국어에서도 반복을 줄여 단순화하기보다 강조 효과를 살리는 것이 적절합니다.
  doctrine_reference: Translation philosophy §5
