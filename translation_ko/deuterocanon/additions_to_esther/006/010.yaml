  text: And these days shall be for them in the month of Adar[a], on the fourteenth and on the fifteenth of the same month, with assembly and joy and gladness before God[b], throughout the generations forever among his people Israel.
  footnotes:
  - marker: a
    text: Or 'with gathering' or 'with convocation'; the Greek συναγωγή refers here to communal assembly, not specifically to a synagogue building.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the presence of God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 날들은 아달 월에, 곧 그 달의 열네째 날과 열다섯째 날에, 모임과 기쁨과 즐거움으로 하나님 앞에서, 그의 백성 이스라엘 가운데 대대로 영원히 있을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모임과 함께’, ‘회집과 함께’로도 옮길 수 있습니다. 여기서 συναγωγή는 특정 건물이 아니라 공동체적 모임을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하나님의 임재 안에서’로도 옮길 수 있습니다.
    reason: lexical_alternative
