  chosen_reading: 원문의 식별 구문을 유지하되, 한국어에서는 ‘그 샘은 에스더입니다’로 풀어 상징과 해석의 연결을 자연스럽게 드러냈습니다.
  alternative_readings:
  - ‘작은 샘이 강이 되었던 에스더입니다’처럼 더 압축하는 방식
