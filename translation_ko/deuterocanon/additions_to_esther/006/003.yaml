lexical_decisions:
- source_word: ἡ μικρὰ πηγή
  english_pob_choice: the little spring
  chosen_korean: 작은 샘
  alternatives_korean:
  - 작은 우물
  - 작은 샘물
  lexicon: LSJ
  rationale: πηγή는 물이 솟는 샘을 가리키므로, 현대 한국어에서 가장 자연스럽고 이미지도 보존되는 ‘샘’으로 옮겼습니다.
- source_word: ἡ ἐγένετο ποταμός
  english_pob_choice: that became a river
  chosen_korean: 강이 되었던
  alternatives_korean:
  - 강이 된
  - 강으로 변한
  lexicon: LSJ
  rationale: ἐγένετο는 상태 변화의 서술이므로 ‘되다’로 옮겨 샘이 강이 되는 변화를 살렸습니다.
- source_word: Ἐσθὴρ ἐστιν ὁ ποταμός
  english_pob_choice: was Esther / is Esther
  chosen_korean: 그 샘은 에스더입니다
  alternatives_korean:
  - 에스더는 그 강입니다
  - 그 강은 에스더입니다
  lexicon: LSJ
  rationale: 그리스어는 직설적으로 ‘에스더는 그 강입니다’에 가깝지만, 한국어에서는 앞선 지시대상을 받아 ‘그 샘은 에스더입니다’라고 해야 식별 관계가 자연스럽게 드러납니다.
- source_word: ἣν ἐγάμησεν ὁ βασιλεὺς καὶ ἐποίησεν βασίλισσαν
  english_pob_choice: whom the king married and made queen
  chosen_korean: 왕이 그녀를 아내로 맞아 왕비로 삼았고
  alternatives_korean:
  - 왕이 그녀와 결혼하여 왕비로 삼았고
  - 왕이 그녀를 맞아들여 왕비로 세웠고
  lexicon: LSJ
  rationale: ἐγαμέω는 여성에 대해 ‘아내로 맞다/결혼하다’의 뜻이므로, 단순한 관념적 번역보다 혼인과 즉위의 두 동작을 분명히 드러냈습니다.
- source_word: ὕδωρ πολύ
  english_pob_choice: abundant water
  chosen_korean: 많은 물
  alternatives_korean:
  - 풍성한 물
  - 넘치는 물
  lexicon: LSJ
  rationale: πολύ는 양의 많음을 나타내므로, 과장 없이 본뜻을 유지하는 ‘많은 물’로 옮겼습니다.
theological_decisions:
- issue: 환상/상징 해석문의 문장 구조
  chosen_reading: 원문의 식별 구문을 유지하되, 한국어에서는 ‘그 샘은 에스더입니다’로 풀어 상징과 해석의 연결을 자연스럽게 드러냈습니다.
  alternative_readings:
  - ‘작은 샘이 강이 되었던 에스더입니다’처럼 더 압축하는 방식
  - ‘작은 샘이 강이 되었습니다. 그 강은 에스더입니다’처럼 분리하는 방식
  rationale: 이 구절은 교리 진술이 아니라 상징 해석이므로, 의미를 흐리지 않으면서도 한국어 문장 흐름이 매끄럽도록 조정했습니다.
