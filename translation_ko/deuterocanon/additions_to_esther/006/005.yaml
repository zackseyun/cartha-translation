  source_fidelity: ‘그러나’는 δέ의 대조를 적절히 반영하며, ‘그 민족들’, ‘유대인들의 이름’, 목적 표현도 원문에 충실합니다. 다만 ‘이름을 멸망시키다’는 한국어에서 결합이 부자연스러우므로, 원문의 관용적 이미지를 보존하면서 더 자연스러운 ‘이름을 없애려고’로 고칩니다. ἐπισυναχθέντα의 수동형 형태는 본문에서 자연스러운 상태 표현으로 처리하고 각주에서 밝협니다.
