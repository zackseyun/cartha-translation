    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔθνη
  english_pob_choice: the nations
  chosen_korean: 그 민족들은
  alternatives_korean:
  - 그 나라들은
  - 이방 민족들은
  lexicon: BDAG
  rationale: LXX-에스더 문맥에서 ἔθνη는 유대인에 대립하는 여러 민족 집단을 가리키므로, 직역적이면서도 자연스러운 ‘민족들’로 옮겼습니다. ‘이방 민족들’도 가능하지만 본문에는 종교적 대비를 과하게 더할 수 있습니다.
- source_word: ἐπισυναχθέντα
  english_pob_choice: had assembled
  chosen_korean: 함께 모여 있었습니다
  alternatives_korean:
  - 모여 있었습니다
  - 함께 모였습니다
  - 함께 모여들었습니다
  lexicon: BDAG
  rationale: 분사형은 수동형이지만 결과 상태를 나타내므로, 한국어에서는 상태·집합성을 살린 ‘함께 모여 있었습니다’가 가장 자연스럽습니다. 이는 영어 POB의 ‘had assembled’와 ‘had been gathered together’ 사이의 긴장을 유지합니다.
- source_word: ἀπολέσαι
  english_pob_choice: to destroy
  chosen_korean: 멸망시키려고
  alternatives_korean:
  - 파괴하려고
  - 없애려고
  - 죽이려고
  lexicon: BDAG
  rationale: 목적 부정사로서 단순한 ‘destroy’보다 한국어에서는 대상 집단의 소멸 의도를 드러내는 ‘멸망시키려고’가 문맥상 적절합니다. 다만 과도하게 풀어 쓰지 않도록 본문 수준의 강도를 유지했습니다.
- source_word: τὸ ὄνομα τῶν Ἰουδαίων
  english_pob_choice: the name of the Jews
  chosen_korean: 유대인들의 이름
  alternatives_korean:
  - 유대인들의 명을
  - 유대인들의 이름을
  lexicon: BDAG
  rationale: 그리스어의 ‘이름’ 이미지를 그대로 살렸습니다. 한국어에서도 관용적으로 ‘이름을 없애다’는 존재와 기억을 지우는 함의를 가질 수 있어, 본문의 비유적 힘을 유지합니다.
theological_decisions:
- issue: ‘이름을 멸망시키다’의 관용적 의미
  chosen_reading: 본문에는 직역에 가까운 ‘이름을 멸망시키려고’ 형식을 유지하고, 관용적 함의는 주해 없이 텍스트 자체가 드러내도록 두었습니다.
  alternative_readings:
  - 유대인들의 기억을 지우려고
  - 유대인들을 완전히 없애려고
  rationale: 영어 POB가 이 표현을 성경적 관용구로 보면서도 본문에서는 literal 형식을 유지한 점을 따라, 한국어도 같은 긴장을 보존했습니다. 이렇게 해야 독자가 원문 이미지와 의미 범위를 함께 읽을 수 있습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3, 5
