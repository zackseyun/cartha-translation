translation:
  language: ko
  text: 그러나 그 민족들은 유대인들의 이름을 멸망시키려고 함께 모여 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘함께 모여들었습니다.’ 그리스어 분사는 수동형입니다.
