theological_decisions:
- issue: 하나님을 사건의 근원으로 진술하는 방식
  chosen_reading: ‘이 일들은 하나님으로부터 일어났습니다’로, 원문의 기원 표지를 보존했습니다.
  alternative_readings:
  - ‘이 일들은 하나님께서 하신 일입니다’
  - ‘이 일들은 하나님에게서 왔습니다’
  rationale: 원문은 사건의 세부 메커니즘보다 출처를 하나님께 돌립니다. 이를 설명적으로 풀기보다 근원성을 직접 드러내는 표현을 유지했습니다.
  doctrine_reference: 신적 섭리의 진술을 과도하게 해석하지 않고 원문의 귀속 관계를 보존함.
