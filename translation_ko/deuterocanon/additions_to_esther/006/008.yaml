  - 도착했습니다
  lexicon: BDAG
  rationale: 단순한 도착이 아니라 정해진 때와 심판의 날에 ‘닿다/이르다’는 시간적 성취를 자연스럽게 드러냅니다.
- source_word: εἰς ὥραν καὶ καιρόν
  english_pob_choice: at the hour and appointed time
  chosen_korean: 정해진 때와 시각
  alternatives_korean:
  - 때와 시기
  - 정한 시간과 때
  lexicon: LSJ
  rationale: καιρός의 ‘정해진/적절한 때’ 뉘앙스를 ‘정해진 때’로 옮기고, ὥρα는 ‘시각’으로 구체성을 살렸습니다.
- source_word: εἰς ἡμέραν κρίσεως
  english_pob_choice: at the day of judgment
  chosen_korean: 심판의 날
  alternatives_korean:
  - 판결의 날
  - 심문의 날
  lexicon: BDAG
  rationale: κρίσις의 사법적 의미를 살리면서도 한국어에서 가장 자연스럽고 직설적인 표현으로 옮겼습니다.
theological_decisions:
- issue: ἐνώπιον τοῦ θεοῦ καὶ πᾶσι τοῖς ἔθνεσιν의 전치사 처리
  chosen_reading: 하나님의 앞과 모든 민족의 앞에서로 읽어, 하나의 ἐνώπιον이 양쪽을 함께 지배하는 구조를 드러냈습니다.
  alternative_readings:
  - 하나님과 모든 민족 앞에서
  - 하나님 앞과 모든 민족 가운데에서
  rationale: 법정적·공적 증언의 뉘앙스를 보존하려면 두 대상 모두에 ‘앞에서’를 이해시키는 것이 가장 자연스럽습니다.
  doctrine_reference: Translation philosophy §§1, 6
