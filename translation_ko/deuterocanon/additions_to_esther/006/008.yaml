    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δύο κλῆροι
  english_pob_choice: these two lots
  chosen_korean: 이 두 제비
  alternatives_korean:
  - 이 두 몫
  - 이 두 운명
  lexicon: LSJ
  rationale: κλῆρος의 구체적 이미지인 ‘제비’를 살리되, 문맥상 상징적 함의를 과도하게 풀어쓰지 않았습니다.
- source_word: ἦλθον
