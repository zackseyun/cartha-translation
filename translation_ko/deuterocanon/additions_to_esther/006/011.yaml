- source_word: Λυσίμαχον Πτολεμαίου τῶν ἐν Ἰερουσαλήμ
  english_pob_choice: Lysimachus son of Ptolemy, one of those in Jerusalem
  chosen_korean: 예루살렘에 있는 이들 가운데 한 사람인 톨레마이오스의 아들 리시마코스
  alternatives_korean:
