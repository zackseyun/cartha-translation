base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/006/011.yaml
  text: In the fourth year of the reign of Ptolemy and Cleopatra[a], Dositheus, who said that he was a priest and a Levite, and Ptolemy his son, brought in the following letter of the Purim festival, which they said also existed and had been translated by Lysimachus son of Ptolemy[b], one of those in Jerusalem.
  footnotes:
  - marker: a
    text: 'Greek: ''of the Phrouraia,'' the Greek designation used here for the Jewish festival of Purim.'
    reason: lexical_alternative
  - marker: b
    text: Or 'which they said was extant and had been translated by Lysimachus son of Ptolemy.' The Greek wording is terse and may emphasize the document's existence/availability rather than its authenticity.
    reason: alternative_reading
translation:
  language: ko
  text: 프톨레마이오스와 클레오파트라가 통치하던 제4년에, 자신이 제사장이며 레위인이라고 말한 도세테오스와 그의 아들 프톨레마이오스가 다음 부림절에 관한 서한을 가져왔습니다.[a] 그들은 그 서한이 존재하며, 예루살렘에 있는 사람들 가운데 한 사람인 프톨레마이오스의 아들 리시마코스가 그것을 번역했다고 말했습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ‘프루라이아(Φρουραίων)’는 이 전통에서 유대 절기인 부림절을 가리키는 헬라어식 명칭입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 그 문서가 현존하며 프톨레마이오스의 아들 리시마코스가 번역했다고 말한 문서.’ 그리스어 표현은 간결하며, 그 문서의 진정성보다는 존재 또는 이용 가능성을 강조할 수도 있습니다.
    reason: alternative_reading
