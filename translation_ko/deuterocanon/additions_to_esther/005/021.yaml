lexical_decisions:
- source_word: ὁ πάντα δυναστεύων θεὸς
  english_pob_choice: the God who rules over all
  chosen_korean: 모든 것을 다스리시는 분
  alternatives_korean:
  - 만물을 주관하시는 하나님
  - 모든 것 위에 군림하시는 하나님
  lexicon: LSJ
  rationale: δυναστεύων은 단순한 능력이 아니라 실제로 권세를 행사하며 다스린다는 뜻이므로, ‘다스리시는 분’이 POB의 ‘rules over all’을 자연스럽게 옮기면서도 강한 주권성을 보존합니다.
- source_word: ἀντʼ ὀλεθρίας
  english_pob_choice: instead of the destruction
  chosen_korean: 멸망 대신
  alternatives_korean:
  - 파멸 대신
  - 멸망을 대신하여
  lexicon: LSJ
  rationale: ἀντί는 대체·교환의 의미를 가지므로 ‘대신’으로 옮겼고, ὀλεθρία는 공동체적 파괴를 가리키는 ‘멸망’이 가장 직접적입니다.
- source_word: τοῦ ἐκλεκτοῦ γένους
  english_pob_choice: the chosen race
  chosen_korean: 선택된 민족
  alternatives_korean:
  - 선택된 백성
  - 택함 받은 족속
  lexicon: LSJ
  rationale: γένους는 혈통·종족·민족을 포함하는 말이지만, 이 문맥에서는 유대 공동체의 언약적 집단을 가리키므로 ‘민족’이 가장 오해가 적고, ‘chosen race’의 집단성을 유지합니다.
- source_word: ἐποίησεν αὐτοῖς εὐφροσύνην
  english_pob_choice: has made this a joy for them
  chosen_korean: 그들에게 기쁨이 되게 하셨습니다
  alternatives_korean:
  - 그들을 기뻐하게 하셨습니다
  - 그것을 그들에게 기쁨으로 만드셨습니다
  lexicon: LSJ
  rationale: ποιέω는 여기서 ‘~이 되게 하다/만들다’의 서술적 용법이며, εὐφροσύνη는 ‘기쁨’이 가장 सीधे하므로 문장 전체를 자연스러운 합쇼체로 재구성했습니다.
theological_decisions:
- issue: 하나님의 이름을 위한 번역 선택
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 하나님
  rationale: 본문은 θεός를 쓰지만, 주어진 POB 기본 원칙에 따라 야훼를 사용해 구약적 신명 전승과의 연결을 드러냈습니다. 본문에는 직함적 표현이 함께 있으므로 ‘야훼께서는’으로 자연스럽게 처리했습니다.
  doctrine_reference: POB glossary default; original-language primacy
- issue: ἐκλεκτοῦ γένους의 공동체성
  chosen_reading: 선택된 민족
  alternative_readings:
  - 선택된 백성
  - 택함 받은 족속
  rationale: 이 표현은 개인 구원이 아니라 공동체적 정체성을 강조하므로, ‘민족’이 혈통·역사적 집단성을 함께 드러냅니다. 한국어 ‘백성’은 가능하지만, 본문이 가진 종족/혈통 뉘앙스는 약해질 수 있습니다.
  doctrine_reference: 'DOCTRINE.md: consistency of key terms, or documented exception'
