  text: We have attained such goodwill toward every nation that he is proclaimed our father and is honored by all[a], continuing as the second person to the royal throne.
  footnotes:
  - marker: a
    text: Or, more literally, 'bowed down to by all.' The Greek verb can denote prostration or homage before a superior.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리가 모든 민족을 향해 그런 호의를 얻어서, 그가 우리의 아버지로 선포되고 모든 사람에게 존중을 받으며, 왕의 왕좌에 버금가는 둘째 자리를 계속 차지하고 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘모든 사람에게 절을 받으며’에 가깝습니다. 여기의 동사는 상전 앞에서의 엎드림이나 예우를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτυχεν / φιλανθρωπίας
  english_pob_choice: We have attained such goodwill
  chosen_korean: 우리가 … 그런 호의를 얻어서
  alternatives_korean:
  - 우리가 … 그런 은혜를 입어서
  - 우리가 … 그런 인정을 받아서
  lexicon: LSJ
  rationale: ἔτυχεν with genitive and φιλανθρωπίας는 ‘호의/선의’를 얻은 상태를 가리키므로, 한국어에서는 문맥상 자연스러운 ‘호의를 얻다’로 옮겼습니다.
- source_word: πρὸς πᾶν ἔθνος
  english_pob_choice: toward every nation
  chosen_korean: 모든 민족을 향해
  alternatives_korean:
  - 온 민족에 대해
  - 모든 나라를 향해
  lexicon: LSJ
  rationale: πρὸς + 대격의 방향성을 살려 ‘향해’로 옮겼고, ἔθνος는 이 궁정 문맥에서 ‘민족’이 가장 무난합니다.
- source_word: ἀναγορεύεσθαι πατέρα
  english_pob_choice: is proclaimed our father
  chosen_korean: 그가 우리의 아버지로 선포되고
  alternatives_korean:
  - 그가 우리의 아버지라고 공포되고
  - 그가 우리의 아버지로 불리고
  lexicon: LSJ
  rationale: ἀναγορεύεσθαι는 공식적으로 선포되는 뉘앙스가 있어 ‘선포되고’로 살렸고, πατέρα는 비유적 권위 호칭을 유지해 ‘아버지’로 직역했습니다.
- source_word: προσκυνούμενον ὑπὸ πάντων
  english_pob_choice: is honored by all
  chosen_korean: 모든 사람에게 존중을 받으며
  alternatives_korean:
  - 모든 사람에게 절을 받으며
  - 모든 사람에게 경배를 받으며
  - 모든 사람에게 경의를 받으며
  lexicon: LSJ
  rationale: προσκυνέω는 실제로는 굽혀 절하는 예를 포함할 수 있지만, 이 왕실 문맥에서는 신적 예배보다 궁정적 예우가 핵심이므로 ‘존중을 받다’로 번역했습니다.
- source_word: τὸ δεύτερον τοῦ Βασιλικοῦ θρόνου πρόσωπον
  english_pob_choice: the second person to the royal throne
  chosen_korean: 왕의 왕좌에 버금가는 둘째 자리
  alternatives_korean:
  - 왕좌 다음의 둘째 인물
  - 왕실 왕좌의 두 번째 인물
  - 왕의 왕좌에 이어지는 둘째 인물
  lexicon: LSJ
  rationale: 어색한 궁정어적 표현인 πρόσωπον과 δεύτερον의 서열 의미를 한국어에서 자연스럽게 전달하기 위해 ‘둘째 자리’로 옮겨, 직함이 아닌 위상적 표현임을 드러냈습니다.
- source_word: διατελεῖν
  english_pob_choice: continuing
  chosen_korean: 계속 차지하고 있습니다
  alternatives_korean:
  - 계속 머물고 있습니다
  - 줄곧 지내고 있습니다
  - 늘 그러한 자리에 있습니다
  lexicon: LSJ
  rationale: διατελεῖν은 지속 상태를 나타내므로, 앞의 위상 표현과 연결해 현재 진행형 느낌의 ‘계속 차지하고 있습니다’로 옮겼습니다.
theological_decisions:
- issue: προσκυνούμενον의 예우/예배 긴장
  chosen_reading: 모든 사람에게 존중을 받으며
  alternative_readings:
  - 모든 사람에게 절을 받으며
  - 모든 사람에게 경배를 받으며
  rationale: 이 표현은 인간 통치자에 대한 궁정 예우로도, 더 넓게는 굴복의 동작으로도 읽힐 수 있습니다. 본문 맥락에서는 신적 예배로 단정하지 않고, 그 긴장을 보존하면서도 독자가 이해하기 쉬운 ‘존중’으로 처리했습니다.
  doctrine_reference: 의도된 의미를 보존하되, 본문이 요구하지 않는 신학적 과장을 피합니다.
