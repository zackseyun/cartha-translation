translation:
  language: ko
  text: 그리고 그들을 강하게 하여, 환난의 때에 그들에게 달려드는 자들에 맞서 스스로를 방어하게 하셨습니다. 곧 아달, 열두째 달의 열셋째 날, 바로 그날입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
