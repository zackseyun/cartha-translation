    text: ‘강하게 하다’는 여기서 ‘도와주다’ 또는 ‘뒷받침하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘환난의 때’는 더 일반적으로 ‘고난의 때’ 또는 ‘환난과 압박의 때’로 이해할 수 있습니다.
