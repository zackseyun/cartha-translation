    text: 또는 ‘우리를 황폐한 상태로 남겨 둔 뒤’ 혹은 ‘우리를 버려진 상태로 만든 뒤’. 그리스어 분사구 λαβὼν ἡμᾶς ἐρήμους는 관용적이어서, 황폐함이 어떻게 이해되는지의 정확한 뉘앙스는 여러 방식으로 옮길 수 있습니다.
