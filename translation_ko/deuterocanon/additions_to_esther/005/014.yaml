  lexicon: LSJ
  rationale: ἐπικράτησις는 ‘지배, 우위, 통치’의 뜻을 가지므로, 현대 한국어에서 정치적 지배를 가장 분명하게 드러내는 ‘통치’를 선택했습니다. 소유격 구조는 ‘페르시아의’로 자연스럽게 처리했습니다.
- source_word: εἰς τοὺς Μακεδόνας μετάξει
  english_pob_choice: he would transfer ... to the Macedonians
  chosen_korean: 마케도니아인들에게 옮길 것이라고
  alternatives_korean:
  - 마케도니아인들에게 넘길 것이라고
  - 마케도니아인들에게 이전할 것이라고
  - 마케도니아인들에게 넘겨줄 것이라고
  lexicon: LSJ
  rationale: μετάξει는 어떤 지배나 권세를 다른 집단으로 ‘옮기다/이전하다’는 정치적 이동을 뜻하므로, 문어적이되 과도하게 기술적이지 않은 ‘옮길 것이라고’로 옮겼습니다.
