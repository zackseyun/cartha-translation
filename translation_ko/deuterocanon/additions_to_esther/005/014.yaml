  - 우리를 황량하게 만든 뒤에는
  lexicon: LSJ
  rationale: λαβών + ἐρήμους는 관용적으로 ‘황폐한 상태가 되게 하다/만들다’의 뜻이므로, 시간 관계를 드러내는 동시에 한국어로 가장 자연스럽게 ‘만든 뒤에는’으로 처리했습니다.
- source_word: τὴν τῶν Περσῶν ἐπικράτησιν
  english_pob_choice: the rule of the Persians
  chosen_korean: 페르시아의 통치
  alternatives_korean:
  - 페르시아인의 지배
  - 페르시아의 지배권
