translation:
  language: ko
  text: 그가 이 방법들로 우리를 황폐하게 만든 뒤에는, 페르시아의 통치를 마케도니아인들에게 옮길 것이라고 생각했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리를 황폐한 상태로 남겨 둔 뒤에는’ 혹은 ‘우리를 버려진 상태로 만든 뒤에는’. 그리스어 분사구 λαβὼν ἡμᾶς ἐρήμους는 관용적이어서, 정확한 뉘앙스는 여러 방식으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ γὰρ τῶν τρόπων τούτων
  english_pob_choice: For by these methods
