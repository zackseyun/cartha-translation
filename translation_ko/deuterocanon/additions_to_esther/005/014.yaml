  text: For by these methods he thought that[a], once he had made us desolate, he would transfer the rule of the Persians to the Macedonians.
  footnotes:
  - marker: a
    text: Or 'having left us desolate' or 'after making us deserted.' The Greek participial phrase λαβὼν ἡμᾶς ἐρήμους is somewhat idiomatic, and the exact nuance of how the desolation is conceived may be expressed in more than one way in English.
