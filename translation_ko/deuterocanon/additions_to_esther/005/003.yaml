translation:
  language: ko
  text: 그리고 그들은 우리에게 복종하는 자들만 해치려 할 뿐 아니라, 풍요를 견디지 못하여 자기들의 은혜를 입은 이들마저 모략하려고까지 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘풍요를 견디지 못하여’가 아니라 ‘배부름/만족함을 견디지 못하여’, 곧 κόρος는 과도한 충만과 포만을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς ὑποτεταγμένους ἡμῖν
  english_pob_choice: those subject to us
  chosen_korean: 우리에게 복종하는 자들
  alternatives_korean:
  - 우리 아래 있는 자들
  - 우리의 신하들
  - 우리에게 속한 자들
  lexicon: BDAG
  rationale: ὑποτάσσω의 수동 분사는 권위 아래 놓인 관계를 가리키므로, 현대 한국어에서는 ‘복종하는 자들’이 그 관계를 가장 자연스럽게 드러냅니다.
- source_word: ζητοῦσι κακοποιεῖν
  english_pob_choice: seek to mistreat
  chosen_korean: 해치려 할 뿐 아니라
  alternatives_korean:
  - 악을 행하려 할 뿐 아니라
  - 해를 끼치려 할 뿐 아니라
  - 잘못을 저지르려 할 뿐 아니라
  lexicon: BDAG
  rationale: ζητέω + κακοποιέω는 실제로 사람에게 악행/해악을 가하려는 시도를 뜻하므로, 문맥상 자연스럽고 직접적인 ‘해치다’로 옮겼습니다.
- source_word: τόν τε κόρον
  english_pob_choice: prosperity
  chosen_korean: 풍요
  alternatives_korean:
  - 번영
  - 만족
  - 배부름
  lexicon: LSJ
  rationale: κόρος는 단순한 ‘포만’보다 넘침과 풍족함이 낳는 상태를 가리킬 수 있어, POB의 ‘prosperity’를 따라 ‘풍요’로 옮기면 의미와 문맥이 함께 살아납니다.
- source_word: τοῖς ἑαυτῶν εὐεργέταις
  english_pob_choice: their own benefactors
  chosen_korean: 자기들의 은혜를 입은 이들
  alternatives_korean:
  - 자기들의 은인들
  - 자기들의 후원자들
  - 자기들에게 선을 베푼 이들
  lexicon: BDAG
  rationale: εὐεργέτης는 ‘선을 베푸는 사람, 은인/후원자’지만, 문맥상 관계의 역전과 배신성을 살리기 위해 ‘은혜를 입은 이들’로 풀어 자연스럽게 표현했습니다.
- source_word: ἐπιχειροῦσι μηχανᾶσθαι
  english_pob_choice: attempt to scheme against
  chosen_korean: 모략하려고까지 합니다
  alternatives_korean:
  - 꾀하려고까지 합니다
  - 음모를 꾸미려고까지 합니다
  - 책략을 짜려고까지 합니다
  lexicon: LSJ
  rationale: μηχανάομαι는 책략/모략을 꾸미는 뜻이 강하므로, 상대를 해치려는 악의적 계획을 분명히 드러내는 ‘모략하다’를 선택했습니다.
theological_decisions:
- issue: 긍휼/은혜를 베푼 자에 대한 배은과 정치적 폭력의 결합
  chosen_reading: 본문의 도덕적 비난을 약화시키지 않고, ‘자기들의 은혜를 입은 이들마저’로 옮겨 배은과 폭력의 결합을 드러냈습니다.
  alternative_readings:
  - 자기들의 은인들마저
  - 자기들에게 선을 베푼 이들마저
  rationale: 헬라어 εὐεργέταις는 단순한 친절의 대상이 아니라 실제로 선행을 베푼 자들을 가리키므로, 문맥상 역설적 배신을 강조하는 번역이 필요합니다.
  doctrine_reference: 윤리적 배은과 악행의 심화; 잠 17:13, 롬 12:17-21
