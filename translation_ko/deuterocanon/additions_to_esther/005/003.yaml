  yaml_path: translation/deuterocanon/additions_to_esther/005/003.yaml
  text: And they seek not only to mistreat those subject to us[a], but, unable to bear prosperity, they even attempt to scheme against their own benefactors;
  footnotes:
  - marker: a
    text: Or 'unable to bear abundance' or 'unable to bear satiety'; the Greek κόρον can suggest overfull prosperity or surfeit.
