translation:
  language: ko
  text: 이것은 편지의 사본입니다. 위대한 왕 아르타크세르크세스가 인도에서 에티오피아까지 있는 백이십칠 사트라피의 지방 통치자들과, 우리 뜻에 마음을 두는 사람들에게 문안합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘우리의 것을 생각하는 사람들’이라는 뜻으로, 왕의 편에 서서 왕의 이해관계를 지지하는 이들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντίγραφον τῆς ἐπιστολῆς
  english_pob_choice: copy of the letter
  chosen_korean: 편지의 사본
  alternatives_korean:
  - 편지의 복사본
  - 서신의 사본
  - 서한의 사본
  lexicon: LSJ
  rationale: 행정 문서의 서두에서 문서 자체를 소개하는 표현이므로, 자연스러운 현대 한국어로 ‘사본’이 가장 직접적입니다.
- source_word: Βασιλεὺς μέγας
