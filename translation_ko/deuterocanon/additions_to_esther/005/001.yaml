translation:
  language: ko
  text: 다음은 편지의 사본입니다. 대왕 아르타크세르크세스가 인도에서 에티오피아까지 이르는 백이십칠 사트라피의 지방 통치자들과 우리의 이해관계를 지지하는 이들에게 문안합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘우리의 것들을 생각하는 이들’이라는 뜻입니다. 왕의 사안이나 이해관계를 지지하는 이들을 가리키는 표현입니다.
    reason: lexical_alternative
