  - 위대하신 왕
  - 큰 왕
  lexicon: LSJ
  rationale: 페르시아 제국의 칭호를 살리되, 한국어에서 가장 직관적인 호칭으로 옮겼습니다. ‘대왕’도 가능하지만 여기서는 문맥상 서술적 칭호인 ‘위대한 왕’을 택했습니다.
- source_word: τὰ ἡμέτερα φρονοῦσι
  english_pob_choice: those who are loyal to our interests
  chosen_korean: 우리 뜻에 마음을 두는 사람들
  alternatives_korean:
  - 우리에게 충성하는 사람들
  - 우리 편에 선 사람들
  - 우리의 일을 생각하는 사람들
  lexicon: LSJ
  rationale: 직역하면 ‘우리의 것을/우리 일을 생각하는 이들’이라는 관용구이므로, 단순한 감정보다 왕의 이해관계에 동조하는 뉘앙스를 살려 옮겼습니다.
- source_word: χαίρειν
  english_pob_choice: greetings
  chosen_korean: 문안합니다
  alternatives_korean:
  - 인사합니다
  - 평안을 빕니다
  - 기쁨을 전합니다
  lexicon: LSJ
  rationale: 서신 서두의 관용적 인사말로서, 한국어 공문·서신 문체에 자연스러운 ‘문안합니다’가 가장 적절합니다.
- source_word: ἑκατὸν εἴκοσι ἑπτὰ σατραπείαις χωρῶν
  english_pob_choice: the one hundred twenty-seven satrapies
  chosen_korean: 백이십칠 사트라피의 지방
  alternatives_korean:
  - 백이십칠 속주의
  - 백이십칠 총독령의
  - 백이십칠 사트라피
  lexicon: LSJ
  rationale: σατραπεία는 페르시아 행정구역을 가리키는 특수 용어이므로 ‘사트라피’로 음역하고, χωρῶν을 ‘지방’으로 풀어 행정적 범위를 드러냈습니다.
theological_decisions:
- issue: 본문의 인사말인 χαίρειν을 어떻게 처리할지
  chosen_reading: 중립적인 서신 인사로 ‘문안합니다’라고 옮겼습니다.
  alternative_readings:
