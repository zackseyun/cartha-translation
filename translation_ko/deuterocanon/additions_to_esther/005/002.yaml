  lexicon: BDAG
  rationale: 행위자를 가리키는 분사이므로 ‘은인’으로 옮겨 관계를 간명하게 드러냈습니다.
- source_word: μεῖζον ἐφρόνησαν
  english_pob_choice: became more arrogant
  chosen_korean: 오히려 더 교만해졌습니다
  alternatives_korean:
