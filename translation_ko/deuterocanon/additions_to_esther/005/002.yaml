  - 더 높은 생각을 품게 되었습니다
  lexicon: BDAG
  rationale: 직역하면 ‘더 큰 것들을 생각하다’이지만, 문맥상 자만과 교만의 의미이므로 그 함의를 분명히 드러냈습니다.
theological_decisions:
- issue: 그리스어 관용구 μεῖζον ἐφρόνησαν의 윤리적/심리적 의미
  chosen_reading: ‘더 교만해졌다’로 분명히 번역해, 단순한 자존감 상승이 아니라 도덕적 자만을 나타내게 했습니다.
  alternative_readings:
  - ‘더 높이 생각했습니다’
  - ‘더 큰 생각을 품었습니다’
  rationale: 영어 POB도 관용구를 ‘became more arrogant’로 풀어 주었으므로, 한국어에서도 독자가 문맥의 비판적 뉘앙스를 바로 읽도록 했습니다.
  doctrine_reference: 문맥상 교만에 대한 서술이며 별도의 교리 쟁점은 없습니다.
