lexical_decisions:
- source_word: πολλοὶ
  english_pob_choice: Many
  chosen_korean: 많은 사람들은
  alternatives_korean:
  - 많은 이들은
  - 많은 자들은
  lexicon: BDAG
  rationale: 일반적인 관찰을 시작하는 복수 주어로 자연스럽고 간결하게 옮겼습니다.
- source_word: τῇ πλείστῃ ... χρηστότητι
  english_pob_choice: because of the greatest kindness
  chosen_korean: 베푼 가장 큰 호의로 인해
