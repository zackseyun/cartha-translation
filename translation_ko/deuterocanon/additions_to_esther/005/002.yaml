  - 베푼 극도의 선함으로 인해
  lexicon: BDAG
  rationale: dative 구문이 존중받게 된 근거를 나타내므로 ‘~로 인해’로 처리했고, χρηστότης의 의미를 ‘호의’로 자연스럽게 살렸습니다.
- source_word: τῶν εὐεργετούντων
  english_pob_choice: of their benefactors
  chosen_korean: 자기들의 은인이
  alternatives_korean:
