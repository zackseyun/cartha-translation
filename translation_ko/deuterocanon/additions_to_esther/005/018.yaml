translation:
  language: ko
  text: 그는 바로 그 일을 꾸민 사람 자신이 수사의 문 앞에서 그의 온 집안과 함께 매달려 죽었으니[a], 이는 만물을 다스리시는 하나님께서 그에게 마땅한 벌을 속히 되돌려 주셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘못에 꿰뚫렸거나’, ‘말뚝에 매달렸거나’의 뜻일 수 있습니다. 그리스어 동사는 말뚝형이나 십자가형 처형을 가리킬 수 있으며, 정확한 페르시아식 처형 방식이 뒤의 로마식 십자가형과 같았을 필요는 없습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ αὐτὸν τὸν ταῦτα ἐξεργασάμενον
  english_pob_choice: the very man who had brought about these things
  chosen_korean: 바로 그 일을 꾸민 사람 자신
  alternatives_korean:
  - 그 일을 해낸 바로 그 사람
  - 바로 그 일을 저지른 그 사람
  lexicon: LSJ
  rationale: αὐτόν τὸν은 강한 강조를, ἐξεργασάμενον은 악의적 계획의 실행을 가리킬 수 있어 ‘바로 그 사람 자신’과 ‘꾸민’으로 그 강조와 함의를 살렸습니다.
- source_word: πρὸς ταῖς Σούσων πύλαις
  english_pob_choice: at the gate of Susa
  chosen_korean: 수사의 문 앞에서
  alternatives_korean:
  - 수사의 성문에서
  - 수사의 문에
  lexicon: LSJ
  rationale: πρός + 여격은 장소상 ‘~앞/근처’의 뜻이므로, 도시의 관문 상황을 자연스럽게 드러내는 ‘문 앞에서’로 옮겼습니다.
- source_word: ἐσταυρῶσθαι
  english_pob_choice: was crucified
  chosen_korean: 매달려 죽었으니
  alternatives_korean:
  - 십자가에 못 박혔으니
  - 말뚝에 매달렸으니
  lexicon: LSJ
  rationale: 그리스어 동사는 십자가형/말뚝형을 포괄할 수 있으므로, 본문과 주석의 긴장을 살리기 위해 본문은 보다 넓은 ‘매달려 죽다’로 두고, 주석에서 대체 가능성을 밝혔습니다.
- source_word: σὺν τῇ πανοικίᾳ
  english_pob_choice: with his whole household
  chosen_korean: 그의 온 집안과 함께
  alternatives_korean:
  - 그의 모든 가문과 함께
  - 그의 온 집과 함께
  lexicon: LSJ
  rationale: πανοικία는 가족만이 아니라 종속 인원까지 포함하는 ‘온 집안/가정 전체’이므로, 한국어의 자연스러운 포괄 표현을 택했습니다.
- source_word: τὴν καταξίαν τοῦ ... θεοῦ ... ἀποδόντος αὐτῷ κρίσιν
  english_pob_choice: swiftly repaid him with the punishment he deserved
  chosen_korean: 그에게 마땅한 벌을 속히 되돌려 주셨기 때문입니다
  alternatives_korean:
  - 그에게 합당한 심판을 속히 갚아 주셨기 때문입니다
  - 그에게 그 سزا를 속히 돌려주셨기 때문입니다
  lexicon: LSJ
  rationale: καταξία와 κρίσις가 함께 ‘마땅한 보응/재판적 처벌’의 뜻을 이루므로, ‘마땅한 벌’로 응축하되 ‘되돌려 주셨다’로 보응의 동사를 살렸습니다.
- source_word: τοῦ τὰ πάντα ἐπικρατοῦντος θεοῦ
  english_pob_choice: God, who rules over all
  chosen_korean: 만물을 다스리시는 하나님
  alternatives_korean:
  - 모든 것을 지배하시는 하나님
  - 만물 위에 권세를 가지신 하나님
  lexicon: LSJ
  rationale: ἐπικρατέω는 ‘이기다/다스리다/지배하다’의 뜻을 가지므로, 문맥상 자연스럽고 경건한 ‘만물을 다스리시는’으로 옮겼습니다.
theological_decisions:
- issue: 하나님의 보응과 직접 행위성
  chosen_reading: 하나님께서 악행자에게 신속하게 마땅한 벌을 돌려주신다고 직접적으로 진술합니다.
  alternative_readings:
  - 더 완곡하게 ‘벌이 내려졌다’로 돌릴 수 있습니다.
  - 하나님의 직접적 행위성을 약화시킬 수 있습니다.
  rationale: 그리스어 구조는 보응의 주체를 하나님께 분명히 귀속시키므로, 이를 희석하지 않고 보존했습니다.
  doctrine_reference: 원문 우선 원칙; 섭리와 심판의 직접 귀속을 유지
