translation:
  language: ko
  text: 그리고 그녀는 종종[a] 광기로, 권세의 자리에 임명되고 친구로서 일을 처리하도록 신임을 받은 많은 사람들을 무고한 이들의 피를 흘리는 일에 가담한 자들로 만들어, 돌이킬 수 없는 재난으로 그들을 덮쳤습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 여성 단수 주어를 가지지만, 이 절 안에서는 그 지시 대상이 명시되지 않습니다.
    reason: source_note
  - marker: b
    text: 직역하면 '무고한 피들의 참여자들'입니다. 이는 무고한 이들의 피를 흘리는 일에 연루되었다는 뜻입니다.
    reason: lexical_alternative
