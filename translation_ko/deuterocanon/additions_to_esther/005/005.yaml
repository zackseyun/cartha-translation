translation:
  language: ko
  text: 그리고 종종, 광기로 말미암아, 그녀는 권세의 자리에 세워져 일을 맡기도록 신임받은 많은 이들을 무고한 피의 동참자로 만들고, 돌이킬 수 없는 재난에 휩싸이게 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 여성 단수 주어를 가지지만, 이 절 안에서는 그 지시 대상이 명시되지 않습니다.
    reason: source_note
  - marker: b
    text: 직역하면 '무고한 피의 참여자/동참자'입니다. 이는 무고한 피를 흘리는 일에 연루되었다는 뜻입니다.
