  - 완전히 파괴될 것입니다
  - 가장 혐오스러운 곳이 될 것입니다
  rationale: 본문은 단순 정보가 아니라 공적 저주 선포의 수사이므로, 파괴와 혐오의 강도를 약화하지 않고 법령식 미래형으로 유지했습니다.
