base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/005/024.yaml
  text: But every city or region as a whole that does not act according to these orders will be consumed with spear and fire in wrath[a]; it will be made not only impassable to men[b], but also most hateful to wild animals and birds for all time.
  footnotes:
  - marker: a
    text: Or 'by spear and fire.' The Greek δόρατι is literally 'spear'; some render more generally as 'sword.'
    reason: lexical_alternative
  - marker: b
    text: '''Men'' here translates a masculine plural used generically for human beings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 왕의 명령에 따라 이와 같이 행하지 않는 모든 도시나 지역은 창과 불로 진멸되어 분노 가운데 사라질 것입니다. 그것은 사람들에게는 들어갈 수 없는 곳이 될 뿐 아니라, 온전히 영원토록 들짐승과 새들에게도 가장 미움받는 곳으로 정해질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘창’은 δόρατι의 문자적 의미를 살린 번역입니다. 일부 전통 번역은 이를 더 일반적인 무기어로 완화합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘사람들에게’는 그리스어 남성 복수 ἀνθρώποις가 인류 일반을 가리키는 용례를 반영한 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα δὲ πόλις ἢ χώρα τὸ σύνολον
  english_pob_choice: every city or region as a whole
  chosen_korean: 모든 도시나 지역은
  alternatives_korean:
  - 모든 도시나 지역 전체는
  - 도시나 지역마다 모두
  lexicon: LSJ
  rationale: πᾶσα와 πόλις ἢ χώρα의 분배적 의미를 살리되, τὸ σύνολον의 총체성을 뒤 문맥의 “온전히”로 보완해 한국어를 자연스럽게 만들었습니다.
- source_word: κατὰ ταῦτα μὴ ποιήσῃ
  english_pob_choice: does not act according to these orders
  chosen_korean: 이와 같이 행하지 않는
  alternatives_korean:
  - 이 명령대로 하지 않는
  - 이것들을 따라 행하지 않는
  lexicon: LSJ
  rationale: μὴ ποιήσῃ는 단순한 ‘하다’보다 왕명 수행 여부를 가리키므로, 법령 문맥에 맞게 ‘행하지 않는’으로 옮겼습니다.
- source_word: δόρατι καὶ πυρὶ
  english_pob_choice: with spear and fire
  chosen_korean: 창과 불로
  alternatives_korean:
  - 창으로 그리고 불로
  - 창과 불에 의해
  lexicon: LSJ
  rationale: δόρατι를 전통적 ‘칼’로 완화하지 않고 ‘창’으로 유지하여 원문 이미지와 무기 종류를 드러냈습니다.
- source_word: καταναλωθήσεται μετʼ ὀργῆς
  english_pob_choice: will be consumed ... in wrath
  chosen_korean: 진멸되어 분노 가운데 사라질 것입니다
  alternatives_korean:
  - 분노 가운데 소모될 것입니다
  - 진노로 말미암아 소멸될 것입니다
  lexicon: LSJ
  rationale: καταναλίσκω의 소멸·소진 이미지를 ‘진멸되어’로 살리고, μετʼ ὀργῆς는 상태 부사구로 자연스럽게 ‘분노 가운데’로 옮겼습니다.
- source_word: ἄβατος
  english_pob_choice: impassable
  chosen_korean: 들어갈 수 없는
  alternatives_korean:
  - 통행할 수 없는
  - 접근할 수 없는
  lexicon: LSJ
  rationale: 사람에게 금지된 황폐지라는 뜻을 한국어 관용으로 풀되, 본래의 ‘지날 수 없음’ 의미는 유지했습니다.
- source_word: ἀνθρώποις
  english_pob_choice: men
  chosen_korean: 사람들에게
  alternatives_korean:
  - 인간들에게
  - 남자들에게
  lexicon: LSJ
  rationale: 그리스어 남성 복수의 일반적 인류 지칭을 한국어에서는 성별 오해 없이 ‘사람들’로 자연스럽게 전달했습니다.
- source_word: θηρίοις καὶ πετεινοῖς
  english_pob_choice: wild animals and birds
  chosen_korean: 들짐승과 새들에게
  alternatives_korean:
  - 야생 짐승들과 새들에게
  - 짐승들과 새들에게
  lexicon: LSJ
  rationale: θηρία는 들짐승, πετεινά는 새를 가리키므로 현대 한국어에서 직관적인 대응어를 사용했습니다.
- source_word: εἰς τὸν ἅπαντα χρόνον
  english_pob_choice: for all time
  chosen_korean: 온전히 영원토록
  alternatives_korean:
  - 영원히
  - 모든 때에
  lexicon: LSJ
  rationale: 지속 기간의 강한 강조를 살리기 위해 ‘영원토록’에 총체성을 나타내는 ‘온전히’를 덧붙였습니다.
- source_word: ἔχθιστος κατασταθήσεται
  english_pob_choice: will be made ... most hateful
  chosen_korean: 가장 미움받는 곳으로 정해질 것입니다
  alternatives_korean:
  - 가장 혐오스러운 곳이 될 것입니다
  - 가장 증오받는 곳으로 세워질 것입니다
  lexicon: LSJ
  rationale: ἔχθιστος의 최상급 강도를 살리되, κατασταθήσεται의 ‘정해지다/세워지다’ 의미를 반영해 상태 선언처럼 옮겼습니다.
theological_decisions:
- issue: γενERIC masculine ἀνθρώποις의 번역
  chosen_reading: 사람들에게
  alternative_readings:
  - 남자들에게
  - 사람들에게(남성 복수 일반)
  rationale: 원문은 남성 복수이지만 문맥상 인류 일반을 뜻하므로, 한국어에서는 자연스럽고 오해가 적은 ‘사람들’로 옮기되 성별을 신학적으로 부각하지 않았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: 왕명 불이행에 대한 저주의 과장된 형식
  chosen_reading: 진멸되어 ... 가장 미움받는 곳으로 정해질 것입니다
  alternative_readings:
  - 완전히 파괴될 것입니다
  - 가장 혐오스러운 곳이 될 것입니다
  rationale: 본문은 단순 정보가 아니라 공적 저주 선포의 수사이므로, 파괴와 혐오의 강도를 약화하지 않고 법령식 미래형으로 유지했습니다.
  doctrine_reference: 'POB style note: source-directed curse formula'
