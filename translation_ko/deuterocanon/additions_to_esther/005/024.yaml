  text: But every city or region as a whole that does not act according to these orders will be consumed with spear and fire in wrath[a]; it will be made not only impassable to men[b], but also most hateful to wild animals and birds for all time.
  footnotes:
  - marker: a
    text: Or 'by spear and fire.' The Greek δόρατι is literally 'spear'; some render more generally as 'sword.'
    reason: lexical_alternative
  - marker: b
    text: '''Men'' here translates a masculine plural used generically for human beings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이러한 명령대로 행하지 않는 모든 도시나 지역 전체는 창[a]과 불로 분노 가운데 소멸될 것입니다. 그것은 사람들에게[b]만 들어갈 수 없는 곳이 되는 것이 아니라, 들짐승과 새들에게도 영원토록 가장 혐오스러운 곳이 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘창’은 그리스어 δόρατι의 문자적 의미를 살린 번역입니다. 일부 번역은 이를 더 일반적인 무기, 곧 ‘칼’로 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: ‘사람들에게’는 그리스어 남성 복수 ἀνθρώποις가 여기서 인류 일반을 가리키는 용례를 반영한 것입니다.
    reason: lexical_alternative
