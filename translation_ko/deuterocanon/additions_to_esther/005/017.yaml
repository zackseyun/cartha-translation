  lexicon: BDAG
  rationale: καλῶς οὖν ποιήσετε의 권고적 힘을 한국어의 자연스러운 완곡 권고로 옮기되, 논리적 연결사 οὖν은 '그러므로'로 살렸습니다.
- source_word: μὴ προσχρησάμενοι
  english_pob_choice: not to make use of
  chosen_korean: 사용하지 않는
  alternatives_korean:
  - 유용하지 않는
  - 그 편지들을 따르지 않는
  - 그 편지들에 근거하여 행동하지 않는
  lexicon: LSJ
  rationale: προσχράομαι의 핵심 의미인 '사용하다/이용하다'를 직접 살리되, 본문이 편지의 집행을 거부하라는 문맥을 함축하므로 한국어에서는 '사용하지 않는'으로 간결하게 옮겼습니다.
- source_word: τοῖς ... γράμμασιν
  english_pob_choice: the letters
  chosen_korean: 그 편지들
  alternatives_korean:
  - 그 문서들
  - 그 서신들
  - 그 명령서들
  lexicon: BDAG
  rationale: 왕실 행정 문맥의 γράμματα를 일반적이면서도 자연스러운 '편지들'로 옮겼고, 지시 대명사 '그'로 앞선 특정 문서를 가리키는 점을 드러냈습니다.
- source_word: ὑπὸ Ἁμὰν Ἁμαδάθου ἀποσταλεῖσι
  english_pob_choice: sent out by Haman son of Hammedatha
  chosen_korean: 하만 함므다다의 아들[a]이 보낸
  alternatives_korean:
  - 함므다다의 아들 하만이 보낸
  - 하만, 함므다다의 아들이 보낸
  lexicon: N/A (proper name)
  rationale: Ἁμαδάθου의 친자 관계를 한국어에서 통상적인 소유격으로 풀어 '함므다다의 아들'로 처리했고, ἀποσταλεῖσι는 수동분사로 '보낸'을 사용해 편지의 발신 행위를 분명히 했습니다.
theological_decisions:
- issue: 권고의 뉘앙스와 명령성의 조절
  chosen_reading: 직역적 명령문보다 '…하는 것이 좋겠습니다'로 옮겨, 문맥상 상급자에게 주는 공손한 권고로 들리게 했습니다.
  alternative_readings:
