lexical_decisions:
- source_word: καλῶς οὖν ποιήσετε
  english_pob_choice: Therefore you will do well
  chosen_korean: 그러므로 여러분은 … 하는 것이 좋겠습니다
  alternatives_korean:
  - 그러므로 여러분은 … 잘하실 것입니다
