    rationale: “하만 함므다다의 아들”은 한국어에서 ‘하만의 아들인 함므다다’로 해석될 여지가 있습니다. 원문은 하만을 Ἁμαδάθου의 아들로 식별하므로 “함므다다의 아들 하만”으로 옮겨야 합니다.
  - severity: low
