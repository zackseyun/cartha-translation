  source_fidelity: 그리스어의 논리 연결(οὖν), 권고적 미래 표현(καλῶς ... ποιήσετε), 편지들을 이용하지 말라는 뜻(μὴ προσχρησάμενοι), 그리고 발신자 정보를 대체로 반영했습니다. 그러나 초안의 “하만 함므다다의 아들”은 한국어에서 하만의 아들이 함므다다인 것처럼 읽힐 수 있어, Ἁμὰν Ἁμαδάθου가 뜻하는 ‘함므다다의 아들 하만’을 명확히 해야 합니다.
  naturalness: “그러므로 … 사용하지 않는 것이 좋겠습니다”는 현대 표준어 합쇼체의 자연스러운 완곡 권고입니다. 인명 수식어의 순서를 “함므다다의 아들 하만”으로 바꾸면 훨씬 명료하고 자연스럽습니다.
  terminology: ‘편지들’은 γράμμασιν에 적절하며, ‘사용하지 않는’은 προσχράομαι의 ‘이용하다/사용하다’를 과도하게 ‘명령을 따르다’로 한정하지 않습니다. ‘함므다다’ 표기는 초안의 음역을 유지합니다.
  issues:
