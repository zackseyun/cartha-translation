  yaml_path: translation/deuterocanon/additions_to_esther/005/008.yaml
  text: and to look ahead to what comes after these things[a], so as to grant the kingdom, undisturbed, to all people in peace[b],
  footnotes:
  - marker: a
    text: Or 'to give attention to what follows.' The Greek προσέχειν can mean to attend to or consider; the translation 'look ahead to' brings out the future-oriented sense of the phrase 'the things after these.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the realm' or 'the royal rule.' Greek βασιλεία can refer to a kingdom as a domain or to kingship/reign more abstractly.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이 일들 뒤에 올 것들을 살펴보아, 모든 사람에게 평강 가운데 방해받지 않는 나라를 주시려는 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘뒤따르는 것들에 주의를 기울이다.’ προσέχειν은 ‘주의를 기울이다’ 또는 ‘살피다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘왕국’ 혹은 ‘왕권’입니다. βασιλεία는 영토로서의 나라나 통치권을 가리킬 수 있습니다.
    reason: lexical_alternative
