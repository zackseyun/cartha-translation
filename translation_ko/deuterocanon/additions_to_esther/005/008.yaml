  text: 그리고 이 일들 뒤에 올 일을 살피시어[a], 모든 사람에게 평화롭고 혼란 없는 나라[b]를 베푸시기를 바랍니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘뒤따르는 일들에 주의를 기울이시어.’ προσέχειν은 ‘주의를 기울이다’, ‘살피다’, 또는 ‘고려하다’라는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘왕국’ 또는 ‘왕권’입니다. βασιλεία는 영토로서의 나라를 가리킬 수도 있고, 왕의 통치나 왕권을 가리킬 수도 있습니다.
