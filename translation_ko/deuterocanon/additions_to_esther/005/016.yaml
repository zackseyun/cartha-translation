    reason: lexical_alternative
  - marker: b
    text: 또는 “우리와 우리의 조상들을 위해 왕국을 가장 좋은 배열로 안내하시는 분”으로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὺς
  english_pob_choice: sons
