  lexicon: BDAG
  rationale: 그리스어 복수 남성형을 살려, 일반화하지 않고 직접적으로 ‘아들들’로 옮겼습니다. 본문이 강조하는 친자 관계의 표지를 유지하기 위함입니다.
- source_word: τοῦ ὑψίστου μεγίστου ζῶντος θεοῦ
