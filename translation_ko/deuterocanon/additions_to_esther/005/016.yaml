theological_decisions:
- issue: corporate filial language
  chosen_reading: 공동체가 하나님을 ‘아들들’로 자처하는 표현을 그대로 유지했습니다.
  alternative_readings:
  - ‘자녀들’로 중성화하는 읽기
  - ‘후손들’로 완화하는 읽기
  rationale: 본문의 수사적 힘은 가족적 언약 언어와 남성복수의 직접성에 있으므로, 이를 완화하지 않고 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: divine providential governance
  chosen_reading: 왕국을 ‘다스리십니다’로 옮겨 하나님의 현재적 섭리 통치를 드러냈습니다.
  alternative_readings:
  - ‘인도하십니다’
  - ‘이끄십니다’
  rationale: ἡγεμονικό/통치적 뉘앙스를 지닌 동사와 왕국의 대상이 함께 있어, 단순 안내보다 주권적 통치가 더 적절합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
