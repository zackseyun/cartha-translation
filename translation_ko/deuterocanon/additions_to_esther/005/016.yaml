    rationale: τοῦ ... θεοῦ τοῦ κατευθύνοντος는 ‘... 하나님, 곧/그분께서 ... 하시는’이라는 수식 관계입니다. 한국어에서는 대명사를 사용해 매끄럽게 연결할 수 있으나, 수식 관계가 드러나야 합니다.
