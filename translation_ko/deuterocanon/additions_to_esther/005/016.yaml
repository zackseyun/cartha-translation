  text: 지극히 높으시며 가장 크시고 살아 계신 하나님[a]의 아들들이며, 그분은 우리와 우리의 조상들을 위해 나라를 가장 좋은 질서로 다스리십니다[b].
  philosophy: optimal-equivalence
  footnotes:
