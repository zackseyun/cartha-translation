  rationale: 하나님을 수식하는 칭호들이 누적되는 구조를 한국어에서도 살려, 위계적·찬양적 어감을 보존했습니다.
- source_word: κατευθύνοντος
  english_pob_choice: who directs
  chosen_korean: 다스리십니다
  alternatives_korean:
