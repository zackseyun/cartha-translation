  text: 우리는 지극히 높으시고 가장 크시며 살아 계신 하나님의 아들들[a]이며, 그분께서는 우리와 우리 조상들을 위하여 왕국을 가장 좋은 질서로 이끌어 가십니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
