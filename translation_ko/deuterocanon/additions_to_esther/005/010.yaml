translation:
  language: ko
  text: 곧 함므다다의 아들 하만은 마케도니아 사람으로서,[a] 참된 페르시아 혈통과는 이질적이고 우리의 호의와도 크게 동떨어져 있었지만, 우리에게 손님으로 받아들여진 사람이었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 Μακεδών은 ‘마케도니아 사람’이라는 민족·출신 표지입니다. 이 표지는 그리스어 추가본의 문구를 그대로 반영합니다.
    reason: cultural_note
  - marker: b
    text: 그리스어의 ‘참된 페르시아 혈통’에 해당하는 표현(ταῖς ἀληθείας ἀλλότριος τοῦ τῶν Περσῶν αἵματος)은 문법적으로 난해합니다. 여기서는 하만이 진정한 페르시아 계통에 속하지 않았다는 뜻으로 옮겼습니다. 또한 ἐπιξενωθεὶς ἡμῖν은 우리에게 손님으로 받아들여져 환대를 받았다는 뜻입니다.
    reason: lexical_alternative
