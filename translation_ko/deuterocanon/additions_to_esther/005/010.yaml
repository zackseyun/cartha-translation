translation:
  language: ko
  text: 곧, 아마답다의 아들 하만은 마케도니아 사람으로서, 페르시아의 혈통과는 이질적이며 우리의 호의와도 크게 떨어져 있으나, 우리에게 나그네로 맞이된 사람이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어의 Μακεδών은 ‘마케도니아 사람’이라는 민족/출신 표지입니다. 이 표지는 그리스어 추가본의 문구를 그대로 반영합니다.
    reason: cultural_note
  - marker: b
    text: ἐπιξενωθεὶς ἡμῖν은 직역하면 ‘우리에게 손님으로/나그네로 받아들여진’의 뜻으로, 단순한 친절보다 환대받아 손님이 된 상태를 가리킵니다.
    reason: lexical_alternative
