translation:
  language: ko
  text: 그러나 우리는 그 삼중으로 저주받은 자에게 멸망하도록 넘겨진 유대인들이 범죄자들이 아니라, 가장 의로운 법들에 따라 살아가고 있음을 찾아냅니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 세 번 저주받은 자에게’. 그리스어는 이 사람을 가리키는 데 매우 강한 모욕어(τρισαλιτήριος)를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘가장 의로운 법들로 산다’. 그리스어 동사는 ‘시민으로서 삶을 영위하다’는 뜻이어서, 공동체적 생활 방식을 가리킬 수 있습니다.
    reason: lexical_alternative
