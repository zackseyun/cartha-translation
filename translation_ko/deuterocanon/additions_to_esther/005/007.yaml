base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/005/007.yaml
  text: But consider whether it is possible[a], not so much from the earlier histories that we have handed down as from the things lying at your feet, while you investigate[c][b], to discern how many lawless deeds have been accomplished by the pestilence of those who rule unworthily.
  footnotes:
  - marker: a
    text: Or 'from what is before you' for 'from the things lying at your feet.' The Greek idiom emphasizes what is immediately at hand.
    reason: lexical_alternative
  - marker: b
    text: Or 'impiously' for 'lawlessly'; the Greek adverb can stress irreverence as well as wickedness.
    reason: lexical_alternative
  - marker: c
    text: '''Pestilence'' is likely metaphorical here, describing the destructive character of rulers who exercise power unworthily.'
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 살피십시오. 우리가 전해 내려온 옛 역사들보다는 오히려 여러분의 발밑에 있는 것들로부터, 여러분이 조사하는 동안, 합당하지 않게 통치하는 자들의 재앙으로 얼마나 많은 불법한 일들이 이루어졌는지를 분별할 수 있는지 말입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘발밑에 있는 것들’은 ‘여러분 앞에 있는 것들’이라는 관용적 뜻을 반영한 표현입니다.
    reason: cultural_note
  - marker: b
    text: ἀνοσίως는 ‘불법하게’뿐 아니라 ‘불경하게’의 뉘앙스도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘재앙’은 여기서 문자적 전염병보다, 합당하지 않게 통치하는 자들이 끼치는 파괴적 영향을 드러내는 비유적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: σκοπεῖτε
  english_pob_choice: consider
  chosen_korean: 살피십시오
  alternatives_korean:
  - 생각해 보십시오
  - 고려하십시오
  - 주의하십시오
  lexicon: BDAG
  rationale: 청중에게 단순한 시각적 관찰이 아니라 주의 깊은 판단을 요구하는 명령이므로, 합쇼체의 권고형으로 ‘살피십시오’를 택했습니다.
- source_word: ἐξέστιν
  english_pob_choice: it is possible
  chosen_korean: 분별할 수 있는지
  alternatives_korean:
  - 가능한지
  - 할 수 있는지
  - 허용되는지
  lexicon: BDAG
  rationale: 여기서는 허용 여부보다 실제로 알아차릴 수 있는 가능성을 묻는 흐름이므로, ‘분별할 수 있는지’로 옮겼습니다.
- source_word: παρὰ πόδας ὑμᾶς
  english_pob_choice: lying at your feet
  chosen_korean: 여러분의 발밑에 있는 것들
  alternatives_korean:
  - 여러분 앞에 있는 것들
  - 가까이 있는 것들
  - 여러분이 바로 보는 것들
  lexicon: LSJ
  rationale: 관용구의 즉시성은 살리되 한국어에서 자연스럽게 읽히도록 ‘발밑에 있는 것들’로 직역성을 유지했습니다.
- source_word: ἀνοσίως ... συντετελεσμένα
  english_pob_choice: lawless deeds have been accomplished
  chosen_korean: 불법한 일들이 이루어졌는지
  alternatives_korean:
  - 경건치 않은 일들이 이루어졌는지
  - 불경한 일들이 이루어졌는지
  - 악한 일들이 벌어졌는지
  lexicon: BDAG
  rationale: ἀνοσίως의 종교적·도덕적 위반을 ‘불법한’으로 옮겨 강한 위법성을 살렸고, 완료된 결과는 ‘이루어졌는지’로 반영했습니다.
- source_word: τῇ τῶν ἀναξία δυναστευόντων λοιμότητι
  english_pob_choice: by the pestilence of those who rule unworthily
  chosen_korean: 합당하지 않게 통치하는 자들의 재앙으로
  alternatives_korean:
  - 합당치 않게 권세를 부리는 자들의 전염병으로
  - 부당하게 다스리는 자들의 역병으로
  - 자격 없이 군림하는 자들의 재앙으로
  lexicon: LSJ
  rationale: λοιμότης의 문자적 ‘전염병/역병’ 이미지는 유지하되, 문맥상 통치자의 파괴적 성격을 드러내기 위해 ‘재앙’으로 옮겨 비유성을 자연스럽게 살렸습니다.
theological_decisions:
- issue: ἀνοσίως의 종교적 뉘앙스와 도덕적 비난 강도
  chosen_reading: ‘불법한 일들’로 번역해 단순한 나쁜 행위보다 더 강한 위반성과 신적 질서를 거스르는 함의를 살렸습니다.
  alternative_readings:
  - 불경한 일들
  - 사악한 일들
  - 경건치 않은 일들
  rationale: 본문은 단순 윤리 비판이 아니라 거룩함을 침해하는 행위까지 포함하는 강한 평가를 담으므로, 교회적 관용어보다 원문의 긴장을 드러내는 표현이 필요합니다.
  doctrine_reference: '번역 원칙: source-direct rendering and documented tension retention'
- issue: λοιμότης의 비유적 사용
  chosen_reading: ‘재앙’으로 옮겨 비유를 살리되, 원문의 파괴적 이미지가 한국어 독자에게도 전달되도록 했습니다.
  alternative_readings:
  - 전염병
  - 역병
  - 부패
  rationale: 문맥상 실제 질병보다 통치의 해악을 비유하는 표현이므로, 문자적 질병어를 그대로 두기보다 의미 효과를 우선하되 과도한 해석은 피했습니다.
  doctrine_reference: '번역 원칙: maintain true and powerful meaning'
