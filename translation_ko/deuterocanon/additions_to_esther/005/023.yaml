  text: so that both now and after these things there may be deliverance for us and for the Persians who are well-disposed toward us[a], but for those plotting against us[b], a memorial of destruction.
  footnotes:
  - marker: a
    text: Or 'salvation' for 'deliverance'; the Greek σωτηρία can bear either sense, but here it likely refers to concrete preservation from danger.
    reason: lexical_alternative
  - marker: b
    text: Or 'a remembrance of destruction' or 'a reminder of their destruction.' The Greek expression is compact and may denote a lasting memorial of the downfall of those plotting against them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 지금과 이후에도 우리와 우리에게 호의를 보이는 페르시아인들에게는 구원이 있고, 우리를 해치려고 꾀하는 자들에게는 멸망을 기억하게 하는 표지가 있게 하려는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘멸망의 기념’입니다. 헬라어 μνημόσυνον τῆς ἀπωλείας는 멸망에 관한 지속적인 기억이나 기념물을 뜻할 수도 있으며, 정확히 어떤 형태의 표지를 가리키는지는 분명하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σωτηρία
