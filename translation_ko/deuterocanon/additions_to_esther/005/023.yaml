  rationale: 단순한 감정 호의가 아니라 우리에게 우호적인 태도를 지닌 사람들을 가리키므로, ‘호의적인’으로 압축해 옮겼습니다.
- source_word: ἐπιβουλεύουσιν
  english_pob_choice: plot against
  chosen_korean: 모해하는 자들
  alternatives_korean:
