  - 우리를 해치려 하는 자들
  lexicon: ἐπιβουλεύω
  rationale: ‘모해하다’는 은밀한 음모와 해악 의도를 함께 드러내며, 본문의 대조 구조를 한국어에서 간결하게 살릴 수 있습니다.
- source_word: μνημόσυνον τῆς ἀπωλείας
  english_pob_choice: memorial/remembrance of destruction/ruin
  chosen_korean: 멸망의 기념
  alternatives_korean:
  - 파멸의 기념물
  - 멸망을 기억하게 하는 표징
  lexicon: μνημόσυνον
  rationale: μνημόσυνον의 핵심은 ‘기념/기억의 표지’이므로, ‘기념’으로 살리되 ἀπωλεία의 파괴성을 ‘멸망’으로 분명히 했습니다.
theological_decisions:
- issue: 복합적 목적/결과 문장의 문체 처리
  chosen_reading: ‘…하게 하소서’로 끝내어 간구형의 목적·결과 의미를 한국어에서 자연스럽게 드러냈습니다.
  alternative_readings:
  - ‘…이 되게 하소서’
  - ‘…가 임하게 하소서’
  rationale: 헬라어 ὅπως 절의 결과/목적 뉘앙스가 기도체 표현과 잘 맞으므로, 간구형으로 옮기면서 내용 대조를 분명히 했습니다.
  doctrine_reference: 문맥상 왕후의 중재 기도이며, 기도체의 간구 형식 유지
- issue: ‘기념’의 기능 이해
  chosen_reading: ‘멸망의 기념’은 단순 추모가 아니라 심판과 파멸을 상기시키는 표지로 이해했습니다.
  alternative_readings:
  - ‘멸망에 대한 기념’
  - ‘멸망의 표징’
  rationale: 본문의 대조는 선한 자의 보존과 악한 자의 파멸을 병렬하는 것이므로, ‘기념’을 심판적 기억의 표지로 읽는 것이 자연합니다.
  doctrine_reference: 본문의 재난-구원 대조 구조
