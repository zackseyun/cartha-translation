  - ‘…가 임하게 하소서’
  rationale: 헬라어 ὅπως 절의 결과/목적 뉘앙스가 기도체 표현과 잘 맞으므로, 간구형으로 옮기면서 내용 대조를 분명히 했습니다.
  doctrine_reference: 문맥상 왕후의 중재 기도이며, 기도체의 간구 형식 유지
- issue: ‘기념’의 기능 이해
  chosen_reading: ‘멸망의 기념’은 단순 추모가 아니라 심판과 파멸을 상기시키는 표지로 이해했습니다.
  alternative_readings:
  - ‘멸망에 대한 기념’
  - ‘멸망의 표징’
  rationale: 본문의 대조는 선한 자의 보존과 악한 자의 파멸을 병렬하는 것이므로, ‘기념’을 심판적 기억의 표지로 읽는 것이 자연합니다.
  doctrine_reference: 본문의 재난-구원 대조 구조
