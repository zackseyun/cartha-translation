lexical_decisions:
- source_word: ἀντίγραφον
  english_pob_choice: a copy
  chosen_korean: 사본
  alternatives_korean:
  - 복사본
  - 한 부의 사본
  lexicon: LSJ
  rationale: 행정 문맥에서 원문의 ἀντίγραφον은 원본의 복제본을 뜻하므로, 간결하고 공식적인 ‘사본’이 가장 자연스럽습니다.
- source_word: ἐκθέντες
  english_pob_choice: after posting
  chosen_korean: 공개적으로 게시한 뒤
  alternatives_korean:
  - 공개하여
  - 널리 게시한 뒤
  - 내걸은 뒤
  lexicon: LSJ
  rationale: ἐκτίθημι의 여기서는 문서를 공적으로 내보이고 게시하는 행위를 가리키므로, 현대 행정문에 맞게 ‘공개적으로 게시한 뒤’로 옮겼습니다.
- source_word: μετὰ παρρησίας
  english_pob_choice: openly
  chosen_korean: 공개적으로
  alternatives_korean:
  - 드러내어
  - 뻔히
  - 담대하게
  lexicon: LSJ
  rationale: παρρησία는 주저함 없는 ‘공개성’과 ‘솔직함’을 포함하지만, 이 문맥에서는 심리적 ‘담대함’보다 공적 게시의 방식이 핵심이므로 ‘공개적으로’가 적절합니다.
- source_word: τοῖς ἑαυτῶν νομίμοις
  english_pob_choice: their own laws
  chosen_korean: 자기들의 율법
  alternatives_korean:
  - 자기들의 법
  - 자기들의 관습
  - 자기들의 율법과 관습
  lexicon: LSJ
  rationale: νόμιμα는 법과 관습 모두를 가리킬 수 있지만, 유대인 공동체의 규범을 가리키는 이 문맥에서는 한국어 성경 용례에 맞는 ‘율법’이 가장 직접적입니다.
theological_decisions:
- issue: νόμιμα의 범위
  chosen_reading: 유대인들이 자기들의 율법을 따르도록 허용한다는 의미로 번역했습니다.
  alternative_readings:
  - 유대인들이 자기들의 관습을 따르도록 허용한다
  - 유대인들이 자기들의 법과 관습을 따르도록 허용한다
  rationale: 본문의 νόμιμα는 법적 규범과 관습적 실천을 함께 함축할 수 있으나, 원문의 행정적 허가 취지와 유대 공동체의 정체성을 고려할 때 ‘율법’이 핵심 의미를 가장 압축적으로 드러냅니다.
  doctrine_reference: 유대 공동체의 율법 준수와 종교적 자율성
- issue: ἐν παντὶ τόπῳ μετὰ παρρησίας의 공적 성격
  chosen_reading: 공개적으로 게시한 뒤로 옮겨, 문서의 공적 공표와 허가의 성격을 드러냈습니다.
  alternative_readings:
  - 담대하게
  - 공공연히
  - 모든 곳에
  rationale: 여기서 παρρησία는 개인의 용기보다 공적 노출과 공개 선포의 방식에 가깝기 때문에, 한국어로는 ‘공개적으로’가 의미 손실이 적습니다.
  doctrine_reference: 공적 칙령의 공표 방식
