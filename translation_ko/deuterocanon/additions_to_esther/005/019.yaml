  - 한 부의 사본
  lexicon: LSJ
  rationale: 행정 문맥에서 원문의 ἀντίγραφον은 원본의 복제본을 뜻하므로, 간결하고 공식적인 ‘사본’이 가장 자연스럽습니다.
