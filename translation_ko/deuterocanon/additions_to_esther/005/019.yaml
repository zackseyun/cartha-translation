  lexicon: LSJ
  rationale: παρρησία는 주저함 없는 ‘공개성’과 ‘솔직함’을 포함하지만, 이 문맥에서는 심리적 ‘담대함’보다 공적 게시의 방식이 핵심이므로 ‘공개적으로’가 적절합니다.
