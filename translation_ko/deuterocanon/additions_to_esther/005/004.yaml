  - 제거하는
  lexicon: LSJ
  rationale: 감사를 사람들에게서 강제로 박탈한다는 동작성을 살리기 위해 ‘빼앗는’을 택했습니다.
- source_word: κόμποις ... ἐπαρθέντες
  english_pob_choice: boasts ... being puffed up
  chosen_korean: '... 자랑에까지 들떠서'
  alternatives_korean:
