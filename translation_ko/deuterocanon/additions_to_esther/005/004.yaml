  - '... 자만에 부풀어'
  lexicon: LSJ
  rationale: 코μποις의 과시적 ‘자랑’과 ἐπαρθέντες의 ‘들뜸/우쭐함’을 함께 담기 위해 하나의 한국어 구성으로 압축했습니다.
- source_word: ἀπεράγἀθων
  english_pob_choice: those who are exceedingly good
  chosen_korean: 뛰어나게 좋은 사람들
  alternatives_korean:
  - 지극히 선한 사람들
  - 매우 고결한 사람들
  lexicon: LSJ
  rationale: 본문 전승이 난해하므로, POB의 ‘exceedingly good’에 맞추어 평가적·강조적 의미를 드러내는 표현을 사용했습니다.
- source_word: κατοπτεύοντος ... θεοῦ μισοπόνηρον
  english_pob_choice: the God who always sees all things and hates evil
  chosen_korean: 늘 모든 것을 살피시는 악을 미워하시는 하나님
  alternatives_korean:
  - 항상 모든 것을 보시며 악을 미워하시는 하나님
  - 언제나 만물을 살피시고 악을 미워하시는 하나님
  lexicon: LSJ
  rationale: κατοπτεύοντος의 감시·주시의 의미를 ‘살피시는’으로, μισοπόνηρον의 도덕적 혐오를 ‘악을 미워하시는’으로 옮겨 두 속성을 모두 살렸습니다.
- source_word: δίκην
  english_pob_choice: judgment
  chosen_korean: 심판
  alternatives_korean:
  - 판결
  - 벌
  lexicon: LSJ
  rationale: 문맥상 법정적 판단과 징벌적 결과를 함께 포괄하는 말로 ‘심판’이 가장 자연스럽습니다.
theological_decisions:
- issue: 하나님의 성품을 묘사하는 압축된 수식구의 처리
  chosen_reading: ‘늘 모든 것을 살피시는 악을 미워하시는 하나님’으로 옮겨, 전지성과 도덕적 반대의 두 속성을 분리하지 않고 함께 드러냈습니다.
  alternative_readings:
  - ‘항상 모든 것을 보시며 악을 미워하시는 하나님’
  - ‘만사를 감찰하시며 악을 혐오하시는 하나님’
  rationale: 그리스어는 하나님의 감찰과 악 혐오를 압축해 병치하므로, 한국어도 두 요소를 모두 보존하는 방향이 본문 충실도에 적합합니다.
  doctrine_reference: 하나님의 전지성과 거룩하심
- issue: δίκην의 의미 범위
  chosen_reading: ‘심판’으로 처리해 법적 판단과 그에 따른 처벌 가능성을 함께 열어 두었습니다.
  alternative_readings:
  - ‘정의’
  - ‘벌’
  rationale: 원문은 단순한 윤리적 정의보다 피하지 못할 법적·형벌적 결과를 가리킬 수 있으므로, 의미 범위를 좁히지 않았습니다.
  doctrine_reference: 재판적 심판과 보응
