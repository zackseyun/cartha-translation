base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/005/004.yaml
  text: And[a], while taking away gratitude not only from men, but also being puffed up by the boasts of those who are exceedingly good[b], they suppose they will escape the judgment of the God who always sees all things and hates evil.
  footnotes:
  - marker: a
    text: The Greek adjective behind 'those who are exceedingly good' is textually and lexically difficult in this form; it likely refers to people considered exceptionally good or noble.
    reason: textual_variant
  - marker: b
    text: Or 'escape justice,' 'escape punishment.' The Greek δίκην can carry judicial and punitive nuance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 사람들에게서 감사를 빼앗을 뿐 아니라, 매우 훌륭하거나 고귀하다고 여겨지는 사람들의 자랑으로 교만해져서, 항상 모든 것을 살피시고 악을 미워하시는 하나님의 심판을 피할 수 있으리라고 생각합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘매우 훌륭하거나 고귀하다고 여겨지는 사람들’에 해당하는 그리스어는 전승과 어휘 면에서 난해합니다. 탁월하게 선하거나 고귀하다고 여겨지는 사람들을 가리키는 말로 보입니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘정의의 판결을 피하다’, ‘벌을 피하다’로 옮길 수 있습니다. δίκην은 법정적 판정과 징벌적 결과를 모두 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστίαν
  english_pob_choice: gratitude
  chosen_korean: 감사함
