lexical_decisions:
- source_word: κακοηθείας
  english_pob_choice: malice
  chosen_korean: 악의
  alternatives_korean:
  - 악질
  - 사악함
  - 적의
  lexicon: LSJ
  rationale: 사람의 태도와 마음에 드러나는 부정적 성향을 가리키므로, 넓은 의미의 '악질'보다 문맥에 맞는 '악의'가 자연스럽습니다.
- source_word: ψευδεῖ παραλογισμῷ
  english_pob_choice: false reasoning
  chosen_korean: 거짓된 논리
  alternatives_korean:
  - 거짓된 추론
  - 허위의 논리
  - 잘못된 논리
  lexicon: LSJ
  rationale: 두 단어가 결합해 잘못된 사고 과정 자체를 강조하므로, '논리'를 살리고 '거짓된'으로 ψευδεῖ의 수식을 반영했습니다.
- source_word: παραλογισαμένων
  english_pob_choice: having misjudged
  chosen_korean: 오판하여
  alternatives_korean:
  - 속아서
  - 잘못 판단하여
  - 그릇되게 판단하여
  lexicon: LSJ
  rationale: 원문은 잘못된 결론에 이른 상태를 나타내므로, 간결하면서도 판단의 오류를 드러내는 '오판하여'가 적절합니다.
- source_word: ἐπικρατούντων
  english_pob_choice: those in power
  chosen_korean: 권세 있는 이들
  alternatives_korean:
  - 집권자들
  - 통치자들
  - 권력자들
  lexicon: LSJ
  rationale: 단순한 직함보다 지배·우세의 뉘앙스를 살려, 문맥상 중립적인 '권세 있는 이들'로 옮겼습니다.
- source_word: ἀκέραιον εὐγνωμοσύνην
  english_pob_choice: sincere goodwill
  chosen_korean: 순전한 호의
  alternatives_korean:
  - 진실한 선의
  - 순수한 호의
