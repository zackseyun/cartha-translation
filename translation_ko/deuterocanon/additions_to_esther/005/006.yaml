  lexicon: LSJ
  rationale: ἀκέραιον은 '섞임 없는, 순전한' 뜻을, εὐγνωμοσύνην은 여기서 '감사'보다 상대를 향한 선한 태도를 가리키므로 '호의'로 옮겼습니다.
theological_decisions:
- issue: τῆς κακοηθείας와 ψευδεῖ παραλογισμῷ의 결합이 만드는 의미 강조
  chosen_reading: 악의가 낳은 거짓된 사고가 사람들을 오판으로 이끈다는 뉘앙스를 살렸습니다.
  alternative_readings:
  - 악의에 속아 잘못 판단했다는 식으로 완화할 수 있습니다.
  - 단순히 '악의로 잘못 생각했다'로 줄일 수 있습니다.
  rationale: 원문은 단순한 실수보다 악의에 뿌리둔 왜곡된 인지와 그 결과인 오판을 함께 드러내므로, 그 긴장을 보존하는 번역이 필요합니다.
  doctrine_reference: 문학적·수사적 긴장 보존
- issue: τῶν ἐπικρατούντων ἀκέραιον εὐγνωμοσύνην의 소유 관계
  chosen_reading: '''권세 있는 이들의 순전한 호의''로 받아, 그들에게 속한 선한 태도를 나타내도록 했습니다.'
  alternative_readings:
  - '''권세 있는 이들에게 보이는 순전한 감사''로 읽을 수 있습니다.'
  - '''권세 있는 이들에 대한 순전한 감사''로도 옮길 수 있습니다.'
  rationale: 영어 POB의 audit trail이 이 구절을 통치자들의 너그러움/선의로 이해하므로, 감사보다 호의·선의의 의미를 따르는 것이 문맥에 더 부합합니다.
  doctrine_reference: 영어 POB 감사추적 메모
