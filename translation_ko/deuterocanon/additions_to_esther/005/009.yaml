  source_fidelity: χρώμενοι와 διακρίνοντες는 문맥상 ‘활용하고/판단하는’ 행위를 나타내며, διακρίνοντες에는 단순 식별보다 판단·판별의 의미가 있습니다. τὰ ὑπὸ τὴν ὄψιν ἐρχόμενα는 ‘눈앞에 오는 것들’보다 ‘눈앞에 나타나는 사안들’로 옮기는 것이 자연스럽고 의미도 보존합니다. μετʼ ἐπιεικεστέρας ἀπαντήσεως는 더 관대하고 너그러운 응대의 방식으로 판단함을 가리키므로, 이를 문장 안에서 자연스럽게 드러냈습니다.
