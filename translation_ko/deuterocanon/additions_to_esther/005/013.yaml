  - marker: b
    text: The phrase rendered 'by devious schemes of deceit' compresses several pejorative Greek terms for cunning, contrivance, and deceptive reasoning.
    reason: lexical_alternative
translation:
  language: ko
  text: 교묘하고 복잡한 기만의 계략으로, 우리의 구원자[a]이며 언제나 은혜를 베푼 모르드개와 왕국의 흠 없는 동반자인 에스더, 그리고 그들에게 속한 온 민족을 멸망시켜 달라고 요청하였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구원자’는 여기서 모르드개의 실제 보존·구출 역할을 가리키며, 반드시 후대의 신학적 칭호를 뜻하지는 않습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘교묘하고 복잡한 기만의 계략’은 원문의 여러 폄하 표현, 곧 복잡하게 얽힌 계책과 기만적 추론을 한국어로 옮긴 것입니다.
    reason: lexical_alternative
