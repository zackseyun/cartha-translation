  - 얽히고설킨 계책으로
  - 교활한 술책으로
  lexicon: LSJ
  rationale: 세 단어가 겹쳐 강한 폄하와 복합적 기만을 표현하므로, 한국어에서는 의미를 압축해도 되는 수사적 묶음으로 보고 ‘교묘한 속임수로’로 자연스럽게 재현했습니다.
- source_word: εἰς ἀπώλειαν
  english_pob_choice: for the destruction
  chosen_korean: 멸망시키려고
  alternatives_korean:
  - 파멸시키려고
  - 파괴하려고
  - 멸절시키려고
  lexicon: BDAG
  rationale: εἰς + 목적어는 의도된 결과를 나타내므로, 한국어 목적형 ‘-려고’로 옮겨 행위의 지향점을 드러냈습니다. ‘멸망’은 개인·집단에 대한 파국적 결과를 무리 없이 담습니다.
theological_decisions:
- issue: τούτων ἔθνει의 지시 관계
  chosen_reading: ‘그들의 온 민족’으로, 마르도카이오스와 에스더를 함께 가리키는 복수 지시를 살렸습니다.
  alternative_readings:
  - 그의 민족
  - 이들의 민족
  - 그 백성
  rationale: 복수 지시대명사 τούτων은 두 인물을 함께 가리키는 것이 가장 자연스럽고, 본문이 그들과 연결된 유대 민족 전체의 위험을 강조하므로 이를 분명히 드러냈습니다.
  doctrine_reference: Translation philosophy §1, §5
