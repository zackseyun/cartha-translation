  lexicon: BDAG
  rationale: 공적·서사적 맥락에서 σῴτήρ는 단순한 ‘도움 준 사람’보다 ‘구원자’가 원문의 힘을 가장 직접적으로 살립니다. 본문에서는 마르도카이오스의 실제 보존 행위를 가리키므로 메시아적 용례로 확대하지는 않습니다.
- source_word: διὰ παντὸς εὐεργέτην
  english_pob_choice: continual benefactor
  chosen_korean: 언제나 은혜를 베푼 사람
  alternatives_korean:
  - 항상 선을 행한 사람
  - 지속적으로 은혜를 베푼 사람
  - 끊임없는 은인
  lexicon: LSJ
  rationale: διὰ παντός는 지속성, εὐεργέτης는 공적 선행과 후원의 뉘앙스를 함께 지니므로, 한국어에서는 자연스럽게 읽히는 ‘언제나 은혜를 베푼 사람’으로 풀어 공적 의미를 살렸습니다.
- source_word: ἄμεμπτον τῆς Βασιλείας κοινωνὸν
  english_pob_choice: blameless partner of the kingdom
  chosen_korean: 왕국의 흠 없는 동반자
  alternatives_korean:
  - 왕국의 흠 없는 شریک
  - 왕권의 흠 없는 شریک
  - 나라의 흠 없는 شریک
  lexicon: BDAG
  rationale: ἄμεμπτος는 ‘흠 없는/책망할 것 없는’의 도덕적·법적 무흠함을 나타내므로 ‘흠 없는’이 적합합니다. κοινωνός는 단순한 동행보다 지위와 몫을 함께하는 자를 가리켜, ‘동반자’로 옮기되 왕국과의 공유 관계를 유지했습니다.
- source_word: πολυπλόκοις μεθόδων παραλογισμοῖς
  english_pob_choice: by devious schemes of deceit
  chosen_korean: 교묘한 속임수로
  alternatives_korean:
