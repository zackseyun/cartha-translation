  lexicon: BDAG
  rationale: εἰς + 목적어는 의도된 결과를 나타내므로, 한국어 목적형 ‘-려고’로 옮겨 행위의 지향점을 드러냈습니다. ‘멸망’은 개인·집단에 대한 파국적 결과를 무리 없이 담습니다.
