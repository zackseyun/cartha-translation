  text: having sought[a], by devious schemes of deceit, the destruction of Mordecai, our savior and continual benefactor, and Esther, the blameless partner of the kingdom[b], together with all their nation.
  footnotes:
  - marker: a
    text: Or 'deliverer' for 'savior' (σωτῆρα); the Greek here refers to Mordecai as one who saved or preserved, not necessarily as a formal title.
    reason: lexical_alternative
  - marker: b
    text: The phrase rendered 'by devious schemes of deceit' compresses several pejorative Greek terms for cunning, contrivance, and deceptive reasoning.
    reason: lexical_alternative
translation:
  language: ko
  text: 마르도카이오스, 곧 우리의 구원자요 언제나 은혜를 베푼 사람이요, 왕국의 흠 없는 동반자 에스더와 그들의 온 민족을, 교묘한 속임수로 멸망시키려고 구했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구원자’는 여기서 마르도카이오스의 실제 보존·구출 역할을 가리키며, 반드시 후대의 신학적 칭호를 뜻하지는 않습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘교묘한 속임수로’는 원문의 여러 폄하 표현(복합적 계책, 기만적 추론)을 한국어로 압축한 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σωτῆρα
  english_pob_choice: savior
  chosen_korean: 구원자
  alternatives_korean:
  - 구해 준 사람
