review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. τοῦ κυρίου μου는 이 기도문에서 하나님을 부르는 호격적 표현이며, 앞의 ‘하나님의 영광’ 및 ‘당신 외에는’과 직접 연결됩니다. 이를 인간 권위자에게 하는 호칭으로 보고 ‘주인님’으로 옮긴 것은 본문 문맥과 맞지 않습니다. ‘제 주님’이 적절합니다. 또한 ἵνα μὴ θῶ의 목적 관계는 한 문장 안에서 자연스럽게 드러내는 편이 좋습니다.
  naturalness: ‘사람의 영광을 하나님의 영광보다 높이 두지 않으려고’는 원문의 비교·평가 비유를 자연스러운 현대 한국어로 나타냅니다. ‘제 주님 외에는 아무에게도 절하지 않겠습니다’는 합쇼체를 유지하면서도 기도 대상에 맞는 표현입니다.
  terminology: δόξα는 대조를 유지하도록 ‘영광’으로, προσκυνέω는 인간에게 하는 행위의 의미 범위를 보존하도록 ‘절하다’로 유지합니다. κύριος는 이 문맥에서 하나님께 드리는 호칭이므로 ‘주님’으로 바로잡습니다. ὑπερηφανίᾳ는 ‘교만한 마음으로’가 자연스럽고 의미상 허용됩니다.
  issues:
  - severity: high
    issue: ‘주인님’ 및 그에 따른 인간 권위자라는 해설
    rationale: 그리스어 ‘πλὴν σοῦ τοῦ κυρίου μου’는 바로 앞의 ‘하나님의 영광’과 이어지는 하나님께 대한 직접 호칭입니다. ‘주인님’은 대상과 호칭의 성격을 잘못 바꾸며, 초안의 신학적 판단 및 각주도 이 오해를 반복합니다.
  - severity: low
    issue: 첫 두 문장의 연결
    rationale: ‘곧’으로 새 문장을 시작하면 ἵνα 목적절의 결속이 다소 약해집니다. 목적을 한 문장으로 연결하면 원문의 논리가 더 분명합니다.
  revised_text: 그러나 저는 사람의 영광을 하나님의 영광보다 높이 두지 않으려고 이렇게 했습니다. 저는 제 주님 외에는 아무에게도 절하지 않겠으며, 교만한 마음으로 이런 일들을 하지 않겠습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘제 주님 외에는 아무에게도 경배하지 않겠습니다.’ 그리스어 동사는 문맥에 따라 절하는 행위나 경배를 뜻할 수 있습니다.
    reason: lexical_alternative
  revision_rationale: ‘제 주님’으로 고쳐 기도문 안에서 하나님께 직접 말하는 원문의 대상을 보존했습니다. προσκυνέω의 의미 범위는 본문에서는 ‘절하다’로, 각주에서는 ‘경배하다’라는 가능한 대안으로 보존했습니다. 목적절은 한국어 문장 구조에 맞게 연결했으며, 그 밖의 핵심 어휘와 미래의 결단 표현은 유지했습니다.
