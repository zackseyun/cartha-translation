translation:
  language: ko
  text: 그러나 저는 이것을 행했습니다. 곧 사람의 영광을 하나님의 영광 위에 두지 않기 위해서입니다. 그리고 주인님[a] 외에는 아무에게도 절하지 않겠습니다. 또 저는 교만한 마음으로 이런 일들을 하지 않겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신 외에는 누구에게도 경배하지 않겠습니다, 나의 주인님.’ 그리스어 동사는 문맥에 따라 절하는 행위나 예배를 뜻할 수 있습니다.
    reason: lexical_alternative
