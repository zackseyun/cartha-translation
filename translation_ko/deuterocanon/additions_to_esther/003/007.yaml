  rationale: 문맥상 대상은 하나님이 아니라 인간 권위자이며, 영어 POB도 'my lord'로 낮춘 형태를 유지합니다. 따라서 한국 교회어 '주님'은 오해를 낳을 수 있어 피했습니다.
