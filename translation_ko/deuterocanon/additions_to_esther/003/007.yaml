  rationale: 본문은 하나님의 영광과 사람의 영광을 대비한 뒤, 특정 인물 앞에서의 행위를 거절합니다. 따라서 예배 용어로 고정하기보다, 문맥상 필요한 경배-복속의 긴장을 보존하는 번역이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: preserve theological tension rather than resolve it; translate from source plain sense'
- issue: κύριος의 한국어 처리
  chosen_reading: 호칭적 문맥이므로 '주인님'으로 옮겨 신적 호칭과 구별했습니다.
  alternative_readings:
  - 주님
  - 주인
  rationale: 문맥상 대상은 하나님이 아니라 인간 권위자이며, 영어 POB도 'my lord'로 낮춘 형태를 유지합니다. 따라서 한국 교회어 '주님'은 오해를 낳을 수 있어 피했습니다.
  doctrine_reference: 'DOCTRINE.md: source-directed rendering; avoid importing later ecclesial register without basis'
