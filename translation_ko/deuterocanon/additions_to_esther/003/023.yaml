  yaml_path: translation/deuterocanon/additions_to_esther/003/023.yaml
  text: Put fitting words in my mouth before the lion, and turn his heart to hatred against the one who is warring against us, to his destruction and that of those who are of one mind with him.
  footnotes:
  - marker: a
    text: Or 'Give a well-ordered word in my mouth.' The Greek λόγον εὔρυθμον can emphasize speech that is apt, well-framed, or suitably composed.
    reason: lexical_alternative
  - marker: b
    text: '''The lion'' is a metaphor for the king in Esther''s prayer; the Greek preserves the image rather than naming him directly.'
    reason: cultural_note
  - marker: c
    text: Or 'to his end' or 'to his ruin.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사자 앞에서 제 입에 알맞은 말을 주시고[a], 그의 마음을 우리와 싸우는 자를 향한 미움으로 돌리시어, 그와 한마음인 자들을 멸망에 이르게 하십시오.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘잘 짜인 말’ 또는 ‘알맞게 구성된 말’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘사자’는 에스더의 기도에서 왕을 가리키는 비유적 표현입니다.
    reason: cultural_note
  - marker: c
    text: 그리스어 συντέλεια는 ‘끝’, ‘종결’, 또는 문맥상 ‘멸망’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὸς λόγον εὔρυθμον
  english_pob_choice: Put fitting words
  chosen_korean: 그럴듯한 말을 넣어 주셔서
  alternatives_korean:
  - 알맞은 말을 넣어 주셔서
  - 잘 갖추어진 말을 넣어 주셔서
  - 품위 있는 말을 넣어 주셔서
  lexicon: LSJ
  rationale: λόγον εὔρυθμον은 단순한 단어가 아니라 상황에 맞고 잘 짜인 발화를 가리키므로, 한국어에서는 자연스럽게 ‘그럴듯한 말’로 옮겨 발화의 적절성과 구성성을 함께 살렸습니다.
- source_word: ἐνώπιον τοῦ λέοντος
  english_pob_choice: before the lion
  chosen_korean: 그 사자를 앞에 두고도
  alternatives_korean:
  - 사자 앞에서
  - 그 사자 앞에서
  - 그 왕 앞에서
  lexicon: BDAG
  rationale: 본문의 비유적 이미지를 지키기 위해 ‘왕’으로 풀지 않고 ‘사자’를 유지했습니다. 한국어에서는 위치 관계를 살려 ‘앞에 두고도’로 옮겨 위협적 상황을 드러냈습니다.
- source_word: μετάθες τὴν καρδίαν αὐτοῦ εἰς μῖσος
  english_pob_choice: turn his heart to hatred
  chosen_korean: 그의 마음을 … 미움으로 돌리셔서
  alternatives_korean:
  - 그의 마음을 … 미워함으로 바꾸셔서
  - 그의 마음을 … 증오로 돌리셔서
  - 그의 마음을 … 미움 쪽으로 돌리셔서
  lexicon: BDAG
  rationale: μετάθες는 내적 성향의 전환을 뜻하므로 ‘돌리다’가 방향 전환의 이미지를 잘 보존합니다. εἰς μῖσος는 결과 상태를 가리켜 ‘미움으로’가 가장 직접적입니다.
- source_word: τοῦ πολεμοῦντος ἡμᾶς
  english_pob_choice: the one who is warring against us
  chosen_korean: 우리와 싸우는 자
  alternatives_korean:
  - 우리를 대적하는 자
  - 우리를 치고 있는 자
  - 우리와 전쟁하는 자
  lexicon: BDAG
  rationale: 분사형 단수의 힘을 살려 복수 일반화 대신 단수 ‘자’로 유지했습니다. ‘싸우는’은 πολεμέω의 적극적 대적 행위를 한국어로 자연스럽게 드러냅니다.
- source_word: εἰς συντέλειαν αὐτοῦ
  english_pob_choice: to his destruction
  chosen_korean: 그와 … 자들의 멸망으로 이르게
  alternatives_korean:
  - 그의 끝으로 이르게
  - 그의 파멸로 이르게
  - 그의 멸망에 이르게
  lexicon: LSJ
  rationale: συντέλεια는 단순한 종료가 아니라 결정적 종결을 뜻하므로, 문맥상 파괴적 결과를 분명히 하는 ‘멸망’으로 옮겼습니다. 목적/결과를 나타내는 구조는 ‘이르게’로 반영했습니다.
theological_decisions:
- issue: ‘사자’ 비유를 유지할지, 직접 ‘왕’으로 풀지
  chosen_reading: 본문의 비유를 그대로 살려 ‘사자’를 유지했습니다.
  alternative_readings:
  - 왕 앞에서
  - 폐하 앞에서
  rationale: 그리스어 본문은 왕을 직접 명명하지 않고 동물 비유를 사용하므로, 이를 해석어로 바꾸지 않고 유지해야 본문의 문학적 긴장과 기도문의 절박함이 보존됩니다.
  doctrine_reference: 원문 우선 원칙; 이미지의 평탄화 방지
- issue: ‘우리와 한마음인 자들’의 범위를 단수 적대자와 함께 처리할지
  chosen_reading: 단수 적대자의 멸망과 더불어 그와 뜻을 같이하는 자들의 멸망을 병렬로 표현했습니다.
  alternative_readings:
  - 그의 동맹자들
  - 그와 뜻을 같이하는 자들
  rationale: 그리스어는 단수 분사와 복수 표현을 함께 써서 주적과 동조자들을 구분합니다. 한국어도 이 구분을 살려 주적과 동조 집단을 함께 드러내야 합니다.
  doctrine_reference: 원문 문법 보존; 과도한 일반화 금지
