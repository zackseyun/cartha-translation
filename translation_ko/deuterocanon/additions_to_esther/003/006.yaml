  - 이스라엘의 구원을 위하여
  - 이스라엘의 구원을 위해
  lexicon: BDAG
  rationale: πρὸς는 목적을 나타내므로 ‘~을 위해서라면’으로 옮겨, 이것이 실제 행위의 보고가 아니라 구원을 위한 조건적 의지를 드러내게 했습니다.
theological_decisions:
- issue: 극도의 경의 행위와 조건적 의지의 표현
  chosen_reading: 이스라엘을 구하려는 목적 아래 왕에게 극도의 복종과 경의를 표할 수 있었던 가능성을 말하는 문장으로 읽었습니다.
  alternative_readings:
  - 이미 실제로 그런 행동을 했다는 보고
  - 단순히 그를 사랑했다는 뜻
  rationale: 발바닥에 입맞춘다는 구체적 표현은 일반적 애정보다 굴복과 경의의 제스처를 가리키며, 과거 가능성을 나타내는 동사형과 함께 조건적 진술로 이해하는 것이 자연합니다.
  doctrine_reference: 내러티브의 수사와 문맥 우선 원칙
- issue: σωτηρία의 번역
  chosen_reading: ‘구원’을 기본으로 두되, 여기서는 이스라엘의 구출·건짐의 뜻으로 이해했습니다.
  alternative_readings:
  - 구출
  - 건짐
  rationale: 한국어 성경 전통에서 σωτηρία는 ‘구원’이 가장 넓고 일관된 대응어이지만, 문맥상 구체적 해방을 가리킨다는 점은 주석적으로 보완했습니다.
  doctrine_reference: 어휘-문맥 일치 원칙
