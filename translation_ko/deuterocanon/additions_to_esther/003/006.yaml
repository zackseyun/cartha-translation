  rationale: 발바닥이라는 구체적 신체 부위와 결합할 때는 단순한 애정보다 복종·경의의 몸짓인 ‘입맞추다’가 원문의 힘을 더 잘 드러냅니다.
- source_word: πέλματα ποδῶν
  english_pob_choice: the soles of his feet
  chosen_korean: 그의 발바닥을
  alternatives_korean:
  - 그의 발의 바닥을
  - 그의 발솔을
  lexicon: LSJ
  rationale: πέλμα는 발바닥을 뜻하므로, 한국어에서도 직역에 가까운 ‘발바닥’으로 구체성과 수치를 보존했습니다.
- source_word: πρὸς σωτηρίαν Ἰσραήλ
  english_pob_choice: for the salvation of Israel
  chosen_korean: 이스라엘의 구원을 위해서라면
