  lexicon: LSJ
  rationale: πέλμα는 발바닥을 뜻하므로, 한국어에서도 직역에 가까운 ‘발바닥’으로 구체성과 수치를 보존했습니다.
- source_word: πρὸς σωτηρίαν Ἰσραήλ
