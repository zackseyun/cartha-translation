  lexicon: BDAG
  rationale: καταφεύγω의 핵심은 단순 이동이 아니라 피난/의탁입니다. '피했습니다'는 긴박한 피난의 뉘앙스를 살리면서도 한국어로 자연스럽고, ἐπὶ τὸν κύριον의 방향성을 '-께'로 담았습니다.
- source_word: ἐν ἀγῶνι θανάτου
  english_pob_choice: by a struggle of death
  chosen_korean: 죽음의 싸움에 사로잡힌 채
  alternatives_korean:
  - 죽음의 싸움 가운데
  - 죽음의 고투에 사로잡힌 채
  - 죽음의 투쟁에 붙들린 채
  lexicon: LSJ / BDAG
  rationale: ἀγών은 단순한 '고통'보다 격렬한 싸움/투쟁을 뜻하므로 '싸움'으로 살렸습니다. θανάτου는 '죽음의'로 직역해 생명 위협의 강도를 보존했고, κατειλημμένη의 수동적 구속감을 '사로잡힌 채'로 옮겼습니다.
theological_decisions:
- issue: κύριον의 한국어 표기
  chosen_reading: 주님
  alternative_readings:
