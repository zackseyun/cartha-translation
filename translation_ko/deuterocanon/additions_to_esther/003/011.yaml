translation:
  language: ko
  text: 그리고 에스더 왕비는 죽음의 싸움에 사로잡힌 채 주님께 피했습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '주님께 피난했습니다.' 그리스어 동사는 누구에게 보호를 구하며 달아나는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '죽음의 고투에 사로잡힌 채' 혹은 '죽어 가는 고통 속에'. 그리스어 표현은 싸움과 임박한 죽음의 의미를 함께 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐσθὴρ ἡ βασίλισσα
  english_pob_choice: Esther the queen
  chosen_korean: 에스더 왕비
  alternatives_korean:
  - 에스더 여왕
  - 왕비 에스더
  lexicon: 고유명사 관례
  rationale: 본문의 고유명사와 직책을 자연스러운 한국어 어순으로 옮겼습니다. '왕비'는 βασίλισσα의 직접 대응이며, 현대 한국어 성경 문체에 맞게 과도한 장식 없이 유지했습니다.
- source_word: κατέφυγεν ἐπὶ τὸν κύριον
  english_pob_choice: fled to the Lord
  chosen_korean: 주님께 피했습니다
  alternatives_korean:
  - 주님께로 도망했습니다
  - 주님께 피난했습니다
  - 주님께로 달려갔습니다
  lexicon: BDAG
  rationale: καταφεύγω의 핵심은 단순 이동이 아니라 피난/의탁입니다. '피했습니다'는 긴박한 피난의 뉘앙스를 살리면서도 한국어로 자연스럽고, ἐπὶ τὸν κύριον의 방향성을 '-께'로 담았습니다.
- source_word: ἐν ἀγῶνι θανάτου
  english_pob_choice: by a struggle of death
  chosen_korean: 죽음의 싸움에 사로잡힌 채
  alternatives_korean:
  - 죽음의 싸움 가운데
  - 죽음의 고투에 사로잡힌 채
  - 죽음의 투쟁에 붙들린 채
  lexicon: LSJ / BDAG
  rationale: ἀγών은 단순한 '고통'보다 격렬한 싸움/투쟁을 뜻하므로 '싸움'으로 살렸습니다. θανάτου는 '죽음의'로 직역해 생명 위협의 강도를 보존했고, κατειλημμένη의 수동적 구속감을 '사로잡힌 채'로 옮겼습니다.
theological_decisions:
- issue: κύριον의 한국어 표기
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 야훼
  - 주(主)
  rationale: 이 절의 κύριον은 기도의 대상인 하나님을 가리키지만, 본문 자체는 야훼 표기가 아니라 κύριος입니다. 따라서 프로젝트 기준에 따라 '주님'으로 옮겨 신적 호칭의 자연스러움을 유지했습니다.
  doctrine_reference: Contested terms — κύριος → Lord
- issue: 에스더의 행동 동사 선택
  chosen_reading: 피했습니다
  alternative_readings:
  - 도피했습니다
  - 피난했습니다
  rationale: 본문은 단순한 감정 표출이 아니라 위기 속에서 하나님께로 향하는 피난의 행위를 말합니다. '피했습니다'는 방향성과 긴박성을 함께 담아, 후속 절의 간구 배경을 과장 없이 드러냅니다.
  doctrine_reference: Source-sensitive narrative rendering
