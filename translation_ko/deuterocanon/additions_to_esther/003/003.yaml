  footnotes:
  - marker: a
    text: 또는 ‘하늘 아래의 모든 경이로운 것’ 혹은 ‘하늘 아래의 모든 사람을 놀라게 하는 것’. 그리스어 분사 θαυμαζόμενον은 ‘놀라운’ 또는 ‘경탄을 자아내는’ 뜻을 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  english_pob_choice: because
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면 …
  - …이므로
  lexicon: BDAG
  rationale: 기도문 맥락에서 앞 구절의 근거를 밝히는 인과 관계이므로, 현대 한국어에서는 ‘…때문입니다’가 가장 자연스럽고 분명합니다.
- source_word: ἐποίησας
  english_pob_choice: you made
  chosen_korean: 지으셨기
  alternatives_korean:
  - 만드셨기
  - 창조하셨기
  lexicon: BDAG
  rationale: ‘만들다/짓다’ 계열 가운데, 하늘과 땅을 대상로 한 창조 행위의 격식을 살리면서도 원문의 ποιέω보다 과도하게 신학화하지 않도록 ‘지으셨기’를 택했습니다.
- source_word: πᾶν θαυμαζόμενον
  english_pob_choice: every wondrous thing
  chosen_korean: 모든 놀라운 것
  alternatives_korean:
  - 모든 경이로운 것
  - 모든 사람이 놀라는 것
  lexicon: LSJ
  rationale: 분사형 θαυμαζόμενον은 ‘놀라움을 자아내는/놀라운’의 뜻이므로, 한국어에서는 명사구로 자연스럽게 옮겨 ‘모든 놀라운 것’으로 처리했습니다.
- source_word: ἐν τῇ ὑπʼ οὐρανόν
  english_pob_choice: under heaven
  chosen_korean: 하늘 아래
  alternatives_korean:
  - 천하에
  - 하늘 아래 있는
  lexicon: LSJ
  rationale: 지상 세계 전체를 가리키는 관용구이므로, 직역에 가까우면서도 현대 독자가 이해하기 쉬운 ‘하늘 아래’가 적절합니다.
theological_decisions:
- issue: 창조 범위의 포괄성
  chosen_reading: ‘하늘과 땅’의 총괄 표현 뒤에 ‘하늘 아래의 모든 놀라운 것’을 덧붙여, 하나님의 지으심이 우주적 범위를 가지는 것으로 읽었습니다.
  alternative_readings:
  - ‘하늘 아래의 모든 것’을 더 일반적으로 옮기기
  - ‘창조하셨다’로 신학 용어를 앞세우기
  rationale: 원문은 창조 전부를 요약하는 관용적 표지와 더불어 ‘놀라운 것들’을 별도로 덧붙이므로, 그 폭과 시적 강조를 함께 살렸습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
