  yaml_path: translation/deuterocanon/additions_to_esther/003/008.yaml
  text: And now[a], Lord God, King, God of Abraham, spare your people[b], because they are watching us for destruction and have desired to destroy your inheritance from the beginning.
  footnotes:
  - marker: a
    text: Or 'they are watching us for ruin' or 'they have set their eyes on us for destruction.' The Greek expression is compressed and conveys hostile intent directed toward our downfall.
    reason: lexical_alternative
  - marker: b
    text: Or 'your inheritance from of old' / 'your ancient inheritance.'
    reason: alternative_reading
translation:
  language: ko
  text: 이제, 주 하나님, 왕이신 하나님, 아브라함의 하나님이시여, 주의 백성을 아껴 주십시오. 그들이 우리를 멸망시키려고 노리고 있으며[a], 처음부터 주의 기업을 없애기를 원하였기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘멸망을 향해 우리를 바라보고 있다’로 옮길 수 있습니다. 그리스어 표현은 압축되어 있으며, 우리를 파멸시키려는 적대적 의도를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘옛적부터 주의 기업’ 또는 ‘주께서 오래전부터 가지신 기업’으로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Κύριε
  english_pob_choice: Lord
