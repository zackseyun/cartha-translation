base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/008.yaml
  text: And now[a], Lord God, King, God of Abraham, spare your people[b], because they are watching us for destruction and have desired to destroy your inheritance from the beginning.
  footnotes:
  - marker: a
    text: Or 'they are watching us for ruin' or 'they have set their eyes on us for destruction.' The Greek expression is compressed and conveys hostile intent directed toward our downfall.
    reason: lexical_alternative
  - marker: b
    text: Or 'your inheritance from of old' / 'your ancient inheritance.'
    reason: alternative_reading
translation:
  language: ko
  text: 이제, 주 하나님, 만군의 왕, 아브라함의 하나님이시여, 주의 백성을 아껴 주십시오. 그들이 우리를 멸망시키려고 눈을 부릅뜨고 있으며, 처음부터 주의 기업을 없애려고 했기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘멸망을 향해 우리를 보고 있다’는 뜻도 가능합니다. 그리스어 표현은 압축되어 있어, 적대적 의도를 드러내는 다양한 번역이 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘옛적부터 주의 기업’ / ‘주의 오래된 기업’으로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주
  alternatives_korean:
  - 주님
  - 주인이신 분
  lexicon: BDAG
  rationale: 호격으로 부르는 κύριε는 기도문에서 통상적인 신적 호칭인 ‘주’를 살리는 것이 가장 직접적입니다.
- source_word: ὁ θεὸς ὁ βασιλεὺς
  english_pob_choice: God, King
  chosen_korean: 하나님, 만군의 왕
  alternatives_korean:
  - 하나님, 왕
  - 하나님이신 왕
  lexicon: LSJ
  rationale: 겹쳐진 호칭 구조를 유지하되, 한국어에서는 ‘만군의 왕’이 본문의 왕권 호칭을 더 자연스럽고 위엄 있게 드러냅니다.
- source_word: φεῖσαι
  english_pob_choice: spare
  chosen_korean: 아껴 주십시오
  alternatives_korean:
  - 용서해 주십시오
  - 불쌍히 여겨 주십시오
  - 보호해 주십시오
  lexicon: LSJ
  rationale: φείδομαι는 단순 감정보다 해하지 않고 건져 달라는 간청이므로, ‘아껴 주십시오’가 본문의 절박한 보호 요청을 잘 반영합니다.
- source_word: ἐπιβλέπουσιν ἡμῖν εἰς καταφθοράν
  english_pob_choice: they are watching us for destruction
  chosen_korean: 우리를 멸망시키려고 눈을 부릅뜨고 있으며
  alternatives_korean:
  - 우리를 멸망을 향해 바라보고 있으며
  - 우리에게 멸망을 겨누고 있으며
  - 우리를 파멸하려고 지켜보고 있으며
  lexicon: LSJ
  rationale: 압축된 표현을 한국어로 풀어, hostile intent을 드러내는 ‘~하려고 눈을 부릅뜨고’로 옮기되 ‘멸망’으로 목적성을 살렸습니다.
- source_word: τὴν ἐξ ἀρχῆς κληρονομίαν σου
  english_pob_choice: your inheritance from the beginning
  chosen_korean: 처음부터 주의 기업
  alternatives_korean:
  - 옛적부터 주의 기업
  - 태초부터 주의 기업
  - 처음부터 주의 상속 기업
  lexicon: LSJ
  rationale: κληρονομία는 여기서 하나님의 소유인 언약 백성을 가리키므로, 전통적이지만 본문과 잘 맞는 ‘기업’을 사용하고 ἐξ ἀρχῆς는 ‘처음부터’로 옮겼습니다.
theological_decisions:
- issue: ‘God, King’와 ‘God of Abraham’의 호칭 배열
  chosen_reading: 기도문의 누적 호칭을 그대로 살려, 하나님을 ‘주 하나님, 만군의 왕, 아브라함의 하나님’으로 연속 호명했습니다.
  alternative_readings:
  - ‘주 하나님, 왕이신 하나님, 아브라함의 하나님’
  - ‘주 하나님, 왕, 아브라함의 하나님’
  rationale: 그리스어의 층층이 쌓인 호칭을 평탄화하지 않고 보존함으로써, 간청의 긴박함과 예배적 무게를 함께 전달합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: ‘주의 기업’의 신학적 의미
  chosen_reading: 하나님의 언약 백성을 가리키는 비유적 소유 표현으로 이해했습니다.
  alternative_readings:
  - 이스라엘 땅을 가리키는 표현
  - 일반적 재산/소유 개념
  rationale: 문맥상 λαός σου와 평행을 이루며, 하나님이 오래 소유하신 백성을 가리키는 언약적 표현으로 읽는 것이 가장 자연스럽습니다.
  doctrine_reference: Translation philosophy §§1, 5
