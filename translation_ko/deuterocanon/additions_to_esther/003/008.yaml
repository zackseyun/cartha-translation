- source_word: φεῖσαι
  english_pob_choice: spare
  chosen_korean: 아껴 주십시오
  alternatives_korean:
  - 용서해 주십시오
  - 불쌍히 여겨 주십시오
  - 보호해 주십시오
  lexicon: LSJ
  rationale: φείδομαι는 단순 감정보다 해하지 않고 건져 달라는 간청이므로, ‘아껴 주십시오’가 본문의 절박한 보호 요청을 잘 반영합니다.
- source_word: ἐπιβλέπουσιν ἡμῖν εἰς καταφθοράν
  english_pob_choice: they are watching us for destruction
  chosen_korean: 우리를 멸망시키려고 눈을 부릅뜨고 있으며
  alternatives_korean:
  - 우리를 멸망을 향해 바라보고 있으며
  - 우리에게 멸망을 겨누고 있으며
  - 우리를 파멸하려고 지켜보고 있으며
  lexicon: LSJ
  rationale: 압축된 표현을 한국어로 풀어, hostile intent을 드러내는 ‘~하려고 눈을 부릅뜨고’로 옮기되 ‘멸망’으로 목적성을 살렸습니다.
- source_word: τὴν ἐξ ἀρχῆς κληρονομίαν σου
  english_pob_choice: your inheritance from the beginning
  chosen_korean: 처음부터 주의 기업
  alternatives_korean:
  - 옛적부터 주의 기업
  - 태초부터 주의 기업
  - 처음부터 주의 상속 기업
  lexicon: LSJ
  rationale: κληρονομία는 여기서 하나님의 소유인 언약 백성을 가리키므로, 전통적이지만 본문과 잘 맞는 ‘기업’을 사용하고 ἐξ ἀρχῆς는 ‘처음부터’로 옮겼습니다.
theological_decisions:
- issue: ‘God, King’와 ‘God of Abraham’의 호칭 배열
  chosen_reading: 기도문의 누적 호칭을 그대로 살려, 하나님을 ‘주 하나님, 만군의 왕, 아브라함의 하나님’으로 연속 호명했습니다.
  alternative_readings:
  - ‘주 하나님, 왕이신 하나님, 아브라함의 하나님’
  - ‘주 하나님, 왕, 아브라함의 하나님’
  rationale: 그리스어의 층층이 쌓인 호칭을 평탄화하지 않고 보존함으로써, 간청의 긴박함과 예배적 무게를 함께 전달합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: ‘주의 기업’의 신학적 의미
  chosen_reading: 하나님의 언약 백성을 가리키는 비유적 소유 표현으로 이해했습니다.
  alternative_readings:
  - 이스라엘 땅을 가리키는 표현
  - 일반적 재산/소유 개념
  rationale: 문맥상 λαός σου와 평행을 이루며, 하나님이 오래 소유하신 백성을 가리키는 언약적 표현으로 읽는 것이 가장 자연스럽습니다.
  doctrine_reference: Translation philosophy §§1, 5
