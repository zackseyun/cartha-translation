translation:
  language: ko
  text: 그리고 당신의 종은 하만의 상에 앉지 않았으며, 나는 왕의 연회를 높이 여기지 않았고, 또한 전제의 포도주도 마시지 않았습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 하녀.’ 그리스어에는 더 강한 종속성을 띠는 여성형 표현이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 전제나 음료 제사와 관련된 포도주로, 단순한 일반 포도주가 아닙니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἡ δούλη σου
  english_pob_choice: your slave
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 노예
  - 당신의 하녀
  - 당신의 여종
  lexicon: LSJ
  rationale: δούλη는 여성형이지만, 한국어에서는 ‘노예’가 지나치게 직접적이고 ‘하녀’는 직업적 뉘앙스로 어긋날 수 있어, 본문이 드러내는 낮춤과 종속을 살리되 문어체로 자연스러운 ‘종’을 택했습니다.
- source_word: τράπεζαν Ἁμάν
  english_pob_choice: at Haman’s table
  chosen_korean: 하만의 상
  alternatives_korean:
  - 하만의 식탁
  - 하만의 밥상
  - 하만의 자리
  lexicon: LSJ
  rationale: τράπεζα의 기본 뜻은 ‘식탁’이지만, 여기서는 왕실 연회와 대조되는 실제 식사 자리의 이미지를 살려 ‘상’으로 옮겼습니다.
- source_word: ἐδόξασα
  english_pob_choice: did not honor
  chosen_korean: 높이 여기지 않았고
  alternatives_korean:
  - 존귀하게 여기지 않았고
  - 영광스럽게 여기지 않았고
  - 기리지 않았고
  lexicon: LSJ
  rationale: δοξάζω는 여기서 ‘영광을 돌리다’보다 ‘중요하게 여기다/존중하다’의 의미가 자연스럽기 때문에, 왕의 연회를 받아들이거나 찬양하지 않았다는 뜻을 드러내는 표현을 선택했습니다.
- source_word: οἶνον σπονδῶν
  english_pob_choice: the wine of libations
  chosen_korean: 전제의 포도주
  alternatives_korean:
  - 전제주
  - 제물의 포도주
  - 부어 드리는 포도주
  lexicon: LSJ
  rationale: σπονδαί는 전제, 곧 음료 제사를 가리키므로, 단순한 술이 아니라 예식적 성격을 드러내는 ‘전제의 포도주’로 옮겼습니다.
