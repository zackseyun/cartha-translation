  text: And he said[a], “Lord, Lord, King over all powers, because everything is in your authority, and there is no one who can oppose you when you desire to save Israel.”
  footnotes:
  - marker: a
    text: Or “King of all dominions.” The Greek phrase can denote all forms of might or rule, not only political kingdoms.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 말했습니다. 「주님, 주님, 모든 권세를 다스리시는 왕이시여[a], 모든 것이 주님의 권위 아래에 있으니, 주님께서 이스라엘을 구원하고자 하실 때 주님을 거스를 수 있는 이는 아무도 없습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “모든 통치 영역의 왕이시여.” 이 그리스어 구는 정치적 왕국만이 아니라 모든 종류의 권세와 통치를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε, κύριε
  english_pob_choice: Lord, Lord
  chosen_korean: 주님, 주님
  alternatives_korean:
  - 주여, 주여
  - 주님이시여, 주님이시여
  lexicon: κύριος
  rationale: 기도문의 반복 호칭을 살려 같은 높임말을 유지했습니다. 한국어 예배 문체에 맞추되, 과도한 전통어는 피했습니다.
- source_word: βασιλεῦ πάντων κρατῶν
  english_pob_choice: King over all powers
  chosen_korean: 모든 권세 위의 왕이시여
  alternatives_korean:
  - 모든 지배 위의 왕이시여
  - 모든 능력 위의 왕이시여
  - 모든 권세의 왕이시여
  lexicon: βασιλεύς + κρατέω/κράτος
  rationale: κρατῶν의 넓은 의미를 살려 정치적 ‘나라’로 좁히지 않고 ‘권세’로 옮겼습니다. ‘위의’는 통치 위계의 의미를 자연스럽게 드러냅니다.
- source_word: ἐν ἐξουσίᾳ σου
  english_pob_choice: in your authority
  chosen_korean: 주님의 권위 아래 있으니
  alternatives_korean:
  - 주님의 권세 안에 있으니
  - 주님의 권능 아래 있으니
  - 주님의 권위 안에 있으니
  lexicon: ἐξουσία
  rationale: ἐξουσία는 단순한 힘보다 정당한 통치 권위를 가리키므로 ‘권위’가 가장 직접적입니다. 문맥상 상태를 나타내기 위해 ‘아래 있으니’로 풀었습니다.
- source_word: ὁ ἀντιδρῶσων σοι
  english_pob_choice: one who can oppose you
  chosen_korean: 주님을 거스를 수 있는 이
  alternatives_korean:
  - 주님께 맞설 수 있는 이
  - 주님께 대항할 수 있는 이
  - 주님을 대적할 수 있는 이
  lexicon: ἀντιδράω
  rationale: ‘거스르다’는 반대·대항의 의미를 담으면서도 기도문 문맥에서 지나치게 군사적이지 않게 표현합니다.
- source_word: ἐν τῷ θέλειν σε σῶσαι τὸν Ἰσραήλ
  english_pob_choice: when you desire to save Israel
  chosen_korean: 주님께서 이스라엘을 구원하시기를 원하실 때
  alternatives_korean:
  - 주님께서 이스라엘을 구원하고자 하실 때
  - 주님께서 이스라엘을 구하시려 할 때
  - 주님께서 이스라엘을 구원하시기를 바라실 때
  lexicon: θέλειν + σῶσαι
  rationale: articular infinitive의 시간/상황 값을 살려 ‘~하시기를 원하실 때’로 옮겼습니다. σῶσαι는 단순한 도움보다 구원 행위를 가리켜 ‘구원하다’를 택했습니다.
theological_decisions:
- issue: ‘Lord’의 한국어 호칭 선택
  chosen_reading: 주님
  alternative_readings:
  - 주여
  - 주
  rationale: 본문이 하나님께 드리는 직접 호칭이므로 존칭을 유지해야 하며, 표준 현대 한국어 예배 문체에서는 ‘주님’이 가장 자연스럽습니다.
  doctrine_reference: κύριος의 기본 번역을 ‘주님’으로 두는 POB 용례
- issue: ‘ἐξουσία’의 의미 범위
  chosen_reading: 권위
  alternative_readings:
  - 권세
  - 권능
  rationale: 문맥은 하나님의 정당한 통치와 주권을 강조하므로 단순 능력보다 ‘권위’가 더 적합합니다. 다만 ‘권세’와의 긴장은 일부 남겨 두어 통치적 뉘앙스를 보존했습니다.
  doctrine_reference: 원문의 주권 신학과 통치 어휘를 과도하게 평준화하지 않음
