base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/010.yaml
  text: Hear my petition and be merciful to your allotted people[a], and turn our mourning into gladness, so that, living, we may sing praise to your name, O Lord, and do not destroy the mouth of those who praise you. And all Israel cried out with all their strength[b], because their death was before their eyes.
  footnotes:
  - marker: a
    text: Or 'be gracious to your inheritance' / 'be propitious to your lot.' The Greek says literally 'be merciful to your lot.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'do not destroy the mouth of those who praise you,' an image for not silencing your worshipers.
    reason: lexical_alternative
translation:
  language: ko
  text: 제 간구를 들으시고, 당신의 백성에게 자비를 베풀어 주십시오[a]. 우리의 애통을 기쁨으로 바꾸시어, 우리가 살아서 주님의 이름을 찬양하게 하시고, 당신을 찬양하는 이들의 입을 없애지 마십시오[b]. 그리고 온 이스라엘이 온 힘을 다해 외쳤습니다. 그들의 죽음이 그들 눈앞에 있었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘당신의 몫’ 또는 ‘당신의 유업’입니다. 여기서는 하나님께 속한 이스라엘 백성을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘당신을 찬양하는 이들의 입을 없애지 마십시오’입니다. 찬양하는 이들을 없애거나 침묵시키지 말아 달라는 구체적 이미지입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κουσον τῆς δεήσεώς μου
  english_pob_choice: Hear my petition
  chosen_korean: 제 청원을 들으시고
  alternatives_korean:
  - 제 간구를 들어주십시오
  - 제 기도를 들으소서
  lexicon: BDAG
  rationale: δέησις는 일반적인 ‘기도’보다 절박한 요청의 뉘앙스가 있어 ‘청원’으로 옮기고, 기도문체에 맞게 직접적인 요청형으로 마무리했습니다.
- source_word: ἱλάσθητι τῷ κλήρῳ σου
  english_pob_choice: be merciful to your allotted people
  chosen_korean: 당신의 할당된 백성에게 은혜를 베푸소서
  alternatives_korean:
  - 당신의 기업에게 자비를 베푸소서
  - 당신의 몫에게 은혜를 베푸소서
  lexicon: BDAG
  rationale: κλῆρος의 핵심은 ‘할당된 몫/배분된 소유’이므로, 문맥상 이스라엘을 가리키는 점을 살려 ‘할당된 백성’으로 풀었습니다. ἱλάσθητι는 기술적 속죄어보다 ‘은혜를 베푸소서’가 기도문의 힘을 자연스럽게 전달합니다.
- source_word: στρέψον τὸ πένθος ἡμῶν εἰς εὐφροσύνην
  english_pob_choice: turn our mourning into gladness
  chosen_korean: 우리의 애통을 기쁨으로 바꾸시어
  alternatives_korean:
  - 우리의 슬픔을 즐거움으로 바꾸시어
  - 우리의 비탄을 기쁨으로 바꾸시어
  lexicon: BDAG
  rationale: 전환의 이미지를 살리면서 εὐφροσύνη의 밝은 정서를 현대 한국어에서 가장 자연스럽게 담기 위해 ‘기쁨’으로 옮겼습니다.
- source_word: μὴ ἀφανίσῃς στόμα αἰνούντων σου
  english_pob_choice: do not destroy the mouth of those who praise you
  chosen_korean: 당신을 찬양하는 이들의 입을 없애지 마소서
  alternatives_korean:
  - 당신을 찬양하는 이들의 입을 멸하지 마소서
  - 당신을 찬양하는 이들의 목소리를 끊지 마소서
  lexicon: BDAG
  rationale: στόμα를 문자적으로 ‘입’으로 살리되, 문맥상 침묵시키는 뜻이므로 한국어에서는 ‘없애다’로 옮겨 이미지와 의미를 함께 보존했습니다.
- source_word: ἐκέκραξαν ἐξ ἰσχύος αὐτῶν
  english_pob_choice: cried out with all their strength
  chosen_korean: 자기들의 힘을 다해 외쳤습니다
  alternatives_korean:
  - 온 힘을 다해 외쳤습니다
  - 힘껏 외쳤습니다
  lexicon: BDAG
  rationale: ἐξ ἰσχύος의 강한 외침을 한국어 관용으로 자연스럽게 표현하되, 집단적 긴박감을 유지했습니다.
- source_word: θάνατος αὐτῶν ἐν ὀφθαλμοῖς αὐτῶν
  english_pob_choice: because their death was before their eyes
  chosen_korean: 죽음이 자기들 눈앞에 있었기 때문입니다
  alternatives_korean:
  - 그들의 죽음이 눈앞에 있었기 때문입니다
  - 죽음이 눈에 보였기 때문입니다
  lexicon: BDAG
  rationale: 임박한 죽음의 가시적 위협을 드러내는 관용구로 보아 ‘눈앞에 있었다’는 직역-의역 균형을 취했습니다.
theological_decisions:
- issue: 기도문의 직접 화행과 하나님께 대한 호칭
  chosen_reading: 합쇼체 청원문으로 번역하고, 호칭은 ‘주님’으로 유지했습니다.
  alternative_readings:
  - 더 평서적인 서술형
  - ‘주님’ 대신 ‘야훼’ 사용
  rationale: 원문은 공동체의 간구이므로 한국어에서도 직접 청원체를 유지하는 것이 적합합니다. κύριε는 본문 전통상 ‘주님’이 가장 자연스럽고, 여기서는 히브리 본문 직인용이 아닌 그리스어 증언이므로 ‘야훼’로 돌리지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: κύριος → 주님; 기도문 번역의 직접성'
- issue: κλῆρος의 공동체적 의미
  chosen_reading: ‘당신의 할당된 백성’
  alternative_readings:
  - ‘당신의 몫’
  - ‘당신의 기업’
  rationale: 이 문맥에서 κλῆρος는 추상적 ‘몫’보다 하나님께 속한 언약 공동체를 가리키므로, 독자가 관계적 의미를 바로 이해하도록 풀어 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: κλῆρος 문맥적 번역'
