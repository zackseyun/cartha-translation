  rationale: βοηθός를 추상화하지 않고 인격적 ‘돕는 이’로 살렸으며, εἰ μὴ σέ의 배타성을 ‘외에는’으로 옮겼습니다.
theological_decisions:
- issue: 하나님을 왕으로 부르는 호칭
  chosen_reading: ‘우리의 왕이시여’로 직접 호칭을 살려, 하나님 주권과 이스라엘의 언약적 소속을 드러냈습니다.
  alternative_readings:
  - 우리의 왕
  - 우리 왕
  rationale: 본문은 단순 묘사가 아니라 기도 중 직접 호칭입니다. 따라서 호격을 살려 예배적·신학적 긴장을 보존했습니다.
  doctrine_reference: 하나님의 주권과 직접 호칭
- issue: σὺ εἶ μόνος의 압축된 표현
  chosen_reading: ‘오직 주님만이 유일하십니다’로 자연화하되, 단독성과 배타성을 유지했습니다.
  alternative_readings:
  - 주님만이 유일하십니다
  - 주님만이 홀로이십니다
  rationale: 헬라어의 다소 압축된 표현을 한국어에서 풀어 쓰되, ‘오직/만’으로 유일성의 초점을 유지했습니다.
  doctrine_reference: 문법적 긴장 보존과 의미 명료화
