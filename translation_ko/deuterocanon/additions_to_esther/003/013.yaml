translation:
  language: ko
  text: 그녀는 이스라엘의 하나님이신 주께 간청하며 말했습니다. 「내 주, 우리의 왕이시여, 오직 주님만이 유일하십니다. 저처럼 혼자이고 주님 외에는 돕는 이가 없는 저를 도와주십시오」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 매끄럽게는 “주님만이 유일하십니다.” 헬라어는 여기서 다소 생략적입니다.
    reason: lexical_alternative
