  text: 그녀는 이스라엘의 하나님이신 주께 간청하며 말했습니다. “내 주, 우리의 왕이시여, 주님만이 홀로 계십니다[a]. 혼자이며 주님 외에는 돕는 이가 없는 저를 도와주십시오.”
  philosophy: optimal-equivalence
