  rationale: ἀνάγκη는 필요, 필연, 압박, 곤경의 폭을 가지므로, 여기서는 기도문 맥락에서 절박한 처지를 드러내는 ‘곤경’이 가장 자연스럽고 source-근접합니다.
- source_word: βδελύσσομαι
