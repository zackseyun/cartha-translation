  lexicon: BDAG
  rationale: 반복되는 강한 거부감을 살리기 위해 ‘혐오합니다’를 선택했습니다. 현대 한국어에서 강도가 분명하면서도 과도하게 해석적이지 않습니다.
- source_word: σημεῖον τῆς ὑπερηφανίας μου
  english_pob_choice: the sign of my pride
  chosen_korean: 교만의 표
  alternatives_korean:
