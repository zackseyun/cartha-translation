  lexicon: BDAG
  rationale: Greek이 구체적 물건명을 말하지 않고 ‘표/징표’를 말하므로, 왕관으로 특정하지 않고 ‘표’로 두어 원문의 넓이를 유지했습니다.
- source_word: ὀπτασίας
  english_pob_choice: appearance
  chosen_korean: 나타나는 날들
  alternatives_korean:
  - 보이는 날들
  - 공적으로 나서는 날들
  - 출현하는 날들
  lexicon: LSJ
  rationale: 문맥상 환상보다 공개적으로 드러나는 때를 가리키므로, ‘나타나는 날들’로 옮겨 공적 출현의 뜻을 살렸습니다.
- source_word: ῥάκος καταμηνίων
  english_pob_choice: menstrual cloth / menstrual rag
  chosen_korean: 월경 천
  alternatives_korean:
  - 월경 걸레
  - 월경 누더기
  - 월경 헝겊
  lexicon: LSJ
  rationale: 원문의 노골적이고 혐오를 유발하는 비유를 완화하지 않으면서도, 합쇼체 본문에 맞는 비교적 문어적인 표현으로 옮겼습니다.
- source_word: ἡσυχίας
  english_pob_choice: rest
  chosen_korean: 쉬는 날들
  alternatives_korean:
  - 고요한 날들
  - 은둔의 날들
  - 쉼의 날들
  lexicon: BDAG
  rationale: ἡσυχία는 조용함, 쉼, 공적 활동의 부재를 뜻하므로, ‘쉬는 날들’이 ‘나타나는 날들’과의 대비를 가장 분명하게 드러냅니다.
