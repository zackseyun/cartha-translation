base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/026.yaml
  text: You know my distress[a], that I loathe the sign of my pride, which is upon my head in the days of my appearance; I loathe it like a menstrual cloth[e][d][c][b], and I do not wear it in the days of my rest.
  footnotes:
  - marker: a
    text: Or 'my distress' or 'my need' for 'my necessity.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'the sign of my pride' likely refers to Esther's royal head ornament or emblem of status; the Greek does not specify the exact item.
    reason: cultural_note
  - marker: c
    text: Or 'in the days when I appear'—that is, when she appears publicly or in court.
    reason: lexical_alternative
  - marker: d
    text: Greek 'like a rag of menstruation,' an intentionally graphic expression of revulsion.
    reason: lexical_alternative
  - marker: e
    text: Or 'in the days of my rest/privacy,' contrasting with her public appearances.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서는 저의 곤경[a]을 아십니다. 저는 제가 모습을 드러내는 날들[c]에 제 머리에 있는 제 교만의 표징[b]을 혐오합니다. 저는 그것을 월경 헝겊[d]처럼 혐오합니다. 그리고 고요히 지내는 날들[e]에는 그것을 쓰지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저의 필요’ 또는 ‘저의 절박한 처지’. 그리스어 ‘나의 필연/필요(ἀνάγκη)’에 대한 다른 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 이것이 정확히 무엇인지를 밝히지 않습니다. 에스더의 왕실 머리 장식 또는 신분의 표지를 가리킬 가능성이 있습니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘내가 나타나는 날들에’. 곧 그가 사람들 앞이나 궁정에 공개적으로 나서는 때를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 그리스어는 ‘월경의 헝겊처럼’이라고 하며, 의도적으로 강한 혐오감을 나타내는 표현입니다.
    reason: lexical_alternative
  - marker: e
    text: 또는 ‘내가 쉬거나 한적이 지내는 날들에’. 공개적으로 모습을 드러내는 때와 대조됩니다.
    reason: lexical_alternative
