translation:
  language: ko
  text: 그리고 이제 우리는 주님 앞에서 죄를 지었고, 주님께서는 우리를 우리 원수들의 손에 넘기셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ νῦν
  english_pob_choice: And now
  chosen_korean: 그리고 이제
  alternatives_korean:
  - 이제
  - 그리고 지금
  lexicon: BDAG
  rationale: 앞선 고백의 흐름을 살리면서 χρονικός 전환을 자연스럽게 드러내기 위해 ‘그리고 이제’로 옮겼습니다.
- source_word: ἡμάρτομεν ἐνώπιόν σου
  english_pob_choice: we have sinned before you
  chosen_korean: 주님 앞에서 죄를 지었고
  alternatives_korean:
  - 주님 앞에서 죄를 지었습니다
  - 주님 보시기에 죄를 지었고
  lexicon: BDAG
  rationale: ‘ἐνώπιόν σου’는 단순한 장소보다 하나님 앞의 관계적·심판적 지평을 가지므로 ‘주님 앞에서’로 살렸고, 고백문의 자연스러운 흐름을 위해 ‘죄를 지었고’로 표현했습니다.
- source_word: παρέδωκας
  english_pob_choice: you have handed us over
  chosen_korean: 넘기셨습니다
  alternatives_korean:
  - 넘겨주셨습니다
  - 내주셨습니다
  lexicon: BDAG
  rationale: 하나님이 심판으로 사람들을 타자의 지배 아래 두는 의미를 유지하면서, 현대 한국어에서 자연스럽고 직접적인 ‘넘기셨습니다’를 선택했습니다.
- source_word: εἰς χεῖρας τῶν ἐχθρῶν ἡμῶν
  english_pob_choice: into the hands of our enemies
  chosen_korean: 우리 원수들의 손에
  alternatives_korean:
  - 우리 원수들의 손안에
  - 우리의 원수들에게
  lexicon: BDAG
  rationale: 헬라어 관용구를 그대로 살려 ‘손에’로 옮겨, 통제권 아래로 넘어간다는 이미지를 보존했습니다.
theological_decisions:
- issue: 하나님의 직접적 심판 행위
  chosen_reading: 본문이 하나님을 직접 상대하는 2인칭으로 말하며, 원수들의 손에 넘기신 주체가 하나님임을 분명히 드러내도록 유지했습니다.
  alternative_readings:
  - 심판의 주체를 완화하는 간접 표현
  - 수동적으로만 옮겨 하나님의 행위를 희석하는 번역
  rationale: 그리스어가 παρέδωκας를 사용해 신적 행위를 직설적으로 진술하므로, 번역도 그 긴장을 약화하지 않도록 해야 합니다.
  doctrine_reference: 'DOCTRINE.md: 원문의 신학적 긴장을 보존하고, 번역 전통이 이를 희석하지 않도록 한다.'
