  chosen_reading: 본문이 하나님을 직접 상대하는 2인칭으로 말하며, 원수들의 손에 넘기신 주체가 하나님임을 분명히 드러내도록 유지했습니다.
  alternative_readings:
  - 심판의 주체를 완화하는 간접 표현
  - 수동적으로만 옮겨 하나님의 행위를 희석하는 번역
  rationale: 그리스어가 παρέδωκας를 사용해 신적 행위를 직설적으로 진술하므로, 번역도 그 긴장을 약화하지 않도록 해야 합니다.
  doctrine_reference: 'DOCTRINE.md: 원문의 신학적 긴장을 보존하고, 번역 전통이 이를 희석하지 않도록 한다.'
