translation:
  language: ko
  text: 주님, 기억해 주십시오. 우리 환난의 때에 자신을 드러내시고[a], 저에게 용기를 주십시오. 신들의 왕이시며[b] 모든 권세를 다스리시는 분이시여.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자신을 알리시고’, ‘알려지게 하시고’로 옮길 수 있습니다. 그리스어 γνώρισθητι는 여기서 여러 방식으로 해석될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘신들의 왕’입니다. 이 표현은 하나님이 모든 자칭 신과 통치 권세 위에 계심을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνήσθητι
  english_pob_choice: Remember
  chosen_korean: 기억해 주십시오
  alternatives_korean:
  - 기억하십시오
  - 기억하소서
  lexicon: BDAG
  rationale: 기도문에서의 청유적 ‘Remember’를 한국어의 직접적 호소로 옮겼습니다. ‘기억해 주십시오’는 합쇼체를 유지하면서도 간구의 뉘앙스를 자연스럽게 드러냅니다.
- source_word: γνώρισθητι
  english_pob_choice: make yourself known
  chosen_korean: 자신을 알리시고
  alternatives_korean:
  - 드러내시고
  - 알려지게 하시고
  lexicon: BDAG
  rationale: 수동/중간 힘을 가진 명령형을 ‘자신을 알리시고’로 옮겨, 하나님의 자기현현 요청을 살렸습니다.
- source_word: Βασιλεῦ τῶν θεῶν
  english_pob_choice: O King of the gods
  chosen_korean: 오, 신들의 왕이시며
  alternatives_korean:
  - 오, 신들 위의 왕이시며
  - 오, 모든 신적 존재들의 왕이시며
  lexicon: BDAG
  rationale: 그리스어의 직설적 표현을 완화하지 않고 살리기 위해 ‘신들의 왕’으로 옮겼습니다. 유대적 기도문 맥락에서 우상 신들/권세들 위의 절대적 우위를 드러냅니다.
- source_word: πάσης ἀρχῆς ἐπικρατῶν
  english_pob_choice: ruler over every authority
  chosen_korean: 모든 권위 위에 군림하시는 분이시여
  alternatives_korean:
  - 모든 권세를 다스리시는 분이시여
  - 모든 권위의 지배자이시여
  lexicon: BDAG
  rationale: ἀρχή의 ‘권위/권세’ 의미와 ἐπικρατέω의 ‘우위에 군림하다, 지배하다’를 함께 반영했습니다. ‘위에 군림하시는 분’은 수정 구문으로서 앞의 호칭을 풀어 주며 자연스럽습니다.
theological_decisions:
- issue: 신을 가리키는 복수 표현 τῶν θεῶν의 처리
  chosen_reading: ‘신들의 왕’으로 직역에 가깝게 유지합니다.
  alternative_readings:
  - ‘모든 신들 위의 왕’
  - ‘모든 신적 권세의 왕’
  rationale: 원문의 도발적이고 초월적인 호칭을 흐리지 않기 위해 완화 번역을 피했습니다. 이는 다신교 승인이라기보다, 하나님이 모든 자칭 신과 권세 위에 계심을 선포하는 표현입니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: 명령형 기도체의 존대 수준
  chosen_reading: 하나님께 직접 드리는 기도로서 ‘주님…하십시오’와 ‘이시여’를 사용합니다.
  alternative_readings:
  - 더 성경적 종결형 ‘-하소서’
  - 중립적 서술형
  rationale: 현대 합쇼체를 유지하면서도 기도문 특유의 직접 호소를 살리기 위한 선택입니다. 문체는 현대적이되, 하나님께 드리는 존중을 분명히 합니다.
  doctrine_reference: Korean target style guidelines
