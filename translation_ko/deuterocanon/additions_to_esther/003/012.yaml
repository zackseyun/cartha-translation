    rationale: ‘그녀의 기쁜 장식의 모든 자리’는 무엇의 자리인지, 머리카락이 무엇을 채우는지 자연스럽게 파악하기 어렵습니다. πάντα τόπον κόσμου ἀγαλλιάματος는 기쁨을 위해 꾸미던 몸의 모든 곳이라는 뜻으로 이해될 수 있으므로, 그 범위를 명시하는 편이 자연스럽습니다.
