base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/012.yaml
  text: And taking off her garments of glory[a], she put on garments of distress and mourning; and instead of splendid perfumes, she filled her head with ashes and dung, and she humbled her body greatly[c][b], and every place of her joyful adornment she filled with the twisting of her hair.
  footnotes:
  - marker: a
    text: Or 'instead of luxurious perfumes.' The Greek literally says 'proud perfumes,' likely referring to costly or ostentatious fragrances.
    reason: lexical_alternative
  - marker: b
    text: Or 'she covered her head with ashes and dung.' The Greek more literally says 'she filled her head.'
    reason: lexical_alternative
  - marker: c
    text: The final phrase is difficult. It may mean that the places once beautified for rejoicing were now marked by her hair left twisted or disheveled in mourning.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그녀는 자기 영광의 옷들을 벗고 고난과 애도의 옷을 입었습니다. 그리고 호화로운 향료[a] 대신 자기 머리에 재와 배설물을 채우고[c], 자기 몸을 크게 낮추었으며, 기쁨을 위해 꾸미던 모든 곳을 자기 머리카락의 꼬임으로 채웠습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘호화로운 향료’는 원문의 문자적 표현인 ‘교만한 향료들’을 문맥에 맞게 옮긴 것입니다. 값비싸고 과시적인 향품을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 구절은 뜻이 어렵습니다. ‘머리카락의 꼬임’은 머리카락을 꼬거나 뒤틀어 놓은 상태를 가리킬 수 있으며, 애도 중의 흐트러진 머리 모양을 뜻할 가능성도 있습니다.
    reason: alternative_reading
  - marker: c
    text: 원문은 문자적으로 ‘그녀가 자기 머리를 재와 배설물로 채웠다’라고 말합니다. ‘덮었다’로 옮길 수도 있으나, 여기서는 원문의 강한 표현을 유지했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἱμάτια τῆς δόξης αὐτῆς
  english_pob_choice: her garments of glory
  chosen_korean: 자기의 영광의 옷
  alternatives_korean:
  - 자기의 영광스러운 옷
  - 자기의 영광의 의복
  lexicon: LSJ
  rationale: δόξα를 추상적 '영광'으로 보존해 왕후의 지위와 외적 화려함을 함께 살렸고, '옷'으로 구체적 의복 이미지를 유지했습니다.
- source_word: ἱμάτια στενοχωρίας καὶ πένθους
  english_pob_choice: garments of distress and mourning
  chosen_korean: 고통과 슬픔의 옷
  alternatives_korean:
  - 환난과 애도의 옷
  - 곤고와 상주의 옷
  lexicon: LSJ
  rationale: στενοχωρία는 단순한 감정이 아니라 압박·고통의 상태를 가리킬 수 있어 '고통'으로, πένθος는 상실의 슬픔과 애도를 함께 담는 '슬픔'으로 옮겼습니다.
- source_word: ἀντὶ τῶν ὑπερηφάνων ἡδυσμάτων
  english_pob_choice: instead of proud perfumes
  chosen_korean: 화려한 향수 대신
  alternatives_korean:
  - 교만한 향수 대신
  - 사치스러운 향수 대신
  lexicon: LSJ
  rationale: ὑπερήφανος의 문자적 '교만한'은 향수에 그대로 붙이면 어색하므로, 문맥상 과시적·호화로운 장식을 가리키는 뉘앙스를 살려 '화려한'으로 자연스럽게 표현했습니다.
- source_word: σποδοῦ καὶ κοπριῶν
  english_pob_choice: ashes and dung
  chosen_korean: 재와 배설물
  alternatives_korean:
  - 재와 거름
  - 재와 오물
  lexicon: LSJ
  rationale: σποδός는 '재'이고 κόπρια는 문자적으로 배설물·거름이지만, 한국어 출판문맥에서는 '배설물'이 원문의 노골성을 유지하면서도 가장 직접적입니다.
- source_word: τὸ σῶμα ἐταπείνωσεν σφόδρα
  english_pob_choice: she humbled her body greatly
  chosen_korean: 자기 몸을 크게 낮추었으며
  alternatives_korean:
  - 자기 몸을 심하게 낮추었으며
  - 자기 몸을 크게 겸손하게 하였으며
  lexicon: LSJ
  rationale: ταπεινόω의 핵심은 '낮추다/자기 낮춤'이므로, 금욕 행위를 특정하지 않고 육체적 자기 비하의 의미를 자연스러운 합쇼체로 옮겼습니다.
- source_word: στρεπτῶν τριχῶν αὐτῆς
  english_pob_choice: the twisting of her hair
  chosen_korean: 머리카락의 꼬임
  alternatives_korean:
  - 뒤틀린 머리카락
  - 헝클어진 머리카락
  lexicon: LSJ
  rationale: 표현이 난해하므로 단정적으로 '헝클어진'이라고 해석하기보다, 원문의 '꼬임/뒤틀림'을 살려 주해 여지를 남겼습니다.
theological_decisions:
- issue: The intensity of Esther's mourning imagery
  chosen_reading: 재와 배설물, 몸을 크게 낮추는 표현을 완화하지 않고 그대로 살렸습니다.
  alternative_readings:
  - 재와 오물
  - 몸을 심하게 낮추다
  rationale: 이 절은 왕후의 장식과 대비되는 극단적 자기 비하를 드러내므로, 현대 독자의 불편함을 이유로 표현을 누그러뜨리면 본문의 효과가 약화됩니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: Difficult final phrase about her hair
  chosen_reading: '''머리카락의 꼬임''으로 보수적으로 옮겨, 의미를 단정하지 않았습니다.'
  alternative_readings:
  - 뒤틀린 머리카락
  - 헝클어진 머리카락
  rationale: 원문이 정확히 어떤 머리 모양을 뜻하는지 불확실하므로, 본문에서는 가능한 한 원어의 모호성을 보존하고 해석은 주석 여지로 남기는 것이 적절합니다.
  doctrine_reference: Translation philosophy §3
