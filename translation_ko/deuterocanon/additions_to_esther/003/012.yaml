  source_fidelity: 핵심 행위와 대조는 대체로 원문에 충실합니다. 그러나 ἡδύσματα는 일반적 ‘향수’보다 향료·향품을 가리키며, 마지막의 δύσ해한 구절은 현 번역처럼 ‘기쁜 장식의 모든 자리’라고 하면 한국어 의미 연결이 불명확합니다. ‘기쁨을 위해 꾸미던 모든 곳’으로 옮겨 원문의 모호성을 크게 줄이지 않으면서도 문장을 이해 가능하게 할 수 있습니다.
  naturalness: 현 문장은 ‘자기의 영광의 옷’, ‘그녀의 기쁜 장식의 모든 자리’가 현대 표준 한국어에서 부자연스럽습니다. 또한 각주 표지가 모두 문장 끝에 몰려 있어 해당 어구를 즉시 식별하기 어렵습니다. 표지를 관련 어구 뒤로 옮기는 것이 바람직합니다.
  terminology: ‘재와 배설물’은 κόπρια의 강한 표현을 적절히 유지합니다. στενοχωρία와 πένθος는 ‘고난과 애도’로 구분하면 의례적 애도의 뜻을 더 잘 드러냅니다. ὑπερηφάνων은 문맥상 ‘호화로운’으로 번역하되, 문자적 표현과 과시성은 각주에서 밝혀 두는 것이 적절합니다.
