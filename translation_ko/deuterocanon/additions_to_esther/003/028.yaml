base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/028.yaml
  text: And your slave has not rejoiced from the day of my change until now[a], except in you, Lord[b], God of Abraham.
  footnotes:
  - marker: a
    text: Or 'your servant.' The Greek has the feminine form of 'slave/servant' (δούλη), a humble self-designation before God.
    reason: lexical_alternative
  - marker: b
    text: Or 'from the day of my reversal' or 'since my circumstances changed.' The Greek phrase leaves the exact nature of the 'change' unstated.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 당신의 종은 제가 변한 날로부터 지금까지 기뻐한 적이 없었습니다[a], 오직 당신 안에서만, 주님[b], 아브라함의 하나님이십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제가 변한 날부터’ ‘제 사정이 바뀐 날부터’로도 옮길 수 있습니다. 그리스어 μεταβολή는 여기서 변화의 구체적 성격을 밝히지 않습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘당신에게서만’으로도 옮길 수 있습니다. 그리스어 ἐπὶ σοί는 예외의 근거를 하나님께 두는 뉘앙스를 지닙니다.
    reason: alternative_reading
lexical_decisions:
- source_word: δούλη
  english_pob_choice: slave
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 여종
  - 시녀
  lexicon: BDAG
  rationale: 여성형이라도 이 본문에서는 하나님 앞의 낮은 자기호칭이므로, 프로젝트 기본값에 따라 “종”으로 옮겨 자기 비하와 종속성을 살렸습니다.
- source_word: ηὐφράνθη
  english_pob_choice: has not rejoiced
  chosen_korean: 기뻐한 적이 없었습니다
  alternatives_korean:
  - 기뻐하지 않았습니다
  - 즐거워한 적이 없었습니다
  lexicon: BDAG
  rationale: 기쁨/환희의 상태를 자연스러운 현대 한국어로 풀어, 단순한 감정 부재를 넘어 ‘기뻐함’의 부재를 드러냈습니다.
- source_word: ἀφʼ ἡμέρας μεταβολῆς μου
  english_pob_choice: from the day of my change
  chosen_korean: 제가 변한 날로부터
  alternatives_korean:
  - 제 변화의 날부터
  - 제가 뒤바뀐 날로부터
  - 제 사정이 바뀐 날부터
  lexicon: LSJ
  rationale: μεταβολή의 구체적 성격을 본문이 밝히지 않으므로, 의미를 특정하지 않고 “변한”으로 간결하게 유지했습니다.
- source_word: πλὴν ἐπὶ σοί
  english_pob_choice: except in you
  chosen_korean: 오직 당신 안에서만
  alternatives_korean:
  - 당신 외에는
  - 당신을 제외하고는
  - 당신에게서만
  lexicon: BDAG
  rationale: 예외와 근거의 뉘앙스를 함께 살려, 기쁨의 근거가 하나님 자신뿐이라는 점을 한국어로 분명히 했습니다.
theological_decisions:
- issue: 하나님께 드리는 직접 호칭의 존칭 처리
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 주인
  rationale: 본문의 Κύριε는 하나님께 직접 부르는 호격이므로, 한국어 합쇼체에서 자연스럽고 경건한 ‘주님’을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: divine address and register conventions'
- issue: δούλη의 자기비하적 예우 보존
  chosen_reading: 종
  alternative_readings:
  - 여종
  - 시녀
  - 하녀
  rationale: 본문의 낮아진 자기호칭을 완화하지 않기 위해 ‘종’을 유지했습니다. 이는 신분적 종속을 강조하려는 본문의 정서를 보존합니다.
  doctrine_reference: 'DOCTRINE.md: contested terms table for δοῦλος/δούλη'
