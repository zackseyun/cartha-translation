  source_fidelity: 수정이 필요합니다. δούλη는 여성형이므로 ‘여종’으로 밝혀야 하며, ‘제가 변한 날’은 μεταβολή가 가리키는 ‘나의 변화’를 화자 자신이 변한 일로 다소 부자연스럽고 좁게 바꿉니다. 또한 마지막 호격 ‘주님, 아브라함의 하나님’은 서술문 ‘하나님이십니다’가 아니라 직접 부름으로 옮겨야 합니다.
  naturalness: 현 문장은 ‘오직 당신 안에서만, 주님[b], 아브라함의 하나님이십니다’가 문법적으로 연결되지 않습니다. ‘주님의 여종’, ‘주님 안에서만’, ‘아브라함의 하나님이시여’는 현대의 정중한 성경 문체에서 더 자연스럽고 명료합니다.
  terminology: Κύριε는 ‘주님’, ὁ θεὸς Ἀβραάμ은 호격을 살린 ‘아브라함의 하나님이시여’로 옮깁니다. δούλη의 여성형과 겸손한 자기 호칭을 함께 보존하여 ‘여종’으로 옮깁니다. μεταβολή는 구체적 내용이 불명확하므로 ‘제 변화’로 유지합니다.
  issues:
