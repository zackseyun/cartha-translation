    rationale: 그리스어 Κύριε ὁ θεὸς Ἀβραάμ은 모두 하나님께 드리는 호격입니다. ‘아브라함의 하나님이십니다’는 문법상 진술로 바꾸고, 앞 절과도 비문으로 연결됩니다.
