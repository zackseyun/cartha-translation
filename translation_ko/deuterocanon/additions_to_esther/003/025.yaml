  lexicon: BDAG
  rationale: 형용사 복수의 암시된 인물을 한국어에서는 명시해야 하므로 "자들"을 보충하되, 원문의 집단적 표지를 유지했습니다.
- source_word: παντὸς ἀλλοτρίου
