  lexicon: BDAG
  rationale: κοίτη의 기본 이미지를 살리면서도 한국어에서 더 자연스럽게 읽히는 "침상"을 사용해, 원문의 은유를 과도하게 풀지 않았습니다.
- source_word: ἀπεριτμήτων
