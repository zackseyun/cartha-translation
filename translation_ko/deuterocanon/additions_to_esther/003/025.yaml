translation:
  language: ko
  text: 그리고 당신은 내가 율법 없는 자들의 영광을 미워하고, 할례받지 않은 자들과 모든 이방인의 침상을 혐오함을 알고 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘침상’은 ‘혼인 침상’이나 ‘성적 결합’을 가리키는 완곡 표현일 수 있습니다.
    reason: lexical_alternative
