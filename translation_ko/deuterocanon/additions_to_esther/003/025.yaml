  lexicon: BDAG
  rationale: aorist의 과거 진술로 이해하되, 기도문 맥락에서 한국어는 자연스러운 현재적 연결형으로도 읽히므로 "미워하고"로 옮겨 강한 반감을 보존했습니다.
