translation:
  language: ko
  text: 그리고 당신은 내가 율법 없는 자들의 영광을 미워했으며, 할례받지 않은 자들의 침상과 모든 이방인의 침상을 혐오한다는 것을 알고 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘침상’은 ‘혼인 침상’이나 ‘성적 결합’을 가리키는 완곡한 표현일 수 있습니다.
    reason: lexical_alternative
