  text: And you know that I hated the glory of the lawless[a], and I abhor the bed of the uncircumcised and of every foreigner.
  footnotes:
  - marker: a
    text: Or 'the marriage bed' or 'sexual union'; the Greek 'bed' can stand metonymically for marital or sexual relations.
