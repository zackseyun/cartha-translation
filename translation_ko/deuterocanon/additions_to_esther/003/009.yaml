  rationale: 본문은 반사대명사와 속량 동사를 함께 써서 ‘자기 자신을 위한 소유/귀속’을 강조하므로, 이를 완화하지 않고 문장 안에 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
