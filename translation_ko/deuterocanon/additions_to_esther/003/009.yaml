  - 구원한 것입니다
  lexicon: LSJ
  rationale: λυτρόω의 핵심은 ‘값을 치르고 건져내다, 속량하다’이므로, 단순한 ‘구원하다’보다 구속·속량의 뉘앙스를 살렸습니다.
- source_word: ἐκ γῆς Αἰγύπτου
  english_pob_choice: out of the land of Egypt
  chosen_korean: 이집트 땅에서
  alternatives_korean:
