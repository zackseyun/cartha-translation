lexical_decisions:
- source_word: μὴ ὑπερίδῃς
  english_pob_choice: Do not overlook
  chosen_korean: 무시하지 마십시오
  alternatives_korean:
  - 간과하지 마십시오
  - 외면하지 마십시오
  - 못 본 척하지 마십시오
  lexicon: LSJ
  rationale: ὑπεροράω는 ‘대수롭지 않게 여기다, 못 본 척하다, 무시하다’의 뜻을 가지므로, 간청/기도 문맥에 맞는 현대 한국어로 가장 직접적인 금지를 살렸습니다.
- source_word: τὴν μερίδα σου
  english_pob_choice: your portion
  chosen_korean: 저의 몫
  alternatives_korean:
  - 당신의 몫
  - 당신의 분깃
  - 당신의 유산
  lexicon: LSJ
  rationale: μερίς는 ‘몫, 분깃, 몫으로 주어진 것’을 뜻하므로, 한국어에서는 소유격을 앞세운 ‘저의 몫’이 출애굽적 소속과 언약적 소유의 뉘앙스를 자연스럽게 드러냅니다.
- source_word: ἐλυτρώσω
  english_pob_choice: I redeemed
  chosen_korean: 속량한 것입니다
  alternatives_korean:
  - 구속한 것입니다
  - 속전으로 건져낸 것입니다
  - 구원한 것입니다
  lexicon: LSJ
  rationale: λυτρόω의 핵심은 ‘값을 치르고 건져내다, 속량하다’이므로, 단순한 ‘구원하다’보다 구속·속량의 뉘앙스를 살렸습니다.
- source_word: ἐκ γῆς Αἰγύπτου
  english_pob_choice: out of the land of Egypt
  chosen_korean: 이집트 땅에서
  alternatives_korean:
  - 이집트 땅으로부터
  - 이집트에서
  - 이집트 땅 밖으로
  lexicon: LSJ
  rationale: 출애굽 공식어구이므로 ‘이집트 땅에서’로 간명하게 옮기되, 원문의 공간적 출발점을 유지했습니다.
theological_decisions:
- issue: σεαυτῷ와 ἐλυτρώσω의 주체-대상 관계
  chosen_reading: ‘제가 … 저의 몫을 … 제 자신을 위해 속량한 것입니다’로, 하나님이 이스라엘을 자기 소유로 삼으신 관계를 직접적으로 살렸습니다.
  alternative_readings:
  - ‘당신을 위해 속량한 것입니다’
  - ‘당신의 소유로 속량한 것입니다’
  rationale: 본문은 반사대명사와 속량 동사를 함께 써서 ‘자기 자신을 위한 소유/귀속’을 강조하므로, 이를 완화하지 않고 문장 안에 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
