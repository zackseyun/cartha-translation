  lexicon: LSJ
  rationale: ὑπεροράω는 ‘대수롭지 않게 여기다, 못 본 척하다, 무시하다’의 뜻을 가지므로, 간청/기도 문맥에 맞는 현대 한국어로 가장 직접적인 금지를 살렸습니다.
- source_word: τὴν μερίδα σου
  english_pob_choice: your portion
  chosen_korean: 저의 몫
  alternatives_korean:
  - 당신의 몫
  - 당신의 분깃
  - 당신의 유산
  lexicon: LSJ
  rationale: μερίς는 ‘몫, 분깃, 몫으로 주어진 것’을 뜻하므로, 한국어에서는 소유격을 앞세운 ‘저의 몫’이 출애굽적 소속과 언약적 소유의 뉘앙스를 자연스럽게 드러냅니다.
- source_word: ἐλυτρώσω
  english_pob_choice: I redeemed
  chosen_korean: 속량한 것입니다
  alternatives_korean:
