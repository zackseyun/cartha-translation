  text: 그리고 민족들이 헛된 것들을 찬양하도록 그들의 입을 열게 하고[a], 육신으로 된 왕이 영원히 찬탄을 받게 하려는 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘헛된 것들의 탁월함을 찬양하도록’ 또는 ‘헛된 것들의 찬양을 하도록’으로 옮길 수 있습니다. 그리스어는 더 문자적으로 ‘헛된 것들의 탁월함들을 향하여’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘육신의 왕’, ‘죽을 수밖에 없는 왕’ 또는 ‘단지 인간인 왕’으로 옮길 수 있습니다. 그리스어는 문자적으로 ‘육신으로 된 왕’입니다.
    reason: lexical_alternative
