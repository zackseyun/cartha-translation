theological_decisions:
- issue: ματαίων의 우상성 여부를 한국어 본문에 얼마나 드러낼지
  chosen_reading: 헛된 것들
  alternative_readings:
  - 우상들
  - 헛된 우상들
  - 헛된 것들
  rationale: 영어 POB가 최종적으로 ‘worthless things’ 계열을 유지한 점을 따라, 본문에서는 과잉 해석을 피하고 더 직접적인 의미를 유지했습니다. 우상적 뉘앙스는 ‘찬양’과 전체 문맥이 드러냅니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: σάρκινον을 인간성의 대비로 어떻게 표현할지
  chosen_reading: 한 육신의 왕
  alternative_readings:
  - 한 육신적인 왕
  - 한 인간 왕
  - 한 죽을 왕
  rationale: 본문의 신학적 긴장은 ‘하나님과 달리 육신에 속한 왕’이라는 대비에 있으므로, 이를 완화하지 않고 직역에 가깝게 유지했습니다.
  doctrine_reference: Translation philosophy §1, §5
