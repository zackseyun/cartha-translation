translation:
  language: ko
  text: 그리고 민족들의 입을 열어 헛된 것들의 찬양으로 가득하게 하며, 한 육신의 왕이 영원히 찬탄을 받게 하려 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘헛된 것들의 탁월함’이나 ‘헛된 것들의 찬양’으로도 옮길 수 있습니다. 그리스어는 더 문자적으로는 ‘~을 향하여/속으로 헛된 것들의 탁월함’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘육신의 왕’, ‘단지 인간인 왕’으로도 옮길 수 있습니다. 그리스어는 문자적으로 ‘육신으로 된 왕’입니다.
    reason: lexical_alternative
