  source_fidelity: 개정이 필요합니다. 초안의 ‘찬양으로 가득하게 하며’는 στόμα를 ‘가득하게 하다’로 확장하며, ‘하려 합니다’는 원문에 없는 1인칭 의도 표현을 도입합니다. 원문의 두 부정사는 목적/결과의 병렬을 유지하도록 옮기는 것이 적절합니다. ματαίων은 문맥상 우상성을 시사할 수 있으나 본문에서 ‘헛된 것들’로 보존하는 것이 안전합니다.
  naturalness: ‘한 육신의 왕’은 현대 표준 한국어에서 부자연스럽고 의미가 불분명할 수 있습니다. ‘육신으로 된 왕’은 σάρκινον의 구체적 비유를 유지하면서 자연스럽습니다. ‘민족들이 헛된 것들을 찬양하도록 그들의 입을 열게 하고’는 한국어의 목적 관계를 명확히 합니다.
