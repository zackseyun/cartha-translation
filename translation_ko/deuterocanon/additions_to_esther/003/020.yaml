  text: and to open the mouth of the nations to the praises of worthless things[b][a], and for a fleshly king to be marveled at forever.
  footnotes:
  - marker: a
    text: Or 'for the excellencies of worthless things' or 'for the praises of vanities.' The Greek is more literally 'into/toward the excellencies of worthless things.'
