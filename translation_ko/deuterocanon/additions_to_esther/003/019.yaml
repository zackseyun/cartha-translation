translation:
  language: ko
  text: 주님의 입에서 나온 명령을 없애고[a] 주님의 기업을 멸하며[b], 주님을 찬양하는 이들의 입을 막고[c] 주님의 집[d]과 주님의 제단의 영광을 꺼 버리려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘명령’은 그리스어로 정해진 결정이나 명령을 뜻합니다. 달리 ‘법령’ 또는 ‘판결’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘기업’은 하나님께 속한 백성이나 소유를 가리킬 수 있으나, 본문은 그 대상을 명시하지 않습니다.
    reason: cross_reference
  - marker: c
    text: 직역하면 ‘주님을 찬양하는 이들의 입을 막고’입니다. 달리 ‘주님을 찬양하는 이들을 잠잠하게 하고’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘집’은 문맥상 성전을 가리킬 가능성이 크지만, 그리스어 본문은 단지 ‘집’이라고 합니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἐξᾶραι ὁρισμὸν στόματός σου
  english_pob_choice: to remove the decree from your mouth
  chosen_korean: 왕의 입에서 나온 조서를 없애고
  alternatives_korean:
  - 당신의 입에서 조서를 제거하고
  - 당신의 입에서 나온 법령을 없애고
  lexicon: LSJ
  rationale: ὁρισμός는 여기서 권위 있는 결정·조서를 가리키므로 ‘조서’로 옮기고, ἐξᾶραι의 ‘없애다’는 의미를 자연스럽게 살렸습니다. 원문의 ‘mouth’ 이미지는 한국어에서 ‘입에서 나온’으로 유지했습니다.
- source_word: κρονομίαν σου
  english_pob_choice: your inheritance
  chosen_korean: 당신의 기업
  alternatives_korean:
  - 당신의 유산
  - 당신의 상속
  lexicon: LSJ
  rationale: 성경적 언어에서 κληρονομία는 단순 재산보다 하나님께 속한 몫·백성을 가리키므로, covenant적 뉘앙스를 살리는 ‘기업’이 가장 적절합니다.
- source_word: ἐμφράξαι στόμα αἰνούντων σοι
  english_pob_choice: to shut the mouth of those who praise you
  chosen_korean: 당신을 찬양하는 자들의 입을 막고
  alternatives_korean:
  - 당신을 찬양하는 이들의 입을 닫게 하고
  - 당신을 찬양하는 자들의 입을 막아
  lexicon: LSJ
  rationale: ἐμφράξαι는 문자적으로 ‘막다’이므로 ‘입을 막고’로 옮겨 직유적 표현을 유지했습니다. αἰνούντων σοι는 ‘당신을 찬양하는 자들’로 풀어 참여적 현재분사의 힘을 살렸습니다.
- source_word: σβέσαι δόξαν οἴκου σου καὶ θυσιαστήριόν σου
  english_pob_choice: to extinguish the glory of your house and your altar
  chosen_korean: 당신의 집과 당신의 제단의 영광을 꺼버리게 하려는 것입니다
  alternatives_korean:
  - 당신의 집과 당신의 제단의 영광을 끄게 하려는 것입니다
  - 당신의 집과 당신의 제단의 영광을 소멸하게 하려는 것입니다
  lexicon: LSJ
  rationale: σβέσαι는 불을 끄듯 ‘꺼버리다’가 가장 생생하며, δόξα는 여기서 ‘영광’이 자연스럽습니다. οἶκος는 본문대로 ‘집’으로 두어, 문맥상 성전임은 독자가 파악하도록 했습니다.
theological_decisions:
- issue: ‘당신의 집’의 지시 대상
  chosen_reading: 본문은 ‘집’으로 직역하고, 성전이라는 해석은 본문 바깥에서 드러나게 두었습니다.
  alternative_readings:
  - 당신의 성전
  - 당신의 집, 곧 성전
  rationale: 그리스어가 단지 οἶκος를 쓰므로 해석어를 본문에 미리 넣지 않고, 원문의 긴장을 보존했습니다.
  doctrine_reference: Original-language primacy over translation tradition.
- issue: ‘당신의 기업’의 범위
  chosen_reading: 범위를 특정하지 않고 covenant적 표현을 유지했습니다.
  alternative_readings:
  - 당신의 백성
  - 당신의 소유
  rationale: 문맥상 하나님께 속한 백성을 가리킬 가능성이 크지만, 본문 자체는 범위를 명시하지 않으므로 ‘기업’으로 남겨 신학적 함의를 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
