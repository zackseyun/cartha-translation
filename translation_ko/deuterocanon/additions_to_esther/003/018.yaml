lexical_decisions:
- source_word: οὐχ ἱκανώθησαν
  english_pob_choice: were not satisfied
  chosen_korean: 만족하지 않고
  alternatives_korean:
  - 충분하다고 여기지 않고
  - 족하다고 여기지 않고
  lexicon: LSJ
  rationale: 부정 과거 수동형이 이전의 고통으로도 충분치 않았음을 나타내므로, 현대 한국어에서는 자연스러운 ‘만족하지 않고’로 옮겼습니다.
- source_word: ἐν πικρασμῷ
  english_pob_choice: with the bitterness / bitter oppression
  chosen_korean: 쓰라림
  alternatives_korean:
  - 쓴 학대
  - 비참한 학대
  - 쓰라린 고통
  lexicon: LSJ
  rationale: πικρασμός는 ‘쓴맛, 쓰라림, 쓰라리게 하는 처우’의 뉘앙스를 가지므로, 해석을 덜어내고 감각적·정서적 강도를 살린 ‘쓰라림’으로 옮겼습니다.
- source_word: δουλείας ἡμῶν
  english_pob_choice: of our slavery
  chosen_korean: 우리의 종살이
  alternatives_korean:
  - 우리의 노예 상태
  - 우리의 예속
  - 우리의 속박
  lexicon: LSJ
  rationale: δουλεία의 핵심은 종속된 상태이므로, 본문이 말하는 국민적 억압을 살리면서도 직접성을 유지하는 ‘종살이’를 택했습니다.
- source_word: ἔθηκαν τὰς χεῖρας αὐτῶν
  english_pob_choice: have laid their hands upon us
  chosen_korean: 우리에게 손을 얹었습니다
  alternatives_korean:
  - 우리에게 손을 댔습니다
  - 우리에게 손을 폈습니다
  - 우리에게 손을 뻗었습니다
  lexicon: LSJ
  rationale: 직역하면 ‘그들의 손을 두었다’이지만, 문맥상 적대적 행동을 가리키는 관용구이므로 의미를 드러내되 원문 이미지를 보존하는 표현으로 옮겼습니다.
