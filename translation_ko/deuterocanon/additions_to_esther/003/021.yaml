  - 주님이여
  lexicon: κύριος
  rationale: 기도문의 직접 호칭이므로 한국어 합쇼체의 자연스러운 직접 호칭인 주님을 택했고, 고어적 주여는 피했습니다.
- source_word: τὸ σκῆπρόν σου
  english_pob_choice: your scepter
  chosen_korean: 당신의 홀
  alternatives_korean:
