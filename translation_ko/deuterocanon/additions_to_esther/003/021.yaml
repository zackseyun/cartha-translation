  lexicon: σκῆπτρον
  rationale: 왕권의 상징인 홀 이미지를 유지해야 하므로 ‘홀’로 옮겼고, 문자적·상징적 대응을 살리기 위해 소유격을 분명히 했습니다.
- source_word: τοῖς μὴ οὖσιν
  english_pob_choice: to those who are not
  chosen_korean: 아무것도 아닌 자들
  alternatives_korean:
  - 존재하지 않는 자들
  - 없는 자들
  - 무가한 자들
  lexicon: μὴ οὖσιν
  rationale: 단순한 부정 존재가 아니라 수사적으로 ‘아무것도 아닌 존재’로 낮추는 강한 표현이므로, 그 경멸적 뉘앙스를 드러냈습니다.
- source_word: παραδειγμάτισον
  english_pob_choice: make an example / expose publicly
  chosen_korean: 사람들 앞에서 본보기로 삼아 주소서
  alternatives_korean:
  - 공개적으로 드러내 주소서
  - 본보기로 드러내 주소서
  - 조롱거리가 되게 하소서
  lexicon: παραδειγματίζω
  rationale: ‘공개적 노출’과 ‘본보기로 삼음’의 의미를 함께 살리되, 기도문 문맥에 맞게 간결하게 옮겼습니다.
theological_decisions:
- issue: 기도문에서의 직접 청원 어조와 왕권 상징 유지
  chosen_reading: 주님께 대한 직접 청원을 합쇼체로 유지하면서, ‘홀’ 이미지를 통해 하나님 통치의 상징을 보존했습니다.
  alternative_readings:
  - 보다 완곡한 서술형으로 바꾸는 번역
  - ‘지팡이’처럼 일반 물건으로 완화하는 번역
  rationale: 이 절은 예배적 탄원으로서의 긴박함이 핵심이므로 직접 호칭과 왕권 상징을 약화시키지 않았습니다.
  doctrine_reference: 시편적 탄원 기도, 하나님의 주권
- issue: ‘우리의 몰락’과 ‘그들이 비웃지 못하게’의 재앙 회피
  chosen_reading: 원문의 수치·조롱 방지를 그대로 살려 공동체의 위기를 신학적으로 ‘몰락’으로 번역했습니다.
  alternative_readings:
  - ‘우리의 실패’
  - ‘우리의 패배’
  rationale: πτῶσις는 단순 실패보다 실제 붕괴와 추락의 이미지를 띠므로, 공동체적 재난의 무게를 보존했습니다.
  doctrine_reference: 공동체적 수치와 구원 요청
