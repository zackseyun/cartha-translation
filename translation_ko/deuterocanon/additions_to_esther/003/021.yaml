  doctrine_reference: 시편적 탄원 기도, 하나님의 주권
- issue: ‘우리의 몰락’과 ‘그들이 비웃지 못하게’의 재앙 회피
  chosen_reading: 원문의 수치·조롱 방지를 그대로 살려 공동체의 위기를 신학적으로 ‘몰락’으로 번역했습니다.
  alternative_readings:
