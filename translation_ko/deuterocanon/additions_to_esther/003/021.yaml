  source_fidelity: ‘아무것도 아닌 자들’은 문맥상 가능한 해석이지만, τοῖς μὴ οὖσιν의 문자적이고 의도적으로 거친 ‘존재하지 않는 자들’이라는 표현을 본문에서 해석적으로 확정합니다. 또한 ‘우리의 몰락을 보고’는 ἐν τῇ πτώσει ἡμῶν(‘우리의 쓰러짐/몰락을 두고’)보다 다소 원인·시각 관계를 구체화합니다. 이를 더 직접적으로 조정했습니다. ‘우리에게 맞서 먼저 나선 자’는 ἀρξάμενον ἐφʼ ἡμᾶς의 공격 대상을 보존하면서, 원문에 명시되지 않은 ‘공격’을 보충하지 않습니다.
  naturalness: 수정문은 현대 표준어 합쇼체 기도문으로 자연스럽습니다. ‘왕홀’은 단독의 ‘홀’보다 왕권의 상징을 한국어 독자에게 명료하게 전달하며, ‘본보기로 삼아 주소서’는 공적 징계·경고의 함의를 과도하게 구체화하지 않고 유지합니다.
