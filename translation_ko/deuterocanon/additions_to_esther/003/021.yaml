  text: Do not hand over your scepter[a], Lord, to those who do not exist, and do not let them gloat over our downfall; instead, turn their plan against them, and make an example of the one who began this attack against us.
  footnotes:
  - marker: a
    text: Or 'to nonentities' or 'to those who are nothing.' The Greek literally says 'to those who do not exist.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 당신의 왕홀을 존재하지 않는 자들에게 넘겨주지 마시고, 우리가 쓰러진 것을 두고 그들이 조롱하지 못하게 하소서. 오히려 그들의 계획을 그들 자신에게 돌리시고, 우리에게 맞서 먼저 나선 자를 본보기로 삼아 주소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어를 직역하면 ‘존재하지 않는 자들에게’입니다. 문맥상 ‘아무것도 아닌 자들’ 또는 ‘무가치한 자들’이라는 경멸적 표현으로 이해할 수도 있습니다.
    reason: lexical_alternative
