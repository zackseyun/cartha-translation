  text: Do not hand over your scepter[a], Lord, to those who do not exist, and do not let them gloat over our downfall; instead, turn their plan against them, and make an example of the one who began this attack against us.
  footnotes:
  - marker: a
    text: Or 'to nonentities' or 'to those who are nothing.' The Greek literally says 'to those who do not exist.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 당신의 홀을 아무것도 아닌 자들에게 넘겨주지 마시고, 우리의 몰락을 보고 그들이 비웃지 못하게 하소서. 오히려 그들의 계획을 그들 자신에게 되돌려 주시고, 우리를 치기 시작한 자를 사람들 앞에서 본보기로 삼아 주소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아무것도 아닌 자들’은 직역보다 강한 수사적 해석으로, 헬라어의 경멸적 부정 존재 표현을 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
