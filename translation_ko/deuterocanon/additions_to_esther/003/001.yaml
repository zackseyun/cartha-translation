  alternative_readings:
  - ‘주께 기도하며’
  - ‘주님의 모든 일을 생각하며’
  rationale: 본문은 기도와 기억을 병렬로 배치하여, 과거의 구원 행위를 근거로 현재의 간구를 드리는 구조를 보여 줍니다. 이 연결을 약화하지 않기 위해 반복을 보존했습니다.
