lexical_decisions:
- source_word: ῥῦσαι
  english_pob_choice: rescue
  chosen_korean: 구원하시고
  alternatives_korean:
  - 건져내시고
  - 구해 주시고
  lexicon: BDAG
  rationale: 위험에서 건져 달라는 간구이므로 '구원하시고'가 간결하면서도 본문의 긴급성을 잘 살립니다.
- source_word: ἐν χειρί σου
  english_pob_choice: by your hand
  chosen_korean: 주님의 손으로
  alternatives_korean:
  - 주님의 손에 의해
  - 주님의 손을 통하여
  lexicon: LEH
  rationale: 손이 행위의 도구라는 관용을 한국어에서도 자연스럽게 살리기 위해 '손으로'를 택했습니다.
- source_word: τῇ μόνῃ καὶ μὴ ἔχουσῃ εἰ μὴ σέ
  english_pob_choice: who am alone and have no one except you
  chosen_korean: 홀로 있어 오직 주님 외에는 아무도 없는 저를
  alternatives_korean:
  - 홀로 있고 주님 외에는 아무도 없는 저를
  - 혼자이며 주님 외에는 아무도 없는 저를
  lexicon: LSJ/BDAG
  rationale: 여성 단수 분사구문이 화자 자신을 설명하므로, 두 조건을 한 사람에 대한 설명으로 풀어 한국어 어순에 맞게 옮겼습니다.
- source_word: πάντων γνῶσιν ἔχεις
  english_pob_choice: You have knowledge of all things
  chosen_korean: 주님께서는 모든 것을 아십니다
  alternatives_korean:
  - 주님께서는 만물을 아십니다
  - 주님께서는 모든 것의 지식을 가지십니다
  lexicon: LEH
  rationale: 직역하면 '지식을 가지십니다'이지만, 한국어에서는 '모든 것을 아십니다'가 같은 의미를 더 자연스럽고 품위 있게 드러냅니다.
