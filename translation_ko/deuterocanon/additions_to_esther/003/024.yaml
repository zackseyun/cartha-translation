  naturalness: 수정문은 현대 표준어 합쇼체 기도문으로 자연스럽습니다. ‘홀로 있으며 주님 외에는 아무도 없는 저’는 여성 단수의 자기 설명을 한국어에서 무리 없이 표현하며, 호격 ‘주님’도 원문의 위치와 기능을 살립니다.
