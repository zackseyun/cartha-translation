  text: 모든 것 위에 강하신 하나님, 희망을 잃은 이들의 목소리를 들으시고, 악을 행하는 자들의 손에서 우리를 구해 주시고, 제 두려움에서 저를 구해 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
