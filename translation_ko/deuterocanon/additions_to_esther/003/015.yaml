  rationale: γενετή의 출생/탄생 의미를 반영하면서도 현대 한국어에서 가장 자연스럽고 유려한 표현으로 옮겼습니다.
- source_word: ἐν φυλῇ πατριάς μου
  english_pob_choice: in the tribe of my ancestral family
  chosen_korean: 내 조상의 집안 지파에서
  alternatives_korean:
  - 내 조상 가문의 지파에서
