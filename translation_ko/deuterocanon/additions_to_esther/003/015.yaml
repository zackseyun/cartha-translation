translation:
  language: ko
  text: 나는 태어날 때부터, 내 조상의 집안 지파에서 들었습니다. 곧 주님, 주님께서 이스라엘을 모든 민족들 가운데서, 그리고 우리 조상들을 그들의 모든 선조들 가운데서 영원한 기업으로 취하셨고, 또 그들에게 말씀하신 대로 행하셨다는 것을 들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '그들에게 말씀하신 것을 행하셨다'입니다. POB는 이를 '말씀하신 대로 행하셨다'로 자연스럽게 풀었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ ἤκουον
