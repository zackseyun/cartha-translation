  text: I had heard from my birth[a], in the tribe of my ancestral family, that you, Lord, took Israel from among all the nations, and our fathers from among all their ancestors, as an everlasting inheritance, and you did for them what you spoke.
  footnotes:
  - marker: a
    text: Or, 'you fulfilled for them what you said.' The Greek reads more literally, 'you did for them what you spoke.'
    reason: lexical_alternative
translation:
  language: ko
  text: 저는 태어날 때부터 내 조상 가문이 속한 지파에서, 주님께서 이스라엘을 모든 민족 가운데서 취하시고 우리 조상들을 그들의 모든 선조들 가운데서 취하여 영원한 기업으로 삼으셨으며, 그들에게 말씀하신 모든 것을 행하셨다고 들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들에게 말씀하신 것을 이루셨습니다.’ 그리스어는 직역하면 ‘그들에게 말씀하신 모든 것을 행하셨다’입니다.
    reason: lexical_alternative
