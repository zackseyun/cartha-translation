  - 가져가셨고
  - 택하셨고
  lexicon: BDAG
  rationale: 여기서는 단순한 '받다'보다 선택하여 자기 백성으로 삼는 동작이므로, '취하셨고'가 원문의 취사 의미를 비교적 직접적으로 드러냅니다.
- source_word: εἰς κληρονομίαν αἰώνιον
  english_pob_choice: as an everlasting inheritance
  chosen_korean: 영원한 기업으로
  alternatives_korean:
