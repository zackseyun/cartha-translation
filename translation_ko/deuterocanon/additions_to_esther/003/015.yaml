  lexicon: LSJ
  rationale: φυλή의 ‘지파’와 πατριά의 ‘가문/족속’ 의미를 둘 다 살리기 위해 두 명사를 겹쳐 표현했습니다. '집안'은 πατριά의 친족·가문 뉘앙스를 현대적으로 전달합니다.
- source_word: ἔλαβες
  english_pob_choice: took
  chosen_korean: 취하셨고
  alternatives_korean:
