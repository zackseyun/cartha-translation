  - 영원한 유산으로
  - 영원한 몫으로
  lexicon: BDAG
  rationale: κληρονομία의 언약적·상속적 의미를 한국어 성경 전통에서 널리 쓰는 '기업'으로 옮겨, 영속성과 공동체적 소유의 뉘앙스를 유지했습니다.
- source_word: ἐποίησας αὐτοῖς ὅσα ἐλάλησας
  english_pob_choice: you did for them what you spoke
  chosen_korean: 그들에게 말씀하신 대로 행하셨고
  alternatives_korean:
