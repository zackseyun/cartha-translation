theological_decisions:
- issue: 관용구의 의미와 은유의 보존
  chosen_reading: 문자적 이미지 '내 손안에'를 살리면서도, 전체 의미는 '내 생명이 위태롭다'는 뜻으로 읽히게 했습니다.
  alternative_readings:
  - '''내 위험이 내 손안에 있습니다''처럼 더 직역적으로 옮김'
  - '''내 생명이 내 손에 달려 있습니다''처럼 더 해석적으로 옮김'
  rationale: 영어 POB의 주석이 이 구절을 관용구로 보고 의미 번역을 취했으므로, 한국어도 동일한 긴장을 보존해야 합니다.
  doctrine_reference: '번역 원칙: 의미-중심의 관용구 처리'
- issue: 인용부의 화자 정서
  chosen_reading: 평서문 합쇼체로 유지해, 절박한 자기 진술의 긴박함을 드러냈습니다.
  alternative_readings:
  - 더 문어적인 종결형
  - 감탄형으로 강화
  rationale: 원문은 선언적 진술이므로, 과장된 감정 표현 없이 직접적인 진술로 유지하는 것이 적절합니다.
  doctrine_reference: 문체 일치와 화용적 등가
