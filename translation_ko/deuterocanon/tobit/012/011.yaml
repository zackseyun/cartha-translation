  yaml_path: translation/deuterocanon/tobit/012/011.yaml
  text: I will certainly not hide any word from you[a]. I have indeed said, ‘It is good to hide a king’s secret[b], but to reveal the works of God gloriously.’
  footnotes:
  - marker: a
    text: Or 'the mystery of a king.' Here the Greek word refers to a confidential matter or secret, not necessarily a theological 'mystery.'
    reason: lexical_alternative
  - marker: b
    text: Or 'honorably' or 'with honor.' The adverb may describe the fitting manner of making God's works known.
    reason: lexical_alternative
translation:
  language: ko
  text: 저는 여러분에게 어떤 말도 결코 숨기지 않겠습니다. 저는 이미 말씀드렸습니다. ‘왕의 비밀을 숨기는 것은 좋습니다.[a] 그러나 하나님의 일들을 영광스럽게 드러내는 것도 좋습니다.[b]’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕의 신비’. 여기서 그리스어는 반드시 신학적 ‘신비’를 뜻하지 않고, 왕의 기밀이나 비밀스러운 일을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘존귀하게’ 또는 ‘명예롭게’. 이 부사는 하나님의 일들을 알리는 방식이 합당하고 영예롭다는 뉘앙스를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ κρύψω ἀφʼ ὑμῶν πᾶν ῥῆμα
  english_pob_choice: I will certainly not hide any word from you
  chosen_korean: 저는 여러분에게서 아무 말도 반드시 숨기지 않겠습니다
  alternatives_korean:
  - 저는 여러분에게서 어떤 말도 결코 숨기지 않겠습니다
  - 저는 여러분에게서 한마디도 숨기지 않겠습니다
  lexicon: BDAG
  rationale: οὐ μή의 강한 부정을 한국어의 ‘반드시 … 않겠습니다’로 옮겨 확정성을 살렸고, ἀπό+속격의 의미를 ‘여러분에게서’로 자연스럽게 반영했습니다. πᾶν ῥῆμα는 문맥상 ‘아무 말도’로 풀어, 어떤 정보도 빼놓지 않겠다는 뜻을 살렸습니다.
- source_word: εἴρηκα δὴ
  english_pob_choice: I have indeed said
  chosen_korean: 저는 이미 말했습니다
  alternatives_korean:
  - 제가 분명히 말했습니다
  - 제가 참으로 말했습니다
  lexicon: BDAG
  rationale: 완료형의 결과적 뉘앙스와 δή의 강조를 담되, 한국어에서는 ‘이미’로 자연스럽게 표현했습니다. 문장의 흐름상 장황한 보조 표현보다 간결한 현재적 완료가 더 적절합니다.
- source_word: μυστήριον βασιλέως
  english_pob_choice: a king’s secret
  chosen_korean: 왕의 비밀
  alternatives_korean:
  - 왕의 비밀스러운 일
  - 왕의 비밀한 일
  lexicon: BDAG
  rationale: 이곳의 μυστήριον은 후기 신학용어의 ‘신비’가 아니라 기밀 사항이므로 ‘비밀’로 옮겼습니다. βασιλέως는 소유격으로 이해해 ‘왕의’로 직역에 가깝게 살렸습니다.
- source_word: τὰ δὲ ἔργα τοῦ θεοῦ ἀνακαλύπτειν ἐνδόξως
  english_pob_choice: to reveal the works of God gloriously
  chosen_korean: 하나님의 일들을 영광스럽게 드러내는 것은
  alternatives_korean:
  - 하나님의 일들을 영광 중에 드러내는 것은
  - 하나님의 일들을 존귀하게 드러내는 것은
  lexicon: BDAG, LSJ
  rationale: ἔργα τοῦ θεοῦ는 ‘하나님의 일들’로 넓게 유지했고, ἀνακαλύπτειν은 ‘드러내다’로 옮겨 숨김/드러냄의 대조를 유지했습니다. ἐνδόξως는 ‘영광스럽게’로 옮겨 영어 POB의 ‘gloriously’와 소리와 의미를 함께 반영했습니다.
theological_decisions:
- issue: μυστήριον의 의미 범위
  chosen_reading: 왕의 비밀
  alternative_readings:
  - 왕의 신비
  - 왕의 비밀한 일
  rationale: 본문은 계시된 신학적 ‘신비’가 아니라 기밀 정보의 성격을 가지므로, 독자가 후대 신학 용어를 자동 주입하지 않도록 ‘비밀’로 번역했습니다.
  doctrine_reference: Translation philosophy §1; 본문 우선, 전통어 자동 대입 자제
- issue: ἐνδόξως의 뉘앙스
  chosen_reading: 영광스럽게
  alternative_readings:
  - 존귀하게
  - 명예롭게
  rationale: 이 부사는 하나님의 일들을 공개적으로 드러내는 방식의 품위와 영광을 함께 가리킬 수 있으므로, 본문 대비를 살리기 위해 ‘영광스럽게’를 택했습니다.
  doctrine_reference: 문맥 우선의 최적 대응
