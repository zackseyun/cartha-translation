  text: And now God has sent me to heal you and Sarah your bride[a].
  footnotes:
  - marker: a
    text: Or 'your daughter-in-law Sarah.' The Greek νύμφη can mean either 'bride/young wife' or 'daughter-in-law,' and the addressee here is Tobit.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 하나님께서 당신과 당신의 며느리 사라를 치유하도록 나를 보내셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 신부 사라’ 또는 ‘당신의 젊은 아내 사라.’ 그리스어 νύμφη는 ‘신부/젊은 아내’ 또는 ‘며느리’를 뜻할 수 있으며, 여기서 수신자는 토빗입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 지금
  lexicon: LSJ
  rationale: 전환과 시간의 흐름을 자연스럽게 살리되, 한국어에서는 ‘이제’가 가장 간결하고 담백하게 대응합니다.
- source_word: ἀπέστειλέν
  english_pob_choice: has sent
  chosen_korean: 보내셔서
  alternatives_korean:
  - 보내셨습니다
  - 보내셨고
  lexicon: LSJ
  rationale: 완료된 파송을 드러내면서도 다음 목적절과 매끄럽게 이어지도록 ‘보내셔서’를 택했습니다.
- source_word: ἰάσασθαί
  english_pob_choice: to heal
  chosen_korean: 치유하고
  alternatives_korean:
  - 낫게 하시고
  - 고치고
  lexicon: LSJ
  rationale: 몸의 회복뿐 아니라 본문 전체의 치유 행위를 넓게 살리기 위해 ‘치유하다’를 사용했습니다.
- source_word: τὴν νύμφην σου
  english_pob_choice: your bride
  chosen_korean: 당신의 신부 사라
  alternatives_korean:
  - 당신의 며느리 사라
  - 당신의 신부인 사라
  lexicon: LSJ
  rationale: νύμφη의 핵심 의미를 따라 ‘신부’를 기본으로 옮기되, 수신자가 토빗이라는 점에서 가능한 ‘며느리’ 의미는 각주로 처리합니다.
theological_decisions:
- issue: νύμφη의 관계 의미를 한국어에서 어떻게 보존할지
  chosen_reading: 본문에는 ‘신부 사라’를 두고, 각주로 ‘며느리 사라’ 가능성을 밝힙니다.
  alternative_readings:
  - 며느리 사라
  - 신부인 사라
  rationale: 그리스어가 혼인 관계와 가정 관계를 모두 허용하므로, 본문에서 한쪽으로 단정하지 않고 해석 가능성을 보존하는 것이 원문에 충실합니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
