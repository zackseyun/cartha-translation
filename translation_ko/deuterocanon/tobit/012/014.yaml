  to: 이제 하나님께서 당신과 당신의 며느리 사라를 치유하도록 나를 보내셨습니다.[a]
  rationale: 파송의 목적을 나타내는 그리스어 ἰάσασθαί에 맞추어 문장을 ‘치유하도록 나를 보내셨습니다’로 다듬었습니다. 또한 토빗과 사라의 실제 관계 및 현대 한국어 용법을 고려하여 νύμφη를 본문에서는 ‘며느리’로 옮기고, 그리스어의 다른 가능한 뜻은 각주로 보존했습니다.
  reviewer_model: gpt-5.6-terra
