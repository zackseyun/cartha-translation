review_pass:
  verdict: revise
  source_fidelity: 그리스어는 하나님이 화자를 보내신 목적이 토빗과 사라를 치유하는 데 있음을 분명히 합니다. 초안의 의미는 대체로 맞지만, 한국어 ‘당신의 신부 사라’는 수신자인 토빗이 사라와 혼인한 것처럼 읽히기 쉽습니다. 문맥상 νύμφη는 토빗에게 ‘며느리’라는 관계를 가리키는 것이 가장 자연스럽고, 다른 어휘 가능성은 각주로 보존하는 것이 적절합니다.
  naturalness: ‘치유하도록 나를 보내셨습니다’는 파송의 목적을 자연스럽고 직접적으로 나타냅니다. ‘당신의 며느리 사라’는 현대 표준 한국어에서 관계가 명확하며, 합쇼체 서술에도 맞습니다.
  terminology: ‘하나님’, ‘치유’는 적절합니다. νύμφη의 문맥상 주된 뜻은 ‘며느리’로 옮기고, ‘신부’ 또는 ‘젊은 아내’라는 어휘적 대안을 각주에 남겨 원문의 의미 범위를 보존합니다.
  issues:
  - severity: medium
    issue: 본문의 ‘당신의 신부 사라’가 한국어에서 관계를 부자연스럽고 오해하기 쉽게 표현합니다.
    rationale: 수신자는 토빗이고 사라는 그의 아들 토비야의 아내입니다. 그리스어 νύμφη에는 ‘신부/젊은 아내’와 ‘며느리’의 의미 범위가 있으나, 한국어 ‘당신의 신부’는 통상 수신자 자신의 신부를 뜻합니다. 문맥상 ‘며느리’를 본문으로 하고 대안을 각주로 제시하는 편이 정확하고 자연스럽습니다.
  revised_text: 이제 하나님께서 당신과 당신의 며느리 사라를 치유하도록 나를 보내셨습니다.[a]
