  chosen_reading: 단순한 인사말보다, 두려움 금지 뒤에 오는 평강의 약속으로 읽었습니다.
  alternative_readings:
  - ‘평강이 여러분에게 있습니다’라는 현재적 선언
  - 관용적 축복 인사로서 ‘평강이 여러분과 함께할 것입니다’
  rationale: 미래동사 ἔσται가 분명하므로, 본문은 평강의 보증을 선포하는 말로 보존하는 것이 원문 긴장을 가장 잘 살립니다.
  doctrine_reference: 원문 우선 원칙과 약속-명령 구조 보존
