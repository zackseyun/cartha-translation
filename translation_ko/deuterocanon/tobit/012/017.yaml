translation:
  language: ko
  text: 그가 그들에게 말했습니다. 「두려워하지 마십시오. 평강이 여러분에게 있을 것입니다. 그러나 하나님을 영원히 찬양하십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘평강이 여러분과 함께할 것입니다.’ 그리스어는 글자 그대로 ‘평강이 여러분에게 있을 것입니다’라고 읽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ φοβεῖσθε
  english_pob_choice: Do not be afraid
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 두려워하지 말라
  - 무서워하지 마십시오
  lexicon: BDAG
  rationale: 금지 명령의 힘을 살리면서도 현대 표준어의 합쇼체로 자연스럽게 옮겼습니다.
- source_word: εἰρήνη ὑμῖν ἔσται
  english_pob_choice: peace will be with you
  chosen_korean: 평강이 여러분에게 있을 것입니다
  alternatives_korean:
  - 평강이 여러분과 함께할 것입니다
  - 평강이 여러분의 것이 될 것입니다
  - 평강이 여러분에게 있습니다
  lexicon: BDAG
  rationale: 미래형 ἔσται를 반영해 현재의 인사말보다 약속/보증의 뉘앙스를 살렸고, εἰρήνη는 본문 기본 용례에 따라 평강으로 옮겼습니다.
- source_word: τὸν δὲ θεὸν εὐλογεῖτε
  english_pob_choice: But bless God
  chosen_korean: 그러나 하나님을 영원히 찬양하십시오
  alternatives_korean:
  - 그러나 하나님을 복되게 하십시오
  - 그러나 하나님을 축복하십시오
  - 그러나 하나님을 찬양하십시오
  lexicon: BDAG
  rationale: εὐλογεῖτε는 하나님께 대한 용례에서 ‘찬양하다/송축하다’의 뜻이 자연스럽기 때문에, 한국어에서 오해 소지가 적은 ‘찬양하십시오’를 택했습니다.
- source_word: εἰς τὸν αἰῶνα
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 세세토록
  - 끝없이
  - 영원까지
  lexicon: BDAG
  rationale: 시간의 지속을 나타내는 관용구로서 현대 한국어의 가장 직접적인 대응을 사용했습니다.
