  text: 그 두 사람은 동요했고, 두려워서 얼굴을 땅에 대고 엎드렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐταράχθησαν
  english_pob_choice: were shaken
  chosen_korean: 흔들렸고
  alternatives_korean:
  - 당황했고
  - 마음이 동요했고
  - 떨렸고
  lexicon: BDAG
  rationale: ταράσσω의 수동형이 나타내는 급작스러운 동요와 불안을 한국어로 간결하게 살렸습니다. 뒤의 두려움 진술과 중복되지 않도록 ‘흔들렸고’를 택했습니다.
- source_word: οἱ δύο
  english_pob_choice: the two
  chosen_korean: 두 사람은 모두
  alternatives_korean:
  - 그 둘은
  - 둘은
  - 두 사람
  lexicon: LSJ
  rationale: 두 인물을 가리키는 단순한 서술이므로 자연스러운 한국어로 ‘두 사람은 모두’라고 옮겨, 함께 반응하는 둘임을 분명히 했습니다.
- source_word: ἔπεσον ἐπὶ πρόσωπον
  english_pob_choice: fell facedown
  chosen_korean: 얼굴을 땅에 대고 엎드렸습니다
  alternatives_korean:
  - 엎드려 얼굴을 땅에 댔습니다
  - 얼굴을 땅에 박고 엎드렸습니다
  - 얼굴을 대고 엎드렸습니다
  lexicon: BDAG
  rationale: 이 관용구는 단순한 넘어짐이 아니라 완전한 엎드림을 뜻하므로, 현대 한국어로 그 자세를 직접 드러내는 표현을 택했습니다.
- source_word: ἐφοβήθησαν
  english_pob_choice: they were afraid
  chosen_korean: 두려워하여
  alternatives_korean:
  - 무서워하여
  - 두려움을 느껴
  - 두려워했습니다
  lexicon: BDAG
  rationale: 원문의 이유절을 자연스럽게 연결하기 위해 동사형 보조 표현으로 처리했습니다. ‘두려워하여’가 앞뒤 행위와 가장 매끄럽게 연결됩니다.
theological_decisions:
- issue: 엎드림의 의미
  chosen_reading: 본문은 두려움 때문에 얼굴을 땅에 대고 엎드린 동작을 말할 뿐, 그 자체를 예배 언어로 확대하지는 않습니다.
  alternative_readings:
  - 천사 앞에서의 경배적 엎드림으로 읽을 수 있음
  - 존경의 표시로 읽을 수 있음
  rationale: 헬라어가 명시하는 것은 공포와 신체적 엎드림이므로, 예배로 단정하지 않고 서술의 범위를 유지했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
