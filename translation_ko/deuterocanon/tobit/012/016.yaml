review_pass:
  verdict: revise
  source_fidelity: ‘흔들렸고’는 사람의 정서적 동요를 나타내는 수동태 ἐταράχθησαν을 한국어에서 다소 부자연스럽게 옮깁니다. 또한 대시로 두 절을 연결한 현 문장은 ‘동요함’과 ‘두려움 때문에 엎드림’이라는 원문의 두 동작 및 인과 관계를 흐립니다.
  naturalness: ‘그 두 사람은 동요했고, 두려워서 얼굴을 땅에 대고 엎드렸습니다’는 현대 표준어 합쇼체로 자연스럽고, 두려움이 엎드림의 이유라는 문장 구조도 분명합니다.
  terminology: ‘얼굴을 땅에 대고 엎드렸습니다’는 ἔπεσον ἐπὶ πρόσωπον의 엎드린 자세를 충실히 나타내며, 예배나 경배라는 해석을 덧붙이지 않습니다. 기존 각주는 그리스어 표현을 ‘얼굴을 향해’라고 설명하여 정확하지 않으므로 삭제하는 것이 안전합니다.
  issues:
  - severity: medium
    issue: ‘흔들렸고’의 어휘적 자연스러움
    rationale: ἐταράχθησαν은 내적 동요·당황을 뜻하지만, 한국어에서 사람이 ‘흔들렸다’고 하면 물리적 흔들림 또는 확신의 흔들림으로 읽히기 쉽습니다.
  - severity: medium
    issue: 대시로 인한 절 관계의 불명확성
    rationale: 원문은 ‘동요했다’와 ‘엎드렸다’를 접속하고, ὅτι 이하가 엎드린 이유를 제시합니다. 대시보다 접속 표현과 이유 연결을 명시하는 편이 충실합니다.
  - severity: medium
    issue: 각주의 그리스어 관용구 설명 오류
    rationale: ἐπὶ πρόσωπον은 여기서 얼굴을 땅에 대고 엎드리는 자세를 뜻하며, ‘얼굴을 향해’라는 직역 설명은 표현의 문법적·의미적 관계를 잘못 제시합니다.
  revised_text: 그 두 사람은 동요했고, 두려워서 얼굴을 땅에 대고 엎드렸습니다.
