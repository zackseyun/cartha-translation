base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/019.yaml
  text: All the days I was appearing to you[a], but I neither ate nor drank; rather, you were seeing a vision.
  footnotes:
  - marker: a
    text: Or 'I appeared to you ... but what you were observing was a vision.' The Greek imperfects can be rendered either with ongoing force ('was appearing,' 'were seeing') or more simply in English as past events.
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 날 동안 내가 너희에게 나타났지만, 나는 먹지도 마시지도 않았습니다. 오히려 너희는 한 환상을 보고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나타났지만’은 Greek의 불완료과거가 지닌 지속적 뉘앙스를 한국어에서 과도하게 어색하지 않게 반영한 번역입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: πάσας τὰς ἡμέρας
  english_pob_choice: All the days
  chosen_korean: 모든 날 동안
  alternatives_korean:
  - 그 모든 날 동안
  - 날마다
  lexicon: LSJ
  rationale: 기간 전체를 가리키는 표현이므로, ‘모든 날 동안’으로 옮겨 Greek의 총체적 시간감을 살리면서도 한국어로 자연스럽게 만들었습니다.
- source_word: ὠπτανόμην
  english_pob_choice: I was appearing
  chosen_korean: 내가 너희에게 나타났지만
  alternatives_korean:
  - 내가 너희에게 나타나고 있었지만
  - 내가 너희 앞에 보였지만
  - 내가 너희에게 보였지만
  lexicon: LSJ
  rationale: 불완료과거의 지속성을 완전히 매끄럽게 드러내기는 어렵지만, ‘나타났지만’에 ‘모든 날 동안’의 기간 표현을 결합해 반복적·지속적 나타남을 충분히 반영했습니다.
- source_word: ὅρασιν
  english_pob_choice: a vision
  chosen_korean: 한 환상을
  alternatives_korean:
  - 한 이상을
  - 환상을
  - 한 보이는 모습을
  lexicon: LSJ
  rationale: ὅρασις는 단순한 ‘봄’보다 초월적·계시적 시각 체험을 가리키는 경우가 있어, ‘환상’이 본문의 대조(실제 먹고 마심이 아님)를 가장 분명하게 드러냅니다.
theological_decisions:
- issue: 라파엘의 현현과 환상 범주의 보존
  chosen_reading: 천사가 실제 식사에 참여한 것이 아니라, 사람들에게는 나타나 보였지만 그들이 본 것은 환상이라고 말하는 긴장을 그대로 유지했습니다.
  alternative_readings:
  - 그냥 ‘겉보기로만 그랬다’로 평면화하기
  - 천사의 현현을 지나치게 물질화하기
  rationale: 본문은 ‘나타남’과 ‘먹고 마시지 않음’을 대조하고, 관찰된 것을 ‘환상’으로 규정합니다. 이 긴장을 해소하지 않고 그대로 옮기는 것이 원문의 의미를 가장 충실하게 보존합니다.
  doctrine_reference: 본문의 초자연적 현현과 환상성을 해소하지 않고 유지
