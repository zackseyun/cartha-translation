base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/013.yaml
  text: And when you did not hesitate to rise and leave your meal so that you might go and wrap the dead man[a], your doing good did not escape me[b], but I was with you.
  footnotes:
  - marker: a
    text: Or 'prepare the dead man for burial.' The Greek verb can refer to wrapping or otherwise arranging a corpse.
    reason: lexical_alternative
  - marker: b
    text: The Greek for 'your meal' uses a term that can denote a principal meal; the exact time of day is not specified here.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 네가 식사[b]를 두고 일어나 죽은 이를 감싸려고[a] 가는 일을 망설이지 않았을 때, 네가 선을 행한 일은 내게 숨겨지지 않았고, 나는 너와 함께 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘감싸다’로 옮긴 그리스어 동사는 시신을 싸매거나 달리 장례를 준비하는 행위를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 ‘식사’는 주요 식사를 가리킬 수 있으나, 정확한 시간대는 여기서 특정되지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: οὐκ ὤκνησας
  english_pob_choice: you did not hesitate
  chosen_korean: 망설이지 않았을 때
  alternatives_korean:
  - 지체하지 않았을 때
  - 주저하지 않았을 때
  lexicon: LSJ
  rationale: ὀκνέω는 지체보다도 reluctance와 hesitation의 뉘앙스가 강하므로, ‘망설이지 않다’가 칭찬의 뉘앙스를 가장 자연스럽게 살립니다.
- source_word: ἀναστῆναι καὶ καταλιπεῖν τὸ ἄριστόν σου
  english_pob_choice: to rise and leave your meal
  chosen_korean: 밥상을 떠나 일어나
  alternatives_korean:
  - 식사를 마치고 일어나
  - 식사를 멈추고 일어나
  lexicon: LSJ
  rationale: ἀναστῆναι와 καταλιπεῖν은 ‘일어나다’와 ‘떠나다’의 동작을 함께 보여 주므로, 한국어도 동작 순서를 살려 표현했습니다. ἄριστον은 정확한 시간대가 특정되지 않으므로 ‘밥상/식사’로 옮겼습니다.
- source_word: περιστείλῃς τὸν νεκρόν
  english_pob_choice: wrap the dead man
  chosen_korean: 죽은 이를 감싸러 가기 위해
  alternatives_korean:
  - 죽은 이를 싸매러 가기 위해
  - 시신을 준비하러 가기 위해
  lexicon: LSJ
  rationale: περιστέλλω는 ‘감싸다, 싸매다, 시신을 돌보다’의 범위를 가지므로, 매장까지 특정하지 않고 ‘감싸다’로 두어 영어 POB의 렉시컬 유보를 반영했습니다.
- source_word: οὐκ ἔλαθές με ἀγαθοποιῶν
  english_pob_choice: your doing good did not escape me
  chosen_korean: 네가 선행하는 것이 내 눈을 피한 적은 없었고
  alternatives_korean:
  - 네 선행이 내게서 숨겨지지 않았고
  - 네가 선을 행한 일이 내게 감추어지지 않았고
  lexicon: LSJ
  rationale: λανθάνω의 관용적 의미를 살리되, ‘내 눈을 피하다’는 한국어 표현으로 관찰·인지를 자연스럽게 드러냈습니다. ἀγαθοποιῶν은 단발적 행위보다 진행 중인 선행을 가리켜 ‘선행하는 것’으로 옮겼습니다.
theological_decisions:
- issue: 라파엘의 동행과 관찰 진술
  chosen_reading: 본문은 라파엘이 토빗의 선행을 보았고 그 순간 그와 함께 있었다고 분명히 말하며, 이를 더 넓은 천사론으로 확장하지 않았습니다.
  alternative_readings:
  - 천사의 보호와 중재를 암시하는 방식으로 확장해 읽을 수 있습니다.
  rationale: 원문은 서사적 사실만 진술하므로, 본문이 말하는 범위를 넘어선 교리적 확대를 피했습니다.
  doctrine_reference: 본문 범위 보존; 천사론 일반화 금지
- issue: 직접 화자의 인칭과 공손도
  chosen_reading: 라파엘의 발화는 한국어 서술체 안에서 평서적 진술로 처리하고, 하나님께 드리는 공손 체계는 적용하지 않았습니다.
  alternative_readings:
  - 대화체를 더 강조해 구어적으로 옮길 수 있습니다.
  rationale: 여기서는 인물 간 회상적 진술이므로 합쇼체 서술을 유지하는 것이 가장 자연스럽습니다.
  doctrine_reference: 서술체 유지
