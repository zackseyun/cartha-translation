base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/001.yaml
  text: Then Tobit called Tobias his son and said to him[a], “See, child, wages must be given to the man who went with you, and more must be added for him.”
  footnotes:
  - marker: a
    text: 'Greek: ''child''; the parallel Semitic phrasing reads ''my son.'' The main text follows the Greek vocative while preserving the familial nuance in context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 토빗이 자기 아들 토비아스를 불러 그에게 말했습니다. “얘야, 너와 함께 갔던 그 사람에게 품삯을 주어야 하고, 그에게 더 보태어 주어야 합니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 τέκνον은 문자적으로 ‘아이, 자녀’에 가까운 친애의 호칭입니다. 비교를 위해 제시된 평행 셈어 표현은 ‘내 아들’이라고 읽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλεσεν
  english_pob_choice: called
  chosen_korean: 불러
  alternatives_korean:
  - 불렀습니다
  - 소집했습니다
  lexicon: BDAG
  rationale: 서사 문맥에서 사람을 자기에게 부르는 자연스러운 동사를 택했습니다. ‘불러’는 직접적이면서도 현대 한국어에서 무리하지 않습니다.
- source_word: τέκνον
  english_pob_choice: child
  chosen_korean: 자녀야
  alternatives_korean:
  - 얘야
  - 아들아
  lexicon: BDAG
  rationale: 그리스어 vocative의 애정 어린 호칭을 살리면서도, POB의 ‘child’가 지닌 친밀함과 본문 맥락의 가족성을 함께 반영했습니다. ‘아들아’는 의미는 분명하지만 그리스어의 일반적 친애 호칭보다 구체적이어서 본문 어감이 좁아집니다.
- source_word: μισθὸν
  english_pob_choice: wages
  chosen_korean: 품삯
  alternatives_korean:
  - 삯
  - 보수
  - 보상
  lexicon: BDAG
  rationale: 동행하며 한 일에 대한 지급이라는 맥락에서 ‘품삯’이 단순한 ‘보상’보다 대가성 있는 지급을 더 분명히 드러냅니다.
- source_word: τῷ συνελθόντι σοι
  english_pob_choice: who went with you
  chosen_korean: 너와 함께 갔던
  alternatives_korean:
  - 너와 동행한
  - 너와 같이 간
  lexicon: BDAG
  rationale: 직역적으로는 ‘함께 간/동행한’이 가능하지만, 한국어에서는 서술어로 자연스럽게 풀어 ‘너와 함께 갔던’으로 옮겨 그 관계를 분명히 했습니다.
- source_word: προσθεῖναι αὐτῷ δεῖ
  english_pob_choice: more must be added for him
  chosen_korean: 거기에 더 보태어 주어야 합니다
  alternatives_korean:
  - 그에게 더해 주어야 합니다
  - 더 보상해 주어야 합니다
  lexicon: BDAG
  rationale: δεῖ의 필요성을 ‘~해야 합니다’로 살리고, προσθεῖναι의 ‘더하다’ 의미를 ‘더 보태다’로 자연스럽게 옮겼습니다. 기본 삯 외에 추가 지급이 필요하다는 뜻이 드러납니다.
theological_decisions:
- issue: 친애 호칭 τέκνον의 한국어 음성
  chosen_reading: ‘자녀야’로 번역해 친밀한 호칭을 유지했습니다.
  alternative_readings:
  - 아들아
  - 얘야
  rationale: 본문은 단순한 정보 전달이 아니라 아버지가 아들에게 직접 권면하는 장면이므로, 명령문 앞의 호칭이 지닌 정서적 밀도를 살리는 것이 중요합니다. 동시에 여성·남성 모두에 쓸 수 있는 일반 호칭의 폭도 일부 보존됩니다.
  doctrine_reference: 가족적 권면의 문맥 보존
