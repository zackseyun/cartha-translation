  rationale: 직접 호칭 ‘자녀야’를 현대 한국어에서 자연스러운 친애 호격인 ‘얘야’로 고쳤습니다. 이는 그리스어 τέκνον의 비특정적 친밀성을 보존하며, ‘아들아’처럼 어휘상 성별을 명시하지 않습니다. 각주는 그리스어 본문을 번역의 우선 근거로 유지하고, 평행 셈어 자료의 비교적 성격을 더 분명히 했습니다.
