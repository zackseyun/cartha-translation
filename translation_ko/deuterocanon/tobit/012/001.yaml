  naturalness: ‘자녀야’는 법률·행정 또는 집단 지칭에는 가능하지만, 아버지가 아들에게 건네는 직접 호칭으로는 현대 표준어에서 어색합니다. ‘얘야’가 그리스어의 비특정적이고 애정 어린 호격을 가장 자연스럽게 살립니다. 또한 ‘그 사람에게는’보다 목적어를 직접 제시한 ‘그 사람에게’가 이 문맥에서 더 매끄럽습니다.
