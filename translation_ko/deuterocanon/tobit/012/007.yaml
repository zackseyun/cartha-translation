base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/007.yaml
  text: Do not hesitate to acknowledge him[a]. It is good to conceal a king’s secret, but to reveal the works of God gloriously. Do what is good[b], and evil will not find you.
  footnotes:
  - marker: a
    text: Or 'confess to him,' 'give thanks to him,' or 'praise him openly.' The Greek verb can carry any of these public-acknowledgment senses depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'honorably' / 'with due honor.' The Greek adverb may describe the fitting manner of speaking about God's works.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님을 인정하기를 주저하지 마십시오[a]. 왕의 비밀은 숨기는 것이 좋지만, 하나님의 일들은 영광스럽게[b] 드러내는 것이 좋습니다. 선한 일을 하십시오. 그러면 악이 여러분을 찾아내지 못할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 ἐξομολογεῖσθαι는 문맥에 따라 ‘고백하다’, ‘감사하다’, ‘공개적으로 찬양하다’라는 뜻도 될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘존귀하게’, ‘마땅한 존중으로’라는 뜻도 가능합니다. 이 부사는 하나님의 일을 드러내는 방식의 합당함을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀκνεῖτε
  english_pob_choice: Do not hesitate
  chosen_korean: 숨기지 말아야 합니다
  alternatives_korean:
  - 주저하지 말아야 합니다
  - 망설이지 말아야 합니다
  - 꺼리지 말아야 합니다
  lexicon: LSJ
  rationale: 문맥상 하나님께 대한 공개적 인정·감사의 행위를 권하는 표현이므로, 현대 한국어에서 자연스러운 ‘주저하지 말라’ 계열로 옮겼습니다. 여기서는 대상이 드러나도록 ‘그에게’와 결합해 어색한 직역을 피했습니다.
- source_word: ἐξομολογεῖσθαι αὐτῷ
  english_pob_choice: to acknowledge him
  chosen_korean: 그에게 숨기지 말아야 합니다
  alternatives_korean:
  - 그를 고백해야 합니다
  - 그에게 감사해야 합니다
  - 그를 공개적으로 찬양해야 합니다
  lexicon: LSJ
  rationale: 이 동사는 문맥에 따라 인정하다, 고백하다, 감사하다, 공개적으로 찬양하다의 폭이 있어, 하나님을 향한 공개적 인정의 넓은 뜻을 살렸습니다. 다만 현재 문장의 흐름상 ‘숨기지 말다’보다 ‘인정하다’가 더 직접적이므로, 본문에는 공적 인정의 의미를 반영한 표현을 두고 주석으로 대안 의미를 남겼습니다.
- source_word: ἐνδόξως
  english_pob_choice: gloriously
  chosen_korean: 영광스럽게
  alternatives_korean:
  - 존귀하게
  - 마땅한 존중으로
  - 영예롭게
  lexicon: LSJ
  rationale: 하나님의 일을 드러내는 방식에 대한 부사로서, doxological한 뉘앙스를 살리기 위해 ‘영광스럽게’를 선택했습니다. 전통적 교회어의 과도한 완곡화를 피하면서도 하나님의 행위에 합당한 영광의 결을 유지합니다.
- source_word: κακὸν οὐχ εὑρήσει ὑμᾶς
  english_pob_choice: evil will not find you
  chosen_korean: 악이 여러분을 찾아내지 못할 것입니다
  alternatives_korean:
  - 재앙이 여러분에게 닥치지 못할 것입니다
  - 해가 여러분을 만나지 못할 것입니다
  - 악이 여러분을 해치지 못할 것입니다
  lexicon: LSJ
  rationale: 헬라어는 직역하면 ‘악이 너희를 찾지 못할 것이다’이며, 결과적 보호를 암시합니다. 이미지의 힘을 살리면서도 현대 한국어에서 자연스럽게 읽히도록 ‘찾아내다’로 옮겼습니다.
theological_decisions:
- issue: ἐξομολογεῖσθαι αὐτῷ의 의미 범위
  chosen_reading: 하나님께 대한 공개적 인정과 고백의 뜻을 함께 살리되, 본문에서는 공개적 인정의 방향을 우선했습니다.
  alternative_readings:
  - 그에게 고백하다
  - 그에게 감사하다
  - 그를 공개적으로 찬양하다
  rationale: 앞절의 ‘왕의 비밀을 숨기다’와 대조되므로, 하나님의 일을 숨기지 않고 드러내는 공적 태도가 강조됩니다. 따라서 죄 고백으로 좁히지 않고, 하나님을 인정하고 말하는 넓은 의미를 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: τὰ δὲ ἔργα τοῦ θεοῦ의 수사적 대비
  chosen_reading: 왕의 비밀과 대비되는 하나님의 일들을 드러내라는 잠언적 교훈으로 읽었습니다.
  alternative_readings:
  - 하나님의 행하신 일들
  - 하나님의 역사
  - 하나님의 행위들
  rationale: 본문은 비밀을 숨기는 것과 하나님의 일을 드러내는 것을 대조합니다. 그러므로 ‘하나님의 일들’을 단순한 일반 행위가 아니라, 드러내야 할 하나님의 역사와 행적이라는 점이 드러나도록 옮겼습니다.
  doctrine_reference: Translation philosophy §3
