    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἁμαρτάνοντες
  english_pob_choice: those who sin
  chosen_korean: 죄를 짓는 사람들
  alternatives_korean:
  - 죄를 짓는 자들
  - 죄 짓는 이들
  - 죄인들
  lexicon: BDAG
  rationale: 관사+현재분사는 습관적 행위를 하는 사람들을 가리키므로, 한국어에서는 자연스러운 주어 표현인 ‘죄를 짓는 사람들’로 옮겨 동작성을 살렸습니다.
- source_word: δὲ
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 그리고
  - 또
  - 하지만
  lexicon: BDAG
  rationale: 앞 절과의 완만한 대조를 드러내는 접속으로서 ‘그러나’가 문맥의 대비를 가장 분명하고 자연스럽게 표시합니다.
- source_word: πολέμιοί
  english_pob_choice: enemies
  chosen_korean: 원수
  alternatives_korean:
  - 적
  - 원수들
  - 대적
  lexicon: LSJ
  rationale: 서술적 명사로서 ‘원수’가 한국어 성경 문맥에서 ‘적’보다 더 강한 대립과 해악의 뉘앙스를 잘 전달합니다.
- source_word: τῆς ἑαυτῶν ζωῆς
  english_pob_choice: of their own life
  chosen_korean: 자기 생명의
  alternatives_korean:
  - 자기 목숨의
  - 자기 영혼의
  - 자기 삶의
  lexicon: BDAG
  rationale: ζωή는 여기서 기술적 의미의 ‘영혼’보다 기본 뜻인 ‘생명’이 더 직접적이므로, ‘자기 생명의’로 옮겨 자기 파괴적 의미를 보존했습니다.
theological_decisions:
- issue: ζωή의 범위와 인간학적 과잉 해석
  chosen_reading: ‘생명’은 문자적·윤리적 의미로 유지하고, ‘영혼’으로 확장하지 않습니다.
  alternative_readings:
  - 자기 영혼
  - 자기 삶
  rationale: 본문은 죄가 곧 자기 생명에 대한 적대라는 지혜문맥의 진술이지, 영혼론을 전개하지 않습니다. POB의 영어 선택과 같이 한국어도 더 넓은 신학 범주를 덧씌우지 않는 쪽이 원문에 충실합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve lexical tension without theological overdefinition'
