review_pass:
  verdict: approve
  source_fidelity: 그리스어 οἱ δὲ ἁμαρτάνοντες πολέμιοί εἰσιν τῆς ἑαυτῶν ζωῆς를 충실히 옮겼습니다. ‘그러나’는 δέ의 완만한 대조를, ‘죄를 짓는 사람들은’은 관사+현재분사의 사람 지칭과 진행·특성의 뉘앙스를, ‘자기 생명의 원수입니다’는 πολέμιοι 및 단수 ζωή와 재귀 소유를 적절히 반영합니다.
  naturalness: ‘그러나 죄를 짓는 사람들은 자기 생명의 원수입니다.’는 표준어 현대 한국어와 합쇼체에 자연스럽고 간결합니다. 집합적 복수 주어에 ‘자기 생명’ 단수를 사용한 것도 각 사람이 자신의 생명에 적대한다는 의미를 자연스럽게 전달합니다.
  terminology: ‘죄를 짓다’, ‘생명’, ‘원수’는 성경 한국어에서 이해하기 쉽고 현대적으로도 무리가 없습니다. ζωή를 ‘생명’으로 번역하여 본문에 없는 영혼론적 한정을 피했습니다. 각주도 ‘영혼’이라는 가능한 번역을 대안으로만 제시하며 본문 번역을 적절히 뒷받침합니다.
