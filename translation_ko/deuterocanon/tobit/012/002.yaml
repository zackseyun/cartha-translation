base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/002.yaml
  text: And he said[a], “Father[b], I lose nothing by giving him half of what I have brought back.”
  footnotes:
  - marker: a
    text: The Greek says literally, 'I am not harmed, having given him half of what I have brought.' The sense is that paying the guide half the recovered goods would not leave Tobias at a loss.
    reason: lexical_alternative
  - marker: b
    text: The Semitic parallel likewise supports the sense of taking half of the money/goods brought back, reinforcing 'brought back' rather than a bare 'brought.'
    reason: cross_reference
translation:
  language: ko
  text: 그리고 그가 말했습니다. “아버지, 내가 가져온 것의 절반을 그에게 주어도 나는 손해 보지 않습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 “그에게 절반을 줌으로써 나는 손상되지 않는다/해를 입지 않는다”에 가깝습니다. 여기서는 경제적 부담이 없다는 뜻을 자연스럽게 살렸습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘가져온 것’은 귀환하여 회수한 재물이라는 뜻을 반영합니다. 본문 맥락과 평행 전승이 단순한 ‘가져온’보다 ‘되가져온/가져온 뒤의 회수품’의 의미를 지지합니다.
    reason: cross_reference
lexical_decisions:
- source_word: Πάτερ
  english_pob_choice: Father
  chosen_korean: 아버지
  alternatives_korean:
  - 아빠
  - 아버님
  lexicon: LSJ
  rationale: 직접 호칭이므로 소유격 없이 단순히 ‘아버지’로 옮겨 그리스어의 즉시성을 살렸습니다.
- source_word: οὐ βλάπτομαι
  english_pob_choice: I lose nothing
  chosen_korean: 나는 손해 보지 않습니다
  alternatives_korean:
  - 나는 해를 입지 않습니다
  - 나는 손해가 없습니다
  lexicon: LSJ
  rationale: 경제적 맥락에서 ‘손해 보지 않습니다’가 자연스럽고, ‘harm’보다 실제 부담 여부를 더 분명히 드러냅니다.
- source_word: δοὺς αὐτῷ τὸ ἥμυσυ
  english_pob_choice: by giving him half
  chosen_korean: 그에게 절반을 주어도
  alternatives_korean:
  - 그에게 절반을 주면서
  - 그에게 절반을 준 뒤에도
  lexicon: LSJ
  rationale: 부대상황의 분사 의미를 한국어에서 가장 간결하게 살리기 위해 ‘주어도’로 옮겼습니다.
- source_word: ὧν ἐνήνοχα
  english_pob_choice: of what I have brought back
  chosen_korean: 내가 가져온 것의
  alternatives_korean:
  - 내가 가져온 것들 중
  - 내가 되가져온 것의
  lexicon: LSJ
  rationale: 완료형의 현재적 결과를 반영하면서도, 귀환하여 가져온 재물이라는 문맥을 자연스럽게 드러내기 위해 ‘가져온 것’으로 옮겼습니다.
