  naturalness: ‘나는 손해 보지 않습니다’도 자연스럽지만, 표준적인 합쇼체 문장에서는 목적격을 갖춘 ‘나는 손해를 보지 않습니다’가 더 매끄럽습니다. ‘그리고 그가 말했습니다’는 문맥상 가능하나, 서사 연결에는 ‘그러자’가 더 자연스럽습니다.
