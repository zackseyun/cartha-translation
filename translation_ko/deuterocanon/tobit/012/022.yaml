  yaml_path: translation/deuterocanon/tobit/012/022.yaml
  text: And they acknowledged his great and wondrous works[b][a], because an angel of the Lord had appeared to them.
  footnotes:
  - marker: a
    text: Or, 'they gave thanks for / openly acknowledged his great and wondrous works.' The Greek verb can carry senses of confession, acknowledgment, thanksgiving, or praise depending on context.
    reason: lexical_alternative
  - marker: b
    text: 'Greek: ''an angel of the Lord''; some English traditions may expect ''the angel of the Lord,'' but the Greek here does not require the definite sense.'
    reason: alternative_reading
translation:
  language: ko
  text: 주님의 천사가 그들에게 나타났기 때문에, 그들은 주님의 크고 놀라운 일들을 인정하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 동사는 문맥에 따라 ‘고백하다’, ‘감사하다’, ‘공개적으로 인정하다’, ‘찬양하다’의 뜻을 띨 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어에는 ‘천사’ 앞에 정관사가 없으며, 이 표현은 특정한 ‘그 천사’를 요구하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξωμολογοῦντο
  english_pob_choice: they acknowledged
  chosen_korean: 인정하였는데
  alternatives_korean:
  - 고백하였는데
  - 감사하였는데
  - 공개적으로 인정하였는데
  lexicon: LSJ
  rationale: 문맥상 하나님이 행하신 일을 드러내어 받아들이고 말하는 뜻이므로, 한국어에서는 ‘인정하다’가 고백·공인·감사의 뉘앙스를 과도하게 특정하지 않으면서도 공적 선언의 힘을 살립니다.
- source_word: τὰ ἔργα τὰ μεγάλα καὶ θαυμαστὰ
  english_pob_choice: his great and wondrous works
  chosen_korean: 주님의 크고 놀라운 일들
  alternatives_korean:
  - 주님의 크고 기이한 일들
  - 주님의 위대하고 놀라운 행적들
  - 주님의 크고 경이로운 일들
  lexicon: LSJ
  rationale: ἔργα는 ‘일/행위’가 자연스럽고, θαυμαστά는 단순한 ‘놀라운’보다 ‘경이로운’에 가깝지만, 본문 전체의 읽기 쉬움을 위해 ‘놀라운’으로 옮기되 ‘크고’로 μεγάλα를 분명히 했습니다.
- source_word: ὡς
  english_pob_choice: because
  chosen_korean: -기 때문입니다
  alternatives_korean:
  - 왜냐하면
  - -하므로
  - -해서
  lexicon: LSJ
  rationale: 여기서는 뒤의 천사 현현이 그들의 인정의 근거를 제시하므로, 한국어 원인 표현인 ‘-기 때문입니다’가 가장 자연스럽습니다.
- source_word: ἄγγελος Κυρίου
  english_pob_choice: an angel of the Lord
  chosen_korean: 주님의 천사
  alternatives_korean:
  - 주님의 한 천사
  - 한 천사
  - 주님의 사자
  lexicon: LSJ
  rationale: 그리스어가 무관사이므로 영어의 ‘an angel of the Lord’에 맞춰 비특정성을 살렸습니다. 한국어에서는 ‘한’을 생략해도 비한정성이 유지되므로 간결한 ‘주님의 천사’로 옮겼습니다.
theological_decisions:
- issue: ἄγγελος Κυρίου의 특정성
  chosen_reading: 비특정적 의미를 살려 ‘주님의 천사’로 옮겼습니다.
  alternative_readings:
  - ‘주님의 그 천사’
  - ‘주님의 천사’
  rationale: 원문이 무관사이므로 특정한 정체를 확정하지 않고, 천사 현현이라는 사실 자체를 전달하는 쪽이 본문의 범위를 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; preserve theological tension rather than resolve it.'
