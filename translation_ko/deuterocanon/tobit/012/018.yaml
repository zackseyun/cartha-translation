    rationale: 영어 감사 기록처럼 해당 어휘 바로 뒤에 표지를 두면 대안 번역을 다루는 각주의 범위가 분명해집니다.
  - severity: low
    issue: εὐλογεῖτε를 ‘찬양하십시오’로 번역함
