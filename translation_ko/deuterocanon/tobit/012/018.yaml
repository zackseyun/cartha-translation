base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/018.yaml
  text: For it was not by my own favor[a], but by the will of your God. Therefore bless him forever.
  footnotes:
  - marker: a
    text: Or 'not by my own grace.' The Greek χάρις can mean 'grace' or 'favor'; here it likely refers to Raphael's own initiative or beneficence.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 제 자신의 호의[a]로 한 일이 아니라, 여러분의 하나님의 뜻에 따라 한 일입니다. 그러므로 그분을 영원히 송축하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 χάρις는 ‘호의’, ‘은혜’, 또는 ‘은총’을 뜻할 수 있습니다. 여기서는 라파엘 자신의 자의적 호의나 공로가 아니라 하나님의 뜻에 따른 일임을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτι
  english_pob_choice: favor
  chosen_korean: 은혜
  alternatives_korean:
  - 호의
  - 은총
  lexicon: BDAG
  rationale: 여기서 라파엘은 자기 주도적 호의나 공로가 아니라 하나님의 뜻을 따른 것임을 부인하므로, 한국어에서는 의미 범위가 넓은 ‘은혜’로 옮기되, 문맥상 인간적 호의의 뉘앙스도 함께 담을 수 있게 했습니다.
- source_word: θελήσει
  english_pob_choice: will
  chosen_korean: 뜻
  alternatives_korean:
  - 의지
  - 원하심
  lexicon: BDAG
  rationale: θελήσει는 하나님의 의도와 결정을 가리키므로, 현대 한국어에서 가장 자연스럽고 직역에 가까운 ‘뜻’이 적절합니다.
- source_word: τοῦ θεοῦ ὑμῶν
  english_pob_choice: your God
  chosen_korean: 여러분의 하나님
  alternatives_korean:
  - 너희의 하나님
  - 당신들의 하나님
  lexicon: BDAG
  rationale: 복수 대상을 직접 가리키는 소유 관계를 살리기 위해 ‘여러분의 하나님’으로 옮겨, 대화체의 직접성을 유지했습니다.
- source_word: εὐλογεῖτε
  english_pob_choice: bless
  chosen_korean: 찬양하십시오
  alternatives_korean:
  - 송축하십시오
  - 복을 빌어 드리십시오
  lexicon: BDAG
  rationale: 명령형 εὐλογεῖτε는 하나님을 향한 경배적 응답을 요구하므로, 한국어에서는 예배적 의미가 분명한 ‘찬양하십시오’로 옮겼습니다.
- source_word: εἰς τὸν αἰῶνα
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 영원토록
  - 세세토록
  lexicon: BDAG
  rationale: 관용구 εἰς τὸν αἰῶνα는 지속성의 표현으로, 현대 한국어의 표준적 종결 표현인 ‘영원히’가 가장 자연스럽습니다.
theological_decisions:
- issue: χάρις의 번역이 은혜인지 호의인지
  chosen_reading: 라파엘은 자기 자신의 주도권이나 공로가 아니라 하나님의 뜻에 따른 것이라고 말합니다.
  alternative_readings:
  - 라파엘은 자기 자신의 은혜로가 아니라 하나님의 뜻으로 했다고 말합니다.
  - 라파엘은 자기 자신의 호의로가 아니라 하나님의 뜻으로 했다고 말합니다.
  rationale: 이 구절은 교리 설명이 아니라 파송된 천사의 행위 근거를 밝히는 서술이므로, 후대의 ‘은혜’ 교리만을 전면화하지 않으면서도 χάρις의 넓은 의미를 보존했습니다.
  doctrine_reference: '번역 원칙: 서술 문맥에서의 어휘 범위를 보존하고, 교리적 부담은 문맥이 요구할 때만 부각함'
- issue: εὐλογεῖτε의 한국어 어조
  chosen_reading: 하나님을 향한 예배적 응답으로 ‘찬양하십시오’를 사용했습니다.
  alternative_readings:
  - ‘송축하십시오’는 전통적이지만 현대어에서는 다소 교회적입니다.
  - ‘복을 빌어 드리십시오’는 의미는 가능하지만 한국어로는 부자연스럽습니다.
  rationale: 직역적 ‘복을 빌다’는 현대 한국어에서 어색하고, 본문이 요구하는 것은 하나님을 높이는 행위이므로 합쇼체의 명령으로 ‘찬양하십시오’가 가장 읽기 쉽습니다.
  doctrine_reference: 예배 언어의 현대화는 의미 보존을 우선하되 교회 용어를 기계적으로 고정하지 않음
