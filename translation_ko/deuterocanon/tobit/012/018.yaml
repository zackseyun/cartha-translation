revisions:
- from: 그것은 제 자신의 은혜로 한 것이 아니라, 여러분의 하나님의 뜻으로 한 것입니다. 그러므로 그분을 영원히 찬양하십시오.[a]
  to: 그것은 제 자신의 호의[a]로 한 일이 아니라, 여러분의 하나님의 뜻에 따라 한 일입니다. 그러므로 그분을 영원히 송축하십시오.
  rationale: ‘호의’는 이 서술 문맥에서 χάρις가 가리키는 개인적 선의·주도성의 뉘앙스를 자연스럽게 전달하면서, ‘은혜’가 유발할 수 있는 불필요한 신학적 연상을 피합니다. 각주는 가능한 어휘 범위를 보존합니다. 또한 ‘송축하십시오’는 εὐλογεῖτε의 직접 목적어와 하나님을 향한 축복·찬양의 뜻을 유지합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:55:01Z'
review_pass:
  verdict: revise
  source_fidelity: 그리스어의 대조 구조(‘내 자신의 χάρις가 아니라 여러분의 하나님의 뜻으로’)와 결론적 명령은 대체로 반영합니다. 그러나 ‘제 자신의 은혜로 한 것’은 χάρις를 불필요하게 신학화하고 한국어로도 행위의 주체·방식 관계가 다소 부자연스럽습니다. 문맥상 라파엘 자신의 호의나 자의적 선행이 아니라 하나님의 뜻에 따른 일이라는 의미를 더 직접적으로 드러내는 편이 안전합니다.
  naturalness: 합쇼체와 ‘여러분의 하나님’, ‘영원히’는 자연스럽습니다. 다만 ‘은혜로 한 것’은 현대 한국어에서 라파엘이 은혜를 베풀었다는 뜻보다 은혜를 받았거나 신적 은혜를 말하는 듯하게 들릴 수 있습니다. ‘제 자신의 호의로 한 일이 아니라’가 문맥과 한국어 양쪽에서 더 명료합니다.
  terminology: χάρις는 여기서 ‘호의’로 번역하고 각주에서 ‘은혜’와 ‘은총’을 가능한 대안으로 제시하는 것이 원문의 의미 범위와 영어 감사 기록을 함께 보존합니다. εὐλογεῖτε에는 ‘송축하십시오’를 사용하여 하나님을 향해 ‘복되시다’고 높이는 뜻을 ‘찬양하십시오’보다 가깝게 반영합니다.
