translation:
  language: ko
  text: 나는 라파엘입니다[a]. 나는 일곱 거룩한 천사들 가운데 하나로서, 성도들의 기도들을 바치고 거룩하신 분의 영광 앞에 들어갑니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거룩한 이들’. 그리스어 표현은 ‘거룩한 사람들’, 곧 ‘성도들’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ῥαφαήλ
  english_pob_choice: Raphael
  chosen_korean: 라파엘
  alternatives_korean:
  - 라파엘
  lexicon: 고유명사 음역
  rationale: 고유명사는 현대 한국어 표기 관행에 따라 음역하고, 의미 번역을 피했습니다.
- source_word: ἑπτὰ ἁγίων ἀγγέλων
  english_pob_choice: seven holy angels
  chosen_korean: 일곱 거룩한 천사들
  alternatives_korean:
  - 일곱 성스러운 천사들
  - 일곱 거룩한 천사
  lexicon: ἅγιος
  rationale: ἅγιος는 기본적으로 ‘거룩한’으로 옮기고, 천사들에 대한 수식 구조를 자연스러운 현대 한국어로 유지했습니다.
- source_word: προσαναφέρουσιν τὰς προσευχὰς
  english_pob_choice: present the prayers
  chosen_korean: 기도들을 바치고
  alternatives_korean:
  - 기도들을 올려 드리고
  - 기도들을 제시하고
  - 기도들을 올리고
  lexicon: BDAG
  rationale: 영어 POB의 ‘present’는 중개적으로 기도를 하나님 앞에 드려 올리는 뜻이므로, 본문의 하늘 법정 이미지를 살리면서도 한국어로는 ‘바치다’가 가장 직접적입니다.
- source_word: τῶν ἁγίων
  english_pob_choice: the holy ones
  chosen_korean: 성도들의
  alternatives_korean:
  - 거룩한 이들의
  - 성인들의
  lexicon: ἅγιος
  rationale: 이 프로젝트의 기본어휘에 따라 τῶν ἁγίων은 ‘성도들’로 옮겨, 교회 전통의 ‘성인’과 구별했습니다.
- source_word: ἐνώπιον τῆς δόξης τοῦ ἁγίου
  english_pob_choice: before the glory of the Holy One
  chosen_korean: 거룩하신 분의 영광 앞에
  alternatives_korean:
  - 거룩한 분의 영광 앞에
  - 거룩하신 이의 영광 앞에
  lexicon: δόξα
  rationale: δόξα는 ‘영광’으로 유지하고, τοῦ ἁγίου는 문맥상 하나님을 가리키는 칭호이므로 ‘거룩하신 분’으로 옮겨 천상 법정 장면을 드러냈습니다.
theological_decisions:
- issue: τοῦ ἁγίου의 지시 대상
  chosen_reading: 하나님을 가리키는 신적 칭호로 이해합니다.
  alternative_readings:
  - ‘영광’의 수식어처럼 모호하게 처리하는 읽기
  - 비인격적 거룩함을 가리키는 표현으로 보는 읽기
  rationale: 라파엘이 하나님의 حضور/법정 앞에 서는 맥락에서, ‘거룩하신 분의 영광’은 하나님 자신을 가리키는 것으로 읽는 것이 가장 자연스럽고 본문 이미지도 보존합니다.
  doctrine_reference: 문맥 우선의 본문 해석; 신적 칭호의 서술적 번역
