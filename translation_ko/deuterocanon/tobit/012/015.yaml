  source_fidelity: 라파엘, ‘일곱 거룩한 천사 가운데 하나’, 기도의 제시, 그리고 거룩하신 분의 영광 앞에 들어감을 모두 충실히 반영합니다. 다만 προσαναφέρουσιν은 기도를 신에게 ‘바친다’는 희생 제의적 의미보다 기도를 위로 가져가 제시한다는 뜻이므로 ‘올리고’가 더 중립적이고 가깝습니다.
