review_pass:
  verdict: revise
  source_fidelity: 첫 문장의 현재형 ‘건져 내고’와 둘째 절의 미래형을 구별한 점은 유지되어야 합니다. 다만 ἀποκαθαριεῖ는 단순히 ‘깨끗하게 하다’보다 죄를 씻어 제거하는 뜻이 더 뚜렷하므로 ‘깨끗이 씻어 내다’가 원문에 더 충실합니다. ἐλεημοσύνη은 가난한 사람을 돕는 구체적 베풂이라는 뜻에서 ‘구제’가 ‘자선’보다 더 정확합니다.
  naturalness: ‘구제와 의를 행하는 사람들’은 현대 표준 한국어의 성경 문체에서 자연스럽고, 합쇼체 미래형 ‘것입니다’와도 잘 어울립니다. 각주에 있던 ‘생명으로 배부르게’는 한국어에서 다소 어색하므로 ‘생명을 풍성히 누리게’로 다듬는 것이 자연스럽습니다.
  terminology: ἐλεημοσύνη은 ‘구제’로, δικαιοσύνας는 본문의 핵심 용어와 실천적 복수형의 폭을 보존하여 ‘의’로 옮깁니다. 죄의 정화와 죽음으로부터의 구원이라는 직접적 진술은 해설이나 교리적 완화 없이 유지합니다.
  issues:
  - severity: medium
    issue: ‘깨끗하게 할 것입니다’가 ἀποκαθαριεῖ의 제거·정화의 힘을 충분히 드러내지 못합니다.
    rationale: 이 합성동사는 죄를 정결하게 할 뿐 아니라 씻어 없애는 의미를 띠므로, ‘깨끗이 씻어 낼 것입니다’가 문맥과 어휘 의미를 더 잘 반영합니다.
  - severity: low
    issue: ‘자선’은 ἐλεημοσύνη의 구체적인 구제 행위보다 다소 넓고 추상적으로 들릴 수 있습니다.
    rationale: 이 문맥에서는 궁핍한 이에게 베푸는 행위를 가리키는 ‘구제’가 한국어에서 더 직접적입니다.
  - severity: low
    issue: 각주의 ‘생명으로 배부르게’는 한국어 결합이 부자연스럽습니다.
    rationale: πλησθήσονται ζωῆς의 ‘충족되다/가득 누리다’라는 비유적 뜻은 ‘생명을 풍성히 누리게’로 자연스럽게 표현할 수 있습니다.
  revised_text: 구제는 죽음에서 건져 내고, 그것은 모든 죄를 깨끗이 씻어 낼 것입니다. 구제와 의를 행하는 사람들은 생명으로 채워질 것입니다.[a]
