  rationale: 구체적인 가난한 이들을 향한 베풂을 가리키므로, 추상적인 ‘자비’보다 한국어에서 더 자연스럽고 널리 이해되는 ‘자선’으로 옮겼습니다.
- source_word: ῥύεται
