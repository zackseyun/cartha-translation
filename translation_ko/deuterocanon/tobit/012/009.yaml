  alternative_readings:
  - 자선의 유익을 말하는 지혜문학적 일반화로 완화하기
  - 회개와 연결된 언약적 표현으로 설명을 덧붙이기
  rationale: 그리스어 본문이 직접적으로 말하는 긴장을 보존하는 것이 우선이므로, 구원론적 의미를 사후에 해설로 풀어 버리지 않았습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
