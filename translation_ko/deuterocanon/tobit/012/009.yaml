translation:
  language: ko
  text: 구제는 죽음에서 건져 내고, 그것은 모든 죄를 깨끗이 씻어 낼 것입니다. 구제와 의를 행하는 사람들은 생명으로 채워질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구제와 의로운 일을 실천하는 사람들은 생명을 풍성히 누리게 될 것입니다.’
    reason: lexical_alternative
lexical_decisions:
