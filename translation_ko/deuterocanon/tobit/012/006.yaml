base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/006.yaml
  text: And calling the two of them privately[a], he said to them, “Bless God and give thanks to him; give him greatness, and give thanks to him before all the living for what he has done with you. It is good to bless God and to exalt his name, showing forth with honor the words of the works of God[c][b]; and do not be reluctant
  footnotes:
  - marker: a
    text: Greek literally, 'give him greatness'; the sense is to ascribe greatness or honor to God.
    reason: lexical_alternative
  - marker: b
    text: Greek literally, 'for what he has done with you'; this may also be understood as 'for what he has done for you.'
    reason: lexical_alternative
  - marker: c
    text: The Greek witness provided is incomplete at the end of the verse, ending with 'and do not ...'; the prohibition continues in the following verse.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 두 사람을 몰래 불러서 그들에게 말했습니다. 「하나님을 찬송하고 그분께 감사드리십시오. 그분께 영광을 돌리며, 모든 살아 있는 사람 앞에서 그분께 감사드리십시오. 그분이 여러분과 함께 행하신 일 때문에 말입니다. 하나님을 찬송하고 그분의 이름을 높이는 것은 좋은 일이며, 하나님이 하신 일의 말씀을 존귀하게 전하는 것입니다. 그리고 …」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어의 뜻은 문자적으로는 ‘그에게 위대함을 드리라’이지만, 여기서는 하나님께 위엄과 존귀를 돌리라는 의미입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어의 구문은 문자적으로는 ‘여러분과 함께 행하신 것에 대하여’이며, 문맥상 ‘여러분을 위해 하신 일’로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 제공된 그리스어 증인은 여기서 절이 끝나며, 다음 절에서 금지문이 이어집니다.
    reason: textual_variant
lexical_decisions:
- source_word: κρυπτῶς
  english_pob_choice: privately
  chosen_korean: 몰래
  alternatives_korean:
  - 은밀히
  - 따로
  - 개인적으로
  lexicon: BDAG
  rationale: 이 부사는 다른 사람들로부터 떨어져서 말한 상황을 가리키므로, 자연스러운 한국어로는 ‘몰래’ 또는 ‘따로’가 가능하지만, 여기서는 공개석상과 대비되는 분리성을 살리기 위해 ‘몰래 불러서’로 옮겼습니다.
- source_word: Εὐλογεῖτε τὸν θεόν
  english_pob_choice: Bless God
  chosen_korean: 하나님을 찬송하고
  alternatives_korean:
  - 하나님을 복 주고
  - 하나님을 축복하고
  - 하나님을 찬양하고
  lexicon: BDAG
  rationale: 하나님을 향한 εὐλογεῖτε는 한국 교회 독자에게 ‘복 주다’로 오해되기 쉬워, ‘찬송하다’로 풀어 하나님을 높이는 축복-찬양의 뜻을 자연스럽게 드러냈습니다.
- source_word: μεγαλωσύνην δίδοτε αὐτῷ
  english_pob_choice: give him greatness
  chosen_korean: 그분께 영광을 돌리며
  alternatives_korean:
  - 그분께 위대함을 드리며
  - 그분께 عظ대함을 드리며
  - 그분께 크심을 드리며
  lexicon: BDAG
  rationale: 직역하면 ‘위대함을 드리다’이지만 한국어에서는 어색하므로, POB가 보존한 의미를 따라 하나님께 위엄과 존귀를 돌린다는 뜻을 ‘영광을 돌리며’로 옮겼습니다.
- source_word: ἐνώπιον πάντων τῶν ζώντων
  english_pob_choice: before all the living
  chosen_korean: 모든 살아 있는 사람 앞에서
  alternatives_korean:
  - 모든 산 자 앞에서
  - 모든 생명 앞에서
  - 모든 사람 앞에서
  lexicon: BDAG
  rationale: ‘살아 있는 모든 이들’이라는 공개적 범위를 현대 한국어로 분명하게 전달하기 위해 ‘모든 살아 있는 사람 앞에서’로 옮겼습니다.
- source_word: τοὺς λόγους τῶν ἔργων τοῦ θεοῦ ἐντίμως ὑποδεικνύντες
  english_pob_choice: showing forth with honor the words of the works of God
  chosen_korean: 하나님이 하신 일의 말씀을 존귀하게 전하는 것입니다
  alternatives_korean:
  - 하나님이 하신 일의 말을 존귀하게 보여 주는 것입니다
  - 하나님의 일들의 말을 सम्मान스럽게 드러내는 것입니다
  - 하나님이 하신 일의 말을 품위 있게 드러내는 것입니다
  lexicon: BDAG
  rationale: 그리스어 표현은 압축적이어서 직역만으로는 한국어가 부자연스럽습니다. ‘ἐντίμως’의 품위/존귀의 뉘앙스를 살리면서, ‘ὑποδεικνύντες’의 보여 주고 전하는 행위를 ‘전하는 것입니다’로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 공적 감사와 찬송의 결합을 어떻게 드러낼 것인가
  chosen_reading: ‘하나님을 찬송하고 그분께 감사드리십시오’로 병렬 유지
  alternative_readings:
  - ‘하나님을 찬양하고 감사하십시오’
  - ‘하나님을 복되게 하고 감사하십시오’
  rationale: 본문은 단순한 감정 표현이 아니라 하나님께 대한 공개적 축복과 감사의 행위를 함께 명령합니다. 두 동사를 병렬로 유지해 예배적·증언적 성격을 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 6
- issue: 본문이 ἐντίμως ὑποδεικνύντες 뒤에서 끊기는 절단 상태를 어떻게 표시할 것인가
  chosen_reading: 끝을 생략 부호로 열어 두어 다음 절로 이어짐을 암시
  alternative_readings:
  - 완결된 문장처럼 마침표로 닫기
  - 추정 보완하여 다음 절의 금지문까지 합치기
  rationale: 제공된 그리스어 사본은 절 끝에서 중단됩니다. 의미를 임의로 보충하지 않고, 절단된 상태를 한국어에서도 드러내는 것이 소스 충실성에 부합합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 6
