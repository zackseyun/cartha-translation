  source_fidelity: 수정이 필요합니다. κρυπτῶς의 핵심은 남몰래라는 은밀성보다 다른 이들과 떨어져 말한 상황이므로 ‘따로’가 더 정확합니다. 또한 ἀγαθὸν 이하의 부정사들과 분사구는 ‘좋은 일’의 내용을 이루므로, 마지막 구를 ‘…것입니다’라는 별도 서술로 처리한 현 초안은 문장 구조를 바꿉니다. 제공된 본문은 μὴ에서 끊기므로 이를 한국어에서도 미완성 명령으로 표시해야 합니다.
  naturalness: ‘하나님께 영광을 돌리며’와 ‘하나님이 하신 일의 말씀’은 각각 접속된 명령과 압축된 그리스어 구문을 자연스럽게 전달하지 못합니다. ‘그분의 위대하심을 돌리십시오’ 및 ‘하나님께서 하신 일들을 존귀하게 알리는 것’으로 정리하면 현대 표준 한국어 합쇼체로 자연스럽습니다.
  terminology: ‘찬송하다’, ‘감사드리다’, ‘그분의 이름을 높이다’는 적절합니다. μεγαλωσύνην은 ‘영광’으로 평준화하기보다 ‘위대하심’으로 옮기고, 각주에서 그리스어의 직역과 관용적 의미를 밝혀야 합니다. ‘하나님의 행하신 일’은 주체 높임이 불필요하게 겹치므로 ‘하나님께서 하신 일’이 낫습니다.
  issues:
  - severity: medium
    issue: κρυπτῶς를 ‘몰래’로 번역함
    rationale: ‘몰래’는 숨기거나 부정한 행동이라는 불필요한 뉘앙스를 줄 수 있습니다. 문맥상 두 사람을 다른 이들에게서 떼어 놓고 말한 것이므로 ‘따로’가 적절합니다.
  - severity: high
    issue: ἀγαθὸν 이하의 문장 구조가 변경됨
    rationale: ‘하나님을 찬송하고 … 전하는 것은 좋은 일이며, … 전하는 것입니다’는 마지막 분사구를 별도 술어로 만듭니다. 원문은 하나님을 찬송하고 이름을 높이며 그 일들을 존귀하게 알리는 전체가 좋은 일이라고 말합니다.
  - severity: medium
    issue: 제공된 절단 본문 끝의 μὴ가 번역에 반영되지 않음
    rationale: 원문은 ‘그리고 하지 말라…’라는 금지 명령의 시작에서 중단됩니다. 단순 생략 부호만으로는 남아 있는 μὴ의 명령 기능이 사라집니다.
  - severity: medium
    issue: 각주 표지가 해당 어구에 붙어 있지 않음
    rationale: 위대하심, ‘여러분과 함께’, 본문 절단에 관한 각주가 모두 문장 끝에 일괄 배치되어 참조 대상이 불명확합니다. 각주 내용이 설명하는 어구 또는 절단 표지에 각각 붙여야 합니다.
