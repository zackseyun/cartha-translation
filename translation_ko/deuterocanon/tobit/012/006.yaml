- from: 그리고 두 사람을 몰래 불러서 그들에게 말했습니다. 「하나님을 찬송하고 그분께 감사드리십시오. 그분께 영광을 돌리며, 모든 살아 있는 사람 앞에서 그분께 감사드리십시오. 그분이 여러분과 함께 행하신 일 때문에 말입니다. 하나님을 찬송하고 그분의 이름을 높이는 것은 좋은 일이며, 하나님이 하신 일의 말씀을 존귀하게 전하는 것입니다. 그리고 …」[a][b][c]
  to: 그리고 그 두 사람을 따로 불러 그들에게 말했습니다. “하나님을 찬송하고 그분께 감사드리십시오. 그분께 그분의 위대하심을 돌리십시오[a]. 모든 살아 있는 이들 앞에서, 그분께서 여러분과 함께 하신 일 때문에 그분께 감사드리십시오[b]. 하나님을 찬송하고 그분의 이름을 높이며, 하나님께서 하신 일들을 존귀하게 알리는 것은 좋은 일입니다. 그리고 … 하지 마십시오[c]”
  rationale: 원문의 어순과 반복을 가능한 한 보존하되, 한국어에서 명령의 병렬과 ‘좋은 일’의 범위가 분명하도록 문장을 재구성했습니다. ‘따로’는 κρυπτῶς의 문맥상 의미를, ‘그분의 위대하심’은 μεγαλωσύνην의 어휘적 내용을 보존합니다. 마지막은 원문에 남아 있는 μὴ를 ‘… 하지 마십시오’로 표시하여, 내용 보충 없이 절단 상태를 드러냈습니다. 각주 표지도 각 설명 대상에 맞추어 재배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:55:06Z'
