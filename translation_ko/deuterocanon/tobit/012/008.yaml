  source_fidelity: 첫째 문장의 μετὰ는 ‘함께’의 동반 관계를 나타내며, 초안의 ‘의를 지키는’은 둘째 문장의 μετὰ δικαιοσύνης를 능동적으로 ‘의를 지키다’로 해석하여 원문의 열린 표현을 좁힙니다. 또한 ἀδικία는 ‘의가 없는’보다 ‘불의’로 옮겨야 δικαιοσύνη와의 어휘적 대조 및 ‘불의/부정’의 적극적 의미가 보존됩니다.
  naturalness: ‘금을 쌓아 두다’와 ‘구제를 행하다’는 현대의 격식 있는 성경 문체에서 자연스럽습니다. 다만 ‘금식과 자선과 의를 함께하는 기도’는 수식 관계가 다소 불분명하므로 ‘…와 함께 드리는 기도’가 더 분명합니다. 각주 표지도 해당 어구 바로 뒤에 놓는 것이 자연스럽습니다.
