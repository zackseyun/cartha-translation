  text: Prayer with fasting[a], almsgiving, and righteousness is good; a little with righteousness is better than much with unrighteousness[b]. It is good to do almsgiving rather than to store up gold.
  footnotes:
  - marker: a
    text: Or 'justice' ... 'injustice' for 'righteousness' ... 'unrighteousness.'
    reason: lexical_alternative
  - marker: b
    text: The final clause is literally 'to do almsgiving rather than to store up gold'; English could also be rendered more idiomatically, 'to give alms rather than to store up gold.'
    reason: lexical_alternative
translation:
  language: ko
  text: 금식과 자선과 의를 함께하는 기도는 선합니다. 의를 지키는 적은 것이 의가 없는 많은 것보다 낫습니다. 자선을 행하는 것이 금을 쌓아 두는 것보다 좋습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자선’은 여기서 가난한 이들에게 주는 구제 행위를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘의가 없는 많은 것’은 원문의 ἀδικία를 자연스럽게 풀어쓴 표현입니다. 직역하면 ‘불의 가운데 있는 많은 것’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσευχὴ μετὰ νηστείας καὶ ἐλεημοσύνης καὶ δικαιοσύνης
  english_pob_choice: Prayer with fasting, almsgiving, and righteousness
  chosen_korean: 금식과 자선과 의를 함께하는 기도
  alternatives_korean:
  - 금식과 구제와 의를 곁들인 기도
  - 금식과 자선과 정의를 동반한 기도
  lexicon: LSJ
  rationale: μετά는 단순 동반을 나타내므로 ‘함께하는’으로 자연스럽게 옮겼고, ἐλεημοσύνη는 유대-헬라어 문맥의 ‘구제’보다 더 직접적인 ‘자선’을 선택해 행위를 드러냈습니다.
- source_word: δικαιοσύνης / ἀδικίας
  english_pob_choice: righteousness / unrighteousness
  chosen_korean: 의 / 의가 없는
  alternatives_korean:
  - 정의 / 불의
  - 의로움 / 불의함
  lexicon: LSJ
  rationale: 프로젝트 기본값에 따라 δικαιοσύνη는 ‘의’로 유지하되, 대조되는 ἀδικία는 본문 구조를 살려 ‘의가 없는’으로 풀어 반복 대비를 자연스럽게 드러냈습니다.
- source_word: τὸ ὀλίγον ... πολὺ
  english_pob_choice: a little ... much
  chosen_korean: 적은 것 ... 많은 것
  alternatives_korean:
  - 조금 ... 많이
  - 적은 양 ... 많은 양
  lexicon: LSJ
  rationale: 관사와 중성형의 명사적 용법을 한국어에서는 사물화된 표현 ‘적은 것 / 많은 것’으로 옮겨 잠언적 대비를 살렸습니다.
- source_word: ποιῆσαι ἐλεημοσύνην
  english_pob_choice: to do almsgiving
  chosen_korean: 자선을 행하는 것
  alternatives_korean:
  - 구제를 하는 것
  - 자선을 베푸는 것
  lexicon: LSJ
  rationale: ‘do almsgiving’의 동사적 구조를 한국어에서는 ‘행하다’로 옮겨 앞의 ἐλεημοσύνη와 어근 대응을 유지했습니다.
- source_word: θησαυρίσαι χρυσίον
  english_pob_choice: to store up gold
  chosen_korean: 금을 쌓아 두는 것
  alternatives_korean:
  - 금을 저장하는 것
  - 황금을 축적하는 것
  lexicon: LSJ
  rationale: θησαυρίζω의 축적 의미를 ‘쌓아 두다’로 자연스럽게 옮겨 단순 보관보다 누적적 축적의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: δικαιοσύνη의 한국어 처리
  chosen_reading: ‘의’로 번역해 도덕적·신앙적 올바름을 드러냈습니다.
  alternative_readings:
  - ‘정의’로 번역해 사회윤리적 의미를 강조할 수 있습니다.
  - ‘의로움’으로 번역해 상태성을 강조할 수 있습니다.
  rationale: 토빗의 잠언적 문맥에서는 δικαιοσύνη가 단지 법정적 정의보다 하나님 앞의 바른 삶을 포함하므로, 프로젝트 기본값인 ‘의’를 유지하는 편이 원문 의미를 넓게 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: δικαιοσύνη → 의'
