  text: And now give thanks to God[a], because I am ascending to the one who sent me; and write all that has been accomplished in a book.
  footnotes:
  - marker: a
    text: Or 'confess to God' or 'praise God'; the Greek verb can cover acknowledgment expressed in thanksgiving or praise.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 하나님께 감사드리십시오. 나는 나를 보내신 분께로 올라가고 있습니다. 그리고 이루어진 모든 것을 책에 쓰십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님께 고백하십시오’, ‘하나님을 찬양하십시오’. 이 그리스어 동사는 하나님께 드리는 감사나 찬양의 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξομολογεῖσθε
  english_pob_choice: give thanks
  chosen_korean: 감사드리십시오
  alternatives_korean:
  - 고백하십시오
  - 찬양하십시오
  lexicon: BDAG
  rationale: 하나님께 대한 여격과 문맥상, 이 동사는 죄 고백보다 감사와 찬양의 공개적 응답을 가리키므로 한국어로는 자연스럽게 ‘감사드리십시오’가 가장 적합합니다.
- source_word: ἀναβαίνω
  english_pob_choice: am ascending
  chosen_korean: 올라가고 있습니다
  alternatives_korean:
  - 올라갑니다
  - 올라가고 있습니다
  lexicon: BDAG
  rationale: 현재형의 임박한 진행을 살리면서도, 하늘로 올라가는 의미를 과장 없이 드러내기 위해 ‘올라가고 있습니다’로 옮겼습니다.
- source_word: τὸν ἀποστείλαντά με
  english_pob_choice: the one who sent me
  chosen_korean: 나를 보내신 분
  alternatives_korean:
  - 나를 보내신 분께
  - 보내신 분
  lexicon: BDAG
  rationale: 분사구를 한국어 관계절로 풀어 자연스럽게 표현하되, 보내신 분의 인격적 주체성을 유지하기 위해 ‘나를 보내신 분’으로 옮겼습니다.
- source_word: πάντα τὰ συντελεσθέντα
  english_pob_choice: all that has been accomplished
  chosen_korean: 이루어진 모든 것
  alternatives_korean:
  - 성취된 모든 것
  - 다 이루어진 모든 것
  lexicon: BDAG
  rationale: 완료된 사건들을 가리키는 표현이므로 ‘이루어진’이 가장 직역에 가깝고, 한국어 문맥에서도 결과가 완결된 일들을 잘 전달합니다.
theological_decisions:
- issue: Raphael의 ‘올라감’과 보내신 분의 정체
  chosen_reading: 본문의 범위를 넘지 않고 ‘나를 보내신 분께로 올라가고 있습니다’로 옮겨, 하늘로의 상승과 파송의 관계를 그대로 드러냈습니다.
  alternative_readings:
  - ‘돌아갑니다’로 완화하여 번역
  - 보내신 분을 하나님이라고 명시
  rationale: 그리스어는 상승과 파송을 함께 말하지만, 여기서 다시 하나님을 명시하지는 않습니다. 따라서 신학적 함의를 유지하되 본문 이상의 설명은 덧붙이지 않았습니다.
  doctrine_reference: 본문의 신학적 긴장 보존
