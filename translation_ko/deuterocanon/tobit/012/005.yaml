  rationale: 토빗기 12장에서는 이 인물이 천상 존재로 분명하므로, ‘사자’보다 ‘천사’가 서술 정체를 더 정확히 드러냅니다.
- source_word: Λάβε
  english_pob_choice: Take
  chosen_korean: 가져가십시오
  alternatives_korean:
  - 받으십시오
  - 취하십시오
  lexicon: BDAG
  rationale: 상대에게 몫을 내어 주는 상황이므로 단순한 ‘받다’보다 ‘가져가다’가 행위의 방향을 더 잘 살리며, 합쇼체 명령으로도 자연스럽습니다.
- source_word: τὸ ἥμισυ πάντων
  english_pob_choice: half of everything
  chosen_korean: 모든 것의 절반
  alternatives_korean:
