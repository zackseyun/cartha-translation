  source_fidelity: 그리스어의 순서와 미완성 관계절(ὧν)은 보존되어야 합니다. 초안의 ‘모든 것의 절반을…’은 ὧν이 이끄는 미완성 관계절을 단순한 문장 말미의 생략으로 처리하여, 관계절이 ‘모든 것’을 한정한다는 구조를 충분히 드러내지 못합니다.
  naturalness: ‘그는 천사를 불러 그에게 말했습니다’와 ‘가져가십시오’는 현대 표준어 합쇼체로 자연스럽습니다. 다만 인용문 안에서 미완성 관계절을 ‘…한 모든 것’으로 표시하면 원문의 끊김 위치와 문법 기능을 더 정확하고 읽기 쉽게 나타낼 수 있습니다.
  terminology: ‘천사’는 토빗기 12장의 문맥에 적절하며, ‘절반’과 ‘가져가십시오’도 각각 τὸ ἥμισυ와 Λάβε를 자연스럽게 반영합니다.
  issues:
