  lexicon: BDAG
  rationale: ἄγγελον을 부르는 동작을 자연스럽게 나타내는 기본 동사로, 문맥상 과도한 격식이 없는 ‘부르다’가 가장 적절합니다.
- source_word: τὸν ἄγγελον
