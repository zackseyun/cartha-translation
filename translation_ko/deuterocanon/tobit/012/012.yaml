  text: And now[a], when you and your bride Sarah were praying, I brought the memorial of your prayer before the Holy One. And when you were burying the dead[c][b], I likewise was with you.
  footnotes:
  - marker: a
    text: Or 'your wife Sarah'; Greek νύμφη can mean 'bride' or 'young wife.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the remembrance of your prayer,' possibly with a cultic sense like a memorial offering brought before God.
    reason: lexical_alternative
  - marker: c
    text: '''The Holy One'' here refers to God in context.'
    reason: alternative_reading
translation:
  language: ko
  text: 이제 너와 네 신부 사라가 기도할 때, 내가 너희 기도의 기념물을 거룩하신 분 앞에 가져갔습니다. 그리고 네가 죽은 이들을 묻을 때에도 나는 너와 함께 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: νύμφη는 ‘신부’ 또는 ‘아내’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: μνημόσυνον은 ‘기념’ 또는 예배적 의미의 ‘기념물(기념 제물)’일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 여기서 ‘거룩하신 분’은 문맥상 하나님을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: νύμφη
  english_pob_choice: your bride Sarah
  chosen_korean: 네 신부 사라
  alternatives_korean:
  - 네 아내 사라
  - 네 신부인 사라
  lexicon: LSJ
  rationale: νύμφη는 문자적으로 ‘신부/젊은 아내’이므로, POB의 ‘bride’에 맞춰 ‘신부’로 살리되 자연스러운 한국어 어순으로 옮겼습니다.
- source_word: προσήγαγον τὸ μνημόσυνον
  english_pob_choice: I brought the memorial
  chosen_korean: 내가 너희 기도의 기념물을 가져갔습니다
  alternatives_korean:
  - 내가 너희 기도의 기념을 가져갔습니다
  - 내가 너희 기도의 기억물을 가져갔습니다
  - 내가 너희 기도의 기념 제물을 가져갔습니다
  lexicon: LSJ
  rationale: μνημόσυνον은 ‘기념/기억’과 예배적 ‘기념물’의 여지를 함께 가지므로, POB의 ‘memorial’에 맞춰 ‘기념물’로 두어 예배적 뉘앙스를 보존했습니다.
- source_word: ἐνώπιον τοῦ ἁγίου
  english_pob_choice: before the Holy One
  chosen_korean: 거룩하신 분 앞에
  alternatives_korean:
  - 거룩하신 이 앞에
  - 성자 앞에
  - 성인 앞에
  lexicon: LSJ
  rationale: ἁγίος는 여기서 인간 성인이 아니라 하나님을 가리키므로, ‘거룩하신 분’으로 번역해 경외성과 지시 대상을 분명히 했습니다.
- source_word: ἐθάπτες τοὺς νεκρούς
  english_pob_choice: when you were burying the dead
  chosen_korean: 네가 죽은 이들을 묻을 때에도
  alternatives_korean:
  - 네가 죽은 사람들을 묻을 때에도
  - 네가 시신들을 장사할 때에도
  lexicon: LSJ
  rationale: ἐθάπτες는 미완료로 반복·진행의 상황을 나타내므로 ‘묻을 때에도’로 살렸고, τοὺς νεκρούς는 직역된 ‘죽은 이들’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: ἁγίου의 지시 대상
  chosen_reading: ‘거룩하신 분’은 하나님을 가리키는 표현으로 이해했습니다.
  alternative_readings:
  - 천상적 거룩한 존재나 천사적 현존을 가리킬 가능성
  rationale: 문맥상 라파엘이 기도를 하나님 앞에 올려놓았다고 말하므로, 원문의 모호성을 보존하되 한국어 본문에서는 하나님 지시를 분명하게 드러냈습니다.
  doctrine_reference: 원문 우선 원칙; 번역 전통보다 본문의 문맥적 지시를 따름
