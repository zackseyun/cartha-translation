  - 그 하나님
  lexicon: BDAG
  rationale: 관사가 붙은 목적어를 한국어에서는 보통 ‘하나님’으로 자연스럽게 옮기며, 불필요한 관사 감각을 살린 ‘그 하나님’은 어색합니다.
- source_word: τὸν βασιλέα τὸν μέγαν
