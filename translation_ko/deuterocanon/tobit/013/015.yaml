  lexicon: BDAG
  rationale: βασιλεύς와 μέγας의 결합은 하나님을 높이는 왕적 칭호이므로, 단순한 크기보다 존귀와 위엄을 드러내는 ‘위대하신 왕’이 가장 적절합니다.
theological_decisions:
- issue: 하나님을 향한 왕적 칭호의 표현
  chosen_reading: ‘위대하신 왕’으로 하나님을 직접 수식하는 형태
  alternative_readings:
  - ‘큰 왕’으로 직역
  - ‘왕이신 하나님’으로 재배열
  rationale: 헬라어는 하나님과 ‘왕, 위대하신 분’을 병치하여 한 인물에 대한 칭호로 제시하므로, 한국어도 구조를 유지해 하나님을 위엄 있는 왕으로 높이는 뜻을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; preserve appositional exaltation'
