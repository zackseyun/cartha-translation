  lexicon: BDAG
  rationale: εὐλογέω의 명령형은 하나님께 ‘복을 빌다’의 의미도 있으나, 이 문맥에서는 하나님께 드리는 경외의 찬양을 자연스럽게 드러내는 ‘찬양하십시오’가 합쇼체에서 가장 직접적입니다.
- source_word: τὸν θεὸν
  english_pob_choice: God
