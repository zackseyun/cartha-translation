  source_fidelity: βηρύλλῳ는 ‘베릴’(beryl)이며, ‘벽옥’은 통상 ἴασπις(jasper)에 해당하므로 본문 보석명을 바로잡아야 합니다. ἄνθραξ는 이 문맥에서 전통적으로 ‘홍옥수’로 옮길 수 있고, Σουφείρ는 본문대로 ‘수피르’로 음역한 처리도 적절합니다. ‘포장될 것입니다’는 ψηφολογηθήσονται의 건축적 뜻을 잘 전달합니다.
  naturalness: 합쇼체 문장으로 자연스럽습니다. ‘수피르에서 난 돌’은 출처를 나타내는 ἐκ를 자연스럽게 반영합니다. 다만 보석명은 현대 독자에게도 식별 가능한 ‘베릴’이 더 적절합니다.
