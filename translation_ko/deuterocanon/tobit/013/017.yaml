base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/017.yaml
  text: And the streets of Jerusalem will be paved with beryl and carbuncle and stones from Suphir[a].
  footnotes:
  - marker: a
    text: Or 'stones of Ophir,' if Σουφείρ is understood as the place-name Ophir rather than transliterated directly from the Greek witness.
    reason: alternative_reading
translation:
  language: ko
  text: 예루살렘의 거리들은 베릴과 홍옥수와 수피르에서 난 돌로 포장될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오빌의 돌’. Σουφείρ를 그리스어 본문의 형태대로 음역한 ‘수피르’가 아니라, 오빌이라는 지명으로 이해할 경우의 대안입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: πλατεῖαι
  english_pob_choice: streets
  chosen_korean: 거리들
  alternatives_korean:
  - 넓은 길들
  - 광장들
  lexicon: LSJ
  rationale: 도시의 번영을 묘사하는 문맥에서 πλατεῖαι는 넓은 도로나 거리의 뜻이 자연스럽고, 한국어에서는 ‘거리들’이 가장 간결하고 현대적입니다.
- source_word: βηρύλλῳ
  english_pob_choice: beryl
  chosen_korean: 벽옥
  alternatives_korean:
  - 베릴
  - 베릴석
  lexicon: LSJ
  rationale: 원문의 보석 목록을 한국어 독자에게 자연스럽게 전달하기 위해, 통용되는 보석명인 ‘벽옥’을 택했습니다.
- source_word: ἄνθρακι
  english_pob_choice: carbuncle
  chosen_korean: 홍옥수
  alternatives_korean:
  - 가넷
  - 루비빛 돌
  lexicon: LSJ
  rationale: 여기서는 일반 ‘숯’이 아니라 광택 있는 귀석을 가리키므로, 붉은 보석을 뜻하는 ‘홍옥수’로 옮기는 것이 문맥에 맞습니다.
- source_word: λίθῳ ἐκ Σουφεὶρ
  english_pob_choice: stones from Suphir
  chosen_korean: 수피르에서 난 돌
  alternatives_korean:
  - 수피르의 돌
  - 오빌의 돌
  lexicon: LSJ
  rationale: 그리스어 사본의 지명 형식 Σουφείρ를 따라 ‘수피르’로 음역하고, ‘ἐκ’의 출처 의미를 살려 ‘~에서 난’으로 옮겼습니다.
- source_word: ψηφολογηθήσονται
  english_pob_choice: will be paved
  chosen_korean: 포장될 것입니다
  alternatives_korean:
  - 모자이크로 깔릴 것입니다
  - 조약돌로 깔릴 것입니다
  lexicon: LSJ
  rationale: 이 동사는 돌이나 자갈을 깔아 길을 만드는 뜻이므로, 현대 한국어에서는 건축적 의미를 가장 분명하게 드러내는 ‘포장될 것입니다’가 적절합니다.
theological_decisions:
- issue: 지명 Σουφείρ의 처리
  chosen_reading: 본문에는 그리스어 증거를 따라 ‘수피르’로 두고, 별도의 해석적 지명 대체는 하지 않았습니다.
  alternative_readings:
  - ‘오빌’로 동일시하는 해석
  - 지명을 뜻하지 않는 일반 보석/돌로 완화하는 해석
  rationale: 영어 POB도 본문은 직접 음역을 유지하고 대안으로만 ‘Ophir’를 제시하므로, 본문에서는 사본 표면형을 보존하는 것이 더 투명합니다.
  doctrine_reference: 본문비평/지명 식별
