base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/002.yaml
  text: For he afflicts and shows mercy; he brings down to Hades and brings up[a], and there is no one who will escape his hand.
  footnotes:
  - marker: a
    text: 'Or ''to the grave'' or ''to the realm of the dead.'' Greek: ''to Hades.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 치시기도 하고 자비를 베푸시며 — 스올로 내리기도 하시고 다시 올리시기도 하십니다[a]. 아무도 그의 손에서 벗어날 수 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죽음의 세계로’. 헬라어는 ‘하데스’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαστιγοῖ
  english_pob_choice: afflicts
  chosen_korean: 치시기도 하고
  alternatives_korean:
  - 괴롭히시기도 하고
  - 징계하시기도 하고
  - 채찍질하시기도 하고
  lexicon: LSJ
  rationale: 직역의 물리적 이미지보다, 시편식 찬양문맥에서의 하나님의 징계·고난 주심을 살리되 과도하게 제한하지 않기 위해 ‘치시다’를 택했습니다.
- source_word: ἐλεᾷ
  english_pob_choice: shows mercy
  chosen_korean: 자비를 베푸시며
  alternatives_korean:
  - 긍휼을 보이시며
  - 불쌍히 여기시며
  lexicon: LSJ
  rationale: 앞의 ‘치시다’와 짝을 이루는 대조를 살리면서 현대 한국어에서 자연스럽고 공손한 표현으로 ‘자비를 베푸시다’를 사용했습니다.
- source_word: εἰς ᾅδην
  english_pob_choice: to Hades
  chosen_korean: 스올로
  alternatives_korean:
  - 하데스로
  - 무덤으로
  - 죽은 자들의 나라로
  lexicon: LSJ
  rationale: 헬라어 본문이 ᾅδης를 직접 지시하므로, 이를 성경 전통의 대응어인 ‘스올’로 옮겨 죽음의 영역이라는 개념을 유지했습니다.
- source_word: οὐκ ἔστιν ὃς ἐκφεύξεται τὴν χεῖρα αὐτοῦ
  english_pob_choice: there is no one who will escape his hand
  chosen_korean: 아무도 그의 손에서 벗어날 수 없습니다
  alternatives_korean:
  - 아무도 그의 손을 피할 수 없습니다
  - 아무도 그의 손을 빠져나갈 수 없습니다
  lexicon: LSJ
  rationale: ‘손’은 권능과 지배의 비유이므로 그대로 살리되, 한국어 관용에 맞게 ‘벗어날 수 없습니다’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: ᾅδης의 번역을 한국어 성경 용어로 어떻게 유지할지
  chosen_reading: ‘스올’로 옮겨, 하나님이 죽음의 영역에 대해 주권을 가지신다는 점을 드러냈습니다.
  alternative_readings:
  - ‘무덤’으로 풀어 설명하기
  - ‘하데스’ 음역을 그대로 쓰기
  rationale: 본문은 하나님이 낮추기도 하고 올리기도 하시는 주권을 찬양하며, ᾅδης를 일반 무덤으로만 축소하면 이 대조가 약해집니다. 동시에 교리적으로 종말론적 세부를 결정짓지 않도록 개념어를 유지했습니다.
  doctrine_reference: 죽음과 스올에 대한 하나님의 주권을 보존하되, 부활 교리의 세부는 본문이 넘어서지 않도록 유지
- issue: ‘치시기도 하고 자비를 베푸시며’의 대조적 병렬
  chosen_reading: 하나님의 징계와 긍휼을 함께 진술하는 병렬로 읽었습니다.
  alternative_readings:
  - 단순한 형벌과 회복의 서술
  - 고난과 구원의 일반적 요약
  rationale: 헬라어 동사의 병렬은 하나님의 두 측면을 함께 말하므로, 어느 한쪽으로 완화하지 않고 긴장을 그대로 보존하는 것이 본문의 의도에 가깝습니다.
  doctrine_reference: 하나님의 न्याय/긍휼의 병행을 보존
