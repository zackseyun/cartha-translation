translation:
  language: ko
  text: 이스라엘 자손들아, 이방 민족들 앞에서 그에게 감사하십시오. 그분께서 친히 우리를 그들 가운데 흩으셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘감사하십시오’는 이 동사의 가능한 뜻들(고백하다, 인정하다, 찬양하다) 가운데 이 문맥에 가장 적합한 선택입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξομολογεῖσθε
  english_pob_choice: Give thanks
  chosen_korean: 감사하십시오
  alternatives_korean:
  - 고백하십시오
  - 찬양하십시오
  lexicon: BDAG
  rationale: 문맥상 하나님의 행하신 일을 공개적으로 인정하고 감사하는 권면이므로, ‘감사하십시오’가 가장 자연스럽고 LXX식 예배 권면의 톤을 살립니다.
- source_word: οἱ υἱοὶ Ἰσραήλ
  english_pob_choice: O sons of Israel
  chosen_korean: 이스라엘 자손들아
  alternatives_korean:
  - 이스라엘의 아들들이여
  - 이스라엘 백성들아
  lexicon: BDAG
  rationale: 그리스어의 남성 복수 호격을 살려 직역에 가깝게 옮기되, 한국어에서는 자연스러운 호격 어미 ‘-들아’를 사용했습니다.
- source_word: ἐνώπιον τῶν ἐθνῶν
  english_pob_choice: before the nations
  chosen_korean: 이방 민족들 앞에서
  alternatives_korean:
  - 민족들 앞에서
  - 민족들 가운데서
  lexicon: BDAG
  rationale: 공적 증언의 자리라는 뜻을 보존하기 위해 ‘앞에서’로 옮겼고, ἔθνη의 기본 의미는 문맥상 ‘이방 민족들’이 가장 분명합니다.
- source_word: διέσπειρεν ἡμᾶς ἐν αὐτοῖς
  english_pob_choice: he himself has scattered us among them
  chosen_korean: 그분께서 친히 우리를 그들 가운데 흩으셨기 때문입니다
  alternatives_korean:
  - 그분께서 우리를 그들 가운데 흩으셨기 때문입니다
  - 그분께서 친히 우리를 그들 사이에 흩으셨기 때문입니다
  lexicon: BDAG
  rationale: 하나님이 직접 흩으셨다는 주어 강조를 ‘친히’로 살렸고, ἐν αὐτοῖς는 사람 집단 사이의 존재를 자연스럽게 나타내는 ‘그들 가운데’로 옮겼습니다.
theological_decisions:
- issue: 포로·흩어짐의 원인을 하나님께 직접 돌리는 표현
  chosen_reading: 그분께서 친히 우리를 그들 가운데 흩으셨기 때문입니다
  alternative_readings:
  - 우리의 흩어짐이 허락되었기 때문입니다
  - 그분께서 우리를 그들 가운데 흩으셨습니다
  rationale: 헬라어는 흩으신 주체를 명시적으로 하나님으로 돌리므로, 그 신학적 긴장을 완화하지 않고 그대로 유지했습니다.
  doctrine_reference: 하나님의 주권과 심판/섭리의 긴장
