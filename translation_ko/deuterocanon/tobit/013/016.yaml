base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/016.yaml
  text: For Jerusalem will be built with sapphire and emerald[a], and your walls with precious stones, and the towers and battlements with pure gold[c][b],
  footnotes:
  - marker: a
    text: Or 'will be rebuilt'; the Greek says simply 'will be built,' but the restoration context can suggest rebuilding.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek addresses Jerusalem directly: ''your walls.'''
    reason: cultural_note
  - marker: c
    text: '''Battlements'' translates a term for defensive fortifications; ''bulwarks'' or ''ramparts'' are also possible.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예루살렘은 사파이어와 에메랄드로 지어질 것이며[a], 네 성벽은[b] 보석으로, 탑들과 방어 시설들은[c] 순금으로 지어질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지어질 것입니다’는 헬라어의 단순한 미래 수동을 따른 번역입니다. 문맥상 ‘다시 지어질 것입니다’로도 이해할 수 있지만, 본문에는 그러한 의미를 명시하는 요소가 없습니다.
    reason: lexical_alternative
  - marker: b
    text: 헬라어는 예루살렘을 직접 향하여 ‘네 성벽’이라고 말합니다.
    reason: cultural_note
  - marker: c
    text: προμαχῶνες는 성벽과 관련된 방어 구조물 또는 방어 시설을 가리킵니다. ‘방벽’, ‘보루’, ‘성채’ 등으로도 옮길 수 있습니다.
    reason: lexical_alternative
