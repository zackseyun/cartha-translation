  rationale: 그리스어의 2인칭 소유격을 살려 예루살렘을 직접 호칭하는 형태로 유지했습니다.
- source_word: πύργοι καὶ οἱ προμαχῶνες
  english_pob_choice: the towers and battlements
  chosen_korean: 망루들과 성루들은
