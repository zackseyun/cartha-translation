- source_word: χρυσίῳ καθαρῷ
  english_pob_choice: with pure gold
  chosen_korean: 순금으로
  alternatives_korean:
  - 깨끗한 금으로
  - 정금으로
  lexicon: LSJ
  rationale: ‘깨끗한’보다 재료의 순수성과 광채를 잘 드러내는 한국어 관용인 ‘순금’이 더 자연스럽습니다.
theological_decisions:
