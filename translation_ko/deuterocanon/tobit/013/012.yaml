translation:
  language: ko
  text: 당신을 미워하는 자들은 모두 저주 아래 있고, 당신을 사랑하는 자들은 모두 영원히 복을 받을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπικατάρατοι
  english_pob_choice: cursed
  chosen_korean: 저주를 받을 것입니다
  alternatives_korean:
  - 저주받을 것입니다
  - 저주받은 자들입니다
  lexicon: ἐπικατάρατος
  rationale: 형용사적 선언을 한국어에서는 미래 종결의 판정문으로 풀어, 단순 상태 묘사보다 저주의 선고라는 힘을 드러냈습니다.
- source_word: μισοῦντές σε
  english_pob_choice: those who hate you
  chosen_korean: 당신을 미워하는 모든 사람
  alternatives_korean:
  - 당신을 미워하는 자들
  - 당신을 증오하는 모든 사람
  lexicon: μισέω
  rationale: 참여구문을 자연스러운 관계절로 옮기고, 대상 전체를 가리키는 πάντες를 반영해 ‘모든 사람’을 넣었습니다.
- source_word: εὐλογημένοι ἔσονται
  english_pob_choice: will be blessed
  chosen_korean: 복을 받을 것입니다
  alternatives_korean:
  - 복이 있을 것입니다
  - 복되게 될 것입니다
  lexicon: εὐλογέω
  rationale: 수동적 축복 선언을 한국어에서 가장 직접적으로 드러내는 표현은 ‘복을 받다’이므로 이를 택했습니다.
- source_word: εἰς τὸν αἰῶνα
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 영원토록
  - 세세토록
  lexicon: αἰών
  rationale: 시간 지속의 부사를 한국어 관용에 맞게 간결하게 처리했습니다.
theological_decisions:
- issue: 축복/저주 선언의 균형과 강도
  chosen_reading: 원문의 평행구조를 유지하여 미움과 사랑에 대한 하나님의 판정을 대칭적으로 드러냈습니다.
  alternative_readings:
  - 완화하여 ‘불행할 것이다 / 복되다’로 옮김
  - 예언적 선언을 생략하고 일반 격언처럼 처리함
  rationale: 본문은 단순한 도덕 격언이 아니라 공동체를 향한 축복과 저주의 선언이므로, 강도를 약화하지 않았습니다.
  doctrine_reference: 시편 129–137의 축복/저주 전통, 성경의 언약적 보응 언어
- issue: 대상 인칭의 직접성
  chosen_reading: 2인칭 단수 ‘당신’으로 유지했습니다.
  alternative_readings:
  - ‘너’를 사용함
  - 대상을 명시하지 않고 ‘그를’로 바꿈
  rationale: 그리스어의 σε가 직접 خطاب을 가리키므로, 한국어에서도 직접 호소를 살렸습니다.
  doctrine_reference: 성경의 직접 خطاب 보존 원칙
