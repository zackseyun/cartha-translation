base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/009.yaml
  text: 'Jerusalem[a], city of the Holy One: he will scourge you for the works of your children[b], and again he will show mercy to the children of the righteous.'
  footnotes:
  - marker: a
    text: Or 'city of the holy one'; the Greek genitive may be taken more generally, but in context it most likely refers to God.
    reason: lexical_alternative
  - marker: b
    text: Greek 'sons' in both phrases; rendered 'children' here because the sense is collective.
    reason: lexical_alternative
translation:
  language: ko
  text: '예루살렘[a], 거룩하신 이의 도시여: 그는 네 자녀들의 행위 때문에 너를 채찍질하실 것이며, 다시 의인들의 자녀들에게 자비를 베푸실 것입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거룩한 이의 도시’로도 옮길 수 있습니다. 그리스어 속격은 더 일반적으로 이해될 여지가 있으나, 문맥상 하나님을 가리키는 것으로 보는 것이 가장 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἱεροσόλυμα πόλις ἁγίου
  english_pob_choice: Jerusalem, city of the Holy One
  chosen_korean: 예루살렘, 거룩하신 이의 도시
  alternatives_korean:
  - 예루살렘, 거룩한 이의 도시
  - 예루살렘, 성하신 이의 도시
  - 예루살렘, 거룩한 도시
  lexicon: LSJ
  rationale: ἁγίου는 문맥상 도시 자체의 성별이 아니라 하나님을 가리키는 속격으로 읽는 것이 가장 자연스러워, POB의 ‘the Holy One’을 살려 ‘거룩하신 이’로 옮겼습니다.
- source_word: μαστιγώσει
  english_pob_choice: will scourge
  chosen_korean: 채찍질하실 것입니다
  alternatives_korean:
  - 징계하실 것입니다
  - 때리실 것입니다
  - 벌하실 것입니다
  lexicon: LSJ
  rationale: 동사의 강한 문자적 이미지(채찍질/매질)를 보존하되, 한국어에서 자연스럽고 문학적인 ‘채찍질하다’로 옮겼습니다.
- source_word: τὰ ἔργα τῶν υἱῶν σου
  english_pob_choice: the works of your children
  chosen_korean: 네 자녀들의 행위
  alternatives_korean:
  - 네 아들들의 행위
  - 네 자손들의 일
  - 네 자녀들의 일
  lexicon: LSJ
  rationale: ἔργα는 단순한 ‘일’보다 책임 있는 ‘행위’가 더 정확하고, υἱοί는 POB의 판단을 따라 집합적 의미의 ‘자녀들’로 옮겼습니다.
- source_word: τοὺς υἱοὺς τῶν δικαίων
  english_pob_choice: the children of the righteous
  chosen_korean: 의인들의 자녀들
  alternatives_korean:
  - 의인들의 아들들
  - 의로운 자들의 자녀들
  - 의인들의 후손들
  lexicon: LSJ
  rationale: 두 번째 υἱοί도 남성 표지보다 집합적 의미가 핵심이므로 ‘자녀들’로 일관되게 처리해, POB의 의미 중심 번역을 반영했습니다.
theological_decisions:
- issue: 하나님의 직접 행위로서의 징계와 자비
  chosen_reading: 주어를 명시하지 않는 그리스어를 한국어에서는 문맥상 하나님으로 이해해 ‘그는 … 하실 것이며 … 자비를 베푸실 것입니다’로 옮겼습니다.
  alternative_readings:
  - 주어를 생략한 채 ‘채찍질할 것이며 … 자비를 베푸실 것입니다’로 직역
  - 예루살렘을 의인화한 표현으로 읽기
  rationale: 문맥 전체가 징계와 자비를 베푸시는 하나님을 전제하므로, 한국어의 자연스러움을 위해 필요한 최소한의 주어를 보충하되 의미의 긴장을 유지했습니다.
  doctrine_reference: 문맥적 주어 보충은 허용하되, 신학적 주체는 본문이 암시하는 하나님으로 유지합니다.
