base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/009.yaml
  text: 'Jerusalem[a], city of the Holy One: he will scourge you for the works of your children[b], and again he will show mercy to the children of the righteous.'
  footnotes:
  - marker: a
    text: Or 'city of the holy one'; the Greek genitive may be taken more generally, but in context it most likely refers to God.
    reason: lexical_alternative
  - marker: b
    text: Greek 'sons' in both phrases; rendered 'children' here because the sense is collective.
    reason: lexical_alternative
translation:
  language: ko
  text: '예루살렘[a], 거룩하신 분의 도시여: 네 자녀들[b]의 행위 때문에 너를 채찍질하실 것이며, 다시 의인들의 자녀들에게 자비를 베푸실 것입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거룩한 분의 도시’로도 옮길 수 있습니다. 그리스어 속격은 더 일반적으로 이해될 여지가 있으나, 문맥상 하나님을 가리키는 것으로 보는 것이 가장 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 두 표현 모두 문자적으로 ‘아들들’입니다. 여기서는 집합적인 뜻을 살려 ‘자녀들’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἱεροσόλυμα πόλις ἁγίου
  english_pob_choice: Jerusalem, city of the Holy One
  chosen_korean: 예루살렘, 거룩하신 이의 도시
  alternatives_korean:
