base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/004.yaml
  text: There declare his greatness[a], and exalt him before every living being; for he is our Lord[c][b], and he is our God and our Father forever.
  footnotes:
  - marker: a
    text: Or 'show his majesty' for 'declare his greatness.' The Greek verb can mean 'show' or 'make known,' and the noun can also be rendered 'majesty.'
    reason: lexical_alternative
  - marker: b
    text: Greek literally, 'before every living [one].' The phrase is broad, though in context it most naturally refers to all living people.
    reason: lexical_alternative
  - marker: c
    text: Or 'for all the ages.' The Greek expression emphasizes unending duration.
    reason: lexical_alternative
translation:
  language: ko
  text: 거기서 그의 위대하심을 선포하고, 모든 살아 있는 존재 앞에서 그를 높이십시오. 그분은 우리의 주님이시며, 우리의 하나님이시고 우리의 아버지이십니다. 영원토록 말입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘위대하심’은 그리스어 μεγαλοσύνη를 자연스럽게 옮긴 것이며, 문맥에 따라 ‘위엄’ 또는 ‘장엄함’으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘모든 살아 있는 존재’는 문자적으로는 ‘모든 살아 있는 이’에 가깝습니다. 문맥상 주로 사람들을 가리키지만, 표현 자체는 더 넓습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘영원토록’은 그리스어의 ‘모든 세대/영원한 기간’이라는 관용적 표현을 자연스럽게 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποδείξατε
  english_pob_choice: declare
  chosen_korean: 선포하고
  alternatives_korean:
  - 드러내고
  - 보이십시오
  - 알리십시오
  lexicon: LSJ
  rationale: 공적 찬양의 문맥에서 단순히 ‘보이다’보다 공개적으로 알리고 증언하는 뉘앙스를 살려 ‘선포하고’로 옮겼습니다.
- source_word: τὴν μεγαλοσύνην αὐτοῦ
  english_pob_choice: his greatness
  chosen_korean: 그의 위대하심
  alternatives_korean:
  - 그의 위대함
  - 그의 위엄
  - 그의 장엄함
  lexicon: LSJ
  rationale: μεγαλοσύνη는 단순한 크기보다 하나님의 탁월하심과 위엄을 가리키므로, 한국어에서는 예배적 문맥에 맞는 ‘위대하심’이 가장 자연스럽습니다.
- source_word: ἐνώπιον παντὸς ζῶντος
  english_pob_choice: before every living being
  chosen_korean: 모든 살아 있는 존재 앞에서
  alternatives_korean:
  - 모든 산 자 앞에서
  - 모든 살아 있는 사람 앞에서
  - 모든 생명체 앞에서
  lexicon: LSJ
  rationale: 직역에 가깝게 보편성을 살리되, 문맥상 인간 증언을 좁혀 단정하지 않기 위해 ‘살아 있는 존재’로 넓게 옮겼습니다.
- source_word: κύριος ἡμῶν
  english_pob_choice: our Lord
  chosen_korean: 우리의 주님
  alternatives_korean:
  - 우리의 주
  - 우리의 주인
  lexicon: LSJ
  rationale: κύριος의 통상적 경어 번역으로 ‘주님’을 사용하되, 한국어 소유격과 함께 자연스럽게 배열했습니다.
- source_word: θεὸς αὐτὸς πατὴρ ἡμῶν
  english_pob_choice: our God and our Father
  chosen_korean: 우리의 하나님이시고 우리의 아버지이십니다
  alternatives_korean:
  - 우리의 하나님이시며 우리의 아버지이십니다
  - 우리의 하나님, 우리의 아버지이십니다
  - 우리의 하나님이자 아버지이십니다
  lexicon: LSJ
  rationale: 그리스어의 반복된 강조를 살려 두 칭호를 모두 분명히 유지했으며, ‘이시고/이십니다’로 병렬 구조를 분명하게 했습니다.
theological_decisions:
- issue: 하나님을 향한 직접 호칭과 존칭 종결 처리
  chosen_reading: 본문은 독자에게 주는 권면으로 읽고, 하나님을 직접 부르는 문장이 아니므로 합쇼체 명령형과 서술형을 유지했습니다.
  alternative_readings:
  - 기도체로 바꾸어 ‘십시오’ 대신 ‘하소서’류로 옮김
  - 더 평서문처럼 완화
  rationale: 헬라어 본문은 공동체에게 하는 공개 권면이므로, 한국어에서도 명령·선언의 공적 톤을 유지하는 것이 가장 투명합니다.
  doctrine_reference: 문맥 register 보존
- issue: ‘우리의 하나님이시고 우리의 아버지’의 병렬 관계
  chosen_reading: ‘우리의 하나님이시고 우리의 아버지이십니다’로 두 술어를 모두 독립적으로 드러냈습니다.
  alternative_readings:
  - ‘우리의 하나님, 우리의 아버지이십니다’
  - ‘우리의 하나님이자 아버지이십니다’
  rationale: 그리스어는 θεός와 πατήρ를 모두 예찬적 칭호로 붙여 말하므로, 한쪽을 다른 쪽의 수식으로 약화시키지 않도록 병렬성을 보존했습니다.
  doctrine_reference: 문법적 병렬성 보존
