base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/004.yaml
  text: There declare his greatness[a], and exalt him before every living being; for he is our Lord[c][b], and he is our God and our Father forever.
  footnotes:
  - marker: a
    text: Or 'show his majesty' for 'declare his greatness.' The Greek verb can mean 'show' or 'make known,' and the noun can also be rendered 'majesty.'
    reason: lexical_alternative
  - marker: b
    text: Greek literally, 'before every living [one].' The phrase is broad, though in context it most naturally refers to all living people.
    reason: lexical_alternative
  - marker: c
    text: Or 'for all the ages.' The Greek expression emphasizes unending duration.
    reason: lexical_alternative
translation:
  language: ko
  text: 거기서 그분의 위대하심[a]을 선포하고, 모든 살아 있는 존재[b] 앞에서 그분을 높이십시오. 그분은 영원토록[c] 우리의 주님이시며, 우리의 하나님이시고 우리의 아버지이십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘위대하심’은 그리스어 μεγαλοσύνη를 옮긴 것입니다. 문맥에 따라 ‘위엄’ 또는 ‘장엄함’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘모든 살아 있는 존재’는 문자적으로 ‘모든 살아 있는 이’에 가깝습니다. 문맥상 주로 사람들을 가리키지만, 표현 자체는 더 넓습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘영원토록’은 그리스어로 직역하면 ‘모든 시대에 걸쳐’라는 뜻의 관용 표현을 자연스럽게 옮긴 것입니다.
    reason: lexical_alternative
