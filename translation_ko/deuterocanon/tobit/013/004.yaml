  - 그의 장엄함
  lexicon: LSJ
  rationale: μεγαλοσύνη는 단순한 크기보다 하나님의 탁월하심과 위엄을 가리키므로, 한국어에서는 예배적 문맥에 맞는 ‘위대하심’이 가장 자연스럽습니다.
- source_word: ἐνώπιον παντὸς ζῶντος
  english_pob_choice: before every living being
  chosen_korean: 모든 살아 있는 존재 앞에서
  alternatives_korean:
  - 모든 산 자 앞에서
  - 모든 살아 있는 사람 앞에서
  - 모든 생명체 앞에서
  lexicon: LSJ
  rationale: 직역에 가깝게 보편성을 살리되, 문맥상 인간 증언을 좁혀 단정하지 않기 위해 ‘살아 있는 존재’로 넓게 옮겼습니다.
- source_word: κύριος ἡμῶν
  english_pob_choice: our Lord
  chosen_korean: 우리의 주님
  alternatives_korean:
  - 우리의 주
  - 우리의 주인
  lexicon: LSJ
  rationale: κύριος의 통상적 경어 번역으로 ‘주님’을 사용하되, 한국어 소유격과 함께 자연스럽게 배열했습니다.
- source_word: θεὸς αὐτὸς πατὴρ ἡμῶν
  english_pob_choice: our God and our Father
  chosen_korean: 우리의 하나님이시고 우리의 아버지이십니다
  alternatives_korean:
  - 우리의 하나님이시며 우리의 아버지이십니다
  - 우리의 하나님, 우리의 아버지이십니다
  - 우리의 하나님이자 아버지이십니다
  lexicon: LSJ
  rationale: 그리스어의 반복된 강조를 살려 두 칭호를 모두 분명히 유지했으며, ‘이시고/이십니다’로 병렬 구조를 분명하게 했습니다.
theological_decisions:
- issue: 하나님을 향한 직접 호칭과 존칭 종결 처리
  chosen_reading: 본문은 독자에게 주는 권면으로 읽고, 하나님을 직접 부르는 문장이 아니므로 합쇼체 명령형과 서술형을 유지했습니다.
  alternative_readings:
  - 기도체로 바꾸어 ‘십시오’ 대신 ‘하소서’류로 옮김
  - 더 평서문처럼 완화
  rationale: 헬라어 본문은 공동체에게 하는 공개 권면이므로, 한국어에서도 명령·선언의 공적 톤을 유지하는 것이 가장 투명합니다.
  doctrine_reference: 문맥 register 보존
- issue: ‘우리의 하나님이시고 우리의 아버지’의 병렬 관계
  chosen_reading: ‘우리의 하나님이시고 우리의 아버지이십니다’로 두 술어를 모두 독립적으로 드러냈습니다.
  alternative_readings:
  - ‘우리의 하나님, 우리의 아버지이십니다’
  - ‘우리의 하나님이자 아버지이십니다’
  rationale: 그리스어는 θεός와 πατήρ를 모두 예찬적 칭호로 붙여 말하므로, 한쪽을 다른 쪽의 수식으로 약화시키지 않도록 병렬성을 보존했습니다.
  doctrine_reference: 문법적 병렬성 보존
