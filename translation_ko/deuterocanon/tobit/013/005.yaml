  text: And he will scourge us for our injustices[a], and again he will show mercy and gather us from all the nations among which you were scattered.
  footnotes:
  - marker: a
    text: Greek shifts from 'us/our' to 'you were scattered' in the last clause; some English translations smooth this to 'we were scattered,' but the source text's change in person is preserved here.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 우리의 불의 때문에 우리를 채찍질하실 것이며, 다시 우리를 불쌍히 여기시고, 너희가 그들 가운데 흩어졌던 모든 민족들 가운데서 우리를 모으실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마지막 절에서 그리스어는 '우리/우리의'에서 '너희'로 인칭이 바뀝니다. 한국어 본문도 이 변화를 그대로 반영했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: μαστιγώσει
  english_pob_choice: will scourge
  chosen_korean: 채찍질하실 것이며
  alternatives_korean:
  - 때리실 것이며
  - 징계하실 것이며
  - 매질하실 것이며
  lexicon: BDAG
  rationale: 직역상 '채찍질하다'가 가장 가깝고, 심판의 강한 형벌 이미지를 한국어로도 유지합니다. 단순한 '징계하다'는 강도가 약해질 수 있습니다.
- source_word: ἐν ταῖς ἀδικίαις ἡμῶν
  english_pob_choice: for our injustices
  chosen_korean: 우리의 불의 때문에
  alternatives_korean:
  - 우리의 불의들 때문에
  - 우리의 죄악 때문에
  - 우리의 잘못 때문에
  lexicon: BDAG
  rationale: ἀδικίαις는 복수형으로 '불의들/불의'의 뉘앙스를 가지지만, 한국어에서는 자연스럽게 복수성을 과도하게 드러내기보다 원인성을 살린 '때문에'로 옮겼습니다.
- source_word: ἐλεήσει
  english_pob_choice: will show mercy
  chosen_korean: 불쌍히 여기시고
  alternatives_korean:
  - 긍휼을 베푸시고
  - 자비를 보이시고
  - 은혜를 베푸시고
  lexicon: BDAG
  rationale: 이 동사는 단순한 감정이 아니라 구원 행위로 이어지는 자비를 뜻하므로, 한국어에서 널리 이해되는 '불쌍히 여기다'를 택해 동작성을 살렸습니다.
- source_word: οὗ ἐὰν σκορπισθῆτε ἐν αὐτοῖς
  english_pob_choice: among which you were scattered
  chosen_korean: 너희가 그들 가운데 흩어졌던
  alternatives_korean:
  - 그들 가운데서 흩어졌던
  - 그들 가운데 흩어졌던 곳에서
  - 너희가 흩어졌던 그들 가운데
  lexicon: BDAG
  rationale: 그리스어가 마지막 절에서 1인칭 복수에서 2인칭 복수로 바뀌는 변화를 그대로 살리기 위해 '너희'를 유지했습니다. 또한 'among which'의 관계를 '그들 가운데'로 표현해 열방 분산의 이미지를 보존했습니다.
theological_decisions:
- issue: 1인칭 복수와 2인칭 복수의 교차
  chosen_reading: 마지막 절의 '너희'를 그대로 살려, '우리'와 '너희'의 전환을 평탄화하지 않았습니다.
  alternative_readings:
  - 전체를 '우리'로 통일
  - 전체를 '너희'로 통일
  rationale: 원문이 보여 주는 수사적 전환을 보존하는 것이 본문의 음성 및 호소 대상을 더 정확히 드러냅니다. 번역 전통의 매끈함보다 원문 대조를 우선했습니다.
  doctrine_reference: 원문 우선 원칙과 수사적 긴장 보존
