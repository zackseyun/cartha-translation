translation:
  language: ko
  text: 모든 사람이 말하고 예루살렘에서 그에게 감사드리게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게 고백하다’, ‘그를 찬양하다’. 이 헬라어 동사는 문맥에 따라 이러한 예배 관련 의미들을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λεγέτωσαν
  english_pob_choice: Let them all speak
  chosen_korean: 말하고
  alternatives_korean:
  - 말하게 하십시오
  - 말하라
  - 선포하게 하십시오
  lexicon: LSJ
  rationale: 3인칭 복수 명령형의 촉구를 한국어에서는 자연스러운 권면형으로 옮겼으며, 짧은 예배적 문맥에서 내용을 특정하지 않기 위해 ‘말하다’로 넓게 유지했습니다.
- source_word: ἐξομολογείσθωσαν
  english_pob_choice: give thanks
  chosen_korean: 감사드리게 하십시오
  alternatives_korean:
  - 고백하게 하십시오
  - 찬양하게 하십시오
  - 인정하게 하십시오
  lexicon: LSJ
  rationale: 이 동사는 문맥에 따라 고백·찬양·감사의 뜻을 가질 수 있는데, 여기서는 하나님께 드리는 찬양적 예배 문맥이므로 한국어로는 ‘감사드리다’가 가장 자연스럽고 예배적 의미를 살립니다.
- source_word: ἐν Ἱεροσολύμοις
  english_pob_choice: in Jerusalem
  chosen_korean: 예루살렘에서
  alternatives_korean:
  - 예루살렘 안에서
  - 예루살렘에
  lexicon: LSJ
  rationale: 장소를 나타내는 전치사구는 현대 한국어에서 가장 자연스러운 ‘-에서’로 옮겼습니다.
theological_decisions:
- issue: ἐξομολογείσθωσαν의 예배적 의미 범위
  chosen_reading: ‘감사드리다’로 본문을 옮기되, 고백·찬양의 여지를 주석으로 보존합니다.
  alternative_readings:
  - 고백하다
  - 찬양하다
  rationale: 토빗 13장의 찬양 찬가 문맥에서는 감사가 중심 의미지만, 헬라어 동사의 폭넓은 예배적 의미를 지워서는 안 되므로 각주로 대안을 남깁니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
