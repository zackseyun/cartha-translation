  source_fidelity: 그리스어의 두 3인칭 복수 명령(λεγέτωσαν, ἐξομολογείσθωσαν)은 본문의 ‘말하고 … 감사드리게 하십시오’에 대체로 충실히 반영되었습니다. 다만 πάντες는 ‘모든 사람’보다 명사화된 ‘모두’로 옮기는 편이 원문의 간결한 보편성을 더 잘 보존합니다. ‘예루살렘에서’는 그리스어 어순상 감사의 동사에 가장 직접적으로 연결되며, 현 번역도 이를 적절히 반영합니다.
  naturalness: ‘모두가’는 현대 표준 한국어에서 자연스럽고, ‘그분께 감사드리게 하십시오’는 하나님을 가리키는 문맥에 맞는 현대 합쇼체 예배 언어입니다. 두 동사를 한 문장 안에서 연결한 방식도 한국어 권면 표현으로 무리가 없습니다.
