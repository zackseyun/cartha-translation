base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/010.yaml
  text: Give thanks well to the Lord, and bless the King of the ages, so that his tent may again be built for you with joy; and so that he may gladden within you the captives and love within you the afflicted for all the generations of the age.
translation:
  language: ko
  text: 야훼께 선하게 감사하고, 왕이신 만대의 왕을 찬송하십시오. 그러면 그의 천막이 여러분을 위해 다시 기쁨 가운데 세워질 것이며, 그가 여러분 안에서 포로들을 기쁘게 하고, 여러분 안에서 고난받는 이들을 모든 세대 동안 사랑하실 것입니다.
  philosophy: formal
lexical_decisions:
- source_word: ἐξομολόγου τῷ κυρίῳ ἀγαθῶς
  english_pob_choice: Give thanks well to the Lord
  chosen_korean: 야훼께 선하게 감사하고
  alternatives_korean:
  - 야훼께 잘 감사하고
  - 주님께 선히 감사하고
  lexicon: ἐξομολογέω
  rationale: ἐξομολογέω는 단순한 감정 표현보다 ‘감사하다/찬양하다’의 공개적 고백을 포함하므로, POB의 well을 살려 ‘선하게 감사하다’로 옮겨 감사의 방식과 질을 함께 드러냈습니다.
- source_word: τὸν βασιλέα τῶν αἰώνων
  english_pob_choice: the King of the ages
  chosen_korean: 왕이신 만대의 왕
  alternatives_korean:
  - 영원들의 왕
  - 시대들의 왕
  lexicon: βασιλεύς / αἰών
  rationale: αἰώνων은 단순한 ‘영원’보다 시대들의 총체를 가리키는 표현이어서, POB의 King of the ages를 따라 ‘만대의 왕’으로 옮겨 시간 전체에 대한 통치를 살렸습니다.
- source_word: ἡ σκηνὴ αὐτοῦ οἰκοδομηθῇ σοι μετὰ χαρᾶς
  english_pob_choice: his tent may again be built for you with joy
  chosen_korean: 그의 천막이 여러분을 위해 다시 기쁨 가운데 세워질 것이며
  alternatives_korean:
  - 그의 장막이 여러분을 위해 다시 기쁨으로 세워질 것이며
  - 그의 성막이 여러분을 위해 다시 기쁨 가운데 세워질 것이며
  lexicon: σκηνή / οἰκοδομέω
  rationale: σκηνή는 제의적·상징적 ‘장막/천막’의 뜻을 가지지만, 여기서는 직접적인 성전 용어보다 넓은 거처 이미지를 살리는 ‘천막’이 원문에 더 가깝습니다.
- source_word: τοὺς αἰχμαλώτους καὶ ... τοὺς ταλαιπώρους
  english_pob_choice: the captives ... the afflicted
  chosen_korean: 포로들을 ... 고난받는 이들을
  alternatives_korean:
  - 사로잡힌 이들을 ... 가난한 이들을
  - 포로 된 이들 ... 고난당한 이들을
  lexicon: αἰχμάλωτος / ταλαιπώρος
  rationale: αἰχμάλωτος는 문자적 포로 상태를, ταλαιπώρος는 고단하고 비참한 처지를 가리키므로 POB의 구분을 유지해 각각 ‘포로들’과 ‘고난받는 이들’로 번역했습니다.
theological_decisions:
- issue: 하나님의 이름 표기
  chosen_reading: κύριος를 야훼로 옮겼습니다.
  alternative_readings:
  - 주님
  - 주
  rationale: 이 절은 구약의 하나님께 대한 직접 호칭이므로, 프로젝트 기본 원칙에 따라 κύριος를 인칭적 주님보다 야훼로 옮겨 야훼-호칭의 소급 가능성을 드러냈습니다.
  doctrine_reference: OT divine-name rendering policy
- issue: ‘그의 천막’의 종말론적 회복 이미지
  chosen_reading: 제의적 회복과 공동체 회복을 함께 드러내는 상징으로 보았습니다.
  alternative_readings:
  - 단순한 물리적 천막 재건
  - 성전 재건에 대한 직접 예언
  rationale: σκηνή는 문자적 천막이면서도 맥락상 포로 귀환과 기쁨, 회복을 연결하는 상징이므로, 과도한 교회론적·성전론적 확장을 피하면서도 회복의 신학을 보존했습니다.
  doctrine_reference: Second Temple restoration imagery
