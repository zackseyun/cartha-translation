  text: ὦ μακάριοι οἱ ἀγαπῶντές σε· χάρησονται ἐπὶ τῇ εἰρήνῃ σου. — μακάριοι ὅσοι ἐλυπήθησαν ἐπὶ ταῖς μάστιξίν σου, ὅτι ἐπὶ σοὶ χαρήσονται θεασάμενοι πᾶσαν τὴν δόξαν σου· καὶ εὐφρανθήσεται εἰς τὸν αἰῶνα ἡ ψυχή μου.
