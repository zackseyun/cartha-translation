  terminology: εἰρήνη는 특정 교단적 관용어인 “평강”보다 일반적인 “평화”로 옮겼습니다. μάστιξ는 본문에서 “고난”으로 처리하고, 문자적·의미적 대안은 해당 낱말의 주석으로 보존했습니다. μακάριοι는 “복이 있습니다”로 현대적 축복 선언을 나타냈습니다.
