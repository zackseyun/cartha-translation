  text: Oh[a], blessed are those who love you; they will rejoice over your peace. Blessed are all who were grieved over your afflictions, because they will rejoice over you when they see all your glory; and my soul will rejoice forever.
  footnotes:
  - marker: a
    text: Or 'your scourgings,' 'your plagues,' or 'your chastisements' for 'your afflictions.' The Greek μάστιξ can refer literally to a whip or figuratively to strokes of suffering.
    reason: lexical_alternative
translation:
  language: ko
  text: 오, 당신을 사랑하는 이들은 복되니, 당신의 평강으로 말미암아 기뻐할 것입니다. 당신의 재난들로 인해 슬퍼했던 모든 이들도 복되니, 그들이 당신을 보고 당신의 모든 영광을 볼 때 당신으로 인해 기뻐할 것이며, 내 영혼도 영원히 기뻐할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 채찍질들’, ‘당신의 재앙들’, ‘당신의 징계들’로도 옮길 수 있습니다. 그리스어 μάστιξ는 문자적으로 채찍을 뜻할 수 있고, 비유적으로 고난의 타격을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  english_pob_choice: blessed
  chosen_korean: 복되니
  alternatives_korean:
  - 복이 있습니다
  - 행복하니
  - 복이 있도다
  lexicon: BDAG
  rationale: 경배적·축복적 감탄의 어조를 살리면서도 현대 한국어 합쇼체에 자연스럽게 맞춥니다.
- source_word: ἐπὶ τῇ εἰρήνῃ σου
  english_pob_choice: over your peace
  chosen_korean: 당신의 평강으로 말미암아
  alternatives_korean:
  - 당신의 평강 때문에
  - 당신의 평강 위에
  - 당신의 평강 안에서
  lexicon: BDAG
  rationale: ἐπί + 여격의 원인/계기를 한국어에서 가장 자연스럽게 드러내는 표현으로 옮겼고, εἰρήνη는 문맥상 개인적 안녕이 아니라 회복된 평강이므로 평강으로 렌더링했습니다.
- source_word: ἐλυπήθησαν ἐπὶ ταῖς μάστιξίν σου
  english_pob_choice: were grieved over your afflictions
  chosen_korean: 당신의 재난들로 인해 슬퍼했던
  alternatives_korean:
  - 당신의 고난을 슬퍼했던
  - 당신의 채찍질을 슬퍼했던
  - 당신의 형벌을 슬퍼했던
  lexicon: BDAG
  rationale: μάστιξ의 물리적 의미를 그대로 고정하기보다, 예루살렘의 수난을 가리키는 문맥에 맞게 ‘재난들’로 옮겨 과도한 문자화를 피했습니다. English POB의 대안 주석도 반영해 의미 범위를 열어 둡니다.
- source_word: θεασάμενοι πᾶσαν τὴν δόξαν σου
  english_pob_choice: when they see all your glory
  chosen_korean: 그들이 당신을 보고 당신의 모든 영광을 볼 때
  alternatives_korean:
  - 당신의 모든 영광을 보게 될 때
  - 그들이 당신의 모든 영광을 바라볼 때
  - 당신의 모든 영광을 보면서
  lexicon: BDAG
  rationale: θεάομαι의 ‘보다/목격하다’ 의미를 살리되, 앞뒤 문맥의 시간 흐름이 분명하도록 ‘볼 때’로 옮겼습니다.
- source_word: εὐφρανθήσεται εἰς τὸν αἰῶνα ἡ ψυχή μου
  english_pob_choice: my soul will rejoice forever
  chosen_korean: 내 영혼도 영원히 기뻐할 것입니다
  alternatives_korean:
  - 내 영혼도 영원히 즐거워할 것입니다
  - 내 영혼은 영원히 기뻐하리라
  - 내 마음도 영원히 기뻐할 것입니다
  lexicon: BDAG
  rationale: εὐφρανθήσεται를 반복되는 기쁨의 흐름에 맞춰 ‘기뻐할 것입니다’로 옮기고, ψυχή는 시적·신앙적 자기표현으로서 ‘영혼’이 가장 적절합니다.
theological_decisions:
- issue: 예루살렘에 대한 2인칭 직접 호칭과 인격화
  chosen_reading: 본문은 예루살렘/시온을 인격화하여 직접 부르는 방식으로 이해하고 그대로 2인칭을 유지했습니다.
  alternative_readings:
  - 하나님의 백성 전체를 일반적으로 가리키는 표현으로 완화
  - 도시 언급을 피하고 추상화
  rationale: 문맥 전체가 예루살렘의 평강, 고난, 영광을 직접 말하므로, 이를 일반화하면 시적·신학적 긴장이 약화됩니다.
  doctrine_reference: 예루살렘 시온 인격화; 시편·이사야의 시적 전통
