  text: I exalt my God[a], and my soul rejoices in the King of heaven, and it will exult in his greatness.
  footnotes:
  - marker: a
    text: 'The Greek middle clause is elliptical: literally, ''and my soul to the King of heaven.'' The translation supplies ''rejoices in'' to express the likely poetic sense in context.'
    reason: alternative_reading
translation:
  language: ko
  text: 나는 내 하나님을 높입니다[a], 그리고 내 영혼은 하늘의 왕 안에서 기뻐하며, 그의 위대하심을 두고는 크게 기뻐할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 중간 절은 생략이 있는 압축 표현입니다. 직역하면 ‘그리고 내 영혼은 하늘의 왕께’에 가깝지만, 문맥상 ‘기뻐하며’로 뜻을 보완했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑψῶ
  english_pob_choice: I exalt
  chosen_korean: 높입니다
  alternatives_korean:
  - 영광을 돌립니다
  - 높이 칭송합니다
  lexicon: BDAG
  rationale: 하나님을 ‘높이다’는 직역적이면서도 예배적 의미를 자연스럽게 살립니다. ‘영광을 돌리다’는 보완적 표현이지만, 원문의 상승/높임 이미지를 덜 직접적으로 드러냅니다.
- source_word: ψυχή
  english_pob_choice: my soul
  chosen_korean: 내 영혼
  alternatives_korean:
  - 나 자신
  - 내 생명
  - 내 속사람
  lexicon: BDAG
  rationale: 원문이 명시적으로 ψυχή를 사용하므로, 시적·신앙 고백적 어조를 살려 ‘내 영혼’으로 옮겼습니다.
- source_word: τῷ βασιλεῖ τοῦ οὐρανοῦ
  english_pob_choice: the King of heaven
  chosen_korean: 하늘의 왕
  alternatives_korean:
  - 하늘의 임금
  - 하늘 왕
  lexicon: BDAG
  rationale: 하나님을 가리키는 칭호로서, 소유격 관계를 분명히 하면서도 한국어에서 가장 자연스럽고 위엄 있는 표현은 ‘하늘의 왕’입니다.
- source_word: ἀγαλλιάσεται
  english_pob_choice: will exult
  chosen_korean: 크게 기뻐할 것입니다
  alternatives_korean:
  - 환호할 것입니다
  - 즐거워할 것입니다
  lexicon: BDAG
  rationale: 미래형의 강한 기쁨을 한국어로 자연스럽게 드러내면서도, 과도하게 시적이지 않게 ‘크게 기뻐하다’로 옮겼습니다. ‘환호하다’는 감정의 강도는 살지만 문맥상 다소 과합니다.
- source_word: μεγαλοσύνην
  english_pob_choice: greatness
  chosen_korean: 위대하심
  alternatives_korean:
  - 크심
  - 장엄하심
  - 위대함
  lexicon: BDAG
  rationale: 하나님의 성품을 높이는 문맥이므로 단순한 추상명사 ‘위대함’보다 존칭적 뉘앙스가 있는 ‘위대하심’이 더 적절합니다.
theological_decisions:
- issue: 중간 절의 생략된 동사 처리
  chosen_reading: ‘내 영혼은 하늘의 왕 안에서 기뻐하며’로 풀어, 시적 생략을 자연스러운 기쁨의 진술로 표현했습니다.
  alternative_readings:
  - ‘내 영혼은 하늘의 왕께’라는 더 직역적인 무동사 표현
  - ‘내 영혼은 하늘의 왕에게 속합니다’처럼 관계를 보충하는 표현
  rationale: 그리스어 본문은 중간 절이 압축되어 있어 한국어에서는 의미를 드러내는 동사를 보충해야 합니다. 문맥이 찬양시이므로 ‘기뻐하다’가 가장 덜 해석적이면서도 본문의 감정을 잘 전달합니다.
  doctrine_reference: 'DOCTRINE.md: 시적 압축은 의미를 보존하는 범위에서 풀어 쓸 수 있으며, 본문의 긴장을 임의로 해소하지 않는다.'
