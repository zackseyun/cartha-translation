  source_fidelity: 본문의 '찬양할 것입니다'는 εὐλογήσουσιν의 기본 의미인 '축복하다/송축하다'를 '찬양하다'로 좁힙니다. 하나님을 대상으로 하는 한국어 성경 문체에서는 '송축하다'가 원문의 어휘와 예배적 문맥을 함께 잘 보존합니다. 또한 '위에'는 사람을 기뻐하는 대상·계기로 나타내는 ἐπί의 용법에 자연스럽지 않습니다.
  naturalness: '''의인들의 아들들 위에''는 현대 한국어에서 어색하므로 ''의인들의 아들들을 두고''로 고칩니다. 두 명령의 강도 차이를 드러내기 위해 ''기뻐하고 크게 즐거워하십시오''로 옮겼습니다. 미래 절은 자연스러운 연결을 위해 ''것이며''를 사용했습니다.'
  terminology: '''의인들'', ''아들들'', ''주님''은 그리스어의 속격 관계 및 남성 복수 표현을 투명하게 유지합니다. ''송축하다''는 하나님께 εὐλογεῖν을 행하는 성경적 용례에 적합하며, ''찬양하다''보다 원어의 어휘적 대응이 정확합니다.'
