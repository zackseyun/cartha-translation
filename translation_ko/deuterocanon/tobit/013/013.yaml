  yaml_path: translation/deuterocanon/tobit/013/013.yaml
  text: Rejoice and exult over the sons of the righteous[a], because they will be gathered together and will bless the Lord of the righteous.
  footnotes:
  - marker: a
    text: Or 'the children of the righteous.' The Greek says 'sons,' which may refer more broadly to descendants.
    reason: lexical_alternative
translation:
  language: ko
  text: 의인들의 아들들을 두고 기뻐하고 크게 즐거워하십시오[a]. 그들이 함께 모일 것이며, 의인들의 주님을 송축할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '의인들의 자녀들.' 그리스어는 '아들들'을 말하며, 더 넓게는 후손을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρηθι
  english_pob_choice: Rejoice
  chosen_korean: 기뻐하고
  alternatives_korean:
  - 기뻐하십시오
  - 즐거워하십시오
  lexicon: LSJ
  rationale: 기쁨을 나타내는 첫 번째 명령형으로 자연스럽고, 다음 동사와 병렬을 이루기 좋습니다.
- source_word: ἀγαλλίασαι
  english_pob_choice: exult
  chosen_korean: 즐거워하십시오
  alternatives_korean:
  - 크게 기뻐하십시오
  - 환호하십시오
  lexicon: LSJ
  rationale: 단순한 기쁨보다 강한 환희의 뉘앙스를 살리되, 현대 한국어에서 과도하게 문어적인 표현은 피했습니다.
- source_word: τοῖς υἱοῖς τῶν δικαίων
  english_pob_choice: the sons of the righteous
  chosen_korean: 의인들의 아들들
  alternatives_korean:
  - 의인들의 자녀들
  - 의로운 사람들의 아들들
  lexicon: LSJ
  rationale: 그리스어의 남성 복수형 υἱοί를 그대로 반영해 성별 표지를 지키되, 문맥상 의인의 후손 전체를 가리킬 수 있어 본문은 직역하고 각주로 여지를 남겼습니다.
- source_word: συναχθήσονται
  english_pob_choice: they will be gathered together
  chosen_korean: 함께 모일 것이고
  alternatives_korean:
  - 모여질 것이고
  - 모이게 될 것이고
  lexicon: LSJ
  rationale: 수동적 의미와 공동체적 재결집의 뜻을 살리면서 한국어 문장 흐름에 맞게 옮겼습니다.
- source_word: εὐλογήσουσιν
  english_pob_choice: will bless
  chosen_korean: 찬양할 것입니다
  alternatives_korean:
  - 복을 빌 것입니다
  - 축복할 것입니다
  lexicon: LSJ
  rationale: 이 동사는 기본적으로 '축복하다/찬양하다'의 범위를 가지지만, 여기서는 하나님을 향한 경배적 반응이므로 한국어 독자에게 자연스러운 '찬양하다'를 택했습니다.
- source_word: τὸν κύριον τῶν δικαίων
  english_pob_choice: the Lord of the righteous
  chosen_korean: 의인들의 주님
  alternatives_korean:
  - 의인들의 주
  - 의인들의 주 하나님
  lexicon: LSJ
  rationale: κύριος의 경외적 호칭을 '주님'으로 살리고, 속격 관계는 '의인들의'로 최대한 투명하게 유지했습니다.
theological_decisions:
- issue: 토빗 13:13의 'sons' 성별 표지 처리
  chosen_reading: 본문에는 '아들들'을 유지하고, 각주로 후손 전체를 가리킬 수 있음을 밝힙니다.
  alternative_readings:
  - 자녀들로 중립화
  - 후손들로 의역
  rationale: 그리스어 υἱοί의 표지를 지우지 않으면서도, 문맥상 포괄적 의미가 가능하다는 점을 독자에게 열어 두는 방식이 가장 투명합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: τὸν κύριον τῶν δικαίων의 관계 구문
  chosen_reading: '''의인들의 주님''으로 번역해 속격 관계를 직접 보존합니다.'
  alternative_readings:
  - '''의인들의 주 하나님''으로 해석적 확장'
  - '''의인들의 주''로 축약'
  rationale: 헬라어 속격의 가장 직접적인 관계를 유지해 본문의 투명성을 확보하고, 해석을 본문에 미리 주입하지 않습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
