  text: And all her streets will say[a], ‘Hallelujah and praise!’ saying, ‘Blessed is God, who has exalted all the ages.’
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'who is exalted forever' or 'throughout all ages.' The Greek reads literally 'who has exalted all the ages,' an unusual expression.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그 도시의 모든 길은 “할렐루야와 찬양!”이라고 말하며, “하나님은 복되시다. 그분께서는 모든 시대를 높이셨습니다.”라고 외칠 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘모든 시대들’을 높이셨다는 뜻입니다. 더 관용적으로는 ‘영원토록 높으셨다’ 또는 ‘모든 시대에 걸쳐 높으시다’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: αἱ ῥῦμαι
  english_pob_choice: streets
  chosen_korean: 길
  alternatives_korean:
  - 거리
  - 거리들
  - 골목
  lexicon: LSJ
  rationale: ῥύμη는 도시의 거리나 길을 가리키므로, 한국어에서는 자연스럽게 들리는 ‘길’로 옮겼습니다. 문맥상 도시의 의인화된 이미지도 잘 살립니다.
- source_word: ἀλληλουιὰ
  english_pob_choice: Hallelujah
  chosen_korean: 할렐루야
  alternatives_korean:
  - 찬양하라
  - 야훼를 찬양하라
  lexicon: LSJ
  rationale: 그리스어가 예배적 음역을 보존하므로, 한국어도 통용되는 음역형 ‘할렐루야’를 유지했습니다.
- source_word: αἴνεσιν
  english_pob_choice: praise
  chosen_korean: 찬양
  alternatives_korean:
  - 찬미
  - 칭송
  - 찬송
  lexicon: LSJ
  rationale: αἴνεσις는 ‘찬양’이라는 명사로 자연스럽게 옮길 수 있으며, 앞의 ‘할렐루야’와 함께 예배적 병렬을 이루게 합니다.
- source_word: Εὐλογητός ὁ θεός
  english_pob_choice: Blessed is God
  chosen_korean: 하나님은 복되시다
  alternatives_korean:
  - 하나님은 찬송받으시다
  - 하나님께 복이 있으시다
  lexicon: LSJ
  rationale: 축복 선언형 도식이므로 한국어에서도 선언문으로 살리되, ‘복되시다’로 하나님의 찬양 가능성을 유지했습니다.
- source_word: πάντας τοὺς αἰῶνας
  english_pob_choice: all the ages
  chosen_korean: 모든 시대
  alternatives_korean:
  - 모든 세대
  - 영원토록
  - 모든 영원
  lexicon: LSJ
  rationale: αἰῶνες의 기본 의미인 ‘시대/세대’를 보존하여, POB가 지적한 표현의 다소 이례적인 성격을 한국어에서도 남겼습니다.
theological_decisions:
- issue: πάντας τοὺς αἰῶνας의 시간 표현을 한국어에서 어떻게 유지할 것인가
  chosen_reading: ‘모든 시대’로 직역에 가깝게 두어, ‘영원토록’으로 매끈하게 풀지 않았습니다.
  alternative_readings:
  - 영원토록
  - 영원까지
  - 모든 세대
  rationale: 원문은 문자적으로 ‘모든 시대들’이므로, 의미를 매끈하게 해석해 버리기보다 어색함을 어느 정도 보존하는 편이 원문 감사 가능성을 높입니다. 다만 독자를 위해 자연스러운 한국어 구조 안에 배치했습니다.
  doctrine_reference: 원문 어휘와 신학적 긴장을 보존하는 번역 원칙
