translation:
  language: ko
  text: 그리고 그 성읍의 모든 거리는 ‘할렐루야와 찬양!’이라고 외치며, ‘모든 시대를 높이신 하나님은 찬송받으실 분이십니다[a]’라고 말할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어를 직역하면 ‘모든 시대를 높이신’입니다. 이례적인 표현입니다. 더 관용적으로는 ‘영원토록 높임을 받으시는’ 또는 ‘모든 시대에 걸쳐 높임을 받으시는’으로 이해할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: αἱ ῥῦμαι
  english_pob_choice: streets
  chosen_korean: 길
  alternatives_korean:
  - 거리
  - 거리들
  - 골목
  lexicon: LSJ
  rationale: ῥύμη는 도시의 거리나 길을 가리키므로, 한국어에서는 자연스럽게 들리는 ‘길’로 옮겼습니다. 문맥상 도시의 의인화된 이미지도 잘 살립니다.
- source_word: ἀλληλουιὰ
  english_pob_choice: Hallelujah
  chosen_korean: 할렐루야
  alternatives_korean:
