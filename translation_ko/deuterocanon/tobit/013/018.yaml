  source_fidelity: 원문의 구조(성읍의 모든 거리의 발화, ‘할렐루야와 찬양’, 그리고 하나님을 향한 송영)를 대체로 충실히 반영합니다. 다만 Εὐλογητὸς ὁ θεός는 한국어에서 ‘하나님은 복되시다’라고 하면 하나님께 복이 주어진다는 뜻으로도 들려 송영의 뜻이 불분명해집니다. 또한 ὃς ὕψωσεν πάντας τοὺς αἰῶνας의 이례적인 능동 표현은 본문에서 보존하되, 각주가 그 표현 자체와 관용적 이해를 더 정확히 밝혀야 합니다.
