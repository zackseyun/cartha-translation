  text: And all her streets will say[a], ‘Hallelujah and praise!’ saying, ‘Blessed is God, who has exalted all the ages.’
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'who is exalted forever' or 'throughout all ages.' The Greek reads literally 'who has exalted all the ages,' an unusual expression.
