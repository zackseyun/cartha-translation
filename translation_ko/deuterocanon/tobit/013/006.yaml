base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/006.yaml
  text: If you turn to him with all your heart and with all your soul[a], to do what is true before him, then he will turn to you and will certainly not hide his face from you. See what he will do with you, and give thanks to him with your whole being; bless the Lord of righteousness[d][c][b], and exalt the King of the ages.
  footnotes:
  - marker: a
    text: Or 'to act faithfully before him.' The Greek literally says 'to do truth' before him, a Semitic-style expression for living truthfully or faithfully in God's sight.
    reason: lexical_alternative
  - marker: b
    text: Or 'with all your body.' The Greek reads literally 'with your whole body,' likely expressing wholehearted, embodied thanksgiving.
    reason: lexical_alternative
  - marker: c
    text: Or 'the Lord of justice.'
    reason: alternative_reading
  - marker: d
    text: Or 'the eternal King.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 여러분이 온 마음과 온 영혼으로 그에게 돌아와, 그 앞에서 진리를 행하면, 그는 여러분에게 돌아오실 것이며 여러분에게서 자신의 얼굴을 결코 숨기지 않으실 것입니다. 그가 여러분과 함께 무엇을 하실지 보십시오. 그리고 여러분의 온몸으로 그에게 감사하십시오. 의의 주를 찬양하고, 영원들의 왕을 높이십시오.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그 앞에서 신실하게 행하다.' 헬라어는 문자적으로는 '진리를 하다'라고 말하는 셈어식 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '온몸으로.' 헬라어는 문자적으로 '너희의 온몸으로'라고 합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '의의 주' 대신 '정의의 주'.
    reason: alternative_reading
  - marker: d
    text: 또는 '영원한 왕'.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστρέψητε / ἐπιστρέψει
  english_pob_choice: turn / turn
  chosen_korean: 돌아오다 / 돌아오실 것입니다
  alternatives_korean:
  - 돌이키다
  - 회개하다
  lexicon: BDAG
  rationale: 반복되는 ἐπιστρέφω의 상호적 회복 구조를 살리기 위해 같은 동사군을 유지했습니다. '돌이키다'보다 현대 한국어에서 자연스러운 '돌아오다'가 반응의 대칭성을 잘 드러냅니다.
- source_word: ποιῆσαι ἀλήθειαν
  english_pob_choice: to do truth / to do what is true
  chosen_korean: 진리를 행하다
  alternatives_korean:
  - 진리를 하다
  - 참되게 행하다
  - 진실을 행하다
  lexicon: BDAG
  rationale: 헬라어의 직설적인 'truth' 표현을 한국어에서 자연스럽고도 문맥상 충실하게 옮겼습니다. '진리를 행하다'는 의미를 보존하면서도 종교적 문체로 과도하게 완화하지 않습니다.
- source_word: ἐξομολογήσασθε αὐτῷ
  english_pob_choice: give thanks to him
  chosen_korean: 감사하십시오
  alternatives_korean:
  - 고백하십시오
  - 찬양하십시오
  lexicon: BDAG
  rationale: 이 문맥에서는 죄 고백보다 하나님을 향한 감사와 찬양의 뜻이 두드러집니다. 앞뒤의 '찬양하고'와 병렬을 이루도록 '감사하십시오'를 택했습니다.
- source_word: ἐν ὅλῳ τῷ σώματι ὑμῶν
  english_pob_choice: with your whole body / with your whole being
  chosen_korean: 온몸으로
  alternatives_korean:
  - 온몸을 다해
  - 온 존재로
  lexicon: BDAG
  rationale: 영어 POB의 수정 이력은 σώμα를 더 직접적으로 반영하되, 문맥상 총체적 헌신을 함께 살리려는 방향입니다. 한국어에서는 '온몸으로'가 신체성과 전인적 헌신을 동시에 비교적 간결하게 전달합니다.
- source_word: τὸν κύριον τῆς δικαιοσύνης
  english_pob_choice: the Lord of righteousness
  chosen_korean: 의의 주
  alternatives_korean:
  - 의로우신 주
  - 정의의 주
  lexicon: BDAG
  rationale: δικαιοσύνη는 프로젝트 기본값에 따라 '의'로 옮겼습니다. 여기서는 고유한 신적 칭호이므로 '의의 주'로 압축해 표현했습니다.
- source_word: τὸν βασιλέα τῶν αἰώνων
  english_pob_choice: the King of the ages
  chosen_korean: 영원들의 왕
  alternatives_korean:
  - 세대들의 왕
  - 시대들의 왕
  - 영원의 왕
  lexicon: BDAG
  rationale: αἰώνων의 복수를 살려 '영원들의'로 옮기면, 단순한 '영원한 왕'보다 원문의 장엄한 도상과 복수형을 더 분명히 반영합니다.
theological_decisions:
- issue: δικαιοσύνη를 신적 칭호에서 어떻게 옮길지
  chosen_reading: 의
  alternative_readings:
  - 의로움
  - 정의
  rationale: 프로젝트 기본값인 '의'를 따르되, 이 구절은 찬양의 호칭이므로 추상적 덕목보다 하나님과 관련된 성격을 유지하는 표현이 적절합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: δικαιοσύνη'
