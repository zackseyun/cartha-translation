  text: Many nations will come from far away to the name of the Lord God[a], carrying gifts in their hands, gifts for the King of heaven; generations of generations will give you exultation.
  footnotes:
  - marker: a
    text: Or 'generation after generation will bring you rejoicing.' The Greek literally reads 'generations of generations will give you exultation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 많은 나라들이 멀리서 주 하나님의 이름으로 나아오며, 손에 예물을 들고 하늘의 왕께 예물을 드릴 것입니다. 세대의 세대가 당신에게 기쁨을 드릴 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘세대의 세대가 당신에게 기쁨을 가져다줄 것입니다.’ 그리스어는 문자적으로 ‘세대들의 세대가 당신에게 환희를 줄 것입니다’라고 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔθνη πολλὰ
  english_pob_choice: Many nations
  chosen_korean: 많은 나라들
  alternatives_korean:
  - 많은 민족들
  - 많은 백성들
  lexicon: LSJ
  rationale: ἔθνη는 문맥상 국제적 범위를 가리키므로, 현대 한국어에서 자연스러우면서도 그 범위를 보존하는 ‘나라들’로 옮겼습니다.
- source_word: μακρόθεν ἥξει
  english_pob_choice: will come from far away
  chosen_korean: 멀리서 … 나아오며
  alternatives_korean:
  - 멀리서 … 올 것이며
  - 먼 곳에서 … 올 것입니다
  lexicon: LSJ
  rationale: 순례적 움직임을 살리기 위해 단순한 ‘오다’보다 ‘나아오다’를 택했고, 부사어 ‘멀리서’를 그대로 보존했습니다.
- source_word: πρὸς τὸ ὄνομα Κυρίου τοῦ θεοῦ
  english_pob_choice: to the name of the Lord God
  chosen_korean: 주 하나님의 이름으로
  alternatives_korean:
  - 주 하나님의 이름께
  - 주 하나님의 이름을 향해
  lexicon: LSJ
  rationale: 직역하면 ‘이름께/이름을 향해’이지만, 한국어에서는 목적·방향을 드러내는 ‘~의 이름으로’가 가장 자연스럽고, 신적 이름을 향하는 경외의 뉘앙스를 유지합니다.
- source_word: δῶρα ἐν χερσὶν ἔχοντες καὶ δῶρα
  english_pob_choice: carrying gifts in their hands, gifts
  chosen_korean: 손에 예물을 들고, 예물을 드릴 것입니다
  alternatives_korean:
  - 손에 예물을 지니고, 예물을 가져올 것입니다
  - 손에 예물을 들고, 예물을 가져올 것입니다
  lexicon: LSJ
  rationale: 손에 든 예물을 반복하는 구조를 살리되, 뒤의 δῶρα는 단순 중복보다 헌정의 방향을 살려 ‘드리다’로 풀어 한국어 문장을 자연스럽게 했습니다.
theological_decisions:
- issue: τῷ βασιλεῖ τοῦ οὐρανοῦ의 번역
  chosen_reading: ‘하늘의 왕’으로 직역하여 신적 칭호를 유지했습니다.
  alternative_readings:
  - ‘하늘 나라의 왕’
  - ‘하늘의 임금’
  rationale: 본문은 하나님을 ‘하늘의 왕’으로 부르며, 이를 익숙한 교회 용어로 확장하기보다 칭호 자체를 보존하는 편이 원문 의미를 더 직접적으로 드러냅니다.
  doctrine_reference: 신적 칭호의 원문 직역 우선; 전통적 의역보다 source-direct 표현 유지
- issue: σοι의 지시 대상
  chosen_reading: 직접 호칭인 ‘당신에게’로 유지했습니다.
  alternative_readings:
  - ‘예루살렘아’ 또는 ‘시온아’를 보충
  - ‘이스라엘에게’로 일반화
  rationale: 문맥상 예루살렘을 향한 시적 인격화가 분명하지만, 본문에 없는 이름을 덧붙이지 않고 직접 호칭을 유지하는 것이 원문의 수사학을 보존합니다.
  doctrine_reference: 문맥적 지시 대상은 유지하되 본문 밖 보충은 최소화
