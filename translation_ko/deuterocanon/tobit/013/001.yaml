base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/001.yaml
  text: Then Tobit wrote a prayer of rejoicing and said[a], “Blessed is the living God forever, and his kingdom.”
  footnotes:
  - marker: a
    text: The Greek text ends abruptly with 'and his kingdom.' Some translators supply an implied predicate such as 'is blessed' or connect the phrase with 'forever.' The concise wording is retained here to avoid adding what the source does not explicitly say.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 토빗은 기쁨의 기도를 써서 이렇게 말했습니다. 「영원토록 살아 계신 하나님은 복되십니다. 그의 나라도.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 ‘그리고 그의 나라’에서 갑자기 끝납니다. 일부 번역은 ‘복되다’와 같은 술어를 보충하거나 이 말을 ‘영원토록’과 연결하지만, 여기서는 본문에 명시되지 않은 말을 덧붙이지 않기 위해 생략적인 표현을 유지했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγραφεν
  english_pob_choice: wrote
  chosen_korean: 써서
  alternatives_korean:
  - 기록해서
  - 썼습니다
  lexicon: LSJ
  rationale: 미완료과거의 서술 기능을 살리면서 한국어로는 자연스럽게 ‘써서’라고 옮겨, 기도의 작성 행위를 직접 드러냈습니다.
- source_word: προσευχὴν εἰς ἀγαλλίασιν
  english_pob_choice: a prayer of rejoicing
  chosen_korean: 기쁨의 기도
  alternatives_korean:
  - 기뻐하는 기도
  - 환호의 기도
  - 기쁨을 위한 기도
  lexicon: LSJ
  rationale: εἰς ἀγαλλίασιν의 기쁨·환호의 뉘앙스를 ‘기쁨의’로 압축해 과장 없이 자연스럽게 전달했습니다.
- source_word: Εὐλογητὸς ὁ θεὸς ὁ ζῶν εἰς τοὺς αἰῶνας
  english_pob_choice: Blessed is the living God forever
  chosen_korean: 영원히 살아 계신 하나님은 찬양받으실 분이시며
  alternatives_korean:
  - 복되신 살아 계신 하나님이시며
  - 영원히 살아 계신 하나님은 복되십니다
  - 살아 계신 하나님은 영원히 찬양받으십니다
  lexicon: LSJ
  rationale: Εὐλογητὸς를 한국어 doxology에 맞춰 ‘찬양받으실 분’으로 풀어, 단순 형용사보다 축복 선언의 성격을 살렸습니다.
- source_word: ἡ βασιλεία αὐτοῦ
  english_pob_choice: and his kingdom
  chosen_korean: 그의 나라도 그러합니다
  alternatives_korean:
  - 그의 나라도 영원합니다
  - 그의 나라입니다
  - 그리고 그의 나라
  lexicon: LSJ
  rationale: 영어 POB가 보존한 종결의 절약성을 한국어에서는 ‘그러합니다’로 옮겨, 앞절의 축복 진술을 그의 나라까지 이어 주되 보충 설명은 최소화했습니다.
theological_decisions:
- issue: 끊어진 듯한 마지막 절구(‘and his kingdom’)를 어떻게 처리할지
  chosen_reading: 명시되지 않은 술어를 과하게 보충하지 않고, 앞의 찬양 선언을 그의 나라로 이어 주는 축복형 문장으로 유지했습니다.
  alternative_readings:
  - 그의 나라도 복되십니다
  - 그의 나라는 영원합니다
  - 그리고 그의 나라는 복되십니다
  rationale: 그리스어가 생략적이고 abrupt하므로, 본문이 말하지 않은 내용을 단정적으로 덧붙이지 않으면서도 한국어로는 문장성이 유지되도록 처리했습니다.
  doctrine_reference: 본문의 절약된 종결을 보존하여 신학적 긴장을 해소하지 않습니다.
