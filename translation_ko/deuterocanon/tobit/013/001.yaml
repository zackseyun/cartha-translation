  - severity: low
    issue: ‘찬양받으실 분이시며’가 마지막 절의 해석을 유도함
    rationale: Εὐλογητός의 가능한 번역이지만, ‘그의 나라도 그러합니다’와 함께 읽히면 하나님의 나라가 ‘찬양받으실 분’이라는 부자연스럽고 원문이 확정하지 않는 병렬이 됩니다.
