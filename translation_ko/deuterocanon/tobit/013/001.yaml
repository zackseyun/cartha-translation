revisions:
- from: 그때 토빗은 기쁨의 기도를 써서 이렇게 말했습니다. 「영원히 살아 계신 하나님은 찬양받으실 분이시며, 그의 나라도 그러합니다」[a]
  to: 그때 토빗은 기쁨의 기도를 써서 이렇게 말했습니다. 「영원토록 살아 계신 하나님은 복되십니다. 그의 나라도.」[a]
  rationale: 원문의 첫 송영 선언은 자연스러운 한국어 문장으로 옮기고, 술어 없는 마지막 명사구는 ‘그의 나라도’라는 의도적인 미완결 표현으로 남겼습니다. 이렇게 하면 καὶ의 첨가 의미는 ‘도’로 나타내면서도, 원문이 확정하지 않는 술어·영속성·축복의 대상을 보충하지 않습니다.
