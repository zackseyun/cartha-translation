  to: 그리고 이웃들은 비웃으며 말했습니다. “이 일 때문에 죽임당할까 봐 이제는 더 이상 두려워하지 않는구나. 도망쳤고, 보아라, 또다시 죽은 이들을 묻고 있구나.”[a]
