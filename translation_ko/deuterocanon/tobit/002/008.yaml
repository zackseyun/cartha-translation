base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/008.yaml
  text: And the neighbors were mocking[a], saying, “He is no longer afraid of being put to death over this matter; he ran away, and look, he is burying the dead again.”
  footnotes:
  - marker: a
    text: Other textual traditions of Tobit differ substantially here. The indirect Hebrew back-translation has Hannah speaking about Tobit's acts of kindness and righteousness not helping him in his distress and disgrace, rather than neighbors mocking his burial of the dead.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 이웃들은 비웃으며 말했습니다. “이 일 때문에 죽임당할까 봐 이제는 더 이상 두려워하지 않는구나. 도망쳤고, 보아라, 또다시 죽은 이들을 묻고 있구나.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 다른 본문 전승들은 이 대목을 크게 다르게 전합니다. 간접 히브리어 역번역은 이웃들의 조롱 대신, 한나가 토빗의 자선과 의로움이 그의 환난과 수치 속에서 아무 도움이 되지 못했다고 말하는 장면을 전합니다.
    reason: textual_variant
lexical_decisions:
- source_word: οἱ πλησίον
  english_pob_choice: the neighbors
  chosen_korean: 이웃들
  alternatives_korean:
  - 가까이 사는 사람들
  - 주변 사람들
  lexicon: LSJ
  rationale: 복수 명사적 용법으로서 ‘nearby people’의 자연스러운 한국어는 ‘이웃들’이며, 관계적 뉘앙스를 살립니다.
- source_word: ἐνέγελων
  english_pob_choice: were mocking
  chosen_korean: 비웃으며
  alternatives_korean:
  - 조롱하며
  - 희롱하며
  lexicon: LSJ
  rationale: 미완료 과거의 반복적 조소를 간결하게 살리기 위해 ‘비웃으며’로 옮겼습니다.
- source_word: φονευθῆναι
  english_pob_choice: of being put to death
  chosen_korean: 죽임당할까 봐
  alternatives_korean:
  - 죽을까 봐
  - 살해될까 봐
  lexicon: LSJ
  rationale: 문맥상 단순한 죽음보다 처형/살해의 위협을 가리키므로 ‘죽임당하다’가 가장 가깝습니다.
- source_word: ἀπέδρα
  english_pob_choice: he ran away
  chosen_korean: 도망쳤더니
  alternatives_korean:
  - 달아났더니
  - 도망가더니
  lexicon: LSJ
  rationale: 과거 사건을 상기시키는 서술로서, 이웃들의 빈정거림 속 연결을 드러내는 한국어 관용 표현을 택했습니다.
- source_word: θάπτει τοὺς νεκρούς
  english_pob_choice: he is burying the dead
  chosen_korean: 죽은 이들을 묻고 있구나
  alternatives_korean:
  - 죽은 자들을 묻고 있구나
  - 시신을 묻고 있구나
  lexicon: LSJ
  rationale: 현재 시제의 생생한 지적을 살리되, ‘νεκρούς’를 너무 기술적으로 만들지 않기 위해 ‘죽은 이들’로 옮겼습니다.
theological_decisions:
- issue: 본문의 조롱 화법과 서술 시점
  chosen_reading: 이웃들의 비웃음과 직접 인용문을 그대로 유지해, 조롱의 날카로움과 반복적 비난을 드러냈습니다.
  alternative_readings:
  - 중립적으로 ‘말했습니다’만 두는 방식
  - 조롱을 약화시켜 완곡하게 옮기는 방식
  rationale: 그리스어의 미완료형 ἐνέγελων과 직접 화법은 단순 정보 전달이 아니라 공개적 조롱을 강조하므로, 이를 약화시키지 않는 것이 본문 의도에 합당합니다.
  doctrine_reference: Tobit 2:8의 서사적/문학적 효과 보존
