  source_fidelity: 본문은 그리스어의 이웃들의 조롱, 죽임당할 두려움, 과거의 도피, 그리고 다시 죽은 이들을 매장하는 현재 행동을 대체로 충실히 옮깁니다. 다만 ‘도망쳤더니’는 앞선 도피가 뒤의 매장 행동을 낳은 듯한 시간적·결과적 연결을 더하므로, 단순 병렬인 καὶ ἀπέδρα, καὶ ἰδού를 더 직접적으로 옮기는 편이 안전합니다.
