base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/006.yaml
  text: And I remembered the prophecy of Amos[a], as he said, “Your festivals will be turned into mourning, and all your rejoicing into lamentation.” And I wept.
  footnotes:
  - marker: a
    text: The quoted line echoes Amos 8:10 in the Septuagint tradition.
    reason: cross_reference
translation:
  language: ko
  text: 나는 아모스의 예언을 기억했습니다[a]. 그가 말한 대로, “너희의 절기는 애곡으로 바뀌고, 너희의 모든 즐거움은 애가로 바뀔 것이다.” 그리고 나는 울었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 인용문은 칠십인역 전승의 아모스 8:10을 반영합니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἐμνήσθην
  english_pob_choice: I remembered
  chosen_korean: 나는 … 기억했습니다
  alternatives_korean:
  - 나는 … 떠올렸습니다
  - 나는 … 생각해 냈습니다
  lexicon: BDAG
  rationale: Ἐμνήσθην은 회상 행위를 자연스럽게 나타내므로, 현대 한국어에서는 ‘기억했습니다’가 가장 직접적이고 문맥에 맞습니다.
- source_word: προφητείας Ἀμὼς
  english_pob_choice: the prophecy of Amos
  chosen_korean: 아모스의 예언
  alternatives_korean:
  - 아모스의 예언 말씀
  - 아모스의 예언적 말씀
  lexicon: BDAG
  rationale: 본문은 아모스에게서 나온 예언의 내용을 가리키므로, 과도하게 풀지 않고 ‘아모스의 예언’으로 옮겼습니다.
- source_word: ἑορταὶ
  english_pob_choice: festivals
  chosen_korean: 절기
  alternatives_korean:
  - 축제
  - 명절
  lexicon: BDAG
  rationale: LXX 문맥에서 ἑορταί는 종교적 절기들을 가리키는 경우가 많아, 교회적 전통어를 피하면서도 본문 의미를 살리는 ‘절기’가 적절합니다.
- source_word: πένθος / θρῆνον
  english_pob_choice: mourning / lamentation
  chosen_korean: 애곡 / 애가
  alternatives_korean:
  - 애통 / 탄식
  - 슬픔 / 통곡
  lexicon: BDAG
  rationale: 두 명사가 모두 공개적 슬픔과 장송의 뉘앙스를 가지므로, 대구를 살리면서도 문학적·예언적 어조를 유지하는 ‘애곡’과 ‘애가’를 택했습니다.
theological_decisions:
- issue: 아모스 8:10의 직접 인용 형태 보존
  chosen_reading: 예언을 ‘그가 말한 그대로’ 직접 인용으로 처리해, 토빗이 예언적 경고를 회상하는 장면을 유지했습니다.
  alternative_readings:
  - 의미만 풀어 ‘큰 슬픔이 올 것이라고 말했습니다’처럼 완화하는 방식
  rationale: 본문은 단순한 요약이 아니라 기억된 예언의 문장 자체를 인용하므로, intertextual force를 약화시키지 않도록 직인용 구조를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; Original-language primacy over translation tradition.'
