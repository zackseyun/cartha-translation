  naturalness: 합쇼체 문장은 자연스럽지만, ‘내 앞에 좋은 잔칫상이 차려졌습니다’보다 ‘좋은 식사가 마련되었습니다’가 원문의 의미와 현대 한국어 모두에 더 알맞습니다. ‘기대어 누웠습니다’는 고대의 식사 자세를 자연스럽게 전달합니다.
