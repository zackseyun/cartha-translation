base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/001.yaml
  text: Now when I had come down to my house[a], and Anna my wife and Tobiah my son were restored to me, on the feast of Pentecost, which is the holy feast of seven weeks, a fine meal was prepared for me[c][b], and I reclined to eat.
  footnotes:
  - marker: a
    text: Or 'the Feast of Weeks.' The Greek says 'Pentecost' and immediately explains it as 'the holy feast of seven weeks.'
    reason: alternative_reading
  - marker: b
    text: The Greek literally says 'I reclined to eat,' reflecting the ancient custom of reclining at table.
    reason: cultural_note
  - marker: c
    text: The parallel Semitic tradition for this verse is fuller, adding Tobiah's being sent to invite a poor kinsman to the meal; that material is not present in the shorter Greek wording translated here.
    reason: textual_variant
translation:
  language: ko
  text: 내가 집으로 내려와 보니 안나 내 아내와 내 아들 토비야가 내게 다시 돌아와 있었고, 오순절 — 곧 거룩한 칠칠절 — 에 내 앞에 좋은 잔칫상이 차려졌습니다. 나는 먹으려고 자리에 비스듬히 누웠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘펜테코스트(오순절)’라고 하면서 곧바로 이를 ‘거룩한 칠칠절’로 설명합니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어의 ‘먹으려고 자리에 비스듬히 누웠습니다’는 고대 식탁에서 비스듬히 기대어 식사하던 관습을 반영합니다.
    reason: cultural_note
  - marker: c
    text: 더 긴 셈어 전통은 토비야가 가난한 친족을 초대하러 보내지는 내용을 덧붙이지만, 짧은 그리스어 본문에는 없습니다.
    reason: textual_variant
lexical_decisions:
- source_word: κατῆλθον εἰς τὸν οἶκόν μου
  english_pob_choice: had come down to my house
  chosen_korean: 집으로 내려와 보니
  alternatives_korean:
  - 집에 돌아오니
  - 집으로 왔을 때
  lexicon: BDAG
  rationale: κατῆλθον의 ‘내려오다’라는 방향성을 살리면서, 서술 흐름상 자연스러운 한국어로 옮겼습니다.
- source_word: ἀπεδόθη μοι
  english_pob_choice: were restored to me
  chosen_korean: 내게 다시 돌아와 있었고
  alternatives_korean:
  - 내게 되돌려졌고
  - 내게 다시 주어졌고
  lexicon: BDAG
  rationale: 아내와 아들이 함께 언급된 가족 회복의 뉘앙스를 살리되, 수동형의 어색함을 줄였습니다.
- source_word: πεντηκοστῇ ἑορτῇ ... ἁγία ἑπτὰ ἑβδομάδων
  english_pob_choice: the feast of Pentecost ... the holy feast of seven weeks
  chosen_korean: 오순절 — 곧 거룩한 칠칠절 —
  alternatives_korean:
  - 오순절 — 곧 일곱 주간의 거룩한 절기 —
  - 칠칠절 — 곧 오순절 —
  lexicon: LEH
  rationale: 그리스어의 설명적 동격을 살려 ‘오순절’을 먼저 두고, 이어서 ‘거룩한 칠칠절’로 풀어 주었습니다. ‘칠칠절’은 한국어 성서 전통의 이해 가능성을 반영합니다.
- source_word: ἐγενήθη ἄριστον καλὸν μοι
  english_pob_choice: a fine meal was prepared for me
  chosen_korean: 내 앞에 좋은 잔칫상이 차려졌습니다
  alternatives_korean:
  - 훌륭한 식사가 준비되었습니다
  - 좋은 음식이 차려졌습니다
  lexicon: BDAG
  rationale: ‘좋은 식사’의 의미를 살리면서, 잔치 자리의 구체성과 준비된 상의 이미지를 자연스럽게 표현했습니다.
- source_word: ἀνέπεσα τοῦ φαγεῖν
  english_pob_choice: I reclined to eat
  chosen_korean: 나는 먹으려고 자리에 비스듬히 누웠습니다
  alternatives_korean:
  - 나는 먹으려고 기대었습니다
  - 나는 먹으려고 누웠습니다
  lexicon: BDAG
  rationale: 고대 식사 관습인 ‘recline’을 드러내기 위해 ‘비스듬히 누웠습니다’를 택했습니다. 직역보다 문화적 정보를 보존합니다.
