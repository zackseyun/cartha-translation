  lexicon: BDAG
  rationale: ‘좋은 식사’의 의미를 살리면서, 잔치 자리의 구체성과 준비된 상의 이미지를 자연스럽게 표현했습니다.
- source_word: ἀνέπεσα τοῦ φαγεῖν
  english_pob_choice: I reclined to eat
  chosen_korean: 나는 먹으려고 자리에 비스듬히 누웠습니다
  alternatives_korean:
  - 나는 먹으려고 기대었습니다
  - 나는 먹으려고 누웠습니다
  lexicon: BDAG
  rationale: 고대 식사 관습인 ‘recline’을 드러내기 위해 ‘비스듬히 누웠습니다’를 택했습니다. 직역보다 문화적 정보를 보존합니다.
