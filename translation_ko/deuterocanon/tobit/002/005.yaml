base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/005.yaml
  text: And when I returned[b][a], I washed myself and ate my bread in sorrow.
  footnotes:
  - marker: a
    text: The Greek says 'washed myself.' In context this likely refers to washing after corpse impurity; the parallel Semitic tradition makes the purity setting more explicit.
    reason: cultural_note
  - marker: b
    text: Or 'my meal.' The Greek literally reads 'my bread,' which can also mean food more generally.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 내가 돌아와서 몸을 씻고, 슬픔 속에서 내 빵을 먹었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어는 단순히 '씻었다'고만 말합니다. 문맥상 시체 부정 이후의 씻음일 가능성이 있지만, 본문에는 그 설명이 직접 나오지 않습니다.
    reason: cultural_note
  - marker: b
    text: 또는 '내 식사'. 헬라어의 '빵'은 음식 전체를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστρέψας
  english_pob_choice: when I returned
  chosen_korean: 내가 돌아와서
  alternatives_korean:
  - 돌아온 뒤
  - 돌아와
  lexicon: BDAG
  rationale: 부사절로 앞선 동작을 자연스럽게 보여 주면서, 본문의 시간 순서를 한국어로 무리 없이 드러냅니다.
- source_word: ἐλουσάμην
  english_pob_choice: I washed myself
  chosen_korean: 몸을 씻고
  alternatives_korean:
  - 내 몸을 씻고
  - 목욕하고
  - 씻어 정결케 하고
  lexicon: BDAG
  rationale: 중간태의 자기 씻음을 반영하되, 본문에 없는 '정결케 하다'를 덧붙이지 않고 한국어로는 가장 자연스러운 표현을 택했습니다.
- source_word: τὸν ἄρτον μου
  english_pob_choice: my bread
  chosen_korean: 내 빵
  alternatives_korean:
  - 내 음식
  - 내 식사
  lexicon: BDAG
  rationale: ἄρτος의 문자적 이미지인 '빵'을 살려 원문 밀도를 유지했습니다. 한국어에서도 '빵'은 음식 전체를 가리키는 메톤미로 읽힐 수 있습니다.
- source_word: ἐν λύπῃ
  english_pob_choice: in sorrow
  chosen_korean: 슬픔 속에서
  alternatives_korean:
  - 근심 가운데
  - 비통함 속에서
  lexicon: BDAG
  rationale: λύπη의 감정 상태를 직접적으로 옮기되, 한국어에서 자연스럽고 문맥의 애도를 잘 드러내는 표현으로 처리했습니다.
theological_decisions:
- issue: 씻음의 성격을 본문에서 명시할지 여부
  chosen_reading: 본문에는 단순히 '몸을 씻고'라고만 두고, 정결례나 시체 부정에 대한 설명은 본문에 넣지 않았습니다.
  alternative_readings:
  - 정결하게 씻고
  - 부정을 씻고
  rationale: 헬라어 본문은 씻었다는 행위만 말하며, 더 구체적인 정결 맥락은 평행 전승과 문맥에서 추론될 뿐입니다. 따라서 해석을 본문에 과잉 주입하지 않고 원문 수준을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3
