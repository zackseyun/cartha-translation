  to: 그러나 그녀가 내게 왔을 때, 소리치기 시작했습니다. 나는 그녀에게 말했습니다. “그 어린 염소[a]는 어디에서 났습니까? 훔친 물건입니까? 그것을 주인들에게 돌려주십시오. 훔친 것을 먹는 것은 허용되지 않기 때문입니다.”
  rationale: 큰 소리의 발화라는 κράζειν의 의미를 정서적으로 한정하지 않도록 ‘소리치기’로 고쳤습니다. ‘훔친 물건/훔친 것’으로 도난품이라는 κλεμμάιον 및 κλεψιμαῖον의 뜻을 분명히 했고, θεμιτόν은 자연스러운 현대 한국어로 규범적 금지를 나타내도록 ‘허용되지 않습니다’로 옮겼습니다. 각 인용문은 현대 합쇼체로 통일했으며, 어휘 각주 표지는 해당 단어 뒤에 배치했습니다.
