  text: But when she came to me[a], she began to cry out, and I said to her, “Where is the young goat from? Is it stolen? Give it back to its owners, for it is not lawful to eat what is stolen.”
  footnotes:
  - marker: a
    text: Greek ἔριφον can also be rendered 'kid,' that is, a young goat.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그 여자가 내게 왔을 때, 울부짖기 시작했습니다. 나는 그 여자에게 말했습니다. “그 어린 염소는 어디에서 온 것이오? 도둑맞은 것이오? 그것을 주인들에게 돌려주시오. 도둑맞은 것을 먹는 것은 합법하지 않기 때문이오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἔριφον은 ‘어린 염소’로도, ‘새끼 염소(kid)’로도 옮길 수 있습니다.
    reason: lexical_alternative
