  text: But when she came to me[a], she began to cry out, and I said to her, “Where is the young goat from? Is it stolen? Give it back to its owners, for it is not lawful to eat what is stolen.”
  footnotes:
  - marker: a
    text: Greek ἔριφον can also be rendered 'kid,' that is, a young goat.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그녀가 내게 왔을 때, 소리치기 시작했습니다. 나는 그녀에게 말했습니다. “그 어린 염소[a]는 어디에서 났습니까? 훔친 물건입니까? 그것을 주인들에게 돌려주십시오. 훔친 것을 먹는 것은 허용되지 않기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ἔριφον은 ‘새끼 염소’로도 옮길 수 있습니다.
    reason: lexical_alternative
