base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/002.yaml
  text: And I saw much food[a], and I said to my son, “Go and bring whichever one of our brothers you may find in need, who remembers the Lord; and behold[c][b], I am waiting for you.”
  footnotes:
  - marker: a
    text: Or “many dishes” or “much meat”; the Greek term refers to prepared food served with a meal.
    reason: lexical_alternative
  - marker: b
    text: “Our brothers” here means fellow members of Tobit’s people, not only literal siblings.
    reason: cultural_note
  - marker: c
    text: The closing words are awkward in the Greek manuscript tradition; the sense is that Tobit remains behind waiting for his son to return.
    reason: textual_variant
translation:
  language: ko
  text: 내가 많은 음식[a]을 보고, 내 아들에게 말했습니다. 「가서 우리 형제들[b] 가운데서 궁핍하며 주님을 기억하는 사람을 네가 찾는 대로 데려오십시오. 보십시오[c], 내가 너를 기다리고 있습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘음식’은 여기서 식사에 차려지는 조리된 음식을 가리키며, ‘많은 요리’ 또는 ‘많은 음식물’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘우리 형제들’은 단순한 친형제뿐 아니라 토빗의 동족, 곧 같은 공동체의 사람들을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 마지막 절의 그리스어는 다소 어색하지만, 문맥상 토빗이 아들이 돌아올 때까지 기다린다는 뜻입니다.
    reason: textual_variant
lexical_decisions:
- source_word: ὄψα πολλά
  english_pob_choice: much food
  chosen_korean: 많은 음식
  alternatives_korean:
  - 많은 요리
  - 많은 음식물
  - 많은 반찬
  lexicon: LSJ
  rationale: ὄψα는 식사에 곁들이는 조리된 음식, 곧 차려진 음식을 가리키므로, 문맥상 자연스러운 '많은 음식'이 가장 안정적입니다.
- source_word: Βάδισον
  english_pob_choice: Go
  chosen_korean: 가서
  alternatives_korean:
  - 가라
  - 가 보아라
  lexicon: LSJ
  rationale: 직접 명령의 핵심을 살리면서도 현대 한국어 구어체가 아닌 문장 흐름에 맞게 '가서'로 옮겼습니다.
- source_word: τῶν ἀδελφῶν ἡμῶν
  english_pob_choice: our brothers
  chosen_korean: 우리 형제들
  alternatives_korean:
  - 우리 형제들 가운데
  - 우리 동족
  - 우리 백성
  lexicon: LSJ
  rationale: 문자적으로는 형제이지만, 토빗기의 공동체적 의미를 훼손하지 않으면서도 원문의 친족 표현을 유지하기 위해 '우리 형제들'로 두었습니다.
- source_word: ὃς μέμνηται τοῦ κυρίου
  english_pob_choice: who remembers the Lord
  chosen_korean: 주님을 기억하는
  alternatives_korean:
  - 주님을 마음에 두는
  - 주님을 기억하는 사람
  - 주님을 생각하는
  lexicon: LSJ
  rationale: μέμνηται의 지속적 기억/염두에 둠을 한국어에서 가장 직접적으로 드러내는 표현은 '기억하는'입니다. κύριος는 이 문맥에서 '주님'으로 옮겼습니다.
- source_word: ἰδοὺ μένω σε
  english_pob_choice: look, I am waiting for you
  chosen_korean: 보라, 나는 너를 기다리고 있겠다
  alternatives_korean:
  - 보라, 나는 너를 기다리고 있다
  - 보라, 나는 너를 기다리겠다
  - 자, 나는 너를 기다리고 있겠다
  lexicon: LSJ
  rationale: 그리스어의 어색한 전승을 과도하게 매끈하게 하지 않고, 문맥상 '기다림'의 뜻을 분명히 살렸습니다. '보라'로 ἰδού를 대응시켜 형식성을 유지했습니다.
theological_decisions:
- issue: κύριος의 번역
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 야훼
  rationale: 본문은 LXX의 κύριος를 사용하므로, 본문 표지는 '주님'으로 두었습니다. 이는 내러티브 속 경건한 호칭을 자연스럽게 살리면서도 직접적인 신명 대체를 피합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → Lord'
- issue: ἀδελφῶν ἡμῶν의 범위
  chosen_reading: 우리 형제들
  alternative_readings:
  - 우리 백성
  - 우리 동족
  - 우리 형제들 곧 동료 이스라엘 사람들
  rationale: 원문은 혈연보다 공동체적 친족성을 가리킬 가능성이 크지만, 성별을 평탄화한 중성 집단명보다 원문의 친족 표현을 유지하는 편이 더 직접적입니다.
  doctrine_reference: DOCTRINE.md §4 Gender-accurate over gender-neutral
