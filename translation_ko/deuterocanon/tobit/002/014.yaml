base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/014.yaml
  text: But she said[a], “It was given to me as a gift in addition to my wages.” But I did not believe her, and I told her to give it back to its owners; and I was embarrassed before her. Then she answered and said to me, “Where are your acts of mercy and your righteous deeds? Behold[d][c][b], everything about you is known.”
  footnotes:
  - marker: a
    text: Or “along with my wages” / “as part of my wages.” The Greek phrase can indicate something given in connection with her pay; the context suggests she claims it was an extra gift rather than stolen property.
    reason: lexical_alternative
  - marker: b
    text: Greek “masters” (κυρίοις); here rendered “owners” because the context concerns returning disputed property to those who possessed it.
    reason: lexical_alternative
  - marker: c
    text: The Greek literally refers to blushing or reddening; the sense in context is shame or embarrassment.
    reason: lexical_alternative
  - marker: d
    text: Or “your almsgivings and your acts of righteousness.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 말했습니다. “그것은 내 삯에 더하여 선물로 주어진 것입니다.” 그러나 나는 그녀를 믿지 않았고, 그것을 주인들에게 돌려주라고 말했습니다. 그리고 나는 그녀 앞에서 부끄러워졌습니다. 그때 그녀가 대답하여 나에게 말했습니다. “당신의 자선 행위들과 당신의 의로운 행위들은 어디에 있습니까? 보십시오, 당신에 관한 모든 것이 알려져 있습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ὡς ἢ σύν/ἐπί와 유사한 관계를 반영해, 이 표현은 ‘내 삯과 함께’ 또는 ‘내 삯에 더하여’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δῶρον δέδοταί μοι ἐπὶ τῷ μισθῷ
  english_pob_choice: It was given to me as a gift in addition to my wages
  chosen_korean: “그것은 내 삯에 더하여 선물로 주어진 것입니다”
  alternatives_korean:
  - “그것은 내 삯과 함께 주어진 것입니다”
  - “그것은 내 임금에 덧붙여 주어진 것입니다”
  - “그것은 내 삯의 일부로 주어진 것입니다”
  lexicon: LSJ
  rationale: δώρον은 ‘선물’이 가장 자연스럽고, ἐπὶ τῷ μισθῷ는 삯에 덧붙여졌다는 뜻으로 읽는 것이 문맥에 맞습니다.
- source_word: τοῖς κυρίοις
  english_pob_choice: its owners
  chosen_korean: “주인들에게”
  alternatives_korean:
  - “주인들에게”
  - “소유자들에게”
  - “주님들께”
  lexicon: LSJ
  rationale: 가정 경제 맥락에서 κύριοι는 여기서는 종교적 ‘주님’이 아니라 그 물건의 주인/소유자를 가리키므로 ‘주인들’로 옮겼습니다.
- source_word: ἠρυθρίων πρὸς αὐτήν
  english_pob_choice: I became ashamed before her
  chosen_korean: “나는 그녀 앞에서 부끄러워졌습니다”
  alternatives_korean:
  - “나는 그녀 앞에서 얼굴을 붉혔습니다”
  - “나는 그녀 앞에서 당황했습니다”
  - “나는 그녀 앞에서 수치스러워졌습니다”
  lexicon: LSJ
  rationale: 동사는 문자적으로 ‘붉어지다/붉히다’의 뜻이지만, 여기서는 의심이 빚은 수치와 당황을 나타내므로 ‘부끄러워졌습니다’가 가장 자연스럽습니다.
- source_word: ἐλεημοσύναι
  english_pob_choice: acts of mercy
  chosen_korean: “자선 행위들”
  alternatives_korean:
  - “긍휼의 행위들”
  - “구제 행위들”
  - “자비의 행위들”
  lexicon: LSJ
  rationale: 복수형으로 구체적 행위들을 가리키며, 한국어에서는 문맥상 ‘자선 행위들’이 Tobit의 경건 행위를 가장 직접적으로 드러냅니다.
- source_word: δικαιοσύναι
  english_pob_choice: righteous deeds
  chosen_korean: “의로운 행위들”
  alternatives_korean:
  - “의의 행위들”
  - “정의로운 행위들”
  - “의로움들”
  lexicon: LSJ
  rationale: 추상적 ‘의’가 아니라 복수의 구체적 행위를 가리키므로 ‘의로운 행위들’로 옮겼습니다.
- source_word: γνωστὰ πάντα μετὰ σοῦ
  english_pob_choice: everything about you is known
  chosen_korean: “당신에 관한 모든 것이 알려져 있습니다”
  alternatives_korean:
  - “당신과 관련된 모든 것이 알려져 있습니다”
  - “당신의 모든 것이 드러나 있습니다”
  - “보십시오, 당신에 관한 모든 것이 분명합니다”
  lexicon: LSJ
  rationale: 압축된 관용구를 한국어로 풀어, 상대의 상태와 실상이 이미 드러나 있음을 자연스럽게 전달합니다.
