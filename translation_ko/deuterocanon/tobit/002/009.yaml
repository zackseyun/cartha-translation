  yaml_path: translation/deuterocanon/tobit/002/009.yaml
  text: And on that very night[a], after I had gone out and buried him, I lay down to sleep in a defiled state beside the wall of the courtyard, and my face was uncovered.
  footnotes:
  - marker: a
    text: Or 'unclean.' The Greek describes ritual defilement after burial, not necessarily moral impurity.
    reason: lexical_alternative
translation:
  language: ko
  text: 바로 그날 밤에 나는 나갔다가 그를 묻고, 시체로 말미암아 부정한 상태로 뜰의 담 곁에 누워 잠들었으며, 내 얼굴은 덮여 있지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘더럽혀진.’ 여기서 말하는 것은 장례 후 시신 접촉으로 인한 의례적 부정이며, 반드시 도덕적 부정을 뜻하는 것은 아닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αὐτῇ τῇ νυκτί
  english_pob_choice: on that very night
  chosen_korean: 그날 밤 바로
  alternatives_korean:
  - 그 바로 그 밤에
  - 그날 밤에
  lexicon: LSJ
  rationale: 지시어와 강조를 살려 즉시성을 드러내는 표현으로 옮겼습니다.
- source_word: ἀνέλυσα θάψας
  english_pob_choice: after I had gone out and buried him
  chosen_korean: 나가서 그를 묻고
  alternatives_korean:
  - 나가 그를 묻고
  - 나가서 장사하고
  lexicon: LSJ
  rationale: 동작의 선후 관계를 한국어의 연결어미로 자연스럽게 나타내되, 본문의 ‘나가다/떠나다’와 ‘묻다’의 순서를 유지했습니다.
- source_word: μεμιαμμένος
  english_pob_choice: in a defiled state
  chosen_korean: 시체 부정해진 상태로
  alternatives_korean:
  - 부정한 상태로
  - 더럽혀진 상태로
  lexicon: LSJ
  rationale: 장례 접촉에 따른 의례적 부정을 분명히 하기 위해 ‘부정해지다’를 사용했고, 도덕적 더러움으로 오해될 수 있는 표현은 피했습니다.
- source_word: τὸ πρόσωπόν μου ἀκάλυπτον ἦν
  english_pob_choice: my face was uncovered
  chosen_korean: 내 얼굴은 가려져 있지 않았습니다
  alternatives_korean:
  - 내 얼굴은 덮여 있지 않았습니다
  - 내 얼굴은 드러나 있었습니다
  lexicon: LSJ
  rationale: 원문이 ‘얼굴(prosōpon)’을 직접 말하므로 ‘머리’로 바꾸지 않았고, ‘uncovered’의 상태를 현대 한국어로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 장례 접촉으로 인한 의례적 부정의 표기
  chosen_reading: 시체 부정해진 상태
  alternative_readings:
  - 부정한 상태
  - 시체로 인해 더럽혀진 상태
  rationale: 본문은 도덕적 죄책이 아니라 시신 접촉에서 오는 의례적 부정을 말하므로, 그 긴장을 살리는 방향으로 번역했습니다.
  doctrine_reference: 'DOCTRINE.md: ritual impurity vs moral impurity distinction'
- issue: ‘묻다’의 장례 행위와 부정 상태의 병치
  chosen_reading: 나가서 그를 묻고, 시체 부정해진 상태로
  alternative_readings:
  - 나가서 그를 장사하고, 부정한 채
  - 나가서 그를 묻고, 부정한 상태로
  rationale: 장례 행위와 부정 상태를 분리해 제시하여, 행동의 순서와 그 결과를 본문대로 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: maintain source tensions'
