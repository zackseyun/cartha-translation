  source_fidelity: 원문의 시간 강조, 매장 행위, 그 결과인 의례적 부정, 뜰 담 곁의 위치, 얼굴이 덮이지 않은 상태를 대체로 충실히 옮겼습니다. 다만 ‘시체 부정해진’은 한국어에서 비문에 가깝고, 원문 συμμεμιαμμένος의 결과 상태를 자연스럽고 명료하게 전달하지 못합니다. 또한 ‘나가서 그를 묻고’는 ἀνέλυσα의 의미가 문맥상 다소 불확실하므로 ‘나갔다가’로 처리해 매장 뒤의 귀환을 함의하지 않도록 하는 편이 안전합니다.
