base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/007.yaml
  text: And I wept. And when the sun had set[a], I went and dug and buried him.
  footnotes:
  - marker: a
    text: Literally, 'having dug, I buried him.' The object 'a grave' is implied by the burial context and made explicit in English for clarity.
    reason: lexical_alternative
translation:
  language: ko
  text: 저는 울었습니다. 그리고 해가 진 뒤에 가서 파내어 그를 묻었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘파고서 그를 묻었다’입니다. 원문에는 ‘무덤’이 명시되어 있지 않지만, 매장 맥락상 암시됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκλαυσα
  english_pob_choice: I wept
  chosen_korean: 저는 울었습니다
  alternatives_korean:
  - 저는 곡했습니다
  - 저는 통곡했습니다
  lexicon: BDAG
  rationale: κλαίω의 단순 과거는 여기서 감정의 직접 표현인 ‘울었습니다’가 가장 자연스럽고, 장례 맥락을 과도하게 확장하지 않습니다.
- source_word: ὅτε ἔδυ ὁ ἥλιος
  english_pob_choice: when the sun had set
  chosen_korean: 해가 진 뒤에
  alternatives_korean:
  - 해가 진 때에
  - 해가 졌을 때에
  lexicon: LSJ
  rationale: 해가 진 뒤라는 시간 표지는 장례 행위가 밤 이전에 이루어졌음을 드러내며, 한국어로는 ‘뒤에’가 가장 간결합니다.
- source_word: ὀρύξας
  english_pob_choice: dug
  chosen_korean: 파내어
  alternatives_korean:
  - 파서
  - 파고
  lexicon: LSJ
  rationale: 분사 ὀρύξας는 ‘파고 난 뒤’의 선행 행위를 나타내므로, 한국어 연결 어미 ‘-어’로 순차성을 살렸습니다.
- source_word: ἔθαψα αὐτόν
  english_pob_choice: buried him
  chosen_korean: 그를 묻었습니다
  alternatives_korean:
  - 그를 장사했습니다
  - 그를 매장했습니다
  lexicon: BDAG
  rationale: θάπτω는 단순히 매장하는 행위를 가리키므로, 현대 문체에서는 ‘묻었습니다’가 직설적이고 자연스럽습니다.
theological_decisions:
- issue: 장례 행위의 직접성
  chosen_reading: 본문이 암시하는 무덤/묘소를 한국어에서 따로 보충하지 않고, ‘파내어 그를 묻었습니다’로 최소한만 드러냈습니다.
  alternative_readings:
  - ‘무덤을 파서 그를 묻었습니다’
  - ‘파서 장사했습니다’
  rationale: 영어 POB도 장례 맥락에서 무덤이 암시된다고 보지만, 그 명시를 본문에 넣으면 원문보다 더 구체화될 수 있습니다.
  doctrine_reference: 원문 충실성 및 최소한의 명시화 원칙
