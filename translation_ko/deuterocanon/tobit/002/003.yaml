base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/003.yaml
  text: And he came and said[a], “Father, one of our own people has been strangled and thrown down in the marketplace.”
  footnotes:
  - marker: a
    text: Or “one of our kin.” The Greek says “one from our γένος,” which can refer to family, kin-group, or one’s own people.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 와서 말했습니다. 「아버지, 우리 민족[a] 가운데 한 사람이 목 졸려 죽은 채 시장에 내던져져 있습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「우리 친족 가운데 한 사람」. 그리스어 γένος는 가족, 친족 집단, 또는 자기 민족을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάτερ
  english_pob_choice: Father
  chosen_korean: 아버지
  alternatives_korean:
  - 아버님
  - 내 아버지
  lexicon: BDAG
  rationale: 직접 호칭이므로 한국어에서도 간명하게 「아버지」로 옮겨, 원문의 대화체를 자연스럽게 살렸습니다.
- source_word: εἷς ἐκ τοῦ γένους ἡμῶν
  english_pob_choice: one of our own people
  chosen_korean: 우리 민족 가운데 한 사람
  alternatives_korean:
  - 우리 친족 가운데 한 사람
  - 우리 가족 가운데 한 사람
  - 우리 동족 가운데 한 사람
  lexicon: BDAG
  rationale: γένoς는 혈연 가족보다 더 넓은 친족/공동체 소속을 가리킬 수 있으므로, 문맥에 맞게 공동체적 소속을 드러내는 「우리 민족」을 택했습니다.
- source_word: ἐστραγγαλωμένος
  english_pob_choice: has been strangled
  chosen_korean: 목 졸려 죽은 채
  alternatives_korean:
  - 목 졸린 채
  - 교살당한 채
  - 목이 졸려 죽은 채
  lexicon: BDAG
  rationale: 완료 수동 분사는 이미 죽은 상태를 전제하므로, 단순히 행위만이 아니라 결과 상태까지 보이도록 「목 졸려 죽은 채」로 옮겼습니다.
- source_word: ἔρριπται ἐν τῇ ἀγορᾷ
  english_pob_choice: thrown down in the marketplace
  chosen_korean: 시장에 내던져져 있습니다
  alternatives_korean:
  - 시장에 던져져 있습니다
  - 시장 바닥에 내팽개쳐져 있습니다
  - 시장에서 내던져져 있습니다
  lexicon: BDAG
  rationale: ῥίπτω의 폭력적 처분 뉘앙스를 살리기 위해 「내던져져」를 사용했고, ἀγορά는 공적 공간인 시장으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: γένος ἡμῶν의 범위
  chosen_reading: 혈연 가족보다 넓은 공동체/민족 소속을 가리키는 표현으로 이해했습니다.
  alternative_readings:
  - 바로 가까운 친족으로 좁혀 이해
  - 인종적 의미로 넓혀 이해
  rationale: 본문은 매장해야 할 죽은 동족을 가리키므로, 즉각적인 가족보다 공동체적·민족적 연대를 드러내는 번역이 문맥에 가장 적합합니다.
  doctrine_reference: 'DOCTRINE.md: 원어 우선, 문맥에 따른 어휘 범위 구분'
