  text: καὶ οὐκ ᾔδειν ὅτι στρουθία ἐν τῷ τοίχῳ ἐστίν· καὶ τῶν ὀφθαλμῶν μου ἀνεῳγότων, ἀφώδευσαν τὰ στρουθία θερμὰ εἰς τοὺς ὀφθαλμούς μου, καὶ ἐγενήθη λευκώ- ματα εἰς τοὺς ὀφθαλμούς μου· καὶ ἐπορεύθην πρὸς ἰατρούς, καὶ οὐκ ὠφέλησάν με· Ἀχειαχάρος δὲ ἔτρεφέν με ἕως οὗ ἐπορεύθην εἰς τὴν Ἐλυμαΐδα.
