  rationale: 그리스어는 문자 그대로 ‘벽 안에/벽에’라는 위치를 말하므로, 과도한 해석을 피하면서도 자연스러운 한국어로 옮겼습니다.
- source_word: ἀφώδευσαν
  english_pob_choice: dropped ... dung
  chosen_korean: 뜨거운 배설물을 … 떨어뜨렸고
