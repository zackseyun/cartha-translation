base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/010.yaml
  text: And I did not know that sparrows were in the wall[a]; and while my eyes were open, the sparrows dropped warm dung into my eyes, and white films formed on my eyes. Then I went to physicians, but they did not help me[b]. But Achiacharus supported me until I went to Elymais.
  footnotes:
  - marker: a
    text: Or 'small birds'; the Greek στρουθία can refer more generally to small birds, though 'sparrows' is the most likely sense.
    reason: lexical_alternative
  - marker: b
    text: The Greek says 'white films' or 'white opacities' formed on his eyes; this is often understood as a cataract-like condition, but the text itself does not give a precise medical diagnosis.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나는 벽 안에 참새들이 있는 줄 알지 못했습니다[a]. 내 눈이 떠져 있을 때, 참새들이 따뜻한 배설물을 내 눈에 떨어뜨렸고, 내 눈에 흰 막이 생겼습니다[b]. 나는 의사들에게 갔지만, 그들은 내게 아무 도움이 되지 못했습니다. 그러나 아키아카로스는 내가 엘리마이스로 갈 때까지 나를 부양해 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: στρουθία는 ‘참새들’이 가장 가능성이 크지만, 더 넓게는 ‘작은 새들’을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 λευκώματα는 눈에 생긴 흰 혼탁 또는 막을 가리키며, 현대 의학상의 특정 진단을 직접 말하지는 않습니다.
    reason: lexical_alternative
