base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/010.yaml
  text: And I did not know that sparrows were in the wall[a]; and while my eyes were open, the sparrows dropped warm dung into my eyes, and white films formed on my eyes. Then I went to physicians, but they did not help me[b]. But Achiacharus supported me until I went to Elymais.
  footnotes:
  - marker: a
    text: Or 'small birds'; the Greek στρουθία can refer more generally to small birds, though 'sparrows' is the most likely sense.
    reason: lexical_alternative
  - marker: b
    text: The Greek says 'white films' or 'white opacities' formed on his eyes; this is often understood as a cataract-like condition, but the text itself does not give a precise medical diagnosis.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나는 벽에 참새들이 있는 줄 알지 못했습니다[a]. 내 눈이 뜬 채였는데도 참새들이 뜨거운 배설물을 내 눈에 떨어뜨렸고, 내 눈에는 흰 막이 생겼습니다[b]. 그래서 나는 의사들에게 갔지만 그들은 나를 도와주지 못했습니다. 그러나 아키아카루스는 내가 엘라마이스로 갈 때까지 나를 부양해 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: στρουθία는 ‘참새들’이 가장 가능성이 크지만, 더 넓게는 ‘작은 새들’을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 λευκώματα는 눈에 생긴 흰 혼탁 또는 막을 가리키며, 현대 의학상의 특정 진단을 직접 말하지는 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: στρουθία
  english_pob_choice: sparrows
  chosen_korean: 참새들
  alternatives_korean:
  - 작은 새들
  - 새들
  lexicon: LSJ
  rationale: στρουθίον은 참새 또는 작은 새를 가리킬 수 있으나, 한국어에서는 ‘참새들’이 가장 구체적이고 자연스럽습니다.
- source_word: ἐν τῷ τοίχῳ
  english_pob_choice: in the wall
  chosen_korean: 벽에
  alternatives_korean:
  - 벽 안에
  - 벽 속에
  - 벽에 있는
  lexicon: LSJ
  rationale: 그리스어는 문자 그대로 ‘벽 안에/벽에’라는 위치를 말하므로, 과도한 해석을 피하면서도 자연스러운 한국어로 옮겼습니다.
- source_word: ἀφώδευσαν
  english_pob_choice: dropped ... dung
  chosen_korean: 뜨거운 배설물을 … 떨어뜨렸고
  alternatives_korean:
  - 배설했다
  - 똥을 떨어뜨렸고
  - 배설물을 떨어뜨렸고
  lexicon: LSJ
  rationale: 동사의 노골적인 배설 의미를 살리되, 한국어에서 지나치게 비속하지 않도록 ‘배설물’로 옮겼습니다.
- source_word: λευκώματα
  english_pob_choice: white films
  chosen_korean: 흰 막
  alternatives_korean:
  - 흰 반점
  - 흰 혼탁
  - 흰 막들
  lexicon: LSJ
  rationale: 정확한 현대 의학 진단을 단정하지 않고, 눈에 생긴 흰 혼탁/막이라는 묘사적 의미를 간결하게 살렸습니다.
- source_word: ἔτρεφέν με
  english_pob_choice: supported me
  chosen_korean: 나를 부양해 주었습니다
  alternatives_korean:
  - 나를 먹여 살려 주었습니다
  - 나를 돌보아 주었습니다
  - 나를 먹여 주었습니다
  lexicon: LSJ
  rationale: 문맥상 단순 급식보다 지속적인 생계 보조의 의미가 더 강하므로, ‘부양하다’가 가장 잘 맞습니다.
theological_decisions:
- issue: 눈의 병변 묘사(λευκώματα)의 처리
  chosen_reading: 특정 병명으로 단정하지 않고 ‘흰 막’으로 묘사했습니다.
  alternative_readings:
  - 백내장
  - 흰 반점
  - 혼탁
  rationale: 본문은 관찰된 현상을 말할 뿐 현대 의학적 진단을 요구하지 않으므로, 서술의 범위를 넘지 않도록 했습니다.
  doctrine_reference: '번역 원리: 원문 우선, 과잉 해석 자제'
- issue: Αἰχιαχάρος 이름 음역
  chosen_reading: 아키아카루스
  alternative_readings:
  - 아히아카로스
  - 아키아하로스
  rationale: 그리스어 고유명사는 현대 한국어 음역 관례에 따라 옮기되, 익숙한 성서 인명 표기와 충돌하지 않도록 음가에 가깝게 처리했습니다.
  doctrine_reference: 고유명사 표기 원칙
