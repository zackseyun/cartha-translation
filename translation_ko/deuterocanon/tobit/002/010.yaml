revisions:
- from: 그리고 나는 벽에 참새들이 있는 줄 알지 못했습니다[a]. 내 눈이 뜬 채였는데도 참새들이 뜨거운 배설물을 내 눈에 떨어뜨렸고, 내 눈에는 흰 막이 생겼습니다[b]. 그래서 나는 의사들에게 갔지만 그들은 나를 도와주지 못했습니다. 그러나 아키아카루스는 내가 엘라마이스로 갈 때까지 나를 부양해 주었습니다.
  to: 그리고 나는 벽 안에 참새들이 있는 줄 알지 못했습니다[a]. 내 눈이 떠져 있을 때, 참새들이 따뜻한 배설물을 내 눈에 떨어뜨렸고, 내 눈에 흰 막이 생겼습니다[b]. 나는 의사들에게 갔지만, 그들은 내게 아무 도움이 되지 못했습니다. 그러나 아키아카로스는 내가 엘리마이스로 갈 때까지 나를 부양해 주었습니다.
  rationale: 시간절을 원문의 시간적 의미로 회복하고, 위치 표현을 ‘벽 안에’로 명시했습니다. 눈의 병변은 진단명 없이 묘사적으로 유지했습니다. 의사들의 처치가 ‘도움이 되지 않았다’는 뜻을 자연스럽게 옮겼고, 두 고유명사는 제공된 그리스어 본문에 따라 음역을 조정했습니다.
