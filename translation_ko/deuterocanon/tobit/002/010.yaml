  lexicon: LSJ
  rationale: 문맥상 단순 급식보다 지속적인 생계 보조의 의미가 더 강하므로, ‘부양하다’가 가장 잘 맞습니다.
theological_decisions:
- issue: 눈의 병변 묘사(λευκώματα)의 처리
  chosen_reading: 특정 병명으로 단정하지 않고 ‘흰 막’으로 묘사했습니다.
  alternative_readings:
