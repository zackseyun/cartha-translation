  language: ko
  text: 그녀는 그것을 주인들에게 보내곤 했으며, 그들도 그녀에게 품삯을 주고, 거기에 어린 염소 한 마리를 더 보태 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
