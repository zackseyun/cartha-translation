lexical_decisions:
- source_word: ἔτι προσθήσω
  english_pob_choice: I will add more
  chosen_korean: 더 보태 주겠습니다
  alternatives_korean:
  - 더해 주겠습니다
  - 더 주겠습니다
  - 추가로 주겠습니다
  lexicon: LSJ
  rationale: ‘더’와 ‘보태다’가 추가 지급의 의미를 자연스럽게 살리면서, ἔτι προσθήσω의 ‘덧붙여 주는’ 뉘앙스를 한국어로 분명하게 전달합니다.
- source_word: ἐπὶ τὸν μισθόν
  english_pob_choice: to your wages
  chosen_korean: 너희 삯에
  alternatives_korean:
  - 너희 품삯에
  - 너희 보수에
  - 너희 급료에
  lexicon: LSJ
  rationale: μισθός는 고용 맥락의 보수를 가리키므로 ‘삯’이 가장 간결하고 직접적입니다. ‘너희’는 수신자 문맥상 자연스럽게 드러내었습니다.
- source_word: ὑγιαίνοντες
  english_pob_choice: in good health
  chosen_korean: 건강한 몸으로
  alternatives_korean:
  - 무사히
  - 건강하게
  - 몸 성히
  lexicon: LSJ
  rationale: 직역하면 ‘건강한 상태로’이므로, 여행 중 신체적 온전함을 강조하는 문맥을 살려 ‘건강한 몸으로’로 옮겼습니다.
- source_word: ἐπιστρέψητε
  english_pob_choice: you return
  chosen_korean: 돌아오면
  alternatives_korean:
  - 되돌아오면
  - 다시 오면
  - 귀환하면
  lexicon: LSJ
  rationale: 여행 후 귀환을 뜻하는 동사이므로, 현대 한국어에서 자연스러운 ‘돌아오면’이 가장 적절합니다.
