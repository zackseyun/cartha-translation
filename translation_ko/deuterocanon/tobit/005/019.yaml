  text: Do not value silver against silver[a], but let it become refuse for our child.
  footnotes:
  - marker: a
    text: 'Greek literally, ''Do not let silver get ahead of silver, but let it become offscouring of our child.'' The line is idiomatic: the sense is that money should be treated as worthless compared with the child.'
    reason: lexical_alternative
translation:
  language: ko
  text: 은금을 은금으로 여기지 말고, 우리 아이에게는 쓰레기처럼 되게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로는 “은이 은보다 앞서지 못하게 하라, 오히려 그것이 우리 아이의 찌꺼기가 되게 하라”에 가깝습니다. 이 문장은 관용적 표현으로, 뜻은 돈을 아이에 비하면 무가치하게 여기라는 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀργύριον τῷ ἀργυρίῳ
  english_pob_choice: Do not value silver against silver
  chosen_korean: 은금을 은금으로 여기지 말고
  alternatives_korean:
