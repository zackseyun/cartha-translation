    text: 그리스어를 문자적으로 옮기면 “은이 은보다 앞서게 하지 말고, 오히려 그것이 우리 아이의 찌꺼기가 되게 하라”입니다. 이 표현은 관용적으로, 아이와 비교하면 돈은 아무 가치도 없게 여기라는 뜻입니다.
    reason: lexical_alternative
