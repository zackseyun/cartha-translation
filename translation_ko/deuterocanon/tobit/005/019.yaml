  lexicon: LSJ
  rationale: 반복된 ἀργύριον/ἀργυρίῳ의 속담적 압축을 살리기 위해 구체적 금속어를 유지했습니다. 한국어에서는 비교의 대상을 자연스럽게 드러내기 위해 ‘…으로 여기지 말고’로 옮겼습니다.
- source_word: μὴ φθάσαι
