  lexicon: LSJ
  rationale: 속격 관계를 한국어의 비교·귀속 의미로 풀어, 돈의 가치는 아이와 관련해서는 전혀 중요하지 않다는 뜻이 분명히 드러나도록 했습니다.
theological_decisions:
- issue: 재산보다 아이의 생명을 우선하는 속담적 표현의 유지
  chosen_reading: 이 절은 돈이 아이에 비하면 아무 가치가 없다는 뜻의 격언으로 읽고, 그 과장된 폄하를 그대로 살렸습니다.
  alternative_readings:
  - 돈을 돈끼리 비교하지 말라는 경제적 조언으로 좁혀 읽기
  - ‘은’을 문자적으로만 읽어 화폐 일반을 약화시키기
  rationale: 본문은 교리 논쟁문이 아니라 강한 비유적 우선순위 선언입니다. 의미를 순화하지 않고, 자녀의 안전이 재물보다 우선한다는 긴박감을 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
