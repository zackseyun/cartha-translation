  lexicon: LSJ
  rationale: περίψημα의 ‘닦여 나온 찌꺼기/버려진 찌꺼기’라는 강한 경멸을 현대 한국어에서 가장 분명하게 전달하는 표현으로 선택했습니다.
- source_word: τοῦ παιδίου ἡμῶν
