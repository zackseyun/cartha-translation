  text: Do not value silver against silver[a], but let it become refuse for our child.
  footnotes:
  - marker: a
    text: 'Greek literally, ''Do not let silver get ahead of silver, but let it become offscouring of our child.'' The line is idiomatic: the sense is that money should be treated as worthless compared with the child.'
    reason: lexical_alternative
