base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/012.yaml
  text: And he said to him[a], “Are you seeking a tribe and a family line, or a hired man who will go with your son?” And Tobit said to him, “I want to know[c][b], brother,”
  footnotes:
  - marker: a
    text: 'The Greek is slightly elliptical at the end: literally, ''I want, brother.'' The translation supplies ''to know'' from the preceding question to make the sense explicit.'
    reason: lexical_alternative
  - marker: b
    text: The wording 'tribe and family line' reflects social and genealogical identity, not necessarily two sharply distinct categories in modern terms.
    reason: cultural_note
  - marker: c
    text: The source text for this verse shows a minor mismatch in transcription confidence, but the overall sense is clear.
    reason: textual_variant
translation:
  language: ko
  text: 그가 그에게 말했습니다. 「당신은 지파와 가문을 찾고 있습니까, 아니면 당신의 아들과 함께 갈 품꾼을 찾고 있습니까?」 그러자 토빗이 그에게 말했습니다. 「형제여, 저는 알고 싶습니다」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 끝이 다소 생략되어 있으며, 직역하면 ‘나는 원한다, 형제여’에 가깝습니다. 한국어는 앞선 질문의 의미를 받아 ‘알고 싶습니다’로 풀었습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘지파와 가문’은 현대적 분류보다 사회적·계보적 소속을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 이 절은 전승상 사소한 전사 불일치가 있으나, 전체 의미는 분명합니다.
    reason: textual_variant
lexical_decisions:
- source_word: Φυλήν
  english_pob_choice: tribe
  chosen_korean: 지파
  alternatives_korean:
  - 부족
  - 종족
  lexicon: LSJ
  rationale: 유대 사회의 혈연·소속 단위를 가리키는 말로서, 한국어 성경 전통과 원문의 집단적 소속감을 함께 살리기에 ‘지파’가 가장 자연스럽습니다.
- source_word: πατριὰν
  english_pob_choice: family line
  chosen_korean: 가문
  alternatives_korean:
  - 가계
  - 족보
  - 혈통
  lexicon: LSJ
  rationale: 원문은 단순한 가족이 아니라 계보와 출신을 가리키므로, 사회적·혈연적 연속성을 드러내는 ‘가문’이 적절합니다.
- source_word: μίσθιον
  english_pob_choice: a hired man
  chosen_korean: 품꾼
  alternatives_korean:
  - 삯꾼
  - 고용인
  - 일꾼
  lexicon: LSJ
  rationale: 대가를 받고 고용된 사람이라는 의미를 살리면서도, 문맥상 다소 낮은 신분의 고용 노동자를 드러내는 ‘품꾼’이 가장 직접적입니다.
- source_word: Βούλομαι
  english_pob_choice: I want to know
  chosen_korean: 알고 싶습니다
  alternatives_korean:
  - 원합니다
  - 바랍니다
  - 알기 원합니다
  lexicon: LSJ
  rationale: 그리스어는 앞 질문을 받아 생략된 목적어를 전제하는 축약형이므로, 문맥상 완성된 뜻인 ‘알고 싶습니다’로 옮겨 자연스러우면서도 과도한 의역을 피했습니다.
theological_decisions:
- issue: 아들에 대한 보호와 동행의 현실적 질문을 어떻게 드러낼지
  chosen_reading: ‘당신의 아들과 함께 갈 품꾼’으로 옮겨, 단순 동반자가 아니라 실제로 고용된 동행자를 묻는 질문임을 분명히 했습니다.
  alternative_readings:
  - ‘당신의 아들과 동행할 사람’
  - ‘아들과 함께 갈 일꾼’
  rationale: 원문의 μίσθιον은 일반적 ‘동행자’보다 고용 관계를 더 강하게 내포하므로, 문맥의 현실성과 대조를 살리기 위해 신분·관계성을 드러냈습니다.
  doctrine_reference: '문맥 주해: 토빗 5:12의 실질적 대화 상황'
