  yaml_path: translation/deuterocanon/tobit/005/014.yaml
  text: And he said to him[a], “May you come in health, brother; and do not be angry with me because I sought to learn your tribe and your family. And you indeed turn out to be my brother, from a good and noble lineage. For I knew Ananias and Jathan, the sons of Shemaiah the great, as we used to go together to Jerusalem to worship, bringing the firstborn and the tithes of the produce; and they were not led astray in the error of our brothers. You are from a good root[b], brother.”
  footnotes:
  - marker: a
    text: Or 'Go in health.' The Greek literally says, 'May you come in health,' a conventional wish for well-being.
    reason: lexical_alternative
  - marker: b
    text: '''Our brothers'' here refers to fellow kinsmen/Israelites, not necessarily only male siblings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그에게 말하였습니다. 「건강하게 오십시오, 형제여. 그리고 제가 당신의 지파와 가문을 알아보려고 한 일로 저에게 화내지 마십시오. 당신은 참으로 제 형제, 곧 선하고 귀한 혈통에서 난 사람으로 드러났습니다. 제가 안나니아와 야단, 곧 위대한 세메이의 아들들을 알고 있었기 때문입니다. 우리는 함께 예루살렘으로 가서 예배드리며, 맏물과 소산의 십일조를 바치곤 하였습니다. 그들은 우리 형제들의 잘못된 길에 미혹되지 않았습니다. 형제여, 당신은 선한 뿌리에서 났습니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘건강하게 오십시오’는 원문의 ‘오다’(ἔλθοις)를 살린 축복 인사입니다. 자연스러운 작별 인사로는 ‘건강하게 가십시오’도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘우리 형제들’은 반드시 혈연 형제만이 아니라 동족, 곧 이스라엘 사람들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑγιαίνων ἔλθοις
  english_pob_choice: May you come in health
  chosen_korean: 건강하게 오십시오
  alternatives_korean:
  - 평안히 오십시오
  - 건강하기를 빕니다
  lexicon: LSJ
  rationale: 인사말의 관용적 축복을 살리되, 원문의 ‘오다’(ἔλθοις)보다 한국어에서 더 자연스러운 정중 표현으로 옮겼습니다.
- source_word: φυλήν ... πατριάν
  english_pob_choice: tribe ... family
  chosen_korean: 지파 ... 가문
  alternatives_korean:
  - 종족 ... 가족
  - 부족 ... 집안
  lexicon: LSJ
  rationale: 이스라엘 정체성과 계보를 함께 드러내는 말이어서, 성경 문맥에서 친숙하면서도 혈통적 뉘앙스를 살리는 ‘지파’, ‘가문’을 선택했습니다.
- source_word: τυγχάνεις ἀδελφός μου
  english_pob_choice: you indeed turn out to be my brother
  chosen_korean: 당신은 참으로 제 형제 ... 로 드러났습니다
  alternatives_korean:
  - 당신은 참으로 제 형제입니다
  - 당신이 제 형제임이 밝혀졌습니다
  lexicon: BDAG
  rationale: τυγχάνεις의 발견·판명 뉘앙스를 살려 단순한 동일시보다 ‘드러났습니다’로 옮겼습니다.
- source_word: ἐκ τῆς καλῆς καὶ ἀγαθῆς γενεᾶς
  english_pob_choice: from a good and noble lineage
  chosen_korean: 선하고 귀한 혈통
  alternatives_korean:
  - 좋고 귀한 가문
  - 선하고 훌륭한 계통
  lexicon: LSJ
  rationale: γενεά의 계보적 의미를 살리면서, 도덕적 평가와 신분적 품격을 함께 담기 위해 ‘혈통’을 썼습니다.
- source_word: τὰ πρωτότοκα καὶ τὰς δεκάτας τῶν γενημάτων
  english_pob_choice: the firstborn and the tithes of the produce
  chosen_korean: 맏물과 소산의 십일조
  alternatives_korean:
  - 첫 소산과 소출의 십일조
  - 첫째 것들과 생산의 십일조
  lexicon: LSJ
  rationale: 제의적·농경적 맥락에서 ‘맏물’이 가장 자연스럽고, γενημάτων은 ‘소산’으로 넓게 포괄하되 제물의 의미를 유지했습니다.
- source_word: οὐκ ἐπλανήθησαν ἐν τῇ πλάνῃ τῶν ἀδελφῶν ἡμῶν
  english_pob_choice: they were not led astray in the error of our brothers
  chosen_korean: 그들은 우리 형제들의 잘못된 길에 미혹되지 않았습니다
  alternatives_korean:
  - 우리 형제들의 오류에 빠지지 않았습니다
  - 우리 형제들의 미혹 속에서 길을 잃지 않았습니다
  lexicon: BDAG
  rationale: πλάνη의 ‘미혹/잘못’ 뉘앙스를 유지하면서, 동사의 수동적 성격을 한국어에서 자연스럽게 표현했습니다.
- source_word: ἐκ ῥίζης καλῆς
  english_pob_choice: from a good root
  chosen_korean: 선한 뿌리에서 났습니다
  alternatives_korean:
  - 좋은 뿌리에서 났습니다
  - 좋은 뿌리에서 나온 사람입니다
  lexicon: LSJ
  rationale: 뿌리의 은유를 그대로 살려 혈통과 기원의 이미지를 유지했습니다.
theological_decisions:
- issue: 형제·지파·가문·뿌리의 계보적 언어
  chosen_reading: 친족 일반화로 풀지 않고 원문의 계보적 표현을 유지했습니다.
  alternative_readings:
  - ‘친척’으로 완화
  - ‘좋은 집안’으로만 정리
  rationale: 이 장면은 개인적 친분이 아니라 이스라엘 안의 혈통·정체성·예배 충실성을 확인하는 말이므로, 계보 언어를 보존해야 본문의 신학적 무게가 드러납니다.
  doctrine_reference: DOCTRINE.md §§1, 4, 5
