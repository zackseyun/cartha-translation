  rationale: 이스라엘 정체성과 계보를 함께 드러내는 말이어서, 성경 문맥에서 친숙하면서도 혈통적 뉘앙스를 살리는 ‘지파’, ‘가문’을 선택했습니다.
- source_word: τυγχάνεις ἀδελφός μου
  english_pob_choice: you indeed turn out to be my brother
  chosen_korean: 당신은 참으로 제 형제 ... 로 드러났습니다
