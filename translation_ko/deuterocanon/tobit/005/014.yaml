  lexicon: LSJ
  rationale: 제의적·농경적 맥락에서 ‘맏물’이 가장 자연스럽고, γενημάτων은 ‘소산’으로 넓게 포괄하되 제물의 의미를 유지했습니다.
- source_word: οὐκ ἐπλανήθησαν ἐν τῇ πλάνῃ τῶν ἀδελφῶν ἡμῶν
  english_pob_choice: they were not led astray in the error of our brothers
  chosen_korean: 그들은 우리 형제들의 잘못된 길에 미혹되지 않았습니다
  alternatives_korean:
  - 우리 형제들의 오류에 빠지지 않았습니다
  - 우리 형제들의 미혹 속에서 길을 잃지 않았습니다
  lexicon: BDAG
  rationale: πλάνη의 ‘미혹/잘못’ 뉘앙스를 유지하면서, 동사의 수동적 성격을 한국어에서 자연스럽게 표현했습니다.
- source_word: ἐκ ῥίζης καλῆς
  english_pob_choice: from a good root
  chosen_korean: 선한 뿌리에서 났습니다
  alternatives_korean:
  - 좋은 뿌리에서 났습니다
  - 좋은 뿌리에서 나온 사람입니다
  lexicon: LSJ
  rationale: 뿌리의 은유를 그대로 살려 혈통과 기원의 이미지를 유지했습니다.
theological_decisions:
- issue: 형제·지파·가문·뿌리의 계보적 언어
  chosen_reading: 친족 일반화로 풀지 않고 원문의 계보적 표현을 유지했습니다.
  alternative_readings:
  - ‘친척’으로 완화
  - ‘좋은 집안’으로만 정리
  rationale: 이 장면은 개인적 친분이 아니라 이스라엘 안의 혈통·정체성·예배 충실성을 확인하는 말이므로, 계보 언어를 보존해야 본문의 신학적 무게가 드러납니다.
  doctrine_reference: DOCTRINE.md §§1, 4, 5
