- source_word: ἐκ τῆς καλῆς καὶ ἀγαθῆς γενεᾶς
  english_pob_choice: from a good and noble lineage
  chosen_korean: 선하고 귀한 혈통
  alternatives_korean:
  - 좋고 귀한 가문
  - 선하고 훌륭한 계통
  lexicon: LSJ
  rationale: γενεά의 계보적 의미를 살리면서, 도덕적 평가와 신분적 품격을 함께 담기 위해 ‘혈통’을 썼습니다.
- source_word: τὰ πρωτότοκα καὶ τὰς δεκάτας τῶν γενημάτων
  english_pob_choice: the firstborn and the tithes of the produce
  chosen_korean: 맏물과 소산의 십일조
  alternatives_korean:
