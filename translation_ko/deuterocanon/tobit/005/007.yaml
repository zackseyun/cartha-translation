base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/007.yaml
  text: And Tobiah said to him[a], “Wait for me, and I will tell my father.”
  footnotes:
  - marker: a
    text: 'The Greek text is brief: ''And Tobiah said to him, “Wait for me, and I will tell my father.”'' A parallel Semitic-form witness expands the scene by stating that Tobiah went and informed his father about the man he had found, then went out to call him. The main text follows the Greek source while the fuller context is preserved here.'
