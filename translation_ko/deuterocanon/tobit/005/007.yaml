base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/007.yaml
  text: And Tobiah said to him[a], “Wait for me, and I will tell my father.”
  footnotes:
  - marker: a
    text: 'The Greek text is brief: ''And Tobiah said to him, “Wait for me, and I will tell my father.”'' A parallel Semitic-form witness expands the scene by stating that Tobiah went and informed his father about the man he had found, then went out to call him. The main text follows the Greek source while the fuller context is preserved here.'
    reason: textual_variant
translation:
  language: ko
  text: 그러자 토비아가 그에게 말했습니다. 「잠깐 기다리십시오. 제가 아버지께 말씀드리겠습니다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 매우 간결합니다. 세미틱 계열의 더 긴 평행 전승은 토비아가 아버지에게 그 사람을 찾았다고 알리고, 밖으로 나가 그를 불러오는 장면을 덧붙입니다. 본문은 그리스어를 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: Ὑπόμεινόν
  english_pob_choice: Wait for me
  chosen_korean: 잠깐 기다리십시오
  alternatives_korean:
  - 여기서 기다리십시오
  - 잠시 머무르십시오
  - 저를 기다려 주십시오
  lexicon: BDAG
  rationale: 명령형 ὑπομένω는 여기서 상대에게 잠시 머물러 달라는 뜻이므로, 현대 한국어 대화체로 자연스러운 「잠깐 기다리십시오」가 원뜻을 가장 직접적으로 살립니다.
- source_word: ἐρῶ
  english_pob_choice: I will tell
  chosen_korean: 말씀드리겠습니다
  alternatives_korean:
  - 말하겠습니다
  - 전하겠습니다
  - 알리겠습니다
  lexicon: BDAG
  rationale: 직접 인용에서 아버지에게 내용을 알리는 행위이므로 단순한 「말하다」보다 존대가 필요한 맥락에 맞게 「말씀드리다」를 택했습니다.
- source_word: τῷ πατρί
  english_pob_choice: my father
  chosen_korean: 아버지께
  alternatives_korean:
  - 제 아버지에게
  - 아버지께
  - 아버지에게
  lexicon: BDAG
  rationale: 그리스어의 정관사 있는 「아버지」는 문맥상 자기 아버지를 가리키며, 한국어에서는 여격을 자연스럽게 드러내는 「아버지께」가 가장 간결합니다.
- source_word: Τωβίας
  english_pob_choice: Tobiah
  chosen_korean: 토비아
  alternatives_korean:
  - 토바이아
  - 토비아스
  lexicon: Greek proper name tradition
  rationale: 고유명사는 표준 음역을 따르되, 본문과 주석의 아람어 계열 형식과도 잘 맞는 「토비아」를 사용했습니다.
theological_decisions:
- issue: 직접 인용 안에서의 공손체 유지
  chosen_reading: 토비아의 발화는 상급자나 장년인 아버지에게 말하는 상황으로 보고, 본문 인용문 안에서도 존대형 명령과 서술을 유지했습니다.
  alternative_readings:
  - 인용문 안을 평서체로 낮춰 「기다려. 아버지에게 말할게」로 옮길 수 있음
  - 문장 전체를 서술체로 평탄화할 수 있음
  rationale: 원문은 단순 사실 진술이지만, 한국어에서는 대화 상대와의 관계를 드러내는 존대가 의미 전달에 중요하므로 공손한 직접화법이 자연스럽습니다.
  doctrine_reference: 문체/화행의 적절한 재현
