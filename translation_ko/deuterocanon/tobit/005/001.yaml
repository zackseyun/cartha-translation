  text: And Tobiah answered him[a], “Father, I will do everything that you have commanded me.”
  footnotes:
  - marker: a
    text: The parallel Semitic-form witness reads explicitly, 'Tobiah answered his father ... all that you commanded me, my father, I will do.' The Greek main witness has the simpler 'answered him' and vocative 'Father.'
    reason: alternative_reading
translation:
  language: ko
  text: 토비아가 그에게 대답했습니다. 「아버지, 아버지께서 제게 명령하신 모든 것을 다 하겠습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 병행 셈어형 증거는 ‘토비아가 그의 아버지에게 대답했다’라고 하고 호칭도 ‘내 아버지’라고 명시합니다. 그러나 본문이 따르는 그리스어 본문은 더 간결하게 ‘그에게 대답했다’ 및 ‘아버지’라고 합니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἀποκριθεὶς
  english_pob_choice: answered
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 응답하여 말했습니다
  - 대답했습니다
  lexicon: BDAG
  rationale: 서술용 분사로서 대화의 응답을 이끄는 기능을 살려 ‘대답하여 말했습니다’로 옮기면 한국어 문장 흐름이 자연스럽고 원문의 담화 구조도 보존됩니다.
- source_word: Τωβίας
  english_pob_choice: Tobiah
  chosen_korean: 토비아
  alternatives_korean:
  - 토비아스
  - 토비야
  lexicon: Greek proper-name tradition
  rationale: 한국어 성경 외래어 표기 관례에 따라 인명은 ‘토비아’로 옮겼습니다. 영어 POB의 Tobiah 선택과도 잘 맞습니다.
- source_word: ἐντέταλσαί μοι
  english_pob_choice: have commanded me
  chosen_korean: 저에게 명령하신
  alternatives_korean:
  - 저에게 명하신
  - 저에게 지시하신
  - 저에게 명령해 오신
  lexicon: BDAG
  rationale: 완료형이 담는 이미 내려진 명령의 결과 상태를 한국어에서는 관형절 ‘명령하신’으로 자연스럽게 표현했습니다. 가족 간 대화 맥락상 ‘지시하다’보다 ‘명령하다’가 원문 강도를 더 잘 드러냅니다.
- source_word: πάντα ὅσα
  english_pob_choice: everything that
  chosen_korean: 모든 것을 다
  alternatives_korean:
  - 무엇이든
  - 당신이 명령하신 모든 것
  lexicon: BDAG
  rationale: ‘πάντα ὅσα’의 포괄성을 살리되 한국어로는 ‘모든 것을 다’가 가장 간결하고 완전한 이중 강조를 유지합니다.
theological_decisions:
- issue: 보호자에게 하는 직접 호칭의 존대 수준
  chosen_reading: 토비아가 아버지에게 직접 말하지만, 인용문 안에서는 평서형과 존대형을 섞어 공손한 가족 대화의 톤을 유지했습니다.
  alternative_readings:
  - 인용문 전체를 평서형으로 낮추는 번역
  - ‘아버지’만 두고 나머지를 완전 평서로 처리하는 번역
  rationale: 원문은 단순한 서사적 대화이지만, 아들을 아버지에게 말하는 장면이므로 한국어에서는 합쇼체로 번역하되 과도한 경어는 피하는 것이 자연스럽습니다.
  doctrine_reference: 문체·화행에 관한 번역 원칙
