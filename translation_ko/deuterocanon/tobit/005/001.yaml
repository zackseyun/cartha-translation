  source_fidelity: 그리스어 본문은 ‘토비아가 그에게 대답하여 말하였다. “아버지, 당신이 내게 명령한 모든 것을 하겠습니다.”’라는 뜻입니다. 초안의 ‘저에게 명령하신’은 문법상 토비아 자신이 자신에게 명령한 것으로 읽혀, ἐντέταλσαί μοι의 주어인 아버지를 반영하지 못합니다.
  naturalness: 서사와 인용문을 모두 현대 표준어 합쇼체로 유지할 수 있습니다. ‘대답하여 말했습니다’는 ἀποκριθεὶς εἶπεν의 중복을 다소 직역한 표현이므로, 한국어에서는 ‘대답했습니다’가 자연스럽습니다.
  terminology: ‘토비아’와 직접 호칭 ‘아버지’는 적절합니다. 아버지에게 드리는 말의 공손한 관계는 ‘아버지께서 제게 명령하신’으로 자연스럽게 나타낼 수 있으며, 그리스어에 없는 소유격 ‘내’를 본문에 보태지 않습니다.
