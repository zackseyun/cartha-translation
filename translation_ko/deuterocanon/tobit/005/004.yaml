base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/004.yaml
  text: And he went to look for a man[a], and he found Raphael, who was an angel, but he did not know it.
  footnotes:
  - marker: a
    text: Or 'messenger.' The Greek word can mean either, but here the narrator means that Raphael was an angelic being.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 사람을 찾으러 갔고, 라파엘을 만났습니다. 라파엘은 천사였지만, 그는 그것을 알지 못했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '사자'. 그리스어는 둘 다 뜻할 수 있지만, 여기서는 서술자가 천사적 존재를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύθη ζητῆσαι ἄνθρωπον
  english_pob_choice: he went to look for a man
  chosen_korean: 사람을 찾으러 갔고
  alternatives_korean:
  - 남자를 찾으러 갔고
  - 한 사람을 찾아 갔고
  lexicon: BDAG
  rationale: 목적을 나타내는 ζητῆσαι를 한국어의 자연스러운 '-러 가다'로 옮기고, ἄνθρωπον은 문맥상 동행할 사람을 가리키므로 '사람'으로 두었습니다.
- source_word: εὗρεν Ῥαφαήλ
  english_pob_choice: he found Raphael
  chosen_korean: 라파엘을 만났습니다
  alternatives_korean:
  - 라파엘을 찾았습니다
  - 라파엘을 발견했습니다
  lexicon: BDAG
  rationale: εὗρεν의 직역은 '찾다/발견하다'이지만, 서사 흐름에서 우연히 조우한 뉘앙스를 살리기 위해 '만났습니다'를 택했습니다.
- source_word: ἄγγελος
  english_pob_choice: angel
  chosen_korean: 천사
  alternatives_korean:
  - 사자
  - 메신저
  lexicon: BDAG
  rationale: 이 절의 서술은 라파엘의 정체를 하늘의 존재로 밝히므로, 문맥을 흐리는 '사자'보다 '천사'가 원문의 평이한 의미를 더 분명하게 반영합니다.
- source_word: οὐκ ᾔδει
  english_pob_choice: he did not know it
  chosen_korean: 그는 그것을 알지 못했습니다
  alternatives_korean:
  - 그는 알지 못했습니다
  - 그 사실을 몰랐습니다
  lexicon: BDAG
  rationale: 그리스어는 목적어를 생략하지만, 여기서는 라파엘이 천사라는 사실을 가리키므로 한국어에서 목적어를 보완해 의미를 분명히 했습니다.
theological_decisions:
- issue: ἄγγελος의 번역과 라파엘의 정체
  chosen_reading: 본문에는 '천사'를 두어 라파엘이 단순한 인간 사자가 아니라 천상적 존재임을 드러냈습니다.
  alternative_readings:
  - 사자
  - 메신저
  rationale: 이 절은 서술자 관점에서 라파엘의 정체를 계시하는 대목이므로, 독자가 이야기를 따라가며 반전을 알아차리도록 '천사'를 유지하는 것이 원문과 주석 전통에 부합합니다.
  doctrine_reference: 'DOCTRINE.md: 원문의 분명한 뜻을 따라 번역하고, 신학적 긴장은 평평하게 만들지 말 것'
