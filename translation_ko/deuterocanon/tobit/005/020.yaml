  text: For as it has been given to us by the Lord to live, this is enough for us.
translation:
  language: ko
  text: 우리에게 사는 것이 주님으로부터 주어졌으니, 이것으로 우리에게는 충분합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς γὰρ
  english_pob_choice: For as
  chosen_korean: …하였으니
  alternatives_korean:
  - …이므로
  - 'For as의 직역형: …한 것처럼'
  lexicon: LSJ
  rationale: γάρ의 설명적 연결과 ὡς의 근거 제시를 자연스러운 한국어 종결로 살렸습니다. 문맥상 뒤 결론을 받치는 이유절로 읽히므로 ‘…하였으니’가 가장 간결합니다.
- source_word: δέδοται
  english_pob_choice: it has been given
  chosen_korean: 주어졌으니
  alternatives_korean:
  - 주어졌습니다
  - 주어진
  lexicon: BDAG
  rationale: 완료 수동의 지속된 수여 상태를 한국어 과거-현재 연결로 반영했습니다. 단순 현재보다 ‘주어졌으니’가 결과 상태를 더 잘 드러냅니다.
- source_word: παρὰ τοῦ κυρίου
  english_pob_choice: by the Lord
  chosen_korean: 주님으로부터
  alternatives_korean:
  - 주님에 의해
  - 주님께로부터
  lexicon: BDAG
  rationale: παρά+속격의 출처/기원을 한국어의 출발점 표현으로 옮겼습니다. ‘주님’은 κύριος의 프로젝트 기본값을 따릅니다.
- source_word: ἱκανὸν ... ὑπάρχει
  english_pob_choice: is enough
  chosen_korean: 충분합니다
  alternatives_korean:
  - 족합니다
  - 충분히 있습니다
  lexicon: BDAG
  rationale: 관용적으로 ‘~ἱκανὸν ὑπάρχει’는 ‘충분하다’의 뜻이므로, 현대 한국어에서 자연스러운 서술어로 처리했습니다.
theological_decisions:
- issue: κύριος의 한국어 처리
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 주인
  rationale: 이 구절은 생명이 하나님에게서 오는 선물임을 말하므로, 경외적 호칭인 ‘주님’이 가장 적절합니다. 추가적 개념을 덧붙이지 않고 원문의 신적 출처를 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → 주님'
