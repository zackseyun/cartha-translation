base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/003.yaml
  text: And he gave him the written note and said to him[a], “Find for yourself a man who will go with you, and I will give him wages while I live[b]; then go and get the silver.”
  footnotes:
  - marker: a
    text: Or “the money.” Greek ἀργύριον literally means “silver,” but in context it refers to the deposited funds.
    reason: lexical_alternative
  - marker: b
    text: The parallel Semitic witness points to a token or identifying document connected with the deposit; this supports translating χειρόγραφον as a written note rather than a generic letter.
    reason: cross_reference
translation:
  language: ko
  text: 그는 그에게 서면 증서를 주고 그에게 말했습니다. 「당신과 함께 갈 사람 한 명을 당신을 위해 구하십시오. 그러면 내가 살아 있는 동안 그에게 삯을 주겠습니다. 그리고 가서 그 은을 가져가십시오.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 ἀργύριον은 문자 그대로의 ‘은’이지만, 예탁된 자금을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: χειρόγραφον은 손으로 쓴 문서라는 기본 뜻을 가지며, 이 문맥에서는 예탁금과 연결된 서면 증서로 이해됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: χειρόγραφον
  english_pob_choice: written note
  chosen_korean: 서면 증서
  alternatives_korean:
  - 쓴 문서
  - 필기한 서류
  - 손으로 쓴 문서
  lexicon: LSJ
  rationale: χειρόγραφον은 손으로 쓴 문서라는 기본 뜻이지만, 이 문맥에서는 예탁된 돈과 관련된 증서로 기능하므로 너무 좁은 ‘영수증’이나 너무 일반적인 ‘편지’보다 ‘서면 증서’가 원문의 구체성을 살립니다.
- source_word: Ζήτησον σεαυτῷ ἄνθρωπον
  english_pob_choice: Find for yourself a man
  chosen_korean: 당신을 위해 구하십시오. 「당신과 함께 갈 사람 한 명을」
  alternatives_korean:
  - 당신을 위해 사람 한 명을 찾으십시오
  - 당신에게 맞는 사람을 구하십시오
  - 동행할 사람을 찾으십시오
  lexicon: LSJ
  rationale: ἄνθρωπον이 단수 남성형이므로 중성적 표현으로 완화하지 않고 ‘사람 한 명’으로 옮겼으며, “당신을 위해”는 σεαυτῷ의 자기 관련성을 반영합니다.
- source_word: συμπορεύσεταί
  english_pob_choice: will go with you
  chosen_korean: 함께 갈
  alternatives_korean:
  - 동행할
  - 같이 여행할
  - 같이 갈
  lexicon: LSJ
  rationale: 복합 동사 συμπορεύσεταί는 함께 가다/여행하다의 뜻이므로, 현대 한국어에서는 가장 자연스러운 ‘함께 갈’로 옮겨 이동의 의미를 분명히 했습니다.
- source_word: μισθὸν
  english_pob_choice: wages
  chosen_korean: 삯
  alternatives_korean:
  - 임금
  - 품삯
  - 보수
  lexicon: LSJ
  rationale: μισθός는 일이나 봉사에 대한 지급을 가리키며, 여기서는 동행자를 고용하는 맥락이므로 다소 구어적이지만 의미가 정확한 ‘삯’이 적합합니다.
- source_word: ἕως ζῶ
  english_pob_choice: while I live
  chosen_korean: 내가 살아 있는 동안
  alternatives_korean:
  - 내가 사는 동안
  - 내가 살아 있는 한
  - 내 생전에
  lexicon: LSJ
  rationale: ἕως ζῶ는 생존 기간 전체를 가리키는 관용적 표현이므로, 약속의 지속 기간을 분명히 드러내는 ‘내가 살아 있는 동안’이 자연스럽습니다.
- source_word: τὸ ἀργύριον
  english_pob_choice: the silver
  chosen_korean: 그 은
  alternatives_korean:
  - 그 돈
  - 은전
  - 은화
  lexicon: LSJ
  rationale: ἀργύριον은 문자적으로 은이지만 문맥상 예탁된 자금을 가리키므로, 원문 이미지를 보존하면서도 한국어에서 어색하지 않은 ‘그 은’으로 옮겼습니다.
theological_decisions:
- issue: 동행자 요청의 표현 방식
  chosen_reading: ‘당신과 함께 갈 사람 한 명을 당신을 위해 구하십시오’로 옮겨, 단순한 ‘사람’이 아니라 실제 동행자를 찾으라는 요청을 살렸습니다.
  alternative_readings:
  - ‘도와줄 사람을 찾으십시오’
  - ‘동행할 사람을 구하십시오’
  rationale: 본문은 단순한 조력자가 아니라 실제로 함께 갈 남성을 요구하므로, 의미를 흐리지 않도록 구체성을 유지했습니다.
  doctrine_reference: 서사 문맥 보존
