base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/006.yaml
  text: And the angel said to him[a], “I will go with you, and I am familiar with the way, and I have lodged with Gabael our brother.”
  footnotes:
  - marker: a
    text: Or, “I am experienced in the road,” that is, “I know the route well.” The Semitic parallel similarly expands the sense to knowing the roads.
    reason: lexical_alternative
translation:
  language: ko
  text: 천사가 그에게 말했습니다. "나는 당신과 함께 가겠습니다. 나는 길을 잘 알고 있으며, 우리 형제 가바엘에게 머문 적이 있습니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나는 길에 익숙합니다”, 곧 “길을 잘 압니다”라는 뜻입니다. 세미틱 평행본문도 ‘길들’을 아는 의미로 넓혀 줍니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἄγγελος
  english_pob_choice: the angel
  chosen_korean: 천사
  alternatives_korean:
  - 사자
  - 메신저
  lexicon: LSJ
  rationale: 이 문맥에서 ἄγγελος는 일반적인 ‘전달자’보다 실제 천사 존재를 가리키므로, 한국어도 자연스럽게 ‘천사’로 옮겼습니다.
- source_word: Πορεύσομαι μετὰ σοῦ
  english_pob_choice: I will go with you
  chosen_korean: 당신과 함께 가겠습니다
  alternatives_korean:
  - 당신과 동행하겠습니다
  - 당신과 함께 여행하겠습니다
  lexicon: LSJ
  rationale: πορεύσομαι는 단순한 이동 약속이므로, 구어체보다도 서사체에 맞는 ‘함께 가겠습니다’가 가장 직접적입니다.
- source_word: τῆς ὁδοῦ ἐμπειρῶ
  english_pob_choice: I am familiar with the way
  chosen_korean: 길을 잘 알고 있으며
  alternatives_korean:
  - 길에 익숙하며
  - 길을 잘 압니다
  lexicon: LSJ
  rationale: ἐμπειρῶ의 ‘경험한, 익숙한’ 뉘앙스를 살리면서 한국어에서는 자연스럽게 ‘길을 잘 알고’로 풀어, 단순한 지식보다 실제적 익숙함을 드러냈습니다.
- source_word: παρὰ Γαβαὴλ τὸν ἀδελφὸν ἡμῶν
  english_pob_choice: with Gabael our brother
  chosen_korean: 우리 형제 가바엘에게
  alternatives_korean:
  - 우리 형제 가바엘과 함께
  - 우리 형제 가바엘 집에
  lexicon: LSJ
  rationale: παρά + 인명은 함께 머묾/머문 장소를 가리킬 수 있으므로, ‘에게 머문 적이 있습니다’로 옮겨 숙박의 뜻을 자연스럽게 담았습니다.
- source_word: ηὐλίσθην
  english_pob_choice: I have lodged
  chosen_korean: 머문 적이 있습니다
  alternatives_korean:
  - 묵은 적이 있습니다
  - 숙박한 적이 있습니다
  lexicon: LSJ
  rationale: αὐλίζομαι는 ‘묵다, 머물다’의 여행어법이므로, 현대 한국어에서는 ‘머문 적이 있습니다’가 가장 자연스럽고 과도하게 격식적이지 않습니다.
theological_decisions:
- issue: 천사 발화의 문체와 존대
  chosen_reading: 서술문은 합쇼체로 유지하고, 직접 화법 안의 ‘당신’은 공손한 2인칭으로 처리했습니다.
  alternative_readings:
  - 직설적인 ‘너와 함께 가겠다’
  - 더 경어적인 ‘함께 가겠습니다요’
  rationale: 원문은 단순한 대화이며, 천사의 발화에 과도한 경어를 넣기보다 현대 서사체의 자연스러운 합쇼체로 유지하는 것이 본문 정보 전달에 적합합니다.
  doctrine_reference: 서사 문체와 직접화법의 한국어 register 조정
