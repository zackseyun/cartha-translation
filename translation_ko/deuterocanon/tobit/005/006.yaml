    rationale: 합쇼체 대화문에서 ‘당신’은 문맥에 따라 부부 사이 또는 대립적 호칭으로 들릴 수 있습니다. ‘그대’는 문예 서사에서 자연스럽게 2인칭을 명시하면서 원문의 존대 유무를 과도하게 해석하지 않습니다.
