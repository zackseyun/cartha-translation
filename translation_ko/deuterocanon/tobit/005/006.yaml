    issue: ‘우리 형제 가바엘에게 머문 적이 있습니다’
    rationale: παρά + 인명과 αὐλίζομαι는 그 사람과 함께/그의 집에서 숙박했다는 뜻입니다. 한국어의 ‘에게 머물다’는 이 관계를 자연스럽게 표현하지 못합니다. 또한 원문의 부정과거는 단순 과거로 옮기는 편이 안전합니다.
