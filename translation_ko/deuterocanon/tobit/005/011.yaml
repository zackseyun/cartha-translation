base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/011.yaml
  text: And Tobit said to him, “Brother, from what tribe and from what homeland are you? Show me.”
translation:
  language: ko
  text: 토빗이 그에게 말했습니다. 「형제여, 당신은 어느 지파 출신이며 어느 고향 사람입니까? 제게 알려 주십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘제게 보여 주십시오’이지만, 여기서는 상대의 지파와 출신을 밝혀 달라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφέ
  english_pob_choice: Brother
  chosen_korean: 형제여
  alternatives_korean:
  - 형제님
  - 형제
  lexicon: ἀδελφός
  rationale: 호칭으로 쓰인 직접 발화이므로 자연스러운 존칭형 호격 「형제여」를 택해 친밀함과 직접성을 살렸습니다.
- source_word: ἐκ ποίας φυλῆς
  english_pob_choice: from what tribe
  chosen_korean: 어느 지파에 속하며
  alternatives_korean:
  - 어느 부족에 속하며
  - 어느 지파에서
  lexicon: φυλή
  rationale: 유대적 혈통·소속을 가리키는 φυλή는 한국어 성서 용례에 맞게 「지파」로 옮기되, 출신 질문의 문맥을 살려 「속하며」로 풀었습니다.
- source_word: ἐκ ποίας πατρίδος
  english_pob_choice: from what homeland
  chosen_korean: 어느 고향에서 왔습니까
  alternatives_korean:
  - 어느 본향에서 오셨습니까
  - 어느 나라에서 왔습니까
  lexicon: πατρίς
  rationale: πατρίς는 단순한 국가보다 출신지·고향의 뉘앙스가 강하므로 「고향」으로 옮기고, 질문 형식에 맞게 「왔습니까」를 붙였습니다.
- source_word: ὑπόδειξόν μοι
  english_pob_choice: Show me
  chosen_korean: 저에게 알려 주십시오
  alternatives_korean:
  - 저에게 보여 주십시오
  - 저에게 가르쳐 주십시오
  lexicon: ὑποδείκνυμι
  rationale: 단순 시각적 ‘보여 줌’보다 출신을 밝혀 달라는 요청이므로, 의미를 살린 「알려 주십시오」를 택했습니다.
theological_decisions:
- issue: 토빗의 정체 확인 질문의 어조
  chosen_reading: 정중한 정보 요청으로 읽고, 직접 명령조의 거칠음을 완화하지 않되 한국어에서는 예의 있는 청유형으로 표현했습니다.
  alternative_readings:
  - 직설적인 명령형으로 「보여 주십시오」를 더 강하게 살림
  - 더 구어적인 「말해 주십시오」
  rationale: 본문의 핵심은 상대의 출신을 확인하는 질문이며, POB의 ‘Show me’는 확인 요청의 기능을 지니므로 한국어에서는 공손한 요청 표현이 가장 잘 대응합니다.
  doctrine_reference: 서사 문맥의 발화 기능 보존
