base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/005.yaml
  text: And he said to him[a], “Can I travel with you to Rages of Media[b], and are you familiar with the places?”
  footnotes:
  - marker: a
    text: Greek ἐν Ῥάγοις literally reads 'in Rages,' but in this travel context it likely indicates destination, hence 'to Rages.' The Semitic parallel also supports a destination sense.
    reason: lexical_alternative
  - marker: b
    text: The place name is often rendered 'Rhages' in English; here it is transliterated 'Rages' directly from the Greek form.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 그에게 말했습니다. 「제가 당신과 함께 메디아의 라게스[a][b]로 갈 수 있습니까? 또 그곳들을 잘 알고 계십니까?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ἐν Ῥάγοις는 문자적으로는 ‘라게스 안에’이지만, 여행 문맥에서는 목적지를 가리키는 뜻으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 지명 Ῥάγοις는 여기서 ‘라게스’로 음역했습니다. 영어 전통에서는 ‘Rhages’로 표기되기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῷ
  english_pob_choice: And he said to him
  chosen_korean: 그가 그에게 말했습니다
  alternatives_korean:
  - 그리고 그에게 말했습니다
  - 그가 그에게 이르렀습니다
  lexicon: SBLGNT
  rationale: 서술 동사의 단순한 연결이므로 자연스러운 현대 한국어로 옮기되, 인물 간 발화를 분명히 유지했습니다.
- source_word: Εἰ δύναμαι πορευθῆναι μετὰ σοῦ
  english_pob_choice: Can I travel with you
  chosen_korean: 제가 함께 라게스로 여행해도 됩니까?
  alternatives_korean:
  - 제가 당신과 함께 갈 수 있습니까?
  - 제가 동행해도 됩니까?
  lexicon: BDAG
  rationale: πορευθῆναι는 단순 이동보다 여정을 뜻하므로 ‘여행하다’로 옮겼고, μετὰ σοῦ는 동행 관계를 분명히 하기 위해 ‘함께’로 처리했습니다.
- source_word: ἐν Ῥάγοις τῆς Μηδείας
  english_pob_choice: to Rages of Media
  chosen_korean: 라게스로
  alternatives_korean:
  - 메디아의 라게스로
  - 라게스에
  lexicon: LSJ
  rationale: 영어 POB의 목적지 해석을 따라 이동 목적을 드러내는 방향으로 처리했으며, 고유명사는 그리스어형에 가깝게 라게스로 음역했습니다.
- source_word: ἔμπειρος εἶ τῶν τόπων
  english_pob_choice: are you familiar with the places?
  chosen_korean: 그곳들을 잘 알고 계십니까?
  alternatives_korean:
  - 그 장소들에 익숙하십니까?
  - 그 지역을 잘 아십니까?
  lexicon: BDAG
  rationale: ἔμπειρος는 경험/친숙함을 뜻하므로, 문맥상 가장 자연스러운 ‘잘 알고 계십니까’로 옮겨 장소에 대한 숙지 여부를 살렸습니다.
theological_decisions:
- issue: 여행 가능 여부와 지역 숙지 여부를 묻는 정중한 대화체 처리
  chosen_reading: 질문형으로 직역하되 한국어에서는 자연스러운 합쇼체 정중 질문으로 구성했습니다.
  alternative_readings:
  - 보다 평서문에 가까운 서술형
