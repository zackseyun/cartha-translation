  rationale: 본문은 인물 간 실질적 동행 가능성과 지역 지식 여부를 확인하는 장면이므로, 의미를 흐리지 않으면서 현대 한국어 독자가 바로 이해할 수 있는 정중한 질문으로 옮겼습니다.
  doctrine_reference: 서사문 정중체 원칙
