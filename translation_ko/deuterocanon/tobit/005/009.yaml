base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/009.yaml
  text: And he went in and said to his father[a], “Look, I have found someone who will travel with me.” And he said, “Call him to me, so that I may learn what tribe he is from[c][b], and whether he is trustworthy to go with you.”
  footnotes:
  - marker: a
    text: Or “one who will accompany me.”
    reason: lexical_alternative
  - marker: b
    text: “What tribe he is from” reflects the Greek concern for Israelite tribal identity.
    reason: cultural_note
  - marker: c
    text: Or “whether he is reliable/faithful to go with you.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 들어가서 아버지에게 말했습니다. 「보십시오, 저는 저와 함께 갈 사람[a]을 찾아냈습니다.」 그러자 아버지가 말했습니다. 「그를 내게 불러 오십시오. 내가 그가 어느 지파[b]에 속하는 사람인지, 또 그가 너와 함께 가기에 믿을 만한[c] 사람인지 알아보겠습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘동행할 사람’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘지파’는 그리스어 φυλή가 지닌 이스라엘의 혈연·공동체 정체성을 반영합니다.
    reason: cultural_note
  - marker: c
    text: ‘신뢰할 만한’ 또는 ‘충실한’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  english_pob_choice: after he went in
  chosen_korean: 그가 들어가서
  alternatives_korean:
  - 들어간 뒤
  - 안으로 들어가
  lexicon: LSJ
  rationale: 부사적 분사로서 주동작보다 앞선 동작을 나타내므로, 한국어에서는 자연스럽게 ‘들어가서’로 순서를 드러냈습니다.
- source_word: Ἰδοὺ
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: LSJ
  rationale: 상대의 주의를 끄는 감탄구로, 현대 한국어에서는 정중하고 자연스러운 ‘보십시오’가 합쇼체에 맞습니다.
- source_word: ὃς συμπορεύσεταί μοι
  english_pob_choice: someone who will travel with me
  chosen_korean: 저와 함께 갈 사람
  alternatives_korean:
  - 저와 함께 여행할 사람
  - 저와 동행할 사람
  lexicon: LSJ
  rationale: 여행 동반자를 가리키는 관계절이므로, 문맥에 맞게 ‘함께 갈 사람’으로 옮겨 의미를 직접 드러냈습니다.
- source_word: ποίας φυλῆς ἐστίν
  english_pob_choice: what tribe he is from
  chosen_korean: 어느 지파 출신인지
  alternatives_korean:
  - 어느 지파에 속하는지
  - 어느 지파에서 왔는지
  lexicon: LSJ
  rationale: φυλή의 기본 의미를 ‘지파’로 보존하면서, 한국어에서는 출신 확인의 뉘앙스를 살려 자연스럽게 표현했습니다.
- source_word: πιστὸς
  english_pob_choice: trustworthy
  chosen_korean: 신뢰할 만한지
  alternatives_korean:
  - 믿을 만한지
  - 충실한지
  lexicon: LSJ
  rationale: 여기서는 신앙적 ‘충실함’보다 여행 동반자로서의 신뢰 가능성을 묻는 맥락이므로, ‘신뢰할 만한’이 가장 정확합니다.
theological_decisions:
- issue: 이스라엘 공동체의 혈연/지파 정체성 강조
  chosen_reading: ‘어느 지파 출신인지’로 직역해 공동체적·족보적 관심을 보존했습니다.
  alternative_readings:
  - ‘어느 가문인지’
  - ‘어느 집안인지’
  rationale: 본문의 φυλή는 일반적 가족이 아니라 이스라엘의 지파 소속을 묻는 말이므로, 서술의 긴장을 약화하지 않기 위해 지파를 유지했습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: πιστός의 의미 범위
  chosen_reading: ‘신뢰할 만한’으로 번역해 인물의 실제 신뢰성 평가를 드러냈습니다.
  alternative_readings:
  - ‘믿음직한’
  - ‘충실한’
  rationale: 이 구절은 신학적 ‘믿음’ 진술이 아니라 여행에 동행할 사람의 신뢰도를 묻는 문맥이므로, 관계적·실무적 의미를 살렸습니다.
  doctrine_reference: Translation philosophy §6
