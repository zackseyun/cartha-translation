- from: 그가 들어가서 아버지에게 말했습니다. 「보십시오, 저는 저와 함께 갈 사람을 찾아냈습니다.」 그러자 아버지가 말했습니다. 「그를 나에게 불러 오너라. 그래서 그가 어느 지파 출신인지 알 수 있고, 또 그가 너와 함께 가기에 신뢰할 만한지 알 수 있게 하려는 것이다.」[a][b][c]
  to: 그가 들어가서 아버지에게 말했습니다. 「보십시오, 저는 저와 함께 갈 사람[a]을 찾아냈습니다.」 그러자 아버지가 말했습니다. 「그를 내게 불러 오십시오. 내가 그가 어느 지파[b]에 속하는 사람인지, 또 그가 너와 함께 가기에 믿을 만한[c] 사람인지 알아보겠습니다.」
