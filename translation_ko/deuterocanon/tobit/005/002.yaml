  lexicon: BDAG
  rationale: 본문은 예치된 재산을 가리키므로 문자적인 '은'보다 의미를 드러내는 '돈'이 적절합니다.
- source_word: δυνησομαι λαβεῖν
  english_pob_choice: will I be able to get
  chosen_korean: 받을 수 있겠습니까
  alternatives_korean:
