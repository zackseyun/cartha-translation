  lexicon: BDAG
  rationale: 맡겨진 돈을 다시 찾아오는 맥락에서 '받다'가 한국어로 가장 자연스럽게 회수의 뜻을 전달합니다.
- source_word: οὐ γινώσκω αὐτόν
  english_pob_choice: since I do not know him
  chosen_korean: 나는 그를 알지 못합니다
  alternatives_korean:
  - 나는 그를 모릅니다
  - 나는 그를 알아보지 못합니다
  lexicon: BDAG
  rationale: 인물과의 면식이 없다는 뜻을 직설적으로 살리되, 한국어에서 자연스러운 존칭 화법으로 옮겼습니다.
