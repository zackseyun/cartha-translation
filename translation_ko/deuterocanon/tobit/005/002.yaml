base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/002.yaml
  text: But how will I be able to get the money[b][a], since I do not know him?
  footnotes:
  - marker: a
    text: The Greek says 'the silver'; here it refers to money entrusted for safekeeping, so 'the money' is used for clarity.
    reason: lexical_alternative
  - marker: b
    text: 'The parallel Semitic tradition expands the thought: ''How can I take the money from Gabael? He will not recognize me, and I do not recognize him...,'' making explicit that the problem is mutual lack of acquaintance.'
    reason: alternative_reading
translation:
  language: ko
  text: 그런데 어떻게 그 돈을 받을 수 있겠습니까? 나는 그를 알지 못합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 문자적으로는 '그 은'이라고 합니다. 여기서는 맡겨진 재산을 뜻하므로 '돈'으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 평행 셈어 전승은 이 질문을 더 풀어 말해, 가바엘에게서 어떻게 돈을 받아야 하는지, 또 서로를 알지 못한다는 점을 분명히 드러냅니다.
    reason: alternative_reading
