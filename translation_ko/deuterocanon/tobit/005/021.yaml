  text: And Tobit said to her[a], “Do not worry, sister; he will return safe and sound, and your eyes will see him.”
  footnotes:
  - marker: a
    text: “Sister” is the literal Greek form of address. In this context Tobit is speaking to his wife; the term reflects familial/spousal address rather than biological siblinghood.
    reason: cultural_note
translation:
  language: ko
  text: 그러자 토빗이 그녀에게 말했습니다. “걱정하지 마십시오, 자매여. 그는 건강한 채로 돌아올 것이고, 당신의 눈은 그를 볼 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어의 ἀδελφή는 문자 그대로 ‘자매’입니다. 여기서는 토빗이 아내에게 하는 말이므로, 혈연 관계가 아니라 부부 사이의 친밀한 호칭을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: Μὴ λόγον ἔχε
  english_pob_choice: Do not worry
  chosen_korean: 걱정하지 마십시오
  alternatives_korean:
  - 염려하지 마십시오
  - 그 일에 마음쓰지 마십시오
  - 그 일로 신경 쓰지 마십시오
  lexicon: LSJ
  rationale: 직역하면 ‘말/일을 가지지 말라’는 관용구이지만, 여기서는 불안해하는 사람에게 주는 위로이므로 현대 한국어의 자연스러운 완화 표현인 ‘걱정하지 마십시오’가 가장 잘 맞습니다.
- source_word: ἀδελφή
  english_pob_choice: sister
  chosen_korean: 자매여
  alternatives_korean:
  - 아내여
  - 누이여
  lexicon: LSJ
  rationale: 그리스어 본문은 문자 그대로 ‘자매’이지만, 토빗이 아내에게 건네는 호칭이므로 혈연 의미를 지우지 않으면서도 한국어 문맥에 맞는 호칭 형태로 옮겼습니다.
- source_word: ὑγιαίνων
  english_pob_choice: safe and sound
  chosen_korean: 건강한 몸으로
  alternatives_korean:
  - 무사히
  - 멀쩡하게
  - 건강하게
  lexicon: LSJ
  rationale: 어근은 ‘건강하다, 온전하다’이므로 단순한 도착보다 몸의 온전함을 드러내는 표현을 택했습니다. 다만 한국어 관용구 ‘무사히’만 쓰면 건강의 뉘앙스가 약해져 보완했습니다.
- source_word: οἱ ὀφθαλμοί σου ὄψονται αὐτόν
  english_pob_choice: your eyes will see him
  chosen_korean: 당신의 눈이 그를 볼 것입니다
  alternatives_korean:
  - 당신이 그를 보게 될 것입니다
  - 당신의 눈으로 그를 보게 될 것입니다
  lexicon: LSJ
  rationale: 본문이 ‘당신의 눈’을 주어처럼 앞세운 점을 살려, 시각적 확신과 정서적 강조를 그대로 보존했습니다.
theological_decisions:
- issue: 아내를 향한 ἀδελφή 호칭의 처리
  chosen_reading: ‘자매여’로 직역적 호칭을 유지했습니다.
  alternative_readings:
  - ‘아내여’로 의미를 풀어 번역
  - ‘누이여’로 일반화
  rationale: 토빗기의 그리스어는 혼인 관계 안에서도 ‘자매’ 호칭을 보존하므로, 이를 풀어버리면 본문이 가진 친밀한 관용과 표현의 이질성이 사라집니다. 본문 의미는 문맥으로 이해하도록 두는 것이 소스 충실성에 맞습니다.
  doctrine_reference: 본문 문맥에 따른 호칭 관용 유지
