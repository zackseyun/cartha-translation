  yaml_path: translation/deuterocanon/tobit/005/018.yaml
  text: But Anna his mother wept and said to Tobit[a], “Why did you send our child away? Is he not the staff of our hand as he goes in and goes out before us?”
  footnotes:
  - marker: a
    text: Or, more interpretively, “our support” for “the staff of our hand.” The main text preserves the metaphor in the Greek.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그의 어머니 안나는 울며 토비트에게 말했습니다. “왜 우리 아이를 보내셨습니까? 그가 우리 앞에서 드나들 때 우리 손의 지팡이가 아니겠습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “우리 손의 지팡이”는 관용적 은유로, 더 해석적으로는 “우리의 버팀목”이라는 뜻이 될 수 있습니다. 본문은 원문의 이미지를 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔκλαυσεν
  english_pob_choice: wept
  chosen_korean: 울며
  alternatives_korean:
