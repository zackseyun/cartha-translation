  source_fidelity: 전반적으로 원문을 충실히 옮겼습니다. 다만 ἐν τῷ εἰσπορεύεσθαι αὐτὸν καὶ ἐκπορεύεσθαι ἐνώπιον ἡμῶν은 ‘그가 우리 앞에서 드나들 때/드나들면서’라는 상황을 나타내므로, 초안의 ‘그가 우리 앞에서 들어가고 나오는 동안 우리 손의 지팡이가’는 한국어 문장 구조상 수식 관계가 다소 불분명합니다.
