  rationale: παιδίον의 애정 어린 뉘앙스를 살리되 성별을 지나치게 특정하지 않도록 "우리 아이"로 옮겼습니다.
- source_word: ῥάβδος τῆς χειρὸς ἡμῶν
  english_pob_choice: the staff of our hand
  chosen_korean: 우리 손의 지팡이
  alternatives_korean:
  - 우리 손의 버팀목
  - 우리의 의지처
  lexicon: LSJ
  rationale: 원문의 은유를 보존하려고 직역에 가까운 "우리 손의 지팡이"를 유지했습니다. 해석적 완화는 본문이 허용하는 범위를 넘길 수 있습니다.
- source_word: ἐν τῷ εἰσπορεύεσθαι αὐτὸν καὶ ἐκπορεύεσθαι
  english_pob_choice: as he goes in and goes out
  chosen_korean: 들어가고 나오는 동안
  alternatives_korean:
