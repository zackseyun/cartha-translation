  - 드나드는 동안
  lexicon: BDAG
  rationale: 히브리적 관용구를 자연스러운 현대 한국어로 옮기되, 반복되는 동작의 감각은 유지했습니다.
theological_decisions:
- issue: 은유인 "the staff of our hand"를 한국어에서 얼마나 유지할지
  chosen_reading: 의역으로 풀지 않고 "우리 손의 지팡이"로 남겨, 자녀를 의지와 버팀의 대상로 묘사하는 슬픔의 수사를 보존했습니다.
  alternative_readings:
  - '"우리의 버팀목"처럼 의미 중심으로 풀기'
  - '"우리의 의지처"로 정서적으로 완화하기'
  rationale: 본문은 단순 정보 전달보다 상실의 정서를 은유로 표현하므로, 은유를 보존하는 쪽이 저자의 의도를 더 잘 드러냅니다.
  doctrine_reference: 시적·수사적 은유 보존 원칙
