translation:
  language: ko
  text: 그가 그에게 말했습니다. 「가십시오. 그리고 지체하지 마십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 매우 간단한 명령문으로, 의미상 추가되는 요소 없이 ‘가십시오. 그리고 지체하지 마십시오.’로 옮길 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: Πορεύου
  english_pob_choice: Go
  chosen_korean: 가십시오
  alternatives_korean:
  - 가세요
  - 가십시오요
  - 떠나십시오
  lexicon: BDAG
  rationale: 분사적 뉘앙스 없이 단순한 이동 명령이므로 가장 직접적인 합쇼체 명령인 ‘가십시오’로 옮겼습니다.
- source_word: μὴ χρονίσῃς
  english_pob_choice: do not delay
  chosen_korean: 지체하지 마십시오
  alternatives_korean:
  - 늦추지 마십시오
  - 머무르지 마십시오
  - 꾸물거리지 마십시오
  lexicon: BDAG
  rationale: χρονίζω의 핵심은 ‘시간을 끌다, 지연하다’이므로 자연스럽고 간결한 ‘지체하지 마십시오’가 가장 가깝습니다.
- source_word: εἶπεν αὐτῷ
  english_pob_choice: he said to him
  chosen_korean: 그가 그에게 말했습니다
  alternatives_korean:
  - 그가 그에게 이르렀습니다
  - 그가 그에게 말하였습니다
  lexicon: BDAG
  rationale: 서사 문형을 그대로 살려 말한 대상과 행위를 분명히 드러내는 직역형으로 처리했습니다.
