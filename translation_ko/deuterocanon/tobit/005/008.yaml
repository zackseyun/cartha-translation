    text: ויבא המלאך אל טובי ויאמר לו שלום אליך איש האלהים ויאמר טובי אם יש עלי שלום ולמה מצאתני כל זאת שאיני רואה בעיני ואנכי יושב עור במחשכים ויאמר המלאך מי שעור אותך ממאור עיניך הוא ירפאך כי צדיק אתה ויען טובי ויאמר כן (יאמר יי) ויאמר לו טובי אחי טוביה בני מבקש ללכת אל מדי [התוכל ללכת אל מדי] התוכל ללכת עמו ואני אתן את שכרך ויאמר המלאך כן אוכל ואני יודע (את) הדרכים כלם וכל הגבולים הלכתי וההרים ידעתי ויאמר טובי מאיזה מקום אתה ומאיזה שבט אתה ומאי זה עיר אתה ויאמר המלאך עוד תבקש ויש לך שכיר שילך עם בנך כרצונך ויאמר טובי אחי מבקש אני לידע את שמך ומאי זו משפחה אתה ויאמר המלאך אני עזריה בן חננאל מבית שלומית הגדול מאחיך.
