base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/008.yaml
  text: And he said to him[a], “Go, and do not delay.”
  footnotes:
  - marker: a
    text: 'Greek: ''Go, and do not delay.'' The Semitic parallel material for this section is fuller in surrounding verses, but this command itself is straightforward and does not materially alter the translation here.'
