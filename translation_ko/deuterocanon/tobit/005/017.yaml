base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/017.yaml
  text: They agreed to this[a]. Then he said to Tobiah, “Get ready for the journey, and may your journey be prosperous.” So his son prepared what was needed for the journey. Then his father said to him, “Go with the man, and may God, who dwells in heaven, make your journey prosper, and may his angel go with you.” So both went out to depart[b], and the boy’s dog went with them.
  footnotes:
  - marker: a
    text: Or, “may your journey prosper.” The Greek expresses a wish for success on the road.
    reason: lexical_alternative
  - marker: b
    text: “Angel” could more generally mean “messenger,” but in Tobit the heavenly sense is most likely.
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 그렇게 하기로 동의했습니다[a]. 그때 그가 토비아에게 말했습니다. “여행할 준비를 하여라. 그리고 네 길이 잘 되기를 바란다.” 그러자 그의 아들이 여행에 필요한 것들을 준비했습니다. 그때 그의 아버지가 그에게 말했습니다. “그 사람과 함께 가거라. 그리고 하늘에 거하시는 하나님께서 너희의 길을 잘 되게 하시고, 그의 천사가 너희와 함께 가기를 바란다.” 그렇게 두 사람은 떠나기 위해 나갔고, 그 소년의 개도 그들과 함께 갔습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “네 길이 잘 되기를 바란다.” 그리스어는 길 위에서의 성공을 비는 뜻을 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘천사’는 더 일반적으로 ‘사자’로도 옮길 수 있으나, 토빗기에서는 하늘의 존재를 가리키는 뜻이 가장 강합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐδόκησαν
  english_pob_choice: They agreed
  chosen_korean: 그들은 그렇게 하기로 동의했습니다
  alternatives_korean:
  - 그들은 기뻐했습니다
  - 그들은 이를 승인했습니다
  lexicon: LSJ
  rationale: 문맥상 앞선 제안을 받아들이는 결론이므로 단순한 감정 표현보다 합의의 의미를 살려 옮겼습니다.
- source_word: Ἔτοιμος γίνου πρὸς τὴν ὁδόν
  english_pob_choice: Get ready for the journey
  chosen_korean: 여행할 준비를 하여라
  alternatives_korean:
  - 길을 위해 준비하여라
  - 떠날 준비를 하여라
  lexicon: LSJ
  rationale: 직역보다 자연스러운 한국어 명령형으로, 출발 준비라는 뉘앙스를 분명히 드러냈습니다.
- source_word: εὐοδωθεῖητε / εὐοδώσει τὴν ὁδὸν ὑμῶν
  english_pob_choice: may your journey prosper / make your journey prosper
  chosen_korean: 네 길이 잘 되기를 바란다 / 너희의 길을 잘 되게 하시고
  alternatives_korean:
  - 네 여정이 순조롭기를 바란다
  - 너희의 길에 성공을 주시기를 바란다
  lexicon: LSJ
  rationale: ὁδός를 여행의 ‘길’로 살리되, 성공·형통의 관용적 뜻을 한국어 ‘잘 되다’로 옮겨 기원형을 유지했습니다.
- source_word: ὁ ἐν τῷ οὐρανῷ οἰκῶν θεός
  english_pob_choice: God, who dwells in heaven
  chosen_korean: 하늘에 거하시는 하나님
  alternatives_korean:
  - 하늘에 사시는 하나님
  - 하늘에 계신 하나님
  lexicon: LSJ
  rationale: 영화된 경배 표현을 살리면서도 본문이 가진 서술적 수식 구조를 유지했습니다.
- source_word: ὁ ἄγγελος αὐτοῦ
  english_pob_choice: his angel
  chosen_korean: 그의 천사
  alternatives_korean:
  - 그의 사자
  - 그의 메신저
  lexicon: LSJ
  rationale: 토빗기 전체 문맥에서 하늘의 존재를 가리키는 의미가 가장 강하므로 ‘천사’를 유지했습니다.
theological_decisions:
- issue: ἄγγελος의 의미 범위
  chosen_reading: 하나님의 인도에 동행하는 천사로 이해하여 ‘그의 천사’로 번역했습니다.
  alternative_readings:
  - 그의 사자
  - 그의 메신저
  rationale: 토빗기의 서사 안에서 ἄγγελος는 단순한 전달자보다 초월적 동행자를 가리키는 방향이 강하므로, 독자가 본문 신학을 놓치지 않도록 ‘천사’를 택했습니다.
  doctrine_reference: 'DOCTRINE.md: source sense 우선, 문맥이 강하게 지지하는 경우에만 상위 의미를 드러냄'
