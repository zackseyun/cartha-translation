  yaml_path: translation/deuterocanon/tobit/005/015.yaml
  text: But tell me, what wages shall I give you? A drachma a day, and your necessities, as for my own son?
  footnotes:
  - marker: a
    text: Or 'what shall I pay you?' The Greek asks directly what compensation Tobit should give.
    reason: lexical_alternative
translation:
  language: ko
  text: 하지만 제게 말씀해 주십시오. 제가 당신에게 어떤 삯[a]을 드려야 하겠습니까? 하루에 한 드라크마와, 제 아들에게도 주는 것처럼 당신에게 필요한 것들을 드리겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 μισθός는 일반적인 ‘보수’보다 노동이나 봉사에 대한 ‘삯, 품삯’의 성격을 더 직접적으로 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα σοὶ ἔσομαι μισθὸν διδόναι
  english_pob_choice: what wages shall I give you
  chosen_korean: 제가 당신에게 어떤 삯을 드려야 합니까
  alternatives_korean:
  - 제가 당신에게 무엇을 지불해야 합니까
  - 제가 당신에게 어떤 보수를 드려야 합니까
  lexicon: BDAG
  rationale: μισθός는 노동이나 봉사에 대한 대가를 가리키므로, 현대 한국어에서는 ‘삯’이 비교적 직접적이고 본문의 고용 맥락을 잘 드러냅니다.
- source_word: δραχμὴν τῆς ἡμέρας
  english_pob_choice: A drachma a day
  chosen_korean: 하루 한 드라크마
  alternatives_korean:
  - 하루에 한 드라크마
  - 한 드라크마씩 매일
  lexicon: LSJ
  rationale: 날짜를 나타내는 속격 구조를 자연스럽게 살리면서도 고대 화폐 단위를 그대로 유지하기 위해 ‘하루 한 드라크마’로 옮겼습니다.
- source_word: τὰ δέοντά σοι
  english_pob_choice: your necessities
  chosen_korean: 당신에게 필요한 것들
  alternatives_korean:
  - 당신의 필요
  - 당신의 생필품
  - 당신에게 필요한 물품
  lexicon: LSJ
  rationale: δέοντα는 ‘필요한 것들, 필요한 보급품’의 뜻이므로, 지나치게 추상적인 ‘필요’보다 구체성이 살아 있는 표현을 택했습니다.
- source_word: ὡς καὶ τῷ υἱῷ μου
  english_pob_choice: as for my own son
  chosen_korean: 제 아들에게 하듯이
  alternatives_korean:
  - 제 아들처럼
  - 제 아들에게 하는 것처럼
  - 제 친아들에게 하듯이
  lexicon: LSJ
  rationale: 비교의 ὡς καί를 한국어의 자연스러운 방식으로 살려, 토빗이 아들에게 베푸는 동일한 대우를 약속하는 뜻을 분명히 했습니다.
theological_decisions:
- issue: 봉사 대가와 가족 대우를 같은 문장 안에서 제시하는 어조
  chosen_reading: 토빗의 제안은 고용의 삯과 부양의 약속을 함께 담은 직접적 표현으로 유지했습니다.
  alternative_readings:
  - 부드럽게 풀어 ‘월급’이나 ‘생활비’로 일반화하는 읽기
  - 관용적으로 ‘원하는 대로 해주겠다’로 약화시키는 읽기
  rationale: 본문은 단순한 사례비 제시가 아니라 실제로 ‘삯’과 ‘필요한 것들’을 함께 언급하므로, 그 긴장을 지우지 않는 번역이 필요합니다.
  doctrine_reference: 본문해석 원칙 및 문맥 보존
