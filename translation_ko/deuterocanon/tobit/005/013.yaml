  lexicon: source transliteration
  rationale: 그리스어 형태를 따라 인명은 음역했고, 문장 전체는 현대 합쇼체로 자연스럽게 다듬었습니다.
- source_word: Ἀνανίου τοῦ μεγάλου
  english_pob_choice: the great Ananias
  chosen_korean: 위대한 아나니아스의 아들
  alternatives_korean:
