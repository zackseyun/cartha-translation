translation:
  language: ko
  text: 그대의 족보와 이름을 알기 위해서였습니다. 그러나 그는 말했습니다[a], "나는 아자리아스입니다. 위대한 아나니아스의 아들로서, 그대의 형제들 가운데 한 사람입니다."
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그대의 친족들 가운데서’ / ‘그대의 родствен들 가운데서’에 가깝습니다. 그리스어 ‘그대의 형제들’은 이 문맥에서 더 넓은 친족 집단을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνῶναι
