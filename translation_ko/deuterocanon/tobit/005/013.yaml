  - 위대한 아나니아스의
  lexicon: LSJ
  rationale: τοῦ μεγάλου는 문자적으로 ‘큰/위대한’이지만, 아버지 이름을 수식하는 호칭적 표현으로 읽혀 ‘아들’ 관계를 한국어 문맥에 드러냈습니다.
- source_word: τῶν ἀδελφῶν σου
