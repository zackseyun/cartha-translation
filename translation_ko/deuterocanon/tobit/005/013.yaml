  - 위대한 아나니아스의
  lexicon: LSJ
  rationale: τοῦ μεγάλου는 문자적으로 ‘큰/위대한’이지만, 아버지 이름을 수식하는 호칭적 표현으로 읽혀 ‘아들’ 관계를 한국어 문맥에 드러냈습니다.
- source_word: τῶν ἀδελφῶν σου
  english_pob_choice: of your brothers
  chosen_korean: 그대의 형제들 가운데 한 사람
  alternatives_korean:
  - 그대의 형제들 가운데서
  - 그대의 형제들 중 하나
  lexicon: BDAG
  rationale: 복수 속격이 혈연·동족 범주의 부분성을 나타내므로, 한국어에서는 의미를 분명하게 하되 과도하게 넓히지 않도록 ‘가운데 한 사람’으로 옮겼습니다.
