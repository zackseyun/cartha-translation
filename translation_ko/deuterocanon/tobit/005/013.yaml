  - 그대의 형제들 중 하나
  lexicon: BDAG
  rationale: 복수 속격이 혈연·동족 범주의 부분성을 나타내므로, 한국어에서는 의미를 분명하게 하되 과도하게 넓히지 않도록 ‘가운데 한 사람’으로 옮겼습니다.
