translation:
  language: ko
  text: 그리고 그가 그를 불렀습니다. 그가 들어갔고, 그들은 서로 인사했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 매우 간단하여 “그가 그를 불렀고, 그가 들어갔고, 그들은 서로 인사했다”는 정도만 말합니다. 더 긴 셈어 계열 전승이 이 대목에 추가 대화를 보존하지만, 본문은 현존 그리스어 증거를 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκάλεσεν αὐτόν
  english_pob_choice: called him
  chosen_korean: 그를 불렀습니다
  alternatives_korean:
  - 그를 불러들였습니다
  - 그를 불렀고
  lexicon: καλέω / BDAG
  rationale: 가정적 장면에서 단순한 호출 행위를 가장 자연스럽게 드러내므로 ‘불렀습니다’가 적절합니다. ‘불러들였습니다’는 의도와 강도를 덧붙일 수 있습니다.
- source_word: εἰσῆλθεν
  english_pob_choice: went in
  chosen_korean: 안으로 들어가자
  alternatives_korean:
  - 들어갔습니다
  - 들어오자
  lexicon: εἰσέρχομαι / BDAG
  rationale: 동사의 기본 의미는 ‘들어가다’이며, 앞뒤 연결을 위해 ‘안으로 들어가자’로 옮기면 서술 흐름이 자연스럽습니다.
- source_word: ἠσπάσαντο ἀλλήλους
  english_pob_choice: greeted one another
  chosen_korean: 서로 인사했습니다
  alternatives_korean:
  - 서로 문안했습니다
  - 서로 맞인사했습니다
  lexicon: ἀσπάζομαι / BDAG
  rationale: ἀσπάζομαι는 상호 인사/문안의 의미를 가지므로, 물리적 포옹을 암시하지 않는 ‘서로 인사했습니다’가 가장 무난합니다.
theological_decisions:
- issue: 간결한 그리스어 본문의 서술 방식
  chosen_reading: 본문의 짧은 연쇄 서술을 그대로 살려, 설명을 덧붙이지 않고 순차적 행동만 제시했습니다.
  alternative_readings:
  - 더 풀어서 ‘그가 그를 불러 안으로 들어오게 했습니다’처럼 의도를 보충하는 방식
  rationale: 본문은 행위의 순서를 간단히 기록하므로, 과도한 설명은 원문의 간결성을 흐릴 수 있습니다.
  doctrine_reference: 본문 비평 및 서사적 절제
