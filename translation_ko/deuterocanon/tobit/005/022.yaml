  text: For a good angel will go with him, and his journey will be successful, and he will return in good health.
translation:
  language: ko
  text: 좋은 천사가 그와 함께 갈 것이며, 그의 여정은 성공할 것이고, 그는 건강한 몸으로 돌아올 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '그의 길/도로'이지만, 여행 문맥에서는 '여정'이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος
  english_pob_choice: angel
  chosen_korean: 천사
  alternatives_korean:
  - 사자
  - 메신저
  lexicon: BDAG
  rationale: 문맥상 단순한 인간 심부름꾼이 아니라 하늘 존재를 가리키므로, 한국어에서도 '천사'가 가장 직접적이고 자연스럽습니다.
- source_word: ἀγαθὸς
  english_pob_choice: good
  chosen_korean: 좋은
  alternatives_korean:
  - 선한
  - 자비로운
  lexicon: BDAG
  rationale: 형용사는 천사의 성격이나 보호적 역할을 간단히 수식하므로, 과도한 해석을 피하는 '좋은'이 원문에 가장 가깝습니다.
- source_word: συνπορεύσεται
  english_pob_choice: will go with
  chosen_korean: 함께 갈 것입니다
  alternatives_korean:
  - 동행할 것입니다
  - 함께 여행할 것입니다
  lexicon: BDAG
  rationale: 복합 동사는 함께 가는 동행의 뜻이 핵심이므로, 현대 한국어에서 자연스러운 '함께 갈 것입니다'로 옮겼습니다.
- source_word: εὐοδωθήσεται ἡ ὁδὸς αὐτοῦ
  english_pob_choice: his journey will be successful
  chosen_korean: 그의 여정은 성공할 것입니다
  alternatives_korean:
  - 그의 길은 잘될 것입니다
  - 그의 여정은 잘 풀릴 것입니다
  lexicon: BDAG
  rationale: 직역하면 '그의 길이 잘되다'이지만, 여행 맥락에서 결과의 번성/성공을 분명히 드러내는 '여정은 성공할 것입니다'가 의미를 잘 보존합니다.
- source_word: ὑποστρέψει ὑγιαίνων
  english_pob_choice: he will return in good health
  chosen_korean: 건강한 몸으로 돌아올 것입니다
  alternatives_korean:
  - 무사히 돌아올 것입니다
  - 건강하게 돌아올 것입니다
  lexicon: BDAG
  rationale: ὑγιαίνων의 건강 상태를 분명히 살리되, 단순한 안전함보다 신체적 온전함을 드러내기 위해 '건강한 몸으로'를 선택했습니다.
theological_decisions:
- issue: ἄγγελος의 존재론적 의미
  chosen_reading: 하늘의 천사를 가리키는 것으로 이해하고 '천사'로 번역했습니다.
  alternative_readings:
  - 일반적인 사자/전령으로 번역
  rationale: 토빗기의 서사 안에서 이는 보호를 베푸는 초자연적 동행자를 뜻하므로, 문맥의 의도에 맞게 '천사'를 유지하는 것이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: original-language primacy and narrative-context reading'
