  rationale: 토빗기의 서사 안에서 이는 보호를 베푸는 초자연적 동행자를 뜻하므로, 문맥의 의도에 맞게 '천사'를 유지하는 것이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: original-language primacy and narrative-context reading'
