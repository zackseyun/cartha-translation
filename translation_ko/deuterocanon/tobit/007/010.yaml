  text: And he conveyed the matter to Raguel. And Raguel said to Tobiah, “Eat, drink, and be glad, for it is fitting for you to take my child; but I will explain the truth.”
translation:
  language: ko
  text: 그리고 그는 그 말을 라구엘에게 전했습니다. 라구엘이 토비아에게 말했습니다. 「먹고, 마시고, 기쁘게 지내십시오. 당신이 내 아이를 아내로 맞이하는 것이 마땅합니다. 그러나 저는 진실을 설명하겠습니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετέδωκεν τὸν λόγον
  english_pob_choice: he conveyed the matter
  chosen_korean: 그는 그 말을 … 전했습니다
  alternatives_korean:
  - 그는 그 일을 … 알렸습니다
  - 그는 그 이야기를 … 전했습니다
  lexicon: μεταδίδωμι / λόγος
  rationale: λόγος를 단순한 ‘말’보다 맥락상 ‘그 말/그 사안’으로 자연스럽게 옮기고, μετέδωκεν은 ‘전하다’로 소식을 넘겨준 행위를 살렸습니다.
- source_word: ἡδέως γίνου
  english_pob_choice: be glad
  chosen_korean: 기쁘게 지내십시오
  alternatives_korean:
  - 즐겁게 지내십시오
  - 기뻐하십시오
  lexicon: ἡδέως / γίνομαι
  rationale: POB의 ‘be glad’를 반영하되, 한국어에서는 상태가 아니라 권유의 뉘앙스를 자연스럽게 살리기 위해 ‘기쁘게 지내십시오’로 옮겼습니다.
- source_word: σοὶ γὰρ καθήκει τὸ παιδίον μου λαβεῖν
  english_pob_choice: it is fitting for you to take my child
  chosen_korean: 당신이 내 아이를 아내로 맞이하는 것이 마땅합니다
  alternatives_korean:
  - 당신이 내 아이를 데려가는 것이 마땅합니다
  - 당신이 내 아이를 취하는 것이 합당합니다
  lexicon: καθήκει / λαβεῖν / παιδίον
  rationale: λαβεῖν을 문자적으로 ‘데려가다/취하다’로만 두기보다, 혼인 문맥에서의 의미를 드러내기 위해 ‘아내로 맞이하다’로 풀어 옮겼습니다.
- source_word: τὴν ἀλήθειαν
  english_pob_choice: the truth
  chosen_korean: 진실
  alternatives_korean:
  - 진리를
  - 참된 사정을
  lexicon: ἀλήθεια
  rationale: 여기서는 교리적 ‘진리’보다 혼인 제안과 관련된 사실 설명의 뜻이 강하므로 ‘진실’이 더 직접적입니다.
theological_decisions:
- issue: 혼인 문맥에서의 λαβεῖν 표현 처리
  chosen_reading: ‘내 아이를 아내로 맞이하는 것’으로 옮겨 혼인 성사/합의의 실질을 드러냈습니다.
  alternative_readings:
  - ‘내 아이를 데려가는 것’
  - ‘내 아이를 취하는 것’
  rationale: 이 절은 단순한 이동이나 소유가 아니라 라구엘의 딸을 아내로 맞이하는 혼인 승낙을 뜻하므로, 한국어 독자가 문맥을 즉시 이해하도록 구체화했습니다.
  doctrine_reference: Tobit 7:10 혼인 합의 문맥
- issue: 직접화법의 공손도
  chosen_reading: 라구엘의 말은 합쇼체 요청형으로 옮겼습니다.
  alternative_readings:
  - 반말체 명령형
  - 더 격식 있는 서술체
  rationale: 원문의 권유와 환대가 동시에 드러나도록 현대 한국어의 공손한 권유 표현을 사용했습니다.
  doctrine_reference: 한국어 문체 규범
