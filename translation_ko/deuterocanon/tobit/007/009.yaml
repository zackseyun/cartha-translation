  yaml_path: translation/deuterocanon/tobit/007/009.yaml
  text: And they slaughtered a ram from the flock and set out many dishes. Then Tobiah said to Raphael, “Azariah, brother, speak about the matter you were talking about on the journey, and let the matter be brought to completion.”
translation:
  language: ko
  text: 그리고 그들은 양 떼의 숫양 한 마리를 잡고 여러 요리를 차려 놓았습니다. 그러자 토비야가 라파엘에게 말했습니다. “아자리아 형제님, 여행길에서 말씀하시던 그 일에 관하여 말씀해 주십시오. 그리고 그 일이 이루어지게 하십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθυσαν κριὸν προβάτων
  english_pob_choice: they slaughtered a ram from the flock
  chosen_korean: 그들은 양 떼의 숫양 한 마리를 잡아 죽이고
  alternatives_korean:
  - 그들은 양 떼의 숫양 한 마리를 잡아 바치고
  - 그들은 양 떼의 숫양 한 마리를 도살하고
  lexicon: κριός / πρόβατα
  rationale: 제사적 뉘앙스가 있으나 여기서는 단순한 연회 준비 문맥이므로 ‘잡아 죽이고’로 자연스럽게 옮기되, 숫양과 양 떼의 구분은 살렸습니다.
- source_word: παρέθηκαν ὄψα πλείονα
  english_pob_choice: set out many dishes
  chosen_korean: 많은 음식 접시를 차려 놓았습니다
  alternatives_korean:
  - 많은 요리를 내놓았습니다
  - 많은 접시 음식을 차려 놓았습니다
  lexicon: ὄψον / πλείων
  rationale: ὄψα는 구체적으로 ‘반찬/요리들’에 가까우나, 한국어에서는 문맥상 ‘음식 접시’가 가장 자연스럽고 원문의 다수성을 보존합니다.
- source_word: Λάλησον ... καὶ τελεσθήτω τὸ πρᾶγμα
  english_pob_choice: speak about the matter ... and let the matter be brought to completion
  chosen_korean: 말씀해 주십시오. 그리고 그 일이 이루어지게 하십시오
  alternatives_korean:
  - 말해 주십시오. 그리고 그 일이 완성되게 하십시오
  - 말씀하소서. 그리고 그 일이 성취되게 하십시오
  lexicon: λαλέω / τελέω / πρᾶγμα
  rationale: ‘말하다’보다 관계적 요청을 살려 ‘말씀해 주십시오’로, τελεσθήτω는 성취보다 중립적인 ‘이루어지게 하십시오’로 옮겼습니다.
- source_word: Τωβείας τῷ Ῥαφαὴλ Ἀζαρία ἀδελφέ
  english_pob_choice: Tobiah said to Raphael, “Azariah, brother,”
  chosen_korean: 토비야가 라파엘에게 말했습니다. “아자리아 형제님,”
  alternatives_korean:
  - 토비야가 라파엘에게 말했습니다. “아자리아 형제여,”
  - 토비야가 라파엘에게 말했습니다. “아자리아 형제님”
  lexicon: ἀδελφέ
  rationale: 형제 호칭의 친밀함을 살리되, 현대 한국어 서술문과 직접 대화 사이에서 ‘형제님’이 가장 자연스럽고 공손합니다.
theological_decisions:
- issue: 라파엘의 정체를 아자리아로 부르는 호칭 유지
  chosen_reading: 본문의 직접 호칭을 따라 ‘아자리아 형제님’으로 보존했습니다.
  alternative_readings:
  - ‘라파엘 형제님’으로 조정
  - 호칭을 설명적으로 풀어 쓰기
  rationale: 이 대목은 인물의 위장/정체성 긴장을 드러내므로, 본문이 제공하는 아자리아 호칭을 그대로 유지하는 편이 독자가 상황을 파악하는 데 유리합니다.
  doctrine_reference: 서사적 인물 식별과 본문 내 위장 설정
