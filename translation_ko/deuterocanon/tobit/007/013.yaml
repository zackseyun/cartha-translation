- source_word: παρέδωκεν αὐτὴν Τωβείᾳ γυναῖκα
  english_pob_choice: he gave her to Tobiah as a wife
  chosen_korean: 토비아에게 아내로 넘겨주며
  alternatives_korean:
  - 토비아에게 아내로 주며
  - 토비아에게 아내로 건네주며
  lexicon: BDAG
  rationale: παραδίδωμι의 공식적 ‘인계/전달’ 뉘앙스를 살리기 위해 ‘넘겨주다’를 택했습니다. 혼인 맥락은 ‘아내로’가 분명히 드러냅니다.
- source_word: κατὰ τὸν νόμον Μωυσέως
  english_pob_choice: according to the law of Moses
  chosen_korean: 모세의 율법에 따라
  alternatives_korean:
