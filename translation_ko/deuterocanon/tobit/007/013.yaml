  yaml_path: translation/deuterocanon/tobit/007/013.yaml
  text: And he called Sarah his daughter[a], and taking her by the hand he gave her to Tobiah as a wife, and he said, “See, according to the law of Moses, take her and bring her to your father.” And he blessed them.
  footnotes:
  - marker: a
    text: Or “receive her” for “take her”; the Greek imperative can carry the sense of taking, receiving, or bringing, but the following command already expresses the movement toward his father.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자기 딸 사라를 불러, 그녀의 손을 잡고 토비아에게 아내로 주고 말하였습니다. “보십시오, 모세의 율법에 따라 그녀를 받아[a] 네 아버지께로 데리고 가십시오.” 그리고 그들을 축복하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘받아’로 옮긴 그리스어 κομίζου는 ‘받다’, ‘취하다’, 또는 ‘데리고 가다’를 뜻할 수 있습니다. 이어지는 ‘데리고 가십시오’가 아버지께로의 이동을 나타내므로, 여기서는 먼저 신부를 받는 행위로 옮겼습니다.
    reason: lexical_alternative
