  lexicon: BDAG
  rationale: 율법(νόμος)과 모세의 명시를 그대로 살려, 전승적이고 법적 근거를 분명하게 표현했습니다.
- source_word: κομίζου αὐτὴν καὶ ἄπαγε πρὸς τὸν πατέρα σου
  english_pob_choice: take her and bring her to your father
  chosen_korean: 그녀를 데리고 가서 네 아버지에게로 가십시오
  alternatives_korean:
  - 그녀를 받아 가서 네 아버지에게로 가십시오
  - 그녀를 데려가 네 아버지에게 가십시오
  lexicon: BDAG
  rationale: κομίζου와 ἄπαγε의 연속 동작을 한국어의 ‘데리고 가서 … 가십시오’로 풀어, 먼저 수용하고 이어 이동하는 흐름을 유지했습니다.
- source_word: εὐλόγησεν αὐτούς
  english_pob_choice: he blessed them
  chosen_korean: 그들을 축복하였습니다
  alternatives_korean:
  - 그들에게 복을 빌어 주었습니다
  - 그들을 복되게 하였습니다
  lexicon: BDAG
  rationale: 단순한 축복 행위를 직설적으로 옮겨, 서술의 간결함과 장면의 마무리감을 보존했습니다.
theological_decisions:
- issue: 모세의 율법을 명시하는 혼인 인계 진술
  chosen_reading: ‘모세의 율법에 따라’라는 문구를 그대로 유지하여, 혼인 행위가 명시적으로 토라적 권위 아래 놓인다는 점을 드러냈습니다.
  alternative_readings:
  - ‘우리 율례에 따라’
  - ‘율법에 따라’
  rationale: 원문이 모세를 직접 언급하므로 이를 약화하지 않고 보존하는 것이 서술의 신학적·법적 무게를 유지합니다.
  doctrine_reference: Translation philosophy §§1, 6
