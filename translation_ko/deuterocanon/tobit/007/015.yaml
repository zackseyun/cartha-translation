base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/015.yaml
  text: And they began to eat[a]. Then Raguel called Edna his wife and said to her, “Sister[b], prepare the other room and bring her in.”
  footnotes:
  - marker: a
    text: “Sister” is a literal kinship form of address to his wife, preserving the Greek wording; it functions idiomatically as an affectionate domestic address.
    reason: cultural_note
  - marker: b
    text: Or “the other chamber.” The Greek ταμεῖον can refer to an inner room or chamber.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들이 먹기 시작했습니다. 그때 라구엘이 자기 아내 에드나를 불러 그에게 말했습니다. 「자매여, 다른 방을 준비하고 그녀를 들이시오.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ἄρχομαι + 부정사로, 동작이 시작되었음을 나타냅니다.
    reason: source_note
  - marker: b
    text: ταμεῖον은 ‘방’ 외에도 ‘내실’, ‘안쪽 방’, ‘방실’ 등을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο ἐσθίειν
  english_pob_choice: they began to eat
  chosen_korean: 먹기 시작했습니다
  alternatives_korean:
  - 먹기 시작했습니다
  - 식사를 시작했습니다
  - 먹기 시작했습니다
  lexicon: BDAG
  rationale: ἄρχομαι + 부정사는 동작의 시작을 나타내므로 ‘먹기 시작했습니다’가 가장 직접적입니다. ‘식사를 시작했습니다’는 약간 더 의역적입니다.
- source_word: ἐκάλεσεν
  english_pob_choice: called
  chosen_korean: 불렀습니다
  alternatives_korean:
  - 불렀습니다
  - 호출했습니다
  - 불러들였습니다
  lexicon: BDAG
  rationale: 가정 안의 대화 상황이므로 ‘불렀습니다’가 자연스럽고, 권위적 뉘앙스가 강한 ‘호출했습니다’는 피했습니다.
- source_word: Ἀδελφή
  english_pob_choice: Sister
  chosen_korean: 자매여
  alternatives_korean:
  - 자매여
  - 누이여
  - 언니여
  lexicon: BDAG
  rationale: 그리스어의 혈족 호칭을 그대로 살리면서도, 아내에게 건네는 친밀한 호칭이라는 기능을 드러내기 위해 ‘자매여’로 옮겼습니다.
- source_word: τὸ ἕτερον ταμεῖον
  english_pob_choice: the other room
  chosen_korean: 다른 방
  alternatives_korean:
  - 다른 방
  - 다른 안방
  - 다른 내실
  lexicon: LSJ
  rationale: ταμεῖον은 방, 내실, 안쪽 방 등을 가리킬 수 있지만, 이 문맥에서는 한국어 ‘방’이 가장 분명합니다. ἕτερον은 ‘다른’으로 옮겼습니다.
theological_decisions:
- issue: 아내에게 대한 호칭 Ἀδελφή의 처리
  chosen_reading: 혈족 호칭을 그대로 살려 ‘자매여’로 번역했습니다.
  alternative_readings:
  - ‘아내여’로 기능적 번역
  - ‘누이여’로 더 친숙하게 번역
  rationale: 원문은 결혼 관계 안에서의 친밀한 호칭을 문자적으로 보여 주므로, 본문이 가진 낯설고도 애정 어린 표현을 보존하는 편이 소스에 충실합니다.
  doctrine_reference: '번역 원칙: 원문 어휘의 투명성 유지, 문화적 완화 지양'
