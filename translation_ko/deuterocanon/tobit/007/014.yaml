  yaml_path: translation/deuterocanon/tobit/007/014.yaml
  text: And he called Edna his wife, and taking a document, he wrote out a marriage contract[a], and they sealed it.
  footnotes:
  - marker: a
    text: Or 'a written agreement' or simply 'a contract'; the Greek term refers to a formal written legal document. 'Marriage contract' is chosen because the immediate context is the marriage arrangement.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 아내 에드나를 불러, 문서를 가져다가 계약서를 작성했고,[a] 그들은 그것에 인장을 찍었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘서면 합의서’ 또는 ‘혼인 계약서’로 옮길 수 있습니다. 그리스어 συγγραφή는 공식적인 서면 계약을 가리킵니다. 이 문맥에서는 혼인 절차와 관련되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλεσεν
  english_pob_choice: called
  chosen_korean: 불렀습니다
  alternatives_korean:
  - 호출했습니다
  - 불러 모았습니다
  lexicon: BDAG
  rationale: 가정적 장면에서 단순히 사람을 부르는 동작이므로, 과도한 격식이 없는 ‘불렀습니다’가 가장 자연스럽습니다.
- source_word: γυναῖκα αὐτοῦ
  english_pob_choice: wife
  chosen_korean: 아내
  alternatives_korean:
  - 부인
  - 여자
  lexicon: BDAG
  rationale: ‘그의’와 결합된 문맥상 관계를 분명히 드러내야 하므로, 일반명사 ‘여자’보다 혼인 관계를 직접 보여 주는 ‘아내’가 적절합니다.
- source_word: βιβλίον
  english_pob_choice: a document
  chosen_korean: 문서
  alternatives_korean:
  - 책
  - 두루마리
  - 기록문
  lexicon: BDAG
  rationale: 이 문맥의 βιβλίον은 읽는 책이 아니라 법적 효력을 가진 서면이므로, 기능을 살린 ‘문서’가 적합합니다.
- source_word: συγγραφήν
  english_pob_choice: a marriage contract
  chosen_korean: 계약서
  alternatives_korean:
  - 서면 합의서
  - 혼인 계약서
  - 계약 문서
  lexicon: LSJ
  rationale: συγγραφή는 공식적인 서면 계약을 가리키며, 한국어로는 법적 문서의 성격을 살리는 ‘계약서’가 가장 간결합니다.
- source_word: ἐσφραγίσαντο
  english_pob_choice: they sealed it
  chosen_korean: 그들은 그것에 인장을 찍었습니다
  alternatives_korean:
  - 그들은 그것을 봉인했습니다
  - 그들은 그것에 도장을 찍었습니다
  lexicon: BDAG
  rationale: 동사는 계약서에 봉인·서명하는 행위를 가리키므로, 고대적 관습을 드러내면서도 현대 독자가 이해할 수 있는 ‘인장을 찍었습니다’로 옮겼습니다.
theological_decisions:
- issue: 혼인 문서의 성격을 어떻게 드러낼 것인가
  chosen_reading: 본문의 συγγραφήν을 법적 서면으로 이해하여, 이야기의 혼인 절차를 보여 주는 ‘계약서’로 번역했습니다.
  alternative_readings:
  - ‘혼인 계약서’로 더 구체화하기
  - ‘서면 합의서’처럼 더 일반화하기
  rationale: 본문은 단순한 약속이 아니라 공적으로 작성·봉인되는 법적 문서를 말하므로, 문맥의 실제 기능을 드러내는 번역이 필요합니다.
  doctrine_reference: 혼인과 언약의 공적 성격
