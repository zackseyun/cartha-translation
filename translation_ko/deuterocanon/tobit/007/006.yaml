translation:
  language: ko
  text: 라구엘이 벌떡 일어나 그에게 다정하게 입맞추고 울었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνεπήδησεν
  english_pob_choice: sprang up
  chosen_korean: 벌떡 일어나
  alternatives_korean:
  - 벌떡 일어서
  - 급히 일어나
  - 일어나
  lexicon: LSJ
  rationale: 갑작스럽고 반가운 동작을 담는 동사로, 단순한 ‘일어나’보다 순간적 감정을 더 분명히 드러냅니다.
- source_word: κατεφίλησεν
  english_pob_choice: kissed him warmly
  chosen_korean: 그에게 입을 맞추고
  alternatives_korean:
  - 그를 따뜻하게 입맞추고
  - 그를 정답게 입맞추고
  - 그에게 키스하고
  lexicon: LSJ
  rationale: 복합동사는 단순한 입맞춤보다 강한 애정의 표시를 뜻하므로, 한국어에서는 자연스러운 ‘입을 맞추고’로 옮기되 과도한 해설은 피했습니다.
- source_word: ἔκλαυσε
  english_pob_choice: wept
  chosen_korean: 울었습니다
  alternatives_korean:
  - 눈물을 흘렸습니다
  - 울었습니다
  - 통곡했습니다
  lexicon: LSJ
  rationale: 감정이 북받친 반응을 나타내지만, 본문은 단순한 통곡보다 넓은 범위의 울음을 허용하므로 가장 중립적인 ‘울었습니다’를 선택했습니다.
- source_word: Ῥαγουήλ
  english_pob_choice: Raguel
  chosen_korean: 라구엘
  alternatives_korean:
  - 라가엘
  - 르우엘
  lexicon: Greek proper-name tradition
  rationale: 그리스어 형태 Ῥαγουήλ을 따르는 현대 음역으로 처리했습니다.
