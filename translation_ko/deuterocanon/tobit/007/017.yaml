base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/017.yaml
  text: Take courage[a], child; may the Lord of heaven and earth grant you favor instead of this sorrow of yours. Take courage, daughter.
  footnotes:
  - marker: a
    text: Or 'grace' instead of 'favor'; the Greek χάρις can bear either sense here.
    reason: lexical_alternative
translation:
  language: ko
  text: 「힘을 내십시오, 아이야. 하늘과 땅의 주님께서 이 슬픔 대신에 호의를 베푸시기를 바랍니다. 힘을 내십시오, 딸아.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘호의’는 ‘은혜’ 또는 ‘은총’으로도 옮길 수 있습니다. 여기의 헬라어 χάρις는 슬픔 대신에 주어지는 호의 또는 은총을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θάρσει
  english_pob_choice: Take courage
  chosen_korean: 힘을 내십시오
  alternatives_korean:
  - 용기를 내십시오
  - 담대하십시오
  - 기운을 내십시오
  lexicon: LSJ
  rationale: 위로와 격려의 직접 명령형으로서 현대 한국어에서 자연스럽고 공손한 표현을 택했습니다. 같은 어구의 반복도 살렸습니다.
- source_word: τέκνον
  english_pob_choice: child
  chosen_korean: 아이야
  alternatives_korean:
  - 자녀여
  - 내 아이야
  - 얘야
  lexicon: LSJ
  rationale: 성별을 특정하지 않는 친밀한 호칭을 살리되, 한국어에서 부드러운 호소로 들리는 표현을 택했습니다. '자녀여'는 지나치게 교회적·격식적입니다.
- source_word: ὁ κύριος τοῦ οὐρανοῦ καὶ τῆς γῆς
  english_pob_choice: the Lord of heaven and earth
  chosen_korean: 하늘과 땅의 주님
  alternatives_korean:
  - 하늘과 땅의 주
  - 하늘과 땅의 주인이신 분
  - 하늘과 땅의 주 하나님
  lexicon: LSJ
  rationale: 우주적 주권을 나타내는 관용구를 한국어 성경 문맥에 맞게 옮겼습니다. '주님'은 여기서 하나님을 가리키는 호칭으로 읽히며, POB의 κύριος 처리와도 맞습니다.
- source_word: σοι χάριν
  english_pob_choice: grant you favor
  chosen_korean: 은혜를 주시기를
  alternatives_korean:
  - 호의를 주시기를
  - 은총을 베푸시기를
  - 은혜를 베푸시기를
  lexicon: LSJ
  rationale: χάρις는 이 문맥에서 ‘favor’로도 가능하지만, 한국어에서는 ‘은혜’가 축복적 청원의 뉘앙스를 가장 자연스럽게 전달합니다. 다만 신학용어로 과도하게 좁히지 않도록 동사를 완곡하게 처리했습니다.
- source_word: ἀντὶ τῆς λύπης σου ταύτης
  english_pob_choice: instead of this sorrow of yours
  chosen_korean: 이 슬픔을 대신할
  alternatives_korean:
  - 이 슬픔 대신에
  - 이 슬픔을 대신하여
  - 이 슬픔의 자리에
  lexicon: LSJ
  rationale: ἀντί의 대체·교환 의미를 반영하여 ‘대신할’로 옮겼습니다. λύπη는 여기서 개인적 고통/슬픔으로 이해하는 것이 자연스럽습니다.
- source_word: θύγατερ
  english_pob_choice: daughter
  chosen_korean: 딸아
  alternatives_korean:
  - 내 딸아
  - 딸님아
  - 여식아
  lexicon: LSJ
  rationale: τέκνον보다 더 구체적인 여성 호칭의 전환을 살리기 위해 직설적이면서도 애정 어린 호격으로 옮겼습니다.
theological_decisions:
- issue: χάρις의 한국어 처리
  chosen_reading: 이 구절에서는 ‘은혜’로 옮기되, 구원론적 전문용어로 과잉 고정하지 않았습니다.
  alternative_readings:
  - 호의
  - 은총
  - 은혜
  rationale: 원문은 고통 속 인물에게 드리는 축복/청원이며, 영어 POB도 ‘favor’를 기본값으로 두었습니다. 한국어에서는 ‘은혜’가 축복 문맥에 가장 자연스럽지만, 문장 전체에서 청원적·축복적 의미로 읽히도록 조정했습니다.
  doctrine_reference: Translation philosophy §1, §6; χάρις의 문맥적 다의성
