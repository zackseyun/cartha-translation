  text: And he did as he said and brought her in there[a], and she wept. Then he received the tears of his daughter and said to her,
  footnotes:
  - marker: a
    text: 'Greek: ''the tears of her daughter.'' The context strongly suggests the sense is ''his daughter,'' referring to Ragouel and Sarah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 말한 대로 하여 그녀를 그곳으로 데리고 들어갔습니다. 그녀는 울었습니다. 그는 자기 딸의 눈물을 받아 주고 그녀에게 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘그녀의 딸의 눈물’이라고 합니다. 소유대명사는 여성형이지만, 문맥상 라구엘이 자기 딸 사라를 위로하는 장면으로 이해되어 본문에서는 ‘자기 딸의 눈물’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν ὡς εἶπεν
  english_pob_choice: did as he said
  chosen_korean: 말한 대로 행하여
  alternatives_korean:
  - 그가 말한 대로 하여
  - 그가 말한 대로 실행하여
  lexicon: BDAG
  rationale: 행동과 발화를 한 덩어리로 묶는 관용구이므로, 직역보다 한국어에서 자연스러운 ‘말한 대로 행하여’가 원문의 단순한 순서를 잘 드러냅니다.
- source_word: εἰσήγαγεν αὐτὴν ἐκεῖ
  english_pob_choice: brought her in there
  chosen_korean: 그녀를 거기 데리고 들어갔습니다
  alternatives_korean:
  - 그녀를 거기 인도했습니다
  - 그녀를 거기 안으로 데리고 갔습니다
  lexicon: BDAG
  rationale: εἰσάγω는 안으로 데려가거나 이끄는 뜻이므로, 서술 흐름을 살리면서도 강압 뉘앙스를 과도하게 더하지 않는 ‘데리고 들어갔습니다’를 택했습니다.
- source_word: τὰ δάκρυα τῆς θυγατρὸς αὐτῆς
  english_pob_choice: the tears of his daughter
  chosen_korean: 자기 딸의 눈물
  alternatives_korean:
  - 그의 딸의 눈물
  - 딸의 눈물
  lexicon: BDAG
  rationale: 문맥상 화자는 라구엘이므로 소유관계를 한국어에서 분명히 하기 위해 ‘자기 딸’로 옮겼습니다. ‘받아 주다’는 δέχομαι의 수용·맞아들임 뉘앙스를 반영합니다.
- source_word: εἶπεν αὐτῇ
  english_pob_choice: said to her
  chosen_korean: 그녀에게 말했습니다
  alternatives_korean:
  - 그녀에게 이르렀습니다
  - 그녀에게 말하였습니다
  lexicon: BDAG
  rationale: 다음 절로 이어지는 직접화법 도입구이므로, 가장 평이하고 문맥에 맞는 ‘말했습니다’를 사용했습니다.
