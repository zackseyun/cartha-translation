  naturalness: 초안의 ‘하나님께서 당신을 위해 가장 좋은 것을 형통하게 하십니다’는 ‘형통하게 하다’의 목적어 결합이 다소 부자연스럽고, 축복의 어조도 현재 서술처럼 들립니다. ‘두 분에게 가장 좋은 것들을 이루어 주시기를 바랍니다’가 현대 표준어 합쇼체에서 자연스럽습니다.
  terminology: ‘형제’는 ἀδελφός의 표면적 표현을 보존하되 각주로 친족 용법을 설명하는 것이 적절합니다. κατὰ τὴν κρίσιν은 특정한 법정 판결로 단정하지 않는 ‘결정에 따라’가 더 안전합니다. Ῥαγουήλ은 ‘라구엘’, ἐλεήμων θεός는 ‘자비로우신 하나님’이 적절합니다.
  issues:
