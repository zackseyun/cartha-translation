    rationale: εὐοδώσει는 ‘형통하게 하다/성공하게 하다’이지만, 한국어에서는 하나님이 ‘가장 좋은 것’을 형통하게 한다는 구조가 어색합니다. 원문의 기원적 축복 기능을 살려 ‘가장 좋은 것들을 이루어 주시기를 바랍니다’로 옮길 수 있습니다.
