  text: And Raguel said[a], “Take her from now on according to the judgment. You are her brother, and she is yours[c][b]. And may the merciful God prosper what is best for you.”
  footnotes:
  - marker: a
    text: '''Brother'' here reflects kinship language and likely means a close relative eligible under family custom, not a literal sibling.'
    reason: cultural_note
  - marker: b
    text: Or 'according to the ruling' or 'according to the legal decision.'
    reason: lexical_alternative
  - marker: c
    text: The Greek could also be rendered more literally, 'the merciful God will prosper for you the best things.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 라구엘이 말했습니다. “그녀를 이제부터 결정에 따라[b] 받아들이십시오. 당신은 그녀의 형제[a]이며, 그녀는 당신의 것입니다. 자비로우신 하나님께서 두 분에게 가장 좋은 것들을 이루어 주시기를 바랍니다.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘형제’는 문자적 남매가 아니라, 혼인 관습상 허용되는 가까운 친족 관계를 가리킬 수 있습니다.
    reason: cultural_note
  - marker: b
    text: ‘결정’은 ‘판단’, ‘판결’, 또는 ‘법적 판정’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 절은 더 문자적으로는 ‘자비로우신 하나님께서 두 분에게 가장 좋은 것들을 형통하게 하실 것입니다’라고 옮길 수도 있습니다.
    reason: lexical_alternative
