- source_word: εὐοδώσει ὑμῖν τὰ κάλλιστα
  english_pob_choice: may the merciful God prosper what is best for you
  chosen_korean: 하나님께서 당신을 위해 가장 좋은 것을 형통하게 하십니다
  alternatives_korean:
  - 하나님께서 당신을 위해 가장 좋은 것을 번영하게 하십니다
  - 하나님께서 당신에게 가장 좋은 것을 이루게 하십니다
  lexicon: LSJ
  rationale: 축복/기원 문맥에서 εὐοδόω의 ‘성공시키다, 형통하게 하다’ 의미를 살려 ‘형통하게 하십니다’로 옮겼고, τὰ κάλλιστα는 ‘가장 좋은 것’으로 자연스럽게 풀었습니다.
