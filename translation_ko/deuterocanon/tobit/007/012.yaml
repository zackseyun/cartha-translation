  - 명령형/소원형으로 더 강하게 번역
  rationale: 헬라어 미래형이 축복 맥락에서는 기원·축복의 힘을 띠므로, 한국어에서는 합쇼체 선언형이 가장 자연스럽고 예배적입니다.
  doctrine_reference: 'DOCTRINE.md: optimal equivalence'
