  source_fidelity: 수정 전 본문은 ὑπήντησεν(만나다/맞이하다)과 ἐχαιρέτισεν(인사하다)을 모두 ‘맞이하다’로 옮겨, 원문의 구별된 두 행위를 반복 표현으로 평준화했습니다. 또한 ‘맞이한 뒤’는 원문에 없는 시간적 종속 관계를 보탭니다. 수정문은 도착, 사라의 맞이함, 상호 인사, 집 안으로 들어감의 순서를 보존하고, 마지막 동사의 암시된 단수 주어도 ‘그가’로만 나타내어 특정 인물을 단정하지 않습니다.
  naturalness: ‘사라가 그를 맞이하였습니다. 그녀가 그에게 인사하였고, 그도 그들에게 인사하였습니다.’는 현대 표준 한국어 합쇼체로 자연스럽고, ‘맞이하다’와 ‘인사하다’의 의미 차이도 분명합니다. 마지막 문장은 원문의 주어 불명시성을 보존하기 위해 다소 명시적인 대명사를 사용하되 자연스러운 서술로 다듬었습니다.
  terminology: 에크바타나, 라구엘, 사라는 그리스어 본문 및 한국어 성서 인명 관행에 무리 없이 부합합니다. ‘집 안으로 데리고 들어갔습니다’는 εἰσήγαγεν의 실내로 이끄는 의미를 적절히 반영합니다.
