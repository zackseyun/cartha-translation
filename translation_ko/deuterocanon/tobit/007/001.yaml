  - 찾아갔고
  lexicon: BDAG
  rationale: 바로 뒤의 목적지를 더 구체화하는 동사이므로, 같은 ‘오다’ 계열이라도 ‘도착하다’로 구분해 진행감을 유지했습니다.
- source_word: ὑπήντησεν
  english_pob_choice: met
  chosen_korean: 맞이하였습니다
