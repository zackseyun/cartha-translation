base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/001.yaml
  text: And he came to Ecbatana and arrived at the house of Raguel[a], and Sarah also met him. She greeted him, and he greeted them[b], and he brought them into the house.
  footnotes:
  - marker: a
    text: 'Greek: ''Sarah also met him.'' The final clause has an implicit singular subject (''he brought them into the house''); the text does not explicitly name who brought them in.'
    reason: alternative_reading
  - marker: b
    text: The parallel Semitic witness reflects the same arrival-and-greeting scene at Raguel's house, though with some differences in wording and detail.
    reason: cross_reference
translation:
  language: ko
  text: 그는 에크바타나에 와서 라구엘의 집에 이르렀습니다. 사라도 그를 맞이하였습니다. 그녀가 그에게 인사하였고, 그도 그들에게 인사하였습니다. 그리고 그가 그들을 집 안으로 데리고 들어갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어에서 마지막 동사는 단수이지만 그 주어를 따로 밝히지 않습니다. 따라서 본문은 ‘그가’라고만 옮기며, 그가 누구인지는 특정하지 않습니다.
    reason: source_note
  - marker: b
    text: 병행하는 셈어 전승도 라구엘의 집에 도착하여 인사를 나누는 장면을 전하지만, 표현과 세부 사항에는 차이가 있습니다.
    reason: cross_reference
lexical_decisions:
