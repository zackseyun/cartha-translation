base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/001.yaml
  text: And he came to Ecbatana and arrived at the house of Raguel[a], and Sarah also met him. She greeted him, and he greeted them[b], and he brought them into the house.
  footnotes:
  - marker: a
    text: 'Greek: ''Sarah also met him.'' The final clause has an implicit singular subject (''he brought them into the house''); the text does not explicitly name who brought them in.'
    reason: alternative_reading
  - marker: b
    text: The parallel Semitic witness reflects the same arrival-and-greeting scene at Raguel's house, though with some differences in wording and detail.
    reason: cross_reference
translation:
  language: ko
  text: 그는 에크바타나에 이르러 라구엘의 집에 도착하였고, 사라도 그를 맞이하였습니다. 그녀는 그를 맞이하였고, 그도 그들을 맞이한 뒤 집 안으로 데려갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 첫 절에서 ‘그가 에크바타나에 와서 라구엘의 집에 이르렀다’고 서술하며, 뒤의 마지막 동사는 주어를 따로 밝히지 않습니다.
    reason: source_note
  - marker: b
    text: 인사 동사가 두 번 이어져 있어, 사라의 맞이함과 그에 대한 응답을 각각 드러냈습니다.
    reason: korean_style_note
lexical_decisions:
- source_word: ἦλθεν
  english_pob_choice: came
  chosen_korean: 이르러
  alternatives_korean:
  - 왔습니다
  - 도착하였습니다
  lexicon: BDAG
  rationale: 첫 동작은 단순한 이동을 나타내므로, 문맥상 자연스러운 ‘이르러’로 옮겨 도착의 흐름을 살렸습니다.
- source_word: παρεγένετο
  english_pob_choice: arrived
  chosen_korean: 도착하였고
  alternatives_korean:
