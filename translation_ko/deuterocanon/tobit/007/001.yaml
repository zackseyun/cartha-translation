  - 문안하였고, 그도 그들을 문안하였으며
  lexicon: BDAG
  rationale: Greek의 두 번째 인사 동작을 한국어에서도 반복으로 드러내되, 과도한 장식 없이 상호 인사와 응대를 자연스럽게 표현했습니다.
- source_word: εἰσήγαγεν
  english_pob_choice: brought ... into
  chosen_korean: 집 안으로 데려갔습니다
  alternatives_korean:
