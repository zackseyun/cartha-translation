  lexicon: BDAG
  rationale: 단순히 마주침보다 환대의 뉘앙스가 있는 문맥이어서, 뒤의 greeting 동사와 구분되도록 ‘맞이하다’를 택했습니다.
- source_word: ἐχαιρέτισεν / αὐτὸς αὐτούς
  english_pob_choice: greeted / he greeted them
  chosen_korean: 그를 맞이하였고, 그도 그들을 맞이한 뒤
  alternatives_korean:
