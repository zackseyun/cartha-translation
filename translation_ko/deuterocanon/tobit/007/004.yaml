base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/004.yaml
  text: And he said to them[a], “Do you know Tobit our brother?”
  footnotes:
  - marker: a
    text: Or 'our kinsman' / 'our relative.' The Greek says 'our brother,' likely as a kinship term rather than for a literal sibling.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 그들에게 말했습니다. 「토빗 우리 형제를 아십니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어의 ‘형제’는 여기서 문자적 형제라기보다 친족을 가리키는 말일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γινώσκετε
  english_pob_choice: Do you know
  chosen_korean: 아십니까
  alternatives_korean:
  - 아시나요
  - 알고 계십니까
  - 아십니까, 아시나요
  lexicon: BDAG
  rationale: 상대가 사람을 알아보는지 묻는 현재 시제 질문으로 이해하여, 현대 한국어의 자연스러운 확인 질문인 「아십니까」로 옮겼습니다.
- source_word: Τωβεὶτ
  english_pob_choice: Tobit
  chosen_korean: 토빗
  alternatives_korean:
  - 토비트
  - 토베이트
  lexicon: 고유명사 표기 관행
  rationale: 이름은 통용되는 음역을 따르되, 한국어 성경 독자가 바로 읽을 수 있는 형태인 「토빗」으로 옮겼습니다.
- source_word: τὸν ἀδελφὸν ἡμῶν
  english_pob_choice: our brother
  chosen_korean: 우리 형제
  alternatives_korean:
  - 우리 친족
  - 우리 친척
  - 우리 동족
  lexicon: BDAG
  rationale: ἀδελφός는 직계 형제만이 아니라 혈족·동족의 친족 관계를 가리킬 수 있으므로, 문맥의 친족적 호칭을 살리면서도 직역의 결을 유지해 「우리 형제」로 옮겼습니다.
theological_decisions:
- issue: ‘형제’의 관계 범위
  chosen_reading: 직계 형제가 아니라 친족적 호칭으로 이해하되, 본문에는 그대로 「형제」를 유지합니다.
  alternative_readings:
  - 우리 친족
  - 우리 친척
  rationale: 그리스어가 실제 혈연 형제를 뜻하기보다 공동체적·혈족적 연대감을 나타낼 가능성이 크지만, 본문의 언어적 질감을 보존하기 위해 완화하지 않았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4, 5
