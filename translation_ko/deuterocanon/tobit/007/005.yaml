base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/005.yaml
  text: They said[a], “He is alive and well.” And Tobiah said[b], “He is my father.”
  footnotes:
  - marker: a
    text: 'Greek: ''lives and is healthy''; rendered idiomatically as ''is alive and well.'''
    reason: lexical_alternative
  - marker: b
    text: Traditional English forms often use 'Tobias' here instead of 'Tobiah.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 말했습니다[a]. “그는 살아 있으며 건강합니다.” 그러자 토비아가 말했습니다[b]. “그는 내 아버지입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘살고 있으며 건강합니다’라는 뜻입니다. 한국어에서는 자연스러운 응답으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 Τωβίας는 전통적으로 ‘토비아스’로도 옮기지만, 여기서는 음역 원칙에 따라 ‘토비아’를 사용했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ζῇ + ὑγιαίνει
  english_pob_choice: is alive and well
  chosen_korean: “살아 있으며 건강합니다”
  alternatives_korean:
  - “삽니다”
  - “살아 있고 잘 있습니다”
  - “살아 있고 건강합니다”
  lexicon: BDAG
  rationale: 두 동사의 병렬을 살리되, 한국어에서는 ‘건강합니다’가 ὑγιαίνει의 상태를 자연스럽게 전달하므로 ‘살아 있으며 건강합니다’로 옮겼습니다.
- source_word: Πατήρ μου ἐστιν
  english_pob_choice: He is my father
  chosen_korean: “그는 내 아버지입니다”
  alternatives_korean:
  - “그는 제 아버지입니다”
  - “내 아버지입니다”
  lexicon: BDAG
  rationale: 그리스어의 동일시 구조를 한국어의 자연스러운 주어-서술 관계로 옮겼으며, 직전 발화의 지시 대상이 분명하므로 ‘그는’으로 명시했습니다.
- source_word: Τωβίας
  english_pob_choice: Tobiah
  chosen_korean: 토비아
  alternatives_korean:
  - 토비아스
  lexicon: Project transliteration policy
  rationale: 그리스어 Τωβίας를 프로젝트 기본 원칙에 따라 음역했으며, 영어 POB의 ‘Tobiah’와도 일치시켰습니다.
theological_decisions:
- issue: 살아 있음과 건강함의 병렬 표현
  chosen_reading: ‘살아 있으며 건강합니다’로 두 상태를 모두 유지했습니다.
  alternative_readings:
  - ‘살았습니다’처럼 단순 생존만 말하는 번역
  - ‘무사합니다’처럼 상태를 일반화하는 번역
  rationale: 본문은 단순 생존이 아니라 생명과 건강을 함께 확인하는 응답이므로, 두 요소를 모두 드러내는 것이 원문 의도를 더 잘 보존합니다.
  doctrine_reference: 원문의 서술적 사실 진술 보존
