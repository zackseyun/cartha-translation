base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/018.yaml
  text: And Raguel called Edna his wife and said to her[a], “Sister[b], prepare the other chamber and bring her in there.”
  footnotes:
  - marker: a
    text: Or “the other chamber.” The Greek ταμεῖον can refer to an inner room or chamber.
    reason: lexical_alternative
  - marker: b
    text: “Sister” is a literal form of address to his wife, not a statement of biological relationship.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 라구엘은 자기 아내 에드나를 불러 그녀에게 말했습니다. “자매여[b], 다른 방[a]을 준비하고 그녀를 그곳으로 데려가십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ταμεῖον은 안방이나 내실, 또는 단순히 방을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘자매’는 아내를 향한 문자적 호칭이며, 혈연관계를 말하는 것은 아닙니다.
    reason: cultural_note
lexical_decisions:
- source_word: Ἔδναν τὴν γυναῖκα αὐτοῦ
  english_pob_choice: Edna his wife
  chosen_korean: 그의 아내 에드나
  alternatives_korean:
  - 에드나
  - 아내 에드나
  lexicon: LSJ
  rationale: 고유명사와 관계 호칭을 함께 살려 라구엘의 아내임을 분명히 하되, 불필요한 반복은 피했습니다.
- source_word: Ἀδελφή
  english_pob_choice: Sister
  chosen_korean: 자매여
  alternatives_korean:
  - 자매야
  - 누이여
  lexicon: LSJ
  rationale: 아내에게 부르는 친족형 호칭의 직역을 유지하되, 한국어에서는 문맥상 자연스러운 호격인 ‘자매여’를 택했습니다.
- source_word: τὸ ἕτερον ταμεῖον
  english_pob_choice: the other room
  chosen_korean: 다른 방
  alternatives_korean:
  - 다른 방
  - 다른 침실
  - 다른 내실
  lexicon: LSJ
  rationale: ταμεῖον은 이 문맥에서 방/내실/침실로 옮길 수 있지만, 한국어에서는 가장 직접적이고 자연한 ‘방’이 의미를 충분히 전달합니다.
- source_word: εἴσαγε αὐτήν
  english_pob_choice: bring her in there
  chosen_korean: 그녀를 그리로 데려가십시오
  alternatives_korean:
  - 그녀를 그리로 인도하십시오
  - 그녀를 그 안으로 데려가십시오
  lexicon: LSJ
  rationale: 방 안으로 데려가라는 방향성을 분명히 하면서, 현대 한국어 명령형의 정중한 형태로 옮겼습니다.
