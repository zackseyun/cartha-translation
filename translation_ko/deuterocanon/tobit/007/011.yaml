  text: I gave my child to seven men[a], and whenever they went in to her, they died during the night. But for now, be cheerful. And Tobiah said[b], “I will taste nothing here until you settle and conclude the matter with me.”
  footnotes:
  - marker: a
    text: Greek 'seven men'; the context indicates these were the men to whom she had been given in marriage, so 'seven husbands' is a possible contextual rendering.
    reason: lexical_alternative
  - marker: b
    text: 'The final clause is difficult in the Greek witness here. The translation reflects the apparent sense: Tobiah refuses to eat until the marriage arrangement is formally settled with him.'
    reason: textual_variant
translation:
  language: ko
  text: “내 아이를 일곱 남자에게 주었습니다[a]. 그들이 그 여인에게 들어갈 때마다 밤에 죽곤 했습니다. 그러나 지금은 기뻐하십시오.” 그러자 토비야가 말했습니다[b]. “여기서는 아무것도 맛보지 않겠습니다. 여러분이 저와 함께 그 일을 정하고 확정하실 때까지는요.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘일곱 남자’라고 합니다. 문맥상 이들은 그 아이에게 혼인으로 주어진 남편들이며, 따라서 ‘일곱 남편’으로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 이 그리스어 본문에서 문법과 의미가 다소 난해합니다. 이 번역은 토비야가 혼인 문제를 자신과 정식으로 정하고 확정할 때까지 식사를 거절한다는 문맥상의 뜻을 반영합니다.
    reason: textual_variant
lexical_decisions:
- source_word: τὸ παιδίον μου
  english_pob_choice: my child
  chosen_korean: 내 아이
  alternatives_korean:
  - 내 딸
  - 내 자녀
  lexicon: LSJ
  rationale: παιδίον은 기본적으로 ‘아이/어린이’이므로, 성별을 앞서 확정하지 않고 친밀한 소유 표현을 살려 ‘내 아이’로 옮겼습니다.
- source_word: ἑπτὰ ἀνδράσιν
  english_pob_choice: seven men
  chosen_korean: 일곱 남자에게
  alternatives_korean:
  - 일곱 남편에게
  - 일곱 사람에게
  lexicon: LSJ
  rationale: ἀνήρ는 ‘남자’와 ‘남편’을 모두 뜻할 수 있지만, 여기서는 그리스어 표면형을 따라 ‘남자’로 두고 문맥상 혼인 관계는 독자가 파악하게 했습니다.
- source_word: ὁπότε ἐὰν εἰσεπορεύοντο πρὸς αὐτήν
  english_pob_choice: whenever they went in to her
  chosen_korean: 그들이 그녀에게 들어갈 때마다
  alternatives_korean:
  - 그들이 그녀에게 갈 때마다
  - 그들이 그녀에게 들어갈 때마다
  lexicon: LSJ
  rationale: 혼인/성적 함의를 가진 관용구를 한국어에서도 ‘들어가다’로 살려, 완곡하면서도 직접적인 표현을 유지했습니다.
- source_word: ἕως ἂν στήσητε καὶ σταθῆτε πρὸς μέ
  english_pob_choice: until you settle and conclude the matter with me
  chosen_korean: 여러분이 자리를 잡고 저와 함께 그 일을 마무리할 때까지는요
  alternatives_korean:
  - 여러분이 저와 합의하고 그 일을 마칠 때까지는요
  - 여러분이 저와 함께 그 일을 정하고 끝낼 때까지는요
  lexicon: LSJ
  rationale: 두 동사의 난해함을 그대로 어색하게 직역하기보다, 서술 맥락상 ‘혼인 문제를 공식적으로 마무리하다’는 뜻을 자연스러운 현대 한국어로 옮겼습니다.
theological_decisions:
- issue: Tobiah의 거절 발화의 한국어 존대 수준
  chosen_reading: 직접 화법은 합쇼체로 유지하되, 내용상 단호한 거절을 ‘아무것도 맛보지 않겠습니다’로 분명히 드러냈습니다.
