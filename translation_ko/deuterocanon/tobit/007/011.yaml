  - 그들이 그녀에게 들어갈 때마다
  lexicon: LSJ
  rationale: 혼인/성적 함의를 가진 관용구를 한국어에서도 ‘들어가다’로 살려, 완곡하면서도 직접적인 표현을 유지했습니다.
- source_word: ἕως ἂν στήσητε καὶ σταθῆτε πρὸς μέ
  english_pob_choice: until you settle and conclude the matter with me
  chosen_korean: 여러분이 자리를 잡고 저와 함께 그 일을 마무리할 때까지는요
  alternatives_korean:
  - 여러분이 저와 합의하고 그 일을 마칠 때까지는요
  - 여러분이 저와 함께 그 일을 정하고 끝낼 때까지는요
  lexicon: LSJ
  rationale: 두 동사의 난해함을 그대로 어색하게 직역하기보다, 서술 맥락상 ‘혼인 문제를 공식적으로 마무리하다’는 뜻을 자연스러운 현대 한국어로 옮겼습니다.
theological_decisions:
- issue: Tobiah의 거절 발화의 한국어 존대 수준
  chosen_reading: 직접 화법은 합쇼체로 유지하되, 내용상 단호한 거절을 ‘아무것도 맛보지 않겠습니다’로 분명히 드러냈습니다.
  alternative_readings:
  - ‘아무것도 먹지 않겠습니다’
  - ‘여기서는 아무것도 맛보지 않겠습니다’
  rationale: γεύομαι의 ‘맛보다’ 이미지를 살리면서도 현대 독자가 이해할 수 있게 식사 거절의 의미를 분명히 했습니다.
