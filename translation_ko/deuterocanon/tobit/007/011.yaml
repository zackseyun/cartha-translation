  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ἀπέθνησκον의 반복·습관적 미완료상은 ‘죽곤 했습니다’로 드러내는 편이 낫고, στήσητε καὶ σταθῆτε πρὸς μέ를 ‘자리를 잡고’로 옮긴 것은 문맥상 혼인 합의의 확정과 무관한 뜻을 더하므로 수정이 필요합니다.
  naturalness: ‘그녀에게 들어갈 때마다’도 이해되지만, 이 문맥에서는 ‘그 여인에게 들어갈 때마다’가 더 자연스럽고 원문의 완곡한 혼인·성적 관용 표현을 유지합니다. 인용문 안의 ‘여러분’은 원문의 복수형을 반영하되, ‘그 일을 정하고 확정하실 때까지’로 자연스러운 합쇼체를 유지했습니다.
  terminology: ‘내 아이’와 ‘일곱 남자’는 각각 παιδίον과 ἀνδράσιν의 표면적 모호성을 적절히 보존합니다. 각주 a는 문맥상 이들이 혼인 관계의 남편들이었음을 더 정확하게 설명하도록 다듬었습니다. 각주 b는 난해한 이중 동사와 문맥적 번역임을 계속 밝혀야 합니다.
