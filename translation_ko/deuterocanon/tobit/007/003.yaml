base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/003.yaml
  text: And Raguel asked them[a], “Where are you from, brothers?” And they said to him, “We are from the sons of Naphtali[b], the captives from Nineveh.”
  footnotes:
  - marker: a
    text: Or “from the descendants of Naphtali” or “from the tribe of Naphtali.” The Greek literally says “from the sons of Naphtali.”
    reason: lexical_alternative
  - marker: b
    text: Or “the exiles in Nineveh.” The Greek says “the captives,” emphasizing their deported status.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 라구엘이 그들에게 물었습니다. 「너희는 어디 출신이냐, 형제들아?」 그들이 그에게 대답했습니다. 「우리는 납달리의 자손이며, 니네베의 포로들입니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “납달리의 후손들” 혹은 “납달리 지파”일 수 있습니다. 그리스어는 문자적으로 “납달리의 아들들”이라고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “니네베에 있는 포로들”일 수 있습니다. 그리스어는 “포로들”이라고 하여 그들의 추방·강제이주 상태를 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ῥαγουὴλ ἠρώτησεν
  english_pob_choice: asked
  chosen_korean: 물었습니다
  alternatives_korean:
  - 물어보았습니다
  - 질문했습니다
  lexicon: BDAG
  rationale: 서술문의 자연스러운 현재형 과거로, 그리스어의 단순한 ‘물었다’를 과장 없이 현대 한국어로 옮겼습니다.
- source_word: Πόθεν ἐστέ
  english_pob_choice: Where are you from
  chosen_korean: 어디 출신이냐
  alternatives_korean:
  - 어디서 왔느냐
  - 어디에서 왔습니까
  lexicon: BDAG
  rationale: 출신을 묻는 관용적 표현으로, 혈통·출신지를 함께 암시하는 질문의 성격을 살렸습니다. ‘from’의 출발점보다 정체성 질문이 더 강해 보입니다.
- source_word: ἀδελφοί
  english_pob_choice: brothers
  chosen_korean: 형제들아
  alternatives_korean:
  - 형제들이여
  - 형제들
  lexicon: BDAG
  rationale: 직접 호칭이므로 한국어에서도 호격을 살렸고, 남성 복수 호칭의 직역성을 유지했습니다.
- source_word: Ἐκ τῶν υἱῶν Νεφθαλεὶ
  english_pob_choice: from the sons of Naphtali
  chosen_korean: 납달리의 자손
  alternatives_korean:
  - 납달리의 아들들
  - 납달리 지파에서 난 자들
  lexicon: BDAG
  rationale: ‘아들들’의 직역보다 한국어 성경에서 자연스러운 족속·혈통 표지인 ‘자손’을 택해, 족보적 뉘앙스를 보존했습니다.
- source_word: τῶν αἰχμαλώτων
  english_pob_choice: the captives
  chosen_korean: 포로들
  alternatives_korean:
  - 붙잡힌 자들
  - 포로 된 자들
  lexicon: BDAG
  rationale: 단순한 ‘포로’가 포획·강제이주된 상태를 잘 드러내며, 문맥의 압박감을 유지합니다.
theological_decisions:
- issue: 니네베에서의 정체성 진술을 어떻게 처리할지
  chosen_reading: ‘니네베의 포로들’로 두어, 단순 거주민이 아니라 강제 이주된 포로 신분임을 드러냈습니다.
  alternative_readings:
  - ‘니네베에 있는 포로들’
  - ‘니네베에서 온 포로들’
  rationale: 그리스어 ἐκ Νινευή는 출처/소속을 나타내지만, 문맥상 포로 상태를 강조하므로 ‘~의 포로들’이 본문의 힘을 가장 잘 살립니다.
  doctrine_reference: 해석학적 문맥 판단
- issue: ‘형제들’ 호칭의 처리
  chosen_reading: 남성 복수 호칭을 중화하지 않고 ‘형제들아’로 옮겼습니다.
  alternative_readings:
  - ‘여러분’
  - ‘형제자매들아’
  rationale: 원문이 직접 ‘ἀδελφοί’를 쓰므로, 성중립화보다 원문 호칭의 직접성을 우선했습니다.
  doctrine_reference: 본문 충실성 원칙
