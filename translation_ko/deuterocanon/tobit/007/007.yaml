base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/007.yaml
  text: And he said to him[a], “He is the son of a noble and good man.” And when he heard that Tobit had lost his eyes[b], he was grieved and wept.
  footnotes:
  - marker: a
    text: Greek is elliptical here; literally, 'the one of the noble and good man.' The translation supplies 'son' for clear English and likely sense in context.
    reason: lexical_alternative
  - marker: b
    text: Or, 'had lost his sight.' The Greek says more literally, 'had lost his eyes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그에게 말했습니다. 「그는 고귀하고 선한 사람의 아들입니다」[a]. 그리고 토빗이 자기 눈을 잃었다는[b] 말을 듣자, 그는 슬퍼하며 울었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 여기서 생략된 식별문입니다. 문맥상 자연스럽게 ‘아들’을 보충했습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘시력을 잃었다’. 그리스어는 더 문자적으로 ‘눈을 잃었다’고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ τοῦ καλοῦ καὶ ἀγαθοῦ ἀνθρώπου
  english_pob_choice: He is the son of a noble and good man
  chosen_korean: 고귀하고 선한 사람의 아들입니다
  alternatives_korean:
  - 좋고 선한 사람의 아들입니다
  - 고결하고 좋은 사람의 아들입니다
  - 그 좋은 사람의 아들입니다
  lexicon: LSJ
  rationale: 그리스어는 생략된 친족관계 표현이지만 문맥상 신원을 밝히는 말이므로, 영어 POB처럼 ‘아들’을 보충해 자연스럽게 옮겼습니다. καλοῦ는 ‘고귀한’, ἀγαθοῦ는 ‘선한’으로 구분해 중복을 피하면서 두 형용사의 뉘앙스를 살렸습니다.
- source_word: ἀκούσας
  english_pob_choice: when he heard
  chosen_korean: 말을 듣자
  alternatives_korean:
  - 들었을 때
  - 듣고 나서
  - 듣자마자
  lexicon: LSJ
  rationale: 분사구문을 한국어의 시간 연결로 자연스럽게 옮겼습니다. 서술 흐름을 해치지 않으면서 원문의 시점 관계를 유지합니다.
- source_word: ἀπώλεσεν τοὺς ὀφθαλμοὺς ἑαυτοῦ
  english_pob_choice: had lost his eyes
  chosen_korean: 자기 눈을 잃었다는
  alternatives_korean:
  - 시력을 잃었다는
  - 눈을 잃었다는
  - 눈을 상실했다는
  lexicon: LSJ
  rationale: 그리스어는 ‘눈’을 직접적으로 말하므로, 해석적 완화인 ‘시력’보다 구체성을 살린 표현을 택했습니다. 한국어에서는 직역이 어색하지 않도록 ‘자기 눈을 잃었다’의 구조를 유지했습니다.
- source_word: ἐλυπήθη
  english_pob_choice: was grieved
  chosen_korean: 슬퍼하며
  alternatives_korean:
  - 근심하며
  - 마음 아파하며
  - 비통해하며
  lexicon: LSJ
  rationale: 동사의 상태를 한국어 서술 연결로 풀어, 감정의 발생과 지속을 함께 드러냈습니다. ‘슬퍼하다’는 이 장면의 공감 어린 반응을 가장 مستقیم하게 전달합니다.
theological_decisions:
- issue: 생략된 친족관계의 보충
  chosen_reading: ‘Ὁ τοῦ καλοῦ καὶ ἀγαθοῦ ἀνθρώπου’를 문맥상 ‘고귀하고 선한 사람의 아들’로 보충해 옮겼습니다.
  alternative_readings:
  - ‘고귀하고 선한 사람의 사람’
  - ‘고귀하고 선한 사람에게 속한 이’
  - ‘그 고귀하고 선한 사람의 것’
  rationale: 그리스어는 문법적으로 생략된 식별문이므로, 한국어에서는 화자 의도를 분명히 하기 위해 최소한의 보충이 필요합니다. ‘아들’은 영어 POB의 판단과 문맥상 친족 식별 기능에 가장 잘 맞습니다.
  doctrine_reference: 'translation philosophy: optimal equivalence; source-driven ellipsis expansion'
- issue: ‘눈을 잃다’의 구체성 유지
  chosen_reading: 토빗의 상태를 ‘눈을 잃었다’로 구체적으로 유지했습니다.
  alternative_readings:
  - ‘시력을 잃었다’
  - ‘앞을 보지 못하게 되었다’
  rationale: 원문은 감각기관인 ‘눈’을 직접 언급하므로, 이를 일반화하면 본문의 촉감을 약화시킬 수 있습니다. 한국어에서는 이해 가능성을 해치지 않는 범위에서 원문의 구체성을 보존하는 것이 더 적절합니다.
  doctrine_reference: 'translation philosophy: preserve source texture while maintaining readability'
