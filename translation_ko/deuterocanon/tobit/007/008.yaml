  text: And Edna his wife and Sarah his daughter wept[a], and they welcomed them eagerly.
  footnotes:
  - marker: a
    text: Or 'received them warmly' or 'received them willingly'; the Greek adverb emphasizes ready, wholehearted hospitality.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그의 아내 에드나와 그의 딸 사라가 울었습니다. 그들은 그들을 기꺼이 맞아들였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '따뜻하게 맞아들였습니다', '흔쾌히 받아들였습니다'. 그리스어 부사는 준비된 마음과 진심 어린 환대를 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔδνα
  english_pob_choice: Edna
  chosen_korean: 에드나
  alternatives_korean:
  - 엣나
  - 에드나
  lexicon: 고유명사 음역
  rationale: 고유명사는 통용되는 현대 음역으로 옮기며, 영어 POB의 Edna에 대응해 표준적인 '에드나'를 택했습니다.
- source_word: ἡ γυνὴ αὐτοῦ
  english_pob_choice: his wife
  chosen_korean: 그의 아내
  alternatives_korean:
  - 그의 여자
  - 그의 부인
  lexicon: BDAG
  rationale: γυνή는 여기서 혼인 관계를 가리키므로, 한국어에서도 자연스럽고 직접적인 '아내'가 가장 정확합니다.
- source_word: ἔκλαυσαν
  english_pob_choice: wept
  chosen_korean: 울었습니다
  alternatives_korean:
  - 통곡했습니다
  - 울었고
  lexicon: BDAG
  rationale: aorist의 단순한 울음을 한국어로 자연스럽게 옮기되, 과도한 강도를 더하지 않도록 '울었습니다'를 사용했습니다.
- source_word: ὑπεδέξαντο προθύμως
  english_pob_choice: welcomed them eagerly
  chosen_korean: 기꺼이 맞아들였습니다
  alternatives_korean:
  - 따뜻하게 맞이했습니다
  - 흔쾌히 영접했습니다
  - 열성적으로 맞아들였습니다
  lexicon: BDAG
  rationale: ὑπεδέξαντο는 환대의 '받아들임'이고 προθύμως는 자원하는 적극성을 더하므로, 이를 함께 살려 '기꺼이 맞아들였습니다'로 옮겼습니다.
theological_decisions:
- issue: 환대의 뉘앙스 처리
  chosen_reading: 단순한 '받았다'보다 적극적이고 자발적인 환대를 드러내는 표현을 택했습니다.
  alternative_readings:
  - 그들을 받아들였습니다
  - 그들을 따뜻하게 맞이했습니다
  rationale: 문맥상 단순 수용이 아니라 기쁜 환대가 강조되므로, προθύμως의 의미를 살려 독자가 관계적 온도를 이해하도록 했습니다.
  doctrine_reference: 서사 문맥의 환대 표현
