base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/002.yaml
  text: And Edna said to his wife[b][a], “How much the young man Tobit resembles my nephew!”
  footnotes:
  - marker: a
    text: The Greek text reads, 'Edna said to his wife,' though the Semitic parallel has Raguel speaking to Edna his wife. The context may suggest a textual or transmission irregularity.
    reason: textual_variant
  - marker: b
    text: Or 'my cousin.' The Greek kinship term can be used more broadly for a close male relative, though 'nephew' is the more specific sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 에드나가 그의 아내에게 말했습니다. “이 젊은이 토빗은 내 조카를 무척 닮았군요!”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 ‘에드나가 그의 아내에게 말했다’라고 읽지만, 셈어 평행 본문에서는 라구엘이 그의 아내 에드나에게 말하는 것으로 보입니다. 문맥은 전승상의 차이 또는 본문 전승의 이상 가능성을 시사합니다.
    reason: textual_variant
  - marker: b
    text: ἀνεψιός는 더 넓게는 ‘사촌’을 뜻할 수도 있지만, 여기서는 ‘조카’가 더 구체적인 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν
  english_pob_choice: And ... said
  chosen_korean: 그리고 … 말했습니다
  alternatives_korean:
