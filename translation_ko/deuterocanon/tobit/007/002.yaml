- source_word: τῇ γυναικὶ αὐτοῦ
  english_pob_choice: to his wife
  chosen_korean: 그의 아내에게
  alternatives_korean:
  - 그 여자에게
  - 그의 부인에게
  lexicon: BDAG
  rationale: γυνή는 여기서 단순한 ‘여자’가 아니라 관계상 ‘아내’를 뜻하므로 그 의미를 분명히 했습니다.
- source_word: Ὡς ὅμοιος
  english_pob_choice: How much ... resembles
  chosen_korean: 얼마나 많이 닮았습니까
  alternatives_korean:
  - 참 많이 닮았습니까
  - 얼마나 닮았습니까
  lexicon: BDAG
  rationale: 감탄의 Ὡς와 비교 형용사 ὅμοιος의 관용적 힘을 살려, 단순 비교가 아니라 강한 유사성을 드러내는 표현으로 옮겼습니다.
- source_word: τῷ ἀνεψιῷ μου
  english_pob_choice: my nephew
  chosen_korean: 내 조카
  alternatives_korean:
  - 내 사촌
  - 내 친족
  lexicon: BDAG
  rationale: ἀνεψιός는 넓게는 사촌까지 포함할 수 있지만, 여기서는 가장 구체적인 기본 의미인 ‘조카’로 옮기되 한국어의 친족 감각을 고려했습니다.
theological_decisions:
- issue: 본문의 화자 표기 불일치
  chosen_reading: 그리스어 본문을 따라 ‘에드나가 그의 아내에게’로 옮기고, 본문 자체의 어색함은 그대로 드러냈습니다.
  alternative_readings:
  - ‘라구엘이 그의 아내 에드나에게’로 조정
  - 이상한 화자 표기를 매끈하게 의역
  rationale: 이 절의 그리스어는 화자와 수신자 표기가 문맥상 매끄럽지 않지만, 프로젝트 원칙상 그리스어 본문을 우선하므로 조정하지 않았습니다. 대신 한국어 본문도 원문의 긴장을 보존했습니다.
  doctrine_reference: 원문 우선 원칙; 번역자가 본문을 조용히 수정하지 않고 전승상의 불일치를 드러내야 함
