base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/009/005.yaml
  text: So Raphael went and lodged with Gabael[a], and he gave him the written note[b]; then Gabael brought out the money bags with the seals and gave them to him.
  footnotes:
  - marker: a
    text: Or 'the bond' or 'the promissory note.' The Greek χειρόγραφον can denote a written document acknowledging a financial claim.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the bags in the seals,' that is, the money bags with their seals still intact.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 라파엘은 가서 가바엘과 함께 묵었고, 그에게 그 증서[a]를 주었습니다. 그러자 가바엘은 봉인이 그대로 있는 돈주머니들[b]을 꺼내어 그에게 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: χειρόγραφον은 문자적으로 ‘손으로 쓴 것’이지만, 이 문맥에서는 채무나 권리를 확인하는 서면 문서를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘봉인이 그대로 있는’은 직역하면 ‘봉인들 안에 있는’에 해당하는 표현으로, 봉인이 아직 온전함을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν αὐτῷ τὸ χειρόγραφον
  english_pob_choice: he gave him the written note
  chosen_korean: 그에게 그 서면 증서를 주었습니다
  alternatives_korean:
  - 그에게 그 빚 문서를 주었습니다
  - 그에게 그 채권서를 주었습니다
  - 그에게 그 손으로 쓴 문서를 주었습니다
  lexicon: BDAG
  rationale: χειρόγραφον은 단순한 메모보다 금융적 효력이 있는 서면 문서를 가리킬 수 있어, 문맥을 살리면서도 과도하게 기술적인 용어를 피하는 ‘서면 증서’가 적절합니다.
- source_word: ηὐλίσθη παρὰ Γαβαήλ
  english_pob_choice: lodged with Gabael
  chosen_korean: 가바엘에게 가서 묵었고
  alternatives_korean:
  - 가바엘과 함께 묵었고
  - 가바엘 집에 묵었고
  - 가바엘에게 머물렀고
  lexicon: LSJ
  rationale: αὐλίζομαι는 여행 중 하룻밤 묵는 뜻이므로, ‘묵다’를 사용해 여행 맥락을 자연스럽게 살렸습니다.
- source_word: τὰ θυλάκια ἐν ταῖς σφραγῖσιν
  english_pob_choice: the money bags with the seals
  chosen_korean: 봉인이 그대로 있는 돈주머니들
  alternatives_korean:
  - 봉인된 돈주머니들
  - 봉인이 달린 돈주머니들
  - 봉인이 남아 있는 돈주머니들
  lexicon: BDAG
  rationale: ἐν ταῖς σφραγῖσιν은 봉인이 아직 건드려지지 않았음을 나타내므로, ‘봉인이 그대로 있는’으로 문맥을 분명히 했습니다.
- source_word: τὰ θυλάκια
  english_pob_choice: the money bags
  chosen_korean: 돈주머니들
  alternatives_korean:
  - 주머니들
  - 돈봉투들
  - 지갑들
  lexicon: LSJ
  rationale: θυλάκιον은 작은 자루나 주머니를 뜻하며, 여기서는 보관된 금전을 가리키므로 ‘돈주머니’가 가장 자연스럽습니다.
