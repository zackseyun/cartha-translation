  to: 그리하여 라파엘은 가서 가바엘과 함께 묵었고, 그에게 그 증서[a]를 주었습니다. 그러자 가바엘은 봉인이 그대로 있는 돈주머니들[b]을 꺼내어 그에게 주었습니다.
