  source_fidelity: 핵심 사건 순서와 의미는 잘 반영되었습니다. 다만 παρά Γαβαήλ은 ‘가바엘에게 가서 묵다’보다 ‘가바엘과 함께 묵다’로 옮기는 편이 사람과 함께/그의 숙소에서 묵었다는 뜻을 더 정확하고 자연스럽게 드러냅니다.
  naturalness: ‘가바엘에게 가서 묵었고’는 현대 한국어에서 목적지와 숙박 상대의 관계가 다소 어색합니다. ‘가서 가바엘과 함께 묵었고’가 자연스럽습니다. 각주 표지는 해당 표현 바로 뒤에 두는 것이 독자의 이해에 좋습니다.
  terminology: χειρόγραφον을 ‘증서’로 옮기면 문서의 성격을 지나치게 특정하지 않으면서도 문맥상 금융 관련 문서일 수 있음을 유지합니다. ‘봉인이 그대로 있는 돈주머니들’은 봉인이 온전하다는 문맥적 뜻을 적절히 전달합니다.
