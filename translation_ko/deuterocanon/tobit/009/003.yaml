  terminology: ‘라구엘’은 적절합니다. ‘맹세하다’도 ὠμόμοκεν에 적합합니다. 각주 원문의 ‘나가야 한다는 것을 허락하지 않겠다’는 한국어 표현이 부자연스럽고 뜻도 불명확하므로 ‘나가지 못하게 하겠다’로 고칩니다.
