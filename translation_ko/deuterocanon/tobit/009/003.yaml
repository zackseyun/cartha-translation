  source_fidelity: 그리스어 διότι의 인과 관계와 ὠμόμοκεν의 맹세는 반영되어 있습니다. 그러나 초안의 ‘내가 나가지 못하도록 맹세했다’는 한국어에서 라구엘 자신이 나가지 않겠다고 맹세한 것으로도 읽힐 수 있어, 원문의 뜻인 화자의 출발을 허락하지 않겠다는 맹세를 분명히 해야 합니다.
