translation:
  language: ko
  text: 그리고 그의 아버지 토빗은 날마다 헤아리고 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τωβεὶθ ὁ πατὴρ αὐτοῦ
  english_pob_choice: Tobit his father
  chosen_korean: 그의 아버지 토빗은
  alternatives_korean:
  - 토빗, 그의 아버지는
  - 그 아버지 토빗은
  lexicon: 고유명사/통사
  rationale: 그리스어의 이름+동격 구조를 자연스럽게 살리되, 관계를 분명히 하기 위해 ‘그의 아버지’를 앞에 두었습니다.
- source_word: ἐλογίζετο
  english_pob_choice: was counting
  chosen_korean: 헤아리고 있었습니다
  alternatives_korean:
  - 세고 있었습니다
  - 계산하고 있었습니다
  - 헤아렸습니다
  lexicon: LSJ
  rationale: 미완료 시제의 반복·지속성을 살려 현재 진행형 느낌으로 옮겼고, 아들의 부재한 날들을 ‘헤아리다’가 문맥에 가장 자연스럽습니다.
- source_word: ἑκάστης ἡμέρας
  english_pob_choice: every day
  chosen_korean: 날마다
  alternatives_korean:
  - 매일
  - 각 날마다
  - 하루하루
  lexicon: LSJ
  rationale: 분배적 반복을 간결하게 살리는 한국어 관용 표현으로 옮겼습니다.
theological_decisions:
- issue: 본문의 단순 서술을 과장하지 않는지
  chosen_reading: 토빗이 아들의 지연을 매일 세어 가며 불안하게 기다리는 상황을 담담히 서술합니다.
  alternative_readings:
  - 단순히 ‘기억하고 있었다’로 완화하는 읽기
  - 감정 해석을 덧붙여 ‘근심하며 세고 있었다’로 확장하는 읽기
  rationale: 그리스어 동사는 ‘계산하다/헤아리다’의 반복 행위를 말하며, 여기서는 불안의 감정이 문맥상 배경으로 드러날 뿐 본문에 직접 추가되지는 않습니다.
  doctrine_reference: 본문 서술의 절제와 문맥 우선 원칙
