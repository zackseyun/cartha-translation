  rationale: εἰς/τοὺς αἰῶνας의 지속 기간 표현은 한국어에서 관용적으로 ‘영원히’가 가장 간결하고 자연스럽습니다.
theological_decisions:
- issue: 본문의 간결한 축복 진술과 변이 독법 처리
  chosen_reading: 본문은 단순히 ‘그는 그들을 영원히 축복하셨습니다’로 옮기고, ‘깨끗하고 거룩한 복으로’라는 확대 독법은 각주로 보존합니다.
  alternative_readings:
  - ‘깨끗하고 거룩한 복으로’
  - ‘그들을 모두 영원히’
  rationale: 기본 본문은 매우 압축된 축복 진술이므로, 확대 어구를 본문에 흡수하지 않고 주석으로 분리해 텍스트 형태의 차이를 드러내는 편이 source-grounded합니다.
  doctrine_reference: 본문 비평상 변이 독법은 주석에 보존하고 본문은 짧은 기본 독법을 유지합니다.
