  terminology: παῖς는 여기서 연령보다 수행·봉사 역할을 나타내므로 ‘하인’으로 옮겼습니다. ἀργύριον은 문맥상 ‘돈’으로 유지하고 문자적 ‘은’은 주석으로 밝혔습니다. γάμος는 본문에서 ‘혼인 잔치’로 번역하되, 혼인 자체도 가능한 어휘라는 주석을 유지했습니다. 고유명은 ‘메디아’, ‘라게스’, ‘가바엘’로 일관되게 유지했습니다.
