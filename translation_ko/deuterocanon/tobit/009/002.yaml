  rationale: 여기서는 여행 동행자를 가리키며, 문맥상 나이보다 수행·봉사의 역할이 더 중요하므로 ‘종’이 가장 무난합니다. 한국어에서 ‘소년’은 의미가 어긋나고, ‘하인/시종’은 다소 시대적이어서 피했습니다.
