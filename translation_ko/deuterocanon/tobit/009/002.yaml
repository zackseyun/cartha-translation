  source_fidelity: 초안은 여행 동반자, 낙타 둘, 메디아의 라게스와 가바엘, 돈의 회수, 가바엘을 혼인 자리로 데려오는 명령을 대체로 충실히 옮겼습니다. 그러나 “그를 데리고 혼인 잔치에 오게 하십시오”는 수신자에게 ‘오게 하라’는 사역 명령처럼 들리고, 그리스어 ἄγε의 직접적인 ‘데려오라’보다 한 단계 완화·변형됩니다. 또한 γάμος의 ‘혼인/혼인 잔치’ 양의성을 본문에서 ‘혼인 잔치’로 선택하되 해당 위치에 주석을 붙이는 것이 필요합니다.
