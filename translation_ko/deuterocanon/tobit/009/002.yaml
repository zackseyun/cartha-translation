base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/009/002.yaml
  text: Take with yourself a servant and two camels, and go to Rages of Media, to Gabael, and bring me the money, and bring him with you to the wedding.
  footnotes:
  - marker: a
    text: Greek literally, 'silver'; here it refers to the money entrusted to Gabael.
    reason: lexical_alternative
  - marker: b
    text: Or 'to the wedding feast.' The Greek term can refer either to the marriage itself or to the celebratory banquet.
    reason: lexical_alternative
  - marker: c
    text: The parallel Semitic tradition expands the instruction with additional attendants and details about Gabael's house, but the Greek source used here is shorter.
    reason: alternative_reading
translation:
  language: ko
  text: 종 하나와 낙타 두 마리를 함께 데리고 가서, 메디아의 라게스로 가서 가바엘에게 가서 내 돈을 가져오고, 그를 데리고 혼인 잔치에 오게 하십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ἀργύριον은 문자적으로 ‘은’이지만, 여기서는 가바엘에게 맡긴 돈을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: γάμος는 혼인 자체를 가리킬 수도 있고, 혼인 잔치를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 그리스어 본문은 짧으며, 평행하는 셈어 전승은 하인들과 가바엘 집의 세부를 더 덧붙입니다.
    reason: alternative_reading
lexical_decisions:
