base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/009/001.yaml
  text: And Tobiah called Raphael and said to him[a], “Azariah[b], brother,”
  footnotes:
  - marker: a
    text: Raphael is addressed here as 'Azariah,' the name under which he has been traveling with Tobiah.
    reason: cross_reference
  - marker: b
    text: The longer Semitic-aligned tradition continues immediately with Tobiah’s instructions to Azariah/Raphael; the Greek witness used here preserves only the opening address in this verse.
    reason: textual_variant
translation:
  language: ko
  text: 토비야가 라파엘을 불러 그에게 말했습니다. 「아자리아 형제님,」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라파엘은 토비야와 함께 다닐 때 사용한 이름 ‘아자리아’로 불립니다.
    reason: cross_reference
  - marker: b
    text: 그리스어 본문은 이 절에서 호칭만 보존하지만, 더 긴 셈어 전승은 곧바로 아자리아/라파엘에게 이어지는 지시를 덧붙입니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκάλεσεν
  english_pob_choice: called
  chosen_korean: 불렀습니다
  alternatives_korean:
  - 불러냈습니다
  - 소리쳤습니다
  lexicon: BDAG καλέω
  rationale: 직접 화법을 여는 단순한 ‘불렀다’의 의미가 가장 자연스럽고, 강한 ‘소환’ 뉘앙스는 본문이 요구하지 않습니다.
- source_word: Τωβίας
  english_pob_choice: Tobiah
  chosen_korean: 토비야
  alternatives_korean:
  - 토비아스
  - 토비아
  lexicon: 고유명사 표기
  rationale: 소스 지향적으로 히브리식 이름 형태를 살려 ‘토비야’로 옮겼습니다.
- source_word: Ῥαφαήλ
  english_pob_choice: Raphael
  chosen_korean: 라파엘
  alternatives_korean:
  - 라파엘
  lexicon: 고유명사 표기
  rationale: 통용되는 표준 음역을 따랐습니다.
- source_word: Ἀζαρία
  english_pob_choice: Azariah
  chosen_korean: 아자리아
  alternatives_korean:
  - 아사랴
  - 아자리야
  lexicon: 고유명사 표기
  rationale: 영어 POB가 채택한 ‘Azariah’를 반영하되, 한국어에서는 현대 음역으로 ‘아자리아’가 가장 안정적입니다.
- source_word: ἀδελφέ
  english_pob_choice: brother
  chosen_korean: 형제님
  alternatives_korean:
  - 형제여
  - 형제님
  - 형제
  lexicon: BDAG ἀδελφός
  rationale: 직역상 ‘형제’가 맞지만, 한국어에서는 호격의 친근함을 살리면서도 지나치게 교회식이지 않도록 ‘형제님’으로 옮겼습니다.
theological_decisions:
- issue: 이 호칭이 혈연 관계인지, 단순한 친근한 호칭인지
  chosen_reading: 본문은 혈연 주장보다 친근한 호칭으로서의 ‘형제’에 초점이 있습니다.
  alternative_readings:
  - 혈연 의미를 살린 ‘내 형제’
  - 단순 친근 표현인 ‘친구’
  rationale: 그리스어 호격 ἀδελφέ는 문자적으로 ‘형제’이지만, 문맥상 기능은 애정 어린 호칭입니다. 그래서 관계를 과장하지 않으면서도 직접성을 유지했습니다.
  doctrine_reference: 호칭/수사 기능에 대한 본문 주해
