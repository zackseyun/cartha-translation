- source_word: Ῥαφαήλ
  english_pob_choice: Raphael
  chosen_korean: 라파엘
  alternatives_korean:
  - 라파엘
  lexicon: 고유명사 표기
  rationale: 통용되는 표준 음역을 따랐습니다.
- source_word: Ἀζαρία
  english_pob_choice: Azariah
  chosen_korean: 아자리아
  alternatives_korean:
  - 아사랴
  - 아자리야
  lexicon: 고유명사 표기
  rationale: 영어 POB가 채택한 ‘Azariah’를 반영하되, 한국어에서는 현대 음역으로 ‘아자리아’가 가장 안정적입니다.
- source_word: ἀδελφέ
  english_pob_choice: brother
  chosen_korean: 형제님
  alternatives_korean:
  - 형제여
  - 형제님
  - 형제
  lexicon: BDAG ἀδελφός
  rationale: 직역상 ‘형제’가 맞지만, 한국어에서는 호격의 친근함을 살리면서도 지나치게 교회식이지 않도록 ‘형제님’으로 옮겼습니다.
theological_decisions:
- issue: 이 호칭이 혈연 관계인지, 단순한 친근한 호칭인지
  chosen_reading: 본문은 혈연 주장보다 친근한 호칭으로서의 ‘형제’에 초점이 있습니다.
  alternative_readings:
  - 혈연 의미를 살린 ‘내 형제’
  - 단순 친근 표현인 ‘친구’
  rationale: 그리스어 호격 ἀδελφέ는 문자적으로 ‘형제’이지만, 문맥상 기능은 애정 어린 호칭입니다. 그래서 관계를 과장하지 않으면서도 직접성을 유지했습니다.
  doctrine_reference: 호칭/수사 기능에 대한 본문 주해
