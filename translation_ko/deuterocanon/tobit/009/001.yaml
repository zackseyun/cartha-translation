base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/009/001.yaml
  text: And Tobiah called Raphael and said to him[a], “Azariah[b], brother,”
  footnotes:
  - marker: a
    text: Raphael is addressed here as 'Azariah,' the name under which he has been traveling with Tobiah.
    reason: cross_reference
  - marker: b
    text: The longer Semitic-aligned tradition continues immediately with Tobiah’s instructions to Azariah/Raphael; the Greek witness used here preserves only the opening address in this verse.
    reason: textual_variant
translation:
  language: ko
  text: 토비야가 라파엘을 불러 그에게 말했습니다. “아자리아, 형제여.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라파엘은 토비야와 여행할 때 ‘아자리아’라는 이름으로 자신을 소개했습니다.
    reason: cross_reference
  - marker: b
    text: 그리스어 본문은 이 절에서 이 호칭만 보존하지만, 더 긴 셈어 계열 전승은 곧바로 아자리아/라파엘에게 하는 토비야의 지시를 이어 줍니다.
    reason: textual_variant
