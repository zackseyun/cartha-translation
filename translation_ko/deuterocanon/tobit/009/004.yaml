translation:
  language: ko
  text: 그리고 내 아버지는 날들을 세고 계십니다. 내가 오래 지체하면, 아버지는 크게 괴로워하실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀριθμεῖ τὰς ἡμέρας
  english_pob_choice: is counting the days
  chosen_korean: 날들을 세고 계십니다
  alternatives_korean:
  - 날을 헤아리고 계십니다
  - 날들을 계산하고 계십니다
  lexicon: BDAG
  rationale: 현재형의 지속적 동작을 살려, 아버지가 돌아올 날을 계속 세며 기다리는 뉘앙스를 자연스러운 한국어로 옮겼습니다.
- source_word: ἐὰν χρονίσω μέγα
  english_pob_choice: if I delay long
  chosen_korean: 내가 오래 지체하면
  alternatives_korean:
  - 내가 오래 머무르면
  - 내가 너무 오래 지체하면
  - 내가 오래 늦어지면
  lexicon: BDAG
  rationale: 조건절의 미래적 가능성을 살리면서, χρονίσω μέγα의 '오래 지체하다'라는 의미를 현대 한국어로 간명하게 표현했습니다.
- source_word: ὀδυνηθήσεται λίαν
  english_pob_choice: he will be greatly distressed
  chosen_korean: 크게 괴로워하실 것입니다
  alternatives_korean:
  - 몹시 근심하실 것입니다
  - 심히 고통스러워하실 것입니다
  - 크게 마음 아파하실 것입니다
  lexicon: BDAG
  rationale: ὀδυνηθήσεται는 단순한 슬픔보다 더 강한 내적 고통을 가리키므로, '괴로워하다'로 감정의 강도를 보존했습니다.
theological_decisions:
- issue: 부자 사이의 호칭과 공손 표현
  chosen_reading: 직접 화자가 아버지를 언급할 때도 한국어 서술은 합쇼체를 유지하되, 아버지의 상태는 '괴로워하실 것입니다'처럼 높임을 적용했습니다.
  alternative_readings:
  - 평서적 중립 표현으로 낮출 수 있음
  - 전면적으로 구어체화할 수 있음
  rationale: 원문은 감정의 긴박함을 전달하는 서술문이므로, 한국어에서도 문체는 정중하게 유지하되 인물 관계에 맞는 높임을 반영하는 것이 적절합니다.
  doctrine_reference: 문체·화용 결정
