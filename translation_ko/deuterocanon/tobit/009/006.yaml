  source_fidelity: 그리스어의 공동 행위(κοινῶς), 이른 기상(ὤρθρευσαν), 혼인 관련 모임(γάμον), 그리고 토비아스가 아내를 축복한 행위를 대체로 충실히 옮겼습니다. 다만 εὐλόγησεν의 직접목적어 τὴν γυναῖκα αὐτοῦ는 한국어에서도 ‘아내를 축복하였습니다’로 옮겨야 합니다. 현행 ‘아내에게 축복하였습니다’는 목적격 관계를 약화시키고 한국어 문법상도 부자연스럽습니다.
  naturalness: ‘함께 일찍 일어나’와 ‘혼인 잔치’는 자연스럽고 합쇼체 서술로 적절합니다. ‘자기 아내에게 축복하였습니다’는 ‘아내를 축복하였습니다’로 고치면 현대 표준 한국어의 타동사 구문에 맞습니다.
