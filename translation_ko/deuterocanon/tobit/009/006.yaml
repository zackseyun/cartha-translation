lexical_decisions:
- source_word: ὤρθρευσαν
  english_pob_choice: rose early
  chosen_korean: 일찍 일어나
  alternatives_korean:
  - 새벽에 일어나
  - 동틀 녘에 일어나
  lexicon: LSJ
  rationale: 동사 ὤρθρευσαν은 이른 시각에 일어남을 뜻하므로, 한국어에서는 자연스럽게 ‘일찍 일어나’로 옮겨 시간적 뉘앙스를 살렸습니다.
- source_word: κοινῶς
  english_pob_choice: together
  chosen_korean: 함께
  alternatives_korean:
  - 동시에
  - 공동으로
  lexicon: LSJ
  rationale: 두 사람이 함께 행동했다는 뜻이므로, 현대 한국어에서 가장 자연스럽고 간결한 ‘함께’를 선택했습니다.
- source_word: γάμον
  english_pob_choice: the wedding
  chosen_korean: 혼인 잔치
  alternatives_korean:
  - 혼인
  - 결혼식
  - 혼인식
  lexicon: LSJ
  rationale: γάμος는 혼인 자체와 혼인 잔치를 둘 다 가리킬 수 있어, 서사 맥락을 반영하되 의미 범위를 드러내는 ‘혼인 잔치’를 채택했습니다.
- source_word: εὐλόγησεν
  english_pob_choice: blessed
  chosen_korean: 축복하였습니다
  alternatives_korean:
  - 축복했습니다
  - 축복하였습니다
  - 복을 빌었습니다
  lexicon: LSJ
  rationale: 동사의 직접적 의미를 살려 ‘축복하다’로 옮겼고, 라틴/교회 전통의 해석을 덧붙이지 않도록 간단한 서술형으로 처리했습니다.
theological_decisions:
- issue: Τωβείας εὐλόγησεν τὴν γυναῖκα αὐτοῦ의 행위 성격
  chosen_reading: 토비아스가 자기 아내에게 축복을 베풀었다는 단순한 서술로 유지합니다.
  alternative_readings:
  - 혼인예식상 축복문을 선포했다
  - 아내를 위해 기도했다
  rationale: 본문은 축복의 형식이나 내용을 말하지 않으므로, 행위의 존재만 분명히 하고 예식적 세부를 추정하지 않았습니다.
  doctrine_reference: 서술의 절제와 본문 범위 보존
