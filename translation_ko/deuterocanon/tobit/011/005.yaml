translation:
  language: ko
  text: 그리고 안나는 자기 아들을 기다리며 길을 바라보며 앉아 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘길을 바라보며, 그녀의 아들을’이라고 압축하여 표현합니다. 이는 아들의 귀환을 기다리며 길을 바라보았다는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: ἐκάθητο
  english_pob_choice: sat
  chosen_korean: 앉아 있었습니다
  alternatives_korean:
  - 앉아 있었습니다만
  - 앉아 있었습니다/앉아 있었습니다
  lexicon: LSJ
  rationale: 미완료시제의 지속 상태를 살리되, 한국어에서는 단순 과거형보다 ‘앉아 있었습니다’가 자연스럽고 반복적 기다림의 분위기를 담습니다.
- source_word: περιβλεπομένη
  english_pob_choice: watching
  chosen_korean: 바라보고
  alternatives_korean:
  - 둘러보며
  - 살피며
  - 주목하며
  lexicon: LSJ
  rationale: 주변을 무작정 둘러보는 느낌보다, 돌아올 이를 기다리며 길을 응시하는 뜻이 더 강하므로 ‘바라보고’로 옮겼습니다.
- source_word: εἰς τὴν ὁδόν
  english_pob_choice: the road
  chosen_korean: 길을
  alternatives_korean:
  - 도로를
  - 길가를
  - 그 길을
  lexicon: LSJ
  rationale: ὁδός는 여기서 아들이 돌아올 경로를 가리키므로, 현대 한국어의 서사 문맥에 맞는 ‘길’을 택했습니다.
- source_word: τὸν παῖδα αὐτῆς
  english_pob_choice: for her son
  chosen_korean: 자기 아들을
  alternatives_korean:
  - 아들을
  - 자기 아이를
  - 자기 아들인 그를
  lexicon: LSJ
  rationale: παῖς의 의미는 문맥상 성인 아들인 토비아스를 가리키므로 ‘아들’이 가장 분명합니다. 영어 POB의 압축된 의미를 한국어에서는 ‘기다리며’로 풀어 자연스럽게 표현했습니다.
theological_decisions:
- issue: 압축된 그리스어 구문의 관계를 한국어에서 어떻게 풀 것인가
  chosen_reading: ‘길을 바라보고 앉아 있었습니다’로 옮겨, 아들의 귀환을 기다리는 상태를 드러냈습니다.
  alternative_readings:
  - ‘길을 향해 앉아 있었습니다’
  - ‘아들의 길을 바라보며 앉아 있었습니다’
  rationale: 본문은 ‘길’과 ‘그녀의 아들’이 압축되어 연결되어 있으므로, 한국어에서는 기다림의 목적을 자연스럽게 드러내되 의미 확장을 최소화했습니다.
  doctrine_reference: 번역 방법론 / 서사 문맥 보존
