base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/011/001.yaml
  text: After these things[a], Tobiah also went on his way, blessing God because he had made his journey successful, and he kept blessing Raguel and Edna his wife[b]. And he went on until they came near to Nineveh.
  footnotes:
  - marker: a
    text: 'Greek: ''because he prospered his way,'' an idiom meaning that God gave success to his journey.'
    reason: lexical_alternative
  - marker: b
    text: The final clause is awkward in Greek. It likely means 'until they came near to Nineveh'; some could construe it as 'until he came near to Nineveh.'
    reason: textual_variant
translation:
  language: ko
  text: 이 일들 후에 토비아는 하나님을 찬양하며 길을 성공하게 하신 것 때문에 계속 나아갔고, 라구엘과 그의 아내 에드나를 계속 축복했습니다. 그리고 그들은 나아가 니네베에 가까이 이르기까지 갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어의 ‘길을 성공하게 하다’는 관용구로, 하나님이 그의 여행을 형통하게 하셨다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 그리스어가 다소 어색합니다. 문맥상 ‘니네베에 가까이 이르기까지’라는 뜻으로 이해하는 것이 가장 자연스럽습니다.
    reason: textual_variant
