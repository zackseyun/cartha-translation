  terminology: θεός는 ‘하나님’, εὐλογῶν τὸν θεόν은 한국어 관용에 맞게 ‘하나님을 찬양하며’로 유지할 수 있습니다. 사람들에게 მიმართ한 κατευλόγει는 ‘계속 축복했습니다’보다 ‘거듭 복을 빌었습니다’가 자연스럽고 의미상 분명합니다. 인명 표기는 토비아, 라구엘, 에드나, 니네베로 유지합니다.
