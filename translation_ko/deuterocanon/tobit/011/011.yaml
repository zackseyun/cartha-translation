  source_fidelity: 그리스어 χολή는 치료에 쓰인 ‘쓸개즙/담즙’이라는 물질을 가리키는데, 초안의 ‘쓸개’는 한국어에서 주로 기관(담낭)을 뜻하므로 더 정확한 표현으로 고쳐야 합니다. λέγων은 다음 절의 직접 발화를 도입하므로 문장을 종결하지 않고 이어 주는 것이 적절합니다.
  naturalness: ‘물고기의 쓸개즙’을 ‘눈에 바르면서 말했습니다:’라고 하면 현대 표준 한국어로 자연스럽고, 다음 절의 말을 매끄럽게 연결합니다.
  terminology: ‘쓸개즙’은 χολή의 문자적·서사적 의미를 보존하면서 ‘담즙’보다 문맥상 덜 임상적입니다. ‘붙들고’와 ‘바르면서’는 각각 ἐπελάβετο와 προσέπασεν에 충실합니다.
  issues:
  - severity: medium
    issue: ‘쓸개’가 χολή의 물질적 의미를 충분히 드러내지 못합니다.
    rationale: 한국어 ‘쓸개’는 일반적으로 담낭이라는 기관을 뜻하므로, 눈에 바르는 물질인 gall/bile을 나타내는 ‘쓸개즙’이 더 정확합니다.
  - severity: medium
    issue: ‘말했습니다.’가 다음 절로 이어지는 λέγων의 발화를 문장상 종결합니다.
    rationale: 원문은 ‘말하며/말하여 이르되’로 다음 절의 직접 인용을 도입합니다. 콜론을 사용해 문장을 열어 두어야 합니다.
  - severity: low
    issue: ‘발라 주며’의 보조동사 ‘주다’는 원문에 없는 수혜의 뉘앙스를 더합니다.
    rationale: 아버지에게 행한 동작이라는 문맥은 유지하되, ‘바르면서’가 불필요한 추가 뉘앙스 없이 자연스럽습니다.
