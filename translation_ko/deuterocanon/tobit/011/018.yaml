translation:
  language: ko
  text: 그리고 니네베에 있는 그의 모든 형제들에게[a] 기쁨이 있었습니다. 아히카르가 왔고, 그의 사촌 나스바스도[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형제들’은 이 문맥에서 더 넓게는 친족이나 동족을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 본문은 이 절을 ‘그리고 그의 사촌 나스바스도’로 끝내며, 다음 절로 바로 이어집니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο χαρὰ
  english_pob_choice: there was joy
  chosen_korean: 기쁨이 있었습니다
  alternatives_korean:
  - 기쁨이 생겼습니다
  - 기쁨이 있었습니다만
  lexicon: BDAG
  rationale: γίνομαι의 존재·발생 용법을 한국어의 자연스러운 서술로 옮기되, 단순 감정 묘사가 아니라 공동체적 기쁨의 발생을 드러내기 위해 ‘기쁨이 있었습니다’로 처리했습니다.
- source_word: πᾶσι τοῖς ἐν Νινευὴ ἀδελφοῖς αὐτοῦ
  english_pob_choice: for all his brothers in Nineveh
  chosen_korean: 니네베에 있는 그의 모든 형제에게
  alternatives_korean:
  - 니네베에 있는 그의 모든 친족에게
  - 니네베에 있는 그의 모든 가족에게
  lexicon: BDAG
  rationale: dative의 수혜·대상 관계를 ‘~에게’로 살리면서, Greek의 ‘형제들’을 본문에 유지해 가능한 한 원문 형태를 드러냈습니다.
- source_word: παρεγένετο
  english_pob_choice: came
  chosen_korean: 왔습니다
  alternatives_korean:
  - 도착했습니다
  - 나타났습니다
  lexicon: BDAG
  rationale: 서사적 도착 동사로서 가장 평이하고 연속적인 표현인 ‘왔습니다’를 택했습니다.
- source_word: Ἀχιάχαρος
  english_pob_choice: Ahikar
  chosen_korean: 아히카르
  alternatives_korean:
  - 아키아카르
  - 아히아카르
  lexicon: LSJ
  rationale: 토빗서 전승에서 널리 인지되는 고유명사 음역을 따라 한국어 표기를 간결하게 옮겼습니다.
- source_word: Νασβὰς ὁ ἐξάδελφος αὐτοῦ
  english_pob_choice: Nasbas his cousin
  chosen_korean: 그의 사촌 나스바스
  alternatives_korean:
  - 그의 사촌인 나스바스
  - 사촌 나스바스
  lexicon: LSJ
  rationale: ἐξάδελφος를 ‘사촌’으로 정확히 옮기고, 소유 대명사는 한국어 어순에 맞게 앞에 두어 인물 관계를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: ἀδελφοῖς αὐτοῦ의 범위
  chosen_reading: 본문에는 ‘그의 형제들’로 두고, 넓은 친족 의미는 주석 없이 본문을 과장하지 않았습니다.
  alternative_readings:
  - 그의 친족들
  - 그의 가족들
  rationale: 원문은 남성 복수 ‘형제들’을 직접 말하므로 본문에서는 이를 유지하고, 더 넓은 친족 가능성은 해석 확장 없이 그대로 두는 것이 원문 가시성을 높입니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: 토빗 11:18의 문장 종결
  chosen_reading: 그리스어 본문이 ‘그리고 그의 사촌 나스바스’로 끝나는 미완결형을 그대로 반영했습니다.
  alternative_readings:
  - 문장을 다음 절과 매끈하게 이어 완결시키는 번역
  rationale: 현재 증거 본문은 다음 절로 직접 이어지는 형태이므로, 한국어도 문장 종결을 과하게 보충하지 않고 절단된 서술감을 보존했습니다.
  doctrine_reference: 본문비평/문장 구조 보존 원칙
