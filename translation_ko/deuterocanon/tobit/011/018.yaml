  yaml_path: translation/deuterocanon/tobit/011/018.yaml
  text: And there was joy for all his brothers in Nineveh[a]. And Ahikar came, and Nasbas his cousin[b],
  footnotes:
  - marker: a
    text: Or 'his relatives' or 'his kindred'; Greek 'his brothers' can refer more broadly to kin.
