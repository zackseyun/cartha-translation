  chosen_korean: 그의 며느리
  alternatives_korean:
  - 그의 신부
  - 그의 아내
  lexicon: BDAG
  rationale: νύμφη는 문맥에 따라 ‘신부’ 또는 ‘며느리’가 될 수 있으나, 여기서는 아들의 아내인 사라를 가리키므로 ‘며느리’가 가장 정확합니다.
- source_word: εὐλογῶν τὸν θεόν
  english_pob_choice: blessing God
  chosen_korean: 하나님을 찬양하면서
  alternatives_korean:
  - 하나님을 축복하면서
  - 하나님을 송축하면서
  lexicon: BDAG
  rationale: 직역하면 ‘하나님을 축복하면서’이지만 한국어에서 어색하므로, 본문의 경건한 행위를 자연스럽게 드러내는 ‘찬양하면서’로 옮겼습니다.
- source_word: ὅτι ἔβλεψεν
  english_pob_choice: because he could see
  chosen_korean: 그가 보게 된 것을 보고
  alternatives_korean:
  - 그가 볼 수 있게 되었기 때문에
  - 그가 다시 보게 되었기 때문에
  lexicon: BDAG
  rationale: 핵심 의미는 시력이 회복되어 볼 수 있게 된 사실이므로, 그 사실을 문맥적으로 드러내되 과도한 해석을 피하도록 표현했습니다.
theological_decisions:
- issue: τίς/문맥상 인물 식별과 서술의 흐름
  chosen_reading: 토빗이 문 밖으로 나가 며느리를 맞이하는 장면으로 이해했습니다.
  alternative_readings:
  - 그리스어 이름 형태를 따라 토비야로 표기하는 읽기
  rationale: 마지막 절의 놀람은 그가 이제 보게 되었다는 사실과 연결되므로, 서술의 주체는 아들 토비아스가 아니라 눈을 뜬 아버지 토빗입니다.
  doctrine_reference: 원문 우선 원칙과 서사 문맥의 일치
