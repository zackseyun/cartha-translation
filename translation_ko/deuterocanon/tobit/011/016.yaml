  yaml_path: translation/deuterocanon/tobit/011/016.yaml
  text: And Tobit went out to meet his daughter-in-law[a], rejoicing and blessing God, at the gate of Nineveh. And those who saw him walking were amazed[b], because he could see.
  footnotes:
  - marker: a
    text: 'Greek: ''his νύμφη''; this term can mean either ''bride'' or ''daughter-in-law.'' In context it refers to Sarah as Tobit''s daughter-in-law.'
    reason: lexical_alternative
  - marker: b
    text: The Greek name form here is 'Tōbeias,' but the context indicates the elder Tobit, since the crowd marvels that he can now see.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 토비야는 기뻐하며 하나님을 찬양하면서 니느웨 성문으로 그의 며느리를 맞으러 나갔습니다. 그를 보고 걸어가는 사람들은 그가 보게 된 것을 보고 놀랐습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘그의 νύμφη’를 사용하며, 문맥상 ‘신부’보다 ‘며느리’가 맞습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 이름 형태는 ‘토비아스’처럼 보일 수 있지만, 문맥상 눈을 뜬 아버지 토빗을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Τωβείας
  english_pob_choice: Tobit
  chosen_korean: 토빗
  alternatives_korean:
