    rationale: οἱ θεωροῦντες αὐτὸν πορευόμενον은 그가 걸어가는 것을 관찰한 사람들을 뜻합니다.
  - severity: medium
    issue: ‘그가 보게 된 것을 보고’는 원문에 없는 반복 관찰을 더합니다.
    rationale: ὅτι ἔβλεψεν은 사람들이 놀란 이유, 곧 그가 볼 수 있게 되었다는 사실을 나타냅니다.
  - severity: low
