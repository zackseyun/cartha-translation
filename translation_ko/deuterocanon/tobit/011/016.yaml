base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/011/016.yaml
  text: And Tobit went out to meet his daughter-in-law[a], rejoicing and blessing God, at the gate of Nineveh. And those who saw him walking were amazed[b], because he could see.
  footnotes:
  - marker: a
    text: 'Greek: ''his νύμφη''; this term can mean either ''bride'' or ''daughter-in-law.'' In context it refers to Sarah as Tobit''s daughter-in-law.'
    reason: lexical_alternative
  - marker: b
    text: The Greek name form here is 'Tōbeias,' but the context indicates the elder Tobit, since the crowd marvels that he can now see.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 토빗[b]은 기뻐하며 하나님을 찬양하면서 니느웨 성문으로 그의 며느리[a]를 맞이하러 나갔습니다. 그가 걸어가는 것을 본 사람들은 그가 볼 수 있게 되었기 때문에 놀랐습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘그의 νύμφη’를 사용합니다. 이 말은 ‘신부’ 또는 ‘며느리’를 뜻할 수 있으나, 여기서는 문맥상 ‘며느리’를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어의 이름 형태는 ‘토비아스’처럼 보일 수 있습니다. 그러나 사람들이 그가 볼 수 있게 된 것을 놀라워한다는 문맥상, 이는 눈을 뜬 아버지 토빗을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Τωβείας
