  lexicon: 고유명사 전통
  rationale: 그리스어 형태는 Τωβείας이지만, 문맥상 눈을 뜬 아버지 토빗을 가리키므로 인물 오인 없이 한국어 본문에는 토빗으로 옮겼습니다.
- source_word: τῇ νύμφῃ αὐτοῦ
