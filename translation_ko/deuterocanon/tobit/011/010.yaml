    text: 또는 더 문자적으로, “이제부터는 제가 죽을 것입니다.” 이 표현은 소원이 이루어진 뒤 이제 평안히 죽어도 좋다는 뜻의 관용적 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τοῦ νῦν
