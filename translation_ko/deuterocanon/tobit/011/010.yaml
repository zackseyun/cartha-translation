  - 이제 죽어도 되겠습니다
  lexicon: LSJ
  rationale: 문맥상 임박한 예언이 아니라 소원이 이루어진 뒤의 안도와 만족을 나타내므로, 단순 미래형보다 ‘죽을 수 있겠습니다’로 가능·준비 완료의 뉘앙스를 살렸습니다.
- source_word: προσεκόπτεν
  english_pob_choice: stumbled
  chosen_korean: 비틀거렸고
  alternatives_korean:
  - 걸려 넘어졌고
  - 비틀거렸습니다
  lexicon: LSJ
  rationale: 토빗의 시각 장애와 문으로 향하는 동작을 함께 드러내려면 단순한 ‘넘어지다’보다 움직임이 드러나는 ‘비틀거리다’가 더 적절합니다.
theological_decisions:
- issue: ἔκλαυσαν ἀμφότεροι의 정서적 강도
  chosen_reading: ‘두 사람 모두 울었습니다’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 둘 다 눈물을 흘렸습니다
