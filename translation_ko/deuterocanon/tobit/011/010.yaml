  chosen_korean: 비틀거렸고
  alternatives_korean:
  - 걸려 넘어졌고
  - 비틀거렸습니다
  lexicon: LSJ
  rationale: 토빗의 시각 장애와 문으로 향하는 동작을 함께 드러내려면 단순한 ‘넘어지다’보다 움직임이 드러나는 ‘비틀거리다’가 더 적절합니다.
theological_decisions:
- issue: ἔκλαυσαν ἀμφότεροι의 정서적 강도
  chosen_reading: ‘두 사람 모두 울었습니다’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 둘 다 눈물을 흘렸습니다
  - 두 사람은 함께 울었습니다
  rationale: 장면의 환희와 감격을 약화하지 않기 위해, 서술의 간결함과 정서의 중량을 그대로 보존했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: ἀποθανοῦμαι의 관용적 의미
  chosen_reading: 죽음의 예고가 아니라 ‘오랜 소원이 이루어져 이제는 죽어도 좋다’는 감탄으로 읽었습니다.
  alternative_readings:
  - 내가 죽겠습니다
  - 이제 내가 죽을 것입니다
  rationale: 히브리적·헬라적 감탄 관용구의 의미를 따라, 화자의 심리 상태를 드러내는 방식으로 번역해야 본문의 의도가 살아납니다.
  doctrine_reference: Translation philosophy §1, §6
