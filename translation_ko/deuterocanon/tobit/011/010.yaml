  text: “From now on I can die.” And both of them wept. Then Tobit went out toward the door and stumbled[a], but his son ran to him,
  footnotes:
  - marker: a
    text: Or, more literally, “From now on I will die,” an idiom expressing that the speaker's longing has been fulfilled and she is ready to die in peace.
    reason: lexical_alternative
translation:
  language: ko
  text: “이제부터는 내가 죽을 수 있겠습니다.” 그러고는 두 사람 모두 울었습니다. 그때 토빗이 문 쪽으로 나가다가 비틀거렸고[a], 그의 아들이 그에게 달려갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, “이제부터는 내가 죽을 것입니다.” 이 표현은 소원이 이루어진 뒤 이제 평안히 죽을 수 있다는 관용적 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τοῦ νῦν
  english_pob_choice: From now on
  chosen_korean: 이제부터는
  alternatives_korean:
