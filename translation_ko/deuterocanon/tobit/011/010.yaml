  - 이제 죽어도 되겠습니다
  lexicon: LSJ
  rationale: 문맥상 임박한 예언이 아니라 소원이 이루어진 뒤의 안도와 만족을 나타내므로, 단순 미래형보다 ‘죽을 수 있겠습니다’로 가능·준비 완료의 뉘앙스를 살렸습니다.
