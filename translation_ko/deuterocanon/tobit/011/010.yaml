  - 지금부터
  lexicon: LSJ
  rationale: 시간의 출발점을 가리키는 관용적 표현이므로, 한국어에서는 자연스럽게 ‘이제부터는’으로 옮겨 현재 이후의 전환을 분명히 했습니다.
- source_word: ἀποθανοῦμαι
