translation:
  language: ko
  text: “이제는 제가 죽어도 좋겠습니다.” 두 사람은 모두 울었습니다. 그때 토빗이 문 쪽으로 나가다가 비틀거렸고[a], 그의 아들이 그에게 달려갔습니다.
  philosophy: optimal-equivalence
  footnotes:
