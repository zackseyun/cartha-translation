  text: “From now on I can die.” And both of them wept. Then Tobit went out toward the door and stumbled[a], but his son ran to him,
  footnotes:
  - marker: a
    text: Or, more literally, “From now on I will die,” an idiom expressing that the speaker's longing has been fulfilled and she is ready to die in peace.
