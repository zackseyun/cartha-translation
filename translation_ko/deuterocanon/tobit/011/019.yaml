  - 혼인
  - 결혼잔치
  lexicon: LSJ
  rationale: 문맥상 추상적 혼인 관계보다 기쁨과 기간이 강조된 축제성 행사를 가리키므로 ‘혼인잔치’가 가장 분명합니다.
- source_word: μετʼ εὐφροσύνης
