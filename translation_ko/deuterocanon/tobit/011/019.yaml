  rationale: 명사형의 축제적 뉘앙스를 살리면서도 한국어 문장 흐름에 자연스럽게 맞도록 ‘기쁨 가운데’로 옮겼습니다.
- source_word: ἑπτὰ ἡμέρας
  english_pob_choice: for seven days
  chosen_korean: 칠 일 동안
  alternatives_korean:
  - 일곱 날 동안
  - 일곱 날 내내
  lexicon: LSJ
  rationale: 지속 기간을 나타내는 목적격 용법이므로 ‘동안’을 보충해 의미를 명확히 했습니다.
