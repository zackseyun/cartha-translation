  - severity: medium
    issue: ‘그리고 그와 함께 갔던 사람입니다’가 두 번째 인물의 도착을 충분히 표현하지 못합니다.
    rationale: καὶ가 ‘내 아들이 오고 있다’와 ‘그와 함께 갔던 사람’을 병렬로 연결하며, ἔρχεται가 두 번째 명사구에도 적용됩니다. 한국어에서는 ‘사람도 오고 있습니다’로 밝혀 주는 것이 자연스럽고 충실합니다.
