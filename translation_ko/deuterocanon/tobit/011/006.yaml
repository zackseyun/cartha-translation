translation:
  language: ko
  text: 그리고 그녀는 그가 오는 것을 알아채고 그의 아버지에게 말했습니다. “보십시오, 제 아들이 오고 있습니다. 그와 함께 갔던 사람도 오고 있습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 동사는 문자적으로 ‘미리 알아차렸다’ 또는 ‘앞서 알아보았다’로도 옮길 수 있습니다. 여기서는 문맥상 멀리서 다가오는 이를 알아차린 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προενόησεν αὐτὸν ἐρχόμενον
  english_pob_choice: noticed him coming
  chosen_korean: 그가 오는 것을 알아채고
  alternatives_korean:
  - 그를 미리 알아보고
  - 그가 오는 것을 보았고
  - 그를 알아보았고
  lexicon: LSJ; BDAG
  rationale: 이 동사는 여기서 멀리서 다가오는 이를 눈치채고 인지하는 뜻으로 쓰이므로, 단순한 '보다'보다 '알아채다'가 문맥의 지각 의미를 잘 살립니다.
- source_word: Ἰδοὺ
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  - 보라!
  lexicon: BDAG
  rationale: 주의를 끄는 감탄사로서 현대 한국어 합쇼체에서는 '보십시오'가 가장 자연스럽고, 장면의 즉시성을 살립니다.
- source_word: ὁ ἄνθρωπος ὁ πορευθεὶς μετʼ αὐτοῦ
  english_pob_choice: the man who went with him
  chosen_korean: 그와 함께 갔던 사람
  alternatives_korean:
  - 그와 함께 간 남자
  - 그와 동행했던 사람
  lexicon: BDAG
  rationale: 본문은 관계명사보다 일반 명사 ἄνθρωπος를 사용하므로, '사람'으로 옮겨 원문을 유지하되 문맥상 동행자를 가리키는 뜻을 드러냈습니다.
theological_decisions:
- issue: 아나가 멀리서 오는 이를 알아보는 장면의 서술 방식
  chosen_reading: 인지와 식별의 의미를 살려 '알아채고'로 옮겼습니다.
  alternative_readings:
  - 단순히 '보았고'
  - '''미리 알았고'''
  rationale: 본문의 초점은 예지나 예감이 아니라 접근하는 이를 시각적으로 식별하는 데 있으므로, 과도한 신학적 의미를 덧붙이지 않고 서사적 인지로 처리했습니다.
  doctrine_reference: 서사 문맥과 어휘 의미
- issue: 직접화법의 호칭과 보고 형식
  chosen_reading: 아버지에게 보고하는 직접화법을 현대 합쇼체로 유지했습니다.
  alternative_readings:
  - 더 친숙한 구어체로 완화
  - 전통적 성경체로 격상
  rationale: 원문의 서술적 긴박감과 가족 대화의 생생함을 보존하기 위해, 고전적 성경체보다 현대적이되 경어를 유지하는 표현을 선택했습니다.
  doctrine_reference: 문체 일관성
