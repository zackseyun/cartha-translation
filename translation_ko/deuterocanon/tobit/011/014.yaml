translation:
  language: ko
  text: 그리고 그녀는 울며 말했습니다. 「하나님, 주님은 복되십니다. 주님의 이름은 영원히 복되며, 주님의 모든 거룩한 천사들도 복됩니다」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 직역은 ‘세대들 속으로’에 가깝지만, 관용적으로 ‘영원히’를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκλαυσεν
  english_pob_choice: she wept
  chosen_korean: 그녀는 울며
  alternatives_korean:
  - 그녀는 울었습니다
  - 그녀는 울기 시작했습니다
  lexicon: LSJ
  rationale: 문맥상 안나를 가리키므로 여성 대명사를 드러내고, 동사의 단순한 과거 울음을 자연스러운 서술형으로 옮겼습니다.
- source_word: Εὐλογητὸς εἶ ὁ θεός
  english_pob_choice: Blessed are you, O God
  chosen_korean: 하나님, 주님은 복되십니다
  alternatives_korean:
  - 하나님, 주님은 찬양받으십니다
  - 하나님, 주님은 축복받으십니다
  lexicon: LSJ
  rationale: εὐλογητός의 직접적인 축복 공식을 살려 ‘복되십니다’로 옮겼고, 호격의 ὁ θεός는 한국어 자연성에 맞게 앞에 두었습니다.
- source_word: εἰς τοὺς αἰῶνας
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 세세토록
  - 영원까지
  lexicon: LSJ
  rationale: 직역하면 ‘세대들/시대들 속으로’이지만 관용적 의미는 영속성이므로, 한국어로 가장 자연스러운 ‘영원히’를 택했습니다.
- source_word: οἱ ἅγιοι ἄγγελοί σου
  english_pob_choice: your holy angels
  chosen_korean: 주님의 모든 거룩한 천사들
  alternatives_korean:
  - 주님의 거룩한 천사들
  - 주님의 성스러운 천사들
  lexicon: LSJ
  rationale: ἅγιοι는 ἄγγελοι를 직접 수식하므로 ‘거룩한 천사들’이 기본이고, πάντες를 반영해 ‘모든’을 덧붙였습니다. ‘성도’로 분리하면 문법을 흐립니다.
theological_decisions:
- issue: 도복송(축복 송축) 공식을 한국어로 어떻게 보존할지
  chosen_reading: 반말식 감탄이 아니라 하나님께 드리는 송축문으로 보이도록 ‘복되십니다 / 복됩니다’의 선언형을 유지했습니다.
  alternative_readings:
  - 찬양받으십니다
  - 복을 받으소서
  rationale: 본문은 반복되는 εὐλογητ- 어휘로 구성된 축복 선언이므로, 간구문보다 선언문으로 옮겨 예배적·경건한 톤을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; readable modern Korean without flattening theological weight.'
