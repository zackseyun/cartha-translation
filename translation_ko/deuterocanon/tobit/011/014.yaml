  lexicon: LSJ
  rationale: εὐλογητός의 직접적인 축복 공식을 살려 ‘복되십니다’로 옮겼고, 호격의 ὁ θεός는 한국어 자연성에 맞게 앞에 두었습니다.
- source_word: εἰς τοὺς αἰῶνας
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 세세토록
  - 영원까지
  lexicon: LSJ
  rationale: 직역하면 ‘세대들/시대들 속으로’이지만 관용적 의미는 영속성이므로, 한국어로 가장 자연스러운 ‘영원히’를 택했습니다.
- source_word: οἱ ἅγιοι ἄγγελοί σου
  english_pob_choice: your holy angels
  chosen_korean: 주님의 모든 거룩한 천사들
  alternatives_korean:
  - 주님의 거룩한 천사들
  - 주님의 성스러운 천사들
  lexicon: LSJ
  rationale: ἅγιοι는 ἄγγελοι를 직접 수식하므로 ‘거룩한 천사들’이 기본이고, πάντες를 반영해 ‘모든’을 덧붙였습니다. ‘성도’로 분리하면 문법을 흐립니다.
