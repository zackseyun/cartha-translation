  text: And Raphael said[a], “I know that your father will open his eyes.”
  footnotes:
  - marker: a
    text: Or, 'your father will regain his sight.' The Greek literally says, 'will open his eyes,' an idiom for the restoration of sight.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 라파엘이 말했습니다. 「나는 당신의 아버지의 눈이 열릴 것을 압니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어는 문자적으로 ‘그의 눈을 열 것이다’라고 말하며, 문맥상 시력의 회복을 뜻하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ῥαφαήλ
  english_pob_choice: Raphael
  chosen_korean: 라파엘
  alternatives_korean:
  - 라파엘
  lexicon: 고유명사 표기
  rationale: 고유명사는 현대 외래어 표기법에 따라 음역하고, 통용되는 성서 인명 형태를 따랐습니다.
- source_word: Ἐπίσταμαι
  english_pob_choice: I know
  chosen_korean: 나는 … 압니다
  alternatives_korean:
  - 나는 … 알고 있습니다
  - 나는 … 확신합니다
  lexicon: BDAG
  rationale: 지식이나 확신을 나타내는 직설 표현이므로, 과장 없이 ‘압니다’로 옮겨 라파엘의 단정적 진술을 살렸습니다.
- source_word: ἀνοίξει τοὺς ὀφθαλμούς
  english_pob_choice: will open his eyes
  chosen_korean: 눈이 열릴
  alternatives_korean:
  - 눈을 뜰
  - 시력을 회복할
  lexicon: BDAG
  rationale: 그리스어의 ‘눈을 열다’ 관용구를 그대로 살려, 치유의 의미를 드러내되 본문의 표현을 지나치게 풀이하지 않았습니다.
- source_word: ὁ πατήρ σου
  english_pob_choice: your father
  chosen_korean: 당신의 아버지
  alternatives_korean:
  - 네 아버지
  - 그대의 아버지
  lexicon: BDAG
  rationale: 대화체에서 자연스러운 공손한 2인칭 표현을 택해 서술의 흐름을 유지했습니다.
theological_decisions:
- issue: 실명 치유를 가리키는 관용구 보존
  chosen_reading: ‘눈이 열릴’로 직역에 가깝게 유지해 치유의 의미는 문맥에서 읽히게 했습니다.
  alternative_readings:
  - ‘시력을 회복할’
  - ‘눈을 뜰’
  rationale: 본문은 아직 치유의 결과를 관용적으로 말할 뿐이므로, 사전 해석을 앞세운 의역보다 원문 표현을 보존하는 것이 더 적절합니다.
  doctrine_reference: '번역 원칙: 원문 밀착, 관용구 보존'
