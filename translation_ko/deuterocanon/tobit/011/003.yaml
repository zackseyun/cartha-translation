  text: Let us run on ahead of your wife and prepare the house[a].
  footnotes:
  - marker: a
    text: 'Greek: ''your wife.'' Some contextual expectations in the wider story might lead readers to expect reference to another family member, but the extant Greek witness here reads ''your wife,'' and the translation follows that source text.'
