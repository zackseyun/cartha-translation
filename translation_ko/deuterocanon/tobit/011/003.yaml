translation:
  language: ko
  text: 우리가 네 아내보다 앞서 달려가 집을 준비합시다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 ‘네 아내’를 읽습니다. 이야기의 다른 정황과는 다르게 보일 수 있지만, 현존하는 그리스어 증거를 따라 번역했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: προδράμωμεν
  english_pob_choice: Let us run on ahead
  chosen_korean: 우리가 … 앞서 달려가
  alternatives_korean:
  - 우리가 … 앞서 가자
  - 우리가 … 서둘러 가자
  lexicon: LSJ
  rationale: 호소형 접속법의 긴박한 동작감을 살리기 위해 단순한 ‘가다’보다 ‘달려가다’를 택했습니다.
- source_word: ἔμπροσθεν
  english_pob_choice: on ahead
  chosen_korean: 앞서
  alternatives_korean:
  - 앞에서
  - 먼저
  lexicon: LSJ
  rationale: 동사와 결합해 ‘앞서 가다’의 방향성을 자연스럽게 드러냅니다.
- source_word: τῆς γυναικός σου
  english_pob_choice: your wife
  chosen_korean: 네 아내보다
  alternatives_korean:
  - 네 아내 앞에
  - 당신의 아내보다
  lexicon: BDAG
  rationale: γυνή가 관계상 ‘아내’를 뜻하므로, 영어 POB와 같이 혼인 관계를 분명히 하는 표현으로 옮겼습니다.
- source_word: ἑτοιμάσωμεν τὴν οἰκίαν
  english_pob_choice: prepare the house
  chosen_korean: 집을 준비합시다
  alternatives_korean:
  - 집을 마련합시다
  - 집을 정돈합시다
  lexicon: LSJ
  rationale: οἰκία를 물리적 ‘집’으로 보고, 공동 권유형의 ‘준비하다’를 한국어로 자연스럽게 옮겼습니다.
