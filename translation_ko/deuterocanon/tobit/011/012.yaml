translation:
  language: ko
  text: “용기를 내십시오[a], 아버지.” 그러고 나서 그들이 함께 모였을 때[b], 그가 아버지의 눈을 문질렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 Θάρσει는 문자적으로 ‘용기를 내라/내십시오’라는 뜻입니다. ‘힘내십시오’ 또는 ‘담대하십시오’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 συνεδήχθησαν은 ‘함께 모였다’ 또는 ‘만났다’라는 뜻입니다. 이 문맥에서는 그들의 만남 또는 재회를 가리킬 수 있습니다.
    reason: alternative_reading
