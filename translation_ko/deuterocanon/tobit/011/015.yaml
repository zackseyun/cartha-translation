  to: 당신께서 저를 채찍질하시고[a] 저에게 자비를 베푸셨기 때문입니다. 보십시오, 제가 제 아들 토비아스를 봅니다. 그러자 제 아들 토비아스가 기뻐하며 들어와서, 메디아에서 자신에게 일어난 큰 일들을 그의 아버지에게 알렸습니다.
