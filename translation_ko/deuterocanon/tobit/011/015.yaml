  text: because you afflicted me and had mercy on me. Behold[a], I see Tobiah my son. And his son entered rejoicing, and reported to his father the great things that had happened to him in Media.
  footnotes:
  - marker: a
    text: Or 'you afflicted me' or 'you scourged me'; the Greek verb can denote severe striking or chastisement.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신께서 저를 채찍질하시고도 저에게 자비를 베푸셨기 때문입니다. 보십시오, 제가 제 아들 토비아스를 봅니다. 그리고 그의 아들이 기뻐하며 들어와서, 메디아에서 그에게 일어난 큰 일들을 그의 아버지에게 알렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저를 괴롭게 하시고’ / ‘저를 채찍질하시고’. 그리스어 동사는 강한 매질이나 징계를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαστίγωσας
  english_pob_choice: you struck me
  chosen_korean: 저를 채찍질하시고
  alternatives_korean:
  - 저를 치시고
  - 저를 괴롭게 하시고
  - 저를 징계하시고
  lexicon: BDAG
  rationale: 마στιγόω는 문자적으로 ‘채찍질하다’이지만, 본문은 하나님의 직접적 개입과 고난의 체험을 함께 드러내므로 ‘채찍질하시고’가 원문 이미지와 고난의 강도를 가장 잘 살립니다.
- source_word: ἠλέησάς
  english_pob_choice: had mercy on me
  chosen_korean: 저에게 자비를 베푸셨기
  alternatives_korean:
  - 저를 불쌍히 여기셨기
  - 저를 긍휼히 여기셨기
  - 저에게 자비하셨기
  lexicon: BDAG
  rationale: ἐλεέω의 표준적 의미를 살려 ‘자비를 베푸셨기’로 옮겨, 앞의 고난과 뒤의 은혜 사이의 대비를 분명히 했습니다.
- source_word: ἰδοὺ
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  - 여기 보십시오
  lexicon: BDAG
  rationale: 감탄적 지시어의 문어적 긴장감은 유지하되, 현대 한국어 합쇼체에서는 ‘보십시오’가 가장 자연스럽습니다.
- source_word: τὰ μεγάλα τὰ γενόμενα αὐτῷ
  english_pob_choice: the great things that had happened to him
  chosen_korean: 그에게 일어난 큰 일들
  alternatives_korean:
  - 그에게 생긴 큰 일들
  - 그에게 닥친 큰 일들
  - 그에게 일어난 놀라운 일들
  lexicon: BDAG
  rationale: ‘큰 일들’은 τὰ μεγάλα를 너무 해석하지 않으면서도, 뒤의 γενόμενα와 결합된 사건의 중대함을 드러냅니다.
- source_word: ἐν τῇ Μηδείᾳ
  english_pob_choice: in Media
  chosen_korean: 메디아에서
  alternatives_korean:
  - 메디아 땅에서
  - 메대 지방에서
  - 메디아 지역에서
  lexicon: BDAG
  rationale: Μηδεία를 지명으로 자연스럽게 옮겨 본문이 말하는 사건의 장소를 간결하게 제시합니다.
theological_decisions:
- issue: 하나님께 고난과 자비를 동시에 직접 돌리는 표현
  chosen_reading: ‘저를 채찍질하시고도 저에게 자비를 베푸셨기 때문입니다’로 유지하여, 하나님의 징계와 자비가 함께 진술되도록 했습니다.
  alternative_readings:
  - 저를 괴롭게 하시고 저에게 자비를 베푸셨기 때문입니다
  - 저를 징계하시고도 저를 불쌍히 여기셨기 때문입니다
  rationale: 원문은 고난과 자비를 모두 하나님께 직접 귀속합니다. 이를 완화하지 않고 병치해야 본문의 신학적 긴장이 보존됩니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
