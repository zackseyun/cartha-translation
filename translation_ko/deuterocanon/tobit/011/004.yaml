base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/011/004.yaml
  text: But take the fish’s gall in your hand. And they went on, and the dog came along behind them.
  footnotes:
  - marker: a
    text: Or, 'the fish’s bile.' The Greek χολή can denote gall or bile; 'gall' is retained as the main text rendering.
    reason: lexical_alternative
  - marker: b
    text: The parallel Semitic-form tradition for this scene is much fuller and focuses on Tobiah applying the fish’s gall to his father’s eyes; the shorter Greek wording here is followed for the main text.
    reason: alternative_reading
translation:
  language: ko
  text: 물고기의 쓸개즙을 손에 쥐십시오.[a] 그들은 계속 갔고,[b] 개도 그들 뒤를 따라갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘물고기의 담즙’입니다. 그리스어 χολή는 쓸개즙 또는 담즙을 가리킬 수 있으며, 여기서는 치료에 쓰이는 물질을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 이 장면의 평행 셈어계 전승은 더 자세하며, 토비아가 물고기의 쓸개즙을 아버지의 눈에 바르는 일을 전합니다. 본문은 더 짧은 그리스어 본문을 따릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: λάβε
  english_pob_choice: take
  chosen_korean: 잡으십시오
  alternatives_korean:
