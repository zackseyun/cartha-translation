- from: 그러므로 물고기의 쓸개를 손에 잡으십시오. 그리고 그들은 길을 갔고, 개가 그들 뒤를 따라왔습니다.[a][b]
  to: 물고기의 쓸개즙을 손에 쥐십시오.[a] 그들은 계속 갔고,[b] 개도 그들 뒤를 따라갔습니다.
  rationale: 인과 접속사를 제거하여 δέ의 비인과적 서사 연결을 보존했습니다. χολή는 현대 한국어에서 물질 의미가 분명한 ‘쓸개즙’으로 옮기고 ‘담즙’을 각주 대안으로 제시했습니다. 이동과 뒤따름은 원문의 단순한 서사 동작을 유지하도록 다듬었으며, 각주 표지는 각각 해당 어휘와 짧은 그리스어 서술을 명확히 가리키도록 배치했습니다.
