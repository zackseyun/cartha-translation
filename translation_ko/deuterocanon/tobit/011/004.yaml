  lexicon: LSJ
  rationale: χoλή는 ‘쓸개/담즙’ 모두 가능하지만, POB의 ‘gall’에 맞추어 서사적으로도 자연한 ‘쓸개’를 본문에 두었습니다.
- source_word: συνῆλθεν ὀπίσωθεν αὐτῶν
  english_pob_choice: came along behind them
  chosen_korean: 그들 뒤를 따라왔습니다
  alternatives_korean:
