  - 그들 뒤에 함께 갔습니다
  lexicon: BDAG
  rationale: 단순한 ‘뒤따름’의 움직임을 살리면서도 한국어 서술 흐름에 맞게 ‘따라왔습니다’로 옮겼습니다.
theological_decisions:
- issue: 개가 뒤따르는 장면의 서술 방식
  chosen_reading: 문면대로 개의 동행을 단순 사실 서술로 유지했습니다.
  alternative_readings:
  - 상징적 의미를 덧붙이는 해석
  - 서술을 압축해 의미를 약화시키는 번역
  rationale: 이 구절은 치료 행위의 즉각적 전개와 동행 동작을 함께 제시할 뿐이므로, 상징화를 피하고 본문 정보만 전달하는 것이 가장 충실합니다.
  doctrine_reference: 본문 서술의 평이한 역사적 전개를 유지하는 원칙
- issue: 속임말 없이 ‘쓸개’ 유지
  chosen_reading: 의학적·서사적 물질명을 드러내는 ‘쓸개’를 유지했습니다.
  alternative_readings:
  - ‘담즙’으로 순화
  - ‘약재’처럼 일반화
  rationale: 그리스어 χολή의 어휘 범위를 보존해야 하며, 치료 재료라는 구체성이 사라지지 않도록 했습니다.
  doctrine_reference: 원문 어휘 보존과 서사적 구체성
