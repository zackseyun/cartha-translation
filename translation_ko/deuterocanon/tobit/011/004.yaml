  lexicon: BDAG
  rationale: 아오리스트 명령형의 직접 지시를 살리되, 대상이 이미 손에 들 물건이므로 한국어에서는 자연스럽게 ‘잡으십시오’로 옮겼습니다.
- source_word: παρὰ χεῖρα
  english_pob_choice: in your hand
  chosen_korean: 손에
  alternatives_korean:
