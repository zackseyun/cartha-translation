  rationale: 관용구는 여기서 ‘손에 지닌 상태’를 뜻하므로, 과도한 해석 없이 간결하게 ‘손에’로 옮겼습니다.
- source_word: χολὴν τοῦ ἰχθύος
  english_pob_choice: the fish’s gall
  chosen_korean: 물고기의 쓸개
  alternatives_korean:
