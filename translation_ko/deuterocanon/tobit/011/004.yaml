base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/011/004.yaml
  text: But take the fish’s gall in your hand. And they went on, and the dog came along behind them.
  footnotes:
  - marker: a
    text: Or, 'the fish’s bile.' The Greek χολή can denote gall or bile; 'gall' is retained as the main text rendering.
    reason: lexical_alternative
  - marker: b
    text: The parallel Semitic-form tradition for this scene is much fuller and focuses on Tobiah applying the fish’s gall to his father’s eyes; the shorter Greek wording here is followed for the main text.
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 물고기의 쓸개를 손에 잡으십시오. 그리고 그들은 길을 갔고, 개가 그들 뒤를 따라왔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘물고기의 담즙’이다. 그리스어 χολή는 쓸개와 담즙을 모두 가리킬 수 있으나, 본문에서는 치료 재료를 뜻하는 말로 쓰였습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 장면의 평행 전승인 셈어계 자료는 더 자세히, 토비아가 아버지의 눈에 물고기의 쓸개를 바르는 장면을 전합니다. 여기서는 그보다 짧은 그리스어 본문을 따릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: λάβε
  english_pob_choice: take
  chosen_korean: 잡으십시오
  alternatives_korean:
  - 가져가십시오
  - 받으십시오
  lexicon: BDAG
  rationale: 아오리스트 명령형의 직접 지시를 살리되, 대상이 이미 손에 들 물건이므로 한국어에서는 자연스럽게 ‘잡으십시오’로 옮겼습니다.
- source_word: παρὰ χεῖρα
  english_pob_choice: in your hand
  chosen_korean: 손에
  alternatives_korean:
  - 손으로
  - 손 가까이에
  lexicon: LSJ
  rationale: 관용구는 여기서 ‘손에 지닌 상태’를 뜻하므로, 과도한 해석 없이 간결하게 ‘손에’로 옮겼습니다.
- source_word: χολὴν τοῦ ἰχθύος
  english_pob_choice: the fish’s gall
  chosen_korean: 물고기의 쓸개
  alternatives_korean:
  - 물고기의 담즙
  - 물고기의 쓸개즙
  lexicon: LSJ
  rationale: χoλή는 ‘쓸개/담즙’ 모두 가능하지만, POB의 ‘gall’에 맞추어 서사적으로도 자연한 ‘쓸개’를 본문에 두었습니다.
- source_word: συνῆλθεν ὀπίσωθεν αὐτῶν
  english_pob_choice: came along behind them
  chosen_korean: 그들 뒤를 따라왔습니다
  alternatives_korean:
  - 그들 뒤를 따랐습니다
  - 그들 뒤에 함께 갔습니다
  lexicon: BDAG
  rationale: 단순한 ‘뒤따름’의 움직임을 살리면서도 한국어 서술 흐름에 맞게 ‘따라왔습니다’로 옮겼습니다.
theological_decisions:
- issue: 개가 뒤따르는 장면의 서술 방식
  chosen_reading: 문면대로 개의 동행을 단순 사실 서술로 유지했습니다.
  alternative_readings:
  - 상징적 의미를 덧붙이는 해석
  - 서술을 압축해 의미를 약화시키는 번역
  rationale: 이 구절은 치료 행위의 즉각적 전개와 동행 동작을 함께 제시할 뿐이므로, 상징화를 피하고 본문 정보만 전달하는 것이 가장 충실합니다.
  doctrine_reference: 본문 서술의 평이한 역사적 전개를 유지하는 원칙
- issue: 속임말 없이 ‘쓸개’ 유지
  chosen_reading: 의학적·서사적 물질명을 드러내는 ‘쓸개’를 유지했습니다.
  alternative_readings:
  - ‘담즙’으로 순화
  - ‘약재’처럼 일반화
  rationale: 그리스어 χολή의 어휘 범위를 보존해야 하며, 치료 재료라는 구체성이 사라지지 않도록 했습니다.
  doctrine_reference: 원문 어휘 보존과 서사적 구체성
