base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/011/008.yaml
  text: You shall anoint his eyes with the gall[a], and when it stings, he will rub them, and the white films will come away[c][b], and he will see you.
  footnotes:
  - marker: a
    text: Or 'bile.' The Greek word denotes gall/bile, here used as a medicinal substance.
    reason: lexical_alternative
  - marker: b
    text: The Greek says 'when it bites,' using vivid bodily language for the stinging effect on the eyes.
    reason: lexical_alternative
  - marker: c
    text: Or 'the white spots' or 'white patches'; the term refers to whitish eye opacities, not necessarily cataracts in the modern medical sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 눈에 그 쓸개를 바르십시오[a]. 그러면 그것이 따가워서 그가 눈을 비빌 것이며, 하얀 막들이 벗겨져 나가고[b][c], 그가 당신을 보게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘쓸개’는 그리스어 χολή의 기본 뜻을 따른 것이며, 여기서는 약재로 쓰이는 물질을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘물려서/찌여서’에 가깝습니다. 한국어에서는 눈의 자극을 자연스럽게 드러내기 위해 ‘따가워서’로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: λευκώματα는 눈의 희끄무레한 혼탁을 가리키며, 현대 의학의 ‘백내장’으로 단정하지 않았습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγχρισον
  english_pob_choice: anoint
  chosen_korean: 바르십시오
  alternatives_korean:
  - 발라 주십시오
  - 도포하십시오
  - 기름바르십시오
  lexicon: LSJ
  rationale: 눈에 약재를 얹어 문지르는 동작이므로, 한국어에서는 ‘바르다’가 가장 자연스럽고 원문의 직접 지시를 잘 살립니다.
- source_word: χολὴν
  english_pob_choice: gall
  chosen_korean: 쓸개
  alternatives_korean:
  - 담즙
  - 쓸개즙
  - 담낭
  lexicon: LSJ
  rationale: 본문은 약재로 쓰이는 동물의 쓸개 성분을 가리키며, POB의 ‘gall’에 대응하는 간결한 한국어로 ‘쓸개’가 적절합니다.
- source_word: δηχθεὶς
  english_pob_choice: when it bites
  chosen_korean: 따가워서
  alternatives_korean:
  - 찌르듯 아파서
  - 물린 듯해서
  - 자극을 받아서
  lexicon: LSJ
  rationale: 그리스어의 ‘물다/찌르다’ 이미지가 눈의 자극적 통증을 뜻하므로, 한국어에서는 자연스러운 감각 표현인 ‘따가워서’로 옮겼습니다.
- source_word: τὰ λευκώματα
  english_pob_choice: the white films
  chosen_korean: 하얀 막들
  alternatives_korean:
  - 흰 점들
  - 하얀 반점들
  - 백탁막
  lexicon: LSJ
  rationale: 의학적으로 단정한 진단명으로 좁히지 않고, 흰빛의 눈 혼탁을 가리키는 범위를 살리기 위해 ‘하얀 막들’을 택했습니다.
theological_decisions:
- issue: 치유 장면의 묘사 수준
  chosen_reading: 본문이 말하는 절차와 결과만 따라, 약재를 바르고 따가움으로 눈을 비비며 흰 막이 벗겨지고 시력이 회복되는 과정을 그대로 옮겼습니다.
  alternative_readings:
  - 의학적으로 ‘백내장’으로 특정하기
  - ‘눈이 다시 밝아지다’처럼 결과를 보강하기
  rationale: 본문은 치료 결과를 암시하지만 병명을 확정하지는 않으므로, 원문의 관찰 가능한 서술을 넘지 않게 유지했습니다.
  doctrine_reference: 본문의 치유 서술 보존, 과잉 해석 회피
