  lexicon: LSJ
  rationale: 본문은 약재로 쓰이는 동물의 쓸개 성분을 가리키며, POB의 ‘gall’에 대응하는 간결한 한국어로 ‘쓸개’가 적절합니다.
- source_word: δηχθεὶς
  english_pob_choice: when it bites
  chosen_korean: 따가워서
  alternatives_korean:
  - 찌르듯 아파서
  - 물린 듯해서
  - 자극을 받아서
  lexicon: LSJ
  rationale: 그리스어의 ‘물다/찌르다’ 이미지가 눈의 자극적 통증을 뜻하므로, 한국어에서는 자연스러운 감각 표현인 ‘따가워서’로 옮겼습니다.
- source_word: τὰ λευκώματα
  english_pob_choice: the white films
  chosen_korean: 하얀 막들
  alternatives_korean:
  - 흰 점들
  - 하얀 반점들
  - 백탁막
  lexicon: LSJ
  rationale: 의학적으로 단정한 진단명으로 좁히지 않고, 흰빛의 눈 혼탁을 가리키는 범위를 살리기 위해 ‘하얀 막들’을 택했습니다.
theological_decisions:
- issue: 치유 장면의 묘사 수준
  chosen_reading: 본문이 말하는 절차와 결과만 따라, 약재를 바르고 따가움으로 눈을 비비며 흰 막이 벗겨지고 시력이 회복되는 과정을 그대로 옮겼습니다.
  alternative_readings:
  - 의학적으로 ‘백내장’으로 특정하기
  - ‘눈이 다시 밝아지다’처럼 결과를 보강하기
  rationale: 본문은 치료 결과를 암시하지만 병명을 확정하지는 않으므로, 원문의 관찰 가능한 서술을 넘지 않게 유지했습니다.
  doctrine_reference: 본문의 치유 서술 보존, 과잉 해석 회피
