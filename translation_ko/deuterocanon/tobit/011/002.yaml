review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the Greek text's concise question and does not import the Semitic parallel's explicit reference to blindness. However, its Korean direct speech uses 해라체 ("모르느냐?") rather than the required modern formal-polite 합쇼체. The revised wording renders πῶς as the father's implied condition without specifying blindness.
  naturalness: The narration is natural, but "형제여" is a somewhat elevated literary address and the combined wording "네가 어떻게 네 아버지를 떠났는지 모르느냐" is less natural in contemporary Korean, especially because the relevant 'how' concerns the father's condition. A formal-polite question with "어떤 형편에 두고 떠났는지" is clear and idiomatic.
  terminology: 라파엘 and 토비아 appropriately represent Ῥαφαήλ and Τωβείας. "형제여" preserves ἀδελφέ as a literal warm address. The revision uses "당신" solely to sustain the mandated formal-polite register; it does not add a social or theological interpretation.
  issues:
  - severity: medium
    issue: The direct question is in 해라체 rather than the requested modern formal-polite 합쇼체.
    rationale: '"모르느냐?" conflicts with the specified target register. "알고 있지 않습니까?" supplies the required formal-polite style.'
  - severity: low
    issue: The Korean wording does not naturally convey that πῶς concerns the condition in which Tobiah left his father.
    rationale: '"네가 어떻게 네 아버지를 떠났는지" can be read chiefly as the manner of Tobiah''s departure. "아버지를 어떤 형편에 두고 떠났는지" expresses the contextual force of πῶς while leaving the father''s blindness unstated, as in the Greek.'
  revised_text: 라파엘이 토비아에게 말했습니다. “형제여, 당신이 아버지를 어떤 형편에 두고 떠났는지 알고 있지 않습니까?”[a]
