base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/011/002.yaml
  text: And Raphael said to Tobiah[a], “Do you not know, brother, how you left your father?”
  footnotes:
  - marker: a
    text: Or, “Do you not remember in what condition you left your father?” The Semitic parallel tradition makes the father's blindness explicit, but the Greek text states it more briefly.
    reason: lexical_alternative
translation:
  language: ko
  text: 라파엘이 토비아에게 말했습니다. “형제여, 당신이 아버지를 어떤 형편에 두고 떠났는지 알고 있지 않습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “당신이 아버지를 어떻게 떠났는지 알고 있지 않습니까?” 병행 전승은 아버지의 실명을 분명히 하지만, 그리스어 본문은 더 짧게 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ εἶπεν Ῥαφαὴλ πρὸς Τωβείαν
  english_pob_choice: And Raphael said to Tobiah
  chosen_korean: 라파엘이 토비아에게 말했습니다
  alternatives_korean:
  - 그리고 라파엘이 토비아에게 말했습니다
  - 라파엘이 토비아에게 이르렀습니다
  lexicon: 고유명사 및 서술 동사 일반 용례
  rationale: 서술의 단순한 연결과 발화 동사를 자연스러운 현대 한국어로 옮기되, 원문의 직접 화행을 보존했습니다.
- source_word: ἀδελφέ
  english_pob_choice: brother
  chosen_korean: 형제여
  alternatives_korean:
  - 형제님
  - 아우야
  lexicon: BDAG
  rationale: 직역인 ‘형제’의 친밀한 호칭을 유지하면서, 한국어 대화체에서의 부름말 기능을 살리기 위해 호격 ‘-여’를 붙였습니다.
- source_word: Οὐ γινώσκεις
  english_pob_choice: Do you not know
  chosen_korean: 모르느냐
  alternatives_korean:
  - 알지 못하느냐
  - 기억하지 못하느냐
  lexicon: BDAG
  rationale: γινώσκω의 기본 의미는 ‘알다’이므로, 질문형으로 압축해도 자연스러운 ‘모르느냐’를 택했습니다. 이는 원문의 수사적 질문성을 유지합니다.
- source_word: πῶς ἀφῆκες τὸν πατέρα σου
  english_pob_choice: how you left your father
  chosen_korean: 네가 어떻게 네 아버지를 떠났는지
  alternatives_korean:
  - 네 아버지를 어떤 상태로 남겨 두었는지
  - 네 아버지를 떠날 때 어떤 형편이었는지
  lexicon: BDAG
  rationale: πῶς와 ἀφῆκες의 결합을 한국어의 간접의문으로 살려, 원문이 말하는 ‘떠남의 방식/상태’를 보존했습니다. 본문에 없는 ‘실명’은 주석 없이 본문에 넣지 않았습니다.
theological_decisions:
- issue: 아버지의 실명 여부를 본문에 명시할지
  chosen_reading: 본문은 그리스어의 간결한 질문을 따라 ‘어떻게 네 아버지를 떠났는지’로 두고, 실명은 암시로 남겼습니다.
  alternative_readings:
  - ‘네 아버지의 장님 된 형편을’처럼 명시적으로 풀어 쓰기
  rationale: 병행 전통은 아버지의 실명을 분명히 하지만, 주 번역 본문은 Swete의 그리스어를 우선해야 하므로 설명을 본문에 덧붙이지 않았습니다. 이는 원문 우선과 번역의 투명성을 지키기 위한 선택입니다.
  doctrine_reference: 원어 우선 원칙; 병행 전통은 해석 보조로만 사용
