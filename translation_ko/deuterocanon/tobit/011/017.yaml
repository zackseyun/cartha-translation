base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/011/017.yaml
  text: And Tobit gave thanks before them that God had shown them mercy. And when Tobit came near to Sarah his daughter-in-law[a], he blessed her, saying, “May you come in good health, daughter. Blessed is God, who has brought you to us, and your father and your mother.”
  footnotes:
  - marker: a
    text: The Greek text ends abruptly with 'and your father and your mother.' Some readers may understand an implied continuation such as 'and [blessed are] your father and your mother,' but the verb is not stated in this witness.
    reason: alternative_reading
translation:
  language: ko
  text: 토빗은 하나님이 그들에게 자비를 베푸셨다고 그들 앞에서 감사드렸습니다. 그리고 토빗이 자기 며느리 사라에게 가까이 다가가자, 그가 그녀에게 축복하며 말했습니다. 「건강히 오너라, 딸아. 하나님은 복되십니다. 그분은 너를 우리에게 데려오셨고, 그리고 네 아버지와 네 어머니.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 마지막에 ‘그리고 네 아버지와 네 어머니’라는 말을 동사 없이 갑자기 덧붙입니다. 일부 독자는 앞의 ‘하나님은 복되십니다’에 상응하는 말이 생략되었다고 이해할 수 있지만, 이 증언본에는 그러한 동사가 나타나지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξωμολογεῖτο
  english_pob_choice: gave thanks
  chosen_korean: 감사드렸습니다
  alternatives_korean:
  - 고백했습니다
  - 공적으로 찬양했습니다
  lexicon: LSJ
  rationale: 이 문맥에서는 죄의 고백이 아니라 하나님의 자비에 대한 공개적 감사이므로, 한국어에서도 자연스럽고 예배적 뉘앙스가 살아 있는 ‘감사드렸습니다’를 택했습니다.
- source_word: ἠλέησεν αὐτοὺς
  english_pob_choice: had shown them mercy
  chosen_korean: 그들에게 자비를 베푸셨다고
  alternatives_korean:
  - 그들을 불쌍히 여기셨다고
  - 그들에게 긍휼을 베푸셨다고
  lexicon: LSJ
  rationale: ἐλεέω의 자비/긍휼 행위를 그대로 살리되, 하나님의 행위가 이미 이루어진 사실로서 ‘자비를 베푸셨다’고 옮겼습니다.
- source_word: Ἔλθοις ὑγιαίνουσα
  english_pob_choice: May you come in good health
  chosen_korean: 평안히 오너라
  alternatives_korean:
  - 건강하게 오너라
  - 무사히 오너라
  lexicon: LSJ
  rationale: 그리스어는 건강과 안녕을 비는 축복 표현이지만, 한국어에서는 짧은 축복 인사로서 ‘평안히 오너라’가 가장 자연스럽고, 뒤의 호칭 ‘딸아’가 그 친밀함을 보완합니다.
- source_word: εὐλογητὸς ὁ θεός
  english_pob_choice: Blessed is God
  chosen_korean: 하나님은 복되십니다
  alternatives_korean:
  - 하나님을 찬양합니다
  - 하나님은 찬양받으십니다
  lexicon: LSJ
  rationale: 직역의 축복 형식을 유지하면서도 한국어 예배 문맥에 맞게 ‘복되십니다’로 옮겨, ‘찬양합니다’처럼 주어-서술의 구조를 바꾸지 않았습니다.
- source_word: ὃς ἤγαγέν σε πρὸς ἡμᾶς
  english_pob_choice: who has brought you to us
  chosen_korean: 그분은 너를 우리에게 데려오셨고
  alternatives_korean:
  - 그분은 너를 우리에게 이끌어오셨고
  - 그분은 너를 우리 곁으로 인도하셨고
  lexicon: LSJ
  rationale: 사라가 토빗의 가족 안으로 들어오게 된 이동의 결과를 살려 ‘데려오셨고’로 옮겼습니다.
- source_word: τῇ νύμφῃ αὐτοῦ
  english_pob_choice: his daughter-in-law
  chosen_korean: 자기 며느리
  alternatives_korean:
  - 자기 신부
  - 아들의 아내
  lexicon: LSJ
  rationale: 여기서 νύμφη는 토빗의 관점에서 본 관계를 가리키므로, 문맥상 정확한 한국어 친족어인 ‘며느리’가 가장 적절합니다.
theological_decisions:
- issue: 마지막 구절의 급작스러운 종결 유지
  chosen_reading: ‘네 아버지와 네 어머니도 그러하십니다’처럼 본문에 없는 동사를 보태지 않고, 그리스어가 전하는 불완전한 종결을 한국어에서도 가능한 한 보존했습니다.
  alternative_readings:
  - ‘네 아버지와 네 어머니도 복되시기를’처럼 보충해 매끄럽게 읽기
  - 문장을 완전히 재구성해 축복 대상만 명시하기
  rationale: 전승 본문은 마지막에 동사가 생략된 채 끝나므로, 해석을 과도하게 보태기보다 본문의 긴장을 남겨 두는 것이 원문 충실성에 맞습니다.
  doctrine_reference: Translation philosophy §1, §3
