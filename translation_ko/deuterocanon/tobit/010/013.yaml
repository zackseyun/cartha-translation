- source_word: εὐλογῶν τὸν θεόν / κατευλόγει
  english_pob_choice: blessing God / he kept blessing
  chosen_korean: 하나님을 찬송하였고 … 계속 축복하였습니다
  alternatives_korean:
  - 하나님을 축복하였고 … 계속 축복하였습니다
  - 하나님을 찬양하였고 … 계속 축복하였습니다
  lexicon: LSJ
  rationale: εὐλογέω의 기본값을 살리기 위해 동일 어근을 반복하면서도, 한국어에서는 하나님께 ‘축복하다’보다 ‘찬송하다’가 더 자연스럽고 경건한 표현이라 전자는 찬송으로, 후자는 인물들에게 향하는 축복으로 구분했습니다.
- source_word: ὅτι εὐώδωσεν τὴν ὁδὸν αὐτοῦ
  english_pob_choice: because he had made his journey successful
  chosen_korean: 그의 길을 형통하게 하셨으므로
  alternatives_korean:
  - 그의 여행을 성공하게 하셨으므로
  - 그의 길을 번성하게 하셨으므로
  lexicon: LSJ
  rationale: 여행의 성공을 뜻하는 관용구를 직역해도 되지만, 한국어 성경 문맥에서는 ‘길을 형통하게 하다’가 하나님의 섭리적 성공 부여를 가장 분명하게 드러냅니다.
- source_word: Ῥαγουήλ καὶ Ἔδναν τὴν γυναῖκα αὐτοῦ
  english_pob_choice: Raguel and Edna his wife
  chosen_korean: 라구엘과 그의 아내 에드나
  alternatives_korean:
