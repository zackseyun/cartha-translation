  yaml_path: translation/deuterocanon/tobit/010/013.yaml
  text: After these things Tobiah also went on his way[a], blessing God because he had made his journey successful, and he kept blessing Raguel and Edna his wife[b]. And he went on until they came near to Nineveh.
  footnotes:
  - marker: a
    text: 'Greek: ''because he prospered his way,'' an idiom meaning that God granted success to his journey.'
    reason: lexical_alternative
  - marker: b
    text: 'The Greek text here is syntactically awkward, with a plural verb (''they came near'') alongside a singular pronoun (''him''). The translation gives the apparent narrative sense: the travelers came near to Nineveh.'
    reason: textual_variant
translation:
  language: ko
  text: 그 후에 토비아도 길을 떠나, 하나님께서 자기 길을 형통하게 하셨으므로 하나님을 찬송하고, 라구엘과 그의 아내 에드나를 거듭 축복하였습니다. 그리고 그들은 니네베에 가까이 이르기까지 길을 갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 관용구로, 문자적으로는 ‘그의 길을 형통하게 하셨다’는 뜻이며, 여기서는 하나님께서 그의 여행을 성공하게 하셨다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 본문은 ‘그들이 가까이 이르렀다’라는 복수 동사와 ‘그를’이라는 단수 대명사를 함께 사용하여 문법적으로 어색합니다. 번역은 문맥상 여행 일행이 니네베 가까이에 이르렀다는 뜻으로 옮겼습니다.
    reason: textual_variant
lexical_decisions:
- source_word: Μετὰ ταῦτα
  english_pob_choice: After these things
