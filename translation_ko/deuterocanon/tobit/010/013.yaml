  text: After these things Tobiah also went on his way[a], blessing God because he had made his journey successful, and he kept blessing Raguel and Edna his wife[b]. And he went on until they came near to Nineveh.
  footnotes:
  - marker: a
    text: 'Greek: ''because he prospered his way,'' an idiom meaning that God granted success to his journey.'
    reason: lexical_alternative
  - marker: b
    text: 'The Greek text here is syntactically awkward, with a plural verb (''they came near'') alongside a singular pronoun (''him''). The translation gives the apparent narrative sense: the travelers came near to Nineveh.'
    reason: textual_variant
translation:
  language: ko
  text: 이 일들 뒤에 토비아도 길을 가면서, 하나님께서 그의 길을 형통하게 하셨으므로 하나님을 찬송하였고, 라구엘과 그의 아내 에드나에게도 계속 축복하였습니다. 그리고 그들은 니네베에 가까워질 때까지 길을 갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 관용구로, 문자적으로는 ‘그의 길을 번성하게 하셨다’는 뜻이지만 여기서는 여행의 성공을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘그의 아내 에드나’라는 관계를 덧붙여 말합니다.
    reason: source_note
lexical_decisions:
- source_word: Μετὰ ταῦτα
  english_pob_choice: After these things
  chosen_korean: 이 일들 뒤에
  alternatives_korean:
  - 이후에
  - 그 뒤에
  lexicon: LSJ
  rationale: 직전 서술과의 시간적 연결을 자연스럽게 살리되, 복수 지시의 뉘앙스를 유지하기 위해 ‘이 일들 뒤에’로 옮겼습니다.
- source_word: εὐλογῶν τὸν θεόν / κατευλόγει
  english_pob_choice: blessing God / he kept blessing
  chosen_korean: 하나님을 찬송하였고 … 계속 축복하였습니다
  alternatives_korean:
  - 하나님을 축복하였고 … 계속 축복하였습니다
  - 하나님을 찬양하였고 … 계속 축복하였습니다
  lexicon: LSJ
  rationale: εὐλογέω의 기본값을 살리기 위해 동일 어근을 반복하면서도, 한국어에서는 하나님께 ‘축복하다’보다 ‘찬송하다’가 더 자연스럽고 경건한 표현이라 전자는 찬송으로, 후자는 인물들에게 향하는 축복으로 구분했습니다.
- source_word: ὅτι εὐώδωσεν τὴν ὁδὸν αὐτοῦ
  english_pob_choice: because he had made his journey successful
  chosen_korean: 그의 길을 형통하게 하셨으므로
  alternatives_korean:
  - 그의 여행을 성공하게 하셨으므로
  - 그의 길을 번성하게 하셨으므로
  lexicon: LSJ
  rationale: 여행의 성공을 뜻하는 관용구를 직역해도 되지만, 한국어 성경 문맥에서는 ‘길을 형통하게 하다’가 하나님의 섭리적 성공 부여를 가장 분명하게 드러냅니다.
- source_word: Ῥαγουήλ καὶ Ἔδναν τὴν γυναῖκα αὐτοῦ
  english_pob_choice: Raguel and Edna his wife
  chosen_korean: 라구엘과 그의 아내 에드나
  alternatives_korean:
  - 라구엘과 아내 에드나
  - 라구엘과 에드나 그의 아내
  lexicon: LSJ
  rationale: 그리스어의 동격 구조를 한국어의 자연스러운 소유 표현으로 풀어, 에드나가 라구엘의 아내라는 관계를 명확히 했습니다.
- source_word: μέχρις οὗ ἤγγισαν αὐτὸν εἰς Νινευή
  english_pob_choice: until they came near to Nineveh
  chosen_korean: 니네베에 가까워질 때까지 길을 갔습니다
  alternatives_korean:
  - 그들이 니네베에 가까워질 때까지 갔습니다
  - 그가 니네베에 가까워질 때까지 갔습니다
  lexicon: LSJ
  rationale: 원문은 복수 동사와 단수 대명사가 엇갈려 서술이 난삽하므로, POB의 의미 판단을 따라 여행 일행이 니네베 근처에 이르렀다는 서술로 옮겼습니다.
theological_decisions:
- issue: 하나님의 주권적 섭리로서의 여행 성공
  chosen_reading: 토비아의 길의 형통함은 하나님이 주신 성공으로 분명히 진술합니다.
  alternative_readings:
  - 단순히 여행이 잘 풀렸다는 정도로 완화할 수 있습니다.
  - 여정 자체가 잘 진행되었다는 중립적 표현으로 옮길 수 있습니다.
  rationale: 원문은 성공의 원인을 하나님께 돌리므로, 이를 약화하지 않고 섭리적 진술로 유지했습니다.
  doctrine_reference: 창조-섭리적 표현을 보존하는 번역 원칙
