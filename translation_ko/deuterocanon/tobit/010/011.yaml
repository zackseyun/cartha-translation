  yaml_path: translation/deuterocanon/tobit/010/011.yaml
  text: Then Raguel rose and gave him Sarah his wife[a], and half of his possessions—servants and livestock and silver—and after blessing them he sent them away, saying, “May the God of heaven prosper you, children[b], before I die.”
  footnotes:
  - marker: a
    text: Or 'slaves' for 'servants'; the Greek literally says 'bodies' in a list of property.
    reason: lexical_alternative
  - marker: b
    text: Or 'The God of heaven will prosper you'; the Greek uses a future form that can function as a blessing.
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 라구엘은 일어나 그에게 그의 아내 사라를 주고, 자기 재산의 절반, 곧 종들[a]과 가축과 은을 주었습니다. 그리고 그들을 축복한 뒤 떠나보내며 말했습니다. “하늘의 하나님께서 내가 죽기 전에 너희를 잘되게 하시기를[b] 바란다, 자녀들아.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 몸들을 뜻하는 σώματα는 여기서 재산 목록에 포함된 사람들을 가리킵니다. ‘노예들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 미래형입니다. 작별 축복의 문맥에서는 ‘하나님께서 너희를 잘되게 하실 것이다’라는 진술로도, 본문처럼 축원으로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναστὰς
  english_pob_choice: rose
  chosen_korean: 일어나
  alternatives_korean:
  - 일어나서
  - 자리에서 일어나
  lexicon: BDAG
  rationale: 서술 동작을 자연스러운 한국어로 옮기되, 이어지는 행동으로 넘어가는 원래의 연속성을 살리기 위해 간단한 ‘일어나’로 렌더링했습니다.
- source_word: τὰ ἥμισυ τῶν ὑπαρχόντων
  english_pob_choice: half of his possessions
  chosen_korean: 재산의 절반
  alternatives_korean:
  - 소유물의 절반
  - 가지고 있던 것의 절반
  lexicon: BDAG
  rationale: 뒤에 이어지는 목록을 포괄하는 상위 표현으로 ‘재산’이 가장 자연스럽고, ‘절반’이라는 분배의 핵심을 분명히 드러냅니다.
- source_word: σώματα
  english_pob_choice: servants
  chosen_korean: 종들
  alternatives_korean:
  - 종
  - 노예들
  - 사람들
  lexicon: LSJ
  rationale: 본문이 사람을 재산 목록 안에 넣고 있으므로, 한국어에서는 소유 관계를 드러내는 ‘종들’이 가장 직접적입니다. 영어 POB의 ‘servants’보다 더 약하지 않게, 그러나 본문의 명시성을 넘어서지 않도록 했습니다.
- source_word: ἀργύριον
  english_pob_choice: silver
  chosen_korean: 은
  alternatives_korean:
  - 은전
  - 돈
  lexicon: BDAG
  rationale: 헬라어의 구체적 표현을 살려 ‘은’으로 옮겼습니다. 이는 화폐 일반이 아니라 실제 재물 항목으로 제시된 어감을 유지합니다.
- source_word: Εὐοδώσει ὑμᾶς
  english_pob_choice: May ... prosper you
  chosen_korean: 너희를 잘되게 하시기를
  alternatives_korean:
  - 너희를 번성하게 하시기를
  - 너희의 길을 형통하게 하시기를
  - 너희를 번영하게 하시기를
  lexicon: BDAG
  rationale: 미래형이지만 축복문맥에서는 소망/축원으로 기능하므로, 한국어에서도 명령이 아닌 축원형 ‘-하시기를’로 옮겼습니다. ‘잘되다’는 장면 전체의 일반적 성공과 안전을 포괄합니다.
- source_word: ὁ θεὸς τοῦ οὐρανοῦ
  english_pob_choice: the God of heaven
  chosen_korean: 하늘의 하나님
  alternatives_korean:
  - 하늘 하나님
  - 하늘에 계신 하나님
  lexicon: BDAG
  rationale: 유대적 경칭을 살리되 한국어에서 가장 자연스럽고 경외적인 형태로 옮겼습니다. ‘하늘에 계신’은 설명적이어서 원문의 간결성을 약간 늘립니다.
theological_decisions:
- issue: Εὐοδώσει ὑμᾶς의 발화 기능
  chosen_reading: 예언적 선언보다 축복/축원으로 읽고 ‘너희를 잘되게 하시기를’로 번역했습니다.
  alternative_readings:
  - ‘하늘의 하나님께서 너희를 잘되게 하십니다’라는 직설형
  - ‘하늘의 하나님께서 너희를 잘되게 하실 것입니다’라는 미래 예고형
  rationale: 문맥이 작별 축복이므로 한국어에서는 소망을 담은 축원형이 가장 적절합니다. 이는 내용의 강도를 약화하지 않으면서 발화 행위를 정확히 드러냅니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: σώματα의 사회적 함의
  chosen_reading: 재산 목록 안의 사람들을 ‘종들’로 옮겨, 소유 관계를 숨기지 않았습니다.
  alternative_readings:
  - ‘하인들’
  - ‘노예들’
  rationale: 본문은 인간을 소유물 항목으로 세고 있어 그 긴장을 지워서는 안 됩니다. 다만 δοῦλοι가 아니라 σώματα이므로, 본문 근거를 넘는 강한 법적 용어 ‘노예들’은 본문 본문성보다 해석성을 더 크게 만들 수 있습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 5
