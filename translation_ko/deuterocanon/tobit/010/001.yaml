    rationale: 원문은 ‘날마다’를 목적어처럼 두어 날짜의 경과를 헤아렸다는 뜻입니다. 불필요하고 불명확한 대명사는 삭제하고 ‘날수를 헤아리다’로 명시하는 것이 정확합니다.
