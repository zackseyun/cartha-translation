    rationale: 본문을 ‘돌아오지 않았습니다’로만 옮기면 계속된 미도착의 뉘앙스가 줄어듭니다. ‘돌아오지 않고 있었습니다’로 옮기고 해당 절에 각주를 붙입니다.
  - severity: low
    issue: 각주 표지가 문장 끝에 함께 붙어 있어 각각의 설명 대상이 분명하지 않습니다.
