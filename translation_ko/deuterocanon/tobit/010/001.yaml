base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/010/001.yaml
  text: And Tobit his father counted each day[a]; and when the days of the journey were completed and they were not coming back[b],
  footnotes:
  - marker: a
    text: Or, 'they were not coming.' The Greek imperfect can denote that they had still not arrived after the expected time for the journey had passed; in context this implies not returning home on schedule.
    reason: lexical_alternative
  - marker: b
    text: The Semitic parallel tradition expands the scene by mentioning counting both days and nights and the parents' distress, but the main translation here follows the shorter Greek wording of the primary source.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그의 아버지 토빗은 날마다 그것을 세어 보았고, 여행 기간의 날들이 다 채워졌는데도 그들이 돌아오지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 미완료형은 ‘돌아오지 않았다’보다 ‘아직 오지 않았다/오고 있지 않았다’는 지속 뉘앙스를 담을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 세미틱 병행 전승은 날과 밤까지 세고 부모의 근심을 덧붙이지만, 본문 번역은 주된 그리스어 본문의 간결한 표현을 따릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλογίζετο
  english_pob_choice: counted
  chosen_korean: 세어 보았고
  alternatives_korean:
  - 헤아렸고
  - 계산했고
  - 생각했고
  lexicon: BDAG
  rationale: 이 문맥에서는 추상적 숙고보다 귀환 시기를 기다리며 날짜를 세는 구체적 의미가 더 분명하므로, ‘세어 보았고’로 옮겼습니다.
- source_word: ἑκάστης ἡμέρας
  english_pob_choice: each day
  chosen_korean: 날마다
  alternatives_korean:
  - 매일
  - 각 날마다
  - 하루하루
  lexicon: LSJ
  rationale: 분배적 시간 표현을 자연스럽게 살리되, 서술 흐름에 맞게 간결한 한국어로 처리했습니다.
- source_word: ἐπληρώθησαν αἱ ἡμέραι τῆς πορείας
  english_pob_choice: were completed / the days of the journey
  chosen_korean: 여행 기간의 날들이 다 채워졌는데도
  alternatives_korean:
  - 여행의 날들이 다하였는데도
  - 여행 기간이 끝났는데도
  - 여행의 날들이 차 있었는데도
  lexicon: BDAG; LSJ
  rationale: ‘채워지다’는 시간의 충만/경과를 비교적 직접적으로 반영하며, ‘여행 기간의 날들’이라는 기간 표지를 유지합니다.
- source_word: οὐκ ἤρχοντο
  english_pob_choice: they were not coming back
  chosen_korean: 그들이 돌아오지 않았습니다
  alternatives_korean:
  - 그들이 오지 않았습니다
  - 그들은 아직 오지 않았습니다
  - 그들이 돌아오고 있지 않았습니다
  lexicon: BDAG
  rationale: 집에 있는 토빗의 시점에서 방향성을 분명히 하기 위해 ‘돌아오다’를 택했고, 미완료의 지속 뉘앙스는 문맥상 한국어 과거 부정으로 충분히 전달됩니다.
