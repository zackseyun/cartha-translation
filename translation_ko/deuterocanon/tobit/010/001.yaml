    text: וטובי ואשתו מחשבים את הימים ואת הלילות וכואבים על אשר שלחוהו ובוכים ומתענים עליו וטובי מנחם את חנה אשתו לאמר החרישי כי בשלום יבא ובשמחה ותמאן להתנחם ותצא אל הדרכים בכל יום לראות אם יבא בנה ולא טעמה מאומה כי אם דמעות ימים ולילות ויהי כאשר תמו ארבעה עשר ימי החפה ויאמר טוביה אל רעואל שלחני כי אבי ואמי מחשבים את הימים ואינם חושבים [לראותי] ויאמר רעואל שבה עוד עמדי ואשלח להגיד לאביך את כל אשר עשית ויאמר טוביה אל תאחר אותי שלחני ואלכה אל אבי.
