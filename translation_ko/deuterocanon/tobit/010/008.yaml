  yaml_path: translation/deuterocanon/tobit/010/008.yaml
  text: Then Tobias said to Raguel[a], “Send me away, because my father and my mother no longer expect to see me.”
  footnotes:
  - marker: a
    text: Or, 'no longer hope to see me.' The Greek verb can denote either expectation or hope; 'expect' was chosen for natural English in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 토비아스가 라구엘에게 말했습니다. 「저를 보내 주십시오. 제 아버지와 어머니는 더 이상 저를 보리라고 기대하지 않습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 「더 이상 저를 보리라고 희망하지 않습니다」. 그리스어 동사 ἐλπίζω는 여기서 ‘기대하다’와 ‘희망하다’의 의미를 모두 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: LXX Greek
  rationale: δέ의 가벼운 연결과 이야기의 진행을 자연스럽게 살리되, 앞뒤 대비를 과장하지 않기 위해 「그러자」를 택했습니다.
- source_word: Τωβείας
  english_pob_choice: Tobias
  chosen_korean: 토비아스
  alternatives_korean:
  - 토빗
  - 토비아
  lexicon: Greek proper name
  rationale: 그리스어 인명 Τωβείας를 현대 외래어 표기법에 따라 옮겼습니다.
- source_word: Ἐξαπόστειλόν με
  english_pob_choice: Send me away
  chosen_korean: 저를 보내 주십시오
  alternatives_korean:
  - 저를 보내십시오
  - 저를 떠나게 해 주십시오
  - 저를 보내 주세요
  lexicon: LSJ
  rationale: 보내 달라는 직접 요청을 살리면서, 라구엘의 허락을 구하는 뉘앙스를 한국어로 자연스럽게 표현했습니다.
- source_word: ὁ πατήρ μου καὶ ἡ μήτηρ μου
  english_pob_choice: my father and my mother
  chosen_korean: 제 아버지와 어머니
  alternatives_korean:
  - 제 부모님
  - 아버지와 어머니
  lexicon: LSJ
  rationale: 두 사람을 각각 분명히 지칭하는 원문을 따라 「부모님」으로 줄이지 않고 풀어서 옮겼습니다.
- source_word: ἐλπίζουσιν ὄψεσθαί με
  english_pob_choice: no longer expect to see me
  chosen_korean: 더 이상 저를 보리라고 기대하지 않습니다
  alternatives_korean:
  - 더 이상 저를 볼 희망이 없습니다
  - 더 이상 저를 보기를 바라지 않습니다
  lexicon: LSJ
  rationale: ἐλπίζω의 ‘기대하다/희망하다’의 중첩 의미를 유지하되, 여기서는 보기를 기대하는 뜻이 자연스럽게 드러나도록 옮겼습니다.
theological_decisions:
- issue: 부모의 감정 상태를 나타내는 ἐλπίζουσιν의 번역 범위
  chosen_reading: 「기대하지 않습니다」로 번역해, 단순한 감정적 희망보다 ‘다시 보게 될 현실적 전망’을 잃은 상태를 드러냈습니다.
  alternative_readings:
  - 「희망하지 않습니다」
  - 「기다리지 않습니다」
  rationale: 영어 POB가 context상 expect를 선택한 이유를 따르되, 한국어에서도 문맥상 ‘다시 만날 기대의 상실’을 분명히 드러내는 표현이 가장 균형적입니다.
  doctrine_reference: 번역학적 판단; 신학 교리 쟁점 없음
