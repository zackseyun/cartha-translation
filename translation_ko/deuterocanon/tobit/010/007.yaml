base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/010/007.yaml
  text: And she said to him[a], “Be quiet; do not mislead me. My child has perished.” And every day she would go out to the road by which he had departed, and by day she would eat no bread, and at night she did not cease mourning for Tobias her son, until the fourteen days of the wedding feast were completed[b], which Raguel had sworn that he should spend there.
  footnotes:
  - marker: a
    text: Or 'My child is lost.' The Greek ἀπώλετο can express either loss or presumed death; here it reflects the mother's fearful conclusion, not the narrator's confirmation.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the fourteen days of the marriage.' The phrase refers to the wedding celebration period.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그녀에게 말했습니다. “조용히 하시오. 나를 속이지 마시오. 내 아이가 죽었습니다.” 그는 날마다 그가 떠나간 길로 밖에 나가고, 낮에는 빵을 먹지 않았으며, 밤에는 아들 토비아스를 슬퍼하는 일을 그치지 않았습니다. 라구엘이 그를 거기서 지내게 하기로 맹세한 혼인 잔치의 열네 날이 끝날 때까지 그렇게 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 아이가 잃어버렸습니다.’ 그리스어 ἀπώλετο는 ‘잃다’와 ‘죽다’의 뜻을 모두 가질 수 있으나, 여기서는 어머니의 두려운 판단을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘혼인의 열네 날’입니다. 여기서는 혼인 자체가 아니라 혼인 잔치 기간을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σίγα
  english_pob_choice: Be quiet
  chosen_korean: 조용히 하시오
  alternatives_korean:
  - 잠잠하시오
  - 입 다무시오
  - 조용하십시오
  lexicon: LSJ
  rationale: 짧고 급한 금지 명령을 현대 한국어 합쇼체로 자연스럽게 옮기면서, 무례하되 즉흥적인 감정도 살렸습니다.
- source_word: μὴ πλάνα με
  english_pob_choice: do not mislead me
  chosen_korean: 나를 속이지 마시오
  alternatives_korean:
  - 나를 오도하지 마시오
  - 나를 현혹하지 마시오
  - 나를 잘못 인도하지 마시오
  lexicon: LSJ
  rationale: 문맥상 아들을 잃었다는 두려움 속에서 남편의 말을 믿지 않겠다는 뜻이므로, ‘속이다’가 가장 직접적으로 대응합니다.
- source_word: ἀπώλετο τὸ παιδίον μου
  english_pob_choice: My child has perished
  chosen_korean: 내 아이가 죽었습니다
  alternatives_korean:
  - 내 아이가 없어졌습니다
  - 내 아이가 잃어버려졌습니다
  - 내 아이가 멸망했습니다
  lexicon: LSJ
  rationale: ἀπώλετο는 ‘잃다/죽다’의 여지를 갖지만, 여기서는 어머니의 절망적 판단을 한국어로 가장 분명하게 드러내는 표현이 필요합니다.
- source_word: ἡμέρας τε ἄρτον οὐκ ἤσθιεν
  english_pob_choice: by day she would eat no bread
  chosen_korean: 낮에는 빵을 먹지 않았으며
  alternatives_korean:
  - 낮에는 음식을 먹지 않았으며
  - 낮에는 떡을 먹지 않았으며
  - 낮에는 먹을 것을 입에 대지 않았으며
  lexicon: LSJ
  rationale: ‘빵’은 원문의 구체적 이미지를 유지하며, 금식에 가까운 애도의 절제를 자연스럽게 보여 줍니다.
- source_word: οὐ διέλιμπανεν θρηνοῦσα
  english_pob_choice: she did not cease mourning
  chosen_korean: 슬퍼하는 일을 그치지 않았습니다
  alternatives_korean:
  - 애곡하기를 멈추지 않았습니다
  - 애도하는 일을 그치지 않았습니다
  - 계속 통곡했습니다
  lexicon: LSJ
  rationale: 지속적이고 끊이지 않는 행위를 나타내는 imperfect를 한국어에서 가장 무리 없이 살리기 위해 ‘그치지 않았다’로 옮겼습니다.
- source_word: αἱ δέκα τέσσαρες ἡμέραι τοῦ γάμου
  english_pob_choice: the fourteen days of the wedding feast
  chosen_korean: 혼인 잔치의 열네 날
  alternatives_korean:
  - 결혼식의 열네 날
  - 혼인 기간의 열네 날
  - 결혼 잔치의 두 주간
  lexicon: LSJ
  rationale: 문맥상 단순한 법적 혼인 상태가 아니라 잔치 기간을 가리키므로, ‘혼인 잔치’가 의미를 가장 잘 드러냅니다.
- source_word: ἃς ὤμοσεν Ῥαγουὴλ ποιῆσαι αὐτὸν ἐκεῖ
  english_pob_choice: which Raguel had sworn that he should spend there
  chosen_korean: 라구엘이 그를 거기서 지내게 하기로 맹세한
  alternatives_korean:
  - 라구엘이 그를 거기 머물게 하기로 맹세한
  - 라구엘이 그곳에 머물도록 맹세한
  - 라구엘이 그곳에서 그가 보내도록 맹세한
  lexicon: LSJ
  rationale: 그리스어의 압축된 구조를 한국어에서 자연스럽게 풀어, 라구엘의 서약이 ‘거기서 지내게 하는 것’임을 드러냈습니다.
theological_decisions:
- issue: 아들의 상태를 단정하는 표현
  chosen_reading: ‘내 아이가 죽었습니다’로 옮겨, 어머니의 절망적 확신을 직접적으로 드러냈습니다.
  alternative_readings:
  - ‘내 아이가 잃어버렸습니다’
  - ‘내 아이가 없어졌습니다’
  rationale: 본문은 화자의 감정과 인식을 전달하며, 서술자의 객관적 판정을 확정하지 않습니다. 그러나 한국어 독자에게는 장면의 비탄이 선명하게 전달되어야 합니다.
  doctrine_reference: 서사적 화자 시점과 등장인물 발화의 구분
- issue: 혼인 잔치의 의미
  chosen_reading: ‘혼인 잔치’로 옮겨 축제 기간의 의미를 분명히 했습니다.
  alternative_readings:
  - ‘결혼’
  - ‘혼인’
  rationale: 원문의 ἡμέραι τοῦ γάμου는 법적 상태보다 축제·잔치 기간을 가리키므로, 지나치게 추상적인 ‘결혼’보다 서술 맥락에 맞는 표현이 필요합니다.
  doctrine_reference: 본문 맥락에 따른 역사-서사적 의미
