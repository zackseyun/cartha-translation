  text: And he said to his daughter[a], “Honor your parents-in-law; they are now your parents. May I hear a good report about you.” And he kissed her. And Edna said to Tobiah, “Beloved brother, may the Lord of heaven restore you, and may he grant me to see children from you and from Sarah my daughter, so that I may rejoice before the Lord. And look, I entrust my daughter to you as a deposit[b]; do not grieve her.”
  footnotes:
  - marker: a
    text: Or 'I place my daughter in your trust'; the Greek says literally, 'I entrust my daughter to you as a deposit.'
    reason: lexical_alternative
  - marker: b
    text: '''Restore you'' may also carry the sense ''bring you back safely'' in this travel context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 딸에게 말했습니다. “네 시부모를 공경하라. 그들은 이제 네 부모이다. 네가 좋은 소식을 들려주기를 바라노라.” 그리고 그가 그녀에게 입을 맞추었습니다. 에드나는 토비아에게 말했습니다. “사랑하는 형제여, 하늘의 주님께서 당신을 회복시키시고, 제가 당신과 제 딸 사라에게서 난 자녀들을 보게 하셔서 주님 앞에서 기뻐하게 해 주시기를 바랍니다. 보십시오, 나는 내 딸을 당신에게 맡겨 보증물로 드립니다. 그녀를 괴롭히지 마십시오.”[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 '내 딸을 당신의 신탁물로 맡깁니다'; 그리스어는 문자적으로 '보증물로 당신에게 내 딸을 맡깁니다'라고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: '''회복시키시고''는 이 여행 문맥에서 ''안전하게 돌아오게 하시고''라는 뜻을 함께 담을 수 있습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίμα τοὺς πενθερούς σου, αὐτοὶ νῦν γονεῖς σού εἰσιν
  english_pob_choice: Honor your parents-in-law; they are now your parents
  chosen_korean: 네 시부모를 공경하라. 그들은 이제 네 부모이다
  alternatives_korean:
  - 네 장인과 장모를 공경하라
  - 네 시부모를 존중하라
  lexicon: LSJ
  rationale: τίμα의 윤리적·관계적 무게를 살려 '공경하다'로 옮기고, 복수형 τοὺς πενθερούς와 γονεῖς를 자연스럽게 '시부모', '부모'로 집약했습니다.
- source_word: ἀκούσαιμί σου ἀκοὴν καλήν
  english_pob_choice: May I hear a good report about you
  chosen_korean: 네가 좋은 소식을 들려주기를 바라노라
  alternatives_korean:
  - 네 평판이 좋기를 바라노라
  - 네에 대한 좋은 소식을 듣기를 바라노라
  lexicon: LSJ
  rationale: 직역적 '좋은 소식/소문'의 뜻을 살리면서 한국어에서 자연스러운 바람의 표현으로 다듬었습니다.
- source_word: ἀποκαταστήσει σε
  english_pob_choice: restore you
  chosen_korean: 당신을 회복시키시고
  alternatives_korean:
  - 당신을 되돌리시고
  - 당신을 안전히 돌아오게 하시고
  lexicon: LSJ
  rationale: ἀποκαθίστημι의 회복·회복시킴의 의미를 살려 '회복시키다'를 택했으며, 귀환의 뉘앙스는 문맥상 함께 열어 두었습니다.
- source_word: ἐν παρακαταθήκῃ
  english_pob_choice: as a deposit
  chosen_korean: 보증물로 드립니다
  alternatives_korean:
  - 맡긴 물건으로 드립니다
  - 신탁으로 드립니다
  lexicon: LSJ
  rationale: παρακαταθήκη의 '맡겨 둔 것/예탁물' 성격을 한국어에서 법적·신뢰적 뉘앙스를 지닌 '보증물'로 풀어, 단순한 보호 요청보다 강한 위탁을 드러냈습니다.
- source_word: μὴ λυπήσῃς αὐτήν
  english_pob_choice: do not grieve her
  chosen_korean: 그녀를 괴롭히지 마십시오
  alternatives_korean:
  - 그녀를 슬프게 하지 마십시오
  - 그녀에게 근심을 끼치지 마십시오
  lexicon: LSJ
  rationale: λυπέω의 결과 상태인 슬픔을 포함하면서도 한국어 명령으로는 관계적·실천적 압박을 금하는 뜻이 잘 드러나는 표현을 택했습니다.
