translation:
  language: ko
  text: 그가 말했습니다. “혹시 그가 수치를 당했을까요? 아니면 혹시 가바엘이 죽었고, 아무도 그에게 돈을 주지 않는 것일까요?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 “수치를 당했다”입니다. 이 표현은 어떤 굴욕적인 좌절이나 실패를 암시할 수 있지만, 정확한 사정은 본문에 나와 있지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μή ποτε κατῄσχυνται
  english_pob_choice: Could it be that he has been put to shame
  chosen_korean: 그가 수치를 당한 것일까요?
  alternatives_korean:
  - 혹시 그가 지체된 것일까요?
  - 그가 모욕을 당한 것일까요?
  lexicon: LSJ
  rationale: καταισχύνω의 핵심 의미인 ‘수치를 당하다/부끄러움을 겪다’를 살려, POB가 문맥상 추측으로 유지한 긴장감을 한국어 수사 의문문으로 옮겼습니다.
- source_word: ἢ μὴ ποτε ἀπέθανεν Γαβαήλ
  english_pob_choice: Or could it be that Gabael has died
  chosen_korean: 아니면 가바엘이 죽어서
  alternatives_korean:
  - 아니면 가바엘이 죽었을까요
  - 아니면 가바엘이 사망해서
  lexicon: LSJ
  rationale: ἀπέθανεν은 단순히 ‘죽었다’는 뜻이므로, 한국어도 과도한 해석 없이 원문의 불안한 추정을 그대로 살렸습니다.
- source_word: οὐδεὶς δίδωσιν αὐτῷ τὸ ἀργύριον
  english_pob_choice: and no one is giving him the money
  chosen_korean: 아무도 그에게 돈을 주지 않는 것일까요?
  alternatives_korean:
  - 아무도 그에게 은전을 주지 않는 것일까요?
  - 아무도 그에게 은을 돌려주지 않는 것일까요?
  lexicon: LSJ
  rationale: ἀργύριον은 문자적으로 ‘은/돈’이지만, 이 문맥에서는 예치된 금액을 가리키므로 현대 한국어에서는 ‘돈’이 가장 자연스럽습니다.
theological_decisions:
- issue: 수치/지체의 잠재 의미를 어떻게 처리할지
  chosen_reading: ‘수치를 당한 것일까요?’로 직역에 가깝게 두고, 지체나 실패의 함의는 독자가 문맥에서 읽게 했습니다.
  alternative_readings:
  - ‘지체된 것일까요?’
  - ‘어떤 모욕을 당한 것일까요?’
  rationale: 그리스어는 구체 사정을 밝히지 않고 ‘수치를 당함’만 말하므로, POB의 보존 원칙에 따라 원문의 모호성과 긴장감을 유지했습니다.
  doctrine_reference: '번역 원칙: source transparency / lexical tension preservation'
