- from: 그가 말했습니다. “그가 수치를 당한 것일까요? 아니면 가바엘이 죽어서 아무도 그에게 돈을 주지 않는 것일까요?”[a]
  to: 그가 말했습니다. “혹시 그가 수치를 당했을까요? 아니면 혹시 가바엘이 죽었고, 아무도 그에게 돈을 주지 않는 것일까요?”[a]
  rationale: μή ποτε의 염려 섞인 추측을 ‘혹시’로 드러내고, δεύτε 질문에서는 원문의 병렬 접속을 보존하기 위해 인과를 암시하는 ‘-어서’를 ‘-고’로 바꾸었습니다. 각주는 구체적 상황을 확정하거나 지연을 과도하게 암시하지 않도록 중립화했습니다.
