  lexicon: LSJ
  rationale: 서사 문맥이므로 한국어에서는 과거형으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: μὴ λόγον ἔχε의 관용적 완화 여부
  chosen_reading: ‘염려하지 마십시오’로 옮겨, 문자적 구조보다 위로의 기능을 드러냈습니다.
  alternative_readings:
  - ‘말을 가지지 마십시오’로 직역
  - ‘문제를 삼지 마십시오’로 의역
  rationale: 이 표현은 문자적으로는 어색하지만 문맥상 걱정을 가라앉히는 말이므로, 독자가 즉시 이해하도록 하면서도 과도한 해석은 피했습니다.
  doctrine_reference: '번역학적 판단: 관용구의 기능적 등가'
- issue: 토빗의 발화 등록
  chosen_reading: 직접화법 안에서도 공손한 명령형(하십시오체)을 유지했습니다.
  alternative_readings:
  - 반말식 진정 표현
  - 더 친근한 청유형
  rationale: 본문은 가족 간 대화이지만, 한국어 성경 문체의 품위를 유지하면서도 권면의 직접성을 살리기 위해 합쇼체를 택했습니다.
  doctrine_reference: 문체 일관성
