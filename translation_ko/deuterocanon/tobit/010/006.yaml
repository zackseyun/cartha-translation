  text: 토빗이 그녀에게 말했습니다. 「잠잠하십시오. 염려하지 마십시오. 건강하십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘말/일을 가지지 말라’에 가깝지만, 여기서는 아내를 안심시키는 관용적 표현으로 이해하여 ‘염려하지 마십시오’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σίγα
  english_pob_choice: Be quiet
  chosen_korean: 잠잠하십시오
  alternatives_korean:
