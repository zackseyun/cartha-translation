  - 마음 쓰지 마십시오
  - 문제를 삼지 마십시오
  lexicon: LSJ
  rationale: 직역하면 ‘말/일을 가지지 말라’이지만, 문맥상 아내를 달래는 관용구이므로 한국어의 자연스러운 안심 표현으로 옮겼습니다.
- source_word: ὑγίαινε
  english_pob_choice: Be well
  chosen_korean: 건강하십시오
