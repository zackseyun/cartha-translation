  rationale: 어근이 건강·온전함을 가리키므로, 단순한 인사말보다 건강 상태를 직접 살리는 표현을 택했습니다.
- source_word: λέγει αὐτῇ
  english_pob_choice: said to her
  chosen_korean: 그녀에게 말했습니다
  alternatives_korean:
