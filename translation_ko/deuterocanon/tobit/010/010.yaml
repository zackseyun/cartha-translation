lexical_decisions:
- source_word: Τωβείας
  english_pob_choice: Tobias
  chosen_korean: 토비아스
  alternatives_korean:
  - 토비야
  - 토빗의 아들 토비아
  lexicon: LSJ
  rationale: 고유명사는 현대 음역 원칙에 따라 ‘토비아스’로 옮겼습니다. 이 절의 문맥만으로는 별칭형보다 이름형이 더 직접적입니다.
- source_word: λέγει
  english_pob_choice: said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말합니다
  - 말하였습니다
  lexicon: Greek tense/narrative style
  rationale: 그리스어 역사적 현재 λέγει는 서사에서 현재형이지만, 한국어 서술에서는 자연스러운 과거 서술인 ‘말했습니다’가 가장 적절합니다.
- source_word: Ἐξαπόστειλόν με
  english_pob_choice: Send me away
  chosen_korean: 저를 보내 주십시오
  alternatives_korean:
  - 저를 보내십시오
  - 저를 떠나게 해 주십시오
  - 저를 돌려보내 주십시오
  lexicon: BDAG
  rationale: ἐξαποστέλλω는 단순한 ‘가게 하다’보다 ‘보내다/내보내다’의 방향성을 가지므로, 간결하게 ‘보내 주십시오’로 옮겨 청유의 힘을 살렸습니다.
- source_word: πρὸς τὸν πατέρα μου
  english_pob_choice: to my father
  chosen_korean: 제 아버지에게
  alternatives_korean:
  - 제 아버지께
  - 아버지에게
  - 제 아버지에게로
  lexicon: BDAG
  rationale: πρός + 대격은 사람을 향한 이동을 나타내므로 ‘에게/에게로’가 자연스럽습니다. 한국어에서는 ‘에게’가 가장 간결하고 문맥상 충분합니다.
theological_decisions:
- issue: 명령문의 정중한 한국어 처리
  chosen_reading: 직접 화법은 청유·요청으로 ‘보내 주십시오’라고 옮겨, 원문의 간청/요청의 뉘앙스를 살렸습니다.
  alternative_readings:
  - 보내십시오
  - 가게 해 주십시오
  rationale: 이 절은 예의 있는 요청이며, 한국어 합쇼체에서 ‘-아/어 주십시오’가 상대의 배려를 구하는 뉘앙스를 가장 잘 전달합니다.
  doctrine_reference: 서사 대화의 화행 보존
