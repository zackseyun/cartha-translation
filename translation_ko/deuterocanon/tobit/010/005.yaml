lexical_decisions:
- source_word: Οὐ μέλει μοι
  english_pob_choice: Do I not care
  chosen_korean: “내게는 아무 상관이 없느냐”
  alternatives_korean:
  - “내가 걱정하지 않느냐”
  - “내가 개의치 않느냐”
  lexicon: BDAG
  rationale: μέλει μοι는 단순한 정보 진술보다 ‘마음에 걸리다/상관하다’의 뉘앙스를 가지므로, 수사적 질문으로 처리해 아버지의 깊은 동요를 살렸습니다.
- source_word: τέκνον
  english_pob_choice: child
  chosen_korean: “내 자식아”
  alternatives_korean:
  - “아이야”
  - “내 아들아”
  lexicon: BDAG
  rationale: τέκνον의 친밀한 호칭을 살리면서도, 문맥상 아버지의 애틋함이 강하므로 한국어에서는 직접적 애정 호칭인 ‘내 자식아’가 가장 자연스럽습니다.
- source_word: ἀφῆκά σε
  english_pob_choice: I have let you go
  chosen_korean: “너를 놓아주었는데”
  alternatives_korean:
  - “너를 보냈는데”
  - “너를 떠나보냈는데”
  lexicon: BDAG
  rationale: ἀφίημι의 ‘떠나게 하다/놓아주다’ 의미를 반영하여, 완결된 행위가 현재의 정서적 결과를 낳는 흐름을 한국어 완료형으로 옮겼습니다.
- source_word: τὸ φῶς τῶν ὀφθαλμῶν μου
  english_pob_choice: the light of my eyes
  chosen_korean: “내 눈의 빛이던 너”
  alternatives_korean:
  - “내 눈의 빛”
  - “내 눈에 빛이던 너”
  lexicon: BDAG
  rationale: 직역하면 ‘내 눈의 빛’이지만, 한국어에서는 대상이 곧 사람임을 분명히 하면서도 은유를 보존하기 위해 ‘너’를 유지했습니다. 예의의 강조보다는 상실감이 핵심이므로 의역을 최소화했습니다.
