translation:
  language: ko
  text: 그러자 그의 아내가 그에게 말했습니다. 「아이가 죽어 버렸습니다. 그가 너무 오래 지체했기 때문입니다.」 그리고 그녀는 그를 두고 애곡하기 시작하며 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘그를 두고, 그를’처럼 대상을 반복합니다. 한국어에서는 의미상 한 번만 옮겼습니다.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀπώλετο
  english_pob_choice: has perished
  chosen_korean: 죽어 버렸습니다
  alternatives_korean:
  - 망했습니다
  - 사라졌습니다
  - 멸망했습니다
  lexicon: LSJ
  rationale: 여기서는 아이가 이미 죽었다고 여기는 아내의 절망적 판단이므로, 단순한 ‘잃다’보다 강한 소멸·사망의 뜻을 드러내는 표현이 필요합니다. 한국어에서는 자연스럽고도 비극의 강도를 살리는 ‘죽어 버렸습니다’가 적절합니다.
- source_word: τὸ παιδίον
  english_pob_choice: the child
  chosen_korean: 아이가
  alternatives_korean:
  - 어린아이가
  - 그 아이가
  - 그 아들이
  lexicon: LSJ
  rationale: παιδίον은 문자적으로 ‘아이/어린아이’이므로 본문을 지나치게 특정하지 않되, 문맥상 아들을 가리킨다는 점은 한국어 독자가 자연스럽게 이해할 수 있도록 ‘아이가’로 옮겼습니다.
- source_word: κεχρόνικεν
  english_pob_choice: has delayed
  chosen_korean: 너무 오래 지체했기 때문입니다
  alternatives_korean:
  - 오래 머물렀기 때문입니다
  - 너무 오래 머뭇거렸기 때문입니다
  - 지체했기 때문입니다
  lexicon: LSJ
  rationale: perfect형 χρονίζω는 ‘오래 지체하다/늦어지다’의 상태를 나타내므로, 단순 과거보다 결과 상태를 드러내는 ‘너무 오래 지체했습니다’ 계열이 적절합니다. 여기서는 죽음으로 오해한 이유를 분명히 하기 위해 ‘너무 오래’와 함께 자연스럽게 풀었습니다.
- source_word: ἤρξατο θρηνεῖν
  english_pob_choice: began to mourn
  chosen_korean: 애곡하기 시작하며
  alternatives_korean:
  - 애도하기 시작하며
  - 통곡하기 시작하며
  - 슬퍼하기 시작하며
  lexicon: LSJ
  rationale: θρηνέω는 단순히 슬퍼하다보다 장례적 애통과 울부짖음을 포함하므로, 서술체로는 ‘애곡하다’가 가장 원문에 가깝습니다. 시작을 나타내는 ἤρξατο는 동작의 개시를 살려 ‘-기 시작하며’로 처리했습니다.
theological_decisions:
- issue: 죽은 것으로 여기는 진술의 강도
  chosen_reading: 아이가 실제로 죽었다고 단정하는 아내의 오해를 그대로 드러내는 표현을 택했습니다.
  alternative_readings:
  - 아이가 없어졌습니다
  - 아이가 잃어버렸습니다
  rationale: Ἀπώλετο는 단순 실종보다 훨씬 강한 상실·파멸의 의미를 가지며, 바로 뒤의 애곡이 그 절망적 해석을 뒷받침합니다. 그래서 본문이 전달하는 비극적 오해를 약화시키지 않았습니다.
  doctrine_reference: 본문 맥락상의 서술 선택
