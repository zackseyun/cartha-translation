  naturalness: ‘애곡하기 시작하며 말했습니다’는 두 동작의 연결이 다소 어색합니다. ‘애곡하기 시작하고 말했습니다:’가 현대 한국어의 서술 흐름과 이어지는 다음 발화를 더 자연스럽게 드러냅니다. ‘죽어 버렸습니다’의 보조용언은 원문에 없는 구어적·감정적 뉘앙스를 더하므로 중립적인 ‘죽었습니다’가 적절합니다.
