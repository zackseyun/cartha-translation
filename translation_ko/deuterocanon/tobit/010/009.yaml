translation:
  language: ko
  text: 그의 장인이 그에게 말했습니다. “나와 함께 머물러 있으십시오. 내가 당신 아버지에게 사람들을 보낼 것이며, 그들이[a] 당신에 관한 일을 그에게 알려 줄 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘그들이 당신에 관한 일을 그에게 알려 줄 것입니다’라고 하며, 복수 주어는 보냄을 받은 사람들을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πενθερὸς
  english_pob_choice: his father-in-law
  chosen_korean: 그의 장인
  alternatives_korean:
  - 그의 시아버지
  - 장인어른
  lexicon: LSJ
  rationale: πενθερός는 혼인관계를 가리키는 ‘장인/시아버지’이므로, 현대 한국어에서 자연스럽고 중립적인 ‘장인’으로 옮겼습니다.
- source_word: Μεῖνον παρʼ ἐμοί
  english_pob_choice: Stay with me
  chosen_korean: 나와 함께 머물러 있으십시오
  alternatives_korean:
  - 내게 머무르십시오
  - 나와 함께 있으십시오
  lexicon: BDAG
  rationale: μένω의 명령형과 παρʼ ἐμοί의 결합을 반영해 ‘함께 머물다’의 뜻을 살리되, 공손한 직접 권유로 자연스럽게 다듬었습니다.
- source_word: ἐξαποστελῶ πρὸς τὸν πατέρα σου
  english_pob_choice: I will send word to your father
  chosen_korean: 내가 당신 아버지에게 사람을 보내고
  alternatives_korean:
  - 당신 아버지에게 소식을 전하고
  - 당신 아버지에게 전갈을 보내고
  lexicon: BDAG
  rationale: ἐξαποστέλλω는 여기서 단순 파송보다 ‘메시지/사람을 보내다’의 의미가 강하므로, POB의 해석을 따라 ‘사람을 보내고’로 구체화했습니다.
- source_word: δηλώσουσιν αὐτῷ τὰ κατὰ σέ
  english_pob_choice: they will make known to him the things concerning you
  chosen_korean: 그들은 당신과 관련된 일을 그에게 알려 줄 것입니다
  alternatives_korean:
  - 그들은 당신에 관한 일을 그에게 보고할 것입니다
  - 그들은 당신의 사정을 그에게 알릴 것입니다
  lexicon: BDAG
  rationale: δηλόω의 ‘알리다/밝히다’ 뜻을 반영하면서, τὰ κατὰ σέ의 관용적 표현을 한국어로 자연스럽게 옮겼습니다.
