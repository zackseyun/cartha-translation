  source_fidelity: ‘그의 장인도’의 ‘도’는 단순 접속사 δέ를 ‘또한’의 뜻으로 다소 과도하게 한정합니다. 또한 ἐξαποστελῶ의 목적어는 본문에 명시되지 않았지만, 뒤의 복수 동사 δηλώσουσιν은 보냄을 받은 사람들을 가리키는 것으로 가장 자연스럽습니다. 이를 한국어 본문에서 명시할 경우 주석으로 그 해석적 보충을 밝혀야 합니다.
  naturalness: 합쇼체는 전반적으로 자연스럽습니다. 다만 ‘그러면’은 앞 명령을 조건으로 만드는 뉘앙스가 있어 단순 접속인 κἀγώ보다 강합니다. ‘보낼 것이며’가 원문의 병렬 미래형을 더 충실히 반영합니다.
  terminology: ‘장인’은 πενθερός에 적절하며, ‘당신’은 직접 발화 안에서 현대 한국어의 정중한 호칭으로 일관됩니다. τὰ κατὰ σέ는 ‘당신에 관한 일’로 옮겨 불필요하게 한정하지 않았습니다.
