  text: Then his father-in-law said to him[a], “Stay with me, and I will send word to your father, and they will make known to him the things concerning you.”
  footnotes:
  - marker: a
    text: Greek literally, 'they will make known to him the things concerning you.' The plural 'they will report' likely refers indefinitely to those sent with the message.
