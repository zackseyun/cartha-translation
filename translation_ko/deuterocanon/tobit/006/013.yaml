  lexicon: BDAG ἀκούω
  rationale: 단순한 청각이 아니라 주의 깊은 수용을 뜻하므로, 직접호소의 강도를 살린 표현으로 옮겼습니다.
- source_word: ποιήσωμεν τὸν γάμον
  english_pob_choice: we will arrange the marriage
  chosen_korean: 혼인을 치르겠습니다
