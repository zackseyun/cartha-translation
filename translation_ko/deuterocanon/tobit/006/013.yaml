  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ποιήσωμεν τὸν γάμον은 단순히 혼인 예식을 ‘치르다’보다 혼인을 성사시키거나 마련하자는 뜻을 포함하며, ὀφειλέσει θάνατον은 현재의 의무 표현인 ‘져야 합니다’보다 미래의 법적 귀결로 옮기는 편이 원문에 가깝습니다.
