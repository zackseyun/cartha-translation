  - 혼인 준비를 하겠습니다
  lexicon: BDAG γάμος
  rationale: 직역하면 ‘혼인을 하다/만들다’의 관용구라서, 결혼 절차를 진행한다는 뜻을 자연스럽게 살렸습니다.
- source_word: κατὰ τὸν νόμον Μωυσῆ
  english_pob_choice: contrary to the law of Moses
  chosen_korean: 모세의 율법에 어긋나게
  alternatives_korean:
  - 모세의 율법을 거슬러
  - 모세의 율법에 따라
  lexicon: BDAG νόμος
  rationale: 문맥상 ‘따라서’가 아니라 위반의 의미이므로, 법적 충돌을 분명히 드러냈습니다.
- source_word: ὀφειλέσει θάνατον
  english_pob_choice: he will incur death
  chosen_korean: 죽음의 책임을 져야 합니다
  alternatives_korean:
  - 죽음의 벌을 받아야 합니다
  - 사형의 책임을 져야 합니다
  lexicon: BDAG ὀφείλω
  rationale: 그리스어 관용은 죽음에 대한 법적 책임/의무를 나타내므로, 형벌의 책임을 지는 의미로 옮겼습니다.
- source_word: τὴν κληρονομίαν
  english_pob_choice: the inheritance
  chosen_korean: 그 상속
  alternatives_korean:
  - 그 유산
  - 그 재산
  lexicon: BDAG κληρονομία
  rationale: 재산권과 상속권이 함께 걸린 표현이라, 문맥의 권리성을 살리면서도 과도한 해석을 피했습니다.
- source_word: ἢ πάντα ἄνθρωπον
  english_pob_choice: rather than any other man
  chosen_korean: 어떤 다른 사람보다
  alternatives_korean:
  - 어느 누구보다
  - 다른 어떤 남자보다
  lexicon: BDAG ἄνθρωπος
  rationale: 어색한 직역보다, 토빗이 토비아에게 우선권이 있음을 드러내는 비교 의미를 자연스럽게 전달했습니다.
theological_decisions:
- issue: 모세 율법 위반과 죽음 책임의 연결
  chosen_reading: 라구엘이 다른 남자에게 주면 율법을 어기는 것이고, 그 결과 죽음의 책임을 져야 한다는 법적 경고로 읽었습니다.
  alternative_readings:
  - 단순히 모세의 율법에 따라 주지 않을 것이라는 뜻
  - 라구엘이 자의로 판단하여 다른 혼인을 막는다는 뜻
  rationale: 뒤이은 ‘죽음’ 진술이 있어, 율법 준수가 아니라 위반과 책임의 관계가 핵심입니다. 따라서 문맥이 요구하는 법적 긴장을 드러냈습니다.
  doctrine_reference: '번역 원칙: 원문 우선, 문맥이 드러내는 법적 함의를 보존'
