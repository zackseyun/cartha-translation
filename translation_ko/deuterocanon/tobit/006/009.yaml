  text: 그리고 그 담즙을 눈에 흰막이 있는 사람에게 바르십시오. 그러면 그는 나을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ δὲ χολή
  english_pob_choice: the gall
  chosen_korean: 그 담즙
  alternatives_korean:
  - 그 쓸개즙
  - 그 쓸개
  lexicon: χολή
  rationale: χολή는 담즙/쓸개즙을 뜻하므로, 문맥상 치료용 물질로서 기능을 드러내는 ‘담즙’을 택했습니다.
- source_word: ἐγχρῖσαι
  english_pob_choice: apply
  chosen_korean: 바르십시오
  alternatives_korean:
  - 적용하십시오
  - 발라 주십시오
  lexicon: ἐγχρίω
  rationale: 몸의 특정 부위에 묻히는 행위를 자연스럽게 나타내되, 영어 POB의 ‘apply’를 반영해 과도한 의역을 피했습니다.
- source_word: λευκώματα
  english_pob_choice: white films
  chosen_korean: 흰막
  alternatives_korean:
  - 흰 백태
  - 흰 혼탁
  - 백막
  lexicon: λευκώματα
  rationale: λευκώματα는 눈의 흰 혼탁/막을 가리키므로, 현대 한국어에서 이해하기 쉬운 ‘흰막’으로 옮겼습니다.
- source_word: ἰαθήσεται
  english_pob_choice: he will be healed
  chosen_korean: 나을 것입니다
  alternatives_korean:
  - 치유될 것입니다
  - 회복될 것입니다
  lexicon: ἰάομαι
  rationale: 의학적 회복을 자연스럽게 전달하면서, 본문의 단순한 결과 서술을 유지했습니다.
theological_decisions:
- issue: 치유 행위의 묘사
  chosen_reading: 본문은 담즙을 눈에 바르면 실제로 치유가 일어난다는 서술을 그대로 유지했습니다.
  alternative_readings:
  - 상징적 교훈으로 완화
  - 민간요법적 표현으로 약화
  rationale: 토빗기의 내러티브는 구체적 치유 수단과 결과를 사실 서술로 제시하므로, 이를 완화하지 않았습니다.
  doctrine_reference: 본문 내러티브의 직접 진술 보존
