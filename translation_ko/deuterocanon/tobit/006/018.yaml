base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/018.yaml
  text: Then the demon will smell it and flee[a], and it will never return forever. But when you go in to her, rise, both of you, and cry out to the merciful God, and he will save you and have mercy on you. Do not fear, because she had been prepared for you from eternity, and you will save her, and she will go with you, and I suppose that you will have children by her. And when Tobias heard these things, he kissed her[d][c][b], and his soul was bound to her very strongly.
  footnotes:
  - marker: a
    text: Or, 'it will not return for ever and ever.' The Greek expression is an emphatic idiom for permanent non-return.
    reason: lexical_alternative
  - marker: b
    text: '''Go in to her'' is a marital idiom here, referring to approaching Sarah as husband to wife.'
    reason: cultural_note
  - marker: c
    text: Or, 'from of old' or 'from long ago.' The Greek can denote remote antiquity as well as an eternal horizon.
    reason: alternative_reading
  - marker: d
    text: '''His soul was bound to her'' is a vivid idiom for deep attachment, not merely momentary affection.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 악마는 그 냄새를 맡고 도망할 것이며, 영원무궁토록 다시 돌아오지 않을 것입니다.[a] 그러나 네가 그녀에게 나아갈 때에는[b] 두 사람 모두 일어나 자비로우신 하나님께 부르짖으십시오. 그러면 그분께서 너희를 구하시고 너희에게 자비를 베푸실 것입니다. 두려워하지 마십시오. 그녀는 예로부터[c] 너를 위해 마련되어 있었습니다. 너는 그녀를 구하게 될 것이며, 그녀는 너와 함께 갈 것입니다. 나는 네가 그녀와의 사이에서 자녀를 얻게 되리라고 생각합니다. 토비아스가 이 말을 듣고 그녀에게 입을 맞추었으며, 그의 마음은 그녀에게 매우 깊이 사로잡혔습니다.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘영원무궁토록 다시 돌아오지 않을 것입니다’는 ‘세세토록’이라는 뜻의 헬라어 강조 관용구를 반영한 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그녀에게 나아갈 때’는 여기서 남편이 아내에게 나아가는 것을 가리키는 결혼 관용어입니다.
    reason: cultural_note
  - marker: c
    text: ‘예로부터’에 해당하는 헬라어 표현은 ‘아주 오래전부터’ 또는 ‘영원 전부터’라는 뜻도 될 수 있습니다.
    reason: alternative_reading
  - marker: d
    text: 직역하면 ‘그의 혼이 그녀에게 매우 강하게 붙었다’입니다. 이는 단순한 호감이 아니라 깊은 애착과 결속을 나타내는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀσφρανθήσεται
  english_pob_choice: will smell
  chosen_korean: 냄새를 맡고
  alternatives_korean:
  - 냄새를 맡을 것이며
  - 냄새를 감지하고
  lexicon: BDAG
  rationale: 동사는 문자적으로 냄새를 맡거나 냄새를 인지하는 뜻이므로, 문맥의 구체적 동작을 살려 직역에 가깝게 옮겼습니다.
- source_word: τὸ δαιμόνιον
  english_pob_choice: the demon
  chosen_korean: 악마
  alternatives_korean:
  - 귀신
  - 악한 영
  lexicon: BDAG
  rationale: 그리스어는 분명한 초자연적 악 존재를 가리키므로, 한국어에서는 문맥상 가장 직접적인 ‘악마’를 택했습니다.
- source_word: οὐκ ἐπανελεύσεται τὸν αἰῶνα τοῦ αἰῶνος
  english_pob_choice: it will never return forever
  chosen_korean: 영원무궁토록 다시 돌아오지 않을 것입니다
  alternatives_korean:
  - 영원히 다시 돌아오지 않을 것입니다
  - 다시는 영원히 돌아오지 않을 것입니다
  lexicon: BDAG
  rationale: ‘세세토록/영원무궁토록’의 중첩된 강조를 한국어에서도 유지해, 단순한 ‘절대 다시 오지 않음’보다 강한 영구적 비귀환을 드러냈습니다.
- source_word: προσπορεύῃ αὐτῇ
  english_pob_choice: you go in to her
  chosen_korean: 그녀에게 들어갈 때에는
  alternatives_korean:
  - 그녀에게 나아갈 때에는
  - 그녀와 함께 들어갈 때에는
  lexicon: BDAG
  rationale: 이 표현은 결혼 침실에서의 남편-아내 접근이라는 관용적 용례이므로, 노골화하지 않으면서도 관용적 의미를 살려 옮겼습니다.
- source_word: βοήσατε πρὸς τὸν ἐλεήμονα θεόν
  english_pob_choice: cry out to the merciful God
  chosen_korean: 자비로우신 하나님께 부르짖으십시오
  alternatives_korean:
  - 자비로우신 하나님께 외치십시오
  - 자비로우신 하나님께 호소하십시오
  lexicon: BDAG
  rationale: βοάω의 긴박한 호소성을 살려 ‘부르짖다’를 택했고, θεός는 프로젝트 기본어휘에 따라 ‘하나님’으로 옮겼습니다.
- source_word: ἡτοίμασμένη ἦν ἀπὸ τοῦ αἰῶνος
  english_pob_choice: had been prepared for you from eternity
  chosen_korean: 태초부터 너를 위해 마련되어 있었습니다
  alternatives_korean:
  - 영원부터 너를 위해 준비되어 있었습니다
  - 옛적부터 너를 위해 마련되어 있었습니다
  lexicon: BDAG
  rationale: ἀπὸ τοῦ αἰῶνος는 ‘옛적부터/오래전부터’와 ‘영원’의 긴장을 가지므로, 한국어에서는 신학적 무게를 과도하게 단정하지 않는 ‘태초부터’로 처리했습니다.
- source_word: ἡ ψυχὴ αὐτοῦ ἐκολλήθη αὐτῇ σφόδρα
  english_pob_choice: his soul was bound to her very strongly
  chosen_korean: 그의 혼은 그녀에게 매우 강하게 매여 있었습니다
  alternatives_korean:
  - 그의 혼이 그녀에게 깊이 달라붙어 있었습니다
  - 그는 그녀에게 깊이 끌려 있었습니다
  lexicon: BDAG
  rationale: ‘혼’과 ‘매이다’의 이미지를 유지해, 단순한 감정 묘사로 평면화하지 않고 결속의 비유를 살렸습니다.
theological_decisions:
- issue: ἀπὸ τοῦ αἰῶνος의 시간 범위
  chosen_reading: 태초부터
  alternative_readings:
  - 영원부터
  - 옛적부터
  rationale: 문맥상 하나님의 섭리적 예비를 말하지만, 본문 자체가 형이상학적 영원을 직접 설명하는 것은 아니므로, 강한 예비성을 살리되 단정적 영원언어는 약간 완화했습니다.
  doctrine_reference: 본문의 섭리 표현은 유지하되, 과도한 체계신학적 확장은 피함.
- issue: ‘너는 그녀를 구할 것이다’의 의미
  chosen_reading: 토비아스가 사라를 위험에서 건져내는 서사적 구원
  alternative_readings:
  - 영적 구원
  - 일반적 보호
  rationale: 문맥은 악마의 공격에서 여인을 보호하는 상황이므로, ‘구하다’를 사용하되 구체적 서사 의미에 머물게 했습니다.
  doctrine_reference: 서사적 구원과 영적 구원을 구분하여 과잉신학화를 피함.
