  text: καὶ ὀσφρανθήσεται τὸ δαιμόνιον καὶ φεύξεται, καὶ οὐκ ἐπανελεύσεται τὸν αἰῶνα τοῦ αἰῶνος. ὅταν δὲ προσπορεύῃ αὐτῇ, ἐγέρθητε ἀμφότεροι καὶ βοήσατε πρὸς τὸν ἐλεήμονα θεόν, καὶ σώσει ὑμᾶς καὶ ἐλεήσει. μὴ φοβοῦ, ὅτι σοὶ αὔτη ἡτοίμασμένη ἦν ἀπὸ τοῦ αἰῶνος, καὶ σὺ αὐτὴν σώσεις, καὶ πορεύσεται μετὰ σοῦ, καὶ ὑπολαμβάνω ὅτι σοὶ ἔσται ἐξ αὐτῆς παιδία. καὶ ὡς ἤκουσεν Τωβείας ταῦτα, ἐφίλησεν αὐτήν, καὶ ἡ ψυχὴ αὐτοῦ ἐκολλήθη αὐτῇ σφόδρα.
