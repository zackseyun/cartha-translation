  yaml_path: translation/deuterocanon/tobit/006/016.yaml
  text: But the angel said to him[a], “Do you not remember the words that your father commanded you about taking a wife from your own kin? And now listen to me, brother, because she will be your wife, and pay no attention to the demon, for tonight she will be given to you as a wife.”
  footnotes:
  - marker: a
    text: Or, 'give no thought to the demon.' The Greek idiom literally says, 'have no word/account of the demon.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 천사가 그에게 말했습니다. 「아버지께서 네게 친족 가운데서 아내를 맞이하라고 명하신 말씀을 기억하지 않느냐? 이제 내 말을 들으라, 형제여. 그녀는 네 아내가 될 것이며, 그 악령에 대해서는 아무 생각도 하지 마라. 오늘 밤 그녀가 네게 아내로 주어질 것이다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘악령에 대해 아무 생각도 하지 마라.’ 그리스어 관용구는 문자적으로 ‘악령에 대한 말/계산을 두지 말라’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ αὐτῷ ὁ ἄγγελος
  english_pob_choice: But the angel said to him
  chosen_korean: 그때 천사가 그에게 말했습니다
  alternatives_korean:
  - 천사가 그에게 말했습니다
  - 그런데 천사가 그에게 말했습니다
  lexicon: BDAG
  rationale: 서술 연결은 자연스러운 한국어로 풀되, 화자 전환을 분명히 드러내어 서사의 흐름을 유지했습니다.
- source_word: ὑπὲρ τοῦ λαβεῖν σε γυναῖκα ἐκ τοῦ γένους σου
  english_pob_choice: about taking a wife from your own kin
  chosen_korean: 친족 가운데서 아내를 맞이하라고
  alternatives_korean:
  - 네 친족 가운데서 아내를 취하라고
  - 네 족속 가운데서 아내를 얻으라고
  lexicon: BDAG
  rationale: γένος의 친족적 의미를 살려 ‘친족 가운데서’로 옮기고, 혼인 관용구는 현대 한국어로 자연스럽게 ‘아내를 맞이하다’로 표현했습니다.
- source_word: ἀδελφέ
  english_pob_choice: brother
  chosen_korean: 형제여
  alternatives_korean:
  - 형제여
  - 형님
  lexicon: BDAG
  rationale: 직접 호격을 살려 친밀한 호칭으로 옮겼고, 문맥상 성별 중립적이면서도 구어체 과도한 완화는 피했습니다.
- source_word: τοῦ δαιμονίου μηδένα λόγον ἔχε
  english_pob_choice: pay no attention to the demon
  chosen_korean: 그 악령에 대해서는 아무 생각도 하지 마라
  alternatives_korean:
  - 그 악령을 두려워하지 마라
  - 그 악령에 관해 아무 말도 하지 마라
  lexicon: BDAG
  rationale: 직역하면 ‘악령에 대한 아무 말/계산도 두지 말라’는 관용구이므로, 본문의 의도인 ‘염려하지 말라/신경 쓰지 말라’의 뜻을 살려 옮겼습니다.
- source_word: δοθήσεταί σοι αὕτη εἰς γυναῖκα
  english_pob_choice: she will be given to you as a wife
  chosen_korean: 그녀가 네게 아내로 주어질 것이다
  alternatives_korean:
  - 그녀가 네게 아내로 주어질 것이다
  - 그녀가 네 아내가 되어 주어질 것이다
  lexicon: BDAG
  rationale: 수동형과 결혼 성립의 뉘앙스를 살려 ‘주어질 것이다’로 옮겼고, ‘아내로’는 목적격적 결과를 자연스럽게 드러냅니다.
theological_decisions:
- issue: 악령 명칭의 직접성
  chosen_reading: δαιμονίου를 본문에서 ‘악령’으로 옮겼습니다.
  alternative_readings:
  - 악마
  - 귀신
  rationale: 그리스어가 명시적으로 초자연적 존재를 가리키므로, 본문의 위협 대상을 분명히 하면서도 한국어 성경에서 널리 통용되는 ‘악령’을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 5
- issue: 혼인 배열의 사회적 구조
  chosen_reading: ‘친족 가운데서 아내를 맞이하라’는 표현으로, 본문의 친족 혼인 전제를 숨기지 않았습니다.
  alternative_readings:
  - 그냥 결혼하라
  - 가문에서 배우자를 맞이하라
  rationale: 원문은 혼인 선택의 범위를 분명히 제시하므로, 이를 일반화하지 않고 사회적·서사적 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 6
