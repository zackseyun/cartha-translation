base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/003.yaml
  text: Then the young man went down to wash himself[a], and a fish leaped up from the river and tried to swallow the young man.
  footnotes:
  - marker: a
    text: Or 'wanted to swallow the young man.' The Greek verb can denote intention or desire; the main text uses 'tried to' to express the fish's hostile action in idiomatic English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 그 젊은이가 몸을 씻으려고 내려갔습니다. 그때 물고기 한 마리가 강에서 튀어 올라 그 젊은이를 삼키려고 했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ παιδάριον
  english_pob_choice: the young man
  chosen_korean: 소년
  alternatives_korean:
  - 젊은이
  - 청년
  - 아이
  lexicon: LSJ
  rationale: 이 말은 축소형이지만 문맥상 독립적으로 여행하는 토비아를 가리키므로, 어린아이라는 인상을 주지 않으면서 자연스러운 현대 한국어로는 ‘소년’이 가장 무난합니다.
- source_word: περικλύσασθαι
  english_pob_choice: to wash himself
  chosen_korean: 몸을 씻으려고
  alternatives_korean:
  - 씻으려고
  - 목욕하려고
  - 몸을 헹구려고
  lexicon: LSJ
  rationale: 중간태 부정사는 자기 몸을 씻는 행위를 뜻하므로, 문맥에 맞게 목적 표현인 ‘몸을 씻으려고’로 풀어 자연스럽게 옮겼습니다.
- source_word: ἀνεπήδησεν
  english_pob_choice: leaped up
  chosen_korean: 튀어 올라와
  alternatives_korean:
  - 솟아올라
  - 뛰어올라
  - 펄쩍 뛰어올라
  lexicon: LSJ
  rationale: 갑작스러운 상향 동작과 장면의 긴박함을 살리기 위해 ‘튀어 올라와’를 선택했습니다.
- source_word: ἐβουλήθη καταπεῖν
  english_pob_choice: tried to swallow
  chosen_korean: 삼키려 했습니다
  alternatives_korean:
  - 삼키려고 했습니다
  - 삼키고자 했습니다
  - 집어삼키려 했습니다
  lexicon: LSJ
  rationale: ἐβουλήθη는 의지·의도를 나타내므로 ‘하려 했다’는 시도로 옮겼고, καταπεῖν은 직접적으로 ‘삼키다’로 번역했습니다.
theological_decisions:
- issue: 토빗서 서술체의 직설적 긴박감 유지
  chosen_reading: 물고기의 공격 의도를 완곡하게 약화하지 않고, ‘삼키려 했습니다’로 직접적으로 표현했습니다.
  alternative_readings:
  - 먹으려 했습니다
  - 해치려 했습니다
  rationale: 원문은 물고기의 포식적 위협을 분명히 보여 주므로, 의미를 일반화하거나 약화하지 않는 번역이 필요합니다.
  doctrine_reference: 본문 서술의 문학적 사실성 유지
