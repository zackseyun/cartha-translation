revisions:
- from: 그런데 소년이 몸을 씻으려고 내려갔는데, 물고기 한 마리가 강에서 튀어 올라와 그 소년을 삼키려 했습니다.
  to: 그런데 그 젊은이가 몸을 씻으려고 내려갔습니다. 그때 물고기 한 마리가 강에서 튀어 올라 그 젊은이를 삼키려고 했습니다.
  rationale: 인물의 연령·역할에 맞추어 παιδάριον을 ‘젊은이’로 옮기고, 물고기의 동작을 원문의 방향적 함의만 유지하여 다듬었습니다. ἐβουλήθη의 의도/시도라는 뉘앙스는 한국어 ‘삼키려고 했습니다’가 자연스럽게 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:54:52Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 사건 순서와 핵심 의미는 대체로 충실합니다. 다만 παιδάριον은 이 문맥에서 독립적으로 여행하는 토비아를 가리키므로 ‘소년’보다 ‘젊은이’가 더 적절합니다. 또한 ἀνεπήδησεν ἀπὸ τοῦ ποταμοῦ는 ‘강에서 튀어 올랐다’로 옮기면 원문의 움직임을 더 직접적으로 반영합니다.
  naturalness: 초안은 자연스럽고 합쇼체도 일관됩니다. 그러나 ‘튀어 올라와’의 ‘-와’는 원문에 명시되지 않은 접근 방향을 다소 보태므로 생략하는 편이 더 간결하고 정확합니다.
  terminology: ‘몸을 씻으려고’와 ‘삼키려고 했습니다’는 각각 περικλύσασθαι와 ἐβουλήθη καταπεῖν을 자연스럽게 반영합니다. 인물 지칭은 ‘소년’ 대신 ‘젊은이’로 통일하는 것이 연령 및 서사적 역할에 더 알맞습니다.
  issues:
  - severity: medium
    issue: παιδάριον을 ‘소년’으로 번역함
    rationale: παιδάριον은 ‘아이/소년’도 될 수 있으나, 이 본문에서는 여행을 수행하는 토비아를 가리킵니다. 현대 한국어 ‘소년’은 비교적 어린 남자아이를 강하게 연상시키므로 ‘젊은이’가 문맥과 영어 POB의 ‘young man’에 더 잘 맞습니다.
  - severity: low
    issue: ‘튀어 올라와’가 원문보다 방향성을 덧붙임
    rationale: ἀνεπήδησεν ἀπὸ τοῦ ποταμοῦ는 물고기가 강에서 튀어 오른 사실을 말합니다. ‘올라와’는 화자나 젊은이 쪽으로 다가오는 움직임을 암시할 수 있으므로 ‘튀어 올라’가 더 직접적입니다.
  revised_text: 그런데 그 젊은이가 몸을 씻으려고 내려갔습니다. 그때 물고기 한 마리가 강에서 튀어 올라 그 젊은이를 삼키려고 했습니다.
