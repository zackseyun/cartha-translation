  text: Then the young man said to the angel[a], “Azariah, brother, I have heard that the girl has been given to seven men[b], and that all of them were hindered in the bridal chamber.”
  footnotes:
  - marker: a
    text: Or “to seven husbands.” The Greek says “to seven men,” but the marriage context may justify the more specific sense.
    reason: lexical_alternative
  - marker: b
    text: Literally “all of them in the bridal chamber were prevented/kept away.” In context, this refers to the previous bridegrooms being unable to complete the marriage because they died there.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 그 젊은이가 천사에게 말했습니다. “아자리야, 형제여, 저는 그 소녀가 일곱 남자[a]에게 주어졌고, 그들 모두가 신방에서 저지되었다[b]고 들었습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “일곱 남편에게.” 그리스어는 “일곱 남자에게”라고 말하지만, 결혼 문맥에서는 더 구체적으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “그들 모두가 신방에서 저지되었다”입니다. 문맥상 이는 앞선 남편들이 그곳에서 혼인을 이루지 못했음을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ παιδάριον
  english_pob_choice: the young man
  chosen_korean: 그 소년
  alternatives_korean:
  - 그 젊은이
  - 그 아이
  lexicon: LSJ
  rationale: παῖς 계열의 축소형으로서 연령이 어린 뉘앙스가 있으나, 결혼을 앞둔 이야기 흐름에서 너무 유치하게 들리지 않도록 자연스러운 현대어로 옮겼습니다.
- source_word: τῷ ἀγγέλῳ
  english_pob_choice: to the angel
  chosen_korean: 천사에게
  alternatives_korean:
  - 사자에게
  - 메신저에게
  lexicon: LSJ
  rationale: 토빗기에서는 이 인물이 실제 천사이므로, 문맥에 따라 가장 분명한 ‘천사’로 옮겼습니다.
- source_word: ἑπτὰ ἀνδράσιν
  english_pob_choice: to seven men
  chosen_korean: 일곱 남자에게
  alternatives_korean:
  - 일곱 남편에게
  lexicon: LSJ
  rationale: ἀνήρ는 ‘남자’와 ‘남편’ 모두 뜻할 수 있지만, 이 절의 직접 표현은 ‘남자들’이므로 본문에서는 더 원문에 가깝게 유지했습니다.
- source_word: ἐν τῷ νυμφῶνι
  english_pob_choice: in the bridal chamber
  chosen_korean: 혼인 방에서
  alternatives_korean:
  - 신방에서
  - 혼례 방에서
  lexicon: LSJ
  rationale: νυμφών의 핵심은 혼인용 방이라는 뜻이므로, 전통 교회어의 ‘신방’보다 뜻이 드러나는 현대적 표현을 택했습니다.
- source_word: ἀποκωλῦσαι
  english_pob_choice: were hindered
  chosen_korean: 막혔다는
  alternatives_korean:
  - 방해받았다는
  - 저지되었다는
  lexicon: LSJ
  rationale: 동사의 핵심인 방해·저지를 살리되, 여기서는 영어 POB처럼 죽음을 직접 적시하지 않고 문맥이 암시하도록 간결하게 옮겼습니다.
theological_decisions:
- issue: 이 절에서 이전 신랑들의 운명을 얼마나 직접 말할 것인가
  chosen_reading: 본문에는 ‘막혔다’로 두어, 직접적인 죽음 언급은 앞뒤 문맥이 받쳐 주도록 남겼습니다.
  alternative_readings:
  - 죽었다
  - 혼인에 이르지 못했다
  - 방해받았다
  rationale: 그리스어 절 자체는 ‘막다/저지하다’의 어휘를 쓰므로, 해석을 한 단계 더 밀어 넣기보다 본문의 절제된 표현을 보존하는 것이 좋습니다.
  doctrine_reference: '번역 원칙: 본문이 직접 말하는 것과 문맥이 설명하는 것을 구분하여 유지함'
