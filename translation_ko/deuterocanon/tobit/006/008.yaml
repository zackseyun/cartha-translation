  text: And he said to him[a], “The heart and the liver—if a demon or an evil spirit troubles anyone, burn these as smoke before a man or a woman, and he or she will no longer be troubled.”
  footnotes:
  - marker: a
    text: Or, “burn them” — the Greek verb refers to causing these organs to smoke by burning them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그에게 말했습니다. 「심장과 간입니다. 만일 어떤 사람에게서 악마나 악한 영이 그를 괴롭히거든, 이것들을 사람이나 여자 앞에서 향기처럼 피우십시오. 그러면 그는 더 이상 괴롭힘을 당하지 않을 것입니다」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “태워 연기 내십시오” — 헬라어 동사는 이 장기들을 태워 연기를 내게 하는 행위를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καρδία
  english_pob_choice: heart
  chosen_korean: 심장
  alternatives_korean:
  - 마음
  - 가슴
  lexicon: BDAG
  rationale: 여기서는 영적 의미의 ‘마음’이 아니라 물고기의 실제 장기이므로, 해부학적 의미를 드러내는 ‘심장’으로 옮겼습니다.
- source_word: ἧπαρ
  english_pob_choice: liver
  chosen_korean: 간
  alternatives_korean:
  - 간장
  lexicon: BDAG
  rationale: 문맥이 물고기의 장기를 나란히 제시하므로, 문자적 해부학 용어인 ‘간’이 가장 직접적입니다.
- source_word: καπνίσαι
  english_pob_choice: burn these as smoke
  chosen_korean: 향기처럼 피우십시오
  alternatives_korean:
  - 태워 연기 나게 하십시오
  - 불태워 연기 내십시오
  lexicon: BDAG
  rationale: 동사는 단순 소각보다 ‘연기 나게 하다/피우다’의 뜻이 핵심이므로, 제의적 행위를 보이도록 ‘피우십시오’로 옮겼습니다. 다만 한국어로는 대상이 ‘향기처럼’ 연기 나는 느낌이 자연스러워 그 뉘앙스를 보완했습니다.
- source_word: ἀνθρώπου ἢ γυναικός
  english_pob_choice: a man or a woman
  chosen_korean: 사람이나 여자
  alternatives_korean:
  - 남자나 여자
  - 남성이나 여성
  lexicon: BDAG
  rationale: 원문의 성별 대구를 살리되, 한국어에서 제의적 문맥에 자연스럽게 읽히도록 ‘사람이나 여자’로 직역에 가깝게 옮겼습니다.
theological_decisions:
- issue: 악마/악한 영과 장기 소각을 통한 치유적 효력의 진술
  chosen_reading: 본문이 제시하는 초자연적 효력 진술을 완화하지 않고 그대로 반영했습니다.
  alternative_readings:
  - 민간요법적 상징으로 완곡하게 처리하기
  - 질병 치료의 비유로만 번역하기
  rationale: 헬라어 원문은 ‘악마/악한 영’과 그에 대한 처방을 서술형으로 제시하므로, 번역도 본문의 세계관을 유지해야 합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
