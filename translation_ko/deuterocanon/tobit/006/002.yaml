base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/002.yaml
  text: As they were traveling on the road[a], they came by evening to the Tigris River, and they camped there.
  footnotes:
  - marker: a
    text: The Greek short text here simply says they reached the Tigris by evening and camped there. The longer Semitic/long-recension tradition expands the scene immediately with the fish episode that follows.
    reason: textual_variant
translation:
  language: ko
  text: 그들은 길을 가다가 저녁에 티그리스 강에 이르러 거기서 야영했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 짧은 본문은 그들이 저녁에 티그리스 강에 이르러 거기서 야영했다고만 말합니다. 더 긴 셈어/장문 전승은 바로 이어서 물고기 사건을 확장해 덧붙입니다.
    reason: textual_variant
lexical_decisions:
- source_word: πορευόμενοι
  english_pob_choice: were traveling
  chosen_korean: 길을 가다가
  alternatives_korean:
  - 여행하던 중
  - 가던 중
  lexicon: BDAG
  rationale: 진행 중인 이동을 나타내는 분사이므로, 한국어에서도 진행성을 살린 표현으로 옮겼습니다.
- source_word: τὴν ὁδόν
  english_pob_choice: on the road
  chosen_korean: 길을
  alternatives_korean:
  - 도로를
  - 길 위를
  lexicon: BDAG
  rationale: 여행 중인 구체적 이동 경로를 자연스럽게 드러내기 위해 ‘길을’로 옮겼습니다.
- source_word: ἦλθον ἑσπέρας
  english_pob_choice: came by evening
  chosen_korean: 저녁에 … 이르러
  alternatives_korean:
  - 저녁 무렵에 도착하여
  - 저녁에 도착하여
  lexicon: BDAG
  rationale: 도착 시점을 표시하면서, ἑσπέρας의 시간 감각을 ‘저녁에’로 간결하게 반영했습니다.
- source_word: ηὐλίζοντο
  english_pob_choice: camped
  chosen_korean: 야영했습니다
  alternatives_korean:
  - 묵었습니다
  - 잠자리를 폈습니다
  lexicon: BDAG
  rationale: 이동 중 하룻밤을 지내는 뜻을 살리되, 강가라는 장면에 맞는 ‘야영했습니다’를 택했습니다.
theological_decisions:
- issue: 짧은 그리스어 본문만 반영할지, 장문 전승의 물고기 사건을 암시할지
  chosen_reading: 본문은 그리스어 짧은 본문에 따라, 저녁에 티그리스 강에 이르러 거기서 야영한 것으로만 번역했습니다.
  alternative_readings:
  - 장문 전승을 반영해 즉시 물고기 사건을 덧붙이는 번역
  - 각주 없이 본문에 장문 전승 내용을 삽입하는 번역
  rationale: 여기서는 본문 소스가 분명히 짧은 그리스어 본문이며, 장문 전승은 뒤이은 장면을 확장하는 이문이므로 본문에 혼합하지 않았습니다.
  doctrine_reference: 본문비평 / 전승사
