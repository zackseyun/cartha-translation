  terminology: ‘티그리스 강’은 통용되는 지명 표기이며, ‘야영했습니다’는 이 여행 장면에 적절합니다. 본문비평 각주는 짧은 그리스어 본문과 더 긴 전승을 구별하며, 본문에 장문 전승을 혼입하지 않습니다.
