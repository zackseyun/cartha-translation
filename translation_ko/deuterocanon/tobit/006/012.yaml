  rationale: 본문은 혼인 제안을 혈연과 상속의 질서에 연결하므로, 그 법적·사회적 논리를 본문에서 희석하지 않고 보존했습니다.
  doctrine_reference: '번역 원칙: source-direct, optimal equivalence'
