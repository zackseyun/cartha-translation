    text: 또는 ‘그녀의 상속에 대한 권리가 당신에게 귀속됩니다.’ 그리스어는 친족 관계에 따른 법적 청구권 또는 의무를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신만이 그녀와 같은 친족입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλήσω περὶ αὐτῆς
  english_pob_choice: I will speak about her
  chosen_korean: 그 일에 관하여 말하겠습니다
  alternatives_korean:
  - 그녀에 관해 말하겠습니다
  - 그녀를 두고 말하겠습니다
  lexicon: BDAG
  rationale: λαλέω + περί는 단순히 ‘대변하다’보다 ‘~에 관하여 말하다’가 직접적이므로, 한국어도 대상보다 사안을 드러내는 표현으로 옮겼습니다.
- source_word: τοῦ δοθῆναί σοι αὐτὴν εἰς γυναῖκα
  english_pob_choice: so that she may be given to you as a wife
  chosen_korean: 그 여자가 당신에게 아내로 주어질 것입니다
  alternatives_korean:
  - 그녀가 당신에게 아내로 주어지게 하겠습니다
  - 당신에게 아내로 주어질 수 있게 하겠습니다
  lexicon: BDAG
  rationale: 부정과 목적이 결합된 구조를 한국어에서는 자연스럽게 결과절로 풀어, 혼인 지향을 ‘아내로 주어지다’로 분명히 했습니다.
- source_word: σοὶ ἐπιβάλλει ἡ κληρονομία αὐτῆς
  english_pob_choice: her inheritance falls to you
  chosen_korean: 그녀의 상속권이 당신에게 돌아가고
  alternatives_korean:
  - 그녀의 상속권이 당신에게 속하고
  - 그녀의 유산이 당신에게 떨어지고
  lexicon: BDAG
  rationale: ἐπιβάλλει는 단순 소유보다 법적·관계적 귀속을 나타내므로, POB의 ‘falls to you’를 따라 ‘돌아가고’로 옮겨 상속의 귀속감을 살렸습니다.
- source_word: σὺ μόνος εἶ ἐκ τοῦ γένους αὐτῆς
  english_pob_choice: you alone are from her family
  chosen_korean: 당신만이 그녀의 가문에서 나오기 때문입니다
  alternatives_korean:
  - 당신만이 그녀의 친족이기 때문입니다
  - 당신만이 그녀의 혈통에서 나왔기 때문입니다
  lexicon: BDAG
  rationale: γένος는 혈연·가문·친족을 아우르므로, 혼인과 상속 문맥에 맞게 ‘가문에서 나오다’로 옮겨 친족적 근원을 드러냈습니다.
- source_word: τὸ κοράσιον καλὸν καὶ φρόνιμόν ἐστιν
  english_pob_choice: the young woman is beautiful and sensible
  chosen_korean: 그 소녀는 아름답고 분별이 있습니다
  alternatives_korean:
  - 그 젊은 여자는 아름답고 지혜롭습니다
  - 그 처녀는 아름답고 현명합니다
  lexicon: BDAG
  rationale: κοράσιον은 단순 ‘소녀’보다 결혼 가능한 젊은 여성을 가리킬 수 있어 문맥상 ‘소녀’로 두되, φρόνιμος는 도덕적 ‘지혜’보다 실천적 판단을 가리켜 ‘분별이 있습니다’로 옮겼습니다.
