translation:
  language: ko
  text: 그리고 젊은이가 천사에게 말했습니다. 「아자리아, 형제여, 물고기의 간과 심장과 담즙은 무엇을 위한 것입니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
