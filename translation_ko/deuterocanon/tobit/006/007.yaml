lexical_decisions:
- source_word: τὸ παιδάριον
  english_pob_choice: the young man
  chosen_korean: 소년
  alternatives_korean:
  - 젊은이
  - 아이
  - 청년
  lexicon: BDAG
  rationale: τὸ παιδάριον은 어린아이보다 어린 나이의 소년이나 젊은 하인을 가리킬 수 있는데, 여기서는 여행과 대화를 주도하는 토비아스의 연령대를 고려해 ‘소년’으로 옮겨 지나친 유아화는 피했습니다.
- source_word: τῷ ἀγγέλῳ
  english_pob_choice: to the angel
  chosen_korean: 천사에게
  alternatives_korean:
  - 사자에게
  - 전령에게
  lexicon: BDAG
  rationale: 본문과 영어 POB 모두 이 동반자를 천사로 이해하므로, 문맥적·명시적 의미를 그대로 살려 ‘천사’로 번역했습니다.
- source_word: ἀδελφέ
  english_pob_choice: brother
  chosen_korean: 형제여
  alternatives_korean:
  - 형제님
  - 친구여
  - 형제
  lexicon: BDAG
  rationale: 호격의 직접성을 살리면서도 한국어에서 자연스러운 존칭 호소를 위해 ‘형제여’를 택했습니다. 이는 친근한 호칭이라는 स्रोत의 어조를 보존합니다.
- source_word: τὸ ἧπαρ καὶ ἡ καρδία καὶ ἡ χολὴ
  english_pob_choice: the liver and the heart and the gall
  chosen_korean: 간과 심장과 쓸개
  alternatives_korean:
  - 간과 심장과 담즙
  - 간과 마음과 담즙
  lexicon: BDAG
  rationale: 세 기관을 병렬로 유지하되, καρδία를 관용적으로 ‘마음’으로 풀지 않고 신체 기관인 ‘심장’으로 옮겨 본문의 구체성을 보존했습니다. χολή는 영어 POB의 주석 취지를 반영해 ‘쓸개’로 본문에 두었습니다.
theological_decisions:
- issue: ἀδελφέ의 호칭을 한국어에서 어떻게 보존할지
  chosen_reading: 직역에 가깝게 ‘형제여’로 유지했습니다.
  alternative_readings:
  - ‘친구여’로 완화
  - 호칭을 생략
  rationale: 이 표현은 혈연 주장이라기보다 친근한 호칭이므로, 신학적 의미를 과도하게 해석하지 않고 어휘 투명성을 살리는 쪽을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.'
