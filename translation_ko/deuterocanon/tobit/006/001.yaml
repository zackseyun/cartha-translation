translation:
  language: ko
  text: 그리고 그녀는 울음을 그쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 사용하는 그리스어 본문은 매우 짧게 “그리고 그녀는 울음을 그쳤습니다”라고 합니다. 더 긴 셈어 계열 전승에는 “그 젊은이가 길을 떠나 …”로 이어지는 여행 이야기가 있으나, 그 문구는 여기 번역한 주요 그리스어 본문에는 없습니다.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  english_pob_choice: And
  chosen_korean: 그러나
  alternatives_korean:
  - 그리고
  - 또
  lexicon: 문맥 접속사
  rationale: 이 절은 이전의 울음 상태가 끝나는 전환을 나타내므로, 단순 병렬의 ‘그리고’보다 흐름 전환을 드러내는 ‘그러나’가 자연스럽습니다.
- source_word: ἐπαύσατο
  english_pob_choice: stopped
  chosen_korean: 멈추었습니다
  alternatives_korean:
  - 그쳤습니다
  - 중단했습니다
  lexicon: BDAG
  rationale: παύω의 aorist 중간형은 진행 중이던 동작을 멈추는 뜻이므로, 현대 한국어에서 자연스러운 ‘멈추었습니다’로 옮겼습니다.
- source_word: κλαίουσα
  english_pob_choice: weeping
  chosen_korean: 울기를
  alternatives_korean:
  - 흐느끼기를
  - 통곡하기를
  lexicon: BDAG
  rationale: 현재분사 κλαίουσα는 계속되는 울음을 가리키므로 명사화하여 ‘울기를’로 표현해 동작의 지속성과 종료를 살렸습니다.
