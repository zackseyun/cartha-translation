base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/005.yaml
  text: And the angel said to him, “Cut open the fish, and after taking the heart and the liver and the gall, put them away safely.”
  footnotes:
  - marker: a
    text: Greek χολή can also be rendered 'bile.'
    reason: lexical_alternative
translation:
  language: ko
  text: 천사가 그에게 말했습니다. “물고기를 갈라서 심장과 간과 담즙을 꺼내어 안전하게 보관하십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 χολή는 ‘쓸개’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἄγγελος
  english_pob_choice: the angel
  chosen_korean: 천사
  alternatives_korean:
  - 사자
  - 메신저
  lexicon: LSJ
  rationale: 이 이야기 문맥에서는 ἄγγελος의 일반적 의미보다 천사로서의 인물이 분명하므로, 서술 의미를 그대로 살렸습니다.
- source_word: Ἀνάτεμε
  english_pob_choice: Cut open
  chosen_korean: 가르십시오
  alternatives_korean:
  - 잘라 여십시오
  - 배를 가르십시오
  - 절개하십시오
  lexicon: LSJ
  rationale: 물고기를 처리해 내부 장기를 꺼내는 구체적 행동을 자연스러운 현대 한국어로 옮기되, 지나치게 의학적이거나 설명적인 표현은 피했습니다.
- source_word: τὴν χολὴν
  english_pob_choice: the gall
  chosen_korean: 쓸개
  alternatives_korean:
  - 담즙
  - 쓸개즙
  lexicon: LSJ
  rationale: χολή는 문맥상 담낭이 아니라 쓸개/쓴 액체를 가리키므로, POB의 ‘gall’에 맞춰 간결한 한국어로 옮겼습니다.
- source_word: θὲς ἀσφαλῶς
  english_pob_choice: put them away safely
  chosen_korean: 안전하게 보관하십시오
  alternatives_korean:
  - 안전하게 두십시오
  - 잘 보관하십시오
  - 안전하게 간수하십시오
  lexicon: LSJ
  rationale: 장차 사용할 목적으로 따로 보관하라는 뜻을 살려 ‘보관하다’를 택했고, ἀσφαλῶς의 안전/보존 뉘앙스를 반영했습니다.
theological_decisions:
- issue: 장기 보관 지시의 뉘앙스
  chosen_reading: 심장과 간과 쓸개를 꺼내어 안전하게 보관하십시오
  alternative_readings:
  - 심장과 간과 쓸개를 가져다가 두십시오
  - 심장과 간과 쓸개를 따로 간수하십시오
  rationale: 이 절의 핵심은 약용 목적의 보존 지시이지 단순한 치우기가 아니므로, 문맥상 ‘보관’으로 구체화했습니다.
  doctrine_reference: 본문 문맥 보존 원칙
