    rationale: ‘형제여’라는 번역 자체가 직접 호칭을 충분히 나타냅니다. 현 각주는 번역 선택을 반복할 뿐이며, 본문 끝의 각주 표기와 문장부호 결합도 한국어 본문 표기로는 매끄럽지 않습니다.
