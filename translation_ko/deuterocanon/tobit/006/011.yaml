  text: The angel said to the young man, “Brother, today we will lodge with Raguel. He is your relative, and he has a daughter named Sarah.”
translation:
  language: ko
  text: 천사가 그 소년에게 말했습니다. 「형제여, 오늘 우리는 라구엘 집에서 묵을 것입니다. 그는 당신의 친족이고, 사라라는 딸이 있습니다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직접 호칭을 살리기 위해 원문의 친족적 부름을 한국어에서도 유지했습니다.
    reason: korean_style_note
lexical_decisions:
- source_word: τῷ παιδαρίῳ
  english_pob_choice: young man
  chosen_korean: 그 소년
  alternatives_korean:
  - 그 젊은이
  - 그 청년
  lexicon: LSJ
  rationale: 영어 POB의 'young man'처럼, 여기서는 여행과 혼인 문맥에 맞게 어린아이보다 나이가 든 젊은 남성을 자연스럽게 드러내되, 한국어에서는 너무 성숙한 '청년'보다 '소년'이 원문의 소형 표현과 서술 상황을 함께 살리기 쉽습니다.
- source_word: Ἀδελφέ
  english_pob_choice: Brother
  chosen_korean: 형제여
  alternatives_korean:
  - 형님
  - 친구여
  - 형제
  lexicon: LSJ
  rationale: 직접 호칭을 유지해야 하므로 친족적 부름을 살린 '형제여'를 택했습니다. 영어 POB의 직역적 호칭 효과를 한국어에서도 보존합니다.
- source_word: αὐλισθησόμεθα
  english_pob_choice: we will lodge
  chosen_korean: 묵을 것입니다
  alternatives_korean:
  - 머물 것입니다
  - 야영할 것입니다
  - 밤을 보낼 것입니다
  lexicon: LSJ
  rationale: 이 동사는 하룻밤 머물러 숙박하는 뜻이므로, 야영을 과도하게 특정하는 '야영하다'보다 중립적인 '묵다'가 문맥에 가장 잘 맞습니다.
- source_word: παρὰ Ῥαγουήλῳ
  english_pob_choice: with Raguel
  chosen_korean: 라구엘 집에서
  alternatives_korean:
  - 라구엘과 함께
  - 라구엘 곁에서
  - 라구엘에게
  lexicon: LSJ
  rationale: 여기서 παρά+여격은 단순 동반보다 그 사람의 집/처소에 머문다는 뜻을 띠므로, 한국어에서는 관계와 숙박 장소를 드러내는 '라구엘 집에서'가 가장 자연스럽습니다.
- source_word: συγγενής
  english_pob_choice: relative
  chosen_korean: 친족
  alternatives_korean:
  - 친척
  - 혈족
  - 가족
  lexicon: LSJ
  rationale: 단순 친척보다 약간 더 포괄적이고, 혈연 관계를 분명히 하는 '친족'이 원문의 친족성을 잘 반영합니다.
theological_decisions:
- issue: 직접 호칭 'Ἀδελφέ'의 한국어 문체
  chosen_reading: 천사의 말투를 직접 호칭형으로 유지해 「형제여」로 옮겼습니다.
  alternative_readings:
  - 형제님
  - 형제야
  rationale: 원문은 친밀한 직접 부름이며, 이를 완곡한 존칭으로 바꾸면 장면의 관계적 뉘앙스가 약해집니다. 다만 서술문 전체는 합쇼체를 유지해 균형을 맞췄습니다.
  doctrine_reference: 서사적 대화의 화용론
