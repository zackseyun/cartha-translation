  rationale: 원문의 ‘악귀가 그 여자를 사랑한다’는 표현을 번역 본문에 복원하고, 그 불길하고 집착적인 뉘앙스는 각주에서 설명했습니다. 또한 각주 표지를 해당 표현 바로 뒤로 옮기고, 부모를 슬픔 가운데 죽음에 이르게 한다는 사역적 의미를 더 분명히 했습니다. ‘외아들’, ‘앞선 사람들’, ‘다가가는 사람들’은 원문의 문맥과 범위를 보존합니다.
