base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/015.yaml
  text: And now I am my father's only one[a], and I am afraid that if I go in, I will die, just as the former ones did, because a demon loves her, and it harms no one except those who approach her. And now I am afraid that I may die and bring down the life of my father and my mother in grief because of me to their grave[c][b]; and they have no other son who will bury them.
  footnotes:
  - marker: a
    text: Or 'those before me'; the phrase refers to Sarah's previous husbands or suitors.
    reason: lexical_alternative
  - marker: b
    text: The Greek says 'a demon loves her,' expressing the demon's possessive attachment to Sarah.
    reason: lexical_alternative
  - marker: c
    text: Literally 'bring down the life of my father and my mother ... to their grave'—an idiom for causing them to die in grief because of me.
    reason: cultural_note
translation:
  language: ko
  text: 이제 저는 아버지에게는 외아들입니다. 그래서 들어가면 저도 이전 사람들처럼 죽을까 두렵습니다. 그 여자에게는 악귀가 붙어 있는데, 그 악귀는 그 여자에게 다가가는 사람 외에는 아무에게도 해를 끼치지 않습니다. 또 이제 저는 제가 죽어서 아버지와 어머니가 저 때문에 슬픔 속에서 그들의 무덤으로 내려가게 될까 두렵습니다. 그들에게는 그들을 묻어 줄 다른 아들이 없습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내가 아버지의 외아들이다’에 가깝습니다.
    reason: source_note
  - marker: b
    text: 그리스어는 ‘그 여자에게 다가가는 사람들 외에는’이라는 뜻으로, 사라에게 가까이 오는 자들을 가리킵니다.
    reason: alternative_reading
  - marker: c
    text: 직역하면 ‘내 아버지와 어머니의 생명을 … 그들의 무덤으로 끌어내리다’라는 관용구로, 나 때문에 부모가 슬픔 속에 죽게 된다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: μόνος εἰμὶ τῷ πατρί
  english_pob_choice: I am my father's only one
  chosen_korean: 아버지에게는 외아들입니다
  alternatives_korean:
  - 아버지의 유일한 아들입니다
  - 아버지의 외동아들입니다
  lexicon: LSJ / 문맥
  rationale: μόνος는 단순한 '혼자'보다 가족관계에서 '유일한 자녀'를 뜻하므로, 문맥상 자연스럽고 정확한 '외아들'로 옮겼습니다.
- source_word: οἱ πρότεροι
  english_pob_choice: the former ones
  chosen_korean: 이전 사람들
  alternatives_korean:
  - 먼저 있던 사람들
  - 앞서 온 사람들
  lexicon: LSJ
  rationale: 이 표현은 사라의 앞선 남편들/구혼자들을 가리키므로, 한국어로는 관계를 드러내지 않되 문맥상 이해되는 '이전 사람들'로 처리했습니다.
- source_word: δαιμόνιον φιλεῖ αὐτὴν
  english_pob_choice: a demon loves her
  chosen_korean: 악귀가 붙어 있는데
  alternatives_korean:
  - 한 귀신이 그녀를 사랑하는데
  - 악한 영이 그녀를 사랑하는데
  lexicon: BDAG / LSJ
  rationale: φιλέω의 직역은 '사랑하다'이지만, 여기서는 사라에게 집착하는 해로운 존재를 뜻하므로 한국어에서 그 뉘앙스를 살린 '악귀가 붙어 있는데'로 옮겼습니다.
- source_word: τῶν προσαγόντων αὐτῇ
  english_pob_choice: those who approach her
  chosen_korean: 그 여자에게 다가가는 사람
  alternatives_korean:
  - 그 여자에게 오는 사람
  - 그 여자에게 접근하는 사람
  lexicon: LSJ
  rationale: 동작의 방향을 살리면서도 한국어로 자연스럽게 들리도록 '다가가는 사람'으로 옮겼습니다.
- source_word: κατάξω τὴν ζωὴν ... εἰς τὸν τάφον αὐτῶν
  english_pob_choice: bring down the life ... to their grave
  chosen_korean: 슬픔 속에서 그들의 무덤으로 내려가게 될까
  alternatives_korean:
  - 그들의 생명을 무덤으로 끌어내리게 될까
  - 그들의 삶을 무덤까지 끌고 가게 될까
  lexicon: LSJ
  rationale: 이 표현은 자녀의 죽음이 부모를 비탄 속 죽음으로 이끈다는 관용구이므로, 이미지를 보존하면서도 한국어 관용에 맞게 풀었습니다.
theological_decisions:
- issue: δαιμόνιον의 성격
  chosen_reading: 사라를 집착적으로 붙드는 개인적 악귀로 이해하고 번역했습니다.
  alternative_readings:
  - 막연한 악령
  - 상징적 악
  rationale: 토빗기의 서사 세계에서 δαιμόνιον은 실제로 해를 끼치는 인격적 영적 존재로 제시되므로, 이를 약화하지 않고 드러내는 번역이 본문에 가장 충실합니다.
  doctrine_reference: 본문의 서사적 전제와 원어의 평이한 의미를 우선함
