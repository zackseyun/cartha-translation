base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/006.yaml
  text: And the young man did as the angel told him. Then they roasted the fish and ate it[a], and both of them traveled on until they came near Ecbatana.
  footnotes:
  - marker: a
    text: 'Greek: ''until they came near Ecbatana,'' indicating approach rather than necessarily full arrival.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 젊은이는 천사가 그에게 말한 대로 했습니다. 그러고 나서 그들은 물고기를 구워 먹었고, 두 사람은 길을 계속 가서 에크바타나 가까이 이르렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘에크바타나 가까이 이르렀다’는 뜻이어서, 단순한 도착보다 접근을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ παιδάριον
  english_pob_choice: the young man
  chosen_korean: 그 젊은이
  alternatives_korean:
  - 그 소년
  - 그 아이
  - 그 청년
  lexicon: BDAG
  rationale: 이 문맥에서 παιδάριον은 어린아이보다 여행 중인 결혼 적령기의 인물을 가리키므로, 자연스러운 합쇼체로 ‘젊은이’가 가장 잘 맞습니다.
- source_word: ὡς εἶπεν αὐτῷ ὁ ἄγγελος
  english_pob_choice: as the angel told him
  chosen_korean: 천사가 자기에게 말한 대로
  alternatives_korean:
  - 천사가 그에게 말한 대로
  - 천사가 그에게 일러 준 대로
  - 천사가 그에게 지시한 대로
  lexicon: BDAG
  rationale: εἶπεν αὐτῷ는 단순한 발화를 가리키므로, 명령성을 과도하게 강조하지 않으면서도 순종의 뜻이 드러나도록 ‘말한 대로’로 옮겼습니다.
- source_word: τὸν δὲ ἰχθὺν ὀπτήσαντες ἔφαγον
  english_pob_choice: they roasted the fish and ate it
  chosen_korean: 물고기를 구워 먹었고
  alternatives_korean:
  - 물고기를 구워서 먹었고
  - 물고기를 구워 먹었습니다
  - 물고기를 불에 구워 먹었고
  lexicon: BDAG
  rationale: ὀπτήσαντες와 ἔφαγον의 연속 동작을 한국어에서는 자연스럽게 이어서 표현했고, 본문의 대상이 앞뒤 문맥상 분명하므로 ‘먹었고’로 충분합니다.
- source_word: ἐν Ἐκβατάνοις
  english_pob_choice: Ecbatana
  chosen_korean: 에크바타네
  alternatives_korean:
  - 엑바타나
  - 엑바타네
  lexicon: LSJ
  rationale: 고유명사는 현대 외래어 표기 관행에 따라 음역했으며, 본문은 도착 자체보다 접근을 말하므로 지명만 유지했습니다.
theological_decisions:
- issue: 천사의 지시를 따르는 순종의 뉘앙스
  chosen_reading: 직접 명령형이 아니라 ‘말한 대로 했다’로 옮겨, 천사에게서 받은 말에 대한 즉각적 순종을 살렸습니다.
  alternative_readings:
  - 천사가 시키는 대로 했다
  - 천사가 지시한 대로 했다
  rationale: 본문의 초점은 행위의 충실한 실행이지 명령의 강도 자체가 아니므로, 서술의 평이함을 유지하는 편이 원문에 더 가깝습니다.
  doctrine_reference: 서사 문맥의 순종 강조
- issue: ἐν Ἐκβατάνοις의 도착 여부
  chosen_reading: ‘가까이 이르렀습니다’로 옮겨, 에크바타네에 완전 도착이라기보다 접근했다는 의미를 유지했습니다.
  alternative_readings:
  - 에크바타네에 이르렀습니다
  - 에크바타네에 도착했습니다
  rationale: 영어 POB의 주석과 그리스어의 ἕως ἤγγισαν이 함께 시사하는 바를 반영하여, 성급한 완전 도착 해석을 피했습니다.
  doctrine_reference: 본문의 시간·공간 표지 보존
