base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/008.yaml
  text: And the third I would give to those to whom it was due[a], just as Deborah, my father's mother, commanded[c][b], because I was left an orphan by my father.
  footnotes:
  - marker: a
    text: Or, more explicitly, 'the third portion' or 'a third part'; the Greek leaves the noun implied from the context.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'my father's mother.'
    reason: lexical_alternative
  - marker: c
    text: That is, effectively 'fatherless'; the Greek reads literally, 'I was left an orphan by my father,' referring to the loss of his father.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 세 번째 몫은 받아야 할 사람들에게 주었습니다[a]. 곧, 제 아버지의 어머니인 드보라가 저에게 명한 대로였습니다[b]. 이는 제 아버지 때문에 저는 고아로 남겨졌기 때문입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 직역하면 ‘세 번째 몫’ 또는 ‘세 번째 부분’입니다. 그리스어는 앞문맥에서 생략된 명사를 내포합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘제 아버지의 어머니’입니다.
    reason: lexical_alternative
  - marker: c
    text: 곧 ‘아버지를 잃어 사실상 부친 없이 남겨졌다’는 뜻입니다. 그리스어는 문자적으로 ‘제 아버지에 의해 고아로 남겨졌다’고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν τρίτην
  english_pob_choice: the third
  chosen_korean: 세 번째 몫
  alternatives_korean:
  - 세 번째
  - 세 번째 부분
  - 세 번째 몫/몫의 셋째
  lexicon: LSJ
  rationale: 그리스어는 앞문맥의 나눔을 전제로 한 생략 표현이므로, 한국어에서는 의미가 드러나도록 ‘몫’을 보충하되 ‘세 번째’의 서열 감각은 유지했습니다.
- source_word: ἐδίδουν
  english_pob_choice: I would give
  chosen_korean: 주었습니다
  alternatives_korean:
  - 주곤 했습니다
  - 늘 주었습니다
  - 주었습니다
  lexicon: LSJ
  rationale: 미완료시제의 습관적 과거를 자연스러운 현대 한국어로 옮기되, 과도한 반복 어감을 피하기 위해 간결한 과거 서술로 처리했습니다.
- source_word: οἷς καθήκει
  english_pob_choice: to those to whom it was due
  chosen_korean: 받아야 할 사람들에게
  alternatives_korean:
  - 마땅히 받을 사람들에게
  - 정당하게 받을 사람들에게
  - 받아야 하는 사람들에게
  lexicon: LSJ
  rationale: καθήκει의 ‘마땅하다/해당하다/당연하다’는 뜻을 반영해, 분배가 권리와 귀속의 문제임을 드러내는 표현으로 옮겼습니다.
- source_word: ἡ μήτηρ τοῦ πατρός μου
  english_pob_choice: my father's mother
  chosen_korean: 제 아버지의 어머니
  alternatives_korean:
  - 제 할머니
  - 아버지의 어머니
  - 제 부친의 모
  lexicon: LSJ
  rationale: 그리스어가 친족관계를 완곡하게 묶지 않고 직설적으로 풀어 쓰므로, 한국어도 ‘할머니’로 매끈하게 바꾸기보다 원문 구조를 보존했습니다.
- source_word: ὀρφανὸς κατελείφθην ὑπὸ τοῦ πατρός μου
  english_pob_choice: I was left an orphan by my father
  chosen_korean: 제 아버지 때문에 저는 고아로 남겨졌기 때문입니다
  alternatives_korean:
  - 아버지를 잃어 고아로 남겨졌기 때문입니다
  - 아버지에 의해 고아로 남겨졌기 때문입니다
  - 사실상 아버지를 잃어 고아가 되었기 때문입니다
  lexicon: LSJ
  rationale: 직역하면 ‘제 아버지에 의해 고아로 남겨졌다’이지만, POB의 주석처럼 실제 의미는 아버지의 죽음으로 인한 부친 상실이므로 한국어는 그 함의를 지나치게 풀지 않으면서 자연스럽게 표현했습니다.
theological_decisions:
- issue: ‘고아’와 ‘아버지 때문에’의 병치가 만들어내는 문맥적 긴장
  chosen_reading: 문자적 구조를 살리되, 한국어 본문은 ‘아버지 때문에 저는 고아로 남겨졌기 때문입니다’로 두어 원문의 기이한 표현과 실제 의미를 함께 드러냈습니다.
  alternative_readings:
  - ‘아버지를 잃어 고아로 남겨졌기 때문입니다’
  - ‘사실상 아버지를 잃어 부친 없이 남겨졌기 때문입니다’
  rationale: 이 절은 문자적으로는 ‘아버지에 의해 고아로 남겨졌다’이지만, 독자가 읽어야 할 뜻은 아버지의 상실입니다. 원문의 낯섦을 완전히 지우지 않으면서 의미를 전달하는 방향을 택했습니다.
  doctrine_reference: 문맥 주해/서술적 정확성
