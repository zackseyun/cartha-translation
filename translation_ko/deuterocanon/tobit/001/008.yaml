  lexicon: LSJ
  rationale: καθήκει의 ‘마땅하다/해당하다/당연하다’는 뜻을 반영해, 분배가 권리와 귀속의 문제임을 드러내는 표현으로 옮겼습니다.
- source_word: ἡ μήτηρ τοῦ πατρός μου
  english_pob_choice: my father's mother
  chosen_korean: 제 아버지의 어머니
  alternatives_korean:
  - 제 할머니
  - 아버지의 어머니
  - 제 부친의 모
  lexicon: LSJ
  rationale: 그리스어가 친족관계를 완곡하게 묶지 않고 직설적으로 풀어 쓰므로, 한국어도 ‘할머니’로 매끈하게 바꾸기보다 원문 구조를 보존했습니다.
- source_word: ὀρφανὸς κατελείφθην ὑπὸ τοῦ πατρός μου
  english_pob_choice: I was left an orphan by my father
  chosen_korean: 제 아버지 때문에 저는 고아로 남겨졌기 때문입니다
  alternatives_korean:
  - 아버지를 잃어 고아로 남겨졌기 때문입니다
  - 아버지에 의해 고아로 남겨졌기 때문입니다
  - 사실상 아버지를 잃어 고아가 되었기 때문입니다
  lexicon: LSJ
  rationale: 직역하면 ‘제 아버지에 의해 고아로 남겨졌다’이지만, POB의 주석처럼 실제 의미는 아버지의 죽음으로 인한 부친 상실이므로 한국어는 그 함의를 지나치게 풀지 않으면서 자연스럽게 표현했습니다.
theological_decisions:
- issue: ‘고아’와 ‘아버지 때문에’의 병치가 만들어내는 문맥적 긴장
  chosen_reading: 문자적 구조를 살리되, 한국어 본문은 ‘아버지 때문에 저는 고아로 남겨졌기 때문입니다’로 두어 원문의 기이한 표현과 실제 의미를 함께 드러냈습니다.
  alternative_readings:
  - ‘아버지를 잃어 고아로 남겨졌기 때문입니다’
  - ‘사실상 아버지를 잃어 부친 없이 남겨졌기 때문입니다’
  rationale: 이 절은 문자적으로는 ‘아버지에 의해 고아로 남겨졌다’이지만, 독자가 읽어야 할 뜻은 아버지의 상실입니다. 원문의 낯섦을 완전히 지우지 않으면서 의미를 전달하는 방향을 택했습니다.
  doctrine_reference: 문맥 주해/서술적 정확성
