  text: And when Enemessar died[a], Achreil his son became king in his place, and his roads became unsafe[b], and I was no longer able to go into Media.
  footnotes:
  - marker: a
    text: 'The Greek verb rendered ''became unsafe'' is difficult and appears in an unusual form; the sense is inferred from the travel context: the routes were in disorder or insecure, so Tobit could no longer travel to Media.'
    reason: lexical_alternative
  - marker: b
    text: The royal names appear here as Enemessar and Achreil in the Greek witness used for this translation; other textual traditions of Tobit preserve different spellings and, in some cases, different names.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 에네메사르가 죽었을 때, 그의 아들 아크레일이[b] 그를 대신하여 왕이 되었습니다. 그때 그의 길들이 불안정해졌고[a], 나는 더 이상 메디아로 갈 수 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 동사 형태는 난해합니다. 여행 문맥상 길들이 불안정해지거나 질서가 어지러워져 더 이상 메디아로 갈 수 없게 되었다는 뜻으로 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: 이 구절의 왕명은 본 그리스어 증거의 표기를 따랐습니다. 다른 토빗 전승에는 철자나 이름이 다른 경우도 있습니다.
    reason: textual_variant
