theological_decisions:
- issue: 본문의 난해한 여행 불능 표현을 어떻게 처리할지
  chosen_reading: 길들이 왕권 변화로 인해 안전하지 않게 되어, 토빗이 메디아로 갈 수 없게 된 상황으로 읽었습니다.
