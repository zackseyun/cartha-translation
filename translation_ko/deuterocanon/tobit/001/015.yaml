  alternative_readings:
  - 엔에메사르, 아크리엘, 메디아
  rationale: 제시된 그리스어 증거의 표기를 반영해 음역했고, 본문 자체의 텍스트 전승 차이를 주석으로 분리하지 않았습니다.
