  - 길들이 물리적으로 봉쇄되었다는 의미
  rationale: 주석의 audit trail처럼, 동사의 정확한 형태는 불확실하지만 여행 문맥상 결과는 이동 불가입니다. 과도한 해석을 피하면서도 서술의 실제 효과를 드러냈습니다.
  doctrine_reference: 문학적·역사적 서술 해석 원칙
