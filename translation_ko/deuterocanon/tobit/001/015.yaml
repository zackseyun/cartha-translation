theological_decisions:
- issue: 본문의 난해한 여행 불능 표현을 어떻게 처리할지
  chosen_reading: 길들이 왕권 변화로 인해 안전하지 않게 되어, 토빗이 메디아로 갈 수 없게 된 상황으로 읽었습니다.
  alternative_readings:
  - 길들이 소란스러워졌다는 보다 강한 의미
  - 길들이 물리적으로 봉쇄되었다는 의미
  rationale: 주석의 audit trail처럼, 동사의 정확한 형태는 불확실하지만 여행 문맥상 결과는 이동 불가입니다. 과도한 해석을 피하면서도 서술의 실제 효과를 드러냈습니다.
  doctrine_reference: 문학적·역사적 서술 해석 원칙
- issue: 고유명사 표기
  chosen_reading: 에네메사르, 아크레일, 메디아로 음역했습니다.
  alternative_readings:
  - 엔에메사르, 아크리엘, 메디아
  rationale: 제시된 그리스어 증거의 표기를 반영해 음역했고, 본문 자체의 텍스트 전승 차이를 주석으로 분리하지 않았습니다.
  doctrine_reference: 본문비평 및 고유명사 음역 원칙
