  - 사들이는 사람
  - 조달 담당자
  lexicon: LSJ
  rationale: 직역하면 '사는 사람'이지만, 왕실/궁정에서의 직무를 분명하게 보여 주기 위해 문맥상 직무 표현으로 옮겼습니다.
theological_decisions:
- issue: ὁ ὕψιστος의 호칭성
  chosen_reading: 지극히 높으신 분
