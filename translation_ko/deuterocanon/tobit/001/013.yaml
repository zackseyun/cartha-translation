  text: And the Most High gave me favor and good standing before Enemessar[b][a], and I was his buyer.
  footnotes:
  - marker: a
    text: Or 'favor and comeliness' / 'favor and good standing.' The Greek μορφή can denote outward form or appearance, and the exact nuance in this court context is not fully certain.
    reason: lexical_alternative
  - marker: b
    text: Or 'his purchasing agent.' The Greek literally says 'buyer,' likely referring to an official responsible for procurement.
    reason: lexical_alternative
translation:
  language: ko
  text: 지극히 높으신 분께서 내게 은총과 좋은 모양을 에네멧사르 앞에서 주셨고, 나는 그의 구매 담당자였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ὕψιστος
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 지존자
  - 가장 높으신 분
  - 지극히 높으신 하나님
  lexicon: LSJ
  rationale: 하나님을 가리키는 칭호로서 위격적 호칭을 살리면서도, 한국어에서 자연스럽고 존칭적 표현으로 옮겼습니다.
- source_word: χάριν
  english_pob_choice: favor
  chosen_korean: 은총
  alternatives_korean:
  - 호의
  - 호감
  - 은혜
  lexicon: BDAG
  rationale: 궁정 문맥의 사회적 호의라는 점을 살리되, 성경적 문맥에서 자연스러운 긍정적 호의를 나타내는 말로 옮겼습니다.
- source_word: μορφὴν
  english_pob_choice: good standing / good appearance
  chosen_korean: 좋은 모양
  alternatives_korean:
  - 좋은 용모
  - 호감 가는 모습
  - 좋은 체면
  lexicon: LSJ
  rationale: μορφή의 외형적·겉모습적 의미를 반영하되, 궁정에서의 유능하고 받아들여질 만한 모습이라는 뉘앙스를 과도하게 해석하지 않도록 했습니다.
- source_word: ἀγοραστής
