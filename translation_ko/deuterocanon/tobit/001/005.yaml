base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/005.yaml
  text: and all the tribes that had apostatized were sacrificing to Baal the heifer[a], including the house of my father[b], Naphtali.
  footnotes:
  - marker: a
    text: Or 'Baal the calf.' The Greek uses a word for a young cow/heifer; the phrase likely refers to the bovine cult image associated with northern Israel's worship.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek syntax at the end is compressed: literally, ''and the house of Naphtali of my father.'' The sense is that even Tobit''s own ancestral house was included among those participating.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 배교한 모든 지파는 바알 곧 암송아지에게 제사를 드리고 있었으며, 내 아버지의 집인 납달리도 그 가운데 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘암송아지’는 헬라어 δαμάλις의 직역에 가깝습니다. 일부 해석은 이를 북이스라엘의 ‘송아지’ 우상 전통과 연결합니다.
    reason: lexical_alternative
  - marker: b
    text: 끝부분의 그리스어는 매우 압축되어 있어, 직역하면 ‘그리고 내 아버지의 납달리 집’에 가깝습니다. 뜻은 토빗의 아버지 집안까지도 포함되었다는 것입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶσαι αἱ φυλαὶ
  english_pob_choice: all the tribes
  chosen_korean: 모든 지파
  alternatives_korean:
  - 모든 부족
  - 각 지파
  lexicon: LSJ
  rationale: 이 역사적·민족적 문맥에서 φυλαί는 혈연 집단보다 이스라엘의 지파들을 가리키므로, 한국어도 ‘지파’가 가장 직접적입니다.
- source_word: αἱ συναποστᾶσαι
  english_pob_choice: that had apostatized
  chosen_korean: 배교한
  alternatives_korean:
  - 함께 반역한
  - 함께 떨어져 나간
  lexicon: LSJ
  rationale: 복합 분사는 단순한 정치적 이탈보다 언약적·종교적 배반을 강하게 드러내므로 ‘배교한’이 가장 압축적이고 정확합니다.
- source_word: τῇ Βάαλ τῇ δαμάλει
  english_pob_choice: to Baal the heifer
  chosen_korean: 바알 곧 암송아지에게
  alternatives_korean:
  - 바알 곧 송아지에게
  - 바알 곧 어린 암소에게
  - 바알에게, 그 암송아지에게
  lexicon: LSJ
  rationale: δαμάλις는 ‘암송아지/어린 암소’이므로 이를 보존하되, Βάαλ과의 병치를 ‘곧’으로 살려 우상 명칭과 동물 형상이 겹치는 표현임을 드러냈습니다.
- source_word: ὁ οἶκος Νεφθαλεὶμ τοῦ πατρός μου
  english_pob_choice: including the house of my father, Naphtali
  chosen_korean: 내 아버지의 집인 납달리도 그 가운데
  alternatives_korean:
  - 내 아버지 납달리의 집도
  - 내 아버지의 납달리 집도
  lexicon: LSJ
  rationale: 문장 끝의 압축된 구문은 토빗 자신의 조상 집안을 포함한다는 뜻이므로, 한국어에서는 ‘~도 그 가운데’로 포함 관계를 자연스럽게 풀었습니다.
theological_decisions:
- issue: 배교와 우상제사의 결합
  chosen_reading: ‘배교한’과 ‘제사를 드리고 있었으며’를 함께 유지해, 단순한 민족 이동이 아니라 언약적 이탈이 우상숭배로 드러난다는 점을 살렸습니다.
  alternative_readings:
  - ‘반역한’
  - ‘떨어져 나간’
  rationale: 바로 뒤에 바알 제사가 나오므로, 이탈의 성격은 정치적 반란보다 신앙적 배교로 이해하는 것이 문맥상 분명합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
