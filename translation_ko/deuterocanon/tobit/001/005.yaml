base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/005.yaml
  text: and all the tribes that had apostatized were sacrificing to Baal the heifer[a], including the house of my father[b], Naphtali.
  footnotes:
  - marker: a
    text: Or 'Baal the calf.' The Greek uses a word for a young cow/heifer; the phrase likely refers to the bovine cult image associated with northern Israel's worship.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek syntax at the end is compressed: literally, ''and the house of Naphtali of my father.'' The sense is that even Tobit''s own ancestral house was included among those participating.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 함께 배교한 모든 지파는 바알 곧 암송아지에게[a] 제사를 드리고 있었으며, 내 아버지의 납달리 집안도[b] 그 가운데 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘암송아지’는 헬라어 δαμάλις의 직역에 가깝습니다. 이 말은 ‘어린 암소’ 또는 ‘송아지’로도 옮길 수 있습니다. 일부 해석은 이 표현을 북이스라엘의 송아지 우상 전통과 연결합니다.
    reason: lexical_alternative
  - marker: b
    text: 끝부분의 그리스어는 매우 압축되어 있어, 직역에 가깝게 옮기면 ‘그리고 내 아버지의 납달리 집안’입니다. 납달리를 토빗의 아버지 이름으로 확정하기보다, 그의 아버지 집안이 납달리 지파/계통에 속했음을 가리키는 표현으로 이해하는 것이 안전합니다. 뜻은 그 집안도 이 일에 포함되었다는 것입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶσαι αἱ φυλαὶ
  english_pob_choice: all the tribes
