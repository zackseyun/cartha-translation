base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/002.yaml
  text: who was taken captive in the days of Enemessaros king of the Assyrians[a], from Thisbe, which is to the south of Kedesh of Naphtali in Galilee[b], above Asher.
  footnotes:
  - marker: a
    text: The place names in this verse are difficult and may reflect textual or geographic uncertainty. 'Kydios' may represent a site otherwise identified differently, and 'to the right of' / 'above Asher' are kept relatively literal rather than converted into a more interpretive compass direction.
    reason: cultural_note
  - marker: b
    text: Some interpreters identify 'Enemessaros' with the Assyrian king Shalmaneser, but the Greek text here reads the transliterated form 'Enemessaros.'
    reason: alternative_reading
translation:
  language: ko
  text: 그는 아시리아 왕 에네메사르의 시대에 포로로 잡힌 사람인데, 납달리의 길라에 있는 키디오스의 오른쪽에 있는, 디스베 출신이었습니다. 그곳은 아셰르 위쪽에 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 지명과 방향 관계를 전승된 형태 그대로 보존하므로, 여기서는 ‘오른쪽’을 직역으로 남겼습니다.
    reason: source_note
