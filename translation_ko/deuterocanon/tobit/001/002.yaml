  - 포로가 된
  - 붙잡혀 끌려간
  lexicon: BDAG
  rationale: 수동형으로 강제 이송과 포로 신분을 함께 드러내기 위해 ‘포로로 잡힌’을 선택했습니다.
- source_word: ἐν ἡμέραις Ἐνεμεσσαάρου
  english_pob_choice: in the days of Enemessaros
  chosen_korean: 에네메사르의 시대에
  alternatives_korean:
  - 에네메사르 때에
  - 에네메사르 왕 시대에
  lexicon: LSJ
  rationale: 관용구를 자연스러운 한국어 역사 서술로 옮기되, 본문의 왕명 음역을 유지했습니다.
- source_word: ἐκ Θίσβης
  english_pob_choice: from Thisbe
  chosen_korean: 디스베 출신이었습니다
  alternatives_korean:
  - 디스베에서 온 사람이었습니다
  - 디스베 사람입니다
  lexicon: BDAG
  rationale: ἐκ의 출신/기원 의미를 살려 인물 소개로 풀어 썼습니다.
- source_word: ἐκ δεξιῶν Κυδίως
  english_pob_choice: to the right of Kydios
  chosen_korean: 키디오스의 오른쪽에 있는
  alternatives_korean:
  - 키디오스의 남쪽에 있는
  - 키디오스의 오른편에 있는
  lexicon: LSJ
  rationale: 지리적 방향어의 해석을 과도하게 확정하지 않고, ‘오른쪽’이라는 직역적 의미를 보존했습니다.
theological_decisions:
- issue: 지명 불확실성과 방향어 해석
  chosen_reading: 지명과 방향 표현을 가능한 한 직역하여, 본문의 지리 정보가 가진 불확실성을 유지했습니다.
  alternative_readings:
  - ‘키디오스’를 ‘게데스’로 식별
  - ‘오른쪽에 있는’를 ‘남쪽에 있는’으로 구체화
  rationale: 원문과 영어 POB 주석이 모두 지리·전승상의 불확실성을 지적하므로, 해석을 확정하기보다 그대로 드러내는 편이 본문 충실성에 부합합니다.
  doctrine_reference: 본문 비평/지리 주석
- issue: 왕명 음역
  chosen_reading: Ἐνεμεσσαάρου를 익숙한 성서식 통일명으로 바꾸지 않고 ‘에네메사르’로 음역했습니다.
  alternative_readings:
  - 살만에셀
  - 에네메사로스
  rationale: 영어 POB가 그리스어 표기 자체를 보존하므로, 한국어도 전통적 역사명으로 조화시키지 않고 전승된 형태를 반영했습니다.
  doctrine_reference: 고유명사 음역 원칙
