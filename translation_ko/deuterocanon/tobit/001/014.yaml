  text: I used to go to Media[a], and I deposited ten talents of silver with Gabael, the brother of Gabri[c][b], in Rages of Media.
  footnotes:
  - marker: a
    text: Or 'I went to Media'; the Greek imperfect verb can suggest repeated/customary action ('I used to go') rather than a single journey.
    reason: lexical_alternative
  - marker: b
    text: Or 'I entrusted' ten talents of silver to Gabael. The Greek verb can denote placing something in another's care, here in a financial sense.
    reason: lexical_alternative
  - marker: c
    text: The Greek place name may also be rendered 'Rhages of Media.'
    reason: alternative_reading
translation:
  language: ko
  text: 나는 메디아로 가곤 했고[a], 메디아의 라게스[c]에서 가브리의 형제인 가브엘에게 은 열 달란트를 맡겼습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 미완료 시제는 ‘메디아로 갔고’처럼 한 번의 이동으로도 옮길 수 있지만, 반복적·습관적 행동을 시사할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘예치했습니다’ 또는 ‘은 열 달란트를 가브엘에게 맡겼습니다’로도 옮길 수 있습니다. 이 동사는 여기서 금전을 다른 사람의 보관과 관리에 맡기는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘라게스’는 ‘르하게스’로도 옮길 수 있는 메디아의 지명입니다.
    reason: alternative_reading
