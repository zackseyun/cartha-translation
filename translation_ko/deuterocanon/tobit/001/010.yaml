  alternatives_korean:
  - 니네베 안으로
  - 니네베까지
  lexicon: BDAG
  rationale: 이동 동사의 목적지를 나타내는 εἰς를 한국어 조사 '-로'로 간결하게 반영했습니다.
- source_word: οἱ ἐκ τοῦ γένους
  english_pob_choice: those of my kindred
  chosen_korean: 내 친족들
  alternatives_korean:
  - 내 혈족들
  - 내 가문의 사람들
  - 내 친척들
  lexicon: BDAG
  rationale: γένους는 단순한 직계 가족보다 넓은 혈연·종족 집단을 가리키므로, 문맥에 맞는 '친족들'로 옮겼습니다.
- source_word: ἐκ τῶν ἄρτων τῶν ἐθνῶν
  english_pob_choice: from the bread of the Gentiles
  chosen_korean: 이방인의 빵
  alternatives_korean:
  - 이방인들의 빵
  - 이방인의 음식
  - 이방인의 떡
  lexicon: BDAG
  rationale: 직역적 이미지를 유지해 '빵'을 살렸고, ἄρτων의 식량 관용구적 성격은 본문이 허용하는 범위에서 한국어 자연성으로 반영했습니다.
