base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/010.yaml
  text: And when we were taken captive to Nineveh[a], all my brothers and those of my kindred ate from the bread of the Gentiles;
  footnotes:
  - marker: a
    text: Or 'the food of the Gentiles.' The Greek says literally 'the breads of the Gentiles,' an idiom for food provisions.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 우리가 니네베로 사로잡혀 갔을 때, 내 형제들 모두와 내 친족들은 이방인의 빵을 먹었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘이방인의 빵들’이라고 하며, 음식 공급을 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾐχμαλωτίσθημεν
