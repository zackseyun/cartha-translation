- issue: ‘빵’을 식량으로 풀어 쓸지 여부
  chosen_reading: 본문은 ‘이방인의 빵’을 유지
  alternative_readings:
  - 이방인의 음식
  - 이방인의 양식
  rationale: 그리스어가 문자적으로 '빵들'이라고 말하므로, 해석을 앞서 넣기보다 관용구의 구체성을 유지했습니다.
