  source_fidelity: 그리스어의 수동 과거형 ᾐχμαλωτίσθημεν은 강제로 포로가 되었음을 나타내므로, ‘포로로 끌려갔을 때’가 초안의 ‘사로잡혀 갔을 때’보다 그 강제성과 이동을 더 분명히 보존합니다. ἤσθιον은 미완료형으로, ‘먹곤 했습니다’는 포로 생활 중의 반복적 관행이라는 뉘앙스를 자연스럽게 드러냅니다. ‘내 형제들 모두와 내 친족들’은 πάντες οἱ ἀδελφοί μου καὶ οἱ ἐκ τοῦ γένους의 범위와 구별을 보존하며, ‘이방인의 빵’은 해석적으로 ‘부정한’ 등을 덧붙이지 않고 원문의 구체적 표현을 유지합니다.
  naturalness: ‘니네베로 포로로 끌려갔을 때’와 ‘먹곤 했습니다’는 현대 표준 한국어 합쇼체에서 자연스럽고 격식에 맞습니다. 각주에서는 ‘음식 공급’보다 ‘음식이나 양식’이 한국어 관용상 더 자연스럽습니다.
