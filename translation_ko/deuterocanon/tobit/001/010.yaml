  - 사로잡혀 있었을 때
  lexicon: BDAG
  rationale: 수동 aorist의 강제성을 살리되, 한국어에서는 자연스러운 과거 사건 서술로 풀어 옮겼습니다.
- source_word: εἰς Νινευή
  english_pob_choice: to Nineveh
