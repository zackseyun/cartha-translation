  rationale: 본문은 경건한 전인적 기억을 말하지만, 여기서 ψυχή를 교리적 용어처럼 고정시키기보다 헌신의 총체성을 한국어 관용으로 전달하는 편이 자연스럽습니다. 동시에 의미는 약화하지 않도록 '온'을 유지했습니다.
