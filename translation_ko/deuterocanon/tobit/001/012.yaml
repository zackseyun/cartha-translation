    rationale: ‘온 마음으로’는 의미상 가능한 관용 표현이지만, 원문의 ψυχή 및 영어 감사 기록의 ‘soul’이 지닌 어휘적·인류론적 무게를 본문에서 ‘마음’으로 치환합니다. 각주의 ‘직역하면’만으로 보완하기보다 본문을 ‘영혼’으로 고치는 것이 최적등가 원칙에 더 맞습니다.
