  terminology: ‘하나님’은 이 초안의 명명 관례와 일치합니다. ψυχή는 여기서 특정 교리를 강요하지 않으면서도 원문의 인류론적 어휘를 보존하도록 ‘영혼’으로 옮기는 것이 적절합니다.
