    text: 그리스어는 ‘내게 아내 안나와 아들 토빗 외에는 아무것도 남지 않았다’고 말합니다. 이는 재산을 빼앗긴 뒤 아내와 아들만 남았다는 뜻이며, 그들을 재산으로 분류한다는 뜻은 아닙니다.
    reason: lexical_alternative
