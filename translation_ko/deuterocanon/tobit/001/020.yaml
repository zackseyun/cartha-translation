  text: And all my possessions were plundered[a], and nothing was left to me except Anna my wife and Tobit my son.
  footnotes:
  - marker: a
    text: 'Greek: ''nothing was left to me except Anna my wife and Tobit my son.'' The verse speaks of what remained to Tobit after his goods were taken; it does not imply that his wife and son were possessions.'
