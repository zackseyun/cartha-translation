theological_decisions:
- issue: ἠξίωσεν περὶ ἐμοῦ의 관계적·공적 뉘앙스
  chosen_reading: ‘interceded for me’의 의미를 살리되, 한국어에서는 ‘나를 위해 나서 주었고’로 공적 보호와 대변의 느낌을 함께 담았습니다.
  alternative_readings:
  - ‘중보했다’
  - ‘간청했다’
  - ‘요청했다’
  rationale: 이 구절은 신학적 교리 용어보다 궁정 서사 속 행위 묘사가 핵심이므로, 종교적 용어로 과도하게 고정하지 않는 것이 본문 의미를 더 잘 드러냅니다.
  doctrine_reference: 서사 문맥의 대리·보호 행위
- issue: υἱὸς ἐκ δευτέρας의 모호성
  chosen_reading: ‘둘째 자리로 세웠습니다’로 옮겨, 아히아카루스가 왕 다음 가는 지위에 있었다는 문맥적 의미를 반영했습니다.
  alternative_readings:
  - ‘왕의 아들로 세웠습니다’
  - ‘둘째 아들로 세웠습니다’
  - ‘둘째로 임명했습니다’
  rationale: 그리스어 표현이 문자적으로 매우 어색하므로, 본문이 의도하는 서열적 의미를 드러내는 해석을 채택했습니다.
  doctrine_reference: 본문 비평·관용구 해석
