  text: And Ahiacharus interceded for me[a], and I came to Nineveh. Now Ahiacharus was the cupbearer, keeper of the signet ring, administrator, and accountant, and Sacherdonos appointed him second in rank. He was my cousin.
  footnotes:
  - marker: a
    text: Greek literally, 'appointed him son of the second,' an idiomatic and textually awkward expression commonly understood to mean that Ahiacharus held the position next after the king or was second in rank.
    reason: textual_variant
translation:
  language: ko
  text: 아히아카루스는 나를 위해 나서 주었고, 나는 니네베에 이르렀습니다. 아히아카루스는 술잔을 맡은 자이며, 왕의 인장반지를 맡은 자요, 행정관이며, 회계관이었는데, 사헤르도노스가 그를 둘째 자리로 세웠습니다. 그는 내 사촌이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘둘째의 아들로 세웠다’에 가깝지만, 문맥상 왕 다음의 높은 서열 또는 둘째 지위를 가리키는 관용구로 이해됩니다.
    reason: textual_variant
