- from: 그리고 오십 일이 지나기 전에 그의 두 아들이 그를 죽였으며, 그들은 아라랏 산지로 도망하였습니다. 그의 아들 사헤르도노스가 그의 뒤를 이어 왕이 되었고, 그는 아나엘의 아들로서 내 형제의 아들인 아키아하로스를 그의 왕국의 모든 회계와 온 행정 위에 임명하였습니다.[a][b]
  to: 그리고 오십 일이 채 지나기 전에 그의 두 아들이 그를 죽이고 아라랏 산지로 달아났습니다. 그의 아들 사헤르도노스[a]가 그를 이어 왕이 되었고, 그는 내 형제의 아들인 아나엘의 아들 아키아하로스[b]를 자기 왕국의 모든 회계 업무와 행정 전반을 맡도록 임명하였습니다.
  rationale: 아나엘과 아키아하로스의 세대 관계를 원문대로 명확히 바로잡고, 각주 표지를 해당 고유명사에 연결했습니다. 또한 회계·행정의 관할을 나타내는 임명 표현을 현대 한국어에 맞게 다듬었으며, 사건의 의미와 원문의 비평가적 비단정성은 변경하지 않았습니다.
