base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/021.yaml
  text: And before fifty days had passed[a], his two sons killed him and fled to the mountains of Ararat. And Sacherdonos his son reigned in his place, and he appointed Achiacharos, the son of Anael, my brother's son[b], over all the accounts of his kingdom and over the whole administration.
  footnotes:
  - marker: a
    text: Sacherdonos is the Greek form of the Assyrian royal name more commonly rendered in English as Esarhaddon.
    reason: lexical_alternative
  - marker: b
    text: Achiacharos is the Greek form of the name often rendered Ahikar.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 오십 일이 채 지나기 전에 그의 두 아들이 그를 죽이고 아라랏 산지로 달아났습니다. 그의 아들 사헤르도노스[a]가 그를 이어 왕이 되었고, 그는 내 형제의 아들인 아나엘의 아들 아키아하로스[b]를 자기 왕국의 모든 회계 업무와 행정 전반을 맡도록 임명하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 사헤르도노스는 아시리아 왕명 에살핫돈의 헬라어 형태입니다.
    reason: lexical_alternative
  - marker: b
    text: 아키아하로스는 흔히 아히가르로 옮기는 이름의 헬라어 형태입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὐ διῆλθον ἡμέραι πεντήκοντα ἕως οὗ
  english_pob_choice: before fifty days had passed
  chosen_korean: 오십 일이 지나기 전에
  alternatives_korean:
  - 오십 일이 지나지 않았을 때
  - 오십 일이 다 지나기 전에
  lexicon: LSJ
  rationale: 헬라어의 ‘오십 일이 지나지 않았다’는 관용적 표현을 한국어에서는 자연스럽게 ‘오십 일이 지나기 전에’로 옮겨 짧은 시간을 분명히 드러냈습니다.
- source_word: ἀπέκτειναν
  english_pob_choice: killed
  chosen_korean: 죽였으며
  alternatives_korean:
  - 살해하였으며
  - 죽였습니다
  lexicon: BDAG
  rationale: 본문의 사실 진술을 직접적으로 살리되, 영어 audit의 중립적 선택처럼 한국어에서도 과도한 평가를 넣지 않고 ‘죽였다’로 옮겼습니다.
- source_word: ἔφυγον εἰς τὰ ὄρη Ἀραράθ
  english_pob_choice: fled to the mountains of Ararat
  chosen_korean: 아라랏 산지로 도망하였습니다
  alternatives_korean:
  - 아라랏의 산들로 도망하였습니다
  - 아라랏 산으로 피하였습니다
  lexicon: LSJ
  rationale: ἔφυγον의 도주 뉘앙스를 살려 ‘도망하다’로 옮겼고, 지명은 Greek source를 따라 ‘아라랏’으로 음역했습니다.
- source_word: ἐβασίλευσεν ... ἀντʼ αὐτοῦ
  english_pob_choice: reigned in his place
  chosen_korean: 그의 뒤를 이어 왕이 되었고
  alternatives_korean:
  - 그 대신 통치하였고
  - 그의 자리에 왕이 되었고
  lexicon: LSJ
  rationale: 즉위와 승계의 뜻을 함께 담기 위해 자연스러운 한국어 관용인 ‘뒤를 이어 왕이 되다’를 사용했습니다.
- source_word: ἐπὶ πᾶσαν τὴν ἐκλογιστείαν ... καὶ ἐπὶ πᾶσαν τὴν διοίκησιν
  english_pob_choice: over all the accounts ... and over the whole administration
  chosen_korean: 왕국의 모든 회계와 온 행정 위에
  alternatives_korean:
  - 왕국의 모든 장부와 전체 행정 위에
  - 왕국의 모든 계산과 행정 전반 위에
  lexicon: LSJ
  rationale: ἐκλογιστεία를 ‘회계’로, διοίκησιν을 ‘행정’으로 옮겨 재정 관리와 통치 운영이라는 이중 행정 범위를 분명히 했습니다.
