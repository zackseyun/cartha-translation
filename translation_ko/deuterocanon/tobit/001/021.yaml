  terminology: 사헤르도노스, 아키아하로스, 아나엘은 헬라어 본문 형태를 반영한 음역으로 적절합니다. 각주 표지는 해당 이름 바로 뒤에 두어 각주의 지시 대상을 명확히 해야 합니다.
