  source_fidelity: 핵심 사건 순서와 행정 임명의 뜻은 대체로 충실합니다. 그러나 현행 본문의 친족 관계는 아키아하로스가 ‘아나엘의 아들’이면서 동시에 ‘내 형제의 아들’인 것처럼 읽힙니다. 헬라어는 아나엘이 ‘내 형제의 아들’이고 아키아하로스는 그 아나엘의 아들임을 나타냅니다.
