base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/006.yaml
  text: But I alone would often go to Jerusalem for the feasts[a], as it is written for all Israel in an everlasting ordinance[b], bringing the firstfruits and the tithes of the produce and the first shearings.
  footnotes:
  - marker: a
    text: Or 'in Jerusalem'; the Greek uses 'in Jerusalem' with a verb of travel, but English normally says 'go to Jerusalem.'
    reason: lexical_alternative
  - marker: b
    text: The rare Greek term rendered 'first shearings' likely refers to the first portion from shearing livestock; some take it more generally as first pastoral dues.
    reason: lexical_alternative
translation:
  language: ko
  text: 저는 혼자서도 축제 때마다 예루살렘으로 자주 올라갔습니다[a]. 그것은 모든 이스라엘에게 영원한 규례[b]로 기록된 대로였으며, 나는 곡식의 첫 열매와 십일조와 수확물의 몫과 첫 깎은 양털을 가져갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 예루살렘을 뜻하는 전치사구와 이동 동사를 함께 쓰지만, 한국어에서는 목적지 표현 ‘예루살렘으로’가 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 희귀한 προκουρίας는 첫 털깎이의 몫을 가리키는 것으로 보이며, 더 넓게는 첫 목축 소득을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνος
  english_pob_choice: I alone
  chosen_korean: 저는 혼자서도
  alternatives_korean:
  - 저만
  - 오직 저만
  lexicon: BDAG
  rationale: μόνος의 강조를 살려 다른 이들과 대비되는 개인적 충실함을 드러내되, 한국어에서는 ‘혼자서도’가 가장 자연스럽습니다.
- source_word: ἐπορευόμην πλεονάκις
  english_pob_choice: would often go
  chosen_korean: 자주 올라갔습니다
  alternatives_korean:
  - 자주 갔습니다
  - 여러 번 올라갔습니다
  lexicon: BDAG
  rationale: 미완료형과 πλεονάκις가 나타내는 반복적 습관을 한국어의 과거 반복 표현으로 옮겼고, 예루살렘 순례 맥락상 ‘올라가다’가 자연스럽습니다.
- source_word: ἐν Ἱεροσολύμοις
  english_pob_choice: to Jerusalem
  chosen_korean: 예루살렘으로
  alternatives_korean:
  - 예루살렘에서
  - 예루살렘 안으로
  lexicon: BDAG
  rationale: 그리스어는 장소 부사격이지만 이동 동사와 함께 목적지 의미이므로 한국어도 도착 방향을 분명히 했습니다.
- source_word: προκουρίας
  english_pob_choice: first shearings
  chosen_korean: 첫 깎은 양털
  alternatives_korean:
  - 첫 깎음
  - 첫 털깎이
  lexicon: LSJ
  rationale: 희귀어의 가능 의미인 가축의 첫 깎음을 살리면서, 한국어에서 제의적 몫으로 이해되도록 ‘양털’로 풀어 옮겼습니다.
theological_decisions:
- issue: ἐν προστάγματι αἰωνίῳ의 규범성
  chosen_reading: ‘영원한 규례’로 옮겨, 이스라엘 전체에 주어진 지속적 법적 규범임을 드러냈습니다.
  alternative_readings:
  - 영원한 명령
  - 영속한 칙령
  rationale: 이 표현은 단순한 영적 교훈이 아니라 토라적 의무의 근거를 제시하므로, 법적·예식적 뉘앙스를 유지하는 번역이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
