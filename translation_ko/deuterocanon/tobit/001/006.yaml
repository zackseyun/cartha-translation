  to: 저 혼자만 절기 때에 예루살렘으로[a] 자주 올라가곤 했습니다. 이는 모든 이스라엘을 위한 영원한 규례로 기록된 대로였으며, 저는 첫 열매와 소산의 십일조와 첫 털깎이의 몫[b]을 가지고 갔습니다.
