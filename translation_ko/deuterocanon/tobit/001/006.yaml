base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/006.yaml
  text: But I alone would often go to Jerusalem for the feasts[a], as it is written for all Israel in an everlasting ordinance[b], bringing the firstfruits and the tithes of the produce and the first shearings.
  footnotes:
  - marker: a
    text: Or 'in Jerusalem'; the Greek uses 'in Jerusalem' with a verb of travel, but English normally says 'go to Jerusalem.'
    reason: lexical_alternative
  - marker: b
    text: The rare Greek term rendered 'first shearings' likely refers to the first portion from shearing livestock; some take it more generally as first pastoral dues.
    reason: lexical_alternative
translation:
  language: ko
  text: 저 혼자만 절기 때에 예루살렘으로[a] 자주 올라가곤 했습니다. 이는 모든 이스라엘을 위한 영원한 규례로 기록된 대로였으며, 저는 첫 열매와 소산의 십일조와 첫 털깎이의 몫[b]을 가지고 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 예루살렘을 뜻하는 전치사구와 이동 동사를 함께 쓰지만, 한국어에서는 목적지 표현인 ‘예루살렘으로’가 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 희귀한 그리스어 προκουρίας는 가축을 처음 털깎이할 때의 몫을 가리키는 것으로 보이며, 더 넓게는 첫 목축 소득을 뜻할 수도 있습니다.
    reason: lexical_alternative
