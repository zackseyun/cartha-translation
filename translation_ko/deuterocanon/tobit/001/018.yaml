  text: And if Sennacherib the king killed any when he came fleeing from Judea[a], I buried them secretly; for in his anger he killed many, and the bodies were sought by the king, but they were not found.
  footnotes:
  - marker: a
    text: Greek Swete reads 'Achreil the king' (Ἀχρειλ ὁ βασιλεύς), a form understood in context to refer to Sennacherib.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 만일 아크레일 왕이 유다에서 도망쳐 올 때에 누구든지 죽였다면, 나는 그들을 몰래 묻었습니다. 그가 분노하여 많은 사람을 죽였고, 왕이 시신들을 찾게 하였으나 발견되지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 Swete 본문은 Ἀχρειλ ὁ βασιλεύς(‘아크레일 왕’)로 읽지만, 문맥상 이는 산헤립을 가리키는 것으로 이해됩니다.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ εἴ τινα
  english_pob_choice: And if ... any
  chosen_korean: 그리고 만일 ... 누구든지
  alternatives_korean:
  - 그리고 만약 ... 누군가
  - 그리고 만일 ... 어떤 사람이
  lexicon: BDAG
  rationale: 조건절의 막연한 상황 제시를 한국어에서 자연스럽게 살리되, 뒤의 복수적 맥락이 보이도록 ‘누구든지’로 옮겼습니다.
- source_word: Ἀχρειλ ὁ βασιλεύς
  english_pob_choice: Sennacherib the king
  chosen_korean: 아크레일 왕
  alternatives_korean:
  - 산헤립 왕
  - 아크레일 왕 산헤립
  lexicon: LSJ
  rationale: 그리스어 본문 형태를 우선 반영해 아크레일을 살리고, 영어 POB의 주석처럼 인물 동일성 문제를 주석으로 투명하게 처리했습니다.
- source_word: ἔθαψα αὐτοὺς κλέπτων
  english_pob_choice: I buried them secretly
  chosen_korean: 나는 그들을 몰래 묻었습니다
  alternatives_korean:
  - 나는 그들을 은밀히 묻었습니다
  - 나는 그들을 숨겨 묻었습니다
  lexicon: BDAG
  rationale: κλέπτων의 부사적 뜻을 현대 한국어에서 가장 자연스럽게 나타내는 ‘몰래’를 택해, 의미를 과장하지 않고 드러냈습니다.
- source_word: ἐν τῷ θυμῷ αὐτοῦ
  english_pob_choice: in his anger
  chosen_korean: 그가 분노하여
  alternatives_korean:
  - 그의 분노 가운데
  - 그의 노여움 안에서
  lexicon: BDAG
  rationale: 전치사구를 한국어 인과·상황 표현으로 풀어, 동사 중심의 서술 흐름을 살렸습니다.
theological_decisions:
- issue: 왕 이름의 본문 처리와 주석 처리
  chosen_reading: 본문에는 그리스어 형태를 반영한 ‘아크레일 왕’을 두고, 독자가 역사적 인물 동일성을 오해하지 않도록 주석으로 설명합니다.
  alternative_readings:
  - 산헤립 왕
  rationale: 이 문제는 교리보다 본문-명칭 일치성의 문제입니다. 그리스어 증거의 투명성을 유지하면서도, 문맥상 동일 인물을 가리킨다는 점을 드러내기 위해 본문과 주석을 분리했습니다.
  doctrine_reference: 'translation philosophy: source transparency and auditable naming'
- issue: ‘시신들’의 복수 처리
  chosen_reading: 복수 명사 τὰ σώματα를 한국어에서도 복수로 살려 ‘시신들’로 옮깁니다.
  alternative_readings:
  - 시신을
  - 몸들을
  rationale: 본문의 복수성과 왕의 수색 대상이라는 집단성을 유지하기 위해 복수형을 선택했습니다.
  doctrine_reference: source semantics and number agreement
