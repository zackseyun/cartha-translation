  - 정의
  lexicon: BDAG
  rationale: 이 절은 토비트의 삶 전체를 요약하는 자기 진술이므로, 추상명사 ‘의’보다 한국어에서 행동 양식을 드러내는 ‘의의 길’로 풀어 의미를 보존했습니다.
- source_word: ἐλεημοσύνας πολλὰς ἐποίησα
  english_pob_choice: I did many acts of mercy
  chosen_korean: 많은 자비의 일을 행하였습니다
  alternatives_korean:
  - 많은 구제를 하였습니다
  - 많은 자선을 베풀었습니다
  lexicon: LSJ
  rationale: ἐλεημοσύνη가 구제를 가리킬 수 있지만, 여기서는 형제들과 민족 전체를 향한 폭넓은 선행을 가리킬 수 있어 ‘자비의 일’로 넓게 옮겼습니다.
- source_word: τοῖς ἀδελφοῖς μου
  english_pob_choice: my brothers
  chosen_korean: 내 형제들
  alternatives_korean:
  - 내 친족들
  - 내 동족 형제들
  lexicon: BDAG
  rationale: 형태상 남성 복수이므로 본문 성격을 보존하되, 문맥상 혈육 형제보다 더 넓은 동족성을 염두에 둔 표현입니다.
theological_decisions:
- issue: δικαιοσύνη의 한국어 처리
  chosen_reading: ‘의’의 개념을 직접적인 신학 용어보다 삶의 행위로 드러내는 ‘의의 길’로 번역했습니다.
  alternative_readings:
  - 의로움
  - 정의
  rationale: 이 구절은 법정적 정의 논의가 아니라 토비트의 경건한 삶의 자기증언이므로, 독자가 ‘의’를 삶의 방식으로 이해하도록 하는 번역이 가장 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table for δικαιοσύνη'
