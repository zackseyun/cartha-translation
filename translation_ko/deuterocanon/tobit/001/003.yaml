  rationale: 윤리적 삶의 비유로 쓰인 πορεύομαι의 관용을 살리면서 한국어에서도 자연스럽게 읽히는 표현입니다.
- source_word: δικαιοσύνῃ
  english_pob_choice: righteousness
  chosen_korean: 의의 길
  alternatives_korean:
