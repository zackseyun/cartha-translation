translation:
  language: ko
  text: 나는 내 빵을 굶주린 사람들에게 주고, 내 옷을 벌거벗은 사람들에게 주었습니다[a]. 또 내 친족 가운데 누가 죽어서 니네베 성벽 뒤에 버려져 있는 것을 보면, 나는 그를 묻었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘니네베 성벽 밖에’. 헬라어는 ‘니네베 성벽 뒤에’라고 하며, 성벽 밖으로 버려진 시신들을 가리킬 수 있습니다.
    reason: lexical_alternative
