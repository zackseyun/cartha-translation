  source_fidelity: 수정이 필요합니다. 본문의 ἐδίδουν·ἐθεώρουν·ἔθαπτον은 미완료 과거로, 반복된 관행을 나타내므로 ‘주곤 했습니다/보게 되면/묻어 주곤 했습니다’로 옮기는 것이 적절합니다. 또한 μου(‘내’)는 ἄρτους(‘빵’)만 수식하며 ἱμάτια(‘옷’)에는 없으므로 ‘내 옷’은 삭제해야 합니다.
