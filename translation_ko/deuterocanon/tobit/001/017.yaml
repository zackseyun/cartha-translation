  - 니네베 성벽 뒤편에
  lexicon: LSJ
  rationale: ὀπίσω의 기본 뜻인 ‘뒤에’를 살려 직역하되, 한국어에서는 ‘성벽 뒤에’가 지형 이미지를 가장 자연스럽게 전달합니다.
theological_decisions:
- issue: γένος μου의 범위
  chosen_reading: ‘내 친족’으로 번역해 혈연 집단을 기본으로 하되, 과도하게 ‘가족’으로 좁히지 않았습니다.
  alternative_readings:
  - 내 가족
  - 내 민족
  rationale: 헬라어 γένος는 가족과 친족, 더 넓게는 동족 집단까지 포괄할 수 있으므로, 본문이 허용하는 범위를 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.
