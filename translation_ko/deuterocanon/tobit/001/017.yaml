  - 내 민족 가운데
  - 내 혈족 가운데
  lexicon: LSJ
  rationale: γένος는 혈연과 친족 집단을 아우를 수 있어, 영어의 ‘my kin’처럼 범위를 지나치게 좁히지 않도록 ‘내 친족 가운데’로 옮겼습니다.
- source_word: ὀπίσω τοῦ τείχους Νινευή
