  rationale: γυμνοῖς는 문자적으로 ‘벌거벗은’이지만, 문맥상 옷이 없는 사람들을 가리키므로 한국어에서는 ‘벌거벗은 사람들’이 가장 직접적입니다.
- source_word: ἐκ τοῦ γένους μου
