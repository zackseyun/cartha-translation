  text: I gave my bread to the hungry and clothing to the naked[a], and if I saw any of my kin dead and thrown behind the wall of Nineveh, I buried him.
  footnotes:
  - marker: a
    text: Or 'outside the wall of Nineveh.' The Greek says 'behind the wall of Nineveh,' which may describe bodies cast beyond the city wall.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 내 빵을 굶주린 이들에게 주고, 옷을 헐벗은 이들에게 주곤 했습니다. 또 내 친족 가운데 누군가가 죽어 니네베 성벽 뒤에 버려져 있는 것을 보게 되면[a], 나는 그를 묻어 주곤 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘니네베 성벽 밖에’. 헬라어는 ‘니네베 성벽 뒤에’라고 하며, 성벽 밖으로 버려진 시신들을 가리킬 수 있습니다.
    reason: lexical_alternative
