  source_fidelity: 수정이 필요합니다. 그리스어의 미완료 과거형(ἐδίδουν, ἀπεπρατιζόμην, ἐπορευόμην, ἐδαπάνων)이 나타내는 반복적·습관적 행위가 초안의 단순 과거로 약화되었고, ἐπορευόμην(‘가곤 했습니다’)이 누락되었습니다. 또한 ‘써 버렸습니다’의 ‘버리다’는 원문에 없는 완료·소진의 뉘앙스를 더합니다.
  naturalness: ‘수종드는’은 현대 표준 한국어의 성전 봉사 문맥에서는 다소 고어적이고 부자연스럽습니다. ‘봉사하는’이 현대적이며 원문의 cultic service 의미를 충분히 전달합니다. ‘소출에서 제단을 위해’는 한국어 어순상 어색하므로 ‘소출에서 나온 그것들을 제단을 위하여’로 정리했습니다.
  terminology: ‘아론의 아들들인 제사장들’, ‘레위의 아들들’, ‘십분의 일’은 원문의 명시성과 선택된 번역 방침을 대체로 잘 보존합니다. ‘둘째 십분의 일’도 유지할 수 있습니다. 각주 b는 본문에서 문제 되는 판매/화폐 전환의 해설이 아니라 지명 설명을 제공하므로 영어 POB 감사 기록 및 해당 문맥과 맞지 않아 교체해야 합니다.
