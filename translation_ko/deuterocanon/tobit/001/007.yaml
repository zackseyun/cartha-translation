- from: 그리고 나는 그것들을 아론의 아들들인 제사장들에게, 곧 제단을 위해, 소출에서 주었습니다. 나는 십분의 일을 예루살렘에서 수종드는 레위의 아들들에게 주었고, 둘째 십분의 일은 팔아서 해마다 예루살렘에서 그것을 써 버렸습니다.[a][b]
  to: 그리고 나는 소출에서 나온 그것들을 제단을 위하여 아론의 아들들인 제사장들에게 주곤 했습니다. 나는 예루살렘에서 봉사하는 레위의 아들들에게 십분의 일을 주곤 했고, 둘째 십분의 일은 팔아[a] 해마다 예루살렘으로 가서 그것을 지출하곤 했습니다.[b]
  rationale: 원문의 습관적 미완료 과거를 ‘~하곤 했습니다’로 일관되게 반영하고, 누락된 ‘가곤 했습니다’를 복원했습니다. 불필요한 ‘버리다’의 뉘앙스를 제거했으며, 현대 합쇼체에 맞게 ‘수종드는’을 ‘봉사하는’으로 바꾸었습니다. 각주 표지는 관련 어구 뒤에 두고, 각주 b는 판매/화폐 전환이라는 실제 해석 쟁점을 설명하도록 바로잡았습니다.
