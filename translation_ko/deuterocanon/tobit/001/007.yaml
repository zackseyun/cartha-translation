base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/007.yaml
  text: And I would give them to the priests[a], the sons of Aaron, for the altar, from the produce; I would give the tenth to the sons of Levi who minister in Jerusalem[b], and I would sell the second tenth and go and spend it in Jerusalem each year.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'the tithe' and 'the second tithe.' The Greek reads literally 'the tenth' and 'the second tenth.'
    reason: lexical_alternative
  - marker: b
    text: The verb rendered 'I would sell' can also be understood as converting the second tenth into money before going to Jerusalem to spend it there.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 나는 그것들을 아론의 아들들인 제사장들에게, 곧 제단을 위해, 소출에서 주었습니다. 나는 십분의 일을 예루살렘에서 수종드는 레위의 아들들에게 주었고, 둘째 십분의 일은 팔아서 해마다 예루살렘에서 그것을 써 버렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문의 ‘십분의 일’은 더 관용적으로는 ‘십일조’로 옮길 수 있습니다. 그리스어는 문자적으로 ‘열째’와 ‘둘째 열째’를 말합니다.
    reason: lexical_alternative
  - marker: b
    text: Ἱερουσαλήμ은 여기서 예루살렘을 가리키며, 성전 봉사의 장소를 구체적으로 지시합니다.
    reason: source_note
lexical_decisions:
- source_word: τοῖς ἱερεῦσιν τοῖς υἱοῖς Ἀαρὼν
  english_pob_choice: to the priests, the sons of Aaron
  chosen_korean: 아론의 아들들인 제사장들에게
  alternatives_korean:
  - 아론의 자손인 제사장들에게
  - 아론의 아들 제사장들에게
  lexicon: BDAG
  rationale: 그리스어의 동격 구조를 살려 제사장들을 아론 계열로 명시했습니다.
- source_word: πρὸς τὸ θυσιαστήριον τῶν γενημάτων
  english_pob_choice: for the altar from the produce
  chosen_korean: 제단을 위해, 소출에서
  alternatives_korean:
  - 소출으로부터 제단을 위해
  - 수확물에서 제단을 위해
  lexicon: LSJ
  rationale: 제단과 소출의 관계를 직역에 가깝게 유지하되, 한국어에서는 ‘~를 위해, ~에서’로 자연스럽게 풀었습니다.
- source_word: τὴν δεκάτην
  english_pob_choice: the tenth
  chosen_korean: 십분의 일
  alternatives_korean:
  - 십일조
  - 열째 몫
  lexicon: BDAG
  rationale: 그리스어의 문자적 표현이 ‘열째 몫’이므로, 본문에서는 교회 용어 ‘십일조’보다 더 직접적인 ‘십분의 일’을 택했습니다.
- source_word: τοῖς υἱοῖς Λευεὶ τοῖς θεραπεύουσιν εἰς Ἱερουσαλήμ
  english_pob_choice: to the sons of Levi who minister in Jerusalem
  chosen_korean: 예루살렘에서 수종드는 레위의 아들들에게
  alternatives_korean:
  - 예루살렘에서 섬기는 레위 사람들에게
  - 예루살렘에서 봉사하는 레위의 아들들에게
  lexicon: BDAG
  rationale: cultic 맥락의 θεραπεύω를 ‘수종들다’로 옮겨 성전 봉사의 뉘앙스를 살렸습니다.
- source_word: τὴν δευτέραν δεκάτην ἀπεπρατιζόμην
  english_pob_choice: I would sell the second tenth
  chosen_korean: 둘째 십분의 일은 팔아서
  alternatives_korean:
  - 둘째 십일조는 팔아서
  - 둘째 십분의 일을 돈으로 바꾸어서
  lexicon: LSJ
  rationale: ἀπεπρατιζόμην의 판매·처분 의미를 살려, 뒤의 ‘써 버렸습니다’와 연결되도록 옮겼습니다.
- source_word: ἐδαπάνων αὐτὰ
  english_pob_choice: spend it
  chosen_korean: 그것을 써 버렸습니다
  alternatives_korean:
  - 그것을 소비했습니다
  - 그 돈을 써 버렸습니다
  lexicon: BDAG
  rationale: 매각한 뒤 실제로 지출한다는 흐름을 한국어 동사구로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 두 번째 십분의 일의 처리 방식
  chosen_reading: ‘팔아서 … 써 버렸습니다’로 옮겨, 판매 후 예루살렘에서 지출하는 흐름을 본문에 그대로 드러냈습니다.
  alternative_readings:
  - ‘돈으로 바꾸어 … 썼습니다’
  - ‘처분하여 … 사용했습니다’
  rationale: 그리스어는 단순한 이동이 아니라 판매와 소비의 연속을 말하므로, 의미를 완화하지 않고 드러내는 쪽이 원문에 더 가깝습니다.
  doctrine_reference: 원문 우선, 불필요한 의역 금지
