base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/009.yaml
  text: And when I became a man[a], I took Anna as my wife from the seed of our ancestral family[b], and by her I fathered Tobiah.
  footnotes:
  - marker: a
    text: Or, more smoothly, 'from the lineage of our father's family.' The Greek literally says 'from the seed of our father's family,' emphasizing descent within the paternal line.
    reason: lexical_alternative
  - marker: b
    text: Traditional English often has 'Tobias' here; the Greek name is rendered more directly as 'Tobiah.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 내가 장정이 되었을 때, 나는 우리 조상 집안의 씨에서 나온 안나를 내 아내로 맞아들였고, 그녀에게서 토비아를 낳았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘우리 조상 집안의 씨’입니다. 한국어로는 보다 자연스럽게 ‘우리 조상 집안의 혈통’ 또는 ‘가문’으로 풀 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 토비아는 그리스어 형태를 따라 옮긴 표기입니다. 전통 번역에서는 ‘토비아스’로도 많이 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγενόμην ἀνήρ
  english_pob_choice: I became a man
  chosen_korean: 내가 장정이 되었을 때
  alternatives_korean:
  - 내가 한 사람이 되었을 때
  - 내가 어른이 되었을 때
  - 내가 남자가 되었을 때
  lexicon: BDAG
  rationale: ἀνήρ의 남성적 성인기 표현을 살리되, 한국어에서는 문맥상 자연스러운 ‘장정’으로 옮겨 성인 남성의 삶의 단계라는 뜻을 드러냈습니다.
- source_word: ἔλαβον ... γυναῖκα
  english_pob_choice: I took Anna as my wife
  chosen_korean: 안나를 내 아내로 맞아들였고
  alternatives_korean:
  - 안나를 아내로 삼았고
  - 안나와 결혼했고
  - 안나를 내 아내로 데려왔고
  lexicon: BDAG
  rationale: 그리스어의 혼인 관용구를 직역만 하지 않고, 결혼 행위를 자연스럽게 드러내는 ‘맞아들이다’로 옮겼습니다.
- source_word: ἐκ τοῦ σπέρματος τῆς πατριᾶς ἡμῶν
  english_pob_choice: from the seed of our ancestral family
  chosen_korean: 우리 조상 집안의 씨에서 나온
  alternatives_korean:
  - 우리 조상의 가문에서 나온
  - 우리 아버지 집안의 씨에서 나온
  - 우리 가문에서 나온
  lexicon: BDAG
  rationale: σπέρμα를 단순히 ‘후손’으로 완화하지 않고 ‘씨’로 살려, 혈통과 출계의 뉘앙스를 본문이 지닌 그대로 드러냈습니다.
- source_word: Τωβίαν
  english_pob_choice: Tobiah
  chosen_korean: 토비아
  alternatives_korean:
  - 토비아스
  lexicon: LSJ
  rationale: 그리스어 형태를 직접 반영하는 음역을 따랐고, 전통적 영어/라틴식 이름보다 원문 친화적인 표기를 채택했습니다.
theological_decisions:
- issue: 혈통과 혼인 범위의 강조
  chosen_reading: ‘우리 조상 집안의 씨에서 나온’으로 혈통 내 혼인 배경을 분명히 드러냈습니다.
  alternative_readings:
  - ‘우리 가문에서 나온’으로 완화
  - ‘우리 친족 가운데서’로 일반화
  rationale: 본문은 안나의 출신을 단순한 친족 관계가 아니라 아버지 계열의 혈통 안에 둡니다. 이 강조를 희석하지 않는 것이 서술 의도에 더 충실합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 5
- issue: 성인 남성 진술의 성별 보존
  chosen_reading: ἀνήρ을 중성화하지 않고 남성 성인기를 나타내는 표현으로 옮겼습니다.
  alternative_readings:
  - ‘어른이 되었을 때’
  - ‘성년이 되었을 때’
  rationale: 전기적 서술에서 화자가 남성임을 드러내는 말투를 보존하는 것이 원문의 정보량을 유지합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
