  rationale: 헬라어는 직역하면 ‘니느웨에 있는 사람들 가운데 한 사람’에 가깝습니다. 한국어에서는 성별을 덧붙이지 않고도 자연스럽게 의미를 살릴 수 있어 그 표현을 택했습니다.
