  naturalness: The narrative is generally clear in modern formal-polite Korean. The revision improves the death-threat clause and places each footnote marker directly after the wording to which it pertains, rather than placing both at the end of the verse.
  terminology: ‘니느웨,’ ‘왕,’ ‘몸을 숨겼습니다,’ and ‘물러났습니다’ are appropriate. ‘장사 지내고’ is a natural formal rendering of θάπτω in this context. ‘나를 죽이려고 찾고 있음을’ is idiomatic Korean; the note records the more literal passive form of the Greek.
  issues:
