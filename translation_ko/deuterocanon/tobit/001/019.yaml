  text: But one of the men in Nineveh went and informed the king about me[a], that I was burying them; and I hid myself. Then, realizing that I was being sought to be put to death[b], I withdrew in fear.
  footnotes:
  - marker: a
    text: Or, 'one of those in Nineveh.' The Greek expression is literally 'one of those in Nineveh.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'they were seeking to kill me.' The Greek more literally says, 'I was being sought to be put to death.'
    reason: lexical_alternative
translation:
