  text: 그러나 니느웨에 있는 사람들 가운데 한 사람이[a] 가서 왕에게 내가 그들을 장사 지내고 있다고 알렸습니다. 그래서 나는 몸을 숨겼습니다. 그리고 사람들이 나를 죽이려고 찾고 있음을[b] 알고, 나는 두려워서 물러났습니다.
  philosophy: optimal-equivalence
  footnotes:
