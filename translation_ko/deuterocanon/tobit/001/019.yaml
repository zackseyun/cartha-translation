  rationale: 헬라어는 단순히 ‘죽이려 했다’보다 수동형 ‘찾고 있다’와 죽음의 목적을 함께 드러냅니다. 이 긴장을 보존하기 위해 보다 직역적인 표현을 사용했습니다.
