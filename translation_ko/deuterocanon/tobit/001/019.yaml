  text: But one of the men in Nineveh went and informed the king about me[a], that I was burying them; and I hid myself. Then, realizing that I was being sought to be put to death[b], I withdrew in fear.
  footnotes:
  - marker: a
    text: Or, 'one of those in Nineveh.' The Greek expression is literally 'one of those in Nineveh.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'they were seeking to kill me.' The Greek more literally says, 'I was being sought to be put to death.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 니느웨에 있는 사람들 가운데 한 사람이 가서 왕에게 나에 대해 알렸습니다. 내가 그들을 장사하고 있다고 말한 것입니다. 그래서 나는 몸을 숨겼습니다. 그리고 내가 죽임을 당하도록 찾고 있다는 것을 알아차리자, 나는 두려워서 물러났습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘니느웨에 있는 사람들 가운데 한 사람’. 헬라어 표현을 더 직역하면 ‘니느웨에 있는 사람들 가운데 한 사람’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 나를 죽이려 하고 있었다’. 헬라어는 더 문자적으로 ‘나는 죽임을 당하도록 찾고 있었다’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς τῶν ἐν Νινευὴ
