    text: 또는 ‘니느웨에 있는 사람들 가운데 한 사람’. 헬라어 표현을 더 직역하면 ‘니느웨에 있는 사람들 가운데 한 사람’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 죽임을 당하도록 수배되고 있음을’. 헬라어는 더 문자적으로 ‘나는 죽임을 당하도록 찾고 있었다’라고 말합니다.
    reason: lexical_alternative
