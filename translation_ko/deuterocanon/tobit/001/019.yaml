    issue: The clause ‘내가 죽임을 당하도록 찾고 있다는’ has an invalid subject relation and does not clearly communicate that others were seeking Tobit.
    rationale: 'ζητοῦμαι ἀποθανεῖν means that Tobit was being sought in connection with his death—contextually, people were seeking him to kill him. Korean requires the seekers to be expressed or naturally implied: ‘나를 죽이려고 찾고 있음을.’'
  - severity: low
    issue: Footnote markers [a] and [b] are both placed at the verse end rather than anchored to their respective expressions.
