base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/011.yaml
  text: For almsgiving is a good gift for all who do it before the Most High[a].
  footnotes:
  - marker: a
    text: Or 'a good offering'; the Greek word can denote a gift generally and in some contexts an offering.
    reason: lexical_alternative
translation:
  language: ko
  text: 구제는 지극히 높으신 분 앞에서 그것을 행하는 모든 사람에게 좋은 선물입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘좋은 예물’. 헬라어 δῶρον은 일반적인 선물을 뜻할 수도 있고, 어떤 문맥에서는 예물을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δῶρον
  english_pob_choice: gift
  chosen_korean: 선물
  alternatives_korean:
  - 예물
  - 헌물
  lexicon: BDAG
  rationale: δῶρον은 일반적으로 ‘선물’ 또는 ‘예물’이 될 수 있지만, 여기서는 자선행위의 가치를 말하는 지혜 문맥이므로 제의적 뉘앙스가 강한 ‘예물/헌물’보다 일반적인 ‘선물’이 더 자연스럽습니다.
- source_word: ἐλεημοσύνη
  english_pob_choice: almsgiving
  chosen_korean: 알곡 나눔
  alternatives_korean:
  - 구제
  - 자선
  lexicon: BDAG
  rationale: ἐλεημοσύνη는 단순한 자비심이 아니라 가난한 이들에게 실제로 베푸는 나눔을 가리키므로, 보다 구체적인 행위성을 살려 ‘알곡 나눔’으로 옮겼습니다.
- source_word: πᾶσι τοῖς ποιοῦσιν αὐτήν
  english_pob_choice: for all who do it
  chosen_korean: 실천하는 모든 사람에게
  alternatives_korean:
  - 행하는 모든 사람에게
  - 하는 모든 사람에게
  lexicon: BDAG
  rationale: ποιέω+αὐτήν의 직역은 ‘그것을 하는’이지만, 한국어에서는 윤리적·반복적 행위를 나타내는 ‘실천하다’가 가장 자연스럽고 의미를 분명히 드러냅니다.
- source_word: ἐνώπιον τοῦ ὑψίστου
  english_pob_choice: before the Most High
  chosen_korean: 지극히 높으신 분 앞에서
  alternatives_korean:
  - 지극히 높으신 분의 눈앞에서
  - 가장 높으신 분 앞에서
  lexicon: BDAG
  rationale: ἐνώπιον은 ‘~앞에서/눈앞에서’의 관계적 표현이므로, 존칭을 살린 ‘지극히 높으신 분 앞에서’로 옮겨 하나님의 임재 앞이라는 의미를 보존했습니다.
- source_word: τοῦ ὑψίστου
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 가장 높으신 분
  - 높으신 하나님
  lexicon: BDAG
  rationale: τοῦ ὑψίστου는 유대계 그리스어의 표준적 신칭이므로, ‘가장 높으신 분’보다 예배적 존칭이 분명한 ‘지극히 높으신 분’으로 번역했습니다.
theological_decisions:
- issue: δῶρον(선물/예물)의 의미 범위
  chosen_reading: 이 구절은 자선의 실천을 하나님 앞에서 가치 있는 것으로 칭찬하며, 공로론이나 제의적 속죄 개념으로 확장하지 않습니다.
  alternative_readings:
  - ‘예물’로 읽어 제의적 헌신을 강조하기
  - 구제의 공로를 직접 암시하는 표현으로 강화하기
  rationale: 헬라어는 단순히 ‘좋은 δῶρον’이라고 말할 뿐이므로, 번역도 그 긍정적 평가를 유지하되 문맥 밖의 신학을 덧붙이지 않도록 했습니다.
  doctrine_reference: 원문 우선, 의미 확장 자제
- issue: 공적 자선의 행위성
  chosen_reading: ‘실천하는’으로 옮겨 반복적이고 의식적인 행위를 드러냈습니다.
  alternative_readings:
  - ‘하는’으로 더 직역하기
  - ‘행하는’으로 중립적으로 옮기기
  rationale: 이 문맥은 단발적 행위보다 지속적으로 베푸는 자선의 성격을 강조하므로, 한국어에서 그 지속성과 윤리성을 살리는 표현을 택했습니다.
  doctrine_reference: 지혜문학적 권면의 행위성
