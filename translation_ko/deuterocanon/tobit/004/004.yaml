base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/004.yaml
  text: And do what is pleasing to her[a], and do not grieve her. Remember, child, that she faced many dangers because of you while you were in the womb; when she dies[b], bury her beside me in one grave.
  footnotes:
  - marker: a
    text: Greek literally, 'she has seen many dangers because of you in the womb,' an idiom referring to the dangers she underwent during pregnancy and childbirth.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the same tomb.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그녀가 기뻐하는 일을 하며, 그녀를 슬프게 하지 마십시오. 아이야, 네가 태중에 있을 때 그녀가 네 때문에 많은 위험을 겪었음을 기억하십시오.[a] 그녀가 죽으면, 그녀를 나와 함께 한 무덤에 묻어 주십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘그녀가 네 때문에 태중에서 많은 위험을 보았다’라고 말합니다. 이는 임신과 출산 중 그녀가 겪은 위험을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘같은 무덤에’.
    reason: alternative_reading
lexical_decisions:
- source_word: ποίηει τὸ ἀρεστὸν αὐτῇ
  english_pob_choice: do what is pleasing to her
  chosen_korean: 그에게 기쁜 일을 하며
  alternatives_korean:
  - 그가 기뻐하는 일을 하며
  - 그에게 맞는 일을 하며
  lexicon: LXX Greek ἀρεστός; POB English audit trail
  rationale: ἀρεστός는 ‘기쁜, 마음에 드는, 만족스러운’ 뜻이므로 한국어에서는 자연스럽게 ‘기쁜 일을 하다’로 옮겨 그녀의 만족을 살렸습니다.
- source_word: μὴ λυπήσῃς αὐτήν
  english_pob_choice: do not grieve her
  chosen_korean: 그를 근심하게 하지 마십시오
  alternatives_korean:
  - 그를 슬프게 하지 마십시오
  - 그를 괴롭게 하지 마십시오
  lexicon: LXX Greek λυπέω; POB English audit trail
  rationale: λυπέω는 슬픔을 주다/근심하게 하다의 뜻이므로, 직접적이고 현대적인 ‘근심하게 하지 마십시오’가 감정적 무게를 잘 보존합니다.
- source_word: μνήσθητι, παιδίον
  english_pob_choice: Remember, child
  chosen_korean: 아이야, ... 기억하십시오
  alternatives_korean:
  - 내 아이야, ... 기억하십시오
  - 아들아, ... 기억하십시오
  lexicon: LXX Greek παιδίον; POB English audit trail
  rationale: παιδίον은 애정 어린 호칭이지만 소유격이 없으므로 ‘아이야’가 가장 절제된 대응입니다. 문맥상 권면형을 살려 ‘기억하십시오’로 옮겼습니다.
- source_word: πολλοὺς κινδύνους ἑόρακεν ἐπὶ σοὶ ἐν τῇ κοιλίᾳ
  english_pob_choice: she faced many dangers because of you while you were in the womb
  chosen_korean: 네가 태중에 있을 때 그가 네 때문에 많은 위험을 겪었음을
  alternatives_korean:
  - 태중에서 네 일로 많은 위험을 보았음을
  - 네 때문에 태중에서 많은 위험을 겪었음을
  lexicon: LXX Greek ἑόρακεν, ἐπὶ σοὶ, ἐν τῇ κοιλίᾳ; POB English audit trail
  rationale: 직역하면 ‘많은 위험을 보았다’이지만, 한국어에서는 위험을 ‘겪다’가 관용적입니다. ἐν τῇ κοιλίᾳ는 ‘태중에 있을 때’로 풀어 임신·출산의 맥락을 드러냈습니다.
- source_word: ὅταν ἀποθάνῃ
  english_pob_choice: when she dies
  chosen_korean: 그가 죽으면
  alternatives_korean:
  - 그가 죽을 때
  - 그가 죽거든
  lexicon: LXX Greek ὅταν + aorist subjunctive; POB English audit trail
  rationale: 미래의 확정적 사건을 가리키므로 한국어에서는 자연스럽게 ‘-으면’ 절로 옮겼습니다.
- source_word: θάψον αὐτὴν παρʼ ἐμοὶ ἐν ἑνὶ τάφῳ
  english_pob_choice: bury her beside me in one grave
  chosen_korean: 나와 함께 한 무덤에 그를 묻어 주십시오
  alternatives_korean:
  - 내 곁의 한 무덤에 그를 묻어 주십시오
  - 같은 무덤에 그를 내 옆에 묻어 주십시오
  lexicon: LXX Greek παρά + dative; ἑνὶ τάφῳ; POB English audit trail
  rationale: παρʼ ἐμοὶ는 ‘내 곁에/나와 함께’의 근접을 뜻하므로, 장례 맥락에서 ‘나와 함께 한 무덤에’가 가장 분명합니다. ἑνὶ τάφῳ는 ‘한 무덤’으로 직관적으로 살렸습니다.
theological_decisions:
- issue: 태중(임신·출산) 표현의 직접성
  chosen_reading: ‘네가 태중에 있을 때’로 직역해 어머니가 임신과 출산에서 겪은 위험을 드러냈습니다.
  alternative_readings:
  - ‘네가 뱃속에 있을 때’
  - ‘네 어머니가 너를 잉태했을 때’
  rationale: 본문의 ἐν τῇ κοιλίᾳ는 단순한 장소가 아니라 임신의 위험을 가리키는 관용구이므로, 이를 약화하지 않고 한국어에서 이해 가능한 표현으로 보존했습니다.
  doctrine_reference: 'POB translation philosophy: source-direct, auditable equivalence'
