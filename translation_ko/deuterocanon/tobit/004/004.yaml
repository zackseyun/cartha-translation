  to: 그리고 그녀가 기뻐하는 일을 하며, 그녀를 슬프게 하지 마십시오. 아이야, 네가 태중에 있을 때 그녀가 네 때문에 많은 위험을 겪었음을 기억하십시오.[a] 그녀가 죽으면, 그녀를 나와 함께 한 무덤에 묻어 주십시오.[b]
