  source_fidelity: 그리스어의 여성 단수 대명사 αὐτῇ/αὐτήν을 초안이 일관되게 남성인 ‘그’로 옮긴 것은 본문상 중대한 오류입니다. 또한 ‘그에게 기쁜 일을 하다’는 ‘그녀가 기뻐하는/그녀에게 기쁜’이라는 뜻을 충분히 전달하지 못합니다. 수정문은 어머니를 가리키는 여성 지시를 일관되게 반영하고, 임신 중 위험이라는 관용적 맥락과 공동 매장의 의미를 보존합니다.
  naturalness: ‘그녀가 기뻐하는 일을 하며’, ‘그녀를 슬프게 하지 마십시오’, ‘그녀를 나와 함께 한 무덤에 묻어 주십시오’가 현대 표준어 합쇼체에서 자연스럽고 명료합니다. 호칭 ‘아이야’와 명령형 ‘기억하십시오’는 문헌 번역의 직접 권면으로 유지할 수 있습니다.
  terminology: ἀρεστόν은 ‘그녀가 기뻐하는 일’, λυπέω는 ‘슬프게 하다’로 옮겼습니다. κινδύνους ἑόρακεν은 한국어 관용에 맞게 ‘많은 위험을 겪었다’로 번역하되, 각주에서 그리스어의 문자적 표현을 제시했습니다. ἐν ἑνὶ τάφῳ는 ‘한 무덤에’로 유지하고, 대안 ‘같은 무덤에’를 각주로 제시했습니다.
  issues:
  - severity: high
    issue: 여성 단수 대명사 αὐτῇ 및 αὐτήν이 ‘그/그를’로 번역되었습니다.
    rationale: 이 절의 대상은 토빗의 어머니이며, 그리스어는 모든 해당 대명사에서 여성형을 사용합니다. 한국어에서는 ‘그녀/그녀를’로 바로잡아야 합니다.
  - severity: medium
    issue: ‘그에게 기쁜 일을 하며’는 τὸ ἀρεστὸν αὐτῇ의 의미를 부정확하게 표현합니다.
    rationale: 본문은 ‘그녀에게 기쁜 것, 곧 그녀가 기뻐하는 일을 하라’는 뜻이지 단순히 ‘그녀를 위해 기쁜 일을 하라’는 뜻이 아닙니다.
