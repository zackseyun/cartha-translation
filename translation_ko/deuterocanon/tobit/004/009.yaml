translation:
  language: ko
  text: 이는 당신이 어려움의 날을 위하여 자신을 위해 좋은 보화를 쌓아 두고 있기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘필요의 날’, ‘곤경의 때’, 또는 ‘환난의 날’. 이 그리스어 표현은 폭넓은 뜻을 지니며, 긴급한 필요나 고난을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: θέμα
  english_pob_choice: a good treasure
  chosen_korean: 좋은 보화
  alternatives_korean:
  - 좋은 저장물
  - 좋은 축적물
  - 좋은 비축
  lexicon: LSJ
  rationale: θήσαυρίζεις와 함께 쓰인 θέμα의 ‘쌓아 둔 것/저장된 것’ 의미를 살리면서, POB의 ‘treasure’에 대응하는 자연스러운 한국어로 ‘보화’를 택했습니다.
- source_word: ἀγαθὸν
  english_pob_choice: good
  chosen_korean: 좋은
  alternatives_korean:
  - 유익한
  - 가치 있는
  lexicon: BDAG
  rationale: 저장된 것의 성격을 단순하고 직접적으로 수식하므로, 과도한 해석 없이 ‘좋은’으로 옮겼습니다.
- source_word: θησαυρίζεις
  english_pob_choice: you are storing up
  chosen_korean: 쌓아 두는 것입니다
  alternatives_korean:
  - 저축하는 것입니다
  - 간직하는 것입니다
  - 축적하는 것입니다
  lexicon: BDAG
  rationale: 현재 진행의 누적적 행위를 살리면서, 비유적 ‘보화 쌓기’의 이미지를 한국어에서 자연스럽게 전달하는 표현으로 옮겼습니다.
- source_word: εἰς ἡμέραν ἀνάγκης
  english_pob_choice: for a day of need
  chosen_korean: 필요한 날에
  alternatives_korean:
  - 궁핍한 날을 위해
  - 환난의 날에
  - 곤고한 날에
  lexicon: BDAG
  rationale: ἡμέρα ἀνάγκης의 범위가 넓어 단정적 한정어보다, ‘필요/곤란/곤경’까지 포괄하는 자연스러운 표현으로 처리했습니다.
theological_decisions:
- issue: εἰς ἡμέραν ἀνάγκης의 범위
  chosen_reading: ‘필요한 날’로 옮겨, 급박한 필요와 곤란의 폭넓은 의미를 열어 둡니다.
  alternative_readings:
  - 궁핍한 날
  - 환난의 날
  - 곤고한 날
  rationale: 원문은 특정 상황을 좁혀 말하지 않으므로, 구체적 고난으로 단정하지 않고 의미 범위를 유지하는 것이 본문 충실성에 부합합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
