base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/013.yaml
  text: And now[a], child, love your brothers, and do not become proud in your heart over your brothers and the sons and daughters of your people, so as to take a wife for yourself from among them. For in pride there is ruin and much disorder, and in uselessness there is decline and great want[b]; for uselessness is the mother of famine.
  footnotes:
  - marker: a
    text: Or, 'do not be haughty toward your brothers and the sons and daughters of your people when taking a wife for yourself from among them.' The Greek syntax is compressed, and the relation between the warning against pride and the marriage clause can be understood in more than one way.
    reason: alternative_reading
  - marker: b
    text: '''Idleness'' could also be rendered ''sloth'' or, less likely in this context, ''worthlessness.'' The surrounding lines about decline, want, and famine favor the sense of laziness or unproductive inactivity.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이제, 아이야, 네 형제들을 사랑하십시오. 네 형제들과 네 민족의 아들딸들보다 마음이 교만해져 그들 가운데서 아내를 맞이하려 하지 마십시오.[a] 교만에는 파멸과 큰 혼란이 있고, 게으름에는 쇠락과 큰 궁핍이 있습니다.[b] 게으름은 기근의 어머니이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그들 가운데서 아내를 맞이할 때 네 형제들과 네 민족의 아들딸들을 향하여 마음에 교만해지지 마십시오.’ 그리스어 문장은 압축되어 있어, 교만에 대한 경고와 혼인 절의 관계를 여러 방식으로 이해할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘게으름’은 ‘나태함’으로도 옮길 수 있으며, 덜 가능하게는 ‘무익함’ 또는 ‘무가치함’으로도 옮길 수 있습니다. 앞뒤의 쇠락, 궁핍, 기근이라는 표현은 비생산적 태만의 뜻을 지지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίον
  english_pob_choice: child
  chosen_korean: 아이야
  alternatives_korean:
  - 자녀야
  - 아이
  lexicon: BDAG
  rationale: 친밀한 직접 호칭을 살리면서도 현대 한국어에서 자연스럽게 들리도록 했습니다. '자녀야'는 지나치게 가정적이고, 단순한 '아이'는 호격의 직접성이 약합니다.
- source_word: ὑπερηφάνευε τῇ καρδίᾳ σου
  english_pob_choice: do not become proud in your heart
  chosen_korean: 마음이 교만해지지 마십시오
  alternatives_korean:
  - 마음에 교만하지 마십시오
  - 마음속에서 높아지지 마십시오
  lexicon: BDAG
  rationale: 내면의 태도를 가리키는 표현이므로 '마음'을 유지했고, 금지 명령은 현대 합쇼체로 자연스럽게 풀었습니다. '교만해지지'가 원문의 도덕적 동작을 가장 सीधे하게 드러냅니다.
- source_word: ἀπὸ τῶν ἀδελφῶν σου καὶ τῶν υἱῶν καὶ θυγατέρων τοῦ λαοῦ σου
  english_pob_choice: over your brothers and the sons and daughters of your people
  chosen_korean: 네 형제들과 네 민족의 아들딸들 위에
  alternatives_korean:
  - 네 형제들과 네 민족의 아들딸들을 향해
  - 네 형제들과 네 민족의 아들딸들로부터
  lexicon: BDAG
  rationale: ἀπό를 여기서는 단순한 분리보다 타인 위에 자신을 높이는 뜻으로 이해해 '위에'로 옮겼습니다. '아들딸들'은 남성복수만으로 평탄화하지 않고 원문의 확장된 병렬을 살립니다.
- source_word: λαβεῖν σεαυτῷ ἐξ αὐτῶν γυναῖκα
  english_pob_choice: so as to take a wife for yourself from among them
  chosen_korean: 그들 가운데서 아내를 맞이하려는 것입니다
  alternatives_korean:
  - 그들 가운데서 아내를 취하려는 것입니다
  - 그들 가운데서 아내를 맞아들이려는 것입니다
  lexicon: BDAG
  rationale: 부정문 뒤의 목적/결과 관계를 한국어로 자연스럽게 연결했습니다. '아내를 맞이하다'는 혼인 의도를 드러내면서도 지나친 구어체를 피합니다.
- source_word: ἀχρειότης
  english_pob_choice: idleness
  chosen_korean: 무익함
  alternatives_korean:
  - 게으름
  - 나태함
  - 무가치함
  lexicon: BDAG
  rationale: 이 단어는 본문 맥락에 따라 '게으름'으로도 가능하지만, POB의 최신 판독은 무익성/비생산성을 더 강하게 반영합니다. '무익함'이 뒤의 쇠락·궁핍·기근과 가장 잘 맞습니다.
theological_decisions:
- issue: 혼인 조항의 압축된 의미
  chosen_reading: 번역은 '그들 가운데서 아내를 맞이하려는 것입니다'로 옮겨, 경고가 교만과 혼인 선택의 관계를 압축적으로 말한다는 긴장을 그대로 둡니다.
  alternative_readings:
  - 이 구절을 '친족 안에서 결혼하라'는 직접 명령으로 더 분명히 풀 수 있습니다.
  - 교만에 대한 경고만 강조하고 혼인 절은 부차적으로 처리할 수도 있습니다.
  rationale: 그리스어는 문장 구조가 압축되어 있어 관계를 단정적으로 풀어버리면 본문의 긴장이 사라집니다. 그래서 의미를 넓히거나 좁히지 않고 원문의 결합을 유지했습니다.
  doctrine_reference: 본문의 긴장을 보존하고 과도한 해석을 피함.
