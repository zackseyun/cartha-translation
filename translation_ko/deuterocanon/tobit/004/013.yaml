  rationale: 이 단어는 본문 맥락에 따라 '게으름'으로도 가능하지만, POB의 최신 판독은 무익성/비생산성을 더 강하게 반영합니다. '무익함'이 뒤의 쇠락·궁핍·기근과 가장 잘 맞습니다.
theological_decisions:
- issue: 혼인 조항의 압축된 의미
  chosen_reading: 번역은 '그들 가운데서 아내를 맞이하려는 것입니다'로 옮겨, 경고가 교만과 혼인 선택의 관계를 압축적으로 말한다는 긴장을 그대로 둡니다.
  alternative_readings:
  - 이 구절을 '친족 안에서 결혼하라'는 직접 명령으로 더 분명히 풀 수 있습니다.
  - 교만에 대한 경고만 강조하고 혼인 절은 부차적으로 처리할 수도 있습니다.
  rationale: 그리스어는 문장 구조가 압축되어 있어 관계를 단정적으로 풀어버리면 본문의 긴장이 사라집니다. 그래서 의미를 넓히거나 좁히지 않고 원문의 결합을 유지했습니다.
  doctrine_reference: 본문의 긴장을 보존하고 과도한 해석을 피함.
