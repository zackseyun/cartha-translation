  rationale: 내면의 태도를 가리키는 표현이므로 '마음'을 유지했고, 금지 명령은 현대 합쇼체로 자연스럽게 풀었습니다. '교만해지지'가 원문의 도덕적 동작을 가장 सीधे하게 드러냅니다.
- source_word: ἀπὸ τῶν ἀδελφῶν σου καὶ τῶν υἱῶν καὶ θυγατέρων τοῦ λαοῦ σου
  english_pob_choice: over your brothers and the sons and daughters of your people
  chosen_korean: 네 형제들과 네 민족의 아들딸들 위에
  alternatives_korean:
  - 네 형제들과 네 민족의 아들딸들을 향해
  - 네 형제들과 네 민족의 아들딸들로부터
  lexicon: BDAG
  rationale: ἀπό를 여기서는 단순한 분리보다 타인 위에 자신을 높이는 뜻으로 이해해 '위에'로 옮겼습니다. '아들딸들'은 남성복수만으로 평탄화하지 않고 원문의 확장된 병렬을 살립니다.
- source_word: λαβεῖν σεαυτῷ ἐξ αὐτῶν γυναῖκα
  english_pob_choice: so as to take a wife for yourself from among them
  chosen_korean: 그들 가운데서 아내를 맞이하려는 것입니다
  alternatives_korean:
  - 그들 가운데서 아내를 취하려는 것입니다
  - 그들 가운데서 아내를 맞아들이려는 것입니다
  lexicon: BDAG
  rationale: 부정문 뒤의 목적/결과 관계를 한국어로 자연스럽게 연결했습니다. '아내를 맞이하다'는 혼인 의도를 드러내면서도 지나친 구어체를 피합니다.
- source_word: ἀχρειότης
  english_pob_choice: idleness
  chosen_korean: 무익함
  alternatives_korean:
