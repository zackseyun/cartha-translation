base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/001.yaml
  text: On that day Tobit remembered the silver that he had deposited with Gabael in Rages of Media[a][b].
  footnotes:
  - marker: a
    text: Or 'the money'; Greek 'the silver' can refer to coined or weighed money.
    reason: lexical_alternative
  - marker: b
    text: '''Rages'' is also commonly rendered ''Rhages.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그날 토빗은 메대의 라게스에서 가바엘에게 맡겨 둔 은을 기억하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘돈을’. 그리스어 ‘은’은 주화나 무게로 달아 거래한 돈을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘라게스’는 영어로 ‘Rhages’라고도 표기합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν τῇ ἡμέρᾳ ἐκείνῃ
  english_pob_choice: On that day
  chosen_korean: 그날에
  alternatives_korean:
  - 그날
  - 그때에
  lexicon: LSJ
  rationale: 특정성을 지닌 시간 표현으로, 현대 한국어에서 자연스럽고 원문의 지시성을 유지하는 표현은 ‘그날에’입니다.
- source_word: ἐμνήσθη
  english_pob_choice: remembered
  chosen_korean: 기억하였습니다
  alternatives_korean:
  - 생각해 냈습니다
  - 떠올렸습니다
  lexicon: BDAG
  rationale: 단순한 회상이 아니라 이미 알고 있던 사실을 문맥상 다시 떠올리는 의미이므로, ‘기억하였습니다’가 가장 무난합니다.
- source_word: περὶ τοῦ ἀργυρίου
  english_pob_choice: the silver
  chosen_korean: 은을
  alternatives_korean:
  - 돈을
  - 은화을
  - 은전금을
  lexicon: LSJ
  rationale: ἀργύριον이 문자적으로는 ‘은’이지만 화폐를 가리킬 수도 있으므로, 본문은 원문 표면을 살려 ‘은을’로 두고 이해 가능성을 유지합니다.
- source_word: ὃ παρέθετο
  english_pob_choice: that he had deposited
  chosen_korean: 맡겨 둔
  alternatives_korean:
  - 예탁한
  - 맡긴
  - 저축해 둔
  lexicon: LSJ
  rationale: παρατίθημι는 여기서 타인에게 금전을 신탁·보관시키는 뜻이므로, 한국어에서는 ‘맡겨 둔’이 가장 자연스럽고 의미를 잘 드러냅니다.
theological_decisions:
- issue: 지명 표기(Ῥάγοις τῆς Μηδίας)
  chosen_reading: 메대의 라게스
  alternative_readings:
  - 메디아의 라게스
  - 라게스, 메대 지방
  rationale: 지명은 음역을 따르되, τῆς Μηδίας는 속격 관계를 살려 ‘메대의’로 옮겨 지역 소속을 분명히 했습니다.
  doctrine_reference: 지리·역사 배경의 투명한 전달
- issue: ‘silver’의 화폐 가능성
  chosen_reading: 은을
  alternative_readings:
  - 돈을
  - 은돈을
  rationale: 본문은 실제로 ‘은’을 말하지만 화폐를 포괄할 수 있는 긴장을 지니므로, 해석을 좁히지 않고 원문 표면을 보존했습니다.
  doctrine_reference: 원문 어휘의 다의성 보존
