  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ἐκ τοῦ ἄρτου/ἐκ τῶν ἱματίων의 분여·나눔의 뜻은 한국어에서 ‘빵에서/옷에서 주다’보다 목적어를 명시해 옮기는 편이 정확하고 자연스럽습니다. 마지막 ‘눈’ 관용구의 문맥적 뜻은 단순한 타인에 대한 시기보다 베풂을 아까워하거나 인색하게 여기는 데 있습니다.
  naturalness: ‘네 빵에서 … 주고, 네 옷에서 … 주십시오’는 조사와 문장 연결이 부자연스럽고, ‘네 눈이 시기하지 않게 하십시오’는 현대 한국어에서 눈이 무엇을 시기하는지 불명확합니다. 합쇼체에 맞추어 명령문의 연결과 종결을 정돈하고, 관용구의 뜻을 자연스럽게 표현하는 것이 좋습니다.
  terminology: ἐλεημοσύνη는 이 문맥에서 가난한 이에게 하는 구체적 구제를 가리키므로 ‘자선을 베풀다’는 적절합니다. ‘벌거벗은 이’도 γυμνοῖς의 직역적 표현으로 유지할 수 있습니다.
