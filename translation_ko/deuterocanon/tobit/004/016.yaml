  text: Give from your bread to the hungry[a], and from your clothing to the naked. Whatever may abound to you, do as almsgiving[b], and do not let your eye be envious when you do almsgiving.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'Whatever you have in abundance, give as alms.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'do not let your eye be envious'; that is, do not begrudge giving alms.
    reason: lexical_alternative
translation:
  language: ko
  text: 네 빵을 굶주린 이에게 나누어 주고, 네 옷을 벌거벗은 이에게 주십시오. 네게 남는 것은 무엇이든지 자선으로 베푸십시오.[a] 자선을 베풀 때 아까워하지 마십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘네게 풍족해지는 것은 무엇이든지’입니다. 곧 자신에게 남아도는 것으로 자선을 베풀라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘자선을 베풀 때 네 눈이 시기하지 않게 하라’입니다. 여기서 ‘눈’은 베풂을 아까워하거나 인색하게 여기는 태도를 가리키는 관용적 표현입니다.
    reason: lexical_alternative
