  text: Give from your bread to the hungry[a], and from your clothing to the naked. Whatever may abound to you, do as almsgiving[b], and do not let your eye be envious when you do almsgiving.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'Whatever you have in abundance, give as alms.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'do not let your eye be envious'; that is, do not begrudge giving alms.
    reason: lexical_alternative
translation:
  language: ko
  text: 네 빵에서 굶주린 이에게 주고, 네 옷에서 벌거벗은 이에게 주십시오. 네게 남는 것이 무엇이든지 그것으로 자선을 행하십시오. 그리고 자선을 행할 때 네 눈이 시기하지 않게 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘네게 남아도는 것이 무엇이든지’; 곧 남는 것을 가난한 이에게 자선으로 주라는 뜻입니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘네 눈이 시기하지 않게 하라’; 곧 베풀기를 아끼거나 인색해하지 말라는 뜻입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τοῦ ἄρτου σου δίδου
  english_pob_choice: Give from your bread
  chosen_korean: 네 빵에서 주십시오
  alternatives_korean:
  - 네 빵을 나누어 주십시오
  - 네 음식에서 주십시오
  lexicon: LXX/BDAG
  rationale: ἐκ는 출처를 나타내므로 ‘에서’로 살렸고, ἄρτος는 문자적으로 ‘빵’이어서 기본 의미를 유지했습니다.
- source_word: πεινῶντι
  english_pob_choice: to the hungry
  chosen_korean: 굶주린 이에게
  alternatives_korean:
  - 배고픈 이에게
  - 굶주린 사람에게
  lexicon: LXX/BDAG
  rationale: 현재분사 명사적 용법으로, 결핍한 사람의 부류를 가리키므로 자연스러운 명사구로 옮겼습니다.
- source_word: ἐκ τῶν ἱματίων σου
  english_pob_choice: from your clothing
  chosen_korean: 네 옷에서
  alternatives_korean:
  - 네 의복에서
  - 네 겉옷에서
  lexicon: LXX/BDAG
  rationale: ἱμάτια는 의복/옷가지 전체를 가리킬 수 있어, 현대 한국어에서는 가장 직관적인 ‘옷’으로 옮겼습니다.
- source_word: πᾶν ὃ ἐὰν περισσεύσῃ σοι
  english_pob_choice: Whatever may abound to you
  chosen_korean: 네게 남는 것이 무엇이든지
  alternatives_korean:
  - 네게 풍족한 것이 무엇이든지
  - 네게 남아도는 것이 무엇이든지
  lexicon: LXX/BDAG
  rationale: perisseuō의 핵심은 ‘남다/넘치다/풍족하다’이므로, 문맥상 남는 잉여를 분명히 드러냈습니다.
- source_word: ποίει ἐλεημοσύνην
  english_pob_choice: do as almsgiving
  chosen_korean: 자선을 행하십시오
  alternatives_korean:
  - 구제를 하십시오
  - 구제 행위를 하십시오
  lexicon: LXX/BDAG
  rationale: ἐλεημοσύνη는 가난한 이에게 베푸는 구체적 시혜를 뜻하므로, 한국어에서는 관용적으로 이해되는 ‘자선/구제’로 옮겼습니다. 동사 ποιέω의 행위성을 살려 ‘행하다’를 사용했습니다.
- source_word: μὴ φθονεσάτω σου ὁ ὀφθαλμός
  english_pob_choice: do not let your eye be envious
  chosen_korean: 네 눈이 시기하지 않게 하십시오
  alternatives_korean:
  - 네 눈이 시샘하지 않게 하십시오
  - 네가 아끼는 마음을 품지 않게 하십시오
  lexicon: LXX/BDAG
  rationale: 직역 이미지인 ‘눈’의 의인화를 유지하되, 한국어에서는 ‘시기하다/시샘하다’가 의미를 가장 가깝게 전달합니다.
theological_decisions:
- issue: ἐλεημοσύνη의 번역과 유대지혜문학적 뉘앙스
  chosen_reading: ‘자선’으로 번역해 가난한 이에게 베푸는 실제적 나눔을 강조했습니다.
  alternative_readings:
  - ‘구제’
  - ‘선행’
  rationale: 이 문맥의 ἐλεημοσύνη는 추상적 ‘자비’보다 실제적 분배와 나눔을 가리키므로, 행위 중심의 한국어를 택했습니다.
  doctrine_reference: 번역 철학 §1, §5
- issue: ‘눈’이 시기하는 표현의 유지
  chosen_reading: 원문 이미지를 살려 ‘네 눈이 시기하지 않게 하십시오’로 옮겼습니다.
  alternative_readings:
  - ‘아끼지 말고 주십시오’
  - ‘인색해지지 않게 하십시오’
  rationale: 원문의 수사적 긴장을 보존하기 위해 눈의 의인화를 유지했습니다. 독해를 돕기 위해 의미는 한국어로 자연스럽게 풀었습니다.
  doctrine_reference: 번역 철학 §3, §6
