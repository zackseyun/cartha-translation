  rationale: ἐλεημοσύνη는 가난한 이에게 베푸는 구체적 시혜를 뜻하므로, 한국어에서는 관용적으로 이해되는 ‘자선/구제’로 옮겼습니다. 동사 ποιέω의 행위성을 살려 ‘행하다’를 사용했습니다.
- source_word: μὴ φθονεσάτω σου ὁ ὀφθαλμός
  english_pob_choice: do not let your eye be envious
  chosen_korean: 네 눈이 시기하지 않게 하십시오
  alternatives_korean:
  - 네 눈이 시샘하지 않게 하십시오
