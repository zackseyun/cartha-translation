  lexicon: LXX/BDAG
  rationale: 직역 이미지인 ‘눈’의 의인화를 유지하되, 한국어에서는 ‘시기하다/시샘하다’가 의미를 가장 가깝게 전달합니다.
theological_decisions:
- issue: ἐλεημοσύνη의 번역과 유대지혜문학적 뉘앙스
  chosen_reading: ‘자선’으로 번역해 가난한 이에게 베푸는 실제적 나눔을 강조했습니다.
  alternative_readings:
  - ‘구제’
  - ‘선행’
  rationale: 이 문맥의 ἐλεημοσύνη는 추상적 ‘자비’보다 실제적 분배와 나눔을 가리키므로, 행위 중심의 한국어를 택했습니다.
  doctrine_reference: 번역 철학 §1, §5
- issue: ‘눈’이 시기하는 표현의 유지
  chosen_reading: 원문 이미지를 살려 ‘네 눈이 시기하지 않게 하십시오’로 옮겼습니다.
  alternative_readings:
  - ‘아끼지 말고 주십시오’
  - ‘인색해지지 않게 하십시오’
  rationale: 원문의 수사적 긴장을 보존하기 위해 눈의 의인화를 유지했습니다. 독해를 돕기 위해 의미는 한국어로 자연스럽게 풀었습니다.
  doctrine_reference: 번역 철학 §3, §6
