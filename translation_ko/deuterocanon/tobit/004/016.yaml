- from: 네 빵에서 굶주린 이에게 주고, 네 옷에서 벌거벗은 이에게 주십시오. 네게 남는 것이 무엇이든지 그것으로 자선을 행하십시오. 그리고 자선을 행할 때 네 눈이 시기하지 않게 하십시오.[a][b]
  to: 네 빵을 굶주린 이에게 나누어 주고, 네 옷을 벌거벗은 이에게 주십시오. 네게 남는 것은 무엇이든지 자선으로 베푸십시오.[a] 자선을 베풀 때 아까워하지 마십시오.[b]
  rationale: 본문을 현대 표준 한국어 합쇼체로 다듬었습니다. ‘나누어 주다’는 ἐκ의 분여 의미를 자연스럽게 나타내며, ‘자선으로 베푸다’는 ποίει ἐλεημοσύνην의 구체적 자선 행위를 보존합니다. 마지막 절은 한국어에서 오해되기 쉬운 눈-시기 관용구를 본문에서는 문맥적 의미로 번역하고, 원문의 표현과 이미지는 각주에 밝혔습니다. 각주 a의 표지도 해당 잉여물 절 직후로 옮겼습니다.
