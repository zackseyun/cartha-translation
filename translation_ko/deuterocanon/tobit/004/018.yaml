    reason: lexical_alternative
lexical_decisions:
- source_word: συμβουλίαν
  english_pob_choice: counsel / advice
  chosen_korean: 조언
  alternatives_korean:
  - 권고
  - 상담
  lexicon: LSJ
  rationale: συμβουλίαν은 요청하거나 받는 ‘조언/권고’의 뜻이므로, 한국어에서는 자연스러운 ‘조언’으로 옮겨 ζητήσον과의 결합을 살렸습니다.
- source_word: παρὰ παντὸς φρονίμου
  english_pob_choice: from every wise man
  chosen_korean: 모든 지혜로운 사람에게서
  alternatives_korean:
  - 모든 지혜로운 남자에게서
  - 모든 현명한 이에게서
  lexicon: LSJ
  rationale: παρά + 속격은 출처를 나타내므로 ‘~에게서’로 옮겼고, φρόνιμος는 ‘지혜로운/현명한’의 뜻이어서 포괄적이고 현대적인 ‘지혜로운 사람’을 택했습니다.
- source_word: μὴ καταφρονήσῃς
  english_pob_choice: do not despise
  chosen_korean: 업신여기지 마십시오
  alternatives_korean:
  - 무시하지 마십시오
  - 깔보지 마십시오
  lexicon: LSJ
  rationale: καταφρονέω는 단순 무시보다 강한 경멸의 뉘앙스를 가지므로, 경고의 강도를 살리는 ‘업신여기다’를 선택했습니다.
- source_word: πάσης συμβουλίας χρησίμης
  english_pob_choice: any useful advice
  chosen_korean: 유익한 어떤 조언도
  alternatives_korean:
  - 모든 유익한 권고도
  - 어떤 유익한 조언도
  lexicon: LSJ
  rationale: πάσης는 분배적 의미를 가지므로 ‘어떤 …도’로 자연스럽게 풀었고, χρησίμης의 ‘유익한’ 의미를 분명히 드러냈습니다.
theological_decisions:
- issue: 지혜 문학적 권면의 어조
  chosen_reading: 명령형 권면을 현대 한국어의 공손한 권유형으로 유지했습니다.
  alternative_readings:
  - 직설적 명령형('...하십시오')
  - 설명적 완화형('...하는 것이 좋습니다')
  rationale: 본문은 지혜를 구하라는 직접적 권면이므로, 의미의 강도를 보존하면서도 한국어 합쇼체에 맞게 공손한 명령으로 옮겼습니다.
  doctrine_reference: 집회서/토빗 문맥의 지혜 권면 전통
