  yaml_path: translation/deuterocanon/tobit/004/010.yaml
  text: For almsgiving rescues from death and will not allow one to enter into the darkness[a][b].
  footnotes:
  - marker: a
    text: Or 'charity' or 'acts of mercy'; the Greek specifically refers to giving alms to the needy.
    reason: lexical_alternative
  - marker: b
    text: '''The darkness'' likely evokes the realm of death or deep gloom; the Greek leaves the image concise and somewhat open.'
    reason: alternative_reading
translation:
  language: ko
  text: 이는 구제가 죽음에서 건져 내며, 어둠으로 들어가게 하지 않을 것이기 때문입니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자선’, ‘긍휼의 행위’로 옮길 수 있습니다. 헬라어는 궁핍한 이들에게 베푸는 구제 행위를 구체적으로 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘어둠’은 죽음의 영역이나 깊은 암흑을 떠올리게 할 수 있으며, 헬라어는 이 이미지를 간결하게, 다소 열어 둔 채로 제시합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλεημοσύνη
  english_pob_choice: almsgiving
  chosen_korean: 구제 헌금
  alternatives_korean:
  - 구제
  - 자선
