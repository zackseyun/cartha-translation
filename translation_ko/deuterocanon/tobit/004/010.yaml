  lexicon: BDAG
  rationale: 헬라어는 단순한 자비심이 아니라 нуж한 이들에게 실제로 주는 구제 행위를 가리키므로, 한국어에서도 구체적 행위성을 드러내는 표현을 택했습니다.
- source_word: ἐκ θανάτου
