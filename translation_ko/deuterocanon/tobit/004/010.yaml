  text: For almsgiving rescues from death and will not allow one to enter into the darkness[a][b].
  footnotes:
  - marker: a
    text: Or 'charity' or 'acts of mercy'; the Greek specifically refers to giving alms to the needy.
    reason: lexical_alternative
  - marker: b
    text: '''The darkness'' likely evokes the realm of death or deep gloom; the Greek leaves the image concise and somewhat open.'
    reason: alternative_reading
translation:
  language: ko
  text: 이는 구제 헌금이 죽음에서 건져내고 어둠으로 들어가게 하지 않기 때문입니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자선’, ‘긍휼의 행위’로도 옮길 수 있습니다. 헬라어는 어려운 이들에게 주는 구제 헌금을 구체적으로 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘어둠’은 죽음의 영역이나 깊은 암흑을 떠올리게 할 수 있으며, 헬라어는 그 이미지를 간결하고 열어 둔 채로 둡니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλεημοσύνη
  english_pob_choice: almsgiving
  chosen_korean: 구제 헌금
  alternatives_korean:
  - 구제
  - 자선
  - 긍휼의 행위
  lexicon: BDAG
  rationale: 헬라어는 단순한 자비심이 아니라 нуж한 이들에게 실제로 주는 구제 행위를 가리키므로, 한국어에서도 구체적 행위성을 드러내는 표현을 택했습니다.
- source_word: ἐκ θανάτου
  english_pob_choice: from death
  chosen_korean: 죽음에서
  alternatives_korean:
  - 죽음으로부터
  - 죽음 밖에서
  lexicon: BDAG
  rationale: ἐκ는 위험한 상태에서의 이탈을 나타내므로, 자연스러운 한국어로 '죽음에서'라고 옮겨 구출의 방향을 살렸습니다.
- source_word: ῥύεται
  english_pob_choice: rescues
  chosen_korean: 건져내고
  alternatives_korean:
  - 구해내고
  - 구출하고
  - 건져 줍니다
  lexicon: BDAG
  rationale: 동사는 단순한 도움보다 위험한 곳에서 끌어내는 구출의 뉘앙스가 있어, '건져내다'가 가장 직접적입니다.
- source_word: οὐκ ἐάσει εἰσελθεῖν
  english_pob_choice: does not allow ... to enter
  chosen_korean: 들어가게 하지 않습니다
  alternatives_korean:
  - 들어가도록 허락하지 않습니다
  - 들어가게 두지 않습니다
  lexicon: BDAG
  rationale: 허용의 부정은 한국어에서 '들어가게 하지 않다'가 가장 자연스럽고, 원문의 금지/방지 의미를 잘 반영합니다.
- source_word: εἰς τὸ σκότος
  english_pob_choice: into the darkness
  chosen_korean: 어둠으로
  alternatives_korean:
  - 어둠 속으로
  - 그 어둠으로
  - 어둠 가운데로
  lexicon: BDAG
  rationale: 정관사로 특정성을 띠지만 한국어에서는 장면의 암시를 살리면서도 문장을 매끄럽게 하기 위해 '어둠으로'로 옮겼습니다.
theological_decisions:
- issue: 구제 행위와 죽음/어둠의 관계를 구원론적으로 과장할지 여부
  chosen_reading: 본문의 직접 진술을 유지하되, 구제가 죽음에서 건져내는 실제 효력을 말하는 것으로 옮겼습니다.
  alternative_readings:
  - 구제는 죽음의 위험에서 건져낼 수 있다로 완화하기
  - 후대 교리처럼 공로 언어로 재해석하기
  rationale: 헬라어는 단정적으로 말하므로 그 힘을 약화하지 않되, 이를 체계신학적 공로 문구로 확장하지도 않았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
