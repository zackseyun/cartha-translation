base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/007.yaml
  text: From what you have[a], give alms, and do not let your eye be grudging when you give alms. Do not turn your face away from any poor person[c][b], and the face of God will not be turned away from you.
  footnotes:
  - marker: a
    text: Or 'do not let your eye envy' / 'do not be stingy' when giving; the Greek idiom speaks of a grudging or resentful attitude in almsgiving.
    reason: lexical_alternative
  - marker: b
    text: Or 'from any poor person.' The Greek has masculine singular with generic force.
    reason: lexical_alternative
  - marker: c
    text: Or 'the presence of God,' though the Greek literally says 'the face of God' and echoes the previous clause's 'your face.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신이 가진 것으로 자선을 베푸십시오. 자선을 베풀 때에 당신의 눈이 인색해지지 않게 하십시오.[a] 어떤 가난한 사람에게서[b]도 당신의 얼굴을 돌리지 마십시오. 그러면 하나님의 얼굴도[c] 당신에게서 결코 돌아서지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘당신의 눈이 인색해지지 않게’는 직역에 가까운 표현입니다. 그리스어의 ‘눈’은 자선을 베풀면서 아까워하거나 인색해하는 태도를 가리키는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘가난한 사람’에 해당하는 그리스어는 남성 단수형이지만, 여기서는 누구든 가난한 이를 가리키는 일반적·분배적 용법입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘하나님의 얼굴’은 문자적 표현이며, 앞의 ‘당신의 얼굴’과 대응을 이룹니다. ‘하나님의 임재’로 풀어 옮길 수도 있으나, 본문은 이 대응을 유지합니다.
    reason: theological_note
lexical_decisions:
- source_word: ἐκ τῶν ὑπαρχόντων σοι
  english_pob_choice: From what you have
  chosen_korean: 네가 가진 것에서
  alternatives_korean:
  - 네 소유에서
  - 네가 가진 재물로
  lexicon: BDAG
  rationale: 소유 전체를 가리키는 넓은 표현이므로, 자연스러운 한국어로 ‘네가 가진 것에서’라고 옮겨 현재 가진 자원을 강조했습니다.
- source_word: ποίει ἐλεημοσύνην
  english_pob_choice: give alms
  chosen_korean: 자선을 베풀고
  alternatives_korean:
  - 구제하고
  - 구제의 행위를 하고
  lexicon: BDAG
  rationale: ἐλεημοσύνη는 단순한 내적 자비가 아니라 구체적 기부 행위를 뜻하므로, 문맥상 ‘자선을 베풀다’가 가장 적절합니다.
- source_word: μὴ φθονεσάτω σου ὁ ὀφθαλμός
  english_pob_choice: do not let your eye be grudging
  chosen_korean: 네 눈이 인색해지지 않도록 하십시오
  alternatives_korean:
  - 네 눈이 시기하지 않도록 하십시오
  - 네 눈이 아끼는 마음을 품지 않도록 하십시오
  lexicon: BDAG
  rationale: 눈을 의인화한 관용구를 살리면서도 현대 한국어에서 이해되도록 ‘인색해지다’로 옮겼습니다. 시기보다는 베풂을 아까워하는 태도에 초점이 있습니다.
- source_word: μὴ ἀποστρέψῃς τὸ πρόσωπόν σου
  english_pob_choice: Do not turn your face away
  chosen_korean: 네 얼굴을 돌리지 말라
  alternatives_korean:
  - 네 얼굴을 외면하지 말라
  - 네 얼굴을 피하지 말라
  lexicon: BDAG
  rationale: ‘얼굴’을 유지해 앞 절의 ‘눈’과 뒤 절의 하나님의 ‘얼굴’ 사이의 평행을 살렸습니다.
- source_word: ἀπὸ παντὸς πτωχοῦ
  english_pob_choice: from any poor man
  chosen_korean: 어떤 가난한 사람에게도
  alternatives_korean:
  - 어떤 가난한 자에게도
  - 어떤 가난한 남자에게도
  lexicon: BDAG
  rationale: 형태상 남성 단수이지만 분배적 일반 의미로 쓰였으므로, 한국어에서는 자연스럽고 일반적인 ‘가난한 사람’으로 옮겼습니다.
- source_word: τὸ πρόσωπον τοῦ θεοῦ
  english_pob_choice: the face of God
  chosen_korean: 하나님의 얼굴도
  alternatives_korean:
  - 하나님의 얼굴도
  - 하나님의 임재도
  lexicon: BDAG
  rationale: 문자적으로 ‘얼굴’을 유지해 인간의 얼굴과의 대응을 보존했습니다. ‘임재’는 해석을 더하므로 본문에는 두지 않았습니다.
theological_decisions:
- issue: 하나님을 향한 얼굴/얼굴의 상호성
  chosen_reading: 가난한 사람에게서 얼굴을 돌리지 않으면, 하나님의 얼굴도 너에게서 돌려지지 않는다는 상호적 표현을 유지했습니다.
  alternative_readings:
  - 하나님의 임재가 떠나지 않는다는 뜻으로 풀어 쓰기
  - 하나님이 너를 외면하지 않는다는 뜻으로 의역하기
  rationale: 본문은 πρόσωπον을 두 번 반복하여 인간의 태도와 하나님의 응답 사이의 문학적 대응을 만듭니다. 이를 ‘임재’로 풀면 이 대칭이 약해집니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
