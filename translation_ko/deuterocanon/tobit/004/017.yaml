  text: Pour out your bread on the grave of the righteous[a], and give none to sinners.
  footnotes:
  - marker: a
    text: Or, 'at the tomb of the righteous.' The phrase may refer to a funerary or memorial act of charity, but the Greek is kept literal here.
    reason: lexical_alternative
translation:
  language: ko
  text: 의인들의 무덤 위에 네 빵을 부어 놓고, 죄인들에게는 주지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘의인들의 무덤 위에’입니다. 이 표현은 장례나 추모 관련 자선 행위를 가리킬 수 있지만, 여기서는 그리스어의 구체적 이미지를 그대로 보존했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκχεον
  english_pob_choice: Pour out
  chosen_korean: 부어 놓고
  alternatives_korean:
  - 퍼내고
  - 쏟아 놓고
  - 부으십시오
  lexicon: LSJ
  rationale: 명령형 ἔκχεον의 구체적 이미지를 살리기 위해 ‘부어’ 계열을 택했습니다. 한국어에서는 ‘빵을 무덤 위에 부어 놓다’가 의례적·자선적 행위를 비교적 자연스럽게 드러냅니다.
- source_word: τοὺς ἄρτους σου
  english_pob_choice: your bread
  chosen_korean: 네 빵
  alternatives_korean:
  - 네 빵들
  - 네 떡
  - 네 양식
  lexicon: LSJ
  rationale: ἄρτους의 복수성을 굳이 설명하지 않고, 한국어에서는 소유를 유지한 평이한 표현으로 ‘네 빵’을 택했습니다. ‘양식’은 의미는 넓지만 원문의 구체성을 약화합니다.
- source_word: ἐπὶ τὸν τάφον τῶν δικαίων
  english_pob_choice: on the grave of the righteous
  chosen_korean: 의인들의 무덤 위에
  alternatives_korean:
  - 의인들의 무덤에
  - 의인들의 무덤 곁에
  - 의인들의 묘에
  lexicon: LSJ
  rationale: τάφος를 가장 सीधे하게 ‘무덤’으로 옮기고, ἐπὶ의 공간적 느낌을 살려 ‘위에’로 표현했습니다. ‘의인들’은 τῶν δικαίων의 성경적 윤리 범주를 반영합니다.
- source_word: τοῖς ἁμαρτωλοῖς
  english_pob_choice: to sinners
  chosen_korean: 죄인들에게는
  alternatives_korean:
  - 죄인들에게
  - 죄인들에게는 주지 마십시오
  - 악인들에게는
  lexicon: LSJ
  rationale: ἁμαρτωλοῖς는 표준적인 ‘죄인들’로 옮기는 것이 가장 투명합니다. 뒤의 부정 명령과 대비를 살리기 위해 한국어에서는 주제 표지 ‘-에게는’을 사용했습니다.
theological_decisions:
- issue: 무덤 위에 빵을 붓는 행위의 해석
  chosen_reading: 본문은 장례 또는 추모의 자선 행위를 설명으로 풀지 않고, 낯선 이미지 자체를 그대로 유지합니다.
  alternative_readings:
  - 의인의 장례에 음식을 나누어 주십시오
  - 의인을 기리며 음식을 베푸십시오
  rationale: 그리스어 표현이 구체적이면서도 문화적 배경이 불확실하므로, 본문에서는 해석을 덧씌우지 않는 것이 원문에 더 충실합니다. 의미 설명은 주석으로만 남겨 두는 편이 좋습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: 두 번째 절의 부정 명령 처리
  chosen_reading: ‘주지 마십시오’로 직접적인 금지형을 유지했습니다.
  alternative_readings:
  - 주지 말고
  - 아무것도 주지 말고
  - 죄인들에게는 주지 마십시오
  rationale: καὶ μὴ δῷς는 단순한 금지이므로, 한국어에서도 명령형 부정을 그대로 살려 텍스트의 단호함을 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
