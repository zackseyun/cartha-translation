base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/015.yaml
  text: And what you hate[a], do to no one. Do not drink wine to drunkenness, and do not let drunkenness go with you on your way.
  footnotes:
  - marker: a
    text: Or, 'And what is hateful to you, do not do to anyone.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또 미워하는 것은 아무에게도 하지 마십시오. 포도주를 취하도록 마시지 마십시오. 가는 길에 술취함이 함께하게 두지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘당신에게 미운 것을 누구에게도 하지 마십시오.’
    reason: ὃ μισεῖς를 ‘당신이 미워하는 것’으로 읽는 번역과, 수동적·평가적 뉘앙스인 ‘당신에게 미운 것’으로 읽는 번역의 가능한 차이를 제시합니다.
lexical_decisions:
- source_word: ὃ μισεῖς
  english_pob_choice: what you hate
  chosen_korean: 네가 미워하는 것
  alternatives_korean:
  - 네가 싫어하는 것
  - 네가 혐오하는 것
  lexicon: LSJ
  rationale: 직역하면 ‘미워하는 것’이 가장 가깝고, 금언형의 일반 원칙을 한국어로 자연스럽게 살립니다.
- source_word: μηδενὶ ποίησης
  english_pob_choice: do to no one
  chosen_korean: 아무에게도 행하지 마십시오
  alternatives_korean:
  - 아무에게도 하지 마십시오
  - 누구에게도 행하지 마십시오
  lexicon: LSJ
  rationale: dative 부정 대상을 한국어의 ‘아무에게도’로 옮겨 보편적 금지를 분명히 했습니다. ποιέω는 여기서 일반적인 ‘행하다/하다’가 적절합니다.
- source_word: εἰς μέθην
  english_pob_choice: to drunkenness
  chosen_korean: 술취함에 이르도록
  alternatives_korean:
  - 취하도록
  - 과음하도록
  lexicon: LSJ
  rationale: εἰς + 명사는 결과/도달점을 나타내므로, 단순히 ‘과음’으로 완화하기보다 ‘술취함에 이르도록’으로 결과를 드러냈습니다.
- source_word: μὴ πορευθήτω μετὰ σοῦ μέθη
  english_pob_choice: do not let drunkenness go with you
  chosen_korean: 술취함이 당신과 함께 길을 가게 두지 마십시오
  alternatives_korean:
  - 술취함이 당신과 동행하게 두지 마십시오
  - 술취함을 따라가게 두지 마십시오
  lexicon: LSJ
  rationale: 술취함을 의인화해 ‘함께 가다’고 한 그리스어 이미지를 살렸고, 한국어에서는 ‘가게 두지 마십시오’로 자연스럽게 옮겼습니다.
- source_word: ἐν τῇ ὁδῷ σου
  english_pob_choice: on your way
  chosen_korean: 길을 가는 동안
  alternatives_korean:
  - 가는 길에서
  - 당신의 길에서
  lexicon: LSJ
  rationale: 문자적 ‘길/행로’ 이미지를 유지하되, 문맥상 실제 이동과 삶의 행로를 함께 포괄할 수 있게 했습니다.
theological_decisions:
- issue: 금언의 대칭 구조
  chosen_reading: 부정적 황금률을 ‘네가 미워하는 것’으로 직접 옮겼습니다.
  alternative_readings:
  - ‘네가 싫어하는 것은 남에게도 하지 마십시오’
  - ‘네게 해로운 것은 남에게도 하지 마십시오’
  rationale: 본문은 도덕적 일반원칙을 압축한 금언이므로, 의미를 넓혀 도식화하기보다 원문의 부정형 대칭을 유지하는 것이 적절합니다.
  doctrine_reference: '번역 원칙: source-direct, negative reciprocity maxim'
- issue: 술취함에 대한 경고의 강도
  chosen_reading: ‘술취함’과 ‘길을 가게 두지 마십시오’로 의인화된 경고를 유지했습니다.
  alternative_readings:
  - ‘과음하지 마십시오’
  - ‘술에 취해 다니지 마십시오’
  rationale: 본문은 단순한 절제 권고보다 술취함을 동반자로 묘사하는 경계 표현입니다. 이를 약화하지 않고 보존했습니다.
  doctrine_reference: '번역 원칙: source imagery preservation'
