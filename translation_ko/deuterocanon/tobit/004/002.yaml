- source_word: τί οὐ καλῶ
  english_pob_choice: why should I not call
  chosen_korean: 내가 … 불러
  alternatives_korean:
  - 왜 내가 … 부르지 않겠습니까
  - 부르지 않겠습니까
  lexicon: BDAG
  rationale: 반문형의 자문적 결심을 한국어에서는 ‘…하지 않겠습니까’보다 문맥상 의도와 흐름이 살아나는 서술형으로 처리했습니다.
- source_word: ὑποδείξω
  english_pob_choice: instruct
  chosen_korean: 그에게 알려 주지 않겠습니까
  alternatives_korean:
  - 그에게 가르쳐 주지 않겠습니까
  - 그에게 지시하지 않겠습니까
  - 그에게 보여 주지 않겠습니까
  lexicon: BDAG
  rationale: 본문의 핵심은 단순히 무엇을 ‘보여 주는’ 것이 아니라, 죽기 전에 아들에게 필요한 내용을 전해 주는 것입니다. 따라서 ‘알려 주다’로 넓은 지시·전달 의미를 살렸습니다.
