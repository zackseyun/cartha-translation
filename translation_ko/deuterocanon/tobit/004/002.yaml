- issue: 본문의 내적 독백을 한국어에서 어떻게 표시할지
  chosen_reading: 그는 속으로 말했습니다로 옮겨, 사적인 자문과 결심의 성격을 드러냈습니다.
  alternative_readings:
  - 그는 생각했습니다
