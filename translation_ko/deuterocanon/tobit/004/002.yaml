base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/002.yaml
  text: And he said within himself[a], “I have asked for death; why should I not call Tobiah my son, so that I may instruct him before I die?”
  footnotes:
  - marker: a
    text: 'The parallel Semitic tradition expands this thought: Tobit calls Tobiah in order to inform him about the money deposited with Gabael before he dies.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그는 속으로 말했습니다. 「나는 죽기를 구했는데, 내가 죽기 전에 내 아들 토비야를 불러 그에게 알려 주지 않겠습니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 평행하는 셈어 전승은 토빗이 죽기 전에 가바엘에게 맡긴 돈을 아들에게 알리려고 그를 부른다고 더 구체적으로 전합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν ἐν ἑαυτῷ
  english_pob_choice: said within himself
  chosen_korean: 속으로 말했습니다
  alternatives_korean:
  - 자기 자신에게 말했습니다
  - 혼자 생각했습니다
  lexicon: BDAG
  rationale: 직역의 어색함을 피하면서도 내면에서 하는 독백이라는 의미를 자연스럽게 살렸습니다.
- source_word: ᾐτησάμην θάνατον
  english_pob_choice: have asked for death
  chosen_korean: 죽기를 구했는데
  alternatives_korean:
  - 죽음을 구했는데
  - 죽기를 요청했는데
  lexicon: BDAG
  rationale: 청원·요청의 뉘앙스를 살리되, 한국어에서 문맥상 가장 자연스러운 표현으로 옮겼습니다.
- source_word: τί οὐ καλῶ
  english_pob_choice: why should I not call
  chosen_korean: 내가 … 불러
  alternatives_korean:
  - 왜 내가 … 부르지 않겠습니까
  - 부르지 않겠습니까
  lexicon: BDAG
  rationale: 반문형의 자문적 결심을 한국어에서는 ‘…하지 않겠습니까’보다 문맥상 의도와 흐름이 살아나는 서술형으로 처리했습니다.
- source_word: ὑποδείξω
  english_pob_choice: instruct
  chosen_korean: 그에게 알려 주지 않겠습니까
  alternatives_korean:
  - 그에게 가르쳐 주지 않겠습니까
  - 그에게 지시하지 않겠습니까
  - 그에게 보여 주지 않겠습니까
  lexicon: BDAG
  rationale: 본문의 핵심은 단순히 무엇을 ‘보여 주는’ 것이 아니라, 죽기 전에 아들에게 필요한 내용을 전해 주는 것입니다. 따라서 ‘알려 주다’로 넓은 지시·전달 의미를 살렸습니다.
theological_decisions:
- issue: 본문의 내적 독백을 한국어에서 어떻게 표시할지
  chosen_reading: 그는 속으로 말했습니다로 옮겨, 사적인 자문과 결심의 성격을 드러냈습니다.
  alternative_readings:
  - 그는 생각했습니다
  - 그는 자기에게 말했습니다
  rationale: 이 장면은 외적 발화가 아니라 내면 독백이므로, 단순한 인지 동사보다 ‘속으로 말하다’가 본문 효과를 더 잘 전달합니다.
  doctrine_reference: 서사 문맥에서의 화자 초점 보존
