  rationale: 이 장면은 외적 발화가 아니라 내면 독백이므로, 단순한 인지 동사보다 ‘속으로 말하다’가 본문 효과를 더 잘 전달합니다.
  doctrine_reference: 서사 문맥에서의 화자 초점 보존
