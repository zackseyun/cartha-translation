  naturalness: ‘속으로 말했습니다’는 자연스러운 현대 한국어이며 합쇼체 서술에 맞습니다. 직접화법에서는 ‘나는 죽음을 구했습니다. ... 일러 주지 않겠습니까?’가 더 명료하고 자연스럽게 자문적 반문을 재현합니다.
