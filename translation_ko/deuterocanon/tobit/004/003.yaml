base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/003.yaml
  text: And calling him[a], he said, “Child, if I die, bury me, and do not neglect your mother; honor her all the days of your life,”
  footnotes:
  - marker: a
    text: Or 'do not overlook' or 'do not disregard your mother.' The parallel Semitic tradition has a stronger sense like 'do not abandon her.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그를 불러 말했습니다. “얘야, 내가 죽으면 나를 장사하고, 어머니를 소홀히 여기지 마라. 네 생애의 모든 날 동안 어머니를 공경하여라.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘소홀히 여기지 마라’는 본문의 ὑπερίδῃς를 따른 번역입니다. 평행 셈어 전통은 더 강하게 ‘버리지 마라’는 뜻을 보입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: καλέσας
  english_pob_choice: calling
  chosen_korean: 그를 불러
  alternatives_korean:
  - 불러서
  - 그를 부르며
  lexicon: BDAG
  rationale: 분사로 이어지는 서술 흐름을 자연스럽게 살리면서도, 말하기 직전의 행위를 분명하게 드러내는 표현입니다.
- source_word: Παιδίον
  english_pob_choice: Child
  chosen_korean: 얘야
  alternatives_korean:
  - 아이야
  - 내 자녀야
  - 아들아
  lexicon: BDAG
  rationale: 본문의 친밀한 호칭을 살리되, 원문에 없는 소유격 ‘내’를 덧붙이지 않고 한국어 호칭으로 자연스럽게 옮겼습니다.
- source_word: μὴ ὑπερίδῃς τὴν μητέρα σου
  english_pob_choice: do not neglect your mother
  chosen_korean: 어머니를 소홀히 여기지 마라
  alternatives_korean:
  - 어머니를 외면하지 마라
  - 어머니를 무시하지 마라
  - 어머니를 돌아보지 마라
  lexicon: BDAG
  rationale: ὑπεριδεῖν의 ‘못 본 체하다/간과하다’는 뜻을 한국어의 관계적 책임을 드러내는 표현으로 옮겼습니다. 단순한 지식상의 ‘잊지 마라’보다 행위적 무시를 더 잘 드러냅니다.
- source_word: τίμα αὐτὴν
  english_pob_choice: honor her
  chosen_korean: 어머니를 공경하여라
  alternatives_korean:
  - 어머니를 존중하여라
  - 어머니께 존경을 드려라
  lexicon: BDAG
  rationale: τίμα의 윤리적·가정적 명령을 한국어 성경 문맥에서 널리 이해되는 ‘공경하다’로 옮겼습니다.
- source_word: πάσας τὰς ἡμέρας τῆς ζωῆς σου
  english_pob_choice: all the days of your life
  chosen_korean: 네 생애의 모든 날 동안
  alternatives_korean:
  - 네 평생 동안
  - 네 삶의 모든 날에
  lexicon: BDAG
  rationale: 시간의 총체성을 자연스러운 문장으로 유지하면서, 문자적 범위를 훼손하지 않도록 했습니다.
theological_decisions:
- issue: 원문에는 없는 추가 정황을 얼마나 넣을 것인가
  chosen_reading: 그리스어 본문에 있는 명령들만 옮기고, 더 긴 셈어 전통의 확장 내용은 본문에 들이지 않았습니다.
  alternative_readings:
  - 셈어 전통처럼 ‘버리지 마라’로 더 강하게 옮기기
  - 추가 효도·자선 권면을 본문에 포함하기
  rationale: 이번 절의 번역 기반은 Swete 그리스어 본문이므로, 평행 셈어 증거는 어머니를 향한 책임의 강도를 확인하는 보조 근거로만 사용하고 본문을 확장하지 않았습니다.
  doctrine_reference: 원문 우선 원칙; 외경 본문에서의 변이 전승 처리
