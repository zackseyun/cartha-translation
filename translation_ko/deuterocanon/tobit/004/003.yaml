- source_word: μὴ ὑπερίδῃς τὴν μητέρα σου
  english_pob_choice: do not neglect your mother
  chosen_korean: 어머니를 소홀히 여기지 마라
  alternatives_korean:
  - 어머니를 외면하지 마라
  - 어머니를 무시하지 마라
  - 어머니를 돌아보지 마라
  lexicon: BDAG
  rationale: ὑπεριδεῖν의 ‘못 본 체하다/간과하다’는 뜻을 한국어의 관계적 책임을 드러내는 표현으로 옮겼습니다. 단순한 지식상의 ‘잊지 마라’보다 행위적 무시를 더 잘 드러냅니다.
- source_word: τίμα αὐτὴν
  english_pob_choice: honor her
  chosen_korean: 어머니를 공경하여라
  alternatives_korean:
  - 어머니를 존중하여라
  - 어머니께 존경을 드려라
  lexicon: BDAG
  rationale: τίμα의 윤리적·가정적 명령을 한국어 성경 문맥에서 널리 이해되는 ‘공경하다’로 옮겼습니다.
- source_word: πάσας τὰς ἡμέρας τῆς ζωῆς σου
  english_pob_choice: all the days of your life
  chosen_korean: 네 생애의 모든 날 동안
  alternatives_korean:
  - 네 평생 동안
  - 네 삶의 모든 날에
  lexicon: BDAG
  rationale: 시간의 총체성을 자연스러운 문장으로 유지하면서, 문자적 범위를 훼손하지 않도록 했습니다.
