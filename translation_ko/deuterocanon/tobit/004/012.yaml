base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/012.yaml
  text: Guard yourself[a], child, from all sexual immorality, and first take a wife from the offspring of your fathers. Do not take a foreign woman who is not from the tribe of your father, because we are sons of the prophets. Remember, child, Noah, Abraham, Isaac, and Jacob, our fathers from of old, that they all took wives from among their brothers, and they were blessed in their children[b], and their offspring will inherit the land.
  footnotes:
  - marker: a
    text: Or, 'we are descendants of the prophets.' The Greek reads literally, 'sons of the prophets.'
    reason: alternative_reading
  - marker: b
    text: That is, from among their close kin or clan, not their literal brothers.
    reason: lexical_alternative
translation:
  language: ko
  text: 간음한 모든 일을 조심하십시오, 아이야. 그리고 먼저 네 조상들의 씨에서 아내를 맞아라. 네 아버지의 지파에 속하지 않은 이방 여자는 맞이하지 말아라. 우리는 예언자들의 아들들이기 때문입니다. 아이야, 노아와 아브라함과 이삭과 야곱 — 옛적부터 우리의 조상들 — 를 기억하여라. 그들은 모두 자기 형제들 가운데서 아내를 맞았고, 자녀들 안에서 복을 받았으며, 그들의 씨는 땅을 상속할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리는 예언자들의 후손들입니다.’ 그리스어는 문자적으로 ‘예언자들의 아들들’이라고 합니다.
    reason: alternative_reading
  - marker: b
    text: 즉, 친형제들을 뜻하기보다 가까운 친족이나 씨족을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρόσεχε σεαυτῷ
  english_pob_choice: Guard yourself
  chosen_korean: 조심하십시오
  alternatives_korean:
  - 스스로를 지키십시오
  - 자신을 살피십시오
  lexicon: LSJ
  rationale: 자기 경계를 지키며 경계하라는 명령을 자연스러운 현대 한국어로 옮기기 위해 ‘조심하십시오’를 택했습니다. reflexive한 뉘앙스는 문맥 전체에서 유지됩니다.
- source_word: πορνείας
  english_pob_choice: sexual immorality
  chosen_korean: 간음한 모든 일
  alternatives_korean:
  - 성적 부도덕
  - 성적 음행
  lexicon: BDAG
  rationale: 포괄적 성적 타락을 뜻하지만, 한국어에서 너무 교회적이거나 추상적인 표현보다 구체적이고 경고성이 있는 표현이 적합하여 이렇게 옮겼습니다.
- source_word: σπέρματος τῶν πατέρων σου
  english_pob_choice: offspring of your fathers
  chosen_korean: 네 조상들의 씨
  alternatives_korean:
  - 네 아버지들의 후손
  - 네 조상들의 자손
  lexicon: LSJ
  rationale: σπέρμα의 혈통·계보 의미를 살리되, 현대 독자가 이해할 수 있도록 ‘씨’와 ‘조상들’을 함께 유지했습니다.
- source_word: υἱοὶ προφητῶν ἐσμεν
  english_pob_choice: we are sons of the prophets
  chosen_korean: 우리는 예언자들의 아들들
  alternatives_korean:
  - 우리는 예언자들의 자손들
  - 우리는 예언자들의 후손들
  lexicon: LSJ
  rationale: 직역성을 살려 본문에는 ‘아들들’을 유지했습니다. 이 표현의 관용적 의미는 각주로 처리했습니다.
- source_word: ἐκ τῶν ἀδελφῶν αὐτῶν
  english_pob_choice: from among their brothers
  chosen_korean: 자기 형제들 가운데서
  alternatives_korean:
  - 자기 친족들 가운데서
  - 자기 동족들 가운데서
  lexicon: LSJ
  rationale: 본문의 친족결혼 맥락을 살리면서도 그리스어의 ‘형제들’을 그대로 드러내기 위해 이 표현을 선택했습니다.
- source_word: κληρονομήσει γῆν
  english_pob_choice: will inherit the land
  chosen_korean: 땅을 상속할 것입니다
  alternatives_korean:
  - 땅을 유업으로 받을 것입니다
  - 땅을 차지할 것입니다
  lexicon: LSJ
  rationale: γῆ를 문자 그대로 ‘땅’으로 옮기고, 상속/유업의 의미는 한국어 동사 ‘상속하다’로 드러냈습니다.
theological_decisions:
- issue: ‘예언자들의 아들들’의 의미
  chosen_reading: 본문에는 직역을 유지하고, 그 관용적 의미는 각주에서 ‘예언자들의 후손들’로 설명했습니다.
  alternative_readings:
  - 예언자들의 후손들
  - 예언자 계열의 사람들
  rationale: 그리스어의 특이한 표현을 본문에서 평준화하지 않고, 독자가 오해하지 않도록 해설을 덧붙이는 것이 원문 긴장을 보존합니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
- issue: 형제들 가운데서 결혼하라는 권고의 범위
  chosen_reading: ‘자기 형제들 가운데서’라고 옮기고, 이는 문자적 형제라기보다 친족/씨족 결혼을 가리킨다는 점을 각주로 보완했습니다.
  alternative_readings:
  - 친족들 가운데서
  - 동족들 가운데서
  rationale: 본문의 남성 친족어를 가리기보다 원문을 드러내고, 문맥적 의미는 각주로 풀어 주는 편이 소스 충실성과 가독성을 함께 지킵니다.
  doctrine_reference: DOCTRINE.md §4 Gender-accurate over gender-neutral
