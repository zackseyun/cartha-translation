  text: 가지고 있는 것이 많거든, 그 많은 것에서 자선을 베푸십시오. 가지고 있는 것이 적거든, 그 적은 것에 따라 자선을 베푸는 것을 두려워하지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
