lexical_decisions:
- source_word: ὡς σοι ὑπάρχει
  english_pob_choice: As much as you have
  chosen_korean: 가지고 있는 것이 많거든
  alternatives_korean:
  - 가지고 있는 만큼
  - 무엇이든 가지고 있는 만큼
  lexicon: BDAG
  rationale: 소유의 분량을 전면에 두는 표현으로 이해하여, 한국어에서는 앞절의 조건을 자연스럽게 드러내는 ‘가지고 있는 것이 많거든’으로 옮겼습니다.
- source_word: κατὰ τὸ πλῆθος
  english_pob_choice: according to your abundance
  chosen_korean: 그 많은 것에서
  alternatives_korean:
  - 당신의 풍성함에 따라
  - 그 풍성함의 비례에 따라
  lexicon: BDAG
  rationale: κατά + 대격의 비례 관계와 πλῆθος의 ‘많음/풍성함’을 살리되, 한국어에서는 반복을 피하면서도 출처를 분명히 하는 ‘그 많은 것에서’로 옮겼습니다.
- source_word: ἐλεημοσύνην
  english_pob_choice: give alms
  chosen_korean: 자선을 베푸십시오
  alternatives_korean:
  - 구제를 하십시오
  - 알몸을 주십시오
  lexicon: BDAG
  rationale: 토빗서의 문맥에서 ἐλεημοσύνη는 단순한 감정적 자비가 아니라 가난한 이들을 향한 구체적 베풂이므로, 현대 한국어에서는 ‘자선’과 ‘베풀다’를 사용해 실천성을 살렸습니다.
- source_word: μὴ φοβοῦ ποιεῖν ἐλεημοσύνην
  english_pob_choice: do not be afraid to give alms
  chosen_korean: 자선을 베푸는 것을 두려워하지 마십시오
  alternatives_korean:
  - 자선을 베푸는 데 주저하지 마십시오
  - 자선을 행하는 것을 두려워하지 마십시오
  lexicon: BDAG
  rationale: φοβοῦ의 직접적 의미를 약화하지 않고, 적은 형편에서도 구제를 멈추지 말라는 권고를 한국어의 정중한 명령형으로 옮겼습니다.
