base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/006.yaml
  text: For if you practice the truth[a], your works will prosper[b], and so will all who practice righteousness.
  footnotes:
  - marker: a
    text: Or 'all who practice justice.' The Greek δικαιοσύνη can denote righteousness or justice depending on context.
    reason: lexical_alternative
  - marker: b
    text: The Greek wording is somewhat compressed; the sense is that truthful, upright conduct leads to success in one's undertakings.
    reason: lexical_alternative
translation:
  language: ko
  text: 왜냐하면 네가 진리를 행하면 네가 하는 일들이 잘될 것이며, 의를 행하는 모든 이도 그러할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘네가 진리를 행할 때’입니다. 그리스어의 속격절대구는 문맥상 조건의 뜻으로도 이해될 수 있어, 여기서는 ‘행하면’으로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: ‘의’로 번역한 그리스어 δικαιοσύνη는 문맥에 따라 ‘의로움’ 또는 ‘정의’를 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιοῦντός σου τὴν ἀλήθειαν
  english_pob_choice: if you practice the truth
  chosen_korean: 네가 진리를 행하면
  alternatives_korean:
  - 네가 진리를 실천하면
  - 네가 참됨을 행하면
  - 네가 진실하게 행하면
  lexicon: BDAG
  rationale: ἀλήθεια를 단순한 지식이 아니라 행위로 나타나는 진리로 읽어, ‘진리를 행하다’로 옮겨 윤리적 실천의 뜻을 살렸습니다.
- source_word: εὐοδίαι ἔσονται
  english_pob_choice: will prosper
  chosen_korean: 잘되며
  alternatives_korean:
  - 번영하며
  - 형통하며
  - 성공하며
  lexicon: LSJ
  rationale: 직역된 ‘번영하다’보다 문맥상 행위와 일의 결과를 자연스럽게 드러내는 ‘잘되다’를 택했습니다.
- source_word: ἐν τοῖς ἔργοις σου
  english_pob_choice: in your works
  chosen_korean: 네 일들은
  alternatives_korean:
  - 네 행위들은
  - 네 일에서
  - 네가 하는 일들은
  lexicon: BDAG
  rationale: ἔργα를 단순히 추상적 ‘행위’보다 구체적인 삶의 결과를 드러내는 ‘일들’로 옮겨, 앞의 ‘잘되다’와의 연결을 살렸습니다.
- source_word: πᾶσι τοῖς ποιοῦσι τὴν δικαιοσύνην
  english_pob_choice: all who practice righteousness
  chosen_korean: 의를 행하는 모든 이도
  alternatives_korean:
  - 의를 실천하는 모든 이도
  - 공의를 행하는 모든 이도
  - 의를 따르는 모든 이도
  lexicon: BDAG
  rationale: δικαιοσύνη는 본문의 지혜적·윤리적 맥락에서 ‘의’가 가장 기본적이며, POB의 기본값을 유지하되 한국어에서는 자연스럽게 ‘행하다’와 결합시켰습니다.
theological_decisions:
- issue: δικαιοσύνη의 한국어 대응
  chosen_reading: ‘의’로 번역하고, 행위 동사와 결합해 윤리적 순종의 뜻을 드러냈습니다.
  alternative_readings:
  - ‘의로움’
  - ‘정의’
  rationale: 토빗의 권면 문맥에서는 법정적 의미보다 하나님 앞과 사람 앞에서의 올바른 삶이 중심이므로, 기본값인 ‘의’를 유지하는 것이 가장 적절합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: δικαιοσύνη'
- issue: 문장 첫머리의 διότι
  chosen_reading: ‘참으로’로 시작해 앞선 권면을 뒷받침하는 이유·확인 어감을 살렸습니다.
  alternative_readings:
  - ‘이는’
  - ‘왜냐하면’
  - ‘그러므로’
  rationale: 본문의 διότι는 단순한 설명을 넘어 앞 문맥의 격언적 권면을 뒷받침하는 연결이므로, 한국어에서는 자연스러운 담화 표지로 풀어 주는 것이 좋습니다.
  doctrine_reference: TOB 4:6 discourse flow
