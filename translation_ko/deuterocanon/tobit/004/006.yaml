  naturalness: ‘왜냐하면’으로 이유를 분명히 하고, ‘네가 하는 일들이 잘될 것이며’로 현대 표준 한국어의 자연스러운 합쇼체 문장으로 다듬었습니다. ‘진리를 행하다’와 ‘의를 행하다’는 본문의 윤리적 행위 개념을 유지하면서 성서 한국어에서도 자연스럽습니다.
