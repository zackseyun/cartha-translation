base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/019.yaml
  text: And at all times bless the Lord God[a], and ask from him that your ways may be made straight and that all your paths and plans may prosper. For no nation has counsel, but the Lord himself gives all good things, and whomever he wills he humbles, just as he pleases. And now, child, remember my commandments[b], and do not let them be blotted out from your heart.
  footnotes:
  - marker: a
    text: Or 'all your paths and counsels may succeed.' The Greek βουλαί can mean 'plans,' 'purposes,' or 'counsels.'
    reason: lexical_alternative
  - marker: b
    text: The clause 'no nation has counsel' is abrupt in Greek and may mean that no people possesses ultimate counsel in itself, in contrast to the Lord, who gives good things and humbles whomever he wills.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 언제나 주 하나님을 찬송하고, 너의 길들이 곧게 되고 네 모든 길과 계획이 잘되게 해 달라고 그분께 구하십시오.[a] 어느 민족도 계책이 없으나, 주님 자신이 모든 좋은 것을 주시고, 그분이 원하시는 이는 누구든지 낮추시기 때문입니다.[b] 이제, 아이야, 내 계명들을 기억하고, 그것들이 네 마음에서 지워지지 않게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 모든 길과 계획이 성공하도록.’ 그리스어 βουλαί는 ‘계획’, ‘목적’, ‘조언’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘어느 민족도 계책이 없다’는 구절은 그리스어에서 갑작스럽게 느껴집니다. 이는 어느 민족도 그 자체로 궁극적인 계책을 지니지 못한다는 뜻일 수 있으며, 주님께서 모든 좋은 것을 주시고 원하시는 이를 낮추신다는 내용과 대비됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐλόγει
  english_pob_choice: bless
  chosen_korean: 찬송하다
  alternatives_korean:
  - 복을 빌다
  - 축복하다
  lexicon: LSJ
  rationale: 여기서는 하나님께 대한 경건한 호응으로서의 동작이므로, 한국어에서는 ‘찬송하다’가 문맥상 자연스럽고 예배적 어감을 살립니다. 다만 원문의 ‘축복하다/복을 빌다’ 의미도 유보 없이 남아 있습니다.
- source_word: Κύριον τὸν Θεόν
  english_pob_choice: the Lord God
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주님 하나님
  - 주, 하나님
  lexicon: LSJ
  rationale: 두 칭호를 함께 보존하되 한국어에서는 가장 자연스러운 복합 호칭인 ‘주 하나님’으로 옮겼습니다.
- source_word: ὅπως αἱ ὁδοί σου εὐθεῖαι γένωνται ... βουλαὶ εὐοδωθῶσιν
  english_pob_choice: that your ways may be made straight ... your paths and plans may prosper
  chosen_korean: 너의 길들이 곧게 되도록, 또 네 모든 길과 계획이 잘되도록
  alternatives_korean:
  - 네 길이 바르게 되도록, 또 네 모든 길과 계획이 형통하도록
  - 네 길들이 곧아지고 네 길과 계획이 성공하도록
  lexicon: LSJ
  rationale: ‘길’과 ‘계획’의 병렬을 유지하면서, ὁδοί/τρίβοι의 길-이미지와 βουλαί의 계획 의미를 모두 살렸습니다. ‘잘되다’는 εὐοδωθῶσιν의 성공·번영 의미를 과장 없이 담습니다.
- source_word: πᾶν ἔθνος οὐκ ἔχει βουλήν
  english_pob_choice: no nation has counsel
  chosen_korean: 어떤 민족도 스스로의 계획을 가지지 못하지만
  alternatives_korean:
  - 어떤 민족도 계책을 가지지 못하지만
  - 어떤 나라든지 조언을 가지지 못하지만
  lexicon: LSJ
  rationale: 직역의 ‘계획/조언’보다 문맥상 대비가 분명한 ‘스스로의 계획’이 한국어에서 더 분명합니다. 다만 원문의 긴장—민족의 한계와 주님의 주권—은 유지했습니다.
- source_word: μὴ ἐξαλειφθήτωσαν ἐκ τῆς καρδίας σου
  english_pob_choice: do not let them be blotted out from your heart
  chosen_korean: 그것들이 네 마음에서 지워지지 않게 하십시오
  alternatives_korean:
  - 네 마음에서 지워지지 않게 하십시오
  - 네 마음에서 지워지지 않도록 하십시오
  lexicon: LSJ
  rationale: ‘blotted out’의 영상성을 한국어의 자연스러운 표현인 ‘지워지다’로 옮겼습니다. 수동적 금지의 의미는 보존하되, 현대 한국어에서 읽히는 문장으로 다듬었습니다.
theological_decisions:
- issue: κύριος의 한국어 호칭
  chosen_reading: 주 하나님
  alternative_readings:
  - 주님
  - 주
  rationale: 이 구절의 κύριος는 하나님을 가리키므로, 신학적·문체적으로 ‘주 하나님’이 가장 분명합니다. 인간 상전 의미의 오해를 피하면서도 본문의 경배적 어조를 살립니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → Lord'
- issue: 하나님의 주권과 민족의 한계(πᾶν ἔθνος οὐκ ἔχει βουλήν ... ταπεινοῖ)
  chosen_reading: 민족의 자기 계획의 한계를 분명히 하고, 주님의 주시는 것과 낮추심을 그대로 유지했습니다.
  alternative_readings:
  - ‘민족은 지혜가 없다’처럼 완화
  - 해설적으로 풀어 긴장을 약화
  rationale: 원문은 인간 집단의 한계와 하나님의 주권을 날카롭게 대조합니다. 그 긴장을 완화하지 않고 드러내는 것이 본문의 의도에 더 가깝습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
