base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/020.yaml
  text: And now I am showing you the ten talents of silver that I deposited with Gabael son of Gabrias in Rages of Media[a].
  footnotes:
  - marker: a
    text: Or 'I am making known to you' for ἐπιδεικνύω; the verb can mean to point out or disclose, not only to display physically.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이제 나는 가브리아스의 아들 가바엘에게 메디아의 라게스에서 맡겨 둔 은 열 달란트를 너에게 보여 주고 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἐπιδεικνύω는 여기서 물리적으로 ‘보여 주다’뿐 아니라 ‘알려 주다’ 또는 ‘가리키다’라는 뜻도 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιδεικνύω
  english_pob_choice: am showing
  chosen_korean: 보여 주고 있습니다
  alternatives_korean:
  - 알려 주고 있습니다
  - 가리키고 있습니다
  lexicon: LSJ
  rationale: 문맥상 단순히 물건을 눈앞에 내보이는 것보다 그 존재를 가리켜 확인시키는 뜻이 강하므로, POB의 진행형 뉘앙스를 살려 자연스럽게 옮겼습니다.
- source_word: τὰ δέκα τάλαντα τοῦ ἀργυρίου
  english_pob_choice: the ten talents of silver
  chosen_korean: 은 열 달란트
  alternatives_korean:
  - 열 은 달란트
  - 은으로 된 열 달란트
  lexicon: LSJ
  rationale: ‘달란트’라는 고대 화폐·중량 단위를 그대로 유지하고, 금속은 관형어로 앞에 두어 한국어 어순에 맞췄습니다.
- source_word: παρεθέμην
  english_pob_choice: I deposited
  chosen_korean: 맡겨 둔
  alternatives_korean:
  - 예치한
  - 맡긴
  lexicon: LSJ
  rationale: 돈을 특정 인물에게 보관하게 맡긴 상황이므로, 금융적·보관적 의미를 함께 살릴 수 있는 ‘맡겨 두다’로 옮겼습니다.
- source_word: Γαβαήλῳ τῷ τοῦ Γαβρεία
  english_pob_choice: Gabael son of Gabrias
  chosen_korean: 가바리스의 아들 가바엘
  alternatives_korean:
  - 가브리아스의 아들 가바엘
  - 가바리스의 아들 가바일
  lexicon: LSJ
  rationale: 그리스어의 소유격 구문을 한국어 친족 표지인 ‘-의 아들’로 풀어 주었고, 고유명사는 음역을 유지했습니다.
