base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/005.yaml
  text: All the days[a], child, remember the Lord our God. Do not desire to transgress his commandments. Practice righteousness all the days of your life, and do not walk in the ways of unrighteousness.
  footnotes:
  - marker: a
    text: Or 'Practice justice ... do not walk in the ways of injustice.' The Greek terms can carry both personal-moral and social-ethical force.
    reason: lexical_alternative
translation:
  language: ko
  text: 날마다, 아이야, 우리 하나님이신 주님을 기억하십시오. 그의 계명을 어기고 싶어 하지 마십시오. 평생 의를 실천하고, 불의의 길로 걷지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정의를 실천하고 … 불의의 길로 걷지 마십시오.’ 여기서 δικαιοσύνη와 ἀδικία는 개인 도덕뿐 아니라 사회적·윤리적 차원도 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάσας τὰς ἡμέρας
  english_pob_choice: All the days
  chosen_korean: 날마다
  alternatives_korean:
  - 평생
  - 모든 날에
  lexicon: LSJ
  rationale: 반복적·지속적 명령을 한국어에서 자연스럽게 살리면서, 앞뒤에 이어지는 평생의 윤리적 촉구와도 잘 맞습니다.
- source_word: παιδίον
  english_pob_choice: child
  chosen_korean: 아이야
  alternatives_korean:
  - 어린아
  - 자녀야
  - 아들아
  lexicon: LSJ
  rationale: 직접 호칭의 애정과 친밀함을 드러내되, 본문에 없는 '아들'을 덧붙이지 않기 위해 중립적인 ‘아이야’를 택했습니다.
- source_word: Κυρίου τοῦ θεοῦ ἡμῶν
  english_pob_choice: the Lord our God
  chosen_korean: 우리 하나님이신 주님
  alternatives_korean:
  - 우리 주 하나님
  - 주 우리 하나님
  lexicon: LSJ
  rationale: κύριος를 프로젝트 기본값에 따라 '주님'으로, θεός를 '하나님'으로 옮기고, 소유 관계를 자연스럽게 한국어 어순으로 정리했습니다.
- source_word: μὴ θελήσῃς παραβῆναι
  english_pob_choice: Do not desire to transgress
  chosen_korean: 어기고 싶어 하지 마십시오
  alternatives_korean:
  - 어기려 하지 마십시오
  - 범하려고 하지 마십시오
  - 어기지 마십시오
  lexicon: BDAG
  rationale: 단순 금지보다 '원해서 어기는 마음'까지 포함한 금지라는 점을 살리기 위해, 의지 동사와 행위를 함께 담는 표현을 사용했습니다.
- source_word: δικαιοσύνην ποίει
  english_pob_choice: Practice righteousness
  chosen_korean: 의를 실천하고
  alternatives_korean:
  - 의를 행하고
  - 공의를 행하고
  - 정의를 실천하고
  lexicon: BDAG
  rationale: δικαιοσύνη의 기본 대응인 '의'를 유지하면서, 행위 동사 ποιέω의 지속적 윤리 실천을 한국어에서 자연스럽게 풀었습니다.
- source_word: ταῖς ὁδοῖς τῆς ἀδικίας
  english_pob_choice: in the ways of unrighteousness
  chosen_korean: 불의의 길로
  alternatives_korean:
  - 불의의 길에서
  - 불의한 길로
  - 불의한 길을
  lexicon: BDAG
  rationale: '''길'' 이미지를 살리고, πορεύομαι의 이동 감각을 자연스럽게 반영하기 위해 ''길로 걷다''의 방향성을 유지했습니다.'
theological_decisions:
- issue: δικαιοσύνη / ἀδικία의 렉시컬 대비
  chosen_reading: 의 / 불의
  alternative_readings:
  - 정의 / 불의
  - 의로움 / 불의함
  rationale: 이 구절은 개인 윤리와 공동체 윤리를 함께 포함하는 넓은 종교윤리적 권면이므로, 프로젝트 기본값인 δικαιοσύνη=의를 따르되 ἀδικία는 그 반대말인 불의로 대응했습니다.
  doctrine_reference: 'DOCTRINE.md contested terms: δικαιοσύνη → 의; 사회-윤리 문맥에서 정의 가능'
