  lexicon: BDAG
  rationale: 호칭의 친근함과 애정을 살리기 위해 직접 부름 형태로 옮겼고, 소유격을 덧붙이지 않아 원문의 절제된 호칭을 유지했습니다.
- source_word: ἐπτωχεύσαμεν
  english_pob_choice: we have become poor
  chosen_korean: 우리가 가난해졌기 때문입니다
