  lexicon: BDAG
  rationale: 과거에 가난한 상태로 들어간 뉘앙스를 살려 '가난해졌기'로 옮겼습니다.
- source_word: ὑπάρχει σοι πολλὰ
  english_pob_choice: you have much
  chosen_korean: 너에게는 많은 것이 있습니다
  alternatives_korean:
  - 너에게는 많습니다
