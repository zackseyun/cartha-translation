  lexicon: BDAG
  rationale: ἀπό의 분리 의미를 살리면서 도덕적 결단을 자연스럽게 드러내기 위해 '돌아서며'를 사용했습니다.
- source_word: ποιήσῃς τὸ ἀρεστὸν ἐνώπιον αὐτοῦ
  english_pob_choice: do what is pleasing before him
  chosen_korean: 그분 앞에서 기쁜 일을 하면
  alternatives_korean:
  - 그분 앞에서 그분을 기쁘시게 하는 일을 하면
