  naturalness: ‘아들아’와 ‘마십시오’는 현대의 격식 있는 성경 문체에서 자연스럽게 어울립니다. ‘그분 앞에서 기쁜 일’은 한국어에서 단순히 즐거운 일을 뜻할 수 있으므로, 하나님을 기쁘시게 하는 일이라는 목적어 관계를 명시하는 편이 자연스럽고 정확합니다.
