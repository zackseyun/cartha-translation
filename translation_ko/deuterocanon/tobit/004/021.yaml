  text: And do not be afraid[a], child, because we have become poor; you have much, if you fear God and turn away from every sin and do what is pleasing before him.
  footnotes:
  - marker: a
    text: Or, 'there is much for you.' The Greek expression can denote what one possesses or what is available to one.
    reason: lexical_alternative
translation:
  language: ko
  text: 아들아, 우리가 가난해졌다고 두려워하지 마십시오. 네가 하나님을 두려워하고 모든 죄에서 돌아서며 그분 앞에서 그분을 기쁘시게 하는 일을 한다면, 네게는 많은 것이 있다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네게 많은 것이 있다.’ 그리스어 표현은 네가 소유한 것 또는 네게 이용 가능한 것이 많다는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
