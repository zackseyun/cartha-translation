  - 무서워하지 마십시오
  lexicon: BDAG
  rationale: φοβέομαι의 금지 명령을 현대 한국어의 자연스러운 금지 표현으로 옮기되, 권면의 힘을 살리기 위해 공손한 명령형을 사용했습니다.
