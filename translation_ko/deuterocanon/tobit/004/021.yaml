- issue: ὑπάρχει σοι πολλὰ의 의미 범위
  chosen_reading: 이 말은 하나님을 두려워하고 죄에서 돌아서며 그분 앞에서 합당한 일을 할 때 '너에게 많은 것이 있다'는 넓은 약속으로 두고, 물질적 번영으로만 좁히지 않았습니다.
  alternative_readings:
  - 물질적 풍요를 약속하는 말로 좁혀 읽기
  - 영적 부요만을 뜻하는 말로 한정하기
  rationale: 그리스어 표현 자체가 소유·가용성의 폭을 가질 수 있으므로, 본문이 허용하는 넓이를 유지해 신학적 긴장을 보존했습니다.
  doctrine_reference: 본문의 개방성을 보존한다.
