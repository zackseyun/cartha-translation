  - 너에게는 많은 것이 있을 것입니다
  lexicon: BDAG
  rationale: 소유 또는 주어진 몫의 의미를 반영해 '많은 것이 있습니다'로 옮겼고, 한국어에서 자연스럽고도 범위를 열어 두는 표현을 택했습니다.
- source_word: ἀποστῇς ἀπὸ πάσης ἁμαρτίας
