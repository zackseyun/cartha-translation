  text: And do not be afraid[a], child, because we have become poor; you have much, if you fear God and turn away from every sin and do what is pleasing before him.
  footnotes:
  - marker: a
    text: Or, 'there is much for you.' The Greek expression can denote what one possesses or what is available to one.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 두려워하지 마십시오, 아이야. 우리가 가난해졌기 때문입니다. 하나님을 두려워하고, 모든 죄에서 돌아서며, 그분 앞에서 기쁜 일을 하면 너에게는 많은 것이 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘많은 것이 있습니다’는 ‘너에게 많은 것이 있다/있을 수 있다’는 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ φοβοῦ
  english_pob_choice: do not be afraid
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
