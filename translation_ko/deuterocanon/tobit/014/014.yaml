translation:
  language: ko
  text: 그리고 그는 메디아의 에크바타나에서 백일곱 살의 나이로 죽었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέθανεν
  english_pob_choice: died
  chosen_korean: 죽었습니다
  alternatives_korean:
  - 세상을 떠났습니다
  - 별세했습니다
  lexicon: BDAG
  rationale: 그리스어 aorist 동사는 단순한 죽음을 직접 가리키므로, 완곡어보다 직설적인 동사인 ‘죽었습니다’가 원문 의미를 가장 분명하게 옮깁니다.
- source_word: ἐτῶν ἑκατὸν ἑπτὰ
  english_pob_choice: at one hundred seven years old
  chosen_korean: 백일곱 살의 나이로
  alternatives_korean:
  - 백일곱 살에
  - 백일곱 세의 나이로
  lexicon: LSJ
  rationale: 연령을 나타내는 소유격 표현이므로 ‘~살의 나이로’가 현대 한국어에서 자연스럽고, 죽을 당시의 나이를 분명히 드러냅니다.
- source_word: ἐν Ἐκβατάνοις
  english_pob_choice: in Ecbatana
  chosen_korean: 에크바타나에서
  alternatives_korean:
  - 에크바타나에
  - 엑바타나에서
  lexicon: LSJ
  rationale: 지명은 현대 외래어 표기법을 따라 ‘에크바타나’로 옮기고, 전치사 ἐν의 기본값을 살려 ‘-에서’로 번역했습니다.
- source_word: τῆς Μηδείας
  english_pob_choice: of Media
  chosen_korean: 메디아의
  alternatives_korean:
  - 메디아에 있는
  - 메대의
  lexicon: LSJ
  rationale: 속격은 에크바타나가 어떤 곳인지를 설명하는 수식이므로, ‘메디아의’가 원문의 관계를 가장 간명하게 보존합니다.
