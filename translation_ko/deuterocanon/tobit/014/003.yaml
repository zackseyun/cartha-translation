  yaml_path: translation/deuterocanon/tobit/014/003.yaml
  text: Now he had grown very old[a]; and he called his son and his grandsons, and said to him, “Child, take your sons. Look, I have grown old[b], and I am about to depart from life.”
  footnotes:
  - marker: a
    text: Or, more literally, “his son and his son's sons”; that is, his son and grandsons.
    reason: lexical_alternative
  - marker: b
    text: The Greek says, more literally, “I am toward departing from living,” an idiomatic way of saying that death is near.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 매우 늙었습니다[a]. 그리고 자기 아들과 자기의 손자들을 불러 그에게 말하였습니다. 「얘야, 네 아들들을 데려오너라. 보아라, 나는 늙었고[b] 생명에서 떠날 때가 가까워졌구나.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 아들과 그의 아들의 아들들’이므로, 곧 그의 아들과 손자들을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 문자적으로 ‘나는 살아 있음에서 달아나려 한다’는 뜻의 관용적 표현으로, 죽음이 가까움을 완곡하게 말합니다.
    reason: lexical_alternative
