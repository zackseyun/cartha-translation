  - 나는 곧 죽게 되었구나
  - 나는 생명에서 달아날 지경이구나
  lexicon: LSJ
  rationale: 직역하면 어색한 관용구이므로, ‘떠나다’라는 완곡한 죽음 표현과 임박성을 함께 살려 원문의 톤을 보존했습니다.
theological_decisions:
- issue: 죽음을 직접 말하지 않는 완곡 표현의 보존
  chosen_reading: ‘생명에서 떠날 때가 가까워졌구나’로 옮겨, 죽음을 노골적으로 단정하기보다 임박한 이별을 말하는 원문 어조를 유지했습니다.
  alternative_readings:
  - 나는 곧 죽게 되었구나
  - 내 생명이 다했구나
  rationale: 그리스어는 ‘죽다’의 직설어 대신 우회 표현을 사용하므로, 한국어도 그 완곡성과 장면의 엄숙함을 보존하는 편이 source-direct합니다.
  doctrine_reference: Translation philosophy §§1, 6
