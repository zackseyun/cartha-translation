base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/009.yaml
  text: But you, keep the law and the commandments, and become merciful and righteous, so that it may go well with you.
translation:
  language: ko
  text: 그러나 당신은 율법과 계명을 지키고, 자비롭고 의로운 사람이 되십시오. 그리하면 당신에게 잘될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τήρησον τὸν νόμον καὶ τὰ προστάγματα
  english_pob_choice: keep the law and the commandments
  chosen_korean: 율법과 계명을 지키고
  alternatives_korean:
  - 율법과 명령들을 지키고
  - 율법과 규례를 지키고
  lexicon: νόμος=율법; προστάγματα=계명
  rationale: νόμος는 토라/율법을 가리키므로 ‘율법’으로 두고, προστάγματα는 단순한 ‘명령들’보다 개별적 계명에 가까워 ‘계명’으로 옮겼습니다.
- source_word: γενοῦ φιλελεήμων
  english_pob_choice: become merciful
  chosen_korean: 자비롭고
  alternatives_korean:
  - 자비로운 사람이 되고
  - 긍휼히 여기며
  lexicon: φιλελεήμων=자비로운, 자비를 사랑하는
  rationale: 동사 γίνομαι의 변화상을 살리기 위해 ‘되다’의 의미를 다음 절과 자연스럽게 연결하되, 형용사구를 한국어에서 매끄럽게 처리해 ‘자비롭고’로 표현했습니다.
- source_word: καὶ δίκαιος
  english_pob_choice: righteous
  chosen_korean: 의롭게
  alternatives_korean:
  - 의로운 사람이 되고
  - 의로우며
  lexicon: δίκαιος=의로운, 의롭다
  rationale: 문맥상 도덕적 상태의 권고이므로 ‘의롭다’의 부사형을 써서 앞의 ‘자비롭고’와 병렬을 이루게 했습니다.
- source_word: ἵνα σοι καλῶς ἦν
  english_pob_choice: so that it may go well with you
  chosen_korean: 그러면 네게 잘될 것입니다
  alternatives_korean:
  - 그래야 네게 좋을 것입니다
  - 그래서 네가 잘되게 될 것입니다
  lexicon: καλῶς ἔχειν=잘되다, 형통하다
  rationale: 결과 절의 관용적 의미를 한국어의 자연스러운 미래 표현으로 옮기되, 단순한 번영이 아니라 ‘잘됨/형통’의 약속을 살렸습니다.
theological_decisions:
- issue: 윤리 권면의 구조
  chosen_reading: 명령 준수와 성품 변화가 함께 제시되는 권면으로 이해했습니다.
  alternative_readings:
  - 단순한 도덕 교훈
  - 행위 조건을 강조하는 언약적 권면
  rationale: 본문은 율법·계명 준수와 자비·의의 성품을 병렬로 제시하여, 행동과 인격의 변화를 함께 요구합니다.
  doctrine_reference: 토비트 14:9
