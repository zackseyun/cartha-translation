  rationale: 접속사 δέ를 ‘그러나’로 바로잡고, γενοῦ φιλελεήμων καὶ δίκαιος를 ‘자비롭고 의로운 사람이 되십시오’로 옮겨 ‘되다’의 명령과 두 형용사의 병렬을 보존했습니다. 결과절은 원문의 관용적 ‘잘되다’ 의미를 유지했습니다.
