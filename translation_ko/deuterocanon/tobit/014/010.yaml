base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/010.yaml
  text: And bury me properly[a], and your mother with me, and do not stay any longer in Nineveh. Child, see what Nadab did to Ahikar, who had reared him—how he brought him from the light into the darkness, and all that he repaid him. But Ahikar was saved, while that man received the repayment, and he himself went down into the darkness. Manasseh did acts of mercy, and he was saved from the deadly snare that Nadab had set for him[b]; but Nadab fell into the trap and perished.
  footnotes:
  - marker: a
    text: Greek Ἀδὰμ here is the personal name of the treacherous courtier in the Ahikar story, not the first man Adam. The name is rendered 'Nadab' to avoid confusion; 'Adam' is a more literal transliteration of the Greek form.
    reason: alternative_reading
  - marker: b
    text: Or 'almsgiving' for 'acts of mercy'; the Greek term ἐλεημοσύνη often refers specifically to charitable giving in Tobit.
    reason: lexical_alternative
translation:
  language: ko
  text: 나를 잘 묻어 주고, 네 어머니도 나와 함께 묻으십시오. 더 이상 니네베에 머물지 마십시오. 얘야, 아담[a]이 자기를 길러 준 아히카르에게 한 일을 보십시오. 그가 어떻게 아히카르를 빛에서 어둠으로 끌고 갔는지, 또 그에게 어떻게 보답했는지 보십시오. 그러나 아히카르는 구출되었고, 아담은 보응을 받았으며, 그는 어둠으로 내려갔습니다. 므낫세는 자선을 베풀어[b] 아담이 그를 위해 쳐 놓은 죽음의 덫에서 구출되었지만, 아담은 그 덫에 빠져 죽었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 이 이름을 Ἀδὰμ(아담)이라고 적습니다. 여기서는 첫 사람 아담이 아니라 아히카르 전승의 배신자를 가리킵니다. 다른 전승에서는 이 인물이 나답 또는 나단으로 불립니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어 ἐλεημοσύνη는 ‘자선’ 또는 ‘구제’를 뜻하며, 토빗서에서는 특히 가난한 이들을 돕는 행위를 가리키는 경우가 많습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: θάψον με καλῶς
  english_pob_choice: bury me properly
  chosen_korean: 나를 잘 묻어 주고
  alternatives_korean:
  - 나를 적절히 묻어 주고
  - 나를 정중히 장사해 주고
  lexicon: LSJ
  rationale: θάπτω의 기본 뜻은 ‘묻다’이며, καλῶς는 장례를 ‘잘/올바르게’ 치르라는 뜻이므로 자연스러운 현대 한국어로 옮겼습니다.
- source_word: μηκέτι αὐλισθῆτε εἰς Νινευή
  english_pob_choice: do not stay any longer
  chosen_korean: 더 이상 니네베에 머물지 마라
  alternatives_korean:
  - 더 이상 니네베에 묵지 마라
  - 더 이상 니네베에 머무르지 마라
  lexicon: LSJ
  rationale: αὐλίζομαι는 문자적으로는 ‘묵다/숙박하다’이지만, 여기서는 니네베에 더 머물지 말라는 실질적 의미가 핵심이어서 ‘머물다’로 옮겼습니다.
- source_word: Ἀδὰμ
  english_pob_choice: Nadab
  chosen_korean: 아다드
  alternatives_korean:
  - 나다브
  - 아담
  lexicon: LSJ
  rationale: 토빗의 아히카르 전승에서 이 인물은 배신자 나답/나다난과 대응하므로, 첫 사람 아담과의 혼동을 피하는 표기 취지를 따라 한국어 본문도 구별되게 옮겼습니다.
- source_word: τὸ ἀνταπόδομα ἀπεδόθη
  english_pob_choice: received the repayment
  chosen_korean: 그 보응을 받았으며
  alternatives_korean:
  - 그 갚음을 받았으며
  - 그 되갚음을 받았으며
  lexicon: LSJ
  rationale: ἀνταπόδομα는 단순한 금전적 반환보다 ‘되갚음/보응’의 응답성 있는 보복·상응을 뜻하므로, 반복되는 ανταποδ- 어근을 살려 ‘보응’으로 옮겼습니다.
- source_word: ἐλεημοσύνην
  english_pob_choice: acts of mercy
  chosen_korean: 자선을 베풀었고
  alternatives_korean:
  - 긍휼을 베풀었고
  - 구제하였고
  lexicon: LSJ
  rationale: 토빗서에서 ἐλεημοσύνη는 흔히 구제적 자선을 가리키므로, 본문 의미를 분명히 하되 한국어 독자에게 자연스러운 ‘자선을 베풀다’로 옮겼습니다.
- source_word: παγίδος θανάτου
  english_pob_choice: deadly snare
  chosen_korean: 죽음의 덫
  alternatives_korean:
  - 치명적인 덫
  - 죽음의 올가미
  lexicon: LSJ
  rationale: παγίς는 덫/올가미의 이미지이며, θανάτου는 그 치명성을 나타내므로 직설적이고 간결한 ‘죽음의 덫’이 적절합니다.
theological_decisions:
- issue: Ἀχιάχαρος와 아다드의 아히카르 전승 인물 식별
  chosen_reading: 본문의 윤리적 교훈을 유지하면서, 배신자 이름은 전승상 대응되는 인물로 읽되 오해를 막는 방향으로 표기했습니다.
  alternative_readings:
  - 그리스어 표기대로 아담으로 옮김
  - 전승 이름을 아예 현대 독음으로만 통일함
  rationale: 이 단락은 창세기의 아담이 아니라 아히카르 전승의 배신자에 관한 예시이므로, 독자가 잘못 연결하지 않도록 이름 표기를 조정했습니다.
  doctrine_reference: 문맥적 고유명사 식별과 해석의 명료성
- issue: ἐλεημοσύνην의 의미
  chosen_reading: 구제적 자선으로서의 자선을 강조했습니다.
  alternative_readings:
  - 더 넓은 의미의 긍휼
  - 단순한 선행
  rationale: 토빗서는 자선 행위를 구원과 연결하는 문맥이 강하므로, ‘자선’으로 옮기되 행위성을 드러내는 동사를 붙였습니다.
  doctrine_reference: 토빗서의 자선-구원 문맥 유지
