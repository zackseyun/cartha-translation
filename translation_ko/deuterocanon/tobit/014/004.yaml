base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/004.yaml
  text: 'Go to Media[a], my child, because I am convinced that what Jonah the prophet spoke concerning Nineveh will happen: it will be overthrown. But in Media there will be peace for a while. And our brothers will be scattered from the good land, and Jerusalem will be desolate, and the house of God in it will be burned down[b], and it will be desolate until a time.'
  footnotes:
  - marker: a
    text: Or, 'there will be rather more peace until a season.' The Greek includes a comparative term that may suggest relative safety in Media rather than absolute peace.
    reason: lexical_alternative
  - marker: b
    text: '''The house of God'' refers to the temple in Jerusalem.'
    reason: cross_reference
translation:
  language: ko
  text: 메대로 가십시오, 내 아이야. 나는 요나 예언자가 니느웨에 관해 말한 것이 이루어져 그것이 무너질 것이라고 확신합니다. 그러나 메대에서는 한동안 평강이 있을 것입니다. 또 우리 형제들은 좋은 땅에서 흩어질 것이며, 예루살렘은 황폐해질 것이고, 그 가운데 있는 하나님의 집은 불타 버릴 것이며, 그것도 한때까지 황폐할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘평강이 있을 것입니다’는 절대적 평화라기보다 한동안의 상대적 안전을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘하나님의 집’은 예루살렘 성전을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἄπελθε
  english_pob_choice: Go
  chosen_korean: 가십시오
  alternatives_korean:
  - 가라
  - 가세요
  lexicon: LSJ
  rationale: aorist imperative의 직접 명령을 현대 합쇼체로 옮기되, 아버지의 권면성도 살리기 위해 공손한 명령형을 사용했습니다.
- source_word: Μηδείαν
  english_pob_choice: Media
  chosen_korean: 메대
  alternatives_korean:
  - 메디아
  - 메대 지방
  lexicon: LSJ
  rationale: 고유지명은 한국어 성서 용례와 가독성을 고려해 메대로 옮겼습니다.
- source_word: πέπεισμαι
  english_pob_choice: I am convinced
  chosen_korean: 나는 ... 확신합니다
  alternatives_korean:
  - 나는 ... 믿습니다
  - 나는 ... 확실히 압니다
  lexicon: LSJ
  rationale: 완료형이 나타내는 굳어진 확신 상태를 한국어 현재형으로 자연스럽게 살렸습니다.
- source_word: ὅσα ἐλάλησεν Ἰωνᾶς ὁ προφήτης περὶ Νινευὴ ὅτι καταστραφήσεται
  english_pob_choice: 'what Jonah the prophet spoke concerning Nineveh will happen: it will be overthrown'
  chosen_korean: 요나 예언자가 니느웨에 관해 말한 것이 이루어져 그것이 무너질 것이라고
  alternatives_korean:
  - 요나 예언자가 니느웨에 관해 말한 모든 것이 그것이 전복될 것이라고
  - 요나 예언자가 니느웨에 대해 말한 바, 그것이 무너질 것이라고
  lexicon: LSJ
  rationale: 헬라어의 '말한 것'과 뒤따르는 내용절을 한국어에서 자연스럽게 풀어, 예언의 성취를 명시하되 원문 의미를 넘지 않게 했습니다.
- source_word: καταστραφήσεται
  english_pob_choice: it will be overthrown
  chosen_korean: 무너질 것이라고
  alternatives_korean:
  - 전복될 것이라고
  - 파괴될 것이라고
  lexicon: LSJ
  rationale: 심판적 붕괴의 뉘앙스를 살리면서 현대 한국어에서 가장 자연스러운 동사를 택했습니다.
- source_word: ἔσται εἰρήνη μᾶλλον ἕως καιροῦ
  english_pob_choice: there will be peace for a while
  chosen_korean: 한동안 평강이 있을 것입니다
  alternatives_korean:
  - 오히려 더 평강이 있을 것입니다
  - 때까지 평강이 있을 것입니다
  lexicon: LSJ
  rationale: μᾶλλον의 비교적 뉘앙스는 완전한 평화가 아니라 상대적 안전을 가리킬 수 있으므로, 의미를 과장하지 않으면서도 자연스러운 한국어로 옮겼습니다.
- source_word: ὁ οἶκος τοῦ θεοῦ
  english_pob_choice: the house of God
  chosen_korean: 하나님의 집
  alternatives_korean:
  - 하나님의 성전
  - 하나님의 집(성전)
  lexicon: LSJ
  rationale: 직역을 유지해 원문 이미지를 살렸고, 문맥상 성전을 가리키지만 용어를 해석적으로 바꾸지는 않았습니다.
theological_decisions:
- issue: 예언 성취 진술의 문장화
  chosen_reading: 요나의 말이 '이루어져' 니느웨가 무너질 것이라고 표현해, 토빗이 선지자적 경고의 성취를 확신하는 구조를 드러냈습니다.
  alternative_readings:
  - 요나가 니느웨에 대해 말한 것은 무너질 것이라고
  - 요나 예언자가 니느웨에 관해 말한 바가 참이라고
  rationale: 원문의 ὅσα ... ὅτι 구문은 단순 인용보다 내용의 성취를 강조하므로, 한국어에서도 예언의 실현을 분명히 하되 신학적 확대는 하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: εἰρήνη μᾶλλον ἕως καιροῦ의 상대적 안전
  chosen_reading: 한동안 평강이 있을 것입니다
  alternative_readings:
  - 오히려 더 평강이 있을 것입니다
  - 그때까지 더 안전할 것입니다
  rationale: 평강을 절대적 평화로 오해하지 않도록, 본문이 시사하는 제한된 기간의 상대적 안정성을 보존했습니다.
  doctrine_reference: Lexical note on μᾶλλον in audit trail
