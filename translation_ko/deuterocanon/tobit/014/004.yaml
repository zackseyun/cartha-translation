revisions:
- from: 메대로 가십시오, 내 아이야. 나는 요나 예언자가 니느웨에 관해 말한 것이 이루어져 그것이 무너질 것이라고 확신합니다. 그러나 메대에서는 한동안 평강이 있을 것입니다. 또 우리 형제들은 좋은 땅에서 흩어질 것이며, 예루살렘은 황폐해질 것이고, 그 가운데 있는 하나님의 집은 불타 버릴 것이며, 그것도 한때까지 황폐할 것입니다.[a][b]
  to: 내 아들아, 메대로 가십시오. 나는 요나 예언자가 니느웨에 관하여 말한 대로 니느웨가 무너질 것을 확신합니다. 그러나 메대에서는 한동안 더 평안할 것입니다.[a] 우리 형제들은 좋은 땅에서 흩어질 것이며, 예루살렘은 황폐해질 것입니다. 그 안에 있는 하나님의 집은 불타 버리고[b], 그 집은 한동안 황폐한 채로 있을 것입니다.
  rationale: 수정문은 요나의 예언 내용과 토빗의 확신을 자연스러운 한국어로 연결하고, μᾶλλον의 비교적 뉘앙스를 본문과 각주 모두에서 보존했습니다. 또한 마지막 황폐의 대상이 예루살렘이 아니라 불타는 하나님의 집임을 명료하게 했습니다. 지명과 ‘하나님의 집’이라는 핵심 용어는 유지했으며, 본문이 명시하지 않는 비교 대상이나 신학적 해석은 덧붙이지 않았습니다.
  reviewer_model: gpt-5.6-terra
