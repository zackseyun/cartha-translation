source:
  edition: lxx-swete-1909
  text: καὶ πάλιν ἐλεήσει αὐτοὺς ὁ θεὸς καὶ ἐπιστρέψει αὐτοὺς εἰς τὴν γῆν, καὶ οἰκοδομήσουσιν τὸν οἶκον, οὐχ οἷος ὁ πρότερος, ἕως πληρωθῶσιν καιροὶ τοῦ αἰῶνος. καὶ μετὰ ταῦτα ἐπιστρέψουσιν ἐκ τῶν αἰχμαλωσιῶν καὶ οἰκοδομήσουσιν Ἰερουσαλὴμ ἐντίμως, καὶ ὁ οἶκος τοῦ θεοῦ ἐν αὐτῇ οἰκοδομηθήσεται ἐνδόξως, καθὼς ἐλάλησαν περὶ αὐτῆς οἱ προφῆται.
  language: Greek
