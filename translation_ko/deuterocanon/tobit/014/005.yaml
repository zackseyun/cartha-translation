base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/005.yaml
  text: And God will again have mercy on them and bring them back to the land[a], and they will build the house, though not like the former one, until the times of the age are fulfilled. And after these things they will return from the captivities and build Jerusalem honorably, and the house of God in her will be built gloriously[c][b], just as the prophets spoke concerning her.
  footnotes:
  - marker: a
    text: Or 'from exile.' The Greek has the plural 'from the captivities,' which may point to multiple places or episodes of exile.
    reason: lexical_alternative
  - marker: b
    text: '''The times of the age'' is an idiomatic phrase that may refer to appointed times leading up to God''s fuller restoration; the Greek is left intentionally open here.'
    reason: lexical_alternative
  - marker: c
    text: 'Jerusalem is referred to with feminine pronouns in Greek: ''in her'' and ''concerning her.'''
    reason: cultural_note
translation:
  language: ko
  text: 하나님께서는 다시 그들을 긍휼히 여기시고 그들을 그 땅으로 돌아오게 하실 것이며, 그들은 그 집을 건축할 것입니다. 그 시대의 때들이 다 찰 때까지는 그것이 이전의 집과 같지 않을 것입니다[b]. 그 후에 그들은 여러 포로 생활에서 돌아와[a] 예루살렘을 품위 있게 세울 것이며, 그 안에 하나님의 집이 영광스럽게 세워질 것입니다. 이는 예언자들이 예루살렘에 관하여 말한 바와 같습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘포로 생활에서.’ 그리스어는 복수형을 사용하며, 여러 포로 경험이나 여러 포로지를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 시대의 때들’은 원문의 관용적 표현입니다. 정해진 때들을 가리킬 수 있으나, 그 범위나 성격을 구체적으로 한정하지는 않습니다.
    reason: lexical_alternative
  - marker: c
    text: 그리스어는 예루살렘을 여성형 대명사로 가리켜, ‘그 안에’와 ‘예루살렘에 관하여’에 도시를 의인화하는 뉘앙스가 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλεήσει
  english_pob_choice: will have mercy on
  chosen_korean: 불쌍히 여기시고
  alternatives_korean:
  - 긍휼을 베푸시고
  - 자비를 베푸시고
  lexicon: BDAG
  rationale: 하나님의 자비로운 개입을 자연스러운 한국어로 옮기되, 단순한 감정보다 회복을 향한 연민의 행위를 드러내기 위해 ‘불쌍히 여기시고’를 택했습니다.
- source_word: ἐπιστρέψει αὐτοὺς εἰς τὴν γῆν
  english_pob_choice: bring them back to the land
  chosen_korean: 그들을 그 땅으로 돌이키실 것이며
  alternatives_korean:
  - 그들을 땅으로 다시 데려오실 것이며
  - 그들을 그 땅으로 돌아오게 하실 것이며
  lexicon: BDAG
  rationale: 직역적 ‘돌이키다/돌아오게 하다’의 회복 의미를 살리면서도, 영어 POB가 유지한 ‘the land’의 관용적 표현을 한국어로 자연스럽게 옮겼습니다.
- source_word: οἰκοδομήσουσιν τὸν οἶκον
  english_pob_choice: they will build the house
  chosen_korean: 그들은 그 집을 세울 것입니다
  alternatives_korean:
  - 그들은 성전을 지을 것입니다
  - 그들은 그 집을 건축할 것입니다
  lexicon: BDAG
  rationale: 본문의 ‘집’을 그대로 유지해 원문 어휘를 보존했고, 뒤이어 ‘하나님의 집’이 나와 성전임이 분명해지도록 했습니다.
- source_word: ἕως πληρωθῶσιν καιροὶ τοῦ αἰῶνος
  english_pob_choice: until the times of the age are fulfilled
  chosen_korean: 이 세대의 때들이 다 채워질 때까지입니다
  alternatives_korean:
  - 그 시대의 때들이 다 차기까지입니다
  - 영원의 때들이 다 채워질 때까지입니다
  lexicon: BDAG
  rationale: ‘καιροί’의 정해진 때와 ‘αἰών’의 시대적 의미를 살리되, 한국어에서는 지나치게 직역된 ‘시대의 시대’ 같은 어색함을 피하기 위해 ‘이 세대의 때들’로 옮겼습니다.
- source_word: ἐκ τῶν αἰχμαλωσιῶν
  english_pob_choice: from the captivities
  chosen_korean: 포로 상태들에서
  alternatives_korean:
  - 포로 생활에서
  - 포로됨들에서
  lexicon: LSJ
  rationale: 복수형을 살리기 위해 단수적 ‘포로 생활’보다 ‘포로 상태들’을 택해, 여러 포로 경험/유수를 가리킬 수 있는 원문의 여지를 보존했습니다.
- source_word: ἐντίμως
  english_pob_choice: honorably
  chosen_korean: 존귀하게
  alternatives_korean:
  - 존중받으며
  - 명예롭게
  lexicon: BDAG
  rationale: 예루살렘을 세우는 방식의 품위와 영예를 드러내기 위해, 건축 행위의 단순한 방식보다 결과의 존귀함을 강조하는 표현을 선택했습니다.
- source_word: ἐν αὐτῇ
  english_pob_choice: in her
  chosen_korean: 그 안에 있는
  alternatives_korean:
  - 그 안에서
  - 그녀 안에
  lexicon: BDAG
  rationale: 예루살렘을 여성형으로 인격화한 그리스어를 한국어에서 무리한 의인화 표현 대신 ‘그 안에 있는’으로 자연스럽게 반영했습니다.
- source_word: ἐνδόξως
  english_pob_choice: gloriously
  chosen_korean: 영광스럽게
  alternatives_korean:
  - 영화롭게
  - 찬란하게
  lexicon: BDAG
  rationale: δόξα의 신학적 울림을 유지하기 위해 단순한 미적 묘사보다 ‘영광’ 계열 표현을 사용했습니다.
theological_decisions:
- issue: Jerusalem personification in feminine pronouns and references
  chosen_reading: 예루살렘을 여성형 도시로 직접 번역하기보다 한국어에서는 ‘그 안에 있는 / 그에 관하여’로 풀어, 인격화된 도시 이미지는 보존하되 어색한 성별 표지를 과도하게 드러내지 않았습니다.
  alternative_readings:
  - 그녀 안에 있는 / 그녀에 관하여
  - 그것 안에 있는 / 그것에 관하여
  rationale: 원문은 예루살렘을 여성형으로 지시하지만, 한국어는 명사 성 구분이 없으므로 의미와 수사적 인격화만 살리는 쪽이 가장 충실합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1
- issue: ἕως πληρωθῶσιν καιροὶ τοῦ αἰῶνος
  chosen_reading: 이 세대의 때들이 다 채워질 때까지
  alternative_readings:
  - 정해진 때들이 다 채워질 때까지
  - 시대의 때들이 다 채워질 때까지
  rationale: 구원사적·종말론적 뉘앙스를 지나치게 특정한 체계로 고정하지 않고, 원문의 모호성과 개방성을 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
