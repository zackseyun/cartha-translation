revisions:
- from: 하나님께서는 다시 그들을 불쌍히 여기시고 그들을 그 땅으로 돌이키실 것이며[a], 그들은 그 집을 세울 것입니다. 그것은 이전의 것과 같지 않을 것이며, 이 세대의 때들이 다 채워질 때까지입니다[b]. 그 후에 그들은 포로 상태들에서 돌아와 예루살렘을 존귀하게 세울 것이며, 그 안에 있는 하나님의 집은 영광스럽게 세워질 것입니다. 이는 예언자들이 그에 관하여 말한 바와 같습니다[c].
  to: 하나님께서는 다시 그들을 긍휼히 여기시고 그들을 그 땅으로 돌아오게 하실 것이며, 그들은 그 집을 건축할 것입니다. 그 시대의 때들이 다 찰 때까지는 그것이 이전의 집과 같지 않을 것입니다[b]. 그 후에 그들은 여러 포로 생활에서 돌아와[a] 예루살렘을 품위 있게 세울 것이며, 그 안에 하나님의 집이 영광스럽게 세워질 것입니다. 이는 예언자들이 예루살렘에 관하여 말한 바와 같습니다[c].
  rationale: 원문의 미래 시제와 순서를 유지하면서, ‘때들이 다 찰 때까지’가 이전 집과 같지 않은 상태를 한정하도록 문장을 바로잡았습니다. αἰών의 의미를 특정 세대로 축소하지 않았고, 포로의 복수형은 자연스러운 한국어 안에서 ‘여러 포로 생활’로 반영했습니다. 각주 a를 실제로 설명하는 본문 표현에 붙였으며, 예루살렘의 여성형 대명사에 관한 각주도 개정 본문에 맞추었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:55:07Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 보존되었으나, ‘이 세대의 때들’은 τοῦ αἰῶνος를 부당하게 지시사 ‘이’와 ‘세대’로 좁히며, 첫 문단의 ‘…때까지입니다’는 원문의 시간 수식 관계를 한국어로 정확하고 자연스럽게 구현하지 못합니다. 또한 αἰχμαλωσιῶν의 복수는 본문에서 더 분명히 반영하는 편이 좋습니다.
  naturalness: 초안의 ‘포로 상태들’, ‘그 집을 세울 것입니다. 그것은 … 때까지입니다’는 현대 표준 한국어로 어색합니다. 문장 구조를 재구성하여 시간절이 ‘이전의 집과 같지 않음’을 수식하도록 해야 합니다.
  terminology: ἐλεήσει는 ‘긍휼히 여기시고’가 성서적이면서도 현대 합쇼체 문맥에 자연스럽습니다. αἰών은 특정 ‘세대’가 아니라 ‘시대’로, ἐντίμως는 ἐνδόξως의 ‘영광스럽게’와 구별하여 ‘품위 있게’로 옮깁니다. ‘그 집’ 및 ‘하나님의 집’은 원문의 어휘 연결을 보존합니다.
  issues:
  - severity: medium
    issue: ‘이 세대의 때들’
    rationale: τοῦ αἰῶνος에는 ‘이’에 해당하는 지시사가 없고, αἰών을 특정 세대라는 뜻으로 한정할 근거도 충분하지 않습니다. ‘그 시대의 때들’은 원문의 열린 표현을 더 잘 보존합니다.
  - severity: high
    issue: ‘그것은 이전의 것과 같지 않을 것이며, 이 세대의 때들이 다 채워질 때까지입니다’의 문장 구조
    rationale: 한국어로 비문에 가깝고, ἕως절이 이전 집과 같지 않다는 진술의 시간적 한계를 나타내는 원문 관계를 불분명하게 만듭니다.
  - severity: medium
    issue: ‘포로 상태들에서’
    rationale: 복수형을 기계적으로 재현하여 자연스럽지 않습니다. ‘여러 포로 생활에서’는 복수의 여지를 유지하면서도 읽기 쉽습니다.
  - severity: low
    issue: 각주 a의 위치와 내용
    rationale: 각주는 ‘포로 생활’의 복수형을 설명하지만 초안에서는 ‘그 땅으로 돌이키실 것이며’에 붙어 있습니다. 해당 표현 뒤로 옮겨야 합니다.
  - severity: low
    issue: 각주 c의 ‘그에 관하여’ 설명
    rationale: 개정 본문은 한국어의 자연스러운 지시 방식으로 ‘예루살렘에 관하여’라고 명시하므로, 그리스어 여성형 및 도시 의인화를 설명하는 각주로 정확히 조정하는 것이 좋습니다.
