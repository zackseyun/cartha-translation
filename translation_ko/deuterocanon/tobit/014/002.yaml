  text: And he was fifty-eight years old when he lost his sight[a], and after eight years he regained it; and he did acts of mercy[c][b], and he continued to fear God.
  footnotes:
  - marker: a
    text: Greek literally, 'he lost the sights' and later 'looked up/saw again,' an idiom for losing and recovering sight.
    reason: lexical_alternative
  - marker: b
    text: Or 'he gave alms'; the Greek term can refer specifically to almsgiving or more broadly to deeds of mercy.
    reason: lexical_alternative
  - marker: c
    text: The Greek says only 'continued to fear'; 'God' is implied by the pious context and supplied for clear English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 쉰여덟 살이었을 때 시력을 잃었고[a], 여덟 해가 지난 뒤에 다시 보게 되었습니다. 그는 계속 자선을 베풀었고[b], 하나님을 계속 경외하였습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘시각들을 잃었다’에 가깝게 말하며, 시력을 잃었다가 다시 보게 된 것을 나타내는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 자선 행위나, 더 넓게는 자비로운 행위를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 그리스어는 단지 ‘계속 경외하였다’라고만 말하며, ‘하나님’은 경건한 문맥상 보충한 것입니다.
    reason: lexical_alternative
