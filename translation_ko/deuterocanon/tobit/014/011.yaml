source:
  edition: lxx-swete-1909
  text: καὶ νῦν, παιδία, ἴδετε τί ἐλεημοσύνη ποιεῖ καὶ δικαιοσύνη ῥύεται. καὶ ταῦτα αὐτοῦ λέγοντος ἐξέλιπεν αὐτοῦ ἡ ψυχὴ ἐπὶ τῆς κλίνης· ἦν δὲ ἐτῶν ἑκατὸν πεντήκοντα ὀκτώ· καὶ ἔθαψεν αὐτὸν ἐνδόξως.
  language: Greek
  pages: []
  confidence: high
base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/011.yaml
  text: And now, children, see what almsgiving does, and how righteousness delivers. And while he was saying these things, his life came to an end on the bed. He was a hundred fifty-eight years old, and he buried him honorably.
  footnotes:
  - marker: a
    text: Or 'justice delivers.' The Greek word can denote either righteousness or justice depending on context.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'his soul failed/left him.' This is a Greek idiom for death.
    reason: lexical_alternative
  - marker: c
    text: 'Some readers may expect ''they buried him honorably,'' but the Greek witness here has a singular verb: ''he buried him honorably.'''
    reason: textual_variant
translation:
  language: ko
  text: 이제, 자녀들아, 자선이 무엇을 하는지, 또 의[a]가 어떻게 구원하는지를 보십시오. 그가 이 말을 하는 동안 그의 생명이 침상에서 다하였습니다[b]. 그는 백오십팔 세였으며, 그가 그를 명예롭게 장사하였습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정의가 구원한다.’ 그리스어 낱말은 문맥에 따라 ‘의’ 또는 ‘정의’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 혼이 다하였다’입니다. 이는 죽음을 가리키는 그리스어 관용구입니다.
    reason: lexical_alternative
  - marker: c
    text: 일부 독자는 ‘그들이 그를 명예롭게 장사하였다’를 예상할 수 있으나, 여기서 따르는 그리스어 본문은 단수 동사를 사용합니다.
    reason: textual_variant
lexical_decisions:
- source_word: παιδία
  english_pob_choice: children
  chosen_korean: 자녀들아
  alternatives_korean:
  - 아이들아
  - 얘들아
  lexicon: LSJ
  rationale: 호격 복수의 친밀한 부름을 살리되, 본문의 유언적 권면 분위기에 맞게 가족·후손을 아우르는 ‘자녀들아’로 옮겼습니다.
- source_word: ἐλεημοσύνη
  english_pob_choice: almsgiving
  chosen_korean: 자선을 베푸는 것
  alternatives_korean:
  - 구제
  - 자비
  lexicon: LSJ
  rationale: 토빗서의 문맥상 단순한 감정이 아니라 가난한 이에게 실제로 주는 행위를 가리키므로, 구체성을 살린 표현을 택했습니다.
- source_word: δικαιοσύνη
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 정의
  - 의로움
  lexicon: LSJ
  rationale: 프로젝트 기본어인 ‘의’를 따르되, 본문이 지혜문학적 도덕·신앙적 차원의 구원을 말하므로 ‘정의’보다 ‘의’가 더 직접적입니다.
- source_word: ἐξέλιπεν αὐτοῦ ἡ ψυχὴ
  english_pob_choice: his life came to an end
  chosen_korean: 그의 혼은 … 떠났습니다
  alternatives_korean:
  - 그의 생명이 다하였습니다
  - 그는 숨을 거두었습니다
  lexicon: LSJ
  rationale: 그리스어 관용구의 죽음 표현을 살리되, 본문이 말하는 ‘혼’과 ‘떠남’을 드러내면서도 죽음의 순간을 과도하게 해석하지 않도록 했습니다.
- source_word: ἔθαψεν αὐτὸν ἐνδόξως
  english_pob_choice: he buried him honorably
  chosen_korean: 그를 명예롭게 장사하였습니다
  alternatives_korean:
  - 그를 존귀하게 매장하였습니다
  - 그를 영예롭게 묻었습니다
  lexicon: LSJ
  rationale: ἐνδόξως는 장례의 존귀함을 뜻하므로, 교회적 관용어에 기대지 않고 의미를 직접 드러내는 ‘명예롭게 장사하였습니다’로 옮겼습니다.
theological_decisions:
- issue: δικαιοσύνη의 신학적 뉘앙스
  chosen_reading: ‘의’는 여기서 하나님 앞의 올바름과 그에 따른 구원의 능력을 함께 가리킵니다.
  alternative_readings:
  - ‘정의’로 읽어 사회윤리적 뜻을 강조할 수 있습니다.
  - ‘의로움’으로 풀어 설명할 수 있습니다.
  rationale: 토빗서의 문맥에서는 행위의 윤리성만이 아니라 하나님이 인정하시는 올바름이 사람을 건지신다는 진술이므로, 전통적 교리어가 아닌 간결한 ‘의’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: δικαιοσύνη → righteousness; preserve tension where context permits'
- issue: ἐξέλιπεν αὐτοῦ ἡ ψυχὴ의 인명론적 표현
  chosen_reading: ‘그의 혼은 떠났습니다’로 옮겨 죽음의 순간을 직설적으로 드러냈습니다.
  alternative_readings:
  - ‘그의 생명이 끝났습니다’로 완곡하게 옮길 수 있습니다.
  - ‘그의 혼이 떠나갔습니다’로 더 문자적으로 옮길 수 있습니다.
  rationale: 본문은 죽음의 사실을 말하지만, 혼의 실재와 분리된 방식까지 규정하지 않으므로 관용구의 의미와 본문의 긴장을 함께 살렸습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
