id: TOB.14.7
reference: Tobit 14:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: lxx-swete-1909
  text: καὶ εὐλογήσουσιν πάντα τὰ ἔθνη Κύριον. καὶ ὁ λαὸς αὐτοῦ ἐξομολογήσεται τῷ θεῷ, καὶ ὑψώσει Κύριος τὸν λαὸν αὐτοῦ· καὶ χαρήσονται πάντες οἱ ἀγαπῶντες Κύριον τὸν θεὸν ἐν ἀληθείᾳ καὶ δικαιοσύνῃ, ποιοῦντες ἔλεος τοῖς ἀδελφοῖς ἡμῶν.
  language: Greek
  pages: []
  confidence: high
base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/007.yaml
  text: And all the nations will bless the Lord[a]. And his people will give thanks to God, and the Lord will exalt his people; and all who love the Lord God in truth and righteousness will rejoice[c][b], showing mercy to our brothers.
  footnotes:
  - marker: a
    text: Or 'will confess God' or 'will praise God'; the Greek verb can carry senses of confession or thanksgiving/praise depending on context.
    reason: lexical_alternative
  - marker: b
    text: '''Righteousness'' could also be rendered ''justice,'' though here the sense is likely uprightness in devotion and conduct.'
    reason: lexical_alternative
  - marker: c
    text: Greek 'our brothers'; the term may function representatively for one's fellow kin or community members.
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 민족이 야훼를 찬송할 것입니다[a]. 그의 백성은 하나님께 감사할 것이고, 주님은 그의 백성을 높이실 것입니다. 야훼 하나님을 진리와 의로 사랑하는 모든 사람은 기뻐할 것이며[c][b], 우리의 형제들에게 자비를 베풀 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님을 고백할 것이다’ 또는 ‘하나님을 찬양할 것이다’; 그리스어 동사는 문맥에 따라 고백이나 감사/찬양의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘의’는 여기서 ‘공의’로도 옮길 수 있으나, 문맥상 경건한 삶의 바름을 가리키는 뜻이 더 강합니다.
    reason: lexical_alternative
  - marker: c
    text: 그리스어는 ‘우리의 형제들’을 뜻하며, 문맥에 따라 혈연이나 공동체의 동료를 대표적으로 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογήσουσιν
  english_pob_choice: will bless
  chosen_korean: 찬송할 것입니다
  alternatives_korean:
  - 축복할 것입니다
  - 복을 빌 것입니다
  lexicon: BDAG
  rationale: 문맥상 민족들이 야훼를 향해 드리는 응답은 단순한 복 주기가 아니라 찬양의 의미가 강하므로, 한국어에서는 자연스럽고 경건한 반응을 드러내는 ‘찬송하다’가 적절합니다.
- source_word: ἐξομολογήσεται
  english_pob_choice: will give thanks
  chosen_korean: 감사할 것이고
  alternatives_korean:
  - 고백할 것이고
  - 찬송할 것이고
  lexicon: BDAG
  rationale: 이 동사는 문맥에 따라 고백·감사·찬양의 뜻을 가질 수 있는데, 여기서는 하나님께 드리는 예배적 응답의 연속이므로 ‘감사하다’가 가장 자연스럽습니다.
- source_word: ἐν ἀληθείᾳ καὶ δικαιοσύνῃ
  english_pob_choice: in truth and righteousness
  chosen_korean: 진리와 의로
  alternatives_korean:
  - 진리와 공의로
  - 참됨과 의로
  lexicon: BDAG
  rationale: δικαιοσύνη를 기본값인 ‘의’로 옮겨, 단순한 도덕적 바름과 언약적 충실함의 뉘앙스를 함께 살렸습니다.
- source_word: ποιοῦντες ἔλεος
  english_pob_choice: showing mercy
  chosen_korean: 자비를 베풀 것입니다
  alternatives_korean:
  - 긍휼을 행할 것입니다
  - 자비를 행할 것입니다
  lexicon: BDAG
  rationale: 직역의 ‘자비를 행하다’보다 한국어에서는 ‘자비를 베풀다’가 관용적으로 자연스럽고, 행위의 적극성을 잘 드러냅니다.
- source_word: τοῖς ἀδελφοῖς ἡμῶν
  english_pob_choice: to our brothers
  chosen_korean: 우리의 형제들에게
  alternatives_korean:
  - 우리 형제들에게
  - 우리의 형제자매들에게
  lexicon: BDAG
  rationale: 그리스어 남성 복수형을 보존해 ‘형제들’로 옮겼고, 대표적 공동체 지칭 가능성은 주해에서 열어 두었습니다.
theological_decisions:
- issue: Κύριος와 YHWH의 대응
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문 앞부분의 Κύριον은 LXX 인용/유대 경전 배경에서 야훼를 가리키므로, 프로젝트 기본값에 따라 본문에서는 ‘야훼’로 드러내는 것이 원문-성경간 대응을 가장 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יהוה / YHWH → 야훼'
- issue: Κύριος의 비인용 용례
  chosen_reading: 주님
  alternative_readings:
  - 야훼
  - 주
  rationale: 같은 절 안에서도 ‘주님은 그의 백성을 높이실 것입니다’의 Κύριος는 서술적 호칭으로 기능하므로, 한국어에서는 흐름을 살려 ‘주님’으로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → 주(主) / 주님'
