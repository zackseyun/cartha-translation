  source_fidelity: 그리스어의 네 호칭(Κύριος, θεός, Κύριος, Κύριος ὁ θεός)에 맞추어 ‘주님/하나님/주님/주 하나님’으로 일관되게 구별했습니다. εὐλογέω는 한국어 성경 문체에서 자연스러운 ‘찬송하다’로, ἐξομολογέω는 문맥상 ‘감사하다’로 옮겼습니다. 마지막 분사구는 주님 하나님을 사랑하는 이들을 수식하는 동시적 행위로 유지했습니다.
