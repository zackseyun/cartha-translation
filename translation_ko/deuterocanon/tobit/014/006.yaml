source:
  edition: lxx-swete-1909
  text: καὶ πάντα τὰ ἔθνη ἐπιστρέψουσιν ἀληθινῶς φοβεῖσθαι Κύριον τὸν θεόν· κατορύξουσιν τὰ εἴδωλα αὐτῶν·
  language: Greek
