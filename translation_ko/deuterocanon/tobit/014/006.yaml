base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/006.yaml
  text: And all the nations will truly turn to fear the Lord God[a]; they will bury their idols.
  footnotes:
  - marker: a
    text: Or 'will truly return to fear the Lord God.' The Greek verb can mean 'turn' or 'return,' here expressing the nations' sincere turning toward God.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 모든 민족이 참으로 주 하나님을 두려워하게 될 것이며, 그들은 자기들의 우상들을 묻을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주 하나님을 두려워하기 위해 참으로 돌아설 것입니다.’ 그리스어 동사는 ‘돌다’ 또는 ‘돌아오다’를 뜻할 수 있으며, 여기서는 민족들의 진실한 방향 전환을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα τὰ ἔθνη
  english_pob_choice: all the nations
  chosen_korean: 모든 민족
  alternatives_korean:
  - 모든 나라들
  - 모든 이방 민족
  lexicon: LSJ
  rationale: ἔθνη는 이 절에서 이스라엘과 대조되는 기술적 의미보다 세계의 민족들을 가리키는 보편적 표현이므로, 넓은 범위를 살리는 ‘모든 민족’이 자연스럽습니다.
- source_word: ἐπιστρέψουσιν
  english_pob_choice: will turn
  chosen_korean: 두려워하게 될 것입니다
  alternatives_korean:
  - 돌아설 것입니다
  - 돌이킬 것입니다
  - 회개할 것입니다
  lexicon: LSJ
  rationale: 직접 대응은 ‘돌아서다/돌이키다’이지만, 본문에서는 ‘주 하나님을 두려워하는 쪽으로 돌아서는 것’이 목적어와 함께 완성되므로 한국어에서는 결과를 풀어 ‘두려워하게 될 것입니다’로 옮겨 의미를 드러냈습니다.
- source_word: φοβεῖσθαι
  english_pob_choice: to fear
  chosen_korean: 두려워하다
  alternatives_korean:
  - 경외하다
  - 예배하다
  lexicon: LSJ
  rationale: 소스어의 직접적인 의미인 ‘두려워하다’를 유지해 신학적 긴장과 성서적 어감을 보존했습니다.
- source_word: Κύριον τὸν θεόν
  english_pob_choice: the Lord God
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주, 하나님
  - 주님 하나님
  lexicon: LSJ
  rationale: κύριος와 θεός의 결합은 한국어 성경의 자연스러운 관용형인 ‘주 하나님’으로 옮기되, 영어처럼 불필요한 소유격은 덧붙이지 않았습니다.
- source_word: κατορύξουσιν τὰ εἴδωλα αὐτῶν
  english_pob_choice: they will bury their idols
  chosen_korean: 그들은 자기들의 우상들을 묻을 것입니다
  alternatives_korean:
  - 그들은 자기들의 우상들을 감출 것입니다
  - 그들은 자기들의 우상들을 땅에 파묻을 것입니다
  lexicon: LSJ
  rationale: κατορύξουσιν은 문자적으로 ‘파묻다/묻다’이므로, 우상 포기의 장면을 살리는 ‘묻다’가 가장 직결됩니다.
theological_decisions:
- issue: ἐπιστρέψουσιν의 번역을 회심/개종 용어로 고정할지 여부
  chosen_reading: ‘돌아서는’ 동작을 결과적으로 풀어 ‘두려워하게 될 것입니다’로 표현했습니다.
  alternative_readings:
  - 돌이킬 것입니다
  - 개종할 것입니다
  - 회개할 것입니다
  rationale: 그리스어는 기술적 개종 용어가 아니라 ‘돌아서다’라는 표상을 사용하므로, 그 은유를 과도하게 제도화하지 않으면서도 문맥상 의미를 분명히 했습니다.
  doctrine_reference: 'DOCTRINE.md: 원문 우선, 신학적 용어의 과잉 고정 지양'
- issue: φοβεῖσθαι를 ‘경외하다’로 완화할지 여부
  chosen_reading: ‘두려워하다’를 유지했습니다.
  alternative_readings:
  - 경외하다
  - 존경하다
  rationale: 본문의 핵심은 하나님 앞에서의 경외와 두려움이 함께 있는 성서적 표현이므로, 이를 현대적으로 완화해 의미의 압력을 약화시키지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: 신학적 긴장을 보존하고 평탄화하지 말 것'
