base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/013.yaml
  text: And he grew old honorably[a], and he buried his parents-in-law with honor, and he inherited their property and that of Tobit his father.
  footnotes:
  - marker: a
    text: Or, more literally, 'he buried his parents-in-law gloriously/splendidly'; here the sense is taken as an honorable burial rather than display.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 명예롭게 늙어 갔고, 그의 장인과 장모를 명예롭게 장사하였으며, 그들의 재산과 그의 아버지 토빗의 것을 상속하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘명예롭게’는 ἐντίμως의 기본 뜻을 따른 것이며, ἐνδόξως는 장례를 ‘명예롭게’ 치렀다는 뜻으로 이해했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγήρασεν ἐντίμως
  english_pob_choice: he grew old honorably
  chosen_korean: 명예롭게 늙어 갔고
  alternatives_korean:
  - 존귀하게 늙어 갔고
  - 명예 가운데 늙어 갔고
  lexicon: LSJ
  rationale: ἐγήρασεν은 ‘늙다/나이 들다’의 진행을, ἐντίμως는 ‘명예롭게/존귀하게’의 태도를 나타내므로 둘을 함께 살려 자연스럽게 옮겼습니다.
- source_word: τοὺς πενθεροὺς αὐτοῦ
  english_pob_choice: his parents-in-law
  chosen_korean: 그의 장인과 장모
  alternatives_korean:
  - 그의 부모님 같은 사람들
  - 그의 시부모와 장인장모
  lexicon: LSJ
  rationale: πενθερός의 복수는 배우자의 부모를 가리키므로 한국어에서는 관계가 분명한 ‘장인과 장모’가 가장 자연스럽습니다.
- source_word: ἔθαψεν ... ἐνδόξως
  english_pob_choice: he buried ... with honor
  chosen_korean: 명예롭게 장사하였으며
  alternatives_korean:
  - 영광스럽게 장사하였으며
  - 존귀하게 매장하였으며
  lexicon: LSJ
  rationale: ἐνδόξως는 장례 문맥에서 과시적 ‘영광’보다 ‘명예롭게/존중을 다하여’의 뜻이 적절하므로, ἔθαψεν은 ‘장사하다’로 직접 옮겼습니다.
- source_word: ἐκληρονόμησεν τὴν οὐσίαν αὐτῶν καὶ Τωβεὶτ τοῦ πατρὸς αὐτοῦ
  english_pob_choice: he inherited their property and that of Tobit his father
  chosen_korean: 그들의 재산과 그의 아버지 토빗의 것을 상속하였습니다
  alternatives_korean:
  - 그들의 재산과 그의 아버지 토빗의 재산을 물려받았습니다
  - 그들의 소유와 그의 아버지 토빗의 소유를 상속하였습니다
  lexicon: LSJ
  rationale: οὐσία는 이 문맥에서 ‘재산/소유물’의 뜻이므로 ‘재산’이 가장 분명하며, ἐκληρονόμησεν은 법적·상속적 취지를 살려 ‘상속하다’로 옮겼습니다.
