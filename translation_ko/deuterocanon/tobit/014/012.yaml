    rationale: ‘엑바타나’는 표준 한국어 성서·학술 용례에 더 가깝고, ‘엑바타나에 있는 … 라구엘에게’는 πρὸς Ῥαγουὴλ을 자연스러운 한국어로 옮깁니다.
