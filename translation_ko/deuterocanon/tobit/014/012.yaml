translation:
  language: ko
  text: 그리고 안나가 죽었을 때 그는 그녀를 자기 아버지와 함께 묻었습니다. 그런 다음 토비아스는 자기 아내와 자기 아들들과 함께 에크바타나로, 곧 자기 장인 라구엘에게 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 이 절에서 첫 번째 동사의 행위자를 명시하지 않습니다. 다음 절에서만 Τωβίας가 직접 나옵니다.
    reason: source_note
lexical_decisions:
- source_word: ἀπέθανεν
  english_pob_choice: died
  chosen_korean: 죽었을 때
  alternatives_korean:
  - 세상을 떠났을 때
  - 별세했을 때
  lexicon: BDAG
  rationale: 아오리스트 ἀποθνῄσκω의 직접적 의미를 살려, 완곡어보다 사건 서술에 충실한 ‘죽었을 때’로 옮겼습니다.
- source_word: ἔθαψεν αὐτὴν μετὰ τοῦ πατρὸς αὐτοῦ
  english_pob_choice: he buried her with his father
  chosen_korean: 그녀를 자기 아버지와 함께 묻었습니다
  alternatives_korean:
  - 그녀를 자기 아버지 곁에 묻었습니다
  - 그녀를 자기 아버지와 나란히 묻었습니다
  lexicon: BDAG
  rationale: θάπτω는 단순히 ‘묻다/장사하다’의 뜻이므로 ‘묻었습니다’가 직접적이며, μετὰ τοῦ πατρὸς αὐτοῦ는 과도한 해석 없이 가족 묘역의 동반 매장을 드러내는 ‘자기 아버지와 함께’로 보존했습니다.
- source_word: ἀπῆλθεν δὲ Τωβίας
  english_pob_choice: Then Tobias went away
  chosen_korean: 그런 다음 토비아스는
  alternatives_korean:
  - 그때 토비아스는
  - 그러자 토비아스는
  lexicon: LSJ
  rationale: 그리스어에 명시된 주어 Τωβίας를 그대로 살려 ‘토비아스’로 옮겼고, ἀπῆλθεν의 이동성을 반영해 이어지는 ‘갔습니다’와 결합했습니다.
- source_word: πρὸς Ῥαγουὴλ τὸν πενθερὸν αὐτοῦ
  english_pob_choice: to Raguel his father-in-law
  chosen_korean: 자기 장인 라구엘에게
  alternatives_korean:
  - 장인 라구엘에게
  - 시아버지 라구엘에게
  lexicon: BDAG
  rationale: πρὸς + 인칭 목적어는 ‘~에게’로 자연스럽고, πενθερός는 ‘장인/사위의 아버지’ 관계이므로 ‘자기 장인’으로 명확히 했습니다.
theological_decisions:
- issue: 첫 절의 행위자 누락과 다음 절의 명시적 주어
  chosen_reading: 첫 절은 행위자를 보충하지 않고 ‘그는’으로 두며, 다음 절의 Τωβίας는 ‘토비아스’로 명시했습니다.
  alternative_readings:
  - 첫 절의 ‘그는’를 토비아스나 토빗으로 구체화할 수 있음
  rationale: 헬라어는 첫 절에 암시된 주어를 비워 두고, 다음 절에서만 Τωβίας를 명시하므로, 본문이 가진 모호성을 해소하지 않고 그대로 드러내는 편이 원문에 충실합니다.
  doctrine_reference: 원문 우선 원칙; 서사적 모호성 보존
