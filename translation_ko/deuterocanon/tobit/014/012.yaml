  source_fidelity: 본문은 대체로 헬라어를 충실히 옮겼습니다. 다만 주석이 ‘첫 번째 동사’의 행위자가 명시되지 않았다고 하여, 실제로 주어가 명시된 ἀπέθανεν(‘안나가 죽었다’)에 관해 잘못 말합니다. 주어가 생략된 동사는 ἔθαψεν(‘그는 묻었다’)입니다. 또한 Ἐκβάτανα의 통용 한국어 표기는 ‘엑바타나’가 더 적절합니다.
