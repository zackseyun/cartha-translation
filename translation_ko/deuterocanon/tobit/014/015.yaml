base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/015.yaml
  text: And before he died[a], he heard of the destruction of Nineveh, which Nebuchadnezzar and Ahasuerus had taken captive; before dying, he rejoiced over Nineveh. Amen.
  footnotes:
  - marker: a
    text: 'Greek: ''which Nebuchadnezzar and Ahasuerus had taken captive.'' The wording is retained as found in the source text, though interpreters debate the historical identification of these rulers in relation to Nineveh''s fall.'
    reason: alternative_reading
translation:
  language: ko
  text: 그는 죽기 전에, 느부갓네살과 아하수에로스가 사로잡았던 니네베의 멸망 소식을 들었습니다[a]. 그는 죽기 전에 니네베를 두고 기뻐했습니다. 아멘.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 ‘느부갓네살과 아하수에로스가 사로잡았던 니네베’라고 읽습니다. 이 표현은 본문에 있는 그대로 유지했습니다. 니네베의 함락과 관련하여 이 통치자들이 누구를 가리키는지에 대해서는 해석자들 사이에 논의가 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἤκουσεν
  english_pob_choice: he heard of
  chosen_korean: 들었는데
  alternatives_korean:
  - 알았는데
  - 전해 들었는데
  lexicon: LSJ
  rationale: 본문의 핵심은 사건을 ‘듣다’는 뜻이므로, 한국어에서는 보고적 연결을 살린 ‘들었는데’로 옮겨 자연스러운 서술 흐름을 유지했습니다.
- source_word: πρὶν ἢ ἀποθανεῖν αὐτόν
  english_pob_choice: before he died
  chosen_korean: 그가 죽기 전에
  alternatives_korean:
  - 죽기 전에
  - 그가 죽기 이전에
  lexicon: LSJ
  rationale: 부정사 구성의 시간 관계를 한국어에서 가장 직접적으로 드러내는 표현으로 처리했습니다.
- source_word: τὴν ἀπώλειαν Νινευή
  english_pob_choice: the destruction of Nineveh
  chosen_korean: 니네베의 멸망
  alternatives_korean:
  - 니네베의 파멸
  - 니네베의 멸절
  lexicon: LSJ
  rationale: 역사적 맥락에서 ἀπώλεια는 도시의 전복과 멸망을 뜻하므로, 현대 한국어에서 가장 분명한 ‘멸망’을 택했습니다.
- source_word: ᾐχμαλώτισεν Ναβουχοδονοσὸρ καὶ Ἀσύηρος
  english_pob_choice: Nebuchadnezzar and Ahasuerus had taken captive
  chosen_korean: 느부갓네살과 아하수에로스가 사로잡았던 것입니다
  alternatives_korean:
  - 느부갓네살과 아하수에로스가 포로로 잡았던 것입니다
  - 느부갓네살과 아하수에로스가 사로잡아 갔던 것입니다
  lexicon: LSJ
  rationale: ᾐχμαλώτισεν의 핵심인 ‘포로로 잡다/사로잡다’를 살리면서, 본문의 수동적 결과를 한국어의 관형절로 반영했습니다.
- source_word: ἐπὶ Νινευή
  english_pob_choice: over Nineveh
  chosen_korean: 니네베로 인해
  alternatives_korean:
  - 니네베를 두고
  - 니네베 위에서
  lexicon: LSJ
  rationale: 기쁨의 대상/계기를 나타내는 ἐπί의 용법을 한국어에서 가장 무리 없이 드러내기 위해 원인·계기 의미의 ‘~로 인해’를 택했습니다.
theological_decisions:
- issue: 느부갓네살과 아하수에로스의 역사적 동일시 문제를 번역에서 정리할지 여부
  chosen_reading: 본문의 이름들을 그대로 두고, 역사적 조정 없이 ‘느부갓네살과 아하수에로스’로 옮겼습니다.
  alternative_readings:
  - 후대 역사 이해에 맞게 이름을 조정하거나 설명하는 방식
  rationale: 번역은 그리스어 증언 자체를 보존해야 하므로, 본문이 지닌 역사적 긴장은 주석에서 다루어야 합니다.
  doctrine_reference: '원문 우선 원칙: 번역은 조화보다 증언 보존을 우선합니다.'
