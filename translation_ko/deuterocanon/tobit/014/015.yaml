  text: καὶ ἤκουσεν πρὶν ἢ ἀποθανεῖν αὐτὸν τὴν ἀπωλίαν Νινευὴ ἣν ᾐχμαλώτισεν Ναβουχοδονοσὸρ καὶ Ἀσύηρος· ἐχάρη πρὸ τοῦ ἀποθανεῖν ἐπὶ Νινευή. ἀμήν.
