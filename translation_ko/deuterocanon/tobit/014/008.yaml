base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/008.yaml
  text: And now[a], child, depart from Nineveh, because what the prophet Jonah spoke will surely happen.
  footnotes:
  - marker: a
    text: Or 'son' for 'child'; the Greek τέκνον is a filial term of address and can be rendered either way depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제, 아이야, 니네베에서 떠나십시오. 왜냐하면 예언자 요나가 말한 것은 반드시 일어날 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: τέκνον은 ‘아이/자녀/아들’로도 옮길 수 있는 혈연적 호칭입니다. 여기서는 성별을 특정하지 않는 친밀한 호칭으로 처리했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνον
  english_pob_choice: child
  chosen_korean: 아이야
  alternatives_korean:
  - 자녀야
  - 아들아
  lexicon: BDAG
  rationale: filial 호칭을 살리되, ‘아들’처럼 성별을 좁히지 않고 현대 한국어에서 직접 부를 때 자연스러운 친밀한 호칭으로 옮겼습니다.
- source_word: ἄπελθε
  english_pob_choice: depart
  chosen_korean: 떠나십시오
  alternatives_korean:
  - 가십시오
  - 떠나세요
  lexicon: BDAG
  rationale: 즉각적인 이탈 명령을 공손한 명령형으로 옮기면서, 단순 이동보다 분리·출발의 뉘앙스를 살렸습니다.
- source_word: πάντως ἔσται
  english_pob_choice: will surely happen
  chosen_korean: 반드시 일어날 것입니다
  alternatives_korean:
  - 틀림없이 이루어질 것입니다
  - 반드시 그렇게 될 것입니다
  lexicon: BDAG
  rationale: 미래의 확실성을 강조하는 πάντως를 한국어의 ‘반드시’로, 예언 성취는 ‘일어날 것’으로 자연스럽게 표현했습니다.
- source_word: ὁ προφήτης Ἰωνᾶς
  english_pob_choice: the prophet Jonah
  chosen_korean: 예언자 요나
  alternatives_korean:
  - 선지자 요나
  - 요나 예언자
  lexicon: BDAG
  rationale: 직역에 가까운 ‘예언자’를 사용해 직함을 분명히 했고, 인명은 한국어 성서 관용형 ‘요나’를 따랐습니다.
theological_decisions:
- issue: 예언 성취의 확실성
  chosen_reading: ‘반드시 일어날 것입니다’로 옮겨, 요나의 말이 단순 가능성이 아니라 확정된 예언임을 드러냈습니다.
  alternative_readings:
  - ‘틀림없이 이루어질 것입니다’
  - ‘꼭 그렇게 될 것입니다’
  rationale: 본문은 요나의 발언이 성취될 것이라는 토빗의 확신을 제시하므로, 시간이나 방식의 추가 해석 없이 확실성만 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
