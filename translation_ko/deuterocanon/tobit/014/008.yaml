  source_fidelity: 본문의 핵심 의미는 대체로 정확합니다. 다만 τέκνον에 대한 각주 표기는 이 단어가 반드시 혈연 관계만을 뜻하는 것처럼 제한하여 설명하므로 수정하는 것이 좋습니다. πάντως의 강조와 ἀπὸ Νινευή의 이탈 명령은 보존되었습니다.
