base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/001.yaml
  text: And when they had finished dining[b][a], they brought Tobiah in to her.
  footnotes:
  - marker: a
    text: 'Greek: ''they brought Tobiah to her.'' The Semitic parallel tradition expands the scene with details about preparing the room and the couple entering it together before the door is shut.'
    reason: alternative_reading
  - marker: b
    text: Traditional English versions often use 'Tobias' here; the Greek name is rendered with the transliterated form 'Tobiah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 식사를 마치자, 토비아를 그녀에게 데려갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 “그들은 토비아를 그녀에게 데려갔다”라고 합니다. 셈어 평행 전승은 방을 준비하는 일과 두 사람이 함께 들어가는 장면, 문을 닫는 장면을 덧붙입니다.
    reason: alternative_reading
  - marker: b
    text: 전통적인 번역에서는 이 이름을 ‘토비아스’로 옮기기도 합니다. 그리스어 본문은 Τωβείαν이라고 하며, 여기서는 셈어적 형태를 반영하여 ‘토비아’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ συνετέλεσαν
  english_pob_choice: And when they had finished
  chosen_korean: 그리고 그들이 식사를 마치자
  alternatives_korean:
  - 그리고 그들이 다 먹고 나자
  - 그리고 식사가 끝나자
  lexicon: LSJ
  rationale: Ὅτε δὲ의 시간 전환과 συνετέλεσαν의 완료 의미를 자연스러운 서술로 살렸습니다. POB의 'had finished dining'처럼 식사 완료가 먼저라는 순서를 분명히 했습니다.
- source_word: δειπνοῦντες
  english_pob_choice: dining
  chosen_korean: 식사를
  alternatives_korean:
  - 저녁을
  - 만찬을
  lexicon: LSJ
  rationale: δειπνοῦντες는 주된 식사를 가리키므로, 한국어에서는 문화적으로 덜 제한적인 '식사'로 옮겼습니다.
- source_word: εἰσήγαγον
  english_pob_choice: they brought in
  chosen_korean: 데려갔습니다
  alternatives_korean:
  - 안으로 데려갔습니다
  - 들여보냈습니다
  lexicon: LSJ
  rationale: 동사의 핵심인 '안으로 들여감'을 살리되, 결혼 서사의 맥락에서 자연스럽게 읽히도록 한국어 서술어를 선택했습니다.
- source_word: Τωβείαν
  english_pob_choice: Tobiah
  chosen_korean: 토비아
  alternatives_korean:
  - 토비아스
  lexicon: 고유명사 표기 관행
  rationale: POB의 이름 처리 원칙에 따라 헬라어형보다 셈어적 형태를 반영하는 음역을 택했습니다.
theological_decisions:
- issue: πρὸς αὐτήν의 관계 방향
  chosen_reading: 그녀에게
  alternative_readings:
  - 그녀 쪽으로
  - 그녀 앞에
  rationale: πρός + 대격은 여기서 단순한 도착/인도의 방향을 나타내므로, 과도한 해석 없이 '그녀에게'로 옮기는 것이 가장 정확합니다.
  doctrine_reference: 'DOCTRINE.md: source-directed, minimal interpretation'
