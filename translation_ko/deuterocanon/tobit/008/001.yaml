base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/001.yaml
  text: And when they had finished dining[b][a], they brought Tobiah in to her.
  footnotes:
  - marker: a
    text: 'Greek: ''they brought Tobiah to her.'' The Semitic parallel tradition expands the scene with details about preparing the room and the couple entering it together before the door is shut.'
    reason: alternative_reading
  - marker: b
    text: Traditional English versions often use 'Tobias' here; the Greek name is rendered with the transliterated form 'Tobiah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들이 식사를 마치자, 그들은 토비아를 그녀에게 데려갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 단순히 “그들은 토비아를 그녀에게 데려갔다”라고 합니다. 셈어 평행 전승은 방 준비와 둘이 함께 들어가는 장면, 문을 닫는 장면을 덧붙입니다.
    reason: alternative_reading
  - marker: b
    text: 전통적인 번역에서는 이 이름을 ‘토비아스’로 옮기기도 하지만, 그리스어형과 셈어 전승을 고려해 ‘토비아’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ συνετέλεσαν
  english_pob_choice: And when they had finished
  chosen_korean: 그리고 그들이 식사를 마치자
  alternatives_korean:
  - 그리고 그들이 다 먹고 나자
  - 그리고 식사가 끝나자
  lexicon: LSJ
  rationale: Ὅτε δὲ의 시간 전환과 συνετέλεσαν의 완료 의미를 자연스러운 서술로 살렸습니다. POB의 'had finished dining'처럼 식사 완료가 먼저라는 순서를 분명히 했습니다.
- source_word: δειπνοῦντες
  english_pob_choice: dining
  chosen_korean: 식사를
  alternatives_korean:
