  - 만찬을
  lexicon: LSJ
  rationale: δειπνοῦντες는 주된 식사를 가리키므로, 한국어에서는 문화적으로 덜 제한적인 '식사'로 옮겼습니다.
- source_word: εἰσήγαγον
  english_pob_choice: they brought in
  chosen_korean: 데려갔습니다
