  lexicon: LSJ
  rationale: 동사의 핵심인 '안으로 들여감'을 살리되, 결혼 서사의 맥락에서 자연스럽게 읽히도록 한국어 서술어를 선택했습니다.
- source_word: Τωβείαν
  english_pob_choice: Tobiah
  chosen_korean: 토비아
  alternatives_korean:
