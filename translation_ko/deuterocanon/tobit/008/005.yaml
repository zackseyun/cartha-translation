base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/005.yaml
  text: And Tobiah began to say[a], “Blessed are you, O God of our fathers, and blessed is your holy and glorious name forever; may the heavens and all your creation bless you.”
  footnotes:
  - marker: a
    text: Or 'all your creation.' The Greek phrase can refer broadly to everything God has made, not only living beings.
    reason: lexical_alternative
translation:
  language: ko
  text: 토비야가 말하기 시작했습니다. 「찬양받으소서, 우리 조상들의 하나님이신 주님! 당신의 거룩하고 영광스러운 이름도 영원히 찬양받으소서. 하늘들과 당신의 모든 창조물아, 당신을 찬양하십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 πᾶσαι αἱ κτίσεις σου는 ‘당신의 모든 창조물’ 또는 ‘당신의 모든 피조물’처럼 넓게 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξατο ... λέγειν
  english_pob_choice: began to say
  chosen_korean: 말하기 시작했습니다
  alternatives_korean:
  - 말하기를 시작했습니다
  - 말하기 시작하여
  lexicon: BDAG
  rationale: 그리스어 관용구 ἄρχομαι + 부정사를 자연스러운 서술로 옮기되, 본문의 기도 시작을 분명히 드러내는 표현을 택했습니다.
- source_word: Εὐλογητὸς εἶ
  english_pob_choice: Blessed are you
  chosen_korean: 찬양받으소서
  alternatives_korean:
  - 복되시나이다
  - 복을 받으소서
  lexicon: BDAG
  rationale: 기도문에서의 εὐλογητός는 단순 형용사보다 하나님께 드리는 축복/찬양 선언으로 기능하므로, 직접 호칭에 어울리는 한국어 예배체를 사용했습니다.
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  english_pob_choice: O God of our fathers
  chosen_korean: 우리 조상들의 하나님이신 주님
  alternatives_korean:
  - 우리 아버지들의 하나님이신 주님
  - 우리 조상들의 하나님
  lexicon: BDAG
  rationale: πατέρων의 혈통적·언약적 표현을 살리면서도 한국어 기도문으로 자연스럽게 들리도록 ‘우리 조상들의 하나님’으로 옮겼고, 호격은 하나님을 부르는 문맥에 맞게 정리했습니다.
- source_word: τὸ ὄνομά σου τὸ ἅγιον καὶ ἔνδοξον
  english_pob_choice: your holy and glorious name
  chosen_korean: 당신의 거룩하고 영광스러운 이름
  alternatives_korean:
  - 당신의 성스럽고 영광스러운 이름
  - 당신의 거룩하며 영광스러운 이름
  lexicon: BDAG
  rationale: ἅγιος와 ἔνδοξος의 병렬을 그대로 살려, 공예배적 언어인 ‘거룩하고 영광스러운 이름’으로 직역했습니다.
- source_word: πᾶσαι αἱ κτίσεις σου
  english_pob_choice: all your creation / all your creatures
  chosen_korean: 당신의 모든 창조물
  alternatives_korean:
  - 당신의 모든 피조물
  - 당신이 지으신 모든 것
  lexicon: BDAG
  rationale: κτίσεις는 피조 세계 전체를 가리킬 수 있으므로, 인간을 포함한 우주적 범위를 과도하게 좁히지 않는 ‘모든 창조물’을 택했습니다.
theological_decisions:
- issue: 하늘들과 창조물의 찬양 요청을 어떻게 이해할지
  chosen_reading: 피조 세계 전체가 하나님을 찬양하도록 부르는 우주적 축복 선언으로 옮겼습니다.
  alternative_readings:
  - 단순한 시적 과장으로만 처리
  - 비인격적 자연물의 의인화로만 제한
  rationale: 본문은 하늘들과 모든 창조물까지 포함하는 광범위한 찬양을 요청하므로, 기도적·우주적 범위를 약화시키지 않도록 유지했습니다.
  doctrine_reference: 창조 세계의 찬양이라는 성경적 모티프
