  source_fidelity: 그리스어의 첫 두 εὐλογητός 절은 하나님과 그 이름에 대한 축복·찬양 선언이며, 마지막 εὐλογησάτωσαν은 하늘들과 모든 κτίσεις를 향한 복수 명령/기원입니다. 초안의 ‘주님’은 원문에 없는 호칭을 덧붙이고, ‘하늘들과 … 창조물아’는 원문의 주어 구조를 한국어 호격으로 바꾸므로 삭제하는 편이 안전합니다. ‘우리 조상들의 하나님’은 πατέρων의 전통적 혈통·언약 표현을 자연스럽게 보존합니다.
  naturalness: 합쇼체 기도문으로 ‘찬양받으소서’와 ‘찬양하십시오’는 자연스럽습니다. 다만 ‘하늘들과 당신의 모든 창조물아’보다 ‘하늘들과 당신의 모든 창조물은 당신을 찬양하십시오’가 현대 한국어 문장 구조에 더 자연스럽고 원문의 명령 대상도 명확합니다.
