  naturalness: ‘여종들 가운데 하나를 보내어, 그들이 … 보게 하십시오’는 원문의 단수 파견 대상과 복수 동사를 함께 보존하면서도 현대 한국어 합쇼체로 이해 가능합니다. 마지막 문장은 ‘…합시다’로 자연스럽게 명령의 공동 제안을 나타냅니다.
  terminology: παιδίσκη는 ‘여종’으로 옮겨 여성과 가사 노동 종속 신분을 함께 드러냅니다. θάπτω는 이 문맥에서 ‘묻다’가 자연스럽습니다. ‘아무도 알지 못하게’는 μηδεὶς γνῷ의 비밀 유지 목적을 충실히 나타냅니다.
