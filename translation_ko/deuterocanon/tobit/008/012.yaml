  text: And Edna said to his wife, “Send one of the servant girls, and let them see whether he is alive; but if not, so that we may bury him and no one may know.”
  footnotes:
  - marker: a
    text: Greek reads 'let them see,' with a plural verb, even though Edna has just said 'Send one of the servant girls.' The translation preserves this wording rather than smoothing it to singular.
    reason: textual_variant
translation:
  language: ko
  text: 그러자 에드나는 자기 아내에게 말했습니다. 「여종들 가운데 하나를 보내어, 그들이 그가 살아 있는지 보게 하십시오. 그러나 그렇지 않다면 우리가 그를 묻고 아무도 알지 못하게 합시다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 ‘여종들 가운데 하나를 보내어’라고 한 뒤에도 ‘그들이 보게 하십시오’라는 복수형 명령을 사용합니다. 번역도 이 복수형을 보존했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀπόστειλον
  english_pob_choice: Send
  chosen_korean: 보내어
  alternatives_korean:
  - 보내십시오
  - 파견하십시오
  lexicon: LSJ
  rationale: ἀποστέλλω의 명령형을 자연스러운 현대 한국어로 옮기되, 지나치게 공문서처럼 들리는 ‘파견하십시오’는 피했습니다.
- source_word: μίαν τῶν παιδισκῶν
  english_pob_choice: one of the servant girls
  chosen_korean: 종들 가운데 하나
  alternatives_korean:
  - 여종들 가운데 하나
  - 하녀들 가운데 하나
  lexicon: LSJ
  rationale: παιδίσκη의 가정 내 하위 신분을 살리기 위해 ‘종’ 계열을 택했고, 성별 정보는 이미 문맥상 드러나므로 간결하게 처리했습니다.
- source_word: ἰδέτωσαν
  english_pob_choice: let them see
  chosen_korean: 보게 하십시오
  alternatives_korean:
  - 보게 하십시오(그녀가)
  - 살펴보게 하십시오
  lexicon: LSJ
  rationale: 전승본문의 복수 명령형을 따라 ‘그녀가’로 단수화하지 않고, 한국어에서는 목적절형 ‘보게 하십시오’로 다소 포괄적으로 살렸습니다.
- source_word: ἵνα θάψωμεν αὐτόν
  english_pob_choice: so that we may bury him
  chosen_korean: 우리가 그를 묻고
  alternatives_korean:
  - 우리가 그를 장사하고
  - 그를 묻게 하려는 것입니다
  lexicon: LSJ
  rationale: ἵνα+접속법의 목적 의미를 한국어 연결로 자연스럽게 옮겼으며, 시신 처리의 맥락을 살려 ‘묻다’를 사용했습니다.
theological_decisions:
- issue: 공개적으로 알리지 않으려는 의도 표현
  chosen_reading: ‘아무도 알지 못하게 합시다’로 비밀 유지의 목적을 직접 드러냈습니다.
  alternative_readings:
  - ‘아무도 모르게 합시다’
  - ‘아무도 알지 못하게 하십시오’
  rationale: 마지막 절의 μηδεὶς γνῷ는 목적/결과 구조 안에서 ‘알지 못하다’의 부정 지식을 표현하므로, 단순한 미래보다 목적성을 살린 문장을 택했습니다.
  doctrine_reference: 본문의 서사적 목적 표현
