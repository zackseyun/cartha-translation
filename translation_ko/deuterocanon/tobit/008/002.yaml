base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/002.yaml
  text: As he went in[a], he remembered the words of Raphael, and he took the ashes of the incense and placed the fish’s heart and liver on them, and made them smoke.
  footnotes:
  - marker: a
    text: Or 'as he was going.' The Greek participle can be rendered more generally, but the immediate context and the parallel Semitic tradition support the sense of entering the room.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 들어가면서[a] 라파엘의 말을 기억하고, 향의 재를 가져다가 물고기의 심장과 간을 그 위에 놓고 연기를 피웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가면서’. 그리스어 분사는 더 일반적으로도 옮길 수 있지만, 바로 앞뒤 문맥과 평행 세미틱 전승은 방 안으로 들어가는 뜻을 뒷받침합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευόμενος
  english_pob_choice: as he went in
  chosen_korean: 들어가면서
  alternatives_korean:
  - 가면서
  - 가고 있으면서
  - 들어가자
  lexicon: BDAG
  rationale: 영어 POB의 ‘as he went in’처럼 이동 자체를 살리되, 혼인 방의 문맥에 맞게 ‘들어가면서’로 구체화했습니다.
- source_word: ἐμνήσθη τῶν λόγων Ῥαφαήλ
  english_pob_choice: remembered the words of Raphael
  chosen_korean: 라파엘의 말을 기억하고
  alternatives_korean:
  - 라파엘의 말씀을 기억하고
  - 라파엘의 말을 떠올리고
  - 라파엘이 한 말을 기억하고
  lexicon: BDAG
  rationale: λόγων은 직역하면 ‘말들’이지만, 여기서는 라파엘의 지시를 가리키므로 자연스럽게 ‘말’을 택했습니다.
- source_word: τὴν τέφραν τῶν θυμιαμάτων
  english_pob_choice: the ashes of the incense
  chosen_korean: 향의 재
  alternatives_korean:
  - 향의 잿더미
  - 향료의 재
  - 분향의 재
  lexicon: LSJ
  rationale: τέφρα를 ‘재’로 옮기고, θυμιαμάτων은 문맥상 향을 가리키므로 ‘향의 재’로 간결하게 표현했습니다.
- source_word: ἐπέθηκεν τὴν καρδίαν τοῦ ἰχθύος καὶ τὸ ἧπαρ
  english_pob_choice: placed the fish’s heart and liver on them
  chosen_korean: 물고기의 심장과 간을 그 위에 놓고
  alternatives_korean:
  - 물고기의 심장과 간을 그 위에 두고
  - 물고기의 심장과 간을 그 위에 얹고
  lexicon: BDAG
  rationale: ἐπέθηκεν은 ‘위에 놓다’의 평이한 동작이므로 ‘놓고’로 옮겼고, 해부학 용어는 한국어의 표준적인 ‘심장, 간’을 사용했습니다.
- source_word: ἐκάπνισεν
  english_pob_choice: made them smoke
  chosen_korean: 연기를 피웠습니다
  alternatives_korean:
  - 연기나게 했습니다
  - 피워 연기를 냈습니다
  - 연기를 일으켰습니다
  lexicon: LSJ
  rationale: 동사는 단순히 태우는 것보다 ‘연기 내다/피우다’의 뉘앙스가 강하므로, 제의적이되 과도하게 기술적이지 않은 표현으로 처리했습니다.
theological_decisions:
- issue: 짧은 그리스어 본문과 평행 세미틱 전승의 관계
  chosen_reading: 그리스어 본문의 사건 흐름을 그대로 따르되, πορευόμενος는 방 안으로 들어가는 구체적 움직임으로 자연스럽게 풀었습니다.
  alternative_readings:
  - 단순히 ‘가면서’로 두어 장소를 특정하지 않음
  - 긴 전승의 기도 장면을 덧붙여 조화시키는 방식
  rationale: 이 책의 기본 원칙상 그리스어가 우선이지만, 제공된 평행 전승이 혼인 방면의 즉각적 문맥을 뒷받침하므로 불필요한 확장 없이 의미를 명료화했습니다.
  doctrine_reference: 'PHILOSOPHY.md: Greek source primacy with parallel-source contextual clarification'
