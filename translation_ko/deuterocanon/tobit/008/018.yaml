review_pass:
  verdict: approve
  source_fidelity: 그리스어 ἐκέλευσεν(명령하다), τοῖς οἰκέταις(집안의 종들/하인들), χῶσαι τὸν τάφον(무덤에 흙을 메우다), τὸν τάφον(무덤)을 충실히 옮겼습니다. 부정과거 서술의 흐름도 ‘그러자’와 과거 합쇼체로 자연스럽게 반영되었습니다.
  naturalness: “그러자 그는 종들에게 무덤을 메우라고 명령했습니다”는 현대 표준 한국어의 합쇼체로 자연스럽고 간결합니다. ‘무덤을 메우다’는 시신을 매장하라는 뜻이 아니라 이미 판 무덤을 흙으로 채우는 행위를 적절히 나타냅니다.
  terminology: ‘종들’은 οἰκέται의 역사적·사회적 종속 관계를 과도하게 완화하지 않으면서 문맥상 자연스럽게 전달합니다. ‘명령했습니다’도 κελεύω의 권위 있는 지시를 잘 살립니다. 신학 용어 및 각주가 필요한 표현은 없습니다.
