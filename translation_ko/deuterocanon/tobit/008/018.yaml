  lexicon: BDAG
  rationale: κελεύω의 aorist는 권위 있는 명령을 가리키며, 현대 한국어에서는 ‘명령했습니다’가 그 강도를 자연스럽게 살립니다.
- source_word: τοῖς οἰκέταις
  english_pob_choice: the servants
  chosen_korean: 종들에게
  alternatives_korean:
  - 시종들에게
  - 집안 하인들에게
  lexicon: BDAG
  rationale: οἰκέτης는 집안에 속한 종/하인을 뜻하므로, 문맥의 간결함과 사회적 종속성을 함께 살리는 ‘종들’이 적절합니다.
- source_word: χῶσαι
  english_pob_choice: to fill in
  chosen_korean: 메우라고
  alternatives_korean:
  - 덮으라고
  - 흙을 채우라고
  lexicon: LSJ
  rationale: χόω는 무덤이나 구덩이를 흙으로 덮어 메우는 동작을 뜻하므로, 여기서는 ‘메우다’가 가장 직접적입니다.
- source_word: τὸν τάφον
  english_pob_choice: the grave
  chosen_korean: 무덤
  alternatives_korean:
  - 무덤구덩이
  - 묘
  lexicon: BDAG
  rationale: τάφος는 무덤/무덤자리의 뜻이 가능하지만, 여기서는 이미 파 놓은 매장 자리를 메우는 장면이므로 한국어로는 자연스럽게 ‘무덤’이 적절합니다.
