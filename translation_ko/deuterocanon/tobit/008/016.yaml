translation:
  language: ko
  text: 라구엘은 하나님을 찬송하며 말했습니다. “하나님, 주께서는 모든 복 가운데 복되십니다. 주의 거룩한 이들이[a] 주를 찬송하게 하시고, 주의 모든 피조물이[b] 주를 찬송하게 하소서. 주의 모든 천사들과 주의 택하신 이들이[c] 영원히 주를 찬송하게 하소서.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주의 성도들’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주의 모든 창조물’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘주의 택함 받은 이들’ 또는 ‘주의 선택된 이들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλόγησεν
  english_pob_choice: blessed
  chosen_korean: 찬양하며
  alternatives_korean:
  - 복을 빌며
  - 복 주며
  lexicon: BDAG
  rationale: 여기서는 하나님께 드리는 축복 선언이 연속되므로, 한국어에서는 단순히 ‘복을 빌다’보다 예배적 도치가 살아 있는 ‘찬양하다’가 문맥의 도복적 성격을 더 분명히 드러냅니다.
- source_word: Εὐλογητὸς εἶ σὺ ὁ θεός
  english_pob_choice: Blessed are you, O God
  chosen_korean: 하나님, 모든 복으로 복을 받으소서
  alternatives_korean:
  - 복되신 하나님이십니다
  - 하나님, 복을 받으소서
  lexicon: BDAG
  rationale: εὐλογητός의 반복 어감을 살리되, 현대 한국어 합쇼체에서 직접 호칭과 축복 선포가 함께 드러나도록 옮겼습니다.
- source_word: οἱ ἅγιοί σου
  english_pob_choice: your holy ones
  chosen_korean: 주의 거룩한 이들
  alternatives_korean:
  - 주의 성도들
  - 주의 성인들
  lexicon: BDAG
  rationale: 이 단어는 후기 교회적 ‘성도’로 좁히기보다, LXX 문맥의 넓은 의미인 ‘거룩한 이들’을 살려 하나님께 속한 존재들을 일반적으로 가리키게 했습니다.
- source_word: πᾶσαι αἱ κτίσεις σου
  english_pob_choice: all your creatures
  chosen_korean: 주의 모든 피조물
  alternatives_korean:
  - 주의 모든 창조물
  - 주의 모든 피조된 것들
  lexicon: BDAG
  rationale: κτίσεις의 복수형이지만 한국어에서는 집합적 표현 ‘피조물’이 자연스럽고, POB의 ‘all your creatures’가 의도한 창조 세계 전체를 잘 반영합니다.
- source_word: οἱ ἐκλεκτοί σου
  english_pob_choice: your chosen ones
  chosen_korean: 주의 택하신 이들
  alternatives_korean:
  - 주의 택함 받은 이들
  - 주의 선택된 이들
  lexicon: BDAG
  rationale: ‘택하신 이들’은 ἐκλεκτοί의 선택/택정 의미를 직설적으로 살리면서도 ‘선민’처럼 신학적 범주를 미리 고정하지 않습니다.
theological_decisions:
- issue: οἱ ἅγιοί σου와 οἱ ἐκλεκτοί σου의 범주가 천상 존재인지 인간 공동체인지 불명확함
  chosen_reading: 범주를 특정하지 않고 각각 ‘거룩한 이들’과 ‘택하신 이들’로 넓게 유지했습니다.
  alternative_readings:
  - 천사로 특정하기
  - 성도로 특정하기
  rationale: 본문은 이들을 천사들과 별도로 나열하므로, 의미를 미리 좁히지 않고 병렬 구조의 열린 범위를 보존하는 것이 원문에 더 충실합니다.
  doctrine_reference: 본문의 신학적 긴장을 해소하지 않고 보존
