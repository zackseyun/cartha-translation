  terminology: ‘혼인 잔치’는 γάμος의 이 문맥상 축하 행사/잔치 의미를 잘 드러냅니다. 각주가 혼인 자체라는 가능한 어휘 범위도 적절히 보존하므로, 본문이 가진 어휘적 여지를 과도하게 좁히지 않습니다.
