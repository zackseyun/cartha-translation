  text: And he held a wedding feast for them for fourteen days[a].
  footnotes:
  - marker: a
    text: Or 'And he celebrated a wedding for them for fourteen days.' The Greek γάμος can denote either the wedding itself or the wedding feast/celebration.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그들을 위해 열네 날 동안 혼인 잔치를 베풀었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 위해 열네 날 동안 혼인을 베풀었습니다.’ 그리스어 γάμος는 혼인 자체나 혼인 잔치/축하를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  english_pob_choice: held
  chosen_korean: 베풀었습니다
  alternatives_korean:
  - 열었습니다
  - 하였습니다
  - 가졌습니다
  lexicon: BDAG
  rationale: ποίηω가 목적어 γάμον과 함께 쓰일 때는 단순한 ‘만들다’보다 잔치를 ‘베풀다/열다’는 관용적 뜻이 자연스럽습니다. 한국어에서는 혼인 행사를 주최하는 뉘앙스를 살리기 위해 ‘베풀었습니다’를 택했습니다.
- source_word: αὐτοῖς
  english_pob_choice: for them
  chosen_korean: 그들을 위해
  alternatives_korean:
  - 그 둘을 위해
  - 그들 모두를 위해
  - 그들을 위하여
  lexicon: BDAG
  rationale: 여격 대명사는 수혜자를 나타내므로, 바로 앞 문맥의 신혼부부를 가리키는 ‘그들을 위해’로 옮기면 소박하고 분명합니다.
- source_word: γάμον
  english_pob_choice: a wedding feast
  chosen_korean: 혼인 잔치
  alternatives_korean:
  - 혼인
  - 결혼식
  - 혼인 잔치
  lexicon: BDAG
  rationale: γάμος는 혼인 자체와 잔치/축하 행사를 모두 뜻할 수 있는데, 여기서는 ‘열네 날 동안’이라는 지속 표현과 결합하여 축하 자리의 의미가 강하므로 ‘혼인 잔치’가 가장 자연스럽습니다.
- source_word: ἡμερῶν δέκα τεσσάρων
  english_pob_choice: for fourteen days
  chosen_korean: 열네 날 동안
  alternatives_korean:
  - 열흘 나흘 동안
  - 14일 동안
  - 열네 날 간
  lexicon: BDAG
  rationale: 기간을 나타내는 속격은 한국어에서 ‘~동안’으로 옮기는 것이 가장 직접적이며, 본문의 수량도 그대로 보존합니다.
theological_decisions:
- issue: γάμος의 의미 범위
  chosen_reading: 혼인 자체보다 혼인 잔치/축하의 의미를 본문 전면에 드러냅니다.
  alternative_readings:
  - 혼인을 했습니다
  - 결혼식을 했습니다
  rationale: 문맥상 단순한 법적 혼인 성립보다 공동체적 축하 행사에 초점이 있고, 기간이 명시되어 있으므로 잔치 의미를 드러내는 것이 원문의 힘을 더 잘 살립니다.
  doctrine_reference: 문맥 우선의 서술 해석
