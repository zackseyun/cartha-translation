  source_fidelity: 그리스어 ‘Καὶ ἐποίησεν αὐτοῖς γάμον ἡμερῶν δέκα τεσσάρων’을 충실히 반영합니다. ἐποίησεν γάμον의 관용적 의미를 ‘혼인 잔치를 베풀었습니다’로 자연스럽게 옮겼고, αὐτοῖς의 수혜 의미와 열네 날의 기간도 보존했습니다.
