  text: And Raguel got up[a], went and dug a grave, saying, “Perhaps he too may die.”
  footnotes:
  - marker: a
    text: Or, more literally, “lest perhaps he too die.” The Greek expresses Raguel’s fear that Tobias might die like the previous bridegrooms.
    reason: lexical_alternative
translation:
  language: ko
  text: 라구엘이 일어나 가서 무덤을 팠으며, 말하였습니다. 「이 사람도 죽을지도 모른다」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “혹시 이 사람도 죽지 않기를”이라는 뜻으로도 옮길 수 있습니다. 그리스어는 라구엘이 앞선 신랑들처럼 토비아스도 죽을까 두려워함을 드러냅니다.
    reason: lexical_alternative
