  yaml_path: translation/deuterocanon/tobit/008/010.yaml
  text: And Raguel got up[a], went and dug a grave, saying, “Perhaps he too may die.”
  footnotes:
  - marker: a
    text: Or, more literally, “lest perhaps he too die.” The Greek expresses Raguel’s fear that Tobias might die like the previous bridegrooms.
    reason: lexical_alternative
translation:
  language: ko
  text: 라구엘은 일어나 가서 무덤을 파고 말했습니다. “혹시 이 사람도 죽을지 모른다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “혹시 이 사람도 죽을까”입니다. 그리스어의 표현은 라구엘이 앞선 신랑들처럼 토비아스도 죽을까 두려워하는 마음을 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  english_pob_choice: got up
  chosen_korean: 일어나
  alternatives_korean:
  - 일어서
  - 몸을 일으켜
  lexicon: BDAG
  rationale: aorist 분사로서 다음 행동을 이끄는 단순한 서술이므로, 자연스러운 서술형 ‘일어나’가 가장 직접적입니다.
- source_word: ἐπορεύθη
  english_pob_choice: went
  chosen_korean: 가서
  alternatives_korean:
  - 가고
  - 나가서
  lexicon: BDAG
  rationale: 장소 이동을 나타내는 평이한 동사로, 한국어 서술 흐름에서는 연결어미 ‘가서’가 간결하고 문맥에 맞습니다.
- source_word: ὤρυξεν τάφον
  english_pob_choice: dug a grave
  chosen_korean: 무덤을 팠으며
  alternatives_korean:
  - 무덤을 파고
  - 묘를 팠으며
  - 장지를 팠으며
  lexicon: BDAG
  rationale: 동사 ‘팔다’와 명사 ‘무덤’의 조합이 실제 매장 준비의 물리적 행위를 가장 분명하게 드러냅니다.
- source_word: Μὴ καὶ οὗτος ἀποθάνῃ
  english_pob_choice: Perhaps he too may die.
  chosen_korean: 이 사람도 죽을지도 모른다
  alternatives_korean:
  - 그도 죽을까 두렵다
  - 혹 이 사람도 죽을까 하여
  lexicon: BDAG
  rationale: 두려운 가능성을 표현하는 μή καί + 접속법의 뉘앙스를 한국어의 추측 표현 ‘-을지도 모른다’로 살렸습니다.
theological_decisions:
- issue: 라구엘의 발화가 실제 예언이 아니라 두려움에 찬 추측이라는 점
  chosen_reading: 인물의 공포와 불길한 예상으로 읽고, 예언적 확정어를 피했습니다.
  alternative_readings:
  - 예언처럼 단정적으로 옮김
  - 강한 경고로 확대 해석
  rationale: 본문의 μή καί는 확정이 아니라 불안한 가능성을 말하므로, 한국어도 그 불확실성과 심리적 긴장을 유지해야 합니다.
  doctrine_reference: 본문 주해/서술 기능에 따른 의미 보존
- issue: 직접화법의 한국어 문체
  chosen_reading: 서술 문장은 합쇼체로, 인용문은 평서형을 유지했습니다.
  alternative_readings:
  - 인용문까지 모두 합쇼체
  - 더 경어적인 기도체
  rationale: 이 구절은 하나님께 하는 기도가 아니라 인물의 내적 두려움이 담긴 발화이므로, 인용문은 과장된 경어 없이 그대로 전달하는 편이 원문 효과에 가깝습니다.
  doctrine_reference: 서사체/직접화법 문체 일관성
