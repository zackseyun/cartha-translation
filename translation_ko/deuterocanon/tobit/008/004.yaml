  verdict: revise
  source_fidelity: 원문의 συνεκλείσθησαν은 ‘함께 갇히다/가두어지다’라는 수동 표현입니다. 초안의 ‘함께 갇히자’도 핵심 뜻을 전달하지만, 한국어에서는 감금의 뉘앙스가 지나치게 강하고 혼인방의 문이 닫힌 장면이라는 문맥이 충분히 드러나지 않습니다. ‘두 사람이 함께 방 안에 들어가 문이 닫히자’는 누가 문을 닫았는지는 특정하지 않으면서 수동적 상황과 서사 흐름을 자연스럽게 보존합니다. 나머지 내용은 원문에 충실합니다.
  naturalness: 합쇼체 서술과 발화의 높임말은 일관됩니다. ‘침상에서 일어나’, ‘일어나십시오, 누이여’, ‘기도합시다’는 현대 정중 문체 안에서 자연스럽습니다. 첫 구절을 문이 닫히는 장면으로 풀어 쓰면 한국어의 ‘갇히다’가 지닌 부당한 감금의 함의를 피하면서도 더 자연스럽습니다.
  terminology: ‘토비아스’, ‘침상’, ‘누이여’, ‘주’, ‘자비를 베푸시기를’은 적절합니다. ἀδελφή를 ‘누이여’로 유지하고 각주에서 친족식 호칭임을 밝힌 방식도 적절합니다. 각주는 ‘결혼을 부정하는 뜻’이라는 부정적 설명보다 원문의 문화적·서사적 기능을 직접 설명하는 편이 더 중립적이고 명료합니다.
