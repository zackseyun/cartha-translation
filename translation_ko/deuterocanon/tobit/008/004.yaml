base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/004.yaml
  text: And when the two of them had been shut in together[a], Tobiah rose from the bed and said, “Get up, sister[b], and let us pray that the Lord may show us mercy.”
  footnotes:
  - marker: a
    text: Or, more literally, 'had been enclosed together.' The phrase refers to the couple being shut in together in the room.
    reason: lexical_alternative
  - marker: b
    text: '''Sister'' is the Greek form of address here, reflecting kinship-style language used for his bride in this narrative context.'
    reason: cultural_note
translation:
  language: ko
  text: 두 사람이 함께 갇히자[a], 토비아스가 침상에서 일어나 말했습니다. 「일어나십시오, 누이여[b], 그리고 주께서 우리에게 자비를 베푸시기를 기도합시다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 문자적으로는 ‘두 사람이 함께 갇혀 있었을 때’입니다. 이 표현은 두 사람이 방 안에 함께 갇힌 상황을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘누이’는 여기서 결혼을 부정하는 뜻이 아니라, 이 이야기에서 아내를 향해 쓰는 친족식 호칭입니다.
    reason: cultural_note
lexical_decisions:
- source_word: συνεκλείσθησαν ἀμφότεροι
  english_pob_choice: had been shut in together
  chosen_korean: 함께 갇히자
  alternatives_korean:
  - 함께 가두어졌을 때
  - 함께 둘러싸여 갇히자
  - 함께 갇혀 있게 되자
  lexicon: LSJ
  rationale: 수동 의미와 두 사람이 함께 방 안에 들어가 갇힌 상황을 간결하게 살리기 위해 ‘함께 갇히자’로 옮겼습니다.
- source_word: ἀνέστη ἀπὸ τῆς κλίνης
  english_pob_choice: rose from the bed
  chosen_korean: 침상에서 일어나
  alternatives_korean:
  - 침상에서 উঠে
  - 침상에서 일어나서
  - 자리에서 일어나
  lexicon: LSJ
  rationale: 상황상 혼인 침상을 가리키므로, 서술적이고 자연한 ‘침상에서 일어나’가 적절합니다.
- source_word: Ἀνάστηθι, ἀδελφή
  english_pob_choice: Get up, sister
  chosen_korean: 일어나십시오, 누이여
  alternatives_korean:
  - 일어나십시오, 자매여
  - 일어나, 누이여
  - 일어나십시오, 누이
  lexicon: LSJ
  rationale: ἀδελφή의 직역인 ‘누이’가 혈연·친족식 호칭의 낯섦을 가장 잘 보존합니다. 한국어에서는 호격을 드러내기 위해 ‘누이여’를 택했습니다.
- source_word: προσευξώμεθα ἵνα ἡμᾶς ἐλεήσῃ
  english_pob_choice: let us pray that the Lord may show us mercy
  chosen_korean: 그리고 주께서 우리에게 자비를 베푸시기를 기도합시다
  alternatives_korean:
  - 그리고 주께서 우리를 불쌍히 여기시기를 기도합시다
  - 그리고 주께서 우리에게 은혜를 베푸시기를 기도합시다
  - 그리고 주께서 우리에게 자비를 베푸시도록 기도합시다
  lexicon: LSJ
  rationale: 청원문의 의미를 살려 ‘자비를 베푸시기’를 사용했고, ἐλεέω의 동작성을 유지했습니다.
- source_word: ὁ κύριος
  english_pob_choice: the Lord
  chosen_korean: 주
  alternatives_korean:
  - 주님
  - 주 하나님
  - 주께서
  lexicon: LSJ
  rationale: 본문의 κύριος를 직접 호칭하는 기도 맥락이므로 ‘주’가 가장 간결하고 원문에 가깝습니다.
theological_decisions:
- issue: ἀδελφή의 친족식 호칭 보존
  chosen_reading: 메인 본문에서 의미를 완화하지 않고 ‘누이여’로 옮기고, 문화적 낯섦은 각주로 설명합니다.
  alternative_readings:
  - ‘아내여’로 의역
  - 호칭을 생략하고 자연화
  rationale: 본문은 결혼 관계 안에서도 친족식 호칭을 의도적으로 사용하므로, 이를 완화하면 서사적·문화적 긴장이 약해집니다.
  doctrine_reference: DOCTRINE.md §§1, 6
