  - severity: medium
    issue: βοηθόν이 추상 명사 ‘도움’으로 처리됨
    rationale: βοηθός는 여기서 하와를 가리키는 사람 명사입니다. ‘돕는 이’가 이 지시 대상과 문법적 기능을 더 분명히 드러냅니다.
