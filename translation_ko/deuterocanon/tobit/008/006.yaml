  source_fidelity: 초안의 ‘도움과 버팀이 되게 하셨습니다’는 ἔδωκας(‘주셨습니다’)를 ‘되게 하셨습니다’로 바꾸어 의미를 이동시킵니다. 하와를 아담에게 ‘도움과 버팀으로 주셨다’고 옮겨야 합니다. 또한 βοηθός는 추상 명사 ‘도움’보다 사람을 가리키는 ‘돕는 이’가 문맥과 더 잘 맞습니다.
  naturalness: ‘그의 아내 하와를 그에게 도움과 버팀으로 주셨습니다’는 현대 표준 한국어의 격식 있는 기도문 문체로 자연스럽습니다. 인용문의 ‘그를 위하여 그와 같은 돕는 이를 만들자’는 헬라어의 인칭성과 ‘그와 같은’을 모두 보존하면서도 어색하지 않습니다.
  terminology: ‘지으시고’, ‘아내’, ‘인류의 씨’, ‘도움과 버팀’은 적절합니다. ‘인류의 씨’는 σπέρμα의 자손·계승 이미지를 유지합니다. 본문에 없는 호칭 ‘주님’은 삭제하여 제시된 원문에 충실하게 했습니다.
