revisions:
- from: 주님, 당신께서는 아담을 지으시고 그에게 아내인 하와를, 곧 도움과 버팀이 되게 하셨습니다. 이들로부터 인류의 씨가 생겨났습니다. 당신께서는 “사람이 혼자 있는 것이 좋지 않다. 우리가 그를 위해 그와 같은 도움을 만들어 주자”라고 말씀하셨습니다.[a][b]
  to: 당신께서는 아담을 지으시고, 그의 아내 하와를 그에게 도움과 버팀으로 주셨습니다. 그들에게서 인류의 씨가 생겨났습니다.[a] 당신께서는 “사람이 혼자 있는 것이 좋지 않다. 그를 위하여 그와 같은 돕는 이를 만들자”라고 말씀하셨습니다.[b]
  rationale: ‘주다’라는 핵심 동사를 보존하고, 하와가 ‘도움과 버팀’으로 주어진 인물이라는 원문의 동격적 관계를 자연스럽게 재구성했습니다. 창세기 2:18의 회상은 유지하되, βοηθός의 인물성을 ‘돕는 이’로 명시했습니다. 각주 a는 해당 어구 바로 뒤로 옮겼습니다.
