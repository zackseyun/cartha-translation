base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/006.yaml
  text: You made Adam[a], and you gave him Eve as a helper and support, his wife; from these came the seed of mankind. You said, ‘It is not good for the man to be alone[b]; let us make for him a helper like himself.’
  footnotes:
  - marker: a
    text: Or “the human race.” The Greek says “the seed of mankind,” preserving the imagery of offspring or descent.
    reason: lexical_alternative
  - marker: b
    text: This line echoes Genesis 2:18.
    reason: cross_reference
translation:
  language: ko
  text: 당신께서는 아담을 지으시고, 그의 아내 하와를 그에게 도움과 버팀으로 주셨습니다. 그들에게서 인류의 씨가 생겨났습니다.[a] 당신께서는 “사람이 혼자 있는 것이 좋지 않다. 그를 위하여 그와 같은 돕는 이를 만들자”라고 말씀하셨습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “인류 전체.” 그리스어는 “인류의 씨”라고 하여 출생과 계승의 이미지를 보존합니다.
    reason: lexical_alternative
  - marker: b
    text: 이 구절은 창세기 2:18을 떠올리게 합니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἐποίησας
  english_pob_choice: you made
  chosen_korean: 지으시고
  alternatives_korean:
  - 만드셨고
  - 창조하셨고
  lexicon: LSJ / BDAG
  rationale: δώκας와 병렬되는 창조 행위로서 자연스럽고, 한국어에서 아담과 하와의 기원 서술에 어울리는 동사를 택했습니다.
- source_word: βοηθὸν
  english_pob_choice: helper
  chosen_korean: 도움
  alternatives_korean:
  - 도우미
  - 조력자
  lexicon: BDAG
  rationale: Genesis 2장과의 연계를 살리되, 한국어에서 ‘helper’의 기능적 의미를 너무 직역체로 만들지 않도록 ‘도움’으로 옮겼습니다.
- source_word: στήριγμα
  english_pob_choice: support
  chosen_korean: 버팀
  alternatives_korean:
  - 지지
  - 받침
  - 버팀목
  lexicon: LSJ
  rationale: στήριγμα의 ‘붙들어 주는 지탱’ 의미를 살려, 아내가 단순한 보조가 아니라 함께 서게 하는 존재임을 드러내기 위해 ‘버팀’으로 옮겼습니다.
- source_word: τὴν γυναῖκα αὐτοῦ
  english_pob_choice: his wife
  chosen_korean: 아내인 하와를
  alternatives_korean:
  - 그의 아내 하와를
  - 그의 아내인 하와를
  lexicon: BDAG
  rationale: 여기서는 γυνή가 분명히 혼인 관계를 가리키므로 ‘아내’로 옮기고, 문장 구조상 하와가 그 정체를 설명하도록 배치했습니다.
- source_word: τὸ ἀνθρώπων σπέρμα
  english_pob_choice: the seed of mankind
  chosen_korean: 인류의 씨
  alternatives_korean:
  - 인간의 씨
  - 사람들의 씨
  - 인류의 자손
  lexicon: BDAG
  rationale: ‘씨’라는 생식·계승 이미지를 유지하면서, 한국어에서 자연스럽게 들리는 집합적 표현인 ‘인류’로 generic sense를 반영했습니다.
- source_word: ὅμοιον αὐτῷ
  english_pob_choice: like himself
  chosen_korean: 그와 같은
  alternatives_korean:
  - 그와 닮은
  - 그와 같은 자
  lexicon: BDAG
  rationale: 형태적 대응을 살리면서도 자연스러운 한국어로 옮겨, 창세기 2:18의 상호보완적 의미를 드러냈습니다.
theological_decisions:
- issue: Genesis 2:18의 인용·회상 표현을 어떻게 살릴 것인가
  chosen_reading: ‘사람이 혼자 있는 것이 좋지 않다. 우리가 그를 위해…’처럼 창세기 2:18의 익숙한 구조를 최대한 보존했습니다.
  alternative_readings:
  - 더 매끄럽게 의역하기
  - ‘사람에게 혼자 있음이 좋지 않다’처럼 재구성하기
  rationale: 기도문이 창조 기사(창 2:18)를 명시적으로 회상하므로, 독자가 성경 내 상호본문성을 바로 알아차릴 수 있도록 구조와 어휘를 가깝게 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 5
- issue: ‘우리가…만들어 주자’의 주어와 화법
  chosen_reading: 직접 인용 안에서는 한국어 복수 권유형 ‘우리가…만들어 주자’를 유지했습니다.
  alternative_readings:
  - ‘내가…만들겠다’
  - ‘만들어 주십시오’
  rationale: 본문은 하나님의 자기 권고/결의를 담은 히브리식·헬라식 표현을 반영하므로, 의미를 바꾸지 않는 범위에서 공동의 결의형을 살렸습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
