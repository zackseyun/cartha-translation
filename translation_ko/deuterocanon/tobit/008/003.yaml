base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/003.yaml
  text: But when the demon smelled the odor[a], it fled to the remotest parts of Egypt, and the angel bound it.
  footnotes:
  - marker: a
    text: Or 'to the farthest regions of Egypt'; the phrase may also be understood geographically as 'to Upper Egypt.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 악령이 그 냄새를 맡자 이집트의 가장 먼 곳으로[a] 달아났고, 천사가 그것을 결박했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이집트의 가장 위쪽 지역으로’. 이 표현은 지리적으로 ‘상부 이집트로’ 이해될 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ὠσφράνθη
  english_pob_choice: smelled
  chosen_korean: 냄새를 맡자
  alternatives_korean:
  - 냄새를 맡으니
  - 냄새를 감지하자
  lexicon: LSJ
  rationale: 대상은 향기보다 연기/냄새의 감지이므로, 자연스러운 감각 표현인 ‘냄새를 맡다’로 옮겼습니다.
- source_word: τὸ δαιμόνιον
  english_pob_choice: the demon
  chosen_korean: 악마
  alternatives_korean:
  - 귀신
  - 악한 영
  lexicon: LSJ
  rationale: 이 절에서는 인격적이고 적대적인 초자연 존재를 가리키므로, 서술의 힘을 살리는 ‘악마’를 택했습니다.
- source_word: εἰς τὰ ἀνώτατα Αἰγύπτου
  english_pob_choice: to the uppermost parts of Egypt
  chosen_korean: 이집트의 가장 윗지방으로
  alternatives_korean:
  - 이집트의 가장 먼 곳으로
  - 이집트의 상부 지방으로
  - 이집트의 상류 지방으로
  lexicon: LSJ
  rationale: ἀνώτατα의 문자적 의미인 ‘가장 위의’ 뉘앙스를 살리되, 지리적 방향성을 이해할 수 있도록 ‘윗지방’으로 옮겼습니다.
- source_word: ἔδησεν
  english_pob_choice: bound
  chosen_korean: 묶었습니다
  alternatives_korean:
  - 결박했습니다
  - 속박했습니다
  lexicon: LSJ
  rationale: 천사의 제압 행위를 한국어로 자연스럽게 드러내면서도, 본문의 물리적 구속 의미를 유지하는 표현입니다.
theological_decisions:
- issue: 악마의 존재와 동작을 어떻게 드러낼 것인가
  chosen_reading: 서술을 완화하지 않고 인격적 악한 존재로 그대로 옮겼습니다.
  alternative_readings:
  - 귀신이 냄새를 맡자
  - 악한 영이 냄새를 맡자
  rationale: 본문은 냄새를 맡고 도망가며 천사에게 묶이는 주체를 분명한 인격체로 묘사하므로, 초자연적 실재성을 약화하지 않는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: τὰ ἀνώτατα Αἰγύπτου의 지리적 범위
  chosen_reading: 원문의 직설성을 살려 ‘가장 윗지방’으로 두고, 특정 지명으로 단정하지 않았습니다.
  alternative_readings:
  - 상부 이집트로
  - 이집트 최북단으로
  - 이집트의 가장 먼 곳으로
  rationale: 그리스어는 ‘위쪽/높은 곳’의 방향성을 말할 뿐, 여기서 고정된 지명으로 확정할 필요는 없습니다.
  doctrine_reference: Translation philosophy §3, §5
