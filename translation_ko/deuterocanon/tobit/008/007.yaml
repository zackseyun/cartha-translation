  text: And now[a], Lord, I am not taking this my sister because of sexual immorality, but in truth[b]. Command that I may find mercy and that I and she may grow old together.
  footnotes:
  - marker: a
    text: '"This my sister" reflects the book''s kinship language for a close female relative who is also a lawful marriage partner; alternatively, "this sister of mine" or interpretively "my kinswoman."'
    reason: cultural_note
  - marker: b
    text: Or "Command that you have mercy on me and on her, and that we may grow old together." The Greek links "have mercy" and "grow old together" under the same petition.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제, 주님, 저는 제 누이인 이 여자[a]를 음욕 때문에가 아니라 진실한 뜻으로[b] 아내로 맞이합니다. 명하셔서 저에게 자비를 베푸시고, 저와 이 여자가 함께 늙어 가게 하여 주십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘제 누이인 이 여자’는 토빗기에서 가까운 여성 친족이면서 합법적인 혼인 상대인 인물을 가리키는 친족 언어입니다. 달리 ‘제 이 누이’ 또는 해석하여 ‘제 친족 여성’으로 옮길 수 있습니다.
    reason: cultural_note
  - marker: b
    text: 직역하면 ‘진실로’입니다. 그리스어는 음행 또는 성적 부정과 대조하여, 음욕이 아니라 진실하고 바른 뜻으로 혼인한다는 의미를 나타냅니다.
    reason: lexical_alternative
