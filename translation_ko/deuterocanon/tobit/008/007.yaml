  verdict: revise
  source_fidelity: ‘받다’는 이 혼인 맥락에서 한국어로 부자연스럽고 의미가 불분명합니다. λαμβάνω의 혼인 용법을 드러내어 ‘아내로 맞이하다’로 옮기는 것이 적절합니다. 또한 πορνεία는 이 문맥에서 혼인의 동기가 되는 성적 욕망을 가리키므로 ‘음욕’이 자연스럽습니다. ἐπίταξον은 두 부정과거 부정사(자비를 베풀다, 함께 늙게 하다)를 함께 이끄므로, 두 청원을 모두 ‘명하셔서’에 연결했습니다.
  naturalness: ‘이 제 누이’와 ‘그녀’는 현대 표준 한국어 기도문에서 어색합니다. ‘제 누이인 이 여자’ 및 ‘이 여자’로 고쳐 친족 호칭을 보존하면서 문장을 자연스럽게 했습니다. ‘진실로’는 부사로도 가능하나, 행위의 동기를 명확히 하는 ‘진실한 뜻으로’가 현대 한국어에서 더 자연스럽습니다.
  terminology: ‘주님’은 하나님께 드리는 호칭으로 적절합니다. ‘누이’는 본문에 유지하고 문화적 설명을 각주에 두었습니다. ‘자비를 베푸시고’는 ἐλεῆσαι의 능동적 의미를 정확히 반영하며, ‘함께 늙어 가게 하여’는 συγκαταγηρᾶσαι를 충실히 옮깁니다.
