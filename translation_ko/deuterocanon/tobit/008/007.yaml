  chosen_korean: 함께 늙어 가게 해 주십시오
  alternatives_korean:
  - 함께 늙게 해 주십시오
  - 나란히 늙어 가게 해 주십시오
  lexicon: LSJ
  rationale: 공동으로 노년을 맞는 뜻을 자연스럽게 풀어 한국어 청원문으로 읽히게 하면서도, ‘함께’와 ‘늙어 가다’로 원문의 핵심 의미를 보존했습니다.
