  text: And Raguel said to him under oath[a], before the days of the wedding were completed, that he should not leave unless the fourteen days of the wedding were fulfilled,
  footnotes:
  - marker: a
    text: Or, 'with an oath.' The Greek adverb indicates that Raguel bound the instruction by oath.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 라구엘은 혼인 기간의 날들이 끝나기 전에, 혼인 기간의 열나흘이 다 차기 전에는 그가 떠나지 말아야 한다고 맹세를 걸고 그에게 말하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
