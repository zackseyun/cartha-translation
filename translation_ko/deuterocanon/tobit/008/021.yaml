  - 그가 가진 것의 절반을 받아서
  lexicon: LSJ
  rationale: ὑπάρχοντα는 소유물·재산을 가리킬 수 있어, 한국어에서는 자연스럽고 구체적인 ‘소유’로 옮겼습니다. 분사구는 앞선 행위의 선행을 드러내기 위해 ‘받아서’로 처리했습니다.
- source_word: μετὰ ὑγείας
  english_pob_choice: in good health
  chosen_korean: 건강하게
  alternatives_korean:
  - 무사히
  - 평안히
  lexicon: LSJ
  rationale: 직역하면 건강/안녕의 상태를 뜻하므로, 과도하게 일반화하지 않고 상태 부사 ‘건강하게’로 유지했습니다.
- source_word: πρὸς τὸν πατέρα
  english_pob_choice: to your father
  chosen_korean: 네 아버지에게
  alternatives_korean:
  - 아버지에게
  - 그의 아버지에게
  lexicon: BDAG
  rationale: 그리스어에는 소유격이 없지만 직접 화법의 문맥상 수신자의 아버지를 가리키므로, 한국어에서는 자연스럽게 2인칭 소유를 드러냈습니다.
- source_word: τὰ λοιπά
  english_pob_choice: the rest
  chosen_korean: 나머지는
  alternatives_korean:
  - 남은 것은
  - 남은 부분은
  lexicon: LSJ
  rationale: 남은 유산 몫을 가리키는 간결한 표현이므로 ‘나머지’를 사용했습니다.
- source_word: ὅταν ἀποθάνω καὶ ἡ γυνή μου
  english_pob_choice: when I and my wife die
  chosen_korean: 나와 내 아내가 죽은 뒤에
  alternatives_korean:
  - 내가 죽고 내 아내도 죽은 뒤에
  - 내 아내와 내가 죽은 뒤에
  lexicon: BDAG
  rationale: 그리스어의 압축된 구문은 두 사람의 사후를 뜻하므로, 한국어에서는 의미를 분명히 하되 본래의 시간 관계를 살려 ‘죽은 뒤에’로 옮겼습니다.
