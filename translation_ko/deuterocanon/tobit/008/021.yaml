  text: and then[a], after taking half of his possessions, to go in good health to your father[b]; and the rest when I and my wife die.
  footnotes:
  - marker: a
    text: Greek literally, 'to the father'; the context of direct address supports 'to your father.'
    reason: lexical_alternative
  - marker: b
    text: 'The final clause is compressed in Greek: literally, ''and the rest whenever I die and my wife.'' The sense is that the remainder is to be given after both spouses have died.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그때 그의 재산 절반을 가지고 건강한 몸으로 네 아버지께 가십시오.[a] 나머지는 나와 내 아내가 죽은 뒤에 가지십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어에는 소유격이 없지만, 직접 화법의 문맥상 ‘네 아버지’로 옮기는 것이 자연스럽습니다.
    reason: alternative_reading
  - marker: b
    text: 마지막 절은 그리스어에서 압축되어 있습니다. 직역하면 ‘그리고 나머지는 내가 죽고 내 아내가 [죽을] 때에’입니다. 뜻은 부부가 모두 죽은 뒤에 남은 재산을 가지라는 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντα τὸ ἥμισυ τῶν ὑπαρχόντων αὐτοῦ
  english_pob_choice: after taking half of his possessions
  chosen_korean: 그의 소유의 절반을 받아서
  alternatives_korean:
