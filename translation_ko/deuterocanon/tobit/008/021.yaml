  source_fidelity: 핵심 어휘와 압축된 마지막 절의 뜻은 대체로 반영되어 있습니다. 그러나 πορεύεσθαι와 생략된 후속 동작을 모두 ‘가게 하십시오’로 옮기면, 화자가 상대에게 직접 지시하는 원문의 의미가 ‘가도록 허락하십시오’라는 사역/허용 표현으로 바뀝니다. ‘가지십시오’로 보완하는 것이 문맥과 원문에 더 충실합니다.
  naturalness: ‘그의 소유의 절반’, ‘건강하게 … 가게 하십시오’는 현대 표준 한국어에서 다소 부자연스럽고, 특히 ‘가게 하십시오’는 지시문의 주체 관계를 흐립니다. ‘그의 재산 절반을 가지고 건강한 몸으로 … 가십시오’와 ‘나머지는 … 뒤에 가지십시오’가 자연스럽고 합쇼체에도 맞습니다.
  terminology: ὑπάρχοντα는 ‘재산’으로, μετὰ ὑγείας는 ‘건강한 몸으로’로 옮기는 것이 적절합니다. πρὸς τὸν πατέρα의 무표지 소유 관계는 직접 화법 문맥에 따라 ‘네 아버지’로 번역할 수 있으나, 해당 각주는 그 표현 바로 뒤에 붙여야 합니다.
