  text: and then[a], after taking half of his possessions, to go in good health to your father[b]; and the rest when I and my wife die.
  footnotes:
  - marker: a
    text: Greek literally, 'to the father'; the context of direct address supports 'to your father.'
    reason: lexical_alternative
  - marker: b
    text: 'The final clause is compressed in Greek: literally, ''and the rest whenever I die and my wife.'' The sense is that the remainder is to be given after both spouses have died.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그때, 그의 소유의 절반을 받아서 건강하게 네 아버지에게 가게 하십시오. 나머지는 나와 내 아내가 죽은 뒤에 가게 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어에는 소유격이 없지만, 직접 화법의 문맥상 ‘네 아버지’로 옮기는 것이 자연스럽습니다.
    reason: alternative_reading
  - marker: b
    text: 마지막 절은 그리스어에서 압축되어 있으며, 뜻은 부부가 모두 죽은 뒤에 남은 것을 넘기라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντα τὸ ἥμισυ τῶν ὑπαρχόντων αὐτοῦ
  english_pob_choice: after taking half of his possessions
  chosen_korean: 그의 소유의 절반을 받아서
  alternatives_korean:
  - 그의 재산의 절반을 받아서
  - 그가 가진 것의 절반을 받아서
  lexicon: LSJ
  rationale: ὑπάρχοντα는 소유물·재산을 가리킬 수 있어, 한국어에서는 자연스럽고 구체적인 ‘소유’로 옮겼습니다. 분사구는 앞선 행위의 선행을 드러내기 위해 ‘받아서’로 처리했습니다.
- source_word: μετὰ ὑγείας
  english_pob_choice: in good health
  chosen_korean: 건강하게
  alternatives_korean:
  - 무사히
  - 평안히
  lexicon: LSJ
  rationale: 직역하면 건강/안녕의 상태를 뜻하므로, 과도하게 일반화하지 않고 상태 부사 ‘건강하게’로 유지했습니다.
- source_word: πρὸς τὸν πατέρα
  english_pob_choice: to your father
  chosen_korean: 네 아버지에게
  alternatives_korean:
  - 아버지에게
  - 그의 아버지에게
  lexicon: BDAG
  rationale: 그리스어에는 소유격이 없지만 직접 화법의 문맥상 수신자의 아버지를 가리키므로, 한국어에서는 자연스럽게 2인칭 소유를 드러냈습니다.
- source_word: τὰ λοιπά
  english_pob_choice: the rest
  chosen_korean: 나머지는
  alternatives_korean:
  - 남은 것은
  - 남은 부분은
  lexicon: LSJ
  rationale: 남은 유산 몫을 가리키는 간결한 표현이므로 ‘나머지’를 사용했습니다.
- source_word: ὅταν ἀποθάνω καὶ ἡ γυνή μου
  english_pob_choice: when I and my wife die
  chosen_korean: 나와 내 아내가 죽은 뒤에
  alternatives_korean:
  - 내가 죽고 내 아내도 죽은 뒤에
  - 내 아내와 내가 죽은 뒤에
  lexicon: BDAG
  rationale: 그리스어의 압축된 구문은 두 사람의 사후를 뜻하므로, 한국어에서는 의미를 분명히 하되 본래의 시간 관계를 살려 ‘죽은 뒤에’로 옮겼습니다.
theological_decisions:
- issue: 압축된 종결절의 의미 명료화
  chosen_reading: 나머지는 나와 내 아내가 죽은 뒤에 가게 하십시오.
  alternative_readings:
  - 그 나머지는 내가 죽고 내 아내도 죽은 뒤에 가게 하십시오.
  - 나머지는 내 아내와 내가 죽은 뒤에 가게 하십시오.
  rationale: 원문은 ‘내가 죽고 내 아내가 [죽을 때]’라는 압축을 보이므로, 상속이 두 사람의 사후에 이루어진다는 점을 한국어로 분명하게 풀어 주어야 합니다.
  doctrine_reference: 본문 의미 명료화
