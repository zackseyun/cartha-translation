  - 찬양받으소서
  lexicon: SBLGNT; LXX doxological formula
  rationale: 하나님께 드리는 축복 선언으로서의 형식을 살리되, 한국어에서 자연스럽고 경외를 유지하는 공적 문맥 표현을 택했습니다.
- source_word: ηὔφρανάς με
  english_pob_choice: you have made me rejoice
  chosen_korean: 저를 기쁘게 하셨으니
  alternatives_korean:
  - 저를 기뻐하게 하셨으니
  - 저를 즐겁게 하셨으니
  lexicon: BDAG
  rationale: 원문의 인과적 뉘앙스를 살려 하나님이 직접 기쁨의 원인이 되셨음을 간명하게 표현했습니다.
- source_word: ὑπενόουν
  english_pob_choice: I suspected
  chosen_korean: 제가 예상한 대로
  alternatives_korean:
  - 제가 의심한 대로
  - 제가 생각한 대로
  lexicon: BDAG
  rationale: 문맥상 불안한 예상/추정의 뉘앙스가 있어, 한국어에서는 과도한 '의심'보다 자연스러운 '예상'으로 옮기되 결과의 반전을 유지했습니다.
- source_word: ἐποίησας μεθʼ ἡμῶν
  english_pob_choice: you have acted with us
  chosen_korean: 우리에게 행하셨습니다
  alternatives_korean:
  - 우리와 함께 행하셨습니다
  - 우리를 대하여 행하셨습니다
  lexicon: BDAG
  rationale: μεθʼ ἡμῶν의 관계성을 과도하게 풀지 않고, 하나님의 행위를 포괄적으로 드러내는 한국어 동사로 처리했습니다.
- source_word: δύο μονογενεῖς
  english_pob_choice: two only children
  chosen_korean: 두 외아들
  alternatives_korean:
  - 두 외동자녀
  - 두 외아들외딸
  lexicon: BDAG
  rationale: 이 문맥에서 μονογενεῖς는 각자가 자기 부모에게 외동인 상황을 가리키므로, 한국어에서는 남성형으로 보이는 복수 호칭을 피하고 가족 상태를 자연스럽게 드러냈습니다.
- source_word: δέσποτα
  english_pob_choice: Master
  chosen_korean: 주님
  alternatives_korean:
  - 주인이시여
  - 주재자
  lexicon: BDAG
  rationale: 기도문 안에서 하나님께 대한 직접 호칭으로, 한국어 합쇼체에서는 '주님'이 가장 자연스럽고 경외를 유지합니다. POB의 'Master'와의 구별은 영어에서 확보하고, 한국어에서는 예배적 호칭을 우선했습니다.
- source_word: συντέλεσον τὴν ζωὴν αὐτῶν
  english_pob_choice: bring their life to completion
  chosen_korean: 그들의 생명을 … 마치게 하소서
  alternatives_korean:
  - 그들의 생명을 완성하게 하소서
  - 그들의 삶을 마무리하게 하소서
  lexicon: BDAG
  rationale: 단순한 종료가 아니라 한 삶의 여정이 온전하게 마쳐지기를 비는 청원으로 이해해, 기도체에 맞게 번역했습니다.
