base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/017.yaml
  text: Blessed are you[a], because you have made me rejoice, and it has not happened to me as I suspected; rather, according to your abundant mercy, you have acted with us. Blessed are you, because you have shown mercy to two only children. Show them mercy, Master[c][b]; bring their life to completion in health with gladness and mercy.
  footnotes:
  - marker: a
    text: Or 'it did not happen to me as I supposed.' The Greek verb can express suspicion or supposition; the context suggests anxious expectation.
    reason: lexical_alternative
  - marker: b
    text: '''Two only children'' means that each of the couple was an only child in his or her family.'
    reason: cultural_note
  - marker: c
    text: Or 'bring their lives to completion' or 'grant that they may complete their life.' The Greek uses a collective singular 'life.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 주님은 저를 기쁘게 하셨으니 찬양받으실 분이십니다. 제가 예상한 대로 되지 않았고, 오히려 주님의 풍성한 자비대로 우리에게 행하셨습니다. 두 외아들에게 자비를 베푸셨으니 찬양받으실 분이십니다. 주님, 그들에게 자비를 베푸시고, 그들의 생명을 건강과 기쁨과 자비 가운데 마치게 하소서.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 동사 ὑπενόουν은 ‘의심하다’와 ‘예상하다/생각하다’ 사이의 뉘앙스를 가질 수 있습니다. 문맥상 불안한 예상에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘두 외아들’은 각 부부가 자기 가정에서 외동이었음을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 원문은 단수형 ‘생명’을 사용하지만, 한 사람의 삶 전체가 온전히 마쳐지기를 비는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογητὸς εἶ
  english_pob_choice: Blessed are you
  chosen_korean: 찬양받으실 분이십니다
  alternatives_korean:
  - 복되십니다
  - 찬양받으소서
  lexicon: SBLGNT; LXX doxological formula
  rationale: 하나님께 드리는 축복 선언으로서의 형식을 살리되, 한국어에서 자연스럽고 경외를 유지하는 공적 문맥 표현을 택했습니다.
- source_word: ηὔφρανάς με
  english_pob_choice: you have made me rejoice
  chosen_korean: 저를 기쁘게 하셨으니
  alternatives_korean:
  - 저를 기뻐하게 하셨으니
  - 저를 즐겁게 하셨으니
  lexicon: BDAG
  rationale: 원문의 인과적 뉘앙스를 살려 하나님이 직접 기쁨의 원인이 되셨음을 간명하게 표현했습니다.
- source_word: ὑπενόουν
  english_pob_choice: I suspected
  chosen_korean: 제가 예상한 대로
  alternatives_korean:
  - 제가 의심한 대로
  - 제가 생각한 대로
  lexicon: BDAG
  rationale: 문맥상 불안한 예상/추정의 뉘앙스가 있어, 한국어에서는 과도한 '의심'보다 자연스러운 '예상'으로 옮기되 결과의 반전을 유지했습니다.
- source_word: ἐποίησας μεθʼ ἡμῶν
  english_pob_choice: you have acted with us
  chosen_korean: 우리에게 행하셨습니다
  alternatives_korean:
  - 우리와 함께 행하셨습니다
  - 우리를 대하여 행하셨습니다
  lexicon: BDAG
  rationale: μεθʼ ἡμῶν의 관계성을 과도하게 풀지 않고, 하나님의 행위를 포괄적으로 드러내는 한국어 동사로 처리했습니다.
- source_word: δύο μονογενεῖς
  english_pob_choice: two only children
  chosen_korean: 두 외아들
  alternatives_korean:
  - 두 외동자녀
  - 두 외아들외딸
  lexicon: BDAG
  rationale: 이 문맥에서 μονογενεῖς는 각자가 자기 부모에게 외동인 상황을 가리키므로, 한국어에서는 남성형으로 보이는 복수 호칭을 피하고 가족 상태를 자연스럽게 드러냈습니다.
- source_word: δέσποτα
  english_pob_choice: Master
  chosen_korean: 주님
  alternatives_korean:
  - 주인이시여
  - 주재자
  lexicon: BDAG
  rationale: 기도문 안에서 하나님께 대한 직접 호칭으로, 한국어 합쇼체에서는 '주님'이 가장 자연스럽고 경외를 유지합니다. POB의 'Master'와의 구별은 영어에서 확보하고, 한국어에서는 예배적 호칭을 우선했습니다.
- source_word: συντέλεσον τὴν ζωὴν αὐτῶν
  english_pob_choice: bring their life to completion
  chosen_korean: 그들의 생명을 … 마치게 하소서
  alternatives_korean:
  - 그들의 생명을 완성하게 하소서
  - 그들의 삶을 마무리하게 하소서
  lexicon: BDAG
  rationale: 단순한 종료가 아니라 한 삶의 여정이 온전하게 마쳐지기를 비는 청원으로 이해해, 기도체에 맞게 번역했습니다.
theological_decisions:
- issue: 두 번째 축복 선언과 기도 청원의 문체
  chosen_reading: 축복 선언은 서술형 합쇼체로, 청원은 기도체 명령형으로 옮겼습니다.
  alternative_readings:
  - 모두 서술형으로 통일
  - 모두 청원형으로 통일
  rationale: 원문은 찬양 선언과 직접 청원이 이어지는 구조이므로, 한국어에서도 그 구분을 유지해야 문장의 신학적 긴장이 보존됩니다.
  doctrine_reference: 'DOCTRINE.md: 담화 기능과 호칭 기능을 보존한다.'
