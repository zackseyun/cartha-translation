lexical_decisions:
- source_word: καὶ
  english_pob_choice: And
  chosen_korean: 그리고
  alternatives_korean:
  - 또
  - 그리하여
  lexicon: BDAG
  rationale: 서사 진행을 잇는 단순 접속사로 보아, 원문의 병렬적 흐름을 자연스럽게 살리는 ‘그리고’를 택했습니다.
- source_word: ἦλθεν
  english_pob_choice: came
  chosen_korean: 들어왔습니다
  alternatives_korean:
  - 왔습니다
  - 들어갔습니다
  lexicon: BDAG
  rationale: 동사 자체는 ‘오다’이지만, 이어지는 εἰς + 목적격이 ‘집 안으로’의 진입을 이미 나타내므로 한국어에서는 중복을 피하면서 동작의 완료를 드러내는 ‘들어왔습니다’가 적절합니다.
- source_word: εἰς τὴν οἰκίαν
  english_pob_choice: into his house
  chosen_korean: 자기 집으로
  alternatives_korean:
  - 집 안으로
  - 자기 집 안으로
  lexicon: BDAG
  rationale: οἰκία는 여기서 물리적 ‘집’을 가리키며, 소유 대명사를 한국어에서는 자연스럽게 ‘자기’로 처리해 문맥의 귀환/진입 의미를 살렸습니다.
- source_word: ἑαυτοῦ
  english_pob_choice: his
  chosen_korean: 자기
  alternatives_korean:
  - 그의
  - 자기 자신의
  lexicon: BDAG
  rationale: 재귀 소유격 ἑαυτοῦ는 라구엘 자신을 가리키므로, 한국어에서는 문맥상 가장 자연스러운 재귀 표현인 ‘자기’로 옮겼습니다.
- source_word: Ῥαγουὴλ
  english_pob_choice: Raguel
  chosen_korean: 라구엘
  alternatives_korean:
  - 르아겔
  - 레우엘
  lexicon: transliteration
  rationale: 그리스어 음가를 반영해 현대 한국어 표기법에 따라 ‘라구엘’로 옮겼습니다.
