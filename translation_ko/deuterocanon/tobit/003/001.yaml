translation:
  language: ko
  text: 나는 슬픔에 잠겨 울었고, 괴로움 가운데 기도하며 이렇게 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 여기서 매우 간결하게 “슬퍼하여 울고, 괴로움 가운데 기도하며 말하였다”라고만 전합니다. 더 긴 셈어형 전승은 이어지는 부분에서 탄원의 내용을 상당히 확장합니다.
    reason: textual_variant
lexical_decisions:
- source_word: λυπηθεὶς
  english_pob_choice: being grieved / in my grief
  chosen_korean: 마음이 아파서
  alternatives_korean:
  - 슬퍼서
  - 근심하여
  - 마음에 고통을 느껴
  lexicon: BDAG
  rationale: λυπέω의 분사형은 단순한 감정 표현보다 마음의 고통과 슬픔 상태를 나타내므로, 한국어에서는 서술적으로 자연스럽게 옮겨서 뒤의 행동들을 받치게 했습니다.
- source_word: ἔκλαυσα
  english_pob_choice: I wept
  chosen_korean: 울며
  alternatives_korean:
  - 울었습니다
  - 눈물을 흘렸습니다
  - 통곡하며
  lexicon: BDAG
  rationale: κλαίω는 ‘울다’가 가장 직접적이므로, 앞절의 상태 묘사와 이어지는 동작을 살려 부사적으로 처리했습니다.
- source_word: προσηυξάμην
  english_pob_choice: I prayed
  chosen_korean: 기도하며
  alternatives_korean:
  - 기도했습니다
  - 간구하며
  - 기도를 드리며
  lexicon: BDAG
  rationale: 동사의 기본 뜻을 따라 ‘기도하다’로 옮겼고, 이어지는 인용 도입과 함께 진행형으로 자연스럽게 표현했습니다.
- source_word: μετʼ ὀδύνης
  english_pob_choice: in anguish
  chosen_korean: 괴로움 속에서
  alternatives_korean:
  - 고통 속에서
  - 심한 아픔 가운데
  - 비통하게
  lexicon: BDAG
  rationale: ὀδύνη는 깊은 고통과 괴로움을 뜻하므로, 기도의 정서를 약화하지 않으면서도 한국어 문맥에 자연스러운 ‘괴로움 속에서’를 선택했습니다.
theological_decisions:
- issue: 이 구절의 간결한 헬라어 본문과 더 긴 셈어 전승의 관계
  chosen_reading: 헬라어 본문의 짧은 형태를 본문으로 유지하고, 감정과 기도의 핵심 동작만 번역했습니다.
  alternative_readings:
  - 더 긴 셈어 전승의 확장된 탄원문을 본문에 반영하는 읽기
  rationale: 주어진 번역 기준 본문은 헬라어이며, 영어 POB 주석도 이 절의 짧은 형태를 본문으로 유지해야 한다고 설명합니다. 따라서 확장된 탄원은 본문에 섞지 않았습니다.
  doctrine_reference: 본문 비평 / 전승사
