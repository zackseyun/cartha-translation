  source_fidelity: 그리스어는 ‘슬퍼한 뒤/슬픔에 잠겨 울었고, 괴로움과 함께 기도하며 말하였다’라는 동작의 연속을 나타냅니다. 초안의 ‘울며, … 기도하며’는 두 주동사 ἔκλαυσα와 προσηυξάμην을 동시 진행의 부사절로 처리하여, 원문의 서술 구조를 다소 흐립니다.
  naturalness: ‘마음이 아파서’와 ‘괴로움 속에서’는 이해되지만, 본문은 과거 서술을 분명히 하는 ‘울었고, … 기도하며 이렇게 말했습니다’가 현대 표준 한국어 합쇼체에서 더 자연스럽고 정확합니다.
  terminology: ‘기도하다’와 ‘괴로움’은 적절합니다. λυπηθείς는 특정한 신체적 아픔보다 슬픔·근심을 가리키므로 ‘슬픔에 잠겨’로 옮기는 편이 안전합니다. 주석의 ‘헬라어’는 ‘그리스어’로 다듬었습니다.
