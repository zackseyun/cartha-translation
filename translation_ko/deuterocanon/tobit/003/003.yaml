base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/003.yaml
  text: Remember me and look upon me[a]; do not punish me for my sins and my errors done in ignorance, and for those of my fathers[c][b], which they committed before you.
  footnotes:
  - marker: a
    text: Or 'do not exact vengeance for my sins.' The Greek verb can carry the sense of avenging or exacting justice; here it is rendered 'punish' because the prayer asks God not to requite sins.
    reason: lexical_alternative
  - marker: b
    text: '''My errors done in ignorance'' translates a term for wrongs committed unwittingly or without full awareness.'
    reason: lexical_alternative
  - marker: c
    text: That is, 'my ancestors' or 'my forefathers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 저를 기억하시고 저를 굽어보소서[a]. 제 죄와 무지로 저지른 잘못, 그리고 제 조상들의 죄[b]를 벌하지 마십시오. 그들이 당신 앞에서 지은 죄입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저를 기억하시고 저를 주목하소서.’ ἐπίβλεψον ἐπʼ ἐμέ는 단순한 응시보다 자비로운 돌봄의 시선을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘제 아버지들’이지만, 문맥상 ‘조상들’ 또는 ‘선조들’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνήσθητί
  english_pob_choice: Remember
  chosen_korean: 저를 기억하시고
  alternatives_korean:
  - 저를 생각해 주시고
  - 저를 잊지 마시고
  lexicon: BDAG
  rationale: 기도문에서 하나님께 유리하게 주목해 달라는 청원을 자연스럽게 살려 ‘기억하시다’로 옮겼습니다.
- source_word: ἐπίβλεψον ἐπʼ ἐμέ
  english_pob_choice: look upon me
  chosen_korean: 저를 굽어보소서
  alternatives_korean:
  - 저를 바라보소서
  - 저를 돌보소서
  lexicon: BDAG
  rationale: 단순한 시선이 아니라 자비로운 주목과 돌보심을 담는 표현으로, 간구의 어조를 살렸습니다.
- source_word: μὴ ἐκδίκῃς
  english_pob_choice: do not punish
  chosen_korean: 벌하지 마십시오
  alternatives_korean:
  - 보복하지 마십시오
  - 원수 갚지 마십시오
  - 응징하지 마십시오
  lexicon: BDAG
  rationale: 문맥상 복수가 아니라 죄에 대한 응분의 처벌을 가리키므로, 현대 한국어에서 의미가 분명한 ‘벌하다’를 택했습니다.
- source_word: τοῖς ἀγνοήμασίν μου
  english_pob_choice: my errors done in ignorance
  chosen_korean: 무지로 저지른 잘못
  alternatives_korean:
  - 부지중에 저지른 죄
  - 모르고 한 죄
  - 알지 못한 채 저지른 허물
  lexicon: BDAG
  rationale: ἀγνόημα의 ‘알지 못하고 저지른 잘못’이라는 뉘앙스를 보존하면서, ‘죄’보다 다소 완화된 개념을 한국어로도 드러냈습니다.
- source_word: τῶν πατέρων μου
  english_pob_choice: my fathers
  chosen_korean: 제 조상들의 죄
  alternatives_korean:
  - 제 아버지들의 죄
  - 제 선조들의 죄
  - 제 조상들의 허물
  lexicon: BDAG
  rationale: 직역하면 ‘제 아버지들’이지만, 문맥상 조상/선조의 죄를 가리키므로 한국어 독자에게는 ‘조상들’이 더 분명합니다.
theological_decisions:
- issue: ἃ ἥμαρτον ἐνώπιόν σου의 지시 대상
  chosen_reading: ‘그들이 당신 앞에서 지은 죄’로 옮겨, 앞의 ‘조상들’에 귀속되는 문장으로 보았습니다.
  alternative_readings:
  - 앞의 모든 죄 항목을 포괄하는 것으로 볼 수도 있습니다.
  - ‘그들이 당신 앞에서 범한 죄’처럼 더 완곡하게 옮길 수도 있습니다.
  rationale: 복수 동사 ἥμαρτον은 가장 가까운 복수 선행사인 ‘조상들’과 자연스럽게 연결됩니다. 죄의 고백과 조상죄의 긴장을 평탄화하지 않기 위해 이 연결을 유지했습니다.
  doctrine_reference: 본문의 문법적 긴장과 참회 기도를 보존합니다.
