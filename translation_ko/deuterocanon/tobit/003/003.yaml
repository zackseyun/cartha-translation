  lexicon: BDAG
  rationale: 기도문에서 하나님께 유리하게 주목해 달라는 청원을 자연스럽게 살려 ‘기억하시다’로 옮겼습니다.
- source_word: ἐπίβλεψον ἐπʼ ἐμέ
  english_pob_choice: look upon me
  chosen_korean: 저를 굽어보소서
  alternatives_korean:
  - 저를 바라보소서
  - 저를 돌보소서
  lexicon: BDAG
  rationale: 단순한 시선이 아니라 자비로운 주목과 돌보심을 담는 표현으로, 간구의 어조를 살렸습니다.
- source_word: μὴ ἐκδίκῃς
  english_pob_choice: do not punish
  chosen_korean: 벌하지 마십시오
  alternatives_korean:
  - 보복하지 마십시오
  - 원수 갚지 마십시오
  - 응징하지 마십시오
  lexicon: BDAG
  rationale: 문맥상 복수가 아니라 죄에 대한 응분의 처벌을 가리키므로, 현대 한국어에서 의미가 분명한 ‘벌하다’를 택했습니다.
- source_word: τοῖς ἀγνοήμασίν μου
  english_pob_choice: my errors done in ignorance
  chosen_korean: 무지로 저지른 잘못
  alternatives_korean:
