  - 알지 못한 채 저지른 허물
  lexicon: BDAG
  rationale: ἀγνόημα의 ‘알지 못하고 저지른 잘못’이라는 뉘앙스를 보존하면서, ‘죄’보다 다소 완화된 개념을 한국어로도 드러냈습니다.
- source_word: τῶν πατέρων μου
  english_pob_choice: my fathers
  chosen_korean: 제 조상들의 죄
  alternatives_korean:
  - 제 아버지들의 죄
  - 제 선조들의 죄
  - 제 조상들의 허물
  lexicon: BDAG
  rationale: 직역하면 ‘제 아버지들’이지만, 문맥상 조상/선조의 죄를 가리키므로 한국어 독자에게는 ‘조상들’이 더 분명합니다.
theological_decisions:
- issue: ἃ ἥμαρτον ἐνώπιόν σου의 지시 대상
  chosen_reading: ‘그들이 당신 앞에서 지은 죄’로 옮겨, 앞의 ‘조상들’에 귀속되는 문장으로 보았습니다.
  alternative_readings:
  - 앞의 모든 죄 항목을 포괄하는 것으로 볼 수도 있습니다.
  - ‘그들이 당신 앞에서 범한 죄’처럼 더 완곡하게 옮길 수도 있습니다.
  rationale: 복수 동사 ἥμαρτον은 가장 가까운 복수 선행사인 ‘조상들’과 자연스럽게 연결됩니다. 죄의 고백과 조상죄의 긴장을 평탄화하지 않기 위해 이 연결을 유지했습니다.
  doctrine_reference: 본문의 문법적 긴장과 참회 기도를 보존합니다.
