  yaml_path: translation/deuterocanon/tobit/003/010.yaml
  text: When she heard these things[a], she was deeply grieved, so that she wanted to hang herself. But she said, “I am my father’s only child. If I do this, it will be a disgrace to him, and I will bring his old age down with sorrow to Hades.”
  footnotes:
  - marker: a
    text: Or “to the realm of the dead” or “to the grave.” The Greek reads “to Hades.”
    reason: lexical_alternative
translation:
  language: ko
  text: 이 말을 듣고 그녀는 몹시 슬퍼서 스스로 목을 매고 싶을 정도였습니다. 그러나 그녀는 이렇게 말했습니다. “아버지에게는 내가 하나뿐입니다. 내가 이렇게 한다면, 그것은 아버지에게 수치가 될 것이며, 나는 아버지의 늙은 나이를 슬픔 속에 하데스로 내려가게 할 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죽은 이들의 세계로’ 또는 ‘무덤으로’라고 번역할 수도 있습니다. 그리스어 본문에는 ‘하데스’라고 되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα ἀκούσασα
  english_pob_choice: When she heard these things
  chosen_korean: 이것들을 듣고 나자
  alternatives_korean:
  - 이것들을 들은 뒤
  - 이 말들을 듣고
  lexicon: LSJ
  rationale: 지시어 ταῦτα를 자연스럽게 살리면서, 시간적 부사절을 현대 한국어 어순으로 옮겼습니다.
- source_word: ἐλυπήθη σφόδρα
  english_pob_choice: she was deeply grieved
  chosen_korean: 몹시 슬퍼져서
  alternatives_korean:
  - 깊이 슬퍼해서
  - 매우 괴로워서
  lexicon: LSJ
  rationale: λυπέω의 정서적 고통을 '슬퍼지다'로 옮기고, σφόδρα는 '몹시'로 강도를 살렸습니다.
- source_word: ὥστε ἀπάγξασθαι
  english_pob_choice: so that she wanted to hang herself
  chosen_korean: 스스로 목을 매려 했습니다
  alternatives_korean:
  - 목을 매려 할 정도로
  - 목매어 자살하려 했습니다
  lexicon: LSJ
  rationale: 결과를 나타내는 ὥστε와 뒤의 맥락을 따라, 실제 실행이 아니라 의도를 나타내는 표현으로 옮겼습니다.
- source_word: Μία μέν εἰμι τῷ πατρί μου
  english_pob_choice: I am my father’s only child
  chosen_korean: 나는 아버지에게 하나뿐인 딸입니다
  alternatives_korean:
  - 나는 아버지의 외동딸입니다
  - 나는 아버지의 하나뿐인 자녀입니다
  lexicon: LSJ
  rationale: Μία μέν εἰμι는 '하나뿐인/외동인' 뜻이지만, 문맥상 딸임이 분명하므로 한국어에서는 '딸'을 보완해 의미를 분명히 했습니다.
- source_word: ὄνειδος αὐτῷ ἔσται
  english_pob_choice: it will be a disgrace to him
  chosen_korean: 아버지에게 수치가 될 것이고
  alternatives_korean:
  - 아버지에게 수치가 될 것이고
  - 그에게 불명예가 될 것이고
  lexicon: LSJ
  rationale: ὄνειδος는 수치/모욕/불명예의 뜻이므로, 가정적 결과를 자연스럽게 드러내는 '수치'를 선택했습니다.
- source_word: τὸ γῆρας αὐτοῦ κατάξω μετʼ ὀδύνης
  english_pob_choice: I will bring his old age down with sorrow
  chosen_korean: 나는 아버지의 늙음을 슬픔과 함께 하데스로 내리게 할 것입니다
  alternatives_korean:
  - 나는 아버지의 노년을 슬픔과 함께 아래로 내리게 할 것입니다
  - 나는 아버지의 늙은 시절을 슬픔으로 내려가게 할 것입니다
  lexicon: LSJ
  rationale: τὸ γῆρας는 '늙음/노년'이지만, 반복되는 이미지와 한국어 자연스러움을 고려해 '늙음'으로 옮겼고, κατάξω의 하강 이미지는 보존했습니다.
- source_word: εἰς ᾅδου
  english_pob_choice: to Hades
  chosen_korean: 하데스로
  alternatives_korean:
  - 음부로
  - 죽은 자들의 세계로
  lexicon: LSJ
  rationale: 원문이 ᾅδης를 명시하므로 고유명사로 음역한 '하데스'를 유지해 원문 표지를 보존했습니다.
