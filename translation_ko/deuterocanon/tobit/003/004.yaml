translation:
  language: ko
  text: 그들이 주님의 계명에 불순종하였기 때문에, 주님께서는 우리를 약탈과 포로 됨과 죽음에 넘기셨고, 우리가 흩어진 모든 민족 가운데에서 치욕의 본보기가[a] 되게 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어를 직역하면 ‘비방 또는 모욕의 속담’입니다. 문맥상 ‘비방거리’ 또는 ‘치욕의 본보기’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήκουσαν
  english_pob_choice: they disobeyed
  chosen_korean: 그들이 … 거역하였기에
  alternatives_korean:
  - 그들이 … 불순종하였기에
  - 그들이 … 듣지 않았기에
  lexicon: BDAG
  rationale: 문맥상 계명에 대한 불복종을 가리키므로 ‘거역하다’가 명령을 거슬러 따르지 않는 책임 있는 불순종을 간결하게 드러냅니다.
- source_word: τῶν ἐντολῶν σου
  english_pob_choice: your commandments
  chosen_korean: 주님의 계명
  alternatives_korean:
  - 주님의 명령
  - 주님의 법도
  lexicon: BDAG
  rationale: ‘ἐντολή’의 언약적·종교적 무게를 살리기 위해 ‘계명’으로 옮겼고, 기도문의 직접 호칭에 맞춰 ‘주님의’로 정리했습니다.
- source_word: διαρπαγὴν καὶ αἰχμαλωσίαν καὶ θάνατον
  english_pob_choice: plunder and captivity and death
  chosen_korean: 약탈과 포로 됨과 죽음
  alternatives_korean:
  - 노략과 포로 됨과 죽음
  - 탈취와 포로 됨과 죽음
  lexicon: BDAG
  rationale: 세 항목의 누적을 그대로 살리면서도 현대 한국어에서 자연스럽게 읽히도록 ‘약탈’과 ‘포로 됨’을 선택했습니다.
- source_word: παραβολὴν ὀνειδισμοῦ
  english_pob_choice: a proverb of reproach
  chosen_korean: 모욕의 속담
  alternatives_korean:
  - 비방의 속담
  - 수치의 비유
  - 치욕의 본보기
  lexicon: BDAG
  rationale: παραβολή와 ὀνειδισμός의 결합을 직역에 가깝게 반영하되, 한국어 독자가 이해할 수 있도록 ‘속담’과 ‘모욕’을 결합했습니다.
- source_word: ἐν οἷς ἐσκορπίσμεθα
  english_pob_choice: where we have been scattered
  chosen_korean: 우리가 흩어진 모든 민족들 가운데서
  alternatives_korean:
  - 우리가 흩어진 곳에서
  - 우리가 흩어진 그 모든 민족들 가운데
  lexicon: BDAG
  rationale: 관계절이 가리키는 대상은 ‘민족들’이므로 ‘가운데서’로 관계를 살렸고, 흩어짐의 결과 상태를 한국어 관용에 맞게 표현했습니다.
theological_decisions:
- issue: 하나님의 심판적 넘겨주심과 공동체의 죄책을 함께 보존할지 여부
  chosen_reading: 그들이 계명을 거역한 결과로, 주님이 우리를 여러 재앙에 넘기신다는 구조를 그대로 유지했습니다.
  alternative_readings:
  - 죄책을 일반화하여 ‘우리가 거역하였기에’로 바꾸는 것
  - 하나님의 행위를 약화시켜 ‘우리는 … 당하게 되었습니다’로 바꾸는 것
  rationale: 본문은 조상들의 불순종과 현재 공동체의 수난, 그리고 그 뒤에 있는 하나님의 주권적 심판을 함께 말하므로, 어느 한쪽도 완화하지 않았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: ‘παραβολὴν ὀνειδισμοῦ’의 수치 표현을 얼마나 직역할지
  chosen_reading: ‘모욕의 속담’으로 본문에 두고, 보다 관용적인 설명은 본문 밖으로 미루지 않았습니다.
  alternative_readings:
  - ‘수치의 본보기’로 의역
  - ‘비방거리’로 완화
  rationale: 이 표현은 민족들 사이의 공개적 수치를 강조하므로, 이미지가 살아 있는 직접 번역을 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 5
