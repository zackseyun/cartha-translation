lexical_decisions:
- source_word: σὺ γινώσκεις
  english_pob_choice: You know
  chosen_korean: 주님은 아십니다
  alternatives_korean:
  - 주님, 아십니다
  - 주님께서 아십니다
  lexicon: γινώσκω
  rationale: 직접 호소의 형식을 살리되, 청유가 아니라 인식·확인의 진술로 옮겨 합쇼체를 유지했습니다.
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주여
  - 주
  lexicon: κύριος
  rationale: 기도문에서 하나님께 부르는 직접 호칭으로는 한국어에서 가장 자연스러운 ‘주님’을 택했습니다.
- source_word: καθαρά εἰμι
  english_pob_choice: I am pure
  chosen_korean: 깨끗함을 받았음
  alternatives_korean:
  - 깨끗합니다
  - 깨끗합니다만
  lexicon: καθαρός
  rationale: 문맥상 도덕적 무죄 주장보다 ‘깨끗한 상태에 있음’의 선언이어서, 상태를 결과적으로 드러내는 표현으로 옮겼습니다.
- source_word: ἀπὸ πάσης ἁμαρτίας καὶ ἀνδρός
  english_pob_choice: from every sin and from a man
  chosen_korean: 모든 죄와 한 사람으로부터
  alternatives_korean:
  - 모든 죄와 어떤 남자에게서
  - 모든 죄와 남자에게서
  lexicon: ἁμαρτία / ἀνήρ
  rationale: POB의 ‘a man’을 따라 ἀνδρός를 특정 인물로 확정하지 않고 ‘한 사람’으로 유지해, 원문의 모호성과 긴장을 보존했습니다.
theological_decisions:
- issue: ‘깨끗함’의 의미 범위
  chosen_reading: 화자 자신이 죄와 특정 인간 관계로부터 결백/정결하다고 하나님께 호소하는 문장으로 읽었습니다.
  alternative_readings:
  - 의례적 정결만을 가리키는 선언
  - 도덕적 완전무결의 주장
  rationale: 본문은 자기 변호적 기도문 형식이며, 죄와 ‘한 사람’에 대한 대비가 있으므로 단순 의례 정결보다 관계적·도덕적 무죄 호소를 함께 살려야 합니다.
  doctrine_reference: 도덕적 자기의(義) 주장으로 확대하지 않고, 본문 문맥의 탄원적 진술로 제한
