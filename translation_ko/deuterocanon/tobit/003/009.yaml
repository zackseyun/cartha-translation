base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/009.yaml
  text: Why do you flog us? If they have died[a], go with them! May we never see a son or daughter from you forever.
  footnotes:
  - marker: a
    text: Or, more explicitly by implication, 'go die with them.' The Greek says only 'go with them,' but the dead husbands are in view.
    reason: lexical_alternative
translation:
  language: ko
  text: “왜 우리를 채찍질합니까? 그들이 죽었다면 그들과 함께 가십시오!”[a] “우리는 영원히 당신에게서 아들이나 딸을 보지 않기를 바랍니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들과 함께 가라’이지만, 문맥상 이미 죽은 남편들과 함께 죽으라는 모욕이 암시됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαστιγοῖς
  english_pob_choice: flog
  chosen_korean: 채찍질합니까
  alternatives_korean:
  - 때립니까
  - 매질합니까
  - 채찍으로 때립니까
  lexicon: LSJ
  rationale: μαστιγοῖς는 단순한 '때리다'보다 가혹한 폭행과 모욕의 뉘앙스를 가지므로, 현대 한국어에서 가장 직접적으로 힘을 살리는 '채찍질하다'를 택했습니다.
- source_word: βάδιζε μετʼ αὐτῶν
  english_pob_choice: go with them
  chosen_korean: 그들과 함께 가십시오
  alternatives_korean:
  - 그들과 함께 걸으십시오
  - 그들과 함께 가 버리십시오
  lexicon: LSJ
  rationale: 동사의 기본 의미는 '가다/걷다'이지만, 여기서는 죽은 남편들과 함께하라는 적대적 추방의 말이므로 과도한 해석을 더하지 않으면서 자연스럽게 '함께 가십시오'로 옮겼습니다.
- source_word: μὴ ἴδωμέν ... εἰς τὸν αἰῶνα
  english_pob_choice: May we never see ... forever
  chosen_korean: 우리는 … 보지 않기를 바랍니다
  alternatives_korean:
  - 우리는 … 영원히 보지 않기를 바랍니다
  - 다시는 … 보지 않기를 바랍니다
  lexicon: LSJ
  rationale: μή + 접속법의 저주/기원적 뉘앙스를 한국어의 소망형으로 살렸고, εἰς τὸν αἰῶνα는 뒤의 '영원히'를 굳이 중복하지 않고 문장 전체의 절대적 부정을 강화하는 방식으로 처리했습니다.
- source_word: σου υἱὸν ἢ θυγατέρα
  english_pob_choice: from you a son or daughter
  chosen_korean: 당신에게서 아들이나 딸
  alternatives_korean:
  - 당신의 아들이나 딸
  - 당신에게서 나온 아들이나 딸
  lexicon: LSJ
  rationale: 수식어 σου는 단순 소유보다 '당신에게서 태어나는/나오는' 자녀를 가리키는 맥락이므로, 영어 POB가 반영한 뉘앙스를 따라 '당신에게서'를 살렸습니다.
theological_decisions:
- issue: 죽은 남편들과 '함께 가라'는 말의 함의
  chosen_reading: 본문에는 '죽으라'는 말을 덧붙이지 않고, 죽은 남편들과 함께하라는 모욕적 추정을 그대로 드러내는 수준으로 번역했습니다.
  alternative_readings:
  - 그들과 함께 죽으십시오
  - 가서 그들과 함께 죽으십시오
  rationale: 그리스어는 단지 '그들과 함께 가라'고만 말하므로, 죽음을 명시하는 표현은 해설을 본문에 삽입하는 것이 됩니다. 원문의 공격성과 함의를 유지하되 해석을 과잉하지 않는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy: Never paraphrase beyond what the source text warrants; preserve theological tension rather than resolve it.'
