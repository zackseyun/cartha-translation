translation:
  language: ko
  text: 모든 지혜로운 사람에게서 조언을 구하십시오. 그리고 어떤 유익한 조언도 멸시하지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어떤 유익한 조언도 무시하지 마십시오.’
    reason: lexical_alternative
lexical_decisions:
- source_word: συμβουλίαν
  english_pob_choice: counsel / advice
  chosen_korean: 조언
  alternatives_korean:
  - 권고
  - 상담
  - 충고
  lexicon: BDAG
  rationale: συμβουλίαν은 판단과 결정을 위한 조언을 뜻하므로, 한국어에서는 일상적이면서도 분별의 뉘앙스를 살리는 ‘조언’이 가장 자연스럽습니다.
- source_word: παρὰ παντὸς φρονίμου
  english_pob_choice: from every wise person
  chosen_korean: 모든 지혜로운 사람에게서
  alternatives_korean:
  - 모든 슬기로운 사람에게서
  - 모든 현명한 사람에게서
  - 모든 지혜로운 자에게서
  lexicon: BDAG
  rationale: παρά + 속격은 출처를 나타내므로 ‘~에게서’로 옮겼고, φρόνιμος의 일반적 의미를 살려 성중립적인 ‘사람’으로 표현했습니다.
- source_word: μὴ καταφρονήσῃς
  english_pob_choice: do not despise
  chosen_korean: 멸시하지 마십시오
  alternatives_korean:
  - 업신여기지 마십시오
  - 무시하지 마십시오
  - 깔보지 마십시오
  lexicon: BDAG
  rationale: καταφρονέω는 단순한 무시보다 더 강한 경멸의 태도를 가리키므로, 경고의 강도를 살리는 ‘멸시하다’를 택했습니다.
- source_word: ἐπὶ πάσης συμβουλίας χρησίμης
  english_pob_choice: any useful counsel / any useful advice
  chosen_korean: 어떤 유익한 조언도
  alternatives_korean:
  - 모든 유익한 조언도
  - 유익한 조언이라면 무엇이든
  - 어떤 도움이 되는 권고도
  lexicon: BDAG
  rationale: ἐπὶ πάσης는 분배적으로 넓게 포괄하는 뜻이므로 ‘어떤 …도’로 자연스럽게 옮겼고, χρησίμης는 ‘유익한’으로 직역에 가깝게 처리했습니다.
