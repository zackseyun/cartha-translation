base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/019.yaml
  text: And at all times bless the Lord God[a], and ask from him that your ways may be made straight and that all your paths and plans may prosper. For no nation has counsel, but the Lord himself gives all good things, and whomever he wills he humbles, as he wills. And now, child, remember my commandments[b], and do not let them be blotted out from your heart.
  footnotes:
  - marker: a
    text: Or, more literally, 'that your ways may become straight.' The Greek can express either becoming straight or being made straight.
    reason: lexical_alternative
  - marker: b
    text: The clause 'For no nation has counsel' is terse in Greek and may mean that no people possesses reliable counsel in itself, in contrast to the Lord who gives what is good.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 언제나 주 하나님을 찬양하십시오. 그분께 네 길들이 곧게 되게 하시고, 네 모든 길과 계획이 형통하게 해 주시기를 구하십시오. 어느 민족도 계책을 지니고 있지 않으며, 주님 자신이 모든 좋은 것을 주시고, 그분이 원하시는 이는 누구든지 그분의 뜻대로 낮추십니다. 그러므로 이제, 아이야, 내 명령들을 기억하고 그것들이 네 마음에서 지워지지 않게 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 εὐλόγει는 문자적으로 ‘복을 빌다, 축복하다’라는 뜻도 지닙니다. 그러나 하나님을 목적어로 할 때 한국어에서는 ‘찬양하십시오’가 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘어느 민족도 계책을 지니고 있지 않으며’(πᾶν ἔθνος οὐκ ἔχει βουλήν)는 그리스어가 매우 압축되어 있습니다. 이는 어느 민족도 스스로 믿을 만한 판단이나 계책을 지니지 못한다는 뜻일 수 있으며, 이어지는 주님께서 좋은 것을 주신다는 진술과 대조됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν παντὶ καιρῷ
  english_pob_choice: at all times
  chosen_korean: 언제나
  alternatives_korean:
  - 모든 때에
  - 항상
  lexicon: LSJ
  rationale: 분배적 뉘앙스를 자연스러운 현대 한국어로 살리되, 문장 전체의 호흡을 해치지 않는 표현으로 옮겼습니다.
- source_word: εὐλόγει
  english_pob_choice: bless
  chosen_korean: 찬양하며
  alternatives_korean:
  - 복을 빌며
  - 축복하며
  lexicon: LSJ
  rationale: 한국어에서 ‘주 하나님을 복 주다’는 어색하므로, 하나님께 드리는 응답 행위로서 ‘찬양하다’를 택해 본문의 경건한 명령성을 살렸습니다.
- source_word: ὁδοί / τρίβοι
  english_pob_choice: ways / paths
  chosen_korean: 길들 / 길목
  alternatives_korean:
  - 길들 / 길들
  - 길들 / 행로들
  lexicon: LSJ
  rationale: 첫 번째 ὁδοί는 삶의 경로로서 ‘길들’이 자연스럽고, δεύτερον τρίβοι는 반복적으로 다니는 ‘길목’으로 옮겨 병렬성을 조금 구분했습니다.
- source_word: βουλαὶ
  english_pob_choice: plans / counsel
  chosen_korean: 계획들
  alternatives_korean:
  - 의도들
  - 뜻들
  lexicon: LSJ
  rationale: 앞 절의 인간 쪽 βουλαί는 현대 독자에게 ‘계획들’이 가장 명료하며, 뒤의 ‘counsel’과 의미 영역을 나누어 전달할 수 있습니다.
- source_word: μνημόνευε τῶν ἐντολῶν μου
  english_pob_choice: remember my commandments
  chosen_korean: 내 명령들을 기억하고
  alternatives_korean:
  - 내 계명들을 기억하고
  - 내 지시들을 기억하고
  lexicon: LSJ
  rationale: ἐντολαί의 권위 있는 명령성을 살리면서도 한국어에서 과도하게 교회화된 어휘를 피하기 위해 ‘명령들’을 사용했습니다.
- source_word: μὴ ἐξαλειφθήτωσαν ἐκ τῆς καρδίας σου
  english_pob_choice: do not let them be blotted out from your heart
  chosen_korean: 그것들이 네 마음에서 지워지지 않게 하십시오
  alternatives_korean:
  - 네 마음에서 지워지지 않게 하십시오
  - 네 마음에서 씻겨 나가지 않게 하십시오
  lexicon: LSJ
  rationale: ‘blotted out’의 이미지인 삭제·소거를 현대 한국어의 ‘지워지다’로 옮기되, 마음 안에 새겨진 말씀의 보존을 자연스럽게 표현했습니다.
theological_decisions:
- issue: κύριον τὸν Θεόν의 호칭과 경건한 명령문의 어조
  chosen_reading: 주 하나님
  alternative_readings:
  - 주, 하나님
  - 주님 하나님
  rationale: κύριος와 Θεός의 결합을 한국어 기독교 용례와 직접성 사이에서 균형 있게 살리되, 말씀을 향한 존중을 유지하는 표현으로 정리했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → Lord; Θεός → 하나님'
- issue: ὃ ἐὰν θέλῃ ταπεινοῖ, καθὼς βούλεται의 주권 진술
  chosen_reading: 그가 원하시는 누구든지 낮추시기 때문입니다
  alternative_readings:
  - 그가 원하시는 무엇이든 낮추시기 때문입니다
  - 그분이 뜻하시는 자를 낮추시기 때문입니다
  rationale: 하나님의 주권과 인격 대상에 대한 긴장을 그대로 유지하기 위해 ‘누구든지’를 택했으며, 문맥의 신학적 강도를 완화하지 않았습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
