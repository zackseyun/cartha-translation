  rationale: 원문의 수동 완료형이 나타내는 혼인 배치(‘시집보내졌기’), 문맥상 ἀνδράσιν의 ‘남편들’, 그리고 성적·혼인적 결합을 가리키는 완곡어법을 보존했습니다. 비난의 현재적 표현은 ‘질식시키고 있다’로 유지했으며, 마지막 문장의 생략된 목적어는 한국어의 명료성을 위해 ‘남편’으로 보충했습니다.
