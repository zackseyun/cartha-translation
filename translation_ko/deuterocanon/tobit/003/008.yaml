- from: 그녀는 이미 일곱 남자에게 주어졌기 때문입니다. 그리고 악한 악마 아스모다이오스가 그들이 그녀와 아내에게 하듯이 함께 있기 전에 그들을 죽였습니다. 그러자 그들이 그녀에게 말했습니다. 「당신은 당신의 남자들을 질식시키고 있다는 것을 깨닫지 못합니까? 이미 당신은 일곱을 가졌지만, 그들 가운데 한 사람에게서도 아무 이익을 얻지 못했습니다.」[a]
