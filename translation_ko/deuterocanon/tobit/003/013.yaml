  naturalness: ‘저를 땅에서 풀어 주시라고 말씀해 주십시오’와 ‘더 이상 비난을 듣지 않게 해 주십시오’는 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘비난’은 여기서 받는 모욕적 비방을 넓게 포괄하지만, ‘비방’이 ὀνειδισμός의 말로 가해지는 모욕과 문맥상의 사회적 수치를 더 정확히 나타냅니다.
