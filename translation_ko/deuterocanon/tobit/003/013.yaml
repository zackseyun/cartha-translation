  text: Tell me to release me from the earth[a], so that I may no longer hear reproach.
  footnotes:
  - marker: a
    text: Or 'set me free from the earth' or 'remove me from the earth.' The Greek expression is an indirect plea for release from earthly life.
    reason: lexical_alternative
translation:
  language: ko
  text: 저에게 말씀하셔서 저를 땅에서 풀어 주시어, 더 이상 비난을 듣지 않게 해 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅에서 저를 풀어 주십시오’, ‘땅에서 저를 없애 주십시오’. 그리스어 표현은 현세 생명에서 벗어나게 해 달라는 간접 청원입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰπὸν
  english_pob_choice: Tell me
  chosen_korean: 저에게 말씀하셔서
  alternatives_korean:
  - 말해 주셔서
  - 명령하셔서
  lexicon: LSJ
  rationale: aorist imperative of λέγω로서 간청의 어조를 살려 ‘말씀하셔서’로 옮겼습니다. 한국어에서는 이어지는 목적절을 자연스럽게 받게 하면서도, 단순 서술이 아닌 청원임을 드러냅니다.
- source_word: ἀπολῦσαί
  english_pob_choice: to release
  chosen_korean: 풀어 주시어
  alternatives_korean:
  - 해방해 주시어
  - 놓아 주시어
  - 놓아 보내 주시어
  lexicon: BDAG
  rationale: ἀπολύω의 ‘풀다/놓아 주다’ 의미를 살리면서, 여기서는 육체적 삶에서의 해방을 완곡하게 가리키는 청원으로 읽혀 ‘풀어 주시어’가 가장 자연스럽습니다.
- source_word: ἀπὸ τῆς γῆς
  english_pob_choice: from the earth
  chosen_korean: 땅에서
  alternatives_korean:
  - 땅으로부터
  - 이 세상에서
  - 세상에서
  lexicon: LSJ
  rationale: γῆ를 문자 그대로 ‘땅’으로 옮겨 원문 이미지를 유지했습니다. 문맥상 현세 생명에서의 제거를 뜻하지만, 본문 자체의 표현을 지나치게 풀어 쓰지 않았습니다.
- source_word: ὀνειδισμόν
  english_pob_choice: reproach
  chosen_korean: 비난
  alternatives_korean:
  - 모욕
  - 치욕
  - 조롱
  lexicon: BDAG
  rationale: ὀνειδισμός는 공개적 수치와 말로 하는 책망을 함께 포함할 수 있어, 한국어로는 가장 넓게 ‘비난’이 적합합니다. ‘조롱’은 지나치게 좁고, ‘치욕’은 상태를 더 강하게 드러냅니다.
theological_decisions:
- issue: ‘땅에서 풀어 달라’는 표현의 죽음 완곡어법 유지
  chosen_reading: 본문은 죽음을 직접 진술하지 않고, ‘땅에서 풀어 주십시오’라는 간접 청원을 그대로 살렸습니다.
  alternative_readings:
  - 저를 이 세상에서 데려가 주십시오
  - 저를 죽여 주십시오
  rationale: 그리스어의 ἀπολῦσαί με ἀπὸ τῆς γῆς는 직설적 죽음 진술보다 완곡한 해방 청원에 가깝습니다. 한국어 본문도 그 긴장을 유지해야 원문의 정서를 보존할 수 있습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
