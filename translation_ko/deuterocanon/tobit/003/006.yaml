review_pass:
  verdict: revise
  source_fidelity: 첫 번째 ἐπίταξον은 ‘제 영을 거두어 가도록 명하소서’로, 두 번째 ἐπίταξον은 ‘제가 … 가도록 명하소서’로 각각 보존하는 것이 필요합니다. 초안의 후반 ‘풀어 주시고’는 원문의 ‘명하소서’와 그 반복을 직접적으로 반영하지 못합니다. 또한 ‘영원한 곳으로’는 ‘풀려남’의 목적지를 나타내므로 문장 안에서 이를 분명히 연결했습니다.
  naturalness: ‘제게서 당신의 얼굴’은 기도문 안에서 앞선 ‘주님’ 호칭과 높임의 일관성이 약합니다. ‘제게서 주님의 얼굴을 돌리지 마소서’가 현대 한국어 합쇼체 기도문으로 자연스럽고 일관됩니다. ‘거두어 가도록 명하셔서’와 ‘가도록 명하소서’는 다소 엄숙하지만 원문의 반복되는 명령 요청과 애원체에 적합합니다.
  terminology: πνεῦμα는 ‘영’, γῆ는 문맥상 ‘흙’, ἀνάγκη는 ‘고통’, αἰώνιος τόπος는 특정 사후 교리를 덧붙이지 않는 ‘영원한 곳’으로 유지했습니다. ‘주님’ 호칭을 일관되게 사용하되, 원문이 말하지 않는 사후 상태의 세부 의미는 추가하지 않았습니다.
  issues:
  - severity: medium
    issue: 후반부의 반복된 ‘ἐπίταξον’이 ‘풀어 주시고’로 번역되어 명령해 달라는 요청이 사라집니다.
    rationale: 원문은 앞부분과 후반부에서 모두 ἐπίταξον(‘명하소서’)을 사용합니다. 이를 보존해야 문장의 병행과 간청의 강도가 유지됩니다.
  - severity: medium
    issue: ‘제게서 당신의 얼굴’은 ‘주님’ 호칭과 존대 지시의 일관성이 맞지 않습니다.
    rationale: 한국어 기도문에서는 ‘주님’과 ‘당신’을 한 호칭 체계 안에서 섞지 않는 것이 자연스럽습니다. ‘주님의 얼굴’을 사용하면 높임과 문체가 일관됩니다.
  - severity: low
    issue: 각주 표지가 해당 어구 바로 뒤가 아니라 문단 끝에 함께 놓여 있습니다.
    rationale: '[a]는 ‘흙이 되다’, [b]는 ‘영원한 곳’에 각각 연결해야 주석 대상이 명확합니다.'
