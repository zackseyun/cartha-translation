base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/006.yaml
  text: And now deal with me according to what is pleasing to you[a]. Command that my spirit be taken up, so that I may be released and become dust. For it is better for me to die than to live, because I have heard false reproaches, and there is great grief within me. Command that I be released now from this distress into the everlasting place[b], and do not turn your face away from me.
  footnotes:
  - marker: a
    text: Or 'become earth.' The Greek literally says 'become earth,' a death idiom rendered here as 'become dust.'
    reason: lexical_alternative
  - marker: b
    text: '''The everlasting place'' is a general expression for the place of the dead; the Greek does not specify a more developed doctrinal term here.'
    reason: cultural_note
translation:
  language: ko
  text: 이제 주님의 기쁘신 뜻대로 저에게 행하소서. 제 영을 거두어 가도록 명하셔서 제가 풀려나 흙이 되게 하소서.[a] 제가 죽는 것이 사는 것보다 더 낫습니다. 거짓 비난을 들었고 제 안에 큰 슬픔이 있기 때문입니다. 제가 이제 이 고통에서 풀려나 영원한 곳으로 가도록 명하소서.[b] 제게서 주님의 얼굴을 돌리지 마소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘땅이 되다’라고 말합니다. 여기서는 죽음의 관용구를 살려 ‘흙이 되다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘영원한 곳’은 죽은 자의 장소를 가리키는 일반적 표현이며, 그리스어는 더 발전된 교리 용어를 특정하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: κατὰ τὸ ἀρεστόν σου
  english_pob_choice: according to what is pleasing to you
  chosen_korean: 주님의 기쁘신 뜻대로
  alternatives_korean:
  - 주님께서 기뻐하시는 대로
  - 주님의 마음에 맞는 대로
  lexicon: BDAG
  rationale: 하나님께 대한 의향·기쁨의 뉘앙스를 자연스러운 합쇼체로 살리되, 단순한 임의성보다 뜻의 순응을 분명히 했습니다.
- source_word: ἀναλαβεῖν τὸ πνεῦμά μου
  english_pob_choice: that my spirit be taken up
  chosen_korean: 제 영을 거두어 가시라고
  alternatives_korean:
  - 제 영을 받아 가시라고
  - 제 영을 들어 올리시라고
  lexicon: BDAG
  rationale: πνεῦμα를 ‘영’으로 유지하고, ἀναλαμβάνω의 ‘거두어 들이다/취하다’ 감각을 살려 죽음을 완곡하게 요청하는 표현으로 옮겼습니다.
- source_word: γένωμαι γῆ
  english_pob_choice: become dust
  chosen_korean: 흙이 되게 하소서
  alternatives_korean:
  - 먼지가 되게 하소서
  - 땅이 되게 하소서
  lexicon: LSJ
  rationale: 원문은 문자적으로 ‘땅’이지만 죽음 관용구이므로, POB의 주석 취지를 따라 한국어 성경에서 자연스럽고 상징도 유지되는 ‘흙’으로 옮겼습니다.
- source_word: εἰς τὸν αἰώνιον τόπον
  english_pob_choice: into the everlasting place
  chosen_korean: 영원한 곳으로
  alternatives_korean:
  - 영원한 장소로
  - 영속하는 곳으로
  lexicon: LSJ
  rationale: 원문이 사후의 특정 교리 용어를 말하지 않으므로, 장소의 성격만 드러내는 넓은 표현을 택했습니다.
theological_decisions:
- issue: 죽음 요청에서의 영(πνεῦμα) 표현 보존
  chosen_reading: 제 영을 거두어 가시라고
  alternative_readings:
  - 제 생명을 거두어 가시라고
  - 제 영을 받아 주시라고
  rationale: 원문이 분명히 πνεῦμα를 쓰므로 ‘영’을 보존해 인물의 기도 언어를 흐리지 않았습니다. 동시에 이후의 사후 상태를 지나치게 규정하지 않도록 했습니다.
  doctrine_reference: 본문의 인간론과 사후 상태를 확정하지 않고 원문 표현을 보존합니다.
- issue: ‘영원한 곳’의 사후 목적지 의미
  chosen_reading: 영원한 곳
  alternative_readings:
  - 영원한 집
  - 무덤
  - 영원한 처소
  rationale: 원문은 죽은 자의 장소를 일반적으로 말할 뿐이므로, 특정 종말론 범주를 덧씌우지 않는 중립적 표현을 유지했습니다.
  doctrine_reference: 본문의 범주를 넘는 교리적 세부화를 피합니다.
