revisions:
- from: 이제 주님의 기쁘신 뜻대로 저에게 행하소서. 제 영을 거두어 가시라고 명령하셔서 제가 풀려나 흙이 되게 하소서. 제가 죽는 것이 사는 것보다 더 낫습니다. 거짓 비난을 들었고 제 안에 큰 슬픔이 있기 때문입니다. 이 고통에서 저를 이제 영원한 곳으로 풀어 주시고, 제게서 당신의 얼굴을 돌리지 마소서.[a][b]
  to: 이제 주님의 기쁘신 뜻대로 저에게 행하소서. 제 영을 거두어 가도록 명하셔서 제가 풀려나 흙이 되게 하소서.[a] 제가 죽는 것이 사는 것보다 더 낫습니다. 거짓 비난을 들었고 제 안에 큰 슬픔이 있기 때문입니다. 제가 이제 이 고통에서 풀려나 영원한 곳으로 가도록 명하소서.[b] 제게서 주님의 얼굴을 돌리지 마소서.
  rationale: 반복되는 ἐπίταξον을 두 곳 모두 ‘명하소서’로 재현하고, 후반의 ‘고통에서 풀려나 영원한 곳으로’라는 이동·해방의 관계를 자연스러운 한국어로 밝혔습니다. 기도 대상 호칭도 ‘주님’으로 일관시켰으며, 각주 표지를 해당 번역어 바로 뒤로 옮겼습니다.
