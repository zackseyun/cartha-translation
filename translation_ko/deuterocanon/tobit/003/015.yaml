  rationale: 단순한 언어적 비난보다 사회적 수치와 멸시를 함께 담는 말이어서, 탄식의 정서를 살리는 ‘치욕’을 택했습니다.
theological_decisions:
- issue: ‘일곱’의 구체적 대상 표시 여부
  chosen_reading: 본문에는 ‘이미 일곱이 내게서 죽었습니다’만 두고, ‘남편들’은 추가하지 않았습니다.
  alternative_readings:
  - 이미 일곱 남편이 내게서 죽었습니다
  - 이미 일곱 남편을 잃었습니다
  rationale: 그리스어는 ‘일곱’만 말하고 있으므로 본문은 그 절제를 유지하고, 서술 맥락의 보충은 하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: 마지막 청원의 어조
  chosen_reading: ‘저를 굽어보시고 저에게 자비를 베풀도록 명령하시고’로, 간청형 합쇼체를 유지했습니다.
  alternative_readings:
  - 저를 보시고 불쌍히 여기십시오
  - 저를 굽어보시어 자비를 베풀어 주십시오
  rationale: 하나님께 드리는 직접 청원은 한국어 합쇼체로, 다만 명령형 구조인 ἐπίταξον을 반영해 ‘명령하시고’의 긴장을 살렸습니다.
  doctrine_reference: Korean target style
