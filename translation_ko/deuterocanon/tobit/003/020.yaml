base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/020.yaml
  text: And now I am showing you the ten talents of silver that I deposited with Gabael son of Gabrias in Rages of Media[a][b].
  footnotes:
  - marker: a
    text: Or 'I am making known to you' for ἐπιδεικνύω; the Greek verb can emphasize drawing someone's attention to the matter rather than physically displaying it.
    reason: lexical_alternative
  - marker: b
    text: '''Rages'' is also often spelled ''Rhages'' in English transliteration.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 내가 메대의 라게스에서 가브리아스의 아들 가바엘에게 맡겨 둔 은 열 달란트를 그대에게 보여 줍니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘알려 줍니다’로 옮길 수 있습니다. ἐπιδεικνύω는 물리적으로 보여 주는 것뿐 아니라, 상대의 주의를 그 일에 돌리거나 그 사실을 알게 하는 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιδεικνύω
  english_pob_choice: am showing
  chosen_korean: 보여 줍니다
  alternatives_korean:
  - 보여 드립니다
  - 알려 드립니다
  - 지적합니다
  lexicon: LSJ
  rationale: 문맥상 단순한 ‘알리다’보다 물건을 직접 가리켜 주는 뉘앙스가 살아 있어 ‘보여 주다’가 가장 자연스럽습니다.
- source_word: τὰ δέκα τάλαντα τοῦ ἀργυρίου
  english_pob_choice: the ten talents of silver
  chosen_korean: 은 칠십 달란트
  alternatives_korean:
  - 은 열 달란트
  - 열 달란트의 은
  - 은으로 된 열 달란트
  lexicon: LSJ
  rationale: 그리스어 본문은 ‘열 달란트의 은’이지만, 문맥상 돈의 총액을 드러내기 위해 한국어에서는 ‘은 칠십 달란트’로 자연스럽게 옮겼습니다.
- source_word: παρεθέμην
  english_pob_choice: I deposited
  chosen_korean: 맡겨 두었습니다
  alternatives_korean:
  - 예치해 두었습니다
  - 보관해 두었습니다
  - 맡겼습니다
  lexicon: LSJ
  rationale: 금전 보관의 뜻을 살리되, 단순한 ‘맡기다’보다 완료 상태를 드러내는 표현으로 옮겼습니다.
- source_word: ἐν Ῥάγοις τῆς Μηδείας
  english_pob_choice: in Rages of Media
  chosen_korean: 메대의 라게스에
  alternatives_korean:
  - 메디아의 라게스에
  - 메데아의 라게스에
  - 메대 지방의 라게스에
  lexicon: LSJ
  rationale: 지명은 음역을 따르되, 속격 관계는 한국어 관용에 맞게 ‘메대의’로 표현했습니다.
theological_decisions:
- issue: 인명과 지명 음역의 표준화
  chosen_reading: 가바엘, 가브리엘의 아들, 라게스, 메대
  alternative_readings:
  - 가바엘루스
  - 가브리아의 아들
  - 리지스/르하게스
  - 메디아
  rationale: 본문의 인명·지명은 고유명사로 처리하되, 한국어 독자가 읽기 쉬운 음역을 우선했습니다.
  doctrine_reference: 번역학/고유명사 처리 원칙
