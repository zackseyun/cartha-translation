  text: καὶ νῦν ἐπιδεικνύω σοι τὰ δέκα τάλαντα τοῦ ἀργυρίου ἃ παρεθέμην Γαβαήλῳ τῷ τοῦ Γαβρεία ἐν Ῥάγοις τῆς Μηδείας.
