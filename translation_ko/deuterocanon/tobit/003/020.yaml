revisions:
- from: 이제 나는 그대에게 은 칠십 달란트[a]를 보여 줍니다. 내가 그것을 메대의 라게스에 있는 가브리엘의 아들 가바엘에게 맡겨 두었습니다.
  to: 이제 내가 메대의 라게스에서 가브리아스의 아들 가바엘에게 맡겨 둔 은 열 달란트를 그대에게 보여 줍니다[a].
  rationale: 원문의 수량을 ‘열’로 회복하고, Γαβρεία에 해당하는 부친명을 가브리엘과 혼동하지 않도록 ‘가브리아스’로 수정했습니다. 나머지 표현은 예치·보관의 의미와 현재의 발화 상황을 유지하면서 현대 합쇼체로 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:50:37Z'
review_pass:
  verdict: revise
  source_fidelity: 그리스어는 ‘은 열 달란트’(τὰ δέκα τάλαντα τοῦ ἀργυρίου)라고 하므로, 초안의 ‘은 칠십 달란트’는 중대한 수량 오류입니다. 또한 Γαβρεία는 영어 감사 기록의 Gabrias에 해당하며, ‘가브리엘’로 옮기면 다른 인명이 됩니다. 맡겨 보관하게 한 과거 행위와 메대의 라게스라는 장소 관계는 수정문에서 충실히 반영했습니다.
  naturalness: ‘이제 내가 … 보여 줍니다’와 ‘맡겨 둔’은 현대 표준 한국어 합쇼체로 자연스럽습니다. 관계절을 명사구 앞에 두어 한국어 문장 흐름도 매끄럽게 했습니다.
  terminology: 달란트는 고대의 무게·화폐 단위이므로 음역을 유지했습니다. Γαβαήλ/Γαβρεία는 각각 ‘가바엘’과 ‘가브리아스’로 구별했고, Ῥάγοις와 Μηδείας는 ‘라게스’, ‘메대’로 일관되게 옮겼습니다.
  issues:
  - severity: high
    issue: ‘은 칠십 달란트’
    rationale: 원문 τὰ δέκα τάλαντα는 ‘열 달란트’이며, 칠십이라는 수량은 원문 및 영어 감사 기록 모두와 일치하지 않습니다.
  - severity: high
    issue: ‘가브리엘의 아들’
    rationale: 원문의 Γαβρεία 및 영어 감사 기록의 Gabrias는 가브리엘과 다른 인명입니다. 이를 ‘가브리아스의 아들’로 바로잡아야 합니다.
  - severity: low
    issue: 각주 표지의 위치
    rationale: ἐπιδεικνύω의 의미 대안을 설명하는 각주는 해당 번역어 ‘보여 줍니다’ 뒤에 붙이는 편이 지시 대상이 분명합니다.
