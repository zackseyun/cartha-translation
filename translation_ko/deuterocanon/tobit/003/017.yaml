base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/017.yaml
  text: 'of the great Raphael. And he was sent to heal the two: to remove the white films from Tobit''s eyes[a], and to give Sarah daughter of Raguel to Tobiah son of Tobit as a wife, and to bind Asmodeus, the evil demon, because Tobiah was entitled to inherit her. At that same time Tobit returned and entered into his house, and Sarah daughter of Raguel came down from her upper room.'
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'because Tobiah had the right to marry her.' The Greek says 'inherit her,' reflecting the legal-family framework of the story.
    reason: lexical_alternative
translation:
  language: ko
  text: '위대한 라파엘의.


    그는 두 사람을 고치기 위해 보내졌습니다. 곧 토빗의 눈에서 흰 막을 벗겨 내고, 라구엘의 딸 사라를 토빗의 아들 토비아에게 아내로 주고, 토비아가 그녀를 상속할 권리가 있었기 때문에 악한 귀신 아스모데오를 묶기 위해서였습니다. 바로 그때 토빗이 돌아와 자기 집으로 들어갔고, 라구엘의 딸 사라는 자기 위층 방에서 내려왔습니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 자연스럽게는 ‘토비아가 그녀와 결혼할 권리가 있었기 때문입니다’로 옮길 수 있습니다. 그리스어는 혼인 맥락에서 ‘상속하다’라는 법적 표현을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ μεγάλου Ῥαφαήλ
  english_pob_choice: of the great Raphael
  chosen_korean: 큰 라파엘을 통해서입니다
  alternatives_korean:
  - 위대한 라파엘의
  - 큰 라파엘의
  lexicon: 고유명사/문맥
  rationale: 앞선 문맥과 이어지는 소유격 표현을 한국어에서 자연스럽게 풀어, ‘큰 라파엘’이라는 호칭을 유지하되 문장 연결을 살렸습니다.
- source_word: λεπίσαι τὰ λευκώματα
  english_pob_choice: to remove the white films from Tobit's eyes
  chosen_korean: 토빗의 눈의 흰 막을 벗겨 내고
  alternatives_korean:
  - 토빗의 눈의 백막을 제거하고
  - 토빗의 눈의 흰 혼탁을 없애고
  lexicon: LSJ
  rationale: λεπίσαι의 ‘벗겨 내다’ 느낌과 λευκώματα의 ‘흰 막/혼탁’ 의미를 살려, 현대 독자가 이해할 수 있으면서도 진단을 과도하게 특정하지 않게 했습니다.
- source_word: δοῦναι ... γυναῖκα
  english_pob_choice: to give Sarah ... to Tobiah ... as a wife
  chosen_korean: 라구엘의 딸 사라를 토빗의 아들 토비아에게 아내로 주며
  alternatives_korean:
  - 라구엘의 딸 사라를 토비아에게 결혼하여 주며
  - 라구엘의 딸 사라를 토비아의 아내로 주며
  lexicon: BDAG
  rationale: 여기서는 혼인 공식에 해당하므로 ‘아내로 주다’가 가장 직접적이며, 딸과 아들 관계 표기도 그대로 옮겼습니다.
- source_word: δῆσαι
  english_pob_choice: to bind
  chosen_korean: 묶기 위해서입니다
  alternatives_korean:
  - 구속하기 위해서입니다
  - 속박하기 위해서입니다
  lexicon: BDAG
  rationale: 악한 영을 제압하는 동작을 한국어로 가장 직설적으로 옮겼습니다.
- source_word: ἐπιβάλλει κληρονομῆσαι αὐτήν
  english_pob_choice: was entitled to inherit her
  chosen_korean: 토비아가 그녀를 상속할 권리가 있었기 때문입니다
  alternatives_korean:
  - 토비아가 그녀를 상속할 권리가 있었기 때문입니다
  - 토비아가 그녀를 차지할 권리가 있었기 때문입니다
  lexicon: LSJ
  rationale: ‘상속하다’는 현대 한국어에서 다소 낯설지만, 본문의 법적-가족적 언어를 보존하기 위해 영어 POB의 선택을 따라 유지했습니다.
- source_word: τὸ ὑπερῷον
  english_pob_choice: upper room
  chosen_korean: 자기 다락방
  alternatives_korean:
  - 위층 방
  - 윗방
  lexicon: LSJ
  rationale: 생활공간의 위층을 가리키는 말로 자연스럽고, 사라가 내려오는 동작과도 잘 맞습니다.
theological_decisions:
- issue: ‘상속하다’와 혼인 관계의 긴장
  chosen_reading: 본문의 법적·가족적 표현을 살려 ‘그녀를 상속할 권리’로 두었습니다.
  alternative_readings:
  - 그녀와 결혼할 권리가 있었기 때문입니다
  - 그녀를 아내로 맞을 권리가 있었기 때문입니다
  rationale: 그리스어가 실제로 상속 언어를 사용하므로, 이를 매끄러운 혼인 표현으로 바꾸지 않고 긴장을 보존했습니다.
  doctrine_reference: 원문 우선 원칙; 본문 고유의 법정-가족 비유를 보존
