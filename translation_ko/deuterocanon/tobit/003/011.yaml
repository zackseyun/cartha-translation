  text: And she prayed by the window and said[a], “Blessed are you, Lord my God, and blessed is your holy and honored name forever; let all your works bless you forever.”
  footnotes:
  - marker: a
    text: Or “let all your works praise you forever.” The Greek repeats the same blessing word-group used earlier in the verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 창가에 서서 기도하며 말했습니다. “주님, 제 하나님, 찬양받으소서. 주님의 거룩하고 존귀한 이름이 영원히 찬양받으소서. 주님의 모든 일들이 영원히 주님을 찬양하게 하소서.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 같은 축복 어휘를 반복합니다. 여기서는 의미를 따라 ‘찬양하다’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδεήθη
  english_pob_choice: prayed
  chosen_korean: 기도하며
  alternatives_korean:
  - 간청하며
  - 간구하며
  - 애원하며
  lexicon: BDAG
  rationale: 이 동사는 간절한 청원을 뜻하지만, 기도 장면에서는 한국어로 ‘기도하다’가 가장 자연스럽고 본문의 예배적 맥락도 잘 살립니다.
- source_word: πρὸς τῇ θυρίδι
  english_pob_choice: by the window
  chosen_korean: 창가에
  alternatives_korean:
  - 창문 곁에
  - 창문에서
  - 창문을 향해
  lexicon: LSJ
  rationale: πρός + 여격은 이 문맥에서 위치적 근접을 나타내므로, 한국어로는 ‘창가에’가 가장 간결하고 자연스럽습니다.
- source_word: τὸ ὄνομά σου τὸ ἅγιον καὶ ἔντιμον
  english_pob_choice: your holy and honored name
  chosen_korean: 주님의 거룩하고 존귀한 이름
  alternatives_korean:
  - 주님의 거룩하고 귀한 이름
  - 주님의 거룩하고 영광스러운 이름
  lexicon: LSJ
  rationale: ἔντιμον은 ‘존귀한, 존중받는’의 뜻이므로 ‘존귀한’이 ‘거룩한’과 짝을 이루어 본문의 경외감을 잘 드러냅니다.
- source_word: εὐλογησάτωσάν σε
  english_pob_choice: let all your works bless you
  chosen_korean: 주님의 모든 일들이 영원히 주님을 찬양하게 하소서
  alternatives_korean:
  - 주님의 모든 일들이 주님을 축복하게 하소서
  - 주님의 모든 일들이 주님을 찬양하소서
  lexicon: BDAG
  rationale: 직역하면 ‘축복하다’이지만, 하나님께 향한 대상의 동작으로는 한국어에서 ‘찬양하다’가 의미를 자연스럽게 전달합니다. 다만 원문의 축복 어휘 반복은 유지하기 어렵기 때문에 의미 중심으로 옮겼습니다.
- source_word: εἰς τοὺς αἰῶνας / εἰς τὸν αἰῶνα
  english_pob_choice: forever / forever
  chosen_korean: 영원히
  alternatives_korean:
  - 세세토록
  - 영원토록
  lexicon: BDAG
  rationale: 두 번 반복되는 지속 표현은 한국어에서도 동일하게 ‘영원히’로 처리해 평행 구조를 보존했습니다.
theological_decisions:
- issue: 하나님께 직접 드리는 축복어의 한국어 표현
  chosen_reading: ‘찬양받으소서’와 ‘찬양하게 하소서’로 옮겨, 하나님을 향한 경배의 방향을 분명히 했습니다.
  alternative_readings:
  - ‘복되소서’
  - ‘축복받으소서’
  - ‘축복하게 하소서’
  rationale: 한국어에서 ‘복되다/축복받다’는 현대 독자가 오해할 소지가 있어, 본문의 doxology를 분명히 하면서도 예배적 울림이 있는 ‘찬양받다’ 계열로 조정했습니다.
  doctrine_reference: DOCTRINE.md §5 Consistency of key terms, or documented exception
