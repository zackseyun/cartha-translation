base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/002.yaml
  text: You are righteous[a], Lord, and all your works and all your ways are mercy and truth, and you judge true and righteous judgment forever.
  footnotes:
  - marker: a
    text: Or 'all your ways are mercies and faithfulness.' The Greek ἐλεημοσύναι can denote merciful acts, and ἀλήθεια can carry the nuance 'faithfulness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님은 의로우시며, 주님의 모든 일과 모든 길은 긍휼과 진리입니다.[a] 주님께서는 영원히 참되고 의로운 심판을 내리십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 모든 길은 자비로운 행위들과 신실함입니다.’ ἐλεημοσύναι는 ‘자비로운 행위들’ 또는 ‘긍휼들’을, ἀλήθεια는 ‘진리’보다 ‘신실함’의 뉘앙스를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δίκαιος
  english_pob_choice: righteous
  chosen_korean: 의로우십니다
  alternatives_korean:
  - 공의로우십니다
  - 의롭습니다
  lexicon: BDAG
  rationale: 하나님의 성품을 직접적으로 드러내는 술어이므로, 단순한 판정보다 신학적 무게를 가진 ‘의로우십니다’를 택했습니다.
- source_word: ἐλεημοσύναι
  english_pob_choice: mercy
  chosen_korean: 긍휼
  alternatives_korean:
  - 긍휼의 행위
  - 자비
  - 은혜
  lexicon: BDAG
  rationale: 하나님의 길을 수식하는 복수 표현으로서 행위성은 있으나, 한국어에서는 하나님께 돌려지는 성격을 살리기 위해 간결하게 ‘긍휼’로 옮겼습니다.
- source_word: ἀλήθεια
  english_pob_choice: truth
  chosen_korean: 진리
  alternatives_korean:
  - 진실
  - 신실하심
  lexicon: BDAG
  rationale: ‘긍휼’과 병렬되는 표현을 살리면서도, 원어의 직접 대응을 유지하기 위해 ‘진리’를 선택했습니다.
- source_word: κρίσιν ἀληθινὴν καὶ δικαίαν
  english_pob_choice: true and righteous judgment
  chosen_korean: 참되고 의로운 심판
  alternatives_korean:
  - 진실하고 의로운 심판
  - 참된 공의의 심판
  lexicon: BDAG
  rationale: 형용사 두 개를 심판에 그대로 붙여, 판단의 진정성과 의로움을 모두 드러내도록 했습니다.
theological_decisions:
- issue: ἐλεημοσύναι를 ‘acts of mercy’처럼 행위로 풀지, ‘긍휼’로 압축할지
  chosen_reading: ‘긍휼’로 번역하되, 문맥상 하나님의 길을 규정하는 자비의 성격을 유지했습니다.
  alternative_readings:
  - 긍휼의 행위
  - 자비로운 행위
  rationale: 본문은 하나님의 ‘길’ 전체를 서술하므로, 한국어에서는 행위 설명을 덧붙이기보다 속성을 간결하게 제시하는 편이 원문의 평행구조를 더 잘 살립니다.
  doctrine_reference: 'DOCTRINE.md: 원문의 평행성과 긴장을 보존하고, 해석적 확장을 최소화한다.'
