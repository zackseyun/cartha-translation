  source_fidelity: 그리스어의 κρίσεις(하나님의 심판/사법적 처분), ἀληθιναί(참된), 조상들의 죄, 계명, ‘진리 안에서 걷다’라는 비유를 대체로 보존하려는 방향은 적절합니다. 그러나 현 본문의 ‘내게 행하신 일에 대하여 그렇습니다’는 선행 진술과 문법적으로 연결되지 않아 원문의 ‘심판이 … 참되다’라는 고백을 충실히 전달하지 못합니다. 또한 περί를 ‘때문에’로 확정하면 원문의 ‘~에 관하여/관련하여’보다 인과성을 강하게 만듭니다.
  naturalness: ‘이제 주님의 판단은 많고 참되니, … 대하여 그렇습니다’는 현대 표준 한국어로 비문에 가깝고 합쇼체 문장으로도 자연스럽지 않습니다. ‘진리 가운데 걸어가지 않았습니다’는 이해 가능하나, 한국어 성서 문체에서는 ‘진리 안에서 살지 않았습니다’가 관용의 의미를 더 자연스럽게 전달합니다.
