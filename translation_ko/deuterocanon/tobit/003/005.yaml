  text: And now your judgments are many and true in dealing with me concerning my sins and the sins of my fathers[a], because we did not keep your commandments[b]; for we did not walk in truth before you.
  footnotes:
  - marker: a
    text: Or 'your judgments are many and just.' The Greek says 'true,' which in context affirms the rightness of God's judgments.
    reason: lexical_alternative
  - marker: b
    text: '''Walk in truth'' is a biblical idiom for living faithfully and truthfully before God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 주님의 판단은 많고 참되니, 내 죄들과 내 조상들의 죄들 때문에 내게 행하신 일에 대하여 그렇습니다. 이는 우리가 주님의 명령들을 지키지 않았기 때문입니다. 우리는 주님 앞에서 진리 가운데 걸어가지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이곳의 κρίσεις는 하나님이 행하신 사법적 처분을 가리킵니다. 문맥상 ‘참되니’는 그 판단의 옳음을 함축합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘진리 가운데 걷다’는 성서적 관용으로, 하나님 앞에서 신실하고 진실하게 사는 것을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσεις
  english_pob_choice: judgments
  chosen_korean: 판단
  alternatives_korean:
  - 심판
  - 판결
  - 재판
  lexicon: LSJ
  rationale: 문맥상 하나님이 죄에 대해 행하시는 사법적 처분을 가리키므로, ‘판단’이 ‘judgments’의 의미를 비교적 직접적으로 살리면서도 한국어에서 자연스럽습니다.
- source_word: ἀληθιναί
  english_pob_choice: 'true'
  chosen_korean: 참되니
  alternatives_korean:
  - 진실하니
  - 의로우니
  - 옳으니
  lexicon: LSJ
  rationale: 원문은 ‘true’에 가장 직접적으로 대응하므로, 이를 ‘참되니’로 옮겨 판결의 옳음을 해설로 풀기보다 본문 표현을 유지했습니다.
- source_word: ἐξ ἐμοῦ ποιῆσαι περὶ τῶν ἁμαρτιῶν μου καὶ τῶν πατέρων μου
  english_pob_choice: in dealing with me concerning my sins and the sins of my fathers
  chosen_korean: 내 죄들과 내 조상들의 죄들 때문에 내게 행하신 일에 대하여
  alternatives_korean:
  - 내 죄들과 내 조상들의 죄들에 관하여 나를 대하신 일에 대하여
  - 내 죄들과 내 조상들의 죄들로 나를 다루신 일에 대하여
  lexicon: LSJ
  rationale: 그리스어의 다소 비정형적인 구문을 한국어에서 자연스럽게 풀되, ‘내게 행하신 일’로 하나님의 처분을 분명히 하고 ‘때문에’로 원인의 관계를 드러냈습니다.
- source_word: ἐπορεύθημεν ἐν ἀληθείᾳ
  english_pob_choice: we did not walk in truth
  chosen_korean: 진리 가운데 걸어가지 않았습니다
  alternatives_korean:
  - 진리 안에서 살지 않았습니다
  - 진리 가운데 행하지 않았습니다
  - 진실하게 살지 않았습니다
  lexicon: LSJ
  rationale: ‘walk’의 성서적 관용을 살리되, 한국어에서는 ‘걸어가다’보다 ‘행하다/살다’가 더 평이할 수 있어도, 본문의 비유적 행위성을 유지하려고 ‘걸어가지 않았습니다’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 κρίσεις를 ‘just’로 풀지, ‘true’로 그대로 살릴지
  chosen_reading: ‘참되니’로 유지하여, 하나님의 처분의 옳음은 문맥이 드러내게 합니다.
  alternative_readings:
  - ‘의롭습니다’
  - ‘옳습니다’
  rationale: 원문 형용사는 ἀληθιναί이며, 본문은 하나님 판단의 정당성을 고백하지만 그 말을 번역이 미리 해석해 버리기보다 원어의 표현을 보존하는 편이 더 충실합니다.
  doctrine_reference: 원문 우선 원칙; 번역이 해석을 과잉 선행하지 않도록 함.
- issue: 조상들의 죄를 유전적 책임으로 확장할지, 공동체적 고백으로 둘지
  chosen_reading: ‘내 조상들의 죄들’로 유지하여 공동체적·가문적 죄의 고백으로 읽습니다.
  alternative_readings:
  - ‘우리 조상들의 죄’
  - ‘조상에게서 물려받은 죄책’
  rationale: 헬라어는 ‘내 죄들과 내 조상들의 죄들’을 직접 말할 뿐이므로, 유전된 죄책 교리를 본문 밖에서 덧붙이지 않고 공동체적 회개의 언어로 남겼습니다.
  doctrine_reference: 본문이 말하지 않는 교리적 확장을 피함.
