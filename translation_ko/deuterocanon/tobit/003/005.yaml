  rationale: 비문인 첫 문장을 ‘심판은 많고 참되며 … 행하시는 일에서도 그러합니다’로 고쳐, 심판의 참됨과 죄에 관련하여 화자에게 행하시는 하나님의 처분을 연결했습니다. περί의 의미는 ‘~에 관하여’로 보존하여 인과를 과도하게 확정하지 않았습니다. ‘심판’, ‘계명들’, ‘진리 안에서 살다’를 채택하고 각주 표지를 해당 표현에 직접 배치했습니다.
