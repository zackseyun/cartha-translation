  rationale: 문맥상 인류 전체를 가리키지만, 그리스어의 집합 명사적 감각을 보존하기 위해 다소 문자적인 ‘종족’을 사용했습니다.
- source_word: οὕτω γίγνεται
  english_pob_choice: comes to be in the same way
  chosen_korean: 그와 같은 방식으로 생겨난다는
  alternatives_korean:
  - 같은 방식으로 존재하게 된다는
  - 이와 같이 생겨난다는
  lexicon: LSJ
  rationale: 하나님의 창조 방식과 인간의 기원 사이의 유비를 분명히 드러내기 위해, ‘comes to be’의 생성 의미를 살렸습니다.
theological_decisions:
- issue: οὐκ ἐξ ὄντων의 신학적 함의
  chosen_reading: ‘있는 것들로부터가 아니라’로 옮겨, 무로부터의 창조를 암시하되 본문 자체는 그대로 유지했습니다.
  alternative_readings:
  - 무에서
  - 무로부터가 아니라
  rationale: 그리스어는 문자적으로 ‘존재하는 것들로부터가 아니라’라고 말하므로, 도출되는 교리를 번역어로 선취하기보다 본문 표현을 보존하는 것이 source-grounded에 더 적합합니다.
  doctrine_reference: 창조론; 본문 직역 우선 원칙
