  text: I beg you[a], child, look at heaven and earth and see everything in them, and know that God made them not out of existing things, and that the human race comes to be in the same way.
  footnotes:
  - marker: a
    text: Or, more interpretively, 'out of nothing.' The Greek literally says 'not out of existing things.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 당신에게 간청합니다, 아이야, 하늘과 땅과 그 안의 모든 것을 올려다보고 보며, 하나님께서 그것들을 있는 것들로부터가 아니라 만드셨고, 사람의 종족도 그와 같은 방식으로 생겨난다는 것을 알게 되십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘있는 것들로부터가 아니라’입니다. 이는 후대 교리용어로는 ‘무에서’라는 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀξιῶ σε
