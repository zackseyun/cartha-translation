  lexicon: LSJ
  rationale: 여기서는 우주적 창조 질서의 대조항으로서의 하늘이므로, 종교적 관용구보다 자연스러운 표준어를 택했습니다.
- source_word: οὐκ ἐξ ὄντων
  english_pob_choice: not out of existing things
  chosen_korean: 있는 것들로부터가 아니라
  alternatives_korean:
  - 존재하는 것들로부터가 아니라
