  rationale: 그리스어의 직설적 표현을 살려, 후대 신학용어로 압축하지 않고 ‘existing things’라는 문구를 한국어로 드러냈습니다.
- source_word: τὸ τῶν ἀνθρώπων γένος
  english_pob_choice: the human race
