  source_fidelity: 수정안은 ὑφορώμενος를 ‘알아차리고’로 옮겨, 초안의 ‘듣고 있었는데’가 더했던 청각 행위를 피합니다. 또한 ἐποιεῖτο τὴν παράκλησιν과 διʼ ὅρκων ἐπίστου의 대조를 ‘말로 권함’과 ‘맹세로 확언함’으로 분명히 하며, 조건절과 안티오코스의 약속 내용도 원문의 구조대로 유지합니다.
