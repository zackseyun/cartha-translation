  terminology: ‘조상들의 전통’은 τῶν πατρίων의 조상 전승·관습이라는 폭을 보존합니다. μακαριστόν은 이 문맥에서 왕이 약속하는 번영과 호의의 성격을 지니지만, 본문의 어휘적 의미를 보존하여 ‘복된 사람’으로 유지했습니다. ‘친구’는 궁정의 칭호일 수 있는 여지를 각주로 보존했고, χρείας는 단정적으로 관직만을 뜻하게 하지 않고 ‘직무’로 옮겼습니다.
