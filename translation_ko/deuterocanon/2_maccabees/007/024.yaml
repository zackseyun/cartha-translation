base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/024.yaml
  text: But Antiochus[a], thinking that he was being despised and taking note of the reproachful tone, while the youngest was still alive, not only urged him with words, but also assured him with oaths that he would both make him rich and make him blessed, if he turned away from the traditions of his fathers[c][b], and that he would have him as a friend and entrust him with offices.
  footnotes:
  - marker: a
    text: Or 'the insulting voice' or 'the reproaching speech'; the Greek is literally 'the reproaching voice.'
    reason: lexical_alternative
  - marker: b
    text: '''Friend'' may also carry a court title sense: a royal associate or favored official.'
    reason: cultural_note
  - marker: c
    text: Or 'entrust him with responsibilities' or 'appoint him to offices'; the Greek refers to duties or positions entrusted by the king.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 안티오코스는 자신이 멸시받고 있다고 생각하며, 그 모욕적인 음성을 듣고 있었는데 — 막내가 아직 살아 있는 동안 — 말로만이 아니라 맹세까지 하며 그를 설득하여, 그가 조상들의 전통에서 돌아서면 곧 그를 부유하게 하고 복된 사람으로 만들어 주며, 그를 친구로 삼고 직무도 맡겨 주겠다고 했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모욕적인 음성’ 또는 ‘꾸짖는 말소리’로도 옮길 수 있습니다. 헬라어는 문자적으로 ‘모욕하는 음성’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘친구’는 궁정에서 왕의 측근이나 특별한 지위를 가리킬 수 있습니다.
    reason: cultural_note
  - marker: c
    text: ‘직무’를 ‘책임’ 또는 ‘관직’으로 옮길 수도 있습니다. 헬라어는 왕이 맡기는 업무나 지위를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰόμενος καταφρονεῖσθαι
  english_pob_choice: thinking that he was being despised
  chosen_korean: 자신이 멸시받고 있다고 생각하며
  alternatives_korean:
  - 자신이 업신여김을 받고 있다고 생각하며
  - 자신이 깔보임을 당하고 있다고 생각하며
  lexicon: LSJ
  rationale: 안티오코스의 주관적 판단을 드러내는 표현이므로, 현재형 감각의 자연스러운 한국어로 옮기되 ‘멸시’로 왕의 수치심을 살렸습니다.
- source_word: τὴν ὀνειδίζουσαν ... φωνήν
  english_pob_choice: the reproachful tone
  chosen_korean: 그 모욕적인 음성
  alternatives_korean:
  - 그 꾸짖는 음성
  - 그 조롱하는 말소리
  lexicon: LSJ
  rationale: 직역하면 ‘책망하는/모욕하는 음성’이므로, 의미를 살리면서도 한국어에서 어색하지 않은 ‘모욕적인 음성’으로 옮겼습니다.
- source_word: ἐποιεῖτο τὴν παράκλησιν
  english_pob_choice: urged him with words
  chosen_korean: 말로만이 아니라 ... 설득하여
  alternatives_korean:
  - 말로 그를 권하여
  - 말로 그를 간청하여
  lexicon: LSJ
  rationale: 이 구문은 단순한 말이 아니라 간청·권유의 행위를 가리키므로, 앞의 ‘말로만이 아니라’와 결합해 의미를 드러냈습니다.
- source_word: πλουτιεῖν
  english_pob_choice: make him rich
  chosen_korean: 그를 부유하게 하고
  alternatives_korean:
  - 그를 부요하게 하고
  - 그를 부자로 만들고
  lexicon: LSJ
  rationale: 물질적 보상 약속이므로 직설적으로 ‘부유하게 하다’로 옮겼습니다.
- source_word: μακαριστὸν ποιήσειν
  english_pob_choice: make him blessed
  chosen_korean: 복된 사람으로 만들어 주며
  alternatives_korean:
  - 행복한 사람으로 만들어 주며
  - 복을 받은 사람으로 만들어 주며
  - 축복받은 사람으로 만들어 주며
  lexicon: LSJ
  rationale: 이 단어는 문맥상 종교적 ‘복되다’보다 왕실이 주는 호의와 번영을 가리킬 수 있으므로, 너무 신학화하지 않되 한국어 의미도 살려 ‘복된 사람’으로 처리했습니다.
- source_word: ἀπὸ τῶν πατρίων
  english_pob_choice: from the traditions of his fathers
  chosen_korean: 조상들의 전통에서
  alternatives_korean:
  - 조상들의 관습에서
  - 조상들의 유전에서
  lexicon: LSJ
  rationale: 가문의/조상의 전승을 뜻하는 표현으로, 한국어 성경 독자가 이해하기 쉬운 ‘조상들의 전통’이 적절합니다.
- source_word: φίλον ἕξειν
  english_pob_choice: have him as a friend
  chosen_korean: 그를 친구로 삼고
  alternatives_korean:
  - 그를 벗으로 삼고
  - 그를 측근으로 삼고
  lexicon: LSJ
  rationale: 헬라-헬레니즘 궁정어에서 ‘친구’가 관직적 의미를 가질 수 있으나, 본문은 그 다의성을 유지해야 하므로 기본 의미를 살렸습니다.
- source_word: χρείας ἐμπιστεύσειν
  english_pob_choice: entrust him with offices
  chosen_korean: 직무도 맡겨 주겠다고
  alternatives_korean:
  - 책무도 맡겨 주겠다고
  - 관직도 맡겨 주겠다고
  lexicon: LSJ
  rationale: ‘필요/업무를 맡기다’의 궁정적 의미를 살려, 공적 책임을 뜻하는 ‘직무’로 옮겼습니다.
theological_decisions:
- issue: ἔτι τοῦ νεωτέρου περιόντος의 시간·상황 표지
  chosen_reading: 막내가 아직 살아 있는 동안
  alternative_readings:
  - 막내가 아직 살아남아 있는 동안
  - 막내가 아직 남아 있는 동안
  rationale: 순교 장면의 긴장감을 유지하면서, 동시상황을 자연스럽게 드러내는 번역이 가장 적절합니다.
  doctrine_reference: translation philosophy §§1, 5
- issue: μακαριστὸν ποιήσειν의 의미 범위
  chosen_reading: 복된 사람으로 만들어 주며
  alternative_readings:
  - 축복받은 사람으로 만들어 주며
  - 행복한 사람으로 만들어 주며
  - 부럽도록 해 주며
  rationale: 여기서는 신적 축복 선언이 아니라 왕의 회유 약속이므로, 과도한 신학적 전이를 피하면서도 원문의 긍정적 상태를 반영했습니다.
  doctrine_reference: translation philosophy §§1, 6
