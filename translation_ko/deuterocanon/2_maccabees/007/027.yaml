  - 조상의 말로
  lexicon: LSJ
  rationale: 가족/민족의 고유한 언어를 가리키는 뜻을 살리되, 지나치게 문자적인 '조상의 말로'보다 현재적이고 자연스러운 표현을 택했습니다.
- source_word: ἐλέησόν με
  english_pob_choice: have mercy on me
  chosen_korean: 불쌍히 여겨다오
  alternatives_korean:
