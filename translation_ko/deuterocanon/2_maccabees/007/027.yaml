  lexicon: LSJ
  rationale: 폭군을 향한 경멸적 조롱의 뉘앙스를 분명하게 살리면서도 현대 한국어에서 무리 없는 표현을 선택했습니다.
- source_word: τῇ πατρίᾳ φωνῇ
  english_pob_choice: in her native tongue
  chosen_korean: 자기네 말로
  alternatives_korean:
