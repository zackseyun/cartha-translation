  - 자비를 베풀어다오
  lexicon: BDAG
  rationale: 어머니가 아들에게 하는 탄원이라는 정서를 고려해, 간구의 강도를 살리면서도 한국어 문맥에 맞는 애원형으로 옮겼습니다.
- source_word: τροφοφορήσασαν
  english_pob_choice: cared for you / provided for you
  chosen_korean: 돌보아 준
  alternatives_korean:
  - 먹여 살린
  - 부양한
  lexicon: LSJ
  rationale: 양육을 넘어 먹이고 돌보며 부양한 지속적 보살핌을 포괄하는 말로 처리해, 문맥의 반복을 피하면서도 의미를 보존했습니다.
theological_decisions:
- issue: 어머니의 직접 호소인 ἐλέησόν με의 정서와 어조
  chosen_reading: 반말이 아닌 간청형 존대인 「불쌍히 여겨다오」로 처리했습니다.
  alternative_readings:
  - 「나를 불쌍히 여기소서」
  - 「나를 불쌍히 여겨 주십시오」
  rationale: 본문은 아들에게 절박하게 매달리는 어머니의 탄원입니다. 고어체를 피하면서도 호소의 절실함과 직접성을 유지하기 위해 간청형을 사용했습니다.
  doctrine_reference: Translation philosophy §1, §6
