  - 몸을 숙여
  lexicon: LSJ
  rationale: 상대에게 가까이 몸을 기울이는 물리적 동작을 자연스러운 한국어로 옮기되, 의도나 감정을 과잉 해석하지 않았습니다.
- source_word: χλενάσασα
