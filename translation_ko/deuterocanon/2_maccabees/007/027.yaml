base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/027.yaml
  text: 'But bending down to him[a], and mocking the cruel tyrant, she spoke in her native tongue as follows: “My son, have mercy on me, who carried you in the womb for nine months, nursed you for three years, raised you, brought you to this age[b], and cared for you.”'
  footnotes:
  - marker: a
    text: Or “in her ancestral language” / “in the language of her fathers.” The Greek literally refers to the family’s native or inherited speech.
    reason: lexical_alternative
  - marker: b
    text: Or “breastfed you for three years.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그에게 몸을 굽혀 잔혹한 폭군을 조롱하며, 그녀는 자기네 말로 이렇게 말했습니다. 「내 아들아, 내가 너를 아홉 달 동안 태 안에 품었고, 세 해 동안 젖을 먹였으며, 너를 길러 이 나이에 이르게 하고, 너를 돌보아 준 나를 불쌍히 여겨다오.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “자기네 고유한 말로”, 곧 가족에게 전해 내려오는 언어로.
    reason: lexical_alternative
  - marker: b
    text: 또는 “너를 세 해 동안 젖먹였고”로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκύψασα
  english_pob_choice: bending down
  chosen_korean: 몸을 굽혀
  alternatives_korean:
