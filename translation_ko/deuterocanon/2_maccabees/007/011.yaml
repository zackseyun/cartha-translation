  text: And he said bravely, “From heaven I received these, and for his laws I disregard them, and from him I hope to receive them back again.”
translation:
  language: ko
  text: 그리고 그는 담대하게 말했습니다. 「이것들은 하늘로부터 내가 받았고, 그의 율법들 때문에 나는 이것들을 하찮게 여기며, 그리고 그분에게서 나는 이것들을 다시 돌려받기를 바랍니다」.
  philosophy: formal
lexical_decisions:
- source_word: γενναίως
  english_pob_choice: bravely
  chosen_korean: 담대하게
  alternatives_korean:
  - 용감하게
  - 굳세게
  lexicon: γενναίως
  rationale: 행동의 기개와 두려움 없는 태도를 드러내는 부사로, 단순한 감정 묘사보다 공개적·신앙적 결단의 뉘앙스를 살리기 위해 ‘담대하게’로 옮겼습니다.
- source_word: Ἐξ οὐρανοῦ
  english_pob_choice: From heaven
  chosen_korean: 하늘로부터
  alternatives_korean:
  - 하늘에서
  - 하늘로부터
  lexicon: οὐρανός
  rationale: 출처를 나타내는 ἐξ의 방향성을 살려 ‘하늘로부터’로 옮겨, 선물의 근원이 위로부터 왔음을 분명히 했습니다.
- source_word: νόμους
  english_pob_choice: laws
  chosen_korean: 율법들
  alternatives_korean:
  - 법들
  - 계명들
  lexicon: νόμος
  rationale: 문맥상 유다 신앙에 대한 왕의 강요와 순교자의 충돌이므로, 일반적 ‘법’보다 토라적 함의를 지닌 ‘율법들’이 더 적절합니다.
- source_word: ὑπερορῶ
  english_pob_choice: disregard
  chosen_korean: 하찮게 여기며
  alternatives_korean:
  - 무시하며
  - 경멸하며
  lexicon: ὑπεροράω
  rationale: 단순히 ‘안 본다’가 아니라 가치 낮게 여겨 내려놓는 태도를 뜻하므로, 소유물을 위해 신앙을 저버리지 않는 결단을 드러내는 ‘하찮게 여기며’를 택했습니다.
- source_word: κομίσεσθαι
  english_pob_choice: to receive back again
  chosen_korean: 다시 돌려받기를 바랍니다
  alternatives_korean:
  - 되돌려받기를 바랍니다
  - 돌려받을 것을 기대합니다
  lexicon: κομίζω
  rationale: 미래적 기대를 담은 중간태 의미를 살려, 단순한 수령보다 회복·반환의 뉘앙스가 드러나는 표현으로 옮겼습니다.
theological_decisions:
- issue: 소유물의 기원과 회복
  chosen_reading: 생애의 선물들은 하나님께로부터 온 것이며, 순교자는 그것들을 율법보다 아래에 두고 결국 하나님께서 다시 돌려주실 것을 기대합니다.
  alternative_readings:
  - 단순한 재산 상실과 보상에 대한 윤리적 발언
  - 죽음 이후의 개인적 보상 기대만을 강조하는 읽기
  rationale: ‘하늘로부터’, ‘그의 율법들’, ‘그분에게서’의 병렬은 소유의 기원과 신앙적 우선순위를 함께 말하므로, 물질 상실을 넘어 하나님 주권 아래의 회복 기대를 보존했습니다.
  doctrine_reference: 순교 신학 / 섭리 / 부활 소망
