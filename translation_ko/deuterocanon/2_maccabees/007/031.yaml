translation:
  language: ko
  text: 그러나 너는 모든 악의 창시자가 되어 히브리 사람들에 맞섰으니, 하나님의 손을 결코 피하지 못할 것이다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 악의 고안자’ 혹은 ‘모든 악의 창시자’.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  english_pob_choice: But you
  chosen_korean: 그러나 너는
  alternatives_korean:
  - 그리고 너는
  - 그런데 너는
  lexicon: LSJ
  rationale: δέ의 대조를 살려 앞선 말과 대비되는 직접적 책망으로 옮겼습니다.
- source_word: πάσης κακίας
  english_pob_choice: of every evil
  chosen_korean: 모든 악의
  alternatives_korean:
  - 온갖 악의
  - 모든 악행의
  lexicon: LSJ
  rationale: κακία의 넓은 의미를 살려 ‘악’으로 번역하고, πλήρης한 비난의 강도를 유지했습니다.
- source_word: εὑρετὴς γενόμενος
  english_pob_choice: having become the inventor
  chosen_korean: 창시자가 되어
  alternatives_korean:
  - 고안자가 되어
  - 발명자가 되어
  - 꾸민 자가 되어
  lexicon: LSJ
  rationale: εὑρετής의 ‘고안/창안/발명’ 계열 의미를 한국어에서 가장 자연스럽게 드러내는 말로 ‘창시자’를 택해, 악을 스스로 만들어 낸 책임을 강조했습니다.
- source_word: εἰς τοὺς Ἑβραίους
  english_pob_choice: against the Hebrews
  chosen_korean: 히브리 사람들에 맞섰으니
  alternatives_korean:
  - 히브리 사람들을 향해
  - 히브리 사람들에 대하여
  lexicon: LSJ
  rationale: 문맥상 적대적 방향을 나타내는 εἰς를 ‘~에 맞서다’로 옮겨 공격성과 대립을 드러냈습니다. Ἑβραίους는 POB의 구분을 따라 ‘히브리 사람들’로 보존했습니다.
- source_word: οὐ μὴ διαφύγῃς
  english_pob_choice: will certainly not escape
  chosen_korean: 결코 피하지 못할 것이다
  alternatives_korean:
  - 반드시 도망하지 못할 것이다
  - 결코 벗어나지 못할 것이다
  lexicon: LSJ
  rationale: οὐ μή의 강한 부정을 한국어의 ‘결코’로 살리고, 심판의 맥락에 맞게 ‘피하다/벗어나다’의 의미를 자연스럽게 담았습니다.
- source_word: τὰς χεῖρας τοῦ θεοῦ
  english_pob_choice: the hands of God
  chosen_korean: 하나님의 손
  alternatives_korean:
  - 하나님의 손들
  - 하나님의 손길
  lexicon: LSJ
  rationale: 그리스어의 복수형은 유지하되 한국어 관용상 단수로 자연화하여, 하나님의 직접적 심판 행위를 구체적으로 보존했습니다.
theological_decisions:
- issue: Ἑβραίους의 민족/집단 명칭 보존
  chosen_reading: ‘히브리 사람들’로 유지했습니다.
  alternative_readings:
  - ‘유대인들’로 일반화
  - ‘히브리인들’로 음역
  rationale: 원문이 συγκεκριμένα Ἑβραίους를 사용하므로, 더 익숙한 ‘유대인들’로 바꾸지 않고 본래 지칭을 보존했습니다.
  doctrine_reference: translation philosophy §1
- issue: 하나님의 심판을 의인화한 표현
  chosen_reading: ‘하나님의 손’이라는 구체적 표현을 유지했습니다.
  alternative_readings:
  - ‘하나님의 권능’
  - ‘하나님의 심판’
  rationale: 원문의 신체 은유를 추상어로 바꾸지 않아 심판의 직접성과 긴장감을 살렸습니다.
  doctrine_reference: translation philosophy §§1, 3, 6
