base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/014.yaml
  text: 'And when he was about to die[a], he said this: “It is preferable, when dying at the hands of men, to await the hopes given by God—that one will be raised again by him[b]. But for you there will be no resurrection to life.”'
  footnotes:
  - marker: a
    text: Or, 'It is better, when being put to death by men, to hope for resurrection again from God.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'no resurrection to life' may imply exclusion from a blessed resurrection, rather than explicitly denying every kind of resurrection.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 죽음이 임박하자 그는 이렇게 말했습니다. 「사람들에게서 죽임을 당하는 때에 하나님께서 주시는 소망들—곧 그분에 의해 다시 살아나게 될 것이라는 소망들—을 기다리는 것이 더 낫습니다. 그러나 당신에게는 생명에 이르는 부활이 없을 것입니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람들에게서 죽임을 당할 때 하나님에게서 다시 부활할 소망을 바라보는 것이 더 낫습니다.’
    reason: alternative_reading
  - marker: b
    text: ‘생명에 이르는 부활이 없다’는 표현은 모든 종류의 부활을 전면 부정하기보다, 복된 부활에서 제외됨을 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: γενόμενος πρὸς τῷ τελευτᾷν
  english_pob_choice: when he was about to die
  chosen_korean: 죽음이 임박하자
  alternatives_korean:
  - 죽으려는 참에
  - 죽음에 이르러
  lexicon: LSJ
  rationale: πρὸς τῷ + 부정사는 임박성을 나타내므로, 현대 한국어에서 자연스러운 ‘죽음이 임박하다’로 옮겨 시간적 긴박함을 살렸습니다.
- source_word: Αἱρετὸν
  english_pob_choice: It is preferable
  chosen_korean: 더 낫습니다
  alternatives_korean:
  - 선택할 만합니다
  - 더 바람직합니다
  lexicon: LSJ
  rationale: 판단·가치 비교를 담는 형용사로서, 한국어에서는 간결한 비교 표현인 ‘더 낫습니다’가 문맥과 구어적 생동감을 함께 살립니다.
- source_word: μεταλλάσσοντας ἀπὸ ἀνθρώπων
  english_pob_choice: when dying at the hands of men
  chosen_korean: 사람들에게서 죽임을 당하는 때에
  alternatives_korean:
  - 사람들로 말미암아 목숨을 잃는 때에
  - 사람들의 손에 죽을 때에
  lexicon: LSJ
  rationale: 인간의 가해 행위를 분명히 하되, 순교 문맥을 과도하게 해설하지 않도록 직역과 관용을 절충했습니다.
- source_word: τὰς ὑπὸ τοῦ θεοῦ προσδοκᾷν ἐλπίδας
  english_pob_choice: to await the hopes given by God
  chosen_korean: 하나님께서 주시는 소망들—
  alternatives_korean:
  - 하나님께서 주시는 소망을
  - 하나님에게서 오는 소망들을
  lexicon: LSJ
  rationale: ὑπὸ τοῦ θεοῦ를 원인·출처로 보아 ‘하나님께서 주시는’으로 옮겼고, 복수형 ἐλπίδας는 ‘소망들’로 반영했습니다.
- source_word: πάλιν ἀναστήσεσθαι ὑπʼ αὐτοῦ
  english_pob_choice: that one will be raised again by him
  chosen_korean: 곧 그분에 의해 다시 살아나게 될 것이라는 소망들
  alternatives_korean:
  - 그분에 의해 다시 일으켜지리라는 것
  - 그분에 의해 다시 부활하게 될 것이라는 것
  lexicon: LSJ
  rationale: 수동적 미래 부정사를 한국어에서 자연스럽게 풀어, 하나님/그분의 주도적 행위를 드러내는 ‘다시 살아나게 되다’로 옮겼습니다.
- source_word: ἀνάστασις εἰς ζωὴν
  english_pob_choice: resurrection to life
  chosen_korean: 생명에 이르는 부활
  alternatives_korean:
  - 생명으로의 부활
  - 삶에 이르는 부활
  lexicon: LSJ
  rationale: εἰς ζωὴν의 방향성을 살려 ‘생명에 이르는’으로 옮기되, 종말론적 울림을 가진 ‘부활’은 그대로 유지했습니다.
theological_decisions:
- issue: 순교자의 부활 소망과 폭군에게 선포되는 생명 부활의 부재
  chosen_reading: 본문은 하나님께서 순교자를 다시 살리실 것이라는 소망을 affirm하면서, 상대방에게는 ‘생명에 이르는 부활’이 없다고 단정합니다.
  alternative_readings:
  - 상대방에게는 어떤 부활도 없다는 뜻
  - 생명에 이르는 부활에만 참여하지 못한다는 뜻
  rationale: εἰς ζωὴν이 ἀνάστασις를 수식하므로, ‘부활’ 전체를 일반화하지 않고 생명에 이르는 부활이라는 한정을 보존했습니다.
  doctrine_reference: 종말론적 한정 표현을 보존하여 해석의 긴장을 유지합니다.
