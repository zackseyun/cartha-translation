  to: 그러나 그 어머니는 아들들을 하나하나 조상의 언어로[a] 격려하였습니다. 그는 고귀한 정신으로 가득 차서, 자신의 여성적인 사고를 남성적인 용기로 북돋우며 그들에게 말하였습니다[b].
  rationale: 여성인 어머니를 정확히 지시하도록 주어를 고쳤고, 문맥상 아들들을 각각 격려했다는 뜻을 분명히 했습니다. 원문의 성별화된 대비를 완화하지 않고 보존하되, 소유 관계와 분사구문의 연결을 현대 표준 한국어로 자연스럽게 다듬었습니다. 각주 표지도 해당 어구 뒤에 배치했습니다.
