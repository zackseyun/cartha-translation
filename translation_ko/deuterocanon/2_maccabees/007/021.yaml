  yaml_path: translation/deuterocanon/2_maccabees/007/021.yaml
  text: And she encouraged each one of them in the language of their fathers[a], filled with a noble spirit, and, stirring her womanly reasoning with manly courage, she said to them[b],
  footnotes:
  - marker: a
    text: Or 'in the ancestral tongue' or 'in their native language.' The Greek literally refers to the paternal or ancestral speech.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek uses a deliberate gendered contrast: literally, ''having stirred the female reasoning with a male courage/spirit.'''
    reason: cultural_note
translation:
  language: ko
  text: 그러나 그는 각 사람을 조상들의 언어로 권면하였는데, 고귀한 정신으로 가득 차 있었고, 여성적인 생각을 남성적인 용기로 일깨운 채 그들에게 말하였습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘조상 전승의 언어로’, ‘자기 조상의 언어로’로도 옮길 수 있습니다. 그리스어는 문자적으로 ‘조상들의 말’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 의도적으로 ‘여성적인 사고’를 ‘남성적인 용기’로 일깨운다는 성별 대비를 사용합니다.
    reason: cultural_note
lexical_decisions:
- source_word: παρεκάλει
  english_pob_choice: encouraged
  chosen_korean: 권면하였는데
  alternatives_korean:
  - 격려하였는데
  - 권하였는데
  - 타일렀는데
  lexicon: BDAG
  rationale: 순교 문맥에서 단순 위로보다 믿음의 견고함을 북돋우는 뜻이 강하므로, 합쇼체에서 자연스럽고도 강한 ‘권면하다’를 선택했습니다.
- source_word: τῇ πατρίῳ φωνῇ
  english_pob_choice: in the language of their fathers
  chosen_korean: 조상들의 언어로
  alternatives_korean:
  - 조상들의 말로
  - 선조의 언어로
  - 본래의 언어로
  lexicon: LSJ
  rationale: πατρῳος/πατρίος는 ‘부계의, 조상들의’라는 뉘앙스를 가지므로, 단순한 ‘모국어’보다 혈통·전승의 뉘앙스를 살린 ‘조상들의 언어’가 적절합니다.
- source_word: γενναίῳ πεπληρωμένη φρονήματι
  english_pob_choice: filled with a noble spirit
  chosen_korean: 고귀한 정신으로 가득 차 있었고
  alternatives_korean:
  - 고귀한 결단으로 가득 차 있었고
  - 고상한 마음으로 가득 차 있었고
  - 용기 있는 정신으로 충만하였고
  lexicon: LSJ
  rationale: φρόνημα는 단순한 감정보다 ‘마음가짐, 정신, 결의’를 가리키므로, ‘고귀한 정신’이 형용사 γενναίῳ의 품격을 가장 간결하게 반영합니다.
- source_word: τὸν θῆλυν λογισμὸν ἄρσενι θυμῷ διεγείρασα
  english_pob_choice: stirring her womanly reasoning with manly courage
  chosen_korean: 여성적인 생각을 남성적인 용기로 일깨운 채
  alternatives_korean:
  - 여성적인 이성을 남성적인 용기로 일으킨 채
  - 여성적인 사고를 남성적인 기개로 북돋운 채
  - 여인의 생각을 남자의 용기로 자극한 채
  lexicon: LSJ
  rationale: 본문의 의도적인 성별 대비를 유지하면서도 현대 한국어에서 지나치게 직역투가 되지 않도록 ‘생각/용기’로 옮겼습니다. ‘일깨운 채’는 분사 구조를 자연스럽게 살립니다.
- source_word: λέγουσα πρὸς αὐτούς
  english_pob_choice: she said to them
  chosen_korean: 그들에게 말하였습니다
  alternatives_korean:
  - 그들에게 말했습니다
  - 그들에게 이르렀습니다
  - 그들에게 말하였는데
  lexicon: BDAG
  rationale: 직접화법 도입의 표준 서술로, 앞선 분사구와 이어지는 자연스러운 한국어 문장 흐름을 위해 ‘말하였습니다’를 택했습니다.
theological_decisions:
- issue: 본문의 성별 대비 수사 유지
  chosen_reading: ‘여성적인 생각’과 ‘남성적인 용기’의 대비를 그대로 살렸습니다.
  alternative_readings:
  - 성별 대비를 지워 ‘약한 생각’과 ‘강한 용기’로 완화함
  - ‘어머니다운 마음’과 ‘굳센 결단’으로 정서화함
  rationale: 그리스어는 θῆλυς와 ἄρσην의 의도적 대비를 사용하므로, 이를 완화하면 본문의 수사와 강조점이 사라집니다. 성별-정확 번역 원칙에 따라 대비를 보존했습니다.
  doctrine_reference: DOCTRINE.md §4 Gender-accurate over gender-neutral
