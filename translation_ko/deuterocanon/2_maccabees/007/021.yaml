  source_fidelity: 주어가 여성 단수 분사들(πεπληρωμένη, διεγείρασα)에 의해 분명히 어머니인데, 초안의 ‘그는’은 이를 남성으로 바꾸므로 수정이 필요합니다. 또한 ἕκαστον은 문맥상 어머니가 아들들을 한 사람씩 격려한 것을 가리키므로 ‘아들들을 하나하나’가 더 정확합니다. 성별 대비 수사는 보존해야 합니다.
  naturalness: ‘여성적인 생각을 남성적인 용기로 일깨운 채’는 소유 관계가 드러나지 않고 결합도 다소 어색합니다. ‘자신의 여성적인 사고를 남성적인 용기로 북돋우며’는 원문의 비유적 수사와 분사 관계를 유지하면서 현대 한국어로 더 자연스럽습니다.
