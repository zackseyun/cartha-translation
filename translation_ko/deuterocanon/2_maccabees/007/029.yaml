base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/029.yaml
  text: Do not fear this executioner[a], but, becoming worthy of your brothers, accept death[c][b], so that in mercy I may receive you back together with your brothers.
  footnotes:
  - marker: a
    text: Or 'this torturer.' The Greek δήμιος more precisely denotes an executioner, though the broader context includes torture.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'in mercy' likely refers to divine mercy, but God is not explicitly named in the Greek of this clause.
    reason: alternative_reading
  - marker: c
    text: Or 'I may recover you' or 'I may receive you.' The wording expresses the mother's hope of being reunited with her son together with his brothers.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 사형집행인을 두려워하지 마십시오. 그러나 형제들에 걸맞게 되어 죽음을 받아들이십시오. 그러면 저는 자비 가운데서 형제들과 함께 당신을 다시 받아들이겠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사형집행인’은 δήμιος의 기본 의미를 따른 번역입니다. 문맥상 고문하는 자를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘자비 가운데서’는 본문에 명시된 표현을 살린 것이며, 하나님의 자비를 분명히 적시한 것은 아닙니다.
    reason: theological_note
  - marker: c
    text: ‘다시 받아들이겠습니다’는 ‘다시 받겠습니다’ 또는 ‘다시 맞이하겠습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ φοβηθῇς
  english_pob_choice: Do not fear
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 무서워하지 마십시오
  - 두려워 말십시오
  lexicon: BDAG
  rationale: 금지형의 직접 명령을 자연스럽고 합쇼체로 옮겼습니다.
- source_word: τὸν δήμιον τοῦτον
  english_pob_choice: this executioner
  chosen_korean: 이 사형집행인
  alternatives_korean:
  - 이 집행인
  - 이 고문하는 자
  lexicon: LSJ
  rationale: δήμιος의 기본적 의미인 ‘사형집행인’을 살리되, 문맥상의 폭력성을 흐리지 않도록 직역에 가깝게 옮겼습니다.
- source_word: τῶν ἀδελφῶν σου ἄξιος γενόμενος
  english_pob_choice: becoming worthy of your brothers
  chosen_korean: 형제들에 걸맞게 되어
  alternatives_korean:
  - 형제들에 합당하게 되어
  - 형제들에게 어울리게 되어
  lexicon: BDAG
  rationale: ἄξιος의 ‘가치/합당함’과 γενόμενος의 진행적 뉘앙스를 함께 살려, 결과 상태를 나타내는 한국어 표현으로 옮겼습니다.
- source_word: ἐπίδεξαι τὸν θάνατον
  english_pob_choice: accept death
  chosen_korean: 죽음을 받아들이십시오
  alternatives_korean:
  - 죽음을 받으십시오
  - 죽음을 감수하십시오
  lexicon: LSJ
  rationale: ἐπιδέχομαι의 ‘받아들이다/받다’ 의미를 살리면서, 순교의 수용이라는 문맥을 한국어로 분명하게 드러냈습니다.
- source_word: ἐν τῷ ἐλέει
  english_pob_choice: in mercy
  chosen_korean: 자비 가운데서
  alternatives_korean:
  - 자비 안에서
  - 자비로
  lexicon: BDAG
  rationale: 명시적 주어 없이 제시된 ἔλεος를 그대로 유지하되, 한국어에서는 관계의 장을 나타내는 표현으로 자연스럽게 살렸습니다.
- source_word: κομίσωμαί σε
  english_pob_choice: I may receive you back
  chosen_korean: 당신을 다시 받아들이겠습니다
  alternatives_korean:
  - 당신을 다시 받겠습니다
  - 당신을 다시 맞이하겠습니다
  lexicon: BDAG
  rationale: κομίζω의 ‘되돌려 받다/다시 받다’ 의미와 재회 희망을 살리면서, 모성적 어조를 한국어로 자연스럽게 표현했습니다.
theological_decisions:
- issue: ‘ἐν τῷ ἐλέει’에서 하나님의 자비를 명시할지 여부
  chosen_reading: ‘자비 가운데서’로 두고 하나님을 본문에 추가하지 않았습니다.
  alternative_readings:
  - 하나님의 자비 가운데서
  - 하나님의 자비로
  rationale: 문맥상 신적 자비가 강하게 암시되지만, 그리스어 본문은 여기서 하나님을 직접 언급하지 않으므로 그 긴장을 유지했습니다.
  doctrine_reference: 원문 우선 원칙과 신학적 긴장 보존
- issue: κομίσωμαί σε의 재회/회복 뉘앙스
  chosen_reading: ‘다시 받아들이겠습니다’로 재회와 회복의 희망을 함께 보존했습니다.
  alternative_readings:
  - 다시 받겠습니다
  - 다시 맞이하겠습니다
  rationale: 순교 후 재결합에 대한 기대를 드러내되, 부활의 기제를 본문 이상으로 특정하지 않도록 했습니다.
  doctrine_reference: 원문 우선 원칙
