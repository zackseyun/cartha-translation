  rationale: 원문 ἀθέμιτος는 ‘불법한/허용되지 않는’의 의미가 중심이므로, 후대의 정결-부정 개념으로 좁히지 않고 법적·종교적 위반을 함께 드러냈습니다.
  doctrine_reference: 원어 우선 원칙; 유대 율법 맥락의 의미 보존
- issue: Violent coercion description
  chosen_reading: 형제들이 단순히 초대받은 것이 아니라 왕에게 강제로 복종을 요구받는 상황으로 옮겼습니다.
  alternative_readings:
  - 먹게 되었습니다
  - 권유받았습니다
  rationale: ἀναγκάζεσθαι의 강제성을 약화시키지 않기 위해 ‘강요받는’으로 처리해, 본문의 폭력성과 순교 서사의 긴장을 보존했습니다.
  doctrine_reference: 서사적 폭력성 및 순교 맥락 보존
