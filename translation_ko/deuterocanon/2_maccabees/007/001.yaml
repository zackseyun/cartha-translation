  yaml_path: translation/deuterocanon/2_maccabees/007/001.yaml
  text: It also happened that seven brothers, along with their mother, having been arrested, were being forced by the king to taste the unlawful flesh of swine, while being tortured with whips and cords.
  footnotes:
  - marker: a
    text: Or 'to partake of'; literally the verb can mean 'to touch,' but here in context it refers to taking the swine's flesh as food.
    reason: lexical_alternative
  - marker: b
    text: '''Cords'' may also be rendered ''thongs'' or, more literally, ''sinews,'' referring to instruments used for torture.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또 이런 일이 있었습니다. 일곱 형제와 그들의 어머니가 붙잡혀, 왕에게 금지된 돼지고기를 맛보도록[a] 강요받고 채찍과 끈으로[b] 고문을 당했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘맛보도록’으로 번역한 ἐφάπτεσθαι는 문자적으로 ‘닿다, 접촉하다’라는 뜻도 있으나, 여기서는 음식으로 취하거나 맛보는 것을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘끈’으로 번역한 νευραῖς는 ‘가죽끈’ 또는 더 문자적으로 ‘힘줄’을 뜻할 수도 있으며, 여기서는 고문 도구를 가리킵니다.
    reason: lexical_alternative
