  source_fidelity: 핵심 사건과 강제성은 대체로 충실하지만, αἰκιζομένους를 단순한 ‘고통을 당하면서’로 옮기면 채찍과 νευραῖς가 명시된 폭력적 학대/고문의 뜻이 약화됩니다. 또한 κρεῶν은 ‘살코기’(기름기 없는 고기)를 뜻하지 않으므로 그 표현은 근거 없이 의미를 좁힙니다.
  naturalness: ‘왕에게서’는 이 수동 구문에서 행위자를 나타내기에 다소 부자연스럽고 ‘왕에게’가 자연스럽습니다. ‘돼지의 불법한 살코기’도 현대 한국어 어법상 어색하므로 ‘금지된 돼지고기’가 명료하고 자연스럽습니다.
  terminology: ‘형제’, ‘채찍’, ‘강요받다’는 적절합니다. ἀθέμιτος는 ‘부정한’으로 신학적으로 좁히지 않고 ‘금지된’으로 옮기는 것이 좋습니다. νευραῖς는 가죽으로 한정할 수 없으므로 본문은 ‘끈’으로 두고 각주에서 대안을 밝혀야 합니다.
