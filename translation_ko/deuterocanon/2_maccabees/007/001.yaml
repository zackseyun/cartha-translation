translation:
  language: ko
  text: 그뿐 아니라 일곱 형제가 어머니와 함께 붙잡혀, 왕에게서 채찍과 가죽끈으로 고통을 당하면서 돼지의 불법한 살코기를 먹도록 강요받는 일이 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘먹도록’은 여기서 ἐφάπτεσθαι의 문맥적 의미를 반영한 번역입니다. 문자적으로는 ‘닿다/접촉하다’의 뜻도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘가죽끈’은 νευραῖς의 가능한 뜻인 ‘끈/가죽끈/힘줄’ 가운데, 고문 도구로서의 의미를 살린 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνέβη δὲ καὶ
  english_pob_choice: It also happened that
  chosen_korean: 그뿐 아니라 … 있었습니다
  alternatives_korean:
  - 또 그런 일이 있었습니다
  - 이렇게 또한 일어났습니다
  lexicon: LSJ
  rationale: 서술 전환과 덧붙임의 뉘앙스를 자연스러운 현대 한국어로 살리되, 과도하게 문자적으로 시작하지 않도록 했습니다.
- source_word: ἑπτὰ ἀδελφοὺς
  english_pob_choice: seven brothers
  chosen_korean: 일곱 형제
  alternatives_korean:
  - 일곱 오빠들
  - 일곱 형제들
  lexicon: LSJ
  rationale: ἀδελφοὺς는 여기서 남자 형제들을 가리키므로, 가장 직접적인 ‘형제’로 옮겼습니다.
- source_word: ἀπὸ τῶν ἀθεμίτων υἱείων κρεῶν
  english_pob_choice: the unlawful flesh of swine
  chosen_korean: 돼지의 불법한 살코기
  alternatives_korean:
  - 돼지고기
  - 돼지의 금지된 고기
  - 돼지의 불법한 고기
  lexicon: LSJ
  rationale: ἀθεμίτων의 법적·종교적 위법성을 살려 ‘불법한’으로 두고, κρεῶν은 음식으로서의 고기이므로 ‘살코기’로 자연스럽게 표현했습니다.
- source_word: ἐφάπτεσθαι
  english_pob_choice: to taste
  chosen_korean: 먹도록
  alternatives_korean:
  - 맛보도록
  - 접촉하도록
  - 취하도록
  lexicon: LSJ
  rationale: 이 동사는 문자적으로는 ‘닿다’지만 여기서는 돼지고기를 음식으로 먹게 강요받는 뜻이므로, 한국어에서는 결과를 분명히 하는 ‘먹도록’이 문맥에 가장 적절합니다.
- source_word: μάστιξιν καὶ νευραῖς
  english_pob_choice: with whips and cords
  chosen_korean: 채찍과 가죽끈으로
  alternatives_korean:
  - 채찍과 끈으로
  - 회초리와 끈으로
  - 채찍과 힘줄끈으로
  lexicon: LSJ
  rationale: μάστιξιν은 ‘채찍’, νευραῖς는 고문 도구로 쓰인 끈/가죽끈의 뜻을 살려, 한국어 독자가 즉시 이해할 수 있게 옮겼습니다.
- source_word: αἰκιζομένους
  english_pob_choice: while being tortured
  chosen_korean: 고통을 당하면서
  alternatives_korean:
  - 고문을 당하면서
  - 혹독한 학대를 받으면서
  lexicon: LSJ
  rationale: 문맥상 고문이 분명하지만, 한국어 본문에서는 지나치게 중복되지 않도록 본문은 완곡하게 두고, 잔혹한 수단은 앞의 도구 표현으로 드러냈습니다.
theological_decisions:
- issue: Jewish dietary violation language
  chosen_reading: ‘불법한’으로 옮겨 율법 위반의 성격을 보존했습니다.
  alternative_readings:
  - ‘부정한’
