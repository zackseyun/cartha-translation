  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 μέλλον ἀποθνήσκειν은 ‘죽게 되어 가면서’보다 ‘죽으려 할 때/죽음을 앞두고’가 더 자연스럽고 정확합니다. Μὴ πλανῶ μάλλον은 행위자를 특정하는 ‘속지 마십시오’보다 판단의 오류를 나타내는 표현이 원문의 압축성과 의미 범위를 더 잘 보존합니다. γάρ 및 죄를 지은 원인 관계도 문장 안에서 더 분명히 연결할 수 있습니다.
  naturalness: 초안은 합쇼체를 유지하지만, ‘죽게 되어 가면서’는 현대 표준어 서술로 다소 부자연스럽습니다. 또한 두 각주 표지를 인용문 끝에 함께 두면 어느 어구를 설명하는지 불분명합니다. 해당 어구 직후에 배치하는 것이 자연스럽고 독자 친화적입니다.
