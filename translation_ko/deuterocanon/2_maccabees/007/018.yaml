base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/018.yaml
  text: After him they brought the sixth[a], and as he was about to die he said, “Do not be deceived; for we are suffering these things because of ourselves, having sinned against our own God[b]. Astonishing things have happened.”
  footnotes:
  - marker: a
    text: Or, “Do not go further astray,” or “Do not be deluded.” The Greek expression is compressed, and πλανῶ may carry the sense of being misled or mistaken.
    reason: lexical_alternative
  - marker: b
    text: Literally, “things worthy of astonishment have happened.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그 뒤에 그들이 여섯째를 데려왔습니다. 그가 죽으려 할 때 말하였습니다. “더는 잘못 판단하지 마십시오.[a] 우리는 우리 하나님께 죄를 지었으므로 우리 자신들 때문에 이런 일을 겪고 있습니다. 경탄할 만한 일들이 일어났습니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 표현은 ‘더는 잘못 판단하지 마십시오’ 외에 ‘더 이상 미혹되지 마십시오’, ‘더 그릇된 길로 가지 마십시오’로도 옮길 수 있습니다. 그리스어 표현이 압축되어 있어 속임을 당함과 잘못 판단함의 뉘앙스가 함께 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘놀라움에 합당한 일들이 일어났습니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τοῦτον ἤγον τὸν ἕκτον
  english_pob_choice: After him they brought the sixth
  chosen_korean: 그 뒤에 그들이 여섯째를 데려왔습니다
  alternatives_korean:
  - 그 다음에 그들이 여섯째를 이끌어 왔습니다
  - 그 뒤에 그들이 여섯째 형제를 데려왔습니다
  lexicon: LSJ
  rationale: ἤγον의 진행상을 살리되, 한국어에서는 서술 흐름상 단순 과거로 자연스럽게 옮겼습니다. τὸν ἕκτον은 문맥상 여섯째 형제를 가리키지만, 본문에 없는 보충은 최소화했습니다.
- source_word: Μὴ πλανῶ μάλλον
  english_pob_choice: Do not be deceived
  chosen_korean: 더 속지 마십시오
  alternatives_korean:
  - 더 이상 미혹되지 마십시오
  - 더 크게 잘못 생각하지 마십시오
  - 더는 속임을 당하지 마십시오
  lexicon: LSJ
  rationale: πλανῶ는 ‘속이다/미혹하다/잘못 이끌다’의 뜻을 가질 수 있어, 여기서는 상대의 판단 착오를 꾸짖는 말로 이해해 ‘속지 마십시오’로 옮겼습니다. μάλλον의 강조를 ‘더’로 반영했습니다.
- source_word: ἡμεῖς γὰρ διʼ ἑαυτοὺς ταῦτα πάσχομεν
  english_pob_choice: for we are suffering these things because of ourselves
  chosen_korean: 우리는 우리 자신 때문에 이런 일들을 겪고 있습니다
  alternatives_korean:
  - 우리는 우리 탓으로 이런 일들을 겪고 있습니다
  - 우리는 우리 자신 때문에 이런 일을 당하고 있습니다
  lexicon: BDAG
  rationale: διʼ ἑαυτούς는 원인이 자기 자신들에게 있음을 나타내므로, 단순한 상황 설명이 아니라 책임의 뉘앙스를 드러내는 표현으로 옮겼습니다. πάσχομεν은 ‘겪다/당하다’ 중 중립적인 ‘겪다’를 택했습니다.
- source_word: ἁμαρτόντες εἰς τὸν ἑαυτῶν θεόν
  english_pob_choice: having sinned against our own God
  chosen_korean: 우리 하나님께 죄를 지었기 때문입니다
  alternatives_korean:
  - 우리 하나님을 향하여 죄를 지었기 때문입니다
  - 우리 자신의 하나님께 죄를 지었기 때문입니다
  lexicon: BDAG
  rationale: ἁμαρτάνω와 εἰς의 결합을 한국어에서는 ‘~께 죄를 짓다’로 자연스럽게 풀어, 하나님을 향한 범죄의 방향성을 살렸습니다. ἑαυτῶν은 ‘우리’에 이미 포함되므로 과도한 반복은 피했습니다.
- source_word: ἄξια θαυμασμοῦ γέγονε
  english_pob_choice: Astonishing things have happened
  chosen_korean: 놀라운 일들이 일어났습니다
  alternatives_korean:
  - 경탄할 만한 일들이 일어났습니다
  - 놀라움에 값하는 일들이 일어났습니다
  lexicon: LSJ
  rationale: 직역하면 ‘놀라움에 합당한 일들’이지만, 한국어에서는 문장으로 자연스럽게 들리도록 결과 진술로 옮겼습니다. 공적인 서술의 품위를 유지하면서도 의미의 강도를 보존했습니다.
theological_decisions:
- issue: 마지막 절의 평가적 진술
  chosen_reading: 화자는 자신들에게 일어난 일을 단순한 사고가 아니라, 하나님께 죄를 지은 데 따른 놀라운 결과로 말합니다.
  alternative_readings:
  - 단순히 예상 밖의 사건이 일어났다는 뜻으로만 읽을 수도 있습니다
  - 책임 강조를 약화한 일반적 회고로 읽을 수도 있습니다
  rationale: 그리스어는 πάσχομεν과 ἁμαρτόντες를 직접 연결하므로, 고난의 원인을 자기 죄와 연결하는 신학적 진술을 보존해야 합니다.
  doctrine_reference: 원문 우선 원칙; 죄와 심판의 인과관계 보존
