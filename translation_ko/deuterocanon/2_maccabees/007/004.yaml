  lexicon: LSJ
  rationale: 동사의 직접적 의미를 살리면서 한국어로도 형벌의 잔혹성을 분명히 드러내는 표현을 사용했습니다.
- source_word: περικυλίσαντας
  english_pob_choice: after scalping him
  chosen_korean: 그를 두피째 벗긴 뒤에
  alternatives_korean:
  - 그의 머리 가죽을 벗긴 뒤에
  - 그를 벗겨 낸 뒤에
  - 그의 두피를 벗긴 뒤에
  lexicon: LSJ
  rationale: 희귀하고 난해한 분사로서, 본문이 암시하는 두피/머리 가죽 제거의 이미지를 본문 수준에서 보존했습니다.
- source_word: ἀκρωτηριάζειν
