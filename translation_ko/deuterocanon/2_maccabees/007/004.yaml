  lexicon: LSJ
  rationale: 앞절에서 이미 언급된 가열된 도구를 가리키는 genitive absolute의 시간 관계를 한국어로 자연스럽게 옮기면서, 즉시성도 유지했습니다.
- source_word: προήγορον
