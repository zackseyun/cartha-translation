  - 선두에 서서 말한 사람
  lexicon: LSJ
  rationale: 문맥상 형제들을 대신해 말한 사람을 가리키므로, 군사적 ‘지도자’보다 발화 역할을 드러내는 표현을 택했습니다.
- source_word: γλωσσοτομεῖν
  english_pob_choice: to cut out the tongue
  chosen_korean: 혀를 잘라 내라고
  alternatives_korean:
