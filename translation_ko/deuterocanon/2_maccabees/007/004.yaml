  chosen_korean: 그의 팔다리를 절단하게 하였으며
  alternatives_korean:
  - 그의 팔다리를 잘라 내게 하였으며
  - 그를 절단하게 하였으며
  - 그의 사지를 잘라 내게 하였으며
  lexicon: LSJ
  rationale: 단순한 ‘훼손’보다 신체 말단을 자르는 가혹성을 더 분명히 전달하되, 본문이 특정 부위를 모두 명시하지는 않는 긴장도 유지했습니다.
theological_decisions:
- issue: 가해 행위의 주체와 사역 동사 구조
  chosen_reading: 왕이 직접 고문한 것이 아니라, 처형 집행자들에게 그렇게 하라고 명령한 것으로 옮겼습니다.
  alternative_readings:
  - 그가 그 사람을 잘라 내었다
  - 그가 직접 혀를 잘라 내고 두피를 벗겼다
  rationale: 그리스어 부정사구는 명령을 받은 집행 행위를 가리키므로, 주체를 바로잡아 서술의 폭력을 정확히 보존했습니다.
  doctrine_reference: 본문 해석 원칙 및 서사 문법
- issue: 형제들과 어머니의 관찰
  chosen_reading: ‘지켜보고 있었습니다’로 옮겨 사건의 공개적·증언적 성격을 살렸습니다.
  alternative_readings:
  - 보고 있었습니다
  - 목격하고 있었습니다
  rationale: 단순한 시선보다 처형이 공동체 앞에서 벌어지는 공적 사건임을 드러내는 표현이 문맥에 더 적합합니다.
  doctrine_reference: 서사적 증언성
