review_pass:
  verdict: revise
  source_fidelity: 초안은 고문의 지속과 상호 격려라는 큰 흐름을 보존합니다. 그러나 τηγανίζειν에 없는 ‘계속해서’를 첨가하고, ‘용감하게 죽기로 하였다’가 서로 권면한 행위를 공동 결의로 바꾸며, τηγανόν을 ‘솥’으로 옮겨 평평한 조리 팬이라는 구체성을 흐립니다. ἔτι ζῶν은 두 부정사에 걸쳐 피해자가 여전히 살아 있음을 나타내므로 문장 전체에 자연스럽게 반영했습니다.
  naturalness: ‘아직 숨이 붙어 있는 그를 … 하라고 명령했습니다’와 ‘서로에게 용감하게 죽으라고 격려했습니다’는 현대 표준 한국어 합쇼체에서 자연스럽고, 원문의 명령 및 상호 권면 구조를 명료하게 드러냅니다. ‘팬에서 김이 한참 피어오르자’는 ἀτμίς와 ἐφʼ ἱκανόν의 상당한 발생·확산을 자연스럽게 표현합니다.
  terminology: ‘다른 이들’은 τοῖς λοιποῖς의 남은 사람들, 문맥상 남은 형제들을 과도하게 한정하지 않고 보존합니다. ‘팬’은 τηγανόν의 조리 도구를 현대어로 가리키며, ‘지지다’는 τηγανίζειν의 조리·고문 이미지를 유지합니다. ‘용감하게’는 γενναίως의 용기와 고귀함을 교파적 해석 없이 전달합니다.
  issues:
  - severity: medium
    issue: ‘계속해서 달군 솥에 넣어’가 원문에 없는 지속성 및 조리 도구의 형태를 더합니다.
    rationale: τηγανίζειν은 팬에서 지지다/볶다의 뜻이며, 본문에는 ‘계속해서’에 해당하는 부사가 없습니다. τηγανόν은 일반적으로 팬 또는 얕은 조리판이지 솥으로 특정되지 않습니다.
  - severity: medium
    issue: ‘용감하게 죽기로 하였고’가 παρεκάλουν의 상호 권면을 공동 결의로 바꿉니다.
    rationale: παρεκάλουν은 ‘격려하다, 권면하다’이고, τελευτᾷν은 그 권면의 내용입니다. ‘서로에게 … 죽으라고 격려했다’가 통사와 의미를 더 충실히 반영합니다.
  - severity: low
    issue: 각주 표지가 문장 끝에 함께 놓여 해당 어구에 직접 연결되지 않습니다.
