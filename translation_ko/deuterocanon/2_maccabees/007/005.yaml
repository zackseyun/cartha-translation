base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/005.yaml
  text: 'And when he had become useless to the others[a], he ordered him to be brought to the fire while still breathing and to be fried in the pan. And when the vapor from the pan had spread considerably, they encouraged one another, together with their mother, to die nobly[b], saying this:'
  footnotes:
  - marker: a
    text: Or 'while he was still alive.' The Greek intensifies that the torture continued before death had occurred.
    reason: lexical_alternative
  - marker: b
    text: Or 'the steam' or 'the smoke' from the pan. The Greek term can denote vapor or fumes.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 다른 사람들에게는 쓸모없게 되자, 그는 그를 아직 숨이 붙어 있는 채로 불에 데려오라고 명령하고, 계속해서 달군 솥에 넣어 굽게 했습니다. 그런데 솥에서 나는 증기가 충분히 퍼지자, 그들은 어머니와 함께 서로를 격려하며 용감하게 죽기로 하였고, 이렇게 말하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아직 살아 있는 동안.’ 그리스어는 죽음이 오기 전에 고문이 계속되었음을 더 강하게 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘증기’나 ‘연기.’ 그리스어 용어는 증기, 김, 연무를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρηστον ... τοῖς λοιποῖς
  english_pob_choice: had become useless to the others
  chosen_korean: 다른 사람들에게는 쓸모없게 되자
  alternatives_korean:
  - 다른 이들에게 무용하게 되자
  - 나머지 사람들에게 더 이상 쓸모가 없게 되자
  lexicon: ἄχρηστος
  rationale: 사람을 기능 상실로 취급하는 냉혹한 뉘앙스를 살리되, 한국어로는 자연스러운 ‘쓸모없게 되다’가 가장 직접적입니다.
- source_word: ἐκέλευσεν τῇ πυρᾷ προσάγειν ἔτινουν
  english_pob_choice: he ordered him to be brought to the fire while still breathing
  chosen_korean: 아직 숨이 붙어 있는 채로 불에 데려오라고 명령하고
  alternatives_korean:
  - 아직 살아 있는 채로 불가로 끌고 오라고 명령하고
  - 숨이 붙은 채로 불로 끌어오라고 명령하고
  lexicon: προσάγειν ... ἔτινουν
  rationale: ‘아직’과 진행형 표현으로, 죽기 전에 고문이 계속된다는 점을 분명히 드러냈습니다.
- source_word: τηγανίζειν
  english_pob_choice: to be fried in the pan
  chosen_korean: 계속해서 달군 솥에 넣어 굽게 했습니다
  alternatives_korean:
  - 프라이팬에 넣어 기름에 지지게 했습니다
  - 솥에 넣어 달구어 지지게 했습니다
  lexicon: τηγανίζω
  rationale: 원어는 뜨거운 조리 도구로 지져 죽이는 잔혹한 형벌을 가리키므로, 단순한 ‘볶다’보다 ‘달군 솥에 넣어 굽다’가 고문성을 더 잘 보존합니다.
- source_word: ἀτμίδος ... διδούσης τοῦ τηγάνου
  english_pob_choice: the vapor from the pan had spread considerably
  chosen_korean: 솥에서 나는 증기가 충분히 퍼지자
  alternatives_korean:
  - 솥의 수증기가 한껏 퍼지자
  - 솥의 연무가 널리 퍼지자
  lexicon: ἀτμίς
  rationale: ἀτμίς는 증기·김·연무를 모두 포괄할 수 있어, 문맥상 감지되는 뜨거운 김의 확산을 ‘증기’로 옮겼습니다.
theological_decisions:
- issue: 순교자들의 공동 결의 표현
  chosen_reading: 그들은 어머니와 함께 서로를 격려하며 용감하게 죽기로 하였습니다
  alternative_readings:
  - 그들은 어머니와 함께 서로 권면하며 담대히 죽으려 했습니다
  - 그들은 어머니와 함께 서로를 부추기며 용기 있게 죽기로 했습니다
  rationale: 서로를 격려하는 행위와 ‘γενναίως τελευτᾷν’의 고귀한 순교 의지를 함께 드러내되, 과장된 신앙 언어를 덧붙이지 않도록 절제했습니다.
  doctrine_reference: 2 Maccabees의 순교 신학과 가족 공동체의 증언
