base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/025.yaml
  text: But since the young man was paying no attention at all, the king called the mother to him and urged her to become an adviser to the youth for his preservation.
  footnotes:
  - marker: a
    text: Or 'was not listening at all.' The Greek emphasizes complete refusal to heed.
    reason: lexical_alternative
  - marker: b
    text: Or 'for his safety,' 'for his deliverance,' or 'for his salvation.' The Greek σωτηρία can cover a range from physical preservation to broader deliverance; here the immediate context favors preservation of life.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그 젊은이가 전혀 귀를 기울이지 않자[a], 왕은 그 어머니를 자기 앞으로 불러, 그 청년의 안전을 위해 그에게 조언자가 되라고 권하였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전혀 듣지 않자’입니다. 그리스어는 완전히 귀를 기울이지 않는 태도를 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 생명을 보전하기 위해’, ‘그를 구하기 위해’, 또는 ‘그의 구원을 위해’로 옮길 수 있습니다. 그리스어 σωτηρία는 안전, 구출, 구원 등 폭넓은 뜻을 지닙니다. 여기서는 당면한 죽음에서 생명을 건지는 것이 문맥상 가장 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ δὲ νεανίου μηδαμῶς προσέχοντος
  english_pob_choice: But since the young man was paying no attention at all
  chosen_korean: 그 젊은이가 전혀 귀를 기울이지 않자
  alternatives_korean:
  - 그 청년이 전혀 듣지 않자
  - 그 젊은이가 전혀 주의를 기울이지 않자
  lexicon: LSJ
  rationale: μηδαμῶς는 ‘전혀’로, προσέχω는 문맥상 ‘귀를 기울이다/주의를 기울이다’로 옮겨 거부의 강한 정도를 살렸습니다.
- source_word: προσκαλεσάμενος
  english_pob_choice: called the mother to him
  chosen_korean: 그 어머니를 불러 와서
  alternatives_korean:
  - 그 어머니를 자기에게 불러
  - 그 어머니를 소환하여
  lexicon: LSJ
  rationale: 중간태 분사는 왕이 어머니를 자기 앞에 오게 했다는 관계적 뉘앙스를 가지므로, 너무 공문서체인 ‘소환하다’보다 자연스러운 서술로 옮겼습니다.
- source_word: γενέσθαι ... σύμβουλον
  english_pob_choice: urged her to become an adviser
  chosen_korean: 그에게 조언자가 되라고 권하였습니다
  alternatives_korean:
  - 그에게 상담자가 되라고 권하였습니다
  - 그에게 충고하는 사람이 되라고 권하였습니다
  lexicon: LSJ
  rationale: σύμβουλον은 ‘조언자/상담자’ 범위가 있으나, 본문에서는 설득을 돕는 역할이므로 가장 직접적인 ‘조언자’로 옮겼습니다.
- source_word: ἐπὶ σωτηρία
  english_pob_choice: for his preservation
  chosen_korean: 그 청년의 보존을 위해
  alternatives_korean:
  - 그의 안전을 위해
  - 그의 구원을 위해
  - 그의 생명을 보전하기 위해
  lexicon: LSJ
  rationale: σωτηρία는 여기서 즉각적인 생명 보존의 뜻이 강하므로, 신학적 의미를 덧씌우지 않도록 ‘보존’으로 유지했습니다.
theological_decisions:
- issue: σωτηρία의 범위
  chosen_reading: ‘보존’으로 옮겨 즉각적인 생명 보전의 뜻을 살렸습니다.
  alternative_readings:
  - 안전
  - 구원
  - 생명 보전
  rationale: 문맥은 왕이 아들의 태도를 바꾸도록 어머니를 이용해 목숨을 살리려는 장면이므로, 종말론적 ‘구원’보다 현재적 보존이 우선됩니다.
  doctrine_reference: '원문 우선 번역 원칙: 본문이 말하지 않는 신학적 함의를 미리 확정하지 않습니다.'
