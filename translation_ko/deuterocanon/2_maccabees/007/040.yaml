translation:
  language: ko
  text: 그래서 이 사람도 정결하게 세상을 떠났습니다[a]. 그는 주님을 온전히 신뢰한 채 죽었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘순결하게 죽었다.’ 곧 순결하고 흠 없는 모습으로 죽었다는 뜻일 수 있습니다. 그리스어 부사는 도덕적 의미를 띨 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주님께 온전히 의지한 채.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὗτος οὖν
  english_pob_choice: And so this one also
  chosen_korean: 그리고 이 사람도 결국
  alternatives_korean:
  - 그리고 이 사람 역시
  - 이 사람도 또한
  lexicon: LSJ
  rationale: 연결사 καὶ...οὖν의 이어짐과 οὗτος의 지시적 강조를 살리되, 한국어 문맥에서는 ‘이 사람도 결국’이 자연스럽고 서술의 흐름을 유지합니다.
- source_word: καθαρῶς
  english_pob_choice: in purity
  chosen_korean: 깨끗하게
  alternatives_korean:
  - 순결하게
  - 순수하게
  - 더럽히지 않고
  lexicon: LSJ
  rationale: 이 부사는 단순한 방식이 아니라 도덕적·종교적 뉘앙스를 띤 것으로 보이므로, 지나치게 추상적이지 않으면서도 문맥에 맞는 ‘깨끗하게’로 옮겼습니다.
- source_word: μετήλλαξεν
  english_pob_choice: passed away
  chosen_korean: 세상을 떠났습니다
  alternatives_korean:
  - 죽었습니다
  - 별세했습니다
  - 생을 마쳤습니다
  lexicon: LSJ
  rationale: 죽음을 에둘러 표현하는 완곡어법이므로, 현대 한국어에서 가장 자연스럽고 공손한 ‘세상을 떠났습니다’를 사용했습니다.
- source_word: ἐπὶ τῷ κυρίῳ πεποιθώς
  english_pob_choice: having placed his full confidence in the Lord
  chosen_korean: 주님께 온전히 믿음을 두고서
  alternatives_korean:
  - 주님을 온전히 신뢰하고서
  - 주님께 완전히 의지하여
  - 주님을 굳게 믿고서
  lexicon: BDAG
  rationale: πεποιθώς는 완료 분사로서 지속된 신뢰의 상태를 나타내므로 ‘믿음을 두고서’로 상태성을 살렸고, ἐπὶ τῷ κυρίῳ는 신뢰의 대상이 ‘주님’임을 분명히 했습니다.
theological_decisions:
- issue: καθαρῶς의 도덕적/종교적 함의
  chosen_reading: 이 구절은 단순히 ‘깔끔하게 죽었다’는 뜻이 아니라, 순결하고 흠 없이 죽었다는 도덕적 뉘앙스를 담는 것으로 읽었습니다.
  alternative_readings:
  - 단지 ‘조용히’ 또는 ‘담담히’ 죽었다는 의미
  - 형식적으로만 ‘순수하게’ 죽었다는 표현
  rationale: 순교 문맥과 함께 읽을 때 καθαρῶς는 행위의 품위보다 의로움과 정결의 함의를 드러내므로, 그 신학적 긴장을 보존하는 번역이 적절합니다.
  doctrine_reference: 문맥이 지시하는 도덕적 의미를 보존하고, 애매함을 과도하게 해소하지 않음
