translation:
  language: ko
  text: 그러자 그들 가운데 한 사람이 대변자로 나서서 말했습니다. “우리에게 묻고 배우려 하십니까? 우리는 조상들의 율법을 어기기보다는 죽을 준비가 되어 있습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἷς δὲ αὐτῶν
  english_pob_choice: But one of them
  chosen_korean: 그러자 그들 가운데 한 사람이
  alternatives_korean:
  - 그런데 그들 중 한 사람이
  - 그리고 그들 가운데 한 사람이
  lexicon: LSJ
  rationale: δὲ는 대조적·전환적 흐름을 살려 “그러자/그런데”로 옮길 수 있고, εἷς + 부분 속격은 “그들 가운데 한 사람”이 자연스럽습니다.
- source_word: γενόμενος προήγορος
  english_pob_choice: becoming their spokesman
  chosen_korean: 대변자로 나서서
  alternatives_korean:
  - 대변인이 되어
  - 앞서 말하는 사람이 되어
  lexicon: LSJ
  rationale: προήγορος는 집단을 대표해 먼저 말하는 사람을 가리키므로 “대변자”가 적절하며, γενόμενος는 문맥상 자연스럽게 “나서서/되어”로 처리했습니다.
- source_word: Μέλλεις ἐρωτᾷν, καὶ μανθάνειν ἡμῶν;
  english_pob_choice: What do you intend to ask and learn from us?
  chosen_korean: 무엇을 우리에게 묻고 배우려고 하십니까?
  alternatives_korean:
  - 우리에게 무엇을 묻고 배우려 하십니까?
  - 무엇을 우리에게 물으시고 배우시려 합니까?
  lexicon: LSJ
  rationale: μέλλεις는 의도·임박을 나타내므로 “-려고 하십니까”로 옮겨 도전적인 수사 의문을 살렸고, ἡμῶν은 “우리에게”로 자연스럽게 받았습니다.
- source_word: τὰ πατρῷα νόμους
  english_pob_choice: the laws of our fathers
  chosen_korean: 조상들의 율법
  alternatives_korean:
  - 우리 조상들의 율법
  - 선조들의 법
  lexicon: LSJ
  rationale: πατρῷα는 ‘아버지들로부터 전승된/조상들의’의 뜻이므로, 유다인 정체성과 전승성을 살려 “조상들의 율법”으로 옮겼습니다.
- source_word: παραβαίνειν
  english_pob_choice: transgress
  chosen_korean: 어기기보다
  alternatives_korean:
  - 범하기보다
  - 어기느니
  lexicon: LSJ
  rationale: 법·윤리 문맥에서 παραβαίνειν은 ‘어기다/범하다’이므로, 현대 한국어에서 자연스럽고 직접적인 “어기기보다”를 선택했습니다.
theological_decisions:
- issue: 조상 전승의 율법을 가리키는 πατρῷα νόμους의 뉘앙스
  chosen_reading: ‘조상들의 율법’은 단순한 전통이 아니라 박해 속에서도 지켜야 할 유대 공동체의 전승된 율법을 가리키는 표현으로 유지했습니다.
  alternative_readings:
  - ‘선조들의 법’
  - ‘전통의 법’
  rationale: 본문의 저항 논리는 단지 문화 관습이 아니라 조상들로부터 받은 율법에 대한 신실함에 있습니다. ‘율법’을 유지해 종교·언약적 무게를 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
