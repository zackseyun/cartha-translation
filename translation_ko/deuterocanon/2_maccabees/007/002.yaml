  source_fidelity: 헬라어의 질문에는 ‘무엇을’에 해당하는 의문사가 없습니다. 따라서 ‘무엇을 우리에게 묻고 배우려고 하십니까?’는 영어 감사 번역의 관용적 보충을 따르지만, 원문 우선 원칙에서는 보충하지 않는 편이 더 충실합니다. ‘조상들의 율법’, ‘어기기보다 죽을 준비가 되어 있습니다’는 각각 πατρῷα νόμους와 ἕτοιμοι ... ἀποθνήσκειν ἐσμέν의 뜻을 적절히 전달합니다.
  naturalness: ‘대변자로 나서서’, ‘우리에게 묻고 배우려 하십니까?’, ‘조상들의 율법을 어기기보다는’은 현대 표준어 합쇼체에서 자연스럽고 문맥에 맞습니다. ‘죽을 준비가 되어 있습니다’도 원문의 ‘죽을 각오/준비가 되어 있다’는 뜻을 과장 없이 유지합니다.
  terminology: ‘조상들의 율법’은 πατρῷα νόμους의 전승적·공동체적 의미를 자연스럽게 보존하며, 유대교 율법을 가리키는 문맥에서 ‘율법’은 적절합니다. 현 각주는 본문과 동일한 표현을 대안으로 제시하여 실질적인 정보를 제공하지 않으므로 삭제하는 것이 바람직합니다.
