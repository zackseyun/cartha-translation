  to: 그러나 나는 형제들처럼 우리 조상들의 율법을 위하여 몸과 목숨을[a] 버립니다. 하나님께서 이 민족에게 속히 자비를 베푸시고, 당신이 고문과 채찍질을 겪고 그분만이 하나님이심을 고백하게 되기를[b] 하나님께 간구합니다.
