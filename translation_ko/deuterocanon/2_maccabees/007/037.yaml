base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/037.yaml
  text: But I[a], like my brothers, give up both body and life for the laws of our fathers, calling on God quickly to become merciful to the nation, and for you, through torments and whippings[b], to confess that he alone is God.
  footnotes:
  - marker: a
    text: Or 'life' could be rendered 'fate' or 'lot'; the Greek term τύχην can denote one's lot or destiny, but here it refers concretely to the life being surrendered in martyrdom.
    reason: lexical_alternative
  - marker: b
    text: Or 'to acknowledge openly'; the verb translated 'to confess' can also mean public acknowledgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 나는 형제들처럼 우리 조상들의 율법을 위하여 몸과 목숨을[a] 버립니다. 하나님께서 이 민족에게 속히 자비를 베푸시고, 당신이 고문과 채찍질을 겪고 그분만이 하나님이심을 고백하게 되기를[b] 하나님께 간구합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: τύχην은 여기서 ‘운명’이나 ‘행운’보다, 실제로 내어주는 삶이나 목숨의 의미로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: ἐξομολογήσασθαι는 ‘고백하다’ 외에 ‘공적으로 인정하다’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ οἱ ἀδελφοί
  english_pob_choice: like my brothers
  chosen_korean: 형제들처럼
  alternatives_korean:
  - 우리 형제들처럼
  - 형제들과 같이
  lexicon: LSJ
  rationale: 비교 구문을 자연스러운 한국어로 옮기되, 순교의 공동성을 드러내는 ‘형제들’의 관계성을 살렸습니다.
- source_word: σῶμα καὶ τύχην
  english_pob_choice: both body and life
  chosen_korean: 몸과 목숨
  alternatives_korean:
  - 몸과 생명
  - 몸과 운명
  lexicon: LSJ
  rationale: σῶμα는 물리적 ‘몸’, τύχην은 이 문맥에서 실제로 내어주는 생애를 가리키므로 ‘목숨’이 가장 직접적입니다.
- source_word: προδίδωμι
  english_pob_choice: give up
  chosen_korean: 버립니다
  alternatives_korean:
  - 내어줍니다
  - 내줍니다
  - 포기합니다
  lexicon: LSJ
  rationale: 자발적 희생의 뉘앙스를 살리면서도 순교 문맥에 맞게, 소극적 ‘포기’보다 능동적 ‘버리다’를 택했습니다.
- source_word: πατρίων νόμων
  english_pob_choice: the laws of our fathers
  chosen_korean: 우리 조상들의 율법
  alternatives_korean:
  - 우리 아버지들의 율법
  - 우리 선조들의 율법
  lexicon: LSJ
  rationale: πατρίων은 단순히 전통적 규범이 아니라 조상으로부터 내려온 율법을 가리키므로, 한국어에서는 의미가 분명한 ‘조상들의 율법’으로 옮겼습니다.
- source_word: ἐξομολογήσασθαι
  english_pob_choice: to confess
  chosen_korean: 고백하게 되기를 바랍니다
  alternatives_korean:
  - 인정하게 되기를 바랍니다
  - 공적으로 시인하게 되기를 바랍니다
  lexicon: LSJ
  rationale: 이 동사는 ‘고백하다’와 ‘공적으로 인정하다’의 뜻을 함께 가지므로, 한국어에서는 두 의미를 포괄하는 ‘고백하다’를 사용했습니다.
theological_decisions:
- issue: ἵλεων ταχὺ τῷ ἔθνει γενέσθαι의 기도적 뉘앙스
  chosen_reading: 하나님께서 이 민족에게 속히 긍휼을 베푸시기를 간구하며
  alternative_readings:
  - 하나님께서 이 민족에게 속히 자비로우시기를 바라며
  - 하나님께서 이 민족에게 속히 은혜를 베푸시기를 간구하며
  rationale: ἵλεως는 단순한 감정이 아니라 자비로운 호의의 상태를 뜻하므로, 기도문답게 ‘긍휼을 베푸시다’로 옮겨 간구의 성격을 살렸습니다.
  doctrine_reference: 시편적 간구 표현과 하나님의 긍휼 개념을 반영하되, 본문의 순교 기도를 과도하게 신학화하지 않음
- issue: μόνος αὐτὸς θεὸς ἐστίν의 배타적 유일신 고백
  chosen_reading: 그분만이 하나님이심
  alternative_readings:
  - 그분만이 하나님이시라는 것
  - 하나님은 오직 한 분이심
  rationale: μόνος αὐτός는 이미 언급된 하나님을 가리키며 배타성을 강조하므로, ‘그분만이’로 압축해 문맥의 고백성을 유지했습니다.
  doctrine_reference: 엄격한 유일신 고백을 분명히 드러내되, 문장 내부의 지시 대상을 흐리지 않음
