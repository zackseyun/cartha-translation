  - 세 번째 형제
  - 그 셋째
  lexicon: LSJ
  rationale: 문맥상 형제임이 분명하지만, 한국어 본문은 반복을 줄이되 인물 순서를 분명히 하기 위해 ‘세 번째 사람’으로 옮겼습니다.
- source_word: ἐνεπαίζετο
  english_pob_choice: was mocked
  chosen_korean: 조롱을 당했습니다
  alternatives_korean:
  - 비웃음을 당했습니다
  - 희롱을 당했습니다
  lexicon: LSJ
  rationale: 단순한 ‘웃음거리’보다 수난 맥락의 모욕성을 살리기 위해 피동형으로 옮겼습니다.
- source_word: αἰτηθεὶς
  english_pob_choice: when his tongue was demanded
  chosen_korean: 혀를 내놓으라고 하자
  alternatives_korean:
  - 혀를 요구하자
  - 혀를 달라고 하자
  lexicon: LSJ
  rationale: 그리스어의 수동 분사와 문맥상의 강압을 한국어에서는 직접명령·요구의 형태로 드러내는 것이 자연스럽습니다.
- source_word: ταχέως ... εὐθαρσῶς
  english_pob_choice: quickly ... courageously
  chosen_korean: 곧바로 ... 담대하게
  alternatives_korean:
  - 빨리 ... 용감하게
  - 곧 ... 용기 있게
  lexicon: LSJ
  rationale: 두 부사를 각각 속도와 태도로 살리되, 순교 서술에 어울리는 한국어 표현으로 ‘곧바로’와 ‘담대하게’를 선택했습니다.
- source_word: προέβαλλεν ... προέτεινεν
  english_pob_choice: held it out ... stretched out
  chosen_korean: 내밀고 ... 내밀었습니다
  alternatives_korean:
  - 내보이고 ... 뻗었습니다
  - 펴서 내밀고 ... 뻗었습니다
  lexicon: LSJ
  rationale: 혀와 손의 움직임을 각각 살리되, 한국어에서는 같은 동사를 반복해도 문장이 과도하게 딱딱해지지 않도록 ‘내밀다’를 중심으로 통일했습니다.
theological_decisions:
- issue: 순교자의 태도 묘사에서 ‘담대하게’의 수위
  chosen_reading: 형벌을 받는 상황에서도 두 손을 스스로 내미는 적극적 태도를 담대함으로 표현했습니다.
  alternative_readings:
  - 용감하게
  - 대담하게
  rationale: 본문은 단순한 수동적 수용이 아니라, 고난 앞에서의 의식적이고 두려움 없는 자세를 강조합니다.
  doctrine_reference: 2 Maccabees 7장의 순교 신학
