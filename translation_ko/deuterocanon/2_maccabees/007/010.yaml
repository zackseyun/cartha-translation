translation:
  language: ko
  text: 그 다음에는 셋째가 조롱을 당했습니다. 그의 혀를 내놓으라는 요구를 받자, 그는 곧바로 혀를 내밀고 두 손을 담대하게 뻗었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘요구를 받자’라는 뜻의 수동 분사를 사용합니다. 문맥상 그의 혀를 내놓으라는 강압적인 요구를 받은 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τοῦτον
  english_pob_choice: After him
  chosen_korean: 그 뒤에
  alternatives_korean:
  - 그 후에
  - 그 다음에
  lexicon: LSJ
  rationale: 앞선 형제를 가리키는 순차 표현이므로, 자연스러운 한국어로는 ‘그 뒤에’가 간결하면서도 순서를 분명히 드러냅니다.
- source_word: ὁ τρίτος
