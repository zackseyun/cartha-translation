  source_fidelity: 대체로 충실합니다. 다만 αἰτηθείς는 ‘혀를 내놓으라고 하자’보다 그가 그러한 요구를 ‘받은’ 수동 구문으로 옮기는 편이 원문의 문법적 관점을 더 잘 보존합니다. ‘세 번째 사람’은 문맥상 가능하지만, 앞선 형제들의 순서를 가리키므로 ‘셋째’가 더 정확하고 자연스럽습니다.
  naturalness: 초안의 ‘그의 혀를 내놓으라고 하자’는 요구한 주체가 불분명한 데다가 ‘하자’의 연결이 다소 어색합니다. ‘혀를 내놓으라는 요구를 받자’가 현대 표준어 합쇼체에서 더 자연스럽습니다. 손의 동작에는 ‘내밀었습니다’보다 ‘뻗었습니다’가 προέτεινεν의 차이를 더 잘 살립니다.
  terminology: ‘조롱을 당했습니다’와 ‘담대하게’는 각각 ἐνεπαίζετο와 εὐθαρσῶς에 적절합니다. 신학적 해석을 덧붙이지 않았으며, 형제 관계는 문맥에 맡긴 ‘셋째’로 처리했습니다.
