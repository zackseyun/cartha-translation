base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/006.yaml
  text: The Lord God is watching[a], and in truth he is being moved to compassion for us, just as Moses made clear in the song that testifies openly, saying[c][b], “And he will be moved to compassion for his slaves.”
  footnotes:
  - marker: a
    text: Or “he is comforted … he will be comforted.” The Greek verb can carry senses such as comfort, exhortation, or being moved with pity; here the context and the quotation from the Song of Moses favor the sense of compassion or relenting.
    reason: lexical_alternative
  - marker: b
    text: The quotation echoes Deuteronomy 32:36, where the Lord is said to be moved concerning his servants.
    reason: cross_reference
  - marker: c
    text: 'Or “his servants.” Greek: “his slaves.”'
    reason: alternative_reading
translation:
  language: ko
  text: 주 하나님께서는 살펴보고 계시며, 진실로 우리를 불쌍히 여기고 계십니다. 모세가 「반대 증언하는 노래」에서 분명히 밝힌 바와 같이 말입니다. 「그리고 그분은 자기 종들을 두고 불쌍히 여기실 것입니다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그분은 위로를 받으십니다 … 그분은 위로를 받으실 것입니다.” 이 동사는 위로, 권면, 불쌍히 여김의 뜻을 가질 수 있는데, 여기서는 문맥과 이어지는 모세의 노래 때문에 자비나 돌이킴의 뜻이 더 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: 이는 신명기 32:36의 표현을 반영하며, 거기서 주께서는 자기 종들을 두고 마음을 두십니다.
    reason: cross_reference
  - marker: c
    text: '또는 “그의 종들.” 헬라어: “그의 노예들.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐφορᾷ
  english_pob_choice: is watching
  chosen_korean: 살펴보고 계시며
  alternatives_korean:
  - 보고 계시며
  - 감시하고 계시며
  - 지켜보고 계시며
  lexicon: LSJ
  rationale: 현재형의 지속적 관찰을 살리되, 한국어에서 가장 자연스럽고 엄숙한 표현으로 옮겼습니다. '지켜보다'는 보호 뉘앙스가 강하고, '감시하다'는 과도하게 경직되어 있어 제외했습니다.
- source_word: παρακαλεῖται / παρακληθήσεται
  english_pob_choice: is being moved to compassion / will be moved to compassion
  chosen_korean: 불쌍히 여기고 계십니다 / 불쌍히 여기실 것입니다
  alternatives_korean:
  - 위로를 받고 계십니다 / 위로를 받으실 것입니다
  - 마음을 돌이키고 계십니다 / 마음을 돌이키실 것입니다
  - 불쌍히 여기고 계십니다 / 긍휼을 베푸실 것입니다
  lexicon: LSJ
  rationale: 문맥상 하나님이 사람에게서 위로를 받는 뜻이 아니라, 자기 백성을 향해 자비롭게 기울어지는 뜻입니다. 한국어에서는 '불쌍히 여기다'가 그 감정적·관계적 힘을 가장 직접적으로 드러냅니다.
- source_word: κατὰ πρόσωπον ἀντιμαρτυρούσης ᾠδῆς
  english_pob_choice: the song that testifies openly
  chosen_korean: 「반대 증언하는 노래」
  alternatives_korean:
  - 「공개적으로 증언하는 노래」
  - 「마주하여 증언하는 노래」
  - 「대항하여 증언하는 노래」
  lexicon: LSJ
  rationale: 직역하면 '얼굴 앞에서 반대 증언하는'이라는 낯선 구조이므로, 핵심 의미인 모세의 노래가 현재 상황을 두고 증언하는 성격을 간결하게 살렸습니다. '반대 증언'은 ἀντιμαρτυρούσης의 대조적 증언 성격을 보존합니다.
- source_word: δούλοις
  english_pob_choice: slaves
  chosen_korean: 종들
  alternatives_korean:
  - 노예들
  - 종
  - 섬기는 자들
  lexicon: LSJ
  rationale: POB의 영어 본문은 도드라진 사회적 종속성을 살리지만, 한국어 본문에서는 시의 인용문 장르와 하나님을 향한 경어를 고려해 '종들'을 택했습니다. 다만 원어의 소유·종속 관계는 '그분의'로 유지했습니다.
