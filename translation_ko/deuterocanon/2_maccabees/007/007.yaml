base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/007.yaml
  text: When the first had died in this way[a], they brought the second to the mockery; and after tearing off the skin of his head with the hair, they asked[b], “Will you eat before your body is punished limb by limb?”
  footnotes:
  - marker: a
    text: Or, more literally, 'the skin of the head'; English 'scalp' is a possible rendering.
    reason: lexical_alternative
  - marker: b
    text: The question implies eating what had been forbidden under the ancestral law, as the surrounding context makes clear.
    reason: cross_reference
translation:
  language: ko
  text: 첫째가 이와 같이 죽은 뒤에, 그들은 둘째를 조롱을 당하도록 끌고 갔습니다. 그리고 그의 머리의 피부를 머리카락과 함께 벗겨 내고는, “네 몸의 팔다리가 하나하나 고문당하기 전에 먹겠느냐?[b]” 하고 물었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘머리의 피부’는 문자적으로 옮긴 표현입니다. ‘두피’로 번역할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 질문은 주변 문맥에서 분명하듯, 조상들의 율법에서 금지된 음식을 먹으라는 요구를 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: Μεταλλάξαντος δὲ τοῦ πρώτου τὸν τρόπον τοῦτον
  english_pob_choice: When the first had died in this way
  chosen_korean: 첫째가 이렇게 죽은 뒤에
  alternatives_korean:
  - 첫째가 이런 식으로 죽자
  - 첫째가 이렇게 생을 마친 뒤에
  lexicon: LSJ
  rationale: 문맥상 첫째의 ‘변화’가 아니라 고문 끝의 죽음을 가리키므로, 한국어에서는 자연스럽게 ‘죽은 뒤에’로 옮겨 서술 흐름을 살렸습니다.
- source_word: τὸν δεύτερον ἦγον ἐπὶ τὸν ἐμπαιγμόν
  english_pob_choice: they brought the second to the mockery
  chosen_korean: 둘째를 조롱거리로 끌고 갔습니다
  alternatives_korean:
  - 둘째를 조롱 속으로 끌고 갔습니다
  - 둘째를 조롱과 학대의 자리로 끌고 갔습니다
  lexicon: LSJ
  rationale: ἐμπαιγμός의 핵심은 조롱과 능욕이므로, 단순히 ‘조롱’보다 상태를 드러내는 ‘조롱거리’로 풀어 공적 모욕의 뉘앙스를 살렸습니다.
- source_word: τὸ τῆς κεφαλῆς δέρμα σὺν ταῖς θριξὶν περισύραντες
  english_pob_choice: after tearing off the skin of his head with the hair
  chosen_korean: 머리의 살갗을 머리카락과 함께 벗겨 내고는
  alternatives_korean:
  - 머리의 피부를 머리카락과 함께 뜯어내고는
  - 두피를 머리카락과 함께 벗겨 내고는
  lexicon: LSJ
  rationale: 직역하면 ‘머리의 살갗’이지만, 한국어에서는 ‘살갗’이 지나치게 일반적이거나 ‘두피’가 해석을 앞서는 느낌이 있어, 본문을 비교적 직접적으로 옮기되 알아보기 쉽게 표현했습니다.
- source_word: ἐπηρώτων Εἰ φάγεσαι
  english_pob_choice: they asked, “Will you eat
  chosen_korean: “네 몸이 팔다리마다 고문당하기 전에 먹겠느냐?” 하고 물었습니다
  alternatives_korean:
  - “네 몸이 팔다리마다 벌을 받기 전에 먹겠느냐?” 하고 물었습니다
  - “네 몸이 팔다리마다 형벌을 받기 전에 먹겠느냐?” 하고 물었습니다
  lexicon: LSJ
  rationale: ἐπηρώτων은 반복적 미완료 뉘앙스가 있으나 서술 흐름상 자연스러운 과거형으로 처리했고, εἰ φάγεσαι는 강요된 식사를 가리키므로 ‘먹겠느냐?’로 직역하되 문맥상 대상이 금지된 음식임을 본문 안에서는 과잉 설명하지 않았습니다.
theological_decisions:
- issue: τιμωρηθῆναι κατὰ μέλος τὸ σῶμα의 형벌 의미
  chosen_reading: ‘네 몸이 팔다리마다 고문당하기 전에’로 옮겨, 단순한 징벌이 아니라 신체를 대상으로 한 가혹한 고문임을 드러냈습니다.
  alternative_readings:
  - ‘네 몸이 팔다리마다 벌을 받기 전에’
  - ‘네 몸이 부분부분 처벌받기 전에’
  rationale: 앞선 절망적 고문 장면과 연결되므로, τιμωρέω의 일반적 ‘벌하다’보다 실제 신체 고문성을 살리는 번역이 문맥상 더 정확합니다.
  doctrine_reference: 순교 서사와 고문 묘사의 문맥적 정확성
