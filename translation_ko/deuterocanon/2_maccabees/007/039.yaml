base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/039.yaml
  text: But the king became furious and treated this one more cruelly than the others[a], taking the mockery bitterly.
  footnotes:
  - marker: a
    text: Or 'resenting the insult bitterly.' The Greek phrase πικρῶς φέρων ἐπὶ τῷ μυκτηρισμῷ can be rendered with emphasis on the king's bitter reaction to being mocked.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 왕은 격분하여, 이 사람을 다른 이들보다 더 잔혹하게 대하였으며, 조롱을 쓰라리게 받아들였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘조롱’을 ‘모욕’으로 옮길 수도 있습니다. 그리스어 μυκτηρισμός은 비웃음과 경멸적 조롱을 가리키며, πικρῶς φέρων은 그 조롱을 쓰라리게 받아들인다는 뜻입니다.
    reason: lexical_alternative
