theological_decisions:
- issue: 왕의 분노와 보복의 묘사 방식
  chosen_reading: 본문의 감정적 반응과 가혹한 처우를 그대로 드러내고, 이를 완곡하게 완화하지 않았습니다.
  alternative_readings:
  - 감정을 약화시켜 ‘몹시 화가 나서’ 정도로 순화
  - ‘대하다’를 중립적으로 만들어 폭력성을 약화
  rationale: 이 절은 왕이 조롱을 개인적 모욕으로 받아들여 더욱 잔혹하게 응대한 장면을 강조하므로, 서술의 날카로움을 보존하는 것이 본문 의도에 부합합니다.
  doctrine_reference: 서사 본문 해석 원칙
- issue: 비교 구조 παρὰ τοὺς ἄλλους의 처리
  chosen_reading: ‘다른 이들보다 더’로 비교를 명시했습니다.
  alternative_readings:
  - ‘다른 이들 곁에서’처럼 모호하게 처리
  - 비교를 생략
  rationale: 이 구절은 이 형제가 다른 순교자들보다 더 가혹한 처우를 받았음을 분명히 말하므로, 비교 대조를 직접 드러내야 합니다.
  doctrine_reference: 문맥 충실성
