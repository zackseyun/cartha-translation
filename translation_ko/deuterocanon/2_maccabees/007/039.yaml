  source_fidelity: 핵심 의미는 충실합니다. 다만 πικρῶς φέρων ἐπὶ τῷ μυκτηρισμῷ는 왕이 조롱을 당한 일을 분하게 여기고 원통하게 받아들였다는 반응을 나타내므로, ‘쓰라리게 받아들였습니다’보다 그 정서와 인과관계를 더 분명히 드러낼 수 있습니다. χειρίστως ... παρὰ τοὺς ἄλλους의 비교적 강조는 ‘훨씬 더 가혹하게’로 자연스럽게 보존할 수 있습니다.
  naturalness: ‘이 사람을 다른 이들보다 더 잔혹하게 대하였으며, 조롱을 쓰라리게 받아들였습니다’는 이해되지만, 지시 대상과 조롱의 주체가 다소 불분명하고 ‘쓰라리게 받아들이다’는 이 문맥에서 약간 어색합니다. ‘그에게 다른 이들보다 훨씬 더 가혹하게 대하였고, 그가 조롱한 것을 몹시 분하게 여겼습니다’가 현대 표준어 합쇼체 서술로 더 자연스럽습니다.
