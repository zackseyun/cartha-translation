lexical_decisions:
- source_word: Ἐχομένως
  english_pob_choice: Next
  chosen_korean: 그다음
  alternatives_korean:
  - 다음에
  - 이어
  - 곧이어
  lexicon: LSJ
  rationale: 이 부사는 사건의 순서를 나타내므로, 한국어에서는 간결한 연결 표현인 “그다음”이 문맥의 진행을 자연스럽게 살립니다.
- source_word: τὸν πέμπτον
  english_pob_choice: the fifth
  chosen_korean: 다섯째를
  alternatives_korean:
  - 다섯 번째를
  - 다섯째 형제를
  - 다섯 번째 형제를
  lexicon: LSJ
  rationale: 원문은 단지 “다섯째”라고만 하고 ‘형제’를 생략하므로, 본문은 그 생략을 살려 “다섯째를”로 옮기고, 각주로 문맥상 형제임을 밝힙니다.
- source_word: προσάγοντες
  english_pob_choice: brought forward
  chosen_korean: 끌어내어
  alternatives_korean:
