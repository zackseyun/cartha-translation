  lexicon: BDAG
  rationale: 처형과 고문의 맥락에서 단순한 이동보다 강압적으로 끌어오는 뉘앙스가 있으므로, “끌어내어”가 장면의 폭력성을 잘 드러냅니다.
- source_word: ᾐκίζοντο
  english_pob_choice: tortured him
  chosen_korean: 고문했습니다
  alternatives_korean:
  - 괴롭혔습니다
  - 혹독하게 다루었습니다
  - 학대했습니다
  lexicon: LSJ
  rationale: 이 동사는 단순한 괴롭힘이 아니라 신체적 폭력을 동반한 고문을 뜻하므로, 의미 강도를 분명히 하는 “고문했습니다”를 택했습니다.
theological_decisions:
- issue: 피수동적 표현의 행위자 생략
  chosen_reading: 행위자를 명시하지 않고 사건 진행을 그대로 옮겼습니다.
  alternative_readings:
  - 그들이 그를 고문했습니다
  - 그들은 그를 고문하였습니다
  rationale: 원문은 다수의 행위자가 고문을 가하는 상황을 서술하지만, 동사의 형태와 문맥상 초점은 행위자보다 사건의 연속과 고통 그 자체에 있으므로, 이를 간결하게 유지했습니다.
  doctrine_reference: 문맥 우선의 서술 방식
