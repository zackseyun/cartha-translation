  source_fidelity: 현 번역은 στῆσαι를 사역적으로 ‘그치게 해 주십시오’로 옮긴 점과 ἐν ἐμοὶ …를 보존하려는 점은 적절합니다. 그러나 ‘전능자의 의로운 분노가 우리 온 민족에게 내렸던 그 분노’는 분노를 중복하고, δικαίως가 ‘분노’ 자체가 아니라 분노가 일어난/타오른 방식에 걸리는 원문 구문을 정확히 반영하지 못합니다. ἐπὶ σύμπαν ἡμῶν γένος의 대항적 방향도 ‘민족을 향해’로 분명히 하는 편이 안전합니다.
  naturalness: ‘나와 내 형제들 안에서’는 직역으로 다소 낯설지만, 원문의 의도적·해석상 논쟁적인 표현을 보존하는 데 필요하며, 문맥상 쉼표와 각주 설명을 두면 현대 한국어에서도 수용 가능합니다. 문장 구조는 중복을 제거하고 관계절을 정리하면 자연스러워집니다.
