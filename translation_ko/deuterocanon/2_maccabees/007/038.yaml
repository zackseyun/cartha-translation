  rationale: 원문의 단일 목적어 ὀργήν을 한 번만 옮기고, δικαίως ἐπημμένην을 ‘정당하게 타오른’으로 번역하여 정당성의 판단이 분노의 발생에 적용됨을 드러냈습니다. ‘안에서’는 직역적 긴장을 보존하되, 각주에서 더 관용적인 대안을 제시했습니다. 이 표현은 순교의 죽음을 특정한 교리적 속죄 체계로 확정하지 않고, 분노가 화자와 형제들 안에서 그치기를 바라는 본문 수준의 요청만 전달합니다.
  reviewer_model: gpt-5.6-terra
