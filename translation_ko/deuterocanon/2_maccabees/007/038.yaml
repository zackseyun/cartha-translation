  text: and in me and my brothers bring to an end the wrath of the Almighty that has justly been kindled against our whole nation[a].
  footnotes:
  - marker: a
    text: Or 'stop ... with me and my brothers.' The Greek literally says 'in me and my brothers,' expressing that the wrath would come to its stopping-point in them.
    reason: lexical_alternative
translation:
  language: ko
  text: 나와 내 형제들 안에서, 우리 온 민족을 향해 정당하게 타오른 전능자의 분노가 그치게 해 주십시오[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나와 내 형제들과 함께 그치게 해 달라.’ 그리스어는 문자적으로 ‘나와 내 형제들 안에서’라고 하여, 그 분노가 그들 안에서 종결점에 이른다는 뜻을 나타냅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: στῆσαι
  english_pob_choice: bring to a stop
  chosen_korean: 그치게 해 주십시오
  alternatives_korean:
  - 멈추게 해 주십시오
  - 중단하게 해 주십시오
  - 끝나게 해 주십시오
  lexicon: LSJ
  rationale: 사역적 의미를 살려 분노를 ‘그치게’ 하는 요청으로 옮겼습니다. 한국어에서 가장 자연스럽고, 단순한 ‘멈추다’보다 종료의 뉘앙스가 분명합니다.
- source_word: ἐν ἐμοὶ δὲ καὶ τοῖς ἀδελφοῖς μου
  english_pob_choice: in me and my brothers
  chosen_korean: 나와 내 형제들 안에서
  alternatives_korean:
  - 나와 내 형제들에게서
  - 나와 내 형제들과 함께
  - 나와 내 형제들 위에
  lexicon: LSJ
  rationale: ἐν을 직역해 ‘안에서’로 두어, 분노가 그들 안에서 종결점에 이른다는 영어 주해의 핵심을 보존했습니다.
- source_word: παντοκράτορος
  english_pob_choice: the Almighty
  chosen_korean: 전능자
  alternatives_korean:
  - 전능하신 이
  - 전능하신 하나님
  lexicon: LSJ
  rationale: 하나님의 칭호를 자연스러운 한국어로 옮겼습니다. 본절은 예외적 명칭을 요구하지 않으므로 통상적인 ‘전능자’가 적절합니다.
- source_word: γένος
  english_pob_choice: whole nation
  chosen_korean: 온 민족
  alternatives_korean:
  - 온 나라
  - 온 백성
  - 온 족속
  lexicon: LSJ
  rationale: γένος는 여기서 집단적 혈통/민족 공동체를 가리키므로, 유대 공동체 전체를 드러내는 ‘온 민족’이 가장 분명합니다.
theological_decisions:
- issue: 하나님의 분노를 마르티르의 죽음과 연관된 종결 요청으로 읽을 것인가
  chosen_reading: 이 절은 전능자의 의로운 분노가 화자와 그의 형제들 안에서 ‘그치게’ 해 달라는 간청으로 옮겼습니다.
  alternative_readings:
  - 분노가 그들 위에 ‘머무르다’는 뜻으로 읽을 수 있습니다
  - 분노가 그들로 인해 ‘만족된다’는 식으로도 해석될 수 있습니다
  rationale: στῆσαι + ὀργήν의 사역적 의미를 따라, 본문이 말하는 신적 심판의 종결 요청을 살렸습니다. 속죄론을 과잉 확정하지 않고, 본문이 지닌 신학적 긴장을 유지합니다.
  doctrine_reference: 판결적 분노와 순교의 관계를 본문 수준에서 보존
