  - severity: low
    issue: 주석 표지 위치 및 ‘배열한’ 표현
    rationale: 주석은 πνεῦμα를 설명하므로 ‘영’ 뒤에 붙여야 합니다. 또한 ‘각자의 구성을 배열하다’는 한국어 결합이 어색하므로, 원문의 질서 있게 정함을 ‘정한’으로 옮기는 편이 자연스럽습니다.
