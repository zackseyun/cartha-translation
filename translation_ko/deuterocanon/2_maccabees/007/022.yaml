base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/022.yaml
  text: I do not know how you appeared in my womb[a], nor was it I who granted you spirit and life, and it was not I who arranged the formation of each of you.
  footnotes:
  - marker: a
    text: Or 'granted you breath and life.' The Greek word can mean 'spirit,' 'breath,' or 'wind'; here it refers to the animating principle of life.
    reason: lexical_alternative
translation:
  language: ko
  text: 저는 여러분이 어떻게 제 태중에 생겨났는지 알지 못합니다. 또 여러분에게 영[a]과 생명을 준 이도 제가 아니며, 여러분 각자의 구성을 제가 정한 것도 아닙니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘호흡과 생명’. 여기서 그리스어는 ‘영’, ‘호흡’, ‘바람’의 뜻을 가질 수 있으며, 문맥상 생명을 부여하는 원리를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ οἶδʼ ὅπως
  english_pob_choice: I do not know how
  chosen_korean: 저는 ... 알지 못합니다
  alternatives_korean:
  - 저는 ... 모르겠습니다
  - 어떻게 ... 되었는지 저는 알지 못합니다
  lexicon: BDAG
  rationale: 어머니의 무지와 고백의 어조를 자연스러운 합쇼체로 옮기되, 사건의 방식에 대한 불확실성을 드러내기 위해 '어떻게 ... 되었는지' 구조를 살렸습니다.
- source_word: εἰς τὴν ἐμὴν ἐφάνητε κοιλίαν
  english_pob_choice: you appeared in my womb
  chosen_korean: 여러분이 제 자궁에 들어오게 되었는지
  alternatives_korean:
  - 여러분이 제 자궁에 나타났는지
  - 여러분이 제 태중에 오게 되었는지
  lexicon: LSJ
  rationale: ἐφάνητε의 '나타나다/드러나다'의 뉘앙스를 한국어에서 출생의 기원에 대한 미지로 자연스럽게 풀어 '들어오게 되다'로 옮겼고, κοιλία는 문맥상 '자궁'이 가장 직접적입니다.
- source_word: τὸ πνεῦμα καὶ τὴν ζωὴν
  english_pob_choice: spirit and life
  chosen_korean: 영과 생명
  alternatives_korean:
  - 호흡과 생명
  - 영과 삶
  lexicon: BDAG
  rationale: POB의 주석이 지적하듯 πνεῦμα는 '영/호흡/바람'의 폭이 있으나, 여기서는 ζωή와 구별되는 생명의 원리로서의 '영'을 보존하는 편이 원문 긴장을 더 잘 드러냅니다.
- source_word: ἐχαρισάμην
  english_pob_choice: granted
  chosen_korean: 주지
  alternatives_korean:
  - 베풀지
  - 허락하지
  lexicon: BDAG
  rationale: '''주다''보다 은혜로운 부여의 성격을 가진 ''주다/베풀다''의 어감을 살리면서도, 원문의 ''은총으로 부여하다''는 뜻을 과장하지 않기 위해 ''주지''로 옮겼습니다.'
- source_word: τὴν ἑκάστου στοιχείωσιν ... διερρύθμισα
  english_pob_choice: the formation of each of you ... arranged
  chosen_korean: 여러분 각자의 구성도 제가 배열한 것이 아닙니다
  alternatives_korean:
  - 여러분 각자의 형성도 제가 정한 것이 아닙니다
  - 각 사람의 구성도 제가 조직한 것이 아닙니다
  lexicon: LSJ
  rationale: στοιχείωσις와 διερρύθμισα의 '구성/배열/정렬' 의미를 함께 살려, 육체적·생물학적 형성의 질서를 어머니가 부여한 것이 아니라는 점을 드러내는 표현을 택했습니다.
theological_decisions:
- issue: πνεῦμα의 번역 범위
  chosen_reading: 영
  alternative_readings:
  - 호흡
  - 정신
  rationale: 이 구절은 ζωή와 병렬로 서 있어 단순한 호흡보다 생명에 작용하는 비물질적 차원을 포함하는 '영'이 원문의 폭을 더 잘 보존합니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 3
- issue: 어머니의 부정이 뜻하는 바
  chosen_reading: 어머니는 아들의 생명과 몸의 궁극적 기원자라는 뜻에서 그 출처를 부정합니다.
  alternative_readings:
  - 어머니 역할 자체를 부정함
  - 출산에 대한 모든 책임을 부정함
  rationale: 원문은 모성을 부정하려는 것이 아니라 생명의 기원과 형성의 주권이 자신에게 있지 않다는 고백입니다. 이 긴장을 한국어에서도 유지했습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 3
