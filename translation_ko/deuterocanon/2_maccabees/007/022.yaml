- from: 저는 여러분이 어떻게 제 자궁에 들어오게 되었는지 알지 못합니다. 또 여러분에게 영과 생명을 준 사람도 저가 아니며, 여러분 각자의 구성도 제가 배열한 것이 아닙니다.[a]
  to: 저는 여러분이 어떻게 제 태중에 생겨났는지 알지 못합니다. 또 여러분에게 영[a]과 생명을 준 이도 제가 아니며, 여러분 각자의 구성을 제가 정한 것도 아닙니다.
  rationale: 문법 오류인 ‘저가’를 ‘제가’로 바로잡고, 출생 기원에 대한 원문의 표현을 현대 성경 한국어에 자연스러운 ‘태중에 생겨났는지’로 다듬었습니다. 마지막 절은 ‘구성’과 ‘정한’을 결합하여 στοιχείωσις와 διερρύθμισα의 형성·질서 부여 의미를 유지했습니다. πνεῦμα의 번역과 대안 주석은 보존하되 표지를 해당 단어에 연결했습니다.
  reviewer_model: gpt-5.6-terra
