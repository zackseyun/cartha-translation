    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그가 그를 보며 말했습니다. “당신은 사람들 가운데서 권한을 가지고 있으면서, 죽을 몸인 한, 하고 싶은 대로 합니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람들 가운데서’입니다. 그리스어는 남성 복수형을 쓰지만 일반적인 인간 집단을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘썩어질 존재인’, ‘소멸할 수 있는 존재인’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πρὸς αὐτὸν ἰδὼν
  english_pob_choice: But looking at him
  chosen_korean: 그러나 그가 그를 보며
  alternatives_korean:
  - 그러나 그를 바라보고
  - 그런데 그를 보고
  lexicon: LSJ
  rationale: δὲ를 역접적 전환으로 살려 ‘그러나’로 옮기고, ἰδών의 시각적 대면성을 ‘그를 보며’로 자연스럽게 표현했습니다.
- source_word: Ἐξουσίαν
  english_pob_choice: authority
  chosen_korean: 권한
  alternatives_korean:
  - 권세
  - 권위
  - 권력
  lexicon: BDAG/LSJ
  rationale: 여기서는 사람들 사이에서 행사되는 지배적 자격을 가리키므로, 한국어에서는 ‘권한’이 가장 직접적이고 문맥상 과장되지 않습니다.
- source_word: ἐν ἀνθρώποις
  english_pob_choice: among men
  chosen_korean: 사람들 가운데서
  alternatives_korean:
  - 인간들 가운데서
  - 사람들 위에
  - 사람들 사이에서
  lexicon: LSJ
  rationale: ἐν + 여격의 범위 의미를 살려 ‘가운데서’로 옮겼고, 남성 복수의 일반적 용법은 한국어에서 중립적인 ‘사람들’로 반영했습니다.
- source_word: φθαρτὸς ὤν
  english_pob_choice: being mortal
  chosen_korean: 죽을 몸인
  alternatives_korean:
  - 죽을 존재인
  - 썩어질 존재인
  - 소멸할 몸인
  lexicon: LSJ
  rationale: φθαρτός의 ‘멸망/소멸 가능성’ 중 이 문맥의 논점을 가장 잘 드러내는 것은 인간의 유한성과 죽음을 지시하는 표현이므로, ‘죽을 몸인’으로 옮겼습니다.
theological_decisions:
- issue: φθαρτὸς ὤν의 인간적 유한성 표현
  chosen_reading: 죽을 몸인
  alternative_readings:
  - 썩어질 존재인
  - 소멸할 몸인
  - 죽을 수밖에 없는
  rationale: 이 대목은 통치자의 권세를 인간의 죽음과 유한성 아래 둡니다. ‘죽을 몸인’은 신학적 과장을 피하면서도 논쟁의 날을 분명히 살립니다.
  doctrine_reference: 인간론/유한성, 통치 권세의 상대성
