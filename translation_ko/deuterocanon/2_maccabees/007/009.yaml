base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/009.yaml
  text: And as he was at his last breath[a], he said, “You, accursed wretch, release us from this present life, but the King of the world will raise us up, who have died for his laws[b], into an everlasting renewal of life.”
  footnotes:
  - marker: a
    text: Or 'wretch' or 'accursed one' for the insult ἀλάστωρ.
    reason: lexical_alternative
  - marker: b
    text: The Greek phrase literally combines 'everlasting' with a rare noun meaning 'living again' or 'revival'; alternatively, 'to an eternal resurrection to life.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 마지막 숨을 거두면서 이렇게 말했습니다. 「너, 저주받은 자야, 지금 이 생명에서 우리를 풀어 주어라. 그러나 세상의 왕께서는 그의 율법들 때문에 죽은 우리를 영원한 생명의 새로움으로 다시 일으키실 것입니다。」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 ἀλάστωρ는 강한 욕설로, ‘저주받은 자’ 외에도 ‘저주받은 놈’, ‘저주받은 악인’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어의 εἰς αἰώνιον ἀναβίωσιν ζωῆς는 문자적으로 ‘영원한 생명의 다시 살아남/회복’이라는 뉘앙스를 지니며, ‘영원한 부활로’라고도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐσχάτῃ δὲ πνοῇ γενόμενος
  english_pob_choice: as he was at his last breath
  chosen_korean: 그가 마지막 숨을 거두면서
  alternatives_korean:
  - 그가 마지막 숨결에 이르러
  - 그가 죽음의 마지막 순간에
  lexicon: LSJ
  rationale: “ἐσχάτῃ πνοῇ”는 마지막 숨을 가리키므로, 한국어에서는 자연스럽고 생생한 “마지막 숨을 거두다”로 옮겼습니다.
- source_word: ἀλάστωρ
  english_pob_choice: accursed wretch
  chosen_korean: 저주받은 자
  alternatives_korean:
  - 저주받은 놈
  - 저주받은 악인
  - 저주받은 사람
  lexicon: LSJ
  rationale: 직접적인 모욕 표현이므로, 표준어 합쇼체 본문에서는 욕설의 강도를 살리되 과도한 구어체를 피하는 “저주받은 자”를 택했습니다.
- source_word: ἐκ τοῦ παρόντος ἡμᾶς ζῆν ἀπολύεις
  english_pob_choice: release us from this present life
  chosen_korean: 지금 이 생명에서 우리를 풀어 주어라
  alternatives_korean:
  - 이 현재의 삶에서 우리를 놓아 주어라
  - 이 현세에서 우리를 놓아 주어라
  - 지금의 삶에서 우리를 해방시켜라
  lexicon: BDAG
  rationale: 문맥상 죽음으로 현세의 삶을 끊는다는 뜻이므로, “풀어 주다”를 써서 ‘놓아 주다/해방하다’의 의미를 살리면서도 자연스럽게 표현했습니다.
- source_word: ὁ δὲ τοῦ κόσμου βασιλεὺς
  english_pob_choice: the King of the world
  chosen_korean: 세상의 왕께서는
  alternatives_korean:
  - 세상의 왕은
  - 세계를 다스리시는 왕께서는
  - 온 세상의 왕께서는
  lexicon: LSJ
  rationale: κόσμος의 기본 대립을 살려 “세상”으로 옮겼고, 왕을 향한 인물의 발화이므로 존칭을 사용했습니다.
- source_word: ὑπὲρ τῶν αὐτοῦ νόμων
  english_pob_choice: for his laws
  chosen_korean: 그의 율법들 때문에
  alternatives_korean:
  - 그의 율법들을 위해
  - 그의 율법들을 위하여
  - 그의 법들 때문에
  lexicon: BDAG
  rationale: 순교의 원인을 나타내므로 원인 관계를 분명히 하는 “때문에”를 택했고, νόμος는 프로젝트 기본값에 따라 “율법”으로 옮겼습니다.
- source_word: εἰς αἰώνιον ἀναβίωσιν ζωῆς
  english_pob_choice: into an everlasting renewal of life
  chosen_korean: 영원한 생명의 새로움으로
  alternatives_korean:
  - 영원한 생명으로의 새로움 속으로
  - 영원한 생명의 회복으로
  - 영원한 생명으로의 부활로
  lexicon: LSJ
  rationale: ἀναβίωσις는 단순한 부활 용어보다 “다시 살아남/되살아남”의 뉘앙스를 지니므로, “새로움”으로 생명의 갱신성을 살렸습니다.
theological_decisions:
- issue: 부활과 생명의 갱신 표현의 결합
  chosen_reading: 하나님께서 순교자들을 죽음 이후 영원한 생명의 새로움으로 다시 일으키신다는 뜻을 함께 유지했습니다.
  alternative_readings:
  - “영원한 부활로”처럼 더 직접적인 부활 용어로 풀 수 있습니다.
  - “영원한 생명으로”로 단순화할 수도 있습니다.
  rationale: 그리스어는 ἀναστήσει와 εἰς αἰώνιον ἀναβίωσιν ζωῆς를 함께 사용하여 ‘일으키심’과 ‘다시 살아나는 삶의 새로움’을 모두 말하므로, 둘 중 하나로 평평하게 만들지 않았습니다.
  doctrine_reference: 부활 언어와 생명 갱신 언어를 함께 보존함
- issue: 왕에 대한 존칭 처리
  chosen_reading: ‘세상의 왕께서는’으로 존칭을 사용했습니다.
  alternative_readings:
  - 단순히 “세상의 왕은”으로도 옮길 수 있습니다.
  rationale: 문맥상 순교자가 하나님을 직접 호칭하는 진술이므로, 한국어 합쇼체 본문에서는 존칭이 자연스럽고 신학적으로도 적절합니다.
  doctrine_reference: 직접 화법에서의 예배적 존칭 유지
