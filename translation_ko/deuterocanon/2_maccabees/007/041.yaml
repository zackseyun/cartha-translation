  yaml_path: translation/deuterocanon/2_maccabees/007/041.yaml
  text: And last of the sons[a], the mother died.
  footnotes:
  - marker: a
    text: Or, 'Finally, after the sons, the mother died.' The Greek phrase can be understood as a brief sequencing notice, though 'last of the sons' more closely follows the wording of the source.
    reason: lexical_alternative
translation:
  language: ko
  text: 아들들에 이어 마침내 어머니가 죽었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “마지막으로 어머니가 죽었습니다.” 그리스어 ἐσχάτῃ는 여기서 사건의 순서를 나타내어 ‘마침내’ 또는 ‘마지막으로’라는 뜻으로 이해할 수 있습니다. τῶν υἱῶν은 아들들과 관련된 순서, 곧 아들들 뒤를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσχάτῃ
  english_pob_choice: last
  chosen_korean: 마지막에
  alternatives_korean:
  - 끝에
  - 마침내
  lexicon: BDAG
  rationale: 여기서는 사건의 순서를 표시하는 부사적 용법이므로, 간결하게 ‘마지막에’로 옮겨 원문의 서술 순서를 그대로 살렸습니다.
- source_word: τῶν υἱῶν
  english_pob_choice: of the sons
  chosen_korean: 아들들 가운데
  alternatives_korean:
  - 아들들 중에
  - 아들들의
  lexicon: BDAG
  rationale: υἱῶν은 넓은 ‘자녀들’이 아니라 ‘아들들’이므로 이를 유지했고, ἐσχάτῃ와의 결합을 한국어에서 자연스럽게 풀어 ‘아들들 가운데’로 표현했습니다.
- source_word: ἡ μήτηρ
  english_pob_choice: the mother
  chosen_korean: 어머니가
  alternatives_korean:
  - 어머니는
  - 그 어머니가
  lexicon: BDAG
  rationale: 정관사와 명사는 이미 문맥상 특정된 인물을 가리키므로, 한국어에서는 주어 표지로 ‘어머니가’를 사용해 간결성을 유지했습니다.
- source_word: ἐτελεύτησεν
  english_pob_choice: died
  chosen_korean: 죽었습니다
  alternatives_korean:
  - 숨을 거두었습니다
  - 세상을 떠났습니다
  lexicon: BDAG
  rationale: τελευτάω의 직접적 의미를 살려 완곡어보다 직설적인 ‘죽었습니다’를 선택해, 본문의 장엄하고 절제된 문체를 보존했습니다.
