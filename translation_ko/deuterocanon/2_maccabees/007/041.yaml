  text: 그리고 아들들 가운데 마지막에 어머니가 죽었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “마침내 아들들 뒤에 어머니가 죽었습니다.” ἐσχάτῃ는 여기서 짧은 순서 표시로도 이해될 수 있으나, 본문 어순을 더 가깝게 따르기 위해 본문에는 “마지막에”를 두었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσχάτῃ
  english_pob_choice: last
  chosen_korean: 마지막에
  alternatives_korean:
  - 끝에
  - 마침내
  lexicon: BDAG
  rationale: 여기서는 사건의 순서를 표시하는 부사적 용법이므로, 간결하게 ‘마지막에’로 옮겨 원문의 서술 순서를 그대로 살렸습니다.
