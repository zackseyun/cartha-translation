base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/008.yaml
  text: But he answered in the language of his fathers and said[a], “No.” Therefore this one also received the next torture, like the first.
  footnotes:
  - marker: a
    text: Or “in his ancestral language” or “in his native tongue.” The Greek literally refers to the paternal/ancestral speech.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그는 조상들의 언어[a]로 대답하여 “아니오.”라고 말했습니다. 그러므로 이 사람도 첫째 사람처럼 이어지는 고문을 받았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 조상들의 언어로’, ‘그의 모국어로’라고 옮길 수 있습니다. 그리스어는 문자적으로 ‘아버지들의/조상들의 말’을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... προσεῖπεν
  english_pob_choice: answered ... said
  chosen_korean: 대답하며 ...라고 하였습니다
  alternatives_korean:
  - 대답하고 ...라고 말했습니다
  - 응답하며 ...라고 하였습니다
  lexicon: BDAG / LSJ
  rationale: ἀποκριθεὶς와 προσεῖπεν이 함께 직접 화법을 여는 구조이므로, 한국어에서는 ‘대답하며’와 인용형으로 자연스럽게 살렸습니다.
- source_word: τῇ πατρίῳ φωνῇ
  english_pob_choice: in the language of his fathers
  chosen_korean: 조상들의 언어로
  alternatives_korean:
  - 선조들의 언어로
  - 그의 조상적 언어로
  - 모국어로
  lexicon: LSJ
  rationale: φωνή는 단순한 ‘목소리’가 아니라 여기서 언어/말을 뜻하므로, POB의 해설처럼 혈연·조상적 뉘앙스를 살려 ‘조상들의 언어로’로 옮겼습니다.
- source_word: Οὐχί
  english_pob_choice: 'No'
  chosen_korean: 아니오
  alternatives_korean:
  - 아닙니다
  - 아니요
  - 절대 아닙니다
  lexicon: BDAG
  rationale: 짧고 강한 부정을 직설적으로 전달하면서도 현대 한국어의 문장부호와 직접 화법에 맞게 정리했습니다.
- source_word: τὴν ἑξῆς βάσανον
  english_pob_choice: the next torture
  chosen_korean: 다음 고문
  alternatives_korean:
  - 이어지는 고문
  - 다음 형벌
  - 뒤이어 온 고문
  lexicon: BDAG
  rationale: βάσανος는 심문·처벌을 동반한 잔혹한 고문을 가리키므로, 순서감을 담은 ‘다음’과 함께 ‘고문’을 택했습니다.
theological_decisions:
- issue: τῇ πατρίῳ φωνῇ의 문화적·정체성적 함의
  chosen_reading: ‘조상들의 언어로’는 단순한 언어 정보가 아니라, 박해 속에서도 조상 전승과 민족 정체성을 드러내는 표현으로 읽었습니다.
  alternative_readings:
  - ‘모국어로’
  - ‘선조들의 말로’
  rationale: 문맥상 발화 방식 자체가 신앙적 저항과 공동체 정체성을 보여 주므로, 의미를 약화시키는 일반어보다 조상성(ancestral)과 언어성을 함께 드러내는 번역을 선택했습니다.
  doctrine_reference: '번역 원칙: 원문 우선, 문맥적 함의 보존'
