  text: But as for you[a], do not suppose that you will be innocent, having attempted to fight against God.
  footnotes:
  - marker: a
    text: Or 'having attempted to oppose God.' The Greek verb is literally 'to fight against God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 당신은, 하나님께 맞서려 하였으니 무죄하게 될 것이라고 생각하지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님을 대적하려 하였으니’. 그리스어 동사는 문자적으로 ‘하나님과 싸우다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  english_pob_choice: But as for you
  chosen_korean: 그런데 당신은
  alternatives_korean:
  - 하지만 당신은
  - 그런데 그대는
  lexicon: LSJ
  rationale: δέ의 대조를 살리면서 δεύτερος 인칭의 직접적 책망을 한국어로 자연스럽게 드러냈습니다.
- source_word: μὴ νομίσῃς
  english_pob_choice: do not suppose
  chosen_korean: 생각하지 마십시오
  alternatives_korean:
  - 추정하지 마십시오
  - 여기지 마십시오
  lexicon: LSJ
  rationale: νομίζω의 ‘잘못된 판단/가정’을 현대 한국어 경고문체로 옮겼습니다.
- source_word: ἀθῷος
  english_pob_choice: innocent
  chosen_korean: 무죄하게
  alternatives_korean:
  - 죄 없게
  - 무죄한 것으로
  lexicon: LSJ
  rationale: 문맥상 ‘죄책에서 벗어나 있다’는 상태를 나타내므로 형용사적 ‘무죄하게’로 풀어 자연스럽게 했습니다.
- source_word: θεομαχεῖν
  english_pob_choice: to fight against God
  chosen_korean: 하나님께 맞서려
  alternatives_korean:
  - 하나님과 싸우려
  - 하나님을 대적하려
  lexicon: LSJ
  rationale: 그리스어 복합어의 직설적 힘을 살리되, 한국어에서는 ‘맞서다’가 전투적 대립과 적대의 뉘앙스를 함께 전달합니다.
theological_decisions:
- issue: θεομαχεῖν의 신학적 강도
  chosen_reading: ‘하나님께 맞서다’로 직역에 가까운 강한 표현을 유지했습니다.
  alternative_readings:
  - 하나님을 대적하다
  - 하나님과 싸우다
  rationale: 이 구절은 박해를 단순한 인간 갈등이 아니라 하나님 자신에 대한 도전으로 규정하므로, 그 긴장을 약화시키지 않도록 했습니다.
  doctrine_reference: 원문 우선 원칙; 박해의 신학적 책임을 하나님 대적 개념으로 보존
