  yaml_path: translation/deuterocanon/2_maccabees/007/030.yaml
  text: And while she was still finishing[a], the young man said, “What are you waiting for? I do not obey the king’s command, but I obey the command of the law that was given to our fathers through Moses.”
  footnotes:
  - marker: a
    text: Or, “What are you waiting for?” The Greek question is elliptical and can be rendered either way in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분이 아직 말을 마치기도 전에, 그 젊은이가 말했습니다. 「무엇을 기다리고 있습니까? 나는 왕의 명령에는 순종하지 않겠습니다. 그러나 우리 조상들에게 모세를 통해 주어진 율법의 명령에는 순종합니다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “무엇을 기다리고 있습니까?” 그리스어의 물음은 생략형이어서 한국어로는 여러 방식으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι δὲ ταύτης καταληγούσης
  english_pob_choice: And while she was still finishing
  chosen_korean: 그분이 아직 말을 마치기도 전에
  alternatives_korean:
  - 그분이 아직 말을 끝내고 있는 동안
  - 그분이 아직 말하고 있는 동안
  lexicon: LSJ
  rationale: γενitive absolute가 앞선 여성 화자의 발화와 동시성을 나타내므로, 한국어에서는 자연스럽게 ‘말을 마치기도 전에’로 옮겨 시간 중첩을 살렸습니다.
- source_word: ὁ νεανίας
  english_pob_choice: the young man
  chosen_korean: 그 젊은이
  alternatives_korean:
  - 그 청년
  - 그 젊은 남자
  lexicon: LSJ
  rationale: νεανίας는 문맥상 형제들 가운데 한 젊은 남성을 가리키므로, 현대 한국어에서 자연스러운 ‘젊은이’를 택했습니다.
- source_word: Τίνα μένετε;
  english_pob_choice: What are you waiting for?
  chosen_korean: 무엇을 기다리고 있습니까?
  alternatives_korean:
  - 왜 기다리고 있습니까?
  - 무엇을 지체하고 있습니까?
  lexicon: LSJ
  rationale: 목적어가 생략된 물음형을 한국어에서 자연스럽게 보완하되, 도전적 어조를 유지하기 위해 ‘무엇을 기다리고 있습니까?’로 옮겼습니다.
- source_word: τοῦ προστάγματος τοῦ βασιλέως
  english_pob_choice: the king’s command
  chosen_korean: 왕의 명령
  alternatives_korean:
  - 왕의 계명
  - 왕의 칙령
  lexicon: LSJ
  rationale: πρόσταγμα은 명령/지시의 뜻이므로, 뒤의 율법의 명령과 병렬을 살리기 위해 ‘명령’이 가장 적절합니다.
- source_word: τοῦ δὲ προστάγματος ἀκούω τοῦ νόμου
  english_pob_choice: but I obey the command of the law
  chosen_korean: 그러나 … 율법의 명령에는 순종합니다
  alternatives_korean:
  - 그러나 … 율법의 명령을 듣습니다
  - 그러나 … 율법을 따릅니다
  lexicon: LSJ
  rationale: ἀκούω가 여기서는 단순 청취가 아니라 복종의 의미로 쓰이므로 ‘순종하다’로 옮겨 ὑπακούω와의 대조를 분명히 했습니다.
- source_word: τοῦ δοθέντος τοῖς πατράσιν ἡμῶν
  english_pob_choice: that was given to our fathers
  chosen_korean: 우리 조상들에게 … 주어진
  alternatives_korean:
  - 우리 조상들에게 … 전해진
  - 우리 아버지들에게 … 주어진
  lexicon: LSJ
  rationale: πατράσιν의 직역인 ‘아버지들’은 한국어에서 어색하므로, 계승적 언약 맥락을 살리면서도 자연스러운 ‘우리 조상들’로 옮겼습니다.
- source_word: διὰ Μωσῆ
  english_pob_choice: through Moses
  chosen_korean: 모세를 통해
  alternatives_korean:
  - 모세를 거쳐
  - 모세에 의해
  lexicon: LSJ
  rationale: διά + 속격의 매개적 의미를 한국어의 관용적 표현 ‘~를 통해’로 반영했습니다.
theological_decisions:
- issue: πατράσιν의 인칭·성별 처리
  chosen_reading: ‘우리 조상들’로 번역해 가부장적 직역을 피하되, 언약 전승의 계승성을 유지했습니다.
  alternative_readings:
  - 우리 아버지들
  - 우리 선조들
  rationale: 문맥은 혈연적 남성들만이 아니라 이스라엘의 조상 전승 전체를 가리키므로, 한국어에서는 의미를 보존하면서도 독자가 자연스럽게 이해할 수 있는 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
