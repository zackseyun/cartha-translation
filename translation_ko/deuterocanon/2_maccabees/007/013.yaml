  - 네 번째 형제를
  lexicon: LSJ
  rationale: 그리스어는 단순히 ‘네 번째’라고만 하므로, 문맥상 생략된 대상을 한국어에서만 보충하되 지나치게 해석을 덧붙이지 않기 위해 ‘사람을’로 완만하게 보완했습니다.
- source_word: ἐβασάνιζον
  english_pob_choice: they were torturing
  chosen_korean: 고문하며
  alternatives_korean:
  - 고문하고 있었고
  - 고문했습니다
  - 괴롭히며
  lexicon: LSJ
  rationale: 기본 의미가 물리적 고문이므로 ‘고문하다’를 택했고, 미완료의 지속성을 한국어 부사절로 살려 진행 중인 행위를 표현했습니다.
- source_word: αἰκιζόμενοι
  english_pob_choice: abusing him
  chosen_korean: 학대했습니다
  alternatives_korean:
  - 모욕하며
  - 폭행하며
  - 잔혹하게 다루며
  lexicon: LSJ
  rationale: ἐβασάνιζον과 병렬로 붙는 부가적 폭력 행위이므로 ‘학대하다’가 가장 무난하게 폭력성과 반복성을 담아냅니다.
