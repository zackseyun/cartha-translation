  rationale: 기본 의미가 물리적 고문이므로 ‘고문하다’를 택했고, 미완료의 지속성을 한국어 부사절로 살려 진행 중인 행위를 표현했습니다.
- source_word: αἰκιζόμενοι
  english_pob_choice: abusing him
  chosen_korean: 학대했습니다
  alternatives_korean:
