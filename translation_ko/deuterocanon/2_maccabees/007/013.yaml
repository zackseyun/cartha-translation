lexical_decisions:
- source_word: μεταλλάξαντος
  english_pob_choice: had died
  chosen_korean: 죽자
  alternatives_korean:
  - 세상을 떠나자
  - 죽었을 때
  - 죽은 뒤
  lexicon: LSJ
  rationale: 여기서 분사구문은 앞선 사람의 죽음을 에둘러 말하는 관용적 용법이므로, 한국어에서는 간결하게 ‘죽자’로 옮겨 사건의 진행을 자연스럽게 드러냈습니다.
- source_word: τὸν τέταρτον
