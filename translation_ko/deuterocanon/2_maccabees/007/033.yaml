  text: But if our living Lord has become angry for a little while for the sake of rebuke and discipline[b][a], he will again be reconciled with his own slaves.
  footnotes:
  - marker: a
    text: Or 'his own servants.' The Greek word is doulois, which can mean either 'slaves' or 'servants' depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'he will again be appeased toward his own slaves/servants.' The Greek verb can emphasize restored favor after anger.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 우리 살아 계신 주님께서 잠시 책망과 훈계를 위해 분노하셨다면, 다시 자기 노예들과 화해하실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘노예들’은 δοῦλοις의 직접적 의미를 살린 번역입니다. 이 단어는 문맥에 따라 ‘종들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘화해하실 것입니다’는 동사의 관계 회복 강조를 살린 번역입니다. 문맥상 ‘다시 호의를 베푸실 것입니다’로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ
  english_pob_choice: But if
  chosen_korean: 그러나 …라면
  alternatives_korean:
  - 그리고 만일 …라면
  - 만일 …라면
  lexicon: LSJ
  rationale: 앞선 문맥과의 약한 대비를 살리기 위해 ‘그러나’로 옮기되, 조건문의 구조는 유지했습니다.
- source_word: ὁ ζῶν κύριος ἡμῶν
  english_pob_choice: our living Lord
  chosen_korean: 우리 살아 계신 주님
  alternatives_korean:
  - 우리의 살아 계신 주님
  - 우리 살아 계신 주
  lexicon: LSJ
  rationale: ζῶν은 단순히 ‘살아 있는’보다 현재의 생동성과 대조를 살리는 ‘살아 계신’이 자연스럽고, κύριος는 본문 관행에 따라 ‘주님’으로 옮겼습니다.
- source_word: δούλοις
  english_pob_choice: his own slaves
  chosen_korean: 자기 노예들
  alternatives_korean:
  - 자기 종들
  - 자기 종복들
  lexicon: LSJ
  rationale: POB의 주석과 용례상 δοῦλοις는 소속된 예속 상태를 드러내야 하므로 ‘노예들’을 택했습니다. ‘자기’는 ἑαυτοῦ의 소속성과 언약적 귀속을 반영합니다.
- source_word: καταλλαγήσεται
  english_pob_choice: he will again be reconciled with
  chosen_korean: 다시 …과 화해하실 것입니다
  alternatives_korean:
  - 다시 …과 화목하실 것입니다
  - 다시 …과 관계를 회복하실 것입니다
  lexicon: LSJ
  rationale: 이 동사는 단순 감정 완화보다 관계의 회복을 가리키므로, 능동적이고 관계적인 ‘화해하실 것입니다’가 가장 직접적입니다.
theological_decisions:
- issue: 하나님의 분노와 이후의 회복을 어떻게 표현할지
  chosen_reading: ‘잠시 책망과 훈계를 위해 분노하셨다면’으로 옮겨, 분노가 교정 목적을 가진 일시적 행위임을 드러냈습니다.
  alternative_readings:
  - ‘잠시 노하셨다면’
  - ‘잠시 진노하셨다면’
  rationale: 본문의 χάριν ἐπιπλήξεως καὶ παιδίας는 단순 감정 폭발이 아니라 책망과 훈계의 목적을 분명히 하므로, 그 긴장을 유지해야 합니다.
  doctrine_reference: Translation philosophy §3; divine discipline in 2 Maccabees context
