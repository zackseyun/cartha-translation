  source_fidelity: ‘어머니의 깊은 애정’은 문맥상 σπλαγχνισμούς가 가리키는 모성적 깊은 정과 연민을 자연스럽게 반영합니다. 다만 ὑπερβαλλούσας의 ‘한도를 넘는/극심한’ 강도에는 ‘엄청난’보다 ‘극심한’이 더 정확하고 문어적입니다. ἐπὶ τοσούτου δεδηλώσθω는 단순한 상태 진술보다 서술을 공식적으로 종결하는 표현이므로 ‘이 정도로 밝혀 두겠습니다’로 옮기는 편이 낫습니다.
  naturalness: ‘그러므로 이제’는 전환 표지로 다소 겹칩니다. ‘그러면’으로 간결하게 처리하고, ‘이만하면 충분합니다’ 대신 서술 종결에 맞는 ‘이 정도로 밝혀 두겠습니다’를 사용하면 현대 한국어 합쇼체의 문어체 흐름이 자연스럽습니다.
  terminology: ‘고문’은 이 순교 서사의 구체적 폭력을 가리키는 αἰκίαι에 적절합니다. σπλαγχνισμούς는 문자적 신체어에서 유래한 복수형이지만 여기서는 추상적 정서를 뜻하므로 본문의 단수 집합명사 ‘깊은 애정’은 무방합니다. 각주에서는 ‘깊은 정/연민’이라는 의미 범위를 밝혀 줍니다.
