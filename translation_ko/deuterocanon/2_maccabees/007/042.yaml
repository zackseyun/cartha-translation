  - 학대
  - 잔혹한 처우
  lexicon: LSJ
  rationale: αἰκία는 폭행, 학대, 잔혹한 처우를 뜻하지만, 여기서는 마카베오스의 순교 서사에서 가해진 구체적 폭력을 가리키므로 ‘고문’이 가장 직접적입니다.
- source_word: ὑπερβαλλούσας
  english_pob_choice: extraordinary
  chosen_korean: 엄청난
  alternatives_korean:
  - 지나친
  - 극심한
  - 비상한
  lexicon: LSJ
  rationale: ὑπερβαλλούσας는 ‘도를 넘는, 지나친’의 강조형이므로 한국어에서는 정도를 강하게 드러내는 ‘엄청난’으로 옮겨 과장의 힘을 살렸습니다.
- source_word: ἐπὶ τοσούτου δεδηλώσθω
  english_pob_choice: let this be enough
  chosen_korean: 이만하면 충분합니다
  alternatives_korean:
  - 이 정도로 밝혀 두십시오
  - 이만큼만 말해 두겠습니다
  - 이쯤에서 마치겠습니다
  lexicon: LSJ
  rationale: 관용적으로 서술을 마무리하는 공식이므로, ‘이만하면 충분합니다’로 옮겨 종결 의도와 합쇼체의 문체를 함께 반영했습니다.
