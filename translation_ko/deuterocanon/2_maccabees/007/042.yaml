lexical_decisions:
- source_word: σπλαγχνισμούς
  english_pob_choice: the compassions / the mother’s compassion
  chosen_korean: 어머니의 깊은 애정
  alternatives_korean:
  - 연민
  - 자비심
  - 속 깊은 정
  lexicon: LSJ
  rationale: σπλαγχνισμοί는 문자적으로 내장/깊은 정서를 가리키지만, 이 문맥에서는 순교 서사의 어머니가 보인 모성적 애정과 가엾이 여김을 가리키므로 한국어로는 ‘어머니의 깊은 애정’이 가장 자연스럽고 원문의 정서도 살립니다.
- source_word: αἰκίας
