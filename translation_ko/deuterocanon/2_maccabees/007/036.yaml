  text: For our brothers[a], having now endured a brief pain, have fallen under God's covenant into everlasting life; but you, by the judgment of God, will justly bear the penalties of your arrogance.
  footnotes:
  - marker: a
    text: Or 'have died under God's covenant for everlasting life.' The Greek is compact, and 'have fallen' is a literal rendering of the verb.
    reason: alternative_reading
translation:
  language: ko
  text: 우리 형제들은 이제 잠시 고통을 겪고 하나님의 언약 아래 영원한 생명에 들어갔습니다[a]. 그러나 당신은 하나님의 심판에 따라 당신의 교만에 대한 마땅한 벌을 받게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '하나님의 언약 아래서 영원한 생명을 위하여 죽었습니다.' 그리스어 표현은 압축되어 있습니다. 동사는 문자적으로는 '쓰러졌습니다' 또는 '떨어졌습니다'라는 뜻입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: βραχὺν ἐπενέγκαντες πόνον
  english_pob_choice: having endured a brief pain
  chosen_korean: 잠시 고통을 겪었을 뿐이지만
  alternatives_korean:
  - 짧은 고통을 견뎠을 뿐이지만
  - 잠깐의 고난을 당했을 뿐이지만
  lexicon: LSJ
  rationale: βραχὺν은 시간의 짧음을, ἐπενέγκαντες πόνον은 고통을 겪거나 감당함을 나타내므로, 합쇼체 자연성을 살리면서도 고통의 경중 대비를 유지했습니다.
- source_word: ὑπὸ διαθήκην θεοῦ
  english_pob_choice: under God's covenant
  chosen_korean: 하나님의 언약 아래서
  alternatives_korean:
  - 하나님의 언약 아래에
  - 하나님의 언약 아래에서
  lexicon: LSJ
  rationale: ὑπό + 대격 구조의 보호/권위 아래 있음을 살려, 단순한 소속보다 언약의 범위와 지배를 드러내는 표현으로 옮겼습니다.
- source_word: πεπτώκασιν
  english_pob_choice: have fallen
  chosen_korean: 쓰러졌습니다
  alternatives_korean:
  - 떨어졌습니다
  - 무너졌습니다
  - 죽었습니다
  lexicon: LSJ
  rationale: 원문은 문자적으로는 '떨어졌습니다'이지만, 순교 문맥에서 죽음을 가리키므로 이미지를 살리면서도 한국어에서 자연스러운 '쓰러졌습니다'를 택했습니다.
- source_word: τῇ τοῦ θεοῦ κρίσει
  english_pob_choice: by the judgment of God
  chosen_korean: 하나님의 심판으로
  alternatives_korean:
  - 하나님의 판결로
  - 하나님의 판단으로
  lexicon: LSJ
  rationale: κρίσις는 법정적·신적 심판을 함께 담으므로, 문맥상 가장 직접적인 '심판'으로 옮겼습니다.
- source_word: πρόστιμα τῆς ὑπερηφανίας
  english_pob_choice: the penalties of your arrogance
  chosen_korean: 교만의 대가
  alternatives_korean:
  - 교만의 형벌
  - 교만의 벌
  lexicon: LSJ
  rationale: πρόστιμα는 부과된 벌/불이익을 뜻하지만, 한국어에서 관용적으로 자연스러운 '대가'가 교만에 대한 응보를 잘 전달합니다.
theological_decisions:
- issue: 순교자의 죽음을 '언약 아래서 영원한 생명으로' 연결하는 압축된 문장
  chosen_reading: 형제들의 고통과 죽음이 하나님의 언약 안에서 영원한 생명으로 이어진다는 연결을 본문의 압축성을 유지한 채 드러냈습니다.
  alternative_readings:
  - 하나님의 언약에 따라 영원한 생명을 얻었습니다
  - 하나님의 언약 아래서 죽어 영원한 생명에 들어갔습니다
  rationale: 원문은 짧은 고난, 언약, 생명의 연계를 한 문장에 압축하므로, 이를 설명적으로 풀어내기보다 본문의 긴장을 살리는 방향이 적합합니다.
  doctrine_reference: 원문 우선, 순교-생명 연계의 신학적 압축성 보존
