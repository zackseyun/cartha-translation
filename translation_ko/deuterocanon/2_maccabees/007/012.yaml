  text: so that the king himself and those with him were astonished at the young man's spirit, because he regarded the sufferings as nothing.
translation:
  language: ko
  text: 그리하여 왕 자신과 함께 있던 사람들도 그 청년의 영에 놀랐습니다. 이는 그가 고통들을 아무것도 아닌 것으로 여겼기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὴν τοῦ νεανίου ψυχήν
  english_pob_choice: the young man's spirit
  chosen_korean: 그 청년의 영
  alternatives_korean:
  - 그 청년의 혼
  - 그 청년의 생명
  - 그 청년의 마음
  lexicon: ψυχή
  rationale: 본문은 ψυχή를 가리키며, English POB가 ‘spirit’로 옮긴 판단을 따라 한국어에서도 ‘영’으로 두어 청년의 내적 기개와 생명성의 울림을 함께 살렸습니다.
- source_word: ἐκπλήσσεσθαι
  english_pob_choice: were astonished
  chosen_korean: 놀랐습니다
  alternatives_korean:
  - 경탄했습니다
  - 깜짝 놀랐습니다
  - 경악했습니다
  lexicon: ἐκπλήσσω
  rationale: 강한 놀람과 압도됨을 나타내지만, 문맥상 과장 없이 자연스러운 현대 문체로 ‘놀랐습니다’를 선택했습니다.
- source_word: ὡς ἐνʼ οὐδενὶ τὰς ἀλγηδόνας ἐτίθετο
  english_pob_choice: because he regarded the sufferings as nothing
  chosen_korean: 이는 그가 고통들을 아무것도 아닌 것으로 여겼기 때문입니다
  alternatives_korean:
  - 이는 그가 고통들을 하찮게 여겼기 때문입니다
  - 이는 그가 고통들을 대수롭지 않게 여겼기 때문입니다
  - 이는 그가 고통들을 전혀 중요하게 여기지 않았기 때문입니다
  lexicon: ἀλγηδών
  rationale: 직역을 지나치게 거칠게 만들지 않으면서도, 고통을 실제로 ‘없다’고 본 태도를 드러내기 위해 ‘아무것도 아닌 것으로 여겼습니다’로 옮겼습니다.
theological_decisions:
- issue: ψυχή를 ‘영’으로 옮길지 ‘혼/생명’으로 옮길지
  chosen_reading: ‘영’은 청년의 내적 담대함과 인격적 중심을 드러내며, 바로 앞의 영어 POB 개정판도 ‘spirit’를 채택했습니다.
  alternative_readings:
  - ‘혼’은 헬라어 ψυχή의 넓은 의미를 더 직접적으로 반영합니다.
  - ‘생명’은 목숨의 소중함에 초점을 둘 수 있습니다.
  rationale: 순교 서술의 문맥에서 청년의 ψυχή는 단순한 생물학적 생명보다, 죽음 앞에서도 꺾이지 않는 내적 기세를 가리키므로 ‘영’이 본문 효과를 가장 잘 전달합니다.
  doctrine_reference: 순교 본문 해석; 인간 내면의 비체질적 측면에 대한 일반적 성서 용례
