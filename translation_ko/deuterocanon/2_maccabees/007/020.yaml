base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/020.yaml
  text: But the mother was especially admirable and worthy of honorable memory[a]; seeing her seven sons perish in a single day[b], she bore it courageously because of her hopes in the Lord.
  footnotes:
  - marker: a
    text: Or 'worthy of good remembrance.'
    reason: lexical_alternative
  - marker: b
    text: Or 'being killed'; the Greek says 'being destroyed/perishing,' a broader term used here in the context of their execution.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 어머니는 특히 훌륭하고, 훌륭한 기억에 값하시는 분이셨습니다[a]. 하루에 일곱 아들이 죽어 가는 것을 보면서도[b], 주님께 두는 자신의 희망들 때문에 용감하게 그것을 견디셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘좋은 기억에 값하시는 분’입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘살해되는’; 그리스어는 ‘멸망/소멸하는’이라는 더 넓은 뜻을 가지며, 여기서는 처형 맥락에서 쓰였습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὑπεραγόντως
  english_pob_choice: especially
  chosen_korean: 특히
  alternatives_korean:
  - 지극히
  - 매우
  - 매우나
  lexicon: LSJ
  rationale: 찬양의 강도를 자연스럽게 살리면서도 과장되지 않게 표현합니다.
- source_word: ἀγαθὴ καὶ μνήμης ἀγαθῆς ἀξία
  english_pob_choice: admirable and worthy of honorable memory
  chosen_korean: 훌륭하고, 훌륭한 기억에 값하시는
  alternatives_korean:
  - 선하고, 선한 기억에 값하시는
  - 존경할 만하고, 존경할 만한 기억에 값하시는
  - 선량하고, 좋은 기억에 값하시는
  lexicon: LSJ
  rationale: ἀγαθὴ는 단순한 ‘좋은’보다 칭찬과 도덕적 탁월성을 드러내므로 ‘훌륭하고’로 옮겼고, μνήμης ἀγαθῆς ἀξία는 기억할 만한 가치가 있음을 직접적으로 표현했습니다.
- source_word: ἀπολλυμένους
  english_pob_choice: being destroyed / perish
  chosen_korean: 죽어 가는
  alternatives_korean:
  - 멸망하는
  - 파멸하는
  - 희생되는
  lexicon: LSJ
  rationale: 이 분사형은 단순한 처형보다 더 넓은 ‘파괴·소멸’의 과정을 가리키므로, 순교 문맥에서 완곡하지 않으면서도 폭넓은 의미를 살리는 표현을 택했습니다.
- source_word: εὐψύχως ἔφερεν
  english_pob_choice: she bore it courageously
  chosen_korean: 용감하게 그것을 견디셨습니다
  alternatives_korean:
  - 담대하게 그것을 견디셨습니다
  - 굳센 마음으로 그것을 견디셨습니다
  - 용기 있게 그것을 감당하셨습니다
  lexicon: LSJ
  rationale: εὐψύχως의 ‘좋은/담대한 심기’를 한국어의 자연스러운 용기 표현으로 옮겼고, ἔφερεν은 ‘견디다’가 가장 직접적입니다.
- source_word: διὰ τὰς ἐπὶ Κύριον ἐλπίδας
  english_pob_choice: because of her hopes in the Lord
  chosen_korean: 주님께 두는 자신의 희망들 때문에
  alternatives_korean:
  - 주님께 둔 희망들 때문에
  - 주님 안에 있는 희망들 때문에
  - 주님께 두었던 희망들 때문에
  lexicon: LSJ
  rationale: 복수형 ἐλπίδας를 단수로 평준화하지 않고 ‘희망들’로 살렸으며, ἐπὶ + 대격의 방향성을 ‘주님께 두는’으로 표현했습니다.
theological_decisions:
- issue: κύριος의 번역
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 주 하느님
  rationale: 이 구절에서 희망의 대상은 하나님이시므로, 프로젝트 기본어인 ‘주님’을 사용해 경건한 직접성을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → 주님'
- issue: 복수형 ‘희망들’의 보존
  chosen_reading: 주님께 두는 자신의 희망들
  alternative_readings:
  - 주님께 두는 희망
  - 주님 안의 희망
  rationale: 그리스어 복수형을 유지해 텍스트가 지닌 다층적 기대와 신뢰의 결을 지우지 않도록 했습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
