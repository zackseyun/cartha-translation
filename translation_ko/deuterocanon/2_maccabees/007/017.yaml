  yaml_path: translation/deuterocanon/2_maccabees/007/017.yaml
  text: But do not think that our nation has been abandoned by God. But as for you[a], endure and see his great power, how it will torture you and your offspring.
  footnotes:
  - marker: a
    text: Or, 'how he will torture you and your offspring,' taking God rather than 'his majestic power' as the implied subject.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 우리 민족이 하나님께 버림받았다고 생각하지 마십시오. 그러나 당신은 견디십시오. 그리고 그의 위대한 권능[a]이 당신과 당신의 자손을 어떻게 고문할지를 보십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서는 ‘그의 위대한 권능’이 ‘고문할지’의 주어라는 해석을 따랐습니다. 하나님 자신을 주어로 이해하여 ‘그가 당신과 당신의 자손을 어떻게 고문할지’로 옮길 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ δόκει
  english_pob_choice: do not think
  chosen_korean: 생각하지 마십시오
  alternatives_korean:
  - 여기지 마십시오
  - 짐작하지 마십시오
  lexicon: LSJ
  rationale: μή + 현재 명령형의 금지를 한국어 합쇼체의 직접 금지로 옮겼습니다. ‘생각하다’는 본문의 책망성 있는 경고를 자연스럽게 살립니다.
- source_word: τὸ γένος ἡμῶν
  english_pob_choice: our nation
  chosen_korean: 우리 민족
  alternatives_korean:
  - 우리 백성
  - 우리 겨레
  - 우리 족속
  lexicon: LSJ
  rationale: γένος는 혈통/족속/민족을 아우를 수 있으나, 이 순교 대화에서는 공동체 전체를 가리키므로 ‘우리 민족’이 가장 자연스럽습니다.
- source_word: σὺ δὲ καρτέρει
  english_pob_choice: As for you, keep waiting / endure
  chosen_korean: 당신은 끝까지 견디며
  alternatives_korean:
  - 당신은 버티며
  - 당신은 인내하며
  - 당신은 기다리며
  lexicon: LSJ
  rationale: καρτερέω는 ‘견디다/버티다/인내하다’의 뜻이 있으며, 이어지는 ‘보고 있으라’는 말과 함께 조롱 섞인 도전으로 들리므로 ‘끝까지 견디며’로 옮겼습니다.
- source_word: τὸ μεγαλεῖον αὐτοῦ κράτος
  english_pob_choice: his majestic power
  chosen_korean: 그의 위대한 능력
  alternatives_korean:
  - 그의 장엄한 능력
  - 그의 عظ대한 힘
  - 그의 위엄 있는 능력
  lexicon: LSJ
  rationale: μεγαλεῖον과 κράτος가 함께 하나님의 위대함과 힘을 강조하므로, 직역의 경직함을 피하면서도 의미를 보존하는 ‘위대한 능력’을 택했습니다.
- source_word: ὡς σὲ καὶ τὸ σπέρμα σου βασανιεῖ
  english_pob_choice: how it will torture you and your offspring
  chosen_korean: 그것이 당신과 당신의 자손을 어떻게 고문할지
  alternatives_korean:
  - 그가 당신과 당신의 자손을 어떻게 고문할지
  - 당신과 당신의 자손을 어떻게 괴롭힐지
  lexicon: LSJ
  rationale: βασανίζω는 단순한 괴롭힘보다 고문/가혹한 형벌의 뜻이 강하므로 ‘고문하다’를 선택했습니다. τὸ σπέρμα σου는 여기서 문맥상 ‘자손’이 적절합니다.
theological_decisions:
- issue: basanisei의 주어를 '그것'으로 둘지 '그'로 둘지
  chosen_reading: 문맥상 가장 가까운 선행사인 ‘그의 위대한 능력’을 받아 ‘그것이’로 옮겼습니다.
  alternative_readings:
  - ‘그가 당신과 당신의 자손을 고문할지’로 하나님을 주어로 읽을 수 있습니다.
  rationale: 그리스어는 중성 단수 구절이 동사의 주어처럼 기능할 수 있으므로 표면 문법을 살려 번역하되, 하나님 자신의 행위로 이해될 여지도 보존해야 합니다.
  doctrine_reference: 신적 심판의 주체를 단정적으로 해소하지 않고 긴장을 유지합니다.
