  yaml_path: translation/deuterocanon/2_maccabees/007/034.yaml
  text: But you[a], O unholy one, most defiled of all men, do not be vainly puffed up, inflamed with uncertain hopes, having raised your hands against the children of heaven.
  footnotes:
  - marker: a
    text: Or 'the heavenly children.' The Greek can be read either as describing the children themselves as 'heavenly' or as 'children of heaven.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 너는, 오 불경한 자여, 모든 사람 가운데 가장 더러운 자여, 하늘의 자녀들[a]에게 손을 들어 대적한 채 불확실한 희망에 달아올라 헛되이 우쭐대지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘에 속한 자녀들’. 그리스어는 자녀 자체를 ‘하늘의’로 형용하는 뜻일 수도 있고, ‘하늘에 속한 자녀들’로 읽을 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόσιε
  english_pob_choice: unholy one
  chosen_korean: 불경한 자
  alternatives_korean:
  - 거룩하지 않은 자
  - 신성모독하는 자
  - 경건하지 않은 자
  lexicon: LSJ
  rationale: 직접적인 호칭형 비난을 살리면서도 종교적 결함을 분명히 드러내는 표현으로 옮겼습니다.
- source_word: μιαρώτατε
  english_pob_choice: most defiled
  chosen_korean: 가장 더러운 자
  alternatives_korean:
  - 가장 더럽혀진 자
  - 가장 부정한 자
  - 가장 추악한 자
  lexicon: LSJ
  rationale: 원문의 최상급이 지닌 의례적·도덕적 오염의 강도를 한국어에서 자연스럽게 드러냈습니다.
- source_word: μὴ μάτην μετεωρίζου φρυττόμενος ἀδήλοις ἐλπίσιν
  english_pob_choice: do not be vainly puffed up, inflamed with uncertain hopes
  chosen_korean: 헛되이 교만해지지 말고, 불확실한 희망에 들떠서
  alternatives_korean:
  - 헛되이 높아지지 말고, 알 수 없는 희망에 들떠서
  - 쓸데없이 치켜올라, 불확실한 희망에 끓어오르지 말고
  - 헛되이 부풀어 오르지 말고, 불확실한 희망에 사로잡혀
  lexicon: LSJ
  rationale: μετεωρίζου의 위로 들리는 이미지와 μάτην의 헛됨, φρυττόμενος의 달아오름을 합쇼체로 압축해 전달했습니다.
- source_word: οὐρανίους παῖδας
  english_pob_choice: the children of heaven
  chosen_korean: 하늘의 자녀들
  alternatives_korean:
  - 하늘의 아이들
  - 하늘에 속한 자녀들
  - 하늘의 자들
  lexicon: LSJ
  rationale: παῖδας의 ‘자녀들’ 의미를 살리되, 원문의 신학적 소속 개념을 ‘하늘의’로 유지했습니다.
- source_word: ἐπαράμενος χεῖρας
  english_pob_choice: having raised your hands against
  chosen_korean: 손을 들어 대적하지 마십시오
  alternatives_korean:
  - 손을 들어 올리지 마십시오
  - 손을 들어 맞서지 마십시오
  - 손을 들어 공격하지 마십시오
  lexicon: LSJ
  rationale: 손을 드는 행위의 공격적 방향성을 한국어 관용과 함께 살렸습니다.
theological_decisions:
- issue: οὐρανίους παῖδας의 신학적 지시
  chosen_reading: ‘하늘의 자녀들’로 두어 그들이 하늘에 속한 존재라는 점을 드러내되, 본문에 없는 설명적 확장을 하지 않았습니다.
  alternative_readings:
  - ‘하늘의 아이들’
  - ‘하늘에 속한 자녀들’
  - ‘하늘의 자들’
  rationale: 그리스어의 수식 관계를 과도하게 풀지 않고, POB의 ‘children of heaven’이 남긴 신학적 긴장을 보존했습니다.
  doctrine_reference: 소유/소속 관계를 암시하되 본문 밖의 명시적 호칭을 덧붙이지 않음.
