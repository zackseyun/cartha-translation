  yaml_path: translation/deuterocanon/2_maccabees/001/012.yaml
  text: For he himself drove those arrayed for battle in the holy city out into Persia[a][b].
  footnotes:
  - marker: a
    text: Or 'cast out' or 'expelled'; the Greek verb is forceful and depicts decisive removal.
    reason: lexical_alternative
  - marker: b
    text: Or 'those drawn up in battle order'; the Greek participle is a military term for persons arranged for combat.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 친히 거룩한 성읍에서 전투 대열을 갖춘 자들을 페르시아로 몰아냈습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원어 동사는 강한 강제성을 지니며, ‘몰아내다’, ‘내쫓다’, 또는 ‘추방하다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 원어 분사는 군사 용어로, 전투를 위해 진형을 갖춘 사람들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  english_pob_choice: he himself
  chosen_korean: 그가 친히
  alternatives_korean:
  - 그가
  - 그 자신이
  lexicon: LSJ
  rationale: 강조형 대명사의 힘을 살리기 위해 단순한 ‘그가’보다 ‘친히’를 넣어 직접적 행위를 분명히 했습니다.
- source_word: ἐξέβρασεν
  english_pob_choice: drove ... out
  chosen_korean: 몰아냈습니다
  alternatives_korean:
  - 내쫓았습니다
  - 쫓아냈습니다
  - 추방했습니다
  lexicon: LSJ
  rationale: 동사의 강한, 단호한 내쫓음을 한국어로 자연스럽게 살리되, ‘추방’보다 본문의 생동감을 보존하는 표현을 택했습니다.
- source_word: τοὺς παρατασσομένους
  english_pob_choice: those arrayed for battle
  chosen_korean: 전투 대열을 갖춘 자들을
  alternatives_korean:
  - 전투 진형에 선 자들을
  - 전열을 갖춘 자들을
  - 전투를 위해 배치된 자들을
  lexicon: LSJ
  rationale: παρατάσσω의 군사적 배열 의미를 반영해 단순한 ‘병사들’이 아니라 전투 진형을 갖춘 집단이라는 점을 드러냈습니다.
- source_word: ἐν τῇ ἁγίᾳ πόλει
  english_pob_choice: in the holy city
  chosen_korean: 성읍 안에서
  alternatives_korean:
  - 거룩한 도성 안에서
  - 거룩한 성읍 안에서
  - 거룩한 도성에서
  lexicon: LSJ
  rationale: ‘holy city’의 종교적 호칭을 직역하기보다, 문맥상 대상이 예루살렘임을 암시하는 ‘성읍’으로 옮기되 위치 부사구로 자연스럽게 처리했습니다.
- source_word: εἰς τὴν Περσίδα
  english_pob_choice: out into Persia
  chosen_korean: 페르시아로
  alternatives_korean:
  - 페르시아 안으로
  - 페르시아까지
  - 페르시아로 내몰아
  lexicon: LSJ
  rationale: εἰς의 이동 방향을 한국어 조사 ‘-로’로 간결히 반영했고, 앞의 ‘몰아냈습니다’와 결합해 출방의 결과 지점을 드러냈습니다.
theological_decisions:
- issue: ‘holy city’의 한국어 처리
  chosen_reading: 본문에는 직접적으로 ‘거룩한 성읍’보다 ‘성읍’으로 옮기고, ‘holy’의 종교적 함의는 문맥 전체에서 드러나도록 두었습니다.
  alternative_readings:
  - 거룩한 성읍 안에서
  - 거룩한 도성 안에서
  rationale: 이 구절은 사건의 장소 표지와 전투적 추방의 강조가 중심이므로, 한국어에서 과도하게 경건한 어감을 덧씌우기보다 문맥상 명시되는 성읍을 자연스럽게 제시하는 편이 의미 전달에 유리합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
