lexical_decisions:
- source_word: Οἱ δὲ
  english_pob_choice: And
  chosen_korean: 그런데
  alternatives_korean:
  - 그리고
  - 또
  lexicon: LSJ
  rationale: δέ는 약한 연결어로서 서술을 이어 가는 기능이므로, 한국어에서는 자연스러운 장면 전환을 살리는 ‘그런데’로 옮겼습니다.
- source_word: ἱερεῖς
  english_pob_choice: the priests
  chosen_korean: 제사장들은
  alternatives_korean:
  - 사제들은
  - 제사장들이
  lexicon: LSJ
  rationale: 성전 예배 맥락의 συγκεκρι한 집단이므로 한국어 성경에서 일반적인 ‘제사장들’을 택했습니다.
- source_word: ἐπέψαλλον
  english_pob_choice: were chanting / were singing
  chosen_korean: 불렀습니다
  alternatives_korean:
  - 찬송했습니다
  - 찬송을 불렀습니다
  - 노래했습니다
  lexicon: LSJ
  rationale: 미완료과거는 진행 중인 동작을 나타내지만, 한국어에서는 문장 전체를 과도하게 설명적으로 만들지 않도록 자연스러운 서술 과거로 처리했습니다. 예배적 ‘찬송’의 성격을 살리기 위해 ‘불렀습니다’를 택했습니다.
- source_word: τοὺς ὕμνους
  english_pob_choice: the hymns
  chosen_korean: 찬송가를
  alternatives_korean:
  - 찬송들을
  - 찬양의 노래를
  - 찬송을
  lexicon: LSJ
  rationale: ὕμνοι는 찬양의 노래/찬송가를 가리키므로, 예배적 뉘앙스를 드러내는 ‘찬송가’를 사용했습니다.
theological_decisions:
- issue: 예전적 행위의 어휘 선택
  chosen_reading: ‘불렀습니다’로 제사장들의 예전적 찬송 행위를 간결하게 드러냈습니다.
  alternative_readings:
  - ‘찬송했습니다’
  - ‘찬트했습니다’
  rationale: 본문은 행동의 성격을 설명하기보다 실제 행위를 서술하므로, 지나치게 전문화된 용어보다 한국어 독자가 즉시 이해할 수 있는 표현을 택했습니다.
  doctrine_reference: 공동체 예배와 성전 봉사에 대한 서술
