  source_fidelity: 그리스어의 기원문은 하나님께서 수신자들에게 선을 행하시고, 아브라함·이삭·야곱과 맺으신 자신의 언약을 기억하시기를 비는 두 병렬 부정과거 부정사입니다. 초안은 이 의미와 δοῦλοι의 강한 소속 관계를 대체로 충실히 옮겼습니다. 다만 ‘그의 신실한 노예들’은 한국어에서 바로 앞의 ‘야곱’을 선행사로 오인할 여지가 있어, 소유 관계와 세 족장에 대한 동격을 명시하는 편이 안전합니다. 또한 ‘기억해 주시기를’의 수혜적 ‘주다’는 원문에 명시되지 않았으므로 단순히 ‘기억하시기를’로 옮깁니다.
