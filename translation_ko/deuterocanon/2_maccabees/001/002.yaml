  terminology: ‘언약’은 διαθήκη의 성서적 문맥에 정확합니다. δοῦλοι는 본문의 종속·소속 관계를 보존하여 ‘노예들’로 유지하고, 관습적 대안인 ‘종들’은 각주에 남깁니다. πιστῶν은 ‘신실한’으로 적절합니다.
