translation:
  language: ko
  text: 그리고 하나님께서 여러분에게 선을 베푸시고, 아브라함과 이삭과 야곱, 곧 그의 신실한 노예들과 맺으신 언약을 기억해 주시기를 바랍니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 신실한 종들’. 헬라어는 ‘노예들’이라고 하여 하나님께 속한 관계를 더 강하게 드러냅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγαθοποιῆσαι
  english_pob_choice: do good
  chosen_korean: 선을 베푸시고
  alternatives_korean:
  - 잘해 주시고
  - 은혜를 베푸시고
  lexicon: LSJ
  rationale: 기도적 소망의 동사로서 하나님이 수혜자들에게 유익을 주시는 뜻을 직접 드러내기 위해 ‘선을 베푸시고’를 택했습니다.
- source_word: μνησθῆναι
  english_pob_choice: remember
  chosen_korean: 기억해 주시기를
  alternatives_korean:
  - 기억하시기를
  - 잊지 않으시기를
  lexicon: LSJ
  rationale: 언약 문맥에서 단순한 회상이 아니라 언약적 돌보심을 포함하므로, 한국어에서도 하나님께 대한 청원형으로 자연스러운 ‘기억해 주시기를’로 옮겼습니다.
- source_word: διαθήκης
  english_pob_choice: covenant
  chosen_korean: 언약
  alternatives_korean:
  - 계약
  - 맹세
  lexicon: LSJ
  rationale: 아브라함, 이삭, 야곱이 직접 언급되므로 일반적 ‘계약’이 아니라 성서적 ‘언약’이 가장 정확합니다.
- source_word: δούλων
  english_pob_choice: slaves
  chosen_korean: 노예들
  alternatives_korean:
  - 종들
  - 종노릇하는 자들
  lexicon: LSJ
  rationale: 영어 POB가 δοῦλοι를 ‘slaves’로 유지한 점을 따라, 소속성과 종속성을 약화시키는 전통적 ‘종’보다 ‘노예들’이 본문의 관계를 더 분명히 보존합니다.
theological_decisions:
- issue: δοῦλοι를 족장들에게 적용하는 방식
  chosen_reading: ‘그의 신실한 노예들’로 직역해 하나님께 속한 소속 관계를 드러냈습니다.
  alternative_readings:
  - ‘그의 신실한 종들’
  - ‘그의 충실한 종들’
  rationale: 본문은 아브라함, 이삭, 야곱을 하나님께 속한 δοῦλοι로 규정하므로, 관계의 강도를 완화하지 않는 번역이 필요합니다. 영어 POB의 신학적 선택과 일치시켰습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table for δοῦλος; translation philosophy on preserving bonded-status language'
