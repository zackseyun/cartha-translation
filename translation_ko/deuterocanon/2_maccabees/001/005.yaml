  lexicon: LSJ
  rationale: δέησις의 간절한 요청 뉘앙스를 반영해, 일반적인 ‘기도’보다 더 긴박한 ‘간구’를 택했습니다.
- source_word: καταλλαγείη
  english_pob_choice: be reconciled
  chosen_korean: 화해하시고
  alternatives_korean:
  - 다시 호의 베푸시고
  - 진노를 거두시고
  - 다시 받아 주시고
  lexicon: LSJ
  rationale: 관계 회복의 의미를 살려 ‘화해하시고’로 옮겼으며, 단순한 감정 진정이나 형벌적 완화로 좁히지 않았습니다.
- source_word: ἐν καιρῷ πονηρῷ
  english_pob_choice: in an evil time
  chosen_korean: 악한 때에
  alternatives_korean:
  - 환난의 때에
  - 어려운 때에
  - 재앙의 때에
  lexicon: LSJ
  rationale: καιρός의 시기성과 πονηρός의 도덕적/불길한 색채를 함께 보존하기 위해 직역에 가까운 ‘악한 때’로 했습니다.
