lexical_decisions:
- source_word: ὑπακούσαι
  english_pob_choice: may he hear
  chosen_korean: 들어 주시며
  alternatives_korean:
  - 들으시며
  - 귀를 기울이시며
  - 들어 응답하시며
  lexicon: LSJ
  rationale: 기도 문맥의 optative를 한국어 청원형으로 살리면서, 단순 청취보다 응답적 청각을 드러내기 위해 ‘들어 주시며’를 선택했습니다.
- source_word: τῶν δεήσεων
