  yaml_path: translation/deuterocanon/2_maccabees/001/008.yaml
  text: And they set the gateway on fire and poured out innocent blood; but we prayed to the Lord and were heard. We offered sacrifice and fine flour[a], lit the lamps, and set out the loaves.
  footnotes:
  - marker: a
    text: Or, more literally, 'brought out the lamps.' The Greek verb can mean 'led out' or 'brought out'; here it likely refers to preparing the lamps for temple service.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 문루를 불태우고 무죄한 피를 쏟았습니다. 그러나 우리는 주님께 기도했고, 응답을 받았습니다. 우리는 제물과 고운 가루를 드렸고, 등불을 내어놓았으며, 떡을 차려 놓았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 문자적으로는 ‘등불을 내어보냈다/내어놓았다’입니다. 그리스어 동사는 ‘이끌어내다’ 또는 ‘가져오다’의 뜻도 있을 수 있으며, 여기서는 성전 예식을 위한 준비를 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπυραν τὸν πυλῶνα
  english_pob_choice: set the gateway on fire
  chosen_korean: 문루를 불태우다
  alternatives_korean:
  - 문을 불태우다
  - 성문을 불태우다
  - 문지방을 불태우다
  lexicon: LSJ
  rationale: πυλών은 단순한 문짝보다 출입 구조 전체를 가리킬 수 있어, 한국어에서는 건축적 함의를 살리면서도 자연스러운 ‘문루’로 옮겼습니다.
- source_word: ἐξέχεαν αἷμα ἀθῷον
  english_pob_choice: poured out innocent blood
  chosen_korean: 무죄한 피를 쏟다
  alternatives_korean:
  - 무고한 피를 흘리다
  - 무죄한 피를 흘리다
  lexicon: LSJ
  rationale: 직역의 이미지인 ‘쏟다’를 살려 그리스어의 강한 폭력성을 보존했고, ἀθῷον은 ‘무죄한’으로 옮겨 죄 없는 희생이라는 뜻을 분명히 했습니다.
- source_word: ἐδεήθημεν τοῦ κυρίου καὶ εἰσηκούσθημεν
  english_pob_choice: we prayed to the Lord and were heard
  chosen_korean: 우리는 주님께 기도했고, 응답을 받았습니다
  alternatives_korean:
  - 우리는 주님께 간구했고 들으심을 받았습니다
  - 우리는 주님께 빌었고 들으심을 얻었습니다
  lexicon: LSJ
  rationale: ἐδεήθημεν은 간절한 청원을 뜻하지만, 문맥상 예배와 회복의 진술이므로 ‘기도했고’로 자연스럽게 풀고, 수동형의 응답 의미는 ‘응답을 받았습니다’로 살렸습니다.
- source_word: σεμίδαλιν
  english_pob_choice: fine flour
  chosen_korean: 고운 가루
  alternatives_korean:
  - 고운 밀가루
  - 선별한 가루
  lexicon: LSJ
  rationale: 제의용 곡분을 가리키는 말이므로 ‘고운 가루’가 가장 간결하고, 제물의 재료라는 기능을 유지합니다.
- source_word: ἐξηγάγομεν τοὺς λύχνους
  english_pob_choice: lit the lamps
  chosen_korean: 등불을 내어놓았으며
  alternatives_korean:
  - 등불을 밝혔으며
  - 등불을 가져다 놓았으며
  lexicon: LSJ
  rationale: 영어 주석처럼 이 동사는 문자적으로는 ‘내어보내다/내어놓다’의 뜻이 있어, 제의 준비 행위로서의 흐름을 보존하기 위해 ‘내어놓다’를 택했습니다.
theological_decisions:
- issue: κύριος의 한국어 처리
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 야훼
  rationale: 이 문맥의 κύριος는 하나님을 가리키지만, 본문에 직접적인 야훼 표지가 없으므로 프로젝트 기본값에 따라 ‘주님’을 사용했습니다.
  doctrine_reference: 'DOCTRINE.md contested terms: κύριος → 주님'
- issue: 후반부 제의 행위의 의미
  chosen_reading: 제사와 성전 예식의 회복을 나타내는 연속 동작으로 이해해 번역했습니다.
  alternative_readings:
  - 단순한 일상적 동작으로 보는 번역
  - ‘등불을 밝혔으며’로 기능적 의미를 강하게 보강하는 번역
  rationale: 문맥상 기도 응답 이후의 성전 봉헌/회복 행위이므로, 동작의 나열이 예배 회복을 드러내도록 번역하되 원문에 없는 설명은 덧붙이지 않았습니다.
  doctrine_reference: 'Translation philosophy: source-directed cultic sequence'
