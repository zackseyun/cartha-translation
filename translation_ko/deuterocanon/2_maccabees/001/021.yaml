  terminology: ‘느헤미야’, ‘제사장들’, ‘제사’, ‘나무’, ‘그 위에 놓인 것들’은 적절합니다. ‘진한 물’은 παχύ의 이례성을 보존하는 안전한 번역이며, 각주로 그 표현의 특성을 설명하는 것이 좋습니다.
