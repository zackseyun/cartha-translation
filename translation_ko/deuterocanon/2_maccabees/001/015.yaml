  naturalness: ‘안티오코스가 몇 사람과 함께 … 들어오자마자’로 한 번만 명시하면 한국어 합쇼체 서술로 자연스럽고, ὡς εἰσῆλθεν의 즉각성도 보존됩니다. ‘신전의 문을 닫았습니다’는 συγκλείσαντες τὸ ἱερόν의 실제 행위를 자연스럽게 드러내며, 본문이 말하는 함정의 상황에도 맞습니다.
