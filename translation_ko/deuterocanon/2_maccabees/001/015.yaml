  yaml_path: translation/deuterocanon/2_maccabees/001/015.yaml
  text: And when the priests of Nanea had set these things out[a], and he had come with a few men into the enclosure of the temple precinct, they shut the temple as soon as Antiochus entered.
  footnotes:
  - marker: a
    text: Greek Ναναίου may be represented in English as 'Nanea' or 'Nanaia.' The main text keeps the form closest to the Greek witness used here.
    reason: lexical_alternative
translation:
  language: ko
  text: 나네아의 제사장들이 그것들을 내어 놓고, 안티오코스가 몇 사람과 함께 신전 경내의 울타리 안으로 들어오자마자, 그들은 신전의 문을 닫았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 Ναναίου는 ‘나네아’ 또는 ‘나나이아’로 옮길 수 있습니다. 본문에서는 사용한 그리스어 본문에 가까운 형태로 ‘나네아’를 사용했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προθεμένων αὐτά
  english_pob_choice: had set these things out
  chosen_korean: 그것들을 내어놓았으며
  alternatives_korean:
  - 그것들을 펼쳐 놓았으며
  - 그것들을 제시하였으며
  lexicon: LSJ
  rationale: προτίθημι는 여기서 물건을 앞에 두어 내보이는 동작을 가리키므로, 한국어로는 ‘내어놓다’가 가장 직접적이고 과장되지 않습니다.
- source_word: τῶν ἱερέων τοῦ Ναναίου
  english_pob_choice: the priests of Nanea
  chosen_korean: 나나이오스의 제사장들
  alternatives_korean:
  - 나네아의 제사장들
  - 나나이아의 제사장들
  lexicon: LSJ
  rationale: 그리스어 속격 Ναναίου의 형태를 살려 ‘나나이오스’로 옮겼고, 본문이 가리키는 이교 신전의 제사장이라는 점을 반영해 ‘제사장들’로 번역했습니다.
- source_word: περίβολον τοῦ τεμένους
  english_pob_choice: the enclosure of the temple precinct
  chosen_korean: 신전 뜰 안
  alternatives_korean:
  - 신전 구역 안
  - 성역의 울타리 안
  lexicon: LSJ
  rationale: περίβολος와 τέμενος의 중첩된 공간 표현을 한국어에서 자연스럽게 살리기 위해 ‘신전 뜰 안’으로 풀어, 뒤의 τὸ ἱερόν(신전)과 구분되도록 했습니다.
- source_word: συγκλείσαντες τὸ ἱερόν
  english_pob_choice: they shut the temple
  chosen_korean: 그들은 신전을 닫았습니다
  alternatives_korean:
  - 그들은 성소를 닫았습니다
  - 그들은 신전문을 닫았습니다
  lexicon: LSJ
  rationale: ἱερόν은 성소보다 넓은 ‘신전’ 또는 ‘신전 परिसर’를 가리킬 수 있어, 사건의 서술에 맞게 ‘신전을 닫다’로 옮겼습니다.
- source_word: ὡς εἰσῆλθεν Ἀντίοχος
  english_pob_choice: as soon as Antiochus entered
  chosen_korean: 안티오코스가 들어가는 즉시
  alternatives_korean:
  - 안티오코스가 들어가자마자
  - 안티오코스가 들어가자
  lexicon: LSJ
  rationale: ὡς + aorist는 순간적 시점을 나타내므로 ‘들어가는 즉시’가 서술의 급박함을 가장 잘 전달합니다.
theological_decisions:
- issue: 이교 신명 Ναναίου의 음역
  chosen_reading: ‘나나이오스’로 음역해 본문의 이교적 신전 맥락을 드러냈습니다.
  alternative_readings:
  - ‘나네아’
  - ‘나나이아’
  rationale: 그리스어 형태에 가깝게 옮기면서도, 한국어 독자가 이명이 인명이나 지명보다 신적 명칭임을 문맥으로 파악할 수 있게 했습니다.
  doctrine_reference: 본문 문맥 보존과 고유명사 처리 원칙
- issue: τὸ ἱερόν과 περίβολος/τέμενος의 공간 구분
  chosen_reading: 앞에서는 ‘신전 뜰 안’, 뒤에서는 ‘신전’으로 구분해 두 번의 공간 표현을 살렸습니다.
  alternative_readings:
  - 둘 다 ‘성전’으로 통일
  - 둘 다 ‘성소’로 통일
  rationale: 그리스어가 의도적으로 다른 공간 층위를 구분하므로, 한국어도 같은 단어로 평탄화하지 않고 사건의 긴장감을 유지했습니다.
  doctrine_reference: 본문 의미 보존 원칙
