base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/024.yaml
  text: 'And the prayer was in this form: “Lord God[a], creator of all things, the awesome and mighty and righteous and merciful one[b], the only king and good one,”'
  footnotes:
  - marker: a
    text: Or “the awesome one” / “the fearsome one” for “the fearful”; the Greek adjective denotes one who inspires fear or awe.
    reason: lexical_alternative
  - marker: b
    text: Or simply “good” or “kind” for “good one”; the Greek χρηστός can carry the sense of goodness, kindness, or benevolence.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 기도는 다음과 같았습니다. 「주 하나님, 만물을 창조하신 분, 경외심을 일으키시고[a] 강하시며 의로우시고 자비로우시며, 유일한 왕이시고 선하신 분[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘경외심을 일으키시는’은 ‘두렵게 하시는’ 또는 ‘경외로우신’으로도 옮길 수 있습니다. 그리스어는 두려움이나 경외심을 불러일으키는 분을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘선하신’은 ‘좋으신’, ‘친절하신’, 또는 ‘인자하신’으로도 옮길 수 있습니다. 그리스어 χρηστός는 선함, 친절함, 인자함의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ ἡ προσευχὴ τὸν τρόπον ἔχουσα τοῦτον
  english_pob_choice: And the prayer was in this form
  chosen_korean: 그리고 기도는 이런 형식이었습니다
  alternatives_korean:
  - 그리고 기도는 이와 같은 내용이었습니다
  - 그리고 기도는 다음과 같았습니다
  lexicon: LSJ
  rationale: ‘τὸν τρόπον ἔχουσα τοῦτον’은 기도의 내용을 도입하는 관용적 표현이므로, 한국어에서는 ‘이런 형식이었습니다’로 자연스럽게 옮겨 도입 기능을 살렸습니다.
- source_word: Κύριε ὁ θεός
  english_pob_choice: Lord God
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주님 하나님
  - 오 주 하나님
  lexicon: LSJ
  rationale: 기도의 호격을 직접 살리되, 현대 합쇼체의 자연스러운 호칭으로 ‘주 하나님’을 택했습니다.
- source_word: ὁ φοβερὸς
  english_pob_choice: the fearful
  chosen_korean: 두려우시고
  alternatives_korean:
  - 경외로우시고
  - 무서우시고
  - 두렵게 하시는
  lexicon: LSJ
  rationale: φοβερός는 ‘두려움을 일으키는/경외심을 불러일으키는’ 뜻이므로, 속성을 나열하는 문맥에서 ‘두려우시고’로 옮겨 원문의 긴장을 유지했습니다.
- source_word: ὁ ἰσχυρὸς
  english_pob_choice: mighty
  chosen_korean: 능력 있으시며
  alternatives_korean:
  - 강하시며
  - 권능 있으시며
  lexicon: LSJ
  rationale: 하나님의 강함을 한국어 예배 문맥에서 자연스럽게 드러내는 표현으로 ‘능력 있으시며’를 선택했습니다.
- source_word: δίκαιος καὶ ἐλεήμων
  english_pob_choice: righteous and merciful
  chosen_korean: 의로우시고 자비로우신
  alternatives_korean:
  - 의로우시며 긍휼히 여기시는
  - 의로우시고 긍휼로우신
  lexicon: LSJ
  rationale: ‘δίκαιος’는 하나님의 도덕적 성품을, ‘ἐλεήμων’은 자비/긍휼을 뜻하므로, 각각 ‘의로우시고 자비로우신’으로 대응시켰습니다.
- source_word: ὁ μόνος βασιλεὺς καὶ χρηστός
  english_pob_choice: the only king and good one
  chosen_korean: 홀로 왕이시며 선하신 분
  alternatives_korean:
  - 유일한 왕이시며 선하신 분
  - 홀로 왕이시고 좋으신 분
  lexicon: LSJ
  rationale: μόνος의 배타성을 ‘홀로’로 살리고, χρηστός는 문맥상 ‘선하다/좋다/은혜롭다’ 중에서 예배적 칭송에 자연스러운 ‘선하신’으로 옮겼습니다.
theological_decisions:
- issue: φοβερός의 정서적 강도
  chosen_reading: ‘두려우시고’로 옮겨 하나님 앞의 경외와 두려움을 함께 보이도록 했습니다.
  alternative_readings:
  - 경외로우시고
  - 두렵게 하시는
  rationale: 본문은 단순한 감정 묘사가 아니라 하나님의 위엄을 찬양하는 속성 열거이므로, 한국어에서도 경외와 두려움의 중첩을 유지하는 것이 적절합니다.
  doctrine_reference: 하나님의 거룩하심과 위엄에 대한 성서적 표현
- issue: χρηστός의 의미 범위
  chosen_reading: ‘선하신’으로 번역했습니다.
  alternative_readings:
  - 좋으신
  - 자비로우신
  - 친절하신
  rationale: χρηστός는 ‘좋다/선하다/친절하다/은혜롭다’의 범위를 가지지만, 여기서는 왕에 대한 찬양적 술어이므로 ‘선하신’이 가장 넓고 안정적으로 원뜻을 보존합니다.
  doctrine_reference: 하나님의 선하심과 인자하심에 대한 성서적 묘사
