  yaml_path: translation/deuterocanon/2_maccabees/001/032.yaml
  text: And when this happened[a], a flame was kindled; and when the light from the altar shone forth[b], it was consumed.
  footnotes:
  - marker: a
    text: Or 'when the light from the altar shone forth.' The Greek verb can denote shining or flashing responsively.
    reason: lexical_alternative
  - marker: b
    text: The Greek says simply 'it was consumed' without naming the subject. The translation takes this to refer to the flame; alternatively, some understand the thing consumed to be the fuel or, in light of the wider context, the poured liquid.
    reason: alternative_reading
translation:
  language: ko
  text: 그 일이 일어나자, 불꽃이 일어났습니다. 그리고 제단에서 나온 빛이 반사되자, 그것은 사라졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제단에서 나온 빛이 반사되자.’ 헬라어 동사는 비추다/번쩍이다처럼 응답적으로 빛나는 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 헬라어는 마지막 절에서 ‘그것이’ 무엇인지 밝히지 않습니다. 본문은 여기서 불꽃을 가리키는 것으로 옮겼지만, 연료나 더 넓게는 부어진 액체를 가리킨다고 이해할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς δὲ τοῦτο ἐγενήθη
  english_pob_choice: And when this happened
  chosen_korean: 그 일이 일어나자
  alternatives_korean:
  - 그 일이 일어났을 때
  - 이 일이 일어나자
  - 그런데 이 일이 일어나자
  lexicon: LSJ
  rationale: ὡς δὲ + aorist는 시간 전환을 나타내므로, 자연스러운 한국어로 사건의 선후를 간결하게 살렸습니다.
- source_word: φλὸξ ἀνήφθη
  english_pob_choice: a flame was kindled
  chosen_korean: 불꽃이 일어났습니다
  alternatives_korean:
  - 불꽃이 붙었습니다
  - 불길이 타올랐습니다
  - 한 불꽃이 붙었습니다
  lexicon: LSJ
  rationale: φλόξ는 구체적이고 눈에 보이는 불꽃을 가리키므로 ‘불꽃’이 적합하며, ἀνήφθη의 수동 의미는 ‘일어났습니다’로 자연스럽게 옮겼습니다.
- source_word: ἀντιλάμψαντος φωτὸς
  english_pob_choice: when the light from the altar shone forth
  chosen_korean: 제단에서 나온 빛이 반사되자
  alternatives_korean:
  - 제단에서 나온 빛이 비치자
  - 제단에서 나온 빛이 번쩍이자
  - 제단의 빛이 되비치자
  lexicon: LSJ
  rationale: ἀντιλάμπω는 단순히 ‘비치다’보다 ‘되비치다/반사되다’의 뉘앙스가 있어, 반사·응답적 발광을 드러내는 표현을 택했습니다.
- source_word: ἐδαπανήθη
  english_pob_choice: it was consumed
  chosen_korean: 그것은 사라졌습니다
  alternatives_korean:
  - 그것은 소모되었습니다
  - 그것은 소진되었습니다
  - 그것은 불타 없어졌습니다
  lexicon: LSJ
  rationale: δαπανάω의 수동은 ‘소모되다/소진되다’이지만, 이 문맥에서는 대상이 명시되지 않은 채 소멸하는 장면을 보여 주므로 한국어에서는 직접적이면서도 의미를 과장하지 않는 ‘사라지다’로 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 ‘그것’이 무엇을 가리키는지
  chosen_reading: 본문의 가장 가까운 선행사는 불꽃이지만, 헬라어는 대상어를 명시하지 않으므로 한국어 본문도 모호성을 유지했습니다.
  alternative_readings:
  - 연료나 제물
  - 붓다/부어진 액체
  rationale: POB의 영어 주석처럼, 문맥상 여러 가능성이 있으나 본문 자체가 확정하지 않으므로 주해적 결론을 본문에 강요하지 않고 남겨 두었습니다.
  doctrine_reference: 본문의 애매성을 보존하여 해석상의 긴장을 유지합니다.
