  yaml_path: translation/deuterocanon/2_maccabees/001/017.yaml
  text: Blessed in every way is our God[a], who gave up those who acted wickedly.
  footnotes:
  - marker: a
    text: Or 'who handed over those who acted impiously.' The Greek can also be rendered more literally, 'who gave those who acted wickedly,' with the recipient left implicit.
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 면에서 우리 하나님은 복되십니다. 그분은 악하게 행한 자들을 넘겨주셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “불경하게 행한 자들을 넘겨주셨다”로도 옮길 수 있습니다. 그리스어는 더 문자적으로 “악하게 행한 자들을 주셨다”로도 읽을 수 있으며, 이때 수령자는 암시되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ πάντα
  english_pob_choice: in every way
  chosen_korean: 모든 면에서
  alternatives_korean:
  - 전적으로
  - 온갖 면에서
  - 모든 점에서
  lexicon: LSJ
  rationale: εὐλογητός를 수식하는 포괄적 부사구이므로, 자연스러운 현대 한국어로 총체적 강조를 살렸습니다.
- source_word: εὐλογητὸς
  english_pob_choice: Blessed
  chosen_korean: 복되십니다
  alternatives_korean:
  - 찬양받으십니다
  - 복을 받으십니다
  - 복되십니다
  lexicon: LSJ
  rationale: 하나님께 대한 예배적·찬양적 서술을 살리면서도 문장 전체를 합쇼체로 자연스럽게 전달합니다.
- source_word: ἔδωκεν
  english_pob_choice: gave up / gave over
  chosen_korean: 넘겨주셨습니다
  alternatives_korean:
  - 주셨습니다
  - 내주셨습니다
  - 넘겨주셨습니다
  lexicon: LSJ
  rationale: 단순한 '주다'보다, 문맥상 심판 아래로 넘기는 강한 뜻을 드러내며 POB의 'gave over'와 대응시켰습니다.
- source_word: τοὺς ἀσεβήσαντας
  english_pob_choice: those who acted wickedly
  chosen_korean: 악하게 행한 자들
  alternatives_korean:
  - 경건치 않게 행한 자들
  - 불경하게 행한 자들
  - 악하게 행한 자들
  lexicon: LSJ
  rationale: ἀσεβέω의 도덕적·종교적 불경함을 담되, 한국어에서 지나치게 교회적이거나 낯선 표현을 피했습니다.
theological_decisions:
- issue: ἔδωκεν의 수동적/사법적 뉘앙스
  chosen_reading: 하나님이 악한 자들을 그 결과와 심판의 자리로 넘기신다는 뜻을 본문에서 유지했습니다.
  alternative_readings:
  - 하나님이 악한 자들을 단순히 주셨다는 뜻
  - 구체적 수령자를 밝히지 않은 채 '주셨다'로만 옮기는 방식
  rationale: 그리스어는 수령자를 생략하지만, 감사의 맥락상 적군을 심판에 넘기신 의미가 강하므로 '넘겨주셨습니다'가 가장 적절합니다.
  doctrine_reference: Translation philosophy §1, §3
