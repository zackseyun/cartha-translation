base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/023.yaml
  text: And when the sacrifice had been consumed[a], the priests and all the others offered prayer, with Jonathan leading and the rest responding, as in Nehemiah's time.
  footnotes:
  - marker: a
    text: Or, 'with Jonathan beginning and the rest calling out in response, as Nehemiah did.' The Greek is compressed at the end of the verse, and the exact force of the comparison to Nehemiah can be taken in more than one way.
    reason: alternative_reading
translation:
  language: ko
  text: 제물이 소진되는 동안, 제사장들과 모든 사람이 기도했습니다. 요나단이 시작하고 나머지가 화답했는데, 느헤미야가 했던 것처럼 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘요나단이 시작하고 나머지가 외쳐 응답했는데, 느헤미야 때와 같았습니다’로 옮길 수 있습니다. 헬라어 끝부분은 압축되어 있어, 느헤미야와의 비교가 요나단의 시작, 회중의 응답, 또는 느헤미야와 관련된 방식이나 시대 중 어느 것에 정확히 연결되는지는 분명하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: προσευχὴν
  english_pob_choice: prayer
  chosen_korean: 기도
  alternatives_korean:
  - 기도문
  - 기도를
  lexicon: LSJ
  rationale: 여기서는 행위로서의 ‘prayer’가 자연스러우므로, 문맥에 맞게 ‘기도했습니다’로 옮겼습니다.
- source_word: ἐποιήσαντο
  english_pob_choice: offered
  chosen_korean: 했습니다
  alternatives_korean:
  - 드렸습니다
  - 올렸습니다
  lexicon: LSJ
  rationale: 직역의 ‘만들다’보다 예배 문맥의 자연스러운 한국어인 ‘기도했습니다’가 원문의 의례적 행위를 더 분명히 드러냅니다.
- source_word: δαπανωμένης τῆς θυσίας
  english_pob_choice: had been consumed
  chosen_korean: 희생 제물이 소진되었을 때
  alternatives_korean:
  - 희생 제물이 다 소모되었을 때
  - 제물이 다 타서 없어졌을 때
  lexicon: LSJ
  rationale: θυσία를 ‘희생 제물’로 유지하고, δαπανωμένης는 제의 맥락에서 ‘소진되다’가 가장 압축적이면서도 원문에 가깝습니다.
- source_word: καταρχομένου Ἰωνάθον τῶν τε λοιπῶν ἐπιφωνούντων
  english_pob_choice: with Jonathan leading and the rest responding
  chosen_korean: 요나단이 인도하고 나머지는 응답하는 방식이었는데
  alternatives_korean:
  - 요나단이 시작하고 나머지가 응답하는 방식이었는데
  - 요나단이 선창하고 나머지가 화답하는 방식이었는데
  lexicon: LSJ
  rationale: 예전식 합창·응답 구조를 드러내기 위해 ‘인도하고/응답하는’으로 옮겼고, 문맥상 예배의 진행 방식을 자연스럽게 표현했습니다.
- source_word: ὡς Νεεμίου
  english_pob_choice: as in Nehemiah's time
  chosen_korean: 느헤미야 때와 같았습니다
  alternatives_korean:
  - 느헤미야처럼
  - 느헤미야 시대와 같았습니다
  lexicon: LSJ
  rationale: 압축된 비교를 한국어에서 가장 간결하게 풀어, 느헤미야와 연결된 예배 전통에 대한 언급으로 이해되게 했습니다.
theological_decisions:
- issue: 제의적 응답 예배의 비교 표현
  chosen_reading: ‘요나단이 인도하고 나머지는 응답하는’ 식의 화답 예배로 옮겨, 느헤미야와의 비교를 역사적 예배 관행의 유사성으로 제시했습니다.
  alternative_readings:
  - 요나단이 시작하고 나머지가 외치는 식으로 번역
  - 느헤미야가 한 것처럼 번역
  rationale: 본문은 교리 진술이 아니라 예배 방식의 비교를 말하므로, 응답형 예배라는 구조를 유지하면서도 비교의 정확한 범위는 열어 두었습니다.
  doctrine_reference: 예배 전통의 역사적 연속성은 단정하지 않고, 본문이 제시하는 유사성만 보존합니다.
