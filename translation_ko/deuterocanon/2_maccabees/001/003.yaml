  yaml_path: translation/deuterocanon/2_maccabees/001/003.yaml
  text: and may he give you a faithful heart to worship him and to do his will with a great heart and a willing soul;[a]
  footnotes:
  - marker: a
    text: Or 'a heart of faith' or 'a believing heart.' The Greek phrase καρδίαν πίστιν can be understood as emphasizing faith or faithfulness; the main text chooses 'faithful heart' because the context stresses worship and obedience.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 하나님께서 여러분에게 신실한 마음을 주시어 그분을 경외하고, 큰 마음과 자원하는 영혼으로 그분의 뜻을 행하게 하시기를 빕니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘믿음의 마음’ 또는 ‘믿는 마음’. 그리스어 καρδίαν πίστιν은 믿음 또는 신실함을 강조하는 것으로 이해할 수 있습니다. 본문은 하나님을 경외하고 그분의 뜻을 행하는 문맥을 따라 ‘신실한 마음’으로 옮겼습니다.
    reason: lexical_alternative
