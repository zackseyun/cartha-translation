  lexicon: LSJ
  rationale: 부드러운 소망·축원의 용법이므로 한국어에서는 기원문으로 옮기되, 원문의 축복적 뉘앙스를 살려 주셔서/하시기를 빕니다로 표현했습니다.
- source_word: καρδίαν πίστιν
  english_pob_choice: a faithful heart
  chosen_korean: 믿음의 마음
  alternatives_korean:
  - 충실한 마음
  - 믿는 마음
  - 믿음의 마음
  lexicon: LSJ
  rationale: πίστιν은 여기서 단순 지식 동의보다 신실함·충성의 결을 띠므로, 행위 문맥에 맞게 ‘믿음의 마음’으로 두어 믿음과 신실함의 긴장을 함께 살렸습니다.
- source_word: σέβεσθαι
  english_pob_choice: to worship
  chosen_korean: 경외하게 하시고
  alternatives_korean:
  - 예배하게 하시고
  - 숭배하게 하시고
  - 공경하게 하시고
  lexicon: LSJ
  rationale: 이 동사는 단순 존중보다 종교적 경외와 예배의 태도를 가리키므로, 한국어에서는 ‘경외하다’가 가장 자연스럽고 원문에 가깝습니다.
- source_word: ψυχῇ βουλομένῃ
  english_pob_choice: a willing soul
  chosen_korean: 기꺼이 따르는 영혼
  alternatives_korean:
