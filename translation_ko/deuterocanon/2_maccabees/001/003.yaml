  text: and may he give you a faithful heart to worship him and to do his will with a great heart and a willing soul;[a]
  footnotes:
  - marker: a
    text: Or 'a heart of faith' or 'a believing heart.' The Greek phrase καρδίαν πίστιν can be understood as emphasizing faith or faithfulness; the main text chooses 'faithful heart' because the context stresses worship and obedience.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 여러분에게 믿음의 마음을 주셔서 그를 경외하게 하시고, 큰 마음과 기꺼이 따르는 영혼으로 그의 뜻을 행하게 하시기를 빕니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘믿음의 마음’은 ‘신실한 마음’이나 ‘믿는 마음’으로도 옮길 수 있습니다. 그리스어 καρδίαν πίστιν은 이 문맥에서 믿음과 신실함을 함께 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοίη
  english_pob_choice: may he give
  chosen_korean: 그가 … 주셔서 … 하시기를 빕니다
  alternatives_korean:
