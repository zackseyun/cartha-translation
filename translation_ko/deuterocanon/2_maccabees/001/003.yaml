review_pass:
  verdict: revise
  source_fidelity: 주요 기원 구조와 ‘경외하다’, ‘그의 뜻을 행하다’는 잘 반영되어 있습니다. 그러나 ψυχῇ βουλομένῃ를 ‘기꺼이 따르는 영혼’으로 옮기면 원문에 없는 ‘따르다’가 더해집니다. 또한 καρδίαν πίστιν은 이 문맥에서 신실함의 뜻이 강하므로 본문은 ‘신실한 마음’이 더 직접적입니다.
  naturalness: ‘그가 여러분에게 … 주셔서 … 하시기를 빕니다’는 문법적으로 가능하지만, 한국어 기원문에서는 ‘하나님께서 … 주시어 … 하게 하시기를 빕니다’가 더 명료하고 자연스럽습니다. ‘큰 마음’은 다소 직역적이나, 원문의 비유와 해석상의 여지를 보존할 수 있어 유지합니다.
  terminology: σέβεσθαι는 ‘경외하다’가 적절합니다. βουλομένῃ는 ‘자원하는’으로 옮겨 자발적 의지를 보존하고, ‘영혼’은 ψυχή의 표현을 유지합니다. πίστις 계열의 가능한 ‘믿음/믿는 마음’ 해석은 각주에 남깁니다.
