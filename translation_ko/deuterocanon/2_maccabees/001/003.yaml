  - 의지하는 영혼
  - 자원하는 영혼
  lexicon: LSJ
  rationale: βουλομένῃ는 자원함·의향을 나타내므로 ‘기꺼이 따르는’으로 풀어, 한국어에서 의지와 순종의 결을 살렸습니다.
