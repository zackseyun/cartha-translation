  to: 그리고 하나님께서 여러분에게 신실한 마음을 주시어 그분을 경외하고, 큰 마음과 자원하는 영혼으로 그분의 뜻을 행하게 하시기를 빕니다.[a]
  rationale: 원문의 축원법(δοίη)을 한국어 기원문으로 자연스럽게 유지했습니다. ‘따르는’이라는 첨가를 제거하여 βουλομένῃ의 자원성과 의지라는 의미를 보존했으며, καρδίαν πίστιν의 문맥상 의미를 본문과 각주에 균형 있게 반영했습니다.
