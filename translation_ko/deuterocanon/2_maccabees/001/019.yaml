  rationale: ‘고랑/구멍’의 이미지인 κοιλώματι와 ‘물기 없는 우물’이라는 설명을 합쳐, 본문의 공간적 그림을 살리면서도 한국어로 읽히게 옮겼습니다.
- source_word: κατησφαλίσαντο
  english_pob_choice: secured it
  chosen_korean: 안전하게 해 두었습니다
  alternatives_korean:
