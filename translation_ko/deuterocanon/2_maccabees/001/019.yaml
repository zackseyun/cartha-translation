  text: For when our fathers were being led away into Persia[a], the devout priests took some of the fire from the altar and secretly hid it in the hollow of a dry well, where they secured it so that the place would be unknown to everyone.
  footnotes:
  - marker: a
    text: Or, 'were deported into Persia.' The Greek verb can denote being led away or carried off into exile.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리 조상들이 페르시아로 끌려가고 있을 때, 경건한 제사장들은 제단의 불을 조금 가져다가 몰래 물이 없는 우물의 움푹한 곳에 숨기고, 아무도 그 장소를 알지 못하게 하려고 그곳을 단단히 감추어 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘페르시아로 포로로 끌려갔다’. 그리스어 동사는 ‘데려가다/끌고 가다’와 ‘추방하다’의 뉘앙스를 모두 가질 수 있습니다.
    reason: lexical_alternative
