  rationale: 이 동사의 수동·불완전 시제와 문맥은 강제적인 유배/이송을 가리키므로, 역사적 상실감을 흐리지 않도록 그 성격을 그대로 반영했습니다.
  doctrine_reference: Translation philosophy §1, §6
