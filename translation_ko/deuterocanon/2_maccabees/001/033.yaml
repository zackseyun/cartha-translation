  yaml_path: translation/deuterocanon/2_maccabees/001/033.yaml
  text: But when the matter became known and it was reported to the king of the Persians that[a], in the place where the priests who had been taken away had hidden the fire, water had appeared, from which also those with Nehemiah purified the sacrifices[c][b],
  footnotes:
  - marker: a
    text: Or 'the deported priests' for 'the priests who had been taken away.' The Greek participle indicates priests removed from their land, likely in exile.
    reason: lexical_alternative
  - marker: b
    text: Or 'Nehemiah and his companions' for 'those around Nehemiah.' The Greek idiom refers to the group associated with him.
    reason: lexical_alternative
  - marker: c
    text: The phrase 'from which' most naturally refers to the water that had appeared, implying that the water was used in the ritual purification of the sacrifices.
    reason: cross_reference
translation:
  language: ko
  text: 그러나 그 일이 드러나게 되었고, 페르시아 왕에게도, 제사장들이 옮겨져 와서 불을 숨겨 둔 곳에 물이 나타났으며, 그 물로도 느헤미야와 함께한 이들이 희생 제물을 정결하게 하였다고 보고되었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''옮겨져 온 제사장들''로도 옮길 수 있습니다. 그리스어 분사는 본래 자리에서 옮겨진 제사장들을 가리키며, 포로/유배의 맥락을 시사합니다.'
    reason: lexical_alternative
  - marker: b
    text: '''느헤미야 주위의 이들''로도 옮길 수 있습니다. 그리스어 관용구는 느헤미야와 함께한 집단을 뜻합니다.'
    reason: lexical_alternative
  - marker: c
    text: '''그 물로부터''는 뒤의 정결 행위가 방금 나타난 물을 사용했음을 가장 자연스럽게 가리킵니다.'
    reason: cross_reference
lexical_decisions:
- source_word: ὡς δὲ φανερὸν ἐγενήθη τὸ πρᾶγμα
  english_pob_choice: But when the matter became known
  chosen_korean: 그 일이 드러나게 되었고
  alternatives_korean:
  - 그 일이 알려지게 되었고
  - 그 일이 분명해졌고
  lexicon: LSJ
  rationale: φανερὸν ἐγενήθη는 단순히 '알려지다'보다 '드러나다/공적으로 드러나다'의 뉘앙스가 있어, 사건이 널리 알려진 상태를 자연스럽게 살렸습니다.
- source_word: τῷ βασιλεῖ τῶν Περσῶν
  english_pob_choice: to the king of the Persians
  chosen_korean: 페르시아 왕에게도
  alternatives_korean:
  - 페르시아인들의 왕에게도
  - 페르시아 왕에게
  lexicon: LSJ
  rationale: 속격 구조를 자연스럽게 옮기면서도 한국어에서 흔한 '페르시아 왕'을 사용해 간결하게 표현했습니다.
- source_word: οἱ μεταχθέντες ἱερεῖς
  english_pob_choice: the priests who had been taken away
  chosen_korean: 제사장들이 옮겨져 와서
  alternatives_korean:
  - 포로로 끌려간 제사장들이
  - 데려가진 제사장들이
  lexicon: LSJ
  rationale: μεταχθέντες는 단순한 이동보다 '옮겨지다/이동되다'의 수동적 의미를 가지므로, 유배 맥락을 과도하게 특정하지 않으면서도 수동성을 살렸습니다.
- source_word: ἥγνισαν τὰς θυσίας
  english_pob_choice: purified the sacrifices
  chosen_korean: 희생 제물을 정결하게 하였다고
  alternatives_korean:
  - 제물을 정결하게 하였다고
  - 제사를 정결하게 하였다고
  lexicon: LSJ
  rationale: ἁγνίζω의 제의적 의미를 따라 '정결하게 하다'로 옮겼고, θυσίας는 제의 문맥에 맞게 '희생 제물'로 구체화했습니다.
theological_decisions:
- issue: ἀφ' οὗ의 지시 대상과 제의적 연결
  chosen_reading: '''그 물로도''가 뒤의 정결 행위의 수단/근원을 가리키도록 옮겼습니다.'
  alternative_readings:
  - '''그것으로부터'''
  - '''그 뒤에''로 느슨하게 처리'
  rationale: 가장 가까운 선행사는 나타난 물이며, 본문은 그 물이 제의 정결에 사용되었음을 암시합니다. 이 연결을 흐리지 않기 위해 수단성을 드러냈습니다.
  doctrine_reference: 번역 원칙 §3
