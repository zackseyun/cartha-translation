review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. μεταχθέντες는 제사장들이 ‘옮겨져 왔다’는 이동 방향을 말하지 않고, 본래 있던 곳에서 옮겨진/끌려간 수동적 처지를 가리킵니다. 또한 καί와 ἀφ’ οὗ의 연결상 ‘에게도’와 ‘그 물로도’의 보조사는 근거가 없으며, 물이 정결 예식의 수단임을 ‘그 물로’로 명확히 하는 것이 적절합니다.
  naturalness: 원문의 보고 내용이 길지만, 한국어에서는 인용절 안의 두 사건을 ‘나타났고 … 정결하게 하였다고’로 연결하면 자연스럽습니다. 각주 표지는 해당 단어·구에 직접 붙이는 것이 독자에게 명확합니다.
  terminology: ‘페르시아 왕’, ‘제사장’, ‘느헤미야와 함께한 이들’, ‘희생 제물들’, ‘정결하게 하다’는 현대의 격식 있는 성경 한국어와 제의 문맥에 적절합니다. ‘느헤미야와 함께한 이들’은 οἱ περὶ τὸν Νεεμίαν의 집단 지시를 보존하며, 느헤미야 자신이 반드시 문법적 주어에 포함된다고 단정하지 않습니다.
  issues:
  - severity: medium
    issue: ‘제사장들이 옮겨져 와서’
    rationale: μεταχθέντες는 수동적으로 옮겨진 제사장들을 뜻하지만, ‘와서’는 목적지 방향 및 별도의 동작을 추가합니다. ‘옮겨진 제사장들이’로 고쳐야 합니다.
  - severity: medium
    issue: ‘페르시아 왕에게도’와 ‘그 물로도’
    rationale: 원문의 καί는 ‘또한/도’가 각각의 이 성분에 붙는 구조가 아닙니다. 특히 ἀφ’ οὗ는 나타난 물을 가리키므로 ‘그 물로’가 자연스럽고 정확합니다.
  - severity: low
    issue: 각주 표지가 문장 끝에 한데 배치됨
    rationale: 어휘 대안 및 지시 대상 각주는 각각 ‘옮겨진 제사장들’, ‘느헤미야와 함께한 이들’, ‘그 물로’에 붙여야 해당 근거가 분명해집니다.
