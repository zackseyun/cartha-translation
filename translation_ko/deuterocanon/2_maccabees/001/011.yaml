  text: 하나님께서 큰 위험에서 우리를 구원해 주셨으므로, 우리는 마치 왕을 상대로 전열을 갖추려는 사람들처럼 그분께 크게 감사드립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
