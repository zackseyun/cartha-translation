base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/013.yaml
  text: For when the leader and the force around him that seemed to be invincible had entered[a], they were cut down in the temple of Nanaia[b], because the priests of Nanaia had used deceit.
  footnotes:
  - marker: a
    text: Or 'that seemed invincible.' The Greek describes the force as appearing impossible to withstand.
    reason: lexical_alternative
  - marker: b
    text: Or 'by a trick' / 'through deceit.' The Greek genitive absolute explains that the priests associated with Nanaia brought this about by deception.
    reason: lexical_alternative
translation:
  language: ko
  text: 지도자와 그 주변의 군세가 무적처럼 보였는데 그들이 나아가자, 나나이아의 신전에서 그들은 쓰러졌습니다. 이는 나나이아의 제사장들이 속임수를 사용했기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무적처럼 보였는데’. 그리스어는 그 군세가 실제로가 아니라 그렇게 보였음을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘속임수로’. 그리스어는 나나이아의 제사장들이 기만으로 이 일을 성취했음을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἡγεμὼν
  english_pob_choice: the leader
  chosen_korean: 지도자
  alternatives_korean:
  - 지휘관
  - 통치자
  - 총독
  lexicon: LSJ
  rationale: ἡγεμών은 문맥상 원정대를 이끄는 인물을 가리키므로, 과도하게 행정직으로 특정하지 않는 ‘지도자’가 가장 무난합니다.
- source_word: ἡ περὶ αὐτὸν ... δύναμις
  english_pob_choice: the force around him
  chosen_korean: 그 주변의 군세
  alternatives_korean:
  - 그를 둘러싼 부대
  - 그와 함께한 군대
  - 그 주변의 병력
  lexicon: LSJ
  rationale: δύναμις의 군사적 용법을 살리면서 περὶ αὐτόν의 ‘주변/둘레’를 자연스럽게 옮기기 위해 ‘군세’를 택했습니다.
- source_word: ἀνυπόστατος δοκοῦσα εἶναι
  english_pob_choice: that seemed to be invincible
  chosen_korean: 무적처럼 보였는데
  alternatives_korean:
  - 대적할 수 없어 보였는데
  - 패배할 수 없을 듯 보였는데
  - 정복할 수 없어 보였는데
  lexicon: LSJ
  rationale: ἀνυπόστατος는 ‘대항할 수 없음/견딜 수 없음’의 뉘앙스를 가지므로, 실제로 무적이었다기보다 ‘그렇게 보였다’는 δοκοῦσα εἶναι를 살려 ‘무적처럼 보였는데’로 옮겼습니다.
- source_word: κατεκόπησαν
  english_pob_choice: they were cut down
  chosen_korean: 쓰러졌습니다
  alternatives_korean:
  - 도륙당했습니다
  - 베여 죽었습니다
  - 무너졌습니다
  lexicon: LSJ
  rationale: 직역적 ‘베어 쓰러뜨리다’의 폭력성을 갖되 한국어 문장 흐름을 해치지 않도록 ‘쓰러졌습니다’로 완화해 옮겼습니다.
- source_word: παραλογισμῷ χρησαμένων
  english_pob_choice: had used deceit
  chosen_korean: 속임수를 사용했기 때문입니다
  alternatives_korean:
  - 기만을 썼기 때문입니다
  - 꾀를 써서 그랬기 때문입니다
  - 속여서 그랬기 때문입니다
  lexicon: LSJ
  rationale: παραλογισμός는 기만/속임수를 뜻하고 χρησάμενοι의 ‘사용하다’를 반영해야 하므로, 인과를 분명히 하는 ‘속임수를 사용했기 때문입니다’로 옮겼습니다.
theological_decisions:
- issue: 나나이아의 정체와 번역 처리
  chosen_reading: 고유명사 Nanaia를 음역하여 ‘나나이아’로 유지했습니다.
  alternative_readings:
  - 아나히타
  - 나나이
  - 나니아
  rationale: 본문은 나나이아를 특정 이교 신의 이름으로 전제하므로, 현대 한국어 독자가 원문 고유명사로 인식할 수 있게 음역을 유지하는 것이 가장 투명합니다.
  doctrine_reference: source fidelity / proper-noun policy
