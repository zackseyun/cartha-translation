  - 나니아
  rationale: 본문은 나나이아를 특정 이교 신의 이름으로 전제하므로, 현대 한국어 독자가 원문 고유명사로 인식할 수 있게 음역을 유지하는 것이 가장 투명합니다.
  doctrine_reference: source fidelity / proper-noun policy
