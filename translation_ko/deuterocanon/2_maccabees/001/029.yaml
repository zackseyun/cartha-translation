translation:
  language: ko
  text: 모세가 말한 대로, 주님의 백성을 주님의 거룩한 곳에 심어 주십시오[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 백성을 주님의 거룩한 곳에 세워 주십시오.’ 그리스어 동사는 문자적으로 ‘심다’이며, 안전하게 정착하는 이미지를 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταφύτευσον
  english_pob_choice: Plant
  chosen_korean: 심어 주십시오
  alternatives_korean:
  - 심으십시오
  - 세워 주십시오
  - 정착시켜 주십시오
  lexicon: LSJ
  rationale: 동사 καταφυτεύω의 문자적 이미지는 ‘심다’이므로 농경적 비유를 살리되, 한국어 기도문체에서는 대상에게 무언가를 ‘심어 주십시오’가 자연스럽고 간구의 힘을 유지합니다.
- source_word: τὸν λαόν σου
  english_pob_choice: your people
  chosen_korean: 주님의 백성
  alternatives_korean:
  - 주님의 ժողովուրդ
  - 주님의 민족
  - 주님의 사람들
  lexicon: LSJ
  rationale: λαός는 언약 공동체 전체를 가리키는 집합명사이므로, 직역을 넘지 않으면서도 한국어 성경에서 자연스러운 ‘백성’으로 옮겼습니다.
- source_word: εἰς τὸν τόπον τὸν ἅγιόν σου
  english_pob_choice: in your holy place
  chosen_korean: 주님의 거룩한 곳
  alternatives_korean:
  - 주님의 거룩한 장소
  - 주님의 성소
  - 주님의 거룩한 땅
  lexicon: LSJ
  rationale: τόπος는 좁은 의미의 ‘성소’나 ‘땅’으로 특정되지 않는 ‘곳’이므로, POB의 넓은 ‘holy place’ 해석을 따라 구체화를 피하고 ‘거룩한 곳’으로 옮겼습니다.
- source_word: καθὼς εἶπεν Μωσῆς
  english_pob_choice: just as Moses said
  chosen_korean: 모세가 말한 것처럼
  alternatives_korean:
  - 모세가 말한 대로
  - 모세가 말씀한 것처럼
  lexicon: LSJ
  rationale: καθώς + aorist는 ‘~한 것처럼/대로’의 비교를 나타내며, εἶπεν은 단순한 ‘말했다’이므로 자연스러운 한국어로 유지했습니다.
theological_decisions:
- issue: ‘거룩한 곳’의 범위
  chosen_reading: 장소를 성전·성소·땅으로 특정하지 않고 넓게 유지했습니다.
  alternative_readings:
  - 주님의 성소
  - 주님의 거룩한 땅
  - 주님이 정하신 거룩한 장소
  rationale: 본문의 τόπον은 단지 ‘곳’이므로, 원문이 특정하지 않은 신학적·지리적 범위를 번역이 미리 좁히지 않도록 했습니다.
  doctrine_reference: 원문 우선, 과도한 해석의 회피
- issue: 청원형의 한국어 높임
  chosen_reading: 하나님께 드리는 직접 청원으로 ‘심어 주십시오’의 공손한 명령형을 사용했습니다.
  alternative_readings:
  - 심으십시오
  - 심게 하소서
  rationale: 본문은 기도문이므로, 한국어 합쇼체 안에서도 하나님께 드리는 간구의 직접성을 살리는 표현이 적합합니다.
  doctrine_reference: 기도문체와 경어의 일치
