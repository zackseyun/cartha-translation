    reason: lexical_alternative
lexical_decisions:
- source_word: βάσανισον
  english_pob_choice: Torment
  chosen_korean: 고통을 주시어
  alternatives_korean:
  - 괴롭게 하시어
  - 벌하시어
  - 형벌을 내리시어
  lexicon: LSJ
  rationale: aorist 명령형 βάσανισον의 강한 간구를 살리되, 한국어에서는 ‘고통을 주시어’가 지나친 확장 없이 강도를 드러냅니다.
- source_word: τοὺς καταδυναστεύοντας
  english_pob_choice: those who oppress
  chosen_korean: 우리를 억압하는 자들에게
  alternatives_korean:
  - 우리를 압제하는 자들에게
  - 우리를 학대하는 자들에게
  - 우리를 지배하며 억누르는 자들에게
  lexicon: LSJ
  rationale: καταδυναστεύω의 핵심은 위에서 눌러 해치는 억압이므로, 문맥상 대상이 분명한 ‘우리를 억압하는 자들’이 가장 자연스럽습니다.
- source_word: ἐξυβρίζοντας
  english_pob_choice: insolently abuse us
  chosen_korean: 뻔뻔하게 모욕하는 자들에게
  alternatives_korean:
  - 무례하게 욕보이는 자들에게
  - 오만하게 능욕하는 자들에게
  - 폭력적으로 모욕하는 자들에게
  lexicon: LSJ
  rationale: ἐξυβρίζω는 단순한 insult보다 ‘모욕/능욕/오만한 폭행’의 뉘앙스가 있어, ‘뻔뻔하게 모욕하다’가 현재 한국어에서 그 태도와 강도를 함께 전달합니다.
- source_word: ἐν ὑπερηφανίᾳ
  english_pob_choice: in their pride
  chosen_korean: 교만 가운데
  alternatives_korean:
  - 교만 속에서
  - 오만한 태도로
  - 교만한 마음으로
  lexicon: LSJ
  rationale: ἐν ὑπερηφανίᾳ는 행위의 방식과 상태를 나타내므로, 한국어에서는 ‘교만 가운데’가 간결하면서도 동사구 전체의 근거를 드러냅니다.
theological_decisions:
- issue: 이 구절의 청원적·저주적 어조
  chosen_reading: 직접적인 간구형 명령으로 옮겨, 공동체가 하나님께 악행자에게 심판적 고통을 내려 달라고 청하는 स्वर를 유지했습니다.
  alternative_readings:
  - 완곡하게 ‘벌해 주십시오’로 낮추기
  - 서술형으로 바꾸어 ‘하나님이 그들을 괴롭게 하십니다’로 번역하기
  rationale: 본문은 공동체의 절박한 청원이며, 명령형 βάσανισον의 강도를 약화하면 수사적·신학적 힘이 손상됩니다.
  doctrine_reference: 시편적 탄원/저주 기도 전통
- issue: ‘우리’를 드러내는 대상 보충
  chosen_reading: 한국어에서 목적어를 명시하여 ‘우리를 억압하고… 모욕하는 자들’로 처리했습니다.
  alternative_readings:
  - 목적어를 생략한 ‘억압하고 모욕하는 자들’
  - ‘사람들을’ 같은 일반 목적어를 보태기
  rationale: 영어 POB가 이미 공동체의 자신을 ‘us’로 분명히 했고, 한국어도 동사 ‘억압하다/모욕하다’의 대상을 드러내야 문맥이 명확해집니다.
  doctrine_reference: 공동체 탄원 문맥
