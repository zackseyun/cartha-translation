lexical_decisions:
- source_word: οἷς
  english_pob_choice: from those men
  chosen_korean: 그 사람들에게서
  alternatives_korean:
  - 그들로부터
  - 그들에게서
  lexicon: LSJ
  rationale: 관계대명사가 앞선 사람들을 가리키므로, 한국어에서는 출처를 분명히 드러내는 조사로 처리했습니다.
- source_word: πολλὰ διάφορα
  english_pob_choice: many different gifts
  chosen_korean: 많은 여러 가지 물건
  alternatives_korean:
  - 많은 여러 가지 선물
  - 많은 여러 가지 것들
  lexicon: LSJ
  rationale: διάφορα의 핵심은 '여러 가지/다양한'이며, 본문에 목적어가 명시되지 않아 한국어에서는 중립적인 '물건'으로 보완해 과잉 해석을 피했습니다.
- source_word: ἐλάμβανεν
  english_pob_choice: received
  chosen_korean: 받아서
  alternatives_korean:
  - 받았습니다
  - 받고 있었습니다
  lexicon: LSJ
  rationale: 왕이 어떤 것을 수령하는 동작을 자연스럽게 옮기되, 서술 흐름상 연결어미 '받아서'로 뒤의 동작과 이어 주었습니다.
- source_word: μετεδίδου
  english_pob_choice: distributed
  chosen_korean: 나누어 주었습니다
  alternatives_korean:
  - 분배하였습니다
  - 나눠 주었습니다
  lexicon: LSJ
  rationale: μεταδίδωμι의 '나누어 주다/분배하다' 의미를 살려, 왕이 받은 것을 다시 퍼뜨리는 동작을 분명하게 표현했습니다.
