  source_fidelity: 그리스어 οἷς는 앞서 언급된 사람들을 가리키며 ‘그 사람들에게서’로 자연스럽게 옮길 수 있습니다. πολλὰ διάφορα는 구체적인 물품의 종류를 밝히지 않은 ‘여러 가지 많은 것들’이라는 뜻이므로, ‘물건’처럼 물리적 물품으로 한정하지 않는 편이 더 충실합니다. ‘받아 … 나누어 주었습니다’는 ἐλάμβανεν과 μετεδίδου의 연속된 동작을 적절히 반영합니다.
  naturalness: ‘많은 여러 가지 물건’은 수량 표현과 ‘여러 가지’의 결합이 다소 어색하고, ‘물건’은 원문보다 의미를 좁힙니다. ‘여러 가지 것들을 많이’가 현대 표준어 합쇼체에서 자연스럽습니다.
  terminology: 신학적 전문 용어는 없습니다. ‘나누어 주었습니다’는 μεταδίδωμι의 분여·분배 의미를 무리 없이 전달합니다.
