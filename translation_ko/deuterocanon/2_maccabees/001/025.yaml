  source_fidelity: ‘조상들을 택하신 자로 삼으시고’는 ἐκλεκτούς(‘선택된, 택함받은’)를 능동의 ‘택한 자’로 읽히게 하므로 의미가 바뀝니다. 이를 수동적 상태를 나타내도록 고쳐야 합니다. 나머지 호칭들과 ‘이스라엘을 모든 악에서 구원하시는’은 그리스어의 열거 및 현재분사적 묘사를 충실히 반영합니다.
  naturalness: 합쇼체의 기도문·찬양문 문체는 대체로 자연스럽습니다. ‘택하신 자’만 한국어에서 ‘선택하는 사람’이라는 뜻으로 우선 이해될 수 있어 수정이 필요합니다.
  terminology: ‘전능하시며 영원하신 분’, ‘조상들’, ‘거룩하게 하신’은 적절합니다. χορηγός의 ‘공급자’는 다소 직역적이지만 가능한 표현이므로 유지할 수 있습니다. ἁγιάζω의 대안으로 ‘성화하다’는 신학적으로 과정적 함의를 띨 수 있어, 주석에서는 ‘성별하다’와 ‘거룩하게 하다’를 제시하는 편이 안전합니다.
