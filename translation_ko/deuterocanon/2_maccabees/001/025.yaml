base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/025.yaml
  text: the only provider[a], the only righteous one, almighty and eternal, the one who rescues Israel from every evil, who made the fathers chosen and sanctified them[c][b];
  footnotes:
  - marker: a
    text: Or 'benefactor' or 'supplier' for 'provider' (χορηγός). The Greek emphasizes God as the one who supplies what is needed.
    reason: lexical_alternative
  - marker: b
    text: Or 'made the fathers elect' for 'made the fathers chosen.'
    reason: lexical_alternative
  - marker: c
    text: Or 'made them holy' / 'consecrated them' for 'sanctified them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 오직 공급자이신 분, 오직 의로우신 분, 전능하시며 영원하신 분, 이스라엘을 모든 악에서 구원하시는 분, 조상들을 선택된 이들로 삼으시고 그들을 거룩하게 하신 분이십니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘공급자’는 χορηγός를 옮긴 말입니다. ‘필요를 채워 주시는 분’, ‘베푸시는 분’으로도 옮길 수 있으며, 이 단어는 필요한 것을 마련해 주는 분이라는 뜻을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘조상들’은 이스라엘의 언약사적 선조들을 가리킵니다. 그리스어에는 ‘우리’라는 소유 표현이 없습니다.
    reason: source_note
  - marker: c
    text: ‘거룩하게 하신’은 ‘성별하신’ 또는 ‘거룩한 이들이 되게 하신’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνος χορηγός
  english_pob_choice: the only provider
  chosen_korean: 오직 공급자이신 분
  alternatives_korean:
  - 오직 은혜를 베푸시는 분
  - 오직 베푸시는 분
  - 오직 공급하시는 분
  lexicon: LSJ / BDAG
  rationale: χορηγός는 단순한 ‘주는 이’보다 필요를 공급하는 분을 가리키므로, ‘공급자’로 옮겨 하나님의 공급성과 유일성을 살렸습니다.
- source_word: δίκαιος
  english_pob_choice: the only righteous one
  chosen_korean: 오직 의로우신 분
  alternatives_korean:
  - 오직 의로운 분
  - 오직 의로우신 이
  lexicon: BDAG
  rationale: 하나님의 호칭으로 쓰인 형용사이므로, 한국어에서도 인격적 호칭이 드러나도록 ‘의로우신 분’으로 옮겼습니다.
- source_word: παντοκράτωρ καὶ αἰώνιος
  english_pob_choice: almighty and eternal
  chosen_korean: 전능하시며 영원하신 분
  alternatives_korean:
  - 만군의 주이시며 영원하신 분
  - 모든 것을 다스리시며 영원하신 분
  lexicon: BDAG
  rationale: παντοκράτωρ는 통상 ‘전능’으로 대응되고, αἰώνιος는 문맥상 ‘영원하신’이 가장 간결하고 자연스럽습니다.
- source_word: τοὺς πατέρας
  english_pob_choice: the fathers
  chosen_korean: 조상들을
  alternatives_korean:
  - 그 조상들을
  - 아버지들을
  lexicon: BDAG
  rationale: 여기서는 이스라엘의 언약사적 선조들을 가리키므로 한국어에서는 뜻이 분명한 ‘조상들’이 자연스럽습니다.
theological_decisions:
- issue: ὁ ποιήσας τοὺς πατέρας ἐκλεκτούς의 관계 구조
  chosen_reading: 조상들을 택하신 자로 삼으시고
  alternative_readings:
  - 조상들을 택하신 분
  - 조상들을 선택되게 하신 분
  rationale: 그리스어는 목적보어 구조로 ‘조상들을 택한 상태가 되게 하다’는 힘이 있으므로, 단순한 과거 서술보다 ‘택하신 자로 삼으시고’가 관계와 결과를 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §4–6
- issue: ἡγίασας αὐτούς의 번역 어휘
  chosen_reading: 그들을 거룩하게 하신 분
  alternative_readings:
  - 그들을 성별하신 분
  - 그들을 성화하신 분
  rationale: 기도문 맥락의 숭고한 표현을 유지하되, 한국어에서 더 직접적이고 이해하기 쉬운 ‘거룩하게 하다’를 택했습니다.
  doctrine_reference: Translation philosophy §6
