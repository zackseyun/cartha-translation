  text: the only provider[a], the only righteous one, almighty and eternal, the one who rescues Israel from every evil, who made the fathers chosen and sanctified them[c][b];
  footnotes:
  - marker: a
    text: Or 'benefactor' or 'supplier' for 'provider' (χορηγός). The Greek emphasizes God as the one who supplies what is needed.
