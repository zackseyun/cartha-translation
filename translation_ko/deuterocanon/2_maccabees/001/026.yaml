  text: Accept the sacrifice for all your people Israel[a], and preserve your portion and sanctify it.
  footnotes:
  - marker: a
    text: Or 'preserve your portion and sanctify it.' The phrase 'your portion' likely refers to Israel as God's own share, though some may hear a broader reference such as the land or sanctuary.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님의 모든 백성 이스라엘을 위하여 제사를 받아 주시고, 주님의 몫을[a] 지켜 주시며 그것을 거룩하게 하소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주님의 몫’은 문맥상 이스라엘, 곧 하나님의 소유 백성을 가리키는 비유로 이해하는 것이 가장 자연스럽습니다. 다만 땅이나 성전을 가리키거나 포함하는 더 넓은 의미로 이해될 여지도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρόσδεξαι
  english_pob_choice: Accept
  chosen_korean: 받아 주시고
  alternatives_korean:
  - 받으시고
  - 기쁘게 받아 주시고
  lexicon: LSJ
  rationale: 기도문에서 하나님께 무엇인가를 ‘기쁘게 받아 주시다’는 청원 동사를 자연스럽게 살렸습니다. ‘받아 주시다’는 수용과 호의의 뉘앙스를 함께 담습니다.
- source_word: τὴν θυσίαν
  english_pob_choice: the sacrifice
  chosen_korean: 그 제사
  alternatives_korean:
  - 그 희생제물
  - 그 희생
  lexicon: LSJ
  rationale: θυσία는 단순한 ‘드림’이 아니라 제의적 희생 행위를 가리키므로 ‘제사’가 가장 직접적입니다.
- source_word: τὴν μερίδα σου
  english_pob_choice: your portion
  chosen_korean: 당신의 몫
  alternatives_korean:
  - 당신의 분깃
  - 당신의 몫으로 주신 것
  lexicon: LSJ
  rationale: μερίς/μερίδα의 기본 뜻인 ‘몫, 분깃’을 살려 비유를 유지했습니다. 여기서는 이스라엘을 하나님의 소유 몫으로 보는 문맥이므로 ‘몫’이 가장 투명합니다.
- source_word: καθαγίασον
  english_pob_choice: make it holy
  chosen_korean: 거룩하게 하소서
  alternatives_korean:
  - 거룩하게 만드시고
  - 성별하시고
  lexicon: LSJ
  rationale: 동사의 핵심 의미는 ‘거룩하게 하다/성별하다’입니다. 한국어 기도체에서는 ‘거룩하게 하소서’가 가장 자연스럽고 원문의 청원형을 잘 드러냅니다.
theological_decisions:
- issue: ‘your portion’의 지시 대상
  chosen_reading: ‘당신의 몫’은 앞서 언급된 당신의 백성 이스라엘을 가리키는 비유로 유지했습니다.
  alternative_readings:
  - 땅이나 성전이 하나님의 몫이라는 뜻으로 넓게 이해할 수 있습니다.
  - 하나님의 상속 몫이라는 더 일반적 의미로 읽을 수 있습니다.
  rationale: 직전 문맥이 ‘당신의 모든 백성 이스라엘’을 명시하므로, 뒤의 단수 표현은 그 백성을 이어받는 비유로 읽는 것이 가장 자연스럽습니다. 다만 비유가 지닌 폭은 닫지 않고 ‘몫’으로 남겼습니다.
  doctrine_reference: 문맥 우선, 은유 보존
- issue: 기도문의 공손한 명령형
  chosen_reading: 하나님께 드리는 간구이므로 한국어에서는 높임 청원형 ‘-시고… 하소서’를 사용했습니다.
  alternative_readings:
  - 직설형으로 ‘받아 주시고… 거룩하게 하십시오’라고 옮길 수 있습니다.
  - 더 전통적인 ‘받으시옵고… 거룩하게 하옵소서’도 가능하지만 현대 문체에는 덜 맞습니다.
  rationale: 원문은 aorist middle imperative의 기도체이므로, 한국어도 청원과 공손함이 살아 있는 기도문 어법으로 옮기는 것이 적절합니다.
  doctrine_reference: 기도문 문체
