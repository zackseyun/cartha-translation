- from: 우리의 흩어진 무리를 모으시고[a], 이방 가운데서 종노릇하는 자들을 자유롭게 하시며, 멸시받고 혐오당하는 자들을 돌아보십시오. 그리고 민족들이 당신이 우리의 하나님이심을 알게 하십시오.
  to: 우리의 흩어진 이들을 모아 주시고[a], 민족들 가운데서 노예로 지내는 이들을 해방해 주시며, 멸시받고 혐오받는 이들을 돌아보시고, 민족들이 하나님께서 우리의 하나님이심을 알게 하십시오.
