translation:
  language: ko
  text: 우리의 흩어진 무리를 모으시고[a], 이방 가운데서 종노릇하는 자들을 자유롭게 하시며, 멸시받고 혐오당하는 자들을 돌아보십시오. 그리고 민족들이 당신이 우리의 하나님이심을 알게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어는 문자적으로 ‘우리의 흩어짐’이지만, 문맥상 흩어진 공동체를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισυνάγαγε
  english_pob_choice: Gather ... together
  chosen_korean: 모으시고
  alternatives_korean:
  - 다시 모으시고
  - 함께 모으시고
  - 모아 주시고
  lexicon: LSJ
  rationale: ἐπισυνάγω의 명령형은 흩어진 이들을 한데 불러 모으는 뜻이므로, 한국어에서는 간결한 동사 ‘모으시고’로 살리되 앞의 대상 표현으로 집합적 의미를 유지했습니다.
- source_word: τὴν διασπορὰν ἡμῶν
  english_pob_choice: our scattered people
  chosen_korean: 우리의 흩어진 무리
  alternatives_korean:
  - 우리의 흩어진 백성
  - 우리의 디아스포라
  - 우리의 흩어짐
  lexicon: LSJ
  rationale: 직역하면 ‘우리의 흩어짐’이지만, 문맥상 모으심의 대상인 공동체를 가리키므로 POB의 해석을 따라 사람들을 가리키는 집합 표현으로 옮겼습니다.
- source_word: τοὺς δουλεύοντας
  english_pob_choice: those enslaved
  chosen_korean: 종노릇하는 자들
  alternatives_korean:
  - 노예가 된 자들
  - 종살이하는 자들
  - 속박된 자들
  lexicon: LSJ
  rationale: δουλεύω의 핵심은 ‘종으로 섬기다/종속되다’이므로, 한국어에서는 관용적이면서도 예속 상태를 드러내는 ‘종노릇하는 자들’로 옮겼습니다.
- source_word: τοὺς ἐξουθενημένους καὶ βδελυκτούς
  english_pob_choice: those who are despised and abhorred
  chosen_korean: 멸시받고 혐오당하는 자들
  alternatives_korean:
  - 천대받고 가증하게 여겨지는 자들
  - 업신여김을 받고 미움받는 자들
  - 경멸당하고 역겨워지는 자들
  lexicon: LSJ
  rationale: 두 분사는 사회적 수치와 강한 혐오를 함께 나타내므로, ‘멸시받고 혐오당하는’으로 병렬해 강도를 유지했습니다.
- source_word: ἔφιδε
  english_pob_choice: look upon
  chosen_korean: 돌아보십시오
  alternatives_korean:
  - 살펴보십시오
  - 굽어보십시오
  - 주시하십시오
  lexicon: LSJ
  rationale: 기도문 맥락에서 단순한 시선 이상으로 자비로운 주의를 청하는 말이므로, 한국어에서는 자연스럽게 ‘돌아보십시오’로 옮겼습니다.
theological_decisions:
- issue: ‘이방’(ἔθνη)의 번역 범위
  chosen_reading: ‘이방 가운데서’로 옮겨, 민족/제국 권역 속에서의 억압 상황을 드러냈습니다.
  alternative_readings:
  - ‘민족들 가운데서’
  - ‘이방인들 가운데서’
  - ‘열국 가운데서’
  rationale: 여기서 ἔθνη는 단순한 종교적 ‘이방인’보다 주변 민족들과 정치적 세력을 함께 가리키므로, 문맥에 맞게 ‘이방 가운데서’로 처리했습니다.
  doctrine_reference: Translation philosophy §1, §6
