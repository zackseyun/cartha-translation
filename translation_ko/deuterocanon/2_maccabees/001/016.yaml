  yaml_path: translation/deuterocanon/2_maccabees/001/016.yaml
  text: After opening the hidden door of the smoke chamber[a], they threw stones and struck down the leader, and after cutting him into pieces[b], they threw the heads to those outside.
  footnotes:
  - marker: a
    text: Or 'the furnace room' or 'the place of smoke/incense'; the Greek term is rare and its precise referent is uncertain.
    reason: lexical_alternative
  - marker: b
    text: The verb evokes a thunderbolt or lightning strike; it may mean they struck him down violently, not necessarily that a literal bolt fell from heaven.
    reason: lexical_alternative
translation:
  language: ko
  text: 연기실[a]의 숨겨진 문을 연 뒤, 그들은 돌을 던져 그 지도자를 쳐서 쓰러뜨리고, 그를 토막 낸 뒤 그 머리들을 밖에 있는 사람들에게 던졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어의 희귀한 표현을 옮긴 것입니다. 정확히 어떤 시설을 가리키는지는 불확실하며, 화로가 있는 방이나 연기 또는 향과 관련된 장소를 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοίξαντες τὴν ... κρυπτὴν θύραν
  english_pob_choice: After opening the hidden door
  chosen_korean: 연기방의 숨은 문을 연 뒤
  alternatives_korean:
  - 비밀 문을 연 뒤
  - 감춘 문을 연 뒤
  lexicon: LSJ
  rationale: ἀνοίξαντες의 선행 동작을 ‘-ㄴ 뒤’로 자연스럽게 살리고, κρυπτὴν θύραν은 ‘숨은 문’으로 옮겨 ‘hidden’의 의미를 직접 반영했습니다.
- source_word: τοῦ φατινώματος
  english_pob_choice: of the smoke chamber
  chosen_korean: 연기방
  alternatives_korean:
  - 연기실
  - 화로방
  - 향연기 방
  lexicon: LSJ
  rationale: 희귀어라 정확한 지시 대상이 불확실하므로, 영어 POB처럼 ‘smoke chamber’의 불확실성을 유지하면서도 한국어로는 간결한 ‘연기방’으로 옮겼습니다.
- source_word: συνεκεραύνωσαν
  english_pob_choice: struck down
  chosen_korean: 쓰러뜨렸고
  alternatives_korean:
  - 내리쳤고
  - 번개처럼 쳐서 쓰러뜨렸고
  - 강타했고
  lexicon: LSJ
  rationale: 어근에 천둥·번개 이미지는 있으나 본문이 실제 번개 사건을 명시하지 않으므로, 의미를 과장하지 않는 ‘쓰러뜨리다’로 옮겼습니다.
- source_word: μέλη ποιήσαντες
  english_pob_choice: after cutting him into pieces
  chosen_korean: 그를 조각내어
  alternatives_korean:
  - 그를 토막내어
  - 그를 신체 조각으로 만들어
  - 그를 절단하여
  lexicon: LSJ
  rationale: 신체를 부분으로 나누는 잔혹한 의미를 드러내기 위해 ‘조각내다’를 택했습니다.
theological_decisions:
- issue: συνεκεραύνωσαν의 번개 이미지 처리
  chosen_reading: 번개를 직접 암시하는 해석을 본문에 덧붙이지 않고, 단순히 ‘쓰러뜨렸다’로 처리했습니다.
  alternative_readings:
  - 번개처럼 내리쳤다
  - 천둥벼락처럼 쓰러뜨렸다
  rationale: 행위 주체는 돌을 던진 사람들로 서술되며, 본문 자체는 문자적 하늘의 벼락을 요구하지 않습니다. 따라서 원문의 수사적 긴장은 남기되 해석적 확장은 피했습니다.
  doctrine_reference: 원문 우선, 해석적 과잉 방지
