  rationale: 본문은 반복적으로 남성 친족어를 사용하고 있으며, 서신 호칭의 공동체적 연대가 중요하므로 성중립 완화보다 원문 형식을 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
