translation:
  language: ko
  text: '이집트에 있는 유대인 형제들에게: 예루살렘에 있는 유대인 형제들과 유대아 지방에 있는 이들이 인사드리며, 좋은 평강을 전합니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘χαίρειν’은 서간에서 쓰는 관용 문안으로, 문자적으로는 ‘기뻐하라’와 관련되지만 여기서는 ‘인사하다/문안하다’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς ... Ἰουδαίοις
  english_pob_choice: To the Jewish brothers
  chosen_korean: 유대인 형제들에게
  alternatives_korean:
  - 유대인들에게
  - 유대인 형제들께
  lexicon: BDAG
  rationale: 문안 서문의 수신자 표지이므로 여격을 자연스럽게 처리했고, ἀδελφοῖς를 살려 ‘형제들’로 옮겨 친족적 연대를 유지했습니다.
- source_word: τοῖς κατʼ Αἴγυπτον
  english_pob_choice: in Egypt
  chosen_korean: 이집트에 있는
  alternatives_korean:
  - 이집트에
  - 이집트에 거주하는
  lexicon: BDAG
  rationale: 거주 지역을 나타내는 표현이므로 위치를 간결하게 드러내는 ‘…에 있는’이 가장 자연스럽습니다.
- source_word: χαίρειν
  english_pob_choice: greetings / send greetings
  chosen_korean: 인사드리며
  alternatives_korean:
  - 문안드리며
  - 인사를 전하며
  lexicon: BDAG
  rationale: 헬라 서간의 관용 문안인 χαίρειν을 단순 명사 ‘인사’보다 동사구로 풀어, 앞뒤 문장의 연결을 한국어에서 분명하게 했습니다.
- source_word: εἰρήνην ἀγαθήν
  english_pob_choice: good peace
  chosen_korean: 좋은 평강
  alternatives_korean:
  - 평강을 기원하며
  - 좋은 평화
  lexicon: BDAG
  rationale: εἰρήνην과 ἀγαθήν을 둘 다 살리기 위해 직역에 가까운 ‘좋은 평강’을 택했고, ‘평화’보다 예배·서신 문맥에 익숙한 ‘평강’을 유지했습니다.
theological_decisions:
- issue: ἀδελφοί/ἀδελφοῖς의 성중립화 여부
  chosen_reading: ‘형제들’로 유지했습니다.
  alternative_readings:
