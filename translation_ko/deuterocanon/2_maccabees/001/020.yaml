  text: But after many years had passed, when it seemed good to God, Nehemiah, having been sent by the king of Persia, sent for the descendants of the priests who had hidden it, to get the fire.
  footnotes:
  - marker: a
    text: Literally, 'sent ... upon/for the fire.' The Greek is concise; the translation makes explicit that Nehemiah sent the descendants of the priests to recover the hidden fire mentioned in the surrounding context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 여러 해가 지난 뒤, 하나님께서 좋게 여기셨을 때, 바사 왕에게서 보내심을 받은 느헤미야는 그 불을 숨겼던 제사장들의 후손들을 보내어 그 불을 찾게 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 불에 대하여/그 불을 향하여 보냈다’에 가깝습니다. 문맥상 이는 이전 이야기에서 숨겨 둔 불을 찾도록 보냈다는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: διελθόντων δὲ ἐτῶν ἱκανῶν
  english_pob_choice: But after many years had passed
  chosen_korean: 그러나 여러 해가 지난 뒤
  alternatives_korean:
  - 많은 해가 지나고
  - 상당한 여러 해가 지난 뒤
  lexicon: LSJ
  rationale: genitive absolute의 시간 배경을 자연스러운 한국어 부사절로 옮겼고, ἱκανῶν은 단순한 '충분한'보다 '여러/많은'의 뜻이므로 이를 살렸습니다.
- source_word: ὅτε ἔδοξεν τῷ θεῷ
  english_pob_choice: when it seemed good to God
  chosen_korean: 하나님께서 좋게 여기셨을 때
  alternatives_korean:
  - 하나님께서 보시기에 좋았을 때
  - 하나님께서 좋다고 여기셨을 때
  lexicon: LSJ
  rationale: ἔδοξεν τῷ θεῷ의 관용적 표현을 따라, 단순한 감정적 '기쁨'보다 하나님의 판단·승인을 드러내는 표현으로 옮겼습니다.
- source_word: τοὺς ἐκγόνους τῶν ἱερέων
  english_pob_choice: the descendants of the priests
  chosen_korean: 제사장들의 후손들
  alternatives_korean:
  - 제사장들의 자손들
  - 제사장들의 후예들
  lexicon: LSJ
  rationale: ἐκγόνοι를 성별을 제한하지 않는 '후손들'로 옮겨, 문맥상 조상 제사장 집단의 계승자를 자연스럽게 드러냈습니다.
- source_word: ἔπεμψεν ἐπὶ τὸ πῦρ
  english_pob_choice: sent ... to get the fire
  chosen_korean: 그 불을 찾게 했습니다
  alternatives_korean:
  - 그 불을 가져오게 했습니다
  - 그 불을 회수하게 했습니다
  lexicon: LSJ
  rationale: 그리스어가 압축적으로 말하는 목적/파견의 의미를 한국어에서 명시하여, 문맥상 숨겨진 불을 되찾는 의미가 드러나도록 했습니다.
theological_decisions:
- issue: 하나님의 주권적 시기 표지
  chosen_reading: ‘하나님께서 좋게 여기셨을 때’로 옮겨, 사건의 시기가 하나님의 판단에 달려 있음을 드러냈습니다.
  alternative_readings:
  - ‘하나님께서 기뻐하셨을 때’
  - ‘하나님께서 보시기에 좋았을 때’
  rationale: 본문은 단순한 인간적 적합성보다 하나님의 뜻에 따른 시점을 말하므로, 주권적 허용/결정의 뉘앙스를 살리는 쪽이 적절합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, items 1 and 3
