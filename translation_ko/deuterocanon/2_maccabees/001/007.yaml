theological_decisions:
- issue: ἀπέστη의 의미 범위와 Jason의 행위 평가
  chosen_reading: ‘떠난’으로 번역하여 정치적 이탈, 신앙적 배교, 공동체 이탈 가능성을 모두 열어 두었습니다.
  alternative_readings:
  - 배반한
  - 반역한
  - 배교한
  rationale: 본문은 Jason과 그 일행의 행동을 공동체 위기의 출발점으로 제시하지만, 그 성격을 하나로 좁히지 않습니다. 따라서 한국어도 평가를 과도하게 규정하지 않도록 했습니다.
  doctrine_reference: 해석의 긴장을 보존해야 하는 본문
