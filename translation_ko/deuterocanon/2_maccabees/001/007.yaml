base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/007.yaml
  text: In the reign of Demetrius[a], in the one hundred sixty-ninth year, we Jews wrote to you in the distress and in the crisis that came upon us in those years[c][b], after Jason and those with him departed from the holy land and the kingdom.
  footnotes:
  - marker: a
    text: Or 'have written'; the Greek perfect may be understood epistolarily.
    reason: lexical_alternative
  - marker: b
    text: Or 'at the height of the affliction' for 'in the crisis.' The Greek term suggests an acute or climactic point of distress.
    reason: lexical_alternative
  - marker: c
    text: Or 'apostatized' or 'defected' for 'revolted.' The Greek can carry both political and religious overtones.
    reason: alternative_reading
translation:
  language: ko
  text: 데메트리오스가 통치하던 제169년에, 우리 유대인들은 야손과 그와 함께한 이들이 거룩한 땅과 왕국에서 떠난[c] 이래 환난 속에서, 또 이 여러 해 동안 우리에게 닥친 위기[b] 속에서 여러분에게 편지를 썼습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분에게 편지를 드립니다’. 그리스어 완료형은 서신에서 현재의 행위처럼 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘고난이 절정에 이르렀을 때’. 그리스어는 고통의 급박한 정점이라는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘배교한’, ‘이탈한’, 또는 ‘반역한’. 그리스어는 정치적 이탈과 종교적 배교를 모두 함축할 수 있습니다.
    reason: alternative_reading
