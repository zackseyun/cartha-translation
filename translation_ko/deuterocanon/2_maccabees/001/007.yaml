  source_fidelity: 그리스어의 관계절 τῇ ἐπελθούσῃ ἡμῖν은 여성 단수인 ἀκμῇ(급박한 위기/절정)에 직접 연결되므로, ‘우리에게 닥친’이 환난과 위기 모두를 수식하게 한 초안보다 위기만 수식하도록 바로잡는 것이 정확합니다. ἀφʼ οὗ는 단순히 사건 ‘뒤에’라기보다 그 사건을 기점으로 한 지속을 나타내므로 ‘이래’가 더 충실합니다. ἀπέστη는 물리적 출발로 한정되지 않는 이탈의 뜻을 지니므로 본문에서는 중립적 ‘떠난’을 유지하고 각주로 범위를 밝혔습니다.
  naturalness: ‘그분들께’는 원문의 단순한 2인칭 복수 여격에 없는 높임을 더하므로 ‘여러분에게’로 고쳤습니다. 연대 표기는 현대 한국어에서 ‘제169년에’가 자연스럽고, 각주 표지는 해당 낱말 바로 뒤에 배치했습니다.
  terminology: 데메트리오스, 유대인, 야손, 거룩한 땅, 왕국은 유지했습니다. ‘환난’은 θλίψις의 공동체적 고난을, ‘위기’는 ἀκμή의 급박한 국면을 자연스럽게 전달합니다.
