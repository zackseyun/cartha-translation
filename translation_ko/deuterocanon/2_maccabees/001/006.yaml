- source_word: ὧδε
  english_pob_choice: here
  chosen_korean: 여기서
  alternatives_korean:
  - 여기
  - 이곳에서
  lexicon: BDAG
  rationale: 장소를 나타내는 부사로 읽어, 문맥의 현장성을 살리는 ‘여기서’로 옮겼습니다.
- source_word: προσευχόμενοι
  english_pob_choice: praying
  chosen_korean: 기도하고 있습니다
  alternatives_korean:
  - 기도하며 있습니다
  - 기도합니다
  lexicon: BDAG
  rationale: 현재 분사의 진행성을 살리되 한국어에서는 현재 진행형이 가장 자연스럽고, 이어지는 상황 설명과도 잘 맞습니다.
- source_word: περὶ ὑμῶν
  english_pob_choice: for you
  chosen_korean: 여러분을 위하여
  alternatives_korean:
  - 여러분을 위해
  - 여러분에 관하여
  lexicon: BDAG
  rationale: 기도 문맥에서 περί + 속격은 ‘위하여/위해’가 가장 직접적이며, ‘관하여’보다 의미가 분명합니다.
theological_decisions:
- issue: 기도의 수신자와 관계를 드러내는 표현
  chosen_reading: ‘여러분을 위하여’로 번역해 중보 기도의 성격을 분명히 했습니다.
  alternative_readings:
  - ‘여러분에 관하여’
  - ‘여러분을 위해’
  rationale: 본문은 단순한 언급이 아니라 수신자를 향한 기도 행위를 말하므로, 기도의 방향성을 드러내는 번역이 소스의 힘을 보존합니다.
  doctrine_reference: 중보 기도
