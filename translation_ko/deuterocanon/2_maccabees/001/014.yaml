  text: For when Antiochus and his friends with him arrived at the place as though to marry her[a], in order to get the money in large amount as a dowry payment,
  footnotes:
  - marker: a
    text: Or 'to live with her' / 'to wed her.' The Greek participle συνοικῶν can refer to living together or entering marriage; here it likely reflects the pretense of marrying the goddess in order to seize temple funds.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 안티오쿠스와 그와 함께 있던 친구들이 마치 그녀와 결혼하려는 것처럼 그곳에 이르러, 더 많은 돈을 지참금으로 받으려고 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀와 함께 살려는 것처럼’ / ‘그녀와 결혼하려는 것처럼’. συνοικῶν은 함께 사는 것 또는 혼인 관계에 들어가는 것을 가리킬 수 있습니다. 여기서는 신전 재산을 빼앗기 위한 혼인 가장으로 이해하는 것이 가장 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνοικῶν
  english_pob_choice: as though to marry her
  chosen_korean: 마치 그녀와 결혼하려는 것처럼
  alternatives_korean:
  - 마치 그녀와 함께 살려는 것처럼
  - 마치 그녀와 동거하려는 것처럼
  - 마치 그녀와 혼인하려는 것처럼
  lexicon: LSJ
  rationale: συνοικέω는 동거와 혼인을 모두 가리킬 수 있으나, 문맥상 신전을 속이기 위한 혼인 가장이므로 ‘결혼하려는 것처럼’이 가장 자연스럽고 의미를 분명히 드러냅니다.
- source_word: παρεγένετο
