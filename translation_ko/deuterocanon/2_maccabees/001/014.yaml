  chosen_korean: 이르러
  alternatives_korean:
  - 도착하여
  - 왔습니다
  - 나타났습니다
  lexicon: BDAG
  rationale: 서술 흐름의 이동 동사로, 한국어에서는 간결한 연결어미 ‘-어/아 이르러’가 자연스럽습니다.
- source_word: τὰ χρήματα πλείονα
  english_pob_choice: the money in large amount
  chosen_korean: 더 많은 돈
  alternatives_korean:
  - 큰돈
  - 많은 돈
  - 더 큰 액수의 돈
  lexicon: LSJ
  rationale: πλείονα의 비교적 뉘앙스를 살리면서도, 단순한 액수보다 ‘더 많은’이 원문의 증가/다량성을 잘 보존합니다.
- source_word: εἰς φερνῆς λόγον
  english_pob_choice: as a dowry payment
  chosen_korean: 지참금으로
  alternatives_korean:
  - 지참금 명목으로
  - 혼수로
  - 지참금 지급 명목으로
  lexicon: LSJ
  rationale: φερνή는 지참금을 뜻하므로 한국어 관용 표현 ‘지참금으로’가 간결합니다. λόγος의 ‘명목/계정’ 뉘앙스는 문맥상 지참금으로 가장 자연스럽게 드러납니다.
theological_decisions:
- issue: 안티오쿠스의 접근을 혼인 의도로 가장한 것처럼 표현할지 여부
  chosen_reading: ‘마치 그녀와 결혼하려는 것처럼’이라고 옮겨, 실제 혼인이 아니라 속임수라는 서술상의 긴장을 살렸습니다.
  alternative_readings:
  - ‘그녀와 함께 살려는 것처럼’
  - ‘그녀와 혼인하려는 체로’
  rationale: 본문은 행위의 실제보다 의도된 가장을 강조하므로, 모호성을 지나치게 완화하지 않고 서술의 아이러니를 유지하는 번역이 적절합니다.
  doctrine_reference: 서사적 아이러니/의도와 행위의 구분
