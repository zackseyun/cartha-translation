  text: And when this happened and some time had passed[a], and the sun shone out though it was clouded over, a great fire was kindled, so that everyone marveled.
  footnotes:
  - marker: a
    text: 'Or ''while it was overcast.'' The Greek participial phrase ἐπινεφὴς ὤν describes cloudy conditions; the translation takes it concessively in context: the sun shone out despite the cloud cover.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일이 일어나고 시간이 좀 지난 뒤, 해가 구름에 덮여 있음에도 비쳐 나왔고, 큰 불이 붙어 모든 사람이 놀랐습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ ἐγένετο
  english_pob_choice: And when this happened
  chosen_korean: 이 일이 일어나고
  alternatives_korean:
  - 그 일이 일어나고
  - 그렇게 되자
  lexicon: LSJ
  rationale: 사건 전환을 여는 관용적 표현으로, 한국어에서는 자연스럽게 ‘이 일이 일어나고’로 풀어 주는 것이 문맥에 맞습니다.
- source_word: χρόνος διῆλθεν
  english_pob_choice: some time had passed
  chosen_korean: 시간이 좀 지난 뒤
  alternatives_korean:
  - 얼마간의 시간이 흘렀고
  - 시간이 지나고
  lexicon: LSJ
  rationale: 불특정한 경과 시간을 자연스럽게 드러내기 위해 ‘좀 지난 뒤’로 옮겼습니다.
- source_word: ὅ τε ἥλιος ἀνέλαμψεν ἐπινεφὴς ὤν
  english_pob_choice: and the sun shone out though it was clouded over
  chosen_korean: 해가 구름에 덮여 있음에도 비쳐 나왔고
  alternatives_korean:
  - 해가 흐린 가운데 비쳤고
  - 해가 구름으로 덮였음에도 빛났고
  lexicon: LSJ
  rationale: ἐπινεφής의 ‘구름 낀/덮인’ 상태를 살리면서, ἀνέλαμψεν의 ‘빛나다/비쳐 나오다’를 한국어로 자연스럽게 반영했습니다.
- source_word: ἀνήφθη πυρὰ μεγάλη
  english_pob_choice: a great fire was kindled
  chosen_korean: 큰 불이 붙어
  alternatives_korean:
  - 큰 불이 점화되어
  - 거대한 불이 붙어
  lexicon: LSJ
  rationale: 수동형 ‘was kindled’를 한국어에서 결과 상태 중심으로 옮겨, 서술의 흐름을 매끄럽게 했습니다.
- source_word: ὥστε θαυμάσαι πάντας
  english_pob_choice: so that everyone marveled
  chosen_korean: 모든 사람이 놀랐습니다
  alternatives_korean:
  - 모든 사람이 탄복했습니다
  - 모두가 경탄했습니다
  lexicon: LSJ
  rationale: 결과 절의 보편성을 살리면서, θαυμάσαι의 강한 놀라움/경이 반응을 현대 한국어로 간명하게 표현했습니다.
