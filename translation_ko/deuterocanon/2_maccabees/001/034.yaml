translation:
  language: ko
  text: 그런데 왕은 그것을 둘러싸고, 그 일을 시험해 본 뒤 거룩하게 만들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘성소로 만들었다.’ 헬라어는 보어로 읽어 ‘거룩하게 만들었다’고도, 명사적으로 읽어 ‘성소로 만들었다’고도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιφράξας
  english_pob_choice: enclosed
  chosen_korean: 둘러싸고
  alternatives_korean:
  - 울타리를 치고
  - 둘러막고
  - 가두고
  lexicon: LSJ
  rationale: 울타리나 담의 구체적 형태를 과도하게 특정하지 않으면서, 원문의 ‘둘러서 경계 짓다’는 동작을 자연스럽게 살립니다.
- source_word: ἱερὸν
  english_pob_choice: made it sacred
  chosen_korean: 거룩하게 만들었습니다
  alternatives_korean:
  - 성소로 만들었습니다
  - 성스럽게 만들었습니다
  - 성역으로 삼았습니다
  lexicon: LSJ
  rationale: 여기서는 명사 ‘성소’보다 ἐποίησεν의 보어로서의 형용사적 용법이 더 잘 맞으므로, ‘거룩하게’로 처리해 사물의 봉헌·성별을 드러냅니다.
- source_word: δοκιμάσας τὸ πρᾶγμα
  english_pob_choice: after testing the matter
  chosen_korean: 그 일을 시험해 본 뒤
  alternatives_korean:
  - 그 일을 검증한 뒤
  - 그 사안을 살핀 뒤
  - 그 사태를 확인한 뒤
  lexicon: LSJ
  rationale: δοκιμάζω의 ‘시험하다/검증하다’의 의미를 살리되, 한국어에서는 ‘시험해 보다’가 절차적 확인의 뉘앙스를 가장 자연스럽게 전합니다.
theological_decisions:
- issue: ἱερὸν의 의미를 건물 명칭으로 볼지, 봉헌 행위로 볼지
  chosen_reading: 건축된 성전 자체를 새로 세웠다기보다, 둘러싼 그 대상을 거룩한 것으로 구별해 두었다는 봉헌 의미로 읽었습니다.
  alternative_readings:
  - ‘성소를 만들었다’로 읽어 별도의 성소 건립을 암시할 수 있습니다.
  - ‘성역으로 삼았다’로 읽어 의례적 보호 구역의 설정으로 볼 수 있습니다.
  rationale: 문장 구조상 ἱερὸν은 ἐποίησεν의 보어로 기능하는 것이 자연스럽고, 문맥도 ‘무엇을 만들었다’보다 ‘거룩하게 구별했다’는 뜻에 더 가깝습니다.
  doctrine_reference: 원문 우선 원칙; 번역 전통보다 문장 구조와 문맥을 우선함
