base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/018.yaml
  text: Since we are about to celebrate the purification of the temple on the twenty-fifth of Chasleu[a], we thought it necessary to make this clear to you also, so that you too may celebrate the festival of booths and of the fire, when Nehemiah, after building both the temple and the altar, offered sacrifices.
  footnotes:
  - marker: a
    text: Or, more interpretively, 'and the fire festival.' The Greek simply reads 'and of the fire,' likely alluding to the commemorative account that follows.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리가 하잘레우[a] 스물다섯째 날에 성전의 정결을 거행하려 하므로, 여러분에게도 이것을 설명하는 것이 마땅하다고 여겼습니다. 그래서 여러분도 초막절과 불의 절기를 지키게 하려는 것입니다. 그때 느헤미야는 성전과 제단을 세우고 제물을 바쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 그리스어의 달명 Χασελεύ를 음역한 형태입니다. 통용 표기인 ‘키슬레우’와는 차이가 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μέλλοντες ἄγειν
  english_pob_choice: Since we are about to celebrate
  chosen_korean: 우리가 … 거행하려 하므로
  alternatives_korean:
  - 우리가 … 지키려 하므로
  - 우리가 … 기념하려 하므로
  lexicon: LSJ
  rationale: festival context의 ἄγειν은 단순한 ‘가다’가 아니라 절기를 ‘거행하다/지키다’의 뜻이므로, imminent intent를 살려 자연스럽게 옮겼습니다.
- source_word: ἐν τῷ Χασελεὺ πέμπτῃ καὶ εἰκάδι
  english_pob_choice: on the twenty-fifth of Chislev
  chosen_korean: 하잘레우 스물다섯째 날
  alternatives_korean:
  - 키슬레우 스물다섯째 날
  - 하잘루 스물다섯째 날
  lexicon: LSJ
  rationale: 달명은 그리스어 음역을 따라 현대 한국어식 표기로 옮겼고, ημερομηνία는 ‘스물다섯째 날’로 자연스럽게 표현했습니다.
- source_word: τὸν καθαρισμὸν τοῦ ἱεροῦ
  english_pob_choice: the purification of the temple
  chosen_korean: 성전의 정결
  alternatives_korean:
  - 성전의 정화
  - 성전의 깨끗하게 함
  lexicon: LSJ
  rationale: καθαρισμός의 핵심은 ‘정결/정화’이지만, 한국어 성경 문체에서는 ‘정결’이 가장 직접적이고 간결합니다.
- source_word: διασαφῆσαι ὑμῖν
  english_pob_choice: to make this clear to you
  chosen_korean: 이것을 설명하는 것이
  alternatives_korean:
  - 이것을 분명히 밝히는 것이
  - 이것을 자세히 설명하는 것이
  lexicon: LSJ
  rationale: διασαφῆσαι는 단순 고지가 아니라 ‘분명히 설명하다’의 뜻이므로, 문맥상 ‘설명하다’가 가장 적절합니다.
- source_word: σκηνοπηγίας καὶ τοῦ πυρός
  english_pob_choice: the festival of booths and of the fire
  chosen_korean: 초막절과 불의 절기
  alternatives_korean:
  - 초막절과 불의 축제
  - 초막절과 불의
  lexicon: LSJ
  rationale: σκηνοπηγία는 초막절로 옮기고, τοῦ πυρός는 문자적 ‘불의’보다 절기 명칭으로 읽히도록 하되 원문의 압축성을 유지했습니다.
theological_decisions:
- issue: τοῦ πυρός의 번역 범위
  chosen_reading: 불의 절기
  alternative_readings:
  - 불의
  - 불의 축제
  rationale: 그리스어는 단순히 ‘불의’라고만 적어 두어 그 의미를 완전히 해석하지 않습니다. 한국어 본문은 축제/절기 맥락을 드러내되, 원문의 애매성을 과도하게 해소하지 않도록 ‘불의 절기’로 절제해 옮겼습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
