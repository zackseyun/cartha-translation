translation:
  language: ko
  text: 그리고 그의 율법과 계명들 안에서 여러분의 마음을 여시고 평강을 이루어 주시기를 바랍니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 그리스어 부정사들은 앞절의 기도를 이어 받습니다. 따라서 이 절은 ‘그가 여러분의 마음을 여시고 … 평강을 이루어 주시기를 바랍니다’라는 기원의 연속으로 읽을 수 있습니다.
    reason: theological_note
lexical_decisions:
- source_word: διανοίξαι
  english_pob_choice: open
  chosen_korean: 여시고
  alternatives_korean:
  - 열어
  - 열게 하시고
  - 열어 주시고
  lexicon: LSJ
  rationale: aorist 부정사로 이어지는 기원의 흐름을 살리면서, 마음의 문을 ‘열다’는 기본 이미지를 간결하게 반영했습니다.
- source_word: καρδίαν
  english_pob_choice: heart
  chosen_korean: 마음
  alternatives_korean:
  - 심장
  - 가슴
  - 내면
  lexicon: LSJ
  rationale: 성경적 ‘heart’의 중심 의미를 한국어의 자연스러운 ‘마음’으로 옮겨, 이해와 의지의 내적 중심을 함께 담았습니다.
- source_word: ἐν τῷ νόμῳ αὐτοῦ καὶ ἐν τοῖς προστάγμασιν
  english_pob_choice: in his law and in the commandments
  chosen_korean: 그의 율법과 계명들 안에서
  alternatives_korean:
  - 그의 율법과 계명들에
  - 그의 율법과 계명들 속에서
  - 그의 율법과 계명들 가운데서
  lexicon: LSJ
  rationale: ἐν의 영역적 용법을 따라 ‘안에서’로 옮겼고, νόμος와 προστάγματα는 이 문맥에서 각각 ‘율법’과 ‘계명들’로 유지했습니다.
- source_word: ποιῆσαι εἰρήνην
  english_pob_choice: bring about peace
  chosen_korean: 평강을 이루어 주시기를
  alternatives_korean:
  - 평강을 만드시기를
  - 평화를 이루시기를
  - 평강을 주시기를
  lexicon: LSJ
  rationale: ποιῆσαι의 원인·실행적 힘을 살려 단순한 ‘주다’보다 ‘이루다’로 옮겼고, εἰρήνη는 프로젝트 기본어휘에 맞춰 ‘평강’으로 렌더링했습니다.
theological_decisions:
- issue: 1절 내부에 드러나지 않는 기원의 주체와 이어짐
  chosen_reading: 이 절만 독립적으로 읽을 때도 기원문의 흐름이 느껴지도록, ‘여러분의 마음을 여시고 … 주시기를 바랍니다’로 옮겼습니다.
  alternative_readings:
  - ‘여러분의 마음을 열고 … 평강을 이루게 하십시오’처럼 명령형으로 처리
  - 앞절의 주어를 보충해 ‘그가 여러분의 마음을 여시고 …’로 명시
  rationale: 그리스어 부정사들이 앞절의 기도를 이어 받는 점을 존중하되, 한국어 본문은 단독 절로서도 자연스럽게 읽히도록 기원형으로 정리했습니다.
  doctrine_reference: 원문 종속구문의 기도적 기능을 보존하면서도 문맥 의존성을 과도하게 보충하지 않는 번역 원리
