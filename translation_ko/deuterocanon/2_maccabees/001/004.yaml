translation:
  language: ko
  text: 그리고 그의 율법과 계명들에 대하여 여러분의 마음을 열어 주시고 평강을 이루어 주시기를 바랍니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 그리스어 부정사들은 앞절의 기도를 이어받습니다. 따라서 이 절은 ‘그가 여러분의 마음을 여시고 … 평강을 이루어 주시기를 바랍니다’라는 기원의 연속으로 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: διανοίξαι
