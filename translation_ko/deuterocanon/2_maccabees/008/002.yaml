  text: And they were calling on the Lord to look upon the people trampled down by all[a], and also to have mercy on the temple that had been defiled by ungodly men;
  footnotes:
  - marker: a
    text: Or 'had been profaned' or 'had been desecrated.' The Greek emphasizes that the holy temple had been treated as common by impious human agents.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 주님께서 모든 사람에게 짓밟히고 있는 백성을 굽어보시고, 또한 경건하지 못한 사람들에 의해 더럽혀진 성전을 불쌍히 여기시기를 간구하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '더럽혀진'보다 더 강하게 '속되게 된' 또는 '모독된'으로 옮길 수 있습니다. 원문의 뜻은 거룩한 성전이 불경한 사람들에 의해 일반적인 것으로 취급되었다는 데 있습니다.
    reason: lexical_alternative
