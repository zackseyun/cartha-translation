  yaml_path: translation/deuterocanon/2_maccabees/008/002.yaml
  text: And they were calling on the Lord to look upon the people trampled down by all[a], and also to have mercy on the temple that had been defiled by ungodly men;
  footnotes:
  - marker: a
    text: Or 'had been profaned' or 'had been desecrated.' The Greek emphasizes that the holy temple had been treated as common by impious human agents.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 주님께서 모든 이에게 짓밟히고 있는 백성을 굽어보시고, 또한 불경한 사람들에 의해 더럽혀진 성전을 불쌍히 여기시기를 간구하고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '모독된' 또는 '속되게 된'으로 옮길 수 있습니다. 원문은 거룩한 성전이 불경한 사람들에 의해 속된 것으로 취급되었음을 뜻합니다.
    reason: lexical_alternative
