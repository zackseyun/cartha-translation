    rationale: ἐλεῆσαι와 εἰσακοῦσαι는 앞 문맥의 청원에 딸린 병렬 부정사입니다. 본 절 자체에는 ‘하게 하셨다’에 해당하는 동사가 없습니다.
  - severity: high
    issue: ‘피’를 ‘불쌍히 여기다’의 목적어처럼 연결합니다.
    rationale: 원문은 ‘도시를 불쌍히 여기다’와 ‘그분께 부르짖는 피들을 듣다’를 구별합니다. 한국어에서는 두 동사와 목적어를 명확히 분리해야 합니다.
