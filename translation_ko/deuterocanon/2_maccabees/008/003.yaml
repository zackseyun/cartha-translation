  doctrine_reference: 의도된 신학적 긴장 보존
- issue: 도시의 정체성 명시 여부
  chosen_reading: ‘그 도시’로 두고, 본문 안에서 예루살렘을 직접 이름 붙이지 않았습니다.
  alternative_readings:
