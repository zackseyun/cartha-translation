  text: 그리고 파괴되고 있던 그 도시, 곧 평지처럼 될 도시를 불쌍히 여기시고, 그분께 부르짖는 피의 부르짖음을 들어 주시기를.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 여기서 ‘피들’이라는 복수형을 사용합니다. 이는 여러 피 흘림이나 유혈 및 피의 책임을 강조할 수 있습니다.
    reason: source_note
  - marker: b
    text: ‘피의 부르짖음’이라는 표현은 피가 하나님께 부르짖는 성경의 모티프를 떠올리게 합니다.
    reason: cross_reference
