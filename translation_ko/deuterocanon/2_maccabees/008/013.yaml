lexical_decisions:
- source_word: δειλανδροῦντες
  english_pob_choice: had become cowardly
  chosen_korean: 겁쟁이가 되어
  alternatives_korean:
  - 비겁해져
  - 소심해져
  - 비굴해져
  lexicon: LSJ
  rationale: 동사의 결과적·변화적 뉘앙스를 살려 ‘되어’로 옮기고, 문맥의 책망조를 드러내기 위해 ‘겁쟁이’로 번역했습니다.
- source_word: ἀπιστοῦντες
  english_pob_choice: distrusted
  chosen_korean: 불신하던
  alternatives_korean:
  - 믿지 않던
  - 신뢰하지 않던
  - 의심하던
  lexicon: BDAG/LSJ
  rationale: 대상인 ‘하나님의 심판’과의 관계에서는 일반적 ‘불신’보다 ‘신뢰하지 않음’이 자연스럽고, POB의 ‘distrusted’와도 맞닿습니다.
- source_word: δίκην
  english_pob_choice: judgment
  chosen_korean: 심판
  alternatives_korean:
  - 정의
  - 재판
  - 징벌
  lexicon: LSJ
  rationale: 여기서는 하나님의 न्याय/판정이 실제로 집행되는 뉘앙스가 강하므로, ‘정의’보다 사건적·사법적 의미를 드러내는 ‘심판’이 적절합니다.
- source_word: ἐξετόπιζον
  english_pob_choice: going into exile
  chosen_korean: 망명했습니다
  alternatives_korean:
  - 도망했습니다
  - 떠돌아다녔습니다
  - 유배되었습니다
  lexicon: LSJ
  rationale: 문맥상 고향/거처를 떠나 밖으로 밀려나는 이동을 나타내므로, 자발적 도피보다 강한 ‘망명’이 displacement를 잘 살립니다.
theological_decisions:
- issue: τὴν τοῦ θεοῦ δίκην의 의미 범위
  chosen_reading: 하나님의 심판
  alternative_readings:
  - 하나님의 정의
  - 하나님의 징벌
  rationale: δίκη는 단순한 추상 명사 ‘정의’만이 아니라 하나님이 실제로 판결하고 집행하시는 행위를 가리킬 수 있으므로, 범위를 너무 좁히지 않는 ‘심판’으로 두었습니다.
  doctrine_reference: 'DOCTRINE.md: θε/δικαιοσύνη 관련 표현은 문맥상 긴장을 보존하고, 정의·심판·징벌의 어느 한쪽으로 과도하게 환원하지 말 것.'
