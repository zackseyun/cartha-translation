    reason: lexical_alternative
lexical_decisions:
- source_word: ὁπλολογήσαντες
  english_pob_choice: stripping them of their arms
  chosen_korean: 그들의 무기를 빼앗은 뒤
  alternatives_korean:
  - 그들의 무기를 거둔 뒤
  - 그들의 무장을 해제한 뒤
  lexicon: LSJ
  rationale: 복합어가 패배한 자들로부터 무기를 걷어 가는 행위를 가리키므로, 대상인 αὐτούς를 살리는 구체적 표현으로 ‘빼앗은 뒤’를 택했습니다.
- source_word: ἐπιμελῶς
  english_pob_choice: carefully
  chosen_korean: 조심스럽게
  alternatives_korean:
