  chosen_korean: 나머지 전리품은
  alternatives_korean:
  - 남은 노획물은
  - 남은 전리품은
  lexicon: LSJ
  rationale: σκῦλα는 전쟁에서 얻은 전리품을 뜻하므로, 한국어 성경 문체에서 통용되는 ‘전리품’이 가장 정확합니다.
theological_decisions:
- issue: 전리품 처리와 예루살렘 운반의 의미
  chosen_reading: 단순한 전리품 회수와 보관의 서술로 읽었습니다.
  alternative_readings:
  - 종교적 헌납의 뉘앙스를 강하게 보는 읽기
  - 승전 과시를 강조하는 읽기
  rationale: 본문 자체는 전리품을 정리해 두고 남은 것을 예루살렘으로 운반했다고만 말하며, 그 이상의 해석은 소스가 직접 요구하지 않습니다.
  doctrine_reference: 본문 서술의 범위 유지
