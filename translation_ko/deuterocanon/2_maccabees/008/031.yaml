  text: 그들은 그들에게서 무기를 면밀히 거두어들인 뒤[a], 모든 것을 알맞은 곳에 두었고, 나머지 전리품은 예루살렘으로 가져갔습니다.
  philosophy: optimal-equivalence
  footnotes:
