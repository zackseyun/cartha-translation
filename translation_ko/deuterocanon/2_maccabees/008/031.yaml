  text: 그들은 조심스럽게 그들의 무기를 빼앗은 뒤, 모든 것을 알맞은 곳에 두었고, 나머지 전리품은 예루살렘으로 가져갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
