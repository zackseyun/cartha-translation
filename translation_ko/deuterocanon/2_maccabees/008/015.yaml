  text: and not because of them[a], but because of the covenants made with their fathers[b], and because of the invocation of his majestic and magnificent name over them.
  footnotes:
  - marker: a
    text: Or 'not for their sake.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the invocation of his majestic and magnificent name over them,' an idiom for God's name being called over his people.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그들 때문이 아니라, 그들의 조상들과 맺으신 언약들 때문이며, 또 그들 위에 불린 그분의 장엄하고 위엄 있는 이름의 호출 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들 때문이 아니라’는 직역하면 ‘그들의 편이 아니라 / 그들의 유익을 위해서가 아니라’의 뜻이 될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들 위에 불린’은 하나님의 이름이 자기 백성 위에 선포·호명된다는 구약적 관용구를 반영합니다.
    reason: cultural_note
lexical_decisions:
- source_word: εἰ μὴ διʼ αὐτούς
  english_pob_choice: not because of them
  chosen_korean: 그들 때문이 아니라
  alternatives_korean:
  - 그들을 위해서가 아니라
  - 그들 때문에가 아니라
  lexicon: LSJ
  rationale: 부정된 원인을 자연스러운 한국어로 살리되, 그들의 공로가 원인이 아님을 분명히 했습니다.
- source_word: διὰ τὰς πρὸς τοὺς πατέρας αὐτῶν διαθήκας
  english_pob_choice: because of the covenants made with their fathers
  chosen_korean: 그들의 조상들과 맺으신 언약들 때문에
  alternatives_korean:
  - 그들의 조상들과의 언약들 때문에
  - 그들의 조상들에게 주신 언약들 때문에
  lexicon: LSJ
  rationale: διαθήκας는 여기서 분명히 ‘언약’이며, πρὸς τοὺς πατέρας의 관계성을 한국어에서는 ‘맺으신’으로 자연스럽게 옮겼습니다.
- source_word: τῆς ἐπʼ αὐτοὺς ἐπικλήσεως
  english_pob_choice: the invocation of his majestic and magnificent name over them
  chosen_korean: 그들 위에 불린 그분의 장엄하고 위엄 있는 이름의 호출
  alternatives_korean:
  - 그들 위에 불린 그분의 장엄하고 위엄 있는 이름의 부름
  - 그들 위에 불린 그분의 이름이 호출된 것
  lexicon: LSJ
  rationale: ἐπίκλησις의 제의적·관용적 뜻을 살리기 위해 단순한 ‘부르심’보다 ‘호출’로 두었고, ἐπʼ αὐτούς의 ‘위에’도 유지했습니다.
- source_word: τοῦ σεμνοῦ καὶ μεγαλοπρεποῦς ὀνόματος αὐτοῦ
  english_pob_choice: his majestic and magnificent name
  chosen_korean: 그분의 장엄하고 위엄 있는 이름
  alternatives_korean:
  - 그분의 위엄스럽고 찬란한 이름
  - 그분의 존귀하고 위엄 있는 이름
  lexicon: LSJ
  rationale: σεμνός와 μεγαλοπρεπής의 격식을 살리되, 한국어에서 과도하게 장식적이지 않도록 ‘장엄하고 위엄 있는’으로 정리했습니다.
theological_decisions:
- issue: 언약과 이름의 호명이라는 두 근거의 병렬성
  chosen_reading: 하나님의 호의는 그들의 자격이 아니라 조상들과의 언약과 그들 위에 불린 하나님의 이름이라는 두 근거에 의해 설명됩니다.
  alternative_readings:
  - 한쪽을 더 강조해 언약만의 근거로 읽는 것
  - 이름의 호명을 단순한 명예 표현으로 완화하는 것
  rationale: 본문은 ‘그들 때문이 아니라’와 ‘언약’과 ‘이름의 호출’이라는 두 이유를 병렬로 제시하므로, 그 긴장을 그대로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
