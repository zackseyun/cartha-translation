translation:
  language: ko
  text: 그리고 그들 때문이 아니라[a], 그들의 조상들과 맺은 언약들 때문이며, 또 그들 위에 그분의 존귀하고 위엄 있는 이름이 불린 일 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들 때문이 아니라’는 ‘그들을 위하여가 아니라’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들 위에 … 이름이 불린’은 하나님의 이름이 한 백성 위에 불렸다는 뜻의 성경적 관용 표현을 반영합니다.
    reason: cultural_note
lexical_decisions:
- source_word: εἰ μὴ διʼ αὐτούς
  english_pob_choice: not because of them
  chosen_korean: 그들 때문이 아니라
  alternatives_korean:
  - 그들을 위해서가 아니라
  - 그들 때문에가 아니라
  lexicon: LSJ
  rationale: 부정된 원인을 자연스러운 한국어로 살리되, 그들의 공로가 원인이 아님을 분명히 했습니다.
- source_word: διὰ τὰς πρὸς τοὺς πατέρας αὐτῶν διαθήκας
  english_pob_choice: because of the covenants made with their fathers
  chosen_korean: 그들의 조상들과 맺으신 언약들 때문에
  alternatives_korean:
  - 그들의 조상들과의 언약들 때문에
