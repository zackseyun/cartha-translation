lexical_decisions:
- source_word: ἐφʼ οἷς
  english_pob_choice: With these words
  chosen_korean: 이 말로
  alternatives_korean:
  - 이것들로
  - 그 말로
  lexicon: LSJ
  rationale: 앞선 권면의 내용을 가리키는 도구적 표현이므로, 자연스러운 한국어로 ‘이 말로’라고 옮겼습니다.
- source_word: εὐθαρσεῖς παραστήσας
  english_pob_choice: made them confident
  chosen_korean: 그들을 용기 있게 하고
  alternatives_korean:
  - 그들을 자신 있게 하고
  - 그들을 담대하게 하고
  lexicon: LSJ
  rationale: 형용사 εὐθαρσεῖς의 ‘좋은 용기/담대함’의 뜻을 살려, 행위를 유발하는 표현으로 옮겼습니다.
- source_word: ὑπὲρ τῶν νόμων καὶ τῆς πατρίδος
  english_pob_choice: for the laws and the fatherland
  chosen_korean: 율법과 조국을 위해
  alternatives_korean:
  - 율법과 հայր지(조상의 땅)을 위해
  - 법과 고향을 위해
  lexicon: LSJ
  rationale: νόμων은 유대적 맥락에서 복수의 ‘율법들’로 보이지만 한국어에서는 ‘율법’이 자연스럽고, πατρίς는 단순한 ‘고향’보다 공동체적·정치적 무게가 있는 ‘조국’이 더 가깝습니다.
- source_word: τετραμερές τι ἐποίησεν τὸ στράτευμα
  english_pob_choice: he formed the army into four parts
  chosen_korean: 군대를 네 부분으로 편성하였습니다
  alternatives_korean:
  - 군대를 네 분대로 나누었습니다
  - 군대를 네 갈래로 나누었습니다
  lexicon: LSJ
  rationale: τετραμερές의 ‘네 부분/네 갈래’ 의미를 유지하면서, στράτευμα를 군사적 집단으로 자연스럽게 한국어화했습니다.
theological_decisions:
- issue: πατρίς의 정서적·정치적 뉘앙스
  chosen_reading: ‘조국’으로 옮겨, 율법에 대한 충성과 공동체적 귀속의 긴장을 드러냈습니다.
  alternative_readings:
  - 고향
  - 조상의 땅
  rationale: 이 절은 율법과 나라에 대한 충성을 병치하므로, 단순한 지리적 ‘고향’보다 공동체적 충성의 무게가 있는 표현이 문맥에 더 적합합니다.
  doctrine_reference: 2 Maccabees의 순교/민족 정체성 문맥
