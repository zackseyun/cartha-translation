  text: For they[a], he said, have put their confidence in weapons and boldness, but we have put our confidence in Almighty God, who is able with a single nod to bring down both those coming against us and the whole world.
  footnotes:
  - marker: a
    text: Or 'with one gesture' or 'with a single sign.' The Greek literally refers to a nod or signal, emphasizing how effortlessly God can overthrow enemies.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. “그들은 무기와 대담함을 신뢰하지만, 우리는 전능하신 하나님을 신뢰합니다. 하나님께서는 한 번 고개를 끄덕이시는 것만으로도[a] 우리에게 맞서 오는 자들과 온 세상을 쓰러뜨리실 수 있습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘고개를 끄덕이시는 것’은 그리스어 νεῦμα의 문자적 의미인 고개 끄덕임 또는 신호를 반영합니다. 이 표현은 하나님께서 아주 손쉽게 적들을 쓰러뜨리실 수 있음을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπλοις
  english_pob_choice: weapons
  chosen_korean: 무기
  alternatives_korean:
  - 병기
  - 무장
  lexicon: LSJ
  rationale: 전투 맥락에서 ὅπλοις는 전쟁 도구를 가리키므로, 현대 한국어에서 자연스럽고 명확한 ‘무기’로 옮겼습니다.
- source_word: τόλμαις
  english_pob_choice: boldness
  chosen_korean: 대담함
  alternatives_korean:
  - 용맹
  - 배짱
  - 담대함
  lexicon: LSJ
  rationale: 이 단어는 전투에서의 과감함을 뜻하므로, ‘담대함’보다 약간 더 적극적인 뉘앙스의 ‘대담함’이 문맥에 맞습니다.
- source_word: ἐπὶ τῷ παντοκράτορι θεῷ
  english_pob_choice: in God Almighty
  chosen_korean: 전능하신 하나님
  alternatives_korean:
  - 전능하신 하나님 안에
  - 전능하신 하나님께
  lexicon: LSJ
  rationale: ἐπί+여격은 의존/근거의 뜻을 나타내므로 한국어에서는 ‘~을 신뢰합니다’로 자연스럽게 처리하고, παντοκράτωρ는 관용적인 ‘전능하신’으로 살렸습니다.
- source_word: ἑνὶ νεύματι
  english_pob_choice: with a single nod
  chosen_korean: 한 번의 고갯짓으로
  alternatives_korean:
  - 한 번의 몸짓으로
  - 한 번의 신호로
  lexicon: LSJ
  rationale: νεῦμα는 ‘고개 끄덕임/신호’의 뜻이므로, 하나님의 손쉬운 행동을 드러내는 이미지로 ‘고갯짓’이 가장 직접적입니다.
theological_decisions:
- issue: παντοκράτωρ의 신학적 뉘앙스
  chosen_reading: 전능하신 하나님
  alternative_readings:
  - 모든 것을 다스리시는 하나님
  - 전능자 하나님
  rationale: 문맥은 하나님의 절대적 능력을 대조적으로 강조하므로, 표준적이면서도 힘이 분명한 ‘전능하신 하나님’이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: 신적 칭호는 현대어로 자연스럽게 번역하되, 권능의 신학적 무게를 보존한다.'
- issue: ἑνὶ νεύματι의 과장적 표현
  chosen_reading: 한 번의 고갯짓으로
  alternative_readings:
  - 한 번의 몸짓으로
  - 한 번의 신호로
  rationale: 이 표현은 하나님의 초월적이고 손쉬운 개입을 강조하는 수사이므로, 과장된 이미지를 완화하지 않고 그대로 살렸습니다.
  doctrine_reference: 'DOCTRINE.md: 수사적 긴장과 과장 표현은 평탄화하지 말고 유지한다.'
