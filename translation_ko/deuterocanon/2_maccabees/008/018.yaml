  - 전능자 하나님
  rationale: 문맥은 하나님의 절대적 능력을 대조적으로 강조하므로, 표준적이면서도 힘이 분명한 ‘전능하신 하나님’이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: 신적 칭호는 현대어로 자연스럽게 번역하되, 권능의 신학적 무게를 보존한다.'
- issue: ἑνὶ νεύματι의 과장적 표현
  chosen_reading: 한 번의 고갯짓으로
  alternative_readings:
  - 한 번의 몸짓으로
  - 한 번의 신호로
  rationale: 이 표현은 하나님의 초월적이고 손쉬운 개입을 강조하는 수사이므로, 과장된 이미지를 완화하지 않고 그대로 살렸습니다.
  doctrine_reference: 'DOCTRINE.md: 수사적 긴장과 과장 표현은 평탄화하지 말고 유지한다.'
