base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/035.yaml
  text: Having been humbled by those who were thought to be the least among his own[a], and by the Lord’s help having laid aside his splendid robe, he made himself like a fugitive, traveling through the inland country in isolation and came to Antioch[c][b], having prospered beyond all expectation in the destruction of his army.
  footnotes:
  - marker: a
    text: Or, more literally, 'through the interior.' The Greek term refers to inland territory, not the Mediterranean Sea.
    reason: lexical_alternative
  - marker: b
    text: '''Like a fugitive'' translates an expression that can more literally mean ''in the manner of a runaway.'''
    reason: lexical_alternative
  - marker: c
    text: 'The wording is ironic: he ''prospered'' only in relation to the destruction of his own army.'
    reason: lexical_alternative
translation:
  language: ko
  text: 자기편이라고 여겨지는 가장 하찮은 자들에게 굴욕을 당하였지만, 주님의 도움으로 그의 화려한 겉옷을 벗어 던지고, 마치 도망자처럼 외딴길로 홀로 몸을 숨겨 안티오키아에 이르렀습니다. 그는 자기 군대의 멸망 속에서 오히려 크게 번영한 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 διὰ τῆς μεσογείου는 ‘바다를 통해’가 아니라 ‘내륙/중앙 지방을 통해’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: δραπέτου τρόπον은 문자적으로는 ‘도망한 자의 방식으로’에 가깝습니다.
    reason: lexical_alternative
  - marker: c
    text: εὐημερηκώς는 이 문맥에서 자기 군대의 멸망과 대비되는 반어적 ‘번영’을 가리킵니다.
    reason: theological_note
lexical_decisions:
- source_word: ταπεινωθεὶς
  english_pob_choice: Having been humbled
  chosen_korean: 굴욕을 당하였지만
  alternatives_korean:
  - 낮아졌지만
  - 수치를 당하였지만
  lexicon: LSJ
  rationale: 수동 분사로서 외부에서 낮아짐을 당한 상태를 살리되, 문맥의 치욕성과 역전의 뉘앙스를 함께 전달합니다.
- source_word: ὑπὸ τῶν καθʼ αὑτὸν νομιζομένων ἐλαχίστων εἶναι
  english_pob_choice: by those who were thought to be the least among his own
  chosen_korean: 자기편이라고 여겨지는 가장 하찮은 자들에게
  alternatives_korean:
  - 그의 편에서 가장 보잘것없는 자들에게
  - 그 주위의 가장 미미한 자들에게
  lexicon: LSJ
  rationale: καθʼ αὑτόν을 자기편/자기 진영으로 풀어, 그가 하찮게 여겼던 자들로부터 굴욕을 당했다는 역설을 드러냈습니다.
- source_word: τῇ τοῦ κυρίου βοηθείᾳ
  english_pob_choice: with the Lord’s help
  chosen_korean: 주님의 도움으로
  alternatives_korean:
  - 주님의 원조로
  - 주님의 도우심으로
  lexicon: LSJ
  rationale: 도구적 여격을 자연스럽게 옮기면서, κύριος를 본문 맥락에 맞게 주님으로 번역했습니다.
- source_word: τὴν δοξικὴν ἀποθέμενος ἐσθῆτα
  english_pob_choice: having laid aside his splendid robe
  chosen_korean: 그의 화려한 겉옷을 벗어 던지고
  alternatives_korean:
  - 그의 찬란한 옷을 벗어 두고
  - 그의 영화로운 옷을 벗고
  lexicon: LSJ
  rationale: δοξικήν의 ‘찬란함/화려함’을 살리되, 왕실·권세의 상징인 겉옷이라는 이미지를 한국어로 자연스럽게 옮겼습니다.
- source_word: διὰ τῆς μεσογείου
  english_pob_choice: through the inland country
  chosen_korean: 외딴길로
  alternatives_korean:
  - 내륙을 지나
  - 안쪽 지방을 통해
  lexicon: LSJ
  rationale: POB의 주석처럼 여기서 μεσόγειος는 바다가 아니라 내륙/중앙 지역을 가리키므로, ‘도망자처럼’과 결합되는 이동의 성격을 살려 간결하게 표현했습니다.
- source_word: δραπέτου τρόπον
  english_pob_choice: like a fugitive
  chosen_korean: 마치 도망자처럼
  alternatives_korean:
  - 달아난 사람처럼
  - 도망노예처럼
  lexicon: LSJ
  rationale: δραπέτης의 기본적 의미를 살리되, 본문이 강조하는 것은 신분보다 수치스러운 도피 방식이므로 가장 중립적이고 자연스러운 표현을 택했습니다.
- source_word: ἔρημον ἑαυτὸν ποιήσας
  english_pob_choice: in isolation
  chosen_korean: 홀로 몸을 숨겨
  alternatives_korean:
  - 외롭게 자신을 만들고
  - 자신을 외딴사람으로 삼아
  lexicon: LSJ
  rationale: 직역의 어색함을 피하면서, 자신을 고립된 상태로 만든다는 뜻을 한국어 동작으로 풀었습니다.
- source_word: ὑπὲρ ἅπαν εὐημερηκὼς
  english_pob_choice: having prospered beyond all expectation
  chosen_korean: 오히려 크게 번영한 것입니다
  alternatives_korean:
  - 모든 기대를 넘어 잘된 것입니다
  - 지극히 잘된 것입니다
  lexicon: LSJ
  rationale: εὐημερέω의 ‘형통/번영’과 ὑπὲρ ἅπαν의 과장을 살리되, 문맥의 반어성을 드러내기 위해 ‘오히려’와 결합했습니다.
- source_word: ἐπὶ τῇ τοῦ στρατοῦ διαφθορᾷ
  english_pob_choice: in the destruction of his army
  chosen_korean: 자기 군대의 멸망 속에서
  alternatives_korean:
  - 군대의 파멸 가운데서
  - 그 군대의 파괴 속에서
  lexicon: LSJ
  rationale: διαφθορά를 단순한 손실이 아닌 파멸/멸망으로 옮겨, 그가 누린 ‘번영’이 자기 군대의 파괴와 맞물린 역설을 보존했습니다.
theological_decisions:
- issue: κύριος의 번역과 경어
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 주인
  rationale: 본문은 야훼의 도우심을 말하는 문맥이므로, 한국어에서는 신적 호칭으로 ‘주님’을 택해 경외의 뉘앙스를 유지했습니다.
  doctrine_reference: 'Contested terms: κύριος → 주님'
- issue: 본문의 반어적 진술 보존
  chosen_reading: 오히려 크게 번영한 것입니다
  alternative_readings:
  - 잘된 것입니다
  - 성공한 것입니다
  rationale: 그의 번영이 실제로는 군대의 멸망과 맞물린다는 반어를 평탄화하지 않고, 독자가 역설을 읽어 내도록 유지했습니다.
  doctrine_reference: Narrative irony in 2 Maccabees
