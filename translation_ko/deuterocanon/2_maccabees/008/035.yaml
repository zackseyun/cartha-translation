  rationale: 본문은 야훼의 도우심을 말하는 문맥이므로, 한국어에서는 신적 호칭으로 ‘주님’을 택해 경외의 뉘앙스를 유지했습니다.
  doctrine_reference: 'Contested terms: κύριος → 주님'
- issue: 본문의 반어적 진술 보존
  chosen_reading: 오히려 크게 번영한 것입니다
  alternative_readings:
  - 잘된 것입니다
  - 성공한 것입니다
  rationale: 그의 번영이 실제로는 군대의 멸망과 맞물린다는 반어를 평탄화하지 않고, 독자가 역설을 읽어 내도록 유지했습니다.
  doctrine_reference: Narrative irony in 2 Maccabees
