base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/036.yaml
  text: And the one who had undertaken to pay tribute to the Romans from the capture of those in Jerusalem kept proclaiming that the Jews had as their defender one who fought for them[a], and that for this reason the Jews were invulnerable[b], because they followed the laws that had been commanded to them.
  footnotes:
  - marker: a
    text: Or 'from taking captive the people in Jerusalem'; the Greek phrase refers to the expected proceeds from the captivity of Jerusalem's inhabitants.
    reason: lexical_alternative
  - marker: b
    text: The defender is not named explicitly here; the context implies God as the one fighting on behalf of the Jews.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 예루살렘에 있는 사람들을 사로잡아 얻은 것에서 로마인들에게 조공을 바치기로 맡았던 그 사람은, 유대인들에게는 그들을 위해 싸우는 옹호자[a]가 있다고 계속 말하였고, 그래서 유대인들은 이 이유로 해를 입지 않는다고[b] 하였으며, 이는 그들이 자기들에게 명령된 율법을 따르기 때문이라고 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 유대인들을 위해 싸우시는 분을 가리킵니다. 본문은 이름을 직접 밝히지 않지만, 문맥상 하나님을 뜻하는 것으로 이해됩니다.
    reason: theological_note
  - marker: b
    text: 원문은 문자적으로 ‘해를 입지 않는다’에 가깝습니다. ‘무적’의 의미를 자연스럽게 풀어 옮겼습니다.
    reason: korean_style_note
lexical_decisions:
- source_word: ὁ ... ἀναδεξάμενος
  english_pob_choice: the one who had undertaken
  chosen_korean: 맡았던 그 사람
