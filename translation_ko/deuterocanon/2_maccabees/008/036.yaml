    issue: 각주 b의 ‘무적’ 설명
    rationale: ἀτρώτους는 ‘상처를 입지 않는, 해를 입지 않는’이라는 뜻입니다. ‘무적’은 결과적으로 가능한 해석이나 원문의 직접적 의미보다 강하게 들릴 수 있으므로 각주에서 제시하지 않는 편이 안전합니다.
