  rationale: 로마에 바치는 정치적 성격의 지불이므로 일반적 세금보다 위압적·종속적 뉘앙스가 있는 조공이 적절합니다.
- source_word: ὑπέρμαχον ἔχειν
  english_pob_choice: had as their defender one who fought for them
  chosen_korean: 그들을 위해 싸우는 옹호자
  alternatives_korean:
  - 그들을 위해 싸우는 수호자
  - 그들을 위해 싸우는 챔피언
  - 그들을 위해 싸우는 변호자
  lexicon: LSJ
  rationale: ὑπέρμαχος의 핵심은 단순 보호가 아니라 ‘대신 싸우는’ 적극적 편입니다. 한국어에서는 ‘옹호자’에 설명구를 붙여 그 기능을 드러냈습니다.
- source_word: ἀτρώτους
  english_pob_choice: invulnerable
  chosen_korean: 해를 입지 않는
  alternatives_korean:
  - 무적의
  - 상처받지 않는
  - 불가침의
  lexicon: LSJ
  rationale: 군사적 맥락을 살리면서도 한국어에서 자연스럽고 과도하게 과장되지 않는 표현으로 옮겼습니다.
- source_word: προστεταγμένοις νόμοις
  english_pob_choice: the laws that had been commanded to them
  chosen_korean: 자기들에게 명령된 율법
