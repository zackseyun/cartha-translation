review_pass:
  verdict: revise
  source_fidelity: 초안은 니카노르가 예루살렘 주민을 사로잡아 얻을 수익으로 로마에 바칠 조공을 책임졌다는 핵심과, 유대인의 보이지 않는 전투적 보호 및 율법 준수의 인과관계를 대체로 보존합니다. 그러나 ‘사로잡아 얻은 것에서’는 αἰχμαλωσία의 포로로 잡음/포로 상태에서 나올 수익이라는 뜻을 불명료하게 하며, κατορθώσασθαι의 조공을 마련하여 이행한다는 뜻도 충분히 드러나지 않습니다. ‘옹호자’는 법률적 변호의 의미가 강하여 ὑπέρμαχος의 전투적 의미에 맞지 않습니다.
  naturalness: ‘그들을 위해 싸우는 옹호자’와 ‘그래서 유대인들은 이 이유로’는 현대 표준 한국어 성경 문체로 다소 부자연스럽습니다. ‘그들을 위해 싸우시는 수호자’ 및 ‘그 때문에’로 고치면 합쇼체의 격식과 문맥상 자연스러움이 확보됩니다.
  terminology: φόρος는 이 맥락에서 ‘조공’으로 유지할 수 있습니다. ‘율법’도 적절합니다. 다만 ὑπέρμαχος는 ‘옹호자’보다 ‘수호자’가 더 정확하며, ἀτρώτους는 ‘상처를 입지 않는다’로 옮겨 군사적 불상(不傷)의 뉘앙스를 보존합니다. 본문이 수호자의 이름을 말하지 않으므로 하나님을 본문에 직접 삽입하지 않았습니다.
  issues:
  - severity: medium
    issue: ‘예루살렘에 있는 사람들을 사로잡아 얻은 것에서’
    rationale: αἰχμαλωσία는 단순히 ‘얻은 것’이 아니라 예루살렘 주민을 사로잡는 일/그 포로 상태를 가리키며, 여기서는 그것으로 조공을 마련하려는 계획을 나타냅니다.
  - severity: medium
    issue: ‘그들을 위해 싸우는 옹호자’
    rationale: ‘옹호자’는 한국어에서 법정·논변상의 변호자를 우선 연상시킵니다. ὑπέρμαχος는 다른 이를 위하여 싸우는 수호자 또는 전투적 옹호자이므로 ‘수호자’가 자연스럽고 정확합니다.
