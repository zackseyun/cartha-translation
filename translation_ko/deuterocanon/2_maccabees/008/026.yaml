- source_word: διʼ ἣν αἰτίαν
  english_pob_choice: and for that reason
  chosen_korean: 그렇기 때문에
  alternatives_korean:
  - 그래서
  - 그 이유로
  - 그 까닭에
  lexicon: LSJ
  rationale: 앞절의 시간적 제약이 뒤의 결과를 설명하므로, 한국어에서는 인과 관계를 자연스럽게 드러내는 연결이 적절합니다.
