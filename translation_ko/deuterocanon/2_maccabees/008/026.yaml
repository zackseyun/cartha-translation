base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/026.yaml
  text: For it was the day before the Sabbath[a], and for that reason they did not continue pursuing them for long.
  footnotes:
  - marker: a
    text: 'The Greek phrase rendered ''the day before the Sabbath'' is textually and lexically awkward in Swete''s wording (''ἡ πρὸ τοῦ σαββάτου δίκη''). The translation follows the clear contextual sense: the approaching Sabbath limited how long they continued the pursuit.'
    reason: textual_variant
translation:
  language: ko
  text: 그날은 안식일 전날이었으므로,[a] 그들은 그들을 추격하는 일을 오래 계속하지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 스웨테 본문의 ἡ πρὸ τοῦ σαββάτου δίκη는 문법과 어휘 면에서 해석하기 어려운 표현입니다. 이 번역은 문맥상 안식일이 다가와 추격을 오래 계속하지 않았다는 분명한 의미를 따라 ‘안식일 전날’로 옮겼습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἡ πρὸ τοῦ σαββάτου δίκη
  english_pob_choice: the day before the Sabbath
  chosen_korean: 안식일 전날
  alternatives_korean:
  - 안식일 전날의 날
  - 안식일을 앞둔 날
  - 안식일 직전
  lexicon: LSJ
  rationale: 문맥상 시간 표현으로 이해하는 것이 자연스럽고, POB의 영어 결정을 따라 '안식일 전날'로 옮기면 의미와 흐름을 가장 분명하게 살릴 수 있습니다.
- source_word: διʼ ἣν αἰτίαν
  english_pob_choice: and for that reason
  chosen_korean: 그렇기 때문에
  alternatives_korean:
  - 그래서
  - 그 이유로
  - 그 까닭에
  lexicon: LSJ
  rationale: 앞절의 시간적 제약이 뒤의 결과를 설명하므로, 한국어에서는 인과 관계를 자연스럽게 드러내는 연결이 적절합니다.
- source_word: οὐκ ἐμακροτόνησαν
  english_pob_choice: they did not continue ... for long
  chosen_korean: 오래 추격하지 못했습니다
  alternatives_korean:
  - 오랫동안 추격하지 않았습니다
  - 추격을 오래 지속하지 못했습니다
  - 오래 पीछ적하지 못했습니다
  lexicon: LSJ
  rationale: 동사는 행동을 길게 끌지 않았다는 뜻이므로, 이어지는 분사와 합쳐 '오래 추격하지 못했습니다'로 간명하게 표현했습니다.
- source_word: κατατρέχοντες αὐτούς
  english_pob_choice: pursuing them
  chosen_korean: 그들을 추격하여
  alternatives_korean:
  - 그들을 뒤쫓아
  - 그들을 추격하면서
  - 그들을 따라가며
  lexicon: LSJ
  rationale: 군사적 맥락에서 연속적인 पीछ적 행위를 뜻하므로, '추격하여'가 원문의 진행성을 살리면서도 현대 한국어에 자연스럽습니다.
