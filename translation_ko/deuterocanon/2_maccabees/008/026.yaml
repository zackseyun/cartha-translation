  yaml_path: translation/deuterocanon/2_maccabees/008/026.yaml
  text: For it was the day before the Sabbath[a], and for that reason they did not continue pursuing them for long.
  footnotes:
  - marker: a
    text: 'The Greek phrase rendered ''the day before the Sabbath'' is textually and lexically awkward in Swete''s wording (''ἡ πρὸ τοῦ σαββάτου δίκη''). The translation follows the clear contextual sense: the approaching Sabbath limited how long they continued the pursuit.'
    reason: textual_variant
translation:
  language: ko
  text: 그날은 안식일 전날이었기 때문에, 그들은 그들을 오래 추격하지 못했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 표현 ἡ πρὸ τοῦ σαββάτου δίκη는 문자적으로는 다소 어색하지만, 문맥상 ‘안식일 전날’이라는 시간적 의미로 읽는 것이 자연스럽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἡ πρὸ τοῦ σαββάτου δίκη
  english_pob_choice: the day before the Sabbath
  chosen_korean: 안식일 전날
  alternatives_korean:
  - 안식일 전날의 날
