  text: But they were selling all that remained[a], and at the same time were imploring the Lord to rescue those who had been sold by the ungodly Nikanor before he encountered them.
  footnotes:
  - marker: a
    text: Or, more explicitly in context, 'those who had been sold into slavery.' The Greek says simply 'those who had been sold.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 남아 있는 모든 것을 다 팔고 있었습니다. 동시에 그들은 불경한 니카노르에게서 그들에게 붙잡히기 전에 이미 팔린 사람들을 구해 달라고 주님께 간청하고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문은 단순히 ‘팔린 사람들’이라고 말합니다. 문맥상 ‘노예로 팔린 사람들’일 가능성이 있지만, 그 뜻은 그리스어에 직접적으로 명시되어 있지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ περιλελειμμένα πάντα
  english_pob_choice: all that remained
  chosen_korean: 남아 있는 모든 것
  alternatives_korean:
  - 남은 모든 것
  - 남아 있던 모든 물건
  lexicon: LSJ
  rationale: 완료 분사와 πάντα의 포괄성을 살리면서도, 문맥에서 재산·소지품을 너무 구체화하지 않기 위해 ‘남아 있는 모든 것’으로 옮겼습니다.
- source_word: ἐπώλουν
  english_pob_choice: were selling
  chosen_korean: 팔고 있었습니다
  alternatives_korean:
  - 팔았습니다
  - 계속 팔고 있었습니다
  lexicon: LSJ
  rationale: 미완료 시제의 진행성을 살려 단순 과거보다 ‘팔고 있었습니다’가 더 가깝습니다.
- source_word: ὁμοῦ δὲ
  english_pob_choice: and at the same time
  chosen_korean: 동시에
  alternatives_korean:
  - 함께
  - 한편
  lexicon: LSJ
  rationale: 두 행위의 동시성을 간결하게 드러내는 한국어로 ‘동시에’를 택했습니다.
- source_word: τοὺς ... πεπραμένους
  english_pob_choice: those who had been sold
  chosen_korean: 이미 팔린 사람들
  alternatives_korean:
  - 팔려 간 사람들
  - 이미 팔린 이들
  lexicon: LSJ
  rationale: 완료 분사로 나타난 선행 완료와 그 결과 상태를 반영하되, 영어 본문의 주석처럼 ‘노예로’는 본문에 명시되지 않으므로 본문에는 넣지 않았습니다.
- source_word: ὑπὸ τοῦ δυσσεβοῦς Νικάνορος
  english_pob_choice: by the ungodly Nikanor
  chosen_korean: 불경한 니카노르에게서
  alternatives_korean:
  - 경건하지 않은 니카노르에게서
  - 악한 니카노르에게서
  lexicon: LSJ
  rationale: δυσσεβής의 종교적·도덕적 평가를 살려 ‘불경한’으로 옮기고, 행위 주체를 자연스럽게 드러내기 위해 조사 ‘에게서’를 사용했습니다.
- source_word: πρὶν συντυχεῖν
  english_pob_choice: before he encountered them
  chosen_korean: 그들에게 붙잡히기 전에
  alternatives_korean:
  - 그들과 마주치기 전에
  - 그들을 만나기 전에
  lexicon: LSJ
  rationale: 전투/접촉의 문맥을 살리되, 앞선 ‘팔린 사람들’과의 관계를 자연스럽게 연결하기 위해 ‘붙잡히기 전에’로 옮겼습니다.
