  source_fidelity: 핵심 의미는 대체로 전달되지만, τὸν ... φυλάρχην은 ‘디모데와 함께 있던 자들 가운데의 부대를 이끄는 자’처럼 길고 부자연스럽게 옮기기보다 ‘디모데와 함께한 자들의 지휘관’으로 옮기는 것이 소유·소속 관계를 더 정확히 반영합니다. ἀνυπόστατον은 ‘전혀 쓸모없는’보다 ‘몹시 비열한’ 또는 ‘전적으로 무가치한’에 가까운 강한 도덕적 평가를 담을 수 있으므로, 문맥상 ‘몹시 비열한 자’가 적절합니다. ἐπιλελυπηκότα는 완료 분사이므로 앞선 지속적 가해를 나타내는 ‘많은 괴로움을 겪게 한’으로 처리했습니다.
  naturalness: 초안의 ‘가운데의 부대를 이끄는 자’는 현대 한국어에서 어색하고 수식 관계가 불명확합니다. 또한 본문 안에서 과거 서술을 ‘죽였는데 … 끼쳤습니다’로 마무리하는 방식은 문장 호응상 다소 불균질합니다. 한 문장 전체를 합쇼체 과거 종결로 정리했습니다.
  terminology: φυλάρχης는 이 문맥에서 특정 부족의 장이라는 직역보다 군사적 ‘지휘관’이 자연스럽고 안전합니다. ‘디모데와 함께한 자들’은 περὶ Τιμόθεον의 집단 소속을 보존하며, 영어 감사 기록의 ‘among those with Timothy’와도 부합합니다. 신학적 특수 용어는 없습니다.
