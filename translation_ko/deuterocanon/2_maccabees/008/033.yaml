  text: And while they were celebrating the victory in their homeland[a], they burned those who had set fire to the sacred gates, including Kallisthenes, who had fled into a certain house for shelter; and he received the reward worthy of his ungodliness.
  footnotes:
  - marker: a
    text: Or 'who had fled into a dwelling for refuge.' The Greek phrase εἰς ἐνοίκιον is unusual, and the exact nuance of the place is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들이 고향에서 승리의 축제를 벌이는 동안, 그들은 성스러운 문들을 불태운 자들과 카리스테네스를, 그는 피신할 곳으로 어느 집 안으로 도망해 들어갔던 자였는데, 함께 불태웠습니다. 그리고 그는 그의 불경에 합당한 보응을 받았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘피난처로서 어떤 거처로 도망해 들어갔던’이라는 뜻일 수 있습니다. 그리스어 εἰς ἐνοίκιον은 이곳에서 드문 표현이며, 정확한 장소의 뉘앙스는 분명하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπινίκια δὲ ἄγοντες
  english_pob_choice: while they were celebrating the victory
  chosen_korean: 승리의 축제를 벌이는 동안
  alternatives_korean:
  - 승리를 기념하는 동안
  - 승리 축제를 거행하는 동안
  lexicon: LSJ
  rationale: ἐπινίκια ἄγειν은 전승 후 승리를 기념하는 축제를 뜻하므로, 한국어에서는 자연스러운 ‘승리의 축제를 벌이다’로 옮겨 축제적 뉘앙스를 살렸습니다.
- source_word: ἐν τῇ πατρίδι
  english_pob_choice: in their homeland
  chosen_korean: 고향에서
  alternatives_korean:
  - 조국에서
  - 본토에서
  lexicon: LSJ
  rationale: πατρίς는 단순한 나라보다 ‘태어난 땅/고향’의 뜻이 강하므로, 공동 주어의 맥락에서 ‘고향에서’가 가장 간결하고 자연스럽습니다.
- source_word: τοὺς ἐμπρήσαντας τοὺς ἱεροὺς πυλῶνας
  english_pob_choice: those who had set fire to the sacred gates
  chosen_korean: 성스러운 문들을 불태운 자들
  alternatives_korean:
  - 거룩한 문들을 태운 자들
  - 성전 문들을 불태운 자들
  lexicon: LSJ
  rationale: ἱερούς는 ‘신성한/성스러운’의 종교적 힘을 가지므로 ‘성스러운’으로 옮겼고, πυλῶνας는 특정 건축물을 과도하게 규정하지 않도록 ‘문들’로 두었습니다.
- source_word: εἰς ἐνοίκιον πεφευγότα
  english_pob_choice: who had fled into a certain house for shelter
  chosen_korean: 피신할 곳으로 어느 집 안으로 도망해 들어갔던 자였는데
  alternatives_korean:
  - 피난처로 어느 거처 안으로 도망한 자였는데
  - 은신하려고 어느 집으로 달아난 자였는데
  lexicon: LSJ
  rationale: ἐνοίκιον은 이곳에서 드문 표현이라 정확한 장소 유형이 불확실하므로, POB의 불확실성 표시를 살려 ‘어느 집 안으로’와 ‘피신할 곳으로’를 함께 써 피난의 의미를 보존했습니다.
- source_word: τὸν ἄξιον τῆς δυσσεβείας μισθόν
  english_pob_choice: the reward worthy of his ungodliness
  chosen_korean: 그의 불경에 합당한 보응
  alternatives_korean:
  - 그의 불경에 걸맞은 대가
  - 그의 경건치 않음에 마땅한 보상
  lexicon: LSJ
  rationale: μισθός는 여기서 중립적 ‘보상’보다 심판적 의미의 ‘보응/대가’가 더 적절하며, δυσσέβεια는 단순 도덕악보다 종교적 불경을 가리키므로 ‘불경’으로 옮겼습니다.
