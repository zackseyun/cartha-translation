  - marker: b
    text: Or 'when he had informed those with him of the army’s presence.' The Greek phrase τὴν παρουσίαν τοῦ στρατοπέδου is somewhat compressed and may refer either to the army camp being present nearby or to the army’s arrival.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 니카노르의 진격 소식이 유다에게 전해졌습니다. 그리고 그가 자기와 함께 있던 사람들에게 군대의 출현을 알렸을 때,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘니카노르의 공격에 관한 소식이 유다에게 전해졌습니다.’ 여기서 ἐφόδος는 ‘공격’, ‘습격’, ‘진격’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그가 자기와 함께 있던 사람들에게 군대의 도착을 알렸을 때.’ τὴν παρουσίαν τοῦ στρατοπέδου는 압축된 표현으로, 군대가 가까이 이르렀다는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ δὲ Ἰούδᾳ προσέπεσεν
  english_pob_choice: news ... came to Judas
  chosen_korean: 소식이 유다에게 전해졌습니다
  alternatives_korean:
