  - 니카노르의 습격
  lexicon: LSJ
  rationale: ἐφόδος는 공격·습격·진격을 가질 수 있는데, 앞선 문맥에서 전투 개시보다 접근/진군의 뉘앙스가 살아 있어 ‘진격’으로 옮겼습니다.
- source_word: μεταδόντος τοῖς σὺν αὐτῷ
  english_pob_choice: when he had shared with those with him
  chosen_korean: 그가 자기와 함께 있던 사람들에게 ... 알렸을 때
  alternatives_korean:
  - 그가 자기와 함께 있던 이들에게 ... 전했을 때
  - 그가 동행한 이들에게 ... 알려 주었을 때
  lexicon: LSJ
  rationale: μεταδίδωμι는 ‘나누어 주다/전하다’의 뜻이 있어, 한국어에서는 정보 전달의 자연스러운 표현인 ‘알리다’로 풀었습니다.
- source_word: τὴν παρουσίαν τοῦ στρατοπέδου
  english_pob_choice: the presence of the army camp
  chosen_korean: 군대의 출현
  alternatives_korean:
  - 군대의 도착
  - 군영의 উপস্থিত
  lexicon: LSJ
  rationale: παρουσία는 ‘현존/도착/출현’ 범위를 가지며, στρατόπεδον은 ‘진영/군대’로도 읽힙니다. 본문이 압축적이어서, 주변에 적군이 나타났다는 의미를 드러내는 ‘출현’으로 처리했습니다.
