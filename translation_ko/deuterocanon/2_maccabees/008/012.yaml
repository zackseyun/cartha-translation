  - 유다에게 소식이 닿았습니다
  lexicon: LSJ
  rationale: προσπίπτω + περί의 관용적 용법을 정보의 도달로 이해하여, 한국어에서는 자연스럽게 ‘전해지다’로 옮겼습니다.
- source_word: περὶ τῆς τοῦ Νικάνορος ἐφόδου
  english_pob_choice: Nicanor’s advance
  chosen_korean: 니카노르의 진격
  alternatives_korean:
