  text: And he also recounted to them the help that had come to their forefathers[a], and the one against Sennacherib[b], how a hundred eighty-five thousand were destroyed.
  footnotes:
  - marker: a
    text: An allusion to the destruction of Sennacherib's army in the days of Hezekiah; see 2 Kings 19:35 and Isaiah 37:36.
    reason: cross_reference
  - marker: b
    text: Or 'deliverances' for 'help'; the Greek term can denote acts of aid or rescue.
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 그는 그들에게 그들의 조상들에게 있었던 도움들과 세나케리브를 상대로 한 도움[a], 곧 십팔만 오천 명이 어떻게 멸망했는지를 들려주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히스기야 시대에 세나케리브의 군대 십팔만 오천 명이 멸망한 일을 가리키는 암시입니다. 열왕기하 19:35; 이사야 37:36을 보십시오.
    reason: cross_reference
lexical_decisions:
- source_word: προσαναλεξάμενος
  english_pob_choice: recounted
  chosen_korean: 들려주었습니다
  alternatives_korean:
  - 이야기해 주었습니다
  - 상기시켰습니다
  - 되짚어 말했습니다
  lexicon: LSJ
  rationale: 회상한 내용을 청중에게 말로 풀어 전하는 동사를 택해, 단순한 ‘기억’보다 서술 행위가 드러나도록 했습니다.
- source_word: ἀντιλήμψεις
  english_pob_choice: help
  chosen_korean: 도움들
  alternatives_korean:
  - 구원들
  - 원조들
  - 도움
  lexicon: LSJ
  rationale: 복수형을 살려 조상들에게 여러 차례 주어진 구원의 도움들을 가리키게 했습니다. 영어 POB의 ‘help’보다 한국어에서는 복수성을 드러내기 위해 ‘도움들’이 적절합니다.
- source_word: ἐπὶ τῶν προγόνων γενομένας
  english_pob_choice: that had come to their forefathers
  chosen_korean: 그들의 조상들에게 있었던
  alternatives_korean:
  - 그들의 조상들에게 임했던
  - 그들의 조상들에게 일어난
  - 그들의 조상들에게 주어진
  lexicon: LSJ
  rationale: 문맥상 조상 대에 경험된 하나님의 개입을 뜻하므로, 과도한 해석을 덜어내고 사건의 귀속만 자연스럽게 옮겼습니다.
- source_word: τὴν ἐπὶ Σεναχηρεὶμ
  english_pob_choice: the one against Sennacherib
  chosen_korean: 세나케리브에게 있었던 일
  alternatives_korean:
  - 세나케리브에 대한 일
  - 세나케리브 때의 일
  - 세나케리브와 관련된 일
  lexicon: LSJ
  rationale: 그리스어의 생략된 대상을 한국어에서 보완하되, 본문이 직접 ‘도움’을 다시 반복하지 않는 점을 반영해 역사적 사건 자체를 가리키는 방식으로 처리했습니다.
- source_word: ὡς ἀπώλοντο
  english_pob_choice: how ... were destroyed
  chosen_korean: 어떻게 죽었는지도
  alternatives_korean:
  - 어떻게 멸망했는지도
  - 어떻게 파멸되었는지도
  - 어떻게 전멸했는지도
  lexicon: LSJ
  rationale: 군대의 대규모 몰살을 한국어로 자연스럽게 드러내면서도, 원문의 ‘죽었다/멸망했다’의 사실 진술을 유지했습니다.
theological_decisions:
- issue: 열왕기하 19:35 / 이사야 37:36을 가리키는 암시를 본문에 얼마나 드러낼지
  chosen_reading: 본문은 세나케리브 사건을 직접 언급하되, ‘하나님이’라는 말을 덧붙이지 않고 암시를 유지했습니다.
  alternative_readings:
  - 그 조상들에게 하나님이 주신 도움
  - 세나케리브 군대를 하나님이 멸하신 일
  rationale: 헬라어 본문은 이 절에서 하나님의 이름을 직접 말하지 않으므로, 본문은 암시를 보존하고 각주로 역사적·성경적 연결을 안내하는 편이 원문 우선 원칙에 맞습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; Original-language primacy over translation tradition.'
