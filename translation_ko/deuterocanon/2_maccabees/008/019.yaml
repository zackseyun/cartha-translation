  text: And he also recounted to them the help that had come to their forefathers[a], and the one against Sennacherib[b], how a hundred eighty-five thousand were destroyed.
  footnotes:
  - marker: a
    text: An allusion to the destruction of Sennacherib's army in the days of Hezekiah; see 2 Kings 19:35 and Isaiah 37:36.
    reason: cross_reference
  - marker: b
    text: Or 'deliverances' for 'help'; the Greek term can denote acts of aid or rescue.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 그들에게 그들의 조상들에게 있었던 도움들[a]과 세나케리브에게 있었던 일, 곧 십팔만오천 명이 어떻게 죽었는지도 들려주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히스기야 시대에 세나케리브의 군대가 멸망한 일을 가리키는 암시입니다. 열왕기하 19:35; 이사야 37:36을 보십시오.
    reason: cross_reference
lexical_decisions:
- source_word: προσαναλεξάμενος
