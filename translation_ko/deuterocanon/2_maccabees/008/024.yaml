  text: But with the Almighty as their ally, they slaughtered more than nine thousand of the enemy, and they wounded and maimed most of Nicanor’s army, and forced them all to flee.
translation:
  language: ko
  text: 전능하신 분께서 그들의 편이 되어 함께 싸우시자, 그들은 적군 가운데 아홉 천 명이 넘는 자들을 도륙하고, 니카노르의 군대 대부분에게 부상을 입히고 팔다리를 못 쓰게 하였으며, 그들을 모두 달아나게 하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ παντοκράτορος
  english_pob_choice: the Almighty
  chosen_korean: 전능하신 분
  alternatives_korean:
  - 전능자
  - 만물을 다스리시는 분
  lexicon: LSJ
  rationale: παντοκράτωρ는 단순한 능력 묘사보다 하나님의 절대적 주권과 힘을 나타내는 칭호이므로, 한국어에서는 인칭적 존칭을 살린 ‘전능하신 분’이 자연스럽고 경건합니다.
- source_word: συμμάχου
  english_pob_choice: ally
  chosen_korean: 동맹이 되시자
  alternatives_korean:
  - 동맹자
  - 아군이 되시자
  - 협력자가 되시자
  lexicon: LSJ
  rationale: 군사적 맥락에서 συμμάχος는 단순한 도움보다 ‘함께 싸우는 편’의 뜻이 강하므로, 관계 동사를 써서 ‘동맹이 되시자’로 옮겼습니다.
- source_word: κατέσφαξαν
  english_pob_choice: they slaughtered
  chosen_korean: 죽였고
  alternatives_korean:
  - 도륙하였고
  - 살육하였고
  - 무찔렀고
  lexicon: LSJ
  rationale: 한국어 ‘도륙하다’도 가능하지만 지나치게 과격한 뉘앙스가 있어, 본문이 강조하는 대량 살상을 유지하되 문장 전체의 읽기 흐름을 위해 ‘죽였고’로 옮겼습니다.
- source_word: τοῖς μέλεσιν ἀπηρεῖς
  english_pob_choice: maimed
  chosen_korean: 팔다리를 못 쓰게 된 자들
  alternatives_korean:
  - 사지가 불구가 된 자들
  - 팔다리가 상한 자들
  - 불구가 된 자들
  lexicon: LSJ
  rationale: μέλη는 몸의 지체를 가리키므로, ‘팔다리를 못 쓰게 된 자들’이 실제 신체 훼손과 기능 상실을 함께 드러냅니다.
- source_word: τὸ πλεῖον μέρος τῆς τοῦ Νικάνορος στρατειᾶς
  english_pob_choice: most of Nicanor’s army
  chosen_korean: 니카노르의 군대의 대부분
  alternatives_korean:
  - 니카노르의 군대의 큰 부분
  - 니카노르의 원정대의 대부분
  - 니카노르의 군대의 대다수
  lexicon: LSJ
  rationale: στρατεία는 여기서 군사 원정대/군대의 집합을 가리키며, 영어 POB처럼 간명하게 ‘군대의 대부분’으로 옮기되 소유 관계를 분명히 했습니다.
- source_word: πάντας δὲ φεύγειν ἠνάγκασαν
  english_pob_choice: and forced them all to flee
  chosen_korean: 그들 모두가 도망치게 하였습니다
  alternatives_korean:
  - 그들 모두를 도망치게 하였습니다
  - 그들 모두가 달아나도록 강요하였습니다
  - 그들 모두를 도주하게 하였습니다
  lexicon: LSJ
  rationale: ἠνάγκασαν의 강제성을 살리면서도 한국어에서 자연스러운 결과 표현인 ‘도망치게 하였습니다’로 정리했습니다.
