  rationale: 본문의 παντοκράτωρ는 군사적 승리의 배후에 계신 하나님의 주권을 강조하므로, 한국어에서도 칭호의 위엄과 인격적 뉘앙스를 함께 살리는 번역이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: divine titles; source-directed reverent rendering'
