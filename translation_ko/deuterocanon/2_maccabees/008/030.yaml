base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/030.yaml
  text: And after crushing the forces around Timothy and Bacchides[a], they killed more than twenty thousand of them, gained firm control of very high strongholds, and divided the plentiful plunder, making themselves equal sharers with the oppressed and orphans and widows, and even with the elderly.
  footnotes:
  - marker: a
    text: Or, 'giving equal shares to the oppressed, the orphans, the widows, and even the elderly.' The Greek pronoun can be taken differently, though the main text understands the soldiers as making themselves equal sharers with these vulnerable groups.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 티모테오와 바키데스의 군대를 무너뜨린 뒤, 그들 가운데서 이만 명이 넘는 사람을 죽이고, 매우 높은 요새들을 확고히 장악했으며, 풍성한 전리품을 나누어 가졌습니다. 또한 억압받는 사람들과 고아들과 과부들과, 더 나아가 노인들과도 동등한 몫을 받도록 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “억압받는 사람들과 고아들과 과부들과, 더 나아가 노인들에게 동등한 몫을 주었다.” 그리스어 대명사는 다르게 연결될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: συνερείσαντες
  english_pob_choice: after crushing the forces around
  chosen_korean: 군대를 무너뜨린 뒤
  alternatives_korean:
  - 군대를 꺾은 뒤
  - 무리를 짓밟은 뒤
  lexicon: LSJ
  rationale: 전투 서술에서의 강한 제압 의미를 살리되, 한국어에서는 과도한 직역보다 자연스러운 ‘무너뜨리다’가 적절합니다.
- source_word: τοὺς περὶ Τιμόθεον καὶ Βακχίδην
  english_pob_choice: the forces around Timothy and Bacchides
  chosen_korean: 티모테오와 바키데스의 군대
  alternatives_korean:
  - 티모테오와 바키데스 주변의 군대
  - 티모테오와 바키데스와 함께한 군세
  lexicon: LSJ
  rationale: περί + 인명은 그 인물에 속한 무리, 곧 군세를 가리키므로 소속 관계를 드러내는 표현으로 옮겼습니다.
- source_word: ἰσομοίρους αὐτοὺς ... ποιήσαντες
  english_pob_choice: making themselves equal sharers with
  chosen_korean: 동등한 몫을 받도록 했습니다
  alternatives_korean:
  - 자신들이 동등한 몫을 나누도록 했습니다
  - 그들 자신을 동등한 몫의 참여자로 삼았습니다
  lexicon: LSJ
  rationale: 여기서는 αὐτούς의 지시를 둘러싼 해석 차이를 한국어에서 과도하게 노출하지 않으면서, 본문이 말하는 ‘동등한 몫’의 의미를 자연스럽게 전달했습니다.
- source_word: τοῖς ἠκισμένοις
  english_pob_choice: the oppressed
  chosen_korean: 억압받는 사람들
  alternatives_korean:
  - 압박받는 사람들
  - 학대받는 사람들
  lexicon: LSJ
  rationale: 고아, 과부와 병렬되는 사회적 약자 범주로서 ‘억압받는 사람들’이 가장 균형 있게 맞습니다.
- source_word: πρεσβυτέροις
  english_pob_choice: the elderly
  chosen_korean: 노인들
  alternatives_korean:
  - 연장자들
  - 나이 많은 사람들
  lexicon: BDAG
  rationale: 여기서는 직분이 아니라 취약한 연령층을 뜻하므로 교회 직분인 ‘장로’로 읽지 않고 ‘노인들’로 옮겼습니다.
theological_decisions:
- issue: ἀυτούς의 지시 대상과 ‘동등한 몫’의 주체
  chosen_reading: 본문의 의미를 따라 그들은 약자들과 동등한 몫을 나누어 가졌습니다.
  alternative_readings:
  - 그들이 약자들에게 동등한 몫을 나누어 주었습니다.
  rationale: 그리스어 대명사의 연결은 다소 여지가 있으나, 본문이 강조하는 것은 전리품을 사적으로 챙기지 않고 취약한 이들과 동등하게 나눈 행위이므로 그 긴장을 유지하되 한국어에서는 매끄럽게 처리했습니다.
  doctrine_reference: 해석의 여지를 주되, 공동체적 공정성과 분배의 강조를 보존합니다.
