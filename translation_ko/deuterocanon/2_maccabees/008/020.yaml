  to: 그리고 바빌론에서 갈라티아인들[a]과 벌어진 전투는 이러했습니다. 지원하러 온 이들은 모두 팔천 명이었고, 마케도니아 사람 사천 명도 함께 있었습니다. 마케도니아 사람들이 곤경에 처했을 때, 그 육천 명은 하늘로부터 그들에게 오는 도움으로 십이만 명을 멸망시키고 큰 이익을 얻었습니다.
