base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/020.yaml
  text: 'And the engagement in Babylonia against the Galatians had gone this way: when all who came to the need were eight thousand[a], together with four thousand Macedonians, and the Macedonians were at a loss, the six thousand destroyed the one hundred twenty thousand because of the help coming to them from heaven, and they received great advantage.'
  footnotes:
  - marker: a
    text: Or 'Gauls.' The Greek ethnic term can be rendered either way depending on whether the emphasis is on the Anatolian Galatians or their broader Celtic identity.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 바빌론에서 갈라티아인들[a]과 맞붙었던 전투는 이러했습니다. 도움을 받으러 온 이들은 모두 팔천 명이었고, 그와 함께 마케도니아 사람 사천 명이 있었으며, 마케도니아 사람들이 궁지에 몰렸을 때, 육천 명이 하늘로부터 그들에게 주어진 도움 때문에 십이만 명을 무찔렀고, 그들은 큰 유익을 얻었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘갈리아인들’. 그리스어 민족명사는 역사적 범위를 넓게 볼 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: παράταξιν
  english_pob_choice: engagement
  chosen_korean: 전투
  alternatives_korean:
  - 교전
  - 전투 대형
  - 전쟁
  lexicon: LSJ
  rationale: 군사적 대치 상황을 가리키므로 자연스러운 한국어로는 ‘전투’가 가장 직접적이고, 문맥의 결과 서술과도 잘 맞습니다.
- source_word: Γαλάτας
  english_pob_choice: Galatians
  chosen_korean: 갈라티아인들
  alternatives_korean:
  - 갈리아인들
  - 가울족
  lexicon: LSJ
  rationale: 그리스어 эт닉명사를 음역해 직역성을 살렸고, 본문 각주에서 더 넓은 역사적 집단 가능성을 열어 두었습니다.
- source_word: ἐπὶ τὴν χρείαν ἦλθον
  english_pob_choice: came to the need
  chosen_korean: 도움을 받으러 온
  alternatives_korean:
  - 위기 때문에 왔다
  - 필요에 따라 왔다
  - 구원하러 왔다
  lexicon: LSJ
  rationale: 직역적 뉘앙스는 살리되 한국어로는 ‘도움을 받으러 온’이 상황상 자연스럽고, 원문의 ‘필요/긴급 상황’ 의미를 무리 없이 전달합니다.
- source_word: ἀπορουμένων
  english_pob_choice: were at a loss
  chosen_korean: 궁지에 몰렸을 때
  alternatives_korean:
  - 어찌할 바를 몰랐을 때
  - 난처했을 때
  - 막막했을 때
  lexicon: LSJ
  rationale: 무력함과 압박 상태를 함께 드러내는 표현으로, 전투 맥락에서는 ‘궁지에 몰리다’가 가장 적절합니다.
- source_word: ἀπʼ οὐρανοῦ βοήθειαν
  english_pob_choice: help coming to them from heaven
  chosen_korean: 하늘로부터 그들에게 주어진 도움
  alternatives_korean:
  - 하늘에서 온 도움
  - 하늘의 도움
  - 하늘로부터 오는 도움
  lexicon: LSJ
  rationale: ‘하늘’은 신적 개입을 가리키는 완곡 표현이므로, 이를 유지하면서 수동적 의미를 살린 한국어로 옮겼습니다.
theological_decisions:
- issue: ‘하늘로부터’의 신학적 기능
  chosen_reading: 하나님을 직접 지칭하지 않지만, 하늘을 통해 주어진 신적 도움을 가리키는 완곡 표현으로 유지했습니다.
  alternative_readings:
  - 일반적인 행운이나 우연의 승리로 약화해 읽을 수 있음
  rationale: 유대계 그리스어에서 ‘하늘’은 종종 하나님의 개입을 공손하게 돌려 말하는 표현이므로, 그 종교적 어조를 보존하는 것이 본문에 더 충실합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
