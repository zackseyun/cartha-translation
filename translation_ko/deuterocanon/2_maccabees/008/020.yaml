  source_fidelity: ‘도움을 받으러 온’은 ἐπὶ τὴν χρείαν ἦλθον의 방향을 뒤집습니다. 이들은 도움을 받기 위해 온 사람들이 아니라 필요가 생긴 곳에 지원하러 온 사람들입니다. 또한 γινομένην은 하늘로부터 그들에게 ‘오는’ 도움을 말하며, 마지막 주어는 마케도니아 사람들이 아니라 앞서 언급된 육천 명입니다.
  naturalness: 전체 문장은 합쇼체로 자연스럽지만, ‘도움을 받으러 온’과 마지막의 ‘그들은’은 각각 의미 및 지시 대상의 혼동을 낳습니다. 이를 명시적으로 바로잡으면 현대 표준 한국어의 격식 있는 성경 문체로 더 자연스럽습니다.
  terminology: ‘전투’, ‘바빌론’, ‘갈라티아인들’, ‘마케도니아 사람’, ‘하늘로부터’는 적절합니다. Γαλάτας의 역사적 지시 대상이 논쟁될 수 있으므로 ‘갈리아인들’ 대안을 각주에 유지하되 그 범위를 더 정확히 밝혔습니다.
