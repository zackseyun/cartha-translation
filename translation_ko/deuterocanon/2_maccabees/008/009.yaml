    issue: ‘적지 않은 이만 명’
    rationale: οὐκ ἐλάττους τῶν δισμυρίων은 ‘이만 명보다 적지 않은’, 곧 ‘이만 명 이상’이라는 뜻입니다. 현 표현은 ‘적지 않은 수의 이만 명’처럼 어색할 뿐 아니라 수량의 하한을 명료하게 전달하지 못합니다.
