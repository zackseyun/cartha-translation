base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/009.yaml
  text: But he quickly selected Nicanor son of Patroclus[a], one of his chief Friends, and sent him, having assigned to him no fewer than twenty thousand from the nations of every tribe to wipe out the whole Jewish people. They also appointed with him Gorgias, a military man experienced in matters of war[c][b],
  footnotes:
  - marker: a
    text: Or 'one of the first Friends,' likely a court title for a high-ranking royal associate rather than merely a personal friend.
    reason: lexical_alternative
  - marker: b
    text: The Greek phrase rendered 'from the nations of every tribe' is unusual and may mean ethnically mixed forces or peoples of every sort.
    reason: lexical_alternative
  - marker: c
    text: Or 'to root out the whole nation of Judea.'
    reason: alternative_reading
translation:
  language: ko
  text: 그는 곧 파트로클로스의 아들 니카노르[a]를, 자기의 으뜸가는 벗들 가운데 한 사람으로 선택하여 보냈으며, 그에게 여러 민족 가운데서 나온 이들 가운데도 적지 않은 이만 명을 맡겨 유대 민족 전체를 멸절하게 하였습니다. 또 그와 함께 전쟁 일에 경험이 있는 군인 고르기아스[c][b]도 배치하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 첫째 벗들 가운데 한 사람’입니다. 이는 단순한 개인적 친구라기보다 궁정의 고위 동료를 가리키는 칭호일 가능성이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 표현은 ‘모든 종류의 민족들 가운데서 나온 이들’이라는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘유대 온 나라를 뿌리뽑게’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: προχειρισάμενος
  english_pob_choice: selected
  chosen_korean: 선택하여
  alternatives_korean:
  - 임명하여
  - 골라
  lexicon: LSJ
  rationale: 급히 사람을 골라 임무에 보내는 뜻이므로, 현대 한국어에서 자연스러운 ‘선택하여’가 의도와 문맥을 잘 살립니다.
- source_word: τῶν πρώτων φίλων
  english_pob_choice: one of his chief Friends
  chosen_korean: 자기의 으뜸가는 벗들 가운데 한 사람
  alternatives_korean:
  - 그의 첫째 벗들 가운데 한 사람
  - 그의 주요 벗들 가운데 한 사람
  lexicon: LSJ
  rationale: 궁정 용어일 수 있는 φίλους의 뉘앙스를 살리되, ‘벗들’보다 다소 격식 있는 ‘으뜸가는 벗들’로 표현해 단순한 개인적 친분 이상임을 드러냈습니다.
- source_word: ὑποτάξας
  english_pob_choice: assigning to him
  chosen_korean: 그에게 … 맡겨
  alternatives_korean:
  - 그에게 … 배정하여
  - 그에게 … 복속시켜
  lexicon: LSJ
  rationale: 군사적 지휘 아래 두는 의미이므로, 현대 독자에게 자연스러운 ‘맡겨’가 명령·위임의 관계를 전달합니다.
- source_word: παμφύλων ἔθνη
  english_pob_choice: from the nations of every tribe
  chosen_korean: 여러 민족 가운데서 나온 이들
  alternatives_korean:
  - 모든 종족의 민족들
  - 각종 민족들
  lexicon: LSJ
  rationale: 어색한 직역보다 ‘여러 민족 가운데서 나온 이들’로 옮겨, 혼합된 출신의 군대를 가리키는 폭넓은 의미를 보존했습니다.
- source_word: τὸ πᾶν τῆς Ἰουδαίας ἐξᾶραι γένος
  english_pob_choice: to wipe out the whole Jewish people
  chosen_korean: 유대 민족 전체를 멸절하게
  alternatives_korean:
  - 유대 온 백성을 뿌리뽑게
  - 유대 전체를 없애게
  lexicon: LSJ
  rationale: γένος는 단순한 혈통보다 집단 전체를 가리키므로 ‘민족 전체’가 가장 무난하며, ἐξᾶραι의 강한 제거·말살 의미는 ‘멸절하다’로 살렸습니다.
- source_word: ἄνδρα στρατηγόν
  english_pob_choice: a military man
  chosen_korean: 전쟁 일에 경험이 있는 군인
  alternatives_korean:
  - 군사적 일에 능한 장군
  - 군사 경험이 많은 사람
  lexicon: LSJ
  rationale: στρατηγός를 직함인 ‘장군’으로 고정하기보다, 문맥상 군사 전문가임을 보여 주는 ‘군인’으로 넓게 옮겼습니다.
theological_decisions:
- issue: γένος의 집단 정체성 표현
  chosen_reading: 유대 민족
  alternative_readings:
