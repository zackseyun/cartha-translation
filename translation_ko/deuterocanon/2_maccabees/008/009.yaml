  naturalness: ‘여러 민족 가운데서 나온 이들 가운데도 적지 않은 이만 명’은 중복되고 수량 표현도 부자연스럽습니다. ‘여러 민족 출신의 병력 이만 명 이상을 그의 지휘 아래 두어’로 고치면 현대 표준 한국어 합쇼체로 자연스럽고 원문의 군사적 위임 관계도 드러납니다.
