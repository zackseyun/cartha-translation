  lexicon: LSJ
  rationale: 궁정 용어일 수 있는 φίλους의 뉘앙스를 살리되, ‘벗들’보다 다소 격식 있는 ‘으뜸가는 벗들’로 표현해 단순한 개인적 친분 이상임을 드러냈습니다.
- source_word: ὑποτάξας
  english_pob_choice: assigning to him
  chosen_korean: 그에게 … 맡겨
  alternatives_korean:
