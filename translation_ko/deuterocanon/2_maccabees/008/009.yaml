- from: 그는 곧 파트로클로스의 아들 니카노르[a]를, 자기의 으뜸가는 벗들 가운데 한 사람으로 선택하여 보냈으며, 그에게 여러 민족 가운데서 나온 이들 가운데도 적지 않은 이만 명을 맡겨 유대 민족 전체를 멸절하게 하였습니다. 또 그와 함께 전쟁 일에 경험이 있는 군인 고르기아스[c][b]도 배치하였습니다.
