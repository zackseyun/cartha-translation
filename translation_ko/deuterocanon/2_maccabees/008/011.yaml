base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/011.yaml
  text: So he immediately sent to the cities along the coast[a], inviting them to buy Jewish bodies, promising to hand over ninety bodies for a talent[b]; but he did not expect the punishment from the Almighty that was about to come upon him.
  footnotes:
  - marker: a
    text: Greek 'bodies' here refers to Jews treated as saleable captives; some translations smooth this to 'persons' or make the implication explicit as 'slaves.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the justice from the Almighty that was about to overtake him.' The Greek word can denote either justice in action or the resulting punishment.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 곧바로 해변의 도시들에 사람을 보내어, 유대인들의 몸을 사들일 것을 알리고[a], 한 달란트에 몸 아흔을 넘겨주겠다고 약속하였습니다[b]. 그러나 그는 전능자에게서 자기에게 곧 닥칠 심판을 예상하지 못하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ‘몸들’은 유대인들이 매매 가능한 포로로 취급되었음을 가리킵니다. 일부 번역은 이를 ‘사람들’로 완화하거나 ‘노예들’로 분명히 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘전능자에게서 자기에게 닥칠 정의를’로 옮길 수 있습니다. 그리스어 δίκη는 이곳에서 ‘의’ 또는 그 결과로서의 ‘보응/심판’을 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τὰς παραθαλασσίους πόλεις
  english_pob_choice: the cities along the coast
  chosen_korean: 해변의 도시들
  alternatives_korean:
  - 해안의 도시들
  - 바닷가의 도시들
  lexicon: LSJ
  rationale: παραθαλάσσιος는 ‘바닷가의, 해변의’라는 뜻으로, 한국어에서는 ‘해변의’가 자연스럽고 원문의 지리적 범위를 무리 없이 살립니다.
- source_word: ἐπʼ ἀγορασμὸν Ἰουδαίων σωμάτων
  english_pob_choice: to buy Jewish bodies
  chosen_korean: 유대인들의 몸을 사들일 것을
  alternatives_korean:
  - 유대인들을 사들일 것을
  - 유대인들의 몸을 구매할 것을
  lexicon: LSJ
  rationale: Ἰουδαίων σωμάτων의 직역인 ‘몸’은 사람을 상품처럼 취급하는 충격을 보존합니다. ‘사람들’로 풀면 그 비인간화가 약해집니다.
- source_word: ὑπισχνούμενος ἐνενήκοντα σώματα ταλάντου παραχωρήσειν
  english_pob_choice: promising to hand over ninety bodies for a talent
  chosen_korean: 한 달란트에 몸 아흔을 넘겨주겠다고 약속하였습니다
  alternatives_korean:
  - 한 달란트당 아흔의 몸을 넘겨주겠다고 약속하였습니다
  - 한 달란트에 유대인 아흔을 넘겨주겠다고 약속하였습니다
  lexicon: LSJ
  rationale: 압축된 상업적 표현을 한국어로 풀어, ‘한 달란트에’라는 거래 단위를 살리면서도 ‘몸 아흔’의 수량 관계를 드러냈습니다.
- source_word: τὴν ... μέλλουσαν παρακολουθήσειν αὐτῷ δίκην
  english_pob_choice: the punishment ... that was about to come upon him
  chosen_korean: 자기에게 곧 닥칠 심판
  alternatives_korean:
  - 자기에게 곧 닥칠 벌
  - 자기에게 따라올 정의
  lexicon: LSJ
  rationale: δίκη는 이 문맥에서 단순한 법적 ‘의’보다 다가오는 보응/형벌의 뜻이 강하므로 ‘심판’이 자연스럽고 문맥에 맞습니다.
- source_word: τοῦ παντοκράτορος
  english_pob_choice: the Almighty
  chosen_korean: 전능자
  alternatives_korean:
  - 전능하신 분
  - 전능하신 이
  lexicon: LSJ
  rationale: παντοκράτωρ의 관용적 신칭을 한국어에서도 간결하게 살려, 하나님의 절대적 주권을 드러내는 ‘전능자’를 택했습니다.
theological_decisions:
- issue: δίκη의 의미 범위
  chosen_reading: ‘심판’으로 옮겨, 임박한 신적 보응을 드러냈습니다.
  alternative_readings:
  - ‘의’로 옮겨 ‘하나님의 의’의 뉘앙스를 남길 수 있습니다.
  - ‘벌’로 더 직접적 형벌 의미를 살릴 수 있습니다.
  rationale: 이 구절은 하나님께서 악행에 대해 곧 실행하실 보응을 말하므로, ‘심판’이 문맥의 신학적 무게를 가장 분명하게 전달합니다.
  doctrine_reference: 신적 보응과 심판에 관한 일반적 성서적 용례
- issue: σώματα의 번역
  chosen_reading: ‘몸’으로 직역해 인간을 매매 대상으로 삼는 폭력을 드러냈습니다.
  alternative_readings:
  - ‘사람’으로 완화할 수 있습니다.
  - ‘노예’로 명시할 수 있습니다.
  rationale: 원문은 사람을 ‘몸’으로 물화하는 표현을 의도적으로 사용하므로, 이를 약화시키지 않는 것이 본문 수용에 중요합니다.
  doctrine_reference: 본문의 수사와 인간 존엄에 관한 번역 원칙
