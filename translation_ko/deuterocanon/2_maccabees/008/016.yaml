translation:
  language: ko
  text: 그런데 마카베오는 그와 함께 있던 사람들, 곧 약 6천 명을 모은 뒤, 그들에게 적[a]을 두려워하지 말고, 부당하게 그들을 치러 온 민족들의 수많은 무리도 두려워하지 말며, 용감하게 싸우라고 권했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 δεσμίοις는 문자적으로 ‘포로들’ 또는 ‘갇힌 자들’이라는 뜻입니다. 이 표현은 문맥상 난해하지만, 이어지는 적대 민족들의 무리에 대한 언급 때문에 본문에서는 문맥에 따라 ‘적’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Συναγαγὼν δὲ
  english_pob_choice: after gathering
  chosen_korean: 모은 뒤
  alternatives_korean:
  - 모은 후에
  - 모으고 나서
  lexicon: LSJ
  rationale: 부사절의 시간 순서를 자연스럽게 드러내되, 원문의 선행 동작을 과도하게 해석하지 않도록 간결하게 옮겼습니다.
- source_word: τοὺς περὶ αὐτὸν ὄντας
  english_pob_choice: those with him
  chosen_korean: 자기와 함께 있는 사람들
  alternatives_korean:
  - 그와 함께 있는 사람들
  - 그의 주변에 있는 사람들
  lexicon: LSJ
  rationale: 직역적인 ‘주변에 있는 사람들’보다 한국어에서 더 자연스럽고, 군사적 맥락의 집합된 동료들을 충분히 반영합니다.
- source_word: τοῖς δεσμίοις
  english_pob_choice: by the enemy
  chosen_korean: 적을 보고
  alternatives_korean:
  - 포로들을 보고
  - 갇힌 자들을 보고
  lexicon: LSJ
  rationale: 영어 POB가 본문 문맥상 난해한 δεσμίοις를 적대 세력으로 풀이한 점을 따라, 한국어 본문도 ‘적’으로 옮겨 전투 권면의 의미가 흐려지지 않게 했습니다. 본문의 난점을 드러내기 위해 ‘보고’로 상황 대상을 두었습니다.
- source_word: τὴν τῶν ἀδίκως παραγενομένων ἐπʼ αὐτοὺς ἐθνῶν πολυπληθείαν
  english_pob_choice: the great multitude of the nations that had come against them unjustly
  chosen_korean: 부당하게 자기들에게 맞서 온 민족들의 큰 무리
  alternatives_korean:
  - 불의하게 그들에게 다가온 민족들의 큰 무리
  - 부당하게 그들 위에 몰려온 민족들의 큰 무리
  lexicon: LSJ
  rationale: ἐθνῶν은 Maccabees의 군사·민족 문맥을 살려 ‘민족들’로, πολυπληθεία는 수적 압도감을 살려 ‘큰 무리’로 옮겼습니다. ἀδίκως παραγενομένων ἐπʼ αὐτούς의 공격적 뉘앙스는 ‘맞서 온’으로 표현했습니다.
- source_word: ἀγωνίσασθαι δὲ γενναίως
  english_pob_choice: to fight bravely
  chosen_korean: 용감하게 싸우라고
  alternatives_korean:
  - 담대하게 싸우라고
  - 용맹하게 싸우라고
  lexicon: LSJ
  rationale: 전투 권면의 문맥에서 ἀγωνίσασθαι는 ‘싸우다’가 가장 직접적이며, γενναίως는 과장 없이 용기 있는 태도를 나타내므로 ‘용감하게’로 옮겼습니다.
theological_decisions:
- issue: δεσμίοις의 난해한 의미 처리
  chosen_reading: 본문에는 군사적 권면의 흐름을 살리기 위해 ‘적’으로 의미를 풀어 옮겼습니다.
  alternative_readings:
  - 포로들
  - 갇힌 자들
  rationale: 직역하면 의미가 어색해지지만, 문맥 전체는 마카베오가 맞서 싸워야 할 적대 세력을 두려워하지 말라고 권하는 장면입니다. 따라서 의미를 드러내는 번역을 택하되, 어휘상의 난점은 영어 POB의 audit trail에 의해 보존됩니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 5
- issue: ἐθνῶν의 번역
  chosen_reading: ‘민족들’로 번역해 외국 세력의 정치·민족적 성격을 살렸습니다.
  alternative_readings:
  - 이방인들
  - 나라들
  rationale: 2 마카베오의 유대 전쟁 서사에서는 종교적 기술어 ‘이방인’보다 외세 집단을 가리키는 ‘민족들’이 본문 의도에 더 가깝습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
