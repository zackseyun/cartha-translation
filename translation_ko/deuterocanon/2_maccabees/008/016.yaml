  terminology: ‘마카베오’, ‘민족들’, ‘용감하게 싸우다’는 적절합니다. δεσμίοις는 본문에서 문맥상 ‘적’으로 처리할 수 있으나, ‘포로들/갇힌 자들’이라는 문자적 의미 및 본문상의 난해함을 각주에서 명확히 보존해야 합니다.
