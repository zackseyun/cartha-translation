  text: 그런데 마카베오가 자기와 함께 있는 사람들, 곧 약 6천 명을 모은 뒤 그들에게 적을 보고 두려워하지 말고, 부당하게 자기들에게 맞서 온 민족들의 큰 무리를 두려워하지도 말며, 오히려 용감하게 싸우라고 권했습니다.[a]
