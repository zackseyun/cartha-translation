base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/025.yaml
  text: But they took the money of those who had come to buy them. And after pursuing them for a considerable distance, they turned back from the region, being hemmed in,
  footnotes:
  - marker: a
    text: Or 'for a long while'; the Greek phrase can express extended duration as well as extended distance.
    reason: lexical_alternative
  - marker: b
    text: The final participle may indicate that they turned back because they were being pressed in or constrained, likely by circumstances such as time or terrain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 그들은 자기들에게 그들을 사러 온 이들의 돈을 받았습니다. 그리고 그들을 상당한 거리까지 추격한 뒤, 그들은 그 지방에서 물러났습니다. 그들이 포위되어 있었기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἐφʼ ἱκανόν은 시간상 '오랫동안'과 공간상 '상당한 거리'를 모두 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 분사는 그들이 시간이나 지형 등으로 인해 압박을 받아 물러났음을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ δὲ χρήματα
  english_pob_choice: the money
  chosen_korean: 돈
  alternatives_korean:
  - 금전
  - 대금
  - 재물
  lexicon: LSJ
  rationale: 구매를 위해 가져온 대금을 가리키므로, 한국어에서는 가장 직접적인 '돈'이 문맥을 분명하게 드러냅니다.
- source_word: τῶν παραγενομένων ἐπὶ τὸν ἀγορασμὸν αὐτῶν
  english_pob_choice: of those who had come to buy them
  chosen_korean: 자기들에게 그들을 사러 온 이들
  alternatives_korean:
  - 그들의 구매를 위해 온 이들
  - 그들을 사려고 온 이들의
  lexicon: LSJ
  rationale: παραγενομένων은 '와서 이른' 뜻이고 ἀγορασμός는 '구매'이므로, 포로를 사려는 이들을 자연스럽게 풀어 옮겼습니다.
- source_word: ἐφʼ ἱκανόν
  english_pob_choice: for a considerable distance
  chosen_korean: 상당한 거리까지
  alternatives_korean:
  - 오랫동안
  - 꽤 먼 데까지
  - 한동안
  lexicon: LSJ
  rationale: 이 표현은 거리와 시간을 모두 시사할 수 있지만, 추격 문맥에서는 거리로 옮기는 것이 가장 직접적입니다.
- source_word: ἀνέλυον
  english_pob_choice: they turned back
  chosen_korean: 물러났습니다
  alternatives_korean:
  - 되돌아갔습니다
  - 철수했습니다
  - 돌아서 갔습니다
  lexicon: LSJ
  rationale: 군사적·이동 문맥에서 ἀναλύω는 떠나거나 물러나는 뜻이므로, 한국어에서는 격식 있고 자연한 '물러났습니다'를 택했습니다.
- source_word: συγκλειόμενοι
  english_pob_choice: being hemmed in
  chosen_korean: 포위되어 있었기 때문입니다
  alternatives_korean:
  - 둘러싸여 있었기 때문입니다
  - 압박을 받고 있었기 때문입니다
  - 갇혀 있었기 때문입니다
  lexicon: LSJ
  rationale: 이 분사구는 그들이 물러난 이유를 설명하므로, 군사적 뉘앙스를 살려 '포위되어'로 옮겼습니다.
