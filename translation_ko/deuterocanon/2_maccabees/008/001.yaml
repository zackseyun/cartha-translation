  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 συνῆγον의 집결 결과를 ‘그 수는 …이었습니다’로 처리하면 누가 누구를 모았는지가 약해지고, ‘불러 모으고 … 받아들여 모았는데’는 ‘모으다’가 불필요하게 반복됩니다. 주어와 집결 행위를 분명히 하는 편이 원문에 더 가깝습니다.
  naturalness: ‘마을들’보다 ‘여러 마을’이 자연스럽고, ‘유다이즘’은 현대 표준 한국어 성경 문맥에서 다소 낯선 음역입니다. ‘유대교’로 번역하고 각주에서 이 문맥의 종교적·공동체적 정체성 및 실천이라는 폭을 밝혀 주는 것이 자연스럽습니다.
  terminology: ‘마카베오’와 ‘유다’는 적절합니다. Ἰουδαϊσμός는 여기서 후대의 좁은 제도 종교만을 뜻하지 않으므로 ‘유대교’를 쓰되, 각주로 ‘유대인의 삶의 방식’이라는 가능한 의미와 헬라화에 맞선 정체성의 뉘앙스를 보완합니다.
