  lexicon: LSJ
  rationale: 추가 호칭을 자연스럽게 드러내기 위해 '라고도 불리는'을 사용했습니다.
- source_word: παρεισπορευόμενοι λεληθότως
  english_pob_choice: slipping in secretly
  chosen_korean: 몰래 마을들에 들어가며
  alternatives_korean:
