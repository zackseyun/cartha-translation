  - 남몰래 마을들로 스며들며
  lexicon: LSJ
  rationale: 두 표현이 함께 만드는 '몰래/은밀히'와 '들어가다'의 중첩된 뉘앙스를 살리되, 한국어로는 과도하게 기계적이지 않게 옮겼습니다.
- source_word: προσεκαλοῦντο τοὺς συγγενεῖς
  english_pob_choice: were calling together their relatives
  chosen_korean: 친족들을 불러 모으고
  alternatives_korean:
  - 친족들을 소집하고
  - 친족들을 불러들여
  lexicon: LSJ
  rationale: 중간태의 집결 의미를 반영해 단순한 '부르다'보다 '불러 모으다'가 더 적합합니다.
- source_word: τοὺς μεμενηκότας ἐν τῷ Ἰουδαϊσμῷ
  english_pob_choice: those who had remained in Judaism
  chosen_korean: 유다이즘에 남아 있던 이들을
  alternatives_korean:
  - 유다이즘에 머물러 있던 이들을
  - 유다이즘에 그대로 남아 있던 이들을
  lexicon: LSJ
  rationale: Ἰουδαϊσμός를 영어 POB처럼 고유한 종교·정체성 표지로 보아, 현대 한국어 관용어인 '유다이즘'을 그대로 두었습니다.
- source_word: συνῆγον εἰς ἑξακισχιλίους
  english_pob_choice: they gathered about six thousand
  chosen_korean: 그 수는 약 육천 명이었습니다
  alternatives_korean:
  - 그들은 약 육천 명을 모았습니다
  - 대략 육천 명이 되었습니다
  lexicon: LSJ
  rationale: 결과적 총수를 자연스러운 한국어로 제시하되, '약'으로 대략성을 보존했습니다.
theological_decisions:
- issue: Ἰουδαϊσμός의 번역과 역사적 뉘앙스
  chosen_reading: '''유다이즘''으로 음역하여 유대교적 삶의 방식과 정체성 표지를 함께 드러냅니다.'
  alternative_readings:
  - 유대교
  - 유대인의 생활 방식
  rationale: 2마카베오스의 용례는 단순 교리 체계보다 헬라화 압력에 맞선 유대 정체성과 실천을 가리키므로, 본문 자체의 역사적 긴장을 약화시키지 않는 음역을 택했습니다.
  doctrine_reference: Translation philosophy §1, §5
