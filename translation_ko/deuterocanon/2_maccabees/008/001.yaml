base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/001.yaml
  text: But Judas[a], who was also called Maccabeus, and those with him, slipping in secretly into the villages, were calling together their relatives; and taking in those who had remained in Judaism, they gathered about six thousand.
  footnotes:
  - marker: a
    text: Or 'those who had remained loyal to the Jewish way of life.' The Greek term 'Judaism' here refers to Jewish religious identity and practice in contrast to Hellenizing pressure.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 마카베오라고도 불리는 유다와 그와 함께한 사람들은 몰래 마을들에 들어가며, 친족들을 불러 모으고 유다이즘에 남아 있던 이들을 받아들여 모았는데, 그 수는 약 육천 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘유다이즘’은 유대인의 종교적 정체성과 실천, 곧 헬라화 압력에 맞서는 유대적 삶의 방식을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καὶ Μακκαβαῖος
  english_pob_choice: who was also called Maccabeus
  chosen_korean: 마카베오라고도 불리는
