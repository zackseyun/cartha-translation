  lexicon: LSJ
  rationale: Ἰουδαϊσμός를 영어 POB처럼 고유한 종교·정체성 표지로 보아, 현대 한국어 관용어인 '유다이즘'을 그대로 두었습니다.
- source_word: συνῆγον εἰς ἑξακισχιλίους
  english_pob_choice: they gathered about six thousand
  chosen_korean: 그 수는 약 육천 명이었습니다
  alternatives_korean:
  - 그들은 약 육천 명을 모았습니다
  - 대략 육천 명이 되었습니다
  lexicon: LSJ
  rationale: 결과적 총수를 자연스러운 한국어로 제시하되, '약'으로 대략성을 보존했습니다.
theological_decisions:
- issue: Ἰουδαϊσμός의 번역과 역사적 뉘앙스
  chosen_reading: '''유다이즘''으로 음역하여 유대교적 삶의 방식과 정체성 표지를 함께 드러냅니다.'
  alternative_readings:
  - 유대교
  - 유대인의 생활 방식
  rationale: 2마카베오스의 용례는 단순 교리 체계보다 헬라화 압력에 맞선 유대 정체성과 실천을 가리키므로, 본문 자체의 역사적 긴장을 약화시키지 않는 음역을 택했습니다.
  doctrine_reference: Translation philosophy §1, §5
