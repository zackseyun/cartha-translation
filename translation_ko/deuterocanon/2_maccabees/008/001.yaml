- from: 그러나 마카베오라고도 불리는 유다와 그와 함께한 사람들은 몰래 마을들에 들어가며, 친족들을 불러 모으고 유다이즘에 남아 있던 이들을 받아들여 모았는데, 그 수는 약 육천 명이었습니다.[a]
  to: 그러나 마카베오라고도 불린 유다와 그의 동료들은 남몰래 여러 마을에 들어가 자기 친족들을 불러 모으고, 유대교에 남아 있던 사람들을 받아들여 모두 약 육천 명을 모았습니다.[a]
  rationale: 원문의 은밀한 이동, 친족의 소집, 유대교에 남아 있던 이들의 수용, 그리고 약 육천 명으로의 집결을 한 문장 안에서 명료하게 연결했습니다. ‘유대교’의 현대적 오해 가능성은 본문 음역 대신 각주로 보완하여 원문의 역사적·정체성적 의미 범위를 보존했습니다.
