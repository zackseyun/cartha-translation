base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/010.yaml
  text: But Nikanor undertook to pay to the king the tribute owed to the Romans[a], amounting to two thousand talents[b], from the captivity of the Jews.
  footnotes:
  - marker: a
    text: Or, more literally, 'the tribute to the king, for the Romans.' The Greek is compact; the sense is that Nikanor proposed to meet the king's obligation to Rome from the Jews' capture.
    reason: alternative_reading
  - marker: b
    text: That is, by taking Jews captive and profiting from their sale or ransom.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 니카노르는 왕에게 로마인들에게 갚아야 하는 조공을—그 값이 이천 달란트였는데—유대인의 포로 상태에서 마련하여 갚기로 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 매우 압축적이어서, ‘왕이 로마인들에게 져야 하는 조공’을 뜻하는 것으로 이해할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 즉 유대인들을 포로로 잡아 팔거나 몸값을 받아 그 비용을 마련한다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἰδιωτεύσατο
  english_pob_choice: undertook
  chosen_korean: 갚기로 하였습니다
  alternatives_korean:
  - 맡기로 하였습니다
  - 떠맡기로 하였습니다
  - 스스로 감당하기로 하였습니다
  lexicon: LSJ
  rationale: 니카노르가 그 일을 스스로 떠맡았다는 뜻을 살리되, 재정적 맥락에서 자연스럽게 읽히도록 ‘갚기로 하였습니다’로 옮겼습니다.
- source_word: φόρον
  english_pob_choice: tribute
  chosen_korean: 조공
  alternatives_korean:
  - 공물
  - 세금
  - 헌납금
  lexicon: LSJ
  rationale: 제국-종속 관계의 부담금을 가리키므로, 단순한 세금보다 정치적 뉘앙스가 있는 ‘조공’이 적절합니다.
- source_word: τοῖς ις Ῥωμαίοις
  english_pob_choice: owed to the Romans
  chosen_korean: 로마인들에게 갚아야 하는
  alternatives_korean:
  - 로마인들에게 바쳐야 하는
  - 로마인들에게 진
  - 로마인들을 위한
  lexicon: LSJ
  rationale: 압축된 그리스어 구문을 한국어에서는 ‘로마인들에게 갚아야 하는’으로 풀어, 조공의 채무 관계를 분명히 했습니다.
- source_word: ἐκ τῆς τῶν Ἰουδαίων αἰχμαλωσίας
  english_pob_choice: from the captivity of the Jews
  chosen_korean: 유대인의 포로 상태에서
  alternatives_korean:
  - 유대인들을 사로잡아
  - 유대인의 포로로부터
  - 유대인 포로들을 통해
  lexicon: LSJ
  rationale: 문맥상 유대인을 포로로 잡아 그 처분으로 자금을 마련한다는 뜻이므로, ‘포로 상태에서’로 옮겨 포획/억류의 수익원을 드러냈습니다.
theological_decisions:
- issue: 그리스어의 압축된 금액·소유 관계를 한국어에서 어떻게 풀어낼지
  chosen_reading: 조공의 채무 관계를 분명히 하되, 유대인의 포로화가 그 재원이라는 불편한 뜻을 숨기지 않았습니다.
  alternative_readings:
  - 왕에게 로마인들을 위한 조공을 갚기로 하였습니다
  - 왕에게 로마인들에게 진 조공을 갚기로 하였습니다
  rationale: 본문은 단순한 납세가 아니라 전쟁 포로화와 착취를 통한 충당을 말하므로, 그 폭력성을 희석하지 않는 번역이 필요합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve source sense over domestication.'
