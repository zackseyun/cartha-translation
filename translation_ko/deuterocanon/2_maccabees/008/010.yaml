    rationale: ἰδιωτεύσατο는 단순히 지불했다기보다 그 부담을 맡거나 충당하기로 했다는 뜻이므로, ‘충당하겠다고 하였습니다’가 문맥과 어휘 양쪽에 더 적합합니다.
