  rationale: 본문은 단순한 납세가 아니라 전쟁 포로화와 착취를 통한 충당을 말하므로, 그 폭력성을 희석하지 않는 번역이 필요합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve source sense over domestication.'
