  - 떠맡기로 하였습니다
  - 스스로 감당하기로 하였습니다
  lexicon: LSJ
  rationale: 니카노르가 그 일을 스스로 떠맡았다는 뜻을 살리되, 재정적 맥락에서 자연스럽게 읽히도록 ‘갚기로 하였습니다’로 옮겼습니다.
- source_word: φόρον
