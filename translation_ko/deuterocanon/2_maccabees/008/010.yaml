  rationale: 제국-종속 관계의 부담금을 가리키므로, 단순한 세금보다 정치적 뉘앙스가 있는 ‘조공’이 적절합니다.
- source_word: τοῖς ις Ῥωμαίοις
  english_pob_choice: owed to the Romans
  chosen_korean: 로마인들에게 갚아야 하는
  alternatives_korean:
  - 로마인들에게 바쳐야 하는
  - 로마인들에게 진
  - 로마인들을 위한
  lexicon: LSJ
  rationale: 압축된 그리스어 구문을 한국어에서는 ‘로마인들에게 갚아야 하는’으로 풀어, 조공의 채무 관계를 분명히 했습니다.
- source_word: ἐκ τῆς τῶν Ἰουδαίων αἰχμαλωσίας
  english_pob_choice: from the captivity of the Jews
  chosen_korean: 유대인의 포로 상태에서
  alternatives_korean:
  - 유대인들을 사로잡아
  - 유대인의 포로로부터
  - 유대인 포로들을 통해
  lexicon: LSJ
  rationale: 문맥상 유대인을 포로로 잡아 그 처분으로 자금을 마련한다는 뜻이므로, ‘포로 상태에서’로 옮겨 포획/억류의 수익원을 드러냈습니다.
theological_decisions:
