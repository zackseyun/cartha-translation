  text: But after the Sabbath[a], having distributed some of the spoils to those who had been oppressed, and to the widows and the orphans[b], they divided the rest among themselves and their children.
  footnotes:
  - marker: a
    text: Or 'to the oppressed,' 'to those who had been mistreated.' The Greek participle refers broadly to people who had suffered hardship or abuse.
    reason: lexical_alternative
  - marker: b
    text: '''Spoils'' may also be rendered ''plunder'' or ''booty.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 안식일이 지난 뒤에, 그들은 고통을 당한 이들[a]과 과부들과 고아들에게 전리품[b]의 일부를 나누어 주고, 남은 것은 자신들과 그들의 자녀들 사이에 나누었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἠκισμένοις는 문자적으로는 ‘해를 입은 사람들’에 가깝고, 여기서는 폭넓게 ‘고통을 당한 이들’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: σκῦλα는 전쟁에서 얻은 ‘전리품’, ‘노획물’, ‘약탈물’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ τὸ σάββατον
  english_pob_choice: But after the Sabbath
  chosen_korean: 그러나 안식일이 지난 뒤에
  alternatives_korean:
  - 그리고 안식일이 지난 뒤에
  - 안식일 뒤에
  lexicon: LSJ
  rationale: μετά + 대격은 사건 뒤의 시간을 나타내며, δέ는 약한 전환을 표시하므로 ‘그러나’로 문맥 전환을 살리고 ‘안식일이 지난 뒤에’로 자연스럽게 옮겼습니다.
- source_word: τοῖς ἠκισμένοις
  english_pob_choice: to those who had been afflicted
  chosen_korean: 고통을 당한 이들
  alternatives_korean:
  - 압제를 받은 이들
  - 학대를 당한 이들
  - 억눌린 이들
  lexicon: LSJ
  rationale: ἠκισμένοις는 심한 해악이나 고통을 겪은 사람들을 가리키므로, 사회적·육체적 고통을 포괄하는 ‘고통을 당한 이들’로 옮겼습니다.
- source_word: ἀπὸ τῶν σκύλων
  english_pob_choice: some of the spoils
  chosen_korean: 전리품의 일부
  alternatives_korean:
  - 약탈물의 일부
  - 노획물의 일부
  lexicon: LSJ
  rationale: σκῦλα는 전쟁 맥락의 전리품/노획물을 뜻하며, ἀπό는 그 전리품에서 떼어 준 몫을 나타내므로 ‘전리품의 일부’가 관계를 가장 분명하게 드러냅니다.
- source_word: τὰ παιδία
  english_pob_choice: their children
  chosen_korean: 그들의 자녀들
  alternatives_korean:
  - 아이들
  - 어린 자녀들
  lexicon: LSJ
  rationale: τὰ παιδία는 문맥상 전투원들의 부양 자녀들을 가리키므로, 소유 관계를 분명히 한 ‘그들의 자녀들’로 옮겼습니다.
theological_decisions:
- issue: 구약/마카베오기의 사회적 배분 묘사
  chosen_reading: 전리품을 먼저 고통받는 이들과 과부와 고아에게 나누고, 남은 것을 공동체 내부에 다시 나누는 장면으로 분명히 드러냈습니다.
  alternative_readings:
  - 형식적으로만 ‘전리품에서 나누어 주고’라고 옮겨 첫 분배의 우선성을 덜 드러낼 수 있습니다.
  rationale: 그리스어 구조와 ἀπό의 용법은 취약한 이들을 먼저 배려한 뒤 잔여분을 나누는 흐름을 보여 주므로, 그 윤리적 대비가 흐려지지 않게 했습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
