  rationale: 원문의 병렬된 부정사들은 앞선 간구의 내용을 이루므로, 한국어에서는 존대 기원형 ‘기억하시고 … 미워하시기를 바랍니다’로 자연스럽게 연결했습니다. 이 형식은 원문에 없는 사역·목적 의미를 더하지 않습니다. ‘무고한’은 ἀναμαρτήτων의 문맥상 수사적 의미를 살리면서 절대적 무죄라는 교리적 함의를 피합니다. 각주 표지는 각각 ‘무고한 유아들’과 ‘악을 미워하시기를’에 직접 붙이는 편이 이상적이나, 제공된 표기 형식에 맞추어 문장 끝에 유지했습니다.
