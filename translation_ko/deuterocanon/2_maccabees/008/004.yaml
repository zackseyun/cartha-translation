  text: and also to remember the lawless destruction of the innocent infants[a], and the blasphemies committed against his name[b], and to hate evil.
  footnotes:
  - marker: a
    text: Or 'the sinless infants.' The Greek adjective literally means 'without sin,' but here likely emphasizes their innocence as victims.
    reason: lexical_alternative
  - marker: b
    text: Or 'to hate evil' or 'to abhor wickedness.' The Greek verb is rare and expresses strong hostility toward evil.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 무죄한 유아들의 불법적인 멸망과 그의 이름에 대해 행해진 신성모독들을 기억하며, 악을 미워하게 하려는 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죄 없는 유아들’. 그리스어 형용사는 문자적으로 ‘죄가 없는’이라는 뜻이지만, 여기서는 희생된 피해자로서의 무고함을 강조하는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘악을 미워하게 하려는 것입니다’로도 옮길 수 있습니다. 희귀한 그리스어 동사는 악에 대한 강한 적대감을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνησθῆναι
  english_pob_choice: to remember
  chosen_korean: 기억하며
  alternatives_korean:
  - 기억하고
  - 마음에 새기며
  lexicon: LSJ
  rationale: 아오리스트 부정사로 이어지는 의도적 요청의 흐름을 살려, 자연스러운 현대 한국어로 ‘기억하며’라고 옮겼습니다.
- source_word: ἀναμαρτήτων νηπίων
  english_pob_choice: innocent infants
  chosen_korean: 무죄한 유아들
  alternatives_korean:
  - 죄 없는 유아들
  - 죄 없는 어린아이들
  lexicon: LSJ
  rationale: 직역인 ‘죄 없는’도 가능하지만, 여기서는 희생된 아주 어린 아이들의 무고함을 드러내는 ‘무죄한’이 문맥상 더 적절합니다.
- source_word: παρανόμου ἀπωλίας
  english_pob_choice: lawless destruction
  chosen_korean: 불법적인 멸망
  alternatives_korean:
  - 율법을 어긴 멸망
  - 법 없는 파멸
  lexicon: LSJ
  rationale: παράνομος의 ‘법을 벗어난/어긴’ 뜻을 살려 ‘불법적인’으로 옮기고, ἀπωλία의 중량감을 ‘멸망’으로 반영했습니다.
- source_word: βλασφημιῶν εἰς τὸ ὄνομα αὐτοῦ
  english_pob_choice: blasphemies committed against his name
  chosen_korean: 그의 이름에 대해 행해진 신성모독들
  alternatives_korean:
  - 그의 이름을 향한 모독들
  - 그의 이름에 대한 비방들
  lexicon: LSJ
  rationale: ‘이름’에 대한 공격이므로 단순한 비방보다 종교적 모독의 강도를 가진 ‘신성모독’이 원문의 무게를 더 잘 전달합니다.
- source_word: μισοπνηρῆσαι
  english_pob_choice: to hate evil
  chosen_korean: 악을 미워하게 하려는 것입니다
  alternatives_korean:
  - 악을 미워하려는 것입니다
  - 악을 혐오하게 하려는 것입니다
  lexicon: LSJ
  rationale: 희귀 동사의 강한 반악의 의미를 살리되, ‘되다/하려는’ 구성을 통해 앞의 기억 항목들이 낳는 내적 결의를 자연스럽게 나타냈습니다.
theological_decisions:
- issue: ἀναμαρτήτων의 신학적 뉘앙스
  chosen_reading: ‘무죄한’으로 번역해, 본문의 수사적 초점이 아이들의 도덕적 무고함에 있음을 드러냈습니다.
  alternative_readings:
  - 죄 없는
  - 죄가 없는
  rationale: ‘죄 없는’은 절대적 무죄/무흠의 교리를 암시할 수 있어, 본문이 의도하는 피해자의 무고함을 넘어설 수 있습니다.
  doctrine_reference: '번역 원칙: 본문이 말하는 범위 안에서 의미를 보존하고, 후대 교리적 확장을 피합니다.'
