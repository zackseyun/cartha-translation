  - 무기를 수습하고
  lexicon: LSJ
  rationale: 전투 뒤 무기를 한데 모아 정리하는 동작을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: τὰ σκῦλα ἐκδύσαντες τῶν πολεμίων
  english_pob_choice: stripped the spoils from the enemies
  chosen_korean: 적들의 전리품을 빼앗은 뒤
  alternatives_korean:
  - 적들에게서 전리품을 거둔 뒤
  - 적들의 노략물을 벗겨 낸 뒤
  lexicon: LSJ
  rationale: σκῦλα는 전리품/노획물의 뜻이므로 ‘전리품’을 택했고, ἐκδύσαντες의 강한 탈취 이미지를 살리되 한국어에서는 과도하게 직역하지 않았습니다.
- source_word: περὶ τὸ σάββατον ἐγίνοντο
  english_pob_choice: they devoted themselves to the Sabbath
  chosen_korean: 안식일과 관련하여 움직이며
  alternatives_korean:
  - 안식일을 지키는 일에 전념하며
  - 안식일을 맞아 몸가짐을 하고
  lexicon: LSJ
  rationale: 이 표현은 관용적으로 안식일 준수를 향해 방향을 튼다는 뜻이므로, 본문의 뉘앙스를 보존하면서도 한국어에서 어색하지 않게 옮겼습니다.
- source_word: τῷ κυρίῳ τῷ διασώζοντι εἰς τὴν ἡμέραν ταύτην
  english_pob_choice: to the Lord who had preserved them to this day
  chosen_korean: 야훼께 … 그들을 이 날까지 보존하신 분
  alternatives_korean:
  - 주께 … 그들을 이 날까지 구해 주신 분
  - 주님께 … 그들을 이 날까지 지켜 주신 분
  lexicon: LSJ
  rationale: 본문의 κύριος가 구약적 하나님의 호칭을 가리키므로 기본 원칙에 따라 ‘야훼’로 옮겼고, διασώζοντι는 단순한 구출보다 지속적 보존의 뜻이 강해 ‘보존하신’으로 번역했습니다.
- source_word: ἀρχὴν ἐλέους τάξαντος αὐτοῖς
  english_pob_choice: having appointed for them the beginning of mercy
  chosen_korean: 그들에게 자비의 시작을 정해 주셨습니다
  alternatives_korean:
  - 그들에게 자비의 첫 징표를 마련해 주셨습니다
  - 그들에게 자비의 출발점을 정하셨습니다
  lexicon: LSJ
  rationale: ‘ἐλέους’의 핵심을 ‘자비’로 살리고, ἀρχή를 결과의 완성을 미리 단정하지 않는 ‘시작’으로 옮겨 본문의 신학적 긴장을 보존했습니다.
theological_decisions:
- issue: 안식일 준수 표현의 관용성
  chosen_reading: 본문은 단순한 시간 언급보다, 전투 후 곧바로 안식일을 염두에 두고 삶의 방향을 돌린 것을 보여 줍니다.
  alternative_readings:
  - 정확히 안식일 규례를 지켰다는 직접 진술
  - 그저 안식일 무렵이었다는 시간표현
  rationale: περὶ τὸ σάββατον ἐγίνοντο는 문맥상 안식일 준수로 향하는 관용적 표현이므로, 행위의 방향성을 살리되 지나친 의식 설명은 덧붙이지 않았습니다.
  doctrine_reference: 본문의 관용적 표현과 문맥적 의미를 함께 보존
