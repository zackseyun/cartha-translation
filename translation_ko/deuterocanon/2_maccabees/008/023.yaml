  yaml_path: translation/deuterocanon/2_maccabees/008/023.yaml
  text: He also brought Eleazar[a], and after bringing forward the holy book and giving the watchword[b], “God’s Help,” he himself led the first company and engaged Nicanor.
  footnotes:
  - marker: a
    text: Or “the password, ‘Help of God’” or “the signal, ‘God is help.’” The Greek expression is compressed and may be understood in more than one way.
    reason: lexical_alternative
  - marker: b
    text: “First company” translates a military term that could also be rendered “first cohort” or “first band.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 엘르아살도 데려오고, 거룩한 책을 내어 놓은 뒤, “하나님의 도움”이라는 구호[a]를 주고, 자신이 첫 번째 부대[b]를 앞장서서 이끌며 니카노르와 맞붙었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 σύνθημα θεοῦ Βοηθείας는 ‘하나님의 도움’이라는 구호나 암호를 가리킬 수 있으며, 압축된 표현이므로 ‘하나님은 도움이시다’라는 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘첫 번째 부대’는 군사 단위를 가리킵니다. ‘첫 번째 대열’로도 옮길 수 있으며, 문맥에 따라 ‘첫 번째 코호르트’로 이해할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγαγὼν τὴν ἱερὰν βίβλον
  english_pob_choice: after bringing forward the holy book
  chosen_korean: 거룩한 책을 앞으로 내보이며
  alternatives_korean:
  - 성스러운 책을 가져오며
  - 거룩한 두루마리를 앞으로 내보이며
  lexicon: LSJ
  rationale: παραγαγὼν은 앞쪽으로 내어 놓는 진행 동작을 나타내므로 ‘앞으로 내보이며’로 살렸고, ἱερὰν βίβλον은 물리적 형식보다 성스러운 성격을 드러내는 ‘거룩한 책’으로 옮겼습니다.
- source_word: σύνθημα θεοῦ Βοηθείας
  english_pob_choice: watchword, “God’s Help”
  chosen_korean: 하나님의 도움이라는 신호
  alternatives_korean:
  - 하나님의 도움이라는 암호
  - “하나님의 도움”이라는 구호
  lexicon: LSJ
  rationale: σύνθημα는 군사적 ‘신호’나 ‘암호’의 뜻이 있어, 문맥상 군사 준비를 드러내는 ‘신호’로 옮겼습니다. 압축된 θεοῦ Βοηθείας는 소유격 구조를 그대로 풀어 ‘하나님의 도움’으로 처리했습니다.
- source_word: τῆς πρώτης σπείρης
  english_pob_choice: the first company
  chosen_korean: 첫 번째 부대
  alternatives_korean:
  - 첫 번째 대대
  - 첫 번째 군단
  lexicon: LSJ
  rationale: σπεῖρα는 군사 단위를 가리키므로, 영어 POB의 ‘company’에 대응해 현대 한국어에서 자연스럽고 과도하게 로마식 조직을 특정하지 않는 ‘부대’를 택했습니다.
- source_word: συνέβαλε τῷ Νικάνορι
  english_pob_choice: engaged Nicanor
  chosen_korean: 니카노르와 맞붙었습니다
  alternatives_korean:
  - 니카노르와 교전했습니다
  - 니카노르와 싸웠습니다
  lexicon: LSJ
  rationale: συμβάλλω + 여격은 전투에서 ‘맞붙다/교전하다’의 뜻이므로, 일방적 ‘공격’보다 상호 충돌의 뉘앙스를 살린 ‘맞붙었습니다’가 적절합니다.
theological_decisions:
- issue: 문장 주어의 지속과 엘레아살의 역할
  chosen_reading: 문장 전체의 행동 주체는 앞 문맥의 인물로 이어지는 주어이며, 엘레아살은 ‘데려온’ 대상로 제시됩니다.
  alternative_readings:
  - 엘레아살이 이후 행동의 중심으로 읽힐 수 있음
  rationale: 그리스어에서 Ἐλεάζαρον은 대격으로 ‘데려오다’의 목적어로 놓이고, 뒤의 분사들과 본동사는 앞 문맥의 서술 주어를 계속합니다. 그래서 번역도 이 군사적 진행을 유지했습니다.
  doctrine_reference: 문맥적 주어 해석
