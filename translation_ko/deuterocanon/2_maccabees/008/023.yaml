    rationale: 본문은 ‘하나님의 도움’이라는 정해진 표어를 부여하는 장면이므로, 한국어에서는 ‘구호’가 내용 인용 및 군사 문맥을 더 자연스럽게 전달합니다.
  - severity: medium
