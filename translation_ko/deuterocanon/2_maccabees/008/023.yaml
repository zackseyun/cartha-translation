  source_fidelity: 그리스어의 연속된 분사(‘거룩한 책을 내어 놓고’, ‘구호를 주고’)와 본동사(‘니카노르와 맞붙었다’)는 대체로 반영되어 있습니다. 다만 ‘신호를 주다’는 군사적 σύνθημα의 용법을 충분히 드러내지 못하며, σπεῖρα의 각주 대안 가운데 ‘군단’은 원어가 가리키는 단위를 과도하게 특정합니다. 엘레아살의 언급은 본문의 압축된 구문을 따라, 앞 문맥의 주어가 그를 데려온 것으로 처리할 수 있습니다.
  naturalness: ‘하나님의 도움이라는 신호를 주다’보다 인용된 내용과 결합하는 ‘“하나님의 도움”이라는 구호를 주다’가 현대 한국어에서 더 자연스럽고 군사 문맥에도 적합합니다. ‘거룩한 책을 앞으로 내보이며’는 책에 쓰기에는 다소 부자연스러우므로 ‘내어 놓고’로 다듬었습니다. ‘앞장서서 이끌고’는 προηγούμενος의 선두 지휘 뉘앙스를 살립니다.
  terminology: 성서 인명은 통용 표기인 ‘엘르아살’을 사용했습니다. σύνθημα는 군사적 약속 신호/암호라는 범주를 포괄하는 ‘구호’로 옮겼습니다. σπεῖρα는 특정 시대의 편제를 단정하지 않는 ‘부대’를 유지하되, 각주에서 ‘대열’ 및 ‘코호르트’라는 제한적 대안을 제시했습니다.
