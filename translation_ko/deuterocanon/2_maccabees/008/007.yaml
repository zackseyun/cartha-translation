  text: He especially took the nights as allies for such attacks[b][a], and the report of his valor spread everywhere.
  footnotes:
  - marker: a
    text: Greek literally, 'he took the nights as συνεργούς for such attacks,' preserving a metaphor in which nighttime itself serves as his ally in guerrilla-style operations.
    reason: lexical_alternative
  - marker: b
    text: The phrase rendered 'the fame of his valor' is based on an unusual Greek expression ('ἡ ἁλὴ τῆς εὐανδρείας αὐτοῦ'). It appears to mean the report or renown of his courage spreading widely.
    reason: textual_variant
translation:
  language: ko
  text: 그는 특히 그런 공격을 위해 밤을 동맹처럼 삼았습니다[a]. 그리고 그의 용맹에 대한 소문이 사방에 퍼졌습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어는 직역하면 ‘그는 그런 공격들에 대하여 밤들을 동맹자들로 삼았습니다’라는 뜻으로, 밤을 전술적 동맹처럼 의인화한 비유를 보존합니다.
    reason: lexical_alternative
  - marker: b
    text: 헬라어의 ‘ἡ ἁλὴ τῆς εὐανδρείας αὐτοῦ’는 다소 이례적인 표현이지만, 문맥상 그의 용맹에 관한 소문이나 평판이 널리 퍼졌다는 뜻으로 이해됩니다.
    reason: textual_variant
