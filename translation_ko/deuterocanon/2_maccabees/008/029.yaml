base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/029.yaml
  text: After doing these things[a], and making a common prayer of supplication[b], they begged the merciful Lord to be fully reconciled to his slaves.
  footnotes:
  - marker: a
    text: Or 'his servants.' The Greek word is δοῦλοις, which can be rendered either way depending on context; here the translation keeps the stronger sense of belonging and dependence.
    reason: lexical_alternative
  - marker: b
    text: Or 'to be reconciled completely' or 'to be reconciled at last.' The phrase εἰς τέλος can intensify the reconciliation or mark it as brought to completion.
    reason: alternative_reading
translation:
  language: ko
  text: 이 일들을 마치고, 공동의 간구를 드린 뒤, 그들은 자비로우신 주께서 자기 종들에게 끝까지 완전히 화해해 주시기를 간청하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 일들을 성취하고’. διαπραξάμενοι는 앞선 행동의 완료를 요약합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘공동의 간구’를 더 직역해 ‘함께 드리는 간구’로 옮길 수도 있습니다. κοινὴν은 기도의 동시성보다 공동성을 강조합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: διαπραξάμενοι
  english_pob_choice: After doing these things
  chosen_korean: 이 일들을 마치고
  alternatives_korean:
  - 이 일들을 수행하고
  - 이 일들을 이루고
  lexicon: LSJ
  rationale: 앞선 행위를 요약하는 분사이므로, 한국어에서는 자연스럽게 ‘마치고’로 옮겨 완료된 행동의 흐름을 살렸습니다.
- source_word: κοινὴν
  english_pob_choice: common
  chosen_korean: 공동의
  alternatives_korean:
  - 함께 하는
  - 공통의
  - 공적(公的)인
  lexicon: LSJ
  rationale: ἱκετίαν과 결합한 공통 행위를 나타내므로, 단순한 동시성이 아니라 공동으로 드리는 성격을 드러내기 위해 ‘공동의’로 옮겼습니다.
- source_word: ἱκετίαν
  english_pob_choice: a prayer of supplication
  chosen_korean: 간구
  alternatives_korean:
  - 간청
  - 탄원
  - 청원
  lexicon: LSJ
  rationale: 종교적 맥락의 간절한 청을 나타내므로, 문맥상 중복을 피하면서도 예배적 뉘앙스를 살릴 수 있는 ‘간구’를 택했습니다.
- source_word: καταλλαγῆναι
  english_pob_choice: to be fully reconciled
  chosen_korean: 완전히 화해해 주시기를
  alternatives_korean:
  - 온전히 화해해 주시기를
  - 다시 화목해 주시기를
  - 완전히 돌이켜 주시기를
  lexicon: LSJ
  rationale: 관계의 회복을 가리키는 말이므로 ‘화해’로 옮겼고, εἰς τέλος의 강조를 반영해 ‘완전히’와 ‘끝까지’를 함께 살렸습니다.
- source_word: δούλοις
  english_pob_choice: slaves
  chosen_korean: 종들에게
  alternatives_korean:
  - 노예들에게
  - 종들
  - 섬기는 이들에게
  lexicon: LSJ
  rationale: 이 본문에서 하나님과의 소속 관계가 강조되지만, 한국어 공적 문체에서는 ‘종’이 원문의 종속성을 유지하면서도 너무 현대적 충격을 주지 않는 균형점이어서 채택했습니다.
theological_decisions:
- issue: δούλοις의 한국어 강도
  chosen_reading: 종들에게
  alternative_readings:
  - 노예들에게
  - 섬기는 이들에게
  rationale: POB 영어는 bonded status를 드러내기 위해 'slaves'를 유지했으나, 한국어에서는 하나님께 대한 호칭 문맥에서 ‘노예’가 지나치게 노골적으로 들릴 수 있어, 원문의 소속성과 의존성을 보존하는 범위에서 ‘종’으로 번역했습니다.
  doctrine_reference: 'DOCTRINE.md: δοῦλος는 문맥에 따라 servant/slave를 가리킬 수 있으며, 한국어는 소속·의존성 중심으로 조정 가능'
