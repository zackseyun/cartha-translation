  text: But when Maccabaeus had formed a band[a], he had by then become irresistible to the nations, because the wrath of the Lord had turned to mercy.
  footnotes:
  - marker: a
    text: Or 'for the Gentiles,' since the Greek term can denote the non-Jewish nations surrounding Judea.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 마카베오가 한 무리를 이루자, 그는 그때부터 이미 그 민족들 앞에서 감당할 수 없는 존재가 되었는데, 이는 주님의 분노가 자비로 바뀌었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 민족들’은 문맥상 유대 주변의 비유대 민족들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος δὲ ὁ Μακκαβαῖος ἐν συστήματι
  english_pob_choice: had formed a band
  chosen_korean: 한 무리를 이루자
  alternatives_korean:
  - 무리를 이루자
  - 한 대오를 이루자
  - 조직된 부대를 이루자
  lexicon: LSJ
  rationale: ἐν συστήματι는 단순한 동반이 아니라 조직된 집단을 가리키므로, 군사적 규모를 과도하게 특정하지 않으면서도 ‘한 무리’로 묶어지는 형성을 자연스럽게 살렸습니다.
- source_word: ἀνυπόστατος
  english_pob_choice: irresistible
  chosen_korean: 감당할 수 없는 존재
  alternatives_korean:
  - 막을 수 없는 존재
  - 저항할 수 없는 존재
  - 당해 낼 수 없는 존재
  lexicon: LSJ
  rationale: ‘감당할 수 없다’는 뜻은 상대가 맞서 견딜 수 없다는 힘을 한국어로 자연스럽게 드러내며, 문맥의 전투적 긴장을 약화시키지 않습니다.
- source_word: τοῖς ἔθνεσιν
  english_pob_choice: for the nations
  chosen_korean: 그 민족들 앞에서
  alternatives_korean:
  - 그 나라들에 대해
  - 그 민족들에게
  - 이방 민족들에게
  lexicon: LSJ
  rationale: 여기서는 유대 주변의 비유대 집단들을 가리키는 일반 명칭이므로, NT의 기술적 용례를 덧씌우지 않고 문맥상 대립 관계를 드러내는 표현을 택했습니다.
- source_word: τῆς ὀργῆς τοῦ κυρίου ... εἰς ἔλεον τραπείσης
  english_pob_choice: because the wrath of the Lord had turned to mercy
  chosen_korean: 주님의 분노가 자비로 바뀌었기 때문입니다
  alternatives_korean:
  - 주님의 진노가 긍휼로 바뀌었기 때문입니다
  - 주님의 분노가 긍휼로 바뀌었기 때문입니다
  - 주님의 진노가 자비로 변했기 때문입니다
  lexicon: LSJ
  rationale: 원문의 대비는 심판의 정서가 자비로 전환되었다는 점이므로, ‘분노’와 ‘자비’의 직결을 유지해 신학적 긴장을 분명히 했습니다.
theological_decisions:
- issue: 주님의 분노가 자비로 바뀌었다는 인과 관계
  chosen_reading: 마카베오의 우세는 주님의 분노가 자비로 전환된 결과로 제시합니다.
  alternative_readings:
  - 단순한 감정 변화로 완화하기
  - 인과를 약화해 배경 설명 정도로 처리하기
  rationale: 그리스어 속격절은 전투적 성공의 이유를 하나님의 태도 변화에 직접 연결하므로, 그 신학적 주장 자체를 드러내되 과장 없이 현대 한국어로 옮겼습니다.
  doctrine_reference: 하나님의 심판과 자비의 긴장을 함께 보존
