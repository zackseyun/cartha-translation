  text: But when Maccabaeus had formed a band[a], he had by then become irresistible to the nations, because the wrath of the Lord had turned to mercy.
  footnotes:
  - marker: a
    text: Or 'for the Gentiles,' since the Greek term can denote the non-Jewish nations surrounding Judea.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 마카베오가 한 무리를 조직하고 나자, 그는 이미 그 민족들에게[a] 당해 낼 수 없는 존재가 되었습니다. 주님의 분노가 자비로 바뀌었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 민족들’은 문맥상 유대 주변의 비유대 민족들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος δὲ ὁ Μακκαβαῖος ἐν συστήματι
  english_pob_choice: had formed a band
  chosen_korean: 한 무리를 이루자
  alternatives_korean:
  - 무리를 이루자
  - 한 대오를 이루자
  - 조직된 부대를 이루자
  lexicon: LSJ
  rationale: ἐν συστήματι는 단순한 동반이 아니라 조직된 집단을 가리키므로, 군사적 규모를 과도하게 특정하지 않으면서도 ‘한 무리’로 묶어지는 형성을 자연스럽게 살렸습니다.
- source_word: ἀνυπόστατος
