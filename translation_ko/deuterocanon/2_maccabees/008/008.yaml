base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/008.yaml
  text: But when Philip saw that the man was gradually making progress and advancing all the more often in successes, he wrote to Ptolemy, the governor of Coele-Syria and Phoenicia, to come to the aid of the king’s cause.
  footnotes:
  - marker: a
    text: That is, Judas Maccabeus, the figure under discussion in the surrounding context.
    reason: cross_reference
  - marker: b
    text: Or 'the king’s interests' or 'the king’s affairs.' The Greek phrase can denote the royal cause more broadly than a single military action.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 빌립은 그 사람이 점차 발전해 가고 있었고, 성공 가운데서 더욱더 나아가고 있음을 보고, 코일레 시리아와 페니키아의 총독인 프톨레마이오스에게 왕의 일에 도움을 주러 오라고 편지를 보냈습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉, 앞뒤 문맥에서 논의되는 유다 마카베오입니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘왕의 이해관계’나 ‘왕의 사안들’로 옮길 수 있습니다. 그리스어 표현은 하나의 군사 작전보다 더 넓은 왕실의 대의를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνιδὼν
  english_pob_choice: when ... saw
  chosen_korean: 보고
  alternatives_korean:
  - 깨닫고
  - 알아보고
  lexicon: LSJ
  rationale: 행동의 계기가 되는 인지 동사를 자연스러운 현대 한국어로 옮기되, 단순한 ‘보다’보다 판단까지 포함하는 ‘보고’로 원인 관계를 살렸습니다.
- source_word: κατὰ μικρόν εἰς προκοπὴν ἐρχόμενον
  english_pob_choice: was gradually making progress
  chosen_korean: 점차 발전해 가고 있었고
  alternatives_korean:
  - 조금씩 전진해 가고 있었고
  - 서서히 진보하고 있었고
  lexicon: LSJ
  rationale: κατὰ μικρόν의 점진성을 살리면서, εἰς προκοπήν의 ‘앞으로 나아감/발전’ 의미를 한국어의 자연스러운 진행 표현으로 옮겼습니다.
- source_word: πυκνότερον δὲ ἐν ταῖς εὐημερίαις προβαίνοντα
  english_pob_choice: advancing all the more often in successes
  chosen_korean: 성공 가운데서 더욱더 나아가고 있음을
  alternatives_korean:
  - 성공 속에서 더욱 자주 진전하고 있음을
  - 성공이 거듭될수록 더욱 나아가고 있음을
  lexicon: LSJ
  rationale: πυκνότερον은 단순 빈도보다 증가하는 정도를 띠므로 ‘더욱더’로 반영했고, εὐημερίαις는 추상적 ‘형통’보다 전후 문맥에 맞는 ‘성공’으로 옮겼습니다.
- source_word: τοῖς τοῦ βασιλέως πράγματι
  english_pob_choice: the king’s cause
  chosen_korean: 왕의 일
  alternatives_korean:
  - 왕의 대의
  - 왕의 사건들
  - 왕의 일과
  lexicon: LSJ
  rationale: πρᾶγμα이 문맥상 왕의 행정적 ‘일’만이 아니라 왕권을 위한 전반적 사안들을 가리킬 수 있어, 보다 넓지만 과도하게 해석하지 않는 ‘왕의 일’을 택했습니다.
theological_decisions:
- issue: 전쟁·정치 문맥에서 πράγμα의 범위
  chosen_reading: ‘왕의 일’은 단일 작전보다 왕의 사안 전체를 가리키는 넓은 표현으로 유지했습니다.
  alternative_readings:
  - ‘왕의 대의’로 더 해석적으로 좁힐 수 있음
  - ‘왕의 일들’로 행정적 복수감을 줄 수 있음
  rationale: 영어 POB 주석처럼 그리스어 표현은 특정 군사 행동보다 왕의 이해관계와 사안을 넓게 가리킬 수 있으므로, 본문에서 그 폭을 보존하는 쪽이 안전합니다.
  doctrine_reference: 문맥적 의미 보존 원칙
- issue: 직함 στρατηγός의 한국어화
  chosen_reading: Ptolemy는 ‘총독’으로 옮겼습니다.
  alternative_readings:
  - 장군
  - 사령관
  rationale: 여기서는 군사 지휘관보다 코일레 시리아와 페니키아에 대한 행정적 권한을 띤 직함으로 읽히므로, 본문 기능을 드러내는 ‘총독’이 적절합니다.
  doctrine_reference: 역사-문맥적 직함 번역 원칙
