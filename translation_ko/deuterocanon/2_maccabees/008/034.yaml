theological_decisions:
- issue: τρισαλιτήριος의 저주-경멸 표현 강도
  chosen_reading: ‘삼중으로 저주받은’은 단순한 욕설이 아니라 도덕적·종교적 혐오를 담은 강한 저주 표현으로 처리했습니다.
  alternative_readings:
  - ‘지극히 사악한’
  - ‘극도로 더러운’
  - ‘삼중 저주를 받은’
  rationale: 원문의 τρις- 증강과 ἀλιτήριος의 저주적 뉘앙스를 함께 살리되, 한국어에서 너무 낡거나 난해한 직역을 피했습니다.
  doctrine_reference: 번역 원칙 §§1, 6
- issue: ‘유대인들’을 판매 대상으로 제시하는 서술
  chosen_reading: 본문의 역사적·서술적 적대감을 희석하지 않고 그대로 유지했습니다.
  alternative_readings:
  - ‘유대인들을 처분하기 위해’
  - ‘유대 백성을 팔기 위해’
  rationale: 원문은 포로화·매매의 폭력을 노골적으로 드러내므로, 그 긴장을 완화하지 않는 쪽이 본문에 더 충실합니다.
  doctrine_reference: 번역 원칙 §§2, 6
