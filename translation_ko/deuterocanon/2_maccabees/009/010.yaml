translation:
  language: ko
  text: 그리고 조금 전에는 하늘의 별들을 만질 수 있을 것처럼 보였던 그 사람조차도, 그 악취의 견딜 수 없는 무게 때문에 아무도 옮겨 갈 수 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘의 별들을 만질 수 있다고 생각했던’. 그리스어는 겉으로 드러난 고양 상태와 자기 과신 둘 다를 암시할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν ... δοκοῦντα
  english_pob_choice: the man who ... had seemed
  chosen_korean: 그 사람조차도
  alternatives_korean:
  - 그를
  - 그 사람을
  lexicon: LSJ
  rationale: 아티쿨라르 분사가 안티오코스를 가리키므로, 한국어에서는 자연스럽게 인칭 지시로 살리되 문맥상 강조를 위해 ‘그 사람조차도’로 처리했습니다.
- source_word: μικρῷ πρότερον
  english_pob_choice: a little earlier
  chosen_korean: 조금 전에는
  alternatives_korean:
  - 얼마 지나지 않아
  - 바로 얼마 전에는
  lexicon: LSJ
  rationale: 최근 과거를 가리키는 관용 표현이므로, 현대 한국어에서 자연스럽고 시간적 거리감이 유지되는 ‘조금 전에는’으로 옮겼습니다.
- source_word: τῶν οὐρανίων ἄστρων ἅπτεσθαι
  english_pob_choice: to touch the stars of heaven
  chosen_korean: 하늘의 별들을 만질 수 있을 것처럼 보였던
  alternatives_korean:
  - 하늘의 별들에 닿을 수 있을 것처럼 보였던
  - 하늘의 별들을 붙잡을 수 있을 듯했던
  lexicon: LSJ
  rationale: ἅπτεσθαι의 문자적 의미인 ‘만지다/닿다’를 살리면서도, δοκοῦντα와 함께 이루는 ‘겉보기의 과장된 높아짐’이라는 뉘앙스를 한국어에서 드러내기 위해 이렇게 옮겼습니다.
- source_word: διὰ τὸ τῆς ὀσμῆς ἀφόρητον βάρος
  english_pob_choice: because of the unbearable burden of the stench
  chosen_korean: 그 악취의 견딜 수 없는 무게 때문에
  alternatives_korean:
  - 그 악취의 감당할 수 없는 무게 때문에
  - 그 냄새의 견딜 수 없는 짐 때문에
  lexicon: LSJ
  rationale: βάρος를 단순히 ‘심함’으로 풀지 않고 ‘무게’로 살려, 악취가 실제로 짓누르는 듯한 감각적 표현을 유지했습니다. ὀσμή는 문맥상 부정적 의미가 강해 ‘악취’가 적절합니다.
theological_decisions:
- issue: δοκοῦντα + ἅπτεσθαι가 만드는 과장된 자기 고양의 뉘앙스
  chosen_reading: 겉으로는 하늘의 별들을 만질 수 있을 것처럼 보였던 상태를 가리키는 표현으로 유지했습니다.
  alternative_readings:
  - 자기 힘으로 별에 닿을 수 있다고 여겼다는 뜻으로 구체화
  - 단순히 높이 올라간 것으로 완화
  rationale: 그리스어는 실제 능력보다 ‘보였던/여겨졌던’ 고양 상태를 말할 수 있으므로, 그 긴장을 평탄화하지 않고 남겨 두었습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
