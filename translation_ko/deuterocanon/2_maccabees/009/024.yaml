  yaml_path: translation/deuterocanon/2_maccabees/009/024.yaml
  text: so that[a], if anything unexpected should happen and some difficulty should arise, those in the country, knowing to whom the affairs have been entrusted, may not be thrown into confusion;
  footnotes:
  - marker: a
    text: Or 'to whom matters have been left.' The Greek perfect passive can emphasize either simple leaving or formal entrusting of responsibility.
    reason: lexical_alternative
translation:
  language: ko
  text: 어떤 예상치 못한 일이 일어나고 어떤 어려움이 닥치더라도, 그 땅에 있는 사람들이 일이 누구에게 맡겨져 있는지를 알고 혼란에 빠지지 않도록 하려는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘맡겨져 있다’는 그리스어 완료 수동형을 책임이 위임되어 있는 상태로 이해한 번역입니다. 문맥에 따라 ‘남겨져 있다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  english_pob_choice: so that
  chosen_korean: 그래서 … 하려는 것입니다
  alternatives_korean:
  - 그리하여 … 하도록
  - ~하게 하려는 것입니다
  lexicon: LSJ
  rationale: 목적을 나타내는 연결을 한국어에서 자연스럽게 살리기 위해 ‘그래서 … 하려는 것입니다’로 옮겼습니다.
- source_word: ἐάν τι παράδοξον ἀποβῇ
  english_pob_choice: if anything unexpected should happen
  chosen_korean: 어떤 예상치 못한 일이 일어나고
  alternatives_korean:
  - 어떤 이상한 일이 생기고
  - 어떤 뜻밖의 일이 일어나고
  lexicon: LSJ
  rationale: παράδοξον은 ‘이상한’보다 ‘예상치 못한’이 문맥상 더 정확하게 전개의 돌발성을 드러냅니다.
- source_word: ᾧ καταλέλειπται τὰ πράγματα
  english_pob_choice: to whom the affairs have been entrusted
  chosen_korean: 그 일들이 누구에게 맡겨졌는지를
  alternatives_korean:
  - 그 일들이 누구에게 남겨졌는지를
  - 그 일들이 누구의 책임 아래 있는지를
  lexicon: LSJ
  rationale: 완료 수동형은 단순히 ‘남겨졌다’기보다 책임이 이전된 상태를 가리킬 수 있으므로, 영어 POB의 해석을 따라 ‘맡겨지다’로 번역했습니다.
- source_word: μὴ ἐπιταράσσωνται
  english_pob_choice: may not be thrown into confusion
  chosen_korean: 혼란에 빠지지 않게 하려는 것입니다
  alternatives_korean:
  - 뒤흔들리지 않게 하려는 것입니다
  - 혼동하지 않게 하려는 것입니다
  lexicon: LSJ
  rationale: ἐπιταράσσω의 강화된 동요·혼란을 한국어에서 가장 자연스럽게 전달하는 표현으로 ‘혼란에 빠지다’를 택했습니다.
