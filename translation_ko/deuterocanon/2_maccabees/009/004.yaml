base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/004.yaml
  text: But in his rage he thought to vent on the Jews the malice of those who had put him to flight. Therefore he ordered the charioteer[a], driving without stopping, to press on with the journey, while the judgment from heaven was accompanying him. For in his arrogance he had said, “When I arrive there, I will make Jerusalem a burial place of Jews.”
  footnotes:
  - marker: a
    text: Or “a mass grave of Jews.” The Greek Πολυάνδριον denotes a burial place for many dead.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그는 분노에 휩싸여, 자기를 도망치게 한 자들의 악의를 유대인들에게 퍼부으려 했습니다. 그러므로 그는 전차 마부에게 쉬지 않고 몰아 여정을 재촉하라고 명령했습니다. 그런데 하늘에서 내린 심판이 그와 동행하고 있었습니다. 그는 교만하게도 이렇게 말했습니다. “내가 այնտեղ에 도착하면 예루살렘을 유대인들의 매장지로 만들겠다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “유대인들의 집단무덤.” 그리스어 Πολυάνδριον은 많은 죽은 이를 위한 매장 장소를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαρθεὶς δὲ τῷ θυμῷ
  english_pob_choice: in his rage
  chosen_korean: 분노에 휩싸여
  alternatives_korean:
  - 분노로 들떠
  - 격분하여
  - 노기에 휩싸여
  lexicon: LSJ
  rationale: θυμός의 거센 분노를 자연스러운 현대 한국어로 살리되, 단순한 감정보다 사로잡힌 상태를 드러내기 위해 ‘휩싸여’를 택했습니다.
- source_word: τῶν πεφυγαδευκότων αὐτὸν κακίαν εἰς τοὺς Ἰουδαίους ἐναπερείσασθαι
  english_pob_choice: to vent on the Jews the malice of those who had put him to flight
  chosen_korean: 자기에게서 도망치게 한 이들의 악의를 유대인들에게 쏟아붓고자 했습니다
  alternatives_korean:
  - 자기를 도망치게 한 이들의 악의를 유대인들에게 풀고자 했습니다
  - 자기를 몰아낸 이들의 악의를 유대인들에게 퍼부으려 했습니다
  lexicon: LSJ
  rationale: κακία를 단순한 ‘악’보다 인물의 적대적 의도인 ‘악의’로 옮기고, ἐναπερείσασθαι의 전가·투사 뉘앙스를 ‘쏟아붓다’로 자연스럽게 표현했습니다.
- source_word: συνέταξεν τὸν ἁρματηλάτην
  english_pob_choice: he ordered the charioteer
  chosen_korean: 그는 마부에게
  alternatives_korean:
  - 그는 전차꾼에게
  - 그는 전차 몰이꾼에게
  lexicon: LSJ
  rationale: ἁρματηλάτης는 전차를 모는 사람을 가리키므로, 한국어에서는 독자가 즉시 이해할 수 있는 ‘마부’를 사용했습니다.
- source_word: ἀδιαλείπτως ἐλαύνοντα καταλύειν τὴν πορείαν
  english_pob_choice: driving without stopping, to press on with the journey
  chosen_korean: 쉬지 않고 몰아가며 길을 재촉하라고
  alternatives_korean:
  - 멈추지 말고 몰아가며 여정을 서두르라고
  - 끊임없이 달려가며 길을 서두르라고
  lexicon: LSJ
  rationale: ἀδιαλείπτως ἐλαύνοντα와 καταλύειν τὴν πορείαν을 합쳐, 이동을 중단 없이 계속하라는 압박을 ‘길을 재촉하다’로 압축해 전달했습니다.
- source_word: τῆς ἐξ οὐρανοῦ τῆς κρίσεως συνοδούσης αὐτῷ
  english_pob_choice: while the judgment from heaven was accompanying him
  chosen_korean: 하늘로부터의 심판이 그와 동행하고 있었습니다
  alternatives_korean:
  - 하늘의 심판이 그를 따르고 있었습니다
  - 하늘에서 온 심판이 그 곁에 함께 있었습니다
  lexicon: LSJ
  rationale: κρίσις는 단순한 처벌보다 법정적·신학적 의미가 있는 ‘심판’이 적절하며, συνοδούσης는 ‘동행하다’로 보존했습니다.
- source_word: Πολυάνδριον
  english_pob_choice: a burial place of Jews
  chosen_korean: 유대인의 무덤터
  alternatives_korean:
  - 유대인의 집단무덤
  - 유대인의 매장지
  - 유대인의 묘지
  lexicon: LSJ
  rationale: Πολυάνδριον은 많은 시신을 위한 매장 장소이므로, 위협의 성격을 살리면서도 직역에 치우치지 않도록 ‘무덤터’로 옮겼습니다.
theological_decisions:
- issue: 하늘로부터의 κρίσις의 인과성
  chosen_reading: 본문이 사건을 인간의 분노와 분리하지 않고, 동시에 하늘의 심판이 그를 따라가고 있다고 진술합니다.
  alternative_readings:
  - 단순히 재앙이 뒤따랐다고 완화할 수 있습니다
  - 문학적 표현으로만 처리할 수 있습니다
  rationale: 원문은 Antiochus의 주도적 악의와 하늘의 심판을 함께 제시하므로, 둘 중 하나로 환원하지 않고 긴장을 그대로 보존했습니다.
  doctrine_reference: Providence and judgment; source-language primacy over interpretive smoothing
