base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/012.yaml
  text: 'As his pains intensified from moment to moment[a], and he was not even able to endure his own stench, he said this: “It is right to submit to God[c][b], and for one who is mortal not to think proudly.”'
  footnotes:
  - marker: a
    text: Or “moment by moment” or “continually.”
    reason: lexical_alternative
  - marker: b
    text: Or “It is just” or “It is fitting” to submit to God.
    reason: lexical_alternative
  - marker: c
    text: Literally, “not, being mortal, to think proudly”; the sense is a general principle about human beings in their mortality.
    reason: lexical_alternative
translation:
  language: ko
  text: 고통이 순간마다 더 심해지고 자기 악취조차 견딜 수 없게 되자, 그는 이렇게 말했습니다. 「하나님께 복종하는 것이 옳으며, 죽을 수밖에 없는 사람이 교만한 생각을 품어서는 안 됩니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ στιγμὴν ἐπιτεινόμενος ταῖς ἀλγηδόσιν
  english_pob_choice: As his pains intensified from moment to moment
  chosen_korean: 고통이 순간마다 더 심해지고
  alternatives_korean:
  - 고통이 매 순간 더 심해지고
  - 고통이 순간마다 격해지고
  - 고통이 계속 더 심해지고
  lexicon: LSJ
  rationale: κατὰ στιγμὴν의 반복적 진행과 ἐπιτεινόμενος의 악화 의미를 자연스럽게 살려, 육체적 고통의 점증을 간결하게 드러냈습니다.
- source_word: τῆς ὀσμῆς αὐτοῦ
  english_pob_choice: his own stench
  chosen_korean: 자기 악취조차
  alternatives_korean:
  - 자기 냄새조차
  - 자기 몸 냄새조차
  - 자기 악취
  lexicon: LSJ
  rationale: ὀσμή는 중립적으로는 ‘냄새’이지만, 문맥상 병든 몸에서 나는 역겨운 냄새이므로 ‘악취’가 장면의 강도를 더 정확히 반영합니다.
- source_word: ὑποτάσσεσθαι τῷ θεῷ
  english_pob_choice: to submit to God
  chosen_korean: 하나님께 순복하는 것이
  alternatives_korean:
  - 하나님께 복종하는 것이
  - 하나님께 굴복하는 것이
  - 하나님께 자신을 맡기는 것이
  lexicon: LSJ
  rationale: ὑποτάσσεσθαι는 자신을 아래에 두고 권위에 복종하는 뜻이므로, 교회적이면서도 원문 힘을 살리는 ‘순복하다’를 택했습니다.
- source_word: ὑπερήφανα φρονεῖν
  english_pob_choice: to think proudly
  chosen_korean: 교만하게 생각해서는 안 됩니다
  alternatives_korean:
  - 거만하게 생각해서는 안 됩니다
  - 오만하게 생각해서는 안 됩니다
  - 자랑스럽게 생각해서는 안 됩니다
  lexicon: LSJ
  rationale: φρονεῖν의 ‘생각하다/마음에 품다’와 ὑπερήφανα의 ‘교만하게’를 함께 살려, 행위보다 사고방식 자체를 경계하는 표현으로 옮겼습니다.
theological_decisions:
- issue: μηδὲ θνητὸν ὄντα의 일반적 인간 진술
  chosen_reading: 죽을 수밖에 없는 사람이 교만하게 생각해서는 안 됩니다
  alternative_readings:
  - 죽을 수밖에 없는 존재가 교만하게 생각해서는 안 됩니다
  - 죽을 수밖에 없는 인간이 교만하게 생각해서는 안 됩니다
  rationale: 원문은 특정 개인보다 인간 일반의 유한성을 말하는 표현이므로, 보편적 경구로 읽히도록 ‘죽을 수밖에 없는 사람’으로 옮겼습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
