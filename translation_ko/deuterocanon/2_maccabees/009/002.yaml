base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/002.yaml
  text: For he had entered the so-called Persepolis and attempted to rob the temple and seize control of the city[a]; therefore, when the crowds rushed to arms, they turned him back, and it happened that Antiochus, put to flight by the local inhabitants[b], made a shameful retreat.
  footnotes:
  - marker: a
    text: Or 'attempted sacrilegious plunder of the temple.' The Greek verb ἱεροσυλεῖν specifically refers to robbing a sacred place.
    reason: lexical_alternative
  - marker: b
    text: Literally 'to the help of weapons,' that is, they resorted to armed defense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 이른바 페르세폴리스에 이미 들어가 성전을 약탈하고 그 도시를 장악하려고 시도하였습니다[a]. 그러므로 무리들이 몰려들어 무기를 들고 방어에 나섰으며[b], 안티오코스는 그곳 주민들에게 패하여 수치스럽게 퇴각하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성소를 신성모독적으로 약탈하려고’로 옮길 수 있습니다. 그리스어 ἱεροσυλεῖν은 성스러운 장소를 약탈하는 행위를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘무기의 도움을 향하여’입니다. 곧 무기를 들고 방어에 의지했다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσεληλύθει
  english_pob_choice: had entered
  chosen_korean: 들어가
  alternatives_korean:
  - 들어와
  - 들어간
  lexicon: LSJ
  rationale: 선행 완료의 배경 동작을 한국어에서는 과거 서술로 자연스럽게 옮기되, 다음 절의 시도와 분리되도록 단순한 서술형을 택했습니다.
- source_word: τὴν λεγομένην Περσέπολιν
  english_pob_choice: the so-called Persepolis
  chosen_korean: 이른바 페르세폴리스
  alternatives_korean:
  - 소위 페르세폴리스
  - 일컬어지는 페르세폴리스
  lexicon: LSJ
  rationale: λεγόμενη를 드러내기 위해 ‘이른바’를 사용했고, 고유명사는 현대 표기 ‘페르세폴리스’로 옮겼습니다.
- source_word: ἱεροσυλεῖν
  english_pob_choice: to rob the temple
  chosen_korean: 성전을 약탈하고
  alternatives_korean:
  - 성전을 훔치고
  - 성전의 물건을 약탈하고
  - 성전을 모독하며 약탈하고
  lexicon: LSJ
  rationale: ἱεροσυλέω의 핵심은 성소에 대한 약탈이므로 ‘성전을 약탈하다’로 직역성 있게 옮기되, 한국어 문맥상 동사형을 자연스럽게 맞췄습니다.
- source_word: συνέχειν
  english_pob_choice: seize control of
  chosen_korean: 장악하려고
  alternatives_korean:
  - 점령하려고
  - 지배하려고
  - 붙들려고
  lexicon: LSJ
  rationale: 도시와 결합한 군사·정치적 문맥에서 단순한 ‘붙잡다’보다 ‘장악하다’가 통제 획득의 의미를 더 정확히 드러냅니다.
- source_word: ἐπὶ τὴν τῶν ὅπλων βοήθειαν ἐτράπησαν
  english_pob_choice: they turned to the defense of arms
  chosen_korean: 무장한 방어에 나서자
  alternatives_korean:
  - 무장 방어를 위해 돌아서자
  - 무기의 도움을 받기 위해 나서자
  - 무장하여 방어에 나서자
  lexicon: LSJ
  rationale: 직역하면 어색한 관용구이므로, ‘무기의 도움’이라는 뜻을 살리면서도 한국어로는 ‘무장한 방어에 나서다’로 풀어 의미를 분명히 했습니다.
- source_word: τροπωθέντα … αἰσχύμονα τὴν ἀναζυγὴν ποιήσασθαι
  english_pob_choice: made a shameful retreat
  chosen_korean: 수치스러운 퇴각을 하게 되었습니다
  alternatives_korean:
  - 수치스럽게 퇴각하였습니다
  - 부끄러운 철수를 하게 되었습니다
  - 수치스럽게 물러났습니다
  lexicon: LSJ
  rationale: ἀναζυγή는 철수/퇴각의 뉘앙스를 가지므로 ‘퇴각’으로 옮기고, αἰσχύμονα의 수치성을 덧붙였습니다.
theological_decisions:
- issue: 폭력적 방어를 뜻하는 ἐπὶ τὴν τῶν ὅπλων βοήθειαν의 처리
  chosen_reading: 무장한 방어에 나서자
  alternative_readings:
  - 무기의 도움으로
  - 무장 방어를 위해
  - 무기를 들고 맞서자
  rationale: 본문은 군중이 실제 무장 대응에 들어갔다는 뜻이므로, 완곡화하지 않고 방어적 무력 사용을 분명히 드러냈습니다.
  doctrine_reference: source-facing historical narrative; no doctrinal harmonization
- issue: ἱεροσυλεῖν의 성전 모독/약탈 긴장
  chosen_reading: 성전을 약탈하고
  alternative_readings:
  - 성전을 모독하며 약탈하고
  - 성전의 물건을 훔치고
  - 성소를 약탈하고
  rationale: 영문 POB가 지적한 것처럼 핵심은 ‘성전 약탈’이며, 본문이 말하는 성스러운 공간 침해를 약화시키지 않기 위해 직접적으로 옮겼습니다.
  doctrine_reference: lexical-theological tension in sacred space terminology
