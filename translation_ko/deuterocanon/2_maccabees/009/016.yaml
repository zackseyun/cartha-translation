  yaml_path: translation/deuterocanon/2_maccabees/009/016.yaml
  text: And the holy temple[a], which he had formerly plundered, he would adorn with the finest votive offerings, and he would restore all the sacred vessels many times over, and from his own revenues he would provide the expenses required for the sacrifices[b];
  footnotes:
  - marker: a
    text: Or 'with the most splendid votive gifts.' The Greek term can refer specifically to dedicated offerings placed in a sanctuary.
    reason: lexical_alternative
  - marker: b
    text: Literally 'he would give back all the sacred vessels many times over,' expressing repayment in multiplied measure, not mere replacement.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 전에 약탈했던 그 거룩한 성전을 가장 아름다운 봉헌물로[a] 장식하고, 모든 성전 기물을 여러 배로 갚아 주고[b], 자신의 수입으로 제사에 드는 비용을 충당하겠다고 약속하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가장 빼어난 봉헌물로’. ἀναθήματα는 성소에 바쳐 둔 헌물을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘모든 성전 기물을 여러 배로 갚아 주겠다’입니다. 이는 단순히 대체하는 것이 아니라 여러 배로 배상하겠다는 뜻입니다.
    reason: lexical_alternative
