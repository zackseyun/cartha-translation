  source_fidelity: 그리스어의 핵심 의미는 대체로 충실합니다. 다만 πολυπλάσια πάντα ἀποδώσειν은 단순 반환을 넘어 여러 배로 갚는 배상/보상의 뜻이므로, ‘여러 배로 되돌려 주며’보다 이를 한국어에서 더 분명히 드러내는 편이 좋습니다. χορηγήσειν의 재정 제공 의미와 ἐκ τῶν ἰδίων προσόδων의 ‘자신의 수입에서’라는 뜻도 유지했습니다.
  naturalness: ‘거룩한 기구’와 ‘여러 배로 되돌려 주며’는 현대 표준 한국어에서 다소 어색하거나 의미 관계가 불분명합니다. ‘성전 기물’ 및 ‘여러 배로 갚아 주고’가 제의 문맥과 배상 의미를 자연스럽게 전달합니다. 또한 두 각주는 해당 어구 바로 뒤에 붙여야 독자가 각주의 대상을 혼동하지 않습니다.
  terminology: ναός는 ‘거룩한 성전’, ἀναθήματα는 ‘봉헌물’, ἱερὰ σκεύη는 ‘성전 기물’, θυσίαι는 ‘제사’로 옮겼습니다. ‘성전 기물’은 문맥상 성전에서 쓰이는 성스러운 기구라는 의미를 자연스럽게 보존합니다.
