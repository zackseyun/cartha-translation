  - ‘부패’만 남기고 악취 이미지를 약화
  rationale: 이 절은 단순한 생물학적 분해가 아니라 신적 심판의 수치를 드러내는 서술이므로, 원문의 강한 감각적 충격을 유지하는 것이 본문의 의도에 더 가깝습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve rhetorical force.'
