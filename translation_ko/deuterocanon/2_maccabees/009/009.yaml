translation:
  language: ko
  text: 그리하여 경건하지 않은 사람의 몸에서조차 벌레들이 솟아나고, 그가 아직 살아 있는 동안 고통과 심한 아픔 속에서 그의 살점이 떨어져 나갔으며, 그의 악취 때문에 온 군대가 썩은 냄새에 짓눌렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘벌레들이 끓어오르다’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: ὀδύναις καὶ ἀλγηδόσιν은 고통과 극심한 괴로움을 함께 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δυσσεβοῦς
  english_pob_choice: ungodly man
  chosen_korean: 경건하지 않은 사람
  alternatives_korean:
  - 불경한 사람
  - 악한 사람
  lexicon: LSJ
  rationale: δυσσεβής는 단순한 도덕적 악보다 하나님을 향한 불경건을 가리키므로, 그 방향성을 살리면서도 현대 한국어에서 자연스러운 표현을 택했습니다.
- source_word: σκώληκας ἀναζεῖν
  english_pob_choice: worms swarmed
  chosen_korean: 벌레들이 솟아나고
  alternatives_korean:
  - 벌레들이 끓어오르고
  - 벌레들이 우글거리며 나오고
  lexicon: LSJ
  rationale: ἀναζέω는 문자적으로는 ‘끓어오르다/솟아오르다’에 가깝지만, 시신에서 벌레가 나오는 섬뜩한 장면을 한국어로 가장 자연스럽게 살리기 위해 ‘솟아나고’로 옮겼습니다.
- source_word: ζῶντος ἐν ὀδύναις καὶ ἀλγηδόσιν
  english_pob_choice: while he was still alive, in pains and agonies
  chosen_korean: 그가 아직 살아 있는 동안 고통과 심한 아픔 속에서
  alternatives_korean:
  - 살아 있는 동안 고통과 괴로움 속에서
  - 그가 살아 있으면서 고통과 아픔 가운데
  lexicon: LSJ
  rationale: 생존 상태가 이미 부패와 분해가 진행 중이었음을 드러내기 위해 ‘아직 살아 있는 동안’을 분명히 하고, ὀδύναις/ἀλγηδόσιν의 중첩된 강도를 ‘고통과 심한 아픔’으로 반영했습니다.
- source_word: τὴν σαπρίαν
  english_pob_choice: the rottenness
  chosen_korean: 썩은 냄새
  alternatives_korean:
  - 부패
  - 썩음
  - 썩은 내
  lexicon: LSJ
  rationale: σαπρία는 ‘부패/썩음’의 상태를 뜻하지만, 바로 앞의 ὀσμή(악취)와 함께 군대가 그 부패한 상태에 압도되는 장면이므로 한국어에서는 감각적으로 드러나는 ‘썩은 냄새’로 풀었습니다.
