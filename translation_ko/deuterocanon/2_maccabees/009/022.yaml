lexical_decisions:
- source_word: οὐκ ἀπογινώσκων
  english_pob_choice: not despairing
  chosen_korean: 절망하지 않고
  alternatives_korean:
  - 낙심하지 않고
  - 희망을 잃지 않고
  - 절망에 빠지지 않고
  lexicon: LSJ
  rationale: ἀπογινώσκων은 여기서 자신의 처지를 두고 희망을 버리지 않는다는 뜻이므로, 자연스러운 현대 한국어로는 ‘절망하지 않고’가 가장 간결하고 의미를 잘 살립니다.
- source_word: τὰ κατʼ ἐμαυτόν
  english_pob_choice: my condition
  chosen_korean: 자기 상태에 대해
  alternatives_korean:
  - 내 처지에 대해
  - 내 사정에 대해
  - 나의 형편에 대해
  lexicon: LSJ
  rationale: 이 관용구는 자신에게 관련된 사정 전반을 가리키며, 병세 맥락에서는 ‘자기 상태’가 직설적이면서도 과도하게 해석을 덧붙이지 않습니다.
- source_word: ἔχων πολλὴν ἐλπίδα
  english_pob_choice: having great hope
  chosen_korean: 큰 희망을 품고
  alternatives_korean:
  - 많은 희망을 가지고
  - 매우 희망하면서
  - 큰 소망을 가지고
  lexicon: LSJ
  rationale: πολλήν의 강세를 살리면서 한국어로는 ‘희망을 품고’가 가장 자연스럽고, 앞절의 부정과 대비도 분명하게 드러냅니다.
- source_word: ἐκφεύξεσθαι τὴν ἀσθένειαν
  english_pob_choice: that I will escape the sickness
  chosen_korean: 내가 이 병을 벗어날 것이라는
  alternatives_korean:
  - 내가 이 병에서 빠져나올 것이라는
  - 내가 이 병을 피할 것이라는
  - 내가 이 병에서 벗어날 것이라는
  lexicon: LSJ
  rationale: 미래 중간 부정사의 기대를 한국어 종속절로 풀어, 질병에서의 ‘탈출/벗어남’이라는 뜻을 보존하되 문장을 읽기 쉽게 다듬었습니다.
