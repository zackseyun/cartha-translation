  source_fidelity: 그리스어의 τὰ κατὰ Νικάνορα καὶ τοὺς περὶ Τιμόθεον γεγονότα는 니카노르 및 티모테오스와 그 일행에 ‘관한/관련된 일들’을 가리킵니다. 현행 본문의 ‘니카노르와 티모테오스와 함께한 사람들에게 일어난 일’은 뜻상 가능하지만, τὰ κατά의 ‘관련된 일’이라는 관용적 범위를 ‘그들에게 일어난 일’로 다소 좁힙니다. 또한 κατʼ Ἐκβάτανα에 대해 ‘근처에’라고 하면 가능한 의미 가운데 하나를 본문에서 특정하게 됩니다.
