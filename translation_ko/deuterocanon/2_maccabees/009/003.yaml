translation:
  language: ko
  text: 그가 에크바타나에 있을 때[a], 니카노르와 티모테오스 일행에게 무슨 일이 일어났는지에 대한 소식이 그에게 전해졌습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘에크바타나 일대에’. 그리스어 구절 κατʼ Ἐκβάτανα는 에크바타나 자체나 그 주변 지역을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면, ‘니카노르와 티모테오스 일행에 관하여 일어난 일들’입니다. ‘티모테오스 일행’은 티모테오스와 그를 따르거나 함께 있던 사람들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄντι δὲ αὐτῷ
  english_pob_choice: while he was
  chosen_korean: 그가 … 있을 때
  alternatives_korean:
  - 그가 … 있었을 때
  - …하는 동안
  lexicon: LSJ
  rationale: 분사구문을 한국어 시간 부사절로 자연스럽게 옮겨, 장면의 배경 상황을 매끄럽게 드러냈습니다.
- source_word: κατʼ Ἐκβάτανα
  english_pob_choice: at Ecbatana
  chosen_korean: 에크바타나 근처에
  alternatives_korean:
  - 에크바타나에서
  - 에크바타나 지역에
  lexicon: LSJ
  rationale: κατά + 지명은 그 주변/일대의 뜻을 가질 수 있으므로, 본문 주석의 유보를 반영해 ‘근처에’로 옮겼습니다.
- source_word: προσεπέσε
  english_pob_choice: news came to him
  chosen_korean: 소식이 그에게 전해졌습니다
  alternatives_korean:
  - 소식이 그에게 찾아왔습니다
  - 그에게 소식이 닥쳤습니다
  lexicon: LSJ
  rationale: 직역적 ‘떨어졌다/닥쳤다’의 급작스러움은 유지하되, 한국어에서는 보고의 유입을 나타내는 표현이 가장 자연스럽습니다.
- source_word: τὰ κατὰ Νικάνορα ... γεγονότα
  english_pob_choice: what had happened to Nicanor
  chosen_korean: 니카노르와 … 일어난 일
  alternatives_korean:
  - 니카노르에 관해 일어난 일
  - 니카노르에게 일어난 일
  lexicon: LSJ
  rationale: τὰ κατά + 대격은 ‘…에 관한 일’의 관용구이므로, 사건의 주체적 관련성을 살려 ‘니카노르와 … 일어난 일’로 옮겼습니다.
- source_word: τοὺς περὶ Τιμόθεον
  english_pob_choice: those with Timothy
  chosen_korean: 티모테오스와 함께한 사람들
  alternatives_korean:
  - 티모테오스 주변의 사람들
  - 티모테오스의 일행
  lexicon: LSJ
  rationale: περὶ + 인명은 그 사람과 동행자/무리를 가리키므로, 군사적 뉘앙스를 과도하게 덧붙이지 않는 범위에서 ‘함께한 사람들’로 풀었습니다.
theological_decisions:
- issue: 사건 전달의 돌발성
  chosen_reading: ‘소식이 그에게 전해졌습니다’로 하여, πληροφορία의 갑작스러운 유입을 살리면서도 문체는 현대 한국어로 정리했습니다.
  alternative_readings:
  - ‘소식이 그에게 닥쳤습니다’
