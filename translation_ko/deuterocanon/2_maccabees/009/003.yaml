  text: But while he was at Ecbatana[b][a], news came to him of what had happened to Nicanor and those with Timothy.
  footnotes:
  - marker: a
    text: Or, 'at Ecbatana.' The Greek phrase κατʼ Ἐκβάτανα may denote location at or in the region of Ecbatana.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the things concerning Nicanor and those around Timothy that had happened.'
