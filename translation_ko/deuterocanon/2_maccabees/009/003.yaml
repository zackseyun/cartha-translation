translation:
  language: ko
  text: 그가 에크바타나 근처에 있을 때, 니카노르와 티모테오스와 함께한 사람들에게 일어난 일에 대한 소식이 그에게 전해졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘에크바타나에서’. 그리스어 구절 κατʼ Ἐκβάτανα는 에크바타나에 있거나 그 일대를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면, ‘니카노르와 티모테오스 둘레에 있던 사람들에게 일어난 일들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄντι δὲ αὐτῷ
  english_pob_choice: while he was
  chosen_korean: 그가 … 있을 때
  alternatives_korean:
  - 그가 … 있었을 때
  - …하는 동안
  lexicon: LSJ
  rationale: 분사구문을 한국어 시간 부사절로 자연스럽게 옮겨, 장면의 배경 상황을 매끄럽게 드러냈습니다.
- source_word: κατʼ Ἐκβάτανα
  english_pob_choice: at Ecbatana
  chosen_korean: 에크바타나 근처에
  alternatives_korean:
  - 에크바타나에서
  - 에크바타나 지역에
  lexicon: LSJ
  rationale: κατά + 지명은 그 주변/일대의 뜻을 가질 수 있으므로, 본문 주석의 유보를 반영해 ‘근처에’로 옮겼습니다.
- source_word: προσεπέσε
  english_pob_choice: news came to him
  chosen_korean: 소식이 그에게 전해졌습니다
  alternatives_korean:
  - 소식이 그에게 찾아왔습니다
  - 그에게 소식이 닥쳤습니다
  lexicon: LSJ
  rationale: 직역적 ‘떨어졌다/닥쳤다’의 급작스러움은 유지하되, 한국어에서는 보고의 유입을 나타내는 표현이 가장 자연스럽습니다.
- source_word: τὰ κατὰ Νικάνορα ... γεγονότα
  english_pob_choice: what had happened to Nicanor
  chosen_korean: 니카노르와 … 일어난 일
  alternatives_korean:
  - 니카노르에 관해 일어난 일
  - 니카노르에게 일어난 일
  lexicon: LSJ
  rationale: τὰ κατά + 대격은 ‘…에 관한 일’의 관용구이므로, 사건의 주체적 관련성을 살려 ‘니카노르와 … 일어난 일’로 옮겼습니다.
- source_word: τοὺς περὶ Τιμόθεον
  english_pob_choice: those with Timothy
  chosen_korean: 티모테오스와 함께한 사람들
  alternatives_korean:
  - 티모테오스 주변의 사람들
  - 티모테오스의 일행
  lexicon: LSJ
  rationale: περὶ + 인명은 그 사람과 동행자/무리를 가리키므로, 군사적 뉘앙스를 과도하게 덧붙이지 않는 범위에서 ‘함께한 사람들’로 풀었습니다.
theological_decisions:
- issue: 사건 전달의 돌발성
  chosen_reading: ‘소식이 그에게 전해졌습니다’로 하여, πληροφορία의 갑작스러운 유입을 살리면서도 문체는 현대 한국어로 정리했습니다.
  alternative_readings:
  - ‘소식이 그에게 닥쳤습니다’
  - ‘그에게 소식이 왔습니다’
  rationale: 이 절은 신학적 쟁점보다 서사적 긴장감이 핵심이므로, 원문의 급작스러움을 과장하지 않는 선에서 전달성을 우선했습니다.
  doctrine_reference: 서사 문맥의 전달 방식
- issue: 지명 표기와 주석 처리
  chosen_reading: ‘에크바타나 근처에’로 옮겨, 본문의 위치 진술이 절대적 단정이 아니라 주변 지역을 포함할 수 있음을 드러냈습니다.
  alternative_readings:
  - ‘에크바타나에서’
  - ‘에크바타나 지역에’
  rationale: 영어 POB 주석이 κατʼ Ἐκβάτανα의 범위를 유보적으로 설명하므로, 한국어 본문에서도 같은 유보를 반영하는 것이 해석적으로 더 정직합니다.
  doctrine_reference: 텍스트 비평/주해상의 지리 표현
