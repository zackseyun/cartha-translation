base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/018.yaml
  text: 'But when his pains had somewhat let up[a], for the just judgment of God had come upon him, and when he recognized his own condition, he wrote to the Jews the letter written below, having the character of a petition[c][b], and reading as follows:'
  footnotes:
  - marker: a
    text: Or 'when his pains were somewhat subsiding.' The rare adverb ἰουδαϊσμῶς is difficult; the sense is that the pains had eased to some extent, not that they had ended.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'having recognized the things concerning himself.'
    reason: lexical_alternative
  - marker: c
    text: Or 'having the form of a supplication.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 고통이 다소 누그러졌을 때[a], 이는 하나님의 의로운 심판이 이미 그에게 임하였기 때문이었습니다. 그는 자기 처지를 깨닫고 유대인들에게 아래에 적은, 청원의 형식을 갖춘 편지를 썼습니다. 그 내용은 다음과 같습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 고통이 다소 가라앉고 있었을 때”라고 옮길 수 있습니다. 희귀한 부사 ἰουδαϊσμῶς의 정확한 뉘앙스는 확실하지 않지만, 고통이 완전히 끝났다는 뜻은 아닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰουδαϊσμῶς δὲ ληγόντων τῶν πόνων
  english_pob_choice: his pains had somewhat let up
  chosen_korean: 그의 고통이 다소 누그러졌으나
  alternatives_korean:
  - 그의 고통이 조금씩 가라앉았으나
  - 그의 고통이 다소 멎어 가고 있었으나
  lexicon: LSJ
  rationale: 희귀한 ἰουδαϊσμῶς의 정확한 뉘앙스는 단정하기 어려우므로, POB의 'somewhat let up'에 맞게 고통이 완전히 끝난 것은 아니고 다소 완화되었음을 자연스럽게 살렸습니다.
- source_word: δικαία ἡ τοῦ θεοῦ κρίσις
  english_pob_choice: the just judgment of God
  chosen_korean: 하나님의 의로운 심판
  alternatives_korean:
  - 하나님의 공의로운 심판
  - 하나님의 의로운 판결
  lexicon: LSJ
  rationale: κρίσις는 단순한 처벌이 아니라 사법적 '심판'이며, δικαία는 그 심판의 정당성을 가리키므로 '의로운 심판'으로 옮겨 원문의 신학적 진술을 분명히 했습니다.
- source_word: τὰ κατʼ αὐτὸν ἐπιγνούς
  english_pob_choice: when he recognized his own condition
  chosen_korean: 그는 자기에게 닥친 일을 깨닫고
  alternatives_korean:
  - 자기 처지를 깨닫고
  - 자기에게 일어난 일을 알아차리고
  lexicon: LSJ
  rationale: 직역하면 '자기에 관한 것들을 알아차리고'이지만, 문맥상 자신이 어떤 심판 아래 놓였는지를 깨닫는 뜻이므로 '자기에게 닥친 일'로 풀어 자연스럽게 표현했습니다.
- source_word: ἱκετηρίας τάξιν
  english_pob_choice: having the character of a petition
  chosen_korean: 간구의 형식을 띤
  alternatives_korean:
  - 간청의 성격을 지닌
  - 청원문의 형식을 띤
  lexicon: LSJ
  rationale: ἱκετηρία는 간구/탄원의 의미이고 τάξις는 형식·체재를 뜻하므로, 편지가 '간구의 형식'을 띤다는 점을 간결하게 살렸습니다.
theological_decisions:
- issue: Antiochus의 고통을 하나님의 심판으로 분명히 말할지 여부
  chosen_reading: 고통이 누그러졌다는 서술과 동시에, 그 원인이 '하나님의 의로운 심판'이 임한 데 있음을 분명히 드러냈습니다.
  alternative_readings:
  - 고통이 단순히 덜해졌다고만 옮겨 원인을 약화시키는 방식
  - 심판의 인과를 덜 노출하는 완곡한 표현
  rationale: 원문은 그의 상태를 우연한 병세 변화가 아니라 하나님의 심판과 직접 연결하므로, 그 신학적 인과를 약화하지 않고 그대로 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
