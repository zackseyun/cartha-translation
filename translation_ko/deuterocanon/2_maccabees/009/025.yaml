base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/025.yaml
  text: Moreover[a], considering the rulers nearby and those bordering the kingdom, who are watching for opportunities and awaiting what will happen, I have appointed my son Antiochus as king, whom, when I repeatedly went up to the upper satrapies, I often entrusted and commended to most of you[b]. And I have written to him the things written below.
  footnotes:
  - marker: a
    text: Or 'the neighboring rulers and those adjacent to the kingdom.' The Greek piles up overlapping geopolitical descriptions to stress surrounding powers.
    reason: lexical_alternative
  - marker: b
    text: '''Upper satrapies'' uses the Persian administrative term found in the Greek; it may refer broadly to the inland/eastern provinces rather than merely ''provinces'' in general.'
    reason: cultural_note
translation:
  language: ko
  text: 또한 나는 주변의 통치자들[a]과 왕국에 인접한 이들이 기회를 엿보며 앞으로 어떻게 될지를 기다리고 있음을 고려하여, 내 아들 안티오코스를 왕으로 임명하였습니다. 내가 여러 차례 상부 사트라피들[b]로 올라갈 때에는 여러분 대부분에게 그를 맡기고 추천하곤 하였습니다. 그리고 나는 그에게 아래에 기록한 내용을 써 보냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘통치자들’은 그리스어 δυνάστας를 따른 번역입니다. 여기서는 추상적인 ‘세력’보다 주변의 정치적 권력자들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘상부 사트라피들’은 그리스어 ἄνω σατραπίας를 살린 표현입니다. ‘사트라피’는 페르시아 행정 구역을 가리키는 말로, 단순한 ‘지방’보다 구체적입니다.
    reason: cultural_note
lexical_decisions:
- source_word: πρὸς δὲ τούτοις
  english_pob_choice: Moreover
  chosen_korean: 그와 더불어
  alternatives_korean:
  - 또한
  - 더구나
  lexicon: LSJ
  rationale: 앞절에 이어지는 추가 설명임을 살리면서, 단순 접속보다 문맥 전개를 자연스럽게 잇는 표현으로 옮겼습니다.
- source_word: κατανοῶν
  english_pob_choice: considering
  chosen_korean: 헤아려 보면서
  alternatives_korean:
  - 고려하면서
  - 살피면서
  lexicon: LSJ
  rationale: 단순한 시각적 관찰보다 상황을 숙고해 판단하는 뉘앙스를 살리기 위해 선택했습니다.
- source_word: τοὺς παρακειμένους δυνάστας καὶ γειτνιῶντας τῆς βασιλείας
  english_pob_choice: the rulers nearby and those bordering the kingdom
  chosen_korean: 가까이 있는 통치자들과 왕국의 경계에 있는 자들
  alternatives_korean:
  - 주변의 통치자들과 왕국에 인접한 자들
  - 가까운 제후들과 왕국과 맞닿은 자들
  lexicon: LSJ
  rationale: δυνάστας는 단순한 추상적 '세력'보다 정치적 통치자를 가리키므로 '통치자들'로 옮겼고, παρακειμένους/γειτνιῶντας의 겹침은 공간적으로 압박하는 주변성을 살려 표현했습니다.
- source_word: τοῖς καιροῖς ἐπέχοντας καὶ προσδοκῶντας τὸ ἀποβησόμενον
  english_pob_choice: who are watching for opportunities and awaiting what will happen
  chosen_korean: 기회를 엿보며 일어날 일을 기다리는 자들
  alternatives_korean:
  - 때를 엿보며 무슨 일이 일어날지 기다리는 자들
  - 기회를 노리며 결과를 기다리는 자들
  lexicon: LSJ
  rationale: καιροῖς는 단순한 시간보다 '때/기회'의 의미가 강하고, 전체 구절은 정치적 기회주의를 드러내므로 그 뉘앙스를 한국어로 압축해 살렸습니다.
- source_word: ἀναδέδειχα
  english_pob_choice: I have appointed
  chosen_korean: 임명하였습니다
  alternatives_korean:
  - 지명하였습니다
  - 세웠습니다
  lexicon: LSJ
  rationale: 왕위 계승 맥락에서 공식적 임명/지정을 뜻하므로, 행정적·왕정적 뉘앙스가 분명한 '임명하다'를 택했습니다.
- source_word: ἀνατρέχων εἰς τὰς ἄνω σατραπίας
  english_pob_choice: when I repeatedly went up to the upper satrapies
  chosen_korean: 여러 차례 위쪽 사트라피아들로 올라갈 때
  alternatives_korean:
  - 여러 차례 상부 사트라피아들로 올라갈 때
  - 거듭 위쪽 속주들로 올라갈 때
  lexicon: LSJ
  rationale: σατραπίας는 페르시아 행정 용어를 살려 '사트라피아들'로 두었고, ἄνω는 문자적으로 '위쪽'을 유지해 지리·행정적 구분을 보존했습니다.
- source_word: παρεκατετίθεμην καὶ συνίστων
  english_pob_choice: I often entrusted and commended
  chosen_korean: 자주 맡기고 추천하기도 하였습니다
  alternatives_korean:
  - 자주 맡기고 천거하기도 하였습니다
  - 자주 부탁하고 추천하기도 하였습니다
  lexicon: LSJ
  rationale: παρεκατετίθεμην은 보호 아래 맡기는 뜻이고, συνίστων은 공식적으로 천거/추천하는 뜻이므로 두 동작을 구별해 반영했습니다.
- source_word: τὰ ὑπογεγραμμένα
  english_pob_choice: the things written below
  chosen_korean: 아래에 적을 내용
  alternatives_korean:
  - 아래에 적힌 것들
  - 뒤에 적힌 내용
  lexicon: LSJ
  rationale: 문서 형식의 종결 예고를 자연스러운 한국어로 옮기되, 뒤에 이어질 본문을 가리키는 문서적 느낌을 유지했습니다.
theological_decisions:
- issue: 왕권을 표현하는 공식 직책 언어
  chosen_reading: '''왕으로 임명하였습니다''로 옮겨, 혈연과 함께 제도적 왕위 계승의 공식성을 드러냈습니다.'
  alternative_readings:
  - '''왕으로 세웠습니다'''
  - '''왕으로 정하였습니다'''
  rationale: 본문은 단순한 칭호 부여가 아니라 정치적·왕정적 절차를 말하므로, 공식 임명의 성격을 살리는 표현이 적절합니다.
  doctrine_reference: 성경 본문의 역사 서술은 정치적 실재를 있는 그대로 전달해야 하며, 과도한 완곡어법은 피합니다.
