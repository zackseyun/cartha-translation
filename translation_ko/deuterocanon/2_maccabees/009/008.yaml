base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/008.yaml
  text: But the one who had thought[a], in his arrogance over men, to command even the waves of the sea, and imagined that he could weigh out the heights of the mountains on a scale, was brought down to the ground and carried in a litter[b], plainly showing to all the power of God.
  footnotes:
  - marker: a
    text: 'The Greek text here has an irregular repetition: ''the faith, the faith, the power.'' This is likely a textual corruption or scribal repetition; the translation follows the clause''s clear sense, ''the power of God.'''
    reason: textual_variant
  - marker: b
    text: Or 'because of his pride over humanity.' The Greek literally says 'over men.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그는 사람들에 대한 지나친 오만함 속에서 바다의 파도들까지 지배하려고 생각하고, 산들의 높이를 저울에 달아 정하려고까지 상상하던 자였으나, 땅에 넘어진 채 들것에 실려 옮겨졌고, 하나님의 능력을 모든 사람에게 분명히 드러내고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문에는 τὴν πίστιν이 반복되는 비정상적인 형태가 있으며, 아마도 필사 오류나 반복 삽입으로 보입니다. 본문은 문장의 분명한 뜻인 ‘하나님의 능력’에 따라 옮겼습니다.
    reason: textual_variant
  - marker: b
    text: 직역하면 ‘사람들 위에’라는 뜻입니다. 여기서는 인간들에 대한 우월적 오만함을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δʼ ἀντιδοκῶν
  english_pob_choice: the one who had thought
  chosen_korean: 그는 ... 생각하고
  alternatives_korean:
  - 그는 ... 여겼고
  - 그는 ... 상상하고
  - 그는 ... 추정하고
  lexicon: LSJ
  rationale: 행동의 근거가 된 교만한 자기판단을 나타내므로, 과거의 내적 판단을 자연스럽게 드러내는 ‘생각하고’로 옮겼습니다.
- source_word: διὰ τὴν ὑπὲρ ἀνθρώπων ὑπερηφανίαν
  english_pob_choice: in his arrogance over men
  chosen_korean: 사람들에 대한 지나친 오만함 속에서
  alternatives_korean:
  - 사람들 위에 군림하려는 오만함 때문에
  - 사람들보다 위에 있다는 교만 때문에
  - 인류를 향한 오만함 때문에
  lexicon: LSJ
  rationale: ὑπὲρ ἀνθρώπων의 ‘사람들 위에/사람들에 대해’라는 우월적 뉘앙스를 살리면서, 문맥상 원인·상태를 함께 나타내기 위해 ‘속에서’로 처리했습니다.
- source_word: τοῖς τῆς θαλάσσης κύμασιν
  english_pob_choice: the waves of the sea
  chosen_korean: 바다의 파도들
  alternatives_korean:
  - 바다의 물결
  - 바다의 파도
  - 바다의 파도들을
  lexicon: LSJ
  rationale: 직역하면 ‘바다의 파도들’이지만 한국어에서는 중복감이 있어도 과장된 표현을 보존하는 쪽이 본문의 수사에 더 가깝습니다.
- source_word: πλάστιγγι τῶν ὀρέων ... ὕψη στήσειν
  english_pob_choice: weigh out the heights of the mountains on a scale
  chosen_korean: 산들의 높이를 저울에 달아 정하려고까지
  alternatives_korean:
  - 산의 높이를 저울로 재어 정하려고까지
  - 산들의 높이를 저울에 달아 세우려고까지
  - 산의 높이를 달아보려고까지
  lexicon: LSJ
  rationale: 저울을 통한 측정의 불가능한 허세를 살리기 위해 ‘저울에 달다’를 사용했고, στήσειν은 여기서 ‘정하다/결정하다’의 뜻으로 자연스럽게 옮겼습니다.
- source_word: κατὰ γῆν γενόμενος ἐν φορίᾳ παρεκομίζετο
  english_pob_choice: was brought down to the ground and carried in a litter
  chosen_korean: 땅에 넘어진 채 들것에 실려 옮겨졌고
  alternatives_korean:
  - 땅으로 내려앉아 들것에 실려 옮겨졌고
  - 땅으로 엎드러진 채 들것에 실려 옮겨졌고
  - 땅에 깔린 채 들것에 실려 옮겨졌고
  lexicon: LSJ
  rationale: ‘κατὰ γῆν’의 낮아짐과 ‘φορία’의 운반 도구를 함께 살리되, 현대 한국어에서 자연스러운 역사 서술로 ‘들것’이 가장 명료합니다.
- source_word: φανερὰν ... πᾶσιν ... τὴν δύναμιν
  english_pob_choice: showing plainly to all the power of God
  chosen_korean: 하나님의 능력을 모든 사람에게 분명히 드러내고 있었습니다
  alternatives_korean:
  - 하나님의 능력을 모든 사람 앞에 분명히 보여 주고 있었습니다
  - 모든 사람에게 하나님의 능력을 분명히 나타내고 있었습니다
  - 하나님의 능력을 모두에게 분명히 드러내고 있었습니다
  lexicon: LSJ
  rationale: φανεράν과 πᾶσιν의 공개성을 ‘분명히 드러내다’로 살렸고, 서술의 현재 진행적 효과를 한국어의 과거·진행형으로 자연스럽게 표현했습니다.
theological_decisions:
- issue: πλάστιγγι와 κατὰ γῆν의 수사적 대비
  chosen_reading: 하늘같이 높아지려는 교만과 땅에 넘어진 비참함의 대비를 그대로 살렸습니다.
  alternative_readings:
  - 보다 중립적으로 ‘측량하려고’와 ‘낮아져’로 완화하기
  - 단순한 육체적 추락으로만 번역하기
  rationale: 본문의 핵심은 왕의 허세가 하나님의 낮춤으로 전복되는 반전이므로, 과장된 자의식과 수치스러운 몰락을 약화시키지 않았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1-3
- issue: τὴν πίστιν τὴν πίστιν τὴν δύναμιν의 반복 문제
  chosen_reading: 본문의 명백한 의미인 ‘하나님의 능력’을 본문에 두고, 반복된 πίστιν의 이상한 형태는 주석 없이 본문에 억지로 반영하지 않았습니다.
  alternative_readings:
  - ‘믿음’을 본문에 포함하기
  - ‘신실함과 능력’으로 확장하기
  rationale: 주어진 그리스어는 반복/탈락이 의심되는 불안정한 형태이므로, 문장의 분명한 수사적 요점에 따라 본문은 ‘하나님의 능력’을 따르고, 텍스트 문제는 번역 본문을 어지럽히지 않도록 처리했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
