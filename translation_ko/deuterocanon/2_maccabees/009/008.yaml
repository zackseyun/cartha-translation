- from: 그러나 그는 사람들에 대한 지나친 오만함 속에서 바다의 파도들까지 지배하려고 생각하고, 산들의 높이를 저울에 달아 정하려고까지 상상하던 자였으나, 땅에 넘어진 채 들것에 실려 옮겨졌고, 하나님의 능력을 모든 사람에게 분명히 드러내고 있었습니다.[a][b]
  to: 그러나 사람들 위에 군림하려는 교만 때문에[b] 바다의 파도에도 맞설 수 있다고 생각하고, 저울로 산들의 높이를 달아 잴 수 있다고 여겼던 그는, 땅바닥에 쓰러져 들것에 실려 옮겨지면서 모든 사람에게 하나님의 능력을 분명히 드러내고 있었습니다.[a]
  rationale: 원문의 수사적 대비, 곧 자연의 파도와 산마저 상대하거나 재려 했던 오만과 땅바닥에 쓰러져 들것으로 옮겨지는 굴욕을 보존했습니다. 불안정한 πίστιν의 반복은 교리적으로 확정하거나 본문에 부자연스럽게 삽입하지 않고, 본문에서는 ‘하나님의 능력’으로 번역하고 본문비평 주석으로 처리했습니다. 또한 모든 주석 앵커를 실제 주석 대상에 맞추었습니다.
  reviewer_model: gpt-5.6-terra
