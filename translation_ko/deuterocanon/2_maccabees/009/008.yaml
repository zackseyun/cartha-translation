    rationale: 주석 앵커와 주석 대상이 일치하지 않아 독자가 ‘들것’의 어휘 주석으로 오해하게 됩니다.
  - severity: medium
    issue: ‘바다의 파도들까지 지배하려고’는 ἀντιδοκῶν의 의미를 지나치게 ‘지배하다’로 특정합니다.
    rationale: 문맥상 오만한 대항 또는 맞섬의 뜻이 더 직접적이며, ‘맞설 수 있다고 생각하다’가 원문의 과장된 자기평가를 더 잘 보존합니다.
