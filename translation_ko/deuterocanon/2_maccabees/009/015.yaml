  text: But the Jews[a], whom he had determined not even to count worthy of burial, but to cast out with their infants for the birds to devour and for the wild beasts—he would make them all equal to the Athenians.
  footnotes:
  - marker: a
    text: Or, more specifically, 'he would grant them status equal to the Athenians,' likely referring to civic privilege or legal standing rather than simple social esteem.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 유대인들은, 그가 그들을 장례도 받을 가치조차 없는 자들로 여기고, 그들의 어린아이들과 함께 새들의 먹이로, 들짐승들의 먹이로 내던지게 하였으나, 그는 그들 모두를 아테네 사람들과 동등하게 만들겠다고 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉, 단순한 사회적 호의보다 아테네 사람들과 같은 시민적 지위나 법적 권한을 뜻할 가능성이 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: μηδὲ ταφῆς ἀξιῶσαι
  english_pob_choice: not even to count worthy of burial
  chosen_korean: 장례도 받을 가치조차 없는 자들로 여기고
  alternatives_korean:
  - 묻힐 가치조차 없다고 여기고
  - 장례를 받을 만한 자로 여기지도 않고
  lexicon: LSJ
  rationale: ἀξιόω의 평가적 의미를 살려, 단순한 ‘매장 거부’보다 ‘가치 판단’이 드러나도록 옮겼습니다.
- source_word: οἰωνοβρώτους
  english_pob_choice: for the birds to devour
  chosen_korean: 새들의 먹이로
  alternatives_korean:
  - 새들에게 먹히도록
  - 새들이 뜯어 먹도록
  lexicon: LSJ
  rationale: 직역형보다 한국어에서 자연스럽고, 시체가 노출되어 조류의 먹이가 되는 잔혹한 상황을 보존합니다.
- source_word: ἐκρίψαι θηρίοις
  english_pob_choice: to cast out ... for the wild beasts
  chosen_korean: 들짐승들의 먹이로 내던지게 하였으나
  alternatives_korean:
  - 들짐승들에게 내던지게 하였으나
  - 들짐승들이 먹도록 버리게 하였으나
  lexicon: LSJ
  rationale: ἐκρίψαι의 ‘내던지다/던져 버리다’의 강한 폭력성을 살리고, θηρίοις는 ‘들짐승들’로 옮겨 잔혹한 대비를 유지했습니다.
- source_word: ἴσους Ἀθηναίοις ποιήσειν
  english_pob_choice: he would make them all equal to the Athenians
  chosen_korean: 그들 모두를 아테네 사람들과 동등하게 만들겠다고
  alternatives_korean:
  - 그들 모두를 아테네 사람들과 같게 만들겠다고
  - 그들 모두에게 아테네 사람들과 동등한 지위를 주겠다고
  lexicon: LSJ
  rationale: 본문의 비교 구조를 그대로 유지하되, 정치적 함의는 본문 밖으로 과도하게 확정하지 않도록 ‘동등하게’로 옮겼습니다.
theological_decisions:
- issue: ‘아테네 사람들과 동등하게’의 정확한 함의
  chosen_reading: 주본문은 비교 표현을 그대로 유지하고, 구체적 시민권·법적 특권 여부는 본문에서 확정하지 않았습니다.
  alternative_readings:
  - 아테네 사람들과 같은 시민권을 주겠다고
  - 아테네 사람들과 같은 권리를 주겠다고
  rationale: 그리스어는 ‘ἴσους Ἀθηναίοις’라고만 말하며, 정확한 제도적 형태를 명시하지 않습니다. 따라서 해석을 본문에 앞서 두지 않고 의미의 여지를 남겼습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
