  text: But the Jews[a], whom he had determined not even to count worthy of burial, but to cast out with their infants for the birds to devour and for the wild beasts—he would make them all equal to the Athenians.
  footnotes:
  - marker: a
    text: Or, more specifically, 'he would grant them status equal to the Athenians,' likely referring to civic privilege or legal standing rather than simple social esteem.
