revisions:
- from: 그는 조금도 교만에서 물러서지 않았고, 오히려 더욱 오만으로 가득 차서 유대인들을 향해 분노의 불을 내뿜으며 행군을 재촉하라고 명령했습니다. 그러다가 마차가 쏜살같이 달리는 중에 그가 그 마차에서 떨어졌고, 그 혹독한 낙상으로 그의 몸의 모든 관절이 탈구되었습니다.[a][b]
  to: 그러나 그는 조금도 오만을 그치지 않았고, 오히려 더욱 교만으로 가득 차서 유대인들을 향한 분노의 불을 내뿜으며 여정을 재촉하라고 명령했습니다.[a] 그러다가 마차가 쏜살같이 달리는 중에 그가 마차에서 떨어졌고, 심한 낙상을 당하여 온몸의 모든 지체가 어긋났습니다.[b]
  rationale: 원문의 어휘적 범위와 문장 구조를 우선하여, πορία의 의미를 본문에서 과도하게 특정하지 않고 각주에 대안을 남겼습니다. 또한 μέλη를 ‘지체’로 바로잡아 ‘관절’로의 의미 축소를 피했습니다. 두 각주 표지를 각 대상 어구 뒤로 옮겨 구조적 앵커를 명확히 했습니다. 신체 손상의 정확한 의학적 양상은 희귀 동사이므로 본문에서는 ‘어긋났다’로 절제하고, ‘탈구되었다’는 각주 대안으로 보존했습니다.
  reviewer_model: gpt-5.6-terra
