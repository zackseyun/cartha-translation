base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/007.yaml
  text: But he in no way ceased from his arrogance[a]; rather, he was filled even more with pride, breathing fire in his rage against the Jews and ordering the journey to be hastened. Then it happened that he fell from the chariot as it was rushing along, and in the hard fall[b] all the limbs of his body were wrenched out of joint.
  footnotes:
  - marker: a
    text: Or 'ordering the march to be pressed on.' The Greek πορία can denote travel, journey, or march, depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'all the limbs of his body were dislocated.' The rare Greek verb likely describes the limbs being violently loosened from their joints after the fall.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 조금도 교만에서 물러서지 않았고, 오히려 더욱 오만으로 가득 차서 유대인들을 향해 분노의 불을 내뿜으며 행군을 재촉하라고 명령했습니다. 그러다가 마차가 쏜살같이 달리는 중에 그가 그 마차에서 떨어졌고, 그 혹독한 낙상으로 그의 몸의 모든 관절이 탈구되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘행군을 재촉하라고 명령했습니다’. 그리스어 πορία는 문맥에 따라 여행, 여정, 행군을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 몸의 모든 관절이 탈구되었습니다’. 희귀한 그리스어 동사는 넘어짐 뒤 관절이 격렬하게 풀리거나 어긋난 상태를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδαμῶς τῆς ἀγερωχίας ἔληγεν
  english_pob_choice: in no way ceased from his arrogance
  chosen_korean: 조금도 교만에서 물러서지 않았고
  alternatives_korean:
  - 전혀 오만을 거두지 않았고
  - 조금도 거만함을 멈추지 않았고
  lexicon: LSJ
  rationale: οὐδαμῶς의 강한 부정과 ἔληγεν의 ‘그만두다/물러서다’ 뉘앙스를 살리되, 현대 한국어에서 자연스러운 표현으로 옮겼습니다.
- source_word: ὑπερηφανίας ἐπεπλήρωτο
  english_pob_choice: was filled even more with pride
  chosen_korean: 오히려 더욱 오만으로 가득 차서
  alternatives_korean:
  - 더욱 교만으로 차서
  - 더욱 자만심으로 가득 차서
  lexicon: LSJ
  rationale: 앞 구절의 ἀγερωχία와 중첩되지만, 그리스어가 의도적으로 긴장을 높이므로 단순 반복보다 ‘오히려 더욱’으로 상승을 드러냈습니다.
- source_word: πῦρ πνέων τοῖς θυμοῖς
  english_pob_choice: breathing fire in his rage
  chosen_korean: 분노의 불을 내뿜으며
  alternatives_korean:
  - 노여움의 불을 뿜으며
  - 격분의 불길을 내뿜으며
  lexicon: LSJ
  rationale: 비유적 이미지를 그대로 살리면서도 한국어에서 과장되지 않게, θυμοῖς의 정서적 강도를 ‘분노’로 옮겼습니다.
- source_word: κελεύων ἐποξύνειν τὴν πορίαν
  english_pob_choice: ordering the journey to be hastened
  chosen_korean: 행군을 재촉하라고 명령했습니다
  alternatives_korean:
  - 여정을 서두르라고 명령했습니다
  - 진군을 더 재촉하라고 명령했습니다
  lexicon: LSJ
  rationale: πορία는 문맥상 단순 이동보다 군사적 진행을 띠므로, ‘행군’이 가장 자연스럽고 지시 동사도 명령의 직접성을 살립니다.
- source_word: πάντα τὰ μέλη τοῦ σώματος ἀποσφύζειν
  english_pob_choice: all the limbs of his body were dislocated / wrenched out of joint
  chosen_korean: 그의 몸의 모든 관절이 탈구되었습니다
  alternatives_korean:
  - 몸의 모든 지체가 빠져나갔습니다
  - 온몸의 모든 마디가 어긋났습니다
  lexicon: LSJ
  rationale: 희귀 동사가 가리키는 물리적 손상을 현대 독자에게 분명하게 전달하기 위해 의학적으로도 통하는 ‘탈구’를 사용했습니다.
theological_decisions:
- issue: 아고메된 교만과 오만의 이중 표현
  chosen_reading: 교만과 오만을 서로 다른 표현으로 유지해 그 상승 효과를 보존했습니다.
  alternative_readings:
  - 둘을 모두 ‘교만’으로 통일할 수 있습니다.
  - 둘을 모두 ‘오만’으로 통일할 수 있습니다.
  rationale: 그리스어는 ἀγερωχία와 ὑπερηφανία로 같은 계열의 죄를 반복·강화하므로, 한국어도 단어를 단순 평탄화하지 않고 축적된 허영을 드러내야 합니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
