  text: 'King Antiochus and general[a], to the good Jewish citizens: many greetings, and health[b], and prosperity.'
  footnotes:
  - marker: a
    text: 'Greek order places the sender''s name and titles after the greeting formula: ''to the good Jewish citizens ... King Antiochus and general.'' English fronting of the sender clarifies the letter style.'
    reason: cultural_note
  - marker: b
    text: Or 'well-being' for 'prosperity' (Greek εὖ πράττειν, 'to fare well').
    reason: lexical_alternative
translation:
  language: ko
  text: 유다인의 좋은 시민들에게, 안티오코스 왕과 장군이 많은 인사와 건강과 번영을 전합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 인사말 공식 뒤에 송신자의 이름과 직함을 둡니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘잘됨’으로 옮길 수 있습니다. 그리스어 εὖ πράττειν은 ‘잘 지내다/형통하다’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς χρηστοῖς
  english_pob_choice: to the good
  chosen_korean: 좋은
  alternatives_korean:
