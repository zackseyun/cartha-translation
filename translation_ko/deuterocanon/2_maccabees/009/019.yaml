  - 백성들에게
  lexicon: LSJ
  rationale: πολίταις는 도시나 국가의 시민을 뜻하므로, 공식 서신체에 맞게 ‘시민들에게’로 옮겨 직역성을 유지했습니다.
- source_word: πολλὰ χαίρειν καὶ ὑγιαίνειν καὶ εὖ πράττειν
  english_pob_choice: many greetings, and health, and prosperity
  chosen_korean: 많은 인사와 건강과 번영을
  alternatives_korean:
  - 많은 인사와 건강과 잘됨을
  - 많은 인사와 안녕과 번영을
  lexicon: LSJ
  rationale: 세 개의 부정사 인사공식은 한국어에서 병렬 명사구로 처리하는 것이 자연스럽습니다. ‘건강’은 ὑγιαίνειν의 핵심 의미를, ‘번영’은 εὖ πράττειν의 ‘잘 됨/형통함’의 축복적 뉘앙스를 간결히 살립니다.
- source_word: βασιλεὺς Ἀντίοχος καὶ στρατηγὸς
  english_pob_choice: King Antiochus and general
  chosen_korean: 안티오코스 왕과 장군이
  alternatives_korean:
  - 안티오코스 왕과 장군
  - 안티오코스 왕이자 장군이
  lexicon: LSJ
  rationale: 그리스어의 송신자 표지가 인사말 뒤에 붙는 서신 형식을 살려, 주어·호칭을 ‘안티오코스 왕과 장군이’로 유지했습니다. ‘왕이자 장군’은 해석을 더하지만 원문의 직렬성을 덜 드러냅니다.
theological_decisions:
