  lexicon: LSJ
  rationale: τοῖς χρηστοῖς는 수신자를 칭찬하는 형용사로, 서신 인사말의 공손한 톤을 살리면서도 과도한 해석을 피하려면 ‘좋은’이 가장 자연스럽습니다.
