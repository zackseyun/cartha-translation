  yaml_path: translation/deuterocanon/2_maccabees/009/019.yaml
  text: 'King Antiochus and general[a], to the good Jewish citizens: many greetings, and health[b], and prosperity.'
  footnotes:
  - marker: a
    text: 'Greek order places the sender''s name and titles after the greeting formula: ''to the good Jewish citizens ... King Antiochus and general.'' English fronting of the sender clarifies the letter style.'
    reason: cultural_note
  - marker: b
    text: Or 'well-being' for 'prosperity' (Greek εὖ πράττειν, 'to fare well').
    reason: lexical_alternative
translation:
  language: ko
  text: 선량한 유다인 시민들에게 거듭 문안드리며, 건강과 번영을 기원합니다. 왕 겸 장군인 안티오코스.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 인사말 공식 뒤에 송신자의 이름과 직함을 둡니다. 한국어에서는 서신의 자연스러운 표현을 위해 송신자 표기를 문장 끝에 두었습니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘잘 지냄’ 또는 ‘잘됨’으로 옮길 수 있습니다. 그리스어 εὖ πράττειν은 ‘잘 지내다’, ‘잘되다’라는 뜻입니다.
    reason: lexical_alternative
