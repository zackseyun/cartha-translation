translation:
  language: ko
  text: 그러므로 사람을 죽인 자요 하나님을 모독한 자는, 다른 사람들에게 행한 그대로 최악의 고난을 겪은 뒤, 외국 땅의 산악지대에서 가장 비참한 끝을 맞았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 κατέ-에서 줄이 끊기지만, 문맥상 ‘끝을 맞다/죽다’의 의미로 자연스럽게 이어집니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἀνδροφόνος
  english_pob_choice: murderer
  chosen_korean: 사람을 죽인 자
  alternatives_korean:
  - 살인자
  - 인명을 해친 자
  lexicon: LSJ
  rationale: 직역적으로는 ‘사람을 죽인 자’가 가장 직접적이지만, 한국어 자연성을 위해 본문에서는 서술형 표현을 택했습니다. 다만 윤리적 비난의 강도는 유지했습니다.
- source_word: βλάσφημος
  english_pob_choice: blasphemer
  chosen_korean: 하나님을 모독한 자
  alternatives_korean:
  - 신성모독자
  - 하나님을 욕한 자
  lexicon: LSJ
  rationale: 문맥상 단순한 비방이 아니라 하나님을 향한 불경과 모독을 가리키므로, 종교적 힘을 분명히 드러내는 표현으로 옮겼습니다.
- source_word: ὡς ἑτέρους διέθηκεν
  english_pob_choice: just as he had treated others
  chosen_korean: 다른 사람들에게 행한 그대로
  alternatives_korean:
  - 다른 사람들을 대하던 그대로
  - 다른 이들에게 행한 방식대로
  lexicon: LSJ
  rationale: 행위의 상호응보를 드러내는 핵심 절이므로, ‘대하다’보다 더 폭넓은 ‘행하다’로 옮겨 그가 남들에게 가한 처분과 고난의 대응관계를 살렸습니다.
- source_word: οἰκτίστῳ μόρῳ
  english_pob_choice: a most pitiable end
  chosen_korean: 가장 비참한 끝
  alternatives_korean:
  - 가장 가련한 죽음
  - 지극히 불쌍한 최후
  lexicon: LSJ
  rationale: οἰκτίστῳ의 ‘가엾고 비참한’ 뉘앙스와 μόρος의 ‘끝/죽음’ 의미를 함께 살려, 정서적·서사적 종결을 자연스럽게 표현했습니다.
theological_decisions:
- issue: 보응의 신학을 드러내는 구문 처리
  chosen_reading: ‘다른 사람들에게 행한 그대로’로 옮겨, 그가 남에게 가한 방식이 자신에게 되돌아온다는 보응의 의미를 분명히 했습니다.
  alternative_readings:
  - 단순히 그의 죽음만 서술하는 번역
  - ‘남들에게 대하던 대로’처럼 완화된 번역
  rationale: 이 절은 단순한 사망 보도가 아니라 행위와 판결의 대응을 강조하므로, 그 신학적 긴장을 약화시키지 않는 것이 중요합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
