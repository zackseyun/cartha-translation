  text: So then the murderer and blasphemer[a], after suffering the worst things, just as he had treated others, came to a most pitiable end in a foreign land among the mountains.
  footnotes:
  - marker: a
    text: The Greek line in the provided witness ends with a line-break at κατέ-, but the sense clearly continues with his coming to an end or dying; the translation reflects that continuation.
