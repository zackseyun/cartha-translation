revisions:
- from: 그러므로 사람을 죽인 자요 하나님을 모독한 자는, 다른 사람들에게 행한 그대로 최악의 고난을 겪은 뒤, 외국 땅의 산악지대에서 가장 비참한 끝을 맞았습니다.[a]
  to: 그러므로 살인자이며 하나님을 모독한 그는, 다른 사람들에게 행한 그대로 가장 혹독한 고난을 겪은 뒤, 외국 땅의 산들 가운데서 가장 가련한 최후를 맞았습니다.[a]
  rationale: The revision improves modern formal-polite Korean and more closely represents the lexical force of the Greek. It retains the reciprocal sense of ὡς ἑτέρους διέθηκεν (‘다른 사람들에게 행한 그대로’), does not over-specify the nature of his death, and preserves a transparent note explaining the truncated line in the supplied witness.
