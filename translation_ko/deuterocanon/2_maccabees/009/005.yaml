translation:
  language: ko
  text: 그러나 모든 것을 보시는 주, 이스라엘의 하나님께서 그를 고칠 수 없고 보이지 않는 타격으로 치셨습니다.[a] 그가 막 말을 끝내자, 내장에 치유할 수 없는 고통과 속 깊은 곳의 쓰라린 고통들이 그를 사로잡았습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘고칠 수 없고 보이지 않는 재앙’ 또는 ‘고칠 수 없고 보이지 않는 상처’로 옮길 수 있습니다. 헬라어 πληγή는 타격, 상처, 또는 재앙 같은 고난을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘내장의 치유할 수 없는 고통과 속 깊은 곳의 쓰라린 고통들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παντεπόπτης
  english_pob_choice: all-seeing
  chosen_korean: 모든 것을 살피시는
  alternatives_korean:
  - 모든 것을 보시는
  - 전부를 보시는
  lexicon: LSJ
  rationale: 하나님의 전지성을 자연스러운 현대 한국어로 살리기 위해 ‘모든 것을 살피시는’으로 옮겼습니다. 단순한 시각보다 전면적 주시를 드러냅니다.
- source_word: ἐπάταξεν
  english_pob_choice: struck
  chosen_korean: 치셨습니다
  alternatives_korean:
  - 때리셨습니다
  - 쳐서 쓰러뜨리셨습니다
  - 내리치셨습니다
  lexicon: LSJ
  rationale: 직접적 신적 행위를 유지하면서도 한국어에서 자연스러운 동사로 옮겼습니다. ‘치셨습니다’는 뒤의 질병 묘사와도 맞습니다.
- source_word: ἀνιάτῳ καὶ ἀοράτῳ πληγῇ
  english_pob_choice: an incurable and unseen blow
  chosen_korean: 낫지 않는 보이지 않는 타격
  alternatives_korean:
  - 고칠 수 없는 보이지 않는 상처
  - 낫지 않는 보이지 않는 재앙
  - 불가치료의 보이지 않는 ضرب
  lexicon: LSJ
  rationale: πληγή의 ‘타격/타침’ 의미를 살리되, 뒤의 육체적 고통으로 이어지는 징계를 드러내기 위해 ‘타격’으로 옮겼습니다. ἀνιάτῳ는 ‘낫지 않는’으로, ἀοράτῳ는 ‘보이지 않는’으로 처리했습니다.
- source_word: τῶν σπλάγχνων ἀλγηδών
  english_pob_choice: pain in his bowels
  chosen_korean: 배 속의 낫지 않는 고통
  alternatives_korean:
  - 창자 속의 고통
  - 내장의 고통
  - 배 속의 아픔
  lexicon: LSJ
  rationale: σπλάγχνα의 문자적 ‘내장/창자’를 한국어에서 노골적이지만 이해 가능한 방식으로 옮기기 위해 ‘배 속’으로 했습니다. 영어 POB의 신체성 강조를 따라 고통의 물리성을 보존했습니다.
- source_word: πικραὶ τῶν ἔνδον βάσανοι
  english_pob_choice: bitter torments in his inner parts
  chosen_korean: 속의 쓰라린 고통들
  alternatives_korean:
  - 내면의 쓰라린 고통들
  - 안쪽의 쓰디쓴 고통들
  - 속사람의 고통들
  lexicon: LSJ
  rationale: βάσανοι의 ‘고통/고문’ 뉘앙스를 유지하면서도 복수형의 중첩된 고통을 자연스럽게 표현했습니다. ‘쓰라린’은 πικραὶ의 맛/정서적 자극을 함께 살립니다.
theological_decisions:
- issue: 하나님의 직접적 징계 주체성
  chosen_reading: 본문이 하나님을 그를 친 직접 행위의 주체로 제시하므로, ‘허락하셨습니다’처럼 완화하지 않고 그대로 옮겼습니다.
  alternative_readings:
  - 하나님께서 그가 병들도록 허락하셨습니다
  - 하나님께서 그에게 재앙을 내리셨습니다
  rationale: 헬라어는 ‘모든 것을 살피시는 주, 이스라엘의 하나님’이 그를 ‘치셨다’고 명시합니다. 본문의 심판 언어를 약화시키지 않는 것이 필요합니다.
  doctrine_reference: Translation philosophy §§1, 3
