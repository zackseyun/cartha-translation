  text: And besides these things[a], he would also become a Jew and would visit every inhabited place[b], proclaiming the power of God.
  footnotes:
  - marker: a
    text: Or 'he would also be a Jew.' The Greek can be rendered more literally this way, but in context it likely means adopting Jewish identity or allegiance rather than stating ethnicity.
