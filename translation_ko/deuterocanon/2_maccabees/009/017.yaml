    rationale: Ἰουδαῖος ἔσεσθαι는 직역상 ‘유대인일 것이다’도 가능하지만 문맥상 ‘유대인이 되다’로 이해될 수 있습니다. 현 각주는 번역문을 반복하여 이러한 여지를 설명하지 못합니다.
