  - marker: b
    text: '''The power of God'' could also be rendered ''the might of God'' or ''the dominion of God.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이 밖에도 그는 유대인이 되고[a], 사람이 사는 모든 곳을 찾아다니며 하나님의 권능[b]을 선포하겠다고 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 더 문자적으로 ‘유대인일 것이다’로도 옮길 수 있습니다. 그러나 문맥상 이는 단순히 민족적 신분을 말하기보다 유대인의 정체성이나 충성에 참여하겠다는 뜻으로 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘하나님의 권능’은 ‘하나님의 힘’, ‘하나님의 능력’, 또는 ‘하나님의 통치’로도 옮길 수 있습니다.
    reason: lexical_alternative
