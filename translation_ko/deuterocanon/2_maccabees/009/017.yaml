  text: And besides these things[a], he would also become a Jew and would visit every inhabited place[b], proclaiming the power of God.
  footnotes:
  - marker: a
    text: Or 'he would also be a Jew.' The Greek can be rendered more literally this way, but in context it likely means adopting Jewish identity or allegiance rather than stating ethnicity.
    reason: lexical_alternative
  - marker: b
    text: '''The power of God'' could also be rendered ''the might of God'' or ''the dominion of God.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이 밖에도 그는 유대인이 되고, 거주하는 모든 곳을 찾아다니며 하나님의 권능을 선포하겠다고 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘유대인이 되고’는 문자적으로는 ‘유대인이 되다’이지만, 문맥상 민족적 신분 선언보다 유대 정체성/충성을 받아들이겠다는 뜻으로 이해됩니다.
    reason: alternative_reading
  - marker: b
    text: ‘하나님의 권능’은 여기서 ‘하나님의 힘’ 또는 ‘하나님의 통치’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τούτοις
  english_pob_choice: And besides these things
  chosen_korean: 이 밖에도
  alternatives_korean:
  - 또 이 일들 외에도
  - 그 밖에도
  lexicon: LSJ
  rationale: 앞선 내용에 덧붙는 약속이라는 additive force를 자연스럽게 살리면서, 문어체 합쇼체에 맞게 간결하게 옮겼습니다.
- source_word: Ἰουδαῖος ἔσεσθαι
  english_pob_choice: he would also become a Jew
  chosen_korean: 그는 유대인이 되고
  alternatives_korean:
  - 그는 또한 유대인이 되겠다고 하고
  - 그는 유대인으로 살고
  lexicon: LSJ
  rationale: 문맥상 민족 표지보다 유대 정체성/충성을 받아들이겠다는 뜻이 강하므로, ‘유대인이 되다’로 직역하되 미래적 맹세의 힘을 유지했습니다.
- source_word: ἐπελεύσεσθαι
  english_pob_choice: would visit
  chosen_korean: 찾아다니며
  alternatives_korean:
  - 방문하며
  - 다니며
  lexicon: LSJ
  rationale: 장소를 두루 다니며 선포하는 흐름을 반영해, 단순 이동보다 반복적 순회 뉘앙스가 드러나도록 옮겼습니다.
- source_word: τὸ τοῦ θεοῦ κράτος
  english_pob_choice: the power of God
  chosen_korean: 하나님의 권능
  alternatives_korean:
  - 하나님의 능력
  - 하나님의 힘
  - 하나님의 통치
  lexicon: LSJ
  rationale: κράτος의 ‘힘/권세/권능’ 범위를 고려할 때, 이 장면에서 신적 승리와 압도적 힘을 드러내는 ‘권능’이 가장 적절합니다.
theological_decisions:
- issue: Ἰουδαῖος ἔσεσθαι의 의미
  chosen_reading: 단순한 친유대 정서가 아니라 유대인 정체성 또는 충성으로 들어가겠다는 맹세로 읽고 번역했습니다.
  alternative_readings:
  - 그저 유대인들에게 호의를 보이겠다는 뜻
  - 유대인처럼 행동하겠다는 뜻
  rationale: 문맥상 극단적 자기 낮춤과 이전 विरोध의 반전이 핵심이므로, 약화하지 않고 ‘유대인이 되고’로 유지했습니다.
  doctrine_reference: '원문 우선 원칙: 전승적 완화보다 본문이 드러내는 직접적 의미를 보존'
