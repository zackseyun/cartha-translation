    rationale: οἰκητὴν은 τόπον(곳)을 수식하여 ‘사람이 사는/거주되는 곳’을 뜻합니다. 한국어 ‘거주하는 곳’은 통상 사람이 거주하는 행위를 나타내므로, 장소 자체가 주어인 듯한 부자연스러움이 생깁니다.
