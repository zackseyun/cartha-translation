    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ τὸν καιρὸν ἐκεῖνον
  english_pob_choice: Now about that time
  chosen_korean: 그 무렵
  alternatives_korean:
  - 그때쯤
  - 그 무렵에
  lexicon: LSJ
  rationale: Περὶ + 시간 표현은 대략적인 시점을 나타내므로, 한국어에서는 자연스러운 시간 접속어인 ‘그 무렵’으로 옮겨 문맥 전환을 살렸습니다.
- source_word: ἐτύγχανεν
  english_pob_choice: happened to be
  chosen_korean: …하고 있었습니다
  alternatives_korean:
  - …한 상태였습니다
  - 우연히 …하고 있었습니다
  lexicon: LSJ
  rationale: 부사적 우연성은 한국어에서 과도하게 드러내기보다 서술의 배경성으로 처리하는 편이 자연스러워, 진행형으로 완곡하게 반영했습니다.
- source_word: ἀναλελυκὼς
  english_pob_choice: returning
  chosen_korean: 돌아오고 있었습니다
  alternatives_korean:
  - 되돌아오고 있었습니다
  - 귀환하고 있었습니다
  lexicon: LSJ
  rationale: 문맥상 페르시아 지역에서의 귀환을 가리키므로, ‘돌아오다’로 간결하게 옮겼습니다.
- source_word: ἀκόσμως
  english_pob_choice: in disgrace
  chosen_korean: 수치스럽게
  alternatives_korean:
  - 무질서하게
  - 체면을 잃은 채
  - 떳떳하지 않게
  lexicon: LSJ
  rationale: ἀκόσμως는 질서 없음과 수치/불명예의 뉘앙스를 함께 가질 수 있으므로, 문맥상 왕의 비참한 귀환을 드러내는 ‘수치스럽게’로 옮기되, ‘무질서하게’라는 더 중립적 가능성도 열어 두었습니다.
- source_word: ἐκ τῶν περὶ τὴν Περσίδα τόπων
  english_pob_choice: from the regions around Persia
  chosen_korean: 페르시아 주변 지역에서
  alternatives_korean:
  - 페르시아 주변의 지역들에서
  - 페르시아 인근 지역에서
  lexicon: LSJ
  rationale: τόποι의 지리적 범위를 자연스럽게 살려, 구체적 경계보다 넓은 ‘주변 지역’으로 처리했습니다.
theological_decisions:
- issue: ἀκόσμως의 의미 범위
  chosen_reading: 수치스럽고 체면을 잃은 귀환으로 읽었습니다.
  alternative_readings:
