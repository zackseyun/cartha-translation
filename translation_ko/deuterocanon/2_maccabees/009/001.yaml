  - 예법에 맞지 않는 귀환
  rationale: 본문은 안티오코스의 귀환을 단순한 이동 상태 이상으로, 불명예와 추락의 분위기 속에서 제시합니다. 한국어 표현은 그 역사서술의 평가적 뉘앙스를 유지해야 합니다.
  doctrine_reference: 역사서의 서술적 평가와 왕권의 수치화
