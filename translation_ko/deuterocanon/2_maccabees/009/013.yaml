  - marker: b
    text: Greek 'Master' (despotēs), not the more common 'Lord' (kyrios).
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그 더럽혀진 사람은 이제 더는 그에게 자비를 베풀지 않을 주인께 계속 기도하며 이렇게 말했습니다:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘더럽혀진 사람’. 그리스어 형용사는 도덕적·의례적 오염의 강한 뜻을 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 더 흔한 ‘주(κύριος)’가 아니라 ‘주인(δεσπότης)’을 사용합니다.
    reason: lexical_alternative
