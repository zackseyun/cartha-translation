  source_fidelity: 그리스어는 안티오코스가 거룩한 성을 평지로 만들고 많은 이의 무덤으로 만들려 했으나, 장차 그 성을 자유로운 성으로 선언하겠다고 말하는 내용입니다. 초안은 이 기본 의미를 대체로 반영하지만, ‘거룩한 성을 — … 그 성을 —’의 중복 목적어와 ‘자유롭게 선포하실’의 목적어·상태 표현이 부정확합니다.
  naturalness: ‘땅과 평평하게’는 현대 한국어에서 자연스럽지 않고, ‘자유롭게 선포하다’는 무엇을 자유롭게 한다는 뜻으로도 이해될 수 있어 ‘그 성을 자유로운 성으로 선언하다’로 명료하게 옮기는 편이 좋습니다. 안티오코스를 가리키는 주어에 높임 선어말 ‘-시-’를 쓰지 않는 것도 문체상 적절합니다.
  terminology: ‘거룩한 성’은 성서적 관용에 맞습니다. πολυάνδριον은 많은 사람이 묻힌/묻힐 무덤을 뜻하므로 본문에서는 자연스럽게 풀고, 각주에서 ‘공동무덤’ 및 ‘대량 매장지’라는 대안을 제시하는 것이 좋습니다.
