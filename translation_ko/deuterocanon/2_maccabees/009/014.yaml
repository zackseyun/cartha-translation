  chosen_korean: 자유롭게 선포하실 것입니다
  alternatives_korean:
  - 자유롭다고 선언하실 것입니다
  - 자유를 선포하실 것입니다
  lexicon: LSJ
  rationale: ἀναδείκνυμι의 ‘공적으로 드러내어 선언하다’는 뉘앙스를 살려, 상태를 공포하는 행위로 옮겼습니다.
