  text: As for the holy city[a], which he had been hurrying to make level with the ground and to build into a mass grave, he will declare it free.
  footnotes:
  - marker: a
    text: Or 'a common grave' or 'a burial place for many.' The Greek term denotes a grave for many dead; 'mass grave' is chosen for clarity and force.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 서둘러 와서 땅과 평평하게 만들고 많은 사람이 묻힐 무덤으로 만들려 하던 거룩한 성을, 그는 자유로운 성으로 선언할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘많은 사람이 묻힐 무덤’에 해당하는 그리스어 πολυάνδριον은 많은 사람이 함께 묻힌 무덤을 뜻합니다. ‘공동무덤’ 또는 ‘대량 매장지’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁγίαν πόλιν
