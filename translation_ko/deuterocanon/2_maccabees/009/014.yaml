  rationale: ‘평평하게 하다’가 본문의 파괴적 의미를 직접 전달하며, 영어 POB의 ‘make level with the ground’에 대응합니다.
- source_word: πολυάνδριον
  english_pob_choice: a mass grave
  chosen_korean: 많은 사람의 무덤
