  text: As for the holy city[a], which he had been hurrying to make level with the ground and to build into a mass grave, he will declare it free.
  footnotes:
  - marker: a
    text: Or 'a common grave' or 'a burial place for many.' The Greek term denotes a grave for many dead; 'mass grave' is chosen for clarity and force.
    reason: lexical_alternative
translation:
  language: ko
  text: 거룩한 성을 — 그가 서둘러 땅과 평평하게 만들고 많은 사람의 무덤으로 만들려 하던 그 성을 — 그는 자유롭게 선포하실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘많은 사람의 무덤’은 그리스어 πολυάνδριον의 직역으로, ‘공동무덤’ 또는 ‘대량매장지’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁγίαν πόλιν
  english_pob_choice: the holy city
  chosen_korean: 거룩한 성
  alternatives_korean:
  - 성스러운 성
  - 거룩한 도시
  lexicon: LSJ
  rationale: ἅγιος의 기본 의미를 살리면서, 예루살렘을 가리키는 성서적 관용으로 가장 자연스럽게 읽히는 표현입니다.
- source_word: ἰσόπεδον ποιῆσαι
  english_pob_choice: to make level with the ground
  chosen_korean: 땅과 평평하게 만들다
  alternatives_korean:
  - 땅으로 평탄하게 하다
  - 완전히 허물어 평지로 만들다
  lexicon: LSJ
  rationale: ‘평평하게 하다’가 본문의 파괴적 의미를 직접 전달하며, 영어 POB의 ‘make level with the ground’에 대응합니다.
- source_word: πολυάνδριον
  english_pob_choice: a mass grave
  chosen_korean: 많은 사람의 무덤
  alternatives_korean:
  - 공동무덤
  - 대량매장지
  lexicon: LSJ
  rationale: πολυάνδριον의 ‘여럿이 함께 묻히는 무덤’이라는 뜻을 분명히 하되, 한국어에서 지나치게 기술적으로 들릴 수 있는 표현은 피했습니다.
- source_word: ἐλευθέραν ἀναδείξει
  english_pob_choice: he will declare it free
  chosen_korean: 자유롭게 선포하실 것입니다
  alternatives_korean:
  - 자유롭다고 선언하실 것입니다
  - 자유를 선포하실 것입니다
  lexicon: LSJ
  rationale: ἀναδείκνυμι의 ‘공적으로 드러내어 선언하다’는 뉘앙스를 살려, 상태를 공포하는 행위로 옮겼습니다.
theological_decisions:
- issue: 미래 시제의 주어와 문맥상 화자의 예언적 진술 방식
  chosen_reading: 문맥상 미래의 공적 선언을 예고하는 진술로 읽어, ‘선포하실 것입니다’로 옮겼습니다.
  alternative_readings:
  - ‘선언할 것이다’로 더 중립적으로 옮길 수 있습니다.
  - 직설적 과거 회고로 처리할 수도 있습니다.
  rationale: 그리스어 미래형과 서술의 예언적 성격을 반영하면서, 한국어에서 자연스러운 존대 종결을 유지했습니다.
  doctrine_reference: 번역학적 선택; 문맥상 예언적 미래
