theological_decisions:
- issue: 수동형 διεκομίσθη의 의미 처리
  chosen_reading: 본문의 형식적 수동성을 직역하기보다, 문맥이 요구하는 자발적 이동/이탈의 의미를 한국어로 드러냈습니다.
  alternative_readings:
  - 그는 이집트의 프톨레마이오스 필로메토르에게로 옮겨졌습니다
  - 그는 프톨레마이오스 필로메토르에게로 전달되었습니다
  rationale: 역사 서술 맥락에서 이 동사는 단순 물리적 운송이 아니라 정치적 이동을 가리키므로, 독자가 본문의 실제 사건 관계를 이해하도록 해야 합니다.
  doctrine_reference: 서사 본문의 문맥 우선 원칙
