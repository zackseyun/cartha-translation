  source_fidelity: 수정이 필요합니다. διεκομίσθη는 수동태이므로 본문에서는 ‘옮겨졌습니다’로 수동의 형태를 보존하는 것이 가장 안전합니다. ‘가버렸습니다’는 자발적 이동을 단정하고 구어적 뉘앙스를 더합니다. 또한 ‘πρὸς Πτολεμαῖον τὸν Φιλομήτορα εἰς Αἴγυπτον’은 ‘이집트의 프톨레마이오스 필로메토르에게로’가 자연스럽고 충실합니다.
  naturalness: 기존 문장은 ‘그의 동료 필립보’보다 ‘그의 동료인 필립보’가 자연스럽습니다. ‘가버렸습니다’는 합쇼체이기는 하나 역사 서술의 격식과 맞지 않고 원문의 수동성을 약화합니다. 각주 a의 ‘프톨레마이오스 필로메토르에게 있는 이집트’는 한국어로 비문입니다.
  terminology: ‘시신’, ‘동료’, ‘안티오코스’, ‘프톨레마이오스 필로메토르’는 적절합니다. σύντροφος의 가능한 ‘함께 자란 사람’이라는 함의는 각주로 처리하는 것이 적합합니다. 각주 표지는 해당 어휘에 직접 붙여야 합니다.
