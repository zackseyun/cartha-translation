  text: But Philip[a], his companion, was carrying the body; and, because he feared Antiochus’s son[b], he went over to Ptolemy Philometor in Egypt.
  footnotes:
  - marker: a
    text: Or, more formally, 'was conveyed to Ptolemy Philometor in Egypt.' The Greek verb διεκομίσθη is passive in form and can be rendered more literally as a transfer or conveyance.
    reason: lexical_alternative
  - marker: b
    text: '''Companion'' may also suggest one reared with him, that is, a close court associate or foster-companion.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 그의 동료인 필립보[b]는 그 시신을 운반하고 있었습니다. 그는 안티오코스의 아들을 두려워하여 이집트의 프톨레마이오스 필로메토르에게로 옮겨졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘이집트의 프톨레마이오스 필로메토르에게로 이송되었습니다.’ 그리스어 διεκομίσθη는 형태상 수동태이며, ‘이동되다’ 또는 ‘이송되다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘동료’는 그와 함께 자란 사람, 곧 가까운 궁정 동료나 양육 동료를 뜻할 수도 있습니다.
    reason: lexical_alternative
