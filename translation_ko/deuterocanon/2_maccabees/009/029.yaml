  text: But Philip[a], his companion, was carrying the body; and, because he feared Antiochus’s son[b], he went over to Ptolemy Philometor in Egypt.
  footnotes:
  - marker: a
    text: Or, more formally, 'was conveyed to Ptolemy Philometor in Egypt.' The Greek verb διεκομίσθη is passive in form and can be rendered more literally as a transfer or conveyance.
    reason: lexical_alternative
  - marker: b
    text: '''Companion'' may also suggest one reared with him, that is, a close court associate or foster-companion.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 그의 동료 필립보가 시신을 운반하고 있었는데, 안티오코스의 아들을 두려워하여 그는 이집트에 있는 프톨레마이오스 필로메토르에게로 가버렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘프톨레마이오스 필로메토르에게 있는 이집트로 옮겨졌습니다.’ 그리스어 διεκομίσθη는 형태상 수동이며, 더 문자적으로는 이동·이송으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘동료’는 그와 함께 자란 사람, 곧 가까운 궁정 동료나 양육 동료를 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκομίζετο
  english_pob_choice: was carrying
  chosen_korean: 운반하고 있었는데
  alternatives_korean:
  - 옮기고 있었는데
  - 나르고 있었는데
  - 운반해 가고 있었는데
  lexicon: LSJ
  rationale: 미완료 과거의 진행성을 살리면서, 시신을 옮기는 동작을 자연스럽게 드러내기 위해 ‘운반하고 있었는데’를 선택했습니다.
- source_word: τὸ σῶμα
  english_pob_choice: the body
  chosen_korean: 시신
  alternatives_korean:
  - 몸
  - 그 시신
  - 몸뚱이
  lexicon: LSJ
  rationale: 문맥상 죽은 왕의 몸을 가리키므로, 의미를 분명히 하되 과도하게 거칠지 않은 ‘시신’이 가장 적절합니다.
- source_word: σύντροφος
  english_pob_choice: companion
  chosen_korean: 동료
  alternatives_korean:
  - 동반자
  - 함께 자란 사람
  - 궁정 동료
  lexicon: LSJ
  rationale: 단순한 동행보다 함께한 궁정 관계를 자연스럽게 드러내면서도, 본문이 설명하지 않는 ‘양육 동료’까지 단정하지 않도록 ‘동료’를 택했습니다.
- source_word: εὐλαβηθεὶς
  english_pob_choice: because he feared
  chosen_korean: 두려워하여
  alternatives_korean:
  - 경계하여
  - 염려하여
  - 무서워하여
  lexicon: LSJ
  rationale: 여기서는 필립보의 행동 동기를 나타내는 원인절이므로, ‘두려워하여’로 간결하게 옮겨 긴박한 뉘앙스를 살렸습니다.
- source_word: διεκομίσθη
  english_pob_choice: he went over
  chosen_korean: 가버렸습니다
  alternatives_korean:
  - 옮겨졌습니다
  - 건너갔습니다
  - 가서 몸을 피했습니다
  lexicon: LSJ
  rationale: 형식은 수동이지만 문맥상 지역 이동과 정치적 귀속 변화를 뜻하므로, 영어 POB의 해석을 따라 자연스러운 이동 표현으로 처리했습니다.
theological_decisions:
- issue: 수동형 διεκομίσθη의 의미 처리
  chosen_reading: 본문의 형식적 수동성을 직역하기보다, 문맥이 요구하는 자발적 이동/이탈의 의미를 한국어로 드러냈습니다.
  alternative_readings:
  - 그는 이집트의 프톨레마이오스 필로메토르에게로 옮겨졌습니다
  - 그는 프톨레마이오스 필로메토르에게로 전달되었습니다
  rationale: 역사 서술 맥락에서 이 동사는 단순 물리적 운송이 아니라 정치적 이동을 가리키므로, 독자가 본문의 실제 사건 관계를 이해하도록 해야 합니다.
  doctrine_reference: 서사 본문의 문맥 우선 원칙
