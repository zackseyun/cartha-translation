  - 중한 질병
  lexicon: LSJ
  rationale: POB의 수정본이 유지한 ‘become severe’의 의미를 살리되, 한국어에서는 ‘심한 질병’이 가장 간명하게 상태의 중함을 드러냅니다.
- source_word: κοινῆς πάντων ὑμῶν ἀσφαλείας
  english_pob_choice: the common safety of all of you
  chosen_korean: 당신들 모두의 공동 안전
  alternatives_korean:
  - 모든 사람의 공공의 안전
  - 여러분 모두의 공적 안전
  lexicon: LSJ
  rationale: ἀσφάλεια는 안전/보안을 뜻하고 κοινῆς는 공동성을 강조하므로, ‘공동 안전’이 본문의 집단적 의미를 잘 보존합니다.
