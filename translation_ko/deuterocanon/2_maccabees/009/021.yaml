  - 여러분 모두의 공적 안전
  lexicon: LSJ
  rationale: ἀσφάλεια는 안전/보안을 뜻하고 κοινῆς는 공동성을 강조하므로, ‘공동 안전’이 본문의 집단적 의미를 잘 보존합니다.
