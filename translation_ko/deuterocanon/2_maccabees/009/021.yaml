  lexicon: LSJ
  rationale: εὔνοια는 상대를 향한 우호와 배려를 뜻하므로, 한국어에서는 ‘호의’가 가장 직접적입니다.
- source_word: φιλοστόργως
  english_pob_choice: with affection
  chosen_korean: 애정으로
  alternatives_korean:
  - 정답게
  - 가족처럼 애정 어린 마음으로
