base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/021.yaml
  text: I remembered your honor and goodwill with affection[a]; after returning from the regions of Persia and falling into an illness that has become severe, I considered it necessary to take thought for the common safety of all of you[c][b];
  footnotes:
  - marker: a
    text: Or 'your honor and favor.' The Greek εὔνοια can mean 'goodwill' or 'favor.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'falling into an illness having δυσχερία.' The expression indicates a sickness in a serious or hard-to-bear condition.
    reason: lexical_alternative
  - marker: c
    text: Or 'the public security of all of you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 여러분의 명예와 호의를 애정을 담아 기억해 왔습니다[a]. 페르시아 지역에서 돌아온 뒤 중한 질병[b]에 걸렸으므로, 여러분 모두의 공동의 안전[c]을 돌보는 것이 필요하다고 여겼습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분의 명예와 선의’. 그리스어 εὔνοια는 ‘호의’ 또는 ‘선의’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘심각함을 지닌 질병에 걸린 뒤’입니다. 이 표현은 병이 중하거나 견디기 어려운 상태임을 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘여러분 모두의 공공의 안전’.
    reason: lexical_alternative
lexical_decisions:
