translation:
  language: ko
  text: 나는 그가 나의 뜻에 맞추어 공정하고 인도적인 마음가짐을 갖추고, 여러분을 그에 따라 대할 것이라고 확신합니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 분사구는 압축적이어서, ‘나의 뜻에 맞추어 공정하고 인도적인 마음가짐을 갖춘’으로도, ‘나의 뜻에 공정하고 인도적인 방식으로 이끌린’으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέπεισμαι
  english_pob_choice: I am convinced
  chosen_korean: 확신합니다
  alternatives_korean:
  - 믿고 있습니다
  - 확신하고 있습니다
  - 굳게 믿습니다
  lexicon: BDAG
  rationale: 완료형의 확고한 내적 확신을 자연스러운 현대 한국어로 옮겼습니다. “확신합니다”는 현재의 확정된 믿음을 분명히 드러냅니다.
- source_word: ἐπιεικῶς
  english_pob_choice: with fairness
  chosen_korean: 공정하고도
  alternatives_korean:
  - 온유하게
