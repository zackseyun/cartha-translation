  text: For I am convinced that[a], if he is guided by my purpose with fairness and humanity, he will deal with you accordingly.
  footnotes:
  - marker: a
    text: The Greek participle translated 'if he is guided' is somewhat compressed and may also be understood as 'having been disposed' or 'being brought into accord' with the speaker's purpose.
