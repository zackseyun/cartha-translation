  lexicon: BDAG
  rationale: 이 부사는 단순한 부드러움보다 절제된 공정성, 관대함, 합리성을 함께 띱니다. 한국어에서는 문맥상 뒤의 φιλανθρώπως와 짝을 이루어 “공정하고도 인도적으로”가 가장 덜 축소합니다.
- source_word: φιλανθρώπως
  english_pob_choice: with humanity
  chosen_korean: 인도적으로
  alternatives_korean:
  - 친절하게
  - 호의적으로
  - 사람답게
  lexicon: BDAG
  rationale: 사람을 향한 인간적인 호의와 자비를 가리키므로, 현대 한국어에서 윤리적 뉘앙스를 살리는 “인도적으로”를 택했습니다.
- source_word: τῇ ἐμῇ προαιρέσει
  english_pob_choice: by my purpose
  chosen_korean: 나의 뜻에 따라
  alternatives_korean:
  - 나의 목적에 따라
  - 나의 의도에 따라
  - 나의 결심에 따라
  lexicon: BDAG
  rationale: προαίρεσις는 의도, 목적, 선택을 포함하는 말입니다. “뜻”은 이 문맥에서 왕의 확정된 의도를 간결하게 드러냅니다.
- source_word: συνσταθέντα
  english_pob_choice: if he is guided
  chosen_korean: 대할 것이므로
  alternatives_korean:
  - 그렇게 이끌리면
  - 그렇게 정돈되면
  - 그렇게 맞추어지면
  lexicon: LSJ
  rationale: 이 분사구는 전치사적·압축적 구조로, 앞 문맥의 태도와 뒤 동사의 결과를 이어 줍니다. 한국어에서는 “~이므로”로 연결해 원문의 조건적/종속적 기능을 살리되, 의미를 과도하게 해석하지 않았습니다.
- source_word: συνπεριενεχθήσεσθαι
  english_pob_choice: he will deal with you accordingly
  chosen_korean: 여러분을 그렇게 대할 것입니다
  alternatives_korean:
  - 여러분에게 그와 같이 행할 것입니다
  - 여러분을 그에 맞게 다룰 것입니다
  - 여러분에게 상응하여 행동할 것입니다
  lexicon: LSJ
  rationale: 상응하는 방식으로 타인을 대한다는 뜻을 살려, 자연스러운 한국어로 “그렇게 대할 것입니다”로 옮겼습니다.
theological_decisions:
- issue: 분사구 συνσταθέντα의 관계
  chosen_reading: 조건문처럼 보이기보다, 그의 태도와 왕의 뜻이 결합된 결과적 관계를 한국어의 종속 연결로 표현했습니다.
  alternative_readings:
  - ‘그가 나의 뜻에 의해 인도받는다면’
  - ‘그가 나의 뜻과 조화를 이루면’
  rationale: 영어 POB의 수정 이력도 이 분사구의 압축성을 인정합니다. 한국어에서는 조건을 단정적으로 만들기보다, 원문의 유동성을 유지하는 것이 더 안전합니다.
  doctrine_reference: '번역 원리: 원문 수사 구조 보존'
- issue: 공정함과 인도성의 병렬
  chosen_reading: ‘공정하고도 인도적으로’로 두 부사의 병렬성을 살렸습니다.
  alternative_readings:
  - ‘온화하고 사람답게’
  - ‘관대하고 인간적으로’
  rationale: 두 부사는 서로 겹치지만 동일하지 않으므로, 한쪽을 다른 쪽으로 흡수하지 않고 병렬로 제시했습니다.
  doctrine_reference: 어휘 의미의 중첩과 구별
