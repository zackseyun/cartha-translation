  text: And seeing that my father[a], whenever he campaigned in the upper regions, appointed the one who would succeed him,
  footnotes:
  - marker: a
    text: Or 'went on campaign in the upper regions'; the Greek verb can more literally mean 'encamped,' but the broader military sense best fits the context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 내 아버지도, 그가 위쪽 지역으로 출정하실 때마다, 그 뒤를 이을 사람을 임명하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 동사 ἐστρατοπέδευσεν은 문자적으로는 ‘진을 치다/주둔하다’에 가깝지만, 여기서는 왕의 군사 원정이라는 넓은 뜻이 더 잘 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρῶν
  english_pob_choice: seeing
  chosen_korean: 그리고 …도
  alternatives_korean:
  - 보면서
  - 보고서
  - 생각하면서
  lexicon: LSJ
  rationale: 분사 θεωρῶν은 앞 문장의 이유를 이끄는 기능이므로, 한국어에서는 ‘그리고’로 자연스럽게 연결해 원인의 흐름을 살렸습니다.
- source_word: ἐστρατοπέδευσεν
  english_pob_choice: campaigned
  chosen_korean: 출정하실 때마다
  alternatives_korean:
  - 진영을 치실 때마다
  - 캠페인하실 때마다
  - 주둔하실 때마다
  lexicon: LSJ
  rationale: 문맥상 단순한 ‘진을 침’보다 군사 원정의 의미가 더 분명하므로, ‘출정’으로 옮겨 왕의 군사 이동을 자연스럽게 드러냈습니다.
- source_word: εἰς τοὺς ἄνω τόπους
  english_pob_choice: in the upper regions
  chosen_korean: 위쪽 지역으로
  alternatives_korean:
  - 상부 지역으로
  - 윗지방으로
  - 북쪽 지역으로
  lexicon: LSJ
  rationale: 지리적 방향성을 유지하되 과도하게 특정하지 않기 위해, 직역에 가까운 ‘위쪽 지역’으로 옮겼습니다.
- source_word: ἀνέδειξεν τὸν διαδεξάμενον
  english_pob_choice: appointed the one who would succeed him
  chosen_korean: 그 뒤를 이을 사람을 임명하셨습니다
  alternatives_korean:
  - 그를 이어받을 이를 세우셨습니다
  - 후계자를 지명하셨습니다
  - 뒤를 이을 이를 지정하셨습니다
  lexicon: LSJ
  rationale: ἀνέδειξεν은 공식적 지명/임명의 뜻이므로 ‘임명하셨습니다’로, διαδεξάμενον은 ‘그 뒤를 이을 사람’으로 풀어 수사적 관계를 분명히 했습니다.
