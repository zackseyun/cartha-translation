  text: 안녕히 계십시오. 자녀들도 안녕하기를 바랍니다. 그리고 여러분의 일들은—여러분의 일들은—여러분의 일들은 여러분의 판단대로 될 것입니다. 저는 하늘에 소망을 두고 있으며,[a]
