    text: 그리스어 본문은 여기서 ‘여러분의 일들’을 세 번 반복합니다. 이를 강조를 위한 반복으로 이해할 수도 있고, 전승 과정에서 생긴 우연한 중복으로 볼 수도 있습니다.
    reason: textual_variant
