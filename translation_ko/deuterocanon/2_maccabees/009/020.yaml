  text: Farewell[a], and your children. And your own affairs—your own affairs—your own affairs will be according to your judgment. Having my hope in heaven,
  footnotes:
  - marker: a
    text: The Greek witness used here repeats 'your own affairs' three times. Some readers may understand this as emphatic repetition; others may suspect accidental duplication in transmission.
    reason: textual_variant
translation:
  language: ko
  text: 안녕히 계십시오, 그리고 자녀들도. 그리고 여러분의 자기 일들도—여러분의 자기 일들도—여러분의 판단대로 될 것입니다. 나는 하늘에 소망을 두고 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 증거는 여기서 ‘여러분의 자기 일들’을 세 번 반복합니다. 어떤 독자는 이를 강조 반복으로, 다른 독자는 전승 과정의 우연한 중복으로 이해할 수 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἐρρῶσθε
  english_pob_choice: Farewell
  chosen_korean: 안녕히 계십시오
  alternatives_korean:
  - 평안히 계십시오
  - 안녕히 가십시오
  - 건강하십시오
  lexicon: LSJ
  rationale: 편지의 결어로 쓰인 관용적 인사말이므로, 한국어에서는 자연스러운 작별 인사인 ‘안녕히 계십시오’로 옮겼습니다.
- source_word: τὰ τέκνα
  english_pob_choice: your children
  chosen_korean: 자녀들도
  alternatives_korean:
  - 아이들도
  - 자식들도
  - 그 자녀들도
  lexicon: LSJ
  rationale: 직접 호칭 뒤에 오는 문맥상 소유 관계가 자연스러워 ‘자녀들’로 옮겼고, 반복되는 결을 살리기 위해 ‘도’를 붙였습니다.
- source_word: τὰ ἴδια
  english_pob_choice: your own affairs
  chosen_korean: 여러분의 자기 일들
  alternatives_korean:
  - 여러분의 일들
  - 여러분의 자기 것들
  - 여러분의 살림
  lexicon: LSJ
  rationale: τὰ ἴδια의 관용적 뜻인 ‘자기 몫의 일/사정’을 살려, 지나치게 추상화하지 않고 ‘자기 일들’로 옮겼습니다.
- source_word: κατὰ γνώμην ὑμῶν
  english_pob_choice: according to your judgment
  chosen_korean: 여러분의 판단대로
  alternatives_korean:
  - 여러분의 의견대로
  - 여러분이 좋다고 여기는 대로
  - 여러분의 생각대로
  lexicon: LSJ
  rationale: γνώμη는 단순한 의견보다 숙고된 판단을 가리킬 수 있으므로, 형식적이면서도 자연한 ‘판단대로’를 선택했습니다.
- source_word: εἰς οὐρανὸν τὴν ἐλπίδα ἔχων
  english_pob_choice: Having my hope in heaven
  chosen_korean: 나는 하늘에 소망을 두고 있습니다
  alternatives_korean:
  - 하늘에 소망을 품고 있습니다
  - 나는 하늘을 소망으로 두고 있습니다
  - 하늘에 제 소망을 두고 있습니다
  lexicon: LSJ
  rationale: 분사구문을 한국어의 진행·상태 표현으로 풀어, 압축된 원문의 뜻을 자연스럽게 드러냈습니다. ‘하늘’은 장소적 방향을 그대로 살렸습니다.
theological_decisions:
- issue: τὰ ἴδια의 세 번 반복
  chosen_reading: 본문의 반복을 그대로 살려 ‘여러분의 자기 일들—여러분의 자기 일들—여러분의 자기 일들’로 반영했습니다.
  alternative_readings:
  - 한 번만 옮겨 문장을 매끄럽게 다듬기
  - 반복을 각주로만 처리하기
  rationale: 원문 증거가 반복을 보존하고 있으므로, 본문에서 조용히 정리하지 않고 반복 자체를 드러내어 전승상의 긴장을 투명하게 유지했습니다.
  doctrine_reference: 원문 우선 원칙과 본문 투명성
