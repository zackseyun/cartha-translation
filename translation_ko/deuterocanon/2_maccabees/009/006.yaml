  text: very justly[b][a], he who had tortured the inward parts of others with many and foreign afflictions.
  footnotes:
  - marker: a
    text: Or 'entrails' or 'inner organs' for 'the inward parts.' The Greek is concrete and bodily, not merely emotional.
    reason: lexical_alternative
  - marker: b
    text: Or 'with many and unusual sufferings.' The adjective can mean 'strange,' 'foreign,' or 'unusual.'
    reason: lexical_alternative
translation:
  language: ko
  text: 매우 마땅하게도, 그는 다른 사람들의 내장을 많은 낯선 고통으로 고문했던 자였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내장’은 감정이 아니라 신체의 내부 기관을 가리키는 구체적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ξενίζουσαις는 ‘낯선’ 외에도 ‘이상한’, ‘기이한’, ‘외래적인’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάνυ δικαίως
  english_pob_choice: very justly
  chosen_korean: 매우 마땅하게도
  alternatives_korean:
  - 지극히 정당하게
  - 매우 공정하게
  - 대단히 옳게
  lexicon: LSJ
  rationale: πάνυ의 강한 강조를 살리면서 δικαίως의 도덕적 판정을 한국어로 자연스럽게 전달하기 위해 ‘매우 마땅하게도’를 택했습니다.
- source_word: σπλάγχνα
  english_pob_choice: the inward parts
  chosen_korean: 내장
  alternatives_korean:
  - 창자
  - 장기
  - 속사람
  lexicon: LSJ
  rationale: 이 어휘는 비유적 ‘마음’보다 신체의 내부 기관을 가리키므로, 본문의 폭력성과 구체성을 살려 ‘내장’으로 옮겼습니다.
- source_word: βασανίσαντα
  english_pob_choice: had tortured
  chosen_korean: 고문했던
  alternatives_korean:
  - 고통 주었던
  - 괴롭혔던
  - 심문했던
  lexicon: LSJ
  rationale: βάσανος 계열의 강한 폭력성을 반영하려면 단순한 ‘괴롭혔던’보다 ‘고문했던’이 더 정확합니다.
- source_word: πολλαῖς καὶ ξενίζουσαις συμφοραῖς
  english_pob_choice: with many and strange afflictions
  chosen_korean: 많은 낯선 고통으로
  alternatives_korean:
  - 많고 이상한 재난들로
  - 많은 기이한 고난으로
  - 많고 외래적인 환난으로
  lexicon: LSJ
  rationale: συμφοραί의 재난·고통 의미와 ξενίζουσαις의 낯섦, 이질성을 함께 살리기 위해 ‘많은 낯선 고통’으로 압축했습니다.
- source_word: τὸν ... βασανίσαντα
  english_pob_choice: he who had tortured
  chosen_korean: 그는 ... 고문했던 자였습니다
  alternatives_korean:
  - 그는 ... 고문한 자였습니다
  - 그 사람은 ... 고문했던 이였습니다
  lexicon: LSJ
  rationale: 관사 달린 분사가 실질적으로 사람을 지시하므로, 한국어에서는 ‘...했던 자’로 풀어 분사적 성격을 살렸습니다.
theological_decisions:
- issue: 가해자에 대한 보응의 도덕적 판단
  chosen_reading: 이 구절은 그의 고난이 정당한 보응이었다는 평가를 분명히 유지합니다.
  alternative_readings:
  - ‘매우 옳게도’처럼 약화해 옮길 수 있습니다.
  - 판단을 흐려 단순한 서술로 처리할 수 있습니다.
  rationale: 원문 πάνυ δικαίως는 단순한 서술이 아니라 명시적 도덕 판정이므로, 한국어도 그 평가를 희석하지 않도록 했습니다.
  doctrine_reference: 원문 우선 원칙; 보응의 정당성에 대한 서술을 보존
