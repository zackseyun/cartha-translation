  source_fidelity: 개정이 필요합니다. τεθραυσμένος는 남성 단수로서 문맥상 안티오코스 자신이 ‘꺾인/부서진’ 상태임을 나타내므로, ‘그의 교만의 큰 부분이 부서진 채’라고 하면 분사 수식 관계가 원문과 맞지 않습니다. 또한 θείᾳ μάστιγι는 ‘신적인 채찍 아래에서’보다 수단·원인의 뜻을 살려 ‘신적 채찍에 맞아’로 옮기는 편이 적절합니다. τὸ πολὺ τῆς ὑπερηφανίας는 문맥상 그의 매우 큰/극심한 교만을 가리키는 관용적 표현으로 처리하되, 각주에서 대안을 보존했습니다.
  naturalness: 초안의 ‘그의 교만의 큰 부분이 부서진 채 끝나기 시작했고’는 한국어 문장 구조와 의미 연결이 부자연스럽습니다. 주어인 인물이 꺾인 상태에서 교만을 그치고 인식에 이르는 흐름으로 재구성하면 현대 표준어 합쇼체에 자연스럽습니다.
  terminology: ὑπερηφανία는 ‘교만’, ἐπίγνωσις는 회개를 단정하지 않는 ‘깨달음’, μάστιξ는 은유 이미지를 유지한 ‘채찍’으로 유지했습니다. ‘신적’은 θείᾳ의 형용사적 범위를 보존하며 특정 교리적 결론을 추가하지 않습니다.
