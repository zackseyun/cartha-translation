  rationale: μάστιξ의 비유적 ‘채찍/징계’ 이미지를 보존하면서, 판단의 원인을 신적 기원으로 분명히 했습니다.
theological_decisions:
- issue: εἰς ἐπίγνωσιν ἔρχεσθαι를 회개로 강하게 번역할지 여부
  chosen_reading: ‘깨달음에 이르다’로 번역해, 강제된 인식의 수준을 유지했습니다.
  alternative_readings:
  - 회개에 이르다
  - 온전한 지식에 이르다
  rationale: 본문은 ἐπίγνωσις를 말할 뿐 회개(μετάνοια)를 명시하지 않으므로, 징계 아래서의 인식/자각을 보존하고 신학적 결론을 확정하지 않았습니다.
  doctrine_reference: Source-level restraint; preserve theological tension rather than resolve it.
