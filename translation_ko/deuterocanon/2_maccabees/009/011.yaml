  text: Then the great extent of his arrogance began to come to an end[a], shattered, and to come to recognition under a divine scourge[b],
  footnotes:
  - marker: a
    text: Or 'his great arrogance began to cease, broken down.' The Greek phrase τὸ πολὺ τῆς ὑπερηφανίας is somewhat idiomatic and may be rendered more compactly.
