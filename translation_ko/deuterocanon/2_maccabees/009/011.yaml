  text: Then the great extent of his arrogance began to come to an end[a], shattered, and to come to recognition under a divine scourge[b],
  footnotes:
  - marker: a
    text: Or 'his great arrogance began to cease, broken down.' The Greek phrase τὸ πολὺ τῆς ὑπερηφανίας is somewhat idiomatic and may be rendered more compactly.
    reason: lexical_alternative
  - marker: b
    text: Or 'to come to understanding' or 'to come to full knowledge.' The Greek does not by itself require the stronger sense of repentance.
    reason: alternative_reading
translation:
  language: ko
  text: 그때에 그의 교만의 큰 부분이 부서진 채 끝나기 시작했고, 신적인 채찍 아래에서 깨달음에 이르기 시작했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 큰 교만이 부서져 사라지기 시작했다.’ τὸ πολὺ τῆς ὑπερηφανίας는 관용적으로 더 간결하게도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이해하게 되다’, ‘온전한 지식에 이르다’. 헬라어는 여기서 회개까지 직접 요구하지는 않습니다.
    reason: alternative_reading
