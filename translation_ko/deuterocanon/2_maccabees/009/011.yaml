  lexicon: BDAG
  rationale: ἐπίγνωσις를 단순 지식보다 ‘깨달음/인식’으로 옮겨, 징계 아래서 현실을 알아차리는 의미를 유지하되 회개를 과도하게 단정하지 않았습니다.
