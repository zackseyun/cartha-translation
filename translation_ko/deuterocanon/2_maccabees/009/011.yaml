    rationale: τὸ πολὺ τῆς ὑπερηφανίας는 여기서 그의 교만의 크고 과도한 정도를 나타내는 관용적 표현입니다. ‘극심한 교만’이 한국어로 자연스럽고 문맥에도 맞습니다.
