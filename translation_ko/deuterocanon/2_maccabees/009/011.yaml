  text: 그때에 그는 신적 채찍에 맞아 꺾인 채, 그의 극심한 교만을 그치기 시작했고[a], 깨달음에 이르기 시작했습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 교만의 대부분을 그치기 시작했다.’ τὸ πολὺ τῆς ὑπερηφανίας는 관용적으로 ‘그의 큰 교만’ 또는 ‘그의 교만의 대부분’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이해하게 되다’ 또는 ‘온전한 지식에 이르다’. 헬라어는 여기서 회개를 직접 뜻하지는 않습니다.
    reason: alternative_reading
