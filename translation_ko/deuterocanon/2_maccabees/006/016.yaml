  text: Therefore he never withdraws his mercy from us; but while disciplining with calamity, he does not abandon his own people.
translation:
  language: ko
  text: 그러므로 그는 결코 우리에게서 자비를 거두지 않으시며, 재앙으로 징계하시면서도 자기 백성을 버리지 않으십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διόπερ
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이 때문에
  - 따라서
  lexicon: LSJ
  rationale: 앞선 문맥에서 이끌어 내는 결론을 나타내는 접속사이므로, 현대 한국어의 자연스러운 인과·추론 연결어인 ‘그러므로’가 적절합니다.
- source_word: τὸν ἔλεον
  english_pob_choice: his mercy
  chosen_korean: 자기의 긍휼
  alternatives_korean:
  - 그의 긍휼
  - 자비
  lexicon: LSJ
  rationale: ἔλεος는 자비/긍휼의 뜻이지만, 여기서는 하나님께 속한 긍휼을 가리키므로 소유를 드러내는 ‘자기의 긍휼’로 옮겨 원문의 소유 감각을 살렸습니다.
- source_word: παιδεύων
  english_pob_choice: while disciplining
  chosen_korean: 징계하실 때에도
  alternatives_korean:
  - 훈련하실 때에도
  - 교정하실 때에도
  - 징계하면서
  lexicon: LSJ
  rationale: 문맥상 고난을 통한 교정의 의미가 강하므로 ‘징계하다’가 가장 직접적입니다. ‘때에도’를 넣어 뒤의 ‘버리지 않으십니다’와 맞물리는 양보·동시 상황을 자연스럽게 드러냈습니다.
- source_word: τὸν ἑαυτοῦ λαόν
  english_pob_choice: his own people
  chosen_korean: 자기 백성
  alternatives_korean:
  - 그의 백성
  - 자기 소유의 백성
  lexicon: LSJ
  rationale: ἑαυτοῦ의 소유 강조를 한국어에서 가장 간결하게 반영하는 표현은 ‘자기 백성’입니다. ‘그의 백성’보다 강조가 살아 있고, ‘자기 소유의’는 과도하게 무겁습니다.
theological_decisions:
- issue: παιδεύων의 신학적 뉘앙스
  chosen_reading: 고난을 통한 징계로 번역하여, 하나님의 버리심이 아니라 교정적 다루심을 강조했습니다.
  alternative_readings:
  - 훈련으로 번역
  - 교육으로 번역
  - 매질/형벌로 번역
  rationale: 이 절은 재앙이 곧 유기라는 뜻이 아니라, 하나님이 자기 백성을 바로잡기 위해 고난을 사용하신다는 긴장을 담고 있습니다. ‘징계’는 이 긴장을 과도하게 약화시키지 않으면서도 문맥을 잘 드러냅니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
