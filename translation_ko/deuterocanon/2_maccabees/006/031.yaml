base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/031.yaml
  text: So then[a], in this way he passed away, leaving behind his own death as an example of courage and a memorial of virtue[c][b], not only for the young but also for most of the nation.
  footnotes:
  - marker: a
    text: Or 'died.' The Greek uses a more elevated expression than the ordinary verb for dying.
    reason: lexical_alternative
  - marker: b
    text: '''Nobility'' may also be rendered ''courage'' or ''bravery.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'a memorial of moral excellence.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그는 이와 같이 세상을 떠나셨으며[a], 자신의 죽음을 젊은이들뿐 아니라 민족의 대다수에게도 용기의 본보기[b]와 덕을 기억하게 하는 기념[c]으로 남기셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘세상을 떠나셨으며’는 본문의 완곡하고 격조 높은 죽음 표현을 살린 번역입니다. 또는 ‘죽으셨으며’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘용기’는 ‘용맹’, ‘담대함’ 또는 ‘고결한 기개’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘덕의 기념’입니다. ‘덕’은 ἀρετή가 가리키는 윤리적 탁월함을 압축한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
