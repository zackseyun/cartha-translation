  lexicon: LSJ
  rationale: μνημόσυνον의 기념/기억 보존 의미와 ἀρετή의 윤리적 탁월성을 함께 살리되, 한국어에서 가장 간결하고 문맥에 맞는 ‘덕의 기념’으로 옮겼습니다.
- source_word: τοῖς νέοις ... τοῖς πλείστοις τοῦ ἔθνους
  english_pob_choice: not only for the young but also for most of the nation
  chosen_korean: 젊은이들뿐 아니라 민족의 대부분에게
  alternatives_korean:
  - 젊은이들뿐 아니라 백성의 대부분에게
