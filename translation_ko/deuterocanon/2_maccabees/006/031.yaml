  lexicon: LSJ
  rationale: ἔθνος은 이 문맥에서 유대 민족/공동체를 가리키므로 ‘민족’으로 두었고, τοῖς πλείστοις는 과장 없이 ‘대부분’으로 옮겼습니다.
theological_decisions:
- issue: 마르티로스 서술에서의 죽음 표현과 윤리적 평가
  chosen_reading: ‘세상을 떠났습니다’와 ‘본보기’/‘기념’으로 처리해, 죽음을 미화하되 과도한 교리화 없이 본문의 기념비적 어조를 보존했습니다.
  alternative_readings:
  - ‘죽었습니다’로 더 직접적으로 옮김
  - ‘모범’과 ‘미덕’으로 보다 추상적으로 옮김
  rationale: 이 절은 엘르아살의 죽음을 공동체의 기억 속에 남는 윤리적 사례로 제시합니다. 한국어도 그 장중함을 살리되, 평이하고 현대적인 합쇼체로 읽히게 해야 합니다.
  doctrine_reference: 2 Maccabees 6:31 martyrdom context; translation philosophy §§1, 5, 6
