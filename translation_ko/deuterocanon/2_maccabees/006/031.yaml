revisions:
- from: 그러므로 그는 이런 방식으로 세상을 떠났습니다. 그는 자신의 죽음을 젊은이들뿐 아니라 민족의 대부분에게 용맹의 본보기와 덕의 기념으로 남겼습니다.[a][b][c]
  to: 그러므로 그는 이와 같이 세상을 떠나셨으며[a], 자신의 죽음을 젊은이들뿐 아니라 민족의 대다수에게도 용기의 본보기[b]와 덕을 기억하게 하는 기념[c]으로 남기셨습니다.
