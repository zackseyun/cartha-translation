base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/031.yaml
  text: So then[a], in this way he passed away, leaving behind his own death as an example of courage and a memorial of virtue[c][b], not only for the young but also for most of the nation.
  footnotes:
  - marker: a
    text: Or 'died.' The Greek uses a more elevated expression than the ordinary verb for dying.
    reason: lexical_alternative
  - marker: b
    text: '''Nobility'' may also be rendered ''courage'' or ''bravery.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'a memorial of moral excellence.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그는 이런 방식으로 세상을 떠났습니다. 그는 자신의 죽음을 젊은이들뿐 아니라 민족의 대부분에게 용맹의 본보기와 덕의 기념으로 남겼습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘세상을 떠났습니다’는 본문의 완곡하고 격조 높은 죽음 표현을 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘용맹’은 여기서 단순한 용기보다 영웅적 기개와 남성적 담대함을 함께 드러낼 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘덕’은 ἀρετή의 윤리적 탁월함을 한국어로 압축한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετήλλαξεν
  english_pob_choice: passed away
  chosen_korean: 세상을 떠났습니다
  alternatives_korean:
  - 죽었습니다
  - 숨졌습니다
  - 별세했습니다
  lexicon: LSJ
  rationale: 직역의 딱딱함보다 원문의 높임·완곡 표현을 살려, 죽음을 우회적으로 말하는 품위를 한국어에서도 자연스럽게 드러냈습니다.
- source_word: ὑπόδειγμα
  english_pob_choice: example
  chosen_korean: 본보기
  alternatives_korean:
  - 예
  - 모범
  - 예시
  lexicon: LSJ
  rationale: 행위의 반복 가능한 표준을 가리키는 말이므로, 단순한 예시보다 윤리적 모범의 뉘앙스를 가진 ‘본보기’가 적절합니다.
- source_word: γενναιότητος
  english_pob_choice: courage
  chosen_korean: 용맹
  alternatives_korean:
  - 용기
  - 담대함
  - 고귀함
  lexicon: LSJ
  rationale: 문맥상 죽음의 칭송을 받는 남성적·영웅적 기개를 가리키므로, 전투적 용맹까지 포괄하는 ‘용맹’이 가장 가깝습니다.
- source_word: μνημόσυνον ἀρετῆς
  english_pob_choice: a memorial of virtue
  chosen_korean: 덕의 기념
  alternatives_korean:
  - 덕의 기념물
  - 미덕의 기념
  - 도덕적 탁월함의 기념
  lexicon: LSJ
  rationale: μνημόσυνον의 기념/기억 보존 의미와 ἀρετή의 윤리적 탁월성을 함께 살리되, 한국어에서 가장 간결하고 문맥에 맞는 ‘덕의 기념’으로 옮겼습니다.
- source_word: τοῖς νέοις ... τοῖς πλείστοις τοῦ ἔθνους
  english_pob_choice: not only for the young but also for most of the nation
  chosen_korean: 젊은이들뿐 아니라 민족의 대부분에게
  alternatives_korean:
  - 젊은이들뿐 아니라 백성의 대부분에게
  - 젊은이들뿐 아니라 민족의 대다수에게
  lexicon: LSJ
  rationale: ἔθνος은 이 문맥에서 유대 민족/공동체를 가리키므로 ‘민족’으로 두었고, τοῖς πλείστοις는 과장 없이 ‘대부분’으로 옮겼습니다.
theological_decisions:
- issue: 마르티로스 서술에서의 죽음 표현과 윤리적 평가
  chosen_reading: ‘세상을 떠났습니다’와 ‘본보기’/‘기념’으로 처리해, 죽음을 미화하되 과도한 교리화 없이 본문의 기념비적 어조를 보존했습니다.
  alternative_readings:
  - ‘죽었습니다’로 더 직접적으로 옮김
  - ‘모범’과 ‘미덕’으로 보다 추상적으로 옮김
  rationale: 이 절은 엘르아살의 죽음을 공동체의 기억 속에 남는 윤리적 사례로 제시합니다. 한국어도 그 장중함을 살리되, 평이하고 현대적인 합쇼체로 읽히게 해야 합니다.
  doctrine_reference: 2 Maccabees 6:31 martyrdom context; translation philosophy §§1, 5, 6
