base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/012.yaml
  text: Therefore I urge those who read this book not to be disheartened because of these calamities[a], but to consider that these punishments are not for destruction[c][b], but for the discipline of our people.
  footnotes:
  - marker: a
    text: Or 'those who read this book.' The Greek expression literally speaks of those 'encountering' this book.
    reason: lexical_alternative
  - marker: b
    text: Or 'not to lose heart.'
    reason: lexical_alternative
  - marker: c
    text: '''Discipline'' can also be rendered ''instruction'' or ''correction''; the Greek includes the sense of formative chastening.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이 책을 접하는 사람들에게 청하노니, 이 재앙들 때문에 낙심하지 말고, 이 벌들이 파멸을 위한 것이 아니라 오히려 우리 민족의 훈육을 위한 것이라고 생각하십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 책을 읽는 사람들’로 옮길 수 있습니다. 그리스어 표현은 문자적으로는 이 책을 ‘접하는’ 사람들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘낙심하지 말고’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘훈육’은 ‘교훈’이나 ‘교정’으로도 옮길 수 있으며, 그리스어는 형성적 징계의 뜻을 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  english_pob_choice: I urge
  chosen_korean: 청하노니
  alternatives_korean:
  - 권합니다
  - 간청합니다
  - 촉구합니다
  lexicon: BDAG
  rationale: 서술자의 간절한 권고를 자연스럽게 살리면서도, 본문의 호소적 어조를 너무 강하게 명령형으로 바꾸지 않기 위해 ‘청하노니’로 옮겼습니다.
- source_word: τοὺς ἐντυγχάνοντας τῇδε τῇ βίβλῳ
  english_pob_choice: those who encounter this book
  chosen_korean: 이 책을 접하는 사람들
  alternatives_korean:
  - 이 책을 읽는 사람들
  - 이 책을 만나는 사람들
  - 이 책에 접하는 사람들
  lexicon: LSJ
  rationale: ἐντυγχάνω의 ‘마주하다/접하다’라는 뜻을 살려, 단순한 ‘읽다’보다 원문의 폭을 보존하면서도 한국어로 자연스럽게 표현했습니다.
- source_word: μὴ συντελεσθαι
  english_pob_choice: not to be disheartened
  chosen_korean: 낙심하지 말고
  alternatives_korean:
  - 기운이 꺾이지 말고
  - 마음이 무너지지 말고
  - 좌절하지 말고
  lexicon: LSJ
  rationale: ‘끝장나다’에 가까운 내적 꺾임의 뉘앙스를 한국어 관용적으로 드러내는 표현으로 ‘낙심하다’를 선택했습니다.
- source_word: τὰς τιμωρίας
  english_pob_choice: these punishments
  chosen_korean: 이 벌들
  alternatives_korean:
  - 이 형벌들
  - 이 징벌들
  - 이 징계들
  lexicon: LSJ
  rationale: τιμωρία의 핵심은 응보적 처벌이므로, 교정적 뉘앙스를 과도하게 덧입히지 않는 ‘벌’로 옮겼습니다.
- source_word: πρὸς παιδείαν
  english_pob_choice: for the discipline
  chosen_korean: 훈육을 위한
  alternatives_korean:
  - 교훈을 위한
  - 훈련을 위한
  - 징계를 위한
  lexicon: BDAG
  rationale: παιδεία의 형성적·교정적 의미를 담기 위해 ‘훈육’을 선택해, 단순한 정보 전달인 ‘교훈’보다 본문이 말하는 징계와 형성의 긴장을 살렸습니다.
- source_word: τοῦ γένους ἡμῶν
  english_pob_choice: of our people
  chosen_korean: 우리 민족의
  alternatives_korean:
  - 우리 ժողովրդի의
  - 우리 백성의
  - 우리 공동체의
  lexicon: LSJ
  rationale: γένος는 혈연·민족적 집단을 가리키므로, 유대 민족 전체를 가리키는 문맥에 맞게 ‘우리 민족’으로 옮겼습니다.
theological_decisions:
- issue: 재앙과 벌의 목적을 파멸이 아닌 교정으로 제시하는 대비
  chosen_reading: 본문의 고난은 파멸을 위한 것이 아니라 우리 민족을 훈육하는 목적을 지닌 것으로 진술됩니다.
  alternative_readings:
  - 고난은 단지 역사적 불운을 뜻합니다
  - 벌은 일반적 도덕 교육만을 뜻합니다
  rationale: μὴ πρὸς ὄλεθρον, ἀλλὰ πρὸς παιδείαν의 대조를 그대로 살려, 고난을 소멸이 아닌 교정으로 읽는 본문의 신학적 긴장을 유지했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
