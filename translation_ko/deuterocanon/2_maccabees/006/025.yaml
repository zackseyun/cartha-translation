base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/025.yaml
  text: and they too[a], because of my hypocrisy and because of this brief and momentary life, might be led astray because of me[c][b], and I would acquire hatred and a stain upon my old age.
  footnotes:
  - marker: a
    text: Or 'pretense' or 'dissimulation' for 'hypocrisy.' The Greek refers to feigned behavior that would mislead observers.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'because of the brief and momentary living'—that is, for the sake of a short remaining span of life.
    reason: lexical_alternative
  - marker: c
    text: '''Hatred'' may also be understood as ''abhorrence'' or ''loathing,'' emphasizing public revulsion.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들도 내 위선과 이 짧고 순간적인 삶 때문에 나로 말미암아 길을 잃게 될 것이며, 나는 내 노년에 대한 미움과 더러움을 얻게 될 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘위선’은 여기서 단순한 예의 없는 태도가 아니라, 보는 이들을 오도할 수 있는 가장된 행위를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘짧고 순간적인 삶’으로, 잠시 남은 생존을 위해 신앙을 훼손하는 선택을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘길을 잃게 될’은 단순한 착각보다 도덕적·영적 오도까지 포함합니다.
    reason: lexical_alternative
