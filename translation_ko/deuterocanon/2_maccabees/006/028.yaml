  text: thus leaving to the young a noble example of dying willingly and bravely for the revered and holy laws. And after saying these things[a], he immediately went to the rack,
  footnotes:
  - marker: a
    text: Greek τύμπανον, literally 'drum,' here referring to an instrument of torture; hence 'rack.'
