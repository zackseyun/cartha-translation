translation:
  language: ko
  text: 그리하여 그는 젊은이들에게 존귀하고 거룩한 율법을 위하여 기꺼이 그리고 용감하게 죽는 고귀한 본보기를 남기고, 이 모든 말을 마친 뒤 곧바로 고문대[a]로 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 τύμπανον은 문자적으로는 ‘드럼’이지만, 여기서는 고문 기구를 가리키므로 ‘고문대’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς δὲ νέοις
  english_pob_choice: to the young
  chosen_korean: 젊은이들에게
  alternatives_korean:
  - 젊은 사람들에게
  - 청년들에게
  lexicon: LSJ
  rationale: 여격의 수혜/참조 대상을 자연스럽게 살리면서, 남성에만 한정되지 않는 넓은 대상이라는 점을 반영했습니다.
- source_word: ὑπόδειγμα γενναῖον
  english_pob_choice: a noble example
  chosen_korean: 고귀한 본보기
  alternatives_korean:
  - 용감한 본보기
  - 고결한 본보기
  lexicon: BDAG/LSJ
  rationale: ὑπόδειγμα는 ‘본보기/모범’이고 γενναῖον은 ‘고귀한, 고상한, 용맹한’의 뉘앙스가 있어, 두 요소를 함께 살리는 표현을 택했습니다.
- source_word: προθύμως καὶ γενναίως
  english_pob_choice: willingly and bravely
  chosen_korean: 기꺼이 그리고 용감히
  alternatives_korean:
  - 자원하여 그리고 담대히
  - 열심히 그리고 용감히
  lexicon: BDAG/LSJ
  rationale: 순교 문맥에서 προθύμως의 자발성/기꺼이 함과 γενναίως의 담대함을 함께 드러내는 가장 자연스러운 합쇼체 표현입니다.
- source_word: ὑπὲρ τῶν σεμνῶν καὶ ἁγίων νόμων
  english_pob_choice: for the revered and holy laws
  chosen_korean: 존귀하고 거룩한 율법을 위한
  alternatives_korean:
  - 경건하고 거룩한 율법을 위한
  - 존엄하고 거룩한 율법을 위한
  lexicon: LSJ
  rationale: σεμνῶν은 단순한 ‘존경받는’보다 ‘존귀한’이 더 가깝고, ἁγίων은 ‘거룩한’으로 직역했습니다. νόμων은 유대교 문맥상 ‘율법’으로 옮겼습니다.
- source_word: ἐπὶ τὸ τύμπανον
  english_pob_choice: to the rack
  chosen_korean: 고문대
  alternatives_korean:
  - 랙
  - 형틀
  - 고문틀
  lexicon: LSJ
  rationale: τύμπανον은 여기서 타악기가 아니라 고문 기구를 가리키므로, 기능적 의미를 드러내는 ‘고문대’를 채택했습니다.
theological_decisions:
