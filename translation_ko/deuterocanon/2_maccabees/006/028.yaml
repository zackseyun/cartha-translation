  text: τοῖς δὲ νέοις ὑπόδειγμα γενναῖον καταλελοιπὼς εἰς τὸ προθύμως καὶ γενναίως ὑπὲρ τῶν σεμνῶν καὶ ἁγίων νόμων ἀπευθανατίζειν. τοσαῦτα δὲ εἰπὼν ἐπὶ τὸ τύμπανον εὐθέως ἦλθεν,
