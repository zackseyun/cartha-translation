  text: thus leaving to the young a noble example of dying willingly and bravely for the revered and holy laws. And after saying these things[a], he immediately went to the rack,
  footnotes:
  - marker: a
    text: Greek τύμπανον, literally 'drum,' here referring to an instrument of torture; hence 'rack.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 젊은이들에게 죽음을 기꺼이 그리고 용감히 맞이하는, 존귀하고 거룩한 율법을 위한 고귀한 본보기를 남겼습니다. 그리고 이 말을 마치고 그는 곧바로 고문대[ᵃ]로 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 τύμπανον은 문자적으로는 ‘드럼’이지만, 여기서는 고문 기구를 가리키므로 ‘고문대’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς δὲ νέοις
  english_pob_choice: to the young
  chosen_korean: 젊은이들에게
  alternatives_korean:
  - 젊은 사람들에게
  - 청년들에게
  lexicon: LSJ
  rationale: 여격의 수혜/참조 대상을 자연스럽게 살리면서, 남성에만 한정되지 않는 넓은 대상이라는 점을 반영했습니다.
- source_word: ὑπόδειγμα γενναῖον
  english_pob_choice: a noble example
  chosen_korean: 고귀한 본보기
  alternatives_korean:
  - 용감한 본보기
  - 고결한 본보기
  lexicon: BDAG/LSJ
  rationale: ὑπόδειγμα는 ‘본보기/모범’이고 γενναῖον은 ‘고귀한, 고상한, 용맹한’의 뉘앙스가 있어, 두 요소를 함께 살리는 표현을 택했습니다.
- source_word: προθύμως καὶ γενναίως
  english_pob_choice: willingly and bravely
  chosen_korean: 기꺼이 그리고 용감히
  alternatives_korean:
  - 자원하여 그리고 담대히
  - 열심히 그리고 용감히
  lexicon: BDAG/LSJ
  rationale: 순교 문맥에서 προθύμως의 자발성/기꺼이 함과 γενναίως의 담대함을 함께 드러내는 가장 자연스러운 합쇼체 표현입니다.
- source_word: ὑπὲρ τῶν σεμνῶν καὶ ἁγίων νόμων
  english_pob_choice: for the revered and holy laws
  chosen_korean: 존귀하고 거룩한 율법을 위한
  alternatives_korean:
  - 경건하고 거룩한 율법을 위한
  - 존엄하고 거룩한 율법을 위한
  lexicon: LSJ
  rationale: σεμνῶν은 단순한 ‘존경받는’보다 ‘존귀한’이 더 가깝고, ἁγίων은 ‘거룩한’으로 직역했습니다. νόμων은 유대교 문맥상 ‘율법’으로 옮겼습니다.
- source_word: ἐπὶ τὸ τύμπανον
  english_pob_choice: to the rack
  chosen_korean: 고문대
  alternatives_korean:
  - 랙
  - 형틀
  - 고문틀
  lexicon: LSJ
  rationale: τύμπανον은 여기서 타악기가 아니라 고문 기구를 가리키므로, 기능적 의미를 드러내는 ‘고문대’를 채택했습니다.
theological_decisions:
- issue: 순교의 가치평가를 희석하지 않을지 여부
  chosen_reading: 젊은이들에게 남긴 ‘고귀한 본보기’와 ‘기꺼이 그리고 용감히’라는 평가를 그대로 살렸습니다.
  alternative_readings:
  - 더 중립적으로 ‘죽는 모습’ 정도로 완화하기
  - ‘용감히’만 남기고 ‘기꺼이’는 약화하기
  rationale: 원문은 엘르아살의 죽음을 모범적이고 칭찬할 만한 것으로 제시하므로, 그 신학적·윤리적 평가를 완화하지 않았습니다.
  doctrine_reference: 원문 우선 원칙; 순교 본문의 가치 판단 보존
