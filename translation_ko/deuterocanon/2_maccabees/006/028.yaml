  chosen_reading: 젊은이들에게 남긴 ‘고귀한 본보기’와 ‘기꺼이 그리고 용감히’라는 평가를 그대로 살렸습니다.
  alternative_readings:
  - 더 중립적으로 ‘죽는 모습’ 정도로 완화하기
  - ‘용감히’만 남기고 ‘기꺼이’는 약화하기
  rationale: 원문은 엘르아살의 죽음을 모범적이고 칭찬할 만한 것으로 제시하므로, 그 신학적·윤리적 평가를 완화하지 않았습니다.
  doctrine_reference: 원문 우선 원칙; 순교 본문의 가치 판단 보존
