base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/023.yaml
  text: But he[a], adopting a noble resolve worthy of his age and of the dignity of old age, and of the distinction of his acquired and honored way of life, and of the finest conduct from childhood—rather, in keeping with the holy and God-given law—declared himself plainly, saying that they should send him quickly to Hades.
  footnotes:
  - marker: a
    text: 'Or ''send him quickly to the realm of the dead.'' Greek: ''to Hades.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 나이에 어울리고 노년의 위엄에 걸맞으며, 자신이 쌓아 온 존귀한 생활 방식과 어릴 때부터 가장 훌륭했던 품행을 돌아보면서—그보다도 거룩하고 하나님이 세우신 율법에 따라—분명히 선언하였으니, 곧 그를 속히 하데스로 보내라고 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “죽은 자들의 세계로.” 그리스어는 “하데스”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λογισμὸν ἀστεῖον ἀναλαβών
  english_pob_choice: adopting a noble resolve
  chosen_korean: 나이에 어울리고 노년의 위엄에 걸맞은 결심을 품고
  alternatives_korean:
  - 고상한 판단을 받아들이고
  - 품위 있는 생각을 취하고
  - 훌륭한 결단을 내리고
  lexicon: LSJ
  rationale: λογισμός는 단순한 ‘생각’보다 숙고된 결심이나 판단에 가깝고, ἀστεῖος는 여기서 도덕적으로 ‘고상한/품위 있는’ 뉘앙스를 가지므로 그 결합을 자연스러운 한국어로 살렸습니다.
- source_word: ἐπικτήτου καὶ ἐπιφανοῦς πολιτείας
  english_pob_choice: his acquired and honored way of life
  chosen_korean: 자신이 쌓아 온 존귀한 생활 방식
  alternatives_korean:
  - 획득한 빛나는 삶의 방식
  - 얻어 온 훌륭한 시민적 삶
  - 획득한 존귀한 생활 방식
  lexicon: LSJ
  rationale: πολιτεία는 여기서 제도적 ‘시민권’보다 삶의 태도/생활 양식을 가리키며, ἐπίκτητος·ἐπιφανής의 결합은 ‘쌓아 온’과 ‘존귀한’으로 옮겨 전체 수식 관계를 유지했습니다.
- source_word: ἐκ παιδὸς καλλίστης ἀναστροφῆς
  english_pob_choice: the finest conduct from childhood
  chosen_korean: 어릴 때부터 가장 훌륭했던 품행
  alternatives_korean:
  - 어릴 적부터 가장 훌륭했던 행실
  - 어린 시절부터의 뛰어난 삶의 방식
  - 어릴 때부터의 훌륭한 처신
  lexicon: BDAG
  rationale: ἀναστροφή는 ‘행실/품행’의 뜻이 적절하며, παιδός를 살려 ‘어릴 때부터’로 옮겨 성장기부터 이어진 도덕적 삶을 드러냈습니다.
- source_word: τῆς ἁγίας καὶ θεοκτίστου νομοθεσίας
  english_pob_choice: the holy and God-given law
  chosen_korean: 거룩하고 하나님이 세우신 율법
  alternatives_korean:
  - 거룩하고 하나님이 주신 율법
  - 거룩하고 신적으로 세워진 법
  - 거룩하고 하나님이 제정하신 율법
  lexicon: LSJ
  rationale: νομοθεσία는 추상적 ‘입법’이 아니라 모세 율법 자체를 가리키므로 관용적으로 ‘율법’으로 옮겼고, θεοκτίστος의 신적 기원을 ‘하나님이 세우신’으로 풀었습니다.
- source_word: προπέμπειν εἰς τὸν ᾅδην
  english_pob_choice: send him quickly to Hades
  chosen_korean: 그를 속히 하데스로 보내라고
  alternatives_korean:
  - 그를 속히 죽은 자들의 세계로 보내라고
  - 그를 속히 무덤으로 보내라고
  - 그를 속히 음부로 보내라고
  lexicon: LSJ
  rationale: ᾅδης는 지옥 개념을 덧씌우지 않고 그리스어 고유명 ‘하데스’로 보존하는 것이 원문 의미를 가장 투명하게 드러냅니다.
theological_decisions:
- issue: ᾅδης의 번역 처리
  chosen_reading: 하데스
  alternative_readings:
  - 죽은 자들의 세계
  - 무덤
  - 음부
  rationale: 본문은 최종 심판의 ‘지옥’이 아니라 그리스어 ᾅδης 자체를 지칭하므로, 원문 용어를 유지해 의미의 긴장을 보존했습니다.
  doctrine_reference: 원어 우선 원칙과 종말론 용어 구별 유지
- issue: νομοθεσία를 ‘율법’으로 옮김
  chosen_reading: 거룩하고 하나님이 세우신 율법
  alternative_readings:
  - 거룩하고 하나님이 세우신 입법
  - 거룩하고 하나님이 제정하신 법
  rationale: 문맥상 모세 율법을 가리키므로, 추상 명사 ‘입법’보다 독자가 즉시 이해할 수 있는 ‘율법’을 사용하되 신적 기원을 분명히 했습니다.
  doctrine_reference: 유대 경건 전통과 본문 문맥의 일치
- issue: ἀπεφήνατο의 반사적 뉘앙스
  chosen_reading: 분명히 선언하였으니
  alternative_readings:
  - 자신의 입장을 분명히 밝혔으니
  - 분명히 자기 뜻을 드러내었으니
  rationale: 문맥상 그는 단순 발언이 아니라 자기 입장을 공개적으로 표명한 것이므로, ‘분명히 선언하였으니’로 압축해 서술의 힘을 살렸습니다.
  doctrine_reference: 서술체의 직접성 유지
