  to: 그러나 그는 자신의 나이와 노년의 탁월함과 자신이 얻은 빛나는 삶의 방식과 어린 시절부터의 가장 훌륭한 행실에, 아니, 그보다 더욱 거룩하고 하나님께서 세우신 율법에 걸맞은 고결한 결심을 품고, 그 율법에 따라 분명히 말하였습니다. 곧 자신을 속히 하데스로 보내라고 하였습니다.[a]
