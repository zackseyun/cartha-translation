  rationale: μύσος는 단순한 감정적 혐오보다 도덕적·종교적 부정/더러움의 뉘앙스가 강하므로, 문맥의 순교 서사에 맞게 ‘부정함’으로 옮겼습니다.
- source_word: αὐθαιρέτως
