lexical_decisions:
- source_word: μετʼ εὐκλείας
  english_pob_choice: with honor
  chosen_korean: 영예로운
  alternatives_korean:
  - 명예로운
  - 좋은 평판의
  - 영광의
  lexicon: LSJ
  rationale: εὐκλεία는 좋은 평판, 명예, 영예를 가리키므로 문맥상 간결하고 자연스러운 ‘영예로운’이 적절합니다.
- source_word: μᾶλλον ἢ
  english_pob_choice: rather than
  chosen_korean: 보다 더 낫다고 여기며
  alternatives_korean:
  - ~보다
  - ~보다 더
  - ~하기보다
  lexicon: LSJ
  rationale: 그리스어의 선호·대조 구조를 한국어에서 자연스럽게 살리기 위해 ‘~보다 더 낫다고 여기며’로 옮겼습니다.
- source_word: μετὰ μύσους βίον
  english_pob_choice: a life with defilement
  chosen_korean: 부정함이 있는 삶
  alternatives_korean:
  - 더러움이 있는 삶
  - 오염된 삶
  - 수치스러운 삶
  lexicon: LSJ
  rationale: μύσος는 단순한 감정적 혐오보다 도덕적·종교적 부정/더러움의 뉘앙스가 강하므로, 문맥의 순교 서사에 맞게 ‘부정함’으로 옮겼습니다.
- source_word: αὐθαιρέτως
  english_pob_choice: of his own accord
  chosen_korean: 자발적으로
  alternatives_korean:
  - 스스로
  - 기꺼이
  - 자진하여
  lexicon: LSJ
  rationale: 자기 의지로 나아가는 강조를 간결하게 살리되, 문어체로도 자연스러운 표현을 택했습니다.
- source_word: ἐπὶ τὸ τύμπανον
  english_pob_choice: to the rack
  chosen_korean: 형틀로
  alternatives_korean:
  - 고문 기구로
  - 드럼으로
  - 고문대로
  lexicon: LSJ
  rationale: τύμπανον은 여기서 음악적 ‘드럼’이 아니라 고문 도구를 뜻하므로 기능을 드러내는 ‘형틀’이 현대 한국어 독자에게 가장 자연스럽습니다.
theological_decisions:
- issue: τύμπανον의 구체성 유지 여부
  chosen_reading: ‘형틀’로 기능을 전달하되, 고문 도구라는 사실만 본문에 남겼습니다.
  alternative_readings:
  - ‘드럼’처럼 더 문자적으로 옮김
  - ‘고문기구’처럼 더 설명적으로 옮김
  rationale: 고대 장치의 정확한 형태는 불확실하지만, 문맥은 명백히 고문 상황이므로 의미 기능을 우선해 독자 오해를 줄였습니다.
  doctrine_reference: '번역 원칙: 가독성과 원문 기능의 동시 보존'
