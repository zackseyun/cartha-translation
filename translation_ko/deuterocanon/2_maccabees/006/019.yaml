  lexicon: LSJ
  rationale: τύμπανον은 여기서 음악적 ‘드럼’이 아니라 고문 도구를 뜻하므로 기능을 드러내는 ‘형틀’이 현대 한국어 독자에게 가장 자연스럽습니다.
