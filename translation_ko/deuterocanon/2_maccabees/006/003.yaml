lexical_decisions:
- source_word: χαλεπὴ
  english_pob_choice: harsh
  chosen_korean: 가혹하고
  alternatives_korean:
  - 심하고
  - 엄하고
  - 혹독하고
  lexicon: LSJ
  rationale: χαλεπὴ는 심한 강도와 거칠고 가혹한 성격을 함께 담고 있어, ‘가혹하고’로 옮기면 뒤의 δυσχερής와도 중복을 피하면서 자연스럽게 강도를 살릴 수 있습니다.
- source_word: δυσχερὴς
  english_pob_choice: grievous
  chosen_korean: 견디기 어려웠습니다
  alternatives_korean:
  - 괴로웠습니다
  - 고통스러웠습니다
  - 무거웠습니다
  lexicon: LSJ
  rationale: δυσχερής는 감당하거나 견디기 어려운 상태를 뜻하므로, 한국어로는 결과 상태를 드러내는 ‘견디기 어려웠습니다’가 의미를 가장 분명하게 전달합니다.
- source_word: ἡ ἐπίστασις
  english_pob_choice: the pressure
  chosen_korean: 압박
  alternatives_korean:
  - 압력
  - 강요
  - 가해
  - 침박
  lexicon: LSJ
  rationale: 이 문맥에서 ἐπίστασις는 단순한 ‘시작’보다 죄악이 사람들 위에 눌러오는 억압적 작용을 가리키므로, ‘압박’이 POB의 ‘pressure’를 가장 잘 살립니다.
- source_word: τοῖς ὅλοις
  english_pob_choice: for everyone
  chosen_korean: 모든 사람에게
  alternatives_korean:
  - 모두에게
  - 전부에게
  - 온 백성에게
  lexicon: LSJ
  rationale: τοῖς ὅλοις는 포괄적 의미의 ‘모든 이들’이므로, 현대 한국어로는 ‘모든 사람에게’가 가장 명료하고 직역에 가깝습니다.
theological_decisions:
- issue: τῆς κακίας의 지시 대상
  chosen_reading: 이미 서술된 구체적인 악한 압제와 강요를 가리키는 표현으로 읽었습니다.
  alternative_readings:
  - 추상적 악 자체로 읽는 해석
  - 개인의 악의라는 심리적 성격으로 읽는 해석
  rationale: 문맥상 이는 일반론이 아니라 앞서 언급된 종교적 강요와 박해의 현실을 가리키므로, ‘이 악’의 구체성을 살리되 과도한 해석 확장은 피했습니다.
  doctrine_reference: 문맥 우선 해석, 2 Maccabees 6장 박해 서술
