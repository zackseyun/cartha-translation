  yaml_path: translation/deuterocanon/2_maccabees/006/004.yaml
  text: For the sanctuary was filled by the Gentiles with debauchery and revelry, boldly carousing with prostitutes, approaching women in the sacred precincts, and even bringing inside things that were not proper.
  footnotes:
  - marker: a
    text: Or 'courtesans' for 'prostitutes'; the Greek ἑταίρων can denote women kept for sexual companionship.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'approaching women' likely implies sexually improper conduct in the sacred precincts, though the Greek wording is less explicit than 'having relations with women.'
    reason: lexical_alternative
translation:
  language: ko
  text: 성전은 이방인들이 방탕과 흥청거림으로 가득 채웠습니다. 그들은 매춘부들과 뻔뻔하게 어울리고[a], 성전의 거룩한 구역들에서 여자들에게 가까이 다가가며[b], 심지어 마땅하지 않은 것들까지 안으로 들여왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἑταίρων은 여기서 단순한 ‘동반자’보다 성적 동반자나 매춘부를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘여자들에게 가까이 다가가며’는 문맥상 성전 안에서의 성적으로 부적절한 행동을 암시하지만, 그리스어 표현 자체는 ‘성관계를 가지다’보다 덜 직접적입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερὸν
  english_pob_choice: sanctuary
  chosen_korean: 성소
  alternatives_korean:
  - 성전
  - 성역
  lexicon: LSJ
  rationale: 이 문맥에서는 예루살렘 성전 전체의 거룩한 공간이 더럽혀지는 상황이므로, ‘성소’가 cultic한 의미를 유지하면서도 자연스럽습니다.
- source_word: ἀσωτίας
  english_pob_choice: debauchery
  chosen_korean: 방탕
  alternatives_korean:
  - 방종
  - 음란
  - 타락
  lexicon: LSJ
  rationale: 절제 없는 도덕적·성적 문란을 가리키는 말로, ‘방탕’이 현대 한국어에서 가장 직접적이고 무게감 있게 대응합니다.
- source_word: κώμων
  english_pob_choice: revelry
  chosen_korean: 흥청거림
  alternatives_korean:
  - 환락
  - 난잡한 연회
  - 유흥
  lexicon: LSJ
  rationale: 흥청거림은 시끄럽고 난잡한 향락을 잘 살리며, 앞의 ‘방탕’과도 어울립니다.
- source_word: ἑταίρων
  english_pob_choice: prostitutes
  chosen_korean: 창녀들
  alternatives_korean:
  - 매춘부들
  - 동반녀들
  - 기녀들
  lexicon: LSJ
  rationale: 여기서는 단순한 ‘동행 여성’이 아니라 성적 동반자/매춘의 뉘앙스가 강하므로, 문맥상 분명한 성적 의미를 드러내는 ‘창녀들’을 택했습니다.
- source_word: ἐν τοῖς ἱεροῖς
  english_pob_choice: in the sacred precincts
  chosen_korean: 성스러운 구역 안에서
  alternatives_korean:
  - 거룩한 뜰 안에서
  - 성전 뜰 안에서
  - 거룩한 구역 안에서
  lexicon: LSJ
  rationale: 복수형은 성전의 여러 거룩한 영역을 가리키므로, 특정 구조로 좁히지 않고 공간적 범위를 살리는 표현을 사용했습니다.
- source_word: τὰ μὴ καθήκοντα
  english_pob_choice: things that were not proper
  chosen_korean: 마땅하지 않은 것들
  alternatives_korean:
  - 부적절한 것들
  - 합당하지 않은 것들
  - 하지 말아야 할 것들
  lexicon: LSJ
  rationale: 그릇된 행위뿐 아니라 들여온 물건까지 포함할 수 있는 넓은 표현이므로, 원문의 의도적 포괄성을 유지했습니다.
theological_decisions:
- issue: θρασυνόντων μεθʼ ἑταίρων의 성적·도덕적 수위
  chosen_reading: ‘뻔뻔하게 어울리며’로 번역해, 노골성을 과도하게 덧붙이지 않되 문맥상 성전 모독의 음란성을 드러냈습니다.
  alternative_readings:
  - ‘창녀들과 대담하게 술판을 벌이며’
  - ‘창녀들과 뻔뻔하게 흥청거리며’
  rationale: 그리스어는 직접적 성행위 동사를 쓰지 않으므로, 본문이 허용하는 수준에서만 성적 타락의 함의를 살렸습니다.
  doctrine_reference: Translation philosophy §3
