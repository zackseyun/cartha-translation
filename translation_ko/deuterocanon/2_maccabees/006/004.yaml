  source_fidelity: 그리스어는 성전(ἱερόν)이 이방인들에 의해 방탕과 흥청거림으로 가득 차고, 그들이 ἑταῖραι와 뻔뻔스럽게 어울리며 성스러운 여러 구역에서 여자들에게 가까이 다가가고 부당한 것들을 안으로 들여오는 모습을 열거합니다. 초안의 의미는 대체로 충실하지만, ἱερόν은 이 문맥에서 성전 전체 또는 성전 경내를 가리키므로 ‘성소’보다 ‘성전’이 더 정확합니다. 또한 각주 표지는 해당 표현 바로 뒤에 두는 편이 검증과 독해에 적절합니다.
