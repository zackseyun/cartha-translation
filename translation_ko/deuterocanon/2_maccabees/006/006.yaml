base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/006.yaml
  text: And it was permitted neither to keep the Sabbath[a], nor to observe the ancestral festivals, nor even simply to acknowledge being a Jew.
  footnotes:
  - marker: a
    text: Or 'a Judean,' if taken in a more geographic-ethnic sense; here the context of banned Sabbath observance and festivals favors 'a Jew.'
    reason: lexical_alternative
translation:
  language: ko
  text: 안식일을 지키는 것도, 조상들의 절기를 지키는 것도, 심지어 단지 유대인이라고 인정하는 것도 허용되지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다인’으로, 더 지리·민족적 의미로 이해할 수 있습니다. 그러나 여기서는 안식일과 절기 금지의 문맥상 ‘유대인’이 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δʼ οὔτε
  english_pob_choice: it was permitted neither
  chosen_korean: 허용되지 않았습니다
  alternatives_korean:
  - 가능하지 않았습니다
  - 금지되었습니다
  lexicon: LSJ
  rationale: 부정된 비인칭 구문으로서 제도적 억압의 상태를 나타내므로, 현대 한국어에서는 ‘허용되지 않았습니다’가 가장 자연스럽고 원문의 상황을 잘 드러냅니다.
- source_word: σαββατίζειν
  english_pob_choice: to keep the Sabbath
  chosen_korean: 안식일을 지키는 것
  alternatives_korean:
  - 안식일을 준수하는 것
  - 안식일을 지키는 일
  lexicon: LSJ
  rationale: 유대적 종교 관행을 가리키는 동사이므로 ‘지키다’가 직관적이며, 문맥상 예배/준수 행위를 분명히 합니다.
- source_word: πατρίους ἑορτὰς διαφυλάττειν
  english_pob_choice: to observe the ancestral festivals
  chosen_korean: 조상들의 절기를 지키는 것
  alternatives_korean:
  - 조상들의 축제를 지키는 것
  - 선조들의 절기를 준수하는 것
  lexicon: LSJ
  rationale: πατρίους는 ‘조상들의’라는 혈통·전승의 뉘앙스를 가지므로, 축제보다 종교적 절기 의미가 선명한 ‘절기’를 택했습니다.
- source_word: ἁπλῶς Ἰουδαῖον ὁμολογεῖν εἶναι
  english_pob_choice: nor even simply to acknowledge being a Jew
  chosen_korean: 심지어 단지 유대인이라고 인정하는 것
  alternatives_korean:
  - 심지어 단지 유대인임을 인정하는 것
  - 심지어 유대인이라고 고백하는 것
  lexicon: LSJ
  rationale: ὁμολογεῖν은 공개적 인정/고백이지만, 여기서는 신앙 고백보다 정체성의 표명을 가리키므로 ‘인정하다’가 과도한 교회적 색채를 피합니다.
- source_word: Ἰουδαῖον
  english_pob_choice: a Jew
  chosen_korean: 유대인
  alternatives_korean:
  - 유대 사람
  - 유다 사람
  lexicon: LSJ
  rationale: 이 문맥은 종교·민족 정체성 전체가 억압되는 상황이므로, 한국어에서는 ‘유대인’이 가장 직접적으로 대응합니다.
theological_decisions:
- issue: 세 번째 금지 항목의 정체성 표현
  chosen_reading: ‘유대인이라고 인정하는 것’으로 옮겨 공개적 자기 동일시의 금지를 드러냈습니다.
  alternative_readings:
  - ‘유대인임을 고백하는 것’
  - ‘유대인이라고 말하는 것’
  rationale: 본문은 단순한 사적 생각이 아니라 공개적 정체성 표명을 포함한 사회적 억압을 말하므로, ‘인정하다’가 문맥상 가장 균형 잡힌 표현입니다.
  doctrine_reference: '번역 원칙: 원문이 드러내는 역사적 종교 정체성의 억압을 약화시키지 않음.'
