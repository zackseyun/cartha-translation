base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/021.yaml
  text: But those who had been appointed over the unlawful meal[a], because of their long-standing acquaintance with the man, took him aside privately and urged him to bring meat that it was proper for him to use, prepared by himself, and to pretend that he was eating the meats from the sacrifice that had been ordered by the king[b],
  footnotes:
  - marker: a
    text: Or 'out of compassion, because of their acquaintance with him from long ago.' The Greek explicitly includes the idea of pity/compassion (σπλαγχνισμοῦ).
    reason: lexical_alternative
  - marker: b
    text: Literally 'the meats from the sacrifice'; that is, meat from pagan sacrificial offerings that the king had ordered him to eat.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 불법한 제물에 관해 맡겨진 이들은, 그 남자와 오래전부터 알고 지낸 사이였으므로, 그를 따로 불러내어 자기들이 마련한 것을 그가 쓰기에 마땅한 고기를 가져오라고 권하며, 왕이 정한 제물의 고기를 먹는 척하라고 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘불법한 것들/불법한 제의’입니다. 문맥상 왕이 강요한 우상제물 섭취를 가리킵니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘제사/제물에서 나온 고기들’입니다. 복수형 κρεῶν은 한국어에서 자연스럽게 집합적으로 옮길 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: οἱ δὲ πρὸς τὰ παράνομα τεταγμένοι
  english_pob_choice: those who had been appointed over the unlawful sacrifice
  chosen_korean: 불법한 제물에 관해 맡겨진 이들
  alternatives_korean:
  - 불법한 제사에 맡겨진 이들
  - 불법한 일들을 맡은 이들
  lexicon: LSJ
  rationale: τεταγμένοι는 ‘배정되다/맡겨지다’의 뜻이므로 ‘맡겨진’으로 살렸고, τὰ παράνομα는 문맥상 강요된 우상제물과 연결되므로 ‘불법한 제물’로 구체화했습니다.
- source_word: σπλαγχνισμοῦ
  english_pob_choice: because of their long-standing acquaintance with the man
  chosen_korean: 그 남자와 오래전부터 알고 지낸 사이였으므로
  alternatives_korean:
  - 그에게 대한 연민 때문에
  - 그에 대한 불쌍히 여김 때문에
  lexicon: LSJ
  rationale: σπλαγχνισμοῦ의 연민 뉘앙스는 있으나, 문장 전체에서 이미 관계적 이유와 함께 작동하므로 한국어에서는 오래된 안면을 앞세워 자연스럽게 표현했습니다.
- source_word: ἐνέγκοντα κρέα
  english_pob_choice: to bring meat
  chosen_korean: 마련한 것을 그가 쓰기에 마땅한 고기를 가져오라고
  alternatives_korean:
  - 고기를 가져오라고
  - 먹을 고기를 가져오라고
  lexicon: LSJ
  rationale: ἐνέγκοντα는 단순히 ‘가져오다’이므로 이를 살렸고, οἷς καθῆκον αὐτῷ χρᾶσθαι에 맞춰 ‘그가 쓰기에 마땅한’으로 이어 문맥의 대비를 드러냈습니다.
- source_word: τῶν ἀπὸ τῆς θυσίας κρεῶν
  english_pob_choice: the meat from the sacrifice that had been ordered by the king
  chosen_korean: 왕이 정한 제물의 고기
  alternatives_korean:
  - 왕이 명한 희생제물의 고기
  - 왕이 정한 제사 고기
  lexicon: LSJ
  rationale: κρεῶν의 복수성은 한국어에서 자연스러운 집합명사로 처리하되, θυσίας는 우상제물/희생제물의 제의적 배경을 살려 ‘제물의 고기’로 옮겼습니다.
theological_decisions:
- issue: τὰ παράνομα의 구체화
  chosen_reading: ‘불법한 제물’로 옮겨, 추상적 ‘불법한 것들’보다 본문의 강요된 제의적 상황을 드러냈습니다.
  alternative_readings:
  - 불법한 것들
  - 불법한 제사
  rationale: 문맥상 핵심은 먹도록 강요된 우상제물이며, 한국어 독자가 서사를 즉시 따라가도록 구체적 표현을 택했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: σπλαγχνισμοῦ의 처리
  chosen_reading: 연민을 별도 명사로 직접 번역하기보다 ‘오래전부터 알고 지낸 사이’라는 관계적 이유 속에 흡수했습니다.
  alternative_readings:
  - 그에게 대한 연민 때문에
  - 불쌍히 여겨
  rationale: 그리스어는 연민과 친분을 함께 담고 있어, 한국어에서는 두 동기를 함께 전달하는 방식이 과도한 직역보다 본문 의미를 잘 보존합니다.
  doctrine_reference: Translation philosophy §6
