base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/010.yaml
  text: For two women were brought in for having circumcised their children[a]. After hanging the infants from their breasts and leading them publicly around the city[b], they threw them down from the wall.
  footnotes:
  - marker: a
    text: Or 'through the city.' The Greek phrase in this witness is somewhat awkward, and the sense is public procession through or around the city.
    reason: alternative_reading
  - marker: b
    text: The implied object of 'they threw them down from the wall' is most likely the women, though some may understand the infants, or both women and infants, as included in the final act.
    reason: alternative_reading
translation:
  language: ko
  text: 두 여인이 자기 자녀들에게 할례를 행했다는 이유로 끌려왔습니다[a]. 그들의 젖가슴에 갓난아이들을 매단 뒤, 공개적으로 그들을 도시 둘레로 끌고 다니다가[b] 성벽에서 아래로 내던졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어의 περιτετμηκυῖα는 완료 분사로, ‘이미 할례를 행한’ 행위가 체포의 이유임을 나타냅니다.
    reason: source_note
  - marker: b
    text: ἐκ τῶν μαστῶν καὶ δημοσίᾳ περιαγαγόντες ἀντὰς τὴν πόλιν는 표현이 다소 어색하여, ‘도시 둘레로’와 ‘도시를 지나’의 뉘앙스를 모두 허용할 수 있습니다.
    reason: alternative_reading
