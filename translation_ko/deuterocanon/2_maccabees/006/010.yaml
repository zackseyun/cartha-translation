  lexicon: LSJ
  rationale: ἐκρήμνισαν의 폭력성과 고도에서의 추락을 함께 살리기 위해 ‘아래로 내던지다’를 선택했고, τείχος는 성벽으로 옮겨 상황을 분명히 했습니다.
theological_decisions:
- issue: 마지막 대명사적 목적어의 지시 대상
  chosen_reading: 마지막 폭력 행위는 두 여인에게 가해진 것으로 읽되, 앞서 매달린 유아들도 학대의 연쇄 안에 포함된 상태를 그대로 드러냅니다.
  alternative_readings:
  - 유아들이 성벽에서 내던져졌다고 읽는 해석
  - 두 여인과 유아들 모두가 함께 내던져졌다고 읽는 해석
  rationale: 그리스어 본문은 목적어를 생략하여 모호성을 남기므로, 한국어도 그 긴장을 지우지 않고 서술의 흐름상 두 여인이 주된 피해자임을 가장 자연스럽게 드러냈습니다.
  doctrine_reference: 본문의 모호성을 평탄화하지 말고 보존한다는 POB 원칙
