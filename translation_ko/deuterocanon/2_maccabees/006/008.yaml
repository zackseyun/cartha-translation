translation:
  language: ko
  text: 그런데 알렉산드리아의 이웃한 그리스 도시들에, 프톨레마이오스의 제안으로, 유다인들에게 같은 정책을 따르게 하고 그들을 죽이라는 조서가 나갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 더 생생한 동사를 사용하여, 문자적으로는 내장을 끄집어내는 것을 시사합니다. 여기서는 잔혹한 살해를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ψήφισμα
  english_pob_choice: decree
  chosen_korean: 조서
  alternatives_korean:
  - 포고
  - 법령
  - 결의
  lexicon: LSJ
  rationale: 공적 권위가 내리는 공식 문서를 가리키므로, 한국어에서는 문맥상 자연스럽고 격식 있는 ‘조서’로 옮겼습니다.
- source_word: ἐξῆλθεν
  english_pob_choice: went out
  chosen_korean: 나갔습니다
  alternatives_korean:
  - 발해졌습니다
  - 공포되었습니다
  lexicon: LSJ
  rationale: 명령이 밖으로 나가 퍼진다는 그리스어 이미지를 살리면서도, 현대 한국어에서는 ‘나갔습니다’가 가장 직설적이고 자연스럽습니다.
- source_word: ἀστυγείτονας Ἑλληνίδας πόλεις
  english_pob_choice: the neighboring Greek cities
  chosen_korean: 알렉산드리아의 이웃한 그리스 도시들
  alternatives_korean:
  - 가까운 그리스 도시들
  - 주변 그리스 도시들
  lexicon: LSJ
  rationale: ἀστυγείτονας의 ‘도시 가까이에 있는, 이웃한’ 의미를 살려 ‘이웃한’으로 옮겼고, 한국어에서 도시 관계가 더 분명하게 드러나도록 앞에 지리적 기준을 붙였습니다.
- source_word: Πτολεμαίου ὑποθεμένου
  english_pob_choice: at the suggestion of Ptolemy
  chosen_korean: 프톨레마이오스의 제안으로
  alternatives_korean:
  - 프톨레마이오스의 건의로
  - 프톨레마이오스가 제안하여
  lexicon: LSJ
  rationale: 속격절의 원인·제안 뉘앙스를 가장 간결하게 담는 표현으로 ‘제안으로’를 택했습니다.
- source_word: τὴν αὐτὴν ἀγωγὴν κατὰ τῶν Ἰουδαίων ἄγειν
  english_pob_choice: to follow the same policy against the Jews
  chosen_korean: 유다인들에게 같은 정책을 따르게 하고
  alternatives_korean:
  - 유다인들에 대하여 같은 조치를 시행하게 하고
  - 유다인들에 대한 같은 방침을 실행하게 하고
  lexicon: LSJ
  rationale: ἀγωγή는 여기서 행정적·정책적 ‘방침/정책’에 가깝기 때문에, 한국어에서는 가장 이해하기 쉬운 ‘정책’으로 옮겼습니다.
- source_word: σπλαγχνίζειν
  english_pob_choice: to kill them
  chosen_korean: 그들을 죽이라는
  alternatives_korean:
  - 그들을 살해하라는
  - 그들을 도륙하라는
  lexicon: LSJ
  rationale: POB의 영어 본문이 이 동사를 완곡하게 ‘kill’로 처리한 점을 따라, 본문은 중립적인 ‘죽이라는’으로 번역하되, 본래의 강한 폭력성은 각주에서 설명할 수 있게 했습니다.
theological_decisions:
- issue: σπλαγχνίζειν의 폭력성 처리
  chosen_reading: 본문은 ‘죽이라는’으로 옮기고, 원문의 더 생생한 잔혹성은 각주로 알립니다.
  alternative_readings:
  - 도살하라는
  - 내장을 꺼내 죽이라는
  rationale: 이 어휘는 신학적 교리 쟁점은 아니지만, 원어가 매우 잔혹한 이미지를 지니므로 본문은 읽기 쉬운 현대어를 유지하면서도 의미 손실을 각주로 보완했습니다.
  doctrine_reference: 번역 원칙 §§1, 6
