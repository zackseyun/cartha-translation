  - 자비를 얻게
  lexicon: BDAG
  rationale: φιλανθρωπία를 문맥에 맞는 ‘친절/호의’로 옮겨, 지나치게 교회적이거나 추상적인 표현을 피했습니다.
- source_word: διὰ τὴν ἀρχαίαν πρὸς αὐτοὺς φιλίαν
  english_pob_choice: because of their long-standing friendship with him
  chosen_korean: 그들과의 오래된 우정 때문에
  alternatives_korean:
  - 그들과 맺은 오래된 우정 때문에
  - 예전부터의 우정 때문에
  - 그에 대한 오래된 우정 때문에
  lexicon: LSJ
  rationale: ἀρχαίαν φιλίαν의 ‘오래된/오랜 우정’과 관계의 근거를 자연스러운 현대 한국어로 살렸습니다. πρὸς αὐτούς는 문맥상 관계 지시로 이해해 과도한 직역을 피했습니다.
