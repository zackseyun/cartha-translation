  rationale: ἀπολύω의 ‘풀어 주다/해방하다’ 의미를 살리면서, 문맥상 처형을 면하는 뜻이 드러나도록 직역 과잉 없이 옮겼습니다.
- source_word: τύχοι φιλανθρωπίας
