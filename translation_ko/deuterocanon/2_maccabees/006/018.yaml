  yaml_path: translation/deuterocanon/2_maccabees/006/018.yaml
  text: A certain Eleazar[a], one of the leading scribes, a man already advanced in age and most handsome in appearance, was being forced, with his mouth pried open, to eat pork.
  footnotes:
  - marker: a
    text: Or 'swine's flesh.' The Greek literally refers to pig flesh; 'pork' is the natural modern English equivalent.
    reason: lexical_alternative
translation:
  language: ko
  text: 어떤 엘르아살[a]이라는 사람이 있었는데, 그는 율법학자들 가운데서 지도급 인물이었고, 이미 나이가 많았으며 용모도 매우 준수했는데, 입이 억지로 벌어진 채 돼지고기를 먹도록 강요받고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘돼지의 살’. 그리스어는 문자적으로 돼지 고기를 가리키며, 한국어에서는 ‘돼지고기’가 가장 자연스러운 대응입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλεάζαρός τις
  english_pob_choice: A certain Eleazar
  chosen_korean: 어떤 엘르아살
  alternatives_korean:
  - 한 엘르아살
