  source_fidelity: 초안은 엘르아살의 고령, 뛰어난 용모, 돼지고기를 먹도록 받는 계속적 강요를 대체로 충실히 전달합니다. 다만 γραμματέων를 ‘율법학자’로 풀어 옮긴 것은 원문의 직함 ‘서기관’보다 해석적입니다. 또한 ἀναχαινόμενον은 입을 벌린 상태를 나타내므로, 입이 타인에 의해 물리적으로 벌어졌다고 단정하는 표현은 피하는 편이 안전합니다.
  naturalness: 수정문은 현대 표준 한국어의 합쇼체로 자연스럽고, 긴 수식 구조를 유지하면서도 문장이 지나치게 구어적이지 않도록 했습니다.
  terminology: Ἐλεάζαρος는 통용 음역인 ‘엘르아살’을 유지했습니다. γραμματεύς는 ‘서기관’, πρωτεύων은 ‘주요’로 옮겨 원문의 직함과 탁월성을 보존했습니다. ὕειον κρέας는 자연스러운 현대어 ‘돼지고기’로 유지했습니다.
