  lexicon: LSJ
  rationale: τις의 서술적 도입을 살리기 위해 ‘어떤’으로 옮기고, 고유명사는 현대 음역에 맞춰 엘르아살로 처리했습니다.
- source_word: τῶν πρωτευόντων γραμματέων
  english_pob_choice: one of the leading scribes
  chosen_korean: 율법학자들 가운데서 지도급 인물
  alternatives_korean:
  - 주요 서기관들 가운데 한 사람
  - 선두에 선 서기관들 가운데 한 사람
  lexicon: LSJ
  rationale: γραμματεύς를 단순 직함보다 본문의 유대 문맥에 맞는 ‘율법학자’로 풀고, πρωτευόντων은 신분의 우위와 지도성을 드러내는 ‘지도급’으로 옮겼습니다.
- source_word: ἤδη προβεβηκὼς τὴν ἡλικίαν
  english_pob_choice: already advanced in age
  chosen_korean: 이미 나이가 많았으며
  alternatives_korean:
  - 이미 연로했으며
  - 이미 연세가 깊었으며
  lexicon: LSJ
  rationale: 직역보다 한국어에서 자연스러운 노년 표현으로 옮기되, 이미 장년을 넘어선 상태라는 시간감을 보존했습니다.
- source_word: τὴν πρόσοψιν τοῦ προσώπου κάλλιστος
  english_pob_choice: most handsome in appearance
  chosen_korean: 용모도 매우 준수했는데
  alternatives_korean:
  - 외모도 매우 잘생겼는데
  - 겉모습도 매우 아름다웠는데
  lexicon: LSJ
  rationale: 외형과 얼굴의 아름다움을 가리키는 표현이므로 한국어에서는 인물의 격조를 살리는 ‘용모가 준수하다’로 옮기되, 미적 평가를 약화시키지 않도록 ‘매우’를 보탰습니다.
- source_word: ἀναχαινόμενον ἠναγκάζετο
  english_pob_choice: was being forced, with his mouth pried open
  chosen_korean: 입이 억지로 벌어진 채 … 먹도록 강요받고 있었습니다
  alternatives_korean:
  - 입이 억지로 벌려진 채 … 먹으라고 강요받고 있었습니다
  - 입이 벌어진 채 … 먹도록 억지 당하고 있었습니다
  lexicon: LSJ
  rationale: 몸의 강제적 개방과 계속되는 압박을 함께 드러내기 위해 ‘억지로 벌어진 채’와 ‘강요받고 있었습니다’를 결합했습니다.
- source_word: ὕειον κρέας
  english_pob_choice: pork
  chosen_korean: 돼지고기
  alternatives_korean:
  - 돼지의 살
  - 돼지 고기
  lexicon: LSJ
  rationale: 그리스어의 문자적 의미는 돼지의 고기이며, 현대 한국어에서 가장 자연스럽고 즉각적으로 이해되는 대응어는 ‘돼지고기’입니다.
