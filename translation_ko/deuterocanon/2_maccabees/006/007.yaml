  rationale: 문맥상 자발적 인도가 아니라 강제 이송이므로, 한국어에서는 수동의 뉘앙스를 살려 '끌려갔습니다'가 가장 자연스럽고 강합니다.
- source_word: μετὰ πικρᾶς ἀνάγκης
  english_pob_choice: under bitter compulsion
  chosen_korean: 쓰라린 강요 속에서
  alternatives_korean:
