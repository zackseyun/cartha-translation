  lexicon: LSJ
  rationale: πικρᾶς의 감정적 쓰라림과 ἀνάγκης의 강제성을 함께 담기 위해 '쓰라린 강요'로 옮겼습니다.
- source_word: ἐπὶ σπλαγχνισμόν
  english_pob_choice: for the sacrificial meal
  chosen_korean: 희생 제물을 먹는 일로
  alternatives_korean:
  - 희생 제물의 식사로
  - 희생 제물 먹기에
  lexicon: LSJ
  rationale: 직역하면 난해한 제의 용어이므로, POB의 해설 취지를 따라 제의적 식사 참여를 드러내는 방향으로 풀어 옮겼습니다.
- source_word: κισσοὺς ἔχοντες
  english_pob_choice: wearing ivy wreaths
  chosen_korean: 담쟁이 화관을 쓴 채
  alternatives_korean:
  - 담쟁이 화환을 두른 채
  - 담쟁이를 지닌 채
  lexicon: LSJ
  rationale: 디오니소스 행렬에서의 관례적 장식은 단순히 '가지고 있는' 것이 아니라 머리에 쓰는 장식이므로, '화관'으로 문화적 의미를 드러냈습니다.
- source_word: πομπεύειν τῷ Διονύσῳ
  english_pob_choice: to join the procession in honor of Dionysus
  chosen_korean: 디오니소스를 기리는 행렬에 참여하도록
  alternatives_korean:
  - 디오니소스에게 바치는 행렬에 참여하도록
  - 디오니소스를 위한 행진에 참여하도록
  lexicon: LSJ
  rationale: πομπεύειν은 단순한 행진이 아니라 제의적 행렬 참여를 뜻하므로 '행렬에 참여하다'로 옮기고, dative의 예배적 방향성을 '기리는'으로 표현했습니다.
theological_decisions:
- issue: 우상 제의의 강제성과 종교적 오염의 표현
  chosen_reading: 왕권 행사로 위장된 우상 제의에의 강제 참여를 한국어 본문에서 분명히 드러냈습니다.
  alternative_readings:
  - 단순한 연회 참석으로 완화
  - 문화 행사 참여로 중립화
  rationale: 본문은 정치적 강압 아래 이방 제의에 참여하도록 강요받는 상황을 묘사하므로, 그 종교적 충돌이 약화되지 않도록 했습니다.
  doctrine_reference: 우상숭배 금지와 순교 서사의 문맥(2 Maccabees)
