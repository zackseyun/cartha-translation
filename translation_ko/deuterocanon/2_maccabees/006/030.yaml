base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/030.yaml
  text: But as he was about to die under the blows[a], he groaned and said, “To the Lord, who has the holy knowledge, it is clear that, though I could have been released from death, I am enduring cruel pains in my body while being scourged[b]; but in my soul I gladly suffer these things because of fear of him.”
  footnotes:
  - marker: a
    text: Or “because of reverence for him.” The Greek says “fear,” which can include reverent fear toward God.
    reason: lexical_alternative
  - marker: b
    text: “Released from death” means spared from execution or allowed to escape death by compliance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 매를 맞고 죽게 되려는 참에 신음하며 말했습니다. 「거룩한 지식을 가지신 주님께는, 내가 죽음에서 풀려날 수 있었음에도 불구하고, 채찍질을 당하며 육신으로는 이처럼 쓰라린 고통을 겪고 있다는 것이 분명합니다. 그러나 제 영혼으로는 그분에 대한 두려움 때문에 이 일들을 기꺼이 겪고 있습니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘두려움’은 여기서 하나님에 대한 경건한 두려움, 곧 경외를 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘죽음에서 풀려날 수 있었다’는 표현은 처형을 피하거나 순응으로 죽음을 면할 가능성을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλων δὲ ταῖς πληγαῖς τελευτᾷν
  english_pob_choice: as he was about to die under the blows
  chosen_korean: 매를 맞고 죽게 되려는 참에
  alternatives_korean:
  - 때리심 아래 죽으려는 참에
  - 매질 속에서 죽으려는 참에
  lexicon: LSJ
  rationale: μέλλων + 부정사는 임박성을 나타내므로 ‘-려는 참에’로 살리고, ταῖς πληγαῖς는 죽음이 매를 맞는 상황 속에서 일어남을 드러내어 자연스럽게 옮겼습니다.
- source_word: ἀναστενάξας
  english_pob_choice: he groaned
  chosen_korean: 신음하며
  alternatives_korean:
  - 탄식하며
  - 깊이 한숨 쉬며
  lexicon: LSJ
  rationale: 말하기 전에 내는 가시적 음성을 나타내므로 ‘신음하며’가 가장 간결하고 서사에 맞습니다.
- source_word: Τῷ κυρίῳ τῷ τὴν ἁγίαν γνῶσιν ἔχοντι
  english_pob_choice: To the Lord, who has the holy knowledge
  chosen_korean: 거룩한 지식을 가지신 주님께는
  alternatives_korean:
  - 거룩한 지식을 가지신 주님께
  - 거룩한 앎을 가지신 주님께는
  lexicon: LSJ
  rationale: κύριος는 본문 관례대로 ‘주님’으로 옮기고, τὴν ἁγίαν γνῶσιν은 추상화하지 않고 ‘거룩한 지식’으로 유지해 원문의 수식 구조를 보존했습니다.
- source_word: δυνάμενος ἀπολυθῆναι τοῦ θανάτου
  english_pob_choice: though I could have been released from death
  chosen_korean: 내가 죽음에서 풀려날 수 있었음에도 불구하고
  alternatives_korean:
  - 내가 죽음에서 놓여날 수 있었음에도 불구하고
  - 내가 죽음을 면할 수 있었음에도 불구하고
  lexicon: LSJ
  rationale: ἀπολυθῆναι는 ‘풀려나다/해방되다’의 뉘앙스를 가지므로, 순교 맥락에서 ‘죽음에서 풀려날 수 있었다’로 옮겨 실행 가능한 탈출 가능성을 드러냈습니다.
- source_word: κατὰ σῶμα ... κατὰ ψυχὴν
  english_pob_choice: in my body ... in my soul
  chosen_korean: 육신으로는 ... 제 영혼으로는
  alternatives_korean:
  - 몸으로는 ... 혼으로는
  - 육체로는 ... 내 영혼으로는
  lexicon: LSJ
  rationale: σῶμα/ψυχή의 대조를 한국어에서도 분명히 살리기 위해 ‘육신/영혼’ 대구를 사용했고, 문맥상 인격 전체의 차원을 드러내도록 했습니다.
- source_word: ἡδέως
  english_pob_choice: gladly
  chosen_korean: 기꺼이
  alternatives_korean:
  - 즐겁게
  - 흔쾌히
  lexicon: LSJ
  rationale: ἡδέως는 자원하는 태도와 내적 기쁨을 함께 담으므로, 감정적으로 과장되지 않으면서도 의지를 드러내는 ‘기꺼이’가 적절합니다.
- source_word: διὰ τὸν αὐτοῦ φόβον
  english_pob_choice: because of fear of him
  chosen_korean: 그분에 대한 두려움 때문에
  alternatives_korean:
  - 그분을 경외하기 때문에
  - 그분을 두려워하기 때문에
  lexicon: LSJ
  rationale: φόβος의 신학적 긴장을 풀어 ‘경외’로만 고정하지 않고, 원문의 강한 표현을 살려 ‘두려움’으로 두었습니다.
theological_decisions:
- issue: φόβος의 번역에서 경외와 두려움의 긴장 유지
  chosen_reading: 그분에 대한 두려움 때문에
  alternative_readings:
  - 그분에 대한 경외 때문에
  - 그분을 경외하는 마음 때문에
  rationale: 본문은 하나님에 대한 경건한 태도를 말하지만 용어 자체는 φόβος(두려움)를 사용합니다. 원문의 신학적 긴장을 유지하기 위해 본문에는 ‘두려움’을 두고, 경외의 뉘앙스는 해석 가능성으로 남겼습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: ψυχή와 σῶμα의 대조를 인격 전체의 내외면 대비로 보존
  chosen_reading: 육신 ... 영혼
  alternative_readings:
  - 몸 ... 혼
  - 육체 ... 영혼
  rationale: 본문은 육체적 고통과 내적 기쁨을 병치합니다. ‘육신/영혼’은 한국어에서 그 대조를 가장 또렷하게 살리면서도 과도한 심리화로 흐르지 않습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1
