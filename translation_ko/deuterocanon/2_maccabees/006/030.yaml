  text: μέλλων δὲ ταῖς πληγαῖς τελευτᾷν, ἀναστενάξας εἶπεν Τῷ κυρίῳ τῷ τὴν ἁγίαν γνῶσιν ἔχοντι φανερὸν ἐστὶν ὅτι δυνάμενος ἀπολυθῆναι τοῦ θανάτου, σκληρὰς ὑποφέρω κατὰ σῶμα ἀλγηδόνας μαστιγούμενος, κατὰ ψυχὴν δὲ ἡδέως διὰ τὸν αὐτοῦ φόβον ταῦτα πάσχω.
