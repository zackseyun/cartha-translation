translation:
  language: ko
  text: 그러나 제단은 율법에서 떠난 사람들에 의해 불법한 것들로 가득 차 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘불법한 것들’은 헬라어 ἀθεμίτοις의 ‘허용되지 않은, 금지된’ 뜻을 옮긴 것입니다. 문맥상 제의적 오염을 가리킬 수 있으나, 본문은 그 대상을 구체적으로 열거하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: θυσιαστήριον
  english_pob_choice: altar
  chosen_korean: 제단
  alternatives_korean:
  - 번제단
  - 희생제단
  lexicon: LSJ
  rationale: 일반적인 성전 문맥에서 θυσιαστήριον은 ‘제단’이 가장 자연스럽고, 불필요한 설명을 덧붙이지 않습니다.
- source_word: ἀποδιεσταλμένοις
  english_pob_choice: those who had departed from
  chosen_korean: 율법에서 떠난 사람들
  alternatives_korean:
  - 율법에서 분리된 사람들
  - 율법을 저버린 사람들
  lexicon: LSJ
  rationale: 분리·이탈의 의미를 살리되, 본문이 직접 말하지 않는 ‘배교자’ 같은 규정어는 피했습니다.
- source_word: νόμων
  english_pob_choice: the laws
  chosen_korean: 율법
  alternatives_korean:
  - 법들
  - 법
  - 조상들의 율법
  lexicon: LSJ
  rationale: 헬라어 복수형은 본문에 분명하지만, 여기서는 유대인의 종교적 규범을 가리키므로 한국어에서는 자연스럽게 ‘율법’으로 옮겼습니다.
- source_word: ἀθεμίτοις
  english_pob_choice: unlawful things
  chosen_korean: 합당하지 않은 것들
  alternatives_korean:
  - 불법한 것들
  - 금지된 것들
  - 가증한 것들
  lexicon: LSJ
  rationale: 이 형용사는 ‘허용되지 않은, 불법의’ 뜻을 가지므로, 본문의 제의적 오염 맥락을 살리되 지나치게 신학화된 ‘가증한 것들’은 본문 이상의 해석이 될 수 있어 피했습니다.
theological_decisions:
- issue: 제단 오염의 성격을 어떻게 드러낼지
  chosen_reading: 합당하지 않은 것들로 가득 차 있었습니다
  alternative_readings:
  - 불법한 것들로 가득 차 있었습니다
  - 가증한 것들로 가득 차 있었습니다
  rationale: 본문은 성전 모독과 제의적 부정을 암시하지만, 그 어휘 자체는 먼저 ‘허용되지 않음’에 초점이 있습니다. 그래서 강한 전통어를 바로 단정하기보다 원문의 긴장을 보존했습니다.
  doctrine_reference: '원어 우선 원칙: 어휘의 법적·제의적 의미를 유지하고, 해석적 강도를 본문이 허락하는 범위에 두기.'
