  text: But the altar was filled with unlawful things by those who had departed from the laws[a].
  footnotes:
  - marker: a
    text: Or 'abominations' or 'forbidden things.' The Greek describes what is illicit or not permitted, in a context of cultic defilement.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 제단은 율법에서 떠난 사람들에 의해 합당하지 않은 것들로 가득 차 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘합당하지 않은 것들’은 ἀθεμίτοις의 ‘허용되지 않는, 불법한’ 뜻을 살린 표현입니다. 문맥상 제의적 오염을 가리킬 수 있지만, 본문 자체는 그 대상을 구체적으로 열거하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: θυσιαστήριον
