  - 죄악의 충만에 이를 때까지
  - 그들의 죄의 한계에 이를 때까지
  lexicon: LSJ
  rationale: ἁμαρτιῶν의 ‘채워짐/완성’ 이미지를 직역적으로 살리되, 한국어에서 자연스럽고 분명하게 들리는 ‘가득 찰 때까지’로 표현했습니다.
- source_word: κολάσῃ
  english_pob_choice: punishes
  chosen_korean: 벌하십니다
  alternatives_korean:
  - 형벌을 내리십니다
