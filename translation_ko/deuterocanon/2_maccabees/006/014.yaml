  - 주님께서는
  lexicon: LSJ
  rationale: δεσπότης는 하나님을 가리키는 ‘주인/주권자’의 뜻이지만, 한국어 문맥에서는 앞절의 주어를 이어 받는 대명사가 가장 자연스러워 ‘그분은’으로 처리했습니다. 다만 화자의 대상으로서 하나님을 높이는 합쇼체를 유지했습니다.
- source_word: ἀναμένει μακροθυμῶν
  english_pob_choice: he waits patiently
  chosen_korean: 참으시다가
  alternatives_korean:
  - 오래 참으시다가
  - 인내하시며 기다리시다가
  - 참고 기다리시다가
  lexicon: LSJ
  rationale: ἀναμένει와 μακροθυμῶν은 단순한 지연이 아니라 심판을 미루는 인내를 함께 나타내므로, 한국어에서는 동작의 흐름을 살려 ‘참으시다가’로 옮겼습니다.
- source_word: πρὸς ἐκπλήρωσιν ἁμαρτιῶν
  english_pob_choice: until they have reached the full measure of their sins
  chosen_korean: 그들의 죄가 가득 찰 때까지
  alternatives_korean:
