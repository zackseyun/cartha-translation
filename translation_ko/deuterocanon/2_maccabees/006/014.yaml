  text: 주권자께서는[a] 다른 민족들에게 하시는 것처럼 우리에게도 그렇게 하시기로 결정하지 않으셨습니다. 그분은 다른 민족들이 죄를 다 채울 때까지 인내하며 기다리시다가 그들을 벌하십니다.
  philosophy: optimal-equivalence
  footnotes:
