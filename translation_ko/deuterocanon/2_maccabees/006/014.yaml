  text: 그분은 다른 민족들에게 하시는 것처럼 우리를 대하시기로 하지 않으셨습니다. 그분은 그들의 죄가 가득 찰 때까지 참으시다가 그들을 벌하십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δεσπότης
  english_pob_choice: he
  chosen_korean: 그분은
  alternatives_korean:
  - 주인께서는
  - 주권자께서는
  - 주님께서는
  lexicon: LSJ
  rationale: δεσπότης는 하나님을 가리키는 ‘주인/주권자’의 뜻이지만, 한국어 문맥에서는 앞절의 주어를 이어 받는 대명사가 가장 자연스러워 ‘그분은’으로 처리했습니다. 다만 화자의 대상으로서 하나님을 높이는 합쇼체를 유지했습니다.
- source_word: ἀναμένει μακροθυμῶν
  english_pob_choice: he waits patiently
  chosen_korean: 참으시다가
  alternatives_korean:
  - 오래 참으시다가
  - 인내하시며 기다리시다가
  - 참고 기다리시다가
  lexicon: LSJ
  rationale: ἀναμένει와 μακροθυμῶν은 단순한 지연이 아니라 심판을 미루는 인내를 함께 나타내므로, 한국어에서는 동작의 흐름을 살려 ‘참으시다가’로 옮겼습니다.
- source_word: πρὸς ἐκπλήρωσιν ἁμαρτιῶν
  english_pob_choice: until they have reached the full measure of their sins
  chosen_korean: 그들의 죄가 가득 찰 때까지
  alternatives_korean:
  - 그들의 죄가 완전히 채워질 때까지
  - 죄악의 충만에 이를 때까지
  - 그들의 죄의 한계에 이를 때까지
  lexicon: LSJ
  rationale: ἁμαρτιῶν의 ‘채워짐/완성’ 이미지를 직역적으로 살리되, 한국어에서 자연스럽고 분명하게 들리는 ‘가득 찰 때까지’로 표현했습니다.
- source_word: κολάσῃ
  english_pob_choice: punishes
  chosen_korean: 벌하십니다
  alternatives_korean:
  - 형벌을 내리십니다
  - 징벌하십니다
  - 처벌하십니다
  lexicon: LSJ
  rationale: κολάζω는 단순한 교정이 아니라 실제적인 벌을 뜻하므로, 현대 한국어에서 가장 직접적인 ‘벌하다’를 선택했습니다. 합쇼체 문맥에 맞춰 ‘벌하십니다’로 옮겼습니다.
- source_word: οὕτως καὶ ἐφʼ ἡμῶν ἔκρινεν εἶναι
  english_pob_choice: he did not decide to deal with us as he does with the other nations
  chosen_korean: 우리를 대하시기로 하지 않으셨습니다
  alternatives_korean:
  - 우리에게도 그렇게 하시기로 판단하지 않으셨습니다
  - 우리의 경우에는 그렇게 하기로 결정하지 않으셨습니다
  - 우리에게는 그와 같이 하시지 않기로 정하셨습니다
  lexicon: LSJ
  rationale: ἔκρινεν εἶναι는 ‘그렇게 하기로 판단/결정하다’의 뜻이므로, 본문의 대조를 한국어에서 자연스럽게 드러내는 ‘대하시기로 하지 않으셨습니다’로 풀었습니다.
theological_decisions:
- issue: 하나님의 인내와 심판의 경계
  chosen_reading: 다른 민족에게는 죄가 가득 찰 때까지 참으시지만, 우리에게는 그와 동일한 방식으로 미루지 않으신다는 대조를 그대로 살렸습니다.
  alternative_readings:
  - 더 문자적으로 ‘참으시며 기다리십니다’라고만 옮길 수도 있습니다.
  - ‘우리를 다르게 다루신다’는 비교를 약화시켜 번역할 수도 있습니다.
  rationale: 본문의 οὐ ... καθάπερ ... οὕτως ... ἐφʼ ἡμῶν 구조가 만드는 비교와 긴장을 보존해야 하므로, 심판의 지연과 차별적 적용을 분명히 드러냈습니다.
  doctrine_reference: Preserve theological tension rather than resolve it; optimal equivalence
