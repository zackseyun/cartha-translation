base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/011.yaml
  text: But others[a], having gathered nearby in the caves to observe the week in secret, were informed against to Philip and were burned together, because they scrupled to defend themselves out of regard for the honor of that most holy day.
  footnotes:
  - marker: a
    text: Or, 'to observe the Sabbath secretly.' The Greek literally says 'to keep the week in secret,' but in context this likely refers to Sabbath observance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 다른 사람들은 가까운 동굴들에 모여, 비밀리에 그 주간을 지키려다가[a] 필립보에게 고발되어 함께 불에 타 죽었습니다. 그들은 그 가장 거룩한 날의 영예를 생각하여 자기들을 지키려 하지 않았기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘비밀리에 안식일을 지키려.’ 그리스어는 문자적으로는 ‘비밀리에 그 주간을 지키다’라고 말하지만, 문맥상 안식일 준수를 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι
  english_pob_choice: others
  chosen_korean: 다른 사람들은
  alternatives_korean:
  - 어떤 이들은
  - 나머지 사람들은
  lexicon: LSJ
  rationale: 앞선 무리와 대조되는 불특정 집단이므로, 자연스러운 한국어로는 ‘다른 사람들’이 가장 직접적입니다.
- source_word: πλησίον συνδρομόντες εἰς τὰ σπήλαια
  english_pob_choice: having gathered nearby into the caves
  chosen_korean: 가까운 동굴들에 모여
  alternatives_korean:
  - 근처의 동굴들로 달려 모여
  - 가까운 동굴들 안으로 모여
  lexicon: LSJ
  rationale: ‘함께 모이다’의 집합적 움직임을 살리면서, 한국어에서는 ‘모여’가 가장 자연스럽고 장소 표현도 무리 없이 전달합니다.
- source_word: λεληθότως ἄγειν τὴν ἑβδομάδα
  english_pob_choice: to keep the week in secret
  chosen_korean: 비밀리에 그 주간을 지키려
  alternatives_korean:
  - 비밀리에 안식일을 지키려
  - 남모르게 한 주를 보내려
  lexicon: LSJ
  rationale: 본문이 직접적으로는 ‘주간/한 주’를 말하므로 그 어휘를 유지했고, ἄγειν의 ‘지키다/보내다’ 감각은 ‘지키려’로 옮겼습니다.
- source_word: μηνυθέντες τῷ Φιλίππῳ
  english_pob_choice: were informed against to Philip
  chosen_korean: 필립보에게 고발되어
  alternatives_korean:
  - 필립보에게 밀고당해
  - 필립보에게 보고되어
  lexicon: LSJ
  rationale: 수동형의 적대적 뉘앙스를 한국어로는 ‘고발되어’가 가장 잘 드러냅니다.
- source_word: συνεφλογίσθησαν
  english_pob_choice: were burned together
  chosen_korean: 함께 불에 타 죽었습니다
  alternatives_korean:
  - 함께 불태워졌습니다
  - 함께 불길에 휩싸였습니다
  lexicon: LSJ
  rationale: ‘함께’의 집단성을 유지하고, 문맥상 실제 죽음을 분명히 하되 원문이 직접 말하는 화형의 의미를 보존합니다.
- source_word: κατὰ δόξαν τῆς σεμνοτάτης ἡμέρας
  english_pob_choice: out of regard for the honor of that most holy day
  chosen_korean: 그 가장 거룩한 날의 영예를 생각하여
  alternatives_korean:
  - 그 가장 거룩한 날의 존귀함을 생각하여
  - 그 가장 거룩한 날의 영광을 고려하여
  lexicon: LSJ
  rationale: δόξα를 ‘영광’보다 ‘영예/존귀’의 뜻으로 읽는 편이 문맥상 더 정확하며, σεμνοτάτης는 ‘가장 거룩한’으로 옮겼습니다.
theological_decisions:
- issue: τὴν ἑβδομάδα의 의미를 한국어 본문에서 어떻게 처리할지
  chosen_reading: ‘그 주간’으로 직역하되, 주석에서 안식일 준수 가능성을 열어 둡니다.
  alternative_readings:
  - ‘안식일’로 본문화
  - ‘안식일 준수’로 의역
  rationale: 그리스어 본문은 직접적으로 ‘주간’을 말하므로 본문에서는 이를 유지하고, 역사적 문맥상 안식일 준수의 가능성은 각주로 보존하는 것이 소스 충실도에 맞습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
- issue: 자기방어를 포기한 이유를 어떻게 표현할지
  chosen_reading: ‘자기들을 지키려 하지 않았기 때문입니다’
  alternative_readings:
  - ‘스스로를 돕지 않으려 했기 때문입니다’
  - ‘자기 방어를 거부했기 때문입니다’
  rationale: εὐλαβῶς ἔχειν과 βοηθῆσαι αὐτοῖς의 결합은 단순한 무기력보다 경건한 절제와 자기방어 거절을 가리키므로, 한국어에서는 ‘지키려 하지 않았다’가 그 긴장을 가장 덜 훼손합니다.
  doctrine_reference: Translation philosophy §3
