  verdict: revise
  source_fidelity: 대체로 원문에 충실합니다. 그러나 συνεφλογίσθησαν는 ‘함께 불에 타다/불태워지다’를 뜻하며, 죽음이 문맥상 강하게 시사되더라도 동사 자체가 직접 명시하지 않는 ‘죽었다’를 본문에 보태지 않는 편이 안전합니다. 또한 목적을 나타내는 부정사 ἄγειν은 ‘지키려고’가 ‘지키려다가’보다 더 직접적입니다.
  naturalness: 합쇼체는 일관되고 전반적으로 자연스럽습니다. 다만 ‘영예를 생각하여’보다는 ‘영예를 존중하여’가 κατὰ δόξαν의 존중·고려의 뜻을 더 자연스럽게 드러내며, ‘자기들을 지키려 하지 않았다’보다 ‘스스로를 방어하기를 꺼렸다’가 εὐλαβῶς ἔχειν의 종교적 거리낌을 더 잘 보존합니다.
  terminology: ‘그 주간’은 ἑβδομάδα의 직접적 어휘값을 보존하며, 안식일을 가리킬 가능성은 각주로 적절히 처리되었습니다. ‘필립보’는 고유명사 표기로 수용 가능합니다. σεμνοτάτης는 ‘지극히 거룩한’으로 옮겨 최상급의 종교적 존엄성을 자연스럽게 반영했습니다.
  issues:
  - severity: medium
    issue: ‘함께 불에 타 죽었습니다’가 죽음을 명시합니다.
    rationale: 원문 συνεφλογίσθησαν는 함께 불에 타거나 불태워졌다는 사실을 말합니다. 사망은 서사 문맥상 추론될 수 있으나 이 동사가 명시하는 내용은 아니므로, 번역 본문에서는 ‘죽었습니다’를 첨가하지 않는 것이 원문 충실성에 더 맞습니다.
  - severity: low
    issue: ‘지키려다가’는 미완의 시도 또는 그 과정의 중단을 함축합니다.
    rationale: λεληθότως ἄγειν τὴν ἑβδομάδα는 동굴에 모인 목적, 곧 비밀리에 그 주간을 지키려는 것을 나타냅니다. ‘지키려고’가 이 목적 관계를 더 중립적으로 전달합니다.
  - severity: low
    issue: 자기방어를 꺼린 종교적 거리낌이 다소 약하게 드러납니다.
    rationale: εὐλαβῶς ἔχειν은 단순히 하지 않았다는 뜻보다 경건함 또는 양심적 거리낌으로 주저했다는 뉘앙스를 지닙니다. ‘스스로를 방어하기를 꺼렸습니다’가 이를 더 잘 반영합니다.
  revised_text: 그런데 다른 사람들은 가까운 동굴들에 모여 비밀리에 그 주간을 지키려고 하다가[a] 필립보에게 고발되어 함께 불에 탔습니다. 그들은 그 지극히 거룩한 날의 영예를 존중하여 스스로를 방어하기를 꺼렸기 때문입니다.
