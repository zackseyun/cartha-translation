    reason: lexical_alternative
translation:
  language: ko
  text: 얼마 지나지 않아[a] 왕은 나이 든 아테네 사람을 보내어, 유대인들이 조상들에게서 물려받은 율법[b]을 떠나 하나님의 율법에 따라 살지 못하도록 강요하려고 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 직역하면 ‘많지 않은 시간 뒤에’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 ‘조상들의’는 문자적으로 아버지들에게서 물려받은 것을 가리키며, 여기서는 유대인의 전승된 율법을 뜻합니다.
    reason: lexical_alternative
