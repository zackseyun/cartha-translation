  text: But after not much time[a], the king sent an aged Athenian to compel the Jews to depart from the laws of their fathers and not to live by the laws of God[b],
  footnotes:
  - marker: a
    text: Or, more smoothly, 'not long afterward.' The Greek literally says 'after not much time.'
    reason: lexical_alternative
  - marker: b
    text: '''The laws of their fathers'' means their ancestral laws; the Greek keeps paternal language.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 얼마 지나지 않아 왕은 나이 든 아테네 사람을 보내어, 유대인들에게 조상들의 율법에서 떠나게 하고 하나님의 율법대로 살지 못하게 하려 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘얼마 지나지 않아’는 그리스어의 문자적 표현인 ‘얼마 많은 시간이 지나지 않고’에 가까운 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘조상들의 율법’은 유대인들의 전승된 조상 법을 가리키며, 그리스어는 친족적 표현을 그대로 유지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετʼ οὐ πολὺν ... χρόνον
  english_pob_choice: after not much time
  chosen_korean: 얼마 지나지 않아
  alternatives_korean:
  - 짧은 시간이 지난 뒤
  - 오래지 않아
  lexicon: LSJ
  rationale: 그리스어 관용구의 짧은 시간 경과를 현대 한국어에서 자연스럽고도 분명하게 살렸습니다.
- source_word: γέροντι Ἀθηναῖον
  english_pob_choice: an aged Athenian
  chosen_korean: 나이 든 아테네 사람
  alternatives_korean:
  - 늙은 아테네 사람
  - 연로한 아테네 사람
  lexicon: LSJ
  rationale: γέροντι는 여기서 직분명보다 연령을 나타내는 것으로 보이므로, ‘나이 든’으로 무리 없이 옮겼습니다.
- source_word: ἀναγκάζειν
  english_pob_choice: to compel
  chosen_korean: ~하게 하려 했습니다
  alternatives_korean:
  - ~하도록 강요하려 했습니다
  - ~하도록 강제하려 했습니다
  lexicon: LSJ
  rationale: 목적 부정법의 강한 강제성을 살리되, 한국어에서는 문맥상 자연스러운 ‘~하게 하려 했습니다’로 풀었습니다.
- source_word: μεταβαίνειν ἀπὸ τῶν πατρίων νόμων
  english_pob_choice: to depart from the laws of their fathers
  chosen_korean: 조상들의 율법에서 떠나게
  alternatives_korean:
  - 조상들의 법을 버리게
  - 조상들의 전통적 율법에서 떠나게
  lexicon: LSJ
  rationale: πατρίων νόμων의 친족·전승적 뉘앙스를 ‘조상들의 율법’으로 보존하고, μεταβαίνειν ἀπό의 ‘떠나다’ 이미지를 살렸습니다.
- source_word: τοῖς τοῦ θεοῦ νόμοις
  english_pob_choice: the laws of God
  chosen_korean: 하나님의 율법
  alternatives_korean:
  - 하나님의 법
  - 하나님의 율법들
  lexicon: LSJ
  rationale: 그리스어의 단수/복수 느낌보다 대비 구조를 살리는 데 초점을 두어, 유대 율법과의 병렬성을 ‘하나님의 율법’으로 유지했습니다.
theological_decisions:
- issue: 유대인의 삶의 준거를 나타내는 πολιτεύεσθαι의 번역
  chosen_reading: 하나님의 율법대로 살지 못하게 하려 했습니다
  alternative_readings:
  - 하나님의 율법에 따라 공적 삶을 살지 못하게 하려 했습니다
  - 하나님의 율법으로 삶을 규정하지 못하게 하려 했습니다
  rationale: 이 동사는 시민적·공동체적 삶의 운영을 포함하지만, 본문에서는 실제 삶의 방식 전반을 가리키므로 ‘살다’로 옮기되 법준수의 의미를 분명히 했습니다.
