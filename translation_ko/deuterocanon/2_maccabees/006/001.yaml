  to: 얼마 지나지 않아[a] 왕은 나이 든 아테네 사람을 보내어, 유대인들이 조상들에게서 물려받은 율법[b]을 떠나 하나님의 율법에 따라 살지 못하도록 강요하려고 했습니다.
  rationale: 왕이 사람을 보낸 목적을 나타내는 ἀναγκάζειν의 강제성을 ‘강요하려고’로 회복했습니다. πατρίων은 조상 전승의 뜻을 보존하면서도 현대 한국어로 자연스럽게 ‘조상들에게서 물려받은’으로 옮겼습니다. 시간 표현과 두 각주의 정확성 및 앵커 위치도 조정했습니다.
