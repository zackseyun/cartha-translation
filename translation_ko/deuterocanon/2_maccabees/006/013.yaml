lexical_decisions:
- source_word: τὸ μὴ πολὺν χρόνον ἐᾶσθαι
  english_pob_choice: not letting ... go on for a long time
  chosen_korean: 오랫동안 그대로 있게 하지 않으시고
  alternatives_korean:
  - 오랫동안 계속하게 두지 않으시고
  - 오랫동안 용납하지 않으시고
  lexicon: LSJ
  rationale: 부정사구가 문장의 주어 역할을 하므로 한국어에서는 자연스럽게 절로 풀었고, ἐᾶσθαι의 ‘허용하다/두다’ 의미를 살려 방치하지 않으신다는 뉘앙스를 담았습니다.
- source_word: τοὺς δυσσεβοῦντας
  english_pob_choice: those who act impiously
  chosen_korean: 불경하게 행하는 자들
  alternatives_korean:
  - 경건하지 않게 사는 자들
  - 불경한 자들
  - 경건을 저버리는 자들
  lexicon: LSJ
  rationale: 형용사적 꼬리표보다 행위 동사를 살려 ‘행하는 자들’로 옮겨, 지속적인 태도와 행위를 드러내었습니다.
- source_word: περιπίπτειν τοῖς ἐπιτιμίοις
  english_pob_choice: immediately bringing punishments upon them
  chosen_korean: 곧바로 벌을 내리시는
  alternatives_korean:
  - 곧바로 형벌이 닥치게 하시는
  - 즉시 벌에 떨어지게 하시는
  - 즉시 징벌을 당하게 하시는
  lexicon: LSJ
  rationale: περιπίπτειν의 ‘닥치다/덮치다’ 계열 의미를 한국어에서 자연스러운 능동 표현으로 풀어, 심판이 지체 없이 임한다는 점을 살렸습니다.
- source_word: μεγάλης εὐεργεσίας
  english_pob_choice: great kindness
  chosen_korean: 큰 선하심
  alternatives_korean:
  - 큰 호의
  - 큰 은혜
  - 큰 자비
  lexicon: LSJ
  rationale: εὐεργεσία는 단순 감정이 아니라 ‘선행/호의’를 뜻하므로, 문맥상 벌을 통한 유익이라는 논지를 살려 ‘선하심’으로 옮겼습니다.
- source_word: σημεῖόν ἐστιν
  english_pob_choice: is a sign
  chosen_korean: 표징입니다
  alternatives_korean:
  - 표입니다
  - 징표입니다
  - 증거입니다
  lexicon: LSJ
  rationale: σημεῖον의 표지적·증거적 의미를 반영하면서도, 문장의 수사적 격을 유지하는 ‘표징’을 선택했습니다.
theological_decisions:
- issue: 지체 없는 벌이 오히려 선하심의 표시라는 역설
  chosen_reading: ‘벌을 내리시는 것’과 ‘큰 선하심’을 함께 유지해, 심판 자체를 선한 돌보심의 표현으로 말하는 역설을 그대로 드러냈습니다.
  alternative_readings:
  - ‘훈계하시는 것’으로 완화하여 읽기
  - ‘자비’로 바꾸어 심판성을 약화시키기
  rationale: 원문은 불경한 자들에 대한 즉각적 심판이 하나님의 유익한 행위라는 점을 강조하므로, 벌의 실제성을 약화하지 않고 동시에 선하심을 유지해야 합니다.
  doctrine_reference: 심판과 선하심의 긴장을 보존
