  - marker: b
    text: The subject 'he' is implicit in Greek and is supplied from the immediate context, referring to the Lord.
    reason: cross_reference
translation:
  language: ko
  text: 우리의 죄가 그 끝에 이르렀을 때에[a], 그가 나중에 우리에게 복수하지 않게 하려는 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘우리의 죄가 그 끝에 이르렀을 때에’입니다. 여기서 ‘끝’은 시간적 종료보다 죄가 한계나 분량에 도달했다는 뜻을 담습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어에는 주어가 명시되지 않았지만, 바로 앞 문맥이 가리키는 주체를 한국어에서 보완했습니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἵνα μὴ
  english_pob_choice: so that ... may not
  chosen_korean: …하지 않게 하려는 것입니다
  alternatives_korean:
