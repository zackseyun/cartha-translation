  lexicon: LSJ
  rationale: 이 관용구는 단순한 시간의 ‘끝’보다 죄가 한계/분량에 도달했다는 뜻이므로, ‘그 끝에 이르렀을 때에’로 옮겨 의미를 보존했습니다.
- source_word: ἡμῶν τῶν ἁμαρτιῶν
  english_pob_choice: our sins
  chosen_korean: 우리의 죄
  alternatives_korean:
  - 우리 죄들
