  lexicon: BDAG
  rationale: ἵνα μὴ의 목적·방지 의미를 한국어의 자연스러운 목적 표현으로 옮겼으며, 문맥상 이어지는 결과를 간결하게 살렸습니다.
- source_word: πρὸς τέλος ἀφικομένων
  english_pob_choice: when ... have reached their full measure
  chosen_korean: 그 끝에 이르렀을 때에
  alternatives_korean:
  - 완전히 이르렀을 때에
