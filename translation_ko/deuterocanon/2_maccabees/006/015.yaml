  - ‘하나님이’로 구체화
  rationale: 그리스어는 주체를 생략하지만 바로 앞 문맥에서 이해되는 인물을 가리킵니다. 한국어는 주어를 보완해야 하므로, 본문이 직접 말하지 않은 신적 호칭을 덧붙이지 않고 대명사로만 유지했습니다.
  doctrine_reference: 문맥 보완은 허용하되, 본문이 명시하지 않은 신학적 특정화는 피합니다.
