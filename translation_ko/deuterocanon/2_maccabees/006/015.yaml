  lexicon: BDAG
  rationale: 소유 관계를 자연스럽게 풀어 ‘우리의 죄’로 옮겼고, 복수성은 문맥상 한국어에서 과도하게 표지하지 않았습니다.
- source_word: ὕστερον ἐκδικά
  english_pob_choice: afterward take vengeance on us
  chosen_korean: 나중에 우리에게 복수하지
  alternatives_korean:
  - 후에 우리에게 보복하지
  - 뒤에 우리를 징벌하지
  lexicon: LSJ
  rationale: ἐκδικά는 단순 처벌보다 보복·복수의 법정적 뉘앙스를 가지므로, 문맥의 응보적 의미를 살려 ‘복수하다’로 옮겼습니다.
