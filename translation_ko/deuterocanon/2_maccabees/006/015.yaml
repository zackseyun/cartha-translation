  text: so that[a], when our sins have reached their full measure[b], he may not afterward take vengeance on us.
  footnotes:
  - marker: a
    text: Or, more literally, 'when our sins have come to the end.' The phrase likely means that the sins have reached their full limit or full measure.
    reason: lexical_alternative
  - marker: b
    text: The subject 'he' is implicit in Greek and is supplied from the immediate context, referring to the Lord.
    reason: cross_reference
translation:
  language: ko
  text: 우리의 죄가 그 한계에 이르렀을 때[a], 나중에 우리에게 보복하시지 않으려는 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘우리의 죄가 끝에 이르렀을 때’입니다. 여기서 ‘끝’은 시간적 종료라기보다 죄가 한계나 가득 찬 분량에 도달했다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어에는 주어가 명시되지 않았습니다. 바로 앞 문맥에서 주님을 가리키므로, 한국어에서는 존대 표현으로 그 주체를 나타냈습니다.
    reason: cross_reference
