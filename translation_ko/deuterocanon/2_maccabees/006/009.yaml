translation:
  language: ko
  text: 그리하여 헬라 사람의 관습으로 들어가려 하지 않는 자들은 모두 살육당해야 했습니다[a]. 그래서 지금 닥친 이 비참함을 볼 수 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘헬라 관습으로 넘어가려 하지 않는 자들.’ 그리스어 표현은 문자적으로는 ‘헬라의 것들로 넘어가다’이며, 넓게는 헬라화된 관습과 생활양식을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ προαιρουμένους μεταβαίνειν ἐπὶ τὰ Ἑλληνικά
  english_pob_choice: did not choose to adopt the Greek ways
  chosen_korean: 헬라 사람의 관습으로 들어가려 하지 않는 자들
  alternatives_korean:
  - 헬라 방식으로 전향하려 하지 않는 자들
  - 헬라 관습을 받아들이려 하지 않는 자들
  - 헬라의 것들로 넘어가려 하지 않는 자들
  lexicon: LSJ
  rationale: 직역하면 ‘헬라의 것들로 넘어가다’이지만, 문맥상 헬라화된 생활양식과 관습을 가리키므로 자연스럽게 ‘헬라 사람의 관습’으로 옮겼습니다.
- source_word: κατασφάζειν
  english_pob_choice: were to be slaughtered
  chosen_korean: 살육당해야 했습니다
  alternatives_korean:
  - 도살되어야 했습니다
