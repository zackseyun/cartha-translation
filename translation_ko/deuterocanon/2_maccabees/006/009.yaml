  text: But those who did not choose to adopt the Greek ways were to be slaughtered[a]. Thus one could see the present misery.
  footnotes:
  - marker: a
    text: Or 'to go over to Greek customs.' The Greek expression is literally 'to go over to the Greek things,' referring broadly to Hellenistic ways and practices.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 헬라식 관습으로 넘어가기를 택하지 않은 사람들은 살육당해야 했습니다[a]. 그리하여 눈앞에 닥친 비참함을 볼 수 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘헬라식 관습으로 넘어가기를 택하지 않은 사람들.’ 그리스어 표현은 문자적으로는 ‘헬라의 것들로 넘어가다’이며, 넓게는 헬라화된 관습과 생활양식을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ προαιρουμένους μεταβαίνειν ἐπὶ τὰ Ἑλληνικά
  english_pob_choice: did not choose to adopt the Greek ways
  chosen_korean: 헬라 사람의 관습으로 들어가려 하지 않는 자들
  alternatives_korean:
  - 헬라 방식으로 전향하려 하지 않는 자들
  - 헬라 관습을 받아들이려 하지 않는 자들
  - 헬라의 것들로 넘어가려 하지 않는 자들
  lexicon: LSJ
  rationale: 직역하면 ‘헬라의 것들로 넘어가다’이지만, 문맥상 헬라화된 생활양식과 관습을 가리키므로 자연스럽게 ‘헬라 사람의 관습’으로 옮겼습니다.
- source_word: κατασφάζειν
  english_pob_choice: were to be slaughtered
  chosen_korean: 살육당해야 했습니다
  alternatives_korean:
  - 도살되어야 했습니다
  - 학살되어야 했습니다
  - 죽임을 당해야 했습니다
  lexicon: LSJ
  rationale: 단순한 ‘죽임’보다 훨씬 강한 폭력성과 집단적 도륙의 뉘앙스를 살리기 위해 ‘살육당하다’를 선택했습니다.
- source_word: παρῆν οὖν ὁρᾶν
  english_pob_choice: Thus one could see
  chosen_korean: 그래서 지금 닥친 이 비참함을 볼 수 있었습니다
  alternatives_korean:
  - 그러므로 그 처참한 광경을 볼 수 있었습니다
  - 그리하여 당시의 참상을 볼 수 있었습니다
  - 그래서 눈앞의 비참함을 볼 수 있었습니다
  lexicon: LSJ
  rationale: 비인칭적 관찰 표현을 한국어로 자연스럽게 옮기면서, 이어지는 대상인 ‘τὴν ἐνεστῶσαν ταλαιπωρίαν’의 현재적·압박적 성격을 ‘지금 닥친 이 비참함’으로 반영했습니다.
- source_word: τὴν ἐνεστῶσαν ταλαιπωρίαν
  english_pob_choice: the present misery
  chosen_korean: 지금 닥친 이 비참함
  alternatives_korean:
  - 현재의 비참함
  - 눈앞의 환난
  - 현존하는 고통
  lexicon: LSJ
  rationale: ἐνεστῶσαν은 단순한 시간 부사적 ‘현재’보다 ‘현존하는, 닥쳐 있는’ 의미가 강하므로, 압박 속에 이미 덮친 고난이라는 점을 살렸습니다.
