base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/026.yaml
  text: For even if for the present I escape the punishment from men[b][a], yet I will escape neither alive nor dead from the hands of the Almighty.
  footnotes:
  - marker: a
    text: Or, more explicitly, 'the punishment inflicted by men.'
    reason: lexical_alternative
  - marker: b
    text: That is, he cannot escape divine judgment either in life or by means of death.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 내가 지금 당장은 사람들에게서 오는 벌을 피할 수 있다 해도, 전능하신 분의 손에서는 살아 있을 때나 죽은 뒤에나 결코 피하지 못할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘사람들에게서 온 벌’ 또는 ‘사람들이 내린 벌’입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 표현은 살아 있을 때나 죽은 뒤에나 하나님의 심판을 피할 수 없다는 뜻을 드러냅니다.
    reason: theological_note
lexical_decisions:
- source_word: εἰ γὰρ καὶ
  english_pob_choice: For even if
  chosen_korean: 만일 …이라 해도
  alternatives_korean:
  - 설령 …라도
  - 비록 …할지라도
  lexicon: LSJ
  rationale: γάρ의 설명적 연결과 εἰ + καί의 양보 뉘앙스를 한국어의 조건·양보 구조로 자연스럽게 살렸습니다.
- source_word: ἐπὶ τοῦ παρόντος
  english_pob_choice: for the present
  chosen_korean: 지금 당장은
  alternatives_korean:
  - 현재로서는
  - 당분간
  lexicon: LSJ
  rationale: 일시적 한정을 분명히 하되, 한국어에서 자연스럽고 구어적이지 않은 표현으로 옮겼습니다.
- source_word: τὴν ἐξ ἀνθρώπων τιμωρίαν
  english_pob_choice: the punishment from men
  chosen_korean: 사람들에게서 오는 벌
  alternatives_korean:
  - 사람들이 내리는 형벌
  - 인간의 벌
  lexicon: LSJ
  rationale: ἐξ ἀνθρώπων의 출처/기원 감각을 살려 ‘사람들에게서 오는’으로 옮기고, τιμωρία는 문맥상 ‘벌’이 가장 직접적입니다.
- source_word: τὰς τοῦ παντοκράτορος χεῖρας
  english_pob_choice: the hands of the Almighty
  chosen_korean: 전능하신 분의 손
  alternatives_korean:
  - 전능자의 손
  - 전능하신 하나님의 손
  lexicon: LSJ
  rationale: παντοκράτωρ의 칭호를 ‘전능하신 분’으로 옮겨 원문의 위엄을 유지하면서, Greek에 없는 ‘하나님’을 덧붙이지 않았습니다.
theological_decisions:
- issue: οὔτε ζῶν οὔτε ἀποθανών의 의미와 사후 책임의 함의
  chosen_reading: 살아 있을 때나 죽은 뒤에나 결코 피하지 못할 것입니다
  alternative_readings:
  - 살아서도 죽어서도 피하지 못할 것입니다
  - 살아 있든 죽었든 피하지 못할 것입니다
  rationale: 본문이 말하는 핵심은 죽음이 하나님의 손길을 벗어나는 탈출구가 아니라는 점이므로, 그 긴장을 풀지 않고 한국어로 직접 드러냈습니다.
  doctrine_reference: 본문의 종말론적·심판적 긴장을 보존
