    issue: ‘생명에 대한 애착 때문에 그렇게 앞으로 나아갔습니다’가 원문의 수식 관계를 과도하게 확정하고 ‘그렇게’를 보탭니다.
    rationale: διὰ 구는 본문의 압축된 ‘인내하며 물리침’ 구절과 연결되어 있으며, 그의 나아감 자체가 생명 애착 때문에 일어났다고 단정하기 어렵습니다.
  - severity: medium
    issue: ‘거슬러 버티는’은 한국어에서 목적어 결합이 부자연스럽습니다.
    rationale: ἀμύνασθαι와 ὑπομένοντας의 결합을 ‘물리치며 견디는’으로 옮기면 저항과 인내를 모두 자연스럽게 드러냅니다.
  - severity: low
