  yaml_path: translation/deuterocanon/2_maccabees/006/020.yaml
  text: But after spitting it out[a], he came forward in the manner required for those who choose to resist things that it is not lawful to taste, even for the sake of one’s attachment to life.
  footnotes:
  - marker: a
    text: Or 'those who endure in resisting things it is not lawful to taste.' The Greek compresses endurance and resistance into a difficult phrase.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그것을 내뱉은 뒤, 그는 맛보는 것이 법에 맞지 않는 것들을 거슬러 버티는 이들에게 요구되는 방식대로, 곧 생명에 대한 애착 때문에 그렇게 앞으로 나아갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘맛보는 것이 법에 맞지 않는 것들을 거슬러 인내하는 이들’로도 옮길 수 있습니다. 그리스어는 인내와 저항을 한 압축된 구절로 담아 냅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: προπτύσας
  english_pob_choice: after spitting it out
  chosen_korean: 그것을 내뱉은 뒤
  alternatives_korean:
  - 침을 뱉은 뒤
  - 뱉어 낸 뒤
  lexicon: LSJ
  rationale: 먹으려던 것을 입 밖으로 내보내는 동작을 자연스러운 한국어로 옮겼습니다. 대상이 문맥상 불법한 음식이므로 ‘그것을’로 받아 주어를 분명히 했습니다.
- source_word: καθʼ ὃν ἔδει τρόπον
  english_pob_choice: in the manner required
  chosen_korean: 요구되는 방식대로
  alternatives_korean:
  - 마땅히 해야 하는 방식으로
  - 필요한 대로
  lexicon: LSJ
  rationale: 윤리적·상황적 필연성을 살리면서도 한국어에서 어색하지 않게 옮겼습니다.
- source_word: τοὺς ὑπομένοντας ἀμύνασθαι
  english_pob_choice: those who choose to resist
  chosen_korean: 거슬러 버티는 이들
  alternatives_korean:
  - 저항하기로 한 이들
  - 버텨 내며 맞서는 이들
  lexicon: LSJ
  rationale: ὑπομένω의 ‘버티다/견디다’와 ἀμύνασθαι의 ‘맞서다/물리치다’가 함께 있는 압축 표현이라, 두 동사를 모두 드러내는 한국어로 압축해 옮겼습니다.
- source_word: ὧν οὐ θέμις γεύσασθαι
  english_pob_choice: things that it is not lawful to taste
  chosen_korean: 맛보는 것이 법에 맞지 않는 것들
  alternatives_korean:
  - 맛보아서는 안 되는 것들
  - 법적으로 허락되지 않은 것들
  lexicon: LSJ
  rationale: θέμις의 규범적·종교적 금지성을 살리되, ‘taste’를 단순히 ‘먹다’로 평탄화하지 않고 ‘맛보다’로 유지했습니다.
- source_word: διὰ τὴν πρὸς ζῆν φιλοστοργίαν
  english_pob_choice: even for the sake of one’s attachment to life
  chosen_korean: 생명에 대한 애착 때문에
  alternatives_korean:
  - 삶을 향한 애정 때문에
  - 살고자 하는 애착 때문에
  lexicon: LSJ
  rationale: φιλοστοργία의 강한 애착/정붙임의 뉘앙스를 ‘애착’으로 살리고, πρὸς ζῆν을 ‘생명에 대한’으로 자연스럽게 풀었습니다.
theological_decisions:
- issue: οὐ θέμις의 도덕·종교적 금지의 강도
  chosen_reading: ‘법에 맞지 않는’으로 옮겨, 단순한 개인적 거부가 아니라 종교적·윤리적 금지라는 힘을 유지했습니다.
  alternative_readings:
  - 금지된
  - 허용되지 않는
  rationale: 이 구절은 순교 서사 안에서 율법적/성스러운 정당성을 전제하므로, 완화된 표현보다 규범적 긴장을 드러내는 번역이 적절합니다.
  doctrine_reference: '번역 원칙: 본문이 드러내는 거룩한 금지의 무게를 약화시키지 않습니다.'
