  text: προπτύσας δέ, καθʼ ὃν ἔδει τρόπον προσέρχεσθαι τοὺς ὑπομένοντας ἀμύνασθαι ὧν οὐ θέμις γεύσασθαι διὰ τὴν πρὸς ζῆν φιλοστοργίαν.
