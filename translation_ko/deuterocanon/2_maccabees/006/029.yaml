revisions:
- from: 그를 인도하던 이들은 조금 전까지 보이던 호의를, 방금 한 말 때문에 적대감으로 바꾸었습니다. 그들은 그것을, 자기들이 생각하기에, 어리석음으로 여겼기 때문입니다.[a]
  to: 그를 이끌고 가던 사람들은 그가 앞서 한 말들을 자기들이 어리석음으로 여겼기 때문에, 조금 전에 그에게 보였던 호의를 적대감으로 바꾸었습니다.[a]
  rationale: 인과 관계를 한 문장 안에 재구성하여, 그들이 앞서 한 말들을 어리석음으로 판단했기 때문에 이전의 호의를 적대감으로 바꾸었다는 원문의 구조를 보존했습니다. 판단의 주체를 ‘자기들이’로 명시하고, 복수 ‘말들’과 ‘조금 전에 그에게 보였던 호의’를 반영했습니다.
