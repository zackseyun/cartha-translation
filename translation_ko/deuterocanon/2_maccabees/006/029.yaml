base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/029.yaml
  text: Those who were leading him changed the goodwill they had shown him a little earlier into hostility because of the words just spoken[a], since they regarded them, as they supposed, as madness.
  footnotes:
  - marker: a
    text: Or 'folly,' 'senselessness,' or 'desperation' for 'madness.' The Greek term expresses what his escorts thought of his words, not necessarily the narrator's own judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그를 인도하던 이들은 조금 전까지 보이던 호의를, 방금 한 말 때문에 적대감으로 바꾸었습니다. 그들은 그것을, 자기들이 생각하기에, 어리석음으로 여겼기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘어리석음’은 여기서 수행원들이 그렇게 판단한 말의 성격을 옮긴 것입니다. 문맥상 서술자의 최종 판정이 아닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶνδε ἀγόντων πρὸς αὐτόν
  english_pob_choice: those who were leading him
  chosen_korean: 그를 인도하던 이들
  alternatives_korean:
  - 그를 데리고 가던 이들
  - 그의 호위자들
  lexicon: LSJ
  rationale: ἀγόντων은 단순한 동행보다 ‘이끌고 가다/인도하다’의 뜻을 담으므로, 행위의 방향성을 살리면서도 자연스럽게 옮겼습니다.
- source_word: τὴν μικρῷ πρότερον εὐμένειαν
  english_pob_choice: the goodwill they had shown him a little earlier
  chosen_korean: 조금 전까지 보이던 호의
  alternatives_korean:
  - 조금 전의 호의
  - 얼마 전 그에게 베푼 호의
  lexicon: LSJ
  rationale: εὐμένεια는 단순한 친절보다 ‘호의, 우호적 태도’를 가리키며, μικρῷ πρότερον은 매우 짧은 직전 시점을 뜻하므로 이를 간결하게 반영했습니다.
- source_word: δυσμένειαν
  english_pob_choice: hostility
  chosen_korean: 적대감
  alternatives_korean:
  - 적의
  - 악의
  lexicon: LSJ
  rationale: εὐμένεια의 반대말로서 관계가 우호에서 적대로 급반전하는 뉘앙스를 살리기 위해 ‘적대감’을 택했습니다.
- source_word: ἀπόνοιαν
  english_pob_choice: madness
  chosen_korean: 어리석음
  alternatives_korean:
  - 광기
  - 분별없음
  - 절망
  lexicon: LSJ
  rationale: 문맥상 이것은 화자의 실제 평가라기보다 수행원들이 그렇게 여긴 판단이므로, 강한 정신질환 뉘앙스의 ‘광기’보다 이들이 본 말의 무분별함을 드러내는 ‘어리석음’이 더 무난합니다.
theological_decisions:
- issue: 평가의 주체가 서술자인지 수행원들인지
  chosen_reading: 문장 끝의 판단은 서술자의 판정이 아니라 수행원들의 인식으로 유지했습니다.
  alternative_readings:
  - 방금 한 말을 어리석다고 단정적으로 서술하는 번역
  rationale: ὡς αὐτοὶ ὑπελάμβανον은 ‘그들 자신이 그렇게 여겼다’는 거리두기를 명시하므로, 본문의 관찰자적 서술을 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3 (ambiguity/tension preservation)
