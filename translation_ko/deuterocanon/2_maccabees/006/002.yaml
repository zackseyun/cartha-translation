  text: μολῦναι δὲ καὶ τὸν ἐν Ἰεροσολύμοις νεὼ καὶ προσονομάσαι Διὸς Ὀλυμπίου, καὶ τὸν ἐν Γαριζείν, καθὼς ἐτύγχανον οἱ τὸν τόπον οἰκοῦντες, Διὸς ξενίου.
