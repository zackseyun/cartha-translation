base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/002.yaml
  text: and also to defile the temple in Jerusalem and to name it for Olympian Zeus[a], and the one on Gerizim, as those who inhabited the place happened to do[b], for Zeus the protector of strangers.
  footnotes:
  - marker: a
    text: Or 'to rename it as Olympian Zeus.' The Greek verb can mean to assign an additional or new designation.
    reason: lexical_alternative
  - marker: b
    text: Greek 'Zeus Xenios,' that is, Zeus as patron of hospitality and protector of strangers/guests.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 예루살렘에 있는 성전을 더럽히고, 그것을 올림포스의 제우스의 이름으로 부르게 하며[a], 그곳 주민들이 그러했던 것처럼 가리짐에 있는 성전도 제우스, 곧 나그네를 보호하는 신의 이름으로 부르게 하였습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘올림포스의 제우스로 새 이름을 붙이게 하며’. 그리스어 동사는 추가적이거나 새로운 명칭을 부여하는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 ‘Zeus Xenios’에 해당하며, 곧 환대의 신이자 나그네/손님을 보호하는 제우스를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μολῦναι
  english_pob_choice: to defile
  chosen_korean: 더럽히고
  alternatives_korean:
  - 부정하게 하고
  - 오염시키고
  lexicon: LSJ
  rationale: 성전의 제의적·종교적 훼손을 드러내는 동사이므로, 일상적 의미보다 예배적 오염을 담는 ‘더럽히다’를 택했습니다.
- source_word: νεὼ
  english_pob_choice: temple
  chosen_korean: 성전
  alternatives_korean:
  - 신전
  - 전당
  lexicon: LSJ
  rationale: 예루살렘의 ναός/νεώς는 건물 자체보다 거룩한 성전 공간을 가리키므로 한국어 성경에서 자연스럽고 정확한 ‘성전’이 적절합니다.
- source_word: προσονομάσαι Διὸς Ὀλυμπίου
  english_pob_choice: to name it for Olympian Zeus
  chosen_korean: 올림포스의 제우스의 이름으로 부르게 하며
  alternatives_korean:
  - 올림포스 제우스라고 부르게 하며
  - 제우스 올림피오스의 이름으로 부르게 하며
  lexicon: LSJ
  rationale: προσονομάσαι는 ‘추가로 이름을 붙이다/호칭하다’의 뜻이므로, ‘~의 이름으로 부르게 하다’로 옮겨 강제된 재명명임을 살렸습니다.
- source_word: Διὸς ξενίου
  english_pob_choice: Zeus the protector of strangers
  chosen_korean: 제우스, 곧 나그네를 보호하는 신
  alternatives_korean:
  - 제우스, 곧 손님을 보호하는 신
  - 제우스 제니오스
  lexicon: LSJ
  rationale: ξένιος는 환대와 이방인 보호의 제우스 별칭이므로, 의미를 풀어 ‘나그네를 보호하는 신’으로 옮기고 본문 흐름에 맞게 제우스를 설명적으로 붙였습니다.
theological_decisions:
- issue: 이방 신 명칭을 한국어로 어떻게 드러낼 것인가
  chosen_reading: 본문에서는 별칭의 의미를 풀어 옮기되, 그 대상이 우상 제의적 명칭임이 분명하게 보이도록 했습니다.
  alternative_readings:
  - ‘제우스 올림피오스’, ‘제우스 제니오스’처럼 음역 중심으로 둘 것
  - 본문에서 그냥 ‘올림포스의 제우스’, ‘손님을 돌보는 제우스’로 단순화할 것
  rationale: 이 구절은 유대 성전의 훼손과 강제 재명명을 묘사하므로, 독자가 즉시 이교적 재헌납의 성격을 파악하도록 의미를 드러내는 번역이 적절합니다.
  doctrine_reference: '번역 원칙: 고유명은 보존하되, 제의적 의미는 문맥이 요구하는 만큼 드러낸다.'
- issue: καθὼς ἐτύγχανον οἱ τὸν τόπον οἰκοῦντες의 처리
  chosen_reading: ‘그곳 주민들이 그러했던 것처럼’으로 처리해, 주민들의 당시 상황/관행을 암시하는 절로 남겼습니다.
  alternative_readings:
  - ‘그곳 주민들이 살고 있는 대로’
  - ‘그곳 주민들의 관습에 따라’
  rationale: 그리스어가 압축적이어서 해석을 과도하게 고정하지 않고, 문맥상 주민들의 상태나 관행을 반영하는 정도로 유지했습니다.
  doctrine_reference: 문맥이 허용하는 긴장을 보존한다.
