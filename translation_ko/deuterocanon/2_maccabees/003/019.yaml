  source_fidelity: 핵심 장면과 동작은 대체로 충실합니다. 다만 κατὰ τὰς ὁδοὺς ἐπλήθυνον은 여인들이 거리마다 ‘가득하였다’라고 하기보다 거리를 가득 메우고 있었다고 옮기는 편이 주어와 장면을 더 분명히 드러냅니다. κατάκλειστοι는 단순히 ‘갇혀 있던’보다 실내에 머물도록 갇혀 있던 처녀들이라는 뜻을 자연스럽게 전달할 필요가 있습니다.
  naturalness: 초안은 합쇼체를 잘 유지하지만, ‘거리마다 가득하였고’는 현대 한국어에서 다소 압축적이고 어색합니다. ‘거리를 가득 메우고 있었으며’가 더 자연스럽고 원문의 미완료상에도 맞습니다.
  terminology: ‘베옷’, ‘처녀들’, ‘성문’, ‘성벽’은 적절합니다. ‘처녀들’은 παρθένων의 구체성을 보존하며, ‘실내에 갇혀 있던’은 κατάκλειστοι의 폐쇄·억류의 뉘앙스를 유지하되 한국어의 불필요한 형벌 연상을 줄입니다.
