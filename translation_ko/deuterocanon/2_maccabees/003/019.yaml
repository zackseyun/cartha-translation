base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/019.yaml
  text: And the women[a], with sackcloth bound under their breasts, were crowding the streets; and the virgins who were shut in, some were running together to the gates, others to the walls[c][b], and some were peering out through the windows.
  footnotes:
  - marker: a
    text: Or 'maidens'; the Greek more specifically says 'virgins.'
    reason: lexical_alternative
  - marker: b
    text: '''Were crowding the streets'' renders a Greek expression literally meaning ''were multiplying along the streets.'''
    reason: lexical_alternative
  - marker: c
    text: The phrase 'with sackcloth bound under their breasts' depicts women wearing mourning garb fastened around the chest.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 여인들은 가슴 아래로 베옷을 둘러매고 거리를 가득 메우고 있었으며,[a][b] 실내에 갇혀 있던 처녀들은 어떤 이들은 성문으로 함께 달려가고, 어떤 이들은 성벽으로 달려가며, 또 어떤 이들은 창문으로 내다보고 있었습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: σάκκους는 애도 때 입는 거친 베옷을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: ἐπλήθυνον은 문자적으로는 ‘많아지고 있었다’에 가깝지만, 여기서는 여인들이 거리를 가득 메우는 모습을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: παρθένων은 단순한 ‘젊은 여자들’보다 더 구체적으로 ‘처녀들’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπεζωσμέναι ... σάκκους κατὰ τὰς ὁδοὺς
  english_pob_choice: with sackcloth bound under their breasts ... were crowding the streets
  chosen_korean: 가슴 아래에 베옷을 동여맨 채 거리마다 가득하였고
  alternatives_korean:
  - 가슴 아래에 베옷을 띠처럼 둘러맨 채 거리마다 가득하였고
  - 가슴 아래에 베옷을 묶은 채 거리마다 몰려 있었고
  lexicon: LSJ
  rationale: ὑπεζωσμέναι와 σάκκους는 애도용 거친 옷을 가슴 아래에 매어 두른 모습을 가리키므로, 직역보다 상황을 살린 '가슴 아래에 베옷을 동여맨 채'가 원문의 시각적 의미를 잘 드러냅니다.
- source_word: κατὰ τὰς ὁδοὺς ἐπλήθυνον
  english_pob_choice: were crowding the streets
  chosen_korean: 거리마다 가득하였고
  alternatives_korean:
  - 거리를 메우고 있었고
  - 거리마다 몰려 있었고
  lexicon: LSJ
  rationale: ἐπλήθυνον은 문자적으로는 '많아지다/증가하다'이므로, 거리마다 사람이 넘쳐나는 장면을 자연스러운 한국어로 옮겨 '가득하였고'로 처리했습니다.
- source_word: παρθένων
  english_pob_choice: virgins
  chosen_korean: 처녀들
  alternatives_korean:
  - 동정녀들
  - 미혼의 젊은 여자들
  lexicon: LSJ
  rationale: 이 문맥의 παρθένων은 단순한 젊은 여성이 아니라 성적·사회적 표지가 있는 '처녀들'을 뜻하므로, 현대 한국어에서 그 구별을 가장 직접적으로 드러내는 표현을 택했습니다.
- source_word: συνέτρεχον ἐπὶ τοὺς πυλῶνας ... ἐπὶ τὰ τείχη
  english_pob_choice: were running together to the gates ... to the walls
  chosen_korean: 어떤 이들은 성문으로 달려가고, 어떤 이들은 성벽으로 달려가며
  alternatives_korean:
  - 어떤 이들은 성문을 향해 함께 달려가고, 어떤 이들은 성벽으로 달려가며
  - 어떤 이들은 문간으로 달려가고, 어떤 이들은 담으로 달려가며
  lexicon: LSJ
  rationale: συνέτρεχον은 함께 몰려 달려가는 동작을 나타내지만 한국어에서는 문맥상 반복되는 '어떤 이들은 ... 어떤 이들은 ...' 구조로 충분히 전달되므로, 동사에 '달려가'를 두어 긴박감을 살렸습니다.
- source_word: διεκύπτον διὰ τῶν θυρίδων
  english_pob_choice: were peering out through the windows
  chosen_korean: 창문으로 내다보고 있었습니다
  alternatives_korean:
  - 창문으로 엿보고 있었습니다
  - 창문 너머로 내다보고 있었습니다
  lexicon: LSJ
  rationale: διεκύπτον은 몸을 내밀어 밖을 살피는 뉘앙스가 있어, '내다보고 있었습니다'로 자연스럽게 옮기되 '창문으로'를 붙여 장소를 분명히 했습니다.
theological_decisions:
- issue: 애도복의 구체적 이미지와 여성 집단의 공적 움직임을 어떻게 보존할지
  chosen_reading: 여인들의 베옷과 성문·성벽·창문으로 향하는 움직임을 구체적으로 유지했습니다.
  alternative_readings:
  - '''슬픔의 옷''처럼 일반화하여 옮김'
  - 움직임을 단순히 '밖을 바라보았다'로 축소함
  rationale: 이 절은 공적 애도와 도시 전체의 동요를 시각적으로 그리므로, 문화적 배경을 흐리지 않도록 의복과 동작의 구체성을 살렸습니다.
  doctrine_reference: 문맥적·서사적 정확성
- issue: παρθένων의 성별·사회적 구분을 어떻게 번역할지
  chosen_reading: '''처녀들''로 옮겨 원문이 가진 사회적·신체적 구별을 유지했습니다.'
  alternative_readings:
  - '''미혼 여성들'''
  - '''젊은 여자들'''
  rationale: 원문은 단순 연령대가 아니라 처녀성이라는 구체적 표지를 사용하므로, 이를 완화하지 않고 드러내는 것이 본문의 의미를 더 정확히 전달합니다.
  doctrine_reference: 성경 번역의 어휘 충실성
