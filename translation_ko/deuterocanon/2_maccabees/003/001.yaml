  source_fidelity: 수정이 필요합니다. κατοικουμένης의 주어는 ‘거룩한 도성’이 아니라 그 도성에 사는 사람들(도성이 사람이 사는 상태)입니다. 현행 ‘도성이 ... 거주하고’는 도시 자체가 거주하는 것으로 읽혀 원문의 상태적 뜻을 벗어납니다. 수정문은 이 뜻을 자연스러운 한국어로 보존합니다. μετὰ πάσης εἰρήνης, τῶν νόμων, κάλλιστα, 그리고 διά + 대격의 원인 관계도 유지했습니다.
  naturalness: ‘도성이 거주하고 있었다’는 현대 한국어에서 부자연스럽고 의미상 부정확합니다. ‘도성에는 ... 사람들이 살고 있었고’가 자연스럽습니다. ‘율법들이’는 원문의 복수형을 반영하면서도 문장 안에서 자연스럽게 기능합니다.
  terminology: ‘거룩한 도성’, ‘평강’, ‘율법’, ‘대제사장’은 적절합니다. ‘대제사장 오니아스’의 어순이 한국어에서 더 자연스럽습니다. κάλλιστα의 ‘가장 잘’ 및 각주의 ‘아주 잘’ 대안도 유지할 수 있습니다.
