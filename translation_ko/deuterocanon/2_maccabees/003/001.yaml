  text: 거룩한 도성에는 온전한 평강 가운데 사람들이 살고 있었고, 율법들이 대제사장 오니아스 때문에 가장 잘 지켜지고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
