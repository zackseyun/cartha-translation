  text: For a certain dread and bodily trembling had come over the man[a], by which the pain present in his heart was becoming evident to those who were watching.
  footnotes:
  - marker: a
    text: Or 'the anguish in his heart' for τὸ κατὰ καρδίαν ἐνεστὸς ἄλγος; the Greek can denote inward emotional distress as well as pain more generally.
