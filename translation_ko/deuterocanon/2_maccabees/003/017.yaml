translation:
  language: ko
  text: 이는 어떤 두려움과 몸의 떨림이 그 사람을 엄습했기 때문입니다. 이로 말미암아 그의 마음속에 자리한 고통[a]이 지켜보는 사람들에게 분명히 드러나고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마음속의 고뇌’로도 옮길 수 있습니다. τὸ κατὰ καρδίαν ἐνεστὸς ἄλγος는 내면의 정서적 괴로움이나 더 넓은 의미의 고통을 가리킬 수 있습니다.
    reason: lexical_alternative
