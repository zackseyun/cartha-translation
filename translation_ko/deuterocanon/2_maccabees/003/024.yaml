  text: αὐτόθι δὲ αὐτοῦ σὺν τοῖς δορυφόροις κατὰ τὸ γαζοφυλάκιον ἤδη παρόντος, ὁ τῶν πνευμάτων καὶ πάσης ἐξουσίας δυνάστης ἐπιφάνειαν μεγάλην ἐποίησεν, ὥστε πάντας τοὺς κατατολμήσαντας συνελθεῖν, καταπλαγέ- ντας τὴν τοῦ θεοῦ δύναμιν, εἰς ἔκλυσιν καὶ δειλίαν τραπῆναι.
