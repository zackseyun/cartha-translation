base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/024.yaml
  text: But when he had already arrived there with the guards at the treasury[a], the Sovereign of spirits and of all authority made a great manifestation, so that all who had dared to come in, struck with awe at the power of God[c][b], were turned to weakness and fear.
  footnotes:
  - marker: a
    text: Or 'bodyguards' for 'guards'; the Greek literally refers to spear-bearers.
    reason: lexical_alternative
  - marker: b
    text: Or 'made a great appearing'; the Greek emphasizes a striking divine manifestation.
    reason: lexical_alternative
  - marker: c
    text: The phrase 'had dared to come in' may also be understood more generally as 'had dared to come together,' but the immediate context favors entry into the treasury area.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 이미 호위병들과 함께 보물고에 이르렀을 때, 영들의 통치자이시며 모든 권세의 주인이신 분께서 크게 나타나심을 행하셨습니다. 그래서 감히 들어오던 모든 사람은 하나님의 능력에 놀라[어], 기진과 두려움으로 돌이켰습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘호위병들’은 문자적으로는 ‘창을 든 사람들’이라는 뜻의 표현을 기능적으로 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘크게 나타나심을 행하셨습니다’는 ἐπιφάνειαν μεγάλην ἐποίησεν의 비교적 직역적인 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘감히 들어오던’은 문맥상 보물고 안으로 들어오는 동작을 염두에 둔 번역입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: δορυφόροις
  english_pob_choice: guards
  chosen_korean: 호위병들
  alternatives_korean:
  - 경비병들
  - 수발병들
  - 창병들
  lexicon: LSJ
  rationale: 문맥상 무장한 수행 인원을 가리키므로 기능을 살려 ‘호위병들’로 옮겼습니다. ‘창병들’은 문자성은 높지만 한국어 독자에게 기능이 덜 분명합니다.
- source_word: γαζοφυλάκιον
  english_pob_choice: treasury
  chosen_korean: 보물고
  alternatives_korean:
  - 금고
  - 국고
  - 재무실
  lexicon: LSJ
  rationale: 성전 문맥에서 귀중품을 보관하는 장소이므로 ‘보물고’가 자연스럽고 원문의 장소감을 살립니다.
- source_word: ὁ τῶν πνευμάτων καὶ πάσης ἐξουσίας δυνάστης
  english_pob_choice: the Sovereign of spirits and of every authority
  chosen_korean: 영들의 통치자이시며 모든 권세의 주인이신 분
  alternatives_korean:
  - 영들의 주님이시며 모든 권세의 통치자이신 분
  - 영들과 모든 권세를 다스리시는 분
  - 영들의 주권자이시며 모든 권세의 주인이신 분
  lexicon: LSJ
  rationale: δυνάστης의 통치/주권 뉘앙스를 살리되, 영어 POB의 ‘Sovereign’에 맞춰 한국어에서도 권세 위의 절대 주권을 드러내는 표현으로 옮겼습니다. ἐξουσία는 단순한 ‘힘’보다 ‘권세’가 더 정확합니다.
- source_word: ἐπιφάνειαν μεγάλην ἐποίησεν
  english_pob_choice: made a great manifestation
  chosen_korean: 크게 나타나심을 행하셨습니다
  alternatives_korean:
  - 큰 나타남을 보이셨습니다
  - 크게 현현하셨습니다
  - 크게 나타나셨습니다
  lexicon: LSJ
  rationale: ἐπιφάνεια의 ‘드러나심/나타남’과 ἐποίησεν의 ‘행하다/일으키다’ 둘 다를 살리려 했습니다. ‘현현’은 다소 전문적이어서 문맥의 서술성을 낮춥니다.
- source_word: κατατολμήσαντας συνελθεῖν
  english_pob_choice: had dared to come in
  chosen_korean: 감히 들어오던
  alternatives_korean:
  - 들어오기를 감히 한
  - 감히 함께 들어온
  - 감히 모여든
  lexicon: LSJ
  rationale: 문맥상 보물고 안으로의 진입을 가리키므로 ‘들어오던’으로 풀었습니다. κατατολμάω의 대담함은 ‘감히’로 보존했습니다.
- source_word: καταπλαγέντας
  english_pob_choice: struck with awe
  chosen_korean: 놀라
  alternatives_korean:
  - 경악하여
  - 두려워하여
  - 기겁하여
  lexicon: LSJ
  rationale: 이 동사는 충격과 두려움이 섞인 반응을 나타내므로, ‘놀라’에 뒤의 ‘기진과 두려움’이 이를 보완하도록 했습니다.
- source_word: τὴν τοῦ θεοῦ δύναμιν
  english_pob_choice: the power of God
  chosen_korean: 하나님의 능력
  alternatives_korean:
  - 하나님의 권능
  - 하나님의 힘
  lexicon: LSJ
  rationale: θεοῦ δύναμιν은 가장 مستقیم하게 ‘하나님의 능력’으로 옮기는 것이 자연스럽고 원문 의미를 충분히 전달합니다.
- source_word: εἰς ἔκλυσιν καὶ δειλίαν τραπῆναι
  english_pob_choice: were turned to weakness and fear
  chosen_korean: 기진과 두려움으로 돌이켰습니다
  alternatives_korean:
  - 무기력과 두려움으로 돌아섰습니다
  - 쇠약과 두려움으로 전락했습니다
  - 기진맥진과 두려움에 빠졌습니다
  lexicon: LSJ
  rationale: ἔκλυσις는 ‘기운 빠짐, 기진’의 뜻이 강하고, δειλία는 ‘두려움/비겁함’이어서 결과 상태를 살려 ‘기진과 두려움’으로 옮겼습니다. τραπῆναι의 수동 결과를 한국어에서 자연스럽게 표현했습니다.
theological_decisions:
- issue: 하나님을 가리키는 복합 칭호 ὁ τῶν πνευμάτων καὶ πάσης ἐξουσίας δυνάστης의 번역
  chosen_reading: ‘영들의 통치자이시며 모든 권세의 주인이신 분’으로 옮겨, 영적 존재들과 모든 권세 위에 계신 하나님의 절대 주권을 드러냈습니다.
  alternative_readings:
  - ‘영들의 주님이시며 모든 권세의 주인이신 분’
  - ‘영들의 주권자이시며 모든 권세를 다스리시는 분’
  rationale: 이 구절은 단순한 능력 표현이 아니라, 모든 영적 존재와 권세를 지배하시는 하나님의 주권 선언입니다. ‘주인’과 ‘통치자’를 함께 써서 κύριος가 아닌 δυνάστης의 뉘앙스를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Original-language primacy over translation tradition; Translate titles'
- issue: ἐπιφάνεια의 신학적 색채
  chosen_reading: ‘크게 나타나심’으로 직역적 의미를 살리되, 후대의 기술용어인 ‘현현’으로 고정하지 않았습니다.
  alternative_readings:
  - ‘큰 나타남’
  - ‘큰 현현’
  - ‘크게 나타나셨습니다’
  rationale: 본문의 초점은 하나님의 압도적 자기드러내심입니다. ‘나타나심’은 사건성을 유지하면서도 후대 교리어의 과잉을 피합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve source-language force without over-domestication'
