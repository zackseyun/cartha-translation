lexical_decisions:
- source_word: ὁ δὲ
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 그리고
  - 또
  lexicon: LSJ
  rationale: δέ가 앞 문맥과의 약한 대비 및 서술 전환을 나타내므로, 문맥 흐름을 살리면서도 자연스러운 역접인 ‘그러나’로 옮겼습니다.
- source_word: Ἡλιόδωρος
  english_pob_choice: Heliodorus
  chosen_korean: 헬리오도로스
  alternatives_korean:
  - 헬리오도루스
  lexicon: 고유명사 표기 관행
  rationale: 인명은 현대 한국어 음역 관행에 따라 표기했습니다.
- source_word: τὸ διεγνωσμένον
  english_pob_choice: what had been decided
  chosen_korean: 결정된 것
  alternatives_korean:
  - 정해진 것
  - 결정되어 있는 것
  - 판단된 것
  lexicon: LSJ
  rationale: 완료 수동 분사의 명사적 용법이 이미 내려진 결정을 가리키므로, 한국어에서는 ‘결정된 것’이 가장 간결하게 그 의미를 보존합니다.
- source_word: ἐπετέλει
  english_pob_choice: was carrying out
  chosen_korean: 실행하고 있었습니다
  alternatives_korean:
  - 수행하고 있었습니다
  - 집행하고 있었습니다
  - 이행하고 있었습니다
  lexicon: LSJ
  rationale: 미완료시제의 진행성에 맞추어 과거 진행형으로 옮겼고, 결정의 이행이라는 맥락을 반영해 ‘실행하다’를 선택했습니다.
