base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/028.yaml
  text: The man who had just entered the treasury with much rushing about and all his guard[a], they carried out helpless, being completely incapacitated[c][b], having plainly recognized the sovereign power.
  footnotes:
  - marker: a
    text: Or 'with much pomp' for 'with great rushing about'; the Greek can suggest bustling display accompanying his entrance.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the previously mentioned treasury.'
    reason: lexical_alternative
  - marker: c
    text: The Greek phrase rendered 'being utterly incapacitated' is idiomatic and difficult; it conveys that he was completely brought low.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 많은 소동과 자기의 호위를 거느리고 앞서 말한 보물창고에 막 들어갔으나, 아무런 도움도 받을 수 없는 상태로 완전히 무력해진 채, 그 광경을 통해 그 능력을 분명히 깨달은 사람이 되었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘많은 소동’은 그리스어 παραδρομή가 지닌 부산스러운 움직임과 과시적 행진의 뉘앙스를 반영한 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘앞서 말한 보물창고’는 그리스어 τὸ προειρημένον γαζοφυλάκιον의 직역에 가깝습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘완전히 무력해진 채’는 난해한 토ῖς ὅλοις καθεστῶτα의 결과 상태를 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ πολλῆς παραδρομῆς
  english_pob_choice: with much rushing about
  chosen_korean: 많은 소동과
  alternatives_korean:
  - 분주하게
  - 크게 소란을 피우며
  - 요란하게
  lexicon: LSJ
  rationale: παραδρομή는 단순한 이동이 아니라 부산스러운 움직임과 소동을 가리킬 수 있어, 한국어에서는 자연스럽게 ‘많은 소동’으로 옮겨 장면의 과시성과 급박함을 함께 살렸습니다.
- source_word: πάσης δορυφορίας
  english_pob_choice: all his guard
  chosen_korean: 자기의 호위를 거느리고
  alternatives_korean:
  - 자기의 호위병들을 데리고
  - 자기의 경호대를 거느리고
  - 모든 호위를 거느리고
  lexicon: LSJ
  rationale: δορυφορία는 무장 호위대나 수행 경호를 뜻하므로, 본문 흐름에 맞게 ‘호위’로 옮기고 ‘거느리고’로 동반 관계를 자연스럽게 나타냈습니다.
- source_word: τὸ προειρημένον ... γαζοφυλάκιον
  english_pob_choice: the treasury
  chosen_korean: 앞서 말한 보물창고
  alternatives_korean:
  - 그 보물창고
  - 이전에 언급된 보물창고
  - 그 재무창고
  lexicon: LSJ
  rationale: γαζοφυλάκιον은 ‘보물창고’ 또는 ‘보관창고’ 성격의 장소이므로, 의미를 살려 ‘보물창고’로 옮겼고 προειρημένον의 ‘앞서 말한’도 반영했습니다.
- source_word: τοῖς ὅλοις καθεστῶτα
  english_pob_choice: being completely incapacitated
  chosen_korean: 완전히 무력해진 채
  alternatives_korean:
  - 온전히 쓰러진 채
  - 완전히 제압된 채
  - 전적으로 무기력한 상태로
  lexicon: LSJ
  rationale: 이 구절은 관용적이고 난해하므로, 결과 상태를 드러내는 ‘무력해진 채’로 옮겨 그가 완전히 꺾인 상태였음을 간결하게 살렸습니다.
- source_word: τὴν δυναστείαν ἐπεγνωκότα
  english_pob_choice: having plainly recognized the sovereign power
  chosen_korean: 그 능력을 분명히 깨달은 사람이 되었습니다
  alternatives_korean:
  - 그 주권적 권능을 분명히 알아차린 채였습니다
  - 그 지배적 권세를 분명히 인식한 채 있었습니다
  - 그 능력을 분명히 인정한 채였습니다
  lexicon: LSJ
  rationale: δυναστεία는 단순한 ‘힘’보다 지배적이고 주권적인 권능을 가리키므로, 문맥상 드러나는 하나님의 압도적 힘을 너무 좁히지 않으면서 ‘그 능력’으로 자연스럽게 옮겼습니다. ἐπεγνωκότα는 사건을 통해 분명히 알아차린 인식의 완료를 나타내므로 ‘분명히 깨달은’으로 표현했습니다.
theological_decisions:
- issue: δυναστεία의 신적 지시를 한국어에서 얼마나 명시할지
  chosen_reading: 본문의 추상명사성을 유지하면서, 문맥이 드러내는 신적 권능을 ‘그 능력’으로 완곡하게 반영했습니다.
  alternative_readings:
  - ‘하나님의 권능’으로 명시하기
  - ‘주님의 주권적 권세’로 해석하기
  rationale: 이 절 자체는 하나님을 직접 언급하지 않으므로, 본문 수준에서는 추상명사를 유지하는 편이 소스에 더 가깝습니다. 다만 서술 전체는 성전을 지키는 신적 개입을 가리키므로, 독자가 문맥상 그 권능을 이해할 수 있게 했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
