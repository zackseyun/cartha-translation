- source_word: τὴν δυναστείαν ἐπεγνωκότα
  english_pob_choice: having plainly recognized the sovereign power
  chosen_korean: 그 능력을 분명히 깨달은 사람이 되었습니다
  alternatives_korean:
  - 그 주권적 권능을 분명히 알아차린 채였습니다
  - 그 지배적 권세를 분명히 인식한 채 있었습니다
  - 그 능력을 분명히 인정한 채였습니다
  lexicon: LSJ
  rationale: δυναστεία는 단순한 ‘힘’보다 지배적이고 주권적인 권능을 가리키므로, 문맥상 드러나는 하나님의 압도적 힘을 너무 좁히지 않으면서 ‘그 능력’으로 자연스럽게 옮겼습니다. ἐπεγνωκότα는 사건을 통해 분명히 알아차린 인식의 완료를 나타내므로 ‘분명히 깨달은’으로 표현했습니다.
theological_decisions:
- issue: δυναστεία의 신적 지시를 한국어에서 얼마나 명시할지
  chosen_reading: 본문의 추상명사성을 유지하면서, 문맥이 드러내는 신적 권능을 ‘그 능력’으로 완곡하게 반영했습니다.
  alternative_readings:
  - ‘하나님의 권능’으로 명시하기
  - ‘주님의 주권적 권세’로 해석하기
  rationale: 이 절 자체는 하나님을 직접 언급하지 않으므로, 본문 수준에서는 추상명사를 유지하는 편이 소스에 더 가깝습니다. 다만 서술 전체는 성전을 지키는 신적 개입을 가리키므로, 독자가 문맥상 그 권능을 이해할 수 있게 했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
