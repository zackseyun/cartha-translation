  lexicon: LSJ
  rationale: κατὰ ψυχὴν은 ‘영혼에 따른’이라는 뜻의 내면성을 강조하므로, 과도한 해석을 피하면서도 직접적인 한국어 표현인 ‘영혼의 고통’으로 옮겼습니다.
theological_decisions:
- issue: ψυχή의 번역에서 영혼/마음의 긴장
  chosen_reading: 본문의 ‘영혼’은 인격의 내면 깊이를 가리키는 표현으로 보아 ‘영혼의 고통’으로 유지했습니다.
  alternative_readings:
  - 속사람의 고통
  - 내면의 괴로움
  rationale: 문맥상 심리적·정서적 고통을 가리키지만, 원문의 ψυχή가 지닌 내면성도 보존해야 하므로 이를 평이하게 풀어쓰되 완전히 해체하지 않았습니다.
  doctrine_reference: 인간 구성에 대한 교리적 단정은 피하고, 본문이 말하는 내적 아픔을 그대로 드러냅니다.
