base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/016.yaml
  text: To see the appearance of the high priest was enough to wound the mind[b][a]; for his face and altered color made visible the agony in his soul.
  footnotes:
  - marker: a
    text: Or 'to pierce the mind' or 'to distress the mind.' The Greek uses a verb of wounding metaphorically for the effect on the observer.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the agony according to the soul,' that is, the inward anguish of his soul.
    reason: lexical_alternative
translation:
  language: ko
  text: 대제사장의 모습을 보는 것만으로도 마음에 상처를 입을 정도였습니다[a]. 그의 표정과 변한 안색은 그의 영혼의 고통[b]을 드러내고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘마음에 상처를 입히다’에 가깝습니다. 그리스어는 상처를 주는 동사를 비유적으로 사용하여, 이를 보는 사람의 정신에 미치는 충격을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘영혼에 따른 고통’이며, 곧 그의 영혼 깊은 곳의 고뇌를 뜻합니다.
    reason: lexical_alternative
