base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/016.yaml
  text: To see the appearance of the high priest was enough to wound the mind[b][a]; for his face and altered color made visible the agony in his soul.
  footnotes:
  - marker: a
    text: Or 'to pierce the mind' or 'to distress the mind.' The Greek uses a verb of wounding metaphorically for the effect on the observer.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the agony according to the soul,' that is, the inward anguish of his soul.
    reason: lexical_alternative
translation:
  language: ko
  text: 대제사장의 모습을 보는 것만으로도 마음이 찔릴 만하였습니다[a][b]. 그의 얼굴과 달라진 빛깔이 그의 영혼의 고통을 드러내고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘마음을 찌르다’에 가깝습니다. 그리스어는 상처를 주는 동사를 비유적으로 사용하여, 이를 보는 사람에게 미치는 충격을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘영혼에 따른 고통’이며, 곧 그의 영혼의 깊은 고뇌를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ ὁρῶντα
  english_pob_choice: To see
  chosen_korean: 보는 것만으로도
  alternatives_korean:
  - 보는 사람에게는
  - 누가 보기만 해도
  lexicon: LSJ
  rationale: 그리스어의 일반적·비인칭적 효과를 살려, 단순한 시각 행위가 곧바로 내적 충격을 준다는 뜻을 자연스러운 한국어로 옮겼습니다.
- source_word: ἰδέαν τοῦ ἀρχιερέως
  english_pob_choice: the appearance of the high priest
  chosen_korean: 대제사장의 모습
  alternatives_korean:
  - 대제사장의 외양
  - 대제사장의 인상
  lexicon: LSJ
  rationale: ἰδέαν은 여기서 눈에 보이는 모습을 가리키므로, 직역에 가깝되 문맥상 자연한 ‘모습’으로 옮겼습니다.
- source_word: τιτρώσκεσθαι τὴν διάνοιαν
  english_pob_choice: to wound the mind
  chosen_korean: 마음이 찔릴
  alternatives_korean:
  - 마음이 상할
  - 생각이 찔릴
  lexicon: LSJ
  rationale: τιτρώσκω의 ‘상처 입히다’라는 비유를 살리면서, διάνοια를 한국어의 ‘마음’으로 옮겨 내적 충격을 표현했습니다.
- source_word: τὴν κατὰ ψυχὴν ἀγωνίαν
  english_pob_choice: the agony in his soul
  chosen_korean: 영혼의 고통
  alternatives_korean:
  - 영혼의 괴로움
  - 속사람의 고통
  lexicon: LSJ
  rationale: κατὰ ψυχὴν은 ‘영혼에 따른’이라는 뜻의 내면성을 강조하므로, 과도한 해석을 피하면서도 직접적인 한국어 표현인 ‘영혼의 고통’으로 옮겼습니다.
theological_decisions:
- issue: ψυχή의 번역에서 영혼/마음의 긴장
  chosen_reading: 본문의 ‘영혼’은 인격의 내면 깊이를 가리키는 표현으로 보아 ‘영혼의 고통’으로 유지했습니다.
  alternative_readings:
  - 속사람의 고통
  - 내면의 괴로움
  rationale: 문맥상 심리적·정서적 고통을 가리키지만, 원문의 ψυχή가 지닌 내면성도 보존해야 하므로 이를 평이하게 풀어쓰되 완전히 해체하지 않았습니다.
  doctrine_reference: 인간 구성에 대한 교리적 단정은 피하고, 본문이 말하는 내적 아픔을 그대로 드러냅니다.
