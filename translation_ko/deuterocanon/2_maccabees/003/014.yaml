  text: After setting a day[a], he went in to arrange the examination concerning these matters; and there was no small anxiety throughout the whole city.
  footnotes:
  - marker: a
    text: Greek literally, 'there was not small anxiety,' a litotes meaning considerable public distress.
    reason: lexical_alternative
translation:
  language: ko
  text: 하루를 정한 뒤, 그는 이 일들에 관한 조사를 처리하려고 들어갔습니다. 그러자 온 도시가 적지 않게 동요했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταξάμενος
  english_pob_choice: After setting
  chosen_korean: 하루를 정한 뒤
  alternatives_korean:
  - 날을 정한 뒤
  - 하루를 지정한 뒤
  lexicon: LSJ
  rationale: aorist middle participle τάσσω의 시간 확정 의미를 자연스럽게 옮겼습니다. 여기서는 특정한 시점을 정했다는 행정적 뉘앙스가 중요합니다.
- source_word: εἰσῄει
  english_pob_choice: he went in
  chosen_korean: 들어갔습니다
  alternatives_korean:
  - 들어갔습니다
  - 들어갔던 것입니다
  lexicon: LSJ
  rationale: 서술문 흐름에서 미완료과거의 진행성을 과도하게 드러내기보다, 단순한 이동 동작을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: τὴν περὶ τούτων ἐπίσκεψιν
  english_pob_choice: the inspection concerning these matters
  chosen_korean: 이 일들에 관한 조사
  alternatives_korean:
  - 이 일들에 관한 검사
  - 이 일들에 관한 심문
  lexicon: LSJ
  rationale: ἐπίσκεψις는 여기서 공식적 조사·검토의 뜻이므로, 행정적 맥락을 살리면서도 한국어에서 무리 없는 ‘조사’로 옮겼습니다. περὶ τούτων의 관계도 분명히 드러냈습니다.
- source_word: οἰκονομήσων
  english_pob_choice: to arrange
  chosen_korean: 처리하려고
  alternatives_korean:
  - 정리하려고
  - 운영하려고
  - 주관하려고
  lexicon: LSJ
  rationale: 미래분사가 목적을 나타내므로 ‘~하려고’로 풀었습니다. ‘처리하다’는 여기서 조사를 실제로 진행·운용하는 행정적 목적을 비교적 자연스럽게 전달합니다.
- source_word: οὐ μικρὰ ... ἀγωνία
  english_pob_choice: no small anxiety
  chosen_korean: 적지 않게 동요했습니다
  alternatives_korean:
  - 적지 않은 불안이 있었습니다
  - 큰 동요가 있었습니다
  - 적지 않은 걱정이 퍼졌습니다
  lexicon: LSJ
  rationale: οὐ μικρά의 litotes를 한국어에서 그대로 살리기보다, 결과 상태를 드러내는 표현으로 옮겼습니다. ἀγωνία는 단순한 걱정보다 공동체적 긴장·동요를 포함하므로 ‘동요’가 문맥상 적절합니다.
