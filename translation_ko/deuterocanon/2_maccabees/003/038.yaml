base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/038.yaml
  text: If you have any enemy or one plotting against your affairs[a], send him there[b], and you will receive him back flogged—if indeed he even survives—because there truly is some power of God about the place.
  footnotes:
  - marker: a
    text: Or, 'one scheming against your interests' for 'one plotting against your affairs.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'if indeed he even survives.' The line underscores the danger of encountering the divine power associated with that place.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신에게 원수나 당신의 일들을 해치려는 자가 있으면[a] 그를 그곳으로 보내십시오. 그러면 그가 살아서만 돌아온다면[b], 당신은 그를 채찍질당한 채로 맞이하게 될 것입니다. 그곳 주변에는 참으로 하나님의 어떤 능력이 있기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 이익을 꾸미는 자’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘그가 살아서만, 곧 살아남아서 돌아온다면’입니다. 이 말은 그곳과 관련된 위험을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολέμιον
  english_pob_choice: enemy
  chosen_korean: 원수
  alternatives_korean:
  - 적
  - 원수
  lexicon: LSJ
  rationale: 개인적인 적대 관계를 가리키는 말로는 ‘원수’가 가장 자연스럽고, 공동체적·관계적 적대의 뉘앙스를 잘 살립니다.
- source_word: πραγμάτων ἐπίβουλον
  english_pob_choice: one plotting against your affairs
  chosen_korean: 당신의 일들을 해치려는 자
  alternatives_korean:
  - 당신의 일을 꾸미는 자
  - 당신의 사정에 해를 끼치려는 자
  lexicon: LSJ
  rationale: πραγμάτων은 ‘일, 사정, 일들’의 넓은 범위를 가지므로 이를 ‘일들’로 두고, ἐπίβουλον의 적대적·음모적 성격을 ‘해치려는 자’로 옮겼습니다.
- source_word: μεμαστιγωμένον
  english_pob_choice: flogged
  chosen_korean: 채찍질당한 채
  alternatives_korean:
  - 매질당한 채
  - 채찍을 맞은 채
  lexicon: LSJ
  rationale: μαστιγόω의 강한 폭력성을 살리면서도 현대 한국어에서 분명한 표현인 ‘채찍질당한 채’를 택했습니다.
- source_word: διὰ τὸ ... εἶναί τινα θεοῦ δύναμιν
  english_pob_choice: because there truly is some power of God
  chosen_korean: 참으로 하나님의 어떤 능력이 있기 때문입니다
  alternatives_korean:
  - 참으로 하나님의 능력이 있기 때문입니다
  - 실로 하나님의 어떤 능력이 있기 때문입니다
  lexicon: LSJ
  rationale: τινα의 부정관사적·완곡한 성격을 살리기 위해 ‘어떤 능력’으로 옮기고, δύναμιν은 문맥상 ‘능력’이 가장 직접적입니다.
- source_word: περὶ τὸν τόπον
  english_pob_choice: about the place
  chosen_korean: 그곳 주변에는
  alternatives_korean:
  - 그곳에 대해
  - 그곳에
  lexicon: LSJ
  rationale: 주격이 아닌 장소 주변을 가리키는 περί+대격의 공간적 느낌을 한국어로 자연스럽게 풀어 ‘그곳 주변에는’으로 옮겼습니다.
theological_decisions:
- issue: ἀληθῶς와 τινα가 함께 만드는 ‘실재하지만 규정되지 않은’ 신적 능력의 표현
  chosen_reading: 참으로 하나님의 어떤 능력
  alternative_readings:
  - 하나님의 능력
  - 어떤 신적 능력
  rationale: 본문은 그 장소에 연관된 신적 능력의 실재를 말하지만, 그것을 더 좁게 규정하지는 않으므로 ‘어떤 능력’과 ‘참으로’로 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
