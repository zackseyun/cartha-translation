base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/005.yaml
  text: And since he was unable to overcome Onias[a], he went to Apollonius son of Thrasaeus[b], who at that time was governor of Coele-Syria and Phoenicia.
  footnotes:
  - marker: a
    text: Or 'Apollonius Thrasaeas'; the Greek genitive may be read as a patronymic, here rendered 'son of Thrasaeas.'
    reason: lexical_alternative
  - marker: b
    text: The Greek title στρατηγός can mean 'general' or 'governor'; here it is rendered 'governor' because the context emphasizes regional administration over Coele-Syria and Phoenicia.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 오니아스를 이길 수 없었으므로, 그는 그때 코일레 시리아와 페니키아의 총독이던 프라사이오스의 아들 아폴로니오스에게 갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘프라사이오스 아폴로니오스’로도 읽을 수 있습니다. 그리스어 속격은 부친명일 수도 있고 별칭 결합일 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 στρατηγός는 ‘장군’이나 ‘총독’이 될 수 있으나, 여기서는 코일레 시리아와 페니키아의 지역 행정이라는 문맥을 따라 ‘총독’으로 옮겼습니다.
    reason: lexical_alternative
