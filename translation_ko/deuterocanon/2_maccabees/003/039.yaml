base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/039.yaml
  text: For he himself[a], who has his dwelling in heaven, is the overseer and helper of that place[b], and he strikes and destroys those who come to do harm.
  footnotes:
  - marker: a
    text: Or 'who dwells in heaven.' The Greek literally says 'who has the heavenly dwelling.'
    reason: lexical_alternative
  - marker: b
    text: That is, the temple; the Greek reads more literally 'that place.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분 자신은 하늘에 거처를 두고 계시며, 그곳의 감시자이자 도우미이시고, 해를 끼치려 오는 자들을 치시고 멸하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘하늘의 거처를 가진’입니다.
    reason: lexical_alternative
  - marker: b
    text: 문맥상 그 ‘곳’은 성전을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν κατοικίαν ἐπουράνιον ἔχων
  english_pob_choice: who has his heavenly dwelling
  chosen_korean: 하늘에 거처를 두고 계시며
  alternatives_korean:
  - 하늘에 거하시는
  - 하늘의 거처를 가지신
  - 하늘에 계신
  lexicon: LSJ
  rationale: ‘ἔχων’의 소유/지님을 살리되 한국어로는 ‘거처를 두다’가 가장 자연스럽고, ‘하늘에 계신’보다 원문의 ‘heavenly dwelling’ 뉘앙스를 더 드러냅니다.
- source_word: ἐπόπτης
  english_pob_choice: overseer
  chosen_korean: 감시자이자
  alternatives_korean:
  - 감독이자
  - 지키는 이이자
  - 살피는 이이자
  lexicon: LSJ
  rationale: 문맥상 단순한 시선이 아니라 보호와 감독의 기능이므로 ‘감시자’로 옮기되, 뒤의 βοηθός와 구별되도록 ‘도우미’와 병렬로 두었습니다.
- source_word: βοηθός
  english_pob_choice: helper
  chosen_korean: 도우미이시고
  alternatives_korean:
  - 도우미이시며
  - 돕는 이이시고
  - 조력자이시고
  lexicon: LSJ
  rationale: 기본 의미인 ‘도와주는 이’를 직역성 있게 살렸고, 뒤의 폭력적 심판 동사와 대비되도록 과도한 해석어는 피했습니다.
- source_word: τοὺς παραγινομένους ἐπὶ κακώσει
  english_pob_choice: those who come to do harm
  chosen_korean: 해를 끼치려 오는 자들
  alternatives_korean:
  - 해치러 오는 자들
  - 악을 행하려 오는 자들
  - 상해를 주려 오는 자들
  lexicon: LSJ
  rationale: ἐπὶ κακώσει의 목적성을 한국어 부정적 목적 표현으로 자연스럽게 옮겨, ‘harm’의 일반적 의미를 유지했습니다.
- source_word: τύπτων ἀπόλλυσι
  english_pob_choice: he strikes down and destroys
  chosen_korean: 치시고 멸하십니다
  alternatives_korean:
  - 때리시고 멸하십니다
  - 치셔서 멸하십니다
  - 치고 파멸시키십니다
  lexicon: LSJ
  rationale: τύπτων의 현재 분사와 ἀπόλλυσι의 파괴적 종결을 압축적으로 살리되, 한국어 문장 흐름상 ‘치시고 멸하십니다’가 가장 응축적입니다.
theological_decisions:
- issue: 주어 αὐτός의 지시 대상
  chosen_reading: 주어는 하늘에 거처하시는 하나님을 가리키는 것으로 옮겼습니다.
  alternative_readings:
  - 막연한 하늘의 능력
  - 성전과 연결된 보호 기능 자체
  rationale: 문맥상 성전을 지키는 분으로 하나님이 암시되므로, ‘그분 자신’으로 남겨 강조를 살리면서도 신원은 자연스럽게 드러나게 했습니다.
  doctrine_reference: 문맥적 신원 해석
- issue: ἐπόπτης의 한국어 어조
  chosen_reading: ‘감시자’는 부정적 감시가 아니라 보호적 감독의 기능으로 사용했습니다.
  alternative_readings:
  - 감독
  - 수호자
  rationale: 원문의 병렬 구조에서 ἐπόπτης와 βοηθός를 구분해야 하므로, 보호적 감독을 드러내면서도 βοηθός와 중복되지 않게 했습니다.
  doctrine_reference: 어휘적 구별 보존
