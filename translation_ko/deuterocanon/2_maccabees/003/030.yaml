base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/030.yaml
  text: And they were blessing the Lord[a], who was glorifying his own place; and the temple, which a little earlier had been full of fear and turmoil, was filled with joy and gladness when the Almighty Lord appeared.
  footnotes:
  - marker: a
    text: Or 'manifested himself' for 'appeared.' The Greek uses a term associated with divine appearing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 주님을 찬송하였는데, 그분이 자기의 장소를 영화롭게 하셨기 때문입니다. 조금 전에는 두려움과 혼란으로 가득 차 있던 성전이, 전능하신 주님이 나타나셨을 때 기쁨과 즐거움으로 가득 찼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문에는 ‘나타나셨다’에 해당하는 ἐπιφαίνω 계열 동사가 쓰여, 단순한 존재 표명보다 신적 현현의 뉘앙스가 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλόγουν
  english_pob_choice: were blessing
  chosen_korean: 찬송하였는데
  alternatives_korean:
  - 복을 빌고 있었는데
  - 축복하고 있었는데
  - 찬양하고 있었는데
  lexicon: BDAG
  rationale: ὁ κύριον에 대한 응답 행위로서 ‘복을 빌다’보다 하나님께 드리는 경배적 행위를 드러내는 ‘찬송하다’가 자연스럽고, 영어 POB의 지속적 뉘앙스도 과거진행형의 보조절로 완화해 반영했습니다.
- source_word: παραδοξάζοντα τὸν ἑαυτοῦ τόπον
  english_pob_choice: was glorifying his own place
  chosen_korean: 자기의 장소를 영화롭게 하셨기 때문입니다
  alternatives_korean:
  - 자기 성소를 영화롭게 하셨기 때문입니다
  - 자기의 거처를 영화롭게 하셨기 때문입니다
  - 자기의 곳을 영화롭게 하셨기 때문입니다
  lexicon: LSJ
  rationale: τόπος의 기본값인 ‘장소’를 살리되, 문맥상 성전을 가리키는 표현임을 뒤 문장 ‘성전’이 분명히 하므로 과도한 설명을 덧붙이지 않았습니다.
- source_word: δέους καὶ ταραχῆς γέμον
  english_pob_choice: had been full of fear and turmoil
  chosen_korean: 두려움과 혼란으로 가득 차 있던
  alternatives_korean:
  - 두려움과 소동으로 가득 차 있던
  - 두려움과 동요로 가득 차 있던
  - 경외와 혼란으로 가득 차 있던
  lexicon: BDAG
  rationale: δέος는 ‘두려움/경외’ 중 여기서는 위협 앞의 두려움이 더 직접적이고, ταραχή는 성전의 불안정한 상태를 가리키므로 ‘혼란’이 가장 읽기 쉽고 충실합니다.
- source_word: τοῦ παντοκράτορος ἐπιφανέντος κυρίου
  english_pob_choice: when the Almighty Lord appeared
  chosen_korean: 전능하신 주님이 나타나셨을 때
  alternatives_korean:
  - 전능하신 주님이 드러나셨을 때
  - 전능하신 주님이 현현하셨을 때
  - 전능하신 주님이 보이셨을 때
  lexicon: BDAG
  rationale: παντοκράτωρ는 관용적으로 ‘전능하신’이 가장 적절하고, ἐπιφαίνω 계열의 epiphany 뉘앙스는 ‘나타나시다’가 신학적 격식과 가독성을 함께 살립니다.
- source_word: χαρᾶς καὶ εὐφροσύνης ἐπληροῦτο
  english_pob_choice: was filled with joy and gladness
  chosen_korean: 기쁨과 즐거움으로 가득 찼습니다
  alternatives_korean:
  - 기쁨과 환희로 가득 찼습니다
  - 기쁨과 환희로 채워졌습니다
  - 기쁨과 즐거움으로 채워졌습니다
  lexicon: BDAG
  rationale: χαρά와 εὐφροσύνης의 병렬을 가장 자연스럽게 살리면서도 중복 없이 읽히는 한국어로 ‘기쁨과 즐거움’을 택했습니다.
theological_decisions:
- issue: ‘주님’(κύριος)과 ‘전능하신 주님’의 재현
  chosen_reading: 본문의 κύριος는 하나님을 가리키는 제목으로 ‘주님’으로 옮기고, τοῦ παντοκράτορος ... κυρίου는 그 호칭을 강화한 ‘전능하신 주님’으로 처리했습니다.
  alternative_readings:
  - 주
  - 주인
  - 전능하신 주
  rationale: 2마카비서는 직접적인 신적 개입을 서술하므로, 통상적 교회어인 ‘주님’을 사용하되 παντοκράτωρ의 강조를 보존해야 합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: ἐπιφανέντος의 신현(神現) 뉘앙스
  chosen_reading: ‘나타나셨을 때’로 옮겨 실제적인 신현 사건을 분명히 하되, 기술적인 신학용어로 과도하게 격식화하지 않았습니다.
  alternative_readings:
  - 현현하셨을 때
  - 드러나셨을 때
  - 보이셨을 때
  rationale: 본문은 성전의 상태 변화가 주님의 현현과 직접 연결된다고 말하므로, 사건성을 약화하지 않는 직역-자연화 균형이 필요합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
