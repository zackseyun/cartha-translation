    text: 그리스어 속격은 더 문자적으로 ‘과부들과 고아들의 예치금’으로도 옮길 수 있지만, 뜻은 이 돈이 그들에게 속해 있었다는 점입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ δὲ ἀρχιερέως
  english_pob_choice: But when the high priest
  chosen_korean: 그런데 대제사장이
  alternatives_korean:
  - 그리고 대제사장이
  - 그때 대제사장이
  lexicon: LSJ
  rationale: δέ의 장면 전환과 약한 대조를 살리기 위해 ‘그런데’로 옮기고, genitive absolute는 한국어에서 자연스러운 시간 부사구로 처리했습니다.
- source_word: ὑποδείξαντος
  english_pob_choice: pointed out
  chosen_korean: 밝히자
  alternatives_korean:
  - 지적하자
  - 보여 주자
  - 설명하자
  lexicon: LSJ
  rationale: 단순히 시각적으로 ‘보이다’가 아니라, 해당 금전의 성격을 공식적으로 분명히 드러내는 뜻이므로 ‘밝히자’가 가장 자연스럽고 정확합니다.
- source_word: παρακαταθήκας
  english_pob_choice: deposits
  chosen_korean: 예치금
  alternatives_korean:
  - 맡긴 돈
  - 예탁금
  - 보관된 금전
  lexicon: LSJ
  rationale: 보관을 위해 맡겨 둔 금전이라는 의미를 살리되, 현대 한국어에서 의미가 분명한 ‘예치금’을 사용했습니다. 법률적 현대화는 과도하지 않게 유지했습니다.
- source_word: χρηῶν τε καὶ ὀρφανῶν
  english_pob_choice: belonging to widows and orphans
  chosen_korean: 과부들과 고아들에게 속한
  alternatives_korean:
  - 과부들과 고아들의
  - 과부들과 고아들을 위한
  - 과부들과 고아의
  lexicon: LSJ
  rationale: 그리스어 속격은 소유 관계가 가장 자연스러우므로, POB의 영어 판단을 따라 ‘속한’으로 소유성을 분명히 했습니다.
theological_decisions:
- issue: 과부와 고아의 재산을 어떻게 이해할지
  chosen_reading: 본문은 이 돈이 단지 그들을 위한 기금이 아니라 그들에게 속한 예치금이라고 말합니다.
  alternative_readings:
  - 과부와 고아를 위한 기금으로 이해할 수 있습니다.
  - 단순히 그들을 돕기 위해 맡겨 둔 돈으로 읽을 수 있습니다.
  rationale: 영어 POB의 주석처럼 그리스어 속격은 ‘그들을 위한’보다 ‘그들의 것’이라는 소유 관계를 더 강하게 드러냅니다. 그래서 본문은 그 긴장을 약화시키지 않도록 소유 의미를 살렸습니다.
  doctrine_reference: Stewardship and protection of vulnerable persons' property
