lexical_decisions:
- source_word: ἐπερωτήσαντος
  english_pob_choice: asked
  chosen_korean: 물었을 때
  alternatives_korean:
  - 질문했을 때
  - 물으셨을 때
  lexicon: LSJ
  rationale: 분사구문으로 이어지는 상황 설명이므로, 한국어에서는 자연스럽게 ‘물었을 때’로 옮겨 왕의 질문 행위를 부드럽게 연결했습니다.
- source_word: ποῖός τις εἴη ἐπιτήδειος
  english_pob_choice: who might be fit
  chosen_korean: 어떤 사람이 적합한지
  alternatives_korean:
  - 누가 적합한지
  - 어떤 종류의 사람이 알맞은지
  lexicon: LSJ
  rationale: 질문은 단순한 신원 확인이 아니라 ‘적합한 사람’의 성격을 묻는 것이므로, 한국어에서도 자격·적합성의 뉘앙스를 살렸습니다.
- source_word: ἔτι ἅπαξ
  english_pob_choice: once more
  chosen_korean: 또다시
  alternatives_korean:
  - 한 번 더
  - 다시 한 번
  lexicon: LSJ
  rationale: 반복성과 ‘한 차례 더’라는 점을 함께 살리기 위해 ‘또다시’를 택했습니다.
- source_word: διαπεμφθῆναι εἰς Ἱεροσόλυμα
  english_pob_choice: to be sent to Jerusalem
  chosen_korean: 예루살렘에 보내기에
  alternatives_korean:
  - 예루살렘으로 파견하기에
  - 예루살렘으로 보내기에
  lexicon: LSJ
  rationale: 수동 부정사와 목적지를 한국어 목적형으로 옮겨, ‘누가 보내기에 적합한가’라는 문맥이 자연스럽게 드러나도록 했습니다.
