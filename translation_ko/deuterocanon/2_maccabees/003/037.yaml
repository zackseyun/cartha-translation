  text: 왕이 또다시 예루살렘에 보내기에 적합한 사람이 누구인지 헬리오도로스에게 물었을 때, 그가 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 표현은 문자적으로는 ‘예루살렘에 또 한 번 보내기에 적합한 사람이 누구인지’라는 뜻입니다. 영어 번역의 ‘once more’는 ἔτι ἅπαξ의 관용적 의미를 풀어 옮긴 것입니다.
    reason: lexical_alternative
