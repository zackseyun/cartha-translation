  text: When the king asked Heliodorus who might be fit to be sent once more to Jerusalem[a], he said,
  footnotes:
  - marker: a
    text: Greek literally, 'who might be suitable still once to be sent to Jerusalem.' The rendering 'once more' expresses ἔτι ἅπαξ idiomatically.
