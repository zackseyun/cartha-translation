translation:
  language: ko
  text: 왕이 헬리오도로스에게 예루살렘에 다시 한 번 파견될 만한 사람이 누구인지 물었을 때, 헬리오도로스가 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ἔτι ἅπαξ는 ‘다시 한 번’이라는 뜻입니다.
