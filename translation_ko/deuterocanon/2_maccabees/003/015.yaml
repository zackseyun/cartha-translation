  text: But the priests[a], having thrown themselves down before the altar in their priestly robes, were calling out to heaven to the one who had given the law concerning deposits[b], that he should keep these things safe for those who had deposited them.
  footnotes:
  - marker: a
    text: Or 'were calling upon heaven'—a reverential way of referring to God.
    reason: lexical_alternative
  - marker: b
    text: That is, property entrusted for safekeeping in the temple.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 제사장들은 제단 앞에서 제사장 예복을 입고 몸을 던져 엎드린 채, 하늘을 향해[a] 맡겨 둔 재산[b]에 관한 율법을 세우신 분께서 그것들을 맡긴 이들을 위하여 그것들을 온전히 지켜 주시기를 부르짖고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘하늘’은 하나님을 직접 가리키는 경외적 우회표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 즉, 성전에 안전하게 맡겨 둔 재산을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: ῥίψαντες ἑαυτούς
  english_pob_choice: having thrown themselves down
  chosen_korean: 몸을 던져 엎드린 채
  alternatives_korean:
  - 엎드렸고
  - 스스로 몸을 던졌고
  - 몸을 내던지고 엎드린 채
  lexicon: LSJ
  rationale: ῥίπτω의 물리적이고 급한 동작을 살리면서, 한국어로는 자연스럽게 ‘몸을 던져 엎드리다’로 옮겼습니다.
- source_word: ἐπεκαλοῦντο εἰς οὐρανόν
  english_pob_choice: were calling out to heaven
  chosen_korean: 하늘에 외치며
  alternatives_korean:
  - 하늘을 향해 부르며
  - 하늘에 부르짖으며
  - 하늘을 향해 간청하며
  lexicon: LSJ
  rationale: 그리스어의 우회적 경외 표현을 따라 ‘하늘’을 살리고, 진행 중인 간구의 뉘앙스를 ‘외치며’로 나타냈습니다.
- source_word: τὸν περὶ παρακαταθήκης νομοθετήσαντα
  english_pob_choice: the one who had given the law concerning deposits
  chosen_korean: 그 담보물에 관한 율법을 주신 이
  alternatives_korean:
  - 맡겨진 물건에 관한 율법을 주신 이
  - 보관물에 관한 율법을 제정하신 이
  - 예치물에 관한 법을 세우신 이
  lexicon: LSJ
  rationale: παρακαταθήκη는 성전 등에 맡겨 보관한 재산의 법적 의미를 가지므로, 한국어에서는 이해 가능성과 법적 뉘앙스를 함께 살리기 위해 ‘담보물’로 옮겼습니다.
- source_word: ταῦτα σῶα διαφυλάξαι
  english_pob_choice: that he should keep these things safe
  chosen_korean: 이 일들을 안전하게 보존해 달라고
  alternatives_korean:
  - 이것들을 온전히 지켜 달라고
  - 이것들을 해치지 않게 지켜 달라고
  - 이것들을 안전히 보존해 달라고
  lexicon: LSJ
  rationale: σῶα διαφυλάξαι의 보전·무사함의 뜻을 자연스러운 한국어로 풀어 ‘안전하게 보존하다’로 처리했습니다.
- source_word: ἐν ταῖς ἱερατικαῖς στολαῖς
  english_pob_choice: in their priestly robes
  chosen_korean: 제사장들의 옷을 입고
  alternatives_korean:
  - 제사장 복장을 하고
  - 제사장들의 예복을 입고
  - 사제복을 입고
  lexicon: LSJ
  rationale: 의례적 복장을 나타내되 현대 한국어에서 이해하기 쉬운 표현을 택했습니다.
theological_decisions:
- issue: 하늘에 대한 경외적 우회표현
  chosen_reading: ‘하늘에 외치며’로 유지해, 곧바로 ‘하나님께’로 바꾸지 않았습니다.
  alternative_readings:
  - 하나님께 외치며
  - 주님께 간청하며
  - 하늘을 향해 부르짖으며
  rationale: 본문은 εἰς οὐρανόν을 직접 말하므로, 경외적 우회표현을 유지하는 편이 원문의 수사와 의미를 더 정확히 드러냅니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3, 6
