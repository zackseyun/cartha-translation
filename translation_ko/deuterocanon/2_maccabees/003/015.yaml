  source_fidelity: 수정이 필요합니다. παρακαταθήκη는 맡겨 보관하는 재산·보관물이지 채무 이행을 위한 ‘담보물’이 아닙니다. 또한 ταῦτα는 보관을 맡긴 물건들을 가리키므로 ‘이 일들’보다 ‘그것들’로 옮겨야 합니다. ‘하늘’이라는 경외적 우회표현과 지속적 간구의 의미는 유지할 수 있습니다.
  naturalness: ‘제사장들의 옷’은 문맥상 그들이 입은 의례복이라는 뜻이 불분명하게 들릴 수 있으므로 ‘제사장 예복’이 자연스럽습니다. 수정문은 긴 그리스어 수식 구조를 유지하면서도 현대 표준 한국어 합쇼체로 자연스럽게 읽힙니다.
  terminology: ‘담보물’을 ‘맡겨 둔 재산’으로 바로잡았습니다. ‘율법을 세우신 분’은 νομοθετήσαντα의 입법적 의미를 반영하며, ‘온전히 지켜 주시기를’은 σῶα διαφυλάξαι의 무사하고 완전한 보존을 나타냅니다.
