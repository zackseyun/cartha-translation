    text: 그리스어 여성 복수형은 앞선 문맥의 여인들을 가리킬 가능성이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 λιτανεία는 후대 교회적 의미의 ‘리타니’가 아니라 간절한 청원, 곧 간구를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσαι
  english_pob_choice: all of them
  chosen_korean: 모두가
  alternatives_korean:
  - 모든 이가
  - 모든 여인이
  lexicon: LSJ
  rationale: 여성 복수형은 앞선 문맥의 여인들을 가리킬 가능성이 있지만, 한국어 본문에서는 문맥에 기대어 자연스럽게 ‘모두가’로 옮기면 범위를 유지하면서도 불필요한 성별 명시를 피할 수 있습니다.
- source_word: προτείνουσαι τὰς χεῖρας
  english_pob_choice: stretching out their hands
  chosen_korean: 두 손을 내밀고
  alternatives_korean:
  - 손을 펴고
  - 두 손을 뻗고
  lexicon: LSJ
  rationale: 기도 중 손을 들어 내미는 몸짓을 한국어로는 ‘두 손을 내밀고’가 가장 자연스럽고, 동작의 전면성과 방향성을 잘 드러냅니다.
- source_word: εἰς τὸν οὐρανόν
  english_pob_choice: toward heaven
  chosen_korean: 하늘을 향해
  alternatives_korean:
  - 하늘을 향하여
  - 하늘로
  lexicon: LSJ
  rationale: 문맥상 기도의 방향을 나타내므로 ‘하늘을 향해’가 적절합니다. 한국어에서는 ‘하늘’이 ‘하늘 나라’의 신학적 용례가 아니라 물리적 상향 방향을 부드럽게 살립니다.
- source_word: τὴν λιτανείαν
  english_pob_choice: supplication
  chosen_korean: 간청하고 있었습니다
  alternatives_korean:
  - 간구하고 있었습니다
  - 간절히 청하고 있었습니다
  - 기도하고 있었습니다
  lexicon: LSJ
  rationale: λιτανεία는 후대 교회 용어의 ‘연도/리타니’가 아니라 간절한 청원이라는 뜻이므로, 형식어를 피하고 현재 진행감을 살린 ‘간청하고 있었습니다’로 옮겼습니다.
theological_decisions:
- issue: οὐρανός의 의미
  chosen_reading: 물리적 ‘하늘’이 아니라 기도가 향하는 상향적·신적 지향의 대상
  alternative_readings:
  - 하늘
  - 천공
  rationale: 기도 장면에서 손을 드는 방향은 단순한 공간 표현을 넘어 하나님께 향한 청원의 자세를 보여 줍니다. 그래서 본문은 과도한 해석 없이 ‘하늘’을 유지하되, 문맥이 기도 행위임을 살렸습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; readable modern Korean'
