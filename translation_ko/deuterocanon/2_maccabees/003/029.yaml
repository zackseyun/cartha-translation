lexical_decisions:
- source_word: θείαν ἐνέργειαν
  english_pob_choice: the divine power
  chosen_korean: 그 신적 능력
  alternatives_korean:
  - 하나님의 능력
  - 그 신적 작용
  - 그 신적 활동
  lexicon: BDAG
  rationale: ἐνέργεια는 단순한 힘보다 실제로 작동하는 효력이나 작용을 가리키므로, 서사 맥락에서 ‘신적 능력’이 자연스럽고 원문의 능동성을 잘 드러냅니다.
- source_word: ἄφωνος
  english_pob_choice: speechless
  chosen_korean: 말을 하지 못한 채
  alternatives_korean:
  - 말문이 막힌 채
  - 무언인 채
  - 말할 수 없는 채
  lexicon: LSJ
  rationale: ἄφωνος는 ‘소리가 없는, 말을 못 하는’ 뜻이므로, 현대 한국어에서 즉각적인 상태를 가장 분명히 드러내는 표현으로 옮겼습니다.
- source_word: πάσης ἐστερημένος ἐλπίδος καὶ σωτηρίας
  english_pob_choice: deprived of all hope and rescue
  chosen_korean: 모든 희망과 구출을 빼앗긴 채
  alternatives_korean:
  - 모든 희망과 구원을 빼앗긴 채
  - 온갖 희망과 구출을 잃은 채
  - 모든 희망과 구조를 박탈당한 채
  lexicon: BDAG
  rationale: ἐστερημένος는 ‘빼앗기다, 결핍되다’의 뜻이므로 수동적 상실을 살렸고, σωτηρία는 여기서 즉각적 위기 상황의 ‘구출/구조’ 의미가 더 분명하므로 ‘구출’로 옮겼습니다.
- source_word: ἔρριπτο
  english_pob_choice: was laid out
  chosen_korean: 쓰러져 있었습니다
  alternatives_korean:
  - 내던져져 있었습니다
  - 드러누워 있었습니다
  - 엎드러져 있었습니다
  lexicon: LSJ
  rationale: 미완료 시상은 그가 이미 쓰러진 상태로 놓여 있음을 나타내므로, 결과 상태를 자연스럽게 드러내는 ‘쓰러져 있었습니다’가 적절합니다.
theological_decisions:
- issue: σωτηρία의 번역에서 구원/구출의 긴장 유지
  chosen_reading: 여기서는 물리적 위기 맥락에 맞춰 ‘구출’로 번역하되, 어휘상 ‘구원’의 가능성은 열어 둡니다.
  alternative_readings:
  - 구원
  - 구조
  - 해방
  rationale: 문맥상 헬리오도로스의 즉각적 육체 상태를 묘사하므로, 종말론적·구속사적 함의를 자동 주입하지 않는 ‘구출’이 가장 정확합니다.
  doctrine_reference: Translation philosophy §§1, 6
