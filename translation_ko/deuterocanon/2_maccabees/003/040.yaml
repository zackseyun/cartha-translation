  rationale: γaζοφυλάκιον은 성전 재정의 보관소를 가리키므로, 문맥상 자연스럽고 간결한 ‘보물고’로 옮겼고, τήρησις는 보호·지킴의 의미를 살려 ‘보안’으로 번역했습니다.
- source_word: οὕτως ἐχώρησεν
