  lexicon: LSJ
  rationale: 중성 복수와 κατά 관용구가 가리키는 ‘사건들의 개요’라는 뜻을 살려, 서술적 요약에 맞는 ‘관련된 일’로 옮겼습니다.
- source_word: τὴν τοῦ γαζοφυλακίου τήρησιν
  english_pob_choice: the safeguarding of the treasury
  chosen_korean: 보물고의 보안
  alternatives_korean:
  - 보물고의 지킴
  - 재물창고의 보호
  - 보물창고의 관리
  lexicon: LSJ
  rationale: γaζοφυλάκιον은 성전 재정의 보관소를 가리키므로, 문맥상 자연스럽고 간결한 ‘보물고’로 옮겼고, τήρησις는 보호·지킴의 의미를 살려 ‘보안’으로 번역했습니다.
- source_word: οὕτως ἐχώρησεν
  english_pob_choice: proceeded in this way
  chosen_korean: 이렇게 진행되었습니다
  alternatives_korean:
  - 이렇게 되었습니다
  - 이런 식으로 이루어졌습니다
  - 이렇게 전개되었습니다
  lexicon: LSJ
  rationale: 결론부의 진행·전개 의미를 살려, 한국어에서 사건 경과를 자연스럽게 마무리하는 표현으로 옮겼습니다.
theological_decisions:
- issue: 결론적 사건 요약의 문체
  chosen_reading: 서사 말미의 요약문으로 읽고, 해석을 덧붙이지 않고 사건의 진행 결과만 간명하게 전달했습니다.
  alternative_readings:
  - 도덕적 평가를 암시하는 표현
  - 더 강한 신학적 해석을 덧붙이는 표현
  rationale: 본문은 헬리오도로스 사건과 성전 재정 보관의 경과를 요약할 뿐이므로, 저자의 결론 어조를 보존하는 것이 가장 충실합니다.
  doctrine_reference: 문맥 보존 원칙
- issue: ‘γαζοφυλάκιον’의 문화적 처리
  chosen_reading: 성전 맥락의 재정 보관소를 가리키는 말로 보고 ‘보물고’로 옮겼습니다.
  alternative_readings:
  - 보물창고
  - 창고
  - 국고
  rationale: 본문의 유대 성전 재정 문맥을 유지하면서도 한국어 독자가 즉시 이해할 수 있는 표현을 택했습니다.
  doctrine_reference: 성전/제의 문맥 보존
