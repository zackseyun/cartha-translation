  - 이 일이 वास्तव로 그런지 물었습니다
  lexicon: LSJ
  rationale: 동사의 조사·탐문 성격을 ‘물었습니다’로 자연스럽게 살리고, 전체 관용구는 한국어에서 가장 직접적인 확인 표현으로 압축했습니다.
theological_decisions:
- issue: ἐμφανισμός의 의미 범위
  chosen_reading: 계시로 옮기되, 여기서는 공적 보고의 대상이 된 ‘드러난 사실’이라는 의미를 함께 유지했습니다.
  alternative_readings:
  - 드러남
  - 공개
  - 알려짐
  rationale: 본문은 헬리오도로스가 이미 전해진 사건을 다시 설명하는 장면이므로, 신비 체험보다 ‘밝혀진 일’의 뜻이 핵심입니다. 다만 한국어 독자에게 지나치게 설명적으로 들리지 않도록 간결한 명사로 처리했습니다.
  doctrine_reference: 번역학적/서술 문맥상 결정
