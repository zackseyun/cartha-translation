  yaml_path: translation/deuterocanon/2_maccabees/003/009.yaml
  text: And when he arrived in Jerusalem and was courteously received by the high priest of the city[a], he reported the manifestation that had taken place, explained for what reason he was present, and inquired whether these things were truly so.
  footnotes:
  - marker: a
    text: Or 'the information that had come to light'; the Greek term can denote a making-known or disclosure.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 예루살렘에 도착하여 그 도시의 대제사장에게 정중히 영접을 받은 그는 일어난 그 계시[a]에 관해 보고하고, 무슨 이유로 그가 와 있는지 설명한 뒤, 이 일들이 정말 그런지 물었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘드러남’; 그리스어 용어는 어떤 것을 드러내거나 알려 주는 행위를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενηθεὶς
  english_pob_choice: when he arrived
  chosen_korean: 도착하여
  alternatives_korean:
  - 와서
  - 도착했을 때
  lexicon: LSJ
  rationale: ἀorist participle의 도착·도달 의미를 자연스러운 서술로 옮기되, 문맥상 다음 행동으로 이어지는 시간 관계를 유지했습니다.
- source_word: φιλοφρόνως
  english_pob_choice: courteously
  chosen_korean: 정중히
  alternatives_korean:
  - 친절하게
  - 호의적으로
  - 예의 바르게
  lexicon: LSJ
  rationale: 공적 서술문에서 자연스러운 격식을 살리면서, 단순한 친절보다 예의와 존중의 뉘앙스를 담았습니다.
- source_word: ἀνέθετο περὶ τοῦ γεγονότος ἐμφανισμοῦ
  english_pob_choice: he reported the manifestation that had taken place
  chosen_korean: 일어난 그 계시에 관해 보고하고
  alternatives_korean:
  - 일어난 그 드러남에 관해 보고하고
  - 일어난 그 밝혀짐에 관해 보고하고
  - 생긴 그 공개에 관해 보고하고
  lexicon: LSJ
  rationale: ἐμφανισμός는 여기서 초자연적 현상보다 ‘드러남/알려짐’에 가까우므로, 문맥을 따라 ‘계시’로 옮기되, 이미 발생한 사건성을 ‘일어난’으로 보존했습니다.
- source_word: ἐπυνθάνετο εἰ ταῖς ἀληθείαις ταῦτα οὕτως ἔχοντα τυγχάνει
  english_pob_choice: inquired whether these things were truly so
  chosen_korean: 이 일들이 정말 그런지 물었습니다
  alternatives_korean:
  - 이 일들이 সত্য로 그런지 물었습니다
  - 이 일들이 사실로 그러한지 물었습니다
  - 이 일이 वास्तव로 그런지 물었습니다
  lexicon: LSJ
  rationale: 동사의 조사·탐문 성격을 ‘물었습니다’로 자연스럽게 살리고, 전체 관용구는 한국어에서 가장 직접적인 확인 표현으로 압축했습니다.
theological_decisions:
- issue: ἐμφανισμός의 의미 범위
  chosen_reading: 계시로 옮기되, 여기서는 공적 보고의 대상이 된 ‘드러난 사실’이라는 의미를 함께 유지했습니다.
  alternative_readings:
  - 드러남
  - 공개
  - 알려짐
  rationale: 본문은 헬리오도로스가 이미 전해진 사건을 다시 설명하는 장면이므로, 신비 체험보다 ‘밝혀진 일’의 뜻이 핵심입니다. 다만 한국어 독자에게 지나치게 설명적으로 들리지 않도록 간결한 명사로 처리했습니다.
  doctrine_reference: 번역학적/서술 문맥상 결정
