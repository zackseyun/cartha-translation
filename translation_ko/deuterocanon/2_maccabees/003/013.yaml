  text: But the other[a], because he had royal orders, kept insisting that these things were to be taken into the royal treasury.
  footnotes:
  - marker: a
    text: Or, 'into the king's treasury.' The Greek εἰς τὸ βασιλικὸν likely refers to the royal fisc or treasury in this context.
