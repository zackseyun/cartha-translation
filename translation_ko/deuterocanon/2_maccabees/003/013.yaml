translation:
  language: ko
  text: 그 다른 사람은 자신에게 왕의 명령이 있었으므로, 이 물건들을 왕실 금고로 가져가야 한다고 계속 주장했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
