translation:
  language: ko
  text: 그러나 다른 사람은 자신에게 왕의 명령이 있었으므로, 이 물건들을 왕실 금고[a]로 가져가야 한다고 계속 주장했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕의 금고로’. 그리스어 εἰς τὸ βασιλικόν은 이 문맥에서 왕실 재정 또는 금고를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δ᾽ ἕτερος
  english_pob_choice: But the other
  chosen_korean: 그 다른 사람은
  alternatives_korean:
  - 그는
  - 반면 다른 사람은
  - 다른 사람은
  lexicon: LSJ
  rationale: ἕτερος는 앞선 인물과 대비되는 ‘다른 한 사람’을 가리키므로, 대조를 살리면서도 문맥상 자연스러운 ‘그 다른 사람은’으로 옮겼습니다.
- source_word: δι᾽ ἃς εἶχεν βασιλικὰς ἐντολάς
  english_pob_choice: because he had royal orders
  chosen_korean: 자신에게 왕의 명령이 있었으므로
  alternatives_korean:
  - 왕의 지시를 받았으므로
  - 왕의 명령을 갖고 있었으므로
  - 왕의 명령이 있었기 때문에
  lexicon: LSJ
  rationale: διά + 관계대명사는 이유를 나타내므로 ‘-으므로’로 풀었고, βασιλικὰς ἐντολάς는 왕에게서 나온 명령이라는 뜻을 분명히 하기 위해 ‘왕의 명령’으로 옮겼습니다.
- source_word: πάντως ἔλεγεν
  english_pob_choice: kept insisting
  chosen_korean: 계속 주장했습니다
  alternatives_korean:
  - 끊임없이 말했습니다
  - 한결같이 주장했습니다
  - 강하게 말했습니다
  lexicon: LSJ
  rationale: imperfect ἔλεγεν의 반복성과 πάντως의 강한 강조를 함께 살려, 단순한 ‘말했다’보다 지속적 압박을 드러내는 ‘계속 주장했습니다’로 옮겼습니다.
- source_word: εἰς τὸ βασιλικὸν
  english_pob_choice: into the royal treasury
  chosen_korean: 왕실 금고로
  alternatives_korean:
  - 왕의 금고로
  - 왕실 재정으로
  - 왕실 보물창고로
  lexicon: LSJ
  rationale: 이 문맥의 βασιλικόν은 왕의 재정·금고를 가리키는 것으로 보이므로, POB의 해석을 따라 ‘왕실 금고’로 구체화했습니다.
- source_word: ἀναλημπτέα
  english_pob_choice: were to be taken
  chosen_korean: 가져가야 한다고
  alternatives_korean:
  - 옮겨야 한다고
  - 취해야 한다고
  - 회수해야 한다고
  lexicon: LSJ
  rationale: ἀναλημπτέα는 의무를 나타내는 수동적 성격의 동사형 형용사이므로, 한국어에서는 자연스럽게 의무 표현인 ‘-해야 한다’로 옮겼습니다.
- source_word: ταῦτα
  english_pob_choice: these things
  chosen_korean: 이 물건들을
  alternatives_korean:
  - 이것들을
  - 이 것들을
  - 이 재물들을
  lexicon: LSJ
  rationale: 지시대명사 복수형이 앞서 논의된 물품들을 가리키므로, 한국어에서는 문맥상 분명한 ‘이 물건들’을 택했습니다.
