theological_decisions:
- issue: 성전 금고의 성격과 제물 회계의 관계
  chosen_reading: 이 돈들은 제물 회계에 속하지 않는 별도의 예탁금으로 제시되며, 곧바로 ‘세속적 사유재산’이라고 단정하지는 않았습니다.
  alternative_readings:
  - 완전히 비성소적 사유 재산이라는 해석
  - 제사에 사용될 수 있어 사실상 압류 정당화가 암시된다는 해석
  rationale: 본문은 제사 회계와의 비연관성을 말할 뿐, 그 자체의 성격을 더 강하게 규정하지는 않으므로 그 긴장을 유지했습니다.
  doctrine_reference: 본문이 말하는 범위를 넘어서 소유권·거룩성 문제를 과도하게 단정하지 않음
