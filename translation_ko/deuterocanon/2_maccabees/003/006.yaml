base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/006.yaml
  text: And he reported that the treasury in Jerusalem was full of immense sums of money[a], so that the quantity of the separate funds was beyond counting, and that they were not connected with the account of the sacrifices[c][b], but that it was possible for these things to fall under the king’s authority.
  footnotes:
  - marker: a
    text: Or 'the amount of the deposits was innumerable.' The Greek phrase may refer to various entrusted sums held in the treasury.
    reason: lexical_alternative
  - marker: b
    text: That is, these monies were not part of the regular sacrificial account or expenditure.
    reason: lexical_alternative
  - marker: c
    text: Or 'to come under the king’s control.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 예루살렘의 금고가 엄청난 돈으로 가득 차 있어[a], 각기 다른 예탁금의 총액도 헤아릴 수 없으며, 그것들이 제물의 회계와는 관련이 없고[b], 또 이것들이 왕의 권위 아래로 넘어갈 수 있다고 보고하였습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예탁된 돈의 양은 헤아릴 수 없었다.’ 여기서는 금고에 맡겨진 여러 금액을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 정규적인 제사 관련 회계나 지출에 속하지 않는다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘왕의 통제 아래로 들어갈 수 있다고.’
    reason: lexical_alternative
lexical_decisions:
- source_word: προσήγγειλεν
  english_pob_choice: reported
  chosen_korean: 보고하였습니다
  alternatives_korean:
  - 알렸습니다
  - 전했습니다
  lexicon: LSJ
  rationale: 상대에게 사실을 전달하는 뜻을 살려, 서사 문맥에 자연스러운 ‘보고하였습니다’로 옮겼습니다.
- source_word: χρημάτων ἀμυθήτων
  english_pob_choice: immense sums of money
  chosen_korean: 엄청난 돈
  alternatives_korean:
  - 헤아릴 수 없는 재물
  - 막대한 금전
  lexicon: LSJ
  rationale: χρήματα의 금전적 의미와 ἀμύθητος의 ‘헤아릴 수 없음’을 함께 살려, 과장된 규모를 간결하게 드러냈습니다.
- source_word: τὸ πλῆθος τῶν διαφόρων
  english_pob_choice: the quantity of the separate funds
  chosen_korean: 각기 다른 예탁금의 총액
  alternatives_korean:
  - 분리된 예치금의 수량
  - 여러 맡겨진 돈의 총계
  lexicon: LSJ
  rationale: διαφόρων을 단순한 ‘다름’이 아니라 여러 개로 나뉜 예탁금으로 이해하여, 돈의 항목별 분산과 총량을 함께 보이게 했습니다.
- source_word: μὴ προσήκειν αὐτὰ πρὸς τὸν τῶν θυσιῶν λόγον
  english_pob_choice: they were not connected with the account of the sacrifices
  chosen_korean: 그것들이 제물의 회계와는 관련이 없고
  alternatives_korean:
  - 그것들이 제물 비용에 속하지 않고
  - 그것들이 제사의 حساب과는 무관하고
  lexicon: LSJ
  rationale: προσήκειν을 ‘관련이 없다’로, λόγος를 여기서는 회계/산정의 뜻으로 이해하여 제사 예산과의 행정적 구분을 살렸습니다.
- source_word: ὑπὸ τὴν τοῦ βασιλέως ἐξουσίαν πεσεῖν
  english_pob_choice: to fall under the king’s authority
  chosen_korean: 왕의 권위 아래로 넘어갈 수 있다고
  alternatives_korean:
  - 왕의 통치 아래로 떨어질 수 있다고
  - 왕의 권한 아래에 놓일 수 있다고
  lexicon: LSJ
  rationale: 관용구적 표현을 따라 ‘넘어갈 수 있다’로 옮기되, ἐξουσία의 통치권/권위 뉘앙스를 보존했습니다.
theological_decisions:
- issue: 성전 금고의 성격과 제물 회계의 관계
  chosen_reading: 이 돈들은 제물 회계에 속하지 않는 별도의 예탁금으로 제시되며, 곧바로 ‘세속적 사유재산’이라고 단정하지는 않았습니다.
  alternative_readings:
  - 완전히 비성소적 사유 재산이라는 해석
  - 제사에 사용될 수 있어 사실상 압류 정당화가 암시된다는 해석
  rationale: 본문은 제사 회계와의 비연관성을 말할 뿐, 그 자체의 성격을 더 강하게 규정하지는 않으므로 그 긴장을 유지했습니다.
  doctrine_reference: 본문이 말하는 범위를 넘어서 소유권·거룩성 문제를 과도하게 단정하지 않음
