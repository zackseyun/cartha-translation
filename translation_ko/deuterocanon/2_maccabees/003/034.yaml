base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/034.yaml
  text: But you[a], having been scourged from heaven, proclaim to all the majestic power of God. And when they had said these things[b], they became invisible.
  footnotes:
  - marker: a
    text: Or 'the greatness of God's power.' The Greek expression combines terms for majesty/greatness and power/might.
    reason: lexical_alternative
  - marker: b
    text: Or 'they disappeared' / 'they vanished from sight.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 당신은 하늘로부터 매질을 당했으니, 모든 이에게 하나님의 위대한 권능을[a] 선포하십시오. 그들이 이 말을 한 뒤, 보이지 않게 되었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 크신 능력’으로 옮길 수 있습니다. 그리스어 표현은 위대함 또는 장엄함과 권능 또는 힘의 의미를 함께 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 사라졌습니다’ 또는 ‘그들이 시야에서 사라졌습니다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεμαστιγωμένος
  english_pob_choice: having been flogged
  chosen_korean: 하늘에서 매를 맞아
  alternatives_korean:
  - 하늘로부터 채찍질을 당하여
  - 하늘에서 채찍질을 당해
  - 하늘에서 매질을 당해
  lexicon: BDAG
  rationale: 완료 수동 분사로서 이미 받은 가혹한 타격을 나타내므로, 한국어에서는 사건의 결과 상태를 살려 ‘매를 맞아’로 옮겼습니다. ‘채찍질’보다 현대 독자에게 자연스럽고, 고통의 강도도 유지합니다.
- source_word: ἐξ οὐρανοῦ
  english_pob_choice: from heaven
  chosen_korean: 하늘에서
  alternatives_korean:
  - 하늘로부터
  - 천상에서
  lexicon: BDAG
  rationale: 문맥상 단순한 장소가 아니라 하늘에서 비롯된 행위를 가리키지만, 본문이 직접 말하는 표현을 유지하기 위해 ‘하늘에서’로 옮겼습니다.
- source_word: διάγγελλε πᾶσι
  english_pob_choice: proclaim to all
  chosen_korean: 모든 이에게 선포하여라
  alternatives_korean:
  - 모든 사람에게 선포하여라
  - 모두에게 알리어라
  - 모든 이에게 전하여라
  lexicon: BDAG
  rationale: διάγγελλε는 공적이고 널리 알리는 명령이므로 ‘선포하다’가 가장 적절합니다. πᾶσι는 포괄적 수신자를 나타내므로 ‘모든 이에게’로 자연스럽게 처리했습니다.
- source_word: τὸ μεγαλεῖον τοῦ θεοῦ κράτος
  english_pob_choice: the majestic power of God
  chosen_korean: 하나님의 위대한 권능
  alternatives_korean:
  - 하나님의 장엄한 권능
  - 하나님의 위엄과 권능
  - 하나님의 크신 능력
  lexicon: LSJ/BDAG
  rationale: μεγαλεῖον과 κράτος는 서로 밀접하게 연결된 ‘위대함/장엄함’과 ‘권능/힘’을 함께 드러냅니다. 한국어에서는 두 요소를 압축해 ‘위대한 권능’으로 옮겨, 단순한 능력보다 드러난 위엄과 힘을 살렸습니다.
- source_word: ἀφανεῖς ἐγένοντο
  english_pob_choice: they became invisible
  chosen_korean: 보이지 않게 되었습니다
  alternatives_korean:
  - 보이지 않게 되었습니다
  - 사라졌습니다
  - 눈앞에서 없어졌습니다
  lexicon: LSJ
  rationale: 직역하면 ‘보이지 않게 되다’이므로, 신비적 뉘앙스를 유지하면서도 한국어로 자연스럽게 읽히는 표현을 택했습니다. ‘사라졌다’는 가능하지만, 원문의 ‘보이지 않게 됨’을 더 직접적으로 반영합니다.
theological_decisions:
- issue: ‘from heaven’의 행위 주체를 얼마나 명시할 것인가
  chosen_reading: ‘하늘에서’로 유지하고, 추가 설명 없이 본문의 표현을 살립니다.
  alternative_readings:
  - 하나님께서 하늘에서
  - 하늘로부터 하나님의 징계를 받아
  rationale: 그리스어는 직접적으로 ‘하늘에서’라고 말하며, 문맥이 하나님의 개입을 분명히 보여 줍니다. 번역은 본문의 표현을 보존하고, 해석적 덧붙임은 피했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ἄφανεῖς ἐγένοντο의 초자연적 소멸 표현
  chosen_reading: ‘보이지 않게 되었습니다’로 옮겨, 단순 이동이 아니라 비가시화 상태를 드러냅니다.
  alternative_readings:
  - 사라졌습니다
  - 눈앞에서 없어졌습니다
  rationale: 원문은 ‘사라지다’보다 ‘보이지 않게 되다’에 더 가깝고, 이야기의 초자연성을 유지합니다. 따라서 신비적 현상을 약화시키지 않는 쪽을 택했습니다.
  doctrine_reference: Translation philosophy §1, §6
