revisions:
- from: 그러나 너는 하늘에서 매를 맞아 모든 이에게 하나님의 위대한 권능을 선포하여라. 그리고 그들이 이 말을 하고 나자, 그들은 보이지 않게 되었습니다.[a][b]
  to: 그러나 당신은 하늘로부터 매질을 당했으니, 모든 이에게 하나님의 위대한 권능을[a] 선포하십시오. 그들이 이 말을 한 뒤, 보이지 않게 되었습니다.[b]
  rationale: 문체를 현대 합쇼체로 통일했습니다. ‘하늘로부터 매질을 당했으니’는 ἐξ οὐρανοῦ와 완료 수동분사 μεμαστιγωμένος의 의미를 자연스럽고 명확하게 반영하며, 행위 주체를 본문 이상으로 명시하지 않습니다. ‘보이지 않게 되었습니다’는 원문의 비가시화 표현을 유지했습니다. 각주 대안과 표지 위치도 해당 본문 어구에 맞게 정리했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:48:54Z'
