revisions:
- from: 그러자 집들에서 나온 사람들은 모두 떼를 지어 공개적인 간구를 위해 달려나갔습니다. 그곳이 멸시를 당하게 될 참이었기 때문입니다.[a]
  to: 그러자 집들에서 사람들이 떼 지어, 온 백성이 함께 드리는 간구를 하려고 뛰쳐나왔습니다. 그곳이 멸시를 받게 될 참이었기 때문입니다.[a]
  rationale: ἀγεληδόν ἐξεπήδων의 집단적이고 급박한 동작을 ‘떼 지어 … 뛰쳐나왔습니다’로 옮겼습니다. πανδήμῳ ἱκετείᾳ는 공개성에 국한하지 않고 공동체 전체의 간구라는 뜻을 드러내도록 ‘온 백성이 함께 드리는 간구’로 다듬었습니다. τὸν τόπον은 원문의 일반적인 표현을 보존하여 ‘그곳’으로 유지했으며, 문맥상 성전 구역이라는 설명은 각주에만 두었습니다.
