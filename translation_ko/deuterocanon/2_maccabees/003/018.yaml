translation:
  language: ko
  text: 그러자 집들에서 사람들이 떼 지어, 온 백성이 함께 드리는 간구를 하려고 뛰쳐나왔습니다. 그곳이 멸시를 받게 될 참이었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉 성전 구역을 뜻합니다. 그리스어는 단지 ‘그곳’이라고만 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἐκ τῶν οἰκιῶν
  english_pob_choice: those from the houses
  chosen_korean: 집들에서 나온 사람들
  alternatives_korean:
  - 자기 집에서 나온 사람들
  - 집에서 나온 이들
  - 집들에 있던 사람들
  lexicon: LSJ
  rationale: ὁ οἶκος의 복수는 집들을 가리키며, 전치사 ἐκ는 ‘~에서 나옴’을 뜻하므로 ‘집들에서 나온 사람들’이 원문 구조를 가장 직접적으로 살립니다.
- source_word: ἀγεληδὸν ἐξεπήδων
  english_pob_choice: were rushing out in groups
  chosen_korean: 떼를 지어 … 달려나갔습니다
  alternatives_korean:
  - 무리 지어 … 뛰쳐나갔습니다
  - 무더기로 … 쏟아져 나갔습니다
  - 떼로 … 뛰어나갔습니다
  lexicon: LSJ
  rationale: ἀγεληδόν은 무리/떼를 이루어 움직인다는 뜻이고, ἐξεπήδων은 급작스럽게 튀어나가듯 나가는 동작을 나타내므로 ‘떼를 지어 달려나갔습니다’가 집단성과 긴박성을 함께 반영합니다.
- source_word: ἐπὶ πανδήμῳ ἱκετείᾳ
  english_pob_choice: for a public supplication
  chosen_korean: 공개적인 간구를 위해
  alternatives_korean:
  - 공적인 간청을 위해
  - 온 백성의 간구를 위해
  - 공동 간구를 위해
  lexicon: LSJ
  rationale: πανδήμος는 ‘온 백성의/공적인’ 뉘앙스를, ἱκετεία는 단순 요청보다 절박한 간구를 뜻하므로 ‘공개적인 간구’가 두 요소를 무난하게 보존합니다.
- source_word: τὸν τόπον
  english_pob_choice: the place
  chosen_korean: 그곳
  alternatives_korean:
  - 그 장소
  - 그 성소
  - 성전
  lexicon: LSJ
  rationale: 원문은 더 구체적인 ‘성전’이 아니라 τόπον(그 장소)이라고만 말하므로, 본문은 ‘그곳’으로 두어 원문의 절제된 표현을 유지합니다.
theological_decisions:
- issue: τὸν τόπον의 지시 대상
  chosen_reading: ‘그곳’으로 번역하되, 문맥상 예루살렘 성전 구역을 가리키는 것으로 이해합니다.
  alternative_readings:
  - 성전
  - 성소
  rationale: 문맥상 성전의 모독 위험을 말하지만, 헬라어 본문은 일반명사 τόπος를 사용합니다. 본문에서는 원문을 따라가고, 독자는 문맥으로 지시 대상을 파악하게 하는 편이 source-direct합니다.
  doctrine_reference: Translation philosophy §1, §5
