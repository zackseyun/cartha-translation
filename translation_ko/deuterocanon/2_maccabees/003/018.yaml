  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 πανδήμῳ를 ‘공개적인’으로 옮기면 공개성만 두드러지고, 온 백성이 함께하는 공적·공동의 성격이 충분히 드러나지 않습니다. 또한 ‘모두’는 원문의 주어에 별도의 총체성을 더할 수 있습니다.
  naturalness: ‘공개적인 간구를 위해 달려나갔습니다’보다 ‘온 백성이 함께 드리는 간구를 하려고 … 뛰쳐나왔습니다’가 현대 한국어에서 더 자연스럽고, 긴박한 집단 행동도 잘 전달합니다.
  terminology: ‘간구’는 ἱκετεία의 엄숙하고 절박한 청원의 성격을 적절히 반영합니다. τὸν τόπον은 본문에서 ‘그곳’으로 유지하고 각주에서 성전 구역이라는 문맥상 지시 대상을 설명하는 방식이 적절합니다.
