    rationale: πανδήμῳ는 단지 사람들 앞에 공개된 행위라기보다 온 백성 전체에 관련된 공적·공동의 성격을 나타냅니다. ‘온 백성이 함께 드리는 간구’가 문맥과 어휘를 더 잘 살립니다.
  - severity: low
    issue: ‘모두’는 원문에 명시되지 않은 총체성을 주어에 더합니다.
    rationale: 집들에서 나온 사람들이 무리 지어 나왔다는 뜻이면 충분합니다. πανδήμῳ의 범위는 간구를 수식하므로, 이를 주어에 ‘모두’로 옮기지 않는 편이 구문적으로 더 정확합니다.
