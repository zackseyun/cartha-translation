  text: But a certain Simon[a], of the tribe of Benjamin, having been appointed overseer of the temple, was at odds with the high priest about the administration of the market in the city.
  footnotes:
  - marker: a
    text: Or 'market oversight' or 'market regulation.' The Greek term refers to civic supervision connected with the marketplace.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 베냐민 지파의 어떤 시몬은 성전의 감독으로 임명되어 있었는데, 성 안의 시장 행정 문제로 대제사장과 갈등하게 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시장 감독’이나 ‘시장 규제’로 옮길 수 있습니다. 이 그리스어는 시장과 관련된 도시 행정적 감독을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προστάτης τοῦ ἱεροῦ
  english_pob_choice: appointed overseer of the temple
  chosen_korean: 성전의 감독으로 임명되어 있었는데
  alternatives_korean:
  - 성전의 보호자로 임명되어 있었는데
  - 성전의 관리자로 임명되어 있었는데
  - 성전의 수호자로 임명되어 있었는데
  lexicon: LSJ
  rationale: προστάτης는 단순 보호자보다 어떤 것을 맡아 감독하는 사람의 뉘앙스가 강하므로, 직무성·행정성을 살려 ‘감독’으로 옮겼습니다.
- source_word: καθεσταμένος
  english_pob_choice: having been appointed
  chosen_korean: 임명되어 있었는데
  alternatives_korean:
  - 세워져 있었는데
  - 배치되어 있었는데
  - 임명된 상태였는데
  lexicon: LSJ
  rationale: 분사는 이미 맡겨진 지위를 가리키므로, 공식적 임명 상태를 드러내는 ‘임명되어 있었는데’가 가장 자연스럽습니다.
- source_word: διηχθῆναι τῷ ἀρχιερεῖ
  english_pob_choice: was at odds with the high priest
  chosen_korean: 대제사장과 갈등하게 되었습니다
  alternatives_korean:
  - 대제사장과 의견 충돌을 겪었습니다
  - 대제사장과 다투게 되었습니다
  - 대제사장과 대립하게 되었습니다
  lexicon: LSJ
  rationale: 과도한 적대감을 덧붙이지 않으면서 분쟁 상태를 드러내기 위해 ‘갈등하다’를 선택했습니다.
- source_word: ἀγορανομίας
  english_pob_choice: the administration of the market
  chosen_korean: 시장 행정 문제로
  alternatives_korean:
  - 시장 감독 문제로
  - 시장의 규제 문제로
  - 시장 관리 문제로
  lexicon: LSJ
  rationale: ἀγορανομία는 시장의 감독·규제·행정을 아우르는 공적 직무이므로, 한국어에서는 문맥상 가장 이해하기 쉬운 ‘시장 행정’으로 옮겼습니다.
theological_decisions:
- issue: 시몬의 신분과 직무를 암시하는 표현
  chosen_reading: 본문은 시몬을 성전의 공식 감독으로 제시할 뿐, 제사장적 직함을 부여하지는 않습니다.
  alternative_readings:
  - 성전의 수호자라는 보다 일반적 후견인 의미
  - 종교적 권위를 가진 사람으로 넓게 이해하는 읽기
  rationale: 원문은 προστάτης와 καθεσταμένος를 통해 공적·행정적 임명을 강조하므로, 본문에 없는 제사장적 의미를 덧붙이지 않았습니다.
