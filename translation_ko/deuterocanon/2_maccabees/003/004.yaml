  rationale: 분사는 이미 맡겨진 지위를 가리키므로, 공식적 임명 상태를 드러내는 ‘임명되어 있었는데’가 가장 자연스럽습니다.
- source_word: διηχθῆναι τῷ ἀρχιερεῖ
