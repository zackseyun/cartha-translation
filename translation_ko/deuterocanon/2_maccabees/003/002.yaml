translation:
  language: ko
  text: 그곳의 경건과 악을 미워함 때문에, 마침내 왕들까지도 그곳을 존중했고 가장 훌륭한 예물로 성소를 영화롭게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
