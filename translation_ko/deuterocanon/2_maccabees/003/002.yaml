  - 높였습니다
  - 영예롭게 하였습니다
  lexicon: LSJ
  rationale: τιμᾶν과 구별되는 동사로서, 단순한 존중을 넘어 영예를 더하는 느낌을 살리기 위해 ‘영화롭게 하다’를 택했습니다.
theological_decisions:
- issue: ‘그곳’과 성소의 병렬이 가리키는 범위
  chosen_reading: 문맥의 초점이 예루살렘의 성소와 그 성전 구역에 있으므로, 앞의 ‘그곳’은 성소 주변의 거룩한 장소를 가리키는 넓은 표현으로 두고, 뒤에서는 ‘성소’를 분명히 밝혔습니다.
  alternative_readings:
  - ‘그곳’을 단순히 성전 건물 전체로 좁게 읽는 방법
  - 앞뒤를 모두 ‘성전’으로 평준화하는 방법
  rationale: 본문은 τόπος와 ἱερόν을 구별해 사용하므로, 한국어도 같은 구별을 보존하는 편이 소스에 더 충실합니다.
  doctrine_reference: Source distinction between τόπος and ἱερόν
