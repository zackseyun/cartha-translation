  - 가장 빼어난 헌물
  lexicon: LSJ
  rationale: ἀποστολαῖς는 문맥상 ‘보내진 것들’ 곧 봉헌된 예물을 뜻하므로, ‘예물’로 옮기되 품질을 나타내는 ταῖς κρατίσταις는 ‘가장 훌륭한’으로 처리했습니다.
