  lexicon: LSJ
  rationale: 합성어의 직역성을 살리면서도 한국어 표현이 자연스럽도록, 명사구인 ‘악을 미워함’으로 옮겼습니다.
- source_word: ἀποστολαῖς ταῖς κρατίσταις
  english_pob_choice: the finest gifts sent
