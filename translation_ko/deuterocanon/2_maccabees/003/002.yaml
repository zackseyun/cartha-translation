    text: 또는 ‘가장 화려한 예물’로도 옮길 수 있습니다. 그리스어 ἀποστολαῖς는 문맥에 따라 ‘보내진 것들’, 곧 봉헌물이나 증여물을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσέβειαν
  english_pob_choice: piety
  chosen_korean: 경건
  alternatives_korean:
