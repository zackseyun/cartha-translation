  lexicon: LSJ
  rationale: ῥύδην의 급하고 거센 움직임과 ἔσεισεν의 강한 타격성을 함께 살리기 위해 ‘거침없이 달려들어’와 ‘들이쳤습니다’를 결합했습니다.
