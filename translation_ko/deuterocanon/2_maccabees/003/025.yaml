  lexicon: LSJ
  rationale: σαγή는 말의 장비·장식물로, 문맥상 일반 ‘안장’보다 ‘안장 장식’이 더 정확해 보이며 장식된 상태를 나타내는 분사를 한국어 관용에 맞게 표현했습니다.
- source_word: φερόμενος δὲ ῥύδην ἔσεισεν
