  text: For a horse appeared to them with a fearsome rider[a], adorned with a most beautiful saddlecloth; and rushing headlong, it struck Heliodorus with its front hoofs[b], while the one seated on it appeared to be wearing golden armor.
  footnotes:
  - marker: a
    text: Or 'decked out with splendid trappings'; the Greek term refers to the horse's ornamental gear.
    reason: lexical_alternative
  - marker: b
    text: Literally 'shook' or 'struck' Heliodorus with its front hoofs.' The verb can suggest a violent battering.
    reason: lexical_alternative
translation:
  language: ko
  text: 한 말이 그들에게 나타났는데, 그 말은 무시무시한 기수를 태우고 가장 아름다운 말갖춤으로 꾸며져 있었습니다.[a] 그 말은 맹렬히 달려와 앞발굽으로 헬리오도로스를 들이쳤습니다.[b] 그 위에 탄 이는 황금 갑옷을 입고 있는 것으로 보였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘더없이 아름다운 말 장식으로 꾸며진’. 그리스어는 말의 장식용 장비를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘흔들었다’ 또는 ‘쳐서 흔들었다’입니다. 이 동사는 폭력적인 타격을 암시할 수 있습니다.
    reason: lexical_alternative
