  rationale: ἐπιβάτης는 ‘말에 탄 사람/기수’이므로 ‘기수’로 옮겼고, φοβερός의 공포 유발 성격을 ‘무서운’으로 간명하게 살렸습니다.
- source_word: καλλίστῃ σαγῇ διακεκοσμημένος
  english_pob_choice: adorned with a most beautiful harness
  chosen_korean: 가장 아름다운 안장 장식으로 꾸며져 있었고
