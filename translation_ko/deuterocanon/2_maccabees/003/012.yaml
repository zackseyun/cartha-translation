    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικήσαί
  english_pob_choice: to wrong
  chosen_korean: 해치는 것
  alternatives_korean:
  - 부당하게 대하는 것
  - 억울하게 하는 것
  lexicon: BDAG
  rationale: 문맥상 법적·도덕적 불의를 뜻하므로, 물리적 상해보다 넓은 의미의 ‘해치다’로 자연스럽게 옮겼습니다.
- source_word: τοὺς πεπιστευκότας
  english_pob_choice: those who had trusted
  chosen_korean: 신뢰한 사람들을
