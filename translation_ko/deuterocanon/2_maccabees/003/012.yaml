  lexicon: BDAG
  rationale: 완료 분사는 이미 형성된 지속적 신뢰를 가리키므로, 단순 과거보다 상태를 살린 ‘신뢰한’이 적절합니다.
- source_word: ἁγιωσύνῃ
  english_pob_choice: holiness
  chosen_korean: 거룩함
  alternatives_korean:
