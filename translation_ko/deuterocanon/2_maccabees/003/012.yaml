  rationale: 본문은 ‘거룩함’과 ‘위엄’과 나란히 놓인 추상 명사들을 사용하므로, 특정 제도명보다 성전의 보호된 신성성을 넓게 보존하는 표현이 더 잘 맞습니다. 다만 피난·보호의 법적 뉘앙스는 각주에 남겼습니다.
