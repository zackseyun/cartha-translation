  source_fidelity: 수정안은 ἀδικεῖν의 법적·도덕적 불의의 의미를 ‘부당하게 대하다’로 보존하고, 완료분사 πεπιστευκότας의 선행되고 지속된 신뢰를 ‘신뢰해 온 사람들’로 나타냅니다. ‘그 장소의 거룩함’ 및 전 세계에서 존중받는 성전의 ‘위엄과 불가침성’이라는 병렬 구조와 παντελῶς의 강한 불가능성도 충실히 반영합니다.
  naturalness: 현행 ‘침범할 수 없음’은 추상명사들의 병렬 안에서 다소 구어적이고 어색합니다. ‘불가침성’이 자연스럽고, ‘해치는 것’보다 ‘부당하게 대하는 일’이 ἀδικῆσαι의 뜻을 더 정확히 전달합니다.
  terminology: ‘거룩함’, ‘위엄’, ‘불가침성’은 성소의 성스러운 지위와 존엄 및 법적 보호를 균형 있게 전달합니다. ἀσυλία의 피난권/성역 보호 특수 뉘앙스는 각주에 보존합니다.
  issues:
  - severity: medium
    issue: ‘해치는 것’은 ἀδικήσαί의 도덕적·법적 부당함을 물리적 손해로 좁힐 수 있습니다.
    rationale: 이 동사는 이 문맥에서 신뢰한 이들을 부당하게 대하거나 그들에게 불의를 행하는 뜻이며, 단순한 위해보다 넓습니다.
  - severity: low
    issue: ‘침범할 수 없음’은 명사 병렬에서 문체적으로 부자연스럽습니다.
