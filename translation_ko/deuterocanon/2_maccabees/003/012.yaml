  - 신성함
  lexicon: BDAG
  rationale: 장소의 성스러운 성격을 직접적으로 나타내는 표준 한국어로 ‘거룩함’을 택했습니다.
- source_word: ἀσυλίᾳ
  english_pob_choice: inviolability
  chosen_korean: 침범할 수 없음
  alternatives_korean:
  - 불가침성
  - 피난권
  lexicon: LSJ
  rationale: 형용사적 개념의 보호·불가침성을 살리되, 문장 안에서 가장 직접적으로 이해되는 표현으로 옮겼습니다. 본문의 아슬리아(도피성/피난권) 뉘앙스는 각주로 보완했습니다.
theological_decisions:
- issue: 성전의 'ἀσυλία'를 한국어 본문에서 어떻게 드러낼지
  chosen_reading: 침범할 수 없음[a]
  alternative_readings:
