translation:
  language: ko
  text: 그리고 그 장소의 거룩함과 온 세상에서 존중받는 그 성전의 위엄과 불가침성[a]을 신뢰해 온 사람들을 부당하게 대하는 일은 전적으로 불가능하였습니다.
