base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/032.yaml
  text: But the high priest[a], becoming suspicious that the king might perhaps suppose that some wrongdoing against Heliodorus had been carried out by the Jews, offered a sacrifice for the man's recovery.
  footnotes:
  - marker: a
    text: Or 'for the man's deliverance' or 'for the man's salvation'; the Greek σωτηρία can cover rescue, preservation, or salvation, but here likely refers to Heliodorus's physical recovery.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 대제사장은 왕이 혹시 유대인들이 헬리오도로스를 상대로 어떤 악행을 저질렀다고 생각할까 염려하여, 그 사람의 회복을 위하여 희생 제사를 드렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 사람의 구출을 위하여’, ‘그 사람의 구원을 위하여’. 그리스어 σωτηρία는 구출, 보전, 구원을 아우를 수 있으나, 여기서는 헬리오도로스의 육체적 회복을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕποπτος δὲ γενόμενος
  english_pob_choice: becoming suspicious
  chosen_korean: 염려하게 되어
  alternatives_korean:
  - 의심하게 되어
  - 수상하게 여기게 되어
  - 불안해하게 되어
  lexicon: LSJ
  rationale: 여기서 대제사장이 직접 의심받는 것이 아니라, 왕이 어떻게 받아들일지 미리 걱정하는 뉘앙스이므로 자연스러운 한국어로는 ‘염려하게 되어’가 가장 무리 없이 대응합니다.
- source_word: μή ποτε διάλημψιν ὁ βασιλεὺς
  english_pob_choice: that the king might perhaps suppose
  chosen_korean: 왕이 … 오해할지도 모른다고
  alternatives_korean:
  - 왕이 … 추측할지도 모른다고
  - 왕이 … 생각할지도 모른다고
  - 왕이 … 의심할지도 모른다고
  lexicon: LSJ
  rationale: μή ποτε와 διάλημψιν의 조합은 막연한 가능성과 걱정스러운 추정을 나타내므로, 문맥상 ‘오해하다’가 가장 적절하게 그 불안한 추정의 성격을 드러냅니다.
- source_word: κακουργίαν τινά περὶ τὸν Ἡλιόδωρον
  english_pob_choice: some wrongdoing against Heliodorus
  chosen_korean: 헬리오도로스에게 어떤 악행을
  alternatives_korean:
  - 헬리오도로스에게 어떤 잘못을
  - 헬리오도로스에게 어떤 범죄를
  - 헬리오도로스에 대해 어떤 악행을
  lexicon: LSJ
  rationale: κακουργία는 단순한 실수보다 분명한 악행·불법 행위를 가리키므로 ‘악행’이 강도를 살립니다. περὶ τὸν은 여기서 대상에 대한 적대적 행위를 뜻하므로 ‘에게’로 풀었습니다.
- source_word: προσήγαγε θυσίαν ὑπὲρ τῆς ... σωτηρίας
  english_pob_choice: offered a sacrifice for the man's recovery
  chosen_korean: 희생제물을 드렸습니다
  alternatives_korean:
  - 제사를 드렸습니다
  - 희생을 바쳤습니다
  - 희생제사를 드렸습니다
  lexicon: LSJ
  rationale: θυσία는 제의적 희생제물을 가리키므로 ‘희생제물’이 본문을 가장 직접적으로 반영합니다. ὑπὲρ τῆς σωτηρίας는 이 문맥에서 물리적 회복/구조를 뜻하므로, 한국어 본문에는 과도한 신학화 없이 ‘드렸습니다’로 간결히 옮겼습니다.
theological_decisions:
- issue: σωτηρία의 의미 범위
  chosen_reading: 여기서는 영적 구원이 아니라 헬리오도로스의 신체적 회복과 보전으로 이해합니다.
  alternative_readings:
  - 구원
  - 구출
  - 안전
  rationale: 직전 문맥이 헬리오도로스의 쓰러짐과 회복을 다루므로, ‘회복’의 의미를 우선해야 본문의 서사적 의미를 보존할 수 있습니다.
  doctrine_reference: 'DOCTRINE.md: Original-language primacy over translation tradition; Preserve theological tension rather than resolve it'
