  yaml_path: translation/deuterocanon/2_maccabees/003/026.yaml
  text: But two other young men appeared to him[a], outstanding in strength, most handsome in appearance, and splendid in clothing; and standing on either side of him, they kept scourging him without stopping, landing many blows on him.
  footnotes:
  - marker: a
    text: Or 'most beautiful in bearing.' The Greek phrase literally links beauty with visible glory/appearance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그에게 다른 두 젊은이가 나타났는데, 그들은 힘이 뛰어나고, 모습이 가장 아름다우며, 옷차림이 빼어났습니다. 그들은 그의 양쪽에 서서 끊임없이 그를 채찍질하고, 그에게 많은 타격을 가했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자태가 가장 아름다우며’라고 할 수 있습니다. 헬라어 표현은 아름다움을 겉으로 드러난 영광 또는 모습과 연결합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι δὲ δύο
  english_pob_choice: But two other
  chosen_korean: 또 다른 두
  alternatives_korean:
