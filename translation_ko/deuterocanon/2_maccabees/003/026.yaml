  text: But two other young men appeared to him[a], outstanding in strength, most handsome in appearance, and splendid in clothing; and standing on either side of him, they kept scourging him without stopping, landing many blows on him.
  footnotes:
  - marker: a
    text: Or 'most beautiful in bearing.' The Greek phrase literally links beauty with visible glory/appearance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그에게 또 다른 두 젊은이가 나타났는데, 그들은 힘에서는 뛰어나고, 모습에서는 가장 아름다우며, 옷차림에서는 빼어났습니다. 그리고 그들은 그의 양쪽에 서서 멈추지 않고 그를 채찍질하며, 그에게 많은 매질을 가했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모습에서는 가장 아름다우며’라는 뜻일 수 있습니다. 헬라어 표현은 아름다움을 겉으로 드러난 영광/모습과 연결합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι δὲ δύο
  english_pob_choice: But two other
  chosen_korean: 또 다른 두
  alternatives_korean:
  - 그리고 두 사람
  - 두 사람이 더
  lexicon: LSJ
  rationale: ἕτεροι는 앞선 인물과 구별되는 ‘또 다른’이라는 뜻이어서 이를 분명히 살렸고, δέ는 장면 전환의 약한 접속으로 처리했습니다.
- source_word: νεανίαι
  english_pob_choice: young men
  chosen_korean: 젊은이들
  alternatives_korean:
  - 청년들
  - 젊은 남자들
  lexicon: LSJ
  rationale: 명사 자체는 나이 어린 남성들을 가리키므로 자연스러운 현대 한국어인 ‘젊은이들’로 옮겼습니다.
- source_word: τῇ ῥώμῃ μὲν ἐκπρεπεῖς, κάλλιστοι δὲ τὴν δόξαν, διαπρεπεῖς δὲ τὴν περιβολήν
  english_pob_choice: outstanding in strength, most handsome in appearance, and splendid in clothing
  chosen_korean: 힘에서는 뛰어나고, 모습에서는 가장 아름다우며, 옷차림에서는 빼어났습니다
  alternatives_korean:
  - 능력에서는 탁월하고, 외모에서는 가장 아름다우며, 복장에서는 빛났습니다
  - 힘은 뛰어나고, 모습은 매우 아름다우며, 옷차림은 뛰어났습니다
  lexicon: LSJ
  rationale: ῥώμη는 신체적 힘, δόξα는 이 문맥에서 외형/모습, περιβολή는 옷차림을 가리키므로 각각 한국어로 분리해 살렸습니다.
- source_word: ἐμαστίγουν αὐτὸν ἀδιαλείπτως
  english_pob_choice: they kept scourging him without stopping
  chosen_korean: 멈추지 않고 그를 채찍질하며
  alternatives_korean:
  - 끊임없이 그를 채찍질하며
  - 쉬지 않고 그를 매질하며
  lexicon: LSJ
  rationale: 미완료 과거형은 지속되는 동작을 나타내므로 ‘멈추지 않고’로 옮겼고, μαστιγόω는 단순한 때림보다 강한 ‘채찍질하다’가 적절합니다.
- source_word: πολλὰς ἐπιρριπτοῦντες αὐτῷ πληγάς
  english_pob_choice: inflicting many blows on him
  chosen_korean: 그에게 많은 매질을 가했습니다
  alternatives_korean:
  - 그에게 많은 타격을 가했습니다
  - 그에게 많은 채찍질을 퍼부었습니다
  lexicon: LSJ
  rationale: πληγαί는 ‘상처 내는 타격/매질’의 의미가 강하므로 한국어 관용에 맞는 ‘매질’로 옮겨 반복적 폭행의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 두 젊은이의 정체
  chosen_reading: 본문이 이들을 단지 ‘젊은이들’로 묘사하므로, 천사라고 특정하지 않고 서술적 표현을 유지했습니다.
  alternative_readings:
  - 두 천사
  - 두 하늘의 존재
  rationale: 헬라어 본문은 이 절에서 νεανίαι라고만 부르며 천사적 신분을 명시하지 않으므로, 본문이 말하는 수준을 넘지 않도록 했습니다.
  doctrine_reference: 원문 우선과 해석의 절제; 본문이 지지하지 않는 신분 확정은 피함.
