  to: 그러나 곧 헬리오도로스의 동료 몇 사람이 오니아스에게, 숨이 거의 끊어진 그 사람에게 생명을 허락해 주시도록 지극히 높으신 분께 간구해 달라고 권했습니다.[a][b]
  rationale: 중복된 ‘부르짖어 부르고’를 ‘지극히 높으신 분께 간구해’로 고치고, 생명을 주시는 분이 지극히 높으신 분임을 한국어 문법에서 명확히 했습니다. ‘숨이 거의 끊어진’은 παντελῶς와 ἐν ἐσχάτῃ πνοῇ가 나타내는 임종의 극한 상태를 자연스럽게 보존합니다. 각주 a도 본문의 기도 동사에 맞게 바로잡았습니다.
