    rationale: 현 문장은 오니아스에게 ‘그에게 생명을 허락해 달라’고 권한 것으로 읽힙니다. 문맥상 오니아스가 지극히 높으신 분께 그 사람의 생명을 청하도록 요청받은 것입니다.
