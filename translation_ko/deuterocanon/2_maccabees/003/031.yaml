  text: But quickly some of Heliodorus's companions were urging Onias to call upon the Most High and grant life to the one who was lying at his last breath[a][b].
  footnotes:
  - marker: a
    text: Or 'to invoke the Most High.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'to the one lying at the last breath,' that is, at the point of death.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 곧 헬리오도로스의 동료들 몇 사람이 오니아스에게 가장 높으신 분을 부르짖어 부르고, 숨이 거의 다 끊어진 그에게 생명을 허락해 달라고 권했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가장 높으신 분을 불러 드리다.’
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘마지막 숨에 누워 있는 이에게’로, 곧 죽음 직전이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταχὺ
  english_pob_choice: quickly
  chosen_korean: 곧
  alternatives_korean:
  - 빨리
  - 즉시
  lexicon: LSJ
  rationale: 신속한 시점을 간결하게 드러내며, 서술 흐름에 자연스럽게 맞습니다.
- source_word: τῶν τῷ Ἡλιοδώρῳ συνηθῶν
  english_pob_choice: some of Heliodorus's companions
  chosen_korean: 헬리오도로스의 동료들 몇 사람
  alternatives_korean:
  - 헬리오도로스와 친한 사람들 몇 사람
  - 헬리오도로스의 수행원 몇 사람
  lexicon: LSJ
  rationale: συνήθης의 관계적 뉘앙스를 ‘동료들’로 옮기되, ‘몇 사람’으로 일부만 지칭함을 살렸습니다.
- source_word: ἐπικαλέσασθαι τὸν ὕψιστον
  english_pob_choice: to call upon the Most High
  chosen_korean: 가장 높으신 분을 부르짖어 부르고
  alternatives_korean:
  - 가장 높으신 분을 부르다
  - 가장 높으신 분께 부르짖다
  lexicon: LSJ
  rationale: ἐπικαλέομαι의 종교적 ‘부르다/호소하다’ 의미를 살리면서, ὕψιστος를 별도의 신적 호칭으로 자연스럽게 표현했습니다.
- source_word: τὸ ζῆν χαρίσασθαι
  english_pob_choice: and grant life
  chosen_korean: 생명을 허락해 달라고
  alternatives_korean:
  - 생명을 주어 달라고
  - 살게 해 달라고
  lexicon: LSJ
  rationale: χαρίζομαι의 ‘은혜롭게 베풀다’ 뉘앙스를 ‘허락하다’로 옮겨, 생명이 요청되는 선물이라는 느낌을 보존했습니다.
- source_word: τῷ παντελῶς ἐν ἐσχάτῃ πνοῇ κειμένῳ
  english_pob_choice: to the one who was lying at his last breath
  chosen_korean: 숨이 거의 다 끊어진 그
  alternatives_korean:
  - 죽음에 거의 이른 그
  - 마지막 숨을 쉬고 있는 그
  lexicon: LSJ
  rationale: 직역적 이미지를 한국어로 매끄럽게 풀어, ‘마지막 숨’의 극한 상태를 자연스럽게 드러냈습니다.
