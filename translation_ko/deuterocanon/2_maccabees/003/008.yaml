translation:
  language: ko
  text: 그러자 헬리오도로스는 즉시 길을 떠났습니다[a]. 겉으로는 코일레 시리아와 페니키아의 도시들을 시찰하려는 것이었으나, 실제로는 왕의 목적을 실행하려는 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문에는 왕(βασιλέως) 앞에 의미를 알 수 없는 ‘A’가 있습니다. 이는 판본 또는 전사 과정에서 생긴 이상 표기일 가능성이 있으며, 번역은 문맥에 따라 ‘왕의 목적’으로 옮겼습니다.
    reason: textual_variant
lexical_decisions:
- source_word: εὐθέως
  english_pob_choice: immediately
  chosen_korean: 즉시
  alternatives_korean:
  - 곧바로
  - 바로
  lexicon: LSJ
  rationale: 즉각적인 행동의 개시를 간결하고 현대적인 표준어로 살리기 위해 ‘즉시’를 택했습니다.
- source_word: ἐποιεῖτο τὴν πορίαν
  english_pob_choice: set out on the journey
  chosen_korean: 길을 떠났습니다
  alternatives_korean:
  - 여정을 시작했습니다
  - 여행을 떠났습니다
  lexicon: LSJ
  rationale: 문맥상 단순한 이동이 아니라 출발의 시작을 뜻하므로, 자연스러운 한국어 관용인 ‘길을 떠났습니다’로 옮겼습니다.
- source_word: τῇ μὲν ἐμφάσει ... τῷ πράγματι δέ
  english_pob_choice: outwardly ... but in reality
  chosen_korean: 겉으로는 ... 그러나 실제로는
  alternatives_korean:
  - 겉모습으로는 ... 그러나 사실은
  - 명목상 ... 그러나 실제로는
  lexicon: LSJ
  rationale: 겉모습과 실제의 대비를 분명히 드러내면서도, 원문의 대조 구조를 자연스럽게 보존하기 위해 이 표현을 사용했습니다.
- source_word: ἐφοδεῦσαι
  english_pob_choice: inspect
  chosen_korean: 시찰하려는 것처럼
  alternatives_korean:
  - 방문하려는 것처럼
  - 둘러보려는 것처럼
  lexicon: LSJ
  rationale: ἐφοδεῦσαι는 단순 방문보다 ‘살피고 점검하다’는 뉘앙스가 강하므로, 행정적·공식적 의미를 살린 ‘시찰하다’가 더 가깝습니다.
- source_word: τὴν τοῦ A βασιλέως πρόθεσιν
  english_pob_choice: the king’s purpose
  chosen_korean: 왕의 목적
  alternatives_korean:
  - 왕의 계획
  - 왕의 의도
  lexicon: LSJ
  rationale: πρόθεσις는 여기서 의도/목적을 뜻하며, POB의 ‘purpose’를 따라 ‘목적’으로 옮겼습니다. 본문에 보이는 A는 의미 요소가 아닌 본문상 이상 표기이므로 반영하지 않았습니다.
theological_decisions:
- issue: 겉모습과 실제의 대비
  chosen_reading: 헬리오도로스의 행동은 겉으로는 시찰처럼 보이지만 실제 목적은 왕의 뜻을 실행하는 데 있음을 분명히 드러냈습니다.
  alternative_readings:
  - 단순한 중립적 이동 묘사
  - ‘명목상’이라는 더 강한 위장 표현
  rationale: 원문은 단순 이동이 아니라 표면상 목적과 실제 목적의 긴장을 강조하므로, 그 대비를 살려 번역했습니다.
  doctrine_reference: 성서 서술의 사실성과 인물의 이중적 동기를 드러내는 서술 이해
- issue: τῷ πράγματι δέ의 해석
  chosen_reading: ‘그러나 실제로는’로 번역해 표면과 실재의 반전을 강조했습니다.
  alternative_readings:
  - ‘사실은’
  - ‘실제로는’
  rationale: 원문의 대조를 한국어에서 가장 자연스럽고 또렷하게 전달하는 방식이므로 이 표현을 선택했습니다.
  doctrine_reference: 서술 대조 구조의 보존
