  text: And while the high priest was making atonement[a], the same young men appeared again to Heliodorus, clothed in the same garments, and standing there they said, “Give many thanks to Onias the high priest, for because of him the Lord has graciously granted you your life.”
  footnotes:
  - marker: a
    text: Or 'was performing the expiation'; more technically, 'was making propitiation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 대제사장이 속죄를 행하고 있을 때에, 그 동일한 젊은이들이 다시 헬리오도로스에게 같은 옷을 입고 나타나 서서 말하였습니다. 「오니아스 대제사장에게 크게 감사하십시오. 그를 통해 주님께서 당신에게 생명을 은혜로 주셨기 때문입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘속죄 제의를 집행하고 있을 때’; 더 전문적으로는 ‘화목하게 하는 행위를 하고 있을 때’.
    reason: alternative_reading
lexical_decisions:
- source_word: ποιουμένου ... τὸν ἱλασμόν
  english_pob_choice: was making atonement
  chosen_korean: 속죄를 행하고 있을 때
  alternatives_korean:
  - 속죄를 하고 있을 때
  - 속죄의 제사를 드리고 있을 때
  - 화목하게 하는 제의를 하고 있을 때
  lexicon: LSJ
  rationale: ἱλασμός는 제의적 속죄 행위를 가리키므로, 문맥의 성격을 살려 ‘속죄를 행하다’로 옮겼습니다. “atonement”의 제의적 무게를 유지하면서도 한국어에서 자연스럽습니다.
- source_word: οἱ αὐτοὶ νεανίαι
  english_pob_choice: the same young men
  chosen_korean: 그 동일한 젊은이들
  alternatives_korean:
  - 그 같은 젊은이들
  - 바로 그 젊은이들
  - 그 젊은이들
  lexicon: LSJ
  rationale: αὐτοὶ는 이전에 나타난 인물들과 동일함을 강조하므로 ‘동일한’으로 반영했습니다. νεανίαι는 문맥상 젊은 남자들이므로 ‘젊은이들’이 적절합니다.
- source_word: ἐν ταῖς αὐταῖς ἐσθήσεσιν ἐστολισμένοι
  english_pob_choice: clothed in the same garments
  chosen_korean: 같은 옷을 입고
  alternatives_korean:
  - 같은 의복을 입고
  - 같은 예복을 입고
  - 같은 옷차림으로
  lexicon: LSJ
  rationale: ἐσθής/ἐσθῆτες는 의복을 뜻하고, 여기서는 이전과 동일한 모습의 재현이 중요하므로 간결한 ‘같은 옷을 입고’로 옮겼습니다.
- source_word: Πολλὰ ... χάριτας ἔχε
  english_pob_choice: Give many thanks
  chosen_korean: 크게 감사하십시오
  alternatives_korean:
  - 많이 감사하십시오
  - 많은 감사를 드리십시오
  - 진심으로 감사하십시오
  lexicon: LSJ
  rationale: 그리스어 관용구는 감사하라는 강한 권유입니다. 직역보다 한국어에서 자연스러운 명령형 ‘크게 감사하십시오’가 ποσλλὰ와 χάριτας의 강조를 살립니다.
- source_word: σοὶ κεχάρισται τὸ ζῆν
  english_pob_choice: has graciously granted you your life
  chosen_korean: 당신에게 생명을 은혜로 주셨기 때문입니다
  alternatives_korean:
  - 당신의 생명을 은혜로 허락하셨기 때문입니다
  - 당신이 살도록 은혜를 베푸셨기 때문입니다
  - 당신의 삶을 은혜롭게 허락하셨기 때문입니다
  lexicon: LSJ
  rationale: χαρίζομαι는 단순 허용이 아니라 호의적·은혜로운 베풂을 뜻하므로 ‘은혜로 주셨다’로 옮겼습니다. τὸ ζῆν은 ‘생명/삶’의 상태를 가리켜 ‘생명’이 자연스럽습니다.
theological_decisions:
- issue: ἱλασμός의 제의적 의미를 한국어로 어떻게 드러낼지
  chosen_reading: 속죄를 행하다
  alternative_readings:
  - 화목 제의를 드리다
  - 속죄의 제사를 드리다
  - 화목하게 하다
  rationale: 문맥은 대제사장의 제의 행위이므로, 교리적 추상화보다 제의적 사실성을 드러내는 번역이 원문에 가깝습니다. 동시에 ‘속죄’는 구약 제의의 핵심 의미를 보존합니다.
  doctrine_reference: 'DOCTRINE.md: 원문 우선, 제의적·신학적 무게를 유지하되 불필요한 교회 용어로 대체하지 않음'
- issue: Κύριος를 하나님 칭호로 어떻게 처리할지
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 하나님
  - 야훼
  rationale: 본문은 인간이 직접 헬리오도로스에게 하는 말이며, 서술의 자연스러움과 POB 기본어휘를 고려해 ‘주님’으로 옮겼습니다. 여기서는 야훼 인용문 맥락이 아니므로 ‘야훼’로 옮기지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: κύριος의 기본 번역은 주(主)/주님, 야훼는 구약적 인용/명시적 YHWH에 한정'
