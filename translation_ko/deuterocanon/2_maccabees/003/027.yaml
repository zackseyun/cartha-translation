  text: 그는 갑자기 땅에 쓰러졌고, 깊은 어둠에 휩싸였습니다[a]. 그리고 그들은 그를 들어 들것에 실었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문에는 γῆν(‘땅에’)이 세 번 연속으로 나타나는데, 대부분의 경우 필사 또는 전사상의 반복으로 보이므로 의미는 단순히 ‘땅에’로 옮겼습니다.
    reason: textual_variant
