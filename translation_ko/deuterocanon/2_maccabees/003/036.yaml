translation:
  language: ko
  text: 그리고 그는 자기 눈으로 본 모든 것, 곧 가장 위대하신 하나님의 일들을 모든 사람에게 증언했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 전통적으로는 ‘지극히 높으신 하나님’이라고 옮길 수 있습니다. 그러나 여기의 그리스어는 통상 쓰이는 ‘가장 높으신’(ὑψίστου)이 아니라 ‘가장 위대한’(μεγίστου)을 사용합니다.
    reason: lexical_alternative
