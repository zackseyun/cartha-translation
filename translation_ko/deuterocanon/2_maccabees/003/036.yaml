    text: 또는 더 전통적으로는 ‘지극히 높으신 하나님’이라고 옮길 수 있습니다. 그러나 여기의 그리스어는 보통의 ‘가장 높으신’(ὕψιστος)이 아니라 ‘가장 위대한’(μεγίστου)을 사용합니다.
    reason: lexical_alternative
