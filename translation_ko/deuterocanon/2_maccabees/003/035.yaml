base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/035.yaml
  text: But Heliodorus[a], after offering a sacrifice to God and making very great vows to the one who had preserved his life, and after taking leave of Onias[c][b], returned to the king.
  footnotes:
  - marker: a
    text: Or 'making the greatest prayers'; the Greek word can mean 'prayers' or 'vows,' but 'vows' fits the sacrificial setting better.
    reason: lexical_alternative
  - marker: b
    text: Or 'after bidding Onias farewell.' The Greek verb can also mean 'receive' or 'welcome,' but the departure context favors a leave-taking sense.
    reason: lexical_alternative
  - marker: c
    text: The Greek verb is military in flavor, literally suggesting a return march or breaking camp.
    reason: cultural_note
translation:
  language: ko
  text: 그런데 헬리오도로스는 하나님께 희생 제물을 바치고, 자기 생명을 보존해 주신 분께 매우 큰 서원을 하고[a] 오니아스에게 작별을 고한 뒤[b] 왕에게 돌아갔습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘서원’으로 옮겼지만, 헬라어 εὐχή는 문맥에 따라 ‘기도’도 뜻할 수 있습니다. 제사와 결합된 여기서는 ‘서원’이 더 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: ἀποδέχομαι는 ‘받아들이다’ 또는 ‘맞이하다’를 뜻할 수도 있지만, 출발 문맥에서는 ‘작별을 고하다’라는 뜻이 더 잘 맞습니다.
    reason: lexical_alternative
  - marker: c
    text: ἀνεστρατοπέδευσεν에는 군사적 어감이 있으며, 문자적으로는 부대를 돌려 행군하거나 철영하여 돌아가는 것을 시사합니다.
    reason: cultural_note
lexical_decisions:
- source_word: θυσίαν ἀνενέγκων τῷ θεῷ
  english_pob_choice: after offering a sacrifice to God
  chosen_korean: 하나님께 희생제물을 바치고
  alternatives_korean:
  - 하나님께 제사를 드리고
  - 하나님께 희생 제물을 드리고
  lexicon: LSJ
  rationale: ἀνενέγκων with θυσίαν은 제물을 ‘올려 바치다/바치다’의 뜻이므로, 제의적 행위를 분명히 살린 ‘희생제물을 바치고’가 자연스럽습니다.
- source_word: εὐχὰς μεγίστας εὐξάμενος
  english_pob_choice: making very great vows
  chosen_korean: 매우 큰 서원을 드린 뒤
  alternatives_korean:
  - 매우 큰 기도를 드린 뒤
  - 가장 큰 서원을 드린 뒤
  lexicon: LSJ
  rationale: εὐχή는 문맥상 기도보다 ‘서원’이 더 적절하므로, μεγίστας는 과장 없이 강도를 살린 ‘매우 큰’으로 옮겼습니다.
- source_word: τῷ τὸ ζῆν περιποιήσαντι
  english_pob_choice: to the one who had preserved his life
  chosen_korean: 자기 생명을 보존해 주신 분께
  alternatives_korean:
  - 자기 생명을 지켜 주신 분께
  - 자기 목숨을 살려 주신 분께
  lexicon: LSJ
  rationale: 직역보다 ‘보존해 주신’이 ‘계속 살게 하신’ 뉘앙스를 잘 살리며, 여기서는 하나님을 가리키는 말로 이해됩니다.
- source_word: τὸν Ὀνίαν ἀποδεξάμενος
  english_pob_choice: after taking leave of Onias
  chosen_korean: 오니아스에게 작별 인사를 하고
  alternatives_korean:
  - 오니아스에게 작별을 고하고
  - 오니아스를 맞이하고
  lexicon: LSJ
  rationale: ἀποδέχομαι는 문맥상 ‘작별하다/작별 인사하다’의 의미가 가장 자연스러워, 출발 장면에 맞게 옮겼습니다.
- source_word: ἀνεστρατοπέδευσεν πρὸς τὸν βασιλέα
  english_pob_choice: returned to the king
  chosen_korean: 왕에게 돌아갔습니다
  alternatives_korean:
  - 왕에게 진군해 갔습니다
  - 왕에게 되돌아갔습니다
  lexicon: LSJ
  rationale: 동사에는 군사적 ‘철수/복귀’ 뉘앙스가 있지만, 한국어 본문에서는 간결하게 ‘돌아갔습니다’로 옮기되 그 이동 방향은 ‘왕에게’로 보존했습니다.
theological_decisions:
- issue: τῷ θεῷ의 신학적 지시 대상
  chosen_reading: 본문의 ‘하나님’은 헬리오도로스가 제물을 바치는 대상으로, 이어지는 감사와 서원의 상대가 됩니다.
  alternative_readings:
  - 일반적인 신적 존재를 가리키는 표현으로 완화할 수 있습니다.
  rationale: 장면 전체가 헬리오도로스의 회복 직후 감사 행위이므로, 특정한 유일신 하나님을 가리키는 것으로 읽는 것이 가장 자연스럽습니다.
  doctrine_reference: 본문 문맥에 따른 지시 대상 해석
