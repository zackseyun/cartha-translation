    text: 또는 “맡겨진 이들에게”로 옮길 수 있습니다. 그리스어의 여격 표현은 ‘맡긴 이들’과 ‘맡겨진 것들’의 관계를 간결하게 나타내며, 문맥에서는 보관을 위해 재산을 맡긴 사람들을 가리킵니다.
    reason: lexical_alternative
