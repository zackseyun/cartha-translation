  source_fidelity: ‘이들에게서’는 ‘from those people’이라는 출처를 나타내어, 여격 τοῖς πεπιστευκόσιν의 기능과 맞지 않습니다. 문맥상 재산을 맡긴 사람들을 위한 보존을 청하는 뜻으로 옮기는 것이 안전합니다. ‘부르짖어 기도했습니다’는 가능하나, ἐπεκαλοῦντο의 ‘호소하며 간구하다’보다 다소 강한 정서적 의미를 덧붙입니다.
  naturalness: 원문의 ‘그것을 맡긴 이들에게서’는 한국어 문장 안에서도 수식 관계와 격조사가 어색합니다. ‘맡긴 이들을 위해’와 ‘지켜 주시도록 간구했습니다’는 현대 표준어 합쇼체로 자연스럽습니다.
  terminology: ‘전능하신 주’는 παγκρατῆ κύριον의 reverential divine title을 적절히 반영합니다. ‘맡겨진 것들’은 τὰ πεπιστευμένα의 수동 완료분사 의미를 유지합니다.
