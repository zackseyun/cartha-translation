translation:
  language: ko
  text: 그리고 유르카노스[a], 토비아의 아들에게 속한 일부도 있었습니다. 그는 매우 높은 지위에 있는 사람이었습니다. 불경한 시몬은 그만큼까지 중상하지는 않았습니다. 모두 합하면 은 사백 달란트와 금 이백 달란트였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 본문은 앞 구절의 ‘달란트’를 다시 반복하지 않고 ‘금 이백’이라고만 적지만, 문맥상 ‘달란트’가 이어집니다.
    reason: lexical_alternative
