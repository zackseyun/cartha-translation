  text: 그러므로 여러분이 이 일들에 대한 호의를 계속 지키신다면, 저도 앞으로 좋은 일들의 원인이 되도록 힘쓰겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이 일들’은 πράγματα의 넓은 범위를 살린 표현으로, ‘이 일에 관하여’ 또는 ‘이 사업에 관하여’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘좋은 일들의 원인’은 αἰτιαῖος의 인과성을 반영한 번역으로, ‘좋은 일들을 가져오는 것’으로도 옮길 수 있습니다.
    reason: lexical_alternative
