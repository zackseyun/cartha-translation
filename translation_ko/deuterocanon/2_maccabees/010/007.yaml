- from: 그러나 마카베오 자신이 무기를 먼저 들고, 그와 함께 위험을 무릅쓴 다른 이들을 격려하여 자기 형제들을 돕게 했습니다. 그들은 함께 또다시 열정적으로 돌격해 나갔습니다.[a][b]
  to: 그러나 마카베오 자신이 먼저 무기를 들고, 다른 사람들에게 그와 함께 위험을 무릅쓰며[a] 자기들의 형제들[b]을 도우라고 권했습니다. 그러자 그들은 모두 함께 기꺼이 돌진해 나갔습니다.
  rationale: 분사구를 ‘다른 사람들’이 권면받은 행동의 일부로 옮겨 원문의 통사 관계를 회복했습니다. 원문에 없는 ‘또다시’를 삭제하고, ὁμοῦ와 προθύμως를 ‘모두 함께’와 ‘기꺼이’로 충실하고 자연스럽게 반영했습니다. 각주 표지도 각각의 관련 어구에 연결했습니다.
