base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/007.yaml
  text: But Maccabeus himself was the first to take up arms[a], and he urged the others, by risking danger together with him, to come to the aid of their brothers[b]; and together they also charged out eagerly.
  footnotes:
  - marker: a
    text: Or, 'sharing the danger with him.' The Greek participle emphasizes that they were being urged to join him in risking themselves.
    reason: lexical_alternative
  - marker: b
    text: '''Their brothers'' can also mean their fellow Jews or compatriots in this context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 마카베오 자신이 먼저 무기를 들고, 다른 사람들에게 그와 함께 위험을 무릅쓰며[a] 자기들의 형제들[b]을 도우라고 권했습니다. 그러자 그들은 모두 함께 기꺼이 돌진해 나갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그와 함께 위험을 감수하며’. 그리스어 분사는 다른 사람들이 그와 함께 스스로 위험을 무릅쓰도록 권면받았음을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘형제들’은 이 문맥에서 동료 유대인이나 동족을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτος ... ὁ Μακκαβαῖος
  english_pob_choice: Maccabeus himself was the first
  chosen_korean: 마카베오 자신이 ... 먼저
  alternatives_korean:
  - 마카베오가 가장 먼저
  - 마카베오 자신이 선두에 서서
  lexicon: LSJ
  rationale: πρῶτος와 αὐτός가 결합해 마카베오가 다른 이들보다 앞서 행동했음을 강조하므로, 한국어에서도 ‘자신이 먼저’로 선도성을 살렸습니다.
- source_word: ἀναλαβὼν τὰ ὅπλα
  english_pob_choice: to take up arms
  chosen_korean: 무기를 먼저 들고
  alternatives_korean:
  - 무장을 하고
  - 무기를 집어 들고
  lexicon: LSJ
  rationale: τὰ ὅπλα는 직역하면 ‘무기들’이지만, 전투 문맥에서 ‘무기를 들다’가 자연스럽고, 추상화된 ‘무장하다’보다 원문의 동작감을 더 잘 드러냅니다.
- source_word: ἐπιβοηθεῖν τοῖς ἀδελφοῖς αὐτῶν
  english_pob_choice: to come to the aid of their brothers
  chosen_korean: 자기 형제들을 돕게
  alternatives_korean:
  - 그들의 형제들을 구원하게
  - 그들의 형제들에게 달려가 돕게
  lexicon: LSJ
  rationale: ἐπιβοηθεῖν은 ‘급히 와서 돕다’의 뜻이므로 단순한 ‘돕다’보다는 문맥상 충분히 긴박한 표현을 유지하되, 한국어 문장 흐름은 자연스럽게 정리했습니다.
- source_word: διακινδυνεύοντας
  english_pob_choice: by risking danger together with him
  chosen_korean: 그와 함께 위험을 무릅쓴
  alternatives_korean:
  - 그와 함께 위험을 감수한
  - 그와 함께 위험에 뛰어든
  lexicon: LSJ
  rationale: 분사구는 동시·상황을 나타내므로 ‘함께 위험을 무릅쓴’으로 옮겨, 그들이 스스로 위험을 감수하며 응답했다는 점을 살렸습니다.
- source_word: προθύμως ἐξώρμησαν
  english_pob_choice: together they also charged out eagerly
  chosen_korean: 함께 또다시 열정적으로 돌격해 나갔습니다
  alternatives_korean:
  - 함께 또한 기꺼이 달려 나갔습니다
  - 함께 열심히 뛰쳐나갔습니다
  lexicon: LSJ
  rationale: προθύμως는 ‘기꺼이/열정적으로’의 적극성을, ἐξώρμησαν은 전투적 ‘돌격’의 뉘앙스를 가지므로, 합쳐서 강한 행동성을 드러냈습니다.
theological_decisions:
- issue: ἀδελφοῖς의 공동체 지시 대상
  chosen_reading: ‘형제들’로 직역하되, 군사·민족적 문맥에서 같은 편 동료와 유대인 공동체를 가리키는 폭을 열어 둡니다.
  alternative_readings:
  - 동료 유대인
  - 동족
  rationale: 남성 복수형을 지우지 않고 원문 형태를 살리면서도, 이 문맥에서 혈연 형제만이 아니라 공동체 구성원을 포함할 수 있음을 한국어 표현에서 과도하게 좁히지 않도록 했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
