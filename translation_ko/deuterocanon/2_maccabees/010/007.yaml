  verdict: revise
  source_fidelity: 원문의 목적격 분사 διακινδυνεύοντας는 마카베오가 권면한 ‘다른 사람들’이 그와 함께 위험을 무릅쓰도록 권면받았음을 나타냅니다. 초안의 ‘그와 함께 위험을 무릅쓴 다른 이들’은 이를 이미 위험을 감수한 사람들을 수식하는 과거 사실처럼 처리하여 권면의 내용을 약화·변경합니다. 또한 καὶ를 ‘또다시’로 옮긴 것은 원문에 없는 반복의 뜻을 더합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘무기를 들고’, ‘위험을 무릅쓰며’, ‘도우라고 권했습니다’, ‘기꺼이 돌진해 나갔습니다’는 전투 문맥과 격식 있는 서술에 알맞습니다.
  terminology: ‘마카베오’, ‘무기’, ‘형제들’은 적절합니다. ‘형제들’은 원문의 ἀδελφοί를 보존하고, 각주에서 동료 유대인·동족이라는 문맥상 범위를 설명합니다. 각주 표지는 해당 어구 바로 뒤에 배치했습니다.
