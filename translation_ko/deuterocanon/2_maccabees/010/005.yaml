  - 베스추라에 다가갔는데
  lexicon: LSJ
  rationale: συνεγγίζω의 핵심은 '가까이 가다'이므로, 문맥상 자연한 '가까이 이르다'로 옮겼습니다.
- source_word: ἐρυμνῷ χωρίῳ
  english_pob_choice: a fortified place
  chosen_korean: 튼튼한 요새
  alternatives_korean:
  - 견고한 장소
  - 방어하기 좋은 곳
  - 요새화된 곳
  lexicon: LSJ
  rationale: ἐρυμνός의 방어적·요새적 의미를 살리기 위해, 현대 독자에게 즉시 이해되는 '튼튼한 요새'를 택했습니다.
- source_word: ὡσεὶ σχοίνους πέντε
  english_pob_choice: about five schoeni
  chosen_korean: 약 다섯 스코이노이
  alternatives_korean:
  - 약 다섯 스코이노스
  - 약 삼십 마일
  lexicon: LSJ
  rationale: σχοῖνος는 정확한 현대 환산이 문맥마다 달라지므로, 본문의 측정 단위를 그대로 음역해 오해를 피했습니다.
- source_word: τοῦτο ἔθλιβε
  english_pob_choice: he was pressing it hard
  chosen_korean: 그곳을 강하게 압박했습니다
  alternatives_korean:
  - 그곳을 포위했습니다
  - 그곳을 세게 압박했습니다
  - 그곳을 괴롭혔습니다
  lexicon: LSJ
  rationale: θλίβω는 문자적으로 '누르다/압박하다'이므로, 기술적 군사 용어로 좁히기보다 원문의 압박 이미지를 살려 번역했습니다.
theological_decisions:
- issue: 군사 서술에서의 θλίβω의 의미 범위
  chosen_reading: 기술적 '포위'로 단정하지 않고 '강하게 압박했다'로 옮겼습니다.
  alternative_readings:
  - 그는 그곳을 포위했습니다
  - 그는 그곳을 공세적으로 압박했습니다
  rationale: 본문은 실제로 '포위'를 뜻하는 전문어보다 더 일반적인 '누르다/압박하다'를 사용하므로, 과도한 전술적 구체화를 피했습니다.
  doctrine_reference: 원문 의미 보존 원칙
