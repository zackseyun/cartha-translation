  lexicon: LSJ
  rationale: 여기서는 지역명 Ἰουδαίαν을 자연스러운 현대 한국어 지리 표현인 "유대 땅"으로 옮겨, 군사 서사의 흐름을 살렸습니다.
- source_word: συνεγγίσας Βεθσουρῶν
  english_pob_choice: came near Bethsura
  chosen_korean: 베스추라에 가까이 이르렀는데
  alternatives_korean:
