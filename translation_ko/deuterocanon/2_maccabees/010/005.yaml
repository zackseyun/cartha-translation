  yaml_path: translation/deuterocanon/2_maccabees/010/005.yaml
  text: But when he entered Judea and came near Bethsura[a], a fortified place about five schoeni from Jerusalem[b], he was pressing it hard.
  footnotes:
  - marker: a
    text: A schoenus was an ancient unit of distance; the exact modern equivalent varied, so the Greek measure is retained rather than converted with false precision.
    reason: cultural_note
  - marker: b
    text: Or, 'he was besieging it.' The Greek says literally 'he was pressing it,' which can describe military pressure on a fortified place.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 유대 땅에 들어가 베스추라에 가까이 이르렀는데, 그곳은 튼튼한 요새였고 예루살렘에서 약 다섯 스코이노이 떨어져 있었습니다. 그는 그곳을 강하게 압박했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 스코이노스(schoenus)는 고대 거리 단위로, 정확한 현대 환산은 문맥에 따라 달라집니다.
    reason: cultural_note
  - marker: b
    text: 또는, '그는 그곳을 포위하고 있었습니다.' 그리스어는 문자적으로 '그곳을 압박하고 있었습니다'라고 하며, 이는 요새화된 곳에 대한 군사적 압박을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν δὲ εἰς τὴν Ἰουδαίαν
  english_pob_choice: when he entered Judea
  chosen_korean: 유대 땅에 들어가
  alternatives_korean:
