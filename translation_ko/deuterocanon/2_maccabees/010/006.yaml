  source_fidelity: 수정이 필요합니다. πολιορκοῦντα는 남성 단수 대격인 τὸν Μακκαβαῖον을 수식하므로, ‘마카바이오스가 그를 포위하고 있는 동안’으로 옮기는 것이 원문의 문법 관계를 보존합니다. 현 초안의 ‘그를 포위하고 있던 요새들’은 관계절이 요새들을 수식하는 구조가 되어, 요새들이 마카바이오스를 포위한다는 뜻으로 읽히며 원문과 맞지 않습니다. αὐτόν의 선행사는 이 절만으로 명시되지 않으므로 한국어에서도 ‘그’를 유지하고 각주로 밝히는 것이 안전합니다. 영어 감사본의 ‘it’ 해석은 원문의 남성 단수 대격을 한국어 번역의 근거로 삼기 어렵습니다.
  naturalness: ‘마카바이오스 곁에 있던 사람들’은 원문의 관용구를 지나치게 군사 조직으로 단정하지 않으면서 자연스럽습니다. 수정문은 긴 삽입절을 쉼표로 구분하여 현대 한국어 합쇼체 문장으로 읽히게 했습니다.
