translation:
  language: ko
  text: 그러므로 왕에게 제출되어야 했던 모든 일을 나는 분명히 밝혔고, 가능한 일은 왕이 허락하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 그리스어는 문맥에서 다소 갑작스러운 1인칭 편집자적 또는 서신체 결말처럼 읽힙니다(‘나는 분명히 밝혔다 … 왕이 허락하였다’). 번역은 스웨테 본문에 전해진 이 표현을 그대로 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: ὅσα μὲν οὖν
  english_pob_choice: So then, whatever
  chosen_korean: 그러므로 내가 드려야 할 것은 무엇이든지
  alternatives_korean:
  - 그리하여 내가 드려야 할 것은 무엇이든지
  - 이제 내가 드려야 할 것은 무엇이든지
  lexicon: LSJ
  rationale: οὖν의 추론·이어짐을 ‘그러므로’로 살리고, ὅσα의 포괄성을 ‘무엇이든지’로 자연스럽게 옮겼습니다.
- source_word: ἔδει
  english_pob_choice: had to be
  chosen_korean: 드려야 할
  alternatives_korean:
  - 반드시 드려야 할
  - 드릴 필요가 있던
  lexicon: BDAG
  rationale: 과거 시점의 필요·의무를 한국어 관용에 맞게 동사 어미로 압축해, 문맥의 행정적 보고 성격을 살렸습니다.
- source_word: προσενεχθῆναι διεσάφησα
  english_pob_choice: I have made clear ... be presented
  chosen_korean: 분명히 밝혔고
  alternatives_korean:
  - 분명히 설명했고
  - 제시해야 할 것을 분명히 했고
  lexicon: LSJ
  rationale: ‘왕에게 드려야 할 것’을 ‘분명히 밝혔다’로 묶어, προσενεχθῆναι와 διεσάφησα의 보고·설명 흐름을 한국어에서 과도하게 중복하지 않도록 했습니다.
- source_word: ἃ δὲ ἦν ἐνδεχόμενα συνεχώρησεν
  english_pob_choice: what was possible ... he granted
  chosen_korean: 가능한 것은 그가 허락하였습니다
  alternatives_korean:
  - 가능한 것들은 그가 허락하였습니다
  - 실행 가능한 것은 그가 허락하였습니다
  lexicon: LSJ
  rationale: ἐνδεχόμενα를 ‘가능한 것’으로, συνεχώρησεν을 권한자의 응답에 어울리는 ‘허락하다’로 옮겨 행정적 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 1인칭 화자의 abrupt한 전환과 편집적 종결감
  chosen_reading: ‘내가’와 완료적 진술을 그대로 살려, 본문 전승이 보여 주는 갑작스러운 1인칭 종결감을 유지했습니다.
  alternative_readings:
  - 문맥상 익명 서술로 완화하기
  - 3인칭으로 매끈하게 재구성하기
  rationale: 영어 POB가 주석으로 지적한 대로, 그리스어는 다소 급작스러운 1인칭 편집/서신 결말처럼 읽히므로, 매끈하게 평탄화하지 않고 전달했습니다.
  doctrine_reference: 텍스트비평/서술 관찰
- issue: τῷ βασιλεῖ의 방향성
  chosen_reading: ‘왕에게’로 직역해 보고 대상의 방향을 유지했습니다.
  alternative_readings:
  - 왕 앞에
  - 왕을 위해
  rationale: 본절은 왕에게 제출·보고하는 행정적 문맥이므로, 대상 방향을 분명히 하는 것이 source-direct합니다.
  doctrine_reference: 서술 문맥
