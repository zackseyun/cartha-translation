- source_word: ὑπάρξει δεξιὰ μετὰ τῆς ἀδείας
  english_pob_choice: there will be a right hand given with safe-conduct
  chosen_korean: 안전한 통행과 함께 오른손이 주어질 것입니다
  alternatives_korean:
  - 통행 허가와 함께 오른손이 주어질 것입니다
  - 안전 통행 보장과 함께 오른손이 주어질 것입니다
  lexicon: LSJ
  rationale: δεξιὰ는 직역하면 ‘오른손’이지만 외교적 맥락에서는 우호의 보증이나 통행 보장을 뜻할 수 있어, 본문을 훼손하지 않으면서 ἀδεία의 의미를 함께 살렸습니다.
theological_decisions:
- issue: δεξιὰ와 ἀδεία의 결합이 지시하는 외교적 의미
  chosen_reading: ‘오른손’은 단순한 신체 부위가 아니라 안전한 통행을 보장하는 우호/보증의 표지로 이해했습니다.
  alternative_readings:
  - 직역하여 ‘오른손이 있을 것입니다’
  - ‘용서/허가가 있을 것입니다’로만 처리
  rationale: 이 구절은 짧고 축약적이어서 문자적 표현을 유지하되, 문맥상 안전 통행의 보증이라는 의미를 드러내는 편이 독자가 원문 의도를 이해하는 데 더 도움이 됩니다.
  doctrine_reference: 외교적 관용구 해석
- issue: 샨티코스월의 음역 유지
  chosen_reading: 역사적 맥락을 보존하기 위해 현대 달력으로 환산하지 않고 음역했습니다.
  alternative_readings:
  - 4월 30일까지
  - 현대식 날짜로 의역
  rationale: 헬라스-마케도니아 달명은 본문의 시대적 배경에 속하므로, 번역에서 현대 달력으로 치환하면 원문의 문화적 층위가 약화됩니다.
  doctrine_reference: 역사-문화 보존 원칙
