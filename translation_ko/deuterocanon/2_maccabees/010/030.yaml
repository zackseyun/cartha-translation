translation:
  language: ko
  text: 그러므로 크산티코스월[a] 30일까지 내려가는[b] 이들에게는, 오른손을 내밀어 주는 보증과 통행 허가가 있을 것입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 크산티코스는 헬레니즘 시대의 연대 표기에 쓰인 마케도니아 달 이름입니다.
    reason: cultural_note
  - marker: b
    text: 그리스어는 문자적으로 ‘내려가는’이라고 합니다. 문맥에 따라 ‘떠나는’, ‘출발하는’, 또는 ‘계속 이동하는’이라는 뜻일 수도 있습니다.
    reason: alternative_reading
  - marker: c
    text: 직역하면 ‘허가와 함께 오른손이 있을 것이다’라는 축약된 표현입니다. ‘오른손’은 서약이나 보증을 가리킬 수 있고, ‘허가’는 문맥상 통행의 허가 또는 안전한 통행의 보장을 뜻할 수 있습니다.
    reason: lexical_alternative
