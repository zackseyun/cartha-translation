translation:
  language: ko
  text: 그러므로, 샨티코스월 서른째 날까지 내려가는 사람들에게는 안전한 통행과 함께 오른손이 주어질 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ξανθικός는 헬라스 시대에 쓰인 마케도니아 달 이름입니다.
    reason: cultural_note
  - marker: b
    text: 이 구절의 헬라스어는 매우 압축되어 있어, ‘내려가는’은 ‘떠나는’ 또는 ‘출발하는’으로 이해될 수도 있습니다.
    reason: alternative_reading
  - marker: c
    text: 직역하면 ‘오른손이 허가와 함께 있을 것이다’라는 식의 매우 간결한 표현으로, 안전한 통행을 보장하는 외교적 관용구로 보입니다.
    reason: lexical_alternative
