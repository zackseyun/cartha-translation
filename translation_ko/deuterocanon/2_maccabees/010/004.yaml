  lexicon: LSJ
  rationale: οὐδάμως의 강한 부정을 한국어 부사 ‘전혀’로 살리고, ἐπιλογίζομαι의 반성적 ‘계산/고려’ 의미는 문맥상 ‘헤아리다’로 자연스럽게 옮겼습니다.
- source_word: τὸ τοῦ θεοῦ κράτος
  english_pob_choice: the might of God
  chosen_korean: 하나님의 능력
  alternatives_korean:
  - 하나님의 힘
  - 하나님의 위력
  lexicon: LSJ
  rationale: κράτος는 여기서 추상적 주권보다 전투 상황의 실제적 힘을 가리키므로 ‘능력’이 가장 무난하며, 한국어에서 자연스럽게 대비가 살아납니다.
- source_word: πεφρονηματισμένος
  english_pob_choice: puffed up
  chosen_korean: 마음이 부풀어 있었습니다
  alternatives_korean:
  - 교만해져 있었습니다
  - 우쭐해 있었습니다
  - 자만에 차 있었습니다
  lexicon: LSJ
  rationale: 완료 분사의 지속 상태를 살리면서, 자기 과신으로 부풀어진 심리 상태를 직역보다 덜 경직되게 드러내는 표현을 택했습니다.
- source_word: μυριάσιν τῶν πεζῶν καὶ ταῖς χιλιάσι τῶν ἱππέων
  english_pob_choice: the tens of thousands of foot soldiers, the thousands of horsemen
  chosen_korean: 보병 수만과 기병 수천
  alternatives_korean:
  - 보병 수만 명과 기병 수천 명
  - 보병 만군과 기병 천군
  lexicon: LSJ
  rationale: 숫자 표현의 병렬 구조를 살리되, 군사 단위가 한국어에서 자연스럽게 읽히도록 ‘수만/수천’으로 옮겼습니다.
- source_word: τοῖς ἐλέφασιν τοῖς ὀγδοήκοντα
  english_pob_choice: the eighty elephants
  chosen_korean: 여든 마리의 코끼리
  alternatives_korean:
  - 코끼리 여든 마리
  - 여든 코끼리
  lexicon: LSJ
  rationale: 전쟁용 동물 수량은 한국어에서 ‘마리’가 가장 자연스러우며, ‘여든’은 원문의 명시적 수를 그대로 반영합니다.
theological_decisions:
- issue: 하나님의 κράτος를 ‘능력’으로 옮길지 ‘권세/통치’로 옮길지
  chosen_reading: ‘능력’으로 옮겨, 인간 군사력과 직접 대비되는 전투적 힘을 강조했습니다.
  alternative_readings:
  - 하나님의 권세
  - 하나님의 통치
  rationale: 본문의 초점은 하나님의 통치론이 아니라 전장 상황에서 인간이 계산에 넣지 않은 실제적 힘이므로, 문맥상 ‘능력’이 가장 정확합니다.
