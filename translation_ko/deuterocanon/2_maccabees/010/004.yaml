  revision_rationale: 교만의 상태를 나타내는 완료 분사와 병력 열거의 여격 관계를 ‘…로 인해 교만해져 있었습니다’로 명확히 했습니다. ‘전혀’, ‘하나님의 능력’, ‘수만 명/수천 명’, ‘여든 마리’는 원문의 강조, 군사력 대비, 수적 병렬을 유지합니다. 각주도 한국어에서 자연스러운 어휘 대안으로 다듬었습니다.
