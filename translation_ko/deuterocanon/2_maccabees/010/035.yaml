lexical_decisions:
- source_word: ὑπὲρ ὧν
  english_pob_choice: Concerning the matters that
  chosen_korean: …에 대하여
  alternatives_korean:
  - …에 관하여
  - …에 대해
  lexicon: LSJ
  rationale: 여기서 ὑπέρ는 대상을 가리키는 전치사 용법이므로, 한국어에서는 주제 표지인 ‘…에 대하여’로 옮겨 문서·서신체의 공문적 뉘앙스를 살렸습니다.
- source_word: ὁ συγγενὴς τοῦ βασιλέως
