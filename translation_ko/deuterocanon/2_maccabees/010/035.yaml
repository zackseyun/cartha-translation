lexical_decisions:
- source_word: ὑπὲρ ὧν
  english_pob_choice: Concerning the matters that
  chosen_korean: …에 대하여
  alternatives_korean:
  - …에 관하여
  - …에 대해
  lexicon: LSJ
  rationale: 여기서 ὑπέρ는 대상을 가리키는 전치사 용법이므로, 한국어에서는 주제 표지인 ‘…에 대하여’로 옮겨 문서·서신체의 공문적 뉘앙스를 살렸습니다.
- source_word: ὁ συγγενὴς τοῦ βασιλέως
  english_pob_choice: the king’s kinsman
  chosen_korean: 왕의 친족
  alternatives_korean:
  - 왕의 친척
  - 왕의 일가
  lexicon: LSJ
  rationale: συγγενής는 혈연적 관계를 나타내며, ‘친족’이 ‘relative’보다 더 공식적이고 정치적 맥락의 친연성을 잘 드러냅니다.
- source_word: συνευδοκοῦμεν
  english_pob_choice: we also approve
  chosen_korean: 우리도 또한 승인합니다
  alternatives_korean:
  - 우리도 또한 동의합니다
  - 우리도 또한 찬성합니다
  lexicon: LSJ
  rationale: συνευδοκέω는 단순한 감정적 동조보다 공식적 승인·동의를 뜻하므로, 서신 맥락에 맞게 ‘승인합니다’로 옮겼습니다.
