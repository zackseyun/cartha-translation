- from: 그러나 이 일들에 관해서는 자세히 말씀드리자면, 나는 이 사람들과 내 쪽 사람들 모두에게 여러분과 말하게 하였습니다.[a][b]
  to: 그러나 이 일들에 관해서는 자세히[a], 나는 이 사람들과 내게서 온 사람들[b] 모두에게 여러분과 이야기하도록 지시하였습니다.
