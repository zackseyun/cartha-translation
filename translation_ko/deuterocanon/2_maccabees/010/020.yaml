  - 하나하나
  - 구체적으로
  lexicon: BDAG
  rationale: 관용구는 항목별로 또는 세부적으로 다룬다는 뜻이므로, 한국어에서는 '자세히'가 가장 자연스럽게 그 의미를 전달합니다.
- source_word: ἐντέταλμαι
  english_pob_choice: I have instructed
  chosen_korean: 나는 … 말씀드리자면
  alternatives_korean:
  - 나는 … 지시하였습니다
  - 나는 … 명령하였습니다
  - 나는 … 일러두었습니다
  lexicon: BDAG
  rationale: 완료형은 이미 내려진 지시가 현재까지 유효함을 보이므로, 문맥의 격식을 살리면서도 한국어에서는 뒤의 부정사구를 자연스럽게 풀어 '말씀드리자면'으로 처리했습니다.
- source_word: τοὺς παρʼ ἐμοῦ
  english_pob_choice: those from me
  chosen_korean: 내 쪽 사람들
  alternatives_korean:
  - 내게서 온 사람들
  - 내 사람들
  - 내가 보낸 사람들
  lexicon: BDAG
  rationale: 직역은 '내게서 온'이지만, 여기서는 화자를 대리하는 인물들을 가리키는 말이므로 한국어에서는 관계를 드러내는 '내 쪽 사람들'로 옮겼습니다.
