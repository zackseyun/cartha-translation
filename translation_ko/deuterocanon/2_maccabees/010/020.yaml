  - 그런데 이 일들에 관하여
  lexicon: BDAG
  rationale: ὑπέρ + 대격은 여기서 주제 제시의 용법으로 읽히므로, 논점을 밝히는 '관해서는'이 자연스럽고 원문 기능을 잘 드러냅니다.
- source_word: κατὰ μέρος
  english_pob_choice: in detail
  chosen_korean: 자세히
  alternatives_korean:
