  - 나는 이 사람들과 내 쪽 사람들 모두에게 여러분과 이야기하게 하였습니다.
  rationale: 이 구절은 신학적 쟁점보다 서신적 보고 문체가 핵심이므로, 원문의 완결된 지시와 그 효력을 자연스러운 한국어로 전달하는 데 중점을 두었습니다.
