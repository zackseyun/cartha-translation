  source_fidelity: 원문의 핵심 동사 ἐντέταλμαι는 ‘지시하였다/명하였다’라는 완료된 지시를 뜻합니다. 초안의 ‘자세히 말씀드리자면’은 이 동사를 화자가 직접 설명하는 말로 바꾸어, 원문의 통사와 의미를 크게 벗어납니다. 또한 ‘말하게 하였습니다’보다 ‘말하도록 지시하였습니다’가 ἐντέταλμαι와 부정사 διαλεχθῆναι의 관계를 정확히 드러냅니다.
  naturalness: ‘그러나 이 일들에 관해서는 자세히’와 ‘여러분과 이야기하도록 지시하였습니다’는 현대 표준 한국어의 격식 있는 합쇼체로 자연스럽습니다. ‘내 쪽 사람들’은 다소 구어적이고 소속 관계를 불필요하게 흐리므로 ‘내게서 온 사람들’이 더 적절합니다.
  terminology: κατὰ μέρος는 ‘자세히’로, τοὺς παρʼ ἐμοῦ는 해석을 과도하게 보태지 않은 ‘내게서 온 사람들’로 옮깁니다. ‘대표자’나 ‘내가 보낸 사람들’은 문맥상 가능한 이해이나 본문에는 명시되지 않았으므로 각주에서만 가능성을 설명합니다.
