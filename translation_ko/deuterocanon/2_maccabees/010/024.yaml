    reason: ‘헬라 풍습으로 바꾼 것’은 문화적 전환을 풀어 쓴 번역이며, 원문의 압축된 표현에 다른 번역 가능성이 있습니다.
  - marker: b
    text: 또는 ‘그들의 법규가 그들에게 허용되기를’ 또는 ‘그들의 조상 전통과 관습을 지킬 수 있게 해 달라고’.
