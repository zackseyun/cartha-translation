  rationale: 본문의 긴장점은 문화적 동화에 대한 거부와 자기 전통의 유지이므로, 이를 약화시키지 않도록 대비 구조를 유지했습니다.
  doctrine_reference: 2 Maccabees의 역사적-정체성 서술
- issue: τὰ νόμιμα의 범위
  chosen_reading: ‘법’으로 옮겨, 단순한 개인 취향이 아니라 공동체적·종교적 규범을 가리키는 점을 살렸습니다.
  alternative_readings:
