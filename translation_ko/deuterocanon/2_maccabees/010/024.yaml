  source_fidelity: ‘자기 아버지’는 유대인들이 각자의 아버지를 가리키는 듯하게 읽히므로, 문맥상 통치자의 아버지를 가리키는 그리스어 τοῦ πατρὸς를 충실히 전달하지 못합니다. 또한 ‘헬라식 변화’는 무엇이 변화했는지가 불분명합니다. ‘그의 아버지가 헬라 풍습으로 바꾼 것’은 문화적 전환의 대상과 소유 관계를 더 분명히 합니다. τὰ νόμιμα는 단순한 개인적 ‘법’보다 공동체의 법규·관습을 포괄하지만, 본문에서는 ‘법규’로 자연스럽게 보존할 수 있습니다.
