    text: 그리스어 συλλύεσθαι는 이 본문 전승에서 어휘적으로나 본문상으로 어려운 표현입니다. 여기서는 ‘합의에 이르다’ 또는 ‘화해하다’라는 뜻으로 이해했습니다.
    reason: textual_variant
