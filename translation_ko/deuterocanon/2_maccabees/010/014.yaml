  naturalness: 수정안은 현대 표준 한국어의 합쇼체로 자연스럽게 읽히며, 본문의 대명사 선행사가 문맥상 분명하지 않은 점은 ‘그’로 유지합니다. ‘왕 자신’은 마지막 절의 대상이 왕임을 자연스럽게 밝혀 줍니다.
  terminology: δικαίοις는 특정 ‘요구’로 한정하지 않고 ‘정당한 사안’으로 옮겨 본문의 범위를 보존했습니다. φίλος는 정치적 우호를 포함할 수 있으나 본문 표현대로 ‘친구’로 번역하고 주석에서 그 뉘앙스를 설명합니다.
