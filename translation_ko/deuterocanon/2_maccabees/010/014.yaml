  text: 그는 그를 설득하여 모든 정당한 사안에 관하여 합의에 이르게 하고, 또한 왕을 설득하여 왕 자신이 그들의 친구가 되도록 강요하겠다고 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
