translation:
  language: ko
  text: 메나라우스는 우리에게 알려 주었습니다. 그는 여러분이 내려간 뒤에 자기네 사람들과 합류하기를 바랐습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 표현은 압축되어 있어 문맥상 ‘자기편으로 들어가다’, ‘자기 사람들과 함께하다’ 또는 ‘자기네 사람들에게 돌아가다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 전승된 그리스어는 이 절에서 통사적으로 다소 어렵기 때문에, 이 번역은 Swete 본문의 평이한 뜻을 따르되 불확실성을 남겨 두었습니다.
    reason: textual_variant
