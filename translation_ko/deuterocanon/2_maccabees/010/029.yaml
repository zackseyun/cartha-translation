theological_decisions:
- issue: γίνεσθαι πρὸς τοὺς ἰδίους의 정치·관계적 뉘앙스
  chosen_reading: ‘자기네 사람들과 합류하다’로 옮겨, 단순한 공간 이동이 아니라 소속 편의 변경 또는 귀속을 드러냈습니다.
  alternative_readings:
  - ‘자기편으로 들어가다’
  - ‘자기 사람들과 함께하다’
  - ‘자기네 편으로 돌아가다’
  rationale: 본문의 압축된 표현은 정치적 충성/소속의 문제를 내포할 수 있으므로, ‘돌아가다’보다 더 직접적인 소속 회복의 가능성을 남기면서도 과도한 해석을 덧붙이지 않았습니다.
