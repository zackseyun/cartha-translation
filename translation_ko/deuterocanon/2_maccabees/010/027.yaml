- from: 그런데 왕의 서신은 이 민족에게 다음과 같이 적혀 있었습니다. “안티오코스 왕이 유다인의 장로회와 다른 유다인들에게 문안합니다.”[a][b]
  to: 그 민족에게 보낸 왕의 편지는 다음과 같았습니다. “안티오코스 왕이 유다인들의 원로 회의[b]와 그 밖의 유다인들[a]에게 문안합니다.”
  rationale: 원문의 문장 구조를 따라 편지의 수신 대상과 인용 도입을 명료하게 했습니다. γερουσία는 교단적 함의가 적은 ‘원로 회의’로 번역하고, 두 각주를 해당 어구에 직접 연결했습니다. 인사말은 서신 서두의 관용 표현인 χαίρειν의 기능을 살려 ‘문안합니다’로 유지했습니다.
