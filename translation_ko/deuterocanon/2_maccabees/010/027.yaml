  source_fidelity: 초안은 왕의 편지가 유다 민족에게 보내졌고, 수신자가 유다인의 γερουσία와 그 밖의 유다인들이며 인사말이 따른다는 원문의 핵심을 대체로 충실히 전달합니다. 그러나 ‘이 민족에게 다음과 같이 적혀 있었습니다’는 Πρὸς δὲ τὸ ἔθνος와 τοιαύδε ἦν의 관계를 한국어에서 다소 부자연스럽고 불명확하게 만들므로, ‘그 민족에게 보낸 왕의 편지는 다음과 같았습니다’로 바로잡는 것이 안전합니다.
  naturalness: ‘그 민족에게 보낸 왕의 편지는 다음과 같았습니다’는 현대 한국어의 문서 인용 도입으로 자연스럽습니다. 서신 머리말의 χαίρειν은 ‘문안합니다’로 유지할 수 있으며, 공식적 인사말이라는 기능을 잘 살립니다.
  terminology: γερουσία를 ‘장로회’로 번역하면 현대 한국 교회의 특정 제도명으로 연상될 가능성이 있습니다. 원문의 공적 원로 기구라는 뜻을 더 중립적으로 드러내도록 ‘원로 회의’로 고쳤습니다. τοῖς ἄλλοις Ἰουδαίοις는 앞의 원로 회의와 구별되는 수신자라는 뜻을 살려 ‘그 밖의 유다인들’로 옮겼습니다.
