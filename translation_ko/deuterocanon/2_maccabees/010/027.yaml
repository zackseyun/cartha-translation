  text: 'And to the nation the king’s letter was as follows: “King Antiochus to the council of elders of the Jews and to the other Jews[b][a], greetings.”'
  footnotes:
  - marker: a
    text: Or 'the rest of the Jews' for 'the other Jews.'
    reason: lexical_alternative
  - marker: b
    text: Greek γερουσία refers to an official body of elders; 'council of elders' is used here rather than simply transliterating the term.
    reason: cultural_note
translation:
  language: ko
  text: 그런데 왕의 서신은 이 민족에게 다음과 같이 적혀 있었습니다. “안티오코스 왕이 유다인의 장로회와 다른 유다인들에게 문안합니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다른 유다인들’은 ‘유다인들의 나머지’ 또는 ‘나머지 유다인들’의 뜻으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 γερουσία는 원로들로 이루어진 공식 기구를 가리키므로, 여기서는 음역보다 ‘장로회’로 옮겼습니다.
    reason: cultural_note
