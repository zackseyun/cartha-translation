  text: 'And to the nation the king’s letter was as follows: “King Antiochus to the council of elders of the Jews and to the other Jews[b][a], greetings.”'
  footnotes:
  - marker: a
    text: Or 'the rest of the Jews' for 'the other Jews.'
    reason: lexical_alternative
  - marker: b
    text: Greek γερουσία refers to an official body of elders; 'council of elders' is used here rather than simply transliterating the term.
    reason: cultural_note
translation:
  language: ko
  text: 그 민족에게 보낸 왕의 편지는 다음과 같았습니다. “안티오코스 왕이 유다인들의 원로 회의[b]와 그 밖의 유다인들[a]에게 문안합니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 밖의 유다인들’은 ‘유다인들의 나머지’ 또는 ‘나머지 유다인들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 γερουσία는 원로들로 이루어진 공식 기구를 가리킵니다. 여기서는 음역하지 않고 ‘원로 회의’로 옮겼습니다.
    reason: cultural_note
