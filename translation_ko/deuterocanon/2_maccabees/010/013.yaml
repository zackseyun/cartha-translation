  text: But since he was not foolish[a], but was considering within himself the defeat that had happened to him, and had realized that the Hebrews were unconquerable because the mighty God was fighting alongside them[b], he sent ahead
  footnotes:
  - marker: a
    text: Or 'the Jews were invincible.' The Greek here uses 'Hebrews' (Ἑβραίους), which this translation preserves.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the God who is able' or 'the powerful God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그는 어리석은 사람이 아니었으므로, 자신에게 일어난 패배를 속으로 따져 보고, 히브리인들이 힘 있는 하나님께서 그들과 함께 싸우고 계시므로 정복할 수 없다는 것을 깨닫고, 미리 사람들을 보냈습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 Ἑβραίους(히브리인들)를 사용합니다. 영어 POB도 이 어휘를 보존했습니다.
    reason: source_note
  - marker: b
    text: 토우 다이난메누우 테우(τοῦ δυναμένου θεοῦ)는 문자적으로는 '능력 있는 하나님' 또는 '할 수 있는 하나님'의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἀνόους δὲ ὑπάρχων
  english_pob_choice: But since he was not foolish
  chosen_korean: 그는 어리석은 사람이 아니었으므로
  alternatives_korean:
  - 그는 무지한 사람이 아니었으므로
  - 그는 분별이 없는 사람이 아니었으므로
  lexicon: LSJ
  rationale: ἀνόους는 분별이나 이해가 없는 상태를 가리키므로, 한국어로는 자연스럽게 '어리석은 사람이 아니었으므로'로 옮겨 부정의 완곡한 뉘앙스를 살렸습니다.
- source_word: πρὸς ἑαυτὸν ἀντιβάλλων
  english_pob_choice: was considering within himself
  chosen_korean: 속으로 따져 보고
  alternatives_korean:
  - 자기 자신과 맞대어 생각하며
  - 마음속으로 생각하며
  lexicon: LSJ
  rationale: 반사적·숙고적 뉘앙스를 살리기 위해 단순한 '생각하다'보다 판단하며 헤아리는 동작을 드러내는 표현을 선택했습니다.
- source_word: τὸ γεγονὸς περὶ αὐτὸν ἐλάττωμα
  english_pob_choice: the setback that had happened to him
  chosen_korean: 자신에게 일어난 패배
  alternatives_korean:
  - 자신에게 닥친 손실
  - 자신에게 일어난 불리함
  lexicon: LSJ
  rationale: 전투 맥락에서 ἐλάττωμα는 단순한 일반 손실보다 실제 패전을 가리키는 쪽이 더 분명하므로, 문맥을 따라 '패배'로 옮겼습니다.
- source_word: τοὺς Ἑβραίους
  english_pob_choice: the Hebrews
  chosen_korean: 히브리인들
  alternatives_korean:
  - 유대인들
  - 히브리 사람들
  lexicon: LSJ
  rationale: 원문이 Ἑβραίους를 사용하므로, 영어 POB의 본문 선택을 따라 '히브리인들'로 보존했습니다.
- source_word: τοῦ δυναμένου θεοῦ συμμαχοῦντος αὐτοῖς
  english_pob_choice: because the mighty God was fighting alongside them
  chosen_korean: 힘 있는 하나님께서 그들과 함께 싸우고 계시므로
  alternatives_korean:
  - 전능하신 하나님께서 그들의 편이시므로
  - 능력 있는 하나님께서 그들을 돕고 계시므로
  lexicon: LSJ
  rationale: τοῦ δυναμένου θεοῦ의 능력/가능성을 한국어에서 '힘 있는 하나님'으로 간결하게 반영하고, συμμαχοῦντος는 단순 도움보다 전투적 동맹의 뜻이 강하므로 '함께 싸우고 계시므로'로 옮겼습니다.
- source_word: προαποστείλας
  english_pob_choice: he sent ahead
  chosen_korean: 미리 사람들을 보냈습니다
  alternatives_korean:
  - 앞서 보냈습니다
  - 미리 파견했습니다
  lexicon: LSJ
  rationale: 동사의 핵심은 다음 행동에 앞서 먼저 보내는 것이라, 한국어에서는 자연스러운 서술로 풀어 '미리 사람들을 보냈습니다'로 처리했습니다.
theological_decisions:
- issue: Ἑβραίους의 민족명 보존
  chosen_reading: 본문의 Ἑβραίους를 따라 '히브리인들'로 유지했습니다.
  alternative_readings:
  - 유대인들
  - 유다 사람들
  rationale: 원문이 실제로 '히브리인들'을 사용하므로, 익숙한 교회 용어로 평준화하지 않고 소스 투명성을 유지했습니다.
  doctrine_reference: Translation philosophy 1, 5
- issue: 하나님의 전투적 동행
  chosen_reading: 하나님이 '그들과 함께 싸우고 계시므로'로 옮겨, 군사적 개입의 강한 표현을 유지했습니다.
  alternative_readings:
  - 그들을 돕고 계시므로
  - 그들의 편에 계시므로
  rationale: 문맥상 하나님은 단순한 지원자가 아니라 실제로 함께 싸우시는 분으로 제시되므로, 이를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: Translation philosophy 1, 3
