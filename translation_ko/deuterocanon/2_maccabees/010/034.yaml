  text: 'The Romans also sent them a letter[a], worded as follows: “Quintus Memmius and Titus Manius, elders of the Romans, to the people of the Jews[b], greetings.”'
  footnotes:
  - marker: a
    text: Or, “to the Jewish people.” The Greek literally reads “to the people of the Jews.”
    reason: lexical_alternative
  - marker: b
    text: The phrase “elders of the Romans” could refer more specifically to Roman envoys or senators, but the Greek term itself is simply “elders.”
    reason: lexical_alternative
translation:
  language: ko
  text: 로마 사람들도 그들에게 편지[a]를 보내었는데, 그 내용은 이러했습니다. 「로마인의 장로들인 퀸투스 멤미우스와 티투스 마니우스가 유대인의 백성에게 문안합니다[b].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “유대인의 백성에게.” 그리스어는 문자적으로는 “유대인들의 백성에게”라고 읽습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘로마인의 장로들’은 보다 구체적으로 로마의 사절이나 원로원을 가리킬 수도 있지만, 그리스어 자체는 단지 ‘장로들’이라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπέμψαν ... ἐπιστολήν
  english_pob_choice: sent them a letter
  chosen_korean: 그들에게 편지[a]를 보내었는데
  alternatives_korean:
  - 그들에게 서한을 보냈는데
  - 그들에게 공문을 보냈는데
  lexicon: LSJ
  rationale: ἐπιστολήν은 기본적으로 ‘편지’이므로 이를 살리되, 문맥상 공식 서신의 성격이 있어도 본문에는 과도한 특정화 없이 자연스럽게 옮겼습니다.
- source_word: ἔχουσαν οὕτως
  english_pob_choice: worded as follows
  chosen_korean: 그 내용은 이러했습니다
