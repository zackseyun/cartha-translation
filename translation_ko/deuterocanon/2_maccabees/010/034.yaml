  - 다음과 같이 되어 있었습니다
  lexicon: LSJ
  rationale: 편지의 서두에 들어가는 정형 표현이므로, 내용 도입 기능을 드러내는 현대 한국어로 옮겼습니다.
- source_word: πρεσβυταὶ Ῥωμαίων
  english_pob_choice: elders of the Romans
  chosen_korean: 로마인의 장로들
  alternatives_korean:
  - 로마의 장로들
  - 로마인들의 장로들
  - 로마 원로들
  lexicon: LSJ
  rationale: πρεσβυταί의 직역은 ‘장로들’이며, POB의 영어 선택도 ‘elders’이므로 이를 따라가되, 정치적 함의를 단정하는 ‘원로’는 피했습니다.
- source_word: τῷ δήμῳ τῶν Ἰουδαίων
  english_pob_choice: to the people of the Jews
  chosen_korean: 유대인의 백성에게
  alternatives_korean:
  - 유대 민족에게
  - 유대인의 사람들에게
  - 유대 백성에게
  lexicon: LSJ
  rationale: δήμος는 단순 집단보다 공적 ‘백성/민중’의 뉘앙스가 있어, POB의 ‘people of the Jews’를 살려 ‘유대인의 백성’으로 옮겼습니다.
- source_word: χαίρειν
  english_pob_choice: greetings
  chosen_korean: 문안합니다
  alternatives_korean:
  - 인사합니다
  - 평안을 빕니다
  - 안부를 전합니다
  lexicon: LSJ
  rationale: 서신 서두의 인사말로서 ‘greetings’의 기능을 자연스럽게 살리면서도, 현대 한국어에서 공문/서한체에 어울리는 표현을 택했습니다.
theological_decisions:
- issue: 로마 대표자 호칭의 범위
  chosen_reading: ‘장로들’로 직역해 로마 공식 대표의 직함을 추정 이상으로 특정하지 않았습니다.
  alternative_readings:
  - ‘원로들’로 정치적 뉘앙스를 강하게 드러내는 읽기
  - ‘사절들’로 기능을 해석해 옮기는 읽기
  rationale: 본문 자체는 πρεσβυταί만 말하므로, 정치적 직함을 단정하지 않고 POB의 투명성을 유지했습니다.
  doctrine_reference: source transparency / lexical restraint
