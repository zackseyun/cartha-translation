  lexicon: LSJ; BDAG
  rationale: αὐτόθι와 ὄντων의 결합은 단순 위치보다 배경 상황을 드러내므로, 한국어에서는 자연스러운 시간-장소 결합 표현으로 옮겼습니다.
- source_word: προηγούμενος αὐτῶν
  english_pob_choice: going before them
