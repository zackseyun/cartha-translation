translation:
  language: ko
  text: 그들이 바로 예루살렘 가까이에 있을 때, 앞서 가는 말탄 사람이 나타났는데, 그는 흰 옷을 입고 황금 갑옷을 휘두르고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들보다 앞서’이기도 하며, 문맥에 따라 ‘인도하면서’의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그 말탄 사람의 정체는 본문에서 명시되지 않습니다. 천사적 또는 하늘의 존재로 읽을 가능성은 있지만, 본문 자체는 단정하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτόθι δὲ πρὸς τοῖς Ἱεροσολύμοις ὄντων
  english_pob_choice: And while they were there near Jerusalem
  chosen_korean: “그들이 바로 예루살렘 가까이에 있을 때”
