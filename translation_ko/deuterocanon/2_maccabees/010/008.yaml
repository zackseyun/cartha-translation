  text: And while they were there near Jerusalem[a], a horseman appeared, going before them[b], clothed in white and brandishing golden armor.
  footnotes:
  - marker: a
    text: Or 'preceding them' for 'going before them.' The Greek participle can denote simply being ahead of them, though in context it may also imply guidance.
