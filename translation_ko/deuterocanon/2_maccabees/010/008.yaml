  rationale: ἐσθῆτι는 구체적 옷의 종류보다 복장을 가리키므로, ‘흰 옷을 입고’가 직역성과 자연성을 함께 지닙니다.
- source_word: πανοπλίαν χρυσῆν κραδαίνων
  english_pob_choice: brandishing golden armor
  chosen_korean: “황금 갑옷을 휘두르고 있었습니다”
  alternatives_korean:
