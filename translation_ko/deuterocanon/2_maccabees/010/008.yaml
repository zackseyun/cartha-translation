  text: 그들이 그곳, 예루살렘 가까이에 있을 때[a], 그들보다 앞서 가는 말 탄 사람이 나타났습니다[b]. 그는 흰 옷을 입고 황금 갑주를 휘두르고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예루살렘에/예루살렘 곁에’. 그리스어 전치사는 여기서 예루살렘과 가까운 위치를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 그 말 탄 사람의 정체는 본문에서 명시되지 않습니다. 천사적 또는 하늘의 존재로 읽을 가능성은 있지만, 본문 자체는 단정하지 않습니다.
    reason: alternative_reading
