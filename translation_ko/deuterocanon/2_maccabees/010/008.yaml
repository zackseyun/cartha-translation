  lexicon: LSJ
  rationale: 문맥상 특정 신분보다 ‘말에 탄 존재’의 시각적 인상을 전달하는 것이 중요하므로, 현대 한국어에서 가장 자연스러운 ‘말탄 사람’으로 표현했습니다.
- source_word: ἐν λευκῇ ἐσθῆτι
  english_pob_choice: clothed in white
  chosen_korean: “흰 옷을 입고”
  alternatives_korean:
  - “흰 의복을 입고”
  - “하얀 옷차림으로”
  lexicon: BDAG
  rationale: ἐσθῆτι는 구체적 옷의 종류보다 복장을 가리키므로, ‘흰 옷을 입고’가 직역성과 자연성을 함께 지닙니다.
- source_word: πανοπλίαν χρυσῆν κραδαίνων
  english_pob_choice: brandishing golden armor
  chosen_korean: “황금 갑옷을 휘두르고 있었습니다”
  alternatives_korean:
  - “황금 갑옷을 번쩍이며 들고 있었습니다”
  - “황금 갑옷을 휘두르며 있었습니다”
  lexicon: LSJ; BDAG
  rationale: κραδαίνων은 격렬하게 흔들거나 휘두르는 동작을 나타내므로, ‘휘두르고 있었습니다’로 생동감을 살렸습니다. πανοπλίαν χρυσῆν은 문자적으로 ‘황금 갑주/전신 무장’이지만, 한국어에서는 ‘갑옷’이 가장 간결하고 읽기 쉽습니다.
