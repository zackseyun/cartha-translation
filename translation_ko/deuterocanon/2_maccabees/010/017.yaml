    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰωάνης καὶ Ἀβεσσαλώμ
  english_pob_choice: John and Absalom
  chosen_korean: 요한과 아베살롬
  alternatives_korean:
  - 요안네스와 아베살롬
  - 요한과 압살롬
  lexicon: 고유명사 음역
  rationale: Ἰωάνης는 일반적으로 요한으로 옮길 수 있고, Ἀβεσσαλώμ은 한국어에서 성서 인명으로 널리 쓰이는 압살롬보다 본문 표기와 가까운 아베살롬도 가능하지만, 여기서는 원형을 더 직접 반영하는 음역을 택했습니다.
- source_word: οἱ πεμφθέντες παρʼ ὑμῶν
  english_pob_choice: who were sent from you
  chosen_korean: 여러분이 보낸 사람들이었는데
  alternatives_korean:
  - 여러분에게서 보내진 사람들이었는데
  - 여러분에 의해 보내진 사람들이었는데
  lexicon: BDAG
  rationale: παρʼ ὑμῶν은 출처/발신 측면의 ‘from you’에 가깝고, 수동 분사 πεμφθέντες는 한국어에서 자연스럽게 ‘보낸 사람들’로 옮길 수 있습니다.
- source_word: τὸν ὑπογεγραμμένον χρηματισμόν
  english_pob_choice: the written document
  chosen_korean: 서면 문서
  alternatives_korean:
  - 쓴 문서
  - 기록된 공문
  - 서면 통지
  lexicon: BDAG
  rationale: ὑπογεγραμμένον과 χρηματισμός는 공식적 성격을 지닌 글문서를 가리킬 수 있으므로, ‘문서’보다 더 구체적인 ‘서면 문서’로 옮겨 공식성과 문자성 둘 다 살렸습니다.
- source_word: διʼ αὐτοῦ σημαινομένων
  english_pob_choice: the matters indicated by it
  chosen_korean: 그것이 가리키는 내용
  alternatives_korean:
  - 그것이 알려 주는 일들
  - 그 안에 표시된 사항들
  lexicon: BDAG
  rationale: σημαινομένων은 단순 전달보다 ‘가리키다/표시하다’의 의미가 강하므로, 문서가 지시하는 내용을 자연스러운 한국어로 표현했습니다.
theological_decisions:
- issue: 문서의 성격을 어디까지 특정할 것인가
  chosen_reading: 공문·칙령처럼 단정하지 않고 ‘서면 문서’로 두었습니다.
  alternative_readings:
  - 서면 통지
  - 서면 칙령
  - 공문
  rationale: χρηματισμός는 공식 문서일 수 있으나 반드시 칙령으로 한정되지는 않으므로, 본문이 보장하는 범위 안에서만 번역했습니다.
  doctrine_reference: 본문 의미 보존과 과잉특정 회피
