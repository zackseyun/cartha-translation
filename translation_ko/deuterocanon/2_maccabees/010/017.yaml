  text: 요한과 압살롬은 여러분이 보낸 사람들이었는데, 서면 문서를 전달한 뒤 그것이 가리키는 내용에 관해 물었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
