  source_fidelity: 원문의 ‘신들에게로 떠나다’라는 왕실 죽음 완곡어법은 잘 보존했습니다. 다만 ἐπὶ의 시간적·상황적 연결과 βουλόμενοι의 이유 제시가 한국어 초안에서 ‘뒤에, 그리고 … 때문입니다’로 겹쳐 다소 불명확해졌습니다. 또한 πρὸς τὴν τῶν Ἰουδαίων ἐπιμέλειαν은 단순히 ‘유다인들의 일에 주의를 기울이다’보다 유다인에 관한 사안을 돌보는 행정적 관심을 나타내도록 옮기는 편이 적절합니다.
  naturalness: 초안은 절 단위로 끝나는 문장인데 ‘그리고’와 ‘때문입니다’가 함께 쓰여 문법적으로 매끄럽지 않고, 왕실 서신의 격식 있는 인과 관계도 흐려집니다. 수정문은 현대 표준어 합쇼체의 공식적 문체를 유지하면서 원문의 미완결적인 종속절 성격을 쉼표로 드러냅니다.
  terminology: ‘신들에게로 떠나신’은 유지합니다. ‘왕국에 있는 이들’은 원문의 넓은 지시를 살려 ‘왕국의 사람들이’로, ἐπιμέλεια의 행정적 돌봄은 ‘유다인들에 관한 일을 돌보다’로 조정합니다.
