translation:
  language: ko
  text: 우리 아버지께서 신들에게로 떠나신 뒤에, 그리고 우리는 왕국에 있는 이들이 방해받지 않은 채 유다인들의 일에 주의를 기울이기를 바라기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘신들에게로 떠나신’이라는 헬레니즘 왕실의 죽음 완곡어법을 사용합니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπὶ τοῦ πατρὸς ἡμῶν
  english_pob_choice: since our father
  chosen_korean: 우리 아버지께서
  alternatives_korean:
  - 우리 조상께서
  - 우리 부왕께서
  lexicon: LSJ
  rationale: 왕실 문맥에서 화자 쪽의 돌아가신 아버지를 가리키므로, 평이하면서도 공식적인 ‘우리 아버지께서’로 옮겼습니다.
- source_word: εἰς θεοὺς μεταστάντος
  english_pob_choice: has departed to the gods
  chosen_korean: 신들에게로 떠나신
  alternatives_korean:
  - 신들에게로 옮겨 가신
  - 돌아가신
  lexicon: LSJ
  rationale: 죽음을 가리키는 헬레니즘 왕실 완곡어법을 살리기 위해, 단순한 ‘돌아가신’보다 ‘신들에게로 떠나신’으로 표현했습니다.
- source_word: ἀπερισπάστως ὄντας
  english_pob_choice: being free from disturbance
  chosen_korean: 방해받지 않은 채
  alternatives_korean:
  - 분주함 없이
  - 방해 없이
  lexicon: LSJ
  rationale: 행정적·공적 문맥에서 ‘분산되지 않다’보다 외적 방해가 없는 상태를 자연스럽게 드러내는 표현을 택했습니다.
- source_word: πρὸς τὴν τῶν Ἰουδαίων ἐπιμέλειαν
  english_pob_choice: give attention to the affairs of the Jews
  chosen_korean: 유다인들의 일에 주의를 기울이기를
  alternatives_korean:
  - 유다인들의 사정에 관심을 두기를
  - 유다인들의 일을 돌보기를
  lexicon: LSJ
  rationale: ἐπιμέλεια의 행정적 ‘주의/돌봄’ 뉘앙스를 살리되, 왕국 내 유다인 관련 사안을 다루는 맥락에 맞게 자연스럽게 옮겼습니다.
