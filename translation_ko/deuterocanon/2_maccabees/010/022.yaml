  - marker: b
    text: '''Brother'' may reflect either a literal familial relationship or a conventional royal/courtly form of address; the Greek itself does not specify beyond ''brother.'''
    reason: cultural_note
translation:
  language: ko
  text: 왕의 편지에는 다음과 같이[a] 적혀 있었습니다. “안티오코스 왕이 형제[b] 루시아스에게 문안합니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 직역하면 ‘왕의 편지가 이와 같이 담고 있었습니다’라는 뜻입니다. 여기서는 서신의 내용을 도입하는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘형제’는 혈연 관계를 가리킬 수도 있고, 헬레니즘 왕실이나 궁정에서 쓰인 관용적 호칭일 수도 있습니다. 그리스어 본문은 그 이상을 밝히지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: Ἡ ... ἐπιστολή
  english_pob_choice: the king’s letter
  chosen_korean: 그 왕의 편지
  alternatives_korean:
  - 왕의 서한
  - 왕의 서신
  lexicon: LSJ
  rationale: ἐπιστολή는 여기서 왕실의 공식 서간을 가리키므로, 현대 한국어에서는 자연스럽고 격식 있는 ‘편지’가 가장 직접적입니다.
- source_word: περιεῖχεν οὕτως
  english_pob_choice: contained this
  chosen_korean: 이러했습니다
  alternatives_korean:
  - 이와 같이 적혀 있었습니다
  - 다음과 같이 되어 있었습니다
  lexicon: LSJ
  rationale: 본문의 epistolary introduction은 내용 도입을 뜻하므로, ‘이러했습니다’로 간결하게 옮겨 그 기능을 살렸습니다.
- source_word: τῷ ἀδελφῷ
  english_pob_choice: to his brother
  chosen_korean: 그의 형제에게
  alternatives_korean:
  - 그의 형제에게
  - 그의 동생에게
  - 그의 형제 루시아스에게
  lexicon: LSJ
  rationale: ἀδελφός는 기본적으로 혈연 형제를 뜻하지만, 이 문맥에서는 관계적/궁정적 호칭일 가능성도 있으므로 ‘형제’로 유지하되 수신자를 분명히 했습니다.
- source_word: χαίρειν
  english_pob_choice: greetings
  chosen_korean: 문안합니다
  alternatives_korean:
  - 안부를 전합니다
  - 인사합니다
  lexicon: LSJ
  rationale: 서신 서두의 χαίρειν은 관용적 인사말이므로, 직역적 ‘기뻐하십시오’보다 한국어 서간체에 맞는 ‘문안합니다’가 적절합니다.
theological_decisions:
- issue: 왕실 서한 서두의 서간체 재현
  chosen_reading: 본문의 공문서적 서두를 자연스러운 현대 한국어 서간체로 재현했습니다.
  alternative_readings:
  - 직역적으로 ‘그 왕의 편지가 이와 같이 포함하고 있었습니다’
  - 형식적으로 ‘왕의 편지는 다음과 같았습니다’
  rationale: 이 절은 신학적 쟁점보다 문서 형식이 핵심이므로, 원문의 서간 도입 기능을 살리되 한국어로 읽히는 자연성을 확보했습니다.
  doctrine_reference: 서간체/문서 형식
- issue: ‘형제’의 관계 범위
  chosen_reading: ‘형제’라는 원어 표현을 유지하되, 고대 왕실 호칭의 가능성을 주석 없이 본문에 반영했습니다.
  alternative_readings:
  - 혈연 형제로 단정
  - 궁정적 존칭으로 풀어쓰기
  rationale: 그리스어는 ‘형제’ 이상을 명시하지 않으므로, 본문에서 의미를 확정하지 않고 열린 채로 두는 것이 소스 충실성에 맞습니다.
  doctrine_reference: 문맥적 의미의 절제
