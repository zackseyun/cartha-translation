  text: 'And the king’s letter contained this: “King Antiochus to his brother Lysias[b][a], greetings.”'
  footnotes:
  - marker: a
    text: Greek literally, 'And the king’s letter contained thus.' English commonly smooths this epistolary introduction as 'contained this' or 'was as follows.'
