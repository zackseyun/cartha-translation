  text: Farewell[a]. May it be as we would wish[b]; and we ourselves are also well.
  footnotes:
  - marker: a
    text: 'Greek literally uses health-language in the closing: ''Be strong/well ... and we ourselves are also healthy.'' The rendering ''Farewell'' reflects the idiomatic force of the epistolary valediction.'
    reason: lexical_alternative
  - marker: b
    text: This verse appears to be an epistolary closing formula and is not narratively continuous with the surrounding context in many modern verse divisions; the source wording itself is translated as given.
    reason: cultural_note
translation:
  language: ko
  text: 안녕히 가십시오. 우리가 바라는 대로 되기를 바랍니다. 우리도 또한 건강합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘강건/건강’ 어휘를 사용하지만, 서신 종결 인사로는 ‘안녕히 가십시오’라는 관용적 의미가 됩니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절은 많은 현대 절 구분에서 앞뒤 이야기와 느슨하게만 이어지는 서신 종결 형식입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἔρρωσθε
  english_pob_choice: Farewell
  chosen_korean: 안녕히 가십시오
  alternatives_korean:
  - 강건하십시오
  - 건강하십시오
  - 잘 가십시오
  lexicon: LSJ
  rationale: 직역하면 ‘건강하라/강건하라’이지만, 서신 종결 인사로 쓰인 관용적 표현이므로 한국어에서는 자연스러운 작별 인사로 옮겼습니다.
- source_word: εἰη ἂν
  english_pob_choice: May it be
  chosen_korean: 되기를 바랍니다
  alternatives_korean:
  - 그렇게 되기를 바랍니다
  - 그럴 수 있기를 바랍니다
  - 그렇게 되게 하소서
  lexicon: LSJ
  rationale: 옵타티브의 소망·바람을 한국어의 공손한 소망 표현으로 옮겨, 문맥의 정중한 종결 어조를 살렸습니다.
- source_word: ὡς βούλομεθα
  english_pob_choice: as we would wish
  chosen_korean: 우리가 바라는 대로
  alternatives_korean:
  - 우리가 원하는 대로
  - 우리가 바라듯
  - 우리가 소망하는 대로
  lexicon: LSJ
  rationale: βούλομαι의 ‘바라다/원하다’ 의미를 살리되, 한국어에서 가장 자연스러운 대응인 ‘바라는 대로’를 선택했습니다.
- source_word: ὑγιαίνομεν
  english_pob_choice: are also well
  chosen_korean: 건강합니다
  alternatives_korean:
  - 잘 지내고 있습니다
  - 건강한 상태입니다
  - 몸이 좋습니다
  lexicon: LSJ
  rationale: 어근상 ‘건강하다’가 가장 직접적이므로, 영어의 완곡한 ‘well’보다 원뜻을 분명히 드러냈습니다.
