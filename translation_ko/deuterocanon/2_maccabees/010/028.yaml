  alternative_readings:
  - 강건하십시오
  - 건강하십시오
  - 잘 가십시오
  rationale: 그리스어의 건강-어휘가 실제로는 서신 종결 관용구로 기능하므로, 독자가 문맥상 인사말로 이해하도록 자연스러운 종결 표현을 택했습니다.
