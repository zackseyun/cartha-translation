  text: 건강하십시오.[a] 우리가 바라는 대로 되기를 바랍니다.[b] 우리도 건강합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘강건함/건강’의 어휘를 사용합니다. 이는 서신의 맺음말에서 관용적인 작별 인사로 쓰이며, 여기서는 ‘건강하십시오’로 그 건강 기원의 의미를 보존했습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절은 서신의 맺음말 형식으로 보이며, 많은 현대의 절 구분에서는 앞뒤 서술과 이야기상 연속되지 않습니다. 그러나 원문의 표현은 그대로 번역했습니다.
    reason: cultural_note
