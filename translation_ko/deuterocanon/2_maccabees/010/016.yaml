  yaml_path: translation/deuterocanon/2_maccabees/010/016.yaml
  text: 'For letters had been written to the Jews from Lysias[a], containing this form: “Lysias to the multitude of the Jews[b], greetings.”'
  footnotes:
  - marker: a
    text: Or “containing these terms” / “containing this wording.” The Greek citation formula τὸν τρόπον τοῦτον can refer to the form or wording of the letter.
    reason: lexical_alternative
  - marker: b
    text: “To the multitude of the Jews” could also be rendered “to the body of the Jews” or “to the assembly of the Jews.”
    reason: lexical_alternative
translation:
  language: ko
  text: 실제로 리시아스가 유대인들에게 보낸 편지들이 이미 있었으며, 그 내용은 다음과 같은 형식이었습니다.[a] “리시아스가 유대인의 무리에게[b] 문안합니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: τὸν τρόπον τοῦτον은 ‘이런 형식’, ‘이러한 문구’ 또는 ‘다음과 같은 내용’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: τῷ πλήθει τῶν Ἰουδαίων은 ‘유대인의 회중에게’ 또는 ‘유대인의 집단에게’로도 옮길 수 있습니다.
    reason: lexical_alternative
