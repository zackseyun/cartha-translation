base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/016.yaml
  text: 'For letters had been written to the Jews from Lysias[a], containing this form: “Lysias to the multitude of the Jews[b], greetings.”'
  footnotes:
  - marker: a
    text: Or “containing these terms” / “containing this wording.” The Greek citation formula τὸν τρόπον τοῦτον can refer to the form or wording of the letter.
    reason: lexical_alternative
  - marker: b
    text: “To the multitude of the Jews” could also be rendered “to the body of the Jews” or “to the assembly of the Jews.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 유대인들에게는 라이시아스에게서 보낸 편지들이 있었는데, 그 가운데에는 다음과 같은 형식이 들어 있었습니다. “라이시아스가 유대인들의 무리에게 문안합니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: τὸν τρόπον τοῦτον은 ‘이런 형식’ 또는 ‘이런 문구’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: τῷ πλήθει τῶν Ἰουδαίων은 ‘유대인들의 회중에게’ 또는 ‘유대인들의 집단에게’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν γὰρ γεγραμμέναι
  english_pob_choice: For letters had been written
  chosen_korean: 그러므로 … 편지들이 있었는데
  alternatives_korean:
  - 편지들이 기록되어 있었습니다
  - 편지들이 써져 있었습니다
  lexicon: LSJ
  rationale: 그냥 ‘기록되었다’보다, 문맥상 이미 존재한 편지들을 소개하는 뜻을 살려 ‘있었습니다’로 자연스럽게 옮겼습니다.
- source_word: ἐπιστολαὶ
  english_pob_choice: letters
  chosen_korean: 편지들
  alternatives_korean:
  - 서신들
  - 서한들
  lexicon: LSJ
  rationale: 공식 문서의 성격을 유지하면서도 현대 한국어에서 가장 자연스러운 대응어는 ‘편지들’입니다.
- source_word: παρὰ μὲν Λυσίου
  english_pob_choice: from Lysias
  chosen_korean: 라이시아스에게서
  alternatives_korean:
  - 라이시아스로부터
  - 라이시아스 측에서
  lexicon: LSJ
  rationale: παρά+소유격의 출처 표지를 한국어 조사 ‘에게서’로 옮겨, 발신자를 분명히 했습니다.
- source_word: τὸν τρόπον τοῦτον
  english_pob_choice: this form
  chosen_korean: 다음과 같은 형식
  alternatives_korean:
  - 이런 형식
  - 이런 문구
  lexicon: LSJ
  rationale: 편지 인용을 도입하는 표현이므로 ‘형식’이 적절하며, 뒤따르는 직접 인용을 예고하는 말맛을 살렸습니다.
- source_word: τῷ πλήθει τῶν Ἰουδαίων
  english_pob_choice: to the multitude of the Jews
  chosen_korean: 유대인들의 무리에게
  alternatives_korean:
  - 유대인들의 무리에게
  - 유대인들의 회중에게
  - 유대인들의 집단에게
  lexicon: LSJ
  rationale: πλῆθος의 집합적·다수적 뉘앙스를 살리되, 본문이 제도적 ‘회중’을 뜻한다고 단정하지 않도록 ‘무리’로 옮겼습니다.
- source_word: χαίρειν
  english_pob_choice: greetings
  chosen_korean: 문안합니다
  alternatives_korean:
  - 인사합니다
  - 평안하기를 바랍니다
  lexicon: LSJ
  rationale: 서신 서두의 관용구를 한국어 서간체로 자연스럽게 옮기면서, 단순 명사형보다 화행을 드러내는 동사형을 택했습니다.
theological_decisions:
- issue: 본문이 인용하는 서간 서두의 등록(register)
  chosen_reading: 직접 인용문 안에서는 한국어 서간체에 맞춰 ‘문안합니다’로 처리했습니다.
  alternative_readings:
  - ‘인사합니다’
  - ‘평안합니다’
  rationale: χαίρειν은 편지 서두의 상투적 인사말이므로, 현대 독자에게 자연스럽고 문서 형식을 드러내는 표현이 필요합니다.
  doctrine_reference: 서간체 화행 재현 원칙
