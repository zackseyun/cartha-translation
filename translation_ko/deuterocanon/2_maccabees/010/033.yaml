    reason: cultural_note
translation:
  language: ko
  text: 안녕히 계십시오.[a] 제148년 크산티코스월[b] 15일.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ἔρρωσθε는 문자적으로 ‘강건하십시오’ 또는 ‘건강하십시오’에 가깝지만, 서신의 종결 공식에서는 관용적인 작별 인사로 쓰입니다.
    reason: lexical_alternative
  - marker: b
    text: 크산티코스는 헬레니즘 시대의 연대 표기에 쓰인 마케도니아 달 이름입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἔρρωσθε
  english_pob_choice: Farewell
  chosen_korean: 안녕히 가십시오
  alternatives_korean:
  - 건강하십시오
  - 강건하십시오
  - 안녕히 계십시오
  lexicon: LSJ
  rationale: 폐신(閉信) 공식에서의 관용적 작별 인사로 기능하므로, 문자적 ‘강건하라/건강하라’보다 자연스러운 종결 인사로 옮겼습니다.
- source_word: ἑκατοστοῦ τεσσερακοστοῦ ὀγδόου
  english_pob_choice: one hundred forty-eighth
  chosen_korean: 제백사십팔년
  alternatives_korean:
  - 백사십팔년
  - 제148년
  lexicon: LSJ
  rationale: 연대 표기의 서수 표현이므로 한국어 연월일 관용에 맞게 ‘제…년’으로 풀어, 연대기적 표지를 분명히 했습니다.
- source_word: Ξανθικοῦ
  english_pob_choice: Xanthicus
  chosen_korean: Xanthicus월
  alternatives_korean:
  - 산티코스월
  - 잔티쿠스월
  lexicon: LSJ
  rationale: 마케도니아 달명은 번역하지 않고 음역하되, 독자가 달명임을 즉시 알 수 있도록 ‘월’을 붙였습니다.
- source_word: πεντεκαιδεκάτῃ
  english_pob_choice: fifteenth day
  chosen_korean: 열닷새
  alternatives_korean:
  - 열다섯째 날
  - 십오일
  lexicon: LSJ
  rationale: 날짜 관용에서 가장 자연스러운 한국어는 ‘열닷새’이며, 날짜 표기의 기능을 간결하게 살립니다.
