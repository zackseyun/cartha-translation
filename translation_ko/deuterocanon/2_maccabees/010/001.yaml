translation:
  language: ko
  text: 그러나 아주 짧은 시간이 지난 뒤에, 왕의 보호자이자 친척이며 일들을 맡은 사람인 리시아스가 일어난 일들을 매우 괴롭게 여기고 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘잠시 후에’; 그리스어 표현은 그 사이의 짧음을 더욱 강하게 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘섭정’; ‘왕의 보호자’에 해당하는 ἐπίτροπος는 왕을 대신해 감독을 맡은 사람을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘국정 책임자’; ‘일들을 맡은 사람’에 해당하는 말로, 그리스어는 문자적으로 ‘일들 위에 있는 사람’이라고 말합니다.
    reason: lexical_alternative
