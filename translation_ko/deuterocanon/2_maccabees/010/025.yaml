  yaml_path: translation/deuterocanon/2_maccabees/010/025.yaml
  text: Therefore[a], since we choose that this nation also should be free from disturbance, we judge that the sanctuary should be restored to them[c][b], and that they should live according to the customs of their ancestors.
  footnotes:
  - marker: a
    text: Or 'we decide' / 'we decree'; the Greek κρίνομεν is formal administrative language for an official determination.
    reason: lexical_alternative
  - marker: b
    text: The verb translated 'live' (πολιτεύεσθαι) can also suggest ordering communal or civic life, not merely private conduct.
    reason: lexical_alternative
  - marker: c
    text: '''The sanctuary'' may also be rendered ''the temple,'' since τὸ ἱερὸν can refer to the sacred temple complex.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 우리는 이 민족도 혼란에서 벗어나게 하기를 바라므로, 성소[c]가 그들에게 회복되어야 하고 그들이 조상들의 관습에 따라 살아가야 한다고 결정합니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리는 판단합니다’ 또는 ‘우리는 칙령을 내립니다’. 그리스어 κρίνομεν은 공식적인 행정적 결정을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘살아가야 한다’로 옮긴 πολιτεύεσθαι는 단순한 사적 행위보다 공동체적·시민적 삶의 질서를 함축할 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘성소’는 τὸ ἱερόν을 옮긴 말이며, 성전 경내 또는 성전 구역을 가리킬 수도 있습니다.
    reason: lexical_alternative
