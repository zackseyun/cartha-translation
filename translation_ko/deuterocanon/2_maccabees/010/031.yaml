translation:
  language: ko
  text: 유다인들이 자기들의 재산과 율법을 전처럼 사용할 수 있게 하고, 그들 가운데 누구도 어떤 식으로든 무지에서 비롯된 일들 때문에 괴롭힘을 당하지 않게 하라는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기들의 지출’ 혹은 ‘자기들의 자원’으로도 옮길 수 있습니다. 그리스어 δαπανήμασιν은 지출액이나 부양 수단을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρῆσθαι
  english_pob_choice: should make use of
  chosen_korean: 사용할 수 있게 하다
  alternatives_korean:
