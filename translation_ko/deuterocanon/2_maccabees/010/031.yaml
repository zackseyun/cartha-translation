  text: that the Jews should make use of their own resources and laws as before[a], and that none of them should in any way be harassed concerning the things done in ignorance.
  footnotes:
  - marker: a
    text: Or 'their own expenses' or 'their own resources' for 'their own provisions' (τοῖς ἑαυτῶν δαπανήμασιν); the Greek term can refer to expenditures or material means of support.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다인들이 전처럼 자기들의 자원과 율법을 사용할 수 있게 하고, 그들 가운데 아무도 알지 못하고 한 일들에 관하여 어떤 방식으로도 괴롭힘을 당하지 않게 하라는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기들의 지출’ 또는 ‘자기들의 부양 수단’으로 옮길 수 있습니다. 그리스어 δαπανήμασιν은 지출이나 생활을 유지하기 위한 물질적 수단을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρῆσθαι
  english_pob_choice: should make use of
  chosen_korean: 사용할 수 있게 하다
  alternatives_korean:
  - 쓰게 하다
  - 이용하게 하다
  lexicon: LSJ
  rationale: χρῆσθαι는 ‘사용하다/이용하다’의 의미이므로, 명령·허가의 취지를 살려 ‘사용할 수 있게 하다’로 옮겼습니다.
- source_word: τοῖς ἑαυτῶν δαπανήμασιν
  english_pob_choice: their own provisions
  chosen_korean: 자기들의 재산
  alternatives_korean:
  - 자기들의 자원
  - 자기들의 비용
  lexicon: LSJ
  rationale: δαπάνημα는 지출·부양 수단을 가리킬 수 있어, 이 문맥에서는 단순한 ‘비용’보다 실제적으로 자기들이 유지에 쓸 수 있는 소유를 드러내는 ‘재산’이 자연스럽고 문맥에 맞습니다.
- source_word: νόμοις
  english_pob_choice: laws
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 관습
  lexicon: LSJ
  rationale: 유대인에게 적용되는 νόμος는 여기서 단순한 일반법보다 정체성을 규정하는 율법이므로, POB 기본 용례에 따라 ‘율법’으로 옮겼습니다.
- source_word: περὶ τῶν ἠγνοημένων
  english_pob_choice: concerning the things done in ignorance
  chosen_korean: 무지에서 비롯된 일들 때문에
  alternatives_korean:
  - 무지로 행한 일들에 관하여
  - 모르고 저지른 일들 때문에
  lexicon: LSJ
  rationale: ἠγνοημένων은 ‘알지 못함/무지 상태에서 행해진 것들’의 뜻이므로, 원인과 대상 모두를 살리면서도 한국어에서 자연스러운 ‘무지에서 비롯된 일들’로 옮겼습니다.
theological_decisions:
- issue: 율법과 지역 자기결정의 병행
  chosen_reading: 유다인들이 자기들의 재산과 율법을 전처럼 사용할 수 있게 해 달라는 허가와, 무지에서 비롯된 일들에 대한 간섭 금지로 이해했습니다.
  alternative_readings:
  - 단순 행정적 특권 회복
  - 종교적 관행만의 허용
  rationale: 본문은 물질적 자기부양(δαπανήμασιν)과 규범적 자기질서(νόμοις)를 함께 말하므로, 둘을 함께 살린 허가 회복으로 읽는 것이 문맥에 충실합니다.
  doctrine_reference: 2 Maccabees 10:31의 유대 공동체 자치와 율법 준수 맥락
- issue: ‘무지’의 행위에 대한 책임 완화
  chosen_reading: ‘무지에서 비롯된 일들’은 고의적 범죄와 구별되는, 알지 못하고 행한 일들에 대한 비난·간섭의 중지를 뜻하는 것으로 읽었습니다.
  alternative_readings:
  - 의도적 위반을 포함하는 일반적 잘못
  - 단순한 정보 부족
  rationale: ἠγνοημένα는 의도성보다 무지 상태를 강조하므로, 죄책의 경중을 흐리지 않으면서도 간섭 금지라는 본문의 취지를 살려야 합니다.
  doctrine_reference: 무지와 고의의 구별에 관한 성경적 책임 언어
