  text: that the Jews should make use of their own resources and laws as before[a], and that none of them should in any way be harassed concerning the things done in ignorance.
  footnotes:
  - marker: a
    text: Or 'their own expenses' or 'their own resources' for 'their own provisions' (τοῖς ἑαυτῶν δαπανήμασιν); the Greek term can refer to expenditures or material means of support.
