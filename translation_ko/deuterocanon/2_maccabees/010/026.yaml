- from: 그러므로 당신은 그들에게 사람을 보내고 친교의 보증을 주는 것이 좋습니다. 그러면 그들이 우리의 의도를 알고 용기를 얻어, 자기들의 사정에 대한 도움을 받으면서 기쁘게 지낼 것입니다.[a][b][c]
  to: 그러므로 그들에게 보내고 신의의 보증을 주시면[a] 잘하실 것입니다. 그러면 그들이 우리의 의도를 알고 용기를 얻고[b], 자신들의 일에 도움을 받으면서 기쁘게 지낼 것입니다.[c]
  rationale: 원문의 권고적 미래형을 ‘…주시면 잘하실 것입니다’로 살리고, 보내는 대상이 명시되지 않은 원문을 따라 ‘사람’을 삭제했습니다. δεξιάς의 외교적 관용 의미는 ‘신의의 보증’으로, 마지막 구의 범위는 ‘자신들의 일’로 넓게 유지했습니다. 각주 표지는 해당 어구에 각각 연결했습니다.
