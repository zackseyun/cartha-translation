base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/026.yaml
  text: Therefore you will do well to send to them and give them pledges of good faith[a], so that, knowing our intention[c][b], they may be encouraged and may live gladly with support for their own interests.
  footnotes:
  - marker: a
    text: Literally, 'having given right hands'—a Greek idiom for offering assurances or pledges of peace/good faith.
    reason: lexical_alternative
  - marker: b
    text: Or 'may be cheerful' for 'may be encouraged.'
    reason: lexical_alternative
  - marker: c
    text: The final phrase may also be understood more narrowly as 'with support for their own possessions/interests.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 당신은 그들에게 사람을 보내고 친교의 보증을 주는 것이 좋습니다. 그러면 그들이 우리의 의도를 알고 용기를 얻어, 자기들의 사정에 대한 도움을 받으면서 기쁘게 지낼 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘오른손을 준 다음’이라는 뜻으로, 평화와 신뢰를 보증하는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘기뻐하여’ 또는 ‘마음이 놓여’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 구는 더 좁게는 ‘자기들의 재산에 대한 도움을 받으면서’로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὖ ... ποιήσεις
  english_pob_choice: you will do well
  chosen_korean: 그것이 좋습니다
  alternatives_korean:
  - 잘하실 것입니다
  - 옳게 하실 것입니다
  - 좋은 일을 하실 것입니다
  lexicon: LSJ
  rationale: 권고의 미래형을 한국어에서 자연스럽게 풀어, 단순 예측이 아니라 권면·제안을 드러내는 표현으로 옮겼습니다.
- source_word: διαπεμψάμενος πρὸς αὐτούς
  english_pob_choice: to send to them
  chosen_korean: 그들에게 사람을 보내고
  alternatives_korean:
  - 그들에게 보내고
  - 그들에게 사자를 보내고
  - 그들과 연락하고
  lexicon: LSJ
  rationale: 동사 자체는 ‘보내다’이지만 문맥상 외교적 접촉을 뜻하므로, 한국어에서는 암시된 파견 행위를 자연스럽게 드러내면서도 ‘사자’를 과하게 단정하지 않았습니다.
- source_word: δοὺς δεξιάς
  english_pob_choice: give pledges of good faith
  chosen_korean: 친교의 보증을 주는
  alternatives_korean:
  - 오른손을 내미는
  - 화친의 보증을 주는
  - 신의의 보증을 주는
  lexicon: LSJ
  rationale: ‘오른손을 주다’라는 관용구를 직역하면 모호하므로, 평화·신뢰를 약속하는 외교적 의미를 한국어의 ‘보증’으로 옮겼습니다. ‘친교’는 단순 친밀감보다 화친 관계를 살립니다.
- source_word: πρὸς τῇ τῶν ἰδίων ἀντιλήψει
  english_pob_choice: while receiving support for their own interests
  chosen_korean: 자기들의 사정에 대한 도움을 받으면서
  alternatives_korean:
  - 자기들의 일에 대한 도움을 받으면서
  - 자기들의 재산에 대한 도움을 받으면서
  - 자기들의 이해관계에 대한 도움을 받으면서
  lexicon: LSJ
  rationale: ἀντίληψις의 ‘도움/지지’ 의미와 τῶν ἰδίων의 ‘자기들의 것, 사정’ 범위를 살려, 재산으로 지나치게 좁히지 않으면서도 문맥의 실질적 지원을 드러냈습니다.
theological_decisions:
- issue: 외교적 화해 조치의 톤
  chosen_reading: ‘친교의 보증’으로 옮겨, 단순한 심리적 안정이 아니라 실질적 평화 제스처임을 드러냈습니다.
  alternative_readings:
  - ‘화친의 보증’
  - ‘신의의 보증’
  rationale: 본문의 오른손 관용구는 관계 회복과 신뢰 확립을 뜻하므로, 이를 한국어에서 외교적·공동체적 화해의 행위로 분명히 했습니다.
  doctrine_reference: 문맥적 역사 해석
- issue: εὔθυμοί τε ὦσιν의 감정 상태
  chosen_reading: ‘용기를 얻어’로 옮겨, 단순히 ‘기분이 좋다’보다 결의와 안정이 생기는 의미를 살렸습니다.
  alternative_readings:
  - ‘기운을 내어’
  - ‘마음이 놓여’
  - ‘기뻐하여’
  rationale: 헬라어 표현은 격려로 인한 내적 안정과 담대함을 포함하므로, 정서적 쾌감으로 축소하지 않고 공동체적 안심의 뉘앙스를 살렸습니다.
  doctrine_reference: 문맥적 역사 해석
