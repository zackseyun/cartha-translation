  lexicon: LSJ
  rationale: 동사 자체는 ‘보내다’이지만 문맥상 외교적 접촉을 뜻하므로, 한국어에서는 암시된 파견 행위를 자연스럽게 드러내면서도 ‘사자’를 과하게 단정하지 않았습니다.
- source_word: δοὺς δεξιάς
  english_pob_choice: give pledges of good faith
  chosen_korean: 친교의 보증을 주는
  alternatives_korean:
  - 오른손을 내미는
  - 화친의 보증을 주는
  - 신의의 보증을 주는
  lexicon: LSJ
  rationale: ‘오른손을 주다’라는 관용구를 직역하면 모호하므로, 평화·신뢰를 약속하는 외교적 의미를 한국어의 ‘보증’으로 옮겼습니다. ‘친교’는 단순 친밀감보다 화친 관계를 살립니다.
- source_word: πρὸς τῇ τῶν ἰδίων ἀντιλήψει
  english_pob_choice: while receiving support for their own interests
  chosen_korean: 자기들의 사정에 대한 도움을 받으면서
  alternatives_korean:
  - 자기들의 일에 대한 도움을 받으면서
  - 자기들의 재산에 대한 도움을 받으면서
  - 자기들의 이해관계에 대한 도움을 받으면서
  lexicon: LSJ
  rationale: ἀντίληψις의 ‘도움/지지’ 의미와 τῶν ἰδίων의 ‘자기들의 것, 사정’ 범위를 살려, 재산으로 지나치게 좁히지 않으면서도 문맥의 실질적 지원을 드러냈습니다.
theological_decisions:
- issue: 외교적 화해 조치의 톤
  chosen_reading: ‘친교의 보증’으로 옮겨, 단순한 심리적 안정이 아니라 실질적 평화 제스처임을 드러냈습니다.
  alternative_readings:
  - ‘화친의 보증’
  - ‘신의의 보증’
  rationale: 본문의 오른손 관용구는 관계 회복과 신뢰 확립을 뜻하므로, 이를 한국어에서 외교적·공동체적 화해의 행위로 분명히 했습니다.
  doctrine_reference: 문맥적 역사 해석
- issue: εὔθυμοί τε ὦσιν의 감정 상태
  chosen_reading: ‘용기를 얻어’로 옮겨, 단순히 ‘기분이 좋다’보다 결의와 안정이 생기는 의미를 살렸습니다.
  alternative_readings:
  - ‘기운을 내어’
  - ‘마음이 놓여’
  - ‘기뻐하여’
  rationale: 헬라어 표현은 격려로 인한 내적 안정과 담대함을 포함하므로, 정서적 쾌감으로 축소하지 않고 공동체적 안심의 뉘앙스를 살렸습니다.
  doctrine_reference: 문맥적 역사 해석
