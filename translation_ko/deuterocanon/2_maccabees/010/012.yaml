lexical_decisions:
- source_word: οἱ πλείονες
  english_pob_choice: most of them
  chosen_korean: 그들 대부분은
  alternatives_korean:
  - 그들의 대다수는
  - 그들 가운데 대부분은
  lexicon: LSJ
  rationale: πλείονες는 ‘더 많은 쪽, 대다수’의 뜻이므로 한국어로는 자연스러운 ‘그들 대부분’이 집합적 의미를 잘 살립니다.
- source_word: τραυματίαι
  english_pob_choice: wounded
  chosen_korean: 부상당한 채
  alternatives_korean:
  - 상처 입은 채
  - 부상 입은 채
  lexicon: LSJ
  rationale: 전투 맥락에서 ‘부상당한’은 상태를 간결하게 드러내며, 이어지는 동사구와도 자연스럽게 연결됩니다.
- source_word: γυμνοὶ
  english_pob_choice: naked
  chosen_korean: 벌거벗은 몸으로
  alternatives_korean:
  - 벌거벗은 채
  - 옷을 벗은 채
  - 옷이 벗겨진 채
  lexicon: LSJ
  rationale: 직역하면 ‘벌거벗은’이지만, 전투에서 장비나 겉옷을 잃은 상황까지 포함할 수 있어 ‘벌거벗은 몸으로’로 옮겨 표현의 충격을 유지했습니다.
- source_word: αἰσχρῶς φεύγων
  english_pob_choice: by fleeing shamefully
  chosen_korean: 수치스럽게 도망하여
  alternatives_korean:
  - 부끄럽게 달아나
  - 망신스럽게 도망하여
  lexicon: LSJ
  rationale: αἰσχρῶς는 단순한 ‘도망’이 아니라 수치와 망신의 뉘앙스를 담으므로 ‘수치스럽게’가 가장 직접적입니다.
theological_decisions:
- issue: 전투 생존을 뜻하는 διεσώθησαν / διεσώθη의 처리
  chosen_reading: 두 동사를 모두 ‘살아남았습니다’로 옮겨, 단순한 탈출이 아니라 패전 속 생존의 의미를 드러냈습니다.
  alternative_readings:
  - ‘구출되었습니다’
  - ‘무사히 빠져나왔습니다’
  rationale: 이 문맥에서 διεσώθη는 신학적 ‘구원’보다 전투에서 간신히 생존했다는 서술이므로, 한국어에서도 생존의 뉘앙스를 유지하는 것이 적절합니다.
  doctrine_reference: 서술적 역사 문맥에서의 구출/생존 의미
