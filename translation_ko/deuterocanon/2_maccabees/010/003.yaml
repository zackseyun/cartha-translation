  lexicon: LSJ
  rationale: 이교의 제의 공간을 가리키는 말이므로, 예루살렘 성소와 구별되도록 ‘신전들’로 옮겼습니다.
- source_word: πρατὴν ... τὴν ἀρχιερωσύνην
  english_pob_choice: the high priesthood sold each year
  chosen_korean: 대제사직도 해마다 팔리게
  alternatives_korean:
