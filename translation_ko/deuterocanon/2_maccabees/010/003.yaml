  - 대제사직이 매년 매매되게
  lexicon: LSJ
  rationale: πρατήν의 핵심은 직분이 ‘판매 대상’이 된다는 점이므로, ‘팔리게’로 직분의 상업화를 직접 드러냈습니다.
theological_decisions:
- issue: 예루살렘 성소와 이교 신전의 대비
  chosen_reading: ‘성소’와 ‘신전들’을 구별하여, 유다의 거룩한 공간이 이교 사원들과 같은 급으로 취급되는 모욕을 드러냈습니다.
  alternative_readings:
  - 둘 다 ‘성전’으로 통일
  - 둘 다 ‘성소’로 통일
  rationale: 원문의 ἱερὸν과 τεμένη는 서로 다른 말을 쓰므로, 구별을 유지해야 정책의 모독성이 살아납니다.
  doctrine_reference: Translation philosophy §§1, 5
- issue: 대제사직의 상업화
  chosen_reading: ‘해마다 팔리게’로 옮겨 직분이 정당한 임명이 아니라 매매의 대상으로 전락한다는 뜻을 살렸습니다.
  alternative_readings:
  - ‘해마다 팔게’
  - ‘매년 판매되게’
  rationale: 원문 πρατὴν은 단순한 교체가 아니라 ‘판매됨’의 충격을 강조하므로, 그 신학적·역사적 비판을 약화시키지 않도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 5
