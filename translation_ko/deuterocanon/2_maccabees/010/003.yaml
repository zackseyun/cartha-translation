  text: and to make the sanctuary taxable[a], like the other shrines of the nations, and to make the high priesthood sold each year[c][b];
  footnotes:
  - marker: a
    text: Or 'subject to tribute.' The Greek adjective ἀργυρολόγητον suggests being assessed for money or taxation.
    reason: lexical_alternative
  - marker: b
    text: Or 'to put the high priesthood up for sale each year.' The Greek πρατὴν emphasizes that the office was to be sold.
    reason: lexical_alternative
  - marker: c
    text: The surviving Greek here is syntactically compressed; this translation reflects the sense of the policy being described rather than a smoother full sentence in Greek.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 성소를 다른 민족들의 다른 신전들처럼 세금이 부과되는 곳으로 만들고, 대제사직도 해마다 팔리게 하려는 것이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἱερὸν과 τεμένη의 어휘 차이를 살리기 위해, 예루살렘의 거룩한 공간과 이교 제의 공간을 서로 다르게 옮겼습니다.
    reason: source_note
  - marker: b
    text: πρατὴν은 ‘팔 수 있는’이 아니라 실제로 ‘팔리는’ 상태를 뜻하므로, 대제사직의 매매성을 분명히 했습니다.
    reason: lexical_alternative
