  yaml_path: translation/deuterocanon/2_maccabees/010/036.yaml
  text: But if there are matters that should be brought before the king[a], send someone at once to look into these things, so that we may act as is fitting for us; for we are going on to Antioch.
  footnotes:
  - marker: a
    text: Or, more literally, 'if anything has been judged to be brought before the king.' The Greek expression is somewhat compressed, and the English has been smoothed to convey the likely sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 왕에게 올려야 한다고 판단된 일이 있거든[a], 즉시 누군가를 보내어 이 일들을 살펴보게 하십시오. 그래야 우리가 마땅히 처신할 수 있습니다. 우리는 안티오키아로 가고 있기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘왕에게 올려지도록 판단된 것들이 있거든’에 가깝습니다. 그리스어 표현은 판단의 주체를 분명히 밝히지 않은 채 압축되어 있어, 한국어에서는 의미를 풀어 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
