  rationale: ‘올리다’는 상급 권위자에게 사안을 상정·제출하는 의미를 잘 살리며, 단순 보고나 물리적 이동으로 좁히지 않습니다.
- source_word: πέμψατέ τινα παραχρῆμα
  english_pob_choice: send someone at once
  chosen_korean: 곧 사람 하나를 보내어
  alternatives_korean:
  - 즉시 사람을 보내어
  - 당장 누군가를 파견하여
  lexicon: LSJ
  rationale: 명령형과 부정대명사의 조합을 급한 파견으로 살리되, 현대 한국어에서 자연스러운 ‘곧 사람 하나를 보내어’로 옮겼습니다.
- source_word: ἐπισκεψόμενον περὶ τούτων
  english_pob_choice: to look into these things
  chosen_korean: 이 일들을 살펴보게
  alternatives_korean:
  - 이 일들을 조사하게
  - 이 일들을 검토하게
  lexicon: LSJ
  rationale: 미래 분사의 뜻인 조사·점검을 반영하면서도, 너무 딱딱하지 않은 ‘살펴보다’로 처리했습니다.
- source_word: ὡς καθήκει ἡμῖν
  english_pob_choice: as is fitting for us
  chosen_korean: 우리에게 합당한 대로
  alternatives_korean:
  - 우리에게 마땅한 대로
  - 우리답게
  lexicon: LSJ
  rationale: καθήκει의 ‘합당하다, 마땅하다’는 뜻을 살려, 공동체가 취해야 할 적절한 처신을 드러내는 표현으로 옮겼습니다.
- source_word: προσάγομεν πρὸς Ἀντιοχίαν
  english_pob_choice: we are going on to Antioch
  chosen_korean: 안티오키아로 가고 있기 때문입니다
  alternatives_korean:
  - 안티오키아로 가는 중입니다
