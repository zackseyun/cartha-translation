  rationale: 중성 복수 관계대명사는 여기서 구체적 물건보다 논의 중인 사안들을 가리키므로, 한국어에서는 자연스럽고 포괄적인 ‘일들’로 옮겼습니다.
- source_word: προσανενεχθῆναι τῷ Βασιλεῖ
  english_pob_choice: be brought before the king
  chosen_korean: 왕에게 올려야 할
