  verdict: revise
  source_fidelity: 초안은 διὸ, σπεύσατε, πέμψατέ τινας 및 ὁποῖοί ἐστε γνώμης를 대체로 충실히 옮깁니다. 그러나 ὅπως ... ἐπιγνῶμεν은 ‘그러면 ... 알게 될 것입니다’라는 단순 결과·미래 진술보다, 파견의 목적을 나타내는 표현으로 옮기는 편이 정확합니다. 또한 ‘보내 주십시오’의 ‘주다’는 원문에 없는 수혜의 뉘앙스를 더합니다.
  naturalness: ‘그러므로 서두르시고 사람 몇 명을 보내십시오. 그러면 ...’도 이해되지만, 목적절을 ‘... 알 수 있도록’으로 처리하면 현대 표준어 합쇼체에서 더 자연스럽고 원문의 논리 관계도 분명해집니다.
  terminology: ‘어떤 뜻을 품고 있는지’는 γνώμη가 문맥상 가리키는 의향·입장·결심을 자연스럽게 반영합니다. 각주에서는 원문의 다소 어색한 문자적 구조를 ‘어떤 생각/의견을 지니고 있는지’로 설명하여, ‘뜻’이 유일한 해석인 것처럼 좁히지 않도록 했습니다.
  issues:
