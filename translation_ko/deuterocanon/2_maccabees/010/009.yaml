base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/009.yaml
  text: And all together they blessed the merciful God and were strengthened in their souls[b][a], being ready to wound not only men but even the fiercest wild beasts and iron walls.
  footnotes:
  - marker: a
    text: Or 'were strengthened in spirit' or more idiomatically 'took courage.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'to wound ... iron walls' is likely hyperbolic, expressing extreme boldness in battle.
    reason: cultural_note
translation:
  language: ko
  text: 모두 함께 자비로우신 하나님을 찬양하고, 영혼이 강건해졌습니다. 그들은 사람들만이 아니라 가장 사나운 들짐승과 쇠로 된 성벽까지도 상하게 할 준비가 되어 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영이 강건해졌습니다’ 혹은 더 관용적으로 ‘용기를 얻었습니다’.
    reason: lexical_alternative
  - marker: b
    text: ‘쇠로 된 성벽을 상하게 하다’는 표현은 전쟁에서의 극도의 담대함을 나타내는 과장법일 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
- source_word: ὁμοῦ δὲ πάντες
  english_pob_choice: And all together
  chosen_korean: 모두 함께
  alternatives_korean:
  - 함께 모두
  - 일제히
  lexicon: LSJ
  rationale: ὁμοῦ와 πάντες의 집합성을 함께 살리되, 한국어에서는 간결한 “모두 함께”가 자연스럽고 공동 행위를 분명히 보여 줍니다.
- source_word: εὐλόγησαν τὸν ἐλεήμονα θεόν
  english_pob_choice: they blessed the merciful God
  chosen_korean: 자비로우신 하나님을 찬양하고
  alternatives_korean:
  - 자비로우신 하나님을 축복하고
  - 긍휼이 많으신 하나님을 송축하고
  lexicon: LSJ
  rationale: 하나님께 대한 εὐλογέω는 문맥상 ‘찬양하다/송축하다’가 자연스럽고, ἐλεήμων은 ‘자비로우신’이 직접적입니다.
- source_word: ἐπερρώσθησαν ταῖς ψυχαῖς
  english_pob_choice: were strengthened in their souls
  chosen_korean: 영혼이 강건해졌습니다
  alternatives_korean:
  - 영으로 강해졌습니다
  - 마음이 굳세어졌습니다
  lexicon: LSJ
  rationale: ψυχαῖς의 본문 어휘를 완전히 지우지 않으면서도 한국어에서 부자연스러운 ‘영혼 안에서’보다 ‘영혼이 강건해졌습니다’가 더 자연스럽습니다.
- source_word: τιτρώσκειν ... σιδηρᾶ τείχη
  english_pob_choice: to wound ... iron walls
  chosen_korean: 상하게 할
  alternatives_korean:
  - 부상을 입힐
  - 찌를
  lexicon: LSJ
  rationale: τιτρώσκειν의 기본 의미는 상처를 내는 것이며, ‘쇠로 된 성벽’까지 포함하는 과장법을 한국어에서도 무리 없이 전달합니다.
theological_decisions:
- issue: ψυχαῖς의 번역에서 심리적/영적 뉘앙스 유지
  chosen_reading: 영혼이 강건해졌습니다
  alternative_readings:
  - 영으로 강해졌습니다
  - 마음이 굳세어졌습니다
  rationale: 이 구절은 영혼에 대한 교리 진술이 아니라 내적 담대함의 묘사이므로, 본문의 어휘 흔적을 남기면서 과도한 신학화는 피했습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy, preserve theological tension rather than resolve it
