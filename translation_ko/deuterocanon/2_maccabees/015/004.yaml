  text: But they declared[a], “The Lord lives; he himself is the ruler in heaven, the one who commanded the observance of the seventh day.”
  footnotes:
  - marker: a
    text: Or, “the Sabbath.” The Greek says “the seventh day,” referring to Sabbath observance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 대답했습니다. 「주님은 살아 계십니다. 그분 자신이 하늘의 통치자이시며, 일곱째 날을 지키도록 명령하신 분입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “안식일.” 그리스어는 문자적으로 “일곱째 날”이라고 하며, 안식일 준수를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποφηναμένων
  english_pob_choice: they declared
  chosen_korean: 그들은 대답했습니다
  alternatives_korean:
  - 그들은 선언했습니다
  - 그들은 말했습니다
  - 그들은 응답했습니다
  lexicon: LSJ
  rationale: 문맥상 공적·응답적 발화이므로 자연스러운 현대 한국어로는 ‘대답했습니다’가 가장 맞고, 단순한 ‘말했습니다’보다 응답의 성격을 살립니다.
- source_word: ὁ κύριος ζῶν
  english_pob_choice: The Lord lives
  chosen_korean: 주님은 살아 계십니다
  alternatives_korean:
  - 주님은 사십니다
  - 주님은 살아 있습니다
  lexicon: LSJ
  rationale: ‘살아 계십니다’는 하나님을 향한 존칭과 ‘The Lord lives’의 고백적 힘을 함께 살립니다.
- source_word: δυνάστης
  english_pob_choice: ruler
  chosen_korean: 통치자
  alternatives_korean:
  - 주권자
  - 다스리시는 분
  - 권세자
  lexicon: LSJ
  rationale: 하늘에서의 권위를 단순한 능력보다 통치 개념으로 드러내기 위해 ‘통치자’를 택했습니다.
- source_word: ἀσκεῖν τὴν ἑβδόμαδα
  english_pob_choice: the observance of the seventh day
  chosen_korean: 일곱째 날을 지키도록
  alternatives_korean:
  - 일곱째 날을 관찰하도록
  - 안식일을 지키도록
  - 일곱째 날을 준수하도록
  lexicon: LSJ
  rationale: 그리스어는 직역하면 ‘일곱째 날을 실천/행하도록’이지만, 문맥상 안식일 준수를 가리키므로 한국어에서는 관용적으로 ‘지키다’를 사용하되 원문 표현의 ‘일곱째 날’을 유지했습니다.
theological_decisions:
- issue: τὴν ἑβδόμαδα의 표면적 표현과 문맥적 의미
  chosen_reading: 본문에는 ‘일곱째 날’을 두고, 의미는 안식일 준수로 읽히도록 유지했습니다.
  alternative_readings:
  - 안식일
  - 안식일 준수
  rationale: 영어 POB가 본문에는 ‘the seventh day’를 두고 각주로 ‘the Sabbath’ 가능성을 보존한 점을 따라, 한국어 본문도 원문 표현을 살리면서 독자가 문맥상 안식일을 이해하도록 했습니다.
  doctrine_reference: 원문 우선 원칙; 의미상 대안은 각주로 보존
