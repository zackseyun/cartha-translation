translation:
  language: ko
  text: 그러므로 니카노르에 관한 일들이 이와 같이 전개되었고[a], 그때부터 히브리 사람들이 그 도시[b]를 차지하고 있었으므로, 나도 여기서 이 기록을 마치겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘전개되었고’는 문맥상 니카노르에 관한 일들이 ‘그와 같이 되어 갔거나 일어났다’는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 본문은 예루살렘을 이름으로 부르지 않고 단순히 ‘그 도시’라고 합니다.
    reason: source_note
