  rationale: 본문은 단순한 정보 전달이 아니라 책 전체의 종결을 선언하므로, 독자가 저자의 편집적 마무리를 알아차리도록 옮기는 것이 적절합니다.
  doctrine_reference: 문학적 종결 표지
