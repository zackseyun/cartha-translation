  - marker: b
    text: 본문은 예루살렘을 이름으로 부르지 않고 단순히 ‘그 도시’라고 합니다.
    reason: source_note
lexical_decisions:
- source_word: Τῶν οὖν κατὰ Νικάνορα χωρησάντων οὕτως
  english_pob_choice: since the events concerning Nicanor had turned out in this way
