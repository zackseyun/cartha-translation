  source_fidelity: ‘끝났고’는 χωρησάντων(일들이 그렇게 되어 가다·전개되다)의 넓은 의미를 지나치게 종결 사건으로 한정합니다. 또한 κρατηθείσης는 도시가 히브리 사람들에게 확보·점유된 상태를 가리키므로, ‘차지하고 있었다’가 한국어로 더 직접적으로 전달합니다.
