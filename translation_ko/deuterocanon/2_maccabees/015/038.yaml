  terminology: ‘니카노르’, ‘히브리 사람들’, ‘그 도시’, ‘기록’은 문맥과 원문의 지칭을 적절히 보존합니다. 특히 ‘그 도시’는 예루살렘이라는 문맥상 지시체를 본문에서 명시하지 않는 원문을 따릅니다.
