  lexicon: LSJ
  rationale: 본문의 민족 지칭을 직역해 ‘히브리 사람들’로 두어, 후대 종교집단명처럼 들릴 수 있는 표현을 피했습니다.
- source_word: καὶ αὐτὸς αὐτόθι τὸν λόγον καταπαύσω
