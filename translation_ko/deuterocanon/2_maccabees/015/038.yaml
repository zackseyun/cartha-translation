translation:
  language: ko
  text: 그러므로 니카노르에 관한 사건이 이와 같이 끝났고, 그때부터 그 도시가 히브리 사람들의 손에 남아 있었으므로, 나도 여기서 내 기록을 마치겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
