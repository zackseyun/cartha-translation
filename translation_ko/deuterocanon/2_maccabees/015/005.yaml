base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/005.yaml
  text: But the other said[a], “I also am a ruler upon the earth[b], the one who commands men to take up arms and to carry out the king’s business.” Yet he did not prevail to accomplish his savage purpose.
  footnotes:
  - marker: a
    text: Or “to bear arms.” The Greek literally says “to take/lift the weapons,” an idiom for military action.
    reason: lexical_alternative
  - marker: b
    text: Or “his cruel plan” or “his monstrous resolve.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 다른 이는 「나도 땅 위의 지배자이며, 무기를 들라고 명령하고 왕의 일을 수행하게 하는 자다」라고 말했습니다. 그러나 그는 자신의 흉악한 뜻을 이루지 못했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “무기들을 들어 올리다”로, 군사 행동을 뜻하는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그의 잔혹한 계획” 또는 “그의 괴물 같은 결심”일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνάστης
  english_pob_choice: ruler
  chosen_korean: 지배자
  alternatives_korean:
  - 통치자
  - 군주
  - 권세자
  lexicon: LSJ
  rationale: 스스로를 땅 위의 권력자로 내세우는 말이므로, 일상적이면서도 권위성을 살리는 ‘지배자’가 적절합니다. ‘군주’는 왕정 뉘앙스를, ‘권세자’는 다소 문어적 색채를 강하게 띱니다.
- source_word: προστατάσσων
  english_pob_choice: the one who commands
  chosen_korean: 명령하고
  alternatives_korean:
  - 지시하고
  - 명하고
  - 지휘하고
  lexicon: LSJ
  rationale: 분사로 반복적·정체성적 기능을 띠지만 한국어에서는 자연스러운 동사구로 풀어 ‘명령하고’로 옮겼습니다. 권위적 지시의 힘을 가장 직접적으로 드러냅니다.
- source_word: αἴρειν τὰ ὅπλα
  english_pob_choice: to take up arms
  chosen_korean: 무기를 들라고
  alternatives_korean:
  - 무기를 들다
  - 전투에 나서다
  - 무장하라고
  lexicon: LSJ
  rationale: 직역하면 ‘무기를 들다’이지만, 문맥상 군사 행동을 지시하는 관용적 표현이므로 한국어에서는 목적절로 풀어 자연스럽게 처리했습니다. 영어 POB의 각주가 지적한 관용성을 반영합니다.
- source_word: τὰς βασιλικὰς χρείας ἐπιτελεῖν
  english_pob_choice: to carry out the king’s business
  chosen_korean: 왕의 일을 수행하게
  alternatives_korean:
  - 왕의 업무를 수행하게
  - 왕의 명을 집행하게
  - 왕실의 일을 처리하게
  lexicon: LSJ
  rationale: χρείας는 ‘업무/일/사무’의 폭이 있어, 왕과 관련된 공적인 수행을 넓게 담는 ‘왕의 일’이 적절합니다. ‘수행하다’는 공식적이고 현대적인 문체와도 맞습니다.
- source_word: σχέτλιον βούλημα
  english_pob_choice: his savage purpose
  chosen_korean: 흉악한 뜻
  alternatives_korean:
  - 잔혹한 계획
  - 야만적인 의도
  - 사악한 결심
  lexicon: LSJ
  rationale: σχέτλιον은 강하게 비난하는 형용사로, 단순한 ‘나쁜 계획’보다 훨씬 거칩니다. βούλημα은 구체적 실행계획보다 내적 의지/의도를 가리키므로 ‘뜻’이 본문에 더 가깝습니다.
theological_decisions:
- issue: 자기 선언의 과도한 해석을 피하면서 권력 주장 표현 유지
  chosen_reading: 화자는 자신을 지상의 권력자라고 직접 주장하는 말로 그대로 옮기고, 그 정체를 추가로 규정하지 않았습니다.
  alternative_readings:
  - 나는 땅의 왕이다
  - 나는 땅 위에 권세를 가진 자다
  rationale: 본문은 자기 과시적 발화를 기록할 뿐, 번역자가 그 인물의 정체를 확정할 필요는 없습니다. ‘지배자’는 ‘ruler’의 의미를 살리면서도 해석을 과잉하지 않습니다.
  doctrine_reference: 서술의 긴장을 보존하고 본문이 말하는 범위를 넘지 않음
