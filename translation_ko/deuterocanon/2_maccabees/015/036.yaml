  text: And they all decreed by common vote that this day should by no means be left unmarked,[a]
  footnotes:
  - marker: a
    text: Or 'that this day should in no way be left unobserved' or 'without commemoration.' The Greek ἀπαρασήμαντον literally means 'without a distinguishing mark/sign,' here referring to public remembrance or observance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 모두 공동의 의결로 이 날을 결코 기념 없이 지나가게 하지 않기로 결정하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 날을 어떤 방식으로도 표지 없이 두지 않도록’ 또는 ‘기념하지 않은 채 두지 않도록’으로 옮길 수 있습니다. 그리스어 ἀπαρασήμαντον은 문자적으로 ‘표식이나 표지가 없는’이라는 뜻이며, 여기서는 공적으로 기억하거나 기념하지 않는 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδογμάτισαν
  english_pob_choice: they decreed
  chosen_korean: 결정하였습니다
  alternatives_korean:
  - 포고하였습니다
  - 의결하였습니다
  lexicon: LSJ
  rationale: 공적이고 공식적인 결정을 가리키므로, 현대 한국어에서는 지나치게 법령문처럼 딱딱하지 않으면서도 절차적 성격을 살리는 ‘결정하다’를 택했습니다.
- source_word: μετὰ κοινοῦ ψηφίσματος
  english_pob_choice: by common vote
  chosen_korean: 공동 결의로
  alternatives_korean:
  - 공동 투표로
  - 공동 의결로
  - 공통 결의로
  lexicon: LSJ
  rationale: ψήφισμα의 공적 의결/결의 뉘앙스를 살리기 위해 ‘공동 결의로’로 옮겼습니다. 단순한 표결보다 합의된 결의의 느낌이 더 분명합니다.
- source_word: ἀπαρασήμαντον
  english_pob_choice: unmarked
  chosen_korean: 표나지 않게
  alternatives_korean:
  - 기념되지 않게
  - 표시되지 않게
  - 기억되지 않게
  lexicon: LSJ
  rationale: 직역상 ‘표식/표지가 없는’ 뜻이지만, 절기적 맥락에서는 ‘주목받지 않게, 기념되지 않게’의 뜻이므로 한국어에서는 관용적으로 ‘표나지 않게’로 처리해 원문의 은유를 유지했습니다.
- source_word: μηδαμῶς ἐᾶσαι
  english_pob_choice: by no means be left
  chosen_korean: 결코 … 두지 않기로
  alternatives_korean:
  - 절대로 … 남겨 두지 않기로
  - 어떠한 경우에도 … 두지 않기로
  lexicon: LSJ
  rationale: 강한 부정 부사 μηδαμῶς의 힘을 한국어 부정 표현 ‘결코’로 살리고, 수동적 영어 표현에 해당하는 의미를 자연스럽게 풀어 ‘두지 않기로’로 옮겼습니다.
