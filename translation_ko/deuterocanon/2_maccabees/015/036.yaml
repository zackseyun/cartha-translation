  text: And they all decreed by common vote that this day should by no means be left unmarked,[a]
  footnotes:
  - marker: a
    text: Or 'that this day should in no way be left unobserved' or 'without commemoration.' The Greek ἀπαρασήμαντον literally means 'without a distinguishing mark/sign,' here referring to public remembrance or observance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 그들은 모두 공동 결의로 이 날을 결코 표나지 않게 두지 않기로 결정하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 날을 어떤 방식으로도 기념하지 않은 채 두지 않도록’ 또는 ‘기념 없이 두지 않도록’으로 옮길 수 있습니다. 그리스어 ἀπαρασήμαντον은 문자적으로는 ‘표식/표지가 없는’이라는 뜻으로, 여기서는 공적 기억이나 기념을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδογμάτισαν
  english_pob_choice: they decreed
  chosen_korean: 결정하였습니다
  alternatives_korean:
