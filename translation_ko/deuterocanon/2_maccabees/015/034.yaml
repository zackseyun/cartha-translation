  yaml_path: translation/deuterocanon/2_maccabees/015/034.yaml
  text: And they all blessed the manifest Lord toward heaven[a], saying, “Blessed is the one who has kept his own place undefiled.”
  footnotes:
  - marker: a
    text: Or 'his own sanctuary' or 'his own temple'; the Greek says 'place,' but the context likely refers to the holy place preserved from defilement.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 모두 하늘을 향하여 그 나타나신 주를 찬송하며 말했습니다. “자기 자리를 더럽혀지지 않게 지키신 분은 복되십니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘자기 자리’는 문맥상 더럽혀지지 않게 보존된 성소나 성전을 가리킬 수 있습니다. 그러나 원어 τόπος는 기본적으로 ‘자리, 장소’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὸν οὐρανόν
  english_pob_choice: toward heaven
  chosen_korean: 하늘을 향하여
  alternatives_korean:
  - 하늘로
  - 하늘을 향해
  - 하늘 쪽으로
  lexicon: LSJ
  rationale: εἰς + 대격은 여기서 찬양의 방향을 나타내므로, 한국어도 방향성을 살린 ‘하늘을 향하여’로 옮겼습니다.
- source_word: εὐλόγησαν
  english_pob_choice: blessed
  chosen_korean: 찬송하며
  alternatives_korean:
  - 축복하며
  - 복을 빌며
  - 찬양하며
  lexicon: LSJ
  rationale: 문맥상 하나님을 향한 경배의 행위이므로 자연스러운 한국어 예배어인 ‘찬송하며’를 택했습니다. 다만 뒤의 ‘복되십니다’와 어휘 대응을 위해 너무 평면적인 ‘찬양하다’보다 예배적 뉘앙스를 살렸습니다.
- source_word: τὸν ἐπιφανῆ κύριον
  english_pob_choice: the manifest Lord
  chosen_korean: 그 나타나신 주
  alternatives_korean:
  - 드러나신 주
  - 나타나신 주님
  - 드러나신 주님
  lexicon: LSJ
  rationale: ἐπιφανής는 ‘드러난, 나타난’의 뜻이므로 ‘나타나신’이 가장 직접적입니다. κύριος는 여기서 기본적으로 ‘주’로 두어 POB 용례를 따랐습니다.
- source_word: τὸν ἑαυτοῦ τόπον
  english_pob_choice: his own place
  chosen_korean: 자기 자리
  alternatives_korean:
  - 자기 곳
  - 자기 장소
  - 자기 성소
  lexicon: LSJ
  rationale: τόπος의 기본 의미를 살려 ‘자리’로 옮겼습니다. 본문이 특정 성전 공간을 가리킬 가능성은 있으나, 원어 자체의 더 넓은 표현을 본문에서 유지했습니다.
- source_word: ἀμίαντον
  english_pob_choice: undefiled
  chosen_korean: 더럽혀지지 않게
  alternatives_korean:
  - 더럽혀지지 않은
  - 부정하지 않게
  - 오염되지 않게
  lexicon: LSJ
  rationale: 형용사 ἀμίαντος의 결과 상태를 한국어에서 자연스럽게 풀어, 지켜진 상태를 강조하는 ‘더럽혀지지 않게’로 옮겼습니다.
theological_decisions:
- issue: ἑαυτοῦ τόπος를 본문에서 성소/성전으로 구체화할지 여부
  chosen_reading: 본문은 ‘자기 자리’로 유지하고, 성소/성전 해석은 본문 밖으로 두었습니다.
  alternative_readings:
  - 자기 성소
  - 자기 성전
  rationale: 원어는 τόπος로 더 넓은 표현을 쓰므로, 문맥상 성전 가능성이 높더라도 본문에서 구체 명사를 도입하지 않았습니다. 이는 원문-우선 번역 원칙을 지키기 위한 선택입니다.
  doctrine_reference: 원어 우선, 과잉 구체화 회피
- issue: εὐλόγησαν의 번역을 ‘복을 빌다’로 볼지 ‘찬송하다’로 볼지
  chosen_reading: 하나님을 향한 공적 경배로 이해해 ‘찬송하다’ 계열로 옮겼습니다.
  alternative_readings:
  - 복을 빌다
  - 축복하다
  rationale: 문맥상 사람들이 주를 향해 올린 반응은 청원보다 찬양에 가깝습니다. 따라서 예배적 행위를 분명히 드러내되, 어휘상 ‘복되십니다’와의 연결은 유지했습니다.
  doctrine_reference: 예배 언어의 문맥적 판정
