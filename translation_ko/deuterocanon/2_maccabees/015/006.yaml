translation:
  language: ko
  text: 그리고 니카노르[a]는 온갖 확신과 거만한 오만함으로, 유다 주변에 있는 이들에게 공통된 처분을 내리기로 결심했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다의 편에 있는 이들에게 공통된 처벌을 가하기로 결심했다’는 뜻일 수 있습니다. κοινὸν ... τρόπον은 관용적이고 다소 어려운 표현이므로, 본문은 문자적 형태보다 문맥상 가능성이 높은 뜻을 옮겼습니다.
    reason: lexical_alternative
