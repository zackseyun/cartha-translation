  yaml_path: translation/deuterocanon/2_maccabees/015/002.yaml
  text: But when the Jews who were being compelled to accompany him said[a], “Do not destroy them in so savage and barbarous a way; rather[b], assign honor to the day that has been specially honored in holiness by the One who watches over all,”
  footnotes:
  - marker: a
    text: Or, “Do not kill them so savagely and barbarously.” The Greek verb can denote killing or destroying.
    reason: lexical_alternative
  - marker: b
    text: Literally, “assign honor/glory to the day that has been preferred in holiness by the One who watches over all.” The expression refers to showing due respect to the sacred day.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그와 함께 강제로 동행하던 유대인들이 말하였습니다[a], “그들을 그렇게 잔혹하고 야만적으로 멸하지 마십시오. 오히려 모든 것을 살피시는 분께서 거룩함 가운데 특별히 높이신 그날에 영예를 돌리십시오[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들을 그렇게 잔혹하고 야만적으로 죽이지 마십시오.” 그리스어 동사는 죽이다 또는 멸하다를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면, “모든 것을 살피시는 분께서 거룩함 가운데 특별히 높이신 날에 영예를 돌리십시오”입니다. 이 표현은 그 신성한 날에 존중을 나타내라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ ἀνάγκην συνεπομένων αὐτῷ
  english_pob_choice: who were being compelled to accompany him
  chosen_korean: 그와 함께 억지로 따라가던
  alternatives_korean:
  - 그와 함께 강제로 동행하던
  - 그에게 억지로 동반하던
  lexicon: LSJ
  rationale: 강제된 동행이라는 핵심을 살리되, 한국어에서 자연스럽게 읽히는 ‘억지로 따라가던’으로 압축했습니다.
- source_word: ἀγρίως καὶ βαρβάρως
  english_pob_choice: in so savage and barbarous a way
  chosen_korean: 그렇게 잔혹하고 야만적으로
  alternatives_korean:
  - 그렇게 사납고 야만적으로
  - 그렇게 잔인하고 야만스럽게
  lexicon: LSJ
  rationale: 두 부사가 겹쳐 만드는 강한 폭력성을 살리기 위해 ‘잔혹하고 야만적으로’로 이중 강도를 유지했습니다.
- source_word: ἀπολέσῃς
  english_pob_choice: destroy
  chosen_korean: 멸하지 마십시오
  alternatives_korean:
  - 죽이지 마십시오
  - 파괴하지 마십시오
  lexicon: LSJ
  rationale: 문맥상 살해를 포함할 수 있지만, POB의 ‘destroy’와 맞추어 더 넓은 파멸 의미를 가진 ‘멸하다’를 택했습니다.
- source_word: δόξαν δὲ ἀπομέρισον
  english_pob_choice: rather, assign honor
  chosen_korean: 오히려 … 합당한 영예를 돌리십시오
  alternatives_korean:
  - 오히려 … 영광을 나누어 주십시오
  - 오히려 … 존귀를 배분하십시오
  lexicon: LSJ
  rationale: δόξα를 여기서는 신학적 ‘영광’보다 날에 대한 공적 존중으로 이해해야 하므로, 한국어에서는 ‘영예를 돌리다’로 자연스럽게 옮겼습니다.
- source_word: ὑπὸ τοῦ πάντα ἐφορῶντος
  english_pob_choice: by the One who watches over all
  chosen_korean: 모든 것을 살피시는 분께서
  alternatives_korean:
  - 모든 것을 감찰하시는 분께서
  - 만물을 감찰하시는 분께서
  lexicon: LSJ
  rationale: 하나님을 직접 이름하지 않는 경외적 우회표현을 살려, 전능한 감시보다 돌봄과 주시를 함께 담는 ‘살피시는 분’으로 번역했습니다.
theological_decisions:
- issue: 거룩한 날에 대한 존중 표현
  chosen_reading: 거룩함으로 특별히 높이신 그날
  alternative_readings:
  - 거룩하게 된 그날
  - 하나님께서 거룩하게 구별하신 그날
  rationale: 원문은 날이 이미 특별히 선호/높임을 받은 상태를 말하며, finite verb로 ‘성별하다’를 명시하지 않으므로 그 긴장을 유지하는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
