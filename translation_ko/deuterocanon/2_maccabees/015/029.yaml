translation:
  language: ko
  text: 그런데 외침과 소동이 일어나자, 그들은 조상들의 말로 주권자를 찬양했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주권자’는 그리스어 δυνάστης의 가능한 번역 가운데 하나이며, 문맥에 따라 ‘권세 있는 분’ 또는 ‘통치자’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘조상들의 말’은 문자적으로는 ‘조상들의 목소리’에 가깝지만, 여기서는 조상에게서 전해진 전통적인 언어를 가리키는 표현으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης δὲ κραυγῆς καὶ ταραχῆς
  english_pob_choice: And when a cry and turmoil arose
  chosen_korean: “외침과 소동이 일어나자”
  alternatives_korean:
  - “외침과 혼란이 생기자”
  - “한 외침과 소동이 일어나자”
  lexicon: BDAG
  rationale: γενoμένης의 상황적 용법을 자연스러운 시간 부사절로 옮기고, κραυγή와 ταραχή는 전투적 장면에 맞게 ‘외침’과 ‘소동’으로 살려서 사건의 급박함을 전달했습니다.
- source_word: τὸν δυνάστην
  english_pob_choice: the Sovereign
  chosen_korean: “주권자”
  alternatives_korean:
  - “전능하신 분”
  - “통치자”
  - “권세자”
  lexicon: BDAG
  rationale: δυνάστης는 힘을 가진 통치자라는 뜻이지만, 여기서는 하나님께 대한 경외적 호칭이므로 ‘주권자’가 권위와 통치성을 함께 살리면서도 한국어에서 자연스럽습니다.
- source_word: τῇ πατρίῳ φωνῇ
  english_pob_choice: in their ancestral language
  chosen_korean: “조상들의 말로”
  alternatives_korean:
  - “조상의 언어로”
  - “선조들의 말로”
  - “부모들의 목소리로”
  lexicon: BDAG
  rationale: φωνή가 여기서는 실제 ‘목소리’보다 언어/말을 뜻하므로, 직역을 피하면서도 πατρίος의 ‘조상들의/전통적인’ 뉘앙스를 보존하는 표현으로 옮겼습니다.
- source_word: εὐλόγουν
  english_pob_choice: they blessed
  chosen_korean: “찬양했습니다”
  alternatives_korean:
  - “축복했습니다”
  - “복을 빌었습니다”
  - “찬송했습니다”
  lexicon: BDAG
  rationale: εὐλογέω는 문자적으로 ‘복을 말하다’이지만, 하나님을 대상으로 할 때 한국어에서는 ‘찬양하다’가 문맥상 가장 자연스럽고 의미를 흐리지 않습니다.
theological_decisions:
- issue: τὸν δυνάστην의 신적 호칭 보존
  chosen_reading: ‘주권자’로 옮겨 하나님의 통치권을 드러내되, 본문의 일반적 호칭성을 유지했습니다.
  alternative_readings:
  - ‘전능하신 분’
  - ‘통치자’
  rationale: 그리스어는 특정 교리 용어보다 ‘권세를 지닌 분’이라는 호칭에 가깝기 때문에, 신학적으로 과도하게 규정하지 않는 범위에서 하나님의 주권을 강조하는 번역을 선택했습니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; preserve theological tension rather than resolve it.'
