  yaml_path: translation/deuterocanon/2_maccabees/015/026.yaml
  text: But those around Judas joined battle with the enemies with invocation and prayers[a][b].
  footnotes:
  - marker: a
    text: Or 'with calling upon God and prayers.' The Greek says 'with invocation and prayers,' leaving the object of the invocation unstated in this clause.
    reason: lexical_alternative
  - marker: b
    text: '''Prayers'' could also be rendered ''vows,'' since the Greek word can bear either sense depending on context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 유다와 함께한 이들은 부르짖음과 기도로 적들과 맞섰습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘부르짖음’은 ἐπίκλησις의 가능한 번역입니다. 이는 신적 도움을 부르는 행위를 가리킬 수 있으나, 본문은 이 절에서 그 대상을 명시하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: εὐχή는 문맥에 따라 ‘기도’ 또는 ‘서원’으로 번역될 수 있습니다. 여기서는 전투 장면에서 ἐπίκλησις와 함께 쓰인 점을 따라 ‘기도’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ περὶ τὸν Ἰούδαν
  english_pob_choice: those around Judas
  chosen_korean: 유다를 따르던 이들
  alternatives_korean:
  - 유다 주변의 이들
  - 유다와 함께한 이들
  lexicon: LSJ
  rationale: περὶ + 대격은 지도자 주위의 사람들, 곧 그에게 속한 무리를 가리킬 수 있으므로, 한국어에서는 군사적 관계를 과도하게 덧붙이지 않으면서도 자연스럽게 풀었습니다.
- source_word: μετὰ ἐπικλήσεως
  english_pob_choice: with invocation
  chosen_korean: 호소와
  alternatives_korean:
  - 부르짖음과
  - 하나님을 부르며
  lexicon: LSJ
  rationale: ἐπίκλησις는 ‘부름/호소/호명’의 종교적 행위를 가리킬 수 있어, 본문이 명시하지 않은 대상은 덧붙이지 않고 ‘호소’로 옮겼습니다.
- source_word: καὶ εὐχῶν
  english_pob_choice: and prayers
  chosen_korean: 기도로
  alternatives_korean:
  - 서원과
  - 간구로
  lexicon: LSJ
  rationale: εὐχή는 문맥에 따라 ‘기도’ 또는 ‘서원’이 될 수 있으나, 전투 문맥에서 ἐπίκλησις와 나란히 놓인 점을 고려하면 여기서는 ‘기도’가 더 직접적입니다.
- source_word: συνῆψαν τοῖς πολεμίοις
  english_pob_choice: joined battle with the enemies
  chosen_korean: 적들과 맞섰습니다
  alternatives_korean:
  - 적들과 전투를 벌였습니다
  - 적들과 교전했습니다
  lexicon: LSJ
  rationale: συνάπτω는 군사 문맥에서 ‘교전하다, 맞붙다’의 뜻이므로, 현대 한국어의 자연스러운 전투 표현으로 압축하되 대립 관계는 유지했습니다.
theological_decisions:
- issue: ἐπίκλησις의 종교적 뉘앙스 보존
  chosen_reading: 단순한 군사적 ‘호소’가 아니라 기도와 함께 이루어지는 신앙 행위로 유지했습니다.
  alternative_readings:
  - 부르짖음
  - 하나님께 부르짖음
  rationale: 그리스어는 이 절에서 부름의 대상을 명시하지 않으므로, 본문이 가진 종교적 긴장감은 살리되 대상은 추가하지 않는 것이 적절합니다.
  doctrine_reference: Translation philosophy §1, §3
