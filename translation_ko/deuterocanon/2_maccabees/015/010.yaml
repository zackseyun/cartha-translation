  text: And after stirring up their spirits[a], he urged them on[b], at the same time pointing out the godlessness of the nations and the violation of oaths.
  footnotes:
  - marker: a
    text: Or 'the breaking of oaths.'
    reason: lexical_alternative
  - marker: b
    text: '''Nations'' could also be rendered ''Gentiles.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들의 격정을 북돋운 뒤, 그는 그들을 독려하면서 동시에 이방 민족들의 불경건함과 맹세의 위반을 지적했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘맹세들을 어기는 것’.
    reason: lexical_alternative
  - marker: b
    text: ‘이방 민족들’은 ‘이방인들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς θυμοῖς διεγείρας αὐτούς
  english_pob_choice: after stirring up their spirits
  chosen_korean: 그들의 격정을 북돋운 뒤
  alternatives_korean:
  - 그들의 마음을 북돋운 뒤
  - 그들의 용기를 북돋운 뒤
  - 그들을 분노하게 한 뒤
  lexicon: LSJ
  rationale: θυμός는 분노만이 아니라 격정, 기백, 용기까지 포함할 수 있으므로, 군사적 격려 문맥에 맞게 ‘격정’을 택해 내적 동력을 살렸습니다.
- source_word: παρήγγειλεν
  english_pob_choice: he urged them on
  chosen_korean: 그는 그들을 독려하면서
  alternatives_korean:
  - 그는 그들에게 명령하면서
  - 그는 그들을 재촉하면서
  - 그는 그들에게 지시하면서
  lexicon: LSJ
  rationale: 이 동사는 단순 명령보다 촉구·독려의 뉘앙스를 띠므로, 전투적 연설의 추진력을 살려 ‘독려하다’로 옮겼습니다.
- source_word: ἅμα παρειδείκνυς
  english_pob_choice: at the same time pointing out
  chosen_korean: 동시에 ... 지적했습니다
  alternatives_korean:
  - 아울러 ... 보여 주면서
  - 동시에 ... 드러내면서
  - 함께 ... 설명하면서
  lexicon: LSJ
  rationale: 동시 진행을 나타내는 부사적 분사로 보아, 한국어에서는 자연스럽게 ‘동시에’와 ‘지적하다’로 연결했습니다.
- source_word: τὴν τῶν ἐθνῶν ἀθεσίαν
  english_pob_choice: the godlessness of the nations
  chosen_korean: 이방 민족들의 불경건함
  alternatives_korean:
  - 민족들의 경건 없음
  - 이방인들의 무신앙
  - 민족들의 불경함
  lexicon: LSJ
  rationale: ἀθεσία는 신앙 전통을 배반한 ‘불경건/불의’의 성격을 가지므로, 역사 문맥의 정치·종교적 적대성을 살려 ‘이방 민족들’과 ‘불경건함’으로 옮겼습니다.
- source_word: τὴν τῶν ὅρκων παράβασιν
  english_pob_choice: the violation of oaths
  chosen_korean: 맹세의 위반
  alternatives_korean:
  - 맹세를 어김
  - 서약의 파기
  - 맹세의 파괴
  lexicon: LSJ
  rationale: παράβασις는 율법 위반의 어감까지 가진 ‘위반/범함’이므로, 서약의 파기를 직접 드러내는 표준어로 ‘맹세의 위반’을 택했습니다.
theological_decisions:
- issue: ἐθνῶν의 번역 범위
  chosen_reading: ‘이방 민족들’로 번역해 정치적·종교적 대립을 함께 드러냈습니다.
  alternative_readings:
  - 민족들
  - 이방인들
  - 나라들
  rationale: 이 장면은 단순 인종 구분보다 대적 세력의 종교적 불경건을 부각하므로, ‘이방 민족들’이 문맥의 긴장을 가장 잘 보존합니다.
  doctrine_reference: 역사서 문맥에서의 어휘 선택; later ecclesial overtones 최소화
