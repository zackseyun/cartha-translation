  yaml_path: translation/deuterocanon/2_maccabees/015/035.yaml
  text: And he hung Nikanor’s severed head from the citadel[b][a], visible to all and a clear sign of the Lord’s help.
  footnotes:
  - marker: a
    text: Or 'Nikanor’s head.' The Greek προτομή can denote the front part or head; in this context, with Nikanor already beheaded in the preceding narrative, 'severed head' makes the sense explicit.
    reason: lexical_alternative
  - marker: b
    text: Or 'from the citadel/fortress height.' The Greek ἄκρας refers to a fortified high place.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 니카노르의 잘린 머리를 성채에서 매달아 두어, 모든 사람에게 보이게 하고 주의 도우심의 분명한 표징이 되게 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘니카노르의 머리’. προτομή는 앞부분이나 머리를 가리킬 수 있으나, 앞 문맥에서 이미 참수된 상태이므로 여기서는 ‘잘린 머리’로 뜻을 분명히 했습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘성채/요새 꼭대기에서’. ἄκρας는 방비된 높은 지점을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέδησεν
  english_pob_choice: hung
  chosen_korean: 매달아 두어
  alternatives_korean:
  - 걸어 두어
  - 매달아 놓고
  lexicon: LSJ
  rationale: 공개적으로 ‘매달아 전시하다’는 동작을 자연스럽게 살리되, 이어지는 목적절까지 매끄럽게 연결하도록 옮겼습니다.
- source_word: προτομὴν
  english_pob_choice: severed head
  chosen_korean: 잘린 머리
  alternatives_korean:
  - 잘려 나온 머리
  - 머리
  lexicon: LSJ
  rationale: 앞선 서사에서 이미 목이 벤 뒤의 상태를 전제하므로, 단순한 ‘머리’보다 절단된 상태를 드러내는 표현이 원문 의미를 더 분명히 반영합니다.
- source_word: ἄκρας
  english_pob_choice: citadel
  chosen_korean: 성채
  alternatives_korean:
  - 요새
  - 성곽 꼭대기
  lexicon: LSJ
  rationale: ἄκρα는 군사적으로 방비된 높은 지점을 가리키므로, 한국어에서는 ‘성채’가 지형적·군사적 함의를 가장 자연스럽게 전달합니다.
- source_word: ἐπίδηλον πᾶσιν, καὶ φανερὸν
  english_pob_choice: visible to all and a clear
  chosen_korean: 모든 사람에게 보이게 하고 … 분명한
  alternatives_korean:
  - 모든 사람에게 분명히 보이게 하고 … 뚜렷한
  - 모두가 볼 수 있게 하여 … 명백한
  lexicon: LSJ
  rationale: 두 형용사를 분리해, 공개적 노출(ἐπίδηλον)과 그 결과로서의 분명함(φανερὸν)을 함께 살렸습니다.
- source_word: τοῦ κυρίου βοηθείας
  english_pob_choice: the Lord’s help
  chosen_korean: 주의 도우심
  alternatives_korean:
  - 주님의 도움
  - 주님의 구원
  - 주님의 원조
  lexicon: LSJ
  rationale: τοῦ κυρίου는 본 프로젝트 기준에 따라 ‘주’로 옮기고, βοηθεία는 단순한 도움이 아니라 전투 상황에서의 실제적 구원을 포함하는 ‘도우심’으로 표현했습니다.
theological_decisions:
- issue: 주께서 주시는 도움을 표징으로 제시하는 구조
  chosen_reading: 니카노르의 공개적 치욕이 곧 주의 도우심을 가리키는 분명한 표징이라는 의미를 유지했습니다.
  alternative_readings:
  - 단순한 승리의 증거
  - 하나님의 개입의 표시
  rationale: σημεῖον은 단순한 증거보다 ‘표징’에 가깝고, 본문은 승리의 원인을 인간의 힘이 아니라 주의 도우심에 둡니다.
  doctrine_reference: 2 Maccabees의 섭리 강조와 표징(sēmeion) 어휘 사용
