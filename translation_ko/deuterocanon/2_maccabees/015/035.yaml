  - 모두가 볼 수 있게 하여 … 명백한
  lexicon: LSJ
  rationale: 두 형용사를 분리해, 공개적 노출(ἐπίδηλον)과 그 결과로서의 분명함(φανερὸν)을 함께 살렸습니다.
- source_word: τοῦ κυρίου βοηθείας
  english_pob_choice: the Lord’s help
  chosen_korean: 주의 도우심
  alternatives_korean:
  - 주님의 도움
  - 주님의 구원
  - 주님의 원조
  lexicon: LSJ
  rationale: τοῦ κυρίου는 본 프로젝트 기준에 따라 ‘주’로 옮기고, βοηθεία는 단순한 도움이 아니라 전투 상황에서의 실제적 구원을 포함하는 ‘도우심’으로 표현했습니다.
theological_decisions:
- issue: 주께서 주시는 도움을 표징으로 제시하는 구조
  chosen_reading: 니카노르의 공개적 치욕이 곧 주의 도우심을 가리키는 분명한 표징이라는 의미를 유지했습니다.
  alternative_readings:
  - 단순한 승리의 증거
  - 하나님의 개입의 표시
  rationale: σημεῖον은 단순한 증거보다 ‘표징’에 가깝고, 본문은 승리의 원인을 인간의 힘이 아니라 주의 도우심에 둡니다.
  doctrine_reference: 2 Maccabees의 섭리 강조와 표징(sēmeion) 어휘 사용
