  source_fidelity: 원문의 κατειλημμένοις가 나타내는 성 안에 갇힌 상태와 οὐ πάρεργος의 ‘결코 가볍지 않음’을 대체로 잘 옮겼습니다. 다만 ἐν ὑπαίθρῳ는 단순히 ‘들판’이라기보다 성 안과 대비되는 바깥의 개활지를 가리키므로, 이를 더 정확히 드러내는 편이 좋습니다. 또한 ταρασσομένοις는 앞의 불안이 생긴 이유를 나타내므로 접속 관계를 본문에서 분명히 했습니다.
  naturalness: ‘마음이 흔들리고 있었습니다’도 이해되지만, 전쟁 소식으로 인한 정서적 동요에는 ‘동요하고 있었습니다’가 현대의 격식 있는 문맥에서 더 자연스럽습니다. ‘그 불안은 결코 작은 일이 아니었습니다’는 의미는 맞지만, ‘그들이 느낀 불안은 결코 가볍지 않았습니다’가 한국어답습니다.
