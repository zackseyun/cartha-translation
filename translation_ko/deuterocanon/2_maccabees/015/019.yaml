  yaml_path: translation/deuterocanon/2_maccabees/015/019.yaml
  text: And for those shut up in the city, the anxiety also was no small matter, as they were troubled about the attack in the open country.
  footnotes:
  - marker: a
    text: Or 'the assault in the open field.' The Greek phrase contrasts those in the city with the fighting taking place outside.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 성 안에 갇혀 있던 사람들에게도 그 불안은 결코 작은 일이 아니었습니다. 그들은 들판에서 벌어지는 공격 때문에 마음이 흔들리고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘들판에서의 공격’입니다. 그리스어 표현은 성 안의 사람들과 바깥에서 벌어지는 전투를 대비시킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς ἐν τῇ πόλει κατειλημμένοις
  english_pob_choice: those shut up in the city / those confined in the city
  chosen_korean: 성 안에 갇혀 있던 사람들
  alternatives_korean:
  - 성 안에 갇혀 있던 이들
  - 도시에 갇혀 있던 이들
  - 성 안에 포위된 사람들
  lexicon: LSJ
  rationale: κατειλημμένοις는 단순한 ‘있던’이 아니라 외부 상황에 의해 안에 갇혀 있는 상태를 가리키므로, 자연스러운 현대 한국어로 ‘갇혀 있던’이 그 압박감을 가장 잘 살립니다.
- source_word: οὐ πάρεργος ἀγωνία
  english_pob_choice: the anxiety also was no small matter
  chosen_korean: 그 불안은 결코 작은 일이 아니었습니다
  alternatives_korean:
  - 그 불안은 작은 일이 아니었습니다
  - 그 불안은 사소한 문제가 아니었습니다
  - 그 불안은 매우 심각했습니다
  lexicon: LSJ
  rationale: οὐ πάρεργος는 ‘곁일이 아닌’, 곧 부차적이지 않다는 뜻이어서, 단순한 직역보다 ‘결코 작은 일이 아니었습니다’가 긴박함과 중요성을 함께 전달합니다.
- source_word: ἀγωνία
  english_pob_choice: anxiety
  chosen_korean: 불안
  alternatives_korean:
  - 고뇌
  - 고통
  - 근심
  lexicon: LSJ
  rationale: 전쟁 상황에서의 내적 긴장과 두려움을 가리키므로, 한국어에서는 과도하게 심리학적으로 좁히지 않는 ‘불안’이 가장 적절합니다.
- source_word: ἐν ὑπαίθρῳ προσβολῆς
  english_pob_choice: the attack in the open country
  chosen_korean: 들판에서 벌어지는 공격
  alternatives_korean:
  - 들판에서의 공격
  - 야외에서의 공격
  - 빈터에서 벌어지는 공격
  lexicon: LSJ
  rationale: ἐν ὑπαίθρῳ는 성 밖의 노출된 공간, 곧 도시와 대비되는 개활지를 뜻하므로 ‘들판’이 독자에게 자연스럽게 대비를 드러냅니다.
- source_word: ταρασσομένοις
  english_pob_choice: as they were troubled
  chosen_korean: 마음이 흔들리고 있었습니다
  alternatives_korean:
  - 동요하고 있었습니다
  - 괴로워하고 있었습니다
  - 마음이 뒤흔들리고 있었습니다
  lexicon: LSJ
  rationale: ταράσσω는 흔들다, 뒤흔들다의 뜻이 있어 감정적 동요를 나타내며, 한국어로는 반복되는 전쟁의 불안정을 살리는 ‘마음이 흔들리다’가 적절합니다.
theological_decisions:
- issue: 전쟁 장면의 감정 표현과 서술 톤
  chosen_reading: 직설적 비유를 피하고, 성 안의 주민들이 겪는 실제적 불안과 동요를 있는 그대로 서술했습니다.
  alternative_readings:
  - ‘공포에 떨고 있었습니다’
  - ‘심한 고뇌를 겪고 있었습니다’
  rationale: 본절은 교리 논쟁보다 서사적 긴박감이 핵심이므로, 원문의 감정 강도를 유지하면서도 과장하지 않는 표현이 적절합니다.
  doctrine_reference: 서사 본문 번역 원칙
