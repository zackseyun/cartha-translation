translation:
  language: ko
  text: 그러나 니카노르는 유다와 함께 있던 사람들이 사마리아 지방에 있다는 것을 알게 되자, 안식의 날에 그들을 완전히 안전하다고 여기며 공격하려고 결심했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 구체적으로, ‘안식일에’; 여기의 그리스어는 문자적으로 ‘안식의 날’이라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταλαβών
  english_pob_choice: having learned
  chosen_korean: 알게 되자
  alternatives_korean:
  - 알고 나서
  - 전해 듣고
  - 알아차리고
  lexicon: LSJ
  rationale: 부사적 분사로서 정보의 획득과 그에 따른 다음 행동을 나타내므로, 자연스러운 현대 한국어로는 ‘알게 되자’가 가장 잘 맞습니다.
- source_word: τοὺς περὶ τὸν Ἰούδαν ὄντας
  english_pob_choice: those with Judas
  chosen_korean: 유다와 함께 있던 사람들
  alternatives_korean:
  - 유다 주변의 사람들
  - 유다와 함께한 자들
  - 유다를 따르던 사람들
  lexicon: LSJ
  rationale: ‘περὶ + 인명’은 그 인물과 함께 있는 집단을 가리키므로, 관계를 분명히 드러내는 ‘함께 있던 사람들’로 옮겼습니다.
- source_word: τῇ τῆς καταπαύσεως ἡμέρᾳ
  english_pob_choice: on the day of rest
  chosen_korean: 안식의 날에
  alternatives_korean:
  - 쉼의 날에
  - 휴식의 날에
  - 안식일에
  lexicon: LSJ
  rationale: 본문이 표준적인 σάββατον 대신 ‘rest/cessation’의 뜻을 직접 말하므로, 본문 수준에서는 의미를 살리되 한국어로는 ‘안식의 날’이 가장 자연스럽습니다.
- source_word: μετὰ πάσης ἀσφαλείας
  english_pob_choice: with complete security
  chosen_korean: 완전히 안전하다고 여기며
  alternatives_korean:
  - 완전한 안전 속에서
  - 전혀 위험이 없다고 여기며
  - 철저히 안전하다고 생각하며
  lexicon: LSJ
  rationale: 단순한 상태 묘사보다 니카노르의 계산된 판단을 드러내는 표현이어서, 공격을 시도할 때의 자기 확신을 살린 문맥적 번역을 택했습니다.
- source_word: ἐπιβαλεῖν
  english_pob_choice: to attack
  chosen_korean: 공격하려고 결심했습니다
  alternatives_korean:
  - 쳐들어가려 결심했습니다
  - 습격하려고 결심했습니다
  - 덮치려고 결심했습니다
  lexicon: LSJ
  rationale: 군사적 문맥에서 ‘공격하다/습격하다’가 맞으며, 한국어 본문에서는 가장 직접적인 ‘공격하려고’가 의미를 분명하게 드러냅니다.
theological_decisions:
- issue: ‘day of rest’의 참조 대상
  chosen_reading: 본문은 ‘안식의 날’로 직역하되, 특정 용어를 본문에 미리 삽입하지 않고 원문의 일반적 표현을 유지했습니다.
  alternative_readings:
  - 안식일
  rationale: 그리스어가 통상적인 ‘σάββατον’이 아니라 ‘휴식/정지’의 날을 말하므로, 본문에서는 문자적으로 유지하고 독자가 맥락상 안식일로 이해할 수 있도록 두었습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; original-language primacy over translation tradition.'
