  lexicon: LSJ
  rationale: 군사적 문맥에서 ‘공격하다/습격하다’가 맞으며, 한국어 본문에서는 가장 직접적인 ‘공격하려고’가 의미를 분명하게 드러냅니다.
theological_decisions:
- issue: ‘day of rest’의 참조 대상
  chosen_reading: 본문은 ‘안식의 날’로 직역하되, 특정 용어를 본문에 미리 삽입하지 않고 원문의 일반적 표현을 유지했습니다.
  alternative_readings:
  - 안식일
  rationale: 그리스어가 통상적인 ‘σάββατον’이 아니라 ‘휴식/정지’의 날을 말하므로, 본문에서는 문자적으로 유지하고 독자가 맥락상 안식일로 이해할 수 있도록 두었습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; original-language primacy over translation tradition.'
