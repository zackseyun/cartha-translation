base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/012.yaml
  text: 'Now his vision was like this: Onias[a], who had become high priest, a noble and good man, modest in bearing, gentle in manner, and one who spoke fittingly, and who from childhood had cultivated all the proper qualities of virtue—this man was stretching out his hands and praying for the whole body of the Jews.'
  footnotes:
  - marker: a
    text: Or 'for the entire community of the Jews.' The Greek speaks of the Jews as a single corporate body.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 본 환상은 이러했습니다. 대제사장이 되었던 오니아스는 고결하고 선한 사람이었으며, 태도는 겸손하고 성품은 온유하며 말을 적절하게 하고, 어려서부터 덕에 속한 모든 것을 익혀 온 사람이었습니다. 그가 두 손을 내밀어 유대인 전체 공동체[a]를 위하여 기도하고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유대인 전체를 위하여’. 그리스어는 유대인들을 하나의 공동체적 전체로 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρία
  english_pob_choice: vision
  chosen_korean: 환상
  alternatives_korean:
  - 이상
  - 보이는 장면
  lexicon: LSJ
  rationale: 문맥상 꿈처럼 보인 장면의 내용을 도입하므로, 단순한 ‘보기’나 ‘현상’보다 ‘환상’이 의미를 가장 자연스럽게 드러냅니다.
- source_word: γενόμενον ἀρχιερέα
  english_pob_choice: who had become high priest
  chosen_korean: 대제사장이 된
  alternatives_korean:
  - 대제사장이 되었던
  - 대제사장이 된 적이 있는
  lexicon: LSJ
  rationale: γενόμενον의 ‘되어 있는’ 상태를 한국어 관형사형으로 간결하게 살리되, 과거 회상 문맥도 유지합니다.
- source_word: αἰδήμονα μὲν τὴν ἀπάντησιν, πρᾶον δὲ τὸν τρόπον
  english_pob_choice: modest in bearing, gentle in manner
  chosen_korean: 태도는 겸손하며, 행실은 온유하고
  alternatives_korean:
  - 품행은 절제되어 있으며, 성정은 온화하고
  - 마주함은 공손하며, 성품은 온유하고
  lexicon: LSJ
  rationale: αἰδήμων과 πρᾶος의 인격적 미덕을 현대 한국어의 자연스러운 도덕적 묘사로 옮겼습니다. ἀπάντησιν은 직역보다 ‘태도’로 풀어 외형적 자세를 살렸습니다.
- source_word: λαλιάν προειμένον πρεπόντως
  english_pob_choice: one who spoke fittingly
  chosen_korean: 말은 합당하게 하며
  alternatives_korean:
  - 말은 마땅하게 하며
  - 말은 알맞게 하며
  lexicon: LSJ
  rationale: 라λιάν과 πρεπόντως의 조합은 ‘말의 적절함’을 뜻하므로, 품위 있게 말한다는 뉘앙스를 한국어로 간명하게 반영했습니다.
- source_word: ἐκ παιδὸς ἐκμεμελετηκότα πάντα τὰ τῆς ἀρετῆς ἴδια
  english_pob_choice: from childhood had cultivated all the proper qualities of virtue
  chosen_korean: 어려서부터 모든 덕의 마땅한 것들을 익혀 온
  alternatives_korean:
  - 어려서부터 모든 덕의 특질들을 갈고닦아 온
  - 어려서부터 모든 덕의 고유한 것들을 길러 온
  lexicon: LSJ
  rationale: ἐκμεμελετηκότα는 단순 학습보다 오랜 훈련과 습관화를 가리키므로 ‘익혀 온’으로 옮겨 지속적 형성을 나타냈습니다. τὰ τῆς ἀρετῆς ἴδια는 ‘덕에 속한 마땅한 것들’이라는 집합적 의미를 살렸습니다.
- source_word: τῷ παντὶ τῶν Ἰουδαίων συστήματι
  english_pob_choice: for the whole body of the Jews
  chosen_korean: 온 유대인의 무리를 위하여
  alternatives_korean:
  - 유대인 전체 공동체를 위하여
  - 유대인들의 온 몸체를 위하여
  lexicon: LSJ
  rationale: σύστημα의 집합적·유기적 의미를 살리면서도 한국어에서 자연스럽고 이해 가능한 ‘무리’로 옮겼습니다.
theological_decisions:
- issue: 오니아스의 중보적 기도 장면
  chosen_reading: 환상 안에서 오니아스가 유대인 전체를 위하여 실제로 기도하는 장면으로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 그저 유대인들을 위해 선하게 바라는 정도로 완화하기
  - 상징적 이미지로만 약화해 옮기기
  rationale: κατεύχεσθαι는 분명히 ‘기도하다’의 뜻이므로, 환상의 신학적·문학적 진술을 약화하지 않고 보존하는 것이 본문의 긴장을 가장 잘 전달합니다.
  doctrine_reference: 본문의 환상 서술과 중보 장면을 해소하지 않고 그대로 보존
- issue: 집합 명사로서의 ‘유대인의 무리’
  chosen_reading: 개별 개인보다 하나의 공동체적 몸을 가리키는 표현으로 옮겼습니다.
  alternative_readings:
  - 유대인 전부
  - 유대인의 온 회중
  rationale: στόμα이 아닌 σύστημα의 집합성을 한국어로 드러내되, 교회적 제도어로 오해되지 않도록 ‘무리’를 사용했습니다.
  doctrine_reference: 공동체적 전체성의 보존
