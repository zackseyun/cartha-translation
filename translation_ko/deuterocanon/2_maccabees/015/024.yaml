base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/024.yaml
  text: Let those who come against your holy people with blasphemy be struck with terror by the greatness of your arm[c][b][a]. And thus he ended in these words.
  footnotes:
  - marker: a
    text: Or 'be terrified' or 'be confounded'; the Greek verb expresses being struck with fear or consternation.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'by the greatness of your arm,' a biblical image for God's power in action.
    reason: cultural_note
  - marker: c
    text: Or 'And so he concluded in this way'; the Greek refers back to the words just spoken.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 거룩한 백성을 모독하며 대적하여 오는 자들이 당신 팔의 위대함으로 말미암아 공포에 사로잡히게 하소서.[a][b] 그리고 그는 이렇게 말하며 끝맺었습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두려워하게 하소서’, ‘경악하게 하소서’. 그리스어 동사는 두려움이나 당혹으로 충격을 받는 뜻을 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘당신 팔의 위대함으로’입니다. 성서에서 ‘팔’은 하나님의 권능이 역사하시는 모습을 가리키는 이미지입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘그리고 그는 이와 같이 끝맺었습니다’. 여기의 그리스어는 바로 앞에 한 말을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγέθει βραχίονός σου
  english_pob_choice: by the greatness of your arm
  chosen_korean: 당신의 팔의 عظ대함 때문에
  alternatives_korean:
  - 당신의 팔의 위대함 때문에
  - 당신의 능력의 عظ대함 때문에
  lexicon: LSJ
  rationale: βραχίων은 문자적으로 ‘팔’이므로 이미지를 보존하되, μεγέθει는 원인의 뉘앙스로 ‘때문에’로 옮겨 하나님 권능의 작동을 자연스럽게 드러냈습니다.
- source_word: καταπλαγήτωσαν
  english_pob_choice: be struck with terror
  chosen_korean: 두려움에 사로잡히게 하소서
  alternatives_korean:
  - 두려워하게 하소서
  - 공포에 사로잡히게 하소서
  - 경악하게 하소서
  lexicon: LSJ
  rationale: 이 동사는 단순 감정이 아니라 충격으로 인한 공포·당혹을 뜻하므로, 능동적 충격을 살리면서도 한국어로는 ‘사로잡히게 하소서’가 가장 근접합니다.
- source_word: οἱ μετὰ βλασφημίας παραγινόμενοι
  english_pob_choice: those who come against ... with blasphemy
  chosen_korean: 당신의 거룩한 백성에게 신성모독으로 맞서 오는 자들
  alternatives_korean:
  - 신성모독하며 오는 자들
  - 신성모독과 함께 다가오는 자들
  lexicon: LSJ
  rationale: παραγίνομαι의 적대적 접근을 ‘맞서 오는’으로 살리고, μετὰ βλασφημίας는 방식 부사로서 ‘신성모독으로’로 옮겼습니다.
- source_word: καὶ οὕτως μὲν ἐν τούτοις ἔληξεν
  english_pob_choice: And thus he ended in these words
  chosen_korean: 그리고 그는 이 말로 그렇게 끝맺었습니다
  alternatives_korean:
  - 그리고 그는 이 말로 끝을 맺었습니다
  - 그리고 이렇게 말하며 마쳤습니다
  lexicon: LSJ
  rationale: ἐν τούτοις는 바로 앞의 발화를 가리키므로 ‘이 말로’가 자연스럽고, ἔληξεν은 구어체의 ‘끝맺었습니다’로 간결하게 처리했습니다.
theological_decisions:
- issue: 하나님의 팔 이미지 보존
  chosen_reading: ‘팔’의 구체적 이미지를 유지하여 하나님의 역사하시는 능력을 직설적으로 드러냈습니다.
  alternative_readings:
  - 당신의 능력
  - 당신의 강한 손
  rationale: 본문은 추상화보다 상징적 신체어를 통해 신적 권능을 표현하므로, 이미지를 보존하는 편이 원문의 성격과 성서적 수사에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: original-language primacy and preservation of biblical imagery'
- issue: 마지막 문장의 화자 지시
  chosen_reading: ‘그는’으로 옮겨 앞선 서술 화자를 자연스럽게 이어 받았습니다.
  alternative_readings:
  - 그가
  - 그리하여 그는
  rationale: 그리스어는 문맥상 앞선 서술자를 가리키며, 한국어에서도 주어를 복원해 이야기의 흐름을 명확하게 하는 것이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: discourse clarity without over-interpretation'
