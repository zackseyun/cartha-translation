  text: And by encouraging them from the Law and the Prophets, and also by reminding them of the struggles they had already completed, he made them more eager.
translation:
  language: ko
  text: 그는 율법과 예언서를 통해 그들을 격려하고, 또 그들이 이미 완수한 싸움들을 상기시켜 줌으로써 그들을 더욱 열의 있게 만들었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραμυθούμενος
  english_pob_choice: encouraging
  chosen_korean: 격려하고
  alternatives_korean:
  - 위로하고
  - 권면하고
  - 용기를 북돋아
  lexicon: παραμυθέομαι
  rationale: 여기서는 단순한 위로보다 전투 직전의 결의를 북돋우는 의미가 강하므로, 문맥에 맞게 ‘격려하다’로 옮겼습니다.
- source_word: ἐκ τοῦ νόμου καὶ τῶν προφητῶν
  english_pob_choice: from the Law and the Prophets
  chosen_korean: 율법과 예언서를 통해
  alternatives_korean:
  - 율법과 예언서에서
  - 율법과 예언들로부터
  - 율법과 예언서를 근거로
  lexicon: νόμος / προφῆται
  rationale: 헬라어 전치사 ἐκ는 근거·출처를 함께 내포할 수 있어, 한국어에서는 자연스럽고 의미를 살릴 수 있는 ‘통해’로 풀었습니다.
- source_word: τοὺς ἀγῶνας οὓς ἦσαν ἐκτετελεκότες
  english_pob_choice: the struggles they had already completed
  chosen_korean: 그들이 이미 완수한 싸움들
  alternatives_korean:
  - 그들이 이미 치른 संघर्ष들
  - 그들이 이미 견뎌 낸 싸움들
  - 그들이 이미 끝마친 경기들
  lexicon: ἀγών / ἐκτελέω
  rationale: ἀγών은 일반적 ‘고난’보다 실제로 치러 온 ‘싸움/투쟁’의 뉘앙스가 강하고, ἐκτετελεκότες는 완료된 행위를 가리키므로 ‘완수한’으로 반영했습니다.
- source_word: προθυμοτέρους
  english_pob_choice: more eager
  chosen_korean: 더욱 열의 있게
  alternatives_korean:
  - 더욱 기꺼이
  - 더욱 앞장서게
  - 더욱 적극적으로
  lexicon: πρόθυμος
  rationale: 단순한 의욕을 넘어 자발적으로 앞서려는 태도를 드러내므로, 현대 한국어에서 자연스러운 ‘열의 있게’로 옮겼습니다.
theological_decisions:
- issue: 토라와 예언서의 권위 표기
  chosen_reading: ‘율법과 예언서’로 옮겨 유대 경전의 권위를 드러냈습니다.
  alternative_readings:
  - ‘율법과 선지자들’
  - ‘모세의 율법과 예언자들’
  rationale: 본문은 유대 경전 전체를 가리키는 관용적 표현이므로, 한국 교회 전통 표현보다 원문 범위를 그대로 드러내는 번역이 적절합니다.
  doctrine_reference: 유대 정경의 권위에 대한 본문 내 표현
- issue: ἀγῶνας의 의미 범위
  chosen_reading: ‘싸움들’로 옮겨 실제 투쟁성과 결투적 긴장을 살렸습니다.
  alternative_readings:
  - ‘고난들’
  - ‘경기들’
  - ‘투쟁들’
  rationale: 이 구절은 추상적 고난보다 이전에 이미 치른 실제 संघर्ष과 용맹을 상기시키는 흐름이므로, 전투적 맥락을 유지하는 번역이 더 충실합니다.
  doctrine_reference: 본문 맥락상 용기와 인내의 권면
