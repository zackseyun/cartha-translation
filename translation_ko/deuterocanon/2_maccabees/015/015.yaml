  - 오른쪽 손
  lexicon: LSJ
  rationale: 문맥상 예레미야의 손임이 분명하므로 한국어에서는 군더더기 없이 '오른손'으로 자연스럽게 처리했습니다.
- source_word: ῥομφαίαν χρυσῆν
  english_pob_choice: a golden sword
  chosen_korean: 황금 칼
  alternatives_korean:
  - 황금 검
  - 금칼
  lexicon: LSJ
  rationale: ῥομφαία의 큰 칼/검의 의미를 반영하면서도 현대 독자가 즉시 이해할 수 있는 '칼'을 택했습니다. '황금'은 금으로 된 성격을 자연스럽게 드러냅니다.
- source_word: προσφωνῆσαι τάδε
  english_pob_choice: addressed him with these words
  chosen_korean: 그에게 다음과 같이 말했습니다
  alternatives_korean:
  - 그에게 이와 같이 말했습니다
  - 그에게 이렇게 말했습니다
  lexicon: LSJ
  rationale: 말하기에 앞선 도입구로서의 기능을 살려, 뒤이어 올 직접화를 예고하는 한국어 관용 표현으로 옮겼습니다.
theological_decisions:
