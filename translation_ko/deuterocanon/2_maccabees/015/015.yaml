  chosen_reading: 본문 자체는 그 행동을 서술적으로 제시하므로, 이 절 안에서는 별도의 해설적 표지를 덧붙이지 않았습니다.
  alternative_readings:
  - '''환상 가운데''와 같은 설명을 본문에 직접 삽입함'
  rationale: 직전 문맥에서 제시되는 환상성은 유지하되, 이 절의 그리스어가 직접 말하지 않는 정보를 추가하지 않는 것이 소스 충실도에 맞습니다.
  doctrine_reference: 본문의 서술층위를 보존하고, 문맥이 제공하는 해석은 주석 영역에 남겨 둡니다.
