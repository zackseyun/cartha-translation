  text: '그러자 예레미야가 오른손을 내밀어 유다에게 금으로 된 칼을 건네며, 그에게 다음과 같이 말했습니다:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προτείναντα
  english_pob_choice: stretched out
  chosen_korean: 오른손을 내밀어
  alternatives_korean:
  - 오른손을 뻗어
  - 오른손을 펴고
  lexicon: LSJ
  rationale: 손을 앞으로 내미는 동작을 자연스러운 현대 한국어로 옮기되, 물리적 제스처가 분명히 드러나도록 했습니다.
- source_word: τὴν δεξιὰν
  english_pob_choice: his right hand
  chosen_korean: 오른손
  alternatives_korean:
  - 그의 오른손
  - 오른쪽 손
  lexicon: LSJ
  rationale: 문맥상 예레미야의 손임이 분명하므로 한국어에서는 군더더기 없이 '오른손'으로 자연스럽게 처리했습니다.
- source_word: ῥομφαίαν χρυσῆν
  english_pob_choice: a golden sword
  chosen_korean: 황금 칼
  alternatives_korean:
  - 황금 검
  - 금칼
  lexicon: LSJ
  rationale: ῥομφαία의 큰 칼/검의 의미를 반영하면서도 현대 독자가 즉시 이해할 수 있는 '칼'을 택했습니다. '황금'은 금으로 된 성격을 자연스럽게 드러냅니다.
- source_word: προσφωνῆσαι τάδε
  english_pob_choice: addressed him with these words
  chosen_korean: 그에게 다음과 같이 말했습니다
  alternatives_korean:
  - 그에게 이와 같이 말했습니다
  - 그에게 이렇게 말했습니다
  lexicon: LSJ
  rationale: 말하기에 앞선 도입구로서의 기능을 살려, 뒤이어 올 직접화를 예고하는 한국어 관용 표현으로 옮겼습니다.
theological_decisions:
- issue: 예레미야가 유다에게 칼을 건네는 장면의 초자연적/환상적 성격
  chosen_reading: 본문 자체는 그 행동을 서술적으로 제시하므로, 이 절 안에서는 별도의 해설적 표지를 덧붙이지 않았습니다.
  alternative_readings:
  - '''환상 가운데''와 같은 설명을 본문에 직접 삽입함'
  rationale: 직전 문맥에서 제시되는 환상성은 유지하되, 이 절의 그리스어가 직접 말하지 않는 정보를 추가하지 않는 것이 소스 충실도에 맞습니다.
  doctrine_reference: 본문의 서술층위를 보존하고, 문맥이 제공하는 해석은 주석 영역에 남겨 둡니다.
