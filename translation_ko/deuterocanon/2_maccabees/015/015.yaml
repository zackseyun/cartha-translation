lexical_decisions:
- source_word: προτείναντα
  english_pob_choice: stretched out
  chosen_korean: 오른손을 내밀어
  alternatives_korean:
  - 오른손을 뻗어
  - 오른손을 펴고
  lexicon: LSJ
  rationale: 손을 앞으로 내미는 동작을 자연스러운 현대 한국어로 옮기되, 물리적 제스처가 분명히 드러나도록 했습니다.
- source_word: τὴν δεξιὰν
