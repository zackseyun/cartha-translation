  rationale: 원문의 ‘형제들’ 언어를 약화시키지 않으면서도, 한국어에서 낯선 단일 형용사 표현보다 문맥 속 사랑의 행위를 분명히 보여 줍니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy
