  yaml_path: translation/deuterocanon/2_maccabees/015/014.yaml
  text: Then Onias answered and said[a], “This is Jeremiah, the prophet of God, who loves his brothers and prays much for the people and the holy city.”
  footnotes:
  - marker: a
    text: Or, “the one who loves his brothers.” The Greek φιλάδελφος is literally 'brother-loving' and denotes familial affection toward his fellow people.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 오니아스가 대답하여 말했습니다. “이분은 형제들을 사랑하고[a] 백성과 거룩한 성을 위하여 많이 기도하는 하나님의 예언자 예레미야입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘형제들을 사랑하는 이’. 그리스어 φιλάδελφος는 문자적으로 ‘형제를 사랑하는’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντα
  english_pob_choice: answered
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 대답했습니다
  - 응답했습니다
  - 말했습니다
  lexicon: LSJ
  rationale: ἀποκρίνομαι의 서술 도입 기능을 자연스럽게 살려, 회화체가 아닌 서술문에서 쓰기 쉬운 ‘대답하여 말했습니다’를 택했습니다.
- source_word: φιλάδελφος
  english_pob_choice: the one who loves the brothers
  chosen_korean: 형제들을 사랑하고
  alternatives_korean:
  - 형제애가 있는
  - 형제들을 사랑하는
  - 형제들을 좋아하는
  lexicon: LSJ
  rationale: 원문의 복합어 의미를 그대로 살려 ‘형제들’과 ‘사랑하다’를 유지했고, 한국어에서는 형용사보다 서술적 관형 절이 더 자연스럽습니다.
- source_word: πολλὰ προσευχόμενος
  english_pob_choice: prays much
  chosen_korean: 많이 기도하는
  alternatives_korean:
  - 자주 기도하는
  - 많이 기도하며
  - 기도를 많이 하는
  lexicon: LSJ
  rationale: πολλὰ의 양적 강조를 직역적으로 살려 ‘많이’로 옮기되, 현대 한국어에서 무리 없는 진행형 관형사구로 처리했습니다.
- source_word: ὁ τοῦ θεοῦ προφήτης
  english_pob_choice: the prophet of God
  chosen_korean: 하나님의 예언자
  alternatives_korean:
  - 하나님의 예언자
  - 하나님께 속한 예언자
  - 예언자
  lexicon: LSJ
  rationale: θεοῦ를 프로젝트 기본 용례에 따라 ‘하나님’으로 옮기고, προφήτης는 문맥상 ‘예언자’가 보다 직접적인 대응이라 선택했습니다.
theological_decisions:
- issue: φιλάδελφος의 공동체적 친족 언어를 한국어에서 어떻게 유지할지
  chosen_reading: ‘형제들을 사랑하고’로 옮겨 친족적·공동체적 애정을 그대로 드러냈습니다.
  alternative_readings:
  - ‘형제애가 있는’
