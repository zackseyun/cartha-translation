  text: And he urged those with him not to fear the attack of the nations, but to keep in mind the help that had previously come to them from heaven, and now to expect the victory that would come to them from the Almighty.
translation:
  language: ko
  text: 그리고 그는 자기와 함께 있는 사람들에게 이방 민족들의 공격을 두려워하지 말라고 권면하고, 전에 하늘로부터 그들에게 주어진 도움들을 마음에 새기며, 이제 전능하신 분에게서 그들에게 올 승리를 기대하라고 했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεκάλει
  english_pob_choice: urged
  chosen_korean: 권면하고
  alternatives_korean:
  - 재촉하고
  - 간청하고
  - 강권하고
  lexicon: BDAG
  rationale: 미완료 시제의 지속적 권유를 한국어에서 자연스럽게 살리면서도, 단순한 설명보다 더 강한 exhortation의 뉘앙스를 유지합니다.
- source_word: τὴν τῶν ἐθνῶν ἔφοδον
  english_pob_choice: the attack of the nations
  chosen_korean: 이방 민족들의 공격
  alternatives_korean:
  - 민족들의 공격
  - 이방 사람들의 습격
  - 이방 민족들의 습격
  lexicon: BDAG
  rationale: ἐθνῶν은 이 유대 문맥에서 외부 민족들을 가리키므로, 신학적 용례를 과도하게 덧씌우지 않으면서도 ‘이방 민족들’로 옮기는 것이 가장 직접적입니다.
- source_word: τὰ προγεγονότα αὐτοῖς ἀπʼ οὐρανοῦ βοηθήματα
  english_pob_choice: the help that had previously come to them from heaven
  chosen_korean: 전에 하늘로부터 그들에게 주어진 도움들을
  alternatives_korean:
  - 하늘에서 그들에게 이미 주어진 도움들
  - 과거에 하늘로부터 온 도움들
  - 전에 그들에게 임한 하늘의 도움들
  lexicon: BDAG
  rationale: 복수형 βοηθήματα를 살려 ‘도움들’로 옮기고, ‘하늘로부터’는 원문의 출처를 직접 반영해 하나님의 이전 개입을 분명히 합니다.
- source_word: τὴν παρὰ τοῦ παντοκράτορος ἐσομένην αὐτοῖς νίκην
  english_pob_choice: the victory that would come to them from the Almighty
  chosen_korean: 전능하신 분에게서 그들에게 올 승리
  alternatives_korean:
  - 전능하신 분에게서 그들에게 올 승리
  - 전능하신 분으로부터 그들에게 주어질 승리
  - 전능자에게서 올 승리
  lexicon: BDAG
  rationale: παντοκράτωρ는 정형화된 하나님의 칭호이므로 ‘전능하신 분’으로 옮겨, 한국어에서 자연스럽게 하되 칭호의 위엄을 유지합니다.
theological_decisions:
- issue: ‘하늘로부터’가 가리키는 신적 도움의 출처
  chosen_reading: 이전의 도움들을 하늘로부터 주어진 것으로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘하나님께서 주신 도움들’로 명시
  - ‘하늘의 도움’으로 축약
  rationale: 원문은 출처를 ‘하늘로부터’라고 표현하므로, 이를 신적 의미로 해석할 수는 있어도 본문 자체의 표현을 지우지 않는 편이 더 투명합니다.
  doctrine_reference: source transparency
- issue: παντοκράτωρ의 한국어 칭호
  chosen_reading: ‘전능하신 분’으로 옮겨 인격적 칭호를 유지했습니다.
  alternative_readings:
  - ‘전능자’
  - ‘전능하신 하나님’
  rationale: 본문은 일반 형용사가 아니라 하나님의 칭호를 사용하므로, 문맥상 하나님을 분명히 하면서도 현대 한국어에서 자연스러운 호칭을 택했습니다.
  doctrine_reference: Translate titles; preserve divine appellation
