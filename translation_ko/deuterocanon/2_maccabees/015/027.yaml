base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/027.yaml
  text: And while fighting with their hands[a], they were praying in their hearts to God, and they struck down no fewer than thirty-five thousand and four hundred[b], having been greatly gladdened by the care of God.
  footnotes:
  - marker: a
    text: Greek literally expresses the number as 'three myriads and five thousand and four hundred,' i.e., 35,400. The transmitted wording around 'five thousand' is compressed/irregular in this witness, but the sense of the total is clear.
    reason: textual_variant
  - marker: b
    text: Or 'greatly encouraged by God's providential care.' The Greek more literally says 'the care of God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 손으로 싸우는 한편 마음으로는 하나님께 기도하면서, 그들은 만사천오백 명이나 되는 수를 쓰러뜨렸으며, 하나님의 돌보심으로 크게 기뻐하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘세 만과 오천 사백’, 곧 35,400명을 뜻합니다. 전승된 표현에는 수사(數詞)가 압축되어 있으나, 전체 뜻은 분명합니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘하나님의 섭리적 돌보심으로’. 그리스어 ἐπιμέλεια는 문자적으로 ‘돌봄, 주의, 관심’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῖς μὲν χερσὶν ἀγωνιζόμενοι
  english_pob_choice: while fighting with their hands
  chosen_korean: 손으로 싸우는 한편
  alternatives_korean:
  - 손으로 분투하는 한편
  - 손으로 겨루는 한편
  lexicon: LSJ
  rationale: ἀγωνίζομαι의 전투적 의미를 살리되, 한국어에서는 ‘손으로 싸우다’가 몸의 행위와 뒤의 ‘마음으로’의 대조를 가장 자연스럽게 드러냅니다.
- source_word: ταῖς δὲ καρδίαις πρὸς τὸν θεὸν εὐχόμενοι
  english_pob_choice: they were praying in their hearts to God
  chosen_korean: 마음으로는 하나님께 기도하면서
  alternatives_korean:
  - 마음속으로 하나님께 기도하면서
  - 마음으로 하나님께 기도하며
  lexicon: LSJ
  rationale: καρδίαις를 내적 영역으로 이해해 ‘마음으로’로 옮겼고, εὐχόμενοι는 단순한 생각이 아니라 실제 기도를 가리키므로 ‘기도하면서’로 옮겼습니다.
- source_word: κατέστρωσαν οὐδὲν ἧττον
  english_pob_choice: they struck down no fewer than
  chosen_korean: 그들은 만사천오백 명이나 되는 수를 쓰러뜨렸으며
  alternatives_korean:
  - 그들은 적어도 만사천오백 명을 쓰러뜨렸으며
  - 그들은 만사천오백 명을 적잖이 쓰러뜨렸으며
  lexicon: LSJ
  rationale: ἧττον이 ‘더 적게’의 비교를 통해 최소 수량을 강조하므로, 한국어에서는 ‘-이나 되는’으로 숫자의 충격과 최소치의 뉘앙스를 함께 살렸습니다.
- source_word: τῇ τοῦ θεοῦ μεγάλως ἐφρανθέντες ἐπιμελείᾳ
  english_pob_choice: having been greatly gladdened by the care of God
  chosen_korean: 하나님의 돌보심으로 크게 기뻐하였습니다
  alternatives_korean:
  - 하나님의 배려로 크게 기뻐하였습니다
  - 하나님의 보살핌으로 크게 기뻐하였습니다
  lexicon: LSJ
  rationale: ἐπιμέλεια는 ‘돌봄, 배려, 보살핌’의 뜻이므로 ‘돌보심’이 가장 직접적입니다. ἐφρανθέντες는 결과 상태를 반영해 ‘크게 기뻐하였습니다’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: τοῦ θεοῦ ἐπιμελείᾳ를 ‘providence’로 해석할지 여부
  chosen_reading: 하나님의 돌보심
  alternative_readings:
  - 하나님의 섭리
  - 하나님의 섭리적 돌보심
  rationale: 본문은 하나님의 ‘care/attention’를 직접 말하므로, 교리적 용어인 ‘섭리’로 먼저 풀기보다 원어의 직접성을 살린 ‘돌보심’을 택했습니다.
  doctrine_reference: 원어 우선 번역; 본문이 말하는 신적 배려를 유지하되 해석을 과잉 주입하지 않음.
