  text: But that thrice-accursed man asked whether there is in heaven a sovereign who commanded the keeping of the sabbath day[a].
  footnotes:
  - marker: a
    text: Or 'whether the Sovereign is in heaven, the one who commanded the keeping of the sabbath day.' The Greek can be understood either as an indefinite description ('is there in heaven a sovereign...?') or as a more definite reference to Israel's God.
    reason: alternative_reading
translation:
  language: ko
  text: 그런데 그 삼중으로 저주받은 자는 하늘에 안식일을 지키라고 명령하신 주권자가 있는지를 물었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘에 계신 주권자, 곧 안식일을 지키라고 명령하신 분이 있는지.’ 그리스어는 막연한 서술(‘하늘에 어떤 주권자가 있는지’)로도, 이스라엘의 하나님을 가리키는 좀 더 분명한 표현으로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: τρισαλιτήριος
  english_pob_choice: thrice-accursed
  chosen_korean: 삼중으로 저주받은 자
  alternatives_korean:
  - 세 번 저주받은 자
  - 지독히 저주받은 자
  - 삼중으로 악한 자
  lexicon: LSJ
  rationale: 강한 저주적 비난을 나타내는 희귀 형용사이므로, 수치를 강조하는 ‘삼중으로’와 저주의 어감을 함께 살렸습니다.
- source_word: ἐπηρώτησεν
  english_pob_choice: asked
  chosen_korean: 물었습니다
  alternatives_korean:
  - 질문했습니다
  - 캐물었습니다
  lexicon: BDAG
  rationale: 적대적 질문의 도입으로 자연스러운 현대 한국어를 택하되, 원문의 질문 행위만 드러내고 과도한 해석은 피했습니다.
- source_word: δυνάστης
  english_pob_choice: sovereign
  chosen_korean: 주권자
  alternatives_korean:
  - 통치자
  - 권세자
  - 주님
  lexicon: LSJ
  rationale: 권력을 가진 존재라는 뜻을 살리면서도, 기독교적 호칭인 ‘주님’으로 오해되지 않도록 ‘주권자’를 선택했습니다.
- source_word: προστατάξας
  english_pob_choice: commanded
  chosen_korean: 명령하신
  alternatives_korean:
  - 명하신
  - 지시하신
  - 명령하여
  lexicon: LSJ
  rationale: 권위 있는 지시라는 힘을 살려 ‘명령하신’으로 옮겼습니다.
theological_decisions:
- issue: 하늘에 있는 존재를 일반적 통치자로 보느냐, 이스라엘의 하나님에 대한 암시로 보느냐
  chosen_reading: 문맥상 가능성을 열어 둔 채 ‘하늘에, … 주권자가 있는지’로 옮겼습니다.
  alternative_readings:
  - ‘하늘에 계신 주권자’
  - ‘하늘에 있는 통치자’
  rationale: 그리스어는 부정적 서술인지 특정 대상 지시인지 양쪽으로 읽힐 수 있으므로, 본문이 가진 해석의 긴장을 유지했습니다.
  doctrine_reference: 의도적 모호성 보존; 문맥상 신학적 함의를 단정하지 않음
