  yaml_path: translation/deuterocanon/2_maccabees/015/030.yaml
  text: And he ordered that the head of Nikanor[a], and the hand with the shoulder, be cut off and carried to Jerusalem—he who with his whole body and soul had fought in the forefront for the citizens, and who had preserved from youth his goodwill toward his fellow countrymen.
  footnotes:
  - marker: a
    text: Or 'the arm with the shoulder'; the Greek reads literally 'the hand with the shoulder,' likely referring to the severed upper limb.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 온몸과 영혼으로 시민들을 위해 앞장서 싸우고, 젊은 시절부터 동족에 대한 호의를 지켜 온 니카노르의 머리와 팔과 어깨를 잘라 예루살렘으로 가져가라고 명령했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘손과 어깨’라고 되어 있으나, 절단된 상지 전체를 가리키는 표현으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέταξεν
  english_pob_choice: he ordered
  chosen_korean: 명령했습니다
  alternatives_korean:
  - 지시했습니다
  - 명했습니다
  lexicon: LSJ
  rationale: aorist προστάσσω의 권위 있는 명령을 자연스러운 현대 한국어로 옮기되, 과도하게 군사적이거나 법정적인 뉘앙스는 피했습니다.
- source_word: πρωταγωνιστὴς ὑπὲρ τῶν πολιτῶν
  english_pob_choice: had fought in the forefront for the citizens
  chosen_korean: 시민들을 위해 앞장서 싸우고
  alternatives_korean:
  - 시민들을 위해 선두에서 싸우고
  - 시민들의 편에서 앞장섰던
  lexicon: LSJ
  rationale: πρωταγωνιστής의 ‘맨 앞에서 역할을 맡는 사람/앞장서는 사람’이라는 뜻을 한국어의 ‘앞장서 싸우다’로 살려, 단순한 ‘지도자’보다 전투적·공적 뉘앙스를 유지했습니다.
- source_word: καθʼ ὅλον σώματι καὶ ψυχῇ
  english_pob_choice: with his whole body and soul
  chosen_korean: 온몸과 영혼으로
  alternatives_korean:
  - 전신과 영혼으로
  - 몸과 영혼을 다해
  lexicon: LSJ
  rationale: ‘몸과 영혼’의 총체적 헌신을 보존하되, 한국어에서는 ‘온몸과 영혼’이 더 자연스럽고 응집력 있게 들립니다.
- source_word: ὁμοεθνεῖς
  english_pob_choice: fellow countrymen
  chosen_korean: 동족
  alternatives_korean:
  - 같은 민족 사람들
  - 동포
  lexicon: LSJ
  rationale: ὁμοεθνεῖς는 같은 민족/같은 백성을 가리키므로, 문맥상 정치적 시민성과 함께 민족적 연대가 드러나는 ‘동족’을 택했습니다.
- source_word: τὴν χεῖρα σὺν τῷ ὤμῳ
  english_pob_choice: the hand with the shoulder
  chosen_korean: 팔과 어깨
  alternatives_korean:
  - 손과 어깨
  - 팔뚝과 어깨
  lexicon: LSJ
  rationale: 영어 POB의 주석처럼 그리스어는 문자적으로는 ‘손과 어깨’이지만, 절단된 상지 전체를 가리키는 뜻으로 이해되므로 한국어에는 자연스럽고 이해 가능한 ‘팔과 어깨’로 옮겼습니다.
- source_word: περιφέρειν εἰς Ἰερουσαλήμ
  english_pob_choice: be carried to Jerusalem
  chosen_korean: 예루살렘으로 가져가라고
  alternatives_korean:
  - 예루살렘으로 옮기라고
  - 예루살렘까지 실어 가라고
  lexicon: LSJ
  rationale: εἰς Ἰερουσαλήμ의 도착 방향을 살리면서, 공개적 운반의 뉘앙스를 과도하게 단정하지 않기 위해 중립적인 ‘가져가다’를 사용했습니다.
