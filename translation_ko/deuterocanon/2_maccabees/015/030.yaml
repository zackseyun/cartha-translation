  rationale: 그리스어의 ὁ ... ὁ 구조는 앞선 행위 주어를 수식하는 설명구로 읽는 것이 자연스럽습니다. 이는 교리 문제라기보다 문장 구조에 관한 결정입니다.
  doctrine_reference: 번역 원칙 §1, §6
