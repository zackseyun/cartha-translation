translation:
  language: ko
  text: 그리고 두 번째 달의 열셋째 날—시리아어로는 아다르라고 부르는 날—을 모르드개 날보다 하루 전인 중요한 날로 지키게 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 그리스어 구절은 다소 특이하여, ‘통용어로는’ 또는 ‘현지어로는’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 즉, 모르드개와 관련된 기념일로 보이며, 아마도 부림절을 가리키는 듯합니다.
    reason: cross_reference
