theological_decisions:
- issue: 이 절의 달력적·기념적 성격
  chosen_reading: 법적·예배적 ‘절기’로 확정하지 않고, 중요한 기념일을 지키라는 표현으로 유지했습니다.
  alternative_readings:
  - 축제일로 번역하기
  - 공휴일로 번역하기
  rationale: 원문 ἐπίσημον은 ‘구별된/표시된’ 날이라는 뜻이 핵심이므로, 제도적 강도를 과장하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: τῇ κυριακῇ φωνῇ의 불확실성
  chosen_reading: ‘시리아어로는’으로 옮기되, 본문 안에 별도 주석 없이도 언어명칭임을 드러내는 방식으로 처리했습니다.
  alternative_readings:
  - 통용어로는
  - 현지어로는
  rationale: 주해가 지적하듯 표현이 다소 난해하므로, 확정적인 신학적 의미를 부여하지 않고 지역 언어 표기를 가리키는 것으로 보존했습니다.
  doctrine_reference: Translation philosophy §3
