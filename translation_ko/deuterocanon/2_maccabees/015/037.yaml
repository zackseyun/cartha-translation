  text: 그리고 시리아어로는 아다르라고 하는 열두째 달 열셋째 날을, 모르드개의 날보다 하루 앞선 특별한 날로 지키는 것이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 그리스어 표현은 다소 특이하여, ‘통용어로는’ 또는 ‘현지어로는’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 즉, 모르드개와 관련된 기념일을 가리키며, 부림절 기념을 암시할 가능성이 있습니다.
    reason: cross_reference
