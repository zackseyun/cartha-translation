  text: For the concern about wives and children[a], and further about brothers and relatives, weighed less with them[b], but the greatest and first fear was for the consecrated temple.
  footnotes:
  - marker: a
    text: Or 'was of less importance to them.' The Greek idiom literally says it 'lay in a lesser part' for them, expressing lower priority.
    reason: lexical_alternative
  - marker: b
    text: Or 'concern' or 'anxiety' instead of 'fear' for the final clause; the Greek φόβος can cover both dread and anxious concern in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 아내들과 자녀들, 더 나아가 형제들과 친족들에 대한 걱정은 그들에게 덜 중요한 것이었고,[a] 봉헌된 성전을 두고 품은 두려움이 가장 크고 으뜸이었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들에게 덜 중요한 것이었다.’ 그리스어 관용구는 문자적으로 ‘그들에게 더 작은 몫에 놓여 있었다’는 뜻으로, 우선순위가 낮다는 의미를 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘걱정’이나 ‘염려’. 마지막 절의 φόβος는 문맥에 따라 두려움과 불안한 염려를 모두 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ περὶ γυναικῶν καὶ τέκνων
  english_pob_choice: the concern about wives and children
  chosen_korean: 혼인한 아내들과 자녀들에 대한 걱정
  alternatives_korean:
