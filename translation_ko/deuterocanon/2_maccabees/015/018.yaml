  - 아내들과 자녀들을 둘러싼 일
  lexicon: LSJ
  rationale: περὶ + 속격의 명사화된 표현을 한국어에서는 ‘~에 대한 걱정’으로 자연스럽게 옮기되, 가족을 가리키는 구체성을 살렸습니다.
- source_word: ἐν ἥττονι μέρει κείμενος αὐτοῖς
  english_pob_choice: weighed less with them
  chosen_korean: 그들에게 있어 덜 중요한 것이었고
  alternatives_korean:
  - 그들에게 더 낮은 몫에 놓여 있었고
  - 그들에게 덜 큰 비중을 차지했고
  lexicon: LSJ
  rationale: 직역하면 ‘더 작은 몫에 놓여 있다’는 관용이므로, 의미를 풀어 ‘덜 중요한 것’으로 옮겨 우선순위의 낮음을 드러냈습니다.
- source_word: ἔτι δὲ ἀδελφῶν καὶ συγγενῶν
  english_pob_choice: and further about brothers and relatives
  chosen_korean: 더 나아가 형제들과 친족들
  alternatives_korean:
  - 그리고 또한 형제들과 친족들
  - 또한 형제들과 친족들
  lexicon: LSJ
  rationale: ἔτι δέ의 누적적 추가를 ‘더 나아가’로 살렸고, συγγενῶν은 혈연 친족을 가리켜 ‘친족들’이 적절합니다.
- source_word: καθηγιασμένου ναοῦ
  english_pob_choice: the consecrated temple
  chosen_korean: 거룩하게 바쳐진 성전
  alternatives_korean:
  - 봉헌된 성전
  - 성별된 성전
  lexicon: LSJ
  rationale: καθηγιασμένος의 ‘거룩하게 구별하여 바침’이라는 능동적·의례적 뉘앙스를 살려, 성전의 예배적 성별 상태를 드러냈습니다.
