  text: But Maccabeus was continually confident, with every hope, that he would obtain help from the Lord.
translation:
  language: ko
  text: 그러나 마카베오는 주님에게서 도움을 얻게 되리라는 온갖 소망을 품고 끊임없이 확신하고 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀδιαλείπτως πεποιθὼς
  english_pob_choice: was continually confident
  chosen_korean: 끊임없이 확신하며
  alternatives_korean:
  - 줄곧 확신하며
  - 계속해서 자신하며
  lexicon: ἀδιαλείπτως + πεποιθώς
  rationale: 부사와 분사 결합이 지속적인 내적 확신을 나타내므로, 상태의 지속성을 살려 ‘끊임없이 확신하며’로 옮겼습니다.
- source_word: μετὰ πάσης ἐλπίδος
  english_pob_choice: with every hope
  chosen_korean: 모든 소망을 품고
  alternatives_korean:
  - 온갖 소망을 가지고
  - 모든 희망과 함께
  lexicon: μετά + πᾶς + ἐλπίς
  rationale: POB의 ‘every hope’를 그대로 반영하되, 한국어에서는 단순한 수단보다 내적 태도를 드러내는 ‘소망을 품고’가 자연스럽습니다.
- source_word: ἀντιλήμψεως τεύξεσθαι
  english_pob_choice: would obtain help
  chosen_korean: 도움을 얻으리라고 믿었습니다
  alternatives_korean:
  - 도움을 받으리라고 믿었습니다
  - 구원을 얻으리라고 믿었습니다
  lexicon: ἀντίλημψις + τυγχάνω
  rationale: 명사 ἀντίλημψις는 ‘도움, 원조’가 핵심이므로, 동사구는 직접적으로 ‘도움을 얻다’로 옮겨 원문의 의미를 유지했습니다.
- source_word: παρὰ τοῦ κυρίου
  english_pob_choice: from the Lord
  chosen_korean: 주님에게서
  alternatives_korean:
  - 주님으로부터
  - 주님께로부터
  lexicon: παρά + κύριος
  rationale: 문맥상 도움의 출처를 나타내므로 한국어 조사로 ‘에게서’를 사용했고, κύριος는 이 문맥에서 주님으로 옮겼습니다.
theological_decisions:
- issue: κύριος의 번역
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 야훼
  rationale: 본문은 2 Maccabees의 일반적 서술로, 직접적인 야훼 인용이나 명시적 구약 인용이 아니므로 경건한 호칭인 ‘주님’이 자연스럽습니다.
  doctrine_reference: κύριος 번역 관행
- issue: 확신과 소망의 관계
  chosen_reading: ‘끊임없이 확신하며, 모든 소망을 품고’로 둘 다 보존
  alternative_readings:
  - ‘온전히 확신하며’로 단순화
  - ‘소망을 품고’만 강조
  rationale: 원문은 지속적 확신과 충만한 소망을 함께 제시하므로, 두 요소를 나누어 보존해 심리적 강도를 약화시키지 않았습니다.
  doctrine_reference: 본문 의미 보존
