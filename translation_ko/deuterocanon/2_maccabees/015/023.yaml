  source_fidelity: δυνάστα는 ‘주권자’로, ἄγγελον ἀγαθόν은 ‘선한 천사’로, ἔμπροσθεν ἡμῶν은 ‘우리 앞에’로 충실하게 옮길 수 있습니다. εἰς δέος καὶ τρόμον의 대상은 원문에 명시되지 않았으므로 ‘두려움과 떨림이 있게’로 대상 없이 결과를 표현한 것은 적절합니다. 다만 한국어에서 ‘하늘들의’는 그리스어 복수를 기계적으로 재현한 표현으로 매우 부자연스럽습니다. ‘하늘의’는 집합적·관용적 표현으로 원문의 의미를 보존합니다.
  naturalness: ‘하늘들의 주권자’는 현대 표준 한국어의 기도문 및 성서 문체에서 어색합니다. 또한 천사에 대한 ἀγαθός의 수식은 ‘좋은 천사’보다 ‘선한 천사’가 자연스럽고 문맥에 맞습니다. 나머지 기도체 ‘보내사 … 있게 하소서’는 현대의 격식 있는 합쇼체 성서 문체로 자연스럽습니다.
  terminology: ‘주권자’는 δυνάστα의 통치 권위를 잘 드러내며, 특정 교리적 칭호를 강요하지 않습니다. ‘선한 천사’는 ἀγαθός의 기본적 도덕적·호의적 의미를 자연스럽게 전달합니다. ‘두려움과 떨림’은 δέος καὶ τρόμον을 보존하며 그 감정의 주체를 추가하지 않습니다.
