  text: And now[a], O Sovereign of the heavens, send a good angel before us for fear and trembling.
  footnotes:
  - marker: a
    text: Or, more formally, 'send a good angel before us for fear and trembling.' The Greek does not explicitly state whose fear is meant, though the context suggests the enemy.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제, 하늘들의 주권자여, 좋은 천사를 우리 앞에 보내사 두려움과 떨림이 있게 하소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘좋은 천사를 우리 앞에 보내사 두려움과 떨림을 위하여’라고 할 수 있습니다. 그리스어는 두려움이 누구의 것인지 명시하지 않으며, 문맥상 적대자들을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνάστα
  english_pob_choice: Sovereign
  chosen_korean: 주권자
  alternatives_korean:
  - 지배자
  - 통치자
  - 전능자
  lexicon: LSJ
  rationale: δυνάστα는 권세를 가진 통치자에게 부르는 호격이므로, 단순한 ‘강한 이’보다 권위와 통치성을 드러내는 ‘주권자’가 적절합니다.
- source_word: τῶν οὐρανῶν
  english_pob_choice: of the heavens
  chosen_korean: 하늘들의
  alternatives_korean:
  - 하늘의
  - 하늘 나라의
  lexicon: LSJ
  rationale: 그리스어 복수형을 살려 ‘하늘들의’로 옮겨, 영어 POB가 유지한 복수형의 문체적 투명성을 한국어에서도 보존했습니다.
- source_word: ἄγγελον ἀγαθὸν
  english_pob_choice: a good angel
  chosen_korean: 좋은 천사
  alternatives_korean:
  - 선한 천사
  - 호의적인 천사
  - 선한 사자
  lexicon: LSJ
  rationale: ἄγγελος는 이 문맥에서 인간 사자가 아니라 천사적 존재를 가리키므로 ‘천사’로 옮기고, ἀγαθός는 과도한 해석을 피한 기본 의미인 ‘좋은’으로 유지했습니다.
- source_word: εἰς δέος καὶ τρόμον
  english_pob_choice: for fear and trembling
  chosen_korean: 두려움과 떨림이 있게
  alternatives_korean:
  - 두려움과 떨림을 위해
  - 두려움과 떨림으로
  - 두려움과 공포를 일으키도록
  lexicon: LSJ
  rationale: εἰς는 결과/목적을 나타낼 수 있으므로, 대상이 드러나지 않은 상태를 유지하면서도 한국어에서는 결과를 자연스럽게 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘두려움과 떨림’의 대상
  chosen_reading: 천사가 보내지는 결과로 적대자들 안에 두려움과 떨림이 일어나게 하는 뜻으로 읽었습니다.
  alternative_readings:
  - 누구의 두려움인지 밝히지 않고 ‘두려움과 떨림을 위해’로 더 형식적으로 둘 수 있습니다.
  rationale: 문맥이 군사적 기도이므로, εἰς δέος καὶ τρόμον은 기도자들의 감정 상태보다 적대 세력에게 미칠 효과를 가리키는 것으로 보는 편이 자연스럽습니다.
  doctrine_reference: 문맥 우선의 해석을 유지하되, 원문의 모호성을 과도하게 해소하지 않습니다.
