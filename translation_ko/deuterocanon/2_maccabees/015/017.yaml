- source_word: ψυχὰς νέων ἐπανδρῶσαι
  english_pob_choice: to make the souls of young men manly
  chosen_korean: 젊은이들의 혼을 용감하게 할 수 있었기에
  alternatives_korean:
  - 젊은 남자들의 혼을 남자답게 할 수 있었기에
  - 젊은이들의 혼을 기개 있게 할 수 있었기에
  lexicon: LSJ
  rationale: 그리스어의 남성적·용맹한 이미지는 유지하되, 한국어에서는 ‘남자답게’보다 문맥상 자연스러운 ‘용감하게’로 옮겨 과도한 어색함을 피했습니다.
- source_word: μὴ στρατεύεσθαι ... γενναίως δὲ ἐφέρεσθαι ... μετὰ πάσης εὐανδρείας ἐμπλακέντες κρῖναι τὰ πράγματα
  english_pob_choice: not merely to make a campaign, but to press on bravely and, engaging with all courage, settle the matter
  chosen_korean: 전쟁을 하러 나서는 데 그치지 않고 용감하게 나아가, 온갖 용기로 맞서 사건을 결정하기로 결의하였습니다
  alternatives_korean:
  - 단지 출정하는 데 그치지 않고 용감히 밀고 나아가, 온전히 용기로 맞서 일을 매듭짓기로 결의하였습니다
  - 전쟁하러 나가는 것에 그치지 않고 담대히 전진하여 모든 용기로 맞붙어 일을 판가름하기로 결의하였습니다
  lexicon: LSJ
  rationale: μὴ στρατεύεσθαι의 부정은 전쟁 자체의 거부가 아니라 ‘단지 출정하는 데 그치지 않음’의 대비이므로 그 구조를 살렸고, κρῖναι τὰ πράγματα는 최종적 판가름이라는 뜻을 살려 ‘사건을 결정하다’로 옮겼습니다.
theological_decisions:
- issue: τὰ ἅγια와 τὸ ἱερόν의 구별
  chosen_reading: ‘거룩한 것들’과 ‘성전’을 서로 구별하여 옮겼습니다.
  alternative_readings:
  - ‘성소’와 ‘성전’
  - ‘거룩한 것들’과 ‘신전’
  rationale: 원문은 τὰ ἅγια와 τὸ ἱερόν을 분리해 말하므로, 이를 합치지 않고 각각 드러내는 것이 의미 보존에 중요합니다.
  doctrine_reference: DOCTRINE.md §1 Original-language primacy over translation tradition
- issue: μὴ στρατεύεσθαι의 의미
  chosen_reading: ‘전쟁을 하러 나서는 데 그치지 않고’로 옮겨, 단순한 비전투가 아니라 더 강한 결의를 나타내도록 했습니다.
  alternative_readings:
  - ‘전쟁하지 않기로’
  - ‘출정하지 않기로’
  rationale: 뒤이어 실제로 용감히 맞서는 결의가 이어지므로, 부정은 전투 자체의 포기가 아니라 ‘그것만으로는 충분치 않다’는 대비로 이해하는 것이 문맥에 맞습니다.
  doctrine_reference: DOCTRINE.md §1 Original-language primacy over translation tradition
