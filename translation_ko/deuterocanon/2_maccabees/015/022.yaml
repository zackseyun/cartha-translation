  - 이야기했습니다
  lexicon: BDAG
  rationale: 서술 속 기도 도입부로서 자연스러운 과거 서술을 택하되, 반복적 진행상은 한국어에서 과도하게 드러내지 않았습니다.
- source_word: ἐπικαλούμενος τόνδε τὸν τρόπον
