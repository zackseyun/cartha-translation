  - 주님
  - 통치자님
  lexicon: BDAG
  rationale: κύριος와 구별되는 직접 호칭을 살리기 위해 ‘주님’ 대신 별도의 절대권위 호칭인 ‘주권자님’을 택했습니다.
- source_word: ἐπὶ Ἐζεκίου
  english_pob_choice: in the time of Hezekiah
  chosen_korean: 히스기야 때에
  alternatives_korean:
  - 히스기야에게
  - 히스기야를 향해
  lexicon: BDAG
  rationale: ἐπί+속격의 역사적 회상 용법을 한국어에서 자연스럽게 드러내어, 히스기야 시대의 사건이라는 의미를 살렸습니다.
- source_word: ἐκ τῆς παρεμβολῆς Σενναχηρείμ
  english_pob_choice: in the camp of Sennacherib
  chosen_korean: 산헤립의 진영에서
  alternatives_korean:
  - 산헤립의 진영으로부터
  - 산헤립의 진중에서
  lexicon: BDAG
  rationale: ἐκ의 출처/범위 뉘앙스를 현대 한국어에서 가장 자연스럽게 표현할 수 있는 장소격으로 옮겼습니다.
- source_word: ἀνεῖλεν ... εἰς ἑκατὸν ὀγδοήκοντα πέντε χιλιάδας
  english_pob_choice: he struck down a hundred eighty-five thousand
  chosen_korean: 십팔만오천 명을 쳐죽였습니다
  alternatives_korean:
  - 십팔만오천 명을 죽였습니다
  - 십팔만오천 명을 쳐서 쓰러뜨렸습니다
  lexicon: BDAG
  rationale: ἀνεῖλεν은 단순한 ‘죽이다’보다 강한 제거/살해를 뜻하므로, 심판적 폭력을 드러내는 ‘쳐죽였습니다’로 옮겼습니다.
theological_decisions:
- issue: 기도문의 존칭과 신적 직접 호칭
  chosen_reading: 「주권자님」으로 번역해, 화자가 하나님께 직접 드리는 공손한 기도체를 유지했습니다.
  alternative_readings:
  - 주님
  - 통치자님
  rationale: 본문은 인간 간 대화가 아니라 하나님께 올리는 간구이므로, 한국어에서 경외와 직접성을 함께 담는 호칭을 사용했습니다. 동시에 δέσποτα의 어휘적 차이를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: 직접 호칭의 경외어법 및 δέσποτα/κύριος 구별'
