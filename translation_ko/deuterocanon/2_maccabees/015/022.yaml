  lexicon: BDAG
  rationale: ἐπικαλούμενος는 단순히 ‘부르다’보다 하나님께 간구하는 행위이므로, 문맥상 기도 행위가 분명하도록 압축해 옮겼습니다.
- source_word: δέσποτα
  english_pob_choice: Master
  chosen_korean: 주권자님
  alternatives_korean:
