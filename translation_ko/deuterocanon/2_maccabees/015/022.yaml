base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/022.yaml
  text: 'And he spoke[a], calling upon him in this way: “You, Master, sent your angel in the time of Hezekiah king of Judea, and he struck down a hundred eighty-five thousand in the camp of Sennacherib.”'
  footnotes:
  - marker: a
    text: Or, 'king of Judah.' The Greek reads 'of Judea' (Ἰουδαίας), but the historical reference is to Hezekiah of Judah.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 이렇게 기도하며 말했습니다. 「주권자님, 당신은 유다 왕 히스기야 때에 당신의 천사를 보내셨고, 그가 산헤립의 진영에서 십팔만오천 명을 쳐죽였습니다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 Ἰουδαίας는 문자적으로 ‘유대/유대아’이지만, 역사적 대상은 유다 왕 히스기야입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  english_pob_choice: he spoke
  chosen_korean: 말했습니다
  alternatives_korean:
