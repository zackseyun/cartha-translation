  - 산헤립의 진중에서
  lexicon: BDAG
  rationale: ἐκ의 출처/범위 뉘앙스를 현대 한국어에서 가장 자연스럽게 표현할 수 있는 장소격으로 옮겼습니다.
- source_word: ἀνεῖλεν ... εἰς ἑκατὸν ὀγδοήκοντα πέντε χιλιάδας
  english_pob_choice: he struck down a hundred eighty-five thousand
  chosen_korean: 십팔만오천 명을 쳐죽였습니다
  alternatives_korean:
  - 십팔만오천 명을 죽였습니다
