  text: And after displaying the head of the accursed Nikanor and the hand of that blasphemer[a], which he had stretched out against the holy house of the Almighty and boasted greatly[b],
  footnotes:
  - marker: a
    text: Or 'the defiled Nikanor.' The Greek adjective is a strong term of religious/moral reproach, and 'accursed' is used here to convey that force idiomatically.
    reason: lexical_alternative
  - marker: b
    text: Or 'the hand of that reviler.' The Greek term can denote abusive or slanderous speech generally; 'blasphemer' is chosen because the context concerns impiety against the temple.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 저주받은 니카노르의 머리와 저주받은 자의 손[a]—그가 전능자의 거룩한 집을 향해 뻗어 자랑하던 그 손—을 보인 뒤에[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘더럽혀진 니카노르’로 옮길 수 있습니다. 원어 형용사는 강한 종교·도덕적 비난을 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 거룩한 집을 향해 손을 뻗어 크게 자랑하던’으로 읽을 수 있습니다. 여기서는 앞선 행위와 뒤의 자랑을 하나의 수식 구조로 묶었습니다.
    reason: source_note
lexical_decisions:
- source_word: καὶ ἐπιδειξάμενος
  english_pob_choice: after displaying
  chosen_korean: 그리고 …를 보인 뒤에
  alternatives_korean:
  - 보여 준 뒤에
  - 공개하여 보여 준 뒤에
  lexicon: BDAG
  rationale: 서사에서 앞선 행위를 다음 사건보다 먼저 둔 분사 구문이므로 ‘…를 보인 뒤에’로 순서를 살렸습니다.
- source_word: μιεροῦ Νικάνορος
  english_pob_choice: the accursed Nikanor
  chosen_korean: 저주받은 니카노르
  alternatives_korean:
  - 더럽혀진 니카노르
  - 부정한 니카노르
  lexicon: LSJ
  rationale: μοιρός 계열의 강한 종교·도덕적 비난을 한국어 관용적으로는 ‘저주받은’이 가장 직접적으로 전달합니다.
- source_word: δυσφήμου
  english_pob_choice: blasphemer
  chosen_korean: 저주받은 자
  alternatives_korean:
  - 신성모독자
  - 비방하는 자
  - 모독자
  lexicon: LSJ
  rationale: 본문의 핵심은 손의 행위가 거룩한 집을 향한 신성모독적 도발이었다는 점이므로, 단순한 언어비난보다 그 결과를 반영한 ‘저주받은 자’로 묶어 재현했습니다.
- source_word: ἐπὶ τὸν ἅγιον τοῦ παντοκράτορος οἶκον
  english_pob_choice: against the holy house of the Almighty
  chosen_korean: 전능자의 거룩한 집을 향해
  alternatives_korean:
  - 전능자의 거룩한 집을 대하여
  - 전능자의 거룩한 성전을 향해
  lexicon: LSJ
  rationale: ἐπί + 대격이 적대적 방향성을 띠지만, 여기서는 손을 ‘뻗은’ 동작과 결합하므로 ‘향해’로 살리되, 문맥상 도발성을 유지했습니다.
- source_word: ἐμεγαλαύχησεν
  english_pob_choice: boasted greatly
  chosen_korean: 자랑하던
  alternatives_korean:
  - 크게 자랑하던
  - 거만하게 뽐내던
  lexicon: LSJ
  rationale: 분사 구조 안에서 과거의 반복적·지속적 태도를 자연스럽게 드러내기 위해 ‘자랑하던’으로 옮겼습니다.
