  text: And after displaying the head of the accursed Nikanor and the hand of that blasphemer[a], which he had stretched out against the holy house of the Almighty and boasted greatly[b],
  footnotes:
  - marker: a
    text: Or 'the defiled Nikanor.' The Greek adjective is a strong term of religious/moral reproach, and 'accursed' is used here to convey that force idiomatically.
    reason: lexical_alternative
  - marker: b
    text: Or 'the hand of that reviler.' The Greek term can denote abusive or slanderous speech generally; 'blasphemer' is chosen because the context concerns impiety against the temple.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 저주받은 니카노르[a]의 머리와, 그가 전능자의 거룩한 집을 맞서 손을 뻗어 크게 자랑하던 그 모독자[b]의 손을 보인 뒤에
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘더럽혀진 니카노르’ 또는 ‘부정한 니카노르’로 옮길 수 있습니다. 원어 형용사는 강한 종교적·도덕적 비난을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘비방하는 자’ 또는 ‘악담하는 자’로 옮길 수 있습니다. 원어는 모욕적이거나 비방하는 말을 하는 사람을 가리키며, 여기서는 거룩한 집을 향한 불경한 행위의 문맥 때문에 ‘모독자’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐπιδειξάμενος
