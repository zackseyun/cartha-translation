  - 전능자의 거룩한 성전을 향해
  lexicon: LSJ
  rationale: ἐπί + 대격이 적대적 방향성을 띠지만, 여기서는 손을 ‘뻗은’ 동작과 결합하므로 ‘향해’로 살리되, 문맥상 도발성을 유지했습니다.
- source_word: ἐμεγαλαύχησεν
  english_pob_choice: boasted greatly
  chosen_korean: 자랑하던
  alternatives_korean:
