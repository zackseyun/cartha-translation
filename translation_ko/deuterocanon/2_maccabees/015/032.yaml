  lexicon: LSJ
  rationale: 본문의 핵심은 손의 행위가 거룩한 집을 향한 신성모독적 도발이었다는 점이므로, 단순한 언어비난보다 그 결과를 반영한 ‘저주받은 자’로 묶어 재현했습니다.
- source_word: ἐπὶ τὸν ἅγιον τοῦ παντοκράτορος οἶκον
  english_pob_choice: against the holy house of the Almighty
  chosen_korean: 전능자의 거룩한 집을 향해
  alternatives_korean:
