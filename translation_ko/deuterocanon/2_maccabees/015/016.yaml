lexical_decisions:
- source_word: Λάβε
  english_pob_choice: Take
  chosen_korean: 받아들이십시오
  alternatives_korean:
  - 가져가십시오
  - 취하십시오
  lexicon: LSJ
  rationale: 시제·상황상 단순 정보 전달보다 즉각적인 명령을 살려야 하므로, 현대 한국어에서는 ‘받아들이십시오’가 ‘Take/Receive’의 지시성을 가장 자연스럽게 드러냅니다.
- source_word: τὴν ἁγίαν ῥομφαίαν
  english_pob_choice: the holy sword
  chosen_korean: 거룩한 칼
  alternatives_korean:
  - 성스러운 칼
  - 거룩한 검
  lexicon: LSJ
  rationale: ῥομφαία는 큰 칼날/장검 계열이지만 한국어에서는 ‘칼’이 가장 넓고 직접적인 대응이며, ‘거룩한’이 ἁγίαν의 종교적 구별됨을 잘 살립니다.
- source_word: δῶρον
  english_pob_choice: a gift
  chosen_korean: 선물입니다
  alternatives_korean:
  - 하나님의 선물입니다
  - 받는 선물입니다
  lexicon: LSJ
  rationale: 원문은 명령문 뒤의 동격적 설명이므로, 한국어에서는 문장부호로 풀어 ‘— …입니다’ 구조로 자연스럽게 살려 주는 것이 좋습니다.
- source_word: τοὺς ὑπεναντίους
  english_pob_choice: the adversaries
  chosen_korean: 적대자들
  alternatives_korean:
  - 원수들
  - 대적들
  lexicon: LSJ
  rationale: ὑπεναντίους는 단순한 감정적 ‘원수’보다 ‘맞서 विरोध하는 자들’의 성격이 강하므로, 보다 직접적인 ‘적대자들’이 원문의 대립성을 유지합니다.
theological_decisions:
- issue: 무기의 신성한 성격을 어떻게 표시할 것인가
  chosen_reading: ‘거룩한 칼’과 ‘하나님께로부터 온 선물’로 병기하여, 무기가 전쟁의 도구이기 이전에 하나님이 부여하신 도구임을 분명히 했습니다.
  alternative_readings:
  - ‘성스러운 칼’
  - ‘하나님의 선물’
  rationale: ἁγίαν과 δῶρον παρὰ τοῦ θεοῦ는 단순한 수사 이상으로 무기의 기원을 강조하므로, 한국어에서도 거룩함과 출처를 함께 드러내는 것이 본문 의미를 더 정확히 전달합니다.
  doctrine_reference: 'POB 원칙: 원문 우선, 신학적 완화보다 source-direct 의미 보존'
