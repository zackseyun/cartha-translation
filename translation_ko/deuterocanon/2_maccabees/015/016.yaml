translation:
  language: ko
  text: 거룩한 칼을 받아들이십시오[a] — 하나님께로부터 온 선물입니다[b]. 그것으로 당신은 적대자들을 산산이 부수게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
