lexical_decisions:
- source_word: Οἱ δὲ περὶ τὸν Νικάνορα
  english_pob_choice: But those around Nikanor
  chosen_korean: 니카노르 주변에 있던 자들
  alternatives_korean:
  - 니카노르와 함께 있던 자들
  - 니카노르 곁에 있던 자들
  lexicon: LSJ
  rationale: περὶ + 대격은 단순한 동반을 넘어 ‘주변에 있는/둘러싼’ 무리를 가리킬 수 있어, ‘주변에 있던 자들’로 옮기면 군중의 배치를 자연스럽게 드러냅니다.
- source_word: σαλπίγγων
  english_pob_choice: trumpets
  chosen_korean: 나팔
  alternatives_korean:
  - 트럼펫
  - 전쟁 나팔
  lexicon: LSJ
  rationale: 고대 군사 문맥에서의 관악기를 한국어 성경 문체로는 ‘나팔’이 가장 자연스럽고, 현대 악기명인 ‘트럼펫’보다 원문 분위기를 더 잘 살립니다.
- source_word: παιάνων
  english_pob_choice: battle songs
  chosen_korean: 전승의 노래
  alternatives_korean:
  - 승리의 노래
  - 전투 노래
  - 파이안
  lexicon: LSJ
  rationale: παιάν은 전승·승리를 기리는 노래를 가리킬 수 있으므로, 군사 승리를 드러내는 의미를 살리면서도 생소한 음역을 피해 ‘전승의 노래’로 옮겼습니다.
- source_word: προσῆγον
  english_pob_choice: advanced
  chosen_korean: 앞으로 나아갔습니다
  alternatives_korean:
  - 진군했습니다
  - 다가왔습니다
  - 전진했습니다
  lexicon: LSJ
  rationale: 전투 장면에서의 προσάγω는 단순 접근보다 전진의 뉘앙스가 강해, ‘앞으로 나아갔습니다’로 방향성과 움직임을 함께 담았습니다.
theological_decisions:
- issue: 전투 행렬의 의도적 소리 높임
  chosen_reading: ‘나팔과 전승의 노래’로 옮겨, 단순한 소음이 아니라 승리를 과시하는 행진임을 드러냈습니다.
  alternative_readings:
  - ‘나팔과 배틀 송’처럼 음역 중심으로 옮김
  - ‘나팔과 승리의 노래’로 더 직역함
  rationale: 이 절은 적진을 향해 나아가는 군사적 과시를 보여 주므로, 원문이 함축한 승리의 분위기를 한국어로 분명히 드러내는 것이 적절합니다.
  doctrine_reference: 문맥적 서술 — 신학 교리 논점 없음
