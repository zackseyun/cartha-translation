translation:
  language: ko
  text: 그리고 모든 사람이 이미 다가올 판결을 기다리고 있는 동안, 적군은 이미 맞붙었고, 군대는 전열을 갖추었으며, 짐승들은 한쪽에 알맞게 배치되었고, 기병은 양익에 배치되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '다가올 결정'이나 '다가올 위기'로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 즉, 아마도 전투 대형의 전쟁 코끼리를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: τὴν ἐσομένην κρίσιν
  english_pob_choice: the coming judgment
  chosen_korean: 다가올 판결
  alternatives_korean:
  - 다가올 심판
  - 임박한 결정
  - 다가올 위기
  lexicon: LSJ
  rationale: κρίσις는 전투 문맥에서 '판결/결정'의 뜻을 모두 띨 수 있어, English POB의 'judgment'가 담은 중대함을 살리면서도 한국어에서는 군사적 상황에 더 자연스러운 '판결'을 택했습니다.
- source_word: προσμιξάντων τῶν πολεμίων
  english_pob_choice: the enemies had already joined battle
  chosen_korean: 적군은 이미 맞붙었고
  alternatives_korean:
  - 적들이 이미 교전했고
  - 적군은 이미 교전했습니다
  - 적군은 이미 싸움에 들어갔고
  lexicon: LSJ
  rationale: 동사는 문자적으로 '함께 섞이다/다가붙다'의 뉘앙스가 있어, 전투 맥락에서 '맞붙다'가 영어의 idiomatic한 'joined battle'을 가장 압축적으로 옮깁니다.
- source_word: τῆς στρατιᾶς ἐκταγείσης
  english_pob_choice: the army had been drawn up
  chosen_korean: 군대는 전열을 갖추었으며
  alternatives_korean:
  - 군대는 정렬되었으며
  - 군대는 배치되었으며
  - 군대는 전개되었으며
  lexicon: LSJ
  rationale: ἐκτάσσω는 군대를 질서 있게 늘어세우는 뜻이므로, 한국어 군사 표현으로는 '전열을 갖추다'가 가장 자연스럽고 원문 의미도 잘 보존합니다.
- source_word: τῶν θηρίων
  english_pob_choice: the beasts
  chosen_korean: 짐승들
  alternatives_korean:
  - 동물들
  - 코끼리들
  - 전쟁 코끼리들
  lexicon: LSJ
  rationale: 원문은 일반명사 '짐승들'을 사용하므로 본문에서는 이를 그대로 살리고, 특정 전투 맥락상 전쟁 코끼리일 수 있다는 해석은 주석에서만 열어 두었습니다.
- source_word: κατὰ κέρας
  english_pob_choice: posted on the flanks
  chosen_korean: 양익에 배치되었습니다
  alternatives_korean:
  - 측면에 배치되었습니다
  - 날개에 배치되었습니다
  - 좌우 측면에 배치되었습니다
  lexicon: LSJ
  rationale: 군사용 κέρας는 '날개/익/측면'을 가리키므로, 현대 한국어 군사 문맥에서는 '양익'이 원문의 전술 배치를 가장 정확하게 전달합니다.
theological_decisions:
- issue: κρίσις의 의미를 전투 문맥에서 어떻게 살릴지
  chosen_reading: ‘판결’로 옮겨 전투의 결정적 순간이라는 중량감을 유지했습니다.
  alternative_readings:
  - 심판
  - 결정
  - 위기
  rationale: 이 절은 군사 서술이지만 κρίσις가 단순한 전술 판세보다 더 무거운 종결적 의미를 가질 수 있어, English POB의 신학적 긴장을 한국어에서도 덜 약화하는 쪽을 택했습니다.
  doctrine_reference: Preserve theological tension rather than resolving κρίσις into a purely secular military term.
