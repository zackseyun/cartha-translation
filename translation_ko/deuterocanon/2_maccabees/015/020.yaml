    rationale: ‘이미’는 기다림과 준비·배치의 완료를 나타내고, ‘다가올’은 심판을 수식하므로 ‘모두가 다가오는 심판을 이미 기다리고 있었고’처럼 배열하면 자연스럽습니다.
