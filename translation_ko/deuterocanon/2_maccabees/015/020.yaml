  source_fidelity: 핵심 전투 장면의 배열은 대체로 충실합니다. 그러나 κρίσις를 ‘판결’로 옮기면 법정의 판정이라는 뜻이 두드러져 전투의 निर्णायक한 국면 및 원문의 중층적 ‘심판’ 가능성을 충분히 살리지 못합니다. ‘심판’이 더 적절하며, 주석에서 ‘결정’과 ‘위기’의 가능성을 유지하는 것이 안전합니다.
  naturalness: ‘이미 다가올 판결을 기다리고 있는 동안’은 ‘이미’와 ‘다가올’의 결합이 다소 어색하고, ‘판결’도 이 문맥에서 자연스럽지 않습니다. 또한 각주 표지는 해당 어구 바로 뒤에 놓여야 독자가 주석의 대상을 명확히 알 수 있습니다. 수정문은 현대 표준어 합쇼체의 문장 흐름과 군사 서술에 맞춥니다.
  terminology: κρίσις는 ‘다가오는 심판’으로 옮기되 대안 주석을 유지합니다. τῶν θηρίων은 본문에서 ‘짐승들’로 보존하고, 전쟁 코끼리라는 문맥적 식별은 주석으로 제한합니다. κατὰ κέρας의 군사적 의미는 ‘양익에’가 정확합니다.
