  - 그 필요성
  - 그 위기
  lexicon: LSJ
  rationale: 전투 직후의 문맥에서 추상적 ‘필요’보다 상황이 가하는 긴박한 압력을 드러내는 ‘압박’이 원문의 뉘앙스를 잘 살립니다.
- source_word: ἀναλύοντες
  english_pob_choice: withdrew
  chosen_korean: 물러가고 있을 때
  alternatives_korean:
  - 떠나고 있을 때
  - 철수하고 있을 때
  - 떠나는 중에
  lexicon: LSJ
  rationale: ἀναλύω의 ‘떠나다/물러나다’ 의미를 반영하되, 서술 흐름에 맞게 진행형 표현으로 처리했습니다.
- source_word: προπεπτωκότα
  english_pob_choice: fallen forward
  chosen_korean: 엎드러진
  alternatives_korean:
