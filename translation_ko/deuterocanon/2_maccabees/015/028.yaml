  - 엎어져 있는
  - 쓰러진
  lexicon: LSJ
  rationale: προ-의 방향성은 있으나 한국어에서는 과도한 직역보다 ‘엎드러진’이 ‘앞으로/엎드려 쓰러진’ 상태를 가장 간결하게 전달합니다.
