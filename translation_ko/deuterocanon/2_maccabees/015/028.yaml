lexical_decisions:
- source_word: γεγυμνωμένοι
  english_pob_choice: relieved of the pressure
  chosen_korean: 그 압박에서 벗어나
  alternatives_korean:
  - 그 필요에서 벗어나
  - 그 긴박함에서 풀려나
  - 그 압박에서 해방되어
  lexicon: LSJ
  rationale: γυμνόω의 문자적 ‘벗기다’보다, χρείας와 결합한 관용적 의미인 ‘압박/필요에서 풀려남’을 한국어로 자연스럽게 옮겼습니다.
