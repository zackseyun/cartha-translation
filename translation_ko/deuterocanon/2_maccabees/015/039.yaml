  text: And if it is well written and suitably arranged[a], that is what I myself wanted; but if it is poorly and moderately done, this was what I could achieve.
  footnotes:
  - marker: a
    text: Or 'if it is poorly and only moderately done.' The Greek pairs two adverbs in the negative alternative, likely expressing an inferior or merely average literary result.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 만일 그것이 잘 쓰였고 알맞게 배열되었다면, 그것은 바로 제가 원하던 바입니다. 그러나 만일 그것이 못나고 보통 수준으로 된 것이라면, 그것은 제게 가능한 일이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘못나고 그저 보통 수준으로 된 것이라면’. 그리스어는 부정적 대안에서 두 부사를 나란히 두어, 문학적으로 떨어지거나 기껏해야 평범한 결과를 가리킬 수 있습니다.
    reason: lexical_alternative
