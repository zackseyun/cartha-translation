  text: 그리고 만일 그것이 잘 쓰였고 알맞게 구성되었다면, 그것이 바로 제가 바라던 바였습니다. 그러나 만일 그것이 변변치 않고 그저 보통 수준이라면[a], 그것이 제가 이루어 낼 수 있었던 정도였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘변변치 않고 보통 수준이라면’. 그리스어는 부정적 대안에서 두 부사를 나란히 두어, 문학적으로 질이 떨어지거나 기껏해야 평범한 결과를 가리킵니다.
    reason: lexical_alternative
