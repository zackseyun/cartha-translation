base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/021.yaml
  text: When Maccabeus saw the presence of the crowds[a], the varied array of weapons, and the savagery of the beasts positioned advantageously, he stretched out his hands to heaven and called on the wonder-working Lord, knowing that victory is not secured by weapons, but that, whenever it is judged right by him[b], he grants it to those who are worthy.
  footnotes:
  - marker: a
    text: '"The beasts" likely refers to war elephants in context, though the Greek here says only "beasts."'
    reason: cultural_note
  - marker: b
    text: Or "miracle-working Lord" for "wonder-working Lord."
    reason: lexical_alternative
translation:
  language: ko
  text: 마카베오는 많은 무리가 모여 있는 것과 여러 가지 무기 장비와 유리한 곳에 배치된 짐승들[a]의 사나움을 보고, 하늘을 향해 손을 들어 기적을 행하시는 주님[b]께 간구하였습니다. 그는 승리가 무기에 달린 것이 아니라, 주님께서 옳다고 판단하시는 대로 합당한 이들에게 승리를 주신다는 것을 알고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문의 ‘짐승들’은 문맥상 전쟁용 코끼리를 가리킬 가능성이 크지만, 그리스어 자체는 여기서 단지 ‘짐승들’이라고만 말합니다.
    reason: cultural_note
  - marker: b
    text: ‘기적을 행하시는 주님’ 대신 ‘이적을 행하시는 주님’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιδὼν
  english_pob_choice: saw
  chosen_korean: 보고
  alternatives_korean:
