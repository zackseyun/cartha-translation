base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/021.yaml
  text: When Maccabeus saw the presence of the crowds[a], the varied array of weapons, and the savagery of the beasts positioned advantageously, he stretched out his hands to heaven and called on the wonder-working Lord, knowing that victory is not secured by weapons, but that, whenever it is judged right by him[b], he grants it to those who are worthy.
  footnotes:
  - marker: a
    text: '"The beasts" likely refers to war elephants in context, though the Greek here says only "beasts."'
    reason: cultural_note
  - marker: b
    text: Or "miracle-working Lord" for "wonder-working Lord."
    reason: lexical_alternative
translation:
  language: ko
  text: 마카베오가 무리의 উপস্থিত와 각양각색의 무기, 그리고 유리한 곳에 배치된 짐승들의 흉포함을 보고, 하늘을 향해 손을 들어 기적을 행하시는 주님께 간구하였습니다. 그는 승리가 무기에 달린 것이 아니라, 주님께서 옳다고 판단하실 때에만 그분이 그것을 받을 만한 이들에게 주신다는 것을 알고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문의 ‘짐승들’은 문맥상 전쟁용 코끼리를 가리킬 가능성이 크지만, 그리스어 자체는 여기서 단지 ‘짐승들’이라고만 말합니다.
    reason: cultural_note
  - marker: b
    text: ‘기적을 행하시는 주님’ 대신 ‘이적을 행하시는 주님’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιδὼν
  english_pob_choice: saw
  chosen_korean: 보고
  alternatives_korean:
  - 알아보고
  - 분별하고
  - 살펴보고
  lexicon: BDAG
  rationale: 전장 상황을 한눈에 파악한 인식을 자연스럽게 드러내기 위해 단순한 시각 동사로 옮겼습니다.
- source_word: παρουσίαν / πλήθων
  english_pob_choice: presence / the crowds
  chosen_korean: 무리의 উপস্থিত와
  alternatives_korean:
  - 군중의 উপস্থিত와
  - 대군의 존재와
  - 무리의 현존과
  lexicon: BDAG
  rationale: 여기서는 단순한 숫자보다 적대 세력의 ‘몰려 있음/현존’이 핵심이므로, παρουσίαν의 존재감과 πλήθων의 다수를 함께 살렸습니다.
- source_word: ποικίλην παρασκευήν
  english_pob_choice: the varied array
  chosen_korean: 각양각색의 무기
  alternatives_korean:
  - 다양한 장비
  - 다채로운 무장
  - 여러 가지 무기
  lexicon: BDAG
  rationale: 문맥상 전투 준비물 가운데 특히 무기를 가리키므로, ‘무기’로 구체화하되 ποικίλην의 다양성을 보존했습니다.
- source_word: τερατοποιὸν
  english_pob_choice: wonder-working
  chosen_korean: 기적을 행하시는
  alternatives_korean:
  - 이적을 행하시는
  - 경이로운 일을 하시는
  - 기사를 행하시는
  lexicon: LSJ
  rationale: θεός가 아니라 κύριον을 수식하는 형용사로서, 하나님을 초월적 능력의 행위자로 부르는 뉘앙스를 한국어 관용의 ‘기적을 행하시는’으로 살렸습니다.
- source_word: κύριον
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주인
  lexicon: BDAG
  rationale: 이 문맥에서는 기도 대상이므로 존칭적 종교 용례인 ‘주님’이 가장 자연스럽습니다.
- source_word: περιποιεῖται τὴν νίκην
  english_pob_choice: he grants it
  chosen_korean: 그것을 받을 만한 이들에게 주신다는
  alternatives_korean:
  - 그것을 주신다는
  - 그 승리를 주신다는
  - 그 승리를 허락하신다는
  lexicon: BDAG
  rationale: 동사는 단순한 ‘획득’보다 ‘수여/부여’의 뜻이 강하므로, 승리를 하나님이 ‘주시는’ 행위로 옮겼습니다.
- source_word: τοῖς ἀξίοις
  english_pob_choice: to those who are worthy
  chosen_korean: 받을 만한 이들에게
  alternatives_korean:
  - 합당한 이들에게
  - 자격 있는 이들에게
  - 마땅한 이들에게
  lexicon: BDAG
  rationale: ἀξίοις의 평가적 요소를 살리되, 한국어에서 지나치게 도덕주의적으로 들리지 않도록 ‘받을 만한’으로 완화 없이 직역했습니다.
theological_decisions:
- issue: 승리의 원천과 인간 행위의 관계
  chosen_reading: 승리는 무기 자체가 아니라 주님의 판단과 수여에 달려 있다고 표현했습니다.
  alternative_readings:
  - 승리는 무기와 무관하게 오직 기적적으로만 주어진다고 표현
  - 승리는 인간의 가치에 따라 자동으로 주어진다고 표현
  rationale: 본문은 무기의 효력을 부정하면서도 하나님의 주권적 판단을 강조하므로, 기계적 공로나 전면적 비개입으로 단정하지 않고 긴장을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; κύριος → 주님'
