revisions:
- from: 마카베오가 무리의 উপস্থিত와 각양각색의 무기, 그리고 유리한 곳에 배치된 짐승들의 흉포함을 보고, 하늘을 향해 손을 들어 기적을 행하시는 주님께 간구하였습니다. 그는 승리가 무기에 달린 것이 아니라, 주님께서 옳다고 판단하실 때에만 그분이 그것을 받을 만한 이들에게 주신다는 것을 알고 있었습니다.[a][b]
  to: 마카베오는 많은 무리가 모여 있는 것과 여러 가지 무기 장비와 유리한 곳에 배치된 짐승들[a]의 사나움을 보고, 하늘을 향해 손을 들어 기적을 행하시는 주님[b]께 간구하였습니다. 그는 승리가 무기에 달린 것이 아니라, 주님께서 옳다고 판단하시는 대로 합당한 이들에게 승리를 주신다는 것을 알고 있었습니다.
  rationale: 손상된 한국어 표현을 ‘많은 무리가 모여 있는 것’으로 고쳐 παρουσία와 πλήθη의 현존·집결 의미를 살렸습니다. 다양한 군비의 갖춤은 ‘여러 가지 무기 장비’로, στρατηγically 배치된 동물의 위협은 ‘유리한 곳에 배치된 짐승들의 사나움’으로 옮겼습니다. 마지막 절은 하나님의 판단에 따른 승리의 수여와 ‘합당한 이들’이라는 평가를 유지하되, 원문에 없는 배타적 제한을 제거했습니다. 각주 표지는 해당 어구에 직접 배치했습니다.
