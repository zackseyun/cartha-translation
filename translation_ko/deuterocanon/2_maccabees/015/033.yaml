  yaml_path: translation/deuterocanon/2_maccabees/015/033.yaml
  text: And after cutting out the tongue of the ungodly Nikanor, he said he would throw it piece by piece to the birds, and hang up the wages of his folly opposite the temple.
  footnotes:
  - marker: a
    text: Or 'the due penalty for his folly.' The Greek expression τὰ ἐπίχειρα can denote recompense or what one receives in return for one's deeds.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 경건하지 않은 니카노르의 혀를 잘라낸 뒤, 그는 그것을 조각조각 새들에게 던지겠다고 말하였고, 그의 어리석음에 대한 대가를 성전 맞은편에 매달게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 어리석음에 대한 응당한 벌’로 옮길 수 있습니다. 그리스어 τὰ ἐπίχειρα는 보상이나 행위의 되갚음을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
