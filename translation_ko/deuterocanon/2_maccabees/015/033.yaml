theological_decisions:
- issue: 니카노르에 대한 종교적 평가 표현
  chosen_reading: ‘경건하지 않은’은 단순한 욕설이 아니라 하나님을 향한 불경건을 드러내는 평가로 유지했습니다.
  alternative_readings:
  - 불경한 니카노르
  - 사악한 니카노르
  rationale: 본문의 δυσσεβοῦς는 종교적·도덕적 불경건을 함께 담으므로, 그 신학적 무게를 유지하는 번역이 필요합니다.
  doctrine_reference: '번역 원칙: 읽기 쉬운 현대어로 옮기되, 본문이 지닌 신학적 평가를 약화시키지 않습니다.'
