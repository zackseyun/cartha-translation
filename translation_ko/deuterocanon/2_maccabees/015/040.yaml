  rationale: κατὰ μόνας의 ‘by itself/alone’ 의미를 자연스러운 한국어로 살려, 포도주만 따로 마시는 대비를 분명히 했습니다.
- source_word: ὕδωρ πάλιν πολέμιον
  english_pob_choice: and then again water, is unpleasant
  chosen_korean: 또 물만 마시는 것이 서로 맞지 않듯이
  alternatives_korean:
  - 또 물은 불쾌하듯이
  - 또 물이 적대적이듯이
  lexicon: LSJ
  rationale: πολέμιον의 직역인 ‘적대적’보다, 이 문맥에서의 음용 대비가 주는 ‘맞지 않음/불편함’을 한국어 관용으로 전달했습니다.
- source_word: ὁ δὲ τρόπον οἶνος ὕδατι συγκερασθεὶς ἤδη καὶ ἐπιτερπῇ τὴν χάριν ἀποτελεῖ
  english_pob_choice: but wine mixed with water becomes pleasing and produces delight
  chosen_korean: 물과 섞인 포도주는 이미 기쁨을 더하며 즐거움을 이루고
  alternatives_korean:
  - 물과 섞인 포도주는 이미 기쁘고 즐거움을 이룹니다
  - 물과 섞인 포도주는 이미 즐겁고 은혜로운 효과를 냅니다
  lexicon: LSJ
  rationale: ἐπιτερπῇ τὴν χάριν ἀποτελεῖ를 단일 형용사로 줄이기보다 ‘기쁨을 더하며 즐거움을 이룬다’로 풀어, 혼합의 결과로 생기는 심미적 효과를 살렸습니다.
- source_word: τὸ τῆς κατασκευῆς τοῦ λόγου
  english_pob_choice: the style of the composition
  chosen_korean: 글의 구성
  alternatives_korean:
