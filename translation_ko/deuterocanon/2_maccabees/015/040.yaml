base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/040.yaml
  text: For just as drinking wine by itself[a], and then again water, is unpleasant, but wine mixed with water becomes pleasing and produces delight, so also the style of the composition delights the ears of those who read the work. Here, then, will be the end.
  footnotes:
  - marker: a
    text: Or, more literally, 'water again is hostile'; the sense in context is that wine alone and water alone are each less agreeable than a proper mixture.
    reason: lexical_alternative
translation:
  language: ko
  text: 마치 포도주를 그것만 마시고, 또 물만 마시는 것이 서로 맞지 않듯이, 물과 섞인 포도주는 이미 기쁨을 더하며 즐거움을 이루고, 이처럼 글의 구성도 읽는 이들의 귀를 즐겁게 합니다. 여기서 끝입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘물은 다시 적대적이다’에 가깝지만, 문맥상 포도주와 물을 각각 따로 마실 때의 맛없는 대비를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶνον κατὰ μόνας πίνειν
  english_pob_choice: drinking wine by itself
