translation:
  language: ko
  text: 그가 거기에 도착하자 그 동족들과 제사장들을 불러 모으고, 그들을 제단 앞에 세운 뒤, 성채에 있던 자들을 불러오게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 구체적으로는 예루살렘의 요새 ‘아크라’를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενος
  english_pob_choice: when he arrived
  chosen_korean: 그가 거기에 도착하자
  alternatives_korean:
  - 그가 거기에 이르자
  - 그가 거기에 와서
  lexicon: BDAG
  rationale: 전행위를 나타내는 분사로 보아, 한국어에서는 뒤따르는 주절과의 시간 순서를 자연스럽게 드러내는 '-자' 구문이 적절합니다.
- source_word: συγκαλεσάμενος
  english_pob_choice: he called together
  chosen_korean: 불러 모으고
  alternatives_korean:
  - 소집하고
  - 함께 불러
  lexicon: BDAG
  rationale: 사람들을 한데 모으는 소집의 의미를 살리되, 현대 한국어에서 자연스럽고 간결한 표현으로 옮겼습니다.
- source_word: τοὺς ὁμοεθνεῖς
  english_pob_choice: his fellow countrymen
  chosen_korean: 그 동족들
  alternatives_korean:
  - 그의 동포들을
  - 같은 민족의 사람들을
  lexicon: LSJ
  rationale: ἴδιος 민족/국민이라는 혈연·민족적 연대를 강조하는 말이므로, 단순한 지리적 '나라사람'보다 '동족'이 원의미를 더 직접적으로 드러냅니다.
- source_word: πρὸ τοῦ θυσιαστηρίου στῆσας
  english_pob_choice: stood them before the altar
  chosen_korean: 그들을 제단 앞에 세운 뒤
  alternatives_korean:
  - 제단 앞에 세워 놓고
  - 제단 앞에 서게 한 뒤
  lexicon: BDAG
  rationale: 분사 στῆσας를 목적어를 가진 타동적 용법으로 이해한 영어 POB의 판단을 따라, '그들을… 세운 뒤'로 옮겨 장면의 동작을 분명히 했습니다.
- source_word: τοὺς ἐκ τῆς ἄκρας
  english_pob_choice: those from the citadel
  chosen_korean: 성채에 있던 자들
  alternatives_korean:
  - 아크라에 있던 자들
  - 요새에 있던 자들
  lexicon: LSJ
  rationale: ἄκρα는 일반적으로 성채/요새를 뜻하며, 예루살렘의 특정 요새 아크라를 가리킬 가능성도 있으므로 본문은 읽기 쉬운 일반어를 택하되, 더 구체적인 역사적 식별 가능성은 주석 여지가 있습니다.
theological_decisions:
- issue: ἄκρα의 역사적 지시 대상
  chosen_reading: 성채로 옮기고, 본문 안에서는 특정 고유명사화하지 않았습니다.
  alternative_readings:
  - 아크라
  - 예루살렘의 아크라 성채
  rationale: 이는 교리 문제가 아니라 역사·지리적 식별 문제이므로, 본문은 일반 명사로 유지해 가독성을 확보하고 구체적 대안은 번역 선택의 여지로 남깁니다.
  doctrine_reference: 'Translation philosophy: readable modern Korean with auditable alternatives preserved.'
