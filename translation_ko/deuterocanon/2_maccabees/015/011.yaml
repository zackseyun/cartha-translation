  text: And after arming each of them[a], not with the security of shields and spears so much as with encouragement from noble words, and after relating to them a trustworthy dream[b], he made them all rejoice.
  footnotes:
  - marker: a
    text: Or 'not so much with the safety of shields and spears as with the encouragement found in noble words.'
    reason: lexical_alternative
  - marker: b
    text: Or 'a credible dream.' The Greek describes the dream as worthy of trust.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그들 각 사람을 무장시킨 뒤, 방패와 창이 주는 보호로라기보다 훌륭한 말에 담긴 격려로[a] 무장시키고, 신뢰할 만한 꿈을[b] 들려주어 그들 모두를 크게 기쁘게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘방패와 창이 주는 보호보다 훌륭한 말에 담긴 격려로’. 그리스어의 비교 구문은 방패와 창의 보호보다 말에 담긴 격려를 더 강조합니다.
    reason: comparative_construction
  - marker: b
    text: 또는 ‘믿을 만한 꿈’. 그리스어는 그 꿈을 신뢰할 가치가 있는 것으로 묘사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθοπλίσας
  english_pob_choice: after arming
  chosen_korean: 무장을 갖추게 한 뒤
  alternatives_korean:
  - 완전히 무장시킨 뒤
  - 무장한 뒤
  lexicon: LSJ
  rationale: 부사적 분사로서의 선후 관계를 살리면서도, 한국어에서 자연스럽고 과장되지 않게 ‘무장을 갖추게 하다’로 옮겼습니다.
- source_word: οὐ τὴν ἀσπίδων καὶ λογχῶν ἀσφάλειαν, ὡς τὴν ἐν τοῖς ἀγαθοῖς λόγοις παράκλησιν
  english_pob_choice: not with the security of shields and spears so much as with encouragement from noble words
  chosen_korean: 방패와 창의 안전성으로가 아니라, 좋은 말들에서 오는 격려로
  alternatives_korean:
  - 방패와 창의 보호보다 오히려 좋은 말들로부터의 격려로
  - 방패와 창의 안전보다 좋은 말들 속의 격려로
  lexicon: LSJ
  rationale: οὐ...ὡς의 비교 구문을 ‘...으로가 아니라 ...로’로 풀어, 무기적 안전과 말의 격려를 대조하는 의미를 유지했습니다.
- source_word: ἐν τοῖς ἀγαθοῖς λόγοις
  english_pob_choice: from noble words
  chosen_korean: 좋은 말들에서 오는
  alternatives_korean:
  - 고결한 말들로부터 오는
  - 선한 말들에 있는
  lexicon: LSJ
  rationale: ἐν은 근원/매개를 드러내므로 ‘~에서 오는’으로 옮겼고, ἀγαθός는 문맥상 단순한 ‘좋은’보다 과도한 미화 없이도 충분합니다.
- source_word: ὄνειρον ἀξιόπιστον
  english_pob_choice: a trustworthy dream
  chosen_korean: 신뢰할 만한 꿈
  alternatives_korean:
  - 믿을 만한 꿈
  - 신빙성 있는 꿈
  lexicon: LSJ
  rationale: ἀξιόπιστος의 ‘믿을 만한, 신뢰할 만한’ 의미를 따라, 꿈의 출처를 단정하지 않으면서도 서술자의 긍정적 평가를 살렸습니다.
- source_word: ηὔφραινεν
  english_pob_choice: he made them all rejoice
  chosen_korean: 그는 그들 모두를 기쁘게 했습니다
  alternatives_korean:
  - 그는 그들 모두를 즐겁게 했습니다
  - 그는 그들 모두에게 기쁨을 주었습니다
  lexicon: LSJ
  rationale: εὐφραίνω의 사역적 의미를 자연스러운 현대 한국어로 옮기되, 과도한 감정 증폭 없이 결과를 분명히 했습니다.
theological_decisions:
- issue: 꿈의 성격을 어떻게 규정할 것인지
  chosen_reading: 꿈을 ‘신뢰할 만한 꿈’으로만 번역하고, 그 기원을 본문 밖에서 규정하지 않았습니다.
  alternative_readings:
  - 하나님이 주신 꿈
  - 계시성 있는 꿈
  rationale: 본문은 꿈이 신뢰할 만하다고 말하지만, 이 절만으로는 그 출처를 명시하지 않으므로 그 긴장을 유지했습니다.
  doctrine_reference: 본문이 명시하지 않은 신적 기원은 번역에서 추가하지 않음
