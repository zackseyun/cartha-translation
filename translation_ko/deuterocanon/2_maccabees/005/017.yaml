base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/017.yaml
  text: And Antiochus became arrogant in mind[a], not perceiving that the Master had been angered for a little while because of the sins of those dwelling in the city[c][b]; therefore there came to be disregard for the place.
  footnotes:
  - marker: a
    text: Or 'was lifted up in mind' or 'was puffed up in mind.' The Greek idiom expresses Antiochus's haughty self-exaltation.
    reason: lexical_alternative
  - marker: b
    text: '''The Master'' renders Greek despotes, a different title from kyrios (''Lord'').'
    reason: lexical_alternative
  - marker: c
    text: Or 'there was neglect/overlooking of the place,' likely referring to the sanctuary's temporary exposure to desecration.
    reason: alternative_reading
translation:
  language: ko
  text: 안티오코스는 마음이 교만해졌습니다[a]. 그는 그 도시에 사는 사람들의 죄 때문에 주인께서 잠시 진노하셨다는 것을 깨닫지 못했습니다[b]. 그러므로 그곳이 간과되었습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마음이 높아졌습니다’, ‘마음이 들떠 있었습니다’라는 뜻입니다. 그리스어 관용구는 안티오코스의 교만한 자기고양을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘주인’은 그리스어 δεσπότης를 옮긴 것입니다. 이는 κύριος(‘주’)와 다른 칭호입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그곳이 소홀히 여겨졌습니다’, ‘그곳이 돌봄을 받지 못했습니다’라고 할 수 있습니다. 여기서 ‘그곳’은 문맥상 성소를 가리킬 가능성이 큽니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμετεωρίζετο τὴν διάνοιαν
  english_pob_choice: became arrogant in mind
  chosen_korean: 마음이 교만해졌습니다
  alternatives_korean:
  - 마음이 들떠 있었습니다
  - 마음이 높아졌습니다
  - 생각이 교만해졌습니다
  lexicon: LSJ; BDAG
  rationale: 그리스어 관용구는 단순한 지적 혼란이 아니라 안티오코스의 오만한 자기과시를 뜻하므로, 현대 한국어에서 자연스럽고 평가가 분명한 ‘마음이 교만해졌습니다’로 옮겼습니다.
- source_word: οὐ συνορῶν
  english_pob_choice: not perceiving
  chosen_korean: 알아차리지 못했으므로
  alternatives_korean:
  - 깨닫지 못했으므로
  - 보지 못했으므로
  - 이해하지 못했으므로
  lexicon: LSJ
  rationale: 단순한 시각이 아니라 상황의 의미를 파악하지 못한 것을 가리키므로, 인식의 실패를 담는 ‘알아차리지 못했으므로’가 가장 적절합니다.
- source_word: ὁ δεσπότης
  english_pob_choice: the Master
  chosen_korean: 주께서
  alternatives_korean:
  - 주인이
  - 주인께서
  - 지배자께서
  lexicon: BDAG
  rationale: δεσπότης는 κύριος와 다른 칭호로서 ‘주께서’는 한국어에서 자연스럽게 주권적 주체를 드러내면서도, 본 절의 문맥에서 신적 행위자를 무리 없이 표현합니다.
- source_word: πάρορασις περὶ τὸν τόπον
  english_pob_choice: there came to be disregard for the place
  chosen_korean: 그곳에 대한 무시가 생겼습니다
  alternatives_korean:
  - 그곳이 간과되었습니다
  - 그곳이 소홀히 여겨졌습니다
  - 그곳에 대한 방치가 있었습니다
  lexicon: LSJ
  rationale: τόπος는 여기서 성소/그 장소를 가리키며, πάρορασις는 ‘간과됨, 무시됨’의 뜻이므로 결과 상태를 드러내는 ‘무시가 생겼습니다’로 옮겨 일시적 방치의 의미를 살렸습니다.
theological_decisions:
- issue: 하나님의 짧은 진노를 어떻게 표현할 것인가
  chosen_reading: ‘주께서 잠시 진노하셨다’로 옮겨, 죄에 대한 실제적 진노와 그 제한된 기간을 함께 드러냈습니다.
  alternative_readings:
  - ‘주께서 잠깐 노하셨다’
  - ‘주께서 잠시 분노하셨다’
  rationale: 본문은 도시 주민들의 죄로 인한 신적 진노가 있었으나 그것이 ‘잠시’였음을 강조합니다. 이 긴장을 약화하지 않기 위해 직설적으로 번역했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
