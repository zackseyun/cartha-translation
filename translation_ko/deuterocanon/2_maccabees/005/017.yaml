- from: 안티오코스는 마음이 교만해졌습니다[a]. 그는 도시의 주민들의 죄 때문에 주께서 잠시 진노하셨다는 것을 알아차리지 못했으므로[b], 그곳에 대한 무시가 생겼습니다[c].
  to: 안티오코스는 마음이 교만해졌습니다[a]. 그는 그 도시에 사는 사람들의 죄 때문에 주인께서 잠시 진노하셨다는 것을 깨닫지 못했습니다[b]. 그러므로 그곳이 간과되었습니다[c].
  rationale: δεσπότης를 ‘주인’으로 옮겨 κύριος와의 어휘적 차이를 보존했습니다. οὐ συνορῶν은 상황의 의미를 파악하지 못함을 나타내므로 ‘깨닫지 못했습니다’로 자연스럽게 처리했습니다. πάρορασις는 ‘간과되었습니다’로 옮겨 원문의 비인칭적 표현과 일시적인 방치의 의미를 유지했으며, 성소라는 문맥적 함의는 각주에서만 밝혀 과도한 해석을 피했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:48:50Z'
