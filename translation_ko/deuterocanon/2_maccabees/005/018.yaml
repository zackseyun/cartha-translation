  source_fidelity: 수정이 필요합니다. 그리스어의 οὗτος(‘이 사람’)는 헬리오도로스와 구별되는 지시어이며, 비교 대상인 헬리오도로스는 셀레우코스 왕에게 보물고를 점검하도록 파견된 인물입니다. 초안은 헬리오도로스를 처벌받은 주어로 바꾸고 ‘우리도 … 쓰러졌을 것’이라는 결과를 보충하여, 문장의 주체와 비교 구조를 바꾸었습니다.
  naturalness: ‘보물고를 점검하도록’, ‘나아오자마자 곧 채찍질을 당하고 그의 무모함이 꺾였을 것입니다’는 현대 표준어 합쇼체로 자연스럽습니다. 다만 본문에서 ‘이 사람’은 앞 문맥의 지시 대상을 가리키므로, 원문의 지시성을 보존하는 편이 안전합니다.
  terminology: ἁμαρτήμασιν은 ‘죄’, γαζοφυλάκιον은 ‘보물고’, μαστιγωθείς는 ‘채찍질을 당하다’로 적절합니다. ἐπίσκεψις는 단순 ‘보고’가 아니라 공식적 점검·조사의 뜻이므로 ‘보고를 위해’는 삭제해야 합니다. θράσος는 문맥상 ‘무모함’으로 옮길 수 있습니다.
  issues:
