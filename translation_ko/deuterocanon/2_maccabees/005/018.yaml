base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/018.yaml
  text: But if we had not become involved in many sins[a], then, just as Heliodorus, who was sent by King Seleucus to inspect the treasury, was immediately scourged and turned back from his boldness when he came forward, so also would we have been struck down.
  footnotes:
  - marker: a
    text: 'Greek literally, ''if we had not happened to be entangled in many sins ... this man, having come forward, was immediately scourged and turned back from his boldness.'' The main text makes explicit in English the implied comparison: what happened to Heliodorus would likewise have happened to us.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 우리가 많은 죄에 얽매이는 일이 없었더라면, 마치 헬리오도로스가 왕 셀레우코스에 의해 보고를 위해 보물고를 살피도록 보내졌다가, 앞으로 나아오자마자 곧 채찍질을 당하고 그의 무모함에서 꺾였던 것처럼, 우리도 그렇게 맞아 쓰러졌을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 직역하면 ‘많은 죄에 얽매이는 일이 없었더라면 … 이 사람이 앞으로 나아오자마자 곧 채찍질을 당하고 그의 무모함에서 꺾였을 것이다’라는 뜻입니다. 본문은 헬리오도로스에게 일어난 일을 우리에게도 해당하는 비교로 풀어 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέβην προενέχεσθαι
  english_pob_choice: had not become involved / to be entangled
  chosen_korean: 많은 죄에 얽매이는 일이 없었더라면
  alternatives_korean:
  - 많은 죄에 휘말리는 일이 없었더라면
  - 많은 죄에 관여하는 일이 없었더라면
  lexicon: LSJ
  rationale: 결합된 조건문은 단순한 ‘우연히 생기다’보다 죄와의 얽힘을 드러내는 표현이 필요하므로, ‘얽매이다’로 moral entanglement를 살렸습니다.
- source_word: ἐπίσκεψιν τοῦ γαζοφυλακίου
  english_pob_choice: to inspect the treasury
  chosen_korean: 보물고를 살피도록
  alternatives_korean:
  - 보물고를 조사하도록
  - 금고를 점검하도록
  lexicon: LSJ
  rationale: ἐπίσκεψις는 단순 방문이 아니라 공식적인 점검·조사를 가리키므로 ‘살피다’로 자연스럽게 옮기되, 문맥상 재무 보관 장소는 ‘보물고’로 표현했습니다.
- source_word: προαχθεὶς παραχρῆμα μαστιγωθεὶς
  english_pob_choice: when he came forward, was immediately scourged
  chosen_korean: 앞으로 나아오자마자 곧 채찍질을 당하고
  alternatives_korean:
  - 나아오자마자 곧 채찍질을 당하고
  - 전진하자마자 즉시 매질을 당하고
  lexicon: LSJ
  rationale: 연속된 분사들이 일으키는 즉각성을 살리기 위해 ‘앞으로 나아오자마자 곧’으로 옮기고, μαστιγόω의 강한 형벌성을 ‘채찍질을 당하다’로 유지했습니다.
- source_word: ἀνετράπη τοῦ θράσους
  english_pob_choice: was turned back from his boldness
  chosen_korean: 그의 무모함에서 꺾였던 것처럼
  alternatives_korean:
  - 그의 대담함이 꺾였던 것처럼
  - 그의 패기에서 꺾였던 것처럼
  lexicon: LSJ
  rationale: θράσος는 단순 용기가 아니라 뻔뻔한 대담함/무모함의 뉘앙스를 가지므로, 전통적 미화보다 ‘무모함’이 문맥을 더 정확히 드러냅니다.
theological_decisions:
- issue: 비교문에서 생략된 결과절을 한국어로 어떻게 처리할지
  chosen_reading: 그렇게 맞아 쓰러졌을 것입니다로 비교문의 귀결을 자연스럽게 완성했습니다.
  alternative_readings:
  - 결과절을 더 생략적으로 두는 방식
  - 직역처럼 문장을 덜 매끈하게 끝내는 방식
  rationale: 그리스어는 비교를 통해 함축된 귀결을 갖고 있어, 한국어에서는 의미가 분명히 전달되도록 결과를 드러내는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence'
