    rationale: 초안은 헬리오도로스가 ‘앞으로 나아오자마자’ 처벌받은 것으로 번역하지만, 원문은 ‘이 사람’(οὗτος)이 헬리오도로스의 경우처럼 처벌받았을 것이라는 비교를 이룹니다. ‘우리도 … 맞아 쓰러졌을 것입니다’는 원문에 없는 주체와 결과를 도입합니다.
