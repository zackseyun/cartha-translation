    rationale: αὔξησιν의 목적 의미는 보존하되 ‘번영’으로 옮기면 현대 표준 한국어에서 명료합니다.
  - severity: low
    issue: ‘속된 손’은 현대 한국어에서 다소 부자연스럽습니다.
