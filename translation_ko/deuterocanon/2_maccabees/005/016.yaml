  text: and with his polluted hands taking the sacred vessels[b][a], and with profane hands dragging away the things that had been dedicated by many kings for the increase and glory and honor of the place.
  footnotes:
  - marker: a
    text: Or 'the things that many kings had set up'—the Greek participle can more literally mean 'set up,' here likely referring to royal votive gifts dedicated in the temple.
    reason: lexical_alternative
  - marker: b
    text: '''The place'' is a reverential way of referring to the temple.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 더러운 손으로 거룩한 기물들을 집어 들고, 많은 왕들이 그곳의 증대와 영광과 존귀를 위해 세워 둔 것들을 속된 손으로 끌어갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘많은 왕들이 세워 둔 것들’로도 옮길 수 있습니다. 그리스어 분사는 더 문자적으로는 ‘세우다’의 뜻을 가지며, 여기서는 성전 봉헌물을 가리킬 가능성이 큽니다.
    reason: alternative_reading
  - marker: b
    text: ‘그곳’은 성전을 공손하게 가리키는 표현입니다.
    reason: cultural_note
