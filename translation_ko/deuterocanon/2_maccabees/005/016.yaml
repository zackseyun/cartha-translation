  text: and with his polluted hands taking the sacred vessels[b][a], and with profane hands dragging away the things that had been dedicated by many kings for the increase and glory and honor of the place.
  footnotes:
  - marker: a
    text: Or 'the things that many kings had set up'—the Greek participle can more literally mean 'set up,' here likely referring to royal votive gifts dedicated in the temple.
    reason: lexical_alternative
  - marker: b
    text: '''The place'' is a reverential way of referring to the temple.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그는 더럽혀진 손으로 거룩한 기물들을 집어 들고, 많은 왕들이 그곳[b]의 번영과 영광과 명예를 위해 세워 둔 것들[a]을 불경한 손으로 끌어갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘많은 왕들이 봉헌한 것들’로 옮길 수 있습니다. 그리스어는 더 문자적으로 ‘세워진 것들’이라는 뜻이며, 여기서는 성전에 바쳐 세워 둔 왕들의 봉헌물을 가리킬 가능성이 큽니다.
    reason: alternative_reading
  - marker: b
    text: ‘그곳’은 성전을 공손하게 가리키는 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: μιαραῖς
  english_pob_choice: polluted
  chosen_korean: 더러운
  alternatives_korean:
  - 부정한
  - 오염된
  - 더럽혀진
  lexicon: LSJ
  rationale: 문맥상 성전 모독의 의미가 핵심이므로, 손의 오염과 제의적 불결을 함께 드러내는 ‘더러운’이 가장 자연스럽습니다.
- source_word: ἱερὰ σκεύη
  english_pob_choice: sacred vessels
  chosen_korean: 거룩한 기물들
  alternatives_korean:
  - 성스러운 그릇들
  - 거룩한 그릇들
  - 성전 기물들
  lexicon: LSJ
  rationale: σκεύη는 단순한 그릇보다 성전의 제의적 기물을 가리키므로, ‘기물들’로 넓게 옮겨 성전 물품의 범위를 살렸습니다.
- source_word: ἀνασταθέντα
  english_pob_choice: had been dedicated
  chosen_korean: 세워 둔 것들
  alternatives_korean:
  - 봉헌한 것들
  - 바쳐 둔 것들
  - 세워 놓은 것들
  lexicon: LSJ
  rationale: 이 분사는 왕들이 성전에 두거나 봉헌한 물품을 가리킬 수 있어, 영어 주석의 양가성을 반영해 ‘세워 둔 것들’로 두어 ‘세워 놓다/봉헌하다’의 의미를 함께 열어 두었습니다.
- source_word: βεβήλοις
  english_pob_choice: profane
  chosen_korean: 속된
  alternatives_korean:
  - 불경한
  - 세속적인
  - 부정한
  lexicon: LSJ
  rationale: 거룩한 것과의 대비를 살리면서도, 제의적 무례와 신성 모독의 뉘앙스를 현대 한국어에서 가장 직접적으로 드러내는 말로 ‘속된’을 택했습니다.
theological_decisions:
- issue: 성전 모독을 드러내는 거룩함/속됨의 대조
  chosen_reading: ‘거룩한 기물들’과 ‘속된 손’의 대조를 유지해, 단순 절도보다 성소 훼손의 죄성을 분명히 했습니다.
  alternative_readings:
  - 일반적인 ‘성전 물건들’과 ‘더러운 손’으로 완화하는 방식
  rationale: 본문은 행위의 폭력성뿐 아니라 거룩한 것에 대한 침범을 강조하므로, 대조를 평준화하지 않고 보존하는 편이 원문 의도에 더 가깝습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
