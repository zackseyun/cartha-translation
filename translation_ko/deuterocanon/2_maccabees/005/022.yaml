base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/022.yaml
  text: 'He also left overseers to mistreat the nation: in Jerusalem[a], Philip, a Phrygian by birth, but in character more barbarous than the one who appointed him[b];'
  footnotes:
  - marker: a
    text: Or 'to oppress the people.' The Greek infinitive τοῦ κακοῦν can denote harming, mistreating, or oppressing.
    reason: lexical_alternative
  - marker: b
    text: '''More barbarous than the one who appointed him'' intensifies the author''s moral judgment: Philip is portrayed as even harsher than the ruler who installed him.'
    reason: cultural_note
translation:
  language: ko
  text: 그는 백성을 해치도록 감독관들도 남겨 두었는데, 예루살렘에는 프리기아 출신으로 자신을 임명한 사람보다 더 야만적인 성품을 지닌 빌립을 두었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘해치다’는 여기서 단순한 손상뿐 아니라 ‘억압하다’, ‘학대하다’라는 의미까지 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘자신을 임명한 사람보다 더 야만적인 성품을 지닌’이라는 말은 빌립이 자신을 임명한 자보다도 더 가혹했다고 보는 저자의 강한 도덕적 판단을 반영합니다.
    reason: cultural_note
lexical_decisions:
- source_word: κατέλειπεν
  english_pob_choice: left
  chosen_korean: 남겨 두었는데
  alternatives_korean:
  - 두었습니다
  - 남겼습니다
  - 배치했습니다
  lexicon: LSJ
  rationale: ‘남겨 두다’는 단순한 배치가 아니라 뒤에 남겨 두어 그 기능을 수행하게 했다는 뉘앙스를 살리면서, 문맥상의 임명 의미도 자연스럽게 드러냅니다.
- source_word: ἐπιστάτας
  english_pob_choice: overseers
  chosen_korean: 감독들
  alternatives_korean:
  - 관리들
  - 감시자들
  - 책임자들
  lexicon: LSJ
  rationale: ἔπιστα- 어근은 ‘맡아 다스리는 사람들’을 가리키므로, 본문이 말하는 위임된 통치 역할을 비교적 직접적으로 드러내는 ‘감독들’을 택했습니다.
- source_word: τοῦ κακοῦν τὸ γένος
  english_pob_choice: to mistreat the nation
  chosen_korean: 백성을 해치도록
  alternatives_korean:
  - 나라를 학대하도록
  - 백성을 학대하도록
  - 민족을 억압하도록
  lexicon: LSJ
  rationale: κακοῦν은 단순한 억압보다 넓게 ‘해치다, 악하게 대하다’의 뜻이 있어, 본문의 지속적 가해를 살리면서도 현대 한국어에서 자연스러운 ‘해치다’로 옮겼습니다.
- source_word: τὸ γένος
  english_pob_choice: the nation
  chosen_korean: 백성
  alternatives_korean:
  - 민족
  - 나라
  - 족속
  lexicon: LSJ
  rationale: 이곳의 γένος는 유대 공동체 전체를 가리키는 집합적 표현이므로, 현대 독자에게 가장 자연스럽게 집단을 지시하는 ‘백성’을 선택했습니다.
- source_word: τὸ μὲν γένος Φρύγα
  english_pob_choice: a Phrygian by birth
  chosen_korean: 프리기아 출신의
  alternatives_korean:
  - 프리기아 태생의
  - 프리기아 사람인
  - 프리기아 혈통의
  lexicon: LSJ
  rationale: γένoς의 출신/혈통 표지를 ‘출신의’로 간결하게 살려, 다음의 성격 묘사와 대조가 잘 드러나게 했습니다.
- source_word: βαρβαρώτερον ἔχοντα
  english_pob_choice: more barbarous
  chosen_korean: 더 야만적이었습니다
  alternatives_korean:
  - 더 거칠었습니다
  - 더 잔혹했습니다
  - 더 야만스러웠습니다
  lexicon: LSJ
  rationale: βάρβαρος의 비교급을 직역에 가깝게 반영하되, 한국어에서 역사적·도덕적 비난을 함께 담는 ‘야만적이다’로 옮겨 원문의 강한 평가를 보존했습니다.
theological_decisions:
- issue: 본문의 정치적·도덕적 평가를 약화시키지 않는 번역
  chosen_reading: 성격은 그를 임명한 사람보다도 더 야만적이었습니다.
  alternative_readings:
  - 성격은 그를 세운 사람보다 더 잔인했습니다
  - 성격은 임명한 자보다 더 거칠었습니다
  rationale: 원문은 단순 정보 전달이 아니라, 임명자보다 더 심한 폭력성과 야만성을 부각하는 저자의 평가를 담고 있으므로 그 평가 강도를 유지했습니다.
  doctrine_reference: 역사서술의 저자 평가를 그대로 전달하는 원칙
