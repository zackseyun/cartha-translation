  text: But when a false rumor arose that Antiochus had passed from life[a], Jason, taking no fewer than a thousand men, launched a sudden attack against the city. When those on the wall had been driven back, and at last the city was already being taken, Menelaus fled into the citadel.
  footnotes:
  - marker: a
    text: Greek literally, 'had changed life,' an idiomatic way of saying that Antiochus had died.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 안티오코스가 세상을 떠났다는 거짓 소문이 퍼지자, 야손은 천 명이 조금 넘지 않는 사람들을 데리고 갑자기 그 도시에 기습을 가했습니다. 성벽 위에 있던 자들이 밀려나고, 마침내 도성이 이미 점령되어 가는 가운데, 메넬라오스는 요새로 도망했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어의 μετηλλαχότος τὸν βίον은 문자적으로는 ‘삶을 바꾸었다’는 뜻의 관용구로, 여기서는 안티오코스의 죽음을 완곡하게 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλιάς ψευδοῦς
  english_pob_choice: a false rumor
  chosen_korean: 거짓 소문
  alternatives_korean:
  - 거짓 보고
  - 거짓 말
  lexicon: LSJ
  rationale: λαλιάς는 여기서 단순한 ‘말’보다 퍼져 나간 소식을 가리키므로, 문맥에 맞게 ‘소문’으로 옮기는 것이 가장 자연스럽습니다.
- source_word: μετηλλαχότος ... τὸν βίον
  english_pob_choice: had passed from life
  chosen_korean: 세상을 떠났다는
  alternatives_korean:
  - 죽었다는
  - 이 세상을 떠났다는
  lexicon: LSJ
  rationale: 직역하면 ‘삶을 바꾸었다’는 관용구로 죽음을 완곡하게 말하므로, 한국어에서도 완곡성을 살린 표현을 택했습니다.
- source_word: οὐκ ἐλάττους τῶν χιλίων
  english_pob_choice: no fewer than a thousand men
  chosen_korean: 천 명이 조금 넘지 않는 사람들
  alternatives_korean:
  - 적어도 천 명의 사람들
  - 천 명이 넘는 사람들
  lexicon: LSJ
  rationale: 수량의 하한을 분명히 하면서도 과장을 피하는 표현으로 옮겼습니다. ‘사람들’은 군사적 집단을 자연스럽게 포괄합니다.
- source_word: ἐφνιδίως ... συνετελέσατο ἐπίθεσιν
  english_pob_choice: launched a sudden attack
  chosen_korean: 갑자기 ... 기습을 가했습니다
  alternatives_korean:
  - 뜻밖에 공격을 감행했습니다
  - 갑작스러운 공격을 퍼부었습니다
  lexicon: LSJ
  rationale: ἐφνιδίως와 ἐπίθεσιν의 군사적 뉘앙스를 살리되, 한국어 문장에서는 ‘기습을 가하다’가 가장 간결하고 생생합니다.
- source_word: ἐφυγάδευεν
  english_pob_choice: fled into the citadel
  chosen_korean: 요새로 도망했습니다
  alternatives_korean:
  - 성채로 도망했습니다
  - 도피했습니다
  lexicon: LSJ
  rationale: 동사가 도망함을 뜻하므로 평이하게 처리했고, ἀκρόπολις는 역사적 맥락상 ‘요새’가 한국어 독자에게 더 분명합니다.
theological_decisions:
- issue: 안티오코스의 죽음을 나타내는 완곡한 관용구
  chosen_reading: ‘세상을 떠났다는’으로 완곡하게 처리해 그리스어의 우회 표현을 보존합니다.
  alternative_readings:
  - ‘죽었다는’으로 직설적으로 번역
  - ‘이 세상을 떠났다는’으로 더 길게 번역
  rationale: 본문은 정치적 소문을 전달하는 서술이며, 죽음을 직접 선언하기보다 관용적 완곡어법을 사용합니다. 따라서 한국어도 그 뉘앙스를 유지하는 것이 좋습니다.
  doctrine_reference: 문체/서술 뉘앙스 보존
