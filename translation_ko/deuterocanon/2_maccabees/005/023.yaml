  text: and in Gerizim[a], Andronicus; and besides these, Menelaus surpassed the others in wickedness toward the citizens[b], having a hateful disposition toward the Jewish citizens.
  footnotes:
  - marker: a
    text: Or, 'and at Gerizim, Andronicus.' The preposition may be rendered 'in' or 'at' with the place name.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'was worst beyond the others' or 'outstripped the others in the worst ways.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그리심에는 안드로니코스를 두었으며[a], 이들에 더하여 메넬라오스는 시민들에게 저지른 악행에서 다른 사람들보다 더 심했으며[b], 유대 시민들에게 적대적인 성향을 품고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리심에서’. ἐν은 이 지명과 함께 ‘~에’ 또는 ‘~에서’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘다른 이들보다 가장 나쁘게 굴었다’ 또는 ‘가장 나쁜 일에서 다른 이들을 능가했다’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν δὲ Γαριζεὶν
  english_pob_choice: and in Gerizim
  chosen_korean: 그리고 그리짐에서
  alternatives_korean:
  - 그리고 그리짐에
  - 그리고 그리짐 안에서
  lexicon: LSJ
  rationale: 장소명과 함께 쓰인 ἐν은 이 문맥에서 자연스러운 위치 표지로 읽히므로, ‘그리짐에서’로 옮겨 장소성을 살렸습니다.
- source_word: Ἀνδρόνικον
  english_pob_choice: Andronicus
  chosen_korean: 안드로니코스
  alternatives_korean:
  - 안드로니쿠스
  - 안드로닉
  lexicon: 표준 외래어 표기
  rationale: 고유명사는 현대 한국어 음역 관례에 따라 표기했습니다.
- source_word: χείριστα τῶν ἄλλων ὑπερήρτετο
  english_pob_choice: surpassed the others in doing evil
  chosen_korean: 다른 사람들보다 시민들에게 행악에서 더욱 앞섰으며
  alternatives_korean:
  - 다른 사람들보다 시민들에게서 가장 악했으며
  - 다른 사람들보다 시민들에게 악행으로 앞섰으며
  lexicon: LSJ
  rationale: χειριστα와 ὑπερήρτετο의 비교·최상급적 악평을 살리되, 한국어에서는 ‘행악에서 앞서다’로 비교 구조와 도덕적 평가를 함께 드러냈습니다.
- source_word: πρὸς τοὺς πολίτας Ἰουδαίους
  english_pob_choice: toward the Jewish citizens
  chosen_korean: 유대 시민들을 향해
  alternatives_korean:
  - 유대인 시민들을 향해
  - 유대 사람들 시민들을 향해
  lexicon: LSJ
  rationale: πολίτας와 Ἰουδαίους의 이중 표지를 보존해야 하므로 시민 정체성을 살렸고, 문맥상 자연스럽게 ‘향해’로 적대의 방향을 나타냈습니다.
- source_word: ἀπεχθῆ ... διάθεσιν
  english_pob_choice: a hateful disposition
  chosen_korean: 혐오스러운 성향
  alternatives_korean:
  - 미운 태도
  - 적대적인 성향
  lexicon: LSJ
  rationale: διάθεσις는 태도/성향을 뜻하고 ἀπεχθής는 혐오스럽고 미운 성격을 나타내므로, 지속적 내적 태도를 드러내는 ‘성향’을 선택했습니다.
theological_decisions:
- issue: πολίταις / πολίτας를 단순한 ‘사람들’로 완화할지, ‘시민들’로 유지할지
  chosen_reading: ‘시민들’로 유지했습니다.
  alternative_readings:
  - 사람들
  - 동포들
  rationale: 본문은 반복적으로 πολίτης를 사용하여 윤리적 비난뿐 아니라 시민 공동체 내부의 적대라는 정치·사회적 뉘앙스를 강조합니다. 이를 살리기 위해 ‘시민들’을 유지했습니다.
  doctrine_reference: 번역 원칙 §1, §5
- issue: χείριστα τῶν ἄλλων ὑπερήρτετο의 강도를 어떻게 옮길지
  chosen_reading: ‘다른 사람들보다…행악에서 더욱 앞섰으며’로 옮겼습니다.
  alternative_readings:
  - 다른 사람들보다 더 악했습니다
  - 다른 사람들보다 악행으로 뛰어났습니다
  rationale: 이 표현은 단순 비교를 넘어 강한 도덕적 규탄을 담지만, 한국어에서 과도하게 해설적으로 확장하지 않도록 비교적 직역에 가까운 표현으로 균형을 맞췄습니다.
  doctrine_reference: 번역 원칙 §6
