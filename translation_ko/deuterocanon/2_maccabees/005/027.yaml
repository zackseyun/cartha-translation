  yaml_path: translation/deuterocanon/2_maccabees/005/027.yaml
  text: But Judas[a], who was also called Maccabeus, having become about the tenth and having withdrawn, lived in the mountains like a wild animal with those who were with him, and they continued feeding on vegetation so as not to share in the defilement.
  footnotes:
  - marker: a
    text: Or, more explicitly, 'having become one of about ten,' that is, reduced to a band of roughly ten men. The Greek phrase is compressed and approximate.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 마카베오라고도 불리던 유다는 약 열 명쯤 되는 무리의 한 사람이 되어 물러난 뒤, 그와 함께 있던 이들과 산에서 들짐승처럼 살았으며, 그들은 부정에 참여하지 않기 위해 풀을 먹고 지냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘약 열 명쯤 되는 무리의 한 사람이 되어’는 압축된 그리스어 표현을 자연스럽게 풀어 옮긴 것입니다. 직역하면 ‘대략 열 번째가 되어’이며, 약 열 명가량의 무리에 속하게 되었다는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰούδας δὲ ὁ καὶ Μακκαβαῖος
  english_pob_choice: Judas, who was also called Maccabeus
  chosen_korean: 마카베오라고도 불리던 유다
  alternatives_korean:
  - 마카베오라고도 불린 유다
  - 마카베오라 불리던 유다
  lexicon: LSJ
  rationale: ὁ καὶ는 별칭/이명 도입이므로 ‘라고도 불리던’으로 자연스럽게 옮겼고, Μακκαβαῖος는 한국어에서 통용되는 이름형을 따라 ‘마카베오’로 음역했습니다.
- source_word: δέκατός που γενηθεὶς
  english_pob_choice: having become about the tenth
  chosen_korean: 십여 명가량이 되어
  alternatives_korean:
  - 대략 열 명이 되어
  - 열 명가량이 되어
  lexicon: LSJ
  rationale: που의 대략성을 살리면서, 압축된 그리스어 표현이 ‘열 명 남짓한 무리’로 축소되었다는 뜻을 한국어에서 가장 자연스럽게 전달하도록 처리했습니다.
- source_word: ἐν τοῖς ὄρεσι θηρίων τρόπον διέζη
  english_pob_choice: lived in the mountains like a wild animal
  chosen_korean: 산에서 들짐승처럼 살며
  alternatives_korean:
  - 산에서 들짐승 같은 삶을 살며
  - 산에서 야수처럼 살며
  lexicon: LSJ
  rationale: ὄρεσι는 ‘산들’이지만 단수 문맥에서는 자연스럽게 ‘산에서’로 옮길 수 있고, θηρίων τρόπον은 문어적으로도 ‘들짐승처럼’이 원뜻을 잘 보존합니다.
- source_word: τὴν χορτώδη τροφὴν σιτούμενοι διετέλουν
  english_pob_choice: they continued feeding on vegetation
  chosen_korean: 초목을 먹고 지냈습니다
  alternatives_korean:
  - 풀과 초목을 먹으며 지냈습니다
  - 초목으로 연명했습니다
  lexicon: LSJ
  rationale: χορτώδη τροφή는 초식성 식량을 가리키므로 ‘초목’으로 옮겼고, σιτούμενοι διετέλουν의 지속상을 ‘먹고 지냈습니다’로 간결하게 살렸습니다.
- source_word: πρὸς τῷ μὴ μετασχεῖν τοῦ μολυσμοῦ
  english_pob_choice: so as not to share in the defilement
  chosen_korean: 부정에 참여하지 않으려고
  alternatives_korean:
  - 더러움에 참여하지 않으려고
  - 오염에 함께하지 않으려고
  lexicon: LSJ
  rationale: μετασχεῖν은 ‘함께 나누다/참여하다’의 뜻이어서 ‘참여하다’로 살렸고, μολυσμός는 의례적·도덕적 오염의 긴장을 살리되 한국어 성경 문맥에 자연스러운 ‘부정’으로 옮겼습니다.
theological_decisions:
- issue: μολυσμός의 범주
  chosen_reading: 의례적 부정과 신앙적 타락의 가능성을 함께 품는 ‘부정’으로 유지했습니다.
  alternative_readings:
  - 의식적 부정만 가리킴
  - 일반적 오염/타락만 가리킴
  rationale: 문맥상 금지된 행위나 식물/식품과 연관된 오염을 피하려는 뜻이지만, 본문은 그 의미를 한 범주로만 좁히지 않으므로 ‘부정’으로 보존하는 편이 source에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
