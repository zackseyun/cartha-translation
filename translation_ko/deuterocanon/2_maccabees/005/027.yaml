  source_fidelity: δέκατος που γενηθείς는 압축적이고 해석상 다소 난해한 표현입니다. 초안의 ‘십여 명가량이 되어’는 유다 한 사람이 인원수가 되는 듯한 문법적 어색함이 있고, ‘십여 명’은 ‘열 명 남짓’이라는 뜻이어서 που의 ‘대략’과 겹칩니다. 이를 약 열 명 되는 무리의 한 사람이 되었다는 가능한 뜻으로 명료하게 옮기고 각주로 그리스어의 압축성과 직역을 보존하는 것이 안전합니다. 나머지 내용은 산으로 물러나 동료들과 들짐승처럼 살고 초목성 음식을 계속 먹어 부정에 참여하지 않으려 했다는 원문의 흐름을 충실히 반영합니다.
  naturalness: 합쇼체는 유지되어 있으나, ‘유다는 십여 명가량이 되어’는 현대 한국어에서 주어와 서술어의 관계가 부자연스럽습니다. 또한 ‘살며, 그들은’보다 ‘살았으며, 그들은’이 문장 연결과 시제가 더 자연스럽습니다.
  terminology: ‘마카베오’, ‘들짐승’, ‘부정’은 한국어 성경 문맥과 원문의 의미 범위에 적절합니다. χορτώδη τροφή는 일반적인 ‘초목’보다 사람이 먹는 풀·식물성 먹거리의 뜻을 분명히 하는 ‘풀을 먹고’가 자연스럽습니다. ‘부정에 참여하지 않기 위해’는 μετασχεῖν의 참여·분여 의미를 보존합니다.
