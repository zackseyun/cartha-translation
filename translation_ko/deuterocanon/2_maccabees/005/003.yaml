  text: and the brandishing of swords[a], and squadrons of cavalry drawn up, and attacks and counterattacks by both sides, and the movement of shields, and masses of spears, and the shooting of missiles, and the gleaming of golden ornaments[b], and all kinds of armor.
  footnotes:
  - marker: a
    text: The Greek phrase translated 'masses of spears' contains a difficult term (καμάτων) in this context; it may refer more generally to masses of pole-weapons or similar battle gear.
    reason: textual_variant
  - marker: b
    text: Or 'raids by both sides' for 'counterattacks by both sides'; the Greek καταδρομάς can denote rushing attacks or raids.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 칼을 휘두르는 모습과, 정렬된 기마대와, 양쪽의 공격과 반격과, 방패의 움직임과, 창 무리와, 투사체를 쏘아 내는 것과, 금 장식의 번쩍임과, 온갖 갑옷을 보았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘창 무리’에 해당하는 그리스어 καμάτων은 이 문맥에서 난해하여, 전투 장비나 장창류의 집합을 가리키는 것으로 이해할 수 있습니다.
    reason: textual_variant
  - marker: b
    text: καταδρομάς는 ‘반격’뿐 아니라 ‘습격’이나 ‘기습 돌격’도 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαχαιρῶν σπασμούς
  english_pob_choice: the brandishing of swords
  chosen_korean: 칼을 휘두르는 모습
  alternatives_korean:
  - 칼을 빼드는 모습
  - 검을 휘두르는 모습
  lexicon: LSJ
  rationale: σπασμός는 ‘휘두름/빼냄’의 동작을 가리킬 수 있으므로, 전투 장면의 시각적·동작적 뉘앙스를 살려 ‘칼을 휘두르는 모습’으로 옮겼습니다.
- source_word: ἴλας ἵππων διατεταγμένας
  english_pob_choice: squadrons of cavalry drawn up
  chosen_korean: 정렬된 기마대
  alternatives_korean:
  - 배치된 기병대
  - 대열을 갖춘 기마대
  lexicon: LSJ
  rationale: ἴλη는 기마 부대이고 διατεταγμένας는 질서 있게 배치된 상태를 뜻하므로, 군사적 진형을 자연스럽게 드러내는 ‘정렬된 기마대’로 옮겼습니다.
- source_word: καμάτων πλήθη
  english_pob_choice: masses of spears
  chosen_korean: 창 무리
  alternatives_korean:
  - 창의 떼
  - 창의 대군
  lexicon: LSJ
  rationale: καμάτων은 이 문맥에서 난해하므로, 영어 POB의 판단을 따라 전투 무기 집합을 가리키는 말로 이해해 ‘창 무리’로 간명하게 처리했습니다.
- source_word: χρυσέων κόσμων ἐκλάμψεις
  english_pob_choice: the gleaming of golden ornaments
  chosen_korean: 금 장식의 번쩍임
  alternatives_korean:
  - 황금 장식의 빛남
  - 금으로 된 장식의 번뜩임
  lexicon: LSJ
  rationale: κόσμος는 장식·장신구를 뜻할 수 있고 ἐκλάμψεις는 강한 반짝임을 가리키므로, ‘금 장식의 번쩍임’이 원문의 시각적 효과를 가장 सीधे 반영합니다.
- source_word: παντοίους θωρακισμούς
  english_pob_choice: all kinds of armor
  chosen_korean: 온갖 갑옷
  alternatives_korean:
  - 모든 종류의 무장
  - 여러 가지 갑옷
  lexicon: LSJ
  rationale: θωρακισμός는 갑옷/방호구를 가리키므로, 다양성을 강조하는 παντοίους를 살려 ‘온갖 갑옷’으로 옮겼습니다.
theological_decisions:
- issue: 전투 열거문의 서술 방식
  chosen_reading: 이 구절은 예언적 환상처럼 전투의 소리와 동작을 압축 열거하는 문장으로 보고, 과도한 해설 없이 감각적 나열을 유지했습니다.
  alternative_readings:
  - 단순한 역사 서술로 평이하게 풀어 쓰기
  - 전쟁의 상징성을 강조해 의역하기
  rationale: 본문의 핵심은 실제 전투 장면의 밀도와 혼란을 열거로 전달하는 데 있으므로, 한국어도 동일한 긴박감과 가시성을 유지하는 것이 적절합니다.
  doctrine_reference: 서술문 맥락 보존
- issue: καταδρομάς ἑκατέρων
  chosen_reading: ‘양쪽의 공격과 반격’으로 옮겨 상호적인 전투 행동을 드러냈습니다.
  alternative_readings:
  - 양쪽의 기습
  - 양쪽의 습격
  rationale: καταδρομή는 기습·돌격·반격의 폭을 가질 수 있으나, προσβολαί와 병렬된 대비를 고려하면 상호적 충돌을 나타내는 ‘반격’이 문맥상 더 적합합니다.
  doctrine_reference: LSJ 문맥 의미
