  lexicon: LSJ
  rationale: κόσμος는 장식·장신구를 뜻할 수 있고 ἐκλάμψεις는 강한 반짝임을 가리키므로, ‘금 장식의 번쩍임’이 원문의 시각적 효과를 가장 सीधे 반영합니다.
