base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/009.yaml
  text: He who had made many exiles from their homeland perished in a foreign land[b][a], having gone up to the Lacedaemonians as though he would obtain protection because of the kinship.
  footnotes:
  - marker: a
    text: Or 'to the Spartans.' 'Lacedaemonians' is the more literal rendering of the Greek ethnic name.
    reason: lexical_alternative
  - marker: b
    text: The 'kinship' likely refers to the traditional claimed relationship between the Jews and the Spartans mentioned elsewhere (compare 1 Maccabees 12:6-23).
    reason: cross_reference
translation:
  language: ko
  text: 자기 조국에서 많은 사람들을 내쫓았던 그 사람은, 마치 그 친족 관계 때문에 보호를 얻을 것처럼 라케다이몬 사람들에게 가려다가 이방 땅에서 죽었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘라케다이몬 사람들’은 더 문자적인 번역입니다. ‘스파르타 사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘친족 관계’는 유대인과 스파르타 사람들 사이의 전통적 친족 주장(1 마카베오 12:6-23 참조)을 가리킬 가능성이 큽니다.
    reason: cross_reference
lexical_decisions:
- source_word: συχνούς τῆς πατρίδος ἀποξενώσας
  english_pob_choice: had made many exiles from their homeland
  chosen_korean: 많은 사람들을 내쫓았던
  alternatives_korean:
  - 고향에서 많은 이들을 유배시켰던
  - 조국에서 많은 사람들을 소외시켰던
  lexicon: LSJ
  rationale: ἀποξενώσας는 단순한 ‘소외’보다 공동체 밖으로 몰아내는 의미가 강하므로, 관계적 의미를 약화시키지 않으면서도 한국어로는 ‘내쫓다’가 가장 직접적입니다.
- source_word: τῆς πατρίδος
  english_pob_choice: from their homeland
  chosen_korean: 자기 조국에서
  alternatives_korean:
  - 그들의 고향에서
  - 본국에서
  lexicon: LSJ
  rationale: πατρίς는 고향땅/조국을 뜻하므로, 현대 한국어에서 가장 자연스럽고 정서적 대비도 살리는 ‘조국’으로 옮겼습니다.
- source_word: πρὸς Λακεδαιμονίους
  english_pob_choice: to the Lacedaemonians
  chosen_korean: 라케다이몬 사람들에게
  alternatives_korean:
  - 스파르타 사람들에게
  - 라케다이모니아인들에게
  lexicon: LSJ
  rationale: 그리스어 민족명에 더 밀착한 표기는 ‘라케다이몬 사람들’이며, 통용명인 ‘스파르타 사람들’은 각주로 보완할 수 있습니다.
- source_word: ἀναχθείς
  english_pob_choice: having gone up / having been carried off
  chosen_korean: 가려다가
  alternatives_korean:
  - 올라가다가
  - 이끌려 가다가
  - 배를 타고 가다가
  lexicon: LSJ
  rationale: 문맥상 라케다이몬 사람들을 향해 이동하는 동작만이 핵심이므로, 과도한 강제성이나 항해 뉘앙스를 덧씌우지 않는 중립적 표현을 택했습니다.
- source_word: διὰ τὴν συγγένειαν
  english_pob_choice: because of the kinship
  chosen_korean: 그 친족 관계 때문에
  alternatives_korean:
  - 그 혈연 관계 때문에
  - 그들 사이의 친족성 때문에
  lexicon: LSJ
  rationale: συγγένεια는 혈연/친족 관계를 가리키며, 본문이 전제하는 역사적 친족 주장까지 드러내기 위해 ‘친족 관계’를 사용했습니다.
- source_word: τευξόμενος σκέπης
  english_pob_choice: would obtain protection
  chosen_korean: 보호를 얻을 것처럼
  alternatives_korean:
  - 피난처를 얻을 것처럼
  - 안전을 얻을 것처럼
  lexicon: LSJ
  rationale: σκέπη는 보호, 덮개, 피난처를 뜻하므로, 정치적 안전이나 피난의 기대를 자연스럽게 담는 ‘보호를 얻다’가 적절합니다.
theological_decisions:
- issue: 라케다이몬-유대인 친족 전승의 처리
  chosen_reading: 본문에는 ‘그 친족 관계 때문에’라고만 두고, 전승의 진위 판단은 본문 밖에 남겼습니다.
  alternative_readings:
  - 그들 사이의 주장된 친족 관계 때문에
  - 그 혈연 전승 때문에
  rationale: 헬라어는 친족 관계를 사실처럼 언급할 뿐, ‘주장된’이라고 표시하지 않습니다. 따라서 본문은 간결하게 유지하고, 역사적 배경은 주석으로 처리하는 편이 원문에 충실합니다.
  doctrine_reference: 원문 우선 번역 원칙; 역사적 암시를 본문에서 과잉 해설하지 않음
