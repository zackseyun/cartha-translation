base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/021.yaml
  text: So Antiochus[a], after carrying off from the temple eighteen hundred talents, quickly departed for Antioch, thinking in his arrogance to make the land navigable and the sea passable on foot[b], because of the exaltation of his heart.
  footnotes:
  - marker: a
    text: Or 'because of the arrogance of his heart.' The Greek expression literally speaks of the 'upliftedness' or 'exaltation' of the heart, describing haughty overconfidence.
    reason: lexical_alternative
  - marker: b
    text: 'The imagery is deliberately hyperbolic: Antiochus imagined himself capable of reversing the natural order, making land fit for sailing and sea fit for travel.'
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 안티오코스는 성전에서 천팔백 달란트를 약탈해 가지고 서둘러 안티오키아로 떠났습니다. 그는 오만에 빠져 땅을 배로 다닐 수 있게 하고 바다를 걸어서 다닐 수 있게 만들 수 있다고 생각했으니, 이는 그의 마음이 높아졌기 때문입니다[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 마음의 높아짐 때문에’입니다. 이는 교만으로 인한 자만과 거만한 자신감을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 땅을 항해할 수 있게 하고 바다를 걸어서 다닐 수 있게 한다는 표현은 자연 질서가 뒤집히는 일을 할 수 있다는 오만한 생각을 나타내는 의도적인 과장입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ὀκτακόσια πρὸς τοῖς χιλίοις
  english_pob_choice: eighteen hundred
  chosen_korean: 천 팔백
  alternatives_korean:
  - 일천팔백
  - 팔백에 천을 더한
  lexicon: LSJ
  rationale: 관용적으로는 ‘eight hundred in addition to a thousand’의 뜻이므로, 자연스러운 현대 한국어로 ‘천 팔백’이라고 옮기되 수량은 정확히 유지했습니다.
- source_word: ἀπενεγκάμενος ἐκ τοῦ ἱεροῦ
  english_pob_choice: after carrying off from the temple
  chosen_korean: 성전에서 … 가지고
  alternatives_korean:
  - 성전에서 … 빼앗아
  - 성전에서 … 실어가고
  lexicon: LSJ
  rationale: ἀπενεγκάμενος는 단순히 ‘가져감’보다 약탈적 ‘가져옴/가져감’의 뉘앙스가 있어, 문맥에 맞게 ‘성전에서 가지고’로 처리하되 앞뒤 서술이 약탈 행위임을 드러냈습니다.
- source_word: ὑπερηφανίας
  english_pob_choice: arrogance
  chosen_korean: 마음이 높아진 탓에
  alternatives_korean:
  - 교만 때문에
  - 오만 때문에
  lexicon: LSJ
  rationale: ὑπερηφανία는 단순 감정이 아니라 ‘높아짐/교만’의 상태를 가리키므로, 뒤의 μετεωρισμός(높아짐)과 연결되도록 ‘마음이 높아진’으로 살렸습니다.
- source_word: τὴν μὲν γῆν πλωτὴν καὶ τὸ πέλαγος πορευτὸν
  english_pob_choice: to make the land navigable and the sea passable on foot
  chosen_korean: 땅을 배가 다니는 곳으로, 바다를 걸어서 건널 수 있는 곳으로
  alternatives_korean:
  - 땅을 항해할 수 있게, 바다를 도보로 건널 수 있게
  - 땅을 배가 다닐 수 있게, 바다를 걸을 수 있게
  lexicon: LSJ
  rationale: 원문의 과장된 역설을 한국어에서도 보존하기 위해, ‘땅-항해 / 바다-도보’의 반전을 분명히 드러내는 표현을 택했습니다.
theological_decisions:
- issue: heart imagery in διὰ τὸν μετεωρισμὸν τῆς καρδίας
  chosen_reading: 마음이 높아진 탓에
  alternative_readings:
  - 그의 마음의 높아짐 때문에
  - 그의 마음의 교만 때문에
  rationale: ‘heart’를 그대로 직역하기보다 한국어에서 자연스럽고도 본문 이미지가 살아나는 ‘마음’으로 옮기되, 핵심은 심리적 자만이 아니라 내적 ‘높아짐’이라는 점을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §6
