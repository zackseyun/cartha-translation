  source_fidelity: 달란트의 수량과 땅·바다의 역설적 이미지는 정확히 옮겼습니다. 그러나 ἀπενεγκάμενος의 ‘성전에서 빼앗아/실어 가다’라는 약탈적 이동의 뜻이 ‘가지고’에서는 약하며, ὑπερηφανία와 τῆς καρδίας의 μετεωρισμός이라는 두 겹의 교만 표현 중 후자가 번역문에서 빠졌습니다.
  naturalness: ‘성전에서 천 팔백 달란트를 가지고’는 현대 한국어에서 다소 어색하고 행위의 성격도 불분명합니다. ‘성전에서 … 약탈해 가지고’가 문맥과 문장 연결에 더 자연스럽습니다. 과장된 반전은 ‘배로 다닐 수 있게/걸어서 다닐 수 있게’로 간결하게 살릴 수 있습니다.
  terminology: ‘성전’, ‘달란트’, ‘안티오코스’, ‘안티오키아’는 적절합니다. ‘마음’은 καρδία의 성서적 관용을 자연스럽게 보존합니다. ὑπερηφανία는 ‘오만’, μετεωρισμός는 ‘마음이 높아짐’으로 구별하여 원문의 강조를 유지하는 것이 좋습니다.
