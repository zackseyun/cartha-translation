revisions:
- from: 그러므로 그 장소 자체도 나라의 불행을 함께 겪었으나, 나중에는 그 혜택도 함께 누렸습니다. 그리고 전능자의 진노 가운데 덮였던 그곳은 다시 큰 주인의 화해 안에서 온전히 회복되어 모든 영광을 입었습니다.[a][b]
  to: 그러므로 그 장소 자체도 그 나라가 겪은 불행을 함께 겪었으나, 나중에는 그 나라가 받은 은혜도 함께 누렸습니다.[a] 전능자의 진노에 사로잡혔던 그곳은 위대하신 주인의 화해 때에 모든 영광과 함께 다시 회복되었습니다.[b]
  rationale: 수동분사 καταληφθείς를 ‘진노에 사로잡혔던’으로 바로잡고, μετὰ πάσης δόξης를 ‘모든 영광과 함께’로 직역적 의미에 맞게 반영했습니다. ‘위대하신 주인’은 기존의 ‘큰 주인’보다 자연스러운 현대 한국어이면서 δεσπότης를 παντοκράτωρ와 구별합니다. ‘화해 때에’는 καταλλαγή의 관계 회복 의미와 여격의 문맥적 기능을 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:48:55Z'
