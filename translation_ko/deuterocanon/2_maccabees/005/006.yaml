  terminology: 야손, 친족, 동족, 승전 기념물은 적절합니다. ‘자기 도성의 사람들’은 πόλις와 ἴδιοι가 가리키는 자기 공동체 구성원을 자연스럽게 드러내며, 끝의 ‘동족’(ὁμοεθνῶν)과도 구별됩니다. εὐημερία는 문맥상 ‘성공’으로 옮겨 친족을 해친 군사·정치적 유리함이라는 뜻을 분명히 했습니다.
