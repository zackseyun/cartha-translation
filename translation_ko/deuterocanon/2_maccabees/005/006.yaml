base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/006.yaml
  text: But Jason kept carrying out merciless slaughter of his own fellow citizens[a], not understanding that prosperity against kinsmen is the greatest calamity[b], and thinking that he was winning trophies over enemies and not over his own countrymen.
  footnotes:
  - marker: a
    text: Or 'unsparingly' for 'merciless.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'not understanding that prosperity toward kinsmen is the greatest misfortune,' meaning that apparent success won against one's own kin is actually ruinous.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 야손은 자기 동족의 시민들을 무자비하게 도살하였는데[a], 자기 친족을 상대로 한 번영이 가장 큰 재난이라는 것을 이해하지 못하였고[b], 적들에 대한 승전 기념물을 세우는 것이라고 생각했지 자기 동족에 대해서는 그렇다고 생각하지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가차 없이’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘친족을 향한 번영이 가장 큰 불행’입니다. 즉, 겉보기 성공이 오히려 파국이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σφαγὰς
  english_pob_choice: slaughter
  chosen_korean: 도살
  alternatives_korean:
  - 학살
  - 살육
  lexicon: LSJ
  rationale: σφαγή는 단순한 죽임보다 훨씬 강한 도살·살육의 뉘앙스를 가지므로, 현대 한국어에서 폭력성을 분명히 드러내는 ‘도살’이 가장 적절합니다.
- source_word: τῆς πόλεως τῶν ἰδίων
  english_pob_choice: his own fellow citizens
  chosen_korean: 자기 동족의 시민들
  alternatives_korean:
  - 자기 도시의 사람들
  - 자기 시민들
  lexicon: LSJ
  rationale: πόλις와 ἴδιοι의 결합은 단순한 거주민이 아니라 자기에게 속한 공동체 구성원을 가리키므로, 시민성과 혈연·소속감을 함께 살리는 표현을 택했습니다.
- source_word: ἀφειδῶς
  english_pob_choice: merciless
  chosen_korean: 무자비하게
  alternatives_korean:
  - 아낌없이
  - 가차 없이
  lexicon: LSJ
  rationale: ‘자비 없이, 봐주지 않고’라는 뜻을 가장 자연스럽게 전달하는 한국어는 ‘무자비하게’이며, 폭력 행위의 냉혹함을 유지합니다.
- source_word: εὐημερίαν / δυσημερίαν
  english_pob_choice: prosperity ... disaster
  chosen_korean: 번영 ... 재난
  alternatives_korean:
  - 형통 ... 불행
  - 번성 ... 참화
  lexicon: LSJ
  rationale: 두 명사는 표면적 성공과 실제적 파국의 역전을 이룬다. ‘번영’과 ‘재난’은 그 대조를 살리면서도 POB의 의미 판단을 그대로 반영합니다.
- source_word: τρόπαια καταβάλλεσθαι
  english_pob_choice: setting up trophies
  chosen_korean: 승전 기념물을 세우는 것
  alternatives_korean:
  - 트로피를 세우는 것
  - 승리 기념비를 세우는 것
  lexicon: LSJ
  rationale: 고전적 군사 관용구를 한국어에서 이해되도록 풀되, 단순한 ‘승리’보다 전승 표지의 이미지를 보존하기 위해 ‘승전 기념물’을 택했습니다.
theological_decisions:
- issue: 자기 친족을 상대로 한 성공의 도덕적 역전
  chosen_reading: 겉보기 번영이 실제로는 ‘가장 큰 재난’이라는 서술자의 평가를 그대로 드러냈습니다.
  alternative_readings:
  - 보다 완곡하게 ‘불행’이나 ‘재앙’으로 약화하는 번역
  rationale: 본문은 단순한 심리 묘사가 아니라 친족을 해치는 성공이 곧 재난이라는 도덕적 역전을 말하므로, 그 긴장을 약화하지 않았습니다.
  doctrine_reference: 서술자 평가와 윤리적 역전의 보존
