  text: But he sent Apollonius[a], the chief polluter, with an army of twenty-two thousand, commanding him to slaughter all those in their prime and to sell the women and the younger ones.
  footnotes:
  - marker: a
    text: Or, more explicitly in context, 'to sell into slavery.' The Greek says simply 'to sell,' though enslavement is likely implied.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 더럽힘의 우두머리인 아폴로니오스를 이만 이천 명의 군대와 함께 보내어, 한창 나이의 모든 이를 죽이고 여자들과 더 어린 이들을 팔라고 명령했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
