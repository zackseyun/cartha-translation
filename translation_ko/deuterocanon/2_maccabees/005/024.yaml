  - 여자들과 젊은 사람들은 팔라고 명했습니다.
  rationale: 그리스어는 '노예로'를 명시하지 않으므로, 본문은 단순한 '팔다'를 유지해 소스의 긴장을 보존하고, 독자가 전쟁 포로/노예화의 함의를 과도하게 단정하지 않도록 했습니다.
  doctrine_reference: 원문 우선 원칙; 함의는 확정하지 않고 본문 어휘에 충실해야 합니다.
