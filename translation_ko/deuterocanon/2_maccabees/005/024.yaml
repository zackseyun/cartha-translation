  text: But he sent Apollonius[a], the chief polluter, with an army of twenty-two thousand, commanding him to slaughter all those in their prime and to sell the women and the younger ones.
  footnotes:
  - marker: a
    text: Or, more explicitly in context, 'to sell into slavery.' The Greek says simply 'to sell,' though enslavement is likely implied.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 아폴로니오스 곧 그 오염의 우두머리를 군대와 함께 보내었는데, 그 수는 이만이천 명이었습니다. 그리고 가장 힘이 왕성한 모든 사람은 죽이고, 여자들과 더 어린 이들은 팔라고 명했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '노예로 팔다'일 수도 있습니다. 그리스어는 단순히 '팔다'라고만 말하지만, 전쟁 포로의 노예화가 강하게 함의됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μυσάρχην
  english_pob_choice: chief polluter
  chosen_korean: 그 오염의 우두머리
  alternatives_korean:
  - 수장
  - 부정의 우두머리
  - 오염의 우두머리
  lexicon: LSJ
  rationale: 희귀하고 경멸적인 합성어로서 직함이 아니라 더럽힘/오염의 주도자를 가리키므로, 그 비하적 뉘앙스를 살리면서도 자연스러운 한국어로 옮겼습니다.
- source_word: δισμυρίους δὲ τοῖς δισχιλίοις
  english_pob_choice: twenty-two thousand
  chosen_korean: 이만이천 명
  alternatives_korean:
  - 이만 명과 이천 명
  - 이만이천
  lexicon: LSJ
  rationale: 문자적으로는 2만과 2천이지만, 한국어에서는 합산 수량을 자연스럽게 풀어 이만이천 명으로 옮기는 것이 가장 명료합니다.
- source_word: τοὺς ἐν ἡλικίᾳ πάντας
  english_pob_choice: all those in their prime
  chosen_korean: 가장 힘이 왕성한 모든 사람
  alternatives_korean:
  - 모든 성인 남자
  - 전성기의 모든 사람
  - 한창인 모든 사람
  lexicon: LSJ
  rationale: ἡλικία는 단순한 연령보다 신체적 전성기/성숙기를 가리킬 수 있어, 살해 대상이 되는 맥락을 반영하되 법적 성인으로 좁히지 않도록 했습니다.
- source_word: πωλεῖν
  english_pob_choice: to sell
  chosen_korean: 팔라고
  alternatives_korean:
  - 노예로 팔라고
  - 팔도록
  - 팔아넘기라고
  lexicon: LSJ
  rationale: 본문의 동사는 단순히 '팔다'이므로 본문에는 그 표현을 유지하고, 강제 노예화의 함의는 주석 없이 과잉 확정하지 않았습니다.
theological_decisions:
