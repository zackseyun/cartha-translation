  source_fidelity: 전반적인 사건 순서와 정치적 의미는 충실합니다. 다만 θηριωμένος τῇ ψυχῇ는 단순히 ‘사나워진’ 상태보다 짐승 같은 내적 상태를 나타내므로, 그 비유를 더 분명히 살리는 편이 적절합니다. δοριαλώτον의 무력 정복 의미도 ‘무력으로 함락시키다’로 유지할 수 있습니다.
