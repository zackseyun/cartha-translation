  text: When the king was informed about what had happened[a], he concluded that Judea was in revolt; so, after setting out from Egypt, savage in spirit, he took the city by force of arms.
  footnotes:
  - marker: a
    text: Literally, 'captured by the spear,' a Greek military idiom for taking a city through armed assault.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 그 일들에 관해 보고를 받자, 유대가 반란을 일으켰다고 판단하였습니다. 그래서 그는 이집트에서 출발하여, 영혼이 사나워진 채 그 성을 무력으로 점령하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘창으로 잡힌’이지만, 여기서는 도시를 무장 공격으로 함락시키는 군사 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προεστώτων
  english_pob_choice: was informed
  chosen_korean: 보고를 받자
  alternatives_korean:
  - 소식이 전해지자
  - 상황이 보고되자
  lexicon: LSJ
  rationale: 원문은 왕 앞에 일들이 ‘제시된’ 상황을 가리키므로, 현대 한국어에서는 정보 수신의 뉘앙스를 살려 ‘보고를 받다’로 옮기는 것이 자연합니다.
- source_word: διέλαβεν
  english_pob_choice: he concluded
  chosen_korean: 판단하였습니다
  alternatives_korean:
  - 결론지었습니다
  - 추정하였습니다
  lexicon: LSJ
  rationale: 단순한 인지가 아니라 보고를 근거로 한 판단 형성을 나타내므로, ‘판단하다’가 가장 균형 있게 대응합니다.
- source_word: ἀποστατεῖν τὴν Ἰουδαίαν
  english_pob_choice: Judea was in revolt
  chosen_korean: 유대가 반란을 일으켰다고
  alternatives_korean:
  - 유대가 배반했다고
  - 유대가 이탈했다고
  lexicon: LSJ
  rationale: 여기서는 종교적 ‘배교’보다 정치적 반란의 뜻이 분명하므로, ‘반란을 일으키다’로 소스의 역사적 의미를 살렸습니다.
- source_word: θηριωμένος τῇ ψυχῇ
  english_pob_choice: savage in spirit
  chosen_korean: 영혼이 사나워진 채
  alternatives_korean:
  - 마음이 짐승처럼 된 채
  - 영에서 야수처럼 된 채
  lexicon: LSJ
  rationale: 짐승 같은 내적 상태를 비유하는 표현이므로, 직역에 가까우면서도 읽히는 ‘영혼이 사나워진 채’로 옮겼습니다.
- source_word: δοριαλώτον
  english_pob_choice: by force of arms
  chosen_korean: 무력으로 점령하였습니다
  alternatives_korean:
  - 창의 힘으로 차지하였습니다
  - 무력으로 빼앗았습니다
  lexicon: LSJ
  rationale: ‘창으로 잡은’이라는 군사 관용구를 한국어에서 바로살리기보다, 그 폭력적 정복 의미를 드러내는 ‘무력으로 점령하다’가 문맥에 가장 적합합니다.
theological_decisions:
- issue: ἀποστατεῖν의 의미 범위
  chosen_reading: 정치적 반란으로 번역하되, 종교적 배교 의미는 본문에서 전면에 두지 않았습니다.
  alternative_readings:
  - 배교하다
  - 배반하다
  rationale: 문맥상 왕에게 대한 제국 정치의 문제이므로, 본문의 직접 의미를 ‘반란’으로 유지하는 것이 역사 서술에 충실합니다.
  doctrine_reference: 2 Maccabees의 서술 맥락과 헬라어 동사 ἀποστατεῖν의 정치적 용례
- issue: θηριωμένος τῇ ψυχῇ의 이미지
  chosen_reading: 내적 상태를 ‘사나워진 채’로 살려, 폭군의 격앙과 야수적 성정을 함께 드러냈습니다.
  alternative_readings:
  - 분노한 채
  - 야수처럼 된 채
  rationale: 원문은 단순한 감정 상태가 아니라 인간다움이 거칠어진 내적 변형을 나타내므로, 비유를 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 헬라어 수사와 역사 서술의 묘사적 표현
