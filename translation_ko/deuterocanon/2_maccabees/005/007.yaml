  yaml_path: translation/deuterocanon/2_maccabees/005/007.yaml
  text: He did not gain control of the government[a], but in the end, receiving shame from the plot[b], he again fled away to Ammanitis.
  footnotes:
  - marker: a
    text: Or 'did not obtain the rule' or 'did not secure power.' The Greek verb is uncommon here, but the sense in context is that he failed to win the government he sought.
    reason: lexical_alternative
  - marker: b
    text: '''Ammanitis'' refers to the region of the Ammonites.'
    reason: cultural_note
translation:
  language: ko
  text: 그는 통치권을 얻지는 못하였으나[a], 결국 그 음모로 말미암아 수치를 당하고 도망자가 되어 다시 암마니티스[b]로 떠났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “정부를 장악하지는 못하였으나”, “권력을 확보하지 못하였으나”로도 옮길 수 있습니다. 그리스어 동사는 여기서 드물지만, 문맥상 그가 추구한 정치적 통치권을 얻지 못했다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: “암마니티스”는 암몬 사람들의 지역을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἀρχῆς
  english_pob_choice: the government
  chosen_korean: 정부를 장악하지는 못하였으나
  alternatives_korean:
  - 통치권을 얻지는 못하였으나
  - 지배권을 확보하지는 못하였으나
  - 권력을 얻지는 못하였으나
  lexicon: LSJ
  rationale: ἀρχή는 여기서 단순한 '시작'이 아니라 정치적 통치/권위의 맥락이므로, 문맥상 POB의 'government'에 맞춰 행정·통치권의 실패를 자연스럽게 드러냈습니다.
- source_word: αἰσχύνην λαβών
  english_pob_choice: receiving shame
  chosen_korean: 수치를 당하고
  alternatives_korean:
  - 부끄러움을 받고
  - 치욕을 입고
  - 수치를 받고
  lexicon: LSJ
  rationale: 직역하면 '수치를 받다'이지만, 한국어에서는 '수치를 당하다'가 수동적 피해와 굴욕의 뉘앙스를 더 자연스럽게 살립니다.
- source_word: φυγάς ... ἀπῆλθεν
  english_pob_choice: fled away
  chosen_korean: 다시 도망쳐
  alternatives_korean:
  - 다시 달아나
  - 다시 도피하여
  - 다시 도망하여
  lexicon: LSJ
  rationale: φυγάς가 지닌 '도망자/도피자'의 감각을 유지하면서, ἀπῆλθεν의 이동 동사를 한국어 동사구로 간결하게 옮겼습니다.
- source_word: Ἀμμανῖτιν
  english_pob_choice: Ammanitis
  chosen_korean: 암마니티스
  alternatives_korean:
  - 암몬인의 땅
  - 암모니티스
  - 암만 지방
  lexicon: LSJ
  rationale: 고유 지명은 음역을 따르되, 영어 POB의 주석처럼 암몬 지역을 가리키는 지명이라는 점은 footnote로 밝혔습니다.
theological_decisions:
