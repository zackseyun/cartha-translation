  rationale: μυριάς는 만 단위이므로 ὀκτὼ μυριάδες를 한국어의 자연스러운 수량 표현인 ‘팔만 명’으로 옮겼습니다.
- source_word: ἐν ταῖς πάσαις ἡμέραις τρισίν
