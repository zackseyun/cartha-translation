  yaml_path: translation/deuterocanon/2_maccabees/005/014.yaml
  text: 'And in the three whole days[a], eighty thousand were destroyed: forty thousand by violent hands[b], and no fewer than those who were slaughtered were sold.'
  footnotes:
  - marker: a
    text: Greek literally, 'in the laws of hands,' an obscure expression understood here to mean death inflicted by violence or by human hands.
    reason: lexical_alternative
  - marker: b
    text: Or, 'were sold into slavery'; the Greek says simply 'were sold,' with enslavement implied by the context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 사흘 내내 모두 팔만 명이 죽임을 당하였는데, 그 가운데 사만 명은 폭력적인 손에[a] 죽임을 당했으며, 학살당한 이들 못지않은 수가 팔렸습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘손들의 법 안에서’라고 되어 있습니다. 전승된 표현이 난해하나, 문맥상 사람의 손으로 가해진 폭력적 죽음을 가리키는 것으로 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘노예로 팔렸습니다.’ 그리스어는 단순히 ‘팔렸다’고 하며, 노예화는 문맥상 암시됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀκτὼ ... μυριάδες
  english_pob_choice: eighty thousand
  chosen_korean: 팔만 명
  alternatives_korean:
