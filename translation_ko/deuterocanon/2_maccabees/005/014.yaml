- source_word: ἐν χειρῶν νόμοις
  english_pob_choice: by violent hands
  chosen_korean: 폭력으로 죽고
  alternatives_korean:
  - 사람의 손에 의해 죽고
  - 손의 법으로 죽고
  - 폭력적인 손에 의해 죽고
  lexicon: LSJ
  rationale: 직역하면 난해한 관용구이므로, POB의 해석처럼 인간의 폭력에 의한 죽음을 한국어로 자연스럽게 드러냈습니다.
- source_word: ἐσφαγμένων
  english_pob_choice: those who were slaughtered
  chosen_korean: 학살당한 자들
  alternatives_korean:
  - 도살당한 자들
  - 살육당한 자들
  - 도륙당한 자들
  lexicon: LSJ
  rationale: σφάζω의 강한 폭력성을 살리면서도 현대 한국어 문맥에서 읽히는 ‘학살당한 자들’로 옮겼습니다.
- source_word: ἐπράθησαν
  english_pob_choice: were sold
  chosen_korean: 팔렸습니다
  alternatives_korean:
  - 매각되었습니다
  - 노예로 팔렸습니다
  - 팔려 갔습니다
  lexicon: LSJ
  rationale: 본문은 단순히 ‘팔렸다’고 말하며, 노예화는 문맥상 암시되지만 원문에 직접 덧붙이지 않도록 했습니다.
theological_decisions:
- issue: 폭력적 처형과 매매의 병렬 표현
  chosen_reading: 본문의 두 결과를 각각 ‘폭력으로 죽고’와 ‘팔렸습니다’로 구분해, 살해와 매매가 모두 대량 학살의 양태였음을 드러냈습니다.
  alternative_readings:
  - 둘 다 완곡하게 처리하여 ‘죽었고… 팔렸습니다’로 옮기는 방식
  - ‘노예로 팔렸습니다’로 원문에 없는 해석을 본문에 포함하는 방식
  rationale: POB는 원문의 폭력성과 잔혹성을 약화시키지 않되, 확정되지 않은 세부는 본문이 아닌 주석에 두는 방향을 택합니다.
  doctrine_reference: source-faithfulness / lexical restraint
