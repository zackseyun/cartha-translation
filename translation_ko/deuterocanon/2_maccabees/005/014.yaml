  rationale: 본문은 단순히 ‘팔렸다’고 말하며, 노예화는 문맥상 암시되지만 원문에 직접 덧붙이지 않도록 했습니다.
theological_decisions:
- issue: 폭력적 처형과 매매의 병렬 표현
  chosen_reading: 본문의 두 결과를 각각 ‘폭력으로 죽고’와 ‘팔렸습니다’로 구분해, 살해와 매매가 모두 대량 학살의 양태였음을 드러냈습니다.
  alternative_readings:
  - 둘 다 완곡하게 처리하여 ‘죽었고… 팔렸습니다’로 옮기는 방식
  - ‘노예로 팔렸습니다’로 원문에 없는 해석을 본문에 포함하는 방식
  rationale: POB는 원문의 폭력성과 잔혹성을 약화시키지 않되, 확정되지 않은 세부는 본문이 아닌 주석에 두는 방향을 택합니다.
  doctrine_reference: source-faithfulness / lexical restraint
