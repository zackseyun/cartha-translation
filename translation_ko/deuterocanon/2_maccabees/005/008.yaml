base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/008.yaml
  text: 'So he met the end of a miserable ruin: confined with Aretas[a], the ruler of the Arabs, fleeing from city to city, pursued by all, hated as an apostate from the laws and abhorred as the destroyer of his homeland and fellow citizens[b], he was driven into Egypt.'
  footnotes:
  - marker: a
    text: Or 'tyrant of the Arabs.' The Greek τύραννον can mean 'tyrant,' but here it may function more neutrally as 'ruler.'
    reason: lexical_alternative
  - marker: b
    text: Or 'he was cast out into Egypt'; literally, the verb is very forceful, suggesting being thrown out.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그는 비참한 몰락의 최후를 맞았습니다. 아라비아 사람들의 통치자 아레타스[a]에게 갇힌 채, 이 도시 저 도시로 도망하고 모든 사람에게 쫓기며, 율법을 버린 배교자로 미움을 받고 자기 조국과 동포의 파괴자로 혐오를 받다가, 이집트로 쫓겨갔습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아라비아 사람들의 폭군’일 수 있습니다. 그리스어 τύραννον은 ‘폭군’이란 뜻도 있지만, 여기서는 보다 중립적인 ‘통치자’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이집트로 내던져졌습니다.’ 그리스어 동사는 매우 강해서, 문자적으로는 ‘던져지다’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέρας οὖν κακῆς καταστροφῆς ἔτυχεν
  english_pob_choice: he met the end of a miserable ruin
  chosen_korean: 비참한 몰락의 끝을 맞았습니다
  alternatives_korean:
  - 비참한 파멸의 끝에 이르렀습니다
  - 비참한 몰락을 맞았습니다
  lexicon: LSJ
  rationale: πέρας ... ἔτυχεν의 ‘끝을 맞다’는 성격을 살리고, κακῆς καταστροφῆς의 강한 파괴성과 비참함을 ‘비참한 몰락’으로 압축해 자연스러운 서술문으로 옮겼습니다.
- source_word: ἐγκλεισθεὶς πρὸς Ἀρέταν τὸν τῶν Ἀράβων τύραννον
  english_pob_choice: confined with Aretas, the ruler of the Arabs
  chosen_korean: 아레타스[a], 곧 아라비아 사람들의 통치자에게 갇힌 채
  alternatives_korean:
  - 아레타스[a], 아라비아 사람들의 군주에게 갇힌 채
  - 아레타스[a], 아라비아 사람들의 폭군에게 갇힌 채
  lexicon: LSJ
  rationale: πρός + 인명은 단순한 행위자보다 관계/상태를 나타낼 수 있으므로 ‘에게 갇힌 채’로 옮겼고, τύραννον은 본문이 아레타스에게까지 도덕적 비난을 부과하는지 확정되지 않으므로 ‘통치자’로 번역했습니다.
- source_word: τῶν νόμων ἀποστάτης
  english_pob_choice: an apostate from the laws
  chosen_korean: 율법을 버린 배교자로
  alternatives_korean:
  - 율법에서 떨어져나간 자로
  - 율법을 저버린 배신자로
  lexicon: LSJ
  rationale: ἀποστάτης의 강한 이탈·반역 뉘앙스를 살리되, 2 Maccabees의 언약적 법 맥락에서 한국어로는 ‘배교자’가 가장 응축된 대응이어서 ‘율법을 버린 배교자’로 옮겼습니다.
- source_word: πατρίδος καὶ πολιτῶν δήμιος
  english_pob_choice: the executioner of his homeland and fellow citizens
  chosen_korean: 자기 조국과 동포의 파괴자로
  alternatives_korean:
  - 자기 조국과 동포의 사형집행인으로
  - 자기 조국과 동포를 멸하는 자로
  lexicon: LSJ
  rationale: δήμιος는 문자적으로 ‘사형집행인’이지만, 문맥상 자기 동족을 해치는 파괴적 인물을 가리키므로 한국어 독자에게는 관계적·도덕적 효과를 살려 ‘파괴자’로 옮겼습니다.
- source_word: εἰς Αἴγυπτον ἐξεβράσθη
  english_pob_choice: he was driven into Egypt
  chosen_korean: 이집트로 쫓겨갔습니다[b]
  alternatives_korean:
  - 이집트로 내던져졌습니다[b]
  - 이집트로 몰려갔습니다[b]
  lexicon: LSJ
  rationale: ἐξεβράσθη의 격렬한 추방 이미지를 살리되 한국어에서 과도하게 생생한 ‘토해내다’류 표현은 피하고, POB의 ‘driven into Egypt’에 맞춰 ‘쫓겨갔습니다’로 옮겼습니다.
theological_decisions:
- issue: 아레타스의 τύραννον에 담긴 평가의 강도
  chosen_reading: ‘폭군’보다 중립적인 ‘통치자’로 옮겨, 본문의 비난이 아레타스가 아니라 안티오쿠스의 몰락에 집중되도록 했습니다.
  alternative_readings:
  - 폭군
  - 군주
  rationale: 그리스어 τύραννος는 시대에 따라 정치적 호칭으로도 쓰이므로, 본문이 명시하지 않은 도덕적 판단을 한국어가 덧씌우지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: τῶν νόμων ἀποστάτης의 종교·법적 무게
  chosen_reading: ‘율법을 버린 배교자’로 번역해 언약적 반역의 무게를 유지했습니다.
  alternative_readings:
  - 율법을 저버린 자
  - 율법에서 떠난 자
  rationale: 2 마카베오서는 공동체의 율법 충성을 핵심 가치로 드러내므로, 단순한 이탈보다 신앙적 배교를 드러내는 표현이 본문 의도에 더 가깝습니다.
  doctrine_reference: Translation philosophy §1, §5
