  yaml_path: translation/deuterocanon/2_maccabees/005/012.yaml
  text: And he ordered the soldiers to cut down without mercy those they encountered[b][a], and to slaughter those who went up into the houses.
  footnotes:
  - marker: a
    text: Or 'those who fell in their way.' The Greek participle can denote people encountered in the soldiers' path; the rendering avoids suggesting the victims initiated the attack.
    reason: lexical_alternative
  - marker: b
    text: Literally 'those going up into the houses,' likely reflecting ascent into houses or upper rooms by stairs.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그는 군인들에게 군인들이 마주치는 사람들은 사정없이 쳐 죽이고[a], 집 안으로 올라가는 사람들은 학살하라고 명령하였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 앞에 닥치는 사람들’. 그리스어 분사는 군인들의 길에서 마주친 사람들을 가리킬 수 있으므로, 희생자들이 먼저 공격한 것처럼 들리지 않게 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘집들로 올라가는 사람들’입니다. 계단을 통해 위층이나 집 안으로 들어가는 장면을 반영한 표현일 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκέλευσεν
  english_pob_choice: he ordered
  chosen_korean: 명령하였습니다
  alternatives_korean:
  - 지시하였습니다
  - 명령했습니다
  lexicon: BDAG
  rationale: κελεύω의 명령 행위를 자연스러운 현대 문어로 살리되, 군사적 강제성을 분명히 드러내기 위해 ‘명령하였습니다’를 택했습니다.
- source_word: κόπτειν
  english_pob_choice: to cut down
  chosen_korean: 쳐서 쓰러뜨리고
  alternatives_korean:
  - 베어 쓰러뜨리고
  - 쳐 죽이고
  lexicon: LSJ
  rationale: 직역적 ‘자르다’보다 폭력적 타격과 살상 결과를 함께 드러내는 표현으로 옮겨, POB의 ‘cut down’이 지닌 잔혹성을 살렸습니다.
- source_word: τοὺς ἐμπίπτοντας
  english_pob_choice: those they encountered
  chosen_korean: 그들이 마주치는 자들
  alternatives_korean:
  - 그들의 길에 떨어지는 자들
  - 그들 앞에 나타나는 자들
  lexicon: BDAG
  rationale: 공격자가 아니라 군인들의 진행 경로에서 맞닥뜨린 사람들을 가리킨다는 점을 반영해, ‘마주치는’으로 오해를 줄였습니다.
- source_word: ἀναβαίνοντας
  english_pob_choice: those who went up into the houses
  chosen_korean: 집 안으로 올라가는 자들
  alternatives_korean:
  - 집으로 올라가는 자들
  - 집 안으로 들어가는 자들
  lexicon: BDAG
  rationale: ‘올라가다’의 공간적 뉘앙스를 살리면서, 집의 상층이나 계단을 통해 들어가는 상황까지 포착하도록 옮겼습니다.
