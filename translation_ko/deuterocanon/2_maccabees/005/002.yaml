  yaml_path: translation/deuterocanon/2_maccabees/005/002.yaml
  text: And throughout nearly the whole city[a], for forty days, it happened that horsemen were seen running through the air, wearing garments of gold and armed with lances drawn up in squadrons[b],
  footnotes:
  - marker: a
    text: Or 'appearing through the air' for 'were seen running through the air'; the Greek φαίνεσθαι can emphasize appearance/visibility as well as the fact of being seen.
    reason: lexical_alternative
  - marker: b
    text: The phrase rendered 'drawn up in squadrons' translates σπειρηδόν, an adverb suggesting organized military formation; 'in ranks' or 'in companies' are also possible.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 거의 온 도시에서 사십 일 동안, 하늘을 달리는 기마병들이 나타났는데, 그들은 금빛 옷을 입고 있었고, 창을 전열을 갖춘 채 들고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘을 지나 나타나고 있었다’로도 옮길 수 있습니다. 그리스어 φαίνεσθαι는 ‘보이다/나타나다’의 뉘앙스를 함께 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: σπειρηδόν은 조직된 군사 편제를 가리키는 부사로, ‘전열을 갖추어’, ‘대열로’, ‘편제로’ 등으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέβη
  english_pob_choice: it happened
  chosen_korean: 그리고 … 동안 … 있었습니다
  alternatives_korean:
  - 그 일이 있었습니다
  - 일이 일어났습니다
  lexicon: LSJ
  rationale: 사건 서술의 서두로 기능하는 관용적 표현이므로, 한국어에서는 자연스러운 서사 진행형으로 옮겨 impersonal한 사건성을 살렸습니다.
- source_word: καθʼ ὅλην τὴν πόλιν σχεδόν
  english_pob_choice: throughout nearly the whole city
  chosen_korean: 거의 온 도시에서
  alternatives_korean:
  - 도시 거의 전체에 걸쳐
  - 도시의 거의 전역에서
  lexicon: LSJ
  rationale: 도시 전체에 걸친 범위를 간결하게 살리면서 σχεδόν의 완화 의미를 ‘거의’로 분명히 했습니다.
- source_word: διαχρύσους στολὰς ἔχοντας
  english_pob_choice: wearing garments of gold
  chosen_korean: 금빛 옷을 입고 있었고
  alternatives_korean:
  - 금으로 된 옷을 입고 있었고
  - 황금빛 옷을 입고 있었고
  lexicon: LSJ
  rationale: στολή를 ‘옷’으로 옮기고, διαχρύσους는 직역투를 피하면서도 눈에 띄는 황금색·금장 효과를 살리는 ‘금빛’으로 표현했습니다.
- source_word: σπειρηδὸν
  english_pob_choice: drawn up in squadrons
  chosen_korean: 전열을 갖춘 채
  alternatives_korean:
  - 대열을 갖춘 채
  - 분대 편제로
  lexicon: LSJ
  rationale: σπεῖ라 계열의 군사적 배열을 한국어의 자연스러운 군사용 표현으로 풀어, 단순한 ‘들고 있다’와 구별되는 조직된 전투 태세를 드러냈습니다.
theological_decisions:
- issue: 시현적·비정상적 현상의 서술 방식
  chosen_reading: 문자적 연대기 서술처럼 단정하기보다, ‘나타났는데’와 ‘보였다/보여졌다’의 공시적 뉘앙스를 살렸습니다.
  alternative_readings:
  - 환상처럼 보였다
  - 나타났다
  rationale: 본문의 φαίνεσθαι는 실제 존재 여부를 더 단정하지 않고 ‘보임/나타남’을 강조할 수 있으므로, 관찰된 현상이라는 긴장을 보존했습니다.
  doctrine_reference: 2 Maccabees의 서술적·환상적 표현에 대한 본문 의미 보존
