  text: But the Lord did not choose the nation for the sake of the place, but the place for the sake of the nation.
translation:
  language: ko
  text: 그러나 주님은 장소 때문에 민족을 선택하신 것이 아니라, 민족 때문에 장소를 선택하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλʼ
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  lexicon: BDAG
  rationale: 앞선 진술과의 강한 대조를 한국어로 자연스럽게 살리기 위해 역접 접속사 ‘그러나’를 사용했습니다.
- source_word: διὰ τὸν τόπον / διὰ τὸ ἔθνος
  english_pob_choice: for the sake of
  chosen_korean: 때문에
  alternatives_korean:
  - 위하여
  - 덕분에
  - 를 위해
  lexicon: BDAG
  rationale: 여기서 διὰ + 대격은 원인·동기의 관계를 나타내므로, 두 절의 대칭을 살리면서도 한국어에서 과도하게 목적론적으로 들리지 않는 ‘때문에’로 옮겼습니다.
- source_word: τὸν τόπον
  english_pob_choice: the place
  chosen_korean: 장소
  alternatives_korean:
  - 그곳
  - 성소
  - 거룩한 곳
  lexicon: BDAG
  rationale: 그리스어는 단순히 ‘the place’라고만 말하므로, 문맥상 예루살렘/성전 지역을 암시하더라도 본문 수준에서는 구체화하지 않고 ‘장소’로 보존했습니다.
- source_word: τὸ ἔθνος
  english_pob_choice: the nation
  chosen_korean: 민족
  alternatives_korean:
  - 백성
  - 나라
  - 국민
  lexicon: BDAG
  rationale: ἔθνος는 여기서 공동체로서의 이스라엘을 가리키므로, 집합성과 민족적 정체성을 함께 드러내는 ‘민족’이 적절합니다.
- source_word: ὁ κύριος
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주께서
  lexicon: BDAG
  rationale: 프로젝트 기본값에 따라 κύριος를 ‘주님’으로 옮기되, 문장 흐름상 주어 표지를 자연스럽게 살렸습니다.
- source_word: ἐξελέξατο
  english_pob_choice: did not choose / choose
  chosen_korean: 선택하셨습니다
  alternatives_korean:
  - 뽑으셨습니다
  - 택하셨습니다
  lexicon: BDAG
  rationale: ἐκλέγομαι의 의미를 현대 한국어에서 가장 직접적으로 드러내는 ‘선택하다’로 옮겨, 앞절과 뒤절의 대조를 분명히 했습니다.
theological_decisions:
- issue: 장소와 민족의 선택 우선순위
  chosen_reading: 주님의 선택은 장소가 민족보다 앞서는 것이 아니라, 민족을 향한 선택이 장소 선택을 규정한다는 점을 드러냅니다.
  alternative_readings:
  - 장소 자체가 민족에게 거룩함을 부여한다는 읽기
  - 두 대상을 상호 독립적으로 보는 읽기
  rationale: 그리스어 대조 구조가 ‘민족 때문에 장소’라는 종속 관계를 분명히 말하므로, 이를 완화하지 않고 그대로 반영했습니다.
  doctrine_reference: 원문 우선과 신학적 긴장 보존
