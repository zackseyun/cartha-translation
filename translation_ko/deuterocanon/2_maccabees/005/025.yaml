  yaml_path: translation/deuterocanon/2_maccabees/005/025.yaml
  text: But when this man arrived in Jerusalem and pretended to be peaceable[a], he held back until the holy day of the Sabbath; and taking the Jews off guard, he ordered those under his command to arm themselves.
  footnotes:
  - marker: a
    text: Or, 'taking the Jews by surprise.' The Greek phrase is compressed and may refer to exploiting their Sabbath vulnerability before ordering his forces to arm themselves.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 이 사람은 예루살렘에 이르러 평화로운 척하고, 거룩한 안식일 날까지 행동을 미루었습니다. 그리고 유대인들이 안식일을 지키고 있는 것을 보고, 자기 휘하에 있는 자들에게 무장하라고 명령했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 직역하면 ‘유대인들이 지키고 있는 것을 포착하여’와 같이 압축되어 있습니다. 문맥상 그들이 안식일을 지키고 있는 때를 이용했음을 암시할 수 있으나, ‘기습’이나 그들의 ‘취약함’을 명시하지는 않습니다.
    reason: lexical_alternative
lexical_decisions:
