  text: But when this man arrived in Jerusalem and pretended to be peaceable[a], he held back until the holy day of the Sabbath; and taking the Jews off guard, he ordered those under his command to arm themselves.
  footnotes:
  - marker: a
    text: Or, 'taking the Jews by surprise.' The Greek phrase is compressed and may refer to exploiting their Sabbath vulnerability before ordering his forces to arm themselves.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 이 사람이 예루살렘에 이르러 평화로운 척하며, 거룩한 안식일이 올 때까지 머물렀습니다. 그리고 유대인들을 방심하게 하여, 자기 휘하에 있던 자들에게 무장을 명했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘유대인들을 기습하여.’ 그리스어 표현은 압축되어 있어, 안식일을 틈타 그들의 취약함을 이용한 뒤 군사들에게 무장 명령을 내린다는 뜻으로도 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενος
  english_pob_choice: arrived
  chosen_korean: 예루살렘에 이르러
  alternatives_korean:
  - 예루살렘에 도착하여
  - 예루살렘에 와서
  lexicon: LSJ
  rationale: 상황 전개를 나타내는 분사로, 단순한 ‘왔다’보다 현대 한국어에서 자연스러운 ‘이르다/도착하다’가 사건의 도착을 분명히 드러냅니다.
- source_word: τὸν εἰρηνικὸν ὑποκριθεὶς
  english_pob_choice: pretended to be peaceable
  chosen_korean: 평화로운 척하며
  alternatives_korean:
  - 평화를 바라는 체하며
  - 평화로운 사람인 양하며
  lexicon: LSJ
  rationale: ὑποκριθεὶς의 ‘가장하다, 연기하다’와 εἰρηνικός의 ‘평화로운’을 함께 살려, 실제 의도가 아닌 외양상의 평온함을 간결하게 표현했습니다.
- source_word: ἐπέσχεν ἕως τῆς ἁγίας ἡμέρας τοῦ σαββάτου
  english_pob_choice: he held back until the holy day of the Sabbath
  chosen_korean: 거룩한 안식일이 올 때까지 머물렀습니다
  alternatives_korean:
  - 거룩한 안식일까지 기다렸습니다
  - 안식일의 거룩한 날까지 늦추었습니다
  lexicon: LSJ
  rationale: ἐπέσχεν의 지연·유보 의미를 ‘머물렀습니다’로 옮기되, ‘거룩한 안식일’로 σαββάτου의 종교적 성격을 직접 반영했습니다.
- source_word: ἄγοντας τοὺς Ἰουδαίους
  english_pob_choice: taking the Jews off guard
  chosen_korean: 유대인들을 방심하게 하여
  alternatives_korean:
  - 유대인들을 기습하여
  - 유대인들을 뜻밖에 맞닥뜨리게 하여
  lexicon: LSJ
  rationale: 압축된 구문이 지닌 전술적 기습 뉘앙스를 살리되, 한국어에서는 ‘방심하게 하다’가 가장 자연스럽게 그 효과를 전달합니다.
- source_word: τοῖς ὑφʼ ἑαυτὸν ἐξοπλίαν παρήγγειλεν
  english_pob_choice: he ordered those under his command to arm themselves
  chosen_korean: 자기 휘하에 있던 자들에게 무장을 명했습니다
  alternatives_korean:
  - 자기 부하들에게 무장을 지시했습니다
  - 자기 아래에 있는 자들에게 무장하라고 명했습니다
  lexicon: LSJ
  rationale: 휘하에 있는 군사적 종속 관계를 드러내면서, ἐξοπλίαν παρήγγειλεν의 ‘무장하라’는 명령을 한국어 관용으로 정리했습니다.
theological_decisions:
- issue: 안식일의 성격을 ‘거룩한 날’로 유지할지 여부
  chosen_reading: ‘거룩한 안식일’로 직접 옮겨, 안식일의 성별된 성격을 본문 그대로 드러냈습니다.
  alternative_readings:
  - ‘안식일의 거룩한 날’
  - ‘거룩한 안식일날’
  rationale: Greek의 ἁγίας는 단순한 시간 정보가 아니라 종교적 구별을 표시하므로, 이를 약화하지 않고 본문 수준에서 유지하는 것이 적절합니다.
  doctrine_reference: 원문 우선 원칙; 유대교 성일에 대한 서술을 문맥대로 보존
