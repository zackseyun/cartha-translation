translation:
  language: ko
  text: 그리고 그는 모든 유다인을 그 관람 행사[a]에 가두어 두고, 무기를 들고 성읍으로 달려 들어가 많은 사람을 죽였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 축제에’, ‘그 공개 행사에’로 옮길 수 있습니다. 그리스어 θεωρία는 관람을 위한 공개 행사나 축제적 행사를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς Ἰουδαίους πάντας
  english_pob_choice: all the Jews
  chosen_korean: 유다인 모두
  alternatives_korean:
  - 모든 유대인
  - 유다인들 모두
  lexicon: SBLGNT/LSJ
  rationale: Ἰουδαίους는 민족적·역사적 집단명으로서 여기서는 ‘유다인’이 가장 직접적이며, πάντας는 ‘모두’로 자연스럽게 반영했습니다.
- source_word: ἐπὶ τὴν θεωρίαν
  english_pob_choice: the spectacle
  chosen_korean: 그 광경에
  alternatives_korean:
  - 그 축제에
  - 공개 구경거리로
  - 그 관람 행사에
  lexicon: LSJ
  rationale: θεωρία는 문맥상 공적 관람/공개 행사를 가리킬 수 있어, 한국어에서는 의미를 과잉해석하지 않으면서도 감금의 목적을 드러내는 ‘그 광경’으로 옮겼습니다.
- source_word: συνεκέκλεισεν
  english_pob_choice: confined
  chosen_korean: 가두어 두었으며
  alternatives_korean:
  - 가두었습니다
  - 억지로 묶어 두었으며
  - 봉쇄하였으며
  lexicon: LSJ
  rationale: 동사의 강제적 억류·봉쇄 뜻을 살리면서 현대 한국어에서 자연스러운 ‘가두어 두다’로 표현했습니다.
- source_word: σὺν τοῖς ὅπλοις εἰσδραμὼν
  english_pob_choice: rushing into the city with weapons
  chosen_korean: 무기를 들고 그 성읍으로 달려들어
  alternatives_korean:
  - 무기를 들고 그 성읍으로 뛰어들어
  - 무장하고 그 성읍으로 돌입하여
  lexicon: LSJ
  rationale: σὺν τοῖς ὅπλοις는 무장 상태를 넘어 무기를 동반한 점을 드러내므로 ‘무기를 들고’로, εἰσδραμὼν은 급박한 폭력적 진입을 살려 ‘달려들어’로 옮겼습니다.
- source_word: ἱκανὰ κατέστησεν πλήθη
  english_pob_choice: caused a considerable slaughter
  chosen_korean: 상당한 살육을 일으켰습니다
  alternatives_korean:
  - 많은 살육을 냈습니다
  - 큰 학살을 자행했습니다
  - 상당한 희생을 초래했습니다
  lexicon: LSJ
  rationale: 직역하면 ‘충분히 많은 무리’가 어색하므로, 문맥상 집단적 살상 결과를 나타내는 표현으로 정리하되, πλήθη의 대량성은 ‘상당한’으로 반영했습니다.
theological_decisions:
- issue: 폭력 서술의 직설성
  chosen_reading: ‘살육을 일으켰습니다’로 희석하지 않고 본문의 가혹한 결과를 그대로 드러냈습니다.
  alternative_readings:
  - ‘희생을 초래했습니다’
  - ‘사람들을 많이 죽였습니다’
  rationale: 본문은 단순한 피해가 아니라 집단적 살상을 묘사하므로, 독자가 서술의 폭력성과 도덕적 무게를 분명히 이해하도록 직설적 어휘를 택했습니다.
  doctrine_reference: 역사 서술의 사실성 보존
