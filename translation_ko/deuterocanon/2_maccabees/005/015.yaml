translation:
  language: ko
  text: 그러나 그는 이러한 일들에 만족하지 않고, 법들과 자기 조국을 배신한 자가 된 메넬라오스를 안내자로 데리고 온 땅에서 가장 거룩한 성전에[a] 감히 들어갔습니다.
  philosophy: optimal-equivalence
  footnotes:
