    text: 또는 ‘온 땅의 가장 거룩한 성소’. 그리스어 γῆ는 ‘땅’ 또는 ‘세계’를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἀρκεσθεὶς δὲ τούτοις
  english_pob_choice: But not satisfied with these things
  chosen_korean: 이러한 일들에 만족하지 않고
  alternatives_korean:
  - 이 일들에 만족하지 않고
  - 이러한 일들에 만족하지 못하고
  lexicon: LSJ
  rationale: ἀρκεῖσθαι의 ‘만족하다/충분하다’ 의미를 살려, 앞선 악행에 더해지는 다음 단계의 폭주라는 흐름을 자연스럽게 드러냈습니다.
- source_word: κατετόλμησεν
  english_pob_choice: he even dared
  chosen_korean: 감히 저질렀습니다
  alternatives_korean:
  - 감히 들어갔습니다
  - 감히 무릅썼습니다
  lexicon: LSJ
  rationale: 단순한 ‘하다’보다 도발적이고 무례한 대담성을 살리기 위해 ‘감히’와 함께 강한 서술어를 택했습니다.
- source_word: πάσης τῆς γῆς ἁγιώτατον ἱερὸν
  english_pob_choice: the most holy temple in all the earth
  chosen_korean: 온 땅에서 가장 거룩한 성전
  alternatives_korean:
  - 온 땅의 가장 거룩한 성전
  - 온 세상에서 가장 거룩한 성소
  lexicon: LSJ
  rationale: ἱερόν을 문맥상 ‘성전’으로 옮기고, πάσης τῆς γῆς의 보편적 수식을 그대로 살려 ‘온 땅에서’로 옮겼습니다.
- source_word: ὁδηγὸν ἔχων
  english_pob_choice: with Menelaus as his guide
  chosen_korean: 멘엘라오스를 안내자로 삼았습니다
  alternatives_korean:
  - 멘엘라오스를 길잡이로 삼았습니다
  - 멘엘라오스를 인도로 삼았습니다
  lexicon: LSJ
  rationale: 분사구의 동반·보조 의미를 한국어 서술로 풀어, 그가 멘엘라오스를 따라가거나 이용했다는 뉘앙스를 드러냈습니다.
- source_word: τῶν νόμων καὶ τῆς πατρίδος προδότην γεγονότα
  english_pob_choice: the one who had become a traitor both to the laws and to his homeland
  chosen_korean: 법들과 자기 조국의 배신자가 된
  alternatives_korean:
  - 율법과 자기 조국의 배신자가 된
  - 법과 고향의 배신자가 된
  lexicon: LSJ
  rationale: νόμων의 복수를 살려 ‘법들’로 옮겼고, πατρίς는 개인적 소속과 민족적 귀속을 함께 담기 위해 ‘자기 조국’으로 옮겼습니다.
theological_decisions:
- issue: 성전의 극단적 신성함과 γῆ의 범위
  chosen_reading: ‘온 땅에서 가장 거룩한 성전’으로 옮겨, 본문이 성전의 절대적 거룩함을 과장 없이도 강하게 선언하는 표현을 유지했습니다.
  alternative_readings:
  - ‘온 땅의 가장 거룩한 성소’
  - ‘온 세상에서 가장 거룩한 성전’
  rationale: γῆ는 ‘땅/땅 위의 세계’ 모두 가능하지만, POB의 영어 선택처럼 보편적 수사를 살리는 쪽이 본문의 강조를 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §§1, 6
