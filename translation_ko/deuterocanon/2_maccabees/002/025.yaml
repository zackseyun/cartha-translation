    rationale: 원문과 영어 감사본은 왕이 앞서 언급된 대상을 성소로 만들었음을 나타냅니다. 한국어에서도 ‘그것을 성소로’라고 명시하는 편이 충실하고 자연스럽습니다.
  - severity: low
