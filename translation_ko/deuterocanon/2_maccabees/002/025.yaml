  text: And after enclosing it[a], the king made it a sanctuary[c][b], having tested the matter.
  footnotes:
  - marker: a
    text: Or 'after fencing it around' or 'after fortifying it'; the Greek participle can suggest enclosing for protection.
    reason: lexical_alternative
  - marker: b
    text: Or 'made it a temple' or 'made it a holy place'; Greek ἱερόν can refer broadly to a sacred precinct.
    reason: lexical_alternative
