  source_fidelity: 그리스어의 두 부정과거 분사(περιφράξας, δοκιμάσας)는 왕이 성소로 만들기 전에 행한 동작을 나타냅니다. 초안은 대체로 이를 반영하지만, 주절의 목적어가 한국어 문장에서 생략되어 ‘그것을 성소로 만들었다’는 원문의 관계가 덜 분명합니다.
  naturalness: ‘그것을 둘러싸고는, 그 일을 시험해 보고서 성소로 만들었습니다’는 목적어 생략과 보조사 ‘-고는’ 때문에 다소 끊기고, 마지막 동사의 목적 대상이 일시적으로 불분명합니다. ‘둘러싼 뒤 … 그것을 성소로 만들었습니다’가 현대 표준어 합쇼체로 더 자연스럽고 명료합니다.
  terminology: ‘성소’는 ἱερόν의 넓은 의미 범위를 비교적 안전하게 보존합니다. ‘그 일’은 τὸ πρᾶγμα의 포괄성을 유지하며, ‘시험해 본 뒤’는 δοκιμάσας의 시험·검증 의미를 과도하게 결과 중심으로 좁히지 않습니다.
  issues:
