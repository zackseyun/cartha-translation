translation:
  language: ko
  text: 그리고 왕은 그것을 둘러싸고는, 그 일을 시험해 보고서 성소로 만들었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘둘러막고는’, ‘울타리로 두르고는’. 그리스어 분사는 보호를 위한 둘러쌈을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘성전으로 만들었습니다’, ‘거룩한 곳으로 만들었습니다’. ἱερόν은 넓게 신성한 구역을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 절의 그리스어 본문은 검증 불확실성 표시가 있어, 현존 본문을 직접 따랐습니다.
    reason: textual_variant
lexical_decisions:
- source_word: περιφράξας
  english_pob_choice: after enclosing it
  chosen_korean: 그것을 둘러싸고는
  alternatives_korean:
  - 그것을 에워싸고는
  - 그것을 둘러막고는
  - 그것을 울타리로 두르고는
  lexicon: LSJ
  rationale: aorist participle의 선행 동작을 살리면서, περιφράσσω의 기본 뜻인 둘러싸다/둘러막다를 자연스럽게 옮겼습니다.
- source_word: ἱερὸν
  english_pob_choice: a sanctuary
  chosen_korean: 성소
  alternatives_korean:
  - 성역
  - 신성한 곳
  - 성전
  lexicon: LSJ
  rationale: ἱερόν은 거룩한 구역이나 성소를 넓게 가리킬 수 있으므로, 특정 건물을 단정하지 않는 ‘성소’가 본문의 범위를 잘 보존합니다.
- source_word: δοκιμάσας
  english_pob_choice: having tested
  chosen_korean: 그 일을 시험해 보고서
  alternatives_korean:
  - 그 일을 살펴보고서
  - 그 일을 검증하고서
  - 그 일을 시험한 뒤
  lexicon: LSJ
  rationale: δοκιμάζω의 ‘시험하다/검증하다’ 의미를 살리되, 한국어에서 결과를 매끄럽게 잇는 완료 표현으로 옮겼습니다.
- source_word: τὸ πρᾶγμα
  english_pob_choice: the matter
  chosen_korean: 그 일
  alternatives_korean:
  - 그 문제
  - 그 사안
  - 그 사정
  lexicon: LSJ
  rationale: πρᾶγμα의 넓은 지시 범위를 유지하면서도, 문맥상 가장 자연스러운 일반어인 ‘그 일’로 옮겼습니다.
theological_decisions:
- issue: ἱερὸν의 범위와 특정화 여부
  chosen_reading: '‘성소’로 옮겨, 원문이 특정한 건물(예: 성전)인지 광범한 거룩한 구역인지 단정하지 않았습니다.'
  alternative_readings:
  - ‘성전’으로 특정하기
  - ‘신성한 곳’으로 더 일반화하기
  rationale: 영어 POB가 sanctuary를 택한 것처럼, 그리스어 ἱερόν의 의미 폭을 보존하는 것이 문맥상 더 안전합니다.
  doctrine_reference: 원문 의미 범위 보존 원칙
- issue: δοκιμάσας의 결과 뉘앙스
  chosen_reading: ‘시험해 보고서’로 옮겨, 단순 확인이 아니라 실제로 시험한 뒤의 판단이라는 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘살펴보고서’로 약화하기
  - ‘검증하고서’로 보다 기술적으로 옮기기
  rationale: δοκιμάζω는 시험/검증의 결과적 판단을 내포할 수 있어, 그 긴장을 과도하게 약화하지 않는 표현을 선택했습니다.
  doctrine_reference: 원문 서술의 행위-결과 구조 보존
