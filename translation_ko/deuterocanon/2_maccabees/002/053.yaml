review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the work as an abridgment and conveys that its production involves hardship. However, the doubled dative/topic construction (‘우리에게는 … 이들에게는’) obscures the Greek article-participle apposition, and the final predicate does not naturally express the genitives ‘of sweat and sleeplessness.’
  naturalness: ‘그리고 우리에게는, … 이들에게는’ is syntactically cumbersome, and ‘땀과 잠 못 이룸의 일입니다’ is not idiomatic modern formal Korean. A single topic phrase and an explicit natural predicate preserve the image more effectively.
  terminology: ‘축약본’ is suitable for ἐπιτομή, and ‘수고’ suitably renders κακοπάθεια in this editorial context. ‘잠을 이루지 못하다’ is more natural formal Korean than the nominalized ‘잠 못 이룸.’
  issues:
  - severity: medium
    issue: Duplicated topic/dative phrase
    rationale: The Korean repeats ‘우리에게는’ and ‘이들에게는’ for one Greek dative article-participle construction. This makes the self-reference needlessly awkward.
  - severity: medium
    issue: Unnatural rendering of ‘ἱδρῶτος … καὶ ἀγρυπνίας’
    rationale: ‘땀과 잠 못 이룸의 일’ is grammatically possible but unnatural. ‘땀을 흘리고 잠을 이루지 못해야 하는 일’ naturally communicates the work characterized by sweat and sleeplessness.
  revised_text: 그리고 이 축약본을 만드는 수고를 감당해 온 우리에게는 그 일이 쉽지 않으며, 땀을 흘리고 잠을 이루지 못해야 하는 일입니다.[a]
  revised_footnotes:
  - marker: a
    text: ‘감당해 온’은 그리스어 ἐπιδεδειγμένοις의 문자적 뜻인 ‘보여 준’보다, 문맥에서 드러나는 ‘축약 작업의 수고를 떠맡고 견딘’이라는 뜻을 풀어 옮긴 것입니다.
