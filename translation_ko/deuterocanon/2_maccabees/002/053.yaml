base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/053.yaml
  text: And for us[a], who have undertaken the hardship of making the abridgment, the task is not easy, but one of sweat and sleeplessness;
  footnotes:
  - marker: a
    text: Or, more literally, 'who have shown the hardship of the abridgment.' The Greek expression is somewhat idiomatic; the translation brings out the sense of taking on and enduring the labor involved in producing the abridgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 우리에게는, 이 축약본을 만드는 수고를 감당해 온 이들에게는, 그 일은 쉽지 않고, 땀과 잠 못 이룸의 일입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘감당해 온’은 그리스어 ἐπιδεδειγμένοις의 문자적 ‘보여 준’보다 문맥상 드러나는 ‘수고를 떠맡고 견딘’ 뜻을 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμῖν μὲν τοῖς
  english_pob_choice: for us, who
  chosen_korean: 우리에게는, 이 ... 이들에게는
  alternatives_korean:
  - 우리에게, ...하는 우리에게는
  - 우리로서는, ...하는 이들에게는
  lexicon: LSJ
  rationale: 여격과 관사-분사 결합이 화자 집단을 특징짓는 구조이므로, 한국어에서는 자연스럽게 주어를 앞세워 ‘우리에게는’으로 풀어 주고, 이어지는 분사구를 설명절처럼 처리했습니다.
- source_word: τὴν κακοπάθειαν
  english_pob_choice: the hardship
  chosen_korean: 수고
  alternatives_korean:
  - 고난
  - 어려움
  - 고생
  lexicon: LSJ
  rationale: 이 문맥은 박해가 아니라 편집 노동의 무거움을 말하므로, 강한 종교적 뉘앙스의 ‘고난’보다 실제 작업의 부담을 드러내는 ‘수고’가 더 적절합니다.
- source_word: ἐπιδεδειγμένοις τῆς ἐπιτομῆς
  english_pob_choice: who have undertaken the hardship of making the abridgment
  chosen_korean: 이 축약본을 만드는 수고를 감당해 온
  alternatives_korean:
  - 축약본을 만드는 수고를 보여 온
  - 축약본의 작업을 맡아 온
  lexicon: LSJ
  rationale: ἐπιδείκνυμι는 문자적으로 ‘보여 주다’이지만 여기서는 관용적으로 어떤 수고를 떠맡고 견뎌 온 뜻이므로, ‘감당해 온’으로 옮겨 원문의 부담과 지속성을 살렸습니다. ἐπιτομή는 ‘축약본’으로 옮겨 문학적/편집적 성격을 분명히 했습니다.
- source_word: ἱδρῶτος δὲ καὶ ἀγρυπνίας
  english_pob_choice: of sweat and sleeplessness
  chosen_korean: 땀과 잠 못 이룸의
  alternatives_korean:
  - 땀과 철야의
  - 땀과 불면의
  lexicon: LSJ
  rationale: 두 속격은 일의 성격을 생생하게 묘사하므로, ‘땀’과 ‘잠 못 이룸’으로 직관적이면서도 신체적 이미지를 유지했습니다.
