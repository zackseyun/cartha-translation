- source_word: περίβολον τοῦ τεμένους
  english_pob_choice: the enclosure of the sanctuary
  chosen_korean: 성소의 뜰
  alternatives_korean:
  - 성소의 울타리 안
  - 성역의 둘레
  - 성소의 경내
  lexicon: LSJ
  rationale: περίβολος와 τέμενος의 중첩된 공간 이미지를 한국어 성전 문맥에서 이해하기 쉬운 ‘뜰’과 ‘성소’로 살렸습니다.
- source_word: συγκλείσαντες τὸ ἱερόν
  english_pob_choice: they shut the temple
  chosen_korean: 그들은 성전을 닫았습니다
  alternatives_korean:
  - 그들은 성전을 닫아 걸었습니다
