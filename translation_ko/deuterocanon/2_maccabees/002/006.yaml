  lexicon: LSJ
  rationale: 그리스어 속명사의 소유격 관계를 그대로 살려 ‘~의 제사장들’로 옮겼고, 영어 POB의 Nanea를 따라 표기했습니다.
- source_word: προθεμένων αὐτά
  english_pob_choice: had set them out
  chosen_korean: 그것들을 내놓고
  alternatives_korean:
