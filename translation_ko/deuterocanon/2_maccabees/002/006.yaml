  yaml_path: translation/deuterocanon/2_maccabees/002/006.yaml
  text: And when the priests of Nanea had set them out[a], and he had come with a few men into the enclosure of the sanctuary, they shut the temple as soon as Antiochus entered[c][b],
  footnotes:
  - marker: a
    text: Greek Ναναίου may also be transliterated 'Nanaia.'
    reason: lexical_alternative
  - marker: b
    text: The pronoun 'them' is unspecified in Greek and likely refers to items previously mentioned in the narrative context.
    reason: cross_reference
  - marker: c
    text: This verse appears to belong to the narrative of Antiochus and the temple of Nanea (elsewhere associated with 2 Maccabees 1:13–15), not the surrounding context of chapter 2; the source witness is translated as given despite the apparent contextual mismatch.
    reason: textual_variant
translation:
  language: ko
  text: 나네아의 제사장들이 그것들을 내놓고, 안티오코스가 몇 사람과 함께 성역의 경내로 들어오자, 제사장들은 그가 신전에 들어가자마자 신전을 닫았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 Ναναίου는 ‘나나이아’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그것들’은 그리스어에서 명시되지 않은 대명사로, 앞선 문맥에 나온 물건들을 가리킬 가능성이 큽니다.
    reason: cross_reference
  - marker: c
    text: 이 절은 주변 문맥보다 안티오코스와 나네아 신전의 이야기(다른 곳에서는 2마카베오 1:13–15과 연결됨)에 속하는 것으로 보입니다. 그러나 이 자료의 그리스어 본문을 그대로 따라 옮겼습니다.
    reason: textual_variant
lexical_decisions:
