  lexicon: LSJ
  rationale: συγκλείσαντες는 단순히 문을 잠그는 것보다 ‘닫다/봉쇄하다’의 의미가 있으나, 과도하게 해석하지 않도록 가장 직접적인 동사인 ‘닫다’를 선택했습니다.
- source_word: ὡς εἰσῆλθεν Ἀντίοχος
  english_pob_choice: as soon as Antiochus entered
  chosen_korean: 안티오코스가 들어가자마자
  alternatives_korean:
  - 안티오코스가 들어가자
  - 안티오코스가 들어간 순간
  lexicon: LSJ
  rationale: ὡς + aorist의 순간적 시간관계를 한국어의 ‘-자마자’로 옮겨, 함정이 즉시 작동하는 긴박감을 보존했습니다.
theological_decisions:
- issue: καὶ … κἀκεῖνον … συγκλείσαντες의 사건 전개와 즉시성
  chosen_reading: 제사장들이 무엇인가를 내놓은 뒤, 그가 소수의 사람들과 성소 안으로 들어오자마자 성전을 닫는 순차적 함정 장면으로 읽었습니다.
  alternative_readings:
  - 단순한 시간적 동시 진행으로 읽기
  - ‘그것들’의 대상과 사건 배경을 본절 안에서 확정하기
  rationale: 본문의 동사 배열과 영어 POB의 주해를 따라, 본절을 배경 설명이 압축된 서술로 유지하되 αὐτά의 불특정성과 순간적 폐쇄를 그대로 드러냈습니다.
  doctrine_reference: 본문 해석 원칙 및 역사서 서술의 문맥 보존
- issue: 나네아/나나이아의 음역 선택
  chosen_reading: ‘나네아’로 음역하되, 본문 자체는 소스 형태를 따르는 고유명사로 처리했습니다.
  alternative_readings:
  - ‘나나이아’로 옮기기
  - 의미를 풀어 ‘여신 나네아’로 번역하기
  rationale: 영어 POB가 Nanea를 기본으로 삼고 대안 음역을 각주로 제시했으므로, 한국어도 한 형태를 본문에 고정하고 대안은 각주로 남기는 것이 감사 가능성과 일관성에 유리합니다.
  doctrine_reference: 고유명사 음역 및 주석 일관성 원칙
