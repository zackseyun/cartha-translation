  text: 'And those in Judea[a], and the council of elders, and Judas, to Aristobulus, teacher of King Ptolemy, who is also of the family of the anointed priests, and to the Jews in Egypt: greetings and good health.'
  footnotes:
  - marker: a
    text: Or 'of the lineage of the consecrated priests.' The Greek says 'from the family of the anointed priests,' using χριστῶν in its ordinary sense of 'anointed,' not as a title.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 유대에 있는 이들과 장로회의와 유다는, 왕 프톨레마이오스의 스승 아리스토불로스에게, 곧 기름부음받은 제사장들의 가문 출신인 그에게, 그리고 이집트에 있는 유대인들에게 인사와 안부를 전합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성별된 제사장들의 가문’이라는 뜻일 수 있습니다. 여기서 χριστῶν은 제목이 아니라 ‘기름부음받은’의 일반 의미로 쓰였습니다.
    reason: lexical_alternative
