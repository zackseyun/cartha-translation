base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/041.yaml
  text: Likewise also Judas gathered together for us all the things that had been scattered because of the war that had occurred[b][a], and they are with us.
  footnotes:
  - marker: a
    text: Or, 'what had been dispersed.' The Greek does not specify the items more narrowly in this verse, though the context suggests collected records or writings.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'and it is with us,' with a singular verb used for a neuter plural subject in Greek.
    reason: lexical_alternative
translation:
  language: ko
  text: 마찬가지로 유다도 전쟁 때문에 흩어졌던 모든 것을 우리를 위해 모았고, 그것들은 우리와 함께 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘분산되었던 것.’ 이 절의 그리스어는 대상을 더 좁게 특정하지 않으며, 문맥상으로는 모아진 기록이나 문서일 가능성이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그리고 그것은 우리와 있습니다.’ 그리스어는 중성 복수 주어에 단수 동사를 쓰는 일반적 용법입니다.
    reason: lexical_alternative
