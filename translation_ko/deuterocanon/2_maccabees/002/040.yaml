base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/040.yaml
  text: The same things were also related in the records and in the memoirs concerning Nehemiah[a], and how, in founding a library, he gathered together the books about the kings and prophets, and the writings of David[b], and letters of kings concerning votive offerings.
  footnotes:
  - marker: a
    text: Or 'while establishing a library.' The Greek participle can express the act of founding or setting up the library.
    reason: lexical_alternative
  - marker: b
    text: '''Votive offerings'' refers to gifts dedicated to God; the Greek term can also be rendered ''dedicated gifts'' or ''things devoted.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 기록들과 느헤미야와 관련된 회고록들에도 같은 내용이 전해지는데, 그는 도서관을 세우면서 왕들과 예언자들에 관한 책들과 다윗의 글들, 그리고 봉헌물에 관한 왕들의 편지를 함께 모았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘도서관을 세우면서’. 그리스어 분사는 도서관을 설립하거나 세우는 행위를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘봉헌물’은 하나님께 바쳐진 선물을 가리키며, 그리스어는 ‘헌납된 예물’이나 ‘바쳐진 것들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξηγοῦντο
  english_pob_choice: were related
  chosen_korean: 전해지는데
  alternatives_korean:
  - 기록되는데
  - 서술되는데
  - 알려지는데
  lexicon: LSJ
  rationale: 문서 자료가 내용을 전하는 흐름을 살리기 위해, 해설처럼 보이는 ‘설명되다’보다 ‘전해지다’가 자연스럽고 원문에 가깝습니다.
- source_word: ἀναγραφαῖς / ὑπομνηματισμοῖς
  english_pob_choice: records / memoirs
  chosen_korean: 기록들 / 회고록들
  alternatives_korean:
  - 등록들 / 메모들
  - 문서들 / 회상록들
  - 기록문들 / 주해들
  lexicon: LSJ
  rationale: 두 용어 모두 문헌적 자료를 가리키므로, 현대 한국어에서 바로 이해되는 ‘기록들’과 ‘회고록들’로 옮겨 문서 출처의 성격을 드러냈습니다.
- source_word: καταβαλλόμενος βιβλιοθήκην
  english_pob_choice: in founding a library
  chosen_korean: 도서관을 세우면서
  alternatives_korean:
  - 도서관을 설립하면서
  - 도서관을 마련하면서
  - 도서관의 기초를 놓으면서
  lexicon: LSJ
  rationale: 여기서는 물리적으로 ‘내려놓다’가 아니라 기관을 세우는 의미이므로, ‘세우다’가 가장 자연스럽고 POB의 설립 의미를 살립니다.
- source_word: τὰ περὶ τῶν βασιλέων καὶ προφητῶν βιβλία
  english_pob_choice: the books about the kings and prophets
  chosen_korean: 왕들과 예언자들에 관한 책들
  alternatives_korean:
  - 왕들과 예언자들에 대한 책들
  - 왕들과 예언자들의 책들
  - 왕들과 예언자들에 관한 문서들
  lexicon: LSJ
  rationale: περὶ는 ‘~에 관한’의 뜻이 가장 직접적이므로, 소속을 암시하는 ‘~의 책들’보다 ‘~에 관한 책들’이 원문의 범위를 더 정확히 반영합니다.
- source_word: τὰ τοῦ Δαυείδ
  english_pob_choice: the writings of David
  chosen_korean: 다윗의 글들
  alternatives_korean:
  - 다윗의 작품들
  - 다윗의 기록들
  - 다윗의 저술들
  lexicon: LSJ
  rationale: 그리스어는 생략구로서 다윗에게 속한 문헌을 가리키므로, 지나치게 특정하지 않으면서도 자연스러운 ‘다윗의 글들’로 옮겼습니다.
- source_word: περὶ ἀναθεμάτων
  english_pob_choice: concerning votive offerings
  chosen_korean: 봉헌물에 관한
  alternatives_korean:
  - 서원물에 관한
  - 바쳐진 예물에 관한
  - 헌납물에 관한
  lexicon: LSJ
  rationale: ἀναθέματα는 여기서 저주가 아니라 하나님께 바쳐진 헌물의 뜻이므로, 교회 전통어 ‘아나테마’를 피하고 ‘봉헌물’로 풀어 썼습니다.
theological_decisions:
- issue: ἀναθέματα의 의미 범위와 종교적 오해 방지
  chosen_reading: 봉헌물
  alternative_readings:
  - 저주받은 것
  - 아나테마
  - 헌물
  rationale: 본문은 왕들의 편지가 성전 헌납물에 관해 말하는 역사적 맥락이므로, 후대 교회적 ‘저주’ 의미를 배제하고 봉헌 헌물의 의미를 드러내는 번역이 필요합니다.
  doctrine_reference: 성전/봉헌 맥락의 어휘 구분; 번역의 원문 우선 원칙
