  rationale: 여기서는 물리적으로 ‘내려놓다’가 아니라 기관을 세우는 의미이므로, ‘세우다’가 가장 자연스럽고 POB의 설립 의미를 살립니다.
- source_word: τὰ περὶ τῶν βασιλέων καὶ προφητῶν βιβλία
  english_pob_choice: the books about the kings and prophets
  chosen_korean: 왕들과 예언자들에 관한 책들
  alternatives_korean:
