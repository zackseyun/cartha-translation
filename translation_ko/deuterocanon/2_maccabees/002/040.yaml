base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/040.yaml
  text: The same things were also related in the records and in the memoirs concerning Nehemiah[a], and how, in founding a library, he gathered together the books about the kings and prophets, and the writings of David[b], and letters of kings concerning votive offerings.
  footnotes:
  - marker: a
    text: Or 'while establishing a library.' The Greek participle can express the act of founding or setting up the library.
    reason: lexical_alternative
  - marker: b
    text: '''Votive offerings'' refers to gifts dedicated to God; the Greek term can also be rendered ''dedicated gifts'' or ''things devoted.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 기록들과 느헤미야에 관한 회고록들에는 같은 내용이 전해지며, 느헤미야가 도서관을 세우면서[a] 왕들과 예언자들에 관한 책들과 다윗의 글들, 그리고 봉헌물[b]에 관한 왕들의 편지를 함께 모았다는 일도 전해집니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘도서관을 설립하면서’. 그리스어 분사는 도서관을 설립하거나 세우는 행위를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘봉헌물’은 하나님께 바쳐진 선물을 가리키며, 그리스어는 ‘헌납된 예물’이나 ‘바쳐진 것들’로도 옮길 수 있습니다.
    reason: lexical_alternative
