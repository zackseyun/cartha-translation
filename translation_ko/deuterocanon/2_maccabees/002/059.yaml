- source_word: τοῖς προειρημένοις τοσοῦτον ἐπιζεύξαντες
  english_pob_choice: adding only this much to what has been said before
  chosen_korean: 앞서 말한 것에 이만큼만 덧붙이겠습니다
  alternatives_korean:
  - 앞서 말한 것에 이만큼만 붙이겠습니다
  - 앞서 한 말에 이만큼만 더하겠습니다
  lexicon: LSJ
  rationale: ‘덧붙이다’로 부가의 의미를 살리고, τοσοῦτον의 제한을 ‘이만큼만’으로 분명히 했습니다.
- source_word: πρὸ τῆς ἱστορίας ... τὴν δὲ ἱστορίαν ἐπιτέμνειν
  english_pob_choice: to be excessive before the history ... to abridge the history itself
  chosen_korean: 앞에서 지나치게 말하는 것은 ... 정작 역사는 줄여 버리는 것은
  alternatives_korean:
  - 역사 앞에서 말을 지나치게 하는 것은 ... 역사를 줄이는 것은
  - 역사 앞에 길게 늘어놓는 것은 ... 역사를 잘라 내는 것은
  lexicon: LSJ
  rationale: πλεονάζειν과 ἐπιτέμνειν의 수사적 대비를 살리기 위해 ‘지나치게 말하다’와 ‘줄여 버리다’를 짝지었습니다.
theological_decisions:
- issue: ἱστορία의 의미 범위
  chosen_reading: ‘역사’로 유지하되, 서술 대상인 본문 전체의 ‘역사적 이야기/기록’이라는 문맥을 드러내도록 번역했습니다.
  alternative_readings:
  - ‘기록’
  - ‘사연’
  rationale: 여기서 ἱστορία는 단순한 ‘이야기’보다 본문의 역사적 서술 전체를 가리키므로, 한국어 ‘역사’를 기본으로 두는 편이 원문의 대조를 더 분명히 보여 줍니다.
  doctrine_reference: 문헌 서문/수사적 자기설명
- issue: 문체의 자기지시적 화자 태도
  chosen_reading: 직설적 권유형 ‘시작합시다’로 옮겨, 저자가 독자와 함께 서술로 진입하는 문체를 반영했습니다.
  alternative_readings:
  - ‘시작하겠습니다’
  - ‘시작해 봅시다’
  rationale: 헬라어 ἀρξώμεθα의 공동적 권유 뉘앙스를 살리기 위해, 단순한 선언보다 독자를 포함하는 표현이 적절합니다.
  doctrine_reference: 서술 전환의 수사학
