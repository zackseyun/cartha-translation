  - 따라서 이 지점에서
  lexicon: LSJ / BDAG
  rationale: Ἐντεῦθεν의 전환성과 οὖν의 귀결성을 함께 살려, 서술의 본문 진입을 자연스럽게 표시했습니다.
- source_word: ἀρξώμεθα τῆς διηγήσεως
