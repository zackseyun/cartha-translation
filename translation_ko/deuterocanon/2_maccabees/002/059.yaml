  yaml_path: translation/deuterocanon/2_maccabees/002/059.yaml
  text: Therefore let us begin the narrative from this point[a], adding only this much to what has been said before; for it is foolish to be excessive before the history[b], but to abridge the history itself.
  footnotes:
  - marker: a
    text: Or 'the account' for 'the narrative'; Greek διήγησις can denote a narrated account.
    reason: lexical_alternative
  - marker: b
    text: Or 'to say too much before the history, but to cut short the history itself.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이제 여기서부터 이야기를 시작합시다 — 앞서 말한 것에 이만큼만 덧붙이겠습니다. 앞에서 지나치게 말하는 것은 어리석은 일이지만, 정작 역사는 줄여 버리는 것은 더 어리석습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기록’을 뜻할 수 있습니다. 그리스어 διήγησις는 서술된 설명이나 기록된 이야기를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘역사 앞에서 너무 많이 말하는 것, 그러나 역사를 그 자체로 잘라 버리는 것’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐντεῦθεν οὖν
  english_pob_choice: Therefore let us begin from this point
  chosen_korean: 그러므로 이제 여기서부터
  alternatives_korean:
