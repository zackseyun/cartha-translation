  to: 그러므로 앞서 말한 것에 이만큼만 덧붙이고, 이제부터 이야기를[a] 시작합시다. 역사에 앞서 지나치게 말하고 정작 역사를 줄이는 것은 어리석은 일이기 때문입니다.[b]
  rationale: The revision removes the unsupported comparative, avoids redundant transition language, and represents the Greek participle (‘having added’) by connecting it directly to the hortatory invitation. It also restores the source’s single evaluative statement about both an excessive preface and an abridged main history, while placing footnote markers at the relevant expressions.
