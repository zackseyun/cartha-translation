base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/012.yaml
  text: As they explained to us that they had found not fire but thick water[a], he ordered them, after drawing some out, to bring it. Then when the things for the sacrifices had been brought forward[c][b], Nehemiah ordered the priests to sprinkle the water on both the wood and what was laid upon it.
  footnotes:
  - marker: a
    text: Or 'dense water' or 'thick liquid.' The Greek wording is unusual and may intentionally stress the strange character of the substance.
    reason: lexical_alternative
  - marker: b
    text: The participle rendered 'after drawing some out' is difficult and uncommon in this form; the sense is that they were to take some of the liquid and bring it.
    reason: textual_variant
  - marker: c
    text: Or 'pour the water over both the wood and what was laid upon it.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들이 우리에게 불은 찾지 못하고 걸쭉한 물을 찾았다고 설명하자,[a] 그는 그것을 조금 떠서[b] 가져오라고 명령하였습니다. 그리고 제사에 쓸 것들이 올려지자, 느헤미야는 제사장들에게 그 물을 나무와 그 위에 놓인 것들에 뿌리라고[c] 명령하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘진한 물’, ‘걸쭉한 액체’. 그리스어 표현이 이례적이어서, 이 물질의 낯선 성격을 의도적으로 강조하는 것일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘조금 떠서’로 옮긴 분사구는 형태가 드물고 난해하여, 문맥상 액체를 일부 취해 가져오라는 뜻으로 이해됩니다.
    reason: textual_variant
  - marker: c
    text: 또는 ‘그 물을 나무와 그 위에 놓인 것들 위에 붓다’.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς διεσάφησαν ἡμῖν
  english_pob_choice: As they explained to us
  chosen_korean: 그들이 우리에게 … 설명하자
  alternatives_korean:
  - 그들이 우리에게 … 분명히 말하자
  - 그들이 우리에게 … 상세히 알리자
  lexicon: LSJ
  rationale: διεσάφησαν은 내용을 분명히 풀어 설명한다는 뜻이므로, 한국어로는 자연스러운 ‘설명하자’가 가장 잘 맞습니다.
- source_word: μὴ εὑρηκέναι πῦρ ἀλλὰ ὕδωρ παχύ
  english_pob_choice: they had found not fire but thick water
  chosen_korean: 불은 찾지 못하고 진한 물을 찾았다고
  alternatives_korean:
  - 불은 없고 두꺼운 물을 찾았다고
  - 불은 찾지 못하고 짙은 물을 찾았다고
  lexicon: LSJ
  rationale: παχύς가 붙은 ὕδωρ의 이질적인 표현을 살려, 해석적으로 완화하지 않고 ‘진한 물’로 옮겼습니다.
- source_word: ἀποβλίψαντας φέρειν
  english_pob_choice: after drawing some out ... to bring it
  chosen_korean: 그것을 조금 떠서 가져오라고
  alternatives_korean:
  - 그것을 조금 퍼내어 가져오라고
  - 그것을 조금 떠다가 가져오라고
  lexicon: LSJ
  rationale: ἀποβλίψαντας는 드문 분사형이어서 과도하게 좁히지 않고, 문맥상 액체를 일부 떠서 옮기는 뜻을 한국어로 자연스럽게 반영했습니다.
- source_word: ἐπιρᾶναι τῷ ὕδατι τά τε ξύλα καὶ τὰ ἐπικείμενα
  english_pob_choice: to sprinkle the water on both the wood and what was laid upon it
  chosen_korean: 그 물을 나무와 그 위에 놓인 것들에 뿌리라고
  alternatives_korean:
  - 그 물을 나무와 그 위에 놓인 것들 위에 붓라고
  - 그 물을 나무와 그 위에 놓인 것들에 끼얹으라고
  lexicon: LSJ
  rationale: 제의적 맥락에서 ἐπιρᾶναι는 액체를 위에 적용하는 행위이므로, POB의 ‘sprinkle’에 맞춰 ‘뿌리다’로 옮겼습니다.
theological_decisions:
- issue: 희생 제물 관련 절차의 서술 방식
  chosen_reading: ‘희생 제물에 쓸 것들이 가져와지자’와 ‘나무와 그 위에 놓인 것들에 뿌리라’로 제의적 동작을 그대로 유지했습니다.
  alternative_readings:
  - ‘제사에 쓸 재료가 마련되자’
  - ‘그 위에 붓라’
  rationale: 원문의 제의적 절차를 완화하지 않고 보존해야 하므로, 문맥이 요구하는 구체성을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: ‘진한 물’의 낯선 표현 유지
  chosen_reading: ‘진한 물’을 그대로 살렸습니다.
  alternative_readings:
  - ‘진한 액체’
  - ‘짙은 물’
  rationale: 본문은 불 대신 발견된 이 물질의 기이함을 강조하므로, 한국어에서도 낯선 감각을 보존하는 것이 본문의 효과를 더 잘 전달합니다.
  doctrine_reference: Translation philosophy §1, §3
