  text: Gather our dispersion, free those who are enslaved among the nations, look upon those who are despised and abhorred; and let the nations know that you are our God.
  footnotes:
  - marker: a
    text: Or 'our scattered people.' The Greek literally says 'our dispersion,' using the abstract noun for the dispersed community.
    reason: lexical_alternative
  - marker: b
    text: Or 'have regard for' or 'show pity to.' The Greek asks God to turn his attention toward those who are despised and abhorred.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리의 흩어진 사람들을 모으시고, 민족들 가운데서 종살이하는 이들을 자유롭게 하시며, 멸시받고 혐오받는 이들을 돌아보소서. 그리고 민족들이 당신이 우리의 하나님이심을 알게 하소서.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘흩어진 사람들’은 헬라어의 추상명사 διασπορά를 공동체를 가리키는 말로 풀어 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘돌아보소서’는 ‘주의를 돌리다, 호의를 베풀다’의 뜻을 함께 담은 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισυνάγαγε
  english_pob_choice: Gather
  chosen_korean: 모으시고
  alternatives_korean:
  - 모아 주시고
  - 불러 모으시고
  - 모으소서
  lexicon: LSJ
  rationale: 하나님께 드리는 간구의 명령형을 살리면서도 한국어 문장 흐름에 자연스럽게 연결되도록 ‘모으시고’로 옮겼습니다.
- source_word: τὴν διασπορὰν ἡμῶν
  english_pob_choice: our dispersion
  chosen_korean: 우리의 흩어진 사람들을
  alternatives_korean:
  - 우리의 흩어짐을
  - 우리의 흩어진 공동체를
  - 우리의 흩어진 백성을
  lexicon: LSJ
  rationale: 직역적 추상명사보다는 한국어에서 뜻이 분명한 공동체 지시로 풀어, 흩어진 상태를 보존하면서도 기도문으로 읽히게 했습니다.
- source_word: τοὺς δουλεύοντας
  english_pob_choice: those who are enslaved
  chosen_korean: 종살이하는 이들을
  alternatives_korean:
  - 노예가 된 이들을
  - 종된 이들을
  - 사로잡힌 이들을
  lexicon: LSJ
  rationale: δουλεύω의 예속 상태를 드러내기 위해 ‘종살이하다’를 택했고, 본문이 단순한 봉사가 아니라 억압적 속박을 말한다는 점을 살렸습니다.
- source_word: ἔφιδε
  english_pob_choice: look upon
  chosen_korean: 돌아보소서
  alternatives_korean:
  - 살펴보소서
  - 굽어보소서
  - 눈여겨보소서
  lexicon: LSJ
  rationale: 하나님의 주의를 요청하는 동작을 한국어 기도문 관용인 ‘돌아보소서’로 옮겼으며, 단순 관찰보다 자비로운 주목을 암시합니다.
theological_decisions:
- issue: 민족들 가운데서 억눌린 이들을 묘사하는 δουλεύω 계열의 번역
  chosen_reading: 종살이하는 이들
  alternative_readings:
  - 노예가 된 이들
  - 종된 이들
  - 사로잡힌 이들
  rationale: 본문은 자발적 섬김이 아니라 민족들 가운데서의 예속 상태를 전제하므로, 그 강도를 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §1; contested doul- terms guidance
- issue: 전형적인 한국 교회어 ‘굽어살피시다’ 대신의 표현 선택
  chosen_reading: 돌아보소서
  alternative_readings:
  - 굽어살피소서
  - 살펴보소서
  - 자비를 베푸소서
  rationale: 문맥상 핵심은 고난받는 자들을 향한 하나님의 시선과 개입 요청이므로, 지나치게 관용화된 표현보다 직접적인 청원형을 유지했습니다.
  doctrine_reference: Translation philosophy §5
