  text: Gather our dispersion, free those who are enslaved among the nations, look upon those who are despised and abhorred; and let the nations know that you are our God.
  footnotes:
  - marker: a
    text: Or 'our scattered people.' The Greek literally says 'our dispersion,' using the abstract noun for the dispersed community.
    reason: lexical_alternative
  - marker: b
    text: Or 'have regard for' or 'show pity to.' The Greek asks God to turn his attention toward those who are despised and abhorred.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리 흩어진 이들을 모으시고[a], 민족들 가운데서 노예로 지내는 이들을 해방하시며, 멸시받고 혐오받는 이들을 돌아보소서[b]. 그리고 민족들이 주께서 우리의 하나님이심을 알게 하소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘우리 흩어진 이들’은 헬라어의 추상명사 διασπορά를 흩어진 공동체를 가리키는 말로 풀어 옮긴 것입니다. 직역하면 ‘우리의 흩어짐’ 또는 ‘우리의 디아스포라’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘돌아보소서’는 하나님께서 멸시받고 혐오받는 이들에게 주의를 기울이시고 호의를 베푸시기를 구하는 표현입니다.
    reason: lexical_alternative
