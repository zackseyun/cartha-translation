lexical_decisions:
- source_word: ὁ μόνος χορηγός
  english_pob_choice: the only provider
  chosen_korean: 오직 한 분뿐인 공급자
  alternatives_korean:
  - 유일한 은혜를 베푸시는 분
  - 오직 한 분뿐인 후원자
  lexicon: LSJ
  rationale: χορηγός는 단순한 경제적 ‘공급’보다 필요를 마련해 주는 분을 가리키므로, 하나님의 칭호로는 ‘공급자’가 가장 자연스럽고 직접적입니다.
- source_word: ὁ μόνος δίκαιος
  english_pob_choice: the only righteous one
  chosen_korean: 오직 한 분뿐인 의로우신 분
  alternatives_korean:
  - 오직 한 분뿐인 의로운 분
  - 오직 한 분뿐인 의인
  lexicon: BDAG
  rationale: 문맥상 독립된 신적 칭호이므로 ‘의로우신 분’으로 인격적 호칭을 살리고, ‘의인’은 한국어에서 하나님 칭호로는 다소 어색하므로 피했습니다.
- source_word: παντοκράτωρ καὶ αἰώνιος
  english_pob_choice: almighty and eternal
  chosen_korean: 전능하시고 영원하신 분
  alternatives_korean:
  - 만물의 주권자이시며 영원하신 분
  - 전능하고 영원하신 분
  lexicon: BDAG
  rationale: ‘전능하시고 영원하신’은 두 형용사를 병렬로 유지하면서도 한국어 예배체에 자연스럽고, 뒤의 ‘분’과 결합해 신적 칭호의 흐름을 보존합니다.
- source_word: διασώζων τὸν Ἰσραὴλ ἐκ παντὸς κακοῦ
  english_pob_choice: the one who rescues Israel from every evil
  chosen_korean: 이스라엘을 모든 악에서 구원하시는 분
  alternatives_korean:
  - 이스라엘을 모든 재앙에서 건지시는 분
  - 이스라엘을 모든 해악에서 구해 내시는 분
  lexicon: BDAG
  rationale: διασώζων은 위험에서 건져 내는 구출의 뉘앙스가 있지만, 여기서는 이스라엘에 대한 하나님의 구원 행위를 넓게 지시하므로 ‘구원하시는’이 가장 균형적입니다.
- source_word: ποιήσας τοὺς πατέρας ἐκλεκτούς καὶ ἡγίασας αὐτούς
  english_pob_choice: who made the fathers chosen and sanctified them
  chosen_korean: 조상들을 택하셔서 거룩하게 하신 분
  alternatives_korean:
  - 조상들을 택하시고 그들을 성별하신 분
  - 조상들을 택해 세우시고 그들을 성화하신 분
  lexicon: BDAG
  rationale: ἡγίασας는 ‘거룩하게 하다/성별하다’의 뜻이므로 ‘거룩하게 하신’으로 옮겨, ‘택하셔서’와 함께 조상들을 하나님의 언약적 구별 안에 두는 흐름을 살렸습니다.
theological_decisions:
- issue: 이 문장의 전체 문법 구조
  chosen_reading: 연속된 신적 칭호들의 열거로 보고, 한국어에서도 ‘오직 한 분뿐인…’ 구조를 반복하지 않고 한 흐름의 찬양문처럼 옮겼습니다.
  alternative_readings:
  - 각 칭호를 독립 절로 나누어 ‘그분만이 공급자이십니다…’로 옮길 수 있습니다.
  - 문장 전체를 더 산문적으로 재구성할 수 있습니다.
  rationale: 그리스어는 분사와 관형 구가 이어지는 경배적 서술이므로, 구조를 살리면 본문의 장엄성과 신학적 강조가 더 분명해집니다.
  doctrine_reference: '번역 원칙: source structure preserving where meaning-bearing.'
