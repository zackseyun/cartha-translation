  text: 그 지도자와 그를 따르던, 대적할 수 없을 듯 보이던 군대가 이르렀을 때, 그들은 나나이아의 신전에서 죽임을 당했습니다. 이는 나나이아를 섬기던 제사장들이 속임수를 썼기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
