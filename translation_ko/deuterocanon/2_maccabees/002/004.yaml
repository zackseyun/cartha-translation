  text: 그 지도자와 그와 함께한 군대가, 패할 수 없는 듯 보였을 때, 그들은 나나이아의 신전에서 쓰러졌습니다. 이는 나나이아를 섬기던 제사장들이 속임수를 사용했기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
