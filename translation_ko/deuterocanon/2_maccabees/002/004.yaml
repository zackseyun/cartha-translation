lexical_decisions:
- source_word: γενόμενος
  english_pob_choice: had arrived
  chosen_korean: 패할 수 없는 듯 보였을 때
  alternatives_korean:
  - 도착했을 때
  - 오게 되었을 때
  - 이르게 되었을 때
  lexicon: LSJ
  rationale: 문맥상 시간 부사적 분사로서 뒤의 살육 사건과 이어지므로, 단순한 '되다'보다 도착·이르게 됨의 의미를 살려 자연스럽게 옮겼습니다.
- source_word: ἡγεμών
  english_pob_choice: leader
  chosen_korean: 그 지도자
  alternatives_korean:
  - 그 통치자
  - 그 지휘관
  - 그 장수
  lexicon: LSJ
  rationale: 민정 직함으로 좁히지 않고, 문맥이 허용하는 넓은 의미인 '지도자'를 택했습니다.
- source_word: ἡ περὶ αὐτὸν ... δύναμις
  english_pob_choice: the force around him
  chosen_korean: 그와 함께한 군대
  alternatives_korean:
  - 그를 둘러싼 군세
  - 그를 따르던 병력
  - 그 주변의 힘
  lexicon: LSJ
  rationale: δύναμις를 군사적 '병력/군대'로 이해하는 것이 자연스럽고, περὶ αὐτόν은 동반·수반 관계를 나타내므로 '함께한'으로 풀었습니다.
- source_word: ἀνυπόστατος δοκοῦσα εἶναι
  english_pob_choice: which seemed invincible
  chosen_korean: 패할 수 없는 듯 보였을 때
  alternatives_korean:
  - 감당할 수 없는 듯 보였을 때
  - 당해 낼 수 없는 듯 보였을 때
  - 무적처럼 보였을 때
  lexicon: LSJ
  rationale: ἀνυπόστατος의 난해함을 반영하되, 문맥상 '대항할 수 없음/패할 수 없음'의 뉘앙스를 살려 과도한 해석을 피했습니다.
- source_word: παραλογισμῷ χρησαμένων
  english_pob_choice: because ... had used deceit
  chosen_korean: 속임수를 사용했기 때문입니다
  alternatives_korean:
  - 기만을 썼기 때문입니다
  - 계략을 썼기 때문입니다
  - 속임수로 인해
  lexicon: LSJ
  rationale: παραλογισμός의 핵심 의미를 한국어의 '속임수/기만'으로 옮겨, 사건의 원인을 분명히 드러냈습니다.
