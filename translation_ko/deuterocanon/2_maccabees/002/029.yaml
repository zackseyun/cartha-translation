  source_fidelity: 수정이 필요합니다. τῆς ὅλης καταβολῆς는 문맥상 건물 전체를 포괄하는 공사라는 넓은 의미로도 해석될 여지가 있으나, 기본적으로 ‘기초/기초를 놓음’을 뜻합니다. ‘전체 구조’는 이 기초의 이미지를 지워 버립니다. 또한 ἐγκαινίζειν과 ζωγραφεῖν은 두 동사이므로 본문에서 ‘꾸미고 그림을 그리다’로 각각 드러내는 편이 안전합니다.
  naturalness: 초안은 전반적으로 자연스럽고 합쇼체도 적절합니다. 다만 ‘전체 구조에 대해 생각해야’보다 ‘집 전체의 기초를 살펴야’가 한국어 문장 안에서 더 구체적이고 원문의 건축 비유를 보존합니다. 각주 표지는 대안이 되는 ἐγκαινίζειν에 직접 붙이는 것이 명확합니다.
  terminology: ‘건축가’, ‘기초’, ‘장식’, ‘그림을 그리다’는 현대 표준어에 자연스럽고 원문의 역할 및 장식·회화의 구별을 보존합니다. 신학적 전문 용어 문제는 없습니다.
