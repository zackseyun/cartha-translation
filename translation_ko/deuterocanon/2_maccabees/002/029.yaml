    rationale: 본문은 꾸미거나 갖추는 행위와 그림을 그리는 행위를 병렬로 둡니다. 두 동사를 분리하면 의미를 과도하게 특정하지 않으면서도 원문의 구조를 살릴 수 있습니다.
