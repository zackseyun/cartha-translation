  text: For just as the architect of a new house must take thought for the whole structure[a], but the one undertaking to decorate it with painted ornament must consider the things suitable for adornment, so also, I think, it is with us.
  footnotes:
  - marker: a
    text: Or possibly, 'the one undertaking to finish and paint it,' if ἐγκαινίζειν is taken more broadly as fitting out or completing the house rather than specifically decorating it.
    reason: lexical_alternative
translation:
  language: ko
  text: 새 집의 건축가는 그 집 전체의 기초를 살펴야 하고, 그 집을 꾸미고[a] 그림을 그리려는 사람은 장식에 알맞은 것들을 살펴야 합니다. 우리에게도 이와 같다고 저는 생각합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 집을 마무리하려는’으로 옮길 수 있습니다. ἐγκαινίζειν을 넓게 이해하면, 집을 장식하거나 갖추는 것뿐 아니라 완성하는 것까지 뜻할 수 있습니다.
    reason: lexical_alternative
