- from: 새 집의 건축자는 전체 구조에 대해 생각해야 하듯이, 그것을 채색된 장식으로 꾸미려는 사람은 장식에 알맞은 것들을 살펴야 합니다. 우리에게도 이와 같다고 저는 생각합니다.[a]
  to: 새 집의 건축가는 그 집 전체의 기초를 살펴야 하고, 그 집을 꾸미고[a] 그림을 그리려는 사람은 장식에 알맞은 것들을 살펴야 합니다. 우리에게도 이와 같다고 저는 생각합니다.
  rationale: 원문의 건축 비유에서 ‘기초’라는 어휘상을 회복하고, 병렬된 두 동사 ἐγκαινίζειν과 ζωγραφεῖν을 한국어에서도 각각 표현했습니다. ἐγκαινίζειν의 의미 범위는 본문에서 단정하지 않고, 해당 단어 바로 뒤의 각주로 보존했습니다. δοκῶ의 완곡한 1인칭 판단도 ‘저는 생각합니다’로 유지했습니다.
