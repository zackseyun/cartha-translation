base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/054.yaml
  text: For just as it is not easy for one who prepares a banquet[a], or even seeks the benefit of others, yet for the gratitude of the many we will gladly endure the hardship[b];
  footnotes:
  - marker: a
    text: Or 'a feast'; the Greek term can refer to a banquet or symposium.
    reason: lexical_alternative
  - marker: b
    text: '''The gratitude of the many'' means the thanks or appreciation of many readers, not a technical sacramental term.'
    reason: cultural_note
translation:
  language: ko
  text: 마치 잔치를[a] 마련하는 사람이나, 또는 심지어 다른 이들의 유익을 구하는 사람에게도 쉽지 않은 것처럼, 많은 이들의 감사[b] 때문에 우리는 기꺼이 그 고난을 견디겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: συμπόσιον은 ‘잔치’ 또는 ‘연회/향연’을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘많은 이들의 감사’는 성례 용어가 아니라, 저자의 수고에 대한 독자들의 일반적인 감사를 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: τῷ παρασκευάζοντι συμπόσιον
  english_pob_choice: for one who prepares a banquet
  chosen_korean: 잔치를 마련하는 사람
  alternatives_korean:
  - 연회를 준비하는 사람
  - 향연을 베푸는 사람
  lexicon: LSJ
  rationale: συμπόσιον은 문맥상 연회/잔치를 뜻할 수 있으므로, 현대 한국어에서 자연스러운 ‘잔치’를 택하되, 마련하는 행위의 부담을 살렸습니다.
- source_word: ζητοῦντι τὴν ἑτέρων ὠφέλειαν
  english_pob_choice: seeks the benefit of others
  chosen_korean: 다른 이들의 유익을 구하는 사람
  alternatives_korean:
  - 다른 이들의 이익을 구하는 사람
  - 남들의 도움을 찾는 사람
  lexicon: LSJ
  rationale: ὠφέλεια의 핵심인 ‘유익/이익’을 살려, 타인을 위한 이타적 목적을 분명하게 드러냈습니다.
- source_word: διὰ τὴν τῶν πολλῶν εὐχαριστίαν
  english_pob_choice: for the gratitude of the many
  chosen_korean: 많은 이들의 감사 때문에
  alternatives_korean:
  - 많은 사람의 감사로 말미암아
  - 무수한 이들의 감사 때문에
  lexicon: LSJ
  rationale: εὐχαριστία는 여기서 성례적 용어가 아니라 일반적인 감사이므로, ‘감사 때문에’로 자연스럽고 오해 없게 옮겼습니다.
- source_word: τὴν κακοπάθειαν ὑποίσομεν
  english_pob_choice: we will gladly endure the hardship
  chosen_korean: 우리는 기꺼이 그 고난을 견디겠습니다
  alternatives_korean:
  - 우리는 기꺼이 그 수고를 감당하겠습니다
  - 우리는 흔쾌히 그 고난을 참아내겠습니다
  lexicon: LSJ
  rationale: κακοπάθεια는 단순한 수고보다 더 무거운 ‘고난/고통스러운 수고’에 가깝기에, ‘고난’으로 옮기고 ἡδέως는 ‘기꺼이’로 반영했습니다.
theological_decisions:
- issue: εὐχαριστία의 의미
  chosen_reading: 보편적 감사/고마움으로 이해하고, 성찬적 또는 제의적 의미는 배제했습니다.
  alternative_readings:
  - 감사드림
  - 찬양
  rationale: 문맥이 저자의 서문적 겸손과 독자들의 반응을 말할 뿐이므로, 후대의 성례 신학을 투사하지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; avoid importing doctrinal claims the text does not make.'
