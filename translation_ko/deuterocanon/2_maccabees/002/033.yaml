  text: And some of those who had followed came near to mark the way[a], but they were not able to find it.
  footnotes:
  - marker: a
    text: Or 'to mark the road' or 'to mark the route.' The Greek ὁδός can denote a way, road, or route depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들을 따르던 이들 가운데 몇몇이 길을 표시하려고 다가왔지만, 찾을 수 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘길’은 여기서 문맥에 따라 ‘도로’나 ‘경로’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  english_pob_choice: came near
  chosen_korean: 다가왔지만
  alternatives_korean:
  - 가까이 왔지만
  - 접근했지만
  lexicon: LSJ
  rationale: 부사적으로 쓰인 aorist 분사 προσέρχομαι의 이동 방향을 자연스러운 현대 한국어로 옮기되, 지나친 해석을 피했습니다.
- source_word: τινὲς τῶν συνακολουθούντων
  english_pob_choice: some of those who had followed
  chosen_korean: 그들을 따르던 이들 가운데 몇몇이
  alternatives_korean:
  - 따라오던 이들 중 몇몇이
  - 동행하던 이들 가운데 몇몇이
  lexicon: LSJ
  rationale: 부분을 나타내는 τινὲς τῶν + 분사구문을 살려, ‘그들을 따른’ 관계를 분명하게 표현했습니다.
- source_word: ἐπισημήνασθαι τὴν ὁδόν
  english_pob_choice: to mark the way
  chosen_korean: 길을 표시하려고
  alternatives_korean:
  - 길을 표지하려고
  - 길을 알아보게 표시하려고
  lexicon: LSJ
  rationale: ἐπισημήνασθαι의 ‘표시하다, 분명히 표시하다’는 뜻을 따라 목적을 드러내는 표현으로 옮겼고, ὁδός는 이 문맥에서 ‘길’이 가장 자연스럽습니다.
- source_word: οὐκ ἠδυνήθησαν εὑρεῖν
  english_pob_choice: they were not able to find it
  chosen_korean: 찾을 수 없었습니다
  alternatives_korean:
  - 찾지 못했습니다
  - 발견할 수 없었습니다
  lexicon: LSJ
  rationale: 능력 부정의 뉘앙스를 한국어의 가능 표현으로 자연스럽게 살렸고, 문맥상 생략된 목적어는 앞의 ‘길’을 가리킵니다.
