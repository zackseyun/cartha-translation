    text: 마지막 ‘그것’의 지시 대상은 본문에서 명시되지 않습니다. 불꽃을 가리킬 수도 있고, 제단의 제물이나 타는 물질을 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς δὲ τοῦτο ἐγενήθη
  english_pob_choice: And when this happened
  chosen_korean: 이 일이 생기자
  alternatives_korean:
