  lexicon: LSJ
  rationale: ἀντιλάμπω의 응답적/되비침 뉘앙스를 한국어의 ‘비치다’로 살리되, 문맥상 너무 기계적인 표현은 피했습니다.
- source_word: ἐδαπανήθη
  english_pob_choice: it was consumed
  chosen_korean: 그것은 사라졌습니다
  alternatives_korean:
  - 그것은 소멸되었습니다
  - 그것은 소진되었습니다
  lexicon: LSJ
  rationale: 지시 대상이 본문상 명시되지 않아, 가장 가까운 선행어인 불꽃을 염두에 두되 한국어에서는 결과를 간명하게 표현했습니다.
theological_decisions:
- issue: 마지막 수동문의 지시 대상
  chosen_reading: 마지막 ‘그것’은 앞의 ‘불꽃’을 가장 가까운 암시적 주어로 보았습니다.
  alternative_readings:
  - 제단의 제물이나 타는 물질을 가리킬 수 있습니다
  - 이 표현은 지시 대상이 의도적으로 압축되어 있을 수 있습니다
  rationale: 그리스어는 주어를 명시하지 않으며, 바로 앞의 단수 명사 φλόξ가 가장 경제적인 선행어입니다. 다만 본문이 압축되어 있으므로 의미의 여지를 완전히 닫지 않았습니다.
  doctrine_reference: 원문이 허용하는 긴장을 그대로 두고, 문맥이 확정하지 않는 것은 단정하지 않습니다.
