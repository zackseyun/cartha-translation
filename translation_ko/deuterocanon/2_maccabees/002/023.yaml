  rationale: φλόξ는 구체적인 ‘불꽃’이며, ἀνήφθη의 수동 의미를 살려 ‘붙었습니다’로 옮겼습니다.
- source_word: ἀντιλάμψαντος φωτός
  english_pob_choice: the light from the altar shone forth
  chosen_korean: 제단에서 나온 빛이 비치자
  alternatives_korean:
  - 제단에서 나온 빛이 반사되자
