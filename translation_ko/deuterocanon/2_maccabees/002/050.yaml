lexical_decisions:
- source_word: ὑπὸ Ἰάσονος τοῦ Κυρηναίου
  english_pob_choice: by Jason of Cyrene
  chosen_korean: 키레네 출신인 제시한
  alternatives_korean:
  - 키레네 사람인 제시한
  - 키레네의 야손이 제시한
  lexicon: LSJ
  rationale: ὑπό는 여기서 행위의 주체를 나타내며, 본문의 문맥상 Jason을 소개합니다. 다만 한국어로는 인명 '제시한'을 그대로 옮기고, 지명 수식은 '키레네 출신인'으로 처리해 출처 표지를 살렸습니다.
- source_word: δηλωθέντα
  english_pob_choice: has been set forth
  chosen_korean: 밝혔으나
  alternatives_korean:
  - 제시되었으나
  - 드러났으나
  - 설명되었으나
  lexicon: LSJ
  rationale: δηλόω 계열은 '밝히다/드러내다/제시하다'의 범위인데, 여기서는 제시한 저술의 내용이 문서로서 제시된 것을 가리키므로 '밝혔으나'가 문학적 문맥에 가장 자연스럽습니다.
- source_word: διὰ πέντε βιβλίων
  english_pob_choice: in five books
  chosen_korean: 다섯 권의 책으로 통해
  alternatives_korean:
  - 다섯 권의 책에 담아
  - 다섯 책으로
  - 다섯 권으로
  lexicon: LSJ
  rationale: διά + 속격은 여기서 저술의 매개/형식을 나타내므로, 영어의 'in five books'와 대응되는 서술로 '다섯 권의 책으로'를 택했습니다.
- source_word: ἐπιτεμεῖν
  english_pob_choice: to abridge
  chosen_korean: 줄이려고 시도합니다
  alternatives_korean:
  - 축약하려고 시도합니다
  - 간추리려고 시도합니다
  - 요약하려고 시도합니다
  lexicon: LSJ
  rationale: ἐπιτέμνω는 글을 '잘라 줄이다'는 뜻으로, 완곡한 '요약'보다 문헌 축약의 성격을 드러내는 '줄이다'가 더 가깝습니다. 앞의 πειρασόμεθα를 살려 '시도합니다'를 붙였습니다.
theological_decisions:
- issue: 서문 형식의 자기 겸손 표현
  chosen_reading: πειρασόμεθα를 '시도합니다'로 옮겨, 본문이 작품 서문에서 보이는 절제된 태도를 유지했습니다.
  alternative_readings:
  - 하겠습니다
  - 감히 축약하겠습니다
  rationale: 본문은 신학 진술보다 문학적 서문에 가깝기 때문에, 과장된 확언보다 저자의 겸손한 수행 의지를 드러내는 번역이 적절합니다.
  doctrine_reference: 문헌 서문 번역 원칙
