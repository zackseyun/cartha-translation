  yaml_path: translation/deuterocanon/2_maccabees/002/036.yaml
  text: And it was also made clear that[a], as one having wisdom[b], he offered a sacrifice for the dedication and completion of the sanctuary.
  footnotes:
  - marker: a
    text: Or 'for rededication'; the historical setting may suggest renewed dedication, but the Greek simply says 'dedication.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the consecration of the sanctuary'; the Greek term can carry a cultic sense of bringing something to full sacred completion.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 그것은 그가 지혜를 가지고 있었기 때문에, 봉헌과 성전의 완성을 위한 희생제물을 바쳤다는 것도 분명해졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘재봉헌을 위한’이라는 뜻일 수 있습니다. 역사적 상황은 새롭게 다시 봉헌된 의미를 시사할 수 있지만, 그리스어는 단순히 ‘봉헌’을 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘성전을 성별하여 완성하는 것’이라는 뜻일 수 있습니다. 이 단어는 어떤 것을 제의적으로 온전하게 마치는 의미를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεσαφείτο
  english_pob_choice: it was also made clear
  chosen_korean: 또 그것은 … 분명해졌습니다
  alternatives_korean:
  - 또 그것은 … 밝혀졌습니다
  - 또 그것은 … 분명히 드러났습니다
  lexicon: LSJ
  rationale: 과거 미완료의 설명·공시적 뉘앙스를 살려, 사건이 점점 분명해졌다는 흐름을 자연스럽게 옮겼습니다.
- source_word: ὡς σοφίαν ἔχων
  english_pob_choice: because he had wisdom / as one having wisdom
  chosen_korean: 그가 지혜를 가지고 있었기 때문에
  alternatives_korean:
  - 지혜를 가진 사람으로서
  - 지혜를 지닌 채
  lexicon: LSJ
  rationale: ὡς + 분사구는 문맥상 이유 또는 방식의 뉘앙스를 가질 수 있어, POB의 의미를 따라 이유로 자연스럽게 옮겼습니다.
- source_word: ἀνήνεγκεν θυσίαν
  english_pob_choice: he offered a sacrifice
  chosen_korean: 희생제물을 바쳤습니다
  alternatives_korean:
  - 제사를 드렸습니다
  - 희생제를 올렸습니다
  lexicon: LSJ
  rationale: 제의적 문맥에서 ἀναφέρω는 제물을 ‘바치다/올리다’의 뜻이므로, 희생제물이라는 직역적 표현을 유지했습니다.
- source_word: ἐγκαινισμοῦ καὶ τῆς τελειώσεως τοῦ ἱεροῦ
  english_pob_choice: for the dedication and completion of the sanctuary
  chosen_korean: 봉헌과 성전의 완성을 위한
  alternatives_korean:
  - 헌당과 성전의 완성을 위한
  - 봉헌과 성소의 완성을 위한
  lexicon: LSJ
  rationale: ἐγκαινισμός의 기본값은 ‘봉헌’으로 두고, τελείωσις는 POB의 선택을 따라 ‘완성’으로 옮겨 성전의 제의적 완결성을 드러냈습니다.
theological_decisions:
- issue: ἐγκαινισμοῦ의 역사적 뉘앙스와 번역 선택
  chosen_reading: 봉헌
  alternative_readings:
  - 재봉헌
  - 헌당
  rationale: 그리스어 자체에는 ‘재-’가 없으므로 본문에는 중립적인 ‘봉헌’을 두고, 역사적 맥락의 재봉헌 가능성은 암시하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: τελειώσεως τοῦ ἱεροῦ의 제의적 의미
  chosen_reading: 성전의 완성
  alternative_readings:
  - 성전의 봉헌 완료
  - 성전의 성별/축성
  rationale: τελείωσις의 핵심 의미인 ‘완성’을 유지하되, 성전 문맥에서 단순한 일반적 완료가 아니라 제의적 완결을 가리킨다는 점은 본문 어휘 자체로 충분히 보존됩니다.
  doctrine_reference: Translation philosophy §1, §5
