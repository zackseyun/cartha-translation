  - severity: low
    issue: b 각주의 대안 표현이 다소 장황하고 비관용적입니다.
    rationale: ‘성전을 성별하여 완성하는 것’보다 ‘성전의 성별’ 또는 ‘축성’이 τελείωσις의 가능한 제의적 의미를 더 자연스럽고 정확하게 전달합니다.
