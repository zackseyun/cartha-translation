  yaml_path: translation/deuterocanon/2_maccabees/002/056.yaml
  text: For just as[a], in the case of a new house, the architect must take thought for the whole foundation, but the one undertaking to decorate and paint it must examine the things suitable for adornment, so also, I think, it is with us.
  footnotes:
  - marker: a
    text: Or 'to furnish and paint it'; the Greek verb rendered 'decorate' can denote fitting out or preparing a house, not only ornamenting it.
    reason: lexical_alternative
translation:
  language: ko
  text: 새 집의 경우, 건축가는 기초 전체를 돌보아야 하지만, 그 집을 꾸미고[a] 칠하려는 사람은 장식에 알맞은 것들을 살펴보아야 합니다. 우리 경우에도 그러하다고 생각합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἐγκαινίζειν은 여기서 단순히 ‘꾸미다’라는 뜻만이 아니라, 집을 갖추어 마련하거나 단장한다는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  english_pob_choice: for just as
  chosen_korean: ~처럼
  alternatives_korean:
  - 마치 ~처럼
  - 바로 ~하듯이
  lexicon: LSJ
  rationale: 비교를 여는 접속부로서 한국어에서는 자연스러운 대응인 ‘~처럼’으로 옮겨 문장의 비유 구조를 살렸습니다.
- source_word: τῆς ὅλης καταβολῆς
  english_pob_choice: the whole foundation
  chosen_korean: 전체 기초
  alternatives_korean:
  - 전체 구조
  - 온전한 기초 놓음
  lexicon: LSJ
  rationale: καταβολή는 여기서 ‘기초를 놓음/기초’의 뜻이므로, POB의 선택을 따라 ‘기초’로 두되 ὅλης의 총괄성을 ‘전체’로 드러냈습니다.
- source_word: ἐξεταστέον
  english_pob_choice: must examine
  chosen_korean: 살펴봐야 합니다
  alternatives_korean:
  - 검토해야 합니다
  - 면밀히 살펴야 합니다
  lexicon: LSJ
  rationale: 의무를 나타내는 수동형 형용사로서 단순한 관찰보다 신중한 검토를 뜻하므로, 현대 한국어에서 자연스러운 ‘살펴봐야 합니다’로 옮겼습니다.
- source_word: πρὸς διακόσμησιν
  english_pob_choice: for adornment
  chosen_korean: 장식에 알맞은
  alternatives_korean:
  - 장식을 위한
  - 꾸밈에 알맞은
  lexicon: LSJ
  rationale: διακόσμησις의 핵심은 단순 장식 행위뿐 아니라 꾸밈에 어울리는 배치를 포함하므로, 목적어를 ‘장식에 알맞은 것들’로 풀어 의미 범위를 보존했습니다.
theological_decisions:
- issue: 비유의 적용 범위
  chosen_reading: 본문의 비유적 논리를 그대로 살려, 건축가와 꾸미는 사람의 역할 구분을 통해 ‘우리에게도 그렇습니다’라는 적용을 유지했습니다.
  alternative_readings:
  - 더 직접적인 교훈문으로 다듬는 방식
  - 비유를 약화시키고 일반 원리로만 옮기는 방식
  rationale: 헬라어 문장은 설교적 결론보다 비교 구조 자체가 핵심이므로, 원문의 논증 흐름을 해치지 않도록 비유의 대비를 보존했습니다.
  doctrine_reference: 문맥 주해; 문학적-수사적 구조 보존
- issue: δοκῶ의 완곡한 자기표현
  chosen_reading: ‘제 생각에는’으로 옮겨 화자의 절제된 판단을 드러냈습니다.
  alternative_readings:
  - ‘내가 보기에’
  - ‘나는 생각합니다’
  rationale: δοκῶ는 단정이 아니라 완곡한 추정을 나타내므로, 확정적 표현보다 화자의 겸손한 서술 태도를 살리는 것이 원문에 더 가깝습니다.
  doctrine_reference: 문맥 주해; 화자 태도 보존
