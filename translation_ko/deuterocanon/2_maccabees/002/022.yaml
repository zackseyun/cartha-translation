  rationale: 직역하면 매우 어색한 엘립시스이므로, 문맥상 제사에 사용된 준비물이라는 뜻을 드러내되 원문의 범위를 넘지 않도록 ‘제사에 쓰이던 것들’로 옮겼습니다.
- source_word: ἐκέλευσεν
