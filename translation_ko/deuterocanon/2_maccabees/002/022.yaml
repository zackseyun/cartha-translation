  text: 그리고 제사에 쓰이던 것들이 다 소진되자, 느헤미야는 남은 물을 더 큰 돌들 위에 붓게 하라고 명령했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어의 τὰ τῆς θυσίας는 문자적으로는 ‘제사의 것들’이지만, 문맥상 제사에 쓰인 준비물이나 재료를 가리키는 엘립시스로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 이곳의 그리스어는 연결이 다소 압축되어 있어, 번역은 보이는 문구를 바탕으로 과도하게 다듬지 않았습니다.
    reason: textual_variant
lexical_decisions:
- source_word: καθὼς δὲ ἀνηλώθη
