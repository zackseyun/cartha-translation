  lexicon: LSJ
  rationale: 비교급 μείζονας는 단순한 ‘큰’보다 비교 의미가 살아 있는 ‘더 큰’이 적합하며, 영어 POB의 비교 뉘앙스를 따라 자연스럽게 옮겼습니다.
