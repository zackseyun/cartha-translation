translation:
  language: ko
  text: 각각의 일을 세세히 다루는 일은 저자에게 맡기고, 우리는 이 축약본의 개요를 따라 나아가는 데 힘쓰고 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘각 항목을 정확히 조사하는 일 … 축약본의 밑그림을 따라 나아가는 일.’ 그리스어는 완전한 저작과 그 축약본의 차이를 나타내는 문학 용어를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ μὲν διακριβοῦν
  english_pob_choice: the detailed treatment
  chosen_korean: 자세히 살피는 일
  alternatives_korean:
  - 정밀하게 살피는 일
  - 각 항목을 정확히 조사하는 일
  - 세세히 다루는 일
  lexicon: LSJ
  rationale: 동사적 추상명사로서 단순한 ‘조사’보다 문학적·서술적 책임을 가진 ‘자세히 살피는 일’이 더 자연스럽고, 본문의 문체 대비도 살립니다.
- source_word: τῷ συγγραφεῖ
  english_pob_choice: to the author
  chosen_korean: 저자에게
  alternatives_korean:
  - 작가에게
  - 기록자에게
  - 역사가에게
  lexicon: LSJ
  rationale: συγγραφεύς는 이 문맥에서 더 큰 저작의 작성자를 가리키므로, 현대 한국어에서 가장 직접적인 대응인 ‘저자’가 적절합니다.
- source_word: τοῖς ὑπογραμμοῖς τῆς ἐπιτομῆς
  english_pob_choice: the outlines of the epitome
  chosen_korean: 이 축약본의 개요
  alternatives_korean:
  - 이 축약본의 윤곽
  - 이 요약문의 윤곽선
  - 이 축약본의 밑그림
  lexicon: LSJ
  rationale: ὑπογραμμοί는 ‘윤곽/개요’의 비유적 표현이고, ἐπιτομή는 기술적 의미의 ‘축약본’이므로, 두 표현의 관계를 한국어에서 자연스럽게 살려 ‘축약본의 개요’로 옮겼습니다.
- source_word: σπουδάζοντες
  english_pob_choice: taking pains
  chosen_korean: 힘쓰고 있습니다
  alternatives_korean:
  - 애쓰고 있습니다
  - 부지런히 노력하고 있습니다
  - 정성을 다하고 있습니다
  lexicon: LSJ
  rationale: 현재 분사는 이 글의 서술적 태도를 나타내므로, 단순한 의지보다 꾸준한 노력의 뉘앙스를 담는 ‘힘쓰고 있습니다’가 합쇼체 문장에 가장 무난합니다.
