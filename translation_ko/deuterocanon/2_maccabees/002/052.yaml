  text: we have taken care that for those who wish to read there may be enjoyment, for those who are inclined to commit it to memory ease, and for all who encounter it benefit.
translation:
  language: ko
  text: 우리는 읽고자 하는 이들에게는 즐거움이, 기억해 두려는 이들에게는 쉬움이, 그리고 그것을 접하는 모든 이에게는 유익이 있도록 배려하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘접하는’은 ἐντυγχάνουσιν의 범위를 반영해, 단순히 책을 ‘읽는’ 경우만이 아니라 실제로 마주하는 모든 독자를 포함합니다.
    reason: source_note
lexical_decisions:
- source_word: ἐφροντίσαμεν
  english_pob_choice: we have taken care
  chosen_korean: 우리는 … 배려하였습니다
  alternatives_korean:
  - 우리는 … 주의하였습니다
  - 우리는 … 신경 썼습니다
  lexicon: φροντίζω
  rationale: 본문의 1인칭 복수 완료/과거적 의도는 단순 설명이 아니라 독자를 위한 의도적 배려를 나타내므로, 한국어에서는 ‘배려하다’가 그 목적성을 가장 자연스럽게 드러냅니다.
- source_word: τοῖς μὲν βουλομένοις ἀναγινώσκειν
  english_pob_choice: for those who wish to read
  chosen_korean: 읽고자 하는 이들에게는
  alternatives_korean:
  - 읽기를 원하는 이들에게는
  - 읽고 싶어 하는 이들에게는
  lexicon: βουλομένοις + ἀναγινώσκειν
  rationale: βουλομένοις는 단순한 선호보다 의지/희망을 담으므로, ‘읽고자 하는’이 원문의 의도성을 잘 살립니다.
- source_word: εὐχαγωγίαν
  english_pob_choice: enjoyment
  chosen_korean: 즐거움
  alternatives_korean:
  - 기쁨
  - 유쾌함
  lexicon: εὐχαγωγία
  rationale: 희귀어의 기본 의미를 과도하게 확장하지 않고, 독서에서의 긍정적 쾌감이라는 일반적 의미를 가장 무난하게 옮겼습니다.
- source_word: τοῖς δὲ φιλοφρονοῦσιν εἰς τὸ διαμνήμης ἀναλαβεῖν
  english_pob_choice: for those who are inclined to commit it to memory
  chosen_korean: 기억해 두려는 이들에게는
  alternatives_korean:
  - 암송하려는 이들에게는
  - 기억에 새기려는 이들에게는
  lexicon: φιλοφρονέω + διαμνήμη
  rationale: 문맥상 ‘호의적으로 마음을 두어 기억에 담다’는 뜻이므로, 기억의 유지 행위를 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: εὐκοπίαν
  english_pob_choice: ease
  chosen_korean: 쉬움
  alternatives_korean:
  - 용이함
  - 수월함
  lexicon: εὐκοπία
  rationale: 암송의 부담이 적다는 뜻을 현대 한국어에서 가장 간결하게 전달하는 낱말입니다.
- source_word: πᾶσιν δὲ τοῖς ἐντυγχάνουσιν
  english_pob_choice: and for all who encounter it
  chosen_korean: 그리고 그것을 접하는 모든 이에게는
  alternatives_korean:
  - 그리고 그것을 읽는 모든 이에게는
  - 그리고 그것을 만나 보는 모든 이에게는
  lexicon: ἐντυγχάνω
  rationale: ἐντυγχάνω는 단순 ‘읽다’보다 ‘우연히/실제로 접하다, 만나 보다’의 범위가 있으므로, 본문의 개방성을 살려 ‘접하다’로 옮겼습니다.
- source_word: ὠφέλειαν
  english_pob_choice: benefit
  chosen_korean: 유익
  alternatives_korean:
  - 도움
  - 유용함
  lexicon: ὠφέλεια
  rationale: 결과적 효용을 가리키는 표준적인 대응어로, 서문이 제시하는 독자적 유익을 간명하게 전달합니다.
