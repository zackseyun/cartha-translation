  verdict: revise
  source_fidelity: 본문은 ὁ σώσας와 ἀποδούς의 완료된 행위를 ‘구원하시고…주셨습니다’로 적절히 옮기며, ‘자기 백성 모두’, ‘그분의 기업’, ‘왕권’, ‘제사장직’, ‘성화’는 각각 원문의 총칭, 소유격, 그리고 열거된 추상·제도 명사를 대체로 충실히 보존합니다. 다만 ‘모두에게’가 열거 전체에 걸리는지 문장상 불분명하므로 원문의 결속을 더 분명히 할 수 있습니다. 또한 현 a 주석은 ἀποδούς의 중요한 ‘돌려주다/회복하다’ 가능성을 제시하지 못합니다.
  naturalness: 합쇼체와 현대 표준어로 자연스럽습니다. ‘자기 백성’도 문법상 가능하지만, 하나님을 선행사로 명료하게 하는 ‘자신의 백성’이 더 매끄럽습니다. ‘성화’는 신학 문맥에서 통용되지만 과정적 의미로만 고정하지 않도록 대안 주석을 유지하는 것이 좋습니다.
  terminology: ‘기업’은 κληρονομία의 성경적 용례에 적합하고, 소유격을 ‘그분의’로 남긴 것은 해석을 과도하게 덧붙이지 않습니다. βασίλειον의 ‘왕권’, ἱεράτευμα의 ‘제사장직’, ἁγιασμός의 ‘성화’도 가능한 대응입니다. 각주 a는 원어의 ἀποδίδωμι에 맞게 고쳐야 하며, b와 c는 해당 낱말에 직접 붙여야 합니다.
