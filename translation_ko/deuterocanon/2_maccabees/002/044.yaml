  to: 그러나 하나님께서는 자신의 온 백성을 구원하시고, 그분의 기업과 왕권[b]과 제사장직과 성화[c]를 모두에게 주셨습니다.[a]
  rationale: ‘자기’는 하나님을 명시적으로 가리키는 ‘자신의’로 다듬었습니다. 또한 ‘모두에게’를 주어진 네 항목의 뒤에 놓아, 원문의 여격 πᾶσιν이 열거된 선물들과 연결되는 구조를 한국어에서 자연스럽게 드러냈습니다. ἀποδούς의 회복 의미를 a 각주로 보존하고, 왕권 및 성화의 대안은 각각 해당 표현에 직접 연결했습니다. 본문은 원문의 ‘주다’라는 넓은 뜻을 유지하여 회복 의미를 본문에서 단정하지 않습니다.
