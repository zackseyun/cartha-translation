translation:
  language: ko
  text: 그러나 하나님께서는 자신의 온 백성을 구원하시고, 그분의 기업과 왕권[b]과 제사장직과 성화[c]를 모두에게 주셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주셨습니다’는 ‘돌려주셨습니다’ 또는 ‘회복시켜 주셨습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: τὸ βασίλειον은 ‘나라’, ‘왕국’ 또는 ‘왕의 통치’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: τὸν ἁγιασμόν은 ‘거룩함’, ‘성결’ 또는 ‘봉헌’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ σώσας τὸν πάντα λαὸν αὐτοῦ
  english_pob_choice: who saved all his people
  chosen_korean: 자기 백성 모두를 구원하시고
  alternatives_korean:
  - 그의 모든 백성을 구원하시고
  - 자기 온 백성을 구원하시고
  lexicon: BDAG
  rationale: aorist 분사로서 완료된 구원 행위를 나타내므로, 자연스러운 합쇼체 문장 안에서 현재·과거의 절충형보다 완료된 행위를 드러내는 표현을 택했습니다.
- source_word: τὴν κληρονομίαν αὐτοῦ
  english_pob_choice: his inheritance
  chosen_korean: 그분의 기업
  alternatives_korean:
  - 그의 상속
  - 그분의 유업
  lexicon: LSJ
  rationale: κληρονομία는 성경적 문맥에서 ‘기업’이 가장 안정적으로 원어의 covenantal/possessive 뉘앙스를 살리며, 단순한 재산 상속으로 좁히지 않습니다.
- source_word: τὸ βασίλειον
  english_pob_choice: the kingship
  chosen_korean: 왕권
  alternatives_korean:
  - 나라
  - 왕국
  - 왕의 통치
  lexicon: LSJ
  rationale: POB의 추상적 선택인 ‘kingship’을 한국어에서도 제도/권한의 의미가 드러나는 ‘왕권’으로 옮겨, 곧이어 나오는 제사장직과의 병렬을 유지했습니다.
- source_word: τὸ ἱεράτευμα
  english_pob_choice: the priesthood
  chosen_korean: 제사장직
  alternatives_korean:
  - 제사장권
  - 제사장직분
  lexicon: LSJ
  rationale: 기관 또는 직분을 가리키는 표준적 대응으로 ‘제사장직’을 사용해, 왕권과 대칭되는 직분적 의미를 살렸습니다.
- source_word: τὸν ἁγιασμόν
  english_pob_choice: the sanctification
  chosen_korean: 성화
  alternatives_korean:
  - 거룩하게 하심
  - 거룩함
  - 봉헌
  lexicon: BDAG
  rationale: POB의 ‘sanctification’을 문맥상 신학적 추상명사인 ‘성화’로 옮기되, 정결/봉헌의 뉘앙스보다 결과 상태와 과정 모두를 포괄하는 용어를 택했습니다.
theological_decisions:
- issue: τὴν κληρονομίαν αὐτοῦ의 소유격 지시 대상
  chosen_reading: ‘그분의 기업’으로 옮겨, 소유격 αὐτοῦ를 하나님께 직접 연결했습니다.
  alternative_readings:
  - ‘그들의 기업’처럼 백성을 가리키는 해석
  rationale: 그리스어 형태상 가장 직접적인 지시 대상은 θεός이며, 문맥상 하나님께서 자기 백성에게 주시는 covenantal gift라는 구조를 보존하는 것이 더 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: τὸν ἁγιασμόν의 신학적 색채
  chosen_reading: ‘성화’로 번역해 거룩하게 됨의 상태와 과정의 긴장을 함께 남겼습니다.
  alternative_readings:
  - 거룩함
  - 성결
  - 봉헌
  rationale: 열거 구조에서 왕권·제사장직과 병렬을 이루는 추상명사이므로, 단순한 도덕적 ‘거룩함’보다 신학적 용어인 ‘성화’가 원문의 무게를 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §§1, 6
