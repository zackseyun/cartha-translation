translation:
  language: ko
  text: 그러나 표현의 간결함[a]과 주제에 대한 정교한 전개를 피하는 것은, 축약본을 만드는 사람에게 허용되어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘번역하는 사람에게’로도 옮길 수 있습니다. 그러나 כאן의 문맥은 언어 번역보다 축약본 작성에 더 잘 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δὲ σύντομον τῆς λέξεως
  english_pob_choice: the pursuit of brevity in expression
  chosen_korean: 표현의 간결함
  alternatives_korean:
  - 간결한 표현
  - 짧은 표현
  - 간명한 말투
  lexicon: LSJ
  rationale: σύντομον은 여기서 문체적 간결성을 가리키므로 ‘간결함’이 가장 자연스럽고, λέξεως는 개별 단어보다 말의 방식이므로 ‘표현’으로 옮겼습니다.
- source_word: τὸ ἐξεργαστικὸν τῆς πραγματίας
  english_pob_choice: an elaborate treatment of the subject
  chosen_korean: 주제에 대한 정교한 전개
  alternatives_korean:
  - 주제에 대한 세밀한 처리
  - 사안에 대한 자세한 전개
  - 주제의 상세한 논의
  lexicon: LSJ
  rationale: ἐξεργαστικόν은 ‘다듬어 완성한, 세밀하게 전개한’ 뉘앙스를 가지므로, 단순한 장황함이 아니라 내용의 정교한 풀어냄을 드러내기 위해 ‘정교한 전개’로 번역했습니다.
- source_word: τῷ τὴν μετάφρασιν ποιουμένῳ
  english_pob_choice: to one who is making an abridgment
  chosen_korean: 축약본을 만드는 사람에게
  alternatives_korean:
  - 요약본을 만드는 사람에게
  - 에피톰을 만드는 사람에게
  - 번역하는 사람에게
  lexicon: LSJ
  rationale: 이 문맥에서 μετάφρασις는 언어 간 번역보다 원문을 줄여 다시 엮는 축약/에피톰의 의미가 더 강하므로, 독자에게 오해를 주지 않도록 ‘축약본을 만드는 사람’으로 옮겼습니다.
- source_word: συγχωρητέον
  english_pob_choice: should be allowed
  chosen_korean: 허용되어야 합니다
  alternatives_korean:
  - 허락되어야 합니다
  - 인정되어야 합니다
  - 양해되어야 합니다
  lexicon: LSJ
  rationale: συγχωρητέον은 비인칭적으로 ‘허용/승인되어야 함’을 뜻하므로, 현대 한국어의 공문체에 가까운 ‘허용되어야 합니다’가 가장 정확합니다.
theological_decisions:
- issue: μετάφρασις의 의미 범위
  chosen_reading: 언어 번역보다 축약·요약 작업으로 이해했습니다.
  alternative_readings:
  - 번역
  - 옮김
  rationale: 2마카비서 서문 전체가 야손의 긴 저술을 짧게 정리하는 성격을 보이므로, εδώ의 μετάφρασις는 일반적인 언어 번역이 아니라 축약본 작성의 맥락으로 읽는 것이 문맥에 맞습니다.
  doctrine_reference: '번역 원칙: 원문 문맥 우선, 전통적 번역어가 문맥을 흐리면 피함.'
