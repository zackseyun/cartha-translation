translation:
  language: ko
  text: 우리 조상들이 페르시아로 끌려가던 때에, 경건한 제사장들은 제단의 불을 조금 몰래 가져다가 물 없는 우물의 움푹한 곳에 숨겼으며, 그곳을 안전하게 해 두어 아무도 그 장소를 알지 못하게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘물 없는 우물’은 그리스어의 ‘움푹한 곳’(κοιλώματι)과 ‘물 없는’(ἀνύδρου) 및 ‘우물/구덩이’(φρέατος)를 압축한 표현입니다.
    reason: source_note
