  yaml_path: translation/deuterocanon/2_maccabees/002/010.yaml
  text: For when our fathers were being led away into Persia[a], the devout priests secretly took some of the fire from the altar and hid it in the hollow of a dry well, where they secured it so that the place would be unknown to everyone.
  footnotes:
  - marker: a
    text: Or 'in the cavity of a dry well.' The Greek description of the place is compressed and somewhat awkward, combining terms for a hollow/cavity and a waterless well or pit.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리 조상들이 페르시아로 끌려가던 때에, 경건한 제사장들은 제단의 불 일부를 몰래 가져다가 물 없는 우물의 움푹한 곳에 숨겼으며, 그곳을 안전하게 지켜 두어 아무도 그 장소를 알지 못하게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘물 없는 우물’은 그리스어의 ‘움푹한 곳’(κοιλώματι)과 ‘물 없는’(ἀνύδρου) 및 ‘우물/구덩이’(φρέατος)를 압축한 표현입니다.
    reason: source_note
