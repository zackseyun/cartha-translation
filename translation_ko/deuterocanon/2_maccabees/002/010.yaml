theological_decisions:
- issue: 성전 불의 보존 행위에 대한 의미 부여
  chosen_reading: 본문은 경건한 제사장들이 제단의 불을 은밀히 보존했다는 사실을 말할 뿐, 그 행위의 신학적 해석은 직접 설명하지 않습니다.
  alternative_readings:
