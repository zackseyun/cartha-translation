  rationale: 본문이 스스로 말하는 범위를 넘지 않도록, 서술의 사실성과 긴장을 유지했습니다.
  doctrine_reference: 본문 내 해석을 과잉확정하지 않음
- issue: ἀνύδρου와 φρέατος의 압축된 지형 표현
  chosen_reading: ‘물 없는 우물’로 옮겨, 장소의 기묘한 압축성을 한국어에서도 드러냈습니다.
