base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/009.yaml
  text: Since we are about to celebrate the purification of the temple on the twenty-fifth of Chislev[a], we thought it necessary to make this clear to you, so that you also may celebrate the festival of booths and of the fire, when Nehemiah, who built the temple and the altar[c][b], offered sacrifices.
  footnotes:
  - marker: a
    text: Or 'the Feast of Booths'; traditionally, 'Tabernacles.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'and of the fire' is terse in Greek and likely refers to the commemorative observance connected with Nehemiah's offering and the fire story recounted in the following context.
    reason: cultural_note
  - marker: c
    text: Greek 'built'; some readers may understand 'rebuilt' from the historical setting, but the source text itself does not state the prefix explicitly.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리가 키슬레우월 스물다섯째 날에 성전의 정결을 거행하려 하므로, 이것을 여러분에게 분명히 알리는 것이 필요하다고 여겼습니다. 이는 여러분도 초막절[a]과, 성전과 제단을 세운[b] 느헤미야가 제물을 드렸을 때의 불의 절기[c]를 지키시도록 하려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘초막절’; 전통적으로는 ‘장막절’이라고도 합니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어는 ‘세운’이라고만 하며, 역사적 상황상 ‘다시 세운’으로 이해할 수 있지만 본문 자체에는 그 접두가 없습니다.
    reason: lexical_alternative
  - marker: c
    text: 그리스어의 ‘불의 [절기]’는 간명하고 압축된 표현입니다. 뒤따르는 문맥에 나오는 느헤미야의 제사와 불 이야기와 관련된 기념 행사를 가리킬 가능성이 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: Μέλλοντες ἄγειν
  english_pob_choice: we are about to celebrate
  chosen_korean: 거행하려고 하므로
  alternatives_korean:
  - 기념하려 하므로
  - 지키려고 하므로
  lexicon: LSJ
  rationale: μέλλω는 임박성을, ἄγω는 절기 행사의 ‘거행/지킴’을 나타내므로, 합쇼체에서 자연스럽게 다듬되 임박한 의도를 보존했습니다.
- source_word: ἐν τῷ Χασελεὺ πέμπτῃ καὶ εἰκάδι
  english_pob_choice: on the twenty-fifth of Chislev
  chosen_korean: 하셀레우스월 스물다섯째 날
  alternatives_korean:
  - 키슬레우스월 스물다섯째 날
  - 하셀레우스월 25일
  lexicon: LSJ
  rationale: 달 이름 Χασελεύ를 음역하고, 날짜는 한국어 관용에 맞게 ‘스물다섯째 날’로 옮겼습니다.
- source_word: τὸν καθαρισμὸν τοῦ ἱεροῦ
  english_pob_choice: the purification of the temple
  chosen_korean: 성전의 정결
  alternatives_korean:
  - 성전의 정결 의식
  - 성전의 깨끗하게 함
  lexicon: LSJ
  rationale: καθαρισμός의 핵심은 ‘정결/정화’이며, ἱερόν은 여기서 성전 자체를 가리키므로 간결하게 ‘성전의 정결’로 옮겼습니다.
- source_word: σκηνοπηγίας καὶ τοῦ πυρός
  english_pob_choice: the festival of booths and of the fire
  chosen_korean: 초막절과 불의 절기
  alternatives_korean:
  - 초막절과 불의 축제
  - 장막절과 불의 절기
  lexicon: LSJ
  rationale: σκηνοπηγία는 유대 절기명으로 널리 알려진 ‘초막절’이 가장 자연스럽고, καὶ τοῦ πυρός는 본문의 압축성을 살려 ‘불의 절기’로 유지했습니다.
- source_word: ὁ οἰκοδομήσας τό τε ἱερὸν καὶ τὸ θυσιαστήριον
  english_pob_choice: who built the temple and the altar
  chosen_korean: 그가 성전과 제단을 세운 사람입니다
  alternatives_korean:
  - 그가 성전과 제단을 지은 사람입니다
  - 그가 성전과 제단을 건축한 사람입니다
  lexicon: LSJ
  rationale: οἰκοδομέω의 기본 의미는 ‘세우다/짓다’이므로, 역사적 추정을 덧붙이지 않고 본문대로 ‘세운’으로 옮겼습니다.
- source_word: ἀνήνεγκεν θυσίας
  english_pob_choice: offered sacrifices
  chosen_korean: 제물을 드렸습니다
  alternatives_korean:
  - 희생제를 드렸습니다
  - 희생제물을 바쳤습니다
  lexicon: LSJ
  rationale: 제의적 문맥의 ἀναφέρω를 한국어 성경에서 자연스러운 ‘제물을 드리다’로 옮겨, 의미를 분명히 하면서도 과도하게 풀이하지 않았습니다.
theological_decisions:
- issue: σκηνοπηγίας의 절기명 처리
  chosen_reading: ‘초막절’로 옮기되 본문에 추가 설명을 붙이지 않았습니다.
  alternative_readings:
  - ‘초막절(장막절)’
  - ‘초막절의 절기’
  rationale: 본문은 이미 유대 절기명을 언급하므로, 전통 용어를 본문에 과하게 중첩하지 않고 널리 알려진 명칭을 채택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 2
- issue: καὶ τοῦ πυρός의 압축성 보존
  chosen_reading: ‘불의 절기’로 옮겨 본문의 간결한 병렬성을 유지했습니다.
  alternative_readings:
  - ‘불에 관한 절기’
  - ‘불의 축제’
  rationale: 그리스어가 간명하고 다소 압축적이므로, 해설을 본문에 끌어들이지 않고 독자가 후행 문맥과 연결해 읽도록 남겼습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 3
