  lexicon: LSJ
  rationale: 전환·추론의 연결사와 시작 지점을 함께 살려, 앞부분에서 본문 서술로 넘어가는 흐름을 자연스럽게 표현했습니다.
- source_word: τῆς διηγήσεως / ἱστορίαν
  english_pob_choice: the narrative / the history
  chosen_korean: 이야기 / 역사
  alternatives_korean:
