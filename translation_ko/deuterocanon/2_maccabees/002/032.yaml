  text: So then[a], let us begin the narrative from this point, adding only this much to what has been said before; for it is foolish to be excessive before the history and to abridge the history itself.
  footnotes:
  - marker: a
    text: Or 'the account' for 'the history' in both occurrences of ἱστορία/ἱστορίαν; the Greek can denote an inquiry or historical narrative more broadly, not only 'history' in the modern academic sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이제 이 지점에서 이야기를 시작하겠습니다. 앞서 말한 것에 이만큼만 덧붙이겠습니다. 왜냐하면 역사 앞에서 지나치게 길게 늘어놓는 것도 어리석고, 역사 자체를 잘라 줄이는 것도 어리석기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘역사’는 여기서 현대 학문 용어만이 아니라, 본문이 말하는 역사적 서술 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐντεῦθεν οὖν
  english_pob_choice: So then, from this point
  chosen_korean: 그러므로 이제 이 지점에서
  alternatives_korean:
