  - 기록 / 역사
  lexicon: LSJ
  rationale: διήγησις는 서술 행위를, ἱστορία는 본문의 역사적 서술 자체를 가리키므로, 앞은 유려하게 ‘이야기’로, 뒤는 원문의 ‘역사’를 살렸습니다.
- source_word: τοῖς προειρημένοις τοσοῦτον ἐπιζεύξαντες
  english_pob_choice: adding only this much to what has been said before
  chosen_korean: 앞서 말한 것에 이만큼만 덧붙이겠습니다
  alternatives_korean:
  - 앞서 말한 것에 이만큼만 더하겠습니다
  - 앞서 한 말에 이것만 보태겠습니다
  lexicon: LSJ
  rationale: ‘덧붙이다’는 ἐπιζεύγειν의 추가·접속 의미를 잘 살리며, τοσοῦτον의 제한성을 ‘이만큼만’으로 반영했습니다.
