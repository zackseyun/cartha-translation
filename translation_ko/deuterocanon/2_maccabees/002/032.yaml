  - 순진하고
  lexicon: LSJ
  rationale: 문학적 방법에 대한 판단으로서 부정적 평가를 분명하게 전달하되, 한국어에서 과도하게 속된 뉘앙스는 피했습니다.
theological_decisions:
- issue: 저자의 서문적 자기제한을 어떻게 옮길 것인가
  chosen_reading: 본문 앞의 과잉 설명도, 본문 자체를 잘라 줄이는 것도 같은 차원의 어리석음으로 병치했습니다.
  alternative_readings:
  - 본문 앞에서 너무 길게 말하는 것도 좋지 않습니다
  - 역사를 축약하는 것도 나쁩니다
  rationale: 그리스어의 대조 구조(πρὸ τῆς ἱστορίας / τὴν δὲ ἱστορίαν ἐπιτέμνειν)를 그대로 살려, 서문과 본문 모두에 대한 저자의 균형 감각을 드러냈습니다.
  doctrine_reference: 성경 서술의 충실성, 문학적 절제
- issue: ἱστορία를 ‘역사’로 둘지 ‘기록/계정’으로 둘지
  chosen_reading: 두 번 모두 ‘역사’로 옮겨 원문의 반복과 대비를 유지했습니다.
  alternative_readings:
  - 기록
  - 서술
  rationale: 영어 POB도 첫 항목을 ‘history’로 두어 저자의 문체적 대조를 보존하고 있으므로, 한국어도 같은 반복을 살려 문장 내부의 리듬과 대비를 유지하는 편이 낫습니다.
  doctrine_reference: 본문 충실성
