  alternative_readings:
  - ‘제사를 정결하게 했습니다’
  - ‘제물들을 깨끗하게 했습니다’
  rationale: 그리스어는 제물과 제의 행위 사이의 관계를 상세히 규정하지 않으므로, 한국어도 문맥의 제의성을 살리되 해석을 과도하게 좁히지 않았습니다.
