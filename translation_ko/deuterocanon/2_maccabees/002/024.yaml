  text: But when the matter became known[a], and it was reported to the king of the Persians that in the place where the priests who had been taken away had hidden the fire, water appeared, from which also those with Nehemiah purified the sacrifices[c][b],
  footnotes:
  - marker: a
    text: Or 'the exiled priests' for 'the priests who had been taken away.' The Greek participle indicates priests removed from their place, likely in exile.
    reason: lexical_alternative
  - marker: b
    text: Literally 'those around Nehemiah,' that is, Nehemiah and his associates.
    reason: lexical_alternative
  - marker: c
    text: The Greek says 'from which also those around Nehemiah purified the sacrifices'; the phrase may indicate either source ('from which') or instrument more idiomatically ('with which').
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 이 일이 알려지게 되었고, 페르시아 왕에게도 보고되었는데, 곧 제사장들이 옮겨져 온 사람들이 불을 숨겼던 그곳에서 물이 나타났다는 것이었습니다. 그 물로 말미암아 느헤미야와 함께한 이들이 제물들을 정결하게 했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘옮겨져 온’은 원문의 μεταχθέντες가 단순한 이동이 아니라 강제적 이송의 뉘앙스를 가질 수 있음을 반영한 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘느헤미야와 함께한 이들’은 직역하면 ‘느헤미야 주변의 사람들’에 해당하는 관용구입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그 물로 말미암아’는 원문의 ἀφʼ οὗ를 한국어에서 더 자연스럽게 풀어 옮긴 표현입니다.
    reason: lexical_alternative
