translation:
  language: ko
  text: 안티오코스와 그와 함께한 친구들이 그녀와 함께 그 장소로 가고 있었는데, 그들은 점검이라는 명목으로 돈을 더 많이 확보하려고 그를 그곳으로 데려가고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 이 절에서 통사 관계와 대명사 지시가 난해하며, 전승 본문에는 대상 관계가 확실하지 않은 부분이 있습니다.
    reason: textual_variant
  - marker: b
    text: 직역하면 ‘점검의 명목으로 더 많은 돈을 차지하려고’의 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνοικῶν αὐτῇ
  english_pob_choice: were accompanying her
  chosen_korean: 그녀와 함께 가고 있었는데
  alternatives_korean:
  - 그녀와 함께 살고 있었는데
  - 그녀와 동행하고 있었는데
  lexicon: LSJ
  rationale: 문맥상 함께 이동하는 흐름이 핵심이므로, 직역적 ‘살고 있었다’보다 자연스러운 동행 의미를 살렸습니다.
- source_word: παρῆγεν εἰς τὸν τόπον
  english_pob_choice: were bringing him there to the place
  chosen_korean: 그를 그곳으로 데려가고 있었습니다
  alternatives_korean:
  - 그를 그 장소로 이끌고 있었습니다
  - 그를 그 장소로 데리고 가고 있었습니다
  lexicon: LSJ
  rationale: παράγω는 여기서 ‘데려가다/이끌다’의 이동 동사로 읽히며, 한국어에서는 중립적인 ‘데려가다’가 가장 안정적입니다.
- source_word: κύριον τὸ λαβεῖν
  english_pob_choice: to get control of
  chosen_korean: 확보하려고
  alternatives_korean:
  - 장악하려고
  - 차지하려고
  lexicon: LSJ
  rationale: 구문은 단순히 ‘받다’가 아니라 무엇인가를 지배·통제하는 뜻이므로, 한국어에서는 ‘확보하다’로 그 힘을 살렸습니다.
- source_word: εἰς ἐφορῆς λόγον
  english_pob_choice: under the pretext of inspection
  chosen_korean: 점검이라는 명목으로
  alternatives_korean:
  - 검열이라는 구실로
  - 감찰이라는 명목으로
  lexicon: LSJ
  rationale: ἐφορῆς는 감독·점검의 성격을 가지며, λόγος는 ‘명목/구실’의 의미를 띠므로, 자연스러운 현대 한국어 관용으로 옮겼습니다.
theological_decisions:
- issue: 전승 본문의 인칭·지시 대상이 불안정함
  chosen_reading: 본문에 보존된 대로 ‘그녀’와 ‘그’를 모두 살려, 지시 관계를 매끄럽게 정리하지 않았습니다.
  alternative_readings:
  - 문맥에 따라 대상을 하나로 정리해 번역함
  - 성별 대명사를 중화해 번역함
  rationale: 그리스어 전승본은 통사와 지시가 난해하므로, 불확실성을 한국어 번역에서 지워 버리지 않고 드러내는 것이 더 충실합니다.
  doctrine_reference: 'POB 번역 원칙: 전승 본문의 난점을 보존하고, 불확실한 해석을 과도하게 평탄화하지 않음'
