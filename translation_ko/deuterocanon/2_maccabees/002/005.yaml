translation:
  language: ko
  text: 안티오코스와 그와 함께한 친구들이 그녀와 동행하여 그 장소로 가고 있었는데,[a] 그들은 점검이라는 명목으로 더 많은 돈을 차지하려고 그를 그곳으로 데려가고 있었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 이 절에서 통사 관계와 대명사 지시가 난해하며, 전승 본문에는 주어·목적어 및 대명사의 지시 대상이 확실하지 않은 부분이 있습니다.
    reason: textual_variant
  - marker: b
    text: 직역하면 ‘점검의 명목으로 더 많은 돈을 차지하려고’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνοικῶν αὐτῇ
  english_pob_choice: were accompanying her
  chosen_korean: 그녀와 함께 가고 있었는데
  alternatives_korean:
