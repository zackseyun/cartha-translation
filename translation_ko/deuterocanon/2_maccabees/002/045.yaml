revisions:
- from: 마치 그가 율법을 통해 약속하신 것과 같습니다. 우리는 하나님께 소망을 두고 있으니, 그분이 곧 우리에게 자비를 베푸시고 하늘 아래에 있는 곳에서 우리를 거룩한 곳으로 모으실 것입니다[a][b]. 그분은 큰 재난들에서 우리를 구해 내셨고, 그곳을 깨끗하게 하셨기 때문입니다[c].
  to: 이는 그가 율법을 통하여 약속하신 대로입니다. 우리는 하나님께 소망을 두고 있으니, 그분께서 곧 우리에게 자비를 베푸시고 하늘 아래에서[a] 우리를 거룩한 곳으로[b] 모으실 것입니다. 그분께서는 큰 재난들[c]에서 우리를 구해 내셨고 그곳을 정결하게 하셨기 때문입니다.
  rationale: 첫 절을 한국어에서 자연스러운 문장으로 바로잡되, 원문의 앞 문맥 의존성을 ‘이는’으로만 최소한 보완했습니다. 장소 표현은 원문의 모호성과 관용성을 유지했고, 정결 어휘와 각주 앵커를 원문 및 각주 대상에 맞게 조정했습니다.
