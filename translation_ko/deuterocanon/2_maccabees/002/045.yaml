  - severity: medium
    issue: 각주 앵커 위치
    rationale: a는 ‘하늘 아래’의 대안을 설명하지만 현재 ‘거룩한 곳’ 뒤에 있고, b도 해당 표현 바로 뒤에 있지 않습니다. c는 ‘큰 재난들’의 어휘 대안이므로 그 명사구 뒤에 두어야 합니다.
  - severity: low
    issue: ‘그곳을 깨끗하게 하셨기 때문입니다’
    rationale: καθαρίζω는 이 문맥에서 의례적 정결·정화의 의미를 포함합니다. ‘정결하게 하셨습니다’가 더 정확하고 자연스럽습니다.
