base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/045.yaml
  text: just as he promised through the law[a]. For we hope in God that he will soon have mercy on us and gather us from under heaven into the holy place[c][b]; for he rescued us from great evils and cleansed the place.
  footnotes:
  - marker: a
    text: Or 'from everywhere under heaven,' that is, from the places of dispersion.
    reason: lexical_alternative
  - marker: b
    text: That is, the sacred site in Jerusalem; contextually this refers to the temple area.
    reason: cultural_note
  - marker: c
    text: Or 'from great calamities' or 'from great troubles.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 그가 율법을 통하여 약속하신 대로입니다. 우리는 하나님께 소망을 두고 있으니, 그분께서 곧 우리에게 자비를 베푸시고 하늘 아래에서[a] 우리를 거룩한 곳으로[b] 모으실 것입니다. 그분께서는 큰 재난들[c]에서 우리를 구해 내셨고 그곳을 정결하게 하셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘 아래 전역에서’, 곧 흩어져 있는 지역들에서라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 예루살렘의 성스러운 장소를 가리키며, 문맥상 성전 구역을 뜻합니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘큰 재앙들에서’ 또는 ‘큰 환난들에서’.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς ἐπηγγείλατο
  english_pob_choice: just as he promised
  chosen_korean: 마치 그가 약속하신 것과 같습니다
  alternatives_korean:
  - 그가 약속하신 대로
  - 그가 약속하신 것처럼
  lexicon: BDAG
  rationale: καθὼς의 비교·일치 관계를 살려 ‘~과 같습니다’로 옮기고, ἐπηγγείλατο는 단순히 ‘약속하다’로 풀어 자연스러운 합쇼체 문장을 만들었습니다.
- source_word: διὰ τοῦ νόμου
  english_pob_choice: through the law
  chosen_korean: 율법을 통해
  alternatives_korean:
  - 율법으로
  - 율법을 통하여
  lexicon: BDAG
  rationale: διά + 속격의 수단성을 반영해 ‘통해’로 옮겼고, νόμος는 이 문맥에서 토라/율법이 적절하므로 ‘율법’을 유지했습니다.
- source_word: ἐπισυνάξει ἐκ τῆς ὑπὸ τὸν οὐρανὸν
  english_pob_choice: gather us from under heaven
  chosen_korean: 하늘 아래에 있는 곳에서 우리를 모으실 것입니다
  alternatives_korean:
  - 하늘 아래에서 우리를 모으실 것입니다
  - 온 땅에서 우리를 모으실 것입니다
  lexicon: BDAG
  rationale: 직역하면 ‘하늘 아래에서’이지만, 한국어에서는 ‘하늘 아래에 있는 곳들’의 분산된 지역이라는 뜻이 더 분명히 드러나도록 최소한으로 풀었습니다.
- source_word: τὸν ἅγιον τόπον / τὸν τόπον
  english_pob_choice: the holy place / the place
  chosen_korean: 거룩한 곳 / 그곳
  alternatives_korean:
  - 성소
  - 성전
  - 거룩한 장소
  lexicon: BDAG
  rationale: τόπος를 본문 그대로 ‘곳’으로 유지해 장소 일반어를 살렸고, ἅγιος는 ‘거룩한’으로 옮겨 성스러운 의미를 드러냈습니다. 문맥상 예루살렘 성전이지만 본문 용어는 보존했습니다.
- source_word: ἐξείλατο
  english_pob_choice: rescued
  chosen_korean: 구해 내셨고
  alternatives_korean:
  - 구원하셨고
  - 건져 내셨고
  lexicon: BDAG
  rationale: ἐξαιρέω의 ‘위기에서 빼내다/구출하다’ 의미를 살려 ‘구해 내셨다’로 옮겼습니다.
- source_word: ἐκ μεγάλων κακῶν
  english_pob_choice: from great evils
  chosen_korean: 큰 재난들에서
  alternatives_korean:
  - 큰 악들에서
  - 큰 환난들에서
  - 큰 재앙들에서
  lexicon: BDAG
  rationale: κακά는 도덕적 악보다 심각한 고난·재난의 의미가 강하므로, 한국어에서는 오해를 줄이기 위해 ‘재난들’로 옮겼습니다.
- source_word: τὸν τόπον ἐκαθάρισεν
  english_pob_choice: cleansed the place
  chosen_korean: 그곳을 깨끗하게 하셨기 때문입니다
  alternatives_korean:
  - 그곳을 정결하게 하셨기 때문입니다
  - 그곳을 정화하셨기 때문입니다
  lexicon: BDAG
  rationale: καθαρίζω의 정결/정화 의미를 한국어에서 가장 직접적으로 전달하기 위해 ‘깨끗하게 하다’를 택했고, 반말이나 경어 혼선을 피하려 종결을 합쇼체로 맞췄습니다.
theological_decisions:
- issue: ‘하늘 아래에 있는 곳’의 범위
  chosen_reading: 본문의 장소 표현을 유지하되, 흩어져 있는 지역에서의 회집이라는 의미를 과도하게 확정하지 않았습니다.
  alternative_readings:
  - 온 세상에서
  - 흩어진 곳들에서
  - 세상 각지에서
  rationale: 영어 POB도 ‘from under heaven’의 상징적·관용적 표현을 보존하고 있으므로, 본문이 말하는 범위를 한국어 본문에서 임의로 넓히지 않았습니다.
  doctrine_reference: 원문 우선 원칙; 토파스/지리 표현의 보존
