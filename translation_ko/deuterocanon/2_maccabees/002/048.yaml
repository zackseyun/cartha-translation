translation:
  language: ko
  text: 그리고 하늘에서 나타난 현현들은, 유대교를 위하여[a] 용감하게 싸운 이들에게 임하셨습니다. 그리하여 그들은 비록 수가 적었지만, 온 땅을 약탈하고[b] 이방 무리[c]를 쫓아냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘의 현시들’, ‘하늘의 현현들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘약탈하다’는 전투에서 전리품을 취하는 뜻을 살린 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: 원문은 외부 집단을 가리키는 경멸적 표현을 사용합니다. 더 중립적으로는 ‘외국 무리’로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφανείας / τὰς ἐξ οὐρανοῦ γενομένας
  english_pob_choice: appearances from heaven that came
  chosen_korean: 하늘에서 나타난 현현들
  alternatives_korean:
  - 하늘에서 온 출현들
  - 하늘의 나타남들
  lexicon: LSJ
  rationale: ἐπιφανείας는 눈에 보이는 ‘나타남/현현’의 뜻이고, τὰς ἐξ οὐρανοῦ γενομένας는 그 기원이 하늘임을 덧붙입니다. ‘현현들’은 의미를 살리면서도 본문의 비범한 종교적 개입을 과도하게 해석하지 않습니다.
- source_word: τοῖς ... ἀνδραγαθήσασιν / φιλοτίμως
  english_pob_choice: to those who fought bravely with zeal
  chosen_korean: 용감하게 싸운 이들에게
  alternatives_korean:
  - 열심으로 싸운 이들에게
  - 용맹을 떨친 이들에게
  lexicon: LSJ
  rationale: ἀνδραγαθέω는 전투 맥락에서 ‘용감하게, 훌륭하게 행동하다’의 뜻이므로 ‘용감하게 싸운’으로 옮겼습니다. φιλοτίμως의 ‘열심/열의’는 한국어에서 앞뒤가 중첩되기 쉬워, 문맥상 이미 드러나는 결의의 뉘앙스를 본문 전체의 흐름에 맡겼습니다.
- source_word: ὑπὲρ τοῦ Ἰουδαισμοῦ
  english_pob_choice: for Judaism
  chosen_korean: 유대교를 위하여
  alternatives_korean:
  - 유대인의 삶의 방식을 위하여
  - 유대 전통을 위하여
  lexicon: LSJ
  rationale: Ἰουδαϊσμός는 여기서 유대인의 종교와 생활양식을 가리키므로, 가장 직접적인 대응인 ‘유대교’를 택했습니다. 역사 서술의 문맥을 살리기 위해 교리적 용어보다 문화·종교 정체성을 드러내는 표현을 사용했습니다.
- source_word: τὴν ὅλην χώραν / τὰ βάρβαρα πλήθη / διώκειν
  english_pob_choice: the whole country ... the barbarian hordes ... drove off
  chosen_korean: 온 땅을 약탈하고[b] 이방 무리[c]를 쫓아냈습니다
  alternatives_korean:
  - 온 지역을 약탈하고 이방 무리를 몰아냈습니다
  - 전 국토를 노략질하고 외국 무리를 쫓아냈습니다
  lexicon: LSJ
  rationale: χώρα는 전쟁·정치 문맥에서 ‘땅/지역/나라’ 범위를 가리키며, λεηλατεῖν은 전리품을 취하는 ‘약탈하다’가 직접적입니다. βάρβαρα πλήθη는 그리스어의 경멸적 외부인 표지를 보존하기 위해 ‘이방 무리’로 옮겼고, διώκειν은 결과적으로 적을 ‘쫓아내다’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: βάρβαρα πλήθη의 비하적 민족 표지 보존
  chosen_reading: ‘이방 무리’로 옮겨, 원문이 가진 외부 집단을 낮추는 어감을 완전히 중화하지 않았습니다.
  alternative_readings:
  - 외국 무리
  - 야만 무리
  rationale: 본문은 그리스어 화자의 민족·문화적 경계 설정을 그대로 드러내므로, 현대 한국어에서도 그 긴장을 남겨 두는 편이 소스 충실성에 더 부합합니다. 다만 ‘야만’은 지나치게 강한 도덕적 평가를 덧붙일 수 있어 피했습니다.
  doctrine_reference: 원문 수사와 역사 서술의 재현; 번역 전통보다 원어의 표현력 우선
