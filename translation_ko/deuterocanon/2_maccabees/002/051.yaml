theological_decisions:
- issue: 저자가 축약 작업의 이유를 제시하는 문장 구조
  chosen_reading: 본문은 역사 서술로 들어가려는 독자들이 느끼는 어려움과, 그 어려움을 낳는 자료의 많음을 동시에 제시하는 것으로 읽었습니다.
  alternative_readings:
  - ‘자료가 많기 때문’만을 원인으로 강조하는 읽기
  - ‘수효의 홍수’만을 수사적으로 독립된 이미지로 보는 읽기
  rationale: 그리스어 분사구와 대격구가 함께 작동하므로, 이유 진술과 묘사적 비유를 둘 다 유지하는 번역이 원문의 논지를 가장 잘 보존합니다.
  doctrine_reference: 편집 서문/서술 목적 문맥
