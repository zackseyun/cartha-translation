translation:
  language: ko
  text: 그러므로 수효의 홍수와, 자료가 많기 때문에 이 역사 이야기들 속으로 들어가고자 하는 이들에게 닥친 어려움을 보면서,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘수효의 홍수’는 엄청난 양을 가리키는 생생한 비유입니다.
    reason: lexical_alternative
  - marker: b
    text: 희귀한 동사는 ‘들어가다’뿐 아니라, 역사 서술 속에 관여하거나 그 흐름을 따라가다라는 뉘앙스도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνορῶντες
  english_pob_choice: seeing
  chosen_korean: 보면서
  alternatives_korean:
  - 살피면서
  - 보고 있으므로
  - 고려하면서
  lexicon: LSJ
  rationale: 원문 분사로 이유를 제시하므로, 자연스러운 현대 한국어의 선행 사유 표현인 ‘보면서’를 택해 ‘보아 인함’을 살렸습니다.
- source_word: τὸ χῦμα τῶν ἀριθμῶν
  english_pob_choice: the flood of numbers
  chosen_korean: 수효의 홍수
  alternatives_korean:
  - 숫자의 홍수
  - 수많음의 홍수
  - 수의 물결
  lexicon: LSJ
  rationale: χῦμα의 생생한 비유를 살리기 위해 ‘홍수’를 유지하고, ἀριθμῶν은 문자적 ‘numbers’보다 ‘수효’가 더 자연스럽고 대상의 다수를 잘 드러냅니다.
- source_word: εἰσκυκλεῖσθαι
  english_pob_choice: to enter into
  chosen_korean: 들어가고자 하는
  alternatives_korean:
  - 관여하고자 하는
  - 빠져들고자 하는
  - 들어맞추고자 하는
  lexicon: LSJ
  rationale: 희귀 동사의 ‘들어가다/들어오다’ 계열 의미를 살리되, 한국어에서는 ‘이야기들 속으로 들어가다’가 가장 직관적으로 원문의 비유적 진입을 전달합니다.
- source_word: διηγήμασιν
  english_pob_choice: the narratives
  chosen_korean: 이야기들
  alternatives_korean:
  - 서술들
  - 기록들
  - 서사들
  lexicon: LSJ
  rationale: 여기서는 역사적 서술 단위들을 가리키므로, 너무 학술적인 ‘서사’보다 일반 독자에게 자연스러운 ‘이야기들’이 문맥상 적절합니다.
- source_word: διὰ τὸ πλῆθος τῆς ὕλης
  english_pob_choice: because of the abundance of material
  chosen_korean: 자료가 많기 때문에
  alternatives_korean:
  - 주제가 너무 많기 때문에
  - 내용의 풍부함 때문에
  - 재료의 많음 때문에
  lexicon: LSJ
  rationale: ὕλη를 이 문맥의 ‘subject matter/material’로 보고, 현대 한국어에서 가장 명료한 ‘자료’로 옮겼습니다.
theological_decisions:
- issue: 저자가 축약 작업의 이유를 제시하는 문장 구조
  chosen_reading: 본문은 역사 서술로 들어가려는 독자들이 느끼는 어려움과, 그 어려움을 낳는 자료의 많음을 동시에 제시하는 것으로 읽었습니다.
  alternative_readings:
  - ‘자료가 많기 때문’만을 원인으로 강조하는 읽기
  - ‘수효의 홍수’만을 수사적으로 독립된 이미지로 보는 읽기
  rationale: 그리스어 분사구와 대격구가 함께 작동하므로, 이유 진술과 묘사적 비유를 둘 다 유지하는 번역이 원문의 논지를 가장 잘 보존합니다.
  doctrine_reference: 편집 서문/서술 목적 문맥
