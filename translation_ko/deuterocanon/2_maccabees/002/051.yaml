  text: 이는 수효가 홍수처럼 많고, 자료가 너무 많아서 역사 서술들에 파고들고자 하는 사람들이 겪는 어려움이 있음을 보았기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘수효가 홍수처럼 많고’는 원문의 ‘수효의 홍수’라는 생생한 비유를 자연스러운 한국어로 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘파고들고자 하는’으로 옮긴 희귀 동사는 ‘들어가다’ 외에도 역사 서술에 관여하거나 그 내용을 따라가며 헤쳐 나가다는 뉘앙스를 지닐 수 있습니다.
    reason: lexical_alternative
