lexical_decisions:
- source_word: ὡσαύτως
  english_pob_choice: Likewise
  chosen_korean: 이와 같이
  alternatives_korean:
  - 그와 같이
  - 마찬가지로
  lexicon: ὡσαύτως
  rationale: 앞 문맥과의 대응 관계를 자연스럽게 살리면서도 문어체로 매끄럽게 옮겼습니다.
- source_word: καὶ
  english_pob_choice: also
  chosen_korean: 도
  alternatives_korean:
  - 또한
  - 역시
  lexicon: καί
  rationale: 솔로몬이 앞선 예와 더불어 언급됨을 간결하게 드러내기 위해 조사형 ‘도’를 사용했습니다.
- source_word: ἤγαγεν
  english_pob_choice: kept
