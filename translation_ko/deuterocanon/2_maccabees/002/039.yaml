  alternatives_korean:
  - 보냈습니다
  - 행했습니다
  - 지켰습니다
  lexicon: ἄγω
  rationale: 영어 POB의 ‘kept’에 맞추되, 절기나 기간을 ‘지키다’로 옮기는 한국어 관용을 살려 의미를 분명하게 했습니다.
- source_word: τὰς ὀκτὼ ἡμέρας
  english_pob_choice: the eight days
  chosen_korean: 여덟 날
  alternatives_korean:
  - 여덟 날 동안
  - 여덟째 날들
  lexicon: ἡμέρα
  rationale: 원문의 기간 표현을 그대로 살려 ‘여덟 날’로 옮겼고, 시간 지속의 뜻은 동사 ‘지켰습니다’가 보완합니다.
- source_word: ὁ Σαλωμὼν
  english_pob_choice: Solomon
  chosen_korean: 솔로몬
  alternatives_korean:
