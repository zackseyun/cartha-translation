  lexicon: Σαλωμών
  rationale: 고유명사는 현대 한국어 성경에서 널리 쓰이는 표기를 따랐습니다.
theological_decisions:
- issue: 절기 준수 표현의 성격
  chosen_reading: ‘지켰습니다’로 옮겨, 단순한 시간 경과가 아니라 정해진 기간을 준수했다는 의미를 드러냈습니다.
  alternative_readings:
  - ‘보냈습니다’처럼 중립적으로 옮기는 방식
  - ‘행했습니다’처럼 일반적 수행으로 옮기는 방식
  rationale: 영어 POB의 ‘kept’는 단순 지속보다 준수·준행의 뉘앙스를 담으므로, 한국어에서도 그 의례적/준수적 의미를 드러내는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 절기 준수와 서술상의 행위 의미
