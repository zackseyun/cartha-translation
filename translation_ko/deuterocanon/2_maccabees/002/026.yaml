  text: And for us[a], who have undertaken the hardship of making the abridgment, the task is not easy, but a matter of sweat and sleeplessness;
  footnotes:
  - marker: a
    text: Greek ἐπιτομή can also be rendered 'epitome,' but 'abridgment' is used here because modern English 'epitome' usually no longer means a condensed written work.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 우리에게는, 이 축약을 위한 수고를 떠맡은 우리에게는, 그 일은 쉽지 않고 땀과 불면의 문제입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἱδρῶτος καὶ ἀγρυπνίας는 문자적으로 ‘땀과 불면’입니다.
    reason: source_note
lexical_decisions:
- source_word: καὶ ἡμῖν μὲν τοῖς
  english_pob_choice: And for us, who
  chosen_korean: 그리고 우리에게는, 이 축약을 위한 수고를 떠맡은 우리에게는
  alternatives_korean:
  - 그리고 우리에게는
  - 그리고 우리, 이
  lexicon: LSJ
  rationale: 여격과 관사-분사 구문은 화자 자신들을 지시하면서 그들이 맡은 일을 함께 묶습니다. 한국어에서는 두 번의 ‘우리에게는’로 강조를 살리되, 문장 흐름을 자연스럽게 만들었습니다.
- source_word: τὴν κακοπάθειαν
  english_pob_choice: the hardship
  chosen_korean: 수고
  alternatives_korean:
  - 고난
  - 고생
  - 어려움
  lexicon: LSJ
  rationale: 이 문맥은 박해가 아니라 편집 노동의 힘겨움을 말하므로, ‘수고’가 부담과 노력을 가장 자연스럽게 드러냅니다.
- source_word: τῆς ἐπιτομῆς
  english_pob_choice: of making the abridgment
  chosen_korean: 이 축약을 위한
  alternatives_korean:
  - 이 축약의
  - 축약을 만드는
  lexicon: LSJ
  rationale: ἐπιτομή는 ‘축약’ 또는 ‘요약본’이지만, 여기서는 산출 과정이 문제이므로 ‘이 축약을 위한’으로 작업의 성격을 살렸습니다.
- source_word: ἱδρῶτος δὲ καὶ ἀγρυπνίας
  english_pob_choice: a matter of sweat and sleeplessness
  chosen_korean: 땀과 불면의 문제입니다
  alternatives_korean:
  - 땀과 잠 못 이룸의 문제입니다
  - 땀과 밤샘의 일입니다
  lexicon: LSJ
  rationale: ‘땀’과 ‘불면’은 원문의 육체적·시간적 대가를 그대로 살리며, ‘문제입니다’는 τὸ πρᾶγμα의 압축된 명사구를 자연스럽게 옮깁니다.
theological_decisions:
- issue: 편집/번역 노동의 성격을 어떻게 드러낼지
  chosen_reading: 본문은 영감된 기록의 편찬 작업이 ‘쉽지 않다’는 실무적 진술로 읽고, 과장된 영적 고난으로 확장하지 않습니다.
  alternative_readings:
  - 문학적 겸손의 수사로만 축소하기
  - 종교적 박해의 표현으로 읽기
  rationale: 앞뒤 문맥상 저자는 축약본 제작의 어려움을 솔직히 말하고 있으므로, 의미를 과도하게 신학화하지 않는 것이 원문에 충실합니다.
  doctrine_reference: 문학적 서문/편집 서술의 직설성
