  rationale: 중복된 표현을 제거하고, 축약 작업을 맡은 이들의 고된 노동이라는 원문의 관계를 자연스럽게 드러냈습니다. 또한 ‘문제’를 ‘일’로 고쳐 πρᾶγμα의 문맥상 의미를 살리고, ‘땀과 밤샘’으로 ἱδρώς와 ἀγρυπνία의 생생한 노동 이미지를 보존했습니다. 본문에 필요한 불확실성이나 번역상 대안이 없으므로 각주는 두지 않았습니다.
