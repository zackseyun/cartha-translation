  - marker: b
    text: Or 'with all clemency' or 'with every kindness' for 'with all gentleness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 온 세상에 널리 알려진 성소를 되찾고, 도시를 자유롭게 하며, 없애 버리려던 율법을 바로잡게 하시려는 것이었습니다. 주께서 그들에게 온유와 인내로 자비를 베푸셨기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘온 세계’. 그리스어는 문자적으로 ‘거주된 세계’를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘모든 관대함으로’, ‘모든 친절함으로’.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβόητον
  english_pob_choice: renowned
  chosen_korean: 널리 알려진
  alternatives_korean:
  - 유명한
  - 널리 회자되는
  - 명성이 자자한
  lexicon: LSJ
  rationale: 성소의 널리 알려진 명성을 자연스러운 한국어로 옮기되, 과장된 현대적 홍보 뉘앙스는 피했습니다.
- source_word: οἰκουμένην
  english_pob_choice: the whole inhabited world
  chosen_korean: 온 세상
  alternatives_korean:
  - 온 세상의 거주 세계
  - 온 누리
  - 전 세계
  lexicon: LSJ
  rationale: 직역하면 ‘거주된 세계’이지만, 한국어 본문에서는 의미를 해치지 않으면서도 과도하게 현대적 지리 개념을 끌어오지 않는 ‘온 세상’이 가장 간결합니다.
- source_word: ἱερὸν
  english_pob_choice: sanctuary
  chosen_korean: 성소
  alternatives_korean:
  - 성전
  - 거룩한 곳
  lexicon: LSJ
  rationale: 예루살렘 성전 단지를 가리키는 신성한 장소라는 점을 드러내기 위해 ‘성소’를 택했습니다.
- source_word: τοὺς μέλλοντας καταλύεσθαι νόμους
  english_pob_choice: the laws that were about to be abolished
  chosen_korean: 없애 버리려던 율법
  alternatives_korean:
  - 폐지되려던 율법
  - 무너뜨리려던 율법
  - 없어질 뻔한 율법
  lexicon: LSJ
  rationale: μέλλοντας와 수동 부정사의 임박성을 살리면서, καταλύεσθαι의 ‘해체/폐지’ 의미를 한국어 동사구로 압축했습니다. ‘율법’은 종교·공동체 규범을 가리키는 기본 용례를 따랐습니다.
- source_word: μετὰ πάσης ἐπιεικείας
  english_pob_choice: with all gentleness
  chosen_korean: 온유와 인내로
  alternatives_korean:
  - 모든 온유로
  - 전적인 관대함으로
  - 온화함과 너그러움으로
  lexicon: LSJ
  rationale: ἐπιείκεια는 온유, 관대함, 관용, 인내의 뉘앙스를 함께 지니므로, 본문 문맥의 자비로운 하나님의 태도를 드러내는 ‘온유와 인내로’로 옮겼습니다.
theological_decisions:
- issue: 주어인 κύριος의 번역
  chosen_reading: ‘주’로 번역했습니다.
  alternative_readings:
  - ‘주님’
  - ‘주인’
  rationale: 하나님의 자비로운 행위를 가리키므로 기본값인 ‘주’를 따랐습니다. ‘주님’도 가능하지만, 본문 서술문에서는 간결한 ‘주’가 더 직접적입니다.
  doctrine_reference: DOCTRINE.md의 κύριος 기본 번역
