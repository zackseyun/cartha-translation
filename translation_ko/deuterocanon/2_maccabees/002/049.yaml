  - severity: medium
    issue: ἐπιείκεια를 ‘온유와 인내’로 확대함
    rationale: ἐπιείκεια는 여기서 관용, 너그러움, 온유 등의 단수 개념입니다. ‘인내’를 별도의 덕목으로 추가하지 않는 편이 안전합니다.
