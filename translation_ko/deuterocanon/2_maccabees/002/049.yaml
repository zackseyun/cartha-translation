  source_fidelity: 수정이 필요합니다. 초안의 ‘...바로잡게 하시려는 것이었습니다’는 그리스어의 부정사 연쇄(되찾고, 해방하고, 회복하고)를 ‘하려는 것’이라는 의도 표현으로 바꾸며, 명시되지 않은 주어 ‘하시려는’을 도입합니다. 또한 καταλύεσθαι의 수동적·임박한 뜻은 ‘없애 버리려던’보다 ‘폐지될 처지에 있던’이 더 충실합니다.
  naturalness: ‘도시를 자유롭게 하며’와 ‘온유와 인내로’는 각각 정치적 해방과 단수 명사 ἐπιείκεια의 뜻을 충분히 정확하게 드러내지 못합니다. ‘그 도시를 해방하고’, ‘온갖 관용으로’가 현대 한국어 합쇼체 서술의 문맥에서도 더 자연스럽고 정확합니다. 원문이 선행 문장에 이어지는 부정사구이므로, 한국어도 연결형으로 보존했습니다.
  terminology: ἱερόν은 ‘성소’, νόμοι는 집합적 의미의 ‘율법’, κύριος는 신적 지시를 따라 ‘주’로 유지합니다. ἐπιείκεια는 ‘관용’으로 옮기고, 다른 가능한 뉘앙스는 각주에 남깁니다.
  issues:
