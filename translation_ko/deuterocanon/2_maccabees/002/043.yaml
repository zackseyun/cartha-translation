  verdict: revise
  source_fidelity: 첫 구절의 ‘정결하게 하는 절기’는 τὸν καθαρισμόν(‘정결/정화’)에 ‘하게 하는’이라는 인과적 의미와 ‘절기’라는 명시를 더합니다. 문맥상 절기적 기념을 가리키지만, 본문에서는 이를 과도하게 풀지 않는 편이 원문에 더 가깝습니다. 또한 두 번의 ἄγειν은 같은 한국어 동사로 유지하는 것이 바람직합니다.
  naturalness: ‘정결을 지키다’와 ‘그 날들을 지키다’는 종교·절기 문맥에서 자연스럽습니다. ‘그 날들을 지키는 것이 좋겠습니다’도 이해되지만, καλῶς ποιήσετε의 ‘잘할 것이다/잘하는 것이다’라는 관용적 권면의 뉘앙스는 ‘잘하실 것입니다’가 더 가깝습니다.
  terminology: ‘정결’은 καθαρισμός의 기본 의미를 보존하며, 특정 명칭이나 교리적 해석을 본문에 넣지 않습니다. ‘지키다’를 반복하여 ἄγειν의 반복을 드러냅니다.
  issues:
  - severity: medium
    issue: ‘정결하게 하는 절기’가 원문보다 해석적으로 확장됨
    rationale: καθαρισμός은 ‘정결/정화’이며, ‘정결하게 하는’은 원문에 없는 작용의 뜻을 더합니다. 절기 문맥은 각주에서 보충할 수 있으나 본문은 간결하게 유지하는 것이 안전합니다.
  - severity: low
    issue: καλῶς ποιήσετε의 관용적 권면 표현이 다소 약화됨
    rationale: ‘지키는 것이 좋겠습니다’는 무난하지만, ‘여러분이 … 하시면 잘하실 것입니다’가 미래형 καλῶς ποιήσετε와 더 직접적으로 대응합니다.
