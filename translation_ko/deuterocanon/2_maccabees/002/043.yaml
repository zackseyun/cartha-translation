base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/043.yaml
  text: Since we are about to celebrate the purification[a], we have written to you. Therefore you will do well to observe the days.
  footnotes:
  - marker: a
    text: Or 'keep the days' or 'celebrate the days.' The same Greek verb is used earlier in the verse for celebrating 'the purification.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 우리가 정결하게 하는 절기를 지키려고 하기에 여러분에게 편지를 썼습니다. 그러므로 여러분은 그 날들을 지키는 것이 좋겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 ἄγειν은 여기서 ‘지키다’, ‘기념하다’, ‘지내다’의 뜻으로 모두 읽힐 수 있으나, 본문은 같은 동사를 두 번 써 절기와 날들을 연결합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μέλλοντες οὖν ἄγειν
  english_pob_choice: Since we are about to celebrate
  chosen_korean: 우리가 … 지키려고 하기에
  alternatives_korean:
  - 우리가 …을/를 기념하려 하기에
  - 우리가 …을/를 지내려고 하기에
  lexicon: LSJ
  rationale: 미래지향적 분사구문을 한국어 원인절로 자연스럽게 옮겼고, ἄγειν의 절기 문맥을 살려 ‘지키다’로 표현했습니다.
- source_word: τὸν καθαρισμόν
  english_pob_choice: the purification
  chosen_korean: 정결하게 하는 절기
  alternatives_korean:
  - 정결
  - 정화
  - 정결의 절기
  lexicon: LSJ
  rationale: 직역하면 ‘정결’이지만, 문맥상 성전 정결을 기념하는 절기이므로 한국어에서는 의미가 드러나도록 ‘정결하게 하는 절기’로 옮겼습니다.
- source_word: ἐγράψαμεν ὑμῖν
  english_pob_choice: we have written to you
  chosen_korean: 여러분에게 편지를 썼습니다
  alternatives_korean:
  - 여러분에게 글을 보냈습니다
  - 여러분에게 써 보냈습니다
  lexicon: LSJ
  rationale: 서신체의 현재적 효력을 살리되 한국어에서는 자연스러운 완료 과거로 처리했습니다.
- source_word: καλῶς οὖν ποιήσετε ἄγειν τὰς ἡμέρας
  english_pob_choice: you will do well to observe the days
  chosen_korean: 여러분은 그 날들을 지키는 것이 좋겠습니다
  alternatives_korean:
  - 여러분은 그 날들을 잘 지키실 것입니다
  - 그 날들을 기념하시면 좋겠습니다
  lexicon: LSJ
  rationale: εὖ/καλῶς + ποιεῖν의 권면 관용구를 한국어의 공손한 권면으로 옮겼고, 반복되는 ἄγειν은 동일하게 ‘지키다’로 처리했습니다.
theological_decisions:
- issue: 절기 준수 표현의 강도
  chosen_reading: ‘그 날들을 지키는 것이 좋겠습니다’로 옮겨, 권면이지만 강한 예식적 권고임을 유지했습니다.
  alternative_readings:
  - 그 날들을 지키십시오
  - 그 날들을 기념하시기 바랍니다
  rationale: 본문은 단순한 제안보다 공동체에 대한 정중한 권고에 가깝기 때문에, 합쇼체를 유지하면서도 명령조보다 완만하게 처리했습니다.
  doctrine_reference: 공동체 절기 권면의 문맥 보존
