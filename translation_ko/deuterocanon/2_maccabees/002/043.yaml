  text: Since we are about to celebrate the purification[a], we have written to you. Therefore you will do well to observe the days.
  footnotes:
  - marker: a
    text: Or 'keep the days' or 'celebrate the days.' The same Greek verb is used earlier in the verse for celebrating 'the purification.'
