theological_decisions:
- issue: 구원과 감사의 인과 관계
  chosen_reading: ‘구원받았으므로’로 옮겨, 하나님의 구원이 먼저이고 그 결과로 큰 감사가 따른다는 구조를 드러냈습니다.
  alternative_readings:
  - 구원받았기에
  - 구원받았기에 우리는
  - 구원을 받았으므로
  rationale: 완료 수동 분사의 결과성을 한국어에서 자연스러운 원인-결과 연결로 표현해, 감사가 구원의 응답임을 보존했습니다.
  doctrine_reference: 하나님의 구원 행위와 응답으로서의 감사
- issue: 비유적 군사 이미지
  chosen_reading: 마지막 절을 실제 전쟁 선언이 아니라 왕을 상대로 전열을 갖춘 군사적 비유로 유지했습니다.
  alternative_readings:
  - 왕 앞에 배치된 것처럼
  - 왕과 싸우도록 진열된 것처럼
  - 왕에게 대항하여 전열을 이룬 것처럼
  rationale: 원문은 압축된 비교 구문이므로 의미를 완화하지 않고 전열/대항의 이미지를 보존하는 쪽이 본문에 더 가깝습니다.
  doctrine_reference: 원문 수사와 이미지 보존
