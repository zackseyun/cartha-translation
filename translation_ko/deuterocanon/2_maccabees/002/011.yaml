lexical_decisions:
- source_word: διελθόντων δὲ ἐτῶν ἱκανῶν
  english_pob_choice: after many years had passed
  chosen_korean: 많은 세월이 지난 뒤
  alternatives_korean:
  - 여러 해가 지난 뒤
  - 상당한 세월이 흐른 뒤
  lexicon: LSJ
  rationale: 시간의 경과를 나타내는 속격 절을 한국어의 자연스러운 시간 부사구로 옮겼습니다. ἱκανῶν은 단순한 ‘충분한’보다 ‘많은/상당한’의 의미가 강합니다.
- source_word: ὅτε ἔδοξεν τῷ θεῷ
  english_pob_choice: when it seemed good to God
  chosen_korean: 하나님께서 좋게 여기셨을 때
  alternatives_korean:
  - 하나님께서 보시기에 좋았을 때
  - 하나님께서 뜻하셨을 때
  lexicon: LSJ
  rationale: ἔδοξεν τῷ θεῷ의 관용적 의미를 살리되, 한국어에서 자연스럽고 직역에 가까운 표현으로 옮겼습니다.
- source_word: ἀποσταλεὶς Νεεμίας ἀπὸ τοῦ βασιλέως τῆς Περσίδος
  english_pob_choice: Nehemiah, having been sent by the king of Persia
  chosen_korean: 페르시아 왕에게서 파견된 느헤미야
  alternatives_korean:
  - 페르시아 왕에게서 보냄을 받은 느헤미야
  - 페르시아 왕의 파견을 받은 느헤미야
  lexicon: LSJ
  rationale: 수동 분사의 선행 행위를 압축해 한국어의 관형절로 처리했습니다. ἀπό + 인칭 주체는 여기서 ‘-에게서/에 의해’의 파견 출처로 이해했습니다.
- source_word: τοὺς ἐκγόνους τῶν ἱερέων
  english_pob_choice: the descendants of the priests
  chosen_korean: 제사장들의 후손들
  alternatives_korean:
  - 제사장들의 자손들
  - 제사장들의 자녀들
  lexicon: LSJ
  rationale: ἐκγόνοι는 직계 자녀보다 넓은 ‘후손/자손’을 뜻하므로, 문맥에 맞는 포괄적 표현을 택했습니다.
- source_word: ἔπεμψεν ἐπὶ τὸ πῦρ
  english_pob_choice: sent to get the fire
  chosen_korean: 그 불을 찾도록 보냈습니다
  alternatives_korean:
  - 그 불을 가져오게 보냈습니다
  - 그 불을 구하러 보냈습니다
  lexicon: LSJ
  rationale: πέμπω ἐπί + 대격의 목적/탐색 의미를 반영해, 단순 전송보다 ‘찾도록 보내다’로 옮겼습니다. 문맥상 대상은 앞서 언급된 성스러운 불입니다.
