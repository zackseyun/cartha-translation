  source_fidelity: 초안은 핵심 의미를 대체로 잘 전달하지만, ὡς δὲ의 시간적 연결(‘…알게 되자/알았을 때’)이 ‘그러나’만으로는 드러나지 않습니다. 또한 ‘다시’는 원문에 명시되지 않은 반복의 뜻을 보태므로 삭제하는 것이 안전합니다.
  naturalness: ‘그런데 예레미야가 이 일을 알게 되자’는 전환과 시간 관계를 자연스러운 현대 한국어로 나타냅니다. ‘알려지지 않은 채 있을 것입니다’는 미래의 지속 상태를 자연스럽게 전달합니다.
  terminology: ‘예레미야’, ‘하나님’, ‘자비를 베푸시다’는 표준어 합쇼체 문맥에서 적절합니다. 마지막 절은 그리스어에서 ‘자비’가 문법적 주어이나, 앞선 하나님의 행위와 연결하여 ‘자비를 베푸시다’로 옮긴 해석을 유지하되 각주에서 직역의 어색한 명사구와 비인칭 표현을 밝혔습니다.
