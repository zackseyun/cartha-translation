  yaml_path: translation/deuterocanon/2_maccabees/002/034.yaml
  text: But when Jeremiah learned of it[a], he reproved them and said, “The place will remain unknown until God gathers his people together and shows mercy.”
  footnotes:
  - marker: a
    text: Greek literally, 'until God gathers a gathering of the people, and mercy comes to be.' The English smooths this idiom to express the likely sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 예레미야가 이 일을 알게 되자, 그들을 꾸짖으며 말했습니다. “그 장소는 하나님께서 백성을 모으시고 자비를 베푸실 때까지 알려지지 않은 채 있을 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어를 직역하면, ‘하나님께서 백성의 모임을 모으시고 자비가 생기게 될 때까지’에 가깝습니다. 한국어에서는 이 어색한 표현을 자연스럽게 풀어 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  english_pob_choice: But when
  chosen_korean: 그러나 ...가 그것을 알고
  alternatives_korean:
  - 그리고 ...가 그것을 알고
  - 그때 ...가 그것을 알고
  lexicon: LSJ
  rationale: 서술 전환과 시간 전환을 함께 나타내기 위해 역접 '그러나'를 살리고, 자연스러운 한국어 어순으로 옮겼습니다.
- source_word: μεμψάμενος
  english_pob_choice: he reproved
  chosen_korean: 그들을 꾸짖으며
  alternatives_korean:
  - 그들을 책망하며
  - 그들을 질책하며
  lexicon: LSJ
  rationale: 행위자 예레미야가 그들을 향해 강하게 비판하는 뉘앙스를 살리기 위해 '꾸짖다'를 택했습니다.
- source_word: ἄγνωστος ὁ τόπος ἔσται
  english_pob_choice: The place will remain unknown
  chosen_korean: 그 장소는 알려지지 않을 것입니다
  alternatives_korean:
  - 그 장소는 숨겨질 것입니다
  - 그 장소는 알 수 없게 될 것입니다
  lexicon: LSJ
  rationale: '''unknown''의 직접적 의미를 살리되, 한국어에서 자연스러운 완료·지속 상태로 표현했습니다.'
- source_word: ἐπισυναγωγὴν τοῦ λαοῦ
  english_pob_choice: God gathers his people together
  chosen_korean: 하나님이 백성을 다시 모으시고
  alternatives_korean:
  - 하나님이 백성의 모임을 이루시고
  - 하나님이 백성을 모아 모으시고
  lexicon: LSJ
  rationale: 그리스어의 명사구를 한국어에서는 동사구로 풀어야 의미가 분명해지므로, 영어 POB의 해석을 따라 '다시 모으시고'로 옮겼습니다.
- source_word: ἔλεος γένηται
  english_pob_choice: shows mercy
  chosen_korean: 자비를 베푸실 때까지
  alternatives_korean:
  - 긍휼이 있게 될 때까지
  - 자비가 일어날 때까지
  lexicon: BDAG
  rationale: 문맥상 하나님이 주체이므로, 수동적인 '자비가 임하다'보다 능동적으로 '자비를 베푸시다'로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 문장의 마지막 절에서 하나님의 행위 주체를 드러낼지 여부
  chosen_reading: 그 장소는 하나님이 백성을 다시 모으시고 자비를 베푸실 때까지 알려지지 않을 것입니다.
  alternative_readings:
  - 그 장소는 하나님이 백성을 다시 모으실 때까지 알려지지 않을 것입니다.
  - 그 장소는 백성의 모임과 자비가 있을 때까지 알려지지 않을 것입니다.
  rationale: 그리스어는 '자비'를 문법적 주어로 두지만, 앞뒤 문맥상 하나님이 실제 행위 주체이므로 한국어에서는 그 주체성을 분명히 드러냈습니다.
  doctrine_reference: Translation philosophy §1, §6
