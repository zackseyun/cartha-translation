    text: 또는 ‘많은 이들의 감사함’ 또는 ‘많은 이들의 감사하는 마음’으로 옮길 수 있습니다. 여기서 εὐχαριστία는 후대의 예전 용어가 아니라 일반적인 감사의 뜻입니다.
    reason: lexical_alternative
