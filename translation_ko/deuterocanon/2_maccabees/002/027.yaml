  text: Just as it is not easy for one who prepares a banquet and seeks the advantage of others[a], yet for the gratitude of the many we will gladly endure the hardship;
  footnotes:
  - marker: a
    text: Or 'the thanks of the many.' The Greek εὐχαριστία here means gratitude or thanksgiving, not the later liturgical term 'Eucharist.'
    reason: lexical_alternative
translation:
  language: ko
  text: 마치 잔치를 준비하고 다른 이들의 이익을 구하는 사람에게도 그것이 쉽지 않은 것처럼, 그러나 많은 이들의 감사 때문에 우리는 기꺼이 그 고난을 견디겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '많은 이들의 감사'가 아니라 '많은 이들의 감사함/감사하는 마음'으로도 옮길 수 있습니다. 여기서 εὐχαριστία는 후대의 예전 용어가 아니라 일반적인 감사의 뜻입니다.
    reason: lexical_alternative
