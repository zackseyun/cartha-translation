  text: 마치 잔치를 준비하고 다른 이들의 유익을 구하는 일이 쉽지 않은 것처럼, 그럼에도 우리는 많은 이들의 감사 때문에 기꺼이 이 고난을 견디겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
