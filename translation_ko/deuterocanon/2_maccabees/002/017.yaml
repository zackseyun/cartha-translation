  lexicon: LSJ
  rationale: μερίδα의 기본 뜻인 ‘portion/share’를 직접 살려, 비유를 과도하게 풀지 않고 한국어에서 가장 직관적인 ‘몫’으로 옮겼습니다.
theological_decisions:
- issue: τὴν μερίδα σου의 비유 유지
  chosen_reading: ‘당신의 몫’으로 유지하여, 이스라엘을 하나님의 소유/배정된 몫이라는 비유를 본문에서 그대로 드러냅니다.
  alternative_readings:
  - 당신의 유업
  - 당신의 기업
  - 당신의 백성
  rationale: 그리스어는 비유를 해설하지 않고 남겨 둡니다. 본문이 이미 이스라엘을 ‘당신의 백성’이라 부르므로, 별도의 신학적 해설을 본문에 넣지 않고 ‘몫’의 긴장을 보존했습니다.
