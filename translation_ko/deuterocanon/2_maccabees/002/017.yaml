lexical_decisions:
- source_word: πρόσδεξαι
  english_pob_choice: Accept
  chosen_korean: 받아 주시고
  alternatives_korean:
  - 받아들이시고
  - 용납하시고
  lexicon: LSJ
  rationale: 기도문에서 하나님께 제사를 호의적으로 받아 달라는 뜻이므로, 단순한 ‘받다’보다 청유적 뉘앙스를 살린 ‘받아 주시다’가 자연스럽고 공손합니다.
