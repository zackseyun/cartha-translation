translation:
  language: ko
  text: 그들은 천장의 숨겨진 문을 열고 돌들을 던져 지휘관을 쓰러뜨렸으며, 그를 조각내고 나서 머리들을 밖에 있던 사람들에게 던졌습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘천장’에 해당하는 φατινώματος은 매우 희귀하고 뜻이 확정되지 않은 말로, 상부 공간이나 천장 구조를 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: συνεκεραύνωσαν은 단순히 ‘쓰러뜨리다’보다 훨씬 강한 어감을 지니며, 번개처럼 내리치는 이미지를 띱니다.
    reason: lexical_alternative
  - marker: c
    text: 그리스어는 ‘머리들’을 복수형으로 말합니다. 문맥상 어색할 수 있지만, 본문이 가진 복수형을 그대로 보존했습니다.
    reason: textual_variant
