  text: After opening the secret door in the ceiling[a], they threw stones and struck down the leader, and after cutting them into pieces[c][b], they threw the heads to those outside.
  footnotes:
  - marker: a
    text: The Greek word rendered 'roof chamber' (τοῦ φατινώματος) is rare and uncertain; it likely refers to an upper or roof-level space.
    reason: lexical_alternative
  - marker: b
