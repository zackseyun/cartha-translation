translation:
  language: ko
  text: 그들은 천장[a]에 있는 숨겨진 문을 열고 돌들을 던져 그 지도자를 세차게 쳐 쓰러뜨렸으며[b], 그를 여러 조각으로 만들고 나서 머리들을[c] 밖에 있는 사람들에게 던졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘천장’에 해당하는 φατινώματος는 매우 희귀하고 뜻이 확정되지 않은 말입니다. 상부 공간이나 천장 구조를 가리킬 가능성이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: συνεκεραύνωσαν은 단순히 ‘쓰러뜨리다’보다 훨씬 강한 어감을 지니며, 번개처럼 세차게 내리치는 이미지를 띱니다.
    reason: lexical_alternative
  - marker: c
    text: 그리스어는 ‘머리들’을 복수형으로 말합니다. 문맥상 어색할 수 있지만, 번역은 본문의 복수형을 그대로 보존했습니다.
    reason: textual_variant
