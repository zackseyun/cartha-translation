  lexicon: LSJ
  rationale: πολυπραγμονεῖν의 과도한 관여·잔챙이까지 집착하는 뉘앙스를 ‘지나치게 매달리다’로 옮겼습니다.
- source_word: τῷ τῆς ἱστορίας ἀρχηγενέτῃ
  english_pob_choice: to the originator of the history
  chosen_korean: 역사의 창시자에게
  alternatives_korean:
  - 역사의 원저자에게
