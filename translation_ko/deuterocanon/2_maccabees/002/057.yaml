translation:
  language: ko
  text: 그러나 자세히 다루고,[a] 말로 길게 풀어 가며, 세부 사항을 지나치게 파고드는 일은 그 역사를 처음 지은 이에게 속합니다.
  philosophy: optimal-equivalence
  footnotes:
