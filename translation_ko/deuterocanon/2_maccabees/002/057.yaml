translation:
  language: ko
  text: 그러나 자세히 다루고, 말로써 길게 풀어 가고, 그 세부 사항들에 지나치게 매달리는 것은 역사의 창시자에게 속합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘더 깊이 들어가고 말로 더 넓게 나아가는 것’이라는 뜻으로 볼 수 있습니다. 그리스어는 더 풍성하고 확장된 서술을 생생한 비유로 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβατείνειν
  english_pob_choice: to go into detail
  chosen_korean: 자세히 다루고
  alternatives_korean:
  - 깊이 들어가고
  - 세세히 파고들고
  lexicon: LSJ
  rationale: 본문의 ‘더 들어가다’는 뉘앙스를 한국어에서 자연스럽게 풀어 ‘자세히 다루다’로 옮겼습니다.
- source_word: περίπατον ποιεῖσθαι λόγῳ
