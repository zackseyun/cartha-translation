  lexicon: LSJ
  rationale: 직역하면 매우 비유적인 표현이므로, ‘말로써’와 ‘길게 풀어 가다’로 원문의 확장된 담론 이미지를 살렸습니다.
- source_word: πολυπραγμονεῖν ἐν τοῖς κατὰ μέρος
  english_pob_choice: to be overly occupied with the particulars
  chosen_korean: 그 세부 사항들에 지나치게 매달리는
  alternatives_korean:
