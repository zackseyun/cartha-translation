  to: 그러나 자세히 다루고,[a] 말로 길게 풀어 가며, 세부 사항을 지나치게 파고드는 일은 그 역사를 처음 지은 이에게 속합니다.
  rationale: 원문의 세 동사(더 깊이 다루다, 말로 길게 전개하다, 개별 사항을 지나치게 파고들다)를 병렬로 유지했습니다. ‘그 역사를 처음 지은 이’는 원 역사 저자라는 문맥적 대조와 ἀρχηγενέτης의 기원적 뉘앙스를 함께 보존합니다. 각주 표지는 첫 표현에 유지하고, 비유적 대안 번역을 더 자연스러운 한국어로 정리했습니다.
