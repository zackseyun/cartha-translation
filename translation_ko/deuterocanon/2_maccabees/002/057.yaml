  lexicon: LSJ
  rationale: ἀρχηγενέτης는 단순한 ‘저자’보다 ‘처음 만들어 낸 사람’의 의미가 강하므로, 역사 서술의 원창시자라는 점을 드러냈습니다.
theological_decisions:
- issue: '본문의 수사적 겸양: 자세한 서술은 누구의 몫인가'
  chosen_reading: 후속 서술의 길고 자세한 전개는 에피톰 작성자가 아니라 원래 역사를 만든 이에게 속한다는 뜻으로 옮겼습니다.
  alternative_readings:
  - 단순히 문체상의 겸손 표현으로 완화할 수 있음
  - ‘저자’로 평이하게 처리할 수 있음
  rationale: 문맥상 축약본의 저자가 원저자의 역할과 자신의 역할을 구분하는 말이므로, 원문이 가진 문학적·편집사적 구분을 유지했습니다.
  doctrine_reference: 문학적/편집사적 구분 보존
