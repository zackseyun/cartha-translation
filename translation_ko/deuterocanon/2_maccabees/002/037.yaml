  - 전번제물
  lexicon: LSJ
  rationale: 문맥상 불에 완전히 태워지는 제사라는 점은 유지하되, 한국어에서 가장 표준적인 제의어 ‘번제물’을 사용했습니다.
theological_decisions:
- issue: 불이 하늘에서 내려와 제물을 소멸하는 표상
  chosen_reading: 본문의 기적적 제의 표상을 그대로 유지했습니다.
  alternative_readings:
