  lexicon: LSJ
  rationale: 단순히 단수 ‘제물’로 좁히지 않고, 희생제물에 딸린 대상들을 가리키는 보다 넓은 중성 복수감을 살렸습니다.
- source_word: ὁλοκαυτώματα
  english_pob_choice: whole burnt offerings
  chosen_korean: 번제물
  alternatives_korean:
