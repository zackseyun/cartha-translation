base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/037.yaml
  text: Just as Moses prayed to the Lord[a], and fire came down from heaven and consumed the things of the sacrifice, so also Solomon prayed to the Lord[b], and the fire came down and consumed the whole burnt offerings.
  footnotes:
  - marker: a
    text: Greek literally has a broader expression, 'the things of the sacrifice,' which may refer to the sacrificial materials or offerings associated with the sacrifice.
    reason: lexical_alternative
  - marker: b
    text: Or 'burnt offerings.' The Greek term specifically denotes offerings wholly burned up.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 주께 기도하자, 불이 하늘에서 내려와 희생제물의 것들을 소멸하였습니다. 그와 같이 솔로몬도 주께 기도하자, 불이 내려와 번제물을 소멸하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘희생제물의 것들’이라는 더 넓은 표현을 쓰며, 희생제물에 딸린 재료나 제물들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘번제물들’. 그리스어는 완전히 불살라지는 제물을 가리키는 특정 용어를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσηύξατο
  english_pob_choice: prayed
  chosen_korean: 기도하자
  alternatives_korean:
  - 기도하였습니다
  - 간구하자
  lexicon: LSJ
  rationale: 아오리스트 중간형의 기본 의미를 자연스럽게 살려, 반복되는 서술을 현대 한국어의 서사체로 옮겼습니다.
- source_word: Κύριον
  english_pob_choice: Lord
  chosen_korean: 주
  alternatives_korean:
  - 주님
  - 야훼
  lexicon: LSJ
  rationale: 그리스어 본문이 직접 제시하는 칭호를 따라 ‘주’로 옮겼으며, 여기서는 히브리어 신명 표기 대신 그리스어 증언을 반영했습니다.
- source_word: τὰ τῆς θυσίας
  english_pob_choice: the things of the sacrifice
  chosen_korean: 희생제물의 것들
  alternatives_korean:
  - 희생제물
  - 희생제물과 관련된 것들
  - 제물의 물건들
  lexicon: LSJ
  rationale: 단순히 단수 ‘제물’로 좁히지 않고, 희생제물에 딸린 대상들을 가리키는 보다 넓은 중성 복수감을 살렸습니다.
- source_word: ὁλοκαυτώματα
  english_pob_choice: whole burnt offerings
  chosen_korean: 번제물
  alternatives_korean:
  - 온전히 불살라 드린 제물
  - 전번제물
  lexicon: LSJ
  rationale: 문맥상 불에 완전히 태워지는 제사라는 점은 유지하되, 한국어에서 가장 표준적인 제의어 ‘번제물’을 사용했습니다.
theological_decisions:
- issue: 불이 하늘에서 내려와 제물을 소멸하는 표상
  chosen_reading: 본문의 기적적 제의 표상을 그대로 유지했습니다.
  alternative_readings:
  - 비유적 표현으로 완화하기
  - ‘태워 없앴다’로 일상화하기
  rationale: 이 대목은 모세와 솔로몬의 제의가 하늘에서 오는 불로 응답받았다는 비교 구조가 핵심이므로, 기적성과 제의성을 약화시키지 않았습니다.
  doctrine_reference: 본문 비교 구조와 제의 문맥
- issue: ‘주’의 번역
  chosen_reading: ‘주’로 옮겼습니다.
  alternative_readings:
  - ‘주님’으로 확대하기
  - ‘야훼’로 환원하기
  rationale: 그리스어 κύριον에 충실하되, 인용된 본문이 직접 제시하는 칭호를 보존하기 위해 ‘주’를 선택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table, κύριος → Lord'
