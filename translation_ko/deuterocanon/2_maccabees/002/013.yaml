  - 해가 환하게 비쳤는데
  lexicon: LSJ
  rationale: ἀνέλαμψεν의 ‘빛이 나다/비추다’는 뜻을 한국어 동사 ‘비추다’로 간결하게 옮겼습니다.
- source_word: ἐπινεφὴς ὤν
  english_pob_choice: though it had been overcast
  chosen_korean: 아직 구름이 낀 상태였으며
  alternatives_korean:
  - 구름이 덮여 있었는데
  - 흐린 상태였는데
  lexicon: LSJ
  rationale: POB 각주가 제시한 ‘overcast/cloudy’의 의미를 본문에 반영하되, 시간적·상황적 배경을 자연스럽게 드러내기 위해 상태 표현으로 옮겼습니다.
- source_word: ἀνήφθη πυρὰ μεγάλη
  english_pob_choice: a great fire was kindled
  chosen_korean: 큰 불이 붙어
  alternatives_korean:
  - 큰 불이 일어나
  - 큰 불이 점화되어
  lexicon: LSJ
  rationale: πυρά를 ‘불’로 직역해 원문이 말하는 현상을 직접 보존했고, ἀνήφθη의 피동적 ‘붙다/붙어’로 불이 일어난 사건성을 살렸습니다.
- source_word: ὥστε θαυμάσαι πάντας
  english_pob_choice: so that everyone marveled
  chosen_korean: 모두가 놀랐습니다
  alternatives_korean:
  - 모두가 놀랐습니다
  - 모든 사람이 놀라워했습니다
  lexicon: LSJ
  rationale: ὥστε + 부정법의 결과 의미를 한국어 결과절로 옮겼고, πάντας의 보편성을 ‘모두’로 반영했습니다.
theological_decisions:
- issue: πυρὰ μεγάλη의 의미를 본문에서 어떻게 좁힐지
  chosen_reading: 본문은 단순히 ‘큰 불’로 유지했습니다.
  alternative_readings:
  - 큰 제사 불
  - 큰 제물의 불
  rationale: 문맥상 제의적 의미가 강하지만, 원문 자체는 πυρὰ μεγάλη라고만 말하므로 본문에서 해석을 덧붙이지 않고 직접적으로 옮겼습니다.
  doctrine_reference: '번역 원칙: 원문이 허용하는 범위를 넘어 해석을 본문에 삽입하지 않습니다.'
