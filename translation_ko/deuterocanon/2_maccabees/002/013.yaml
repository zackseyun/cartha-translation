lexical_decisions:
- source_word: ὡς δὲ ἐγένετο
  english_pob_choice: But when it happened that
  chosen_korean: 그런데 …
  alternatives_korean:
  - 그리고 …
  - 그때 …
  lexicon: LSJ
  rationale: δέ의 문맥 전환을 자연스럽게 살리되, 앞뒤 이야기 흐름을 이어 주는 전환어로 처리했습니다.
- source_word: ὅ τε ἥλιος ἀνέλαμψεν
  english_pob_choice: and the sun shone out
  chosen_korean: 해가 비추었는데
  alternatives_korean:
