  text: But when it happened that time had passed and the sun shone out[a], though it had been overcast, a great fire was kindled, so that everyone marveled.
  footnotes:
  - marker: a
    text: Or 'while it was overcast.' The Greek phrase ἐπινεφὴς ὤν may be taken more literally as 'being overcast/cloudy.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러다가 시간이 지나고, 구름이 낀 가운데 해가 빛나자 큰 불이 붙어 모두가 놀랐습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘해가 구름에 덮인 채 빛나자.’ 그리스어 ἐπινεφὴς ὤν은 더 문자적으로 ‘구름이 낀/흐린 상태로’라는 뜻이며, 이를 양보적으로 ‘구름이 끼었는데도’로 이해할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐγένετο
