translation:
  language: ko
  text: 제사장들은 제물이 소진되는 동안 기도하였습니다. 곧 제사장들과 모든 사람이 요나단이 먼저 시작하고 나머지가 화답하면서, 느헤미야처럼[a] 기도하였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 축약적으로 ‘느헤미야처럼’이라고만 합니다. 이는 ‘느헤미야가 한 것처럼’ 또는 ‘느헤미야의 기도에서처럼’이라는 뜻일 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어는 ‘제사장들’을 먼저 언급한 뒤 다시 ‘제사장들과 모든 사람’이라고 반복합니다. 이는 제사장들뿐 아니라 온 회중이 기도에 참여했음을 강조하는 표현으로 보입니다.
    reason: lexical_alternative
