    text: 그리스어는 축약적으로 ‘느헤미야처럼’이라고 되어 있어, 문맥상 ‘느헤미야 때처럼’ 또는 ‘느헤미야의 기도처럼’으로 풀 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어는 제사장, 요나단, 나머지 사람들의 응답적 낭송을 다소 반복적으로 표현하여, 전체 회중이 함께 기도에 참여했음을 강조합니다.
    reason: lexical_alternative
