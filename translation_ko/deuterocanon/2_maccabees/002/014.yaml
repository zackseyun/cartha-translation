  text: 제사장들이 제물이 다 소진된 뒤에 기도하였는데, 제사장들과 모든 사람은 요나단이 먼저 시작하고 나머지가 응답하는 방식으로, 느헤미야 때처럼 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
