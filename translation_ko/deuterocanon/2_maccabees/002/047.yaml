lexical_decisions:
- source_word: ἔτι τε
  english_pob_choice: and also
  chosen_korean: 그리고 …도 있습니다
  alternatives_korean:
  - 또한 …도 있습니다
  - 그리고 …도 있습니다
  lexicon: LSJ
  rationale: 앞의 열거에 항목을 하나 더 보태는 누적적 연결이므로, 한국어에서는 자연스러운 덧붙임 표현으로 옮겼습니다.
- source_word: τοὺς ... πολέμους
  english_pob_choice: the wars
  chosen_korean: 전쟁
  alternatives_korean:
  - 전쟁들
  - 전투들
  - 전쟁
  lexicon: LSJ
  rationale: πολέμους는 단수의 개별 전투보다 폭넓은 무력 충돌을 가리키므로, 요약 목록의 문맥에 맞게 ‘전쟁’으로 옮겼습니다.
- source_word: πρὸς
  english_pob_choice: against
  chosen_korean: …에 맞선
  alternatives_korean:
  - …에 대한
  - …과의
  - …을 향한
  lexicon: LSJ
  rationale: πολέμους와 함께 쓰여 적대·대립의 방향을 나타내므로, 결과적으로 전쟁의 상대편을 분명히 드러내는 ‘맞선’이 적절합니다.
- source_word: Ἀντίοχον τὸν Ἐπιφανῆ
  english_pob_choice: Antiochus Epiphanes
  chosen_korean: 안티오코스 에피파네스
  alternatives_korean:
  - 안티오쿠스 에피파네스
  - 안티오코스 대왕
  - 안티오코스 에피파네스
  lexicon: 고유명사 표기
  rationale: 왕호는 번역하지 않고 음역하는 원칙에 따라, 통용되는 역사적 표기인 ‘에피파네스’를 유지했습니다.
- source_word: τὸν τούτου υἱὸν Εὐπάτορα
  english_pob_choice: his son Eupator
  chosen_korean: 그의 아들 유파토르
  alternatives_korean:
  - 이 사람의 아들 유파토르
  - 그 아들 유파토르
  lexicon: 고유명사 표기
  rationale: τούτου가 직전의 안티오코스를 가리키므로, 친자 관계를 자연스럽게 드러내는 ‘그의 아들’로 옮겼습니다.
