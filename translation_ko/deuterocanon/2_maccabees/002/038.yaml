  yaml_path: translation/deuterocanon/2_maccabees/002/038.yaml
  text: And Moses said[a], “Because it was not eaten, the sin offering was consumed.”
  footnotes:
  - marker: a
    text: Or, more literally, “the thing concerning sin.” The Greek expression is a standard biblical idiom for a sin offering.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 모세가 말했습니다. 「죄를 위한 제물이 먹히지 않았기 때문에, 그 제물은 소모되었습니다」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 문자적으로는 ‘죄에 관한 것’입니다. 이 그리스어 표현은 성경에서 표준적으로 ‘속죄제물/죄를 위한 제물’을 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν Μωυσῆς
  english_pob_choice: And Moses said
  chosen_korean: 그리고 모세가 말했습니다
  alternatives_korean:
  - 그러자 모세가 말했습니다
  - 모세가 말했습니다
  lexicon: LSJ
  rationale: 단순한 서술 연결사 καί를 자연스럽게 살려 ‘그리고’로 옮기고, 서술 동사를 합쇼체로 처리했습니다.
- source_word: Διὰ τὸ μὴ βεβρῶσθαι
  english_pob_choice: Because it was not eaten
  chosen_korean: 먹히지 않았기 때문에
  alternatives_korean:
  - 먹지 않았기 때문에
  - 먹히지 않았으므로
  lexicon: LSJ
  rationale: διά + articular infinitive의 원인 의미를 반영했고, βεβρῶσθαι는 ‘먹히다’로 옮겨 수동형의 형태를 살렸습니다.
- source_word: τὸ περὶ τῆς ἁμαρτίας
  english_pob_choice: the sin offering
  chosen_korean: 죄를 위한 제물
  alternatives_korean:
  - 속죄 제물
  - 죄 제사
  lexicon: LSJ
  rationale: 이 표현은 희생제의 관용구이지만, 한국어 ‘속죄 제물’은 다소 해석이 앞서므로 본문에서는 원뜻을 드러내는 ‘죄를 위한 제물’로 두었습니다.
- source_word: ἀνηλώθη
  english_pob_choice: was consumed
  chosen_korean: 소모되었습니다
  alternatives_korean:
  - 소진되었습니다
  - 소모되었다
  lexicon: LSJ
  rationale: 희생 제물의 문맥에서 ἀναλίσκω 수동형의 ‘consumed’에 맞춰 ‘소모되었습니다’로 옮겨, 단순히 ‘태워졌다’로 좁히지 않았습니다.
theological_decisions:
- issue: τὸ περὶ τῆς ἁμαρτίας의 제의적 의미를 한국어로 얼마나 직접 드러낼지
  chosen_reading: ‘죄를 위한 제물’로 직역에 가깝게 두되, 전통적 용어 ‘속죄제물’은 본문에 넣지 않았습니다.
  alternative_readings:
  - 속죄제물
  - 죄제물
  rationale: 그리스어 관용구의 제의적 의미는 살리되, 한국어 전통 용어가 본문 의미를 미리 해석할 수 있어 더 투명한 표현을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 5
