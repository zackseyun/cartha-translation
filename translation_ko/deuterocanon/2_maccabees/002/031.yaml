translation:
  language: ko
  text: 그러나 간략한 표현을 추구하고 내용의 세밀한 전개를 생략하는 것은, 번역을 하는 사람에게 허용되어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘요약본을 만드는 사람’; 여기의 그리스어는 다른 문맥에서는 ‘번역’이라는 뜻도 될 수 있지만, 여기서는 더 큰 작품의 에피톰을 편집하는 일을 가리킵니다.
    reason: lexical_alternative
