  text: But one should allow the one producing the epitome to aim at brevity of expression and to forgo the elaborate treatment of the subject matter[a].
  footnotes:
  - marker: a
    text: Or 'the one making the abridgment'; the Greek term here can elsewhere mean 'translation,' but in this context it refers to the compiler's epitome of a larger work.
