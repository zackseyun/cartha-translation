translation:
  language: ko
  text: 그러나 표현의 간결함을 추구하고 주제를 세밀하게 다루는 일을 생략하는 것은 요약본을 만드는 사람에게 허용되어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘번역을 하는 사람’. 여기의 그리스어는 다른 문맥에서는 ‘번역’을 뜻할 수 있지만, 이 문맥에서는 더 큰 작품을 요약하여 엮는 사람을 가리킵니다.
    reason: lexical_alternative
