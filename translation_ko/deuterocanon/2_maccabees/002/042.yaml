translation:
  language: ko
  text: 그러므로, 만일 여러분이 필요하면, 그것들을 여러분에게 가져다줄 사람들을 보내십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 ἐὰν이 두 번 반복되며, 아마도 본문상의 불규칙 또는 필사 중 중복으로 보입니다. 번역은 의도된 뜻을 따라 한 번의 조건으로 옮겼습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἐὰν οὖν ἐὰν
  english_pob_choice: Therefore, if
  chosen_korean: 그러므로, 만일
  alternatives_korean:
  - 그러면, 만일
  - 그러므로, 필요하면
  lexicon: LSJ
  rationale: οὖν의 추론적 연결을 ‘그러므로’로 살리고, 중복된 ἐὰν은 한국어에서 한 번의 조건으로 자연스럽게 정리했습니다.
- source_word: χρείαν ἔχητε
  english_pob_choice: if you have need
  chosen_korean: 여러분이 필요하면
  alternatives_korean:
  - 여러분이 필요가 있으면
  - 여러분이 필요를 가지면
  lexicon: LSJ
  rationale: χρείαν ἔχειν은 ‘필요가 있다/필요하다’는 관용 표현이므로, 현대 한국어에서 가장 자연스러운 동사형으로 옮겼습니다.
- source_word: τοὺς ἀποκομιούντας
  english_pob_choice: those who will bring them
  chosen_korean: 그것들을 여러분에게 가져다줄 사람들
  alternatives_korean:
  - 그것들을 가져올 사람들
  - 그것들을 여러분께 전달할 사람들
  lexicon: LSJ
  rationale: ἀποκομίζω의 핵심은 어떤 것을 다른 곳으로 옮겨 가져오는 것이므로, 문맥상 보이는 책/문서를 가리키는 대상을 ‘그것들’로 보충해 자연스럽게 표현했습니다.
- source_word: ἀποστείλατε
  english_pob_choice: send
  chosen_korean: 보내십시오
  alternatives_korean:
  - 파견하십시오
  - 보내 주세요
  lexicon: LSJ
  rationale: 직접적인 요청형 명령이므로 공문체에 가까운 ‘보내십시오’가 가장 적절합니다.
theological_decisions:
- issue: 중복된 ἐὰν의 처리
  chosen_reading: 본문의 중복된 조건절 표시는 한국어 본문에서는 재현하지 않고, 의미상 한 번의 조건으로 읽었습니다.
  alternative_readings:
  - ‘만일… 만일’처럼 중복을 그대로 옮김
  - 중복을 모두 생략해 ‘필요하면’으로 단순화
  rationale: 영어 POB가 이중 ἐὰν을 본문 불규칙성으로 보고 의도를 반영해 번역했듯, 한국어도 문법적 어색함을 피하면서 본문의 뜻을 전달하는 쪽이 적절합니다.
  doctrine_reference: 본문비평/번역원칙
- issue: 대상 지시어의 보충
  chosen_reading: ‘그것들’은 앞문맥의 문서/기록을 가리키는 것으로 보아 보충했습니다.
  alternative_readings:
  - 지시어를 생략하고 ‘가져다줄 사람들을 보내십시오’
  - ‘그것들을’ 대신 ‘이를’
  rationale: 그리스어는 목적어를 문맥상 생략하지만, 한국어는 수신 대상을 분명히 해야 의미가 살아나므로 문맥 보충이 필요합니다.
  doctrine_reference: 문맥충실 번역원칙
