  source_fidelity: 초두의 ‘이제’는 그리스어 Τὰ δὲ에 명시된 시간 부사가 아니므로 삭제해야 합니다. 또한 원문은 다음 절로 이어지는 미완결 열거(끝의 쉼표)인데, 초안의 ‘일입니다’는 이를 독립 완결문으로 바꾸었습니다. ‘성전의 정화’와 ‘제단의 봉헌’은 각각 καθαρισμός와 ἐγκαινισμός를 충실히 반영합니다.
  naturalness: ‘유다 마카베오와 그의 형제들에 관한 일과 …에 관해서는,’은 다음 절의 서술을 기다리는 한국어 문어체 연결 구조로 자연스럽습니다. 각주 표지는 의미 대안이 걸리는 ‘봉헌’ 바로 뒤에 두는 것이 적절합니다.
  terminology: ‘유다 마카베오’, ‘형제들’, ‘성전’, ‘정화’, ‘봉헌’은 현대 한국어 성서 문체에서 자연스럽고 원문 의미 범위도 유지합니다. ἐγκαινισμός에 ‘재-’를 본문에 넣지 않고 각주에서 ‘재봉헌’ 가능성을 밝히는 것이 안전합니다.
  issues:
