  yaml_path: translation/deuterocanon/2_maccabees/002/046.yaml
  text: Now the matters concerning Judas Maccabeus and his brothers[a], and the purification of the greatest sanctuary, and the dedication of the altar,
  footnotes:
  - marker: a
    text: Or 'the rededication of the altar.' The Greek says 'dedication,' but the historical context is the altar's restoration after defilement.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다 마카베오와 그의 형제들에 관한 일과 가장 큰 성전의 정화와 제단의 봉헌[a]에 관해서는,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제단의 재봉헌’. 그리스어는 단순히 ‘봉헌’이라고 하지만, 역사적 맥락상 이는 더럽혀진 뒤 제단을 회복한 일을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὰ δὲ κατὰ τὸν Ἰούδαν
  english_pob_choice: Now the matters concerning Judas
  chosen_korean: 이제 유다 …에 관한 일입니다
  alternatives_korean:
  - 유다에 대한 사건들입니다
  - 유다와 관련된 일입니다
  - 유다에 관한 역사입니다
  lexicon: LSJ
  rationale: κατά + 대격이 나타내는 주제 범위를 살려, 특정한 ‘행적’으로 좁히지 않고 ‘…에 관한 일’로 옮겼습니다.
- source_word: Ἰούδαν τὸν Μακκαβαῖον
  english_pob_choice: Judas Maccabeus
  chosen_korean: 유다 마카베오
  alternatives_korean:
  - 유다, 마카베오
  - 유다 마카베우스
  lexicon: 고유명사 관행
  rationale: 인물명과 별칭은 한국어 성서 관용에 맞춰 음역하되, 이 책에서 통용되는 형태로 정리했습니다.
- source_word: τοὺς τούτου ἀδελφοὺς
  english_pob_choice: his brothers
  chosen_korean: 그의 형제들
  alternatives_korean:
  - 그의 형제들
  - 그의 형제자매들
  lexicon: LSJ
  rationale: ἀδελφοί는 여기서 유다의 실제 형제들을 가리키므로, 자연스러운 현대 한국어로 ‘형제들’이 적절합니다.
- source_word: τὸν τοῦ ἱεροῦ τοῦ μεγίστου καθαρισμὸν καὶ τὸν τοῦ βωμοῦ ἐγκαινισμόν
  english_pob_choice: the purification of the greatest sanctuary, and the dedication of the altar
  chosen_korean: 가장 큰 성전의 정화와 제단의 봉헌
  alternatives_korean:
  - 가장 큰 성전의 정결과 제단의 봉헌
  - 가장 큰 성전의 정화와 제단의 재봉헌
  - 가장 큰 성전의 정화와 제단의 헌당
  lexicon: LSJ
  rationale: ἱερόν은 예루살렘 성전/성전 परिसर를 가리키므로 ‘성전’이 자연스럽고, καθαρισμός는 의례적 의미를 살려 ‘정화’, ἐγκαινισμός는 ‘봉헌’으로 옮겼습니다.
theological_decisions:
- issue: ἐγκαινισμός의 ‘봉헌’ vs ‘재봉헌’
  chosen_reading: 본문에는 단순히 ‘봉헌’을 두고, 역사적 배경상 훼손 뒤의 회복이라는 의미는 문맥으로 드러나게 합니다.
  alternative_readings:
  - 재봉헌
  - 헌당
  rationale: 그리스어 자체에는 ‘다시-’에 해당하는 접두가 없으므로, 본문에는 과도한 해석을 덧붙이지 않고 문맥적 의미는 독자가 파악하도록 두었습니다.
  doctrine_reference: 원문 우선, 해석의 과잉 방지
- issue: ἱερόν의 번역
  chosen_reading: 성전
  alternative_readings:
  - 성소
  - 성역
  rationale: 이 역사 서술에서는 ἱερόν이 예루살렘 성전 전체를 가리키므로, 한국어로는 ‘성전’이 가장 분명합니다.
  doctrine_reference: 원문 우선, 가독성
