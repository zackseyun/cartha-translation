translation:
  language: ko
  text: 그리고 그 기도는 이와 같은 형식이었습니다. 「주 하나님, 만물의 창조주, 두려우시고 능하시며 의로우시고 자비로우신 분, 홀로 왕이시며 선하신 분」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν δὲ ἡ προσευχὴ τὸν τρόπον ἔχουσα τοῦτον
  english_pob_choice: And the prayer had this form
  chosen_korean: 그리고 그 기도는 이와 같은 형식이었습니다
  alternatives_korean:
  - 그리고 그 기도는 이와 같았습니다
  - 그리고 그 기도는 다음과 같았습니다
  lexicon: LSJ
  rationale: ‘τὸν τρόπον ἔχουσα τοῦτον’은 기도문의 도입구로, 한국어에서는 자연스럽게 ‘이와 같은 형식’으로 옮겨 원문의 구조를 살렸습니다.
- source_word: Κύριε ὁ θεός
  english_pob_choice: Lord God
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주님 하나님
  - 주여 하나님
  lexicon: LSJ
  rationale: 직접 호격이므로 ‘주’와 ‘하나님’으로 간결하게 살렸고, 합쇼체 기도문에서 자연스럽게 읽히도록 했습니다.
- source_word: ὁ φοβερὸς καὶ ὁ ἰσχυρὸς καὶ δίκαιος καὶ ἐλεήμων
  english_pob_choice: the fearful and mighty and righteous and merciful one
  chosen_korean: 두려우시고 능하시며 의로우시고 자비로우신 분
  alternatives_korean:
  - 두렵게 하시는 분이시며 능하시고 의로우시며 자비로우신 분
  - 경외로우시고 능하시며 의로우시고 자비로우신 분
  lexicon: LSJ
  rationale: 연속된 관사-형용사 구조를 인칭적 호칭으로 옮기기 위해 ‘…하신 분’을 사용했고, φοβερὸς는 ‘두려우시고’로 직역해 두려움/경외의 긴장을 보존했습니다.
- source_word: ὁ μόνος βασιλεὺς καὶ χρηστός
  english_pob_choice: the only king and good one
  chosen_korean: 홀로 왕이시며 선하신 분
  alternatives_korean:
  - 홀로 왕이시고 선하신 분
  - 오직 왕이시며 좋으신 분
  lexicon: LSJ
  rationale: μόνος는 배타성을 드러내는 ‘홀로’로, χρηστός는 여기서 단순 형용사보다 칭호적 뉘앙스가 있어 ‘선하신 분’으로 옮겼습니다.
theological_decisions:
- issue: φοβερὸς의 신적 성품 표현
  chosen_reading: ‘두려우시고’로 옮겨 하나님이 경외와 두려움을 불러일으키시는 분이라는 긴장을 유지했습니다.
  alternative_readings:
  - 경외로우시고
  - 두렵게 하시는 분
  rationale: 원문의 φοβερὸς는 단순히 ‘무서운’이 아니라 두려움/경외를 일으키는 성격을 가리키므로, 부드럽게 완화하지 않고 기도문의 장엄성을 살렸습니다.
  doctrine_reference: 하나님의 거룩함과 경외성에 대한 일반 성서적 표현
