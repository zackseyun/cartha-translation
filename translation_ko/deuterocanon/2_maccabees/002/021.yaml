  lexicon: LSJ
  rationale: 미완료 시제가 진행 중인 동작을 나타내므로, 단순 과거가 아니라 지속성을 드러내기 위해 ‘계속 …하고 있었습니다’로 옮겼습니다.
- source_word: τοὺς ὕμνους
