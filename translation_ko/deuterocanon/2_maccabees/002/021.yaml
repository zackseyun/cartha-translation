lexical_decisions:
- source_word: Οἱ δὲ
  english_pob_choice: And
  chosen_korean: 그런데
  alternatives_korean:
  - 그리고
  - 또
  lexicon: LSJ
  rationale: δέ는 앞뒤를 강하게 대립시키기보다 서술을 이어 주는 경우가 많아, 한국어에서는 문맥 전환을 자연스럽게 드러내는 ‘그런데’로 옮겼습니다.
- source_word: ἱερεῖς
