  rationale: ὕμνοι는 예배적 찬가를 뜻하므로 ‘찬송가들’이 가장 자연스럽고, 관사도 복수로 반영했습니다.
theological_decisions:
- issue: liturgical action expressed by the imperfect verb
  chosen_reading: 예배적 노래 행위의 지속성을 살려, 제사장들이 단순히 한 번 ‘불렀다’가 아니라 계속 노래하고 있던 장면으로 읽었습니다.
  alternative_readings:
  - 제사장들은 찬송들을 불렀습니다.
  - 제사장들은 찬송들을 노래했습니다.
  rationale: ἐπέαλλον의 미완료상은 진행성과 계속성을 시사하므로, 한국어에서도 그 동작의 지속을 분명히 드러내는 것이 본문 의미를 더 잘 보존합니다.
  doctrine_reference: 서사 문맥의 상(aspect) 반영
- issue: register in narrative description
  chosen_reading: 직설적 서술문으로 유지하고, 종교적 과장이나 고어체를 피했습니다.
  alternative_readings:
  - 제사장들은 찬송가들을 읊고 있었습니다.
  - 제사장들은 찬송들을 불러 올리고 있었습니다.
  rationale: 이 구절은 예배 장면의 묘사이지만 직접 화법이 아니므로, 현대 표준어의 담백한 서술이 원문을 가장 투명하게 전달합니다.
  doctrine_reference: 번역 문체 원칙
