  - 나타내실 것입니다
  - 밝히실 것입니다
  lexicon: LSJ
  rationale: 숨겨져 있던 것을 밖으로 드러내 보인다는 뜻을 살려, 단순한 정보 전달보다 ‘드러내다’가 더 직접적입니다.
- source_word: ταῦτα
