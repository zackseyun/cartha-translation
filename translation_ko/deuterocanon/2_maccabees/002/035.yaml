  - 드러날 것입니다
  lexicon: LSJ
  rationale: 신적 현현 문맥에서 단순 시각적 ‘보이다’보다 ‘나타나다’가 더 자연스럽고 문맥에 맞습니다.
- source_word: καταγιασθῇ
  english_pob_choice: might be sanctified
  chosen_korean: 크게 거룩하게 되게 하려는 것입니다
  alternatives_korean:
