  - 크게 거룩히 구별되게 하려는 것입니다
  lexicon: LSJ
  rationale: καταγιάζω의 핵심은 ‘거룩하게 하다/되게 하다’이며, 한국어에서 제의적·성전적 뉘앙스를 살리기 위해 ‘거룩하게 되다’를 택했습니다.
