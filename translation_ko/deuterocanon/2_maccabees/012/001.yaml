  text: After these agreements had been made[a], Lysias went away to the king[b], but the Jews occupied themselves with farming.
  footnotes:
  - marker: a
    text: Or 'had been concluded' for 'had been made'; the Greek participle can emphasize the completion of the agreements.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'were occupied around farming,' an idiom meaning they were engaged in agricultural work.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 협정들이 이루어진 뒤에 리시아스는 왕에게 떠나갔고, 유대인들은 농사일에 힘썼습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 aorist 분사구는 완료된 선행 동작을 강조할 수 있어, ‘이 협정들이 이루어진 뒤에’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 περὶ τὴν γεωργίαν ἐγίνοντο는 직역하면 ‘농사 주위에 있었습니다’에 가까운 관용구로, 여기서는 ‘농사일에 힘썼습니다’로 풀었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένων τῶν συνθηκῶν τούτων
  english_pob_choice: After these agreements had been made
  chosen_korean: 이 협정들이 이루어진 뒤에
  alternatives_korean:
  - 이 합의들이 이루어진 뒤에
  - 이 약정들이 체결된 뒤에
  lexicon: LSJ
  rationale: aorist 분사구는 앞선 완료를 나타내므로, 한국어에서도 뒤이은 본동사보다 먼저 끝난 사건으로 자연스럽게 옮겼습니다. συνθήκαι는 단순한 ‘계약’보다 중립적인 ‘협정/합의’가 원문의 범위를 잘 반영합니다.
- source_word: ἀπῆε πρὸς τὸν βασιλέα
  english_pob_choice: went away to the king
  chosen_korean: 왕에게 떠나갔고
  alternatives_korean:
  - 왕에게 갔고
  - 왕에게 돌아갔고
  lexicon: LSJ
  rationale: ἀπῆε는 서술적 과거로 ‘떠나다’의 의미가 자연스럽고, πρός + 대격은 방향을 나타내므로 목적어를 ‘왕에게’로 처리했습니다. ‘돌아갔다’는 문맥상 가능하지만 그 의미를 본문에 추가하지 않기 위해 피했습니다.
- source_word: περὶ τὴν γεωργίαν ἐγίνοντο
  english_pob_choice: occupied themselves with farming
  chosen_korean: 농사일에 힘썼습니다
  alternatives_korean:
  - 농사에 종사했습니다
  - 농사일을 하였습니다
  - 농사에 몰두했습니다
  lexicon: LSJ
  rationale: περὶ + 대격은 ‘~에 관여하여/종사하여’의 관용적 용법이므로, 한국어에서는 ‘힘썼습니다’로 활동 지속성을 살렸습니다. γεωργία는 문맥상 추상적 ‘농업’보다 구체적인 ‘농사일’이 더 자연스럽습니다.
