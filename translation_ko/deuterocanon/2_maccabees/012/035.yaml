base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/035.yaml
  text: But a certain Dositheus[a], one of Bacenor’s men, a horseman and a strong man, had hold of Gorgias; and seizing his cloak, he was dragging him along forcefully, intending to take the accursed man alive, when one of the Thracian horsemen rushed upon him and cut off his shoulder, and Gorgias escaped to Marisa.
  footnotes:
  - marker: a
    text: Or 'cut down his shoulder' / 'disabled his shoulder'; the Greek describes a severe blow to the shoulder area, and the exact anatomical result may be understood somewhat differently.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 바케노르의 사람들 가운데 한 사람인 도시데오스는 말을 탄 사람이며 강한 사람이었는데, 고르기아스를 붙잡고 그의 겉옷을 움켜쥔 채 그를 힘껏 끌고 갔습니다. 그는 그 저주받은 자를 살아서 사로잡으려 했지만, 트라키아 기병 가운데 한 사람이 그에게 달려들어 그의 어깨를 쳐서 떨어뜨렸고, 고르기아스는 마리스아로 도망쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어깨를 쳐서 쓰러뜨렸다’, ‘어깨를 크게 상하게 했다’. 그리스어는 어깨 부위에 대한 심한 타격을 뜻하며, 정확한 신체적 결과는 다소 다르게 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν τοῦ Βακινόρος
  english_pob_choice: one of Bacenor’s men
  chosen_korean: 바케노르의 사람들 가운데 한 사람
  alternatives_korean:
  - 바케노르의 부하들 가운데 한 사람
  - 바케노르의 군사들 가운데 한 사람
  lexicon: LSJ
  rationale: 소속 관계를 자연스럽게 드러내되, 원문이 직책을 특정하지 않으므로 ‘부하들’처럼 과도하게 한정하지 않았습니다.
- source_word: ἔφιππος ἀνὴρ καὶ καρτερός
  english_pob_choice: a horseman and strong
  chosen_korean: 말을 탄 사람이며 강한 사람이었는데
  alternatives_korean:
  - 기마병이었고 강한 사람이었는데
  - 말 탄 사람이며 용맹한 사람이었는데
  lexicon: LSJ
  rationale: ἔφιππος는 단순히 ‘말 탄’ 상태를 가리키므로 ‘기마병’보다 덜 해석적인 표현을 택했고, καρτερός는 여기서 전투적 체력의 강함을 나타내므로 ‘강한’이 적절합니다.
- source_word: λαβόμενος τῆς χλαμύδος
  english_pob_choice: seizing his cloak
  chosen_korean: 그의 겉옷을 움켜쥔 채
  alternatives_korean:
  - 그의 망토를 붙잡고
  - 그의 군용 외투를 잡고
  lexicon: LSJ
  rationale: χλαμύς는 망토/겉옷이지만, 한국어 독자에게는 ‘겉옷’이 가장 넓고 무난하게 원문 기능을 살립니다.
- source_word: τὸν κατάρατον
  english_pob_choice: the accursed man
  chosen_korean: 그 저주받은 자
  alternatives_korean:
  - 그 저주받은 사람
  - 그 저주받은 자들
  lexicon: LSJ
  rationale: 원문의 적대적 멸칭을 유지하되, 한국어에서 다소 문어적인 비난조를 살리기 위해 ‘자’를 사용했습니다.
- source_word: τὸν ὦμον καθελόντος
  english_pob_choice: cut off his shoulder
  chosen_korean: 그의 어깨를 쳐서 떨어뜨렸고
  alternatives_korean:
  - 그의 어깨를 잘라냈고
  - 그의 어깨를 내리쳤고
  lexicon: LSJ
  rationale: 원문의 동사는 단순 절단보다 강타 후 기능 상실을 포함할 수 있어, 영어 POB의 주석 취지를 반영해 ‘쳐서 떨어뜨리다’로 번역했습니다.
theological_decisions:
- issue: 전투 기사체의 폭력적 묘사와 도덕적 평가
  chosen_reading: 서술의 적대적 평가어인 ‘저주받은 자’를 그대로 살려, 사건의 서술자가 고르기아스를 부정적으로 규정하는 어조를 유지했습니다.
  alternative_readings:
  - 중립적으로 ‘그 사람’으로 완화
  - ‘저주받은 자’를 ‘저주받은 이’로 약화
  rationale: 원문과 영어 POB 모두 의도적으로 강한 멸칭을 유지하므로, 이를 순화하면 서술의 평가적 뉘앙스가 약해집니다.
  doctrine_reference: 서술체의 평가어 보존
