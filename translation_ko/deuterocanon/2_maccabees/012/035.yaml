  - 말 탄 사람이며 용맹한 사람이었는데
  lexicon: LSJ
  rationale: ἔφιππος는 단순히 ‘말 탄’ 상태를 가리키므로 ‘기마병’보다 덜 해석적인 표현을 택했고, καρτερός는 여기서 전투적 체력의 강함을 나타내므로 ‘강한’이 적절합니다.
- source_word: λαβόμενος τῆς χλαμύδος
  english_pob_choice: seizing his cloak
  chosen_korean: 그의 겉옷을 움켜쥔 채
  alternatives_korean:
