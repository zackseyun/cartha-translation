  lexicon: LSJ
  rationale: χλαμύς는 망토/겉옷이지만, 한국어 독자에게는 ‘겉옷’이 가장 넓고 무난하게 원문 기능을 살립니다.
- source_word: τὸν κατάρατον
  english_pob_choice: the accursed man
  chosen_korean: 그 저주받은 자
  alternatives_korean:
  - 그 저주받은 사람
  - 그 저주받은 자들
  lexicon: LSJ
  rationale: 원문의 적대적 멸칭을 유지하되, 한국어에서 다소 문어적인 비난조를 살리기 위해 ‘자’를 사용했습니다.
- source_word: τὸν ὦμον καθελόντος
  english_pob_choice: cut off his shoulder
  chosen_korean: 그의 어깨를 쳐서 떨어뜨렸고
  alternatives_korean:
  - 그의 어깨를 잘라냈고
  - 그의 어깨를 내리쳤고
  lexicon: LSJ
  rationale: 원문의 동사는 단순 절단보다 강타 후 기능 상실을 포함할 수 있어, 영어 POB의 주석 취지를 반영해 ‘쳐서 떨어뜨리다’로 번역했습니다.
