  source_fidelity: 핵심 사건 순서와 인물 관계는 대체로 충실합니다. 그러나 ‘어깨를 쳐서 떨어뜨렸다’는 한국어에서 무엇이 떨어졌는지 불명확하고 자연스럽지 않으며, καθελόντος가 가리키는 중대한 어깨 부위의 절단/손상을 충분히 전달하지 못합니다. 또한 원문의 Μαρισά는 ‘마리사’로 옮기는 것이 적절합니다. βουλόμενον의 형태상 선행사에는 문법적 긴장이 있으나, 문맥 및 영어 POB의 판단을 따라 도시데오스가 고르기아스를 산 채로 붙잡으려 한 것으로 번역하되, 별도의 교리적 해석은 더하지 않았습니다.
