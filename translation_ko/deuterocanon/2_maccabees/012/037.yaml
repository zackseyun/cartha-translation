  text: Beginning the battle cry in the language of his fathers[a], with hymns[b], he shook those around Gorgias by surprise and put them to flight.
  footnotes:
  - marker: a
    text: Or 'in the ancestral language.' The Greek phrase may emphasize either the language used or the ancestral character of the cry.
    reason: lexical_alternative
  - marker: b
    text: Literally 'made a rout of them' or 'caused their turning.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 조상의 언어로 전투 함성을 시작하면서[a] 찬가와 함께[b] 그 발언으로 기울게 하여, 곧바로 고르기아스 주변의 자들을 놀라게 하여 도망치게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘조상들의 언어로’. 여기서는 사용된 말의 언어이면서 동시에 조상 전래의 성격을 함께 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들을 패주시켰다’ 또는 ‘그들의 방향을 돌려놓았다’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταρξάμενος
  english_pob_choice: Beginning
  chosen_korean: 시작하면서
  alternatives_korean:
  - 시작하여
  - 맏아
  lexicon: LSJ
  rationale: 부정과거 중간분사로서 뒤의 주동 행위를 이끄는 시작을 나타내므로, 한국어에서는 자연스러운 연결형 ‘-하면서’로 처리했습니다.
- source_word: τῇ πατρίῳ φωνῇ
  english_pob_choice: in the language of his fathers
  chosen_korean: 조상의 언어로
  alternatives_korean:
  - 선조들의 언어로
  - 조상 대대로의 말로
  lexicon: LSJ
  rationale: φωνή가 이 문맥에서는 단순한 ‘목소리’보다 ‘언어/말’의 뜻이 강하고, πατρίῳ는 조상에게 속한 전통적 언어를 가리키므로 이를 간결하게 살렸습니다.
- source_word: τὴν μεθʼ ὕμνων κραυγήν
  english_pob_choice: the battle cry ... with hymns
  chosen_korean: 전투 함성 … 찬가와 함께
  alternatives_korean:
  - 전투 외침 … 찬송과 함께
  - 찬가를 곁들인 함성
  lexicon: LSJ
  rationale: κραυγή는 전투 상황의 큰 외침이고, μεθʼ ὕμνων은 찬가가 동반됨을 말하므로 군사적 요소와 예배적 요소를 둘 다 드러내도록 옮겼습니다.
- source_word: τροπὴν ἐποιήσατο αὐτῶν
  english_pob_choice: put them to flight
  chosen_korean: 도망치게 했습니다
  alternatives_korean:
  - 패주시키셨습니다
  - 무너뜨렸습니다
  lexicon: LSJ
  rationale: τροπή는 군사적으로 ‘패주/도주’의 결과를 뜻하므로, 한국어에서는 본문의 전투적 효과를 직접적으로 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 전투와 찬가의 결합
  chosen_reading: 전투 함성과 찬가를 함께 유지하여, 전쟁 행위 안에 신앙적 찬양이 결합된 장면을 분리하지 않고 드러냈습니다.
  alternative_readings:
  - 찬송하는 외침으로 완화하기
  - 단순한 함성으로 중화하기
  rationale: 그리스어는 κραυγή와 μεθʼ ὕμνων을 함께 묶어 말하므로, 어느 한쪽으로 흡수하면 본문의 긴장과 표현력이 약해집니다.
  doctrine_reference: Translation philosophy §§1, 6
