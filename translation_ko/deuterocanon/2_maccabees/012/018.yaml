  to: 그들은 그곳들에서 티모테오스를 붙잡지 못했습니다[a]. 그는 그때 아무 성과도 거두지 못한 채 그곳들을 떠났지만, 어떤 한 곳에는 매우 강한 주둔군을 남겨 두었습니다[b].
