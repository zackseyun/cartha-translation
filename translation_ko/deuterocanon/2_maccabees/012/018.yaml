base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/018.yaml
  text: But they did not catch Timotheus in those places[a], for he had then withdrawn from the places without accomplishing anything, though he had left a garrison in a certain place[b], and a very strong one at that.
  footnotes:
  - marker: a
    text: Or 'they did not seize Timotheus at those places.' The Greek verb can carry the sense of catching, overtaking, or seizing.
    reason: lexical_alternative
  - marker: b
    text: The clause 'a very strong one' most directly describes the garrison, though the sense may overlap with the strength or fortification of the place where it was left.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그곳들에서 티모테오스를 붙잡지 못했습니다[a]. 그는 그때 그곳들에서 아무 성과도 거두지 못한 채 물러났고, 어느 한 곳에 주둔군을 남겨 두었는데[b], 그것도 아주 강한 부대였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들은 그곳들에서 티모테오스를 사로잡지 못했습니다.” 그리스어 동사는 붙잡다, 제압하다, 사로잡다의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: “아주 강한”은 가장 직접적으로는 주둔군을 수식하지만, 남겨진 장소가 매우 견고했음을 함께 시사할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέλαβον
  english_pob_choice: did not catch
  chosen_korean: 붙잡지 못했습니다
  alternatives_korean:
  - 붙들지 못했습니다
  - 사로잡지 못했습니다
  - 붙잡아내지 못했습니다
  lexicon: LSJ
  rationale: 추격·포획 문맥에서 καταλαμβάνω의 핵심은 상대를 붙잡아 제압하는 뜻이므로, 현대 한국어로는 ‘붙잡다’가 가장 자연스럽고 ‘catch’의 기동성도 살립니다.
- source_word: ἐπὶ τῶν τόπων
  english_pob_choice: in those places
  chosen_korean: 그곳들에서
  alternatives_korean:
  - 그곳들 안에서
  - 그 지역에서
  - 그 장소들에서
  lexicon: LSJ
  rationale: 앞선 문맥에서 지칭된 복수의 지점을 가리키므로, 불필요하게 해설하지 않고 복수 장소감을 살리는 ‘그곳들에서’로 옮겼습니다.
- source_word: ἄπρακτον
  english_pob_choice: without accomplishing anything
  chosen_korean: 아무 성과도 거두지 못한 채
  alternatives_korean:
  - 성과 없이
  - 아무 일도 이루지 못한 채
  - 헛되이
  lexicon: LSJ
  rationale: ἄπρακτος의 ‘효과가 없음, 성과 없음’을 드러내기 위해 결과 부정을 분명히 하는 표현을 택했습니다.
- source_word: φρουράν
  english_pob_choice: a garrison
  chosen_korean: 주둔군
  alternatives_korean:
  - 수비대
  - 경비대
  - 주둔 부대
  lexicon: LSJ
  rationale: 군사적으로 남겨진 무장 병력을 가리키므로, 단순한 경비 인원보다 ‘주둔군’이 문맥상 더 정확합니다.
- source_word: μάλιστα ὀχυράν
  english_pob_choice: a very strong one
  chosen_korean: 아주 강한 부대
  alternatives_korean:
  - 매우 강한 수비대
  - 특히 튼튼한 주둔군
  - 아주 견고한 것
  lexicon: LSJ
  rationale: 형용사 ὀχυράν은 바로 앞의 φρουράν을 수식하므로, ‘부대’로 되받아 한국어에서 자연스럽게 강함을 드러냈습니다.
theological_decisions:
- issue: 이 절의 στρατιωτική(군사적) 서술을 어떻게 평이하게 처리할지
  chosen_reading: 신학적 확장 없이 사건 보고체로 유지했습니다.
  alternative_readings:
  - 도덕적 평가를 덧붙여 번역
  - 암시를 살려 과장된 표현 사용
  rationale: 본문은 티모테오스의 도주와 남겨진 수비대를 기록하는 서술이므로, 의미를 넘는 해석을 얹지 않고 사실 서술을 유지하는 것이 가장 충실합니다.
  doctrine_reference: 서사 본문 번역 원칙
