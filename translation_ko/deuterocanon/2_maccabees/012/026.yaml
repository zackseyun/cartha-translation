  text: Then he advanced against Carnion and Atargatis[b][a], and slaughtered twenty-five thousand men.
  footnotes:
  - marker: a
    text: Or possibly, 'Atargation' refers to a sanctuary of Atargatis rather than a second town name.
    reason: lexical_alternative
  - marker: b
    text: Greek literally, 'two myriads of bodies and five thousand,' that is, twenty-five thousand slain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 카르니온과 아테르가티온을 향해 나아가, 이만오천 명을 도륙하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어를 문자적으로 옮기면 '두 만의 몸과 오천'이며, 살해된 사람 수를 가리키는 특이한 수량 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: Ἀτεργάτιον은 두 번째 도시명이라기보다 아테르가티스와 관련된 성소를 가리킬 가능성도 있습니다.
    reason: lexical_alternative
