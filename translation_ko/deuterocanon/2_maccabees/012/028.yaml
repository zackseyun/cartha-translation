base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/028.yaml
  text: But after calling on the Sovereign[a], who with judgments shatters the forces of the enemies, they took the city under their control[c][b], and struck down twenty-five thousand of those inside.
  footnotes:
  - marker: a
    text: Or 'the Mighty One' or 'the Ruler' for the divine title.
    reason: lexical_alternative
  - marker: b
    text: The Greek phrase rendered 'with judgments' contains an unusual form in the transmitted text; the sense is that God shatters the enemies through acts of judgment.
    reason: textual_variant
  - marker: c
    text: Or 'captured the city'; literally, 'took the city under hand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들은 심판으로[b] 적들의 세력을 무너뜨리시는 통치자께[a] 부르며, 그 도시를 자기들의 수중에 넣고[c] 그 안에 있던 이만오천 명을 죽였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘강한 분’, ‘지배자’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 본문에 전해지는 ‘심판으로’에 해당하는 그리스어 형태는 다소 특이합니다. 뜻은 하나님께서 심판의 행위로 적들을 무너뜨리신다는 것입니다.
    reason: textual_variant
  - marker: c
    text: 또는 ‘그 도시를 점령하고’로 옮길 수 있습니다. 직역하면 ‘그 도시를 자기 손 아래로 취하고’입니다.
    reason: lexical_alternative
