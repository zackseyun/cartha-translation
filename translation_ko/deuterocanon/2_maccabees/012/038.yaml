- from: 그때 유다는 군대를 이끌고 오도람 성에 이르렀습니다. 그리고 한 주가 저물 무렵, 그들은 그곳에서 관례에 따라 몸을 정결하게 하고 그곳에서 안식일을 지냈습니다.[a]
  to: 그때 유다는 군대를 이끌고 아둘람 성에 이르렀습니다. 한 주가 저물어 갈 때[a], 그들은 그곳에서 관례에 따라 자신들을 정결하게 하고 안식일을 지냈습니다.
  rationale: 통용 한국어 성서 지명 표기를 적용하고, 정결 행위의 대상을 원문처럼 사람들 자신으로 유지했습니다. 시간 표현을 자연스럽게 다듬고, 그 표현의 해석상 대안을 설명하는 각주를 해당 위치로 옮겼습니다. ‘안식일을 지냈습니다’는 διῆγεν의 ‘시간을 보내다’라는 뜻을 보존합니다.
