  - severity: low
    issue: ‘몸을 정결하게 하고’
    rationale: ἁγνισθέντες는 사람들 자신이 제의적으로 정결해졌음을 말합니다. ‘몸’은 원문에 없는 신체적 한정을 더하므로 ‘자신들을 정결하게 하고’가 더 직접적입니다.
  - severity: low
    issue: 각주 표지 위치 및 시간 표현
    rationale: 각주는 ‘한 주가 저물어 갈 때’라는 번역 선택을 설명하므로 해당 구절 바로 뒤에 붙여야 합니다. ‘저물어 갈 때’가 ‘저물 무렵’보다 자연스럽습니다.
