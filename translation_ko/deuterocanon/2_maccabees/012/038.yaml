  text: Then Judas[a], taking the army, came to the city of Odollam. And as the week was ending, they purified themselves there according to the custom and spent the Sabbath there.
  footnotes:
  - marker: a
    text: Or, more literally, 'as the week was coming on'; the context and following mention of the Sabbath indicate the approach of the seventh day.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 유다는 군대를 이끌고 아둘람 성에 이르렀습니다. 한 주가 저물어 갈 때[a], 그들은 그곳에서 관례에 따라 자신들을 정결하게 하고 안식일을 지냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로는 ‘한 주가 다가올 때’입니다. 문맥과 이어지는 안식일 언급은 안식일이 가까워지고 있음을 시사합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναλαβών
  english_pob_choice: taking the army
  chosen_korean: 군대를 이끌고
  alternatives_korean:
  - 군대를 데리고
  - 군대를 취하여
  - 군대를 거느리고
  lexicon: BDAG
  rationale: ἀναλαμβάνω는 여기서 단순히 ‘가져가다’보다 함께 움직이며 데려가는 흐름이 강하므로, 한국어에서는 자연스럽게 ‘군대를 이끌고’로 옮겼습니다.
- source_word: στράτευμα
  english_pob_choice: army
  chosen_korean: 군대
  alternatives_korean:
  - 병력
  - 부대
  - 군사들
  lexicon: LSJ
  rationale: στράτευμα는 군사 집단을 가리키므로, 현대 한국어의 일반적이고 직접적인 대응인 ‘군대’를 선택했습니다.
- source_word: τῆς ... ἑβδομάδος ἐπιβαλλούσης
  english_pob_choice: as the week was ending
  chosen_korean: 한 주가 저물 무렵
  alternatives_korean:
  - 한 주가 다가올 무렵
  - 일주일이 진행되면서
  - 일곱째 날이 다가오면서
  lexicon: LSJ
  rationale: 직역하면 ‘주간이 닥쳐오다/다가오다’이지만, 본문이 곧바로 안식일을 언급하므로 시간상으로는 주간의 끝, 곧 안식일 직전의 시점을 드러내는 표현이 적절합니다.
- source_word: ἁγνισθέντες
  english_pob_choice: they purified themselves
  chosen_korean: 몸을 정결하게 하고
  alternatives_korean:
  - 스스로를 정결하게 하고
  - 정결예식을 치르고
  - 자신을 깨끗하게 하고
  lexicon: BDAG
  rationale: ἁγνίζω의 제의적 의미를 살리되, 한국어에서는 지나치게 기술적이지 않게 ‘몸을 정결하게 하다’로 옮겨 정결 예비 행위의 뉘앙스를 보존했습니다.
- source_word: τὸ σάββατον διῆγεν
  english_pob_choice: spent the Sabbath there
  chosen_korean: 그곳에서 안식일을 지냈습니다
  alternatives_korean:
  - 그곳에서 안식일을 보냈습니다
  - 그곳에서 안식일을 지켰습니다
  - 그곳에서 안식일에 머물렀습니다
  lexicon: BDAG
  rationale: διῆγεν은 ‘시간을 보내다’의 뜻이므로 ‘지냈습니다’가 가장 자연스럽고, 본문의 안식일 체류를 무리 없이 드러냅니다.
theological_decisions:
- issue: 정결 예식의 의미 보존
  chosen_reading: 관례에 따라 몸을 정결하게 하고
  alternative_readings:
  - 관례에 따라 깨끗이 하고
  - 관례에 따라 씻고
  - 관례에 따라 자신을 정결하게 하고
  rationale: 본문의 ἁγνισθέντες는 단순 위생이 아니라 유대적 정결 관행을 가리키므로, 이를 흐리지 않도록 제의적·관습적 의미를 함께 살렸습니다.
  doctrine_reference: Translation philosophy §§1, 6
