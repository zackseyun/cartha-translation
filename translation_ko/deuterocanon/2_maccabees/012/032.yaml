  terminology: Ἰδουμαία는 ‘이두매아’로 유지했습니다. στρατηγός는 교파적 해석을 더하지 않고 기본적인 군사 용례에 따라 ‘장군’으로 옮겼습니다. ‘이른바 오순절’은 λεγομένην의 명명 방식을 간결하게 보존합니다.
