  yaml_path: translation/deuterocanon/2_maccabees/012/032.yaml
  text: But after the so-called Pentecost, they moved out against Gorgias, the governor of Idumea.
  footnotes:
  - marker: a
    text: Or, 'the feast called Pentecost.' The Greek literally says 'the one called Pentecost.'
    reason: lexical_alternative
  - marker: b
    text: '''Governor'' could also be rendered ''general'' or ''commander,'' since the Greek term can denote either civil or military leadership.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이른바 오순절이 지난 뒤에 그들은 이두매아의 총독 고르기아스를 향해 출정했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오순절이라 불리는 절기’. 그리스어는 문자적으로 ‘오순절이라고 불리는 그 것’을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘총독’은 그리스어 στρατηγός의 지역 통치적 뉘앙스를 따른 번역입니다. 문맥상 ‘장군’이나 ‘사령관’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ
  english_pob_choice: But after
  chosen_korean: 그러나 … 뒤에
  alternatives_korean:
  - 그런데 … 뒤에
  - 하지만 … 뒤에
  lexicon: LSJ
  rationale: 전환 접속사 δέ의 대조감을 살리되, 한국어 문맥에 자연스럽게 맞게 ‘그러나’로 옮겼습니다. Μετά는 시간상 ‘뒤에’로 처리했습니다.
- source_word: τὴν λεγομένην πεντηκοστὴν
  english_pob_choice: the so-called Pentecost
  chosen_korean: 이른바 오순절
  alternatives_korean:
  - 소위 오순절
  - 오순절이라고 불리는 절기
  lexicon: LSJ
  rationale: λεγομένην의 ‘불리는’ 의미를 살리되, 한국어에서는 ‘이른바’가 가장 간결하게 대응합니다. πεντηκοστήν은 문자적 ‘쉰째 날’보다 절기명 ‘오순절’이 원문의 고유 표현을 더 잘 드러냅니다.
- source_word: ὥρμησαν ἐπὶ
  english_pob_choice: they moved out against
  chosen_korean: 출정했습니다
  alternatives_korean:
  - 나아갔습니다
  - 공격하러 나섰습니다
  - 진군했습니다
  lexicon: LSJ
  rationale: 군사적 이동을 나타내는 ὥρμησαν을 한국어에서 자연스럽고 문맥상 적절한 군사 용어 ‘출정했습니다’로 옮겼습니다. ἐπὶ의 적대적 방향성은 문장 전체에서 충분히 전달됩니다.
- source_word: τὸν τῆς Ἰδουμαίας στρατηγόν
  english_pob_choice: the governor of Idumea
  chosen_korean: 이두매아의 총독 고르기아스
  alternatives_korean:
  - 이두매아의 장군 고르기아스
  - 이두매아의 사령관 고르기아스
  - 이두매아의 군사령관 고르기아스
  lexicon: LSJ
  rationale: στρατηγός는 군사 지휘관을 뜻할 수 있지만, 영어 POB의 audit trail이 지역 통치적 뉘앙스를 반영해 ‘governor’를 채택했으므로 한국어도 그 결정을 따라 ‘총독’으로 옮겼습니다. 지명은 음역형 ‘이두매아’를 사용했습니다.
theological_decisions:
- issue: 오순절 표현의 절기명 유지 여부
  chosen_reading: ‘이른바 오순절’로 절기명을 유지했습니다.
  alternative_readings:
  - ‘이른바 쉰째 날’
  - ‘오순절이라 불리는 절기’
  rationale: 본문의 λεγομένην은 단순한 시간표현이 아니라 ‘불리는’ 명명 방식을 드러내므로, 절기명 자체를 유지하면서 그 명명성을 함께 살렸습니다.
  doctrine_reference: 본문 충실성 및 축제 명칭의 서술 방식
