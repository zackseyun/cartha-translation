  text: Ἐκεῖθεν δὲ ἀποστάντες σταδίους ἐννέα, ποιουμένων τὴν πορίαν ἐπὶ τὸν Τιμόθεον, ἐπέβαλον Ἄραβες αὐτῷ οὐκ ἐλάττους τῶν πεντακισχιλίων, ἱππεῖς δὲ πεντακόσιοι.
