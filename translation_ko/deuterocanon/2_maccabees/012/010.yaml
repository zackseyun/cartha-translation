base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/010.yaml
  text: From there[a], after they had gone nine stadia, while making their march against Timotheus, Arabs fell upon him, no fewer than five thousand, and five hundred horsemen.
  footnotes:
  - marker: a
    text: Greek has the singular 'him' (αὐτῷ). Some translators may understand the reference collectively as Judas's force and render 'them,' but the source witness here is singular, so the main text preserves it.
    reason: alternative_reading
translation:
  language: ko
  text: 그곳을 떠나 아홉 스타디온을 간 뒤, 그들이 디모데를 향해 진군하던 중에 아랍인들이 그에게 덮쳐 왔습니다. 그들은 오천 명 이상이었고, 그 가운데 기병은 오백 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 단수 대명사 αὐτῷ(‘그에게’)를 사용합니다. 문맥상 유다의 부대와 같은 집단을 가리킨다고 이해할 수도 있지만, 이 본문은 단수형을 보존합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐκεῖθεν δὲ ἀποστάντες
  english_pob_choice: From there, after they had gone on
  chosen_korean: 그곳에서 그들이 ... 간 뒤
  alternatives_korean:
  - 그곳을 떠나
  - 그곳에서 떠난 뒤
  - 그곳에서 나아간 뒤
  lexicon: LSJ
  rationale: 출발 지점을 분명히 하되, ἀποστάντες의 이동 흐름을 자연스러운 서술로 살리기 위해 ‘간 뒤’로 옮겼습니다.
- source_word: σταδίους ἐννέα
  english_pob_choice: nine stadia
  chosen_korean: 아홉 스타디온
  alternatives_korean:
  - 아홉 스타디아
  - 약 1마일
  - 아홉 경기장 거리
  lexicon: LSJ
  rationale: 고대 거리 단위를 그대로 유지해 본문의 측정값을 투명하게 드러내고, 현대식 환산은 피했습니다.
- source_word: ποιουμένων τὴν πορίαν ἐπὶ τὸν Τιμόθεον
  english_pob_choice: while making their march against Timotheus
  chosen_korean: Timotheus를 향해 진군하던 중에
  alternatives_korean:
  - Timotheus를 향해 행군하던 중에
  - Timotheus를 상대로 나아가던 중에
  - Timotheus에게로 가던 중에
  lexicon: LSJ
  rationale: 군사적 문맥의 πορία를 ‘진군’으로 옮겨 진행성과 적대적 방향을 함께 살렸습니다.
- source_word: ἐπέβαλον Ἄραβες αὐτῷ
  english_pob_choice: Arabs fell upon him
  chosen_korean: 아라비아인들이 그에게 덮쳐 왔는데
  alternatives_korean:
  - 아라비아인들이 그를 습격했는데
  - 아라비아인들이 그에게 달려들었는데
  - 아라비아인들이 그에게 공격해 왔는데
  lexicon: LSJ
  rationale: ἐπέβαλον의 급작스러운 적대적 돌입을 ‘덮쳐 왔는데’로 살려 서술의 긴장감을 유지했습니다.
- source_word: οὐκ ἐλάττους τῶν πεντακισχιλίων, ἱππεῖς δὲ πεντακόσιοι
  english_pob_choice: no fewer than five thousand, and five hundred horsemen
  chosen_korean: 그 수는 오천 명보다 적지 않았고 기병은 오백 명이었습니다
  alternatives_korean:
  - 오천 명보다 적지 않았고 기병이 오백 명이었습니다
  - 적어도 오천 명이었고 기병은 오백 명이었습니다
  - 오천 명 이상이었고 기병은 오백 명이었습니다
  lexicon: LSJ
  rationale: οὐκ ἐλάττους는 하한을 나타내므로 ‘적지 않았다’로, ἱππεῖς는 집합명사적 용법을 살려 ‘기병’으로 옮겼습니다.
theological_decisions:
- issue: Singular αὐτῷ의 지시 대상
  chosen_reading: 본문의 단수 대명사를 그대로 반영해 ‘그에게’로 옮겼습니다.
  alternative_readings:
  - 문맥상 집단 지시로 ‘그들에게’
  - Judas의 부대를 가리키는 집합적 표현
  rationale: 제공된 그리스어 본문은 단수형 αὐτῷ를 읽으므로, 문맥상의 집단 해석을 본문에서 미리 평준화하지 않았습니다.
  doctrine_reference: 본문비평/문법적 투명성
- issue: 군사 서술의 적대성
  chosen_reading: ἐπὶ τὸν Τιμόθεον과 ἐπέβαλον의 적대적 뉘앙스를 유지했습니다.
  alternative_readings:
  - 단순히 Timotheus를 향해
  - 우연한 조우로 완화
  rationale: 문맥은 단순한 이동이 아니라 적대적 진격과 기습을 말하므로, 전투적 긴장을 약화시키지 않았습니다.
  doctrine_reference: 서사 문맥 보존
