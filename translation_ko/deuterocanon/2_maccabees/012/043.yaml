translation:
  language: ko
  text: 그리고 사람별로 거두어들인 다음, 은화 이천 드라크마를 예루살렘으로 보내어 죄를 위한 제물을 드리게 하였는데, 그는 매우 선하고도 품위 있게 행한 것이며, 부활을 생각하고 있었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 κατʼ ἀνδρολόγιον은 다소 기술적인 표현으로, 개인별로 계산해 거두는 징수나 명부에 따른 배정을 가리킬 수 있습니다.
    reason: lexical_alternative
