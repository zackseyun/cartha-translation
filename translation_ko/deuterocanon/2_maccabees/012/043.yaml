theological_decisions:
- issue: πάνυ καλῶς καὶ ἀστείως πράττων의 강한 칭찬을 어떻게 살릴 것인가
  chosen_reading: ‘매우 선하고도 품위 있게 행한 것’으로 옮겨, 행위에 대한 분명한 긍정 평가를 유지했습니다.
  alternative_readings:
  - 중립적으로 ‘잘 행한 것’이라고 완화하는 번역
  - ‘아주 훌륭하고 품위 있게’로 더 강하게 옮기는 번역
  rationale: 그리스어 원문은 단순 서술이 아니라 뚜렷한 찬사를 담고 있으므로, 그 평가를 약화시키지 않되 한국어 문체상 과도한 장식은 피했습니다.
  doctrine_reference: 원문의 평가적 어조 보존
- issue: ἀνάστασις를 어떻게 범위 없이 옮길 것인가
  chosen_reading: ‘부활’로 직역해, 원문에 없는 ‘죽은 자의’ 같은 추가를 넣지 않았습니다.
  alternative_readings:
  - ‘죽은 자의 부활’
  - ‘부활 사건’
  rationale: 본문은 명사만 제시하며, 문맥이 넓게 부활 신앙을 가리키므로 한국어에서도 과잉 해석 없이 간결하게 유지했습니다.
  doctrine_reference: 문맥에 근거한 최소 보충 원칙
