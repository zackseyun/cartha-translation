translation:
  language: ko
  text: 그는 사람마다 모금을 하여 은화 이천 드라크마를 예루살렘으로 보내, 죄를 위한 제사를 드리게 하였습니다. 그는 부활을 숙고하고 있었으므로 매우 훌륭하고 고결하게 행한 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 κατʼ ἀνδρολόγιον은 다소 기술적인 표현으로, 사람마다 거두는 모금·부과 또는 사람들의 명부에 따른 절차를 가리킬 수 있습니다.
    reason: lexical_alternative
