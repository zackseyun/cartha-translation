base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/016.yaml
  text: And when they had taken the city by the will of God[a], they made an immeasurable slaughter, so that the nearby lake, having a width of two stadia, appeared to be overflowing[b], filled with blood.
  footnotes:
  - marker: a
    text: A stadion was an ancient unit of length; two stadia are roughly 370 meters or about 400 yards.
    reason: cultural_note
  - marker: b
    text: Or 'appeared to be filled with blood.' The Greek imagery is vivid and may suggest the lake looked as though blood were flowing into or through it until it seemed full.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 하나님의 뜻으로 그 성읍을 점령하고 나서는, 헤아릴 수 없는 학살을 자행하였으며, 그리하여 폭이 두 스타디온인 인근 호수는 피가 가득 차 넘치는 것처럼 보였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 스타디온(stadion)은 고대 길이 단위로, 두 스타디온은 대략 370미터 또는 400야드 정도입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘피로 가득 찬 것처럼 보였습니다.’라는 뜻일 수 있습니다. 그리스어의 이미지는 매우 생생하며, 피가 호수 안으로 흘러들어 가득 찬 듯 보였다는 뉘앙스를 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλαβόμενοι
  english_pob_choice: had taken
  chosen_korean: 점령하고 나서는
  alternatives_korean:
  - 차지하고 나서는
  - 함락시키고 나서는
  lexicon: LSJ
  rationale: 군사적 맥락에서 도시를 ‘취하다/점령하다’의 뜻으로 이해하는 것이 자연스러우며, 앞뒤 동작 순서를 살려 분사 구조를 한국어로 매끈하게 옮겼습니다.
- source_word: τῇ τοῦ θεοῦ θελήσει
  english_pob_choice: by the will of God
  chosen_korean: 하나님의 뜻으로
  alternatives_korean:
  - 하나님의 뜻에 따라
  - 하나님의 뜻에 의해
  lexicon: LSJ
  rationale: 원문의 여격 표현은 하나님의 의지·뜻에 따른 원인/방식을 나타내므로, 한국어에서는 ‘뜻으로’가 간결하면서도 신학적 주장(하나님의 의지 아래 일어남)을 유지합니다.
- source_word: ἀμυθήτους ἐποιήσαντο σφαγάς
  english_pob_choice: made an immeasurable slaughter
  chosen_korean: 헤아릴 수 없는 학살을 자행하였으며
  alternatives_korean:
  - 셀 수 없는 학살을 벌였으며
  - 말로 다 할 수 없는 학살을 저질렀으며
  lexicon: LSJ
  rationale: ἀμυθήτους의 과장된 불가계산성은 ‘헤아릴 수 없는’으로, σφαγάς는 전투적 대량살육의 강도를 살려 ‘학살’로 옮겼습니다.
- source_word: τὸ πλάτος ἔχουσαν σταδίους δύο
  english_pob_choice: having a width of two stadia
  chosen_korean: 폭이 두 스타디온인
  alternatives_korean:
  - 두 스타디온 너비의
  - 두 스타디온 폭을 가진
  lexicon: LSJ
  rationale: 측정 단위를 유지해 원문 정보를 보존했고, 호수의 폭을 설명하는 분사구를 한국어 관계절처럼 압축했습니다.
- source_word: καταρρεῖν ... φαίνεσθαι
  english_pob_choice: appeared to be overflowing ... filled with blood
  chosen_korean: 피가 가득 차 넘치는 것처럼 보였습니다
  alternatives_korean:
  - 피로 가득 찬 듯 보였습니다
  - 피가 넘쳐흐르는 것처럼 보였습니다
  lexicon: LSJ
  rationale: 원문의 시각적 과장은 ‘보이다’와 ‘넘치다/가득 차다’를 함께 살려야 하므로, 영어 POB의 이미지와 그리스어의 생생함을 모두 반영했습니다.
theological_decisions:
- issue: 도시 점령의 원인으로서 하나님의 뜻
  chosen_reading: 하나님의 뜻으로 성읍이 점령되었다고 직설적으로 옮겼습니다.
  alternative_readings:
  - 하나님께서 허락하셔서
  - 하나님의 섭리 안에서
  rationale: 원문은 사건의 원인을 하나님의 뜻에 명시적으로 귀속하므로, 이를 완화하지 않고 본문이 가진 신학적 진술을 그대로 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; original-language primacy over translation tradition.'
