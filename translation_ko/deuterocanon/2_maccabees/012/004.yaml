base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/004.yaml
  text: But after the common resolution of the city[a], and when these men had accepted it as though they wanted peace and had nothing suspicious in mind, they took them away and drowned them, no fewer than two hundred of them.
  footnotes:
  - marker: a
    text: Or 'had nothing suspect about them'; the Greek phrase may describe either their apparent innocence or the absence of suspicious intent.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그 성의 공동 결의가 내려진 뒤, 이 사람들이 그것을 받아들여 마치 평화를 원하고 아무런 수상한 점도 없는 것처럼 보였을 때, 그들을 끌고 가서 익사시켰는데, 그 수가 이백 명도 적지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들에게 수상한 점이 없었다’; 그리스어 표현은 그들의 겉보기 무해함을 가리킬 수도 있고, 의심스러운 의도가 없었다는 뜻일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ κοινὸν τῆς πόλεως ψήφισμα
  english_pob_choice: the common resolution of the city
  chosen_korean: 그 성의 공동 결의
  alternatives_korean:
  - 그 성의 공적 칙령
  - 그 성의 공동 표결
  - 그 성의 일반적 결정
  lexicon: LSJ
  rationale: ψήφισμα는 공식적인 결정이나 결의라는 뜻이고, τὸ κοινόν은 공동성·집단성을 더하므로 ‘공동 결의’가 가장 간결하게 그 뉘앙스를 살립니다.
- source_word: τούτων ἐπιδεξαμένων
  english_pob_choice: these men had accepted it
  chosen_korean: 이 사람들이 그것을 받아들여
  alternatives_korean:
  - 이 사람들이 그것에 동의하여
  - 이 사람들이 그것을 수용하여
  lexicon: LSJ
  rationale: ἐπιδέχομαι는 여기서 제안을 받아들이는 의미이므로, 문맥상 자연스럽고 중립적인 ‘받아들이다’가 적절합니다.
- source_word: ὡς ἂν εἰρηνεύειν θέλοντων καὶ μηδὲν ὑπόπτον ἐχόντων
  english_pob_choice: as though they wanted peace and had nothing suspicious in mind
  chosen_korean: 마치 평화를 원하고 아무런 수상한 점도 없는 것처럼
  alternatives_korean:
  - 마치 평화를 바라며 아무런 의심스러운 점도 없는 것처럼
  - 평화를 원하는 듯하고 아무 의심도 없는 듯
  lexicon: LSJ
  rationale: ὡς ἂν은 ‘~인 것처럼’의 가장자리를 유지하고, μηδὲν ὑπόπτον은 의도보다 외형상의 무해함을 가리킬 수 있어 ‘수상한 점’으로 옮겼습니다.
- source_word: ἀχθέντας
  english_pob_choice: they took them away
  chosen_korean: 그들을 끌고 가서
  alternatives_korean:
  - 그들을 데려가서
  - 그들을 이끌고 가서
  lexicon: LSJ
  rationale: ἄγω의 수동 분사로 ‘끌려가다/데려가다’의 흐름이므로, 뒤의 살해 행위로 이어지는 동작을 드러내는 ‘끌고 가서’가 자연합니다.
- source_word: ἐβύθισαν
  english_pob_choice: drowned them
  chosen_korean: 익사시켰는데
  alternatives_korean:
  - 물속에 잠기게 했는데
  - 깊은 물에 빠뜨렸는데
  lexicon: LSJ
  rationale: βυθίζω는 ‘가라앉히다, 물속에 잠기게 하다’이지만 사람을 목적어로 하므로 결과를 분명히 하는 ‘익사시키다’가 더 정확합니다.
- source_word: ὄντας οὐκ ἔλαττον τῶν διακοσίων
  english_pob_choice: no fewer than two hundred of them
  chosen_korean: 그 수가 이백 명도 적지 않았습니다
  alternatives_korean:
  - 적어도 이백 명이었습니다
  - 이백 명에 못 미치지 않았습니다
  lexicon: LSJ
  rationale: οὐκ ἔλαττον은 하한을 표시하므로 ‘이백 명도 적지 않았다’가 숫자의 최소값을 한국어 관용으로 자연스럽게 전달합니다.
