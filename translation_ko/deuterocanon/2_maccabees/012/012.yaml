  text: But Judas[a], recognizing that they were truly useful to them in many ways, agreed to keep peace with them; and after giving right hands, they parted to their tents.
  footnotes:
  - marker: a
    text: Literally, 'after giving right hands'—a customary gesture of pledge or agreement.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 유다는 그들이 여러 면에서 유다와 그의 사람들에게 참으로 유익하다는 것을 판단하고, 그들과 평화를 유지하기로 하였습니다. 그리고 서로 오른손을 맞잡은 뒤, 그들은 각자의 천막으로 헤어졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어로는 문자 그대로 ‘오른손들을 받고/취한 뒤’입니다. 이는 합의나 서약을 나타내는 관습적인 몸짓입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ὑπολαβών
  english_pob_choice: recognizing
  chosen_korean: 알아차리고
  alternatives_korean:
  - 인정하고
  - 깨닫고
  - 판단하고
  lexicon: LSJ
  rationale: 문맥상 유다는 상황을 단순히 추정한 것이 아니라, 상대의 유익성을 살펴보고 판단한 것으로 보이므로 ‘알아차리고’가 자연스럽고 의미를 잘 드러냅니다.
- source_word: ἐν πολλοῖς αὐτοὺς χρησίμους
  english_pob_choice: truly useful to them in many ways
  chosen_korean: 여러 면에서 자신들에게 참으로 유익하다는
  alternatives_korean:
  - 여러 일에서 자신들에게 유용하다는
  - 많은 점에서 자신들에게 도움이 된다는
  lexicon: LSJ
  rationale: χρησίμους의 실용적 유익을 살리되, ἐν πολλοῖς의 넓은 범위를 ‘여러 면에서’로 옮겨 지나친 축소를 피했습니다.
- source_word: λαβόντες δεξιάς
  english_pob_choice: after giving right hands
  chosen_korean: 오른손을 내밀고 나서
  alternatives_korean:
  - 오른손을 주고받고 나서
  - 오른손을 맞잡고 나서
  - 오른손을 내민 뒤
  lexicon: LSJ
  rationale: 본문의 구체적 몸짓을 유지하되 한국어로는 관용적으로 이해되도록 ‘오른손을 내밀고 나서’로 옮겼습니다.
- source_word: εἰς τὰς σκηνὰς ἐχωρίσθησαν
  english_pob_choice: they parted to their tents
  chosen_korean: 자기들의 천막으로 헤어졌습니다
  alternatives_korean:
  - 자기들의 천막으로 흩어졌습니다
  - 자기들의 장막으로 돌아갔습니다
  lexicon: LSJ
  rationale: 군사적 야영 장면을 보존하기 위해 ‘천막’을 택했고, ἐχωρίσθησαν의 분리를 ‘헤어졌습니다’로 간결하게 살렸습니다.
theological_decisions:
- issue: 오른손을 내미는 행위의 의미
  chosen_reading: 본문에는 조약이나 화해의 구체적 법적 용어보다, 합의의 몸짓인 ‘오른손을 내미는’ 장면을 그대로 살겼습니다.
  alternative_readings:
  - ‘맹약을 맺고’
  - ‘화친의 표시를 하고’
  rationale: 그리스어는 관습적 합의 제스처를 직접 제시할 뿐이므로, 본문이 말하는 정도를 넘어서 법적·의례적 의미를 과도하게 특정하지 않도록 했습니다.
  doctrine_reference: 'translation philosophy: original-language primacy; preserve significant lexical decisions'
