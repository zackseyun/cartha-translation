  source_fidelity: ‘오른손을 내밀고’는 λαβόντες δεξιάς가 나타내는 상호적 합의 행위를 충분히 반영하지 못하며, 주석의 ‘직역하면’도 λαβόντες(‘받고/취하고’)와 정확히 맞지 않습니다. 또한 ‘자신들에게’는 유다 한 사람을 주어로 둔 한국어 문장에서 지시 대상이 다소 불분명합니다.
  naturalness: ‘유다와 그의 사람들에게’와 ‘서로 오른손을 맞잡은 뒤’는 현대 한국어 합쇼체에서 자연스럽고, 군사적·외교적 장면도 유지합니다. ‘각자의 천막으로 헤어졌습니다’는 원문의 분산·귀환 의미를 자연스럽게 표현합니다.
  terminology: 유다, 평화, 천막은 적절합니다. δεξιάς의 관습적 합의 몸짓은 법적 의미를 과도하게 특정하지 않고 ‘서로 오른손을 맞잡다’로 구체적으로 보존하는 것이 적절합니다.
  issues:
