translation:
  language: ko
  text: 그러므로 그들은 모두 의로우신 재판관이신 주님께 복을 빌며, 숨겨진 것들을 드러내시는 분을 찬양했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “의로우신 재판관이신 주님의 일들”이라는 뜻일 수 있습니다. 그리스어 표현은 생략적이어서 문자적으로는 “의로우신 재판관이신 주님의 것들”에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογήσαντες
  english_pob_choice: blessed
  chosen_korean: 복을 빌며
  alternatives_korean:
  - 찬양하며
  - 복을 빌었습니다
  lexicon: BDAG
  rationale: 여기서 εὐλογέω는 하나님께 드리는 경배적 응답을 가리키므로, 단순한 '찬양하다'보다 축복/복 빌기의 방향을 살린 표현이 적합합니다.
- source_word: τὰ τοῦ δικαιοκρίτου κυρίου
  english_pob_choice: the ways of the Lord, the righteous judge
  chosen_korean: 의로우신 재판관이신 주님
  alternatives_korean:
  - 의로운 재판관이신 주님
  - 의로우신 심판자이신 주님
  lexicon: LSJ
  rationale: 그리스어는 생략된 목적어를 가진 탄력적인 표현이어서, 한국어에서는 앞뒤를 자연스럽게 묶어 '의로우신 재판관이신 주님'으로 옮겼습니다. '재판관'은 δικαιοκρίτου의 '공정하게 판결하는 분'이라는 의미를 직접 살립니다.
- source_word: τὰ κεκρυμμένα
  english_pob_choice: the hidden things
  chosen_korean: 숨겨진 것들을
  alternatives_korean:
  - 감추어진 것들을
  - 은밀한 것들을
  lexicon: LSJ
  rationale: 완료 수동 분사로서 '이미 숨겨져 있는 것들'의 상태를 나타내므로, 현대 한국어에서 자연스러운 '숨겨진 것들'이 가장 가깝습니다.
- source_word: φανερὰ ποιοῦντος
  english_pob_choice: makes the hidden things manifest
  chosen_korean: 드러내시는 분
  alternatives_korean:
  - 분명히 하시는 분
  - 나타내시는 분
  lexicon: BDAG
  rationale: 직역하면 '보이게 하시는'인데, 문맥상 숨겨진 것을 공개적으로 드러내는 뜻이므로 '드러내시는 분'이 가장 간결하고 충실합니다.
theological_decisions:
- issue: κυρίου의 호칭 번역
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 주인
  rationale: 하나님을 가리키는 κύριος는 이 문맥에서 경배의 호칭이므로, 한국어 독자에게도 자연스럽고 경외감을 유지하는 '주님'을 택했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → Lord'
- issue: τὰ τοῦ δικαιοκρίτου κυρίου의 해석 범위
  chosen_reading: 의로우신 재판관이신 주님
  alternative_readings:
  - 주님의 일들
  - 주님의 행하심
  rationale: 그리스어는 문법적으로 다소 생략적이지만, 문맥상 하나님의 공의로운 판결과 드러내심을 함께 가리킵니다. 의미를 좁혀 '행위'만 말하기보다, 원문의 신학적 폭을 보존하는 쪽이 더 적절합니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
