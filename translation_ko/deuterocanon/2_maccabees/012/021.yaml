  naturalness: 현 문장의 ‘그곳은 … 어려운 곳이었기 때문입니다’는 문법상 가능하지만, ‘때문입니다’가 앞 문장의 파송 이유를 받는 구조임을 더 분명하게 하려면 주어를 ‘그곳이’로 두는 것이 자연스럽습니다. ‘주변의 모든 곳이 좁아서’는 한국어로 자연스러우면서 원문의 다소 포괄적인 지리적 표현을 유지합니다.
