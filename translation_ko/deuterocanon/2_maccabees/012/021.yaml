  yaml_path: translation/deuterocanon/2_maccabees/012/021.yaml
  text: But when Timothy learned of Judas’s advance[a], he sent the women and the rest of the baggage ahead to the place called Carnion, for the place was hard to besiege and difficult to approach because of the narrowness of all the surrounding terrain.
  footnotes:
  - marker: a
    text: Or, more literally, 'because of the narrowness of all the places,' referring to the constricted approaches around the site.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 티모테오가 유다의 진군 소식을 듣고는 여자들과 나머지 짐을 카르니온이라 불리는 곳으로 먼저 보냈습니다. 그곳이 주변의 모든 곳이 좁아서 포위하기도 어렵고 접근하기도 어려운 곳이었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘모든 곳의 좁음 때문에’에 가깝고, 이곳 주변의 협소한 접근로들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφοδον
  english_pob_choice: advance
  chosen_korean: 진군
  alternatives_korean:
  - 공격
  - 습격
  - 출정
  lexicon: LSJ
  rationale: 유다의 군사적 이동을 가리키므로 ‘진군’이 영어 POB의 ‘advance’를 자연스럽게 살리면서도 공격 개시 여부를 과도하게 단정하지 않습니다.
- source_word: μεταλαβὼν
  english_pob_choice: learned of
  chosen_korean: 소식을 듣고는
  alternatives_korean:
  - 알고는
  - 전해 듣고는
  - 정보를 받고는
  lexicon: LSJ
  rationale: 직역의 ‘받다’보다 한국어에서는 ‘소식을 듣다’가 뉴스 수령의 의미를 가장 자연스럽게 전달합니다.
- source_word: προεξαπέστειλεν
  english_pob_choice: sent ... ahead
  chosen_korean: 먼저 보냈습니다
  alternatives_korean:
  - 미리 보냈습니다
  - 앞질러 보냈습니다
  - 사전에 보냈습니다
  lexicon: LSJ
  rationale: 복합동사의 선행·전진 의미를 ‘먼저’로 살려, 여자들과 짐을 안전을 위해 앞서 이동시킨 뉘앙스를 반영했습니다.
- source_word: τὰς γυναῖκας καὶ τὴν ἄλλην ἀποσκευήν
  english_pob_choice: the women and the rest of the baggage
  chosen_korean: 여자들과 나머지 짐
  alternatives_korean:
  - 여자들과 나머지 소지품
  - 여자들과 다른 짐
  - 여자들과 남은 물품
  lexicon: LSJ
  rationale: ἀποσκευήν은 휴대 가능한 짐·물품을 가리키므로 ‘짐’이 가장 간결하고 문맥상 적절합니다.
- source_word: διὰ τὴν πάντων τῶν τόπων στενότητα
  english_pob_choice: because of the narrowness of all the surrounding terrain
  chosen_korean: 사방의 지형이 좁아
  alternatives_korean:
  - 모든 통로가 좁아
  - 주변의 모든 길목이 좁아
  - 주변 지형 전체가 협소하여
  lexicon: LSJ
  rationale: 직역상 ‘모든 장소들의 좁음’이지만, 포위·접근 곤란의 원인을 한국어로 자연스럽게 풀어 ‘사방의 지형’으로 옮겼습니다.
