- from: 그러나 바로 그 티모테오스는 도시테오스와 소시파트로스 쪽 사람들에게 붙잡히자, 자신을 무사히 놓아 달라고 많은 궤변으로 간청했습니다. 많은 이들의 부모를, 또 다른 이들의 형제를 자신이 쥐고 있으니, 그들도 하찮게 여겨지게 될 것이라고 하면서 말입니다.[a][b]
  to: 그러나 티모테오스 자신은 도시테오스와 소시파트로스의 일행에게 사로잡히자, 자신을 무사히 풀어 달라고 온갖 교활한 말로 간청했습니다.[a] 그는 많은 이들의 부모와 다른 이들의 형제들을 붙들고 있으므로, 그들이 하찮게 여김을 받게 될 것이라고 말했습니다.[b]
  rationale: 집단 관용구를 자연스러운 성경 문체로 명료화하고, γοητία의 의미 범위를 보존했습니다. 또한 결말의 대상이 부모와 형제들임을 분명히 하되, 원문에 없는 조건을 각주에서 단정하지 않도록 고쳤습니다. 각주 표지는 각각 해당 어구 바로 뒤에 배치했습니다.
