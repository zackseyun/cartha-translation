base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/024.yaml
  text: But Timothy himself[a], having fallen into the hands of those with Dositheus and Sosipater, begged with much cunning to be let go unharmed, because he had the parents of many of them, and of others their brothers[b], and it would happen that these would be disregarded.
  footnotes:
  - marker: a
    text: Or 'with much guile' or 'with much trickery'; the Greek γοητία here likely refers to crafty or deceptive pleading rather than literal sorcery.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek is compressed: Timothy argues that he has many of their parents and others'' brothers in his power, so if they kill him those relatives would be treated as of no account.'
    reason: cultural_note
translation:
  language: ko
  text: 그러나 티모테오스 자신은 도시테오스와 소시파트로스의 일행에게 사로잡히자, 자신을 무사히 풀어 달라고 온갖 교활한 말로 간청했습니다.[a] 그는 많은 이들의 부모와 다른 이들의 형제들을 붙들고 있으므로, 그들이 하찮게 여김을 받게 될 것이라고 말했습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: γοητία는 여기서 문자적 ‘마술’이라기보다 기만적이거나 교활한 설득과 술책을 가리킬 가능성이 높습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 압축적입니다. 티모테오스는 많은 이들의 부모와 다른 이들의 형제들을 자신이 붙들고 있다고 말하며, 그들이 하찮게 여김을 받게 될 것이라고 주장합니다. 이 결과가 구체적으로 어떻게 일어나는지는 본문에 명시되지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἐμπεσὼν τοῖς περὶ τὸν Δωσίθεον καὶ Σωσίπατρον
  english_pob_choice: having fallen into the hands of those with Dositheus and Sosipater
  chosen_korean: 도시테오스와 소시파트로스 쪽 사람들에게 붙잡히자
  alternatives_korean:
  - 도시테오스와 소시파트로스와 함께한 이들에게 붙잡히자
  - 도시테오스와 소시파트로스 주변의 사람들에게 붙잡히자
  lexicon: LSJ
  rationale: ἐμπεσὼν은 단순한 ‘들어감’이 아니라 적대적 상황에서 ‘붙잡히다/닥치다’의 뜻이므로, 포획 상황을 분명히 드러냈습니다. τοῖς περὶ + 대격은 지도자와 그 주변 인물들을 가리키는 관용구이므로 ‘쪽 사람들’로 자연스럽게 옮겼습니다.
- source_word: ἠξίου
  english_pob_choice: begged
  chosen_korean: 간청했습니다
  alternatives_korean:
  - 부탁했습니다
  - 애원했습니다
  lexicon: LSJ
  rationale: 포로가 풀려나기를 구하는 절박한 맥락이므로, 단순한 ‘요청’보다 강한 ‘간청’이 더 가깝습니다.
- source_word: μετὰ πολλῆς γοητίας
  english_pob_choice: with much cunning
  chosen_korean: 많은 궤변으로
  alternatives_korean:
  - 많은 간교함으로
  - 많은 속임수로
  - 많은 꾀로
  lexicon: LSJ
  rationale: γοητία는 여기서 문자적 마술이 아니라 기만적·교활한 말재주를 가리키므로, 논변의 허위를 드러내는 ‘궤변’으로 옮겼습니다. 영어 POB의 ‘cunning’과 같은 비난적 뉘앙스를 살렸습니다.
- source_word: ὡς σῷον αὐτόν
  english_pob_choice: unharmed
  chosen_korean: 무사히
  alternatives_korean:
  - 상처 없이
  - 해를 입지 않고
  lexicon: LSJ
  rationale: σῷον은 ‘온전한, 무사한’의 뜻으로, 감금에서 풀려나는 상황에서는 ‘무사히’가 가장 간결하고 자연스럽습니다.
- source_word: ἀλογηθῆναι
  english_pob_choice: be disregarded
  chosen_korean: 하찮게 여겨지게 될
  alternatives_korean:
  - 무시당하게 될
  - 아무것도 아닌 것으로 여겨지게 될
  lexicon: LSJ
  rationale: ἀλογηθῆναι는 ‘고려되지 않다, 하찮게 취급되다’의 뜻이므로, 관계의 상실보다 경시·무시의 결과를 드러내는 표현을 택했습니다.
