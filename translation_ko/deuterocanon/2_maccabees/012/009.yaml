  text: καὶ τοῖς Ἰαμνίταις νυκτὸς ἐπιβαλὼν ἐνέπρησεν τὸν λιμένα σὺν τῷ στόλῳ, ὥστε ἐπιφαίνεσθαι τὰς αὐγὰς τοῦ φέγγους εἰς τὰ Ἱεροσό- λυμα, σταδίων ὄντων διακοσίων τεσσεράκοντα.
