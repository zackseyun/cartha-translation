  source_fidelity: 개정이 필요합니다. χιτών의 단수와 ἑκάστου의 분배적 의미는 ‘죽은 사람 하나하나의 속옷’으로 자연스럽게 살릴 수 있습니다. Ἰαμνίας는 ‘얌니아’로 바로잡아야 하며, ἀφʼ ὧν은 율법이 유대인들이 해당 물건들을 지니지 못하게 한다는 뜻이므로 그 대상을 명시하는 것이 안전합니다. 마지막 인과절은 ‘이 때문에 이들이 쓰러졌다’로 보존합니다.
  naturalness: 현 번역의 ‘죽은 사람들의 각각의 속옷’과 ‘우상들에게 속한 성물들’은 부자연스럽습니다. 또한 두 문장 사이의 연결과 각주 위치가 뜻과 맞지 않습니다. 개정문은 현대 표준어 합쇼체로 문장을 매끄럽게 정리했습니다.
  terminology: ‘야바네’는 원문의 지명 Ἰαμνίας(Jamnia)에 맞지 않으므로 ‘얌니아’로 수정했습니다. ἱερώματα는 정확한 물품 형태가 불확정이므로 ‘성물’로 유지하되, 우상과의 관계를 ‘얌니아 우상들의’로 표시했습니다. πεπτωκέναι는 본문의 전투 관용을 따라 ‘쓰러졌다’로 번역하고 각주를 해당 낱말에 붙였습니다.
