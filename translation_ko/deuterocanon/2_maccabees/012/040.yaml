base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/040.yaml
  text: But under the tunic of each of the dead they found sacred tokens of the idols of Jamnia[a], which the law forbids the Jews to have[b]; and it became clear to all that for this reason these men had fallen.
  footnotes:
  - marker: a
    text: Or 'sacred objects,' 'votive offerings,' or possibly 'amulets' of the idols from Jamnia.
    reason: lexical_alternative
  - marker: b
    text: '''Had fallen'' is a battle idiom meaning they had been killed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 죽은 사람들의 각각의 속옷 아래에서 야바네의 우상들에게 속한 성물들을 발견했는데[a], 율법이 유대인들에게 금하는 것이었습니다[b]. 그래서 이 일로 그들이 쓰러진 이유가 모두에게 분명해졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우상에게 바쳐진 성물’, ‘봉헌물’, 혹은 ‘부적’일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기의 ‘쓰러진’은 전투 관용으로, 곧 죽임을 당했다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: χιτῶνας
  english_pob_choice: tunics
  chosen_korean: 속옷
  alternatives_korean:
  - 겉옷
  - 튠닉
  - 의복
  lexicon: LSJ
  rationale: χιτών은 고대의 안에 입는 옷을 가리키므로, 문맥상 ‘속옷’이 몸에 직접 닿는 내의류라는 점을 살리면서도 자연스럽습니다.
- source_word: ἱερώματα
  english_pob_choice: sacred tokens
  chosen_korean: 성물
  alternatives_korean:
  - 성스러운 물건
  - 봉헌물
  - 부적
  lexicon: LSJ
  rationale: 의상 속에 숨겨진 우상 관련 종교 물품이라는 점을 살리되, 정확한 형태를 과도하게 특정하지 않기 위해 포괄적인 ‘성물’을 택했습니다.
- source_word: τῶν ἀπὸ Ἰαμνίας εἰδώλων
  english_pob_choice: of the idols from Jamnia
  chosen_korean: 야바네의 우상들에게 속한
  alternatives_korean:
  - 야바네에서 온 우상의
  - 야바네의 우상들의
  - 야바네 우상들의
  lexicon: LSJ
  rationale: 지리적 연관을 가진 소유/귀속 관계를 한국어로 자연스럽게 풀어, ‘우상들에게 속한’으로 옮겨 원문의 연결을 보존했습니다.
- source_word: ἀπήργει
  english_pob_choice: forbids
  chosen_korean: 금하는
  alternatives_korean:
  - 금지하는
  - 허락하지 않는
  - 막는
  lexicon: LSJ
  rationale: 율법의 법적 금지를 간결하고 현대적인 한국어로 표현하는 데 가장 직접적입니다.
- source_word: πεπτωκέναι
  english_pob_choice: had fallen
  chosen_korean: 쓰러진
  alternatives_korean:
  - 죽은
  - 넘어진
  - 무너진
  lexicon: LSJ
  rationale: 전투 맥락에서 ‘falls’가 죽음을 뜻하는 관용이므로, 직설적인 ‘죽다’보다 전투적 뉘앙스를 살리는 ‘쓰러진’이 원문을 더 잘 보존합니다.
theological_decisions:
- issue: 죽음의 원인에 대한 서술 방식
  chosen_reading: 본문의 인과는 그대로 유지하되, 서술어를 덧붙여 교리적으로 해석하지 않고 ‘이 일로…분명해졌습니다’로 마무리했습니다.
  alternative_readings:
  - ‘이 때문에 죽었습니다’처럼 더 직접적으로 원인을 단정하는 번역
  - ‘이 때문에 넘어졌습니다’처럼 군사적 함의를 약화시키는 번역
  rationale: 그리스어는 공동체가 원인을 분명히 깨달았다고 말하므로, 번역도 그 인과 판단을 보존하되 과잉 해석은 피했습니다.
  doctrine_reference: 본문의 진술을 보존하고 신학적 긴장을 해소하지 않기
- issue: ‘율법’과 우상 제물의 금지
  chosen_reading: 율법이 유대인들에게 금하는 것으로 옮겨, 음식 규정이 아니라 우상 관련 물품 금지를 드러냈습니다.
  alternative_readings:
  - ‘율법이 유대인들이 갖는 것을 금하는’처럼 더 매끄럽게 바꾸는 번역
  - ‘율법이 유대인들을 금하는’처럼 주어를 바꾸는 번역
  rationale: 원문은 유대인이 소유/휴대할 수 없는 우상 관련 물품을 가리키므로, 금지 대상이 분명히 드러나도록 처리했습니다.
  doctrine_reference: 율법의 정결·우상 금지 맥락 보존
