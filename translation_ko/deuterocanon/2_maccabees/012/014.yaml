base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/014.yaml
  text: But those inside[a], trusting in the strength of the walls and in the supply of provisions, treated Judas and his men more arrogantly, reviling them[b], and even blaspheming and speaking what is not lawful.
  footnotes:
  - marker: a
    text: Or 'those around Judas.' The Greek idiom refers to Judas's company or forces.
    reason: lexical_alternative
  - marker: b
    text: '''Speaking what is not lawful'' may also be rendered ''saying what ought not be said,'' with moral or religious force.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그 안에 있던 사람들은[a] 성벽의 견고함과 양식의 비축을 믿고, 유다와 그를 따르는 이들을 더욱 오만하게 대하면서, 그들을 욕하고, 더욱이 신성을 모독하며, 해서는 안 될 말을 했습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 성 안이나 요새 안에 있던 수비자들을 가리킬 수 있습니다.
    reason: contextual_clarification
  - marker: b
    text: ‘해서는 안 될 말’은 ‘옳지 않은 말’ 또는 ‘허용되지 않은 말’로도 옮길 수 있습니다. 이 표현은 법률적 위법만 아니라 도덕적·종교적으로 마땅하지 않은 말을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἔνδον
  english_pob_choice: those inside
  chosen_korean: 안에 있는 사람들
  alternatives_korean:
  - 그 안에 있는 자들
  - 성 안의 사람들
  lexicon: LSJ
  rationale: 공간을 나타내는 ἔνδον을 자연스러운 현대 한국어로 옮기되, 내부에 있는 수비자들을 가리키는 뜻을 유지했습니다.
- source_word: τῇ τῶν τειχέων ἐρυμνότητι
  english_pob_choice: in the strength of the walls
  chosen_korean: 성벽의 견고함
  alternatives_korean:
  - 성벽의 강함
  - 성벽의 방어력
  lexicon: LSJ
  rationale: ἐρυμνότης는 단순한 물리적 강도보다 방어 가능한 견고함을 가리키므로, 전투·포위 맥락에 맞게 '견고함'으로 옮겼습니다.
- source_word: τῇ τε τῶν βρωμάτων παραθέσει
  english_pob_choice: in the supply of provisions
  chosen_korean: 양식의 비축
  alternatives_korean:
  - 식량의 공급
  - 음식의 저장
  lexicon: LSJ
  rationale: βρώματα와 παράθεσις는 포위 상황의 식량 확보를 뜻하므로, 군사적 문맥이 드러나도록 '비축'을 택했습니다.
- source_word: ἀναυθαγέστερον ἐχρῶντο
  english_pob_choice: treated ... more arrogantly
  chosen_korean: 더욱 거만하게 대하며
  alternatives_korean:
  - 더욱 오만하게 대하며
  - 더욱 무례하게 대하며
  lexicon: LSJ
  rationale: 상대에 대한 태도의 비교급이므로, '거만하게 대하다'로 insolent/arrogant의 뉘앙스를 살렸습니다.
- source_word: λοιδοροῦντες / βλασφημοῦντες / λαλοῦντες ἃ μὴ θέμις
  english_pob_choice: reviling them, and even blaspheming and speaking what is not lawful
  chosen_korean: 그들을 모독하고, 심지어 합법적이지 않은 말까지 했습니다
  alternatives_korean:
  - 그들을 욕하고, 심지어 신성모독하며, 해서는 안 될 말을 했습니다
  - 그들을 욕하고, 심지어 법도에 어긋나는 말을 했습니다
  lexicon: BDAG / LSJ
  rationale: λοιδορεῖν의 모욕성을 '모독하다'로, βλασφημεῖν의 종교적 무게는 남기되 한국어에서 과도하게 특정화하지 않도록 했습니다. θέμις는 '허용됨/옳음'의 뜻이 있어 '합법적이지 않은 말'로 옮겼습니다.
theological_decisions:
- issue: βλασφημοῦντες의 종교적 강도 유지
  chosen_reading: 단순한 욕설로 평면화하지 않고 '모독하다'로 처리해, 이어지는 '허용되지 않은 말'과 함께 점증하는 경멸과 불경의 뉘앙스를 보존했습니다.
  alternative_readings:
  - '''욕하다''로 일반화하기'
  - '''신성모독하다''로 더 강하게 특정하기'
  rationale: 문맥상 단순한 조롱을 넘어서는 언어적·종교적 무례가 누적되지만, 본문이 대상을 명시하지 않으므로 과도한 신학적 특정은 피했습니다.
  doctrine_reference: 본문의 수사적 강도를 보존하되 의미를 좁히지 않음
