- from: 그들은 거기서 진을 걷고 스키드들의 도시를 향해 나아갔습니다. 그곳은 예루살렘에서 육백 스타디온 떨어져 있습니다.[a]
  to: 그들은 거기서 진을 걷고 예루살렘에서 육백 스타디온 떨어진 스키타이인들의 도시를 향해 나아갔습니다.[a]
  rationale: 원문의 서술적 지명 표현을 본문에서 유지하되, Σκυθῶν의 정확하고 통용되는 한국어 명칭인 ‘스키타이인들’로 고쳤습니다. 또한 거리 분사(ἀπέχουσαν)를 ‘도시’를 수식하는 관형절로 옮겨 원문의 의미와 한국어 서술 흐름을 함께 보존했습니다. 각주는 스키토폴리스라는 가능한 지명 동정을 단정하지 않고 제시합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:51:04Z'
