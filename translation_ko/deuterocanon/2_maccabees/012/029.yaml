  source_fidelity: 원문의 이동 순서와 거리 표현은 대체로 충실합니다. 다만 Σκυθῶν은 ‘스키드들’이 아니라 통상 ‘스키타이인들’로 옮겨야 하며, 거리의 현재형 서술은 과거 사건 서술 안에서 다소 부자연스럽습니다.
  naturalness: ‘진을 걷고’와 ‘…을 향해 나아갔습니다’는 현대 한국어 합쇼체 문체에 자연스럽습니다. 거리 구절을 목적지를 수식하도록 한 문장으로 결합하면 더 매끄럽고 원문의 분사 관계도 잘 드러납니다.
  terminology: ‘스키드들’은 표준적인 역사·민족 명칭이 아니므로 ‘스키타이인들’로 바로잡아야 합니다. ‘스타디온’은 고대 거리 단위의 음역으로 적절합니다.
  issues:
  - severity: medium
    issue: ‘스키드들의 도시’라는 민족명 번역
    rationale: Σκύθαι/Σκυθῶν은 고대 스키타이인(Scythians)을 가리킵니다. ‘스키드’는 이 문맥의 통용 한국어 표기가 아니며 독자의 이해와 역사적 정확성을 해칠 수 있습니다.
  - severity: low
    issue: ‘그곳은 … 떨어져 있습니다’의 시제와 지시 대상
    rationale: 과거 사건 서술에서 현재형 ‘있습니다’는 다소 어색하며, ‘그곳’이 도시를 가리키는지 목적지를 가리키는지 약간 느슨합니다. 원문의 도시를 수식하는 거리 분사를 직접 연결하는 편이 자연스럽습니다.
  revised_text: 그들은 거기서 진을 걷고 예루살렘에서 육백 스타디온 떨어진 스키타이인들의 도시를 향해 나아갔습니다.[a]
