base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/022.yaml
  text: But when Judas’s company first appeared[a], and dread came upon the enemies—fear also coming upon them from the appearing of the One who watches over all things—they rushed into flight, each man being driven a different way, so that they were often injured by their own men and run through by the points of their swords.
  footnotes:
  - marker: a
    text: Or “from the manifestation of the One who sees all things.” The Greek repeats the same appearance-language used earlier in the verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 유다의 부대가 먼저 나타나고, 적들에게 두려움이 생겼으며—모든 것을 살피시는 분의 나타나심으로부터 나온 공포도 그들 위에 임하자—그들은 도망치려 달려들었고, 각자 이리저리 끌려가다가, 자기편에게 여러 번 다치고 칼날 끝에 꿰뚫리기도 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “모든 것을 보는 분의 나타나심으로부터.” 그리스어는 앞부분과 같은 ‘나타남’ 계열 표현을 되풀이합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιφανείσης / ἐπιφανίας
  english_pob_choice: appeared / appearing / manifestation
  chosen_korean: 나타나고 / 나타나심
  alternatives_korean:
  - 드러나고 / 드러나심
  - 현현하고 / 현현
  lexicon: LSJ
  rationale: 같은 어근의 반복을 살리기 위해 첫 절은 동사로, 뒤의 신적 주어 구는 명사형으로 대응했습니다. '나타나심'은 갑작스러운 출현과 신적 현현의 뉘앙스를 함께 유지합니다.
- source_word: σπείρης
  english_pob_choice: company
  chosen_korean: 부대
  alternatives_korean:
  - 군사대
  - 군단
  - 중대
  lexicon: LSJ
  rationale: σπεῖρα는 군사 단위를 가리키므로, 정확한 로마식 기술어를 과도하게 특정하지 않으면서도 군사적 집단임을 드러내는 '부대'가 가장 자연스럽습니다.
- source_word: τοῦ τὰ πάντα ἐφορῶντος
  english_pob_choice: the One who watches over all things
  chosen_korean: 모든 것을 살피시는 분
  alternatives_korean:
  - 모든 것을 보시는 분
  - 만물을 감찰하시는 분
  - 모든 것을 감독하시는 분
  lexicon: LSJ
  rationale: ἐφορῶ는 '보다'보다 포괄적으로 살피고 주시하는 뜻이 있어, 단순 시각보다 감독적·섭리적 뉘앙스를 살리는 '살피시는 분'을 택했습니다.
- source_word: εἰς φυγὴν ὥρμησαν
  english_pob_choice: they rushed into flight
  chosen_korean: 도망치려 달려들었고
  alternatives_korean:
  - 급히 도망쳤고
  - 도망쳐 달려갔고
  - 도피하려 급히 움직였고
  lexicon: LSJ
  rationale: ὁρμάω의 급작스러운 돌진감을 살리면서, εἰς φυγήν의 목적/방향을 드러내기 위해 '도망치려 달려들었고'로 옮겼습니다.
- source_word: ἄλλος ἀλλαχῇ φερόμενος
  english_pob_choice: each man being driven a different way
  chosen_korean: 각자 이리저리 끌려가다가
  alternatives_korean:
  - 각자 다른 방향으로 내몰리다가
  - 저마다 제각기 흩어지다가
  - 한 사람은 이쪽으로, 다른 사람은 저쪽으로 끌려가다가
  lexicon: LSJ
  rationale: 분산과 수동성을 함께 보여 주는 구문이므로, '끌려가다'로 수동적 유실감을 살리고 '각자 이리저리'로 방향의 혼란을 표현했습니다.
- source_word: ταῖς τῶν ξιφῶν ἀκμαῖς
  english_pob_choice: by the points of their swords
  chosen_korean: 칼날 끝에 꿰뚫리기도 했습니다
  alternatives_korean:
  - 칼끝에 꿰뚫리기도 했습니다
  - 검끝에 찔리기도 했습니다
  - 칼날의 끝에 관통되기도 했습니다
  lexicon: LSJ
  rationale: ἀκμή는 날끝·끝부분을 뜻하므로, '칼날 끝'으로 형상을 살리고 '꿰뚫리다'로 ἀναπείρεσθαι의 관통 이미지를 반영했습니다.
theological_decisions:
- issue: 하나님을 가리키는 신적 서술 구의 번역
  chosen_reading: 모든 것을 살피시는 분
  alternative_readings:
  - 모든 것을 보시는 분
  - 만물을 감찰하시는 분
  rationale: 본문은 적들의 공포가 하나님의 현현에서 비롯됨을 말하므로, 단순한 시각보다 전인적 관찰과 섭리를 함께 암시하는 표현을 택했습니다. 이로써 신적 인식과 역사 개입의 의미를 과장 없이 보존합니다.
  doctrine_reference: 섭리와 전지에 대한 성경적 묘사
- issue: 군사적 패배의 묘사에서 수동성과 혼란의 강조
  chosen_reading: 도망치려 달려들었고, 각자 이리저리 끌려가다가
  alternative_readings:
  - 급히 도망쳤고, 저마다 흩어져
  - 도피하려 급히 움직였고, 서로 흩어져
  rationale: 본문의 핵심은 단순 퇴각이 아니라 공포로 인한 통제 상실입니다. 따라서 '달려들었고'와 '끌려가다가'로 패닉과 혼란을 함께 드러냈습니다.
  doctrine_reference: 서사적 묘사 유지 원칙
