translation:
  language: ko
  text: 그러나 유다와 함께한 이들은 세상의 위대한 통치자, 곧 여호수아의 시대에 충차나 공성 장비 없이 여리고를 무너뜨리신 분께 부르짖고, 성벽을 짐승처럼 사납게 뒤흔들었습니다.[a]
