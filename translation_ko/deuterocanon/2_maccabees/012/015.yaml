  naturalness: ‘유다 주변의 사람들’은 한국어에서 물리적 위치를 우선적으로 떠올리게 하여 지도자를 따르는 집단이라는 관용적 뜻에 다소 부자연스럽습니다. ‘유다와 함께한 이들’이 현대 표준어 문맥에서 자연스럽습니다. ‘성벽을 사나운 기세로 흔들어 공격했습니다’는 동작이 중복되므로 간결하게 다듬는 것이 좋습니다.
