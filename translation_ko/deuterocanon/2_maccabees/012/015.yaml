lexical_decisions:
- source_word: οἱ δὲ περὶ τὸν Ἰούδαν
  english_pob_choice: those around Judas
  chosen_korean: 유다 주변의 사람들
  alternatives_korean:
  - 유다와 함께 있던 사람들
  - 유다 주변에 있던 무리
  lexicon: LSJ
  rationale: περὶ + 대격은 지도자 주위의 동반 집단을 가리키므로, 한국어에서는 자연스럽게 ‘유다 주변의 사람들’로 옮겨 집단성을 살렸습니다.
- source_word: τὸν μέγαν τοῦ κόσμου δυνάστην
  english_pob_choice: the great Sovereign of the world
  chosen_korean: 세상의 큰 통치자
  alternatives_korean:
  - 세상의 위대한 주권자
  - 세상의 큰 주권자
  lexicon: LSJ
  rationale: δυνάστης는 권세를 지닌 통치자를 뜻하므로 ‘통치자’로 옮기되, μεγαν의 장엄함은 ‘큰’으로 유지했습니다.
- source_word: τὸν ἄτερ κριῶν καὶ μηχανῶν ὀργανικῶν
  english_pob_choice: without rams or siege engines
  chosen_korean: 숫양이나 공성 장비 없이
  alternatives_korean:
  - 숫양이나 공성기 없이
  - 충차나 공성 장치 없이
  lexicon: LSJ
  rationale: κριοί는 공성용 숫양, μηχαναί ὀργανικαί는 공성 장비를 가리키므로 군사적 이미지를 한국어로 직접 드러냈습니다.
- source_word: κατακρημνίσαντα τὴν Ἰερειχὼ
  english_pob_choice: brought down Jericho
  chosen_korean: 여리고를 무너뜨리신
  alternatives_korean:
  - 여리고를 끌어내리신
  - 여리고를 무너뜨린
  lexicon: LSJ
  rationale: 낙성·붕괴의 이미지를 자연스럽게 살리기 위해 ‘무너뜨리신’으로 옮겼고, 여호와의 행위를 높이는 문맥상 경어형을 사용했습니다.
- source_word: ἐνέσεισαν θηριωδῶς τῷ τείχει
  english_pob_choice: assaulted the wall fiercely
  chosen_korean: 그 성벽을 사나운 기세로 흔들어 공격했습니다
  alternatives_korean:
  - 그 성벽을 맹렬히 공격했습니다
  - 그 성벽을 사납게 흔들었습니다
  lexicon: LSJ
  rationale: ἐνέσεισαν의 ‘흔들다/충격을 가하다’와 θηριωδῶς의 야수 같은 격렬함을 함께 살리기 위해 동작과 태도를 분리해 표현했습니다.
