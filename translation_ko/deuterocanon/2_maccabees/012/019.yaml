  text: But Dositheus and Sosipater, commanders under Maccabaeus, went out and destroyed those left behind by Timothy in the stronghold, more than ten thousand men.
translation:
  language: ko
  text: 그러나 마카베오 휘하의 지휘관들인 도시테오스와 소시파트로스는 나가서 티모테오가 성채에 남겨 둔 만 명이 넘는 자들을 멸망시켰습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν περὶ τὸν Μακκαβαῖον ἡγουμένων
  english_pob_choice: commanders under Maccabaeus
  chosen_korean: 메시아스 아래의 지도자들
  alternatives_korean:
  - 메시아스 휘하의 지휘관들
  - 메시아스 아래의 사령관들
  - 마카베오 주변의 지도자들
  lexicon: LSJ
  rationale: ἡγουμένων은 기본적으로 ‘이끄는 사람들/지도자들’이므로 한국어에서는 직역보다 자연스러운 ‘지도자들’로 옮겼고, περὶ τὸν Μακκαβαῖον은 소속·관계의 의미를 살려 ‘아래의’로 표현했습니다.
- source_word: ἐξοδεύσαντες
  english_pob_choice: went out
  chosen_korean: 나가서
  alternatives_korean:
  - 출진하여
  - 나와서
  - 행군하여
  lexicon: LSJ
  rationale: 이 분사는 단순한 ‘나감’과 군사적 이동의 뉘앙스를 함께 가지므로, 한국어에서는 문맥상 자연한 ‘나가서’로 처리했습니다.
- source_word: τοὺς ὑπὸ Τιμοθέου ἀπώλεσαν καταλειφθέντας
  english_pob_choice: those left behind by Timothy ... destroyed
  chosen_korean: 티모테오가 성채에 남겨 둔 자들을 멸망시켰는데
  alternatives_korean:
  - 티모테오가 남겨 둔 자들을 죽였는데
  - 티모테오 아래에 남겨진 자들을 멸망시켰는데
  - 티모테오에게 버려진 자들을 멸망시켰는데
  lexicon: LSJ
  rationale: ὑπό와 καταλειφθέντας를 함께 받아 ‘티모테오가 남겨 둔’으로 정리했으며, ἀπώλεσαν은 전투 문맥의 전면적 패배를 살려 ‘멸망시켰다’로 옮겼습니다.
- source_word: ἐν τῷ ὀχυρώματι
  english_pob_choice: in the stronghold
  chosen_korean: 성채에
  alternatives_korean:
  - 요새에
  - 요새 안에
  - 견고한 곳에
  lexicon: LSJ
  rationale: ὀχύρωμα는 요새화된 장소를 가리키므로, 서사 문맥에서 간결하고 자연한 ‘성채’로 옮겼습니다.
- source_word: πλείους τῶν μυρίων ἀνδρῶν
  english_pob_choice: more than ten thousand men
  chosen_korean: 남자만도 만 명이 훨씬 넘었습니다
  alternatives_korean:
  - 만 명이 넘는 남자였습니다
  - 남자만 해도 만 명이 넘었습니다
  - 남자만도 만 명이 넘었습니다
  lexicon: LSJ
  rationale: πλείους τῶν μυρίων ἀνδρῶν은 수적 과장을 포함한 전투 보고이므로, ‘만 명이 훨씬 넘었습니다’로 의미를 분명히 했고 ἀνδρῶν은 전투원 남성 집단을 드러내기 위해 ‘남자만도’로 반영했습니다.
theological_decisions:
- issue: 마카베오의 인명 호칭
  chosen_reading: 본문의 Μακκαβαῖον은 영어 POB의 역사적 인물명(Maccabaeus)을 따라 본문에서는 ‘메시아스’가 아니라 ‘마카베오’ 계열의 표기를 유지하지 않고, 기존 한국어 성서 전통에 기대지 않는 음역을 지양한 별도 인명 처리 없이 관계표현으로만 남겼습니다.
  alternative_readings:
  - 마카베오 아래의 지도자들
  - 마카베오 휘하의 지휘관들
  rationale: 이 절의 초점은 특정 인명 표준화보다 군사적 관계와 전개이므로, 인명 자체를 과도하게 부각시키지 않고 관계를 먼저 드러내는 번역이 본문 기능에 맞습니다.
  doctrine_reference: 서사 문맥 해석
- issue: 전쟁 결과를 나타내는 ἀπώλεσαν
  chosen_reading: ‘멸망시켰다’로 옮겨 전투에서의 완전한 패배와 살상적 결과를 함께 드러냈습니다.
  alternative_readings:
  - 죽였다
  - 전멸시켰다
  - 없애 버렸다
  rationale: 단순한 살해보다 전투 보고의 총체적 파괴를 더 넓게 담는 표현이어서, 본문이 전하는 냉혹한 전쟁 결과를 약화시키지 않도록 했습니다.
  doctrine_reference: 전쟁 서사 번역 원칙
