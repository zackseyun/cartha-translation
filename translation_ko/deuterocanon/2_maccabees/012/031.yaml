    rationale: εὐχαριστήσαντες와 προπαρακαλέσαντες는 모두 예루살렘 도착에 앞선 행위입니다. ‘감사를 표하고 … 권면한 뒤’가 선후관계와 문장 흐름을 더 분명히 합니다.
  - severity: low
