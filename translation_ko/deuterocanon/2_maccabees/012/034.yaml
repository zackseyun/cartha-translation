  text: 그들이 전열을 갖추어 싸울 때에, 유대인들 가운데 몇 사람이 쓰러졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '전투 대형을 갖추어'에 가깝습니다. 이 동사는 군사적 배치와 교전을 함께 시사합니다.
    reason: lexical_alternative
  - marker: b
    text: '''쓰러지다''는 전투 맥락에서 죽음을 암시할 수 있지만, 그리스어는 ''죽었다''고 직접 말하지 않습니다.'
    reason: lexical_alternative
