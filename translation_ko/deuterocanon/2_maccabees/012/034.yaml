  text: And when they had joined battle[b][a], it happened that a few of the Jews fell.
  footnotes:
  - marker: a
    text: Or, more formally, 'when they had drawn up in battle line.' The Greek participle is military and may emphasize battle formation as well as engagement.
    reason: lexical_alternative
  - marker: b
    text: '''Fell'' in a battle context likely implies death, but the Greek does not explicitly say ''were killed.'''
    reason: lexical_alternative
translation:
