  text: He also advanced against a certain city of bridges[a], strongly fortified and enclosed with walls, inhabited by mixed peoples; its name was Caspin.
  footnotes:
  - marker: a
    text: Or 'a city with bridges.' The Greek phrase is compressed and may describe the city's notable bridgeworks rather than function as a formal title.
