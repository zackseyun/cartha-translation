translation:
  language: ko
  text: 그는 또한 다리들이 있는 한 도시[a]를 향하여 나아갔습니다. 그 도시는 견고하게 요새화되어 있었고, 성벽으로 둘러싸여 있었으며, 여러 민족이 섞여 살고 있었습니다. 그 이름은 카스핀이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘다리들의 도시’입니다. 그리스어 구문은 압축되어 있어, ‘다리들이 있는 도시’로 이해할 수도 있으며, 도시의 공식 명칭이라기보다 다리나 교량 시설이 두드러진 곳을 가리킬 수 있습니다.
    reason: lexical_alternative
