  lexicon: LSJ
  rationale: ἐποιεῖν τὸν διωγμόν은 단순히 '추격을 만들다'가 아니라 추격을 계속하고 밀어붙이는 관용 표현이므로, 한국어에서는 전투 서술에 자연스러운 동작 진행을 살려 옮겼습니다.
- source_word: εὐτονώτερον
