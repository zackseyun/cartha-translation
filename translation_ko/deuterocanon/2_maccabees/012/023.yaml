    text: 그리스어는 문자적으로 ‘남자들 세 만(three myriads of men)’이라고 되어 있습니다. 전승 본문은 문맥상 난해하여, 많은 이들이 여기서 삼천 명을 뜻하는 것으로 이해합니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἐποίει δὲ τὸν διωγμὸν
  english_pob_choice: pressed the pursuit
  chosen_korean: 추격을 더욱 맹렬히 계속하며
