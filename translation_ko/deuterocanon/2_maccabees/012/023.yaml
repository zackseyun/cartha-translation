  text: But Judas pressed the pursuit more vigorously[a], and, striking down the wretches, he destroyed as many as three thousand men.
  footnotes:
  - marker: a
    text: 'Greek: ''three myriads of men'' (literally, thirty thousand). The transmitted wording is difficult in context; many understand it as meaning three thousand here.'
    reason: textual_variant
translation:
  language: ko
  text: 그러나 유다는 그 흉악한 자들을 쳐서 무찌르며 추격을 더욱 맹렬히 계속하여, 사람 삼만 명이나 죽였습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘사람들의 세 만’이라고 되어 있으며, 이는 삼만 명을 뜻합니다. 그러나 전승 본문의 이 수치는 문맥상 난해하여, 많은 이들은 여기서 삼천 명을 뜻하는 것으로 이해합니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἐποίει δὲ τὸν διωγμὸν
  english_pob_choice: pressed the pursuit
  chosen_korean: 추격을 더욱 맹렬히 계속하며
  alternatives_korean:
