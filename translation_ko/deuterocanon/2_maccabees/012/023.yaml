  text: 그러나 유다는 추격을 더욱 맹렬히 계속하며[a], 그 악인들을 쳐서 넘어뜨리고, 남자들 삼만 명을 멸망시켰습니다.
  philosophy: optimal-equivalence
  footnotes:
