  rationale: 비교급 부사 εὐτονώτερον은 힘과 강도의 증대를 가리키므로, 군사 문맥에 맞게 '맹렬히'로 강도를 살렸습니다.
- source_word: συνετίνων τοὺς ἀλιτηρίους
  english_pob_choice: striking down the wretches
  chosen_korean: 그 악인들을 쳐서 넘어뜨리고
  alternatives_korean:
  - 그 비류들을 쳐서 쓰러뜨리고
  - 그 불의한 자들을 쳐서 넘어뜨리고
  lexicon: LSJ
  rationale: συνετίνων은 여기서 물리적으로 공격하여 무너뜨리는 뜻으로 이해되며, τοὺς ἀλιτηρίους는 강한 경멸을 담은 표현이어서 문맥상 '악인들'로 옮겼습니다.
- source_word: εἰς μυριάδας τρεῖς ἀνδρῶν
  english_pob_choice: as many as three thousand men
  chosen_korean: 남자들 삼만 명을
  alternatives_korean:
  - 남자들 삼천 명을
  - 남자들 세 만 명을
  lexicon: LSJ
  rationale: 전승 본문은 문자적으로 '세 만(three myriads)'이지만, 영어 POB의 주석처럼 문맥상 이해가 어렵기 때문에 본문에는 문자적 수치를 따르고, 그 난점을 각주로 남겼습니다.
