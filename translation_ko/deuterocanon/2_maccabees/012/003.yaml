  revised_text: 그러나 욥바 사람들은 그토록 큰 불경한 일을 저질렀습니다. 그들은 그들 가운데 사는 유다인들에게 아내들과 자녀들과 함께 자기들이 마련해 둔 배들에 타도록 권했습니다. 마치 그들에게 적대감이 전혀 없는 것처럼 말입니다.
