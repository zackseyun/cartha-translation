  lexicon: LSJ
  rationale: 집합적·시민적 지칭을 자연스러운 현대 한국어로 옮기되, 특정 민족명처럼 좁아지지 않도록 ‘사람들’을 유지했습니다.
- source_word: τηλικοῦτο
