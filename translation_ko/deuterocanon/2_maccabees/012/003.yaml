  chosen_korean: 전혀 그들에게 적대감이 없는 것처럼
  alternatives_korean:
  - 마치 그들에게 적대감이 전혀 없는 듯이
  - 그들을 향한 적대가 없는 것처럼
  lexicon: LSJ
  rationale: μηδεμίας의 강조를 ‘전혀’로 살리고, δυσμένεια를 한국어의 자연스러운 대립어인 ‘적대감’으로 옮겨 기만적 태도를 분명히 했습니다.
