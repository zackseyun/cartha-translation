revisions:
- from: 그러나 욥바 사람들은 큰 불경을 저질렀습니다. 곧 그들 가운데 사는 유다인들에게, 자기들이 마련해 둔 배들에 아내들과 자녀들과 함께 타라고 권하며, 전혀 그들에게 적대감이 없는 것처럼 행동한 것입니다.
  to: 그러나 욥바 사람들은 그토록 큰 불경한 일을 저질렀습니다. 그들은 그들 가운데 사는 유다인들에게 아내들과 자녀들과 함께 자기들이 마련해 둔 배들에 타도록 권했습니다. 마치 그들에게 적대감이 전혀 없는 것처럼 말입니다.
  rationale: 강조어 τηλικοῦτο를 ‘그토록 큰’으로 반영하고, δυσσέβημα를 행위 명사로 명료하게 옮겼습니다. 마지막 ὡς절은 원문의 거짓된 외양을 보존하되, 원문에 없는 별도 행동을 추가하지 않도록 조정했습니다.
