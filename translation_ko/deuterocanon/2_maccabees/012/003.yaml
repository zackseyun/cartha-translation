base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/003.yaml
  text: 'But the people of Joppa committed such a great act of impiety: they invited the Jews living among them to embark, with their wives and children, in the boats provided by them, as though there were no hostility toward them at all;'
translation:
  language: ko
  text: 그러나 욥바 사람들은 그토록 큰 불경한 일을 저질렀습니다. 그들은 그들 가운데 사는 유다인들에게 아내들과 자녀들과 함께 자기들이 마련해 둔 배들에 타도록 권했습니다. 마치 그들에게 적대감이 전혀 없는 것처럼 말입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰοππῖται
  english_pob_choice: the people of Joppa
  chosen_korean: 욥바 사람들
  alternatives_korean:
  - 욥바 주민들
  - 욥바의 사람들
  lexicon: LSJ
  rationale: 집합적·시민적 지칭을 자연스러운 현대 한국어로 옮기되, 특정 민족명처럼 좁아지지 않도록 ‘사람들’을 유지했습니다.
- source_word: τηλικοῦτο
  english_pob_choice: such a great
  chosen_korean: 큰
  alternatives_korean:
  - 그토록 큰
  - 엄청난
  lexicon: LSJ
  rationale: 문맥상 불경의 크기를 강조하는 수식이므로, 과장되지 않으면서도 강한 평가를 주는 ‘큰’으로 옮겼습니다.
- source_word: δυσσέβημα
  english_pob_choice: act of impiety
  chosen_korean: 불경
  alternatives_korean:
  - 경건을 저버린 행위
  - 불신앙의 행위
  lexicon: LSJ
  rationale: 단순한 악행보다 종교적·윤리적 반역성을 드러내는 말이므로, 한국어 성경 문체에서 통용되면서도 신성모독적 뉘앙스를 살리는 ‘불경’을 택했습니다.
- source_word: ὡς μηδεμίας ἐνεστώσης πρὸς αὐτοὺς δυσμενείας
  english_pob_choice: as though there were no hostility toward them at all
  chosen_korean: 전혀 그들에게 적대감이 없는 것처럼
  alternatives_korean:
  - 마치 그들에게 적대감이 전혀 없는 듯이
  - 그들을 향한 적대가 없는 것처럼
  lexicon: LSJ
  rationale: μηδεμίας의 강조를 ‘전혀’로 살리고, δυσμένεια를 한국어의 자연스러운 대립어인 ‘적대감’으로 옮겨 기만적 태도를 분명히 했습니다.
theological_decisions:
- issue: δυσσέβημα의 종교적 평가를 어떻게 드러낼지
  chosen_reading: ‘불경’을 사용해 행위의 종교적·도덕적 중대성을 직접 드러냈습니다.
  alternative_readings:
  - ‘악행’으로 완화해 번역
  - ‘사악한 일’로 일반화
  rationale: 본문은 단순한 사회적 비난이 아니라 하나님 앞에서의 불경함을 규정하므로, 평가를 약화하지 않는 표현이 필요합니다.
  doctrine_reference: 2 Maccabees 12:3의 서술적·윤리적 평가
