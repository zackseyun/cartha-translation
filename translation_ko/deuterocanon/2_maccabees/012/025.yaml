base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/025.yaml
  text: But when he had assured them at length that he would restore these men unharmed[b][a], they released him for the safety of their brothers.
  footnotes:
  - marker: a
    text: Or 'with many words' for 'at length.'
    reason: lexical_alternative
  - marker: b
    text: Or 'for the deliverance of their brothers'; the Greek term can also be rendered 'salvation,' but here likely refers to physical safety.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 여러 말로 그들에게 약속하여 이 사람들을 다치지 않은 채로 돌려보내겠다고 했을 때, 그들은 자기 형제들의 안전을 위해 그를 놓아주었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘여러 말로’는 직역하면 ‘많은 말로’의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘안전’은 여기서 ‘구원’이나 ‘구출’보다 문맥에 더 잘 맞는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστώσαντος
  english_pob_choice: had assured
  chosen_korean: 여러 말로 그들에게 약속하여
  alternatives_korean:
  - 그들을 확신시켜
  - 그들에게 보증하여
  - 그들을 설득하여
  lexicon: LSJ
  rationale: 아오리스트 분사 πιστώσαντος는 여기서 상대를 납득시키거나 보장하는 행위를 나타내므로, 문맥상 자연스러운 ‘약속하여’로 옮겼습니다.
- source_word: διὰ πλειόνων
  english_pob_choice: at length
  chosen_korean: 여러 말로
  alternatives_korean:
  - 오래도록
  - 자세히
  - 길게
  lexicon: LSJ
  rationale: ‘많은 말로/더 길게’라는 관용을 한국어의 간결한 표현인 ‘여러 말로’로 살렸습니다.
- source_word: τοὺς ... ἀπημάντους
  english_pob_choice: these men unharmed
  chosen_korean: 이 사람들을 다치지 않은 채로
  alternatives_korean:
  - 이 사람들을 무사히
  - 이들을 상하지 않게
  - 이 사람들을 해 없이
  lexicon: LSJ
  rationale: ἀπήμαντος는 ‘상해 없는, 무사한’의 뜻이므로 신체적 손상 없음을 분명히 드러냈습니다.
- source_word: ἕνεκα τῆς τῶν ἀδελφῶν σωτηρίας
  english_pob_choice: for the safety of their brothers
  chosen_korean: 자기 형제들의 안전을 위해
  alternatives_korean:
  - 자기 형제들의 구원을 위해
  - 자기 형제들의 구출을 위해
  - 형제들의 안전 때문에
  lexicon: LSJ
  rationale: 이 문맥의 σωτηρία는 종말론적 ‘구원’보다 인질/전쟁 상황의 실제적 안전을 가리키므로 ‘안전’을 택했습니다.
theological_decisions:
- issue: σωτηρία의 의미 범위
  chosen_reading: 안전
  alternative_readings:
  - 구원
  - 구출
  rationale: 본문은 신학적 선언이 아니라 포로의 석방을 둘러싼 실무적 합의이므로, 독자가 문맥상 의도를 즉시 파악할 수 있는 ‘안전’이 가장 적절합니다.
  doctrine_reference: 문맥 우선 원칙; σωτηρία의 의미 범위는 상황에 따라 달라짐
- issue: ἀδελφῶν의 관계 표지
  chosen_reading: 자기 형제들
  alternative_readings:
  - 그 형제들
  - 친족들
  rationale: 그리스어 복수 명사와 문맥상 같은 편에 속한 동족/형제 집단을 가리키므로, 관계성을 살린 ‘자기 형제들’로 옮겼습니다.
  doctrine_reference: 성별/관계 정확성 원칙
