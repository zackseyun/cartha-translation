  - 구출
  rationale: 본문은 신학적 선언이 아니라 포로의 석방을 둘러싼 실무적 합의이므로, 독자가 문맥상 의도를 즉시 파악할 수 있는 ‘안전’이 가장 적절합니다.
  doctrine_reference: 문맥 우선 원칙; σωτηρία의 의미 범위는 상황에 따라 달라짐
- issue: ἀδελφῶν의 관계 표지
  chosen_reading: 자기 형제들
  alternative_readings:
  - 그 형제들
  - 친족들
  rationale: 그리스어 복수 명사와 문맥상 같은 편에 속한 동족/형제 집단을 가리키므로, 관계성을 살린 ‘자기 형제들’로 옮겼습니다.
  doctrine_reference: 성별/관계 정확성 원칙
