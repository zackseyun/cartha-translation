  - severity: low
    issue: πιστώσαντος의 보증·확신의 뉘앙스가 ‘약속하여’에만 축소됨
    rationale: ‘보증하자’는 약속의 내용과 상대가 이를 신뢰하도록 한 행위를 함께 자연스럽게 반영합니다.
  - severity: low
