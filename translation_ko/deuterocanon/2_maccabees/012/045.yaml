  text: εἶτε ἐμβλέπων τοῖς μετʼ εὐσεβίας κοιμωμένοις κάλλιστον ἀποκείμενον εὐχαριστήριον, ὁσία καὶ εὐσεβὴς ἡ ἐπίνοια. ὅθεν περὶ τῶν τεθνηκότων τὸν ἐξιλασμὸν ἐποιήσατο, τῆς ἁμαρτίας ἀπολυθῆναι. XIII
