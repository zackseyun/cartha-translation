base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/045.yaml
  text: for if he was looking to the splendid reward laid up for those who have fallen asleep in godliness[a], the thought was holy and devout. Therefore he made atonement for the dead[b], so that they might be released from sin.
  footnotes:
  - marker: a
    text: Or possibly, 'the finest gift laid up'; the Greek term εὐχαριστήριον is unusual here and may carry the sense of a reserved benefit or recompense.
    reason: lexical_alternative
  - marker: b
    text: Or 'he made expiation' or 'he made propitiation' for the dead.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 그가 경건함으로 잠든 이들을 위해 마련된 가장 훌륭한 보상을 바라보고 있었다면, 그 생각은 거룩하고 경건한 것이었습니다. 그러므로 그는 죽은 이들을 위해 속죄를 행하여, 그들이 죄에서 풀려나게 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죽은 이들을 위한 가장 훌륭한 보상’일 수 있습니다. εὐχαριστήριον은 여기서 이례적인 표현으로, 따로 마련된 혜택이나 보상을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘속죄를 행하였다’, ‘화목을 이루었다’로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτε
  english_pob_choice: for if
  chosen_korean: 만일
  alternatives_korean:
  - 왜냐하면 만일
  - 그리고 만일
  lexicon: LSJ
  rationale: 조건-귀결의 흐름을 살리되, 앞뒤 문맥과 자연스럽게 이어지는 표준적인 조건 표현으로 옮겼습니다.
- source_word: τοῖς μετʼ εὐσεβίας κοιμωμένοις
  english_pob_choice: those who have fallen asleep in godliness
  chosen_korean: 경건함으로 잠든 이들
  alternatives_korean:
  - 경건 속에서 잠든 이들
  - 경건하게 잠든 이들
  lexicon: LSJ
  rationale: κοιμάω의 완곡법을 ‘잠든’으로 살리고, μετʼ εὐσεβίας는 상태/방식으로 ‘경건함으로’가 가장 직접적입니다.
- source_word: κάλλιστον ἀποκείμενον εὐχαριστήριον
  english_pob_choice: the splendid reward laid up
  chosen_korean: 가장 훌륭한 보상
  alternatives_korean:
  - 가장 아름다운 선물
  - 가장 उत्कृष्ट한 보상
  lexicon: LSJ
  rationale: εὐχαριστήριον의 이례성을 그대로 옮기기보다, 문맥상 ‘laid up’된 미래의 보상/혜택이라는 의미를 살려 한국어로는 ‘보상’으로 풀었습니다.
- source_word: ὁσία καὶ εὐσεβὴς ἡ ἐπίνοια
  english_pob_choice: the thought was holy and devout
  chosen_korean: 그 생각은 거룩하고 경건한 것이었습니다
  alternatives_korean:
  - 그 의도는 거룩하고 경건한 것이었습니다
  - 그 판단은 거룩하고 경건한 것이었습니다
  lexicon: LSJ
  rationale: ἐπίνοια는 생각/의도/판단 모두 가능하므로, 가장 포괄적이면서도 문맥에 자연스러운 ‘생각’을 택했습니다.
- source_word: τὸν ἐξιλασμόν
  english_pob_choice: atonement
  chosen_korean: 속죄
  alternatives_korean:
  - 속량
  - 화목
  lexicon: LSJ
  rationale: 피해를 가리며 죄를 다루는 희생적 행위를 가리키므로, 한국어 성경 문맥에서 가장 직관적인 ‘속죄’를 사용했습니다.
- source_word: τῆς ἁμαρτίας ἀπολυθῆναι
  english_pob_choice: so that they might be released from sin
  chosen_korean: 그들이 죄에서 풀려나게 하였습니다
  alternatives_korean:
  - 그들이 죄에서 해방되게 하였습니다
  - 그들이 죄에서 벗어나게 하였습니다
  lexicon: LSJ
  rationale: ἀπολυθῆναι의 ‘풀려나다/석방되다’ 의미를 살려, 죄의 속박에서 벗어나는 결과를 자연스럽게 표현했습니다.
theological_decisions:
- issue: 죽은 이를 위한 속죄의 진술을 어떻게 옮길지
  chosen_reading: 본문이 말하는 그대로, 죽은 이들을 위해 속죄가 행해졌고 그 목적이 죄에서의 해방이라는 점을 직접적으로 반영했습니다.
  alternative_readings:
  - 기념적 행위로 완화하는 해석
  - '후대 교리(예: 연옥)를 암시하는 방식'
  rationale: 원문은 죽은 이들을 위한 ἐξιλασμός와 죄에서의 해방을 분명히 말하므로, 그 긴장을 지우지 않고 그대로 살렸습니다.
  doctrine_reference: 텍스트가 말하는 범위를 유지하고 후대 교리체계는 주석으로 남김
