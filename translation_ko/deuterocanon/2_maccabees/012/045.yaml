  rationale: 원문은 죽은 이들을 위한 ἐξιλασμός와 죄에서의 해방을 분명히 말하므로, 그 긴장을 지우지 않고 그대로 살렸습니다.
  doctrine_reference: 텍스트가 말하는 범위를 유지하고 후대 교리체계는 주석으로 남김
