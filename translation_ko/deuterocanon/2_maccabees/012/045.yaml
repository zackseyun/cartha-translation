  text: for if he was looking to the splendid reward laid up for those who have fallen asleep in godliness[a], the thought was holy and devout. Therefore he made atonement for the dead[b], so that they might be released from sin.
  footnotes:
  - marker: a
    text: Or possibly, 'the finest gift laid up'; the Greek term εὐχαριστήριον is unusual here and may carry the sense of a reserved benefit or recompense.
    reason: lexical_alternative
  - marker: b
    text: Or 'he made expiation' or 'he made propitiation' for the dead.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 그가 경건 가운데 잠든 이들을 위하여 마련된 가장 훌륭한 보상[a]을 바라보고 있었다면, 그의 생각은 거룩하고 경건한 것이었습니다. 그러므로 그는 죽은 이들을 위하여 속죄[b]를 행하여, 그들이 죄에서 풀려나도록 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가장 훌륭한 감사 제물’ 또는 ‘가장 훌륭한 감사의 선물’로 옮길 수 있습니다. εὐχαριστήριον은 여기서 드물게 쓰인 말로, 문맥상 하나님께서 따로 마련해 두신 혜택이나 보상을 가리키는 것으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘속죄의 예식을 행하였다’ 또는 ‘속죄를 이루었다’로 옮길 수 있습니다.
    reason: lexical_alternative
