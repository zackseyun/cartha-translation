  - 약 86마일
  lexicon: LSJ
  rationale: 고대 거리 단위를 본문에 그대로 남겨 역사적 질감을 보존했고, 현대 환산은 본문이 아니라 주석으로 처리할 수 있도록 했습니다.
- source_word: εἰς τὸν Χάρακα
  english_pob_choice: to Charax
  chosen_korean: 카락스
  alternatives_korean:
  - 차락스
  - 카라크스
  lexicon: 고유명사 음역
  rationale: 지명은 한국어 음역으로 처리하되, 이동의 방향은 서술 동사와 문맥으로 드러나므로 별도의 조사 확장은 피했습니다.
- source_word: τοὺς λεγομένους Τουβιηνοὺς Ἰουδαίους
  english_pob_choice: the Jews called Toubianoi
  chosen_korean: 투비아노이[a]라 불리는 유다인들
  alternatives_korean:
  - 이른바 투비아 유다인들
  - 토비아 사람들로 불리는 유다인들
  lexicon: LSJ
  rationale: λεγομένους의 ‘불리는’ 의미를 살리고, Τουβιηνούς는 영어의 해석형 ‘Tobiads’보다 그리스어 형태를 직접 반영해 음역했습니다. ‘유다인들’은 본문의 Ἰουδαίους에 대응합니다.
