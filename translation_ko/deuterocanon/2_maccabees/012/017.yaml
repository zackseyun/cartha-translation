    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποσπάσαντες
  english_pob_choice: marched
  chosen_korean: 달려
  alternatives_korean:
  - 떠나
  - 진군하여
  - 출발하여
  lexicon: LSJ
  rationale: 여행 서술이지만 군사적 이동의 뉘앙스가 있어, 단순한 ‘떠나’보다 목적지까지 재빨리 이동한 느낌을 살린 ‘달려’로 옮겼습니다.
- source_word: σταδίους ἑπτακοσίους πεντήκοντα
  english_pob_choice: seven hundred fifty stadia
  chosen_korean: 750 스타디온
  alternatives_korean:
