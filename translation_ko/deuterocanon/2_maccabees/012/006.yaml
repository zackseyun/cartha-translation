  yaml_path: translation/deuterocanon/2_maccabees/012/006.yaml
  text: 'And calling on God[a], the righteous judge, he came against the murderers of his brothers: by night he set the harbor on fire and burned the ships, and he stabbed those who had fled there.'
  footnotes:
  - marker: a
    text: Or 'those who had taken refuge there.' The Greek participle can emphasize flight to a place of refuge.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 의로운 재판관이신 하나님께 부르짖고, 형제들의 살인자들에게 다가가서는, 밤에 항구에 불을 지르고 배들을 태워 버렸으며, 거기에서 함께 도망한 자들을 창으로 찔러 죽였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거기에서 피난한 자들’로도 옮길 수 있습니다. 그리스어 분사는 ‘도망하여 그곳에 이른 사람들’의 뉘앙스를 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλεσάμενος
  english_pob_choice: calling on
  chosen_korean: 부르짖고
  alternatives_korean:
  - 호소하고
  - 간구하고
  - 부르고
  lexicon: BDAG
  rationale: 하나님을 향한 간절한 호출이라는 종교적 뉘앙스를 살리면서, 전투 서술의 긴박함에도 맞는 동사를 택했습니다.
- source_word: τὸν δίκαιον κριτὴν θεόν
  english_pob_choice: God, the righteous judge
  chosen_korean: 의로운 재판관이신 하나님
  alternatives_korean:
  - 공의로운 재판관이신 하나님
  - 의로운 심판자 하나님
  lexicon: BDAG
  rationale: ‘재판관’은 κριτής의 사법적 이미지를 직접 살리고, δίκαιον은 단순한 ‘의로우신’보다 문맥상 ‘의로운’이 자연스럽습니다.
- source_word: τοὺς μιαιφόνους τῶν ἀδελφῶν
  english_pob_choice: the murderers of his brothers
  chosen_korean: 형제들의 살인자들
  alternatives_korean:
  - 형제들을 죽인 자들
  - 피를 더럽힌 형제 살해자들
  lexicon: LSJ
  rationale: μιαιφόνος의 강한 ‘피를 더럽히는 살인’ 색채를 완전히 풀어 설명하기보다, 본문이 분명히 말하는 살인 행위를 직접적으로 옮겼습니다.
- source_word: τοὺς δὲ ἐκεῖ συμφυγόντας
  english_pob_choice: those who had fled there
  chosen_korean: 거기에서 함께 도망한 자들
  alternatives_korean:
  - 거기 피신한 자들
  - 거기 모여 피한 자들
  lexicon: LSJ
  rationale: συμφυγόντας는 ‘함께 도망하다/함께 달아나다’의 뜻이 있어, ‘피신’보다 도망의 집단적 움직임을 드러내는 표현을 택했습니다.
