  yaml_path: translation/deuterocanon/2_maccabees/012/039.yaml
  text: On the following day[a], the men with Judas came, when the need had arisen, to gather up the bodies of those who had fallen and to restore them with their relatives to the tombs of their fathers.
  footnotes:
  - marker: a
    text: Or 'to return them to their ancestral tombs.' The Greek explicitly mentions both 'relatives' and 'the tombs of their fathers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 이튿날, 유다와 함께 있던 사람들이 필요가 생기자 쓰러진 이들의 시신을 거두어들여 그들의 친족들과 함께 조상 대대로의 무덤들에 돌려놓으려고 왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 친족들과 함께 조상들의 무덤들에 돌려놓으려고.’ 원문은 친족(συγγενῶν)과 조상에게서 물려받은 무덤들(πατρῴους τάφους)을 함께 언급합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ ἐχομένῃ
  english_pob_choice: On the following day
  chosen_korean: 그다음 날에
  alternatives_korean:
  - 다음 날에
  - 이튿날에
  lexicon: LSJ
  rationale: 그리스어의 단순한 시간 표지를 현대 한국어에서 자연스럽게 옮기되, 서술 흐름을 해치지 않도록 간결하게 렌더링했습니다.
- source_word: οἱ περὶ τὸν Ἰούδαν
  english_pob_choice: the men with Judas
  chosen_korean: 유다와 함께 있던 사람들
  alternatives_korean:
  - 유다 주변의 사람들
  - 유다의 부하들
  lexicon: LSJ
  rationale: 원문은 유다를 중심으로 한 동행 집단을 가리키므로, 직역에 가깝게 하되 군사적 위계를 암시하는 표현은 피했습니다.
- source_word: τὰ σώματα τῶν προπεπτωκότων
  english_pob_choice: the bodies of those who had fallen
  chosen_korean: 쓰러진 이들의 시신
  alternatives_korean:
  - 쓰러진 자들의 몸
  - 전사한 이들의 시신
  lexicon: LSJ
  rationale: προπεπτωκότων의 '쓰러진' 이미지를 살리면서, 전투 맥락이 분명하더라도 본문이 직접 말하는 범위를 넘기지 않도록 했습니다.
- source_word: ἀνακομίσασθαι ... ἀποκαταστῆσαι
  english_pob_choice: to gather up ... and to restore them
  chosen_korean: 거두어 들이고 ... 안치하려고
  alternatives_korean:
  - 수습하고 ... 돌려놓으려고
  - 거두어 모으고 ... 되돌려 놓으려고
  lexicon: LSJ
  rationale: 시신 수습과 매장을 함께 아우르는 동작이므로, '거두어 들이다'와 '안치하다'를 사용해 장례적 맥락을 자연스럽게 표현했습니다.
- source_word: μετὰ τῶν συγγενῶν εἰς τοὺς πατρῴους τάφους
  english_pob_choice: with their relatives to the tombs of their fathers
  chosen_korean: 그들의 친족과 함께 조상들의 무덤에
  alternatives_korean:
  - 그들의 친척들과 함께 조상 대대로의 무덤에
  - 친족들과 함께 그들의 조상 무덤에
  lexicon: LSJ
  rationale: συγγενῶν은 가족·친족 범위를 포함하므로 '친족'을 택했고, πατρῴους τάφους는 혈통의 계승성을 살려 '조상들의 무덤'으로 옮겼습니다.
theological_decisions:
- issue: 시신 수습과 매장의 목적을 어떻게 드러낼지
  chosen_reading: 시신을 수습해 친족과 함께 조상들의 무덤에 안치하려는 장례적 행위로 읽었습니다.
  alternative_readings:
  - 단순히 전장 시신을 회수하는 행위로만 볼 수 있습니다.
  - '''돌려놓다''로 옮겨 매장 이전의 반환 뉘앙스를 더 강하게 낼 수 있습니다.'
  rationale: 문맥상 단순 회수보다 가족 공동체 안에서의 매장 회복이 핵심이므로, 본문의 kinship과 burial language를 함께 드러내는 쪽을 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 5
