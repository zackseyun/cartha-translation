  naturalness: ‘그다음 날에’보다 ‘이튿날’이 현대 문어체 성경 번역에서 자연스럽고, ‘시신을 거두어들이고’가 올바르고 매끄러운 결합입니다. ‘필요가 생기자’는 원문의 상황상 필요가 발생했다는 뜻을 자연스럽게 드러냅니다. ‘친족들과 함께’는 원문의 결합 관계를 유지하되, 한국어에서 시신 자체를 수식하는 목적어임을 분명히 하기 위해 ‘그들의’와 ‘무덤들’을 보완했습니다.
