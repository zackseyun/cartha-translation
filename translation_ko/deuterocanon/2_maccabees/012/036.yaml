  yaml_path: translation/deuterocanon/2_maccabees/012/036.yaml
  text: But those with Esdrin were fighting for a longer time and were exhausted[a], so Judas called on the Lord to appear as an ally and as the leader of the battle.
  footnotes:
  - marker: a
    text: Or 'to show himself as an ally and as a guide in battle.' The Greek προοδηγός can emphasize one who goes before as a guide.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 에스드린 주변의 사람들은 더 오래 싸웠고 지쳐 있었으므로, 유다는 주님께서 동맹군으로 나타나시고 전투의 선도자가 되시기를 청했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘동맹자로 나타나시고 전투에서 길잡이가 되시기를.’ 그리스어 προοδηγός는 앞서 가며 인도하는 자를 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν δὲ περὶ τὸν Ἔσδριν
  english_pob_choice: those with Esdrin
  chosen_korean: 에스드린 주변의 사람들
  alternatives_korean:
  - 에스드린과 함께한 자들
  - 에스드린의 군대
  lexicon: LSJ
  rationale: περὶ + 대격의 집단 표현을 자연스러운 한국어로 옮기되, 군사적 소속 관계를 과도하게 특정하지 않도록 했습니다.
- source_word: ἐπὶ πλεῖον μαχομένων
  english_pob_choice: were fighting for a longer time
  chosen_korean: 더 오래 싸웠고
  alternatives_korean:
  - 더 오래 전투를 벌였고
  - 더 오랫동안 싸웠고
  lexicon: LSJ
  rationale: ἐπὶ πλεῖον은 여기서 지속 시간을 가리키므로, 진행 중인 싸움의 길이를 간결하게 살렸습니다.
- source_word: κατακόπων ὄντων
  english_pob_choice: were exhausted
  chosen_korean: 지쳐 있었으므로
  alternatives_korean:
  - 지쳐 있었고
  - 몹시 지쳐 있었으므로
  lexicon: LSJ
  rationale: κατάκοπος의 의미인 피로·소진 상태를 자연스럽게 표현했습니다.
- source_word: σύμμαχον ... καὶ προοδηγὸν
  english_pob_choice: as an ally and as the leader of the battle
  chosen_korean: 동맹군으로 나타나시고 전투의 선도자가 되시기를
  alternatives_korean:
  - 동맹자로 나타나시고 전투의 인도자가 되시기를
  - 협력자이자 전투의 길잡이로 나타나시기를
  lexicon: LSJ
  rationale: σύμμαχος의 군사적 동맹 뉘앙스를 살려 '동맹군'으로, προοδηγός의 앞서 인도하는 이미지를 '선도자'로 옮겼습니다.
- source_word: φανῆναι
  english_pob_choice: to appear
  chosen_korean: 나타나시기를
  alternatives_korean:
  - 보이시기를
  - 드러나시기를
  lexicon: LSJ
  rationale: 하나님의 구원 개입을 단순한 도움보다 '나타나심'의 형태로 보존하기 위해 동사적 의미를 살렸습니다.
theological_decisions:
- issue: κύριος의 번역
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 주인
  rationale: 유다의 간구 문맥에서 κύριος는 하나님을 가리키므로, 프로젝트 기본어휘에 따라 경배·기도 맥락의 '주님'으로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → Lord'
- issue: 하나님의 개입을 요청하는 φανῆναι의 처리
  chosen_reading: 나타나시고
  alternative_readings:
  - 도우시고
  - 보여 주시고
  rationale: 본문은 하나님이 전투에서 함께해 주시기를 청하지만, 그 방식이 가시적 현현인지 군사적 개입인지 단정하지 않으므로 '나타나시다'로 긴장을 보존했습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
