    rationale: 그리스어는 φανῆναι를 반복하여 주님께서 동맹자와 전투의 선도자로 나타나시기를 구합니다. 한국어에서는 두 번째 역할을 ‘전투를 앞서 이끄는 분으로 나타나시기를’로 표현하면 의미가 명료합니다.
