  text: τῶν δὲ περὶ τὸν Ἔσδριν ἐπὶ πλεῖον μαχομένων καὶ κατακόπων ὄντων,,, ἐπικαλεσάμενος Ἰούδας τὸν κύριον σύμμαχον φανῆναι καὶ προοδηγὸν φανῆναι τοῦ πολέμου.
