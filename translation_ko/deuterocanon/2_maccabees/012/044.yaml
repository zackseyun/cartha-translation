translation:
  language: ko
  text: 그가 만일 넘어져 죽은 사람들이 다시 일어날 것을 기대하지 않았다면, 죽은 사람들을 위해 기도하는 것은 지나치고 어리석은 일이었을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘넘어져(쓰러져) 있는 사람들’입니다. 이 문맥에서는 전사한 죽은 사람들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς προπεπτωκότας
  english_pob_choice: those who had fallen
  chosen_korean: 넘어져 죽은 사람들
  alternatives_korean:
  - 쓰러진 사람들
  - 죽은 사람들
  - 넘어져 쓰러진 사람들
  lexicon: LSJ
  rationale: 직역의 이미지는 ‘넘어지다/쓰러지다’이지만, 이 문맥에서는 전사한 죽은 자를 가리키므로 한국어에서는 의미를 분명히 하되 과도한 해석은 피했습니다. ‘죽은 사람들’만 쓰면 이미지가 사라지므로 ‘넘어져 죽은 사람들’로 절충했습니다.
- source_word: ἀναστῆναι
  english_pob_choice: to rise again
  chosen_korean: 다시 일어날
  alternatives_korean:
  - 다시 살아날
  - 부활할
  - 일어날
  lexicon: LSJ
  rationale: 동사 자체는 ‘일어나다’이지만, 여기서는 부활을 가리키므로 자연스러운 한국어로 ‘다시 일어날’이라 옮겼습니다. 능동·수동을 덧붙여 해석을 고정하지 않고 원문의 표현을 살렸습니다.
- source_word: περισσὸν καὶ ληρῶδες
  english_pob_choice: excessive and foolish
  chosen_korean: 지나치고 어리석은
  alternatives_korean:
  - 불필요하고 어리석은
  - 과도하고 헛된
  - 지나치고 헛된
  lexicon: LSJ
  rationale: 두 형용사의 병렬을 살리되, 한국어에서 가장 자연스럽게 수사적 강도를 전달하는 표현을 선택했습니다. ‘헛된’은 결과 판단을 조금 더 보태므로, 원문의 ‘과도함/어리석음’을 우선했습니다.
- source_word: ὑπὲρ νεκρῶν εὔχεσθαι
  english_pob_choice: to pray for the dead
  chosen_korean: 죽은 사람들을 위해 기도하는 것
  alternatives_korean:
  - 죽은 사람들을 위해 기도하는 일
  - 죽은 사람들을 위해 빌어 주는 것
  - 죽은 이들을 위하여 기도하는 것
  lexicon: LSJ
  rationale: ὑπέρ + 속격의 중보적 의미를 한국어 ‘~을 위해’로 옮겼습니다. ‘빌다’는 한국어 종교어감이 강해 오해를 낳을 수 있어, 직설적인 ‘기도하다’를 유지했습니다.
theological_decisions:
- issue: 죽은 자를 위한 기도의 논리 구조
  chosen_reading: 문장은 ‘죽은 사람들이 다시 일어날 것’이라는 기대가 없다면 죽은 이들을 위한 기도는 모순되거나 어리석다는 논증으로 옮겼습니다.
  alternative_readings:
  - 죽은 자의 현재 상태나 연옥 같은 후대 교리를 드러내는 해석으로 풀 수 있습니다.
  - ‘기도하다’의 대상을 ‘전사자’로 한정해 더 역사적으로 풀 수도 있습니다.
  rationale: 그리스어는 논증만 제시하며 후대 교리를 명시하지 않습니다. 따라서 부활 기대와 죽은 자를 위한 기도 사이의 연결을 그대로 보존했습니다.
  doctrine_reference: 원문의 논증 구조 보존; 종말론/사후 상태에 대한 교리적 과잉해석 회피
