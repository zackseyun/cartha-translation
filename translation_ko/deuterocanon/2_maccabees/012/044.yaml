  naturalness: ‘쓰러진 이들’과 ‘죽은 이들’의 대조는 현대 표준 한국어에서 자연스럽고, ‘기대하지 않았더라면 … 일이었을 것입니다’는 원문의 반사실적 조건 논증을 매끄럽게 드러냅니다.
