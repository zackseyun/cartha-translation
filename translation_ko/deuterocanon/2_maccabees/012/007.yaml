  text: But when the place had been closed up[a], he withdrew, intending to come again and root out the entire citizen body of the people of Joppa.
  footnotes:
  - marker: a
    text: Or 'the whole civic community of the people of Joppa.' The Greek term can denote the commonwealth, citizen body, or political community.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그 지역이 봉쇄되자, 그는 물러나서 다시 와서 요파 사람들의 시민 공동체 전체를 뿌리째 뽑으려 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '요파의 전체 시민 공동체'라는 뜻입니다. 그리스어 πολίτευμα는 공화체, 시민단체, 정치 공동체를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ ... χωρίου / συγκλεισθέντος
  english_pob_choice: the place had been closed up
  chosen_korean: 그 지역이 봉쇄되자
  alternatives_korean:
  - 그 곳이 닫히자
  - 그 장소가 폐쇄되자
  - 그 지역이 막히자
  lexicon: LSJ
  rationale: χώριον은 단순한 '장소'보다 사건이 일어난 지역·거점의 뉘앙스를 가질 수 있고, συγκλεισθέντος는 전면적으로 둘러싸이거나 봉쇄된 상태를 시사하므로 군사적 문맥을 살려 '봉쇄되다'로 옮겼습니다.
- source_word: ἀνέλυσεν
  english_pob_choice: he withdrew
  chosen_korean: 그는 물러나서
  alternatives_korean:
  - 그는 떠났습니다
  - 그는 철수했습니다
  - 그는 해산했습니다
  lexicon: LSJ
  rationale: ἀναλύω는 서술문맥에서 떠나다/철수하다의 뜻이므로, 군사적 상황에 자연스러운 '물러나다'로 옮겨 재차 돌아올 의도를 드러냈습니다.
- source_word: τὸ σύμπαν ... πολίτευμα
  english_pob_choice: the entire citizen body
  chosen_korean: 시민 공동체 전체
  alternatives_korean:
  - 전체 시민 집단
  - 온 시민 사회
  - 전 시민 공동체
  lexicon: LSJ
  rationale: πολίτευμα는 단순한 개인들의 집합보다 시민적·정치적 공동체를 가리키므로, '시민 공동체'로 옮겨 공적·집단적 성격을 살렸습니다. σύμπαν은 그 전체성을 강조하므로 '전체'를 덧붙였습니다.
- source_word: τῶν Ἰοππιτῶν
  english_pob_choice: of the people of Joppa
  chosen_korean: 요파 사람들의
  alternatives_korean:
  - 요파 주민들의
  - 요파 시민들의
  - 요파인의
  lexicon: LSJ
  rationale: Ἰοππῖται는 요파의 주민들을 가리키는 этnicon이므로, 현대 독자가 이해하기 쉬운 '요파 사람들'로 옮겼습니다.
- source_word: ἐκριζῶσαι
  english_pob_choice: to root out
  chosen_korean: 뿌리째 뽑으려
  alternatives_korean:
  - 뿌리 뽑으려
  - 완전히 없애려
  - 철저히 제거하려
  lexicon: LSJ
  rationale: ἐκριζόω의 문자적 이미지를 보존하기 위해 '뿌리째 뽑다'를 택해, 단순한 제거보다 폭력적·전면적 의미를 살렸습니다.
theological_decisions:
- issue: πολίτευμα의 정치-공동체적 범위 보존
  chosen_reading: '''시민 공동체 전체''로 옮겨, 특정 행정기구만이 아니라 요파의 공적 시민 집단 전체를 겨냥한 표현으로 유지했습니다.'
  alternative_readings:
  - '''전 주민''으로 완화하여 번역'
  - '''공화체''처럼 제도적으로 한정하여 번역'
  rationale: 본문은 개인 개별성보다 집단적 정치체를 강조하므로, 과도하게 행정기관으로 축소하거나 단순한 인구 전체로 평면화하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
