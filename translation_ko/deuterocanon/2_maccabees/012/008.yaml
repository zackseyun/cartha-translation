  rationale: 여기서는 동사의 목적어가 아니라 호의적 대상이 아닌 적대적 방향을 가진 여격으로 이해되는 것이 문맥에 맞으므로, 한국어에서는 자연스럽게 대상 방향을 드러냈습니다.
