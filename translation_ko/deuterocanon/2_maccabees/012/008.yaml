  rationale: 이 분사는 앞뒤 문맥에서 이어지는 조처를 가리키므로, 한국어에서는 과도하게 군사화하지 않으면서도 진행을 드러내는 ‘처리한 뒤에’가 가장 자연스럽습니다.
- source_word: τοὺς ἐν Ἰαμνίᾳ
  english_pob_choice: those in Jamnia
  chosen_korean: 야므니아에 있는 사람들
  alternatives_korean:
  - 야므니아의 사람들
