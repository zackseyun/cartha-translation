  - 야므니아 주민들
  lexicon: LSJ
  rationale: 지시대명사+전치사구는 특정 집단을 가리키므로, 지명에 있는 사람들을 뜻하는 자연스러운 한국어로 옮겼습니다.
- source_word: τὸν αὐτὸν ... τρόπον
  english_pob_choice: the same kind of action
  chosen_korean: 같은 짓
  alternatives_korean:
  - 같은 방식
  - 같은 일
  - 같은 행동
  lexicon: LSJ
  rationale: 문맥상 유대인들을 상대로 한 적대적 행위를 가리키므로, 의미를 완화하지 않는 표현으로 ‘같은 짓’을 택했습니다.
- source_word: τοῖς κατοικοῦσιν Ἰουδαίοις
  english_pob_choice: against the Jews living there
  chosen_korean: 그곳에 사는 유대인들에게
  alternatives_korean:
  - 그곳에 거주하는 유대인들에게
  - 그곳의 유대인들에게
  - 그곳에 사는 유대인들에 대하여
  lexicon: LSJ
  rationale: 여기서는 동사의 목적어가 아니라 호의적 대상이 아닌 적대적 방향을 가진 여격으로 이해되는 것이 문맥에 맞으므로, 한국어에서는 자연스럽게 대상 방향을 드러냈습니다.
