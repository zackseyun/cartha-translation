lexical_decisions:
- source_word: μεταλαβὼν
  english_pob_choice: after taking in hand / having also dealt with
  chosen_korean: 처리한 뒤에
  alternatives_korean:
  - 대응한 뒤에
  - 상대한 뒤에
  - 다루고 나서
