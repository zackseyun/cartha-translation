  rationale: 문맥상 유대인들을 상대로 한 적대적 행위를 가리키므로, 의미를 완화하지 않는 표현으로 ‘같은 짓’을 택했습니다.
- source_word: τοῖς κατοικοῦσιν Ἰουδαίοις
  english_pob_choice: against the Jews living there
  chosen_korean: 그곳에 사는 유대인들에게
  alternatives_korean:
  - 그곳에 거주하는 유대인들에게
  - 그곳의 유대인들에게
