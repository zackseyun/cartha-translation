lexical_decisions:
- source_word: μεταλαβὼν
  english_pob_choice: after taking in hand / having also dealt with
  chosen_korean: 처리한 뒤에
  alternatives_korean:
  - 대응한 뒤에
  - 상대한 뒤에
  - 다루고 나서
  lexicon: LSJ
  rationale: 이 분사는 앞뒤 문맥에서 이어지는 조처를 가리키므로, 한국어에서는 과도하게 군사화하지 않으면서도 진행을 드러내는 ‘처리한 뒤에’가 가장 자연스럽습니다.
