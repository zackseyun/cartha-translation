  text: But Maccabeus[a], after arranging the troops around him in companies, stationed them over against the companies; and they charged against Timothy, who had around him twelve myriads of foot soldiers, two thousand horsemen[b], and besides these seven thousand more.
  footnotes:
  - marker: a
    text: Greek 'twelve myriads of foot soldiers,' that is, 120,000 infantry.
    reason: lexical_alternative
  - marker: b
    text: 'The final phrase is compressed in Greek: ''and besides the seven thousand.'' The translation understands it as an additional seven thousand troops beyond the infantry and horsemen already mentioned.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 마카베오[a]는 자기 주위의 군대를 부대별로 배치하고, 그들을 부대들 앞에 세웠습니다. 그리고 그들은 티모테오에게 돌격했는데, 그에게는 보병 십이만 명과 기병 이천 명[b], 그리고 그 밖에 칠천 명이 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ‘열두 만의 보병’, 곧 보병 120,000명을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 구절은 그리스어에서 압축되어 있습니다. ‘그리고 그 밖에 칠천 명’으로 옮겼으며, 이는 이미 언급된 보병과 기병 외에 추가 병력이 더 있었다는 뜻으로 이해했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: διατάξας τὴν περὶ αὐτὸν στρατιὰν σπειρηδόν
  english_pob_choice: after arranging the troops around him in companies
  chosen_korean: 자기 주위의 군대를 부대별로 배치하고
  alternatives_korean:
  - 자기 곁의 군대를 대열로 정비하고
  - 주위의 군대를 편제하여
  lexicon: LSJ
  rationale: διατάξας는 전투를 앞둔 ‘정렬/편성’의 의미이므로 군사적으로 자연스러운 ‘배치하다’로 옮겼고, σπειρηδόν은 특정 로마식 용어로 좁히지 않고 ‘부대별로’로 처리했습니다.
- source_word: κατέστησεν αὐτοὺς ἐπὶ τῶν σπειρῶν
  english_pob_choice: stationed them over against the companies
  chosen_korean: 그들을 부대들 앞에 세웠습니다
  alternatives_korean:
  - 그들을 부대들에 맞서 세웠습니다
  - 그들을 부대들 위에 세웠습니다
  lexicon: LSJ
  rationale: ἐπὶ τῶν σπειρῶν은 문맥상 적군의 편제와 마주한 배치를 가리키므로, 직역보다 전투 배열을 드러내는 ‘앞에 세웠습니다’로 옮겼습니다.
- source_word: μυριάδας δώδεκα πεζῶν
  english_pob_choice: twelve myriads of foot soldiers
  chosen_korean: 보병 십이만 명
  alternatives_korean:
  - 보병 열두 만 명
  - 보병 십이만의 군사
  lexicon: LSJ
  rationale: μυριάδες는 한국어 독자에게는 수량값을 풀어 주는 편이 명료하므로, 의미를 유지하면서도 읽기 쉬운 ‘십이만 명’으로 옮겼습니다.
- source_word: καὶ πρὸς τοῖς ἑπτακισχιλίοις
  english_pob_choice: and besides these seven thousand more
  chosen_korean: 그리고 그 밖에 칠천 명
  alternatives_korean:
  - 그리고 이 밖에 칠천 명
  - 그리고 거기에 더해 칠천 명
  lexicon: LSJ
  rationale: πρὸς τοῖς는 이미 언급된 수에 덧붙는 의미이므로 ‘그 밖에’로 간결하게 살렸고, POB가 본문의 압축성을 보존한 해석을 따랐습니다.
