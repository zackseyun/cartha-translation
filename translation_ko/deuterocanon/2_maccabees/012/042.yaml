  text: they turned to supplication[a], asking that the sin that had been committed might be completely blotted out. But the noble Judas urged the multitude to keep themselves free from sin, since they had seen before their eyes the things that had happened because of the sin of those who had fallen.
  footnotes:
  - marker: a
    text: Or 'to keep themselves sinless' / 'to keep themselves without sin.' The Greek adjective can be rendered more literally, but the main text uses a more idiomatic English expression.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 간청으로 돌아서서[a], 저지른 죄가 완전히 지워지게 해 달라고 요청하였습니다. 그러나 고결한 유다는 무리가 자신들을 죄 없이 지키도록 권면하였으니, 이는 그들이 타락한 자들의 죄 때문에 일어난 일들을 자기 눈앞에서 보았기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘간청’보다 더 직접적으로 ‘탄원’으로 옮길 수 있습니다. ἱκεσία는 단순한 기도보다 간청·애원을 강조하는 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἱκεσίαν ἐτράπησαν
  english_pob_choice: they turned to supplication
  chosen_korean: 간청으로 돌아서서
  alternatives_korean:
  - 기도로 돌아서서
  - 간청하며
  lexicon: LSJ
  rationale: ἱκεσία는 단순한 일반 기도보다 간청·탄원을 강하게 드러내므로, 한국어에서는 ‘간청’으로 옮겨 petitionary force를 살렸습니다.
- source_word: τελείως ἐξαλειφθῆναι
  english_pob_choice: might be completely blotted out
  chosen_korean: 완전히 지워지게 해 달라고
  alternatives_korean:
  - 완전히 도말되게 해 달라고
  - 완전히 없애 달라고
  lexicon: LSJ
  rationale: ἐξαλείφω의 ‘지우다/도말하다’ 이미지를 살리되, 현대 한국어에서 자연스럽고 죄책의 제거를 잘 드러내는 표현으로 정리했습니다.
- source_word: ὁ δὲ γενναῖος Ἰούδας
  english_pob_choice: But the noble Judas
  chosen_korean: 그러나 고결한 유다는
  alternatives_korean:
  - 그러나 용맹한 유다는
  - 그러나 귀한 유다는
  lexicon: LSJ
  rationale: γενναῖος는 ‘용감한’과 ‘고결한’의 뜻을 함께 가질 수 있는데, 여기서는 인물 평가의 뉘앙스가 강해 ‘고결한’이 더 적절합니다.
- source_word: συντηρεῖν αὐτοὺς ἀναμαρτήτους εἶναι
  english_pob_choice: to keep themselves free from sin
  chosen_korean: 자신들을 죄 없이 지키도록
  alternatives_korean:
  - 죄에서 벗어나 있도록
  - 죄 없는 상태를 유지하도록
  lexicon: LSJ
  rationale: ἀναμαρτήτους는 절대적 무죄라기보다 죄에 빠지지 않는 상태를 가리키므로, POB의 해석을 따라 ‘죄 없이 지키다’로 자연스럽게 풀었습니다.
- source_word: διὰ τὴν τῶν προπεπτωκότων ἁμαρτίαν
  english_pob_choice: because of the sin of those who had fallen
  chosen_korean: 타락한 자들의 죄 때문에
  alternatives_korean:
  - 넘어진 자들의 죄 때문에
  - 죽어 넘어간 자들의 죄 때문에
  lexicon: LSJ
  rationale: προπεπτωκότων은 전사·몰락한 자들을 가리키는 문맥일 수 있으나, 한국어 본문에서는 문맥상 원인 관계를 간결하게 살려 ‘타락한 자들’로 옮겼습니다.
theological_decisions:
- issue: ἀναμαρτήτους의 신학적 강도
  chosen_reading: ‘죄 없이 지키다’로 옮겨, 절대적 무죄무흠 교리처럼 들리지 않게 했습니다.
  alternative_readings:
  - 죄 없는
  - 무죄한
  rationale: 이 구절은 죽은 이들의 심판 사례를 보고 살아 있는 이들에게 죄를 피하라고 권면하는 맥락이므로, 윤리적 경계의 의미를 살리되 무오성/무죄성 교리를 암시하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §6; source sense without overstatement
- issue: ‘간청’과 ‘지다/지워지다’의 죄책 표현
  chosen_reading: 죄의 제거를 단순 사면보다 강한 ‘지워지다’ 이미지로 유지했습니다.
  alternative_readings:
  - 용서해 달라고
  - 사라지게 해 달라고
  rationale: 본문의 ἐξαλείφω는 죄책의 삭제·도말을 시사하므로, 한국어에서도 죄가 ‘지워지는’ 이미지를 남겨 원문의 중량감을 보존했습니다.
  doctrine_reference: Source-driven lexical theology
