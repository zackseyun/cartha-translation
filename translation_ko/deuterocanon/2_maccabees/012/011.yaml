base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/011.yaml
  text: And when a fierce battle had taken place[a], and those with Judas had prevailed because of the help from God, the nomads, having been weakened, asked Judas to give them his right hand[b], promising both to provide pasture and to be useful to them in the future.
  footnotes:
  - marker: a
    text: Literally, 'to give them the right hand,' an idiom for making peace or pledging alliance.
    reason: cultural_note
  - marker: b
    text: The Greek wording at the end is somewhat compressed; the sense is that they promised grazing support and future assistance.
    reason: textual_variant
translation:
  language: ko
  text: 치열한 전투가 벌어지고, 하나님의 도우심으로 유다와 함께한 이들이 승리를 거두자, 약해진 유목민들은 유다에게 그들에게 오른손을 내밀어 달라고[a] 청하면서, 목초를 제공하고 앞으로도 그들에게 도움이 되겠다고 약속하였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들에게 오른손을 주다’로, 화친을 맺거나 동맹을 맹세하는 관용구입니다.
    reason: cultural_note
  - marker: b
    text: 끝부분의 그리스어 표현은 다소 압축되어 있습니다. 유목민들이 목초를 제공하고 장차 다른 일에서도 유다의 편에 도움이 되겠다고 약속했다는 뜻입니다.
    reason: textual_variant
lexical_decisions:
- source_word: καρτερᾶς μάχης
  english_pob_choice: a fierce battle
  chosen_korean: 치열한 전투
  alternatives_korean:
  - 격렬한 전투
  - 힘겨운 전투
  lexicon: LSJ
  rationale: καρτερός는 강도와 치열함을 나타내므로, 전투 문맥에서 ‘치열한’이 자연스럽게 그 강도를 살립니다.
- source_word: διὰ τὴν παρὰ τοῦ θεοῦ βοήθειαν
  english_pob_choice: because of the help from God
  chosen_korean: 야훼의 도우심으로
  alternatives_korean:
  - 하나님의 도우심으로
  - 하나님으로부터 온 도움으로
  lexicon: LSJ
  rationale: παρά와 θεοῦ가 가리키는 도움의 근원을 살려, 전투의 승리가 하나님께서 주신 도움 때문임을 분명히 드러냈습니다.
- source_word: οἱ νομάδες
  english_pob_choice: the nomads
  chosen_korean: 유목민들
  alternatives_korean:
  - 노마드족
  - 떠돌이 민족
  lexicon: LSJ
  rationale: 명사형 사회·민족 지칭으로 읽히므로, 현대 한국어에서 가장 이해하기 쉬운 ‘유목민들’로 옮겼습니다.
- source_word: ἠξίουν δοῦναι τὸν Ἰούδαν δεξιὰν αὐτοῖς
  english_pob_choice: asked Judas to give them his right hand
  chosen_korean: 유다에게 자기들의 오른손을 내밀어 달라고 청하며
  alternatives_korean:
  - 유다에게 화친의 오른손을 달라고 청하며
  - 유다와 손을 잡게 해 달라고 청하며
  lexicon: LSJ
  rationale: ‘오른손을 주다’는 화친·동맹의 관용구이므로, 본문은 직역에 가깝게 두고 의미는 문맥상 드러나게 했습니다.
- source_word: βοσκήματα δώσειν
  english_pob_choice: to provide pasture
  chosen_korean: 목초지도 제공하고
  alternatives_korean:
  - 방목지를 주고
  - 사료를 제공하고
  lexicon: LSJ
  rationale: βοσκήματα는 가축의 방목·먹이와 관련되므로, 너무 좁히지 않으면서도 한국어로 자연스러운 ‘목초지’로 옮겼습니다.
- source_word: ἐν τοῖς λοιποῖς ... ὠφέλησεν αὐτούς
  english_pob_choice: to be of use to them in the future
  chosen_korean: 앞으로도 그들에게 유익이 되겠다고
  alternatives_korean:
  - 훗날 그들에게 도움이 되겠다고
  - 그 밖의 일에서도 그들에게 유용하겠다고
  lexicon: LSJ
  rationale: 전승 문구가 압축되어 있으나, 전체 뜻은 장차 그들에게 이익이 되겠다는 약속이므로 ‘유익’으로 포괄적으로 살렸습니다.
theological_decisions:
- issue: 전투 승리의 신학적 귀속
  chosen_reading: 승리는 야훼의 도우심으로 주어진 것으로 분명히 표현합니다.
  alternative_readings:
  - 전투 결과만 중립적으로 서술하는 번역
  - 하나님의 도움을 덜 직접적으로 암시하는 번역
  rationale: 본문이 διὰ τὴν παρὰ τοῦ θεοῦ βοήθειαν이라고 직접 말하므로, 승리의 원인을 신학적으로 완화하지 않고 그대로 드러냈습니다.
  doctrine_reference: 2 Maccabees 12:11의 본문 자체가 지닌 신적 개입 진술
- issue: ‘오른손’ 관용구 처리
  chosen_reading: ‘오른손을 내밀어 달라’는 표현을 유지하되, 화친·동맹의 관용구라는 의미가 드러나게 번역합니다.
  alternative_readings:
  - 의미만 풀어 ‘화친을 청하다’로 번역
  - 직역만 하여 관용성을 독자에게 전적으로 맡김
  rationale: 본문의 관용구성을 지우지 않으면서도 한국어 독자가 오해하지 않도록, 원문 구조를 보존한 채 문맥 의미를 드러냈습니다.
  doctrine_reference: 번역 원칙상 관용구의 본문 형태 보존
