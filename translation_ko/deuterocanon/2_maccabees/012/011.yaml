  text: γενομένης δὲ καρτερᾶς μάχης καὶ τῶν περὶ τὸν Ἰούδαν διὰ τὴν παρὰ τοῦ θεοῦ βοήθειαν εὐημερησάντων, ἐλαττωθέντες οἱ νομάδες ἠξίουν δοῦναι τὸν Ἰούδαν δεξιὰν αὐτοῖς, ὑπισχνούμενοι καὶ βοσκήματα δώσειν καὶ ἐν τοῖς λοιποῖς Α ὠφέλησεν αὐτούς.
