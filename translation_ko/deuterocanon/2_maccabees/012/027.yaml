  to: 그러나 이들이 패주하고 멸망한 뒤에, 그는 또한 여러 민족으로 이루어진 무리가 있던 요새화된 성읍 에프론을 향하여 진군하였습니다. 건장한 젊은이들은 성벽 앞에 배치되어 완강히 맞서 싸웠으며, 그곳에는 공성 장비와 발사체의 비축물이 많이 있었습니다[b].
