base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/027.yaml
  text: But after the rout and destruction of these men[a], he marched also against Ephron, a fortified city, in which there were mixed multitudes; and strong young men, stationed before the walls, were fighting vigorously[b], while there were many stores of engines and missiles there.
  footnotes:
  - marker: a
    text: Or 'people of every kind/tribe were in it.' The Greek πάμφυλα πλήθη suggests a mixed population rather than a single ethnic group.
    reason: lexical_alternative
  - marker: b
    text: Or 'many stockpiles of engines and missiles were there.' The noun rendered 'stores' may denote accumulated military supplies.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이들이 패주하고 멸망한 뒤에, 그는 또한 여러 민족으로 이루어진 무리가 있던 요새화된 성읍 에프론을 향하여 진군하였습니다. 건장한 젊은이들은 성벽 앞에 배치되어 완강히 맞서 싸웠으며, 그곳에는 공성 장비와 발사체의 비축물이 많이 있었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 “공성 장비와 발사체가 많이 비축되어 있었습니다”로 옮길 수 있습니다. 그리스어 παραθέσεις는 군사 장비와 투사 무기의 비축물 또는 ذخ장된 물자를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ τὴν τούτων τροπὴν καὶ ἀπώλειαν
  english_pob_choice: after the rout and destruction of these men
  chosen_korean: 이들의 패주와 멸망 뒤에
  alternatives_korean:
  - 이들의 패배와 파멸 뒤에
  - 이들이 무너져 흩어진 뒤에
  lexicon: LSJ
  rationale: τροπή와 ἀπώλεια의 군사적 결합을 살려, 단순한 패배보다 전열 붕괴와 큰 피해를 함께 드러내는 표현으로 옮겼습니다.
- source_word: ἐπεστράτευσεν ... ἐπὶ Ἔφρων
  english_pob_choice: he marched also against Ephron
  chosen_korean: 그도 에프론 성을 향해 진군하였는데
  alternatives_korean:
  - 그도 에프론을 향해 출정하였는데
  - 그도 에프론 성을 공격하러 나아갔는데
  lexicon: LSJ
  rationale: ἐπεστράτευσεν은 군사 원정을 뜻하므로 '진군하였는데'가 한국어 군사 문맥에 자연스럽고, πόλις ὀχυράν을 받아 '성'을 보탰습니다.
- source_word: πάμφυλα πλήθη
  english_pob_choice: mixed multitudes
  chosen_korean: 여러 민족이 뒤섞여 살고 있었으며
  alternatives_korean:
  - 온갖 민족의 무리가 있었으며
  - 각양각색의 사람들이 섞여 있었으며
  lexicon: LSJ
  rationale: πάμφυλα는 단일 집단이 아닌 다양한 민족적 구성의 뉘앙스를 가지므로, '뒤섞여 살고 있었다'로 거주 상태까지 자연스럽게 반영했습니다.
- source_word: ὀργάνων καὶ βελῶν πολλαὶ παραθέσεις
  english_pob_choice: many stores of engines and missiles
  chosen_korean: 공성기와 투사 무기의 저장고가 많이 있었습니다
  alternatives_korean:
  - 공성 장비와 투사 무기의 비축이 많았습니다
  - 공성기와 발사체의 저장이 많이 있었습니다
  lexicon: LSJ
  rationale: ὀργάνων은 군사 문맥에서 공성기/전쟁 기계를 가리킬 수 있고, βελῶν은 넓게 '투사 무기'로 옮기는 것이 넓은 의미를 보존합니다. παραθέσεις는 단순 배치보다 비축된 저장 상태를 가리켜 '저장고'로 풀었습니다.
