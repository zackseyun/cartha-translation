lexical_decisions:
- source_word: ἔρρωσθε
  english_pob_choice: Farewell
  chosen_korean: 안녕히 가십시오
  alternatives_korean:
  - 잘 가십시오
  - 평안히 가십시오
  - 안녕히 계십시오
  lexicon: LSJ
  rationale: 서신 끝 인사로 쓰인 관용적 작별 표현이므로, 물리적 ‘강건함’보다 현대 한국어의 자연스러운 작별 인사로 옮겼습니다.
- source_word: εἰη ἂν
  english_pob_choice: May it be
  chosen_korean: 되기를 바랍니다
  alternatives_korean:
  - 그렇게 되기를 바랍니다
  - 그렇게 되면 좋겠습니다
  - 그대로 이루어지기를 바랍니다
  lexicon: LSJ
  rationale: 희구·소망의 뉘앙스를 한국어의 공손한 바람 표현으로 살렸습니다.
- source_word: ὡς βούλομεθα
  english_pob_choice: as we desire
  chosen_korean: 우리가 바라는 대로
  alternatives_korean:
  - 우리가 원하는 대로
  - 우리가 바라듯
  - 우리가 소원하는 대로
  lexicon: LSJ
  rationale: βούλομαι의 ‘원하다/바라다’ 의미를 살리되, 서신체에 맞게 ‘바라는 대로’로 자연화했습니다.
- source_word: καὶ αὐτοὶ δὲ ὑγιαίνομεν
  english_pob_choice: and we ourselves also are in good health
  chosen_korean: 우리도 역시 건강합니다
  alternatives_korean:
  - 우리 자신도 잘 지내고 있습니다
  - 우리도 무사합니다
  - 우리도 역시 잘 있습니다
  lexicon: LSJ
  rationale: αὐτοὶ δὲ의 가벼운 강조를 ‘우리도 역시’로 반영하고, ὑγιαίνομεν은 서신 맥락에 맞는 건강 상태 표현으로 옮겼습니다.
