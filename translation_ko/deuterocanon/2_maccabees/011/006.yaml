base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/006.yaml
  text: But when those around Maccabeus learned that he was besieging the strongholds[a], they, together with the crowds, pleaded with the Lord with lamentations and tears to send a good angel for the salvation of Israel.
  footnotes:
  - marker: a
    text: Or 'for Israel's deliverance.' The Greek σωτηρία can denote rescue or deliverance in a concrete crisis as well as salvation more broadly.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 마카베오 주변에 있던 사람들이 그가 그 요새들을 포위하고 있다는 사실을 알게 되자, 그들은 무리들과 함께 통곡하며 눈물을 흘리면서 주님께 간청하여 이스라엘의 구원을 위해 좋은 천사를 보내 달라고 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘의 구출을 위해’. 그리스어 σωτηρία는 구체적 위기에서의 구조와 더 넓은 의미의 구원을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετέλαβον
  english_pob_choice: learned
  chosen_korean: 알게 되자
  alternatives_korean:
  - 들었을 때
  - 알아차렸을 때
  - 알고 나서
  lexicon: LSJ
  rationale: 문맥상 마카베오 편에 있던 이들이 포위 사실을 인지하게 된 순간을 자연스럽게 옮기되, 단순한 청취가 아니라 ‘알게 됨’의 의미를 살렸습니다.
- source_word: οἱ περὶ τὸν Μακκαβαῖον
  english_pob_choice: those around Maccabeus
  chosen_korean: 마카베오 주변에 있던 사람들
  alternatives_korean:
  - 마카베오와 함께 있던 사람들
  - 마카베오의 무리
  - 마카베오 편 사람들
  lexicon: LSJ
  rationale: 마카베오를 둘러싼 동료 집단이라는 뜻을 드러내기 위해 ‘주변에 있던 사람들’로 옮겼습니다.
- source_word: πολιορκοῦντα
  english_pob_choice: was besieging
  chosen_korean: 포위하고 있다는
  alternatives_korean:
  - 공격하고 있다는
  - 봉쇄하고 있다는
  - 공성하고 있다는
  lexicon: LSJ
  rationale: πολιορκέω의 기본 군사적 의미를 따라 ‘포위하다’로 옮기고, 진행 중인 상황을 나타내기 위해 진행형 구성을 사용했습니다.
- source_word: ἱκέτευον
  english_pob_choice: pleaded
  chosen_korean: 간청하여
  alternatives_korean:
  - 애원하여
  - 간구하여
  - 탄원하여
  lexicon: LSJ
  rationale: 강한 청원을 나타내는 동사로서, 현대 한국어에서 지나치게 구어적이지 않으면서도 절박함을 담는 ‘간청하다’를 택했습니다.
- source_word: ὀδυρμῶν καὶ δακρύων
  english_pob_choice: with lamentations and tears
  chosen_korean: 통곡하며 눈물을 흘리면서
  alternatives_korean:
  - 탄식하며 눈물을 흘리면서
  - 애곡하며 눈물을 흘리면서
  - 슬퍼하며 눈물을 흘리면서
  lexicon: LSJ
  rationale: 두 명사가 함께 만드는 비탄의 강도를 살려, 단순한 ‘슬퍼하며’보다 더 강한 ‘통곡하며’와 ‘눈물을 흘리면서’로 표현했습니다.
- source_word: πρὸς σωτηρίαν τῷ Ἰσραήλ
  english_pob_choice: for the salvation of Israel
  chosen_korean: 이스라엘의 구원을 위해
  alternatives_korean:
  - 이스라엘의 구출을 위해
  - 이스라엘을 건져 주시도록
  - 이스라엘의 해방을 위해
  lexicon: LSJ
  rationale: σωτηρία의 군사적 ‘구출/구원’ 가능성을 유지하되, 종교적·구원사적 울림도 살리기 위해 기본어 ‘구원’을 사용했습니다.
theological_decisions:
- issue: κύριος의 한국어 처리
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 주인
  rationale: 유대인 기도문 맥락에서 κύριος는 하나님을 가리키므로, 프로젝트 기본어인 ‘주님’을 사용해 경외성과 성경적 관용을 함께 살렸습니다.
  doctrine_reference: 'Contested terms: κύριος → 주님'
- issue: ἀγαθὸν ἄγγελον의 번역
  chosen_reading: 좋은 천사
  alternative_readings:
  - 선한 천사
  - 은혜로운 천사
  - 호의로운 천사
  rationale: 형용사 ἀγαθός의 직접적 의미를 살려 ‘좋은’으로 옮겼고, 천사의 성격을 과도하게 해석적으로 확장하지 않았습니다.
  doctrine_reference: Lexical transparency and source closeness
