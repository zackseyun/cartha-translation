  yaml_path: translation/deuterocanon/2_maccabees/011/016.yaml
  text: 'For letters had been written to the Jews from Lysias[a], containing this form: “Lysias to the multitude of the Jews[b], greetings.”'
  footnotes:
  - marker: a
    text: Or “this wording.” The Greek phrase introducing the letter can refer to its form or exact wording.
    reason: lexical_alternative
  - marker: b
    text: Or “to the assembly/body of the Jews.” The term translated “multitude” denotes a large collective group.
    reason: lexical_alternative
translation:
  language: ko
  text: 실제로 유대인들에게는 리시아스에게서 온 편지들이 이미 있었고, 그 편지들은 다음과 같은 형식으로 되어 있었습니다[a]. 「리시아스가 유대인의 무리에게[b] 문안드립니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “다음과 같은 문구로.” 편지를 도입하는 헬라어 표현은 그 형식이나 정확한 문구를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “유대인의 회중에게” 또는 “유대인의 단체에게.” 이 말은 큰 집단 또는 집합체를 가리킵니다.
    reason: lexical_alternative
