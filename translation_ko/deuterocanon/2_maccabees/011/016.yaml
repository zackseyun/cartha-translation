    rationale: ‘그런데’는 대조·전환으로 들릴 수 있으나 γάρ는 설명적 연결입니다. 또한 ‘보낸 편지들이 있었다’보다 ‘이미 ... 온 편지들이 있었다’가 ἦσαν γεγραμμέναι의 완료된 상태를 더 잘 나타냅니다.
