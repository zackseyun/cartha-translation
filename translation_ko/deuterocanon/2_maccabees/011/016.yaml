base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/016.yaml
  text: 'For letters had been written to the Jews from Lysias[a], containing this form: “Lysias to the multitude of the Jews[b], greetings.”'
  footnotes:
  - marker: a
    text: Or “this wording.” The Greek phrase introducing the letter can refer to its form or exact wording.
    reason: lexical_alternative
  - marker: b
    text: Or “to the assembly/body of the Jews.” The term translated “multitude” denotes a large collective group.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 유대인들에게는 리시아스로부터 보낸 편지들이 있었는데, 그 내용은 이러합니다. 「리시아스가 유대인의 무리에게 문안합니다。」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 문구로.” 편지를 도입하는 헬라어 구는 그 형식이나 정확한 문구를 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “유대인의 회중/몸에게.” 여기의 말은 큰 집합체를 가리키므로, 단순한 인구 집단을 넘어선 공동체 뉘앙스를 띨 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν γὰρ γεγραμμέναι
  english_pob_choice: For letters had been written
  chosen_korean: 그런데 … 편지들이 있었는데
  alternatives_korean:
  - 왜냐하면 … 편지들이 기록되어 있었습니다
  - 편지들이 이미 써져 있었는데
  lexicon: LSJ
  rationale: 플루퍼펙트 수동의 ‘이미 작성되어 있었음’을 한국어에서는 자연스러운 배경 설명인 ‘있었는데’로 옮겨, 앞뒤 서술 연결을 살렸습니다.
- source_word: παρὰ μὲν Λυσίου
  english_pob_choice: from Lysias
  chosen_korean: 리시아스로부터
  alternatives_korean:
  - 리시아스에게서
  - 리시아스에 의해
  lexicon: LSJ
  rationale: παρά + 속격의 출처·발신자 의미를 살려, 행정 서신의 발신처를 분명히 하는 ‘-로부터’로 옮겼습니다.
- source_word: τὸν τρόπον τοῦτον
  english_pob_choice: this form
  chosen_korean: 그 내용은 이러합니다
  alternatives_korean:
  - 이 형식으로
  - 이런 문구로
  - 이 문장은 이렇습니다
  lexicon: LSJ
  rationale: 서신 서두에서 뒤이어 나올 인용문의 도입이라는 점을 반영해, 딱딱한 직역보다 한국어에서 자연한 ‘그 내용은 이러합니다’로 처리했습니다.
- source_word: τῷ πλήθει τῶν Ἰουδαίων
  english_pob_choice: to the multitude of the Jews
  chosen_korean: 유대인의 무리에게
  alternatives_korean:
  - 유대인들의 무리에게
  - 유대인의 큰 무리에게
  - 유대인의 회중에게
  lexicon: LSJ
  rationale: πλῆθος의 집합적 의미를 살리되, 2마카베오스의 문맥에서 ‘회중’처럼 제도화된 뉘앙스를 덧씌우지 않기 위해 ‘무리’로 옮겼습니다.
- source_word: χαίρειν
  english_pob_choice: greetings
  chosen_korean: 문안합니다
  alternatives_korean:
  - 인사합니다
  - 안부를 전합니다
  - 기쁨을 빕니다
  lexicon: LSJ
  rationale: 서신 인사말 χαίρειν의 관용적 기능을 살려, 현대 한국어의 공문·서신체에 자연한 ‘문안합니다’로 옮겼습니다.
theological_decisions:
- issue: 인용문 서두의 서신 형식 유지
  chosen_reading: 직접 인용을 따옴표로 열고, 헬라어 서신 인사말의 공적·문서적 성격을 그대로 드러냈습니다.
  alternative_readings:
  - 서술형으로만 풀어 쓰기
  - 인용부호 없이 요약하기
  rationale: 본문은 단순 정보 전달이 아니라 실제 편지의 문구를 제시하므로, 인용 구조를 유지해야 원문 기능이 보존됩니다.
  doctrine_reference: 성경 본문 형식 보존 원칙
