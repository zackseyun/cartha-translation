  verdict: revise
  source_fidelity: 개정이 필요합니다. γάρ는 앞 문맥을 설명하는 연결이고, ἦσαν γεγραμμέναι는 ‘편지들이 이미 써져 있었다/기록되어 있었다’라는 완료된 수동 상태를 나타냅니다. 초안의 ‘그런데’와 ‘보낸 편지들이 있었는데’는 대체로 뜻은 통하지만, 연결 관계와 수동 완료의 뉘앙스가 약해집니다. 또한 τὸν τρόπον τοῦτον은 뒤따르는 편지의 형식 또는 문구를 도입하며, 해당 각주는 바로 그 표현에 붙어야 합니다.
  naturalness: ‘유대인들에게는 리시아스로부터 보낸 편지들이 있었는데’는 조사가 겹치고 다소 부자연스럽습니다. ‘유대인들에게는 리시아스에게서 온 편지들이 이미 있었고’가 현대 표준어 문장으로 자연스럽습니다. 인용된 서신의 인사말은 ‘문안드립니다’가 공적 서신체와 합쇼체에 잘 맞습니다.
  terminology: ‘리시아스’, ‘유대인’, ‘무리’, ‘문안드립니다’는 적절합니다. πλῆθος를 제도적 ‘회중’으로 단정하지 않고 본문에서는 ‘무리’로 유지해야 합니다. 각주에서 ‘몸에게’는 한국어로 부자연스럽고, ‘단체’ 또는 ‘회중’으로 고쳐야 합니다.
