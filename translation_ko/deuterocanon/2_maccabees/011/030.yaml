  text: Therefore[a], for those who come down until the thirtieth of Xanthicus, there will be a right hand of assurance together with permission[b],
  footnotes:
  - marker: a
    text: Or, more literally, 'there will be a right hand with permission'; the phrase 'right hand' here is an idiom for a pledge or assurance of good faith.
    reason: lexical_alternative
  - marker: b
    text: Xanthicus is a Macedonian month name used in Hellenistic dating.
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 크산티코스월 30일까지 내려가는 이들에게는 허가와 함께 신의의 보증이 주어질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 크산티코스는 헬레니즘 시대의 연대 표기에 쓰인 마케도니아 달 이름입니다.
    reason: cultural_note
  - marker: b
    text: 직역하면 ‘오른손’입니다. 여기서는 신의의 보증이나 성실한 확약을 뜻하는 관용적 표현입니다.
    reason: lexical_alternative
