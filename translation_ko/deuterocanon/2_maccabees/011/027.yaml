  yaml_path: translation/deuterocanon/2_maccabees/011/027.yaml
  text: 'And to the nation the king’s letter was as follows: “King Antiochus to the council of elders of the Jews and to the other Jews[b][a], greetings.”'
  footnotes:
  - marker: a
    text: Or “to the rest of the Jews.”
    reason: lexical_alternative
  - marker: b
    text: The Greek γερουσία refers to an official body of elders; “council of elders” is chosen for clarity, with “senate” as a possible alternative.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 백성을 향하여 왕의 편지는 이러했습니다. “안티오코스 왕이 유대인의 장로 회의와 다른 유대인들에게 인사합니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나머지 유대인들에게.”
    reason: alternative_reading
  - marker: b
    text: 그리스어 γερουσία는 공식적 장로 기구를 가리키며, 여기서는 ‘장로 회의’로 옮겼습니다. “원로원”도 가능한 번역입니다.
    reason: cultural_note
lexical_decisions:
- source_word: Πρὸς δὲ τὸ ἔθνος
  english_pob_choice: And to the nation
  chosen_korean: 그리고 백성을 향하여
  alternatives_korean:
  - 그리고 나라를 향하여
  - 그리고 민족에게
  lexicon: LSJ
  rationale: πρός + 대격은 여기서 서신의 수신 방향을 나타내며, ἔθνος은 문맥상 집단 전체를 가리키므로 ‘백성’이 자연스럽고 과도한 국가 개념화를 피합니다.
- source_word: ἡ τοῦ βασιλέως ἐπιστολή
  english_pob_choice: the king’s letter
  chosen_korean: 왕의 편지
  alternatives_korean:
  - 왕의 서한
  - 왕실의 편지
  lexicon: LSJ
  rationale: 소유격 구조를 그대로 살리면서도 한국어 서신 문맥에 자연스러운 ‘편지’로 옮겼습니다.
- source_word: τῇ γερουσίᾳ τῶν Ἰουδαίων
  english_pob_choice: to the council of elders of the Jews
  chosen_korean: 유대인의 장로 회의와
  alternatives_korean:
  - 유대인의 원로원과
  - 유대인의 장로 المجلس과
  - 유대인의 장로들 회의와
  lexicon: LSJ
  rationale: γερουσία는 공식적 장로 기구를 가리키므로 ‘장로 회의’로 옮겨 제도적 성격을 드러냈습니다. 끝의 ‘와’는 다음 수신자 구문과 연결하기 위한 한국어 문장 구성입니다.
- source_word: τοῖς ἄλλοις Ἰουδαίοις
  english_pob_choice: to the other Jews
  chosen_korean: 다른 유대인들에게
  alternatives_korean:
  - 나머지 유대인들에게
  - 그 밖의 유대인들에게
  lexicon: LSJ
  rationale: 앞의 장로 회의와 구별되는 넓은 수신층을 단순하고 직접적으로 드러내는 표현입니다.
- source_word: χαίρειν
  english_pob_choice: greetings
  chosen_korean: 인사합니다
  alternatives_korean:
  - 문안합니다
  - 평안을 빕니다
  lexicon: LSJ
  rationale: χαίρειν은 서간문 관용 인사말이므로, 뜻을 살리면서도 현대 한국어 서신체에 맞는 ‘인사합니다’로 옮겼습니다.
theological_decisions:
