  verdict: revise
  source_fidelity: 인명과 사절 파견, 문서의 제시, 그리고 그 문서로 표시된 사항에 관한 요청이라는 기본 의미는 충실합니다. 다만 χρηματισμός를 ‘공문서’로 단정하면 ‘공식 문서’라는 성격을 다소 과도하게 확정할 수 있고, διʼ αὐτοῦ는 단순히 문서 ‘안에’ 있는 내용보다 그 문서를 통하여 전달·표시된 사항을 가리킵니다.
  naturalness: 합쇼체 문장으로 자연스럽습니다. 다만 외교·문서 문맥에서는 ‘제시하고’보다 ‘제출하고’가 ἐπιδόντες의 문서 전달 행위에 더 잘 맞으며, ‘그것으로 알려진 사항들’이 원문의 매개 표현을 자연스럽게 보존합니다.
