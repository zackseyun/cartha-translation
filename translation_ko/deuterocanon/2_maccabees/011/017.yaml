  text: John and Absalom[a], who were sent by you, delivered the written memorandum and made request concerning the matters indicated in it.
  footnotes:
  - marker: a
    text: Or 'the appended written communication' or 'the decree written below.' The Greek phrase τὸν ὑπογεγραμμένον χρηματισμόν is documentary and somewhat technical.
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분이 보낸 요한과 압살롬은 아래에 적힌 공문서를 제시하고, 그 안에 밝힌 일들에 관해 요청했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''공문서''는 그리스어의 다소 기술적인 문서 표현(ὑπογεγραμμένον χρηματισμόν)을 한국어로 자연스럽게 풀어 옮긴 것입니다.'
    reason: lexical_alternative
