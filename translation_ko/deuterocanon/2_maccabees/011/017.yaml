  text: John and Absalom[a], who were sent by you, delivered the written memorandum and made request concerning the matters indicated in it.
  footnotes:
  - marker: a
    text: Or 'the appended written communication' or 'the decree written below.' The Greek phrase τὸν ὑπογεγραμμένον χρηματισμόν is documentary and somewhat technical.
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분이 보낸 요한과 압살롬은 아래에 기록된 서면 통지를 제출하고, 그것으로 알려진 사항들에 관하여 요청하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아래에 기록된 서면 통지’는 그리스어 ὑπογεγραμμένον χρηματισμόν을 옮긴 것입니다. 이는 ‘아래에 적힌/덧붙인 문서’, ‘서면 통지’ 또는 ‘기록된 지시’로도 이해될 수 있는 다소 기술적인 문서 표현입니다.
    reason: lexical_alternative
