base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/005.yaml
  text: But after entering Judea and approaching Beth-zur[a], a fortified place about five schoeni from Jerusalem[b], he was besieging it.
  footnotes:
  - marker: a
    text: A schoenus was an ancient unit of distance; its exact length varied by context and region.
    reason: cultural_note
  - marker: b
    text: Or 'was besieging it.' The Greek verb literally means 'was pressing' or 'was afflicting,' and here likely refers to military pressure against Beth-zur.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 유다 땅에 들어와 베드-수르에 가까이 갔는데, 그곳은 견고한 곳으로 예루살렘에서 약 다섯 스코이노스 떨어져 있었으므로, 그곳을 압박하고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 스코이노스는 고대 거리 단위로, 정확한 길이는 시대와 지역에 따라 달랐습니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘그곳을 포위하고 있었습니다.’ 그리스어 동사는 문자적으로는 ‘누르고 있다’ 또는 ‘압박하고 있다’의 뜻이며, 여기서는 베드-수르에 대한 군사적 압박을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  english_pob_choice: after entering
  chosen_korean: 들어와
  alternatives_korean:
  - 들어간 뒤
  - 들어오신 뒤
  lexicon: LSJ
  rationale: 부사적 분사로서 앞선 동작을 배경으로 제시하므로, 한국어에서는 자연스러운 연결형 ‘들어와’로 순서를 살렸습니다.
- source_word: συνεγγίσας
  english_pob_choice: approaching
  chosen_korean: 가까이 갔는데
  alternatives_korean:
  - 다가가
  - 접근하여
  lexicon: LSJ
  rationale: 베드-수르를 향해 이동하는 동작을 나타내므로, 현대 한국어에서 자연스럽고 문맥에 맞는 ‘가까이 갔는데’로 옮겼습니다.
- source_word: ἐρυμνῷ χωρίῳ
  english_pob_choice: a fortified place
  chosen_korean: 견고한 곳
  alternatives_korean:
  - 요새화된 곳
  - 튼튼한 장소
  - 성채
  lexicon: LSJ
  rationale: χωρίον의 ‘장소/곳’과 ἐρυμνός의 ‘견고함’을 함께 살리되, 본문이 반드시 성채라는 특정 건축물을 뜻하지는 않으므로 ‘견고한 곳’으로 넓지 않게 번역했습니다.
- source_word: σχοίνους πέντε
  english_pob_choice: five schoeni
  chosen_korean: 다섯 스코이노스
  alternatives_korean:
  - 다섯 스코이누스
  - 약 30마일
  lexicon: LSJ
  rationale: 고대 거리 단위를 현대 단위로 환산하면 오차가 생길 수 있으므로, 음역을 유지해 독자가 원문의 계량감을 그대로 보게 했습니다.
- source_word: ἔθλιβε
  english_pob_choice: was besieging it
  chosen_korean: 압박하고 있었습니다
  alternatives_korean:
  - 포위하고 있었습니다
  - 괴롭히고 있었습니다
  - 세게 몰아붙이고 있었습니다
  lexicon: LSJ
  rationale: 동사가 문자적으로는 ‘누르다/압박하다’의 뜻을 가지며, 전쟁 맥락에서 군사적 압박을 나타내므로, 과도하게 기술적인 ‘포위하다’보다 원문의 압력을 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 군사적 동사의 뉘앙스
  chosen_reading: ἔθλιβε를 단순히 ‘포위하다’로 고정하지 않고 ‘압박하다’로 옮겼습니다.
  alternative_readings:
  - 포위하고 있었습니다
  - 공격하고 있었습니다
  rationale: 영어 POB의 주석처럼 이 동사는 문자적으로 ‘누르다/압박하다’의 의미가 강하며, 본문은 베드-수르에 대한 군사적 압력을 말하므로 그 긴장감을 그대로 남기는 것이 본문 충실성에 더 맞습니다.
  doctrine_reference: 문맥-기반 어휘 선택
