base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/005.yaml
  text: But after entering Judea and approaching Beth-zur[a], a fortified place about five schoeni from Jerusalem[b], he was besieging it.
  footnotes:
  - marker: a
    text: A schoenus was an ancient unit of distance; its exact length varied by context and region.
    reason: cultural_note
  - marker: b
    text: Or 'was besieging it.' The Greek verb literally means 'was pressing' or 'was afflicting,' and here likely refers to military pressure against Beth-zur.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 유다에 들어가 요새화된 곳이며 예루살렘에서 약 다섯 스코이노스[a] 떨어진 벳수르 가까이 이르러, 그곳을 압박하고 있었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 스코이노스는 고대 거리 단위로, 정확한 길이는 시대와 지역에 따라 달랐습니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘그곳을 포위하고 있었습니다.’ 그리스어 동사는 문자적으로 ‘누르다’ 또는 ‘압박하다’를 뜻하며, 여기서는 벳수르에 대한 군사적 압박을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  english_pob_choice: after entering
  chosen_korean: 들어와
  alternatives_korean:
  - 들어간 뒤
  - 들어오신 뒤
  lexicon: LSJ
  rationale: 부사적 분사로서 앞선 동작을 배경으로 제시하므로, 한국어에서는 자연스러운 연결형 ‘들어와’로 순서를 살렸습니다.
- source_word: συνεγγίσας
  english_pob_choice: approaching
  chosen_korean: 가까이 갔는데
