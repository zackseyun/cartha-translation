    reason: lexical_alternative
lexical_decisions:
- source_word: πέπομφα
  english_pob_choice: I have sent
  chosen_korean: 보내었습니다
  alternatives_korean:
  - 보냈습니다
  - 보내었습니다
  lexicon: LSJ
  rationale: 완료된 파견을 나타내는 완전형의 의미를 살려, 현대 한국어에서는 완료성과 현재적 관련성을 함께 담을 수 있는 '보내었습니다'를 택했습니다.
- source_word: δὲ
  english_pob_choice: and
  chosen_korean: 그리고
  alternatives_korean:
  - 그러나
  - 또
  lexicon: LSJ
  rationale: 강한 대조가 아니라 문맥을 잇는 연결이므로 '그리고'로 자연스럽게 옮겼습니다.
- source_word: παρακαλέσοντα
  english_pob_choice: to encourage
  chosen_korean: 격려하러
  alternatives_korean:
  - 권면하러
  - 권고하러
  - 간청하러
  lexicon: LSJ
  rationale: παρακαλέω는 문맥상 위로·권면·호소를 모두 포함할 수 있으므로, 본문 흐름에 맞게 너무 좁히지 않는 '격려하러'를 선택했습니다.
- source_word: τὸν Μενέλαον
  english_pob_choice: Menelaus
  chosen_korean: 메네라오스
  alternatives_korean:
  - 메넬라오스
  lexicon: proper nouns
  rationale: 인명은 현대 외래어 표기 원칙에 따라 음역하되, 한국어 관용형이 확립되지 않은 이름이므로 음가를 따라 적었습니다.
theological_decisions:
- issue: παρακαλέω의 의미 범위
  chosen_reading: '''격려하다''를 기본으로 하되, 권면·호소의 함의를 함께 열어 둡니다.'
  alternative_readings:
  - 권면하다
  - 간청하다
  - 호소하다
  rationale: 이 절은 외교적 문맥에서 파견된 인물의 발언 목적을 말하므로, 단순한 정서적 격려로만 좁히지 않고 설득적 권면의 여지를 남기는 번역이 적절합니다.
  doctrine_reference: 문맥 중심 의미역 선택
