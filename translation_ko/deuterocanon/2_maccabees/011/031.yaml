base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/031.yaml
  text: that the Jews may make use of their own provisions and laws[a], just as before[b]; and none of them shall in any way be harassed concerning the things done in ignorance.
  footnotes:
  - marker: a
    text: Or 'their own provisions' or 'their own customary fare'; the Greek term can denote expenditures or provisions, and here likely refers to practical arrangements connected with Jewish way of life, possibly including diet.
    reason: lexical_alternative
  - marker: b
    text: Or 'for the things done in ignorance.' The Greek phrase is somewhat broad and may refer to acts committed unintentionally or without full knowledge.
    reason: alternative_reading
translation:
  language: ko
  text: 유대인들은 이전과 마찬가지로 자기들의 생활비와 율법을 따를 수 있으며[a][b], 그들 가운데 아무도 무슨 일이든지 알지 못한 채 저지른 일로 인해 어떤 방식으로도 괴롭힘을 당하지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기들의 생활상의 마련’이나 ‘자기들의 관습적 식생활’. 그리스어는 지출이나 소요 비용을 가리킬 수 있으며, 여기서는 유대인의 삶의 방식과 연결된 실제적 마련을 뜻할 가능성이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘무엇이든지 알지 못한 채 저지른 일들에 대해’. 그리스어 구문은 넓어서, 의도치 않게 또는 충분히 알지 못한 채 행한 행동을 가리킬 수 있습니다.
    reason: alternative_reading
