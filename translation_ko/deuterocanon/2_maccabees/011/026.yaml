  text: Therefore you will do well to send to them and give them pledges of good faith[a], so that, knowing our intention, they may be encouraged and may gladly attend to the securing of their own affairs.
  footnotes:
  - marker: a
    text: Greek literally, 'having given right hands,' a diplomatic idiom for giving assurances or pledges of good faith.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그들에게 사람을 보내고 우호의 손을 내밀어 보증해 주는 것이 좋겠습니다[a]. 그러면 그들이 우리의 의도를 알고 용기를 얻어, 자기들의 일을 기꺼이 처리하게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어로는 ‘오른손을 주어’라는 관용구로, 보증이나 신의의 약속을 뜻합니다.
    reason: lexical_alternative
