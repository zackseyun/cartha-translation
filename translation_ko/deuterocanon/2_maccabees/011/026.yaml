  source_fidelity: ‘우호의 손을 내밀어 보증해 주는’은 δεξιὰς διδόναι의 외교적 관용 의미를 전달하려 하나, ‘우호’와 ‘손을 내밀다’가 원문의 약속·보증 행위를 다소 흐리고 한국어로도 부자연스럽습니다. ‘신의의 보증을 해 주다’가 관용적 의미를 더 직접적으로 충실히 전달합니다. 또한 διαπεμψάμενος가 보내는 대상을 명시하지 않으므로 ‘사람’을 보충한 것은 가능하지만 불필요하게 한정합니다.
  naturalness: ‘그들에게 보내고 신의의 보증을 해 주면 잘할 것입니다’는 한국어에서 자연스러운 권고 표현이며, 원문의 미래형 권면을 유지합니다. ‘자기들의 일을 기꺼이 처리하게 될 것입니다’도 가능하나, ἀντίληψις의 ‘돌봄/관여’ 범위를 살려 ‘돌보게 될 것입니다’가 더 넓고 자연스럽습니다.
  terminology: δεξιὰς는 직역하면 ‘오른손들’이나 여기서는 신의의 약속 또는 보증을 뜻하는 외교적 관용구입니다. 본문은 ‘신의의 보증’으로 옮기고, 각주는 직역과 관용적 의미를 밝혀야 합니다. προαίρεσις는 ‘의도’로 적절합니다.
