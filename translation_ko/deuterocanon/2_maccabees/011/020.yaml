  yaml_path: translation/deuterocanon/2_maccabees/011/020.yaml
  text: But concerning these matters in detail[b][a], I have given orders that both these men and those from me should speak with you.
  footnotes:
  - marker: a
    text: Or 'should confer with you.' The Greek verb can denote discussion or negotiation, not merely speaking.
    reason: lexical_alternative
  - marker: b
    text: Literally 'those from me,' likely meaning the king's own representatives or agents.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 이 문제들에 관하여 자세히는, 나는 이 사람들과 내게서 온 사람들[a] 모두가 여러분과 협의하도록[b] 이미 지시해 두었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내게서 온 사람들’입니다. 왕의 대표자들이나 대리인들을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 동사는 ‘말하다’, ‘논의하다’, ‘협의하다’를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ δὲ τούτων
  english_pob_choice: But concerning these matters
  chosen_korean: 그러므로 이 일들에 관해서는
  alternatives_korean:
  - 하지만 이 일들에 관하여는
  - 그런데 이 문제들에 대해
  lexicon: BDAG
  rationale: ὑπέρ+속격의 ‘관하여/대하여’ 의미를 살려 행정적 맥락의 주제를 자연스럽게 연결했고, δέ는 문맥상 약한 전환으로 ‘그러므로’에 흡수했습니다.
- source_word: κατὰ μέρος
  english_pob_choice: in detail
  chosen_korean: 이 일들에 관해서는
  alternatives_korean:
  - 자세히
  - 항목별로
  lexicon: LSJ
  rationale: ‘in detail’의 항목별·세부적 처리를 한국어에서는 앞의 관하여 구문에 자연스럽게 통합해, 원문의 행정적 뉘앙스를 흐리지 않도록 했습니다.
- source_word: ἐντέταλμαι
  english_pob_choice: I have given orders
  chosen_korean: 이미 지시해 두었습니다
  alternatives_korean:
  - 명령해 두었습니다
  - 명령을 내렸습니다
  lexicon: BDAG
  rationale: 완료형의 현재 효력과 공식적 권위를 살리되, 한국어에서는 과도하게 군사적으로 들릴 수 있는 ‘명령’보다 공적 행정 문맥에 맞는 ‘지시해 두었습니다’로 옮겼습니다.
- source_word: τοὺς παρʼ ἐμοῦ
  english_pob_choice: those from me
  chosen_korean: 내 쪽 사람들
  alternatives_korean:
  - 내가 보낸 사람들
  - 내 대표자들
  lexicon: BDAG
  rationale: 직역의 ‘내게서 온 사람들’보다, 왕의 측근·대리인을 가리키는 행정적 표현으로서 한국어 독자가 이해하기 쉬운 ‘내 쪽 사람들’을 택했습니다.
theological_decisions:
- issue: 대화 동사 διαλεχθῆναι의 범위
  chosen_reading: ‘이야기하도록’으로 번역해, 단순 발화보다 협의·논의의 여지를 열어 두었습니다.
  alternative_readings:
  - 상의하도록
  - 협의하도록
  rationale: 영어 POB가 ‘speak with you’와 각주로 ‘confer with you’ 가능성을 남긴 점을 반영해, 대화·협의의 폭을 좁히지 않으면서도 자연스러운 한국어로 처리했습니다.
  doctrine_reference: 번역학적 선택
