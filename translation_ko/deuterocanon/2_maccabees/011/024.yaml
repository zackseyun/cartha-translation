  lexicon: LSJ
  rationale: εἰς τὰ Ἑλληνικά를 단순 언어 전환이 아니라 문화적 헬라화로 읽어, ‘그리스식’과 ‘전환’으로 표현했습니다.
- source_word: τὴν ἑαυτῶν ἀγωγὴν αἱρετίζοντας
