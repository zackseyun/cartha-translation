  - 자기들의 생활양식을 고르며
  lexicon: LSJ
  rationale: ἀγωγή의 생활 방식, 행실, 삶의 양식 의미를 반영해 공동체적·윤리적 뉘앙스를 살렸습니다.
- source_word: συγχωρηθῆναι αὐτοῖς τὰ νόμιμα
  english_pob_choice: asking that their lawful customs be permitted to them
  chosen_korean: 자기들에게 그들의 합법적인 관습을 허락해 달라고 요청하는
  alternatives_korean:
  - 그들의 율법적 관습을 허용해 달라고 청하는
  - 그들에게 그들의 합법적인 관례를 허락해 달라고 요구하는
  lexicon: LSJ
  rationale: τὰ νόμιμα를 ‘합법적인 관습’으로 옮겨, 율법적·관행적 성격을 함께 드러냈고, συγχωρηθῆναι의 수동적 허용 의미를 ‘허락해 달라’로 살렸습니다.
