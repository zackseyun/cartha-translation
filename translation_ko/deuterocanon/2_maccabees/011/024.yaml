  source_fidelity: 초안은 유대인들이 부친의 헬라화 정책을 승인하지 않고 자신들의 생활 방식을 택하며 관습의 허용을 요청했다는 핵심을 대체로 반영합니다. 그러나 ἀκηκοότες는 복수의 발화 주체가 유대인들의 입장을 ‘들었다’는 완결된 사실을 나타내므로, ‘…들었기 때문입니다’는 원문에 없는 명시적 인과관계를 만들고 절 단독으로도 부자연스럽습니다. 또한 τὰ νόμιμα의 법·관습적 의미는 ‘합법적인 관습’보다 ‘율법에 따른 관습’이 문맥상 더 분명합니다.
  naturalness: ‘내 아버지의 그리스식으로의 전환’과 ‘자기들에게 그들의 합법적인 관습’은 현대 표준어에서 다소 번역투이고 반복적입니다. ‘내 아버지께서 그리스식 관습으로 바꾸신 일’ 및 ‘그들에게 율법에 따른 관습이 허용되게 해 달라’로 다듬으면 합쇼체의 격식을 유지하면서 자연스럽습니다.
  terminology: εἰς τὰ Ἑλληνικά는 언어만이 아니라 헬라화된 관습·생활양식으로의 변화를 뜻하므로 ‘그리스식 관습’으로 명시하고 각주로 보완하는 것이 적절합니다. ἀγωγή는 ‘생활 방식’, νόμιμα는 이 문맥에서 ‘율법에 따른 관습’으로 옮겼습니다.
