  rationale: τὰ νόμιμα를 ‘합법적인 관습’으로 옮겨, 율법적·관행적 성격을 함께 드러냈고, συγχωρηθῆναι의 수동적 허용 의미를 ‘허락해 달라’로 살렸습니다.
