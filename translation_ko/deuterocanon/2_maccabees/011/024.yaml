translation:
  language: ko
  text: 우리는 유대인들이 내 아버지께서 그리스식 관습으로 바꾸신 일을 승인하지 않고, 자신들의 생활 방식을 택하며, 그들에게 율법에 따른 관습이 허용되게 해 달라고 요청한다는 말을 들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그리스식 관습으로 바꾸신 일’은 단순히 언어를 그리스어로 바꾸었다는 뜻이라기보다, 헬라화된 관습과 생활양식으로 기울어진 변화를 가리킵니다.
    reason: lexical_alternative
