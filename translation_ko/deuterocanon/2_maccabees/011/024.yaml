translation:
  language: ko
  text: 유대인들이 내 아버지의 그리스식으로의 전환을 승인하지 않았고, 자기들의 삶의 방식을 택하며 자기들에게 그들의 합법적인 관습을 허락해 달라고 요청하는 것을 들었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그리스식으로의 전환’은 단순히 언어를 그리스어로 바꾸었다는 뜻이라기보다, 헬라화된 관습으로 기울어진 변화를 가리킵니다.
    reason: lexical_alternative
