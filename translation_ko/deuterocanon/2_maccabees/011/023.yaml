  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘유대인들의 돌봄에 마음을 쓰게 하기를’는 βουλόμενοι와 γενέσθαι의 구문을 사역적으로 바꾸어, 왕국의 사람들이 유대인들을 돌보도록 하려 한다는 뜻으로 과도하게 확정합니다. 그리스어는 그들이 유대인 관련 돌봄/업무에 관하여 방해받지 않기를 바란다는 취지이며, 압축된 πρὸς 구문의 범위는 각주로 보존하는 편이 적절합니다. ‘신들께로 떠나가셨고’는 εἰς θεοὺς μεταστάντος의 이교 왕실 완곡어를 자연스럽게 유지합니다.
  naturalness: ‘왕국에 속한 사람들이 유대인들을 돌보는 일과 관련하여 방해받지 않기를’은 현대 표준어 합쇼체 문장 안에서 자연스럽고, 원문의 서신 문맥에 맞는 격식도 유지합니다. 절 자체가 앞 절의 이유를 나타내는 종속 문장이므로 ‘때문입니다’로 끝내는 형태도 문맥상 허용됩니다.
  terminology: ‘우리 아버지’는 왕조적 호칭을 보존하며, ‘신들께로 떠나가셨다’는 죽음을 ‘돌아가셨다’나 ‘죽으셨다’로 평준화하지 않습니다. τῶν Ἰουδαίων ἐπιμέλεια는 ‘유대인들을 돌보는 일’로 옮기되, 이것이 ‘유대인들의 일에 관심을 기울이는 것’으로도 이해될 수 있는 압축 구문임을 각주에서 밝혔습니다.
