  yaml_path: translation/deuterocanon/2_maccabees/011/023.yaml
  text: Since our father has departed to the gods[a], and since we want those in the kingdom, being free from disturbance, to turn to the care of the Jews[b],
  footnotes:
  - marker: a
    text: 'Greek: ''has departed to the gods,'' a Hellenistic royal euphemism for death; some translations simplify this to ''has died.'''
    reason: lexical_alternative
  - marker: b
    text: The final clause is syntactically compressed in Greek and may also be understood more broadly as 'to give attention to Jewish affairs.'
    reason: alternative_reading
translation:
  language: ko
  text: 우리 아버지께서 신들께로 떠나가셨고[a], 또 우리가 왕국에 속한 사람들이 유대인들을 돌보는 일과 관련하여 방해받지 않기를 바라기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘신들께로 떠나가셨다’라고 하며, 죽음을 가리키는 헬레니즘 왕실의 완곡한 표현입니다. 일부 번역은 이를 단순히 ‘죽으셨다’로 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 그리스어에서 구문이 압축되어 있습니다. 더 넓게는 ‘유대인들의 일에 관심을 기울이는 것과 관련하여’로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
