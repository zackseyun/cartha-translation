- source_word: πρὸς τὴν τῶν Ἰουδαίων ἐπιμέλειαν
  english_pob_choice: to turn to the care of the Jews
  chosen_korean: 유대인들의 돌봄에 마음을 쓰게
  alternatives_korean:
  - 유대인들의 일에 주의를 기울이게
  - 유대인들의 사정에 관심을 두게
  lexicon: LSJ
  rationale: ἐπιμέλεια의 핵심인 ‘돌봄/관심/관리’의 의미를 살리면서, 압축된 그리스어 구문의 방향성을 한국어로 풀어 옮겼습니다.
theological_decisions:
- issue: 다신교적 왕실 완곡어의 보존
  chosen_reading: “신들 가운데로 옮겨 가셨고”를 유지하여 죽음의 관용적 표현을 그대로 드러냄
  alternative_readings:
