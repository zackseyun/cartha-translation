translation:
  language: ko
  text: 약 팔만 명과 기병 전부를 모은 뒤, 그는 유대인들에게로 나아갔습니다. 그리고 그 도성을 헬라인들의 거처로 만들려는 뜻을 품고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다 사람들’. 여기서 그리스어 Ἰουδαίους는 문맥에 따라 유대 민족 또는 유다 지역 사람들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: συναθροίσας
  english_pob_choice: After gathering
  chosen_korean: 모은 뒤
  alternatives_korean:
  - 소집한 뒤
  - 모아 둔 뒤
  - 집결시킨 뒤
  lexicon: LSJ
  rationale: 부정과거 분사로서 주동사보다 앞선 행위를 나타내므로, 한국어에서는 자연스럽게 ‘모은 뒤’로 시간 순서를 살렸습니다.
- source_word: περὶ τὰς ὀκτὼ μυριάδας
  english_pob_choice: about eighty thousand men
  chosen_korean: 약 팔만 명
  alternatives_korean:
  - 약 여덟 만 명
  - 약 팔만
  lexicon: LSJ
  rationale: μυριάς는 만 단위이므로 8×1만의 수를 한국어로 풀어 ‘팔만’으로 옮겼고, περὶ의 근사 의미는 ‘약’으로 반영했습니다.
- source_word: τὴν ἵππον ἅπασαν
  english_pob_choice: all the cavalry
  chosen_korean: 기병 전부
  alternatives_korean:
  - 모든 기병대
  - 온 기병대
  - 기병 전체
  lexicon: LSJ
  rationale: ἵππος가 군사 문맥에서 집합적으로 ‘기병대’를 뜻하므로, 말 자체보다 부대를 드러내는 표현으로 옮겼습니다.
- source_word: Ἰουδαίους
  english_pob_choice: the Jews
  chosen_korean: 유대인들에게로
  alternatives_korean:
  - 유다 사람들에게로
  - 유대 사람들에게로
  lexicon: LSJ
  rationale: 이 문맥에서는 민족·종교 집단을 가리키는 뜻이 자연스러워 ‘유대인들’로 번역했고, 전치사 ἐπί의 적대적 방향성은 ‘-에게로 나아갔습니다’로 살렸습니다.
- source_word: Ἕλλησιν οἰκητήριον ποιήσειν
  english_pob_choice: to make the city a dwelling place for Greeks
  chosen_korean: 헬라인들의 거처로 만들려는 뜻을 품고
  alternatives_korean:
  - 헬라인들을 위한 거처로 만들려는
  - 그리스인들의 거처로 삼으려는
  lexicon: LSJ
  rationale: οἰκητήριον ποιήσειν의 ‘거처/거주지로 만들다’라는 뜻을 살리면서, Ἕλλησιν의 여격을 ‘-들의 거처로’로 자연스럽게 반영했습니다.
theological_decisions:
- issue: Ἰουδαίους의 한국어 민족·집단 표지
  chosen_reading: ‘유대인들’로 번역하되, 본문상 적대 대상 집단이라는 점을 분명히 했습니다.
  alternative_readings:
  - ‘유다 사람들’
  - ‘유대 사람들’
  rationale: 2마카베오에서는 Ἰουδαῖοι가 유다 지역 주민과 유대 민족/종교 공동체를 함께 가리킬 수 있습니다. 본절은 군사적 충돌의 상대 집단을 지칭하므로 ‘유대인들’이 가장 자연스럽습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve significant alternatives in documentation'
