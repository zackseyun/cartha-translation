base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/034.yaml
  text: 'The Romans also sent them a letter[a], worded as follows: “Quintus Memmius and Titus Manius, elders of the Romans, to the people of the Jews, greetings.”'
  footnotes:
  - marker: a
    text: Or “Roman elders” or, contextually, “ambassadors of the Romans.” The Greek term is literally “elders.”
    reason: lexical_alternative
translation:
  language: ko
  text: 로마인들도 그들에게 편지를 보냈는데, 그 내용은 이렇습니다. 「퀸투스 멤미우스와 티투스 마니우스, 로마의 장로들이 유대인의 백성에게 문안합니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 문맥상 “로마의 사절들”로도 볼 수 있습니다. 그리스어는 문자적으로는 “장로들”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπέμψαν δὲ καὶ οἱ Ῥωμαῖοι πρὸς αὐτοὺς
  english_pob_choice: The Romans also sent them
  chosen_korean: 로마인들도 그들에게 보냈는데
  alternatives_korean:
  - 로마인들도 그들에게 보냈습니다
  - 로마인들도 그들에게 편지를 보냈는데
  lexicon: LSJ
  rationale: Ἐπέμψαν의 기본 의미를 살려 ‘보냈다’로 옮기고, 문맥상 대상이 편지이므로 뒤에서 자연스럽게 풀어 주었습니다.
- source_word: ἐπιστολήν, ἔχουσαν οὕτως
  english_pob_choice: a letter, worded as follows
  chosen_korean: 편지를 보냈는데, 그 내용은 이렇습니다
  alternatives_korean:
  - 서신을 보냈는데, 그 내용은 이렇습니다
  - 편지를 보내며 이같이 적었습니다
  lexicon: LSJ
  rationale: ἐπιστολήν은 일반적인 ‘편지’로 옮기고, ἔχουσαν οὕτως의 문서 서두 공식을 한국어 문서체로 자연스럽게 풀었습니다.
- source_word: πρεσβυταὶ Ῥωμαίων
  english_pob_choice: elders of the Romans
  chosen_korean: 로마의 장로들이
  alternatives_korean:
  - 로마인들의 장로들이
  - 로마 사람들의 노인들이
  lexicon: LSJ
  rationale: πρεσβυταί의 직역은 ‘장로들’이므로 이를 유지하되, 문맥상 편지 발신자 표기라는 점을 반영했습니다. 다만 ‘사절’로 구체화하지는 않았습니다.
- source_word: τῷ δήμῳ τῶν Ἰουδαίων
  english_pob_choice: to the people of the Jews
  chosen_korean: 유대인의 백성에게
  alternatives_korean:
  - 유대인의 사람들에게
  - 유대 백성에게
  lexicon: LSJ
  rationale: δήμος의 공동체적 의미를 살려 ‘백성’으로 옮겼고, 속격 구조는 한국어 자연어 순서에 맞게 처리했습니다.
- source_word: χαίρειν
  english_pob_choice: greetings
  chosen_korean: 문안합니다
  alternatives_korean:
  - 문안드립니다
  - 안부를 전합니다
  lexicon: LSJ
  rationale: 서신 첫머리의 χαίρειν 관용구를 현대 공문서/서간체에 맞게 ‘문안합니다’로 옮겼습니다.
theological_decisions:
- issue: 본문이 로마의 공문서 형식을 인용하는 서간체 표현을 어떻게 살릴지
  chosen_reading: 직접 인용부호를 사용해 편지 전문의 문체를 한국어에서도 분명하게 드러냈습니다.
  alternative_readings:
  - 평서문으로만 처리하여 인용 표시를 생략
  - 간접화법으로 완전히 풀어쓰기
  rationale: 이 구절은 내용보다 문서 형식 자체가 중요하므로, 인용부호와 ‘그 내용은 이렇습니다’를 통해 원문의 공식성을 보존했습니다.
  doctrine_reference: 본문 형식/서간 문체 보존
