  text: Therefore hurry[a], and send some men[b], so that we too may learn what your intention is.
  footnotes:
  - marker: a
    text: Or 'send some people' or 'send certain representatives'; the Greek indefinite τινας does not specify the group more precisely.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'that we too may know of what sort of opinion you are'; the translation renders the idiom as 'what your intention is.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 서둘러 몇 사람을 보내십시오[a]. 그리하여 우리도 여러분이 어떤 견해를 가지고 있는지 알 수 있게 해 주십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘몇몇 사람’ 또는 ‘어떤 사람들’로 옮길 수 있습니다. 그리스어 τινας는 그들이 누구인지 더 구체적으로 밝히지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘여러분이 견해에 관하여 어떤 이들인지 알 수 있게’입니다. 여기서는 상대편이 어떤 견해나 입장을 취하는지를 알고자 하는 뜻입니다.
    reason: lexical_alternative
