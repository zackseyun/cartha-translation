  text: If[a], then, you maintain your goodwill in these matters, I will also continue from now on to try to be the cause of good things for you.
  footnotes:
  - marker: a
    text: Or 'I will henceforth try to be the cause of benefits for you.' The Greek adjective αἰτιαῖος carries the sense of being causally responsible for something.
    reason: lexical_alternative
translation:
  language: ko
  text: 그렇다면, 이 일들에 대한 여러분의 호의를 지키신다면, 저도 앞으로 계속 여러분에게 좋은 일들의 원인이 되도록 애쓰겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이제부터 여러분에게 유익의 원인이 되도록 애쓰겠습니다.’ 그리스어 형용사 αἰτιαῖος는 어떤 일에 대해 인과적으로 책임이 있음을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: συντηρήσητε
  english_pob_choice: maintain
  chosen_korean: 지키신다면
  alternatives_korean:
  - 유지하신다면
  - 보존하신다면
  lexicon: BDAG
  rationale: 이미 지니고 있는 태도나 입장을 계속 간직한다는 뜻을 살려, 조건문의 권면에 자연스러운 ‘지키다’로 옮겼습니다.
- source_word: εὔνοιαν
  english_pob_choice: goodwill
  chosen_korean: 호의
  alternatives_korean:
  - 선의
  - 우호
  lexicon: LSJ
  rationale: 상대에게 향한 우호적이고 호의적인 마음을 가리키므로, 외교적 문맥에서도 자연스러운 ‘호의’를 택했습니다.
- source_word: εἰς τὰ πράγματα
  english_pob_choice: in these matters
  chosen_korean: 이 일들에
  alternatives_korean:
  - 이 문제들에
  - 이 상황에
  lexicon: LSJ
  rationale: 구체적 사안 전체를 가리키는 관용적 표현으로 이해하여, 과도하게 좁히지 않는 ‘이 일들에’로 옮겼습니다.
- source_word: αἰτιαῖος
  english_pob_choice: responsible for / the cause of
  chosen_korean: 원인이 되도록
  alternatives_korean:
  - 원인이 되겠습니다
  - 책임 있게 하겠습니다
  lexicon: LSJ
  rationale: 단순한 ‘좋은 일을 하다’가 아니라, 어떤 결과의 원인이 된다는 인과적 뉘앙스를 살리기 위해 ‘원인이 되다’를 사용했습니다.
- source_word: ἀγαθῶν
  english_pob_choice: good things / benefits
  chosen_korean: 좋은 일들
  alternatives_korean:
  - 유익한 일들
  - 은혜로운 일들
  lexicon: BDAG
  rationale: 복수형의 넓은 의미를 그대로 보존하면서, 약속의 내용이 포괄적 혜택임을 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 화자의 약속을 조건적으로 표현하는 방식
  chosen_reading: 상대의 호의가 유지될 경우, 그에 상응하여 화자도 계속 유익의 원인이 되겠다는 상호적 외교 언어로 옮겼습니다.
  alternative_readings:
  - 일방적 친선 선언으로 완화하는 번역
  - 단순한 미래 약속으로만 처리하는 번역
  rationale: 문맥은 신학적 진술보다 외교적·서간적 약속에 가깝기 때문에, 조건과 상호성을 분명히 드러내는 것이 원문 의도에 더 충실합니다.
  doctrine_reference: 문맥 우선의 서간체 번역 원칙
- issue: αἰτιαῖος의 인과성 보존
  chosen_reading: ‘좋은 일들의 원인이 되다’로 번역해 결과에 대한 인과적 책임을 살렸습니다.
  alternative_readings:
  - ‘좋은 일을 해 주다’
  - ‘도움이 되다’
  rationale: 본문의 핵심은 선의를 갖는 정도가 아니라 실제 결과를 낳는 원인이 되겠다는 다짐이므로, 그 인과성을 약화시키지 않았습니다.
  doctrine_reference: 어휘 의미 보존 원칙
