revisions:
- from: 그들은 전투 태세를 갖추고 앞으로 나아갔습니다. 하늘에서 온 동맹자가 그들 앞에 있었기 때문입니다. 주님께서 그들에게 자비를 베푸셨기 때문입니다.[a]
  to: 그들은 전투 태세를 갖추고 하늘에서 온 동맹자를 앞에 두고 전진했습니다. 이는 주님께서 그들에게 자비를 베푸셨기 때문입니다.[a]
  rationale: 중복된 인과 표현을 ‘이는 … 때문입니다’로 정리하여 원문의 문장 관계를 명료하게 했습니다. ‘앞에 두고’는 하늘의 동맹자가 그들보다 앞에 있다는 표현을 자연스럽게 옮기되, 그 존재가 천사인지 하나님의 직접적인 도우심인지 특정하지 않습니다. 각주는 압축된 첫 구절의 가능한 구문적 이해를 유지하면서 한국어를 자연스럽게 다듬었습니다.
  reviewer_model: gpt-5.6-terra
