  - 또 무엇이든지
  lexicon: LSJ
  rationale: δέ의 약한 대조를 살려 앞문맥과 이어 주되, ἃ의 부정관계대명사는 ‘무엇이든지’로 자연스럽게 옮겼습니다.
- source_word: προσανενεχθῆναι τῷ Βασιλεῖ
  english_pob_choice: should be presented to the king
  chosen_korean: 왕에게 제출하기로 결정한 것은
