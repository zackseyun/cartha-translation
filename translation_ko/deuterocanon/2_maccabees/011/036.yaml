  rationale: 행정적·공적 절차의 뉘앙스를 살려 ‘제출하다’로 옮겼고, 목적상태를 한국어 문장에 맞게 풀어 썼습니다.
- source_word: ἐπισκεψόμενον περὶ τούτων
  english_pob_choice: to examine these matters
  chosen_korean: 이 일들을 살필 사람을
  alternatives_korean:
  - 이 일들을 조사할 사람을
  - 이것들을 검토할 사람을
  lexicon: BDAG
  rationale: 미래분사가 파견 목적을 나타내므로, ‘살필 사람’으로 옮겨 조사·점검의 폭을 유지했습니다.
- source_word: ἵνʼ ἔχωμεν ὡς καθήκει ἡμῖν
  english_pob_choice: so that we may settle them as is fitting for us
  chosen_korean: 그래야 우리가 우리에게 합당한 대로 그것들을 처리할 수 있습니다
  alternatives_korean:
  - 그래야 우리가 우리에게 마땅한 대로 그것들을 다룰 수 있습니다
  - 그래야 우리가 우리에게 적절한 대로 그것들을 처리할 수 있습니다
  lexicon: LSJ
  rationale: ἔχωμεν을 단순한 ‘갖다’가 아니라 사안을 ‘처리하다/정리하다’는 관용적 의미로 이해하여, POB의 문맥 판단을 따라 ‘처리할 수 있습니다’로 옮겼습니다.
- source_word: προσάγομεν πρὸς Ἀντιοχίαν
  english_pob_choice: we are going on to Antioch
  chosen_korean: 우리는 안티오키아로 가고 있기 때문입니다
  alternatives_korean:
