  text: But whatever he has decided should be presented to the king, send someone at once to examine these matters, so that we may settle them as is fitting for us; for we are going on to Antioch.
  footnotes:
  - marker: a
    text: Or 'so that we may handle them as is proper for us.' The Greek literally says 'so that we may have [them] as is fitting for us,' an idiom that likely refers to arranging or settling the matters appropriately.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그가 왕에게 제출하기로 결정한 것은 무엇이든지, 이 일들을 살필 사람을 곧바로 보내십시오. 그래야 우리가 우리에게 합당한 대로 그것들을 처리할 수 있습니다. 우리는 안티오키아로 가고 있기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리에게 마땅한 대로 그것들을 다루게 하려는 것입니다.’ 그리스어는 문자적으로는 ‘우리에게 합당한 대로 그것들을 갖게 하려는 것’이라고 되어 있으며, 사안을 정리하거나 처리한다는 관용적 뜻일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ δὲ
  english_pob_choice: But whatever
  chosen_korean: 그러나 무엇이든지
  alternatives_korean:
