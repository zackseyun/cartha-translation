  text: and to make the sanctuary taxable in silver[a], like the other temples of the nations, and to make the high priesthood sold each year[b];
  footnotes:
  - marker: a
    text: Or 'subject to a silver tax' / 'assessed for monetary tribute.' The rare adjective ἀργυρολόγητον indicates making the sanctuary a source of money revenue, parallel to pagan temples.
    reason: lexical_alternative
  - marker: b
    text: Or 'to put the high priesthood up for sale each year.' The Greek presents the office itself as vendible, underscoring the proposed profanation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 성소를 은으로 세금이 매겨지게 하며[a], 다른 민족들의 다른 신전들처럼 하고, 대제사장직을 해마다 팔리게 하려는 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘은으로 거둬지게/과세되게’에 가깝습니다. 희귀한 ἀργυρολόγητον은 성소를 은전 수입의 대상, 곧 조세 부과의 원천으로 만들려는 뜻을 담습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘해마다 대제사장직을 팔게’입니다. 그리스어는 직분 자체가 매매 가능한 대상으로 전락하는 상황을 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερὸν
  english_pob_choice: sanctuary
  chosen_korean: 성소
  alternatives_korean:
  - 성전
  - 신성한 곳
  lexicon: LSJ
  rationale: 예루살렘의 거룩한 구역을 가리키는 말이므로, 건물 자체보다 예배 공간의 성격을 살리는 ‘성소’가 적절합니다.
- source_word: ἀργυρολόγητον
  english_pob_choice: taxable in silver
  chosen_korean: 은으로 세금이 매겨지게
  alternatives_korean:
  - 은세를 부과받게
  - 은으로 조세를 내게
  - 은으로 징수되게
  lexicon: LSJ
  rationale: 희귀한 형용사로서 성소가 은/돈의 수입원이 되도록 만든다는 뜻을 살려, 한국어에서는 자연스러운 수동 표현으로 옮겼습니다.
- source_word: τεμένη
  english_pob_choice: temples
  chosen_korean: 신전들
  alternatives_korean:
  - 성소들
  - 제사장 구역들
  lexicon: LSJ
  rationale: 이방 민족들의 이교 성소를 가리키므로, 현대 한국어에서 가장 직접적인 대응인 ‘신전들’이 문맥을 잘 드러냅니다.
- source_word: πρατὴν δὲ κατʼ ἔτος τὴν ἀρχιερωσύνην
  english_pob_choice: to make the high priesthood sold each year
  chosen_korean: 대제사장직을 해마다 팔리게
  alternatives_korean:
  - 대제사장직을 해마다 팔아넘기게
  - 대제사장직을 매년 매매되게
  - 대제사장직을 해마다 판매되게
  lexicon: LSJ
  rationale: ἀρχιερωσύνην은 사람보다 직분을 가리키므로 ‘대제사장직’으로 옮겼고, πρατήν의 상업화 뉘앙스는 ‘팔리게’로 간결하게 반영했습니다.
theological_decisions:
- issue: 성소와 대제사장직을 돈벌이와 매매의 대상으로 만드는 모독적 내용
  chosen_reading: 본문의 의도적 타락성과 신성 모독을 완화하지 않고, 행위의 상업화와 제의 질서의 훼손을 직접적으로 드러냈습니다.
  alternative_readings:
  - 완곡하게 ‘세금을 부과받게’ 또는 ‘운영비를 내게’처럼 순화하는 번역
  - 대제사장직을 단순한 ‘임명’으로 축소하는 번역
  rationale: 그리스어는 성소와 직분 자체를 수익화·매매화하는 폭력을 말하므로, 독자가 그 종교적·정치적 모욕을 그대로 이해하도록 유지해야 합니다.
  doctrine_reference: 성소의 거룩함과 제의 직분의 불가매매성
