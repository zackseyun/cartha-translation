  - 쉼표로만 남기기
  rationale: 그리스어도 participial clause로 끝나며 영어 POB도 다음 절로 이어지는 미완결성을 주석했습니다. 한국어에서도 그 연결성을 보존하는 것이 좋습니다.
  doctrine_reference: 서사 문맥 보존
- issue: 왕의 관계와 직책을 동시에 적는 구조
  chosen_reading: '''왕의 보호자이자 친족이며 국정을 맡은''으로 병렬 구조를 유지했습니다.'
  alternative_readings:
  - 직책만 번역
  - 친족 관계를 생략
  rationale: 원문은 리시아스의 신분적 관계와 직무를 나란히 제시해 권위와 근접성을 함께 드러냅니다. 둘 중 하나를 지우면 문맥 정보가 줄어듭니다.
  doctrine_reference: 본문의 정보 보존
