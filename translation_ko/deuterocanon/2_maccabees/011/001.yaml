translation:
  language: ko
  text: 그러나 아주 짧은 시간이 지난 뒤에, 왕의 보호자이자 친족이며 국정을 맡은 리시아스가 일어난 일들 때문에 크게 마음 아파하며…[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 표현은 ‘조금 뒤에’와 ‘지극히 짧은 간격’이 압축되어 강조된 말입니다.
    reason: lexical_alternative
  - marker: b
    text: ἐπίτροπος는 문맥에 따라 ‘섭정’ 또는 ‘청지기’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 이 문장은 다음 절에서 이어지므로, 한국어에서도 미완결성을 남겼습니다.
    reason: cross_reference
