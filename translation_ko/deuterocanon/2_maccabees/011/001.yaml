  - severity: low
    issue: ‘크게 마음 아파하며’는 λίαν βαρέως φέρων의 뜻을 다소 감상적으로 좁힐 수 있습니다.
    rationale: 이 관용구는 일어난 일을 매우 괴롭게 여기거나 심각하게 받아들이는 뜻입니다. ‘몹시 괴롭게 여기며’는 정서적 무게와 대상에 대한 반응을 모두 더 직접적으로 보존합니다.
