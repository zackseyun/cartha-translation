  yaml_path: translation/deuterocanon/2_maccabees/011/022.yaml
  text: 'And the king’s letter contained this: “King Antiochus to his brother Lysias[b][a], greetings.”'
  footnotes:
  - marker: a
    text: Greek literally, 'contained thus'; idiomatically, this introduces the wording of the letter.
    reason: lexical_alternative
  - marker: b
    text: '''Brother'' may be a court title of political closeness rather than a statement of literal family relationship.'
    reason: cultural_note
translation:
  language: ko
  text: 왕의 편지는 다음과 같은 내용이었습니다. 「안티오코스 왕이 그의 형제 리시아스에게, 인사를 전합니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘이렇게 담고 있었다’에 가깝지만, 관용적으로는 뒤따르는 편지 내용을 여는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘형제’는 여기서 실제 형제 관계라기보다 왕실·정치적 친밀 호칭일 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: Ἡ δὲ τοῦ βασιλέως ἐπιστολή
  english_pob_choice: the king’s letter
  chosen_korean: 왕의 편지는
  alternatives_korean:
  - 그 왕의 편지는
  - 왕의 서신은
  lexicon: LSJ
  rationale: ἐπιστολή는 문어체에서 ‘편지’가 가장 자연스럽고, 본문 도입부의 서술적 기능을 살려 ‘왕의 편지는’으로 옮겼습니다.
- source_word: περιεῖχεν οὕτως
  english_pob_choice: contained this
  chosen_korean: 다음과 같은 내용이었습니다
  alternatives_korean:
  - 이렇게 담고 있었습니다
  - 다음과 같이 적혀 있었습니다
  lexicon: LSJ
  rationale: περιεῖχεν οὕτως는 편지의 인용문을 여는 관용구이므로, 직역의 어색함을 피하면서도 원문의 기능을 드러내는 표현으로 옮겼습니다.
- source_word: τῷ ἀδελφῷ
  english_pob_choice: to his brother
  chosen_korean: 그의 형제
  alternatives_korean:
  - 그의 형제에게
  - 그의 동맹
  lexicon: LSJ
  rationale: ἀδελφός는 여기서 혈연뿐 아니라 왕실·외교적 친밀 호칭일 수 있어, 영어 POB의 주석 취지를 반영해 문자적 친족 의미를 단정하지 않고 자연스럽게 처리했습니다.
- source_word: χαίρειν
  english_pob_choice: greetings
  chosen_korean: 인사를 전합니다
  alternatives_korean:
  - 평안을 전합니다
  - 문안드립니다
  lexicon: LSJ
  rationale: χαίρειν은 서신의 정형 인사말이므로, 한국어에서는 짧고 공식적인 서두 기능을 살려 ‘인사를 전합니다’로 옮겼습니다.
theological_decisions:
- issue: 왕의 자기표현과 서신 형식의 보존
  chosen_reading: 서간문의 표제를 현대 한국어로 자연스럽게 살리되, 본문이 실제 인용문이라는 점을 분명히 했습니다.
  alternative_readings:
  - 직역하여 ‘포함하고 있었습니다’로 옮김
  - 관용적으로 ‘다음과 같이 썼습니다’로 옮김
  rationale: 이 절은 교리적 쟁점보다 문서 형식의 정확성이 핵심이므로, 원문의 서간체를 훼손하지 않는 범위에서 가독성을 우선했습니다.
  doctrine_reference: 문서 서식과 인용 구조에 대한 본문 비평적/번역학적 판단
