  text: 'And the king’s letter contained this: “King Antiochus to his brother Lysias[b][a], greetings.”'
  footnotes:
  - marker: a
    text: Greek literally, 'contained thus'; idiomatically, this introduces the wording of the letter.
    reason: lexical_alternative
  - marker: b
