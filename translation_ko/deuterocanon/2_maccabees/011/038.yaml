  yaml_path: translation/deuterocanon/2_maccabees/011/038.yaml
  text: Farewell[a]. In the one hundred forty-eighth year[b], on the fifteenth day of Xanthicus.
  footnotes:
  - marker: a
    text: Greek literally, 'Be well.' As a letter closing, this functions idiomatically as 'Farewell.'
    reason: lexical_alternative
  - marker: b
    text: Xanthicus is a Macedonian month name used in Seleucid dating.
    reason: cultural_note
translation:
  language: ko
  text: 안녕히 계십시오[a]. 제148년[b], 샨티쿠스 15일.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 문자적 의미는 ‘잘 지내십시오/건강하십시오’이지만, 서신 마무리 인사로는 관용적으로 ‘안녕히 계십시오’에 해당합니다.
    reason: lexical_alternative
  - marker: b
    text: 샨티쿠스는 셀레우코스식 연대 표기에서 쓰이는 마케도니아 달 이름입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ὑγιαίνετε
  english_pob_choice: Farewell
  chosen_korean: 안녕히 계십시오
  alternatives_korean:
  - 건강하십시오
