base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/038.yaml
  text: Farewell[a]. In the one hundred forty-eighth year[b], on the fifteenth day of Xanthicus.
  footnotes:
  - marker: a
    text: Greek literally, 'Be well.' As a letter closing, this functions idiomatically as 'Farewell.'
    reason: lexical_alternative
  - marker: b
    text: Xanthicus is a Macedonian month name used in Seleucid dating.
    reason: cultural_note
translation:
  language: ko
  text: 안녕히 계십시오[a]. 제148년[b], 샨티쿠스 15일.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 문자적 의미는 ‘잘 지내십시오/건강하십시오’이지만, 서신 마무리 인사로는 관용적으로 ‘안녕히 계십시오’에 해당합니다.
    reason: lexical_alternative
  - marker: b
    text: 샨티쿠스는 셀레우코스식 연대 표기에서 쓰이는 마케도니아 달 이름입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ὑγιαίνετε
  english_pob_choice: Farewell
  chosen_korean: 안녕히 계십시오
  alternatives_korean:
  - 건강하십시오
  - 무탈하십시오
  - 평안하십시오
  lexicon: LSJ
  rationale: 서신 결말에서 ὑγιαίνω는 문자적 건강 인사보다 작별 인사로 기능하므로, 한국어 결말 표현인 ‘안녕히 계십시오’로 자연스럽게 옮겼습니다.
- source_word: ἔτους ἑκατοστοῦ τεσσερακοστοῦ ὀγδόου
  english_pob_choice: one hundred forty-eighth year
  chosen_korean: 제148년
  alternatives_korean:
  - 제백사십팔년
  - 제148번째 해
  lexicon: LSJ
  rationale: 셀레우코스 연대의 연호를 간결한 서수 표기인 ‘제148년’으로 재현해, 공식적인 연대기 표현을 유지했습니다.
- source_word: Ξανθικοῦ
