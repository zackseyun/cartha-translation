  lexicon: LSJ
  rationale: 마케도니아 월명은 번역하지 않고 음역하되, 한국어 외래어 표기 관행에 맞는 음역형으로 처리했습니다.
- source_word: πεντεκαιδεκάτῃ
  english_pob_choice: fifteenth day
