  source_fidelity: ὑγιαίνετε는 복수형 서신 종결 인사로서 ‘안녕히 계십시오’는 문맥상 적절합니다. 연대와 날짜도 원문의 ‘제148년, 크산티코스 15일’을 충실히 반영합니다. 다만 Ξανθικός의 음역은 그리스어의 ξ(/ks/)를 반영하는 ‘크산티코스’가 더 정확하며, 월명임을 본문에서 밝혀 날짜 공식을 자연스럽게 해야 합니다.
