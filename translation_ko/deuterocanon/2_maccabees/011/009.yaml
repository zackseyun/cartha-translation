  to: 그러나 모두 함께 자비로우신 하나님을 찬양하고 마음에 힘을 얻었습니다[a]. 그들은 사람들뿐 아니라 가장 사나운 들짐승들과 쇠 성벽까지도 칠 준비가 되어 있었습니다.
  rationale: 원문의 접속사 δέ는 문맥상 ‘그러나’로 옮기고, 병렬된 서술 동사와 ‘사람들뿐 아니라 ...까지도’라는 원문의 대조 범위를 명확히 했습니다. ‘마음에 힘을 얻었습니다’는 ψυχαῖς의 문맥상 의미를 자연스럽게 전달하며, 직역적 대안은 각주에 유지했습니다. ‘칠’은 사람·짐승·성벽에 공통으로 적용되어 τιτρώσκειν의 전투적 타격 이미지를 보존합니다.
