base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/009.yaml
  text: And all together they blessed the merciful God and were strengthened in spirit[a], being ready to wound not only men but even the fiercest wild beasts and iron walls.
  footnotes:
  - marker: a
    text: Or 'were strengthened in their souls.' The Greek speaks of inward strengthening or courage.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 모두 함께 자비로우신 하나님을 찬양하며 영이 강건해졌습니다[a]. 사람들과 가장 사나운 들짐승들뿐 아니라 쇠로 된 성벽까지도 상하게 할 준비가 되어 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 영혼이 강건해졌습니다.’ 여기서 그리스어는 내면의 강건함이나 용기를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοῦ δὲ πάντες
  english_pob_choice: And all together
  chosen_korean: 그리고 모두 함께
  alternatives_korean:
  - 함께
  - 모두가 한데
  lexicon: LSJ
  rationale: ὁμοῦ와 πάντες의 집단적·동시적 뉘앙스를 살려, 공동의 일치된 행동임을 분명히 했습니다.
- source_word: εὐλόγησαν
  english_pob_choice: blessed
  chosen_korean: 찬양하며
  alternatives_korean:
  - 축복하며
  - 찬송하며
  lexicon: LSJ
  rationale: 하나님을 대상으로 한 εὐλόγησαν은 한국어에서 ‘복을 빌다’보다 ‘찬양하다/찬송하다’가 자연스럽고 경건한 의미를 더 분명히 전달합니다.
- source_word: τὸν ἐλεήμονα θεόν
  english_pob_choice: the merciful God
  chosen_korean: 자비로우신 하나님
  alternatives_korean:
  - 긍휼하신 하나님
  - 자비로운 하나님
  lexicon: LSJ
  rationale: ἐλεήμων의 핵심 의미는 자비/긍휼이므로 이를 직접 반영했고, 표준 한국어 종교 문체에 맞게 형용사를 앞세웠습니다.
- source_word: ἐπερρώσθησαν ταῖς ψυχαῖς
  english_pob_choice: were strengthened in spirit
  chosen_korean: 영이 강건해졌습니다
  alternatives_korean:
  - 마음이 강건해졌습니다
  - 영혼이 강건해졌습니다
  - 속사람이 강건해졌습니다
  lexicon: LSJ
  rationale: ψυχαῖς의 내면적 강건함을 한국어의 ‘영’으로 옮겨, 전투 전의 용기와 결의를 드러내되 영혼에 대한 교리적 진술로 좁히지 않았습니다.
theological_decisions:
- issue: ψυχαῖς를 ‘영/영이’로 옮길지 ‘영혼/마음’으로 옮길지
  chosen_reading: 영이 강건해졌습니다
  alternative_readings:
  - 영혼이 강건해졌습니다
  - 마음이 강건해졌습니다
  rationale: 문맥이 전투를 앞둔 내적 담대함을 말하므로, 독자에게 자연스럽고도 내면적 শক্ত을 전달하는 ‘영이 강건해졌다’로 처리했습니다.
  doctrine_reference: 번역 철학 §6; 내적 상태를 과도하게 심리학화하지 않되 의미를 평이하게 전달
