  source_fidelity: 첫 절의 ὅσα와 ἔδει의 관계는 ‘왕에게도 제시되어야 할 것들’로 옮기는 것이 분명합니다. 현 번역도 대체로 뜻을 전달하지만, ‘그가’는 왕을 가리키는지 즉시 분명하지 않으며, ἔδει의 과거 서술 맥락은 ‘되어야 한다’보다 관형형으로 처리하는 편이 자연스럽습니다.
  naturalness: 합쇼체 서술은 유지되어 있으나, ‘왕에게도 제시되어야 한다고 내가’보다 ‘왕에게도 제시되어야 할 것들은 내가’가 한국어 문장 구조상 더 매끄럽습니다. 두 번째 절의 주어를 ‘왕이’로 명시하면 읽기가 분명해집니다.
  terminology: ‘제시하다’는 προσενεχθῆναι의 행정·청원 문맥에 적절하고, ‘허락하다’는 συνεχώρησεν의 무리 없는 번역입니다. 각주에서는 ‘양보하다’뿐 아니라 문맥에 맞는 ‘승낙하다/허락하다’의 가능성을 유지합니다.
