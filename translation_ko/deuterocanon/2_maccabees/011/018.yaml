  yaml_path: translation/deuterocanon/2_maccabees/011/018.yaml
  text: So then[a], whatever had to be presented also to the king I made clear, and whatever was possible he granted.
  footnotes:
  - marker: a
    text: Or 'whatever was feasible he conceded.' The Greek ἐνδεχόμενα can emphasize what was possible under the circumstances, and συνεχώρησεν can mean 'granted,' 'conceded,' or 'permitted.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 필요한 것들은 왕에게도 제시되어야 한다고 내가 분명히 밝혔고, 또 가능한 것은 그가 허락하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “실행 가능했던 것은 그가 양보하였습니다.” 그리스어 ἐνδεχόμενα는 상황상 가능한 것을, συνεχώρησεν은 ‘허락하다’ 외에 ‘양보하다’, ‘승낙하다’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσα μὲν οὖν
  english_pob_choice: So then, whatever
  chosen_korean: 그러므로 필요한 것들은
  alternatives_korean:
  - 그러므로 무엇이든
  - 그런즉 필요한 것은
  lexicon: LSJ
  rationale: μὲν οὖν의 이어짐과 결론적 흐름을 자연스럽게 살리면서, 여기서의 ὅσα가 단순한 '무엇이든'보다 문맥상 '필요한 것들'을 가리키는 것으로 보이므로 이렇게 옮겼습니다.
- source_word: ἔδει
  english_pob_choice: had to be
  chosen_korean: 되어야 한다
  alternatives_korean:
  - 해야 했다
  - 필수였다
  lexicon: BDAG
  rationale: 비인칭적 필연을 한국어에서는 행정적·서술적 문맥에 맞게 '-되어야 한다'로 살렸습니다.
- source_word: προσενεχθῆναι
  english_pob_choice: be presented
  chosen_korean: 제시되어야 한다
  alternatives_korean:
  - 제출되어야 한다
  - 들려야 한다
  lexicon: LSJ
  rationale: 권위자 앞에 사안을 '가져다 놓다/제시하다'는 행정적 뉘앙스를 살리기 위해 '제시하다'를 택했습니다.
- source_word: συνεχώρησεν
  english_pob_choice: he granted
  chosen_korean: 허락하였습니다
  alternatives_korean:
  - 허가하였습니다
  - 허용하였습니다
  - 승인하였습니다
  lexicon: BDAG
  rationale: 왕이 요청을 받아들여 허용하는 맥락이므로 '허락하다'가 가장 자연스럽고, '허락하였습니다'로 공손한 서술체를 유지했습니다.
