- source_word: πολιτεύεσθαι κατὰ τὰ ἐπὶ τῶν προγόνων αὐτῶν ἔθη
  english_pob_choice: live according to the customs of their ancestors
  chosen_korean: 그들이 조상들의 관습에 따라 살아가도록
  alternatives_korean:
  - 그들이 조상들의 관습에 따라 공동체 생활을 하도록
  - 그들이 조상 때의 관습에 따라 처신하도록
  - 그들이 조상들의 관습에 따라 공적인 삶을 살도록
