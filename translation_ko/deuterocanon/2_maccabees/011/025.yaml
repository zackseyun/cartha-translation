  lexicon: LSJ
  rationale: 분사형의 의지적·원인적 뉘앙스를 살리기 위해 ‘택하였으니’를 썼고, 앞의 ‘그러므로’와 함께 행정적 판단의 흐름을 자연스럽게 연결했습니다.
- source_word: ἐκτὸς ταραχῆς
