theological_decisions:
- issue: τὸ ἱερὸν의 번역 범위
  chosen_reading: ‘성전’으로 옮겨 예루살렘 성전의 회복을 뜻하게 했습니다.
  alternative_readings:
  - ‘성소’로 옮겨 더 문자적으로 처리할 수 있음
  - ‘거룩한 곳’으로 직역할 수 있음
  rationale: 문맥상 단순한 건물 일반이 아니라 유대 공동체의 중심 성전 회복을 가리키므로, 독자가 역사적·신학적 초점을 놓치지 않도록 했습니다.
