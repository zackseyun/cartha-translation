translation:
  language: ko
  text: 그는 어리석은 사람이 아니었고, 자신에게 닥친 패배를 스스로 헤아리며 히브리인들이 정복될 수 없다는 것, 곧 그들을 위해 전능하신 하나님이 함께 싸우고 계신다는 것을 깨닫고는 미리 사람들을 보냈습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἀνόους ... ὑπάρχων
  english_pob_choice: since he was not foolish
  chosen_korean: 어리석은 사람이 아니었고
  alternatives_korean:
  - 무지한 사람이 아니었고
  - 분별 없는 사람이 아니었고
  lexicon: LSJ
  rationale: ἀνόους는 분별 없음/어리석음의 부정으로 읽히므로, 현대 한국어에서는 ‘어리석은 사람이 아니었고’가 가장 자연스럽고 평가적 뉘앙스를 살립니다.
- source_word: πρὸς ἑαυτὸν ἀντιβάλλων
  english_pob_choice: was comparing with himself
  chosen_korean: 자신에게 닥친 패배를 스스로 헤아리며
  alternatives_korean:
  - 스스로 비교하며
  - 자기 마음속으로 따져 보며
  lexicon: LSJ
  rationale: 직역식 ‘비교하다’보다 문맥상 내적 숙고를 드러내는 한국어가 자연스럽습니다. 다만 ‘스스로’와 ‘헤아리며’를 넣어 자기 성찰의 동작을 보존했습니다.
- source_word: τοῦ δυναμένου θεοῦ συμμαχοῦντος αὐτοῖς
  english_pob_choice: because the mighty God was fighting alongside them
  chosen_korean: 전능하신 하나님이 함께 싸우고 계신다는 것
  alternatives_korean:
  - 능하신 하나님이 그들과 함께 싸우고 계신다는 것
  - 강하신 하나님이 그들의 동맹으로 싸우고 계신다는 것
  lexicon: LSJ
  rationale: δυναμένου θεοῦ는 ‘능하신/전능하신 하나님’으로 옮길 수 있으며, συμμαχοῦντος는 단순한 도움보다 전투적 ‘함께 싸우심’이 강하므로 그 군사적 의미를 살렸습니다.
- source_word: ἀνικήτους εἶναι τοὺς Ἑβραίους
  english_pob_choice: that the Hebrews were unconquerable
  chosen_korean: 히브리인들이 정복될 수 없다는 것
  alternatives_korean:
  - 히브리인들이 정복 불가능하다는 것
  - 히브리인들이 패배할 수 없다는 것
  lexicon: LSJ
  rationale: ἀνίκητους는 ‘정복될 수 없는/패배할 수 없는’이라는 의미이므로, 한국어에서는 군사적 맥락에 맞게 ‘정복될 수 없다’로 옮겼습니다.
- source_word: προαποστείλας
  english_pob_choice: he sent ahead
  chosen_korean: 미리 사람들을 보냈습니다
  alternatives_korean:
  - 앞서 보냈습니다
  - 선발대로 보냈습니다
  lexicon: LSJ
  rationale: 문맥상 다음 절로 이어지는 선행 파견을 뜻하므로, 대상이 드러나지 않은 상태를 살려 ‘미리 사람들을 보냈습니다’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 하나님의 전투적 동행 표현
  chosen_reading: 전능하신 하나님이 함께 싸우고 계신다는 것
  alternative_readings:
  - 하나님이 그들의 편에서 돕고 계신다는 것
  - 하나님이 그들의 동맹이 되어 계신다는 것
  rationale: 본문은 단순한 일반적 보호가 아니라 전쟁 맥락에서의 실제적 동행과 개입을 말하므로, 이를 완화하지 않고 그대로 드러냈습니다.
  doctrine_reference: 원문 우선 원칙; 군사적 συμμαχία 이미지 보존
