  yaml_path: translation/deuterocanon/2_maccabees/011/007.yaml
  text: But Maccabeus himself[a], taking up arms first, urged the others, risking danger along with him, to come to the aid of their brothers[b]; and together they also rushed out eagerly.
  footnotes:
  - marker: a
    text: Or 'sharing the danger with him.'
    reason: lexical_alternative
  - marker: b
    text: '''Brothers'' here likely refers to their fellow Jews or kinsmen.'
    reason: cultural_note
translation:
  language: ko
  text: 그러나 마카베오 자신이 먼저 무기를 들고, 다른 이들에게 그와 함께 위험을 무릅쓰고 자기들의 형제들을 돕도록 권하였습니다. 그러자 그들은 함께 기꺼이 뛰쳐나갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτὸς δὲ πρῶτος ὁ Μακκαβαῖος
  english_pob_choice: But Maccabeus himself ... first
  chosen_korean: 마카베오 자신이 먼저
  alternatives_korean:
  - 마카베오가 가장 먼저
  - 마카베오 자신이 첫째로
  lexicon: LSJ
  rationale: αὐτός의 강조와 πρῶτος의 선도성을 함께 살리되, 현대 한국어에서 자연스러운 어순으로 옮겼습니다.
- source_word: ἀναλαβὼν τὰ ὅπλα
  english_pob_choice: taking up arms
  chosen_korean: 무기를 들고 나서
  alternatives_korean:
  - 무장하고
  - 무기를 집어 들고
  lexicon: LSJ
  rationale: 전투 맥락의 관용적 표현을 살리면서도, 문자적으로 무기류를 드는 행위를 자연스럽게 드러냈습니다.
- source_word: ἐπιβοηθεῖν τοῖς ἀδελφοῖς αὐτῶν
  english_pob_choice: to come to the aid of their brothers
  chosen_korean: 자기들의 형제들을 도우라고
  alternatives_korean:
  - 자기들의 형제들을 돕도록
  - 자기들의 형제들에게 달려가 돕도록
  lexicon: LSJ
  rationale: ἐπιβοηθέω의 ‘급히 와서 돕다’라는 의미를 유지하되, 한국어에서는 ‘도우라고’가 권유의 목적절로 가장 자연스럽습니다.
- source_word: ὁμοῦ δὲ καὶ προθύμως ἐξώρμησαν
  english_pob_choice: and together they also rushed out eagerly
  chosen_korean: 그리고 그들은 함께 또다시 용감하게 돌격해 나갔습니다
  alternatives_korean:
  - 그리고 그들은 함께 또 기꺼이 뛰쳐나갔습니다
  - 그리고 그들은 한꺼번에 기세 좋게 나아갔습니다
  lexicon: LSJ
  rationale: ὁμοῦ는 ‘함께’, προθύμως는 ‘기꺼이/열심히’, ἐξορμάω는 ‘돌격해 나가다/달려나가다’의 역동성을 담아 전투 장면에 맞게 옮겼습니다.
theological_decisions:
- issue: ἀδελφοῖς αὐτῶν의 의미 범위
  chosen_reading: ‘자기들의 형제들’로 직역하되, 문맥상 동족/유대 형제들을 가리킬 수 있음을 열어 둡니다.
  alternative_readings:
  - 그들의 동족
  - 그들의 친족
  rationale: 본문은 실제로 ‘형제들’이라는 친족 언어를 사용하므로, 이를 일반화하지 않고 유지하는 것이 원문 충실성과 POB의 직역 원칙에 부합합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
