  to: 그러나 마카베오 자신이 먼저 무기를 들고, 다른 이들에게 그와 함께 위험을 무릅쓰고 자기들의 형제들을 돕도록 권하였습니다. 그러자 그들은 함께 기꺼이 뛰쳐나갔습니다.
