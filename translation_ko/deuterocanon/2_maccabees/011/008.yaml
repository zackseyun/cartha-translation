  yaml_path: translation/deuterocanon/2_maccabees/011/008.yaml
  text: And there[a], when they were near Jerusalem, a horseman appeared going before them[b], clothed in white and brandishing golden armor.
  footnotes:
  - marker: a
    text: Or 'preceding them' for 'going before them.' The Greek participle can denote simply being ahead of them, without explicitly stating command.
    reason: lexical_alternative
  - marker: b
    text: The text does not explicitly identify the horseman; the description allows readers to infer a heavenly protector without the translation stating more than the Greek says.
    reason: cultural_note
translation:
  language: ko
  text: 그곳에서 그들이 예루살렘 가까이에 이르렀을 때, 앞서 가는 한 기마병이 나타났는데, 그는 흰 옷을 입고 금빛 갑옷을 휘두르고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: αὐτόθι는 여기서 주로 장소를 가리키며, 앞 절의 같은 장소를 이어 받습니다.
    reason: lexical_alternative
  - marker: b
    text: 본문은 기마병의 정체를 밝히지 않으므로, 번역도 그 이상을 단정하지 않습니다.
    reason: theological_note
lexical_decisions:
- source_word: αὐτόθι
  english_pob_choice: there
  chosen_korean: 그곳에서
  alternatives_korean:
  - 그리하여
  - 그때
  lexicon: LSJ
  rationale: 앞 절에서 막 언급된 장소를 가리키는 부사이므로, 시간 부사처럼 만들기보다 장소성을 살린 '그곳에서'가 자연스럽습니다.
- source_word: πρὸς τοῖς Ἱεροσολύμοις
  english_pob_choice: near Jerusalem
  chosen_korean: 예루살렘 가까이에
  alternatives_korean:
  - 예루살렘 근처에
  - 예루살렘 부근에
  lexicon: LSJ
  rationale: dative와 πρός가 만드는 근접 의미를 그대로 살려, 도시 곁에 이르렀음을 분명하게 표현했습니다.
- source_word: προηγούμενος αὐτῶν
  english_pob_choice: going before them
  chosen_korean: 앞서 가는
  alternatives_korean:
  - 그들보다 앞서 가는
  - 그들을 인도하는
  lexicon: LSJ
  rationale: 동사의 핵심은 '앞에 있음/앞서 감'이므로, 군사적 지휘를 암시하는 '인도하는'은 피하고 이동 이미지를 살렸습니다.
- source_word: ἔφιππος
  english_pob_choice: a horseman
  chosen_korean: 기마병
  alternatives_korean:
  - 말 탄 사람
  - 마상 무사
  lexicon: LSJ
  rationale: 명사적으로 쓰인 말을 한국어로 자연스럽게 옮기면서도, 전투 장면의 시각적 인상을 살리기 위해 '기마병'을 택했습니다.
- source_word: πανοπλίαν χρυσῆν
  english_pob_choice: golden armor
  chosen_korean: 금빛 갑옷
  alternatives_korean:
  - 황금 갑옷
  - 금으로 된 갑옷
  lexicon: LSJ
  rationale: πανοπλία의 '온전한 무장' 이미지를 무너뜨리지 않으면서 한국어에서 가장 자연스럽게 읽히는 표현으로 옮겼습니다.
theological_decisions:
- issue: 기마병의 정체를 특정하지 않음
  chosen_reading: 본문이 말하는 모습만 따라 '한 기마병'으로 두고, 천상 존재나 계시적 인물로 단정하지 않았습니다.
  alternative_readings:
  - 천사 기마병
  - 하늘에서 온 전사
  rationale: 그리스어는 보이는 형상만 제시하며 정체를 명시하지 않으므로, 번역이 해석을 앞서가지 않도록 본문의 절제를 유지했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
