  source_fidelity: 개정이 필요합니다. 초안의 ‘예루살렘 가까이에 이르렀을 때’는 πρὸς τοῖς Ἱεροσολύμοις ὄντων(‘예루살렘 가까이에 있을 때’)를 ‘도착하다’로 구체화합니다. 또한 κραδαίνων의 목적어는 πανοπλίαν χρυσῆν이므로, 다소 이례적인 영상이라도 금빛 갑옷/무장을 휘두르는 모습이 드러나야 합니다.
