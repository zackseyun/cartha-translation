  text: He persuaded him to come to terms on all the just demands[a], and that he would also persuade the king, compelling him to become their friend.
  footnotes:
  - marker: a
    text: Or 'to be reconciled in all rightful matters' or 'to make a settlement on all just claims.' The Greek συλλύεσθαι is somewhat compressed and can be understood as reaching an accommodation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 모든 정당한 요구에 대해 타협하도록 그를 설득하였고[a], 또한 왕도 설득하여 그를 자기들의 친구가 되게 하겠다고 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 정당한 사안에서 화해하도록’ 혹은 ‘모든 정당한 청구에 대해 합의하도록’로도 옮길 수 있습니다. συλλύεσθαι는 압축된 표현으로, 여기서는 타협이나 합의에 이르는 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεισεν
  english_pob_choice: He persuaded
  chosen_korean: 그는 … 설득하였고
  alternatives_korean:
  - 그는 … 납득시켰고
  - 그는 … 권유하였고
  lexicon: LSJ
  rationale: πείθω의 기본 의미를 직접 살려 ‘설득하다’로 옮겼습니다. 정치적 협상 문맥에서도 가장 자연스럽고 원문 동작을 분명히 드러냅니다.
- source_word: συλλύεσθαι
  english_pob_choice: to come to terms
  chosen_korean: 타협하도록
  alternatives_korean:
  - 합의하도록
  - 화해하도록
  - 협정하도록
  lexicon: LSJ
  rationale: 압축된 중간/수동 부정사로서 협상적 ‘합의’의 뜻을 담으므로, 관계적 화해보다 실제 교섭의 결과를 드러내는 ‘타협하다’가 적합합니다.
- source_word: ἐπὶ πᾶσι τοῖς δικαίοις
  english_pob_choice: on all the just demands
  chosen_korean: 모든 정당한 요구에 대해
  alternatives_korean:
  - 모든 옳은 청구에 대해
  - 모든 정당한 일에 대해
  - 모든 합당한 요구에 대해
  lexicon: LSJ
  rationale: 여기서 τὰ δίκαια는 추상적 ‘의로움’이 아니라 협상에서 주장되는 정당한 요구를 뜻하므로, 법적·외교적 뉘앙스를 살린 표현으로 옮겼습니다.
- source_word: φίλον αὐτοῖς
  english_pob_choice: their friend
  chosen_korean: 그를 자기들의 친구가 되게
  alternatives_korean:
  - 그를 자기들에게 우호적이게
  - 그를 자기들의 편이 되게
  - 그를 자기들의 친구로
  lexicon: LSJ
  rationale: 술어적 목적격 구조를 한국어의 ‘…가 되게’로 풀어, 단순한 감정적 우정보다 정치적 우호 관계 형성을 분명히 했습니다.
