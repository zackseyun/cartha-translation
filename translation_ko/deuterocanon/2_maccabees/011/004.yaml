translation:
  language: ko
  text: 하나님의 능력[a]은 전혀 고려하지 않고, 수만 명의 보병[b]과 수천 명의 기병과 팔십 마리의 코끼리를 자랑하며 교만해져 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 권능’. 그리스어 κράτος는 여기서 군사력과 대비되는 하나님의 힘 또는 능력을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 μυριάς는 문자적으로 ‘만’ 단위이며, 여기서는 ‘수만 명’ 또는 더 넓게 매우 많은 수를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδάμως ἐπιλογιζόμενος
  english_pob_choice: not at all taking into account
  chosen_korean: 전혀 … 헤아리지 않고
  alternatives_korean:
  - 전혀 … 고려하지 않고
  - 전혀 … 계산에 넣지 않고
  lexicon: LSJ
  rationale: οὐδάμως의 강한 부정과 ἐπιλογίζομαι의 ‘마음에 넣어 고려하다’는 뜻을 살려, 자연스러운 한국어로는 ‘헤아리다/고려하다’ 계열이 적절합니다.
- source_word: τὸ τοῦ θεοῦ κράτος
  english_pob_choice: the might of God
  chosen_korean: 하나님의 능력
  alternatives_korean:
  - 하나님의 힘
  - 하나님의 권능
  lexicon: LSJ
  rationale: kράτος는 단순한 권세보다 실제로 작동하는 힘·능력을 가리키므로, 한국어에서는 ‘능력’이 가장 직접적으로 대응합니다.
- source_word: μυριάσιν τῶν πεζῶν
  english_pob_choice: the tens of thousands of foot soldiers
  chosen_korean: 보병의 수만
  alternatives_korean:
  - 보병의 만만군대
  - 보병의 수많은 대군
  lexicon: LSJ
  rationale: μυριάς는 문자적으로 ‘만 단위’이지만 넓게는 매우 큰 수를 뜻할 수 있어, 여기서는 숫자 감각을 살리되 과도한 확정은 피하는 ‘수만’이 적절합니다.
- source_word: πεφρονηματισμένος
  english_pob_choice: puffed up
  chosen_korean: 마음이 들떠 있었습니다
  alternatives_korean:
  - 교만해져 있었습니다
  - 우쭐해 있었습니다
  lexicon: LSJ
  rationale: 완료분사가 나타내는 지속 상태를 살려 ‘-해 있었습니다’로 옮기고, 군사적 자만의 뉘앙스를 ‘마음이 들떠 있다’로 표현했습니다.
theological_decisions:
- issue: 하나님의 능력과 인간 군사력의 대비
  chosen_reading: ‘하나님의 능력’을 먼저 놓고, 그에 비해 인간의 전력(보병·기병·코끼리)이 자만의 근거로 제시되도록 옮겼습니다.
  alternative_readings:
  - ‘하나님의 권세’로 더 왕권적 의미를 살리는 읽기
  - ‘하나님의 힘’으로 더 구어적으로 옮기는 읽기
  rationale: 본문은 숫자의 과시와 하나님의 능력의 무시를 대조하므로, 그 긴장을 약화하지 않으면서도 현대 한국어로 분명하게 전달하는 쪽을 택했습니다.
  doctrine_reference: '번역 원칙: 원어 우선, 본문의 대조 구조 유지'
- issue: μυριάσιν의 수량성
  chosen_reading: ‘수만’으로 옮겨 문자적 수치감과 관용적 큰 수의 의미를 함께 열어 두었습니다.
  alternative_readings:
  - ‘만 명’으로 더 문자적으로 옮기는 읽기
  - ‘수많은’으로 더 일반화하는 읽기
  rationale: 본문은 병력 규모를 과시하는 문맥이므로 정확한 산술 확정보다 ‘큰 수’의 뉘앙스를 유지하는 것이 더 충실합니다.
  doctrine_reference: '문헌학적 보수성: 확정되지 않은 수량은 과도하게 구체화하지 않음'
