  - 다쳐서
  lexicon: LSJ
  rationale: 형용사/명사적 용법의 ‘부상당한 상태’를 한국어 서술로 풀어, 전투 맥락에서 자연스럽게 읽히도록 했습니다.
- source_word: γυμνοὶ
  english_pob_choice: naked
  chosen_korean: 벗은 채로
  alternatives_korean:
  - 벌거벗은 채로
  - 옷이 벗겨진 채로
  lexicon: LSJ
  rationale: 직역의 핵심을 유지하되, 군사적 후퇴 맥락에서 ‘벗은 채로’가 실제 노출 상태를 과하게 단정하지 않으면서도 POB의 문맥상 여지를 남깁니다.
- source_word: αἰσχρῶς φεύγων
  english_pob_choice: by fleeing shamefully
  chosen_korean: 부끄럽게 달아나
  alternatives_korean:
  - 수치스럽게 도망쳐
  - 비참하게 도망쳐
  lexicon: LSJ
  rationale: αἰσχρῶς의 도덕적 수치감을 살리면서, 현재 분사 φεύγων의 동반 행위를 한국어 동사구로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 전투 패배의 결과를 ‘구원’이 아니라 ‘살아남아 도주함’으로 옮길지 여부
  chosen_reading: διεσώθησαν을 여기서는 ‘살아남았습니다’보다 문맥상 ‘도망쳐 살아남았습니다’로 옮겨 전투 서술의 결과와 도주 뉘앙스를 함께 드러냈습니다.
  alternative_readings:
  - 그들은 살아남았습니다
  - 그들은 무사히 빠져나왔습니다
  rationale: διασῴζω의 기본 의미는 ‘안전하게 건져내다/살아남다’이지만, 본문은 전투 패배를 묘사하므로 단순한 생존보다 ‘도주하여 생존’이라는 서술 효과가 강합니다. POB의 영어 번역도 ‘escaped’로 잡아 이 방향을 지지합니다.
  doctrine_reference: 서사 문맥에 따른 동사 선택
