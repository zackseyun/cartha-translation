  yaml_path: translation/deuterocanon/2_maccabees/011/012.yaml
  text: But most of them escaped wounded and naked[a], and Lysias himself also escaped by fleeing shamefully.
  footnotes:
  - marker: a
    text: Or 'escaped stripped,' if γυμνοὶ is understood as referring to being despoiled in flight rather than fully unclothed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들 대부분은 상처를 입고 벌거벗은 채로 도망쳐 살아남았습니다[a]. 그리고 리시아스 자신도 수치스럽게 달아나 살아남았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘벌거벗은 채로’는 γυμνοί의 가장 직접적인 의미를 따른 것입니다. 전투 중 옷이나 갑옷을 빼앗겨 ‘벗겨진 채’로 달아난 뜻일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πλείονες
  english_pob_choice: most of them
  chosen_korean: 그들 대부분은
  alternatives_korean:
  - 그들 대부분이
  - 그들 중 많은 이들은
  lexicon: LSJ
  rationale: 복수 주어를 자연스럽게 살리면서도 πλείονες의 ‘더 많은 쪽, 대부분’이라는 수량 감각을 간결하게 전달합니다.
- source_word: τραυματίαι
  english_pob_choice: wounded
