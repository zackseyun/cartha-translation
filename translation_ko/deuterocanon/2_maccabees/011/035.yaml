  source_fidelity: 원문의 ὑπὲρ ὧν은 ‘~에 관하여’로 적절히 옮겼고, 왕의 친족인 리시아스가 수신자들에게 내린 허락을 화자들이 함께 승인한다는 기본 뜻도 보존되었습니다. 다만 ‘우리도 또한’은 καὶ…의 ‘또한’을 중복하여 강조하며, 선행한 ‘것들’을 다시 ‘그것’으로 받는 표현은 원문의 간결한 연결보다 다소 부자연스럽습니다.
  naturalness: ‘왕의 친족인 리시아스가’로 주어를 정리하고 ‘우리도 이를 승인합니다’로 연결하면 현대 한국어의 공적·외교적 문체로 더 자연스럽습니다.
  terminology: ‘왕의 친족’은 συγγενής를 혈연 관계 이상으로 구체화하지 않는 적절한 표현입니다. ‘승인합니다’는 συνευδοκοῦμεν의 공식적 찬성·동의의 뉘앙스를 무리 없이 전달합니다.
  issues:
