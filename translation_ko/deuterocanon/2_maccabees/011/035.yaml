translation:
  language: ko
  text: 왕의 친족인 리시아스가 여러분에게 허락한 일들에 관하여, 우리도 이를 승인합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπὲρ ὧν
  english_pob_choice: Concerning the things that
  chosen_korean: ~에 관하여
  alternatives_korean:
  - ~에 대하여
  - ~에 대해서
  lexicon: LSJ
  rationale: 여기서는 대리·대신의 뜻이 아니라 논의의 주제를 여는 표현이므로, 한국어도 주제 표지인 ‘~에 관하여’로 옮겨 문장 구조를 살렸습니다.
- source_word: ὁ συγγενὴς τοῦ βασιλέως
  english_pob_choice: the king’s kinsman
  chosen_korean: 왕의 친족
  alternatives_korean:
  - 왕의 친척
  - 왕의 일가
  lexicon: LSJ
  rationale: συγγενής는 혈연적 관계를 가리키는 말이므로, 과도하게 구체화하지 않고 공문체에 어울리는 ‘친족’으로 옮겼습니다.
- source_word: συνευδοκοῦμεν
  english_pob_choice: we also approve
  chosen_korean: 우리도 또한 그것을 승인합니다
  alternatives_korean:
  - 우리도 또한 동의합니다
  - 우리도 또한 인정합니다
  lexicon: LSJ
  rationale: 동사 σύν + εὐδοκέω는 단순한 의견 일치보다 공식적인 승인·찬동의 뉘앙스를 가지므로, 외교적 문맥에 맞는 ‘승인합니다’로 옮겼습니다.
theological_decisions:
- issue: 왕권 문맥에서의 직함과 호칭 유지
  chosen_reading: ‘왕의 친족’과 ‘승인합니다’를 통해 왕실의 공식 문서처럼 들리게 하되, 과장된 존칭이나 교회적 어휘는 쓰지 않았습니다.
  alternative_readings:
  - ‘왕의 사촌’처럼 혈연을 좁혀 말하기
  - ‘허락합니다’로 완화하기
  rationale: 본문은 유다 공동체에 대한 왕실 측의 공식적 양해를 전달하는 서한체이므로, 문맥의 관료적·외교적 성격을 보존하는 것이 중요합니다.
  doctrine_reference: 역사서/외경의 문서체 표현
