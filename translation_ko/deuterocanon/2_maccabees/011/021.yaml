  terminology: ‘디오스 코린티오스’는 마케도니아 달 이름으로 보존하는 것이 적절합니다. 달 이름임을 한국어에서 분명히 하도록 ‘월’을 붙였습니다. 기존 각주 a는 연도 표지에 붙어 있으나 내용은 달 이름에 관한 것이어서 앵커가 부정확하며, ‘연대를 그대로 보존한다’는 설명도 원문의 달 이름 보존이라는 쟁점과 맞지 않습니다.
