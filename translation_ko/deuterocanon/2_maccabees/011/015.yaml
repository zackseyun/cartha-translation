  text: And Maccabeus agreed to everything that Lysias urged, being concerned for what was advantageous; for whatever Maccabeus set before Lysias in writing concerning the Jews, the king granted.
translation:
  language: ko
  text: 마카베오가 라이시아스가 권하는 모든 일에 대해, 유익한 것을 생각하며 동의하였습니다. 또한 마카베오가 유대인들에 관해 글로 라이시아스에게 제출한 것은 왕이 허락하였습니다.
  philosophy: formal
lexical_decisions:
- source_word: ἐπένευσε ... ἐπὶ πᾶσιν οἷς ... παρεκάλει
  english_pob_choice: agreed to everything that Lysias urged
  chosen_korean: 권하는 모든 일에 대해 동의하였습니다
  alternatives_korean:
  - 제안한 모든 것에 동의하였습니다
  - 간청한 모든 일에 응하였습니다
  lexicon: ἐπινεύω / παρακαλέω
  rationale: ἐπένευσε는 단순한 수긍이 아니라 상대의 요청·권고에 고개를 끄덕이며 동의하는 뉘앙스가 있어, POB의 urged를 살려 ‘권하는’과 ‘동의하였습니다’로 옮겼습니다.
- source_word: τοῦ συμφέροντος φροντίζων
  english_pob_choice: being concerned for what was advantageous
  chosen_korean: 유익한 것을 생각하며
  alternatives_korean:
  - 유리한 것을 염두에 두며
  - 이로운 일을 염려하며
  lexicon: συμφέρον / φροντίζω
  rationale: 문맥상 정치적·실용적 이익을 가리키므로 ‘유익한 것’으로 옮겼고, φροντίζων은 지속적인 염두·고려를 나타내어 ‘생각하며’로 자연스럽게 풀었습니다.
- source_word: διὰ γραπτῶν
  english_pob_choice: in writing
  chosen_korean: 글로
  alternatives_korean:
  - 서면으로
  - 문서로
  lexicon: γράπτω / γραπτός
  rationale: 직역하면 ‘서면으로’이지만, 여기서는 마카베오가 전달한 내용을 간명하게 드러내기 위해 ‘글로’로 옮겼습니다.
- source_word: συνεχώρησεν ὁ γραμματεύς
  english_pob_choice: the king granted
  chosen_korean: 왕이 허락하였습니다
  alternatives_korean:
  - 왕이 승인하였습니다
  - 왕이 허락해 주었습니다
  lexicon: γραμματεύς
  rationale: 본문의 ὁ γραμματεύς는 문자상 ‘서기관’이지만, 영어 POB가 문맥상 ‘the king’으로 읽은 전승을 따르지 않고 원문에 맞춰 ‘서기관’ 계열로 옮겨야 할 여지가 있어, 본문 정합성을 우선한 번역 판단을 설명하기 위해 왕정 주어를 유지하지 않고 문맥상 허가 주체를 왕으로 이해한 기존 POB 선택을 반영했습니다.
theological_decisions:
- issue: 본문 후반의 주어가 ὁ γραμματεύς로 되어 있는데 English POB는 ‘the king’으로 옮깁니다.
  chosen_reading: 한국어 본문은 POB 전승을 따라 ‘왕이 허락하였습니다’로 두되, 원문 표면형은 문맥상 행위 주체를 설명하는 곳에서 별도 검토가 필요합니다.
  alternative_readings:
  - ‘서기관이 허락하였습니다’
  - ‘서기관이 승인하였습니다’
  rationale: 원문 표면형과 영어 POB 사이에 주어 대응 차이가 있어, 번역문은 기존 POB의 의미 흐름을 따르면서도 주의 깊은 재검토가 가능하도록 했습니다.
  doctrine_reference: textual criticism / translation alignment
