  yaml_path: translation/deuterocanon/2_maccabees/014/018.yaml
  text: Yet when Nicanor heard of the valor that those around Judas had[a], and of their courage in the struggles for their fatherland, he was reluctant to settle the matter by bloodshed.
  footnotes:
  - marker: a
    text: Or 'to decide the issue by blood' or 'to carry out judgment by bloodshed.' The Greek phrase τὴν κρίσιν διʼ αἵματος ποιήσασθαι is somewhat idiomatic and can be rendered more formally.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 니카노르는 유다와 함께한 이들의 용맹과 조국을 위한 싸움에서의 용기를 듣고, 유혈로 그 일을 결정하는 것을 꺼렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘피로 그 문제를 결정하는 것’, ‘유혈로 판결을 내리는 것’으로 옮길 수 있습니다. 그리스어 τὴν κρίσιν διʼ αἵματος ποιήσασθαι는 다소 관용적인 표현입니다.
    reason: lexical_alternative
