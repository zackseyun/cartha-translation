base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/028.yaml
  text: But when these men fell before Nikanor[a], he was thrown into confusion and took it badly that he should set aside the agreed terms[b], though the man had done no wrong.
  footnotes:
  - marker: a
    text: Or 'fell at Nikanor's feet,' expressing supplication.
    reason: lexical_alternative
  - marker: b
    text: Or 'the arrangements already made' or 'the agreement.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 Nikanor에게 엎드리자, 그는 혼란에 빠졌고, 그 사람이 아무 잘못도 하지 않았는데도 이미 정해진 것들을 무효로 하려 한다는 점을 몹시 못마땅해했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘Nikanor의 발아래에 엎드리자’라는 뜻으로, 간청의 몸짓을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이미 마련된 조치들’ 혹은 ‘합의’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσπεσόντων
  english_pob_choice: fell before
  chosen_korean: 엎드리자
  alternatives_korean:
  - 그 앞에 엎드리자
  - 엎드려 간청하자
  lexicon: LSJ
  rationale: προσπίπτω는 단순히 ‘떨어지다’보다 상대 앞에 몸을 낮추며 나아가는 사죄·간청의 몸짓을 가리킬 수 있어, 한국어에서는 자연스러운 동작 중심 표현인 ‘엎드리자’로 살렸습니다.
- source_word: συνεκέχυτο
  english_pob_choice: was thrown into confusion
  chosen_korean: 혼란에 빠졌고
  alternatives_korean:
  - 당황했고
  - 동요했고
  - 혼란스러워했고
  lexicon: LSJ
  rationale: 이 동사는 내적 동요와 뒤섞임을 나타내므로, 단순 감정표현보다 상태 변화를 드러내는 ‘혼란에 빠졌고’가 가장 가깝습니다.
- source_word: τὰ διεσταλμένα
  english_pob_choice: the agreed terms
  chosen_korean: 이미 정해진 것들
  alternatives_korean:
  - 합의된 조건들
  - 정해 둔 약속
  - 합의 사항들
  lexicon: LSJ
  rationale: 문맥상 당사자들 사이에 이미 배치·합의된 사항을 가리키므로, 법적·외교적 뉘앙스를 유지하면서도 한국어에서 자연한 ‘이미 정해진 것들’로 옮겼습니다.
- source_word: ἀθετήσει
  english_pob_choice: set aside
  chosen_korean: 무효로 하려
  alternatives_korean:
  - 폐기하려
  - 뒤엎으려
  - 어기려
  lexicon: LSJ
  rationale: ἀθετέω는 단순 무시보다 ‘효력을 없애다/무효화하다’의 의미가 강하므로, 이미 정해진 합의를 깨뜨리려는 뜻이 드러나는 ‘무효로 하려’로 번역했습니다.
- source_word: μηδὲν τἀνδρὸς ἠδικηκότος
  english_pob_choice: though the man had done no wrong
  chosen_korean: 그 사람이 아무 잘못도 하지 않았는데도
  alternatives_korean:
  - 그 사람이 아무에게도 해를 끼치지 않았는데도
  - 그 사람이 어떤 불의도 저지르지 않았는데도
  - 그 사람이 잘못한 것이 없었는데도
  lexicon: LSJ
  rationale: ἀδικέω의 법적·도덕적 무결성 진술을 한국어에서 자연스럽게 풀어, ‘아무 잘못도 하지 않았다’로 그 부정문을 직접 살렸습니다.
- source_word: Νικάνορι
  english_pob_choice: Nikanor
  chosen_korean: Nikanor
  alternatives_korean:
  - 니카노르
  lexicon: modern transliteration
  rationale: 고유명사는 본문 그리스어 형태를 따라 음역하되, 본 문맥의 인명은 학술적 직접 음역인 ‘Nikanor’를 유지했습니다.
theological_decisions:
- issue: προσπεσόντων의 몸짓과 청원성
  chosen_reading: ‘엎드리자’로 옮겨, 단순한 접근이 아니라 낮아짐과 간청의 몸짓을 함께 보이게 했습니다.
  alternative_readings:
  - ‘다가오자’로 완화하기
  - ‘발아래 엎드리자’로 더 구체화하기
  rationale: 문맥은 청원하는 사람들이 Nikanor 앞에 몸을 낮추는 장면이므로, 너무 중립적으로 만들지 않고 본문의 긴장과 외적 행위를 함께 보존하는 편이 좋습니다.
  doctrine_reference: 원문 우선, 서사적 몸짓의 보존
- issue: 이미 정해진 것들을 무효로 하려는 행동의 도덕적 평가
  chosen_reading: 문장은 Nikanor의 분노를 설명하되, 그가 느낀 불쾌감의 이유를 합의 파기 시도로 분명히 드러내고, ‘아무 잘못도 하지 않았는데도’라는 제한된 무죄 진술을 그대로 유지했습니다.
  alternative_readings:
  - 도덕적 평가를 더 강하게 확대하기
  - ‘불의’로 일반화하기
  rationale: 본문은 이 장면에서 특정 합의와 특정 인물의 무고함만 말하므로, 이를 넘어선 일반론으로 확장하지 않고 긴장을 그대로 두는 것이 원문에 충실합니다.
  doctrine_reference: 본문의 제한된 도덕-법적 진술 보존
