translation:
  language: ko
  text: 그러나 니카노르는 자신이 유대인들에게 품고 있던 적대감을 분명히 드러내고자, 그를 체포하려고 오백 명이 넘는 병사들을 보냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
