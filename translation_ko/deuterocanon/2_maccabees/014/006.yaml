review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실하지만, ἀφηγεῖται의 관계절을 ‘그들의 우두머리는 …입니다’라고 삽입한 방식은 인용문 안에서 다소 부자연스럽습니다. 또한 οὐκ ἐῶντες는 다음 절로 이어지는 분사구문이므로, 한국어에서도 뒤가 이어짐을 더 분명히 드러내야 합니다. στασιάζουσιν은 단순히 남을 선동한다기보다 반란·소요를 일으키거나 분란을 조성한다는 뜻이므로 ‘반역을 선동하며’보다 ‘반란을 일으키며’가 안전합니다.
  naturalness: ‘아시다이오이라’는 현대 표준 한국어의 집단명 음역으로 낯설고 조사 결합도 어색합니다. ‘하시데인이라 불리는’으로 고치고, 유다가 그들을 이끈다는 관계절을 ‘유다 마카베오가 이끄는’으로 처리하면 자연스럽습니다. 절 중간에서 끝나는 원문의 구조는 긴 대시와 주석으로 보존할 수 있습니다.
  terminology: Ἀσιδαῖοι는 역사적 집단명이므로 음역을 유지합니다. ‘하시데인’은 영어 POB의 Hasideans와 대응하면서 ‘경건한 사람들’ 같은 해석적 번역을 피합니다. Ἰούδας ὁ Μακκαβαῖος는 ‘유다 마카베오’로 유지합니다.
  issues:
  - severity: medium
    issue: 집단명 ‘아시다이오이’의 음역과 문장 결합이 부자연스럽습니다.
    rationale: 고유 집단명은 보존해야 하나, 해당 형태는 한국어 독자에게 지나치게 생소하고 ‘아시다이오이라 불리는’도 자연스럽지 않습니다. ‘하시데인이라 불리는’이 현대 한국어 문장과 영어 POB의 명명 방침에 더 잘 맞습니다.
  - severity: medium
    issue: στασιάζουσιν을 ‘반역을 선동하며’로 옮긴 것은 행위 주체의 의미를 다소 좁힙니다.
    rationale: 이 동사는 반란을 일으키다, 분란·소요를 조성하다의 뜻을 낼 수 있습니다. 여기서는 그들이 스스로 전쟁과 반란을 지속한다는 고발이므로 ‘반란을 일으키며’가 더 직접적입니다.
