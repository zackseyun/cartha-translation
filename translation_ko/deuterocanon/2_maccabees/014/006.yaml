- from: 그에 대해 그는 이렇게 말했습니다. 「유대인들 가운데 아시다이오이라 불리는 자들—그들의 우두머리는 유다 마카베오입니다—은 전쟁을 부추기고 반역을 선동하며, 허락하지 않고 있습니다」[a][b]
  to: 이에 그는 말했습니다. “유대인들 가운데 하시데인이라[a] 불리는 자들, 곧 유다 마카베오가 이끄는 자들은 전쟁을 조장하고 반란을 일으키며, 허락하지 않으면서—”[b]
  rationale: 고유 집단명은 음역으로 유지하되 현대 한국어에 맞게 ‘하시데인’으로 다듬었습니다. 유다가 그 집단을 이끈다는 관계절을 자연스럽게 재배치했고, 전쟁과 반란을 지속·조성한다는 원문의 고발을 과도하게 ‘선동’으로 한정하지 않았습니다. 마지막 분사구문은 목적어를 보충하지 않고 미완결 상태로 보존했습니다.
