  - 경건한 자들
  rationale: 설명적 번역은 집단의 역사적 고유성을 평준화할 수 있으므로, 본문이 가리키는 실제 분파성을 드러내기 위해 음역을 유지했습니다.
  doctrine_reference: Translate titles; transliterate names.
- issue: λεγόμενοι의 거리두기 뉘앙스
  chosen_reading: 본문에는 중립적 표현을 두고, 평가적 뉘앙스는 주석으로 열어 두었습니다.
  alternative_readings:
  - 이른바
  - 소위
  rationale: 원문은 단순 지칭일 수도 있어 본문에서 단정적으로 비하하지 않았습니다. 다만 문맥상 경멸적 뉘앙스 가능성은 남아 있으므로 해석 여지를 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
