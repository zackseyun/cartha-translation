translation:
  language: ko
  text: 이에 그는 말했습니다. “유대인들 가운데 하시데인이라[a] 불리는 자들, 곧 유다 마카베오가 이끄는 자들은 전쟁을 조장하고 반란을 일으키며, 허락하지 않으면서—”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「이른바 하시데인들」. λεγόμενοι를 다소 거리 두는 뉘앙스로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 문장은 다음 절로 이어집니다. 이 절은 「허락하지 않으면서」에서 끝나며, 목적어는 다음 절에서 드러납니다.
    reason: textual_variant
lexical_decisions:
- source_word: πρὸς ταῦτα ἔφη
  english_pob_choice: In reply he said
  chosen_korean: 그에 대해 그는 이렇게 말했습니다
  alternatives_korean:
  - 이에 그는 말했습니다
  - 대답하여 그는 말했습니다
  lexicon: LSJ
  rationale: πρὸς ταῦτα는 앞선 발언에 대한 응답을 가리키므로, 한국어에서는 ‘그에 대해/이에’로 담담하게 연결해 답변 기능을 살렸습니다.
- source_word: Οἱ λεγόμενοι
  english_pob_choice: Those ... who are called
  chosen_korean: 불리는 자들
  alternatives_korean:
  - 이른바
  - 소위 불리는 자들
  lexicon: LSJ
  rationale: λεγόμενοι는 단순한 명명일 수도 있고 다소 거리두는 뉘앙스일 수도 있어, 본문에서는 중립적인 ‘불리는 자들’로 옮기고 과도한 평가어는 피했습니다.
- source_word: Ἀσιδαῖοι
  english_pob_choice: Hasideans
  chosen_korean: 아시다이오이라
  alternatives_korean:
  - 하시대인
  - 하시데인
  lexicon: LSJ
  rationale: 특정 유대 집단의 고유명사이므로 음역을 유지했습니다. 한국어에서는 통용형이 확립되어 있지 않아 학술적으로 무난한 음역을 택했습니다.
- source_word: πολεμοτροφοῦσιν καὶ στασιάζουσιν
  english_pob_choice: keep feeding war and stirring up rebellion
  chosen_korean: 전쟁을 부추기고 반역을 선동하며
  alternatives_korean:
  - 전쟁을 키우고 반란을 일으키며
  - 전쟁을 먹이고 분쟁을 일으키며
  lexicon: LSJ
  rationale: πολεμοτροφοῦσιν의 ‘먹여 살리다/기르다’ 이미지를 한국어에서 자연스럽게 살리기 위해 ‘부추기다’로, στασιάζουσιν은 내란·소요의 의미를 반영해 ‘반역을 선동하다’로 옮겼습니다.
- source_word: οὐκ ἐῶντες
  english_pob_choice: not allowing
  chosen_korean: 허락하지 않고 있습니다
  alternatives_korean:
  - 허락하지 않으며
  - 허용하지 않고 있습니다
  lexicon: LSJ
  rationale: 문장이 다음 절로 이어지는 미완결 구조이므로, 현재분사의 진행감을 살려 ‘허락하지 않고 있습니다’로 열린 상태를 유지했습니다.
theological_decisions:
- issue: Ἀσιδαῖοι의 역사적 집단명 처리
  chosen_reading: 음역으로 처리해 특정 유대 집단명으로 보존했습니다.
  alternative_readings:
