  yaml_path: translation/deuterocanon/2_maccabees/014/041.yaml
  text: But when the crowds were about to seize the tower[a], and were forcing the courtyard gate, and were ordering that fire be brought and the doors set on fire, he, completely surrounded, put the sword to himself;
  footnotes:
  - marker: a
    text: Or 'fell upon his sword' or 'thrust the sword into himself.' The Greek more literally says 'put the sword to himself.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 무리가 탑을 점령하려 하고, 뜰 문을 강제로 열려고 하며, 불을 가져와 문들에 불을 붙이고 태우라고 명령할 때, 그는 완전히 포위된 채 칼을 자기 몸에 댔습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘칼 위로 몸을 던졌다’ 또는 ‘칼을 자기 몸에 찔렀다’로 옮길 수 있습니다. 그리스어는 더 문자적으로 ‘칼을 자기에게 댔다’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν δὲ πληθῶν
  english_pob_choice: the crowds
  chosen_korean: 그 무리
  alternatives_korean:
  - 그 군중
  - 사람들
  - 무리들
  lexicon: LSJ
  rationale: πλῆθος은 ‘무리/군중’의 뜻으로, 여기서는 포위 공격 장면이므로 자연스러운 ‘그 무리’로 옮기되 ‘폭도’처럼 원문에 없는 평가를 덧붙이지 않았습니다.
- source_word: μελλόντων τὸν πύργον καταλαβέσθαι
  english_pob_choice: were about to seize the tower
  chosen_korean: 탑을 빼앗으려 하고
  alternatives_korean:
  - 탑을 차지하려 하고
  - 탑을 점령하려 하고
  - 탑을 잡으려 하고
  lexicon: LSJ
  rationale: καταλαμβάνω는 여기서 점유·장악의 뜻이므로, 급박한 공격 문맥에 맞는 ‘빼앗으려 하고’로 옮겼습니다.
- source_word: τὴν αὐλαίαν θύραν
  english_pob_choice: the courtyard gate
  chosen_korean: 뜰 문
  alternatives_korean:
  - 마당 문
  - 안뜰 문
  - 뜰의 문
  lexicon: LSJ
  rationale: αὐλαία는 뜰/안뜰의 영역을 가리키고 θύρα는 문 또는 성문이 될 수 있어, 문맥상 가장 간결한 ‘뜰 문’이 적절합니다.
- source_word: βιαζομένων καὶ κελευόντων πῦρ προσάγειν καὶ τὰς θύρας ὑφάπτειν καὶ τὰς θύρας φλέγειν
  english_pob_choice: were forcing... and were ordering that fire be brought and the doors set on fire
  chosen_korean: 불을 가져오고 문들을 불태우라고 명령하는 동안
  alternatives_korean:
  - 불을 가져오고 문들에 불을 지르라고 명령하는 동안
  - 불을 대고 문들을 태우라고 명령하는 동안
  - 불을 들여와 문들을 태우라고 명령하는 동안
  lexicon: LSJ
  rationale: 세 동사가 누적되어 불붙임의 긴박함을 강화하므로, 한국어에서도 ‘불을 가져오고’와 ‘문들을 불태우다’로 그 압박을 살렸습니다. τεστ? 아니고 ὑφάπτω/φλέγω의 연속적 반복을 과도하게 평탄화하지 않았습니다.
- source_word: περικάλυπτος γενόμενος
  english_pob_choice: completely surrounded
  chosen_korean: 사면이 완전히 에워싸인 채
  alternatives_korean:
  - 완전히 둘러싸인 채
  - 사방으로 에워싸인 채
  - 사면으로 포위된 채
  lexicon: LSJ
  rationale: perikalyptos는 둘러싸여 가려진 상태를 뜻하므로, 전투 맥락에 맞게 ‘사면이 완전히 에워싸인 채’로 구체화했습니다.
- source_word: ὑπέθηκεν ἑαυτῷ τὸ ξίφος
  english_pob_choice: put the sword to himself
  chosen_korean: 칼을 자기에게 갖다 댔습니다
  alternatives_korean:
  - 칼을 자기 몸에 댔습니다
  - 자기에게 칼을 들이댔습니다
  - 칼을 자기에게 놓았습니다
  lexicon: LSJ
  rationale: 본문은 관용구보다 문자적으로 ‘자기에게 칼을 대다’에 가깝기 때문에, 자살 행위의 해석을 과도하게 특정하지 않으면서도 원문의 직설성을 유지했습니다.
theological_decisions:
- issue: 자기 살해 표현의 번역 강도
  chosen_reading: ‘칼을 자기에게 갖다 댔습니다’로 직역에 가까운 표현을 택해, 행위의 중대성을 드러내되 후대 관용구인 ‘칼에 쓰러지다’로 바꾸지 않았습니다.
  alternative_readings:
  - 칼에 몸을 던졌습니다
  - 칼에 쓰러졌습니다
  - 칼로 자결했습니다
  rationale: 본문의 그리스어는 행위의 방향만 말하고 기계적 동작을 상세히 설명하지 않으므로, 설명을 덧씌우지 않는 쪽이 더 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
