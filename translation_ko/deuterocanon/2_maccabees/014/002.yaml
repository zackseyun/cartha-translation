  naturalness: ‘나라를 장악하고, … 제거한 뒤였습니다’ is unnatural as a standalone Korean fragment because the connective ‘-고’ is followed by a past copula. A parallel participial construction, ‘나라를 장악하고 안티오코스와 그의 섭정 리시아스를 제거했다는’ is natural Korean while preserving the source’s dependent infinitival form.
  terminology: ‘안티오코스,’ ‘리시아스,’ and ‘섭정’ are appropriate. ‘섭정’ accurately represents Lysias’s contextual political role for ἐπίτροπος; the footnote should retain ‘후견인’ and ‘관리인’ as lexical alternatives. ‘치워 버린’ is overly colloquial and adds a dismissive nuance, so it should be replaced with ‘제거한.’
