  rationale: 원문에 없는 ‘사방에서’와 설명적 독립문을 제거했습니다. καθ᾽ ἣν 이하를 청원에 대한 기준·호소로 유지하고, ἕκαστα τούτων의 분배적 뉘앙스와 περιιστάμενον의 의도적으로 넓은 곤경·압박의 의미를 보존했습니다. 각주도 해당 어구 바로 뒤에 배치했습니다.
