base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/009.yaml
  text: Since you know each of these things[a], O king, take thought for the country and for our nation that is being hard pressed[b], according to the gracious goodwill you have toward all.
  footnotes:
  - marker: a
    text: Or 'our people who are beset' or 'our nation under pressure.' The Greek participle can suggest being surrounded, beset, or hard pressed.
    reason: lexical_alternative
  - marker: b
    text: The phrase rendered 'gracious goodwill' translates a rare expression describing benevolence that is readily shown or favorably disposed toward others.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 모든 것을 아시는 왕이시여, 나라와 사방에서 압박을 받고 있는 우리의 민족을 헤아려 주십시오. 이는 모든 사람에게 가지신 너그러운 호의에 따라 하시는 일입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἕκαστα τούτων은 앞에서 언급된 각 항목을 하나하나 가리키므로, 문맥상 '이 모든 것'으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: τοῦ περιισταμένου γένους ἡμῶν은 '둘러싸인 우리의 민족' 또는 '압박을 받고 있는 우리의 민족'으로 옮길 수 있는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστα τούτων / ἐπεγνωκώς
  english_pob_choice: Since you know each of these things
  chosen_korean: 이 모든 것을 아시는
  alternatives_korean:
  - 이 각각의 것을 아시는
  - 이 모든 일을 이미 아시는
  lexicon: LSJ
  rationale: ἐπεγνωκώς의 완결된 인식을 살리면서, ἕκαστα τούτων의 개별 항목들을 한국어에서 자연스럽게 묶어 표현했습니다.
- source_word: προσνοήθητι
  english_pob_choice: take thought for
  chosen_korean: 헤아려 주십시오
  alternatives_korean:
  - 돌보아 주십시오
  - 마음을 기울여 주십시오
  - 생각해 주십시오
  lexicon: LSJ
  rationale: 왕에게 나라와 민족을 향해 의도적으로 관심과 배려를 돌리라는 요청이므로, 단순한 '생각하다'보다 배려를 포함한 '헤아려 주십시오'가 적절합니다.
- source_word: τῆς χώρας
  english_pob_choice: the country
  chosen_korean: 나라
  alternatives_korean:
  - 땅
  - 지역
  - 영토
  lexicon: LSJ
  rationale: 정치적 청원 맥락에서 χώρα는 특정 영토보다 공동체의 정치적 실체를 가리키므로, '나라'가 가장 자연스럽습니다.
- source_word: τοῦ περιισταμένου γένους ἡμῶν
  english_pob_choice: our nation that is being hard pressed
  chosen_korean: 압박을 받고 있는 우리의 민족
  alternatives_korean:
  - 둘러싸여 있는 우리의 민족
  - 포위된 우리의 민족
  - 곤경에 처한 우리의 민족
  lexicon: LSJ
  rationale: περιισταμένου는 단순한 공간적 '둘러싸임'보다 압박과 위협을 받는 상황을 시사하므로, '압박을 받고 있는'으로 옮겼습니다. γένος은 여기서 혈통보다 공동체적 민족을 뜻합니다.
- source_word: εὐαπάντητον φιλανθρωπίαν
  english_pob_choice: the gracious goodwill you have toward all
  chosen_korean: 모든 사람에게 가지신 너그러운 호의
  alternatives_korean:
  - 모든 사람에게 보이시는 너그러운 친절
  - 모든 이에게 열려 있는 자비로운 호의
  - 모든 사람을 향한 관대한 마음
  lexicon: LSJ
  rationale: φιλανθρωπία는 단순 친절보다 인간을 향한 호의와 너그러움을 포함하며, εὐαπάντητον은 그것이 쉽게, 기꺼이 드러나는 성격을 강조하므로 '너그러운 호의'로 압축해 살렸습니다.
theological_decisions:
- issue: 왕에게 드리는 정중한 청원 어조
  chosen_reading: 직접 청원형 명령을 한국어 공손체로 유지하여 '헤아려 주십시오'로 옮겼습니다.
  alternative_readings:
  - 헤아리소서
  - 생각하여 주십시오
  rationale: 본문은 왕에게 하는 간청이므로, 현대 한국어 합쇼체 안에서 공손하면서도 직접적인 청원으로 유지하는 것이 가장 충실합니다.
  doctrine_reference: 서술·화행 보존
