  rationale: 여기서는 단순한 ‘행하다’가 아니라 왕을 향한 직접적 대항을 뜻하므로, 현대 한국어에서 의미가 분명한 ‘맞서다’를 선택했습니다.
- source_word: εὔκαιρον ἐτήρει
  english_pob_choice: he kept watching for an opportunity
  chosen_korean: 적절한 때를 노리고 있었습니다
  alternatives_korean:
  - 기회를 계속 노리고 있었습니다
