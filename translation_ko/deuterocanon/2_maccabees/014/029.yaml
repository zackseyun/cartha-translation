  text: But since it was not possible to oppose the king[a], he kept watching for an opportunity to accomplish it by a stratagem.
  footnotes:
  - marker: a
    text: Or, more formally, 'he kept watching for a favorable moment to accomplish it by a stratagem.' The Greek leaves the object of 'accomplish' implicit.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 왕에게 맞서기는 불가능했으므로, 그는 계략으로 그것을 이루기 위한 적절한 때를 노리고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 형식적으로, ‘계략으로 그것을 이루기 위한 유리한 순간을 계속 노리고 있었습니다.’ 그리스어는 ‘이루다’의 목적어를 생략합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ δὲ
  english_pob_choice: But since
  chosen_korean: 그런데
  alternatives_korean:
  - 그리고
  - 그런데도
  - 하지만
  lexicon: LSJ
  rationale: 앞선 사정과의 전환 및 원인 제시를 함께 살려, 문맥상 자연스러운 역접·전환 표지로 옮겼습니다.
- source_word: τῷ βασιλεῖ ἀντιπρᾶξαι
  english_pob_choice: to oppose the king
  chosen_korean: 왕에게 맞서기는
  alternatives_korean:
