  - 왕에게 반항하기는
  - 왕에 대해 맞서기는
  lexicon: LSJ
  rationale: 여기서는 단순한 ‘행하다’가 아니라 왕을 향한 직접적 대항을 뜻하므로, 현대 한국어에서 의미가 분명한 ‘맞서다’를 선택했습니다.
- source_word: εὔκαιρον ἐτήρει
  english_pob_choice: he kept watching for an opportunity
  chosen_korean: 적절한 때를 노리고 있었습니다
  alternatives_korean:
  - 기회를 계속 노리고 있었습니다
  - 좋은 때를 기다리고 있었습니다
  - 유리한 순간을 기다리고 있었습니다
  lexicon: LSJ
  rationale: εὔκαιρον의 ‘알맞은/적절한 때’라는 뜻과 ἐτήρει의 지속적 뉘앙스를 함께 살려, 단순한 대기보다 의도적 추적을 드러냈습니다.
- source_word: στρατηγήματι
  english_pob_choice: by a stratagem
  chosen_korean: 계략으로
  alternatives_korean:
  - 속임수로
  - 책략으로
  - 전술로
  lexicon: LSJ
  rationale: 전략적이면서도 기만적인 수단을 가리키므로, 군사적 색채가 지나치지 않으면서도 계산된 속임의 뉘앙스를 살리는 ‘계략’으로 옮겼습니다.
- source_word: τοῦ ἐπιτελέσαι
  english_pob_choice: to accomplish it
  chosen_korean: 그것을 이루기 위한
  alternatives_korean:
  - 그것을 완수하기 위한
  - 그 일을 실행하기 위한
  - 그것을 성취하기 위한
  lexicon: LSJ
  rationale: 그리스어는 목적 부정사로 목적을 밝히지만 목적어가 생략되어 있어, 문맥상 가리키는 계획의 성취를 한국어에서 과도하게 특정하지 않는 범위로 풀었습니다.
