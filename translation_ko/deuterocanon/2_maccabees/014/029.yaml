  rationale: 앞선 사정과의 전환 및 원인 제시를 함께 살려, 문맥상 자연스러운 역접·전환 표지로 옮겼습니다.
- source_word: τῷ βασιλεῖ ἀντιπρᾶξαι
  english_pob_choice: to oppose the king
  chosen_korean: 왕에게 맞서기는
