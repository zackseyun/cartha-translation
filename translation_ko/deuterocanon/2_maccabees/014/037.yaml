base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/037.yaml
  text: Now a certain Razis[a], one of the elders from Jerusalem, was reported to Nicanor—a man devoted to his city and very highly regarded[b], and because of his goodwill called the father of the Jews.
  footnotes:
  - marker: a
    text: Or 'was denounced to Nicanor.' The Greek verb can carry the sense of being informed against in a hostile setting.
    reason: lexical_alternative
  - marker: b
    text: Literally 'a lover of his city'; that is, one devoted to the welfare of his people and civic community.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 예루살렘 출신의 원로들 가운데 한 사람인 라지스라는 이가 니카노르에게 알려졌습니다. 그는 자기 도시를 사랑하는 사람이었고 매우 높이 평가받았으며, 그의 호의 때문에 유대인의 아버지라고 불렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 도시를 사랑하는 사람’입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘매우 잘 들리는/좋은 평판을 받는’이라는 뜻으로, 공적 명성을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ῥαζεὶς
  english_pob_choice: Razis
  chosen_korean: 라지스
  alternatives_korean:
  - 라제이스
  - 라지즈
  lexicon: 고유명사 음역
  rationale: 그리스어 인명을 한국어 음역으로 옮겼으며, 현대 표기에서 자연스러운 ‘라지스’를 택했습니다.
- source_word: πρεσβυτέρων
  english_pob_choice: elders
  chosen_korean: 원로들
  alternatives_korean:
  - 장로들
  - 연장자들
  lexicon: LSJ
  rationale: 여기서는 단순한 연령보다 예루살렘의 공적·사회적 지도층을 가리키므로, 교회 직분어보다 중립적인 ‘원로들’이 더 적절합니다.
- source_word: ἐμηνύθη
  english_pob_choice: was reported
  chosen_korean: 알려졌습니다
  alternatives_korean:
  - 고발당했습니다
  - 보고되었습니다
  - 밀고당했습니다
  lexicon: LSJ
  rationale: 수동형은 니카노르에게 어떤 정보가 전달되었음을 말하며, 문맥상 적대적 뉘앙스가 가능하지만 본문은 그 강도를 단정하지 않으므로 ‘알려졌습니다’로 옮겼습니다.
- source_word: φιλοπολίτης
  english_pob_choice: devoted to his city
  chosen_korean: 자기 도시를 사랑하는
  alternatives_korean:
  - 도시에 헌신하는
  - 애향심이 강한
  - 시민애가 깊은
  lexicon: LSJ
  rationale: 직역하면 ‘도시를 사랑하는 사람’이라는 뜻으로, 폴리스에 대한 충성의 의미를 자연스러운 한국어로 살렸습니다.
- source_word: σφόδρα καλῶς ἀκούων
  english_pob_choice: very highly regarded
  chosen_korean: 매우 높이 평가받았으며
  alternatives_korean:
  - 매우 평판이 좋았으며
  - 매우 훌륭한 평을 받았으며
  - 아주 잘 알려져 있었으며
  lexicon: LSJ
  rationale: 관용구는 명성과 평판을 가리키므로, 합쇼체 문맥에 맞게 ‘높이 평가받았으며’로 옮겨 공적인 존중을 드러냈습니다.
- source_word: εὔνοιαν πατὴρ τῶν Ἰουδαίων προσαγορευόμενος
  english_pob_choice: because of his goodwill called the father of the Jews
  chosen_korean: 그의 호의 때문에 유대인의 아버지라고 불렸습니다
  alternatives_korean:
  - 그의 선의 때문에 유대인들의 아버지라 불렸습니다
  - 그의 호의로 인해 유대인의 아버지라는 칭호를 받았습니다
  lexicon: LSJ
  rationale: εὔνοια는 ‘호의/선의’의 뜻이며, προσαγορευόμενος는 관습적 칭호를 받는다는 의미이므로, 존칭적 별칭을 살려 번역했습니다.
theological_decisions:
- issue: 라지스에 대한 찬양조의 서술 보존
  chosen_reading: 본문의 긍정적 평판과 공동체적 칭호를 약화시키지 않고 그대로 살렸습니다.
  alternative_readings:
  - 의역하여 ‘애국자’나 ‘공공의 은인’으로 풀기
  - ‘유대인의 아버지’ 대신 설명적으로 재구성하기
  rationale: 이 절은 라지스를 호의적으로 묘사하는 서술 자체가 중요한데, 이를 한국어에서도 과장이나 완화 없이 유지하는 것이 원문 의미를 가장 잘 드러냅니다.
  doctrine_reference: 원문 우선 원칙; 해석적 완화보다 소스의 평가적 뉘앙스 보존
