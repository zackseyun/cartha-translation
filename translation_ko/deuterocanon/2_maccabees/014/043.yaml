base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/043.yaml
  text: But since he had not succeeded in the blow because of the urgency of the struggle[a], and the crowds were rushing in within the gates[b], he ran up bravely onto the wall and hurled himself manfully down into the crowds.
  footnotes:
  - marker: a
    text: Or 'had not accomplished his purpose with the blow'; the Greek wording suggests that his initial self-inflicted strike did not achieve its intended result.
    reason: lexical_alternative
  - marker: b
    text: Or 'threw himself down courageously.' The Greek says 'manfully,' using a specifically masculine-coded term for boldness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그는 싸움의 급박함 때문에 그 타격으로 뜻을 이루지 못했고[a], 군중이 문 안으로 들이닥치고 있을 때 용감하게 성벽 위로 달려 올라가 군중 속으로 남자답게[b] 몸을 내던졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 일격으로 뜻을 이루지 못하였는데’; 그리스어 표현은 그가 가한 자해의 타격이 의도한 결과를 이루지 못했음을 시사합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘용감하게 몸을 내던졌습니다.’ 그리스어는 ‘남자답게’라는 남성 표지의 표현을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ πληγῇ μὴ κατευκτήσας
  english_pob_choice: had not succeeded in the blow
  chosen_korean: 타격으로 뜻을 이루지 못하였는데
  alternatives_korean:
  - 그 타격에서 성공하지 못하였는데
  - 그 상처로 뜻을 이루지 못하였는데
  - 그 일격을 이루지 못하였는데
  lexicon: LSJ
  rationale: πληγῇ는 여기서 ‘상처’보다 ‘타격/일격’이 자연스럽고, κατευκτήσας는 단순 실패가 아니라 의도한 결과를 이루지 못한 뜻이어서 이를 함께 반영했습니다.
- source_word: διὰ τὴν τοῦ ἀγῶνος σπουδήν
  english_pob_choice: because of the urgency of the struggle
  chosen_korean: 싸움의 급박함 때문이었고
  alternatives_korean:
  - 투쟁의 긴급함 때문이었고
  - 경쟁의 서두름 때문이었고
  - 싸움의 서두름 때문이었고
  lexicon: LSJ
  rationale: ἀγών은 여기서 경기보다 폭력적 ‘싸움/투쟁’의 의미가 강하고, σπουδή는 ‘급함, 긴박함’이므로 이를 압축적으로 옮겼습니다.
- source_word: ἔσω τῶν θυρωμάτων εἰσβαλλόντων
  english_pob_choice: were rushing in within the gates
  chosen_korean: 성문 안으로 들이닥치고 있었기 때문이었고
  alternatives_korean:
  - 문들 안으로 밀려들고 있었기 때문이었고
  - 성문 안으로 몰려들고 있었기 때문이었고
  - 문 안쪽으로 급히 들어오고 있었기 때문이었고
  lexicon: LSJ
  rationale: ἔσω는 ‘안으로’, εἰσβάλλω는 ‘들어닥치다/밀고 들어가다’의 뉘앙스가 있어, 단순 입장이 아니라 난입하는 상황을 살렸습니다.
- source_word: ἀναδραμὼν γενναίως
  english_pob_choice: he ran up bravely
  chosen_korean: 용감하게 성벽 위로 달려 올라가서
  alternatives_korean:
  - 씩씩하게 성벽 위로 뛰어 올라가서
  - 당당히 성벽 위로 달려 올라가서
  - 용맹하게 성벽 위로 올라가서
  lexicon: LSJ
  rationale: ἀναδραμών은 위로 달려 올라감이고, γενναίως는 ‘용감하게/기개 있게’이므로 한국어에서 자연스러운 합쇼체 서술로 옮겼습니다.
- source_word: ἀπεκρήμνισεν ἑαυτὸν ἀνδρωδῶς
  english_pob_choice: hurled himself manfully
  chosen_korean: 군중 속으로 남자답게 몸을 던졌습니다
  alternatives_korean:
  - 군중 속으로 용감하게 몸을 던졌습니다
  - 군중 속으로 사내답게 몸을 던졌습니다
  - 군중 속으로 힘차게 몸을 던졌습니다
  lexicon: LSJ
  rationale: ἀπεκρήμνισεν ἑαυτόν은 ‘몸을 던지다/내던지다’가 맞고, ἀνδρωδῶς는 남성적으로 코드화된 ‘남자답게’라는 어감을 살렸습니다.
theological_decisions:
- issue: ἀνδρωδῶς의 남성 표지 보존 여부
  chosen_reading: ‘남자답게’로 옮겨, 단순한 ‘용감하게’로 평탄화하지 않았습니다.
  alternative_readings:
  - 용감하게
  - 사내답게
  - 씩씩하게
  rationale: 본문은 단지 용기를 말하는 것이 아니라 남성적 기개를 직접적으로 표지하는 부사를 사용합니다. 이를 한국어에서도 보존해 원문의 뉘앙스를 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
