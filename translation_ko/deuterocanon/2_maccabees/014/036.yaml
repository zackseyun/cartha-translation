  to: 이제, 모든 거룩함 가운데[b] 거룩하신 주님, 최근에 정결하게 된 이 집[a]을 영원히 더럽혀지지 않게 지켜 주십시오.
  rationale: 본문 의미는 유지하면서 πρόσφατως의 시간적 뉘앙스를 더 직접적으로 옮기고, 두 각주 표지를 해당 설명 대상에 맞게 재배치했습니다. ‘모든 거룩함 가운데 거룩하신’이라는 다소 비일상적인 호칭은 원문의 압축되고 논쟁의 여지가 있는 강조를 과도하게 해석하지 않기 위해 유지했습니다.
