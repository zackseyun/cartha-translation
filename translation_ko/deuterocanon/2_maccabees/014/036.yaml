  yaml_path: translation/deuterocanon/2_maccabees/014/036.yaml
  text: And now, O Lord, holy in every holiness, keep this house, recently purified, undefiled forever.
  footnotes:
  - marker: a
    text: Or 'this temple.' Greek 'this house' is a common biblical way of referring to the sanctuary.
    reason: lexical_alternative
  - marker: b
    text: The address 'holy in every holiness' is a close rendering of an unusual Greek expression; it may also be understood as 'holy above every consecration' or similarly intensive language.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제, 모든 거룩함 가운데[b] 거룩하신 주님, 최근에 정결하게 된 이 집[a]을 영원히 더럽혀지지 않게 지켜 주십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집’은 여기서 성전을 가리키는 성서적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘모든 거룩함 가운데’는 원문의 특이하고 강한 표현을 비교적 가깝게 옮긴 것입니다. ‘모든 성별 가운데’ 또는 비슷한 강조로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγιε
  english_pob_choice: holy
  chosen_korean: 거룩하신
  alternatives_korean:
  - 성결하신
  - 성스러우신
  lexicon: LSJ
  rationale: 하나님을 직접 부르는 호격 형용사로, 표준적이고 자연스러운 ‘거룩하신’이 원문의 직설성을 잘 살립니다.
- source_word: παντὸς ἁγιασμοῦ
  english_pob_choice: in every holiness
  chosen_korean: 모든 거룩함 가운데
  alternatives_korean:
  - 모든 성별 가운데
  - 모든 성결 가운데
  lexicon: LSJ
  rationale: 원문의 특이한 강한 표현을 과도하게 풀지 않고, ‘가운데’로 둘러 말해 한국어에서도 집약적·수식적 울림을 보존합니다.
- source_word: διατήρησον
  english_pob_choice: keep
  chosen_korean: 지켜 주십시오
  alternatives_korean:
  - 보존해 주십시오
  - 유지해 주십시오
  lexicon: LSJ
  rationale: 기도문 맥락의 청원형으로서, 상태를 계속 보전해 달라는 뜻을 한국어에서 가장 자연스럽게 드러냅니다.
- source_word: τὸν ... οἶκον
  english_pob_choice: this house
  chosen_korean: 이 집
  alternatives_korean:
  - 이 성전
  - 이 집(성전)
  lexicon: LSJ
  rationale: 직역어 ‘집’을 살리되, 문맥상 성소를 가리키는 관용을 그대로 유지합니다. POB의 ‘house’ 선택을 한국어에서도 반영했습니다.
- source_word: ἀμίαντον
  english_pob_choice: undefiled
  chosen_korean: 더럽혀지지 않게
  alternatives_korean:
  - 부정하지 않게
  - 더럽혀지지 않은
  lexicon: LSJ
  rationale: 제의적 정결의 상태를 동사화해, 결과 상태를 기도문 속에서 자연스럽게 표현합니다.
- source_word: προσφάτως κεκαθερισμένον
  english_pob_choice: recently purified
  chosen_korean: 새로 정결하게 된
  alternatives_korean:
  - 최근에 정결하게 된
  - 방금 정결하게 된
  lexicon: LSJ
  rationale: προσφάτως의 ‘최근에/새로’와 완료 수동의 ‘정결하게 된’을 함께 살려, 정결 상태가 방금 이루어졌음을 분명히 합니다.
theological_decisions:
- issue: 성전이 아닌 ‘집’(οἶκος)으로 유지할지 여부
  chosen_reading: 이 집
  alternative_readings:
  - 이 성전
  - 이 집, 곧 성전
  rationale: 원문은 ‘집’을 쓰며, 이는 성소를 가리키는 성서적 관용입니다. 본문 어휘를 유지하는 것이 원문의 문체와 감사 기도의 톤을 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: ‘거룩함’ 표현의 강한 중첩을 어떻게 처리할지
  chosen_reading: 모든 거룩함 가운데 거룩하신
  alternative_readings:
  - 모든 거룩함의 거룩하신
  - 가장 거룩하신
  rationale: 원문의 압축된 예배적 수사를 평이하게 바꾸지 않고, 강한 수식 관계를 유지해 하나님께 드리는 찬양의 밀도를 살렸습니다.
  doctrine_reference: Translation philosophy §1, §6
