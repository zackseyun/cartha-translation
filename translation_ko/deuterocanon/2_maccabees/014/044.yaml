- source_word: γενομένου διαστήματος
  english_pob_choice: a space opened up
  chosen_korean: 공간이 생기자
  alternatives_korean:
  - 틈이 생기자
  - 빈자리가 생기자
  - 간격이 생기자
  lexicon: LSJ
  rationale: 군중이 비켜서며 비어 있는 자리가 만들어진 상황을 간명하게 살리기 위해 ‘공간이 생기자’로 옮겼습니다.
- source_word: κενεῶνα
  english_pob_choice: courtyard
  chosen_korean: 뜰
  alternatives_korean:
  - 안뜰
  - 마당
  - 뜰마당
  lexicon: LSJ
  rationale: LSJ의 ‘open court/courtyard’에 해당하는 개방된 중심 공간을 한국어로 자연스럽게 전달하는 기본어는 ‘뜰’입니다.
