lexical_decisions:
- source_word: ἀναποδισάντων
  english_pob_choice: drew back
  chosen_korean: 물러나고
  alternatives_korean:
  - 뒤로 물러서고
  - 후퇴하고
  - 물러서자
  lexicon: LSJ
  rationale: 사람들이 몸을 뒤로 빼며 자리를 비우는 장면이므로, 군사적 뉘앙스가 강한 ‘후퇴하고’보다 자연스럽고 장면에 맞는 ‘물러나고’가 적절합니다.
- source_word: ταχέως
  english_pob_choice: quickly
  chosen_korean: 서둘러
  alternatives_korean:
  - 빨리
  - 재빨리
  - 신속히
  lexicon: LSJ
  rationale: 즉각적이고 급한 움직임을 한국어로 자연스럽게 살리기 위해 ‘서둘러’를 택했습니다.
- source_word: γενομένου διαστήματος
  english_pob_choice: a space opened up
  chosen_korean: 공간이 생기자
  alternatives_korean:
  - 틈이 생기자
  - 빈자리가 생기자
  - 간격이 생기자
  lexicon: LSJ
  rationale: 군중이 비켜서며 비어 있는 자리가 만들어진 상황을 간명하게 살리기 위해 ‘공간이 생기자’로 옮겼습니다.
- source_word: κενεῶνα
  english_pob_choice: courtyard
  chosen_korean: 뜰
  alternatives_korean:
  - 안뜰
  - 마당
  - 뜰마당
  lexicon: LSJ
  rationale: LSJ의 ‘open court/courtyard’에 해당하는 개방된 중심 공간을 한국어로 자연스럽게 전달하는 기본어는 ‘뜰’입니다.
