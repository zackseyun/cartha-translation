lexical_decisions:
- source_word: ἀναποδισάντων
  english_pob_choice: drew back
  chosen_korean: 물러나고
  alternatives_korean:
  - 뒤로 물러서고
  - 후퇴하고
  - 물러서자
  lexicon: LSJ
  rationale: 사람들이 몸을 뒤로 빼며 자리를 비우는 장면이므로, 군사적 뉘앙스가 강한 ‘후퇴하고’보다 자연스럽고 장면에 맞는 ‘물러나고’가 적절합니다.
- source_word: ταχέως
