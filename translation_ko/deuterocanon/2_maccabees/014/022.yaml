  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안은 ἑτοίμους(‘준비된, 대비한’)를 번역에서 빠뜨렸고, κακουργία를 영어 단어 ‘treachery’로 남겨 두었습니다. 또한 ‘그에 합당한’의 ‘그에’는 원문에 명시된 선행사를 전제하는 표현입니다.
  naturalness: ‘전략적인 곳들’도 이해 가능하지만 군사 문맥에서는 ‘전략적으로 중요한 곳들’이 더 자연스럽습니다. ‘알맞은 협의’를 사용하면 자연스러운 합쇼체를 유지하면서 원문의 관용적 표현을 과도하게 풀어쓰지 않습니다.
  terminology: ἐνόπλους는 ‘무장한 사람들’, ἐπικαίροις τόποις는 ‘전략적으로 중요한 곳들’, κακουργία는 문맥상 ‘악행’으로 옮겼습니다. ‘배신’이나 ‘배반’으로 한정하지 않아 그리스어의 다소 넓은 표현을 보존했습니다.
  issues:
