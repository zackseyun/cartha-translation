base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/022.yaml
  text: Judas stationed armed men[a], ready in strategic places, lest some treachery from the enemies should suddenly arise; and they held the fitting conference.
  footnotes:
  - marker: a
    text: Or 'they conferred together appropriately.' The Greek τὴν ἁρμόζουσαν ἐποίησαν κοινολογίαν is somewhat idiomatic, referring to a suitable mutual discussion or conference.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다는 적들 쪽에서 갑작스러운 악행이 일어나지 않도록, 무장한 사람들을 준비시켜 전략적으로 중요한 곳들에 배치하였습니다. 그리고 그들은 알맞은 협의를 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 적절하게 서로 협의하였습니다.’ 그리스어 τὴν ἁρμόζουσαν ἐποίησαν κοινολογίαν은 다소 관용적인 표현으로, 알맞은 상호 논의나 협의를 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: διέταξεν
  english_pob_choice: stationed
  chosen_korean: 배치하여
  alternatives_korean:
  - 배치하였습니다
  - 진영을 정하였습니다
  - 두었습니다
  lexicon: LSJ
  rationale: 군사적 문맥에서 단순한 ‘명령하다’보다 사람들을 특정 위치에 실제로 세워 두는 뜻이 강하므로, ‘배치하다’가 POB의 ‘stationed’를 가장 자연스럽게 살립니다.
- source_word: ἐνόπλους
  english_pob_choice: armed men
  chosen_korean: 무장한 사람들을
  alternatives_korean:
  - 무장한 군인들을
  - 무장한 자들을
  - 무기를 든 사람들을
  lexicon: LSJ
  rationale: 원문은 ‘무장한 이들’이라는 인적 표현이며, 한국어에서는 군사성을 유지하면서도 과도하게 직역하지 않도록 ‘무장한 사람들’을 택했습니다.
- source_word: ἐν τοῖς ἐπικαίροις τόποις
  english_pob_choice: in strategic places
  chosen_korean: 전략적인 곳들에
  alternatives_korean:
  - 적절한 곳들에
  - 요충지들에
  - 중요한 지점들에
  lexicon: LSJ
  rationale: ἐπικαίροις는 상황상 유리하고 중요한 위치를 뜻하므로, 군사적 맥락을 분명히 하는 ‘전략적인 곳들’이 가장 잘 맞습니다.
- source_word: τὴν ἁρμόζουσαν ἐποίησαν κοινολογίαν
  english_pob_choice: they held the fitting conference
  chosen_korean: 그들은 그에 합당한 회의를 했습니다
  alternatives_korean:
  - 그들은 적절한 협의를 했습니다
  - 그들은 합당한 상의를 했습니다
  - 그들은 적합한 회합을 가졌습니다
  lexicon: LSJ
  rationale: 이 표현은 관용적으로 ‘적절한 상호 논의/회의’를 뜻하므로, POB의 의미를 살리되 한국어에서는 자연스럽게 ‘그에 합당한 회의’를 사용했습니다.
theological_decisions:
- issue: 무장한 사람들의 배치와 회의의 병치가 주는 서술 톤
  chosen_reading: 경계 태세와 협의가 함께 제시되는 역사 서술로 읽고, 별도의 신학적 강조를 덧붙이지 않았습니다.
  alternative_readings:
  - 도덕적 교훈을 강조하는 읽기
  - 정치적 지혜를 강조하는 읽기
  rationale: 본문은 사건의 진행을 간결히 기록하며, 원문이 말하는 범위를 넘어 교훈을 확장하지 않는 것이 적절합니다.
  doctrine_reference: 역사서술의 문맥 보존
