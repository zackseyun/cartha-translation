  - severity: medium
    issue: ἑτοίμους(‘준비된/대비한’)가 누락되었습니다.
    rationale: 유다가 배치한 무장 인원들이 즉각 대응할 준비가 되어 있었다는 군사적 상황 묘사가 원문에 명시되어 있습니다.
  - severity: low
    issue: ‘그에 합당한 회의’의 ‘그에’는 원문에 없는 지시 대상을 추가합니다.
    rationale: τὴν ἁρμόζουσαν은 ‘알맞은/적절한’이라는 뜻이므로, 선행사를 특정하지 않는 표현이 더 충실합니다.
