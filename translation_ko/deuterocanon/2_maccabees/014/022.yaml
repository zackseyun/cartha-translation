revisions:
- from: 유다는 무장한 사람들을 전략적인 곳들에 배치하여, 적들로부터 갑작스러운 treachery가 일어나지 못하게 하였습니다. 그리고 그들은 그에 합당한 회의를 했습니다.[a]
  to: 유다는 적들 쪽에서 갑작스러운 악행이 일어나지 않도록, 무장한 사람들을 준비시켜 전략적으로 중요한 곳들에 배치하였습니다. 그리고 그들은 알맞은 협의를 하였습니다.[a]
  rationale: 한국어로 남아 있던 영어 어휘를 번역하고, 누락된 ‘준비된’의 의미를 ‘준비시켜’로 반영했습니다. κακουργία는 문맥상 적대적 악행을 가리키지만 반드시 배신 행위로 한정되지는 않으므로 ‘악행’으로 옮겼습니다. 마지막 관용구는 원문의 적절성 및 상호 협의의 뜻을 유지하도록 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:49:31Z'
