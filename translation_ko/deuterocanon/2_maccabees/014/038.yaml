  lexicon: LSJ
  rationale: 본문의 용어를 직접 반영하되, 여기서는 단순한 종교 체계보다 유대 정체성과 실천을 함께 가리키는 역사적 용법으로 이해해 '유대교'를 택했습니다.
- source_word: σῶμα καὶ ψυχὴν
  english_pob_choice: both body and soul
  chosen_korean: 온몸과 영혼까지
  alternatives_korean:
  - 몸과 영혼을 다해
  - 몸과 영혼
  lexicon: LSJ
  rationale: 총체적 헌신과 위험 감수를 살리기 위해, 대구를 유지하면서 한국어에서도 강한 총체성을 드러냈습니다.
- source_word: μετὰ πάσης ἐκτενίας
  english_pob_choice: with all earnestness
  chosen_korean: 온전히
  alternatives_korean:
  - 온 힘을 다해
  - 간절히
  lexicon: LSJ
  rationale: 문맥상 위험을 무릅쓴 헌신의 강도를 나타내므로, 전체 절의 흐름 속에서 '온전히 내걸었습니다'로 집약해 표현했습니다.
theological_decisions:
- issue: Ἰουδαισμός의 역사적 의미
  chosen_reading: 유대교
  alternative_readings:
  - 유대인의 삶
  - 유대적 전통
  rationale: 이 용어는 단순한 추상 종교가 아니라 박해 아래의 유대적 정체성과 관습을 포함하므로, 본문 사정을 훼손하지 않는 범위에서 '유대교'로 옮겼습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: τῆς ἀμιξίας의 법정적 배경
  chosen_reading: 분리 문제가 심리되던 때
  alternative_readings:
  - 분리 사건이 재판되던 때
  - 비교제 상태가 판단되던 때
  rationale: κρίσις가 법정적 심리를 가리키는 압축 표현이므로, '분리'를 단순 상태명사로 두지 않고 심리·판단의 장면을 드러내는 방향으로 풀었습니다.
  doctrine_reference: Translation philosophy §1
