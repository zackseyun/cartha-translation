base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/038.yaml
  text: For in earlier times[a], when separation was being judged, he had come under accusation for Judaism[b], and had risked both body and soul for Judaism with all earnestness.
  footnotes:
  - marker: a
    text: Or 'when a case concerning separation/non-association was being tried.' The Greek phrase is compressed and likely reflects a judicial setting.
    reason: lexical_alternative
  - marker: b
    text: '''Judaism'' here refers not merely to abstract religion but to Jewish ancestral identity and practice under pressure.'
    reason: cultural_note
translation:
  language: ko
  text: 이전에는 분리 문제가 재판에 회부되었을 때, 그는 유대교 때문에 고발당했으며,[a] 유대교를 위해 몸과 영혼을 걸고 온 힘을 다했습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘분리/비교제에 관한 사건이 재판에 회부되었을 때’. 그리스어 표현은 압축적이며 법정적 상황을 시사합니다.
    reason: alternative_reading
  - marker: b
    text: ‘유대교’는 여기서 추상적인 종교만이 아니라, 압박 아래에서 지켜 낸 유대인의 정체성과 관행을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τοῖς ἔμπροσθεν χρόνοις
  english_pob_choice: in earlier times
  chosen_korean: 이전 시절에는
  alternatives_korean:
  - 옛적에는
  - 이전 때에는
  lexicon: LSJ
  rationale: 회고적 시간표현을 자연스러운 현대 한국어로 옮기되, 지나치게 문어적이거나 고풍스럽지 않게 했습니다.
- source_word: τῆς ἀμιξίας
  english_pob_choice: separation
  chosen_korean: 분리
  alternatives_korean:
  - 비교제
  - 섞이지 않음
  lexicon: LSJ
  rationale: 사회적·종교적 분리의 상태를 짧고 투명하게 드러내는 말로 옮겼습니다.
- source_word: κρίσις εἰσενηνεγμένος
  english_pob_choice: had come under accusation
  chosen_korean: 고발을 받았고
  alternatives_korean:
  - 재판에 넘겨졌고
  - 심문을 받았고
  lexicon: LSJ
  rationale: κρίσις가 법정적 판단/심리의 맥락을 가지므로, 결과를 '고발을 받다'로 풀어 한국어에서 자연스럽게 압축했습니다.
- source_word: Ἰουδαισμοῦ
  english_pob_choice: Judaism
  chosen_korean: 유대교
  alternatives_korean:
  - 유대인의 삶
  - 유대적 신앙
  lexicon: LSJ
  rationale: 본문의 용어를 직접 반영하되, 여기서는 단순한 종교 체계보다 유대 정체성과 실천을 함께 가리키는 역사적 용법으로 이해해 '유대교'를 택했습니다.
- source_word: σῶμα καὶ ψυχὴν
  english_pob_choice: both body and soul
  chosen_korean: 온몸과 영혼까지
  alternatives_korean:
  - 몸과 영혼을 다해
  - 몸과 영혼
  lexicon: LSJ
  rationale: 총체적 헌신과 위험 감수를 살리기 위해, 대구를 유지하면서 한국어에서도 강한 총체성을 드러냈습니다.
- source_word: μετὰ πάσης ἐκτενίας
  english_pob_choice: with all earnestness
  chosen_korean: 온전히
  alternatives_korean:
  - 온 힘을 다해
  - 간절히
  lexicon: LSJ
  rationale: 문맥상 위험을 무릅쓴 헌신의 강도를 나타내므로, 전체 절의 흐름 속에서 '온전히 내걸었습니다'로 집약해 표현했습니다.
theological_decisions:
- issue: Ἰουδαισμός의 역사적 의미
  chosen_reading: 유대교
  alternative_readings:
  - 유대인의 삶
  - 유대적 전통
  rationale: 이 용어는 단순한 추상 종교가 아니라 박해 아래의 유대적 정체성과 관습을 포함하므로, 본문 사정을 훼손하지 않는 범위에서 '유대교'로 옮겼습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: τῆς ἀμιξίας의 법정적 배경
  chosen_reading: 분리 문제가 심리되던 때
  alternative_readings:
  - 분리 사건이 재판되던 때
  - 비교제 상태가 판단되던 때
  rationale: κρίσις가 법정적 심리를 가리키는 압축 표현이므로, '분리'를 단순 상태명사로 두지 않고 심리·판단의 장면을 드러내는 방향으로 풀었습니다.
  doctrine_reference: Translation philosophy §1
