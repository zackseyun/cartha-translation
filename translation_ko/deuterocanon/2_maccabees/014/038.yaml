  rationale: κρίσις가 법정적 판단/심리의 맥락을 가지므로, 결과를 '고발을 받다'로 풀어 한국어에서 자연스럽게 압축했습니다.
- source_word: Ἰουδαισμοῦ
  english_pob_choice: Judaism
  chosen_korean: 유대교
  alternatives_korean:
