  text: He urged him to marry and have children; he married[a], settled down, and shared in common life.
  footnotes:
  - marker: a
    text: Or 'shared in common life' or 'participated in life.' The Greek expression ἐκοινώνησεν βίου is somewhat idiomatic and likely refers to entering normal domestic and social life.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그에게 결혼하여 자녀를 두라고 권했습니다. 그는 결혼하고, 자리를 잡고, 평범한 삶을 함께 나누었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ἐκοινώνησεν βίου는 관용적 표현으로, ‘평범한 삶을 함께 나누다’라는 뜻으로 옮겼습니다.
    reason: lexical_alternative
