  text: He urged him to marry and have children; he married[a], settled down, and shared in common life.
  footnotes:
  - marker: a
    text: Or 'shared in common life' or 'participated in life.' The Greek expression ἐκοινώνησεν βίου is somewhat idiomatic and likely refers to entering normal domestic and social life.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그에게 결혼하여 자녀를 두라고 권했습니다. 그는 결혼하고, 자리를 잡고, 일상적인 삶에 참여했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ἐκοινώνησεν βίου는 직역하면 ‘삶에 참여했다’ 또는 ‘삶을 함께 나누었다’는 뜻의 관용적 표현입니다. 여기서는 결혼 후의 통상적인 가정·사회생활에 참여했다는 뜻일 수 있습니다.
    reason: lexical_alternative
