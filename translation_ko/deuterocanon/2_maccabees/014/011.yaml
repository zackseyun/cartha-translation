translation:
  language: ko
  text: 그가 이런 말을 하자, 유다에게 적대감을 품은 나머지 ‘벗들’은[a] 더욱 재빨리 데메트리오스를 부추겼습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나머지 궁정 신하들’. 여기서 그리스어 ‘벗들’은 일반적인 친구라기보다 궁정 직함일 가능성이 큽니다.
    reason: cultural_note
  - marker: b
    text: 그리스어 동사는 드물게 쓰이며, 문맥상 데메트리오스를 유다에 대하여 더욱 선동하거나, 그에게 유다에 대한 편견이나 분노를 더 품게 했다는 뜻일 수 있습니다.
    reason: lexical_alternative
