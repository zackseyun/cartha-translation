translation:
  language: ko
  text: 그가 이런 말들을 하자, 나머지 ‘벗들’은 곧바로 유다에게 적대적인 마음을 품게 되어 데메트리오스를 더욱 부추겼습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나머지 왕실 궁정 신하들’. 여기의 Greek ‘벗들’은 일반적 친구라기보다 궁정 직함일 가능성이 큽니다.
    reason: cultural_note
  - marker: b
    text: 그리스어 동사는 희귀하며, 문맥상 데메트리오스를 유다에 대해 더 선동하거나 편견을 심거나 분노를 키우게 했다는 뜻일 수 있습니다.
    reason: lexical_alternative
