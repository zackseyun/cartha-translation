  text: When this man had said such things[a], the rest of the Friends, being quickly ill-disposed toward Judas[b], further incited Demetrius.
  footnotes:
  - marker: a
    text: Or, 'the other royal courtiers'; Greek 'the rest of the Friends,' likely using 'Friends' as a court title rather than in the ordinary social sense.
