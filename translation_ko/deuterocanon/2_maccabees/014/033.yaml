base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/033.yaml
  text: 'Stretching out his right hand toward the temple[a], he swore this: “If you do not hand Judas over to me as a prisoner, I will make this sanctuary of God a plain, tear down the altar, and raise up here a splendid temple to Dionysus.”'
  footnotes:
  - marker: a
    text: Or, more literally, 'I will make this house of God into a field/open plain.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 오른손을 성전을 향해 내밀고 이렇게 맹세했습니다. “너희가 유다를 포로로 내게 넘겨주지 않으면, 나는 이 하나님의 성소를 들판으로 만들고[a], 제단을 헐어 버리며, 여기 디오니소스를 위한 화려한 신전을 세우겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘이 하나님의 집을 들판/빈터로 만들겠다’는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προτείνας τὴν δεξιὰν ἐπὶ τὸν νεών
  english_pob_choice: Stretching out his right hand toward the sanctuary
  chosen_korean: 오른손을 성전을 향해 내밀고
  alternatives_korean:
  - 오른손을 펴서 성전을 향해 내밀고
  - 오른손을 성전을 향해 뻗고
  lexicon: LSJ
  rationale: προτείνω의 물리적 동작을 자연스러운 한국어로 옮기면서, ἐπὶ + 대격의 방향성을 ‘~을 향해’로 살렸습니다.
- source_word: δέσμιον
  english_pob_choice: as a prisoner
  chosen_korean: 포로로
  alternatives_korean:
  - 죄수로
  - 붙잡힌 사람으로
  lexicon: LSJ
  rationale: 여기서는 ‘묶인 상태’보다 적대적 인도 상황의 신분을 드러내는 ‘포로’가 가장 간결하고 정확합니다.
- source_word: τοῦ θεοῦ σηκόν
  english_pob_choice: this sanctuary of God
  chosen_korean: 이 하나님의 성소를
  alternatives_korean:
  - 이 하나님의 집을
  - 이 하나님의 성전을
  lexicon: LSJ
  rationale: σηκός의 기본 의미를 살리되, 이미 νεών을 ‘성전’으로 옮겼으므로 중복을 피하면서도 ‘하나님의’ 소유격을 분명히 드러내는 ‘성소’를 택했습니다.
- source_word: εἰς πεδίον ποιήσω
  english_pob_choice: I will make this sanctuary of God a plain
  chosen_korean: 들판으로 만들고
  alternatives_korean:
  - 평지로 만들고
  - 벌판으로 만들고
  lexicon: LSJ
  rationale: εἰς πεδίον의 직유적 의미를 한국어의 자연스러운 표현으로 옮겨, 건물을 완전히 허물어 평평한 빈터로 만들겠다는 위협을 살렸습니다.
- source_word: ἐπιφανὲς
  english_pob_choice: splendid
  chosen_korean: 눈에 띄는 화려한
  alternatives_korean:
  - 장대한
  - 찬란한
  - 눈에 띄는
  lexicon: LSJ
  rationale: 디오니소스를 위한 신전의 자랑조를 반영하기 위해 ‘화려한’에, ἐπιφανές의 ‘두드러진/눈에 띄는’ 뉘앙스를 보태었습니다.
theological_decisions:
- issue: 성전 관련 용어의 구분 유지
  chosen_reading: νεών은 ‘성전’, σηκός는 ‘하나님의 성소’로 구별해 옮겼습니다.
  alternative_readings:
  - 둘 다 ‘성전’으로 통일
  - 둘 다 ‘신전’으로 통일
  rationale: 그리스어가 서로 다른 성소·건물 용어를 사용하므로, 유다 성전과 디오니소스 신전을 구분하는 수사적 대비를 한국어에서도 보존했습니다.
  doctrine_reference: Translation philosophy §5 (key-term consistency with documented exceptions)
