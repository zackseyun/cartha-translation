theological_decisions:
- issue: μετʼ ἐπιφανείας의 신학적 뉘앙스
  chosen_reading: ‘현현 가운데서’로 옮겨, 하나님의 도우심이 드러난 방식임을 유지했습니다.
  alternative_readings:
  - 드러나게
  - 가시적으로
  - 공개적으로
  rationale: 본문은 도움의 실제성과 하나님의 나타나심을 함께 암시하므로, 이를 평이한 부사로 평면화하지 않고 긴장을 보존했습니다.
  doctrine_reference: 하나님의 섭리와 현현의 서술적 긴장 보존
- issue: τὸν αὐτοῦ λαόν / τῆς ἑαυτοῦ μερίδος의 언약적 소유성
  chosen_reading: ‘자기 백성’과 ‘자기 몫’으로 옮겨 소유·배정의 언어를 유지했습니다.
  alternative_readings:
  - 자기 백성들
  - 자기 기업
  - 자기 상속분
  rationale: 하나님의 백성을 단순한 집단이 아니라 하나님께 속한 몫으로 묘사하는 뉘앙스를 살리기 위해, 두 표현을 서로 연결해 번역했습니다.
  doctrine_reference: 언약 공동체의 소유/배정 이미지
