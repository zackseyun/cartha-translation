base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/030.yaml
  text: But Maccabaeus[a], perceiving from Nicanor’s actions toward him that he had assumed a harsher than usual manner, and understanding that this severity did not come from the better course, gathered not a few of his men and kept himself hidden from Nicanor.
  footnotes:
  - marker: a
    text: Or, more dynamically, 'understanding that this harshness was not for the best.' The Greek phrase οὐκ ἀπὸ τοῦ βελτίστου is idiomatic and can be taken as referring either to motive or to policy.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 마카베오스는 니카노르가 자기에게 보이는 태도와 평소의 응대 방식이 이전보다 더 거칠어졌음을 보고, 이 엄격한 태도가 더 나은 방침에서 비롯된 것이 아님을 알아차렸습니다. 그래서 자기 측 사람들 가운데 적지 않은 사람을 모아 니카노르를 피해 몸을 숨겼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘더 나은 방침에서 비롯된 것’은 그리스어 οὐκ ἀπὸ τοῦ βελτίστου를 옮긴 것입니다. 이 표현은 이 엄격함이 더 좋은 방침에서 나온 것이 아니라는 뜻으로도, 더 좋은 의도에서 나온 것이 아니라는 뜻으로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: αἰσθητήριον διεξαγαγόντος
  english_pob_choice: perceiving from Nicanor’s actions toward him
  chosen_korean: 니카노르가 자기에게 보인 행동을 보고
  alternatives_korean:
  - 니카노르의 태도를 보고
  - 니카노르의 행실을 보고
  - 니카노르의 처신을 보고
  lexicon: LSJ; BDAG
  rationale: 감각적 인식과 그에 따른 판단을 함께 나타내므로, 한국어에서는 ‘행동을 보고’로 자연스럽게 풀어 관찰된 태도라는 점을 살렸습니다.
- source_word: τὴν ἠθισμένην ἀπάντησιν
  english_pob_choice: had assumed a harsher than usual manner
  chosen_korean: 평소보다 더 가혹한 태도를 취했음을
  alternatives_korean:
  - 평소보다 더 거친 만남의 태도를 취했음을
  - 평소와는 다른 더 엄한 응대를 보였음을
  - 평소보다 더 사나운 맞대응을 했음을
  lexicon: LSJ
  rationale: ἀπάντησις의 ‘만남/응대’ 뉘앙스를 살리되, 한국어에서는 직접적이고 읽기 쉬운 ‘태도’로 옮겨 Nicanor의 응대 방식이 더 거칠어졌다는 의미를 전달했습니다.
- source_word: οὐκ ἀπὸ τοῦ βελτίστου τὴν αὐστηρίαν εἶναι
  english_pob_choice: this severity did not come from the better course
  chosen_korean: 이 엄중함이 더 나은 길에서 나온 것이 아님을
  alternatives_korean:
  - 이 엄중함이 최선의 뜻에서 나온 것이 아님을
  - 이 엄중함이 좋은 의도에서 나온 것이 아님을
  - 이 엄중함이 더 나은 방침에서 비롯된 것이 아님을
  lexicon: LSJ
  rationale: οὐκ ἀπὸ τοῦ βελτίστου는 동기와 방침을 모두 열어 두는 관용 표현이므로, ‘더 나은 길’로 옮겨 동기의 선함과 정책의 적절성을 함께 암시했습니다.
- source_word: συνεκρύπτετο
  english_pob_choice: kept himself hidden
  chosen_korean: 몸을 숨겼습니다
  alternatives_korean:
  - 계속 숨었습니다
  - 자신을 숨겨 두었습니다
  - 니카노르에게서 숨었습니다
  lexicon: LSJ
  rationale: 미완료 시상의 지속성을 한국어에서 과도하게 늘리지 않으면서도, 반복적·지속적 은신의 뉘앙스를 자연스럽게 담기 위해 ‘몸을 숨겼습니다’로 옮겼습니다.
