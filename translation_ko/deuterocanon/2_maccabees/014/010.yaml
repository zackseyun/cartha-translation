translation:
  language: ko
  text: 유다[a]가 계속 살아 있는 한, 정세가 평화에 이르는 것은 불가능합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전승된 그리스어의 해당 표현은 본문상 난해합니다. 그러나 문맥상 유다가 계속 존재하는 한 평화가 불가능하다는 뜻입니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἰσχρὰ
  english_pob_choice: for as long as
  chosen_korean: 계속 살아 있는 한
  alternatives_korean:
  - 있는 동안
  - 남아 있는 동안
  - 계속 존재하는 한
  lexicon: LSJ
  rationale: 전승된 형태가 문맥상 시간적 조건을 나타내므로, 유다의 계속된 생존·존재가 평화의 성립을 막는다는 뜻을 한국어로 자연스럽게 드러냈습니다.
- source_word: περιὼν
  english_pob_choice: remains
  chosen_korean: 계속 살아 있는
  alternatives_korean:
  - 남아 있는
  - 존속하는
  - 계속 존재하는
  lexicon: LSJ
  rationale: περίειμι의 ‘살아 남다/남아 있다’는 뜻을 따라, 정치적 위협의 지속성을 함께 보이도록 옮겼습니다.
- source_word: τὰ πράγματα
  english_pob_choice: affairs
  chosen_korean: 사정
  alternatives_korean:
  - 정세
  - 일들
  - 상황
  lexicon: LSJ
  rationale: 정치적 사태를 가리키는 폭넓은 표현이므로, 문맥을 살리면서도 과도하게 특정하지 않는 ‘사정’이 적절합니다.
- source_word: τυχεῖν εἰρήνης
  english_pob_choice: to attain peace
  chosen_korean: 평화를 얻는 것
  alternatives_korean:
  - 평화에 이르는 것
  - 평화를 얻는 일
  - 평화를 성취하는 것
  lexicon: LSJ
  rationale: ‘평화에 이르다/얻다’의 도달 의미를 살리면서, 한국어 서술문 안에서 자연스럽게 들리도록 명사화했습니다.
theological_decisions:
- issue: 본문의 전승상 난해한 첫 구절 처리
  chosen_reading: 문맥이 요구하는 시간적 의미를 따라 ‘유다가 계속 살아 있는 한’으로 옮겼습니다.
  alternative_readings:
  - ‘유다가 남아 있는 동안’
  - ‘유다가 있는 한’
  rationale: 남아 있는 헬라어 형태가 단독으로는 불명료하지만, 영어 POB의 주석처럼 유다가 계속 존재하는 한 평화가 불가능하다는 뜻이 분명하므로, 그 문맥적 의미를 보존했습니다.
  doctrine_reference: textual criticism / contextual sense
