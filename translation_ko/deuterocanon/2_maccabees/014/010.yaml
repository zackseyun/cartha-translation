  - 남아 있는
  - 존속하는
  - 계속 존재하는
  lexicon: LSJ
  rationale: περίειμι의 ‘살아 남다/남아 있다’는 뜻을 따라, 정치적 위협의 지속성을 함께 보이도록 옮겼습니다.
- source_word: τὰ πράγματα
  english_pob_choice: affairs
  chosen_korean: 사정
  alternatives_korean:
  - 정세
  - 일들
  - 상황
  lexicon: LSJ
  rationale: 정치적 사태를 가리키는 폭넓은 표현이므로, 문맥을 살리면서도 과도하게 특정하지 않는 ‘사정’이 적절합니다.
- source_word: τυχεῖν εἰρήνης
  english_pob_choice: to attain peace
  chosen_korean: 평화를 얻는 것
  alternatives_korean:
  - 평화에 이르는 것
  - 평화를 얻는 일
  - 평화를 성취하는 것
  lexicon: LSJ
  rationale: ‘평화에 이르다/얻다’의 도달 의미를 살리면서, 한국어 서술문 안에서 자연스럽게 들리도록 명사화했습니다.
theological_decisions:
- issue: 본문의 전승상 난해한 첫 구절 처리
  chosen_reading: 문맥이 요구하는 시간적 의미를 따라 ‘유다가 계속 살아 있는 한’으로 옮겼습니다.
  alternative_readings:
  - ‘유다가 남아 있는 동안’
