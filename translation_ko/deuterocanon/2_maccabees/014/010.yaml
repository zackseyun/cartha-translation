  rationale: 남아 있는 헬라어 형태가 단독으로는 불명료하지만, 영어 POB의 주석처럼 유다가 계속 존재하는 한 평화가 불가능하다는 뜻이 분명하므로, 그 문맥적 의미를 보존했습니다.
  doctrine_reference: textual criticism / contextual sense
