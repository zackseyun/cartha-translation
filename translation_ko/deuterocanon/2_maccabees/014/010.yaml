  text: 유다[a]가 계속 살아 있는 한, 사정이 평화를 얻는 것은 불가능합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전승된 그리스어의 첫 구절은 본문상 난해하지만, 문맥의 뜻은 유다가 계속 존재하는 한 평화가 불가능하다는 것입니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἰσχρὰ
  english_pob_choice: for as long as
  chosen_korean: 계속 살아 있는 한
  alternatives_korean:
  - 있는 동안
  - 남아 있는 동안
  - 계속 존재하는 한
  lexicon: LSJ
  rationale: 전승된 형태가 문맥상 시간적 조건을 나타내므로, 유다의 계속된 생존·존재가 평화의 성립을 막는다는 뜻을 한국어로 자연스럽게 드러냈습니다.
- source_word: περιὼν
  english_pob_choice: remains
  chosen_korean: 계속 살아 있는
