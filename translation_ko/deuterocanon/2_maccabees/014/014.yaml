revisions:
- from: 그런데 유다에서 쫓겨난 자들 가운데서, 유다를 몰아낸 그들은 민족들 가운데서 떼지어 니카노르에게 몰려들었는데, 유다인들의 불행과 재난이 자기들의 번영이 될 것이라고 생각했습니다.[a]
  to: 그러나 유다를 유다 땅에서 몰아낸 자들은 이방 민족들을 떼지어 니카노르와 결탁하게 하였으며, 유다인들의 불행과 재난이 자기들의 번영이 될 것이라고 생각했습니다.[a]
  rationale: The revision restores the causative force of πεφυγαδευκότες with Judas as its object, removes the unsupported claim that the opponents were from among the nations, and supplies a Korean main reading that reflects the likely transitive sense of συνέμιγνυν while preserving the compressed relationship of ἔθνη and τῷ Νικάνορι in a footnote. The distinction between Judas and Judea is made explicit as “유다” and “유다 땅.”
  reviewer_model: gpt-5.6-terra
