base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/014.yaml
  text: But those in Judea who had driven Judas out kept flocking in droves to Nicanor from among the nations[a], thinking that the misfortunes and disasters of the Jews would become their own prosperity.
  footnotes:
  - marker: a
    text: Or 'kept joining Nicanor with the nations'; the Greek uses ἔθνη ('nations,' often 'Gentiles') with a compressed construction that can be understood in more than one way.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 유다에서 쫓겨난 자들 가운데서, 유다를 몰아낸 그들은 민족들 가운데서 떼지어 니카노르에게 몰려들었는데, 유다인들의 불행과 재난이 자기들의 번영이 될 것이라고 생각했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘민족들 가운데서 니카노르와 합류해 가고 있었다.’ 그리스어의 ἔθνη는 ‘민족들’ 또는 유대 문맥에서는 ‘이방인들’로도 읽힐 수 있으며, 압축된 구조 때문에 두 가지 이해가 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἐπὶ τῆς Ἰουδαίας πεφυγαδευκότες τὸν Ἰούδαν
  english_pob_choice: those in Judea who had driven Judas out
  chosen_korean: 유다에서 쫓겨난 자들 가운데서, 유다를 몰아낸 그들은
  alternatives_korean:
  - 유다에서 유다를 몰아낸 자들은
  - 유다를 유다에서 몰아낸 자들은
  - 유다를 쫓아낸 자들은
  lexicon: LSJ
  rationale: πεφυγαδευκότες는 단순한 ‘도망한’이 아니라 원인 제공이 있는 ‘쫓아내다/몰아내다’의 뜻이므로, 문맥에 맞게 유다를 몰아낸 주체로 살렸습니다.
- source_word: ἔθνη
  english_pob_choice: from among the nations
  chosen_korean: 민족들 가운데서
  alternatives_korean:
  - 열국 가운데서
  - 이방인들 가운데서
  - 민족들로부터
  lexicon: LSJ
  rationale: ἔθνη는 여기서 이방인 대비를 강하게 못 박기보다 ‘민족들/열국’의 넓은 의미를 가질 수 있어, 압축된 구조를 살려 ‘민족들 가운데서’로 옮겼습니다.
- source_word: συνέμιγνυν ἀγεληδόν
  english_pob_choice: kept flocking in droves
  chosen_korean: 떼지어 … 몰려들었는데
  alternatives_korean:
  - 무리 지어 … 섞여들었는데
  - 떼를 지어 … 어울렸는데
  - 군집하여 … 합류했는데
  lexicon: LSJ
  rationale: συνέμιγνυν은 ‘섞이다/합류하다’이고 ἀγεληδόν은 ‘떼로, 무리 지어’의 뉘앙스이므로, 비하적 군집감을 주는 한국어로 압축해 표현했습니다.
- source_word: τὰς ... ἀτυχίας καὶ συμφορὰς
  english_pob_choice: the misfortunes and disasters
  chosen_korean: 불행과 재난
  alternatives_korean:
  - 불운과 재난
  - 불행과 재앙
  - 불운과 화
  lexicon: LSJ
  rationale: ἀτυχία와 συμφορά의 이중 배열을 한국어에서 과도하게 중복하지 않으면서도 서로 다른 강도를 유지하기 위해 ‘불행과 재난’으로 옮겼습니다.
- source_word: ἰδίας εὐημερίας
  english_pob_choice: their own prosperity
  chosen_korean: 자기들의 번영
  alternatives_korean:
  - 자기들의 번성
  - 자기들의 성공
  - 자기들의 형통
  lexicon: LSJ
  rationale: εὐημερία는 단순한 성공보다 ‘번영/형통’에 가깝지만, 여기서는 타인의 불행을 자기 이익으로 삼는 냉혹한 대비가 핵심이므로 ‘자기들의 번영’이 가장 자연스럽습니다.
theological_decisions:
- issue: ἔθνη의 범주를 ‘이방인’으로 고정할지 여부
  chosen_reading: ‘민족들’로 두어 정치적·사회적 결속의 뉘앙스를 열어 둡니다.
  alternative_readings:
  - 이방인들
  - 열국
  - 민족들
  rationale: 본문의 초점은 유다 내부의 기회주의적 결탁이지, 반드시 유대인/이방인의 신학적 대비를 확정하는 데 있지 않으므로, 원문의 압축성을 유지했습니다.
  doctrine_reference: 원문 우선 번역; 문맥이 확정하지 않는 신학적 대비의 과잉해석을 피함
