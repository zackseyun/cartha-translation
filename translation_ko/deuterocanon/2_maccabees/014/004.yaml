  text: he came to King Demetrius in the one hundred fifty-first year, bringing him a gold crown and a palm branch, and besides these the customary offerings from the temple foliage; and on that day he kept quiet.
  footnotes:
  - marker: a
    text: Or 'the things customarily presented, namely foliage from the temple.' The Greek phrase is compressed and somewhat elliptical.
    reason: lexical_alternative
  - marker: b
    text: '''Kept quiet'' likely means he refrained from further action or accusation on that day.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 제151년에 왕 데메트리오스에게 와서, 금관과 종려 가지를 그에게 가져다 바쳤고, 이들과 더불어 성전의 푸른 가지와 관련된 관례적인 물품들도 바쳤습니다.[a] 그리고 그날에는 조용히 있었습니다.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성전의 푸른 가지와 관련된 관례적인 물품들’은 압축되고 다소 타원적인 그리스어 표현을 옮긴 것입니다. ‘관례적인 물품’의 정확한 성격과 성전의 푸른 가지와의 관계는 분명하지 않습니다.
    reason: source_note
  - marker: b
    text: ‘조용히 있었습니다’는 그날 더 이상의 행동이나 문제 제기를 하지 않았다는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
  - marker: c
    text: ‘제151년’은 셀레우코스 왕조 연대입니다. 통상 기원전 162/161년에 해당합니다.
    reason: historical_chronology
lexical_decisions:
- source_word: ἦλθεν πρὸς τὸν βασιλέα Δημήτριον
  english_pob_choice: he came to King Demetrius
  chosen_korean: 왕 데메트리오스에게 왔습니다
  alternatives_korean:
  - 데메트리오스 왕에게 왔습니다
  - 왕 데메트리오스 앞으로 나아왔습니다
  lexicon: LSJ
  rationale: πρός + 대격은 사람에게 ‘가다/오다’의 방향을 나타내므로, 자연스럽게 ‘~에게 왔다’로 옮겼습니다.
- source_word: ὡς πρώτῳ καὶ ἑκατοστῷ καὶ πεντηκοστῷ ἔτει
  english_pob_choice: in the one hundred fifty-first year
  chosen_korean: 기원전 151년에
  alternatives_korean:
  - 제151년에
  - 151년경에
  lexicon: LSJ
  rationale: 연대기적 표지로 읽어 한국어에서는 연도를 직접 제시하는 방식이 가장 분명하며, 본문의 역사적 맥락을 보존하기 위해 ‘기원전’을 보충했습니다.
- source_word: στέφανον χρυσοῦν καὶ φοίνικα
  english_pob_choice: a gold crown and a palm branch
  chosen_korean: 금관과 종려 가지
  alternatives_korean:
  - 황금 관과 종려 가지
  - 금으로 된 관과 종려 가지
  lexicon: LSJ
  rationale: στέφανος는 이 맥락에서 화관보다 ‘관’이 자연스럽고, χρυσοῦν은 관용적 한국어에서 ‘금관’으로 간명하게 옮길 수 있습니다. φοίνιξ는 의식적 표지로서 ‘종려 가지’가 적절합니다.
- source_word: τοῖς νομιζομένοις θαλλῶν τοῦ ἱεροῦ
  english_pob_choice: the customary offerings of the temple foliage
  chosen_korean: 성전의 푸른 가지들에서 나온 관례적인 예물
  alternatives_korean:
  - 성전에서 나온 관례적인 가지들
  - 성전의 가지로 드리는 관례적 예물
  lexicon: LSJ
  rationale: ellipsis가 있는 압축 구문이므로, ‘tois nomizomenois’의 관례성은 ‘관례적인 예물’로, θαλλῶν τοῦ ἱεροῦ는 성전과 연결된 식물성 재료로서 ‘성전의 푸른 가지들’로 살렸습니다.
- source_word: ἡσυχίαν ἔσχεν
  english_pob_choice: he kept quiet
  chosen_korean: 조용히 있었습니다
  alternatives_korean:
  - 침묵을 지켰습니다
  - 그날은 더 이상 움직이지 않았습니다
  lexicon: LSJ
  rationale: 관용구 ἡσυχίαν ἔχω는 ‘조용히 지내다/가만히 있다’의 뜻이므로, 문맥상 과도한 해석 없이 자연스럽게 옮겼습니다.
