  - 셀레우코스력 151년
  rationale: 2마카베오는 셀레우코스 연대 체계를 전제하므로, 단순 숫자만 두면 현대 독자가 오해할 수 있습니다. 다만 본문 자체의 연대 계산을 지우지 않기 위해 간결하게 표시했습니다.
  doctrine_reference: historical-chronological note
