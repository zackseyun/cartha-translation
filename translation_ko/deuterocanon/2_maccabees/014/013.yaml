review_pass:
  verdict: revise
  source_fidelity: 첫 Ἰούδᾳ는 뒤의 τὸν Ἰουδὰ(유다/Judas)와 형태는 같지만, 문맥상 명령을 받는 유다가 아니라 편지가 보내진 지역인 유대(Judea)를 가리킵니다. 현 번역은 이를 인명으로 처리하고 ‘그가’라는 지시어를 더하여 유다가 자신을 붙잡으라는 뜻처럼 읽히게 합니다. 또한 αὐτὸν μὲν τὸν Ἰουδὰ의 강조는 ‘유다 자신은’으로 자연스럽게 보존할 수 있습니다. ἐπανελέσθαι는 영어 POB의 ‘capture’를 따라 ‘붙잡다’로 옮기는 것이 안전합니다.
  naturalness: ‘유다 지방으로 편지를 보내어’는 문맥상 자연스럽고, 세 개의 부정사 명령을 ‘붙잡고, 흩어 버리며, 세우라고’로 병렬 처리해 현대 한국어 문장 흐름을 유지합니다. ‘그와 함께 있는 이들’보다 ‘그와 함께한 이들’이 해당 집단을 가리키는 문맥에 더 자연스럽습니다.
  terminology: 유대는 지역명으로, 유다는 인명으로 구별했습니다. ‘대제사장’과 ‘성전’은 ἀρχιερεύς 및 ἱερόν에 적절합니다. ‘가장 큰 성전’은 τοῦ μεγίστου ἱεροῦ의 최상급 표현을 보존합니다.
  issues:
  - severity: high
    issue: 첫 Ἰούδᾳ를 인명 ‘유다’로 처리하여 명령의 수신자처럼 번역함
    rationale: 같은 문장 안에서 τὸν Ἰουδὰ가 체포 대상인 유다를 명시하므로, 현 문장은 ‘유다에게 ... 그가 유다를 붙잡고’라는 자기지시적이고 문맥상 불가능한 뜻이 됩니다. 첫 용례는 문맥상 목적지인 유대입니다.
  - severity: medium
    issue: ‘그가 직접’이 원문의 강조 및 지시 관계를 부정확하게 처리함
    rationale: αὐτὸν μὲν은 유다 자신을 특별히 지목하는 목적어 강조입니다. ‘그가 직접’은 행위자의 직접성을 뜻하며 원문에 없는 주어를 도입합니다.
  revised_text: 유대 지방으로 편지를 보내어, 유다 자신은 붙잡고 그와 함께한 이들은 흩어 버리며 알키모스를 가장 큰 성전의 대제사장으로 세우라고 하였습니다.
