  text: 'to Judah with letters: that he should capture Judas himself, scatter those with him, and appoint Alcimus as high priest of the greatest temple.'
translation:
  language: ko
  text: 유다에게 보낸 편지에는, 그가 직접 유다를 붙잡고, 그와 함께 있는 이들을 흩어 버리며, 알키모스를 가장 큰 성전의 대제사장으로 세우라는 내용이 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστολάς
  english_pob_choice: with letters
  chosen_korean: 편지에는
  alternatives_korean:
  - 서한에는
  - 서신에는
  lexicon: ἐπιστολή
  rationale: 행정적·공적 문맥이지만, 현대 한국어에서는 ‘편지’가 가장 자연스럽고 본문의 문장 흐름도 잘 살립니다.
- source_word: ἐπανελέσθαι
  english_pob_choice: capture Judas himself
  chosen_korean: 유다를 직접 붙잡고
  alternatives_korean:
  - 유다를 붙잡고
  - 유다를 사로잡고
  - 유다 자신을 붙잡고
  lexicon: ἐπαναιρέομαι
  rationale: 공격·체포의 뉘앙스를 살리면서도 과도하게 군사화하지 않기 위해 ‘붙잡다’를 택했고, αὐτὸν μὲν을 반영해 ‘직접’으로 강조했습니다.
- source_word: σκορπίσαι
  english_pob_choice: scatter those with him
  chosen_korean: 그와 함께 있는 이들을 흩어 버리며
  alternatives_korean:
  - 그와 함께한 자들을 흩어 버리며
  - 그와 함께 있는 사람들을 흩뜨리며
  lexicon: σκορπίζω
  rationale: 사람들을 조직적으로 해산시키는 뜻을 자연스럽게 옮기기 위해 ‘흩어 버리다’를 사용했습니다.
- source_word: ἀρχιερέα τοῦ μεγίστου ἱεροῦ
  english_pob_choice: high priest of the greatest temple
  chosen_korean: 가장 큰 성전의 대제사장으로
  alternatives_korean:
  - 가장 큰 성전의 대사제로
  - 가장 큰 신전의 대제사장으로
  lexicon: ἀρχιερεύς / ἱερόν
  rationale: ἱερόν은 일반 종교 건물보다 성전이 적절하고, ἀρχιερεύς는 한국 교회 독자에게 익숙한 ‘대제사장’이 원문 위계와도 맞습니다.
theological_decisions:
- issue: political-religious appointment language
  chosen_reading: 알키모스를 가장 큰 성전의 대제사장으로 세우다
  alternative_readings:
  - 임명하다
  - 책봉하다
  rationale: 본문은 단순 직책 부여가 아니라 권력 개입의 성격을 띠므로, 공식적이면서도 조작적 뉘앙스를 담는 ‘세우다’를 택했습니다.
  doctrine_reference: 성전 직분과 권력 개입에 대한 본문의 역사 서술
- issue: αὐτὸν μὲν ... τοὺς δὲ ... 구조
  chosen_reading: 그가 직접 유다를 붙잡고, 그와 함께 있는 이들을 흩어 버리며
  alternative_readings:
  - 유다 자신을 붙잡고
  - 유다는 붙잡고
  rationale: 대조 구조를 살려 ‘그는… 이들은…’의 분배를 유지하고, αὐτὸν μὲν의 강조를 ‘직접’으로 반영했습니다.
  doctrine_reference: 수사적 대조와 강조의 보존
