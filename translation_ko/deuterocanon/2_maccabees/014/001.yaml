translation:
  language: ko
  text: 그런데 삼 년이 지난 뒤에, 유다 주위에 있던 이들에게 데메드리오가 셀레우코스의 아들인 데메드리오가 트리폴리스의 항구로 강한 군대와 함대를 거느리고 들어왔다는 소식이 전해졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘유다 주변 사람들에게 떨어졌다’이며, 여기서는 ‘소식이 전해졌다’는 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τριετῆ χρόνον
  english_pob_choice: But after three years
  chosen_korean: 그런데 삼 년이 지난 뒤에
  alternatives_korean:
  - 그리고 삼 년 뒤에
  - 그런데 삼 년 후에
  lexicon: LSJ
  rationale: μετά + 대격은 시간 경과 뒤를 나타내므로 ‘지난 뒤에’로 옮기고, δέ는 앞뒤를 잇는 약한 전환으로 ‘그런데’가 자연스럽습니다.
- source_word: προσέπεσεν τοῖς περὶ τὸν Ἰούδαν
  english_pob_choice: word came to those around Judas
  chosen_korean: 유다 주위에 있던 이들에게 … 소식이 전해졌습니다
  alternatives_korean:
  - 유다 주변에 있던 이들에게 … 소식이 닿았습니다
  - 유다와 함께 있던 이들에게 … 소식이 전해졌습니다
  lexicon: LSJ
  rationale: προσπίπτω가 정보에 대해 쓰일 때는 ‘닿다/전해지다’의 관용적 의미이므로, 직역보다 ‘소식이 전해졌습니다’로 옮겨 의미를 살렸습니다.
- source_word: Δημήτριον τὸν τοῦ Σελεύκου
  english_pob_choice: Demetrius son of Seleucus
  chosen_korean: 데메드리오가 셀레우코스의 아들인 데메드리오가
  alternatives_korean:
  - 데메트리오스, 셀레우코스의 아들
  - 셀레우코스의 아들 데메드리오가
  lexicon: LSJ
  rationale: 인명은 현대 외래어 표기법을 따랐고, τοῦ + 속격의 친자 관계를 ‘아들’로 분명히 했습니다. 본문 흐름상 주어를 다시 받는 구조를 그대로 드러냈습니다.
- source_word: διὰ τοῦ κατὰ Τρίπολιν λιμένος εἰσπλεύσαντα
  english_pob_choice: had sailed into the harbor at Tripolis
  chosen_korean: 트리폴리스의 항구로 … 들어왔다는
  alternatives_korean:
  - 트리폴리스 항구를 통해 들어왔다는
  - 트리폴리스 항구에 배를 대고 들어왔다는
  lexicon: LSJ
  rationale: διὰ + 속격은 ‘~을 통해/경유하여’의 뜻이어서 ‘항구로 … 들어왔다’보다 ‘항구를 통해’가 더 가깝지만, 한국어 문맥에서는 ‘들어왔다’에 포함시켜 자연스럽게 처리했습니다.
- source_word: μετὰ πλήθους ἰσχυροῦ καὶ στόλου
  english_pob_choice: with a strong force and a fleet
  chosen_korean: 강한 군대와 함대를 거느리고
  alternatives_korean:
  - 강한 병력과 함대를 거느리고
  - 막강한 군세와 함대를 거느리고
  lexicon: LSJ
  rationale: πλῆθος ἰσχυρόν은 군사적 문맥에서 ‘군대/병력’이 자연스럽고, στόλος는 ‘함대’이므로 두 요소를 모두 유지했습니다.
theological_decisions:
- issue: 공식 보고를 뜻하는 동사의 관용적 처리
  chosen_reading: ‘소식이 전해졌습니다’로 옮겨 사건 보고의 도착을 자연스럽게 드러냈습니다.
  alternative_readings:
  - ‘말씀이 떨어졌습니다’
  - ‘그들에게 떨어졌습니다’
  rationale: 본문의 προσέπεσεν은 문자적 ‘떨어졌다’보다 정보가 전달되었다는 의미가 핵심이므로, 한국어에서도 관용 의미를 살리는 것이 본문 의도에 더 충실합니다.
  doctrine_reference: 문맥적 의미 우선 원칙
