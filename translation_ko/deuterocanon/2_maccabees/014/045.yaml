translation:
  language: ko
  text: 그런데 그는 아직 숨을 쉬고 있었고 분노에 불타 있었으며[a], 일어나 피가 샘물처럼 솟구치듯 쏟아지고 상처가 몹시 심한데도 달려 군중 사이를 지나, 가파른 바위 위에 섰습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘분노로 달아올라 있었다’. πεπυρωμένος는 문자적으로 ‘불에 달아오른, 불붙은’을 뜻하며, τοῖς θυμοῖς는 여기서 격렬한 분노를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘벼랑처럼 가파르거나 돌출한 바위’. 마지막 형용사는 바위가 가파르거나 불쑥 내민 지형임을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι δὲ ἔμπνους ὑπάρχων
  english_pob_choice: Yet still breathing
