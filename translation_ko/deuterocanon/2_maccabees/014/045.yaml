translation:
  language: ko
  text: 그는 아직 숨을 쉬고 있었고 분노로 달아올라 있었으며[a], 일어나서 자기 피가 줄줄 흘러나오고 상처도 심했는데, 달려서 군중 사이를 지나 거친 바위 위에 섰습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 영이 불타오르고 있었다’; πεπυρωμένος는 문자적으로 ‘불에 달아오른’ 상태를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘가파른/돌출한 바위’; 마지막 형용사는 바위가 험하고 솟은 모양을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι δὲ ἔμπνους ὑπάρχων
  english_pob_choice: Yet still breathing
  chosen_korean: 아직 숨을 쉬고 있었고
  alternatives_korean:
  - 아직 살아 있었고
  - 아직 숨결이 남아 있었고
  lexicon: LSJ
  rationale: ἔμπνους는 문자적으로 ‘숨이 있는, 살아 있는’의 뜻이므로, 생명 유지의 생생한 감각을 살려 ‘아직 숨을 쉬고 있었고’로 옮겼습니다.
- source_word: πεπυρωμένος τοῖς θυμοῖς
  english_pob_choice: burning with rage
  chosen_korean: 분노로 달아올라 있었으며
  alternatives_korean:
  - 분노에 불타 있었으며
  - 격정으로 달아올라 있었으며
  lexicon: LSJ
  rationale: πεπυρωμένος는 ‘불붙은, 달궈진’의 이미지이고 θυμοί는 여기서 감정적 격분을 가리키므로, 과도한 해석 없이 격렬한 분노의 상태를 자연스럽게 살렸습니다.
- source_word: δρόμῳ τοὺς ὄχλους διελθών
  english_pob_choice: running through the crowds
  chosen_korean: 달려서 군중 사이를 지나
  alternatives_korean:
  - 뛰어 군중 사이를 지나
  - 달음박질로 군중을 지나
  lexicon: LSJ
  rationale: δρόμῳ는 ‘달려서, 달음박질로’의 방식 부사격이므로 ‘달려서’로, ὄχλοι의 복수를 살려 ‘군중 사이’를 택했습니다.
- source_word: στὰς ἐπί τινος πέτρας ἀπορρώγος
  english_pob_choice: stood upon a steep rock
  chosen_korean: 거친 바위 위에 섰습니다
  alternatives_korean:
  - 가파른 바위 위에 섰습니다
  - 솟아난 바위 위에 섰습니다
  lexicon: LSJ
  rationale: ἀπορρώγος는 바위가 험하고 가파르거나 돌출한 상태를 가리키므로, 과잉 특정 없이 ‘거친 바위’로 넓게 살려 독자가 지형의 위험성을 느끼게 했습니다.
