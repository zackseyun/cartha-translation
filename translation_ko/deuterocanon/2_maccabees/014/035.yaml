  yaml_path: translation/deuterocanon/2_maccabees/014/035.yaml
  text: You[a], O Lord, though needing nothing from anyone[b], were pleased for a temple of your dwelling to come into being among us.
  footnotes:
  - marker: a
    text: Or 'in us.' The Greek ἐν ἡμῖν can be rendered either way, but in this temple context the communal sense 'among us' is more likely.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'being without need of all things,' that is, needing nothing from anything or anyone.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 아무것도 필요로 하지 않으시면서도[b] 우리 가운데[a] 당신께서 거하실 성전이 있게 되기를 기뻐하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리 안에’. 그리스어 ἐν ἡμῖν은 이렇게도 옮길 수 있지만, 이 성전 문맥에서는 공동체적 의미인 ‘우리 가운데’가 더 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘모든 것에 대해 필요가 없으신 분’입니다. 어떤 것에도 의지하지 않으시고 아무것도 필요로 하지 않으신다는 뜻입니다.
    reason: lexical_alternative
