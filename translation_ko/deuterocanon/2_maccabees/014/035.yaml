  lexicon: LSJ
  rationale: σκηνώσις의 거주/거처 의미를 살리되, ‘장막’처럼 과도하게 특정하지 않도록 ‘거처’를 택했습니다. 속격 관계는 ‘거처의 성전’으로 반영했습니다.
- source_word: ἐν ἡμῖν
  english_pob_choice: among us
  chosen_korean: 우리 가운데
  alternatives_korean:
