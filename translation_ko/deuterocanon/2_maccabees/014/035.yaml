base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/035.yaml
  text: You[a], O Lord, though needing nothing from anyone[b], were pleased for a temple of your dwelling to come into being among us.
  footnotes:
  - marker: a
    text: Or 'in us.' The Greek ἐν ἡμῖν can be rendered either way, but in this temple context the communal sense 'among us' is more likely.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'being without need of all things,' that is, needing nothing from anything or anyone.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 모든 것에 아무것도 필요치 않으시면서도, 우리 가운데 당신의 거처의 성전이 생기게 하시기를 기뻐하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리 안에’. 그리스어 ἐν ἡμῖν은 이렇게도 옮길 수 있지만, 이 성전 문맥에서는 공동체적 의미인 ‘우리 가운데’가 더 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘모든 것에 대해/모든 것에서 필요 없음’입니다. 의미는 어떤 것에도 의지하거나 무엇도 필요로 하지 않으시는 상태입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  english_pob_choice: O Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주여
  - 주
  lexicon: 주석적 호칭 일반
  rationale: 2인칭 직접 호칭으로서 기도문 어조를 살리기 위해 ‘주님’을 택했습니다. 한국어 합쇼체 본문과도 자연스럽게 어울립니다.
- source_word: ἀπροσδεὴς τῶν ὅλων
  english_pob_choice: though needing nothing from anyone
  chosen_korean: 모든 것에 아무것도 필요치 않으시면서도
  alternatives_korean:
  - 아무것도 필요하지 않으시면서도
  - 아무것에도 의존하지 않으시면서도
  - 모든 것에서 필요함이 없으시면서도
  lexicon: LSJ
  rationale: ἀπροσδεής의 ‘필요가 없음’과 τῶν ὅλων의 포괄성을 함께 살리기 위해 직역보다 자연스러운 ‘모든 것에 아무것도 필요치 않으시면서도’를 선택했습니다.
- source_word: ναὸν
  english_pob_choice: a temple
  chosen_korean: 성전
  alternatives_korean:
  - 성소
  - 전
  lexicon: LSJ
  rationale: 문맥이 하나님의 거처를 가리키므로 한국어 성서어휘상 가장 직접적인 ‘성전’이 적절합니다.
- source_word: τῆς σῆς σκηνώσεως
  english_pob_choice: of your dwelling
  chosen_korean: 당신의 거처의
  alternatives_korean:
  - 당신의 거하심의
  - 당신의 거처에 속한
  - 당신의 장막 거처의
  lexicon: LSJ
  rationale: σκηνώσις의 거주/거처 의미를 살리되, ‘장막’처럼 과도하게 특정하지 않도록 ‘거처’를 택했습니다. 속격 관계는 ‘거처의 성전’으로 반영했습니다.
- source_word: ἐν ἡμῖν
  english_pob_choice: among us
  chosen_korean: 우리 가운데
  alternatives_korean:
  - 우리 안에
  - 우리 속에
  lexicon: LSJ
  rationale: 성전과 공동체 문맥에서 ἐν ἡμῖν의 공동체적 공간 의미를 살려 ‘우리 가운데’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 자족성과 성전의 은혜로운 수용
  chosen_reading: 아무것도 필요치 않으시면서도 성전이 생기게 하시기를 기뻐하셨습니다
  alternative_readings:
  - 아무것도 필요하지 않으시면서도
  - 아무것에도 의존하지 않으시면서도
  rationale: 하나님이 성전이 필요해서가 아니라 은혜로 그것을 기뻐하셨다는 긴장을 유지하기 위해 자족성과 기쁨을 함께 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
- issue: ἐν ἡμῖν의 공동체적 의미
  chosen_reading: 우리 가운데
  alternative_readings:
  - 우리 안에
  - 우리 속에
  rationale: 성전 문맥에서는 내면화보다 공동체 가운데 거하심이 더 직접적이므로, 개인 내면화로 오해될 수 있는 번역은 피했습니다.
  doctrine_reference: 'DOCTRINE.md: Original-language primacy over translation tradition; preserve theological tension where ambiguity remains.'
