  - 전
  lexicon: LSJ
  rationale: 문맥이 하나님의 거처를 가리키므로 한국어 성서어휘상 가장 직접적인 ‘성전’이 적절합니다.
- source_word: τῆς σῆς σκηνώσεως
  english_pob_choice: of your dwelling
  chosen_korean: 당신의 거처의
  alternatives_korean:
