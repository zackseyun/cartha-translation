  yaml_path: translation/deuterocanon/2_maccabees/014/024.yaml
  text: And he kept Judas continually before him[b][a]; he was inwardly drawn to the man.
  footnotes:
  - marker: a
    text: Or 'he had Judas always in his presence.' The Greek idiom can refer either to keeping someone physically near or keeping him constantly before one's attention.
    reason: lexical_alternative
  - marker: b
    text: Or 'he was inwardly inclined toward the man' or 'he felt deep affection for the man.' The Greek adverb and verb together express an internal, settled favor.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 늘 유다를 자기 앞에 두었습니다[a]. 그는 마음속으로 그 사람에게 끌렸습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 관용구는 유다를 실제로 곁에 두었다는 뜻일 수도 있고, 늘 의식의 앞에 두었다는 뜻일 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 부사는 ‘내적으로’ 또는 ‘마음 깊이’라는 뜻에 가깝습니다. 여기서는 한국어로 자연스럽게 ‘마음속으로’ 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶχεν ... ἐν προσώπῳ
  english_pob_choice: kept ... before him
  chosen_korean: 자기 앞에 두었습니다
  alternatives_korean:
  - 계속 자기 앞에 두었습니다
  - 자기 앞에 늘 두었습니다
  - 자기 앞에 두고 있었습니다
  lexicon: LSJ
  rationale: ἐν προσώπῳ는 문자적으로 ‘얼굴/앞’의 뜻이 있어, 한국어에서는 ‘자기 앞에 두다’로 옮기면 물리적 근접성과 지속적 의식의 두 가능성을 함께 살릴 수 있습니다.
- source_word: διὰ παντός
  english_pob_choice: continually
  chosen_korean: 늘
  alternatives_korean:
  - 항상
  - 끊임없이
  - 언제나
  lexicon: LSJ
  rationale: 지속성의 의미를 자연스러운 현대 한국어로 전달하면서, 과도하게 절대적인 느낌은 피하기 위해 ‘늘’을 택했습니다.
- source_word: ψυχικῶς
  english_pob_choice: inwardly
  chosen_korean: 마음속으로
  alternatives_korean:
  - 영혼으로
  - 속으로
  - 내면으로
  lexicon: LSJ
  rationale: ψυχικῶς는 ψυχή에서 나온 부사로 내적 성향을 가리키므로, ‘마음속으로’로 옮겨 심리적·내적 방향성을 살렸습니다.
- source_word: προσεκέκλιτο
  english_pob_choice: was drawn toward
  chosen_korean: 끌렸습니다
  alternatives_korean:
  - 기울었습니다
  - 마음을 두었습니다
  - 호의를 느꼈습니다
  lexicon: LSJ
  rationale: 완료형이 암시하는 안정된 성향을 반영해, 단순한 순간 감정이 아니라 지속적인 내적 끌림을 나타내는 ‘끌렸습니다’를 선택했습니다.
theological_decisions:
- issue: 유다를 ‘자기 앞에 두었다’는 표현의 이중 가능성
  chosen_reading: 유다를 실제로 곁에 두었거나, 늘 의식의 앞에 두었다는 뜻을 함께 살렸습니다.
  alternative_readings:
  - 유다를 자기 곁에 두었습니다
  - 유다를 늘 마음에 두었습니다
  rationale: 그리스어 관용구 ἐν προσώπῳ는 물리적 근접과 주의의 지속을 모두 허용하므로, 한국어 본문은 모호성을 지우지 않고 유지하는 방향이 원문에 더 충실합니다.
  doctrine_reference: source syntax and idiom
