    rationale: 제공된 그리스어는 ‘적대자들의 갑작스러운 말 못함’이라는 문맥상 난해한 표현입니다. 이를 협상 상대의 침묵으로 풀이하거나 시몬이 ‘균형을 잃었다’고 확정하는 것은 원문 이상의 해석입니다.
  revised_text: 그러나 유다의 형제 시몬은 니카노르와 맞붙었으나[a], 적대자들이 갑자기 말을 하지 못하게 된 일 때문에 더디게 밀렸습니다[b][c].
