translation:
  language: ko
  text: 그러나 유다의 형제 시몬은 느고라와 합의한 상태에 있었으나[a], 상대편이 갑자기 말문이 막힌 탓에 주춤하여 실패했습니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘느고라와 협정을 맺은 상태에 있었다’. 그리스어는 합의 또는 약정을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘천천히’이지만, 여기서는 단순한 속도보다 망설임이나 주춤함을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘상대편이 갑자기 말문이 막힌 탓에 주춤하여 실패했다’는 구절은 어려운 그리스어로, 상대편의 갑작스러운 침묵 또는 발화 불능 때문에 시몬이 균형을 잃었다는 뜻으로 보입니다.
    reason: lexical_alternative
