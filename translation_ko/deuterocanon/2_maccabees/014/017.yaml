  lexicon: LSJ
  rationale: 직역적 ‘넘어짐’ 이미지를 살리되 문맥상 군사적/협상적 좌절을 뜻하므로, 독자가 이해하기 쉬운 ‘실패했습니다’로 옮기고 앞의 ‘주춤하여’로 동적 함의를 보완했습니다.
- source_word: ἀφασίαν
  english_pob_choice: speechlessness
  chosen_korean: 말문이 막힌
  alternatives_korean:
  - 침묵
  - 말할 수 없게 된
  - 벙어리가 된
  lexicon: LSJ
  rationale: 희귀한 명사 ἀφασίαν의 ‘말 못함/말문 막힘’이라는 강한 표현을 살려, 상대편의 갑작스러운 발화 불능을 직접적으로 드러냈습니다.
theological_decisions:
- issue: 원문의 협상/대치가 군사적 충돌보다 ‘합의 상태’와 ‘주춤함’으로 제시되는 점
  chosen_reading: 본문은 전투의 승패를 단정하기보다, 상대편의 갑작스러운 말문 막힘 때문에 시몬의 협상 국면이 흔들린 것으로 읽었습니다.
  alternative_readings:
  - ‘느고라와 싸웠으나’로 더 전투적으로 읽는 방식
  - ‘합의에 이르렀으나’로 결과를 단정하는 방식
  rationale: συμβεβληκὼς ἦν과 βραδέως, ἐπταικώς의 결합은 단순 승패보다 협상적/상황적 균열을 암시하므로, 서술의 긴장을 보존하는 쪽을 택했습니다.
  doctrine_reference: 본문 문맥 보존 원칙
