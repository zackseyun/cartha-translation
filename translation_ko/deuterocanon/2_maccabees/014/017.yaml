  lexicon: LSJ
  rationale: 이 부사는 단순한 속도보다 뒤이은 실패의 양상에 대한 망설임·주춤함을 드러내므로, 합의 자체보다 결과적 태도를 보이는 한국어로 처리했습니다.
- source_word: ἐπταικώς
