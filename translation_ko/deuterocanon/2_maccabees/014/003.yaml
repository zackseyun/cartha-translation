  text: 그러나 이전에 대제사장이었던 어떤 알키모스는[a] 분리의 때에 자원하여 자신을 더럽혔으며, 자신에게는 어떤 방법으로도 안전이 없고 더 이상 거룩한 제단에 나아갈 수도 없음을 깨달았습니다.
