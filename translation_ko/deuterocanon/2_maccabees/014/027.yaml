    reason: lexical_alternative
  - marker: b
    text: Literally 'to send Maccabeus bound' or 'as a prisoner.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 왕은 격분했고, 그 지극히 악한 자의 비방에 자극을 받아 니카노르에게 편지를 써서, 그 조약을 매우 못마땅하게 여긴다고 말하며 마카베오를 포로로 하여 지체 없이 안티오키아로 보내라고 명령했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘협정’이나 ‘평화 조건’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘마카베오를 묶인 채 보내라’이며, ‘포로로 보내라’로도 옮길 수 있습니다.
    reason: lexical_alternative
