  yaml_path: translation/deuterocanon/2_maccabees/014/027.yaml
  text: But the king became enraged[a], and, provoked by the slanders of that utterly wicked man, wrote to Nikanor[b], saying that he took the treaty very badly and ordering him to send Maccabeus to Antioch as a prisoner at once.
  footnotes:
  - marker: a
    text: Or 'agreements' or 'terms of peace' for 'treaty' (συνθηκῶν).
    reason: lexical_alternative
  - marker: b
    text: Literally 'to send Maccabeus bound' or 'as a prisoner.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 왕은 격분하여, 그 극도로 악한 자의 비방에 자극을 받아, 니카노르에게 편지를 보내어 조약에 관해서는 자신이 매우 불쾌해한다고 말하고, 마카베오를 속히 안티오키아로 포승줄에 묶인 채 보내라고 명했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘합의들’이나 ‘평화 조건들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘마카베오를 묶인 채 보내라’ 또는 ‘포로로 보내라’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθυμος γενόμενος
  english_pob_choice: became enraged
  chosen_korean: 격분하여
  alternatives_korean:
  - 화가 나서
  - 분노하여
  lexicon: LSJ
  rationale: 왕의 즉각적이고 강한 감정 변화를 드러내기 위해 단순한 ‘화가 나서’보다 강한 ‘격분하여’를 택했습니다.
- source_word: πανπονήρου
  english_pob_choice: that utterly wicked man
  chosen_korean: 그 극도로 악한 자
  alternatives_korean:
  - 그 매우 악한 자
  - 그 완전히 사악한 자
  lexicon: LSJ
  rationale: παν-의 강조를 살려 강한 도덕적 평가를 유지하되, 한국어에서 자연스러운 표현으로 옮겼습니다.
- source_word: συνθηκῶν
  english_pob_choice: treaty
  chosen_korean: 조약
  alternatives_korean:
  - 협정
  - 합의
  - 평화 조건
  lexicon: LSJ
  rationale: 정치·외교적 맥락에서 formal agreement를 뜻하므로 ‘조약’이 가장 간결하고 정확합니다.
- source_word: δέσμιον
  english_pob_choice: as a prisoner
  chosen_korean: 포승줄에 묶인 채
  alternatives_korean:
  - 포로로
  - 죄수로
  - 붙잡힌 채
  lexicon: LSJ
  rationale: δέσμιον의 ‘묶인/속박된’ 뉘앙스를 살리기 위해 단순한 ‘포로’보다 구체적인 속박 상태를 드러냈습니다.
theological_decisions:
- issue: 왕의 감정과 비방의 인과를 어떻게 드러낼지
  chosen_reading: 왕이 격분했고, 비방에 자극을 받아 행동을 명령한 것으로 직설적으로 옮겼습니다.
  alternative_readings:
  - 왕이 분노했고…
  - 왕이 화를 냈고…
  rationale: 본문은 정치적 결정을 감정과 비방의 직접 결과로 제시하므로, 인과 관계가 약해지지 않도록 유지했습니다.
  doctrine_reference: 본문 서사 구조 보존
