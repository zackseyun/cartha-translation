    text: That is, to exchange right hands as a pledge of good faith or agreement.
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 그는 포시도니오스와 테오도토스와 맛다티아스를 보내어 서로 오른손을 맞잡도록 하였습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 고대에는 서로 오른손을 맞잡는 것으로 신의와 합의를 확증하였습니다.
    reason: cultural_note
lexical_decisions:
- source_word: διόπερ
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이에
  - 따라서
  - 그러니까
  lexicon: LSJ
  rationale: 앞선 정황에 대한 결론을 이끄는 접속어이므로, 현대 한국어에서 자연스럽고 격식 있는 ‘그러므로’로 옮겼습니다.
- source_word: ἔπεμψεν
  english_pob_choice: he sent
  chosen_korean: 보내어
  alternatives_korean:
  - 보냈습니다
  - 파견하여
  - 보내셨습니다
  lexicon: LSJ
  rationale: 서사체의 연속 동작을 살리기 위해 ‘보내어’로 처리했고, 주어는 문맥상 자연스럽게 ‘그는’으로 받았습니다.
- source_word: δοῦναι καὶ λαβεῖν δεξιάς
  english_pob_choice: to give and receive pledges
  chosen_korean: 오른손을 주고받게 하였습니다
  alternatives_korean:
  - 오른손을 주고받게 하였습니다
  - 화해의 손을 맞잡게 하였습니다
  - 서약을 주고받게 하였습니다
  lexicon: LSJ
  rationale: 직역하면 ‘오른손들/오른손’을 주고받는다는 뜻이므로, 본문 이미지와 관용적 의미를 함께 살려 ‘오른손을 주고받게 하였습니다’로 옮겼습니다.
- source_word: δεξιάς
  english_pob_choice: right hands
  chosen_korean: 오른손
  alternatives_korean:
  - 오른손들
  - 서약의 오른손
  - 악수
  lexicon: LSJ
  rationale: 신체 부위 자체를 가리키는 직역을 유지하되, 본문 각주에서 이것이 신의나 합의의 표시라는 점을 풀어 설명합니다.
theological_decisions:
- issue: δεξιάς의 관용적 의미를 본문과 각주 사이에서 어떻게 처리할지
  chosen_reading: 본문은 ‘오른손을 주고받게 하였습니다’로 투명하게 두고, 각주에서 이것이 약속과 합의의 표시임을 밝혔습니다.
  alternative_readings:
  - 본문에 ‘서약을 맺게 하였습니다’처럼 의미 번역으로 대체
  - 본문에 ‘악수하게 하였습니다’로 현대 관용어 사용
  rationale: 원문은 손의 교환이라는 구체적 행위를 말하므로, 의미를 완전히 추상화하지 않고 본문에 보존하는 편이 원문 가시성과 감사 가능성을 높입니다.
  doctrine_reference: 본문의 문화적 제스처를 보존하는 번역 원칙
- issue: 인명 음역을 한국어 관습과 원형 사이에서 어떻게 처리할지
  chosen_reading: 포시도니오스, 테오도토스, 맛다티아스로 음역했습니다.
  alternative_readings:
  - 포시도니우스, 테오도토스, 마타티아
  - 기존 교회식 음역
  rationale: 고유명사는 현대 외래어 표기 관행에 맞추되, 이미 널리 알려진 성경식 이름만 예외로 두는 원칙에 따랐습니다.
  doctrine_reference: 고유명사 표기 원칙
