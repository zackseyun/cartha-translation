  text: And he immediately selected Nikanor[a], who had become commander of the elephants, and appointed him general over Judea, and sent him out.
  footnotes:
  - marker: a
    text: Or 'general of Judea' or 'military governor of Judea'; the Greek title στρατηγός can denote either a military commander or a regional governing official, and the context likely includes both functions.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 즉시 코끼리 부대의 지휘관이 되었던 니카노르를 뽑아, 그를 유대를 맡은 장군으로 임명하고 파견했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유대의 장군’ 또는 ‘유대의 군사 총독’. 그리스어 στρατηγός는 군 지휘관을 뜻하며, 지역명과 함께 쓰일 때에는 지역의 행정·군사 책임자를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προχειρισάμενος
  english_pob_choice: selected
  chosen_korean: 선택하여
  alternatives_korean:
  - 임명하여
  - 지명하여
  - 택하여
  lexicon: LSJ
  rationale: 앞선 분사로서 먼저 뽑아 세우는 동작을 나타내므로 ‘선택하여’가 자연스럽고, 뒤의 ἀναδείξας ‘임명하고’와도 구별됩니다.
- source_word: τὸν γενόμενον ἐλεφαντάρχην
  english_pob_choice: who had become commander of the elephants
  chosen_korean: 곧 코끼리 부대의 지휘관이 된 사람을
  alternatives_korean:
  - 코끼리 지휘관이 된 사람을
  - 코끼리 군단의 지휘관이 된 사람을
  - 코끼리 부대의 사령관이 된 사람을
  lexicon: LSJ
  rationale: ἐλεφαντάρχης는 전투용 코끼리 부대의 장교를 가리키므로, 군사적 직함을 살리면서도 한국어로는 ‘코끼리 부대의 지휘관’이 가장 분명합니다.
- source_word: στρατηγὸν τῆς Ἰουδαίας
  english_pob_choice: general over Judea
  chosen_korean: 유대의 총독으로
  alternatives_korean:
  - 유대의 장군으로
  - 유대의 군사 총독으로
  - 유대의 총독 겸 장군으로
  lexicon: LSJ
  rationale: στρατηγός는 여기서 단순한 장군보다 지역을 맡는 공적 직책을 가리킬 수 있으므로, 문맥상의 행정·군사적 기능을 함께 살려 ‘총독’으로 옮겼습니다.
- source_word: ἐξαπέστειλεν
  english_pob_choice: sent him out
  chosen_korean: 그를 파견했습니다
  alternatives_korean:
  - 그를 보냈습니다
  - 그를 내보냈습니다
  - 그를 파견하여 보냈습니다
  lexicon: LSJ
  rationale: 복합동사에는 단순한 ‘보내다’보다 공적으로 내보내는 뉘앙스가 있어 ‘파견했습니다’가 적절합니다.
theological_decisions:
- issue: στρατηγός를 행정직과 군사직 중 어떻게 반영할지
  chosen_reading: ‘총독’으로 번역해 지역 통치와 군사 지휘의 이중 기능을 함께 암시했습니다.
  alternative_readings:
  - ‘장군’으로만 번역
  - ‘군사 총독’으로 직역
  rationale: 본문은 유대라는 영역을 지배하는 임명을 말하므로, 한국어 독자에게는 단순 군직보다 지역 통치권이 드러나는 표현이 더 정확합니다.
  doctrine_reference: 역사 서술의 직함 번역 원칙
- issue: 니카노르의 고유명 표기
  chosen_reading: ‘니카노르’로 음역했습니다.
  alternative_readings:
  - ‘나카노르’
  - ‘니칸노르’
  rationale: 한국어 성서에서 널리 통용되는 고유명 표기를 우선하되, 원음에 가까운 현대 표기를 유지했습니다.
  doctrine_reference: 고유명사 표기 원칙
