  - 따로
  lexicon: LSJ
  rationale: 공개 석상이 아닌 은밀한 만남의 성격을 드러내는 표현으로, 문맥상 ‘비밀리에’가 가장 자연스럽습니다.
- source_word: δίφραξ
  english_pob_choice: sedan chair
  chosen_korean: 가마
  alternatives_korean:
  - 들것
  - 이동식 의자
  lexicon: LSJ
  rationale: 희귀어로서 정확한 형태는 불확실하지만, 사람이 메고 나르는 이동식 의자라는 점을 살려 한국어의 비교적 자연스러운 대응인 ‘가마’를 택했습니다.
- source_word: ἔθεσαν δίφρους
  english_pob_choice: seats were set out
  chosen_korean: 자리들이 마련되었습니다
  alternatives_korean:
  - 의자들이 놓였습니다
  - 좌석이 준비되었습니다
  lexicon: LSJ
  rationale: δίφρος는 자리나 의자를 뜻할 수 있으므로, 대상의 정확한 형태를 과도하게 특정하지 않는 ‘자리들’로 옮겼습니다.
