review_pass:
  verdict: revise
  source_fidelity: ‘비밀리에’는 κατʼ ἰδίαν의 ‘따로, 사적으로’보다 은밀함을 더 강하게 암시합니다. 또한 ‘각자 편에서’는 한국어로 부자연스럽고, παρʼ ἑκάστου가 가리키는 양 당사자를 ‘각 편’ 또는 ‘양쪽’으로 나타내는 편이 적절합니다. ἔθεσαν은 능동 복수이므로 ‘자리들이 마련되었습니다’보다 ‘의자들을 놓았습니다’가 원문의 행위를 더 직접적으로 반영합니다.
  naturalness: ‘따로 만나기로’와 ‘각 편에서 가마가 하나씩 나왔으며’는 현대 표준 한국어의 자연스러운 서술입니다. ‘의자들을 놓았습니다’는 διφρους의 복수성과 배치 행위를 분명히 하면서도 문맥에 맞습니다.
  terminology: δίφραξ의 정확한 물건은 불확실하므로 본문에서는 ‘가마’를 유지하되 각주에서 들것 또는 유사한 이동식 좌석일 가능성을 밝혔습니다. δίφρους는 일반적인 ‘의자들’로 옮겼습니다. 특별한 신학 용어는 없습니다.
