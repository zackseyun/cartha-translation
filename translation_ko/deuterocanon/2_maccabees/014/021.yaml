  text: So they set a day on which they would come together privately; and from each side a sedan chair was brought forward[a], and seats were set out.
  footnotes:
  - marker: a
    text: Greek δίφραξ is rare here and may denote a litter, sedan chair, or similar portable seat; the exact form of the conveyance is uncertain.
