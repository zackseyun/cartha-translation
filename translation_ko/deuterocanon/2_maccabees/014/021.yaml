translation:
  language: ko
  text: 그들은 비밀리에 함께 모일 날을 정했으며, 각자 편에서 가마가 앞으로 나왔고, 자리들이 마련되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 δίφραξ는 여기서 드문 말로, 들것·가마·비슷한 이동식 좌석을 가리킬 수 있으나 정확한 형태는 확실하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτάξαντο
  english_pob_choice: they set
  chosen_korean: 정했으며
  alternatives_korean:
  - 지정했으며
  - 마련했으며
  lexicon: LSJ
  rationale: τάσσω의 중간태로서 날을 정하거나 배정하는 뜻이므로, 자연스러운 현대 한국어 동사인 ‘정하다’로 옮겼습니다.
- source_word: κατʼ ἰδίαν
