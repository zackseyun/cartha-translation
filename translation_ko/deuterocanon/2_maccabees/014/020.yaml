base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/020.yaml
  text: But after fuller consideration of these matters[a], and when the leader had communicated it to the crowds, and unanimous agreement had become evident[b], they assented to the terms.
  footnotes:
  - marker: a
    text: Or 'after more careful examination of these things.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'when the unanimous consent appeared'; the Greek emphasizes that a single-minded consensus became clear.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이 일들을 더 충분히 검토한 뒤, 지도자가 그 사실을 군중에게 알리고, 만장일치의 동의가 분명히 드러나자, 그들은 그 조건에 동의했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 일들을 더 신중히 검토한 뒤’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘만장일치의 동의가 나타났을 때’이며, 그리스어는 하나의 뜻으로 모인 합의가 분명해졌음을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλείονος δὲ γενομένης περὶ τούτων ἐπισκέψεως
  english_pob_choice: after fuller consideration of these matters
  chosen_korean: 이 일들을 더 충분히 검토한 뒤
  alternatives_korean:
  - 이 일들을 더 신중히 검토한 뒤
  - 이 일들에 대해 더 자세히 살핀 뒤
  lexicon: LSJ
  rationale: ἐπίσκεψις는 여기서 ‘방문’이 아니라 조사·검토의 뜻이므로, πλείονος의 비교 의미를 살려 ‘더 충분히 검토한 뒤’로 옮겼습니다.
- source_word: τοῦ ἡγουμένου
  english_pob_choice: the leader
  chosen_korean: 지도자가
  alternatives_korean:
  - 인도자가
  - 주도자가
  - 이끄는 사람이
  lexicon: LSJ
  rationale: ἡγούμενος는 특정 관직명보다 앞장서 이끄는 사람을 가리키므로, 문맥상 과도하게 특정하지 않는 ‘지도자’가 적절합니다.
- source_word: τοῖς πλήθεσιν ἀνακοινωσαμένου
  english_pob_choice: had communicated it to the crowds
  chosen_korean: 그 사실을 군중에게 알리고
  alternatives_korean:
  - 그것을 군중에게 전달하고
  - 그것을 군중에게 공지하고
  lexicon: LSJ
  rationale: ἀνακοινόω는 단순한 전달보다 함께 알리고 공유하는 뉘앙스가 있어, 문맥에 맞게 ‘알리고’로 자연스럽게 옮겼습니다.
- source_word: φανείσης ὁμοψήφου συγγνώμης
  english_pob_choice: unanimous agreement had become evident
  chosen_korean: 만장일치의 동의가 분명히 드러나자
  alternatives_korean:
  - 만장일치의 합의가 분명해지자
  - 한마음의 동의가 드러나자
  lexicon: LSJ
  rationale: ὁμόψηφος는 ‘한 표처럼 하나’라는 뜻으로 만장일치를 가리키며, συγγνώμη는 여기서 용서가 아니라 동의·양해의 의미이므로 ‘동의’로 번역했습니다.
- source_word: ἔνευσαν ταῖς συνθήκαις
  english_pob_choice: they assented to the terms
  chosen_korean: 그들은 그 조건에 동의했습니다
  alternatives_korean:
  - 그들은 그 약정에 승낙했습니다
  - 그들은 그 조건들을 받아들였습니다
  lexicon: LSJ
  rationale: ἔνευσαν은 고개를 끄덕여 승낙하는 동작에서 확장된 동의의 의미를 가지며, συνθῆκαι는 합의된 조건·조항이므로 ‘조건’으로 옮겼습니다.
