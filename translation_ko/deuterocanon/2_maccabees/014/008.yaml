translation:
  language: ko
  text: …영예—곧 대제사장직을 뜻합니다[a]—. 저는 이제 두 번째로 왔습니다. 첫째, 왕에게 관련된 일들을 진심으로 염두에 두고 있고, 둘째, 제 동료 시민들을 또한 헤아리고 있기 때문입니다. 이는 앞서 언급한 사람들의 어리석음 때문에…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 발췌문은 앞 절에서 이어져 ‘영예’로 시작하며, 마지막 절도 다음 절로 이어집니다. 따라서 본문 양끝의 줄임표는 발췌문의 미완결성을 나타냅니다.
    reason: textual_variant
lexical_decisions:
- source_word: δόξαν
  english_pob_choice: the chief honor/glory
  chosen_korean: 영예를 말하자면
  alternatives_korean:
  - 영광을 말하자면
  - 명예를 말하자면
  lexicon: LSJ
  rationale: δόξαν은 이 문맥에서 '영광'이라는 추상명사 자체보다 서두의 주제 전환 표지로 기능하므로, 문두의 연결을 살리면서도 의미를 과장하지 않는 '영예를 말하자면'으로 옮겼습니다.
- source_word: τὴν ἀρχιερωσύνην
  english_pob_choice: the high priesthood
  chosen_korean: 대제사장직
  alternatives_korean:
  - 대제사장 직분
  - 대제사장 권한
  lexicon: LSJ
  rationale: ἀρχιερωσύνη는 직무/직분으로서의 대제사장직을 가리키므로, 자연스럽고 제도적 뉘앙스를 살리는 '대제사장직'을 선택했습니다.
- source_word: ὑπὲρ τῶν ἀνηκόντων τῷ βασιλεῖ
  english_pob_choice: the interests of the king
  chosen_korean: 왕에게 속한 일들
  alternatives_korean:
  - 왕의 이해관계
  - 왕에게 관련된 일들
  lexicon: LSJ
  rationale: ἀνήκοντα는 '속한, 관련된, 마땅한'의 뜻이어서, 정치적 충성의 맥락을 살리되 지나치게 해석하지 않는 '왕에게 속한 일들'로 옮겼습니다.
- source_word: γνησίως φρονῶν
  english_pob_choice: I sincerely have in mind
  chosen_korean: 진심으로 염두에 두고 있고
  alternatives_korean:
  - 진실하게 생각하고 있고
  - 성실하게 마음에 두고 있고
  lexicon: LSJ
  rationale: γνησίως는 진정성/성실성을, φρονῶν은 마음에 두고 생각함을 뜻하므로, 두 요소를 함께 드러내는 표현으로 번역했습니다.
- source_word: τῶν ἰδίων πολιτῶν
  english_pob_choice: my own fellow citizens
  chosen_korean: 자기 시민들의 일도
  alternatives_korean:
  - 동포들의 일도
  - 동료 시민들의 일도
  lexicon: LSJ
  rationale: πολῖται는 문자적으로 시민들이며, ἰδίων은 '자기 자신의'라는 소속감을 더합니다. 한국어에서는 반복을 줄이되 주어의 자기 지향성을 살려 '자기 시민들의 일'로 옮겼습니다.
- source_word: στοχαζόμενος
  english_pob_choice: considering
  chosen_korean: 살피고 있기 때문입니다
  alternatives_korean:
  - 염두에 두고 있기 때문입니다
  - 고려하고 있기 때문입니다
  lexicon: LSJ
  rationale: στοχάζομαι는 단순한 사색보다 목표를 염두에 두고 주의를 기울이는 뜻이 있으므로, 문맥상 '살피다'를 택해 적극적 관심을 나타냈습니다.
