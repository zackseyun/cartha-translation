  chosen_reading: 본문은 '영예를 말하자면'으로 시작하되, 이어지는 절로 넘어가는 미완결 문장임을 한국어에서도 드러냈습니다.
  alternative_readings:
  - '''영광을 말하자면''으로 보다 직역하기'
  - 도입부를 생략하고 바로 '나는 이제 두 번째로 왔습니다'로 시작하기
  rationale: 이 절은 문장 전체가 다음 절로 이어지는 상태이므로, 시작 표지를 살리면서도 완결되지 않은 긴장을 보존하는 것이 원문 구조에 더 충실합니다.
  doctrine_reference: 2 Maccabees 14:8 문맥 구조
