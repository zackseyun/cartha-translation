  source_fidelity: 수정이 필요합니다. 초안의 ‘영예를 말하자면, 그러나’는 문두의 δόξαν이 앞 절에서 이어지는 목적격 단편이라는 점과 λέγων의 설명적 기능을 제대로 반영하지 못하며, δέ를 ‘그러나’로 과도하게 대립시킵니다. 또한 τῶν ἰδίων πολιτῶν은 ‘시민들의 일’보다 ‘나 자신의 동료 시민들’을 가리킵니다. 본문 발췌는 앞 절과 다음 절 양쪽에 걸쳐 있으므로 이를 줄임표와 주석으로 밝혔습니다.
  naturalness: 수정문은 현대 표준어 합쇼체를 유지하면서, ‘제 동료 시민들을 헤아리고’로 자연스럽게 표현했습니다. 앞뒤 절에 걸친 발췌라는 특성은 문장 자체를 부자연스럽게 완결하려 하지 않고 줄임표로 보존했습니다.
  terminology: ἀρχιερωσύνη는 ‘대제사장직’으로 유지했습니다. ὑπὲρ τῶν ἀνηκόντων τῷ βασιλεῖ는 ‘왕에게 관련된 일들’로, στοχαζόμενος는 동료 시민들을 염려하고 배려하는 뜻을 담아 ‘헤아리고’로 옮겼습니다. δόξαν은 독립된 완결 문장으로 만들지 않고, ‘영예—곧 대제사장직’이라는 앞 절 연결 단편으로 처리했습니다.
  issues:
