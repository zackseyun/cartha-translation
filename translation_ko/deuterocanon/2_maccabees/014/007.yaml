  rationale: 제공된 그리스어와 영어 POB가 모두 ‘선조의…’에서 끊긴다고 명시하므로, 보완 번역은 본문 증거를 넘어설 위험이 있습니다.
  doctrine_reference: 본문비평 원칙 / 수용가능한 번역 한계
- issue: βασιλεία의 정치적 의미
  chosen_reading: ‘왕국’으로 옮겨 국가적 안정의 맥락을 살렸습니다.
  alternative_readings:
  - ‘나라’
  - ‘왕권’
  - ‘통치’
  rationale: 여기서는 하나님의 나라 같은 신학적 용례가 아니라 정치적 실체와 질서를 가리키므로, 중립적이고 포괄적인 ‘왕국’이 적절합니다.
  doctrine_reference: 헬라어 어휘 의미역
