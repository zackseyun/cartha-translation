  - 조상들의
  lexicon: LSJ
  rationale: 2 Maccabees에서 반복되는 ‘조상/선조의 전승’ 어휘로, 간결하고 원뜻에 가까운 ‘선조의’를 선택했습니다.
theological_decisions:
- issue: 본문이 중간에서 끊기는 파편성 반영
  chosen_reading: 완결된 문장으로 보충하지 않고, 남아 있는 어구만 번역해 말줄임표로 미완을 표시했습니다.
  alternative_readings:
