lexical_decisions:
- source_word: τὴν βασιλείαν
  english_pob_choice: the kingdom
  chosen_korean: 왕국
  alternatives_korean:
  - 나라
  - 통치
  - 왕권
  lexicon: LSJ
  rationale: εὐσταθείας와 함께 정치적 상태를 가리키므로, ‘왕국’이 영역과 통치를 함께 담아 가장 자연스럽습니다.
- source_word: εὐσταθείας
