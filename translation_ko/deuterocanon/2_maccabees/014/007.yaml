  lexicon: LSJ
  rationale: 부정사 구문을 한국어 목적 표현으로 옮겨, ‘안정’을 얻는 결과를 자연스럽게 드러냈습니다.
- source_word: ὅθεν ἀφελόμενος
  english_pob_choice: Therefore, having taken away
  chosen_korean: 그러므로 … 빼앗고/제거하고
  alternatives_korean:
  - 그러므로 … 취하고
  - 그러므로 … 없애고
  - 그러므로 … 제거하고
  lexicon: LSJ
  rationale: ὅθεν의 추론적 연결을 ‘그러므로’로 살리고, ἀφελόμενος는 ‘빼앗다/제거하다’의 의미를 유지하되, 본문이 여기서 끊기는 점을 반영해 대상은 열어 두었습니다.
- source_word: προγονικὴν
  english_pob_choice: ancestral
  chosen_korean: 선조의
  alternatives_korean:
  - 조상 대대로의
  - 유전의
  - 조상들의
  lexicon: LSJ
  rationale: 2 Maccabees에서 반복되는 ‘조상/선조의 전승’ 어휘로, 간결하고 원뜻에 가까운 ‘선조의’를 선택했습니다.
theological_decisions:
- issue: 본문이 중간에서 끊기는 파편성 반영
  chosen_reading: 완결된 문장으로 보충하지 않고, 남아 있는 어구만 번역해 말줄임표로 미완을 표시했습니다.
  alternative_readings:
  - 문맥을 따라 목적어를 추정해 보충하는 번역
  - 자연스러운 한국어를 위해 문장을 완결시키는 번역
  rationale: 제공된 그리스어와 영어 POB가 모두 ‘선조의…’에서 끊긴다고 명시하므로, 보완 번역은 본문 증거를 넘어설 위험이 있습니다.
  doctrine_reference: 본문비평 원칙 / 수용가능한 번역 한계
- issue: βασιλεία의 정치적 의미
  chosen_reading: ‘왕국’으로 옮겨 국가적 안정의 맥락을 살렸습니다.
  alternative_readings:
  - ‘나라’
  - ‘왕권’
  - ‘통치’
  rationale: 여기서는 하나님의 나라 같은 신학적 용례가 아니라 정치적 실체와 질서를 가리키므로, 중립적이고 포괄적인 ‘왕국’이 적절합니다.
  doctrine_reference: 헬라어 어휘 의미역
