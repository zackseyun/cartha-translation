  text: Nicanor stayed on in Jerusalem and did nothing out of place[a]; and he dismissed the gathered crowds.
  footnotes:
  - marker: a
    text: Or 'the assembled rabble' or more literally 'the herd-like crowds.' The Greek adjective carries a pejorative sense for people acting as an unruly mass.
    reason: lexical_alternative
translation:
  language: ko
  text: 니카노르는 예루살렘에 머물면서 아무것도 부적절하게 행하지 않았습니다. 그리고 모인 군중을 해산시켰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모인 떼거리’ / 더 문자적으로는 ‘가축 떼 같은 군중’. 그리스어 형용사는 사람들을 질서 없는 집단으로 낮춰 부르는 경멸적 뉘앙스를 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διέτριβεν
  english_pob_choice: stayed on
  chosen_korean: 머물면서
  alternatives_korean:
  - 머무르면서
  - 계속 머물면서
  - 체류하면서
  lexicon: LSJ
  rationale: 과거 미완료의 지속적 체류를 자연스러운 합쇼체로 살리기 위해 ‘머물면서’로 옮겼습니다.
- source_word: ἔπραττεν οὐδὲν ἄτοπον
  english_pob_choice: did nothing out of place
  chosen_korean: 아무것도 부적절하게 행하지 않았습니다
  alternatives_korean:
  - 아무 일도 잘못하지 않았습니다
  - 아무 일도 부당하게 하지 않았습니다
  - 아무것도 무례하게 행하지 않았습니다
  lexicon: LSJ
  rationale: ἄτοπον의 폭넓은 뜻(부적절함, 이상함, 무질서함)을 살려, 정치적 서술에서 지나친 도덕화 없이 공적 행위의 ‘부적절함 없음’을 드러냈습니다.
- source_word: ἀπέλυσεν
  english_pob_choice: dismissed
  chosen_korean: 해산시켰습니다
  alternatives_korean:
  - 보냈습니다
  - 풀어 주었습니다
  - 떠나게 했습니다
  lexicon: LSJ
  rationale: 모여 있던 사람들을 흩어 보내는 사회적·집단적 의미를 가장 분명하게 나타내는 표현으로 ‘해산시켰습니다’를 택했습니다.
theological_decisions:
- issue: ἀγελαίους ὄχλους의 경멸적 뉘앙스
  chosen_reading: ‘모인 군중’으로 옮기되, 별도의 경멸적 어휘는 본문에 과도하게 얹지 않았습니다.
  alternative_readings:
  - ‘떼지어 모인 군중’
  - ‘우르르 모인 군중’
  - ‘무리 같은 군중’
  rationale: 문맥상 ἀγελαίους는 사람들을 무질서한 집단으로 낮춰 부르는 뉘앙스가 있지만, 한국어 본문에서는 ὄχλους의 기본 의미를 살리고 경멸성은 주석에 맡기는 편이 과잉 해석을 줄입니다.
  doctrine_reference: '번역 원칙: source-direct rendering and documented tension preservation'
