  yaml_path: translation/deuterocanon/2_maccabees/014/005.yaml
  text: That day was quiet. But when he found an opportunity suitable for his own folly[a], and had been summoned by Demetrius to the council and asked in what disposition and purpose the Jews stood,
  footnotes:
  - marker: a
    text: Or, more literally, 'having taken a time as an accomplice of his own folly'—the Greek is compressed, expressing that he seized an opportunity that served his foolish scheme.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날은 조용했습니다. 그러나 그는 자기의 어리석음에 알맞은 기회를 잡자, 데메트리오스가 그를 회중으로 불러 들였고 유대인들이 어떤 태도와 계획을 가지고 있는지 물었을 때[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자기의 어리석음에 알맞은’은 그리스어의 압축된 표현을 풀어 옮긴 것으로, 문자적으로는 ‘자기의 어리석음의 협력자/동료가 되는 때’를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡσυχίαν ἔσχεν
  english_pob_choice: was quiet
  chosen_korean: 조용했습니다
  alternatives_korean:
  - 평온했습니다
  - 잠잠했습니다
  - 조용히 지나갔습니다
  lexicon: LSJ
  rationale: 관용적으로 ‘quiet’를 살리면서도 사건의 흐름이 멈춘 상태를 자연스러운 한국어로 옮겼습니다.
- source_word: καιρὸν δὲ λαβὼν
  english_pob_choice: when he found an opportunity
  chosen_korean: 기회를 잡자
  alternatives_korean:
  - 때를 타자
  - 기회를 얻자
  - 틈을 타자
  lexicon: LSJ
  rationale: καιρός의 ‘적절한 기회’라는 뉘앙스를 담되, 문맥상 악한 의도를 실행할 틈을 포착했다는 흐름을 살렸습니다.
- source_word: τῆς ἰδίας ἀνοίας συνεργόν
  english_pob_choice: suitable for his own folly
  chosen_korean: 자기의 어리석음에 알맞은
  alternatives_korean:
  - 자기의 어리석음에 협력하는
  - 자기의 미련함을 돕는
  - 자기 어리석음의 공범이 되는
  lexicon: LSJ
  rationale: 협력자/공범처럼 인격화된 표현보다, POB의 ‘suitable for’가 드러내는 ‘그의 어리석은 계획에 맞아떨어지는’ 의미를 한국어로 간결하게 옮겼습니다.
- source_word: προσκληθεὶς εἰς συνέδριον
  english_pob_choice: had been summoned ... to the council
  chosen_korean: 회중으로 불러 들였고
  alternatives_korean:
  - 회의로 불러 들였고
  - 공의회로 소집했고
  - 회의에 불러 들였고
  lexicon: LSJ
  rationale: συνέδριον은 기본적으로 의결·심의 집회를 가리키므로 ‘회중’보다 ‘회의/의회’가 자연스럽지만, 여기서는 공식적인 심의 자리라는 점을 살려 ‘회중’이 아닌 ‘회중으로’로 번역하지 않고 본문에서 회중으로 처리한 대신 회의성보다 집합성을 유지했습니다.
- source_word: ἐπερωτηθεὶς ἐν τίνι διαθέσει καὶ βουλῇ καθεστήκασιν οἱ Ἰουδαῖοι
  english_pob_choice: asked in what disposition and purpose the Jews stood
  chosen_korean: 유대인들이 어떤 태도와 계획을 가지고 있는지 물었을 때
  alternatives_korean:
  - 유대인들이 어떤 자세와 뜻을 가지고 있는지 물었을 때
  - 유대인들이 어떤 마음가짐과 목적을 품고 있는지 물었을 때
  - 유대인들이 어떤 상태와 의도를 지녔는지 물었을 때
  lexicon: LSJ
  rationale: διάθεσις와 βουλή를 각각 ‘태도’와 ‘계획’으로 구분해, 외적 입장과 내적 의도를 함께 묻는 느낌을 살렸습니다.
