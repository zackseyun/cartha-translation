  source_fidelity: 수정이 필요합니다. 초안은 대체 뜻을 전달하지만, προσκληθεὶς와 ἐπερωτηθεὶς는 모두 그 인물(문맥상 앞절의 주어)이 데메트리오스에 의해 ‘소집되고’ ‘질문을 받은’ 수동형입니다. 또한 συνεργόν은 ‘때’가 아니라 καιρόν(기회)을 수식하며, 그 기회가 그의 어리석음에 협력하는 것으로 인격화되어 있습니다.
  naturalness: ‘회중으로 불러 들였고’는 συνέδριον의 공식 심의 기구라는 뜻을 충분히 드러내지 못하고, 주어 및 수동 관계도 덜 명료합니다. ‘회의에 소집되어’와 ‘질문을 받았을 때’가 현대 표준 한국어 합쇼체에서 자연스럽고 원문 구조에도 맞습니다.
  terminology: συνέδριον은 여기서 ‘회중’보다 ‘회의’ 또는 ‘평의회’가 적절합니다. 불필요하게 특정 종교 제도를 암시하지 않도록 ‘회의’를 택했습니다. οἱ Ἰουδαῖοι는 ‘유대인들’로 유지할 수 있습니다.
  issues:
  - severity: high
    issue: 수동태의 주체와 행위자 관계가 불명확하게 처리되었습니다.
    rationale: προσκληθεὶς ὑπὸ τοῦ Δημητρίου 및 ἐπερωτηθεὶς는 그 인물이 데메트리오스에게 소집되고 질문을 받았음을 뜻합니다. 초안의 ‘데메트리오스가 그를 ... 불러 들였고 ... 물었을 때’도 의미상 가능하나, 앞의 ‘그는 ... 기회를 잡자’와 결합되어 원문의 연속된 수동 분사 구조 및 미완결 문장 흐름을 약화합니다.
  - severity: medium
