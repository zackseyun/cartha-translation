  lexicon: BDAG
  rationale: 이 동사는 단순한 말의 모욕을 넘어서 수치스럽고 폭력적인 학대를 포함할 수 있으므로, 한국어에서는 의미 범위를 과도하게 좁히지 않는 표현을 택했습니다.
- source_word: ὑποχείριος γενέσθαι
