  - 종속되다
  - 지배 아래 놓이다
  lexicon: LSJ
  rationale: 문맥상 악인들의 권세 아래 놓이는 뜻이므로, 한국어 본문에서는 ‘당하다’로 간결하게 옮기고 전체 문장 흐름에서 적대적 억압의 의미를 유지했습니다.
- source_word: τῆς ἰδίας εὐγενείας
