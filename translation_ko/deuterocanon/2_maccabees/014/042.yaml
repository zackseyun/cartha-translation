  - 자기에게 속한 고귀함
  lexicon: LSJ
  rationale: 앞의 εὐγενῶς와 어휘적 대응을 유지하면서, 혈통적 신분과 품성상의 고귀함을 모두 함축할 수 있는 표현으로 다듬었습니다.
theological_decisions:
- issue: 순교적 죽음의 가치 평가
  chosen_reading: 본문은 그가 고귀한 죽음을 택한 결단을 긍정적으로 제시하므로, 이를 도덕적 용기와 품위의 언어로 옮겼습니다.
  alternative_readings:
  - 단순한 자살 선호로 오해될 수 있게 옮김
  - 중립적으로만 서술함
  rationale: 헬라어 εὐγενῶς와 εὐγενείας의 반복은 죽음의 방식이 인물의 품위와 연결됨을 강조합니다. 따라서 그 평가적 뉘앙스를 살려야 합니다.
  doctrine_reference: 순교 서술의 서사적 평가
- issue: ὑβρίζω의 의미 범위
  chosen_reading: ‘모욕을 당하다’로 옮기되, 필요 이상의 협소화를 피했습니다.
  alternative_readings:
  - ‘말로만 욕을 당하다’
  - ‘구타당하다’
  rationale: 본문의 동사는 언어적 insult와 폭력적 학대를 모두 포괄할 수 있으므로, 한국어 번역에서도 그 긴장을 보존해야 합니다.
