  yaml_path: translation/deuterocanon/2_maccabees/014/016.yaml
  text: But when the commander gave the order[a], he broke camp from there at once and joined battle with them near the village of Lessaou.
  footnotes:
  - marker: a
    text: Or 'engaged them at the village of Lessaou.' The Greek phrase can be taken more directly as movement to or action at the village, and the verb rendered 'joined battle' is literally 'mingles with' in a military context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 지휘관이 명령하자, 그는 그곳에서 곧바로 진을 걷어 레사우 마을 근처에서 그들과 맞붙었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘레사우 마을에서 그들과 맞붙었습니다.’ 그리스어 구문은 레사우 마을을 향한 이동이나 그 마을에서의 행동으로 더 직접 이해될 수 있으며, ‘맞붙었습니다’로 옮긴 동사는 문자적으로 ‘섞이다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προστάξαντος
  english_pob_choice: gave the order
  chosen_korean: 명령하자
  alternatives_korean:
  - 지시하자
  - 명령을 내리자
  lexicon: LSJ
  rationale: 군사적 맥락에서 지휘관의 지시가 뒤따르는 행동을 촉발하므로, 한국어에서는 자연스럽게 조건·선행 관계를 드러내는 ‘명령하자’로 옮겼습니다.
- source_word: τοῦ ἡγουμένου
  english_pob_choice: the commander
  chosen_korean: 지휘관
  alternatives_korean:
  - 사령관
  - 지도자
  lexicon: LSJ
  rationale: ἡγούμενος는 여기서 군사적 역할을 가리키므로, 역할을 과도하게 격식화하지 않으면서도 의미를 분명히 하는 ‘지휘관’이 적절합니다.
- source_word: ἀναζεύξας
  english_pob_choice: broke camp
  chosen_korean: 진을 걷고 물러나
  alternatives_korean:
  - 진을 걷고 떠나
  - 출발하여
  lexicon: LSJ
  rationale: 군사 용례의 ‘진을 걷다’라는 구체성을 살리고, 이어지는 이동을 ‘물러나’로 자연스럽게 풀어 전투 서술의 동작감을 유지했습니다.
- source_word: συνμίσγει αὐτοῖς ἐπὶ κώμην Λεσσαού
  english_pob_choice: joined battle with them near the village of Lessaou
  chosen_korean: 레사우 마을 근처에서 그들과 맞붙었습니다
  alternatives_korean:
  - 레사우 마을에서 그들과 맞붙었습니다
  - 레사우 마을을 향해 그들과 맞붙었습니다
  lexicon: LSJ
  rationale: συνμίσγει는 문자적으로는 ‘섞이다’이지만 전투 문맥에서는 ‘맞붙다/교전하다’가 가장 적절하며, ἐπὶ κώμην은 위치상 ‘근처에서’로 보수적으로 옮겼습니다.
- source_word: Λεσσαού
  english_pob_choice: Lessaou
  chosen_korean: 레사우
  alternatives_korean:
  - 레싸우
  - 레스사우
  lexicon: modern transliteration
  rationale: 고유명사는 현대 외래어 표기 감각에 맞춰 음역하되, 원형의 발음을 과도하게 추정하지 않도록 ‘레사우’로 옮겼습니다.
theological_decisions:
- issue: 군사 서술의 동사 선택
  chosen_reading: 전투적 의미를 살려 ‘맞붙었습니다’로 옮기고, ‘진을 걷고’로 이동의 군사성을 보존했습니다.
  alternative_readings:
  - 단순히 ‘갔습니다’로 평이하게 옮김
  - ‘교전했습니다’로 더 기술적으로 옮김
  rationale: 본문은 전투 서사의 진행을 보여 주므로, 평이한 이동 표현보다 군사적 긴장과 행동 변화를 드러내는 표현이 더 직접적입니다.
  doctrine_reference: source-context fidelity
