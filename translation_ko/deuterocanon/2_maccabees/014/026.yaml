  rationale: 당사자들 사이의 우호적 태도를 자연스럽게 드러내는 표준어로 ‘호의’가 가장 간결하고 정확합니다.
- source_word: συνθήκας
  english_pob_choice: agreements
  chosen_korean: 협정들
  alternatives_korean:
  - 협약들
  - 합의들
  - 조약들
  lexicon: LSJ
  rationale: 정치적 맥락에서 당사자들 사이에 맺어진 공식적 약정을 가리키므로 ‘협정들’이 문맥상 가장 알맞습니다.
- source_word: ἀλλότρια φρονεῖν τῶν πραγμάτων
  english_pob_choice: was favoring interests contrary to the state
  chosen_korean: 국가의 이익과는 다른 것을 도모하고 있다고
  alternatives_korean:
  - 국가의 일에 어긋난 생각을 하고 있다고
  - 공공의 이익에 반하는 편을 들고 있다고
  - 나라의 사정과는 딴 생각을 하고 있다고
  lexicon: LSJ
  rationale: 직역하면 어색한 관용구이므로, 정치적 비난의 핵심인 ‘국가에 반하는 이해관계’를 자연스러운 한국어로 풀어 옮겼습니다.
- source_word: ἐπίβουλον
  english_pob_choice: the plotter against
  chosen_korean: 야당하는 자
  alternatives_korean:
  - 음모자
  - 반역자
  - 모반자
  lexicon: LSJ
  rationale: 왕국을 해치는 의도적 적대행위를 드러내기 위해, 단순한 ‘적’보다 더 강한 ‘야당하는 자’를 선택했습니다.
- source_word: διάδοχον
  english_pob_choice: as successor
  chosen_korean: 후계자로
  alternatives_korean:
  - 계승자로
  - 승계자로
  - 대신할 자로
  lexicon: LSJ
  rationale: 이어받는 지위를 뜻하는 말로, 왕국 맥락에서는 ‘후계자’가 가장 자연스럽고 직접적입니다.
theological_decisions:
- issue: 정치적 비난 표현의 직역 여부
  chosen_reading: ‘국가의 이익과는 다른 것을 도모하다’로 풀어, 헬라어 관용구의 정치적 함의를 살리면서도 한국어로 이해 가능하게 옮겼습니다.
  alternative_readings:
  - ‘공공의 일에 어긋난 생각을 하다’
  - ‘나라의 일과 다른 뜻을 품다’
  rationale: 이 구절은 교리 문제가 아니라 정치적 비난의 관용구이므로, 지나치게 문자적인 표현보다 문맥상 의도를 분명히 하는 번역을 택했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 야훼/주 관련 용어 사용 여부
  chosen_reading: 이 절에는 야훼 또는 주 관련 직접 용례가 없으므로 해당 표기는 사용하지 않았습니다.
  alternative_readings:
  - 해당 없음
  rationale: 불필요한 신학적 용어를 도입하지 않고, 원문이 말하는 정치적 서술에 집중했습니다.
  doctrine_reference: Glossary defaults
