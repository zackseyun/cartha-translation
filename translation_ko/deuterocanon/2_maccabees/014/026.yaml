revisions:
- from: 그때 알키모스는 서로에 대한 호의와 맺어진 협정들을 알아차리고, 데메트리우스에게 가서 니카노르가 국가의 이익과는 다른 것을 도모하고 있다고 말했습니다. 그는 야당하는 자 유다를 자기 왕국의 후계자로 세웠기 때문입니다.[a][b]
  to: 그러나 알키모스는 그들이 서로에게 품은 호의와 맺어진 협정들[b]을 알아차리고 데메트리우스에게 가서, 니카노르가 국정에 어긋나는 생각을 품고 있다고 말했습니다[a]. 니카노르가 데메트리우스의 왕국을 음모로 해치려는 유다를 후계자로 세웠기 때문입니다.
  rationale: 정치적 관용구는 원문의 ‘생각을 품다’라는 표현을 보존하면서도 현대 한국어로 이해되도록 ‘국정에 어긋나는 생각을 품다’로 옮겼습니다. ἐπίβουλον의 모의·적대 의미를 ‘왕국을 음모로 해치려는 자’로 분명히 했고, αὐτοῦ의 지시 대상은 데메트리우스로 명시하여 모호성을 피했습니다. 각주는 설명 대상 바로 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:49:26Z'
