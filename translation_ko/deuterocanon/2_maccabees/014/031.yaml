base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/031.yaml
  text: But when the other man realized that he had been outmaneuvered by the man’s boldness[a], he came to the greatest and holy temple, while the priests were offering the customary sacrifices, and ordered them to hand over the man.
  footnotes:
  - marker: a
    text: Or 'the great and holy temple.' The Greek uses a superlative ('greatest'), which may function idiomatically as an exalted description of the temple.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 다른 사람이 그 사람의 담대함으로 자신이 기세에서 밀렸음을 깨닫고, 가장 크고 거룩한 성전에 이르러 제사장들이 정해진 제사를 드리고 있을 때 그 사람을 넘겨주라고 명령하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가장 크고 거룩한 성전’입니다. 그리스어는 최상급을 사용하여 성전을 높여 부를 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενναίως
  english_pob_choice: by the man’s boldness
  chosen_korean: 그 사람의 담대함으로
  alternatives_korean:
  - 그 사람의 용기로
  - 그 사람의 대담함으로
  lexicon: LSJ
  rationale: γενναίως는 ‘용감하게/담대하게’의 뜻을 지니며, 문맥상 상대를 압도한 성격을 드러내므로 ‘담대함으로’가 원문의 힘을 살립니다.
- source_word: ἐστρατήγηται
  english_pob_choice: had been outmaneuvered
  chosen_korean: 자신이 기세에서 밀렸음을
  alternatives_korean:
  - 자신이 책략으로 제압당했음을
  - 자신이 전략적으로 패했음을
  lexicon: LSJ
  rationale: 전술적으로 우세를 점한 상황을 가리키므로, 현대 한국어에서 자연스러운 ‘기세에서 밀리다’로 옮겨 원문의 전략적 뉘앙스를 유지했습니다.
- source_word: ἐπὶ τὸ μέγιστον καὶ ἅγιον ἱερόν
  english_pob_choice: to the greatest and holy temple
  chosen_korean: 가장 크고 거룩한 성전
  alternatives_korean:
  - 가장 큰 거룩한 성전
  - 가장 크고 거룩한 성소
  lexicon: LSJ
  rationale: μέγιστον의 최상급을 살려 ‘가장 크고’로 옮기고, ἱερόν은 문맥상 예루살렘 성전이므로 ‘성전’이 가장 직접적입니다.
- source_word: τὰς καθηκούσας θυσίας
  english_pob_choice: the customary sacrifices
  chosen_korean: 정해진 제사
  alternatives_korean:
  - 관례적인 제사
  - 규정된 제사
  lexicon: LSJ
  rationale: καθηκούσας는 ‘마땅한/정해진’의 뜻이므로, 제사장의 일상적 직무를 반영하는 ‘정해진 제사’가 무난합니다.
- source_word: παραδοῦναι τὸν ἄνδρα
  english_pob_choice: to hand over the man
  chosen_korean: 그 사람을 넘겨주라고
  alternatives_korean:
  - 그 사람을 인도하라고
  - 그 사람을 내주라고
  lexicon: LSJ
  rationale: 강제적 인계를 요구하는 표현이므로, 한국어에서 가장 직설적인 ‘넘겨주다’로 옮겼습니다.
theological_decisions:
- issue: ἱερόν의 번역과 성전 이해
  chosen_reading: 문맥상 예루살렘 성전을 가리키므로 ‘성전’으로 번역했습니다.
  alternative_readings:
  - 성소
  - 성전 구역
  rationale: ἱερόν은 성전 परिसर/성전 전반을 가리킬 수 있지만, 본문은 제사와 제사장 행위가 함께 나오므로 독자가 즉시 이해할 수 있는 ‘성전’이 적절합니다.
  doctrine_reference: 'Translation philosophy: readable modern Korean without losing the sanctuary setting.'
