lexical_decisions:
- source_word: μεθʼ ὅρκων φασκόντων
  english_pob_choice: when they swore
  chosen_korean: 맹세하며
  alternatives_korean:
  - 맹세하고
  - 맹세로 말하며
  - 맹세를 하며
  lexicon: LSJ
  rationale: μεθʼ ὅρκων은 단순한 진술이 아니라 맹세를 동반한 진술이므로, 한국어에서는 동사로 자연스럽게 압축해 ‘맹세하며’로 옮겼습니다.
- source_word: μὴ γινώσκειν
  english_pob_choice: did not know
  chosen_korean: 알지 못한다고
  alternatives_korean:
  - 모른다고
  - 알지 못한다고는
  - 모른다고 하며
  lexicon: LSJ
  rationale: 보고 문맥의 내용절이므로, 한국어 간접화법에 맞게 ‘알지 못한다고’로 처리해 부정의 내용과 보고 구조를 함께 살렸습니다.
- source_word: ποῦ ποτʼ ἐστὶν
  english_pob_choice: where ... was
  chosen_korean: 어디에 있는지
  alternatives_korean:
  - 어디 있는지
  - 정확히 어디에 있는지
  - 도대체 어디에 있는지
  lexicon: LSJ
  rationale: 그리스어 현재시제는 한국어 간접화법에서 자연스럽게 ‘있는지’로 옮길 수 있으며, ποτʼ의 막연한 강조는 본문보다 과도하게 풀지 않았습니다.
- source_word: ὁ ζητούμενος
  english_pob_choice: the man being sought
  chosen_korean: 그 사람
  alternatives_korean:
  - 찾는 그 사람
  - 수색 중인 그 사람
  - 그렇게 찾는 사람
  lexicon: LSJ
  rationale: 문맥상 이미 지시 대상이 분명하므로 한국어에서는 ‘그 사람’으로 간명하게 옮겼고, 수동 분사 의미는 본문 흐름에서 유지됩니다.
