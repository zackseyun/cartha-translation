base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/042.yaml
  text: But when they also became aware of the attack by Lysimachus[a], some snatched up stones, others thick pieces of wood, and some, grabbing handfuls of the ashes lying nearby[c][b], hurled them all together at those around Lysimachus.
  footnotes:
  - marker: a
    text: Or 'knowing the assault by Lysimachus.' The Greek participle can be rendered more statically ('knowing') or more dynamically in context ('became aware of').
    reason: lexical_alternative
  - marker: b
    text: Literally 'thicknesses of wood,' that is, heavy or thick wooden pieces.
    reason: lexical_alternative
  - marker: c
    text: The phrase 'those around Lysimachus' likely refers to his accompanying men or supporters.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 또 리시마코스의 공격을 알아차렸을 때, 어떤 이들은 돌을, 어떤 이들은 굵은 나무토막을, 또 어떤 이들은 가까이 놓인 재를 한 움큼씩 집어 리시마코스 주변에 있는 사람들에게 모두 뒤섞어 던졌습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘알아차렸을 때’는 문맥을 반영한 동적 번역입니다. 그리스어 분사는 단순히 ‘알고 있는’ 상태로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘굵은 나무토막’은 직역상 ‘나무의 두께들’에 가까운 표현을 한국어 의미로 풀어 옮긴 것입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘모두 뒤섞어’는 φύρδην의 혼란스럽고 섞인 동작을 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνειδότες
  english_pob_choice: became aware of
  chosen_korean: 알아차렸을 때
  alternatives_korean:
  - 알고 있었을 때
  - 알게 되었을 때
  lexicon: LSJ
  rationale: 문맥상 단순 인지가 아니라 공격 상황을 즉각 파악하는 반응이므로, 현재형 인지보다 동적인 ‘알아차리다’가 자연스럽습니다.
- source_word: ἐπίθεσιν
  english_pob_choice: attack
  chosen_korean: 공격
  alternatives_korean:
  - 습격
  - 침공
  lexicon: LSJ
  rationale: 폭력적 행위를 가리키는 일반적이고 직접적인 표현으로 ‘공격’이 가장 적절합니다.
- source_word: ξύλων πάχη
  english_pob_choice: thick pieces of wood
  chosen_korean: 굵은 나무토막
  alternatives_korean:
  - 두꺼운 나무조각
  - 굵은 나무 조각
  lexicon: LSJ
  rationale: 직역하면 ‘나무의 두께들’에 가깝지만, 한국어에서는 실제로 손에 집어 던질 수 있는 무거운 나무 조각을 떠올리게 하는 ‘굵은 나무토막’이 의미를 잘 살립니다.
- source_word: φύρδην ἐνετίνασσον
  english_pob_choice: hurled them all together
  chosen_korean: 모두 뒤섞어 던졌습니다
  alternatives_korean:
  - 마구 던졌습니다
  - 뒤섞인 채로 던졌습니다
  - 한데 섞어 던졌습니다
  lexicon: LSJ
  rationale: φύρδην은 질서 없이 뒤섞인 상태를 나타내므로, 단순한 반복 동작보다 혼합·혼란의 뉘앙스를 살린 ‘모두 뒤섞어’가 더 가깝습니다.
