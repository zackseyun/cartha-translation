  text: But after receiving the royal commands[a], he arrived, bringing nothing worthy of the high priesthood[c][b], but having the passions of a cruel tyrant and the rage of a barbarous beast.
  footnotes:
  - marker: a
    text: Or 'the king's orders.'
    reason: lexical_alternative
  - marker: b
    text: Or 'bringing nothing befitting the high priesthood.'
    reason: lexical_alternative
  - marker: c
    text: Greek literally speaks of 'passions' and 'rages,' using two near-overlapping terms to intensify his violent character.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 왕의 명령을 받아 가지고 왔으나, 그는 대제사장직에 조금도 합당한 것을 지니지 못하고, 잔인한 폭군의 격정과 야만적인 짐승의 분노를 품고 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕의 지시들’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘대제사장직에 합당한 것을 가져오지 못하고’.
    reason: lexical_alternative
  - marker: c
    text: 그리스어는 ‘격정’과 ‘분노’에 해당하는 두 유사한 말을 함께 써서 그의 폭력적 성격을 더욱 강하게 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰς βασιλικὰς ἐντολάς
  english_pob_choice: the royal commands
  chosen_korean: 왕의 명령
  alternatives_korean:
  - 왕의 지시
  - 왕실의 명령
  lexicon: LSJ
  rationale: ἐντολάς는 단순한 ‘말씀’이 아니라 권위를 가진 명령이므로, ‘왕의 명령’이 가장 자연스럽고 원문의 권위성을 살립니다.
- source_word: παρεγίνετο
  english_pob_choice: he arrived
  chosen_korean: 왔으나
  alternatives_korean:
  - 도착했으나
  - 나타났으나
  lexicon: LSJ
  rationale: 문맥상 등장·도착의 의미이므로, 서술 흐름에 맞게 간결한 ‘왔으나’로 옮겼습니다.
- source_word: τῆς μὲν ἀρχιερωσύνης οὐδὲν ἄξιον φέρων
  english_pob_choice: bringing nothing worthy of the high priesthood
  chosen_korean: 대제사장직에 조금도 합당한 것을 지니지 못하고
  alternatives_korean:
  - 대제사장직에 합당한 것을 아무것도 가져오지 못하고
  - 대제사장직에 조금도 어울리는 것을 보이지 못하고
  lexicon: LSJ
  rationale: φέρων을 단순히 ‘가져오다’로만 두기보다, 직분에 합당한 자질을 ‘지니고 있지 않다’는 뜻이 드러나도록 풀어 옮겼습니다.
- source_word: θυμοὺς δὲ ὠμοῦ τυράννου καὶ θηρὸς βαρβάρου ὀργὰς ἔχων
  english_pob_choice: having the passions of a cruel tyrant and the rage of a barbarous beast
  chosen_korean: 잔인한 폭군의 격정과 야만적인 짐승의 분노를 품고 있었습니다
  alternatives_korean:
  - 사나운 폭군의 격정과 야만적인 짐승의 분노를 품고 있었습니다
  - 잔혹한 폭군의 격정과 야만스러운 짐승의 분노를 품고 있었습니다
  lexicon: LSJ
  rationale: θυμοὺς와 ὀργὰς의 중첩된 폭력성을 살리기 위해 ‘격정’과 ‘분노’를 구분해 옮겼고, βαρβάρου는 ‘야만적인’으로 문화적 비난의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 대제사장직에 대한 도덕적 평가
  chosen_reading: 이 구절은 그가 왕의 명령을 받아왔다는 사실과 별개로, 대제사장직에 전혀 어울리지 않는 폭력적 성품을 가졌다는 점을 강하게 규정합니다.
  alternative_readings:
  - 단순히 정치적 성향을 비판하는 표현으로 약화해 읽는 방식
  rationale: 원문은 ‘대제사장직에 합당한 것이 전혀 없다’는 부정과 폭군·짐승의 이미지로 강한 윤리적 대비를 이루므로, 그 비난의 강도를 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
