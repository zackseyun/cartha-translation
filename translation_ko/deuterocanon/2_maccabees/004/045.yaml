translation:
  language: ko
  text: 그런데 왕이 두로에 이르자, 의회[a]가 보낸 세 사람은 그 앞에서 변론하였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: γερουσία는 직역하면 ‘장로들의 회의’에 가깝지만, 여기서는 당시 유대 지도 기구를 가리키는 공적 명칭으로 이해하여 ‘의회’로 옮겼습니다.
    reason: cultural_note
  - marker: b
    text: δικαιολογία는 여기서 일상적 ‘변명’이 아니라 공적·법정적 맥락에서 자신들의 입장을 정당화하거나 변호하는 ‘변론’을 뜻합니다.
    reason: lexical_alternative
