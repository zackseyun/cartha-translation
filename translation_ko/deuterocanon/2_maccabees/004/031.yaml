  text: So the king came quickly to settle the affairs, leaving Andronicus, one of those holding high office, as his successor.
translation:
  language: ko
  text: 그러므로 왕은 일을 신속히 수습하려고 와서, 높은 직책에 있던 사람들 가운데 하나인 안드로니코스를 자기 후임으로 남겨 두었습니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘후임’은 διαδεχόμενον의 계승 관계를 간결하게 드러낸 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: θᾶττον ... ἧκεν καταστεῖλαι τὰ πράγματα
  english_pob_choice: came quickly to settle the affairs
  chosen_korean: 일을 신속히 수습하려고 와서
  alternatives_korean:
  - 속히 와서 사태를 정리하려고
  - 급히 와서 일을 진정시키려고
  lexicon: θᾶττον, καταστέλλω
  rationale: θᾶττον은 단순한 도착이 아니라 신속함을 강조하므로 ‘신속히’로 살리고, καταστεῖλαι τὰ πράγματα는 ‘사건/일’을 질서 있게 정리·진정시키는 뜻을 담아 ‘수습하다’로 옮겼습니다.
- source_word: τὰ πράγματα
  english_pob_choice: the affairs
  chosen_korean: 일을
  alternatives_korean:
  - 사태를
  - 일들을
  lexicon: πράγματα
  rationale: 여기서는 국가적/정무적 ‘일들’을 가리키므로 너무 추상적인 ‘사무’보다 자연스러운 ‘일’이 원문 의미를 잘 드러냅니다.
- source_word: καταλείπων τὸν διαδεχόμενον Ἀνδρόνικον
  english_pob_choice: leaving Andronicus ... as his successor
  chosen_korean: 안드로니코스를 자기 후임으로 남겨 두었습니다
  alternatives_korean:
  - 안드로니코스를 뒤를 잇는 사람으로 남겨 두었습니다
  - 안드로니코스를 후계자로 남겨 두었습니다
  lexicon: καταλείπων, διαδέχομαι
  rationale: διαδεχόμενον은 ‘뒤를 잇는 사람/후임자’라는 계승 의미가 핵심이므로, 본문의 정치적 맥락을 살려 ‘자기 후임’으로 옮겼습니다.
- source_word: τῶν ἐν ἀξιώματι κειμένων
  english_pob_choice: one of those holding high office
  chosen_korean: 높은 직책에 있던 사람들 가운데 하나인
  alternatives_korean:
  - 고위직에 있던 사람들 가운데 하나인
  - 높은 지위에 있던 사람들 가운데 하나인
  lexicon: ἀξίωμα
  rationale: ἀξίωμα은 단순한 명예보다 공적 직위·관직의 뉘앙스가 강하므로 ‘높은 직책’으로 번역해 신분적 높음과 직무적 성격을 함께 살렸습니다.
theological_decisions:
- issue: 왕의 개입과 정치적 계승 표현
  chosen_reading: 본문은 신학적 해설보다 역사 서술에 가깝기 때문에, 왕이 사태를 수습하고 안드로니코스를 후임으로 남겼다는 정치적 행위를 평이하게 전달했습니다.
  alternative_readings:
  - 섭리적 개입을 암시하는 표현으로 다듬기
  - 더 강한 권위 표현을 넣기
  rationale: 원문과 POB 영어는 사건 진행을 서술할 뿐, 여기서 추가적 신학 해석을 요구하지 않으므로 과장을 피했습니다.
  doctrine_reference: 역사서 서술 원칙
