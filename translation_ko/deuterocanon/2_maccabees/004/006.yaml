  text: For he saw that without royal intervention it was impossible for affairs to attain peace[c][b][a], and that Simon would not stop his folly.
  footnotes:
  - marker: a
    text: Greek literally, 'without royal πρόνοια.' The term can mean foresight, care, or provision; here it likely refers to the king's active support or intervention.
    reason: lexical_alternative
  - marker: b
    text: Greek literally, 'Simon would not receive a pause from his folly,' that is, he would not desist from it.
    reason: lexical_alternative
  - marker: c
    text: The verse opens with a participle ('considering' / 'observing'), which in Greek links tightly with the previous sentence; the English smooths this connection for readability.
    reason: textual_variant
translation:
  language: ko
  text: 그는 이를 살피면서, 왕의 개입 없이는 사태가 평온해질 수 없고 시몬도 자기의 어리석은 일을 그치지 않을 것임을 알았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 문자적으로 ‘왕의 선견(πρόνοια) 없이’라고 합니다. πρόνοια는 선견, 돌봄, 배려 또는 지원을 뜻할 수 있으며, 여기서는 왕의 실제적인 지원이나 개입을 가리키는 듯합니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 문자적으로 ‘시몬이 자기의 어리석음에서 멈춤을 얻지 않을 것’이라고 합니다. 곧 그가 어리석은 일을 그치지 않을 것이라는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 이 절은 ‘살피면서’라는 분사(σκοπῶν)로 시작하여 앞 절과 밀접하게 이어집니다. 한국어에서는 문장을 자연스럽게 하기 위해 이를 본절 안에서 풀어 옮겼습니다.
    reason: textual_variant
