  yaml_path: translation/deuterocanon/2_maccabees/004/006.yaml
  text: For he saw that without royal intervention it was impossible for affairs to attain peace[c][b][a], and that Simon would not stop his folly.
  footnotes:
  - marker: a
    text: Greek literally, 'without royal πρόνοια.' The term can mean foresight, care, or provision; here it likely refers to the king's active support or intervention.
    reason: lexical_alternative
  - marker: b
    text: Greek literally, 'Simon would not receive a pause from his folly,' that is, he would not desist from it.
    reason: lexical_alternative
  - marker: c
    text: The verse opens with a participle ('considering' / 'observing'), which in Greek links tightly with the previous sentence; the English smooths this connection for readability.
    reason: textual_variant
translation:
  language: ko
  text: 그는 왕의 개입이 없이는 일들이 평강에 이를 수 없고, 시몬이 자기의 어리석음에서 멈추지 않을 것이라고 보고 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 βασιλικῆς προνοίας는 문자적으로 ‘왕의 πρόνοια’입니다. 여기서 πρόνοια는 선견, 돌봄, 공급을 뜻할 수 있지만, 문맥상 왕의 실제적 지원이나 개입을 가리키는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 문자적으로 ‘시몬이 자기의 어리석음에서 잠깐의 쉼도 받지 않을 것’이라는 뜻으로, 여기서는 ‘멈추지 않을 것’이라는 의미입니다.
    reason: lexical_alternative
  - marker: c
    text: 이 절은 분사 σκοπῶν으로 시작하며, 앞 문장과 밀접하게 이어집니다. 한국어에서는 읽기 자연스러움을 위해 독립절처럼 풀었습니다.
    reason: textual_variant
