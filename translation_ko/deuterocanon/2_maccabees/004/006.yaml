  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 τυχεῖν εἰρήνης ἐπὶ τὰ πράγματα는 ‘일들이 평강에 이르다’보다 ‘사태가 평온해지다/평화를 이루다’처럼 공적 사태의 안정으로 옮기는 편이 자연스럽고 정확합니다. 또한 παῦλαν ... τῆς ἀνοίας는 시몬이 자신의 어리석은 행위를 그치지 않는다는 뜻이므로 이를 명시하는 것이 좋습니다.
  naturalness: ‘일들이 평강에 이를 수’와 ‘자기의 어리석음에서 멈추지’는 현대 표준어 문장으로 다소 어색합니다. ‘사태가 평온해질 수’ 및 ‘어리석은 일을 그치지 않을’이 자연스럽습니다. 절두의 분사는 앞 절과의 연결을 짧게 드러내되, 이 절만 읽어도 문장이 서도록 처리했습니다.
  terminology: εἰρήνη는 이 정치·행정 문맥에서 종교적 어감이 강한 ‘평강’보다 ‘평온’ 또는 ‘평화’가 적합합니다. βασιλικῆς προνοίας를 ‘왕의 개입’으로 옮기는 것은 문맥상 가능하나, 각주에서 원어의 ‘선견·돌봄·배려·지원’ 범위를 보존해야 합니다.
