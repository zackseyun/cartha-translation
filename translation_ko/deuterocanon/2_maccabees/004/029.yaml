  text: 그리고 멜레아스는 대제사직의 후계자로 자신의 형제 리시마쿠스를 남겼고, 소스트라토스는 키프리인들 위에 있는 크라테스를 남겼습니다.[a]
  philosophy: optimal-equivalence
