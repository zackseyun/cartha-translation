  yaml_path: translation/deuterocanon/2_maccabees/004/029.yaml
  text: And Menelaus left Lysimachus[a], his own brother, as successor to the high priesthood, while Sostratus left Crates, the one over the Cyprians.
  footnotes:
  - marker: a
    text: Or, 'the official in charge of the Cyprians' or 'the governor over the Cyprians.' The Greek does not make the precise administrative title explicit.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 메넬라오스는 자신의 형제 리시마코스를 대제사직의 후계자로 남겼고, 소스트라토스는 키프로스인들을 맡은 크라테스를 남겼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘키프로스인들을 관할하는 관리’ 혹은 ‘키프로스인들의 총독’. 그리스어는 정확한 행정 직함을 분명히 밝히지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέλιπεν
  english_pob_choice: left
  chosen_korean: 남겼고
  alternatives_korean:
  - 두었습니다
  - 남겨 두었습니다
  - 세웠고
  lexicon: LSJ
  rationale: 직역하면 ‘남기다/뒤에 두다’의 뜻이므로, 후임을 남겨 두는 문맥을 살리면서도 과도하게 ‘임명하다’로 단정하지 않도록 했습니다.
- source_word: τῆς ἀρχιερωσύνης διάδοχον
  english_pob_choice: as successor to the high priesthood
  chosen_korean: 대제사직의 후계자로
  alternatives_korean:
  - 대제사직의 후임으로
  - 대제사직의 계승자로
  lexicon: LSJ
  rationale: διάδοχος의 핵심은 ‘뒤를 잇는 사람’이므로, 한국어에서는 자연스럽게 ‘후계자/후임’으로 옮기되 직분인 ‘대제사직’을 분명히 했습니다.
- source_word: τὸν ἑαυτοῦ ἀδελφόν
  english_pob_choice: his own brother
  chosen_korean: 자신의 형제
  alternatives_korean:
  - 자기 형제
  - 자기 친형제
  lexicon: LSJ
  rationale: ἑαυτοῦ의 강조를 살려 단순한 ‘형제’보다 ‘자신의’로 옮겼습니다.
- source_word: τὸν ἐπὶ τῶν Κυπρίων
  english_pob_choice: the one over the Cyprians
  chosen_korean: 키프리인들 위에 있는
  alternatives_korean:
  - 키프리인들을 맡은
  - 키프리인들의 책임자
  - 키프리인들 위의
  lexicon: LSJ
  rationale: 그리스어가 정확한 관직명을 밝히지 않으므로, POB처럼 ‘~위에 있는’의 상대적으로 직역적인 표현을 택해 직함을 과잉 해석하지 않았습니다.
