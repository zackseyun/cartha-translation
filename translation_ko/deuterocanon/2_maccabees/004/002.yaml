  text: and he dared to call the benefactor of the city[a], the guardian of his fellow countrymen, and the zealot for the laws, a conspirator against the state.
  footnotes:
  - marker: a
    text: Or, 'one plotting against public affairs' or 'a conspirator against the commonwealth.' The Greek phrase is political in force, not merely personal hostility.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 그는 도시의 은인, 자기 동포들의 보호자, 율법에 열심인 사람을 국가에 대하여 음모를 꾸미는 자라고 감히 불렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘공공 사안에 대하여 음모를 꾸미는 자’ 또는 ‘국가 공동체에 대한 음모자’로 옮길 수 있습니다. 이 그리스어 표현은 개인적 적대가 아니라 정치적·공적 성격을 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐεργέτην
  english_pob_choice: benefactor
  chosen_korean: 은인
  alternatives_korean:
  - 혜택을 베푼 사람
  - 공적 은인
  lexicon: LSJ
  rationale: 공동체에 선을 베푼 인물이라는 공적·칭송적 뉘앙스를 살리면서도 한국어에서 자연스럽습니다.
- source_word: κηδεμόνα
  english_pob_choice: guardian
  chosen_korean: 보호자
  alternatives_korean:
  - 수호자
  - 지킴이
  lexicon: LSJ
  rationale: 사람들을 돌보고 지키는 의미를 직접적으로 전달하며, 앞의 칭호들과 평행을 이룹니다.
- source_word: ζηλωτὴν τῶν νόμων
  english_pob_choice: the zealot for the laws
  chosen_korean: 율법들에 대한 열심 있는 이
  alternatives_korean:
  - 율법을 열심히 지키는 자
  - 율법에 열성적인 사람
  lexicon: LSJ
  rationale: νόμων의 복수를 살려 ‘율법들’로 옮기고, ζηλωτής의 강한 헌신을 ‘열심 있는 이’로 표현했습니다. 한국 교회 전통의 ‘열심’ 용례를 쓰되, 본문의 법적·언약적 성격을 유지합니다.
- source_word: ἐπίβουλον τῶν πραγμάτων
  english_pob_choice: a conspirator against the state
  chosen_korean: 국가에 대한 음모자
  alternatives_korean:
  - 국가사를 해치는 음모자
  - 공공사무를 해치는 자
  lexicon: LSJ
  rationale: πραγμάτων의 정치적·공적 힘을 반영하되, English POB가 지적한 대로 단순한 개인적 적대가 아니라 공적 질서에 대한 정치적 비난임을 간결하게 살렸습니다.
- source_word: ἐτόλμα λέγειν
  english_pob_choice: he dared to call
  chosen_korean: 부르기를 감히 했습니다
  alternatives_korean:
  - 말하기를 감히 했습니다
  - 지칭하기를 감히 했습니다
  lexicon: LSJ
  rationale: ‘감히 … 부르다’는 모욕적 호칭을 붙인 행위를 자연스럽게 드러내며, λέγειν의 내용 제시 기능을 한국어로 전달합니다.
theological_decisions:
- issue: νόμοι를 한국어로 어떻게 유지할지
  chosen_reading: ‘율법들’로 복수성을 유지해, 헬레니즘 유대 맥락의 전통적 규범 전체를 가리키는 뉘앙스를 살렸습니다.
  alternative_readings:
  - 율법
  - 법
  rationale: 원문 복수형을 평면화하지 않고, 본문의 정치적·종교적 긴장을 함께 보존하기 위해 복수형을 유지했습니다.
  doctrine_reference: Deuterocanonical historical context; lexical fidelity to Greek plural νόμων
- issue: τῶν πραγμάτων의 공적 의미
  chosen_reading: ‘국가에 대한 음모자’로 옮겨, 공적 사안에 대한 정치적 비난이라는 힘을 살렸습니다.
  alternative_readings:
  - 공공사무에 대한 음모자
  - 공동체의 일에 대한 음모자
  - 국가사의 음모자
  rationale: English POB의 주석이 말하듯, 여기서의 표현은 개인적 원한이 아니라 공적·정치적 함의를 가지므로 그 긴장을 드러내는 번역이 필요합니다.
  doctrine_reference: Historical-political sense of πράγματα in Hellenistic Greek
