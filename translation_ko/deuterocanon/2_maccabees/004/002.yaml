  source_fidelity: 원문의 세 칭호와 ‘감히 …라고 부르다’라는 고발 행위는 대체로 충실히 반영되었습니다. 다만 ἐπίβουλον τῶν πραγμάτων은 공적·정치적 사안에 맞선 음모라는 뜻이므로, ‘국가에 대한 음모자’보다 ‘국가에 대하여 음모를 꾸미는 자’가 한국어에서 관계와 행위를 더 분명히 드러냅니다.
  naturalness: ‘율법들에 대한 열심 있는 이’는 현대 표준 한국어에서 어색합니다. ‘율법에 열심인 사람’이 자연스럽고, 한국어의 집합 명사적 ‘율법’은 여기서 그리스어 복수형의 전통적 규범 전체라는 뜻을 충분히 전달합니다. 나열된 칭호는 쉼표로 구분하는 편이 문장이 명료합니다.
  terminology: ‘은인’, ‘보호자’, ‘동포’, ‘율법’은 적절합니다. ζηλωτής는 특정 정치 집단의 명칭으로 오해되지 않도록 ‘열심인 사람’으로 옮겼습니다. 각주 대안의 ‘공공사무를 꾸미는 자’는 원문의 적대적 음모 의미를 잃으므로 ‘공공 사안에 대하여 음모를 꾸미는 자’로 바로잡아야 합니다.
