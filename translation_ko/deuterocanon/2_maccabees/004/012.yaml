  text: For he gladly established a gymnasium under the very citadel[a], and by bringing the noblest of our young men under the Greek cap, he was leading them on.
  footnotes:
  - marker: a
    text: Or 'under the petasos,' a broad-brimmed Greek hat that functioned here as a visible marker of Hellenistic identity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그 성채 바로 아래에 기꺼이 체육관을 세웠으며, 우리 가운데 가장 뛰어난 이들을 그리스식 모자[a] 아래에 두면서 이끌어 가고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘페타소스 아래에’. 페타소스는 넓은 챙이 있는 그리스 모자로, 여기서는 그리스 문화적 정체성을 드러내는 가시적 표지로 기능합니다.
    reason: lexical_alternative
