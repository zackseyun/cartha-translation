  verdict: revise
  source_fidelity: 수정이 필요합니다. τοὺς κρατίστους τῶν ἐφʼ ἡμῶν은 본문 자체로는 ‘우리 가운데 가장 뛰어난 이들’을 뜻하며, ‘젊은이들’이라는 한정은 헬라식 체육관의 사회적 배경에서는 가능하지만 그리스어에 명시되어 있지 않습니다. 또한 ὑποτάσσων은 단순히 ‘끌어들여’라기보다 그들을 페타소스 아래에 ‘두다/복속시키다’라는 종속의 어감을 지닙니다. ‘예루살렘’을 보태는 것도 이 절의 명시적 표현은 아니므로 본문 번역에서는 생략하는 편이 안전합니다.
  naturalness: ‘그 성채 바로 아래에’와 ‘그리스식 모자 아래에 두면서’는 현대 표준 한국어 문장으로 자연스럽고, 원문의 구체적 이미지와 행위의 종속성을 함께 보존합니다. 미완료 ἦγεν은 ‘이끌어 가고 있었습니다’로 지속성을 드러냈습니다.
  terminology: γυμνάσιον은 제도적·역사적 성격을 고려하면 ‘체육관’으로 옮길 수 있습니다. πέτασος는 본문에서 ‘그리스식 모자’로 이해 가능하게 번역하고, 각주에서 ‘페타소스’라는 명칭과 넓은 챙이라는 형태를 밝혔습니다. ‘헬라적’보다 현대 표준어에서 더 자연스러운 ‘그리스 문화적’을 사용했습니다.
  issues:
  - severity: medium
    issue: ‘젊은이들’이 원문에 없는 연령 한정을 추가합니다.
    rationale: κρατίστους는 ‘가장 뛰어난/탁월한 이들’을 뜻하고, ἐφʼ ἡμῶν은 ‘우리 가운데’를 뜻합니다. 체육관 문맥으로 젊은 남성을 추정할 수 있어도 본문 번역에서는 그 추정을 강제하지 않는 편이 원문 충실합니다.
  - severity: medium
    issue: ‘끌어들여’는 ὑποτάσσων의 종속·복속 어감을 약화합니다.
    rationale: ὑποτάσσω는 ‘아래에 두다, 복속시키다’의 뜻이며, 이어지는 ὑπὸ πέτασον의 구체적 표지 아래에 두는 이미지를 번역에 반영해야 합니다.
  - severity: low
    issue: ‘예루살렘의’는 이 절에 명시되지 않은 지명 보충입니다.
    rationale: 문맥상 성채가 예루살렘의 성채임은 알 수 있으나, 원문이 말하는 ‘그 성채’를 그대로 유지하는 것이 불필요한 보충을 피합니다.
