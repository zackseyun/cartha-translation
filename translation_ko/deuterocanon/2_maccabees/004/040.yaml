  chosen_korean: 분노로 가득 차게 되자
  alternatives_korean:
  - 노여움으로 가득 차게 되자
  - 격분으로 가득 차게 되자
  lexicon: LSJ
  rationale: ὀργαῖς는 단순한 감정보다 격해진 분노를 가리키므로, 현대 한국어에서 자연스럽고 강한 ‘분노’를 택했습니다.
- source_word: κατήρξατο χειρῶν ἀδίκων
  english_pob_choice: began unjust violence
  chosen_korean: 불의한 폭력을 시작하였으며
  alternatives_korean:
