  rationale: ἐπεγειρομένων은 단순한 정적 상태가 아니라 소요가 일어나 행동으로 번지는 뉘앙스를 가지므로, 한국어로는 ‘들고일어나다’가 군중의 동요와 행동 개시를 함께 살립니다.
- source_word: ταῖς ὀργαῖς διεμπιπλαμένων
  english_pob_choice: being filled with anger
  chosen_korean: 분노로 가득 차게 되자
  alternatives_korean:
  - 노여움으로 가득 차게 되자
  - 격분으로 가득 차게 되자
  lexicon: LSJ
  rationale: ὀργαῖς는 단순한 감정보다 격해진 분노를 가리키므로, 현대 한국어에서 자연스럽고 강한 ‘분노’를 택했습니다.
- source_word: κατήρξατο χειρῶν ἀδίκων
  english_pob_choice: began unjust violence
  chosen_korean: 불의한 폭력을 시작하였으며
  alternatives_korean:
  - 불의한 손을 시작하였으며
  - 부당한 폭력을 시작하였으며
  lexicon: LSJ
  rationale: 직역하면 ‘불의한 손들’을 시작했다는 관용구이지만, 한국어에서는 그 의미를 드러내기 위해 ‘불의한 폭력’으로 옮겨 원문의 폭력성과 도덕적 평가를 함께 살렸습니다.
- source_word: πρὸς τρισχιλίους
  english_pob_choice: about three thousand
  chosen_korean: 약 삼천 명
  alternatives_korean:
  - 대략 삼천 명
  - 삼천 명가량
  lexicon: LSJ
  rationale: πρὸς + 수사는 근사치를 나타낼 수 있으므로, ‘약’으로 그 완곡한 수량 표현을 살렸습니다.
- source_word: προηγησαμένου τινὸς Αὑρανοῦ προβεβηκότος τὴν ἡλικίαν, οὐδὲν δὲ ἧττον καὶ τὴν ἄγνοιαν
  english_pob_choice: with a certain Auranus taking the lead, a man advanced in age and no less in ignorance
  chosen_korean: 그보다 먼저 나선 어떤 아우라누스는 나이가 많았지만 무지에서도 그에 못지않았습니다
  alternatives_korean:
  - 어떤 아우라누스가 앞장섰는데, 나이는 많았지만 무지에서도 조금도 덜하지 않았습니다
  - 어떤 아우라누스가 선두에 섰는데, 나이가 많고도 무지에서는 조금도 뒤지지 않았습니다
  lexicon: LSJ
  rationale: προηγησαμένου는 단순한 ‘앞서감’보다 집단 행동의 선도 의미가 강하므로 ‘먼저 나선’으로 옮겼고, οὐδὲν δὲ ἧττον καὶ τὴν ἄγνοιαν의 반어적 대구를 ‘무지에서도 그에 못지않았습니다’로 살렸습니다.
theological_decisions:
- issue: 폭력 행위의 관용구 처리
  chosen_reading: ‘κατήρξατο χειρῶν ἀδίκων’을 문자적 직역보다 의미를 드러내는 ‘불의한 폭력을 시작하였다’로 옮겼습니다.
  alternative_readings:
  - 불의한 손들을 시작하였다
  - 부당한 손을 내밀기 시작하였다
  rationale: 이 표현은 히브리적/헬라적 관용구로서 실제 의미는 불법적 폭력 개시이므로, 독자가 사건의 윤리적 성격을 즉시 이해하도록 의미 중심으로 번역했습니다.
  doctrine_reference: 본문 의미 보존과 관용구 번역 원칙
