    issue: ‘그는 마치 자신이 헬리오도루스를 부추겼고 … 원인이 된 사람인 것처럼’에서 ‘그는/자신’이 시몬을 가리키는 것으로 읽힙니다.
    rationale: ὡς οὗτός τε εἴη 이하의 내용은 시몬이 오니아스에게 씌운 혐의입니다. 따라서 오니아스를 명시하여 행위의 귀속을 바로잡아야 합니다.
