  chosen_korean: 밀고자
  alternatives_korean:
  - 고발자
  - 밀고하는 사람
  lexicon: LSJ
  rationale: 대상에 불리한 정보를 제공하는 적대적 뉘앙스를 살리기 위해, 문맥상 가장 압축적이고 자연스러운 ‘밀고자’를 택했습니다.
- source_word: τῶν χρημάτων
  english_pob_choice: the money
  chosen_korean: 돈
  alternatives_korean:
  - 재물
  - 자금
  - 돈들
  lexicon: LSJ
  rationale: 본문의 plural을 한국어에서 과도하게 기술화하지 않고, 문맥상 성전 재정에 대한 배신이라는 폭넓은 뜻을 유지하는 말로 옮겼습니다.
- source_word: τῶν κακῶν δημιουργός
  english_pob_choice: the author of the troubles
  chosen_korean: 그 재앙의 원인
  alternatives_korean:
  - 그 악의 원인
  - 그 불행의 원인
  - 그 재난의 원인
  lexicon: LSJ
  rationale: κακά를 도덕적 ‘악’보다 사건·피해의 결과로 읽어, 영어 POB의 조정 취지에 맞게 ‘재앙’과 ‘원인’으로 옮겼습니다.
theological_decisions:
- issue: κακά의 범위
  chosen_reading: ‘재앙’으로 옮겨 도덕적 악 자체가 아니라 뒤따른 해악·참사를 가리키게 했습니다.
  alternative_readings:
  - 악
  - 불행
  - 재난
  rationale: 영어 POB의 주석처럼 이 표현은 도덕적 악보다 넓게 해로운 사건들을 가리킬 수 있으므로, 한국어에서도 그 긴장을 보존해야 합니다.
  doctrine_reference: 어휘-의미 범위(lexical semantics)
- issue: 시몬의 행위 묘사
  chosen_reading: ‘밀고자’와 ‘비방하다’로 적대성과 지속성을 함께 드러냈습니다.
  alternative_readings:
  - 고발자
  - 중상하다
  - 헐뜯다
  rationale: 본문의 불명예스러운 사회적·도덕적 평가를 약화시키지 않기 위해, 누적적이고 적대적인 행위를 분명하게 표현했습니다.
  doctrine_reference: 본문 서술의 수사적 기능
