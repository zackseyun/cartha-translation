revisions:
- from: 그러나 앞서 언급된 시몬은 돈과 조국에 대하여 밀고자가 되어 있었고, 오니아스를 비방하기를 그치지 않았습니다. 그는 마치 자신이 헬리오도루스를 부추겼고, 또 그 재앙의 원인이 된 사람인 것처럼 말했습니다.[a]
  to: 그러나 앞서 언급한 시몬은 재물과 조국을 밀고한 자가 되어, 오니아스가 헬리오도루스를 부추기고 그 재앙들의 원인이 된 사람이라고 하며 오니아스를 계속 비방했습니다.[a]
  rationale: 오니아스를 명시하여 원문의 고발 내용이 시몬이 아니라 오니아스에게 귀속됨을 분명히 했습니다. ‘계속 비방했습니다’로 ἐκακολόγει의 미완료상을 반영했고, κακά의 복수 및 광범위한 해악의 뜻을 ‘재앙들’과 각주로 보존했습니다. 재물의 구체적 성격은 본 절만으로 한정하지 않았습니다.
