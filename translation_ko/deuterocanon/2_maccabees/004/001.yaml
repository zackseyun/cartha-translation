  source_fidelity: 수정이 필요합니다. 현 번역은 ‘그는/자신이’의 지시 대상이 문법상 시몬으로 읽혀, 원문에서 시몬이 오니아스를 헬리오도루스를 부추기고 재앙들의 원인이 된 사람이라고 비방했다는 고발의 내용을 뒤바꿉니다. 또한 ἐκακολόγει의 미완료상은 ‘계속 비방했습니다’로 드러내는 것이 적절합니다.
  naturalness: ‘돈과 조국에 대하여 밀고자가 되어 있었고’는 한국어에서 다소 부자연스럽고 ‘되어 있었다’가 완료·상태의 뉘앙스를 불필요하게 강하게 만듭니다. ‘재물과 조국을 밀고한 자가 되어’ 및 ‘…이라고 하며 계속 비방했습니다’는 문맥과 현대 문어체에 더 자연스럽습니다.
  terminology: ‘시몬’, ‘오니아스’, ‘헬리오도루스’의 음역은 적절합니다. χρήματα는 본 절에서 성전 재정을 단정하지 않도록 ‘재물’로, κακά는 도덕적 악으로 한정하지 않도록 ‘재앙들’로 옮기고 대안 의미는 각주로 보존합니다.
