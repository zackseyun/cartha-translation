  yaml_path: translation/deuterocanon/2_maccabees/004/001.yaml
  text: But the previously mentioned Simon[a], who had become an informer against the money and the homeland, kept slandering Onias, as though he were the one who had incited Heliodorus and had become the author of the troubles.
  footnotes:
  - marker: a
    text: Or 'the cause of the evils.' The Greek phrase can refer broadly to harmful events or troubles, not necessarily moral evil alone.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 앞서 언급한 시몬은 재물과 조국을 밀고한 자가 되어, 오니아스가 헬리오도루스를 부추기고 그 재앙들의 원인이 된 사람이라고 하며 오니아스를 계속 비방했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 악들의 원인.’ 그리스어 표현은 도덕적 악만이 아니라 해로운 사건이나 재앙을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
