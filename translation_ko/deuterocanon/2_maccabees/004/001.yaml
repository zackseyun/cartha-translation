  text: But the previously mentioned Simon[a], who had become an informer against the money and the homeland, kept slandering Onias, as though he were the one who had incited Heliodorus and had become the author of the troubles.
  footnotes:
  - marker: a
    text: Or 'the cause of the evils.' The Greek phrase can refer broadly to harmful events or troubles, not necessarily moral evil alone.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 앞서 언급된 시몬은 돈과 조국에 대하여 밀고자가 되어 있었고, 오니아스를 비방하기를 그치지 않았습니다. 그는 마치 자신이 헬리오도루스를 부추겼고, 또 그 재앙의 원인이 된 사람인 것처럼 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 악들의 원인.’ 그리스어 표현은 도덕적 악만이 아니라 해로운 사건이나 재앙을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προειρημένος
  english_pob_choice: previously mentioned
  chosen_korean: 앞서 언급된
  alternatives_korean:
  - 이전에 언급된
  - 이미 언급된
  lexicon: LSJ
  rationale: 직전 문맥을 가리키는 회귀 표현을 자연스러운 현대 한국어로 옮기되, 구어체로 흐르지 않게 했습니다.
- source_word: ἐνδείκτης
