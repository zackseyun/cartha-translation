  source_fidelity: ‘친형제’는 그리스어 ἴδιον ἀδελφόν이 말하지 않는 친형제(동복 형제 또는 형)를 특정하므로 ‘자기 형제’로 고쳐야 합니다. 또한 지명은 통상적인 성서 한국어 표기인 ‘암몬’이 적절합니다. 능동·수동의 동계어 반복과 그에 따른 역전은 유지되어야 합니다.
