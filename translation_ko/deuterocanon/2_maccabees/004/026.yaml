  yaml_path: translation/deuterocanon/2_maccabees/004/026.yaml
  text: And Jason[a], who had supplanted his own brother, having himself been supplanted by another, fled and went into the land of the Ammonites.
  footnotes:
  - marker: a
    text: Or, 'had undermined his own brother ... having himself been undermined by another.' The Greek uses the same verb in active and passive forms to emphasize ironic reversal.
    reason: lexical_alternative
translation:
  language: ko
  text: 한편, 자기 형제를 밀어낸 야손은 자신도 다른 사람에게 밀려나 도망자로 암몬 사람들의 땅으로 들어갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 형제를 음모로 밀어내고, 자신도 다른 사람에게 음모로 밀려난’으로 옮길 수 있습니다. 헬라어는 같은 동사를 능동과 수동으로 써서 역전의 아이러니를 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπονοθεύσας
  english_pob_choice: had supplanted
  chosen_korean: 밀어내고
  alternatives_korean:
