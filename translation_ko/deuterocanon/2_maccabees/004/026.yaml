theological_decisions:
- issue: 서술의 아이러니를 살리는지 여부
  chosen_reading: ‘밀어내고 / 자신도 다른 이에게 밀려나’의 대칭으로, 가해자와 피해자의 역전이 본문에서 의도된 아이러니임을 그대로 드러냈습니다.
  alternative_readings:
  - 그는 형제를 해쳤고, 또 다른 이에게 해를 입어 도망했습니다.
  - 형제를 몰아내다가 자신도 쫓겨났습니다.
  rationale: 원문은 동일 계열 동사의 능동·수동 대조로 도덕적 역전을 강조하므로, 이를 약화시키지 않고 재현하는 것이 본문의 신학적 수사에 부합합니다.
  doctrine_reference: retributive irony / narrative reversal
