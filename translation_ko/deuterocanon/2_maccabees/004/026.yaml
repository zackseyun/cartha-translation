  lexicon: LSJ
  rationale: 직접적인 ‘음모로 대신하다’의 뉘앙스를 살리되, 한국어에서 자연스럽고 문맥상 고위직을 빼앗는 행위를 드러내는 표현으로 옮겼습니다.
- source_word: ὑπονοθευθεὶς
  english_pob_choice: having himself been supplanted
  chosen_korean: 자신도 다른 이에게 밀려나
  alternatives_korean:
  - 자신도 밀려나
  - 자신 또한 음모로 자리에서 쫓겨나
  - 자신도 다른 이에게 밀려나게 되어
  lexicon: LSJ
  rationale: 원문의 같은 동사 계열이 능동/수동으로 반복되어 역전의 아이러니를 이루므로, ‘자신도’와 수동 표현으로 대칭을 살렸습니다.
- source_word: φυγάς
  english_pob_choice: fled
  chosen_korean: 도망쳐 갔습니다
  alternatives_korean:
  - 도망갔습니다
  - 도망자로 갔습니다
  - 도주했습니다
  lexicon: LSJ
  rationale: φυγάς의 ‘도망자’ 성격을 살리면서도 서술문 안에서는 한국어 동사로 자연스럽게 압축했습니다.
- source_word: τὴν Ἀμμανῖτιν χώραν
  english_pob_choice: the land of the Ammonites
  chosen_korean: 아몬 사람들의 땅
  alternatives_korean:
  - 암몬 사람들의 땅
  - 암몬인의 땅
  - 아몬 족속의 땅
  lexicon: LSJ
  rationale: 국명/민족명은 현대 한국어 외래어 표기 관행을 따르되, χώρα의 ‘땅’을 유지해 지리적 귀속을 분명히 했습니다.
- source_word: ὁ τὸν ἴδιον ἀδελφὸν
  english_pob_choice: who had supplanted his own brother
  chosen_korean: 자기의 친형제를
  alternatives_korean:
  - 자기의 형제를
  - 자기 형제를
  - 친형제를
  lexicon: LSJ
  rationale: ἴδιον이 강조하는 ‘자기 자신의’ 관계를 반영해 단순한 ‘형제’보다 더 강한 배신의 맥락을 드러냈습니다.
theological_decisions:
- issue: 서술의 아이러니를 살리는지 여부
  chosen_reading: ‘밀어내고 / 자신도 다른 이에게 밀려나’의 대칭으로, 가해자와 피해자의 역전이 본문에서 의도된 아이러니임을 그대로 드러냈습니다.
  alternative_readings:
  - 그는 형제를 해쳤고, 또 다른 이에게 해를 입어 도망했습니다.
  - 형제를 몰아내다가 자신도 쫓겨났습니다.
  rationale: 원문은 동일 계열 동사의 능동·수동 대조로 도덕적 역전을 강조하므로, 이를 약화시키지 않고 재현하는 것이 본문의 신학적 수사에 부합합니다.
  doctrine_reference: retributive irony / narrative reversal
