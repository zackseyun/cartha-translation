  to: 한편, 자기 형제를 밀어낸 야손은 자신도 다른 사람에게 밀려나 도망자로 암몬 사람들의 땅으로 들어갔습니다.[a]
  rationale: ‘자기 형제’는 ἴδιον의 강조를 보존하면서 원문에 없는 친형제 관계를 덧붙이지 않습니다. ‘밀어낸 / 밀려나’는 ὑπονοθεύσας / ὑπονοθευθείς의 어휘적 대칭을 살립니다. ‘도망자로’는 φυγάς를, ‘들어갔습니다’는 ὑπῆλθεν을 각각 반영합니다. 지명은 ‘암몬’으로 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:48:51Z'
