  - 헬라 문화
  lexicon: LSJ
  rationale: 이 용어는 단순한 민족성이 아니라 그리스식 관습과 문화를 받아들이는 역사적 현상을 가리키므로, 전문성을 유지해 ‘헬레니즘’으로 옮겼습니다.
- source_word: πρόσβασις ἀλλοφυλισμοῦ
  english_pob_choice: an increase of foreign ways
  chosen_korean: 이방 풍습의 확산
  alternatives_korean:
  - 이방 관습의 침투
  - 외래 풍습의 진입
  - 낯선 생활방식의 확대
  lexicon: LSJ
  rationale: 희귀한 πρόσβασις/ἀλλοφυλισμός 결합은 외래적·비유대적 관습의 침투를 뜻하므로, ‘확산’으로 자연스러운 현재적 진행을 살리면서 ‘이방 풍습’으로 그 문화·종교적 이질성을 드러냈습니다.
- source_word: ἀσεβοῦς καὶ οὐκ ἀρχιερέως
  english_pob_choice: who was ungodly and not the high priest
  chosen_korean: 불경한 자요 대제사장이 아닌
  alternatives_korean:
  - 경건하지 않은 자요 대제사장이 아닌
  - 하나님을 두려워하지 않는 자요 대제사장이 아닌
  - 불경하며 대제사장이 아닌
  lexicon: LSJ
  rationale: ἀσεβής는 하나님과 언약에 대한 경외가 결여된 상태를 가리키므로 ‘불경한 자’로, οὐκ ἀρχιερεύς는 야손의 직분 정당성을 부정하는 말이므로 ‘대제사장이 아닌’으로 직설적으로 살렸습니다.
- source_word: ὑπερβάλλουσαν ἀναιδείαν
  english_pob_choice: the surpassing shamelessness
  chosen_korean: 지나친 뻔뻔함
  alternatives_korean:
  - 과도한 무례함
  - 도를 넘는 뻔뻔함
  - 지극한 무참함
  lexicon: LSJ
  rationale: ἀναιδεία는 수치심 없는 태도와 공공연한 무례를 뜻하므로, 비난의 강도를 유지하면서 현대 한국어로 자연스럽게 읽히는 ‘뻔뻔함’에 ‘지나친’을 보탰습니다.
theological_decisions:
- issue: 야손에 대한 공적 평가의 강도
  chosen_reading: 본문의 ‘불경한 자’와 ‘대제사장이 아닌’은 단순한 설명이 아니라, 야손의 직분과 경건성을 정면으로 부정하는 서술로 보았습니다.
  alternative_readings:
  - 야손을 그저 자격 없는 대제사장으로 완곡하게 표현하는 읽기
  - ‘불경한’ 대신 ‘경건하지 않은’으로 낮추는 읽기
  rationale: 헬라어 본문은 야손의 행위를 역사적 사실로 중립 서술하기보다 강한 도덕적 평가를 담고 있으므로, 그 긴장을 약화하지 않도록 직설적 어휘를 유지했습니다.
  doctrine_reference: 번역 원리 §§1, 3, 6
