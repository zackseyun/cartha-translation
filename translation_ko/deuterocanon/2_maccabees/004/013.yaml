  lexicon: LSJ
  rationale: ἀναιδεία는 수치심 없는 태도와 공공연한 무례를 뜻하므로, 비난의 강도를 유지하면서 현대 한국어로 자연스럽게 읽히는 ‘뻔뻔함’에 ‘지나친’을 보탰습니다.
theological_decisions:
- issue: 야손에 대한 공적 평가의 강도
  chosen_reading: 본문의 ‘불경한 자’와 ‘대제사장이 아닌’은 단순한 설명이 아니라, 야손의 직분과 경건성을 정면으로 부정하는 서술로 보았습니다.
  alternative_readings:
  - 야손을 그저 자격 없는 대제사장으로 완곡하게 표현하는 읽기
  - ‘불경한’ 대신 ‘경건하지 않은’으로 낮추는 읽기
  rationale: 헬라어 본문은 야손의 행위를 역사적 사실로 중립 서술하기보다 강한 도덕적 평가를 담고 있으므로, 그 긴장을 약화하지 않도록 직설적 어휘를 유지했습니다.
  doctrine_reference: 번역 원리 §§1, 3, 6
