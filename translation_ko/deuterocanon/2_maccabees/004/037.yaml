    text: ‘죽은 사람’은 ‘고인’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘큰 질서’는 ‘훌륭한 규율’ 또는 ‘바른 행실’로도 이해할 수 있습니다.
