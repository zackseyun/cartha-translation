  text: 그러므로 안티오쿠스는 영혼 깊이 슬퍼하며 연민으로 마음이 돌이켜졌고, 죽은 사람의 절제와 큰 질서를 보고 울었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘연민을 느끼도록 마음이 돌이켜졌다’로 옮길 수 있습니다.
    reason: lexical_alternative
