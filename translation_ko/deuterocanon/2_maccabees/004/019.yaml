- from: 사악한 사람 야손은 예루살렘에서 안티오키아인들을 사절로 보내어, 헤라클레스에 드리는 제사에 쓸 은 드라크마 삼백 닢을 들려 보냈습니다. 그러나 그것을 운반하던 사람들은 그것이 제사에 쓰이지 않기를 요청하였습니다.[a]
  to: 야손이라는 그 사악한 사람은 예루살렘에서 온 사절인 양[a] 안티오키아인들을 보내어, 헤라클레스에게 드리는 제사를 위해 은 드라크마 삼백 닢을 가져가게 하였습니다. 그러나 그것을 가져간 사람들은 그 돈을 제사에 쓰지 말아 달라고 요청하였습니다.
