translation:
  language: ko
  text: 사악한 사람 야손은 예루살렘에서 안티오키아인들을 사절로 보내어, 헤라클레스에 드리는 제사에 쓸 은 드라크마 삼백 닢을 들려 보냈습니다. 그러나 그것을 운반하던 사람들은 그것이 제사에 쓰이지 않기를 요청하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
