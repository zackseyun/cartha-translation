  rationale: 본문은 성전적 표현을 완화하지 않고 이교 신에게 드리는 희생 제사의 목적을 분명히 말하므로, 이를 직접적으로 표기하는 것이 원문의 수사와 신학적 긴장을 보존합니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 운반자들의 거부 표현
  chosen_reading: '''그것이 제사에 쓰이지 않기를 요청하였습니다''로 처리해, 단순한 물건 운반이 아니라 제의적 사용 거부를 드러냈습니다.'
  alternative_readings:
  - 제사에 사용하지 말라고 요청하였습니다
  - 제사에 쓰지 않기를 원하였습니다
  rationale: ἠξίωσαν과 μὴ χρησθαι εἰς θυσίαν의 조합은 단순한 정보 전달보다 목적 사용에 대한 명시적 거부를 뜻하므로, 한국어에서도 그 요청의 내용을 분명히 밝혔습니다.
  doctrine_reference: Translation philosophy §1
