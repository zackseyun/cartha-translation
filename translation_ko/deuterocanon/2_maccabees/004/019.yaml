  lexicon: LSJ
  rationale: 그리스어 어순을 따라 '예루살렘에서'와 '안티오키아인들' 및 '사절로'의 관계를 드러내어, 대표 자격인지 출신지인지의 긴장을 본문 속에 유지했습니다.
- source_word: ἀργυρίου δραχμὰς τριακοσίους
