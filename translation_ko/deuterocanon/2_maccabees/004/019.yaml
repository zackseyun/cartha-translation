  yaml_path: translation/deuterocanon/2_maccabees/004/019.yaml
  text: Jason the vile man sent Antiochians from Jerusalem as envoys, carrying three hundred silver drachmas for the sacrifice to Heracles; but those who carried them requested that they not be used for sacrifice,
  footnotes:
  - marker: a
    text: Or 'as from Jerusalem,' possibly emphasizing that they were sent in a representative capacity from Jerusalem.
    reason: lexical_alternative
translation:
  language: ko
  text: 야손이라는 그 사악한 사람은 예루살렘에서 온 사절인 양[a] 안티오키아인들을 보내어, 헤라클레스에게 드리는 제사를 위해 은 드라크마 삼백 닢을 가져가게 하였습니다. 그러나 그것을 가져간 사람들은 그 돈을 제사에 쓰지 말아 달라고 요청하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “예루살렘을 대표하는 사절로”라고 할 수 있습니다. 그리스어 표현은 이들이 예루살렘에서 실제로 왔다는 뜻일 수도 있고, 예루살렘을 대표하는 자격으로 파견되었다는 뜻일 수도 있습니다.
    reason: lexical_alternative
