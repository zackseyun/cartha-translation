    rationale: 투창기는 일반적으로 던지는 무기이므로 ‘찔러’라는 설명은 부정확합니다. 동사의 어원적 창·투창기 관련성을 언급하되, 구체적 살해 방식의 단정은 피하는 것이 좋습니다.
  - severity: low
