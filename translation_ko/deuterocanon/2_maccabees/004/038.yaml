base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/038.yaml
  text: And[a], inflamed with anger, he immediately stripped off Andronikos's purple robe and tore off his garments, and after leading him around through the whole city to the very place where he had committed his impiety against Onias, there he dispatched the murderer[b], the Lord rendering to him the punishment he deserved.
  footnotes:
  - marker: a
    text: 'Greek μιαφόνον carries a stronger sense than simply ''murderer'': one defiled by bloodshed, a blood-guilty killer.'
    reason: lexical_alternative
  - marker: b
    text: The verb translated 'cut down' is vivid and may imply killing with a spear or similar weapon; the broader sense is that he was executed there.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 분노에 불타 즉시 안드로니코스의 자주빛 겉옷을 벗기고 그의 옷들을 찢어 버린 뒤, 온 도시를 두루 끌고 다니며 그가 오니아스에게 불경을 저질렀던 바로 그곳으로 데려가서는, 거기서 그 살인자를 처단했습니다. 주께서 그에게 마땅한 형벌을 내리신 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 μιαφόνον은 단순히 ‘살인자’보다 더 강한 뉘앙스로, 피를 흘린 일로 더럽혀진 자를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ἀπεκόντισεν은 문자적으로는 창이나 투창기로 찔러 죽이는 뉘앙스를 띨 수 있으나, 문맥상 여기서는 그를 처단하거나 죽였다는 뜻으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πυρωθεὶς τοῖς θυμοῖς
  english_pob_choice: inflamed with anger
  chosen_korean: 분노에 불타
  alternatives_korean:
  - 노여움에 달아올라
  - 화가 치밀어
  lexicon: LSJ
  rationale: 불의 이미지를 살리면서도 한국어에서 자연스럽게 격한 분노를 드러내는 표현입니다.
- source_word: τὴν τοῦ Ἀνδρονίκου πορφύραν
  english_pob_choice: Andronikos's purple robe
  chosen_korean: 안드로니코스의 자주빛 겉옷
  alternatives_korean:
  - 안드로니코스의 자주색 옷
  - 안드로니코스의 자주빛 두루마기
  lexicon: LSJ
  rationale: πορφύρα의 위신과 색채를 살리되, 한국어로는 겉옷이 문맥상 가장 자연스럽습니다.
- source_word: τοὺς χιτῶνας περιρρήξας
  english_pob_choice: tore off his garments
  chosen_korean: 그의 옷들을 찢어 버린 뒤
  alternatives_korean:
  - 그의 옷을 찢고
  - 그의 속옷들을 찢어
  lexicon: LSJ
  rationale: περιρρήξας의 ‘사방으로 찢어내다’는 뉘앙스를 ‘찢어 버린’으로 반영했고, δημόσια humiliation의 효과를 살렸습니다.
- source_word: τὸν μιαφόνον
  english_pob_choice: the murderer
  chosen_korean: 그 살인자
  alternatives_korean:
  - 그 피 묻은 살인자
  - 그 피에 더럽혀진 살인자
  lexicon: LSJ
  rationale: 기본 의미는 살인자이지만, 혈흔/오염의 추가 뉘앙스는 주석 없이 본문에서 과도하게 늘이지 않았습니다.
- source_word: τοῦ κυρίου τὴν ἄξιαν αὐτῷ κόλασιν ἀποδόντος
  english_pob_choice: the Lord rendering to him the punishment he deserved
  chosen_korean: 주께서 그에게 마땅한 형벌을 내리신 것입니다
  alternatives_korean:
  - 주께서 그에게 합당한 형벌을 되갚으신 것입니다
  - 주께서 그에게 그가 받을 سزا를 갚으신 것입니다
  lexicon: LSJ
  rationale: 결말을 하나님의 공의로운 보응으로 분명히 드러내되, 한국어에서 자연스러운 ‘형벌을 내리다’로 옮겼습니다.
theological_decisions:
- issue: κύριος의 번역과 본문의 보응 신학
  chosen_reading: 주께서
  alternative_readings:
  - 주님께서
  - 하나님께서
  rationale: 그리스어의 κύριος를 프로젝트 기본값에 따라 ‘주’로 두고, 행위의 주체가 신적 공의의 실행자임을 분명히 했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → Lord'
- issue: 마지막 절의 해석을 단순한 사건 서술이 아니라 신적 보응으로 드러낼지 여부
  chosen_reading: 주께서 그에게 마땅한 형벌을 내리신 것입니다
  alternative_readings:
  - 주께서 그에게 응당한 벌을 갚으신 것입니다
  - 하나님이 그에게 합당한 벌을 내리신 것입니다
  rationale: 원문의 분사구는 사건의 신학적 해석을 제공하므로, 인간의 처벌이 아니라 주의 보응이라는 점을 본문 안에서 명시했습니다.
  doctrine_reference: DOCTRINE.md §1, §3
