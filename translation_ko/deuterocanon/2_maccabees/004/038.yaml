  source_fidelity: 대체로 원문을 충실히 옮겼습니다. 다만 ἀπεκόντισεν을 ‘처단했습니다’로 번역하면 죽임의 사실보다 사법적·응보적 처벌이라는 의미가 앞서므로, 원문의 직접적인 살해 행위를 ‘죽였습니다’로 옮기는 편이 안전합니다. 또한 원문의 주석 대상인 μιαφόνον과 ἀπεκόντισεν에 해당하는 각주 표지는 해당 낱말 바로 뒤에 두어야 합니다.
  naturalness: 합쇼체 문체는 전반적으로 자연스럽습니다. 그러나 ‘온 도시를 두루 끌고 다니며 … 데려가서는’은 동작이 다소 중복되어 보이고, 마지막의 ‘것입니다’는 원문의 종속적 분사구보다 설명적 어조를 더합니다. 목적어를 명시하고 문장을 간결히 정리하면 더 자연스럽습니다.
  terminology: ‘안드로니코스’, ‘오니아스’, ‘주’, ‘자주빛 겉옷’은 적절합니다. μιαφόνον의 혈오염 뉘앙스는 본문에서 과도하게 풀지 않고 각주로 보완하는 방식이 적절합니다. ἀπεκόντισεν 각주는 투창기를 ‘찔러’ 죽인다는 표현 대신, 창·투창기를 사용하거나 던져 죽이는 어원을 반영하도록 고쳐야 합니다.
  issues:
  - severity: medium
    issue: ἀπεκόντισεν을 ‘처단했습니다’로 번역함
    rationale: ‘처단하다’는 정당한 처벌 또는 공식적 처형을 강하게 암시합니다. 원문은 투창·창과 관련된 동사로 그를 죽였음을 서술하므로, 본문에서는 ‘죽였습니다’가 더 중립적이고 충실합니다.
  - severity: medium
    issue: 각주 표지가 문장 끝에 함께 배치됨
    rationale: '[a]는 μιαφόνον(‘살인자’)의 어휘 뉘앙스, [b]는 ἀπεκόντισεν(‘죽였습니다’)의 동사 뉘앙스를 설명합니다. 각각 해당 표현 직후에 배치해야 각주의 연결 대상이 분명합니다.'
