  yaml_path: translation/deuterocanon/2_maccabees/004/047.yaml
  text: So Ptolemy took him and moved the king into a colonnade[b][a], as though to revive him.
  footnotes:
  - marker: a
    text: Greek ὡς ἀναψύχοντα can also mean 'as though to refresh him' or 'as though to give him relief.'
    reason: lexical_alternative
  - marker: b
    text: The participle ἀπολαβών leaves its object implicit; 'him' is supplied from the context.
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 Ptolemaeus가 그를 데려다가 왕을 회랑으로 옮겼습니다. 마치 그를 회복시키려는 것처럼 말입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ὡς ἀναψύχοντα는 ‘그를 회복시키려는 듯이’ 외에도 ‘그를 시원하게 하려는 듯이’, ‘그에게 안도를 주려는 듯이’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ἀπολαβών은 목적어를 직접 드러내지 않으므로, 한국어에서는 문맥에 따라 ‘그를’이 보충됩니다.
    reason: alternative_reading
