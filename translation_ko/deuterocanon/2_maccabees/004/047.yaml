  yaml_path: translation/deuterocanon/2_maccabees/004/047.yaml
  text: So Ptolemy took him and moved the king into a colonnade[b][a], as though to revive him.
  footnotes:
  - marker: a
    text: Greek ὡς ἀναψύχοντα can also mean 'as though to refresh him' or 'as though to give him relief.'
    reason: lexical_alternative
  - marker: b
    text: The participle ἀπολαβών leaves its object implicit; 'him' is supplied from the context.
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 프톨레마이오스는 왕을[b] 데리고 어느 기둥 회랑으로 옮겼습니다. 마치 왕이 기운을 되찾게 하려는 듯이[a] 말입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ὡς ἀναψύχοντα는 ‘마치 왕을 상쾌하게 하려는 듯이’ 또는 ‘마치 왕에게 안도를 주려는 듯이’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 ἀπολαβών은 목적어를 직접 드러내지 않습니다. 여기서는 뒤에 나오는 ‘왕’이 그 생략된 목적어로 이해됩니다.
    reason: alternative_reading
