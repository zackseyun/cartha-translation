translation:
  language: ko
  text: 하느님의 법들을 거슬러 불경한 일을 하는[a] 것은 쉽지 않습니다. 그러나 이어지는 때가 이 일들을 분명히 드러낼[b] 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하느님의 법들을 거슬러 불경하게 행하는 것.’ 그리스어 동사는 무례함보다는 신적 법에 대한 불경하거나 경건하지 않은 행위를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘뒤이어 오는 때가 이것을 드러낼 것입니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσεβεῖν
  english_pob_choice: to act wickedly
  chosen_korean: 악을 행하는 것
  alternatives_korean:
  - 불경하게 행하는 것
  - 경건하지 않게 행하는 것
  - 불의를 저지르는 것
  lexicon: BDAG
  rationale: 동사 ἀσεβεῖν은 단순한 내면 태도보다 실제로 드러나는 불경한 행위를 가리키므로, 한국어에서는 행위성을 살린 '악을 행하는 것'으로 옮겼습니다.
- source_word: θείους
  english_pob_choice: divine
  chosen_korean: 하느님의
  alternatives_korean:
  - 신적인
  - 거룩한
  - 하나님의
  lexicon: LSJ
  rationale: 문맥상 '하느님께 속한 법들'이라는 의미가 분명하므로, 형용사 'divine'을 추상적으로 두기보다 소유·귀속을 드러내는 표현으로 풀었습니다.
- source_word: νόμους
  english_pob_choice: laws
  chosen_korean: 법들
  alternatives_korean:
  - 율법
  - 계명
  - 법
  lexicon: LSJ
  rationale: 복수형 νόμους를 그대로 살려 '법들'로 옮겼습니다. '율법'은 전형적 종교 용어로 좁아질 수 있어 여기서는 복수의 규범성을 드러내는 일반어가 더 적절합니다.
- source_word: ὁ ἀκόλουθος καιρός
  english_pob_choice: the time that follows
  chosen_korean: 뒤따르는 때
  alternatives_korean:
  - 오는 때
  - 이어지는 때
  - 뒤따를 때
  lexicon: LSJ
  rationale: ἀκόλουθος의 '뒤따르는, 이어지는' 의미를 살리면서도 한국어 어순에 자연스럽게 맞도록 '뒤따르는 때'로 옮겼습니다.
- source_word: δηλώσει
  english_pob_choice: will make these things clear
  chosen_korean: 이 일들을 분명히 드러낼 것입니다
  alternatives_korean:
  - 이것들을 보여 줄 것입니다
  - 이 일들을 드러낼 것입니다
  - 이것들을 밝힐 것입니다
  lexicon: BDAG
  rationale: δηλόω는 '분명히 알게 하다, 드러내다'의 뜻이므로, 결과의 분명함을 살려 '분명히 드러낼 것입니다'로 옮겼습니다.
theological_decisions:
- issue: '문장의 핵심 뉘앙스: 단순한 난이도인가, 도덕적·신학적 엄중함인가'
  chosen_reading: 하느님의 법을 거스르는 일은 가볍거나 사소한 문제가 아니며, 뒤이어 오는 때가 그 성격을 분명히 드러낸다는 뜻으로 읽었습니다.
  alternative_readings:
  - 그저 '하기 어렵다'는 실용적 진술
  - 더 직접적인 '심판' 선언을 포함한 경고
  rationale: 그리스어는 '쉽지 않다'는 표현을 쓰지만, 앞뒤 문맥상 단순 난이도보다 불경의 중대성과 그 결과의 드러남을 강조합니다. 다만 본문에 없는 '심판'을 과도하게 보태지는 않았습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
