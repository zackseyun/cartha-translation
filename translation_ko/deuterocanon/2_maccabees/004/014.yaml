base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/014.yaml
  text: so that the priests were no longer eager for the services of the altar[a], but, despising the temple and neglecting the sacrifices, they hurried to take part in the unlawful exercise in the wrestling school after the summons to the discus throw[b];
  footnotes:
  - marker: a
    text: Or 'lawless sponsorship,' 'illegal allowance,' or 'forbidden provision.' The Greek expression is difficult and may refer to support or provision connected with the athletic activities.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'after the summons of the discus.' This refers to the call to participate in the athletic event.
    reason: cultural_note
translation:
  language: ko
  text: 그리하여 제사장들은 더 이상 제단의 예식들에 열심을 내지 않았고, 성전을 멸시하며 제물을 소홀히 여기고는, 씨름학교에서의 불법적인 공급[a]에 참여하려고 원반던지기 소집[b] 뒤에 서둘러 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불법적인 후원’, ‘불법적인 지원’, ‘금지된 제공’으로도 옮길 수 있습니다. 그리스어 표현은 뜻이 분명하지 않아 체육 활동과 연결된 지원이나 공급을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘원반의 소집 뒤에’입니다. 이는 경기 참여를 알리는 호출을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: λειτουργίας
  english_pob_choice: services
  chosen_korean: 예식들
  alternatives_korean:
  - 섬김
  - 봉사
  - 직무
  lexicon: LSJ
  rationale: 제단에서의 제사장 직무라는 제의적 의미를 살리면서, 현대 한국어에서 자연스럽고 교회 제도 용어로 과도하게 기울지 않도록 했습니다.
- source_word: παλαίστρῃ
  english_pob_choice: wrestling school
  chosen_korean: 씨름학교
  alternatives_korean:
  - 팔라이스트라
  - 레슬링 학교
  - 운동장
  lexicon: LSJ
  rationale: 고대 체육 훈련장을 가리키는 말이므로, 현대 독자가 이해할 수 있게 하면서도 장소의 성격을 드러내는 표현으로 옮겼습니다.
- source_word: παρανόμου χορηγίας
  english_pob_choice: unlawful exercise
  chosen_korean: 불법적인 공급
  alternatives_korean:
  - 불법적인 후원
  - 불법적인 지원
  - 불법적인 수당
  lexicon: LSJ
  rationale: χoρηγία의 핵심에는 ‘제공/공급/후원’의 폭이 있고, 문맥상 운동 경기와 관련된 지원이므로 ‘공급’으로 넓게 잡아 의미의 긴장을 보존했습니다.
- source_word: τοῦ δίσκου πρόσκλησιν
  english_pob_choice: summons to the discus throw
  chosen_korean: 원반던지기 소집
  alternatives_korean:
  - 원반던지기 호출
  - 원반던지기 초청
  - 원반 경기 소집
  lexicon: LSJ
  rationale: πρόσκλησις의 ‘소집/호출’ 성격을 살리되, δίσκος를 단순 사물이 아니라 경기 맥락의 원반던지기로 풀어 현대어로 이해 가능하게 했습니다.
theological_decisions:
- issue: 제사장들의 태도 변화가 단순한 취미 변화가 아니라 성전 예식과 제물에 대한 경시로 제시됨
  chosen_reading: ‘성전을 멸시하며 제물을 소홀히 여기고는’으로 옮겨, 원문의 도덕적·종교적 비판을 완화하지 않았습니다.
  alternative_readings:
  - 성전을 가볍게 여기며 제물을 무시하고
  - 성전을 업신여기며 제사를 등한시하고
  rationale: 본문은 체육 활동 참여 자체보다 제사장 직무의 포기와 성전 경시를 비판하므로, 그 긴장을 분명히 드러내는 것이 원문에 충실합니다.
  doctrine_reference: 원문 의미 보존과 제의적 긴장 유지
- issue: παρανόμου의 법적/윤리적 뉘앙스
  chosen_reading: ‘불법적인’으로 옮겨, 유대 율법에 어긋나는 판단을 너무 특정하지 않으면서도 강한 부정 평가를 유지했습니다.
  alternative_readings:
  - 법에 어긋나는
  - 불법의
  - 율법을 어기는
  rationale: 그리스어 자체는 범위가 넓으므로, 본문이 말하는 비난의 강도는 살리되 해석을 한 방향으로 과도하게 고정하지 않았습니다.
  doctrine_reference: 원어의 의미 범위 보존
