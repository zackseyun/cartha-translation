revisions:
- from: 그리하여 제사장들은 더 이상 제단의 예식들에 열심을 내지 않았고, 성전을 멸시하며 제물을 소홀히 여기고는, 씨름학교에서의 불법적인 공급[a]에 참여하려고 원반던지기 소집[b] 뒤에 서둘러 갔습니다.
  to: 그리하여 제사장들은 더 이상 제단에서의 직무에 열심을 내지 않았습니다. 그들은 성전을 멸시하고 제사를 등한시한 채, 원반 경기의 소집이 있은 뒤에는 씨름 훈련장에서 이루어지는 법에 어긋나는 지원[a]에 참여하려고 서둘렀습니다.[b]
  rationale: 제단의 λειτουργίαι를 ‘제단에서의 직무’로 명확히 하고, 성전 멸시와 제사 등한시의 병렬을 자연스럽게 유지했습니다. χορηγία의 난해함은 본문에서 지나치게 특정하지 않은 ‘지원’과 각주의 대안으로 보존했습니다. 또한 원반 경기 호출 뒤에 팔라이스트라의 활동으로 서두르는 원문의 시간·행동 관계를 한국어 문장 안에서 자연스럽게 재구성했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:48:53Z'
review_pass:
  verdict: revise
  source_fidelity: ‘불법적인 공급에 참여하다’는 한국어에서 의미 결합이 매우 부자연스럽고, χορηγία의 불확정적인 의미를 보존하려는 의도에도 불구하고 본문 흐름을 흐립니다. 또한 ‘예식들’은 λειτουργία가 가리키는 제단에서의 제사장 직무보다 다소 좁고 의례 형식에 치우칩니다. ‘원반던지기 소집’도 현대 한국어에서 어색합니다.
  naturalness: 합쇼체 문장 자체는 유지되어 있으나, ‘씨름학교’, ‘불법적인 공급에 참여’, ‘원반던지기 소집 뒤에’가 모두 직역투로 겹쳐 자연스러운 공적 문체를 해칩니다. ‘씨름 훈련장’, ‘법에 어긋나는 지원’, ‘원반 경기의 소집이 있은 뒤’가 더 자연스럽습니다.
  terminology: λειτουργίαι는 ‘제단에서의 직무’로 옮겨 제사장 봉사의 의미를 살렸습니다. παλαίστρα는 현대 독자가 이해할 수 있는 ‘씨름 훈련장’으로, παρανόμου χορηγίας는 본문에서 ‘법에 어긋나는 지원’으로 옮기되 각주에서 제공·후원 등의 미확정성을 명시했습니다. ‘불법적인’은 현대 한국어에서 주로 국가의 실정법 위반을 연상시키므로 ‘법에 어긋나는’이 원문의 넓은 부정적 판단을 더 잘 보존합니다.
  issues:
