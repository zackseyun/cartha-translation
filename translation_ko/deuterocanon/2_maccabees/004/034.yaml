    reason: lexical_alternative
  - marker: c
    text: 문맥상 더 강하게 ‘그를 죽였다’ 또는 ‘그를 죽이게 했다’는 뜻을 시사할 수 있습니다. 그러나 그리스어 동사 자체는 이를 직접적으로 말하지 않습니다.
