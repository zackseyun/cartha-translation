  rationale: 어형 자체는 난해하지만 문맥상 오니아스의 살해를 꾸미는 의미이므로, 음모의 성격을 살려 옮겼습니다.
- source_word: ἔπεισεν ἐκ τοῦ ἀσύλου προελθεῖν
