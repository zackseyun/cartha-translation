  lexicon: LSJ
  rationale: ἄσυλον의 보호받는 장소라는 뜻을 살리면서도 한국어로는 과도하게 제도적이지 않은 '피난처'가 자연스럽습니다.
- source_word: οὐκ αἰδεσθεὶς τὸ δίκαιον
