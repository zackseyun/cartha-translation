  yaml_path: translation/deuterocanon/2_maccabees/004/004.yaml
  text: When Onias saw the severity of the rivalry[a], and that Apollonius son of Menestheus, the governor of Coele-Syria and Phoenicia, was increasing Simon’s wickedness[b],
  footnotes:
  - marker: a
    text: Or 'the strife' or 'the contentiousness' for 'the rivalry' (φιλονεικίας).
    reason: lexical_alternative
  - marker: b
    text: Greek στρατηγόν can mean 'general' or 'commander'; here it is rendered 'governor' because the phrase refers to Apollonius's administrative authority over Coele-Syria and Phoenicia.
    reason: lexical_alternative
translation:
  language: ko
  text: 오니아스가 그 경쟁의 심각함을 보고, 그리고 코일레 시리아와 페니키아의 총독인 메네스테우스의 아들 아폴로니오스가 시몬의 악함을 더욱 키우고 있는 것도 보았습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 다툼’ 혹은 ‘그 논쟁적 성격’으로도 옮길 수 있습니다(φιλονεικίας).
    reason: lexical_alternative
  - marker: b
    text: 여기서 στρατηγόν은 ‘장군’이나 ‘사령관’이 될 수 있으나, 코일레 시리아와 페니키아에 대한 행정 권한을 가리키므로 ‘총독’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνορῶν
  english_pob_choice: When Onias saw
  chosen_korean: 오니아스가 … 보고
  alternatives_korean:
  - 오니아스가 … 알아보고
  - 오니아스가 … 인식하고
  lexicon: LSJ
  rationale: 분사 συνορῶν은 오니아스의 인지 상황을 배경으로 제시하므로, 자연스러운 한국어 서술로 ‘보고’라고 옮겨 선행 맥락을 살렸습니다.
- source_word: τὸ χαλεπὸν τῆς φιλονεικίας
  english_pob_choice: the severity of the rivalry
  chosen_korean: 그 경쟁의 심각함
  alternatives_korean:
  - 그 다툼의 심각함
  - 그 경쟁의 격렬함
  - 그 경쟁의 어려움
  lexicon: LSJ
  rationale: φιλονεικία는 단순한 싸움보다 경쟁적 대립·다툼의 뉘앙스가 있어 ‘경쟁’으로, χαλεπόν은 그 성격의 중대함을 드러내는 ‘심각함’으로 옮겼습니다.
- source_word: στρατηγόν
  english_pob_choice: the governor
  chosen_korean: 총독
  alternatives_korean:
  - 장군
  - 사령관
  - 지방관
  lexicon: LSJ
  rationale: 이 문맥에서는 στρατηγός가 군사직칭보다 코일레 시리아와 페니키아를 관할하는 행정 권한을 가리키므로, 영어 POB의 ‘governor’에 맞춰 ‘총독’이 가장 적절합니다.
- source_word: συναύξοντα τὴν κακίαν
  english_pob_choice: was increasing Simon’s wickedness
  chosen_korean: 시몬의 악함을 더욱 키우고 있는 것도
  alternatives_korean:
  - 시몬의 악을 더하고 있는 것도
  - 시몬의 악행을 조장하고 있는 것도
  - 시몬의 악함을 증폭시키고 있는 것도
  lexicon: LSJ
  rationale: συναύξοντα는 단순히 ‘함께 자라게 함’보다 이미 존재하는 악을 더 심화·증대시키는 뜻이므로 ‘더욱 키우고 있는’으로 렌더링했습니다.
- source_word: κακίαν
  english_pob_choice: wickedness
  chosen_korean: 악함
  alternatives_korean:
  - 악
  - 악의
  - 사악함
  lexicon: LSJ
  rationale: κακία는 행위의 도덕적 악함을 가리키므로, 전통적 교회어보다 직접적인 ‘악함’이 문맥상 자연스럽고 의미를 넓게 보존합니다.
theological_decisions:
- issue: 공적 직함 στρατηγός의 번역
  chosen_reading: 총독으로 옮겨, 단순 군사 지휘관이 아니라 행정·통치 권한을 가진 인물로 읽히게 했습니다.
  alternative_readings:
  - 장군으로 번역해 군사적 의미를 강조하는 읽기
  - 사령관으로 번역해 지휘권을 강조하는 읽기
  rationale: 영어 POB가 행정적 권위를 근거로 governor를 택한 만큼, 본문 청중이 오해 없이 인물을 파악하도록 행정 직함을 유지했습니다.
  doctrine_reference: 본문의 역사 서술과 직분 이해
