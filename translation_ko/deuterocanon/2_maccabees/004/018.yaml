  text: Now when the quadrennial games were being held in Tyre[a], and the king was present,
  footnotes:
  - marker: a
    text: Greek πενταετηρικοῦ is literally 'five-year,' but in festival usage it commonly refers to games celebrated every four years by inclusive counting.
