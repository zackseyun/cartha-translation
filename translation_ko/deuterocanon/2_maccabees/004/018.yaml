  rationale: 티레의 시민 축제 맥락에서 공적인 경기 행사를 가리키므로 ‘경기’가 간결하면서도 의미 범위를 잘 유지합니다.
- source_word: τοῦ βασιλέως παρόντος
  english_pob_choice: and the king was present
  chosen_korean: 왕도 उपस्थित해 있었습니다
  alternatives_korean:
