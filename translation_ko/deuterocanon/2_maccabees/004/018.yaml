translation:
  language: ko
  text: 티레에서 4년마다 열리는 경기가 열리고 있었고, 왕도 참석해 있었습니다,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 πενταετηρικοῦ는 문자적으로 ‘다섯 해의’라는 뜻에 가깝지만, 축제 용례에서는 보통 포괄적 계산에 따라 4년마다 열리는 행사를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀγομένου
  english_pob_choice: were being held
  chosen_korean: 진행되고 있었고
  alternatives_korean:
  - 열리고 있었고
  - 개최되고 있었고
  lexicon: LSJ
  rationale: 축제나 경기의 진행 상황을 자연스럽게 나타내면서, 수동적 뉘앙스를 살려 원문의 ‘거행/개최’ 감각을 보존합니다.
