  rationale: 원문은 문자적으로 ‘오년’ 형태지만 축제 용례에서는 포괄적 계산으로 4년 주기를 가리키므로, 한국어에는 실제 주기를 드러내는 표현이 가장 정확합니다.
- source_word: ἀγῶνος
  english_pob_choice: games
  chosen_korean: 경기
  alternatives_korean:
  - 대회
  - 경기 대회
