base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/039.yaml
  text: But when many acts of temple robbery had been committed in the city by Lysimachus[a], with the consent of Menelaus, and the report had spread outside, the crowd gathered against Lysimachus[b], since much gold had already been plundered.
  footnotes:
  - marker: a
    text: Or 'many sacrileges'; the Greek term more specifically denotes robbery of sacred or temple property.
    reason: lexical_alternative
  - marker: b
    text: Or 'the rumor had spread outside.' The Greek φήμη can mean 'report,' 'news,' or 'rumor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 리시마쿠스가 메넬라오스의 동의 아래 시내에서 성전 재산을 약탈한 일이 여러 차례 있었고,[a] 그 소식이 밖으로 퍼지자,[b] 이미 많은 금붙이가 약탈당한 터였으므로 군중이 리시마쿠스에게 맞서 모였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성전 재산을 약탈한 일’. 그리스어는 일반적인 ‘불경’보다 성소 재산을 훔치거나 약탈하는 행위를 더 구체적으로 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘소문이 밖으로 퍼지자’. φήμη는 ‘보고’, ‘소문’, ‘소식’을 모두 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱεροσυλημάτων
  english_pob_choice: acts of temple robbery
  chosen_korean: 성전 재산을 여러 차례 도둑질한 일
  alternatives_korean:
  - 성물에 대한 약탈
  - 성전 약탈 행위
  - 신성모독적 절도
  lexicon: LSJ
  rationale: ἱεροσυλία 계열은 단순한 경건 훼손이 아니라 성전/성물에 대한 절도를 가리키므로, 한국어에서는 ‘성전 재산’과 ‘도둑질’로 구체화해 오해를 줄였습니다.
- source_word: μετὰ τῆς τοῦ Μενελάου γνώμης
  english_pob_choice: with the consent of Menelaus
  chosen_korean: 메넬라오스의 동의 아래
  alternatives_korean:
  - 메넬라오스의 승인 아래
  - 메넬라오스의 뜻에 따라
  - 메넬라오스의 묵인 아래
  lexicon: LSJ
  rationale: γνώμη는 단순한 의견보다 동의·승인·의중을 포함할 수 있어, 본문 맥락의 공모성을 살리면서도 ‘동의 아래’로 과도한 행위 주도성을 피했습니다.
- source_word: διαδοθείσης ... τῆς φήμης
  english_pob_choice: the report had spread
  chosen_korean: 이 소문이 밖으로 퍼지자
  alternatives_korean:
  - 이 보고가 밖으로 퍼지자
  - 이 소식이 퍼지자
  - 이 소문이 널리 퍼지자
  lexicon: LSJ
  rationale: φήμη는 ‘보고/소문/소식’을 모두 가질 수 있으나, 여기서는 사건의 확산을 자연스럽게 드러내는 ‘소문’이 적절합니다.
- source_word: χρυσωμάτων
  english_pob_choice: gold
  chosen_korean: 금붙이
  alternatives_korean:
  - 금
  - 금붙이들
  - 금붙이와 금품
  lexicon: LSJ
  rationale: χρυσώματα는 단순한 추상적 ‘금’보다 금으로 된 귀중품을 가리킬 수 있어, 한국어에서는 물품성을 살린 ‘금붙이’가 문맥에 맞습니다.
theological_decisions:
- issue: ἱεροσυλημάτων의 의미 범위
  chosen_reading: 본문은 일반적 ‘불경’이 아니라 성전과 성물에 대한 절도라는 구체적 죄를 말합니다.
  alternative_readings:
  - 성전모독의 일반적 행위
  - 단순한 신성모독
  rationale: 영어 POB의 ‘acts of temple robbery’와 그 주석처럼, 그리스어는 성소 재산의 약탈을 지시하므로 역사적·신학적 중량을 흐리지 않도록 직접적으로 옮겼습니다.
  doctrine_reference: 원문 우선 번역 원칙; 용어의 역사적·법적 중량 보존
