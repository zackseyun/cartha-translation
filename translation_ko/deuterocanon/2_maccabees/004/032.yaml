base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/032.yaml
  text: But Menelaus[a], thinking that he had found a favorable opportunity, embezzled some of the gold vessels of the temple and gave them as a gift to Andronicus[b], and he had managed to sell others in Tyre and the surrounding cities.
  footnotes:
  - marker: a
    text: Or 'some gold objects' or 'certain golden articles.' The Greek term refers generally to gold items from the temple.
    reason: lexical_alternative
  - marker: b
    text: Or 'he happened to have sold others to Tyre and the surrounding cities.' The Greek expression may be rendered more literally, though the sense is that other items had already been sold there.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 메넬라오스는 자신이 적절한 기회를 잡았다고 생각하고, 성전의 금그릇 몇 개를 빼돌려 안드로니코스에게 주었으며, 또 다른 것들은 이미 티레와 그 주변 도시들에 팔아넘겼습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성전의 금붙이 몇 가지’, ‘황금으로 된 물건 몇 가지’로도 옮길 수 있습니다. 그리스어는 성전에서 나온 금 물품 전반을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이미 티레와 그 주변 도시들에 팔아넘겼습니다’처럼 현재 완료적 상태를 자연스럽게 풀어 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: νομίσας
  english_pob_choice: thinking that he had found a favorable opportunity
  chosen_korean: 자신이 적절한 기회를 잡았다고 생각하고
  alternatives_korean:
  - 좋은 기회를 얻었다고 여기고
  - 유리한 때가 왔다고 생각하고
  lexicon: LSJ
  rationale: 행동 직전의 내적 판단을 나타내므로, 과도하게 문어적인 표현보다 현대 한국어에서 자연스러운 ‘~했다고 생각하고’로 옮겼습니다.
- source_word: χρυσώματά τινα
  english_pob_choice: some of the gold vessels
  chosen_korean: 성전의 금그릇 몇 개
  alternatives_korean:
  - 성전의 금붙이 몇 가지
  - 성전의 금으로 된 물건 몇 개
  lexicon: LSJ
  rationale: 문맥상 성전 소유의 금 제의용 기물로 이해되므로, 의미를 너무 넓히지 않으면서도 한국어 독자가 이해하기 쉬운 ‘금그릇’으로 구체화했습니다.
- source_word: νοσφισάμενος
  english_pob_choice: embezzled
  chosen_korean: 빼돌려
  alternatives_korean:
  - 횡령하여
  - 불법으로 유용하여
  lexicon: LSJ
  rationale: 성전 물건을 부정하게 자기 마음대로 처리한 뉘앙스를 살리면서도, 본문 흐름에 맞게 간결하고 현대적인 동사로 옮겼습니다.
- source_word: ἐχαρίσατο
  english_pob_choice: gave them as a gift
  chosen_korean: 주었으며
  alternatives_korean:
  - 선물로 주었으며
  - 호의를 베풀어 주었으며
  lexicon: LSJ
  rationale: 중간태의 ‘호의로 주다’는 뉘앙스가 있으나, 여기서는 안드로니코스에게 넘긴 사실을 간명하게 드러내는 ‘주었습니다’가 본문에 가장 충실합니다.
- source_word: ἐτύγχανεν πεπρακὼς
  english_pob_choice: he had managed to sell
  chosen_korean: 이미 … 팔아넘겼습니다
  alternatives_korean:
  - 이미 … 팔았습니다
  - 우연히 … 팔았습니다
  lexicon: LSJ
  rationale: 이미 매각이 이루어진 상태를 나타내며, 결과적으로 처분해 버렸다는 맥락이 있어 ‘팔아넘기다’가 부정적 뉘앙스를 잘 전달합니다.
theological_decisions:
- issue: 성전 물건의 불법 처분을 나타내는 동사 강도
  chosen_reading: 노σφισάμενος를 ‘빼돌려’로 옮겨, 단순한 이동이 아니라 성전 재산의 부정한 유용과 은닉을 드러냈습니다.
  alternative_readings:
  - 횡령하여
  - 훔쳐
  rationale: 이 본문은 성전의 거룩한 재산을 사적 이익을 위해 처분한 죄를 고발하므로, 지나치게 법률 용어화하지 않으면서도 도덕적·제의적 중대성을 유지해야 합니다.
  doctrine_reference: 성전 재산의 거룩함과 배신성 강조
- issue: ἐχαρίσατο의 호의적 ‘줌’ 뉘앙스
  chosen_reading: ‘주었습니다’로 기본 의미를 살리고, 전체 문맥으로 그가 매수·환심 사기 목적이었다는 점을 드러냈습니다.
  alternative_readings:
  - 선물로 주었습니다
  - 베풀었습니다
  rationale: 중간태가 지닌 호의적 표면 의미를 지나치게 확장하지 않되, 본문의 부패한 거래 정황을 과장 없이 전달하는 것이 적절합니다.
  doctrine_reference: 본문 서술의 아이러니 보존
