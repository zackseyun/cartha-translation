translation:
  language: ko
  text: 이 일들과 관련하여 메넬라오스를 상대로 법적 절차가 시작되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 κρίσις는 ‘판단’이라는 뜻도 있지만, 여기서는 메넬라오스를 상대로 제기된 법적 사건 또는 절차를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ τούτων
  english_pob_choice: Now concerning these matters
  chosen_korean: 이 일들에 관해서는
  alternatives_korean:
  - 그러나 이 일들에 관하여
  - 이 문제들에 대해
  lexicon: LSJ
  rationale: περὶ + 속격은 ‘~에 관하여’의 주제 전환을 나타내므로, 합쇼체 문장 흐름에 맞게 간결한 주제 표지로 옮겼습니다.
- source_word: ἐνέστη
  english_pob_choice: was brought
  chosen_korean: 재판이 열렸습니다
  alternatives_korean:
  - 재판이 시작되었습니다
  - 법적 절차가 개시되었습니다
  lexicon: LSJ
  rationale: 문맥상 κρίσις와 결합해 법적 절차의 개시를 뜻하므로, 한국어에서는 ‘열리다’가 자연스럽게 그 시작을 드러냅니다.
- source_word: κρίσις
  english_pob_choice: a judicial hearing
  chosen_korean: 재판
  alternatives_korean:
  - 사법 심리
  - 법적 심리
  - 판결
  lexicon: LSJ
  rationale: κρίσις의 핵심 법정 의미를 살리되, 현대 한국어 독자가 바로 이해할 수 있는 일반 법정 용어를 선택했습니다.
- source_word: ἐπὶ τὸν Μενέλαον
  english_pob_choice: against Menelaus
  chosen_korean: 메넬라오스를 상대로
  alternatives_korean:
  - 메넬라오스를 향해
  - 메넬라오스에 대해
  lexicon: LSJ
  rationale: 법정 맥락의 ἐπί + 대격은 ‘~을 상대로/대하여’의 대립 방향을 나타내므로, 소송 대상임을 분명히 했습니다.
