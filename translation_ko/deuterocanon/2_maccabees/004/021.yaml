base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/021.yaml
  text: When Apollonius son of Menestheus had been sent to Egypt for the accession festivities of King Philometor[a], Antiochus, learning that he had become estranged from his own affairs, took thought for his own security. Therefore, after arriving at Joppa, he went on to Jerusalem.
  footnotes:
  - marker: a
    text: Or, 'learning that he was alienated from matters concerning himself.' The Greek phrase is compressed and may refer more broadly to Antiochus' political disadvantage in his own affairs.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 메네스테우스의 아들 아폴로니오스가 필로메토르 왕의 즉위 축제를 위하여 이집트로 파견되었을 때, 안티오코스는 자신이 자기에게 일어난 사정과 동떨어져 있음을[a] 알고 자기 안전을 염려하였습니다. 그래서 야포에 도착한 뒤 예루살렘으로 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘자기에게 일어난 일들에서 소외되어 있음을 알고’. 그리스어 표현은 압축되어 있으며, 더 넓게는 안티오코스가 자신의 정치적 사정에서 불리한 처지에 놓였음을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποσταλέντος
  english_pob_choice: had been sent
  chosen_korean: 파견되었을 때
  alternatives_korean:
  - 보내졌을 때
  - 파견된 뒤
  lexicon: LSJ
  rationale: 부사적 분사로서 선행 상황을 나타내므로, 한국어에서는 자연스럽게 시간 종속 구조인 ‘-었을 때’로 풀어 의미와 흐름을 살렸습니다.
- source_word: διὰ τὰ προτοκλήρια
  english_pob_choice: for the accession festivities
  chosen_korean: 즉위 축제를 위해
  alternatives_korean:
  - 즉위 경축 행사에
  - 취임 축하를 위해
  lexicon: LSJ
  rationale: 희귀한 복수 명사는 통치자의 즉위와 연결된 축제를 가리키므로, 지나치게 직역하지 않고 역사적 맥락이 드러나는 ‘즉위 축제’를 택했습니다.
- source_word: ἀλλότριον αὐτὸν τῶν αὐτοῦ γεγονότων πραγμάτων
  english_pob_choice: that he had become estranged from his own affairs
  chosen_korean: 이것이 자기 자신의 일과는 관계없는 일임을 알고
  alternatives_korean:
  - 자기 일에서 소외되었음을 알고
  - 자기 처지와는 동떨어졌음을 알고
  lexicon: LSJ
  rationale: 그리스어 구문이 압축되어 있어, ‘estranged’의 소외·무관함의 뉘앙스를 살리되 안티오코스가 아니라 사건 자체가 그의 이해관계와 무관해졌다는 뜻이 드러나도록 옮겼습니다.
- source_word: τῆς καθʼ αὑτὸν ἀσφαλίας ἐφρόντιζεν
  english_pob_choice: took thought for his own security
  chosen_korean: 자기 안전을 염려하였습니다
  alternatives_korean:
  - 자기 안전을 살피고 있었습니다
  - 자기 보호를 걱정하였습니다
  lexicon: LSJ
  rationale: ἐφρόντιζεν의 지속적·의도적 관심을 한국어의 ‘염려하다’로 간결하게 옮겨, 정치적 안전을 챙기는 뉘앙스를 유지했습니다.
- source_word: παραγενόμενος / κατήντησεν
  english_pob_choice: after arriving at Joppa, he went on to Jerusalem
  chosen_korean: 야포에 도착한 뒤 예루살렘으로 갔습니다
  alternatives_korean:
  - 야포에 이른 뒤 예루살렘에 이르렀습니다
  - 야포에 들른 뒤 예루살렘으로 향하였습니다
  lexicon: LSJ
  rationale: 연속된 이동을 한국어에서 자연스럽게 처리하기 위해, 도착과 이동을 각각 ‘도착한 뒤’와 ‘갔습니다’로 나누어 중복을 피했습니다.
theological_decisions:
- issue: Βασιλεύς의 고유칭과 פילომήτωρ의 처리
  chosen_reading: ‘왕 필로메토르’로 두어, 왕호를 직역하지 않고 고유한 역사적 칭호로 보존했습니다.
  alternative_readings:
  - ‘어머니를 사랑하는 왕’으로 직역
  - ‘필로메토르 왕’으로 전면 음역
  rationale: 필로메토르는 이집트 왕의 통용되는 호칭이므로, 의미 번역보다 역사적 식별성이 우선입니다. 한국어 본문에서는 자연스러운 호칭과 고유명 보존을 함께 고려했습니다.
  doctrine_reference: Translate titles; transliterate names.
