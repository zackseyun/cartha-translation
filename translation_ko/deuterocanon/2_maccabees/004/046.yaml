  text: But Menelaus[a], already having been won over, promised Ptolemy son of Dorymenes a considerable amount of money to persuade the king.
  footnotes:
  - marker: a
    text: Or 'already having been ingratiated' or 'already having been won over favorably.' The Greek participle λελιμμένος is somewhat difficult and may suggest that Menelaus had already secured Ptolemy's favorable disposition before making this monetary promise.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 메넬라오스는 이미 매수된 상태였으므로, 돌리메네스의 아들 프톨레마이오스에게 왕을 설득하게 하려고 상당한 돈을 약속했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '이미 호의를 얻은' 혹은 '이미 좋은 쪽으로 마음이 기울어진'으로도 옮길 수 있습니다. 그리스어 λελιμμένος는 다소 어려운 표현으로, 메넬라오스가 돈을 약속하기 전에 이미 프톨레마이오스의 호의적인 태도를 확보했음을 시사할 수 있습니다.
    reason: lexical_alternative
