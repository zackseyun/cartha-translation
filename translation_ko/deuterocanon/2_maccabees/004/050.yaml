  naturalness: ‘직분에 머물러 있었고’는 한국어에서 다소 부자연스럽고 종교적 직무를 특별히 연상시킬 수 있습니다. ‘그 직위에 계속 머물러 있으면서’가 현대 공적 문체에 더 자연스럽습니다. 또한 ‘자기 동포들에게 큰 음모자’는 조사 결합과 수식 관계가 어색하므로 ‘자기 동료 시민들을 해치는 악명 높은 음모자가’로 명료하게 옮겼습니다.
