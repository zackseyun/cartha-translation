- from: 그러나 메넬라오스는 권세자들의 탐욕 때문에 직분에 머물러 있었고, 악을 더해 가며 자기 동포들에게 큰 음모자가 되어 있었습니다.
  to: 그러나 메넬라오스[a]는 권력을 쥔 자들의 탐욕 때문에 그 직위에 계속 머물러 있으면서, 악을 더해 가고 자기 동료 시민들을 해치는 악명 높은 음모자가 되어 있었습니다.
  rationale: ‘직분’을 ‘그 직위’로 바꾸어 ἀρχή의 공적 권위·직위 의미를 보존했습니다. 현재분사 ἐπιφυόμενος는 ‘악을 더해 가고’로 점진성을 유지했습니다. 완료분사 καθεστώς는 ‘되어 있었습니다’로 결과적 상태를 나타냈으며, μέγας ἐπίβουλος는 한국어의 자연스러운 부정적 강조를 위해 ‘동료 시민들을 해치는 악명 높은 음모자’로 옮겼습니다. 이는 특정 교리적 해석을 더하지 않는 서술적 번역입니다.
