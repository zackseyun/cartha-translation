translation:
  language: ko
  text: 그러나 메넬라오스는 권세자들의 탐욕 때문에 직분에 머물러 있었고, 악을 더해 가며 자기 동포들에게 큰 음모자가 되어 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τὰς τῶν κρατούντων πλεονεξίας
  english_pob_choice: because of the greed of those in power
  chosen_korean: 권세자들의 탐욕 때문에
  alternatives_korean:
  - 권력을 쥔 자들의 탐욕으로
  - 통치자들의 탐욕 때문에
  lexicon: LSJ
  rationale: διά + 대격의 인과 의미를 자연스럽게 살리고, κρατοῦντων은 정치적 권세를 가진 자들을 가리키므로 ‘권세자들’로 옮겼습니다.
- source_word: ἔμενεν ἐπὶ τῇ ἀρχῇ
  english_pob_choice: remained in office
  chosen_korean: 직분에 머물러 있었고
  alternatives_korean:
  - 직위에 머물러 있었고
  - 권력 자리에 남아 있었고
  lexicon: LSJ
  rationale: ἀρχή는 단순한 추상적 ‘권세’보다 실제 직분·직위의 맥락이 강하므로, 행정적/공적 자리를 드러내는 ‘직분’으로 번역했습니다.
- source_word: ἐπιφυόμενος τῇ κακίᾳ
  english_pob_choice: growing in wickedness
  chosen_korean: 악을 더해 가며
  alternatives_korean:
  - 악에서 자라 가며
  - 악함이 커져 가며
  lexicon: LSJ
  rationale: 현재분사는 상태의 진행과 증대를 나타내므로, ‘더해 가며’로 점층적 악화의 뉘앙스를 살렸습니다.
- source_word: μέγας τῶν πολιτῶν ἐπίβουλος καθεστώς
  english_pob_choice: having become a great plotter against his fellow citizens
  chosen_korean: 자기 동포들에게 큰 음모자가 되어 있었습니다
  alternatives_korean:
  - 자기 동포들을 해치는 큰 모사가 되어 있었습니다
  - 동포들을 상대로 큰 계책을 꾸미는 자가 되어 있었습니다
  lexicon: LSJ
  rationale: ἐπίβουλος는 ‘음모자/해코지하는 자’의 의미가 핵심이므로 ‘큰 음모자’로 직역성을 유지했고, τῶν πολιτῶν은 시민 공동체를 가리켜 ‘자기 동포들’로 풀었습니다.
theological_decisions:
- issue: 메넬라오스의 도덕적 상태를 서술하는 현재분사와 완료적 상태 표현
  chosen_reading: ‘악을 더해 가며 ... 되어 있었습니다’로 진행성과 परिण्र 상태를 함께 드러냈습니다.
  alternative_readings:
  - ‘악해지며 ... 되었습니다’
  - ‘악이 커지며 ... 된 상태였습니다’
  rationale: 본문은 단순 사건 보고가 아니라 악의 진행과 그 결과로 굳어진 상태를 함께 보여 주므로, 한국어에서도 두 층위를 모두 보존했습니다.
  doctrine_reference: 서술적 역사본문의 윤리적 평가 보존
