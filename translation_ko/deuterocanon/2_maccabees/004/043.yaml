translation:
  language: ko
  text: 이러한 이유로 그들은 그들 가운데 많은 사람에게 상처를 입혔고, 몇 사람은 쓰러뜨렸으며, 그들 모두를 도망치게 하였고, 그 성물 모독자[a] 자신은 보물창고 곁에서 붙잡았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성물 모독자’. 그리스어 용어는 특히 성전을 약탈하는 자를 가리키는 신성모독의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
