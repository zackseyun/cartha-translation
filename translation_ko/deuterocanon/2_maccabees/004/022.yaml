  yaml_path: translation/deuterocanon/2_maccabees/004/022.yaml
  text: And he was received with great splendor by Jason and the city[a], and was welcomed with a torchlight procession and shouts; then in this way he encamped in Phoenicia.
  footnotes:
  - marker: a
    text: Or 'with torch-bearing and acclamations.' The Greek describes a ceremonial public welcome marked by torches and loud cries.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 야손과 그 성읍 사람들에게 성대하게 영접을 받았고, 횃불 행렬과 함성[a] 가운데 맞이되었습니다. 그러한 환영을 받은 뒤, 그는 페니키아에 진을 쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “횃불을 들고 환호하며.” 그리스어는 횃불을 든 의례적 환영과 큰 외침을 묘사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγαλομερῶς
  english_pob_choice: with great splendor
  chosen_korean: 큰 성대함으로
  alternatives_korean:
  - 화려하게
  - 장엄하게
  - 성대하게
  lexicon: LSJ
  rationale: 공식적이고 의례적인 환영의 분위기를 살리면서도, 과장된 사치의 뉘앙스로 치우치지 않도록 했습니다.
- source_word: ἀποδεχθεὶς / εἰσεδέχθη
  english_pob_choice: was received / was welcomed
  chosen_korean: 영접을 받았으며 … 환영을 받았습니다
  alternatives_korean:
  - 맞이받았으며 … 들여보내졌습니다
  - 받아들여졌으며 … 환영받았습니다
  lexicon: LSJ
  rationale: 두 동사의 반복을 살리되, 첫 번째는 공식적 접견, 두 번째는 그에 따른 환대의 뉘앙스를 살려 구분했습니다.
- source_word: δᾳδουχίας
  english_pob_choice: a torchlight procession
  chosen_korean: 횃불 행진
  alternatives_korean:
  - 횃불을 든 행렬
  - 횃불 행렬
  lexicon: LSJ
  rationale: 단순히 횃불이 있었다는 뜻보다, 의례적 행렬이라는 공적 환영의 형식을 드러내는 표현으로 옮겼습니다.
- source_word: βοῶν
  english_pob_choice: shouts
  chosen_korean: 함성
  alternatives_korean:
  - 외침
  - 환호
  lexicon: LSJ
  rationale: 공적 환영에서 터져 나오는 큰 외침을 자연스럽게 담되, 단순한 소리보다 집단적 환호의 성격을 살렸습니다.
- source_word: κατεστρατοπέδευσεν
  english_pob_choice: he encamped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 야영했습니다
  - 캠프를 쳤습니다
  lexicon: LSJ
  rationale: 군사적·원정적 배경을 드러내는 동사로, 한국어에서는 관용적으로 '진을 치다'가 가장 적절합니다.
theological_decisions:
- issue: 의례적 환영의 중복 표현(받다/영접하다/환영하다)을 어떻게 처리할지
  chosen_reading: 두 동사를 모두 살려, 공식 영접과 그에 따른 의례적 환영을 구분해 번역했습니다.
  alternative_readings:
  - 한 번의 '환영을 받았다'로 합쳐서 간단히 번역
  - 둘 다 '영접하다'로 평행 번역
  rationale: 원문은 ἀποδεχθεὶς와 εἰσεδέχθη를 병치해 공적 수용의 장면을 강조하므로, 한국어에서도 중복을 단순 삭제하지 않고 의미 차이를 보존했습니다.
  doctrine_reference: 서사 본문의 행위 묘사 보존 원칙
