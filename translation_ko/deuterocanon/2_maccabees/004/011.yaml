base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/011.yaml
  text: And he set aside the royal provisions laid down for the Jews through John[a], the father of Eupolemus—the one who had carried out the embassy to the Romans concerning friendship and alliance—and, while abolishing the lawful institutions[b], he introduced unlawful customs.
  footnotes:
  - marker: a
    text: Or 'the benevolent royal measures' or 'the humane royal decrees' for the Jews.
    reason: lexical_alternative
  - marker: b
    text: Or 'lawful institutions' or 'lawful civic order.' The Greek term can refer broadly to a community's established civic constitution or public order.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 요한[a]을 통해, 곧 유폴레모의 아버지인 그 요한을 통해 유대인들을 위해 마련된 왕의 호의적인 조치들을 제쳐 두고, 로마인들과의 우정과 동맹에 관한 사절단을 수행한 그 사람의 일을 무시한 채, 합법적인 시민적 질서를 무너뜨리면서 불법한 관습들을 새로 들여왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유대인들을 위한 왕의 호의적인 조치들’
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ κείμενα τοῖς Ἰουδαίοις φιλάνθρωπα βασιλικὰ
  english_pob_choice: the royal provisions laid down for the Jews
  chosen_korean: 유대인들을 위해 마련된 왕의 호의적인 조치들
  alternatives_korean:
  - 유대인들을 위한 왕의 규정들
  - 유대인들을 위한 왕의 은혜로운 칙령들
  - 유대인들을 위한 왕의 특혜들
  lexicon: LSJ
  rationale: κείμενα는 이미 제정되어 '마련된' 상태를, φιλάνθρωπα βασιλικά는 유대인들에게 유리한 왕의 호의적 조치를 가리키므로, 법령처럼 딱딱하지 않게 호의와 제도성을 함께 살렸습니다.
- source_word: παρώσας
  english_pob_choice: set aside
  chosen_korean: 제쳐 두고
  alternatives_korean:
  - 무시하고
  - 내버려 두고
  - 거절하고
  lexicon: LSJ
  rationale: 기존의 왕의 조치들을 밀어내듯 무시하는 뉘앙스를 살리되, 과도한 법적 폐기를 뜻하는 표현은 피했습니다.
- source_word: πρεσβείαν
  english_pob_choice: the embassy
  chosen_korean: 사절단
  alternatives_korean:
  - 외교 사절
  - 공식 사절단
  - 외교 사절단
  lexicon: LSJ
  rationale: 로마인들과의 우정과 동맹을 위한 공식 외교 임무이므로, 현대 한국어에서 자연스러운 사절단으로 옮겼습니다.
- source_word: νομίμους ... πολιτίας
  english_pob_choice: lawful institutions / lawful forms of government
  chosen_korean: 합법적인 시민적 질서
  alternatives_korean:
  - 합법적인 제도들
  - 합법적인 공공 질서
  - 합법적인 정치 질서
  lexicon: LSJ
  rationale: πολιτεία는 단순 제도보다 공동체의 공적·시민적 질서를 포함하므로, '시민적 질서'로 넓게 옮겨 헬레니즘적 공공질서의 감각을 살렸습니다.
- source_word: παρανόμους ἔθισμους
  english_pob_choice: unlawful customs
  chosen_korean: 불법한 관습들
  alternatives_korean:
  - 율법에 어긋난 관습들
  - 불법적인 관행들
  - 법에 어긋난 풍습들
  lexicon: LSJ
  rationale: ἔθισμους는 관습/풍습의 반복적 성격을, παράνομους는 법과 질서에 어긋남을 가리키므로 두 요소를 간결하게 결합했습니다.
theological_decisions:
- issue: 왕의 호의적 조치와 유대인의 공적 질서의 대비
  chosen_reading: 왕의 호의적인 조치들을 제쳐 두고 합법적인 시민적 질서를 무너뜨렸다고 옮겨, 후원적 조치의 철회와 헬라화된 새 관행의 도입이라는 대조를 드러냈습니다.
  alternative_readings:
  - 왕의 특혜를 폐지하고 합법적인 제도를 무너뜨렸다고 옮길 수 있음
  - 왕의 규정을 없애고 합법적인 정치 질서를 무너뜨렸다고 옮길 수 있음
  rationale: 본문의 초점은 단순 행정 변경이 아니라 유대 공동체의 기존 공적 질서를 대체하는 행위이므로, 대조 구조를 분명히 드러내는 번역을 택했습니다.
  doctrine_reference: 번역 원칙 §1, §5
