review_pass:
  verdict: revise
  source_fidelity: 초안은 왕의 조치들을 ‘제쳐 두고’ 기존 질서를 무너뜨린 뒤 불법적인 관습을 도입했다는 주된 대조를 대체로 반영합니다. 그러나 요한의 외교 사절 수행을 ‘그 사람의 일을 무시한 채’로 옮긴 것은 원문에 없는 내용을 삽입한 것입니다. 또한 ‘요한을 통해’가 불필요하게 반복되어 문장 구조가 흐려집니다. 그리스어의 관계절은 유폴레모의 아버지인 요한을 수식하며, 요한이 로마인들과의 우호와 동맹을 위한 사절 임무를 수행했음을 설명합니다.
  naturalness: ‘시민적 질서’는 이 문맥에서 다소 번역투이고 현대 표준 한국어 성경 문체로는 어색할 수 있습니다. ‘합법적인 제도들’은 πολιτεία의 공적·제도적 범위를 무리 없이 포괄하면서 자연스럽습니다. ‘불법한’보다는 ‘불법적인’이 현대 합쇼체 문장에 더 자연스럽습니다.
  terminology: φιλάνθρωπα βασιλικά는 유대인들에게 유리하게 마련된 왕의 호의로운 조치로, ‘왕의 호의로운 조치들’이 적절합니다. πρεσβεία는 사람들의 집단인 ‘사절단’보다 수행된 외교적 ‘사절 임무’로 옮기는 편이 정확합니다. νομίμους πολιτείας는 특정 현대 정치 체제를 뜻하지 않도록 ‘합법적인 제도들’로 번역했습니다.
