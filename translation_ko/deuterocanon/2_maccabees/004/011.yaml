    rationale: διὰ Ἰωάννου는 한 번만 번역하면 되며, 뒤의 동격 설명을 통해 요한의 신원을 밝히면 됩니다.
  - severity: low
    issue: ‘합법적인 시민적 질서’ 및 ‘불법한 관습들’
