revisions:
- from: 그리고 그는 요한[a]을 통해, 곧 유폴레모의 아버지인 그 요한을 통해 유대인들을 위해 마련된 왕의 호의적인 조치들을 제쳐 두고, 로마인들과의 우정과 동맹에 관한 사절단을 수행한 그 사람의 일을 무시한 채, 합법적인 시민적 질서를 무너뜨리면서 불법한 관습들을 새로 들여왔습니다.
  to: 그리고 그는 로마인들과 우호와 동맹을 맺기 위한 사절 임무를 수행했던 유폴레모의 아버지 요한을 통하여 유대인들을 위해 마련되어 있던 왕의 호의로운 조치들[a]을 물리치고, 합법적인 제도들을 폐지하면서 불법적인 관습들을 새로 도입했습니다.
  rationale: 요한이 수행한 외교 사절 임무를 요한을 수식하는 설명으로 바로잡고, 그 임무를 ‘무시했다’는 원문에 없는 내용을 삭제했습니다. διὰ Ἰωάννου가 왕의 호의로운 조치들이 요한을 통하여 마련된 경로를 나타내도록 문장을 재구성했습니다. 정치·공동체적 제도라는 πολιτεία의 폭을 유지하면서도 과도하게 현대적인 함의를 피하기 위해 ‘합법적인 제도들’을 사용했습니다.
  reviewer_model: gpt-5.6-terra
