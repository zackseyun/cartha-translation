  lexicon: LSJ
  rationale: 직역하면 ‘아무것도 질서 있게 정리하지 않았다’는 뜻이지만, 여기서는 왕에게 약속한 금액에 대한 지불 준비가 없었다는 의미가므로 한국어로는 ‘준비’가 가장 명확합니다.
theological_decisions:
- issue: 약속한 돈에 대한 행위의 의미
  chosen_reading: 메넬라오스는 왕에게 약속한 금액을 이행할 의사나 준비를 보이지 않았다는 뜻으로 옮겼습니다.
  alternative_readings:
  - 왕에게 실제로 한 푼도 내지 않았다는 뜻으로 옮길 수 있습니다.
  - 돈을 정리하거나 배정하지 않았다는 행정적 의미로 읽을 수 있습니다.
  rationale: 헬라어 동사 εὐτακτέω는 ‘질서 있게 마련하다/준비하다’의 뜻이므로, 문맥상 지불 이행의 부재를 드러내되 과도하게 ‘지불했다’고 단정하지 않는 표현을 택했습니다.
