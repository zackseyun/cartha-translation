translation:
  language: ko
  text: 그런데 메넬라오스는 직분은 유지하고 있었지만, 왕에게 약속한 돈에 대해서는 아무런 준비도 하지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 분명하게, ‘왕에게 약속한 돈을 한 푼도 내지 않았다.’ 헬라어는 문자적으로 그가 약속한 돈에 관해 ‘아무것도 질서 있게 정리하지 않았다’고 말합니다.
    reason: lexical_alternative
