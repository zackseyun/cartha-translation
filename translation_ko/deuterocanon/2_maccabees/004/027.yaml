  text: But Menelaus held on to the office[a], yet he made no provision at all for the money he had promised to the king.
  footnotes:
  - marker: a
    text: Or, more explicitly, 'he paid nothing toward the money he had promised to the king.' The Greek says literally that he 'set in order/arranged nothing' concerning the promised money.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 메넬라오스는 그 직위는 유지하고 있었지만, 왕에게 약속한 돈에 대해서는 아무런 준비도 하지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 명시적으로, “왕에게 약속한 돈을 한 푼도 내지 않았다.” 헬라어는 문자적으로 그가 약속한 돈에 관하여 “아무것도 질서 있게 마련하지 않았다”라고 말합니다.
    reason: lexical_alternative
