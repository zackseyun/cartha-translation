lexical_decisions:
- source_word: πρὸς τὸν βασιλέα διεκοσμήθη
  english_pob_choice: he presented himself to the king
  chosen_korean: 왕에게 나아가 보였으며
  alternatives_korean:
  - 왕 앞에 자신을 드러냈으며
  - 왕에게 나아갔으며
  - 왕에게 나아가 자신을 보였으며
  lexicon: LSJ
  rationale: διακοσμέω의 수동형은 궁정 맥락에서 단순한 외양 장식보다 ‘정중하게 나아가 보이다/출두하다’의 뉘앙스가 더 자연스럽습니다. 한국어에서는 ‘나아가 보이다’로 품위와 접근의 뉘앙스를 함께 살렸습니다.
- source_word: οὐ γινόμενος
  english_pob_choice: not becoming
  chosen_korean: …되지 않고
  alternatives_korean:
  - 고발자가 되지 않고
  - 고발하는 자로 나서지 않고
  - 고발자로 변하지 않고
  lexicon: LSJ
  rationale: 분사구문이 행위의 방식과 태도를 나타내므로, 본문 흐름에 맞게 ‘되지 않고’로 옮겼습니다. 직역하면 어색해지므로 ‘고발하는 자가 되지’로 풀어 의미를 분명히 했습니다.
- source_word: τῶν πολιτῶν κατήγορος
  english_pob_choice: an accuser of his fellow citizens
  chosen_korean: 자기 동포들을 고발하는 자
  alternatives_korean:
  - 자기 동포들의 고발자
  - 자기 시민들의 고발자
  - 자기 동포들을 고소하는 자
  lexicon: LSJ
  rationale: πολῖται는 단순한 ‘시민’보다 공동체 안의 동료 구성원을 가리키므로, 문맥상 관계성을 살려 ‘자기 동포들’로 옮겼습니다. κατήγορος는 법정적 ‘고발자/고소인’의 뜻이므로 ‘고발하는 자’가 자연합니다.
- source_word: τὸ δὲ σύμφορον κοινῇ καὶ κατʼ ἰδίαν
  english_pob_choice: what was advantageous both publicly and privately
  chosen_korean: 공적으로나 사적으로나 유익한 일
  alternatives_korean:
  - 공동체를 위해서나 개인적으로나 유익한 것
  - 공적으로나 개인적으로나 이로운 것
  - 공동의 유익과 사적인 유익
  lexicon: LSJ
  rationale: σύμφορον은 ‘유익한 것/유리한 것’의 중성 명사적 용법이므로 한국어에서 ‘유익한 일’로 자연스럽게 명사화했습니다. κοινῇ καὶ κατʼ ἰδίαν은 공적·사적 양면을 대비하므로 ‘공적으로나 사적으로나’로 살렸습니다.
- source_word: παντὶ τῷ πλήθει
  english_pob_choice: the whole multitude
  chosen_korean: 온 무리 전체
  alternatives_korean:
  - 온 백성 전체
  - 모든 무리
  - 온 사람들 전체
  lexicon: LSJ
  rationale: πλῆθος는 ‘무리, 군중, 다수’의 폭넓은 집합을 가리키므로, 인원을 지나치게 평준화하지 않고 ‘온 무리 전체’로 옮겼습니다.
theological_decisions:
- issue: 공적·사적 유익의 병렬 구조
  chosen_reading: 본문은 왕 앞에서 동포를 고발하지 않으면서, 공동체와 개별 사람 모두에게 유익한 일을 추구했다는 태도를 드러냅니다.
  alternative_readings:
  - ‘공동의 이익과 각 개인의 이익’으로 더 분명히 풀 수도 있습니다.
  - ‘공적으로와 사적으로’가 행위 방식의 대비인지, 유익의 대상 대비인지 조금 더 넓게 볼 수도 있습니다.
  rationale: 문법적으로 압축된 대구이므로 의미를 과도하게 좁히지 않고, 공적·사적 유익의 균형이라는 본문 의도를 그대로 드러내는 것이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; optimal equivalence'
