base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/048.yaml
  text: And he released Menelaus[a], the cause of all the evil, from among the accused; but for those wretched men—who, even if they had pleaded their case before Scythians[c][b], would have been acquitted—for them he decreed death.
  footnotes:
  - marker: a
    text: 'Literally, ''who, even if they had spoken before Scythians, would have been released uncondemned.'' The reference to Scythians heightens the irony: even a people stereotyped as harsh would have judged them innocent.'
    reason: cultural_note
  - marker: b
    text: Or 'would have been acquitted' for 'would have been released as innocent.'
    reason: lexical_alternative
  - marker: c
    text: Or 'he sentenced them to death.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 그는 모든 악의 원흉인 메넬라오스를 고발당한 사람들 가운데서 풀어 주었지만, 그 불쌍한 사람들에게는—그들은 설령 스키타이인들 앞에서 변론했더라도[a] 무죄로 풀려났을[b] 사람들이었는데도—사형을 선고하였습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 스키타이인들은 고대 문헌에서 흔히 매우 거칠고 잔혹한 민족으로 묘사됩니다. 여기서는 그들 앞에서조차 이 사람들이 무죄로 인정받았을 것이라는 수사적 대비가 사용됩니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘무죄 판결을 받았을’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그들에게 죽음을 판결하였습니다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν μὲν τῆς ὅλης κακίας αἴτιον Μενέλαον
  english_pob_choice: the cause of all the evil
  chosen_korean: 모든 악의 원흉인 메넬라오스
  alternatives_korean:
  - 모든 악의 원인인 메넬라오스
  - 온갖 악의 책임자인 메넬라오스
  lexicon: LSJ
  rationale: αἴτιος는 단순한 ‘원인’보다 책임을 지는 장본인이라는 뉘앙스가 있어, judicial force를 살려 ‘원흉’으로 옮겼습니다.
- source_word: ἀπέλυσεν τῶν κατηγορημένων
  english_pob_choice: released ... from among the accused
  chosen_korean: 고발된 자들 가운데서 풀어 주었지만
  alternatives_korean:
  - 기소된 자들 가운데서 석방했지만
  - 피고들 가운데서 풀어 주었지만
  lexicon: BDAG
  rationale: ἀπολύω는 ‘석방하다/풀어 주다’의 뜻을 살리고, τῶν κατηγορημένων은 형식적인 법정 용어보다 ‘고발된 자들’이 자연스럽고 원문에 가깝습니다.
- source_word: ταλαιπώροις
  english_pob_choice: wretched men
  chosen_korean: 그 불쌍한 사람들
  alternatives_korean:
  - 그 비참한 사람들
  - 그 가련한 사람들
  lexicon: LSJ
  rationale: 문맥상 억울하게 처형될 처지의 처참함을 나타내므로, 지나치게 거칠지 않으면서도 연민을 드러내는 표현을 택했습니다.
- source_word: οἵτινες εἰ καὶ ἐπὶ Σκυθῶν ἔλεγον ἀπελύθησαν ἀκατάγνωστοι
  english_pob_choice: who, even if they had pleaded their case before Scythians, would have been acquitted
  chosen_korean: 설령 스키타이인들 앞에서 변론했더라도 무죄로 풀려났을 사람들이었는데
  alternatives_korean:
  - 설령 스키타이인들 앞에서 말했더라도 무죄 판결을 받았을 사람들이었는데
  - 설령 스키타이인들 앞에서 호소했더라도 죄 없다고 풀려났을 사람들이었는데
  lexicon: LSJ
  rationale: ἐπὶ + genitive의 법정적 용법을 ‘앞에서’로, ἔλεγον을 ‘변론하다’로 옮겨 심문/재판 맥락을 분명히 했습니다. ἀκατάγνωστοι는 ‘무죄로 풀려나다’로 결과를 자연스럽게 드러냈습니다.
- source_word: θάνατον ἀπέκρινεν
  english_pob_choice: he decreed death
  chosen_korean: 사형을 선고하였습니다
  alternatives_korean:
  - 죽음을 선고하였습니다
  - 사형을 결정하였습니다
  lexicon: LSJ
  rationale: ἀποκρίνω는 이 문맥에서 판결/결정을 내리는 뜻이므로, 한국어 법률어감이 분명한 ‘사형을 선고하다’로 옮겼습니다.
theological_decisions:
- issue: 스키타이인들 언급의 기능
  chosen_reading: 스키타이인들은 극단적으로 야만적이라고 여겨지는 대상의 예시로 유지하여, 무죄가 더 명백하게 드러나는 수사적 대비를 살렸습니다.
  alternative_readings:
  - 단순한 지리적 언급으로만 처리
  - 현대 독자 친화적으로 완화
  rationale: 본문의 아이러니는 ‘그들 앞에서도 무죄였을 것’이라는 과장된 대비에 있으므로, 문화적 낯섦을 지우지 않고 유지했습니다.
  doctrine_reference: 서사·수사 이해
