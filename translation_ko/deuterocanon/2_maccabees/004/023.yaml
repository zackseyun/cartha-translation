  yaml_path: translation/deuterocanon/2_maccabees/004/023.yaml
  text: But after a period of three years[a], Jason sent Menelaus, the brother of the aforementioned Simon, to carry the money to the king and to deliver memoranda concerning necessary matters.
  footnotes:
  - marker: a
    text: Or 'to finalize written reports concerning necessary matters.' The Greek ὑπομνηματισμοὺς can refer to memoranda or written reports, and the exact administrative nuance is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 세 해가 지난 뒤, 야손은 앞서 언급한 시몬의 형제인 메넬라오스를 왕에게 돈을 가져가고 필요한 일들에 관한 문서들을 처리하게 하려고 보냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘필요한 일들에 관한 서면 보고를 완결하게 하려고’. 그리스어 ὑπομνηματισμούς는 메모, 문서, 보고서 등을 가리킬 수 있으며, τελέσοντα는 이를 수행하거나 처리하고 완결하는 일을 뜻할 수 있어 정확한 행정적 뉘앙스는 확정하기 어렵습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τριετῆ χρόνον
  english_pob_choice: But after a period of three years
  chosen_korean: 그러나 세 해가 지난 뒤
  alternatives_korean:
  - 그리고 세 해 뒤에
  - 하지만 삼 년 후에
  lexicon: LSJ
  rationale: μετά + 대격은 시간의 경과 후를 나타내므로, 자연스러운 현대 한국어로 ‘세 해가 지난 뒤’라고 옮겼습니다. δέ는 약한 전환이어서 ‘그러나’로 처리했습니다.
- source_word: τὸν τοῦ προσηνομένου Σίμωνος ἀδελφόν
  english_pob_choice: the brother of the aforementioned Simon
  chosen_korean: 앞서 언급한 시몬의 형제
  alternatives_korean:
  - 언급된 시몬의 형제
  - 이미 말한 시몬의 형제
  lexicon: LSJ
  rationale: προσηνομένου는 바로 앞서 언급된 인물을 가리키므로, 문맥상 가장 분명한 한국어인 ‘앞서 언급한’으로 옮겼습니다.
- source_word: παρακομίζοντα τὰ χρήματα τῷ βασιλεῖ
  english_pob_choice: to carry the money to the king
  chosen_korean: 왕에게 돈을 가져가게 하고
  alternatives_korean:
  - 왕에게 돈을 운반하게 하고
  - 왕에게 그 돈을 전달하게 하고
  lexicon: LSJ
  rationale: παρακομίζοντα는 단순한 이동보다 ‘함께 가져가 전달하는’ 뉘앙스를 가지므로, 목적절 형태로 자연스럽게 ‘가져가게 하고’로 처리했습니다.
- source_word: ὑπομνηματισμοὺς τελέσοντα
  english_pob_choice: to deliver memoranda concerning necessary matters
  chosen_korean: 필요한 일들에 관한 문서들을 전달하게 하려고
  alternatives_korean:
  - 필요한 일들에 관한 메모들을 전달하게 하려고
  - 필요한 일들에 관한 보고문들을 제출하게 하려고
  lexicon: LSJ
  rationale: ὑπομνηματισμούς는 문맥상 행정적 문서/기록을 가리킬 수 있어, ‘문서들’로 넓게 옮기되 ‘전달하다’로 제출·전달의 행정적 성격을 살렸습니다. EN POB의 ‘memoranda’ 선택을 반영했습니다.
theological_decisions:
- issue: 문장 전체의 행정·서신 업무 표현
  chosen_reading: 이 절은 종교적 용어보다 정치·행정적 파견을 서술하는 문맥이므로, ‘문서들’, ‘전달하게 하다’처럼 관료적 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘보고서들’을 써서 더 좁게 해석하기
  - ‘지시문’을 써서 명령 수행으로 해석하기
  rationale: 그리스어 ὑπομνηματισμούς의 정확한 행정적 범주는 불확실하지만, 문맥상 단순한 개인 편지가 아니라 공적 문서/기록의 제출 가능성을 유지하는 것이 안전합니다.
  doctrine_reference: 2 Maccabees 4:23의 서술 문맥
