base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/008.yaml
  text: Jason[a], the brother of Onias, undermined the high priesthood, promising the king through a petition three hundred sixty talents of silver[b], and eighty talents from some other revenue.
  footnotes:
  - marker: a
    text: Or 'through an audience' or 'by petition'; the Greek term can refer either to a formal petition or to personal access to the king.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'sixty talents in addition to the three hundred,' that is, a total of three hundred sixty talents of silver.
    reason: lexical_alternative
translation:
  language: ko
  text: 오니아스의 형제 야손은 대제사장직을 훼손하고, 청원을 통하여[a] 왕에게 은 삼백 달란트에 더하여 육십 달란트[b]와 다른 어떤 수입에서 팔십 달란트를 내겠다고 약속했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕을 알현하여’로 옮길 수 있습니다. 그리스어는 공식 청원이나 왕에게 나아가 알현하는 일을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘삼백에 더하여 육십 달란트’이며, 곧 은 삼백육십 달란트를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπενόθευσεν
  english_pob_choice: undermined
  chosen_korean: 무너뜨리고
  alternatives_korean:
