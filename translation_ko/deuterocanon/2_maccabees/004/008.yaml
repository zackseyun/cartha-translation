  lexicon: LSJ
  rationale: ἔντευξις는 청원이나 접근을 뜻할 수 있어, 왕에게 드리는 공식적 청원을 자연스럽게 살린 ‘청을 넣어’로 옮겼습니다.
- source_word: τὰλαντα ἑξήκοντα πρὸς τοῖς τριακοσίοις
  english_pob_choice: three hundred sixty talents of silver
  chosen_korean: 은 육백 달란트
  alternatives_korean:
  - 은 삼백육십 달란트
  - 삼백 달란트에 더하여 육십 달란트
  lexicon: LSJ
  rationale: 그리스어는 ‘삼백에 더하여 육십 달란트’라는 구조이지만, 한국어 본문은 합산값을 읽기 쉽게 드러내도록 ‘육백 달란트’로 자연화했습니다.
- source_word: προσόδου τινὸς ἄλλης
