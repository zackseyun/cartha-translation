  lexicon: LSJ
  rationale: 사역이 아니라 직분/지위를 가리키므로, 전통적 교회어보다 직책성을 분명히 하는 ‘대제사장직’이 직접적입니다.
- source_word: διʼ ἐντεύξεως
  english_pob_choice: through a petition
  chosen_korean: 왕에게 청을 넣어
  alternatives_korean:
  - 탄원하여
  - 면담을 통해
  - 청원하여
  lexicon: LSJ
  rationale: ἔντευξις는 청원이나 접근을 뜻할 수 있어, 왕에게 드리는 공식적 청원을 자연스럽게 살린 ‘청을 넣어’로 옮겼습니다.
- source_word: τὰλαντα ἑξήκοντα πρὸς τοῖς τριακοσίοις
  english_pob_choice: three hundred sixty talents of silver
  chosen_korean: 은 육백 달란트
  alternatives_korean:
  - 은 삼백육십 달란트
  - 삼백 달란트에 더하여 육십 달란트
  lexicon: LSJ
  rationale: 그리스어는 ‘삼백에 더하여 육십 달란트’라는 구조이지만, 한국어 본문은 합산값을 읽기 쉽게 드러내도록 ‘육백 달란트’로 자연화했습니다.
- source_word: προσόδου τινὸς ἄλλης
  english_pob_choice: from some other revenue
  chosen_korean: 다른 수입에서 난
  alternatives_korean:
  - 다른 수입에서
  - 다른 재원에서 나온
  - 별도의 수입에서 난
  lexicon: LSJ
  rationale: πρόσοδος는 수입/세입을 뜻하므로, 뒤의 달란트가 그 수입원에서 ‘난’ 금액임을 분명히 하면서도 원문의 추가 재원을 살렸습니다.
theological_decisions:
- issue: 야손의 행위에 대한 평가적 뉘앙스
  chosen_reading: ‘무너뜨리고’로 옮겨, 대제사장직을 부정하게 훼손한 행위라는 평가를 드러냈습니다.
  alternative_readings:
  - 훼손하고
  - 부패시키고
  - 대제사장직을 얻고
  rationale: 본문은 중립적 승계가 아니라 성스러운 직분을 훼손한 행위를 묘사합니다. 한국어도 그 도덕적 긴장을 약화시키지 않는 방향이 필요합니다.
  doctrine_reference: Translation philosophy §§1, 5
