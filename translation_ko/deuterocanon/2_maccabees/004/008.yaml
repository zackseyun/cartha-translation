  lexicon: LSJ
  rationale: 동사가 단순한 획득이 아니라 대제사장직에 대한 부정적·파괴적 작용을 뜻하므로, 한국어로는 제도적 손상을 드러내는 ‘무너뜨리고’가 가장 적절합니다.
- source_word: ἀρχιερωσύνην
