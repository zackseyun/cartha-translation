  yaml_path: translation/deuterocanon/2_maccabees/004/049.yaml
  text: Therefore those who had spoken beforehand concerning the city and the people and the sacred vessels quickly suffered the unjust penalty[a][b][c].
  footnotes:
  - marker: a
    text: Or 'those who had previously made accusation concerning the city, the people(s), and the sacred vessels.' The Greek participle can imply denunciation in context, though more literally it means 'having spoken beforehand.'
    reason: lexical_alternative
  - marker: b
    text: '''Peoples'' renders Greek dēmōn, which may refer to civic groups, districts, or populations; the exact nuance is not fully certain from this verse alone.'
    reason: lexical_alternative
  - marker: c
    text: '''Penalty'' could also be rendered ''punishment'' or ''loss''; the Greek term can cover both punitive and damaging senses.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 도시와 백성들과 거룩한 기구들에 대하여 미리 말한 사람들은 곧 그 부당한 벌을 받았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταχέως οὖν
  english_pob_choice: Therefore ... quickly
  chosen_korean: 그러므로 ... 곧
  alternatives_korean:
  - 그래서 ... 곧바로
  - 그러므로 ... 신속히
  lexicon: LSJ
  rationale: οὖν의 결과/추론 관계는 그러므로로, ταχέως의 신속성은 곧으로 자연스럽게 살렸습니다.
- source_word: τὴν ἄδικον ζημίαν
  english_pob_choice: the unjust penalty
  chosen_korean: 그 부당한 벌
  alternatives_korean:
  - 그 불의한 징벌
  - 그 부당한 처벌
  - 그 부당한 손실
  lexicon: LSJ
  rationale: ζημία는 손실·해악·벌의 폭이 있으나, 문맥상 제재를 받은 결과이므로 벌이 가장 자연스럽고 ἄδικον은 부당한으로 옮겼습니다.
- source_word: οἱ ... προηγορήσαντες
  english_pob_choice: those who had spoken beforehand
  chosen_korean: 미리 말한 사람들
  alternatives_korean:
  - 앞서 말한 사람들
  - 먼저 고발한 사람들
  - 미리 고소한 사람들
  lexicon: LSJ
  rationale: προαγορεύω는 문자적으로 앞서 말하다/미리 발표하다의 뜻이므로, 고발·고소로 구체화하기보다 원문의 넓은 의미를 유지했습니다.
- source_word: περὶ πόλεως καὶ δήμων καὶ τῶν ἱερῶν σκευῶν
  english_pob_choice: concerning the city and the people and the sacred vessels
  chosen_korean: 도시와 백성들과 거룩한 기구들에 대하여
  alternatives_korean:
  - 도시와 사람들과 성스러운 기구들에 대하여
  - 도시와 백성과 성전 기구들에 관하여
  - 도시와 백성들과 거룩한 그릇들에 대하여
  lexicon: LSJ
  rationale: πόλις는 도시, δῆμοι는 문맥상 특정 집단을 가리킬 수 있으나 여기서는 과도한 해석을 피하고 백성들로, ἱερὰ σκεύη는 sacred vessels의 직역에 가까운 거룩한 기구들로 옮겼습니다.
