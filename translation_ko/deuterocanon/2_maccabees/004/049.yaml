base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/049.yaml
  text: Therefore those who had spoken beforehand concerning the city and the people and the sacred vessels quickly suffered the unjust penalty[a][b][c].
  footnotes:
  - marker: a
    text: Or 'those who had previously made accusation concerning the city, the people(s), and the sacred vessels.' The Greek participle can imply denunciation in context, though more literally it means 'having spoken beforehand.'
    reason: lexical_alternative
  - marker: b
    text: '''Peoples'' renders Greek dēmōn, which may refer to civic groups, districts, or populations; the exact nuance is not fully certain from this verse alone.'
    reason: lexical_alternative
  - marker: c
    text: '''Penalty'' could also be rendered ''punishment'' or ''loss''; the Greek term can cover both punitive and damaging senses.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 도시와 백성들과 성스러운 기물들에 관하여 앞서 말하였던 사람들은 그 부당한 벌을 곧 받았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘도시와 백성들과 성스러운 기물들에 관하여 앞서 고발하였던 사람들.’ 그리스어 분사는 문맥상 고발·비난의 뜻을 내포할 수 있으나, 문자적으로는 ‘앞서 말한’이라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘백성들’로 옮긴 그리스어 δήμων은 시민 집단, 지역, 주민 등을 가리킬 수 있습니다. 이 절만으로는 정확한 뉘앙스가 확정되지 않습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘벌’로 옮긴 그리스어 ζημία는 ‘처벌’ 또는 ‘손실’로도 번역할 수 있습니다.
    reason: lexical_alternative
