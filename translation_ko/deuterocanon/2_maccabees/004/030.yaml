  text: While these things were underway[a], it happened that the people of Tarsus and Mallus revolted, because they were being given as a gift to Antiochis, the king’s concubine.
  footnotes:
  - marker: a
    text: Or, more literally, 'the Tarsians and Mallotes were in revolt.' The translation uses city names for clarity.
    reason: lexical_alternative
translation:
  language: ko
  text: 이런 일이 진행되는 동안, 타르수스와 말루스의 사람들이 왕의 첩인 안티오키스에게 선물로 주어지고 있었기 때문에 반란을 일으켰습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεστηκότων
  english_pob_choice: while these things were underway
  chosen_korean: 이런 일이 진행되는 동안
  alternatives_korean:
  - 이런 사정이 서 있는 동안
  - 이 일이 벌어지는 동안
  - 이런 일이 진행 중인 동안
  lexicon: LSJ
  rationale: 앞선 이야기의 흐름을 이어 주는 시간적 배경으로 이해하여, 직역적인 ‘서 있다’보다 자연스럽고 문맥에 맞는 표현을 택했습니다.
- source_word: Ταρσεῖς καὶ Μαλλῶτας
  english_pob_choice: the people of Tarsus and Mallus
  chosen_korean: 타르수스와 말루스의 사람들
  alternatives_korean:
  - 타르수스인들과 말루스인들
  - 타르수스 시민들과 말루스 시민들
  lexicon: LSJ
  rationale: 그리스어 복수 형용사는 두 도시의 주민을 가리키므로, 현대 독자에게 분명한 ‘~의 사람들’로 옮겼습니다.
- source_word: στασιάζειν
  english_pob_choice: revolted
  chosen_korean: 반란을 일으켰습니다
  alternatives_korean:
  - 봉기했습니다
  - 소요를 일으켰습니다
  - 내란을 일으켰습니다
  lexicon: LSJ
  rationale: 정치적·집단적 저항의 의미를 간결하게 드러내면서도, 단순한 소요보다 강한 ‘반란’의 뉘앙스를 살렸습니다.
- source_word: ἐν δωρεᾷ δίδοσθαι
  english_pob_choice: were being given as a gift
  chosen_korean: 선물로 넘겨지고 있었기 때문입니다
  alternatives_korean:
  - 선물로 주어지고 있었기 때문입니다
  - 하사품처럼 주어지고 있었기 때문입니다
  lexicon: LSJ
  rationale: 왕의 첩에게 도시들이 ‘증여’되는 상황을 한국어에서 더 자연스럽고 서술적으로 드러내기 위해 ‘넘겨지다’를 사용했습니다.
