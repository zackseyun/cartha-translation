  text: 그런데 적의가 그 정도까지 심해져서, 심지어 시몬이 인정한 사람들 가운데 한 사람에 의해 살인까지 저질러지고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시몬이 인정한 사람들 가운데 어떤 한 사람을 통해서’. 그리스어는 그 인물을 특정하지 않으며, 그가 시몬이 인정한 무리에 속한 사람이었음을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῆς δὲ ἔχθρας
  english_pob_choice: the hostility
  chosen_korean: 적의가
  alternatives_korean:
  - 원한이
  - 증오가
  lexicon: LSJ
  rationale: ἔχθρα는 감정적 ‘증오’보다 적대 관계 자체를 가리키므로, 문맥의 긴장과 충돌을 살리는 ‘적의’가 가장 자연스럽습니다.
- source_word: ἐπὶ τοσοῦτον προβαινούσης
  english_pob_choice: advanced so far
  chosen_korean: 그만큼까지 번져서
  alternatives_korean:
  - 그 지경까지 나아가서
  - 그만큼 진전되어
  lexicon: LSJ
  rationale: 진행·확대의 뉘앙스를 살리면서 한국어에서 자연스럽게 ‘심화되다/번지다’의 감각을 전달하기 위해 ‘번져서’를 택했습니다.
- source_word: τῶν ὑπὸ τοῦ Σίμωνος δεδοκιμασμένων
  english_pob_choice: those approved by Simon
  chosen_korean: 시몬에게서 승인받은 자들
  alternatives_korean:
  - 시몬이 검증한 자들
  - 시몬의 선택을 받은 자들
  lexicon: LSJ
  rationale: δεδοκιμασμένων은 시험하여 인정한 사람들을 뜻하므로, 단순한 허가보다 선별·검증의 의미를 살린 ‘승인받은 자들’로 옮겼습니다.
- source_word: φόνους συντελεῖσθαι
  english_pob_choice: murders were being committed
  chosen_korean: 살인까지 저질러지고 있었습니다
  alternatives_korean:
  - 살인들이 자행되고 있었습니다
  - 살인들이 이루어지고 있었습니다
  lexicon: LSJ
  rationale: φόνος는 단순한 죽임보다 ‘살인’이 적절하며, συντελεῖσθαι의 완료·집행 뉘앙스는 한국어 관용 표현 ‘저질러지다’가 가장 잘 전달합니다.
theological_decisions:
- issue: 그리스어의 불특정 주체를 한국어에서 어떻게 보존할지
  chosen_reading: ‘시몬에게서 승인받은 자들 가운데 한 사람’으로 옮겨, 인물이 특정되지 않은 채 시몬의 검증된 무리 안에 속한 사람임을 드러냈습니다.
  alternative_readings:
  - ‘시몬의 승인받은 사람들 중 한 사람’
  - ‘시몬의 신임을 받은 자 중 한 사람’
  rationale: 본문은 τινος와 부분격 구조로 주체를 의도적으로 불특정하게 두므로, 한국어도 특정 인물로 좁히지 않고 모호성을 유지해야 합니다.
  doctrine_reference: 본문 해석상의 불특정성 보존
- issue: ‘살인’의 윤리적 강도 유지
  chosen_reading: 중립적 ‘죽임’보다 강한 ‘살인’을 사용했습니다.
  alternative_readings:
  - 죽임
  - 살해
  rationale: φόνος는 문맥상 반복적 폭력을 가리키며, 본문이 사태의 도덕적 타락을 강조하므로 한국어에서도 윤리적 비난이 분명한 표현이 적절합니다.
  doctrine_reference: 본문의 도덕적 평가 보존
