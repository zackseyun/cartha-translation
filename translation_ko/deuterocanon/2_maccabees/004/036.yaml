  text: They were indignant and deeply grieved over the man's unjust murder. But when the king returned from the regions of Cilicia[a], the Jews in the city appealed to him, and the Greeks as well, sharing in their hatred of the wicked deed,
  footnotes:
  - marker: a
    text: Or, 'the Greeks too, joining in hatred of the wicked deed.' The rare Greek participle συμμισοπονηρούντων is compressed and may be rendered in several closely related ways.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그 남자의 부당한 살인 때문에 분개하고 깊이 슬퍼했습니다. 그런데 왕이 길리기아 지방에서 돌아오자, 성안의 유다인들이 그에게 호소했고, 헬라인들도 그들과 함께 그 악한 일에 대한 미움을 나누었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘헬라인들도 악한 일에 대한 미움에 가담했다.’ 희귀한 그리스어 분사 συμμισοπονηρούντων은 압축된 표현이라 여러 가까운 방식으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδείναζον
  english_pob_choice: were indignant
  chosen_korean: 분개하고
  alternatives_korean:
  - 격분하고
  - 크게 분노하고
  - 마음 아파하고
  lexicon: LSJ
  rationale: 강한 정서적 불쾌감과 도덕적 반발을 나타내므로, 단순한 ‘슬픔’보다 ‘분개하다’가 더 가깝습니다.
- source_word: ἐδυσφόρουν
  english_pob_choice: were deeply grieved
  chosen_korean: 깊이 슬퍼했습니다
  alternatives_korean:
  - 몹시 괴로워했습니다
  - 크게 마음 아파했습니다
  - 마음이 상했습니다
  lexicon: LSJ
  rationale: 앞의 ‘분개하다’와 겹치지 않게 하면서도, 본문의 두 번째 정서적 뉘앙스인 감당하기 어려운 고통을 살리기 위해 ‘깊이 슬퍼하다’로 옮겼습니다.
- source_word: ἐπὶ τῷ ... ἀδίκῳ φόνῳ
  english_pob_choice: over ... unjust murder
  chosen_korean: 그 남자의 부당한 살인 때문에
  alternatives_korean:
  - 그 남자의 불의한 살인에 대해
  - 그 남자의 억울한 살인으로 인해
  - 그 남자의 부당한 죽음 때문에
  lexicon: LSJ
  rationale: φόνος는 단순한 죽음이 아니라 ‘살인’이므로 이를 유지했고, ἄδικος는 ‘부당한/불의한’의 도덕적 판단으로 반영했습니다.
- source_word: ἐνετύγχανον
  english_pob_choice: appealed to him
  chosen_korean: 그에게 호소했고
  alternatives_korean:
  - 그에게 간청했고
  - 그에게 청원했고
  - 그에게 탄원했고
  lexicon: LSJ
  rationale: 통치자에게 접근하여 청원하는 의미를 자연스럽게 드러내는 표현으로 ‘호소하다’를 택했습니다.
- source_word: συμμισοπονηρούντων
  english_pob_choice: sharing in their hatred of the wicked deed
  chosen_korean: 그 악한 일에 대한 미움을 나누었습니다
  alternatives_korean:
  - 그 악한 일에 대한 혐오에 동참했습니다
  - 그 악행을 함께 미워했습니다
  - 그 악한 일에 함께 분개했습니다
  lexicon: LSJ
  rationale: 희귀한 복합분사는 ‘함께 미워하다/혐오하다’의 의미를 강하게 담으므로, 본문이 말하는 공동의 도덕적 반감을 그대로 드러내는 쪽으로 옮겼습니다.
theological_decisions:
- issue: 헬라인들의 동참이 단순한 감정 공감인지 도덕적 연대인지
  chosen_reading: 헬라인들도 유다인들과 함께 그 악한 일 자체에 대한 미움을 공유한 것으로 옮겼습니다.
  alternative_readings:
  - 헬라인들도 그들의 미움에 동참한 것으로 옮길 수 있습니다
  - 헬라인들도 같은 분노를 품었다고 읽을 수 있습니다
  rationale: συμμισοπονηρούντων은 단순한 동정이 아니라 악한 행위에 대한 공동의 혐오를 가리키므로, 그 윤리적 강도를 약화시키지 않았습니다.
  doctrine_reference: 공동체적 도덕 판단과 악에 대한 혐오의 표현
