  text: 그들은 그 사람이 부당하게 살해된 일 때문에 분개하고 깊이 슬퍼했습니다. 그런데 왕이 길리기아 지방에서 돌아오자, 성안의 유다인들이 그에게 호소했고, 헬라인들도 그 악행에 대한 미움에 함께했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘헬라인들도 그 악행을 함께 미워했다.’ 희귀한 그리스어 분사 συμμισοπονηρούντων은 압축된 표현이므로, ‘그들의 미움에 동참했다’ 또는 ‘악행을 함께 혐오했다’로도 옮길 수 있습니다.
    reason: lexical_alternative
