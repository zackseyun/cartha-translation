  to: 이 일들 외에도 그는 백 달란트에 더하여 또 오십 달란트를 기록하겠다고 약속했습니다. 또한 자신이 체육관과 청년 등록 제도를[a] 세우고 예루살렘에 있는 이들을 안티오키아인으로[b] 등록할 수 있도록 권한이 주어진다면 그렇게 하겠다고 했습니다.
  rationale: 금전 약속의 기준인 ‘백 달란트’를 복원하고, 조건절을 권한의 부여 및 뒤따르는 제도 설립·등록 행위에 연결했습니다. ἐφηβία의 제도적 성격을 ‘청년 등록 제도’로 드러내되 과도한 해석은 피했습니다. 각주 앵커도 각각 해당 용어 바로 뒤로 옮겼습니다.
