- source_word: ἕτερα διαγράψειν πεντήκοντα πρὸς τοῖς ἑκατόν
  english_pob_choice: to register another fifty talents beyond the one hundred
  chosen_korean: 은 오십 달란트를 따로 기록하겠다고
  alternatives_korean:
  - 추가로 오십 달란트를 납부하겠다고
  - 백 달란트에 더해 오십 달란트를 기록하겠다고
  lexicon: LSJ
  rationale: διαγράφειν의 행정적 ‘기록/등재’ 뉘앙스를 살려 ‘기록하다’로 옮겼고, 금액 단위는 앞 문맥을 따라 달란트로 풀어 주었습니다.
- source_word: γυμνάσιον καὶ ἐφηβίαν
  english_pob_choice: a gymnasium and an enrollment of young men
  chosen_korean: 체육관과 청년 등록
  alternatives_korean:
  - 김나지온과 에페비아
  - 운동장과 청년 교육제도
  lexicon: LSJ
  rationale: 두 제도가 모두 헬라화와 연결된 구체적 문화·제도이므로, 직역어를 설명적으로 풀어 ‘체육관’과 ‘청년 등록’으로 옮겨 이해 가능성을 확보했습니다.
- source_word: τοὺς ἐν Ἱεροσολύμοις Ἀντιοχεῖς ἀναγράψαι
  english_pob_choice: to enroll those in Jerusalem as Antiochenes
  chosen_korean: 예루살렘에 있는 사람들을 안티오키아 사람들로 등록하겠다고도 했습니다
  alternatives_korean:
  - 예루살렘 사람들을 안티오키아 시민으로 등록하겠다고도 했습니다
  - 예루살렘에 있는 이들을 안티오키아인으로 기입하겠다고도 했습니다
  lexicon: LSJ
  rationale: Ἀντιοχεῖς를 본문에 있는 호칭대로 ‘안티오키아 사람들’로 유지해, 정확한 법적 지위는 과장하지 않으면서 등록/재분류의 의미를 드러냈습니다.
theological_decisions:
- issue: Ἀντιοχεῖς의 법적·정치적 함의
  chosen_reading: 본문은 ‘안티오키아 사람들’이라는 명칭을 유지하고, 구체적 시민권 여부는 본문 밖으로 넘기지 않았습니다.
  alternative_readings:
  - 안티오키아 시민으로
  - 안티오키아의 공민으로
  rationale: 이 구절은 헬라화 정책의 맥락을 담지만, 그리스어 자체는 정확한 법적 범주를 명시하지 않으므로, 번역문은 용어를 보존하고 해석의 여지를 남겨 두었습니다.
  doctrine_reference: 원문 우선과 역사적 긴장 보존
