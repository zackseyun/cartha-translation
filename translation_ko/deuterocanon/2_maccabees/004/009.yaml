base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/009.yaml
  text: In addition to these things[a], he promised to register another fifty talents beyond the one hundred, if he were granted authority to establish for himself a gymnasium and an enrollment of young men[b], and to enroll those in Jerusalem as Antiochenes.
  footnotes:
  - marker: a
    text: Or 'to register the people in Jerusalem as citizens of Antioch.' The Greek says 'Antiochenes,' which may imply civic enrollment or legal status connected with Antioch.
    reason: alternative_reading
  - marker: b
    text: The 'gymnasium' and the enrollment of young men refer to Greek civic and athletic institutions associated here with Jerusalem's Hellenization.
    reason: cultural_note
translation:
  language: ko
  text: 이 일들 외에도 그는, 자기 권한으로 체육관과 청년 등록을 세울 수만 있다면, 거기에 더해 은 오십 달란트를 따로 기록하겠다고 약속했고, 예루살렘에 있는 사람들을 안티오키아 사람들로 등록하겠다고도 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예루살렘 사람들을 안티오키아 시민으로 등록하겠다고.’ 그리스어는 ‘안티오키아 사람들’이라고 하므로, 시민권이나 법적 지위와의 연관 가능성은 남아 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘체육관’과 ‘청년 등록’은 여기서 예루살렘의 헬라화와 관련된 그리스 도시 제도와 훈련 체계를 가리킵니다.
    reason: cultural_note
lexical_decisions:
