  yaml_path: translation/deuterocanon/2_maccabees/004/033.yaml
  text: And Onias[a], when he clearly recognized this, withdrew to a place of asylum at Daphne, which lies near Antioch.
  footnotes:
  - marker: a
    text: Or 'to a place of refuge.' The Greek specifies an inviolable asylum location, likely with legal-sacral overtones rather than only general safety.
    reason: lexical_alternative
translation:
  language: ko
  text: 오니아스는 이것을 분명히 알아차리고, 안티오키아 근처에 있는 다프네에 있는 피난처로 물러갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘피난처’는 단순히 안전한 장소라기보다, 침범이 금지된 법적·종교적 보호의 장소라는 뉘앙스를 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σαφῶς ἐπεγνωκώς
  english_pob_choice: when he clearly recognized this
  chosen_korean: 이것을 분명히 알아차리고
  alternatives_korean:
  - 이것을 분명히 인식하고
  - 이것을 확실히 알아보고
  lexicon: LSJ
  rationale: σαφῶς는 인식의 명확성을, ἐπεγνωκώς는 분명한 인지·파악을 나타내므로 ‘분명히 알아차리다’가 자연스럽게 그 결합을 살립니다.
- source_word: ἀπήνεγκεν ἀποκεχωρηκώς
  english_pob_choice: withdrew
  chosen_korean: 물러갔습니다
  alternatives_korean:
  - 피신했습니다
  - 떠났습니다
  lexicon: LSJ
  rationale: 동사와 분사 결합이 단순한 이동보다 위험을 피한 후퇴를 강조하므로, ‘물러갔습니다’가 문맥상 힘을 유지합니다.
- source_word: εἰς ἄσυλον τόπον
  english_pob_choice: to a place of asylum
  chosen_korean: 한 피난처로
  alternatives_korean:
  - 한 성역으로
  - 피난의 장소로
  lexicon: LSJ
  rationale: ἄσυλος는 단순한 안전지대보다 ‘침범할 수 없는 피난/성역’의 뉘앙스를 가지므로, 본문에는 간결하게 ‘피난처’로 옮기되 그 성격을 살렸습니다.
- source_word: ἐπὶ Δάφνης τῆς πρὸς Ἀντιοχίας κειμένης
  english_pob_choice: at Daphne, which lies near Antioch
  chosen_korean: 안티오크 근처에 있는 다프네
  alternatives_korean:
  - 안티오크에 가까이 놓인 다프네
  - 안티오크 인근의 다프네
  lexicon: LSJ
  rationale: ἐπί는 여기서 위치를 나타내며, 뒤의 분사구가 지리적 식별을 제공하므로 ‘안티오크 근처에 있는 다프네’가 가장 자연스럽고 정확합니다.
theological_decisions:
- issue: ἄσυλον τόπον의 법적·성역적 뉘앙스
  chosen_reading: ‘피난처’로 옮기되, 단순한 안전한 장소가 아니라 침범이 금지된 보호 구역이라는 뉘앙스를 유지했습니다.
  alternative_readings:
  - ‘성역’으로 직역
  - ‘안식처’로 완화
  rationale: 본문의 초점은 일반적 안전보다 신성·법적 불가침성에 있으므로, 한국어에서도 그 긴장을 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: 성전/성역 개념과 도피처 전통에 대한 성경적 배경
