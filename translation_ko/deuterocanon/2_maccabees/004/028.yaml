  yaml_path: translation/deuterocanon/2_maccabees/004/028.yaml
  text: But when Sostratus[a], the commander of the citadel, pressed the claim—for the handling of the revenues belonged to him—for this reason the two men were summoned by the king.
  footnotes:
  - marker: a
    text: Or, 'the administration of the revenues was under his authority.' The Greek phrase can be understood more generally as jurisdiction over financial matters.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 소스트라투스, 즉 성채의 감독이 그 요구를 주장하고 있었는데 — 재정의 처리는 그의 권한에 속하였기 때문입니다 — 이 때문에 그 두 사람은 왕에게 소환되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘재정의 관할권이 그의 아래에 있었다.’ 그리스어 구문은 보다 일반적으로 재정 문제에 대한 관할을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιουμένου ... τὴν ἀπαίτησιν
  english_pob_choice: pressed the claim
  chosen_korean: 그 요구를 주장하고 있었는데
  alternatives_korean:
  - 그 청구를 밀어붙이고 있었는데
  - 그 요구를 제기하고 있었는데
  - 그 청구를 강하게 요구하고 있었는데
  lexicon: LSJ
  rationale: ἀπαίτησις는 단순한 ‘요구’보다 행정적·법적 청구의 뉘앙스를 가지므로, 진행 중인 압박을 드러내는 ‘주장하고 있었는데’로 자연스럽게 옮겼습니다.
- source_word: τοῦ τῆς ἀκροπόλεως ἐπάρχου
  english_pob_choice: the commander of the citadel
  chosen_korean: 성채의 감독
  alternatives_korean:
  - 성채의 지휘관
  - 성채의 총독
  - 요새의 감독
  lexicon: LSJ
  rationale: ἐπάρχος는 문맥상 군사·행정 감독관을 가리키므로, 지나치게 현대적 군직명으로 좁히지 않으면서도 기능을 드러내는 ‘감독’을 택했습니다.
- source_word: ἡ τῶν διαφόρων πρᾶξις
  english_pob_choice: the handling of the revenues
  chosen_korean: 재정의 처리
  alternatives_korean:
  - 세입의 관리
  - 수입금의 처리
  - 재정 운영
  lexicon: LSJ
  rationale: διαφορά는 이 문맥에서 재정적 수입·세입을 가리키며, πρᾶξις는 실무적 처리/집행을 뜻하므로 ‘재정의 처리’가 가장 무난하게 그 범위를 보존합니다.
- source_word: ὑπὸ τοῦ βασιλέως προσεκλήθησαν
  english_pob_choice: were summoned by the king
  chosen_korean: 왕에게 소환되었습니다
  alternatives_korean:
  - 왕에게 불려갔습니다
  - 왕이 그들을 불렀습니다
  - 왕 앞으로 소환되었습니다
  lexicon: LSJ
  rationale: προσκαλέω의 수동은 공식적인 호출·소환을 뜻하므로, 궁정 문맥에 맞는 ‘소환되었습니다’로 옮겼습니다.
