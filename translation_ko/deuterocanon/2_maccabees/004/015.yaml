    reason: lexical_alternative
lexical_decisions:
- source_word: πατρῴας τιμὰς
  english_pob_choice: the honors of their fathers
  chosen_korean: 조상들의 영예
  alternatives_korean:
  - 아버지들의 영예
  - 선조들의 명예
  - 조상들의 명예
  lexicon: LSJ
  rationale: πατρῴας는 문자적으로 ‘아버지들의/조상들의’이지만, 여기서는 세대에서 물려받은 전통적 가치와 명예를 가리키므로 ‘조상들의’가 자연스럽습니다. τιμάς는 단순한 칭호보다 가치 있게 여기는 명예·영예의 뉘앙스가 있어 ‘영예’로 옮겼습니다.
- source_word: ἐν οὐδενὶ τεθειμένοι
  english_pob_choice: placing no value at all on
  chosen_korean: 전혀 대수롭게 여기지 않았고
  alternatives_korean:
  - 전혀 가치 있게 여기지 않았고
  - 아무것도 아닌 것으로 여기고
  - 전혀 중요하게 여기지 않았고
  lexicon: LSJ
  rationale: 이 관용구는 어떤 대상을 아무 가치 없는 것으로 취급한다는 뜻이므로, 현대 한국어의 자연스러운 평가 표현인 ‘대수롭게 여기지 않다’로 옮겼습니다.
- source_word: Ἑλληνικὰς δόξας
  english_pob_choice: the Greek distinctions
  chosen_korean: 그리스의 명예들
  alternatives_korean:
  - 그리스의 영예들
  - 그리스의 구별된 지위들
  - 그리스식 명성들
  lexicon: LSJ
  rationale: δόξας는 여기서 종교적 ‘영광’보다 그리스 문화에 속한 사회적 명망·위신을 가리키므로, ‘명예들’이 POB의 ‘distinctions’와 원문의 가치 평가를 함께 살립니다.
- source_word: καλλίστας
  english_pob_choice: the finest
  chosen_korean: 가장 뛰어난 것으로
  alternatives_korean:
  - 가장 아름다운 것으로
  - 가장 좋은 것으로
  - 가장 훌륭한 것으로
  lexicon: LSJ
  rationale: καλλίστας는 καλός의 최상급으로 본래 ‘가장 아름다운/좋은’이지만, 여기서는 문화적 우월성에 대한 판단이므로 ‘가장 뛰어난’이 의미를 자연스럽게 전달합니다.
theological_decisions:
- issue: 조상 전통과 그리스 문화의 평가 대비를 과장하지 않고 옮김
  chosen_reading: 원문의 강한 대비를 유지하되, 본문에 없는 ‘멸시하다’ 같은 추가 정서를 넣지 않았습니다.
  alternative_readings:
  - 조상들의 영예를 멸시하고 그리스의 영예를 가장 아름답다고 여김
  - 조상들의 유산을 버리고 그리스의 영광을 최고로 여김
  rationale: 그리스어는 분명한 가치 판단의 대조를 말하지만, 명시적 ‘경멸’ 동사는 없습니다. 따라서 POB의 해석을 따라 평가의 방향만 분명히 하고, 텍스트를 넘어서는 강한 비난어는 피했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
