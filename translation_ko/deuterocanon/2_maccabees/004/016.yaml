  text: 'For this reason a harsh crisis surrounded them: those whose ways they envied and whom they wanted to imitate became their enemies and punishers[a][b].'
  footnotes:
  - marker: a
    text: Or 'because of whom' at the start of the verse; the Greek idiom can point specifically to the people just mentioned as the cause of the ensuing distress.
    reason: lexical_alternative
  - marker: b
    text: '''Ways'' may also be rendered ''customs'' or ''manner of life.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 그들에게는 그들이 탐낸 삶의 방식과 그들이 본받고자 했던 이들이 오히려 원수와 징벌자가 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘삶의 방식’은 여기서 단순한 행동이 아니라 생활양식이나 관습을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν καὶ χάριν
  english_pob_choice: For this reason
  chosen_korean: 그래서
  alternatives_korean:
  - 그들 때문에
  - 그런 까닭에
  lexicon: LSJ
  rationale: 원인·결과를 잇는 관용 표현이므로, 한국어에서는 앞선 대상들을 가리키는 인과를 자연스럽게 드러내는 ‘그래서’로 옮겼습니다.
- source_word: περιεῖχεν αὐτοὺς χαλεπὴ περίστασις
  english_pob_choice: a harsh crisis surrounded them
  chosen_korean: 그들에게는 … 오히려 원수와 징벌자가 되었습니다
  alternatives_korean:
  - 가혹한 위기가 그들을 둘러쌌습니다
  - 심한 곤경이 그들을 에워쌌습니다
  lexicon: LSJ
  rationale: περιέχω와 περίστασις의 결합은 압박이 ‘둘러싼다’는 이미지이지만, 문장 전체의 초점이 결과 진술에 있으므로 한국어에서는 압박의 상태를 배경으로 두고 결말을 선명하게 살렸습니다.
- source_word: τὰς ἀγωγάς
  english_pob_choice: ways
  chosen_korean: 삶의 방식
  alternatives_korean:
  - 습관
  - 행실
  - 관습
  lexicon: LSJ
  rationale: ἀγωγή는 단순한 행동 하나보다 생활양식과 훈련된 삶의 형태를 가리킬 수 있으므로, 헬레니즘화된 맥락을 살려 ‘삶의 방식’으로 옮겼습니다.
- source_word: ἐξομοιοῦσθαι
  english_pob_choice: to imitate
  chosen_korean: 본받고자 했던
  alternatives_korean:
  - 닮고자 했던
  - 그들과 같아지고자 했던
  lexicon: LSJ
  rationale: 동사 자체는 ‘같아지다/닮다’의 뜻이지만, 문맥상 사람들의 생활방식을 취하려는 의지를 나타내므로 한국어에서는 자연스러운 목적 표현으로 처리했습니다.
- source_word: πολεμίους καὶ τιμωρητὰς
  english_pob_choice: enemies and punishers
  chosen_korean: 원수와 징벌자
  alternatives_korean:
  - 적과 보복자
  - 원수와 보응자
  lexicon: LSJ
  rationale: πολεμίους는 직접적으로 ‘원수’, τιμωρητής는 벌을 집행하는 자이므로, ‘징벌자’로 옮겨 보응의 성격을 살렸습니다.
theological_decisions:
- issue: 이 구절의 도덕적 역전과 응보성
  chosen_reading: 그들이 탐내어 본받으려 했던 이들이 결국 그들의 원수와 징벌자가 되었다는 역설적 응보를 그대로 드러냈습니다.
  alternative_readings:
  - 단순히 나중에 그들과 적대하게 되었다고만 완화해 옮길 수 있음
  rationale: 본문의 ζηλόω와 τιμωρητής는 단순한 관계 변화가 아니라 부정적 모방의 결과를 강조하므로, 그 긴장과 심판성을 약화시키지 않았습니다.
  doctrine_reference: '번역 원칙: 원문이 드러내는 윤리적·신학적 긴장을 보존하고, 해석으로 미리 평탄화하지 않습니다.'
