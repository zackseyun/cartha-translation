base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/024.yaml
  text: But after being presented to the king and magnifying him by the display of his authority[a], he secured the high priesthood for himself[b], outbidding Jason by three hundred talents of silver.
  footnotes:
  - marker: a
    text: Or 'after being introduced to the king.' The Greek may imply formal presentation or recommendation at court.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'with the face/presence of authority,' an idiom for an impressive or authoritative bearing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 왕에게 소개되고 권세를 드러내어 그를 높인 뒤[a], 그는 스스로 대제사장을 차지하였으니[b], 야손보다 은 삼백 달란트를 더 많이 냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕에게 소개된 뒤’. 그리스어는 궁정에서의 공식적인 소개나 추천을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘권세의 얼굴/모습으로’라는 뜻이어서, 위엄 있는 외양이나 권위의 드러남을 가리키는 관용구로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: συσταθεὶς τῷ βασιλεῖ
  english_pob_choice: after being presented to the king
  chosen_korean: 왕에게 소개되고
  alternatives_korean:
  - 왕 앞에 제시되고
  - 왕에게 추천되고
  lexicon: LSJ
  rationale: 궁정 맥락의 수동 분사를 한국어 자연문으로 옮기되, 형식적 소개 또는 추천의 가능성을 열어 두기 위해 ‘소개되고’를 택했습니다.
- source_word: δοξάσας αὐτὸν
  english_pob_choice: magnifying him
  chosen_korean: 그를 높인 뒤
  alternatives_korean:
  - 그를 영광스럽게 한 뒤
  - 그를 칭송한 뒤
  - 그를 찬양한 뒤
  lexicon: LSJ
  rationale: 정치적 맥락에서의 δοξάζω는 꼭 신학적 ‘영화’가 아니라 존대·찬양·추켜세움의 뜻을 가질 수 있으므로, 과도한 해석을 피하면서도 문맥상 의미를 살려 ‘그를 높인 뒤’로 옮겼습니다.
- source_word: τῷ προσώπῳ τῆς ἐξουσίας
  english_pob_choice: with the display of his authority
  chosen_korean: 권세를 드러내어
  alternatives_korean:
  - 권세의 얼굴로
  - 권세 있는 태도로
  - 권위의 외양으로
  lexicon: LSJ
  rationale: 직역하면 난해한 관용구이므로, ‘얼굴/모습’의 이미지를 살리면서도 현대 한국어에서 이해 가능한 ‘권세를 드러내어’로 처리했습니다.
- source_word: εἰς ἑαυτὸν κατήντησεν ἀρχιερωσύνην
  english_pob_choice: he secured the high priesthood for himself
  chosen_korean: 스스로 대제사장을 차지하였으니
  alternatives_korean:
  - 대제사직을 자기 것으로 만들었으니
  - 대제사직을 얻었으니
  - 대제사직을 자신에게로 가져왔으니
  lexicon: LSJ
  rationale: ‘자기에게로 오게 하다’는 관용적 뉘앙스를 한국어에서 가장 자연스럽게 드러내기 위해 ‘스스로 … 차지하다’를 택했고, 직분의 성격을 분명히 하려고 ‘대제사장’보다 ‘대제사장직’에 가까운 의미를 함께 담았습니다.
- source_word: ὑπερβάλλων τὸν Ἰάσονα τάλαντα ἀργυρίου τριακόσια
  english_pob_choice: outbidding Jason by three hundred talents of silver
  chosen_korean: 야손보다 은 삼백 달란트를 더 많이 냈습니다
  alternatives_korean:
  - 야손을 제치고 은 삼백 달란트를 제시했습니다
  - 야손보다 은 삼백 달란트를 더 불렀습니다
  lexicon: LSJ
  rationale: 거래적 맥락에서의 ὑπερβάλλων을 경쟁 입찰로 이해하여, ‘더 많이 냈습니다’로 현재 한국어에서 즉시 이해되도록 했습니다.
theological_decisions:
- issue: 이 구절의 ‘권세’와 ‘그를 높임’이 단순한 예의인지, 아첨인지의 뉘앙스
  chosen_reading: 본문의 직접 의미는 중립적으로 두고, 비난적 평가는 문맥 전체가 담당하도록 했습니다.
  alternative_readings:
  - 그를 아첨하여
  - 그를 현저히 추켜세워
  rationale: δοξάσας 자체가 반드시 노골적 아첨을 뜻하지는 않으므로, 본문 수준에서는 과도한 도덕평가를 얹지 않는 편이 원문에 더 충실합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: ‘대제사장’을 직분 명칭으로 어떻게 드러낼지
  chosen_reading: ‘대제사장을 차지하였습니다’로 직분 획득을 자연스럽게 표현했습니다.
  alternative_readings:
  - 대제사직을 얻었습니다
  - 대제사직을 차지하였습니다
  rationale: 본문의 초점은 인물의 야심 어린 직분 획득에 있으므로, 한국어에서도 직분의 획득성에 무게를 두었습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 6
