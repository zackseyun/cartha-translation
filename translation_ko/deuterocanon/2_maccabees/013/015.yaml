base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/015.yaml
  text: And after giving those around him the battle cry[a], “God’s Victory,” he attacked the royal court by night with the finest armed young men, struck down about two thousand men in the camp[b], and cut down the leading elephant together with its rider.
  footnotes:
  - marker: a
    text: Or “watchword” or “signal” for “battle cry.” The Greek term is a military password or signal; here it is expressed aloud as “God’s Victory.”
    reason: lexical_alternative
  - marker: b
    text: Literally “the one being in the house(-structure),” likely referring to the man riding in the elephant’s mounted tower or seat.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 자기 주변 사람들에게 하나님의 승리라는 신호를 보낸 뒤, 가장 뛰어난 장정을 거느리고 밤에 왕의 뜰을 기습하여 진영에서 약 이천 명을 쓰러뜨리고, 가장 앞서 있던 코끼리와 그 위에 탄 사람을 함께 쳐 죽였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: σύνθημα는 군사적 ‘신호/암호/구호’의 뜻을 함께 지니며, 여기서는 공개적으로 외쳐진 전투 신호입니다.
    reason: lexical_alternative
  - marker: b
    text: κατʼ οἰκίαν ὄντι는 문자적으로는 ‘집 같은 구조 안에 있는 사람’으로, 코끼리의 탑이나 좌석에 탄 사람을 가리키는 표현으로 보입니다.
    reason: cultural_note
lexical_decisions:
- source_word: σύνθημα Θεοῦ Νίκην
  english_pob_choice: battle cry, “God’s Victory”
  chosen_korean: 하나님의 승리라는 신호
  alternatives_korean:
  - 전투 구호인 “하나님의 승리”
  - 암호인 “하나님의 승리”
  - 신호인 “하나님의 승리”
  lexicon: LSJ
  rationale: σύνθημα는 군사적 신호·구호·암호의 성격을 함께 가지므로, 본문 흐름에 맞게 ‘신호’로 옮기고 내용은 인용으로 살렸습니다. ‘승리’는 소유격을 자연스럽게 반영합니다.
- source_word: νεανίσκων ἀρίστων κεκοσμημένων
  english_pob_choice: the finest armed young men
  chosen_korean: 가장 뛰어난 장정
  alternatives_korean:
  - 가장 잘 무장한 젊은이들
  - 정예의 젊은 장정들
  - 훌륭하게 갖춰진 청년들
  lexicon: LSJ
  rationale: 군사적 맥락에서 κεκοσμημένων은 ‘장식된’보다 ‘갖춰진/무장한’에 가깝지만, 한국어에서는 군사적 정예를 드러내는 ‘가장 뛰어난 장정’이 문맥상 가장 자연스럽습니다.
- source_word: τὴν βασιλικὴν αὐλήν
  english_pob_choice: the royal court
  chosen_korean: 왕의 뜰
  alternatives_korean:
  - 왕실 뜰
  - 왕의 궁정
  - 왕궁
  lexicon: LSJ
  rationale: αὐλή는 궁정도 될 수 있지만 여기서는 야간 습격의 공간적 대상이므로 ‘뜰’이 더 직접적입니다. POB의 ‘royal court’보다 장소성은 살리고, 군사적 장면을 유지했습니다.
- source_word: τὴν παρεμβολὴν
  english_pob_choice: the camp
  chosen_korean: 진영
  alternatives_korean:
  - 야영지
  - 캠프
  - 부대 진영
  lexicon: LSJ
  rationale: παρεμβολή는 군사 진영을 뜻하므로 ‘진영’이 가장 간결하고 고전적인 대응입니다.
- source_word: εἰς ἄνδρας δυσχιλίους
  english_pob_choice: about two thousand men
  chosen_korean: 약 이천 명
  alternatives_korean:
  - 이천 명가량
  - 거의 이천 명
  - 약 두 천의 남자
  lexicon: LSJ
  rationale: 수량이 대략적이므로 ‘약’을 넣어 POB의 ‘about’를 반영했습니다. ἄνδρας는 남자/사람이지만 한국어에서는 군사 맥락상 ‘명’이 자연스럽습니다.
- source_word: τὸν πρωτεύοντα τῶν ἐλεφάντων σὺν τῷ κατʼ οἰκίαν ὄντι
  english_pob_choice: the leading elephant together with its rider
  chosen_korean: 가장 앞서 있던 코끼리와 그 위에 탄 사람
  alternatives_korean:
  - 선두의 코끼리와 그 탑승자
  - 앞선 코끼리와 그 안에 있는 사람
  - 가장 앞의 코끼리와 그 탑승자
  lexicon: LSJ
  rationale: κατʼ οἰκίαν ὄντι는 직역하면 ‘집 같은 구조 안에 있는 자’로, 코끼리의 탑/좌석 탑승자를 가리키는 문화적 표현입니다. 본문은 자연스럽게 ‘그 위에 탄 사람’으로 처리했습니다.
- source_word: συνέθηκεν
  english_pob_choice: cut down
  chosen_korean: 쳐 죽였습니다
  alternatives_korean:
  - 쓰러뜨렸습니다
  - 죽였습니다
  - 베어 넘겼습니다
  lexicon: LSJ
  rationale: 끝부분은 코끼리와 탑승자에 대한 치명적 공격을 가리키므로, 단순 ‘죽였습니다’보다 군사적 폭력을 드러내는 ‘쳐 죽였습니다’가 문맥상 더 적합합니다.
theological_decisions:
- issue: Θεοῦ Νίκην의 의미를 ‘하나님의 승리’로 살릴지, 더 선언적인 문구로 바꿀지
  chosen_reading: 본문의 군사 신호를 ‘하나님의 승리’라는 직설적 표어로 유지했습니다.
  alternative_readings:
  - ‘하나님의 승리’
  - ‘하나님은 승리하신다’
  rationale: 원문은 전투 신호/구호의 내용 자체를 제시하므로, 선언문처럼 재구성하기보다 표어성 있는 명사를 유지하는 편이 source-direct합니다.
  doctrine_reference: 문맥상 군사적 승리 선언; 별도 교리화 없이 본문 수사 보존
