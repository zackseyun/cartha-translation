  text: '[그들은] 율법과 조국과 거룩한 성전[a]을 빼앗길 참이었고, [그는] 이제 막 조금 회복한[b] 백성이 욕하는 민족들 앞에 굴복하게 내버려 두지 말라고 권하였습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘조국’은 ‘fatherland’의 번역이며, 원문의 혈연·민족적 소속감을 살립니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘방금 조금 되살아난/회복된’입니다. 여기서는 최근의 제한된 회복을 자연스럽게 옮겼습니다.
    reason: lexical_alternative
