review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 ὑποχειρίους γενέσθαι는 단순히 ‘앞에 굴복하다’보다 타 민족의 지배·권세 아래 놓이는 것을 뜻하므로 ‘지배를 받게 되다’로 옮기는 편이 정확합니다. δυσφήμοις는 ‘욕하는’보다 문어적이고 현대의 공식 성서 문체에 맞는 ‘비방하는’이 적절합니다.
  naturalness: ‘욕하는 민족들 앞에 굴복하게 내버려 두지 말라고’는 구어적이며 ‘앞에’가 원문의 지배 관계를 다소 흐립니다. ‘비방하는 민족들의 지배를 받게 하지 말라고’는 자연스럽고 격식 있는 합쇼체 문장입니다.
  terminology: ‘율법’, ‘조국’, ‘거룩한 성전’은 적절합니다. 다만 각주 a는 영어 fatherland를 설명할 뿐 한국어 번역의 대안을 제시하지 않고, 성전에 붙어 있어 내용상 조국에 붙이는 것이 바람직합니다.
  issues:
  - severity: medium
    issue: ‘욕하는 민족들 앞에 굴복하게’
    rationale: δυσφήμοις ἔθνεσιν은 ‘비방하거나 모욕하는 민족들’이라는 뜻이고, ὑποχειρίους γενέσθαι는 그들의 통제 또는 지배 아래 놓임을 뜻합니다. 현 번역은 ‘앞에 굴복하다’로 관계를 약화하고 ‘욕하는’은 현대 공식 문체에 다소 낮습니다.
  - severity: low
    issue: 각주 a의 내용 및 위치
    rationale: 각주는 ‘조국’의 번역 선택을 설명하지만 성전에 붙어 있으며 영어 표현을 직접 언급합니다. 한국어 독자에게 유익한 대안과 원어의 의미를 제시하고 ‘조국’에 붙이는 것이 적절합니다.
  revised_text: '[그들은] 율법과 조국[a]과 거룩한 성전을 빼앗길 위기에 처해 있었으며, [그는] 이제 막 조금 회복한 백성이 비방하는 민족들의 지배를 받게 하지 말라고 권하였습니다.'
  revised_footnotes:
  - marker: a
    text: 또는 ‘본국’. 그리스어는 조상에게서 물려받은 나라, 곧 민족적 고향을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘방금 조금 되살아난’ 또는 ‘회복된’입니다. 최근에 이루어진 제한적인 회복을 가리킵니다.
    reason: lexical_alternative
  revision_rationale: ‘욕하는 민족들 앞에 굴복하게’를 원문의 지배·예속 관계와 현대 공식 문체에 맞추어 ‘비방하는 민족들의 지배를 받게’로 수정했습니다. 문맥상 보충되는 주어는 대괄호로 유지했습니다. 각주 a는 해당 어휘인 ‘조국’에 붙이고, 영어 번역어가 아니라 그리스어의 어휘 범위와 한국어 대안을 설명하도록 고쳤습니다. b 각주는 본문에 표지가 없었던 구조를 보완하여 ‘조금 회복한’에 붙였습니다.
