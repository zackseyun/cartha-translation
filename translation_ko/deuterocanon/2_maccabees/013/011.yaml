    text: ‘조국’은 ‘fatherland’의 번역이며, 원문의 혈연·민족적 소속감을 살립니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘방금 조금 되살아난/회복된’입니다. 여기서는 최근의 제한된 회복을 자연스럽게 옮겼습니다.
    reason: lexical_alternative
