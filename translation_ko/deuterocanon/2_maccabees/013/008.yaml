  yaml_path: translation/deuterocanon/2_maccabees/013/008.yaml
  text: Very justly[a]; for because he had committed many sins against the altar, whose fire and ashes were holy[b], he met his death in ashes.
  footnotes:
  - marker: a
    text: Or 'Very rightly.' The Greek opening emphasizes that his fate was deserved.
    reason: lexical_alternative
  - marker: b
    text: The Greek says literally 'in ashes he received death,' likely echoing his sins against the altar and its holy ashes.
    reason: lexical_alternative
translation:
  language: ko
  text: 참으로 마땅합니다[a]! 그가 제단을 거슬러 많은 죄를 지었기 때문입니다. 그 제단의 불과 재는 거룩하였는데[b], 그는 재 가운데서 죽음을 맞았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘참으로 옳습니다.’ 그리스어 첫머리는 그의 운명이 마땅했음을 강하게 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 문자적으로 ‘재 가운데서 그는 죽음을 받았다’에 가깝습니다. 이는 제단의 거룩한 불과 재를 거슬러 지은 그의 죄와 대응을 이룹니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάνυ δικαίως
  english_pob_choice: Very justly
  chosen_korean: 매우 정당합니다
  alternatives_korean:
  - 매우 옳습니다
  - 지극히 정당합니다
  - 매우 의롭습니다
  lexicon: LSJ
  rationale: πάνυ의 강한 강조와 δικαίως의 ‘정당하게/옳게’라는 뜻을 살려, 결과가 마땅했음을 간결한 현대어로 드러냈습니다.
- source_word: συνετέλεσεν πολλὰ ... ἁμαρτήματα
  english_pob_choice: had committed many sins
  chosen_korean: 많은 죄를 지었습니다
  alternatives_korean:
  - 많은 죄를 저질렀습니다
  - 많은 악행을 저질렀습니다
  - 많은 죄를 범했습니다
  lexicon: LSJ
  rationale: ἁμαρτήματα는 단순한 실수보다 종교적·도덕적 ‘죄’가 자연스럽고, συνετέλεσεν은 문맥상 ‘저지르다/짓다’의 결과적 행위를 뜻합니다.
- source_word: περὶ τὸν βωμόν
  english_pob_choice: against the altar
  chosen_korean: 제단에 대하여
  alternatives_korean:
  - 제단을 향하여
  - 제단을 거슬러
  - 제단에 대해
  lexicon: LSJ
  rationale: perì + 대상을 이 문맥의 성소 모독 대상으로 이해해, 한국어에서는 ‘대하여’로 옮겨 원문의 대상을 분명히 했습니다.
- source_word: ἁγνὸν ἦν καὶ ἡ σποδός
  english_pob_choice: were holy
  chosen_korean: 거룩하였는데
  alternatives_korean:
  - 정결하였는데
  - 순결하였는데
  - 성별되었는데
  lexicon: LSJ
  rationale: ἁγνός는 ‘깨끗한’보다 제의적 맥락에서 ‘거룩한/성스러운’ 의미가 더 강하므로, 불과 재의 성별된 상태를 드러냈습니다.
- source_word: ἐν σποδῷ τὸν θάνατον ἐκομίσατο
  english_pob_choice: he met his death in ashes
  chosen_korean: 재 가운데서 죽음을 맞았습니다
  alternatives_korean:
  - 재 속에서 죽음을 받았습니다
  - 재 속에서 죽임을 당했습니다
  - 재 가운데서 죽음을 받았습니다
  lexicon: LSJ
  rationale: ἐκομίσατο는 ‘받다/겪다’의 뉘앙스를 지니지만, 한국어에서는 ‘죽음을 맞다’가 자연스럽게 그 결과를 전달합니다.
theological_decisions:
- issue: 제단의 불과 재에 대한 ἁγνός의 의미
  chosen_reading: ‘거룩하였는데’로 옮겨 제의적으로 성별된 상태를 강조했습니다.
  alternative_readings:
  - ‘정결하였는데’로 옮길 수 있습니다
  - ‘순결하였는데’로 옮길 수 있습니다
  rationale: 문맥은 물리적 청결보다 성소의 거룩함과 모독의 대비를 강조하므로, ‘거룩하다’가 원문의 종교적 무게를 가장 잘 전달합니다.
  doctrine_reference: Translation philosophy §§1, 6
