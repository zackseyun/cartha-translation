  lexicon: 고유명사 음역
  rationale: 그리스어 표면형 Βαθσούροις를 따르되, 한국어에서는 현대식 음역으로 자연스럽게 옮겼습니다. ‘Beth-zur’에 해당하는 셈어형을 드러내기보다 본문 증거의 그리스어 표기를 우선했습니다.
- source_word: φρούριον ὀλίγον
  english_pob_choice: small garrison
  chosen_korean: 작은 부대
  alternatives_korean:
  - 작은 수비대
  - 작은 요새
  - 작은 주둔지
  lexicon: LSJ
  rationale: φρούριον은 구조물보다 그곳을 지키는 군사적 거점/주둔을 가리킬 수 있고, ὀλίγον이 그 규모의 작음을 덧붙입니다. 한국어에서는 ‘부대’가 이 군사적 실체를 가장 자연스럽게 전달합니다.
- source_word: τῶν Ἰουδαίων
  english_pob_choice: of the Jews
  chosen_korean: 유대인들의
  alternatives_korean:
  - 유대인의
