  yaml_path: translation/deuterocanon/2_maccabees/013/019.yaml
  text: And at Bethsura he attacked a small garrison of the Jews[a], but was turned back, was repulsed[c][b], and was weakened.
  footnotes:
  - marker: a
    text: Or 'Beth-zur.' The Greek transliterates the place name as Βαθσούρα/Βαθσούροις.
    reason: lexical_alternative
  - marker: b
    text: '''Garrison'' could also be rendered ''fortress'' or ''stronghold''; the Greek φρούριον may refer either to the fortified post itself or to its military holding.'
    reason: lexical_alternative
  - marker: c
    text: 'The sequence of verbs is terse and cumulative: he advanced against the place, then was turned back, checked, and reduced in strength.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 벧수라[a]에서 유대인들이 지키는 작은 요새[b]를 공격했으나, 패하여 물러나고 저지에 부딪히며 약화되었습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 Βαθσούροις는 Βαθσούρα의 굴절형입니다. ‘벧수르’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 φρούριον은 ‘요새’, ‘성채’, ‘수비 거점’을 뜻할 수 있으며, 문맥에 따라 그곳의 수비대까지 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 원문은 ‘공격하다/진격하다’, ‘패하여 물러나다’, ‘저지에 부딪히다’, ‘약화되다’라는 동사를 짧게 이어, 그의 군사 행동이 좌절되고 세력이 약화되는 과정을 누적적으로 나타냅니다.
    reason: lexical_alternative
