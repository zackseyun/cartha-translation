  lexicon: LSJ
  rationale: 속격 소유/소속 관계를 직역하면서도 현대 한국어에서 자연스럽게 들리는 복수 소유형으로 옮겼습니다.
- source_word: προσῆγεν, ἐτροποῦτο, προσενέκρουσεν, ἡλαττονοῦτο
  english_pob_choice: he attacked ... was turned back ... was repulsed ... and was weakened
  chosen_korean: 공격하였으나, 되돌려지고, 격퇴당하고, 약해졌습니다
  alternatives_korean:
  - 진격하였으나, 되돌려지고, 막히고, 약해졌습니다
  - 다가갔으나, 물러나게 되고, 부딪혀 밀려났고, 줄어들었습니다
  lexicon: LSJ
  rationale: 네 동사가 짧고 누적적으로 이어지는 군사적 좌절을 나타내므로, 한국어도 동작의 연쇄를 살리되 ‘격퇴당하고’로 προσενέκρουσεν의 ‘부딪혀 밀려남/저지됨’을 반영했습니다. ‘약해졌습니다’는 ἡλαττονοῦτο의 감소·쇠약을 간결하게 전달합니다.
