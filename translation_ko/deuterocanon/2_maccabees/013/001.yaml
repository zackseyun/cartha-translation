  - …가 있었습니다
  lexicon: LSJ
  rationale: 이 동사는 단순한 ‘뉴스가 왔다’보다 사건의 발생을 넓게 알리므로, 직접적이지만 과도하게 해석되지 않는 사건 발생 표현을 택했습니다.
- source_word: τοῖς περὶ τὸν Ἰούδαν
  english_pob_choice: to those around Judas
  chosen_korean: 유다 주변에 있던 사람들
  alternatives_korean:
  - 유다 둘레에 있던 사람들
  - 유다와 함께한 사람들
  - 유다의 무리에게
  lexicon: LSJ
  rationale: 그리스어 관용구를 비교적 직역하되, 한국어에서 이해되도록 ‘주변에 있던 사람들’로 풀었습니다.
- source_word: σὺν πλήθεσιν
  english_pob_choice: with forces
  chosen_korean: 군대와 함께
  alternatives_korean:
  - 병력과 함께
  - 무리와 함께
  - 군세와 함께
  lexicon: LSJ
  rationale: πλήθη는 문자적으로 ‘무리들’이지만 군사 문맥에서는 병력/군세를 가리키므로, 본문의 전투 상황에 맞는 자연스러운 한국어로 옮겼습니다.
theological_decisions:
- issue: ἐπὶ τὴν Ἰουδαίαν의 대립적 방향성
  chosen_reading: ‘유다로 와서 맞섰다’로 옮겨 적대적 진군의 의미를 살렸습니다.
  alternative_readings:
  - 유다를 향하여
  - 유다에 대하여
  - 유대 지방으로
  rationale: ἐπί + 대격은 군사 문맥에서 적대적 접근을 드러내므로, 단순한 이동보다 대립성을 드러내는 쪽이 본문의 서사 의도를 더 잘 반영합니다.
  doctrine_reference: 서사 맥락의 전쟁 묘사
