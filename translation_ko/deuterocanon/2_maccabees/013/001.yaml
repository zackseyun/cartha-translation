  text: 백사십구년[a]에, 유다 주변에 있던 사람들에게 안티오쿠스 에우파토르가 군대와 함께 유다로 와서 맞섰다는 일이 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘안티오쿠스 에우파토르가 와서 유다 주변에 있던 사람들에게 이 일이 알려졌습니다’로도 옮길 수 있습니다. 그리스어 동사는 사건이 그들에게 닥치거나 그들의 주목에 들어온다는 뜻으로도 쓰입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔτῳ δὲ ἐνάτῳ καὶ τεσσερακοστῷ καὶ ἑκατοστῷ ἔτει
  english_pob_choice: In the one hundred forty-ninth year
  chosen_korean: 백사십구년
