  text: Now in that place there was a tower fifty cubits high[a], full of ashes, and it had all around it a circular contrivance sloping steeply down into the ashes.
  footnotes:
  - marker: a
    text: Or 'a circular device' or 'a round mechanism.' The Greek term for the apparatus is nonspecific, and the adjective may emphasize its round shape more than its motion.
    reason: lexical_alternative
translation:
  language: ko
  text: 그곳에는 높이가 오십 규빗 되는 탑이 있었는데, 재로 가득 차 있었습니다. 그리고 그 둘레에는 원형 장치가 있어 사방에서 가파르게 재 속으로 내려가게 되어 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘장치’는 ὄργανον의 폭넓은 의미를 따른 번역으로, 정확한 기능까지는 본문이 특정하지 않습니다.
    reason: lexical_alternative
