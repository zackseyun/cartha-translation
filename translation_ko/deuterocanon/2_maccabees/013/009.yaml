  text: But the king[a], weighed down in spirit, advanced, intending to inflict on the Jews the worst things that had happened under his father.
  footnotes:
  - marker: a
    text: Or, 'planning to bring upon the Jews the worst things that had happened in his father's time.' The Greek participle can be rendered with a nuance of expectation or intention.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 왕은 마음속에 짓눌린 채 앞으로 나아가고 있었으니 — 유대인들에게 자기 아버지 때에 일어난 가장 끔찍한 일들을 가하려고 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 아버지 시대에 일어난 가장 끔찍한 일들을 유대인들에게 가져오려고’로도 옮길 수 있습니다. 그리스어 분사는 기대나 의도의 뉘앙스를 띨 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῖς δὲ φρονήμασιν
  english_pob_choice: weighed down in spirit
  chosen_korean: 마음속에 짓눌린 채
  alternatives_korean:
  - 영으로 짓눌린 채
  - 마음에 짓눌린 채
  - 생각이 짓눌린 채
  lexicon: LSJ
  rationale: φρονήμασιν은 내적 태도나 생각의 영역을 가리키므로, 한국어에서는 자연스럽고 합쇼체 문체에 맞는 ‘마음속에’로 옮기되, 눌림의 상태를 ‘짓눌린 채’로 살렸습니다.
- source_word: βεβαρημένος
  english_pob_choice: weighed down
  chosen_korean: 짓눌린 채
  alternatives_korean:
  - 무거운 짐을 진 채
  - 눌려 있는 채
  - 부담을 안은 채
  lexicon: LSJ
  rationale: 완료 분사로 된 지속 상태를 나타내므로, 단순한 일시적 감정보다 계속된 압박 상태를 드러내는 표현을 택했습니다.
- source_word: ἦρχετο
  english_pob_choice: advanced
  chosen_korean: 앞으로 나아가고 있었으니
  alternatives_korean:
  - 전진하고 있었으니
  - 다가오고 있었으니
  - 나아오고 있었으니
  lexicon: LSJ
  rationale: 전쟁/원정 문맥에서의 미완료 시상은 진행 중인 움직임을 나타내므로, 군사적 행군의 뉘앙스를 살린 진행형으로 옮겼습니다.
- source_word: τὰ χείριστα τῶν ἐπὶ τοῦ πατρὸς αὐτοῦ γεγονότων
  english_pob_choice: the worst things that had happened under his father
  chosen_korean: 자기 아버지 때에 일어난 가장 끔찍한 일들
  alternatives_korean:
  - 자기 아버지 치세에 일어난 가장 나쁜 일들
  - 자기 아버지 시대에 있었던 가장 끔찍한 일들
  - 아버지 때에 일어난 최악의 일들
  lexicon: LSJ
  rationale: 중성 복수 최상급을 실질 명사처럼 받아 ‘일들’로 드러내고, ἐπὶ τοῦ πατρὸς αὐτοῦ는 시간/통치 시기를 가리키므로 ‘자기 아버지 때에’로 자연스럽게 옮겼습니다.
- source_word: ἐνδεξόμενος
  english_pob_choice: intending to inflict
  chosen_korean: 가하려고
  alternatives_korean:
  - 가하려는 의도로
  - 가하려는 계획으로
  - 가할 생각으로
  lexicon: LSJ
  rationale: 문맥상 유대인들에게 재앙을 ‘가하는’ 의도나 목표를 나타내므로, POB의 의도성 해석을 반영하되 한국어에서 지나치게 해설적으로 들리지 않게 압축했습니다.
theological_decisions:
- issue: ‘under his father’의 역사-정치적 시기 표현
  chosen_reading: ‘자기 아버지 때에’로 번역해, 단순한 가계상 언급이 아니라 아버지의 통치/시대라는 역사적 범위를 드러냈습니다.
  alternative_readings:
  - ‘아버지의 시대에’
  - ‘아버지의 치세에’
  rationale: ἐπὶ + genitive의 시간/통치 용법을 반영하여, 본문이 말하는 사건의 역사적 배경을 흐리지 않도록 했습니다.
  doctrine_reference: 역사서 문맥의 시기 표시
- issue: ἐνδεξόμενος의 의도성
  chosen_reading: 분사를 ‘가하려고’로 옮겨 왕의 적극적 적대 의도를 살렸습니다.
  alternative_readings:
  - ‘가할 뜻으로’
  - ‘가하려는 의도로’
  rationale: 영문 POB도 intention을 강조하며, 본문은 단순한 예측이 아니라 유대인에게 해를 끼치려는 왕의 목적을 드러냅니다.
  doctrine_reference: 본문 서술의 화행/의도성
