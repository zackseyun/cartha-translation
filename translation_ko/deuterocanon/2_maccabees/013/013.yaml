  naturalness: ‘그는 혼자서라도 장로들과 함께 상의한 뒤’는 ‘혼자서’와 ‘장로들과 함께’가 직접 충돌하여 자연스럽지 않습니다. ‘장로들과 따로 모여 의논한 뒤’는 사적인 협의라는 문맥을 자연스럽게 전달합니다.
  terminology: ‘장로들’, ‘왕의 군대’, ‘유대’, ‘그 성’, ‘하나님의 도움’은 적절합니다. κρῖναι τὰ πράγματα는 특정 법적 판결로 좁히지 않고 ‘이 일을 처리하다’로 옮겨 당면한 사태를 해결한다는 넓은 뜻을 보존했습니다.
