    rationale: 이 관용구는 뒤따르는 ‘장로들과 함께’ 때문에 독행을 뜻할 수 없고, 여기서는 ‘따로/비공개로’의 뜻이 적절합니다. ‘-라도’의 양보 의미도 원문에 없습니다.
