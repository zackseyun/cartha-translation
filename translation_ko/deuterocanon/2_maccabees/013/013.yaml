  text: But he himself[a], after meeting with the elders, decided, before the king’s army could invade Judea and gain control of the city, to go out and decide the matter with the help of God.
  footnotes:
  - marker: a
    text: Or 'settle affairs' or 'judge the situation' for 'decide the matter.' The Greek phrase is broad and can refer to resolving the crisis at hand.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 장로들과 따로 모여 의논한 뒤, 왕의 군대가 유다를 침략하여 그 성을 장악하기 전에, 그들이 나가서 하나님의 도움으로 이 일을 처리하기로 결의하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘따로’, ‘은밀히’로 옮길 수 있습니다. 그리스어 표현은 ‘장로들과 함께’라는 말과 함께 쓰였으므로, 혼자 행동했다기보다 다른 사람들과 떨어져 사적으로 모인 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθʼ ἑαυτόν
  english_pob_choice: privately
  chosen_korean: 혼자서라도
  alternatives_korean:
  - 따로
  - 은밀히
  - 개인적으로
  lexicon: LSJ
  rationale: 문맥상 장로들과 함께 상의하므로 ‘혼자’의 뜻이 아니라 ‘따로/개별적으로’의 뉘앙스를 살려, 공적 회의가 아닌 개인적 접근을 나타내는 표현으로 옮겼습니다.
- source_word: σὺν τοῖς πρεσβυτέροις γενόμενος
  english_pob_choice: after conferring ... with the elders
  chosen_korean: 장로들과 함께 상의한 뒤
  alternatives_korean:
  - 장로들을 만나고 나서
  - 장로들과 상의하고
  - 장로들과 함께 있게 된 뒤
  lexicon: LSJ
  rationale: γενόμενος는 단순 동반보다 ‘함께 모여’ 의논하는 흐름을 뜻하므로, 자연스러운 한국어로 ‘함께 상의한 뒤’라고 옮겼습니다.
- source_word: γενέσθαι τῆς πόλεως ἐγκρατεῖς
  english_pob_choice: gain control of the city
  chosen_korean: 그 성을 장악하다
  alternatives_korean:
  - 그 성을 차지하다
  - 그 성의 주인이 되다
  - 그 성을 통제하다
  lexicon: LSJ
  rationale: ἐγκρατεῖς는 단순 점유보다 ‘지배력 확보’의 의미가 강하므로, 군사적 맥락을 살려 ‘장악하다’로 옮겼습니다.
- source_word: τῇ τοῦ θεοῦ βοηθείᾳ
  english_pob_choice: with the help of God
  chosen_korean: 하나님의 도움으로
  alternatives_korean:
  - 하나님의 도움을 받아
  - 하나님의 도우심으로
  - 하나님의 도움과 함께
  lexicon: BDAG
  rationale: 여격 수단을 자연스러운 한국어로 옮기되, POB의 신학적 표기 관례에 따라 ‘하나님’을 유지했습니다.
theological_decisions:
- issue: ἐβουλεύσατο의 의사결정 뉘앙스
  chosen_reading: 단순한 생각이 아니라, 장로들과 상의한 후 실제 행동 계획을 세우는 결단으로 옮겼습니다.
  alternative_readings:
  - 숙고하였다
  - 의논하였다
  - 계획하였다
  rationale: 문장 전체가 군사적 위기 대응을 말하므로, deliberation 이후의 결정을 드러내는 ‘결정하려고 하였습니다’가 가장 적절합니다.
  doctrine_reference: 서사 문맥의 행위 결단 표현
- issue: καθʼ ἑαυτόν의 해석
  chosen_reading: ‘혼자서라도’로 처리해, 장로들과의 상의와 긴장되지 않도록 개인적/비공적 접근을 나타냈습니다.
  alternative_readings:
  - 혼자서
  - 따로
  - 은밀히
  rationale: 문맥상 실제 독행이 아니라 공적 장면과 구별되는 사적 접근이므로, 의미를 과도하게 좁히지 않으면서도 대비를 보존했습니다.
  doctrine_reference: 서사 담화의 행위자 관계
