  source_fidelity: 원문의 군사적 패배, 빌립과 관련된 난해한 조치, 유대인들에게의 굴복과 맹세, 화해 및 제의 행위의 순서는 대체로 보존되어야 합니다. 다만 초안의 ‘빌립을 붙들었고’는 μετέλαβεν의 불확실한 뜻을 구금·체포라는 특정 행위로 과도하게 확정합니다. ‘빌립과 관련하여 조처를 취했고’로 옮기고 주석으로 불확실성을 밝혀 두는 편이 안전합니다.
  naturalness: ‘유다 주변의 사람들’은 직역투이므로 ‘유다를 따르는 사람들’이 현대 한국어에서 자연스럽습니다. ‘국정을 맡겨진’은 문법적으로 부자연스러워 ‘국정을 맡아 남아 있던’으로 고쳤습니다. 또한 ‘의로운 조건’은 협상 문맥에서 다소 부자연스럽고 신학적 연상을 일으킬 수 있어 ‘정당한 조건’으로 다듬었습니다.
  terminology: ναός는 ‘성소’, θυσίαν προσήγαγεν은 ‘제사를 드렸습니다’로 유지할 수 있습니다. ὑπετάγη는 이 문맥에서 유대인들에게 정치적으로 굴복한 것이므로 ‘굴복하며’가 적절합니다. 기존 각주 a는 원문에 없는 ὁ를 인용하고, 빌립 관련 난해성을 충분히 설명하지 못하므로 교체합니다. 기존 각주 b는 ‘τόπον’에 관한 내용이지만 영어 POB 감사 기록의 해당 대안은 ἐπὶ πᾶσι τοῖς δικαίοις에 관한 것이므로, 본문상의 ‘정당한 조건’에 붙여 바로잡습니다.
