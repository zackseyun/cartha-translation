theological_decisions:
- issue: 화해·제사·성소 존중의 종교적 행위 서술
  chosen_reading: 사건 서술에 충실하게 ‘화해하고 제사를 드리며, 성소와 그곳을 존중했다’고 옮기고, 후대 신학 용어를 덧붙이지 않았습니다.
  alternative_readings:
  - ‘화해되었다’
  - ‘성전을 공경했다’
  rationale: 이 절은 역사 서술로서 군사적 패배 이후의 태도 변화를 묘사하므로, 의미를 확장하지 않고 행동의 연속을 그대로 드러냈습니다.
  doctrine_reference: 원문 우선, 역사 서술의 의미 범위 보존
- issue: μετέλαβεν의 모호한 동작
  chosen_reading: 빌립을 향한 정치적 조치로 읽되, 한국어는 과도한 단정 없이 ‘붙들었고’로 처리했습니다.
  alternative_readings:
  - ‘조치를 취했고’
  - ‘손을 댔고’
  - ‘빼앗았고’
  rationale: 그리스어 구문이 압축적이고 난해하여 정확한 세부를 과잉확정하지 않으면서도, 상황의 적대성과 급박함은 유지했습니다.
  doctrine_reference: 원문 불확실성의 정직한 보존
