base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/023.yaml
  text: He attacked those around Judas[a], but was defeated. Having become desperate, he took action against Philip in Antioch, the one left in charge of affairs; he was thrown into confusion, appealed to the Jews, submitted, and swore to all the just terms. He was reconciled and offered sacrifice, honored the sanctuary and the place[b], and showed kindness.
  footnotes:
  - marker: a
    text: The Greek sequence around 'he took action against Philip in Antioch ... he was thrown into confusion' is compressed and difficult; the exact nuance of the action toward Philip is uncertain.
    reason: textual_variant
  - marker: b
    text: Or 'to everything that was just.' The phrase may refer generally to fair conditions or specifically to the terms of settlement.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 유다 주변의 사람들을 공격했으나 패배했습니다. 절망한 그는 안티오키아에 있던, 국정을 맡겨진 빌립을 붙들었고, 혼란에 빠졌습니다. 그는 유대인들에게 간청하고, 순종하며, 모든 의로운 조건에 대하여 맹세했습니다. 그러고 나서 화해하고 제사를 드리며, 성소와 그곳을 존중했고, 친절을 베풀었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ὁ ἀπολελειμμένος ἐπὶ τῶν πραγμάτων는 ‘국정을 맡겨진 사람’, 곧 행정 책임자를 뜻하는 표현으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: τὸν τόπον은 문자적으로 ‘그곳’입니다. 문맥상 예루살렘 성소 주변을 가리키는 것으로 보이지만, 본문 자체는 그 이상을 말하지 않습니다.
    reason: lexical_alternative
