  text: By such a fate the lawless Menelaus happened to die[a], not even obtaining burial in the earth.
  footnotes:
  - marker: a
    text: Literally, 'not even obtaining the earth'; the sense is that Menelaus did not even receive burial.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런 운명으로 그 불법한 메넬라오스는 죽게 되었는데, 땅의 장사도 얻지 못했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘땅을 얻지도 못함’입니다. 여기서는 매장을 받지 못했다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιούτῳ μόρῳ
  english_pob_choice: by such a fate
  chosen_korean: 그런 운명으로
  alternatives_korean:
  - 그런 죽음으로
  - 그런 멸망으로
  lexicon: LSJ
  rationale: μόρος는 ‘운명, 죽음, 죽음의 방식’의 뉘앙스를 가지므로, 앞선 서술을 가리키는 ‘그런 운명으로’가 원문의 엄숙한 어조를 살립니다.
- source_word: τὸν παράνομον
  english_pob_choice: the lawless
  chosen_korean: 그 불법한
  alternatives_korean:
  - 그 악한
  - 그 율법을 어긴
  lexicon: LSJ
  rationale: παράνομος는 단순한 도덕 비난보다 ‘법을 거스르는, 불법한’의 법적·윤리적 힘이 있어, 이를 직역에 가깝게 살렸습니다.
- source_word: συνέβη θανεῖν
  english_pob_choice: happened to die
  chosen_korean: 죽게 되었는데
  alternatives_korean:
  - 죽게 되었습니다
  - 죽는 일이 일어났는데
  lexicon: LSJ
  rationale: συμβαίνω+부정사 구문은 ‘일어나다/되다’의 우연적·사건적 의미를 담으므로, 한국어에서 자연스럽게 ‘죽게 되다’로 옮겼습니다.
- source_word: μηδὲ τῆς γῆς τυγχάνοντα
  english_pob_choice: not even obtaining burial in the earth
  chosen_korean: 땅의 장사도 얻지 못했습니다
  alternatives_korean:
  - 땅을 얻지도 못했습니다
  - 땅에 묻히지도 못했습니다
  lexicon: LSJ
  rationale: 직역하면 ‘땅을 얻지 못함’이지만, 문맥상 의미는 매장 거부이므로 ‘장사’로 풀어 한국어 독자가 바로 이해하도록 했습니다.
theological_decisions:
- issue: Menelaus에 대한 도덕적·법적 규정의 톤
  chosen_reading: 그 불법한 메넬라오스
  alternative_readings:
  - 그 악한 메넬라오스
  - 율법을 어긴 메넬라오스
  rationale: 원문 παράνομος의 핵심은 일반적 악인 규정이 아니라 ‘불법한’ 사람이라는 법적·도덕적 판정이므로, 이를 약화하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §5
