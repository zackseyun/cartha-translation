  text: But Rhodocus, from the Jewish ranks, disclosed the secrets to the enemies; he was sought out and caught and imprisoned.
translation:
  language: ko
  text: 그런데 유대인 계열 출신인 로도코스는 적들에게 그 비밀들을 누설했습니다. 그는 수색당하여 붙잡혀 감옥에 갇혔습니다.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘유대인 계열’은 ἐκ τῆς Ἰουδαϊκῆς τάξεως를 직역한 표현으로, 소속·편제를 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘붙잡혀’는 POB의 ‘caught’를 반영한 표현입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: τὰ μυστήρια
  english_pob_choice: the secrets
  chosen_korean: 그 비밀들
  alternatives_korean:
  - 비밀들
  - 은밀한 일들
  - 비의들
  lexicon: μυστήρια
  rationale: 여기서는 종교적 ‘신비’보다 적에게 넘긴 ‘비밀’의 의미가 분명하므로, POB의 English choice를 따라 한국어도 자연스럽게 ‘비밀들’로 옮겼습니다.
- source_word: τοῖς πολεμίοις
  english_pob_choice: to the enemies
  chosen_korean: 적들에게
  alternatives_korean:
  - 원수들에게
  - 적들한테
  lexicon: πολεμίοις
  rationale: 복수 목적격의 ‘적들’을 직접 반영하여, 문맥상 군사적 대립을 분명히 드러내는 ‘적들에게’로 옮겼습니다.
- source_word: ἐκ τῆς Ἰουδαϊκῆς τάξεως
  english_pob_choice: from the Jewish ranks
  chosen_korean: 유대인 계열 출신인
  alternatives_korean:
  - 유대인 진영에서 나온
  - 유대인 무리에서 나온
  - 유대인의 편에 속한
  lexicon: Ἰουδαϊκῆς τάξεως
  rationale: τάξις는 여기서 단순한 ‘순서’가 아니라 소속·편제·부류를 가리키므로, 한국어에서는 ‘계열 출신’으로 풀어 소속과 출신을 함께 보이게 했습니다.
- source_word: ἀνεζητήθη καὶ κατελήμφθη καὶ κατεκλείσθη
  english_pob_choice: he was sought out and caught and imprisoned
  chosen_korean: 수색당하여 붙잡혀 감옥에 갇혔습니다
  alternatives_korean:
  - 찾아내어 붙잡혀 가두어졌습니다
  - 수배되어 붙잡혀 감금되었습니다
  - 찾아지고 붙잡혀 감옥에 갇혔습니다
  lexicon: ἀνεζητήθη / κατελήμφθη / κατεκλείσθη
  rationale: 세 동사를 한국어의 자연스러운 서술 진행으로 옮기되, POB의 ‘caught’를 반영해 ‘붙잡혀’로 번역하고, 마지막 동사는 결과 상태를 분명히 하는 ‘감옥에 갇혔습니다’로 처리했습니다.
theological_decisions:
- issue: ‘μυστήρια’의 의미 범주
  chosen_reading: 문맥상 계시적 ‘신비’가 아니라 적에게 넘긴 군사적 비밀로 읽었습니다.
  alternative_readings:
  - 종교적 신비
  - 숨겨진 계획
  - 비밀스러운 일
  rationale: 앞뒤 문맥이 배신과 체포에 관한 서술이므로, 독자가 오해하지 않도록 비종교적 의미를 우선했습니다.
  doctrine_reference: 문맥 우선 원칙
