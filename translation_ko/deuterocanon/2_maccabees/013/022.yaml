  chosen_korean: 떠났습니다
  alternatives_korean:
  - 가버렸습니다
  - 물러났습니다
  - 떠나갔습니다
  lexicon: LSJ
  rationale: 서술 동사로서 단순한 이탈을 뜻하므로, 현대 문어체에서 가장 간결하고 자연스러운 ‘떠났습니다’로 옮겼습니다.
