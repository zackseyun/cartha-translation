    reason: alternative_reading
translation:
  language: ko
  text: 왕은 베스수라[b]에 있는 사람들과 다시 협상하고, 신의의 보증을 주고받은[a] 뒤 떠났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘오른손을 주고받았다’는 뜻입니다. 이는 협정이나 신의의 보증을 교환했음을 나타내는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘베스수라’는 히브리 지명 벳수르(Beth-zur)를 반영한 그리스어 형태이며, ‘벳수르’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐδευτερολόγησεν
  english_pob_choice: negotiated further
  chosen_korean: 다시 협상하여
