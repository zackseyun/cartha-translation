  text: The king negotiated further with those in Bethsura[a], gave and received pledges of good faith, and went away[b],
  footnotes:
  - marker: a
    text: Literally, 'gave and received the right hand,' an idiom for exchanging pledges or assurances of agreement.
    reason: lexical_alternative
  - marker: b
    text: Bethsura may also be rendered 'Beth-zur,' reflecting the Hebrew place-name behind the Greek form.
    reason: alternative_reading
translation:
  language: ko
  text: 왕은 바드수라에 있는 사람들과 다시 협상하여, 오른손을 내밀어 주고 또 받는 식으로 신의의 담보를 주고받은 뒤 떠났습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘오른손을 주고받았다’는 뜻으로, 고대의 협정·화친·보증을 나타내는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: Βαθσούροις는 히브리 지명을 반영한 베드수르/베스수라 계열의 그리스어 표기입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐδευτερολόγησεν
  english_pob_choice: negotiated further
  chosen_korean: 다시 협상하여
  alternatives_korean:
  - 한 번 더 말하여
  - 재차 협상하여
  - 다시 교섭하여
  lexicon: LSJ
  rationale: 문맥상 단순한 ‘다시 말함’이 아니라 전쟁 상황에서 조건을 재조정하는 재협상을 가리키므로, 한국어로는 ‘다시 협상하여’가 가장 자연스럽습니다.
- source_word: τοῖς ἐν Βαθσούροις
  english_pob_choice: with those in Bethsura
  chosen_korean: 바드수라에 있는 사람들과
  alternatives_korean:
  - 바드수라에 있는 자들과
  - 베드수르에 있는 사람들과
  - 바드수라의 주민들과
  lexicon: LSJ
  rationale: ‘~에 있는 사람들’은 군사적·정치적 대상이지만 성별을 과도하게 특정하지 않으면서 원문의 범위를 잘 살립니다.
- source_word: δεξιὰν ἔδωκεν, ἔλαβεν
  english_pob_choice: gave and received pledges of good faith
  chosen_korean: 오른손을 내밀어 주고 또 받는 식으로 신의의 담보를 주고받은 뒤
  alternatives_korean:
  - 오른손을 주고받아 신의를 약속한 뒤
  - 우정의 악수를 나눈 뒤
  - 신의의 보증을 주고받은 뒤
  lexicon: LSJ
  rationale: 직역하면 ‘오른손을 주고받다’이지만, 이 관용구는 협정·안전 보장의 표지이므로 본문에는 의미를 풀어 쓰고, 손의 이미지는 유지했습니다.
- source_word: ἀπῇει
  english_pob_choice: went away
  chosen_korean: 떠났습니다
  alternatives_korean:
  - 가버렸습니다
  - 물러났습니다
  - 떠나갔습니다
  lexicon: LSJ
  rationale: 서술 동사로서 단순한 이탈을 뜻하므로, 현대 문어체에서 가장 간결하고 자연스러운 ‘떠났습니다’로 옮겼습니다.
