- source_word: δεξιὰν ἔδωκεν, ἔλαβεν
  english_pob_choice: gave and received pledges of good faith
  chosen_korean: 오른손을 내밀어 주고 또 받는 식으로 신의의 담보를 주고받은 뒤
  alternatives_korean:
  - 오른손을 주고받아 신의를 약속한 뒤
  - 우정의 악수를 나눈 뒤
  - 신의의 보증을 주고받은 뒤
  lexicon: LSJ
  rationale: 직역하면 ‘오른손을 주고받다’이지만, 이 관용구는 협정·안전 보장의 표지이므로 본문에는 의미를 풀어 쓰고, 손의 이미지는 유지했습니다.
- source_word: ἀπῇει
