lexical_decisions:
- source_word: μεταλαβὼν
  english_pob_choice: when Judas learned these things
  chosen_korean: 이 일을 듣고 나서
  alternatives_korean:
  - 이것들을 받아서
  - 이것들을 이해하고 나서
  - 이 소식을 전해 듣고
  lexicon: LSJ
  rationale: 문맥상 단순한 수용이 아니라 전달된 소식을 접한 뒤의 반응이므로, 한국어에서는 자연스럽게 ‘듣고 나서’로 옮기는 것이 가장 정확합니다.
- source_word: παρήγγειλεν
  english_pob_choice: he ordered
