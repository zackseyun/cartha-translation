lexical_decisions:
- source_word: μεταλαβὼν
  english_pob_choice: when Judas learned these things
  chosen_korean: 이 일을 듣고 나서
  alternatives_korean:
  - 이것들을 받아서
  - 이것들을 이해하고 나서
  - 이 소식을 전해 듣고
  lexicon: LSJ
  rationale: 문맥상 단순한 수용이 아니라 전달된 소식을 접한 뒤의 반응이므로, 한국어에서는 자연스럽게 ‘듣고 나서’로 옮기는 것이 가장 정확합니다.
- source_word: παρήγγειλεν
  english_pob_choice: he ordered
  chosen_korean: 명했습니다
  alternatives_korean:
  - 명령했습니다
  - 지시했습니다
  - 지시를 내렸습니다
  lexicon: LSJ
  rationale: 무리에게 내리는 권위 있는 지시의 힘을 살리되, 현대 한국어에서 과도하게 딱딱하지 않게 ‘명했습니다’로 처리했습니다.
- source_word: τῷ πλήθει
  english_pob_choice: the multitude
  chosen_korean: 무리에게
  alternatives_korean:
  - 군중에게
  - 백성에게
  - 많은 사람들에게
  lexicon: LSJ
  rationale: 단순한 군중이 아니라 함께 모인 집단 전체를 가리키므로, 문맥에 맞는 집합명사인 ‘무리’가 적절합니다.
- source_word: ἐπικαλεῖσθαι τὸν κύριον
  english_pob_choice: to call upon the Lord
  chosen_korean: 주께 부르짖어
  alternatives_korean:
  - 주를 부르며
  - 주께 간구하여
  - 주를 불러
  lexicon: LSJ
  rationale: 기도적 간구의 뉘앙스를 살리기 위해 ‘부르짖다’를 택했습니다. 여기서 κύριος는 기도 대상이므로 프로젝트 기본 용례대로 ‘주’로 옮겼습니다.
theological_decisions:
- issue: 기도의 대상인 κύριος의 번역
  chosen_reading: 주
  alternative_readings:
  - 주님
  - 주인
  rationale: 이 문맥은 하나님께 드리는 공동체적 간구이므로, 한국어 기독교 용례와 본문의 신학적 지시를 함께 살려 ‘주’가 가장 적절합니다.
  doctrine_reference: 'DOCTRINE.md contested terms: κύριος → 주/주님'
