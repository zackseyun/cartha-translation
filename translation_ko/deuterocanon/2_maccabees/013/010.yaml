  - 백성에게
  - 많은 사람들에게
  lexicon: LSJ
  rationale: 단순한 군중이 아니라 함께 모인 집단 전체를 가리키므로, 문맥에 맞는 집합명사인 ‘무리’가 적절합니다.
- source_word: ἐπικαλεῖσθαι τὸν κύριον
  english_pob_choice: to call upon the Lord
  chosen_korean: 주께 부르짖어
  alternatives_korean:
  - 주를 부르며
  - 주께 간구하여
  - 주를 불러
  lexicon: LSJ
  rationale: 기도적 간구의 뉘앙스를 살리기 위해 ‘부르짖다’를 택했습니다. 여기서 κύριος는 기도 대상이므로 프로젝트 기본 용례대로 ‘주’로 옮겼습니다.
