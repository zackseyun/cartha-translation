  source_fidelity: 핵심 의미는 대체로 반영했지만, ‘그들을 도우시게 하라고’는 하나님께 도움을 강제하게 한다는 뜻으로 읽힐 수 있어, 기도 내용으로서의 청원(ἐπιβοηθεῖν)을 더 분명히 해야 합니다. 또한 ταῦτα는 복수이므로 ‘이 일들을/이러한 일들을’이 더 충실합니다.
