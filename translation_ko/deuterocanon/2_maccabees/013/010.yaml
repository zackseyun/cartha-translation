  - 지시했습니다
  - 지시를 내렸습니다
  lexicon: LSJ
  rationale: 무리에게 내리는 권위 있는 지시의 힘을 살리되, 현대 한국어에서 과도하게 딱딱하지 않게 ‘명했습니다’로 처리했습니다.
- source_word: τῷ πλήθει
  english_pob_choice: the multitude
  chosen_korean: 무리에게
  alternatives_korean:
