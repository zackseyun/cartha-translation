  source_fidelity: 현 초안은 마지막 절의 주어와 능동 관계를 바꾸었습니다. 그리스어는 ‘유다가 그들을 권면하고 명령하였다’(ὁ Ἰούδας ... ἐκέλευσεν)인데, 초안은 ‘그들이 유다의 권면을 받고 명령을 받았다’로 피동화하여 유다의 행위를 불필요하게 약화했습니다. 또한 κλαυθμός는 ‘눈물’보다는 행위·소리로서의 ‘울음’이 더 직접적이며, νηστειῶν의 복수를 ‘여러 번의 금식’으로 시간상 반복 행위로 한정할 필요는 없습니다.
  naturalness: 수정문은 현대 표준어 합쇼체로 자연스럽고, 긴 그리스어 속격절을 ‘…한 뒤’로 처리하여 문장 관계를 분명히 합니다. ‘울음과 금식과 엎드림’은 기도·간구 문맥에서 자연스러운 병렬입니다.
  terminology: κύριος는 ‘주님’, ἐλεήμων은 ‘자비로우신’, παρακαλέω는 문맥상 ‘권면하다’로 유지했습니다. παραγίνεσθαι는 기본적으로 오다/도착하다/출석하다라는 뜻이므로 본문의 ‘모이도록’은 가능한 문맥적 표현이며, 각주에서 대안을 밝혔습니다.
