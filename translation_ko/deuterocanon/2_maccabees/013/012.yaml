  yaml_path: translation/deuterocanon/2_maccabees/013/012.yaml
  text: And when all had done the same together and had implored the merciful Lord with weeping and fasting and prostration for three days without ceasing[a], Judas encouraged them and ordered them to assemble.
  footnotes:
  - marker: a
    text: Or 'ordered them to assemble' or 'ordered them to come/present themselves.' The Greek verb can denote arriving or being present; the rendering 'be ready' reflects the likely military sense in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 모두가 함께 같은 일을 하고, 울음과 금식과 엎드림으로 사흘 동안 끊임없이 자비로우신 주님께 간청한 뒤, 유다는 그들을 권면하고 모이도록 명령했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오도록 명령했습니다’ 또는 ‘출석하도록 명령했습니다’라고 옮길 수 있습니다. 그리스어 παραγίνομαι는 ‘오다, 도착하다, 출석하다’라는 뜻을 가지며, 이 문맥에서는 소집에 응하여 나타나는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντων δὲ τὸ αὐτὸ ποιησάντων ὁμοῦ
  english_pob_choice: when all had done the same together
  chosen_korean: 그리고 모두가 한꺼번에 같은 일을 하고
  alternatives_korean:
  - 모두가 함께 같은 일을 한 뒤
  - 모두가 같은 일을 함께 한 뒤에
  lexicon: LSJ
  rationale: 분사적 속행 관계를 한국어로 자연스럽게 풀되, ὁμοῦ의 집단적 동작을 '한꺼번에'로 살렸습니다.
- source_word: καταξιωσάντων τὸν ἐλεήμονα κύριον
  english_pob_choice: had implored the merciful Lord
  chosen_korean: 자비로우신 주님께 간청한
  alternatives_korean:
  - 자비로우신 주님께 간구한
  - 자비로운 주님께 애원한
  lexicon: LSJ
  rationale: 기도문 맥락에서 καταξιόω를 단순한 '가치 있게 여기다'가 아니라 간청/간구의 의미로 읽은 POB 판단을 따라, 격식을 갖춘 '간청하다'로 옮겼습니다.
- source_word: μετὰ κλαυθμοῦ καὶ νηστειῶν καὶ προπτώσεως
  english_pob_choice: with weeping and fastings and prostration
  chosen_korean: 눈물과 여러 번의 금식과 엎드림으로
  alternatives_korean:
  - 울음과 금식들과 엎드림으로
  - 통곡과 금식과 엎드려 절함으로
  lexicon: LSJ
  rationale: κλαυθμός는 '눈물'보다 '울음/통곡'이 가능하지만, 한국어 문맥의 유려함과 병렬 균형을 위해 '눈물'로 압축했습니다. νηστειῶν의 복수는 단수로 평준화하지 않고 '여러 번의 금식'으로 반영했습니다. προπτώσις는 물리적 엎드림을 뜻하므로 '엎드림'으로 옮겼습니다.
- source_word: παρακαλέσας αὐτοὺς ὁ Ἰούδας ἐκέλευσεν παραγίνεσθαι
  english_pob_choice: Judas encouraged them and ordered them to assemble
  chosen_korean: 유다의 권면을 받은 그들은 모여들도록 명령을 받았습니다.
  alternatives_korean:
  - 유다가 그들을 권면하고 모이도록 명령했습니다.
  - 유다가 그들을 격려하고 모이도록 명령했습니다.
  lexicon: LSJ
  rationale: παρακαλέω는 권면/격려의 중간 의미를 가지므로 '권면'을 택했고, ἐκέλευσεν παραγίνεσθαι는 POB의 최종 조정처럼 '모이도록 명령하다'로 처리해 군사적 소집의 힘을 살렸습니다.
theological_decisions:
- issue: κύριος의 신앙적 호칭과 야훼 표기 여부
  chosen_reading: 본 절에서는 '주님'으로 옮기고 야훼 표기는 사용하지 않았습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 2 마카베오서는 그리스어 서술 속 기도문이지만, 본 절의 κύριος는 직접적인 야훼 인용 표지 없이 일반적 경외 호칭으로 기능하므로 POB 기본값인 '주님'을 택했습니다.
  doctrine_reference: 'POB contested terms: κύριος → 주님; LXX quotation policy'
