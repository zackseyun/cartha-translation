  text: 날이 이미 밝아 오기 시작했을 때에는, 이 일이 이미 일어나 있었습니다. 이는 주님의 보호가 그를 신속히 도와주었기 때문이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
