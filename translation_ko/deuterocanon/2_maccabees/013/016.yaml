  naturalness: ‘그리고 마침내’, ‘진을 두려움과 혼란으로 가득 채우고’는 현대 한국어 합쇼체 서술로 자연스럽습니다. ‘순조롭게 물러났습니다’는 군사적 철수의 문맥에서 자연스러우면서 원문의 넓은 긍정적 결과를 보존합니다.
