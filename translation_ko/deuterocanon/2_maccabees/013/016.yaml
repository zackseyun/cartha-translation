  text: And in the end they filled the camp with fear and confusion[a], and withdrew prosperously.
  footnotes:
  - marker: a
    text: Or 'withdrew prospering' / 'departed successfully.' The Greek participle εὐημεροῦντες literally suggests faring well or prospering; the main text renders the sense idiomatically in this military context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 마침내 그들은 진을 두려움과 혼란으로 가득 채우고, 무사히 물러났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 "성공적으로 물러났습니다". 그리스어 분사 εὐημεροῦντες는 문자적으로는 '잘됨/형통함'을 뜻하지만, 군사 서술에서는 안전하고 유리하게 철수했다는 뜻으로 읽힙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ τέλος
  english_pob_choice: in the end
  chosen_korean: 마침내
  alternatives_korean:
  - 끝내
  - 결국
  lexicon: LSJ
  rationale: 사건의 결말을 가리키는 시간 부사구로, 서술 흐름을 자연스럽게 살리면서도 원문의 종결감을 유지합니다.
- source_word: παρεμβολήν
  english_pob_choice: camp
  chosen_korean: 진
  alternatives_korean:
  - 진영
  - 캠프
  - 군영
  lexicon: LSJ
  rationale: 군사 문맥에서 집결한 군대의 진을 뜻하므로, 현대 한국어에서 간결하고 자연스러운 "진"이 적절합니다.
- source_word: ἐπλήρωσαν ... δέους καὶ ταραχῆς
  english_pob_choice: filled ... with fear and confusion
  chosen_korean: 두려움과 혼란으로 가득 채우고
  alternatives_korean:
  - 공포와 혼란으로 가득 채우고
  - 두려움과 소동으로 가득 채우고
  lexicon: LSJ
  rationale: δέος은 과도한 "공포"보다 넓은 두려움을 뜻하고, ταραχή는 동요·혼란을 가리키므로 두 단어의 병치를 살려 옮겼습니다.
- source_word: εὐημεροῦντες
  english_pob_choice: withdrew prosperously
  chosen_korean: 무사히 물러났습니다
  alternatives_korean:
  - 순조롭게 물러났습니다
  - 성공적으로 물러났습니다
  - 잘되어 물러났습니다
  lexicon: LSJ
  rationale: 직역하면 "번성하며/형통하며"이지만, 전투 서술에서는 안전하고 성공적인 철수를 뜻하므로 그 함의를 한국어로 풀어냈습니다.
