base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/004.yaml
  text: But the King of kings stirred up Antiochus’s anger against the wretch, and when Lysias pointed him out as being responsible for the evils and for everything, he ordered them to put him to death, taking him to Beroea, as is the custom in that place.
  footnotes:
  - marker: a
    text: Or 'against the criminal' or 'against the villain' for 'the wretch' (Greek ἀλιτήριον), a strong term of moral condemnation.
    reason: lexical_alternative
  - marker: b
    text: Beroea here refers to the place of execution according to local custom.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 왕 중의 왕께서 안티오코스의 분노를 그 악인에게 일으키셨고, 리시아스가 그를 모든 재앙의 원인이라고 지목하자, 그는 그를 죽이도록 명령했으니, 그곳의 관례대로 베로이아로 데려가게 하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 악인’은 Greek ἀλιτήριον의 강한 도덕적 비난을 살린 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 베로이아는 이곳에서 현지 관례에 따른 처형 장소를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ δὲ βασιλεὺς τῶν βασιλέων
  english_pob_choice: the King of kings
  chosen_korean: 왕 중의 왕
  alternatives_korean:
  - 왕들의 왕
  - 왕 중의 왕이신 하나님
  lexicon: LSJ
  rationale: 직함의 위엄을 살리되, 본문이 하나님의 주권을 암시하는 표현이므로 과도한 설명을 덧붙이지 않고 자연스러운 한자어 구조로 옮겼습니다.
- source_word: ἐξήγειρεν τὸν θυμὸν
  english_pob_choice: stirred up ... anger
  chosen_korean: 분노를 ... 일으키셨고
  alternatives_korean:
  - 분노를 ... 부추기셨고
  - 분노를 ... 자극하셨고
  lexicon: LSJ
  rationale: ἐξήγειρεν의 사동적 뉘앙스를 살리기 위해 ‘일으키다’를 택했고, θυμός는 문맥상 ‘분노’가 가장 자연스럽습니다.
- source_word: ἐπὶ τὸν ἀλιτήριον
  english_pob_choice: against the wretch
  chosen_korean: 그 악인에게
  alternatives_korean:
  - 그 비열한 자에게
  - 그 패륜자에게
  - 그 죄인에게
  lexicon: LSJ
  rationale: ἀλιτήριον의 강한 도덕적 비난을 한국어에서 지나치게 고어적이지 않게 전달하기 위해 ‘악인’을 선택했습니다.
- source_word: αἴτιον τῶν κακῶν εἶναι καὶ πάντων
  english_pob_choice: as being responsible for the evils and for everything
  chosen_korean: 모든 재앙의 원인이라고
  alternatives_korean:
  - 재앙들과 모든 일의 원인이라고
  - 모든 악의 원인이라고
  lexicon: LSJ
  rationale: αἴτιος를 ‘원인’으로 옮기고, τὰ κακά와 πάντων의 압축된 비난을 ‘모든 재앙’으로 응축해 한국어 문장 안에서 과도한 나열을 피했습니다.
- source_word: προσέταξεν ... προσαπολέσαι
  english_pob_choice: he ordered ... to put him to death
  chosen_korean: 그를 죽이도록 명령했으니
  alternatives_korean:
  - 그를 처형하도록 명령했으니
  - 그를 멸하라고 명령했으니
  lexicon: LSJ
  rationale: 강조된 파괴 동사라도 문맥상 실제 처형을 가리키므로, 한국어에서는 직설적인 ‘죽이다’로 옮겨 의미를 분명히 했습니다.
- source_word: ἀγαγόντας εἰς Βέροιαν
  english_pob_choice: taking him to Beroea
  chosen_korean: 베로이아로 데려가게 하셨습니다
  alternatives_korean:
  - 베로이아로 데려가도록 하셨습니다
  - 베로이아로 끌고 가게 하셨습니다
  lexicon: LSJ
  rationale: 분사구의 수단·동반 상황을 한국어의 사역 표현으로 풀어, 명령의 실행 방식이 자연스럽게 드러나도록 했습니다.
theological_decisions:
- issue: 왕 중의 왕의 지시 주체와 서술 시점
  chosen_reading: 하나님의 주권적 개입을 서술하는 역사 서술로 읽고, 주어를 직접적으로 ‘왕 중의 왕’으로 유지했습니다.
  alternative_readings:
  - 단순한 과장된 왕호로 읽기
  - 주권 주체를 명시적으로 ‘하나님’으로 바꾸기
  rationale: 본문은 인간 왕들 위에 계신 절대 주권자를 암시하지만, 한국어 본문에서는 원문 직함을 보존하는 편이 원문 가시성과 신학적 긴장을 함께 지킵니다.
  doctrine_reference: 'DOCTRINE.md: titles should preserve theological weight without flattening the source.'
