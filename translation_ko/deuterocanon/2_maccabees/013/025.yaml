  lexicon: LSJ
  rationale: 여기서는 구체적 합의 조건이나 조약 조항을 가리키므로, 간결한 ‘조건들’이 본문의 맥락을 살리면서도 문장을 과장하지 않습니다.
- source_word: ἐδειλίαζον ὑπεράγαν
  english_pob_choice: were exceedingly fearful
  chosen_korean: 몹시 두려워했기 때문입니다
  alternatives_korean:
  - 지나치게 두려워했기 때문입니다
