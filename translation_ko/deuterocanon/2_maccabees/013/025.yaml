  - 극도로 두려워했기 때문입니다
  lexicon: LSJ
  rationale: 이 표현은 두려움의 강도를 강조하므로 ‘몹시’로 살리고, 동사 의미는 ‘두려워하다’로 직접 옮겨 원문의 심리적 이유절을 분명히 했습니다.
- source_word: ἀθετεῖν τὰς διαστάλσεις
  english_pob_choice: set aside the arrangements
  chosen_korean: 그 합의 조항들을 무효로 하려고 했습니다
  alternatives_korean:
  - 그 합의 조항들을 폐기하려고 했습니다
  - 그 협정 조항들을 없애려 했습니다
  - 그 정해진 사항들을 무시하려고 했습니다
  lexicon: LSJ
  rationale: ἀθετεῖν은 단순 무시보다 효력 상실이나 철회를 뜻할 수 있으므로, ‘무효로 하다’가 합의 파기를 가장 정확하게 드러냅니다. 다만 διαστάλσεις는 드문 단어이므로 본문은 자연스럽게 읽히는 ‘합의 조항들’로 옮기고, 각주로 대안을 남깁니다.
