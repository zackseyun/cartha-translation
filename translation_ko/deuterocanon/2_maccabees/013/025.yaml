  text: 그는 프톨레마이스에 이르렀습니다. 프톨레마이스 사람들은 협정 조건들을 못마땅해했습니다. 그들이 몹시 두려워했기 때문입니다. 그들은 그 정해진 규정들을[a] 무효로 하려고 했습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘조항들’, ‘합의 사항들’로 옮길 수 있습니다. 그리스어 명사는 드물며, 여기서는 타결된 합의의 구체적인 규정을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절의 그리스어 원문은 본문 검증에서 불일치 표시가 있습니다. 이 번역은 현전하는 그리스어 본문을 따르지만, 일부 어휘의 세부 의미는 통상보다 덜 확실합니다.
    reason: textual_variant
