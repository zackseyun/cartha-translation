translation:
  language: ko
  text: 그는 프톨레마이스에 이르렀습니다. 프톨레마이스 사람들은 조건들 때문에 불쾌해했는데, 그들이 몹시 두려워했기 때문입니다. 그래서 그들은 그 합의 조항들을 무효로 하려고 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘조항들’, ‘협정 조건들’로도 옮길 수 있습니다. 그리스어 명사는 드물며, 여기서는 타결된 합의의 구체적 규정을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절의 그리스어 원문은 본문 검증에서 불일치 표시가 있으므로, 번역은 현전하는 그리스어를 따르되 일부 어휘 세부는 보수적으로 읽었습니다.
    reason: textual_variant
