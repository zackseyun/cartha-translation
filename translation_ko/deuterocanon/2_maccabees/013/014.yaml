  lexicon: LSJ
  rationale: κύριος는 프로젝트 기본어인 ‘주’로, κόσμος는 여기서 ‘세계’로 옮겨 직역성을 유지했습니다.
- source_word: γενναίως ἀγωνίσασθαι μέχρι θανάτου
  english_pob_choice: to fight bravely to the death
  chosen_korean: 죽음에 이르기까지 용감하게 싸우라고
  alternatives_korean:
