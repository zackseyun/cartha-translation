  lexicon: LSJ
  rationale: 군사적 맥락의 ἀγωνίζομαι를 ‘싸우다’로 풀고, γενναίως는 ‘용감하게’로, μέχρι θανάτου는 ‘죽음에 이르기까지’로 자연스럽게 살렸습니다.
- source_word: περὶ νόμων, ἱεροῦ, πόλεως, πατρίδος, πολιτείας
  english_pob_choice: for the laws, the temple, the city, the homeland, and the commonwealth
  chosen_korean: 율법과 성전과 도성과 조국과 국가
  alternatives_korean:
  - 율법과 성전과 도시와 고향과 공동체
  - 율법과 성전과 도시와 조국과 공화국
  - 율법과 성전과 성읍과 հայրदेश와 헌정
  lexicon: LSJ
  rationale: νόμων은 복수형이므로 ‘율법들’보다 자연스러운 총칭인 ‘율법’으로, ἱεροῦ는 이 전투적 수호 문맥에서 ‘성전’으로, πόλεως는 ‘도성’으로, πατρίδος는 ‘조국’으로, πολιτεία는 공적 질서의 의미를 살려 ‘국가’로 옮겼습니다.
- source_word: περὶ δὲ Μωδεεὶμ
  english_pob_choice: near Modein
  chosen_korean: 모드인 근처에
  alternatives_korean:
  - 모드인 부근에
  - 모드인 가까이에
  - 모드인 주변에
  lexicon: LSJ
  rationale: περὶ + 지명은 대개 ‘~근처에’의 공간적 의미이므로 자연스럽게 옮겼습니다.
- source_word: ἐποιήσατο τὴν στρατιάν
  english_pob_choice: he encamped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 군대를 배치했습니다
  - 부대를 정비했습니다
  - 군진을 형성했습니다
  lexicon: LSJ
  rationale: 문맥상 στρατιά를 ‘군대’ 자체보다 군사 행동의 결과로 이해할 수 있어, 한국어에서는 이동·배치의 종착을 드러내는 ‘진을 쳤습니다’가 가장 자연스럽습니다.
