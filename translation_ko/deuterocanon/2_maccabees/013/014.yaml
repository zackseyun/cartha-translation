  text: And after entrusting the outcome to the Lord of the world[a], and urging those with him to fight bravely to the death for the laws, the temple, the city, the homeland, and the commonwealth[b], he encamped near Modein.
  footnotes:
  - marker: a
    text: Or 'to the Lord of the universe.' The Greek κόσμος can denote the world or the ordered universe.
    reason: lexical_alternative
  - marker: b
    text: '''Commonwealth'' translates πολιτεία, which can also mean ''constitution,'' ''civic order,'' or ''way of life.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 세계의 주께 맡기고, 자기와 함께한 이들에게 율법과 성전과 도성과 조국과 국가를 위해 죽음에 이르기까지 용감하게 싸우라고 권한 뒤, 그는 모드인 근처에 진을 쳤습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘세계’는 헬라어 κόσμος의 기본 뜻을 따른 번역입니다. 이 단어는 문맥에 따라 ‘우주’ 또는 ‘질서 있는 세계’도 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘국가’는 πολιτεία의 가능한 뜻들 가운데 이 문맥의 공적·정치적 의미를 반영한 번역입니다. 이 단어는 ‘공동체’, ‘헌정’, ‘공적 질서’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοὺς τὴν ἐπιτροπὴν
  english_pob_choice: after entrusting the oversight
  chosen_korean: 맡기고
  alternatives_korean:
  - 맡기며
  - 위탁하고
  - 돌보도록 맡기고
  lexicon: LSJ
  rationale: ἐπιτροπή는 맡김, 위탁, 책임을 넘기는 뜻이므로 한국어에서는 간결하게 ‘맡기고’로 옮겨 행위의 핵심을 살렸습니다.
- source_word: τῷ κυρίῳ τοῦ κόσμου
  english_pob_choice: the Lord of the world
  chosen_korean: 세계의 주
  alternatives_korean:
  - 세상의 주님
  - 우주의 주
  - 온 세계의 주
  lexicon: LSJ
  rationale: κύριος는 프로젝트 기본어인 ‘주’로, κόσμος는 여기서 ‘세계’로 옮겨 직역성을 유지했습니다.
- source_word: γενναίως ἀγωνίσασθαι μέχρι θανάτου
  english_pob_choice: to fight bravely to the death
  chosen_korean: 죽음에 이르기까지 용감하게 싸우라고
  alternatives_korean:
  - 끝까지 용감히 싸우라고
  - 죽을 때까지 담대히 싸우라고
  - 죽음에 이를 때까지 용맹하게 싸우라고
  lexicon: LSJ
  rationale: 군사적 맥락의 ἀγωνίζομαι를 ‘싸우다’로 풀고, γενναίως는 ‘용감하게’로, μέχρι θανάτου는 ‘죽음에 이르기까지’로 자연스럽게 살렸습니다.
- source_word: περὶ νόμων, ἱεροῦ, πόλεως, πατρίδος, πολιτείας
  english_pob_choice: for the laws, the temple, the city, the homeland, and the commonwealth
  chosen_korean: 율법과 성전과 도성과 조국과 국가
  alternatives_korean:
  - 율법과 성전과 도시와 고향과 공동체
  - 율법과 성전과 도시와 조국과 공화국
  - 율법과 성전과 성읍과 հայրदेश와 헌정
  lexicon: LSJ
  rationale: νόμων은 복수형이므로 ‘율법들’보다 자연스러운 총칭인 ‘율법’으로, ἱεροῦ는 이 전투적 수호 문맥에서 ‘성전’으로, πόλεως는 ‘도성’으로, πατρίδος는 ‘조국’으로, πολιτεία는 공적 질서의 의미를 살려 ‘국가’로 옮겼습니다.
- source_word: περὶ δὲ Μωδεεὶμ
  english_pob_choice: near Modein
  chosen_korean: 모드인 근처에
  alternatives_korean:
  - 모드인 부근에
  - 모드인 가까이에
  - 모드인 주변에
  lexicon: LSJ
  rationale: περὶ + 지명은 대개 ‘~근처에’의 공간적 의미이므로 자연스럽게 옮겼습니다.
- source_word: ἐποιήσατο τὴν στρατιάν
  english_pob_choice: he encamped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 군대를 배치했습니다
  - 부대를 정비했습니다
  - 군진을 형성했습니다
  lexicon: LSJ
  rationale: 문맥상 στρατιά를 ‘군대’ 자체보다 군사 행동의 결과로 이해할 수 있어, 한국어에서는 이동·배치의 종착을 드러내는 ‘진을 쳤습니다’가 가장 자연스럽습니다.
theological_decisions:
