  rationale: 이 절에서는 법, 성전, 도시, 조국과 나란히 지켜야 할 대상으로 열거되어 공적·정치적 실체를 가리키므로 ‘국가’가 가장 균형 있게 전달합니다.
  doctrine_reference: 공적-정치적 어휘의 문맥 우선 원칙
