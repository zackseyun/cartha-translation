  text: And after entrusting the outcome to the Lord of the world[a], and urging those with him to fight bravely to the death for the laws, the temple, the city, the homeland, and the commonwealth[b], he encamped near Modein.
  footnotes:
  - marker: a
    text: Or 'to the Lord of the universe.' The Greek κόσμος can denote the world or the ordered universe.
    reason: lexical_alternative
  - marker: b
    text: '''Commonwealth'' translates πολιτεία, which can also mean ''constitution,'' ''civic order,'' or ''way of life.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 세상의 주께 일을 맡기고[a], 자기와 함께한 사람들에게 율법과 성전과 도성과 조국과 공동체를 위하여 죽음에 이를 때까지 용감히 싸우라고 권한 뒤, 모드인 근처에 진을 쳤습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘세상’은 헬라어 κόσμος를 옮긴 말입니다. 이 단어는 문맥에 따라 ‘우주’ 또는 ‘질서 있는 세계’를 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘공동체’는 πολιτεία를 옮긴 말입니다. 이 단어는 ‘헌정’, ‘공적 질서’, 또는 ‘생활 방식’을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοὺς τὴν ἐπιτροπὴν
