  text: Lysias came forward to the tribunal, made as good a defense as he could, persuaded them, calmed them, made them well-disposed, and marched back to Antioch. Thus the king’s attack and withdrawal proceeded.
  footnotes:
  - marker: a
    text: Or 'judgment seat' or 'platform' for 'tribunal' (βῆμα).
    reason: lexical_alternative
  - marker: b
    text: The adverb behind 'as good a defense as he could' is difficult and may also mean 'adequately' or 'as circumstances allowed.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the king’s assault and retreat' for 'the king’s attack and withdrawal.'
    reason: lexical_alternative
translation:
  language: ko
  text: 리시아스는 재판석[a]으로 나아가, 할 수 있는 한[b] 변론하여 그들을 설득하고 진정시키고 호의를 품게 한 뒤 안티오키아로 돌아갔습니다. 이와 같이 왕의 공격과 철수[c]가 이루어졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: βῆμα는 ‘재판석’ 외에 ‘판정석’, ‘단’ 또는 ‘연단’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ἐνδεχομένως는 ‘가능한 한’ 외에 ‘적절하게’ 또는 ‘형편이 허락하는 대로’라는 뜻일 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘공격과 철수’는 ‘공격과 퇴각’ 또는 ‘공세와 철수’로도 옮길 수 있습니다.
    reason: lexical_alternative
