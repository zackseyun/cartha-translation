base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/026.yaml
  text: Lysias came forward to the tribunal, made as good a defense as he could, persuaded them, calmed them, made them well-disposed, and marched back to Antioch. Thus the king’s attack and withdrawal proceeded.
  footnotes:
  - marker: a
    text: Or 'judgment seat' or 'platform' for 'tribunal' (βῆμα).
    reason: lexical_alternative
  - marker: b
    text: The adverb behind 'as good a defense as he could' is difficult and may also mean 'adequately' or 'as circumstances allowed.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the king’s assault and retreat' for 'the king’s attack and withdrawal.'
    reason: lexical_alternative
translation:
  language: ko
  text: 리시아스는 법정 앞으로 나와 할 수 있는 한 변론하고 그들을 설득하며 진정시켜 호의적인 마음을 갖게 한 뒤 안티오키아로 돌아갔습니다. 그리하여 왕의 공격과 철수는 그렇게 진행되었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: βῆμα는 문자적으로 ‘단’이나 ‘재판석’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ἐνδεχομένως는 ‘가능한 한’ 또는 ‘형편이 되는 대로’의 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: Ἀντιοχία는 안티오키아로 음역하는 것이 일반적입니다.
    reason: source_note
lexical_decisions:
- source_word: βῆμα
  english_pob_choice: tribunal
  chosen_korean: 법정
  alternatives_korean:
  - 재판석
  - 판정석
  - 공식 심문 자리
  lexicon: LSJ
  rationale: βῆμα는 여기서 단순한 ‘단’이 아니라 공개적·사법적 자리로 쓰이므로, 기능을 살린 ‘법정’이 자연스럽습니다.
- source_word: ἀπελογήσατο ἐνδεχομένως
  english_pob_choice: made as good a defense as he could
  chosen_korean: 할 수 있는 한 변론하고
  alternatives_korean:
  - 가능한 한 변론하고
  - 형편이 닿는 대로 변론하고
  - 충분히 변론하고
  lexicon: LSJ
  rationale: ἐνδεχομένως는 ‘가능한 만큼/형편이 되는 대로’의 뉘앙스이므로, 과장 없이 제약된 충실함을 나타내는 표현으로 옮겼습니다.
- source_word: κατεπράϋνεν
  english_pob_choice: calmed them
  chosen_korean: 진정시켜
  alternatives_korean:
  - 달래어
  - 누그러뜨려
  - 완화시켜
  lexicon: LSJ
  rationale: 상대의 격앙을 가라앉히는 동작이므로, 현대 한국어에서 명확한 ‘진정시키다’를 선택했습니다.
- source_word: εὐμενεῖς ἐποίησεν
  english_pob_choice: made them well-disposed
  chosen_korean: 호의적인 마음을 갖게 한
  alternatives_korean:
  - 호의적으로 만든
  - 우호적으로 만든
  - 호의를 품게 한
  lexicon: LSJ
  rationale: 직역하면 ‘호의적이 되게 하다’이므로, 결과 상태를 자연스럽게 풀어 ‘호의적인 마음을 갖게 하다’로 옮겼습니다.
- source_word: ἀνέζευξεν
  english_pob_choice: returned to Antioch
  chosen_korean: 안티오키아로 돌아갔습니다
  alternatives_korean:
  - 안티오키아로 철수했습니다
  - 안티오키아로 떠났습니다
  - 안티오키아로 되돌아갔습니다
  lexicon: LSJ
  rationale: 이 동사는 군사적으로 ‘진을 걷고 돌아가다/철수하다’의 뜻이 있어, 영어 POB의 최종 수정처럼 단순한 ‘돌아갔습니다’가 가장 무리 없는 대응입니다.
- source_word: τὰ τῆς ἐφόδου ... καὶ τῆς ἀναζυγῆς
  english_pob_choice: the king’s attack and withdrawal
  chosen_korean: 왕의 공격과 철수
  alternatives_korean:
  - 왕의 공격과 후퇴
  - 왕의 공격과 퇴각
  - 왕의 공격과 귀환
  lexicon: LSJ
  rationale: ἐφόδος와 ἀναζυγή의 군사적 움직임을 함께 살리기 위해 ‘공격과 철수’로 간결하게 대응했습니다.
theological_decisions:
- issue: 이 절의 핵심은 신학 논쟁이 아니라 군사·법정 용어의 기능적 번역입니다.
  chosen_reading: 서술을 역사적 요약문으로 읽고, 법정 장면과 군사적 철수의 병렬을 그대로 살렸습니다.
  alternative_readings:
  - 더 문자적으로 ‘재판석’으로 옮김
  - ἀναζυγή를 ‘퇴각’으로 더 강하게 번역
  rationale: 원문은 교리 진술이 아니라 사건 요약이므로, 의미를 부풀리지 않으면서도 독자가 장면을 바로 이해하도록 했습니다.
  doctrine_reference: 'DOCTRINE.md: optimal equivalence; 역사 서술은 문맥상 기능을 우선하되 과도한 해석을 피함'
