  text: προσῆλθεν ἐπὶ τὸ βῆμα Λυσίας, ἀπελογήσατο ἐνδεχομένως, συνέπεισεν καὶ κατεπράϋνεν, εὐμενεῖς ἐποίησεν, ἀνέζευξεν εἰς Ἀντιοχίαν. οὕτω τὰ τῆς ἐφόδου τοῦ βασιλέως καὶ τῆς ἀναζυγῆς ἐχώρησεν.
