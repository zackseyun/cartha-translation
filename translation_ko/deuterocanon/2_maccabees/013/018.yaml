translation:
  language: ko
  text: 그런데 왕은 유대인들의 담대함을 경험으로 알고서, 계략으로 그 곳들을 점령하려고 했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘유대인들의 담대함을 경험을 통해 얻은 뒤’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: τόπους는 문자적으로는 ‘곳들’이지만, 군사적 문맥에서는 방어 거점이나 점거 대상 지역을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 동사의 정확한 뉘앙스는 다소 어려우며, 문맥상 ‘공격하다’ 또는 ‘압박하다’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰληφὼς πεῖραν
  english_pob_choice: having learned by experience
  chosen_korean: 경험으로 알고서
  alternatives_korean:
