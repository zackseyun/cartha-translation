  lexicon: LSJ
  rationale: 이 관용구는 단순한 지식이 아니라 체험을 통해 얻은 인식을 뜻하므로, 한국어에서는 자연스럽게 ‘경험으로 알고서’로 옮겨 경험적 인식을 드러냈습니다.
