  lexicon: LSJ
  rationale: 군사적 문맥에서 유대인들의 적극적이고 두려워하지 않는 태도를 가리키므로, 긍정·부정 어느 쪽으로도 과도하게 치우치지 않는 ‘담대함’을 택했습니다.
- source_word: διὰ μεθόδων
