  lexicon: LSJ
  rationale: μεθόδων은 여기서 단순한 ‘방법’이 아니라 우회적 군사 술수를 가리키므로, 자연스럽고 전술적 뉘앙스를 살리는 ‘계략으로’가 적절합니다.
- source_word: τοὺς τόπους
  english_pob_choice: the strongholds
  chosen_korean: 그 곳들
  alternatives_korean:
  - 그 장소들을
  - 그 진지들을
  - 그 요새들을
  lexicon: LSJ
  rationale: 본문 자체는 문자적으로 ‘그 곳들’이지만, 영어 POB가 군사적 맥락을 따라 ‘strongholds’로 해석한 점을 고려하되, 원문보다 좁히지 않도록 한국어에서는 덜 단정적인 ‘그 곳들’로 옮겼습니다.
theological_decisions:
- issue: 군사적 서술에서 장소 명칭을 어느 정도 구체화할지
  chosen_reading: 원문의 τόπους를 과도하게 ‘요새’로 고정하지 않고 ‘그 곳들’로 남겨, 본문이 말하는 방어 거점일 가능성은 열어 두되 확정적 해석은 피했습니다.
  alternative_readings:
