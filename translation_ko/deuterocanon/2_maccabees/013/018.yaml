  rationale: 영어 POB의 ‘strongholds’는 문맥상 해석이지만, 그 해석을 본문 자체의 확정 의미로 굳히면 원문보다 더 좁아질 수 있으므로, 한국어 본문은 더 개방적인 표현을 사용했습니다.
