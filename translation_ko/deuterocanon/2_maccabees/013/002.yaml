  - severity: medium
    issue: 각주 b의 내용과 앵커 위치가 일치하지 않음
    rationale: 각주 b는 보병 수량을 설명하지만 본문에서는 ‘코끼리’ 뒤에 붙어 있습니다. 수량을 본문에서 명료하게 번역하므로 해당 각주는 삭제하는 것이 안전합니다.
  - severity: low
    issue: 각주 a가 단지 이름을 반복함
    rationale: ‘리시아스’라는 본문 표기 자체에 대안이나 설명을 제공하지 않아 독자에게 유의미한 정보를 주지 않습니다.
