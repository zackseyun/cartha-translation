base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/002.yaml
  text: 'and with him Lysias[a], the guardian and overseer of affairs, each having a Greek force: eleven myriads of infantry, five thousand three hundred cavalry, twenty-two elephants[b], and three hundred scythed chariots.'
  footnotes:
  - marker: a
    text: Greek 'eleven myriads of infantry' = 110,000 foot soldiers. The translation retains the Greek numerical expression for transparency.
    reason: lexical_alternative
  - marker: b
    text: Or 'the regent and the one in charge of affairs.' The Greek titles for Lysias indicate entrusted guardianship and administrative authority.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그와 함께 후견인이며 정무를 맡은 리시아스도 있었고, 그들은 각각 그리스 군대를 거느렸습니다. 그 군대는 보병 십일만 명, 기병 오천삼백 명, 코끼리 스물두 마리, 낫 달린 전차 삼백 대였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λυσίαν
  english_pob_choice: Lysias
  chosen_korean: 리시아스
  alternatives_korean:
  - 루시아스
  - 리스시아스
  lexicon: 고유명사 음역
  rationale: 헬라어 고유명사를 현대 표기 관행에 맞게 음역했습니다. 한국어 성경에서 널리 굳은 형태가 없으므로 표준 외래어 표기를 따랐습니다.
- source_word: τὸν ἐπίτροπον
  english_pob_choice: the guardian
  chosen_korean: 감독
  alternatives_korean:
  - 섭정
  - 보호자
  - 관리인
  lexicon: LSJ
  rationale: ἐπίτροπος는 위탁받아 관리하는 사람이라는 뜻이 있어, 여기서는 왕실 문맥의 후견·통치 대리 기능을 살려 ‘감독’으로 옮겼습니다.
- source_word: καὶ ἐπὶ τῶν πραγμάτων
  english_pob_choice: and overseer of affairs
  chosen_korean: 사무를 맡은 자
  alternatives_korean:
  - 사무를 총괄하는 자
  - 일을 맡은 자
  - 정무를 맡은 자
  lexicon: LSJ
  rationale: 관용구 ἐπὶ τῶν πραγμάτων은 행정·국정의 책임을 뜻하므로, 과도하게 해석하지 않으면서도 직무 부담을 드러내도록 ‘사무를 맡은 자’로 처리했습니다.
- source_word: ἕκαστον ἔχοντα δύναμιν Ἑλληνικὴν
  english_pob_choice: each having a Greek force
  chosen_korean: 각각 그리스 군대를 거느리고 있었습니다
  alternatives_korean:
  - 각각 헬라 군대를 거느리고 있었습니다
  - 각자 그리스 병력을 가지고 있었습니다
  lexicon: LSJ
  rationale: Ἑλληνικήν은 민족적 ‘그리스인’보다 헬레니즘계 군세를 가리키므로 ‘그리스 군대’로 옮겼고, ἔχοντα는 단순 소유보다 지휘·보유의 뉘앙스가 있어 ‘거느리고 있었습니다’로 옮겼습니다.
- source_word: πεζῶν μυριάδας ἕνδεκα
  english_pob_choice: eleven myriads of infantry
  chosen_korean: 보병 일만한 곧 십만
  alternatives_korean:
  - 보병 십만
  - 보병 열한 만
  - 보병 일만 곧 십만
  lexicon: LSJ
  rationale: μυριάς의 수사 구조를 투명하게 보존하기 위해 ‘일만한 곧 십만’으로 풀어 적고, 의미 이해를 돕기 위해 현대 수량을 병기했습니다.
- source_word: ἱππέων πεντακισχιλίους τριακοσίους
  english_pob_choice: five thousand three hundred cavalry
  chosen_korean: 기병 오천삼백
  alternatives_korean:
  - 기병 오천삼백 명
  - 기마병 오천삼백
  lexicon: LSJ
  rationale: ἱππέων은 기병을 뜻하므로 군사 문맥에 맞는 ‘기병’으로 옮겼습니다.
- source_word: ἐλέφαντας εἴκοσι δύο
  english_pob_choice: twenty-two elephants
  chosen_korean: 코끼리 스물둘
  alternatives_korean:
  - 코끼리 스물두 마리
  - 전쟁 코끼리 스물둘
  lexicon: LSJ
  rationale: 전쟁용 코끼리이지만 원문은 단지 수량과 대상을 말하므로, 의미를 보존하면서도 자연스러운 한국어인 ‘코끼리 스물둘’로 옮겼습니다.
- source_word: ἅρματα δὲ δρεπανηφόρα τριακόσια
  english_pob_choice: three hundred scythed chariots
  chosen_korean: 낫 달린 전차 삼백 대
  alternatives_korean:
  - 낫이 달린 전차 삼백 대
  - 낫 장착 전차 삼백 대
  - 전차 삼백 대
  lexicon: LSJ
  rationale: δρεπανηφόρα는 ‘낫을 단/지닌’이라는 뜻이므로, 군사 용례를 직관적으로 살려 ‘낫 달린 전차’로 옮겼습니다.
theological_decisions:
- issue: 루시아스의 직함을 어떻게 이해할지
  chosen_reading: 후견과 행정 책임을 함께 드러내되, 본문에는 과도한 정치적 해석을 넣지 않았습니다.
  alternative_readings:
  - 섭정
  - 총독
  - 행정관
  rationale: 원문은 ἐπίτροπος와 ἐπὶ τῶν πραγμάτων을 함께 써서 위탁 통치와 행정 책임을 암시하므로, 한국어에서도 두 요소를 분리해 살리되 확정적 제도 명칭으로 고정하지 않았습니다.
  doctrine_reference: 역사·문맥 해석
- issue: 헬라 군세의 성격을 어떻게 번역할지
  chosen_reading: ‘그리스 군대’로 옮겨 헬레니즘계 군사력을 드러냈습니다.
  alternative_readings:
  - 헬라 군대
  - 그리스인 군대
  rationale: Ἑλληνικήν은 민족적 혈통보다 헬라 문화권의 군대를 가리키는 표현으로 보는 것이 문맥상 자연스럽습니다.
  doctrine_reference: 역사·문맥 해석
