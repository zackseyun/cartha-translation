    issue: 보병 수량이 ‘일만한 곧 십만’으로 번역됨
    rationale: πεζῶν μυριάδας ἕνδεκα는 ‘보병 열한 만’, 즉 110,000명입니다. 초안은 10만으로 만들어 원문의 수량을 변경합니다.
  - severity: medium
