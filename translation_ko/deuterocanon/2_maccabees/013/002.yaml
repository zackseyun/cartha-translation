  verdict: revise
  source_fidelity: 원문은 리시아스를 ‘ἐπίτροπος(후견인·위임받은 관리)’ 및 ‘ἐπὶ τῶν πραγμάτων(정무/업무를 맡은 자)’로 소개하고, 앞 절의 인물과 리시아스가 각각 그리스 군대를 보유했다고 말합니다. 초안의 ‘감독’은 현대 한국어에서 교회 직분 또는 일반 감독관을 먼저 연상시켜 ἐπίτροπος의 위탁·후견 의미를 충분히 담지 못합니다. 또한 ‘일만한 곧 십만’은 원문의 ‘열한 만(11 myriads)’을 잘못 옮긴 것으로, 실제 수는 11만입니다.
  naturalness: ‘감독이자 사무를 맡은 자가 있었는데’보다 ‘후견인이며 정무를 맡은 리시아스도 있었고’가 현대 공적 문체에서 더 자연스럽고 직함의 연결도 분명합니다. 수량은 ‘보병 십일만 명’으로 쓰는 것이 명료합니다.
  terminology: 리시아스는 통용 음역으로 유지했습니다. ἐπίτροπος는 제도적 지위를 단정하는 ‘섭정’ 대신 ‘후견인’으로, ἐπὶ τῶν πραγμάτων은 국가적·행정적 업무의 문맥을 반영하여 ‘정무를 맡은 자’로 옮겼습니다. ‘낫 달린 전차’는 δρεπανηφόρα를 정확하고 자연스럽게 전달합니다.
  issues:
