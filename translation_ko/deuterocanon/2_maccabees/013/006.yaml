  text: 여기서는 성전을 약탈한 죄인[a]이나, 그 밖의 다른 악행에서도 특별히 심한 죄를 저지른 사람을 모두 밀어 죽음으로 몰아갑니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘신성모독’. 그러나 그리스어는 특히 성전을 범하거나 성전 재산을 약탈하는 뜻을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνταῦθα
  english_pob_choice: Here
  chosen_korean: 여기서는
  alternatives_korean:
  - 여기서
  - 이곳에서는
  lexicon: LSJ
  rationale: 가까운 장소를 가리키는 지시어로, 앞뒤 문맥에서 말하는 바로 그 현장을 자연스럽게 드러냅니다.
- source_word: ἱεροσυλίας
