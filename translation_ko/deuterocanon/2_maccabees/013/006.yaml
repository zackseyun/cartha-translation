  lexicon: LSJ
  rationale: 문자적으로는 ‘우위/과도함을 만들어 낸’이라는 낯선 표현이지만, 문맥상 매우 두드러지게 심한 악행을 뜻하므로 그 긴장감을 유지해 자연스럽게 옮겼습니다.
- source_word: προωθοῦσιν εἰς ὄλεθρον
  english_pob_choice: pushes on to destruction
  chosen_korean: 밀어 죽음으로 몰아갑니다
  alternatives_korean:
  - 파멸로 몰아갑니다
  - 멸망으로 떠밉니다
  lexicon: LSJ
  rationale: προωθέω의 ‘앞으로 밀다/떠밀다’라는 동작성과 ὄλεθρον의 파멸·죽음의 결과를 함께 살리기 위해, 물리적 이미지가 살아 있는 표현을 택했습니다.
