review_pass:
  verdict: revise
  source_fidelity: ‘죽음으로’는 ὄλεθρον의 범위(파멸·멸망·죽음)를 불필요하게 좁힙니다. 또한 ἅπαντες는 행위 주체이므로 ‘모든 사람이’으로 명시하는 편이 정확합니다. ὑπεροχὴν πεποιημένον은 다른 악행 가운데 유달리 심한 악행을 저지른 경우라는 뜻으로 옮기는 것이 자연스럽고 원문에 가깝습니다.
  naturalness: 현 번역의 ‘사람을 모두 밀어’는 ‘모두’가 목적어를 수식하는 듯 잠시 읽힐 수 있고, ‘그 밖의 다른’은 중복됩니다. 주어와 목적어를 분명히 하고 ‘파멸로 내몹니다’로 다듬으면 현대 표준 한국어 합쇼체로 자연스럽습니다.
  terminology: ‘성전 약탈’은 ἱεροσυλία의 구체적 의미를 잘 보존합니다. 각주의 ‘신성모독’ 대안과 성전 침해·성전 재산 약탈이라는 설명도 적절합니다.
  issues:
  - severity: medium
    issue: ὄλεθρον을 ‘죽음’으로 한정함
    rationale: ὄλεθρος는 죽음을 포함할 수 있으나 기본적으로 파멸·멸망을 뜻하며, 이 구절에서는 더 넓은 결과 표현을 유지하는 것이 안전합니다.
  - severity: low
    issue: ἅπαντες의 주어 기능이 불분명함
    rationale: ‘사람을 모두’로 읽힐 여지가 있으므로 ‘모든 사람이’으로 주어를 명시해야 합니다.
  - severity: low
    issue: ‘그 밖의 다른’의 의미 중복 및 ὑπεροχὴν의 표현
    rationale: ‘그 밖의’와 ‘다른’이 중복됩니다. 또한 ‘다른 악행들 가운데서 유달리 심한 악행’으로 표현하면 원문의 비교·두드러짐을 더 자연스럽게 드러냅니다.
  revised_text: 여기서는 모든 사람이 성전 약탈의 죄를 지은 사람이나, 다른 악행들 가운데서 유달리 심한 악행을 저지른 사람을 파멸로 내몹니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘신성모독’. 그러나 그리스어는 특히 성전을 범하거나 성전 재산을 약탈하는 뜻을 가리킵니다.
    reason: lexical_alternative
  revision_rationale: 원문의 주어(ἅπαντες)를 명시하고, προωθοῦσιν의 강제적 움직임은 ‘내몹니다’로, ὄλεθρον의 넓은 의미는 ‘파멸’로 보존했습니다. ‘성전 약탈’과 관련 각주는 유지했으며, δεύτε 절은 다른 악행 가운데 특히 두드러질 정도의 악행이라는 ὑπεροχὴν πεποιημένον의 의미를 자연스러운 한국어로 반영했습니다.
