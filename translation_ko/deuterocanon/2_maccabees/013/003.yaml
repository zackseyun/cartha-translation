  text: Menelaus also joined them and[a], with great insincerity, kept urging Antiochus on—not for the safety of the fatherland[b], but because he thought he would be established in power.
  footnotes:
  - marker: a
    text: Or 'with much dissembling'; the Greek term can denote feigned speech or concealment of true motives.
    reason: lexical_alternative
  - marker: b
    text: Or 'for the welfare of the homeland.'
    reason: lexical_alternative
translation:
  language: ko
  text: 메넬라오스도 그들과 합류하여[a], 큰 위선으로 안티오코스를 계속 부추겼습니다. 그것은 조국의 안전[b] 때문이 아니라, 자신이 권세 위에 세워질 것이라고 생각했기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘많은 위장으로’. 그리스어는 겉으로 꾸미는 말이나 참된 의도의 은폐를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘조국의 복리’.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέμιξεν
  english_pob_choice: joined
  chosen_korean: 합류하여
  alternatives_korean:
  - 합세하여
  - 함께 섞여 들어가
  - 뒤섞여
  lexicon: LSJ
  rationale: 문맥상 메넬라오스가 다른 무리와 한편이 되는 의미이므로, 자연스러운 현대어로는 ‘합류하다’가 가장 분명합니다.
- source_word: μετὰ πολλῆς εἰρωνίας
  english_pob_choice: with great insincerity
  chosen_korean: 큰 위선으로
  alternatives_korean:
  - 큰 불성실로
  - 많은 기만으로
  - 큰 가장으로
  lexicon: LSJ
  rationale: εἰρωνία는 단순한 ‘아이러니’가 아니라 겉과 속이 다른 태도를 뜻할 수 있으므로, 여기서는 문맥의 도덕적 뉘앙스를 살려 ‘위선’으로 옮겼습니다.
- source_word: τὸν Ἀντίοχον
  english_pob_choice: Antiochus
  chosen_korean: 안티오코스
  alternatives_korean:
  - 안티오쿠스
  - 안티오쿠스 왕
  lexicon: modern transliteration
  rationale: 고유명사는 현대 외래어 표기법에 따라 음역했습니다.
- source_word: σωτηρίᾳ τῆς πατρίδος
  english_pob_choice: the safety of the fatherland
  chosen_korean: 조국의 안전
  alternatives_korean:
  - 조국의 구원
  - 고향의 복리
  - 조국의 안녕
  lexicon: LSJ
  rationale: σωτηρία는 여기서 신학적 ‘구원’이 아니라 정치적·국가적 안전을 가리키므로, POB의 의미를 따라 ‘안전’으로 번역했습니다.
- source_word: ἐπὶ τῆς ἀρχῆς κατασταθήσεται
  english_pob_choice: he would be established in power
  chosen_korean: 권세 위에 세워질 것
  alternatives_korean:
  - 권력 위에 세워질 것
  - 통치 자리에 오를 것
  - 권세에 설치될 것
  lexicon: LSJ
  rationale: ἀρχή는 단순한 직분보다 ‘권세/통치’의 범위를 띨 수 있어, 이를 무리 없이 살려 ‘권세 위에 세워지다’로 옮겼습니다.
theological_decisions:
- issue: 메넬라오스의 동기 평가
  chosen_reading: ‘큰 위선’으로 번역하여 겉으로는 설득하면서 실제로는 사익을 좇는 태도를 드러냈습니다.
  alternative_readings:
  - ‘큰 아이러니’로 직역
  - ‘많은 가장’으로 완화
  rationale: 본문은 중립적 묘사가 아니라 메넬라오스의 불순한 동기를 드러내므로, 독자가 도덕적 평가를 놓치지 않도록 명시적으로 표현했습니다.
  doctrine_reference: '번역 철학: 본문의 윤리적 평가를 약화하지 않음'
