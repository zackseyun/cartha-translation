  lexicon: LSJ
  rationale: ψαλτήριον은 현악기를 가리키며, 한국어에서 가장 널리 통용되는 고대 현악기 명칭은 ‘비파’입니다. 전통 교회어 ‘수금’은 가능하지만 현대 독자에게 덜 분명합니다.
