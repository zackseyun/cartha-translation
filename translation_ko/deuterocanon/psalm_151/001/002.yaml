  source_fidelity: 첫 절의 ὄργανον은 문맥상 ‘악기’로 옮길 수 있습니다. 그러나 ψαλτήριον을 ‘비파’로 특정하면, 일반적으로 비파/리라 계열을 가리키는 명칭과 ψαλτήριον(전통적으로 psaltery로 부르는 현악기)을 혼동할 소지가 있습니다. 또한 ἥρμοσαν은 단순히 ‘빚어내다’보다 부품을 맞추어 만들거나 조립하는 뜻을 더 직접적으로 나타냅니다.
  naturalness: ‘내 손은 … 내 손가락은 …’은 한국어에서 복수 신체 부위를 자연스럽게 총칭하며, 시적 병렬도 유지합니다. ‘맞추어 만들었습니다’는 현대 표준어 합쇼체로 자연스럽고 원문의 제작·조립 뉘앙스를 보존합니다.
