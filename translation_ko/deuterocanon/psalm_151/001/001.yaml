lexical_decisions:
- source_word: Μικρὸς ἤμην ἐν τοῖς ἀδελφοῖς μου
  english_pob_choice: I was small among my brothers
  chosen_korean: 형제들 가운데서 작았고
  alternatives_korean:
  - 형제들 중에 작았고
  - 형제들 가운데서 보잘것없었고
  lexicon: μικρός
  rationale: μικρός는 여기서 단순한 신체적 키보다 ‘작다/어리다’의 일반적 낮음 또는 열등함을 나타내므로, 본문 구조를 살려 ‘작았고’로 옮겼습니다.
- source_word: νεώτερος ἐν τῷ οἴκῳ τοῦ πατρός μου
  english_pob_choice: younger in my father's house
  chosen_korean: 아버지의 집에서는 더 어린 사람이었으며
  alternatives_korean:
  - 아버지의 집에서는 막내였으며
  - 아버지의 집에서는 가장 어렸으며
  lexicon: νεώτερος
  rationale: 영어 POB가 ‘youngest’로 과도하게 좁히지 않고 ‘younger’로 조정한 점을 따라, 분명한 최상급 대신 비교급의 ‘더 어린 사람’으로 보존했습니다.
- source_word: ἔποιμαινον τὰ πρόβατα τοῦ πατρός μου
  english_pob_choice: I was shepherding my father's sheep
  chosen_korean: 아버지의 양 떼를 치고 있었습니다
  alternatives_korean:
  - 아버지의 양들을 목자처럼 돌보고 있었습니다
  - 아버지의 양 떼를 목양하고 있었습니다
  lexicon: ποιμαίνω
  rationale: ποιμαίνω는 단순히 먹이는 것보다 돌보고 치는 목양 행위를 가리키므로, 현대 한국어에서 자연스럽고 의미를 보존하는 ‘양 떼를 치다’로 옮겼습니다.
