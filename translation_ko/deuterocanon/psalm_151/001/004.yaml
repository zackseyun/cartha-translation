  yaml_path: translation/deuterocanon/psalm_151/001/004.yaml
  text: He himself sent out his messenger[a], and took me from my father's sheep, and anointed me with the oil of his anointing.
  footnotes:
  - marker: a
    text: Or 'his messenger.' The Greek word can mean either a human messenger or an angelic being.
