translation:
  language: ko
  text: 그분은 자기 사자[a]를 보내시고, 나를 아버지의 양 떼에서 데려가시고, 자기 기름부으심의 기름으로 나에게 기름을 부으셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 전달자’. 그리스어 단어는 인간 사자나 천사적 존재를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  english_pob_choice: He himself
  chosen_korean: 그분은
  alternatives_korean:
  - 그분 자신은
  - 그분이 친히
  lexicon: LSJ
  rationale: 그리스어의 강조는 문맥상 주어를 앞세워 담아낼 수 있어, 한국어에서는 자연스러운 주제화로 옮기되 의미상의 강조를 유지했습니다.
- source_word: τὸν ἄγγελον αὐτοῦ
  english_pob_choice: his messenger
  chosen_korean: 자기 사자
  alternatives_korean:
  - 자기 메신저
  - 자기 천사
  lexicon: LSJ
  rationale: 영어 POB의 수정에 따라 ἄγγελος를 초월적 존재보다 파송된 전달자로 이해해 ‘사자’로 옮겼습니다. 한국어 ‘사자’는 고전적이지만 성경 문맥에서 ‘보내어진 전달자’의 뜻을 잘 살립니다.
- source_word: ἦρέν με ἐκ τῶν προβάτων τοῦ πατρός μου
  english_pob_choice: took me from my father's sheep
  chosen_korean: 나를 아버지의 양 떼에서 데려가시고
  alternatives_korean:
  - 나를 아버지의 양들 가운데서 데려가시고
  - 나를 아버지의 양 떼로부터 데려가시고
  lexicon: LSJ
  rationale: ἐκ + genitive는 출처를 나타내므로 ‘에서’보다 관계를 더 자연스럽게 드러내는 ‘양 떼에서’로 옮겼습니다. ‘데려가시고’는 선택·인출의 뉘앙스를 살립니다.
- source_word: ἐν τῷ ἐλαίῳ τῆς χρίσεως αὐτοῦ
  english_pob_choice: with the oil of his anointing
  chosen_korean: 자기 기름부으심의 기름으로
  alternatives_korean:
  - 그분의 기름부음의 기름으로
  - 자기 기름부음의 기름으로
  - 기름부으심의 기름으로
  lexicon: LSJ
  rationale: 직역 구조를 유지하되 한국어에서 ‘~으로’가 도구·매개를 자연스럽게 나타내므로 이를 사용했습니다. ‘기름부으심’은 χρίσις의 제의적·왕적 의미를 보존합니다.
theological_decisions:
- issue: 'ἄγγελος의 의미: 초월적 천사인가, 파견된 전달자인가'
  chosen_reading: 문맥에 따라 ‘사자’로 번역해, 하나님이 보내신 전달자를 가리키는 의미를 반영했습니다.
  alternative_readings:
  - 천사
  - 메신저
  rationale: 이 절의 문맥은 다윗의 선택과 기름부음 사건이며, 영어 POB의 최종 감사 기록도 1사무엘 16장의 사무엘을 배경으로 보는 쪽을 채택했습니다. 따라서 독자에게 초월적 천사를 떠올리게 하는 번역은 피했습니다.
  doctrine_reference: 1사무엘 16장, 시편 151편의 다윗 선발 전승
