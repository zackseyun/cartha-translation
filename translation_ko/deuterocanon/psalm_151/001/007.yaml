    reason: cultural_note
lexical_decisions:
- source_word: σπασάμενος
  english_pob_choice: drew
  chosen_korean: 뽑아
  alternatives_korean:
  - 끌어내어
  - 빼어
  lexicon: LSJ
  rationale: 무기를 허리나 칼집에서 꺼내 드는 동작을 자연스럽게 살리면서, 전투 문맥의 긴박함을 유지합니다.
- source_word: τὴν παρ' αὐτοῦ μάχαιραν
  english_pob_choice: his own sword
  chosen_korean: 그의 칼
  alternatives_korean:
  - 그의 자기 칼
  - 그에게서 나온 칼
  lexicon: LSJ
  rationale: παρ' αὐτοῦ는 소유자에게서 빼앗아 온 칼이라는 점을 나타내므로, 한국어에서는 간결하게 ‘그의 칼’로 옮기되 소유의 역전이 드러나도록 했습니다.
- source_word: ἀπεκεφάλισα
  english_pob_choice: cut off his head
  chosen_korean: 그의 머리를 베었으며
  alternatives_korean:
  - 그를 목베었으며
  - 그를 참수하였으며
  lexicon: LSJ
  rationale: 직역적이면서도 현대 한국어에서 자연스럽고, ‘cut off his head’의 구체성을 유지합니다. ‘참수하다’보다 서술적 동작이 더 분명합니다.
- source_word: ὄνειδος
  english_pob_choice: disgrace
  chosen_korean: 수치
  alternatives_korean:
  - 치욕
  - 모욕
  lexicon: LSJ
  rationale: 공적 굴욕의 의미를 살리면서 한국어에서 가장 직접적으로 대응하는 표현을 택했습니다.
theological_decisions:
- issue: ἐξ υἱῶν Ἰσραήλ의 남성 복수 표현 보존
  chosen_reading: 이스라엘 자손에게서
  alternative_readings:
  - 이스라엘 백성에게서
  - 이스라엘 사람들에게서
  rationale: 원문이 문자적으로 ‘이스라엘의 아들들’이라 남성 복수형을 지니므로, 프로젝트 원칙에 따라 이를 평탄화하지 않고 보존했습니다.
