translation:
  language: ko
  text: 내 형제들은 잘생기고 키가 컸지만, 주께서는 그들 안에서 기뻐하지 않으셨습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들에 대해 기뻐하지 않으셨다’, ‘그들을 기뻐하지 않으셨다’.
