lexical_decisions:
- source_word: ἀδελφοί
  english_pob_choice: brothers
  chosen_korean: 형제들
  alternatives_korean:
  - 형제
  - 남자 형제들
  lexicon: BDAG
  rationale: 남성 복수 명사로서 다윗의 남자 형제들을 가리키므로, 성별 정보를 살린 ‘형제들’이 적절합니다.
- source_word: καλοὶ
  english_pob_choice: handsome
  chosen_korean: 잘생기고
  alternatives_korean:
  - 아름답고
  - 멋지고
  - 준수하고
  lexicon: LSJ
  rationale: 키가 큰 외형 묘사와 함께 쓰여 도덕적 ‘좋음’이 아니라 외모의 수려함을 뜻하므로, 자연스러운 한국어로 ‘잘생기고’가 가장 가깝습니다.
- source_word: μεγάλοι
  english_pob_choice: tall
  chosen_korean: 키가 컸지만
  alternatives_korean:
  - 거대했지만
  - 훌륭했지만
  - 키가 크고
  lexicon: LSJ
  rationale: 직역하면 ‘큰’이지만 여기서는 신체적 키나 체구를 가리키므로, 문맥상 ‘키가 컸지만’이 가장 분명합니다.
- source_word: οὐκ εὐδόκησεν
  english_pob_choice: did not take pleasure in
  chosen_korean: 기뻐하지 않으셨습니다
  alternatives_korean:
  - 좋아하지 않으셨습니다
  - 마음에 들어 하지 않으셨습니다
  - 기꺼이 여기지 않으셨습니다
  lexicon: BDAG
  rationale: εὐδοκέω의 핵심 의미인 ‘기뻐하다/호의로 여기다’를 살리면서, 이유를 덧붙이지 않고 신적 평가의 뉘앙스를 유지합니다.
theological_decisions:
- issue: 주께서 그들에 대해 가지신 평가의 범위
  chosen_reading: 본문은 주께서 그들 안에서 기뻐하지 않으셨다고만 말하고, 선택이나 거절의 구체적 사유는 말하지 않습니다.
  alternative_readings:
  - 주께서 그들을 선택하지 않으셨습니다
  - 주께서 그들에게 호의적이지 않으셨습니다
  rationale: εὐδόκησεν의 의미를 보존하되, 사무엘서 같은 평행본문의 내용을 이 구절에 미리 끌어오지 않도록 절제했습니다.
  doctrine_reference: 본문이 직접 말하는 것만 번역하고, 신학적 해석은 확장하지 않습니다.
