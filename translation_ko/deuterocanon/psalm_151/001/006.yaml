- from: 나는 그 이방인에게 맞서 나갔고, 그는 자기 우상들로 나를 저주했습니다.[a][b]
  to: 나는 그 이방인[a]을 만나러 나갔고, 그는 자기 우상들을 빌려 나를 저주했습니다.[b]
  rationale: 본문의 ‘맞서’를 ‘만나러’로 바꾸어 원문의 단순한 만남의 목적을 보존했습니다. 또한 ‘우상들로’를 ‘우상들을 빌려’로 다듬어, 우상에 호소하여 저주했다는 ἐν τοῖς εἰδώλοις αὐτοῦ의 자연스러운 한국어 표현을 제시했습니다. 각주 표지는 각각 ‘이방인’과 저주 표현에 바로 붙여 참조 대상을 명확히 했습니다.
