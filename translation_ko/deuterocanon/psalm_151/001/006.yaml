translation:
  language: ko
  text: 나는 그 이방인[a]을 만나러 나갔고, 그는 자기 우상들을 빌려 나를 저주했습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 블레셋 사람.” 그리스어는 “이방인/다른 민족의 사람”이라는 더 넓은 표현을 쓰며, 칠십인역에서는 흔히 블레셋 사람을 가리킬 때 쓰입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “그는 자기 우상들의 이름으로 나를 저주했습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  english_pob_choice: I went out / came out
  chosen_korean: 나갔고
  alternatives_korean:
  - 나왔고
  - 밖으로 나가 그를 만났고
  lexicon: BDAG
  rationale: aorist ἐξέρχομαι의 이동을 자연스러운 서술체로 옮기되, ‘맞서’는 뒤의 만남 상황을 드러내는 최소한의 보완으로만 사용했습니다.
- source_word: εἰς συνάντησιν
  english_pob_choice: to meet
  chosen_korean: 맞서
  alternatives_korean:
  - 만나기 위해
  - 맞으러
  lexicon: BDAG
  rationale: 단순히 ‘만나다’보다 적대적 대면이 강한 문맥이므로, ‘~에게 맞서 나가다’로 만나기 위한 이동과 대치의 뉘앙스를 함께 살렸습니다.
- source_word: τῷ ἀλλοφύλῳ
  english_pob_choice: the foreigner
  chosen_korean: 그 이방인
  alternatives_korean:
  - 그 블레셋 사람
  - 다른 민족 사람
  lexicon: LSJ
  rationale: 그리스어는 고유 민족명보다 일반적 ‘다른 민족/이방인’을 쓰므로, 본문은 그 포괄적 표현을 유지했습니다.
- source_word: ἐν τοῖς εἰδώλοις αὐτοῦ
  english_pob_choice: by his idols
  chosen_korean: 자기 우상들로
  alternatives_korean:
  - 자기 우상들의 이름으로
  - 자기 우상들 안에서
  lexicon: BDAG
  rationale: 저주의 도구 또는 매개를 나타내는 말로 이해하여, 한국어에서는 ‘~로’가 가장 직접적이고 압축적으로 그 기능을 드러냅니다.
theological_decisions:
- issue: τῷ ἀλλοφύλῳ의 번역 범위
  chosen_reading: ‘그 이방인’으로 옮겨, 본문의 일반 용어를 유지했습니다.
  alternative_readings:
  - ‘그 블레셋 사람’
  rationale: 문맥상 블레셋으로 식별될 수 있지만, 원문은 민족 일반어를 사용하므로 본문에서는 이를 보존하고, 특정화는 하지 않았습니다.
  doctrine_reference: translation philosophy §1; source-language primacy
- issue: ἐν τοῖς εἰδώλοις αὐτοῦ의 의미
  chosen_reading: 저주가 그의 우상들을 매개로/의지하여 행해졌다는 뜻으로 읽었습니다.
  alternative_readings:
  - 그의 우상들의 이름으로
  - 그의 우상들과 함께
  rationale: 원문이 우상 숭배적 저주의 성격을 분명히 하므로, 지나치게 완화하지 않고 우상에 대한 직접적 언급을 유지했습니다.
  doctrine_reference: translation philosophy §3; idolatry context
