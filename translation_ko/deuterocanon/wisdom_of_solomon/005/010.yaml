translation:
  language: ko
  text: 마치 물결 이는 물을 지나가는 배와 같아서, 지나간 뒤에는 아무 흔적도 찾을 수 없고, 파도 속에는 그 용골의 자취도 남지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘파도에 흔들리는 물’. 그리스어는 물이 파도에 뒤흔들리는 모습을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘용골’로 옮긴 말은 해양 용어입니다. 더 풀어 옮기면 배의 항적이나 지나간 길의 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ναῦς
  english_pob_choice: ship
  chosen_korean: 배
  alternatives_korean:
  - 배
  - 선박
  - 함선
  lexicon: LSJ
  rationale: 비유의 핵심은 수면 위를 빠르게 지나가는 선박의 이미지이므로, 현대 한국어에서 가장 자연스러운 ‘배’를 선택했습니다.
- source_word: κυμαινόμενον ὕδωρ
  english_pob_choice: surging water
  chosen_korean: 물결 이는 물
  alternatives_korean:
