base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/010.yaml
  text: like a ship passing through surging water[a], after it has gone by no trace can be found, nor the track of its keel in the waves[b];
  footnotes:
  - marker: a
    text: Or 'wave-tossed water.' The Greek emphasizes water stirred into waves.
    reason: lexical_alternative
  - marker: b
    text: The Greek term rendered 'keel' is a nautical word; some looser renderings take the sense more generally as the ship's course or path.
    reason: lexical_alternative
translation:
  language: ko
  text: 마치 파도치는 물[a]을 지나가는 배와 같아서, 그 배가 지나간 뒤에는 아무 흔적도 찾을 수 없으며, 파도 속에서는 그 용골[b]의 자취도 찾을 수 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘파도에 뒤흔들리는 물’. 그리스어는 물이 파도로 일렁이는 모습을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘용골’로 옮긴 말은 해양 용어입니다. 더 느슨하게 옮기면 배의 항적이나 지나간 길을 가리키는 것으로 이해할 수 있습니다.
    reason: lexical_alternative
