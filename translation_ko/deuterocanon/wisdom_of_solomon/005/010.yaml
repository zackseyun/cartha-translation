  rationale: 남아 있는 시각적 증거가 전혀 없다는 뜻을 살리기 위해, 가장 자연스럽고 포괄적인 ‘흔적’을 택했습니다.
- source_word: τρόπιος αὐτῆς
  english_pob_choice: its keel
  chosen_korean: 그 용골
  alternatives_korean:
  - 그 배의 길
  - 그 배의 자취
  - 용골
  lexicon: LSJ
  rationale: 나침반이나 항로가 아니라 선박의 해부학적 요소를 가리키는 말이므로, 본문 이미지가 살아나도록 ‘용골’로 옮겼습니다.
theological_decisions:
- issue: 비유의 강조점
  chosen_reading: 지나간 배의 흔적이 완전히 사라진다는 점을 그대로 살려, 의인의 운명이 아니라 악인의 허무한 흔적 없음이라는 문맥적 대비를 해치지 않도록 옮겼습니다.
  alternative_readings:
  - ‘항적’처럼 항로 중심으로 완화하는 번역
  - ‘흔적’ 대신 ‘자취’만 쓰는 번역
  rationale: 이 절은 선명한 소멸의 이미지를 통해 무가시성과 비영속성을 강조하므로, 완곡하게 만들지 않는 것이 문맥에 더 충실합니다.
  doctrine_reference: 지혜서 5:1–5의 의인/악인 대비 문맥
- issue: ‘용골’의 직역 유지
  chosen_reading: 문학적 비유를 보존하기 위해 항해 용어를 유지했습니다.
  alternative_readings:
  - ‘길’이나 ‘항로’로 일반화
  - ‘배의 밑부분’ 같은 설명적 번역
  rationale: 원문의 나툴한 해양 은유를 약화시키지 않기 위해, 독자에게 다소 낯설더라도 전문어를 살렸습니다.
  doctrine_reference: 본문의 수사적 이미지 보존
