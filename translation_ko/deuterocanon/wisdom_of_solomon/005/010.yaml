  lexicon: LSJ
  rationale: ἡ κυμαινόμενον은 물이 파도에 흔들리는 상태를 가리키므로, ‘물결 이는 물’로 옮겨 물의 요동을 직접 드러냈습니다.
- source_word: ἴχνος
  english_pob_choice: trace
  chosen_korean: 흔적
