base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/021.yaml
  text: Well-aimed bolts of lightning will go forth[a], and like from a well-drawn bow of clouds they will leap to the target[b],
  footnotes:
  - marker: a
    text: Or 'from the well-curved bow of the clouds'; the image may evoke the storm-bow or rainbow, but the Greek reads more literally 'bow of clouds.'
    reason: lexical_alternative
  - marker: b
    text: Or 'they will be hurled to the target' or 'they will spring to the mark.' The Greek verb is vivid and somewhat difficult, but the sense is rapid movement toward a target.
    reason: alternative_reading
translation:
  language: ko
  text: 잘 겨눈 번개의 화살들이 나아가며, 구름의 잘 휜 활에서처럼[a] 목표를 향해 날아갑니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구름의 잘 둥근 활에서처럼’; 이 이미지는 무지개나 폭풍의 활을 떠올리게 할 수 있지만, 그리스어는 더 문자적으로는 ‘구름의 활’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘과녁으로 던져집니다’ 혹은 ‘표적을 향해 튑니다’. 그리스어 동사는 생생하고 다소 난해하지만, 신속하게 목표를 향해 움직이는 뜻입니다.
    reason: alternative_reading
