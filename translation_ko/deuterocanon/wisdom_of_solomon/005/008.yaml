  text: What did arrogance profit us? And what did wealth joined with boasting gain us?
translation:
  language: ko
  text: 교만이 우리에게 무슨 유익이 있었습니까? 그리고 자만과 함께한 재물이 우리에게 무슨 이익을 가져다주었습니까?
  philosophy: formal
lexical_decisions:
- source_word: ὑπερηφανία
  english_pob_choice: arrogance
  chosen_korean: 교만
  alternatives_korean:
  - 오만
  - 자만
  lexicon: ὑπερηφανία
  rationale: 헬라어 ὑπερηφανία는 스스로 높아진 태도와 교만을 가리키므로, 문맥상 가장 직접적인 표준어인 ‘교만’을 택했습니다.
- source_word: πλοῦτος
  english_pob_choice: wealth
  chosen_korean: 재물
  alternatives_korean:
  - 부
  - 부유함
  - 재산
  lexicon: πλοῦτος
  rationale: 단순한 축적된 부를 가리키므로, 한국어에서는 문맥상 자연스러운 ‘재물’이 적절합니다.
- source_word: μετὰ ἀλαζονίας
  english_pob_choice: joined with boasting
  chosen_korean: 자만과 함께한
  alternatives_korean:
  - 허세와 함께한
  - 허풍과 함께한
  - 거만과 함께한
  lexicon: ἀλαζονία
  rationale: ἀλαζονία는 과시적 자만과 허세를 뜻하므로, 직역에 가깝게 ‘자만과 함께한’으로 옮겨 원문의 결합 관계를 드러냈습니다.
- source_word: συμβέβληται ἡμῖν
  english_pob_choice: gain us
  chosen_korean: 우리에게 무슨 이익을 가져다주었습니까
  alternatives_korean:
  - 우리에게 무슨 유익을 주었습니까
  - 우리에게 무엇을 얻어 주었습니까
  lexicon: συμβάλλω
  rationale: 여기서는 ‘이익을 주다/가져오다’의 결과 의미가 분명하므로, POB의 ‘gain us’를 한국어 관용에 맞게 ‘무슨 이익을 가져다주었습니까’로 풀어 옮겼습니다.
