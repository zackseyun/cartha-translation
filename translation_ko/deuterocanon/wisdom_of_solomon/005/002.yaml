translation:
  language: ko
  text: 그들이 그를 보면, 무서운 두려움에 사로잡혀 흔들릴 것이며, 그의 구원이 뜻밖이라는 사실에 놀랄 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어에는 ‘그를’과 ‘그의’가 명시되어 있지 않습니다. 이는 앞절의 의인을 가리키는 문맥에서 보충한 것입니다. 직역하면 ‘보고서, 그들은 무서운 두려움으로 흔들리고 구원의 뜻밖의 일에 놀랄 것이다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  english_pob_choice: When they see him
  chosen_korean: 그들이 그것을 보면
  alternatives_korean:
  - 그들이 그를 보면
  - 보게 되면
  lexicon: LSJ
  rationale: 분사 ἰδόντες는 앞문맥의 의인에 대한 시점을 나타내므로 한국어에서는 조건/시간 부사절로 자연스럽게 풀었습니다. 헬라어 본문에는 목적어가 명시되지 않으므로, 문맥상 대상은 암시하되 본문에 없는 ‘그를’를 단정적으로 넣지 않았습니다.
- source_word: ταραχθήσονται
  english_pob_choice: they will be shaken
  chosen_korean: 흔들릴 것이며
  alternatives_korean:
  - 뒤흔들릴 것이며
  - 동요할 것이며
  lexicon: LSJ
  rationale: ταράσσω의 미래수동은 내적 동요와 충격을 강하게 나타내므로 ‘흔들리다’가 가장 간결하게 그 강도를 살립니다.
- source_word: φόβῳ δεινῷ
  english_pob_choice: with dreadful fear
  chosen_korean: 무서운 두려움으로
  alternatives_korean:
  - 끔찍한 두려움으로
  - 두렵고 무서운 두려움으로
  lexicon: LSJ
  rationale: 여격구는 원인/방식의 의미를 띠므로 조사 ‘-으로’로 처리했고, δεινός의 강한 위협성을 ‘무서운’으로 옮겼습니다.
- source_word: ἐπὶ τῷ παραδόξῳ τῆς σωτηρίας
  english_pob_choice: at the unexpectedness of his salvation
  chosen_korean: 그 구원의 뜻밖의 일에
  alternatives_korean:
  - 그 구원의 놀라운 일에
  - 구원의 뜻밖의 사실에
  lexicon: LSJ
  rationale: παράδοξον은 단순한 감탄이 아니라 ‘예상 밖의 것/일’을 뜻하므로 ‘뜻밖의 일’로 옮겼습니다. σωτηρία는 이 문맥에서 구원의 도리보다 의인의 구원/구출을 가리키므로 ‘구원’으로 유지했습니다.
theological_decisions:
- issue: 본문의 생략된 목적어와 소유격 관계를 한국어에서 어떻게 처리할지
  chosen_reading: 문맥상 앞절의 의인을 가리키는 것으로 보고, 본문에 없는 해석을 과도하게 덧붙이지 않으면서도 이해 가능한 형태로 옮겼습니다.
  alternative_readings:
  - 그가 구원받는 뜻밖의 일에
  - 의인의 구원의 뜻밖의 일에
  rationale: 헬라어는 목적어와 소유격을 생략한 채 앞문맥에 의존하지만, 한국어는 그 공백을 어느 정도 메워야 문장이 자연스럽습니다. 다만 단정적 보충은 자제해 원문의 생략 효과를 크게 훼손하지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; source-context-driven ellipsis handling.'
