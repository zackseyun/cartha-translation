base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/017.yaml
  text: He will take his zeal as full armor[a], and he will arm creation for defense against enemies[b];
  footnotes:
  - marker: a
    text: Or 'his jealousy' for 'his zeal.' The Greek ζῆλος can carry either sense depending on context.
    reason: lexical_alternative
  - marker: b
    text: Literally 'he will weapon-make creation' or 'he will equip creation as a weapon'; the translation 'he will arm creation' expresses the sense in natural English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 자신의 열정을 완전한 갑옷처럼 취하시고, 창조 세계를 무장시켜 적들에 맞서 방어하게 하실 것입니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자신의 질투’를 뜻할 수 있습니다. 그리스어 ζῆλος는 문맥에 따라 ‘열정’과 ‘질투’ 둘 다를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘창조 세계를 무기화하다’ 또는 ‘창조 세계를 무기로 갖추게 하다’에 가깝습니다. 본문은 자연스러운 한국어로 그 뜻을 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λήμψεται
  english_pob_choice: he will take
  chosen_korean: 취하시고
  alternatives_korean:
  - 가져가시고
  - 취하실 것이고
  lexicon: LSJ
  rationale: 미래 중간태 λήμψεται의 수용/취득 의미를 살리되, 전투적 비유 속에서 자연스러운 한국어로는 ‘취하시고’가 가장 간결합니다.
- source_word: πανοπλίαν
  english_pob_choice: full armor
  chosen_korean: 완전한 갑옷
  alternatives_korean:
  - 전신 갑옷
  - 온전한 무장
  lexicon: LSJ
  rationale: πανοπλία는 완전무장에 해당하는 표현이므로, 단순한 보호구가 아니라 전체를 덮는 전투 장비라는 점을 드러내기 위해 ‘완전한 갑옷’으로 옮겼습니다.
- source_word: τὸν ζῆλον αὐτοῦ
  english_pob_choice: his zeal
  chosen_korean: 자신의 열정
  alternatives_korean:
  - 그분의 질투
  - 그분의 열심
  lexicon: LSJ
  rationale: ζῆλος는 문맥에 따라 열심/질투를 둘 다 가질 수 있으나, 여기서는 심판과 전쟁의 동력으로 제시되므로 ‘열정’이 무난하면서도 다의성을 과도하게 좁히지 않습니다.
- source_word: ὁπλοποιήσει τὴν κτίσιν
  english_pob_choice: he will arm creation
  chosen_korean: 창조 세계를 무장시켜
  alternatives_korean:
  - 창조를 무기화하여
  - 창조 세계에 무기를 입혀
  lexicon: LSJ
  rationale: ὁπλοποιήσει는 직역하면 ‘무기로 만들다/무장시키다’에 가깝기 때문에, POB의 ‘he will arm creation’을 따라 결과를 드러내는 동사 ‘무장시켜’로 옮겼습니다.
- source_word: εἰς ἄμυναν ἐχθρῶν
  english_pob_choice: for defense against enemies
  chosen_korean: 적들에 맞서 방어하게
  alternatives_korean:
  - 적들에 맞서 دفاع하게
  - 적들에 대한 방어를 위하여
  lexicon: LSJ
  rationale: ἄμυνα는 방어·격퇴의 뜻이므로, 목적을 나타내는 εἰς를 살려 ‘방어하게’로 처리하되 ‘적들에 맞서’로 대상 관계를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 의인화된 하나님-전사 이미지
  chosen_reading: 주어를 ‘그분’으로 두어, 앞문맥의 하나님께서 전사처럼 행동하시는 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 더 추상적으로 ‘그것’이나 ‘신적 정의’로 돌리는 해석
  rationale: 지혜서 5장의 문맥은 하나님께서 심판과 구원의 전사로 묘사되는 흐름이므로, 그 긴장을 완화하지 않고 인칭 대명사로 유지하는 것이 source-grounded합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; original-language primacy over translation tradition.'
- issue: ‘열정’과 ‘질투’의 중의성
  chosen_reading: 본문은 ‘열정’으로 두고 각주에서 ‘질투’ 가능성을 열어 두었습니다.
  alternative_readings:
  - ‘그분의 질투’로 고정
  - 중의성을 제거하고 단일 의미로 제한
  rationale: ζῆλος의 의미 범위는 문맥상 열심과 질투를 모두 포괄할 수 있으므로, 본문에서는 자연스러운 현대어를 택하되 의미 여지를 보존하는 것이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: preserve documented lexical/theological tension rather than resolve it.'
