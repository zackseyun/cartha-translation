translation:
  language: ko
  text: 그분은 자신의 열심[a]을 완전한 무장으로 삼으시고, 창조 세계를 적들을 막아 내도록 무장시키실 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자신의 질투’로 옮길 수 있습니다. 그리스어 ζῆλος는 문맥에 따라 ‘열심’ 또는 ‘질투’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘창조 세계를 무기로 만들 것이다’에 가깝습니다. 또한 ‘창조 세계를 무장시킬 것이다’로 옮길 수도 있습니다.
    reason: lexical_alternative
