lexical_decisions:
- source_word: πετροβόλου θυμοῦ
  english_pob_choice: stony wrath
  chosen_korean: 돌같이 거센 분노
  alternatives_korean:
  - 돌 같은 분노
  - 돌처럼 격한 분노
  - 석같은 분노
  lexicon: θυμός
  rationale: POB의 핵심 이미지인 ‘stony wrath’를 살리되, πετροβόλου의 ‘돌-’ 이미지를 한국어에서 자연스럽게 풀어 ‘돌같이 거센 분노’로 옮겼습니다.
- source_word: ῥιφήσονται χάλαζαι
  english_pob_choice: hailstones ... will be hurled
  chosen_korean: 우박들이 던져질 것이며
  alternatives_korean:
  - 우박들이 내던져질 것이며
  - 우박이 퍼부어질 것이며
  - 우박들이 쏟아질 것이며
  lexicon: χάλαζα
  rationale: ῥιφήσονται의 수동적 ‘던져지다’와 χάλαζαι의 우박 이미지를 함께 보존했습니다.
- source_word: ἀγανατήσει ... ὕδωρ θαλάσσης
  english_pob_choice: the water of the sea will rage against them
  chosen_korean: 바닷물은 그들에 맞서 노하고
  alternatives_korean:
  - 바닷물은 그들에 대하여 분노하고
  - 바닷물은 그들을 향해 거세게 들고일어나고
  lexicon: ἀγανατέω
  rationale: ἀγανατήσει의 격앙된 반응을 ‘노하고’로 옮겨, 단순한 움직임이 아니라 의인화된 반발을 드러냈습니다.
- source_word: ποταμοὶ δὲ συγκλύσουσιν ἀποτόμως
  english_pob_choice: and rivers will suddenly overwhelm them
  chosen_korean: 강물들은 갑자기 그들을 덮칠 것입니다
  alternatives_korean:
  - 강물들은 돌연 그들을 휩쓸 것입니다
  - 강물들은 갑자기 그들을 몰아칠 것입니다
  lexicon: συγκλύζω
  rationale: συγκλύσουσιν의 ‘몰아쳐 덮침’과 ἀποτόμως의 급작스러움을 함께 살려 자연스러운 현대 한국어로 옮겼습니다.
