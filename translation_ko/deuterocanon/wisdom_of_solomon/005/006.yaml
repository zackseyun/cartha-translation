translation:
  language: ko
  text: 그러므로 우리는 진리의 길에서 벗어났고, 의의 빛이 우리에게 비치지 않았으며, 해도 우리에게 떠오르지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정의의 빛’. 헬라어 δικαιοσύνη는 도덕적 의와 재판적 정의를 모두 아울러 말할 수 있습니다.
    reason: lexical_alternative
