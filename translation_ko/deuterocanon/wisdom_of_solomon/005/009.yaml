  lexicon: LSJ
  rationale: 지시대명사 ἐκεῖνα의 거리감과 πάντα의 총괄성을 함께 반영해, 이미 언급된 덧없는 대상 전체를 가리키는 ‘그 모든 것’으로 간결하게 옮겼습니다.
- source_word: ὡς σκιὰ
  english_pob_choice: like a shadow
  chosen_korean: 그림자처럼
  alternatives_korean:
  - 한낱 그림자처럼
  - 그림자 같이
  lexicon: LSJ
  rationale: σκιὰ의 비실재성과 짧은 지속을 한국어의 익숙한 비유인 ‘그림자처럼’으로 옮겼습니다.
- source_word: ἀγγελία παρατρέχουσα
  english_pob_choice: like a report running past
  chosen_korean: 달려 지나가는 소식처럼
  alternatives_korean:
  - 스쳐 지나가는 소식처럼
  - 급히 지나가는 보고처럼
  lexicon: LSJ
  rationale: ἀγγελία는 ‘소식/보고/전갈’의 범위를 가지며, παρατρέχουσα의 빠르게 스쳐 감을 살려 ‘달려 지나가는 소식’으로 번역했습니다. ‘보고’보다 현대 한국어 독자에게 자연스럽고 이미지가 더 분명합니다.
