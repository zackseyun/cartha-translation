translation:
  language: ko
  text: 그 모든 것은 그림자처럼, 또 빠르게 지나가는 소식[a]처럼 지나갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἀγγελία는 ‘소식’, ‘보고’, ‘전갈’, ‘발표’라는 뜻을 가질 수 있으며, παρατρέχουσα는 빠르게 지나가거나 스쳐 가는 뉘앙스를 더합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρῆλθεν
  english_pob_choice: passed away / passed by
  chosen_korean: 지나갔습니다
  alternatives_korean:
  - 사라졌습니다
  - 지나갔습니다
  lexicon: BDAG
  rationale: παρέρχομαι의 완료된 소멸감을 한국어에서는 자연스럽게 ‘지나가다’로 옮기되, 본문이 ‘모든 것의 덧없음’을 말하므로 ‘사라지다’보다 시간적 통과와 무상함을 함께 살렸습니다.
- source_word: ἐκεῖνα πάντα
