  rationale: 지혜서 5:9의 핵심은 소유와 자랑의 무상함을 그림자와 빠르게 지나가는 소식의 이중 비유로 제시하는 데 있으므로, 해석을 덧씌우지 않고 원문의 시각적 대비를 보존했습니다.
