translation:
  language: ko
  text: 그 모든 것은 그림자처럼, 그리고 달려 지나가는 소식처럼 지나갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ἀγγελία는 ‘소식, 보고, 전갈, 발표’의 뜻을 가질 수 있으며, παρατρέχουσα는 ‘달려 지나가는, 빠르게 스쳐 가는’의 뉘앙스를 더합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρῆλθεν
  english_pob_choice: passed away / passed by
  chosen_korean: 지나갔습니다
  alternatives_korean:
