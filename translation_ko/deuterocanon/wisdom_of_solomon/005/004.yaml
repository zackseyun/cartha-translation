    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 죽음을 불명예스럽다고’라고도 옮길 수 있습니다. 여기서 ‘그의 마지막’은 죽음, 특히 그 죽음의 방식을 가리킬 수 있습니다.
    reason: lexical_alternative
