  text: 그리고 우리 어리석은 자들이 조롱거리가 되는 속담이 되었습니다[a]. 우리는 그의 삶을 광기로, 그의 마지막을 불명예스럽다고 여겼습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
