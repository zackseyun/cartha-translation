  - marker: b
    text: Or 'his death dishonorable.' The Greek 'his end' can refer specifically to the manner of his death.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 조롱의 속담거리가 되었습니다[a]. 어리석은 자들은 그 사람의 삶을 미친 짓으로, 그 끝을 불명예스럽다고 여겼습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘조롱의 말거리’라고도 할 수 있습니다. 그리스어 παραβολή는 좁은 의미의 ‘비유’뿐 아니라, 공적으로 회자되는 속담·말거리의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 죽음을 불명예스럽다고’라고도 옮길 수 있습니다. 여기서 ‘그의 끝’은 죽음의 방식 자체를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς παραβολὴν ὀνειδισμοῦ
  english_pob_choice: a proverb of reproach
  chosen_korean: 조롱의 속담거리
  alternatives_korean:
  - 비웃음의 비유
  - 수치의 속담
  lexicon: LSJ
  rationale: παραβολή는 여기서 넓은 의미의 ‘말거리/속담거리’에 가깝고, ὀνειδισμοῦ는 공개적 조롱과 수치를 뜻하므로, 한국어에서는 자연스럽게 ‘조롱의 속담거리’로 옮겨 공적 조롱의 뉘앙스를 살렸습니다.
- source_word: οἱ ἄφρονες
  english_pob_choice: among fools
  chosen_korean: 어리석은 자들은
  alternatives_korean:
  - 어리석은 사람들은
  - 우매한 자들은
  lexicon: LSJ
  rationale: 문맥상 이는 뒤이어 나오는 1인칭 복수 발화의 화자들을 가리키므로, 부자연스러운 전치사구보다 화자를 밝히는 주어형으로 옮겼습니다.
- source_word: ἐλογισάμεθα μανίαν
  english_pob_choice: We considered ... madness
  chosen_korean: 미친 짓으로 여겼습니다
  alternatives_korean:
  - 광기라고 생각했습니다
  - 어리석음으로 판단했습니다
  lexicon: LSJ
  rationale: ἐλογισάμεθα는 단순한 느낌이 아니라 평가·판단의 동사를 나타내므로 ‘여겼습니다’로 옮기고, μανίαν은 경멸적 판단을 드러내는 ‘미친 짓’으로 구체화했습니다.
- source_word: τὴν τελευτὴν αὐτοῦ ἄτιμον
  english_pob_choice: his end dishonorable
  chosen_korean: 그 끝을 불명예스럽다고
  alternatives_korean:
  - 그 죽음을 불명예스럽다고
  - 그 마지막을 수치스럽다고
  lexicon: LSJ
  rationale: τελευτήν은 ‘끝’으로도, 특정 맥락에서는 죽음으로도 읽힐 수 있어 더 넓은 ‘끝’을 유지했고, ἄτιμον은 ‘불명예스럽다’로 옮겨 명예/수치의 평가를 살렸습니다.
