  text: and as a proverb of reproach among fools[a]. We considered his life madness, and his end dishonorable[b];
  footnotes:
  - marker: a
    text: Or 'a byword of reproach.' The Greek παραβολή can denote a proverb-like saying or public byword, not only a 'parable' in the narrower sense.
