translation:
  language: ko
  text: '그들은 회개하며 영의 고통 때문에 신음하고, 자기들끼리 이렇게 말할 것입니다: “이 사람이 바로 우리가 한때 조롱거리로 삼았던 사람입니다[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리가 한때 웃음거리로 삼았던 사람” / “우리가 한때 조롱거리로 여겼던 사람”.
    reason: lexical_alternative
