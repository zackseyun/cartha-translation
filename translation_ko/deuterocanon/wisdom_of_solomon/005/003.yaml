  text: 'They will say among themselves[a], repenting, and will groan because of anguish of spirit: “This is the one whom we once held in derision.”'
  footnotes:
  - marker: a
    text: Or “whom we once made a laughingstock” / “whom we once held for mockery.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 스스로 말할 것입니다[a] — 회개하며 영의 고통 때문에 신음할 것입니다. 「이 사람이 바로 우리가 전에 조롱거리로 삼았던 그 사람입니다」.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리가 전에 웃음거리로 삼았던 그 사람” / “우리가 전에 조롱거리로 여겼던 그 사람”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐροῦσιν
  english_pob_choice: They will say
  chosen_korean: 말할 것입니다
  alternatives_korean:
  - 이야기할 것입니다
  - 말할 터입니다
  lexicon: BDAG
  rationale: 미래 시상의 발화를 자연스러운 현대 한국어로 옮기되, 단순한 감탄이나 추측이 아니라 실제 발화를 나타내도록 했습니다.
- source_word: ἐν ἑαυτοῖς
  english_pob_choice: among themselves
  chosen_korean: 스스로
  alternatives_korean:
  - 서로에게
  - 자기들끼리
  lexicon: BDAG
  rationale: 공동체 내부의 내적 독백적 발화를 함께 담기 위해, ‘스스로’로 옮겨 집단적 자기성찰과 내면 대화를 모두 열어 두었습니다.
- source_word: διὰ στενοχωρίαν πνεύματος
  english_pob_choice: because of anguish of spirit
  chosen_korean: 영의 고통 때문에
  alternatives_korean:
  - 영의 괴로움 때문에
  - 마음의 압박 때문에
  - 영의 답답함 때문에
  lexicon: BDAG
  rationale: στενοχωρία의 압박·고통의 뉘앙스를 살리되 한국어로는 ‘영의 고통’이 가장 직설적이고 문맥상 절박한 탄식을 잘 드러냅니다.
- source_word: εἰς γέλωτα
  english_pob_choice: in derision
  chosen_korean: 조롱거리로 삼았던
  alternatives_korean:
  - 웃음거리로 삼았던
  - 비웃음거리로 삼았던
  - 조롱의 대상으로 삼았던
  lexicon: BDAG
  rationale: εἰς + 목적격이 대상화된 조롱의 상태를 나타내므로, 단순히 ‘조롱했다’보다 ‘조롱거리로 삼았다’가 원문의 경멸적 평가를 더 정확히 옮깁니다.
