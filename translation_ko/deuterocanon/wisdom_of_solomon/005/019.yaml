  - 신실함
  rationale: 문맥은 덕목들이 무장처럼 의인화된 장면이므로, 단순한 종교적 태도보다 더 넓은 윤리적·신학적 힘을 가진 표현이 필요합니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
