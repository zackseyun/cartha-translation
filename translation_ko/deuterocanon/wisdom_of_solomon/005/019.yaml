    rationale: ἀσπίδα ἀκαταμάχητον ὁσιότητα는 ‘거룩함’을 ‘정복할 수 없는 방패’로 취한다는 병렬·서술 관계입니다. 원문의 이미지가 유지되도록 ‘거룩함을 … 방패로’로 배열해야 합니다.
