- source_word: λήμψεται
  english_pob_choice: will take
  chosen_korean: 취할 것입니다
  alternatives_korean:
  - 받을 것입니다
  - 들어 올릴 것입니다
  lexicon: BDAG
  rationale: 미래 중간태의 λαμβάνω를 이 문맥의 무장 비유에 맞게 자연스럽게 옮겼습니다. '받다'는 수동적으로 들리고, '들어 올리다'는 방패 이미지에는 가능하지만 더 해석적입니다.
- source_word: ἀσπίδα
  english_pob_choice: shield
  chosen_korean: 방패
  alternatives_korean:
  - 방패막이
  - 방패
  lexicon: LSJ
  rationale: ἀσπί다의 기본 의미를 현대 한국어의 표준어로 सीधे 옮겼습니다.
- source_word: ἀκαταμάχητον
  english_pob_choice: unconquerable
  chosen_korean: 정복할 수 없는
  alternatives_korean:
  - 무적의
  - 패배시킬 수 없는
  lexicon: LSJ
  rationale: ‘싸워서 이길 수 없는’ 뜻을 살리되, 한국어에서는 ‘정복할 수 없는’이 가장 자연스럽고 능동적인 전투 이미지를 유지합니다.
- source_word: ὁσιότητα
  english_pob_choice: holiness
  chosen_korean: 거룩함
  alternatives_korean:
  - 경건
  - 신실함
  lexicon: LSJ
  rationale: ὁσιότης의 핵심을 한국어 성서 문맥에서 널리 쓰이는 ‘거룩함’으로 옮겼습니다. ‘경건’과 ‘신실함’도 가능하지만, 이 절의 인격화된 덕목과 방패 비유에는 ‘거룩함’이 더 직접적입니다.
theological_decisions:
- issue: ὁσιότητα를 도덕적·신학적 덕목으로 볼지, 경건/종교성으로 좁혀 볼지의 문제
  chosen_reading: ‘거룩함’으로 번역하여 하나님 앞에서의 전인적 성결과 덕목을 함께 드러냈습니다.
  alternative_readings:
