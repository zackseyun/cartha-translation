  source_fidelity: 그리스어는 ‘거룩함’을 ‘정복할 수 없는 방패’로 취한다는 뜻입니다. 현 번역은 ‘정복할 수 없는 방패로 거룩함을 취하다’로 수식 관계가 바뀌어, 방패가 취하는 수단처럼 읽힐 수 있습니다.
  naturalness: ‘거룩함을 정복할 수 없는 방패로 삼을 것입니다’는 현대 표준 한국어 합쇼체에서 자연스럽고, 원문의 무장 비유를 분명히 드러냅니다.
  terminology: ὁσιότης의 주번역 ‘거룩함’은 적절합니다. 그러나 각주의 ‘신실함’은 보통 πιστις 계열의 충실함/신실성을 뜻하므로 이 어휘의 적절한 대안이 아닙니다. ‘경건’과 ‘하나님을 경외함’이 가능한 의미 범위를 더 잘 반영합니다.
  issues:
