translation:
  language: ko
  text: 그는 의를 흉배로 입고, 진실한 심판을 투구로 쓰실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정의를 흉배로.’ 그리스어 δικαιοσύνη는 ‘의’와 ‘정의’ 둘 다로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘위선 없는 심판’이며, 곧 진실하고 편벽되지 않은 심판이라는 뜻입니다.
    reason: lexical_alternative
