base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/016.yaml
  text: Therefore they will receive the kingdom of splendor and the crown of beauty from the hand of the Lord[a], because with his right hand he will shelter them[b], and with his arm he will defend them.
  footnotes:
  - marker: a
    text: Or 'the diadem of beauty.' The Greek uses a specifically royal term for the headpiece.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'he will defend them' is literally 'he will defend on behalf of them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그들은 영광의 왕국과 아름다움의 왕관을 주님의 손에서 받을 것입니다[a]. 이는 그분이 자신의 오른손으로 그들을 덮으시고, 자신의 팔로 그들을 보호하실 것이기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 왕실 머리장식인 διάδημα를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들 편에서 보호하실’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이 때문에
  - 그런 까닭에
  lexicon: LSJ
  rationale: 앞 문맥의 판결과 연결하는 추론 표지이므로, 자연스럽고 문맥을 잇는 ‘그러므로’가 가장 적절합니다.
- source_word: τὸ βασίλειον τῆς εὐπρεπείας
  english_pob_choice: the kingdom of splendor
  chosen_korean: 영광의 왕국
  alternatives_korean:
  - 찬란함의 왕국
  - 아름다움의 왕국
  lexicon: LSJ
  rationale: βασίλειον은 왕권보다 구체적인 왕국/왕적 영역을 가리킬 수 있어 ‘왕국’으로 두고, εὐπρέπεια는 여기서 화려함·찬란함의 왕적 품위를 나타내므로 ‘영광’으로 옮겼습니다.
- source_word: τὸ διάδημα τοῦ κάλλους
  english_pob_choice: the crown of beauty
  chosen_korean: 아름다움의 왕관
  alternatives_korean:
  - 미의 관
  - 아름다움의 관
  lexicon: LSJ
  rationale: διάδημα의 왕실 머리장식을 한국어로는 ‘왕관’이 가장 자연스럽고, κάλλος는 ‘아름다움’이 기본 뜻이므로 그대로 살렸습니다.
- source_word: ὑπερασπιεῖ αὐτῶν
  english_pob_choice: he will defend them
  chosen_korean: 그들을 보호하실
  alternatives_korean:
  - 그들을 변호하실
  - 그들을 변호해 주실
  lexicon: LSJ
  rationale: 동사에는 ‘편들어 지키다/수호하다’는 의미가 있어, 한국어에서는 군사적·법정적 뉘앙스를 과도하게 좁히지 않는 ‘보호하다’가 가장 균형 잡힌 선택입니다.
theological_decisions:
- issue: κυρίου의 존칭과 하나님의 주권
  chosen_reading: ‘주님’으로 번역하여, 하사하시는 분이 하나님이심을 직접 드러냈습니다.
  alternative_readings:
  - ‘주’
  - ‘주인’
  rationale: 이 문맥에서 κύριος는 상과 보호를 베푸는 하나님을 가리키므로, 한국어 경건어법에 맞는 ‘주님’이 가장 적절합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → Lord'
- issue: 보호 이미지의 중첩
  chosen_reading: ‘덮으시고… 보호하실’로 두 동사를 구분해 보호와 دفاع의 중첩을 살렸습니다.
  alternative_readings:
  - ‘가리시고… 지키실’
  - ‘감싸시고… 방어하실’
  rationale: σπεκάζειν의 덮는 이미지와 ὑπερασπίζειν의 적극적 방어 이미지를 구분해, 본문의 시적 긴장을 보존했습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
