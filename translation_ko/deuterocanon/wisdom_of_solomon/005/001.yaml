  rationale: 이 구절은 전직 박해자들 앞에서의 공개적 정당화 장면이므로, 내면 심리보다 드러난 태도를 나타내는 ‘담대함’이 더 적합합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
