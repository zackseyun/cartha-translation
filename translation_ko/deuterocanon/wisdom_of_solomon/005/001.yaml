base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/001.yaml
  text: Then the righteous man will stand with great boldness before those who afflicted him and those who disregarded his labors[a][b][c].
  footnotes:
  - marker: a
    text: Or 'with great confidence.' The Greek παρρησία can denote both boldness and confident openness.
    reason: lexical_alternative
  - marker: b
    text: Literally 'before the face of,' a Hebrew-like expression for standing directly in someone's presence.
    reason: lexical_alternative
  - marker: c
    text: Or 'his toils' or 'his sufferings.' The Greek can refer to labor, hardship, or pain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 의인은 자신을 괴롭힌 자들과 그의 수고를 무시한 자들 앞에서 큰 담대함으로 서게 될 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘큰 확신으로’. 그리스어 παρρησία는 담대함과 자신 있게 드러내는 태도 둘 다를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘얼굴 앞에서’라는 뜻으로, 누군가의 면전에서 서는 히브리식 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그의 노고’나 ‘그의 고통’. 그리스어는 수고, 고난, 아픔을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그 후에
  - 그때에
  lexicon: LSJ
  rationale: 시간의 전환을 자연스럽게 표시하는 말로, 재판적·종말론적 장면의 흐름을 그대로 살립니다.
- source_word: στήσεται ἐν παρρησίᾳ πολλῇ
  english_pob_choice: will stand with great boldness
  chosen_korean: 큰 담대함으로 서게 될 것입니다
  alternatives_korean:
  - 큰 확신으로 서게 될 것입니다
  - 크게 담대하여 서게 될 것입니다
  lexicon: LSJ
  rationale: παρρησία는 단순한 내적 확신보다 공개적이고 거리낌 없는 담대함을 가리키므로, ‘담대함’으로 옮겨 공개적 변호의 뉘앙스를 살렸습니다.
- source_word: κατὰ πρόσωπον
  english_pob_choice: before the face of
  chosen_korean: 앞에서
  alternatives_korean:
  - 면전에서
  - 그 얼굴 앞에서
  - 앞에
  lexicon: LSJ
  rationale: 직역하면 ‘얼굴 앞에’이지만 한국어에서는 어색하므로, 직접 대면하는 장면을 살리는 ‘앞에서’로 옮겼습니다.
- source_word: τῶν θλιψάντων αὐτὸν
  english_pob_choice: those who afflicted him
  chosen_korean: 자신을 괴롭힌 자들
  alternatives_korean:
  - 그를 압박한 자들
  - 그를 학대한 자들
  lexicon: LSJ
  rationale: θλίβω는 누르다, 괴롭히다, 압박하다의 뜻이 있어, 여기서는 가해의 폭을 지나치게 좁히지 않는 ‘괴롭힌’이 적절합니다.
- source_word: τῶν ἀθετούντων τοὺς πόνους αὐτοῦ
  english_pob_choice: those who disregarded his labors
  chosen_korean: 그의 수고를 무시한 자들
  alternatives_korean:
  - 그의 노고를 무시한 자들
  - 그의 수고와 고통을 대수롭지 않게 여긴 자들
  lexicon: LSJ
  rationale: ἀθετέω는 무시하다, 거부하다, 무효로 하다의 뜻이 있으므로, 사역의 결과를 업신여기는 뉘앙스를 담아 ‘무시한’으로 옮겼습니다. πόνοι는 이 문맥에서 단순한 고통보다 삶의 수고와 고됨을 함께 가리켜 ‘수고’가 균형적입니다.
theological_decisions:
- issue: 의인(ὁ δίκαιος)의 단수 남성형 유지
  chosen_reading: 의인
  alternative_readings:
  - 의로운 사람
  - 의로운 자
  rationale: 그리스어가 단수 남성형이므로, 한국어에서도 대표적 단수 표현인 ‘의인’으로 유지하여 문법적 형식을 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: 공개적 변호 장면의 παρρησία
  chosen_reading: 큰 담대함
  alternative_readings:
  - 큰 확신
  - 공공연한 자유로움
  rationale: 이 구절은 전직 박해자들 앞에서의 공개적 정당화 장면이므로, 내면 심리보다 드러난 태도를 나타내는 ‘담대함’이 더 적합합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
