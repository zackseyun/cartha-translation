  naturalness: 합쇼체 문체를 유지하되, ‘날개짓의 한 번의 타격’, ‘그 지나감의 흔적’ 및 ‘작은 영’처럼 어색하거나 의미가 불분명한 표현을 자연스러운 현대 한국어로 바로잡아야 합니다. ‘날갯짓’은 한 단어로 쓰고, ῥοιζῷ는 ‘휘파람 소리’로 구체화하는 편이 자연스럽습니다.
  terminology: ὀρνέου는 ‘새’, ἀήρ는 ‘공중’, τεκμήριον πορείας는 ‘날아간 길을 보여 주는 증거’, πνεῦμα κοῦφον은 ‘가벼운 공기’, ταρσοί/πτέρυγες는 문맥상 ‘날개/날갯짓’, σημεῖον ἐπιβάσεως는 ‘지나간 흔적’으로 옮겼습니다. ‘영’은 이 문맥에서 신학적 또는 인격적 의미를 불필요하게 불러오므로 사용하지 않았습니다.
