base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/011.yaml
  text: 'or like a bird flying through the air: no evidence of its path is found[a], though the light air, whipped by the stroke of its pinions and split by force with the whirring of moving wings, was traversed[b], and after that no sign of its passage was found in it.'
  footnotes:
  - marker: a
    text: Or 'trace of its journey' for τεκμήριον πορείας; the Greek emphasizes that no demonstrable mark of the bird's route remains.
    reason: lexical_alternative
  - marker: b
    text: The phrase rendered 'the light wind' translates πνεῦμα κοῦφον, which could also be understood as 'light air' or 'subtle breeze.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또는 공중을 날아가는 새와 같습니다. 그 길의 흔적은 아무 증거도 발견되지 않습니다[a]. 그러나 그 작은 영이 날개짓의 한 번의 타격에 채찍질을 당하고, 움직이는 날개의 휘몰아치는 소리로 힘껏 갈라진 공중을 지나가며[b], 그 뒤에는 그 안에서 그 지나감의 흔적도 발견되지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 여정의 흔적’으로도 옮길 수 있습니다. 그리스어 τεκμήριον πορείας는 새의 이동 경로에 남는 증거를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 작은 영’은 πνεῦμα κοῦφον의 직역적 성격을 반영한 표현입니다. 문맥상 ‘가벼운 공기’나 ‘산들바람’으로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀρνέου διιπτάντος ἀέρα
  english_pob_choice: a bird flying through the air
  chosen_korean: 공중을 날아가는 새
  alternatives_korean:
  - 하늘을 가로질러 나는 새
  - 공중을 가르는 새
  lexicon: LSJ
  rationale: 새의 비유를 자연스러운 현대 한국어로 살리면서, ἀέρα를 ‘공중’으로 옮겨 실제적으로 그 새가 통과하는 매개를 드러냈습니다.
- source_word: τεκμήριον πορείας
  english_pob_choice: evidence of its path
  chosen_korean: 그 길의 흔적은 아무 증거도
  alternatives_korean:
  - 그 지나간 길의 증거는
  - 그 여정의 흔적은
  lexicon: LSJ
  rationale: τεκμήριον은 단순한 표지가 아니라 ‘증거’의 뉘앙스가 있어 이를 살렸고, πορείας는 ‘길/이동 경로’의 의미를 반영해 ‘그 길’로 옮겼습니다.
- source_word: πνεῦμα κοῦφον
  english_pob_choice: the light air
  chosen_korean: 그 작은 영
  alternatives_korean:
  - 그 가벼운 공기
  - 그 산들바람
  lexicon: LSJ
  rationale: 문맥상 공중의 흐름을 가리키지만, 한국어에서 ‘가벼운 공기’는 어색하여, πνεῦμα의 기본 의미인 ‘영/숨/바람’의 폭을 살려 ‘작은 영’으로 옮기되, 공중적 이미지는 뒤 문맥으로 보강했습니다.
- source_word: σχιζόμενον βίᾳ ῥοιζῷ, κινουμένων πτερύγων
  english_pob_choice: split by force with the whirring of moving wings
  chosen_korean: 날개짓의 한 번의 타격에 채찍질을 당하고, 움직이는 날개의 휘몰아치는 소리로 힘껏 갈라진
  alternatives_korean:
  - 격렬한 소리와 함께 세차게 갈라지고
  - 움직이는 날개가 내는 휘파람 같은 소리로 힘입어 갈라지고
  lexicon: LSJ
  rationale: ‘갈라지다/채찍질을 당하다’로 σχιζόμενον·μαστιζόμενον의 폭력을 살리고, ῥοιζῷ는 단순한 소리보다 날개가 내는 휘몰아치는 소리로 옮겨 감각적 긴장을 유지했습니다.
- source_word: διωδεύθη
  english_pob_choice: was traversed
  chosen_korean: 지나가며
  alternatives_korean:
  - 통과하며
  - 가로지르며
  lexicon: LSJ
  rationale: 수동의 ‘지나감을 겪다’는 의미를 한국어 서술 속의 진행형으로 자연스럽게 풀어, 앞뒤 문장과 이어지는 시적 문맥을 유지했습니다.
theological_decisions:
- issue: πνεῦμα κοῦφον의 번역에서 ‘wind/air/spirit’의 의미 범위
  chosen_reading: 공중의 흐름을 가리키는 이미지이지만, 한국어에서는 직접적으로 ‘작은 영’이라고 옮겨 πνεῦμα의 넓은 의미를 보존했습니다.
  alternative_readings:
  - 가벼운 공기
  - 산들바람
  - 가벼운 바람
  rationale: 이 구절은 새의 비행이 남기는 흔적 없음과 감각적 폭력을 함께 그리므로, 단순한 기상어로 축소하면 원문의 표현력이 약해집니다. ‘영’은 어색하지만, 원문의 다의성을 보존하는 쪽이 더 source-direct합니다.
  doctrine_reference: 지혜서 5:11의 시적 비유와 πνεῦμα의 어휘적 범위
