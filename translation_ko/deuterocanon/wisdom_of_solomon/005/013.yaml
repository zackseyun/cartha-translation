translation:
  language: ko
  text: 이와 같이 우리도 태어나자마자 끝나 버렸고, 덕의 표징을 보여 줄 것이 하나도 없었으며, 우리의 악함 속에서 소모되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '사라져 버렸고', '없어졌고'로 옮길 수 있습니다. 여기서 동사는 소멸뿐 아니라 사라짐/중단의 의미도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '탁월성'으로 옮길 수 있습니다. 이 단어는 더 넓게는 도덕적 탁월성을 가리킬 수 있습니다.
    reason: lexical_alternative
