  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/013.yaml
  text: So also we[a], once we were born, came to an end; and we had no sign of virtue to show[b], but were consumed in our wickedness.
  footnotes:
  - marker: a
    text: Or 'passed away' or 'vanished' for 'came to an end.' The Greek verb can express disappearance or cessation.
    reason: lexical_alternative
  - marker: b
    text: Or 'excellence' for 'virtue.' The Greek term can denote moral excellence more broadly.
