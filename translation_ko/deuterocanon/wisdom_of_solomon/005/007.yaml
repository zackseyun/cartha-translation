lexical_decisions:
- source_word: ἀνομίας ἐνεπλήσθημεν τρίβοις καὶ ἀπωλείας
  english_pob_choice: We were filled with paths of lawlessness and destruction
  chosen_korean: 우리는 불법과 멸망의 길로 가득 차 있었고
  alternatives_korean:
  - 우리는 불법의 길과 멸망으로 가득 차 있었고
  - 우리는 불법과 파멸의 길로 가득 차 있었고
  lexicon: LSJ
  rationale: 그리스어는 ‘길들(τρίβοις)’에 ‘불법’(ἀνομίας)과 ‘멸망’(ἀπωλείας)이 수식적으로 결합된 표현이어서, 한국어에서는 의미를 자연스럽게 살리되 ‘길’의 이미지를 유지하는 쪽이 적절합니다.
- source_word: διωδεύσαμεν ἐρήμους ἀβάτους
  english_pob_choice: we traveled through trackless deserts
  chosen_korean: 길 없는 광야들을 지나 다녔으며
  alternatives_korean:
  - 길 없는 사막들을 지나 다녔으며
  - 통행할 수 없는 광야들을 지나 다녔으며
  lexicon: LSJ
  rationale: ἐρήμους ἀβάτους는 단순한 지리 묘사보다 ‘지나갈 길이 없는’ 상태를 강조하므로, ‘길 없는 광야들’이 한국어로 가장 압축적이고 원문에 가깝습니다.
- source_word: τὴν δὲ ὁδὸν Κυρίου
  english_pob_choice: the way of the Lord
  chosen_korean: 주님의 길은
  alternatives_korean:
  - 주님의 길은
  - 주님의 도는
  lexicon: LSJ
  rationale: ὁδός는 여기서 악한 길들과 대조되는 삶의 방식이므로, 관용적이면서도 본문의 대조를 살리는 ‘주님의 길’을 택했습니다.
- source_word: Κυρίου
  english_pob_choice: the Lord
  chosen_korean: 주님의
  alternatives_korean:
  - 주님의
  - 야훼의
  lexicon: LSJ
  rationale: 본문의 κύριος는 이 절 안에서 직접 인용 표지가 없는 일반 호칭이므로, 한국어 본문은 프로젝트 기본어인 ‘주님’을 유지하되 속격은 ‘주님의’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: ‘주님의 길’의 의미
  chosen_reading: 하나님께서 요구하시는 올바른 삶의 길이라는 도덕적·영적 의미로 읽었습니다.
  alternative_readings:
  - 물리적인 길이나 이동 경로
  - 특정 율례의 절차적 길
  rationale: 앞의 ‘불법과 멸망의 길’, ‘길 없는 광야들’과 평행을 이루므로, 단순한 지리 정보보다 삶의 방향을 가리키는 비유로 번역하는 것이 문맥에 맞습니다.
