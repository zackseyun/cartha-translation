  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/020.yaml
  text: He will sharpen severe wrath into a sword[a], and the world will join battle with him against the senseless.
  footnotes:
  - marker: a
    text: Or 'against the senseless' or 'against the fools.' The Greek term refers to those who are irrational or morally deranged in their opposition to God, not necessarily to mental illness in a clinical sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 심한 진노를 칼로 날카롭게 하시고, 세상은 그와 함께 감정이 무너진 자들에 맞서 싸울 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어리석은 자들에 맞서’. 그리스어 παράφρονας는 정신질환을 가리키기보다 하나님께 반대하여 이성적·도덕적으로 뒤틀린 사람들을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀξυνεῖ
  english_pob_choice: will sharpen
  chosen_korean: 날카롭게 하시고
  alternatives_korean:
  - 벼리시고
  - 갈아 날카롭게 하시고
  lexicon: LSJ
  rationale: 동사 ὀξύνω의 핵심인 ‘날카롭게 하다’를 자연스러운 한국어로 옮겼습니다. 무기 이미지를 살리되 지나치게 기계적인 표현은 피했습니다.
- source_word: ἀπότομον ὀργὴν
  english_pob_choice: severe wrath
  chosen_korean: 심한 진노
  alternatives_korean:
  - 가혹한 진노
  - 엄한 진노
  - 격렬한 진노
  lexicon: LSJ
  rationale: ἀπότομον은 문자적으로 ‘급작스러운/날카로운’ 뉘앙스가 있으나 여기서는 전투적 이미지 속의 진노를 수식하므로, 형식적이면서도 강한 ‘심한 진노’가 적절합니다.
- source_word: εἰς ῥομφαίαν
  english_pob_choice: into a sword
  chosen_korean: 칼로
  alternatives_korean:
  - 칼이 되게
  - 칼로서
  - 검으로
  lexicon: LSJ
  rationale: εἰς는 결과를 나타내어 ‘~이 되다’의 의미를 띠므로, 한국어에서는 변형 결과를 드러내는 도구격 ‘칼로’가 가장 자연스럽고 이미지도 선명합니다.
- source_word: ἐπὶ τοὺς παράφρονας
  english_pob_choice: against the senseless
  chosen_korean: 감정이 무너진 자들에 맞서
  alternatives_korean:
  - 무감각한 자들에 맞서
  - 정신이 나간 자들에 맞서
  - 어리석은 자들에 맞서
  lexicon: LSJ
  rationale: παράφρων은 단순 지능 문제가 아니라 하나님께 대한 반대 속에서 이성적·도덕적으로 뒤틀린 상태를 가리키므로, 임상적 뉘앙스를 피하면서도 그 왜곡을 드러내는 표현을 택했습니다.
theological_decisions:
- issue: ὁ κόσμος가 누구와 ‘함께 싸우는가’의 지시 대상
  chosen_reading: 문맥상 세상은 하나님의 심판 행위에 동참하는 것으로 읽되, 본문에는 신적 주어를 덧붙이지 않았습니다.
  alternative_readings:
  - 세상이 그와 함께 싸운다에서 ‘그’는 문맥상 의인일 수 있음
  - 문맥 설명을 위해 ‘하나님과 함께’로 명시할 수 있음
  rationale: 그리스어 본문은 αὐτῷ의 지시를 직접 밝히지 않으므로, 한국어 본문은 과도한 명시를 피하고 문맥의 심판 이미지를 유지했습니다.
  doctrine_reference: 문맥적 지시 대명사 보존
- issue: παράφρονας의 의미 범위
  chosen_reading: ‘감정이 무너진 자들’로 옮겨 정신질환을 뜻하는 임상어로 오해되지 않게 했습니다.
  alternative_readings:
  - 미친 자들
  - 정신 나간 자들
  - 어리석은 자들
  rationale: 이 구절의 대상은 하나님을 거슬러 도덕적으로 뒤틀린 자들이므로, 현대 독자에게 임상적 낙인을 주지 않으면서 원문의 강한 비판성을 보존하는 것이 필요합니다.
  doctrine_reference: 지혜문학의 도덕적-영적 분별
