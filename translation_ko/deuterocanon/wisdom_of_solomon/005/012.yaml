translation:
  language: ko
  text: 또 활이 목표를 향해 쏘아져 나간 것처럼, 공기는[a] 한 번 가르지자마자 곧바로 자기 안으로 다시 모여 들어, 그 지나간 길을 알 수 없게 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 지나간 길’ 혹은 ‘그 통로’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: βέλους
  english_pob_choice: arrow
  chosen_korean: 활
  alternatives_korean:
  - 화살
  - 살
  lexicon: LSJ
  rationale: 비유의 출발점은 발사체 자체이므로 일반적으로는 ‘화살’이 가장 직접적입니다. 다만 한국어 문맥에서 ‘활이 쏘아져 나간 것처럼’은 비유의 동작을 자연스럽게 살리며, 이어지는 ‘목표’와도 연결됩니다.
- source_word: σκοπόν
  english_pob_choice: target
  chosen_korean: 목표
  alternatives_korean:
  - 과녁
  - 표적
  lexicon: LSJ
  rationale: 여기서 σκοπός는 활쏘기에서 겨냥하는 대상을 가리키므로 ‘목표’가 현대 한국어에서 가장 자연스럽고 구체적입니다.
- source_word: τμηθεὶς ὁ ἀὴρ
  english_pob_choice: the air, once cut through
  chosen_korean: 공기는 한 번 가르지자마자
  alternatives_korean:
  - 공기는 한 번 찢기자마자
  - 공기는 한 번 가로지르자마자
  lexicon: LSJ
  rationale: τμηθείς는 ‘잘리다/가르다’의 수동 분사로, 화살이 공기를 가르는 순간적 이미지를 담습니다. ‘가르지자마자’가 그 물리적 생동감을 가장 자연스럽게 전달합니다.
- source_word: εἰς ἑαυτὸν ἀνελύθη
  english_pob_choice: closed up on itself
  chosen_korean: 자기 안으로 다시 모여 들어
  alternatives_korean:
  - 스스로 다시 닫혀
  - 제자리로 되돌아가
  lexicon: LSJ
  rationale: 직역하면 ‘자기 자신 안으로 풀려 돌아가다’인데, 문맥상 공기가 다시 이어져 흔적이 사라지는 모습을 뜻합니다. ‘다시 모여 들어’가 그 복원 이미지를 가장 잘 살립니다.
- source_word: δίοδον
  english_pob_choice: path
  chosen_korean: 지나간 길
  alternatives_korean:
  - 통로
  - 통과한 길
  lexicon: LSJ
  rationale: δίοδος는 ‘지나감/통과’의 흔적을 가리키므로, 화살이 지나간 궤적을 드러내는 ‘지나간 길’이 비유에 적합합니다.
