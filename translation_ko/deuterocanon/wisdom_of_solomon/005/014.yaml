  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/014.yaml
  text: For the hope of the ungodly is like down carried by the wind[a], and like thin frost driven away by a storm, and like smoke dispersed by the wind, and passes by like the remembrance of a one-day guest.
  footnotes:
  - marker: a
    text: Or 'like the memory of a traveler who stayed only one day.' The Greek καταλύτου refers to someone lodging temporarily, and μνεία can mean 'memory' or 'mention.'
    reason: lexical_alternative
translation:
  language: ko
  text: 불경한 자들의 소망은 바람에 실려 가는 솜털 같고, 폭풍에 쫓겨 사라지는 엷은 서리 같으며, 바람에 흩어지는 연기 같고, 하루만 머문 나그네에 대한 기억처럼 지나가 버립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: καταλύτου는 잠시 머무는 사람, 곧 임시 체류자를 가리킬 수 있으며, μνεία는 ‘기억’뿐 아니라 ‘언급’이라는 뜻도 가질 수 있습니다.
    reason: lexical_alternative
