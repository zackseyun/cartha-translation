translation:
  language: ko
  text: 무신한 자들의 희망은 바람에 실려 가는 솜털 같고, 폭풍에 쫓겨 사라지는 가는 서리 같으며, 바람에 흩어지는 연기 같고, 하루 묵는 나그네의 기억처럼 지나가 버립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
