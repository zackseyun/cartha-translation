base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/015.yaml
  text: But the righteous live forever[a], and their reward is with the Lord[b], and their care is with the Most High.
  footnotes:
  - marker: a
    text: Or 'in the Lord.' The Greek preposition can be rendered more literally this way.
    reason: lexical_alternative
  - marker: b
    text: Or 'their welfare is with the Most High' or 'the Most High cares for them.' The Greek phrase is compact and allows more than one closely related sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 의인들은 영원히 삽니다. 그들의 상급은 주님과 함께 있고[a], 그들의 돌봄은 지극히 높으신 분과 함께 있습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님 안에’. 헬라어 전치사는 더 문자적으로 이렇게도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그들의 복리는 지극히 높으신 분과 함께 있다’ 혹은 ‘지극히 높으신 분이 그들을 돌보신다’. 헬라어 구문이 매우 압축되어 있어, 의미를 둘로 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: δίκαιοι
  english_pob_choice: the righteous
  chosen_korean: 의인들
  alternatives_korean:
  - 의로운 사람들
  - 의로운 이들
  lexicon: BDAG
  rationale: 서술적 형용사 δίκαιοι는 의로움으로 특징지어진 사람들을 가리키므로, 한국어에서는 관용적이고 문맥에 맞는 명사화된 표현인 ‘의인들’이 가장 자연스럽습니다.
- source_word: εἰς τὸν αἰῶνα
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 끝없이
  - 영원까지
  lexicon: BDAG
  rationale: 이 표현은 지속되는 무한한 기간을 뜻하므로, 현대 한국어에서 가장 자연스럽고 분명한 ‘영원히’로 옮겼습니다.
- source_word: ἐν Κυρίῳ
  english_pob_choice: with the Lord
  chosen_korean: 주님과 함께
  alternatives_korean:
  - 주 안에
  - 주님 안에
  lexicon: BDAG
  rationale: 전치사 ἐν은 문자적으로는 ‘안에’이지만, 이 절에서는 상급의 소유·보관의 뉘앙스가 강하므로 한국어에서는 문맥상 자연한 ‘주님과 함께’로 옮겨 그 보존 상태를 드러냈습니다.
- source_word: ἡ φροντὶς αὐτῶν
  english_pob_choice: their care
  chosen_korean: 그들의 돌봄
  alternatives_korean:
  - 그들의 염려
  - 그들의 관심
  - 그들의 복리
  lexicon: LSJ
  rationale: φροντίς는 ‘돌봄, 관심, 염려’까지 포괄하는데, 본절의 압축된 병행구조를 살리기 위해 해석을 과도하게 좁히지 않는 ‘돌봄’을 택했습니다.
- source_word: παρὰ Ὑψίστῳ
  english_pob_choice: with the Most High
  chosen_korean: 지극히 높으신 분과 함께
  alternatives_korean:
  - 지극히 높으신 이와 함께
  - 지극히 높으신 분 곁에
  lexicon: BDAG
  rationale: Ὑψίστῳ는 하나님을 가리키는 칭호이므로, 표준적인 ‘지극히 높으신 분’으로 옮기되 앞절과의 평행성을 위해 ‘과 함께’를 유지했습니다.
theological_decisions:
- issue: ἡ φροντὶς αὐτῶν의 의미 범위
  chosen_reading: ‘그들의 돌봄’으로 두어, 그들의 복리/보살핌이 하나님 곁에 있음을 열어 둡니다.
  alternative_readings:
  - 하나님이 그들을 돌보십니다
  - 그들의 복리가 지극히 높으신 분과 함께 있습니다
  rationale: 헬라어 φροντίς는 주어를 명시적으로 결정하지 않는 압축된 표현이므로, 본문이 가진 양면성—그들의 돌봄이 하나님께 속해 있다는 뜻과 하나님이 그들을 돌보신다는 뜻—을 너무 일찍 단정하지 않기 위해 중립적으로 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: ἐν Κυρίῳ의 한국어 처리
  chosen_reading: ‘주님과 함께’로 번역해 상급이 주님의 보호와 소유 아래 있음을 나타냅니다.
  alternative_readings:
  - 주 안에
  - 주님 안에
  rationale: 한국어 ‘주 안에’는 신비적 결합을 강하게 암시할 수 있어, 여기서는 상급의 위치/보관이라는 문맥적 의미를 살리는 ‘주님과 함께’가 더 적절합니다.
  doctrine_reference: 'DOCTRINE.md §Contested terms: κύριος → Lord'
