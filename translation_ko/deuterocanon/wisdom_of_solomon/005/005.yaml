  rationale: 후대 교회제도적 용어인 ‘성도’도 가능하지만, 여기서는 지혜문학의 문맥상 거룩한 사람들을 가리키는 표현이므로 보다 직접적인 ‘거룩한 이들’이 원문 밀착적입니다.
