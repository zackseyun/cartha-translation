lexical_decisions:
- source_word: πῶς
  english_pob_choice: How
  chosen_korean: 어찌하여
  alternatives_korean:
  - 어떻게
  - 어찌
  lexicon: LSJ
  rationale: 본문은 의문문이지만 단순한 방법 질문이 아니라 의로운 자가 받아들여진 사실에 대한 경탄과 놀라움을 나타내므로, 현대 한국어에서 그 뉘앙스를 살리는 ‘어찌하여’가 가장 자연스럽습니다.
- source_word: κατελογίσθη
  english_pob_choice: was counted
  chosen_korean: 셈해졌으며
  alternatives_korean:
  - 계산되었으며
  - 헤아려졌으며
  - 간주되었으며
  lexicon: LSJ
  rationale: 수동태로 어떤 무리에 속한 사람으로 간주·기입되는 뜻이므로, 교회적 관용보다 현재형 결과를 드러내는 ‘셈해지다’가 적절합니다.
- source_word: ἐν υἱοῖς θεοῦ
  english_pob_choice: among the sons of God
  chosen_korean: 하나님의 아들들 가운데서
  alternatives_korean:
  - 하나님의 자녀들 가운데서
  - 하나님의 아들들 중에
  lexicon: LSJ
  rationale: 그리스어의 남성 복수 상태 표지를 보존해 ‘아들들’로 옮기며, ἐν+여격의 소속/동류 관계는 ‘가운데서’로 자연스럽게 드러냅니다.
- source_word: κλῆρος αὐτοῦ ἐστιν
  english_pob_choice: his lot is
  chosen_korean: 그의 몫은
  alternatives_korean:
  - 그의 분깃은
  - 그의 기업은
  - 그의 몫이 있습니다
  lexicon: LSJ
  rationale: κλῆρος는 문자적으로 ‘제비/몫’이어서 ‘몫’이 가장 직접적입니다. 이어지는 ‘…가운데 있다’와 함께 배정된 몫이라는 의미를 살립니다.
