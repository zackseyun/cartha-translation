  - 의인의 실제 태도로 오해하게 하는 읽기
  rationale: ‘우리’를 기준으로 한 비난과 조롱의 문맥을 유지해야 이 절의 반어와 긴장이 보존됩니다.
  doctrine_reference: 서술 화자와 인용 화자의 구분 보존
