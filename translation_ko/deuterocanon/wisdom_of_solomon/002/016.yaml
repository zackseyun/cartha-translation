    reason: lexical_alternative
  - marker: b
    text: 또는 ‘마지막 상태’나 ‘의인들의 결과’입니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘아버지 하나님을 자랑한다’는 뜻입니다. 곧 하나님을 자기 아버지라고 주장한다는 말입니다.
    reason: lexical_alternative
