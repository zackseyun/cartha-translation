  text: 그는 우리를 가짜로 여겼으며[a], 우리의 길에서 부정한 것들을 피하듯이 멀리합니다. 그는 의인들의 마지막을 복되다고 여기며[b], 하나님이 자기 아버지라고 자랑합니다[c].
  philosophy: optimal-equivalence
