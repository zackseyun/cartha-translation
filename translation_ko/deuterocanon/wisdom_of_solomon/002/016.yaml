translation:
  language: ko
  text: 그는 우리를 가짜로 여겼으며[a], 우리의 길을 마치 더러움에서나 피하듯이 피합니다. 그는 의인들의 마지막을 복되다[b]고 말하며, 하나님이 자기 아버지라고 자랑합니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
