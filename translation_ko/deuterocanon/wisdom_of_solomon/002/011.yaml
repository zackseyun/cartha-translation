translation:
  language: ko
  text: 그러나 우리의 힘이 의의 법이 되게 합시다[a]. 이는 약한 것은 무용한 것으로 드러나기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정의의 법’. 그리스어 δικαιοσύνη는 ‘의’와 ‘정의’를 모두 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστω
  english_pob_choice: let ... be
  chosen_korean: 되게 하자
  alternatives_korean:
  - 되어라
  - 되게 하십시오
  lexicon: LSJ
  rationale: 제3인칭 명령형의 권고적 뉘앙스를 한국어의 제안형으로 옮기되, 집단의 자의적 결의라는 문맥을 살려 '되게 하자'로 처리했습니다.
- source_word: ἡμῶν ἡ ἰσχὺς
  english_pob_choice: our strength
  chosen_korean: 우리의 힘
  alternatives_korean:
  - 우리의 강함
  - 우리의 권세
  lexicon: LSJ
  rationale: ἰσχύς는 일반적인 힘·강함을 뜻하므로, 과도하게 정치적이거나 군사적인 색채를 띠지 않는 '힘'이 가장 직접적입니다.
- source_word: νόμος τῆς δικαιοσύνης
  english_pob_choice: the law of justice
  chosen_korean: 의의 율법
  alternatives_korean:
  - 정의의 법
  - 의로움의 법
  lexicon: LSJ
  rationale: δικαιοσύνη는 이 프로젝트 기본값에 따라 '의'로 옮기고, νόμος는 여기서 규범적 '율법'으로 보아 '의의 율법'이라고 했습니다. 'justice' 가능성은 주석으로 남깁니다.
- source_word: ἐλέγχεται
  english_pob_choice: is shown to be useless
  chosen_korean: 무용한 것으로 드러나기
  alternatives_korean:
  - 무용하다고 입증되기
  - 쓸모없다고 밝혀지기
  lexicon: LSJ
  rationale: ἐλέγχω는 드러내다/입증하다/밝히다의 뜻을 가질 수 있으므로, 여기서는 논증적 결과를 살리는 '드러나다' 계열로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: δικαιοσύνη의 한국어 기본값 유지
  chosen_reading: 의
