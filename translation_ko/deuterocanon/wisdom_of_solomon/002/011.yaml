  rationale: 지혜문학 문맥에서도 δικαιοσύνη의 기본 번역은 '의'를 유지하는 것이 이 프로젝트의 표준과 일치하며, 본절의 반어적 주장도 그 틀 안에서 분명하게 드러납니다.
