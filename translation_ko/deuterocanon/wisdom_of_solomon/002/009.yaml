theological_decisions:
- issue: ἀγερωχίας의 번역에서 긍정적 흥겨움과 부정적 오만의 긴장
  chosen_reading: 문맥상 향락적 자기과시를 가리키는 표현으로 읽어 본문은 그 방탕성을 드러내도록 번역했습니다.
  alternative_readings:
  - 오만
  - 자만
  - 거만함
  rationale: 지혜서 2장의 발화는 죽기 전 쾌락을 즐기자는 악인들의 권면이므로, 단어 자체의 ‘오만’ 가능성은 주석으로 남기되 본문은 향락적 과시의 흐름을 따라야 합니다.
  doctrine_reference: '번역 원칙: 문맥 우선, 다의성은 주석에서 보존'
