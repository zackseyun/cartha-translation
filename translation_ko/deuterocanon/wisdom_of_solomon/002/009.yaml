  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/009.yaml
  text: Let none of us be without a share in our revelry; everywhere let us leave tokens of our merriment[a], because this is our portion, and this our lot.
  footnotes:
  - marker: a
    text: Or, 'our pride' or 'our arrogance.' The Greek term can carry a negative sense of haughtiness, though here the context favors festive self-indulgence.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리 가운데 누구도 우리의 과시심<a>에서 한몫이 없게 하지 말고, 어디에서나 우리의 즐거움의 표식들을 남겨 두자. 이것이 우리의 몫이고, 이것이 우리의 분깃이기 때문이다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오만’이나 ‘자만’일 수 있습니다. 이 그리스어는 경우에 따라 거만함을 뜻하지만, 여기서는 문맥상 향락적 자기과시가 더 적합합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄμοιρος
  english_pob_choice: without a share
  chosen_korean: 한몫이 없게
  alternatives_korean:
  - 몫이 없게
