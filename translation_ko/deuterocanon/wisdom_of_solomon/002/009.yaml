  - 몫을 잃게
  lexicon: LSJ
  rationale: ‘without a share’의 분배적 이미지를 살리기 위해 ‘한몫이 없게’로 옮겼습니다. 뒤의 ‘몫’과 ‘분깃’과도 자연스럽게 호응합니다.
- source_word: ἀγερωχίας
