  - 자만심
  lexicon: LSJ
  rationale: 문맥상 단순한 자랑보다 자기 과시에 젖은 향락적 태도가 두드러지므로, 영어 주해가 보존한 축제적 방탕의 뉘앙스를 한국어로 압축해 ‘과시심’으로 처리했습니다. 부정적 도덕 뉘앙스는 본문 흐름에서 드러납니다.
- source_word: σύμβολα
  english_pob_choice: tokens
  chosen_korean: 표식들
  alternatives_korean:
  - 흔적들
  - 표지들
  - 기념물들
  lexicon: LSJ
  rationale: ‘tokens’가 가리키는 것은 눈에 띄는 흔적이나 표시이므로, 장소마다 남겨 두는 가시적 표시라는 점을 살려 ‘표식들’로 옮겼습니다.
- source_word: μερὶς / κλῆρος
  english_pob_choice: portion / lot
  chosen_korean: 몫 / 분깃
  alternatives_korean:
  - 몫 / 운명
  - 부분 / 제비
  - 몫 / 할당
  lexicon: LSJ
  rationale: 두 명사의 병행 구조를 유지하기 위해 ‘몫’과 ‘분깃’을 대응시켰습니다. 특히 ‘분깃’은 할당된 몫이라는 의미를 살려 뒤의 ‘lot’과 균형을 이룹니다.
theological_decisions:
- issue: ἀγερωχίας의 번역에서 긍정적 흥겨움과 부정적 오만의 긴장
  chosen_reading: 문맥상 향락적 자기과시를 가리키는 표현으로 읽어 본문은 그 방탕성을 드러내도록 번역했습니다.
  alternative_readings:
  - 오만
  - 자만
  - 거만함
  rationale: 지혜서 2장의 발화는 죽기 전 쾌락을 즐기자는 악인들의 권면이므로, 단어 자체의 ‘오만’ 가능성은 주석으로 남기되 본문은 향락적 과시의 흐름을 따라야 합니다.
  doctrine_reference: '번역 원칙: 문맥 우선, 다의성은 주석에서 보존'
