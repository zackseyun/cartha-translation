review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. ἀγερωχίας를 ‘과시심’으로 옮기면 ‘흥청거림/향락적 흥겨움’이라는 이 문맥의 주된 의미가 사라지고, ‘한몫이 없게 하지 말고’도 ἄμοιρος ἔστω의 의미와 한국어 문법을 충분히 살리지 못합니다. ‘흥청거림에 함께할 몫’은 원문의 참여·분배 이미지를 보존합니다.
  naturalness: 초안의 첫 절은 ‘과시심에서 한몫이 없게 하지 말고’라는 결합이 부자연스럽습니다. 합쇼체에 맞추어 ‘하지 맙시다/남겨 둡시다’로 일관되게 고쳤습니다.
  terminology: ἀγερωχίας는 본문에서 ‘흥청거림’으로 번역하고, ‘오만/자만’의 가능한 어휘적 의미는 각주에 보존합니다. μερίς/κλῆρος의 병행은 ‘몫/분깃’으로 유지합니다.
  issues:
  - severity: high
    issue: ἀγερωχίας를 ‘과시심’으로 번역함
    rationale: 이 단어는 ‘오만’의 의미도 가능하지만, 지혜서 2장의 향락 권유 문맥과 εὐφροσύνη에 비추어 여기서는 흥겨운 방탕 또는 흥청거림을 뜻하는 것이 더 적절합니다. ‘과시심’은 해당 명사의 문맥적 의미를 지나치게 좁히며, 참여의 대상이 되는 향락 행위라는 흐름도 약화합니다.
  - severity: medium
    issue: ‘우리의 과시심에서 한몫이 없게 하지 말고’가 부자연스럽고 참여 관계가 불명확함
    rationale: ἄμοιρος는 ‘몫이 없는, 참여하지 못하는’이라는 뜻입니다. ‘흥청거림에 함께할 몫이 없게 하지 맙시다’는 원문의 분배 이미지를 유지하면서 자연스럽게 표현합니다.
  - severity: medium
    issue: 본문의 각주 표지가 `<a>`와 끝의 `[a]`로 중복됨
    rationale: 동일 각주에 대한 표지는 한 번만 두어야 합니다. 각주가 가리키는 ἀγερωχίας 뒤의 `<a>`만 유지합니다.
  revised_text: 우리 가운데 아무도 우리의 흥청거림<a>에 함께할 몫이 없게 하지 맙시다. 어디에서나 우리의 즐거움의 표식들을 남겨 둡시다. 이것이 우리의 몫이고, 이것이 우리의 분깃이기 때문입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘오만’이나 ‘자만’일 수 있습니다. 이 그리스어는 경우에 따라 거만함을 뜻하지만, 여기서는 문맥상 향락적 흥청거림을 가리키는 것으로 보는 것이 더 적절합니다.
    reason: lexical_alternative
  revision_rationale: 향락을 권하는 화자의 발화라는 직접 문맥을 따라 ἀγερωχίας를 ‘흥청거림’으로 고쳤습니다. 동시에 ‘오만/자만’이라는 가능한 의미는 각주에 남겨 다의성을 보존했습니다. ἄμοιρος의 ‘몫 없음’과 뒤따르는 μερίς/κλῆρος의 병행은 ‘함께할 몫’ 및 ‘몫/분깃’으로 유지했으며, 문체를 현대 표준어 합쇼체로 통일하고 중복 각주 표지를 제거했습니다.
