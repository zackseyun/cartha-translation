  naturalness: ‘썩지 않도록 창조하시고’는 현대 표준 한국어에서 자연스럽고 의미가 분명합니다. ‘자기 고유한 본성의 형상으로’보다 ‘자신의 고유한 본성을 본뜬 형상으로’가 수식 관계를 더 명료하게 합니다. 합쇼체 종결도 문맥에 적절합니다.
