base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/023.yaml
  text: For God created man for incorruptibility[b][a], and made him in the image of his own nature.
  footnotes:
  - marker: a
    text: Or 'for immortality' or 'for imperishability.' The Greek term includes the sense of not being subject to decay or death.
    reason: lexical_alternative
  - marker: b
    text: Or 'an image of his own distinctiveness' or 'an image of his own being.' The Greek phrase is unusual and admits more than one close rendering.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 하나님께서 사람을 썩지 않도록 창조하시고, 자신의 고유한 본성을 본뜬 형상으로 그를 만드셨기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불멸을 위하여’, ‘소멸하지 않도록’. 그리스어는 부패하거나 죽음의 지배를 받지 않는 상태를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자신의 고유함의 형상’, ‘자신의 존재의 형상’. 이 그리스어 구는 드물며, 여러 가까운 번역이 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θεὸς
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하느님
  lexicon: 일반 성경 번역 관례
  rationale: 출발어의 θεός는 프로젝트 기본어인 ‘하나님’으로 옮겨 신학적 일관성을 유지했습니다.
- source_word: ἔκτισε
  english_pob_choice: created
  chosen_korean: 창조하시고
  alternatives_korean:
  - 만드시고
  - 지으시고
  lexicon: BDAG
  rationale: κτίζω는 단순 제작보다 존재하게 하심을 가리키므로, 문맥상 ‘창조하시고’가 가장 직접적입니다.
- source_word: ἐπʼ ἀφθαρσίᾳ
  english_pob_choice: for incorruptibility
  chosen_korean: 썩지 않음으로
  alternatives_korean:
  - 불멸을 위하여
  - 썩지 아니함으로
  lexicon: BDAG
  rationale: ἀφθαρσία의 핵심은 부패·소멸의 상태가 아니라는 점이므로, ‘썩지 않음’이 그 범위를 가장 자연스럽게 드러냅니다.
- source_word: εἰκόνα τῆς ἰδίας ἰδιότητος
  english_pob_choice: an image of his own nature
  chosen_korean: 자기 고유한 본성의 형상으로
  alternatives_korean:
  - 자기 고유함의 형상으로
  - 자기 존재의 형상으로
  lexicon: LSJ
  rationale: εἰκών과 ἰδιότης의 결합은 다소 특이하므로, ‘형상’과 ‘고유한 본성’으로 옮겨 하나님의 자기-특성을 반영하는 뜻을 살렸습니다.
- source_word: ἐποίησεν αὐτόν
  english_pob_choice: made him
  chosen_korean: 그를 만드셨기
  alternatives_korean:
  - 그를 지으셨기
  - 그를 만드시기
  lexicon: BDAG
  rationale: ποιέω의 기본값인 ‘만들다’를 살리되, 앞절과의 자연스러운 연결을 위해 이유절 안에서 정리했습니다.
theological_decisions:
- issue: ἀφθαρσία의 의미 범위
  chosen_reading: 인간은 죽음과 부패에 종속되지 않도록 창조되었다는 뜻을 살려 ‘썩지 않음’으로 옮겼습니다.
  alternative_readings:
  - 불멸
  - 영원성
  rationale: 이 단어는 단순한 무한 존속보다 부패·소멸의 부재를 포함하므로, 좁은 철학적 ‘불멸’보다 본문 범위가 넓은 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3, 6
- issue: τῆς ἰδίας ἰδιότητος의 난해성
  chosen_reading: ‘자기 고유한 본성’으로 옮겨 하나님과 인간의 관계를 본성의 반영이라는 방향으로 유지했습니다.
  alternative_readings:
  - 자기 고유함
  - 자기 존재
  - 자기 특질
  rationale: 이 구는 어휘상 특이하므로 직역만으로는 뜻이 흐려질 수 있어, 이미지 언어와 연결되는 ‘본성’으로 풀되 ‘고유한’으로 독특성을 남겼습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3, 6
