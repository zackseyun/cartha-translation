  - 우리의 일을 아무도 기억하지 않을 것입니다
  - 우리의 행위를 아무도 기억하지 않을 것입니다
  lexicon: BDAG
  rationale: ἔργα는 여기서 단순한 ‘일’보다 삶의 행적·행위 전체를 가리키는 반성적 표현이어서 ‘행적’을 택했습니다.
- source_word: ὁ βίος ἡμῶν
  english_pob_choice: our life
  chosen_korean: 우리의 삶
  alternatives_korean:
  - 우리의 생애
  - 우리의 인생
  lexicon: BDAG
  rationale: βίος의 생애적 의미를 현대 한국어에서 가장 자연스럽게 전달하는 표현으로 ‘삶’을 선택했습니다.
- source_word: ἴχνη νεφέλης / ὁμίχλη
  english_pob_choice: the trace of a cloud / mist
  chosen_korean: 구름의 흔적처럼 … 안개처럼
  alternatives_korean:
  - 구름의 자취처럼 … 안개처럼
  - 구름의 흔적처럼 … 엷은 안개처럼
  lexicon: LSJ
  rationale: ἴχνη의 ‘자취/흔적’ 이미지를 살리고, ὁμίχλη는 ‘안개’로 옮겨 시적 대비를 유지했습니다.
theological_decisions:
- issue: 인간 삶의 덧없음을 비유하는 연속적 자연 이미지
  chosen_reading: 문장 구조를 두 개의 병렬 비유로 유지하여, 기억의 소멸과 삶의 소멸이 각각 ‘구름의 흔적’과 ‘안개’ 이미지로 강화되도록 했습니다.
  alternative_readings:
  - 한 문장으로 압축해 덧없음만 일반화하는 읽기
  - ‘사라진다’처럼 존재 소멸을 더 강하게 해석하는 읽기
  rationale: 본문은 지혜문학 특유의 관찰적 비유를 누적해 덧없음을 보여 주므로, 이미지의 연쇄를 보존하는 것이 가장 충실합니다.
  doctrine_reference: Wisdom literature; human mortality and transience
