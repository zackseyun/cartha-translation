base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/004.yaml
  text: and our name will be forgotten in time[a], and no one will remember our works; and our life will pass by like the trace of a cloud, and will be scattered like mist[b], driven off by the sun’s rays and weighed down by its heat.
  footnotes:
  - marker: a
    text: Or 'the trace of a cloud' for ἴχνη νεφέλης; the image is of a fleeting mark that quickly vanishes.
    reason: lexical_alternative
  - marker: b
    text: Or 'pass away' for παρελεύσεται, though 'pass by' better preserves the movement imagery of the Greek simile.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 우리의 이름은 때가 되면 잊혀지고, 우리의 행적을 아무도 기억하지 않을 것입니다. 우리의 삶은 구름의 흔적처럼 지나가고, 햇살에 쫓기고 그 열기에 눌린 안개처럼 흩어질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구름의 흔적’은 ἴχνη νεφέλης의 문자적 이미지로, 잠깐 남았다가 곧 사라지는 자취를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘안개’는 ὁμίχλη의 일반적 대응어로, 태양광과 열기에 흩어지는 엷은 수증기 이미지를 살립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιλησθήσεται ἐν χρόνῳ
  english_pob_choice: will be forgotten in time
  chosen_korean: 때가 되면 잊혀지고
  alternatives_korean:
  - 시간이 지나면 잊히고
  - 결국 잊혀지고
  lexicon: BDAG; LSJ
  rationale: 수동 미래의 ‘잊혀지다’를 자연스럽게 살리면서, ἐν χρόνῳ의 일반적 시간 경과를 ‘때가 되면’으로 옮겼습니다.
- source_word: μνημονεύσει τῶν ἔργων ἡμῶν
  english_pob_choice: will remember our works
  chosen_korean: 우리의 행적을 아무도 기억하지 않을 것입니다
  alternatives_korean:
  - 우리의 일을 아무도 기억하지 않을 것입니다
  - 우리의 행위를 아무도 기억하지 않을 것입니다
  lexicon: BDAG
  rationale: ἔργα는 여기서 단순한 ‘일’보다 삶의 행적·행위 전체를 가리키는 반성적 표현이어서 ‘행적’을 택했습니다.
- source_word: ὁ βίος ἡμῶν
  english_pob_choice: our life
  chosen_korean: 우리의 삶
  alternatives_korean:
  - 우리의 생애
  - 우리의 인생
  lexicon: BDAG
  rationale: βίος의 생애적 의미를 현대 한국어에서 가장 자연스럽게 전달하는 표현으로 ‘삶’을 선택했습니다.
- source_word: ἴχνη νεφέλης / ὁμίχλη
  english_pob_choice: the trace of a cloud / mist
  chosen_korean: 구름의 흔적처럼 … 안개처럼
  alternatives_korean:
  - 구름의 자취처럼 … 안개처럼
  - 구름의 흔적처럼 … 엷은 안개처럼
  lexicon: LSJ
  rationale: ἴχνη의 ‘자취/흔적’ 이미지를 살리고, ὁμίχλη는 ‘안개’로 옮겨 시적 대비를 유지했습니다.
theological_decisions:
- issue: 인간 삶의 덧없음을 비유하는 연속적 자연 이미지
  chosen_reading: 문장 구조를 두 개의 병렬 비유로 유지하여, 기억의 소멸과 삶의 소멸이 각각 ‘구름의 흔적’과 ‘안개’ 이미지로 강화되도록 했습니다.
  alternative_readings:
  - 한 문장으로 압축해 덧없음만 일반화하는 읽기
  - ‘사라진다’처럼 존재 소멸을 더 강하게 해석하는 읽기
  rationale: 본문은 지혜문학 특유의 관찰적 비유를 누적해 덧없음을 보여 주므로, 이미지의 연쇄를 보존하는 것이 가장 충실합니다.
  doctrine_reference: Wisdom literature; human mortality and transience
