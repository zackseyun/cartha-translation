  text: For our life is the passing of a shadow, and there is no turning back from our end, because it has been sealed, and no one returns.
translation:
  language: ko
  text: 우리의 삶은 그림자의 지나감과 같으며, 우리의 끝에서 되돌아올 수 없습니다. 그것은 봉인되었고, 아무도 돌아오지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그림자의 지나감’입니다. 삶의 덧없음과 짧음을 드러내는 은유입니다.
    reason: source_note
  - marker: b
    text: 원문의 수동형은 결과가 확정된 상태를 나타냅니다.
    reason: source_note
lexical_decisions:
- source_word: σκιᾶς γὰρ πάροδος
  english_pob_choice: the passing of a shadow
  chosen_korean: 그림자의 지나감
  alternatives_korean:
  - 그림자의 스침
  - 그림자처럼 지나감
  - 그림자 같은 지나감
  lexicon: σκιᾶς=그림자, πάροδος=지나감/통과
  rationale: 원문의 은유를 그대로 살리되, 자연스러운 현대 한국어 명사구로 옮겨 삶의 덧없음과 일시성을 분명히 드러냈습니다.
- source_word: οὐκ ἔστιν ἀναποδισμὸς τῆς τελευτῆς ἡμῶν
  english_pob_choice: there is no turning back from our end
  chosen_korean: 우리의 끝에서 되돌아올 수 없습니다
  alternatives_korean:
  - 우리의 끝에서 되돌릴 수 없습니다
  - 우리의 죽음에서 되돌아갈 수 없습니다
  - 우리의 종말에서 되돌릴 길이 없습니다
  lexicon: ἀναποδισμός=되돌아옴/되돌림 없음, τελευτή=끝/종말/죽음
  rationale: ἀναποδισμός의 방향성 없는 ‘되돌아감 없음’을 살려, 문맥상 죽음/종결 이후의 불가역성을 한국어로 자연스럽게 표현했습니다.
- source_word: κατεσφραγίσθη
  english_pob_choice: it has been sealed
  chosen_korean: 그것은 봉인되었고
  alternatives_korean:
  - 그것은 인봉되었고
  - 그것은 봉해졌고
  - 그것은 잠겨 있고
  lexicon: σφραγίζω=봉인하다/인봉하다
  rationale: 법적·결정적 완료감을 지닌 수동 완료로 이해하여 ‘봉인되었고’로 옮겼습니다. ‘인봉’보다 일반 독자가 바로 이해하기 쉬운 표현을 택했습니다.
- source_word: οὐδεὶς ἀναστρέφει
  english_pob_choice: no one returns
  chosen_korean: 아무도 돌아오지 않습니다
  alternatives_korean:
  - 아무도 되돌아오지 않습니다
  - 아무도 다시 돌아가지 않습니다
  - 아무도 되돌아오지 못합니다
  lexicon: ἀναστρέφω=돌아오다/되돌아가다
  rationale: EN POB의 최종 수정인 ‘returns’를 반영해, 단순하고 직접적인 종결 진술로 마무리했습니다.
theological_decisions:
- issue: 인간 삶의 덧없음과 죽음의 불가역성
  chosen_reading: 본문은 삶을 ‘그림자의 지나감’으로 규정하고, 끝 이후의 복귀 불가능성을 단정적으로 말합니다.
  alternative_readings:
  - 삶의 허무를 강조하는 일반적 지혜 문장으로 완화하기
  - 죽음 이후의 상태를 모호하게 처리하기
  rationale: 지혜문학 특유의 강한 허무감과 종결성을 약화시키지 않고, 본문의 직설적 경고를 그대로 전달하는 것이 원문의 의도에 더 가깝습니다.
  doctrine_reference: Wisdom literature; mortality theme
