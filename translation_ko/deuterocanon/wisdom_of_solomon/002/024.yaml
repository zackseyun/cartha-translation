base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/024.yaml
  text: But through the devil’s envy death entered into the world[a], and those who belong to his portion test it.
  footnotes:
  - marker: a
    text: Or more literally, 'those who are of his portion test it/him.' The Greek idiom is difficult; the sense is likely that those aligned with the devil come under death's power.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 마귀의 시기 때문에 죽음이 세상에 들어왔고, 그의 몫에 속한 자들은 그것을 시험합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 몫에 속한 자들이 그것/그를 시험합니다’입니다. 그리스어 관용구가 어려우며, 뜻은 마귀와 결탁한 자들이 죽음의 권세 아래 든다는 쪽일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: φθόνῳ
  english_pob_choice: through ... envy
  chosen_korean: 시기 때문에
  alternatives_korean:
  - 시기를 통해
  - 시기로 말미암아
  lexicon: BDAG
  rationale: 여격의 원인/수단 관계를 한국어로 자연스럽게 살리면서, 본문의 원인성을 분명하게 드러내기 위해 ‘때문에’를 택했습니다.
- source_word: διαβόλου
  english_pob_choice: the devil’s
  chosen_korean: 마귀의
  alternatives_korean:
  - 악한 자의
  - 사탄의
  lexicon: BDAG
  rationale: 지혜문학의 문맥에서 διάβολος는 단순한 ‘비방자’보다 인격적 악의 존재를 가리키므로, 한국어 성경 용례에 널리 맞는 ‘마귀’로 옮겼습니다.
- source_word: εἰσῆλθεν εἰς τὸν κόσμον
  english_pob_choice: entered into the world
  chosen_korean: 세상에 들어왔고
  alternatives_korean:
  - 세상에 들어갔고
  - 세상 안으로 들어왔고
  lexicon: BDAG
  rationale: ‘세상’은 κόσμος의 문맥상 자연스러운 대응이며, εισέρχομαι의 이동 이미지를 살리되 문장 흐름을 부드럽게 하기 위해 ‘들어왔고’로 옮겼습니다.
- source_word: πειράζουσιν αὐτόν
  english_pob_choice: test it
  chosen_korean: 그것을 시험합니다
  alternatives_korean:
  - 그것을 유혹합니다
  - 그를 시험합니다
  - 그것을 경험합니다
  lexicon: BDAG
  rationale: 영어 주석이 지적하듯 이 표현은 직역 시 난해하므로, 동사 πειράζω의 기본 의미를 살려 ‘시험하다’로 두되, 목적어는 앞의 죽음을 가리키는 대명사로 보아 ‘그것을’로 처리했습니다.
- source_word: οἱ τῆς ἐκείνου μερίδος ὄντες
  english_pob_choice: those who belong to his portion
  chosen_korean: 그의 몫에 속한 자들
  alternatives_korean:
  - 그의 편에 속한 자들
  - 그의 몫에 있는 자들
  - 그의 분깃에 속한 자들
  lexicon: BDAG
  rationale: μερίς는 몫, 분깃, 몫으로 배정된 몫을 뜻하므로, 직역성을 유지하면서도 한국어에서 이해 가능한 ‘몫에 속한 자들’로 옮겼습니다.
theological_decisions:
- issue: διάβολος의 위상
  chosen_reading: 인격적 악의 존재인 ‘마귀’로 번역했습니다.
  alternative_readings:
  - 일반적인 ‘비방자’로 번역
  - ‘사탄’으로 번역
  rationale: 본문은 죽음의 세계 진입 원인을 특정한 악한 존재의 시기로 제시하므로, 지혜문학 문맥에 맞게 인격적 존재를 분명히 드러내는 번역이 필요했습니다.
  doctrine_reference: 원문 우선 원칙; 지혜서 2:24의 악의 기원 진술
- issue: πειράζουσιν αὐτόν의 난해성
  chosen_reading: 죽음에 대한 능동적 ‘시험’으로 두었습니다.
  alternative_readings:
  - ‘그것을 경험합니다’로 완화
  - ‘그를 시험합니다’로 인격화
  rationale: 그리스어 표현은 직역만으로는 어색하므로, 본문이 허용하는 범위에서 가장 직접적인 의미를 유지하되 주석으로 해석상의 어려움을 보존했습니다.
  doctrine_reference: 최적 대응 번역; 애매성을 각주로 보존
