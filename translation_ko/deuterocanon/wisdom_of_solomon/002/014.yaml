  text: He became a reproof to our thoughts[a]; even being seen is burdensome to us[b],
  footnotes:
  - marker: a
    text: Or 'He has become a rebuke to our inner reasonings.' The Greek ἔλεγχος can carry the sense of exposing fault, and ἐννοίαι can mean inward thoughts or reasonings.
