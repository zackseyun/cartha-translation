  source_fidelity: 핵심 의미는 대체로 충실하지만, ‘생각에 대한 책망’은 ἐννοιῶν의 속격이 나타내는 ‘그들의 생각을 드러내고 책망함’을 다소 부자연스럽고 모호하게 전달합니다. 또한 βαρύς를 ‘무겁습니다’로 옮긴 것은 한국어에서 비유적 의미가 충분히 살아나지 않습니다.
  naturalness: 초안은 앞 절의 평서체 ‘되었고’와 끝의 합쇼체 ‘무겁습니다’가 섞여 있습니다. ‘그를 보기만 해도 우리에게는 견디기 어렵습니다’는 현대 표준 한국어 합쇼체로 자연스럽고, ‘being seen’이 문맥상 가리키는 그의 모습/그를 보는 일을 명료하게 표현합니다.
  terminology: ἔλεγχος는 여기서 단순한 비난보다 잘못을 드러내는 책망을 뜻하므로 ‘우리의 생각을 책망하는 자’로 옮겼습니다. ἐννοίαι는 ‘생각’으로 보존했습니다. 각주 a의 ‘꾸짖는 책망’은 동어 반복이므로 ‘드러내는 책망’으로 바로잡고 그리스어 철자도 ἐννοίαι로 수정했습니다.
