translation:
  language: ko
  text: 그는 우리의 생각에 대한 책망이 되었고[a] — 보이기만 해도 우리에게는 무겁습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 우리 내면의 추론을 꾸짖는 책망이 되었습니다.’ ἔλεγχος는 잘못을 드러내는 책망이나 폭로의 뜻을 가질 수 있고, ἐννοιαι는 내적 생각이나 추론을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그리고 보이기만 해도 우리에게는 무겁습니다’입니다. 곧 그의 모습이나 존재 자체가 그들에게 견디기 어렵다는 뜻입니다.
    reason: lexical_alternative
