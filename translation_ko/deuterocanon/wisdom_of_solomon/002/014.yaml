    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘보이기만 해도 우리에게는 무겁습니다’입니다. 곧 그를 보는 것, 또는 그의 모습과 존재 자체가 그들에게 견디기 어렵다는 뜻입니다.
