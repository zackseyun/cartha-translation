lexical_decisions:
- source_word: ἴδωμεν
  english_pob_choice: Let us see
  chosen_korean: 보자
  alternatives_korean:
  - 살펴보자
  - 알아보자
  lexicon: LSJ
  rationale: 첫인칭 복수 권유법의 도전적 뉘앙스를 살리면서 한국어로도 자연스러운 권유형으로 옮겼습니다.
- source_word: οἱ λόγοι αὐτοῦ
  english_pob_choice: his words
  chosen_korean: 그의 말이
  alternatives_korean:
  - 그의 말들
  - 그의 발언이
  lexicon: LSJ
  rationale: λόγοι는 ‘말들/발언’이 될 수 있지만, 문맥상 그의 주장 전체를 가리키므로 ‘그의 말’이 가장 간결하고 본문에 가깝습니다.
- source_word: ἀληθεῖς
  english_pob_choice: 'true'
  chosen_korean: 참된지
  alternatives_korean:
  - 진실한지
  - 옳은지
  lexicon: LSJ
  rationale: 말의 진위 여부를 묻는 형식이므로 ‘참되다’로 옮겨 내용의 참/거짓 판단을 분명히 했습니다.
- source_word: τὰ ἐν ἐκβάσει αὐτοῦ
  english_pob_choice: what will happen at his end
  chosen_korean: 그의 마지막에 무슨 일이 일어날지
  alternatives_korean:
  - 그의 결과가 어떨지
  - 그의 종말에 어떤 결과가 있을지
  - 그의 끝에 무엇이 이를지
  lexicon: LSJ
  rationale: ἐκβάσις의 ‘결과/종결’ 범위를 살리되, 한국어에서 어색한 직역을 피하면서도 최종 결과를 시험한다는 뜻이 드러나게 했습니다.
theological_decisions:
- issue: ἐκβάσις의 의미 범위
  chosen_reading: ‘마지막에 무슨 일이 일어날지’로 옮겨 최종 결과와 종결의 의미를 함께 남겼습니다.
  alternative_readings:
  - ‘그의 결과를’
  - ‘그의 끝을’
  rationale: 이 절은 의인의 말이 마지막에 사실로 드러나는지 시험하려는 조롱 섞인 발화이므로, 결과/종말의 긴장을 해소하지 않고 보존하는 것이 적절합니다.
  doctrine_reference: 의인의 최종 입증과 조롱의 문맥을 본문 수준에서 유지합니다.
