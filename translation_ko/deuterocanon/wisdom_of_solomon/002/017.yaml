  rationale: 원문의 두 1인칭 복수 권유법을 합쇼체 ‘봅시다/시험해 봅시다’로 일관되게 옮겼습니다. ‘최후’는 ἐκβάσις가 지닌 끝과 결과의 함의를 본문에서 유지하고, 각주는 결과라는 대안적 이해를 명시합니다. 본문의 조롱하고 시험하려는 발화의 어조와 원문의 의미상 여지는 바꾸지 않았습니다.
