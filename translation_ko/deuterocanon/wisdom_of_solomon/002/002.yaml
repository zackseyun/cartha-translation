  text: because we came into being by mere chance, and after this we will be as though we had not existed; because the breath in our nostrils is smoke, and reason is a spark in the beating of our heart,
translation:
  language: ko
  text: 우리가 우연히 생겨났고, 그 뒤에는 존재하지 않았던 것처럼 될 것이기 때문입니다. 입속의 숨은 연기이며, 마음이 뛰는 가운데의 이성은 한 불꽃이기 때문입니다.
  philosophy: formal
lexical_decisions:
- source_word: αὐτοσχεδίως ἐγενήθημεν
  english_pob_choice: we came into being by mere chance
  chosen_korean: 우리가 우연히 생겨났고
  alternatives_korean:
  - 우리가 뜻없이 생겨났고
  - 우리가 단지 우연으로 존재하게 되었고
  lexicon: αὐτοσχεδίως
  rationale: 우연성과 무목적성을 함께 드러내는 표현으로 옮겨, POB의 ‘mere chance’가 가진 인과적 공허함을 유지했습니다.
- source_word: ἐσόμεθα ὡς οὐχ ὑπάρξαντες
  english_pob_choice: we will be as though we had not existed
  chosen_korean: 그 뒤에는 존재하지 않았던 것처럼 될 것입니다
  alternatives_korean:
  - 그 뒤에는 없었던 것처럼 될 것입니다
  - 그 뒤에는 마치 존재하지 않았던 자처럼 될 것입니다
  lexicon: ὡς οὐχ ὑπάρξαντες
  rationale: ‘존재하지 않았던 것처럼’의 소멸감을 살리되, 한국어 문장 흐름에 맞게 미래 시제를 분명히 했습니다.
- source_word: καπνὸς ἡ πνοὴ ἐν ῥισὶν ἡμῶν
  english_pob_choice: the breath in our nostrils is smoke
  chosen_korean: 입속의 숨은 연기이며
  alternatives_korean:
  - 콧속의 숨은 연기이며
  - 우리 콧구멍 속의 숨은 연기이며
  lexicon: πνοή / ῥίς
  rationale: ῥισίν을 문자적으로는 ‘콧구멍’으로 옮길 수 있으나, 한국어에서 다소 거칠어지는 점을 고려해 ‘입속의 숨’으로 자연스럽게 처리하되, 숨의 덧없음을 유지했습니다.
- source_word: ὁ λόγος σπινθὴρ ἐν κινήσει καρδίας ἡμῶν
  english_pob_choice: reason is a spark in the beating of our heart
  chosen_korean: 마음이 뛰는 가운데의 이성은 한 불꽃이기 때문입니다
  alternatives_korean:
  - 심장이 뛰는 가운데의 이성은 한 불꽃이기 때문입니다
  - 우리 마음의 박동 속에서 이성은 한 불꽃이기 때문입니다
  lexicon: λόγος
  rationale: 이 항목의 POB 개정이 ‘speech’에서 ‘reason’으로 되돌아간 점을 반영해, λόγος를 문맥상 ‘이성’으로 옮겼습니다.
theological_decisions:
- issue: 인간 생명의 우연성과 허무에 대한 지혜문학적 진술
  chosen_reading: 이 구절은 인간 존재가 우연히 시작되고 곧 소멸한다는 회의적 발화를 직접적으로 제시합니다.
  alternative_readings:
  - 단순한 허무주의 일반 진술로 완화하는 읽기
  - 도덕적 교훈으로만 축소하는 읽기
  rationale: 원문과 POB가 모두 강한 허무의 언어를 유지하므로, 이를 완화하지 않고 그대로 드러냈습니다.
  doctrine_reference: 지혜문학의 수사와 인간 유한성에 대한 성경적 증언
- issue: λόγος의 번역
  chosen_reading: 여기서 λόγος는 단순한 ‘말’이 아니라 인간 내면의 분별력/이성으로 이해했습니다.
  alternative_readings:
  - 말
  - 말씀
  - 언어
  rationale: POB의 최종 수정이 ‘reason’을 확정하고 있으므로, 문맥상 내적 판단 능력을 가리키는 뜻을 반영했습니다.
  doctrine_reference: 인간 이성에 대한 지혜문학적 표현
