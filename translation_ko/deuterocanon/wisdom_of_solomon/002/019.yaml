  source_fidelity: ‘모욕과 고문으로 그를 시험해 보자’는 ὕβρει καὶ βασάνῳ ἐτάσωμεν αὐτόν을 충실히 옮깁니다. 그러나 ἀνεξικακία를 단순히 ‘관용’으로 옮기면, 해를 입고도 참아 내는 뜻이 약해집니다. 또한 δικάσωμεν의 ‘판단·가늠하다’라는 뜻에 비해 ‘심판해 보자’는 유죄 판결이나 처벌의 의미를 불필요하게 강하게 만듭니다.
