  terminology: ἐπιείκεια의 ‘온유함’은 유지할 수 있습니다. ἀνεξικακία는 ‘해를 참는지’로 풀어, 부당한 해악을 인내하며 보복하지 않는 의미를 드러냈습니다. δικάζω는 여기서 ‘심판하다’보다 ‘판단하다’가 적절합니다.
  issues:
