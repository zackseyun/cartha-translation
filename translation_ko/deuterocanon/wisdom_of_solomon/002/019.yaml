  text: Let us test him with insolence and torture[b][a], so that we may know his gentleness and test his forbearance.
  footnotes:
  - marker: a
    text: Or 'with outrage and torment.' The Greek terms can denote abusive insolence and painful torment used as a means of testing.
    reason: lexical_alternative
  - marker: b
    text: Or 'assess his patience in bearing wrong.' The final noun refers specifically to enduring injury without retaliation.
    reason: lexical_alternative
translation:
  language: ko
  text: 모욕과 고문으로 그를 시험해 보자. 그래서 그의 온유함을 알고 그의 관용을 심판해 보자.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὕβρει
  english_pob_choice: with insult
  chosen_korean: 모욕으로
  alternatives_korean:
  - 능욕으로
  - 폭언으로
  - 오만한 모욕으로
  lexicon: LSJ
  rationale: ὕβρις는 단순한 ‘모욕’보다 더 공격적이고 수치심을 주는 가해를 가리키므로, 한국어에서는 핵심 의미를 자연스럽게 살려 ‘모욕으로’로 옮겼습니다.
- source_word: βασάνῳ
  english_pob_choice: and torture
  chosen_korean: 고문으로
  alternatives_korean:
  - 고통으로
  - 심문으로
  - 고통스러운 고문으로
  lexicon: LSJ
  rationale: βάσανος는 시험의 수단으로 쓰이는 가혹한 고문·고통을 뜻하므로, 뒤의 ‘시험하다’와 중복되지 않게 구체적 수단을 드러내는 ‘고문으로’가 적절합니다.
- source_word: ἐτάσωμεν
  english_pob_choice: Let us test
  chosen_korean: 시험해 보자
  alternatives_korean:
  - 검증해 보자
  - 살펴보자
  - 떠보자
  lexicon: LSJ
  rationale: 호르타토리 접속법은 제안형 명령을 이루므로, 문맥의 ‘검증’보다 직접적인 ‘시험해 보자’가 원문의 의도와 긴장을 잘 보존합니다.
- source_word: ἐπιείκειαν
  english_pob_choice: gentleness
  chosen_korean: 온유함
  alternatives_korean:
  - 관용
  - 유순함
  - 너그러움
  lexicon: LSJ
  rationale: ἐπιείκεια는 부드럽고 양보하는 성품을 가리키므로, 신약적·지혜문학적 어감도 살리는 ‘온유함’이 가장 자연스럽습니다.
- source_word: ἀνεξικακίαν
  english_pob_choice: forbearance
  chosen_korean: 관용
  alternatives_korean:
  - 악을 참음
  - 원망하지 않음
  - 인내
  lexicon: LSJ
  rationale: ἀνεξικακία는 해를 입어도 되갚지 않고 참아 내는 태도를 가리키므로, 넓은 ‘인내’보다 ‘관용’이 여기의 윤리적 뉘앙스를 더 잘 담습니다.
theological_decisions:
- issue: 두 덕목의 병렬 표현을 한국어에서 어떻게 구분할지
  chosen_reading: ἐπιείκεια를 ‘온유함’, ἀνεξικακία를 ‘관용’으로 구분해 번역했습니다.
  alternative_readings:
  - ‘온유함’과 ‘인내’
  - ‘너그러움’과 ‘오래 참음’
  rationale: 이 구절은 고난 아래 드러나는 두 가지 관련되지만 다른 성품을 병렬로 제시하므로, 한국어에서도 서로 다른 단어를 유지해 수사적 대비를 보존했습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 5
