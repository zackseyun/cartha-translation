translation:
  language: ko
  text: 그분의 신비들을 알지 못했고, 거룩함의 상도 바라지 않았으며, 흠 없는 영혼들의 영예도 가치 있게 여기지 않았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '비밀들'로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '경건의 상'으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 '흠 없는 영혼들의 영예를 판단하지 않았다'에 가깝습니다. 한국어에서는 그 압축된 의미를 풀어 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήρια
  english_pob_choice: mysteries
  chosen_korean: 신비들
  alternatives_korean:
  - 비밀들
  - 숨은 일들
  lexicon: BDAG
  rationale: μυστήρια는 감추어진 실재나 비밀을 가리키므로, POB의 'mysteries'에 맞춰 '신비들'로 옮겨 어감과 신학적 무게를 살렸습니다.
- source_word: μισθὸν ἤλπισαν ὁσιότητος
  english_pob_choice: the reward of holiness
  chosen_korean: 거룩함의 상
  alternatives_korean:
  - 경건의 상
  - 거룩함의 보상
  lexicon: LSJ
  rationale: ὁσιότης는 단순 외적 경건보다 거룩함/경건한 올바름의 의미가 있어, 직역적으로 '거룩함의 상'으로 옮겨 보상 개념을 유지했습니다.
- source_word: ἔκριναν γέρας
  english_pob_choice: did they consider worthy of honor
  chosen_korean: 영예도 가치 있게 여기지 않았습니다
  alternatives_korean:
  - 영예로 여기지 않았습니다
  - 존귀하게 판단하지 않았습니다
  lexicon: BDAG
  rationale: γέρας는 '영예, 상, 존귀의 표'를 뜻하고 ἔκριναν이 평가의 동사를 이루므로, 한국어에서는 '가치 있게 여기다'로 풀어 평가 판단의 뜻을 자연스럽게 드러냈습니다.
- source_word: ψυχῶν ἀμώμων
  english_pob_choice: blameless souls
  chosen_korean: 흠 없는 영혼들
  alternatives_korean:
  - 흠 없는 사람들
  - 책망할 것 없는 영혼들
  lexicon: BDAG
  rationale: ψυχή는 여기서 삶/인격보다 영혼의 종말론적 울림이 강하므로 '영혼들'을 택했고, ἀμώμων은 도덕적 결함 없음의 뜻을 살려 '흠 없는'으로 옮겼습니다.
