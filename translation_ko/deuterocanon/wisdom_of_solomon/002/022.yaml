  rationale: 그리스어 대명사 αὐτοῦ를 그대로 반영하되, 본문 문맥상 하나님을 가리키므로 한국어에서는 '그분'으로 정리했습니다. 다만 본문이 의도하는 관계성은 과도하게 설명하지 않았습니다.
  doctrine_reference: 원문 우선 원칙; 문맥적 지시 대상 보존
