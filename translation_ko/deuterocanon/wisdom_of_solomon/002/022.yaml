translation:
  language: ko
  text: 그분의 신비들[a]을 알지 못했고, 거룩함에 대한 상[b]을 바라지도 않았으며, 흠 없는 영혼들이 영예를 받을 만하다고 판단하지도 않았습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘비밀들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘경건에 대한 상’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘흠 없는 영혼들의 영예를 판단하지 않았다’에 가깝습니다. 그리스어의 압축된 표현을 한국어에서 풀어 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήρια
  english_pob_choice: mysteries
  chosen_korean: 신비들
  alternatives_korean:
