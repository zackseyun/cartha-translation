  rationale: 공동체적 권면형 표현을 살리면서, 공격 방법을 지나치게 구체화하지 않는 ‘매복하여 기다리다’가 그리스어의 음모적 뉘앙스를 잘 드러냅니다.
- source_word: τὸν δίκαιον
  english_pob_choice: the righteous man
  chosen_korean: 의인
  alternatives_korean:
  - 의로운 사람
  - 의로운 자
  - 그 의인
  lexicon: LSJ
  rationale: 단수 정관사는 대표적 인물을 가리킬 수 있으므로, 한국어에서는 간결한 ‘의인’이 가장 자연스럽고 성별 표지도 유지합니다.
- source_word: ἁμαρτήματα παιδείας ἡμῶν
  english_pob_choice: sins against our training
  chosen_korean: 우리 교육의 죄
  alternatives_korean:
  - 우리 양육의 죄
  - 우리 훈육의 죄
  - 우리 훈련의 죄
  lexicon: LSJ
  rationale: παιδεία는 단순한 학교 교육보다 도덕적 형성·양육의 뜻이 강하므로, 합쇼체 문맥에서 가장 무난한 ‘교육’을 택하되 원문의 압축된 구조를 살렸습니다.
- source_word: ὀνειδίζει
  english_pob_choice: reproaches
  chosen_korean: 꾸짖고
  alternatives_korean:
  - 책망하고
  - 비난하고
  - 모욕하고
  lexicon: LSJ
  rationale: 법적 비난과 도덕적 질책이 함께 있는 문맥에서 ‘꾸짖다’가 감정적·윤리적 질책을 잘 담습니다.
