    rationale: ἁμαρτήματα παιδείας ἡμῶν은 교육 자체가 저지른 죄라는 뜻이 아니라, 화자들이 받은 교육·양육·훈육을 거스른 죄를 가리킵니다. 현 표현은 이 관계를 불명확하게 합니다.
