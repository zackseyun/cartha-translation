  text: But let us lie in wait for the righteous man, because he is troublesome to us and opposes our deeds, and reproaches us for sins against the law, and charges us with sins against our training.
  footnotes:
  - marker: a
    text: Or 'the righteous one.' The Greek singular can denote a representative righteous person.
    reason: lexical_alternative
  - marker: b
    text: Or 'charges us with offenses against our upbringing/discipline.' The Greek παιδεία can mean training, upbringing, or discipline.
    reason: lexical_alternative
translation:
  language: ko
  text: 자, 의인을[a] 노려 숨어 기다립시다. 그는 우리에게 성가시며 우리의 행위에 맞서고, 율법을 거스른 죄를 들어 우리를 꾸짖으며, 우리가 받은 교육[b]을 거스른 죄를 들어 우리를 비난합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “의로운 사람.” 그리스어 단수는 대표적인 의인을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “양육”, “훈육”. 그리스어 παιδεία는 교육, 양육, 훈육의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
