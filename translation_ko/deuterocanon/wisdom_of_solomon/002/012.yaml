  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/012.yaml
  text: But let us lie in wait for the righteous man, because he is troublesome to us and opposes our deeds, and reproaches us for sins against the law, and charges us with sins against our training.
  footnotes:
  - marker: a
    text: Or 'the righteous one.' The Greek singular can denote a representative righteous person.
    reason: lexical_alternative
  - marker: b
    text: Or 'charges us with offenses against our upbringing/discipline.' The Greek παιδεία can mean training, upbringing, or discipline.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 우리로 하여금 의인을 매복하여 기다리게 합시다. 그는 우리에게 거슬리고 우리의 행위에 맞서며, 율법을 어긴 죄를 우리에게 꾸짖고, 우리 교육의 죄를 우리에게 책망합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “의로운 사람.” 그리스어 단수는 대표적 의인을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “우리 양육/훈육의 죄.” 그리스어 παιδεία는 양육, 훈육, 교육의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεδρεύσωμεν
  english_pob_choice: let us lie in wait
  chosen_korean: 매복하여 기다리게 합시다
  alternatives_korean:
  - 숨어 기다리게 합시다
  - 함정을 놓게 합시다
  - 기습하게 합시다
  lexicon: LSJ
  rationale: 공동체적 권면형 표현을 살리면서, 공격 방법을 지나치게 구체화하지 않는 ‘매복하여 기다리다’가 그리스어의 음모적 뉘앙스를 잘 드러냅니다.
- source_word: τὸν δίκαιον
  english_pob_choice: the righteous man
  chosen_korean: 의인
  alternatives_korean:
  - 의로운 사람
  - 의로운 자
  - 그 의인
  lexicon: LSJ
  rationale: 단수 정관사는 대표적 인물을 가리킬 수 있으므로, 한국어에서는 간결한 ‘의인’이 가장 자연스럽고 성별 표지도 유지합니다.
- source_word: ἁμαρτήματα παιδείας ἡμῶν
  english_pob_choice: sins against our training
  chosen_korean: 우리 교육의 죄
  alternatives_korean:
  - 우리 양육의 죄
  - 우리 훈육의 죄
  - 우리 훈련의 죄
  lexicon: LSJ
  rationale: παιδεία는 단순한 학교 교육보다 도덕적 형성·양육의 뜻이 강하므로, 합쇼체 문맥에서 가장 무난한 ‘교육’을 택하되 원문의 압축된 구조를 살렸습니다.
- source_word: ὀνειδίζει
  english_pob_choice: reproaches
  chosen_korean: 꾸짖고
  alternatives_korean:
  - 책망하고
  - 비난하고
  - 모욕하고
  lexicon: LSJ
  rationale: 법적 비난과 도덕적 질책이 함께 있는 문맥에서 ‘꾸짖다’가 감정적·윤리적 질책을 잘 담습니다.
theological_decisions:
- issue: 의인 단수의 대표성
  chosen_reading: 의인
  alternative_readings:
  - 의로운 사람
  - 의로운 자
  rationale: 이 단수는 특정 한 사람을 넘어서 대표적 의인을 가리킬 수 있으므로, 한국어에서도 그 대표성을 유지하면서 과도한 해석을 덧붙이지 않았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: παιδεία의 도덕적 형성 의미
  chosen_reading: 우리 교육
  alternative_readings:
  - 우리 양육
  - 우리 훈육
  - 우리 훈련
  rationale: 문맥상 문제 되는 것은 단순 지식이 아니라 도덕적으로 형성된 삶의 기준이므로, ‘교육’으로 옮겨 그 형성적 의미를 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
