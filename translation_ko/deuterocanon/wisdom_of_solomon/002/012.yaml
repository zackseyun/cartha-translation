- from: 그러므로 우리로 하여금 의인을 매복하여 기다리게 합시다. 그는 우리에게 거슬리고 우리의 행위에 맞서며, 율법을 어긴 죄를 우리에게 꾸짖고, 우리 교육의 죄를 우리에게 책망합니다.[a][b]
  to: 자, 의인을[a] 노려 숨어 기다립시다. 그는 우리에게 성가시며 우리의 행위에 맞서고, 율법을 거스른 죄를 들어 우리를 꾸짖으며, 우리가 받은 교육[b]을 거스른 죄를 들어 우리를 비난합니다.
  rationale: 직접 권면형을 자연스러운 합쇼체로 고치고, δέ에 없는 인과 관계를 제거했습니다. 특히 παιδεία의 속격 관계를 ‘우리가 받은 교육을 거스른 죄’로 풀어 원문의 도덕적 형성 의미와 고발 구조를 보존했습니다. 각주 표지는 각각 ‘의인’과 ‘교육’에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:58:38Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 ἐνεδρεύσωμεν의 공모적 권면과 τὸν δίκαιον의 단수성을 대체로 반영합니다. 그러나 “그러므로”는 단순 접속사 δέ보다 강하며, “우리로 하여금 … 하게 합시다”는 1인칭 복수 권면형을 불필요하게 우회합니다. 또한 “우리 교육의 죄”는 παιδείας ἡμῶν의 관계를 한국어에서 부자연스럽고 모호하게 만들며, 원문의 ‘자신들이 받은 도덕적 형성/교육을 거스른 죄’라는 뜻을 충분히 드러내지 못합니다.
  naturalness: “의인을 매복하여 기다리게 합시다”는 자연스러운 현대 한국어 권면 표현이 아닙니다. “의인을 노려 숨어 기다립시다”가 음모와 매복의 뜻을 자연스럽게 보존합니다. 두 고발 구절은 “죄를 들어 우리를 …”로 옮겨, 죄가 비난의 근거라는 그리스어의 구문 관계를 명료하게 했습니다.
  terminology: ‘의인’은 대표적 단수 인물을 간결하게 나타내며 적절합니다. νόμου는 ‘율법을 거스른’, παιδεία는 문맥상 학교 교육에 한정되지 않는 도덕적 형성의 의미를 살려 ‘우리가 받은 교육’을 사용했습니다. ‘교육’의 넓은 형성적 의미는 각주에서 양육·훈육이라는 대안을 제시하여 보완합니다.
