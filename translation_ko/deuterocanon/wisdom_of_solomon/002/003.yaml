translation:
  language: ko
  text: 그것이 꺼지면 몸은 재가 되고, 영은 가벼운 공기처럼 흩어집니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘숨’ 또는 ‘생기’로도 옮길 수 있습니다. 여기서 그리스어 πνεῦμα는 두 의미를 모두 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘엷은 공기처럼’에 가깝습니다. 이 표현은 실체가 희미하고 곧 흩어지는 상태를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ σβεσθέντος
  english_pob_choice: when it is extinguished
  chosen_korean: 그것이 꺼지면
  alternatives_korean:
