  - 영혼으로 옮겨 불멸의 실체를 암시할 수 있습니다.
  rationale: 이 문맥은 몸/πνεῦμα 대조와 소멸 이미지를 함께 제시하므로, 후대 교리로 단정하지 않고 본문이 말하는 소멸감을 그대로 남겨 두는 것이 적절합니다.
  doctrine_reference: 본문의 긴장 보존
