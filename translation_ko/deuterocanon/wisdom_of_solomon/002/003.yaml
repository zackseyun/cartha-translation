- source_word: τὸ πνεῦμα
  english_pob_choice: the spirit
  chosen_korean: 영
  alternatives_korean:
  - 숨
  - 생기
  lexicon: LSJ
  rationale: 이 구절은 몸과 대조되는 πνεῦμα를 말하면서도 공기 비유를 뒤따르게 하므로, 영으로 옮기되 숨의 뉘앙스는 문맥 안에 남겨 두었습니다.
- source_word: ὡς χαῦνος ἀήρ
  english_pob_choice: like thin air
  chosen_korean: 가벼운 공기처럼
  alternatives_korean:
  - 엷은 공기처럼
  - 허전한 공기처럼
  lexicon: LSJ
  rationale: χαῦνος의 ‘헐거운, 엷은, 실체감이 약한’ 의미를 살려, 단순한 대기보다 ‘가벼운 공기’로 실체 없음과 흩어짐을 드러냈습니다.
