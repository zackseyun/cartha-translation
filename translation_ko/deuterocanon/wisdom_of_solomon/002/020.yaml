translation:
  language: ko
  text: 우리는 그를 수치스러운 죽음으로 정죄하자. 그가 한 말들에 따라 그를 살필 것이기 때문이다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 돌보심이 있을 것이다’, ‘그를 변호하심이 있을 것이다’, ‘그의 말들은 그에게 일어나는 일에 의해 시험될 것이다’. 그리스어 ‘visitation’은 하나님의 주목, 개입, 돌보심을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: θανάτῳ ἀσχήμονι
  english_pob_choice: a shameful death
  chosen_korean: 수치스러운 죽음
  alternatives_korean:
  - 치욕스러운 죽음
  - 불명예스러운 죽음
  - 수치의 죽음
  lexicon: LSJ
  rationale: ἀσχήμων은 체면과 명예를 해치는 수치를 뜻하므로, 현대 한국어에서 자연스럽고 의미를 보존하는 ‘수치스러운’이 적절합니다.
- source_word: καταδικάσωμεν
  english_pob_choice: Let us condemn
  chosen_korean: 우리는 ... 정죄하자
  alternatives_korean:
  - 우리는 ... 유죄 판결하자
  - 우리는 ... 선고하자
  lexicon: LSJ
  rationale: 호르타토리 가정법의 공동 제안으로서 ‘하자’가 잘 맞고, judicial force를 살리기 위해 ‘정죄하다’를 택했습니다.
- source_word: ἐπισκοπὴ
  english_pob_choice: visitation / examination
  chosen_korean: 살필 것이기 때문이다
  alternatives_korean:
  - 돌봄이 있을 것이기 때문이다
  - 권고가 있을 것이기 때문이다
  - 검사가 있을 것이기 때문이다
  lexicon: LSJ
  rationale: 본문의 ἐπισκοπή는 ‘방문’보다 재판적 맥락에서의 살핌, 조사, 돌봄, 개입의 폭을 가지므로, 원문의 긴장을 살리면서도 한국어로는 ‘살피다’가 가장 포괄적으로 대응합니다.
- source_word: ἐκ λόγων αὐτοῦ
  english_pob_choice: according to his words
  chosen_korean: 그가 한 말들에 따라
  alternatives_korean:
  - 그의 말들에 근거하여
  - 그의 말들 때문에
  - 그의 말에 따라
  lexicon: LSJ
  rationale: ἐκ + λόγων은 발화 내용이 판단의 기준이 됨을 뜻하므로, ‘그가 한 말들에 따라’가 자연스럽고 기준성을 유지합니다.
theological_decisions:
- issue: ἐπισκοπή의 의미를 한 가지로 고정할지 여부
  chosen_reading: 재판적 살핌과 그에 따른 하나님의 개입 가능성을 함께 열어 둡니다.
  alternative_readings:
  - 돌봄
  - 보호
  - 변호
  - 징벌
  - 변호를 통한 무죄 입증
  rationale: 지혜서는 의인의 말이 실제로 어떻게 입증될지 열어 두며, 본문은 그 평가를 단정하지 않습니다. 따라서 한국어 본문도 의미를 과도하게 좁히지 않고 유지합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
