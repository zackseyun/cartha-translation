  text: Let us condemn him to a shameful death[a], for there will be an examination of him according to his words.
  footnotes:
  - marker: a
    text: Or 'there will be care for him,' 'there will be vindication for him,' or 'his words will be tested by what happens to him.' The Greek 'visitation' can refer broadly to divine attention or intervention.
