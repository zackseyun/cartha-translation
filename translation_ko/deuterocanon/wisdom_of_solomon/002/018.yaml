  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/018.yaml
  text: For if the righteous man is God's son, he will help him and rescue him from the hand of those who oppose him.
  footnotes:
  - marker: a
    text: Or, 'the righteous one is a son of God' or 'the righteous one is the Son of God.' The Greek phrase can be rendered in more than one way; the main text avoids importing a later christological title while preserving the filial claim.
    reason: alternative_reading
translation:
  language: ko
  text: 그렇습니다. 의인이 하나님의 아들이라면, 하나님이 그를 도우시고 그를 대적하는 자들의 손에서 그를 건지실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘의인은 하나님의 아들이다’ 혹은 ‘의인은 하나님의 아들이다.’ 그리스어 구문은 여러 방식으로 옮길 수 있으며, 본문은 후대의 기독론적 칭호를 곧바로 도입하지 않으면서도 아들 됨의 진술을 살립니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δίκαιος
  english_pob_choice: the righteous man
  chosen_korean: 의인
  alternatives_korean:
  - 의로운 사람
  - 의로운 자
  lexicon: LSJ
  rationale: 관사 + 형용사의 실질적 용법을 살려 대표적 한 사람을 가리키는 말로 옮겼습니다. 한국어에서는 성별을 덜 드러내면서도 성경적 문체에 자연스러운 ‘의인’이 가장 간결합니다.
- source_word: υἱὸς θεοῦ
  english_pob_choice: God's son
  chosen_korean: 하나님의 아들
  alternatives_korean:
  - 하나님의 아들로
  - 하나님께 속한 아들
  lexicon: LSJ
  rationale: 직역적으로는 ‘하나님의 아들’이 원문의 친자적 표현을 가장 직접적으로 드러냅니다. 다만 문맥상 후대의 고정된 칭호를 과도하게 덧씌우지 않도록, 문장 전체는 가정법으로 처리했습니다.
- source_word: ἀντιλήμψεται
  english_pob_choice: he will help him
  chosen_korean: 그를 도우시고
  alternatives_korean:
  - 그를 붙드시고
  - 그를 붙잡아 주시고
  - 그를 도와주시고
  lexicon: BDAG
  rationale: ‘붙들다/도와주다’의 지원 의미를 한국어에서 자연스럽게 살렸습니다. 뒤의 ‘건지시다’와 병렬을 이루도록 ‘도우시고’로 간결하게 옮겼습니다.
- source_word: ῥύσεται αὐτὸν ἐκ χειρὸς
  english_pob_choice: rescue him from the hand of
  chosen_korean: 그를 … 손에서 그를 건지실 것입니다
  alternatives_korean:
  - 그를 … 손에서 구해 내실 것입니다
  - 그를 … 손에서 구원하실 것입니다
  - 그를 … 손에서 건져 내실 것입니다
  lexicon: BDAG
  rationale: ‘χειρὸς’의 관용적 표현을 ‘손에서’로 살리고, ῥύσεται는 구원의 신학적 과잉을 피하면서도 강한 구출 의미를 지닌 ‘건지다’로 옮겼습니다.
- source_word: ἀνθεστηκότων
  english_pob_choice: those who oppose him
  chosen_korean: 그를 대적하는 자들
  alternatives_korean:
  - 그와 맞서는 자들
  - 그를 거스르는 자들
  - 그를 반대하는 자들
  lexicon: LSJ
  rationale: 완료적 성격의 ‘맞서 서 있는’ 상태를 한국어 성경 문맥에서 통용되는 적대 표현인 ‘대적하다’로 전달했습니다. 이는 단순 의견 반대보다 적극적 적대성을 더 잘 드러냅니다.
theological_decisions:
- issue: υἱὸς θεοῦ의 번역에서 정식 칭호화 여부
  chosen_reading: ‘하나님의 아들’로 옮기되, 별도의 대문자/칭호 처리 없이 문맥상의 주장으로만 읽히게 했습니다.
  alternative_readings:
  - ‘하나님 아들’
  - ‘하나님의 아들(정식 칭호)’
  rationale: 원문 자체는 여기서 후대 그리스도론 용어를 강제하지 않으며, 본문은 의인에 대한 주장으로 말합니다. 따라서 문맥의 날카로움을 유지하되 교리적 선결해석은 덜어냈습니다.
  doctrine_reference: Wisdom 2:18의 문맥적 수사와 후대 기독론 독법의 구분
