    reason: cultural_note
translation:
  language: ko
  text: 자, 그러니 있는 좋은 것들을 누리고[a], 젊을 때처럼 창조 세계를[b] 힘껏 사용합시다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어를 문자적으로 옮기면 ‘존재하는 좋은 것들’입니다. 또는 ‘현재 있는 좋은 것들’이나 ‘눈앞에 있는 좋은 것들’로 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘창조된 세계’.
    reason: lexical_alternative
  - marker: c
    text: ‘젊을 때처럼’은 젊음에 따르는 기세나 거리낌 없음을 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: δεῦτε οὖν
  english_pob_choice: Come then
  chosen_korean: 그러니 이제 와서
  alternatives_korean:
