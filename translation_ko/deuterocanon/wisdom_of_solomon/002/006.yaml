  rationale: 권유형 도입부를 자연스러운 한국어로 바로잡고, σπουδαίως의 열의와 젊음의 기세를 ‘힘껏’으로 옮겼습니다. κτίσις와 두 동사 사이의 의미상 구별은 유지했으며, 각주는 본문과 중복되지 않도록 정리했습니다.
