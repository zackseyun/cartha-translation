base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/006.yaml
  text: Come then[a], let us enjoy the good things that exist, and let us make use of creation eagerly, as in youth[c][b];
  footnotes:
  - marker: a
    text: Or 'the present good things' or 'the good things at hand.' The Greek literally says 'the existing good things.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the created world.'
    reason: lexical_alternative
  - marker: c
    text: The phrase 'as in youth' likely means with the vigor or abandon associated with youth.
    reason: cultural_note
translation:
  language: ko
  text: 그러니 이제 와서, 존재하는 좋은 것들을 누리고, 젊을 때처럼 창조 세계를 부지런히 사용합시다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘존재하는 좋은 것들’ 혹은 ‘눈앞에 있는 좋은 것들’. 그리스어는 문자적으로 ‘존재하는 좋은 것들’을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘창조된 세계’.
    reason: lexical_alternative
  - marker: c
    text: ‘젊을 때처럼’은 젊음에 따르는 기세나 거리낌 없음의 의미로 이해될 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: δεῦτε οὖν
  english_pob_choice: Come then
  chosen_korean: 그러니 이제 와서
  alternatives_korean:
  - 자, 그러니
  - 오너라 그러니
  - 그러니
  lexicon: LSJ
  rationale: 초청/권면의 뉘앙스를 살리면서 οὖν의 논리적 연결을 한국어 담화로 자연스럽게 옮겼습니다.
- source_word: ἀπολαύσωμεν
  english_pob_choice: let us enjoy
  chosen_korean: 누리고
  alternatives_korean:
  - 즐기고
  - 향유하고
  - 마음껏 누리고
  lexicon: LSJ
  rationale: 단순 사용보다 ‘즐김/향유’의 의미가 강하므로, 문맥의 향락적 제안을 드러내는 ‘누리다’를 택했습니다.
- source_word: τῶν ὄντων ἀγαθῶν
  english_pob_choice: the good things that exist
  chosen_korean: 존재하는 좋은 것들을
  alternatives_korean:
  - 현재 있는 좋은 것들을
  - 현존하는 좋은 것들을
  - 지금의 좋은 것들을
  lexicon: LSJ
  rationale: 직역에 가까운 ‘존재하는’으로 ὄντων의 존재론적 표현을 보존하되, 한국어로는 자연스럽게 복수 목적어로 처리했습니다.
- source_word: τῇ κτίσει
  english_pob_choice: creation
  chosen_korean: 창조 세계를
  alternatives_korean:
  - 창조를
  - 피조 세계를
  - 창조된 세계를
  lexicon: LSJ
  rationale: 단순한 물질 자원보다 ‘창조된 전체 질서’의 넓이를 살리기 위해 ‘창조 세계’를 사용했습니다.
- source_word: ὡς νεότητι σπουδαίως
  english_pob_choice: as in youth
  chosen_korean: 젊을 때처럼 … 부지런히
  alternatives_korean:
  - 청춘처럼 … 열심히
  - 젊음처럼 … 성급하게
  - 젊었을 때처럼 … 열정적으로
  lexicon: LSJ
  rationale: 이 구절은 젊음의 힘과 거리낌 없는 태도를 가리키므로, ‘젊을 때처럼’과 ‘부지런히’로 과도한 해설 없이 그 기세를 옮겼습니다.
theological_decisions:
- issue: σπουδαίως의 도덕적 평가를 한국어에서 어떻게 드러낼지
  chosen_reading: 문맥상 절제 없는 향락적 추진력을 나타내는 표현으로 옮겼습니다.
  alternative_readings:
  - 중립적인 ‘열심히’
  - 긍정적 뉘앙스의 ‘열정적으로’
  rationale: 지혜서 2장 6절은 악인들의 발언이므로, 단순한 성실함이 아니라 탐욕적·조급한 태도를 드러내야 문맥을 보존합니다.
  doctrine_reference: Translation philosophy §1, §5
