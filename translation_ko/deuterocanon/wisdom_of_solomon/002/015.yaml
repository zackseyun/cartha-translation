  chosen_korean: 다릅니다
  alternatives_korean:
  - 변해 있습니다
  - 달라져 있습니다
  lexicon: LSJ
  rationale: 완료 수동 분사형이지만 한국어에서는 상태를 나타내는 평서로 옮기는 것이 자연스러워 ‘다릅니다’로 처리했습니다.
- source_word: τρίβοι
  english_pob_choice: ways
  chosen_korean: 길
  alternatives_korean:
  - 행로
  - 길들
  lexicon: LSJ
  rationale: τρίβοι는 문자적으로는 ‘밟힌 길, 통로’이지만 비유적으로 삶의 행로를 뜻하므로, 이미지와 의미를 함께 살리는 ‘길’로 옮겼습니다.
