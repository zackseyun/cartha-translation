lexical_decisions:
- source_word: ἀνόμοιος
  english_pob_choice: unlike
  chosen_korean: 같지 않고
  alternatives_korean:
  - 다르고
  - 비슷하지 않고
  lexicon: LSJ
  rationale: ἀνόμοιος는 ‘닮지 않은, 다른’의 뜻이므로, 비교 대상인 ‘다른 사람들’과의 부정을 자연스럽게 살려 ‘같지 않고’로 옮겼습니다.
- source_word: βίος
