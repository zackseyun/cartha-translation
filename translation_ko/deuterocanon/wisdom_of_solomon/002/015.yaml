lexical_decisions:
- source_word: ἀνόμοιος
  english_pob_choice: unlike
  chosen_korean: 같지 않고
  alternatives_korean:
  - 다르고
  - 비슷하지 않고
  lexicon: LSJ
  rationale: ἀνόμοιος는 ‘닮지 않은, 다른’의 뜻이므로, 비교 대상인 ‘다른 사람들’과의 부정을 자연스럽게 살려 ‘같지 않고’로 옮겼습니다.
- source_word: βίος
  english_pob_choice: life
  chosen_korean: 삶
  alternatives_korean:
  - 생명
  - 생활 방식
  lexicon: LSJ
  rationale: 여기서 βίος는 생물학적 생명보다 한 사람의 삶의 방식 전체를 가리키므로, 직역적인 ‘생명’보다 문맥에 맞는 ‘삶’이 더 적절합니다.
- source_word: ἐξηλλαγμέναι
  english_pob_choice: are different
  chosen_korean: 다릅니다
  alternatives_korean:
  - 변해 있습니다
  - 달라져 있습니다
  lexicon: LSJ
  rationale: 완료 수동 분사형이지만 한국어에서는 상태를 나타내는 평서로 옮기는 것이 자연스러워 ‘다릅니다’로 처리했습니다.
- source_word: τρίβοι
  english_pob_choice: ways
  chosen_korean: 길
  alternatives_korean:
  - 행로
  - 길들
  lexicon: LSJ
  rationale: τρίβοι는 문자적으로는 ‘밟힌 길, 통로’이지만 비유적으로 삶의 행로를 뜻하므로, 이미지와 의미를 함께 살리는 ‘길’로 옮겼습니다.
theological_decisions:
- issue: βίος와 τρίβοι의 도덕적 의미를 본문에 명시적으로 풀어쓸지 여부
  chosen_reading: 직접적인 해석어를 덧붙이지 않고, ‘삶’과 ‘길’의 비유를 유지했습니다.
  alternative_readings:
  - 그의 생활방식은 다른 사람들과 다르고, 그의 행실은 다릅니다.
  rationale: 본문은 의인의 구별된 삶을 비난하는 문맥이지만, 그리스어 자체는 일상어와 비유를 사용합니다. 과도한 해석을 피하고 본문의 대비를 그대로 드러내는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
