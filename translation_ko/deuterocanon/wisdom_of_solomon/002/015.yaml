  rationale: 여기서 βίος는 생물학적 생명보다 한 사람의 삶의 방식 전체를 가리키므로, 직역적인 ‘생명’보다 문맥에 맞는 ‘삶’이 더 적절합니다.
- source_word: ἐξηλλαγμέναι
