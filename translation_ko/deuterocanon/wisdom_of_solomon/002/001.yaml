  rationale: ᾅδης는 단순 무덤보다 저승/죽은 자들의 영역을 가리키므로, 한국어 성경권에서 익숙하면서도 개념을 보존하는 ‘스올’을 사용했습니다.
theological_decisions:
- issue: ᾅδης의 음역 여부
  chosen_reading: 스올
  alternative_readings:
  - 하데스
  - 죽은 자들의 나라
  - 무덤
  rationale: 본문은 죽음 이후의 영역을 명시적으로 가리키며, 이를 ‘무덤’으로 낮추면 개념이 축소됩니다. ‘스올’은 히브리 성경-지혜문학의 사후 세계 어휘를 한국어로 가장 안정적으로 드러냅니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
- issue: ἀνθρώπου의 일반적 단수 처리
  chosen_reading: 사람의 삶
  alternative_readings:
  - 한 남자의 삶
  - 인간의 삶
  - 한 사람의 생애
  rationale: 그리스어는 남성형 단수를 쓰지만 일반적 인간을 뜻하므로, 성별을 남성으로 고정하지 않는 ‘사람’으로 옮겨 원문 의도를 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
