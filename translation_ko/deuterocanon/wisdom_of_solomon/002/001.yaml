base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/001.yaml
  text: For they said among themselves[a], reasoning wrongly, “Our life is short and sorrowful, and there is no remedy at the end of a man's life[b], and no one has been known to return from Hades.”
  footnotes:
  - marker: a
    text: Or, “no one has been known who was released from Hades,” preserving the more literal force of the participle ὁ ἀναλύσας.
    reason: lexical_alternative
  - marker: b
    text: Greek “at the end of a man,” a generic singular expression for human mortality.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 자기들끼리 잘못 추론하며 말했습니다. 「우리의 삶은 짧고 슬프며, 사람의 삶의 끝에는 치유가 없고, 스올에서 돌아온 자는 아무도 알려진 적이 없습니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그들은 서로에게서라기보다 자기들끼리의 말로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 “사람의 끝에”로, 인간의 죽음을 가리키는 일반적 단수 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπον γὰρ ἐν ἑαυτοῖς
  english_pob_choice: For they said among themselves
  chosen_korean: 그들은 자기들끼리 말했습니다
  alternatives_korean:
  - 그들은 서로 말했습니다
  - 그들은 자기 안에서 말했습니다
  lexicon: LSJ
  rationale: ἐν ἑαυτοῖς는 내면 독백이라기보다 자기들끼리의 상호적 발화를 가리킬 수 있어, 자연스러운 한국어로 압축하되 ‘자기들끼리’로 그 뉘앙스를 살렸습니다.
- source_word: λογισάμενοι οὐκ ὀρθῶς
  english_pob_choice: reasoning wrongly
  chosen_korean: 잘못 추론하며
  alternatives_korean:
  - 옳지 않게 생각하며
  - 그릇되게 판단하며
  - 올바르지 않게 이성적으로 따지며
  lexicon: LSJ
  rationale: λογίζομαι는 단순 생각보다 논리적 판단·추론의 의미가 강하므로, ‘잘못 추론하며’로 옮겨 평가적 뉘앙스를 보존했습니다.
- source_word: ἴασις
  english_pob_choice: healing / remedy
  chosen_korean: 치유
  alternatives_korean:
  - 치료
  - 고침
  - 회복
  lexicon: LSJ
  rationale: ἴασις는 죽음의 종결성에 맞서는 ‘회복 가능성’ 전체를 가리키므로, 한국어에서 가장 폭넓고 자연스러운 ‘치유’를 택했습니다.
- source_word: ἐν τελευτῇ ἀνθρώπου
  english_pob_choice: at the end of a man’s life
  chosen_korean: 사람의 삶의 끝에는
  alternatives_korean:
  - 사람이 죽을 때에는
  - 한 사람의 끝에는
  - 인간의 죽음에는
  lexicon: LSJ
  rationale: 영어 POB가 밝히듯 ἀνθρώπου는 일반적 단수 표현이므로, 성별을 특정하지 않는 ‘사람의 삶’으로 옮겨 의미를 분명히 했습니다.
- source_word: ὁ ἀναλύσας ἐξ ᾅδου
  english_pob_choice: to return from Hades
  chosen_korean: 스올에서 돌아온 자
  alternatives_korean:
  - 하데스에서 돌아온 자
  - 죽음의 영역에서 돌아온 자
  - 무덤에서 돌아온 자
  lexicon: LSJ
  rationale: ᾅδης는 단순 무덤보다 저승/죽은 자들의 영역을 가리키므로, 한국어 성경권에서 익숙하면서도 개념을 보존하는 ‘스올’을 사용했습니다.
theological_decisions:
- issue: ᾅδης의 음역 여부
  chosen_reading: 스올
  alternative_readings:
  - 하데스
  - 죽은 자들의 나라
  - 무덤
  rationale: 본문은 죽음 이후의 영역을 명시적으로 가리키며, 이를 ‘무덤’으로 낮추면 개념이 축소됩니다. ‘스올’은 히브리 성경-지혜문학의 사후 세계 어휘를 한국어로 가장 안정적으로 드러냅니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
- issue: ἀνθρώπου의 일반적 단수 처리
  chosen_reading: 사람의 삶
  alternative_readings:
  - 한 남자의 삶
  - 인간의 삶
  - 한 사람의 생애
  rationale: 그리스어는 남성형 단수를 쓰지만 일반적 인간을 뜻하므로, 성별을 남성으로 고정하지 않는 ‘사람’으로 옮겨 원문 의도를 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
