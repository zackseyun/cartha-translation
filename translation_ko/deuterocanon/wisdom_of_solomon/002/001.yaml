base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/001.yaml
  text: For they said among themselves[a], reasoning wrongly, “Our life is short and sorrowful, and there is no remedy at the end of a man's life[b], and no one has been known to return from Hades.”
  footnotes:
  - marker: a
    text: Or, “no one has been known who was released from Hades,” preserving the more literal force of the participle ὁ ἀναλύσας.
    reason: lexical_alternative
  - marker: b
    text: Greek “at the end of a man,” a generic singular expression for human mortality.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 잘못 추론하면서 자기들끼리 말했습니다.[a] “우리의 삶은 짧고 슬프며, 사람의 삶의 끝에는[b] 치유가 없고, 하데스에서 돌아온 사람이 알려진 적은 없습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 직역하면 “그들 자신들 가운데서”입니다. 문맥상 그들이 자기들끼리 한 말이라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “사람의 끝에”입니다. 인간의 죽음, 곧 한 사람의 삶이 끝나는 때를 가리키는 일반적 단수 표현입니다.
    reason: lexical_alternative
