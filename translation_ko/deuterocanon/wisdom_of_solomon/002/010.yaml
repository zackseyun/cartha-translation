  text: 우리는 의로운 가난한 사람을 억압합시다[a]. 과부에게도 자비를 베풀지 맙시다. 오래 산 노인의 흰머리도 공경하지 맙시다[b].
  philosophy: optimal-equivalence
  footnotes:
