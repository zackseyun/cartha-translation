review_pass:
  verdict: revise
  source_fidelity: The main clauses correctly reflect the Greek plural hortatory sequence and its targets. However, the draft's footnote b incorrectly identifies χήρας as ‘an old woman’; χήρας means ‘widow.’ The final clause should more directly retain the Greek focus on an elderly man's gray hair, with πολυχρονίους intensifying his age.
  naturalness: ‘과부는 아끼지 말자’ is potentially ambiguous in modern Korean, since 아끼다 can suggest cherishing rather than sparing. ‘과부에게도 자비를 베풀지 맙시다’ conveys the intended refusal of mercy naturally. The revision uses 합쇼체 hortatives as specified.
  terminology: ‘의로운 가난한 사람’ appropriately renders πένητα δίκαιον without imposing an interpretation beyond the text. ‘억압하다,’ ‘과부,’ and ‘공경하다’ are suitable modern formal terms. ‘오래 산 노인의 흰머리’ preserves both the concrete image and the emphatic age expression.
  issues:
  - severity: high
    issue: Footnote b mistranslates χήρας as ‘노파’ (‘old woman’).
    rationale: The Greek χήρας is the accusative singular of χήρα, ‘widow.’ The note is therefore lexically false and must be replaced.
  - severity: medium
    issue: The draft does not follow the requested 합쇼체 register.
    rationale: Its repeated -하자/-말자 forms are plain hortatives. The specified modern formal-polite register is better represented by -합시다/-맙시다.
  - severity: medium
    issue: The final clause shifts the object from the old man's gray hair to the old man himself.
    rationale: Greek has ‘show regard for [the] gray hairs of an old man,’ while the draft says not to respect the old man. The revision retains the concrete object, which also carries the cultural sign of venerable age.
  revised_text: 우리는 의로운 가난한 사람을 억압합시다[a]. 과부에게도 자비를 베풀지 맙시다. 오래 산 노인의 흰머리도 공경하지 맙시다[b].
