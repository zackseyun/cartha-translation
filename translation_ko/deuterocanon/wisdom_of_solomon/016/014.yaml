base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/014.yaml
  text: But a man kills by his own wickedness[a], and when a spirit has gone out, he does not bring it back, nor does he release a soul that has been taken.
  footnotes:
  - marker: a
    text: Or 'when the breath has gone out, he does not bring it back, nor does he release a life that has been taken away.' The Greek uses πνεῦμα and ψυχή, which can overlap with 'breath/spirit' and 'life/soul' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람은 자기의 악으로 사람을 죽이지만, 나간 영은 되돌리지 못하며, 데려가진 혼도 풀어 주지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘숨이 나갔을 때는 그것을 되돌리지 못하며, 데려가진 생명도 풀어 주지 못합니다.’ 여기서 πνεῦμα와 ψυχή는 문맥에 따라 각각 ‘숨/영’과 ‘생명/혼’의 의미 범위를 함께 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος
  english_pob_choice: a man
  chosen_korean: 사람은
  alternatives_korean:
  - 한 사람은
  - 한 인간은
  lexicon: LSJ
  rationale: ἄνθρωπος는 여기서 일반적 인간을 가리키는 단수 보편 표현이므로, 한국어에서는 성별을 과도하게 특정하지 않는 ‘사람’을 택해 대표적 단수의 기능을 살렸습니다.
- source_word: ἀποκτέννει μὲν
  english_pob_choice: kills
  chosen_korean: 사람을 죽이지만
  alternatives_korean:
  - 죽이지만
  - 목숨을 끊지만
  lexicon: BDAG
  rationale: 동사는 단순한 살해를 뜻하므로, 현대 한국어에서 자연스럽고 직접적인 ‘죽이다’를 사용했습니다.
- source_word: τῇ κακίᾳ αὐτοῦ
  english_pob_choice: by his own wickedness
  chosen_korean: 자기의 악으로
  alternatives_korean:
  - 자기 악으로
  - 자기의 악행으로
  lexicon: BDAG
  rationale: κακία는 단순한 ‘나쁨’보다 도덕적 악을 가리키므로 ‘악’으로 옮기되, 원문의 원인·수단 관계를 드러내는 ‘-으로’를 붙였습니다.
- source_word: ἐξελθὸν δὲ πνεῦμα
  english_pob_choice: when a spirit has gone out
  chosen_korean: 나간 영은
  alternatives_korean:
  - 빠져나간 영은
  - 떠난 숨은
  lexicon: BDAG
  rationale: πνεῦμα는 이 문맥에서 ‘영/숨’의 중첩 의미를 가지므로 본문에는 ‘영’을 유지해 그 어휘적 폭을 보존하고, 떠남의 완료를 간결하게 나타냈습니다.
- source_word: οὐδὲ ἀναλύει ψυχὴν παραλημφθεῖσαν
  english_pob_choice: nor does he release a soul that has been taken
  chosen_korean: 붙들린 혼도 풀어 주지 못합니다
  alternatives_korean:
  - 사로잡힌 혼도 풀어 주지 못합니다
  - 거둬 간 혼도 풀어 주지 못합니다
  lexicon: BDAG
  rationale: ψυχή는 여기서 ‘혼/생명’의 범위를 가지며, παραλημφθεῖσαν은 ‘붙들다/붙잡다’의 뉘앙스를 살릴 수 있어 ‘붙들린 혼’으로 옮겼습니다. ἀναλύει는 ‘풀다, 풀어 놓다’의 이미지가 강하므로 ‘풀어 주다’가 자연스럽습니다.
theological_decisions:
- issue: πνεῦμα와 ψυχή의 구분을 어떻게 보존할 것인가
  chosen_reading: 본문에서는 ‘영’과 ‘혼’을 각각 살려 두 용어의 구별을 유지했습니다.
  alternative_readings:
  - ‘숨’과 ‘생명’으로 통일해 더 생물학적으로 옮김
  - 두 단어 모두 ‘생명’으로 평준화
  rationale: 이 절은 인간이 죽음은 초래할 수 있어도 생명을 되돌리거나 죽음에서 풀어 줄 수 없다는 한계를 말하므로, 서로 다른 두 어휘를 하나로 흡수하지 않고 긴장을 유지하는 편이 원문 구조를 더 잘 드러냅니다.
  doctrine_reference: 언어적 긴장 보존 원칙; 인간 한계와 생명 회복의 하나님의 주권 대비
