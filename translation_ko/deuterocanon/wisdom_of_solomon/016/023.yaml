translation:
  language: ko
  text: 그러나 이것도 다시 의인들이 먹임을 받도록 자기 고유의 힘까지 잊었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 고유의 힘을 잃었다’ 또는 ‘자기 고유의 힘을 내려놓았다’로 옮길 수 있습니다. 그리스어는 대상을 의인화하여 그것이 자기 힘을 ‘잊었다’고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο πάλιν
  english_pob_choice: But this again
  chosen_korean: 그러나 이 일은 다시 한 번
  alternatives_korean:
  - 그것은 다시
  - 이것은 다시 한 번
  lexicon: LSJ
  rationale: 앞절의 현상을 가리키는 지시어와 πάλιν의 반복/재개 뉘앙스를 함께 살리기 위해 ‘이 일은 다시 한 번’으로 옮겼습니다.
- source_word: ἵνα τραφῶσιν δίκαιοι
  english_pob_choice: so that the righteous might be fed
  chosen_korean: 의인들이 먹을 수 있도록
  alternatives_korean:
  - 의인들이 먹이심을 받도록
  - 의인들이 양육되도록
  lexicon: LSJ
  rationale: τρέφω의 수동적 목적용법을 자연스러운 한국어로 풀되, ‘먹다’보다 ‘먹을 수 있도록’이 결과를 가장 직접적으로 드러내어 본문의 목적성을 유지합니다.
- source_word: ἐπιλησθῇ ... ἰδίας δυνάμεως
  english_pob_choice: forgot even its own power
  chosen_korean: 그 고유한 힘까지도 잊게 되었습니다
  alternatives_korean:
  - 자기 힘까지도 잃게 되었습니다
  - 자기 본래의 힘까지도 잊어버리게 되었습니다
  lexicon: LSJ
  rationale: ἐπιλανθάνομαι의 인격화된 표현을 살리기 위해 ‘잊게 되었습니다’로 직역성을 유지했고, ἰδίας δυνάμεως는 ‘고유한 힘’으로 옮겨 자기 본래의 작용력을 강조했습니다.
theological_decisions:
- issue: 무생물에 대한 의인화 유지
  chosen_reading: ‘잊게 되었습니다’라는 인격화 표현을 그대로 살려, 대상이 자기 힘을 ‘잊는’ 것으로 표현했습니다.
  alternative_readings:
  - ‘자연스러운 힘을 잃었습니다’
  - ‘본래의 작용을 멈췄습니다’
  rationale: 그리스어는 결과만 말하지 않고 사물을 의인화합니다. 이를 평탄하게 바꾸면 지혜서의 문학적·신학적 이미지를 약화시키므로, 한국어에서도 의인화를 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3, 6
