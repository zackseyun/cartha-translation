- from: 그러나 이 일은 다시 한 번 — 의인들이 먹을 수 있도록 — 그 고유한 힘까지도 잊게 되었습니다.[a]
  to: 그러나 이것도 다시 의인들이 먹임을 받도록 자기 고유의 힘까지 잊었습니다.[a]
  rationale: The revision restores the passive force of τραφῶσιν with ‘먹임을 받도록,’ retains the purpose clause, and preserves the Greek personification with ‘잊었습니다.’ It also uses ‘자기 고유의 힘’ to make the reflexive possessive relation explicit and removes disruptive punctuation.
  reviewer_model: gpt-5.6-terra
