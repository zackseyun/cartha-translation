translation:
  language: ko
  text: 이것들 대신에 주께서는 당신의 백성에게 천사들의 음식을 먹이셨고, 그들의 수고 없이 하늘에서 준비된 빵을 보내셨으니, 그것은 모든 기쁨을 지니고 있으며 모든 입맛에 잘 맞습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘천사들의 음식’, ‘천사에게 합당한 빵’으로도 옮길 수 있습니다. 그리스어 표현은 더 구체적인 설명을 요구하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθʼ ὧν
  english_pob_choice: Instead of these things
  chosen_korean: 이것들 대신에
  alternatives_korean:
  - 그것들을 대신하여
  - 이런 일들 대신에
  lexicon: LSJ
  rationale: 앞선 심판들과 대비되는 하나님의 다른 베푸심을 드러내는 역접 구조이므로, ‘이것들 대신에’로 간결하게 살렸습니다.
- source_word: ἀγγέλων τροφήν
  english_pob_choice: the food of angels
  chosen_korean: 천사들의 음식
  alternatives_korean:
  - 천사들의 양식
  - 천사들의 먹을 것
  lexicon: LSJ
  rationale: τροφή의 기본 의미인 ‘음식/양식’을 살리되, 소유격 표현을 그대로 유지해 천사와의 관계를 지나치게 해석하지 않도록 했습니다.
- source_word: ἀκοπιάτως
  english_pob_choice: without their labor
  chosen_korean: 그들의 수고 없이
  alternatives_korean:
  - 노력 없이
  - 수고 없이
  lexicon: LSJ
  rationale: 무릎이 아니라 ‘수고/노고 없이’라는 뜻을 드러내기 위해 ‘그들의 수고 없이’로 옮겨, 공급의 무노동성을 분명히 했습니다.
- source_word: ἕτοιμον ἄρτον
  english_pob_choice: ready bread
  chosen_korean: 준비된 빵
  alternatives_korean:
  - 예비된 빵
  - 곧바로 먹을 수 있는 빵
  lexicon: LSJ
  rationale: ἕτοιμον의 ‘준비된/마련된’ 의미를 살려, 하나님의 선제적 공급을 자연스러운 현대 한국어로 표현했습니다.
- source_word: πᾶσαν ἡδονὴν ἰσχύοντα
  english_pob_choice: able to satisfy every delight
  chosen_korean: 모든 기쁨을 지니고 있으며
  alternatives_korean:
  - 모든 즐거움을 만족시킬 수 있으며
  - 모든 기쁨에 유효하며
  lexicon: LSJ
  rationale: 직역하면 ‘모든 기쁨에 힘 있는’이지만, 문맥상 빵의 효능을 가리키므로 ‘모든 기쁨을 지니고 있으며’로 옮겨 의미를 과도하게 풀지 않되 기능을 드러냈습니다.
- source_word: πρὸς πᾶσαν ἁρμόνιον γεῦσιν
  english_pob_choice: suited to every taste
  chosen_korean: 모든 입맛에 잘 맞습니다
  alternatives_korean:
  - 모든 맛에 어울립니다
  - 어느 입맛에도 잘 맞습니다
  lexicon: LSJ
  rationale: ἁρμόνιον의 ‘잘 맞는, 조화로운’ 뉘앙스와 γεῦσις의 ‘맛/입맛’을 살려, 수용자에게 바로 이해되는 표현으로 정리했습니다.
theological_decisions:
- issue: ‘천사들의 음식’의 의미를 어느 쪽으로 구체화할지
  chosen_reading: 천사들의 음식이라는 표현을 그대로 두어, 천사에게 속한 음식인지 천사에게 합당한 음식인지 단정하지 않았습니다.
  alternative_readings:
  - 천사에게서 온 음식
  - 천사에게 합당한 음식
  rationale: 그리스어 소유격은 양쪽 가능성을 열어 두므로, 본문이 강하게 말하는 하늘의 공급 자체를 보존하고 해석을 서두르지 않는 편이 적절합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
