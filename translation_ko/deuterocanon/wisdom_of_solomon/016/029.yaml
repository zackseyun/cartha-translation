  text: For the hope of the ungrateful will melt like wintry frost[c][b][a], and will run off like useless water.
  footnotes:
  - marker: a
    text: Or 'the thankless.' The Greek ἀχάριστου can be rendered either way; 'ungrateful' was chosen for clearer ethical force in modern English.
