  - marker: b
    text: More literally, 'like winter frost.'
    reason: lexical_alternative
  - marker: c
    text: Or 'will flow away like water of no use.'
    reason: lexical_alternative
translation:
  language: ko
  text: 감사하지 않는 자의 희망은 겨울 서리처럼 녹아 없어지고, 쓸모없는 물처럼 흘러가 버릴 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘감사하지 않는 자’는 원문의 ἀχάριστου를 ‘배은망덕한’ 대신 더 직접적으로 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘겨울 서리’는 문자적으로는 ‘겨울의 서리’에 가깝습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘쓸모없는 물’은 ‘사용에 적합하지 않은 물’ 또는 ‘아무 쓸모 없는 물’의 뜻입니다.
    reason: lexical_alternative
