  rationale: ἄχρηστον은 ‘사용에 적합하지 않은, 쓸모없는’의 뜻이므로, 일상적이면서도 의미를 분명히 하는 ‘쓸모없는 물’이 가장 직접적입니다.
theological_decisions:
- issue: ‘감사하지 않는’의 도덕적 뉘앙스
  chosen_reading: 단순한 무례가 아니라 하나님과 타인에게 마땅한 감사가 결여된 도덕적 태도로 읽었습니다.
  alternative_readings:
  - 그냥 불평하는 사람으로 약화해 읽을 수 있습니다.
  - 사회적 예의 부족 정도로 완화해 읽을 수 있습니다.
  rationale: 지혜문학의 경고는 인격적·윤리적 결핍을 겨냥하므로, ‘감사하지 않는 자’로 유지해야 본문의 경고 강도가 보존됩니다.
  doctrine_reference: 지혜문학의 윤리적 경고; 감사 결핍에 대한 심판 이미지
