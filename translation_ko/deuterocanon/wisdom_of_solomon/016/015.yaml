  lexicon: LSJ
  rationale: χείρ는 문자적으로 ‘손’이며, 여기서는 하나님의 접근과 권세를 가리키는 구체적 이미지가 중요하므로, POB의 ‘your hand’를 따라 ‘당신의 손’으로 살렸습니다.
