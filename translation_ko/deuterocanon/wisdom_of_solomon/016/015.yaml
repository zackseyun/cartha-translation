lexical_decisions:
- source_word: Τὴν ... σὴν χεῖρα
  english_pob_choice: your hand
  chosen_korean: 당신의 손
  alternatives_korean:
  - 당신의 능력
  - 당신의 권능
  - 당신의 손아귀
  lexicon: LSJ
  rationale: χείρ는 문자적으로 ‘손’이며, 여기서는 하나님의 접근과 권세를 가리키는 구체적 이미지가 중요하므로, POB의 ‘your hand’를 따라 ‘당신의 손’으로 살렸습니다.
- source_word: φυγεῖν
  english_pob_choice: to escape
  chosen_korean: 피하는 것
  alternatives_korean:
  - 도망하는 것
  - 도망치는 것
  - 벗어나는 것
  lexicon: LSJ
  rationale: φυγεῖν은 ‘달아나다/피하다’의 뜻이지만, 목적어가 있는 이 문맥에서는 ‘벗어나다’보다 ‘피하다’가 더 자연스럽게 ‘당신의 손에서 빠져나갈 수 없음’을 표현합니다.
- source_word: ἀδύνατόν ἐστιν
  english_pob_choice: it is impossible
  chosen_korean: 불가능합니다
  alternatives_korean:
  - 가능하지 않습니다
  - 그럴 수 없습니다
  - 할 수 없습니다
  lexicon: LSJ
  rationale: 비인칭 구문을 현대 한국어의 간결한 진술로 옮겨, 단정적인 불가능성을 분명하게 전달했습니다.
- source_word: δὲ
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 그리고
  - 그런데
  - 하지만
  lexicon: LSJ
  rationale: 앞선 진술과의 대조를 표시하는 접속으로 ‘그러나’가 가장 자연스럽고 문맥의 전환을 분명히 드러냅니다.
