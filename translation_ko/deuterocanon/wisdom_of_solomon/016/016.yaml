  text: 이는 당신을 알기를 거부한 불경건한 자들이 당신의 팔의 힘으로 채찍질을 당하고, 낯선 비[a]와 우박과 피할 수 없는 폭우[b]에 쫓기며, 불에 삼켜졌기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
