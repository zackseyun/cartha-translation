  chosen_korean: 악한 자들
  alternatives_korean:
  - 경건하지 않은 자들
  - 불경건한 자들
  lexicon: BDAG
  rationale: 문맥상 하나님을 거부한 자들의 성격을 드러내지만, 한국어에서는 ‘악한 자들’이 시적 문맥에서 자연스럽고 형벌의 대상을 또렷하게 보여줍니다.
- source_word: ἐν ἰσχύι βραχίονός σου
  english_pob_choice: by the strength of your arm
  chosen_korean: 당신의 팔의 힘으로
  alternatives_korean:
  - 당신의 강한 팔로
  - 당신의 팔의 위력으로
  lexicon: LEH
  rationale: 히브리성 신적 권능 이미지인 ‘팔’과 ‘힘’을 둘 다 살려, 압축하지 않고 원문의 구조를 유지했습니다.
- source_word: ξένοις ὑετοῖς
  english_pob_choice: strange rains
  chosen_korean: 낯선 비
  alternatives_korean:
  - 이상한 비
  - 이례적인 비
  lexicon: LEH
  rationale: ξένοις의 ‘낯선/외래의’ 뉘앙스를 살려, 심판으로 주어진 비가 자연 질서에 속하지 않는다는 느낌을 전달합니다.
- source_word: ἀπαραιτήτοις
  english_pob_choice: relentless
  chosen_korean: 끊임없는
  alternatives_korean:
  - 피할 수 없는
  - 멈추지 않는
  lexicon: LEH
  rationale: 이 형용사는 막을 수 없고 되돌릴 수 없는 강도를 나타내므로, 한국어에서는 심판의 압박감을 드러내는 ‘끊임없는’으로 옮겼습니다.
theological_decisions:
- issue: 심판 주체를 드러내는 수동 표현
  chosen_reading: ‘매를 맞았고… 쫓기며… 삼켜졌습니다’로 수동/피동 구조를 유지해 하나님께서 자연재해와 불을 심판 도구로 쓰신다는 점을 살렸습니다.
  alternative_readings:
  - ‘벌을 받았고…’
  - ‘고난을 당했고…’
  rationale: 본문은 단순한 재난 묘사가 아니라 신적 심판의 연속을 말하므로, 약화된 일반 표현보다 강한 수동 표현이 원문 효과를 더 충실히 전달합니다.
  doctrine_reference: Translation philosophy §1, §6
