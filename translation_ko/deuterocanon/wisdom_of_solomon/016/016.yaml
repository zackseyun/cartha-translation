  lexicon: BDAG, LEH
  rationale: ἀρνούμενοι는 단순한 부정보다 의지적 거부를 드러내므로 ‘거부했기 때문에’로 옮기고, εἰδέναι는 ‘알다’의 직접 의미를 살렸습니다.
- source_word: ἀσεβεῖς
