theological_decisions:
- issue: 심판 주체를 드러내는 수동 표현
  chosen_reading: ‘매를 맞았고… 쫓기며… 삼켜졌습니다’로 수동/피동 구조를 유지해 하나님께서 자연재해와 불을 심판 도구로 쓰신다는 점을 살렸습니다.
  alternative_readings:
  - ‘벌을 받았고…’
  - ‘고난을 당했고…’
  rationale: 본문은 단순한 재난 묘사가 아니라 신적 심판의 연속을 말하므로, 약화된 일반 표현보다 강한 수동 표현이 원문 효과를 더 충실히 전달합니다.
  doctrine_reference: Translation philosophy §1, §6
