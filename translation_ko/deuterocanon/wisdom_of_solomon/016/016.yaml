base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/016.yaml
  text: For because they refused to know you[a], the ungodly were scourged by the strength of your arm, pursued by strange rains and hail and relentless storms[b], and consumed by fire.
  footnotes:
  - marker: a
    text: Or 'unusual rains'; the Greek literally speaks of 'strange/foreign rains,' emphasizing extraordinary weather sent in judgment.
    reason: lexical_alternative
  - marker: b
    text: Or 'inescapable storms' for 'relentless storms'; the adjective suggests something that cannot be turned aside or refused.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 당신을 알기를 거부했기 때문에, 악한 자들은 당신의 팔의 힘으로 매를 맞았고, 낯선 비와 우박과 끊임없는 폭풍에 쫓기며 불에 삼켜졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이상한 비들’. 그리스어는 문자적으로 ‘낯선/외래의 비들’을 말하며, 심판으로 주어진 비의 이례성을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘피할 수 없는 폭풍들’. 형용사는 돌이키거나 거절할 수 없는 것을 시사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρνούμενοι γάρ σε εἰδέναι
  english_pob_choice: because they refused to know you
  chosen_korean: 당신을 알기를 거부했기 때문에
  alternatives_korean:
