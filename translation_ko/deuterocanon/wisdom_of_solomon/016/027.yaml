  lexicon: BDAG
  rationale: ὑπό + 속격의 행위자/도구 의미를 자연스럽게 드러내면서, 원인의 대조가 분명하도록 했습니다.
- source_word: ὑπὸ βραχείας ἀκτῖνος ἡλίου
  english_pob_choice: by a brief ray of the sun
  chosen_korean: 햇빛의 짧은 광선에
  alternatives_korean:
  - 햇빛의 작은 광선에
  - 햇빛의 미약한 광선에
  - 태양의 짧은 광선에
  lexicon: LSJ
  rationale: βραχείας는 크기·짧음·미약함을 함께 함축하므로, ‘짧은 광선’으로 살려 불과의 극적인 대비를 유지했습니다.
- source_word: θερμαινόμενον
  english_pob_choice: when warmed
  chosen_korean: 데워지자
  alternatives_korean:
