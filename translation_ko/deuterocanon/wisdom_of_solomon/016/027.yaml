    text: 또는 ‘햇빛의 짧은 한 줄기에’. 헬라어 형용사는 시간의 짧음뿐 아니라 크기나 강도의 미약함을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... μὴ φθειρόμενον
  english_pob_choice: what was not destroyed
  chosen_korean: 사라지지 않던 것
  alternatives_korean:
  - 불에 의해 파괴되지 않던 것
  - 멸망하지 않던 것
  - 타버리지 않던 것
  lexicon: BDAG
  rationale: 문맥상 불의 파괴에도 견디던 대상을 가리키므로, ‘destroyed’의 물리적 의미를 살려 ‘사라지지 않던 것’으로 옮겼습니다.
- source_word: ὑπὸ πυρὸς
