  - 따뜻해지자
  lexicon: BDAG
  rationale: 강한 가열보다 약한 열의 영향을 뜻하므로, 과장되지 않은 ‘데워지자’가 원문의 뉘앙스를 가장 잘 살립니다.
- source_word: ἐτήκετο
