  source_fidelity: 그리스어는 불이 물 가운데에서도 ‘불의 능력을 넘어’ 타오르며 땅의 불의한 산물을 파괴하려는 목적을 나타냅니다. 초안의 ‘하셨습니다’는 본문에 명시되지 않은 하나님을 문법적 행위자로 도입하고, 불의 행위를 하나님의 사역으로 바꾸므로 삭제해야 합니다.
  naturalness: ‘그 힘을 넘어 타서’는 지시 대상이 다소 불분명하고 ‘타서’가 목적절과 자연스럽게 이어지지 않습니다. ‘제 힘을 넘어 타올라 … 멸망시키도록’은 현대 표준 한국어의 문어적 합쇼체에서 자연스럽습니다.
  terminology: ‘불의한 산물’은 ἄδικον γῆς γέννημα의 의도적인 낯섦과 도덕적 수식을 보존합니다. ‘멸망시키다’는 διαφθείρῃ의 파괴 의미를 충분히 전달합니다. 각주는 해당 어구 바로 뒤에 배치해야 합니다.
