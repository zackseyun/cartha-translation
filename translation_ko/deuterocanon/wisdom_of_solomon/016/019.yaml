  text: But at times[a], even in the midst of water, fire burns beyond its power[b], so that it may destroy the unrighteous produce of the earth.
  footnotes:
  - marker: a
    text: Or, 'beyond the power of fire'—that is, fire acts beyond its normal strength even while surrounded by water.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the unrighteous produce/offspring of the earth.' The phrase likely refers to the earth's yield as connected with the unrighteous.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 때로는 물 한가운데서도 불이 그 힘을 넘어 타서, 땅의 불의한 산물을 멸하게 하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불의 힘을 넘어’; 곧 불이 물에 둘러싸여 있으면서도 그 정상적인 힘을 넘어 작용한다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘땅의 불의한 산물/후손’입니다. 이 표현은 땅의 소출이 불의한 자들과 관련된 것으로 보일 수 있습니다.
