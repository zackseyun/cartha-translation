translation:
  language: ko
  text: 그리하여 그들은 먹을 것을 바라면서도, 보내진 피조물들의 모습 때문에 생존에 필요한 식욕마저 외면하게 하시고, 이들은 잠시 궁핍해진 뒤 낯선 맛을 맛보게 하시려는 것이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보내진 피조물들’은 문맥상 재앙으로 보내진 존재들을 가리킵니다. 그들의 보이는 모습이 혐오감을 일으켜 음식에서 돌아서게 한다는 뜻입니다.
    reason: source_note
  - marker: b
    text: ‘낯선 맛’은 익숙하지 않은 종류의 음식을 뜻하며, 문맥상 이스라엘에게 주어진 비범한 양식을 내다보는 표현입니다.
    reason: cross_reference
