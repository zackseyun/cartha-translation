translation:
  language: ko
  text: 그리하여 그 사람들은 먹을 것을 바라면서도, 보내진 피조물들의 모습 때문에 필요한 식욕마저 돌아서게 되고, 이 사람들은 잠시 동안 부족하게 된 뒤 낯선 맛을 맛보게 하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보내진 피조물들’은 문맥상 재앙으로 보내진 존재들을 가리키며, 그 모습이 혐오감을 일으킨다는 뜻을 드러냅니다.
    reason: source_note
  - marker: b
    text: ‘낯선 맛’은 익숙하지 않은 종류의 음식, 곧 이스라엘에게 주어진 비범한 공급을 예고하는 표현입니다.
    reason: cross_reference
