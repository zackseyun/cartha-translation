  chosen_reading: 본문에는 일반명사로 두되, 재앙의 도구로 보내진 존재들이라는 점이 문맥에서 읽히도록 했습니다.
  alternative_readings:
  - ‘보내진 것들’처럼 더 중립적으로 처리
  - 명시적으로 ‘재앙의 피조물들’이라고 풀어 쓰기
  rationale: 현재 절만으로 종의 이름을 특정하지 않고도, 앞뒤 문맥의 재앙-공급 대조를 보존하는 것이 가장 소스 충실적입니다.
