base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/013.yaml
  text: For you have authority over life and death[b][a], and you bring down to the gates of Hades and bring up.
  footnotes:
  - marker: a
    text: Or "the gates of the grave" or "the gates of the underworld." The Greek reads "Hades," the realm of the dead.
    reason: lexical_alternative
  - marker: b
    text: Or "lead up" or "raise up." The Greek simply says "bring up," balancing "bring down" in the previous clause.
    reason: alternative_reading
translation:
  language: ko
  text: 주님께서는 생명과 죽음에 대한 권세를 가지시며, 하데스[a]의 문들로 내리시고 올리십니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “죽은 이들의 영역의 문들”이라고 할 수 있습니다. 그리스어 하데스는 죽은 이들의 영역을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “이끌어 올리십니다”라고 할 수 있습니다. 그리스어는 앞의 “내리시고”와 대응하여 단순히 “올리다”라고 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίαν
  english_pob_choice: authority
  chosen_korean: 권세
  alternatives_korean:
  - 권위
  - 권한
  - 능력
  lexicon: BDAG
  rationale: 여기서는 단순한 힘보다 생명과 죽음에 대한 주권적 통치권이 핵심이므로, 한국어로는 교회적·성경적 용례가 넓은 ‘권세’가 가장 자연스럽습니다.
- source_word: ζωῆς καὶ θανάτου
  english_pob_choice: life and death
  chosen_korean: 생명과 죽음
  alternatives_korean:
  - 삶과 죽음
  - 목숨과 죽음
  lexicon: BDAG
  rationale: 대조 구조를 그대로 살려 ‘생명과 죽음’으로 옮기면 원문의 평행과 범위가 가장 분명하게 드러납니다.
- source_word: πύλας ᾅδου
  english_pob_choice: the gates of Hades
  chosen_korean: 죽음의 문들
  alternatives_korean:
  - 하데스의 문들
  - 음부의 문들
  - 무덤의 문들
  lexicon: BDAG
  rationale: 문자적으로는 ‘하데스의 문들’이지만, 한국어 성경 독자에게는 ‘죽음의 문들’이 원문의 이미지와 의미를 가장 자연스럽게 전달하면서도 ᾅδης의 사후 영역을 지나치게 좁히지 않습니다.
- source_word: ἀνάγεις
  english_pob_choice: bring up
  chosen_korean: 올리시고
  alternatives_korean:
  - 데려올리시고
  - 끌어올리시고
  - 올려 보내시고
  lexicon: BDAG
  rationale: 앞절의 ‘내리시고’와 대응하는 상향 이동을 살리기 위해 ‘올리시다’를 택했습니다. 여기서는 부활 전문용어로 좁히기보다 원문의 대조를 보존하는 것이 우선입니다.
theological_decisions:
- issue: ᾅδης의 처리
  chosen_reading: ‘하데스’ 대신 의미 중심으로 ‘죽음의 문들’이라고 옮겼습니다.
  alternative_readings:
  - 하데스의 문들
  - 음부의 문들
  - 무덤의 문들
  rationale: 이 구절은 하나님이 생명과 죽음을 주관하시며 죽음의 영역으로도 내리시고 다시 올리신다는 진술이 핵심이므로, 한국어에서는 원문 이미지와 의미를 함께 살리는 표현이 더 효과적입니다. 다만 사후 세계의 실재성을 약화시키지 않도록 ‘문들’의 비유는 유지했습니다.
  doctrine_reference: 죽음/스올/하데스 표현의 번역적 긴장 보존
- issue: ἀνάγεις의 뉘앙스
  chosen_reading: ‘다시 올리십니다’
  alternative_readings:
  - 올리십니다
  - 일으키십니다
  - 들어 올리십니다
  rationale: 원문은 단순한 ‘올림’과 ‘내림’의 평행을 말하며, 여기서 곧바로 부활 교리 용어로 고정할 필요는 없습니다. ‘다시’는 앞의 ‘내리시고’와 대칭을 살려 주면서 원문의 역동성을 유지합니다.
  doctrine_reference: 본문의 평행법과 신학적 긴장 보존
