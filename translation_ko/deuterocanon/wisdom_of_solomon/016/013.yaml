translation:
  language: ko
  text: 주님께서는 생명과 죽음에 대한 권세를 가지시며, 사람을 죽음의 문들로 내리시고 다시 올리십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “죽음의 문들”로 이해할 수 있습니다. 그리스어 ᾅδης는 죽은 자들의 영역을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “올리십니다”로도 옮길 수 있습니다. 그리스어는 앞의 “내리시고”와 대응하여 단순히 “올리다”라고 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίαν
  english_pob_choice: authority
  chosen_korean: 권세
  alternatives_korean:
  - 권위
  - 권한
  - 능력
  lexicon: BDAG
  rationale: 여기서는 단순한 힘보다 생명과 죽음에 대한 주권적 통치권이 핵심이므로, 한국어로는 교회적·성경적 용례가 넓은 ‘권세’가 가장 자연스럽습니다.
- source_word: ζωῆς καὶ θανάτου
  english_pob_choice: life and death
  chosen_korean: 생명과 죽음
  alternatives_korean:
