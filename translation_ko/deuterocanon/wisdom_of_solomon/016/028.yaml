  text: so that it might be known that one must rise before the sun to give you thanks[b][a], and at the dawning of the light make petition to you.
  footnotes:
  - marker: a
    text: Or, more literally, 'precede the sun for thanksgiving to you.'
    reason: lexical_alternative
  - marker: b
    text: Or 'pray to you'; the Greek verb can mean to approach someone with a request or petition.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 이른 아침에 해보다 먼저 일어나 당신께 감사드리고, 빛이 떠오를 무렵 당신께 간구해야 함이 알려지게 하려는 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 문자적으로는 ‘감사드리기 위하여 해보다 먼저 나아가야 한다’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘기도하다’로도 옮길 수 있으나, 여기서는 ‘간구하다’가 그리스어의 청원적 뉘앙스를 더 분명히 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως γνωστὸν ἦν
  english_pob_choice: so that it might be known
  chosen_korean: 그리하여 … 알려지게 하려는 것입니다
  alternatives_korean:
  - 그리하여 … 알게 하려는 것입니다
  - …임을 드러내려는 것입니다
  lexicon: LSJ
  rationale: ὅπως와 γνωστόν ἦν의 목적/결과 뉘앙스를 살려, 단순한 과거 진술보다 ‘알려지게 하려는’ 목적 구조로 옮겼습니다.
- source_word: δεῖ φθάνειν τὸν ἥλιον
  english_pob_choice: one must rise before the sun
  chosen_korean: 해보다 먼저 일어나
  alternatives_korean:
  - 해를 앞서야
  - 해보다 먼저 도착해야
  lexicon: LSJ
  rationale: φθάνειν τὸν ἥλιον의 문자적 의미인 ‘해보다 먼저 이르다’를 한국어 관용에 맞게 ‘해보다 먼저 일어나다’로 풀어, 새벽 예배의 시간성을 자연스럽게 살렸습니다.
- source_word: ἐπʼ εὐχαριστίαν σου
  english_pob_choice: to give you thanks
  chosen_korean: 당신께 감사드리고
  alternatives_korean:
  - 당신께 감사하기 위하여
  - 당신께 감사함으로
  lexicon: LSJ
  rationale: 전치사구가 감사 행위의 방향을 나타내므로, ‘감사드리다’로 옮겨 하나님께 향하는 직접성을 분명히 했습니다.
- source_word: πρὸς ἀνατολὴν φωτός
  english_pob_choice: at the dawning of the light
  chosen_korean: 빛이 떠오를 무렵
  alternatives_korean:
  - 빛이 돋아날 때
  - 새벽빛이 떠오를 때
  lexicon: LSJ
  rationale: ‘빛의 떠오름/동틀 무렵’이라는 시적 표현을 살리되, 한국어에서 자연스러운 ‘빛이 떠오를 무렵’으로 옮겼습니다.
- source_word: ἐντυγχάνειν σοι
  english_pob_choice: make petition to you
  chosen_korean: 당신께 간구해야 함
  alternatives_korean:
  - 당신께 청해야 함
  - 당신께 기도해야 함
  lexicon: LSJ
  rationale: ἐντυγχάνειν의 ‘다가가 요청하다/청원하다’는 뜻을 반영하여, 일반적인 ‘기도하다’보다 청원성을 드러내는 ‘간구하다’를 택했습니다.
theological_decisions:
- issue: 의무를 나타내는 δεῖ의 강도
  chosen_reading: 보편적 당위로서 ‘해야 함’이라는 표현을 유지했습니다.
  alternative_readings:
  - ‘마땅합니다’
  - ‘필요합니다’
  rationale: 본문은 단순 권고가 아니라 새벽에 하나님께 감사와 간구를 드리는 행위를 일반적 의무로 제시하므로, 당위성을 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
