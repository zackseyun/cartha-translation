translation:
  language: ko
  text: 이는 해보다 먼저[a] 당신께 감사드리고, 빛이 떠오를 무렵 당신께 간구해야 한다[b]는 사실이 알려지게 하려는 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 문자적으로는 ‘당신께 감사드리기 위하여 해를 앞서야 한다’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘기도해야 한다’로도 옮길 수 있으나, 여기서 그리스어 동사는 요청을 가지고 다가가거나 청원한다는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
