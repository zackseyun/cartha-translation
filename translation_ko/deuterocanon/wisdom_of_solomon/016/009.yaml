  rationale: 이 구절은 곤충의 독/물림으로 인한 실제 죽음을 말하므로, ψυχή를 '영혼'으로 옮기면 문맥을 벗어납니다. '생명'으로 두어 육체적 죽음의 의미를 보존했습니다.
  doctrine_reference: 원문 우선 원칙, 본문 문맥에 따른 의미 보존
