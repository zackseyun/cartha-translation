base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/009.yaml
  text: For those whom the bites of locusts and flies killed, no healing was found for their life, because they were worthy to be punished by such things;
  footnotes:
  - marker: a
    text: Or 'no remedy was found for their soul.' Here 'life' is preferred because the context is bodily death from the creatures' bites.
    reason: lexical_alternative
  - marker: b
    text: Or 'by such creatures'; the Greek says more broadly 'by such things.'
    reason: lexical_alternative
translation:
  language: ko
  text: 메뚜기와 파리의 물림으로 죽은 이들에게는 그들의 생명을 위한 치료책이 발견되지 않았습니다[a]. 그들이 그러한 것들로 벌을 받기에 합당했기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 영혼을 위한 치료책’. 여기서 ‘생명’은 이들의 물림으로 인한 육체적 죽음이라는 문맥에 따른 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκρίδων καὶ μυιῶν
  english_pob_choice: locusts and flies
  chosen_korean: 메뚜기와 파리
  alternatives_korean:
  - 메뚜기 떼와 파리
  - 귀뚜라미와 파리
  lexicon: LSJ
  rationale: ἀκρίς는 여기서 plague 문맥상 메뚜기가 자연스럽고, μυῖα는 일반적으로 파리를 뜻하므로 한국어도 직역에 가깝게 유지했습니다.
- source_word: δήγματα
  english_pob_choice: bites
  chosen_korean: 물린 자국
  alternatives_korean:
  - 물림
  - 쏘임
  lexicon: LSJ
  rationale: δήγματα는 곤충의 물거나 쏘는 상처를 가리키지만, 한국어에서는 두 곤충과의 병렬을 살려 '물린 자국'이 가장 직관적입니다.
- source_word: ἴαμα
  english_pob_choice: no healing was found
  chosen_korean: 치료책은 발견되지 않았습니다
  alternatives_korean:
  - 치유는 없었습니다
  - 치료는 없었습니다
  lexicon: LSJ
  rationale: ἴαμα는 '치유'보다 '치료/치료책'의 의미가 더 넓어, 본문이 말하는 구제의 부재를 한국어로 자연스럽게 옮겼습니다.
- source_word: τῇ ψυχῇ αὐτῶν
  english_pob_choice: for their life
  chosen_korean: 그들의 생명을 위해
  alternatives_korean:
  - 그들의 영혼을 위해
  - 그들에게
  lexicon: LSJ
  rationale: 문맥이 몸의 죽음과 관련되어 있으므로 ψυχή는 '영혼'이 아니라 '생명'으로 읽어야 하며, 한국어도 그 점을 반영했습니다.
theological_decisions:
- issue: ψυχή의 번역 범위
  chosen_reading: 생명
  alternative_readings:
  - 영혼
  rationale: 이 구절은 곤충의 독/물림으로 인한 실제 죽음을 말하므로, ψυχή를 '영혼'으로 옮기면 문맥을 벗어납니다. '생명'으로 두어 육체적 죽음의 의미를 보존했습니다.
  doctrine_reference: 원문 우선 원칙, 본문 문맥에 따른 의미 보존
