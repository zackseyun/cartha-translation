  - 변형되었습니다
  lexicon: LSJ
  rationale: 혼합·변화를 뜻하는 동사로, 인위적·기술적 뉘앙스를 피하면서도 음식이 각 사람의 기호에 맞게 변한 사실을 간명하게 드러내는 표현입니다.
theological_decisions:
- issue: ὑπόστασις의 지시 대상
  chosen_reading: 만나의 주어진 실재와 성질을 가리키는 것으로 읽고, 하나님의 존재론적 본질로 옮기지 않았습니다.
  alternative_readings:
  - 하나님의 성품이 당신의 자녀들에게 드러났다는 읽기
  - ‘본성’에 가까운 보다 추상적 이해
  rationale: 이 절의 초점은 공급된 음식의 적응성과 맛이지, 하나님의 형이상학적 본질 진술이 아닙니다. 따라서 본문이 허락하는 범위에서 음식 자체의 실재를 가리키는 방향을 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
