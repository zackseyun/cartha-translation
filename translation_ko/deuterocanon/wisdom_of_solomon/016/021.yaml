base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/021.yaml
  text: For your substance displayed your sweetness toward your children[a]; and, serving the desire of the one who partook of it[b], it changed into whatever each one wished.
  footnotes:
  - marker: a
    text: Or 'your nature displayed your sweetness toward your children.' The Greek ὑπόστασις can mean 'substance,' 'nature,' or 'underlying reality.'
    reason: lexical_alternative
  - marker: b
    text: The final clause means that the food adapted itself to each person's preference.
    reason: cultural_note
translation:
  language: ko
  text: 당신께서 주신 양식의 실체는 당신의 자녀들을 향한 당신의 달콤함을 드러냈으며[a], 그것을 받은 이의 바람을 따라 각 사람이 바라는 것으로 변하였습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신께서 주신 양식의 본성이 당신의 자녀들을 향한 당신의 달콤함을 드러냈다.’ 그리스어 ὑπόστασις는 ‘실체’, ‘본성’, 또는 ‘근저의 실재’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 그 양식이 각 사람의 기호에 맞게 달라졌다는 뜻입니다.
    reason: cultural_note
