  text: 그것은 폭군 노릇을 하던 자들에게는 피할 수 없는 궁핍이 닥쳐야 했기 때문이지만, 이들에게는 오직 그들의 원수들이 어떻게 고통받고 있는지를 보여 주어야 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
