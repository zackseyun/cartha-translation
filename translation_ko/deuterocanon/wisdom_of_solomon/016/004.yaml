  rationale: βασανίζω의 강한 고통·시련의 뜻을 유지하되, 여기서는 직접적 형벌 묘사보다 ‘고통받다’가 문맥상 더 넓고 자연스럽습니다.
theological_decisions:
- issue: 두 집단에 대한 대조적 처리
  chosen_reading: 폭군들에게는 직접적인 궁핍이 닥치고, 이들에게는 원수들의 고통이 ‘보여지는’ 방식의 차이를 그대로 살렸습니다.
  alternative_readings:
  - 두 집단 모두가 단순히 다른 방식으로 벌을 받았다고 완화해 옮길 수 있습니다.
  - 둘째 절을 ‘그들이 원수들의 고통을 보게 하려는 것’으로 능동화할 수 있습니다.
  rationale: 본문의 수동형 δειχθῆναι와 제한 부사 μόνον은 한쪽은 직접 겪고 다른 쪽은 목격하게 되는 비대칭을 강조하므로, 그 긴장을 완화하지 않았습니다.
  doctrine_reference: 본문의 심판 대비를 보존
