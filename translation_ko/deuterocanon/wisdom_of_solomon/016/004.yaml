  naturalness: 초안의 ‘그것은 … 때문이지만’은 이유를 제시하는 γάρ와 두 절의 대조를 한 문장 안에서 어색하게 결합합니다. ‘왜냐하면 … 했고, … 했기 때문입니다’로 고치면 현대 표준어 합쇼체로 자연스럽고 논리 관계도 분명해집니다. ‘폭군 노릇을 하던’은 다소 구어적이므로 ‘폭정을 부리던’이 문맥과 문체에 더 알맞습니다.
