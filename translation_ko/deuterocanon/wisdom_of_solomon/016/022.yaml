- from: 그러나 눈과 얼음은 불을 견디고 녹지 않았습니다. 그래서 그들이 알게 하려는 것이었습니다. 곧, 불이 우박 속과 폭우 속에서 번쩍이며 원수들의 열매를 파괴하고 있었다는 것을 말입니다.[a]
  to: 그러나 눈과 얼음은 불을 견디고도 녹지 않았습니다. 그들이 우박 가운데서 타오르고 비 가운데서 번쩍이는 불이 원수들의 열매[a]를 파괴하고 있었음을 알도록 하기 위해서였습니다.
