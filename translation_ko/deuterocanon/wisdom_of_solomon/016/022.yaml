theological_decisions:
- issue: ἵνα γνῶσιν의 목적절과 지시 대상의 모호성
  chosen_reading: ‘그들이 알게 하려는 것이었습니다’로 옮겨 목적성을 살리되, ‘그들’의 정확한 지시 대상은 본문처럼 열어 두었습니다.
  alternative_readings:
  - ‘그들이 알 수 있도록’
  - ‘사람들이 알게 하려는 것이었습니다’
  rationale: 그리스어는 주어를 명시하지 않아 지시 대상이 다소 열려 있으므로, 한국어도 과도하게 특정하지 않고 본문의 해석 여지를 유지했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
