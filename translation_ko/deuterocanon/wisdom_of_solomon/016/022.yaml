translation:
  language: ko
  text: 그러나 눈과 얼음은 불을 견디고 녹지 않았습니다. 그래서 그들이 알게 하려는 것이었습니다. 곧, 불이 우박 속과 폭우 속에서 번쩍이며 원수들의 열매를 파괴하고 있었다는 것을 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘원수들의 농작물’ 혹은 ‘원수들의 소산’으로도 옮길 수 있습니다. 그리스어는 문자적으로 ‘원수들의 열매’라고 말합니다.
    reason: lexical_alternative
