  text: 그러므로 그들은 유사한 것으로 마땅한 벌을 받았으며, 많은 기생물들로 고통을 겪었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '유사한 것들로' 혹은 '비슷한 것들을 통해'; 헬라어는 형벌이 죄에 대응함을 강조합니다.
