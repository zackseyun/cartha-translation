    reason: lexical_alternative
  - marker: b
    text: 헬라어는 넓게 기어 다니는 동물이나 작은 생물을 가리킬 수 있습니다. ‘기어 다니는 생물들’은 그 범위를 특정 종류로 한정하지 않습니다.
