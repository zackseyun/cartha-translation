  text: Therefore they were justly punished by similar things[b][a], and were tormented by a multitude of creatures.
  footnotes:
  - marker: a
    text: Or 'by like things' or 'through similar things'; the Greek emphasizes that the punishment corresponded to the offense.
    reason: lexical_alternative
  - marker: b
    text: The Greek term can refer broadly to crawling or creeping animals; 'creeping creatures' preserves that breadth.
    reason: lexical_alternative
