translation:
  language: ko
  text: 이 징벌 대신에 주께서는 주님의 백성에게 선을 베푸셨습니다. 특이한 맛을 바라는 식욕의 갈망을 위해, 그들에게 음식으로 메추라기를 마련하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 징벌 대신에 주님의 백성에게 선을 베푸셨습니다.’
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 압축된 표현으로, 문자적으로는 ‘식욕의 갈망, 곧 특이한 맛’을 뜻합니다. 이는 평소와 다른 맛을 바라는 음식 욕구를 강조할 수 있습니다.
    reason: lexical_alternative
