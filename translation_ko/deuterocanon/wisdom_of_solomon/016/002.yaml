translation:
  language: ko
  text: 이 징벌 대신에 주님은 당신의 백성에게 선을 베푸셨습니다. 이상한 식욕의 갈망을 채우시려고 그들에게 음식으로 메추라기를 준비하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 징벌을 대신하여 당신의 백성에게 선을 베푸셨습니다.’
    reason: lexical_alternative
  - marker: b
    text: 헬라어는 압축적 표현으로, 문자적으로는 ‘식욕의 갈망의 이상한 맛’을 뜻하며, 비정상적인 음식 욕구를 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθʼ ἧς κολάσεως
  english_pob_choice: Instead of this punishment
  chosen_korean: 이 징벌 대신에
  alternatives_korean:
  - 이 벌 대신에
  - 그 징벌에 대신하여
  lexicon: LSJ
  rationale: ἀντί의 대치·대응 의미를 살려 ‘대신에’로 옮겼고, κολάσεως는 완화하지 않고 ‘징벌’로 유지했습니다.
- source_word: εὐεργετήσας
  english_pob_choice: you did good to
  chosen_korean: 선한 일을 베푸셨습니다
  alternatives_korean:
  - 좋은 일을 하셨습니다
  - 은혜를 베푸셨습니다
  - 복을 주셨습니다
  lexicon: LSJ
  rationale: 동사는 단순한 호의가 아니라 실제로 유익을 행하는 뜻이므로, ‘선한 일을 베푸셨습니다’로 옮겨 공적·구체적 행위를 드러냈습니다.
- source_word: εἰς ἐπιθυμίαν ὀρέξεως ξένην γεῦσιν
  english_pob_choice: for a strange craving of appetite
  chosen_korean: 이상한 식욕의 갈망
  alternatives_korean:
  - 낯선 식욕의 갈망
  - 비정상한 식욕의 욕구
  - 기이한 입맛의 갈망
  lexicon: LSJ
  rationale: 중첩된 명사구의 압축성을 살리기 위해 ‘식욕의 갈망’으로 대응했고, ξένην은 문맥상 ‘이상한/낯선’의 의미로 이해했습니다.
- source_word: τροφὴν ἡτοίμασας ὀρτυγομήτραν
  english_pob_choice: you prepared quail as food for them
  chosen_korean: 그들에게 음식으로 메추라기를 준비하셨습니다
  alternatives_korean:
  - 그들에게 먹을 것으로 메추라기를 마련하셨습니다
  - 메추라기를 음식으로 그들에게 준비하셨습니다
  lexicon: LSJ
  rationale: τροφὴν은 일반적으로 ‘음식’이고, ὀρτυγομήτραν은 메추라기를 가리키므로 자연스러운 한국어 어순으로 재구성했습니다.
theological_decisions:
- issue: 징벌과 공급의 대비
  chosen_reading: 본문은 앞선 징벌과 달리, 하나님이 자기 백성에게는 선을 베푸시고 먹을 것을 마련하신 대조를 드러냅니다.
  alternative_readings:
  - 단순히 ‘그 일에 이어’ 식의 시간적 연결로 읽을 수 있습니다.
  - ‘벌을 대신한 보상’처럼 더 약하게 읽을 수 있습니다.
  rationale: ἀνθʼ ἧς는 가장 자연스럽게 대치·대조를 나타내므로, 심판과 공급의 신학적 대비를 보존했습니다.
  doctrine_reference: 심판과 긍휼의 대비를 유지
