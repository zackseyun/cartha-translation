  source_fidelity: 수정이 필요합니다. 초안은 대조(ἀνθʼ ἧς)와 메추라기 공급을 잘 전달하지만, εἰς ἐπιθυμίαν ὀρέξεως ξένην γεῦσιν에 들어 있는 γεῦσιν(‘맛/맛봄’)을 본문에서 누락하고 ‘채우시려고’라는 목적·충족의 뜻을 다소 분명하게 보탰습니다. 압축되고 다소 난해한 원문의 표현을 한국어에서도 무리 없이 보존하는 편이 안전합니다.
  naturalness: ‘이상한 식욕의 갈망’은 현대 한국어에서 어색하며, 무엇이 ‘이상한’ 것인지도 불분명합니다. ‘특이한 맛을 바라는 식욕의 갈망’은 원문의 중첩과 ‘맛’을 살리면서도 이해 가능합니다. ‘주님은 당신의 백성에게’보다 직접 호칭 문맥에 맞춘 ‘주께서는 주님의 백성에게’가 현대 정중체 성경 문체에서 더 자연스럽습니다.
  terminology: κολάσεως는 ‘징벌’, εὐεργετήσας는 ‘선을 베푸셨습니다’, λαός는 ‘백성’, ὀρτυγομήτρα는 ‘메추라기’로 적절합니다. 다만 본문에 없는 ‘주님’이라는 명사 호칭을 단독 주어로 넣기보다는, 그리스어의 2인칭 동사에 상응하는 ‘주께서는’으로 처리했습니다. 각주 b는 γεῦσιν을 ‘맛’으로 명시해야 합니다.
