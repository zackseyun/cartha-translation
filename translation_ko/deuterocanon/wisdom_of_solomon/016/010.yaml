  source_fidelity: 원문의 문두 목적어 τοὺς δὲ υἱούς σου는 ‘당신의 아들들’을 가리키며, ἐνίκησαν의 주어는 ‘독을 지닌 뱀들의 이빨’입니다. 초안은 ‘아들들’이 ‘독사들의 이빨’을 이기지 못한 것으로 주객을 뒤바꾸어 핵심 의미가 반전되었습니다. 또한 ἀντιπαρῆλθεν의 구원적 개입은 ‘찾아와’로 자연스럽게 드러낼 수 있습니다.
