translation:
  language: ko
  text: 그러나 당신의 아들들은 독사들의 이빨에도 이기지 못했습니다. 당신의 자비가 그들에게 다가와 그들을 고쳐 주셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자녀들.’ 그리스어는 남성 복수형 ‘아들들’을 사용하므로, 여기서는 성별을 드러내는 번역을 유지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱούς
  english_pob_choice: sons
  chosen_korean: 아들들
  alternatives_korean:
  - 자녀들
  lexicon: LSJ
  rationale: 그리스어 복수 남성형을 살려 ‘아들들’로 옮겼습니다. POB가 gender-accurate하게 ‘sons’를 유지한 판단을 반영합니다.
- source_word: ἰοβόλων δρακόντων
  english_pob_choice: venomous serpents
  chosen_korean: 독사들
  alternatives_korean:
  - 독을 품은 뱀들
  - 맹독의 뱀들
  lexicon: LSJ
  rationale: 문맥상 물어뜯는 위험한 뱀을 가리키므로, 현대 한국어에서 자연스럽고 본문의 위협성을 살리는 ‘독사들’이 적절합니다.
- source_word: ἐνίκησαν
  english_pob_choice: did not overcome
  chosen_korean: 이기지 못했습니다
  alternatives_korean:
  - 정복하지 못했습니다
  - 이겨 내지 못했습니다
  lexicon: LSJ
  rationale: ‘정복하다’보다 일상적이면서도 패배/극복의 뜻을 살리는 표현으로, 독사들의 이빨이 그들을 결국 굴복시키지 못했다는 뜻을 전달합니다.
- source_word: ἀντιπαρῆλθεν
  english_pob_choice: came to their aid
  chosen_korean: 그들에게 다가와
  alternatives_korean:
  - 그들을 도우러 와
  - 그들 곁에 와
  lexicon: LSJ
  rationale: 직역하면 다소 난해하므로, 하나님의 자비가 위험에 맞서 그들 편에 임했다는 기능을 살려 ‘다가와’로 처리했습니다. 뒤의 ‘고쳐 주셨기 때문입니다’와 함께 구원의 개입을 자연스럽게 드러냅니다.
- source_word: ἰάσατο
  english_pob_choice: healed
  chosen_korean: 고쳐 주셨습니다
  alternatives_korean:
  - 치유하셨습니다
  - 낫게 하셨습니다
  lexicon: LSJ
  rationale: 육체적 치유를 뜻하는 동사를 한국어에서 자연스럽게 살리기 위해 ‘고쳐 주셨습니다’를 택했습니다. 문맥상 하나님의 자비가 실제 회복을 가져온다는 점을 분명히 합니다.
theological_decisions:
- issue: 자비의 주체와 문장 종결
  chosen_reading: ‘당신의 자비’가 능동적으로 그들에게 다가와 치유하는 주체로 표현했습니다.
  alternative_readings:
  - ‘당신의 자비가 그들을 도와 치유했습니다’
  - ‘당신의 긍휼이 그들 위에 임했습니다’
  rationale: 원문의 인격화된 표현(‘자비’가 다가와 치유함)을 살리기 위해 주어적 표현을 유지했습니다. 다만 한국어에서 어색하지 않도록 ‘다가와’와 ‘고쳐 주셨습니다’를 연결해 구원의 개입성을 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 4
