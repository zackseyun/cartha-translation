base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/026.yaml
  text: so that your children[a], whom you loved, might learn, O Lord, that it is not the produce of crops that nourishes a man[b], but your word preserves those who trust in you.
  footnotes:
  - marker: a
    text: Or 'those who believe you.' The Greek participle can denote trusting reliance or believing response.
    reason: lexical_alternative
  - marker: b
    text: 'This line likely echoes Deuteronomy 8:3: human life is sustained not merely by food but by God''s word.'
    reason: cross_reference
translation:
  language: ko
  text: 그리하여 당신의 아들들[a], 곧 당신이 사랑하신 이들이, 주님이시여, 깨닫게 하십시오. 곡식의 산물이 사람을 먹이는 것이 아니라, 당신의 말씀이 당신을 믿는 이들을 지켜 주신다는 것을[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신을 믿는 이들’로 볼 수 있습니다. 그리스어 분사는 신뢰하는 의지나 믿음의 반응을 모두 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 구절은 신명기 8:3을 떠올리게 합니다. 사람의 생명은 음식만이 아니라 하나님의 말씀으로 유지된다는 뜻입니다.
    reason: cross_reference
lexical_decisions:
- source_word: οἱ υἱοί σου
  english_pob_choice: your children
  chosen_korean: 당신의 아들들
  alternatives_korean:
  - 당신의 자녀들
  lexicon: BDAG
  rationale: 그리스어 복수 명사 υἱοί는 문자적으로 남성 복수이므로, POB의 성별-정확 원칙에 따라 ‘아들들’로 옮겼습니다.
- source_word: οὓς ἠγάπησας
  english_pob_choice: whom you loved
  chosen_korean: 당신이 사랑하신 이들이
  alternatives_korean:
  - 당신이 사랑하신 자들이
  - 당신이 사랑하신 이들
  lexicon: BDAG
  rationale: 하나님의 사랑의 대상을 자연스러운 한국어로 살리되, 직접 목적대명사 구조를 유지해 수식 관계를 분명히 했습니다.
- source_word: οὐχ αἱ γενέσεις τῶν καρπῶν
  english_pob_choice: not the produce of crops
  chosen_korean: 곡식의 산물이
  alternatives_korean:
  - 농산물
  - 열매의 산물이
  - 곡식의 소산이
  lexicon: LSJ
  rationale: γενέσεις와 καρπῶν의 농경적 뉘앙스를 살리면서도 현대 한국어에서 이해 가능한 표현으로 ‘곡식의 산물’을 택했습니다.
- source_word: τρέφουσιν ἄνθρωπον
  english_pob_choice: nourishes a man
  chosen_korean: 사람을 먹이는 것이 아니라
  alternatives_korean:
  - 사람을 기르는 것이 아니라
  - 한 사람을 살리는 것이 아니라
  lexicon: BDAG
  rationale: τρέφω의 ‘먹이다/양육하다’ 의미를 반영하되, 여기서는 생명을 유지하는 기능이 핵심이므로 자연스러운 동사구로 옮겼습니다. 단수의 일반적 인간을 ‘사람’으로 보존했습니다.
- source_word: τὸ ῥῆμά σου ... διατηρεῖ
  english_pob_choice: your word preserves
  chosen_korean: 당신의 말씀이 ... 지켜 주신다는 것
  alternatives_korean:
  - 당신의 말씀이 ... 보존하신다는 것
  - 당신의 말씀이 ... 보전하신다는 것
  lexicon: BDAG
  rationale: ῥῆμα는 ‘말씀/하신 말씀’으로 옮길 수 있으나, 한국어 문맥에서는 ‘당신의 말씀’이 자연스럽고 신학적으로도 적절합니다. διατηρέω는 단순 보존보다 보호·유지의 뉘앙스를 담아 ‘지켜 주시다’로 풀었습니다.
- source_word: τοὺς σοὶ πιστεύοντας
  english_pob_choice: those who trust in you
  chosen_korean: 당신을 믿는 이들
  alternatives_korean:
  - 당신께 의지하는 이들
  - 당신을 신뢰하는 이들
  lexicon: BDAG
  rationale: πιστεύω + 여격은 신뢰/의탁의 의미를 가질 수 있으나, 이 문맥에서는 ‘믿는 이들’이 가장 직접적으로 대응하며 한국어 성경체로도 자연스럽습니다.
theological_decisions:
- issue: 구약적 식량-말씀 대조와 신명기 8:3의 암시
  chosen_reading: 본문 자체의 대조 구조를 유지하고, 신명기 8:3을 직접 인용하지는 않았습니다.
  alternative_readings:
  - ‘사람이 떡으로만 살 것이 아니요’와 같은 명시적 신명기화
  - 각주 없이 암시를 약화시키는 번역
  rationale: 지혜서는 독자적인 진술을 하고 있으므로, 암시적 연결은 살리되 본문을 다른 성경 구절로 평준화하지 않는 것이 더 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3
- issue: ὁ ἄνθρωπον의 일반적 단수 표현 처리
  chosen_reading: ‘사람’으로 번역해 일반 인간을 대표하는 단수성을 유지했습니다.
  alternative_readings:
  - ‘인간’
  - ‘한 사람’
  - 복수화하여 ‘사람들’로 처리
  rationale: 그리스어 단수 일반표현의 대표성을 살리면서도 한국어에서 가장 자연스러운 보편 명사로 옮겼습니다.
  doctrine_reference: Translation philosophy §4
