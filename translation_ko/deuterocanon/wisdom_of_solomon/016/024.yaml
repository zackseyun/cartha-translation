  lexicon: LSJ
  rationale: εὐεργεσίαν은 ‘선행/유익/호의’의 결과를 가리키므로, 현대 한국어에서 자연스럽고 직설적인 ‘유익’이 가장 무난합니다.
theological_decisions:
- issue: 피조물의 도구성 vs. 자율성
  chosen_reading: 피조물은 창조주께 종속된 도구로서, 불의한 자들에 대한 형벌과 하나님을 신뢰하는 이들의 유익 둘 다에 쓰입니다.
  alternative_readings:
  - 피조물이 스스로 작동하는 중립적 자연 질서이다
  - 피조물이 단지 의인에게만 유익하게 작동한다
  rationale: ἡ γὰρ κτίσις σοι τῷ ποιήσαντι ὑπηρετοῦσα는 피조물이 창조주를 섬기는 상태로 제시하므로, 자율적 자연력처럼 만들지 않고 종속성을 분명히 했습니다.
