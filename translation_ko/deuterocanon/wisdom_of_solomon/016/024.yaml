translation:
  language: ko
  text: 그 까닭에 피조물은, 당신을 자기의 창조주로 섬기면서, 불의한 자들에 대한 형벌을 위해 스스로 긴장하고, 당신을 신뢰하는 이들을 위해서는 유익을 위해 느슨해집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘형벌을 더 강화하며 … 선익을 위해 풀어집니다.’ 그리스어는 ‘팽팽하게 당김’과 ‘느슨하게 풀림’의 대비되는 물리적 이미지를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κτίσις
