  - 당신을 자기의 만드신 이로
  - 당신, 그를 지으신 이로
  lexicon: LSJ
  rationale: σοι τῷ ποιήσαντι는 ‘당신, 곧 그것을 만드신 분’의 설명 구조이므로, 관계를 자연스럽게 풀어 ‘자기의 창조주로’라고 옮겼습니다.
- source_word: ἐπιτείνει
  english_pob_choice: strains itself
  chosen_korean: 스스로 긴장하고
  alternatives_korean:
  - 스스로 팽팽해지고
  - 스스로 힘을 모아
  - 스스로 더 세게 하고
  lexicon: LSJ
  rationale: 이 동사는 ‘팽팽하게 당기다/긴장시키다’의 물리적 이미지를 가지므로, POB의 ‘strains itself’를 따라 한국어에서도 긴장 상태의 비유를 보존했습니다.
- source_word: εἰς κόλασιν
  english_pob_choice: for the punishment of
  chosen_korean: 형벌을 위해
  alternatives_korean:
  - 징벌을 위해
  - 벌을 위해
  - 형벌로
  lexicon: LSJ
  rationale: κόλασις는 단순 교정이 아니라 형벌의 법정적 의미가 강하므로, ‘징벌’보다 직접적인 ‘형벌’을 택했습니다.
- source_word: ἀνίεται
