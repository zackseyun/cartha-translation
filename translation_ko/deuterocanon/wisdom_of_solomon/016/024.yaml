  rationale: 여기서는 인격화된 우주적 ‘창조물’ 전체를 가리키므로, 자연물 일반보다 범위가 분명한 ‘피조물’이 source의 전체성을 잘 살립니다.
- source_word: σοι τῷ ποιήσαντι
  english_pob_choice: you its maker
  chosen_korean: 당신을 자기의 창조주로
  alternatives_korean:
