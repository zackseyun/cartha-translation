base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/024.yaml
  text: For creation[a], serving you its maker, strains itself for the punishment of the unrighteous, and relaxes for the benefit of those who have put their trust in you.
  footnotes:
  - marker: a
    text: 'Or ''intensifies for punishment ... and is released for beneficence.'' The Greek uses contrasting physical imagery: creation is ''stretched'' toward punishment and ''loosened'' toward doing good.'
    reason: lexical_alternative
translation:
  language: ko
  text: 창조세계는 당신, 곧 그것을 지으신 분을 섬기면서, 불의한 자들을 벌하기 위해 팽팽히 긴장하고, 당신을 신뢰하는 이들에게 유익을 베풀기 위해 느슨해집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘형벌을 위해 더욱 팽팽해지며 … 유익을 베풀기 위해 풀어집니다.’ 그리스어는 창조세계가 형벌을 향해 ‘팽팽하게 당겨짐’과 선을 행하기 위해 ‘풀림’이라는 대비되는 물리적 이미지를 사용합니다.
    reason: lexical_alternative
