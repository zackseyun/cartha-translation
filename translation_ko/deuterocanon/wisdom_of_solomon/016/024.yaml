  chosen_korean: 느슨해집니다
  alternatives_korean:
  - 풀어집니다
  - 완화됩니다
  - 느슨해집니다
  lexicon: LSJ
  rationale: 앞의 ‘긴장하다’와 대구를 이루는 반대 동작을 살리기 위해, 물리적 이미지가 분명한 ‘느슨해집니다’를 선택했습니다.
- source_word: εἰς εὐεργεσίαν
  english_pob_choice: for the benefit of
  chosen_korean: 유익을 위해
  alternatives_korean:
