translation:
  language: ko
  text: 심지어 그들에게 무서운 들짐승의 격렬한 분노가 닥쳤을 때에도, 또 그들은 굽은 뱀들의 물림으로 파괴되고 있을 때에도, 주의 분노는 끝까지 머물지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘굽은 뱀들’, ‘뒤틀린 뱀들’. 그리스어 형용사는 문자적으로 ‘굽은’, ‘구부러진’을 뜻하며, 여기서는 도덕적 성질보다 뱀의 꼬불거리는 형상을 가리키는 것으로 보입니다.
