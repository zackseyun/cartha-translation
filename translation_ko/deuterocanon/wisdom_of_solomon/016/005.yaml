    issue: ‘뱀들의 물림으로 파괴되고 있을 때’라는 표현
    rationale: διεφθείροντο는 파괴·멸망의 진행을 뜻하지만, 물린 사람들이 ‘파괴되다’라는 표현은 한국어에서 부자연스럽습니다. ‘뱀들에게 물려 죽어 가고 있었다’가 진행성과 결과적 심각성을 자연스럽게 살립니다.
