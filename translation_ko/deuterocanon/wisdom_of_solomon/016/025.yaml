base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/025.yaml
  text: Therefore also at that time[a], changing itself into all things, it served your all-nourishing gift according to the desire of those in need[b];
  footnotes:
  - marker: a
    text: Or 'transforming itself in every way' for 'by changing itself into all things.' The Greek emphasizes remarkable adaptability in the heavenly provision.
    reason: lexical_alternative
  - marker: b
    text: Or 'according to the wish of those who asked,' since the Greek can point either to those in need or to those making request.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그때에도 그것은 모든 것으로 변하면서[a], 필요한 이들의[b] 바람에 따라 주님의 만물을 먹여 살리는 선물을 섬겼습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 면에서 변화하며’로도 옮길 수 있습니다. 그리스어는 ‘모든 것으로’라는 표현으로 놀라운 변형 또는 적응의 폭을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘청하는 이들’로도 옮길 수 있습니다. 그리스어는 ‘필요한 이들’ 또는 ‘요청하는 이들’을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο καὶ τότε
  english_pob_choice: Therefore also at that time
  chosen_korean: 그러므로 그때에도
  alternatives_korean:
  - 이 때문에 그때에도
  - 그러므로 또한 그때
  lexicon: LSJ
  rationale: 인과적 연결과 시간 부사를 함께 살리되, 현대 한국어에서는 ‘그때에도’가 자연스럽고 ‘καὶ’의 포함감도 유지합니다.
- source_word: μεταλλευομένη εἰς πάντα
  english_pob_choice: changing itself into all things
  chosen_korean: 여러 모습으로 변해 가며
  alternatives_korean:
  - 모든 것으로 변하며
  - 모든 것 안으로 바뀌며
  - 모든 것에 맞추어 변하며
  lexicon: LSJ
  rationale: 중간태 분사의 유동성과 기이한 적응성을 드러내기 위해 직역보다 ‘변해 가며’를 택했고, ‘into all things’는 한국어로는 자연스럽게 과도한 문자성을 피하면서도 변형의 폭을 살렸습니다.
- source_word: τῇ παντοτρόφῳ σου δωρεᾷ
  english_pob_choice: your all-nourishing gift
  chosen_korean: 주님의 모든 것을 먹여 살리는 선물
  alternatives_korean:
  - 주님의 만물을 먹여 살리는 선물
  - 주님의 전부를 길러 주는 선물
  - 주님의 모든 것을 기르는 선물
  lexicon: LSJ
  rationale: παντοτρόφος의 ‘모든 것을 먹여 살리는’ 의미를 살리면서, 본문 맥락의 하늘 양식을 염두에 두고 ‘선물’로 옮겼습니다.
- source_word: πρὸς τὴν τῶν δεομένων θέλησιν
  english_pob_choice: according to the desire of those in need
  chosen_korean: 필요한 이들의 바람에 따라
  alternatives_korean:
  - 간구하는 이들의 뜻에 따라
  - 필요한 이들의 소원에 따라
  - 요청하는 이들의 바람에 따라
  lexicon: LSJ
  rationale: δεομένων이 ‘필요한 이들’과 ‘청하는 이들’ 둘 다를 가능하게 하므로, POB의 긴장을 유지하면서도 한국어에서는 자연스럽게 포괄하는 표현을 택했습니다.
theological_decisions:
- issue: 변형 주체의 지시 대상
  chosen_reading: 주체를 본문이 말하는 ‘그것’으로 두어, 하늘 양식이 다양한 모습으로 변하며 필요한 이들에게 맞추어 섬겼다는 이미지를 보존했습니다.
  alternative_readings:
  - 명시적으로 ‘만나’라고 풀어 쓸 수 있음
  - 더 일반적으로 하늘의 공급 전체로 확장할 수 있음
  rationale: 전후 문맥상 만나를 가리키지만, 본문은 의도적으로 추상적 대명사와 시적 표현을 유지하므로 그 긴장을 그대로 두는 편이 원문에 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
