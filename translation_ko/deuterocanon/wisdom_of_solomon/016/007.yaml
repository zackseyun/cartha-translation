base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/007.yaml
  text: For the one who turned was saved not by what was seen[a], but by you[b], the Savior of all.
  footnotes:
  - marker: a
    text: Or, 'the one who turned around' or 'the one who returned.' The Greek participle emphasizes the act of turning toward the appointed sign.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'not through the thing being looked at, but through you.' The verse stresses that the visible object itself did not save; God did.
    reason: alternative_reading
translation:
  language: ko
  text: 돌아선 이는 보이는 것을 통하여 구원받은 것이 아니라, 모든 이의 구원자이신 당신을 통하여 구원받았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘보이는 것을 통하여가 아니라, 모든 이의 구원자이신 당신을 통하여’입니다. 보이는 대상 자체와 하나님을 구원의 수단으로 대조합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιστραφεὶς
  english_pob_choice: the one who turned
  chosen_korean: 돌아선 이
  alternatives_korean:
  - 돌아간 이
  - 돌아온 이
  - 돌이킨 이
  lexicon: BDAG
  rationale: 능동적 방향 전환의 뜻을 살리면서도, 회개를 단정하지 않고 문맥의 ‘표적을 향해 돌아섬’이라는 뉘앙스를 과도하게 좁히지 않기 위해 ‘돌아선 이’로 옮겼습니다.
- source_word: θεωρούμενον
  english_pob_choice: what was seen
  chosen_korean: 보이는 것
  alternatives_korean:
  - 보고 있던 것
  - 보인 것
  - 보아진 것
  lexicon: BDAG
  rationale: 수동적·상태적 의미를 자연스러운 한국어로 풀어, 눈앞의 가시적 대상을 가리키되 그 자체가 구원의 원인이 아님을 분명히 하도록 했습니다.
- source_word: ἐσώζετο
  english_pob_choice: was saved
  chosen_korean: 구원을 받은
  alternatives_korean:
  - 구원받고 있었습니다
  - 구원되었습니다
  - 구출되었습니다
  lexicon: BDAG
  rationale: 신학적 대조가 분명한 본문이므로 ‘구원’을 유지했고, 한국어에서는 수동 표현으로 의미를 자연스럽게 전달했습니다.
- source_word: σωτῆρα πάντων
  english_pob_choice: the Savior of all
  chosen_korean: 모든 이의 구원자
  alternatives_korean:
  - 모든 것의 구원자
  - 만민의 구원자
  - 모든 사람의 구원자
  lexicon: BDAG
  rationale: πάντων의 포괄성을 살리되 한국어에서 인격적 범위를 자연스럽게 드러내기 위해 ‘모든 이’로 옮겼습니다. ‘구원자’는 문맥의 신학적 무게를 가장 직접적으로 전달합니다.
theological_decisions:
- issue: 눈에 보이는 표적과 하나님 사이의 구원 원인 대조
  chosen_reading: 보이는 것 자체가 아니라 하나님께서 구원의 참된 원인이심을 드러내는 표현으로 유지했습니다.
  alternative_readings:
  - 보이는 표적이 도구적 매개로 작용했다는 식으로 완화함
  - 표적과 하나님을 모두 구원 원인으로 병치함
  rationale: 그리스어는 ‘οὐ διὰ τὸ θεωρούμενον ... ἀλλὰ διὰ σέ’로 명시적 대조를 이루므로, 표적의 역할을 지우지 않으면서도 구원의 궁극 원인을 하나님께 돌리는 구조를 보존했습니다.
  doctrine_reference: DOCTRINE.md § Preserve theological tension rather than resolve it
- issue: πάντων의 범위
  chosen_reading: ‘모든 이’로 옮겨 범위를 넓게 열어 두었습니다.
  alternative_readings:
  - ‘모든 사람’으로 좁힘
  - ‘만물’로 확장
  rationale: 원문은 범위를 더 구체화하지 않으므로, 인류 전체로 제한하거나 사물까지 확장하는 해석을 피하고 포괄성을 유지했습니다.
  doctrine_reference: DOCTRINE.md § Original-language primacy over translation tradition
