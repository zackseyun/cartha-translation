  text: For they were being pricked as a reminder of your sayings, and were quickly rescued, so that, after falling into deep forgetfulness, they might not become cut off from your beneficence.
translation:
  language: ko
  text: 그들은 주님의 말씀들을 상기시키기 위해 찔림을 받았고, 곧바로 구출되었습니다. 이는 그들이 깊은 망각에 빠져 주님의 은혜에서 끊어지지 않게 하려는 것이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λογίων σου
  english_pob_choice: your sayings
  chosen_korean: 주님의 말씀들
  alternatives_korean:
  - 주님의 말씀
  - 주님의 말씀하신 바
  - 당신의 말들
  lexicon: λόγιον
  rationale: POB의 'sayings'를 따라 단순한 단어보다 권위 있는 발화 단위를 살려 '말씀들'로 옮겼고, 문맥상 하나님의 말씀을 가리키므로 '주님'을 사용했습니다.
- source_word: ἐνεκεντρίζοντο
  english_pob_choice: were being pricked
  chosen_korean: 찔렸고
  alternatives_korean:
  - 찌름을 당했고
  - 자극을 받았고
  - 찔려 있었고
  lexicon: ἐγκεντρίζω
  rationale: 신체적·심리적 자극의 강한 이미지를 유지하되 한국어에서 자연스럽게 읽히도록 수동적 과거형 '찔렸고'로 옮겼습니다.
- source_word: διεσώζοντο
  english_pob_choice: were quickly rescued
  chosen_korean: 곧바로 구원을 받았으니
  alternatives_korean:
  - 곧바로 구원되었으니
  - 신속히 구출되었으니
  - 즉시 구원을 받았으니
  lexicon: διασῴζω
  rationale: POB의 'rescued'를 살리되 구약 문맥의 구원·구출을 함께 드러내기 위해 '구원을 받다'를 사용했고, 신속성을 '곧바로'로 반영했습니다.
- source_word: εὐεργεσίας
  english_pob_choice: beneficence
  chosen_korean: 자비로운 은혜
  alternatives_korean:
  - 은혜로운 선행
  - 선하심
  - 은혜
  lexicon: εὐεργεσία
  rationale: 단순한 호의보다 하나님이 베푸시는 선의와 은혜의 실질을 함께 담기 위해 '자비로운 은혜'로 옮겼습니다.
theological_decisions:
- issue: '''deep forgetfulness''와 ''cut off from your beneficence''의 관계'
  chosen_reading: 깊은 망각에 빠져 주님의 자비로운 은혜에서 끊어지지 않게 하려는 목적절 구조를 그대로 살렸습니다.
  alternative_readings:
  - 깊은 망각에 빠져 주님의 은혜를 잊지 않게 하려는 것
  - 깊은 망각에 빠져 주님의 선하심에서 떨어지지 않게 하려는 것
  rationale: 그리스어 ἵνα μή 절의 예방 목적을 분명히 보존해야 하며, 'cut off'의 단절성을 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 문맥상 징계와 구원의 목적을 드러내는 지혜문학의 인과 구조
