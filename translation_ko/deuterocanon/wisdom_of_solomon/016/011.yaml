  text: For they were being pricked as a reminder of your sayings, and were quickly rescued, so that, after falling into deep forgetfulness, they might not become cut off from your beneficence.
translation:
  language: ko
  text: 그들은 주님의 말씀들을 기억하게 하시는 표적으로 찔렸고, 곧바로 구원을 받았으니, 깊은 망각에 빠져 주님의 자비로운 은혜에서 끊어지지 않게 하려는 것이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '너의 말씀들/신탁들'에 가깝습니다. 여기서는 POB의 'sayings'를 따라 권위 있는 발화를 가리키는 표현으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: '''깊은 망각''은 단순한 건망이 아니라 하나님 말씀을 잊어버리는 영적 상태를 가리킵니다.'
    reason: source_note
