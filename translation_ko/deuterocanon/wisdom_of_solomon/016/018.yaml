translation:
  language: ko
  text: 한때는 불꽃이 억제되어서, 경건하지 않은 자들에게 보내진 짐승들을 태워 없애지 못하게 하였습니다. 그러나 그들 자신은 그것을 보면서, 하나님의 심판으로 몰리고 있음을 알게 하려는 것이었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘길들여져서’, ‘순해져서’, ‘누그러져서’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘경건하지 않은 자들에게 보내진 짐승들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘하나님의 심판으로 쫓기고 있음을’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεροῦτο
  english_pob_choice: was restrained
  chosen_korean: 억제되어서
  alternatives_korean:
  - 길들여져서
  - 순해져서
  - 누그러져서
  lexicon: LSJ
  rationale: 불꽃에 대해 ἡμεροῦτο의 ‘길들이다/온화하게 하다’ 의미를 살리되, 현대 한국어에서 자연스럽고 강한 억제의 의미를 주는 ‘억제되다’를 택했습니다.
- source_word: φλόξ
  english_pob_choice: flame
  chosen_korean: 불꽃
  alternatives_korean:
  - 화염
  - 불
  lexicon: LSJ
  rationale: φλόξ는 일반적인 불보다 ‘불꽃/화염’에 가깝지만, 여기서는 단수 주어의 이미지와 문맥을 살려 ‘불꽃’이 가장 자연스럽습니다.
- source_word: τὰ ἐπʼ ἀσεβεῖς ἀπεσταλμένα ζῷα
  english_pob_choice: the creatures sent against the ungodly
  chosen_korean: 경건하지 않은 자들에게 보내진 짐승들
  alternatives_korean:
  - 불경한 자들에게 파견된 동물들
  - 경건하지 않은 자들에게 내려진 생물들
  lexicon: LSJ
  rationale: ζῷα를 문맥상의 재앙 짐승으로 보아 ‘짐승들’로 옮겼고, ἀσεβεῖς는 Wisdom에서 반복되는 종교적·도덕적 어감을 살려 ‘경건하지 않은 자들’로 번역했습니다.
- source_word: θεοῦ κρίσει
  english_pob_choice: by the judgment of God
  chosen_korean: 하나님의 심판으로
  alternatives_korean:
  - 하나님의 판단으로
  - 하나님의 재판으로
  lexicon: LSJ
  rationale: κρίσις는 여기서 단순 판정이 아니라 하나님이 행하시는 사법적 심판을 뜻하므로 ‘심판’이 가장 적절합니다.
theological_decisions:
- issue: 불꽃과 짐승, 그리고 하나님의 심판의 관계
  chosen_reading: 불꽃은 짐승들을 태우지 못하도록 억제되었고, 경건하지 않은 자들은 그 광경을 통해 하나님의 심판 아래서 몰리고 있음을 알게 됩니다.
  alternative_readings:
  - 단순한 섭리적 상황으로 완화할 수 있음
  - 심판의 직접성을 더 강하게 드러낼 수 있음
  rationale: 본문의 θεοῦ κρίσει를 약화시키지 않으면서도, 불꽃의 억제와 짐승들의 작용이 심판의 맥락 안에 있음을 그대로 드러냈습니다.
  doctrine_reference: 하나님의 심판의 직접성 유지
