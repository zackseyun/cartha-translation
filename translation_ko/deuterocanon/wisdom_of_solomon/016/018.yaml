translation:
  language: ko
  text: 한때는 하나님께서 불꽃을 누그러지게 하셔서[a] 경건하지 않은 자들에게 보내진 짐승들[b]을 태워 없애지 않게 하셨습니다. 그러나 그들 자신은 그것을 보고, 자신들이 하나님의 심판에 의해 몰리고 있음을[c] 알게 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘길들이셔서’, ‘순하게 하셔서’, ‘누그러뜨리셔서’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘경건하지 않은 자들을 향해 보내진 짐승들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘하나님의 심판에 의해 쫓기고 있음을’ 또는 ‘몰아붙임을 받고 있음을’으로 옮길 수 있습니다.
    reason: lexical_alternative
