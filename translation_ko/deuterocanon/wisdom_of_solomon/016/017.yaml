  terminology: κόσμος는 본문에서 ‘세상’으로 유지할 수 있으나, 의인화된 ὑπέρμαχος는 ‘의인들을 위해 싸웁니다’로 옮겨 ‘편이다’보다 원문의 전투적·보호적 힘을 보존합니다. 각주에 ‘우주’ 및 ‘창조 세계’와 ‘옹호자/수호자’ 대안을 제시합니다.
