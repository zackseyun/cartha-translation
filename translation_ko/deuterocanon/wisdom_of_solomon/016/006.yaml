translation:
  language: ko
  text: 그러나 그들은 훈계를 위하여 잠시 괴로움을 겪었으며, 구원의 표징[a]을 지니고 있었습니다. 그 표징은 주님의 율법의 계명을 기억하게 하는 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구원의 상징’ 혹은 ‘구원의 표식’.
    reason: σύμβολον의 가능한 어휘 대안을 제시합니다.
lexical_decisions:
- source_word: εἰς νουθεσίαν
  english_pob_choice: as a warning
  chosen_korean: 경고를 받기 위해
  alternatives_korean:
  - 훈계를 받기 위해
  - 권면을 받기 위해
  lexicon: BDAG
  rationale: νουθεσία는 단순한 정보 전달보다 잘못을 바로잡기 위한 경고·훈계를 가리키므로, 자연스러운 현대 한국어로는 ‘경고를 받기 위해’가 가장 직접적입니다.
- source_word: πρὸς ὀλίγον
