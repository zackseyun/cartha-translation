translation:
  language: ko
  text: 그러나 그들은 잠시 동안 경고를 받기 위해 괴로워했습니다. 그들은 구원의 표징을 가지고 있었고, 그것은 당신의 율법의 명령을 기억하게 하려는 것이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구원의 상징’ 혹은 ‘구원의 표식’.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς νουθεσίαν
  english_pob_choice: as a warning
  chosen_korean: 경고를 받기 위해
  alternatives_korean:
  - 훈계를 받기 위해
  - 권면을 받기 위해
  lexicon: BDAG
  rationale: νουθεσία는 단순한 정보 전달보다 잘못을 바로잡기 위한 경고·훈계를 가리키므로, 자연스러운 현대 한국어로는 ‘경고를 받기 위해’가 가장 직접적입니다.
- source_word: πρὸς ὀλίγον
  english_pob_choice: for a short time
  chosen_korean: 잠시 동안
  alternatives_korean:
  - 잠깐
  - 짧은 동안
  lexicon: LSJ
  rationale: 지속 시간이 제한적임을 나타내므로, 현대 문장 흐름에 맞는 ‘잠시 동안’이 적절합니다.
- source_word: σύμβολον ἔχοντες σωτηρίας
  english_pob_choice: having a sign of salvation
  chosen_korean: 구원의 표징을 가지고 있었고
  alternatives_korean:
  - 구원의 상징을 가지고 있었고
  - 구원의 표식을 가지고 있었고
  lexicon: LSJ
  rationale: σύμβολον은 ‘상징’도 가능하지만, 여기서는 구원을 가리키는 가시적 표지라는 기능이 중요하므로 ‘표징’이 더 원문에 가깝습니다.
- source_word: εἰς ἀνάμνησιν ἐντολῆς νόμου σου
  english_pob_choice: for a reminder of the commandment of your law
  chosen_korean: 당신의 율법의 명령을 기억하게 하려는 것이었습니다
  alternatives_korean:
  - 당신의 율법의 명령을 상기시키기 위한 것이었습니다
  - 당신의 율법의 계명을 기억나게 하려는 것이었습니다
  lexicon: BDAG
  rationale: εἰς ἀνάμνησιν은 ‘기억나게 함/상기’의 목적을 나타내므로, 한국어에서는 목적절로 풀어 ‘기억하게 하려는 것’이 가장 자연스럽습니다.
theological_decisions:
- issue: σύμβολον의 의미를 ‘상징’으로 약화할지, 구체적 표지로 살릴지
  chosen_reading: 구원의 표징
  alternative_readings:
  - 구원의 상징
  - 구원의 표식
  rationale: 이 문맥은 단순한 추상적 상징보다 하나님의 구원 행위를 가리키는 실제적 표지의 성격이 강하므로, ‘표징’이 그 긴장을 가장 잘 보존합니다.
