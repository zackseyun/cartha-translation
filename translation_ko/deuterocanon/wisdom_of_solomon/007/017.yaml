translation:
  language: ko
  text: 그분 자신이 내게 존재하는 것들의 틀림없는 지식을 주셔서, 세계의 구조와 원소들의 작용을 알게 하셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘참된 지식’, ‘거짓 없는 지식’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘세계의 구성’이나 ‘우주의 배열’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 즉, 물질 세계를 이루는 기본 요소들을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: αὐτὸς
  english_pob_choice: he himself
  chosen_korean: 그분 자신이
  alternatives_korean:
  - 그가 직접
  - 그분이
  lexicon: BDAG
  rationale: 강조를 띤 대명사이므로 단순한 ‘그분이’보다 ‘그분 자신이’가 원문의 강조를 더 잘 살립니다.
- source_word: τῶν ὄντων
  english_pob_choice: the things that exist
  chosen_korean: 존재하는 것들
  alternatives_korean:
  - 존재하는 것들에 대한
  - 있는 것들
  - 실재하는 것들
  lexicon: BDAG
  rationale: 철학적 뉘앙스를 지나치게 만들지 않으면서도 존재론적 의미를 보존하려고 ‘존재하는 것들’로 옮겼습니다.
- source_word: γνῶσιν ἀψευδῆ
  english_pob_choice: unerring knowledge
  chosen_korean: 틀림없는 지식
  alternatives_korean:
  - 참된 지식
  - 거짓 없는 지식
  - 오류 없는 지식
  lexicon: BDAG
  rationale: ἀψευδής의 ‘거짓이 없음/틀림없음’이라는 뜻을 자연스러운 한국어로 압축해, 단순한 ‘참된’보다 신뢰성과 무오성을 함께 드러내는 ‘틀림없는’으로 옮겼습니다.
- source_word: σύστασιν κόσμου
  english_pob_choice: the structure of the world
  chosen_korean: 세계의 구조
  alternatives_korean:
  - 세계의 구성
  - 우주의 배열
  - 세상의 성립
  lexicon: LSJ
  rationale: σύστασις의 ‘구조, 구성, 성립’ 가운데 문맥상 가장 자연스러운 표현을 택해, 창조 세계의 질서와 짜임을 드러내는 ‘세계의 구조’로 번역했습니다.
- source_word: ἐνέργειαν στοιχείων
  english_pob_choice: the activity of the elements
  chosen_korean: 원소들의 작용
  alternatives_korean:
  - 원소들의 활동
  - 원소들의 운행
  - 기본 요소들의 작용
  lexicon: LSJ
  rationale: στοιχεῖα는 이 지혜 문맥에서 물질 세계의 기본 구성요소를 가리키므로, 현대 독자가 이해하기 쉬운 ‘원소들’로 옮겼고 ἐνέργεια는 ‘작용’으로 살렸습니다.
theological_decisions:
- issue: αὐτὸς의 지시 대상과 번역의 명시성
  chosen_reading: 문맥상 지혜를 주시는 분은 하나님이지만, 본문은 그분의 직접적 행위를 강조하는 형태를 유지합니다.
  alternative_readings:
  - ‘하나님 자신이’로 명시해 번역할 수 있음
  - 지시 대상을 덜 드러내는 ‘그가’로만 번역할 수 있음
  rationale: 원문의 강조점은 ‘누가 주셨는가’보다 ‘바로 그분이 친히 주셨다’에 있으므로, 신학적 해석은 유지하되 본문은 직접성만 드러내는 쪽이 원문에 더 가깝습니다.
  doctrine_reference: 원문 우선 원칙, 지혜의 주체로서의 하나님
- issue: ‘στοιχεῖα’의 범주
  chosen_reading: 물리적 세계의 기본 요소를 가리키는 말로 이해해 ‘원소들’로 옮겼습니다.
  alternative_readings:
  - ‘기본 요소들’
  - ‘초보적 원리들’
  rationale: 이 구절은 우주론적 지식의 범위를 말하므로, 추상적 ‘원리’보다 물질 세계의 요소를 가리키는 방향이 문맥에 더 잘 맞습니다.
  doctrine_reference: 창조 질서와 피조 세계에 대한 지혜의 인식
