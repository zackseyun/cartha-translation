  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/017.yaml
  text: For he himself gave me unerring knowledge of the things that exist[a], to know the structure of the world and the activity of the elements[c][b],
  footnotes:
  - marker: a
    text: Or 'true knowledge' or 'knowledge without falsehood.'
