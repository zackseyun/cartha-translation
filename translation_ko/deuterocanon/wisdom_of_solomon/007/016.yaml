  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/016.yaml
  text: For in his hand are both we and our words, and all understanding and knowledge of crafts.
  footnotes:
  - marker: a
    text: Or 'all prudence' for 'all understanding'; the Greek φρόνησις can denote practical wisdom or prudent understanding.
    reason: lexical_alternative
  - marker: b
    text: Or 'knowledge of skills,' 'knowledge of arts,' or 'knowledge of trades'; the Greek refers to knowledge connected with skilled work or craftsmanship.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분의 손 안에 우리와 우리의 말이 있으며, 모든 이해와 기술의 지식도 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 분별’로 옮길 수 있습니다. 헬라어 φρόνησις는 실제적 분별력이나 신중함을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘기술에 관한 지식’, ‘솜씨의 지식’으로 옮길 수 있습니다. 헬라어 ἐργατειῶν은 숙련된 일이나 공예적 작업과 관련된 지식을 가리킵니다.
    reason: lexical_alternative
