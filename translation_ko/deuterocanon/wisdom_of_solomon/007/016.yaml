translation:
  language: ko
  text: 그분의 손 안에는 우리와 우리의 말이 있고, 모든 분별력[a]과 온갖 기술에 관한 지식[b]도 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 이해’로 옮길 수 있습니다. 헬라어 φρόνησις는 실제적 분별력, 신중함, 또는 이해를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘온갖 공예에 관한 지식’, ‘여러 기예에 관한 지식’으로 옮길 수 있습니다. 헬라어 ἐργατειῶν은 숙련된 일, 기술, 또는 공예적 작업의 여러 영역을 가리킵니다.
    reason: lexical_alternative
