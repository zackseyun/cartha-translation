  source_fidelity: 첫 절에서 νύξ는 주어이고 τοῦτο는 목적어입니다. 현 번역 ‘이것은 밤이 뒤따르지만’도 문맥상 이해되지만, ‘이것’이 주제어가 되어 원문의 문법 관계가 다소 흐려집니다. ‘밤이 이것을 뒤따르지만’은 원문의 순차 관계와 암시된 선행사를 더 정확히 보존합니다. 둘째 절 ‘악은 지혜를 이기지 못합니다’는 κακία와 οὐκ ἀντισχύει σοφίας를 충실히 옮깁니다.
