translation:
  language: ko
  text: 이것은 밤이 뒤따르지만, 악은 지혜를 이기지 못합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘빛 뒤에는 밤이 따른다.’ 그리스어는 ‘이것’을 사용하여 앞절의 ‘빛’을 가리킵니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘악은 지혜를 당해내지 못합니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο
  english_pob_choice: this
  chosen_korean: 이것은
  alternatives_korean:
  - 이 빛은
  - 그것은
  lexicon: LSJ
  rationale: 그리스어는 지시대명사만 사용하므로, 앞절의 ‘빛’을 본문에 덧붙이지 않고 ‘이것은’으로 옮겨 앞문맥을 자연스럽게 가리키도록 했습니다.
- source_word: διαδέχεται
  english_pob_choice: succeeds
  chosen_korean: 뒤따르지만
  alternatives_korean:
  - 뒤를 잇지만
  - 이어지지만
  - 따르지만
  lexicon: LSJ
  rationale: ‘succeeds’의 순차적 의미를 살리되, 한국어에서 더 자연스럽고 문맥의 대비를 분명히 하는 표현으로 ‘뒤따르다’를 선택했습니다.
- source_word: οὐκ ἀντισχύει
  english_pob_choice: does not prevail against
  chosen_korean: 이기지 못합니다
  alternatives_korean:
  - 대항하여 이기지 못합니다
  - 맞서 이기지 못합니다
  - 당해내지 못합니다
  lexicon: LSJ
  rationale: ἀντισχύει는 ‘맞서 강하게 이기다/우세하다’는 뜻이므로, 한국어로는 ‘이기지 못합니다’가 가장 간결하게 힘의 대결과 결과를 드러냅니다.
- source_word: κακία
  english_pob_choice: evil
  chosen_korean: 악
  alternatives_korean:
  - 악행
  - 사악함
  - 악의
  lexicon: LSJ
  rationale: 지혜와 대조되는 포괄적 도덕 악을 가리키므로, 특정 행위로 좁히지 않는 ‘악’이 적절합니다.
theological_decisions:
- issue: 전절의 ‘빛’(implicit antecedent) 처리
  chosen_reading: 본문에는 ‘이것은’으로 두고, 앞문맥의 빛을 본문에 직접 삽입하지 않았습니다.
  alternative_readings:
  - 이 빛은 밤이 뒤따르지만, 악은 지혜를 이기지 못합니다.
  rationale: 그리스어가 명시적으로는 중성 지시대명사 τοῦτο만 사용하므로, 의미를 분명히 하되 본문에 없는 명사를 넣지 않는 쪽이 원문에 더 충실합니다.
  doctrine_reference: 번역 철학 §1, §5
- issue: ἀντισχύει의 경쟁/대항 이미지
  chosen_reading: ‘악은 지혜를 이기지 못합니다’로 옮겨 지혜의 우위를 분명히 했습니다.
  alternative_readings:
  - 악은 지혜를 당해내지 못합니다.
  - 악은 지혜를 대적하여 이기지 못합니다.
  rationale: 이 구절은 지혜와 악의 대결에서 지혜가 패하지 않는다는 점을 말하므로, 과도한 해석을 피하면서도 힘의 대비를 분명히 드러내는 표현이 적절합니다.
  doctrine_reference: 번역 철학 §6
