base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/003.yaml
  text: And I too, when I was born, drew in the common air, and fell upon the earth that suffers alike with all; and my first voice was the same as everyone's, as I cried.
  footnotes:
  - marker: a
    text: Or 'the air shared by all.' The Greek phrase emphasizes that the speaker entered the same human life as everyone else.
    reason: lexical_alternative
  - marker: b
    text: The adjective rendered 'that suffers alike with all' can also mean 'subject to the same experiences' or 'of like condition.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 저도 태어나면서, 모두가 함께 쓰는 공기를 들이마시고, 모두와 같은 운명의 땅에 떨어졌으며, 첫 목소리도 모든 사람과 같았으니, 울면서였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘모두와 함께 나누는 공기’입니다.
    reason: lexical_alternative
  - marker: b
    text: ὁμοιοπαθῆ는 ‘같은 경험을 겪는’, ‘같은 조건에 놓인’이라는 뜻도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος
  english_pob_choice: when I was born
  chosen_korean: 태어나면서
  alternatives_korean:
  - 내가 생겨나면서
  - 내가 태어났을 때
  lexicon: LSJ
  rationale: 출생 맥락에서 γενόμενος는 단순한 ‘존재하게 됨’보다 인간으로 세상에 들어오는 사건을 가리키므로, 자연스러운 현대 한국어로 시간 부사화해 옮겼습니다.
- source_word: τὸν κοινὸν ἀέρα
  english_pob_choice: the common air
  chosen_korean: 모두가 함께 쓰는 공기
  alternatives_korean:
  - 공통의 공기
  - 모든 사람이 나누는 공기
  lexicon: LSJ
  rationale: κοινός의 ‘공통의/공유되는’ 의미를 살리되, 한국어에서 ‘공통의 공기’보다 ‘모두가 함께 쓰는 공기’가 더 분명하게 공동 인성을 드러냅니다.
- source_word: ἐπὶ τὴν ὁμοιοπαθῆ ... γῆν
  english_pob_choice: upon the earth that suffers alike with all
  chosen_korean: 모두와 같은 운명의 땅
  alternatives_korean:
  - 모두와 같은 경험을 겪는 땅
  - 모든 이와 같은 상태의 땅
  - 같은 고난을 겪는 땅
  lexicon: LSJ
  rationale: ὁμοιοπαθής는 ‘같은 경험/감정/고난을 겪는’ 뜻이 있어 단순히 ‘같은 땅’으로 약화하지 않고, 본문의 공통 인간성 강조를 살려 ‘같은 운명의 땅’으로 옮겼습니다.
- source_word: πρώτην φωνὴν τὴν ὁμοίαν πᾶσιν
  english_pob_choice: my first voice was the same as everyone's
  chosen_korean: 첫 목소리도 모든 사람과 같았으니
  alternatives_korean:
  - 첫 음성도 모두와 같았으니
  - 처음 낸 소리도 모든 사람과 같았으니
  lexicon: LSJ
  rationale: φωνή는 ‘목소리/소리’이지만, 뒤의 κλαίων과 결합될 때 첫 울음의 뉘앙스를 포함하므로 ‘첫 목소리’로 두어 반복을 줄이면서도 첫 발성을 살렸습니다.
theological_decisions:
- issue: 지혜자의 출생과 보편적 인간성의 강조
  chosen_reading: 이 절은 지혜자가 태어날 때부터 모든 사람과 같은 공기와 같은 땅, 같은 첫 목소리를 공유했다고 말하는 것으로, 특별한 신분을 누그러뜨리고 보편적 인간성에 강하게 초점을 둡니다.
  alternative_readings:
  - 왕적·초월적 어조를 살려 인간성의 평범함을 약화하는 읽기
  rationale: 원문은 κοινόν, ὁμοιοπαθῆ, ὁμοίαν πᾶσιν으로 반복해서 ‘공통성’을 강조하므로, 번역도 그 긴장을 유지해야 합니다.
  doctrine_reference: 'DOCTRINE.md: Original-language primacy; Preserve theological tension rather than resolve it'
