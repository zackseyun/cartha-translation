  rationale: 문맥상 솔로몬을 포함한 인간 보편 조건을 강조하므로, 과도하게 형이상학적 표현으로 확장하지 않고 원문의 평준화 효과를 유지했습니다.
  doctrine_reference: 원문 우선, 문맥 우선; 인간의 보편적 출생 조건을 강조하는 지혜문학적 진술
