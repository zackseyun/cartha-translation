  - 식물의 구별들
  - 식물의 다양성
  lexicon: LSJ
  rationale: διαφορά는 구별, 차이, 다양성을 뜻하므로, 목록 문맥에서는 ‘여러 종류들’이 가장 읽기 쉽고 분류적 뉘앙스를 잘 살립니다.
- source_word: δυνάμεις ῥιζῶν
  english_pob_choice: the powers of roots
  chosen_korean: 뿌리들의 능력들
  alternatives_korean:
  - 뿌리들의 힘들
  - 뿌리들의 작용들
  - 뿌리들의 효능들
  lexicon: LSJ
  rationale: δύναμις는 능력, 작용력, 효력을 뜻하므로, 뿌리의 내재적 효능을 드러내는 ‘능력들’이 가장 무난합니다.
theological_decisions:
- issue: πνευμάτων βίας의 의미 범위
  chosen_reading: 자연 현상인 ‘바람의 힘들’로 옮기되, 원어의 이중 가능성은 보존합니다.
  alternative_readings:
  - 영들의 힘들
  - 폭풍의 힘들
  - 바람들의 폭력
  rationale: 본문은 창조 세계에 대한 지식 항목들을 나열하므로, πνεῦμα를 ‘바람’으로 읽는 것이 문맥상 가장 자연스럽습니다. 다만 원어가 ‘영’의 뜻도 가질 수 있어 해석의 여지는 남아 있습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
