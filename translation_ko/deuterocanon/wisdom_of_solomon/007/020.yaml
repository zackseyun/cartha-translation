translation:
  language: ko
  text: 동물의 본성들과 들짐승의 성질들, 바람의 힘들과 사람의 사고들, 식물의 여러 종류들과 뿌리들의 능력들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영들의 힘들’로도 옮길 수 있습니다. 그리스어 πνευμάτων은 ‘영들’ 또는 ‘바람들’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: φύσεις
  english_pob_choice: natures
  chosen_korean: 본성들
  alternatives_korean:
  - 자연들
  - 본질들
  - 성질들
  lexicon: LSJ
  rationale: φύσις는 여기서 생물의 내적 성질이나 타고난 특성을 가리키므로, 현대 한국어에서는 ‘본성’이 가장 자연스럽게 해당 의미를 살립니다.
- source_word: θυμοὺς θηρίων
  english_pob_choice: the tempers of wild beasts
  chosen_korean: 들짐승의 성질들
  alternatives_korean:
  - 들짐승의 기질들
  - 들짐승의 성미들
  - 들짐승의 성격들
  lexicon: LSJ
  rationale: θυμός는 감정적 격정보다 성향·기질의 뜻이 강하므로, ‘성질’이 본문 목록의 분류적 성격을 잘 드러냅니다.
- source_word: πνευμάτων βίας
  english_pob_choice: the forces of spirits
  chosen_korean: 바람의 힘들
  alternatives_korean:
  - 영들의 힘들
  - 영들의 폭력
  - 바람들의 폭력
  lexicon: LSJ
  rationale: πνεῦμα가 ‘영’과 ‘바람’ 모두를 가질 수 있고, βία가 ‘힘/강함’의 뜻을 띨 수 있으므로, 자연 현상 목록의 맥락을 살려 ‘바람의 힘들’로 옮겼습니다.
- source_word: διαλογισμοὺς ἀνθρώπων
  english_pob_choice: the reasonings of men
  chosen_korean: 사람의 사고들
  alternatives_korean:
  - 사람들의 추론들
  - 사람들의 생각들
  - 사람의 이성 작용들
  lexicon: LSJ
  rationale: διαλογισμός는 생각, 숙고, 추론의 과정을 가리키므로, ‘사고들’이 보다 넓고 자연스럽게 해당 의미를 전달합니다.
- source_word: διαφορὰς φυτῶν
  english_pob_choice: the varieties of plants
  chosen_korean: 식물의 여러 종류들
  alternatives_korean:
  - 식물의 차이들
  - 식물의 구별들
  - 식물의 다양성
  lexicon: LSJ
  rationale: διαφορά는 구별, 차이, 다양성을 뜻하므로, 목록 문맥에서는 ‘여러 종류들’이 가장 읽기 쉽고 분류적 뉘앙스를 잘 살립니다.
- source_word: δυνάμεις ῥιζῶν
  english_pob_choice: the powers of roots
  chosen_korean: 뿌리들의 능력들
  alternatives_korean:
  - 뿌리들의 힘들
  - 뿌리들의 작용들
  - 뿌리들의 효능들
  lexicon: LSJ
  rationale: δύναμις는 능력, 작용력, 효력을 뜻하므로, 뿌리의 내재적 효능을 드러내는 ‘능력들’이 가장 무난합니다.
theological_decisions:
- issue: πνευμάτων βίας의 의미 범위
  chosen_reading: 자연 현상인 ‘바람의 힘들’로 옮기되, 원어의 이중 가능성은 보존합니다.
  alternative_readings:
  - 영들의 힘들
  - 폭풍의 힘들
  - 바람들의 폭력
  rationale: 본문은 창조 세계에 대한 지식 항목들을 나열하므로, πνεῦμα를 ‘바람’으로 읽는 것이 문맥상 가장 자연스럽습니다. 다만 원어가 ‘영’의 뜻도 가질 수 있어 해석의 여지는 남아 있습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
