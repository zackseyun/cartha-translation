  rationale: θυμός는 감정적 격정보다 성향·기질의 뜻이 강하므로, ‘성질’이 본문 목록의 분류적 성격을 잘 드러냅니다.
- source_word: πνευμάτων βίας
  english_pob_choice: the forces of spirits
  chosen_korean: 바람의 힘들
  alternatives_korean:
