  text: And I rejoiced in them all, because wisdom leads them; but I did not know that she is their mother.
translation:
  language: ko
  text: 나는 모든 것에서 기뻐했습니다. 왜냐하면 지혜가 그들을 이끌기 때문입니다. 그러나 나는 지혜가 그들의 어머니인 줄은 알지 못했습니다.
  philosophy: formal
lexical_decisions:
- source_word: εὐφράνθην ἐπὶ πάντων
  english_pob_choice: And I rejoiced in them all
  chosen_korean: 나는 모든 것에서 기뻐했습니다
  alternatives_korean:
  - 나는 그들 모두를 기뻐했습니다
  - 나는 그 모든 것들로 인해 기뻐했습니다
  lexicon: εὐφραίνω
  rationale: 기쁨의 상태를 자연스러운 합쇼체 서술로 옮기되, ἐπὶ πάντων의 포괄성을 살려 ‘모든 것에서’로 처리했습니다.
- source_word: σοφία ἡγεῖται
  english_pob_choice: wisdom leads them
  chosen_korean: 지혜가 그들을 이끌기 때문입니다
  alternatives_korean:
  - 지혜가 그들을 인도하기 때문입니다
  - 지혜가 그들 앞에 서기 때문입니다
  lexicon: ἡγέομαι
  rationale: ἡγεῖται는 단순한 동반보다 선도·지배의 뉘앙스가 있어, 문맥상 ‘이끌다’가 가장 직접적입니다.
- source_word: γένεσίν εἶναι τούτων
  english_pob_choice: she is their mother
  chosen_korean: 지혜가 그들의 어머니인 줄은
  alternatives_korean:
  - 지혜가 이들의 근원인 줄은
  - 지혜가 이것들의 출생 원인인 줄은
  lexicon: γένεσις
  rationale: 영문 POB의 확정된 보정처럼, 본문은 단순한 추상적 ‘근원’보다 생명 발생의 관계를 가리키므로 ‘어머니’가 원문의 충격과 의인화를 가장 잘 보존합니다.
theological_decisions:
- issue: 지혜의 의인화와 모성 표상
  chosen_reading: 지혜를 ‘어머니’로 번역해 지혜의 인격적·생산적 역할을 그대로 드러냈습니다.
  alternative_readings:
  - 지혜를 ‘근원’으로 완화해 번역하는 방식
  - 지혜를 비유적으로만 처리하는 방식
  rationale: 영문 POB의 개정이 ‘mother’로 되돌아간 점을 따라, 본문의 의인화와 생명 기원의 강한 표현을 희석하지 않기 위함입니다.
  doctrine_reference: 잠 8장 및 지혜문학의 지혜 의인화 전통
- issue: 주어 대명사 처리
  chosen_reading: ‘그들을’로 받아 앞절의 복수 대상을 유지했습니다.
  alternative_readings:
  - ‘이것들을’로 일반화하는 방식
  - 대상을 생략하는 방식
  rationale: 그리스어 αὐτῶν과 τούτων의 복수 지시를 살려, 지혜가 복수의 대상들을 이끄는 문맥을 분명히 했습니다.
  doctrine_reference: 지혜문학의 서술 일관성
