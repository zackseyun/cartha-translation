lexical_decisions:
- source_word: ἐν σπαργάνοις
  english_pob_choice: in swaddling cloths
  chosen_korean: 포대기에 싸여
  alternatives_korean:
  - 포대기 속에서
  - 포대기에 감싸여
  - 포대기 옷에 싸여
  lexicon: LSJ
  rationale: σπάργανα는 영아를 싸는 천이나 띠를 가리키므로, 한국어에서는 자연스럽고 구체적인 ‘포대기’로 옮겨 유아기의 이미지를 살렸습니다.
