  - 기워졌고
  lexicon: BDAG/LSJ
  rationale: 수동형 aorist는 ‘길러지다/양육되다’의 의미를 가지므로, 형식적이면서도 현대 한국어에서 자연한 ‘길러졌고’로 표현했습니다.
- source_word: φροντίσιν
