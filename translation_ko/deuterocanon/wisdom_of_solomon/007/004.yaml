  - 염려와 함께
  - 주의와 함께
  lexicon: LSJ
  rationale: φροντίς는 돌봄, 관심, 염려까지 아우를 수 있으나, 이 문맥에서는 유아를 둘러싼 돌봄의 의미가 가장 자연스러워 ‘보살핌’으로 옮겼습니다.
theological_decisions:
- issue: φροντίσιν의 중의성 보존
  chosen_reading: ‘보살핌’으로 옮기되, 돌봄과 관심의 일반적 의미를 열어 둡니다.
  alternative_readings:
  - ‘걱정’으로 좁혀 번역
  - ‘주의’ 또는 ‘관심’으로 번역
  rationale: 이 구절은 화자가 평범한 인간의 유아기를 말하는 문맥이므로, 지나치게 불안·근심 쪽으로 몰지 않고 돌봄의 뉘앙스를 남기는 것이 원문 범위에 더 충실합니다.
  doctrine_reference: '번역 원칙: 해석을 과도하게 확정하지 않고 원문의 의미 범위를 보존'
