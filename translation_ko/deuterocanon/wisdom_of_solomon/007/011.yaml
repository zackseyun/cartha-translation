translation:
  language: ko
  text: 그러나 나에게는 그녀와 함께 모든 좋은 것들이 함께 왔고, 헤아릴 수 없는 부가 그녀의 손 안에 있었습니다;[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉, 앞 문맥에서 여성으로 의인화된 지혜와 함께였습니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘헤아릴 수 없는 부’ 또는 ‘셀 수 없는 재물’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  english_pob_choice: came
  chosen_korean: 왔습니다
  alternatives_korean:
  - 도착했습니다
  - 들어왔습니다
  lexicon: BDAG
  rationale: ἔρχομαι의 단순 과거로서, 여기서는 ‘좋은 것들’이 화자에게 이르렀다는 뜻이므로 자연스러운 ‘왔습니다’가 원문을 무리 없이 살립니다.
- source_word: τὰ ἀγαθὰ
  english_pob_choice: good things
  chosen_korean: 좋은 것들
  alternatives_korean:
  - 유익한 것들
  - 복된 것들
  - 선한 것들
  lexicon: BDAG
  rationale: 범위가 넓은 중성 복수이므로 물질적 재산으로 좁히지 않고, POB의 ‘good things’에 맞춰 포괄적으로 옮겼습니다.
- source_word: ὁμοῦ πάντα
  english_pob_choice: all ... together
  chosen_korean: 모든 ... 함께
  alternatives_korean:
  - 모두 동시에
  - 다 함께
  lexicon: LSJ
  rationale: 전부성과 동시성을 함께 드러내는 표현이어서, 한국어에서도 ‘모든 … 함께’로 어순과 강조를 살렸습니다.
- source_word: ἀναρίθμητος πλοῦτος
  english_pob_choice: wealth beyond counting
  chosen_korean: 헤아릴 수 없는 부
  alternatives_korean:
  - 셀 수 없는 부
  - 계산할 수 없는 부
  - 헤아릴 수 없는 재물
  lexicon: LSJ
  rationale: ἀναρίθμητος의 ‘헤아릴 수 없음’과 πλοῦτος의 ‘부/재물’을 함께 살려, POB의 과장된 풍성을 자연스럽게 전달했습니다.
theological_decisions:
- issue: ἐν ταῖς χερσὶν αὐτῆς의 여성 인칭과 지시 대상
  chosen_reading: ‘그녀’는 앞문맥의 의인화된 지혜를 가리키며, 본문에서 그 여성적 인칭을 그대로 보존했습니다.
  alternative_readings:
  - 문맥을 풀어 ‘지혜의 손 안에’라고 명시할 수 있음
  rationale: 지혜의 인격화라는 문학적-신학적 장치를 해치지 않기 위해, 해설을 본문 안에 과도하게 삽입하지 않고 여성 인칭을 유지했습니다.
  doctrine_reference: 의인화된 지혜의 문학적 형상 보존; 원문 우선 원칙
