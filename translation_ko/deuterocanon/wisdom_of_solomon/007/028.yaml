  lexicon: BDAG
  rationale: 하나님의 태도를 단순 선호가 아니라 ‘사랑’으로 직접 옮겨, 본문의 신학적 무게를 살렸습니다.
- source_word: τὸν ... συνοικοῦντα
  english_pob_choice: the one who lives with
  chosen_korean: 지혜와 함께 사는 이
  alternatives_korean:
  - 지혜와 함께 거하는 이
  - 지혜와 동거하는 이
  - 지혜와 더불어 사는 이
  lexicon: LSJ
  rationale: 분사구를 사람을 가리키는 명사구로 풀되, συνοικέω의 지속적 동거·동행의 뉘앙스를 살려 ‘함께 사는 이’로 옮겼습니다.
- source_word: σοφίᾳ
  english_pob_choice: wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 지혜(지혜로 의인화된 존재)
  - 지혜의 인격화된 형상
  lexicon: BDAG
  rationale: 이 문맥에서 σοφία는 강하게 의인화되지만, 본문 자체는 소문자/대문자 구분을 주지 않으므로 한국어에서는 기본 명사 ‘지혜’로 두어 의인화 긴장을 보존했습니다.
