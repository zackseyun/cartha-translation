  rationale: 영문 POB도 Wisdom 대문자화를 피하며 해석을 과잉 고정하지 않았습니다. 한국어도 동일하게 두어, 문맥의 인격화와 본문 표면을 함께 보존합니다.
  doctrine_reference: 해석을 과도하게 고정하지 말고 본문이 주는 문학적-신학적 긴장을 유지합니다.
