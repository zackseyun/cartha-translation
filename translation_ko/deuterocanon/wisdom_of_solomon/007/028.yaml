lexical_decisions:
- source_word: οὐθὲν
  english_pob_choice: nothing
  chosen_korean: 아무것도
  alternatives_korean:
  - 아무도
  - 무엇도
  lexicon: LSJ
  rationale: 중성 단수의 절대적 목적어를 한국어에서는 자연스럽게 ‘아무것도’로 옮겨, 예외 절과의 대비를 분명히 했습니다.
- source_word: ἀγαπᾷ
