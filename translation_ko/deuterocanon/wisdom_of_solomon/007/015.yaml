theological_decisions:
- issue: τῶν δεδομένων의 범위
  chosen_reading: 하나님이 주신 것들을 일반적으로 가리키는 열린 표현으로 유지했습니다.
  alternative_readings:
  - 주신 은사들
  - 전해진 가르침
  rationale: 그리스어가 대상을 구체화하지 않으므로, 특정 교리적 대상(은사나 전승)으로 좁히지 않고 본문의 폭을 보존했습니다.
  doctrine_reference: Translation philosophy 1, 3, 5
- issue: 하나님과 지혜로운 이들 사이의 관계
  chosen_reading: 하나님은 지혜의 인도자이실 뿐 아니라 지혜로운 이들을 바로잡는 분으로 제시됩니다.
  alternative_readings:
  - 지혜로운 이들을 이끄는 분
  - 지혜로운 이들을 훈육하는 분
  rationale: διορθωτής의 교정적 힘을 약화시키지 않기 위해, 단순한 ‘인도’보다 ‘바로잡음’을 택해 지혜조차 하나님께 의존한다는 긴장을 살렸습니다.
  doctrine_reference: Translation philosophy 1 and 3
