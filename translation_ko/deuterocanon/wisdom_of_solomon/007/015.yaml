  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/015.yaml
  text: But may God grant me to speak with sound judgment and to think in a manner worthy of the things given[c][b][a], because he himself is both the guide of wisdom and the one who sets the wise right.
  footnotes:
  - marker: a
    text: Or 'to speak according to understanding.' The Greek phrase can denote speech in keeping with sound judgment or understanding.
    reason: lexical_alternative
  - marker: b
    text: Or 'of what has been given' or 'of the gifts given.' The Greek leaves the object broad rather than specifying it.
    reason: lexical_alternative
  - marker: c
    text: Or 'corrector of the wise' or 'director of the wise.' The term denotes one who sets straight or guides rightly.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 하나님께서 제게 분별 있게[a] 말하고, 주어진 것들에[b] 합당한 생각을 하도록 허락해 주시기를 바랍니다. 그분 자신이 지혜의 인도자이시며 지혜로운 이들을 바로잡는 분[c]이시기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이해에 따라 말하게’. 그리스어 표현은 건전한 판단이나 이해에 맞추어 말하는 것을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주어진 것에 대해’ 또는 ‘주어진 은사들에 대해’. 그리스어는 그 대상을 넓게 열어 둡니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘지혜로운 이들의 교정자’ 또는 ‘지혜로운 이들의 안내자’. 이 말은 바로잡거나 바르게 이끄는 분을 가리킵니다.
    reason: lexical_alternative
