translation:
  language: ko
  text: 저도 또한 모든 사람과 같은 죽을 인간이며, 땅에서 난 첫 사람의 후손입니다[a]. 그리고 어머니의 태 안에서는 살로 빚어졌습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘첫 사람’은 아담을 가리키는 말입니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘살이 되도록 빚어졌습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: θνητὸς
  english_pob_choice: mortal
  chosen_korean: 죽을 인간
  alternatives_korean:
  - 필멸의 인간
  - 죽을 수밖에 없는 인간
  lexicon: LSJ
  rationale: 단순한 ‘인간’보다 죽음의 가능성과 유한성을 드러내도록 ‘죽을 인간’으로 옮겼습니다.
- source_word: ἴσος ἅπασιν
  english_pob_choice: equal to all
  chosen_korean: 모든 사람과 같은
  alternatives_korean:
  - 모든 사람과 동등한
  - 누구와도 같은
  lexicon: LSJ
  rationale: 사람들 사이의 보편적 동일한 지위를 나타내므로, 한국어에서는 자연스럽게 ‘모든 사람과 같은’으로 풀었습니다.
- source_word: γηγενοῦς ἀπόγονος πρωτοπλάστου
  english_pob_choice: a descendant of the earth-born first-formed man
  chosen_korean: 땅에서 난 첫 사람의 후손
  alternatives_korean:
  - 흙에서 난 처음 지음 받은 사람의 후손
  - 땅에서 난 첫 조상의 후손
  lexicon: LSJ
  rationale: ‘earth-born’와 ‘first-formed’의 이미지를 살리되, 본문이 직접 이름을 말하지 않으므로 ‘첫 사람’으로 설명적으로 옮겼습니다.
- source_word: ἐγλύφην σάρξ
  english_pob_choice: I was molded into flesh
  chosen_korean: 살로 빚어졌습니다
  alternatives_korean:
  - 살로 형성되었습니다
  - 살로 지음 받았습니다
  lexicon: LSJ
  rationale: 태 안에서 형성되는 수동적 이미지를 살리기 위해 ‘빚어지다’를 사용했고, σάρξ는 여기서 문자적 의미의 ‘살’로 옮겼습니다.
theological_decisions:
- issue: 프로토플라스투(πρωτοπλάστου)의 아담 암시 처리
  chosen_reading: 본문에는 ‘첫 사람’으로 두고, 아담이라는 이름은 본문 밖에서만 인지할 수 있게 했습니다.
  alternative_readings:
  - 아담
  - 첫 지음 받은 사람
  rationale: 그리스어는 고유명사가 아니라 설명적 표현을 쓰므로, 번역문에서도 그 표현 자체를 보존하는 편이 원문에 더 가깝습니다.
  doctrine_reference: 원문 우선 원칙; 번역이 본문이 말하지 않는 고유명을 본문 안에 추가하지 않음
