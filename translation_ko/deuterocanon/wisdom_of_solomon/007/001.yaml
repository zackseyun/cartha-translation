  text: 저 역시 모든 사람과 동등한 죽을 인간이며, 땅에서 난 처음 지음 받은 이의 후손입니다[a]. 또한 어머니의 태 속에서 육신으로 빚어졌습니다[b].
  philosophy: optimal-equivalence
  footnotes:
