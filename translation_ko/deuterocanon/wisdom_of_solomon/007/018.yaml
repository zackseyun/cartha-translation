- source_word: μεσότητα
  english_pob_choice: middle
  chosen_korean: 중간
  alternatives_korean:
  - 가운데
  - 중심
  lexicon: BDAG
  rationale: ‘시작-끝-중간’의 평행 구조를 살리기 위해, 명사적이면서도 현대 한국어에서 자연스러운 ‘중간’을 선택했습니다.
- source_word: τροπῶν
  english_pob_choice: seasons
  chosen_korean: 계절의 변동
  alternatives_korean:
  - 일출·일몰의 전환
  - 솔스티스(하지·동지)
  lexicon: LSJ
  rationale: 영문 POB는 한 차례 해석을 거쳐 ‘seasons’로 넓게 잡았으므로, 한국어도 과도하게 천문학적으로 좁히지 않고 계절의 변화 양상으로 옮겼습니다.
- source_word: καιρῶν
  english_pob_choice: times
  chosen_korean: 시기
  alternatives_korean:
  - 때
  - 정해진 때
  lexicon: BDAG
  rationale: τροπαί와 구별되는 δεύτερος 항목으로, 단순 반복어 ‘때’보다 사건에 맞는 ‘시기’가 더 구분감 있게 대응합니다.
