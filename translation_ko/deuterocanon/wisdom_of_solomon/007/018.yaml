lexical_decisions:
- source_word: ἀρχὴν
  english_pob_choice: beginning
  chosen_korean: 시작
  alternatives_korean:
  - 처음
  - 기원
  lexicon: BDAG
  rationale: 문맥상 시간의 배열 속 첫 지점을 가리키므로, 추상적인 ‘기원’보다 ‘시작’이 더 자연스럽고 대응성이 좋습니다.
- source_word: τέλος
