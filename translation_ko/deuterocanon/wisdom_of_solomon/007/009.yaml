base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/009.yaml
  text: Nor did I compare to her any precious stone[a], because all gold in her sight is a little sand[b], and silver will be regarded as clay before her.
  footnotes:
  - marker: a
    text: Or 'a priceless stone.' The Greek expression denotes a stone of inestimable value.
    reason: lexical_alternative
  - marker: b
    text: Literally 'little sand'; the sense is that gold is of negligible worth compared with wisdom.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 지혜와 값으로 헤아릴 수 없는 어떤 돌도 견주지 않았습니다[a]. 지혜 앞에서 모든 금은 한 줌의 모래에 지나지 않으며[b], 은은 지혜 앞에서 흙처럼 여겨질 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘값을 매길 수 없는 돌’입니다. 그리스어 표현은 값을 헤아릴 수 없을 만큼 귀한 돌을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘적은 모래’입니다. 이는 지혜에 비하면 금의 가치가 매우 미미하다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ ὡμοίωσα
  english_pob_choice: Nor did I compare
  chosen_korean: 그분과도 어떤 …을 견주지 않았습니다
  alternatives_korean:
  - 그분과도 비교하지 않았습니다
  - 그분과도 견주어 보지 않았습니다
  lexicon: LSJ
  rationale: ὁμοιόω는 ‘비교하다/견주다’의 뜻이므로, 한국어로는 자연스러운 ‘견주다’로 옮겨 대조 행위를 살렸습니다.
- source_word: λίθον ἀτίμητον
  english_pob_choice: any precious stone
  chosen_korean: 어떤 값비싼 돌
  alternatives_korean:
  - 어떤 보석
  - 어떤 값으로 헤아릴 수 없는 돌
  lexicon: LSJ
  rationale: ἀτίμητος는 ‘값으로 헤아릴 수 없는’이라는 뜻이지만, 문맥상 지혜와의 비교에서 귀중함을 강조하므로 ‘값비싼 돌’로 자연스럽게 옮겼습니다.
- source_word: ψάμμος ὀλίγη
  english_pob_choice: a little sand
  chosen_korean: 한 줌의 모래
  alternatives_korean:
  - 조금의 모래
  - 보잘것없는 모래
  lexicon: LSJ
  rationale: 직역하면 ‘적은 모래’이지만, 여기서는 금의 미미함을 드러내는 관용적 비유이므로 의미를 살려 ‘한 줌의 모래’로 표현했습니다.
- source_word: λογισθήσεται ἄργυρος
  english_pob_choice: silver will be regarded as clay
  chosen_korean: 은은 … 진흙처럼 여겨질 것입니다
  alternatives_korean:
  - 은은 … 흙처럼 셈해질 것입니다
  - 은은 … 진흙으로 간주될 것입니다
  lexicon: LSJ
  rationale: λογίζομαι의 수동형은 ‘여기다/간주하다’의 뜻이므로 ‘여겨질 것입니다’로 옮겼고, πηλός는 문맥상 가치 대비를 드러내는 ‘진흙’으로 번역했습니다.
