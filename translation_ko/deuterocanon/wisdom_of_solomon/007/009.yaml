    reason: lexical_alternative
translation:
  language: ko
  text: 나는 그분과도 어떤 값비싼 돌을 견주지 않았습니다[a]. 왜냐하면 그분 앞에서 금은 모두 한 줌의 모래[b]와 같고, 은은 그분 앞에서는 진흙처럼 여겨질 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘값으로 헤아릴 수 없는 돌’입니다. 그리스어 표현은 헤아릴 수 없을 만큼 귀한 돌을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘적은 모래’입니다. 뜻은 금이 지혜에 비하면 거의 가치가 없다는 데 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ ὡμοίωσα
  english_pob_choice: Nor did I compare
  chosen_korean: 그분과도 어떤 …을 견주지 않았습니다
