  source_fidelity: ‘열 달 동안’과 ‘피 속에서 형성되어’는 각각 δεκαμηνιαίῳ χρόνῳ와 παγεὶς ἐν αἵματι를 충실히 반영합니다. 그러나 ‘잠이 함께한 쾌락에서’는 ἡδονῆς ὕπνῳ συνελθούσης의 결합 관계가 한국어에서 불분명합니다. 쾌락이 ‘잠과 함께한’ 것으로 옮기고, ἐκ가 ‘남자의 씨’와 이 쾌락에 걸리는 점을 ‘~으로 말미암아’로 드러내는 것이 더 정확합니다.
