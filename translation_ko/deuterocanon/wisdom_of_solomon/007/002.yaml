  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/002.yaml
  text: for a period of ten months[c][b][a], having been formed in blood from a man's seed and the pleasure accompanying sleep.
  footnotes:
  - marker: a
    text: Greek 'ten months,' reflecting ancient reckoning of pregnancy, likely by lunar months.
    reason: cultural_note
  - marker: b
    text: Or 'having been congealed in blood.' The Greek participle can carry the sense of coagulation or formation.
    reason: lexical_alternative
  - marker: c
    text: The final phrase refers euphemistically to sexual union; literally, 'and pleasure, sleep having come together.'
    reason: lexical_alternative
translation:
  language: ko
  text: 열 달 동안[a], 남자의 씨와 잠과 함께한 쾌락으로 말미암아 피 속에서 형성되었습니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어의 ‘열 달’은 고대의 임신 계산을 반영하며, 아마도 음력 개월을 염두에 둔 표현입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘피 속에서 응고되어.’ 그리스어 분사에는 응고와 형성의 뉘앙스가 모두 담길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 구절은 성적 결합을 완곡하게 가리킵니다. 직역하면 ‘그리고 잠과 함께한 쾌락으로 말미암아’에 가깝습니다.
    reason: lexical_alternative
