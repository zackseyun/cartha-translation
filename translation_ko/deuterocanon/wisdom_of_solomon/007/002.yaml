  terminology: ‘남자의 씨’는 σπέρματος ἀνδρός의 완곡하고 전통적인 표현을 보존하며, ‘쾌락’도 ἡδονή에 적절합니다. ‘피 속에서’는 ἐν αἵματι의 구체적 이미지를 유지합니다.
