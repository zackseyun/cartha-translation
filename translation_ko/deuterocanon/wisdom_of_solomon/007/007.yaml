  text: 그러므로 저는 기도하였고, 이해가 제게 주어졌으며, 지혜의 영이 제게 이르렀습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '이해'이며, 문맥상 '분별'이나 '통찰'로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 관사 없이 '지혜의 영'이라고 말하므로, 본문은 이를 고유한 칭호로 고정하지 않습니다.
    reason: alternative_reading
