translation:
  language: ko
  text: 그러므로 저는 기도했고, 이해력[a]이 제게 주어졌습니다. 저는 부르짖었고, 지혜의 영[b]이 제게 왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 φρόνησις는 문맥에 따라 '분별', '통찰', 또는 '신중함'으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 관사 없이 '지혜의 영'이라고 말하므로, 본문은 이를 고유한 칭호로 고정하지 않습니다.
    reason: alternative_reading
