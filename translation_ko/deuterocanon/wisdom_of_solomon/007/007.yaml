  text: Therefore I prayed[a], and understanding was given to me; I called upon God[b], and a spirit of wisdom came to me.
  footnotes:
  - marker: a
    text: Or 'I called upon [God]' or 'I invoked.' The Greek does not state the object explicitly.
    reason: lexical_alternative
  - marker: b
    text: Or 'the spirit of wisdom.' The Greek can be read more generally or more specifically; the main text preserves the ambiguity without turning the phrase into a formal title.
