  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/013.yaml
  text: And I learned without deceit[a], and I share without envy; I do not hide her wealth.
  footnotes:
  - marker: a
    text: Or 'without begrudging'; the Greek adverb means sharing without envy or stinginess.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 속임수 없이 배웠고, 시기하지 않고[a] 나누어 주며, 지혜의 부를 숨기지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아낌없이’. ἀφθόνως는 시기하거나 인색하게 여기지 않고 나누어 준다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδόλως
  english_pob_choice: without deceit
  chosen_korean: 속임수 없이
  alternatives_korean:
  - 기만 없이
  - 간사함 없이
  - 속임 없이
  lexicon: LSJ
  rationale: 부사 ἀδόλως의 핵심은 deceit/guile의 부재이므로, 한국어에서도 도덕적 뉘앙스를 직접 드러내는 '속임수 없이'가 가장 투명합니다.
- source_word: ἔμαθον
  english_pob_choice: I learned
  chosen_korean: 배웠고
  alternatives_korean:
  - 배웠습니다
  - 알게 되었고
  - 익혔고
  lexicon: LSJ
  rationale: aorist μανθάνω의 기본 의미를 따라, 화자가 지혜를 '배운' 사실을 간결하게 살렸습니다.
- source_word: ἀφθόνως
  english_pob_choice: without envy
  chosen_korean: 시기하지 않고
  alternatives_korean:
  - 아낌없이
  - 인색하지 않고
  - 시기 없이
  lexicon: LSJ
  rationale: 문자적으로는 envy의 부재이지만, 문맥상 지혜를 전하는 태도는 '아낌없이'에 가깝습니다. 다만 원문의 윤리적 긴장을 살리기 위해 '시기하지 않고'로 옮겼습니다.
- source_word: μεταδίδωμι
  english_pob_choice: I share
  chosen_korean: 나누어 주며
  alternatives_korean:
  - 전하며
  - 나눠 주며
  - 전달하며
  lexicon: LSJ
  rationale: '''공유하다/나누어 주다''의 의미를 현대 한국어로 자연스럽게 반영하면서, 지혜를 타인에게 전하는 행위를 분명히 했습니다.'
- source_word: πλοῦτον αὐτῆς
  english_pob_choice: her wealth
  chosen_korean: 그 지혜의 부
  alternatives_korean:
  - 그녀의 부
  - 그 부요함
  - 지혜의 재물
  lexicon: LSJ
  rationale: αὐτῆς의 여성형 인칭을 살리되, 한국어에서는 '그녀'보다 personified Wisdom의 의미가 더 자연스럽게 드러나는 '그 지혜'를 사용했습니다. πλοῦτος는 물질적 재물보다 '부/부요함'이 적절합니다.
- source_word: ἀποκρύπτομαι
  english_pob_choice: I do not hide
  chosen_korean: 숨기지 않습니다
  alternatives_korean:
  - 감추지 않습니다
  - 은폐하지 않습니다
  - 비밀로 하지 않습니다
  lexicon: LSJ
  rationale: 중간/수동 형태가 여기서는 능동적 의미로 쓰이므로, 간명한 현대 표현 '숨기지 않습니다'가 가장 적합합니다.
theological_decisions:
- issue: 지혜의 인격화와 여성 대명사 처리
  chosen_reading: 직접적인 '그녀의' 대신 '그 지혜의'로 인격화를 유지하되 한국어 자연성을 확보했습니다.
  alternative_readings:
  - 그녀의 부
  - 그의 부
  - 그 부요함
  rationale: 본문은 지혜를 여성형으로 의인화하지만, 한국어에서는 인칭대명사보다 명사 반복이 의인화와 가독성을 함께 지키기 쉽습니다. 따라서 원문의 신학적 긴장(의인화)을 완화하지 않고 표현했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve personification without over-domesticating the source'
