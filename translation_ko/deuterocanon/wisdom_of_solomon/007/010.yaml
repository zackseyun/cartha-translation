translation:
  language: ko
  text: 저는 건강과 아름다움보다 그 여인을 더 사랑하였고, 빛을 두고서라도 그녀를 가지기로 선택하였으니, 그녀에게서 나오는 광채는 잠들지 않기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀에게서 나는 빛은 잠들지 않는다’. 그리스어는 지혜에게서 발하는 빛이 끊이지 않음을 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ ὑγίειαν καὶ εὐμορφίαν
  english_pob_choice: more than health and beauty
  chosen_korean: 건강과 아름다움보다
  alternatives_korean:
  - 건강과 아름다움을 넘어서
  - 건강과 아름다움보다도
  lexicon: LSJ
  rationale: ὑπέρ는 여기서 비교 우위를 나타내므로, 한국어에서는 ‘~보다’로 자연스럽게 비교를 살렸습니다. εὐμορφίαν은 신체적 아름다움의 뜻이므로 ‘아름다움’이 가장 직접적입니다.
- source_word: ἠγάπησα αὐτήν
  english_pob_choice: I loved her
  chosen_korean: 그 여인을 더 사랑하였고
  alternatives_korean:
  - 그녀를 사랑하였고
  - 그 여인을 사랑하였고
  lexicon: BDAG
  rationale: ἀγαπάω의 aorist는 단순히 사랑했다는 사실을 말하므로, 과장 없이 ‘사랑하였고’로 옮겼습니다. 지혜의 인격화가 강하므로 ‘그 여인’을 유지했습니다.
- source_word: προειλόμην αὐτὴν ἀντὶ φωτὸς ἔχειν
  english_pob_choice: I chose to have her rather than light
  chosen_korean: 빛을 두고서라도 그녀를 가지기로 선택하였으니
  alternatives_korean:
  - 빛보다 그녀를 가지기로 선택하였으니
  - 빛 대신 그녀를 가지기로 선택하였으니
  lexicon: LSJ
  rationale: προαιρέομαι 계열은 의도적 선호와 선택을 나타내므로 ‘가지기로 선택하다’로 옮겼습니다. ἀντί는 대체/대비를 뜻해 ‘빛을 두고서라도’로 비교의 긴장을 살렸습니다.
- source_word: ἀκοίμητον τὸ ἐκ ταύτης φέγγος
  english_pob_choice: the radiance that comes from her never sleeps
  chosen_korean: 그녀에게서 나오는 광채는 잠들지 않기 때문입니다
  alternatives_korean:
  - 그녀에게서 나오는 빛은 잠들지 않기 때문입니다
  - 그녀에게서 나오는 광채는 잠들지 않기 때문입니다
  lexicon: LSJ
  rationale: ἀκοίμητον은 ‘잠들지 않는/끊이지 않는’의 뜻이므로 ‘잠들지 않다’로 직역에 가깝게 살렸습니다. φέγγος는 단순한 φῶς보다 발광의 느낌이 있어 ‘광채’가 문맥에 맞습니다.
theological_decisions:
- issue: 지혜의 여성 인격화 유지
  chosen_reading: 지혜를 가리키는 여성 대명사와 표현을 그대로 살려 ‘그 여인’, ‘그녀’로 옮겼습니다.
  alternative_readings:
  - 무생물화하여 ‘그것’으로 옮김
  - 추상명사로 평탄화함
  rationale: 그리스어는 지혜를 여성형으로 일관되게 인격화하고 있으므로, 그 문학적·신학적 힘을 보존하는 것이 원문 충실도에 더 가깝습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve source meaning; document significant lexical decisions.'
