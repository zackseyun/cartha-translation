  source_fidelity: 개정이 필요합니다. ‘빛을 두고서라도’는 빛을 포기하는 상황에서도라는 양보의 뜻으로 들려 ἀντὶ φωτός(‘빛 대신에/빛보다’)의 대체·선호 관계를 정확히 나타내지 못합니다. ‘빛 대신’으로 옮기는 것이 원문에 충실합니다. 또한 여성형 인격화는 ‘그녀’로 충분히 보존되며, ‘그 여인’은 지혜를 실제 특정 여성으로 오인하게 할 수 있습니다.
  naturalness: ‘그녀를 가지기로 선택하다’는 한국어에서 다소 직역투이고 중복적입니다. ‘그녀를 얻기로 택하였습니다’가 자연스럽고, 원문의 의도적인 선택 및 소유의 뜻을 유지합니다. ‘나는’은 원문의 1인칭을 평이하게 드러내면서 합쇼체 종결과도 잘 어울립니다.
