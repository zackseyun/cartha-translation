  chosen_korean: 그 여인을 더 사랑하였고
  alternatives_korean:
  - 그녀를 사랑하였고
  - 그 여인을 사랑하였고
  lexicon: BDAG
  rationale: ἀγαπάω의 aorist는 단순히 사랑했다는 사실을 말하므로, 과장 없이 ‘사랑하였고’로 옮겼습니다. 지혜의 인격화가 강하므로 ‘그 여인’을 유지했습니다.
- source_word: προειλόμην αὐτὴν ἀντὶ φωτὸς ἔχειν
  english_pob_choice: I chose to have her rather than light
  chosen_korean: 빛을 두고서라도 그녀를 가지기로 선택하였으니
  alternatives_korean:
  - 빛보다 그녀를 가지기로 선택하였으니
  - 빛 대신 그녀를 가지기로 선택하였으니
  lexicon: LSJ
  rationale: προαιρέομαι 계열은 의도적 선호와 선택을 나타내므로 ‘가지기로 선택하다’로 옮겼습니다. ἀντί는 대체/대비를 뜻해 ‘빛을 두고서라도’로 비교의 긴장을 살렸습니다.
- source_word: ἀκοίμητον τὸ ἐκ ταύτης φέγγος
  english_pob_choice: the radiance that comes from her never sleeps
  chosen_korean: 그녀에게서 나오는 광채는 잠들지 않기 때문입니다
  alternatives_korean:
  - 그녀에게서 나오는 빛은 잠들지 않기 때문입니다
  - 그녀에게서 나오는 광채는 잠들지 않기 때문입니다
  lexicon: LSJ
  rationale: ἀκοίμητον은 ‘잠들지 않는/끊이지 않는’의 뜻이므로 ‘잠들지 않다’로 직역에 가깝게 살렸습니다. φέγγος는 단순한 φῶς보다 발광의 느낌이 있어 ‘광채’가 문맥에 맞습니다.
