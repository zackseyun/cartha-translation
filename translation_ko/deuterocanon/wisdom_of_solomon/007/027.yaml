base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/027.yaml
  text: Though she is one[a], she can do all things, and while remaining in herself she renews all things; and passing into holy souls from generation to generation, she makes them friends of God and prophets[b];
  footnotes:
  - marker: a
    text: Or 'makes all things new.' The Greek verb can denote renewing or making new.
    reason: lexical_alternative
  - marker: b
    text: Or 'entering holy souls.' The participle describes Wisdom's movement into successive holy souls across generations.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 하나이지만[a] 모든 것을 할 수 있으며, 자기 안에 머무르면서 모든 것을 새롭게 합니다. 그리고 세대에서 세대로 거룩한 영혼들 안으로 들어가 하나님과 친구들이 되게 하고 예언자들이 되게 합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 것을 새롭게 합니다.’ 그리스어 동사는 새롭게 하다/갱신하다를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘거룩한 영혼들 안으로 들어가면서.’ 이 분사는 세대마다 이어지는 거룩한 영혼들 안으로 지혜가 이동하는 모습을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μία
  english_pob_choice: one
  chosen_korean: 하나
  alternatives_korean:
  - 유일한
  - 혼자인
  lexicon: LSJ
  rationale: 지혜의 단일성과 통일성을 간결하게 살리기 위해 ‘하나’를 택했습니다. ‘혼자인’은 고립의 뉘앙스를, ‘유일한’은 설명성을 더 강하게 띱니다.
- source_word: πάντα δύναται
  english_pob_choice: can do all things
  chosen_korean: 모든 것을 할 수 있으며
  alternatives_korean:
  - 모든 일을 할 수 있으며
  - 무엇이든 할 수 있으며
  lexicon: LSJ
  rationale: παντα의 포괄성을 유지하면서 자연스러운 현대 한국어로 옮겼습니다.
- source_word: μένουσα ἐν αὐτῇ
  english_pob_choice: remaining in herself
  chosen_korean: 자기 안에 머무르면서
  alternatives_korean:
  - 자기 안에 거하면서
  - 자기 자신 안에 머물면서
  lexicon: LSJ
  rationale: 자기 지혜의 내적 불변성과 동시에 활동성을 보여 주는 분사구문을 살리기 위해 ‘머무르면서’를 선택했습니다.
- source_word: τὰ πάντα καινίζει
  english_pob_choice: she renews all things
  chosen_korean: 모든 것을 새롭게 합니다
  alternatives_korean:
  - 모든 것을 새롭게 만듭니다
  - 만물을 새롭게 합니다
  lexicon: LSJ
  rationale: καινίζει의 ‘새롭게 하다/갱신하다’ 의미를 직접 살리되, ‘만물’보다 본문과 더 평이한 ‘모든 것’을 택했습니다.
- source_word: εἰς ψυχὰς ὁσίας μεταβαίνουσα
  english_pob_choice: passing into holy souls
  chosen_korean: 거룩한 영혼들 안으로 들어가
  alternatives_korean:
  - 거룩한 영혼들 속으로 들어가
  - 거룩한 영혼들에게로 옮겨가
  lexicon: LSJ
  rationale: μεταβαίνουσα의 이동/전이 감각을 살리기 위해 ‘들어가’로 옮겼고, ψυχὰς는 본문의 인류학적 어휘를 따라 ‘영혼들’로 두었습니다.
- source_word: φίλους θεοῦ
  english_pob_choice: friends of God
  chosen_korean: 하나님과 친구들이 되게
  alternatives_korean:
  - 하나님의 친구들이 되게
  - 하나님과 벗들이 되게
  lexicon: LSJ
  rationale: φίλους θεοῦ의 관계성을 직접 드러내기 위해 ‘하나님과 친구들’이라는 구조를 유지했습니다. 한국어로는 ‘하나님의 친구들’이 더 관용적이지만, 원문의 직설성을 위해 이 표현을 택했습니다.
- source_word: προφήτας
  english_pob_choice: prophets
  chosen_korean: 예언자들이 되게
  alternatives_korean:
  - 선지자들이 되게
  - 예언자들로
  lexicon: LSJ
  rationale: POB의 현대적 어휘 결정을 따라 ‘예언자들’로 옮겼습니다. 전통 교회어 ‘선지자’보다 현재 독자가 이해하기 쉬우며, 본문의 직능 명칭을 충분히 전달합니다.
- source_word: κατασκευάζει
  english_pob_choice: makes them ...
  chosen_korean: 되게 합니다
  alternatives_korean:
  - 만듭니다
  - 준비합니다
  lexicon: LSJ
  rationale: 문맥상 지혜가 그들을 하나님과 친구들이자 예언자들로 ‘빚어 내는’ 결과를 나타내므로, 결과 상태를 드러내는 ‘되게 합니다’가 가장 자연스럽습니다.
theological_decisions:
- issue: 지혜의 인격화와 여성 대명사 유지
  chosen_reading: 지혜를 지칭하는 여성 단수 인칭을 ‘그녀’로 유지했습니다.
  alternative_readings:
  - ‘지혜’ 반복 사용
  - 무인칭 표현
  rationale: 헬라어 문법이 지혜를 여성 단수 인격체로 말하므로 이를 보존했습니다. 이는 별개의 신격을 뜻하지 않으며, 본문의 문학적·신학적 긴장을 살립니다.
  doctrine_reference: 원어 우선 원칙; 인격화된 지혜의 문학적 장치 보존
- issue: ‘거룩한 영혼들’의 직접성 유지
  chosen_reading: ψυχὰς ὁσίας를 본문대로 ‘거룩한 영혼들’로 유지했습니다.
  alternative_readings:
  - 거룩한 사람들
  - 거룩한 자들
  rationale: ‘영혼들’은 현대어에서 낯설 수 있지만, 원문의 인류학적 어휘를 지우지 않기 위해 그대로 살렸습니다.
  doctrine_reference: 원어 우선 원칙; 의미 축소 금지
