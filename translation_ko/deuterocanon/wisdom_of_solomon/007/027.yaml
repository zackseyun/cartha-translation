  text: μία δὲ οὖσα πάντα δύναται, καὶ μένουσα ἐν αὐτῇ τὰ πάντα καινίζει, καὶ κατὰ γενεὰς εἰς ψυχὰς ὁσίας μεταβαίνουσα φίλους θεοῦ καὶ προφήτας κατασκευάζει·
  language: Greek
