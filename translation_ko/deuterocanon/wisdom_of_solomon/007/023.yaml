  alternative_readings:
  - 영들을 두루 스며드십니다
  - 영들 가운데 퍼져 나가십니다
  rationale: 원문은 지혜가 지성적이고 깨끗하며 매우 미세한 영들과의 관계 속에서 ‘지나감/통과’의 동작을 유지합니다. 이를 설명적으로 평탄화하지 않고, 원문의 운동성을 살린 표현을 택했습니다.
  doctrine_reference: 원문의 철학적·우주론적 긴장을 보존하고, 과도한 해석을 피합니다.
