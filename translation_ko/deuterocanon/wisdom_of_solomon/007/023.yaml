  rationale: 시편적·지혜문학적 찬양 문맥에서 παντοδύναμον은 하나님의 전능을 직접 찬양하는 표현이므로, 한국어 성경 전통에서도 즉각 인지되는 ‘전능하시며’를 사용했습니다.
  doctrine_reference: 지혜문학의 하나님의 속성 진술은 기존 교회 용어를 허용하되, 원문의 찬양적 강도를 보존해야 합니다.
- issue: διὰ πάντων χωροῦν의 동작상과 신학적 긴장
