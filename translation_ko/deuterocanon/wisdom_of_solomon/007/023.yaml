    reason: lexical_alternative
  - marker: c
    text: 이 구절은 ‘모든 지성 있는, 깨끗하며 지극히 미세한 영들을 지나가신다’로도 이해할 수 있으며, 더 자연스럽게는 ‘그런 영들에 두루 스며드신다’로도 옮길 수 있습니다.
