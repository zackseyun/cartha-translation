translation:
  language: ko
  text: 지혜는 하나님의 능력에서 나오는 숨결[a]이며, 전능하신 분의 영광에서 나오는 순수한 발산[b]입니다. 그러므로 더럽혀진 것은 아무것도 그 안으로 들어오지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
