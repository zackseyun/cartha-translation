  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/025.yaml
  text: For she is a breath of the power of God[a], and a pure emanation of the glory of the Almighty[b]; therefore nothing defiled enters into her.
  footnotes:
  - marker: a
    text: Or 'vapor' for 'breath' (ἀτμίς). The Greek image can suggest exhalation or vapor rising from a source.
    reason: lexical_alternative
  - marker: b
    text: Or 'a clear/unalloyed emanation' for 'a pure emanation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 하나님의 능력의 숨결이며, 전능하신 분의 영광의 순수한 흘러나옴입니다[a][b]. 그러므로 어떤 더러운 것도 그녀 안으로 들어오지 못합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘증기’로 볼 수 있습니다. ἀτμίς는 원천에서 올라오는 숨결이나 증기를 암시할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘맑고 섞이지 않은 흘러나옴’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτμὶς
  english_pob_choice: breath
  chosen_korean: 숨결
  alternatives_korean:
  - 숨
  - 입김
  - 증기
  lexicon: LSJ
  rationale: ἀτμίς는 숨, 증기, 내쉰 숨을 뜻할 수 있어 한국어에서 비유적 원천감을 살리는 ‘숨결’이 가장 자연스럽고, 단순한 물리적 ‘증기’로 축소되지 않습니다.
- source_word: ἀπόρροια
  english_pob_choice: emanation
  chosen_korean: 흘러나옴
  alternatives_korean:
  - 유출
  - 발출
  - 방출
  lexicon: LSJ
  rationale: 원천에서 밖으로 흘러나오는 이미지를 살리기 위해, 철학적 용어를 과도하게 굳히기보다 ‘흘러나옴’으로 옮겨 유래성과 파생성을 드러냈습니다.
- source_word: εἰλικρινής
  english_pob_choice: pure
  chosen_korean: 순수한
  alternatives_korean:
  - 맑은
  - 깨끗한
  - 혼합되지 않은
  lexicon: LSJ
  rationale: 이 형용사는 여기서 섞이지 않음과 오염되지 않음을 가리키므로, 뒤의 ‘더러운 것’과 맞물리게 하는 ‘순수한’이 적절합니다.
- source_word: μεμιαμμένον
  english_pob_choice: defiled
  chosen_korean: 더러운
  alternatives_korean:
  - 더럽혀진
  - 오염된
  - 부정한
  lexicon: LSJ
  rationale: 불결함과 의식적/도덕적 오염을 함께 포괄하면서도 현대 한국어에서 자연스러운 ‘더러운’으로 옮겨, 들어오지 못한다는 배제를 분명하게 했습니다.
theological_decisions:
- issue: 지혜의 여성 인칭 유지
  chosen_reading: ‘그녀’와 ‘그녀 안으로’로 지시 대상을 여성형으로 유지했습니다.
  alternative_readings:
  - 지혜라는 명사를 반복하는 방식
  - 중성적 대명사로 바꾸는 방식
  rationale: 본문은 지혜를 여성형으로 인격화하며 이어지므로, 문학적 표상을 보존해 원문의 수사와 흐름을 살리는 것이 타당합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, source meaning and literary form
- issue: 파생 이미지의 강도 보존
  chosen_reading: ‘하나님의 능력의 숨결’과 ‘전능하신 분의 영광의 순수한 흘러나옴’으로 직역 성향을 유지했습니다.
  alternative_readings:
  - 더 해석적인 의역
  - 철학적 용어로 정리한 표현
  rationale: 본문은 지혜의 근원성을 강하게 말하지만, 그 관계를 체계화하거나 약화하지 않습니다. 따라서 유래와 파생의 긴장을 그대로 드러내는 쪽이 본문에 충실합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, preserve theological tension
