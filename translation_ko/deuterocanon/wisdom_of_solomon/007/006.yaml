  text: But there is one entrance into life for all[a], and an equal departure.
  footnotes:
  - marker: a
    text: Or 'the same entrance into life for all, and the same exit.' The Greek pairs 'entrance' and 'departure/exit' as a balanced metaphor for human beginning and end.
