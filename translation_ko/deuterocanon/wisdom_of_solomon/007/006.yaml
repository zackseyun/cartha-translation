    rationale: 이 문맥의 ἴση는 모든 사람에게 공통된 동일한 떠남이라는 뜻입니다. ‘동등합니다’는 한국어에서 비교 대상의 가치·등급이 동등하다는 의미로 쉽게 이해되어 부자연스럽고 의미가 흐려집니다.
