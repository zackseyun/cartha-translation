  - 모든 이에게
  lexicon: LSJ
  rationale: 속격의 보편성을 한국어에서는 주어적 초점으로 풀어, 인간 전체를 가리키는 공통성을 분명하게 했습니다.
- source_word: εἰς τὸν βίον
  english_pob_choice: into life
  chosen_korean: 삶으로 들어오는
