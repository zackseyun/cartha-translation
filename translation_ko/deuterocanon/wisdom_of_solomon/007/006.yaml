translation:
  language: ko
  text: 그러나 모든 사람에게는 하나의 삶으로 들어오는 문이 있고, 나가는 길도 동등합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 사람에게는 삶으로 들어오는 같은 문과 같은 나감이 있습니다.’ 헬라어는 ‘들어옴’과 ‘나감/출구’를 대칭 구조로 묶어 인간의 시작과 끝을 균형 있게 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μία ... εἴσοδος
  english_pob_choice: one entrance
  chosen_korean: 하나의 삶으로 들어오는 문
  alternatives_korean:
  - 한 번의 들어감
  - 한 입구
  lexicon: LSJ
  rationale: μία와 εἴσοδος의 단일성·진입 이미지를 살려, 누구에게나 공통된 ‘들어옴’을 자연스러운 한국어로 옮겼습니다.
- source_word: πάντων
