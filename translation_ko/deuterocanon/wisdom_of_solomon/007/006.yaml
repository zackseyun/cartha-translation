  - 생명 안으로
  lexicon: LSJ
  rationale: βίος를 ‘생명’보다 현세적 삶의 의미가 살아 있는 ‘삶’으로 옮겨, 출생-죽음의 대구를 과도하게 해석하지 않게 했습니다.
- source_word: ἔξοδός τε ἴση
  english_pob_choice: an equal departure
  chosen_korean: 나가는 길도 동등합니다
  alternatives_korean:
  - 동등한 떠남도 있습니다
  - 나가는 출구도 같습니다
  lexicon: LSJ
  rationale: ἔξοδος의 출입/퇴장 이미지를 살리면서, ἴση의 대칭성과 공통성을 한국어에서 가장 자연스럽게 드러내기 위해 ‘동등합니다’로 처리했습니다.
theological_decisions:
- issue: ἔξοδος를 죽음으로 명시할지 여부
  chosen_reading: 메타포를 유지해 ‘나가는 길’로 두었습니다.
  alternative_readings:
  - 죽음은 모두에게 같습니다
  - 모두에게 같은 종말이 있습니다
  rationale: 헬라어는 출입의 대구를 사용하며 직접적으로 ‘죽음’이라 말하지 않으므로, 본문의 수사적 절제를 유지하는 편이 원문 충실도에 맞습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
