base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/024.yaml
  text: For wisdom is more mobile than any movement[b][a], and because of her purity she passes through and penetrates all things.
  footnotes:
  - marker: a
    text: Or 'more active than all motion.' The Greek comparative emphasizes wisdom's surpassing capacity for movement.
    reason: lexical_alternative
  - marker: b
    text: The Greek uses feminine grammar for 'wisdom'; 'her purity' reflects that personification.
    reason: cultural_note
translation:
  language: ko
  text: 지혜는 어떤 움직임보다도 더 민첩하며, 그 순결함 때문에 모든 것을 지나가고 꿰뚫습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘민첩하다’는 κινητικώτερον, 곧 ‘더 잘 움직이는’이라는 비교의 뜻을 자연스러운 한국어로 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: 헬라어에서 ‘지혜’(σοφία)는 여성명사이며, 문맥에서는 의인화되어 묘사됩니다. 그러나 한국어 ‘그’ 자체가 여성성을 표시하는 것은 아닙니다.
    reason: cultural_note
lexical_decisions:
- source_word: πάσης γὰρ κινήσεως κινητικώτερον
  english_pob_choice: more mobile than any movement
  chosen_korean: 어떤 운동보다도 더 민첩하며
  alternatives_korean:
  - 모든 움직임보다 더 활동적이며
  - 어떤 움직임보다도 더 잘 움직이며
  lexicon: LSJ
  rationale: κινήσεως와 κινητικώτερον의 비교를 살리되, 한국어에서는 ‘민첩하다’가 단순한 빠름이 아니라 움직임의 능가를 자연스럽게 드러냅니다.
- source_word: διήκει
  english_pob_choice: passes through
  chosen_korean: 지나가며
  alternatives_korean:
  - 통과하며
  - 관통하며
  - 흘러가며
  lexicon: LSJ
  rationale: 앞의 χωρεῖ와 구별되도록 첫 동사는 ‘지나가며’로 두어, 지나감의 동작을 기본적으로 유지하되 다음 동사와 중복되지 않게 했습니다.
- source_word: χωρεῖ
  english_pob_choice: permeates
  chosen_korean: 꿰뚫습니다
  alternatives_korean:
  - 모든 것을 스며들게 합니다
  - 모든 것에 두루 미칩니다
  - 통과합니다
  lexicon: LSJ
  rationale: χωρεῖ는 단순 이동보다 ‘사이를 비집고 들어가며 미치는’ 힘을 지니므로, ‘꿰뚫습니다’가 ‘passes through’와 구별되는 강한 함의를 살립니다.
- source_word: διὰ τὴν καθαρότητα
  english_pob_choice: because of her purity
  chosen_korean: 그 순결함 때문에
  alternatives_korean:
  - 그 깨끗함 때문에
  - 그 정결함 때문에
  - 그 순수성 때문에
  lexicon: LSJ
  rationale: 원문의 διὰ + 대격은 원인·이유를 나타내므로 ‘때문에’로 옮겼고, personification을 고려해 ‘그’로 받아 여성적 지시를 드러냈습니다.
theological_decisions:
- issue: 지혜의 의인화와 여성 대명사 처리
  chosen_reading: ‘지혜’는 소문자 일반명사로 두되, 문맥상 의인화된 존재로서 ‘그 순결함’이라고 옮겼습니다.
  alternative_readings:
  - ‘그의 순결함’으로 중성화하기
  - ‘지혜’의 의인성을 약화해 비인칭적으로 옮기기
  - ‘지혜’로 대문자화하기
  rationale: 헬라어 σοφία의 여성 문법과 문맥의 의인화를 반영해야 하지만, 본문만으로 별도 신격화나 위격화까지 단정할 필요는 없습니다.
  doctrine_reference: 문학적 의인화는 살리되, 본문이 요구하지 않는 형이상학적 결론은 유보합니다.
