theological_decisions:
- issue: 우주 질서 지식의 표현 방식
  chosen_reading: 이 구절은 해와 별의 질서에 대한 지혜를 간명하게 진술하는 것으로 보고, 해석을 덧붙이지 않고 병렬 구조를 유지했습니다.
  alternative_readings:
  - ‘해의 주기와 별들의 자리’처럼 더 직역적으로 옮기는 방법
  - ‘해의 원과 별들의 위치’처럼 천문학적 느낌을 강화하는 방법
  rationale: 원문이 단순한 명사구 병렬이므로, 지혜문학적 시적 압축을 살리면서도 의미를 과장하지 않는 번역이 적절합니다.
  doctrine_reference: 지혜서 7:19의 창조 질서 인식
- issue: footnote의 lexical alternative 반영
  chosen_reading: ‘자리’에 대해 각주로 ‘배치/천체의 자리’의 대안을 제시했습니다.
  alternative_readings:
  - 각주 없이 본문만 제시
  - ‘위치’로 본문을 두고 ‘자리’를 각주 처리
  rationale: 영문 POB가 ‘positions’와 대안인 ‘stations’를 제시하므로, 한국어에서도 단어 선택의 여지를 투명하게 남기는 것이 감사추적에 유익합니다.
  doctrine_reference: 번역 투명성 원칙
