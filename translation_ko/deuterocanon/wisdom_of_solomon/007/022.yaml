  - 외아들뿐인
  - 유일한
  lexicon: LSJ
  rationale: 여기서는 친자 관계가 아니라 지혜 안의 성격을 설명하므로, 신학적 연상을 불러오는 ‘외아들’ 계열보다 ‘독특한’이 원문의 비유적 의미를 잘 드러냅니다.
- source_word: ἀπήμαντον
  english_pob_choice: unharmed
  chosen_korean: 해를 입지 않은
  alternatives_korean:
  - 무해한
  - 상처받지 않은
  - 해를 입지 않는
  lexicon: LSJ
  rationale: 이 형용사는 ‘손상되지 않음’의 수동적 뜻이 강하므로, 행위적 뉘앙스의 ‘무해한’보다 ‘해를 입지 않은’이 더 정확합니다.
- source_word: φιλάγαθον
  english_pob_choice: loving the good
  chosen_korean: 선을 사랑하는
  alternatives_korean:
  - 선한 것을 사랑하는
  - 좋은 것을 사랑하는
  lexicon: LSJ
  rationale: 복합어의 직역을 살리면서도 한국어에서 자연스럽게 읽히도록 ‘선을 사랑하는’으로 옮겼습니다.
- source_word: εὐεργετικόν
  english_pob_choice: beneficent
  chosen_korean: 유익을 베푸는
  alternatives_korean:
  - 은혜를 베푸는
