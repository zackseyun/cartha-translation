base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/022.yaml
  text: For wisdom[a], the craftswoman of all things, taught me. For in her is an intelligent, holy, unique, manifold, subtle, agile, clear, undefiled, distinct[b], unharmed, loving-the-good, keen, unhindered, beneficent spirit,
  footnotes:
  - marker: a
    text: Or 'only-begotten' / 'one of a kind' for 'unique' (μονογενές). Here the context favors the sense 'unique' rather than a filial meaning.
    reason: lexical_alternative
  - marker: b
    text: '''Unharmed'' may also be rendered ''harmless''; the Greek can denote either being untouched by harm or not causing harm.'
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜[a]는 만물의 장인이어서 나를 가르쳤습니다. 지혜 안에는 지성 있는, 거룩한, 독특한, 여러 가지로 나뉜, 섬세한, 민첩한, 분명한, 더럽혀지지 않은, 분명히 구별되는[b], 해를 입지 않은, 선을 사랑하는, 예리한, 방해받지 않는, 유익을 베푸는 영이 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘독생’/‘유일한’의 뜻일 수 있습니다. 여기서는 문맥상 ‘독특한’의 뜻이 더 잘 맞습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘더럽혀지지 않은’ 뒤의 형용사는 ‘분명한’으로도 옮길 수 있지만, 앞의 ‘분명한’과 겹침을 피하기 위해 ‘분명히 구별되는’으로 풀어 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τεχνῖτις
  english_pob_choice: craftswoman
  chosen_korean: 장인
  alternatives_korean:
  - 여장인
  - 기술자
  - 공예가
  lexicon: LSJ
  rationale: τεχνῖτις는 ‘기술과 제작에 능한 사람’이라는 뜻이어서 한국어에서는 성별 표시를 과하게 드러내지 않는 ‘장인’이 자연스럽고, 앞의 지혜의 인격화도 유지합니다.
- source_word: μονογενές
