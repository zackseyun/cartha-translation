  alternative_readings:
  - 지혜의 영으로 단순화
  - 지혜를 지적인 원리로 비인격화
  rationale: 원문은 σοφία와 πνεῦμα를 인격적으로 묘사하므로, 이를 추상화하거나 교리적으로 정리하지 않고 지혜의 인격화와 그 안의 영의 성격을 그대로 드러냈습니다.
