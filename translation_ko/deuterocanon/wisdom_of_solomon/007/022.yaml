base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/022.yaml
  text: For wisdom[a], the craftswoman of all things, taught me. For in her is an intelligent, holy, unique, manifold, subtle, agile, clear, undefiled, distinct[b], unharmed, loving-the-good, keen, unhindered, beneficent spirit,
  footnotes:
  - marker: a
    text: Or 'only-begotten' / 'one of a kind' for 'unique' (μονογενές). Here the context favors the sense 'unique' rather than a filial meaning.
    reason: lexical_alternative
  - marker: b
    text: '''Unharmed'' may also be rendered ''harmless''; the Greek can denote either being untouched by harm or not causing harm.'
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜, 곧 만물의 여장인이 나를 가르쳤습니다. 그 안에는 지성 있고, 거룩하고, 독특한[a], 다양하고, 섬세하고, 민첩하고, 명료하고, 더럽혀지지 않고, 뚜렷하고, 해를 입지 않는[b], 선을 사랑하고, 예리하고, 막힘이 없고, 선행을 베푸는 영이 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘독생’ 또는 ‘유일한’으로 옮길 수 있습니다. 여기서는 친자 관계가 아니라 그 영의 고유한 성격을 가리키므로 ‘독특한’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘무해한’으로 옮길 수 있습니다. 그리스어는 해를 입지 않는다는 뜻과 해를 끼치지 않는다는 뜻을 모두 나타낼 수 있습니다.
    reason: lexical_alternative
