  lexicon: LSJ
  rationale: 형용사는 단순히 ‘유익한’ 상태가 아니라 실제로 선을 행하는 적극성을 가지므로, ‘유익을 베푸는’이 동태를 더 잘 드러냅니다.
theological_decisions:
- issue: 지혜와 영의 인격화 표현
  chosen_reading: 지혜를 주어로 두고, 지혜 안에 있는 영을 열거형 인격적 특성으로 살렸습니다.
  alternative_readings:
  - 지혜의 영으로 단순화
  - 지혜를 지적인 원리로 비인격화
  rationale: 원문은 σοφία와 πνεῦμα를 인격적으로 묘사하므로, 이를 추상화하거나 교리적으로 정리하지 않고 지혜의 인격화와 그 안의 영의 성격을 그대로 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Original-language primacy; Preserve theological tension rather than resolve it'
