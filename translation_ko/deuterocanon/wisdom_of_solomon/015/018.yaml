  - severity: medium
    issue: ‘어리석음에서 다른 것들과 비교해 보면’은 어색하며 비교 대상이 지나치게 포괄적입니다.
    rationale: ἀνοίᾳ는 비교의 영역을 나타내며, τῶν ἄλλων은 문맥상 다른 동물들을 가리킵니다. ‘어리석음에 있어서 다른 동물들과 비교하면’이 이를 더 정확하고 자연스럽게 드러냅니다.
