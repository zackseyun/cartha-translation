  source_fidelity: 첫 절의 숭배 대상과 δεύτε 절의 비교 대상은 모두 ‘동물들’입니다. 초안은 δεύτε 절에서 ‘그들은’이라고 하여 숭배하는 사람들을 가리키는 것으로 자연스럽게 읽히므로, 그리스어의 중성 복수 주어 τὰ ζῷα와 일치하도록 명시할 필요가 있습니다. 또한 τῶν ἄλλων은 문맥상 ‘다른 동물들’로 밝혀 주는 것이 적절합니다.
  naturalness: ‘어리석음에서 다른 것들과 비교해 보면’은 현대 한국어로 부자연스럽고 비교의 기준도 불분명합니다. ‘어리석음에 있어서 다른 동물들과 비교하면’이 원문의 비교 구조를 자연스럽게 재현합니다.
  terminology: ‘숭배합니다’는 σέβονται의 종교적 경외 의미를 이 문맥에서 적절히 전달합니다. ‘가장 혐오스러운 동물들’도 τὰ ἔχθιστα의 최상급 평가를 보존합니다.
