    text: 또는 ‘공기를 들이마시는’; 그리스어는 문자적으로 코를 ‘공기를 끌어들이는 데 쓰는 것’으로 말합니다.
    reason: lexical_alternative
  revision_rationale: The revision removes the unnatural “곧” while preserving the source’s statement that idols were regarded as gods. It keeps the concrete functional list intact, makes the feet’s referent explicit, and moves the lexical-alternative marker to the relevant expression. “공기를 끌어들이는” follows συνολκὴν ἀέρος closely, while the note supplies the natural alternative “공기를 들이마시는.”
