revisions:
- from: 그들은 민족들의 모든 우상들을 곧 신들로 여겼습니다. 그것들은 보는 데 쓰는 눈도, 공기를 들이마시는 데 쓰는 코도, 듣는 귀도, 만지기 위한 손가락도 없으며, 그들의 발은 걷는 데 쓸모없습니다.[a]
  to: 그들은 민족들의 모든 우상을 신들로 여겼습니다. 그것들은 보는 데 쓰이는 눈도, 공기를 끌어들이는[a] 데 쓰이는 코도, 듣는 귀도, 만지는 데 쓰이는 손가락도 없으며, 그 우상들의 발은 걷는 데 쓸모가 없습니다.
  rationale: The revision removes the unnatural “곧” while preserving the source’s statement that idols were regarded as gods. It keeps the concrete functional list intact, makes the feet’s referent explicit, and moves the lexical-alternative marker to the relevant expression. “공기를 끌어들이는” follows συνολκὴν ἀέρος closely, while the note supplies the natural alternative “공기를 들이마시는.”
