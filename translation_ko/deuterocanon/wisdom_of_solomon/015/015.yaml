  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/015.yaml
  text: For they even considered all the idols of the nations to be gods—things that have neither the use of eyes for seeing[a], nor noses for drawing in air, nor ears to hear, nor fingers of hands for feeling, and their feet are useless for walking.
  footnotes:
  - marker: a
    text: Or 'breathing air'; the Greek literally speaks of noses 'for drawing in air.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 민족들의 모든 우상을 신들로 여겼습니다. 그것들은 보는 데 쓰이는 눈도, 공기를 끌어들이는[a] 데 쓰이는 코도, 듣는 귀도, 만지는 데 쓰이는 손가락도 없으며, 그 우상들의 발은 걷는 데 쓸모가 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘공기를 들이마시는’; 그리스어는 문자적으로 코를 ‘공기를 끌어들이는 데 쓰는 것’으로 말합니다.
    reason: lexical_alternative
