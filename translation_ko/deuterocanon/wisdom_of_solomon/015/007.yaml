  rationale: δοῦλα의 ‘종속/예속’ 이미지는 보존해야 하지만, 한국어에서 그릇에 ‘노예’ 표현을 직역하면 부자연스럽고 오해를 낳기 쉬워, 기능적 종속을 드러내는 ‘속한’으로 완화하되 문맥상 대비를 살렸습니다.
- source_word: τὰ ἐναντία
  english_pob_choice: those for the contrary
  chosen_korean: 그 반대의 것들
  alternatives_korean:
  - 그 반대의 쓰임에 속한 것들
  - 반대되는 것들
  lexicon: LSJ
  rationale: 원문은 ‘반대되는 것/용도’의 대비를 말하므로, 의미를 과장하지 않고 간결하게 옮겼습니다.
theological_decisions:
- issue: δοῦλα의 예속 은유를 한국어 본문에서 어떻게 처리할지
  chosen_reading: 직접적인 ‘노예’ 표현은 본문에 쓰지 않고, 예속된 기능 관계를 드러내는 방식으로 옮겼습니다.
  alternative_readings:
  - ‘노예인 그릇들’
  - ‘속박된 그릇들’
  rationale: 이 절의 δοῦλα는 문자적 신분보다 ‘정해진 쓰임에 매인 상태’를 비유합니다. 한국어에서는 그릇에 대한 노예 은유를 그대로 살리면 뜻이 과도하게 충돌할 수 있어, 문맥상 기능적 예속을 드러내는 쪽을 택했습니다.
  doctrine_reference: POB contested-terms guidance for δοῦλος/δοῦλη; Wisdom of Solomon 15:7 audit trail
