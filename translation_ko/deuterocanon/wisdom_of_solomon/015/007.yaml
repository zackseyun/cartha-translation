  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/007.yaml
  text: For a potter[a], kneading soft earth with toil, molds each vessel for our service; yet from the same clay he formed both the vessels that are slaves to clean uses and those for the contrary, all alike. But which is the use of each of them, the potter is the judge.
  footnotes:
  - marker: a
    text: Or, more smoothly, 'the vessels for clean uses.' The Greek literally says 'the vessels enslaved to clean works/uses,' using δοῦλα metaphorically of assigned function.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 도공은 부드러운 땅을 애써 주물러 우리를 위한 쓰임에 맞게 각 그릇을 빚습니다. 그러나 같은 진흙으로 그는 깨끗한 쓰임에 속한 그릇들과 그 반대의 것들을 모두 똑같이 만들었습니다. 그런데 그 각각의 쓰임이 무엇인지는 도공이 판단합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하면 ‘깨끗한 쓰임에 예속된 그릇들’입니다. 여기서 δοῦλα는 그릇의 기능적 종속을 은유적으로 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κεραμεύς
  english_pob_choice: potter
  chosen_korean: 도공
  alternatives_korean:
  - 옹기장이
  - 토기장이
  lexicon: LSJ
  rationale: 그릇을 빚는 장인의 이미지를 가장 자연스럽게 살리는 표준어입니다.
- source_word: ἁπαλὴν γῆν / θλίβων ἐπίμοχθον
  english_pob_choice: kneading soft earth with toil
  chosen_korean: 부드러운 땅을 애써 주물러
  alternatives_korean:
  - 부드러운 흙을 애써 주물러
  - 애써 빚어
  lexicon: LSJ
  rationale: ‘주물러’는 흙을 눌러 빚는 동작을 살리고, ‘애써’는 ἐπίμοχθον의 수고스러움을 담습니다. ‘땅’은 원문의 γῆ를 그대로 살린 선택입니다.
- source_word: πρὸς ὑπηρεσίαν ἡμῶν
  english_pob_choice: for our service
  chosen_korean: 우리를 위한 쓰임에 맞게
  alternatives_korean:
  - 우리의 섬김을 위해
  - 우리의 사용을 위해
  lexicon: LSJ
  rationale: ὑπηρεσίαν은 단순한 ‘사용’보다 목적에 따른 실용적 쓰임을 가리키므로, 현대 한국어에서 자연스럽게 기능을 드러내는 표현으로 옮겼습니다.
- source_word: τὰ τε τῶν καθαρῶν ἔργων δοῦλα σκεύη
  english_pob_choice: the vessels that are slaves to clean uses
  chosen_korean: 깨끗한 쓰임에 속한 그릇들
  alternatives_korean:
  - 깨끗한 쓰임에 매인 그릇들
  - 깨끗한 일에 종속된 그릇들
  lexicon: LSJ
  rationale: δοῦλα의 ‘종속/예속’ 이미지는 보존해야 하지만, 한국어에서 그릇에 ‘노예’ 표현을 직역하면 부자연스럽고 오해를 낳기 쉬워, 기능적 종속을 드러내는 ‘속한’으로 완화하되 문맥상 대비를 살렸습니다.
- source_word: τὰ ἐναντία
  english_pob_choice: those for the contrary
  chosen_korean: 그 반대의 것들
  alternatives_korean:
  - 그 반대의 쓰임에 속한 것들
  - 반대되는 것들
  lexicon: LSJ
  rationale: 원문은 ‘반대되는 것/용도’의 대비를 말하므로, 의미를 과장하지 않고 간결하게 옮겼습니다.
theological_decisions:
- issue: δοῦλα의 예속 은유를 한국어 본문에서 어떻게 처리할지
  chosen_reading: 직접적인 ‘노예’ 표현은 본문에 쓰지 않고, 예속된 기능 관계를 드러내는 방식으로 옮겼습니다.
  alternative_readings:
  - ‘노예인 그릇들’
  - ‘속박된 그릇들’
  rationale: 이 절의 δοῦλα는 문자적 신분보다 ‘정해진 쓰임에 매인 상태’를 비유합니다. 한국어에서는 그릇에 대한 노예 은유를 그대로 살리면 뜻이 과도하게 충돌할 수 있어, 문맥상 기능적 예속을 드러내는 쪽을 택했습니다.
  doctrine_reference: POB contested-terms guidance for δοῦλος/δοῦλη; Wisdom of Solomon 15:7 audit trail
