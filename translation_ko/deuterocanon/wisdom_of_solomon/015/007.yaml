base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/007.yaml
  text: For a potter[a], kneading soft earth with toil, molds each vessel for our service; yet from the same clay he formed both the vessels that are slaves to clean uses and those for the contrary, all alike. But which is the use of each of them, the potter is the judge.
  footnotes:
  - marker: a
    text: Or, more smoothly, 'the vessels for clean uses.' The Greek literally says 'the vessels enslaved to clean works/uses,' using δοῦλα metaphorically of assigned function.
    reason: lexical_alternative
translation:
  language: ko
  text: 실로 도공은 부드러운 흙을 애써 주무르며 우리의 쓰임을 위해 그릇 하나하나를 빚습니다. 그러나 같은 진흙으로 그는 깨끗한 용도에 매인 그릇들과[a] 그 반대의 용도에 매인 그릇들을 모두 똑같이 빚어 냈습니다. 이들 각각이 어떤 용도로 쓰일지는 도공이 판단합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하면 ‘깨끗한 용도의 일들에 예속된 그릇들’입니다. 여기서 δοῦλα는 그릇이 정해진 기능에 매여 있음을 비유적으로 나타냅니다.
    reason: lexical_alternative
