base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/004.yaml
  text: For neither did the evil-crafted invention of men lead us astray[a], nor the fruitless labor of a painter of shadows—an image stained with varied colors[b];
  footnotes:
  - marker: a
    text: Or 'deceive us' for 'lead us astray.' The Greek verb can express either deception or causing someone to wander from the right path.
    reason: lexical_alternative
  - marker: b
    text: '''Shadow-painter'' refers to an artist working in outline or shading; the phrase criticizes the maker of painted idol-images.'
    reason: cultural_note
translation:
  language: ko
  text: 왜냐하면 사람들이 악한 솜씨로 꾸며 낸 고안도 우리를 미혹하지 못하였고[a], 또한 윤곽과 음영을 그리는 화가의 헛된 수고, 곧 여러 빛깔로 물들인 형상도 우리를 미혹하지 못하였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘미혹하다’로 번역한 그리스어는 ‘속이다’ 또는 ‘그릇된 길로 이끌다’라는 뜻도 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘윤곽과 음영을 그리는 화가’는 윤곽이나 음영 기법을 쓰는 화가를 가리킵니다. 문맥에서는 색칠한 우상 형상을 만드는 일을 비판하는 표현입니다.
    reason: cultural_note
