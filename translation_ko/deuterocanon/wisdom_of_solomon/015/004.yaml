  source_fidelity: 첫 접속사는 γάρ에 따라 ‘그러므로’가 아니라 ‘왜냐하면/실로’ 계열이어야 합니다. 또한 원문의 δεύτε 번째 부정 병렬은 화가의 헛된 수고와 그 산물인 색칠된 형상을 함께 가리키므로, 초안처럼 ‘형상’을 독립된 세 번째 주어로 분리하여 ‘그러하지 못했습니다’를 반복하는 방식은 원문의 구조를 흐립니다. ἐπλάνησεν은 ‘미혹하다’가 자연스럽고 원문의 기만·그릇된 길로 이끎의 범위를 유지합니다.
  naturalness: ‘그림자 화가’는 현대 표준어에서 다소 불투명합니다. 본문에서는 ‘윤곽과 음영을 그리는 화가’로 풀어 쓰면 자연스럽고, 해당 기술적 의미도 보존됩니다. 긴 병렬문은 ‘또한’과 ‘곧’으로 연결하면 합쇼체 문장으로 매끄럽습니다.
  terminology: κακότεχνος ἐπίνοια는 도덕적 비판과 인위적 고안의 뜻을 함께 담아 ‘사람들이 악한 솜씨로 꾸며 낸 고안’으로 옮겼습니다. εἶδος σπιλωθὲν χρώμασιν διηλλαγμένοις는 색으로 얼룩지거나 칠해진 형상이라는 다소 경멸적인 묘사를 보존해 ‘여러 빛깔로 물들인 형상’으로 유지했습니다.
