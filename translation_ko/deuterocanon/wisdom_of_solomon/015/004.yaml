    rationale: 원문은 화가의 헛된 수고 뒤에 그 색칠된 형상을 동격적으로 덧붙입니다. 초안의 반복 서술은 원문에 없는 구조를 만들고, 화가의 수고와 형상의 관계를 흐립니다.
