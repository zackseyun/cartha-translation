  to: 왜냐하면 사람들이 악한 솜씨로 꾸며 낸 고안도 우리를 미혹하지 못하였고[a], 또한 윤곽과 음영을 그리는 화가의 헛된 수고, 곧 여러 빛깔로 물들인 형상도 우리를 미혹하지 못하였습니다.[b]
  rationale: 접속사 γάρ의 설명 기능을 ‘왜냐하면’으로 바로잡고, δεύτε 번째 부정 병렬의 동격 구조를 ‘화가의 헛된 수고, 곧 ... 형상’으로 보존했습니다. 원문의 우상 비판적 어조와 색채 묘사는 유지하되, 불투명한 ‘그림자 화가’는 의미가 드러나는 현대 한국어로 풀었습니다.
