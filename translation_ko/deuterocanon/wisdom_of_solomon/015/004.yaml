translation:
  language: ko
  text: 그러므로 인간의 악한 솜씨로 꾸며 낸 발명도 우리를 잘못된 길로 이끌지 못했고, 그림자 화가의 헛된 수고도 — 여러 빛깔로 물들인 형상도 — 그러하지 못했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘잘못된 길로 이끌다’는 Greek ἐπλάνησεν의 ‘속이다’라는 뜻도 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그림자 화가’는 윤곽이나 음영을 다루는 화가를 가리키며, 우상 형상을 만드는 행위를 비판하는 표현입니다.
    reason: cultural_note
