  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/004.yaml
  text: For neither did the evil-crafted invention of men lead us astray[a], nor the fruitless labor of a painter of shadows—an image stained with varied colors[b];
  footnotes:
  - marker: a
    text: Or 'deceive us' for 'lead us astray.' The Greek verb can express either deception or causing someone to wander from the right path.
