    text: 또는 ‘유아보다 더 가련합니다’ 또는 ‘아기의 생명보다 더 비참합니다’. 그리스어 표현은 문자적으로 ‘유아의 영혼/생명’과 비교하는 압축된 표현이며, 극도의 연약함이나 가련한 상태를 강조할 수 있습니다.
    reason: lexical_alternative
