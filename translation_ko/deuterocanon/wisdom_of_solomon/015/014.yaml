  text: 그러나 그들은 모두 가장 어리석고 유아의 영혼보다[a] 더 비참합니다. 그들은 당신의 백성의 원수들, 곧 그 백성을 압제한 자들입니다.
  philosophy: optimal-equivalence
  footnotes:
