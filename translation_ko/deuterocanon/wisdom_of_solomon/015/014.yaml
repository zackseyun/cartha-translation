    text: 또는 '유아보다 더 가련합니다' 혹은 '아기의 생명보다 더 비참합니다'. 그리스어 표현은 문자적으로는 '유아의 영혼/생명'을 비교하며, 극도의 연약함과 비참함을 강조하는 압축된 표현입니다.
    reason: lexical_alternative
