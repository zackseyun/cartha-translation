  source_fidelity: 초안은 πάντες, ἀφρονέστατοι, τάλανες 및 압제의 뜻을 대체로 충실히 옮겼습니다. 그러나 οἱ ἐχθροὶ τοῦ λαοῦ σου(“당신의 백성의 원수들”)가 번역문 본문에서 빠져 있어, 단지 ‘당신의 백성을 압제한 이들’로만 표현된 것은 원문의 명시적 규정을 누락합니다. αὐτόν은 집합명사 λαός를 가리키므로 한국어에서는 ‘그 백성’을 목적어로 쓰는 것이 자연스럽고 충실합니다.
  naturalness: ‘유아의 영혼보다’는 한국어에서 다소 낯설지만, 원문의 의도적으로 압축된 ψυχὴν νηπίου를 보존하는 안전한 표현입니다. 문장을 둘로 나누어 동격 관계를 분명히 하면 현대 한국어 합쇼체에서 더 자연스럽고 읽기 쉽습니다.
