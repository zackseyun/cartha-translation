  to: 또 그것은 살아 있는 피조물들의 모습만큼 아름다워서 탐낼 만한 것도 아닙니다.[a] 그러나 그것은 하나님께로부터 받는 칭찬과 그분의 복을 모두 받지 못했습니다.[b]
  rationale: 첫 절을 살아 있는 피조물들의 외관과의 비교로 바로잡고, ἐπιποθῆσαι를 ‘탐낼 만한’으로 명료하게 옮겼습니다. δεύτε 절은 ‘피했다’의 문자적 표현이 의도적 회피처럼 오해되지 않도록 본문에서는 ‘받지 못했다’로 처리하되, 원문의 표현과 첫 절의 구문상 대안은 각주로 보존했습니다.
