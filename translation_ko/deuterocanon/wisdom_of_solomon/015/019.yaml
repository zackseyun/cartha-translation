base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/019.yaml
  text: nor is it so beautiful in the sight of living creatures as to be desired[b][a]; but it has escaped both the praise of God and his blessing.
  footnotes:
  - marker: a
    text: Or, 'nor is it beautiful enough to be desired, as living creatures are in appearance.' The Greek phrase with 'sight/appearance' can be construed in more than one way.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'it has escaped the praise of God and his blessing,' meaning it has missed or failed to receive them.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 그것은 살아 있는 피조물들의 모습만큼 아름다워서 탐낼 만한 것도 아닙니다.[a] 그러나 그것은 하나님께로부터 받는 칭찬과 그분의 복을 모두 받지 못했습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 달리 옮기면, ‘또 그것은 살아 있는 피조물들이 보기에 탐낼 만큼 아름답지도 않습니다’입니다. 헬라어의 ‘봄/모습’이라는 말은 살아 있는 피조물들의 외관을 가리킬 수도 있고, 그들이 보는 관점을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그것은 하나님의 칭찬과 그분의 복을 피했다’입니다. 여기서 ‘피했다’는 문맥상 그것들을 받지 못하거나 얻지 못했다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδʼ ὅσον
  english_pob_choice: nor does it attain as much
  chosen_korean: 아름답다 하더라도, 원하는 만큼 아름다운 것은 아닙니다
  alternatives_korean:
  - 그만큼도 아름답지 않습니다
  - 아름답다 할 수 있는 정도에도 이르지 않습니다
  lexicon: LSJ
  rationale: 비교적 부정의 힘을 살리되, 한국어에서는 직역형보다 ‘원하는 만큼’으로 옮겨 목적격 의미를 자연스럽게 드러내는 편이 문맥에 맞습니다.
- source_word: ἐπιποθῆσαι
  english_pob_choice: to be desired
  chosen_korean: 원하는
  alternatives_korean:
  - 갈망할 만한
  - 바랄 만한
  lexicon: LSJ
  rationale: 능동적 ‘갈망하다’보다 수동적 가치 판단인 ‘desired’에 맞춰 ‘원하는’으로 처리해 대상의 매력을 말하는 구조를 살렸습니다.
- source_word: ὡς ἐν ζῴων ὄψει
  english_pob_choice: in the sight of living creatures
  chosen_korean: 살아 있는 피조물의 눈에 보기에
  alternatives_korean:
  - 살아 있는 것들의 모습에서
  - 동물의 겉모습으로 보기에
  lexicon: LSJ
  rationale: ὄψις의 ‘시각/겉모습’과 ζῷα의 ‘살아 있는 존재들’을 함께 반영해, 단순한 외양 비교가 아니라 보는 이의 관점이라는 점을 유지했습니다.
- source_word: τὸν τοῦ θεοῦ ἔπαινον καὶ τὴν εὐλογίαν αὐτοῦ
  english_pob_choice: the praise of God and his blessing
  chosen_korean: 하나님의 찬양과 그의 복
  alternatives_korean:
  - 하나님의 칭찬과 그의 복
  - 하나님의 찬사와 그의 축복
  lexicon: LSJ
  rationale: ἔπαινον은 문맥상 하나님께서 주시는 찬양/칭찬의 승인으로 읽히므로 ‘찬양’보다 ‘찬양과 그의 복’을 택해, POB가 지적한 ‘받지 못함’의 의미를 자연스럽게 담았습니다.
theological_decisions:
- issue: ἐκπέφευγεν의 의미를 한국어에서 어떻게 처리할 것인가
  chosen_reading: ‘그것은 … 받지 못했습니다’로 옮겨, 겉뜻의 ‘escaped’보다 ‘결여/미수용’의 의미를 드러냈습니다.
  alternative_readings:
  - 그것은 …에서 벗어났습니다
  - 그것은 …을 피했습니다
  rationale: 문맥은 대상이 하나님께 드려지는 찬양과 복을 성공적으로 피했다기보다, 그것들을 얻지 못했다는 비판이므로 한국어에서는 오해를 줄이는 방향이 더 충실합니다.
  doctrine_reference: 문맥적 의미 우선, 수사적 오해 방지
- issue: 목록의 주체가 우상/조각상이라는 점을 얼마나 명시할 것인가
  chosen_reading: 직접적으로 ‘그것’이라 하여 대상의 비인격성을 유지했습니다.
  alternative_readings:
  - 그 우상은
  - 그 조각상은
  rationale: 앞뒤 문맥이 이미 우상 비판을 전개하므로, 본절에서는 중복 설명을 피하면서도 비인격적 대상을 지시하는 대명사를 유지하는 것이 원문에 가깝습니다.
  doctrine_reference: 문맥 연속성
