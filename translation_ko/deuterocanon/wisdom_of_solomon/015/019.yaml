  text: nor is it so beautiful in the sight of living creatures as to be desired[b][a]; but it has escaped both the praise of God and his blessing.
  footnotes:
  - marker: a
    text: Or, 'nor is it beautiful enough to be desired, as living creatures are in appearance.' The Greek phrase with 'sight/appearance' can be construed in more than one way.
