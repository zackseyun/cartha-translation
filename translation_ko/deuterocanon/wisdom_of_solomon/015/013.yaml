  to: 이 사람은 흙 같은 재료로 깨지기 쉬운 그릇들과 조각한 형상들을 만들면서, 자신이 죄를 짓고 있음을 누구보다도 잘 압니다.[a]
  rationale: 그리스어의 비교 구문을 ‘누구보다도 잘 압니다’로 분명히 하고, 원문에 없는 양보 의미를 삭제했습니다. δημιουργῶν의 분사 관계는 ‘만들면서’로 유지했으며, γλυπτὰ는 해석적으로 ‘우상’이라 하지 않고 ‘조각한 형상들’로 옮겼습니다.
