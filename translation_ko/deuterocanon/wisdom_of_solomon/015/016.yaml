revisions:
- from: 한 사람이 그것들을 만들었고[a], 빌려 온 영으로 그것들을 빚었습니다. 자기와 같은 하나님을 형성할 힘을 가진 사람은 아무도 없습니다.
  to: 사람이 그것들을 만들었고, 영[a]을 빌려 받은 사람이 그것들을 빚었습니다. 아무도 자기와 같은 신을 빚어 낼 힘이 없습니다.
  rationale: 원문의 두 번의 ‘사람’과 두 번의 ‘그것들’을 유지하고, ‘영을 빌려 받은’이라는 표현으로 인간 제작자의 의존성을 드러냈습니다. θεόν은 문맥상 참 하나님이 아니라 사람이 빚어 낸 신을 가리키므로 ‘신’으로 바로잡았으며, 각주 표지를 해당 어휘인 ‘영’으로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
