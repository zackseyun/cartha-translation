  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/016.yaml
  text: For a man made them[a], and one who had borrowed the spirit formed them; for no man has the strength to fashion a god like himself.
  footnotes:
  - marker: a
    text: Or 'the breath'; Greek 'the spirit' can also denote life-breath here, stressing that the maker's life is only on loan.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람이 그것들을 만들었고, 영[a]을 빌려 받은 사람이 그것들을 빚었습니다. 아무도 자기와 같은 신을 빚어 낼 힘이 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘숨’ 또는 ‘생명의 숨결’; 그리스어 ‘영’은 여기서 생명의 숨결을 가리킬 수도 있으며, 제작자의 생명이 오직 빌려받은 것임을 더 분명히 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος
  english_pob_choice: man
  chosen_korean: 한 사람
  alternatives_korean:
  - 한 인간
  - 사람
  lexicon: LSJ
  rationale: 반복되는 단수 인칭의 대비를 살리면서, 우상 제작자인 인간과 참 하나님 사이의 아이러니를 한국어로 자연스럽게 드러냅니다.
- source_word: τὸ πνεῦμα δεδανεισμένος
  english_pob_choice: had borrowed the spirit
  chosen_korean: 빌려 온 영
  alternatives_korean:
  - 빌린 숨
  - 잠시 빌린 생기
  lexicon: LSJ
  rationale: πνεῦμα의 ‘영/숨/생기’ 가능성을 살리되, 본문이 인간의 생명이 본래 소유가 아니라 빌려진 것임을 강조하므로 ‘빌려 온 영’으로 옮겼습니다.
- source_word: ἔπλασεν
  english_pob_choice: formed
  chosen_korean: 빚었습니다
  alternatives_korean:
  - 형성했습니다
  - 만들었습니다
  lexicon: LSJ
  rationale: 도공적 형상 제작의 뉘앙스를 살리면서 ἐποίησεν의 ‘만들다’와 구별하기 위해 ‘빚다’를 선택했습니다.
- source_word: πλάσαι θεόν
  english_pob_choice: to fashion a god
  chosen_korean: 하나님을 형성할
  alternatives_korean:
  - 신을 빚을
  - 하나님처럼 만들
  lexicon: LSJ
  rationale: 문맥상 우상 비판이지만, 본문 자체의 θεόν을 지나치게 약화하지 않기 위해 직역에 가깝게 ‘하나님’을 유지하되, 의도는 참 하나님이 아니라 신적 존재를 흉내 내는 것이라는 긴장을 보존했습니다.
