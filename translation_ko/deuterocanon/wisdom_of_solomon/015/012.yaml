  text: 그러나 그는 우리의 삶을 놀이로, 우리의 삶의 방식을 이익을 남기는 축제로 여겼습니다.[a] 그는 어디에서든, 심지어 악으로부터라도 재물을 마련해야 한다고 말합니다.[b]
  philosophy: optimal-equivalence
