- source_word: Σὺ δὲ
  english_pob_choice: But you
  chosen_korean: 그러나 주님,
  alternatives_korean:
  - 하지만 주님,
  - 그러나 당신은,
  lexicon: BDAG
  rationale: 문장의 대조적 δέ를 살리되, 하나님께 직접 말하는 호격을 한국어 자연성에 맞게 앞에 두었습니다.
- source_word: χρηστός
