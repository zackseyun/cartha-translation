  - 진리이시며
  - 신실하시며
  lexicon: BDAG
  rationale: 하나님의 성품을 말하는 ἀληθής는 단순한 사실 진술보다 신실하고 참된 성격을 가리키므로 '참되시며'가 가장 균형 있습니다.
- source_word: μακρόθυμος
  english_pob_choice: patient
  chosen_korean: 오래 참으시고
  alternatives_korean:
  - 인내하시고
  - 오래 참으시며
  - 너그러우시고
  lexicon: BDAG
  rationale: 이 형용사는 분노를 늦추고 오래 견디는 성격을 뜻하므로, 관용적이면서도 원뜻을 보존하는 '오래 참으시고'로 옮겼습니다.
- source_word: ἐλέει διοικῶν τὰ πάντα
  english_pob_choice: governing all things with mercy
  chosen_korean: 자비로 모든 것을 다스리십니다.
  alternatives_korean:
  - 긍휼로 만물을 다스리십니다.
  - 자비롭게 모든 것을 다스리십니다.
  - 자비 가운데 모든 것을 통치하십니다.
  lexicon: BDAG
  rationale: ἐλέει는 방법/수단의 의미를 살려 '자비로'로 옮기고, διοικῶν은 보편적 섭리적 통치를 뜻하므로 '다스리십니다'가 가장 직접적입니다.
