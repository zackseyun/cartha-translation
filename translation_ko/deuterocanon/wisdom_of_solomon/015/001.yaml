lexical_decisions:
- source_word: Σὺ δὲ
  english_pob_choice: But you
  chosen_korean: 그러나 주님,
  alternatives_korean:
  - 하지만 주님,
  - 그러나 당신은,
  lexicon: BDAG
  rationale: 문장의 대조적 δέ를 살리되, 하나님께 직접 말하는 호격을 한국어 자연성에 맞게 앞에 두었습니다.
- source_word: χρηστός
  english_pob_choice: kind
  chosen_korean: 선하시고
  alternatives_korean:
  - 친절하시고
  - 자비로우시고
  - 좋으시고
  lexicon: BDAG
  rationale: χρηστός의 핵심 의미인 선함과 인자함을 한국어에서 가장 자연스럽게 드러내기 위해 '선하시고'를 택했습니다.
- source_word: ἀληθής
  english_pob_choice: 'true'
  chosen_korean: 참되시며
  alternatives_korean:
  - 진실하시며
  - 진리이시며
  - 신실하시며
  lexicon: BDAG
  rationale: 하나님의 성품을 말하는 ἀληθής는 단순한 사실 진술보다 신실하고 참된 성격을 가리키므로 '참되시며'가 가장 균형 있습니다.
- source_word: μακρόθυμος
  english_pob_choice: patient
  chosen_korean: 오래 참으시고
  alternatives_korean:
  - 인내하시고
  - 오래 참으시며
  - 너그러우시고
  lexicon: BDAG
  rationale: 이 형용사는 분노를 늦추고 오래 견디는 성격을 뜻하므로, 관용적이면서도 원뜻을 보존하는 '오래 참으시고'로 옮겼습니다.
- source_word: ἐλέει διοικῶν τὰ πάντα
  english_pob_choice: governing all things with mercy
  chosen_korean: 자비로 모든 것을 다스리십니다.
  alternatives_korean:
  - 긍휼로 만물을 다스리십니다.
  - 자비롭게 모든 것을 다스리십니다.
  - 자비 가운데 모든 것을 통치하십니다.
  lexicon: BDAG
  rationale: ἐλέει는 방법/수단의 의미를 살려 '자비로'로 옮기고, διοικῶν은 보편적 섭리적 통치를 뜻하므로 '다스리십니다'가 가장 직접적입니다.
theological_decisions:
- issue: 하나님의 주권과 자비의 결합
  chosen_reading: 하나님은 모든 것을 다스리시되, 그 통치는 자비를 수단과 방식으로 삼습니다.
  alternative_readings:
  - 하나님은 자비롭게 모든 것을 통치하십니다.
  - 하나님은 자비 가운데 만물을 경영하십니다.
  rationale: ἐλέει는 통치의 성격을 규정하는 방식어로 남겨, 주권이 자비와 결합되어 있다는 본문의 긴장을 그대로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; source-direct rendering over domestication.'
