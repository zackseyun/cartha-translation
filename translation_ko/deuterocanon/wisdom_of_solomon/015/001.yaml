  - 자비로우시고
  - 좋으시고
  lexicon: BDAG
  rationale: χρηστός의 핵심 의미인 선함과 인자함을 한국어에서 가장 자연스럽게 드러내기 위해 '선하시고'를 택했습니다.
- source_word: ἀληθής
  english_pob_choice: 'true'
  chosen_korean: 참되시며
  alternatives_korean:
