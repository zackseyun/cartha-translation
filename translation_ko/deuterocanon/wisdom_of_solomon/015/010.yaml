  text: His heart is ashes[a], and his hope is more worthless than earth, and his life more dishonored than clay[b],
  footnotes:
  - marker: a
    text: Or 'soil' for 'earth'; the Greek comparison emphasizes extreme worthlessness.
    reason: lexical_alternative
  - marker: b
    text: Or 'more contemptible than clay'; the Greek term can stress lack of honor or esteem.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 마음은 재요, 그의 희망은 땅보다 더 보잘것없으며, 그의 삶은 진흙보다 더 수치스럽습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘땅’은 여기서 가치 기준의 비교 대상을 가리킵니다. 문맥상 ‘흙/토양’으로 좁게 볼 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ἀτιμότερος는 ‘더 수치스러운’ 외에도 ‘더 불명예스러운, 더 경멸받는’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
