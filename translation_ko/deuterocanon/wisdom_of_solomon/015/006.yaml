  text: Lovers of evil are worthy of such hopes[b][a], both those who make them and those who desire them and those who worship them.
  footnotes:
  - marker: a
    text: Or 'worthy of hopes like these.' The phrase points back to the kind of expectations attached to idols in the surrounding context.
    reason: lexical_alternative
  - marker: b
    text: Literally 'those doing [them],' but in context this refers to those who make or fashion the idols.
    reason: lexical_alternative
translation:
  language: ko
  text: 악을 사랑하는 자들은 그런 희망들에 합당합니다. 곧 그것들을 만드는 자들과 그것들을 바라는 자들과 그것들을 숭배하는 자들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이와 같은 희망들에 합당합니다.’ 이 표현은 앞 문맥의 우상들에 붙은 기대를 되가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘행하는 자들’이지만, 문맥상 우상을 만드는 자들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κακῶν ἐρασταὶ
  english_pob_choice: Lovers of evil
  chosen_korean: 악을 사랑하는 자들
  alternatives_korean:
  - 악의 연인들
  - 악의 애호가들
  - 악을 좋아하는 자들
  lexicon: LSJ
  rationale: ἐρασταί는 단순한 호감보다 강한 애착과 추구를 가리키므로, 한국어에서는 ‘사랑하는 자들’이 도덕적 비난을 가장 직접적으로 살립니다.
- source_word: ἄξιοί τε τοιούτων ἐλπίδων
  english_pob_choice: worthy of such hopes
  chosen_korean: 그런 희망들에 합당합니다
  alternatives_korean:
  - 그런 희망들을 받을 만합니다
  - 그런 기대에 합당합니다
  - 이와 같은 희망에 합당합니다
  lexicon: LSJ
  rationale: ἄξιος는 ‘가치가 있다/합당하다’는 판정을 나타내므로, ‘합당합니다’가 가장 자연스럽고 원문에 가깝습니다.
- source_word: οἱ δρῶντες
  english_pob_choice: those who make them
  chosen_korean: 그것들을 만드는 자들
  alternatives_korean:
  - 그것들을 행하는 자들
  - 그것들을 하는 자들
  - 그것들을 제작하는 자들
  lexicon: LSJ
  rationale: 문맥상 대상은 우상들이므로, δρῶντες를 일반적인 ‘행하다’보다 우상을 ‘만들다/제작하다’로 구체화하는 것이 영어 POB의 해석과 원문 문맥을 함께 반영합니다.
- source_word: οἱ ποθοῦντες
  english_pob_choice: those who desire them
  chosen_korean: 그것들을 바라는 자들
  alternatives_korean:
  - 그것들을 갈망하는 자들
  - 그것들을 원하는 자들
  - 그것들을 욕망하는 자들
  lexicon: LSJ
  rationale: ποθέω는 강한 갈망을 뜻하지만, 한국어에서는 ‘바라다’가 문맥에 어울리면서도 과도하게 감정적이지 않아 균형이 좋습니다.
- source_word: οἱ σεβόμενοι
  english_pob_choice: those who worship them
  chosen_korean: 그것들을 숭배하는 자들
  alternatives_korean:
  - 그것들을 경배하는 자들
  - 그것들을 공경하는 자들
  - 그것들을 섬기는 자들
  lexicon: LSJ
  rationale: σέβομαι는 종교적 경외를 가리키며 우상 문맥에서는 ‘숭배하다’가 가장 분명하게 우상숭배의 의미를 드러냅니다.
theological_decisions:
- issue: 지시대상인 우상의 생략된 목적어 보완
  chosen_reading: ‘그것들’로 보충하여 우상들을 지시하게 했습니다.
  alternative_readings:
  - 목적어를 생략한 채 ‘만드는 자들, 바라는 자들, 숭배하는 자들’로 둘 수도 있습니다.
  - ‘이것들’을 사용할 수도 있습니다.
  rationale: 헬라어는 목적어를 생략하지만, 바로 앞뒤 문맥이 우상과 우상 제작을 말하므로 한국어에서는 참조 대상을 분명히 드러내는 것이 오해를 줄입니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; 문맥이 회복하는 대상을 한국어에서 명시'
