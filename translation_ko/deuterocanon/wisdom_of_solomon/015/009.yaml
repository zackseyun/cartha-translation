    text: Or 'rivals' goldsmiths and silversmiths.
    reason: lexical_alternative
  - marker: b
    text: '''Counterfeit things'' may also be rendered ''false things'' or ''base imitations.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그는 곧 지치게 될 것이라는 것도, 자기의 생명이 짧다는 것도 염려하지 않고, 오히려 금세공인과 은세공인에게 맞서며 청동 세공인을 본받고, 가짜 것들을 만드는 것을 영광으로 여깁니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '금세공인과 은세공인과 겨룬다'로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '가짜 것들'은 '거짓된 것들'이나 '조악한 모방품'으로도 옮길 수 있습니다.
    reason: lexical_alternative
