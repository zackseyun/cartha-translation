  - marker: b
    text: '''Counterfeit things'' may also be rendered ''false things'' or ''base imitations.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그는 자신이 곧 지치게 되리라는 것과 자기 삶이 짧다는 것을 염려하지 않습니다. 오히려 금세공인들과 은세공인들과 겨루고[a], 청동 세공인들을 흉내 내며, 가짜 물건들을[b] 빚는 일을 영광으로 여깁니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘금세공인들과 은세공인들에게 맞선다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘가짜 물건들’은 ‘거짓된 것들’ 또는 ‘조악한 모방품’으로도 옮길 수 있습니다.
    reason: lexical_alternative
