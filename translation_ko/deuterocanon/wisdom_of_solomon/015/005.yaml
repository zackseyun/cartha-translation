  text: The sight of them comes to fools as a reproach[a], and they long for the form of a lifeless image.
  footnotes:
  - marker: a
    text: Or 'the appearance of them becomes a disgrace to fools, and [one] desires the appearance of a dead, breathless image.' The Greek syntax of the second clause is compressed and can be rendered more literally, though less clearly in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것들을 보는 것은 어리석은 자들에게 수치가 되며, 그들은 숨 없이 죽은 형상의 모습을 갈망합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것들을 보는 것이 어리석은 자들에게 수치가 되며, [그들은] 숨 없이 죽은 형상의 모습을 갈망합니다.’ 그리스어 둘째 절은 압축되어 있어 더 문자적으로 옮길 수 있지만, 한국어에서는 덜 분명합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψις
  english_pob_choice: sight
  chosen_korean: 모습
  alternatives_korean:
  - 보임
  - 외형
  - 보는 모습
  lexicon: LSJ
  rationale: ὄψις는 ‘보이는 모습/외형’의 뜻을 가질 수 있으므로, 여기서는 우상들의 ‘모습’이 어리석은 자들에게 어떤 반응을 불러오는지 자연스럽게 드러내는 ‘모습’이 적절합니다.
- source_word: ἄφροσιν
  english_pob_choice: fools
  chosen_korean: 어리석은 자들
  alternatives_korean:
  - 우매한 자들
  - 미련한 자들
  lexicon: LSJ
  rationale: ἄφρων은 지혜가 없는 사람을 가리키므로, Wisdom서의 지혜/어리석음 대비를 살리면서도 현대 한국어에서 덜 경직된 ‘어리석은 자들’로 옮겼습니다.
- source_word: εἰς ὄνειδος ἔρχεται
  english_pob_choice: comes as a reproach
  chosen_korean: 수치가 되고
  alternatives_korean:
  - 치욕이 되고
  - 모욕으로 다가오고
  - 수치로 다가오고
  lexicon: LSJ
  rationale: 직역하면 ‘수치로 다가옴’이지만, 한국어에서 ‘~가 된다’가 결과를 자연스럽게 표현하므로 ὄνειδος의 결과적 의미를 살려 ‘수치가 되고’로 옮겼습니다.
- source_word: νεκρᾶς εἰκόνος εἶδος ἄπνουν
  english_pob_choice: the form of a lifeless image
  chosen_korean: 죽은 형상의 생기 없는 모습
  alternatives_korean:
  - 죽은 형상의 모습
  - 생기 없는 죽은 형상
  - 숨이 없는 죽은 형상의 모습
  lexicon: LSJ
  rationale: νεκρός와 ἄπνους는 모두 생명이 없음/무호흡을 가리키므로, 우상 비판의 강도를 살려 ‘죽은 형상’과 ‘생기 없는 모습’을 겹쳐 표현했습니다. εἶδος는 여기서 ‘형상/모습’의 외관을 가리킵니다.
theological_decisions:
- issue: 둘째 절의 주어 처리
  chosen_reading: ‘그들은 갈망합니다’로 옮겨, 어리석은 자들이 우상적 형상을 욕망한다는 문맥적 의미를 드러냈습니다.
  alternative_readings:
  - ‘그것들의 모습이 갈망합니다’처럼 형식적으로 주어를 유지하는 번역
  - ‘그것의 모습이...’로 애매하게 두는 번역
  rationale: 그리스어는 압축되어 있어 문자적으로는 어색할 수 있지만, 문맥상 비난의 대상은 우상에 끌리는 어리석은 자들이므로, 한국어에서는 이해 가능한 방식으로 그 주체를 드러내는 것이 본문의 의도를 더 잘 전달합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve source sense in readable modern Korean.'
