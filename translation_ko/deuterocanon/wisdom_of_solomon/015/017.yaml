translation:
  language: ko
  text: 그러나 그는 죽을 운명을 지닌 자로서 법less한 손으로 죽은 것을 만들어 냅니다. 그는 자신이 한때 살아 있었으나 그것들은 결코 살아 본 적이 없는, 자신이 예배하는 것들보다 더 낫기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 숭배하는 대상들’의 뜻으로 볼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: θνητὸς
  english_pob_choice: mortal
  chosen_korean: 죽을 운명을 지닌 자
  alternatives_korean:
  - 유한한 자
  - 죽을 수밖에 없는 자
  - 필멸자
  lexicon: LSJ
  rationale: θνητός는 죽음에 속한 존재라는 뜻이므로, 문맥의 우상 제작자와 우상의 대비를 살려 ‘죽을 운명을 지닌 자’로 옮겼습니다.
- source_word: νεκρὸν
