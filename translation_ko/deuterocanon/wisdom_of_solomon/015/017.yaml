translation:
  language: ko
  text: 그러나 그는 죽을 운명을 지닌 자이면서도 무법한 손으로 죽은 것을 만들어 냅니다. 그는 자신이 예배하는 것들보다 더 낫습니다. 그 자신은 살아 있었지만, 그것들은 한 번도 살아 있었던 적이 없기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 우상들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: θνητὸς
  english_pob_choice: mortal
  chosen_korean: 죽을 운명을 지닌 자
  alternatives_korean:
