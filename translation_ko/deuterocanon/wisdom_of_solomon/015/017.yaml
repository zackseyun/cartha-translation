  lexicon: LSJ
  rationale: 형용사가 실질적으로 ‘죽은 것’을 가리키므로, 우상 제작의 조롱을 자연스럽게 드러내는 ‘죽은 것’으로 번역했습니다.
- source_word: χερσὶν ἀνόμοις
  english_pob_choice: with lawless hands
  chosen_korean: 법less한 손으로
  alternatives_korean:
  - 불법한 손으로
  - 율법 없는 손으로
  - 무법한 손으로
  lexicon: LSJ
  rationale: ἀνόμοις는 문자적으로 ‘법 없는/율법 밖의’ 뜻이어서, 문맥의 신적 질서 위반을 살리려 했으나 표기 오류가 포함된 표현이 선택되었습니다.
- source_word: τῶν σεβασμάτων αὐτοῦ
  english_pob_choice: the things he worships
  chosen_korean: 자신이 예배하는 것들
  alternatives_korean:
  - 그가 숭배하는 것들
  - 그가 경배하는 것들
  - 그의 우상들
  lexicon: LSJ
  rationale: σεβάσματα는 숭배의 대상이라는 뜻이므로, 본문의 우상 비판을 드러내는 ‘자신이 예배하는 것들’로 옮겼습니다.
- source_word: οὐδέποτε
  english_pob_choice: never did
  chosen_korean: 결코 살아 본 적이 없는
  alternatives_korean:
  - 결코 그러지 못한
  - 전혀 살아 있지 않았던
  - 한 번도 살아 본 적이 없는
  lexicon: LSJ
  rationale: 부정 부사는 우상들이 생명을 가진 적이 없음을 강조하므로, 앞의 ‘한때 살아 있었으나’와 대조되는 자연스러운 한국어로 풀었습니다.
theological_decisions:
- issue: 우상 제작 풍자와 생명 대비를 어떻게 살릴지
  chosen_reading: 사람은 죽을 운명을 지닌 존재인데, 자기 손으로 죽은 것을 만들면서도 자신이 예배하는 대상보다 낫다는 역설을 드러내는 문장으로 읽었습니다.
  alternative_readings:
  - 단순한 우상 비판으로만 읽는 것
  - 도덕적 부패 일반으로 확장하는 것
  rationale: 원문은 우상 제작자와 무생물 우상의 대비를 통해 생명/죽음의 역설을 조롱적으로 제시하므로, 그 긴장을 직접 살리는 번역이 필요합니다.
