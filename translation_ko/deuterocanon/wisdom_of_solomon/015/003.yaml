lexical_decisions:
- source_word: ἐπίστασθαί / εἰδέναι
  english_pob_choice: to know
  chosen_korean: 아는 것
  alternatives_korean:
  - 알고 있음
  - 인지하는 것
  - 깨닫는 것
  lexicon: BDAG
  rationale: 두 동사 모두 인식·지식의 기본 뜻을 가지므로, 한국어에서도 같은 동사 ‘알다’로 평행 구조를 살려 간결하게 옮겼습니다.
- source_word: ὁλόκληρος δικαιοσύνη
  english_pob_choice: complete righteousness
  chosen_korean: 온전한 의
  alternatives_korean:
  - 완전한 의
  - 완전한 의로움
  - 온전한 공의
  lexicon: LSJ / BDAG
  rationale: ὁλόκληρος는 ‘흠 없는, 온전한’의 뉘앙스를 가지므로 ‘온전한’이 자연스럽고, δικαιοσύνη는 기본값에 따라 ‘의’로 옮겨 문장 전체의 신학적 결을 살렸습니다.
- source_word: κράτος
  english_pob_choice: power
  chosen_korean: 능력
  alternatives_korean:
  - 권능
  - 힘
  - 권세
  lexicon: BDAG
  rationale: 하나님의 작동하는 힘이라는 의미를 현대 한국어에서 가장 자연스럽게 전달하는 말로 ‘능력’을 택했습니다. '권세'는 통치 뉘앙스가 강해 여기서는 좁아집니다.
- source_word: ῥίζα ἀθανασίας
  english_pob_choice: root of immortality
  chosen_korean: 불멸의 뿌리
  alternatives_korean:
  - 영생의 뿌리
  - 죽지 않음의 뿌리
  - 불사성의 뿌리
  lexicon: LSJ / BDAG
  rationale: 비유적 이미지를 유지하기 위해 ῥίζα를 직역해 ‘뿌리’로 두고, ἀθανασία는 지혜문헌의 철학적·신학적 어조를 반영하여 ‘불멸’로 옮겼습니다.
theological_decisions:
- issue: δικαιοσύνη의 한국어 대응
  chosen_reading: ‘의’로 번역해 하나님을 아는 지식이 곧 바른 관계와 올바름의 충만함이라는 뜻을 드러냈습니다.
  alternative_readings:
  - ‘공의’
  - ‘정의’
  - ‘의로움’
  rationale: 이 구절은 사회적 정의보다는 하나님을 아는 것과 연결된 상태를 말하므로, 기본값대로 ‘의’가 가장 적절합니다. 영어 POB의 ‘righteousness’ 선택과도 일치합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table (δικαιοσύνη → righteousness)'
