  rationale: 이 구절은 인간이 흙에서 나와 다시 흙으로 돌아가는 유한성을 강조하므로, ‘영의 빚’은 생명 전체가 소유주 앞에 회수되는 긴장을 유지합니다. 다만 ‘생명’도 가능한 독해이므로 의미의 여지를 주석으로 남깁니다.
