  lexicon: LSJ
  rationale: ψυχή는 문맥상 ‘영혼’ 또는 ‘생명’을 뜻할 수 있으나, 여기서는 인간 존재의 내적 생명에 대한 빚의 이미지를 살려 ‘영’을 택했습니다. ‘빚/요구되다’는 χρέος와 ἀπαιτέω의 채권·청구 이미지를 보존합니다.
theological_decisions:
- issue: ψυχή의 번역에서 ‘영’과 ‘생명’ 중 무엇을 택할지
  chosen_reading: 영
  alternative_readings:
  - 생명
  - 영혼
  rationale: 이 구절은 인간이 흙에서 나와 다시 흙으로 돌아가는 유한성을 강조하므로, ‘영의 빚’은 생명 전체가 소유주 앞에 회수되는 긴장을 유지합니다. 다만 ‘생명’도 가능한 독해이므로 의미의 여지를 주석으로 남깁니다.
