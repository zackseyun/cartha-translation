translation:
  language: ko
  text: 그리고 악한 수고로 그는 같은 진흙으로 헛된 신을 빚습니다—얼마 전까지는 땅에서 생겨났다가, 잠시 후에는 자기가 취해진 그 땅으로 돌아가는 사람, 곧 영의 빚이 요구될 때입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘생명의 빚이 요구될 때’. 그리스어 ψυχή는 ‘영’ 또는 ‘생명’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κακόμοχθος
  english_pob_choice: with wicked toil
  chosen_korean: 악한 수고로
  alternatives_korean:
  - 사악한 노동으로
