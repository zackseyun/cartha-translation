translation:
  language: ko
  text: 그리고 그는 악한 수고로 같은 진흙에서 헛된 신을 빚습니다. 그는 얼마 전 땅에서 생겨났으며, 잠시 후에는 자신이 취함을 받은 그 땅으로 돌아가게 될 사람입니다. 그는 자기 영혼의 빚을 요구받을 때 그렇게 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 생명의 빚을 요구받을 때’. 그리스어 ψυχή는 ‘영혼’ 또는 ‘생명’을 뜻할 수 있습니다.
    reason: lexical_alternative
