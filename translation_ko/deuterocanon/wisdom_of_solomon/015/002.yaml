  source_fidelity: 수정이 필요합니다. 초안의 두 ‘그러나’는 원문의 καὶ γὰρ(‘실로/참으로, 왜냐하면’) 및 이어지는 진술의 연결을 각각 대조 관계로 바꾸어 놓습니다. 특히 첫 ‘그러나’는 설명적·강조적 도입을 반대로 옮긴 것입니다. 조건문, 하나님의 능력을 아는 근거, 미래형 ‘우리는 죄를 짓지 않을 것입니다’, 그리고 λογίζομαι의 ‘여김/계산됨’의 의미는 보존할 수 있습니다.
