translation:
  language: ko
  text: 실로 우리가 죄를 짓는다 해도, 우리는 주님의 것입니다[a]. 우리는 주님의 능력[b]을 알고 있기 때문입니다. 우리는 죄를 짓지 않을 것입니다. 우리가 주님께 속한 것으로 여겨졌음을 알고 있기 때문입니다[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리는 주님께 속해 있습니다’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주님의 힘’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘우리가 주님께 속한 것으로 여김을 받았음을’. 그리스어는 ‘계산하다, 여겨 주다’라는 회계·산정 용어를 사용하여 하나님께 속한다는 뜻을 나타냅니다.
    reason: lexical_alternative
