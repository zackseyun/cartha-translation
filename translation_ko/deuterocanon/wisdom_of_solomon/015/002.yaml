translation:
  language: ko
  text: 그러나 우리가 죄를 짓더라도, 우리는 주님의 것이니—주님의 능력을 알고 있기 때문입니다. 그러나 우리는 죄를 짓지 않을 것입니다. 우리가 주님께 속한 것으로 여겨졌음을 알기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님께 속해 있습니다’로, ‘우리는 주님의 것입니다’의 뜻입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘능력’보다 ‘힘’의 뜻으로 볼 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 회계 용어가 깔린 표현으로, ‘주님께 속한 것으로 여겨졌다’는 뜻입니다.
    reason: lexical_alternative
