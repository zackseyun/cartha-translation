base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/021.yaml
  text: For wisdom opened the mouths of the mute[c][b][a], and made the tongues of infants eloquent.
  footnotes:
  - marker: a
    text: Or 'the mouths of the deaf,' since the Greek word can refer to those unable to hear or unable to speak; here 'mute' fits the speech context best.
    reason: lexical_alternative
  - marker: b
    text: Or 'made the tongues of infants articulate' / 'distinct.' The Greek describes speech made clear.
    reason: lexical_alternative
  - marker: c
    text: The subject 'wisdom' is personified throughout this section; some translations capitalize it as 'Wisdom.'
    reason: alternative_reading
translation:
  language: ko
  text: 이는 지혜가 벙어리의 입을 열고, 어린아이들의 혀를 유창하게 만들었기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘귀머거리의 입’일 수 있습니다. 그리스어 κωφός는 듣지 못하는 사람과 말하지 못하는 사람을 모두 가리킬 수 있지만, 여기서는 말하기의 문맥이어서 ‘벙어리’가 더 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘어린아이들의 혀를 분명하게/명료하게 만들었다’는 뜻일 수 있습니다. 그리스어 τρανάς는 ‘분명한, 명료한, 유창한’의 뉘앙스를 가집니다.
    reason: lexical_alternative
  - marker: c
    text: 여기서 ‘지혜’는 의인화되어 행동하는 존재로 묘사됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: σοφία
  english_pob_choice: wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 지혜님
  - 지혜(의 인격화)
  lexicon: LSJ
  rationale: 본문은 지혜를 행위 주체로 의인화하지만, 한국어 본문에서는 인격화 표지를 과도하게 넣지 않고 기본어휘 ‘지혜’로 옮겨 문맥이 드러내게 했습니다.
- source_word: στόμα κωφῶν
  english_pob_choice: the mouths of the mute
  chosen_korean: 벙어리의 입
  alternatives_korean:
  - 말 못하는 자들의 입
  - 못 듣는 자들의 입
  lexicon: LSJ
  rationale: κωφός는 ‘못 듣는’ 뜻도 있으나 여기서는 입과 혀의 대구가 분명하므로, 말하지 못하는 상태를 드러내는 ‘벙어리’가 가장 직접적입니다.
- source_word: γλώσσας νηπίων
  english_pob_choice: the tongues of infants
  chosen_korean: 어린아이들의 혀
  alternatives_korean:
  - 유아들의 혀
  - 젖먹이들의 혀
  lexicon: LSJ
  rationale: γλῶσσα를 신체 기관인 ‘혀’로 살리고, νήπιοι를 ‘어린아이들’로 옮겨 말이 아직 서툰 존재를 나타내는 이미지를 보존했습니다.
- source_word: ἔθηκεν τρανάς
  english_pob_choice: made the tongues of infants eloquent
  chosen_korean: 유창하게 만들었습니다
  alternatives_korean:
  - 분명하게 만들었습니다
  - 말 잘하게 만들었습니다
  - 명료하게 만들었습니다
  lexicon: LSJ
  rationale: τρανός의 핵심은 ‘분명한/명료한/유창한’이므로, 한국어로는 혀를 대상으로 자연스러운 서술인 ‘유창하게 만들다’로 표현했습니다.
theological_decisions:
- issue: 지혜의 의인화
  chosen_reading: 본문은 ‘지혜’를 주어로 두되, 본문 안에서는 의인화 설명을 덧붙이지 않았습니다.
  alternative_readings:
  - ‘지혜’ 대신 ‘지혜님’처럼 인격화 표지를 드러내는 번역
  rationale: 문학적 의인화를 보존하면서도 한국어 본문이 해설적으로 보이지 않도록, 본문은 간결하게 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, original-language primacy; preserve theological tension rather than over-resolve
