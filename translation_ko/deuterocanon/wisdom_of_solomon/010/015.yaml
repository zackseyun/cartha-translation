  source_fidelity: 그리스어 ἐξ ἔθνους θλιβόντων에서 θλιβόντων은 복수 속격 분사이므로, 본문은 ‘압제하는 민족’보다 ‘압제자들로 이루어진 민족/압제자들의 민족’이라는 구성적 의미를 우선 반영하는 것이 안전합니다. 또한 그리스어에는 한국어 높임 선어말어미에 해당하는 요소가 없으므로, 지혜를 가리키는 주어에 ‘구해 내셨습니다’라고 높이는 것은 원문 이상입니다.
  naturalness: ‘그녀는’은 앞 문맥의 의인화된 지혜를 받는 대명사로 가능하며, 합쇼체 서술은 ‘구해 냈습니다’로 자연스럽게 유지됩니다. ‘압제자들로 이루어진 민족’은 다소 설명적이지만 복수 분사의 관계를 현대 한국어로 분명하고 자연스럽게 나타냅니다.
