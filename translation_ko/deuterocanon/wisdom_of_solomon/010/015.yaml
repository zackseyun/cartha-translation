translation:
  language: ko
  text: 그녀는 거룩한 백성과 흠 없는 자손을 압제자들로 이루어진 민족에게서 구해 냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘압제하는 민족에게서’ 또는 ‘그들을 억압하던 민족에게서’로 옮길 수 있습니다. 그리스어 분사 θλιβόντων은 ‘압제자들’이라는 명사적 뜻으로 이해될 수도 있고, 민족의 성격을 나타내는 말로 이해될 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὔτη
  english_pob_choice: She
  chosen_korean: 그녀는
  alternatives_korean:
  - 이 사람은
  - 이분은
  - 지혜는
  lexicon: LSJ
  rationale: 앞 문맥의 의인화된 지혜를 가리키는 여성형 지시어이므로, 주어를 ‘그녀는’으로 살려 인칭적 연결을 유지했습니다.
- source_word: λαὸν
  english_pob_choice: people
  chosen_korean: 백성
  alternatives_korean:
  - 사람들
  - 민족
  - 국민
  lexicon: LSJ
  rationale: ἔθνος와 구별되는 언약 공동체적 집합을 한국어로 자연스럽게 드러내기 위해 ‘백성’을 택했습니다.
- source_word: σπέρμα ἄμεμπτον
  english_pob_choice: blameless offspring
  chosen_korean: 흠 없는 자손
  alternatives_korean:
  - 책망받을 데 없는 후손
  - 흠 없는 후예
  - 결점 없는 자손
  lexicon: LSJ
  rationale: σπέρμα의 집합적 의미를 살리면서도 ‘자손’이 문맥상 가장 자연스럽고, ἄμεμπτον은 도덕적 흠이 없음을 뜻하므로 ‘흠 없는’으로 옮겼습니다.
- source_word: ἐρρύσατο
  english_pob_choice: rescued
  chosen_korean: 구해 내셨습니다
  alternatives_korean:
  - 구출하셨습니다
  - 건져 내셨습니다
  - 건져 주셨습니다
  lexicon: LSJ
  rationale: 단순한 생존 구제가 아니라 압제에서의 해방을 뜻하므로, 현대 한국어에서 자연스럽고 구원의 행위를 잘 드러내는 ‘구해 내셨습니다’를 사용했습니다.
theological_decisions:
- issue: αὔτη의 인칭화된 지혜 표지
  chosen_reading: 본문의 여성형 지시어를 ‘그녀는’으로 번역해 지혜의 인격화된 주체성을 유지했습니다.
  alternative_readings:
  - ‘지혜는’으로 명시적으로 풀기
  - ‘이것은’처럼 직역하기
  rationale: 주변 문맥의 의인화된 지혜를 흐리지 않으면서도, 본문이 실제로는 대명사를 사용한다는 점을 보존합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: ὅσιον / ἄμεμπτον의 언약적·윤리적 진술
  chosen_reading: ‘거룩한 백성’과 ‘흠 없는 자손’으로 직역해 공동체의 언약적 성격과 도덕적 무흠성을 함께 살렸습니다.
  alternative_readings:
  - ‘경건한 백성’과 ‘책망할 것 없는 자손’
  - ‘경건한 백성’과 ‘결점 없는 후손’
  rationale: 본문의 평가적 표현을 약화시키지 않고, 지혜의 구원이 어떤 대상을 이루는지 그대로 드러내기 위함입니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1
