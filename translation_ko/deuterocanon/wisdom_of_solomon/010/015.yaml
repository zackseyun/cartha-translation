  text: She rescued a holy people and a blameless offspring from a nation of oppressors[a].
  footnotes:
  - marker: a
    text: Or 'from an afflicting nation' or 'from a nation that oppressed them.' The Greek participle θλιβόντων can be understood adjectivally rather than as the substantive 'oppressors.'
