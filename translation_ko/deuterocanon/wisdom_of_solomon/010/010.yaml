base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/010.yaml
  text: She guided the righteous man[a], a fugitive from his brother’s anger, in straight paths; she showed him the kingdom of God, and gave him knowledge of holy things; she prospered him in his labors[b], and increased the fruits of his toil.
  footnotes:
  - marker: a
    text: Or 'knowledge of holy ones.' The Greek phrase can refer either to sacred things or to holy persons/beings.
    reason: alternative_reading
  - marker: b
    text: Literally 'multiplied his toils/pains'; here likely meaning the yield or gains associated with his labor, since the context describes Wisdom’s beneficence.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 여인이 자기 형의 분노를 피해 도망한 의로운 사람을 곧은 길로 인도하였고, 하나님 나라를 보여 주며 거룩한 것들의 지식을 주었으며, 그의 수고 가운데 그를 잘되게 하고 그의 수고의 열매를 늘려 주었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거룩한 이들의 지식’. 헬라어 구문은 거룩한 것들 또는 거룩한 존재들을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘그의 수고/고통들을 늘렸다’입니다. 그러나 문맥상 지혜의 호의가 강조되므로, 여기서는 수고의 결과를 뜻하는 긍정적 의미로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  english_pob_choice: She
  chosen_korean: 이 여인
  alternatives_korean:
  - 그 여인
  - 그녀
  lexicon: LSJ
  rationale: 문맥상 지혜를 가리키는 여성 단수 지시어이므로, 한국어에서도 인격화된 주체를 살려 ‘이 여인’으로 옮겼습니다.
- source_word: φυγάδα ὀργῆς ἀδελφοῦ
  english_pob_choice: a fugitive from his brother’s anger
  chosen_korean: 자기 형의 분노를 피해 도망한
  alternatives_korean:
  - 형의 진노에서 도망한
  - 형의 분노 때문에 유랑한
  lexicon: LSJ
  rationale: φυγάδα는 ‘도망한 사람’의 의미를 살리고, 속격구는 도피의 원인을 나타내므로 ‘…를 피해 도망한’으로 자연스럽게 표현했습니다.
- source_word: γνῶσιν ἁγίων
  english_pob_choice: knowledge of holy things
  chosen_korean: 거룩한 것들의 지식
  alternatives_korean:
  - 거룩한 이들의 지식
  - 성스러운 것들의 앎
  lexicon: LSJ
  rationale: ἁγίων은 문맥상 ‘거룩한 것들’로도, ‘거룩한 이들’로도 읽힐 수 있으나, 본문 흐름이 계시된 신성한 실재를 말하므로 그 긴장을 유지한 채 ‘거룩한 것들의 지식’으로 옮겼습니다.
- source_word: ἐπλήθυνεν τοὺς πόνους αὐτοῦ
  english_pob_choice: increased the fruits of his toil
  chosen_korean: 그의 수고의 열매를 늘려 주었습니다
  alternatives_korean:
  - 그의 수고를 많게 하였습니다
  - 그의 노고의 결실을 늘려 주었습니다
  lexicon: LSJ
  rationale: 직역하면 ‘그의 수고/고통들을 많게 하였다’이지만, 앞뒤가 모두 호의적이므로 문맥상 수고의 결과를 뜻하는 긍정적 의미를 살려 옮겼습니다.
theological_decisions:
- issue: 지혜의 인격화와 성별 표지
  chosen_reading: 본문의 주어를 지혜로 보되, 한국어에서는 여성 인칭을 드러내는 ‘이 여인’으로 번역했습니다.
  alternative_readings:
  - ‘지혜가’로 중립적으로 반복
  - ‘그녀가’
  rationale: 히브리/헬라 문맥의 지혜 인격화를 유지해야 하며, 단순 명사 반복보다 한국어 독자에게 주체 전환이 분명하게 드러납니다.
  doctrine_reference: 'DOCTRINE.md: Preserve source meaning and literary personification'
- issue: γνῶσιν ἁγίων의 이중 가능성
  chosen_reading: ‘거룩한 것들의 지식’
  alternative_readings:
  - ‘거룩한 이들의 지식’
  rationale: 본문은 성스러운 실재와 거룩한 존재 모두를 문법적으로 열어 두지만, 지혜가 보여 주는 계시의 내용이라는 흐름상 ‘거룩한 것들’이 더 직접적입니다. 다만 다른 읽기도 가능한 긴장은 유지합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
