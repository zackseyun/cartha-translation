translation:
  language: ko
  text: 그 사람 때문에, 땅이 홍수로 뒤덮였을 때 지혜가 다시 그것을 구원하여, 보잘것없는 나무 조각으로 의인을 이끄셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘보잘것없는/하찮은 나무를 통하여’. 이 표현은 방주를 가리키며, 낮고 보잘것없는 물질적 수단으로 의인을 보존하신다는 점을 강조합니다.
    reason: lexical_alternative
