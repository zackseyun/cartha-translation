  text: Because of him[a], when the earth was being flooded, wisdom again saved it, steering the righteous man by means of a humble piece of wood.
  footnotes:
  - marker: a
    text: Or 'through a humble/insignificant piece of wood.' The phrase refers to the ark and emphasizes the lowly material means by which wisdom preserved the righteous man.
