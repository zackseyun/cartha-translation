theological_decisions:
- issue: σοφία의 의인화 표현
  chosen_reading: 지혜를 고유명사처럼 대문자화하지 않고, 인격적으로 행위하는 주체로 그대로 표현했습니다.
  alternative_readings:
  - 지혜를 ‘지혜님’처럼 약화된 의인화로 처리
  - 지혜를 추상명사로만 처리
  rationale: 문맥 전체가 지혜를 능동적 행위자로 제시하므로, 본문이 요구하는 문학적 의인화를 유지해야 합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: ‘의인’의 정체
  chosen_reading: ‘의인’은 노아를 가리키는 문맥적 지시로 보며, 본문에는 인물을 덧붙여 설명하지 않았습니다.
  alternative_readings:
  - ‘의로운 사람 노아’로 명시
  - ‘의로운 자’로 일반화
  rationale: 바로 앞 홍수-방주 맥락이 노아를 충분히 지시하므로, 본문은 간결하게 두되 의미는 유지했습니다.
  doctrine_reference: 문맥적 인물 식별
