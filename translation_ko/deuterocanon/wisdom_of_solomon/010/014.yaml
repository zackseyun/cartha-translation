    rationale: 문장 표면상 ‘비방하던 자들’이 ‘거짓됨을 드러낸’ 주체처럼 읽힐 수 있습니다. 원문은 지혜가 그들을 거짓된 자들로 밝혔다는 뜻이므로, 이를 명시해야 합니다.
