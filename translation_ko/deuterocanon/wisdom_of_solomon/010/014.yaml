  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/014.yaml
  text: She went down with him into the pit[a], and in chains she did not abandon him, until she brought him the scepter of a kingdom and authority over those who had ruled him; she showed those who had slandered him to be false[b], and gave him everlasting glory.
  footnotes:
  - marker: a
    text: Or 'into the dungeon'; the Greek literally says 'into the pit,' which can refer to an imprisonment pit or cistern.
    reason: lexical_alternative
  - marker: b
    text: Or 'proved those who had accused him false.'
    reason: alternative_reading
translation:
  language: ko
  text: 그는 그와 함께 구덩이로 내려갔고[a], 사슬 속에서도 그를 버리지 않으시고, 마침내 그에게 왕국의 홀과 그를 압제하던 자들에 대한 권위를 가져다주셨습니다. 또 그를 비방하던 자들이 거짓됨을 드러내셨고[b], 그에게 영원한 영광을 주셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘감옥’으로 옮길 수 있습니다. 헬라어 λάκκος는 문자적으로 ‘구덩이’를 뜻하며, 감금용 구덩이나 물웅덩이도 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그를 고발하던 자들이 거짓됨을 드러내셨습니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: συγκατέβη αὐτῷ
  english_pob_choice: went down with him
  chosen_korean: 그와 함께 내려갔고
  alternatives_korean:
  - 그와 함께 들어갔고
  - 그와 동행하여 내려갔고
  lexicon: LSJ
  rationale: σύν + καταβαίνω의 동반 하강을 살려 ‘함께 내려갔고’로 옮겼습니다. 주어는 앞 문맥의 의인화된 지혜를 받되, 한국어에서는 반복을 줄여 자연스럽게 처리했습니다.
- source_word: εἰς λάκκον
  english_pob_choice: into the pit
  chosen_korean: 구덩이로
  alternatives_korean:
  - 감옥 구덩이로
  - 함정으로
  lexicon: LSJ
  rationale: λάκκος의 핵심 이미지는 ‘구덩이’이며, 감옥·물웅덩이·우물 등을 포괄할 수 있지만 여기서는 구체적 이미지가 더 중요해 ‘구덩이’로 직역했습니다.
- source_word: ἐν δεσμοῖς
  english_pob_choice: in chains
  chosen_korean: 사슬 속에서도
  alternatives_korean:
  - 쇠사슬에 묶인 채
  - 결박된 채
  lexicon: LSJ
  rationale: δεσμοί는 속박과 구금의 상태를 가리키므로, 한국어에서는 상태를 강조하는 ‘사슬 속에서도’로 옮겨 버리지 않음의 대비를 살렸습니다.
- source_word: ἐξουσίαν τυραννούντων αὐτοῦ
  english_pob_choice: authority over those who had ruled him
  chosen_korean: 그를 압제하던 자들에 대한 권위
  alternatives_korean:
  - 그를 다스리던 자들에 대한 권세
  - 그를 폭정하던 자들에 대한 권위
  lexicon: LSJ
  rationale: τυραννέω는 단순 통치보다 폭압적 지배를 내포하므로, ‘압제하던’으로 옮겨 역전된 지배 관계를 드러냈습니다. ‘권위’는 ἐξουσία의 폭넓은 통치 권한을 무리 없이 반영합니다.
- source_word: μωμησαμένους αὐτόν
  english_pob_choice: those who had slandered him
  chosen_korean: 그를 비방하던 자들
  alternatives_korean:
  - 그를 책망하던 자들
  - 그를 헐뜯던 자들
  lexicon: LSJ
  rationale: μωμάομαι는 헐뜯음, 비난, 트집 잡음을 포함하므로, 문맥상 허위 고발의 뉘앙스를 살릴 수 있는 ‘비방하던’이 가장 균형적입니다.
- source_word: δόξαν αἰώνιον
  english_pob_choice: everlasting glory
  chosen_korean: 영원한 영광
  alternatives_korean:
  - 영속하는 영광
  - 세세한 영광
  lexicon: LSJ
  rationale: αἰώνιος는 ‘영원한’이 가장 자연스럽고, 문학적 높임도 유지합니다.
theological_decisions:
- issue: 의인화된 지혜의 주어를 한국어에서 어떻게 처리할지
  chosen_reading: 문맥상 ‘지혜’의 여성적 의인화를 유지하되, 본문에서는 3인칭 여성 대명사 대신 서술 동사를 자연스럽게 연결했습니다.
  alternative_readings:
  - ‘그녀는’이라고 직접 표기함
  - ‘지혜는’으로 주어를 반복함
  rationale: 헬라어는 문맥상 의인화된 지혜를 계속 가리키지만, 한국어는 대명사 반복이 부자연스러워 주어를 드러내지 않고도 의미를 보존했습니다. 이는 원문 흐름과 현대 한국어 가독성을 함께 살리는 선택입니다.
  doctrine_reference: 의인화된 지혜 문학의 수사적 인격화를 보존하되, 실재 인격으로 오해될 표현은 피함.
