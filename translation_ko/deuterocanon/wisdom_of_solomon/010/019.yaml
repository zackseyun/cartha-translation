revisions:
- from: 그런데 주께서는 그들의 원수들을 홍수로 덮으시고, 깊음의 심연에서 그들을 끌어올리셨습니다.[a]
  to: 그러나 지혜는 그들의 원수들을 물로 휩쓰시고, 심연의 깊은 곳에서 그들을 끌어올리셨습니다.[a]
  rationale: 문맥상 주어인 ‘지혜’를 회복하여 원문에 없는 ‘주’라는 호칭을 제거했습니다. 물에 의한 압도라는 κατέκλυσεν의 의미를 자연스러운 한국어로 반영하고, ‘심연의 깊은 곳’으로 속격 구조와 문체를 다듬었습니다. 마지막 동사는 결과를 죽음으로 단정하지 않는 ‘끌어올리셨습니다’를 유지하되, 위로 솟게 하는 어휘적 가능성을 각주에 남겼습니다.
