  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/019.yaml
  text: But he flooded their enemies[a], and from the depth of the abyss he cast them up.
  footnotes:
  - marker: a
    text: Or 'brought them up from the depths of the abyss.' The Greek verb can suggest causing something to well up or rise up; here it likely refers to the sea casting the enemies up from the deep.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 지혜는 그들의 원수들을 물로 휩쓰시고, 심연의 깊은 곳에서 그들을 끌어올리셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘심연의 깊은 곳에서 그들을 위로 솟아오르게 하셨습니다.’ ἀνέβρασεν은 무언가를 위로 솟게 하거나 들끓게 하는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς δὲ ἐχθροὺς αὐτῶν
  english_pob_choice: their enemies
  chosen_korean: 그들의 원수들
  alternatives_korean:
  - 그들의 적들
  - 원수들
  lexicon: LSJ
  rationale: ἐχθρούς는 단순한 ‘적’보다 더 대립적이고 적대적인 관계를 드러내므로, 문맥의 심판 이미지를 살려 ‘원수들’로 옮겼습니다.
- source_word: κατέκλυσεν
  english_pob_choice: flooded
  chosen_korean: 홍수로 덮으시고
  alternatives_korean:
  - 홍수로 휩쓰시고
  - 물로 덮으시고
  - 홍수로 범람시키시고
  lexicon: LSJ
  rationale: 동사는 물로 덮어버리거나 범람시키는 뜻이므로, 수(水) 심판의 생생한 이미지를 살리면서도 한국어로 자연스러운 ‘홍수로 덮으시고’로 옮겼습니다.
- source_word: ἐκ βάθους ἀβύσσου
  english_pob_choice: from the depth of the abyss
  chosen_korean: 깊음의 심연에서
  alternatives_korean:
  - 심연의 깊음에서
  - 깊은 심연에서
  - 심연의 깊은 곳에서
  lexicon: LSJ
  rationale: βάθος와 ἄβυσσος의 중첩된 깊이 이미지를 직역에 가깝게 살려 ‘깊음의 심연’으로 두어, 단순한 ‘깊은 곳’보다 원문의 장중함을 보존했습니다.
- source_word: ἀνέβρασεν
  english_pob_choice: cast them up
  chosen_korean: 그들을 끌어올리셨습니다
  alternatives_korean:
  - 그들을 떠올리셨습니다
  - 그들을 위로 솟구치게 하셨습니다
  - 그들을 끌어내셨습니다
  lexicon: LSJ
  rationale: 이 동사는 무언가가 위로 솟아오르거나 끓어오르게 하는 뉘앙스를 가지므로, 물이 그들을 위로 내던지듯 ‘끌어올리셨습니다’로 표현해 수면으로 떠오르게 하는 역동을 살렸습니다.
theological_decisions:
- issue: 죽음의 결과를 직접 말하지 않는 표현
  chosen_reading: 본문의 두 동사는 물 심판의 장면을 그리지만, ‘죽이셨다’나 ‘익사시켰다’는 말을 본문에 덧붙이지 않았습니다.
  alternative_readings:
  - 원수를 익사시켰다고 명시적으로 옮기기
  - ‘시체를 떠올리게 하셨다’처럼 결과를 해석해 넣기
  rationale: 원문은 심판의 물 이미지와 ‘위로 끌어올림’의 역동을 통해 사건을 말하므로, 해석을 앞당겨 결과를 단정하기보다 본문의 긴장을 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
