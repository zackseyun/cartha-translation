  text: But an unrighteous man, having departed from her, perished in his brother-murdering rage.
translation:
  language: ko
  text: 그런데 불의한 사람은 그 여자에게서 떠나, 자기 형제를 죽이는 분노 속에서 멸망하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστὰς δὲ ἀπ' αὐτῆς
  english_pob_choice: having departed from her
  chosen_korean: 그 여자에게서 떠나
  alternatives_korean:
  - 그녀에게서 떠나
  - 그로부터 떠나
  - 그 여자 곁을 떠나
  lexicon: ἀποστής/ἀποσταίνω
  rationale: 문맥상 지혜를 의인화한 여성을 가리키므로, '그 여자'로 옮겨 인칭을 분명히 하되 '떠나'로 출발/이탈의 동작을 자연스럽게 살렸습니다.
- source_word: ἄδικος
  english_pob_choice: an unrighteous man
  chosen_korean: 불의한 사람은
  alternatives_korean:
  - 의롭지 않은 사람은
  - 불의한 자는
  - 불의한 사람
  lexicon: ἄδικος
  rationale: 도덕적·언약적 불의를 나타내므로 '불의한'이 직접적이며, 현대 한국어에서 자연스러운 '사람은'을 붙여 문장을 매끈하게 했습니다.
- source_word: ἀδελφοκτόνοις θυμοῖς
  english_pob_choice: brother-murdering rage
  chosen_korean: 자기 형제를 죽이는 분노 속에서
  alternatives_korean:
  - 형제를 죽이는 격분 속에서
  - 형제를 죽이려는 분노 속에서
  - 형제 살해의 분노 속에서
  lexicon: ἀδελφοκτόνος + θυμός
  rationale: ἀδελφοκτόνοις는 단순한 '형제에게 화난' 상태가 아니라 '형제를 죽이는' 파괴적 분노를 가리키므로, POB의 'brother-murdering rage'를 직역에 가깝게 살렸습니다.
- source_word: συναπώλετο
  english_pob_choice: perished
  chosen_korean: 멸망하였습니다
  alternatives_korean:
  - 함께 망하였습니다
  - 완전히 망하였습니다
  - 죽었습니다
  lexicon: συναπόλλυμι
  rationale: 단순 사망보다 전인적 파멸을 드러내는 동사이므로 '멸망하였습니다'가 문맥과 어휘 폭을 가장 잘 반영합니다.
theological_decisions:
- issue: 지혜를 떠나는 행위의 의미
  chosen_reading: 본문은 단순한 공간 이동이 아니라 지혜를 등지고 불의로 돌아선 윤리적·신학적 이탈을 말합니다.
  alternative_readings:
  - 지혜의 처소를 떠난 단순한 이동
  - 추상적 지식으로부터의 이탈
  rationale: 지혜문학에서 지혜는 인격적으로 의인화되며, 여기서 '떠남'은 곧 지혜와 생명의 길을 버리는 행위로 읽는 것이 자연스럽습니다.
  doctrine_reference: 잠언 1–9; 지혜 7–10의 지혜 의인화
- issue: ἀδελφοκτόνοις를 '형제 살해'로 약화하지 않음
  chosen_reading: '''자기 형제를 죽이는 분노''로, 분노의 파괴성과 살해성을 함께 드러냈습니다.'
  alternative_readings:
  - '''형제 살해의 분노'''
  - '''형제를 해치는 분노'''
  rationale: POB의 'brother-murdering rage'는 단순 비유가 아니라 분노가 살해 행위로 치닫는 상태를 강조하므로, 한국어에서도 그 긴장을 보존했습니다.
  doctrine_reference: 야고보서 1:20; 1요한 3:15
