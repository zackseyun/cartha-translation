  naturalness: 현대 표준어 합쇼체에서 ‘그 여자에게서’는 지혜의 여성 의인화에 적절한 지시 표현이 아니며, ‘그녀에게서’가 더 자연스럽습니다. ‘자기의 격분, 곧 형제를 죽이는 분노’는 원문의 병렬적 강조를 한국어에서 과도한 반복 없이 드러냅니다.
  terminology: ‘불의한 사람’, ‘멸망하였습니다’는 각각 ἄδικος와 συναπώλετο에 적절합니다. ‘격분’은 θυμός의 격렬함을 살리고, ‘형제를 죽이는 분노’는 ἀδελφοκτόνοις를 단순한 형제 간 분노로 약화하지 않습니다.
