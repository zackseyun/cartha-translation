base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/005.yaml
  text: She also[a], when the nations were thrown into confusion in their wicked conspiracy, found the righteous man and kept him blameless before God[c][b], and kept him strong against his compassion for his child.
  footnotes:
  - marker: a
    text: Or 'in wicked unanimity' or 'in evil concord.' The phrase describes the nations' shared evil purpose.
    reason: lexical_alternative
  - marker: b
    text: '''The righteous man'' likely refers to Abraham in context, but the Greek does not name him here.'
    reason: cross_reference
  - marker: c
    text: Or 'kept him steadfast despite his tender feelings for his son.' The Greek speaks of inward affections or compassion for a child.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 지혜도[a] 민족들이 악한 일에 한마음이 되어 혼란에 빠졌을 때, 의로운 사람을 찾아내어[b] 하나님 앞에서 흠 없게 지켜 주셨고, 그의 자녀를 향한 애정에도 그를 굳세게 지켜 주셨습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이 지혜’는 앞문맥에서 인격화되어 나타나는 지혜를 가리킵니다.
    reason: cross_reference
  - marker: b
    text: ‘의로운 사람’은 문맥상 아브라함을 가리킬 가능성이 크지만, 그리스어 본문은 여기서 이름을 밝히지 않습니다.
    reason: cross_reference
  - marker: c
    text: ‘자녀를 향한 애정’은 자녀를 향한 내적 정서나 깊은 마음을 뜻할 수 있습니다. 이 표현은 그 애정에 맞서 굳셈을 지키는 관계를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  english_pob_choice: She also
  chosen_korean: 이 여인도
  alternatives_korean:
  - 그녀도
  - 지혜도
  lexicon: LSJ
  rationale: 문맥상 인격화된 지혜를 가리키지만, 한국어에서는 문장 첫머리에서 자연스럽고 성별 표지가 살아 있는 표현으로 ‘이 여인도’가 가장 잘 맞습니다.
- source_word: ἐν ὁμονοίᾳ πονηρίᾳ
  english_pob_choice: in their wicked conspiracy / wicked agreement
  chosen_korean: 그들의 악한 합의 속에서
  alternatives_korean:
  - 악한 연합 속에서
  - 악한 한뜻 속에서
  lexicon: LSJ
  rationale: ὁμονοία는 ‘한마음/합의’의 뜻이므로 단순한 ‘음모’보다 합의의 뉘앙스를 살려 ‘악한 합의’로 옮겼습니다.
- source_word: εὗρεν τὸν δίκαιον
  english_pob_choice: found the righteous man
  chosen_korean: 의로운 사람을 찾아내어
  alternatives_korean:
  - 의로운 남자를 찾아내어
  - 의인으로 보이는 이를 찾아내어
  lexicon: LSJ
  rationale: τὸν δίκαιον의 실질적 의미를 살리되, 한국어에서 성중립적이고 문맥상 자연스러운 ‘의로운 사람’으로 옮겼습니다.
- source_word: ἄμεμπτον θεῷ
  english_pob_choice: blameless before God
  chosen_korean: 하나님 앞에서 흠 없게
  alternatives_korean:
  - 하나님 앞에 흠 없이
  - 하나님께 흠 없게
  lexicon: LSJ
  rationale: θεῷ의 여격 관계를 한국어에서는 관계적 표현 ‘하나님 앞에서’로 풀어, 공적·관계적 평가의 느낌을 유지했습니다.
- source_word: ἐπὶ τέκνου σπλάγχνοις
  english_pob_choice: against his compassion for his child
  chosen_korean: 자녀에 대한 그의 애정 속에서도
  alternatives_korean:
  - 자녀를 향한 그의 깊은 마음 때문에도
  - 자녀에 대한 그의 측은한 마음에도 불구하고
  lexicon: LSJ
  rationale: σπλάγχνα는 내적인 정서·애정을 가리키므로, 단순한 ‘연민’보다 문맥에 맞는 ‘애정/깊은 마음’으로 옮겼습니다.
- source_word: ἰσχυρὸν ἐφύλαξεν
  english_pob_choice: kept him strong
  chosen_korean: 그를 강하게 지켜 주었습니다
  alternatives_korean:
  - 그를 굳세게 지켜 주었습니다
  - 그를 강건하게 보전하셨습니다
  lexicon: LSJ
  rationale: φυλάσσω의 보호·보전 의미와 ἰσχυρός의 ‘강함/굳셈’을 함께 살려, 자연스러운 서술형으로 처리했습니다.
theological_decisions:
- issue: 여인(지혜)의 인격화 표현
  chosen_reading: 주어 αὕτη를 인격화된 지혜를 가리키는 ‘이 여인도’로 번역해, 원문의 여성 지시와 서술적 인격화를 유지했습니다.
  alternative_readings:
  - 지혜도
  - 이것도
  rationale: 원문은 여성형 지시대명사로 앞문맥의 지혜를 가리키므로, 이를 비인격적 ‘이것’으로 약화시키지 않았습니다.
  doctrine_reference: 원문 지시 대상의 인격화 유지
- issue: 아브라함 암시를 본문에서 이름으로 명시할지 여부
  chosen_reading: 본문에는 ‘의로운 사람’만 두고 이름은 밝히지 않았습니다.
  alternative_readings:
  - 아브라함
  rationale: 영어 POB도 주석으로만 아브라함 가능성을 제시하듯, 그리스어 본문이 실제로는 명칭이 아닌 서술적 호칭을 쓰므로 본문은 절제하고 독자가 문맥상 파악하도록 두었습니다.
  doctrine_reference: 원문 우선, 해석은 주석으로 분리
- issue: 마지막 절의 정서적 긴장
  chosen_reading: ‘자녀에 대한 그의 애정 속에서도’라고 옮겨, 외적 보호와 내적 부성 정서 사이의 긴장을 그대로 남겼습니다.
  alternative_readings:
  - 자녀를 사랑하는 마음에도 불구하고
  - 자녀를 향한 그의 부드러운 마음과 상관없이
  rationale: 원문은 아버지의 깊은 내적 정서를 가리키며, 이를 지나치게 사건화하거나 희석하지 않기 위해 긴장을 유지하는 표현을 택했습니다.
  doctrine_reference: 정서적·신학적 긴장 보존
