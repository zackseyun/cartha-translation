  source_fidelity: ‘그녀의’는 여성 문법형 관계대명사를 한국어의 여성 인물 지시로 고정하여, 앞 문맥의 장소/도시에 대한 지시일 수 있는 원문의 범위를 부당하게 좁힙니다. ‘그곳의’가 문맥상 자연스럽고 원문의 비인칭적 지시 가능성을 보존합니다. 또한 ἀτελέστιοι … καρποφοροῦντα φυτά는 열매가 완성·성숙에 이르지 못하는 식물의 표상으로 옮기는 것이 적절하므로, ‘제때 열매를 맺지 못하는’보다 ‘끝내 익지 않는 열매를 맺는’이 더 충실합니다.
  naturalness: 나열된 사물들을 주어로 삼아 ‘증언하고 있습니다’라고 하면 현대 한국어로 자연스럽고, ‘여전히’와 현재분사 καπνιζομένη의 지속성도 유지됩니다. ‘연기를 내는 황무지’와 ‘기념물로 서 있는 소금 기둥’은 합쇼체 본문에 알맞은 격식을 유지합니다.
  terminology: πονηρία는 ‘악행’으로, χέρσος는 ‘황무지’로, μνημεῖον은 ‘기념물’로 유지할 수 있습니다. ἀπιστούσης는 본문에서는 ‘믿지 않는’으로 두고, ‘신실하지 않은’이라는 가능한 대안은 해당 어구에 붙인 각주에서 밝혀야 합니다. ‘영혼’은 ψυχή의 직역으로 허용됩니다.
