  lexicon: LSJ
  rationale: 사물들이 어떤 사실을 드러내는 증언의 기능을 보이므로, 명사형보다 문장 전체의 증언 관계를 살리는 동사를 택했습니다.
- source_word: καπνιζομένη χέρσος
  english_pob_choice: a smoking wasteland
  chosen_korean: 연기 나는 황무지
  alternatives_korean:
  - 연기 피어오르는 황무지
  - 아직 연기 나는 황무지
  lexicon: LSJ
  rationale: καπνιζομένη의 현재 분사적 지속성을 ‘연기 나는’으로 간결하게 옮기고, χέρσος는 파괴된 불모지를 뜻하는 ‘황무지’로 옮겼습니다.
- source_word: ἀτελέστιοι ὥρας καρποφοροῦντα φυτά
  english_pob_choice: plants bearing fruit that never ripens
  chosen_korean: 제때 열매를 맺지 못하는 식물들
  alternatives_korean:
  - 익지 않는 열매를 맺는 식물들
  - 끝내 익지 않는 열매를 맺는 식물들
  lexicon: LSJ
  rationale: ἀτελέστιοι는 ‘완성되지 않은/끝나지 않은’의 뜻이므로, 열매가 성숙에 이르지 못한다는 점을 한국어 동작 표현으로 풀었습니다.
- source_word: ἀπιστούσης ψυχῆς
  english_pob_choice: of an unbelieving soul
  chosen_korean: 믿지 않는 영혼
  alternatives_korean:
  - 믿음 없는 영혼
  - 불신하는 영혼
  lexicon: LSJ
  rationale: ἀπιστέω 계열의 의미 범위가 ‘믿지 않음’과 ‘신실하지 않음’을 함께 담을 수 있어, 본문이 드러내는 불신의 성격을 우선 살렸습니다.
- source_word: μνημεῖον ἑστηκυῖα στήλη ἁλός
  english_pob_choice: a pillar of salt standing as a memorial
  chosen_korean: 기념물로 서 있는 소금 기둥
  alternatives_korean:
  - 기념비로 서 있는 소금 기둥
  - 기억의 표지로 서 있는 소금 기둥
  lexicon: LSJ
  rationale: μνημεῖον의 기념/기억 기능을 ‘기념물’로 옮기고, ἑστηκυῖα의 정지 상태를 ‘서 있는’으로 반영했습니다.
theological_decisions:
- issue: 소금 기둥의 인물 식별 여부
  chosen_reading: 본문이 직접 이름을 말하지 않으므로, ‘그녀’라는 지시만 두고 롯의 아내를 본문에 명시하지 않았습니다.
  alternative_readings:
  - 롯의 아내로 명시하기
  - 중립적으로 ‘그것’으로 처리하기
  rationale: 원문은 창세기 전승을 암시하지만, 이 절 자체는 특정 인물을 호명하지 않습니다. 번역은 암시를 보존하되 본문 밖 식별을 덧붙이지 않는 쪽이 원문 충실도에 맞습니다.
  doctrine_reference: 원문 우선 원칙; 성경 내 상호참조는 주석으로 처리
