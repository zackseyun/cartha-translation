base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/007.yaml
  text: whose wickedness still has as its witness a smoking wasteland[a], plants bearing fruit that never ripens[b], and a pillar of salt standing as a memorial of an unbelieving soul.
  footnotes:
  - marker: a
    text: The 'pillar of salt' alludes to Lot's wife in Genesis 19:26, though this verse does not name her explicitly.
    reason: cross_reference
  - marker: b
    text: Or 'a memorial of a faithless soul.' The Greek ἀπιστούσης can denote unbelief or faithlessness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀의 악행은 여전히 연기 나는 황무지[a], 제때 열매를 맺지 못하는 식물들[b], 그리고 믿지 않는 영혼의 기념물로 서 있는 소금 기둥이 증언합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 소금 기둥은 창세기 19:26의 롯의 아내를 떠올리게 하지만, 이 절은 그 이름을 직접 말하지는 않습니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘믿지 않는 영혼의 기념물’입니다. 헬라어 ἀπιστούσης는 불신과 신실하지 않음을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἧς
  english_pob_choice: whose
  chosen_korean: 그녀의
  alternatives_korean:
  - 그것의
  - 그 여인의
  lexicon: LSJ
  rationale: 앞절의 대상에 대한 여성 단수 소유 관계를 자연스럽게 살리되, 본문이 특정 인물을 명시하지 않으므로 과도한 식별은 피했습니다.
- source_word: μαρτύριον
