  lexicon: ῥύομαι
  rationale: 영어 POB의 ‘rescued’를 살리면서도 본문이 가리키는 적극적 구출을 드러내기 위해 ‘구해 내다’를 선택했습니다.
theological_decisions:
- issue: ‘sin’의 범위
  chosen_reading: ‘죄’로 번역해 도덕적 악과 그 결과에서의 구출을 함께 드러냈습니다.
  alternative_readings:
  - ‘죄악’
  - ‘죄에서 벗어나게 하셨습니다’
  rationale: 헬라어 ἁμαρτία는 단일한 행위만이 아니라 상태와 권세를 가리킬 수 있으므로, 간결한 ‘죄에서’가 본문의 폭을 가장 무리 없이 보존합니다.
  doctrine_reference: 지혜서의 구원 언어는 서술적·교훈적 문맥에서 읽어야 하며, 본절은 구속사적 모형으로 과장하지 않고 본문 자체의 의미를 우선합니다.
