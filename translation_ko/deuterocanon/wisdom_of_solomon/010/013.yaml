  lexicon: πραίνω / passive participle
  rationale: 수동 분사로서 ‘팔려 간’이 사건의 상태를 가장 직접적으로 드러내며, 단순 과거보다 본문 흐름에 잘 맞습니다.
- source_word: δίκαιον
  english_pob_choice: the righteous man
