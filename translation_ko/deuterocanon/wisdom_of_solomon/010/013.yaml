  - 의인된 사람
  lexicon: δίκαιος
  rationale: 지혜서의 문맥에서 δικαιος는 윤리적 성품을 넘어 하나님 앞에서 바른 자를 가리키므로, 관용적으로도 정확한 ‘의인’을 택했습니다.
- source_word: ἐρρύσατο αὐτόν
  english_pob_choice: rescued him
  chosen_korean: 그를 구해 내셨습니다
  alternatives_korean:
