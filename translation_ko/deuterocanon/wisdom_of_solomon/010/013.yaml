lexical_decisions:
- source_word: αὕτη
  english_pob_choice: She
  chosen_korean: 그녀는
  alternatives_korean:
  - 이 여인은
  - 그 여인은
  lexicon: 지시대명사
  rationale: 문맥상 지혜를 인격화한 주어를 가리키므로 3인칭 여성 대명사로 자연스럽게 옮겼습니다.
- source_word: πραθέντα
  english_pob_choice: when he was sold
  chosen_korean: 팔려 간
  alternatives_korean:
  - 팔린
  - 팔려 버린
  lexicon: πραίνω / passive participle
  rationale: 수동 분사로서 ‘팔려 간’이 사건의 상태를 가장 직접적으로 드러내며, 단순 과거보다 본문 흐름에 잘 맞습니다.
- source_word: δίκαιον
  english_pob_choice: the righteous man
  chosen_korean: 의인
  alternatives_korean:
  - 의로운 사람
  - 의인된 사람
  lexicon: δίκαιος
  rationale: 지혜서의 문맥에서 δικαιος는 윤리적 성품을 넘어 하나님 앞에서 바른 자를 가리키므로, 관용적으로도 정확한 ‘의인’을 택했습니다.
- source_word: ἐρρύσατο αὐτόν
  english_pob_choice: rescued him
  chosen_korean: 그를 구해 내셨습니다
  alternatives_korean:
  - 그를 건져 내셨습니다
  - 그를 구원하셨습니다
  lexicon: ῥύομαι
  rationale: 영어 POB의 ‘rescued’를 살리면서도 본문이 가리키는 적극적 구출을 드러내기 위해 ‘구해 내다’를 선택했습니다.
theological_decisions:
- issue: ‘sin’의 범위
  chosen_reading: ‘죄’로 번역해 도덕적 악과 그 결과에서의 구출을 함께 드러냈습니다.
  alternative_readings:
  - ‘죄악’
  - ‘죄에서 벗어나게 하셨습니다’
  rationale: 헬라어 ἁμαρτία는 단일한 행위만이 아니라 상태와 권세를 가리킬 수 있으므로, 간결한 ‘죄에서’가 본문의 폭을 가장 무리 없이 보존합니다.
  doctrine_reference: 지혜서의 구원 언어는 서술적·교훈적 문맥에서 읽어야 하며, 본절은 구속사적 모형으로 과장하지 않고 본문 자체의 의미를 우선합니다.
