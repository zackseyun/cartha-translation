  - 숨어서 노리던 자들
  lexicon: LSJ
  rationale: ‘매복하다’의 구체적 이미지를 살리면서도 한국어로 매끄럽게 읽히도록 풀어 옮겼습니다.
- source_word: ἀγῶνα ἰσχυρόν
  english_pob_choice: a strong contest
  chosen_korean: 강한 싸움
  alternatives_korean:
  - 강한 경기
  - 강력한 경합
  - 힘겨운 싸움
  lexicon: LSJ
  rationale: ἀγών의 경쟁/투쟁 이미지를 반영하되, 본문의 교육적·시련적 맥락에서 현대 독자가 이해하기 쉬운 ‘싸움’이 가장 직접적입니다.
- source_word: ἐβράβευσεν αὐτῷ
  english_pob_choice: awarded him
  chosen_korean: 그에게 주셔서
  alternatives_korean:
  - 그에게 상을 주셔서
  - 그에게 수여하셔서
  lexicon: LSJ
  rationale: 이 동사는 경기의 심판/수여 이미지를 지니지만, 문맥상 ‘시련 자체를 부여하다’는 기능이 강하므로 한국어에서는 너무 스포츠적으로 굳히지 않고 ‘주셔서’로 옮기면서도 다음 절의 목적절과 연결되게 했습니다.
- source_word: εὐσέβεια
  english_pob_choice: godliness
  chosen_korean: 경건함
  alternatives_korean:
  - 경외
  - 독실함
  - 신앙
  lexicon: LSJ
  rationale: 유대-지혜문학의 εὐσέβεια는 단순한 내면 태도보다 하나님께 대한 삶 전체의 경건을 가리키므로, 교회적 어휘이면서도 의미가 넓은 ‘경건함’이 적절합니다.
theological_decisions:
- issue: 의인화된 지혜의 주어 표지
  chosen_reading: 문맥상 여성 주어를 드러내는 3인칭으로 번역하지 않고, 한국어에서는 직접 언급 없이 행위를 연속적으로 제시했습니다.
  alternative_readings:
  - 그녀는 그를 보호하셨습니다
  - 지혜는 그를 보호하셨습니다
  rationale: 헬라어 본문은 앞선 문맥에서 이어지는 여성형 주어를 전제하지만, 한국어에서 이를 과도하게 반복하면 문장이 부자연스러워질 수 있어 주어 생략으로 문맥적 인칭을 보존했습니다.
  doctrine_reference: 문학적 의인화 보존과 자연스러운 한국어 문장성 유지
