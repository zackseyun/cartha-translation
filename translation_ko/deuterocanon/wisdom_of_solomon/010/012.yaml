base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/012.yaml
  text: She protected him from enemies[a], and from those lying in ambush she kept him safe; and she awarded him a strong contest[b], so that he might know that godliness is stronger than everything.
  footnotes:
  - marker: a
    text: Or 'a mighty contest' or 'the prize in a hard struggle.' The Greek uses contest-and-prize imagery in saying Wisdom ἐβράβευσεν αὐτῷ.
    reason: lexical_alternative
  - marker: b
    text: Or 'piety.' The Greek εὐσέβεια denotes reverent devotion to God expressed in life.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 원수들로부터 그를 보호하시고, 매복해 기다리던 자들로부터 그를 안전하게 지키셨으며, 강한 싸움을 그에게 주셔서 그가 경건함이 모든 것보다 더 강하다는 것을 알게 하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘강한 경기’나 ‘힘겨운 싸움’입니다. 헬라어 ἀγῶνα ἰσχυρόν은 경쟁과 संघर्ष의 이미지를 함께 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘경건함’을 뜻합니다. 헬라어 εὐσέβεια는 삶으로 드러나는 하나님께 대한 경건한 헌신을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεφύλαξεν
  english_pob_choice: protected
  chosen_korean: 보호하시고
  alternatives_korean:
  - 지키시고
  - 보살피시고
  lexicon: LSJ
  rationale: 위험으로부터의 방어와 보호라는 뜻을 자연스러운 현대 한국어로 옮기되, 뒤의 ‘안전하게 지키셨으며’와 중복되지 않도록 ‘보호하시고’로 처리했습니다.
- source_word: ἐνεδρευόντων
