  chosen_korean: 힘
  alternatives_korean:
  - 능력
  - 강함
  - 권능
  lexicon: BDAG
  rationale: ἰσχύς의 물리적·실행적 힘을 간결하게 드러내는 말로 ‘힘’이 가장 직접적입니다.
- source_word: κρατῆσαι
  english_pob_choice: to rule over / to master
  chosen_korean: 다스릴
  alternatives_korean:
  - 지배할
  - 주관할
  - 장악할
  lexicon: LSJ
  rationale: κρατέω의 지배·통치의 의미를 한국어 동사 ‘다스리다’로 옮겨, 원문의 지배적 행위를 자연스럽게 표현했습니다.
- source_word: ἁπάντων
  english_pob_choice: all things
  chosen_korean: 모든 것
  alternatives_korean:
  - 만물을
  - 전부를
  - 모든 존재를
  lexicon: BDAG
  rationale: 포괄적 범위를 유지하되 한국어에서는 ‘모든 것’이 가장 무난하고 넓은 표현입니다.
theological_decisions:
- issue: κρατῆσαι의 지배 의미를 어떻게 살릴지
  chosen_reading: ‘다스릴 힘’으로 옮겨, 단순한 신체적 힘이 아니라 통치·주관 능력을 함께 드러냈습니다.
  alternative_readings:
  - ‘지배할 힘’
  - ‘장악할 힘’
  - ‘모든 것을 다스릴 권세’
  rationale: 본문은 ‘힘’과 ‘지배/통치’의 결합을 말하므로 둘을 분리하지 않고 함께 살리는 번역이 원문에 가장 가깝습니다. 다만 ‘권세’는 본문에 없는 요소를 덧붙일 수 있어 피했습니다.
  doctrine_reference: 원문 우선 원칙; 지배 언어는 창세기적 인간 위임의 넓은 뉘앙스를 유지해야 함
