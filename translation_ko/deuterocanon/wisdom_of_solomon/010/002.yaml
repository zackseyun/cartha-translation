lexical_decisions:
- source_word: ἔδωκέν τε
  english_pob_choice: and gave
  chosen_korean: 그리고 … 주셨습니다
  alternatives_korean:
  - 그리고 … 주었습니다
  - 또 … 주셨습니다
  lexicon: BDAG; LSJ
  rationale: ἔδωκεν의 단순 과거와 τε의 연결 기능을 자연스러운 서술체로 살려, 앞 문맥과 이어지는 ‘그리고’로 옮겼습니다.
- source_word: αὐτῷ
