  chosen_korean: 그에게
  alternatives_korean:
  - 그분에게
  - 그 사람에게
  lexicon: BDAG
  rationale: 문맥상 앞선 인물에게 되돌아가는 대명사이므로, 자연스러운 여격 표현인 ‘그에게’로 옮겼습니다.
- source_word: ἰσχὺν
