base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/017.yaml
  text: He gave the holy ones the reward of their labors[a], guided them in a marvelous way[c][b], and became for them a shelter by day and a flame of stars by night.
  footnotes:
  - marker: a
    text: The imagery recalls God's guidance and protection in the exodus, especially the cloud by day and fire by night; the Greek here states this allusively rather than with the full traditional formula.
    reason: cross_reference
  - marker: b
    text: Or 'the godly' for 'the holy ones.'
    reason: lexical_alternative
  - marker: c
    text: The phrase 'a flame of stars' is literal; it may also be understood as 'a starry flame.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 거룩한 이들에게 그들의 수고에 대한 상을 주시고[a], 놀라운 길로 그들을 인도하시며[b], 낮에는 그들에게 피난처가 되시고 밤에는 별들의 불꽃이 되셨습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 이미지는 출애굽에서 낮의 구름과 밤의 불로 인도하시고 보호하신 하나님의 역사를 떠올리게 합니다. 다만 여기의 그리스어는 그 전통을 암시적으로만 전합니다.
    reason: cross_reference
  - marker: b
    text: ‘경건한 이들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 표현은 문자적으로는 ‘별들의 불꽃’이며, ‘별빛이 섞인 불꽃’ 또는 ‘별무리 같은 불꽃’으로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁσίοις
  english_pob_choice: the holy ones
  chosen_korean: 거룩한 이들
  alternatives_korean:
  - 경건한 이들
  - 하나님께 속한 이들
  - 성도들
  lexicon: BDAG
  rationale: ὅσιος는 경건함과 거룩함을 함께 띠지만, 문맥상 하나님께 속한 사람들을 가리키므로 ‘거룩한 이들’이 가장 직접적입니다. ‘성도들’은 이후의 교회 용어를 강하게 불러와 다소 후대적입니다.
- source_word: μισθὸν κόπων αὐτῶν
  english_pob_choice: the reward of their labors
  chosen_korean: 그들의 수고에 대한 상
  alternatives_korean:
  - 그들의 노동의 보상
  - 그들의 수고의 보상
  - 그들의 땀의 대가
  lexicon: BDAG
  rationale: μισθός는 ‘보상/상/삯’의 뜻이 가능하므로, 시적·지혜문학적 문맥에 맞게 ‘상’으로 옮겼습니다. κόπος는 단순한 일보다 수고와 고됨을 담아 ‘수고’가 적절합니다.
- source_word: ἐν ὁδῷ θαυμαστῇ
  english_pob_choice: in a marvelous way
  chosen_korean: 놀라운 길로
  alternatives_korean:
  - 기이한 길로
  - 경이로운 길로
  - 놀라운 방식으로
  lexicon: BDAG
  rationale: ἐν ὁδῷ는 문자적으로 ‘길 안에서/길로’의 표현이므로, 한국어에서는 자연스럽게 ‘길로’ 처리했습니다. θαυμαστῇ의 놀라움과 경이성을 살리되, 본문의 인도 이미지를 유지했습니다.
- source_word: σκέπην
  english_pob_choice: a shelter
  chosen_korean: 피난처
  alternatives_korean:
  - 보호
  - 덮개
  - 그늘
  lexicon: BDAG
  rationale: σκέπη는 덮음, 보호, 피난의 뜻을 가지며, 낮의 보호 이미지를 살리기에 ‘피난처’가 가장 분명합니다. ‘그늘’은 시적으로 가능하지만 원뜻을 다 담지는 못합니다.
- source_word: φλόγα ἄστρων
  english_pob_choice: a flame of stars
  chosen_korean: 별들의 불꽃
  alternatives_korean:
  - 별빛의 불꽃
  - 별의 불꽃
  - 별무리 같은 불꽃
  lexicon: LSJ
  rationale: 그리스어의 압축된 이미지를 직역에 가깝게 살리기 위해 ‘별들의 불꽃’으로 옮겼습니다. 영어 POB의 literal 지시를 따라, 해석을 과도하게 풀지 않았습니다.
theological_decisions:
- issue: 출애굽의 낮·밤 보호 이미지의 처리
  chosen_reading: 본문의 직접 표현을 유지하고, 출애굽의 구름·불기둥을 본문 안에서 암시만 하도록 두었습니다.
  alternative_readings:
  - 낮에는 구름 기둥, 밤에는 불기둥으로 확장 번역
  - 주석 없이 출애굽 배경을 명시적으로 풀어 씀
  rationale: 그리스어는 전통적 공식과 연결되지만 동일 문구를 반복하지는 않으므로, 주해를 본문에 흡수하지 않는 것이 원문 충실에 맞습니다.
  doctrine_reference: 원문이 말하는 것 이상을 본문에 덧붙이지 않음
