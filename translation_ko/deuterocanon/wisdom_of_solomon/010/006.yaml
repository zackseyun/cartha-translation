base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/006.yaml
  text: She rescued a righteous man when the ungodly were perishing[b][a], as he fled the fire descending on the Five Cities.
  footnotes:
  - marker: a
    text: That is, the confederation of five cities associated with Sodom; the verse alludes to Lot's escape.
    reason: cross_reference
  - marker: b
    text: Or "the descending fire"; the Greek describes fire coming down on the Five Cities without explicitly stating "from heaven."
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜는 불경한 자들이 멸망해 갈 때, 다섯 도시[a] 위로 내려오는 불[b]을 피해 달아나던 의로운 사람을 구해 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉, 소돔과 관련된 다섯 도시의 연합체를 가리킵니다. 이 절은 롯의 탈출을 암시합니다.
    reason: cross_reference
  - marker: b
    text: 또는 “내려오는 불”로 옮길 수 있습니다. 그리스어는 불이 다섯 도시 위로 내려오는 것을 말할 뿐, ‘하늘로부터’라고 분명히 밝히지는 않습니다.
    reason: lexical_alternative
