base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/006.yaml
  text: She rescued a righteous man when the ungodly were perishing[b][a], as he fled the fire descending on the Five Cities.
  footnotes:
  - marker: a
    text: That is, the confederation of five cities associated with Sodom; the verse alludes to Lot's escape.
    reason: cross_reference
  - marker: b
    text: Or "the descending fire"; the Greek describes fire coming down on the Five Cities without explicitly stating "from heaven."
    reason: lexical_alternative
translation:
  language: ko
  text: 이 여인은 불경한 자들이 멸망해 갈 때에, 불이 내려오는 가운데 도망하던 의로운 사람을 구해 주었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉, 소돔과 관련된 다섯 도시의 연합체를 가리킵니다. 이 절은 롯의 탈출을 암시합니다.
    reason: cross_reference
  - marker: b
    text: 또는 “내려오는 불”입니다. 그리스어는 불이 다섯 도시 위로 내려오는 것을 말할 뿐, ‘하늘로부터’라고 분명히 밝히지는 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  english_pob_choice: She
  chosen_korean: 이 여인은
  alternatives_korean:
  - 그녀는
  - 이분은
  lexicon: LSJ
  rationale: 앞 문맥의 의인화된 지혜를 가리키는 여성 지시어이므로, 한국어에서도 인칭화된 표현인 ‘이 여인’으로 살려 문학적 인격화를 유지했습니다.
- source_word: δίκαιον
  english_pob_choice: a righteous man
  chosen_korean: 의로운 사람
  alternatives_korean:
  - 의로운 한 사람
  - 의인
  lexicon: LSJ
  rationale: 형용사 δίκαιος의 도덕적 의미를 자연스럽게 살리되, 한국어에서는 문맥상 특정 인물명을 밝히지 않은 채 ‘사람’으로 옮겨 서술의 개방성을 유지했습니다.
- source_word: ἐξαπολλυμένων ἀσεβῶν
  english_pob_choice: the ungodly were perishing
  chosen_korean: 불경한 자들이 멸망해 갈 때에
  alternatives_korean:
  - 불경한 자들이 사라져 갈 때에
  - 악한 자들이 멸망해 갈 때에
  lexicon: LSJ
  rationale: ἀσεβής의 핵심은 하나님을 경외하지 않는 불경함이므로 ‘불경한 자들’로 옮겼고, 진행 중인 파괴를 ‘멸망해 갈 때에’로 표현해 과정성을 살렸습니다.
- source_word: πῦρ καταβάσιον
  english_pob_choice: the fire descending
  chosen_korean: 불이 내려오는 가운데
  alternatives_korean:
  - 내려오는 불 가운데
  - 내려온 불 가운데
  lexicon: LSJ
  rationale: καταβάσιος의 ‘내려오는’ 의미를 직접 반영하되, 문장 흐름상 재난 속 탈출 장면으로 읽히도록 ‘가운데’로 처리했습니다.
- source_word: Πενταπόλεως
  english_pob_choice: the Five Cities
  chosen_korean: 다섯 도시
  alternatives_korean:
  - 펜타폴리스
  - 오성읍
  lexicon: LSJ
  rationale: 펜타폴리스의 뜻을 직역해 현대 독자가 즉시 이해할 수 있게 했으며, 고유지명 음역보다 의미 전달을 우선했습니다.
theological_decisions:
- issue: 지혜의 의인화인 αὕτη의 처리
  chosen_reading: 지혜를 가리키는 여성적 의인화를 한국어에서도 유지해, 단순한 지시대명사나 추상명사로 평면화하지 않았습니다.
  alternative_readings:
  - 이것은
  - 지혜는
  rationale: 문맥 전체가 지혜의 구원 행위를 서술하므로, 성별이 드러나는 인칭화 표현이 본문의 문학·신학적 효과를 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: 본문이 드러내는 인격적 의인화는 가능한 한 유지한다'
- issue: 소돔 관련 암시의 명시성
  chosen_reading: 본문의 직접 표현을 따라 인물명이나 지명을 덧붙이지 않고, ‘다섯 도시’와 불의 하강만 드러냈습니다.
  alternative_readings:
  - 롯이 도망할 때에
  - 소돔과 그 성읍들이 불탈 때에
  rationale: 그리스어 본문은 롯이나 소돔을 직접 언급하지 않으므로, 암시를 과도하게 풀어 쓰지 않고 원문 수준의 절제를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: 원문에 없는 해설적 정보는 본문에 삽입하지 않는다'
