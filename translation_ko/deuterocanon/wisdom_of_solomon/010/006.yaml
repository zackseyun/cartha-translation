  rationale: ἀσεβής의 핵심은 하나님을 경외하지 않는 불경함이므로 ‘불경한 자들’로 옮겼고, 진행 중인 파괴를 ‘멸망해 갈 때에’로 표현해 과정성을 살렸습니다.
- source_word: πῦρ καταβάσιον
  english_pob_choice: the fire descending
  chosen_korean: 불이 내려오는 가운데
  alternatives_korean:
