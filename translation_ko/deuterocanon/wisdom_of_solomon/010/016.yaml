    text: 문맥상 이 '주님의 종'은 모세를 가리킵니다.
    reason: cross_reference
  - marker: b
    text: 또는 '표징들과 함께'. 헬라어 구문은 수단이나 동반 상황을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  english_pob_choice: entered
  chosen_korean: 들어가서
  alternatives_korean:
  - 들어갔습니다
  - 진입했습니다
  lexicon: LSJ
  rationale: εἰσέρχομαι의 단순한 진입을 자연스럽게 옮기되, 다음 절과의 연결을 살려 서술형으로 처리했습니다.
- source_word: ψυχὴν
  english_pob_choice: soul
  chosen_korean: 영혼
  alternatives_korean:
