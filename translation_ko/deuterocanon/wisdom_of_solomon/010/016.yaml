translation:
  language: ko
  text: 그녀는 주님의 종의 영혼에 들어갔으며, 기이한 일들과 표징들로 무서운 왕들에게 맞섰습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 이 ‘주님의 종’은 모세를 가리킵니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘기이한 일들과 표징들과 함께’. 헬라어 구문은 수단이나 동반 상황을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  english_pob_choice: entered
  chosen_korean: 들어가서
  alternatives_korean:
  - 들어갔습니다
  - 진입했습니다
  lexicon: LSJ
  rationale: εἰσέρχομαι의 단순한 진입을 자연스럽게 옮기되, 다음 절과의 연결을 살려 서술형으로 처리했습니다.
- source_word: ψυχὴν
  english_pob_choice: soul
  chosen_korean: 영혼
  alternatives_korean:
  - 혼
  - 내면
  - 마음
  lexicon: LSJ
  rationale: 여기서는 지혜가 사람 안에 내주하는 문맥이므로 단순한 심리적 의미보다 인격의 중심을 가리키는 표현이 필요해 '영혼'을 택했습니다.
- source_word: θεράποντος Κυρίου
  english_pob_choice: servant of the Lord
  chosen_korean: 주님의 종
  alternatives_korean:
  - 주님의 일꾼
  - 주님의 시종
  lexicon: LSJ
  rationale: θεράπων은 격이 있는 '시종/수종자' 뉘앙스가 있으나, 성경적 문맥에서는 '주님의 종'이 본문의 경외적 관계를 가장 직접적으로 드러냅니다.
- source_word: ἐν τέρασι καὶ σημείοις
  english_pob_choice: with wonders and signs
  chosen_korean: 놀라운 일들과 표징들로
  alternatives_korean:
  - 기이한 일들과 표징들로
  - 이적들과 표징들로
  - 놀라운 일들과 기적들로
  lexicon: LSJ
  rationale: ἐν은 수단/동반 상황을 나타내므로 조사 '-로'를 써서 표현했고, τέρατα와 σημεῖα의 짝을 한국어 성경어감에 맞게 '놀라운 일들'과 '표징들'로 살렸습니다.
theological_decisions:
- issue: 인격화된 지혜의 주어를 한국어에서 어떻게 드러낼지
  chosen_reading: 본문의 여성 인칭을 살려 '그녀'로 옮겼습니다.
  alternative_readings:
  - 지혜는
  - 그것은
  rationale: 앞뒤 문맥 전체가 인격화된 지혜를 말하므로, 무성 대명사로 중화하면 문학적·신학적 흐름이 약해집니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; readable modern Korean'
- issue: 본문에 암시된 인물을 본문에 이름으로 풀지 않을지
  chosen_reading: '''주님의 종''을 유지하고 모세를 본문에 직접 넣지 않았습니다.'
  alternative_readings:
  - 모세의 영혼 안으로 들어가서
  - 주님의 종인 모세의 영혼 안으로
  rationale: 문맥상 모세를 가리키지만, 그 식별은 해설의 영역이며 본문 자체는 일반 명사로 말하므로 원문 어휘를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Original-language primacy over translation tradition'
