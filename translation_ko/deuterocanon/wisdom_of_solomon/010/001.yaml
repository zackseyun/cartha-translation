base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/001.yaml
  text: She guarded the first-formed father of the world[a], when he alone had been created, and she delivered him from his own transgression[b],
  footnotes:
  - marker: a
    text: That is, the first human, Adam.
    reason: cross_reference
  - marker: b
    text: Or 'from his own trespass'; alternatively, 'from his own fall,' though 'fall' is more interpretive than the Greek wording itself.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 세계의 첫 사람[a]이 홀로 지음받았을 때 그를 지켜 주었고, 그 자신의 범죄[b]에서 그를 구해 냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 첫 사람 아담입니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘그 자신의 허물에서’; ‘그 자신의 타락에서’로도 옮길 수 있으나, ‘타락’은 그리스어 표현보다 더 해석적입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὕτη
  english_pob_choice: She
  chosen_korean: 이것은
  alternatives_korean:
  - 그녀는
  - 이분은
  lexicon: LSJ
  rationale: 앞절의 의인화된 지혜를 가리키지만, 한국어에서는 3인칭 여성 대명사를 자연스럽게 쓰기보다 지시어로 연결해 인칭을 과도하게 구체화하지 않는 편이 원문에 가깝습니다.
- source_word: πρωτόπλαστον πατέρα κόσμου
  english_pob_choice: first-formed father of the world
  chosen_korean: 세계의 첫 사람
  alternatives_korean:
  - 인류의 아버지
  - 세상의 첫 조상
  lexicon: LSJ
  rationale: 원문은 아담을 묘사적으로 가리키므로, 한국어에서는 ‘첫 사람’으로 핵심 이미지를 살리고 ‘세계의’로 genitive의 격조를 유지했습니다.
- source_word: μόνον κτισθέντα
  english_pob_choice: when he alone had been created
  chosen_korean: 홀로 지음받았을 때
  alternatives_korean:
  - 홀로 창조되었을 때
  - 혼자 지음받았을 때
  lexicon: LSJ
  rationale: ‘μόνον’의 홀로 됨과 ‘κτισθέντα’의 피동적 생성 의미를 함께 살리기 위해 ‘홀로 지음받았을 때’로 옮겼습니다.
- source_word: παραπτώματος ἰδίου
  english_pob_choice: from his own transgression
  chosen_korean: 그 자신의 범죄
  alternatives_korean:
  - 그 자신의 범법
  - 자기의 허물
  lexicon: LSJ
  rationale: ‘παράπτωμα’는 단순 실수보다 도덕적 일탈을 뜻하므로, 전통어 ‘타락’으로 좁히지 않고 원문의 범죄성을 드러내는 ‘범죄’로 옮겼습니다.
theological_decisions:
- issue: 아담의 식별을 본문 안에서 명시할지 여부
  chosen_reading: 본문에서는 ‘세계의 첫 사람’으로 두고, 아담이라는 이름은 각주로 처리합니다.
  alternative_readings:
  - 본문에 ‘아담’을 직접 넣기
  rationale: 그리스어 본문은 아담을 묘사적으로만 가리키므로, 본문을 과도하게 풀지 않고 독자가 문맥으로 식별하도록 두는 것이 원문 충실도에 맞습니다.
  doctrine_reference: 원문 우선 번역 원칙; 서술적 칭호 보존
- issue: παραπτώματος를 ‘타락’으로 번역할지 여부
  chosen_reading: ‘범죄’로 번역하여 죄의 행위를 직접 드러냅니다.
  alternative_readings:
  - 타락
  - 허물
  rationale: ‘타락’은 후대 신학적 표지를 강하게 불러오므로, 본문이 실제로 말하는 ‘잘못된 발걸음/범죄’의 의미를 더 직접적으로 반영하는 표현을 택했습니다.
  doctrine_reference: 의도적 신학 용어의 과잉투사 방지
