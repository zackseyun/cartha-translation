    reason: alternative_reading
lexical_decisions:
- source_word: ἐν πλεονεξίᾳ
  english_pob_choice: in greed
  chosen_korean: 탐욕 가운데
  alternatives_korean:
  - 탐욕 속에서
  - 탐심 가운데
  - 탐욕으로
  lexicon: BDAG
  rationale: πλεονεξία는 ‘탐욕, 탐심’의 뜻이므로 도덕적 성격을 살려 ‘탐욕’으로 옮겼고, ἐν은 상황적·방식적 범위를 나타내는 것으로 보아 ‘가운데’로 처리했습니다.
- source_word: κατισχυόντων
  english_pob_choice: overpowered
  chosen_korean: 압도할 때
  alternatives_korean:
  - 능가할 때
  - 이길 때
  - 누를 때
  lexicon: BDAG
  rationale: κατισχύω는 ‘이기다, 제압하다, 압도하다’의 의미이므로, 문맥의 적대적 우위를 자연스럽게 드러내는 ‘압도하다’를 선택했습니다.
- source_word: παρέστη
  english_pob_choice: stood by him
  chosen_korean: 그와 함께 서서
  alternatives_korean:
  - 그를 도와 서서
  - 그에게 다가서서
  - 그를 곁에서 도우며
  lexicon: BDAG
  rationale: παρίστημι는 여기서 ‘곁에 서다, 돕기 위해 함께 서다’의 의미로 보이므로, 단순한 존재보다 지지와 동행의 이미지를 살렸습니다.
- source_word: ἐπλούτισεν
  english_pob_choice: made him rich
  chosen_korean: 그를 부유하게 하셨습니다
  alternatives_korean:
  - 그를 부하게 하셨습니다
  - 그를 부요하게 하셨습니다
  - 그를 부유하게 만드셨습니다
  lexicon: BDAG
  rationale: 동사는 ‘부유하게 하다, 부요하게 만들다’의 뜻이므로 현대 한국어에서 직접적이고 이해하기 쉬운 ‘부유하게 하셨습니다’를 택했습니다.
theological_decisions:
- issue: ‘she’로 드러나는 지혜의 의인화 주어를 한국어에서 어떻게 처리할지
  chosen_reading: 앞 절의 문맥을 따라 주어를 ‘지혜’로 명시하고, 여성 대명사 대신 인격적 주체로 읽히게 했습니다.
  alternative_readings:
  - 주어를 생략하여 그가/그들이와 같은 문장 구조로 둘 수 있음
  - ‘그분’으로 중성화해 번역할 수 있음
  rationale: 헬라어는 주어를 반복하지 않지만, 문맥상 지혜가 여성적 의인화된 행위 주체입니다. 한국어는 주어를 드러내는 편이 자연스러워 ‘지혜가…하셨습니다’로 옮기되, 본문의 의인화와 문맥을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: 문맥이 명시하는 인격화는 보존하되, 본문이 허용하는 범위를 넘어 신학을 정리하지 말 것'
