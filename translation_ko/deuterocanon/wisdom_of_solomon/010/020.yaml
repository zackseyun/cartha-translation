base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/020.yaml
  text: Therefore the righteous plundered the ungodly[a], and they sang praise to your holy name, O Lord[b]; and with one accord they praised your defending hand.
  footnotes:
  - marker: a
    text: Or 'despoiled' or 'took spoil from.' The Greek verb refers to taking plunder from defeated enemies.
    reason: lexical_alternative
  - marker: b
    text: Literally 'your hand that fights on behalf of [your people]' or 'your championing hand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 의인들은 불경한 자들을 노략질하였고, 주님, 당신의 거룩한 이름을 노래로 찬양하였으며, 한마음으로 당신의 변호하는 손을 찬양하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘노략하였다’, ‘전리품을 취하였다’. 그리스어 동사는 패배한 적에게서 전리품을 가져가는 뜻을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘당신의 편에서 싸우는 손’ 또는 ‘당신의 옹호하는 손’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιοι
  english_pob_choice: the righteous
  chosen_korean: 의인들
  alternatives_korean:
  - 의로운 사람들
  - 의로운 자들
  lexicon: LSJ
  rationale: 서술적 명사구로 쓰인 δίκαιοι를 한국어 성경체에 자연스럽게 옮기되, 도덕적·언약적 의를 드러내기 위해 ‘의인들’로 번역했습니다.
- source_word: ἐσκύλευσαν
  english_pob_choice: plundered
  chosen_korean: 노략질하였고
  alternatives_korean:
  - 약탈하였고
  - 전리품을 취하였고
  lexicon: LSJ
  rationale: 전리품을 취한다는 전투 이미지를 살리면서도 한국어에서 자연스러운 동사로 ‘노략질하다’를 택했습니다.
- source_word: ἀσεβεῖς
  english_pob_choice: the ungodly
  chosen_korean: 불경한 자들
  alternatives_korean:
  - 경건하지 않은 자들
  - 하나님을 경외하지 않는 자들
  lexicon: LSJ
  rationale: ἀσεβεῖς의 핵심은 단순한 악함보다 하나님께 대한 불경과 경외 없음이므로, 이를 직접 드러내는 ‘불경한 자들’로 옮겼습니다.
- source_word: τήν τε ὑπέρμαχόν σου χεῖρα
  english_pob_choice: your defending hand
  chosen_korean: 당신의 변호하는 손
  alternatives_korean:
  - 당신의 옹호하는 손
  - 당신의 지키시는 손
  - 당신의 싸우시는 손
  lexicon: LSJ
  rationale: ὑπέρμαχος의 ‘편에 서서 맞서 싸우다, 변호하다’는 뜻을 살려 손의 은유를 유지하면서도, 단순한 보호보다 적극적 대변·방어의 의미를 드러냈습니다.
theological_decisions:
- issue: Κύριε의 호칭과 직접 호소의 어조
  chosen_reading: ‘주님’으로 옮기고, 직접 호소를 자연스럽게 드러내는 문맥으로 처리했습니다.
  alternative_readings:
  - ‘오 주님’
  - ‘주여’
  rationale: 헬라어 호격의 직접 주소를 살리되, 현대 합쇼체 본문에서는 과도한 고어성을 피하고 예배적 호칭으로 충분히 전달되도록 했습니다.
  doctrine_reference: POB 번역 원칙 §1, §6
