  lexicon: LSJ
  rationale: 서술적 명사구로 쓰인 δίκαιοι를 한국어 성경체에 자연스럽게 옮기되, 도덕적·언약적 의를 드러내기 위해 ‘의인들’로 번역했습니다.
- source_word: ἐσκύλευσαν
  english_pob_choice: plundered
  chosen_korean: 노략질하였고
  alternatives_korean:
