base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/020.yaml
  text: Therefore the righteous plundered the ungodly[a], and they sang praise to your holy name, O Lord[b]; and with one accord they praised your defending hand.
  footnotes:
  - marker: a
    text: Or 'despoiled' or 'took spoil from.' The Greek verb refers to taking plunder from defeated enemies.
    reason: lexical_alternative
  - marker: b
    text: Literally 'your hand that fights on behalf of [your people]' or 'your championing hand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 의인들은 불경한 자들을 노략질하였고, 주님, 당신의 거룩한 이름을 노래로 찬양하였으며, 한마음으로 당신의 변호하는 손을 찬양하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘노략하였다’, ‘전리품을 취하였다’. 그리스어 동사는 패배한 적에게서 전리품을 가져가는 뜻을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘당신의 편에서 싸우는 손’ 또는 ‘당신의 옹호하는 손’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιοι
  english_pob_choice: the righteous
  chosen_korean: 의인들
  alternatives_korean:
