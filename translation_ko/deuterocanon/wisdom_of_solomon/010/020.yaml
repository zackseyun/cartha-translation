  lexicon: LSJ
  rationale: 전리품을 취한다는 전투 이미지를 살리면서도 한국어에서 자연스러운 동사로 ‘노략질하다’를 택했습니다.
- source_word: ἀσεβεῖς
  english_pob_choice: the ungodly
  chosen_korean: 불경한 자들
  alternatives_korean:
  - 경건하지 않은 자들
  - 하나님을 경외하지 않는 자들
  lexicon: LSJ
  rationale: ἀσεβεῖς의 핵심은 단순한 악함보다 하나님께 대한 불경과 경외 없음이므로, 이를 직접 드러내는 ‘불경한 자들’로 옮겼습니다.
- source_word: τήν τε ὑπέρμαχόν σου χεῖρα
  english_pob_choice: your defending hand
  chosen_korean: 당신의 변호하는 손
  alternatives_korean:
  - 당신의 옹호하는 손
  - 당신의 지키시는 손
  - 당신의 싸우시는 손
  lexicon: LSJ
  rationale: ὑπέρμαχος의 ‘편에 서서 맞서 싸우다, 변호하다’는 뜻을 살려 손의 은유를 유지하면서도, 단순한 보호보다 적극적 대변·방어의 의미를 드러냈습니다.
theological_decisions:
- issue: Κύριε의 호칭과 직접 호소의 어조
  chosen_reading: ‘주님’으로 옮기고, 직접 호소를 자연스럽게 드러내는 문맥으로 처리했습니다.
  alternative_readings:
