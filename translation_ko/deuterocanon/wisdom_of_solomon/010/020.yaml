review_pass:
  verdict: revise
  source_fidelity: 핵심 의미와 병렬 구조는 대체로 충실합니다. 다만 ὑπέρμαχον의 ‘위하여 싸우며 수호하는’ 능동적 방어 의미를 ‘변호하는 손’으로 옮긴 것은 법정 변론의 뜻으로 기울어져 부정확합니다.
  naturalness: ‘당신의 변호하는 손’은 현대 한국어에서 자연스럽지 않으며, 신적 능력을 가리키는 ‘손’의 성경적 은유와도 잘 결합하지 않습니다. ‘수호하시는 손’이 자연스럽고 원문의 방어적·전투적 뉘앙스를 더 잘 전달합니다.
  terminology: ‘의인들’, ‘불경한 자들’, ‘주님’, ‘거룩한 이름’, ‘노래로 찬양하였습니다’는 문맥과 합쇼체에 적절합니다. ‘불경한 자들’은 ἀσεβεῖς의 종교적 함의를 유지합니다.
  issues:
  - severity: medium
    issue: ‘당신의 변호하는 손’
    rationale: ὑπέρμαχος는 법정에서 변호한다는 뜻보다 누군가를 위해 싸우고 지키는 ‘수호자/옹호 전사’의 의미입니다. 또한 ‘변호하는 손’은 한국어 결합으로 부자연스럽습니다.
  - severity: low
    issue: 각주 b의 ‘당신의 편에서 싸우는 손’
    rationale: 이는 손이 하나님을 위해 싸운다는 뜻으로 읽힐 수 있습니다. 원문은 수호·대변의 대상이 명시되지 않은 채, 하나님의 손이 누군가를 위하여 싸운다는 이미지를 나타냅니다.
  - severity: low
    issue: 각주 표지 b의 위치
    rationale: b는 ‘손’에 관한 어휘 각주이므로 해당 표현 바로 뒤에 두는 편이 각주의 지시 대상이 명확합니다.
  revised_text: 그러므로 의인들은 불경한 자들을 노략질하였고, 주님, 당신의 거룩한 이름을 노래로 찬양하였으며, 한마음으로 당신의 수호하시는 손을[a] 찬양하였습니다.
  revised_footnotes:
  - marker: a
    text: 직역하면 ‘(누군가를) 위하여 싸우는 당신의 손’ 또는 ‘당신의 수호하는 손’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘노략하였다’, ‘전리품을 취하였다’. 그리스어 동사는 패배한 적에게서 전리품을 가져가는 뜻을 가리킵니다.
    reason: lexical_alternative
  revision_rationale: '‘변호하는 손’을 ‘수호하시는 손’으로 고쳐 ὑπέρμαχος의 적극적 방어·전투 의미를 살리고 자연스러운 현대 한국어 표현으로 다듬었습니다. 이에 맞추어 해당 어휘 각주를 ‘손’ 바로 뒤에 배치했습니다. 노략의 어휘 대안 각주는 본문에 ‘노략질하였고’가 이미 자연스럽게 반영되어 있으므로 삭제해도 되지만, 제공된 각주 정보를 보존하려면 표지 b로 본문의 ‘노략질하였고’ 뒤에 배치하는 것이 바람직합니다. 완전한 각주 보존 본문은 다음과 같습니다: ‘그러므로 의인들은 불경한 자들을 노략질하였고[b], 주님, 당신의 거룩한 이름을 노래로 찬양하였으며, 한마음으로 당신의 수호하시는 손을[a] 찬양하였습니다.’'
