  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/008.yaml
  text: For by passing wisdom by[a], they were harmed not only by not knowing what is good, but they also left behind for life a memorial of their folly, so that in the things in which they went astray they might not even be able to escape notice.
  footnotes:
  - marker: a
    text: Or 'for the world of human life'; the Greek βίος may refer broadly to life among the living, not only to an individual's life.
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜를 지나쳐 버린 사람들은[a] 좋은 것을 알지 못한 탓에 해를 입었을 뿐만 아니라, 자기들의 어리석음에 대한 기억을 삶에 남겨 두어, 그들이 잘못한 바로 그 일들에서조차 숨지 못하게 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인간 삶의 세계를 위해’; 그리스어 βίος는 개인의 생애뿐 아니라 살아 있는 인간들의 세계를 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφίαν ... παροδεύσαντες
  english_pob_choice: by passing wisdom by
  chosen_korean: 지혜를 지나쳐 버린
  alternatives_korean:
  - 지혜를 지나친
  - 지혜를 외면한
  - 지혜를 그냥 지나가 버린
  lexicon: LSJ/BDAG
  rationale: παροδεύσαντες의 기본 이미지는 ‘지나쳐 가다’이므로, 단순히 ‘외면하다’로만 풀기보다 ‘지혜를 지나쳐 버린’으로 비유적 동작을 살렸습니다.
- source_word: ἐβλάβησαν
  english_pob_choice: they were harmed
  chosen_korean: 해를 입었을 뿐만 아니라
  alternatives_korean:
  - 손해를 입었을 뿐만 아니라
  - 상처를 입었을 뿐만 아니라
  - 피해를 입었을 뿐만 아니라
  lexicon: BDAG
  rationale: 수동형의 손상·해악 의미를 살리면서, 도덕적 실패와 실제적 파멸을 함께 포괄하는 자연스러운 한국어로 옮겼습니다.
- source_word: τὰ καλά
  english_pob_choice: what is good
  chosen_korean: 좋은 것을
  alternatives_korean:
  - 선한 것을
  - 옳은 것을
  - 고귀한 것을
  lexicon: BDAG
  rationale: τὰ καλά는 도덕적 선을 가리킬 수 있으므로, 너무 철학적으로 굳히지 않고 가장 넓고 분명한 ‘좋은 것’을 택했습니다.
- source_word: μνημόσυνον τῷ βίῳ
  english_pob_choice: a memorial for life
  chosen_korean: 기억을 삶에 남겨 두어
  alternatives_korean:
  - 삶을 위한 기념을 남겨 두어
  - 인생을 위한 기념비를 남겨 두어
  - 살아 있는 세상에 기억을 남겨 두어
  lexicon: BDAG
  rationale: μνημόσυνον은 단순한 추억보다 지속적으로 남는 기억/기념을 뜻하므로, ‘기억을 삶에 남겨 두어’로 결과적 잔재성을 살렸습니다.
- source_word: μηδὲ λαθεῖν δυνηθῶσιν
  english_pob_choice: they might not even be able to escape notice
  chosen_korean: 숨지 못하게 되었습니다
  alternatives_korean:
  - 감추지 못하게 되었습니다
  - 눈에 띄지 못하게 되었습니다
  - 숨을 수 없게 되었습니다
  lexicon: BDAG
  rationale: λανθάνειν은 ‘눈에 띄지 않다/숨다’의 의미이므로, 문맥상 ‘잘못한 바로 그 일들’이 드러나 숨을 수 없게 된다는 뜻을 한국어로 압축했습니다.
theological_decisions:
- issue: βίος의 범위
  chosen_reading: 삶
