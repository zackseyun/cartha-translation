base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/008.yaml
  text: For by passing wisdom by[a], they were harmed not only by not knowing what is good, but they also left behind for life a memorial of their folly, so that in the things in which they went astray they might not even be able to escape notice.
  footnotes:
  - marker: a
    text: Or 'for the world of human life'; the Greek βίος may refer broadly to life among the living, not only to an individual's life.
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜를 지나쳐 간 그들은 좋은 것을 알지 못함으로써 해를 입었을 뿐만 아니라, 자기들의 어리석음에 대한 기념을 사람들의 삶 속에[a] 남겼습니다. 이는 그들이 잘못한 일들에서조차 눈에 띄지 않을 수 없게 하려는 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인간 세상에’. 그리스어 βίος는 개인의 생애뿐 아니라 살아 있는 인간들의 삶과 세계를 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφίαν ... παροδεύσαντες
  english_pob_choice: by passing wisdom by
  chosen_korean: 지혜를 지나쳐 버린
  alternatives_korean:
  - 지혜를 지나친
  - 지혜를 외면한
  - 지혜를 그냥 지나가 버린
  lexicon: LSJ/BDAG
  rationale: παροδεύσαντες의 기본 이미지는 ‘지나쳐 가다’이므로, 단순히 ‘외면하다’로만 풀기보다 ‘지혜를 지나쳐 버린’으로 비유적 동작을 살렸습니다.
- source_word: ἐβλάβησαν
  english_pob_choice: they were harmed
  chosen_korean: 해를 입었을 뿐만 아니라
  alternatives_korean:
  - 손해를 입었을 뿐만 아니라
  - 상처를 입었을 뿐만 아니라
