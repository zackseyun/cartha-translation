lexical_decisions:
- source_word: σοφία
  english_pob_choice: wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 지혜님
  - 지혜(의인화 유지)
  lexicon: LXX 용례 / 일반 명사
  rationale: 그리스어는 σοφία를 일반 명사로 두면서 여성 대명사 αὐτήν으로 의인화를 유지하므로, 한국어도 ‘지혜’로 번역하되 문장 전체의 인격적 행위를 통해 의인화를 보존하는 것이 자연합니다.
- source_word: θεραπεύσαντας
