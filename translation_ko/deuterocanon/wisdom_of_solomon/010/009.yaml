lexical_decisions:
- source_word: σοφία
  english_pob_choice: wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 지혜님
  - 지혜(의인화 유지)
  lexicon: LXX 용례 / 일반 명사
  rationale: 그리스어는 σοφία를 일반 명사로 두면서 여성 대명사 αὐτήν으로 의인화를 유지하므로, 한국어도 ‘지혜’로 번역하되 문장 전체의 인격적 행위를 통해 의인화를 보존하는 것이 자연합니다.
- source_word: θεραπεύσαντας
  english_pob_choice: served
  chosen_korean: 봉사한
  alternatives_korean:
  - 섬긴
  - 시중든
  - 돌본
  lexicon: θεραπεύω
  rationale: θεραπεύω는 문맥에 따라 섬기다, 돌보다, 시중들다의 뜻을 가질 수 있는데, 지혜를 향한 헌신적 섬김의 뉘앙스를 살리기 위해 ‘봉사한’을 택했습니다.
- source_word: ἐκ πόνων
  english_pob_choice: from hardships
  chosen_korean: 고난에서
  alternatives_korean:
  - 수고에서
  - 고통에서
  - 괴로움에서
  lexicon: BDAG / LXX 용례
  rationale: πόνος는 수고, 고통, 곤란을 아우를 수 있으므로, 좁게 육체적 고통만 가리키지 않도록 포괄적인 ‘고난’을 사용했습니다.
- source_word: ἐρρύσατο
  english_pob_choice: rescued
  chosen_korean: 구해 내셨습니다
  alternatives_korean:
  - 건져 내셨습니다
  - 구원하셨습니다
  - 건지셨습니다
  lexicon: BDAG
  rationale: ἐρρύσατο는 위험이나 곤경에서의 구출을 뜻하므로, 사건의 생동감과 직접성을 살리는 ‘구해 내셨습니다’가 적절합니다.
theological_decisions:
- issue: 지혜의 의인화와 한국어 대명사 처리
  chosen_reading: ‘지혜’라는 명사로 번역하되, 한국어에서는 자연스러운 인칭대명사 대신 동사와 문맥으로 의인화를 드러냈습니다.
  alternative_readings:
  - ‘그녀’로 옮겨 의인화를 직접 표시
  - ‘지혜’의 중의성을 약화시키고 비인칭적으로 처리
  rationale: 그리스어 여성 대명사 자체는 의인화를 분명히 보여 주지만, 현대 한국어에서 ‘그녀’는 문어적 성격이 강하고 본문을 부자연스럽게 만들 수 있습니다. 그래서 의인화는 유지하되 한국어 문장성에 맞게 처리했습니다.
  doctrine_reference: 'DOCTRINE.md: 본문의 문학적-신학적 긴장을 유지하고, 과도한 해석으로 고정하지 않는다.'
