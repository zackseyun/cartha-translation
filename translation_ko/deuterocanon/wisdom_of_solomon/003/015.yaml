lexical_decisions:
- source_word: ἀγαθῶν
  english_pob_choice: good
  chosen_korean: 선한
  alternatives_korean:
  - 좋은
  - 선한 일의
  lexicon: LSJ
  rationale: πόνων을 수식하는 긍정적 질을 자연스럽게 살리기 위해 ‘선한’으로 옮겼습니다.
- source_word: πόνων
  english_pob_choice: labors
  chosen_korean: 수고
  alternatives_korean:
  - 노고
  - 노력
  - 일
  lexicon: LSJ
  rationale: 강한 수고와 애씀의 뜻을 담되, 잠언적 문맥에서 과도하게 고통을 강조하지 않도록 ‘수고’를 택했습니다.
- source_word: εὐκλεής
  english_pob_choice: glorious
  chosen_korean: 영광스럽고
  alternatives_korean:
  - 명예롭고
  - 유명하고
  - 좋은 평판의
  lexicon: LSJ
  rationale: εὐκλεής의 ‘좋은 명성/영예’ 의미를 한국어의 자연스러운 형용사로 옮겼습니다.
- source_word: φρονήσεως
  english_pob_choice: understanding
  chosen_korean: 분별
  alternatives_korean:
  - 이해
  - 지혜
  - 판단력
  lexicon: LSJ
  rationale: σοφία와 구별되는 πρακτική한 인식·판단의 뜻을 살리기 위해 ‘분별’을 선택했습니다.
theological_decisions:
- issue: φρονήσις를 ‘지혜’로 넓혀 번역할지 여부
  chosen_reading: ‘분별’로 번역해 σοφία와 구별을 유지합니다.
  alternative_readings:
  - 지혜
  - 이해
  rationale: 이 구절은 책 제목의 핵심어인 σοφία가 아니라 φρόνησις를 사용하므로, 동일어 반복을 피하고 개념적 구분을 보존했습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 5
- issue: 농업적 비유의 보존
  chosen_reading: ‘열매’와 ‘뿌리’ 이미지를 그대로 살립니다.
  alternative_readings:
  - 결과는 영광스럽고...
  - 성취는 흔들리지 않고...
  rationale: 원문의 대구와 비유 구조를 유지해야 독자가 문학적 힘과 논지를 함께 이해할 수 있습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 1, 6
