    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τε ὀξέως τελευτήσωσιν
  english_pob_choice: Even if they die quickly
  chosen_korean: 그들이 비록 빨리 죽을지라도
  alternatives_korean:
  - 만일 그들이 빨리 죽는다면
  - 그들이 설령 속히 생을 마치더라도
  lexicon: LSJ
  rationale: ἐάν τε가 주는 양보 조건을 ‘비록 …지라도’로 살리고, ὀξέως와 τελευτήσωσιν은 자연스러운 현대 한국어로 ‘빨리 죽다’로 옮겼습니다.
- source_word: ἐλπίδα
  english_pob_choice: hope
  chosen_korean: 소망
  alternatives_korean:
  - 희망
  - 기대
  lexicon: LSJ
  rationale: 문맥상 미래에 대한 기대를 가리키므로, 한국어 성경에서 널리 쓰는 ‘소망’이 가장 자연스럽고 의미도 안정적입니다.
- source_word: παραμύθιον
  english_pob_choice: comfort
  chosen_korean: 위로
  alternatives_korean:
  - 위안
  - 안慰
  lexicon: LSJ
  rationale: παραμύθιον은 고난 가운데 주어지는 위로를 뜻하므로, 현대 독자가 즉시 이해하는 ‘위로’로 옮겼습니다.
- source_word: ἡμέρᾳ διαγνώσεως
  english_pob_choice: the day of judgment
  chosen_korean: 심판의 날
  alternatives_korean:
  - 판단의 날
  - 분별의 날
  - 결정의 날
  lexicon: LSJ
  rationale: 해당 표현은 최종적 판정의 때를 가리키는 문맥이므로, 영어 POB의 선택을 따라 ‘심판의 날’로 번역하되, διαγνώσις의 어휘적 폭은 각주로 남겼습니다.
