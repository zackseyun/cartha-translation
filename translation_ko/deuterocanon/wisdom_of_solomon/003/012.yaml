translation:
  language: ko
  text: 그들의 여자들은 어리석고[a], 그들의 자녀들은 악하며[b]; 그들의 자손은 저주를 받습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 아내들은 어리석다.’ 그리스어 γυναῖκες는 문맥에 따라 ‘여자들’이나 ‘아내들’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 혈통은 저주를 받습니다’ 혹은 ‘그들의 계열은 저주를 받습니다.’ 그리스어 γένεσις는 자손, 출생, 계보를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυναῖκες
  english_pob_choice: women
  chosen_korean: 여자들
  alternatives_korean:
  - 부인들
  - 아내들
  lexicon: LSJ
  rationale: γυνή는 문맥에 따라 ‘여자’ 또는 ‘아내/부인’이 될 수 있으므로, 영어 POB의 ‘women’에 맞추어 보다 직접적인 ‘여자들’을 택했습니다. ‘아내들’은 관계를 더 좁히는 반면, 본문은 그 자체로 여성 집단을 지칭하는 표현으로 읽힙니다.
- source_word: ἄφρονες
  english_pob_choice: foolish
  chosen_korean: 어리석고
  alternatives_korean:
  - 무지하고
  - 분별이 없고
  lexicon: LSJ
  rationale: ἄφρων은 분별과 이해가 없는 상태를 가리키므로, 현대 한국어에서 자연스럽고 도덕적·지적 무게를 함께 살리는 ‘어리석다’를 선택했습니다.
- source_word: πονηρά
  english_pob_choice: evil
  chosen_korean: 악하며
  alternatives_korean:
  - 악한
  - 사악하며
  lexicon: LSJ
  rationale: πονηρός의 강한 윤리적 부정을 살리기 위해 ‘악하다’를 사용했습니다. 단순한 ‘나쁘다’보다 본문의 심판 어조를 더 잘 드러냅니다.
- source_word: γένεσις
  english_pob_choice: offspring
  chosen_korean: 자손
  alternatives_korean:
  - 후손
  - 혈통
  - 출생
  lexicon: LSJ
  rationale: γένεσις는 ‘태어난 결과물/계보’를 가리킬 수 있으므로, 가족-계열 문맥에서 넓고도 자연스러운 ‘자손’으로 옮겼습니다. 이는 영어 POB의 ‘offspring’에 대응하면서도 한국어에서 공적 문체에 잘 맞습니다.
theological_decisions:
- issue: 가족 전체에 미치는 심판 언어의 강도
  chosen_reading: 본 절을 개인의 악이 가정과 계보 전체에 미치는 직접적 정죄로 유지하고, 완화하거나 우회하지 않았습니다.
  alternative_readings:
  - 가정의 불행을 말하는 일반적 표현으로 완화하는 읽기
  rationale: 그리스어는 ‘어리석다’, ‘악하다’, ‘저주를 받는다’라는 직설적 판단형 서술을 사용하므로, 본문의 심판적 긴장을 보존하는 것이 원문에 더 충실합니다.
  doctrine_reference: 심판의 직접성과 문맥적 긴장을 보존합니다.
