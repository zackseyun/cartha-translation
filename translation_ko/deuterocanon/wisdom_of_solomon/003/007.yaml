base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/007.yaml
  text: and at the time of their visitation they will shine forth[a], and they will run about like sparks through stubble[b];
  footnotes:
  - marker: a
    text: Or 'at the time when they are visited'—that is, when God intervenes to inspect, judge, or vindicate.
    reason: lexical_alternative
  - marker: b
    text: Or 'like sparks through dry straw' or 'through reeds'; the Greek image is of fire racing rapidly through combustible growth.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들을 찾아보시는 때에 그들은 빛날 것이며, 불티들이 마른 짚 사이로 달려가듯이 달려갈 것입니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 방문의 때에’. 그리스어는 하나님께서 찾아오셔서 살피거나 판단하시며 개입하시는 때를 가리킬 수 있으나, 그 성격을 본문에서 더 좁혀 정하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘마른 풀 사이로’ 또는 ‘갈대 사이로’. 그리스어는 불티가 잘 타는 마른 식물성 재료 사이를 빠르게 달려가는 모습을 그립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν καιρῷ ἐπισκοπῆς αὐτῶν
  english_pob_choice: at the time of their visitation
  chosen_korean: 그들이 살피심을 받을 때에
  alternatives_korean:
  - 그들의 방문 때에
  - 그들이 돌보심을 받을 때에
  - 그들이 심문받을 때에
  lexicon: LSJ
  rationale: ἐπισκοπή는 단순한 ‘방문’보다 하나님께서 찾아오셔서 살피고 개입하시는 뜻을 함께 담으므로, 한국어에서는 행위성을 드러내는 ‘살피심을 받을 때에’로 옮겨 ἐπισκοπῆς의 넓은 의미를 보존했습니다.
- source_word: ἀναλάμψουσιν
  english_pob_choice: they will shine forth
  chosen_korean: 빛나고
  alternatives_korean:
  - 빛을 발하고
  - 환하게 빛나고
  - 번쩍이고
  lexicon: LSJ
  rationale: 동사는 밝게 솟아오르듯 빛나는 뉘앙스를 가지지만, 한국어에서는 자연스러운 합쇼체 문맥을 위해 간결한 ‘빛나고’로 처리했습니다.
- source_word: σπινθῆρες
  english_pob_choice: sparks
  chosen_korean: 불꽃
  alternatives_korean:
  - 불똥
  - 불티
  - 불꽃 조각
  lexicon: LSJ
  rationale: σπινθῆρες는 작은 불꽃 조각을 가리키므로, 현대 한국어에서 이미지가 분명한 ‘불꽃’으로 옮겼습니다.
- source_word: καλάμῃ
  english_pob_choice: stubble
  chosen_korean: 마른 짚
  alternatives_korean:
  - 짚더미
  - 짚
  - 마른 풀
  lexicon: LSJ
  rationale: καλάμη는 이 비유에서 쉽게 타는 마른 식물성 재료를 가리키므로, POB의 이미지와 맞게 ‘마른 짚’으로 옮겨 타는 재질감을 살렸습니다.
- source_word: διαδραμοῦνται
  english_pob_choice: they will run about
  chosen_korean: 사방으로 달릴 것입니다
  alternatives_korean:
  - 달려다닐 것입니다
  - 질주할 것입니다
  - 휙휙 지나갈 것입니다
  lexicon: LSJ
  rationale: 동사는 빠르게 이리저리 달려가는 움직임을 나타내므로, 이미지의 속도감을 살리면서도 한국어 문장 흐름에 맞는 ‘사방으로 달릴 것입니다’로 옮겼습니다.
theological_decisions:
- issue: ἐπισκοπή의 신학적 폭
  chosen_reading: 하나님이 개입하여 살피고 판단하시는 때를 암시하되, 본문에서는 ‘살피심’으로 넓게 유지했습니다.
  alternative_readings:
  - 심판의 때
  - 돌보심의 때
  - 방문하시는 때
  rationale: 문맥상 의인의 vindication을 가리키지만, 본문 자체는 은혜로운 돌봄과 사법적 심사를 모두 열어 두므로 한국어도 그 긴장을 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
