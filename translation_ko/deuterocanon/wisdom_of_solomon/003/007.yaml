  - 돌보심의 때
  - 방문하시는 때
  rationale: 문맥상 의인의 vindication을 가리키지만, 본문 자체는 은혜로운 돌봄과 사법적 심사를 모두 열어 두므로 한국어도 그 긴장을 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
