  - 휙휙 지나갈 것입니다
  lexicon: LSJ
  rationale: 동사는 빠르게 이리저리 달려가는 움직임을 나타내므로, 이미지의 속도감을 살리면서도 한국어 문장 흐름에 맞는 ‘사방으로 달릴 것입니다’로 옮겼습니다.
theological_decisions:
- issue: ἐπισκοπή의 신학적 폭
  chosen_reading: 하나님이 개입하여 살피고 판단하시는 때를 암시하되, 본문에서는 ‘살피심’으로 넓게 유지했습니다.
  alternative_readings:
