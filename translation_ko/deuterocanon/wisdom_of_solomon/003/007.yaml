review_pass:
  verdict: revise
  source_fidelity: The draft broadly conveys the verse, but ‘사방으로’ adds a directional nuance not expressed by διαδραμοῦνται, and the simile is more faithfully represented as movement through the combustible material rather than merely an image of sparks. ‘그들이 살피심을 받을 때’ is understandable but is less natural Korean and somewhat recasts the visitation noun as a passive process.
  naturalness: The proposed revision uses natural modern formal Korean, avoids the awkward nominalized passive ‘살피심을 받을 때,’ and removes the semicolon, which is not natural Korean verse punctuation.
  terminology: ‘찾아보시는 때’ is an idiomatic Korean rendering that can convey divine visitation/inspection without narrowing ἐπισκοπή to either judgment or care. ‘불티’ better denotes the small fiery particles meant by σπινθῆρες. ‘마른 짚’ suitably communicates the combustible stubble-like image while the note preserves the lexical range of καλάμη.
  issues:
  - severity: medium
    issue: ‘사방으로’ has been added to the rendering of διαδραμοῦνται.
    rationale: The verb denotes rapid running through/across, but the Greek does not specifically state ‘in all directions.’ The added phrase should be removed to avoid embellishing the image.
  - severity: medium
    issue: The main rendering of ἐπισκοπή is awkward and recasts its form.
    rationale: ‘그들이 살피심을 받을 때’ is a somewhat unnatural passive nominal construction. ‘그들을 찾아보시는 때’ more idiomatically renders visitation/inspection while retaining the broad contextual sense.
  - severity: low
    issue: The spark image is not as precise as it could be.
    rationale: ‘불꽃’ can denote a flame generally; ‘불티’ more naturally denotes the small sparks of σπινθῆρες. The comparison should explicitly retain their running through the dry material.
  revised_text: 그들을 찾아보시는 때에 그들은 빛날 것이며, 불티들이 마른 짚 사이로 달려가듯이 달려갈 것입니다[a][b].
  revised_footnotes:
  - marker: a
    text: 또는 ‘그들의 방문의 때에’. 그리스어는 하나님께서 찾아오셔서 살피거나 판단하시며 개입하시는 때를 가리킬 수 있으나, 그 성격을 본문에서 더 좁혀 정하지 않습니다.
    reason: lexical_alternative
