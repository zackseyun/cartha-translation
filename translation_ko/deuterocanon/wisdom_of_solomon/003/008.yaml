theological_decisions:
- issue: αὐτῶν의 지시 대상
  chosen_reading: ‘그들’은 가장 가까운 문맥의 의인들을 가리키는 것으로 두되, 한국어 본문에서는 지시 대상을 과도하게 특정하지 않고 그대로 유지했습니다.
  alternative_readings:
  - 앞의 민족들과 백성들을 넓게 가리킬 수도 있습니다.
  rationale: 문맥상 의인들이 심판과 통치에 참여한 뒤, 주님의 영원한 통치가 그들 위에 선포됩니다. 원문의 여지를 한국어에서도 보존하는 것이 적절합니다.
  doctrine_reference: 문맥 우선, 의미의 긴장 보존
- issue: εἰς τοὺς αἰῶνας의 시간 표현
  chosen_reading: ‘영원히’로 자연스럽게 옮겼습니다.
  alternative_readings:
  - ‘영원토록’
  - ‘세세토록’
  rationale: 직역성은 ‘세대들에 걸쳐/영원 동안’의 뉘앙스를 갖지만, 현대 합쇼체에서는 ‘영원히’가 가장 자연스럽고 본문의 지속성을 충분히 전달합니다.
  doctrine_reference: 지속성 표현의 현대어화
