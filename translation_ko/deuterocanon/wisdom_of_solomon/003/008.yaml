  rationale: ἔθνη와의 어휘 구분을 살리기 위해 ‘민족들’이 아닌 ‘백성들’을 택해 평행 구조를 드러냈습니다.
- source_word: βασιλεύσει αὐτῶν Κύριος εἰς τοὺς αἰῶνας
  english_pob_choice: the Lord will reign over them forever
  chosen_korean: 주님은 그들 위에 영원히 통치하실 것입니다
