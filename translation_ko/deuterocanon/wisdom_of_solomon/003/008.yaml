base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/008.yaml
  text: They will judge nations and rule over peoples[c][b][a], and the Lord will reign over them forever.
  footnotes:
  - marker: a
    text: Or 'will have power over peoples' for 'will rule over peoples'; the Greek verb can denote exercising power or prevailing.
    reason: lexical_alternative
  - marker: b
    text: Or 'for the ages' instead of 'forever'; the Greek literally speaks of enduring through the ages.
    reason: lexical_alternative
  - marker: c
    text: The pronoun 'them' may refer to the righteous in context, though some may take it more broadly as the nations and peoples just mentioned.
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 민족들을 심판하고 백성들을 다스릴 것이며, 주님께서는 그들을 영원히 다스리실 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다스릴 것입니다’는 ‘권세를 행사할 것입니다’ 또는 ‘우세할 것입니다’로도 옮길 수 있습니다. 그리스어 동사는 권세를 행사하거나 우세함을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘영원히’는 문자적으로 ‘시대들을 향하여’라는 그리스어 표현을 자연스럽게 옮긴 것입니다. 이 표현은 여러 시대를 넘어 지속됨을 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그들’은 문맥상 의인들을 가리킬 수 있으나, 앞의 민족들과 백성들을 더 넓게 가리킨다고 볼 수도 있습니다.
    reason: alternative_reading
