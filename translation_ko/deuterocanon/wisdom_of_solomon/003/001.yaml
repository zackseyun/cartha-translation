translation:
  language: ko
  text: 그러나 의인들의 영혼은 하나님 손 안에 있으며, 어떤 고통도 결코 그들에게 닿지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어떤 고통도 결코 그들에게 닿지 못합니다.’ 그리스어 βάσανος는 심한 고통이나 고문을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δικαίων
  english_pob_choice: of the righteous
  chosen_korean: 의인들의
  alternatives_korean:
  - 의로운 사람들의
  - 의로운 이들의
  lexicon: LSJ
  rationale: δίκαιος의 복수 속격을 실질적으로 받아 ‘의인들’로 옮기면, 단순한 성품 묘사보다 경건한 범주를 분명히 드러낼 수 있습니다.
- source_word: ψυχαὶ
  english_pob_choice: souls
  chosen_korean: 영혼은
  alternatives_korean:
  - 목숨은
  - 사람들은
  lexicon: LSJ
  rationale: 이 구절은 죽음 이후의 상태를 염두에 둔 문맥이므로, ψυχή를 ‘영혼’으로 옮겨 본문의 존재론적 긴장을 유지했습니다.
- source_word: ἐν χειρὶ θεοῦ
  english_pob_choice: in the hand of God
  chosen_korean: 하나님 손 안에
  alternatives_korean:
  - 하나님의 손 안에
  - 하나님의 보호 아래
  lexicon: LSJ
  rationale: 비유적 이미지를 살리기 위해 직역에 가깝게 옮겼으며, ‘보호 아래’처럼 풀어 쓰면 원문의 손 이미지가 약해집니다.
- source_word: βάσανος
  english_pob_choice: torment
  chosen_korean: 고통
  alternatives_korean:
  - 고문
  - 괴로움
  - 시련
  lexicon: LSJ
  rationale: βάσανος는 고문/고통/심한 괴로움을 가리킬 수 있으나, 이 문맥에서는 지나치게 형벌적이거나 과장된 어감을 피하면서도 강한 해악을 나타내는 ‘고통’이 적절합니다.
theological_decisions:
- issue: 마지막 절의 부정 강도와 위로의 톤
  chosen_reading: ‘어떤 고통도 결코 그들에게 닿지 못합니다’로 옮겨 οὐ μή의 강한 부정을 살렸습니다.
  alternative_readings:
  - 결코 그들을 건드리지 못합니다
  - 아무 고통도 그들에게 미치지 못합니다
  rationale: οὐ μή + 접속법의 강한 부정을 한국어에서도 분명하게 드러내야 하므로, 단순한 미래 부정보다 확정적 거절의 뉘앙스를 살렸습니다.
  doctrine_reference: 원문이 주는 확언을 약화하지 않되, 교리적 세부를 덧붙이지 않고 본문의 위로를 그대로 보존합니다.
