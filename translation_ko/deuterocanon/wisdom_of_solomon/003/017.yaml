lexical_decisions:
- source_word: ἐὰν τε γὰρ
  english_pob_choice: For even if
  chosen_korean: 비록 …더라도
  alternatives_korean:
  - 만일 …이라면
  - 설령 …하더라도
  lexicon: BDAG
  rationale: 조건문의 양보적 힘과 연결/강조 입자를 자연스럽게 살리기 위해 ‘비록 …더라도’를 사용했습니다.
- source_word: μακρόβιοι γένωνται
  english_pob_choice: they become long-lived
  chosen_korean: 오래 살게 되더라도
  alternatives_korean:
  - 장수하게 되더라도
  - 오래 살도록 되더라도
  lexicon: LSJ
  rationale: 형용사 μακρόβιοι의 핵심은 긴 수명/장수이므로, 한국어에서는 간결하게 ‘오래 살다’로 옮겼습니다.
- source_word: εἰς οὐθὲν λογισθήσονται
  english_pob_choice: they will be counted as nothing
  chosen_korean: 아무것도 아닌 것으로 여겨질 것이며
  alternatives_korean:
  - 없는 것으로 간주될 것이며
  - 무가치한 것으로 여겨질 것이며
  lexicon: BDAG
  rationale: λογίζομαι의 ‘평가하다/간주하다’ 의미를 살리면서, εἰς οὐθέν의 ‘아무것도 아닌’ 뉘앙스를 유지했습니다.
- source_word: ἄτιμον
  english_pob_choice: dishonored
  chosen_korean: 수치를 당할 것입니다
  alternatives_korean:
  - 명예를 잃을 것입니다
  - 불명예스럽게 될 것입니다
  - 존귀하지 않게 될 것입니다
  lexicon: LSJ
  rationale: ἄτιμος의 핵심은 ‘존영이 없음/불명예’이므로, 수치-명예 대조가 드러나도록 ‘수치를 당하다’로 옮겼습니다.
