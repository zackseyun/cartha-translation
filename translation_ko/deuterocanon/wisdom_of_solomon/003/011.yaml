  text: For miserable is the one who despises wisdom and instruction[a], and their hope is empty, their labors are unprofitable, and their works are useless.
  footnotes:
  - marker: a
    text: Or 'discipline' for 'instruction'; the Greek παιδεία can include both education and corrective training.
