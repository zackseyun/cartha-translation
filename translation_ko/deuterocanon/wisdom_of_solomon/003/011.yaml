  lexicon: LSJ
  rationale: ἀνόητοι는 ‘분별 없는, 어리석은’의 뜻이므로, 수고의 성격을 직접 평가하는 ‘어리석으며’가 원문의 판단을 보존합니다.
- source_word: ἄχρηστα τὰ ἔργα αὐτῶν
  english_pob_choice: their works are useless
  chosen_korean: 그들의 행위는 무익합니다
  alternatives_korean:
  - 그들의 일은 쓸모없습니다
  - 그들의 행위는 쓸데없습니다
  lexicon: LSJ
  rationale: ἄχρηστα는 ‘쓸모 없는, 유익이 없는’의 뜻이므로, 결과의 무가치를 분명히 하는 ‘무익합니다’가 적절합니다.
