  rationale: 현재분사는 지혜와 훈계를 적극적으로 깔보는 태도를 뜻하므로, 현대 한국어에서 강한 거부감을 분명히 전하는 ‘멸시하는’이 적합합니다.
- source_word: κενὴ ἡ ἐλπὶς αὐτῶν
  english_pob_choice: their hope is empty
  chosen_korean: 그들의 희망은 헛되고
  alternatives_korean:
  - 그들의 희망은 공허하고
  - 그들의 희망은 허무하며
  lexicon: LSJ
  rationale: κενή는 ‘비어 있는, 헛된’의 뜻이므로, 문맥상 결과의 무의미함을 드러내는 ‘헛되고’가 자연스럽습니다.
- source_word: οἱ κόποι ἀνόητοι
  english_pob_choice: their labors are unprofitable
  chosen_korean: 그들의 수고는 어리석으며
  alternatives_korean:
  - 그들의 수고는 무익하며
  - 그들의 노고는 어리석으며
  lexicon: LSJ
  rationale: ἀνόητοι는 ‘분별 없는, 어리석은’의 뜻이므로, 수고의 성격을 직접 평가하는 ‘어리석으며’가 원문의 판단을 보존합니다.
- source_word: ἄχρηστα τὰ ἔργα αὐτῶν
  english_pob_choice: their works are useless
  chosen_korean: 그들의 행위는 무익합니다
  alternatives_korean:
  - 그들의 일은 쓸모없습니다
  - 그들의 행위는 쓸데없습니다
  lexicon: LSJ
  rationale: ἄχρηστα는 ‘쓸모 없는, 유익이 없는’의 뜻이므로, 결과의 무가치를 분명히 하는 ‘무익합니다’가 적절합니다.
