translation:
  language: ko
  text: 지혜와 가르침[a]을 멸시하는 사람들은 비참합니다. 그들의 희망은 헛되고, 수고는 어리석으며, 행위는 무익합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가르침’으로 옮긴 그리스어 παδεία는 교육뿐 아니라 교정과 징계를 포함할 수 있습니다.
    reason: lexical_alternative
