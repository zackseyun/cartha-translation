lexical_decisions:
- source_word: σοφίαν
  english_pob_choice: wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 슬기
  - 지식
  lexicon: LSJ
  rationale: 지혜문학의 핵심 어휘로서, 단순한 기술이 아니라 삶의 바른 분별과 도덕적 선을 가리키므로 ‘지혜’가 가장 자연스럽고 정확합니다.
- source_word: παιδείαν
