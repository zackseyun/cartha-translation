  lexicon: LSJ
  rationale: 그리스어의 구체적 사회적 명칭을 살려 ‘환관’으로 옮겼습니다. ‘내시’보다 본문이 지닌 역사적·신체적 현실을 더 직접적으로 드러냅니다.
