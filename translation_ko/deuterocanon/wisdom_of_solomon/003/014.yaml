translation:
  language: ko
  text: 그리고 손으로 불법을 행하지도 않았고 주님을 거슬러 악한 것을 마음에 품지도 않은 환관에게는 믿음의 특별한 은혜[a]와 주님의 성전에서 더 즐거운 분깃[b]이 주어질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘믿음의 선택된 은혜’, ‘믿음의 선택된 선물’, ‘신뢰의 가장 좋은 은혜’로 옮길 수도 있습니다. 그리스어 구문은 압축되어 있어 χάρις(은혜·선물)와 πίστις(믿음·신뢰·신실함)의 관계 및 ἐκλεκτή(선택된·특별한)의 뉘앙스에 여러 가능성이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘더 마음에 드는 몫’ 또는 ‘더 바람직한 분깃’으로 옮길 수 있습니다. κλῆρος는 배정된 몫·분깃·유산을 뜻할 수 있습니다.
    reason: lexical_alternative
