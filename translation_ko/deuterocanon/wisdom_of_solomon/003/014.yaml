  lexicon: BDAG
  rationale: ἐνθυμέομαι의 내면적 숙고·품음을 살려 ‘마음에 품다’로 옮겼고, κατὰ τοῦ κυρίου는 ‘주님을 거슬러’로 대상을 분명히 했습니다.
- source_word: τῆς πίστεως χάρις ἐκλεκτὴ
  english_pob_choice: the chosen grace of faith
  chosen_korean: 선택된 믿음의 은혜
  alternatives_korean:
  - 선택된 믿음의 선물
  - 믿음의 선택된 은혜
  - 믿음의 택함 받은 은혜
  lexicon: BDAG
  rationale: πίστις는 본문 기본값인 ‘믿음’을 유지하고, χάρις의 은혜/선물 가능성을 열어 두면서도 한국어 어순상 자연스럽게 ‘믿음의 은혜’로 압축했습니다. ἐκλεκτή는 선택됨의 뉘앙스를 살려 ‘선택된’으로 옮겼습니다.
- source_word: κλῆρος ἐν ναῷ Κυρίου θυμηρέστερος
  english_pob_choice: a more delightful inheritance in the temple of the Lord
  chosen_korean: 주님의 성전에서 더 기쁜 몫
  alternatives_korean:
  - 주님의 성전에서 더 즐거운 유산
  - 주님의 성전에서 더 바람직한 몫
  - 주님의 성전 안에서 더 기쁜 분깃
  lexicon: LSJ
  rationale: κλῆρος의 ‘분깃/몫’ 의미를 살리되, 본문이 강조하는 누림의 비교를 자연스럽게 전달하기 위해 ‘더 기쁜 몫’으로 옮겼습니다. ναός는 ‘성전’으로 직역했습니다.
theological_decisions:
- issue: πίστις와 χάρις의 압축된 관계
  chosen_reading: ‘선택된 믿음의 은혜’로 직역에 가까이 두되, 믿음과 은혜의 두 요소가 함께 작동하는 압축 표현으로 보았습니다.
  alternative_readings:
  - ‘믿음의 선택된 은혜’
  - ‘믿음의 선물’
  - ‘믿음의 택하신 은혜’
  rationale: 그리스어 구문은 관계가 압축되어 있어 한 가지 해석으로 고정하면 본문의 의미 폭을 줄일 수 있습니다. 따라서 한국어 본문은 압축성을 유지하고, 해석 가능성은 어휘 선택으로 남겨 두었습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: πίστις → 믿음; χάρις → 은혜'
