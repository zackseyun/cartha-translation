  lexicon: LSJ
  rationale: ‘손’과 행위의 결합을 유지하면서, 한국어에서 자연스러운 동사구 ‘불법을 행하다’로 옮겨 실제 행위를 강조했습니다.
- source_word: μηδὲ ἐνθυμηθεὶς κατὰ τοῦ κυρίου πονηρά
  english_pob_choice: nor conceived evil things against the Lord
  chosen_korean: 주님을 거슬러 악한 것을 마음에 품지도 않다
