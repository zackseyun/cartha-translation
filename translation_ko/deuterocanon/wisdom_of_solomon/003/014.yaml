translation:
  language: ko
  text: 그리고 손으로 불법을 행하지도 않았고, 주님을 거슬러 악한 것을 마음에 품지도 않은 환관에게는 선택된 믿음의 은혜와 주님의 성전에서 더 기쁜 몫이 주어질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘믿음의 선택된 선물’, ‘믿음의 택함 받은 은혜’, ‘믿음의 가장 좋은 선물’로 옮길 수도 있습니다. 그리스어 구문은 매우 압축적이어서 ‘은혜’와 ‘믿음’의 관계에 여러 뉘앙스를 허용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘더 즐거운 몫’, ‘더 바람직한 분깃’으로 옮길 수 있습니다. κλῆρος는 분깃·몫·유산의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐνοῦχος
  english_pob_choice: eunuch
  chosen_korean: 환관
  alternatives_korean:
