  rationale: συνίημι의 기본 의미인 ‘이해하다’를 직접 살려, ἀλήθειαν을 목적어로 둔 문장을 분명하게 옮겼습니다.
- source_word: προσμενοῦσιν αὐτῷ ἐν ἀγάπῃ
  english_pob_choice: will remain with him in love
  chosen_korean: 사랑 안에서 그와 함께 머물 것입니다
