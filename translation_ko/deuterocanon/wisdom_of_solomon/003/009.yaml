translation:
  language: ko
  text: 그에게 신뢰를 둔 이들은 진리를 이해할 것입니다[a], 그리고 신실한 이들은 사랑 안에서 그와 함께 머물 것입니다. 왜냐하면 은혜와 자비는 그의 선택된 이들에게 있기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 기다릴 것입니다’로도 번역할 수 있습니다. 그리스어 동사는 함께 머무름과 기다림의 뉘앙스를 모두 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 택하신 이들에게’입니다.
    reason: lexical_alternative
lexical_decisions:
