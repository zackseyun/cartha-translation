  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/009.yaml
  text: Those who have trusted in him will understand truth[a], and the faithful will remain with him in love[b], because grace and mercy are for his chosen ones.
  footnotes:
  - marker: a
    text: Or 'will wait for him' for 'will remain with him'; the Greek verb can denote continuing with someone or waiting expectantly for someone.
    reason: lexical_alternative
  - marker: b
    text: Or 'for his elect.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그를 신뢰해 온 이들은 진리를 이해할 것입니다. 신실한 이들은 사랑 안에서 그와 함께 머물 것입니다[a]. 이는 은혜와 자비가 그가 택하신 이들에게 있기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 기다릴 것입니다’로 번역할 수 있습니다. 그리스어 동사는 누군가와 계속 함께 머무는 뜻이나 누군가를 기다리는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 선택된 이들에게’입니다.
    reason: lexical_alternative
