  rationale: 관찰자의 시각에서 ‘겉으로 그렇게 보이다’는 의미를 살리기 위해 ‘보였고’로 옮겼습니다.
- source_word: ἐν ὀφθαλμοῖς ἀφρόνων
  english_pob_choice: in the eyes of fools
  chosen_korean: 어리석은 이들의 눈에는
  alternatives_korean:
