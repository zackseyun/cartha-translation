  chosen_reading: 사람들의 어리석은 판단으로는 그들이 죽은 것처럼 보였고, 그 떠남도 재앙으로 판단되었다는 대조를 유지했습니다.
  alternative_readings:
  - 그들이 죽었다고 단정하는 번역
