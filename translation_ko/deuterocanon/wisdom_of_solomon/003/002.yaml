  rationale: 관용구 ἐν ὀφθαλμοῖς를 직역에 가깝게 살리되, ἀφρόνων의 평가적 뉘앙스를 한국어에서 자연스럽게 나타내기 위해 ‘어리석은 이들’로 옮겼습니다.
- source_word: ἡ ἔξοδος αὐτῶν
