base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/005.yaml
  text: And after being disciplined a little[a], they will receive great good[c][b], because God tested them and found them worthy of himself.
  footnotes:
  - marker: a
    text: Or 'for a little while, after being disciplined' or 'though disciplined only a little.' The Greek ὀλίγα can suggest either limited extent or limited duration.
    reason: lexical_alternative
  - marker: b
    text: Or 'they will be greatly benefited.' The Greek literally speaks of receiving great benefit.
    reason: lexical_alternative
  - marker: c
    text: Or 'found them worthy for himself.' The phrase emphasizes that they were found fit in relation to God himself.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 조금만 징계를 받은 뒤에는 큰 유익을 받게 될 것입니다. 이는 하나님께서 그들을 시험하셔서, 자신에게 합당한 자들로 찾으셨기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘조금만’은 ὀλίγα가 적은 정도나 짧은 기간을 가리킬 수 있다는 점을 함께 살린 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘큰 유익’은 “크게 유익을 받다”라는 뜻을 자연스럽게 풀어 옮긴 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘자신에게 합당한’은 “worthy of himself”의 관계적 뉘앙스를 살린 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλίγα παιδευθέντες
  english_pob_choice: after being disciplined a little
  chosen_korean: 조금만 징계를 받은 뒤에는
  alternatives_korean:
  - 잠시 징계를 받은 뒤에는
  - 적은 기간 징계를 받은 뒤에는
  - 조금 징계를 받은 뒤에는
  lexicon: LSJ, BDAG
  rationale: ὀλίγα는 기간의 짧음이나 정도의 적음을 함께 열 수 있어, 한국어에서는 ‘조금만’과 ‘뒤에는’로 제한성을 살리되 자연스러운 순서를 취했습니다.
- source_word: μεγάλα εὐεργετηθήσονται
  english_pob_choice: they will receive great good
  chosen_korean: 큰 유익을 받게 될 것입니다
  alternatives_korean:
  - 큰 선을 받게 될 것입니다
  - 많은 혜택을 받게 될 것입니다
  - 크게 유익을 받게 될 것입니다
  lexicon: LSJ
  rationale: εὐεργετέω의 핵심은 ‘유익을 베풀다/받다’이므로, 단순히 ‘좋은 것’보다 결과적 혜택을 분명히 드러내는 ‘유익’을 택했습니다.
- source_word: ἐπείρασεν
  english_pob_choice: tested
  chosen_korean: 시험하셔서
  alternatives_korean:
  - 테스트하셔서
  - 시험해 보셔서
  - 입증하셔서
  lexicon: BDAG
  rationale: 여기서는 유혹이 아니라 인격과 신실함을 드러내는 검증의 의미이므로 ‘시험하다’가 가장 적절합니다.
- source_word: ἀξίους ἑαυτοῦ
  english_pob_choice: found them worthy of himself
  chosen_korean: 자신에게 합당한 자들로 찾으셨기 때문입니다
  alternatives_korean:
  - 자신에게 합당한 자들로 발견하셨기 때문입니다
  - 자신에게 합당한 자들로 보셨기 때문입니다
  - 자기 자신에 합당한 자들로 찾으셨기 때문입니다
  lexicon: BDAG
  rationale: ἀξίους ἑαυτοῦ는 하나님 자신과의 관계 안에서의 합당함을 말하므로, 단순한 도덕적 ‘가치’보다 관계적 적합성을 드러내는 ‘자신에게 합당한’으로 옮겼습니다.
theological_decisions:
- issue: 하나님의 시험과 징계의 관계
  chosen_reading: 하나님께서 그들을 시험하셔서 합당함을 드러내셨습니다.
  alternative_readings:
  - 하나님께서 그들을 단련하셔서 합당함을 드러내셨습니다.
  - 하나님께서 그들을 유혹하셔서 합당함을 보셨습니다.
  rationale: 본문은 고난을 통해 드러나는 검증을 말하며, 악한 유혹을 뜻하지 않습니다. ‘시험하셔서’는 그 긴장을 보존합니다.
  doctrine_reference: 고난 속에서의 신적 검증이라는 본문 수준을 유지합니다.
