translation:
  language: ko
  text: 사람들의 눈앞에서 비록 징계를 받더라도, 그들의 희망은 불멸로 가득 차 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '훈련을 받더라도', '징계를 당하더라도'로도 번역할 수 있습니다. 그리스어는 처벌과 교정적 징계를 모두 뜻할 수 있으며, 여기서는 인간의 눈에 비친 모습이 핵심입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ὄψει ἀνθρώπων
