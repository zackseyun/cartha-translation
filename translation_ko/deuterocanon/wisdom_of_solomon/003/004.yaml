  text: For even if they are punished in the sight of men[a], their hope is full of immortality.
  footnotes:
  - marker: a
    text: Or 'if they are disciplined' or 'if they are chastised.' The Greek can denote punitive or corrective suffering; here the phrase 'in the sight of men' highlights human appearance over ultimate reality.
