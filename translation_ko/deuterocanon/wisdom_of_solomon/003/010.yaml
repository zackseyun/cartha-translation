base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/010.yaml
  text: But the ungodly will have punishment according to what they reasoned[b][a], having neglected the righteous man and having departed from the Lord.
  footnotes:
  - marker: a
    text: Or 'according to what they thought' or 'for what they plotted.' The Greek emphasizes that their punishment corresponds to their own reasoning and designs.
    reason: lexical_alternative
  - marker: b
    text: Or 'the righteous one.' The singular likely points to the representative righteous person in the book's argument.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 불경한 자들은 자신들이 생각한 바에 따라 벌을 받게 될 것입니다. 그들은 의로운 사람을 소홀히 여기고 주님에게서 떠났기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자신들이 생각한 대로’ 혹은 ‘자신들이 꾀한 일에 따라’. 그리스어는 그들의 판단과 설계 자체가 벌의 기준이 됨을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘의로운 이’. 이 단수는 책 전체 논증에서 대표적인 의로운 인물을 가리킬 가능성이 큽니다.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ ἀσεβεῖς
  english_pob_choice: the ungodly
  chosen_korean: 불경한 자들
  alternatives_korean:
  - 악한 자들
  - 경건하지 않은 자들
  lexicon: LSJ
  rationale: ἀσεβεῖς는 단순한 도덕적 악보다 하나님에 대한 불경과 경외 없음까지 포함하므로, 한국어에서는 ‘불경한 자들’이 어감과 범위를 가장 잘 살립니다.
- source_word: καθʼ ἃ ἐλογίσαντο
  english_pob_choice: according to what they reasoned
  chosen_korean: 자신들이 생각한 바에 따라
  alternatives_korean:
  - 자신들이 헤아린 바에 따라
  - 자신들이 꾀한 바에 따라
  lexicon: LSJ
  rationale: λογίζομαι는 ‘생각하다/계산하다/헤아리다’의 의미가 있어, 해석을 지나치게 악의적 ‘꾀하다’로 좁히지 않으면서도 그들의 내적 판단이 응보의 기준이 됨을 드러냅니다.
- source_word: ἕξουσιν ἐπιτιμίαν
  english_pob_choice: will have punishment
  chosen_korean: 벌을 받게 될 것입니다
  alternatives_korean:
  - 형벌을 받게 될 것입니다
  - 처벌을 받게 될 것입니다
  lexicon: LSJ
  rationale: ἐπιτιμία는 ‘벌/형벌/처벌’의 범위를 가지며, ἔχω의 미래형과 결합한 표현을 한국어에서 자연스럽게 ‘벌을 받다’로 옮겼습니다.
- source_word: τοῦ δικαίου
  english_pob_choice: the righteous man
  chosen_korean: 의로운 사람
  alternatives_korean:
  - 의로운 이
  - 의인
  lexicon: LSJ
  rationale: 본문의 단수 표현을 살리되, 특정 교단적 용어인 ‘의인’보다 서사적 문맥에서 더 직접적인 ‘의로운 사람’을 택했습니다.
- source_word: τοῦ κυρίου
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주인
  lexicon: LSJ
  rationale: 지혜서의 유대교적 그리스어 문맥에서 κύριος는 하나님을 가리키므로, 한국어로는 경외의 뉘앙스를 살리는 ‘주님’이 적절합니다.
theological_decisions:
- issue: τοῦ δικαίου의 지시 대상
  chosen_reading: 대표적인 단수 인물로서의 ‘의로운 사람’을 그대로 유지했습니다.
  alternative_readings:
  - 집합적 의미의 의로운 자들
  - 의로움이라는 추상 개념
  rationale: 이 장의 논증 흐름은 앞선 ‘의로운 자’ 박해 전개와 연결되므로, 단수 인물을 집합화하거나 추상화하지 않고 긴장을 보존하는 것이 본문의 의도를 더 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: 의미의 긴장을 해소하지 말고 보존할 것'
- issue: κύριος의 번역
  chosen_reading: ‘주님’으로 번역했습니다.
  alternative_readings:
  - 주
  - 주인
  rationale: 이 구절에서 κύριος는 하나님에 대한 칭호로 읽히며, 한국어 교회용어 중 ‘주님’이 경외성과 문맥적 무게를 가장 잘 전달합니다.
  doctrine_reference: 'DOCTRINE.md contested terms table: κύριος → 주님'
