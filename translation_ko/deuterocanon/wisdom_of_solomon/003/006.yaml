  rationale: ὁλοκάρπωμα는 전부 불살라지는 제사를 가리키므로, ‘번제’로 제의적 의미를 살리고 ‘온전한’으로 완전 소진의 뜻을 보완했습니다.
- source_word: προσεδέξατο
