base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/013.yaml
  text: For blessed is the undefiled barren woman[a], who has not known a bed in transgression[b]; she will have fruit at the visitation of souls.
  footnotes:
  - marker: a
    text: Or 'the marriage bed in transgression' or more explicitly 'sexual intercourse in transgression.' The Greek uses 'bed' as a euphemism for sexual union.
    reason: lexical_alternative
  - marker: b
    text: '''At the visitation of souls'' may refer to God''s future visitation or reckoning of human souls—thus, by implication, a time of judgment or vindication.'
    reason: alternative_reading
translation:
  language: ko
  text: “정녕 복되도다, 흠 없는 불임 여인이여. 비행 가운데 침상을 알지 못한 그 여인은, 영혼들의 돌보심 때에 열매를 얻게 될 것입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘침상’은 그리스어가 쓰는 완곡어법을 살린 표현입니다. 더 직접적으로는 성적 결합을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘영혼들의 돌보심 때’는 하나님의 미래 방문이 은혜로운 개입인지 심판인지에 대한 해석 여지를 남깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: μακαρία
  english_pob_choice: blessed
  chosen_korean: 복되도다
  alternatives_korean:
  - 복이 있습니다
  - 복된
  lexicon: BDAG
  rationale: 축복 선언의 높임과 시적 울림을 살리기 위해 ‘복되도다’를 택했습니다. 합쇼체 문맥이지만 직접 인용의 탄식적·선언적 어조를 보존합니다.
- source_word: στεῖρα
  english_pob_choice: barren woman
  chosen_korean: 불임 여인
  alternatives_korean:
  - 불임인 여자
  - 아이를 낳지 못하는 여인
  lexicon: LSJ
  rationale: 여성의 출산 불능 상태를 분명히 하면서도 현대 한국어에서 자연스럽고 품위 있게 들리는 표현으로 옮겼습니다.
- source_word: κοίτην
  english_pob_choice: a bed
  chosen_korean: 침상
  alternatives_korean:
  - 잠자리
  - 결혼 침상
  - 성적 관계
  lexicon: LSJ
  rationale: 원문이 ‘침상/자리’의 완곡어법을 쓰므로 그 이미지를 살려 ‘침상’으로 옮겼습니다. 본문 자체의 완곡성을 유지하기 위해 노골화하지 않았습니다.
- source_word: ἐν παραπτώματι
  english_pob_choice: in transgression
  chosen_korean: 비행 가운데
  alternatives_korean:
  - 허물 가운데
  - 범죄 가운데
  - 죄 가운데
  lexicon: BDAG
  rationale: 성적 결합을 도덕적으로 잘못된 것으로 규정하는 뉘앙스를 살리되, 특정한 법적 죄목으로 과도하게 좁히지 않기 위해 ‘비행 가운데’를 선택했습니다.
- source_word: ἐν ἐπισκοπῇ ψυχῶν
  english_pob_choice: at the visitation of souls
  chosen_korean: 영혼들의 돌보심 때
  alternatives_korean:
  - 영혼들의 방문 때
  - 영혼들의 살피심 때
  - 영혼들의 심판 때
  lexicon: BDAG
  rationale: ἐπισκοπή는 ‘방문/돌봄/감찰’의 범위를 갖고 있어, 판정만으로 단정하지 않고 하나님의 개입을 드러내는 ‘돌보심 때’로 옮겼습니다. ‘영혼들’은 원문의 ψυχῶν을 직접 반영했습니다.
theological_decisions:
- issue: ἐν ἐπισκοπῇ ψυχῶν의 의미 범위
  chosen_reading: 하나님의 미래 개입이 가져올 돌보심과 판정의 긴장을 열어 둡니다.
  alternative_readings:
  - 영혼들에 대한 심판의 때
  - 영혼들을 향한 은혜의 방문
  rationale: 지혜서 3장의 문맥은 의인의 운명과 변증적 반전을 다루지만, 그리스어 표현 자체는 자비로운 돌봄과 심판적 감찰을 모두 가능하게 합니다. 따라서 한쪽으로 해석을 고정하지 않았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
