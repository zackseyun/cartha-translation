  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/005.yaml
  text: For a holy spirit of discipline will flee deceit[a], and it will depart from senseless thoughts[c][b], and it will be rebuked when unrighteousness comes upon it.
  footnotes:
  - marker: a
    text: Or 'the Holy Spirit of discipline.' The Greek says 'holy spirit of discipline' without the article, so the phrase may be read qualitatively rather than as a fixed proper title.
    reason: alternative_reading
  - marker: b
    text: Or 'will be reproved' or 'will be convicted' for 'will be exposed.'
    reason: lexical_alternative
  - marker: c
    text: Or 'when injustice comes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜로운 징계의 거룩한 영은 속임수를 피하고, 어리석은 생각들에서 떠나며, 불의가 닥치면 드러나게 됩니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘징계의 거룩한 영’으로도 읽을 수 있습니다. 그리스어에는 정관사가 없어, 고정된 칭호보다 질적 표현일 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘책망받게 됩니다’, ‘유죄 판결을 받게 됩니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘불의가 닥칠 때’로도 옮길 수 있습니다.
    reason: lexical_alternative
