translation:
  language: ko
  text: 너희 삶의 미혹으로 죽음을 갈망하지 말며[a], 너희 손으로 한 일로 스스로 파멸을 불러오지 마십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘너희 삶의 미혹으로’는 πλάνῃ ζωῆς ὑμῶν을 옮긴 것입니다. 문자적으로는 ‘너희 삶의 오류로’라고 할 수 있으며, πλάνῃ에는 오류, 방황, 미혹의 뜻이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘너희 손으로 한 일’은 ἔργοις χειρῶν ὑμῶν의 구체적 표현을 살린 것입니다. 이는 손으로 만든 것뿐 아니라 사람이 행한 일 전반을 가리킬 수도 있습니다.
    reason: cultural_note
