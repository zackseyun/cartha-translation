translation:
  language: ko
  text: 생명의 길에서 빗나간 채 죽음을 갈망하지 말며, 너희 손의 행위로 스스로 파멸을 불러오지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘생명의 길에서 빗나간 채’는 πλάνῃ ζωῆς ὑμῶν을 자연스럽게 옮긴 것으로, 문자적으로는 ‘너희 삶의 오류로’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘너희 손의 행위’는 ἔργοις χειρῶν ὑμῶν의 관용적 표현을 살린 것으로, 단순한 수공만이 아니라 인간의 행위 전반을 가리킬 수 있습니다.
    reason: cultural_note
