  text: Do not court death by the error of your life[b][a], nor draw destruction upon yourselves by the works of your hands.
  footnotes:
  - marker: a
    text: Or 'Do not desire death by the error of your life.' The Greek verb can more literally mean 'be zealous for' or 'desire.'
