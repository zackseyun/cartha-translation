  text: for the ear of jealousy hears all things[b][a], and the sound of murmurings is not hidden.
  footnotes:
  - marker: a
    text: Or 'the ear of zeal hears everything.' The Greek ζηλώσεως can denote zeal as well as jealousy; the main text preserves the sharper image of jealous scrutiny.
    reason: lexical_alternative
  - marker: b
    text: Or 'the whisper of grumblings' or 'the report of complaints.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 질투의 귀가 모든 것을 들으며, 중얼거림의 소리도 숨겨지지 않기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘열심의 귀가 모든 것을 듣는다’입니다. ζηλώσεως는 ‘열심’으로도 옮길 수 있지만, 본문은 더 날카로운 감시의 이미지를 살립니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘중얼거림의 소리’, ‘불평의 소리’입니다. γογγυσμῶν은 ‘수군거림’이나 ‘불평’의 뉘앙스도 가질 수 있습니다.
    reason: lexical_alternative
