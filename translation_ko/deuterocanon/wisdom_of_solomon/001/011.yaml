theological_decisions:
- issue: ψυχή의 번역 범위
  chosen_reading: 본문에는 ‘영혼’을 두어 도덕적·영적 파괴의 깊이를 드러내고, 주석 없이 생명/사람으로 환원하지 않았습니다.
  alternative_readings:
  - 생명
  - 사람
  rationale: 지혜문학의 경고는 단순한 사회적 피해를 넘어 내적 파괴를 시사하므로, 다의성을 지우지 않는 범위에서 ‘영혼’이 가장 적합합니다.
  doctrine_reference: 본문의 어휘적 긴장을 보존하고, 문맥상 가능한 의미 범위를 과도하게 축소하지 않습니다.
