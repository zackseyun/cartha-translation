base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/011.yaml
  text: Therefore guard yourselves against useless grumbling[a], and spare your tongue from slander; for no secret utterance goes out empty[b], and a lying mouth destroys a soul.
  footnotes:
  - marker: a
    text: Or 'no secret saying goes forth in vain.' The Greek expression literally says it 'does not go empty,' emphasizing that hidden speech still has effect and consequence.
    reason: lexical_alternative
  - marker: b
    text: Or 'destroys life' or 'destroys a person.' The Greek word can mean 'soul,' 'life,' or 'person.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 무익한 투덜거림을 삼가고, 혀로 비방하는 일을 삼가십시오. 은밀한 말도 아무 결과 없이 사라지지 않으며[a], 거짓을 말하는 입은 영혼을 멸합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘은밀한 말은 헛되이 나가지 않는다.’ 그리스어는 문자적으로 ‘빈 채로 나가지 않는다’고 말하며, 은밀한 말도 실제 결과와 영향을 낳는다는 뜻을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘생명을 멸한다’ 또는 ‘사람을 멸한다.’ 그리스어 ψυχή는 ‘영혼’, ‘생명’, ‘사람’을 뜻할 수 있습니다.
    reason: lexical_alternative
