base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/011.yaml
  text: Therefore guard yourselves against useless grumbling[a], and spare your tongue from slander; for no secret utterance goes out empty[b], and a lying mouth destroys a soul.
  footnotes:
  - marker: a
    text: Or 'no secret saying goes forth in vain.' The Greek expression literally says it 'does not go empty,' emphasizing that hidden speech still has effect and consequence.
    reason: lexical_alternative
  - marker: b
    text: Or 'destroys life' or 'destroys a person.' The Greek word can mean 'soul,' 'life,' or 'person.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 무익한 투덜거림을 삼가고, 혀를 비방에서 아끼십시오. 숨은 말은 헛되이 나가지 않으며[a], 거짓말하는 입은 영혼을 멸합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘비밀스러운 말은 헛되이 나가지 않는다.’ 그리스어는 문자적으로 ‘헛되이/빈 채로 나가지 않는다’고 말하며, 숨은 말도 실제 결과를 낳는다는 뜻을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘생명을 멸한다’ 또는 ‘사람을 멸한다.’ 그리스어 ψυχή는 ‘영혼’, ‘생명’, ‘사람’으로 넓게 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: φυλάξασθε τοίνυν
  english_pob_choice: Therefore guard yourselves against
  chosen_korean: 그러므로 … 삼가십시오
  alternatives_korean:
  - 그러므로 … 경계하십시오
  - 그러므로 … 자신을 지키십시오
  lexicon: LSJ
  rationale: aorist middle imperative의 자기 보호 뉘앙스를 살리면서, 한국어에서는 합쇼체 명령으로 자연스럽게 압축했습니다.
- source_word: γογγυσμὸν ἀνωφελῆ
  english_pob_choice: useless grumbling
  chosen_korean: 무익한 투덜거림
  alternatives_korean:
  - 쓸데없는 원망
  - 쓸모없는 불평
  lexicon: LSJ
  rationale: γογγυσμός의 중얼거림/투덜거림 성격과 ἀνωφελής의 ‘무익한’ 뜻을 함께 보존했습니다.
- source_word: ἀπὸ καταλαλιᾶς φείσασθε γλώσσης
  english_pob_choice: spare your tongue from slander
  chosen_korean: 혀를 비방에서 아끼십시오
  alternatives_korean:
  - 혀를 비방에서 삼가십시오
  - 혀를 험담에서 아끼십시오
  lexicon: LSJ
  rationale: φείδομαι의 ‘아끼다/삼가다’와 γλῶσσα의 ‘혀’ 이미지를 살리기 위해 직역성이 있는 표현을 택했습니다.
- source_word: φθέγμα λαθραῖον κενὸν οὐ πορεύεται
  english_pob_choice: no secret utterance goes out empty
  chosen_korean: 숨은 말은 헛되이 나가지 않으며
  alternatives_korean:
  - 비밀스러운 말은 헛되이 지나가지 않으며
  - 숨은 말은 빈말로 끝나지 않으며
  lexicon: LSJ
  rationale: φθέγμα λαθραῖον의 비밀스런 발화를 ‘숨은 말’로 옮기고, κενὸν οὐ πορεύεται의 ‘empty’ 뉘앙스를 ‘헛되이 나가지 않으며’로 살렸습니다.
- source_word: στόμα δὲ καταψευδόμενον ἀναιρεῖ ψυχήν
  english_pob_choice: a lying mouth destroys a soul
  chosen_korean: 거짓말하는 입은 영혼을 멸합니다
  alternatives_korean:
  - 거짓말하는 입은 생명을 멸합니다
  - 거짓 입은 사람을 죽입니다
  lexicon: LSJ
  rationale: καταψευδόμενον의 ‘거짓말하는’ 성격을 직접 반영하고, ψυχή를 본문 문맥의 도덕·영적 무게를 살려 ‘영혼’으로 옮겼습니다.
theological_decisions:
- issue: ψυχή의 번역 범위
  chosen_reading: 본문에는 ‘영혼’을 두어 도덕적·영적 파괴의 깊이를 드러내고, 주석 없이 생명/사람으로 환원하지 않았습니다.
  alternative_readings:
  - 생명
  - 사람
  rationale: 지혜문학의 경고는 단순한 사회적 피해를 넘어 내적 파괴를 시사하므로, 다의성을 지우지 않는 범위에서 ‘영혼’이 가장 적합합니다.
  doctrine_reference: 본문의 어휘적 긴장을 보존하고, 문맥상 가능한 의미 범위를 과도하게 축소하지 않습니다.
