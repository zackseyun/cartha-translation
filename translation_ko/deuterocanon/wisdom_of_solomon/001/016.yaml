translation:
  language: ko
  text: 그러나 불경한 자들은 손과 말로 그를 불렀습니다. 그를 친구로 여기고는 스러져 갔으며, 그와 언약을 맺었습니다. 그들이 그의 몫에 속할 자격이 있다고 여겼기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘그’는 앞 문맥에서 의인화된 죽음을 가리킵니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘그와 협정을 맺었습니다.’
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그의 몫에 속한 자가 되려고.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσεβεῖς
  english_pob_choice: the ungodly
  chosen_korean: 불경한 자들
  alternatives_korean:
  - 악한 자들
  - 경건하지 않은 자들
  lexicon: LSJ
  rationale: ἀσεβεῖς는 단순한 도덕적 악보다 하나님에 대한 불경과 무경건을 드러내므로, ‘불경한 자들’이 종교적·윤리적 긴장을 가장 잘 살립니다.
- source_word: ταῖς χερσὶ καὶ τοῖς λόγοις
  english_pob_choice: with their hands and with their words
  chosen_korean: 손과 말로
  alternatives_korean:
  - 행동과 말로
  - 손으로 그리고 말로
  lexicon: LSJ
  rationale: 본문의 구체적 대구를 살리되 한국어에서 자연스러운 도구격으로 옮겼습니다. ‘손’과 ‘말’의 병렬이 행위와 언어의 양면성을 드러냅니다.
- source_word: προσεκαλέσαντο αὐτόν
  english_pob_choice: called for him
  chosen_korean: 그를 불렀습니다
  alternatives_korean:
  - 그를 불러들였습니다
  - 그를 소환했습니다
  - 그를 청했습니다
  lexicon: LSJ
  rationale: 중간태는 그를 자기 쪽으로 부르거나 끌어들이는 뉘앙스를 가지므로, 과도한 해석을 피하면서도 능동적 요청의 뜻을 담는 ‘불렀습니다’가 적절합니다.
- source_word: ἐτάκησαν
  english_pob_choice: they wasted away
  chosen_korean: 스러져 갔습니다
  alternatives_korean:
  - 녹아 버렸습니다
  - 쇠약해졌습니다
  - 시들어 갔습니다
  lexicon: LSJ
  rationale: 직역의 ‘녹다’ 이미지는 살리되 현대 한국어에서 자연스럽고 비극적 자멸의 뉘앙스를 전달하는 표현으로 옮겼습니다.
- source_word: συνθήκην ἔθεντο πρὸς αὐτόν
  english_pob_choice: they made a covenant with him
  chosen_korean: 그와 언약을 맺었습니다
  alternatives_korean:
  - 그와 조약을 맺었습니다
  - 그와 협정을 맺었습니다
  - 그와 pact를 맺었습니다
  lexicon: LSJ
  rationale: συνθήκη는 단순 합의보다 엄숙한 결속을 뜻하므로 ‘언약’이 가장 잘 대응합니다. 다만 여기서는 하나님과의 언약이 아니라 죽음과의 결탁이라는 역설을 드러냅니다.
- source_word: τῆς ἐκείνου μερίδος
  english_pob_choice: his portion
  chosen_korean: 그의 몫
  alternatives_korean:
  - 그의 분깃
  - 그의 몫에 해당하는 것
  - 그의 몫의 일부
  lexicon: LSJ
  rationale: μερίς는 몫, 분깃, 몫으로 정해진 ভাগ을 뜻하므로, 문맥상 ‘그의 몫’이 가장 직설적이고 이해하기 쉽습니다.
theological_decisions:
- issue: 대상 대명사 αὐτόν의 지시 대상
  chosen_reading: 본문의 ‘그’를 그대로 두되, 앞 문맥에서 그가 의인화된 죽음을 가리킨다는 점이 보존되도록 했습니다.
  alternative_readings:
  - ‘죽음’을 본문에 명시적으로 넣는 번역
  rationale: 그리스어는 대명사를 유지하므로 본문에서도 대명사를 유지하는 것이 원문 충실성에 맞습니다. 의인화된 죽음이라는 해석은 문맥이 제공하며, 주해적으로도 보존될 수 있습니다.
  doctrine_reference: 원문 우선 원칙; 의인화 표현의 문학적 긴장 보존
- issue: συνθήκη의 번역어 선택
  chosen_reading: ‘언약’으로 옮겨 불경한 자들이 죽음과 맺는 엄숙하고도 역설적인 결속을 드러냈습니다.
  alternative_readings:
  - ‘협정’
  - ‘계약’
  - ‘합의’
  rationale: 이 구절은 신학적 언약이 아니라도 고도의 서사적 엄숙성을 띠므로, ‘언약’은 그 무게와 아이러니를 가장 강하게 전달합니다.
  doctrine_reference: 핵심 용어 일관성, 단 문맥상 역설을 드러내는 예외
