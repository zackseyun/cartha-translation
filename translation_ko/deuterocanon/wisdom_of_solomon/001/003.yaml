  rationale: 내면의 사고와 판단을 포괄하되, 과도하게 철학화하지 않기 위해 가장 보편적인 ‘생각들’로 옮겼습니다.
- source_word: χωρίζουσιν ἀπὸ θεοῦ
  english_pob_choice: separate from God
  chosen_korean: 하나님에게서 사람을 떼어 놓고
  alternatives_korean:
