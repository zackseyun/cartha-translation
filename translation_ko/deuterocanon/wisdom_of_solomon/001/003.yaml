  - 하나님과 멀어지게 하고
  lexicon: LSJ
  rationale: ‘분리하다’보다 관계적 단절을 더 직접적으로 드러내는 표현을 택해, 원문의 분리 동사를 자연스럽게 한국어화했습니다.
- source_word: δοκιμαζομένη
  english_pob_choice: when ... is tested
  chosen_korean: 시험을 받을 때에는
  alternatives_korean:
  - 시험받을 때
  - 시험될 때
  - 검증될 때
  lexicon: LSJ
  rationale: 현재적 상황을 나타내는 분사값을 살려 시간 부사구로 처리했고, ‘시험’을 사용해 원문의 검증/시련의 뉘앙스를 유지했습니다.
- source_word: ἐλέγχει
  english_pob_choice: exposes
  chosen_korean: 드러내기
  alternatives_korean:
  - 폭로하기
  - 책망하기
  - 책망하며 드러내기
  lexicon: LSJ
  rationale: 법정적 ‘정죄’로 좁히지 않고, 어리석음의 실체가 드러난다는 의미를 살려 ‘드러내다’로 번역했습니다.
theological_decisions:
- issue: ἡ δύναμις의 지시 대상
  chosen_reading: ‘그의 능력’으로 옮겨, 앞의 하나님을 가리키는 것으로 분명히 했습니다.
  alternative_readings:
  - 그 능력
  - 하나님의 능력
  rationale: 그 앞의 ‘하나님에게서’와 문맥상 연결이 가장 자연스럽기 때문에, 소유 대명사를 보충해 한국어의 문장 흐름을 분명하게 했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy and readable modern Korean.'
- issue: ἐλέγχει의 신학적 강도
  chosen_reading: ‘드러내기’로 옮겨, 판단의 법정성보다 죄성과 어리석음의 현현을 강조했습니다.
  alternative_readings:
  - 책망하기
  - 정죄하기
  - 드러내며 책망하기
  rationale: 문맥은 형벌 선고보다 하나님 앞에서 어리석음이 폭로되는 상황을 더 강하게 보여 주므로, 그 긴장을 유지했습니다.
  doctrine_reference: 'Wisdom literature register: preserve the moral exposure motif without over-specifying judicial nuance.'
