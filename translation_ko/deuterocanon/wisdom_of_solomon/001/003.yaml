lexical_decisions:
- source_word: σκολιοὶ
  english_pob_choice: crooked
  chosen_korean: 비뚤어진
  alternatives_korean:
  - 굽은
  - 왜곡된
  - 사악한
  lexicon: LSJ
  rationale: moral한 굽어짐과 왜곡을 함께 살리면서, 현대 한국어에서 자연스럽고 직관적인 표현을 택했습니다.
- source_word: λογισμοὶ
