base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/006.yaml
  text: For wisdom is a spirit that loves humanity[a], and it will not acquit a blasphemer because of his lips; for God is witness of his inner motives[b], and a true observer of his heart and a hearer of his tongue.
  footnotes:
  - marker: a
    text: Literally, 'his kidneys,' an idiom for the hidden inner self or motives.
    reason: lexical_alternative
  - marker: b
    text: Or 'will not hold guiltless a blasphemer for what comes from his lips.' The Greek phrase after 'blasphemer' is compressed and may be taken with causal force.
    reason: alternative_reading
translation:
  language: ko
  text: 지혜는 사람을 사랑하는 영이므로, 그 입술에서 나오는 말 때문에 신성 모독자를 무죄로 하지 않습니다[b]. 하나님께서는 그의 깊은 속을 증언하시는 분이시며[a], 그의 마음의 참된 감찰자이시고 그의 혀의 말을 들으시는 분이시기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 콩팥들’입니다. 이는 숨은 내면이나 깊은 속을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 입술 때문에’로 옮길 수 있습니다. 그리스어의 압축된 표현은 입술에서 나오는 말에 대한 원인 관계로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: φιλάνθρωπον
  english_pob_choice: that loves humanity
  chosen_korean: 사람을 사랑하는
  alternatives_korean:
