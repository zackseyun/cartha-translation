base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/006.yaml
  text: For wisdom is a spirit that loves humanity[a], and it will not acquit a blasphemer because of his lips; for God is witness of his inner motives[b], and a true observer of his heart and a hearer of his tongue.
  footnotes:
  - marker: a
    text: Literally, 'his kidneys,' an idiom for the hidden inner self or motives.
    reason: lexical_alternative
  - marker: b
    text: Or 'will not hold guiltless a blasphemer for what comes from his lips.' The Greek phrase after 'blasphemer' is compressed and may be taken with causal force.
    reason: alternative_reading
translation:
  language: ko
  text: 지혜는 사람을 사랑하는 영이기 때문입니다[a]. 그리고 지혜는 그의 입술 때문에 신성모독하는 자를 용서하지 않습니다. 이는 하나님께서 그의 내면의 동기를 증언하시는 분이며[b], 그의 마음을 참되게 살피는 이시고 그의 혀를 들으시는 분이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 콩팥들’이지만, 히브리계 관용구로서 숨은 내면 또는 동기를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 혀에서 나오는 말 때문에’로도 옮길 수 있습니다. 그리스어 구문은 압축되어 있어 원인 관계를 이렇게 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: φιλάνθρωπον
  english_pob_choice: that loves humanity
  chosen_korean: 사람을 사랑하는
  alternatives_korean:
  - 인류를 사랑하는
  - 인간을 사랑하는
  - 자애로운
  lexicon: LSJ
  rationale: φιλάνθρωπον은 인간들에 대한 호의를 뜻하므로, ‘사람을 사랑하는’으로 옮겨 적극적인 의미를 살리고 남성 중심으로 들릴 수 있는 표현을 피했습니다.
- source_word: πνεῦμα
  english_pob_choice: a spirit
  chosen_korean: 영
  alternatives_korean:
  - 영이신 분
  - 성령
  - 영적 존재
  lexicon: LSJ
  rationale: 본문은 지혜를 영적 성격으로 묘사하지만, 여기서 곧바로 성령과 동일시하지 않도록 ‘영’으로 두어 원문의 형식을 보존했습니다.
- source_word: οὐκ ἀθῳώσει βλάσφημον
  english_pob_choice: will not acquit a blasphemer
  chosen_korean: 신성모독하는 자를 용서하지 않습니다
  alternatives_korean:
  - 신성모독하는 자를 무죄로 하지 않습니다
  - 모독하는 자를 용서하지 않습니다
  - 신성모독자를 무죄 선고하지 않습니다
  lexicon: LSJ
  rationale: ἀθῳώσει는 법정적 무죄 선언을 가리키므로 ‘용서하지 않습니다’보다 ‘무죄로 하지 않습니다’가 더 직접적일 수 있으나, 문맥의 심판 의미를 살리면서도 한국어 가독성을 위해 ‘용서하지 않습니다’로 옮겼습니다.
- source_word: τῶν νεφρῶν αὐτοῦ
  english_pob_choice: his inner motives
  chosen_korean: 내면의 동기
  alternatives_korean:
  - 그의 콩팥
  - 그의 속사정
  - 그의 깊은 속
  lexicon: LSJ
  rationale: ‘콩팥’의 직역은 현대 한국어에서 난해하므로, 숨은 내면을 뜻하는 관용적 의미를 살려 ‘내면의 동기’로 번역했습니다.
- source_word: ἐπίσκοπος ἀληθής
  english_pob_choice: a true observer
  chosen_korean: 참되게 살피는 이
  alternatives_korean:
  - 참된 감찰자
  - 참된 감독
  - 진실한 관찰자
  lexicon: LSJ
  rationale: ἐπίσκοπος는 교회 직분 용어로 굳어진 ‘감독’보다, 여기의 신적 감찰 의미를 드러내는 ‘살피는 이’가 더 적절합니다. ἀληθής는 그 관찰의 신실함을 강조하므로 ‘참되게’로 반영했습니다.
- source_word: ἀκουστής
  english_pob_choice: a hearer
  chosen_korean: 들으시는 분
  alternatives_korean:
  - 듣는 이
  - 청자
  - 들으시는 자
  lexicon: LSJ
  rationale: 하나님께 적용된 수동적 의미를 살려, 단순한 ‘듣는 이’보다 관계적·격식적 표현인 ‘들으시는 분’으로 옮겼습니다.
theological_decisions:
- issue: 지혜와 영의 관계를 성령으로 단정할지 여부
  chosen_reading: 지혜를 ‘사람을 사랑하는 영’으로 두고 성령과의 동일시를 명시하지 않았습니다.
  alternative_readings:
  - 지혜는 성령입니다
  - 지혜는 사랑이 많은 영입니다
  rationale: 원문은 지혜를 영적 성격으로 묘사하지만, 여기서 곧바로 성령 교리로 고정하지 않음으로써 본문의 긴장을 보존했습니다.
  doctrine_reference: 본문의 인격화와 신학적 동일시를 구분하여 유지함
- issue: βλάσφημον에 대한 심판 진술을 한국어에서 어떻게 톤을 유지할지
  chosen_reading: ‘용서하지 않습니다’로 하되, 이어지는 이유절이 하나님의 심판적 판정을 분명히 하도록 했습니다.
  alternative_readings:
  - 무죄로 하지 않습니다
  - 무죄 선고하지 않습니다
  rationale: 문맥상 도덕적·사법적 판정이 모두 포함되지만, 한국어에서 너무 기술적으로 들리는 법정 용어보다 문맥을 읽기 쉬운 표현을 택했습니다.
  doctrine_reference: 심판과 책임의 강조를 유지함
