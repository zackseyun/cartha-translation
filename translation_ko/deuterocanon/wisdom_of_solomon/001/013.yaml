    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θεὸς
  english_pob_choice: God
  chosen_korean: 하나님께서는
  alternatives_korean:
  - 하나님은
  lexicon: BDAG
  rationale: 주어는 한국어 관용에 따라 ‘하나님’으로 옮기되, 문두에서 주제성을 분명히 하기 위해 주격 조사와 함께 정리했습니다.
- source_word: θάνατον οὐκ ἐποίησεν
  english_pob_choice: did not make death
  chosen_korean: 죽음을 만드시지 않았고
  alternatives_korean:
  - 죽음을 창조하시지 않았고
  - 죽음을 지으시지 않았고
  lexicon: BDAG
  rationale: ποιέω의 기본값을 살려 ‘만드시다’로 옮겼습니다. 영어 주석처럼 ‘창조하시다’도 가능하지만, 본문 자체가 직접 말하는 범위를 넘기지 않기 위해 더 중립적인 표현을 택했습니다.
- source_word: οὐδὲ τέρπεται ἐπʼ ἀπωλείᾳ ζώντων
  english_pob_choice: nor does he delight in the destruction of the living
  chosen_korean: 살아 있는 자들의 멸망을 기뻐하지도 않으십니다
  alternatives_korean:
  - 살아 있는 자들의 파멸을 기뻐하지도 않으십니다
  - 살아 있는 자들이 멸망하는 것을 기뻐하지도 않으십니다
  lexicon: BDAG
  rationale: τέρπομαι의 즐거움/기쁨의 뉘앙스를 ‘기뻐하다’로 살렸고, ἀπώλεια는 이 문맥에서 ‘멸망’이 가장 직접적입니다. ζώντων은 일반적이며 집합적인 ‘살아 있는 자들’로 옮겼습니다.
theological_decisions:
- issue: 하나님과 죽음의 관계를 ‘만드셨다’와 ‘창조하셨다’ 중 어떻게 옮길지
  chosen_reading: 죽음을 만드시지 않았고
  alternative_readings:
  - 죽음을 창조하시지 않았고
  rationale: 본문은 하나님이 죽음의 기원이 아니라는 점을 말하지만, ποιέω 자체를 ‘창조하다’로 확정하면 의미를 좁힐 수 있습니다. POB 원문 주석에 따라 더 직접적인 ‘만드시다’를 유지했습니다.
  doctrine_reference: '번역 원칙: 원어의 표현력을 보존하고, 신학적 결론을 번역에서 과도하게 선취하지 않음.'
