    reason: lexical_alternative
lexical_decisions:
- source_word: κακότεχνον
  english_pob_choice: a soul that devises evil
  chosen_korean: 악을 꾀하는
  alternatives_korean:
  - 교활한
  - 사악한
  - 악을 능숙하게 꾸미는
  lexicon: LSJ
  rationale: κακότεχνον은 단순한 ‘기만적’이라기보다 악한 것을 ‘솜씨 있게 꾸미다/꾀하다’는 뜻이어서, 영혼의 내면적 왜곡을 살리는 ‘악을 꾀하는’이 가장 직접적입니다.
- source_word: ψυχὴν
  english_pob_choice: soul
  chosen_korean: 영혼
  alternatives_korean:
  - 생명
  - 내면
  - 사람
  lexicon: LSJ
  rationale: 지혜서 문맥에서 ψυχή는 인격의 내적 차원을 가리키므로, ‘영혼’이 본문의 도덕적 무게와 인간 내면을 가장 잘 보존합니다.
- source_word: κατοικήσει
  english_pob_choice: dwell
  chosen_korean: 머물지도 못합니다
  alternatives_korean:
  - 거하지 못합니다
  - 살지 못합니다
  - 거처하지 못합니다
  lexicon: LSJ
  rationale: 정착하여 사는 뜻을 살리면서도 한국어에서 자연스러운 지속 거주의 이미지를 주기 위해 ‘머물다’를 택했습니다.
- source_word: κατάχρεῳ ἁμαρτίας
  english_pob_choice: a body enslaved to sin
  chosen_korean: 죄의 종노릇하는
  alternatives_korean:
  - 죄에 얽매인
  - 죄에 종속된
  - 죄에 빚진
  lexicon: LSJ
  rationale: 직역 가능한 ‘죄에 얽매인/종속된/빚진’도 가능하지만, 문맥상 죄의 지배 아래 있는 상태를 분명히 드러내는 표현으로 ‘종노릇하는’이 가장 적절합니다.
theological_decisions:
- issue: ψυχή와 σώμα의 대조
  chosen_reading: ‘영혼’과 ‘몸’을 둘 다 유지해, 본문이 제시하는 대조를 그대로 드러냈습니다.
  alternative_readings:
  - ψυχή를 ‘사람’ 또는 ‘내면’으로 완화하는 방식
  rationale: 본문은 영혼과 몸을 병치하므로, 이를 지우지 않고 보존하되 이를 넘어선 이원론적 교리는 덧붙이지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
- issue: κατάχρεῳ ἁμαρτίας의 힘
  chosen_reading: ‘죄의 종노릇하는’으로 옮겨 죄 아래 놓인 지배 관계를 표현했습니다.
  alternative_readings:
  - ‘죄에 빚진’
  - ‘죄에 종속된’
  - ‘죄에 얽매인’
  rationale: 문맥은 단순한 죄의 가능성이 아니라 죄의 권세 아래 있는 상태를 말하므로, 보다 강한 종속의 의미를 살렸습니다.
  doctrine_reference: 'DOCTRINE.md: original-language primacy over translation tradition.'
