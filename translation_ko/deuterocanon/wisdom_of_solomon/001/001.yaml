base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/001.yaml
  text: Love righteousness[a], you who judge the earth; think about the Lord with goodness[c][b], and seek him with singleness of heart.
  footnotes:
  - marker: a
    text: Or 'Love justice.' The Greek δικαιοσύνη can denote both righteousness and justice; because the verse addresses those who judge the earth, 'justice' is a plausible contextual rendering.
    reason: lexical_alternative
  - marker: b
    text: Or 'you rulers of the earth.' Literally, 'you who judge the earth.'
    reason: lexical_alternative
  - marker: c
    text: Or 'with sincerity of heart.' The Greek expression suggests an undivided, straightforward heart.
    reason: lexical_alternative
translation:
  language: ko
  text: 의를 사랑하십시오[a]. 땅을 심판하는 이들아[b], 주님에 대해 선함 가운데 생각하십시오. 그리고 마음의 한결같음으로 그분을 찾으십시오[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정의를 사랑하십시오.’ δικαιοσύνη는 이 문맥에서 의와 정의를 모두 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘땅의 통치자들아.’ 직역하면 ‘땅을 심판하는 이들’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘마음의 성실함으로.’ ἁπλότης는 분열되지 않은 단순함과 진실함을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ΑΓΑΠΗΣΑΤΕ δικαιοσύνην
  english_pob_choice: Love righteousness
  chosen_korean: 의를 사랑하십시오
  alternatives_korean:
  - 의를 사랑하라
  - 정의를 사랑하십시오
  lexicon: WLC/Greek; LSJ
  rationale: δικαιοσύνη는 이 단락에서 윤리적 올바름과 공적 판결의 공의를 함께 가리킬 수 있으므로, POB의 본문 선택인 righteousness를 한국어 기본어인 ‘의’로 옮겼습니다. 합쇼체 명령형으로 권고의 힘을 유지했습니다.
- source_word: οἱ κρίνοντες τὴν γῆν
  english_pob_choice: you who judge the earth
  chosen_korean: 땅을 심판하는 이들아
  alternatives_korean:
  - 땅을 다스리는 이들아
  - 땅을 재판하는 이들아
  lexicon: LSJ
  rationale: 그리스어는 직역하면 ‘땅/세계를 심판하는 자들’이므로, POB의 직역을 따라 ‘심판하는 이들’로 보존했습니다. 여기서 ‘이들아’는 호소형으로 원문의 대상을 분명히 합니다.
- source_word: ἐν ἀγαθότητι
  english_pob_choice: with goodness
  chosen_korean: 선함 가운데
  alternatives_korean:
  - 선함으로
  - 좋은 뜻으로
  - 인자함으로
  lexicon: LSJ
  rationale: ἀγαθότης는 단순한 도덕적 친절보다 선한 성품/태도를 가리킬 수 있어, ‘선함’으로 옮기고 전치사 ἐν의 방식성을 ‘가운데’로 살렸습니다. 다만 한국어로는 ‘선함 가운데 생각하다’가 원문 의미를 과도하게 풀지 않으면서도 자연스럽습니다.
- source_word: ἐν ἁπλότητι καρδίας
  english_pob_choice: with singleness of heart
  chosen_korean: 마음의 한결같음으로
  alternatives_korean:
  - 마음의 단순함으로
  - 마음의 성실함으로
  - 마음의 진실함으로
  lexicon: LSJ
  rationale: ἁπλότης는 ‘단순함’보다 ‘분열되지 않은 한결같음/성실함’의 뉘앙스가 강하므로, ‘한결같음’으로 번역해 마음의 분산 없음과 진정성을 함께 드러냈습니다.
theological_decisions:
- issue: δικαιοσύνη의 한국어 핵심어
  chosen_reading: 의
  alternative_readings:
  - 정의
  - 의와 정의
  rationale: POB가 righteousness를 기본값으로 유지하되 justice 가능성도 열어 둔 점을 반영해, 한국어에서는 교리적·윤리적 폭이 넓은 ‘의’를 본문에 두었습니다. 이 선택은 문맥상 재판자들에게도 자연스럽지만 특정한 정치적 의미로 축소하지 않습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: δικαιοσύνη → righteousness'
- issue: οἱ κρίνοντες τὴν γῆν의 대상을 어떻게 드러낼지
  chosen_reading: 땅을 심판하는 이들아
  alternative_readings:
  - 땅을 다스리는 이들아
  - 땅의 통치자들아
  rationale: 본문은 해석상 통치자들을 가리킬 가능성이 크지만, 그리스어 자체는 ‘심판하는 자들’이라고 말합니다. 따라서 해석을 앞세우기보다 원문 표현을 유지해, 독자가 본문이 가진 직접성을 그대로 듣게 했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy 1, 3, 5
