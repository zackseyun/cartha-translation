  - 자기를 시험하지 않는 사람들로부터
  lexicon: BDAG
  rationale: πειράζω의 여기서는 하나님을 향한 ‘시험하기’의 뜻을 따라, 대상이 되는 하나님 자신을 명시해 문맥을 분명히 했습니다.
- source_word: ἐμφανίζεται
  english_pob_choice: reveals himself
  chosen_korean: 나타나시기
  alternatives_korean:
  - 자기를 드러내시기
  - 자신을 보이시기
  lexicon: BDAG
  rationale: ‘reveals himself’의 인격적·관계적 뉘앙스를 살리면서, 한국어에서 더 자연스러운 ‘나타나시다’로 옮겼습니다. 앞절의 ‘발견되시다’와 의미상 구별도 유지합니다.
- source_word: τοῖς μὴ ἀπιστοῦσιν
  english_pob_choice: to those who do not distrust him
  chosen_korean: 자기를 불신하지 않는 사람들에게
  alternatives_korean:
  - 자기를 의심하지 않는 사람들에게
  - 자기를 믿지 못하지 않는 사람들에게
  lexicon: BDAG
  rationale: ἀπιστέω를 단순한 지적 불신앙보다 관계적 ‘불신’으로 옮겨, 앞의 ‘시험하지 않다’와 짝을 이루는 태도적 대조를 살렸습니다.
theological_decisions:
- issue: πειράζω와 ἀπιστέω의 결합이 만드는 하나님-인간 관계의 자세
  chosen_reading: 하나님을 시험하거나 불신하는 태도를 버린 이들에게 하나님이 자신을 드러내신다는 뜻으로 유지했습니다.
  alternative_readings:
  - 단순히 ‘의심하지 않는’ 정도로 완화
  - 지적 불신앙만을 뜻하는 것으로 한정
  rationale: 본문은 하나님을 향한 신뢰의 자세를 요구하며, 그 긴장을 약화시키지 않는 것이 중요합니다. 따라서 ‘시험’과 ‘불신’의 두 표현을 각각 살려 관계적·윤리적 함의를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
