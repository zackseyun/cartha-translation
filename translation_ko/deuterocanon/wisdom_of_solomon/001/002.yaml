translation:
  language: ko
  text: 왜냐하면 그분께서는 그분을 시험하지 않는 이들에게 발견되시고, 그분을 불신하지 않는 이들에게 자신을 나타내시기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘시험하다’는 ‘시험에 들게 하다’ 또는 ‘유혹하다’로도 옮길 수 있습니다. 여기서는 하나님을 시험하거나 검증하려 드는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘불신하다’는 ‘믿지 않다’ 또는 ‘신뢰하지 않다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρίσκεται
  english_pob_choice: is found
  chosen_korean: 발견되시고
  alternatives_korean:
  - 찾아지시고
  - 드러나시고
  lexicon: BDAG
  rationale: 수동형의 의미를 살리면서 하나님이 사람들에게 인식 가능하게 ‘발견되신다’는 뜻을 자연스럽게 옮겼습니다. '드러나시고'는 뒤의 ἐμφανίζεται와 중복되므로 피했습니다.
- source_word: τοῖς μὴ πειράζουσιν
  english_pob_choice: by those who do not test
  chosen_korean: 자기를 시험하지 않는 사람들에게서
