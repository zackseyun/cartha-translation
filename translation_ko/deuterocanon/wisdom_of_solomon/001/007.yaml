base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/007.yaml
  text: For the Spirit of the Lord has filled the inhabited world[b][a], and that which holds all things together has knowledge of every utterance.
  footnotes:
  - marker: a
    text: Or 'what contains all things' or 'the one who holds all things together.' The Greek expression is a neuter participle and can emphasize either containing, sustaining, or holding together all things.
    reason: lexical_alternative
  - marker: b
    text: Literally 'has knowledge of voice.' The sense is that God's all-pervading Spirit is aware of every utterance.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님의 영이 온 세상을 채우셨으며, 만물을 함께 붙들고 있는 것[a]은 모든 말소리를 알고 있습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘만물을 담고 있는 것’, ‘만물을 붙들고 있는 분’으로 옮길 수 있습니다. 그리스어는 중성 분사 표현이므로, 만물을 담고 있거나 유지하고 붙드는 작용을 가리키며, 이를 인격적으로 이해할 가능성도 열려 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘목소리에 대한 지식을 지니고 있다’입니다. ‘목소리’는 단수이나, 문맥상 모든 발화와 말소리를 포괄하는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα Κυρίου
  english_pob_choice: Spirit of the Lord
  chosen_korean: 주님의 영
  alternatives_korean:
  - 주님의 숨결
  - 주님의 영이신 분
  lexicon: LEH
  rationale: πνεῦμα는 여기서 단순한 바람이나 숨결보다 하나님의 सक्रिय하고 충만한 임재를 가리키므로, 한국어에서는 ‘영’으로 옮기되 주님과의 속격 관계를 분명히 했습니다.
- source_word: πεπλήρωκεν τὴν οἰκουμένην
  english_pob_choice: has filled the inhabited world
  chosen_korean: 온 누리를 채우셨으며
  alternatives_korean:
  - 살아가는 세상을 채우셨으며
  - 거주하는 세계를 채우셨으며
  lexicon: BDAG
  rationale: οἰκουμένην은 단순한 ‘세상’보다 사람이 거주하는 세계를 가리키므로 ‘온 누리’로 옮겨 넓은 우주적 범위를 살리면서도 자연스러운 한국어 표현을 택했습니다.
- source_word: τὸ συνέχον τὰ πάντα
  english_pob_choice: that which holds all things together
  chosen_korean: 만물을 붙들어 하나로 묶는 이는
  alternatives_korean:
  - 만물을 붙드는 것
  - 만물을 하나로 붙들고 있는 것
  lexicon: BDAG
  rationale: 중성 분사구는 인격화된 명칭으로 단정하기보다 기능을 드러내는 표현이 더 적절하므로, ‘붙들어 하나로 묶는’으로 συνέχω의 ‘붙들다/함께 유지하다’의 의미를 살렸습니다.
- source_word: γνῶσιν ἔχει φωνῆς
  english_pob_choice: has knowledge of every utterance
  chosen_korean: 모든 말소리에 대한 지식을 가지고 계십니다
  alternatives_korean:
  - 모든 말의 지식을 가지고 계십니다
  - 모든 음성에 대해 아십니다
  lexicon: BDAG
  rationale: φωνῆς는 단순한 ‘음성’보다 발화된 말이나 소리의 범위를 포함하므로, 문맥상 인간의 발언을 포괄하는 ‘말소리’로 옮기고 γνώσιν ἔχει는 ‘지식을 가지고 계십니다’로 보존했습니다.
theological_decisions:
- issue: τὸ συνέχον τὰ πάντα를 주체적 인격으로 명시할지, 중성적 기능 표현으로 둘지
  chosen_reading: ‘만물을 붙들어 하나로 묶는 이는’처럼 기능을 드러내되, 본문이 직접 단정하지 않는 인격화는 피했습니다.
  alternative_readings:
  - ‘만물을 붙드는 분’
  - ‘만물을 유지하는 힘/원리’
  rationale: 그리스어 중성 분사 구조는 본문이 의도적으로 열어 둔 긴장을 보존하므로, 한국어도 과도한 신학적 결론을 앞세우지 않고 기능 중심으로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
- issue: πνεῦμα Κυρίου의 번역에서 성령으로 고정할지 여부
  chosen_reading: ‘주님의 영’으로 번역해 하나님의 충만한 임재를 드러내되, 이후 교리적 구분을 강요하지 않았습니다.
  alternative_readings:
  - ‘성령’
  - ‘주님의 숨결’
  rationale: 지혜문학의 문맥은 성령론적 함의를 지니지만, 본절 자체는 후대 교리 용어로 환원하기보다 ‘영’의 폭넓은 의미를 보존하는 것이 더 가깝습니다.
  doctrine_reference: 'DOCTRINE.md: Maintain source-level ambiguity when the source remains ambiguous'
