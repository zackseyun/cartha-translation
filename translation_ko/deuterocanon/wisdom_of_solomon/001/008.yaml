review_pass:
  verdict: revise
  source_fidelity: 첫 절의 οὐδεὶς μὴ λάθῃ는 ‘아무도 눈에 띄지 않고 넘어가지 못하다’로 옮겨, 누구도 알아차림을 피할 수 없다는 강한 미래 부정을 자연스럽게 보존해야 합니다. 현행 ‘드러나지 않지 못하며’는 논리상 의도는 짐작되지만 한국어 문장으로 매우 부자연스럽고 의미 파악을 방해합니다. δεύτε 절의 ἐλέγχουσα ἡ δίκη는 인격화된 정의가 책망하거나 유죄를 드러내는 행위를 나타내므로 ‘책망하는 정의’는 가능한 번역입니다.
  naturalness: ‘아무도 드러나지 않지 못하며’는 현대 표준 한국어에서 비문에 가깝고, 합쇼체 성경 문체에도 맞지 않습니다. ‘아무도 눈에 띄지 않고 넘어가지 못하며’는 원문의 ‘눈에 띄지 않다/숨다’와 강한 부정을 자연스럽게 전달합니다. ‘그냥 지나가지’보다 ‘지나치지’가 더 간결하고 문어적입니다.
  terminology: ‘불의한 말’은 ἄδικα의 윤리적·법적 성격을 잘 살립니다. δίκη는 ‘정의’로 유지할 수 있으며, ‘책망하는’은 ἐλέγχουσα의 책망·폭로·유죄 입증의 범위를 과도하게 좁히지 않는 안전한 표현입니다. 각주 b의 ‘그가 책망할 때’는 선행사가 불분명하고 정의의 인격화를 충분히 반영하지 못하므로 수정합니다.
