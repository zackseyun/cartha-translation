  text: Therefore no one who speaks unrighteous things will escape notice[b][a], nor will convicting justice pass him by.
  footnotes:
  - marker: a
    text: Or 'no one who utters unjust things will go unnoticed.'
    reason: lexical_alternative
  - marker: b
    text: '''Justice'' may also be understood as personified judgment: ''nor will judgment, as it convicts, pass him by.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 불의한 말을 하는 사람은 아무도 드러나지 않지 못하며, 책망하는 정의도 그를 그냥 지나가지 못합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불의한 것들을 말하는 사람은 아무도 눈에 띄지 않을 것이다.’
    reason: lexical_alternative
  - marker: b
    text: ‘정의’는 여기서 인격화된 심판, 곧 ‘그가 책망할 때’라는 뜻으로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이 때문에
  - 이러므로
  lexicon: LSJ
  rationale: 앞선 진술을 근거로 결론을 이끄는 연결어이므로, 한국어에서도 자연스러운 추론 연결인 ‘그러므로’가 가장 직접적입니다.
- source_word: φθεγγόμενος ἄδικα
  english_pob_choice: who speaks unrighteous things
  chosen_korean: 불의한 말을 하는 사람
  alternatives_korean:
  - 불의한 것들을 말하는 사람
  - 불의한 말을 내뱉는 사람
  lexicon: LSJ
  rationale: ἄδικα의 도덕적·법적 어감을 살리면서, 한국어에서는 대상화된 ‘말들’보다 ‘불의한 말’이 더 자연스럽고 소스의 의미를 충분히 보존합니다.
- source_word: οὐδεὶς μὴ λάθῃ
  english_pob_choice: will escape notice
  chosen_korean: 아무도 드러나지 않지 못하며
  alternatives_korean:
  - 아무도 눈에 띄지 않지 못하며
  - 아무도 숨겨지지 않으며
  lexicon: LSJ
  rationale: λανθάνω의 핵심인 ‘드러나지 않다/눈에 띄지 않다’를 한국어로 살리되, 이중 부정의 강한 부정성을 반영하기 위해 ‘않지 못하며’로 옮겼습니다.
- source_word: ἐλέγχουσα ἡ δίκη
  english_pob_choice: convicting justice
  chosen_korean: 책망하는 정의
  alternatives_korean:
  - 정죄하는 정의
  - 드러내는 정의
  - 판단하는 정의
  lexicon: LSJ
  rationale: δίκη를 단순한 추상명사 ‘정의’로 두면서, ἐλέγχουσα의 공적·심판적 기능을 ‘책망하는’으로 옮겨 인격화된 사법적 힘을 보존합니다.
theological_decisions:
- issue: δίκη를 ‘judgment’로만 좁히지 않고 인격화된 ‘정의’로 살리는 문제
  chosen_reading: 주본문에서는 ‘책망하는 정의’로 번역해, 심판 행위이면서도 의의 질서가 스스로 드러내고 책망하는 뉘앙스를 유지했습니다.
  alternative_readings:
  - ‘책망하는 판단’
  - ‘정죄하는 심판’
  rationale: 이 절은 단순한 처벌 선언이 아니라, 불의한 말이 하나님의 도덕적 질서 앞에서 숨지 못한다는 선언입니다. 따라서 δίκη의 personified sense를 살려야 문맥의 힘이 유지됩니다.
  doctrine_reference: DOCTRINE.md §§ Translation philosophy 3, 5
- issue: οὐδεὶς μὴ의 강한 부정을 한국어에서 어떻게 재현할지
  chosen_reading: ‘아무도 … 않지 못하며’로 이중 부정의 절박한 확정을 유지했습니다.
  alternative_readings:
  - ‘아무도 … 숨겨지지 못하며’
  - ‘아무도 … 드러나지 못하며’
  rationale: 헬라어의 강한 미래 부정은 단순한 가능성 부정보다 단호한 불가능성에 가깝습니다. 한국어에서도 그 강도를 약화하지 않는 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 3
