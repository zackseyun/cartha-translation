  text: For an inquiry will be made into the schemes of the ungodly[c][b][a], and a report of his words will come to the Lord for the exposing of his lawless deeds.
  footnotes:
  - marker: a
    text: Or 'plans,' 'counsels,' or 'deliberations' for 'schemes.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'hearing'; the sense is that what he says comes before the Lord as a report.
    reason: lexical_alternative
  - marker: c
    text: Or 'for the reproof' or 'for the conviction' of his lawless deeds.
    reason: lexical_alternative
translation:
