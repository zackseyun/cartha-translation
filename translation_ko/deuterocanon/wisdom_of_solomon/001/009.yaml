    reason: lexical_alternative
translation:
  language: ko
  text: 그럴듯하지 않은 자의 계획들에는 심문이 있을 것이며, 그의 말에 대한 보고가 주님께 이르러 그의 불법 행위를 드러낼 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘계획들’, ‘궁리들’, ‘의논들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘들림’인데, 여기서는 그 말이 주님 앞에 보고로 올라간다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘책망’, ‘정죄’, ‘드러냄’의 뜻일 수 있습니다.
