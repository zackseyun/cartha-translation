  text: 그분께서는 만물이 존재하도록 모든 것을 창조하셨습니다. 세상에서 생겨난 것들은 생명에 유익하며[a], 그 안에는 멸망의 독이 없고, 땅 위에는 하데스의 지배도 없습니다[b].
  philosophy: optimal-equivalence
  footnotes:
