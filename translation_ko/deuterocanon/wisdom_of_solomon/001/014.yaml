    text: 또는 ‘세상의 피조물들은 유익하다’ 또는 ‘세상의 기원들은 유익하다’로 옮길 수 있습니다. 그리스어 ‘세상의 생겨남들’은 뜻의 범위가 넓으며, 창조 세계 안에서 생겨난 것들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하데스의 왕국’으로 옮길 수 있습니다. 그리스어는 영역 또는 지배권을 뜻할 수 있습니다.
