  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/014.yaml
  text: For he created all things so that they might exist[a], and the generations of the world are health-giving, and in them there is no poison of destruction, nor the dominion of Hades upon the earth[b];
  footnotes:
  - marker: a
    text: Or 'the creatures/products of the world are wholesome' or 'the origins of the world are beneficial.' The Greek phrase 'the generations of the world' is somewhat broad and may refer to the things brought forth within creation.
    reason: lexical_alternative
  - marker: b
    text: Or 'the kingdom of Hades.' The Greek can denote either a realm or a ruling power.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 만물이 존재하게 하시려고 모든 것을 창조하셨습니다[a]. 그리고 세상의 계보들은 생명을 살게 하는 것이어서, 그 안에는 멸망의 독이 없고, 땅 위에는 하데스의 지배도 없습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘세상의 피조물들은 유익하다’ 혹은 ‘세상의 기원들은 유익하다’로도 옮길 수 있습니다. 그리스어 ‘세상의 계보들’은 범위가 넓어, 창조 안에서 나오는 것들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하데스의 왕국’으로도 옮길 수 있습니다. 그리스어는 영역 또는 지배권을 뜻할 수 있습니다.
    reason: lexical_alternative
