revisions:
- from: 그런데 주님의 뜻을 누가 알았겠습니까? 주님께서 지혜를 주시고, 지극히 높으신 곳에서 주님의 거룩한 영을 보내시지 않으셨다면 말입니다.[a]
  to: 그러나 주님의 뜻을 누가 알았겠습니까? 주님께서 지혜를 주시고 지극히 높은 곳에서 주님의 거룩한 영을 보내시지 않으셨다면 말입니다.[a]
  rationale: 장소를 나타내는 ἀπὸ ὑψίστων을 ‘지극히 높은 곳에서’로 다듬어 인격적 존칭으로 오해될 가능성을 줄였습니다. 또한 한국어에 적용되지 않는 대문자화 설명을 제거하고, 대안 표현 ‘성령’의 해석적 성격을 명시했습니다. 나머지 수사 의문과 조건절 구조, 그리고 ‘거룩한 영’의 의도적 비한정성은 유지했습니다.
