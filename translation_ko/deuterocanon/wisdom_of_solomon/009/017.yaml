translation:
  language: ko
  text: 그러나 주님의 뜻을 누가 알았겠습니까? 주님께서 지혜를 주시고 지극히 높은 곳에서 주님의 거룩한 영을 보내시지 않으셨다면 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “주님의 성령”. 그리스어는 문자적으로 “주님의 거룩한 영”이라고 되어 있습니다. ‘성령’이라는 표현은 원문의 단어 자체가 아니라 그 표현에 대한 해석을 반영합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: βουλὴν
  english_pob_choice: counsel
  chosen_korean: 뜻
  alternatives_korean:
  - 계획
  - 모의
  - 의도
  lexicon: LSJ
  rationale: βουλή는 하나님의 숙고된 의도나 결정된 뜻을 가리킬 수 있으므로, 한국어에서는 문맥상 자연스럽고 넓게 아우르는 ‘뜻’으로 옮겼습니다.
- source_word: ἔδωκας σοφίαν
  english_pob_choice: have given wisdom
  chosen_korean: 지혜를 주시고
  alternatives_korean:
  - 지혜를 주셨고
  - 지혜를 주시며
  lexicon: LSJ
  rationale: 지혜 문맥에서 σοφία는 표준적으로 ‘지혜’이며, 앞뒤의 조건절 구조를 살려 동작의 결과를 자연스럽게 연결하는 ‘주시고’를 택했습니다.
- source_word: τὸ ἅγιόν σου πνεῦμα
  english_pob_choice: your holy Spirit
  chosen_korean: 주님의 거룩한 영
  alternatives_korean:
  - 주님의 성령
  - 주님의 거룩한 성령
  - 주님의 거룩한 숨결
  lexicon: LSJ
  rationale: πνεῦμα는 여기서 ‘영’으로 옮기는 것이 가장 직접적이며, ἅγιόν σου의 결합은 ‘거룩한’으로 살리되 후대 교리어를 앞세우지 않기 위해 ‘성령’ 대신 ‘거룩한 영’을 택했습니다.
- source_word: ἀπὸ ὑψίστων
  english_pob_choice: from on high
  chosen_korean: 지극히 높으신 곳에서
  alternatives_korean:
  - 높은 곳에서
  - 하늘에서
  - 위로부터
  lexicon: LSJ
  rationale: ὑψίστων은 하늘의 높은 처소를 가리키므로, 한국어에서는 격조를 유지하면서도 출처의 높음을 분명히 하는 ‘지극히 높으신 곳에서’로 옮겼습니다.
theological_decisions:
- issue: πιστό한 문맥에서 ‘holy Spirit’를 성령으로 고정할지 여부
  chosen_reading: 주님의 거룩한 영
  alternative_readings:
  - 주님의 성령
  - 주님의 거룩한 성령
  rationale: 이 지혜문학 본문은 원문 자체가 ‘your holy spirit’라고만 말하므로, 한국어에서도 삼위론적 확정 표현을 앞세우기보다 본문의 직접성을 살려 ‘거룩한 영’으로 두어 해석의 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
