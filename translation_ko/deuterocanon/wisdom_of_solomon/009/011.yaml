  rationale: 행동의 방식에 붙는 부사로서, 도덕적·실천적 분별을 담는 한국어 표현 중 ‘슬기롭게’가 가장 간결하게 어울립니다.
- source_word: ἐν τῇ δόξῃ αὐτῆς
  english_pob_choice: by her glory
  chosen_korean: 자기 영광으로
  alternatives_korean:
