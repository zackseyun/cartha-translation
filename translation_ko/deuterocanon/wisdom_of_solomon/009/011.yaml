translation:
  language: ko
  text: 그녀는 모든 것을 알고 또 이해하며, 내 행실에서 나를 슬기롭게 인도하시고, 자기 영광으로 나를 지켜 주실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀의 영광 안에서’ 혹은 ‘그녀의 영광을 통해’. 그리스어 구는 위치나 수단을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδε ... πάντα
  english_pob_choice: knows all things
  chosen_korean: 모든 것을 알고
  alternatives_korean:
