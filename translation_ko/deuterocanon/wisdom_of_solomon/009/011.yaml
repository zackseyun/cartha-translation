  - 그녀의 영광을 통해
  lexicon: BDAG
  rationale: ἐν은 여기서 위치·수단 양쪽으로 읽힐 수 있으므로, 본문 흐름에 맞는 수단적 의미를 본문에 반영하되 다른 가능성은 각주로 남겼습니다.
theological_decisions:
- issue: 의인화된 지혜를 가리키는 인칭 대명사와 술어의 성별 표현
  chosen_reading: ‘그녀’와 여성형 지시를 유지했습니다.
  alternative_readings:
  - ‘지혜’로 비인칭화하기
  - 중성적으로 옮기기
  rationale: 본문은 지혜를 여성 인칭으로 의인화하므로, 이를 평탄화하지 않고 그대로 보존하는 편이 원문의 수사와 신학적 이미지를 더 정확히 드러냅니다.
  doctrine_reference: 지혜의 의인화 보존
- issue: ἐν τῇ δόξῃ αὐτῆς의 의미 범위
  chosen_reading: 수단적 의미인 ‘자기 영광으로’를 본문에 두었습니다.
  alternative_readings:
  - ‘그녀의 영광 안에서’
  - ‘그녀의 영광을 통해’
  rationale: 문맥상 지혜가 행위를 인도하고 보호하는 능동적 매개로 나타나므로, 보호의 수단을 드러내는 번역이 가장 자연스럽습니다. 다만 그리스어의 위치적 뉘앙스도 배제하지 않도록 각주를 달았습니다.
  doctrine_reference: 의도적 해석 여지를 보존
