  lexicon: LSJ
  rationale: κατασκήνωσις의 ‘거주/장막 치심’ 뉘앙스를 너무 평면적인 ‘거주’로만 좁히지 않고, ‘거하심’으로 살렸습니다.
- source_word: μίμημα σκηνῆς ἁγίας
  english_pob_choice: an imitation of the holy tent
  chosen_korean: 거룩한 천막의 모형
  alternatives_korean:
