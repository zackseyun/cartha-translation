  lexicon: LSJ
  rationale: μίμημα는 단순 복제품보다 ‘모형/모사’에 가깝고, σκηνή는 문맥상 성소적 ‘장막’이 자연스러우므로 ‘거룩한 천막의 모형’으로 옮겼습니다.
