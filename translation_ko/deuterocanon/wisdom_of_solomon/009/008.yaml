  rationale: 직접 화법으로 시작하는 구문을 한국어에서도 유지하되, 문맥상 단순 발화보다 명령적 함의가 있어 ‘말씀하셨고’로 옮겼습니다.
- source_word: οἰκοδομῆσαι ναὸν
