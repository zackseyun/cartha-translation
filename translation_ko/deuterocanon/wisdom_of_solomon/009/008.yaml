translation:
  language: ko
  text: 주께서는 주님의 거룩한 산에, 주께서 거하시는 도성에 처음부터 준비하신 거룩한 장막을 본뜬 성전과 제단을 세우라고 말씀하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘천막’. 그리스어 σκηνή는 ‘천막’ 또는 성경적 용법에서 ‘성막/장막’을 뜻할 수 있습니다.
    reason: lexical_alternative
