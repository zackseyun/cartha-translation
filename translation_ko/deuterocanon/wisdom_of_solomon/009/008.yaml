theological_decisions:
- issue: 지상 성전/제단과 선행하는 거룩한 장막의 관계
  chosen_reading: 지상에 세워질 성전과 제단은 이미 처음부터 준비된 거룩한 장막을 본뜬 것으로 제시했습니다.
  alternative_readings:
  - 하늘의 원형을 단순히 가리키는 것으로 완화할 수 있습니다.
  - 장막을 ‘성막’으로 특화해 제도적 의미를 강조할 수 있습니다.
  rationale: 본문은 ‘모형’과 ‘처음부터 준비하심’을 함께 말하지만 그 관계를 철학적으로 해명하지 않으므로, 대응 관계의 긴장을 그대로 유지했습니다.
  doctrine_reference: 본문이 스스로 말하는 예표성과 선행 준비의 긴장을 보존합니다.
