translation:
  language: ko
  text: 주께서는 당신의 거룩한 산에 성전을 지으라고 말씀하셨고, 당신의 거하심의 도성에 제단을, 곧 처음부터 준비하신 거룩한 천막의 모형을 세우라고 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘장막’. 이 그리스어는 ‘천막’ 또는 성경적 용법에서 ‘성막/장막’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπας
  english_pob_choice: You said
  chosen_korean: 말씀하셨고
  alternatives_korean:
