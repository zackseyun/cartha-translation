  source_fidelity: 전반적인 대구와 몸-영혼/마음의 구별은 잘 반영했지만, 본문의 ‘이 천막’은 그리스어에 없는 지시 강조를 더합니다. 또한 ‘생각이 많아 근심에 찬’은 πολυφρόντιδα의 ‘많은 생각·관심사로 가득한’ 상태를 인과 관계와 ‘근심’으로 다소 좁힙니다.
  naturalness: ‘썩어 없어질 몸’, ‘흙으로 된 천막’은 현대 표준어에서 이해 가능하며 비유도 보존합니다. ‘온갖 생각으로 가득한 마음’이 원문의 정신적 복잡함을 자연스럽고 과도한 해석 없이 전달합니다.
  terminology: φθαρτόν은 ‘썩어 없어질’, ψυχή는 ‘영혼’, σκῆνος는 ‘천막’으로 옮겨 핵심 어휘와 비유를 충실히 보존했습니다. νοῦς의 ‘마음’은 자연스러운 번역이며 영혼과 구별됩니다. 각주 대안에서는 σκῆνος를 ‘몸’으로 제시하되, 원문에 없는 ‘이’는 제거해야 합니다.
