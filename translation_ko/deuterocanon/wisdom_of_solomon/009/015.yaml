lexical_decisions:
- source_word: φθαρτὸν
  english_pob_choice: perishable
  chosen_korean: 썩어 없어질
  alternatives_korean:
  - 유한한
  - 썩을 수 있는
  - 죽을 수밖에 없는
  lexicon: LSJ/BDAG
  rationale: 몸의 본질적 쇠퇴와 부패 가능성을 함께 살리기 위해 ‘썩어 없어질’을 택했습니다.
- source_word: σῶμα
