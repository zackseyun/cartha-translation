  - 걱정이 많은
  - 염려로 가득한
  lexicon: LSJ
  rationale: ‘많은 생각’과 ‘근심’의 중첩을 살려, 단순한 불안감보다 정신의 분주함을 드러내도록 옮겼습니다.
theological_decisions:
- issue: ψυχή와 νοῦς의 구분을 한국어에서 어떻게 보존할지
  chosen_reading: ψυχή는 ‘영혼’, νοῦς는 ‘마음’으로 나누어, 몸의 무게가 내적 존재와 이성적 작용을 모두 압박한다는 긴장을 살렸습니다.
  alternative_readings:
  - ψυχή를 ‘생명’이나 ‘자기’로 옮기기
  - νοῦς를 ‘이해’나 ‘지성’으로 옮기기
  rationale: 지혜문학의 대조를 흐리지 않기 위해 두 용어를 하나로 합치지 않았습니다. 한국어에서는 ‘영혼’과 ‘마음’이 가장 자연스럽게 구별을 보여 줍니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3, 5
