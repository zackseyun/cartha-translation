  source_fidelity: 그리스어의 병렬 분사 구조와 내용은 대체로 충실합니다. 다만 하나님께 드리는 기도 문맥에서 ‘당신’은 현대 표준 한국어의 존대 표현으로 부자연스럽고, ‘계명들 안에서’는 ἐν ἐντολαῖς σου의 규범적 뜻을 한국어로 충분히 드러내지 못합니다. ‘주님’이라는 호칭은 이 기도 문맥의 2인칭 하나님 지시를 자연스럽게 구현하며, 별도의 교리적 동일시를 더하지 않습니다.
  naturalness: ‘당신의 눈에 기쁜 것’과 ‘계명들 안에서’는 현대 한국어에서 다소 직역투입니다. ‘주님께서 보시기에 기쁜 것’ 및 ‘주님의 계명에 따라 옳은 것’이 합쇼체 기도 문맥에 자연스럽고 의미도 정확합니다. 각 절의 최종 서술을 ‘있습니다/압니다/분별합니다’로 처리하여 현대 정중체를 일관되게 했습니다.
  terminology: σοφία는 ‘지혜’로 유지하여 인격화된 여성형 분사들의 묘사를 과도한 신학적 해석 없이 보존했습니다. ἔργα는 폭넓은 하나님의 활동을 가리키도록 ‘하신 일’로, κόσμος는 ‘세상’으로 옮겼습니다. 각주 표지는 κόσμος에 직접 붙였습니다.
