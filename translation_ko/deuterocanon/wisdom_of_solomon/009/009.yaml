translation:
  language: ko
  text: 주님과 함께 지혜가 있습니다. 지혜는 주님께서 하신 일을 알고, 주님께서 세상[a]을 만드실 때에 함께 있었으며, 주님께서 보시기에 무엇이 기쁜지와 주님의 계명에 따라 무엇이 옳은지를 분별합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우주’. 그리스어 κόσμος는 질서 잡힌 세계를 강조할 수 있습니다.
    reason: lexical_alternative
