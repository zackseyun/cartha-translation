translation:
  language: ko
  text: 당신과 함께 지혜가 있으니, 지혜는 당신의 행위를 알고, 당신이 세상을 만드실 때에 함께 있었으며, 당신의 눈에 기쁜 것이 무엇인지, 또 당신의 계명들 안에서 무엇이 옳은지도 이해합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '우주'. 그리스어 κόσμος는 질서 잡힌 세계를 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ σοῦ
  english_pob_choice: with you
  chosen_korean: 당신과 함께
  alternatives_korean:
  - 당신 곁에
  - 당신 앞에
  lexicon: LSJ
  rationale: 가까운 동반 관계를 자연스러운 한국어로 옮기되, 공간적 뉘앙스를 과도하게 좁히지 않았습니다.
- source_word: ἡ σοφία ἡ εἰδυῖα τὰ ἔργα σου
  english_pob_choice: wisdom, who knows your works
  chosen_korean: 지혜가 있으니, 지혜는 당신의 행위를 알고
  alternatives_korean:
  - 당신의 행위를 아는 지혜가 있으니
  - 지혜가 당신의 행위를 알고
  lexicon: LSJ
  rationale: σοφία의 인격화된 모습을 살리기 위해 관계절 구조를 유지했고, ἔργα는 단순한 '일'보다 하나님의 '행위'가 더 적절합니다.
- source_word: παροῦσα ὅτε ἐποίεις τὸν κόσμον
  english_pob_choice: was present when you made the world
  chosen_korean: 당신이 세상을 만드실 때에 함께 있었으며
  alternatives_korean:
  - 당신이 세상을 지으실 때에 함께 있었으며
  - 당신이 세상을 만드실 때에 मौजूद
  lexicon: LSJ
  rationale: παροῦσα의 동반적 존재를 '함께 있었으며'로 살리고, κόσμος는 POB의 'world'에 맞춰 '세상'으로 옮겼습니다.
- source_word: τί ἀρεστὸν ἐν ὀφθαλμοῖς σου
  english_pob_choice: what is pleasing in your eyes
  chosen_korean: 당신의 눈에 기쁜 것이 무엇인지
  alternatives_korean:
  - 당신 눈앞에 기쁜 것이 무엇인지
  - 당신 보시기에 기쁜 것이 무엇인지
  lexicon: LSJ
  rationale: 히브리식 관용구를 그대로 살리면서도 현대 한국어에서 자연스럽게 읽히도록 했습니다.
- source_word: τί εὐθὲς ἐν ἐντολαῖς σου
  english_pob_choice: what is right according to your commandments
  chosen_korean: 당신의 계명들 안에서 무엇이 옳은지도
  alternatives_korean:
  - 당신의 계명들에 따라 무엇이 옳은지도
  - 당신의 계명들 가운데 무엇이 바른지도
  lexicon: LSJ
  rationale: ἐν ἐντολαῖς σου의 규범적 영역을 살려 '안에서'로 옮겼고, εὐθές는 도덕적·규범적 맥락에서 '옳다'가 가장 분명합니다.
theological_decisions:
- issue: 지혜의 인격화
  chosen_reading: 지혜를 인격적으로 말하는 관계절을 유지하되, 별도의 대문자화나 후대적 동일시를 추가하지 않았습니다.
  alternative_readings:
  - '''지혜''를 비인격적 추상명사로 평탄화'
  - '''지혜''를 고유명사처럼 처리'
  rationale: 그리스어는 분명히 여성형 분사로 지혜를 인격화하지만, 본문 자체보다 더 많은 신학적 결론을 번역에 주입하지 않는 편이 원문에 충실합니다.
  doctrine_reference: 원문 우선, 인격화는 유지하되 과잉해석은 피함
- issue: κόσμος의 처리
  chosen_reading: κόσμον을 '세상'으로 옮겨 창조된 질서 전체를 가리키는 넓은 의미를 유지했습니다.
  alternative_readings:
  - '''우주'''
  - '''코스모스'''
  rationale: 한국어에서 읽기 쉽고, POB의 'world'와도 대응하며, 철학적·과학적 뉘앙스로 좁아지는 것을 피합니다.
  doctrine_reference: 가독성과 원뜻의 균형
