translation:
  language: ko
  text: 그리고 그렇게 하여 땅 위에 있는 이들의 길이 곧게 되었고, 사람들은 당신에게 기쁜 것들을 배웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘사람들’은 성별이 아니라 인류 일반을 가리키는 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διωρθώθησαν
  english_pob_choice: were set straight
  chosen_korean: 곧게 되었고
  alternatives_korean:
  - 바로잡혔고
  - 교정되었고
  - 정바르게 되었고
  lexicon: LSJ
  rationale: 동사의 수동형이 ‘곧게 함/바로잡음’의 뜻을 가지므로, 길(paths)이라는 이미지와 맞물리도록 ‘곧게 되다’로 옮겼습니다.
- source_word: αἱ τρίβοι
  english_pob_choice: paths
  chosen_korean: 길
  alternatives_korean:
  - 경로
  - 보도
  - 길들
  lexicon: LSJ
  rationale: tríboi는 물리적이면서도 비유적인 ‘길’의 뜻을 가지므로, 문맥상 자연스럽고 이미지도 유지되는 ‘길’을 택했습니다.
- source_word: τῶν ἐπὶ γῆς
  english_pob_choice: of those on earth
  chosen_korean: 땅 위에 있는 이들의
  alternatives_korean:
  - 세상에 있는 사람들의
  - 땅에 사는 자들의
  - 지상에 있는 사람들의
  lexicon: LSJ
  rationale: 지상에 사는 인간들을 가리키는 소유격 구문이므로, 직역성을 살리되 한국어 어순에 맞게 ‘땅 위에 있는 이들의’로 옮겼습니다.
- source_word: ἀρεστά σου
  english_pob_choice: the things pleasing to you
  chosen_korean: 당신에게 기쁜 것들
  alternatives_korean:
  - 당신을 기쁘게 하는 것들
  - 당신께서 기뻐하시는 것들
  - 당신의 마음에 드는 것들
  lexicon: LSJ
  rationale: neuter 복수 명사적 형용사라 복수성을 살려야 하므로 ‘것들’을 유지했고, POB의 ‘pleasing to you’에 맞춰 ‘당신에게 기쁜’으로 옮겼습니다.
- source_word: ἐδιδάχθησαν
  english_pob_choice: were taught
  chosen_korean: 배웠습니다
  alternatives_korean:
  - 가르침을 받았습니다
  - 가르쳐졌습니다
  - 교육받았습니다
  lexicon: LSJ
  rationale: 수동형의 ‘가르침을 받다’보다 한국어에서 자연스러운 결과 상태를 살린 ‘배우다’가 더 간명하여, 피동 의미를 담아 ‘배웠습니다’로 옮겼습니다.
- source_word: ἄνθρωποι
  english_pob_choice: men
  chosen_korean: 사람들은
  alternatives_korean:
  - 인간들은
  - 남자들은
  - 사람들이
  lexicon: LSJ
  rationale: 문법적으로는 남성 복수지만 여기서는 인류 일반을 가리키므로, 한국어에서는 과도하게 성별화하지 않고 일반 명사 ‘사람들’로 옮겼습니다.
theological_decisions:
- issue: ‘당신에게 기쁜 것들’의 의미 범위
  chosen_reading: 하나님께서 기뻐하시는 뜻과 행동을 가리키는 일반적 표현으로 유지했습니다.
  alternative_readings:
  - 당신의 뜻
  - 당신이 원하시는 것들
  - 당신의 기뻐하시는 일들
  rationale: 헬라어 ἀρεστά는 ‘기쁘게 하는/마음에 드는 것들’의 넓은 의미를 가지므로, 특정 행위로 좁히지 않고 본문의 일반적 지혜 교훈을 유지했습니다.
  doctrine_reference: Wisdom literature translation principle
- issue: ἄνθρωποι의 인류 일반 지칭
  chosen_reading: 복수 ‘사람들’로 옮겨 성별 표지는 약화하되, 일반적 인간을 가리키는 뜻은 유지했습니다.
  alternative_readings:
  - 남자들
  - 인류
  - 인간들
  rationale: 원문은 문법적으로 남성 복수이지만 지혜문학에서 대표적 인류 일반을 뜻하므로, 한국어 독자에게 자연스럽고 오해가 적은 ‘사람들’을 사용했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
