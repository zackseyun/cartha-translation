  lexicon: LSJ
  rationale: προ-의 선행성은 '미리'로, 선택의 의미는 '택하다'로 살려 POB의 prior choice 뉘앙스를 보존했습니다.
- source_word: βασιλέα λαοῦ σου
  english_pob_choice: king of your people
  chosen_korean: 주님의 백성의 왕
  alternatives_korean:
