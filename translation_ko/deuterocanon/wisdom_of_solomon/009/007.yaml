translation:
  language: ko
  text: 주님은 저를 미리 택하여 주님의 백성의 왕, 곧 주님의 아들들과 딸들의 재판관으로 세우셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘미리 임명하셨다’, ‘미리 선택하셨다’로 옮길 수 있습니다. 이 동사는 앞선 선택의 뜻을 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σύ
  english_pob_choice: You
  chosen_korean: 주님은
  alternatives_korean:
  - 주님께서는
  - 당신은
  lexicon: LSJ
  rationale: 문두의 대명사 강조를 살리기 위해 주어를 앞세웠고, 지시 대상이 하나님이므로 합쇼체의 직접 호칭으로 자연스럽게 옮겼습니다.
- source_word: προείλω
  english_pob_choice: chose me beforehand
  chosen_korean: 저를 미리 택하여 주셨습니다
  alternatives_korean:
  - 저를 미리 선택하셨습니다
  - 저를 임명하셨습니다
  lexicon: LSJ
  rationale: προ-의 선행성은 '미리'로, 선택의 의미는 '택하다'로 살려 POB의 prior choice 뉘앙스를 보존했습니다.
- source_word: βασιλέα λαοῦ σου
  english_pob_choice: king of your people
  chosen_korean: 주님의 백성의 왕
  alternatives_korean:
  - 주님의 백성을 다스리는 왕
  - 주님의 백성의 임금
  lexicon: LSJ
  rationale: 속격 관계를 직역하면서도 한국어에서 자연스러운 소유구문으로 처리해 왕의 대상이 '주님의 백성'임을 분명히 했습니다.
- source_word: δικαστὴν υἱῶν σου καὶ θυγατέρων
  english_pob_choice: judge of your sons and daughters
  chosen_korean: 주님의 아들들과 딸들의 재판관
  alternatives_korean:
  - 주님의 아들들과 딸들의 심판자
  - 주님의 자녀들의 재판관
  lexicon: LSJ
  rationale: δικαστής는 일반적 '판사'보다 공적 판단을 내리는 '재판관'이 한국어에서 더 직접적으로 대응하며, 남녀 자녀를 모두 보존했습니다.
theological_decisions:
- issue: 왕과 재판관의 이중 직분
  chosen_reading: 왕, 곧 ... 재판관으로 세우셨습니다
  alternative_readings:
  - 왕이자 재판관으로 세우셨습니다
  - 왕으로 세우시고 재판관으로 삼으셨습니다
  rationale: 원문의 병렬 직분을 유지하되 한국어에서는 동격 표지 '곧'으로 연결해 역할의 이중성을 분명히 했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: 성별이 구분된 자녀 표현
  chosen_reading: 아들들과 딸들
  alternative_readings:
  - 자녀들
  - 아들과 딸
  rationale: 원문이 υἱῶν ... καὶ θυγατέρων으로 남녀를 구분하므로, POB의 gender-accurate 원칙에 따라 일반화하지 않았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
