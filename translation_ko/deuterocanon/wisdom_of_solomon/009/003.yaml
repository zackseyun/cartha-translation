lexical_decisions:
- source_word: διέπῃ τὸν κόσμον
  english_pob_choice: govern the world
  chosen_korean: 세상을 … 다스리며
  alternatives_korean:
  - 세상을 통치하며
  - 세상을 주관하며
  lexicon: διέπω
  rationale: κόσμον은 ‘세상’으로 옮기고, διοικέω 계열의 통치·관리 의미를 살려 ‘다스리다’로 번역했습니다.
- source_word: ἐν ὁσιότητι καὶ δικαιοσύνῃ
  english_pob_choice: in holiness and righteousness
  chosen_korean: 거룩함과 의로
  alternatives_korean:
  - 경건함과 의로
  - 성결과 의로
  lexicon: ὁσιότης, δικαιοσύνη
  rationale: ὁσιότης는 단순 도덕성보다 하나님 앞의 거룩한 상태를 가리키므로 ‘거룩함’이 적절하고, δικαιοσύνη는 프로젝트 기본어인 ‘의’를 유지했습니다.
- source_word: ἐν εὐθύτητι ψυχῆς
  english_pob_choice: with uprightness of soul
  chosen_korean: 마음의 올바름으로
  alternatives_korean:
  - 영혼의 올곧음으로
  - 혼의 바름으로
  lexicon: εὐθύτης, ψυχή
  rationale: ψυχή는 여기서 내면의 인격·자아를 가리키므로 ‘마음’으로 자연스럽게 옮기되, εὐθύτης의 직선성·정직성을 ‘올바름’으로 반영했습니다.
- source_word: κρίσιν κρίνῃ
  english_pob_choice: judge
  chosen_korean: 심판하십니다
  alternatives_korean:
  - 판단하십니다
  - 판결하십니다
  lexicon: κρίνω
  rationale: 끝의 중첩 구조는 ‘심판하다’가 가장 직접적이며, 문맥상 공적 재판행위를 살리는 표현입니다.
theological_decisions:
- issue: 지혜가 하나님께 청하는 통치·심판의 역할
  chosen_reading: 문장을 기도적 청원으로 유지하며, 명령형이 아니라 ‘-십니다’로 번역해 지혜의 소원을 서술적으로 표현했습니다.
  alternative_readings:
  - ‘다스리소서/심판하소서’로 직접 청원형 처리
  - ‘다스리시고… 심판하시기를’로 종속절화
  rationale: 원문은 간청의 맥락 속 미래/가정적 진술처럼 읽히므로, 한국어에서는 현재 서술형으로 옮겨도 기도적 함의가 유지됩니다.
