  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/016.yaml
  text: And we can scarcely guess the things on earth[a], and we find the things at hand with labor[b]; but who has traced out the things in the heavens?
  footnotes:
  - marker: a
    text: Or 'what is at hand' for 'the things in our hands.' The Greek expression can refer to matters close by or readily accessible.
    reason: lexical_alternative
  - marker: b
    text: Or 'searched out' for 'traced out.' The Greek verb suggests thorough investigation or tracking something out fully.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 세상에 있는 것들도 겨우 짐작하고, 손에 있는 것들도 수고를 들여서야 찾아내는데, 하늘에 있는 것들은 누가 샅샅이 밝혀냈겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘손에 있는 것들’로도 옮길 수 있습니다. 그리스어 표현은 가까이 있거나 쉽게 닿을 수 있는 사물을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘샅샅이 찾아내다’로도 옮길 수 있습니다. 그리스어 동사는 어떤 대상을 끝까지 추적해 완전히 밝혀내는 뜻을 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μόλις εἰκάζομεν
  english_pob_choice: we can scarcely guess
  chosen_korean: 겨우 짐작하고
  alternatives_korean:
  - 간신히 짐작하고
  - 거의 알지 못하고
  - 애써 추측하고
  lexicon: LSJ
  rationale: μόλις의 ‘거의/겨우’와 εἰκάζομεν의 ‘추측하다, 짐작하다’를 함께 살려, 인간 인식의 제한을 자연스러운 현대어로 전달했습니다.
- source_word: τὰ ἐπὶ γῆς
  english_pob_choice: the things on earth
  chosen_korean: 세상에 있는 것들도
  alternatives_korean:
  - 땅 위의 것들도
  - 땅에 있는 것들도
  - 세상의 일들도
  lexicon: LSJ
  rationale: 직역형을 유지할 수도 있지만, 문맥상 ‘땅/세상에 있는 사물과 일’의 대조가 핵심이므로 한국어에서 더 자연스럽게 읽히는 ‘세상에 있는 것들’로 옮겼습니다.
- source_word: τὰ ἐν χερσὶν
  english_pob_choice: the things at hand
  chosen_korean: 손에 있는 것들도
  alternatives_korean:
  - 당장 앞에 있는 것들도
  - 가까이 있는 것들도
  - 손안의 것들도
  lexicon: LSJ
  rationale: ἐν χερσίν의 손에 놓인/가까이 있는 대상을 살리기 위해 ‘손에 있는 것들’로 옮겼고, POB의 ‘at hand’라는 관용적 뜻도 함께 반영했습니다.
- source_word: μετὰ πόνου
  english_pob_choice: with labor
  chosen_korean: 수고를 들여서야
  alternatives_korean:
  - 노고를 들여서야
  - 애써서야
  - 수고 끝에야
  lexicon: LSJ
  rationale: πόνου의 ‘수고, 고생, 노고’ 뉘앙스를 한국어의 결과적 표현인 ‘수고를 들여서야’로 옮겨, 얻기 어려움을 강조했습니다.
- source_word: ἐξιχνίασεν
  english_pob_choice: traced out
  chosen_korean: 샅샅이 밝혀냈겠습니까
  alternatives_korean:
  - 추적해 밝혀냈겠습니까
  - 끝까지 찾아냈겠습니까
  - 샅샅이 찾아냈겠습니까
  lexicon: LSJ
  rationale: ἐξιχνιάζω의 ‘끝까지 추적하여 찾아내다’는 의미를 살려, 단순한 ‘알다’보다 강한 탐색의 뉘앙스를 드러냈습니다.
theological_decisions:
