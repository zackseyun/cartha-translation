translation:
  language: ko
  text: 우리는 땅 위의 것들을 겨우 짐작하고, 손에 있는 것들[a]은 수고를 들여 찾아내지만, 하늘에 있는 것들을 누가 샅샅이 밝혀냈겠습니까?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가까이 있는 것들’로 옮길 수 있습니다. 그리스어 표현은 손에 있는 것이라는 이미지와 함께, 가까이 있거나 쉽게 닿을 수 있는 것을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘샅샅이 찾아냈겠습니까?’로 옮길 수 있습니다. 그리스어 동사는 어떤 대상을 끝까지 추적하여 철저히 찾아내거나 밝혀내는 뜻을 지닙니다.
    reason: lexical_alternative
