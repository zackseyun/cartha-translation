  text: and my works will be acceptable, and I will judge your people justly, and I will be worthy of my father's thrones.
translation:
  language: ko
  text: 그리고 제 행위들은 받아들여질 것이며, 저는 당신의 백성을 공정하게 심판할 것이고, 아버지의 왕좌들에 합당한 자가 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσδεκτὰ
  english_pob_choice: will be acceptable
  chosen_korean: 받아들여질 것이며
  alternatives_korean:
  - 기쁘게 받아들여질 것이며
  - 받아들여질 것입니다
  lexicon: δέχομαι/προσδέχομαι
  rationale: 공적·제의적 수용의 뉘앙스를 살리되, 과도한 종교어를 덧붙이지 않고 자연스러운 수동 표현으로 옮겼습니다.
- source_word: διακρινῶ τὸν λαόν σου δικαίως
  english_pob_choice: I will judge your people justly
  chosen_korean: 당신의 백성을 공정하게 심판할 것이고
  alternatives_korean:
  - 당신의 백성을 의롭게 판결할 것이고
  - 당신의 백성을 옳게 심판할 것이고
  lexicon: διακρίνω + δικαίως
  rationale: διακρίνω는 문맥상 ‘판단하다/심판하다’의 뜻이므로 ‘심판하다’를 택했고, δικαίως는 법정적·윤리적 공정성을 살려 ‘공정하게’로 옮겼습니다.
- source_word: ἄξιος θρόνων πατρός μου
  english_pob_choice: worthy of my father's thrones
  chosen_korean: 아버지의 왕좌들에 합당한 자가 될 것입니다
  alternatives_korean:
  - 아버지의 왕좌들에 걸맞은 자가 될 것입니다
  - 아버지의 왕좌를 받을 자격이 있을 것입니다
  lexicon: ἄξιος + θρόνων
  rationale: 복수형 θρόνων을 그대로 반영해 ‘왕좌들’로 옮겼고, ἄξιος는 자격/합당함의 평가이므로 ‘합당한 자’로 표현했습니다.
theological_decisions:
- issue: θρόνων πατρός μου의 복수형 유지
  chosen_reading: ‘아버지의 왕좌들’로 직역해 복수성을 보존합니다.
  alternative_readings:
  - ‘아버지의 왕좌’로 단수화
  - ‘아버지의 보좌들’로 의역
  rationale: 본문이 복수형 θρόνων을 사용하므로 단수화하면 원문의 형식을 약화시킵니다. 영어 POB도 thrones를 유지했습니다.
  doctrine_reference: 본문 문법의 보존과 왕권 상속 이미지의 복수성 유지
