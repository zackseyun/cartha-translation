    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γὰρ ἄνθρωπος
  english_pob_choice: For what man
  chosen_korean: 사람이 어찌
  alternatives_korean:
  - 어떤 사람이
  - 무슨 사람이
  - 인간이 어찌
  lexicon: LSJ
  rationale: ἄνθρωπος는 여기서 단수 일반명사로 쓰였으므로, 한국어에서는 자연스러운 통칭인 ‘사람’으로 옮기되 수사적 질문의 힘을 살리기 위해 ‘어찌’ 구조를 사용했습니다.
- source_word: γνώσεται
  english_pob_choice: can know
  chosen_korean: 알 수 있겠습니까
  alternatives_korean:
  - 알겠습니까
  - 알아낼 수 있겠습니까
  - 알게 되겠습니까
  lexicon: LSJ
  rationale: 미래형이지만 여기서는 인간의 능력 한계를 묻는 수사적 질문이므로, 가능성 부정을 드러내는 ‘알 수 있겠습니까’가 가장 자연스럽습니다.
- source_word: βουλὴν θεοῦ
  english_pob_choice: the counsel of God
  chosen_korean: 하나님의 뜻
  alternatives_korean:
  - 하나님의 계획
  - 하나님의 의도
  - 하나님의 조언
  lexicon: LSJ
  rationale: βουλή는 단순한 ‘계획’보다 숙고된 의지·결정의 뉘앙스를 가지므로, 한국어에서는 신학적으로도 넓게 통하는 ‘뜻’으로 옮겨 사려 깊은 하나님의 의중을 살렸습니다.
- source_word: τί θέλει ὁ κύριος
  english_pob_choice: what the Lord wills
  chosen_korean: 주님의 뜻하심이 무엇인지
  alternatives_korean:
  - 주님이 무엇을 원하시는지
  - 주님이 무엇을 원하시는 바인지
  - 주님이 무엇을 바라시는지
  lexicon: LSJ
  rationale: θέλει는 원하다/원칙적으로 의지하다의 의미가 있어, 예배적·신학적 표현인 ‘뜻하심’으로 옮겨 하나님의 의지의 존엄성을 유지했습니다.
theological_decisions:
- issue: 주님의 호칭과 하나님의 뜻 표현
  chosen_reading: ‘하나님의 뜻’과 ‘주님의 뜻하심’으로 나누어, 앞절의 θεοῦ와 뒤절의 κύριος를 각각 살렸습니다.
  alternative_readings:
  - 둘 다 ‘하나님의 뜻’으로 통일
  - 둘 다 ‘주님의 뜻’으로 통일
  rationale: 본문은 전반부에서 하나님(θεοῦ)을, 후반부에서 주님(κύριος)을 가리키므로, 한국어에서도 구분을 유지하는 편이 원문 구조와 신학적 대비를 더 정확히 드러냅니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3, 6
- issue: 직역보다 자연스러운 수사 질문 처리
  chosen_reading: ‘어찌 … 알 수 있겠습니까? 또 … 누가 헤아릴 수 있겠습니까?’
  alternative_readings:
  - ‘누가 … 알겠습니까? 또 누가 … 생각해 내겠습니까?’
  - ‘어떤 사람이 … 알 수 있겠습니까? 또 누가 … 분별하겠습니까?’
  rationale: 본문은 인간이 신적 의도를 파악할 수 없다는 수사적 부정이므로, 한국어에서 동일한 무력감과 반문 효과를 주는 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
