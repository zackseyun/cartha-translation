  source_fidelity: 전반적으로 원문의 두 수사 의문문과 인간이 하나님의 의도와 주님의 원하심을 파악할 수 없다는 뜻을 충실히 옮겼습니다. 다만 δεύτε 문장의 ‘주님의 뜻하심’은 θέλει의 동사적 표현을 다소 명사화하며, 현대 표준어에서는 덜 자연스럽습니다. ‘주님께서 무엇을 바라시는지’로 옮기면 원문의 직접성과 자연스러움을 함께 살릴 수 있습니다.
