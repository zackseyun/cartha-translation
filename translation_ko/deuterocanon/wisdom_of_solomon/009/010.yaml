  source_fidelity: 수정이 필요합니다. αὐτήν과 συνπαροῦσά는 지혜를 여성으로 의인화하는 문법 표지인데, 본문의 ‘그분’은 한국어에서 통상 남성 또는 성별 비표지의 높임 지시로 읽혀 이 표지를 흐립니다. 또한 ἵνα 아래의 κοπιάσῃ와 γνῶ는 목적절이므로 ‘알게 될 것입니다’라는 미래 서술보다 청원의 목적을 나타내는 표현이 적절합니다. ‘저와 더불어’는 원문의 함께-함(συνπαροῦσά μοι)을 노동 동사에도 중복하여 붙인 것이므로, 함께 있음에 연결해 옮기는 것이 더 가깝습니다.
  naturalness: 합쇼체 기도문에서는 ‘그녀가 … 하게 하시고, 제가 … 알게 하십시오’가 목적과 청원을 자연스럽게 드러냅니다. ‘거룩한 하늘들’은 복수형을 보존하되 다소 낯선 표현이므로 주석으로 뒷받침할 수 있습니다.
