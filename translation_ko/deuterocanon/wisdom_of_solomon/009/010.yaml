base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/010.yaml
  text: Send her out from the holy heavens[a], and send her from the throne of your glory, so that, being present with me, she may labor with me[c][b], and I may know what is pleasing to you.
  footnotes:
  - marker: a
    text: Or 'from your glorious throne.' The Greek literally reads 'from the throne of your glory.'
    reason: lexical_alternative
  - marker: b
    text: Or 'she may toil with me.' The Greek presents Wisdom as a personified feminine figure who shares in the speaker's work.
    reason: lexical_alternative
  - marker: c
    text: Or 'what is pleasing to you' / 'what is acceptable in your sight.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분을 거룩한 하늘들에서 보내시고, 주의 영광의 보좌에서 보내십시오. 그러면 그분이 제 곁에 함께 계시며 저와 더불어 수고하시고, 제가 주님 보시기에 무엇이 기쁜지 알게 될 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거룩한 하늘들’은 그리스어 복수형 οὐρανῶν을 반영합니다.
    reason: source_note
  - marker: b
    text: 또는 ‘저와 함께 수고하시며’입니다. 원문은 지혜를 함께 일하는 인격적 존재로 묘사합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘주님 보시기에 무엇이 기쁜지’ / ‘주님께서 받아들이시는 것이 무엇인지’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαπόστειλον αὐτὴν ἐξ ἁγίων οὐρανῶν
  english_pob_choice: Send her out from the holy heavens
  chosen_korean: 그분을 거룩한 하늘들에서 보내시고
  alternatives_korean:
  - 그녀를 거룩한 하늘들에서 보내시고
  - 그분을 거룩한 하늘들로부터 보내시고
  lexicon: LSJ
  rationale: ἐξαπόστειλον의 ‘보내다/내보내다’와 ἐξ + γεν격의 출발점을 살려 방향성을 유지했습니다. οὐρανῶν의 복수는 ‘하늘들’로 옮겨 원문 표지를 보존했습니다.
- source_word: ἀπὸ θρόνου δόξης σου
  english_pob_choice: from the throne of your glory
  chosen_korean: 주의 영광의 보좌에서 보내십시오
  alternatives_korean:
  - 주의 영광의 보좌로부터 보내십시오
  - 당신의 영광의 보좌에서 보내십시오
  lexicon: LSJ
  rationale: δόξης σου의 소유격 구조를 직역하여 ‘주의 영광의 보좌’로 유지했고, ἀπὸ는 한국어 자연성을 고려해 ‘에서’로 처리했습니다.
- source_word: συνπαροῦσά μοι κοπιάσῃ
  english_pob_choice: being present with me, she may labor with me
  chosen_korean: 제 곁에 함께 계시며 저와 더불어 수고하시고
  alternatives_korean:
  - 저와 함께 있으시며 저와 함께 일하시고
  - 제 곁에 함께 계시며 저와 함께 노고하시고
  lexicon: LSJ
  rationale: συνπαροῦσά의 ‘함께 있음’은 ‘제 곁에 함께 계시며’로, κοπιάσῃ의 노동/수고는 과도한 완화 없이 ‘수고하시고’로 옮겼습니다. 의인화된 지혜의 여성형을 반영해 동사 형태도 그에 맞추었습니다.
- source_word: τί εὐάρεστόν ἐστιν παρὰ σοί
  english_pob_choice: what is pleasing to you
  chosen_korean: 제가 주님 보시기에 무엇이 기쁜지 알게 될 것입니다
  alternatives_korean:
  - 주님께 무엇이 기쁜지 알게 될 것입니다
  - 주님 보시기에 무엇이 받아들여지는지 알게 될 것입니다
  lexicon: LSJ
  rationale: παρὰ σοί를 관계적 표현으로 살려 ‘주님 보시기에’로 옮겼고, εὐάρεστον은 ‘기쁜’으로 간결하게 표현했습니다.
theological_decisions:
- issue: 지혜의 의인화와 여성 대명사 유지
  chosen_reading: 지혜를 가리키는 여성형 지시를 한국어에서도 유지하되, 본문 흐름이 깨지지 않도록 ‘그분’과 여성형 동사를 혼용하지 않고 ‘그분’으로 통일했습니다.
  alternative_readings:
  - 지혜를 ‘그녀’로 반복하기
  - 비인격적 ‘그것’으로 바꾸기
  rationale: 원문은 αὐτήν, συνπαροῦσά로 지혜를 여성형 인격으로 다루지만, 한국어 합쇼체 성경문체에서는 인칭 대명사 반복이 어색할 수 있어, 의인화는 보존하되 문체는 매끈하게 조정했습니다.
  doctrine_reference: 'DOCTRINE.md: 원문의 인격화·신학적 긴장을 보존하고, 한국어 문체는 이를 훼손하지 않는 범위에서 정리'
- issue: κλητικό/존대 문체와 하나님 직접 호칭
  chosen_reading: 하나님께 대한 직접 호칭을 ‘주님’과 존대 동사로 처리했습니다.
  alternative_readings:
  - 하나님
  - 당신
  rationale: 기도문적 어조를 유지하면서도 현대 한국어 합쇼체에 맞게 정중성을 확보했습니다.
  doctrine_reference: 'Korean target style: modern formal-polite, direct address to God uses honorific verb endings'
