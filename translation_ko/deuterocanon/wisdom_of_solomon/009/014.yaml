  lexicon: LSJ
  rationale: 여기서는 도덕적 비난보다 인간 추론의 나약함과 주저함을 가리키므로, '두렵고'가 timid의 약함·주춤함을 비교적 온건하게 전달합니다.
- source_word: ἐπισφαλεῖς
  english_pob_choice: uncertain
  chosen_korean: 불안정합니다
  alternatives_korean:
  - 확실하지 않습니다
  - 믿을 수 없습니다
  - 위태롭습니다
  lexicon: LSJ
  rationale: ἐπισφαλεῖς는 불안정하고 신뢰할 수 없는 상태를 뜻하므로, 문맥상 '불안정합니다'가 natural English의 uncertain에 해당하는 한국어로 적절합니다.
theological_decisions:
- issue: θνητῶν의 인간 조건 강조
  chosen_reading: '''죽을 인간''으로 옮겨, 인간 사유의 한계를 죽음에 묶인 존재성에서 드러냈습니다.'
  alternative_readings:
  - '''인간들'''
  - '''사람들'''
  rationale: 이 절은 단순히 사람 일반을 말하는 것이 아니라, 지혜와 대비되는 죽을 수밖에 없는 존재로서 인간을 묘사합니다. 그 신학적 뉘앙스를 보존하기 위해 유한성 표현을 넣었습니다.
