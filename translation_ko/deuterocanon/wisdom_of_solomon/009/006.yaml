  rationale: 원문의 υἱοῖς ἀνθρώπων은 히브리식 관용구로서 인간 일반을 뜻하지만, 한국어에서는 직역이 부자연스럽기 때문에 의미를 훼손하지 않는 범위에서 자연화했습니다.
