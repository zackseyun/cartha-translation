lexical_decisions:
- source_word: κἂν γάρ τις ᾖ
  english_pob_choice: For even if someone is
  chosen_korean: 사람들 가운데 아무리 완전한 이라도
  alternatives_korean:
  - 누구라도 완전한 이라도
  - 설령 아무리 완전한 사람이라도
  lexicon: LSJ
  rationale: κἂν γάρ의 양보적 흐름을 한국어의 ‘아무리 … 이라도’로 자연스럽게 살렸고, 뒤의 τέλειος와 함께 인물 평가의 대비를 드러냈습니다.
- source_word: τέλειος
  english_pob_choice: perfect
  chosen_korean: 완전한
  alternatives_korean:
  - 온전한
  - 성숙한
  lexicon: LSJ
  rationale: 지혜문맥에서의 τέλειος는 도덕적·지적 완성의 높은 평가를 가리키므로, 한국어에서는 ‘완전한’이 가장 직접적으로 대응합니다.
- source_word: ἐν υἱοῖς ἀνθρώπων
  english_pob_choice: among the sons of men
  chosen_korean: 사람들 가운데
  alternatives_korean:
  - 인자들 가운데
  - 인간들 가운데
  lexicon: LSJ
  rationale: 문자적으로는 ‘사람의 아들들’이지만, 한국어에서는 관용적 표현을 살려 인간 일반을 뜻하는 범위를 분명히 했습니다. 본문 각주 없이도 의미가 전달되도록 했습니다.
- source_word: τῆς ἀπὸ σοῦ σοφίας ἀπούσης
  english_pob_choice: apart from the wisdom that comes from you
  chosen_korean: 당신에게서 오는 지혜가 없으면
  alternatives_korean:
  - 당신에게서 오는 지혜가 부재하면
  - 당신의 지혜가 없으면
  lexicon: LSJ
  rationale: ἀπό는 출처를 나타내므로 ‘당신에게서 오는’으로 옮겼고, ἀπούσης는 단순한 부재를 뜻하므로 조건절 형태로 자연스럽게 처리했습니다.
- source_word: εἰς οὐδὲν λογισθήσεται
  english_pob_choice: he will be regarded as nothing
  chosen_korean: 아무것도 아닌 것으로 여겨질 것입니다
  alternatives_korean:
  - 아무것도 아닌 자로 간주될 것입니다
  - 무가치한 것으로 판정될 것입니다
  lexicon: LSJ
  rationale: λογίζομαι의 수동은 ‘여기다/간주하다’의 뜻이 적절하며, εἰς οὐδέν의 강한 평가를 한국어의 ‘아무것도 아닌 것’으로 재현했습니다.
theological_decisions:
- issue: 인간 보편을 가리키는 남성형 관용구의 처리
  chosen_reading: ‘사람들 가운데’로 옮겨, 원문의 대표적 남성형 표현이 가리키는 보편적 인간 범위를 살렸습니다.
  alternative_readings:
  - ‘인간들 가운데’
