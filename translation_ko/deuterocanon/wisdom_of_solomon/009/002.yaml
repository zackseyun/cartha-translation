  - 당신으로부터 생겨난 피조세계
  lexicon: BDAG
  rationale: κτίσματα의 ‘피조물’과 γενομένων의 ‘생겨난’을 함께 살려, 창조된 것들의 기원성을 두드러지게 했습니다.
