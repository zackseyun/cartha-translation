translation:
  language: ko
  text: 그리고 당신의 지혜로 사람[a]을 지으시고, 그가 당신으로 말미암아 생겨난 피조물들을 다스리게[b] 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사람’은 헬라어 단수형 ἄνθρωπον을 따른 번역으로, 여기서는 개별 남성보다 인류를 대표하는 창조 언어로 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘다스리게’는 ‘지배하게’ 또는 ‘통치하게’로도 옮길 수 있으며, 창세기의 창조 위임 언어를 떠올리게 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: σοφίᾳ σου
  english_pob_choice: by your wisdom
  chosen_korean: 당신의 지혜로
  alternatives_korean:
  - 당신의 지혜를 따라
  - 당신의 지혜를 가지고
  lexicon: BDAG
  rationale: 여격 + σου는 수단/매개를 나타내므로, ‘~로’가 원문의 도구적 의미를 가장 자연스럽게 살립니다.
- source_word: κατεσκεύασας
  english_pob_choice: you made
  chosen_korean: 지으시고
  alternatives_korean:
  - 만드시고
  - 형성하시고
  lexicon: BDAG
  rationale: 창조 문맥에서 ‘지으시다’는 현대 한국어에서 자연스럽고, 단순한 제작보다 빚어 만드시는 뉘앙스를 잘 담습니다.
- source_word: ἄνθρωπον
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 인류
  lexicon: BDAG
  rationale: 헬라어 단수형이 대표적 인류를 가리키지만, 한국어에서는 성별을 과도하게 드러내지 않으면서도 대표성을 유지하는 ‘사람’이 가장 무난합니다.
- source_word: τῶν ὑπὸ σοῦ γενομένων κτισμάτων
  english_pob_choice: the creatures that came into being through you
  chosen_korean: 당신으로 말미암아 생겨난 피조물들
  alternatives_korean:
  - 당신에 의해 지어진 피조물들
  - 당신으로부터 생겨난 피조세계
  lexicon: BDAG
  rationale: κτίσματα의 ‘피조물’과 γενομένων의 ‘생겨난’을 함께 살려, 창조된 것들의 기원성을 두드러지게 했습니다.
theological_decisions:
- issue: ἵνα δεσπόζῃ의 통치 의미
  chosen_reading: 다스리게 하셨습니다
  alternative_readings:
  - 지배하게 하셨습니다
  - 통치하게 하셨습니다
  rationale: δεσπόζῃ는 단순 관리가 아니라 권위를 가진 통치를 뜻하므로, 현대 한국어에서 가장 균형 잡힌 ‘다스리다’로 옮겼습니다. 창세기의 창조 명령과도 자연스럽게 연결됩니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, points 1 and 6
