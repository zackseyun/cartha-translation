    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신의 종들 가운데서 저를 버리지 마십시오’. 그리스어 단어는 문맥에 따라 ‘자녀들’이나 ‘종들’을 뜻할 수 있습니다.
