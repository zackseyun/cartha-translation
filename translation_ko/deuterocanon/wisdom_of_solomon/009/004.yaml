  rationale: πάρεδρος의 ‘곁에 앉아 있음’이라는 공간적 이미지를 살리되, 한국어에서 가장 자연스럽고 읽기 쉬운 표현으로 압축했습니다.
- source_word: τῶν σῶν θρόνων
  english_pob_choice: your thrones
  chosen_korean: 당신의 보좌
  alternatives_korean:
  - 당신의 보좌들
  - 당신의 왕좌
  lexicon: LSJ
  rationale: 그리스어 복수형은 본문상 보존할 가치가 있지만, 한국어에서는 ‘보좌들’이 부자연스러워 ‘보좌’로 옮기되 복수의 장엄함을 완전히 지우지 않도록 했습니다. ‘왕좌’는 의미를 좁힐 수 있어 피했습니다.
- source_word: ἀποδοκιμάσῃς
  english_pob_choice: reject
  chosen_korean: 버리지 마십시오
  alternatives_korean:
  - 거절하지 마십시오
  - 배척하지 마십시오
  lexicon: LSJ
  rationale: 문맥상 하나님 앞에서의 간절한 기도이므로 ‘reject’의 결과를 한국어에서 직접적으로 드러내는 ‘버리다’가 가장 강하고 자연스럽습니다. ‘거절하다’는 요청 자체를 부정하는 쪽으로 기울 수 있습니다.
- source_word: ἐκ παίδων σου
  english_pob_choice: from among your children
  chosen_korean: 당신의 자녀들 가운데서
  alternatives_korean:
  - 당신의 종들 가운데서
  - 당신의 아이들 가운데서
  lexicon: LSJ
  rationale: παῖδες는 문맥에 따라 ‘자녀들’ 또는 ‘종들’이 될 수 있으나, 이 기도문에서는 하나님과의 친자 관계가 더 적절하므로 ‘자녀들’을 채택했습니다. ‘가운데서’로 ἐκ의 분리를 반영했습니다.
