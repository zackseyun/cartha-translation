base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/005.yaml
  text: for I am your slave and the son of your female slave[a], a weak man and short-lived, and lacking in understanding of judgment and laws[b];
  footnotes:
  - marker: a
    text: Or 'your servant and the son of your maidservant.' The Greek uses slave-status language (δοῦλος, παιδίσκη), which can be softened in English but is rendered more directly here to preserve the speaker's humility.
    reason: lexical_alternative
  - marker: b
    text: Or 'less in understanding of judgment and laws,' that is, lacking sufficient understanding for judging and governing according to the laws.
    reason: alternative_reading
translation:
  language: ko
  text: 저는 주님의 종이며 주님의 여종의 아들입니다.[a] 또한 저는 연약하고 수명이 짧은 사람이며, 판단과 법률에 관한 이해도 부족합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '주님의 노예이며 주님의 여자 노예의 아들'로 옮길 수 있습니다. 그리스어는 종속 신분을 나타내는 표현(δοῦλος, παιδίσκη)을 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '판단과 법률을 이해하는 데 미흡한'으로 옮길 수 있습니다. 직역하면 판단과 법률에 관한 이해에서 '더 못 미치는'이라는 뜻입니다.
    reason: alternative_reading
