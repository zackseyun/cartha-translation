  chosen_korean: 여종
  alternatives_korean:
  - 여노예
  - 계집종
  lexicon: LSJ
  rationale: παιδίσκη는 신분상 하위의 여성 종을 가리키므로 '여종'이 문맥의 겸손한 호칭과 한국어 성경의 자연스러움을 함께 살립니다.
- source_word: ὀλιγόχρονιος
  english_pob_choice: short-lived
  chosen_korean: 수명이 짧은
  alternatives_korean:
  - 짧게 사는
  - 짧은 생애의
  lexicon: LSJ
  rationale: 직역적 의미인 '몇 해 되지 않은'의 뉘앙스를 현대 한국어에서는 '수명이 짧은'이 가장 분명하고 간결하게 전달합니다.
- source_word: κρίσεως καὶ νόμων
  english_pob_choice: judgment and laws
  chosen_korean: 판단과 율법들
  alternatives_korean:
  - 심판과 법들
  - 재판과 법령들
  lexicon: BDAG
  rationale: κρίσις는 여기서 통치적·사법적 판단을 가리키므로 '판단'으로, νόμοι는 복수형의 법규들을 가리키므로 '율법들'로 옮겨 법적 맥락을 보존했습니다.
