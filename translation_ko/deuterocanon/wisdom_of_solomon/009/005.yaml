  lexicon: BDAG
  rationale: 이 절은 하나님 앞에서의 자기비하 고백이므로, 현대 한국어에서는 지나치게 거친 '노예'보다 관계적 종속을 드러내는 '종'이 본문의 낮아짐을 자연스럽게 살립니다.
- source_word: παιδίσκης
