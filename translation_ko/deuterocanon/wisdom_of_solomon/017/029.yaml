  text: For the hope of the ungrateful will melt like wintry frost[b][a], and will run off like useless water.
  footnotes:
  - marker: a
    text: Or 'the thankless.' The Greek adjective emphasizes lack of gratitude.
    reason: lexical_alternative
  - marker: b
    text: The image may suggest water that runs away and proves of no use because it does not remain.
    reason: cultural_note
translation:
  language: ko
  text: 감사하지 않는 이들의 희망은 겨울의 서리처럼 녹아버리고, 쓸모없는 물처럼 흘러가 버릴 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘감사하지 않는’은 원문의 형용사 ἀχάριστος를 반영합니다. 이는 단순한 무례함보다 감사의 결핍을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘흘러가 버릴 것입니다’는 물이 유익을 남기지 못한 채 사라지는 이미지를 살린 번역입니다.
    reason: cultural_note
