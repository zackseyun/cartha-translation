translation:
  language: ko
  text: 그런 다음, 거기에 있던 사람이 누구든지 쓰러지면, 그는 쇠 없는 감옥에 갇혀 감시를 받았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘쇠 없는 감옥’입니다. 물리적인 쇠사슬이나 쇠창살 없이도 이루어지는 감금의 이미지를 나타냅니다.
    reason: lexical_alternative
