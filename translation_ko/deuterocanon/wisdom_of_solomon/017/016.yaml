translation:
  language: ko
  text: 그 뒤에는, 거기 있던 사람이 누구였든지 간에, 그가 쓰러졌을 때, 쇠가 없는 감옥에 갇힌 채 감시를 받았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘쇠 없는 감옥’입니다. 감옥의 실제 쇠사슬이나 쇠창살이 없다는 이미지를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶθʼ οὕτως
  english_pob_choice: Then
  chosen_korean: 그 뒤에는
  alternatives_korean:
  - 그때
  - 그리고 나서
  - 그리하여
  lexicon: LSJ
  rationale: 서사 전개를 표시하는 단순한 시간 전환으로 이해하여, 한국어에서는 자연스러운 연결어인 ‘그 뒤에는’으로 옮겼습니다.
- source_word: ὃς δὴ ποτʼ οὖν ἦν ἐκεῖ
  english_pob_choice: whoever it might have been there
  chosen_korean: 거기 있던 사람이 누구였든지 간에
  alternatives_korean:
  - 거기 있던 누구든지
  - 거기 있던 사람이면 누구나
  - 그 자리에 있던 그가 누구이든
  lexicon: LSJ
  rationale: 핵심은 인물의 정체가 아니라 ‘누구였든지’라는 불특정성입니다. 한국어에서도 그 수사적 불특정성을 살리기 위해 반복되는 강조를 반영했습니다.
- source_word: καταπίπτων
  english_pob_choice: when he fell down
  chosen_korean: 그가 쓰러졌을 때
  alternatives_korean:
  - 넘어졌을 때
  - 쓰러지는 동안
  - 무너져 내렸을 때
  lexicon: LSJ
  rationale: 행위의 동시성·상황성을 살리면서, 단순한 신체 동작보다 절박한 몰락의 이미지를 전하는 ‘쓰러졌을 때’를 선택했습니다.
- source_word: ἐφρουρεῖτο
  english_pob_choice: was kept under guard
  chosen_korean: 감시를 받았습니다
  alternatives_korean:
  - 경비를 받았습니다
  - 지키움을 받았습니다
  - 간수에게 지켜졌습니다
  lexicon: LSJ
  rationale: 수동형의 구금 상태를 자연스럽게 옮기되, 이어지는 ‘감옥’ 이미지와 맞물리도록 ‘감시를 받았습니다’로 처리했습니다.
- source_word: εἰς τὴν ἀσίδηρον εἱρκτὴν
  english_pob_choice: in that ironless prison
  chosen_korean: 쇠가 없는 감옥
  alternatives_korean:
  - 철이 없는 감옥
  - 무쇠가 없는 감옥
  - 쇠붙이가 없는 감옥
  lexicon: LSJ
  rationale: ἀσίδηρον의 직역인 ‘ironless’를 한국어로 과도하게 풀지 않고, POB의 이미지인 ‘ironless prison’을 유지하기 위해 ‘쇠가 없는 감옥’으로 옮겼습니다.
- source_word: κατακλεισθείς
  english_pob_choice: shut up
  chosen_korean: 갇힌 채
  alternatives_korean:
  - 가두어진 채
  - 닫힌 채
  - 봉쇄된 채
  lexicon: LSJ
  rationale: 분사로서 상태 지속을 나타내므로, 한국어의 ‘-ㄴ 채’ 구문으로 감금 상태를 자연스럽게 드러냈습니다.
