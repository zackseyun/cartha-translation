base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/008.yaml
  text: For those who promised to drive away fears and disturbances from a sick soul were themselves sick with a ridiculous fear[a].
  footnotes:
  - marker: a
    text: Or 'a laughable timidity.' The Greek εὐλάβεια can elsewhere mean 'caution' or even 'reverence,' but here the context makes a negative sense more likely.
    reason: lexical_alternative
translation:
  language: ko
  text: 병든 영혼에서 두려움과 동요를 몰아내겠다고 약속한 사람들 자신이 오히려 우스꽝스러운 두려움에 병들어 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘웃음거리가 되는 조심성’. 그리스어 εὐλάβεια는 다른 문맥에서는 ‘경계심’ 또는 ‘경외’가 될 수 있지만, 여기서는 부정적 의미가 더 강합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπισχνούμενοι
  english_pob_choice: promised
  chosen_korean: 약속한
  alternatives_korean:
  - 맹세한
  - 떠맡은
  lexicon: LSJ
  rationale: 미래의 효능을 내세우며 어떤 일을 하겠다고 말한 뉘앙스를 살리기 위해 ‘약속한’이 가장 직접적입니다.
- source_word: δείματα καὶ ταραχὰς
  english_pob_choice: fears and disturbances
  chosen_korean: 두려움과 동요
  alternatives_korean:
  - 공포와 혼란
  - 두려움과 소란
  lexicon: LSJ
  rationale: 둘 다 내면의 불안과 흔들림을 가리키므로, 심리적 의미를 살린 ‘두려움과 동요’로 옮겼습니다.
- source_word: ψυχῆς νοσούσης
  english_pob_choice: from a sick soul
  chosen_korean: 병든 영혼에서
  alternatives_korean:
  - 아픈 혼에서
  - 병든 마음에서
  lexicon: LSJ
  rationale: ψυχή를 단순한 ‘마음’으로 좁히지 않고, 인간 내면 전체를 가리키는 ‘영혼’으로 유지해 질병 은유를 살렸습니다.
- source_word: καταγέλαστον εὐλάβειαν
  english_pob_choice: a ridiculous fearfulness
  chosen_korean: 우스꽝스러운 두려움
  alternatives_korean:
  - 웃음거리가 되는 경계심
  - 우스꽝스러운 조심성
  lexicon: LSJ
  rationale: εὐλάβεια가 여기서는 긍정적 ‘경건/경외’가 아니라 조롱 섞인 부정적 의미이므로, 문맥의 아이러니를 드러내는 표현을 택했습니다.
- source_word: ἐνόσουν
  english_pob_choice: were sick with
  chosen_korean: 병들어 있었습니다
  alternatives_korean:
  - 앓고 있었습니다
  - 병에 걸려 있었습니다
  lexicon: LSJ
  rationale: 앞의 νοσούσης와 같은 질병 은유를 반복하므로, ‘병들어 있었습니다’로 대응시켜 수사적 평행을 유지했습니다.
theological_decisions:
- issue: εὐλάβεια의 의미를 긍정적 ‘경외/경건’으로 볼지, 부정적 ‘두려움/조심성’으로 볼지
  chosen_reading: 부정적 의미의 ‘두려움’ 계열로 처리했습니다.
  alternative_readings:
  - 경외
  - 경건한 조심성
  - 신중함
  rationale: 본문은 두려움과 동요를 몰아내겠다고 한 자들이 정작 자기들은 조롱거리가 되는 감정에 사로잡혔다고 역설하므로, 긍정적 종교어휘는 문맥과 충돌합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
