  text: And the tricks of magical art were laid low, and the boast of wisdom was disgracefully exposed.
translation:
  language: ko
  text: 그리고 마술 기술의 속임수는 꺾였고, 분별력에 대한 자만은 수치스럽게 책망받았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μαγικῆς ... τέχνης / 'magical art'
  english_pob_choice: magical art
  chosen_korean: 마술의
  alternatives_korean:
  - 주술의
  - 마법의
  lexicon: μαγική τέχνη
  rationale: 여기서는 실제 주술 행위의 기술을 가리키므로, 종교적·신화적 뉘앙스가 강한 ‘주술’보다 일반 독자가 바로 이해할 수 있는 ‘마술의’로 옮기되, 문자적 결속을 유지했습니다.
- source_word: ἐμπαίγματα
  english_pob_choice: tricks
  chosen_korean: 속임수들
  alternatives_korean:
  - 장난들
  - 농간들
  lexicon: ἐμπαίγματα
  rationale: 사람을 현혹하는 기만적 기법이라는 뜻을 살려 ‘속임수들’로 옮겼습니다.
- source_word: κατέκειτο
  english_pob_choice: were laid low
  chosen_korean: 무너졌으며
  alternatives_korean:
  - 엎드러졌으며
  - 눌려졌으며
  lexicon: κατάκειμαι/κατακείω
  rationale: 수동적 패배와 굴복의 이미지를 현대 한국어에서 자연스럽게 전달하는 표현으로 ‘무너졌으며’를 택했습니다.
- source_word: τῆς ... ἀλαζονίας ἔλεγχος ἐφύβριστος
  english_pob_choice: the boast of wisdom was disgracefully exposed
  chosen_korean: 지혜를 뽐내던 자들의 자만은 수치스럽게 드러났습니다
  alternatives_korean:
  - 지혜의 자랑은 수치스럽게 폭로되었습니다
  - 지혜를 자랑하던 자들의 허영은 모욕적으로 드러났습니다
  lexicon: ἀλαζονία / ἔλεγχος / ἐφύβριστος
  rationale: ἁλαζονία는 단순한 ‘자랑’보다 허장성세·자만을 뜻하므로 ‘자만’으로, ἔλεγχος는 ‘드러남/폭로됨’의 결과를 살려 ‘드러났습니다’로, ἐφύβριστος는 ‘수치스럽게’로 옮겼습니다. English POB의 ‘wisdom’은 본문 문맥상 그것을 내세우는 사람들의 태도까지 포함해 이해되므로, 한국어에서는 의미를 풀어 ‘지혜를 뽐내던 자들’로 처리했습니다.
theological_decisions:
- issue: 본문의 ‘wisdom’ 대상이 지혜 자체인지, 지혜를 내세우는 자들의 태도인지
  chosen_reading: 지혜를 내세우며 자만하던 인간의 태도가 수치스럽게 드러난 것으로 읽었습니다.
  alternative_readings:
  - 지혜라는 명목 자체가 수치스럽게 드러났다고 읽을 수 있음
  - 지혜의 자랑이 폭로되었다고 더 직역할 수 있음
  rationale: 문맥상 마술적 기술과 그에 대한 교만의 대조이므로, 단순 추상어보다 그 태도를 전면에 드러내는 번역이 독자에게 원문의 논지를 더 분명하게 전달합니다.
  doctrine_reference: 지혜문학의 수사적 대조와 교만 비판
