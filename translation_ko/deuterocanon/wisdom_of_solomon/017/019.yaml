translation:
  language: ko
  text: 혹은 떨어지는 바위들의 거친 굉음[a], 혹은 뛰어오르는 짐승들의 보이지 않는 질주[b], 혹은 가장 사나운 짐승들이 울부짖는 소리, 혹은 산속의 움푹 팬 곳에서 되울려 나오는 메아리[c]가 그들을 두려움으로 마비시켰습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내던져지는 바위들.’ 그리스어 분사는 더 수동적으로 이해될 수도 있지만, ‘내던져지는’이라는 더 강한 뜻도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘뛰어오르는 짐승들의 보이지 않는 질주’입니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘산들의 움푹 팬 곳에서 되울려 나오는 메아리’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κτύπος ἀπηνὴς
  english_pob_choice: a harsh crash
  chosen_korean: 거칠게 ... 쾅하는 소리
  alternatives_korean:
  - 무서운 굉음
  - 사나운 충돌음
  - 거친 충돌 소리
  lexicon: LSJ
  rationale: κτύπος는 단순한 소리보다 충돌의 충격음을 가리키므로 ‘쾅하는 소리’로 살리고, ἀπηνής의 거칠고 가혹한 성격은 ‘거칠게’로 옮겼습니다.
- source_word: καταρριπτομένων πετρῶν
  english_pob_choice: rocks falling down
  chosen_korean: 떨어지는 바위들
  alternatives_korean:
  - 내리꽂히는 바위들
  - 내던져지는 바위들
  - 굴러 떨어지는 바위들
  lexicon: LSJ
  rationale: 분사형은 바위의 아래로 쏟아짐을 말하므로 자연스러운 현대어로는 ‘떨어지는 바위들’이 적절합니다. POB 주석이 허용하는 ‘강하게 내던져짐’의 뉘앙스는 전체 문맥의 격렬한 이미지로 보존했습니다.
- source_word: σκιρτώντων ζῴων δρόμος ἀθεώρητος
  english_pob_choice: the unseen rush of leaping animals
  chosen_korean: 뛰어오르는 짐승들의 보이지 않는 달음질
  alternatives_korean:
  - 뛰노는 짐승들의 보이지 않는 질주
  - 튀어 오르는 동물들의 보이지 않는 움직임
  - 보이지 않는 짐승들의 달리는 소리
  lexicon: LSJ
  rationale: σκιρτώντων은 ‘뛰다/깡충거리다’의 동작을, δρόμος는 ‘달음질/질주’를 뜻하므로 ‘달음질’로 옮겼고, ἀθεώρητος는 ‘보이지 않는’으로 유지했습니다.
- source_word: ἀντανακλωμένη ἐκ κοιλότητος ὀρέων ἠχώ
  english_pob_choice: an echo thrown back from the hollow of the mountains
  chosen_korean: 산의 속빈 곳에서 되튀어 나오는 메아리
  alternatives_korean:
  - 산골의 빈 곳에서 반사되어 오는 메아리
  - 산의 골짜기에서 메아리쳐 되돌아오는 소리
  - 산의 빈 골에서 울려 돌아오는 메아리
  lexicon: LSJ
  rationale: ἀντανακλωμένη는 소리가 ‘반사되어 되돌아옴’을 가리키므로 ‘되튀어 나오는’으로 살렸고, ἐκ κοιλότητος ὀρέων은 직역에 가깝게 ‘산의 속빈 곳’으로 옮겼습니다.
- source_word: παρέλυεν ... ἐκφοβοῦντα
  english_pob_choice: paralyzed them with fear
  chosen_korean: 그들을 두려움으로 마비시켰습니다
  alternatives_korean:
  - 그들을 두려움에 얼어붙게 했습니다
  - 그들을 무서움으로 무력하게 했습니다
  - 그들을 두려움에 굳어지게 했습니다
  lexicon: LSJ
  rationale: παρέλυεν은 몸이 풀려 힘을 잃는 뜻이므로 ‘마비시켰습니다’가 가장 직접적이며, ἐκφοβοῦντα는 그 결과가 ‘두려움’에서 비롯됨을 드러내는 것으로 처리했습니다.
theological_decisions:
- issue: 의인화된 자연 소리들의 누적 효과
  chosen_reading: 문장은 자연의 여러 무서운 소리를 나열한 뒤, 그것들이 사람들을 실제로 두려움으로 마비시켰다는 결과를 그대로 살렸습니다.
  alternative_readings:
  - 단순히 ‘놀라게 했습니다’로 완화하는 번역
  - 심리적 과장을 줄여 ‘불안하게 했습니다’로 약화하는 번역
  rationale: 본문은 공포의 감각적 강도를 강조하므로, 완곡하게 만들지 않고 ‘마비’라는 강한 결과를 유지해야 합니다.
  doctrine_reference: 문학적·서사적 강조를 보존하는 번역 원칙
- issue: 짐승들의 소리를 ‘울부짖음 소리’로 처리
  chosen_reading: θῆριον의 야생성을 살려 ‘짐승들’로 두고, ὠρυομένων은 ‘울부짖음 소리’로 옮겼습니다.
  alternative_readings:
  - ‘동물들’로 일반화하는 번역
  - ‘울음소리’처럼 약화하는 번역
  rationale: 문맥은 길들여진 동물이 아니라 위협적인 야생 짐승의 소리를 묘사하므로, 그 공포감을 유지하는 쪽이 적절합니다.
  doctrine_reference: 본문의 수사적 공포 이미지 보존
