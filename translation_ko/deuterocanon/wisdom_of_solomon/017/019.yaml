    rationale: 그리스어 ἀπηνὴς는 κτύπος를 수식하여 굉음의 거칠고 가혹한 성격을 나타냅니다. 현 문구는 바위가 거칠게 떨어진다는 뜻으로 쉽게 읽힙니다.
