  source_fidelity: 전반적인 열거 구조와 ‘두려움으로 마비시켰습니다’라는 결말은 원문에 충실합니다. 다만 ἀπηνὴς는 바위가 떨어지는 방식이 아니라 κτύπος(굉음)를 수식하므로 ‘거칠게 떨어지는’은 수식 범위가 흐립니다. 또한 ἀντανακλωμένη의 반향 이미지는 ‘되튀어 나오는’보다 ‘되울려 나오는’이 소리에 더 알맞습니다.
