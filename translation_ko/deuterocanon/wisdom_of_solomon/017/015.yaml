  - 갑자기 예기치 않은 두려움이 그들에게 덮쳤기 때문입니다
  - 갑작스럽고 뜻하지 않은 공포가 그들에게 임했기 때문입니다
  lexicon: LSJ
  rationale: 두 형용사의 병렬을 살려 ‘갑작스럽고 뜻밖의’로 옮겼고, ἐπῆλθεν의 ‘오다/닥치다’의 의미를 ‘닥쳤다’로 표현해 심판적·습격적 뉘앙스를 유지했습니다.
theological_decisions:
- issue: προδοσίᾳ τῆς ψυχῆς의 난해한 내적 이미지
  chosen_reading: ‘영혼의 배반’이라는 직설적 표현을 유지해, 두려움 속에서 인간의 내면이 자기 자신에게 등을 돌리는 이미지를 살렸습니다.
  alternative_readings:
  - ‘내면의 붕괴’로 완화하기
  - ‘양심의 배반’으로 특정하기
  - ‘영혼의 항복’으로 해석하기
  rationale: 본문은 심리학적 설명으로 풀어내기보다, 낯설고 강한 은유 자체를 남겨 두는 편이 원문의 긴장을 더 잘 보존합니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
