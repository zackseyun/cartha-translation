  lexicon: LSJ
  rationale: τέρασιν은 원래 ‘기이한/무시무시한 징조’의 뉘앙스를 가지며, φαντασμάτων과 결합해 사람들을 몰아붙이는 두려운 출현을 가리키므로, ‘무서운 환상’으로 옮겨 불길한 시각적 공포를 살렸습니다.
- source_word: ἠλαύνοντο
