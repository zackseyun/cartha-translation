translation:
  language: ko
  text: 몇몇 사람들은 무서운 환상[a]에 몰렸고, 다른 이들은 영혼의 배반[b]으로 마비되었습니다. 갑작스럽고 뜻밖의 두려움이 그들에게 닥쳤기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘환영’, ‘환시’. 그리스어는 무섭고 불길한 출현을 가리키며, 실제 유령이라기보다 두려운 모습을 뜻할 가능성이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘영혼의 배반으로 마비되었다’입니다. 이 표현은 두려움 속에서 내면이 무너지며 자기 자신이 자신을 배반하는 듯한 상태를 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: τέρασιν ἠλαύνοντο φαντασμάτων
  english_pob_choice: driven by terrifying apparitions
  chosen_korean: 무서운 환상에 몰렸고
  alternatives_korean:
