- source_word: παρελύοντο προδοσίᾳ τῆς ψυχῆς
  english_pob_choice: were paralyzed by the betrayal of their soul
  chosen_korean: 영혼의 배반으로 마비되었습니다
  alternatives_korean:
  - 영혼의 배신으로 무력해졌습니다
  - 내면의 배반으로 마비되었습니다
  - 영혼이 자신을 배반하는 일로 마비되었습니다
  lexicon: LSJ
  rationale: προδοσίᾳ τῆς ψυχῆς는 문자적으로 매우 난해한 표현이어서, ‘배반/배신’이라는 핵심 은유를 유지하되 문맥상 내적 붕괴를 드러내는 ‘마비되었습니다’로 옮겼습니다.
- source_word: αἰφνίδιος ... καὶ ἀπροσδόκητος φόβος ἐπῆλθεν
  english_pob_choice: sudden and unexpected fear came upon them
  chosen_korean: 갑작스럽고 뜻밖의 두려움이 그들에게 닥쳤기 때문입니다
  alternatives_korean:
