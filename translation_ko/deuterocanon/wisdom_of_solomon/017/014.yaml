  lexicon: LSJ
  rationale: ᾅδης는 본문 자체의 그리스어 개념을 살려 ‘하데스’로 두고, μυχῶν은 숨은 내면 깊이를 나타내는 ‘깊은 곳’으로 옮겨 원문의 음산한 이미지를 보존했습니다.
