  - 엄습해 왔습니다
  lexicon: LSJ
  rationale: 단순한 도착보다 압도적으로 ‘다가와 덮치는’ 뉘앙스를 살려 밤이 그들을 엄습하는 장면을 한국어로 자연스럽게 재현했습니다.
