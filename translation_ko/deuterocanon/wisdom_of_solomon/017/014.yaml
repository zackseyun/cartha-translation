  text: But they[a], while sleeping the same sleep, with the truly powerless night having come upon them from the depths of powerless Hades,
  footnotes:
  - marker: a
    text: 'Or ''the truly irresistible night ... from the depths of irresistible Hades.'' The Greek repeats the same root (ἀδύνατος) in both phrases, and the exact nuance is difficult: it may mean ''powerless/helpless'' in a literal sense or, by implication, ''beyond resistance.'''
