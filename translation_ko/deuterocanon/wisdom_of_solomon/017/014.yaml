translation:
  language: ko
  text: 그러나 참으로 무력한 밤이 무력한 하데스의 깊은 곳에서 그들에게 닥쳐왔고, 그들은 같은 잠을 자고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘참으로 저항할 수 없는 밤이 … 저항할 수 없는 하데스의 깊은 곳에서.’ 그리스어는 두 구절에서 같은 어근(ἀδύνατος)을 반복하며, 정확한 뉘앙스는 확정하기 어렵습니다. 문자적으로는 ‘무력한/힘없는’이지만, 문맥상 ‘저항할 수 없는’이라는 뜻을 함축할 수도 있습니다.
    reason: lexical_alternative
