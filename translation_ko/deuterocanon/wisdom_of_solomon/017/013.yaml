lexical_decisions:
- source_word: ἔνδοθεν
  english_pob_choice: from within
  chosen_korean: 내적으로
  alternatives_korean:
  - 내면에서
  - 안으로부터
  lexicon: LSJ
  rationale: 내부에서 생기는 상태를 가리키므로, ‘내적으로’가 문맥상 자연스럽고 ‘from within’의 내적 원인을 잘 드러냅니다.
- source_word: ἥττων
  english_pob_choice: weaker
  chosen_korean: 더 약하여
  alternatives_korean:
  - 더 열등하여
  - 덜 강하여
  lexicon: LSJ
  rationale: 비교급의 약화·쇠약함을 직접 살려, 기대가 두려움 앞에서 힘을 잃은 상태를 표현합니다.
- source_word: πλείονα λογίζεται
  english_pob_choice: counts ... as a greater thing
  chosen_korean: 더 큰 것으로 여깁니다
  alternatives_korean:
  - 더 크다고 셉니다
  - 더 중대한 것으로 여깁니다
  lexicon: LSJ
  rationale: λογίζεται의 ‘헤아리다/여기다’ 의미를 살리면서, 한국어에서 자연스러운 판단 표현으로 옮겼습니다.
- source_word: τῆς παρεχούσης τὴν βάσανον αἰτίας
  english_pob_choice: of the cause that brings the torment
  chosen_korean: 고통을 가져오는 원인
  alternatives_korean:
  - 고통을 일으키는 원인
  - 괴로움을 주는 원인
  lexicon: LSJ
  rationale: παρεχούσης는 원인이 고통을 ‘제공/가져옴’이라는 인과를 나타내므로, ‘가져오는’으로 번역해 인과 관계를 유지했습니다.
