  text: But expectation, being weaker from within, counts ignorance of the cause that brings the torment as a greater thing.
  footnotes:
  - marker: a
    text: Or 'considers not knowing the cause of the torment to be worse.' The Greek expression literally says expectation 'counts the ignorance of the cause that brings the torment as greater.'
