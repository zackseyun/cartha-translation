  lexicon: LSJ
  rationale: 중성 관사+분사의 일반 지시를 한국어에서 자연스럽게 ‘...던 것도’로 풀어, 물질이 불에 의해 소멸되지 않았다는 물리적 대비를 살렸습니다.
