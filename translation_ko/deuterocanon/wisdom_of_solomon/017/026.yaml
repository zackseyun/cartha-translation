  - marker: b
    text: '''Man'' here has representative force, referring to human beings generally.'
    reason: lexical_alternative
  - marker: c
    text: Or 'those who believe you' or 'those who have faith in you.'
    reason: alternative_reading
translation:
  language: ko
  text: 이는 주님께서 사랑하신 당신의 아들들이 곡식의 산물이 사람을 먹여 살리는 것이 아니라, 당신의 말씀이 당신을 믿는 이들을 보존한다는 것을 알게 하려는 것이었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘곡식의 열매’나 ‘농산물의 산출물’로도 옮길 수 있습니다. 그리스어 표현은 문자 그대로 ‘세대’가 아니라 농업적 산출을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘사람’은 대표적 의미를 지닌 말로, 인류 일반을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘당신을 믿는 사람들’ 혹은 ‘당신을 신뢰하는 이들’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ υἱοί σου
  english_pob_choice: your children
  chosen_korean: 당신의 아들들
  alternatives_korean:
  - 당신의 자녀들
  lexicon: LSJ
  rationale: Greek의 υἱοί는 문자 그대로 ‘아들들’이므로 성별을 중성화하지 않고 직접 옮겼습니다. POB 영어 본문은 자연스러운 영어로 ‘children’을 택했지만, 한국어에서는 원문의 남성 복수 표지를 살리는 편이 더 분명합니다.
- source_word: οὓς ἠγάπησας
  english_pob_choice: whom you loved
  chosen_korean: 사랑하신
  alternatives_korean:
  - 사랑하셨던
  - 사랑하셨습니다
  lexicon: LSJ
  rationale: aorist ἠγάπησας를 한국어 관용에 맞게 관계절 안의 관형형으로 옮겼습니다. ἀγάπη 계열의 어근을 그대로 드러내어 ‘사랑’의 어휘 연결을 유지했습니다.
- source_word: οὐχ αἱ γενέσεις τῶν καρπῶν
  english_pob_choice: the produce of crops
  chosen_korean: 곡식의 산물
  alternatives_korean:
  - 농작물의 산물
  - 열매의 생산물
  - 농산물의 산물
  lexicon: LSJ
  rationale: γενέσεις는 여기서 ‘세대’가 아니라 생성물·산출물의 뜻이므로, 농업 맥락을 살려 ‘산물’로 옮겼습니다. καρπῶν은 문맥상 literal fruit보다 작물/곡식의 산출을 가리키므로 ‘곡식’이 과도한 직역을 피하면서 의미를 전달합니다.
- source_word: τοὺς σοὶ πιστεύοντας
  english_pob_choice: those who trust in you
  chosen_korean: 당신을 믿는 이들
  alternatives_korean:
  - 당신을 신뢰하는 이들
  - 당신께 믿는 이들
  lexicon: LSJ
  rationale: πιστεύω + 여격은 단순 지적 동의보다 인격적 신뢰/의탁을 포함하므로, 한국어에서는 자연스러운 ‘믿는 이들’로 옮겼습니다. ‘신뢰하는’도 가능하지만, 본문 전반의 신앙 표현과의 호응을 위해 ‘믿다’가 가장 안정적입니다.
theological_decisions:
- issue: 직접 호칭과 문장 종결의 존대 처리
  chosen_reading: 주님께 직접 말씀드리는 기도체로 옮기되, 문장 안에서는 현대 합쇼체를 유지했습니다.
  alternative_readings:
