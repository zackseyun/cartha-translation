- from: 그래서 주님, 사랑하신 당신의 아들들이 알게 하십시오. 곡식의 산물이 사람을 먹여 살리는 것이 아니라, 당신의 말씀이 당신을 믿는 이들을 지켜 보존한다는 것을 말입니다.[a][b][c]
