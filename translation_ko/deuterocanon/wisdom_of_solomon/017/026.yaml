  source_fidelity: 현 초안은 ἵνα μάθωσιν을 ‘알게 하십시오’라는 명령문으로 옮겨, 목적을 나타내는 원문의 접속법을 주님께 드리는 명령으로 바꾸었습니다. 또한 διατηρεῖ를 ‘지켜 보존한다’로 중복 번역했습니다. 목적절을 ‘알게 하려는 것이었습니다’로 옮기고 동사를 ‘보존한다’로 정리하면 원문에 충실합니다.
  naturalness: ‘그래서 주님, 사랑하신 당신의 아들들이 알게 하십시오’는 현대 한국어 합쇼체에서도 문법적 관계와 호칭이 어색합니다. ‘이는 주님께서 사랑하신 당신의 아들들이 … 알게 하려는 것이었습니다’는 문맥상 앞 절의 행위를 받는 목적 표현으로 자연스럽습니다.
  terminology: υἱοί의 남성 복수는 ‘아들들’로 유지했습니다. καρπῶν의 농업적 의미는 ‘곡식의 산물’로, ῥῆμα는 ‘말씀’으로, πιστεύοντας의 인격적 의탁은 ‘당신을 믿는 이들’로 유지했습니다. ‘주님’과 ‘말씀’은 현대 공적 성서 문체에 알맞습니다.
  issues:
  - severity: high
    issue: ἵνα μάθωσιν의 목적 용법이 명령문으로 바뀜
