  rationale: 원문은 Κύριε의 직접 호칭을 포함하므로 한국어에서도 ‘주님’으로 드러내야 합니다. 다만 문장 전체는 예배문처럼 고어화하지 않고, 현대 독자가 읽을 수 있는 공적 문체를 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
