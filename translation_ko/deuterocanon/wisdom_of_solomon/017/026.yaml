  - severity: medium
    issue: διατηρεῖ의 의미 중복
    rationale: ‘지켜 보존한다’는 하나의 그리스어 동사에 유사 동사를 겹쳐 놓은 표현입니다. ‘보존한다’가 원문의 보존·유지 의미를 충분히 전달합니다.
  - severity: low
    issue: 각주 c의 대안 표현이 부자연스러움
    rationale: ‘당신께 믿음을 두는 사람들’보다 ‘당신을 신뢰하는 이들’이 πιστεύω + 여격의 가능한 뉘앙스를 자연스러운 현대 한국어로 전달합니다.
