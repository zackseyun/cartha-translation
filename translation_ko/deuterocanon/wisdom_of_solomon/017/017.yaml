  language: ko
  text: 그러므로 어떤 사람이 농부이든지, 목자이든지, 광야에서 수고하는 일꾼이든지 간에, 일단 붙들리면 피할 수 없는 그 필요 아래에 머물렀습니다.[a]
  philosophy: optimal-equivalence
