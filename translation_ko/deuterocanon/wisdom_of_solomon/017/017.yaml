  text: For if someone was a farmer, or a shepherd, or a worker at toils in the wilderness, once seized, he remained under the inescapable necessity.
  footnotes:
  - marker: a
    text: Or 'once overtaken, he remained in unavoidable compulsion.' The Greek participle and noun can be rendered with either the imagery of being seized or of being overtaken by necessity.
