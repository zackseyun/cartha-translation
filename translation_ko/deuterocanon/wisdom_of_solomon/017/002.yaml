base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/002.yaml
  text: For when lawless men supposed that they were oppressing a holy nation[a], they lay imprisoned by darkness and bound fast by a long night, shut in under their roofs[c][b], fugitives from eternal providence.
  footnotes:
  - marker: a
    text: Or 'the lawless' for 'lawless men.' The Greek adjective is masculine plural used substantivally.
    reason: lexical_alternative
  - marker: b
    text: Or 'prisoners of darkness and fettered by a long night.'
    reason: lexical_alternative
  - marker: c
    text: '''Providence'' translates Greek πρόνοια, here likely referring to God''s enduring ordering care rather than mere foresight.'
    reason: cultural_note
translation:
  language: ko
  text: 무법한 자들이 거룩한 민족을 억압한다고 생각했으나, 그들은 어둠에 갇히고 긴 밤에 단단히 묶여 자기 지붕 밑에 갇힌 채, 영원한 섭리에서 도망치는 도망자들이 되어 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무법한 자들’은 그리스어 형용사 ἄνομοι가 남성 복수로 명사처럼 쓰인 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘어둠에 갇히고 긴 밤에 단단히 묶여’는 ‘어둠의 죄수’와 ‘긴 밤에 결박된 자들’이라는 병렬적 이미지로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘섭리’는 여기서 단순한 예견이 아니라 하나님의 지속적인 질서와 돌보심을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: ὑπειληφότες
  english_pob_choice: supposed
  chosen_korean: 생각했으나
  alternatives_korean:
  - 여겼으나
  - 추정했으나
  - 짐작했으나
  lexicon: LSJ
  rationale: 상대방의 판단이 빗나간 추정을 드러내기 위해, 과도하게 강한 ‘확신했다’보다 ‘생각했다’ 계열을 택했습니다.
- source_word: ἔθνος ἅγιον
  english_pob_choice: a holy nation
  chosen_korean: 거룩한 민족
  alternatives_korean:
  - 거룩한 나라
  - 성스러운 민족
  lexicon: LSJ
  rationale: ἔθνος의 기본 의미를 살려 ‘민족’으로 옮기고, covenant 언어의 ‘거룩한’을 그대로 반영했습니다.
- source_word: ἄνομοι
  english_pob_choice: lawless men
  chosen_korean: 무법한 자들
  alternatives_korean:
  - 불법한 사람들
  - 율법 없는 자들
  - 악한 자들
  lexicon: LSJ
  rationale: 남성 복수의 실질적 용법을 살리면서도, 단순한 법률 위반보다 하나님 질서에 대한 거스름을 드러내기 위해 ‘무법한 자들’로 옮겼습니다.
- source_word: δέσμιοι σκότους καὶ μακρᾶς πεδῆται νυκτός
  english_pob_choice: imprisoned by darkness and bound fast by a long night
  chosen_korean: 어둠에 갇히고 긴 밤에 단단히 묶여
  alternatives_korean:
  - 어둠의 죄수로서 긴 밤에 매여
  - 어둠의 포로가 되어 긴 밤에 묶여
  lexicon: LSJ
  rationale: δέσμιοι와 πεδῆται의 구속 이미지를 각각 ‘갇히고’와 ‘단단히 묶여’로 나누어, 어둠과 밤이 감금과 결박의 주체라는 점을 살렸습니다.
- source_word: κατακλεισθέντες ὀρόφοις
  english_pob_choice: shut in under their roofs
  chosen_korean: 자기 지붕 밑에 갇힌 채
  alternatives_korean:
  - 지붕 아래에 갇혀
  - 집 안에 갇힌 채
  lexicon: LSJ
  rationale: ὀρόφοις의 문자적 이미지를 보존하기 위해 ‘지붕 밑’으로 옮겼고, 자연스러운 한국어를 위해 ‘갇힌 채’로 정리했습니다.
- source_word: φυγάδες
  english_pob_choice: fugitives
  chosen_korean: 도망자들이 되어
  alternatives_korean:
  - 도피자들이 되어
  - 도망치는 자들로
  lexicon: LSJ
  rationale: 도피 중인 신분을 드러내는 말로 ‘도망자’가 가장 자연스럽고, 문맥의 역설을 잘 살립니다.
- source_word: τῆς αἰωνίου προνοίας
  english_pob_choice: from eternal providence
  chosen_korean: 영원한 섭리
  alternatives_korean:
  - 영원한 섭리에서
  - 영원한 돌보심에서
  - 영원한 예정에서
  lexicon: LSJ
  rationale: πρόνοια를 신학적·문학적 무게가 있는 ‘섭리’로 옮겨, 단순한 예지나 예견으로 축소하지 않았습니다.
theological_decisions:
- issue: ἄνομοι의 도덕·언약적 뉘앙스
  chosen_reading: 무법한 자들
  alternative_readings:
  - 악한 자들
  - 불법한 사람들
  rationale: 문맥상 단순 형법적 위반이 아니라 하나님 질서와 언약에 대한 반역을 드러내므로, 법적·도덕적 긴장을 함께 지닌 ‘무법한 자들’을 택했습니다.
  doctrine_reference: Translation philosophy §4
- issue: πρόνοια의 번역
  chosen_reading: 섭리
  alternative_readings:
  - 예지
  - 미리 아심
  - 돌보심
  rationale: 지혜서 문맥에서 πρόνοια는 단순한 foresight가 아니라 하나님의 주권적 돌보심과 질서를 가리키므로, 교회적 용례와 학술적 무게를 모두 갖는 ‘섭리’가 적절합니다.
  doctrine_reference: Translation philosophy §1, §6
