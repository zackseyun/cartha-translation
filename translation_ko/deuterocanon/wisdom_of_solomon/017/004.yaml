translation:
  language: ko
  text: 그들을 감싸고 있던 깊숙한 곳조차 그들을 두려움에서 지켜 주지 못했습니다[a]. 오히려 그들을 뒤흔드는 소리들이 그들 주위에 울려 퍼졌고[b], 웃음기 없고 침울한 얼굴을 한 형체들이 나타났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두려움 없이’; ἀφόβως는 ‘두려움 없이, 두려움에서 벗어난 상태로’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 희귀한 동사는 소리가 반복하여 울리거나 주변에 반향하는 모습을 시사합니다.
