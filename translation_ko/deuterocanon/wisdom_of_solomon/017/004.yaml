translation:
  language: ko
  text: 그들을 붙들고 있던 내실조차 그들을 두려움 없이 지켜 주지 못했습니다[a]. 오히려 그들을 뒤흔드는 소리들이 그들 주위를 맴돌았고[b], 어두운 얼굴의 음산한 형체들이 나타났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불안에서 자유롭게’; ἀφόβως는 ‘두려움 없이’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 희귀한 동사는 반복적으로 울리며 주변을 에워싸는 소리를 시사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μυχὸς
  english_pob_choice: inner chamber
  chosen_korean: 내실
  alternatives_korean:
  - 안쪽 방
  - 숨은 곳
  - 깊은 속
  lexicon: LSJ
  rationale: μυχός는 안쪽의 은밀한 공간을 가리키므로, 문맥의 폐쇄성과 은신처 이미지를 살리면서도 자연스러운 한국어인 ‘내실’로 옮겼습니다.
- source_word: ὁ κατέχων αὐτούς
  english_pob_choice: that held them
  chosen_korean: 그들을 붙들고 있던
  alternatives_korean:
  - 그들을 가두고 있던
  - 그들을 담고 있던
  - 그들을 지키고 있던
  lexicon: BDAG
  rationale: 분사가 방의 포위·수용 기능을 나타내므로, 물리적으로 붙들어 두는 느낌을 살리는 ‘붙들고 있던’을 택했습니다.
- source_word: ἀφόβως διεφύλασσεν
  english_pob_choice: kept them free from fear
  chosen_korean: 두려움 없이 지켜 주지 못했습니다
  alternatives_korean:
  - 두려움 없이 보호하지 못했습니다
  - 무서움 없이 지켜 주지 못했습니다
  - 두려움에서 벗어나게 해 주지 못했습니다
  lexicon: LSJ
  rationale: ἀφόβως의 핵심은 ‘두려움이 없음’이므로, 방이 안전을 보장하지 못했다는 역설을 살려 ‘두려움 없이 지켜 주지 못했습니다’로 풀었습니다.
- source_word: ἐκταράσσοντες
  english_pob_choice: that troubled
  chosen_korean: 그들을 뒤흔드는
  alternatives_korean:
  - 그들을 괴롭히는
  - 그들을 동요시키는
  - 그들을 불안하게 하는
  lexicon: LSJ
  rationale: 동사의 강한 동요·교란 의미를 반영하되 과도한 해석을 피하기 위해 ‘뒤흔드는’으로 옮겼습니다.
- source_word: ἐτρεκόμπουν
  english_pob_choice: rang around them
  chosen_korean: 그들 주위를 맴돌았고
  alternatives_korean:
  - 그들 주위를 울렸고
  - 그들 주변에 울려 퍼졌고
  - 그들 둘레를 메아리쳤고
  lexicon: LSJ
  rationale: 희귀 동사의 반복적 울림과 주변을 에워싸는 느낌을 한국어로 자연스럽게 전달하기 위해 ‘주위를 맴돌았다’로 옮겼습니다.
- source_word: φάσματα
  english_pob_choice: apparitions
  chosen_korean: 형체들
  alternatives_korean:
  - 환영들
  - 유령들
  - 발현들
  lexicon: LSJ
  rationale: φάσματα의 초자연적 가시성을 유지하면서도 실체를 단정하지 않기 위해, 영어의 ‘apparitions’에 해당하는 완곡한 ‘형체들’을 선택했습니다.
- source_word: ἀμειδήτοις κατηφῆ προσώποις
  english_pob_choice: with unsmiling faces / gloomy faces
  chosen_korean: 어두운 얼굴의
  alternatives_korean:
  - 웃지 않는 얼굴의
  - 침울한 얼굴의
  - 처진 얼굴의
  lexicon: LSJ
  rationale: 두 형용사가 얼굴의 표정과 분위기를 함께 수식하므로, 표정의 차가움과 음울함을 압축한 ‘어두운 얼굴의’로 표현했습니다.
theological_decisions:
