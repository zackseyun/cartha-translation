  - 환영들
  - 환시들
  rationale: 본문은 공포스러운 현현을 묘사하지만 그 존재론을 설명하지 않으므로, 해석을 고정하지 않고 긴장을 유지했습니다.
  doctrine_reference: 본문이 허용하는 범위 안에서 불확정성을 보존합니다.
