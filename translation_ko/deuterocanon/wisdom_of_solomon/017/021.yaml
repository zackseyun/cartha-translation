    issue: Footnote a is anchored after the first clause, although its stated lexical alternative concerns the final comparative clause.
    rationale: The note discusses ‘그들은 어둠보다 자기들에게 더 무거웠습니다’ and the repeated heavy imagery. Its marker should therefore be placed on the final clause rather than after ‘내려왔습니다.’
