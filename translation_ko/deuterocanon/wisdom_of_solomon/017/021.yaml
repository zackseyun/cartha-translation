  naturalness: ‘그들만에게는’ is less idiomatic than ‘그들에게만.’ Separating the image clause into its own sentence makes the Korean syntax clearer while retaining the source’s relations. The deliberately stark final comparison remains understandable in formal modern Korean.
  terminology: ‘무거운 밤’ and ‘더 무거웠습니다’ appropriately preserve the Greek lexical echo. ‘어둠의 모습’ is a suitable rendering of εἰκών without over-specifying the image as a doctrinal symbol. ‘장차 그들을 맞이할 어둠’ maintains the text’s ambiguity concerning the coming darkness.
  issues:
