base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/021.yaml
  text: But upon those alone heavy night was imposed[a], an image of the darkness that was about to receive them[b]; yet they were heavier to themselves than darkness.
  footnotes:
  - marker: a
    text: Or 'they were more burdensome to themselves than the darkness.' The Greek keeps the same 'heavy' imagery in both clauses.
    reason: lexical_alternative
  - marker: b
    text: The 'darkness that was about to receive them' likely points beyond the immediate plague to a greater judgment, though the text does not define it more precisely.
    reason: alternative_reading
translation:
  language: ko
  text: 오직 그들에게만 무거운 밤이 드리워졌습니다. 그것은 장차 그들을 맞이할[b] 어둠의 모습이었습니다. 그러나 그들은 자신들에게 어둠보다 더 무거웠습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 어둠보다 자기들에게 더 무거웠습니다.’ 그리스어는 두 절에서 같은 ‘무거움’ 이미지를 반복합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘장차 그들을 맞이할 어둠’은 즉각적인 재앙을 넘어 더 큰 심판을 가리킬 가능성이 있지만, 본문은 그것을 더 구체적으로 정의하지 않습니다.
    reason: alternative_reading
