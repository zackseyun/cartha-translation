  alternative_readings:
  - 악함이 단지 두려운 현실을 맞닥뜨린다고만 읽을 수도 있습니다.
  rationale: καταδικαζομένη와 συνεχομένη τῇ συνειδήσει의 결합은 외적 법정 장면보다 내적·양심적 압박을 더 강하게 시사하므로, 그 심리적 긴장을 그대로 옮겼습니다.
