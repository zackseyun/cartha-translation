translation:
  language: ko
  text: 그들은 모두 어둠의 한 사슬에 묶였습니다. — 그것은 바람의 휘파람 소리이든지, 잎이 무성한 가지들 사이의 새들의 기분 좋은 소리이든지, 세차게 흐르는 물의 요동치는 소리이든지[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘휘파람치는 영’. 그리스어 πνεῦμα는 ‘바람’ 또는 ‘영’을 뜻할 수 있으나, 여기서는 문맥상 ‘바람’이 더 잘 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μιᾷ ... ἁλύσει
  english_pob_choice: with one chain
  chosen_korean: 어둠의 한 사슬에
  alternatives_korean:
  - 어둠의 한 쇠사슬에
  - 어둠의 한 사슬로
  lexicon: LSJ
  rationale: ἁλύσει는 구체적인 ‘사슬’ 이미지이므로 이를 살리고, σκότους의 소유격은 ‘어둠의’로 옮겨 억압적 비유를 분명히 했습니다.
- source_word: σκότους
  english_pob_choice: of darkness
  chosen_korean: 어둠의
  alternatives_korean:
  - 어둠의 것
  - 어두움의
  lexicon: LSJ
  rationale: 사슬을 수식하는 소유격으로 처리해 ‘어둠의 사슬’이라는 은유를 자연스럽게 드러냈습니다.
- source_word: πνεῦμα συρίζον
  english_pob_choice: the whistling of wind
  chosen_korean: 바람의 휘파람 소리
  alternatives_korean:
  - 휘파람치는 바람
  - 바람의 휘는 소리
  - 휘파람 소리
  lexicon: LSJ
  rationale: 문맥이 밤의 자연음 목록이므로 πνεῦμα를 ‘영’이 아니라 ‘바람’으로 보고, συρίζον의 ‘휘파람/쉬익거림’ 뉘앙스를 살렸습니다.
- source_word: περὶ ἀμφιλαφεῖς κλάδους ὀρνέων ἦχος εὐμελής
  english_pob_choice: the pleasant sound of birds among the leafy branches
  chosen_korean: 잎이 무성한 가지들 사이의 새들의 기분 좋은 소리
  alternatives_korean:
  - 잎이 무성한 가지들 사이의 새소리
  - 무성한 가지들 사이의 새들의 맑은 소리
  lexicon: LSJ
  rationale: ἀμφιλαφεῖς는 ‘잎이 무성한/풍성한’ 뜻을 반영하고, ἦχος εὐμελής는 과도하게 시적으로 늘리지 않고 ‘기분 좋은 소리’로 옮겼습니다.
- source_word: ῥυθμὸς ὕδατος πορευομένου βίᾳ
  english_pob_choice: the rushing force of flowing water
  chosen_korean: 세차게 흐르는 물의 요동치는 소리
  alternatives_korean:
  - 세차게 흐르는 물의 힘찬 흐름
  - 거세게 흐르는 물의 소리
  lexicon: LSJ
  rationale: ῥυθμός는 단순한 ‘소리’보다 움직임의 리듬/고동을 암시하므로, βίᾳ와 πορευομένου를 반영해 ‘세차게 흐르는… 요동치는 소리’로 처리했습니다.
theological_decisions:
- issue: πνεῦμα의 의미가 이 구절에서 ‘영’인지 ‘바람’인지
  chosen_reading: 바람
  alternative_readings:
  - 영
  - 바람/영의 이중 의미를 살린 직역
  rationale: 새벽/야간의 자연음 목록(새, 물) 속에 놓여 있으므로, 여기서는 초자연적 ‘영’보다 ‘바람’이 문맥상 더 적절합니다. 다만 ελλην어의 다의성은 주해 각주로 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3
