  - 찬란한 불꽃
  - 영롱한 불길
  lexicon: LSJ
  rationale: ἔκλαμπροι의 강한 광휘를 ‘눈부신’으로 살리고 φλόγες는 문맥상 자연스러운 ‘불꽃’으로 옮겼습니다.
- source_word: καταυγάζειν
  english_pob_choice: to illumine
  chosen_korean: 비추지 못하였습니다
  alternatives_korean:
  - 비춰 주지 못하였습니다
  - 비추어 밝히지 못하였습니다
  - 빛을 던지지 못하였습니다
  lexicon: LSJ
  rationale: 방향성을 지닌 ‘비추다’로 옮겨, 별빛이 그 밤을 향해 작용하는 그림을 유지했습니다.
- source_word: στυγνὴν ἐκείνην νύκτα
