  lexicon: LSJ
  rationale: κατίσχυεν+부정 부정식의 뜻을 한국어 부정 능력 표현으로 압축해, ‘~하지 못했다’로 원문의 불가능성을 분명히 했습니다.
- source_word: ἔκλαμπροι φλόγες
