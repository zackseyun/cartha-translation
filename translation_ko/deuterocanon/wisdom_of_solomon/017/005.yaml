  lexicon: LSJ
  rationale: βία는 여기서 ‘효력/힘’의 뜻으로 쓰였으므로, 자연스러운 한국어 ‘힘’으로 옮기되 불의 소유격을 살려 원문의 구조를 유지했습니다.
- source_word: κατίσχυεν φωτίζειν
