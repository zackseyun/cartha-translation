  - 그 흉측한 밤
  - 그 음산한 밤
  lexicon: LSJ
  rationale: στυγνός의 강한 혐오·공포의 뉘앙스를 살리되, 현대 한국어에서 자연스러운 형용사인 ‘끔찍한’으로 과도한 고어화를 피했습니다.
