base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/028.yaml
  text: so that it might be known that one must rise before the sun to give thanks to you[b][a], and at the dawning of the light make petition to you.
  footnotes:
  - marker: a
    text: Or, 'precede the sun in thanksgiving to you.' The Greek literally says 'must precede the sun for thanksgiving to you.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'pray to you at daybreak.' The Greek expression is literally 'at the rising of light make petition to you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 해보다 먼저 당신께 감사드리고, 빛이 떠오를 때에 당신께 간구해야 한다는 것이 알려지게 하려는 것이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘당신께 감사드리기 위하여 해보다 앞서야 한다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘빛이 떠오를 때에 당신께 간구해야 한다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως γνωστὸν ἦν
  english_pob_choice: so that it might be known
  chosen_korean: 그리하여 … 알게 하려 하셨습니다
  alternatives_korean:
  - …이 알려지게 하셨습니다
  - …알려지도록 하셨습니다
  lexicon: LSJ
  rationale: ὅπως는 목적을 나타내므로 ‘그리하여’로 연결했고, γνωστὸν ἦν은 단순한 사실 진술보다 ‘알게 하다’의 목적성을 살려 옮겼습니다.
- source_word: δεῖ φθάνειν τὸν ἥλιον
  english_pob_choice: one must rise before the sun
  chosen_korean: 해가 뜨기 전에
  alternatives_korean:
  - 태양보다 먼저
  - 해보다 앞서
  lexicon: LSJ
  rationale: φθάνω+대격의 ‘먼저 도착하다/선행하다’는 뜻을 문맥상 자연스럽게 풀어 ‘해가 뜨기 전에’로 옮겨, 아침 감사의 시간성을 분명히 했습니다.
- source_word: ἐπʼ εὐχαριστίαν σου
  english_pob_choice: to give thanks to you
  chosen_korean: 당신께 감사드려야
  alternatives_korean:
  - 당신께 감사하기 위해
  - 당신께 감사하여
  lexicon: LSJ
  rationale: 전치사구는 직역보다 감사의 목적을 나타내는 자연스러운 동사구가 필요하므로, 하나님께 향한 감사 행위를 분명히 드러내는 표현을 택했습니다.
- source_word: πρὸς ἀνατολὴν φωτός
  english_pob_choice: at the dawning of the light
  chosen_korean: 빛이 돋아나는 때에
  alternatives_korean:
  - 빛이 솟아오를 때에
  - 새벽에
  lexicon: LSJ
  rationale: ‘빛의 떠오름’이라는 원문의 이미지를 살리되, 한국어에서 가장 자연스러운 아침 표지로 ‘돋아나는 때’라고 옮겼습니다.
- source_word: ἐντυγχάνειν σοι
  english_pob_choice: make petition to you
  chosen_korean: 당신께 간구해야
  alternatives_korean:
  - 당신께 기도해야
  - 당신께 청원해야
  lexicon: BDAG
  rationale: ἐντυγχάνω는 단순 일반 기도보다 청원·중보의 뉘앙스가 있어, 예배적이면서도 청원적인 ‘간구하다’가 가장 가깝습니다.
theological_decisions:
- issue: 아침 감사와 간구의 규범성
  chosen_reading: 이 절은 해 뜨기 전 감사와 새벽의 간구를 ‘해야 한다’는 일반화된 필요성으로 표현하되, 한국어에서는 과도한 율법화 없이 서술형으로 옮겼습니다.
  alternative_readings:
  - 특정 역사 서술로만 한정하여 읽는 방식
  - 정해진 기도 시간 규범으로 강하게 제도화하는 방식
  rationale: 원문 δεῖ는 필요/의무를 나타내지만, 문맥상 경건 실천의 진술이므로 번역은 그 힘을 유지하면서도 교리적 강요를 덧붙이지 않도록 조정했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
