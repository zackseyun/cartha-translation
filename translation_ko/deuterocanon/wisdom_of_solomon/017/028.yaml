  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/028.yaml
  text: so that it might be known that one must rise before the sun to give thanks to you[b][a], and at the dawning of the light make petition to you.
  footnotes:
  - marker: a
    text: Or, 'precede the sun in thanksgiving to you.' The Greek literally says 'must precede the sun for thanksgiving to you.'
