translation:
  language: ko
  text: 온 세상은 밝은 빛으로 환히 비추어졌고, 방해받지 않는 일들에 매여 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘방해받지 않는 활동들에 종사하고 있었습니다.’ 그리스어 구절은 역병의 어둠 바깥에서 정상적인 일상이 계속되었음을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅλος γὰρ ὁ κόσμος
  english_pob_choice: For the whole world
  chosen_korean: 온 세상
  alternatives_korean:
  - 온 세계
  - 모든 세계
  lexicon: LSJ
  rationale: ὅλος와 κόσμος의 총체성을 살리되, 한국어에서는 ‘온 세상’이 자연스럽고 본문 대비(애굽의 어둠 바깥의 세계)를 잘 드러냅니다.
- source_word: λαμπρῷ ... φωτί / κατελάμπετο
  english_pob_choice: was illuminated with bright light
  chosen_korean: 밝은 빛으로 환히 비추어졌고
  alternatives_korean:
  - 찬란한 빛으로 비추어졌고
  - 광명한 빛으로 밝혀졌고
  lexicon: LSJ
  rationale: 수동적 지속 상태를 나타내는 ἐκατελάμπετο의 뉘앙스를 살려 ‘비추어졌고’로 옮기고, λαμπρῷ φωτί의 결합은 ‘밝은 빛’으로 간결하게 대응했습니다.
- source_word: ἀνεμποδίστοις συνείχετο ἔργοις
  english_pob_choice: was occupied with unhindered works
  chosen_korean: 방해받지 않는 일들에 매여 있었습니다
  alternatives_korean:
  - 막힘없는 일들에 종사하고 있었습니다
  - 방해받지 않은 활동들로 분주했습니다
  lexicon: LSJ
  rationale: POB의 ‘occupied with’ 해석을 따라 일상적 활동이 계속되었음을 살리면서, συνείχετο의 ‘매여 있다/붙들려 있다’는 상태감도 함께 드러냈습니다.
theological_decisions:
- issue: κόσμος의 범위
  chosen_reading: ‘온 세상’으로 옮겨, 재앙의 어둠에 잠긴 지역 바깥의 보편적 대조를 드러냈습니다.
  alternative_readings:
  - ‘온 우주’
  - ‘온 창조세계’
  rationale: 문맥상 우주론적 진술보다 서사적 대비가 핵심이므로, 지나치게 확장된 해석은 피하고 본문 효과를 그대로 전달했습니다.
  doctrine_reference: 'PHILOSOPHY.md: original-language primacy; readable modern Korean'
