  source_fidelity: 첫째 절은 ὅλος ... κόσμος, λαμπρῷ φωτί, κατελάμπετο를 충실히 옮겼습니다. 그러나 συνείχετο ἔργοις는 여기서 ‘일들에 매여 있었다’보다 ‘일/활동에 종사하고 있었다’라는 뜻으로 이해하는 것이 문맥과 어휘상 적절합니다. ‘매여’는 구속되거나 얽매인 상태를 강하게 암시하여 ἀνεμποδίστοις(방해 없이)와도 어색한 긴장을 만듭니다.
  naturalness: ‘온 세상은 밝은 빛으로 환히 비추어졌고’는 자연스럽습니다. 후반은 ‘방해 없이 일들을 하고 있었습니다’로 하면 현대 표준 한국어 합쇼체에서 자연스럽고, 어둠의 재앙 밖에서는 통상적인 활동이 지속되었다는 대비도 분명해집니다.
  terminology: ‘온 세상’, ‘밝은 빛’, ‘방해 없이’는 적절합니다. ἔργοις는 특정한 직업적 노동으로 좁히지 않고 ‘일들’로 유지했습니다.
  issues:
  - severity: medium
    issue: ‘방해받지 않는 일들에 매여 있었습니다’
    rationale: συνείχετο의 문맥상 의미는 활동에 종사하거나 몰두하고 있었다는 뜻입니다. 한국어 ‘매여 있다’는 속박·구속의 의미가 두드러져, 정상적이고 방해 없는 활동의 지속이라는 원문의 대조를 흐립니다.
