lexical_decisions:
- source_word: φόβος
  english_pob_choice: fear
  chosen_korean: 두려움
  alternatives_korean:
  - 공포
  - 경외
  lexicon: LSJ
  rationale: 원문의 φόβος는 일반적인 두려움의 상태를 가리키므로, 한국어에서는 과도하게 강한 ‘공포’보다 중립적인 ‘두려움’이 문맥에 더 정확합니다.
- source_word: οὐθὲν ... εἰ μὴ
