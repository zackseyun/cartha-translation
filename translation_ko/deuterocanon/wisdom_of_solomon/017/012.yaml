  lexicon: LSJ
  rationale: 배제적 정의를 나타내는 관용구이므로, ‘nothing but’의 논리적 힘을 살리는 표현으로 옮겼습니다.
- source_word: προδοσία
  english_pob_choice: betrayal
  chosen_korean: 배신
  alternatives_korean:
  - 배반
  - 출卖
  lexicon: LSJ
  rationale: 원문은 내적 도움을 저버리는 행위를 말하므로, ‘betrayal’에 대응하는 자연스러운 현대어 ‘배신’이 적절합니다.
- source_word: τῶν ἀπὸ λογισμοῦ βοηθημάτων
  english_pob_choice: the helps that come from reason
  chosen_korean: 이성에서 오는 도움들
  alternatives_korean:
  - 이성에서 비롯된 도움들
  - 사유에서 나온 도움들
  lexicon: LSJ
  rationale: ἀπὸ λογισμοῦ는 ‘reasoning/rational reflection’의 출처를 나타내므로, 한국어에서는 ‘이성에서 오는’으로 간결하게 source/source-from 관계를 살렸습니다.
theological_decisions:
- issue: λόγισμος의 철학적 뉘앙스
  chosen_reading: ‘이성’으로 옮겨, 본절을 교리 진술이 아니라 이성적 판단을 포기하는 심리·철학적 관찰로 읽게 했습니다.
  alternative_readings:
  - ‘사유’로 옮김
  - ‘추론’으로 옮김
  rationale: 이 절은 두려움의 본질을 설명하는 지혜문학적 진술이므로, 신학적 확장보다 인간의 이성 기능을 가리키는 표현을 택하는 것이 원문에 충실합니다.
  doctrine_reference: '지혜문학의 인간론/인식론; translation philosophy: optimal equivalence'
