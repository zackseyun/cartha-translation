translation:
  language: ko
  text: 그들은 비밀스러운 죄들 가운데서 자신들이 숨겨질 수 있다고 생각하였으므로, 어둠의 망각의 덮개 아래로 흩어졌으며, 몹시 놀라고 환상에 흔들렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘환상’은 ‘유령’ 또는 ‘귀신 같은 모습’으로도 옮길 수 있습니다. 그리스어는 이미지 같은 모습이나 유령 같은 출현을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λανθάνειν
  english_pob_choice: to remain hidden
  chosen_korean: 숨겨질 수 있다고
  alternatives_korean:
