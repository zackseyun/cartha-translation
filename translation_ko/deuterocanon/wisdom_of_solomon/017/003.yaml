  lexicon: LSJ
  rationale: 가리어져 알아차려지지 않는다는 뜻을 한국어 동사구로 자연스럽게 살려, 자기들이 숨겨진 상태에 있을 것이라는 판단을 반영했습니다.
- source_word: κρυφαίοις ἁμαρτήμασιν
  english_pob_choice: their secret sins
  chosen_korean: 비밀스러운 죄들
  alternatives_korean:
  - 숨은 죄들
  - 은밀한 죄악들
  lexicon: LSJ
  rationale: κρυφαίοις의 ‘숨은/비밀스러운’ 뉘앙스와 ἁμαρτήμασιν의 죄성(죄들)을 함께 살렸습니다.
- source_word: ἀφεγγεῖ λήθης παρακαλύμματι
  english_pob_choice: under the dark veil of forgetfulness
  chosen_korean: 어둠의 망각의 덮개 아래로
  alternatives_korean:
  - 어두운 망각의 베일 아래로
  - 빛 없는 망각의 가림막 아래로
  lexicon: LSJ
  rationale: ἀφεγγεῖ는 ‘빛이 없는/어두운’ 상태를 가리키므로 ‘어둠의’로 옮기고, παρακαλύμματι는 ‘덮개/가림막’보다 비유적 ‘덮개’가 무난하여 채택했습니다.
- source_word: ἰνδάλμασιν
  english_pob_choice: apparitions
  chosen_korean: 환상
  alternatives_korean:
  - 유령들
  - 현상들
  - 귀신 같은 모습들
  lexicon: LSJ
  rationale: 이 단어는 image, phantom, apparition을 모두 가리킬 수 있어 존재론을 확정하지 않도록 하면서도, 공포스러운 시각적 출현을 한국어에서 가장 압축적으로 드러내는 ‘환상’을 택했습니다.
