revisions:
- from: 그들은 비밀스러운 죄들 가운데서 자신들이 숨겨질 수 있다고 생각하였으므로, 어둠의 망각의 덮개 아래로 흩어졌으며, 몹시 놀라고 환상에 흔들렸습니다.[a]
  to: 그들은 자신들의 은밀한 죄를 아무도 알지 못하리라고 생각하였으나, 빛 없는 망각의 덮개 아래에서 흩어지고, 몹시 겁에 질리며 환영들에 동요되었습니다.[a]
  rationale: The revision renders λανθάνειν as escaping notice, clarifies the grammatical relation of the dark/lightless veil of forgetfulness, removes an unwarranted directional nuance, and replaces ‘환상’ with the more source-ambiguous ‘환영들.’ The footnote remains anchored to the lexical ambiguity of ἰνδάλμασιν.
