theological_decisions:
- issue: 출애굽기 첫아들 재앙 암시를 본문에 얼마나 드러낼지
  chosen_reading: 본문은 ‘가장 존귀한 자손’으로 두고, 명시적 ‘첫아들’은 본문 밖의 해석으로 남깁니다.
  alternative_readings:
