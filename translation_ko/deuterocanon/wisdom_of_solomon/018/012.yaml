  rationale: 그리스어는 πρωτότοκος가 아니라 ἐντιμοτέρα γένεσις를 사용하므로, 맥락상 첫아들을 가리킬 수 있어도 번역 본문에는 직접 넣지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
