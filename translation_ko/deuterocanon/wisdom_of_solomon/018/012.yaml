- from: 그들은 모두 한결같이[a], 죽음이라는 한 이름 아래 수많은 죽은 자들을 두었습니다. 살아 있는 자들도 그들을 묻기에는 충분하지 않았으니, 그들의 가장 존귀한 자손이 한순간에 멸망했기 때문입니다.
  to: 그들은 모두 한결같이 같은 죽음으로 셀 수 없이 많은 시신을 내었으며[a], 살아 있는 이들마저 그들을 묻기에는 너무 적었습니다. 그들이 가장 귀하게 여기던 자손이 한순간에 멸망했기 때문입니다.
  rationale: 원문의 모호한 ‘죽음의 한 이름’은 한국어에서 이해 가능한 ‘같은 죽음’으로 관용적으로 옮겼습니다. 이는 특정한 법적 ‘사형 선고’를 확정하지 않으면서 공통된 죽음의 재앙이라는 문맥을 보존합니다. 또한 ‘시신을 내었으며’와 ‘너무 적었습니다’로 사망 규모와 매장 불능을 자연스럽게 표현했습니다. 마지막 절은 원문이 πρωτότοκος라고 하지 않으므로 ‘첫아들’로 좁히지 않고, ἐντιμοτέρα γένεσις의 가치 평가를 ‘가장 귀하게 여기던 자손’으로 살렸습니다.
