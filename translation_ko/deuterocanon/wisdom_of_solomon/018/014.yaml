  - 감싸고 있을 때
  lexicon: LSJ
  rationale: 분사 περιεχούσης의 핵심은 ‘둘러싸다, 에워싸다’이므로, 능동적으로 자연스러운 한국어 구문 ‘둘러싸여 있을 때’로 처리했습니다.
- source_word: τὰ πάντα
  english_pob_choice: all things
  chosen_korean: 모든 것
  alternatives_korean:
  - 만물이
  - 온갖 것들
  - 전부
  lexicon: LSJ
  rationale: 범위를 넓게 포괄하는 표현이므로 ‘모든 것’이 원문의 포괄성을 가장 직접적으로 살립니다. 의인화하거나 세계로 좁히지 않았습니다.
- source_word: ἐν ἰδίῳ τάχει
  english_pob_choice: in its swift course
  chosen_korean: 자기만의 빠른 속도로
  alternatives_korean:
  - 자기 고유의 속도로
  - 자기 빠름으로
  - 자기만의 신속함으로
  lexicon: LSJ
  rationale: 직역하면 ‘자기 자신의 속도 안에서’이지만, 한국어에서는 ‘속도’가 자연스럽고 원문의 자기-귀속성을 살리기 위해 ‘자기만의 빠른 속도’로 옮겼습니다.
- source_word: μεσαζούσης
  english_pob_choice: was halfway gone / was halfway through
  chosen_korean: 중간에 이르렀을 때
  alternatives_korean:
  - 한가운데에 있었을 때
  - 절반쯤 지나갔을 때
  - 정중간에 이르렀을 때
  lexicon: LSJ
  rationale: 이 분사는 밤이 ‘중간에 있는 상태’를 가리키므로, ‘한밤중’처럼 해석을 고정하지 않고 ‘중간에 이르렀을 때’로 압축된 시적 표현을 살렸습니다.
theological_decisions:
- issue: 압축된 시적 그리스어의 처리
  chosen_reading: 문장 구조를 유지하되 한국어에서는 자연스러운 시간 절로 풀어, 밤이 한가운데에 이른 순간을 드러냈습니다.
  alternative_readings:
  - 직역하여 ‘밤이 자기만의 빠른 속도 안에서 중간에 있을 때’
  - 의미를 풀어 ‘밤이 한창 지나고 있을 때’
  rationale: 이 절은 시적 압축이 매우 강하므로, 과도한 직역은 한국어 가독성을 해치고 과도한 의역은 이미지를 약화시킵니다. 따라서 원문의 긴장과 시간을 함께 보존하는 중간 해법을 택했습니다.
  doctrine_reference: 시적/서술적 문맥의 등가 번역 원칙
