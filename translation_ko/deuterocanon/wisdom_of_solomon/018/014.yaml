lexical_decisions:
- source_word: ἡσύχου ... σιγῆς
  english_pob_choice: a calm silence
  chosen_korean: 고요한 침묵
  alternatives_korean:
  - 평온한 침묵
  - 조용한 침묵
  - 잠잠한 침묵
  lexicon: LSJ
  rationale: 두 형용이 결합한 정적의 분위기를 한국어에서 가장 자연스럽고 시적으로 살리기 위해 ‘고요한 침묵’으로 옮겼습니다. ‘고요한’은 정서적 평온까지, ‘침묵’은 무음 상태를 분명히 드러냅니다.
- source_word: περιεχούσης
  english_pob_choice: encompassed
  chosen_korean: 둘러싸여 있을 때
