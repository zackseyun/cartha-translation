  rationale: 이 본문은 지혜서의 유대교적·출애굽적 맥락에 있으므로, 교회 제도적 뉘앙스를 피하고 원문 의미를 직접 드러내는 번역이 더 적절합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
- issue: τῆς θειότητος νόμον의 신학적 농도
  chosen_reading: ‘신적 법칙’으로 옮겨, ‘하나님의 율법’처럼 특정 정경적 법전으로 좁히지 않았습니다.
  alternative_readings:
  - 하나님의 법
  - 신성의 법
  - 경건의 법
  rationale: 원문은 ‘신성/신적 속성’에서 나온 규범성을 말하는 독특한 표현이므로, 의미를 지나치게 평준화하지 않고도 읽히는 형태를 유지하는 것이 좋습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
