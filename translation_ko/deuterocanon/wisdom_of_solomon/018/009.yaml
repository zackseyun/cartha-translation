base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/009.yaml
  text: For the holy children of good men were secretly offering sacrifices[a], and in unity they established the divine law, that the holy ones would share alike in the same good things and dangers[c][b], while their fathers were already singing beforehand hymns of praise.
  footnotes:
  - marker: a
    text: Or 'in secret.' The Greek κρυφῇ emphasizes that the sacrificial action was carried out covertly.
    reason: lexical_alternative
  - marker: b
    text: Or 'the law of divinity.' The phrase is unusual; 'the divine law' is chosen as the clearest English rendering of τὸν τῆς θειότητος νόμον.
    reason: lexical_alternative
  - marker: c
    text: Or 'the saints.' The Greek τοὺς ἁγίους more literally means 'the holy ones.'
    reason: alternative_reading
translation:
  language: ko
  text: 선한 이들의 거룩한 자녀들은 은밀히 제사를 드리며[a], 한마음으로[b] 신적 법을 정하여, 거룩한 이들이 같은 좋은 것들과 위험을 똑같이 함께 나누기로 하였습니다[c]. 그들의 아버지들은 이미 미리 찬양을 노래하고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘비밀리에’. 그리스어 κρυφῇ는 제사 행위가 드러나지 않게 이루어졌음을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘한뜻으로’. 그리스어 ἐν ὁμονοίᾳ는 공동체의 일치와 합의를 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘성도들’. 그리스어 τοὺς ἁγίους는 문자적으로 ‘거룩한 이들’을 뜻합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: κρυφῇ
  english_pob_choice: secretly
  chosen_korean: 은밀히
  alternatives_korean:
  - 몰래
  - 비밀리에
  lexicon: LSJ
  rationale: 부사적 용법으로 행위가 드러나지 않게 이루어졌음을 나타내므로, 현대 한국어에서도 자연스럽고 문맥의 은폐성을 살리는 ‘은밀히’가 적절합니다.
- source_word: ἐθυσίαζον
  english_pob_choice: were ... offering sacrifices
  chosen_korean: 희생제를 드리고
  alternatives_korean:
  - 제사를 드리고
  - 희생물을 바치고
  lexicon: LSJ
  rationale: 미완료 시상은 지속·반복된 행위를 시사하며, 제의적 의미를 분명히 하기 위해 ‘희생제를 드리고’로 옮겼습니다.
- source_word: ἐν ὁμονοίᾳ διέθεντο
  english_pob_choice: in unity they established
  chosen_korean: 한마음으로 신적 법칙을 세웠습니다
  alternatives_korean:
  - 한뜻으로 신적 법칙을 정했습니다
  - 화합 가운데 신적 법칙을 정했습니다
  lexicon: LSJ
  rationale: ὁμονοίᾳ는 공동체적 일치, διέθεντο는 상호적 합의에 따른 설정을 뜻하므로, ‘한마음으로… 세웠습니다’가 합의와 결속을 함께 살립니다.
- source_word: τὸν τῆς θειότητος νόμον
  english_pob_choice: the divine law
  chosen_korean: 신적 법칙
  alternatives_korean:
  - 신성의 법
  - 하나님의 법
  - 신적 율법
  lexicon: LSJ
  rationale: θειότης는 ‘신성/신적 속성’이고, νόμος는 율법보다 넓게 ‘법칙’까지 포함할 수 있어, 본문의 특이한 표현을 과도하게 신학화하지 않는 ‘신적 법칙’으로 옮겼습니다.
- source_word: τοὺς ἁγίους
  english_pob_choice: the holy ones
  chosen_korean: 거룩한 이들
  alternatives_korean:
  - 성도들
  - 성인들
  lexicon: LSJ
  rationale: 후대 교회 용어인 ‘성도’보다 원문 그대로의 의미를 드러내는 ‘거룩한 이들’이 문맥상 더 직접적입니다.
- source_word: προαναμελπόντων αἴνους
  english_pob_choice: singing beforehand hymns of praise
  chosen_korean: 미리 찬양의 노래를 불렀습니다
  alternatives_korean:
  - 미리 찬양을 노래했습니다
  - 앞서 찬송을 불렀습니다
  lexicon: LSJ
  rationale: προαναμελπόντων은 ‘미리’와 ‘노래하다’의 결합이고, αἴνους는 찬양/찬가를 뜻하므로, 두 요소를 함께 살려 ‘미리 찬양의 노래를 불렀습니다’로 옮겼습니다.
theological_decisions:
- issue: οἱ ἅγιοι의 번역에서 교회적 전문용어를 쓸지 여부
  chosen_reading: ‘거룩한 이들’로 옮겨, 후대 기독교의 고정된 ‘성도’ 용례를 피했습니다.
  alternative_readings:
