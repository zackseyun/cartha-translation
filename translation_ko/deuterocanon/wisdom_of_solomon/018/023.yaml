lexical_decisions:
- source_word: σωρηδόν ... πεπτωκότων ἐπʼ ἀλλήλων νεκρῶν
  english_pob_choice: For when heaps of dead had already fallen one upon another
  chosen_korean: 이미 죽은 자들이 무더기로 서로 위에 쓰러져 있을 때
