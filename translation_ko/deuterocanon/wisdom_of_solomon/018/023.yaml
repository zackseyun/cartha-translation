  text: 이미 죽은 자들이 서로 위에 겹겹이 쓰러져 있을 때, 그는 그 중간에 서서 진노를 막고 살아 있는 자들에게 이르는 길을 끊었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
