  lexicon: LSJ
  rationale: μεταξὺ στὰς는 단순히 ‘사이’가 아니라 두 집단 사이를 가로지르는 중재적 위치를 가리키므로, 간결하게 ‘한가운데’로 살렸습니다.
- source_word: ἀνέκοψεν τὴν ὀργὴν
  english_pob_choice: checked the wrath
  chosen_korean: 진노를 멈추게 하고
  alternatives_korean:
  - 진노를 막고
  - 분노를 억제하고
  lexicon: LSJ
  rationale: ἀνέκοψεν은 ‘되돌리다/멈추게 하다/저지하다’의 뜻으로, 문맥상 재앙의 진행을 중단시키는 뉘앙스를 한국어 동사구로 자연스럽게 옮겼습니다.
- source_word: διέσχισεν τὴν πρὸς τοὺς ζῶντας ὁδόν
  english_pob_choice: cut off the way to the living
  chosen_korean: 살아 있는 자들로 가는 길을 끊어 버렸습니다
  alternatives_korean:
  - 살아 있는 자들에게 이르는 길을 잘라 버렸습니다
  - 살아 있는 자들 쪽의 길을 차단했습니다
  lexicon: LSJ
  rationale: διέσχισεν은 ‘가로질러 잘라내다/절단하다’의 강한 동작을 지니므로, 재앙의 진로를 중단시키는 효과를 드러내는 ‘끊어 버리다’로 옮겼습니다.
