  rationale: σωρηδόν의 ‘무더기로’와 νεκρῶν의 ‘죽은 자들/시체들’ 이미지를 살리면서, 한국어에서 자연스러운 상태 서술로 옮겼습니다.
- source_word: μεταξὺ στὰς
  english_pob_choice: he stood in the midst
  chosen_korean: 그 한가운데 서서
  alternatives_korean:
