    reason: ‘사이에 서서’는 μεταξὺ στὰς의 위치 관계를, ‘갈라 놓으셨다’는 διέσχισεν의 문자적 ‘갈라지게 하다/절단하다’의 뉘앙스를 드러내는 번역 대안입니다.
