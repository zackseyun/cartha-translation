  text: For though they had disbelieved everything because of their sorceries[b][a], at the destruction of the firstborn they acknowledged that this people was God's son.
  footnotes:
  - marker: a
    text: Or 'magic arts.' The Greek term refers here to occult practices associated with Egypt.
    reason: lexical_alternative
  - marker: b
    text: That is, Israel is acknowledged corporately as God's son; the phrase is not an individual title here.
    reason: cross_reference
