  language: ko
  text: 그들은 주술 때문에 모든 것을 믿지 않았지만, 맏이들이 죽임을 당할 때에 이 백성이 하나님의 아들임을 인정하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 그리스어는 이집트와 관련된 주술적·마법적 행위를 가리킵니다. ‘마술’ 또는 ‘마법’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 이스라엘 전체가 하나님의 아들로 인정되었다는 뜻입니다. 여기서 이는 개인을 가리키는 칭호가 아닙니다.
    reason: cross_reference
