lexical_decisions:
- source_word: ὁμοία
  english_pob_choice: the same
  chosen_korean: 같은
  alternatives_korean:
  - 비슷한
  - 동일한
  lexicon: LSJ
  rationale: 뒤의 τὰ αὐτά와 함께 사회적 신분을 가로지르는 동일성을 강조하므로, 단순한 유사성보다 ‘같은’이 자연스럽습니다.
- source_word: δίκη
  english_pob_choice: punishment
  chosen_korean: 심판
  alternatives_korean:
  - 벌
  - 형벌
  - 정의
  lexicon: LSJ
  rationale: 이 문맥의 δίκη는 추상적 ‘정의’가 아니라 재앙 속에서 내려진 판결/심판을 가리키므로, 본문에는 ‘심판’을 두고 주석에서 대안 의미를 밝혔습니다.
- source_word: δοῦλος / δεσπότῃ
  english_pob_choice: slave / master
  chosen_korean: 종 / 주인
  alternatives_korean:
  - 노예 / 주인
  - 하인 / 주인
  - 종 / 주
  lexicon: BDAG; LSJ
  rationale: 원문은 종속 신분과 지배 신분의 대비가 핵심이지만, 지혜서의 문체에서는 ‘노예’보다 ‘종’이 문맥상 덜 거칠고 신분 대비도 유지합니다. δεσπότης는 관계적 대응인 ‘주인’이 가장 직접적입니다.
- source_word: δημότης
  english_pob_choice: commoner
  chosen_korean: 평민
  alternatives_korean:
  - 일반인
  - 시민
  - 백성
  lexicon: LSJ
  rationale: βασιλεύς와의 대조에서 왕권에 속하지 않은 일반 신분을 가리키므로, 사회적 계층 대비를 살리는 ‘평민’이 적절합니다.
- source_word: τὰ αὐτὰ πάσχων
  english_pob_choice: suffered the same things
  chosen_korean: 같은 일을 겪었습니다
  alternatives_korean:
  - 같은 것을 겪었습니다
  - 같은 고난을 당했습니다
  - 동일한 일을 겪었습니다
  lexicon: LSJ
  rationale: 원문의 반복적 평행구조를 살리되 한국어에서 자연스럽게 읽히도록 ‘같은 일을 겪었습니다’로 옮겼습니다. ‘고난’은 원문에 없는 해석을 더할 수 있어 피했습니다.
theological_decisions:
- issue: 사회적 신분 평준화의 표현 방식
  chosen_reading: ‘심판’과 ‘같은 일’로 옮겨, 신분 차이를 가리지 않는 하나님의 징벌적 개입을 드러냈습니다.
  alternative_readings:
  - ‘벌’을 중심으로 번역하기
  - ‘형벌’을 사용하기
  rationale: 이 절은 사회적 위계를 무너뜨리는 동일한 심판의 강도를 말하므로, 지나치게 완화된 표현보다 원문의 공적·역사적 긴장을 살리는 번역이 적절합니다.
  doctrine_reference: Wisdom of Solomon 18:11; Translation philosophy § North-star principle
