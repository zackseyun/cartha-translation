base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/005.yaml
  text: When they had resolved to kill the infants of the holy ones[a], and one child had been exposed and rescued[b], you took away their multitude of children as a rebuke and destroyed them all together in mighty water.
  footnotes:
  - marker: a
    text: The 'one child' likely alludes to Moses, who was exposed and then preserved alive (Exod 2:3–10).
    reason: cross_reference
  - marker: b
    text: Or 'in violent water' or 'in overwhelming water.' The Greek says literally 'in mighty water,' referring to the sea as the instrument of destruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 거룩한 이들의 아기들을 죽이기로 결의하고, 한 아이가 밖에 내버려졌다가 구출되었을 때[a], 당신께서는 책망으로 그들의 수많은 자녀를 빼앗으시고, 거센 물에서[b] 그들을 모두 한꺼번에 멸망시키셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘한 아이’는 밖에 내버려졌다가 구출된 모세를 암시할 가능성이 큽니다(출 2:3–10).
    reason: cross_reference
  - marker: b
    text: 또는 ‘강한 물에서’, ‘압도적인 물에서’. 헬라어는 문자적으로 ‘강한 물에서’라고 하며, 바다를 통한 멸망을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλευσαμένους
  english_pob_choice: had resolved
  chosen_korean: 결의했을 때
  alternatives_korean:
  - 결정했을 때
  - 의논하여 정했을 때
  - 모의했을 때
  lexicon: LSJ
  rationale: βουλεύομαι 계열의 ‘숙고 끝의 결의’를 살리기 위해 ‘결의하다’를 택했습니다. 단순한 즉흥적 결정보다 의도성과 책임감을 더 분명히 드러냅니다.
- source_word: τὰ τῶν ὁσίων ... νήπια
  english_pob_choice: the infants of the holy ones
  chosen_korean: 거룩한 이들의 아기들
  alternatives_korean:
  - 성도들의 아기들
  - 거룩한 사람들의 유아들
  - 경건한 자들의 아기들
  lexicon: LSJ
  rationale: ὅσιοι를 교회적 ‘성도’보다 원문에 가까운 ‘거룩한 이들’로 옮겼고, νήπια는 매우 어린 아이를 가리키므로 자연스러운 현대어로 ‘아기들’을 썼습니다.
- source_word: ἐκτεθέντος
  english_pob_choice: had been exposed
  chosen_korean: 드러나 버려졌다가
  alternatives_korean:
  - 내놓아졌다가
  - 버려졌다가
  - 노출되었다가
  lexicon: LSJ
  rationale: 이 동사는 갓난아기를 밖에 내놓는 ‘유기/노출’의 뜻을 가지므로, 한국어에서 그 관습적 의미가 살아나도록 ‘드러나 버려졌다가’로 옮겼습니다.
- source_word: σωθέντος
  english_pob_choice: rescued
  chosen_korean: 구해졌으며
  alternatives_korean:
  - 구원되었으며
  - 살려졌으며
  - 보존되었으며
  lexicon: LSJ
  rationale: 여기서는 신학적 ‘구원’보다 위기에서 건져냄의 뜻이 중심이므로 ‘구해지다’를 택했습니다.
- source_word: εἰς ἔλεγχον
  english_pob_choice: as a rebuke
  chosen_korean: 징계로
  alternatives_korean:
  - 책망으로
  - 꾸짖음으로
  - 경고로
  lexicon: LSJ
  rationale: εἰς ἔλεγχον의 문맥상 기능은 단순 비난이 아니라 심판적 책망입니다. 한국어로는 결과/목적성을 살린 ‘징계로’가 자연스럽고 강도를 유지합니다.
- source_word: ὁμοθυμαδόν
  english_pob_choice: all together
  chosen_korean: 한꺼번에
  alternatives_korean:
  - 일제히
  - 한마음으로
  - 동시에
  lexicon: LSJ
  rationale: 집단적·동시적 소멸을 강조하는 부사이므로, 유기적 번역으로 ‘한꺼번에’를 택했습니다.
- source_word: ἐν ὕδατι σφοδρῷ
  english_pob_choice: in mighty water
  chosen_korean: 거센 물속에서
  alternatives_korean:
  - 힘센 물속에서
  - 강한 물속에서
  - 맹렬한 물속에서
  lexicon: LSJ
  rationale: σφοδρός의 ‘강렬하고 거센’ 뉘앙스를 살리되, 한국어에서 자연스럽게 읽히도록 ‘거센 물속에서’로 옮겼습니다. 단수 ‘물’의 집합적 용법도 유지했습니다.
theological_decisions:
- issue: ‘한 아이가 드러나 버려졌다가 구해졌으며’의 지시 대상
  chosen_reading: 모세를 가리키는 암시를 유지하되, 본문 자체는 일반적인 ‘한 아이’로 두었습니다.
  alternative_readings:
  - 이스라엘의 어떤 아이에 대한 일반적 언급
  - 모세를 직접 명시하는 번역
  rationale: 원문은 특정 이름을 쓰지 않지만 출애굽기의 노출된 아이 이야기를 강하게 떠올리게 합니다. 번역은 그 암시를 보존하면서도 원문이 명시하지 않은 내용을 덧붙이지 않도록 했습니다.
  doctrine_reference: 원문 우선성과 암시적 상호본문성 보존
- issue: ‘거룩한 이들’의 번역
  chosen_reading: 교회 전통어 ‘성도’보다 원문에 가까운 ‘거룩한 이들’을 사용했습니다.
  alternative_readings:
  - 성도
  - 경건한 자들
  - 의인들
  rationale: ὅσιοι는 후대 교회 용어의 ‘성도’와 완전히 겹치지 않으므로, 문맥상 하나님의 거룩한 백성을 가리키는 일반적 표현으로 남겼습니다.
  doctrine_reference: 용어의 역사적 층위를 구분하는 원문 우선 번역
