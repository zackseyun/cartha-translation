  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 θραῦσις πλήθους를 ‘무리의 파괴’로 옮기면 한국어에서 다소 부자연스럽고, 누가 파괴하는지의 방향도 흐려집니다. ‘많은 사람이 파멸을 당했습니다’는 광야에서 다수가 입은 재앙이라는 원문의 의미를 자연스럽게 드러냅니다. 각주 표지도 해당 어구 바로 뒤에 놓아야 합니다.
  naturalness: ‘그러나’가 한 절 안에 두 번 반복되는 점과 ‘무리의 파괴가 일어났습니다’라는 명사구가 다소 경직된 점을 다듬었습니다. 합쇼체의 현대 표준어 문체를 유지했습니다.
  terminology: ‘의인’, ‘죽음의 시련’, ‘진노’는 원문의 종교적·문학적 어조와 의미 범위에 적절합니다. ἡ ὀργή에 소유자를 보태지 않고 ‘그 진노’로 유지하여 문맥상의 귀속을 본문이 명시하는 이상으로 확정하지 않았습니다.
