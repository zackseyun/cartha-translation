translation:
  language: ko
  text: 그러나 죽음의 시련도 의인들에게 미쳤고, 광야에서 무리의 파괴가 일어났습니다. 그러나 그 진노는 오래 머물지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죽음의 경험’ 또는 ‘죽음에 의한 시련’으로, ‘죽음의 시험’에 해당합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘무리의 붕괴’로, ‘무리의 파괴’에 해당합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἥψατο
  english_pob_choice: touched
  chosen_korean: 미쳤고
  alternatives_korean:
  - 닿았고
  - 건드렸고
  - 미쳤습니다
  lexicon: LSJ
  rationale: ἅπτομαι의 여기서는 ‘영향을 미치다/미치다’의 뜻을 살려, 의인들도 재앙의 영향권에 들어갔음을 자연스럽게 드러냅니다.
- source_word: πεῖρα θανάτου
  english_pob_choice: the testing of death
  chosen_korean: 죽음의 시련
  alternatives_korean:
  - 죽음의 시험
  - 죽음의 경험
  - 죽음의 시련의 경험
  lexicon: LSJ
  rationale: πεῖρα는 ‘시험/시련/경험’의 폭이 있으므로, POB의 ‘testing’에 맞춰 ‘시련’으로 옮겨 죽음이 가져온 가혹한 검증의 뉘앙스를 유지했습니다.
- source_word: δικαίων
  english_pob_choice: the righteous
  chosen_korean: 의인들에게
  alternatives_korean:
  - 의로운 사람들에게
  - 의인들
  - 의로운 이들에게
  lexicon: LSJ
  rationale: 실질명사적 복수형을 한국어에서는 목적격 구문으로 풀어 ‘의인들에게’라고 옮겨, 대상이 단수 집합이 아니라 공동체적 복수임을 보존했습니다.
- source_word: θραῦσις
  english_pob_choice: a breaking
  chosen_korean: 파괴
  alternatives_korean:
  - 부서짐
  - 깨짐
  - 산산이 부서짐
  lexicon: LSJ
  rationale: 문맥상 광야에서의 대규모 재앙을 가리키므로, 단순 물리적 ‘부서짐’보다 피해의 결과를 드러내는 ‘파괴’를 택했습니다.
theological_decisions:
- issue: ἡ ὀργή의 주어를 명시할지 여부
  chosen_reading: 그 진노
  alternative_readings:
  - 하나님의 진노
  - 그분의 진노
  - 진노
  rationale: 그리스어는 소유격을 쓰지 않으므로, 본문이 직접 말하는 범위 안에서만 ‘그 진노’로 옮겨 하나님의 진노라는 해석은 문맥에 맡겼습니다.
  doctrine_reference: 원문 우선 원칙; 문맥이 제공하는 신적 귀속은 본문 밖에서 보충하지 않음
- issue: θραῦσις를 얼마나 강하게 번역할지
  chosen_reading: 무리의 파괴
  alternative_readings:
  - 무리의 붕괴
  - 무리의 깨짐
  - 무리의 산산이 부서짐
  rationale: 의인과 대비되는 ‘무리’의 대규모 심판을 드러내되, 본문이 말하는 파괴의 정도를 과장하지 않도록 절제된 표현을 택했습니다.
  doctrine_reference: 심판 서술의 긴장 보존
