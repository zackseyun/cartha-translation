lexical_decisions:
- source_word: Ἥψατο
  english_pob_choice: touched
  chosen_korean: 미쳤고
  alternatives_korean:
  - 닿았고
  - 건드렸고
  - 미쳤습니다
  lexicon: LSJ
  rationale: ἅπτομαι의 여기서는 ‘영향을 미치다/미치다’의 뜻을 살려, 의인들도 재앙의 영향권에 들어갔음을 자연스럽게 드러냅니다.
- source_word: πεῖρα θανάτου
  english_pob_choice: the testing of death
  chosen_korean: 죽음의 시련
  alternatives_korean:
  - 죽음의 시험
  - 죽음의 경험
  - 죽음의 시련의 경험
  lexicon: LSJ
  rationale: πεῖρα는 ‘시험/시련/경험’의 폭이 있으므로, POB의 ‘testing’에 맞춰 ‘시련’으로 옮겨 죽음이 가져온 가혹한 검증의 뉘앙스를 유지했습니다.
- source_word: δικαίων
  english_pob_choice: the righteous
  chosen_korean: 의인들에게
  alternatives_korean:
  - 의로운 사람들에게
  - 의인들
  - 의로운 이들에게
  lexicon: LSJ
  rationale: 실질명사적 복수형을 한국어에서는 목적격 구문으로 풀어 ‘의인들에게’라고 옮겨, 대상이 단수 집합이 아니라 공동체적 복수임을 보존했습니다.
- source_word: θραῦσις
  english_pob_choice: a breaking
  chosen_korean: 파괴
  alternatives_korean:
  - 부서짐
  - 깨짐
  - 산산이 부서짐
  lexicon: LSJ
  rationale: 문맥상 광야에서의 대규모 재앙을 가리키므로, 단순 물리적 ‘부서짐’보다 피해의 결과를 드러내는 ‘파괴’를 택했습니다.
