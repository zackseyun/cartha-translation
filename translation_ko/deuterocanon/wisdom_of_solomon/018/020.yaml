  doctrine_reference: 원문 우선 원칙; 문맥이 제공하는 신적 귀속은 본문 밖에서 보충하지 않음
- issue: θραῦσις를 얼마나 강하게 번역할지
  chosen_reading: 무리의 파괴
  alternative_readings:
