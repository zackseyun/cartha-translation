base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/003.yaml
  text: Instead of these things[a], you provided a pillar blazing with fire, both as a guide for an unknown journey and as a harmless sun for their honored exile.
  footnotes:
  - marker: a
    text: Or 'for a noble sojourn in a foreign land.' The Greek φιλοτίμου ξενιτείας is difficult and may emphasize the dignity of Israel's life abroad rather than exile in a strictly negative sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 이러한 것들[a] 대신, 당신은 불타오르는 기둥을 주셨습니다. 그것은 알지 못하는 여정을 위한 길잡이이자, 그들의 존귀한 나그네살이를 위한 해를 해치지 않는 햇볕이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '고귀한 외국 땅에서의 체류를 위한.' 그리스어 φιλοτίμου ξενιτείας는 해석이 어려우며, 엄밀한 의미의 유배라기보다 이스라엘의 타지 생활의 존엄을 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθʼ ὧν
  english_pob_choice: Instead of these things
  chosen_korean: 이러한 것들 대신
  alternatives_korean:
  - 그에 대한 보답으로
  - 그 대신
  lexicon: LSJ
  rationale: 앞절의 내용과 대조되는 보상 관계를 한국어로 간명하게 살리되, 구체적 대상을 불필요하게 풀어 쓰지 않았습니다.
- source_word: πυριφλεγῆ στῦλον
  english_pob_choice: a pillar blazing with fire
  chosen_korean: 불타오르는 기둥
  alternatives_korean:
  - 불길에 타오르는 기둥
  - 불같이 타는 기둥
  lexicon: LSJ
  rationale: 기둥의 기능보다 형상을 살리는 표현으로, '불타오르는'이 πυριφλεγῆ의 강한 시각적 이미지를 자연스럽게 옮깁니다.
- source_word: ἀγνώστου ὁδοιπορίας
  english_pob_choice: for an unknown journey
  chosen_korean: 알지 못하는 여정을 위한
  alternatives_korean:
  - 낯선 여정을 위한
  - 미지의 길을 가는
  lexicon: LSJ
  rationale: 여정이 익숙하지 않고 아직 알지 못하는 길이라는 뜻을 유지하되, 현대 한국어에서 자연스러운 수식을 택했습니다.
- source_word: ἀβλαβῆ ἥλιον
  english_pob_choice: a harmless sun
  chosen_korean: 해를 해치지 않는 햇볕
  alternatives_korean:
  - 무해한 해
  - 해롭지 않은 햇볕
  lexicon: LSJ
  rationale: ἥλιον의 직역인 '해'를 살리면서도 한국어에서 '무해한 해'가 어색하므로, 원문의 대비 효과를 살릴 수 있는 '해를 해치지 않는 햇볕'으로 옮겼습니다.
- source_word: φιλοτίμου ξενιτείας
  english_pob_choice: their honored exile
  chosen_korean: 그들의 존귀한 나그네살이
  alternatives_korean:
  - 그들의 존귀한 외국 생활
  - 그들의 영예로운 유랑
  lexicon: LSJ
  rationale: ξενιτεία의 '타지에서의 삶/나그네살이' 의미를 살리면서, φιλοτίμου의 긍정적 평가를 '존귀한'으로 반영했습니다.
theological_decisions:
- issue: 광야 인도 이미지의 구체성 유지
  chosen_reading: 기둥과 해의 구체적 이미지를 살려 하나님의 인도와 보호를 드러냈습니다.
  alternative_readings:
  - '''빛으로 그들을 인도하는 것''처럼 추상화하는 번역'
  rationale: 이 구절은 출애굽의 광야 인도를 상기시키므로, 이미지의 구체성을 유지해야 본문이 지닌 구속사적 울림이 보존됩니다.
  doctrine_reference: Translation philosophy §§1, 6
- issue: ξενιτεία의 긍정적 뉘앙스
  chosen_reading: '''나그네살이''에 ''존귀한''을 붙여, 단순한 추방이 아니라 존엄이 부여된 타지 생활로 읽히게 했습니다.'
  alternative_readings:
  - '''유배'''
  - '''외국 땅에서의 체류'''
  rationale: 본문은 타향살이를 부정적으로만 말하지 않고, 하나님이 그것을 보호와 영광의 자리로 만드신다는 점을 드러냅니다.
  doctrine_reference: Translation philosophy §§1, 5
