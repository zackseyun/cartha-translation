base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/024.yaml
  text: For on the full-length robe was the whole world[a], and the glory of the fathers was on the engraving of the four-rowed stones[b], and your majesty was on the diadem upon his head.
  footnotes:
  - marker: a
    text: Or 'robe reaching to the feet.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'the engraving of the four-rowed stonework' likely alludes to the high priest's breastpiece with its stones arranged in four rows; the Greek expression is compact and somewhat difficult.
    reason: cultural_note
translation:
  language: ko
  text: 그 긴 옷에 온 세상이 있었고, 조상들의 영광이 네 줄로 된 돌의 새김 위에 있었으며, 당신의 위엄이 그의 머리 위의 관 위에 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘발까지 내려오는 옷’.
    reason: lexical_alternative
  - marker: b
    text: ‘네 줄로 된 돌의 새김’은 보석이 네 줄로 배열된 대제사장의 흉패를 가리키는 압축된 표현일 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
- source_word: ποδήρους ἐνδύματος
  english_pob_choice: full-length robe
  chosen_korean: 그 긴 옷
  alternatives_korean:
  - 발까지 내려오는 옷
  - 온몸을 덮는 옷
  lexicon: LSJ
  rationale: ποδήρης는 발까지 내려오는 긴 옷을 가리키므로, 현대 한국어에서는 ‘그 긴 옷’으로 자연스럽게 옮기되 길이의 이미지는 유지했습니다.
- source_word: ὅλος ὁ κόσμος
  english_pob_choice: the whole world
  chosen_korean: 온 세상
  alternatives_korean:
  - 온 세계
  - 온 우주
  lexicon: LSJ
  rationale: κόσμος의 우주적·세계적 함의를 살리면서도 과도하게 철학화하지 않도록 ‘온 세상’으로 옮겼습니다.
- source_word: πατέρων δόξα
  english_pob_choice: the glory of the fathers
  chosen_korean: 조상들의 영광
  alternatives_korean:
  - 족장들의 영광
  - 조상의 영화
  lexicon: LSJ
  rationale: δόξα의 높임말적 울림을 살리되, ‘fathers’를 한국어 성경에서 과도하게 특정 교리어로 좁히지 않기 위해 ‘조상들’로 옮겼습니다.
- source_word: ἐπὶ τετραστίχου λίθου γλυφῆς
  english_pob_choice: on the engraving of the four-rowed stonework
  chosen_korean: 네 줄로 된 돌의 새김 위에
  alternatives_korean:
  - 네 줄 돌장식의 새김 위에
  - 네 줄 돌세공의 새김 위에
  lexicon: LSJ
  rationale: 압축된 그리스어 표현이 보석이 네 줄로 배열된 흉패의 새김을 가리키는 점을 반영하면서, 한국어에서는 구조를 풀어 ‘네 줄로 된 돌의 새김’으로 자연스럽게 전달했습니다.
- source_word: διάδημα
  english_pob_choice: diadem
  chosen_korean: 관
  alternatives_korean:
  - 왕관
  - 머리띠
  lexicon: LSJ
  rationale: διάδημα는 왕권적 띠를 가리키지만, 한국어에서는 문맥상 제의적 머리 장식을 자연스럽게 살리는 ‘관’이 가장 무난합니다.
theological_decisions:
- issue: 고대 성막/대제사장 상징의 전달 방식
  chosen_reading: 이 절의 세계·조상·위엄 이미지를 구체적 성막 상징으로 확장 설명하지 않고, 그리스어가 직접 말하는 상징 연쇄를 그대로 보존했습니다.
  alternative_readings:
  - 출애굽기 28장의 흉패와 관을 명시적으로 풀어 설명하기
  - κόσμος를 ‘우주’로 옮겨 상징성을 강화하기
  rationale: 본문 자체는 상징을 암시하지만 배경 설명을 직접 말하지 않으므로, 독자가 원문의 응축된 이미지를 그대로 읽도록 두는 것이 가장 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
