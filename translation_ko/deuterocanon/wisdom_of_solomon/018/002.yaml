  lexicon: LSJ
  rationale: προ-가 나타내는 선행성과 전쟁/공격의 뉘앙스를 살려, 앞선 공격을 받았다는 의미를 자연스럽게 표현했습니다.
- source_word: εὐχαριστοῦσιν
