  lexicon: LSJ
  rationale: 주어진 문맥에서 감사의 행위를 나타내므로, 서술형으로 자연스럽게 '감사드렸고'를 택했습니다.
- source_word: τὸ διενεχθῆναι χάριν ἐδέοντο
  english_pob_choice: they begged pardon for their hostility
  chosen_korean: 서로의 적대에 대해 용서를 구했습니다
  alternatives_korean:
  - 그 사이의 차이에 대해 은혜를 구했습니다
  - 그들의 갈등에 대해 호의를 구했습니다
  lexicon: LSJ
  rationale: διενεχθῆναι는 단순한 차이보다 '서로 갈라져 있음/대립함'을 가리키므로, 관계적 적대성을 드러내는 한국어로 옮겼습니다.
