translation:
  language: ko
  text: 그들이 전에 공격을 받았으면서도, 자신들이 해를 입지 않았다고 감사했고, 서로의 적대에 대해 용서를 구했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 그리스어는 전승상 난해하며, 특히 ‘해치다’와 관련된 형식이 문맥상 매끄럽지 않습니다. 이 번역은 문맥에서 가장 그럴듯한 의미, 곧 이전의 적대가 감사와 용서 요청으로 바뀌는 흐름을 따릅니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘그들의 관계의 차이/갈등에 대해 은혜를 구했다’로 볼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ οὐ βλάπτοντιν
  english_pob_choice: they were not being harmed
  chosen_korean: 자신들이 해를 입지 않았다고
