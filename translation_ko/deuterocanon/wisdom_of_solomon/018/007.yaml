  source_fidelity: 그리스어는 ‘당신의 백성에게/당신의 백성에 의해 의인들의 구원은, 원수들의 멸망은 기대되었다’라는 대조적 병렬을 이룹니다. 초안의 핵심 의미는 충실하지만, ‘그리하여’는 본절 그리스어에 없는 접속적 추론을 더합니다. ‘원수들의 멸망’은 ἐχθρῶν의 속격과 문맥상 관계를 자연스럽게 반영합니다.
  naturalness: ‘당신의 백성은 … 기대하였습니다’는 현대 표준어 합쇼체 서술로 자연스럽습니다. 각주 표지는 해당 어구에 직접 붙이는 편이 독자가 대안을 정확히 알 수 있어 더 낫습니다.
  terminology: ‘백성’, ‘의인’, ‘구원’, ‘멸망’은 성서적 문맥과 한국어 관용에 맞고, 구원과 심판의 병렬도 보존합니다.
