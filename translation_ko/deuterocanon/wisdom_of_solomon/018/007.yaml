    text: ‘구원’은 여기서 ‘구출’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεδέχθη
  english_pob_choice: expected
  chosen_korean: 기대하였습니다
  alternatives_korean:
  - 기다렸습니다
  - 기대하였습니다
  - 받아들였습니다
  lexicon: LSJ
  rationale: προσδέχομαι는 ‘기다리다, 기대하다, 받아들이다’의 뜻이 있어, 본문 맥락의 능동적 기다림을 살려 ‘기대하였습니다’로 옮겼습니다.
- source_word: λαοῦ σου
  english_pob_choice: your people
  chosen_korean: 당신의 백성
  alternatives_korean:
  - 주님의 백성
  - 당신의 ժողովուրդ
  - 당신의 민족
  lexicon: LSJ
  rationale: λαός는 언약적 공동체를 가리키는 ‘백성’이 자연스럽고, 하나님께 직접 말하는 형식을 한국어에서도 분명히 드러냅니다.
- source_word: σωτηρία
  english_pob_choice: salvation
  chosen_korean: 구원
  alternatives_korean:
  - 구해 주심
  - 구원
  - 구출
  lexicon: LSJ
  rationale: 이 절은 역사적 구출을 말하지만, 종교적·구속사적 무게를 고려해 한국어에서는 ‘구원’이 가장 안정적으로 대응합니다.
- source_word: δικαίων
  english_pob_choice: the righteous
  chosen_korean: 의인들의
  alternatives_korean:
  - 의로운 사람들의
  - 의로운 자들의
  - 정의로운 사람들의
  lexicon: LSJ
  rationale: δικαίων은 ‘의로운 자들’이지만, 한국어 성서 문맥에서는 ‘의인’이 간결하고 관용적입니다.
- source_word: ἀπωλία
  english_pob_choice: destruction
  chosen_korean: 멸망
  alternatives_korean:
  - 파멸
  - 파괴
  - 멸절
  lexicon: LSJ
  rationale: ἀπωλία는 심판의 결과로서의 멸망/파멸을 뜻하므로, 대조 구조를 살리는 ‘멸망’이 가장 직접적입니다.
theological_decisions:
- issue: 구원과 심판의 병렬 대비를 어떻게 유지할지
  chosen_reading: 의인들의 구원과 원수들의 멸망을 병렬로 놓아, 하나님의 구원과 심판이 동시에 기대된다는 긴장을 그대로 살렸습니다.
  alternative_readings:
  - 의인들의 구출과 원수들의 파멸
  - 의인들의 구원과 적들의 멸절
  rationale: μὲν...δὲ의 대조를 약화하지 않도록 두 결과를 모두 분명히 제시했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
