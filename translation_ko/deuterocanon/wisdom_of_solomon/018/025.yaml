base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/025.yaml
  text: The destroyer gave way before this man[a], and feared these things[c][b]; for the mere testing of wrath was sufficient.
  footnotes:
  - marker: a
    text: Or 'the destroying angel.' The Greek says simply 'the destroyer.'
    reason: alternative_reading
  - marker: b
    text: '''These things'' likely refers to the priestly tokens or memorial elements described in the previous verse, but the Greek leaves the referent implicit.'
    reason: cross_reference
  - marker: c
    text: Or 'trial,' 'proof,' or 'experience' of wrath for 'testing of wrath.' The Greek phrase is compressed and may mean that the mere proving-out of wrath was enough.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 사람 앞에서는 파괴자가 물러섰고, 이런 것들을 두려워하였으니, 진노를 시험하는 것만으로도 충분하였기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘파괴하는 천사’. 그리스어는 단순히 ‘파괴자’라고 말합니다.
    reason: alternative_reading
  - marker: b
    text: ‘이것들’은 앞 절에 묘사된 제사장적 표지나 기억의 요소들을 가리키는 것으로 보이지만, 그리스어는 그 지시 대상을 분명히 밝히지 않습니다.
    reason: cross_reference
  - marker: c
    text: ‘시험’, ‘증명’, ‘경험’으로도 옮길 수 있습니다. 그리스어 구문은 압축되어 있어, 진노가 시험되어 드러나는 의미를 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον
  english_pob_choice: this man
  chosen_korean: 이 사람
  alternatives_korean:
  - 이분
  - 이 사람에게
  lexicon: LSJ
  rationale: 문맥상 제사장 인물을 가리키는 지시사이므로, 한국어에서는 인격적 지시가 자연스러운 ‘이 사람’으로 옮겨 대상의 구체성을 살렸습니다.
- source_word: εἶξεν
  english_pob_choice: gave way before
  chosen_korean: 물러섰고
  alternatives_korean:
  - 양보했고
  - 비켜섰고
  - 물러났고
  lexicon: LSJ
  rationale: 파괴자가 대상 앞에서 압도되어 뒤로 물러나는 이미지를 살리면서도, 한국어에서 과도하게 해석되지 않는 동작으로 표현했습니다.
- source_word: ὀλοθρεύων
  english_pob_choice: the destroyer
  chosen_korean: 파괴자
  alternatives_korean:
  - 멸망시키는 자
  - 멸하는 자
  - 파괴하는 천사
  lexicon: LSJ
  rationale: 그리스어는 단순히 ‘파괴하는 자’라는 실질분사를 쓰므로, 본문이 명시하지 않은 ‘천사’를 본문에 넣지 않고 ‘파괴자’로 직역에 가깝게 옮겼습니다.
- source_word: πεῖρα τῆς ὀργῆς
  english_pob_choice: the mere testing of wrath
  chosen_korean: 진노를 시험하는 것
  alternatives_korean:
  - 진노의 시험
  - 진노의 증명
  - 진노의 체험
  lexicon: LSJ
  rationale: πεῖρα는 시험, 검증, 경험의 뜻을 아우르며, 여기서는 하나님의 진노가 실제로 드러나 작동한 시험을 가리키므로 ‘진노를 시험하는 것’으로 압축된 구조를 살렸습니다.
- source_word: ἱκανή
  english_pob_choice: sufficient
  chosen_korean: 충분하였기
  alternatives_korean:
  - 넉넉하였기
  - 족하였기
  - 충분했기
  lexicon: LSJ
  rationale: 문장 끝의 판단을 formal하게 마무리하는 말로 ‘충분하다’를 택해, 더 이상의 조치가 필요 없었다는 의미를 보존했습니다.
theological_decisions:
- issue: ὀλοθρεύων의 구체화 여부
  chosen_reading: 본문에는 단순히 ‘파괴자’라고 두고, ‘천사’는 넣지 않았습니다.
  alternative_readings:
  - 멸망시키는 천사
  - 파괴하는 천사
  rationale: 그리스어 자체는 실질분사만 제시하며, 영어 POB도 ‘destroying angel’을 대안으로만 두었습니다. 따라서 본문은 해석을 앞서지 않도록 더 일반적인 표현을 유지했습니다.
  doctrine_reference: 본문의 긴장을 보존하고, 해석적 구체화는 주석으로 남깁니다.
- issue: πεῖρα τῆς ὀργῆς의 의미 범위
  chosen_reading: ‘진노를 시험하는 것’으로 두어, 진노의 실제 작동과 검증의 뉘앙스를 함께 살렸습니다.
  alternative_readings:
  - 진노의 시험
  - 진노의 체험
  - 진노의 증명
  rationale: 영어 POB가 ‘testing / trial / proof / experience’의 가능성을 열어 두었으므로, 한국어도 단일 개념으로 과도하게 좁히지 않고 압축된 표현을 유지했습니다.
  doctrine_reference: 표현의 압축성과 다의성을 보존합니다.
