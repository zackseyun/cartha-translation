  source_fidelity: ‘진노를 시험하는 것’은 πεῖρα τῆς ὀργῆς의 속격 관계를 ‘진노를 대상으로 시험함’으로 지나치게 한정합니다. 그리스어의 압축된 표현은 ‘진노의 시험/시련’, ‘진노를 겪음’, ‘진노의 증명’ 등의 여지를 남깁니다. ‘진노의 시험’으로 고쳐 이 범위를 보존하는 것이 안전합니다. 또한 ἐφοβήθησαν은 복수형이나, 주어진 본문과 영어 감사 기록 모두 그 주어의 문법적 긴장을 해소하지 않고 ‘파괴자’가 ‘이것들’을 두려워한 것으로 옮깁니다. 한국어 본문도 그 번역 방향을 따르되, 주석에서 지시 대상의 불명확성만 설명합니다.
