  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/019.yaml
  text: For the dreams that troubled them foretold this[b][a], so that they might not perish without knowing why they were suffering.
  footnotes:
  - marker: a
    text: Or 'gave advance warning of this.' The Greek verb can carry the sense of signaling something beforehand as a warning.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'because of what they suffer badly,' that is, 'why they were suffering badly.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들을 불안하게 한 꿈들이 이것을 미리 알려 주었습니다. 이는 그들이 왜 심한 고통을 겪는지 알지 못한 채 멸망하지 않게 하려는 것이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이것을 미리 경고했다’라는 뜻입니다. 그리스어 동사는 어떤 일을 미리 알리거나 경고한다는 의미를 담을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들이 무엇 때문에 심한 고통을 겪는지’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ γὰρ ὄνειροι
  english_pob_choice: For the dreams
  chosen_korean: 그들의 마음을 어지럽힌 꿈들이
  alternatives_korean:
  - 꿈들이
  - 그들을 어지럽힌 꿈들이
  - 혼란스럽게 한 꿈들이
  lexicon: LSJ
  rationale: ὄνειροι는 문자 그대로 ‘꿈들’이며, 문맥상 그들에게 경고 역할을 하는 꿈이므로 ‘그들의 마음을 어지럽힌 꿈들’로 자연스럽게 풀어 의미를 드러냈습니다.
- source_word: θορυβήσαντες
  english_pob_choice: that troubled
  chosen_korean: 어지럽힌
  alternatives_korean:
  - 괴롭힌
  - 불안하게 한
  - 혼란시키는
  lexicon: LSJ
  rationale: θορυβέω는 단순한 놀람보다 마음의 동요·소란을 일으키는 뜻이 강하므로, 현대 한국어에서 그 정서를 살리는 ‘어지럽힌’을 택했습니다.
- source_word: τοῦτο προεμήνυσαν
  english_pob_choice: foretold this
  chosen_korean: 이것을 미리 알려 주었으니
  alternatives_korean:
  - 이것을 예고했으니
  - 이것을 미리 경고했으니
  - 이것을 미리 알렸으니
  lexicon: LSJ
  rationale: προμηνύω는 ‘미리 알리다/경고하다/예고하다’의 범위를 가지므로, 예언적 뉘앙스와 경고의 기능을 함께 담는 ‘미리 알려 주었다’가 가장 균형적입니다.
- source_word: ἵνα μὴ ἀγνοοῦντες διʼ ὃ κακῶς πάσχουσιν ἀπόλωνται
  english_pob_choice: so that they might not perish without knowing why they were suffering
  chosen_korean: 그들이 왜 고난을 당하는지 알지 못한 채 멸망하지 않게 하려는 것이었습니다
  alternatives_korean:
  - 그들이 왜 고난을 받는지 모른 채 죽지 않게 하려는 것이었습니다
  - 그들이 왜 고난을 겪는지 모른 채 망하지 않게 하려는 것이었습니다
  lexicon: Greek grammar
  rationale: ἵνα 목적절과 ἀγνοοῦντες의 분사구문을 자연스러운 한국어로 옮겨, ‘알지 못한 채’와 ‘왜 고난을 당하는지’로 원문의 인과를 분명히 했습니다.
- source_word: κακῶς πάσχουσιν
  english_pob_choice: they were suffering badly
  chosen_korean: 고난을 당하는지
  alternatives_korean:
  - 심하게 고통받는지
  - 악하게 고난받는지
  - 고난받는지
  lexicon: LSJ
  rationale: POB의 영어가 ‘suffering badly’의 강도를 남겨 두었으나, 한국어에서는 ‘고난을 당하다’가 자연스럽고, κακῶς의 부정적 강도는 전체 문맥과 ‘멸망’의 대비로 충분히 전달됩니다.
- source_word: ἀπόλωνται
  english_pob_choice: they might not perish
  chosen_korean: 멸망하지 않게
  alternatives_korean:
  - 망하지 않게
  - 죽지 않게
  - 파멸하지 않게
  lexicon: LSJ
  rationale: ἀπόλλυμι는 단순한 죽음보다 파멸·멸망의 의미가 강하므로, 지혜서의 문학적·신학적 긴장을 살리는 ‘멸망하다’를 사용했습니다.
theological_decisions:
- issue: '꿈의 기능: 경고인가, 단순한 예고인가'
  chosen_reading: 꿈들은 해를 입는 자들에게 다가올 일을 미리 알리는 경고이자 예고로 제시됩니다.
  alternative_readings:
  - 단순한 사건 예고로만 읽을 수 있습니다.
  - 불길한 징조에 가깝게 읽을 수도 있습니다.
  rationale: προεμήνυσαν과 ἵνα 절이 함께 있어, 꿈은 사건을 알리는 데 그치지 않고 그들이 이유를 모른 채 멸망하지 않도록 하는 자비로운 경고의 기능을 합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
