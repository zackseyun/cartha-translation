  source_fidelity: 원문의 θορυβήσαντες는 꿈들이 ‘그들’을 동요시키거나 불안하게 했다는 뜻인데, 초안의 ‘그들의 마음을 어지럽힌’은 원문에 없는 ‘마음’을 보충합니다. 또한 κακῶς의 부정적·강조적 의미는 ‘고난을 당하다’만으로는 다소 약해질 수 있으므로 ‘심한 고통을 겪다’로 반영하는 것이 안전합니다. ἵνα 목적절과 ‘알지 못한 채 멸망하지 않게’라는 구조는 충실합니다.
