  chosen_reading: 본문의 직설을 유지하여, 조상들에게 미리 알려진 밤과 그들이 믿었던 맹세들을 연결하되, 그 맹세를 구체적 신학 용어로 확정하지 않았습니다.
  alternative_readings:
  - 그 밤이 조상들에게 미리 알려졌다는 뜻
