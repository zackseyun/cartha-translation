  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/006.yaml
  text: That night was made known beforehand to our fathers[a], so that, knowing with certainty the oaths in which they had trusted[c][b], they might be encouraged.
  footnotes:
  - marker: a
    text: Or 'was foreknown by our fathers.' The Greek verb can be rendered more literally this way, but in context it likely means that the night was disclosed to them beforehand.
    reason: lexical_alternative
  - marker: b
    text: Or 'our ancestors.' The Greek literally says 'our fathers.'
    reason: lexical_alternative
  - marker: c
    text: Or 'they might be encouraged' / 'they might be of good cheer.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 밤은 우리 조상들에게 미리 알려졌습니다[a]. 이는 그들이 확실히 알고 믿었던 그 맹세들[c][b]을 바탕으로, 용기를 내게 하려는 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 밤은 우리 조상들이 미리 알았다.’ 그리스어 동사는 더 문자적으로 이렇게 옮길 수도 있지만, 문맥상으로는 그 밤이 사전에 알려졌다는 뜻으로 보는 것이 더 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리 선조들.’ 그리스어는 문자적으로 ‘우리 아버지들’이라고 말합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그들이 격려를 받게 하려는 것이었습니다’ / ‘그들이 마음이 흡족해지게 하려는 것이었습니다.’
    reason: lexical_alternative
