  lexicon: LSJ
  rationale: 이 동사는 단순한 감정적 위로보다 ‘용기를 내다/북돋다’의 적극성을 띠므로, 목적절의 힘을 살린 표현을 택했습니다.
theological_decisions:
- issue: ‘우리 조상들’과 ‘맹세들’의 관계를 얼마나 구체화할 것인가
  chosen_reading: 본문의 직설을 유지하여, 조상들에게 미리 알려진 밤과 그들이 믿었던 맹세들을 연결하되, 그 맹세를 구체적 신학 용어로 확정하지 않았습니다.
  alternative_readings:
  - 그 밤이 조상들에게 미리 알려졌다는 뜻
  - 하나님의 구원 약속을 가리킨다는 해석
  rationale: 본문은 ‘맹세들’(ὅρκοις)을 그대로 유지하며, 그 대상의 범위를 과도하게 특정하지 않습니다. 번역도 그 긴장을 보존하는 것이 원문에 충실합니다.
  doctrine_reference: 원문 우선, 해석의 과잉 확정 지양
