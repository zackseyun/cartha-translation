translation:
  language: ko
  text: 그 사람들은 빛을 박탈당하고 어둠 속에 갇힐 만했으니, 곧 당신의 아들들을 가두어 두었던 자들입니다. 그들을 통해 율법의 썩지 않는 빛이 세상에 주어질 참이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어는 단수 αἰών을 사용합니다. 이는 ‘세상’ 또는 ‘영원한 시간/그 시대’로도 읽힐 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄξιοι μὲν γὰρ ἐκεῖνοι
  english_pob_choice: were worthy / deserved
  chosen_korean: '...만했으니'
  alternatives_korean:
  - '...마땅했으니'
  - '...받을 만했으니'
  lexicon: LSJ
  rationale: ἄξιοι는 이 문맥에서 단순한 자격이 아니라 심판에 합당한 응보를 가리키므로, 한국어에서는 자연스럽게 '...만했으니'로 옮겨 도덕적 판정을 살렸습니다.
- source_word: στερηθῆναι φωτός
  english_pob_choice: to be deprived of light
  chosen_korean: 빛을 박탈당하고
  alternatives_korean:
  - 빛을 빼앗기고
  - 빛이 없게 되고
  lexicon: LSJ
  rationale: στερέω의 수동형은 무엇을 '빼앗기다/박탈당하다'는 응보적 의미가 강하므로, 어둠의 형벌을 분명히 드러내는 표현을 택했습니다.
- source_word: φυλακισθῆναι σκότει
  english_pob_choice: imprisoned in darkness
  chosen_korean: 어둠 속에 갇히
  alternatives_korean:
  - 어둠 속에 수감되
  - 어둠에 갇히
  lexicon: LSJ
  rationale: φυλακίζω는 단순한 어둠이 아니라 감금의 이미지를 갖고 있어, '갇히다'로 처벌의 성격을 유지했습니다.
- source_word: τοὺς υἱούς σου ... διʼ ὧν
  english_pob_choice: your sons ... through whom
  chosen_korean: 당신의 아들들을 ... 그들을 통해
  alternatives_korean:
  - 당신의 아들들을 ... 그들로 말미암아
  - 당신의 아들들을 ... 이들을 통해
  lexicon: LSJ
  rationale: τοὺς υἱούς σου는 남성 복수 명사이므로 '아들들'을 유지했고, διʼ ὧν의 직접 선행사가 사람임을 살려 '그들을 통해'로 옮겼습니다.
- source_word: τὸ ἄφθαρτον νόμου φῶς
  english_pob_choice: the imperishable light of the law
  chosen_korean: 율법의 썩지 않는 빛
  alternatives_korean:
  - 율법의 불멸하는 빛
  - 율법의 썩지 아니할 빛
  lexicon: LSJ
  rationale: ἄφθαρτον은 도덕적 '순결'보다 '썩지 않음/부패하지 않음'의 지속성을 뜻하므로, 한국어에서도 물질적·존재론적 불멸성을 드러내는 표현을 택했습니다.
- source_word: τῷ αἰῶνι
  english_pob_choice: to the age
  chosen_korean: 세상에
  alternatives_korean:
  - 그 시대에
  - 그 시대를 향해
  - 영원히
  lexicon: LSJ
  rationale: αἰών은 '세상' 또는 '시대/세대'의 넓은 뜻을 가질 수 있으나, 한국어 본문은 문맥상 자연스러운 '세상에'로 두고, 해석의 여지를 주석으로 처리하는 편이 적절합니다.
