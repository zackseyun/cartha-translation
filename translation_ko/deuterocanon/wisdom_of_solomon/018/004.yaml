    text: 헬라어는 단수 αἰών을 사용합니다. 이는 ‘세상’ 외에 ‘시대’ 또는 ‘영원히’라는 뜻으로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄξιοι μὲν γὰρ ἐκεῖνοι
  english_pob_choice: were worthy / deserved
