    rationale: ‘그 사람들은 … 만했으니, 곧 … 자들입니다’는 과거 서술과 현재 종결이 혼재하며, 관계절 내용을 별도의 서술로 처리한 원문의 흐름을 매끄럽게 전달하지 못합니다.
  - severity: low
