  lexicon: LSJ
  rationale: φυλακίζω는 단순한 어둠이 아니라 감금의 이미지를 갖고 있어, '갇히다'로 처벌의 성격을 유지했습니다.
- source_word: τοὺς υἱούς σου ... διʼ ὧν
  english_pob_choice: your sons ... through whom
  chosen_korean: 당신의 아들들을 ... 그들을 통해
  alternatives_korean:
  - 당신의 아들들을 ... 그들로 말미암아
