- from: 그 사람들은 빛을 박탈당하고 어둠 속에 갇힐 만했으니, 곧 당신의 아들들을 가두어 두었던 자들입니다. 그들을 통해 율법의 썩지 않는 빛이 세상에 주어질 참이었습니다.[a]
