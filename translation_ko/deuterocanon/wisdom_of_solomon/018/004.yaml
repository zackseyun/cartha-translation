translation:
  language: ko
  text: 당신의 아들들을 가두어 두었던 그 사람들은 빛을 빼앗기고 어둠 속에 갇히는 것이 마땅했습니다. 율법의 썩지 않는 빛이 그 아들들을 통하여 세상에 주어지려 하고 있었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
