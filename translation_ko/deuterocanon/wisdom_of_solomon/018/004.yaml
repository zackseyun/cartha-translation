  lexicon: LSJ
  rationale: αἰών은 '세상' 또는 '시대/세대'의 넓은 뜻을 가질 수 있으나, 한국어 본문은 문맥상 자연스러운 '세상에'로 두고, 해석의 여지를 주석으로 처리하는 편이 적절합니다.
