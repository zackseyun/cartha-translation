  rationale: στερέω의 수동형은 무엇을 '빼앗기다/박탈당하다'는 응보적 의미가 강하므로, 어둠의 형벌을 분명히 드러내는 표현을 택했습니다.
- source_word: φυλακισθῆναι σκότει
  english_pob_choice: imprisoned in darkness
