base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/001.yaml
  text: But for your holy ones there was very great light[a]; hearing their voice but not seeing their form, since they indeed had not suffered the same things[b], they counted them blessed.
  footnotes:
  - marker: a
    text: Or 'saints' for 'holy ones.'
    reason: lexical_alternative
  - marker: b
    text: The Greek verb ἐπεπώθεισαν is difficult in context. Literally it often means 'had longed for,' but here it is taken in context to mean they had undergone or suffered the same things, which explains why they then counted them blessed.
    reason: alternative_reading
translation:
  language: ko
  text: 그런데 당신의 거룩한 이들에게는 매우 큰 빛이 있었습니다[a]. 그들의 목소리는 들으면서도 그들의 모습을 보지 못한 채, 그들이 참으로 같은 일을 겪지 않았으므로[b], 그들을 복되다고 여겼습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성도들’이라고도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 동사 ἐπεπώθεισαν은 문맥상 난해하며, 여기서는 같은 재앙이나 고난을 겪지 않았다는 뜻으로 이해했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῖς δὲ ὁσίοις σου
  english_pob_choice: for your holy ones
  chosen_korean: 당신의 거룩한 이들
  alternatives_korean:
  - 당신의 성도들
  - 당신의 경건한 이들
  lexicon: LSJ
  rationale: ὅσιοι는 하나님과의 관계 안에서 거룩하고 경건한 사람들을 가리키므로, 교회 제도적 뉘앙스가 강한 ‘성도들’보다 ‘거룩한 이들’이 원뜻을 더 직접적으로 살립니다.
- source_word: μέγιστον ἦν φῶς
  english_pob_choice: there was very great light
  chosen_korean: 매우 큰 빛이 있었습니다
  alternatives_korean:
  - 가장 큰 빛이 있었습니다
  - 지극히 큰 빛이 있었습니다
  lexicon: LSJ
  rationale: μέγιστον의 최상급 힘을 살리되, 한국어에서 자연스러운 표현으로 ‘매우 큰 빛’이라 옮겼습니다.
- source_word: μορφὴν δὲ οὐχ ὁρῶντες
  english_pob_choice: not seeing their form
  chosen_korean: 그들의 모습을 보지 못한 채
  alternatives_korean:
  - 그들의 형체를 보지 못한 채
  - 그들의 형상을 보지 못한 채
  lexicon: LSJ
  rationale: μορφή는 외형적 형상/모습을 가리키므로, 시각적 대조를 자연스럽게 드러내는 ‘모습’이 적절합니다.
- source_word: ἐπεπώθεισαν
  english_pob_choice: had not suffered the same things
  chosen_korean: 그들이 참으로 같은 일을 겪지 않았으므로
  alternatives_korean:
  - 그들이 참으로 같은 일을 당하지 않았으므로
  - 그들이 같은 고난을 겪지 않았으므로
  lexicon: LSJ
  rationale: 본문의 문맥상 이 동사는 ‘그들도 같은 일을 겪었다’는 뜻이 아니라, 대조되는 집단이 같은 재앙/고난을 겪지 않았음을 가리키는 것으로 이해하는 편이 자연스럽습니다.
- source_word: ἐμακάριζον
  english_pob_choice: they counted them blessed
  chosen_korean: 그들을 복되다고 여겼습니다
  alternatives_korean:
  - 그들을 복되다고 불렀습니다
  - 그들을 복이 있다고 여겼습니다
  lexicon: LSJ
  rationale: μακαρίζω는 ‘복되다/복되다고 여기다’는 평가 동사이므로, 판단의 의미를 살려 ‘복되다고 여겼습니다’로 옮겼습니다.
theological_decisions:
- issue: ‘거룩한 이들’의 번역 톤
  chosen_reading: 본문의 ὅσιοι는 일반적인 교회 호칭보다 하나님께 속한 거룩한 사람들을 지칭하는 표현으로 보고 ‘거룩한 이들’로 옮겼습니다.
  alternative_readings:
  - ‘성도들’로 옮겨 교회 전통 용어를 따르는 읽기
  - ‘경건한 이들’로 옮겨 도덕적 뉘앙스를 더하는 읽기
  rationale: 이 구절은 특정 교회 직분이나 후대 교회 용어보다, 하나님의 백성이라는 관계적·거룩성의 의미를 강조합니다.
  doctrine_reference: 구약-지혜문학의 성결/언약 백성 개념
