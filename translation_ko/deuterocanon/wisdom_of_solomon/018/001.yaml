review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 그리스어 본문에는 부정사(‘~하지 않았다’)가 없으며, ἐπεπώθεισαν은 ποθέω의 과거완료형으로 통상 ‘간절히 바랐었다/갈망했었다’를 뜻합니다. 이를 ‘같은 일을 겪지 않았다’로 번역하는 것은 원문의 어휘와 부정 여부를 모두 벗어납니다. 목적어가 명시되지 않은 난해함은 번역과 주석에서 보존해야 합니다.
  naturalness: 초안의 문장은 합쇼체로 대체로 자연스럽지만, 두 번째 문장의 분사구문이 가리키는 주어가 한국어에서 다소 흐립니다. ‘그들의 목소리는 들었지만 그 모습을 보지 못한 이들은’으로 정리하면 자연스럽고, 원문의 압축된 구문도 유지됩니다.
  terminology: ‘당신의 거룩한 이들’과 ‘복되다고 여겼습니다’는 적절합니다. μέγιστον의 최상급은 ‘매우 큰’보다 ‘지극히 큰’이 더 충실합니다. ‘성도들’은 가능한 대안이지만 본문에는 ‘거룩한 이들’을 유지하는 것이 안전합니다.
  issues:
  - severity: high
    issue: ἐπεπώθεισαν을 ‘같은 일을 겪지 않았으므로’로 번역함
    rationale: 제시된 그리스어에는 ‘같은 일을 겪다’라는 뜻도 부정어도 없습니다. ἐπεπώθεισαν은 ποθέω(갈망하다)의 과거완료형입니다. 문맥상 목적어와 정확한 연결이 난해하더라도, 번역이 원문에 없는 ‘같은 재앙/고난’ 및 부정을 보충해서는 안 됩니다.
  - severity: medium
    issue: μέγιστον의 최상급이 약화됨
    rationale: ‘매우 큰’도 자연스럽지만, μέγιστον은 최상급이므로 ‘지극히 큰’이 그 강조를 더 잘 반영합니다.
  - severity: low
    issue: 분사구문의 주어가 다소 불명확함
    rationale: 원문도 주어를 명시하지 않지만, 한국어에서는 ‘그 모습을 보지 못한 이들은’이라고 하면 뒤의 ‘그들을 복되다고 여겼습니다’의 주체가 더 분명해집니다.
  revised_text: 그러나 당신의 거룩한 이들에게는 지극히 큰 빛이 있었습니다[a]. 그들의 목소리는 들었지만 그 모습을 보지 못한 이들은, 그들 역시 간절히 바랐었으므로[b], 그들을 복되다고 여겼습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘성도들’이라고 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 ἐπεπώθεισαν은 ‘간절히 바랐었다/갈망했었다’라는 뜻의 동사입니다. 목적어가 명시되지 않고 문맥에서의 정확한 연결이 난해합니다. 일부 번역과 해석은 문맥에 따라 고난을 겪은 일과 관련지어 이해하지만, 제시된 그리스어 본문 자체에는 ‘겪다’라는 뜻이나 부정 표현이 없습니다.
    reason: alternative_reading
  revision_rationale: 원문이 난해한 ἐπεπώθεισαν을 해석적으로 ‘같은 일을 겪지 않았다’라고 확정한 부분을 제거했습니다. ‘간절히 바랐었으므로’는 ποθέω의 기본 의미와 과거완료의 선행성을 반영하며, 생략된 목적어와 문맥적 난해함은 각주로 밝혔습니다. 그 밖에는 원문의 대조, 청각과 시각의 대조, 그리고 μακαρίζω의 평가 의미를 보존했습니다.
