  rationale: 원문의 문법과 비유를 더 정확히 반영하도록 비교 표현을 동격 표현으로 고치고, ἀπότομος와 ἥλατο에 원문 이상으로 덧붙은 의미를 제거했습니다. 복수형 ‘하늘들’과 ‘보좌들’에 관한 주석 표지는 각각 해당 표현 뒤에 유지했습니다.
