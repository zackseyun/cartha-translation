lexical_decisions:
- source_word: ὁ παντοδύναμός σου λόγος
  english_pob_choice: your all-powerful word
  chosen_korean: 당신의 전능한 말씀
  alternatives_korean:
  - 당신의 전능하신 말씀
  - 당신의 전능한 말씀[Word]
  lexicon: LSJ
  rationale: παντοδύναμός는 하나님의 절대적 능력을 드러내므로 ‘전능한’으로 옮겼고, λόγος는 여기서 직접적으로 ‘말씀’으로 번역하되 후대의 그리스도론적 해석을 본문에 앞서지 않게 했습니다.
- source_word: ἀπʼ οὐρανῶν
  english_pob_choice: from heaven
  chosen_korean: 하늘에서
  alternatives_korean:
  - 하늘로부터
  - 하늘들로부터
  lexicon: LSJ
  rationale: 그리스어 복수형이지만 한국어 관용에서는 ‘하늘에서’가 자연스럽고, 하강의 방향성을 잘 살립니다.
- source_word: ἐκ θρόνων βασιλείων
  english_pob_choice: from royal thrones
  chosen_korean: 왕좌들에서
  alternatives_korean:
  - 왕좌들로부터
  - 왕의 보좌들에서
  lexicon: LSJ
  rationale: 본문의 복수성을 유지하기 위해 단수로 매끄럽게 하지 않고, ‘왕좌들’로 옮겨 왕권의 자리라는 이미지를 보존했습니다.
- source_word: ἀπότομος πολεμιστής
  english_pob_choice: a relentless warrior
  chosen_korean: 무자비한 전사
  alternatives_korean:
  - 냉혹한 전사
  - 가차 없는 전사
  - 엄한 전사
  lexicon: LSJ
  rationale: ἀπότομος는 심판 맥락에서 사정을 두지 않는 강한 공격성을 드러내므로 ‘무자비한’이 가장 직접적으로 그 긴장을 전달합니다. πολεμιστής는 현대 한국어에서 ‘전사’가 가장 자연스럽고 힘 있는 대응입니다.
- source_word: τῆς ὀλεθρίας γῆς
  english_pob_choice: the doomed land
  chosen_korean: 파멸의 땅
  alternatives_korean:
  - 멸망이 선고된 땅
  - 파괴된 땅
  - 멸망할 땅
  lexicon: LSJ
  rationale: ὀλέθριος는 ‘파멸/멸망에 이르는’ 의미이므로 결과를 압축해 ‘파멸의 땅’으로 옮겨 심판의 분위기를 살렸습니다.
- source_word: ἥλατο
  english_pob_choice: leaped
  chosen_korean: 뛰어내렸습니다
  alternatives_korean:
  - 뛰어들었습니다
  - 내달렸습니다
  - 솟아올랐습니다
  lexicon: LSJ
  rationale: 갑작스러운 도약의 동작을 살리면서, 하늘에서 지상으로의 급강하 이미지를 한국어에서 가장 생생하게 전달하는 동사로 선택했습니다.
theological_decisions:
- issue: λόγος를 대문자 ‘말씀’으로 처리할지 여부
  chosen_reading: 본문은 ‘말씀’으로 번역하되, 인격화된 존재로 단정하지는 않습니다.
  alternative_readings:
  - Word
  - 말씀(인격화된 존재)
  rationale: 그리스어는 단순히 λόγος를 말하며, 문맥상 하나님의 কার্য적 심판 명령을 의인화한 표현으로도 읽힙니다. 따라서 번역문은 해석을 앞서지 않고, 본문이 허용하는 긴장을 유지합니다.
  doctrine_reference: Translation philosophy §§1, 3
- issue: 전쟁 이미지를 얼마나 강하게 유지할지
  chosen_reading: ‘무자비한 전사’로 강하게 유지합니다.
  alternative_readings:
  - 엄한 전사
  - 가차 없는 전사
  rationale: 이 절은 심판의 폭력성과 긴박함을 의도적으로 그리므로, 한국어에서도 완화하지 않고 군사적 긴장을 분명히 드러냅니다.
  doctrine_reference: Translation philosophy §§1, 6
