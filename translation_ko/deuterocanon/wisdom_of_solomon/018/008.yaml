  text: For just as you punished the adversaries[a], so by this, having summoned us, you glorified us.
  footnotes:
  - marker: a
    text: Or 'having summoned us' or 'having invited us.' The Greek participle προκαλεσάμενος can carry the sense of calling or summoning, possibly with the nuance 'to oneself.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 마치 당신께서 적대자들을 벌하신 것과 같이, 이 일로 우리를 부르셔서 우리를 영화롭게 하셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원뜻은 ‘불러 모으신’ 또는 ‘당신께로 부르신’일 수 있습니다. 그리스어 분사 προκαλεσάμενος는 부르다, 소환하다, 초대하다의 뜻을 가질 수 있으며, 자기 쪽으로 부르는 뉘앙스를 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς γὰρ ἐτιμώρησας
  english_pob_choice: For just as you punished
  chosen_korean: 마치 당신께서 … 벌하신 것과 같이
  alternatives_korean:
  - 적대자들에게 보응하신 것처럼
  - 적대자들을 벌하신 것처럼
  lexicon: BDAG / LSJ
  rationale: ἐτιμώρησας는 단순한 처벌보다 보응·징벌의 뉘앙스가 있어, 현대 한국어에서는 ‘벌하셨습니다’로 간결하게 옮기되 비교 구조를 살려 ‘마치 … 것과 같이’로 처리했습니다.
- source_word: τοὺς ὑπεναντίους
  english_pob_choice: the adversaries
  chosen_korean: 적대자들
  alternatives_korean:
  - 대적자들
  - 원수들
  lexicon: LSJ
  rationale: ὑπεναντίους는 ‘맞서는, 적대하는’ 사람들을 가리키므로, 교회 용어화한 ‘원수들’보다 중립적이면서도 대립성을 유지하는 ‘적대자들’이 적절합니다.
- source_word: προκαλεσάμενος
  english_pob_choice: having summoned us / having invited us
  chosen_korean: 우리를 부르셔서
  alternatives_korean:
  - 우리를 소환하셔서
  - 우리를 불러 당신께로 모으셔서
  lexicon: LSJ
  rationale: 중간태 분사 προκαλεσάμενος는 단순한 호출보다 ‘자신에게로 부르다/불러 모으다’의 관계적 뉘앙스를 가질 수 있어, ‘부르셔서’로 옮겨 본문 흐름을 자연스럽게 살렸습니다.
- source_word: ἐδόξασας
  english_pob_choice: you glorified us
  chosen_korean: 우리를 영화롭게 하셨습니다
  alternatives_korean:
  - 우리를 영화롭게 하셨습니다
  - 우리를 높이셨습니다
  lexicon: BDAG
  rationale: δοξάζω는 단순 ‘칭찬하다’보다 영광을 부여하다의 의미가 강하므로, 한국어 성경 문체에서 익숙하면서도 의미를 보존하는 ‘영화롭게 하셨습니다’를 선택했습니다.
theological_decisions:
- issue: 부르심과 영화의 관계
  chosen_reading: 하나님의 벌하심과 백성을 부르심/영화롭게 하심이 대조적으로 연결된다는 점을 그대로 드러냈습니다.
  alternative_readings:
  - ‘불러 모으셔서’처럼 공동체적 소집을 더 분명히 드러내는 번역
  - ‘당신께로 부르셔서’처럼 관계적 방향을 더 강하게 드러내는 번역
  rationale: 그리스어 분사 προκαλεσάμενος의 정확한 뉘앙스는 문맥상 ‘부름’과 ‘소집’ 사이에 있어, 본문이 가진 긴장과 대조를 과도하게 특정하지 않고 한국어로도 읽히는 방식으로 남겼습니다.
  doctrine_reference: 'POB 원칙: 문맥이 허용하는 범위 안에서 긴장을 보존하고, 과도한 신학적 해석을 덧씌우지 않습니다.'
