translation:
  language: ko
  text: 그러나 원수들의 불협화음 같은 외침은 되울렸고, 자식들을 애도하는 처절한 탄식은 사방으로 퍼져 나갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '다른 번역 가능성: ‘애도받는 자식들의 애끊는 탄식이 사방으로 퍼져 나갔다.’ 그리스어 οἰκτρὰ διεφέρετο θρηνουμένων παίδων은 한국어 문장 구조를 조금 달리해도 같은 뜻을 유지합니다.'
    reason: lexical_alternative
