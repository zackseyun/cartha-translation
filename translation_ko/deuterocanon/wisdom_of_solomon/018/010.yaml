  rationale: 수동 분사 θρηνουμένων을 ‘애도받는’으로 분명히 옮겨 원문의 문법 관계를 회복했습니다. ἀσύμφωνος는 부자연스러운 ‘불협화음 같은’ 대신 ‘어긋난’으로 옮겼습니다. ‘때문에 터져 나온’은 탄식이 애도받는 자식들과 관련된 것이라는 뜻을 자연스럽게 드러내며, 본문이 자식들을 장자나 아들로 한정하지 않도록 유지합니다.
