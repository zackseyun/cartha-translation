  text: But the discordant cry of enemies echoed back[a], and the pitiful lament for children being mourned was carried abroad.
  footnotes:
  - marker: a
    text: Or 'the piteous cries of children being mourned spread abroad.' The Greek phrase οἰκτρὰ διεφέρετο θρηνουμένων παίδων can be rendered with slightly different English structuring while preserving the same sense.
