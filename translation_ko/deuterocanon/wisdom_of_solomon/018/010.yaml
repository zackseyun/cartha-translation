  source_fidelity: 첫 절의 ἀσύμφωνος는 ‘불협화음 같은’이라는 직유보다 ‘어긋난/조화롭지 않은’ 울부짖음으로 옮기는 편이 원문의 수식 관계와 한국어 표현에 충실합니다. 더 중요하게, θρηνουμένων παίδων은 수동 의미로 ‘애도받는 자식들’이며, 현 번역의 ‘자식들을 애도하는’은 자식들이 애도 행위의 주체인 듯 읽힐 수 있습니다.
