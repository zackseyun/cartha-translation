translation:
  language: ko
  text: 그러나 원수들의 어긋난 울부짖음은 되울렸고, 애도받는 자식들 때문에 터져 나온 처절한 탄식은 사방으로 퍼져 나갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '다른 번역 가능성: ‘애도받는 자식들에 대한 가엾은 탄식이 사방으로 퍼져 나갔다.’ 그리스어 οἰκτρὰ διεφέρετο θρηνουμένων παίδων은 ‘가엾은/처절한’ 탄식과 ‘애도받는 자식들’의 관계를 한국어에서 조금 다르게 구성하여 옮길 수 있습니다.'
    reason: lexical_alternative
