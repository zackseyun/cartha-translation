  - marker: b
    text: Or 'the sworn promises to the fathers.' The phrase recalls God's covenantal oaths to the patriarchs.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 몸의 힘으로도 무기의 위력으로도 그 무리를 이긴 것은 아니었고, 오히려 말로 그 벌하는 이를[a] 굴복시켰으며, 조상들에게 한 맹세들과 언약들을[b] 그에게 상기시켰습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘벌하고 있던 이’. 그리스어는 이것이 하나님인지, 멸하는 천사인지, 혹은 의인화된 심판의 힘인지 분명히 밝히지 않습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘조상들에게 한 맹세들과 언약들’. 이 표현은 조상들과 관련된 언약적 맹세를 떠올리게 합니다.
    reason: lexical_alternative
