theological_decisions:
- issue: ‘말씀으로’의 성격
  chosen_reading: 단순한 말이 아니라 판단을 멈추게 하는 권위 있는 선포로 읽히도록 '말씀'을 택했습니다.
  alternative_readings:
  - 말로
  - 한 말씀으로
  - 중보 기도로
  rationale: 본문은 무력과 무기와 대비되는 수단으로 λόγος를 제시하므로, 해설을 덧붙이지 않으면서도 권위적 발화를 살리는 번역이 필요합니다.
  doctrine_reference: 원문 우선; 본문이 허용하는 범위를 넘어 중보 기도 등으로 구체화하지 않음.
- issue: ‘그 벌하는 이’의 정체
  chosen_reading: 주체를 특정하지 않고 인격화된 징벌의 행위자로 남겨 두었습니다.
  alternative_readings:
  - 하나님
  - 멸망시키는 천사
  - 징벌하는 힘
  rationale: 그리스어 분사구는 명시적 지시 대상을 제시하지 않으므로, 본문의 긴장을 보존하는 것이 더 충실합니다.
  doctrine_reference: 문맥적 가능성은 남기되 본문 차원에서 확정하지 않음.
