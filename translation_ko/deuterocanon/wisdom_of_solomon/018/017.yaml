  lexicon: LSJ
  rationale: 문맥상 내적 동요와 공포를 강하게 일으키는 뜻이므로, 단순한 ‘방해하다’보다 체감되는 영향이 분명한 ‘괴롭혔고’를 택했습니다.
- source_word: φόβοι δὲ ἐπέστησαν ἀδόκητοι
  english_pob_choice: unexpected fears came upon them
  chosen_korean: 예상치 못한 두려움이 그들 위에 닥쳤습니다
  alternatives_korean:
  - 뜻밖의 두려움이 그들을 덮쳤습니다
  - 예기치 않은 공포가 그들에게 닥쳤습니다
  lexicon: LSJ
  rationale: ἐπέστησαν의 ‘닥치다/덮치다’라는 돌발적 도래를 살리기 위해 ‘그들 위에 닥쳤습니다’로 옮기고, ἀδόκητοι는 ‘예상치 못한’으로 직역보다 자연스럽게 표현했습니다.
