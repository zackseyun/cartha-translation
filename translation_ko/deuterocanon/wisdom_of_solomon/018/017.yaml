  rationale: φαντασίαι는 단순한 ‘환상’보다 현현적 이미지까지 아우를 수 있으므로, 꿈의 맥락을 유지하면서도 실제 유령을 단정하지 않는 ‘꿈의 무서운 환상들’로 옮겼습니다.
- source_word: ἐτάραξαν
