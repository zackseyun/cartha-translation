translation:
  language: ko
  text: 그러자 곧바로 꿈의 환상들[a]이 그들을 몹시 괴롭혔으며, 예기치 못한 두려움들이 그들에게 닥쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘환상들’(φαντασίαι)은 ‘나타남’, ‘현현’, ‘유령 같은 모습’, 또는 ‘꿈의 영상들’로도 옮길 수 있습니다. 여기서는 꿈과 관련된 형상이나 이미지를 가리키며, 실제 유령의 출현을 단정하지 않습니다.
    reason: lexical_alternative
