translation:
  language: ko
  text: 당신의 날카로운 칼—당신의 거짓 없음이 있는 명령—을 들고 서서, 그는 모든 것을 죽음으로 가득 채웠습니다. 그리고 그는 하늘에 닿아 있었고, 땅 위를 밟고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 진실한 명령’ 혹은 ‘당신의 거짓 없는 명령’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 헬라어는 심판 수행자가 하늘에 닿아 있으면서 땅 위에 서 있는 것으로 그려, 심판의 범위가 우주적임을 강조합니다.
    reason: cultural_note
lexical_decisions:
- source_word: ξίφος ὀξὺ
  english_pob_choice: your sharp sword
  chosen_korean: 당신의 날카로운 칼
  alternatives_korean:
  - 당신의 예리한 칼
  - 날카로운 칼
  lexicon: LSJ
  rationale: ξίφος는 칼/검 계열의 무기이고 ὀξύ는 그 예리함을 강조하므로, 한국어에서는 자연스러운 무기 이미지인 ‘칼’로 옮겨 긴박한 전투적 뉘앙스를 살렸습니다.
- source_word: ἀνυπόκριτον ἐπιταγήν σου
  english_pob_choice: your unfeigned command
  chosen_korean: 당신의 거짓 없음이 있는 명령
  alternatives_korean:
  - 당신의 진실한 명령
  - 당신의 꾸밈없은 명령
  - 당신의 성실한 명령
  lexicon: LSJ
  rationale: ἀνυπόκριτος는 ‘가식 없는, 거짓 없는’의 뜻이 강하므로, 단순히 ‘진실한’보다 성격을 더 직접 드러내는 ‘거짓 없음’으로 옮겼습니다. 명령의 성격을 수식하는 구조도 보존했습니다.
- source_word: στὰς
  english_pob_choice: standing
  chosen_korean: 들고 서서
  alternatives_korean:
  - 서서
  - 자리를 잡고 서서
  - 일어서서
  lexicon: LSJ
  rationale: 분사 στὰς는 이어지는 행위를 준비하는 자세를 나타내므로, 앞절의 ‘칼을 들고’와 자연스럽게 연결되는 ‘들고 서서’로 풀어 문맥의 장면성을 살렸습니다.
- source_word: ἐπλήρωσεν τὰ πάντα θανάτου
  english_pob_choice: he filled all things with death
  chosen_korean: 모든 것을 죽음으로 가득 채웠습니다
  alternatives_korean:
  - 만물을 죽음으로 채웠습니다
  - 온갖 것을 죽음으로 가득 채웠습니다
  lexicon: LSJ
  rationale: τὰ πάντα는 범위를 넓게 포괄하므로 ‘모든 것’으로 옮기고, θανάτου는 목적격적 내용으로 자연스럽게 ‘죽음으로’ 처리해 총체적 심판의 이미지를 보존했습니다.
- source_word: οὐρανοῦ μὲν ἥπτετο, βέβηκει δʼ ἐπὶ γῆς
  english_pob_choice: while he touched heaven, he had stepped upon the earth
  chosen_korean: 그는 하늘에 닿아 있었고, 땅 위를 밟고 있었습니다
  alternatives_korean:
  - 하늘에 닿고 있었고, 땅 위에 서 있었습니다
  - 하늘을 만지고 있었고, 땅을 밟고 있었습니다
  lexicon: LSJ
  rationale: ἅπτομαι는 ‘닿다/만지다’이고 βέβηκει는 발을 디뎌 선 상태를 가리키므로, 하늘과 땅을 가로지르는 초월적 장면을 한국어에서도 간결하게 드러내는 표현을 택했습니다.
