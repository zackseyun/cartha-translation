  to: 당신의 꾸밈없는 명령을 지닌 날카로운 칼이 서서 모든 것을 죽음으로 가득 채웠습니다. 그것은 하늘에 닿아 있었고, 땅 위에 발을 디디고 있었습니다.[a][b]
  rationale: 원문의 소유격 수식 관계를 회복하고, ἀνυπόκριτον을 자연스러운 현대 한국어로 옮겼습니다. ‘칼’을 문법적 주어로 명시하여 원문의 인격화된 전투 이미지와 앞 문맥의 모호성을 보존했으며, 하늘과 땅의 대비 및 βέβηκει의 이미 발을 디딘 상태를 더 정확히 반영했습니다. 각주 표지는 해당 어휘와 우주적 이미지가 포함된 문장 끝에 유지했습니다.
