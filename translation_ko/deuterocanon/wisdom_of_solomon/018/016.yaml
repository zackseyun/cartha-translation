  rationale: 이 구절 자체는 심판을 수행하는 존재를 묘사하지만, 본문 밖의 교리적 동일시를 요구하지는 않습니다. 따라서 원문의 긴장과 모호성을 그대로 보존하는 것이 적절합니다.
