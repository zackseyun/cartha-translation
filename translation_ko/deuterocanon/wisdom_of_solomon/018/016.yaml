  - severity: high
    issue: ‘당신의 거짓 없음이 있는 명령’은 비문에 가까운 부자연스러운 표현입니다.
    rationale: ἀνυπόκριτον은 명령의 성격을 수식하므로 ‘꾸밈없는 명령’ 또는 ‘진실한 명령’처럼 관형어로 옮겨야 합니다.
  - severity: medium
    issue: ‘땅 위를 밟고 있었습니다’는 이동·횡단의 뉘앙스를 낼 수 있습니다.
    rationale: βέβηκει ἐπὶ γῆς는 땅 위에 발을 디딘, 즉 확고히 선 상태를 가리킵니다. ‘땅 위에 발을 디디고 있었습니다’가 그 상태성과 전치사 ἐπί를 더 잘 반영합니다.
  revised_text: 당신의 꾸밈없는 명령을 지닌 날카로운 칼이 서서 모든 것을 죽음으로 가득 채웠습니다. 그것은 하늘에 닿아 있었고, 땅 위에 발을 디디고 있었습니다.[a][b]
