theological_decisions:
- issue: φθόνῳ τετηκότι의 관계와 οὗτος의 지시 대상
  chosen_reading: ‘시기’가 썩어 가는 상태로 묘사되며, 이어지는 ‘그’는 그 시기에 사로잡힌 인물을 가리키는 것으로 번역했습니다.
  alternative_readings:
  - ‘시기’ 자체가 주어가 되어 ‘그것’이 지혜에 참여하지 못한다고 읽을 수 있음
  - ‘시기와는 함께하지 않겠다’처럼 부패한 상태 자체를 강조할 수 있음
  rationale: 그리스어의 남성 지시대명사가 단순한 추상명사보다 인물화된 대상을 가리킬 가능성을 살리면서, 본문의 도덕적 논리를 흐리지 않도록 했습니다.
  doctrine_reference: 해석상의 긴장을 해소하기보다, 문맥이 허용하는 범위에서 인물과 악덕의 밀착을 함께 드러냅니다.
