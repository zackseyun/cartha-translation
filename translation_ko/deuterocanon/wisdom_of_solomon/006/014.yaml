base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/014.yaml
  text: Whoever rises early for her will not grow weary[b][a], for he will find her sitting beside his gates.
  footnotes:
  - marker: a
    text: Or 'Whoever seeks her early.' The Greek verb more literally refers to rising early, and by extension to eager early seeking.
    reason: lexical_alternative
  - marker: b
    text: The image is of personified Wisdom already present and waiting at the seeker's entrance.
    reason: cultural_note
translation:
  language: ko
  text: 그녀를 찾아 일찍 일어나는 사람은 지치지 않을 것입니다. 이는 그가 그녀가 그의 문들 곁에 앉아 있는 것을 발견할 것이기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀를 찾아 일찍 일어나는 사람.’ 헬라어 동사는 문자적으로 ‘일찍 일어나다’를 뜻하며, 문맥에서는 지혜를 부지런히 일찍 찾는다는 뜻도 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 지혜는 이미 그 자리에 와서 찾는 사람의 출입구 곁에서 기다리고 있는 모습으로 그려집니다.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ὀρθρίσας
  english_pob_choice: Whoever rises early
  chosen_korean: 그녀를 위해 일찍 일어나는 사람
  alternatives_korean:
  - 그녀를 일찍 찾는 사람
  - 일찍 일어나는 자
  lexicon: LSJ
  rationale: ὀρθρίζω는 문자적으로 ‘일찍 일어나다’의 뜻이므로, 행위의 초점이 드러나도록 ‘일찍 일어나는 사람’으로 옮겼습니다. ‘찾는’은 본문 의미를 설명적으로 풀어낸 것이어서 본문 어휘를 직접 반영하는 번역을 우선했습니다.
- source_word: ἐπ' αὐτὴν
  english_pob_choice: for her
  chosen_korean: 그녀를 위해
  alternatives_korean:
  - 그녀를 향해
  - 그녀를 위하여
  - 그녀에게
  lexicon: LSJ
  rationale: 전치사 ἐπί + 대격은 여기서 지향점과 목적을 함께 나타내므로, 지혜를 목표로 삼는 뜻을 살려 ‘그녀를 위해’로 옮겼습니다. 여성 인칭은 인격화된 지혜를 유지합니다.
- source_word: οὐ κοπιάσει
  english_pob_choice: will not grow weary
  chosen_korean: 지치지 않을 것입니다
  alternatives_korean:
  - 수고하지 않을 것입니다
  - 피곤해지지 않을 것입니다
  - 애쓰다가 지치지 않을 것입니다
  lexicon: LSJ
  rationale: κοπιάω는 ‘수고하다/지치다’의 범위를 가지며, 여기서는 찾는 행위가 헛수고나 탈진으로 끝나지 않는다는 뜻이 핵심이므로 자연스러운 결과 표현인 ‘지치지 않을 것입니다’를 택했습니다.
- source_word: πάρεδρον
  english_pob_choice: sitting beside
  chosen_korean: 곁에 앉아 있는
  alternatives_korean:
  - 곁에 있는
  - 시중들며 곁에 있는
  - 곁에 자리한
  lexicon: LSJ
  rationale: πάρεδρος는 ‘곁에 앉아 있는/대기하는’ 뜻이므로, 동작 이미지를 살려 ‘곁에 앉아 있는’으로 구체화했습니다. 이는 지혜가 이미 그 자리에 있다는 그림을 선명하게 전달합니다.
- source_word: τῶν πυλῶν αὐτοῦ
  english_pob_choice: his gates
  chosen_korean: 그의 문들
  alternatives_korean:
  - 그의 대문들
  - 그의 성문들
  - 그의 문지방
  lexicon: LSJ
  rationale: πύλη는 기본적으로 ‘문/문간’보다 ‘문들, 성문들, 대문들’의 넓은 प्रवेश구를 가리키므로, 과도하게 특정하지 않는 ‘그의 문들’로 옮겼습니다. 복수형도 그대로 반영했습니다.
theological_decisions:
- issue: 지혜의 여성 인칭 유지와 구도자의 일반적 남성 단수 유지
  chosen_reading: 지혜는 ‘그녀’로, 찾는 사람은 단수 남성 대명사 ‘그는/그의’로 유지했습니다.
  alternative_readings:
  - 지혜를 중성화하여 ‘그것’으로 옮김
  - 구도자를 성중립 단수로 바꿈
  rationale: 헬라어 본문은 지혜를 여성적으로 인격화하고, 구도자는 문법상 남성 단수 일반형을 사용합니다. 본문의 수사와 인격화를 흐리지 않도록 이를 그대로 살렸습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
