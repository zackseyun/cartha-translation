  text: because[a], though you were ministers of his kingdom, you did not judge rightly, nor keep the law[c][b], nor walk according to the counsel of God.
  footnotes:
  - marker: a
    text: Or 'servants' or 'officials' of his kingdom.' The Greek ὑπηρέται denotes subordinates serving under a higher authority; here it likely refers to rulers as functionaries under God's rule.
    reason: lexical_alternative
  - marker: b
    text: Or 'did not judge justly.'
    reason: lexical_alternative
  - marker: c
    text: Or 'according to God's purpose' or 'in line with the will of God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 그대들이 그분의 나라를 섬기는 이들이면서도[a] 올바르게 판결하지 않았고[b], 율법을 지키지 않았으며, 하나님의 계획을 따라 살아가지 않았기 때문입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘종들’ 또는 ‘관리들’의 뜻입니다. ὑπηρέται는 더 높은 권위 아래에서 봉사하는 부하를 가리키므로, 여기서는 통치자들을 하나님의 통치 아래에서 일하는 이들로 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘정의롭게 판결하지 않았고’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘하나님의 뜻에 따라’ 또는 ‘하나님의 의도와 일치하여’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπηρέται
  english_pob_choice: ministers
  chosen_korean: 시종들
  alternatives_korean:
  - 종들
  - 관리들
  - 하급자들
  lexicon: BDAG
  rationale: ὑπηρέται는 단순한 가사 노예보다 상위 권위 아래에서 일하는 부하·보좌·실무자를 가리키므로, ‘시종들’이 왕권 아래의 공적 종속성을 비교적 자연스럽게 드러냅니다.
- source_word: βασιλείας
