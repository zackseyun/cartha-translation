  lexicon: BDAG
  rationale: 여기서는 하나님의 왕적 지배 아래 있는 영역을 가리키므로, 한국어 성경에서 널리 쓰이는 ‘나라’가 문맥상 가장 자연스럽습니다.
- source_word: ἐκρίνατε ὀρθῶς
  english_pob_choice: did not judge rightly
  chosen_korean: 올바르게 판단하지도 않았고
  alternatives_korean:
  - 옳게 판단하지도 않았고
  - 정의롭게 판단하지도 않았고
  lexicon: BDAG
  rationale: ὀρθῶς는 ‘바르게/정확하게’의 뜻이 강하므로, 법정적 ‘정의롭게’보다 ‘올바르게’가 어휘의 직접성을 더 잘 살립니다.
- source_word: ἐφυλάξατε νόμον
  english_pob_choice: keep the law
  chosen_korean: 율법도 지키지 않았으며
  alternatives_korean:
  - 율법을 준수하지 않았으며
  - 법을 지키지 않았으며
  lexicon: BDAG
  rationale: νόμος는 이 문맥에서 일반 법보다 규범적·언약적 기준을 가리키므로 ‘율법’이 적절하며, φυλάσσω는 관용적으로 ‘지키다’가 가장 자연스럽습니다.
- source_word: κατὰ τὴν βουλὴν τοῦ θεοῦ
  english_pob_choice: according to the counsel of God
  chosen_korean: 하나님의 뜻에 따라
  alternatives_korean:
  - 하나님의 계획에 따라
  - 하나님의 의도에 따라
  - 하나님의 조언에 따라
  lexicon: BDAG
  rationale: βουλή는 ‘의도/계획/뜻’의 범위를 가지므로, 한국어에서 과도하게 기술적이지 않으면서도 문맥상 자연스러운 ‘뜻’으로 옮겼습니다.
- source_word: ἐπορεύθητε
  english_pob_choice: walk
  chosen_korean: 걸어가지도 않았으며
  alternatives_korean:
  - 행하지도 않았으며
  - 살아가지도 않았으며
  - 나아가지도 않았으며
  lexicon: BDAG
  rationale: πορεύομαι의 윤리적 은유를 살리기 위해 단순한 ‘행하다’보다 ‘걸어가다’를 택해, 삶의 방향성과 행보의 이미지를 보존했습니다.
theological_decisions:
- issue: 하나님의 나라를 섬기는 인간 통치자의 지위
  chosen_reading: 이 구절은 통치자들을 하나님의 나라 아래 있는 하위 기능인으로 묘사합니다.
  alternative_readings:
  - 모든 권위자를 일반적으로 지칭하는 것으로 볼 수 있습니다.
  rationale: 직전 문맥과 ὑπηρέται τῆς αὐτοῦ βασιλείας가 결합해, 권위의 근원이 아니라 위임된 종속성을 강조합니다. 번역도 그 긴장을 완화하지 않도록 했습니다.
  doctrine_reference: '원문 우선 원칙: 본문이 제시하는 권위의 종속성을 유지하고, 해석을 과잉 체계화하지 않습니다.'
