translation:
  language: ko
  text: 이는 그녀가 자신에게 합당한 이들을 찾아다니며, 길에서 그들에게 호의롭게 나타나고, 모든 생각에서 그들을 만나기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 계획에서’, ‘모든 의도에서’. 그리스어는 일반적인 생각을 가리킬 수도 있고, 형성된 목적을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς ἀξίους αὐτῆς
  english_pob_choice: those worthy of her
  chosen_korean: 자기에게 합당한 이들
  alternatives_korean:
  - 그녀에게 합당한 이들
  - 그녀의 자격에 맞는 이들
  - 그녀에게 마땅한 이들
  lexicon: LSJ
  rationale: ἀξίους는 ‘가치 있는, 합당한, 마땅한’의 뜻이므로 관계적 평가를 살려 ‘자기에게 합당한 이들’로 옮겼습니다.
- source_word: περιέρχεται ζητοῦσα
  english_pob_choice: goes about seeking
  chosen_korean: 찾아다니며
  alternatives_korean:
  - 두루 다니며 찾으며
  - 돌아다니며 찾으며
  - 찾아 구하며
  lexicon: LSJ
  rationale: 현재 진행의 동작성과 능동적 탐색을 함께 살리기 위해 ‘찾아다니며’로 간결하게 옮겼습니다.
- source_word: ἐν ταῖς τρίβοις
  english_pob_choice: on the paths
  chosen_korean: 길들에서
  alternatives_korean:
  - 길 위에서
  - 좁은 길에서
  - 오솔길에서
  lexicon: LSJ
  rationale: τρίβοι는 실제 길, 길목, 오솔길을 가리킬 수 있으므로 이미지의 구체성을 유지하면서도 자연스러운 복수 표현인 ‘길들에서’를 택했습니다.
- source_word: ἐν πάσῃ ἐπινοίᾳ
  english_pob_choice: in every purpose
  chosen_korean: 모든 생각에서
  alternatives_korean:
  - 모든 계획에서
  - 모든 의도에서
  - 모든 생각과 계획에서
  lexicon: LSJ
  rationale: ἐπινοία는 생각, 의도, 계획을 아우를 수 있으므로 의미 범위를 지나치게 좁히지 않도록 ‘모든 생각’으로 옮겼습니다.
theological_decisions:
- issue: 지혜의 인격화와 여성 대명사 유지
  chosen_reading: 지혜를 추상명사로 평탄화하지 않고, 본문의 여성적 인칭 표현을 따라 ‘그녀’와 그에 상응하는 동사구를 유지했습니다.
  alternative_readings:
  - 지혜가 ... 그것은 ...
  - 지혜는 ...
  rationale: 그리스어가 지혜를 여성형 인칭으로 지속적으로 묘사하므로, 문학적·신학적 의도를 보존하기 위해 인격적 표현을 그대로 살렸습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
