  text: For she goes about seeking those worthy of her[a], and graciously appears to them on the paths, and meets them in every purpose.
  footnotes:
  - marker: a
    text: Or 'in every plan' or 'in every intention.' The Greek can refer either to thought in general or to a formed purpose.
