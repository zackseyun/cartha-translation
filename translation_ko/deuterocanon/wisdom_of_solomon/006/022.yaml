base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/022.yaml
  text: But what wisdom is and how it came to be[a], I will declare, and I will not hide mysteries from you; rather, from the beginning of its origin I will trace it out, and I will set the knowledge of it in the open[b], and I will by no means pass by the truth.
  footnotes:
  - marker: a
    text: Or 'I will search it out from the beginning of its coming to be.' The Greek phrase is compact and can be rendered more explicitly with 'coming to be' for γενέσεως.
    reason: lexical_alternative
  - marker: b
    text: Or 'I will certainly not pass over the truth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 지혜가 무엇이며 그것이 어떻게 생겨났는지[a]를 나는 선포하겠습니다. 그리고 나는 여러분에게 신비들을 감추지 않겠습니다. 오히려 그 기원[b]의 처음부터 그것을 추적하여, 그것에 대한 지식을 드러내 놓고, 진리를 결코 지나치지 않겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것이 어떻게 존재하게 되었는지’라고 옮길 수 있습니다. 그리스어 표현은 압축적이어서 ‘생겨남/생겨옴’의 뉘앙스를 모두 담을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그것의 시작에서부터’라고 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: τί δέ ἐστιν σοφία
  english_pob_choice: what wisdom is
  chosen_korean: 지혜가 무엇이며
  alternatives_korean:
  - 지혜가 무엇인지
  - 지혜가 무엇인지가
  lexicon: LSJ
  rationale: 직접 질문 구조를 살리고, σοφία는 일관되게 ‘지혜’로 옮겼습니다.
- source_word: πῶς ἐγένετο
  english_pob_choice: how it came to be
  chosen_korean: 어떻게 생겨났는지
  alternatives_korean:
  - 어떻게 생겼는지
  - 어떻게 생겨나게 되었는지
  lexicon: LSJ
  rationale: γίνομαι의 ‘되어 가다/생겨나다’ 의미를 살리면서도 한국어에서 자연스럽고, 형이상학적 결론은 과도하게 덧붙이지 않도록 했습니다.
- source_word: ἀπαγγελῶ
  english_pob_choice: I will declare
  chosen_korean: 나는 선포하겠습니다
  alternatives_korean:
  - 나는 알리겠습니다
  - 나는 말하겠습니다
  lexicon: LSJ
  rationale: 단순 전달보다 공적인 선언의 어조가 있어 ‘선포하다’가 본문의 격식을 더 잘 반영합니다.
- source_word: μυστήρια
  english_pob_choice: mysteries
  chosen_korean: 신비들
  alternatives_korean:
  - 비밀들
  - 감추어진 것들
  lexicon: LSJ
  rationale: μυστήρια의 중량감을 살리기 위해 교리적 전통어인 ‘신비’보다도 강한 낱말을 유지했습니다.
- source_word: ἀπ' ἀρχῆς γενέσεως
  english_pob_choice: from the beginning of its origin
  chosen_korean: 그 기원의 처음부터
  alternatives_korean:
  - 그 생겨남의 처음부터
  - 그 시작의 처음부터
  lexicon: LSJ
  rationale: 겹친 ‘처음/기원’ 구조를 한국어에서 무리 없이 풀어, 원문의 소급적 탐구 이미지를 보존했습니다.
- source_word: ἐξιχνιάσω
  english_pob_choice: I will trace it out
  chosen_korean: 그것을 추적하여
  alternatives_korean:
  - 그것을 샅샅이 찾아내어
  - 그것을 조사하여
  lexicon: LSJ
  rationale: 발자취를 더듬듯 찾아간다는 뜻을 반영해 ‘추적하다’로 옮겼습니다.
- source_word: θήσω εἰς τὸ ἐμφανὲς τὴν γνῶσιν αὐτῆς
  english_pob_choice: I will set the knowledge of it in the open
  chosen_korean: 그것에 대한 지식을 드러내 놓고
  alternatives_korean:
  - 그것에 대한 지식을 공개하고
  - 그것에 대한 지식을 밝히고
  lexicon: LSJ
  rationale: 직역의 ‘놓다’보다 한국어 가독성이 나은 ‘드러내 놓다’를 택하되, γνώσις의 ‘지식’과 ἐμφανές의 ‘드러남/공개됨’을 함께 살렸습니다.
- source_word: οὐ μὴ παροδεύσω τὴν ἀλήθειαν
  english_pob_choice: I will by no means pass by the truth
  chosen_korean: 진리를 결코 지나치지 않겠습니다
  alternatives_korean:
  - 진리를 결코 지나쳐 버리지 않겠습니다
  - 진리를 결코 외면하지 않겠습니다
  lexicon: LSJ
  rationale: οὐ μή의 강한 부정을 한국어의 ‘결코’로 살리고, παροδεύω의 ‘지나쳐 가다’ 이미지를 유지했습니다.
theological_decisions:
- issue: 지혜의 기원에 대한 표현이 창조/영원성 논쟁으로 읽힐 가능성
  chosen_reading: ‘어떻게 생겨났는지’, ‘그 기원의 처음부터’로 옮겨 본문이 지혜의 기원을 말한다는 사실은 살리되, 창조되었다거나 영원하다는 교리적 결론은 번역문에 넣지 않았습니다.
  alternative_readings:
  - 어떻게 창조되었는지
  - 어떻게 존재하게 되었는지
  rationale: 이 구절만으로는 후대의 형이상학적 논쟁을 확정하지 않으므로, 본문의 긴장을 보존하는 번역이 필요합니다.
  doctrine_reference: 지혜의 기원에 대한 본문 긴장 보존
