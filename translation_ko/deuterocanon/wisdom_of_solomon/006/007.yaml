  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/007.yaml
  text: For the Master of all will not show partiality[a], nor will he be overawed by greatness; for he himself made both small and great[c][b], and he cares for all alike.
  footnotes:
  - marker: a
    text: Greek literally, 'will not show a face,' an idiom meaning to show partiality or favoritism.
    reason: lexical_alternative
  - marker: b
    text: Or 'the Sovereign of all.' The Greek title here is despotes, not kyrios.
    reason: lexical_alternative
  - marker: c
    text: Or 'he provides for all equally' / 'he exercises providence over all alike.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만물의 주인께서는[b] 편파적으로 대하지 않으시며[a], 위대함에 위축되지 않으십니다. 작은 이와 큰 이를 친히 만드셨고, 모든 이를 똑같이 돌보시기[c] 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 표현에는 문자적으로 ‘얼굴’이라는 말이 들어 있으며, 관용적으로는 편파성이나 편애를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘만물의 주권자’입니다. 여기의 그리스어는 κύριος가 아니라 δεσπότης입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘모든 이를 똑같이 돌보신다’ 또는 ‘모든 이에게 동등하게 섭리하신다’입니다.
