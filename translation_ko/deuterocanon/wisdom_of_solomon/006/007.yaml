  naturalness: ‘작은 이나 큰 이나 그분이 친히 만드셨고’는 조사와 문장 결속이 어색합니다. 또한 각주 표지는 해당 표현 가까이에 두는 것이 독자의 확인에 적절합니다. 나머지 문장은 현대 표준어 합쇼체로 자연스럽습니다.
