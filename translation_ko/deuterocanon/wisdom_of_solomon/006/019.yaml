  text: 그리고 썩지 않음은 하나님께 가까이 가게 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불멸이 하나님께 가까이 가게 합니다.’ ἀφθαρσία는 불멸뿐 아니라 부패하지 않음, 썩지 않음을 가리킬 수 있으므로, 여기서는 더 넓은 뜻을 살려 ‘썩지 않음’으로 옮겼습니다.
    reason: lexical_alternative
