review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. φρικτῶς는 심판자가 ‘두려워하는’ 상태가 아니라 듣는 이에게 공포를 일으키는 방식으로 닥침을 뜻합니다. 또한 ἐν τοῖς ὑπερέχουσιν은 ‘높은 자들 위에’라기보다 높은 지위에 있는 이들에게/그들 가운데서 심판이 일어남을 나타냅니다.
  naturalness: ‘두렵고도 신속하게 닥치실 것입니다’는 ‘그분이 두려움을 느끼며’ 닥친다는 뜻으로 읽힐 수 있고, ‘높은 자들 위에 임하기’는 한국어에서 부자연스럽습니다. 수정문은 현대 표준어 합쇼체에서 경고문의 엄숙한 어조를 유지합니다.
  terminology: κρίσις는 ‘심판’으로 유지하고, ἀπότομος는 문맥상 ‘가혹한’으로 옮겼습니다. ὑπερέχουσιν은 특정 직책으로 한정하지 않고 ‘높은 지위에 있는 이들’로 번역하여 원문의 범위를 보존했습니다.
  issues:
  - severity: medium
    issue: φρικτῶς를 ‘두렵고도’로 번역함
    rationale: 이 표현은 주어가 두려워하는 방식으로 해석될 여지가 있습니다. 원문은 그분의 도래가 무섭고 공포스럽다는 뜻이므로 ‘무섭고도’가 더 정확합니다.
  - severity: medium
    issue: ἐν τοῖς ὑπερέχουσιν γίνεται를 ‘높은 자들 위에 임하기’로 번역함
    rationale: ἐν은 여기서 높은 자들 ‘위에’라는 공간적 방향을 직접 나타내지 않습니다. 심판이 높은 지위의 사람들에게/그들 가운데서 일어난다는 뜻으로 옮겨야 자연스럽고 원문에 가깝습니다.
  revised_text: 그분은 여러분에게 무섭고도 신속하게 닥치실 것입니다[a]. 높은 지위에 있는 이들에게는 가혹한 심판이 있기 때문입니다.
