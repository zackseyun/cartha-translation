  - 권세 있는 자들에게는
  lexicon: κραταιός
  rationale: κραταιοῖς는 단순한 신체적 강함보다 ‘강한/강력한’ 사람들을 가리키므로, 문맥을 살려 ‘강한 자들’로 옮겼습니다.
- source_word: ἰσχυρὰ
  english_pob_choice: stern
  chosen_korean: 엄한
  alternatives_korean:
  - 준엄한
  - 가혹한
  - 강한
  lexicon: ἰσχυρός
  rationale: English POB의 stern에 맞추되, 한국어에서는 심문을 수식할 때 ‘엄한’이 판단의 엄정함을 가장 자연스럽게 드러냅니다.
- source_word: ἐφίσταται
  english_pob_choice: is coming
  chosen_korean: 닥칩니다
  alternatives_korean:
  - 다가옵니다
  - 임합니다
  - 내립니다
