  rationale: 이 동사는 어떤 것이 위에서 들이닥치듯 ‘닥치다’는 뉘앙스를 담으므로, 다가오는 심판성 상황을 살려 번역했습니다.
- source_word: ἔραυνα
  english_pob_choice: inquiry
  chosen_korean: 심문
  alternatives_korean:
  - 조사
  - 탐문
  - 심사
  lexicon: ἔραυνα
  rationale: ἔραυνα는 단순한 정보 수집보다 책임을 묻는 조사·심문에 가깝기 때문에, 강한 자들에게 임하는 엄정한 심판의 성격을 살려 ‘심문’으로 옮겼습니다.
theological_decisions:
- issue: the force of the statement about the mighty
  chosen_reading: 강한 자들은 단순히 유능한 사람이라기보다, 책임과 심판의 대상이 되는 힘 있는 자들로 이해했습니다.
  alternative_readings:
  - 능력 있는 사람들에 대한 일반적 경고
  - 세속 권력자들에 대한 직접적 경고
  rationale: 문맥상 지혜가 통치와 판단을 말하는 흐름에서, ‘강한 자들’은 힘을 가진 자들에게 더 큰 책임이 따른다는 경고로 읽는 것이 자연스럽습니다.
