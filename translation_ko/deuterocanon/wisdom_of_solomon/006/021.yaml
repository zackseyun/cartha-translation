  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/021.yaml
  text: Therefore[a], if you delight in thrones and scepters, O rulers of peoples, honor wisdom, so that you may reign forever.
  footnotes:
  - marker: a
    text: Or 'tyrants of peoples.' The Greek term can denote rulers generally, but in some contexts it carries a more negative sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 만일 여러분이 왕좌와 홀을 좋아하는 왕족들아, 백성들의 통치자들아, 지혜를 존중하십시오. 그러면 영원히 통치할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘백성들의 폭군들’. 헬라어 τύραννοι는 어떤 문맥에서는 통치자를 가리키지만, 다른 문맥에서는 더 부정적인 뜻을 띱니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥδεσθε
  english_pob_choice: you delight
  chosen_korean: 좋아하는
  alternatives_korean:
