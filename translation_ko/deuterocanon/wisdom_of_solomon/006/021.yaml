  lexicon: LSJ
  rationale: 권위의 상징인 정치적·왕권적 이미지를 유지하되, 한국어에서 자연스러운 한 쌍으로 들리도록 옮겼습니다.
- source_word: τύραννοι λαῶν
  english_pob_choice: rulers of peoples
  chosen_korean: 백성들의 통치자들
  alternatives_korean:
  - 백성들의 폭군들
  - 민족들의 통치자들
  - 백성들의 지배자들
  lexicon: LSJ
  rationale: τύραννοι가 문맥에 따라 부정적일 수 있지만, 이 구절은 훈계적 권고이므로 POB의 중립적 독해를 따라 통치자들로 옮겼습니다. λαῶν은 복수성을 살려 백성들의로 처리했습니다.
- source_word: τιμήσατε
  english_pob_choice: honor
  chosen_korean: 존중하십시오
  alternatives_korean:
  - 존경하십시오
  - 귀히 여기십시오
  - 명예롭게 여기십시오
  lexicon: LSJ
  rationale: 지혜를 단순히 감정적으로 좋아하라는 뜻이 아니라 마땅한 가치를 인정하고 높이라는 명령이므로, 공적·격식체에 맞게 존중하십시오로 옮겼습니다.
- source_word: εἰς τὸν αἰῶνα
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 한 시대 동안
  - 세세토록
  - 영세토록
  lexicon: LSJ
  rationale: 관용적 지속 기간을 자연스러운 현대 한국어로 옮겼습니다.
