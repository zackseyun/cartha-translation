  - 기뻐하는
  - 마음에 들어 하는
  lexicon: LSJ
  rationale: 지배 권력의 상징인 왕좌와 홀에 대한 강한 호감을 나타내므로, 현대 한국어에서 자연스럽고도 정서 강도를 살리는 표현으로 옮겼습니다.
