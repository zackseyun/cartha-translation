  - 명예롭게 여기십시오
  lexicon: LSJ
  rationale: 지혜를 단순히 감정적으로 좋아하라는 뜻이 아니라 마땅한 가치를 인정하고 높이라는 명령이므로, 공적·격식체에 맞게 존중하십시오로 옮겼습니다.
- source_word: εἰς τὸν αἰῶνα
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 한 시대 동안
  - 세세토록
  - 영세토록
  lexicon: LSJ
  rationale: 관용적 지속 기간을 자연스러운 현대 한국어로 옮겼습니다.
