  rationale: 권위의 상징인 정치적·왕권적 이미지를 유지하되, 한국어에서 자연스러운 한 쌍으로 들리도록 옮겼습니다.
- source_word: τύραννοι λαῶν
  english_pob_choice: rulers of peoples
  chosen_korean: 백성들의 통치자들
  alternatives_korean:
