translation:
  language: ko
  text: 그러므로 왕들이여, 들으시고[a] 깨달으십시오. 땅 끝의 재판관들이여, 배우십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘들으시고’는 단순히 소리를 듣는다는 뜻보다 주의 깊게 귀 기울이라는 요청을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘땅 끝의 재판관들’은 땅의 가장 먼 곳들에 이르기까지의 재판관들을 부르는 성경적 표현으로, 경고의 보편적 범위를 드러냅니다.
    reason: cultural_note
