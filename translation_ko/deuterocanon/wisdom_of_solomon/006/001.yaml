  text: 그러므로 왕들아, 들으십시오. 땅의 끝에 있는 재판관들아, 깨달으십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘들으십시오’는 단순한 청각 수용보다 주의 깊은 순종의 요청을 드러내기 위한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘땅의 끝’은 히브리-그리스어 성경에서 전 세계적 범위를 가리키는 관용적 표현입니다.
    reason: cultural_note
