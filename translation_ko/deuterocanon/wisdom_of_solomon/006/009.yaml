  text: Therefore my words are for you[a], O tyrants[b], so that you may learn wisdom and not fall away.
  footnotes:
  - marker: a
    text: Or 'to you, O rulers.' The Greek τύραννοι can denote sovereign rulers generally, though here it carries a sharp, negative force.
    reason: lexical_alternative
  - marker: b
    text: Or 'and not fall' or 'and not go astray.' The Greek can refer broadly to failing or going wrong.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 내 말은 너희를 향합니다, 오 폭군들아[b]. 너희가 지혜를 배우고 무너지지 않도록 하려는 것입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘넘어지지’ 혹은 ‘길을 벗어나지’. 그리스어는 넓게는 실패하거나 그릇되게 되는 뜻을 가질 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘통치자들’. 그리스어 τύραννοι는 일반적으로는 군주·통치자를 가리킬 수 있으나, 여기서는 강한 부정적 뉘앙스를 띱니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ὑμᾶς οὖν
  english_pob_choice: Therefore my words are for you
  chosen_korean: 그러므로 내 말은 너희를 향합니다
  alternatives_korean:
  - 그러므로 내 말은 너희에게 있습니다
  - 그러므로 내 말은 너희를 향합니다
  lexicon: LSJ / BDAG
  rationale: πρὸς ὑμᾶς는 단순한 ‘~에게’보다 ‘너희를 향해/너희에게 향하여’라는 방향성을 드러내므로, 권면의 말이 직접 그 수신자들을 겨냥함을 살렸습니다.
- source_word: ὦ τύραννοι
  english_pob_choice: O tyrants
  chosen_korean: 오 폭군들아
  alternatives_korean:
  - 오 통치자들아
  - 오 지배자들아
  lexicon: LSJ
  rationale: τύραννοι는 중립적 ‘통치자’보다 강한 부정적 뉘앙스를 지니므로, 경고의 날카로움을 살려 ‘폭군들’로 옮겼습니다.
- source_word: ἵνα μάθητε σοφίαν
  english_pob_choice: so that you may learn wisdom
  chosen_korean: 너희가 지혜를 배우고
  alternatives_korean:
  - 너희가 지혜를 배우도록
  - 너희가 지혜를 배우게 하려는 것입니다
  lexicon: BDAG
  rationale: ἵνα + 접속법은 목적을 나타내므로, 한국어에서도 목적 관계가 분명히 보이도록 ‘배우고’로 연결해 뒤의 목적절을 자연스럽게 받게 했습니다.
- source_word: μὴ παραπέσητε
  english_pob_choice: and not fall away
  chosen_korean: 무너지지 않도록 하려는 것입니다
  alternatives_korean:
  - 떨어지지 않도록 하려는 것입니다
  - 길을 벗어나지 않도록 하려는 것입니다
  - 넘어지지 않도록 하려는 것입니다
  lexicon: LSJ
  rationale: παραπίπτω는 단순한 물리적 ‘떨어지다’보다 실패·이탈·붕괴의 의미를 가질 수 있어, 경고문맥에 맞게 ‘무너지다’로 옮겨 도덕적 실패의 강도를 살렸습니다.
theological_decisions:
- issue: τύραννοι의 부정적 평가를 한국어에서 어떻게 보존할 것인가
  chosen_reading: ‘폭군들’로 옮겨, 단순한 정치적 호칭이 아니라 책망의 어조를 유지했습니다.
  alternative_readings:
  - 통치자들
  - 지배자들
  rationale: 본문은 지혜의 교훈을 권세자들에게 직접 경고하는 맥락이므로, 중립적 호칭으로 완화하면 원문의 수사적 압력이 약해집니다.
  doctrine_reference: '번역 원칙: 원문 수신자 효과와 수사적 강도 보존'
- issue: μὴ παραπέσητε의 의미를 ‘fall away’ 계열로 볼 것인가
  chosen_reading: ‘무너지지 않도록’으로 옮겨, 단순 실족보다 더 넓은 실패·붕괴의 의미를 살렸습니다.
  alternative_readings:
  - 떨어지지 않도록
  - 길을 벗어나지 않도록
  rationale: 지혜를 배우는 목적과 대응되는 경고이므로, 도덕적·영적 실패를 포괄하는 표현이 문맥에 더 적절합니다.
  doctrine_reference: 지혜문학의 권면 구조와 번역의 기능적 대응
