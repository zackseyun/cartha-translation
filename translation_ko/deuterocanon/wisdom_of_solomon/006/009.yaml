  rationale: The revision replaces a calqued Korean predicate with an idiomatic formal-polite expression for words addressed to particular hearers. It also renders the final warning with ‘넘어지지 않도록,’ preserving the Greek verb’s image and semantic breadth without importing a specific doctrinal meaning. Footnote anchors are placed directly after the terms to which their alternatives pertain.
