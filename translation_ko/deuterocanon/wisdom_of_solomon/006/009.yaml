translation:
  language: ko
  text: 그러므로 폭군들이여[a], 내 말은 여러분에게 하는 말입니다. 이는 여러분이 지혜를 배우고 넘어지지 않도록 하려는 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘통치자들’. 그리스어 τύραννοι는 일반적으로 군주나 통치자를 가리킬 수도 있으나, 여기서는 강한 부정적 뉘앙스를 띱니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘실패하지 않도록’ 또는 ‘길을 벗어나지 않도록’. 그리스어는 넓게 실패하거나 그릇된 길로 가는 것을 뜻할 수 있습니다.
    reason: lexical_alternative
