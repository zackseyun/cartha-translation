review_pass:
  verdict: revise
  source_fidelity: The draft conveys the inferential οὖν, the pointed address τύραννοι, the purpose expressed by ἵνα, and the warning in μὴ παραπέσητε. However, ‘내 말은 너희를 향합니다’ is overly literal and unnatural as a Korean predicate, while ‘무너지지 않도록’ narrows παραπέσητε toward collapse rather than retaining its broad sense of falling/failing/going wrong.
  naturalness: A two-sentence formal-polite rendering is more natural in modern Korean. ‘폭군들이여’ keeps the elevated direct address, and ‘여러분에게 하는 말입니다’ idiomatically expresses that the words are addressed to them.
  terminology: ‘폭군들’ appropriately retains the sharply negative force of τύραννοι in context; the footnote preserves the lexically possible neutral alternative ‘통치자들.’ ‘지혜’ is the established rendering of σοφία. ‘넘어지지 않도록’ is preferable to doctrinally loaded ‘떠나지 않도록’ or overly specific ‘무너지지 않도록.’
  issues:
  - severity: medium
    issue: ‘내 말은 너희를 향합니다’ is a literal but non-idiomatic Korean construction.
    rationale: πρὸς ὑμᾶς marks the addressees of the speaker’s words. Korean naturally expresses this as ‘여러분에게 하는 말입니다,’ without losing the direct-address force.
  - severity: medium
    issue: ‘무너지지 않도록’ unduly specifies μὴ παραπέσητε.
    rationale: παραπίπτω can denote falling, failure, or going wrong. ‘무너지다’ emphasizes collapse, whereas ‘넘어지지 않다’ preserves the image and leaves the broader moral sense available, as the note explains.
  - severity: low
    issue: The purpose construction is clearer when explicitly introduced by ‘이는.’
    rationale: The Greek ἵνα clause gives the purpose of the preceding words. ‘이는 … 하려는 것입니다’ makes that relationship explicit in natural Korean.
  revised_text: 그러므로 폭군들이여[a], 내 말은 여러분에게 하는 말입니다. 이는 여러분이 지혜를 배우고 넘어지지 않도록 하려는 것입니다[b].
