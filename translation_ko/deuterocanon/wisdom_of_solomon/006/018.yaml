theological_decisions:
- issue: παιδεία의 의미 범위
  chosen_reading: 훈계를 중심으로 하되, 형성적 가르침의 뜻도 함께 담는 번역으로 처리했습니다.
  alternative_readings:
  - 훈련
  - 교육
  - 징계
  rationale: 문맥상 지혜의 길을 배우고 따라가는 윤리적 형성의 뜻이 핵심이므로, '훈계'가 단순 지식 전달보다 더 적합합니다. 동시에 지나치게 형벌적으로 읽히지 않도록 했습니다.
  doctrine_reference: 지혜문학의 형성적 교육 개념
- issue: ἀφθαρσία의 번역
  chosen_reading: '''썩지 않음''으로 옮겨, 본문이 말하는 부패 없음의 의미를 직접 드러냈습니다.'
  alternative_readings:
  - 불멸
  - 영생
  - 불사
  rationale: 본문은 문자적으로 부패와 소멸의 부재를 말하므로, '불멸'처럼 존재론적 결론을 앞당기기보다 원어의 표현을 더 가깝게 반영하는 것이 안전합니다.
  doctrine_reference: 헬라어 ἀφθαρσία의 어휘 범위
- issue: 의인화된 지혜의 대명사 αὐτῆς
  chosen_reading: '''그녀''로 풀지 않고, 앞의 ''법들''에 자연스럽게 연결되는 한국어 구조를 유지했습니다.'
  alternative_readings:
  - 그녀의
  - 그것의
  rationale: 한국어 본문에서는 인칭대명사의 반복이 어색할 수 있어, 문맥상 지혜의 인격화는 보존하되 직접 대명사 표시는 생략했습니다. 이는 의미 손실을 최소화하면서 문장 흐름을 살린 선택입니다.
  doctrine_reference: 지혜의 인격화(문학적·신학적 장치)
