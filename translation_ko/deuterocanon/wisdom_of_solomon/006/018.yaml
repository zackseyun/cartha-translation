base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/018.yaml
  text: and concern for instruction is love[a], and love is the keeping of her laws, and attention to her laws is the assurance of incorruptibility[b],
  footnotes:
  - marker: a
    text: Or 'discipline' or 'training' for 'instruction' (παιδεία), emphasizing formative moral education.
    reason: lexical_alternative
  - marker: b
    text: Or 'immortality' for 'incorruptibility' (ἀφθαρσία). The Greek more literally speaks of freedom from corruption or decay.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 훈계를 향한 관심은 사랑입니다[a]. 사랑은 그 법들을 지키는 것이고, 그 법들에 대한 주의는 썩지 않음의 확증입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '훈련'이나 '교육'으로도 옮길 수 있습니다. 여기서 παιδεία는 도덕적으로 빚어 가는 형성적 가르침을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '불멸'로 옮길 수 있습니다. 그러나 ἀφθαρσία는 더 문자적으로는 부패나 썩음에서 벗어난 상태를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: φροντὶς
  english_pob_choice: concern
  chosen_korean: 관심
  alternatives_korean:
  - 걱정
  - 염려
  - 배려
  lexicon: LSJ
  rationale: φροντίς는 마음 씀, 관심, 염려의 뜻이 있으나, 여기서는 추상명사로서 다음 절들과 병렬을 이루므로 '관심'이 가장 자연스럽고 과도한 감정 뉘앙스를 덜어 줍니다.
- source_word: παιδείας
  english_pob_choice: instruction
  chosen_korean: 훈계
  alternatives_korean:
  - 교육
  - 훈련
  - 교훈
  lexicon: LSJ
  rationale: 지혜문학에서 παιδεία는 형성적 가르침과 징계를 함께 아우를 수 있어, 한국어로는 도덕적 형성의 뜻을 살리면서도 맥락상 단단한 '훈계'가 적절합니다.
- source_word: τήρησις νόμων
  english_pob_choice: keeping of her laws
  chosen_korean: 그 법들을 지키는 것
  alternatives_korean:
  - 그 법들의 준수
  - 그 법들을 보존하는 것
  - 그 법들을 지키는 일
  lexicon: LSJ
  rationale: τήρησις는 단순한 보관보다 지킴·준수를 뜻하므로, '지키는 것'으로 옮겨 행위성과 순응의 의미를 드러냈습니다.
- source_word: προσοχὴ
  english_pob_choice: attention
  chosen_korean: 주의
  alternatives_korean:
  - 관심
  - 유의
  - 살핌
  lexicon: LSJ
  rationale: προσοχή는 주의 깊게 살피는 태도를 가리키므로, 앞절의 '관심'과 구별되는 집중적 뉘앙스를 살려 '주의'로 옮겼습니다.
- source_word: ἀφθαρσίας
  english_pob_choice: incorruptibility
  chosen_korean: 썩지 않음
  alternatives_korean:
  - 불멸
  - 부패하지 않음
  - 썩지 아니함
  lexicon: LSJ
  rationale: ἀφθαρσία는 문자적으로 부패·썩음이 없는 상태를 뜻하므로, 교리적으로 '불멸'로 좁히지 않고 한국어로 직결되는 '썩지 않음'을 택해 원뜻을 유지했습니다.
theological_decisions:
- issue: παιδεία의 의미 범위
  chosen_reading: 훈계를 중심으로 하되, 형성적 가르침의 뜻도 함께 담는 번역으로 처리했습니다.
  alternative_readings:
  - 훈련
  - 교육
  - 징계
  rationale: 문맥상 지혜의 길을 배우고 따라가는 윤리적 형성의 뜻이 핵심이므로, '훈계'가 단순 지식 전달보다 더 적합합니다. 동시에 지나치게 형벌적으로 읽히지 않도록 했습니다.
  doctrine_reference: 지혜문학의 형성적 교육 개념
- issue: ἀφθαρσία의 번역
  chosen_reading: '''썩지 않음''으로 옮겨, 본문이 말하는 부패 없음의 의미를 직접 드러냈습니다.'
  alternative_readings:
  - 불멸
  - 영생
  - 불사
  rationale: 본문은 문자적으로 부패와 소멸의 부재를 말하므로, '불멸'처럼 존재론적 결론을 앞당기기보다 원어의 표현을 더 가깝게 반영하는 것이 안전합니다.
  doctrine_reference: 헬라어 ἀφθαρσία의 어휘 범위
- issue: 의인화된 지혜의 대명사 αὐτῆς
  chosen_reading: '''그녀''로 풀지 않고, 앞의 ''법들''에 자연스럽게 연결되는 한국어 구조를 유지했습니다.'
  alternative_readings:
  - 그녀의
  - 그것의
  rationale: 한국어 본문에서는 인칭대명사의 반복이 어색할 수 있어, 문맥상 지혜의 인격화는 보존하되 직접 대명사 표시는 생략했습니다. 이는 의미 손실을 최소화하면서 문장 흐름을 살린 선택입니다.
  doctrine_reference: 지혜의 인격화(문학적·신학적 장치)
