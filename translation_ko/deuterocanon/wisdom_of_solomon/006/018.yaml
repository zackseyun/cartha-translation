  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/018.yaml
  text: and concern for instruction is love[a], and love is the keeping of her laws, and attention to her laws is the assurance of incorruptibility[b],
  footnotes:
  - marker: a
    text: Or 'discipline' or 'training' for 'instruction' (παιδεία), emphasizing formative moral education.
    reason: lexical_alternative
  - marker: b
    text: Or 'immortality' for 'incorruptibility' (ἀφθαρσία). The Greek more literally speaks of freedom from corruption or decay.
    reason: lexical_alternative
translation:
  language: ko
  text: 가르침에 마음을 쓰는 것은 사랑입니다[a]. 사랑은 그녀의 법들을 지키는 것이며, 그녀의 법들에 주의를 기울이는 것은 썩지 않음의 확증입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘훈련’이나 ‘교육’으로 옮길 수 있습니다. 여기서 παιδεία는 도덕적·인격적 형성을 위한 가르침을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘불멸’로 옮길 수 있습니다. 그러나 ἀφθαρσία는 더 문자적으로 부패하거나 썩지 않는 상태를 뜻합니다.
    reason: lexical_alternative
