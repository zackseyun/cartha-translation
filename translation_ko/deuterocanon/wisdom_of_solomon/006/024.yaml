    text: 또는 ‘구출’ 또는 ‘보존’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: δήμου는 ‘백성’, ‘사람들’, ‘민중’, 또는 ‘시민 공동체’를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλῆθος
  english_pob_choice: a multitude
  chosen_korean: 무리
  alternatives_korean:
  - 많은 수
  - 다수
  lexicon: LSJ
  rationale: πλῆθος는 단순한 수량보다 집합적 '무리'의 뉘앙스가 강하므로, 격언체의 압축감을 살리기 위해 '무리'로 옮겼습니다.
- source_word: σοφῶν
