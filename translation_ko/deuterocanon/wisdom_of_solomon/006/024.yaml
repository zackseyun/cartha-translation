  lexicon: LSJ
  rationale: σοφῶν은 일반적인 '지혜로운 사람들'을 가리키므로, 한국어에서는 자연스러운 현대어인 '지혜로운 이들'로 풀어 집합적 의미를 유지했습니다.
- source_word: σωτηρία
  english_pob_choice: salvation
  chosen_korean: 구원
  alternatives_korean:
  - 구출
  - 보존
  lexicon: LSJ
  rationale: 이 단어는 문맥상 공적 유익을 포함하지만, POB의 'salvation' 선택에 맞추어 강한 구원 어휘를 유지하되 한국어에서는 가장 직접적인 대응인 '구원'을 택했습니다.
- source_word: εὐσταθία δήμου
  english_pob_choice: the stability of a people
  chosen_korean: 한 백성의 안정
  alternatives_korean:
  - 백성의 안정
  - 백성의 견고함
  - 백성의 평안
  lexicon: LSJ
  rationale: εὐσταθία는 정치적·사회적 '안정'을 뜻하므로 '안정'을 택했고, δήμου는 특정 민족보다 일반적 공동체를 가리켜 '한 백성'으로 처리했습니다.
theological_decisions:
- issue: σωτηρία의 범위
  chosen_reading: '''구원''을 유지하되, 문맥을 통해 지혜로운 통치가 공동체에 미치는 공적 유익이라는 뜻이 드러나도록 했습니다.'
  alternative_readings:
  - 구출
  - 보존
  - 복리
  rationale: 이 절은 정치적 격언이지만, 원어 σωτηρία의 어휘 강도를 약화시키지 않는 것이 중요하므로 한국어에서도 '구원'을 유지했습니다. 동시에 '세상'과 '한 백성'이 문맥을 공적 차원으로 제한해 줍니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 5
