lexical_decisions:
- source_word: ὥστε
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 그리하여
  - 그러니
  lexicon: LSJ
  rationale: 앞선 권면에서 이어지는 결론을 나타내는 접속사이므로, 현대 한국어에서 자연스러운 ‘그러므로’로 인과적 논리를 살렸습니다.
- source_word: παιδεύεσθε
  english_pob_choice: be instructed
  chosen_korean: 훈계받으십시오
  alternatives_korean:
  - 가르침을 받으십시오
  - 훈련받으십시오
  - 교훈을 받으십시오
  lexicon: BDAG
  rationale: 이 동사는 교육·훈련·징계까지 아우를 수 있으므로, 지혜문학의 권면 맥락에서는 단순 정보 전달보다 형성적 교정의 뉘앙스를 살리는 ‘훈계받으십시오’를 택했습니다.
- source_word: τοῖς ῥήμασίν μου
  english_pob_choice: by my words
  chosen_korean: 내 말로
  alternatives_korean:
  - 내 말씀들로
  - 내 말들로
  - 내가 한 말로
  lexicon: LSJ
  rationale: ῥήματα는 구어적 ‘말/발화’를 가리키므로, 장황한 ‘말씀들’보다 직설적인 ‘내 말’이 원문의 구체성을 더 잘 보존합니다.
- source_word: ὠφεληθήσεσθε
  english_pob_choice: you will benefit
  chosen_korean: 유익을 얻으실 것입니다
  alternatives_korean:
  - 유익하게 될 것입니다
  - 도움이 될 것입니다
  - 이득을 보실 것입니다
  lexicon: BDAG
  rationale: 미래 수동의 유익한 결과를 현대 한국어의 공손한 표현으로 옮기되, 상업적 뉘앙스가 있는 ‘이득’보다 중립적인 ‘유익’을 선택했습니다.
theological_decisions:
- issue: 지혜의 교훈을 받는 행위의 뉘앙스
  chosen_reading: ‘훈계받으십시오’는 단순 학습이 아니라, 지혜의 말에 의해 삶이 빚어지고 교정되는 뜻을 드러냅니다.
  alternative_readings:
  - ‘가르침을 받으십시오’로 더 중립적으로 옮길 수 있습니다.
  - ‘훈련받으십시오’로 더 강하게 형성의 의미를 살릴 수 있습니다.
  rationale: 직전 문맥의 권면이 실제로 청중을 변화시키는 형성적 언어이므로, 지혜문학 특유의 교정·훈련 의미를 너무 약화시키지 않는 번역을 택했습니다.
  doctrine_reference: 지혜문학의 훈계/교정 기능
- issue: 부드러운 권면을 존대형 명령으로 표현
  chosen_reading: 명령형이지만 현대 한국어 합쇼체로 공손하게 제시했습니다.
  alternative_readings:
  - 평서형으로 완화할 수 있지만 권면의 직접성이 약해집니다.
  - 반말형은 공적 성경문체에 부적절합니다.
  rationale: 원문의 명령적·권고적 힘을 유지하면서도 한국어 성경 문체에 맞는 공적 공손성을 확보하기 위해 합쇼체 명령을 사용했습니다.
  doctrine_reference: 문체 일관성과 공적 낭독 가능성
