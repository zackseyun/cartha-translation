translation:
  language: ko
  text: 이는 너희에게 권세는 주께로부터 주어졌고, 통치권은 지극히 높으신 분에게서 주어졌기 때문입니다.[a] 그분께서는 너희의 행위를 살피시고 너희의 계획을 면밀히 조사하실 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주께로부터’와 ‘지극히 높으신 분에게서’는 그리스어 전치사 παρά가 나타내는 출처를 옮긴 것입니다. ‘주에게서’와 ‘지극히 높으신 분에게서’로도 옮길 수 있습니다.
    reason: source_note
  - marker: b
    text: ‘계획’은 ‘의도’, ‘숙고’, ‘계책’으로도 옮길 수 있습니다. 여기서는 통치자들의 내적 숙고와 의도를 가리킵니다.
    reason: lexical_alternative
