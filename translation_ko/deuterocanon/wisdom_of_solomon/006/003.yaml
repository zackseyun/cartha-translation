translation:
  language: ko
  text: 이는 주께서 너희에게 권세를 주셨고, 지극히 높으신 이에게서 주권을 주셨기 때문입니다. 그분은 너희의 행위를 살피시고 너희의 계획을 깊이 조사하실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주께서...에게서’는 그리스어 전치사 παρά의 출처 의미를 한국어로 풀어 옮긴 것입니다.
    reason: source_note
  - marker: b
    text: ‘계획’은 ‘의도’, ‘생각’, ‘계략’으로도 옮길 수 있으며, 여기서는 통치자의 내적 의도와 숙고를 함께 드러내기 위해 선택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ κράτησις
  english_pob_choice: authority
  chosen_korean: 권세
  alternatives_korean:
  - 권한
  - 통치권
  - 지배력
  lexicon: LSJ
  rationale: 문맥상 통치자들에게 주어진 정치적 권능을 가리키므로, 물리적 힘보다 공적 통치 권한을 드러내는 ‘권세’가 가장 자연스럽습니다.
- source_word: ἡ δυναστεία
  english_pob_choice: sovereignty
  chosen_korean: 주권
  alternatives_korean:
  - 통치권
  - 지배권
  - 왕권
  lexicon: LSJ
  rationale: 두 번째 용어는 단순한 힘이 아니라 지배와 통치의 범위를 강조하므로, 첫 번째 ‘권세’와 구별되는 ‘주권’이 어울립니다.
- source_word: παρὰ τοῦ κυρίου / παρὰ Ὑψίστου
  english_pob_choice: by the Lord / by the Most High
  chosen_korean: 주께서 / 지극히 높으신 이에게서
  alternatives_korean:
  - 주님으로부터 / 가장 높으신 분으로부터
  - 주께 / 지극히 높으신 분께로부터
  lexicon: BDAG, LSJ
  rationale: παρά + 속격의 출처 의미를 살리기 위해 ‘...에게서/께서’ 구조를 사용했습니다. ‘지극히 높으신 이’는 Ὕψιστος의 신적 칭호를 높임말이 아닌 성경적 존칭으로 옮긴 표현입니다.
- source_word: ἐξετάσει / διεραυνήσει
  english_pob_choice: will examine / investigate
  chosen_korean: 살피시고 / 깊이 조사하실 것입니다
  alternatives_korean:
  - 검토하시고 / 샅샅이 조사하실 것입니다
  - 심문하시고 / 탐구하실 것입니다
  lexicon: BDAG, LSJ
  rationale: 두 동사는 단순 확인이 아니라 판정과 수색의 강도를 함께 지니므로, ‘살피다’와 ‘깊이 조사하다’로 점층적으로 대응시켰습니다.
- source_word: βουλὰς
  english_pob_choice: plans
  chosen_korean: 계획
  alternatives_korean:
  - 의도
  - 생각
  - 꾀
  lexicon: BDAG
  rationale: βουλαί는 외적 행위뿐 아니라 내면의 의도와 궁리를 가리키므로, 현대 독자에게 명료한 ‘계획’이 적절합니다.
theological_decisions:
- issue: 하나님의 이름 없이도 신적 출처를 밝히는 παρά 구문 처리
  chosen_reading: ‘주께서... 지극히 높으신 이에게서’로 옮겨, 권세와 주권의 근원이 하나님께 있음을 분명히 했습니다.
  alternative_readings:
  - ‘주로부터... 지극히 높으신 이로부터’
  - ‘주께로부터... 지극히 높으신 이로부터’
  rationale: 본문은 통치 권한의 기원을 선언하므로, 한국어에서도 수여의 출처를 강조하는 표현이 신학적 초점을 가장 잘 보존합니다.
  doctrine_reference: 'POB translation philosophy: preserve source claims about divine sovereignty and accountability'
- issue: 두 신적 칭호의 병렬
  chosen_reading: ‘주’와 ‘지극히 높으신 이’를 병렬로 유지했습니다.
  alternative_readings:
  - ‘주’와 ‘가장 높으신 분’
  - ‘야훼’와 ‘지극히 높으신 이’
  rationale: 본문 자체가 권세의 근원을 두 칭호로 병렬 진술하므로, 각 칭호의 울림을 유지하는 것이 원문의 신학적 긴장을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table for κύριος; translate titles'
