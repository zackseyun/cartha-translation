  text: For the least is deserving of mercy[b][a], but the mighty will be examined mightily.
  footnotes:
  - marker: a
    text: Or 'forgivable' for 'pardonable.' The Greek adjective suggests being excused or treated with forbearance.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek uses a wordplay: ''the mighty will be examined mightily.'' Alternatives such as ''strictly'' or ''severely'' bring out the sense but lose the rhetorical echo.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 가장 작은 자도 긍휼히 여김을 받기에 합당하지만, 능력 있는 자들은 능력 있게 심문받을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘용서받을 만한’이라고도 옮길 수 있습니다. 그리스어 형용사는 관용을 받아 들여지거나 봐줌을 받는 뜻을 시사합니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 말장난을 사용합니다. ‘능력 있는 자들은 능력 있게 심문받을 것입니다.’라는 대응은 수사적 울림을 살리지만, ‘엄격하게’나 ‘엄중하게’로 풀면 그 반복성이 약해집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάχιστος
  english_pob_choice: the least
  chosen_korean: 가장 작은 자
  alternatives_korean:
  - 가장 보잘것없는 자
  - 가장 낮은 자
  - 가장 미미한 자
  lexicon: LSJ
  rationale: 실체화된 최상급 표현으로서 지위가 가장 낮은 사람을 가리키므로, 한국어에서는 ‘가장 작은 자’로 간결하게 옮겨 대조되는 뒤의 ‘능력 있는 자들’과 대응시켰습니다.
- source_word: συγγνωστός
  english_pob_choice: deserving of mercy / pardonable
  chosen_korean: 긍휼히 여김을 받기에 합당한
  alternatives_korean:
  - 용서받을 만한
  - 봐줌을 받을 만한
  - 용서하기 쉬운
  lexicon: LSJ
  rationale: 이 형용사는 ‘관용을 베풀어 받아들일 수 있는/용서할 수 있는’ 뉘앙스를 가지므로, 단순한 도덕적 용서보다 ‘긍휼히 여김을 받음’과 그에 합당함을 드러냈습니다.
- source_word: δυνατοὶ … δυνατῶς
  english_pob_choice: the mighty … mightily
  chosen_korean: 능력 있는 자들은 능력 있게
  alternatives_korean:
  - 강한 자들은 강하게
  - 권세 있는 자들은 엄중하게
  - 유력한 자들은 세게
  lexicon: LSJ
  rationale: 원문은 어근 반복을 통한 말장난이 핵심이므로, ‘능력 있는 자들 / 능력 있게’로 같은 어휘를 반복해 그 수사적 울림을 살렸습니다.
- source_word: ἐτασθήσονται
  english_pob_choice: will be examined
  chosen_korean: 심문받을 것입니다
  alternatives_korean:
  - 조사받을 것입니다
  - 검사받을 것입니다
  - 엄히 심사받을 것입니다
  lexicon: LSJ
  rationale: 법정적·심사적 의미를 살리되, 미래 수동의 뉘앙스를 자연스럽게 드러내기 위해 ‘심문받다’를 선택했습니다.
theological_decisions:
- issue: ‘가장 작은 자’와 ‘능력 있는 자들’의 대비를 도덕화하지 않고 어떻게 유지할지
  chosen_reading: 본문이 말하는 것은 낮은 자에 대한 긍휼과 강한 자에 대한 더 엄중한 심사라는 대비이므로, 이를 그대로 두고 일반론적 교훈으로 완만하게 바꾸지 않았습니다.
  alternative_readings:
  - 가장 작은 자는 용서받을 만하지만, 강한 자들은 엄하게 심사될 것입니다.
  - 가장 작은 자는 긍휼을 입고, 능력 있는 자들은 철저히 조사될 것입니다.
  rationale: 원문은 지위와 책임의 차이에 따른 처리의 대비를 제시할 뿐, 그 이상을 교리적으로 해설하지 않습니다. 그래서 긍휼과 심문의 긴장을 보존했습니다.
  doctrine_reference: 과도한 해석 확장보다 본문 대비 보존
