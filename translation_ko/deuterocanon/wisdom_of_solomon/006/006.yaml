translation:
  language: ko
  text: 이는 가장 힘없는 자는 긍휼로 용서받을 만하지만, 힘 있는 자들은 엄중한 심문을 받을 것이기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘용서할 만한’이라고 옮길 수 있습니다. 그리스어 형용사는 관용을 베풀어 용서하거나 너그러이 대할 수 있다는 뜻을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘힘 있는 자들’과 ‘엄중하게’에 같은 어근을 사용하여 말놀이를 이룹니다. ‘강력하게’와 같은 번역은 이 반복을 더 드러내지만, 한국어에서는 심문의 강도를 나타내는 ‘엄중하게’가 더 자연스럽습니다.
    reason: lexical_alternative
