  text: So then[a], desire for wisdom leads to kingship.
  footnotes:
  - marker: a
    text: Or 'desire for wisdom leads to a kingdom' or 'to royal rule.' The Greek βασιλεία can denote kingship, reign, or kingdom; here 'kingship' best fits the argument's focus on attaining rule.
