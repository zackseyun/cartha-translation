translation:
  language: ko
  text: 그러므로 지혜에 대한 갈망은 왕권으로 이끕니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지혜에 대한 갈망은 왕국으로 이끕니다’ 또는 ‘왕의 통치로 이끕니다’. 여기서 βασιλεία는 왕권, 통치, 왕국을 뜻할 수 있으며, 문맥상 ‘왕권’이 가장 잘 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμία
  english_pob_choice: desire
  chosen_korean: 욕구
  alternatives_korean:
  - 갈망
  - 원함
  - 욕망
  lexicon: BDAG
  rationale: Ἐπιθυμία는 강한 지향이나 열망을 뜻하므로, 문맥상 중립적이면서도 힘 있는 ‘욕구’가 POB의 ‘desire’를 가장 잘 반영합니다. ‘욕망’은 지나치게 부정적으로 들릴 수 있어 피했습니다.
- source_word: ἄρα
  english_pob_choice: so then
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 그런즉
  - 그러니
  lexicon: BDAG
  rationale: 앞선 논증에서 이끌어낸 결론임을 나타내는 추론 접속사이므로, 합쇼체 문장 흐름에 자연스러운 ‘그러므로’로 옮겼습니다.
- source_word: σοφίας
  english_pob_choice: wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 슬기
  - 지식
  lexicon: BDAG
  rationale: σοφία의 기본 대응으로 ‘지혜’를 택해, 이 책 전체에서 지혜가 지닌 신학적·실천적 폭을 보존했습니다.
- source_word: ἐπὶ βασιλείαν
  english_pob_choice: to kingship
  chosen_korean: 왕권으로
  alternatives_korean:
  - 왕위로
  - 나라로
  - 통치로
  lexicon: BDAG
  rationale: POB가 βασιλεία를 이 절에서는 공간적 ‘왕국’보다 지위·통치의 성격인 ‘kingship’으로 읽기 때문에, 한국어도 ‘왕권’으로 옮겨 왕의 통치권/지위에 초점을 맞췄습니다.
theological_decisions:
- issue: βασιλεία의 의미 범위
  chosen_reading: ‘왕권’으로 옮겨, 지혜를 추구하는 결과가 왕의 지위나 통치권에 이르는 것임을 드러냈습니다.
  alternative_readings:
  - ‘왕국’
  - ‘나라’
  - ‘통치’
  rationale: 이 절은 국가 명칭보다 목적지/상태로서의 βασιλεία를 말하므로, 문맥에 맞게 왕권을 선택했습니다. 이는 단어의 범위를 좁히는 것이 아니라 논증의 초점을 보존하는 결정입니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
