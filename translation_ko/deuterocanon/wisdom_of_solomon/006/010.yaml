  rationale: 형용사·부사·목적어의 어근 반복을 한국어에서도 드러내기 위해 ‘거룩한 것들을 거룩하게’로 옮겼습니다.
- source_word: ὁσιωθήσονται
  english_pob_choice: will be made holy
  chosen_korean: 거룩하게 되며
  alternatives_korean:
  - 거룩하게 될 것이며
  - 성별될 것이며
  lexicon: LSJ
  rationale: 수동 미래의 결과를 자연스러운 한국어로 살리되, ‘성별되다’보다 본문의 어근 반복을 보존하는 ‘거룩하게 되다’를 택했습니다.
- source_word: εὑρήσουσιν ἀπολογίαν
  english_pob_choice: will find a defense
  chosen_korean: 변론을 얻게 될 것입니다
  alternatives_korean:
  - 변호를 얻게 될 것입니다
  - 대답을 얻게 될 것입니다
  lexicon: BDAG
  rationale: ἀπολογία는 재판·심문 맥락의 방어 진술을 가리킬 수 있으므로, 법정적 뉘앙스를 살리기 위해 ‘변론’으로 옮겼습니다.
theological_decisions:
- issue: ὁσίως / τὰ ὅσια / ὁσιωθήσονται의 어근 반복
  chosen_reading: 한국어에서도 ‘거룩한 것들을 거룩하게… 거룩하게 되며’로 반복을 유지했습니다.
  alternative_readings:
  - ‘경건하게 성스러운 것들을… 성별되며’
  - ‘거룩한 예법을 경건히 지켜… 거룩해지며’
  rationale: 본문은 거룩 관련 어휘를 의도적으로 겹쳐 쓰므로, 의미만 전달하기보다 반복 자체가 드러나도록 했습니다.
  doctrine_reference: 번역 원칙 §1, §5
- issue: ἀπολογία의 범위
  chosen_reading: 법정적 ‘변론’으로 유지했습니다.
  alternative_readings:
  - ‘대답’
  - ‘변호’
  - ‘정당화’
  rationale: 본문의 결론은 단순한 답변보다 심문에 대한 دفاع/변론에 가깝고, ‘정당화’는 후대 교리적 의미를 과도하게 불러올 수 있습니다.
  doctrine_reference: 번역 원칙 §1, §3
