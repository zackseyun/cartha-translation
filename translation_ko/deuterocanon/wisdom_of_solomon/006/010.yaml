base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/010.yaml
  text: For those who have kept holy things holily will be made holy[b][a], and those who have been taught them will find a defense.
  footnotes:
  - marker: a
    text: Or 'have piously observed sacred things ... will be sanctified.' The Greek uses a deliberate cluster of cognate holiness terms.
    reason: lexical_alternative
  - marker: b
    text: Or 'will find an answer' or 'will find justification.' The Greek term can denote a defense given in response to examination or accusation.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 거룩한 것들을 거룩하게 지킨 사람들은 거룩하게 될 것이며[a], 그것들을 배운 사람들은 변론을 얻게 될 것이기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거룩한 것들을 경건하게 지킨 사람들은 성별될 것입니다.’ 그리스어는 거룩함 계열 어휘를 의도적으로 겹쳐 씁니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘대답’을 얻게 될 것입니다. 그리스어 ἀπολογία는 심문이나 고발에 대한 방어 진술을 뜻할 수 있습니다.
    reason: lexical_alternative
