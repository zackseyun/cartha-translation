  - 지켜 지낸
  lexicon: BDAG
  rationale: 행위를 계속해 온 뉘앙스를 살리면서, 단순한 보관보다 규범적·윤리적 준수를 드러내기 위해 ‘지켜 온’으로 옮겼습니다.
- source_word: ὁσίως τὰ ὅσια
