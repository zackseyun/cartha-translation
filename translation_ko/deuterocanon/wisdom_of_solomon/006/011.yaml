  - 훈육을 받게 될 것입니다
  - 훈련을 받게 될 것입니다
  lexicon: BDAG
  rationale: 지혜문학의 문맥상 ‘instruction’이 전면에 오지만, παιδεύω의 형성적·교정적 뉘앙스도 남기기 위해 ‘교훈을 받다’로 옮겼습니다.
theological_decisions:
- issue: παιδεύω의 의미 범위
  chosen_reading: 지혜의 가르침을 받는 뜻을 본문에서 우선화했습니다.
  alternative_readings:
  - 훈육을 받게 될 것입니다
  - 징계를 받게 될 것입니다
  rationale: 이 구절은 지혜의 말에 대한 갈망과 그 결과를 말하므로, 문맥상 ‘가르침/교훈’이 가장 직접적입니다. 다만 원어의 형성·교정 의미는 용례 주석으로 보존했습니다.
  doctrine_reference: Translation philosophy §1, §5
