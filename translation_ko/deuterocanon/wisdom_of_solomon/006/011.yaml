  - marker: b
    text: 또는 ‘교훈을 받게 될 것입니다’, ‘훈육을 받게 될 것입니다’, ‘징계를 받게 될 것입니다’. 그리스어 동사는 가르침과 형성적 훈육을 함께 담을 수 있습니다.
