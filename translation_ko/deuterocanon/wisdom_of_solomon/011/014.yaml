  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/014.yaml
  text: For they rejected with mockery the one who had long ago been cast out at his exposure[a]; but at the end of those events they marveled[b], having thirsted unlike the righteous.
  footnotes:
  - marker: a
    text: That is, the child once exposed and cast out—an allusion to Moses.
    reason: cross_reference
  - marker: b
    text: Or "at the end of the outcomes"; the Greek may refer to the final result of the events that had unfolded.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 오래전에 내다 버려졌던 이를 조롱하며 배척하였으나[a], 그 일들이 끝날 무렵 의인들과는 달리 목마름을 겪고서 놀랐습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 한때 내다 버려졌던 아이를 가리키며, 모세를 암시합니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘그 결과들의 끝에’. 그리스어는 진행되어 온 일들의 최종 결과 또는 귀결을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκθέσει πάλαι ῥιφέντα
  english_pob_choice: had long ago been cast out at his exposure
  chosen_korean: 오래전에 노출되어 버려진
  alternatives_korean:
  - 오래전에 버려진
  - 오래전에 노출되었을 때 버려진
  - 노출되어 내버려진
  lexicon: LSJ
  rationale: ἔκθεσις는 영아를 내다 버리는 ‘노출’의 뜻을 지니므로, 단순한 ‘버림’보다 그 구체적 상황을 드러내는 ‘노출되어 버려진’으로 옮겼습니다.
- source_word: ἀπεῖπον χλευάζοντες
  english_pob_choice: rejected with mockery
  chosen_korean: 조롱하며 거절하였으나
  alternatives_korean:
  - 조롱하며 거절하였으나
  - 비웃으며 물리쳤으나
  - 조롱으로 배척하였으나
  lexicon: LSJ/BDAG
  rationale: χλευάζοντες의 ‘조롱/비웃음’과 ἀπεῖπον의 ‘거절/배척’ 관계를 함께 살리기 위해, 부사적 구조를 유지한 ‘조롱하며 거절하였으나’로 번역했습니다.
- source_word: ἐπὶ τέλει τῶν ἐκβάσεων
  english_pob_choice: at the end of those events
  chosen_korean: 그 일들의 끝에 이르러서는
  alternatives_korean:
  - 그 일들의 마지막에
  - 그 결과들의 끝에
  - 그 사건들의 종국에
  lexicon: LSJ
  rationale: ἐκβάσεις는 ‘결과/귀결’과 ‘일어나는 일들의 전개’ 모두를 가리킬 수 있어, 문맥의 사건 진행을 살린 ‘그 일들의 끝’으로 두었습니다.
- source_word: οὐχ ὅμοια δικαίοις διψήσαντες
  english_pob_choice: having thirsted unlike the righteous
  chosen_korean: 의인들과는 다르게 목말랐기 때문입니다
  alternatives_korean:
  - 의인들과는 다르게 목말랐기 때문입니다
  - 의인들과 같은 방식으로 목마르지 않았기 때문입니다
  - 의인들과는 같지 않게 목말랐기 때문입니다
  lexicon: LSJ/BDAG
  rationale: 직역을 유지하되 한국어로 자연스러운 원인-결과 구조를 위해 ‘목말랐기 때문입니다’로 정리하고, 비교의 초점은 ‘의인들과는 다르게’에 두었습니다.
theological_decisions:
- issue: 11장 14절의 암시적 인물 지시
  chosen_reading: 본문은 그 인물을 직접 이름하지 않고, ‘오래전에 노출되어 버려진’ 사람으로 암시합니다.
  alternative_readings:
  - 본문에 모세를 직접 밝혀 번역할 수 있습니다.
  rationale: 그리스어가 인물을 간접적으로 지시하므로, 주석적 해설을 본문에 덧붙이지 않고 암시를 유지하는 것이 원문의 절제를 보존합니다.
  doctrine_reference: translation philosophy §1, §3
