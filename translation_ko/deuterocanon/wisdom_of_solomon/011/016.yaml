translation:
  language: ko
  text: 이는 그들이 사람이 죄를 짓는 바로 그것들을 통하여 바로 그것들로 벌을 받는다는 것을 알도록 하시려는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘사람이 죄를 짓는 것들을 통하여, 바로 그것들로 벌을 받는다’입니다. 그리스어는 전치사 διά를 반복하여 죄를 짓는 수단과 벌을 받는 수단의 상응을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα γνῶσιν
  english_pob_choice: so that they might know
  chosen_korean: 알게 하시려는 것은
  alternatives_korean:
  - 알게 하려는 것은
  - 알게 되는 것은
  lexicon: BDAG
  rationale: ἵνα + aorist subjunctive의 목적/결과 뉘앙스를 한국어로 자연스럽게 옮기되, 본문의 의도된 인식 도달을 분명히 드러내기 위해 ‘알게 하시려는 것은’으로 처리했습니다.
- source_word: διʼ ὧν ... διὰ τούτων
  english_pob_choice: by the very things through which ... by these
  chosen_korean: 바로 그 것들로 인해, 바로 그 것들로
  alternatives_korean:
  - 그것들을 통해, 그것들로
  - 그 일들로, 그 일들로
  lexicon: BDAG
  rationale: 반복된 διά 구조가 죄와 벌 사이의 대응을 강조하므로, 한국어에서도 ‘바로 그 것들로’의 반복으로 대응성과 응보성을 살렸습니다.
- source_word: τις ἁμαρτάνει
  english_pob_choice: a person sins
  chosen_korean: 사람이 죄를 짓는
  alternatives_korean:
  - 누군가 죄를 짓는
  - 어떤 사람이 죄를 짓는
  lexicon: BDAG
  rationale: 비인칭적·일반적 주어를 표준 한국어로 풀어 ‘사람이’로 옮겨, 특정 개인이 아니라 일반 원리를 말하는 문맥을 유지했습니다.
- source_word: κολάζεται
  english_pob_choice: he is punished
  chosen_korean: 벌을 받는다는 사실입니다
  alternatives_korean:
  - 형벌을 받는다는 사실입니다
  - 징계를 받는다는 사실입니다
  lexicon: BDAG
  rationale: 지혜서 문맥의 보응/형벌 의미를 살리되, ‘징계’처럼 교정적 뉘앙스로 약화시키지 않기 위해 ‘벌을 받다’를 택했습니다.
theological_decisions:
- issue: 죄와 벌의 대응성
  chosen_reading: 죄를 지은 바로 그 수단이 벌의 수단이 된다는 대응 관계를 본문 그대로 드러냈습니다.
  alternative_readings:
  - 단순히 죄와 벌이 관련된다는 일반 진술로 완화하는 읽기
  rationale: 반복된 διά가 의도하는 상응성을 약화시키지 않기 위해, 한국어에서도 반복 구조를 유지해 보응의 맞물림을 보존했습니다.
  doctrine_reference: 원문 우선, 응보적 정의의 대응성을 해석으로 덮어쓰지 않기
- issue: 문장의 주체 표현
  chosen_reading: 주어를 일반 사람으로 풀어 ‘사람이’라고 했습니다.
  alternative_readings:
  - ‘누구든지’로 확장하는 읽기
  - 무인칭으로 처리하는 읽기
  rationale: τις의 일반적 인간 주어를 자연스러운 표준어로 옮겨, 본문의 보편적 경구 성격을 유지했습니다.
  doctrine_reference: 일반적 인간 진술의 보존
