  text: so that they might know that by the very things through which a person sins[a], by these he is punished.
  footnotes:
  - marker: a
    text: Or, 'through the very things by which someone sins, through these things he is punished.' The Greek repeats the same preposition to stress the correspondence between sin and punishment.
