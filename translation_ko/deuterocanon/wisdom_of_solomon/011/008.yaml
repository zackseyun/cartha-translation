lexical_decisions:
- source_word: ἔδωκας
  english_pob_choice: You gave
  chosen_korean: 주셨으며
  alternatives_korean:
  - 주셨습니다
  - 베푸셨으며
  - 내리셨으며
  lexicon: LSJ
  rationale: δίδωμι의 단순 과거로서 ‘주다’의 직접성을 살리되, 문맥상 하나님의 행위이므로 공손한 ‘주셨습니다’ 계열이 자연스럽습니다.
- source_word: δαψιλὲς ὕδωρ
  english_pob_choice: abundant water
  chosen_korean: 풍성한 물
  alternatives_korean:
  - 풍부한 물
  - 넉넉한 물
  - 많은 물
  lexicon: LSJ
  rationale: δαψιλής는 단순한 양의 많음을 넘어 넉넉하고 후한 공급을 뜻하므로, ‘풍성한’이 과장 없이 그 뉘앙스를 잘 살립니다.
- source_word: ἀνελπίστως
  english_pob_choice: unexpectedly
  chosen_korean: 예상하지 못한
  alternatives_korean:
  - 뜻밖의
  - 예기치 못한
  - 기대 없이
  lexicon: LSJ
  rationale: ‘unexpectedly’의 자연스러운 한국어이며, 주어진 물이 인간의 기대를 벗어난 선물임을 분명히 합니다.
- source_word: τοὺς ὑπεναντίους
  english_pob_choice: their adversaries
  chosen_korean: 그들의 적대자들
  alternatives_korean:
  - 그들의 원수들
  - 대적하는 자들
  - 적들
  lexicon: LSJ
  rationale: ὑπεναντίους는 단순한 감정적 ‘적’보다 대립·반대의 관계를 드러내므로, ‘적대자들’이 의미를 가장 직접적으로 반영합니다.
theological_decisions:
- issue: ‘그때의 목마름’을 어떤 기능으로 이해할지
  chosen_reading: 과거의 목마름은 하나님의 공급을 드러내는 대비의 표지로 이해하고, 이를 ‘통해’라고 옮겼습니다.
  alternative_readings:
  - ‘그때의 목마름으로 말미암아’
  - ‘그 시절의 갈증으로’
  rationale: 헬라어 διὰ τοῦ τότε δίψους는 단순 배경이 아니라 뒤따르는 심판의 방식과 대비를 보여 주는 수단적 표현이므로, 하나님의 드러내심이라는 기능을 살렸습니다.
  doctrine_reference: 섭리와 심판의 대비
- issue: ‘벌하셨다’의 강도
  chosen_reading: ἐκόλασας를 ‘벌하셨습니다’로 직역해 심판의 명시성을 유지했습니다.
  alternative_readings:
  - ‘징계하셨습니다’
  - ‘치셨습니다’
  - ‘형벌을 내리셨습니다’
  rationale: 문맥은 이집트/대적들에 대한 실제적 징벌을 말하므로, ‘징계’처럼 완화된 표현보다 ‘벌하다’가 source-direct합니다.
  doctrine_reference: 하나님의 공의로운 심판
