  lexicon: LSJ
  rationale: ἰσχύειν은 단순한 상태가 아니라 힘을 행사하는 뜻이므로, 한국어에서는 ‘능력을 나타내실 수 있는 일’로 옮겨 하나님의 능동적 행위를 살렸습니다.
- source_word: πάρεστίν σοι
  english_pob_choice: it is always in your power
  chosen_korean: 언제나 주님께
  alternatives_korean:
  - 주님께는 언제나 가능하니
  - 주님께는 늘 맡겨져 있으니
  lexicon: LSJ
  rationale: πάρεστιν σοι는 ‘항상 가능하다’기보다 ‘늘 곁에/수중에 있다’는 가용성의 뉘앙스를 가지므로, 문맥상 한국어에서는 앞뒤에 자연스럽게 흡수해 표현했습니다.
- source_word: κράτει βραχίονός σου
  english_pob_choice: the might of your arm
  chosen_korean: 주님의 팔의 위세
  alternatives_korean:
  - 주님의 팔의 능력
  - 주님의 강한 팔
  lexicon: LSJ
  rationale: ‘팔’은 성경적 의인화 이미지이므로 유지했고, κράτος는 단순한 힘보다 ‘위세/권세’의 느낌이 있어 ‘위세’로 옮겼습니다.
- source_word: τίς ἀντιστήσεται
  english_pob_choice: who will withstand
  chosen_korean: 누가 맞서겠습니까?
  alternatives_korean:
  - 누가 대항하겠습니까?
  - 누가 버티겠습니까?
  lexicon: LSJ
  rationale: ἀνθίστημι는 대적하여 버티거나 맞서는 뜻이므로, 도발적 반문으로서 ‘맞서겠습니까’가 가장 자연스럽고 직접적입니다.
