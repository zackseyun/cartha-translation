lexical_decisions:
- source_word: τὸ γὰρ μεγάλως ἰσχύειν
  english_pob_choice: it is always in your power to show great strength
  chosen_korean: 언제나 주님께 크게 능력을 나타내실 수 있는 일
  alternatives_korean:
  - 언제나 주님께 큰 힘을 베푸실 수 있는 일
