  alternative_readings:
  - ‘유아들을 죽인 칙령’
  - ‘유아 살해를 명한 칙령’
  rationale: 그리스어는 압축된 형용사구이므로, 의미를 풀어 쓰되 본문의 날카로운 고발성을 유지하는 쪽이 원문에 가깝습니다.
  doctrine_reference: '번역 원칙: source-direct 표현을 보존하고, 역사적/신학적 암시를 완화하지 않음'
