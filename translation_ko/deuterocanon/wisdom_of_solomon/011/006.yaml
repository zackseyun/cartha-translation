translation:
  language: ko
  text: 끊임없이 흐르는 강의 샘 대신에, 그들은 진흙탕 같은 피로 괴로움을 당했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘끊임없이 흐르는’은 그리스어가 나타내는 지속적인 흐름의 뜻을 옮긴 것입니다. ‘영원히 흐르는’으로도 번역할 수 있으나, 여기서는 물의 계속 흐르는 성질을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘진흙탕 같은 피’는 피와 함께 진흙 또는 진창 같은 상태를 나타내는 그리스어 표현을 옮긴 것입니다. 단순히 탁한 피보다 더럽고 질척한 이미지를 강조합니다.
    reason: lexical_alternative
