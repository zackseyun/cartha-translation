  text: Instead of the spring of an ever-flowing river[a], they were troubled by muddy blood[b],
  footnotes:
  - marker: a
    text: Or 'in place of a spring of an ever-flowing river.' The Greek genitive construction can be rendered more literally, but 'an ever-flowing river’s spring' is smoother in English.
    reason: lexical_alternative
  - marker: b
    text: '''Muddy blood'' renders a Greek expression that combines blood with the idea of muddiness or mire, emphasizing foul, polluted water rather than blood in an abstract sense.'
    reason: lexical_alternative
translation:
  language: ko
  text: 영원히 흐르는 강의 샘 대신에, 그들은 흐린 피 때문에 어지럽혀졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘영원히 흐르는 강의 샘’으로도 옮길 수 있습니다. 한국어에서는 관계를 풀어 ‘강의 샘’으로 자연스럽게 정리했습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘흐린 피’는 그리스어의 ‘진흙/진흙탕 같은’ 뉘앙스를 간결하게 반영한 번역입니다. 더 직역하면 ‘진흙 같은 피’입니다.
    reason: lexical_alternative
