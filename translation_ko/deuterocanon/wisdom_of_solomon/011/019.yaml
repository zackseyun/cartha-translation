translation:
  language: ko
  text: 또는 키질되어 흩날리는 악취 나는 연기 덩어리들, 또는 그들의 눈에서 번쩍이는 무서운 불꽃들—그것들이 끼치는 해악은 그들을 짓눌러 부술 수 있었을 뿐 아니라, 그것들의 두려움을 일으키는 모습은 그들을 멸할 수도 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사방으로 휘몰아치는 악취 나는 연기 구름.’ 그리스어는 문자적으로 ‘키질되는 악취 나는 연기 덩어리들’이라고 하며, 공중에 떠서 흩날리는 것을 농경의 키질에 빗댑니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: βρόμους λικμωμένους καπνοῦ
  english_pob_choice: foul masses of smoke being winnowed
  chosen_korean: 악취 나는 연기 덩어리들이 흩날리고
  alternatives_korean:
  - 악취 나는 연기 덩어리들이 키질되며
  - 더러운 연기 덩어리들이 바람에 날리고
  lexicon: LSJ
  rationale: βρόμους는 단순한 냄새보다 불쾌하고 해로운 기운이 있는 덩어리로 읽히므로 ‘악취 나는 연기 덩어리들’로 살렸고, λικμωμένους는 직역상 ‘키질되다’이나 한국어 자연성을 위해 흩날림의 이미지를 살렸습니다.
- source_word: δεινοὺς ... σπινθῆρας ἀστράπτοντας
  english_pob_choice: terrible sparks flashing
  chosen_korean: 무서운 불꽃들
  alternatives_korean:
  - 두려운 불꽃들
  - 끔찍한 불꽃들
  lexicon: LSJ
  rationale: δεινούς는 도덕적 악이 아니라 공포를 불러오는 성격을 가리키므로 ‘무서운’으로 옮겼고, σπινθῆρας와 ἀστράπτοντας는 눈에서 번쩍이는 불꽃의 시각적 충격을 살렸습니다.
- source_word: ἡ βλάβη ἠδύνατο συνεκτρῖψαι αὐτούς
  english_pob_choice: whose harm was able ... to crush them
  chosen_korean: 그들의 해악은 그들을 짓눌러 부수는 것만이 아니라
  alternatives_korean:
  - 그들의 해악은 그들을 산산이 부수는 것만이 아니라
  - 그들의 손상은 그들을 함께 짓누르는 것만이 아니라
  lexicon: LSJ
  rationale: βλάβη는 넓은 의미의 해악·상해이므로 ‘해악’으로 두었고, συνεκτρῖψαι의 강한 파괴감을 ‘짓눌러 부수다’로 옮겨 합성 동사의 압축된 힘을 반영했습니다.
- source_word: ἡ ὄψις ἐκφοβήσασα διολέσαι
  english_pob_choice: their frightening appearance to destroy them
  chosen_korean: 그들의 두려운 모습만으로도 그들을 멸할 수 있었습니다
  alternatives_korean:
  - 그들의 무서운 모습만으로도 그들을 파멸시킬 수 있었습니다
  - 그것을 보는 것만으로도 그들을 멸할 수 있었습니다
  lexicon: LSJ
  rationale: ὄψις는 단순한 시각이 아니라 ‘모습/광경’의 의미를 가지므로 ‘두려운 모습’으로 옮겼고, διολέσαι는 최종적 파괴를 가리키므로 ‘멸하다’로 번역했습니다.
