  text: 또는 악취 나는 연기 덩어리들이 흩날리고, 또는 눈에서 번쩍이는 무서운 불꽃들 — 그들의 해악은 그들을 짓눌러 부수는 것만이 아니라, 그들의 두려운 모습만으로도 그들을 멸할 수 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
