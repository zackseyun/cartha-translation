lexical_decisions:
- source_word: διπλῆ
  english_pob_choice: double
  chosen_korean: 이중의
  alternatives_korean:
  - 두 겹의
  - 겹친
  lexicon: LSJ
  rationale: λύπη를 수식하는 중첩·강조를 살리기 위해 ‘이중의’로 옮겼습니다. ‘두 겹의’는 물리적 느낌이 강하고, ‘겹친’은 추상성에서 약해집니다.
- source_word: ἔλαβε
