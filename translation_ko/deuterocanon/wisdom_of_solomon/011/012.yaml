  rationale: 감정이 인물을 덮쳐 들어오는 역동성을 살리면서도 현대 한국어에서 자연스럽게 들리는 동사로 선택했습니다.
- source_word: στεναγμός
  english_pob_choice: groaning
  chosen_korean: 신음
  alternatives_korean:
  - 탄식
  - 한숨
  lexicon: LSJ
  rationale: audible sighing/groaning의 강도를 고려해 ‘신음’을 택했습니다. ‘탄식’은 더 문학적이고 ‘한숨’은 약합니다.
- source_word: μνημῶν τῶν παρελθουσῶν
  english_pob_choice: at the memory of what had happened
  chosen_korean: 일어난 일들을 기억하며
  alternatives_korean:
  - 지나간 일들을 기억하며
  - 지나간 것들을 회상하며
  lexicon: LSJ
  rationale: 압축된 그리스어 표현을 한국어로 풀어, 단순한 ‘과거’가 아니라 이미 벌어진 사건들의 기억을 가리키게 했습니다.
theological_decisions:
- issue: 감정의 주어와 서술 구조
  chosen_reading: ‘그들에게는 … 엄습했습니다’로 풀어, 슬픔과 신음이 사람들에게 닥쳐오는 능동적 감정의 압박을 드러냈습니다.
  alternative_readings:
  - ‘그들은 … 겪었습니다’
  - ‘…가 그들을 사로잡았습니다’
  rationale: 본문의 ἔλαβε는 단순한 발생보다 ‘덮쳐 옴’의 뉘앙스가 있어, 수동적 경험이 아닌 강한 체험성을 살렸습니다.
  doctrine_reference: 지혜서의 서사적·시적 표현은 문자적 사건기술보다 정서적 실재를 강조하므로, 감정의 인격화 표현을 유지합니다.
