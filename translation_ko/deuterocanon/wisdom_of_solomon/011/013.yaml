    text: 또는 ‘그들은 주님을 알아차렸습니다.’ 그리스어는 단순한 인식이나 알아차림을 뜻할 수 있으며, 반드시 완전한 신앙고백을 가리키지는 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε γὰρ
  english_pob_choice: For when
  chosen_korean: ~했을 때
  alternatives_korean:
  - 그런데 ~했을 때
  - 왜냐하면 ~했을 때
  lexicon: LSJ
  rationale: ὅτε의 시간 부사절을 살리고, γάρ의 설명적 연결은 한국어에서는 앞뒤 문맥으로 자연스럽게 드러나므로 과도하게 직역하지 않았습니다.
- source_word: διὰ τῶν ἰδίων κολάσεων
  english_pob_choice: through their own punishments
  chosen_korean: 자기들의 벌을 통해서
  alternatives_korean:
  - 자기들의 고통을 통해서
  - 자기들의 형벌을 통해서
  lexicon: LSJ
  rationale: διά+속격의 수단 의미를 살려 ‘통해서’로 옮기고, κολάσεων은 문맥상 재앙적 징계를 가리키므로 ‘벌’로 옮겨 고통보다 심판성을 분명히 했습니다.
- source_word: εὐεργετουμένους
  english_pob_choice: were being benefited
  chosen_korean: 유익을 얻고 있다는
  alternatives_korean:
  - 선대받고 있다는
  - 호의를 받고 있다는
  lexicon: LSJ
  rationale: 수동태의 ‘받는’ 뉘앙스와 역설을 살리되, 현대 한국어에서 자연스럽게 읽히도록 ‘유익을 얻고 있다’로 옮겼습니다.
- source_word: ᾔσθοντο τοῦ κυρίου
  english_pob_choice: they recognized the Lord
  chosen_korean: 주님을 알아차렸습니다
  alternatives_korean:
  - 주님을 인식했습니다
  - 주님을 깨달았습니다
  lexicon: LSJ
  rationale: ᾔσθοντο는 단순 감각보다 ‘알아차리다/인지하다’의 뉘앙스가 있어, 완전한 신앙고백까지는 단정하지 않는 한국어 표현을 택했습니다.
theological_decisions:
- issue: τοῦ κυρίου의 인지 강도
  chosen_reading: ‘알아차렸습니다’로 번역해, 주님의 존재나 행위를 인지한 정도를 열어 두었습니다.
  alternative_readings:
  - 주님을 인정했습니다
  - 주님을 믿게 되었습니다
  rationale: 원문은 인식·분별의 의미를 가질 수 있으므로, 완전한 회심이나 신앙고백으로 확정하지 않고 본문의 긴장을 보존했습니다.
  doctrine_reference: τοῦ κυρίου = 주님(κύριος) 기본 번역, 인지/인식 의미 보존
