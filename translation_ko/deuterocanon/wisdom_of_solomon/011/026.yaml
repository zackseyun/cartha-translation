base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/026.yaml
  text: But you spare all things[a], because they are yours, O Master who loves life. For your imperishable spirit is in all things.
  footnotes:
  - marker: a
    text: Or 'lover of souls.' The Greek φιλόψυχε can be understood more narrowly in relation to living beings or souls, but here it is rendered broadly because the context speaks of God's care for all creation.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서는 만물을 아끼십니다. 그것들이 모두 주님의 것이기 때문입니다, 생명을 사랑하시는 주인이시여.[a] 주님의 썩지 않는 영은 만물 안에 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영혼들을 사랑하시는 분이시여.’ φιλόψυχε는 더 좁게는 영혼들을 사랑한다는 뜻으로 이해될 수도 있으나, 여기서는 모든 창조물을 향한 하나님의 돌보심이 강조되므로 넓게 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: φείδῃ
  english_pob_choice: you spare
  chosen_korean: 아끼십니다
  alternatives_korean:
  - 모든 것을 아끼십니다
  - 모든 것을 용서하십니다
  - 모든 것을 보존하십니다
  lexicon: BDAG
  rationale: 이 동사는 해치지 않고 아끼거나 그냥 두는 뜻이므로, 하나님의 창조물에 대한 배려를 자연스럽게 살리는 '아끼십니다'를 택했습니다.
- source_word: πάντων
  english_pob_choice: all things
  chosen_korean: 만물
  alternatives_korean:
  - 모든 것
  - 모든 피조물
  lexicon: LSJ
  rationale: 문맥상 창조 전체를 가리키므로, 포괄성과 문어적 품위를 함께 살리는 '만물'이 적절합니다.
- source_word: Δέσποτα
  english_pob_choice: Master
  chosen_korean: 주재자
  alternatives_korean:
  - 주인
  - 마스터
  - 주권자
  lexicon: BDAG
  rationale: κύριος와 구별되는 절대적 소유·통치의 호칭을 살리기 위해, 교회 전통적 '주님'보다 의미가 더 직접적인 '주재자'를 선택했습니다.
- source_word: φιλόψυχε
  english_pob_choice: who loves life
  chosen_korean: 생명을 사랑하시는
  alternatives_korean:
  - 영혼을 사랑하시는
  - 생명을 좋아하시는
  - 생명을 아끼시는
  lexicon: LSJ
  rationale: 직역하면 '생명/혼을 사랑하는'이지만, 이 문맥에서는 창조 전체에 대한 하나님의 돌보심을 가리키므로 '생명을 사랑하시는'이 가장 넓고 자연스럽습니다.
- source_word: ἄφθαρτόν
  english_pob_choice: imperishable
  chosen_korean: 썩지 않는
  alternatives_korean:
  - 불멸의
  - 부패하지 않는
  - 영원한
  lexicon: BDAG
  rationale: 훼손이나 부패를 받지 않는 상태를 직접 드러내는 표현으로, 형이상학적으로 너무 추상화하지 않는 '썩지 않는'을 택했습니다.
theological_decisions:
- issue: 하나님의 영이 '모든 것' 안에 있다는 보편성의 범위
  chosen_reading: 창조 세계 전체에 대한 보편적 내주와 생명 부여로 읽었습니다.
  alternative_readings:
  - 인간 영혼들 안에만 한정되는 의미
  - 시적 과장으로만 완화하는 읽기
  rationale: 앞절의 '만물'과 뒤의 '만물 안에'가 서로 호응하므로, 범위를 좁히지 않고 창조 전체에 대한 진술로 유지했습니다.
  doctrine_reference: 본문의 보편적 창조 신학을 보존
