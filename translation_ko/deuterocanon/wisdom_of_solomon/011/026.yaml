  naturalness: ‘당신’은 현대 표준 한국어에서 하나님을 향한 직접 호칭으로 다소 어색하거나 무례하게 들릴 여지가 있습니다. ‘주님께서는/주님의’으로 바꾸면 합쇼체의 격식과 자연스러운 성서 문체를 살릴 수 있습니다. 또한 ‘주재자여’보다 ‘주인이시여’가 Δέσποτα의 소유주·주인이라는 뜻을 더 자연스럽게 전달합니다.
