lexical_decisions:
- source_word: διώδευσαν
  english_pob_choice: They traveled through
  chosen_korean: 지나고
  alternatives_korean:
  - 여행하고
  - 통과하고
  lexicon: LSJ
  rationale: 복합동사는 어떤 지역을 가로질러 이동하는 뜻이므로, 문맥에 맞게 ‘지나고’로 옮겨 자연스러운 진행을 살렸습니다.
- source_word: ἔρημον
  english_pob_choice: wilderness
  chosen_korean: 광야
  alternatives_korean:
  - 황무지
  - 사막
  lexicon: LSJ
  rationale: ἐρημος는 사막보다 더 넓게 ‘황량한 들’이나 ‘광야’를 뜻할 수 있으므로, 출애굽 맥락을 살리되 과도하게 지형을 특정하지 않는 ‘광야’를 택했습니다.
- source_word: ἀοίκητον
  english_pob_choice: uninhabited
  chosen_korean: 사람이 살지 않는
  alternatives_korean:
  - 무인(無人)의
  - 인적이 없는
  lexicon: LSJ
  rationale: ‘거주하지 않는’이라는 뜻을 한국어로 직접 풀어, 단순한 황량함이 아니라 실제로 거주민이 없는 상태를 분명히 했습니다.
- source_word: ἀβάτοις
  english_pob_choice: trackless places
  chosen_korean: 길이 없는 곳들
  alternatives_korean:
  - 발길 닿지 않는 곳들
  - 접근할 수 없는 곳들
  - 길 없는 곳들
  lexicon: LSJ
  rationale: 이 형용사는 사람이 밟아 다닌 길이 없거나 다닐 수 없는 곳을 가리키므로, ‘trackless’의 이미지를 살려 ‘길이 없는 곳들’로 옮겼습니다.
theological_decisions:
- issue: 출애굽의 광야 이미지
  chosen_reading: 설명적 해석을 덧붙이지 않고, 이동과 야영의 구체적 장면을 그대로 유지했습니다.
  alternative_readings:
  - ‘광야에 진을 쳤습니다’처럼 더 해석적으로 옮길 수 있습니다.
  rationale: 원문은 신학적 해설보다 묘사에 가까우므로, 독자가 본문 자체의 역사적 이미지를 직접 읽도록 하는 편이 더 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
