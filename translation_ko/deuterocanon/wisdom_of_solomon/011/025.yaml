translation:
  language: ko
  text: 그분께서 뜻하지 않으셨다면, 어떻게든 남아 있을 수 있었겠습니까? 아니면 당신에게서 부름받지 않은 것이 어떻게 보존될 수 있었겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 분명하게는 ‘당신에게서 불려 나와 존재하게 된 것’일 수 있습니다. 그리스어는 단순히 ‘불린’이라고 말하지만, 문맥상 하나님의 창조적 부르심을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δὲ ἔμεινεν ἄν τι
  english_pob_choice: how could anything have remained
  chosen_korean: 어떻게든 남아 있을 수 있었겠습니까
  alternatives_korean:
  - 어떻게 아무것도 남아 있었겠습니까
  - 어떻게 무엇이든 남아 있을 수 있었겠습니까
  lexicon: LSJ
  rationale: 수사 의문으로서 ‘가능성 없음’을 드러내는 방향을 살리되, 현대 한국어에서 자연스럽게 들리도록 ‘남아 있을 수 있었겠습니까’로 옮겼습니다.
- source_word: εἰ μὴ σὺ ἠθέλησας
  english_pob_choice: if you had not willed it
  chosen_korean: 그분께서 뜻하지 않으셨다면
  alternatives_korean:
  - 당신께서 원하지 않으셨다면
  - 당신께서 뜻하지 않으셨다면
  lexicon: LSJ
  rationale: θέλω의 핵심을 ‘뜻하다/원하다’로 옮길 수 있으나, 여기서는 우주의 지속이 하나님의 의지에 달렸다는 점을 살려 ‘뜻하지 않으셨다면’으로 간결하게 표현했습니다.
- source_word: τὸ μὴ κληθὲν ὑπὸ σοῦ
  english_pob_choice: what had not been called by you
  chosen_korean: 당신에게서 부름받지 않은 것이
  alternatives_korean:
  - 당신이 부르지 않으신 것이
  - 당신에 의해 불리지 않은 것이
  lexicon: LSJ
  rationale: κληθέν은 단순히 ‘불린’보다 능동적 부르심을 받는 뉘앙스가 있어, 한국어에서는 ‘부름받다’로 옮겨 하나님의 주권적 호출을 드러냈습니다.
- source_word: διετηρήθη
  english_pob_choice: have been preserved
  chosen_korean: 보존될 수 있었겠습니까
  alternatives_korean:
  - 지켜질 수 있었겠습니까
  - 유지될 수 있었겠습니까
  lexicon: LSJ
  rationale: 동사는 단순 생존보다 ‘보존됨/지켜짐’의 의미가 강하므로, 앞절의 ‘남아 있다’와 짝을 이루게 하면서도 보존의 수동성을 살렸습니다.
theological_decisions:
- issue: τὸ μὴ κληθέν을 창조론적 ‘불려 나와 존재하게 된 것’으로 본문에 직접 풀어쓸지 여부
  chosen_reading: 본문에는 ‘부름받지 않은 것’이라고 두고, 창조적 소환의 함의는 직역 안에서만 열어 두었습니다.
  alternative_readings:
  - 당신에게서 불려 나와 존재하게 된 것이
  - 당신께서 존재하게 부르지 않으신 것이
  rationale: 원문은 단지 ‘불린’이라고만 말하므로, 창조론적 확장은 본문이 아니라 주해 차원에 두는 편이 원문 충실성과 신학적 긴장 보존에 맞습니다.
  doctrine_reference: 'DOCTRINE.md: Original-language primacy; Preserve theological tension rather than resolve it'
