translation:
  language: ko
  text: 당신께서 뜻하지 않으셨다면, 어떤 것이 남아 있을 수 있었겠습니까? 또는 당신께서 부르지 않으신 것이 어떻게 보존될 수 있었겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
