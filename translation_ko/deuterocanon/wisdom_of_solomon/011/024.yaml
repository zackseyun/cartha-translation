  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/024.yaml
  text: For you love all things that exist[a], and you detest none of the things you made; for if you had hated anything[b], you would not have fashioned it.
  footnotes:
  - marker: a
    text: Or 'abhor nothing' for 'detest none'; the Greek verb is strong and conveys revulsion or loathing.
    reason: lexical_alternative
  - marker: b
    text: Or 'you would not have made it'; 'fashioned' was chosen to reflect the more deliberate nuance of the second creation verb and to avoid flattening both Greek verbs into identical English where context allows distinction.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서는 존재하는 모든 것을 사랑하십니다. 주님께서는 당신께서 만드신 것들 가운데 아무것도 혐오하지 않으십니다. 만일 어떤 것을 미워하셨다면, 그것을 빚으시지 않았을 것이기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘혐오하다’는 βδελύσσομαι의 강한 감정적·도덕적 거부를 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘빚으시다’는 두 번째 동사 κατεσκεύασας의 더 의도적이고 세공된 제작 뉘앙스를 살린 표현입니다.
    reason: lexical_alternative
