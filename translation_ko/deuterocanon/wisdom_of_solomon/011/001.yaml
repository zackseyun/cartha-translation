lexical_decisions:
- source_word: Εὐόδωσεν
  english_pob_choice: prospered
  chosen_korean: 번영하게 하셨습니다
  alternatives_korean:
  - 성공하게 하셨습니다
  - 잘되게 하셨습니다
  lexicon: LSJ
  rationale: εὐοδόω는 ‘성공하게 하다, 잘되게 하다, 번영하게 하다’의 뜻이므로, 하나님의 주도적 행위를 살리면서도 한국어에서 자연스러운 ‘번영하게 하셨습니다’로 옮겼습니다.
- source_word: τὰ ἔργα αὐτῶν
  english_pob_choice: their works
  chosen_korean: 그들의 일
  alternatives_korean:
  - 그들의 행위
  - 그들의 업적
  lexicon: LSJ
  rationale: ἔργα는 문맥상 행적 전체를 가리킬 수 있지만, 이 절의 요약적 표현에는 ‘일’이 가장 직결되며 과도한 평가 뉘앙스도 피합니다.
- source_word: ἐν χειρὶ
  english_pob_choice: by the hand of
  chosen_korean: 손을 통해
  alternatives_korean:
  - 손으로
  - …의 손에 의해
  lexicon: LSJ
  rationale: 직역적인 ‘손으로’보다 한국어에서는 매개적 도구성을 드러내는 ‘손을 통해’가 자연스럽고, ‘by the hand of’의 중개자적 의미도 보존합니다.
- source_word: προφήτου ἁγίου
  english_pob_choice: a holy prophet
  chosen_korean: 거룩한 예언자
  alternatives_korean:
  - 성스러운 예언자
  - 거룩한 선지자
  lexicon: LSJ
  rationale: προφήτης는 구약 맥락에서 ‘예언자’가 가장 직접적이며, ἁγίου는 단순한 도덕적 경건함보다 하나님께 구별된 상태를 나타내므로 ‘거룩한’으로 옮겼습니다.
theological_decisions:
- issue: 본문이 암시하는 주체를 한국어에서 어떻게 처리할지
  chosen_reading: 주어를 ‘그분께서는’으로 드러내되, 본문에 없는 ‘하나님’이라는 명사를 덧붙이지는 않았습니다.
  alternative_readings:
  - 하나님께서는
  - 주님께서는
  rationale: 그리스어는 주어를 생략하고 문맥이 가리키는 주체로 읽히므로, 한국어에서는 자연스러운 지시대명사로 받되 원문보다 더 명시적인 신칭은 추가하지 않았습니다.
  doctrine_reference: '원문 우선 원칙: 문맥이 공급하는 주체는 반영하되, 본문에 없는 명사는 삽입하지 않습니다.'
- issue: 무명의 예언자 표지
  chosen_reading: ‘거룩한 예언자’로 유지하고 주석에서 주변 문맥상 모세 가능성을 밝힙니다.
  alternative_readings:
  - 모세
  - 그분의 거룩한 예언자
  rationale: 그리스어는 이 절에서 예언자의 이름을 제시하지 않으므로, 본문은 그 수준의 특정성만 유지하고 식별은 각주로 처리하는 것이 원문 충실합니다.
  doctrine_reference: 번역은 본문이 말하는 만큼만 말해야 하며, 확인되지 않은 특정 인물을 본문에 끼워 넣지 않습니다.
