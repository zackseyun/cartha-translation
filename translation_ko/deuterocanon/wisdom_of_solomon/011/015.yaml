    rationale: ‘천한 짐승들’도 가능하지만 현대어에서는 사회적 신분의 뉘앙스가 강할 수 있습니다. εὐτελής의 ‘하찮고 가치 없는’ 뜻을 ‘하찮은’으로 명료하게 반영하는 편이 좋습니다.
  revised_text: 그러나 그들의 불의에서 나온 어리석은 생각들에 대한 대가로[a], 그들은 그 생각들에 미혹되어 이성 없는 기어 다니는 것들과 하찮은 짐승들을 숭배하였으므로, 당신께서는 그들에게 형벌로[b] 이성 없는 동물들의 무리를 보내셨습니다[c].
