base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/015.yaml
  text: But in return for the foolish reasonings of their unrighteousness[a], by which, having been led astray, they worshiped irrational creeping things and worthless beasts, you sent upon them a multitude of irrational animals for punishment[c][b],
  footnotes:
  - marker: a
    text: Or 'senseless thoughts' for 'foolish reasonings.'
    reason: lexical_alternative
  - marker: b
    text: The Greek repeats the idea 'without reason' in both 'irrational creeping things' and 'irrational animals,' creating a rhetorical echo.
    reason: lexical_alternative
  - marker: c
    text: Or 'for retribution' or 'for vengeance' instead of 'for punishment.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들의 어리석은 추론과 그 불의에 대한 대가로[a], 곧 그들이 그릇된 길로 이끌려 무정한 기어 다니는 것들과 천한 짐승들을 숭배하였으므로, 당신께서는 그들에게 형벌로[b] 무정한 짐승들의 무리를 보내셨습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 불의에 대한 어리석은 생각들’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘응징으로’ 혹은 ‘보복으로’.
    reason: alternative_reading
  - marker: c
    text: 그리스어는 앞의 ‘무정한 기어 다니는 것들’과 뒤의 ‘무정한 짐승들’에서 같은 ‘이성 없음/무정함’의 어근을 반복합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λογισμῶν ἀσυνέτων
  english_pob_choice: foolish reasonings
  chosen_korean: 어리석은 추론
  alternatives_korean:
  - 어리석은 생각
  - 무의미한 추론
  lexicon: BDAG/LSJ
  rationale: λογισμοί의 인지적 성격을 살리면서도, 한국어에서 자연스러운 철학·도덕적 판단어인 ‘추론’으로 옮겨 하나님의 심판 근거가 되는 왜곡된 사고를 드러냈습니다.
- source_word: ἀδικίας αὐτῶν
  english_pob_choice: their unrighteousness
  chosen_korean: 그 불의
  alternatives_korean:
  - 그들의 불의
  - 그들의 불의함
  - 그들의 부정의
  lexicon: BDAG/LSJ
  rationale: ἀδικία의 윤리·신학적 무게를 살려 ‘불의’로 옮겼고, 문맥상 지시가 분명하므로 소유격을 한국어에서 간결하게 처리했습니다.
- source_word: ἄλογα ἑρπετὰ ... πλῆθος ἀλόγων ζῴων
  english_pob_choice: irrational creeping things ... a multitude of irrational animals
  chosen_korean: 무정한 기어 다니는 것들 ... 무정한 짐승들의 무리
  alternatives_korean:
  - 이성 없는 기어 다니는 것들 ... 이성 없는 동물들의 무리
  - 무분별한 기어 다니는 것들 ... 무분별한 짐승들의 무리
  lexicon: LSJ
  rationale: ἄλογος의 반복을 ‘무정한’으로 통일해 그리스어의 수사적 대구를 유지했고, ἑρπετά는 ‘기어 다니는 것들’, ζῷα는 ‘짐승들’로 구별해 본문의 대비를 살렸습니다.
- source_word: εἰς ἐκδίκησιν
  english_pob_choice: for punishment
  chosen_korean: 형벌로
  alternatives_korean:
  - 보복으로
  - 응징으로
  - 심판으로
  lexicon: BDAG/LSJ
  rationale: ἐκδίκησις는 보복·응징의 뜻을 가질 수 있지만, 여기서는 하나님의 न्याय적 행위로서의 결과를 드러내기 위해 ‘형벌로’가 가장 균형 잡힌 표현입니다.
theological_decisions:
- issue: ἄλογος 반복의 수사적 역설 보존
  chosen_reading: ‘무정한 ... 무정한’의 반복을 유지했습니다.
  alternative_readings:
  - 첫 항목은 ‘이성 없는’, 둘째는 ‘짐승 같은’으로 다양화하는 방식
  - 둘 다 ‘무분별한’으로 완화하는 방식
  rationale: 사람들이 무정한 피조물을 숭배한 데 대한 역으로, 무정한 짐승들이 심판 도구가 된다는 아이러니가 본문의 핵심 수사이므로 반복을 약화하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: 반복어와 수사적 긴장 보존'
