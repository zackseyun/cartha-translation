base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/015.yaml
  text: But in return for the foolish reasonings of their unrighteousness[a], by which, having been led astray, they worshiped irrational creeping things and worthless beasts, you sent upon them a multitude of irrational animals for punishment[c][b],
  footnotes:
  - marker: a
    text: Or 'senseless thoughts' for 'foolish reasonings.'
    reason: lexical_alternative
  - marker: b
    text: The Greek repeats the idea 'without reason' in both 'irrational creeping things' and 'irrational animals,' creating a rhetorical echo.
