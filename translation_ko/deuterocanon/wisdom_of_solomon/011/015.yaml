  - marker: c
    text: Or 'for retribution' or 'for vengeance' instead of 'for punishment.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들의 불의에서 나온 어리석은 생각들에 대한 대가로[a], 그들은 그 생각들에 미혹되어 이성 없는 기어 다니는 것들과 하찮은 짐승들을 숭배하였으므로, 당신께서는 그들에게 형벌로[b] 이성 없는 동물들의 무리를 보내셨습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 불의에서 나온 분별없는 생각들’로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘응징으로’ 혹은 ‘보복으로’로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 그리스어는 앞의 ‘이성 없는 기어 다니는 것들’과 뒤의 ‘이성 없는 동물들’에 같은 어근을 반복하여 사용합니다.
    reason: lexical_alternative
