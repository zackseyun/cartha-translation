revisions:
- from: 그들은 부재할 때나 현존할 때나 똑같이 고통을 받았습니다.[a]
  to: 그 자리에 없던 이들이나 있던 이들이나 똑같이 괴로움을 겪고 있었습니다.[a]
  rationale: The revision preserves the Greek contrast between absent and present persons, uses idiomatic modern formal Korean, and keeps ἐτρύχοντο broad enough to include affliction, distress, and being worn down. The imperfect is represented by ‘겪고 있었습니다,’ while ὁμοίως is retained by ‘똑같이.’
  reviewer_model: gpt-5.6-terra
