    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόντες
  english_pob_choice: those absent
  chosen_korean: 부재할 때
  alternatives_korean:
  - 멀리 떨어져 있을 때
  - 없는 이들이
  lexicon: LSJ
  rationale: ἀπόντες는 단순한 '부재한 상태'를 가리키므로, ‘부재할 때’가 현존하는 쪽과의 대조를 간결하게 살립니다.
- source_word: παρόντες
  english_pob_choice: those present
  chosen_korean: 현존할 때
  alternatives_korean:
  - 있을 때
  - 함께 있을 때
  lexicon: LSJ
  rationale: παρόντες의 기본 뜻인 '있는, حاضر한'을 살려 ‘현존할 때’로 옮겨, 앞의 ‘부재할 때’와 대구를 이루게 했습니다.
- source_word: ὁμοίως
  english_pob_choice: alike
  chosen_korean: 똑같이
  alternatives_korean:
  - 동일하게
  - 같이
  lexicon: LSJ
  rationale: ὁμοίως는 정도의 동등함을 나타내므로, 두 집단이 같은 방식으로 겪었음을 드러내는 ‘똑같이’가 적절합니다.
- source_word: ἐτρύχοντο
  english_pob_choice: were afflicted
  chosen_korean: 고통을 받았습니다
  alternatives_korean:
  - 괴로움을 당했습니다
  - 고통에 시달렸습니다
  - 괴롭힘을 당했습니다
  lexicon: LSJ
  rationale: τρώχω 계열 동사는 ‘짓눌리다/마모되다/고통받다’의 지속적 뉘앙스를 가지므로, 특정한 '고문'으로 좁히지 않고 지속적 고통을 드러내는 표현을 택했습니다.
theological_decisions:
- issue: ἐτρύχοντο의 고통을 얼마나 구체화할지
  chosen_reading: 일반적 고통으로 넓게 유지하여, 본문이 말하는 동등한 고난만 분명히 드러냅니다.
  alternative_readings:
  - 고문을 당했습니다
  - 괴롭힘을 당했습니다
  rationale: 문맥은 두 집단이 동일하게 고난을 겪었다는 점을 강조할 뿐, 고통의 양상을 더 좁혀 규정하지 않습니다. 따라서 본문이 허용하는 범위 안에서 넓게 번역하는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it; Original-language primacy over translation tradition.'
