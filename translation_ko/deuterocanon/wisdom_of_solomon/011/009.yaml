base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/009.yaml
  text: For when they were tested[a], though being disciplined with mercy, they learned how the ungodly were tormented while being judged in wrath[c][b];
  footnotes:
  - marker: a
    text: Or 'were tried'; the Greek can denote testing or proving. It does not primarily mean enticement to sin in this context.
    reason: lexical_alternative
  - marker: b
    text: Or 'being instructed' or 'being chastened' for 'being disciplined'; the Greek term can include education, training, and corrective discipline.
    reason: lexical_alternative
  - marker: c
    text: Or 'the wicked' for 'the ungodly'; the Greek especially highlights impiety toward God.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 시험을 받았을 때[a], 비록 자비로 징계를 받고 있었지만[b], 경건하지 않은 자들이[c] 진노 가운데 심판을 받으며 어떻게 고통당했는지를 알게 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘시험을 받다’는 여기서 죄에 대한 유혹보다 시련을 통한 검증을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘징계’는 교육, 훈련, 교정의 뜻을 함께 담을 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘경건하지 않은 자들’은 ‘악한 자들’보다 하나님에 대한 불경을 더 직접적으로 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειράσθησαν
  english_pob_choice: were tested
  chosen_korean: 시험을 받았을 때
  alternatives_korean:
  - 시험을 당했을 때
  - 검증을 받았을 때
  - 유혹을 받았을 때
  lexicon: BDAG
  rationale: 이 문맥의 πειράζω는 죄에 대한 유혹보다 시련을 통한 검증을 가리키므로, '시험을 받다'가 가장 자연스럽고 원문 의미를 잘 드러냅니다.
- source_word: ἐν ἐλέει παιδευόμενοι
  english_pob_choice: being disciplined with mercy
  chosen_korean: 자비로 징계를 받았지만
  alternatives_korean:
  - 자비 가운데 징계를 받았지만
  - 자비롭게 징계를 받았지만
  - 자비 안에서 교훈을 받았지만
  lexicon: BDAG
  rationale: ἐν ἐλέει는 징계의 방식과 범위를 함께 보이므로 '자비로'를 택했고, παιδεύω는 여기서 단순 교육보다 교정적 징계의 힘이 강해 '징계를 받다'로 옮겼습니다.
- source_word: ἀσεβεῖς
  english_pob_choice: the ungodly
  chosen_korean: 경건하지 않은 자들
  alternatives_korean:
  - 불경한 자들
  - 하나님을 두려워하지 않는 자들
  - 악한 자들
  lexicon: BDAG
  rationale: ἀσεβής는 단순한 도덕적 악보다 하나님께 대한 경건 없음과 불경을 강조하므로, 직역적이면서도 의미를 보존하는 '경건하지 않은 자들'로 옮겼습니다.
- source_word: κρινόμενοι ἐβασανίζοντο
  english_pob_choice: being judged in wrath ... were tormented
  chosen_korean: 진노 아래에서 심판을 받으며 고통당하는
  alternatives_korean:
  - 진노 가운데 심판을 받으며 고통받는
  - 진노 아래에서 재판을 받으며 괴로움을 당하는
  - 진노로 심판받아 고통받는
  lexicon: BDAG
  rationale: κρίνω는 여기서 최종적 정죄보다 '심판을 받다'가 적절하고, βασανίζω는 강한 고통을 뜻하므로 '고통당하다'로 옮겨 과도한 해석 없이 긴장을 유지했습니다.
theological_decisions:
- issue: 징계와 진노의 대비
  chosen_reading: 의인/이스라엘 쪽은 자비로운 징계로, 경건하지 않은 자들은 진노 아래의 심판과 고통으로 대비시켰습니다.
  alternative_readings:
  - 모두 단순한 시련으로 완화하는 읽기
  - 경건하지 않은 자들을 곧바로 '정죄받아 형벌을 받는' 것으로 강하게 확정하는 읽기
  rationale: 본문은 같은 사건의 성격을 자비로운 징계와 진노의 심판으로 분명히 구분하므로, 그 신학적 긴장을 유지하는 것이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
