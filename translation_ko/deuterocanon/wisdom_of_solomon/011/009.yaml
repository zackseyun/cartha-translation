  lexicon: BDAG
  rationale: 이 문맥의 πειράζω는 죄에 대한 유혹보다 시련을 통한 검증을 가리키므로, '시험을 받다'가 가장 자연스럽고 원문 의미를 잘 드러냅니다.
- source_word: ἐν ἐλέει παιδευόμενοι
  english_pob_choice: being disciplined with mercy
  chosen_korean: 자비로 징계를 받았지만
  alternatives_korean:
  - 자비 가운데 징계를 받았지만
  - 자비롭게 징계를 받았지만
