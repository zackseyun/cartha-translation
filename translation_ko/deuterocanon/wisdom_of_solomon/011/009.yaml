  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/009.yaml
  text: For when they were tested[a], though being disciplined with mercy, they learned how the ungodly were tormented while being judged in wrath[c][b];
  footnotes:
  - marker: a
    text: Or 'were tried'; the Greek can denote testing or proving. It does not primarily mean enticement to sin in this context.
    reason: lexical_alternative
  - marker: b
    text: Or 'being instructed' or 'being chastened' for 'being disciplined'; the Greek term can include education, training, and corrective discipline.
    reason: lexical_alternative
  - marker: c
    text: Or 'the wicked' for 'the ungodly'; the Greek especially highlights impiety toward God.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 시험을 받았을 때, 비록 자비로 징계를 받았지만, 경건하지 않은 자들이 진노 아래에서 심판을 받으며 고통당하는 방식을 알게 되었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘시험을 받다’는 여기서 죄에 대한 유혹보다 시련을 통한 검증을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘징계’는 교육, 훈련, 교정의 뜻을 함께 담을 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘경건하지 않은 자들’은 ‘악한 자들’보다 하나님에 대한 불경을 더 직접적으로 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειράσθησαν
  english_pob_choice: were tested
  chosen_korean: 시험을 받았을 때
  alternatives_korean:
