  lexicon: BDAG
  rationale: ἐν ἐλέει는 징계의 방식과 범위를 함께 보이므로 '자비로'를 택했고, παιδεύω는 여기서 단순 교육보다 교정적 징계의 힘이 강해 '징계를 받다'로 옮겼습니다.
- source_word: ἀσεβεῖς
  english_pob_choice: the ungodly
  chosen_korean: 경건하지 않은 자들
  alternatives_korean:
