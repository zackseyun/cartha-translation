  lexicon: BDAG
  rationale: ἀσεβής는 단순한 도덕적 악보다 하나님께 대한 경건 없음과 불경을 강조하므로, 직역적이면서도 의미를 보존하는 '경건하지 않은 자들'로 옮겼습니다.
- source_word: κρινόμενοι ἐβασανίζοντο
  english_pob_choice: being judged in wrath ... were tormented
  chosen_korean: 진노 아래에서 심판을 받으며 고통당하는
  alternatives_korean:
  - 진노 가운데 심판을 받으며 고통받는
  - 진노 아래에서 재판을 받으며 괴로움을 당하는
