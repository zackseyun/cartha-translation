  alternative_readings:
  - ‘무형의 물질에서 세상을 창조하셨으므로’
  - ‘형체 없는 물질에서 세상을 만드셨으므로’
  rationale: 본문의 관심은 창조 방식의 체계화가 아니라, 창조하신 분의 능력이 심판의 실행에도 충분하다는 논증에 있습니다. 따라서 문구의 철학적 배경은 살리되 교리적 결론은 열어 두는 번역이 적절합니다.
