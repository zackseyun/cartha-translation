  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ἐξ가 나타내는 출처·기원을 ‘형체 없는 물질에서’으로 옮기는 편이 ‘형체 없는 물질로’보다 정확합니다. 또한 κτίσασα는 ‘손’을 수식하므로, 한국어에서는 ‘세상을 창조하신 그분의 전능한 손’으로 재구성하여 그 관계를 자연스럽게 보존할 수 있습니다.
  naturalness: 현행 ‘손은 … 창조하셨으므로’는 ‘손’이 주어인데 높임 과거형이 결합되어 다소 부자연스럽습니다. 또한 ‘보내실 수 없지 않았습니다’는 원문의 완곡 부정을 반영하지만 한국어에서는 어색합니다. ‘보내실 수 없는 것은 아니었습니다’가 같은 완곡법을 더 자연스럽게 전달합니다.
  terminology: ‘전능한 손’, ‘세상’, ‘형체 없는 물질’, ‘사나운 사자들’은 적절합니다. 각주에서는 본문의 번역을 바꾸었으므로 대안 표현을 ‘형체 없는 물질로’로 조정하고, ‘밀어붙이면 안 됩니다’는 현대 합쇼체의 학술적 문맥에 맞게 더 절제된 표현으로 고쳤습니다.
