  lexicon: BDAG
  rationale: ἔλεος 계열 동사는 단순한 감정이 아니라 실제로 베푸는 자비를 뜻하므로, 현대 한국어에서 가장 자연스럽고 신학적 무게를 살리는 표현을 택했습니다.
