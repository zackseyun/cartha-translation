  rationale: 문장 끝의 εἰς μετάνοιαν이 앞의 동사를 해석하는 열쇠이므로, 죄를 부정하거나 즉각적 사면으로 평평하게 만들지 않고 회개 지향의 인내로 보존했습니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it
