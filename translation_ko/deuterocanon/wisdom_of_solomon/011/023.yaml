  rationale: 문맥상 인류 전체를 가리키는 포괄적 범위이므로, generic human sense를 드러내는 ‘모든 사람’이 가장 분명합니다.
- source_word: παρορᾷς
  english_pob_choice: you overlook
  chosen_korean: 그냥 지나치십니다
  alternatives_korean:
  - 간과하십니다
  - 못 본 체하십니다
  - 지나쳐 보십니다
  lexicon: BDAG
  rationale: 여기서는 죄를 무가치하다고 여긴다는 뜻이 아니라, 회개를 염두에 둔 유보적 관용을 뜻하므로, 일시적 보류의 뉘앙스를 살리는 표현을 택했습니다.
- source_word: εἰς μετάνοιαν
