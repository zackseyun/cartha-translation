  lexicon: BDAG
  rationale: 전치사 εἰς의 목적/지향을 한국어로 자연스럽게 옮기되, 회개가 하나님의 인내의 목적이라는 점을 분명히 했습니다.
theological_decisions:
- issue: '하나님의 죄에 대한 태도: 무시인가, 유보적 관용인가'
  chosen_reading: 하나님은 죄를 중요하지 않게 여기셔서가 아니라, 회개를 위한 여지를 남기시며 죄를 유보적으로 지나치십니다.
  alternative_readings:
  - 하나님은 죄를 그냥 용서하십니다
