  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/023.yaml
  text: But you have mercy on all[a], because you are able to do all things[b], and you overlook the sins of men for repentance.
  footnotes:
  - marker: a
    text: Or 'people' or 'human beings'; Greek 'men' here is generic for humanity.
    reason: lexical_alternative
  - marker: b
    text: '''Overlook'' here means to pass over for the time being in mercy, with a view to repentance, not to ignore sin as unimportant.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 주님께서는 모든 것을 하실 수 있으시므로 모든 사람에게 자비를 베푸시며, 사람들이 회개하도록 그들의 죄를 간과하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모든 사람’은 여기서 인류 전체를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘간과하십니다’는 죄를 중요하지 않게 여기시거나 죄를 보지 않으신다는 뜻이 아니라, 사람들이 회개하도록 즉시 심판하지 않고 관용을 베푸신다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεεῖς
