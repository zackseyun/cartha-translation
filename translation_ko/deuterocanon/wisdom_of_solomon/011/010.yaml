  source_fidelity: 대조 구조와 두 동사의 구별은 대체로 충실합니다. 다만 ἐξήτασας는 단순한 ‘살피다’보다 재판적 맥락에서의 면밀한 조사·심문에 가깝고, ὡς πατήρ/ὡς ἀπότομος βασιλεύς는 각각 하나님이 아버지와 왕의 방식으로 행하심을 더 분명히 드러내는 표현이 적절합니다.
