  - 판결하시며 조사하셨습니다
  - 정죄하시며 검토하셨습니다
  lexicon: LSJ
  rationale: 첫 분사와 둘째 동사의 구분을 유지하면서, 첫째는 법정적 불리 판결, 둘째는 면밀한 살핌으로 대응시켜 원문의 병행을 드러냈습니다.
theological_decisions:
