  rationale: ἀπότομος의 엄격하고 단호한 성격을 '엄한'으로 자연스럽게 옮겨, 왕의 재판적 엄중함을 유지했습니다.
- source_word: καταδικάζων ἐξήτασας
  english_pob_choice: condemning ... examined
  chosen_korean: 정죄하시며 살피셨습니다
