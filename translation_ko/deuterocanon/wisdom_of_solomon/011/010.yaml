theological_decisions:
- issue: 아버지 같은 훈계와 왕 같은 정죄의 대조
  chosen_reading: 하나님이 한쪽은 아버지처럼 교정하시고, 다른 쪽은 엄한 왕처럼 유죄 판결과 심문으로 다루신다는 대조를 그대로 살렸습니다.
  alternative_readings:
  - 두 절을 모두 일반적인 '시험'으로 평평하게 만들 수 있습니다.
  - 두 번째 절의 정죄 성격을 약화시켜 단순한 검토로만 읽을 수 있습니다.
  rationale: 본문은 같은 하나님의 행위라도 대상에 따라 아버지적 훈육과 왕적 심판을 구별하므로, 그 신학적 긴장을 완화하지 않고 보존했습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it.
