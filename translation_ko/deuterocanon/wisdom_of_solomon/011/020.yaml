  text: And even apart from these things, they could have fallen by a single breath, pursued by justice and winnowed by the breath of your power; but you have arranged all things by measure and number and weight.
  footnotes:
  - marker: a
    text: Or 'by one spirit' or 'by a single wind'; Greek πνεῦμα can mean 'breath,' 'wind,' or 'spirit.'
    reason: lexical_alternative
  - marker: b
    text: Or 'pursued by punishment' or 'driven by judgment'; Greek δίκη can denote justice, judgment, or penalty.
    reason: lexical_alternative
translation:
  language: ko
  text: 이런 일들을 빼고도 그들은 한 번의 숨결로 쓰러질 수 있었습니다 — 정의에 쫓기고 주님의 능력의 숨결에 키질을 당하면서 말입니다. 그러나 주님은 만물을 분량과 수와 무게로 정하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χωρὶς δὲ τούτων
  english_pob_choice: even apart from these things
  chosen_korean: 이런 일들을 빼고도
  alternatives_korean:
  - 이런 것들 외에도
  - 이것들과 상관없이
  lexicon: LSJ
  rationale: χωρίς + 속격의 ‘떨어져서, 빼고서’라는 대비를 살려, 앞선 심판들 외에도 다른 방식으로 멸하실 수 있음을 간결하게 드러냈습니다.
- source_word: ἐνὶ πνεύματι
  english_pob_choice: by one breath
  chosen_korean: 한 번의 숨결로
  alternatives_korean:
  - 한 영으로
  - 한 바람으로
  lexicon: LSJ
  rationale: 여기서는 구체적 물리 이미지가 강하므로 ‘숨결’이 πνεῦμα의 숨/바람 뜻을 살리면서도 ‘영’으로 과도하게 신학화하지 않습니다.
- source_word: ὑπὸ τῆς δίκης διωχθέντες
  english_pob_choice: pursued by justice
  chosen_korean: 정의에 쫓기고
  alternatives_korean:
  - 심판에 쫓기고
  - 형벌에 쫓기고
  lexicon: LSJ
  rationale: δίκη를 단순 결과로 좁히기보다, 의인화된 도덕·재판 질서의 추격으로 보아 ‘정의’로 옮겼습니다.
- source_word: λικμηθέντες
  english_pob_choice: winnowed
  chosen_korean: 키질을 당하면서
  alternatives_korean:
  - 키질되어
  - 까부러지면서
  lexicon: LSJ
  rationale: 곡식을 까불러 쭉정이를 가르는 농경 이미지를 한국어로 자연스럽게 살리되, 수동형과 파괴적 뉘앙스를 함께 담았습니다.
- source_word: μέτρῳ καὶ ἀριθμῷ καὶ σταθμῷ
  english_pob_choice: by measure and number and weight
  chosen_korean: 분량과 수와 무게로
  alternatives_korean:
  - 척도와 수와 저울로
  - 분량과 숫자와 무게로
  lexicon: LSJ
  rationale: 전승된 삼중 표현의 균형을 유지하면서, 각각의 낱말 의미가 현대 한국어에서 자연스럽게 읽히도록 했습니다.
theological_decisions:
- issue: πνεῦμα를 ‘영’으로 볼지 ‘숨결/바람’으로 볼지
  chosen_reading: 두 번 모두 ‘숨결’로 옮겨, 비인격적이지만 하나님의 능동적 파괴력을 나타내는 이미지로 유지했습니다.
  alternative_readings:
  - 영
  - 바람
  rationale: 문맥이 키질과 쓰러짐의 농경·물리 이미지와 결합하므로, ‘숨결’이 본문의 힘과 긴장을 가장 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: 원문 우선, 의미를 과도하게 신학화하지 말 것.'
- issue: δίκη의 의미를 ‘정의’로 둘지 ‘심판/형벌’로 둘지
  chosen_reading: ‘정의’로 두어 의인화된 추격의 인상을 살렸습니다.
  alternative_readings:
  - 심판
  - 형벌
  rationale: 본문은 단지 결과를 말하기보다 공적 질서가 추격하는 장면처럼 묘사하므로, ‘정의’가 가장 넓고도 원문에 가깝습니다.
  doctrine_reference: 'DOCTRINE.md: 중요한 어휘적 긴장은 풀이하지 말고 보존할 것.'
