  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/022.yaml
  text: For the whole world before you is like a speck on the scales[a], and like a drop of morning dew that falls upon the earth.
  footnotes:
  - marker: a
    text: Or 'like the turn of the balance' or 'like a tiny weight on the scales'; the Greek image emphasizes extreme slightness.
    reason: lexical_alternative
translation:
  language: ko
  text: 온 세상은 당신 앞에서 저울판 위의 작은 티끌과 같고, 땅에 내려앉은 아침 이슬 한 방울과 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘저울판 위의 작은 티끌’은 저울에서 거의 감지되지 않을 만큼 미세한 것을 가리킵니다. 그리스어 표현은 ‘저울의 미세한 기울어짐’ 또는 ‘아주 작은 저울추’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
