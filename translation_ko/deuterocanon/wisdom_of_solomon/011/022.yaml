translation:
  language: ko
  text: 당신 앞에서는 온 세상이 저울의 한 점 떨이와 같고, 땅에 내려앉는 아침 이슬 한 방울과 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘저울의 한 점 떨이’는 ‘저울의 턴(turn of the balance)’ 또는 ‘아주 작은 저울추’에 해당하는 표현으로, 극도의 미세함을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅλος ὁ κόσμος
  english_pob_choice: the whole world
  chosen_korean: 온 세상
  alternatives_korean:
  - 세상 전체
  - 전 세계
  lexicon: κόσμος
  rationale: κόσμος의 총체성을 자연스럽게 살리면서도, 하나님 앞에서의 비교라는 문맥에 맞게 한국어로는 ‘온 세상’이 가장 간결하고 읽기 쉽습니다.
- source_word: ἐναντίον σου
  english_pob_choice: before you
  chosen_korean: 당신 앞에서는
  alternatives_korean:
  - 당신 앞에
  - 당신의 시야에서는
  lexicon: ἐναντίον + σου
  rationale: 직역형 ‘앞에서’의 관계와 비교감을 유지하되, 한국어 문장에서는 주어 자리보다 ‘당신 앞에서는’이 시적 대비를 더 분명하게 드러냅니다.
- source_word: ῥοπὴ ἐκ πλαστίγγων
  english_pob_choice: a speck on the scales
  chosen_korean: 저울의 한 점 떨이
  alternatives_korean:
  - 저울 위의 작은 먼지
  - 저울의 한 점
  - 저울추의 미세한 움직임
  lexicon: ῥοπὴ, πλαστίγγων
  rationale: ῥοπὴ는 단순한 ‘작은 것’보다 저울에서 거의 감지되지 않는 미세함을 가리키므로, ‘한 점 떨이’로 극도의 경미함과 저울 이미지를 함께 살렸습니다.
- source_word: ῥανὶς δρόσου ὄρθρινὴ κατελθοῦσα ἐπὶ γῆν
  english_pob_choice: a drop of morning dew that falls upon the earth
  chosen_korean: 땅에 내려앉는 아침 이슬 한 방울
  alternatives_korean:
  - 땅에 떨어지는 아침 이슬 한 방울
  - 땅에 내리는 아침 이슬 한 방울
  lexicon: ῥανίς, δρόσος, ὄρθρινος, καταβαίνω
  rationale: ‘이슬 한 방울’로 ῥανίς와 δρόσος를 자연스럽게 합치고, ‘내려앉는’으로 하강성과 부드러움을 함께 살려 시적 이미지를 유지했습니다.
theological_decisions:
- issue: 하나님 앞에서의 세계의 상대적 미미함을 어떻게 표현할지
  chosen_reading: 추상적 ‘무(無)’로 풀지 않고, 두 개의 구체적 비유를 그대로 살려 상대적 미미함을 표현했습니다.
  alternative_readings:
  - 당신 앞에서는 아무것도 아닌 것 같습니다
  - 당신 앞에서 온 세상은 무에 가깝습니다
  rationale: 본문은 존재론적 평가보다 비교적·시적 진술을 사용하므로, 비유를 보존해 독자가 원문의 긴장을 그대로 느끼게 하는 편이 적절합니다.
  doctrine_reference: 원문 비유의 긴장 보존
