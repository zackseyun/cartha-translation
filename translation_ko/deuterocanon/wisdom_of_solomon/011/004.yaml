  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/004.yaml
  text: They were thirsty and called on you[a], and water was given to them from a sheer rock[b], and a remedy for thirst from hard stone.
  footnotes:
  - marker: a
    text: Or 'They thirsted and called upon you.'
    reason: lexical_alternative
  - marker: b
    text: The Greek literally says 'a remedy for thirst,' portraying the water as healing relief.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 목말라서 당신을 부르짖었고, 그들에게는 험한 바위에서 물이 주어졌으며, 굳은 돌에서 목마름을 위한 치료제가 나왔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 목말라서 당신을 불렀습니다.’
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 문자적으로 ‘목마름을 위한 치료제’라고 하며, 물을 치유적 해방으로 묘사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίψησαν
  english_pob_choice: They were thirsty
  chosen_korean: 목말라서
  alternatives_korean:
  - 목말랐습니다
  - 갈증을 느꼈습니다
  lexicon: BDAG
  rationale: 상태를 나타내는 aorist를 현대 한국어로 자연스럽게 풀어, 단순한 과거 행위보다 목마름의 처지를 드러냈습니다.
- source_word: ἐπεκαλέσαντό σε
  english_pob_choice: called on you
  chosen_korean: 당신을 부르짖었고
  alternatives_korean:
  - 당신을 불렀고
  - 당신께 호소했고
  - 당신을 불렀습니다
  lexicon: BDAG
  rationale: 본문의 기도적 부름을 살리기 위해 일반적인 ‘부르다’보다 절박한 호소를 나타내는 ‘부르짖다’를 택했습니다.
- source_word: ἐκ πέτρας ἀκροτόμου
  english_pob_choice: from a sheer rock
  chosen_korean: 험한 바위에서
  alternatives_korean:
  - 가파른 바위에서
  - 절벽 같은 바위에서
  - 날카롭게 깎인 바위에서
  lexicon: LSJ
  rationale: ἀκρότομος의 ‘가파르고 깎여 나온 듯한’ 뉘앙스를 한국어의 자연스러운 표현으로 옮기되, 물이 나올 수 없을 듯한 비정상성을 유지했습니다.
- source_word: ἄκος δίψης
  english_pob_choice: a remedy for thirst
  chosen_korean: 목마름을 위한 치료제
  alternatives_korean:
  - 갈증의 치료제
  - 목마름의 치료제
  - 갈증을 위한 치료
  lexicon: LSJ
  rationale: POB의 ‘remedy’ 해석을 따라 단순한 ‘물’로 평탄화하지 않고, 시적·치유적 비유를 살려 ‘치료제’로 옮겼습니다.
theological_decisions:
- issue: ‘water was given to them’의 수동태와 주체 비명시성
  chosen_reading: 주어를 드러내지 않고 ‘물이 주어졌으며’로 옮겨, 본문의 수동 구조를 유지했습니다.
  alternative_readings:
  - 당신께서 그들에게 물을 주셨으며
  - 그들에게 물이 주어졌습니다
  rationale: 그리스어 수동태의 절제를 보존하면서도, 문맥상 하나님이 공급하신다는 의미를 독자가 읽을 수 있게 했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ἄκος δίψης의 치료적 은유 유지
  chosen_reading: ‘목마름을 위한 치료제’로 옮겨, 물을 단순한 음료가 아니라 갈증을 치유하는 수단으로 제시했습니다.
  alternative_readings:
  - 갈증의 해소
  - 갈증의 치료
  rationale: 이 표현은 하나님의 공급을 생존용 자원 이상으로, 회복과 치유의 은혜로 묘사하므로 은유를 보존하는 쪽이 본문 의도를 더 잘 전달합니다.
  doctrine_reference: Translation philosophy §6
