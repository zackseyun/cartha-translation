base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/018.yaml
  text: And in her friendship there is good delight[a], and in the labors of her hands, unfailing wealth, and in companionship with her, prudence, and honor in sharing her words[c][b]. I went about seeking how I might take her to myself.
  footnotes:
  - marker: a
    text: Or 'in training together with her conversation/association, prudence.' The Greek compresses ideas of shared discipline and close association in a way that is difficult to mirror neatly in English.
    reason: lexical_alternative
  - marker: b
    text: Or 'good repute' instead of 'honor' for the Greek term denoting favorable public esteem.
    reason: lexical_alternative
  - marker: c
    text: '''Take her to myself'' may also be rendered ''acquire her for myself''; the wording preserves the personal appropriation of personified Wisdom without making the image explicitly marital.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분의 우정 안에는 좋은 즐거움이 있고[a], 그분의 손의 수고 안에는 없어지지 않는 부가 있으며, 그분과의 동반 연습 안에는 분별이 있고, 그분의 말들을 함께 나누는 데에는 명예가 있습니다[b][c]. 나는 그분을 내 것으로 삼으려고 찾아다녔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분과 함께하는 훈련/교제 안에는 분별이 있다’로 옮길 수 있습니다. συγγυμνασία와 ὁμιλία가 공유된 훈련과 친밀한 교제를 압축합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘좋은 평판’입니다. εὔκλεια는 명예와 함께 공적 호평을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘나의 것으로 삼다’는 ‘나를 위해 얻다/취하다’로도 옮길 수 있습니다. 지혜를 자기에게 귀속시키려는 개인적 appropriation을 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλίᾳ αὐτῆς
  english_pob_choice: in her friendship
  chosen_korean: 그분의 우정 안에는
  alternatives_korean:
  - 그분과의 우정 안에는
  - 그분의 친분 안에는
  lexicon: LSJ
  rationale: φιλία는 단순한 호감이 아니라 관계적 친밀함을 가리키므로, ‘우정’으로 옮겨 Wisdom과의 인격적 관계를 살렸습니다.
- source_word: τέρψις ἀγαθή
  english_pob_choice: good delight
  chosen_korean: 좋은 즐거움
  alternatives_korean:
  - 선한 기쁨
  - 좋은 기쁨
  lexicon: LSJ
  rationale: τέρψις는 즐거움/기쁨이며 ἀγαθή가 그 가치를 규정하므로, ‘좋은 즐거움’으로 선한 성격을 드러냈습니다.
- source_word: συγγυμνασίᾳ ὁμιλίας αὐτῆς
  english_pob_choice: companionship with her
  chosen_korean: 그분과의 동반 연습 안에는
  alternatives_korean:
  - 그분과의 함께함 안에는
  - 그분과의 친밀한 교제 안에는
  lexicon: LSJ
  rationale: συγγυμνασία는 ‘함께 훈련함/단련함’의 뜻이 강하고 ὁμιλία는 교제·대화의 뉘앙스를 가지므로, 두 요소를 함께 살려 ‘동반 연습’으로 비교적 직역했습니다.
- source_word: εὔκλεια ἐν κοινωνίᾳ λόγων αὐτῆς
  english_pob_choice: honor in sharing her words
  chosen_korean: 그분의 말들을 함께 나누는 데에는 명예가 있습니다
  alternatives_korean:
  - 그분의 말들을 나누는 데에는 좋은 평판이 있습니다
  - 그분의 말들에 참여하는 데에는 명성이 있습니다
  lexicon: LSJ
  rationale: εὔκλεια는 좋은 평판/명예이며 κοινωνία λόγων αὐτῆς는 말들에 대한 참여·공유를 뜻하므로, ‘명예’와 ‘함께 나누는’ 표현으로 의미를 분리해 살렸습니다.
- source_word: πλοῦτος ἀνεκλιπής
  english_pob_choice: unfailing wealth
  chosen_korean: 없어지지 않는 부
  alternatives_korean:
  - 끊이지 않는 부
  - 고갈되지 않는 부
  lexicon: LSJ
  rationale: ἀνεκλιπής는 ‘줄어들지 않는, 다하지 않는’ 뜻이어서, 재정적 이미지가 분명한 ‘부’를 쓰고 ‘없어지지 않는’으로 지속성을 보존했습니다.
- source_word: περιῆλθον ζητῶν ὅπως λάβω αὐτὴν εἰς ἐμαυτόν
  english_pob_choice: I went about seeking how I might take her to myself
  chosen_korean: 나는 그분을 내 것으로 삼으려고 찾아다녔습니다
  alternatives_korean:
  - 나는 그분을 내게로 취하려고 찾아다녔습니다
  - 나는 그분을 내 자신에게 받아들이려고 찾아다녔습니다
  lexicon: LSJ
  rationale: λάβω εἰς ἐμαυτόν은 단순한 ‘획득’보다 자기에게로의 appropriating을 뜻하므로, 인격적 소유의 뉘앙스를 살리면서도 지나친 혼인적 해석을 피하는 ‘내 것으로 삼다’를 택했습니다.
theological_decisions:
- issue: 지혜의 인격화와 여성 대명사 유지
  chosen_reading: 지혜를 추상명사로 평면화하지 않고, 원문의 여성적 인격화와 관계적 언어를 유지했습니다.
  alternative_readings:
  - 추상적 ‘지혜’로 비인격화하여 옮김
  - 혼인적 상징으로 단정하여 해석함
  rationale: 본문은 일관되게 여성 대명사와 관계적 어휘를 사용하므로, 이를 보존하는 것이 원문의 수사와 신학적 긴장을 가장 잘 드러냅니다.
  doctrine_reference: 원어 우선, 상징의 과잉 단정 자제
- issue: ‘내 것으로 삼다’의 소유성
  chosen_reading: ‘take her to myself’를 인격적 점유를 드러내되, 혼인이나 내면화로 단정하지 않는 표현으로 옮겼습니다.
  alternative_readings:
  - ‘아내로 맞이하다’처럼 혼인적 의미로 구체화
  - ‘내 안에 받아들이다’로 심리적 내면화
  rationale: 그리스어는 지혜를 자기에게 귀속시키려는 강한 열망을 말하지만, 본문 자체가 혼인을 명시하지는 않으므로 소유적 긴장만 유지했습니다.
  doctrine_reference: 본문의 비유적 범위를 넘지 않음
