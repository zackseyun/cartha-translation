theological_decisions:
- issue: σοφίας τὰ πάντα ἐργαζομένης의 범위
  chosen_reading: 지혜가 ‘만물을 이루어 내는’ 적극적 효력을 가진다고 넓게 옮기되, 창조만으로 제한하지는 않았습니다.
  alternative_readings:
  - 지혜가 만물을 창조합니다
  - 지혜가 만물을 만들어 냅니다
  - 지혜가 만사를 성취합니다
  rationale: '그리스어 participle은 지혜의 포괄적 কার্য성/효력은 분명히 하지만, 특정 교리적 세부(예: 무로부터의 창조)까지 반드시 지정하지는 않습니다. 따라서 본문이 허용하는 넓이를 유지했습니다.'
  doctrine_reference: 본문의 신학적 긴장을 보존하고, 필요 이상의 교리적 구체화를 피함
