translation:
  language: ko
  text: 만일 재물이 인생에서 바랄 만한 소유물이라면, 지혜보다 더 부유한 것이 무엇이겠습니까? 지혜는 만물을 이루어 내기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘만물을 성취하는’, ‘만물을 산출하는’ 뜻일 수 있습니다. 그리스어 표현은 폭이 넓어 지혜의 효과적 작용을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλοῦτός
  english_pob_choice: wealth
  chosen_korean: 재물
  alternatives_korean:
  - 부
  - 부유함
  - 재산
  lexicon: LSJ
  rationale: 물질적 풍요를 가리키는 말로, 현대 한국어에서 비교적 자연스럽고 본문의 논지를 분명하게 드러냅니다.
- source_word: ἐπιθυμητὸν κτῆμα
