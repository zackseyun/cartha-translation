    issue: The phrase ‘지혜는 만물을 이루어 내기 때문입니다’ turns the Greek attributive participle into a separate causal clause.
    rationale: 'τῆς τὰ πάντα ἐργαζομένης modifies σοφίας within the comparative question: ‘wisdom which/that works all things.’ Korean should retain this modifier rather than introduce ‘because.’'
  - severity: low
