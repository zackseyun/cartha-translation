  - 지혜보다 더 값진 것이 무엇이겠습니까
  lexicon: LSJ
  rationale: 비교급의 수사적 질문을 유지하기 위해 ‘더 부유한’으로 직역성을 살렸고, σοφίας는 문맥상 지혜로 일관되게 옮겼습니다.
- source_word: τῆς τὰ πάντα ἐργαζομένης
  english_pob_choice: which works all things
  chosen_korean: 만물을 이루어 내기 때문입니다
  alternatives_korean:
  - 만물을 일하기 때문입니다
