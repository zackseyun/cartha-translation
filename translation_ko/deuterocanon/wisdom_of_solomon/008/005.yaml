  - 소망할 만한 재산
  - 탐낼 만한 소유물
  lexicon: LSJ
  rationale: ἐπιθυμητὸν의 ‘바라다/원하다’와 κτῆμα의 ‘소유한 것’의 결합을 살리되, 과도하게 도덕화하지 않도록 중립적으로 옮겼습니다.
- source_word: τί σοφίας πλουσιώτερον
  english_pob_choice: what is richer than wisdom
  chosen_korean: 지혜보다 더 부유한 것이 무엇이겠습니까
  alternatives_korean:
  - 지혜보다 더 풍성한 것이 무엇이겠습니까
  - 지혜보다 더 값진 것이 무엇이겠습니까
  lexicon: LSJ
  rationale: 비교급의 수사적 질문을 유지하기 위해 ‘더 부유한’으로 직역성을 살렸고, σοφίας는 문맥상 지혜로 일관되게 옮겼습니다.
- source_word: τῆς τὰ πάντα ἐργαζομένης
  english_pob_choice: which works all things
  chosen_korean: 만물을 이루어 내기 때문입니다
  alternatives_korean:
  - 만물을 일하기 때문입니다
  - 만사를 이루기 때문입니다
  - 만물을 작동시키기 때문입니다
  lexicon: LSJ
  rationale: ἐργάζομαι의 폭넓은 의미(일하다/이루다/산출하다)를 반영하면서, 한국어에서 자연스럽고 신학적으로도 과도하게 한정되지 않는 표현을 택했습니다.
theological_decisions:
- issue: σοφίας τὰ πάντα ἐργαζομένης의 범위
  chosen_reading: 지혜가 ‘만물을 이루어 내는’ 적극적 효력을 가진다고 넓게 옮기되, 창조만으로 제한하지는 않았습니다.
  alternative_readings:
  - 지혜가 만물을 창조합니다
  - 지혜가 만물을 만들어 냅니다
  - 지혜가 만사를 성취합니다
  rationale: '그리스어 participle은 지혜의 포괄적 কার্য성/효력은 분명히 하지만, 특정 교리적 세부(예: 무로부터의 창조)까지 반드시 지정하지는 않습니다. 따라서 본문이 허용하는 넓이를 유지했습니다.'
  doctrine_reference: 본문의 신학적 긴장을 보존하고, 필요 이상의 교리적 구체화를 피함
