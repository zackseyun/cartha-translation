translation:
  language: ko
  text: 만일 재물이 인생에서 바랄 만한 소유물이라면, 만물을 이루어 내는 지혜[a]보다 더 부유한 것이 무엇이겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘만물을 성취하는’, ‘만물을 산출하는’으로 옮길 수 있습니다. 그리스어 표현은 폭이 넓어 지혜의 효과적인 작용을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλοῦτός
