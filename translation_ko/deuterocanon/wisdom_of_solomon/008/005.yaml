  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/005.yaml
  text: And if wealth is a desirable possession in life, what is richer than wisdom, which works all things?
  footnotes:
  - marker: a
    text: Or 'which accomplishes all things' or 'which produces all things.' The Greek expression is broad and emphasizes wisdom's effective agency in everything.
