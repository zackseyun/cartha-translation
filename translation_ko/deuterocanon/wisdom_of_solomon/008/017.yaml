  source_fidelity: 개정이 필요합니다. 초안의 ‘알게 되었습니다’는 헬라어 원문에 없는 인식의 결과를 덧붙입니다. λογισάμενος와 φροντίσας는 모두 내적으로 숙고하고 깊이 생각한 행위를 말하며, ὅτι절은 그 숙고의 내용입니다. 또한 συγγένεια의 친족성·친연성의 뉘앙스를 ‘친밀한 관계’보다 더 직접적으로 드러내는 편이 좋습니다.
  naturalness: ‘내 자신 안에서’는 현대 한국어에서 다소 직역투이고, ‘친밀한 관계 안에 불멸이 있다’도 부자연스럽습니다. ‘속으로’, ‘마음에 깊이 되새겼습니다’, ‘친연성에는’으로 다듬으면 합쇼체를 유지하면서 더 자연스럽습니다.
