base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/006.yaml
  text: And if understanding is effective[b][a], who among existing things is more skillful than she?
  footnotes:
  - marker: a
    text: Or 'prudence is at work' or 'prudence produces.' The Greek verb can emphasize active effectiveness or productive labor.
    reason: lexical_alternative
  - marker: b
    text: Literally 'who of the things that are is more a craftswoman than she?'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 만일 이해가 효과를 발휘한다면, 존재하는 것들 가운데 누가 그녀보다 더 솜씨가 있겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φρόνησις
  english_pob_choice: understanding
  chosen_korean: 이해
  alternatives_korean:
  - 분별
  - 실천적 지혜
  - 지혜
  lexicon: LSJ
  rationale: 문맥의 φρόνησις는 추상적 '지혜'보다 실천적으로 작동하는 이해·분별을 가리키므로, 한국어에서는 자연스러운 표준어인 '이해'로 옮겨 구별성을 살렸습니다.
- source_word: ἐργάζεται
  english_pob_choice: is effective
  chosen_korean: 효과를 발휘한다
  alternatives_korean:
  - 일한다
  - 생산한다
  - 작용한다
  - 효력을 낸다
  lexicon: LSJ
  rationale: 이 동사는 여기서 단순 노동이 아니라 어떤 능력이 실제 결과를 내는 작동성을 나타내므로, '효과를 발휘한다'로 옮겨 능동적 효력을 드러냈습니다.
- source_word: τῶν ὄντων
  english_pob_choice: among existing things
  chosen_korean: 존재하는 것들 가운데
  alternatives_korean:
  - 있는 것들 가운데
  - 존재하는 것들 중
  - 모든 존재 가운데
  lexicon: LSJ
  rationale: 직역하면 '있는 것들의'이지만, 존재론적 범위를 유지하면서도 한국어로 자연스럽게 읽히도록 '존재하는 것들 가운데'로 옮겼습니다.
- source_word: τεχνῖτις
  english_pob_choice: craftswoman
  chosen_korean: 솜씨가 있는 이
  alternatives_korean:
  - 장인
  - 기술자
  - 공예가
  - 솜씨꾼
  lexicon: LSJ
  rationale: τεχνῖτις는 숙련된 제작자를 뜻하므로 '솜씨가 있는 이'로 옮겨 기술적 능숙함을 살렸습니다. 한국어에서는 성별을 직접 드러내는 명사보다 본문의 여성 지시어 '그녀'와 함께 읽힐 때 자연스럽고, 과도하게 직업 성별화를 만들지 않습니다.
theological_decisions:
- issue: 의인화된 지혜의 여성 지시 유지
  chosen_reading: '''그녀''를 유지해 φρόνησις의 여성적 의인화를 살렸습니다.'
  alternative_readings:
  - 그것
  - 그 사람
  - 그
  rationale: 그리스어는 αὐτῆς와 τεχνῖτις로 여성형 대응을 분명히 보여 주므로, 이를 중성화하지 않고 유지하는 편이 원문 의미를 더 정확히 드러냅니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: φρόνησις와 σοφία의 구별
  chosen_reading: φρόνησις를 '이해'로 번역해 문맥의 '지혜'와 구별했습니다.
  alternative_readings:
  - 지혜
  - 분별
  - 신중함
  rationale: 이 절은 지혜 찬가 안에 있지만, 실제 어휘는 σοφία가 아니라 φρόνησις이므로, 한국어에서도 별개의 인지·실천 능력으로 구별해 옮기는 것이 원문에 충실합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 5
