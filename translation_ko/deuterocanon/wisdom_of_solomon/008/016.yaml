translation:
  language: ko
  text: 내 집에 들어가면 나는 그녀와 함께 쉬게 될 것입니다[a]. 그녀와의 교제에는 쓰라림이 없고, 그녀와 함께 사는 데에도 고통이 없으며, 오히려 기쁨과 즐거움이 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀 곁에서 쉬게 될 것입니다.’ 그리스어 동사는 지혜와 가까이 함께하는 휴식을 나타냅니다.
    reason: lexical_alternative
