  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/013.yaml
  text: And through her I will have immortality[b][a], and I will leave behind an everlasting remembrance to those after me.
  footnotes:
  - marker: a
    text: Or 'by her' or 'with her'; the pronoun refers to Wisdom personified as feminine.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'immortality' may be read as personal deathlessness or, in connection with the next clause, as enduring legacy; the Greek leaves the relationship open.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그녀를 통하여[a] 나는 불멸을[b] 가질 것이며, 내 뒤에 올 사람들에게 영원한 기억을 남길 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀로 말미암아’, ‘그녀와 함께’. 여기서 대명사는 여성으로 의인화된 지혜를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘불멸’은 개인의 죽지 않음을 뜻할 수도 있고, 뒤 절과 연결하여 보면 지속되는 유산이나 명성을 뜻할 수도 있습니다. 그 관계는 그리스어가 열어 둡니다.
    reason: alternative_reading
