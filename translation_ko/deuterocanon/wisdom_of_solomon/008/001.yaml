    text: 또는 ‘한 끝에서 다른 끝까지 힘차게 뻗습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: διατείνει
  english_pob_choice: reaches
  chosen_korean: 뻗어 나가며
  alternatives_korean:
  - 도달하며
  - 퍼져 나가며
  - 뻗습니다
  lexicon: LSJ
  rationale: 전체 범위를 가로질러 미치는 동작을 자연스럽게 살리면서, 단순한 정적 ‘확장’보다 능동적 도달의 뉘앙스를 유지합니다.
- source_word: ἀπὸ πέρατος εἰς πέρας
  english_pob_choice: from one end to the other
  chosen_korean: 한 끝에서 다른 끝까지
  alternatives_korean:
  - 끝에서 끝까지
  - 이 끝에서 저 끝까지
  - 한 경계에서 다른 경계까지
  lexicon: LSJ
  rationale: 총체적 범위를 나타내는 관용구이므로, 한국어에서도 양 끝을 분명히 드러내는 표현이 가장 직접적입니다.
- source_word: εὐρώστως
  english_pob_choice: mightily
  chosen_korean: 힘차게
  alternatives_korean:
  - 강하게
  - 유력하게
  - 기운차게
  lexicon: LSJ
  rationale: 강건함과 역동성을 함께 담으면서도 현대 한국어에서 과도하게 고풍스럽지 않은 표현입니다.
- source_word: διοικεῖ τὰ πάντα χρηστῶς
  english_pob_choice: governs all things well
  chosen_korean: 모든 것을 잘 다스립니다
  alternatives_korean:
  - 모든 것을 잘 통치합니다
  - 만물을 선하게 다스립니다
  - 모든 것을 훌륭히 관리합니다
  lexicon: LSJ
  rationale: διοικεῖ는 단순 관리보다 질서 있게 다스리는 의미가 강하므로 ‘다스립니다’가 자연스럽고, χρηστῶς는 여기서 ‘잘’로 옮겨 능숙함과 선함을 함께 열어 둡니다.
theological_decisions:
- issue: 의인화된 지혜의 여성 지칭
  chosen_reading: ‘그녀’로 유지하여 지혜의 여성적 인칭을 살렸습니다.
  alternative_readings:
  - ‘지혜’로 반복하여 인칭 대명사를 피함
  - 중성적으로 ‘그것’처럼 처리함
  rationale: 헬라어 문맥은 지혜를 여성 인칭으로 말하고 있으므로, 이를 평이하게 보존해 본문의 문학적·신학적 형상을 흐리지 않도록 했습니다.
  doctrine_reference: 원문 우선 원칙; 지혜의 의인화 보존
- issue: 지속적·전면적 통치의 의미
  chosen_reading: ‘다스립니다’로 옮겨 지혜가 만물을 질서 있게 주관하는 의미를 살렸습니다.
  alternative_readings:
  - ‘관리합니다’로 약화
  - ‘주재합니다’로 격상
  rationale: 문맥상 단순 행정이 아니라 창조 전체에 대한 지혜의 능동적 질서 부여를 말하므로, 지나치게 행정적이거나 추상적인 표현을 피했습니다.
  doctrine_reference: 지혜서의 우주적 지혜 개념
