- from: 무서운 폭군들은 내 말을 들으면 나를 두려워할 것이며, 많은 무리 가운데서는 내가 선하게 보일 것이고, 전쟁에서는 용감할 것입니다.[a][b]
  to: 무서운[a] 폭군들은 나에 대한 말을 들으면 나를 두려워할 것이며, 많은 무리 가운데서 내가 선하게[b] 보일 것이고, 전쟁에서는 용감할 것입니다.
