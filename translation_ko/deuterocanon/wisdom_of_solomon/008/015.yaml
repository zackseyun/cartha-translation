base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/015.yaml
  text: Fearsome tyrants will fear me when they hear[a]; among the multitude I will appear good[b], and in war courageous.
  footnotes:
  - marker: a
    text: Or 'fearsome tyrants.' The Greek adjective may describe the tyrants themselves as dreadful, not merely that they will become frightened.
    reason: lexical_alternative
  - marker: b
    text: Or 'I will be seen as noble/beneficent among the multitude.' The Greek ἀγαθός can suggest practical goodness in public leadership, not only moral goodness in the abstract.
    reason: lexical_alternative
translation:
  language: ko
  text: 무서운 폭군들은 내 말을 들으면 나를 두려워할 것이며, 많은 무리 가운데서는 내가 선하게 보일 것이고, 전쟁에서는 용감할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무서운’은 폭군들의 성격을 묘사할 수도 있고, 그들이 두려워하게 될 것을 말할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘선하게 보일 것이다’는 ‘고결하게/유익하게 보일 것이다’라는 공적·실질적 선함의 뉘앙스를 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβηθήσονταί με
  english_pob_choice: will fear me
  chosen_korean: 나를 두려워할 것이며
  alternatives_korean:
  - 나를 무서워할 것이며
  - 나를 두려워하게 될 것이며
  lexicon: BDAG
  rationale: 미래의 두려움을 자연스럽게 살리면서도, 주어인 폭군들이 대상인 ‘나’를 두려워한다는 직접성을 유지했습니다.
- source_word: τύραννοι φρικτοί
  english_pob_choice: fearsome tyrants
  chosen_korean: 무서운 폭군들
  alternatives_korean:
  - 두려운 폭군들
  - 공포스러운 폭군들
  - 폭군들
  lexicon: LSJ
  rationale: τύραννοι는 단순한 ‘통치자’보다 강한 전제적 뉘앙스가 있어 ‘폭군들’이 적절하며, φρικτοί의 위압적 성격은 ‘무서운’으로 옮겼습니다.
- source_word: ἐν πλήθει φανούμαι ἀγαθὸς
  english_pob_choice: among the multitude I will appear good
  chosen_korean: 많은 무리 가운데서는 내가 선하게 보일 것이고
  alternatives_korean:
  - 무리 가운데서 내가 좋게 보일 것이고
  - 많은 사람들 앞에서 내가 선할 것이고
  - 무리 가운데서 내가 선한 사람으로 드러날 것이고
  lexicon: BDAG
  rationale: ἀγαθός의 도덕적 ‘선함’과 공적 유익의 뉘앙스를 모두 열어 두기 위해 ‘선하게 보이다’로 번역했습니다.
- source_word: ἐν πολέμῳ ἀνδρεῖος
  english_pob_choice: in war courageous
  chosen_korean: 전쟁에서는 용감할 것입니다
  alternatives_korean:
  - 전쟁에서는 담대할 것입니다
  - 전쟁에서는 용맹할 것입니다
  - 전쟁에서 용감할 것입니다
  lexicon: BDAG
  rationale: ἀνδρεῖος는 용기/용맹을 뜻하므로 현대 한국어에서 자연스럽고 성중립적인 ‘용감하다’를 사용했습니다.
theological_decisions:
- issue: 공적 선함과 전쟁에서의 용기를 병치하는 왕적 자기표현
  chosen_reading: 이 절은 화자가 다수 앞에서의 선함과 전쟁에서의 용기를 함께 제시하는 왕적/지도자적 이상을 그대로 드러냅니다.
  alternative_readings:
  - 일반적인 도덕적 자기소개로 완화해 읽을 수 있습니다.
  - 정치적·군사적 이상화 언어로 더 강하게 읽을 수 있습니다.
  rationale: 헬라어는 공중 앞의 선함과 전쟁의 용기를 병렬로 두므로, 그 긴장을 해설 없이 보존하는 것이 원문에 가장 충실합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
