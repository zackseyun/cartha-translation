  - 폭군들
  lexicon: LSJ
  rationale: τύραννοι는 단순한 ‘통치자’보다 강한 전제적 뉘앙스가 있어 ‘폭군들’이 적절하며, φρικτοί의 위압적 성격은 ‘무서운’으로 옮겼습니다.
- source_word: ἐν πλήθει φανούμαι ἀγαθὸς
  english_pob_choice: among the multitude I will appear good
  chosen_korean: 많은 무리 가운데서는 내가 선하게 보일 것이고
  alternatives_korean:
  - 무리 가운데서 내가 좋게 보일 것이고
  - 많은 사람들 앞에서 내가 선할 것이고
  - 무리 가운데서 내가 선한 사람으로 드러날 것이고
  lexicon: BDAG
  rationale: ἀγαθός의 도덕적 ‘선함’과 공적 유익의 뉘앙스를 모두 열어 두기 위해 ‘선하게 보이다’로 번역했습니다.
- source_word: ἐν πολέμῳ ἀνδρεῖος
  english_pob_choice: in war courageous
  chosen_korean: 전쟁에서는 용감할 것입니다
  alternatives_korean:
  - 전쟁에서는 담대할 것입니다
  - 전쟁에서는 용맹할 것입니다
  - 전쟁에서 용감할 것입니다
  lexicon: BDAG
  rationale: ἀνδρεῖος는 용기/용맹을 뜻하므로 현대 한국어에서 자연스럽고 성중립적인 ‘용감하다’를 사용했습니다.
theological_decisions:
- issue: 공적 선함과 전쟁에서의 용기를 병치하는 왕적 자기표현
  chosen_reading: 이 절은 화자가 다수 앞에서의 선함과 전쟁에서의 용기를 함께 제시하는 왕적/지도자적 이상을 그대로 드러냅니다.
  alternative_readings:
  - 일반적인 도덕적 자기소개로 완화해 읽을 수 있습니다.
  - 정치적·군사적 이상화 언어로 더 강하게 읽을 수 있습니다.
  rationale: 헬라어는 공중 앞의 선함과 전쟁의 용기를 병렬로 두므로, 그 긴장을 해설 없이 보존하는 것이 원문에 가장 충실합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
