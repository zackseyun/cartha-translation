base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/008.yaml
  text: And if anyone longs even for much experience[a], she knows the things of old and can infer the things to come; she understands turns of speech and solutions to riddles[b]; she knows beforehand signs and wonders and the outcomes of seasons and times.
  footnotes:
  - marker: a
    text: Or 'much experience,' 'extensive learning,' or 'great expertise.'
    reason: lexical_alternative
  - marker: b
    text: Or 'can conjecture what is to come' or 'can foresee the future.' The Greek verb here is weaker than the later 'knows beforehand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또 누군가가 많은 경험을 바라기까지 한다면[a], 그녀는 옛일들을 알고 장차 올 일을 추론할 수 있으며[b], 말의 묘한 전환과 수수께끼의 풀이를 이해하고, 표징과 이적과 시기와 때에 따른 결과를 미리 압니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘많은 경험’, ‘광범위한 학식’, ‘큰 전문성’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘장차 올 일을 짐작할 수 있으며’ 혹은 ‘미래를 내다볼 수 있으며’로 옮길 수 있습니다. 여기의 그리스어 동사는 뒤의 ‘미리 압니다’보다 약합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολυπειρίαν
  english_pob_choice: much experience
  chosen_korean: 많은 경험
