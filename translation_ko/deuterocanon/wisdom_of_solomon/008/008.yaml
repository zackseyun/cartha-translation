base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/008.yaml
  text: And if anyone longs even for much experience[a], she knows the things of old and can infer the things to come; she understands turns of speech and solutions to riddles[b]; she knows beforehand signs and wonders and the outcomes of seasons and times.
  footnotes:
  - marker: a
    text: Or 'much experience,' 'extensive learning,' or 'great expertise.'
    reason: lexical_alternative
  - marker: b
    text: Or 'can conjecture what is to come' or 'can foresee the future.' The Greek verb here is weaker than the later 'knows beforehand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 만약 누군가가 많은 경험을 갈망한다면[a], 그녀는 옛것들을 알고 장차 올 것들을 추론할 수 있으며, 말의 굽이침과 수수께끼의 풀이를 이해하고[b], 표징과 이적, 그리고 시기와 때의 결과를 미리 압니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '많은 경험','광범위한 학식','큰 전문성'으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '장차 올 일을 짐작할 수 있으며' 혹은 '미래를 내다볼 수 있으며'로 옮길 수 있습니다. 여기의 그리스어 동사는 뒤의 '미리 압니다'보다 약합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολυπειρίαν
  english_pob_choice: much experience
  chosen_korean: 많은 경험
  alternatives_korean:
  - 광범위한 경험
  - 풍부한 경험
  - 많은 체험
  lexicon: LSJ
  rationale: πολυ-가 더한 넓고 많은 경험의 뜻을 살려, 학문적 지식만이 아니라 실제적 축적까지 포함하는 자연스러운 표현으로 옮겼습니다.
- source_word: τὰ ἀρχαῖα
  english_pob_choice: the things of old
  chosen_korean: 옛것들
  alternatives_korean:
  - 옛일들
  - 고대의 일들
  - 태고의 것들
  lexicon: LSJ
  rationale: 문맥상 오래된 일이나 옛 시기의 사물·사건을 가리키므로, 시간적 의미를 간결하게 살린 표현을 택했습니다.
- source_word: στροφὰς λόγων
  english_pob_choice: turns of speech
  chosen_korean: 말의 굽이침
  alternatives_korean:
  - 말의 전개
  - 수사의 굽이
  - 말의 변주
  lexicon: LSJ
  rationale: 직역하면 말의 꺾임이나 굽어짐이지만, 한국어에서는 수사적 굴절과 미묘한 표현을 살리기 위해 '굽이침'으로 옮겼습니다.
- source_word: λύσεις αἰνιγμάτων
  english_pob_choice: solutions to riddles
  chosen_korean: 수수께끼의 풀이
  alternatives_korean:
  - 수수께끼의 해답
  - 수수께끼의 해석
  - 수수께끼를 푸는 일
  lexicon: LSJ
  rationale: λύσεις는 '풂/해결'의 뜻이고 αἰνίγματα는 수수께끼나 난제이므로, 해결의 결과를 분명히 드러내는 표현으로 옮겼습니다.
- source_word: προγινώσκει
  english_pob_choice: knows beforehand
  chosen_korean: 미리 압니다
  alternatives_korean:
  - 미리 알 수 있습니다
  - 미리 아십니다
  - 예지합니다
  lexicon: LSJ
  rationale: 앞선 εἰκάζειν의 '추론하다'보다 강한 선지식이므로, 지나치게 신학화하지 않으면서 시간적 선행성을 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 지혜의 의인화와 대명사 처리
  chosen_reading: 지혜를 여성 인칭 대명사로 이어 가는 원문 흐름을 살려 '그녀'로 옮겼습니다.
  alternative_readings:
  - 지혜는
  - 그것은
  rationale: 문맥 전체가 지혜를 인격화된 여성으로 제시하므로, 이를 평면적 추상명사로 바꾸지 않고 원문의 문학적 장치를 보존했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: εἰκάζειν과 προγινώσκει의 구분
  chosen_reading: εἰκάζειν은 '추론할 수 있다'로, προγινώσκει는 '미리 압니다'로 구분해 옮겼습니다.
  alternative_readings:
  - 장차 올 것을 미리 압니다
  - 장차 올 일을 예측합니다
  rationale: 본문은 단순한 짐작과 선행적 앎을 구별하므로, 두 동사의 강도를 평탄화하지 않고 내부 대비를 유지했습니다.
  doctrine_reference: Translation philosophy §1, §5
