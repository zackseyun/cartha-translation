  - marker: b
    text: Or 'an exhortation' or 'a consolation' in cares and grief.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 나는 그녀를 나와 함께 살도록 데려오기로 결정하였습니다[a]. 나는 그녀가 나에게 좋은 일들에 조언해 줄 이가 되고, 근심과 슬픔 가운데 위로가 될 것임을 알았기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀를 아내로 삼다’, ‘그녀와 결혼하다’로도 옮길 수 있습니다. 그러나 헬라어는 이 구절에서 더 문자적으로 ‘함께 살기 위해 데려오다’라고 말합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘권면’이나 ‘격려’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκρινα τοίνυν
  english_pob_choice: So I decided
  chosen_korean: 그러므로 나는 ... 결정하였습니다
  alternatives_korean:
