    rationale: ἀγαγέσθαι는 단순히 상대를 살게 하다라기보다 화자가 그를 공유된 삶을 위해 데려오거나 맞이하기로 결심한 것입니다. ‘나와 함께 살도록 데려오기로’가 이를 자연스럽고 과도한 혼인 명시 없이 전달합니다.
