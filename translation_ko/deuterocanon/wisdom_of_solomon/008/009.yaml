  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/009.yaml
  text: So I decided to take her to live with me[a], knowing that she would be a counselor of good things for me[b], and a comfort in cares and grief.
  footnotes:
  - marker: a
    text: Or 'to marry her' / 'to take her as a wife'; the Greek more literally says 'to take her for living together,' using personified Wisdom imagery without an explicit marriage term in this verse.
    reason: alternative_reading
  - marker: b
    text: Or 'an exhortation' or 'a consolation' in cares and grief.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 나는 그녀를 함께 살게 하기로 결정하였습니다[a]. 나는 그녀가 나에게 좋은 것들의 조언자가 되고, 근심과 슬픔 가운데 위로가 될 것을 알았기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀를 아내로 삼다’, ‘그녀와 결혼하다’로도 옮길 수 있습니다. 그러나 헬라어는 이 구절에서 더 문자적으로 ‘함께 살기 위해 데려오다’라고 말합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘권면’이나 ‘격려’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκρινα τοίνυν
  english_pob_choice: So I decided
  chosen_korean: 그러므로 나는 ... 결정하였습니다
  alternatives_korean:
  - 그래서 나는 ... 정하였습니다
  - 그러므로 나는 ... 판단하였습니다
  lexicon: LSJ; BDAG
  rationale: τοίνυν의 결론적 연결을 ‘그러므로’로, ἔκρινα의 결단 의미를 ‘결정하였습니다’로 옮겨 현대적이면서도 판정적 뉘앙스를 살렸습니다.
- source_word: ἀγαγέσθαι πρὸς συμβίωσιν
  english_pob_choice: to take her to live with me
  chosen_korean: 그녀를 함께 살게 하다
  alternatives_korean:
  - 그녀를 데려다가 동거하게 하다
  - 그녀를 나와 함께 살게 하다
  lexicon: LSJ
  rationale: 직역하면 ‘함께 삶을 위해 데려오다’이지만, 본문의 공유된 삶/동거 이미지를 자연스러운 한국어로 옮겨 결혼을 명시하지 않으면서도 관계적·가정적 힘을 보존했습니다.
- source_word: σύμβουλος ἀγαθῶν
  english_pob_choice: a counselor of good things
  chosen_korean: 좋은 것들의 조언자
  alternatives_korean:
  - 좋은 일들의 조언자
  - 선한 것들의 상담자
  lexicon: LSJ
  rationale: σύμβουλος는 ‘조언자/상담자’의 의미가 분명하며, ἀγαθῶν은 선행뿐 아니라 유익한 것 전반을 가리킬 수 있어 ‘좋은 것들’로 넓게 유지했습니다.
- source_word: παραίνεσις φροντίδων καὶ λύπης
  english_pob_choice: a comfort in cares and grief
  chosen_korean: 근심과 슬픔 가운데 위로
  alternatives_korean:
  - 근심과 슬픔에 대한 권면
  - 근심과 슬픔 가운데 격려
  lexicon: LSJ
  rationale: παραίνεσις는 문맥상 강한 훈계보다 지지·권면·위로의 성격이 강하므로, ‘근심과 슬픔’과 결합되는 효과를 살려 ‘위로’로 옮겼습니다.
