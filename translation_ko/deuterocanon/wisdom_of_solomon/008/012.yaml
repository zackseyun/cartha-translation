translation:
  language: ko
  text: 제가 잠잠할 때에는 그들이 저를 기다릴 것이고, 제가 말할 때에는 그들이 귀를 기울일 것이며, 제가 더 길게 말할 때에는 그들이 손을 자기 입에 댈 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 몸짓은 침묵이나 말의 절제를 나타내며, 화자에 대한 존경 또는 경외를 표현할 수도 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: σιγῶντά με
  english_pob_choice: When I am silent
  chosen_korean: 제가 잠잠할 때에는
  alternatives_korean:
