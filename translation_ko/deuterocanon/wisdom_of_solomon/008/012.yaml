  lexicon: LSJ
  rationale: 비교적/확장적 의미의 ἐπὶ πλεῖον을 조건문이 아니라 ‘더 길게’로 살려, 영어 POB의 교정 의도를 반영했습니다.
- source_word: χεῖρα ἐπιθήσουσιν ἐπὶ στόμα αὐτῶν
  english_pob_choice: they will lay a hand on their mouth
  chosen_korean: 그들이 손으로 자기 입을 가릴 것입니다
  alternatives_korean:
