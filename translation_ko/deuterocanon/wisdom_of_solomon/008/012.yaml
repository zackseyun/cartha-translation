  lexicon: LSJ
  rationale: 단순한 청취보다 주의 깊은 경청의 뉘앙스를 살리기 위해 ‘귀를 기울이다’를 택했습니다.
- source_word: λαλοῦντος ἐπὶ πλεῖον
  english_pob_choice: when I speak at greater length
  chosen_korean: 제가 더 길게 말할 때에는
  alternatives_korean:
