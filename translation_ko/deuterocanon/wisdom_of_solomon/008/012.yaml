  lexicon: LSJ
  rationale: σιγάω의 상태를 자연스럽게 옮기되, 합쇼체 문맥에서 너무 문어적인 ‘침묵’보다 ‘잠잠하다’가 태도와 분위기를 더 잘 살립니다.
