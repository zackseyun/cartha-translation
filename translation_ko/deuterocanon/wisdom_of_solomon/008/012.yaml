  text: 제가 잠잠할 때에는 그들이 저를 기다릴 것이고, 제가 말할 때에는 그들이 귀를 기울일 것이며, 제가 더 길게 말할 때에는 그들이 손으로 자기 입을 가릴 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
