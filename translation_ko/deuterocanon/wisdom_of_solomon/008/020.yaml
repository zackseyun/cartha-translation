lexical_decisions:
- source_word: μᾶλλον δὲ
  english_pob_choice: Rather
  chosen_korean: 그보다 오히려
  alternatives_korean:
  - 오히려
  - 차라리
  lexicon: LSJ
  rationale: 앞선 진술을 바로잡거나 더 강하게 잇는 전환이므로, 한국어에서는 ‘그보다 오히려’로 자연스러운 대조를 살렸습니다.
- source_word: ἀγαθὸς ὢν
