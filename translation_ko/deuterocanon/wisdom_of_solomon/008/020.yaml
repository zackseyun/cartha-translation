  - 선한 상태로
  lexicon: LSJ
  rationale: 화자의 도덕적 성격을 가리키므로 ‘선한’이 직접적이며, 분사구는 한국어에서 ‘~로서’로 매끄럽게 풀었습니다.
- source_word: ἦλθον
  english_pob_choice: I came
  chosen_korean: 들어왔습니다
  alternatives_korean:
  - 왔습니다
  - 들어갔습니다
  - 들어왔습니다
  lexicon: LSJ
  rationale: 직역은 ‘왔습니다’이지만, 문맥상 몸 안으로 들어오는 의미가 드러나므로 본문 의미를 과도하게 해석하지 않는 범위에서 ‘들어왔습니다’로 옮겼습니다.
- source_word: ἀμίαντον
  english_pob_choice: undefiled
  chosen_korean: 흠 없는
  alternatives_korean:
  - 더럽혀지지 않은
  - 깨끗한
  - 부정되지 않은
  lexicon: LSJ
  rationale: 순결·오염 없음의 뜻을 살리되 한국어 독자가 즉시 이해할 수 있는 성경적 표현으로 ‘흠 없는’을 택했습니다.
theological_decisions:
- issue: ἦλθον의 단순 동사 의미와 ‘몸 안으로 들어옴’의 문맥적 함의
  chosen_reading: 본문을 평이하게 번역하되, 전생·선재 또는 영혼의 육체 प्रवेश 같은 해석을 번역문에 고정하지 않았습니다.
  alternative_readings:
  - 나는 몸에 들어왔습니다
  - 나는 몸으로 태어났습니다
  rationale: 그리스어는 단지 ‘왔다’고 말하며, 문맥상 육화된 삶에 들어옴을 시사할 수는 있지만 그 신학적 쟁점은 본문이 직접 규정하지 않습니다. 따라서 번역은 텍스트의 긴장을 유지해야 합니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
