theological_decisions:
- issue: ἦλθον의 단순 동사 의미와 ‘몸 안으로 들어옴’의 문맥적 함의
  chosen_reading: 본문을 평이하게 번역하되, 전생·선재 또는 영혼의 육체 प्रवेश 같은 해석을 번역문에 고정하지 않았습니다.
  alternative_readings:
  - 나는 몸에 들어왔습니다
  - 나는 몸으로 태어났습니다
  rationale: 그리스어는 단지 ‘왔다’고 말하며, 문맥상 육화된 삶에 들어옴을 시사할 수는 있지만 그 신학적 쟁점은 본문이 직접 규정하지 않습니다. 따라서 번역은 텍스트의 긴장을 유지해야 합니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
