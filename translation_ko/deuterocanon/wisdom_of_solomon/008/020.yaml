  terminology: ‘선한 이로서’는 ἀγαθὸς ὢν의 도덕적 성격을 무리 없이 반영합니다. ‘흠 없는’은 ἀμίαντον의 오염·부정 없음보다 결함 없음으로 이해될 수 있으므로 ‘더럽혀지지 않은’으로 조정합니다.
