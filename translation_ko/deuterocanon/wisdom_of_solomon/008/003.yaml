  - ‘지혜’라고만 반복하기
  rationale: 본문은 지혜를 여성형으로 의인화하므로, 인칭을 유지해야 문학적·신학적 긴장이 보존됩니다.
  doctrine_reference: Personification of Wisdom; gender-accurate over gender-neutral
- issue: δεσπότης의 구별된 칭호 보존
  chosen_reading: ‘만물의 주권자’로 옮겨 κύριος와 구별되는 δεσπότης의 어감을 살렸습니다.
  alternative_readings:
