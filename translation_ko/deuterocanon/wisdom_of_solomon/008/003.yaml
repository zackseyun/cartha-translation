lexical_decisions:
- source_word: εὐγένειαν
  english_pob_choice: nobility
  chosen_korean: 고귀함
  alternatives_korean:
  - 귀한 출신
  - 고상한 품격
  - 고귀한 성품
  lexicon: LSJ
  rationale: 혈통보다 지혜의 품격과 존엄을 가리키는 뜻을 살리기 위해, ‘고귀함’으로 옮겨 지위와 성품의 폭을 함께 담았습니다.
- source_word: δοξάζει
