  chosen_korean: 영광을 받습니다
  alternatives_korean:
  - 영광스럽게 됩니다
  - 영화롭게 됩니다
  - 영광을 얻습니다
  lexicon: LSJ
  rationale: 주어가 ‘함께 사는 삶’이므로, 그 결과를 자연스럽게 드러내는 수동 표현 ‘영광을 받다’를 택했습니다.
- source_word: συμβίωσις θεοῦ ἔχουσα
  english_pob_choice: by living together with God
  chosen_korean: 하나님과 함께 사는 삶
  alternatives_korean:
  - 하나님과 더불어 사는 삶
  - 하나님과의 동거
  - 하나님과의 동행
  lexicon: LSJ
  rationale: συμβίωσις의 핵심인 ‘함께 삶/공동 생활’을 살리되, 한국어로는 ‘함께 사는 삶’이 가장 자연스럽고 직역의 냄새를 줄이지 않으면서도 원뜻을 보존합니다.
- source_word: ὁ πάντων δεσπότης
  english_pob_choice: the Master of all
  chosen_korean: 만물의 주권자
  alternatives_korean:
  - 만물의 주인
  - 만물의 주인님
  - 만물의 주
  lexicon: LSJ
  rationale: δεσπότης는 단순한 ‘주’보다 소유·통치의 강한 뉘앙스를 가지므로, ‘주권자’로 옮겨 lexical distinction을 살렸습니다.
