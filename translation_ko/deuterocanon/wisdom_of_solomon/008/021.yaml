base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/021.yaml
  text: 'But knowing that I would not otherwise be self-controlled unless God gave it—and that this also was insight[a], to know whose gift it was—I appealed to the Lord and implored him, and I said with my whole heart:'
  footnotes:
  - marker: a
    text: Or 'to know whose grace it was.' The Greek χάρις can mean 'grace,' 'favor,' or 'gift'; here it refers to the divine source of self-control.
    reason: lexical_alternative
translation:
  language: ko
  text: '그러나 하나님께서 주시지 않으시면 내가 달리 절제할 수 없다는 것을 알고, 이것 또한 그것이 누구의 선물인지를 아는 지혜로운 일이었습니다[a]. 나는 주님께 청원하고 그분께 간청하며, 온 마음을 다하여 이렇게 말하였습니다:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것이 누구의 은총인지를 아는 것’. 그리스어 χάρις는 ‘은총’, ‘호의’, ‘선물’을 뜻할 수 있으며, 여기서는 자기 절제를 주시는 분이 누구신지를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  english_pob_choice: knowing
  chosen_korean: 알게 되었으며
  alternatives_korean:
  - 알고
  - 깨닫고
  lexicon: BDAG
  rationale: aorist 분사로서 앞선 인식의 전환을 나타내므로, 단순한 상태보다 인식의 도달을 드러내는 ‘알게 되었으며’로 옮겼습니다.
- source_word: ἐγκρατής
  english_pob_choice: self-controlled
  chosen_korean: 절제할 수 없고 / 절제할 수 없다는 것
  alternatives_korean:
  - 자기 절제를 할 수 없고
  - 스스로를 다스릴 수 없고
  lexicon: BDAG
  rationale: ἐγκρατής는 욕망을 제어하는 도덕적 절제를 뜻하므로, 현대 한국어에서 자연스럽고 본문의 윤리를 살리는 ‘절제’로 옮겼습니다.
- source_word: χάρις
  english_pob_choice: gift
  chosen_korean: 은총
  alternatives_korean:
  - 은혜
  - 선물
  - 호의
  lexicon: BDAG
  rationale: 이 문맥의 χάρις는 추상적 교리어보다 하나님이 주시는 주어진 선물을 가리키므로, 한국어에서는 교회적·문학적 뉘앙스를 살리면서도 원문의 수여성을 드러내는 ‘은총’으로 처리했습니다.
- source_word: ἐνέτυχον τῷ κυρίῳ
  english_pob_choice: I appealed to the Lord
  chosen_korean: 주님께 나아가 간청하였고
  alternatives_korean:
  - 주님께 호소하였고
  - 주님께 청원하였고
  - 주님께 빌었고
  lexicon: BDAG
  rationale: ἐντυγχάνω는 기도 맥락에서 단순한 접근보다 청원·호소를 뜻하므로, 서정적이면서도 간구의 방향을 보존하는 표현으로 옮겼습니다.
- source_word: ἐδεήθην
  english_pob_choice: implored
  chosen_korean: 간청하였고
  alternatives_korean:
  - 애원하였고
  - 간구하였고
  - 탄원하였고
  lexicon: BDAG
  rationale: δέομαι의 강한 간청을 반영하되 지나치게 과장되지 않도록 ‘간청하다’를 택했습니다.
theological_decisions:
- issue: χάρις를 ‘은혜’로 둘지 ‘은총/은사/선물’로 구체화할지
  chosen_reading: 은총
  alternative_readings:
  - 은혜
  - 선물
  - 호의
  rationale: 문맥상 자아 수양의 근원이 하나님께서 주시는 것임을 말하므로, 한국어 독자가 ‘은혜’를 구원론적 기술어로만 좁게 읽지 않도록 하면서도 주어진 호의를 담는 ‘은총’이 가장 균형적입니다.
  doctrine_reference: Wisdom 8:21의 χάρις는 문맥상 ‘주어진 선물/호의’의 성격이 강하며, 본문은 자기 절제의 출처가 하나님께 있음을 강조합니다.
