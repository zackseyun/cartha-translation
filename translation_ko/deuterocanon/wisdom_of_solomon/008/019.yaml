  lexicon: LSJ
  rationale: 동사는 본래 ‘제비로 할당받다’의 뉘앙스를 가지지만, 여기서는 수동적으로 부여받은 상태를 뜻하므로 ‘받았습니다’가 가장 자연스럽습니다.
- source_word: ἀγαθῆς
