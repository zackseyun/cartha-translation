  rationale: POB 영어는 ‘soul’을 택했지만, 한국어에서는 본문 전체의 자연스러움을 위해 ‘영’을 사용했습니다. 다만 Wisdom 문맥의 ανθρωπολογικό 무게는 유지했습니다.
- source_word: ἔλαχον
  english_pob_choice: I received
  chosen_korean: 받았습니다
  alternatives_korean:
