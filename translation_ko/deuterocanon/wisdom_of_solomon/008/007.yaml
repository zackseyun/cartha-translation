base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/007.yaml
  text: And if anyone loves righteousness[a], her labors are virtues; for she teaches self-control and prudence, righteousness and courage[b], than which nothing is more useful for human beings in life.
  footnotes:
  - marker: a
    text: Or 'justice.' The Greek word can denote both moral righteousness and justice.
    reason: lexical_alternative
  - marker: b
    text: Greek 'her labors ... she teaches,' preserving the feminine personification of righteousness in this verse.
    reason: cultural_note
translation:
  language: ko
  text: 또 누구든지 의[a]를 사랑한다면, 의의 수고는 덕입니다. 의는 절제와 분별, 의와 용기를 가르치기 때문입니다.[b] 사람들에게 살아가는 데 이보다 더 유익한 것은 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘의’는 이 문맥에서 도덕적 의로움과 정의를 함께 아우를 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘그녀의 수고… 그녀가 가르치니’라고 하여, 의를 여성적으로 인격화합니다. 한국어 본문은 ‘의의 수고’, ‘의는’이라고 하여 그 인격화된 지시 대상을 분명히 합니다.
    reason: cultural_note
lexical_decisions:
- source_word: δικαιοσύνην
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 정의
  - 의로움
  lexicon: LSJ
  rationale: POB의 기본 선택인 righteousness를 한국어의 신학적·윤리적 핵심어인 ‘의’로 옮겨, 넓은 도덕적 의미를 유지했습니다.
- source_word: οἱ πόνοι ταύτης
  english_pob_choice: her labors
  chosen_korean: 그 수고
  alternatives_korean:
  - 그의 수고
  - 그 열매
  - 그 노력
  lexicon: LSJ
  rationale: πόνοι는 수고/노고를 뜻하므로 ‘수고’가 직접적입니다. 여기서는 의의 여성 인칭을 한국어에서 무리하게 재현하기보다 문맥의 자연스러움을 우선했습니다.
- source_word: ἀρεταί
  english_pob_choice: virtues
  chosen_korean: 덕
  alternatives_korean:
  - 미덕
  - 덕목
  lexicon: LSJ
  rationale: 헬라스 윤리 문맥의 ἀρεταί를 한국어의 간결한 대응어 ‘덕’으로 옮겨, 뒤따르는 덕목 목록과도 잘 맞게 했습니다.
- source_word: σωφροσύνην
  english_pob_choice: self-control
  chosen_korean: 절제
  alternatives_korean:
  - 자기통제
  - 온건함
  lexicon: LSJ
  rationale: 절제는 σωφροσύνη의 전통적이면서도 현재 한국어에서 이해되는 대응어로, 마음의 절제와 행실의 절제를 함께 담을 수 있습니다.
- source_word: φρόνησιν
  english_pob_choice: prudence
  chosen_korean: 분별
  alternatives_korean:
  - 지혜
  - 신중함
  lexicon: LSJ
  rationale: φρόνησις는 실천적 판단력과 분별을 가리키므로, 덕목 목록 속에서 ‘분별’이 가장 간결하고 자연스럽습니다.
- source_word: ἀνδρείαν
  english_pob_choice: courage
  chosen_korean: 용기
  alternatives_korean:
  - 담대함
  - 굳셈
  lexicon: LSJ
  rationale: ἀνδρεία는 용기/굳센 담대함을 뜻하지만, 한국어에서는 성별 뉘앙스가 없는 ‘용기’가 소스를 잘 전달합니다.
- source_word: χρησιμώτερον
  english_pob_choice: more useful
  chosen_korean: 더 유용한
  alternatives_korean:
  - 더 유익한
  - 더 쓸모 있는
  lexicon: LSJ
  rationale: 비교급 χρησιμώτερον을 자연스러운 현대 한국어로 옮겼습니다. 지혜문학의 격언적 결말에 어울리게 ‘유용한’을 유지했습니다.
theological_decisions:
- issue: 의의 여성적 인격화
  chosen_reading: 한국어에서는 여성 대명사를 반복하지 않고 문장 전체의 의미를 살리는 방식으로 옮겼습니다.
  alternative_readings:
  - ‘그녀의 수고’
  - ‘그녀가 가르치니’
  rationale: 그리스어는 δικαιοσύνη를 여성형으로 이어 받으며 인격화하지만, 한국어는 조사와 지시어만으로 같은 효과를 자연스럽게 재현하기 어렵습니다. 본문 의미를 해치지 않는 범위에서 인격화의 부담을 줄였습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 마지막 절의 비교구문
  chosen_reading: ‘인간에게 삶에서 이보다 더 유용한 것은 없습니다’로 옮겼습니다.
  alternative_readings:
  - ‘이보다 더 유익한 것은 없습니다’
  - ‘삶에서 인간에게 더 나은 것은 없습니다’
  rationale: 원문의 최상급적 비교구문을 한국어에서 자연스럽게 풀어, POB의 ‘than which nothing is more useful’ 의미를 보존했습니다.
  doctrine_reference: DOCTRINE.md style and comparative constructions
