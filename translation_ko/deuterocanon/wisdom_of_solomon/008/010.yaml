translation:
  language: ko
  text: 나는 젊은이로서 무리 가운데서 영광을 얻고, 연장자들에게서 존경을 받을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나는 무리 가운데서 명성을 얻고, 젊지만 연장자들에게서 존경을 받을 것입니다.’ 그리스어의 ‘젊은이’라는 표현은 압축되어 있어, ‘젊은이로서’ 또는 ‘젊은 나이에도/젊지만’으로 이해될 수 있습니다.
    reason: lexical_alternative
