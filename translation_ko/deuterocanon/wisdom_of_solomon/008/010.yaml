  source_fidelity: 핵심 의미는 대체로 반영했지만, παρὰ πρεσβυτέροις는 여기서 연장자들에게서 받는 인정·존경의 뜻으로 옮기는 편이 더 정확합니다. 또한 ὁ νέος는 문법적으로 압축된 동격/상태 표지이므로, 본문에서 단정적인 양보절로 풀기보다 ‘젊은이로서’로 두고 각주에서 ‘젊지만’의 가능성을 밝혀 두는 것이 안전합니다.
  naturalness: ‘늙은이들’은 현대 표준 한국어에서 다소 거칠거나 폄하적으로 들릴 수 있고, ‘존귀를 얻다’도 이 문맥에서는 자연스럽지 않습니다. ‘연장자들에게서 존경을 받다’는 격식 있는 문체에서 자연스럽고 의미도 분명합니다.
  terminology: δόξα는 ‘영광’, τιμή는 ‘존경’으로 구별할 수 있습니다. πρεσβύτεροι는 제도적 직분인 ‘장로’가 아니라 나이 많은 이들이므로 ‘연장자들’이 적절합니다. ὄχλοι는 ‘무리’로 유지할 수 있습니다.
