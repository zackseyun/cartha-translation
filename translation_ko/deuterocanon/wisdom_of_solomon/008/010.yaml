  chosen_korean: 비록 나는 젊은이입니다
  alternatives_korean:
  - 젊은이로서
  - 나는 젊은이입니다
  lexicon: LSJ
  rationale: 정관사와 함께 쓰인 ὁ νέος는 문맥상 ‘젊은 사람’이라는 신분 표지이면서, 영어 주석처럼 ‘젊은 나이에도/비록 젊지만’의 뜻이 압축되어 있습니다. 한국어에서는 이를 자연스럽게 풀어 관계를 드러냈습니다.
