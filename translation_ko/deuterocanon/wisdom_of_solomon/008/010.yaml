  text: And as a young man I will have glory among crowds[a], and honor before elders,
  footnotes:
  - marker: a
    text: Or 'I will have renown among multitudes, and esteem from elders, though I am young.' The Greek phrase with ὁ νέος is compressed and may be understood either as 'the young man' or adverbially, 'as a young man / though young.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 나는 무리 가운데서 영광을 얻고, 늙은이들 앞에서 존귀를 얻을 것입니다. 비록 나는 젊은이입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나는 무리들 가운데서 명성을 얻고, 젊지만 늙은이들에게서 존중을 받을 것입니다.’ 그리스어 구절은 압축되어 있어 ‘젊은이’로도, ‘젊은 나이에도/비록 젊지만’으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕξω
  english_pob_choice: I will have
  chosen_korean: 얻을 것입니다
  alternatives_korean:
  - 가질 것입니다
  - 지닐 것입니다
  lexicon: LSJ
  rationale: ἔχω의 미래형으로, 여기서는 단순 소유보다 공개적으로 획득하는 뉘앙스가 살아 있어 ‘얻다’가 가장 자연스럽습니다.
- source_word: δόξαν
  english_pob_choice: glory
  chosen_korean: 영광
  alternatives_korean:
  - 명성
  - 명예
  lexicon: LSJ
  rationale: δόξα는 명성·명예·영광을 아우르지만, 지혜문학의 격조를 살리기 위해 ‘영광’을 택했습니다.
- source_word: ἐν ὄχλοις
  english_pob_choice: among crowds
  chosen_korean: 무리 가운데서
  alternatives_korean:
  - 무리들 가운데
  - 군중 속에서
  lexicon: LSJ
  rationale: ὄχλοι는 단순 군중이 아니라 다수의 사람들 앞이라는 공적 장면을 가리키므로 ‘무리 가운데서’가 간결하고 적절합니다.
- source_word: τιμήν
  english_pob_choice: honor
  chosen_korean: 존귀
  alternatives_korean:
  - 존중
  - 명예
  lexicon: LSJ
  rationale: τιμή는 존중과 명예를 뜻하지만, 앞의 δόξα와 구별되게 보다 격조 높은 ‘존귀’로 옮겨 두 표현의 차이를 살렸습니다.
- source_word: παρὰ πρεσβυτέροις
  english_pob_choice: before elders
  chosen_korean: 늙은이들 앞에서
  alternatives_korean:
  - 장로들 앞에서
  - 어른들 앞에서
  lexicon: LSJ
  rationale: πρεσβύτεροι는 문자적으로 ‘더 나이 많은 이들’입니다. 본문은 제도적 장로보다 연장자들을 가리키는 공적 평가를 말하므로 ‘늙은이들 앞에서’가 원문의 사회적 대비를 가장 직접적으로 드러냅니다.
- source_word: ὁ νέος
  english_pob_choice: as a young man
  chosen_korean: 비록 나는 젊은이입니다
  alternatives_korean:
  - 젊은이로서
  - 나는 젊은이입니다
  lexicon: LSJ
  rationale: 정관사와 함께 쓰인 ὁ νέος는 문맥상 ‘젊은 사람’이라는 신분 표지이면서, 영어 주석처럼 ‘젊은 나이에도/비록 젊지만’의 뜻이 압축되어 있습니다. 한국어에서는 이를 자연스럽게 풀어 관계를 드러냈습니다.
theological_decisions:
- issue: ὁ νέος의 압축된 표현을 어떻게 살릴지
  chosen_reading: 마지막 절반을 ‘비록 나는 젊은이입니다’로 풀어, 젊음에도 불구하고 얻는 영예라는 역설을 드러냈습니다.
  alternative_readings:
  - 나는 젊은이로서
  - 나는 젊지만
  rationale: 영어 POB 주석이 지적하듯 이 구는 명사구와 부사적 의미가 압축되어 있어, 한국어에서도 단순 호칭보다 대비를 분명히 하는 풀이가 본문의 힘을 더 잘 전달합니다.
  doctrine_reference: 지혜문학의 인간적 탁월성과 연령 역전의 주제
