base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/030.yaml
  text: But justice will pursue them both[a], because they thought wrongly about God by giving heed to idols, and they swore unjustly in deceit[c][b], despising holiness.
  footnotes:
  - marker: a
    text: Or 'the demands of justice' or 'just punishment will pursue them both.'
    reason: lexical_alternative
  - marker: b
    text: That is, they formed a false view of God by attaching themselves to idols.
    reason: lexical_alternative
  - marker: c
    text: Or 'despising piety' or 'showing contempt for what is holy.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 정의로운 보응이 두 가지 일 모두에 대하여 그들을 찾아올 것입니다[a]. 그들이 우상들에게 마음을 두어 하나님에 관해 그릇되이 생각하였고, 거룩함을 멸시하면서 속임수로 불의하게 맹세하였기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘정의로운 것들이 두 가지 모두에 대하여 그들을 뒤따를 것입니다’입니다. ‘두 가지’는 문맥상 이어서 언급되는 우상에 마음을 둔 일과 불의하게 맹세한 일을 가리킵니다. 또는 ‘마땅한 보응이 두 경우 모두에 그들을 찾아올 것입니다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμφότερα
