  lexicon: LSJ
  rationale: ὁσιότης는 단순한 내면 경건보다 거룩함/경건함의 품위를 함께 지니므로, 독자가 즉시 이해할 수 있는 ‘거룩함’으로 옮기되 경멸의 강도를 보존했습니다.
theological_decisions:
- issue: τὰ δίκαια의 범위
  chosen_reading: ‘정의’는 두 잘못을 추적하는 응보적 질서를 가리키지만, 본문이 단지 처벌만이 아니라 정의의 요구 전체를 말할 수 있게 열어 둡니다.
  alternative_readings:
  - ‘의로운 벌’로 좁혀 읽을 수 있습니다
  - ‘정의의 요구’로 더 추상적으로 읽을 수 있습니다
  rationale: 영문 POB도 justice와 just punishment 사이의 긴장을 유지하므로, 한국어도 그 긴장을 보존하기 위해 ‘정의’와 ‘뒤쫓을 것입니다’를 결합했습니다.
