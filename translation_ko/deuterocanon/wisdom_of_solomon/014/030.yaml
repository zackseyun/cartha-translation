translation:
  language: ko
  text: 그러나 정의가 그들 둘[a]을 뒤쫓을 것입니다. 그들이 우상들에게 마음을 두어 하나님에 대해 잘못 생각하였고, 또 속임수 가운데 불의하게 맹세하며 거룩함을 멸시하였기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
