    text: 또는 ‘정의의 요구가 그들 둘을 뒤쫓을 것입니다’, 혹은 ‘의로운 벌이 그들 둘을 뒤쫓을 것입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμφότερα
