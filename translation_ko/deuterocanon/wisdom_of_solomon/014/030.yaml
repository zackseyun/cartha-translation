  lexicon: LSJ
  rationale: προσχόντες는 단순히 바라본 정도가 아니라 주의를 두고 달라붙는 태도를 뜻하므로, 우상숭배의 방향성을 드러내는 자연스러운 한국어로 ‘마음을 두어’를 택했습니다.
- source_word: καταφρονήσαντες ὁσιότητος
  english_pob_choice: despising holiness
  chosen_korean: 거룩함을 멸시하였기 때문입니다
