  rationale: 앞뒤 문맥에서 지적된 두 잘못을 가리키는 중성 복수의 요지를 한국어에서 자연스럽게 살리기 위해 ‘그들 둘’로 옮겼습니다.
- source_word: μετελεύσεται τὰ δίκαια
  english_pob_choice: justice will pursue
  chosen_korean: 정의가 ... 뒤쫓을 것입니다
  alternatives_korean:
