  lexicon: LSJ
  rationale: τὰ δίκαια는 단순한 추상명사 ‘정의’만이 아니라 정의의 요구와 결과를 함께 가리킬 수 있으므로, ‘뒤쫓다’로 추적·응보의 이미지를 살리되 과도하게 ‘심판’으로 좁히지 않았습니다.
- source_word: προσχόντες εἰδώλοις
  english_pob_choice: by giving heed to idols
  chosen_korean: 우상들에게 마음을 두어
  alternatives_korean:
