translation:
  language: ko
  text: 모든 위험에서[a] 구원하실 수 있음을 보여 주시니, 기술이 없는[b] 사람도 배에 오를 수 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 것에서’. 헬라어는 곧바른 항해 상황보다 더 넓게 말하므로, 문맥상 ‘모든 위험에서’가 뜻을 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘기술 없이’ 혹은 ‘항해술 없이’.
    reason: lexical_alternative
