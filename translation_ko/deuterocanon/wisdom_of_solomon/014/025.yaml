translation:
  language: ko
  text: 그리고 모든 것이 뒤섞여 있습니다. 피와 살인, 도둑질과 속임수, 부패, 불성실, 소란, 위증, 그리고 선한 것에 대한 혼란이 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘피와 살인’은 직역에 가깝고, 문맥상 ‘유혈과 살인’ 또는 ‘유혈 사태와 살인’으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘선한 것에 대한 혼란’은 난해한 그리스어 구절 θόρυβος ἀγαθῶν을 가능한 한 직역한 것입니다. ‘선한 것들의 소란’ 또는 ‘좋은 것들에 대한 소동’으로도 옮길 수 있습니다.
    reason: alternative_reading
