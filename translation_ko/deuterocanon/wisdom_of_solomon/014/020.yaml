  source_fidelity: 전반적으로 원문의 대조 구조와 의미를 충실히 반영합니다. 다만 πρὸ ὀλίγου는 ‘조금 전까지만 해도’처럼 바로 직전까지 지속되었다는 뜻보다 ‘얼마 전에는/얼마 전에’라는 시간적 대조를 나타냅니다. 이를 바로잡는 것이 안전합니다.
