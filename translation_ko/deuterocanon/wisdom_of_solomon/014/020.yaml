  english_pob_choice: the multitude
  chosen_korean: 그 무리
  alternatives_korean:
  - 그 군중
  - 많은 사람들
  lexicon: LSJ
  rationale: 집합적 다수의 의미를 살리면서도 한국어에서 자연스럽고 문맥에 맞는 중립적 표현으로 옮겼습니다.
- source_word: ἐφελκόμενον
