  - 숭배할 대상
  lexicon: LSJ
  rationale: σέβασμα의 핵심인 ‘경배/숭배의 대상’ 의미를 유지하면서, 본문이 단순한 존중이 아니라 종교적 숭배로 전락했음을 드러냅니다.
theological_decisions:
- issue: σέβασμα의 종교적 강도
  chosen_reading: ‘숭배의 대상’으로 옮겨, 이전에 사람으로 존중받던 존재가 종교적 경배의 대상으로 바뀌는 비판을 보존했습니다.
  alternative_readings:
  - ‘우상’으로 더 강하게 번역할 수 있습니다.
  - ‘성상’ 또는 ‘신상’으로 구체화할 수 있습니다.
  rationale: 그리스어는 대상의 형상보다 숭배 행위의 전환을 강조하므로, 한국어에서도 너무 좁게 규정하지 않고 원문의 긴장을 살렸습니다.
  doctrine_reference: 원문의 신학적 긴장 보존; 어휘 과잉해석 지양
