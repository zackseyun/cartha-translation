base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/014.yaml
  text: For by human vanity it entered into the world, and because of this their end was devised to be brief.
  footnotes:
  - marker: a
    text: The implied subject of 'it entered' is not stated in Greek; from the surrounding context it refers to the rise of idols or idolatry.
    reason: alternative_reading
  - marker: b
    text: Or 'through human vainglory.' The Greek term denotes empty self-glory or vanity.
    reason: lexical_alternative
  - marker: c
    text: The passive 'was devised' does not explicitly name who devised their brief end.
    reason: alternative_reading
translation:
  language: ko
  text: 사람들의 헛된 자랑 때문에 그것이 세상에 들어왔고, 이 때문에 그들의 끝은 짧게 정해졌습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 ‘들어왔고’의 주어를 명시하지 않으며, 문맥상 우상 또는 우상숭배를 가리킵니다.
    reason: source_note
  - marker: b
    text: κενοδοξίᾳ는 ‘헛된 자랑’, ‘허영’, ‘공허한 영광’의 뜻을 지닙니다.
    reason: lexical_alternative
  - marker: c
    text: 수동형 ‘정해졌습니다’는 그 행위자를 직접 밝히지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: κενοδοξίᾳ
  english_pob_choice: by human vanity
  chosen_korean: 사람들의 헛된 자랑 때문에
  alternatives_korean:
  - 사람들의 허영으로
  - 인간의 헛된 영광 때문에
  - 사람들의 헛된 자만 때문에
  lexicon: LSJ
  rationale: 여기서는 원인의 뉘앙스가 분명하므로 ‘때문에’로 옮기고, κενοδοξία의 핵심인 ‘텅 빈 자기과시’를 ‘헛된 자랑’으로 간결하게 살렸습니다.
- source_word: ἀνθρώπων
  english_pob_choice: human
  chosen_korean: 사람들의
  alternatives_korean:
  - 인간의
  - 인류의
  - 사람의
  lexicon: LSJ
  rationale: 복수 속격이 κενοδοξίᾳ를 수식하므로 자연스럽게 ‘사람들의’로 옮겨 인간 일반의 허영을 드러냈습니다.
- source_word: εἰσῆλθεν εἰς κόσμον
  english_pob_choice: it entered into the world
  chosen_korean: 그것이 세상에 들어왔고
  alternatives_korean:
  - 세상에 들어왔고
  - 그것이 세계에 들어왔고
  - 세상 안으로 들어왔고
  lexicon: LSJ
  rationale: 그리스어는 주어를 생략하므로 문맥상 지시 대상을 살려 ‘그것이’로 번역했습니다. κόσμος는 여기서 우주 전체보다 인간의 삶의 질서로 보이므로 ‘세상’이 적절합니다.
- source_word: σύντομον αὐτῶν τέλος ἐπενόηθη
  english_pob_choice: their end was devised to be brief
  chosen_korean: 그들의 끝은 짧게 정해졌습니다
  alternatives_korean:
  - 그들의 끝은 짧게 마련되었습니다
  - 그들의 끝은 짧도록 고안되었습니다
  - 그들의 종말은 짧게 정해졌습니다
  lexicon: LSJ
  rationale: ἐπενόηθη의 수동형은 행위자를 밝히지 않으므로 그대로 수동의 결과를 살렸고, σύντομον은 τέλος의 기간적 짧음을 나타내므로 ‘짧게’로 간명하게 옮겼습니다.
theological_decisions:
- issue: 생략된 주어 εἰσῆλθεν의 지시 대상
  chosen_reading: 문맥상 우상 또는 우상숭배의 현상을 가리키는 것으로 보고 ‘그것’으로 받았습니다.
  alternative_readings:
  - ‘우상숭배가 세상에 들어왔고’처럼 명시적으로 풀어쓰기
  - 복수인 ‘그것들이’로 우상들을 가리키기
  rationale: 그리스어 본문은 주어를 명시하지 않으므로, 주석 없이 본문에 신학적 해석을 과도하게 집어넣지 않기 위해 최소한의 대명사 처리만 했습니다.
  doctrine_reference: 문맥이 허용하는 범위 안에서만 암시를 복원하고, 본문이 말하지 않는 것을 단정하지 않습니다.
- issue: ἐπενόηθη의 행위자
  chosen_reading: ‘그들의 끝은 짧게 정해졌습니다’로 옮겨, 누가 정했는지는 밝히지 않았습니다.
  alternative_readings:
  - 하나님이 정하셨다는 신적 수동으로 읽기
  - ‘짧게 계획되었습니다’처럼 보다 추상적으로 처리하기
  rationale: 본문은 행위자를 명시하지 않으므로, 수동 표현을 유지해 의도된 모호성을 보존했습니다.
  doctrine_reference: 본문이 직접 말하지 않는 행위자를 임의로 삽입하지 않습니다.
