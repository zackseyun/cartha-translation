review_pass:
  verdict: revise
  source_fidelity: 첫 절의 여격 κενοδοξίᾳ는 원인·수단으로 ‘사람들의 헛된 자랑으로’가 적절합니다. εἰσῆλθεν의 생략된 주어와 ἐπενόηθη의 무명 수동 행위자는 본문과 주석에서 모두 보존되어야 합니다. 다만 ‘짧게 정해졌습니다’는 ἐπενόηθη(고안하다, 계획하다)의 숙고·고안의 뜻을 다소 약화합니다.
  naturalness: ‘사람들의 헛된 자랑 때문에’도 가능하나, 이 문맥에서는 ‘…으로’가 더 간결하고 원문의 여격을 자연스럽게 반영합니다. ‘끝은 짧게 계획되었습니다’는 현대 표준어 합쇼체에서 자연스럽고, ‘끝’의 원문상 폭넓은 의미도 유지합니다.
  terminology: κενοδοξία는 ‘헛된 자랑’으로 적절합니다. κόσμος는 ‘세상’, τέλος는 해석을 좁히지 않는 ‘끝’으로 유지합니다. ἐπενόηθη는 ‘계획되었습니다’로 옮겨 수동성과 계획·고안의 뉘앙스를 함께 살립니다.
  issues:
