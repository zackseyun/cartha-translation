  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/002.yaml
  text: For it was desire for profit that devised that one[a], and skillful wisdom constructed it;
  footnotes:
  - marker: a
    text: Or 'desire for gain devised it.' The Greek demonstrative likely refers back to the ship in the previous verse, and πορισμῶν can be rendered 'for gain' or 'for profit.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그것은 이익에 대한 욕망이 구상해 낸 것이고, 기술 있는 지혜가 그것을 건조하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이익을 얻으려는 욕망’으로 옮길 수 있습니다. 그리스어 지시어는 앞 절의 배를 가리키는 것으로 보이며, πορισμῶν은 ‘이익’ 또는 ‘획득’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκείνο
  english_pob_choice: that one
  chosen_korean: 그것은
  alternatives_korean:
  - 그것이
  - 저것은
  - 그 배는
  lexicon: LSJ
  rationale: 문맥상 바로 앞 절의 배를 가리키는 중성 지시어이므로, 한국어에서는 과도한 해석 없이 중립적인 대명사로 받았습니다.
- source_word: ὄρεξις πορισμῶν
  english_pob_choice: desire for profit
  chosen_korean: 이익에 대한 욕망
  alternatives_korean:
  - 이익을 얻으려는 욕망
  - 수익을 바라는 욕구
  - 획득에 대한 갈망
  lexicon: LSJ
  rationale: ὄρεξις의 ‘욕망/갈망’과 πορισμῶν의 ‘이익·획득’ 의미를 함께 살려, 상업적 동기를 자연스럽게 드러냈습니다.
- source_word: ἐπενόησεν
  english_pob_choice: devised
  chosen_korean: 구상해 낸
  alternatives_korean:
  - 고안한
  - 궁리한
  - 만들어 낸
  lexicon: LSJ
  rationale: 단순한 ‘만들다’보다 마음속에서 먼저 생각해 낸다는 뉘앙스를 살려, 발명·고안의 의미를 보존했습니다.
- source_word: τεχνῖτις δὲ σοφία
  english_pob_choice: skillful wisdom
  chosen_korean: 기술 있는 지혜
  alternatives_korean:
  - 솜씨 있는 지혜
  - 장인 같은 지혜
  - 기교 있는 지혜
  lexicon: LSJ
  rationale: τεχνῖτις의 공예·기술 감각을 반영하면서도 σοφία를 ‘지혜’로 유지해, 본문의 문학적 울림을 살렸습니다.
theological_decisions:
- issue: σοφία를 실용적 기술로만 낮추지 않고 ‘지혜’로 유지할지 여부
  chosen_reading: 기술 있는 지혜로 옮겨, 지혜의 핵심 용어는 유지하되 수공예적 수식어로 맥락을 보강했습니다.
  alternative_readings:
  - 기술
  - 솜씨
  - 기교
  rationale: 지혜서 전체에서 σοφία는 핵심 주제어이므로, 문맥이 공예 기술을 말하더라도 ‘지혜’를 보존하는 편이 저자의 신학적·문학적 의도를 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §5 (핵심 용어 일관성과 문맥 보강)
