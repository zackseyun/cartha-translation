base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/015.yaml
  text: For a father[a], worn down by untimely grief for the child quickly taken away, made an image of the one then dead, and now honored him as a god, and handed down mysteries and rites to those under his authority[b];
  footnotes:
  - marker: a
    text: Or 'suddenly taken away' or 'snatched away' for 'quickly taken away.' The Greek emphasizes the child's removal before the expected time.
    reason: lexical_alternative
  - marker: b
    text: '''Mysteries and rites'' refers to secret or initiatory religious observances associated with cult practice.'
    reason: cultural_note
translation:
  language: ko
  text: 한 아버지는 때 이른 죽음으로 인한 슬픔에 지쳐, 갑자기 빼앗긴 아이를 위해 그때 죽은 사람의 형상을 만들고, 이제는 그를 신으로 공경하며, 자기 권세 아래 있는 사람들에게 비밀 의식과 제의[a][b]를 전해 주었습니다;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘때 이른 죽음’은 ἀώρῳ의 시간적 의미를 반영합니다. 이 말은 아이가 마땅한 때보다 일찍 죽었음을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘비밀 의식과 제의’는 비공개적이거나 입문과 관련된 종교 관행을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἀώρῳ γὰρ πένθει τρυχόμενος
  english_pob_choice: worn down by untimely grief
  chosen_korean: 때 이른 슬픔에 지쳐
  alternatives_korean:
  - 부당한 슬픔에 지쳐
  - 이른 때의 슬픔에 시달려
  lexicon: LSJ
  rationale: ἀώρῳ는 '때 이르다/때가 아니다'의 뜻이므로 '때 이른'으로 옮겨 시간적 이탈을 살렸고, τρυχόμενος는 고통에 의해 소모되는 상태이므로 '지쳐'가 자연스럽습니다.
- source_word: τοῦ ταχέως ἀφαιρεθέντος τέκνου
  english_pob_choice: for the child quickly taken away
  chosen_korean: 급히 빼앗긴 아이를 위해
  alternatives_korean:
  - 갑자기 빼앗긴 아이를 위해
  - 빨리 데려가진 아이를 위해
  lexicon: LSJ
  rationale: τέκνου는 성별이 없는 '아이'로 옮겼고, ἀφαιρεθέντος는 단순히 '빼앗기다/빼앗겨 사라지다'의 의미이므로 죽음의 정황을 덧붙이지 않는 범위에서 '빼앗긴'을 택했습니다.
- source_word: εἰκόνα ποιήσας
  english_pob_choice: made an image
  chosen_korean: 한 형상을 만들고
  alternatives_korean:
  - 한 이미지를 만들고
  - 우상을 만들고
  lexicon: LSJ
  rationale: 본문은 평가를 붙이기보다 제작 행위 자체를 말하므로, '우상'보다 중립적인 '형상'이 원문의 서술을 더 가깝게 반영합니다.
- source_word: νῦν ὡς θεὸν ἐτίμησεν
  english_pob_choice: now honored him as a god
  chosen_korean: 이제는 신처럼 공경하며
  alternatives_korean:
  - 이제는 신으로 공경하며
  - 이제는 신처럼 존중하며
  lexicon: LSJ
  rationale: ὡς θεόν은 실제 신성의 인정이라기보다 신적 지위로 대우함을 뜻하므로, 한국어에서는 평가를 드러내는 '신처럼'이 적절합니다. '공경하다'는 τετίμησεν의 존대/존귀 부여를 살립니다.
- source_word: τοῖς ὑποχειρίοις
  english_pob_choice: to those under his authority
  chosen_korean: 자기 권세 아래 있는 이들에게
  alternatives_korean:
  - 자기 아래 있는 이들에게
  - 자기 지배 아래 있는 이들에게
  lexicon: LSJ
  rationale: ὑποχειρίοις는 손 아래, 통제 아래 있는 사람들을 가리키므로 '권세 아래'가 현대 한국어에서 관계를 가장 분명하게 드러냅니다.
- source_word: μυστήρια καὶ τελετάς
  english_pob_choice: mysteries and rites
  chosen_korean: 신비와 의식
  alternatives_korean:
  - 비밀 의례와 예식
  - 신비와 제의
  lexicon: LSJ
  rationale: POB가 문화적 용어를 보존한 점을 따르되, 한국어에서는 '신비'와 '의식'으로 간결하게 옮겨 종교적·입문적 관행의 뉘앙스를 살렸습니다.
