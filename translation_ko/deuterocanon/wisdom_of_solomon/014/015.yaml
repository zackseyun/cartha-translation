  - 하나님처럼
  rationale: 본문은 참된 신을 말하지 않고 죽은 인간을 신격화하는 과정을 비판적으로 묘사하므로, '신처럼'이 의미를 과장하지 않으면서도 폄하적 맥락을 유지합니다.
  doctrine_reference: 원문 우선 원칙; idolatry context preserves the text's claim without endorsing it.
