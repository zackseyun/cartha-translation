lexical_decisions:
- source_word: ἐν ἴσῳ
  english_pob_choice: equally
  chosen_korean: 똑같이
  alternatives_korean:
  - 동등하게
  - 같은 정도로
  lexicon: LSJ
  rationale: 관용구의 비교·동등 강조를 자연스러운 현대어로 옮기되, ‘같은 정도로’보다 간결하게 균등성을 드러냅니다.
- source_word: μισητά θεῷ
  english_pob_choice: hateful to God
  chosen_korean: 하나님께 똑같이 미움받습니다
  alternatives_korean:
  - 하나님께 똑같이 미움받습니다
  - 하나님 보시기에 똑같이 가증합니다
  lexicon: LSJ
  rationale: 형용사 μισητά의 정적인 성격을 살리면서도 한국어에서는 수동 표현이 가장 자연스럽습니다. ‘가증하다’는 강하지만 어휘적 결을 달리하므로 본문 직결성은 ‘미움받습니다’가 더 높습니다.
- source_word: ὁ ἀσεβῶν / ἡ ἀσέβεια αὐτοῦ
  english_pob_choice: the ungodly man and his ungodliness
  chosen_korean: 불경한 사람과 그의 불경함
  alternatives_korean:
  - 경건하지 않은 사람과 그의 경건하지 않음
  - 불경한 자와 그의 불경
  lexicon: LSJ
  rationale: 동사적 분사와 명사를 같은 어근 계열로 연결해, 사람과 행위가 함께 대상이 된다는 구조를 보존했습니다. ‘불경함’은 ἀσέβεια의 추상명사 대응으로 가장 직접적입니다.
theological_decisions:
- issue: 사람과 행위가 모두 하나님께 미움받는다는 진술
  chosen_reading: 본문은 불경한 사람 자신과 그의 불경함이 모두 하나님께 미움받는다고 말하며, 둘 사이를 동일한 범주로 묶습니다.
  alternative_readings:
  - 죄만 미움받는다고 완화하여 읽는 해석
  - 전체 문장에 대한 신학적 일반화 없이 도덕적 평가로만 읽는 해석
  rationale: 그리스어는 ὁ ἀσεβῶν과 ἡ ἀσέβεια αὐτοῦ를 모두 μισητά θεῷ 아래에 놓습니다. 번역은 이 긴장을 약화하지 않고 그대로 드러내야 합니다.
  doctrine_reference: 본문의 직접 진술을 보존하고, 죄와 죄인을 분리해 완화하지 않음.
