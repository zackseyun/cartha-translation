base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/007.yaml
  text: For blessed is the wood through which righteousness comes[a].
  footnotes:
  - marker: a
    text: Or 'justice comes.' Greek δικαιοσύνη can denote righteousness or justice; the main text follows the project's default rendering.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그 나무는 복되니, 그 나무를 통하여 의가 이루어집니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정의가 이루어집니다.’ 그리스어 δικαιοσύνη는 ‘의’와 ‘정의’ 모두를 뜻할 수 있습니다. 본문은 프로젝트 기본 번역을 따릅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλόγηται
  english_pob_choice: is blessed
  chosen_korean: 복되니
  alternatives_korean:
  - 복을 받으니
  - 복을 받은 상태이니
  lexicon: BDAG
  rationale: 완료 수동의 상태를 한국어 현재형 서술로 자연스럽게 옮기되, 단순한 감탄보다 ‘복을 받은 상태’라는 결과를 드러내기 위해 ‘복되니’로 렌더링했습니다.
- source_word: ξύλον
  english_pob_choice: wood
  chosen_korean: 나무
  alternatives_korean:
  - 목재
  - 나무로 된 것
  lexicon: BDAG
  rationale: 문맥상 우상 재료의 물성보다 ‘나무’라는 구체적 재료를 가리키므로, POB의 ‘wood’를 한국어 자연어로 그대로 옮겼습니다.
- source_word: δι' οὗ γίνεται
  english_pob_choice: through which comes
  chosen_korean: 그 나무를 통하여 … 이루어집니다
  alternatives_korean:
  - 그것을 통해 … 옵니다
  - 그것으로 말미암아 … 생깁니다
  lexicon: BDAG
  rationale: 중성 관계대명사가 앞의 ξύλον을 받아 도구·매개를 나타내므로 ‘통하여’로 옮겼고, γίνομαι는 여기서 결과의 실현을 뜻하므로 ‘이루어집니다’로 자연스럽게 표현했습니다.
- source_word: δικαιοσύνη
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 정의
  - 의로움
  lexicon: BDAG
  rationale: 프로젝트 기본값에 따라 δικαιοσύνη를 ‘의’로 옮겨, ‘righteousness’의 도덕적·신학적 폭을 한국어에서 가장 간결하게 보존했습니다.
theological_decisions:
- issue: δικαιοσύνη의 범위
  chosen_reading: ‘의’는 단순한 윤리 규범이 아니라 하나님 앞에서의 올바름과 구원의 결과를 함께 가리키는 넓은 표현으로 유지했습니다.
  alternative_readings:
  - 정의
  - 의로움
  rationale: 지혜서의 문맥에서는 δικαιοσύνη가 사회적 정의만이 아니라 신앙적·구원론적 올바름까지 포함할 수 있으므로, 좁은 의미로 축소하지 않기 위해 ‘의’를 택했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: δικαιοσύνη → 의/의로움/정의'
