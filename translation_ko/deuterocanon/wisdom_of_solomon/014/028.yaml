  naturalness: ‘그러므로 그들은 … 하기도 하고’는 이유를 제시하는 원문의 문맥 연결과 맞지 않으며, 반복되는 ‘-기도 하고’는 선택 병렬인 ἢ…ἢ…ἢ…ἢ의 구조를 다소 흐립니다. ‘이는 그들이 … 하거나 … 하거나’는 현대 표준 한국어 합쇼체에서 자연스럽고 원문의 열거 구조를 보존합니다.
