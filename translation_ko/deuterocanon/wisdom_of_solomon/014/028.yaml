  - 정신이 나가기도 하고
  lexicon: LSJ
  rationale: 완료형이 나타내는 결과 상태를 살려 현재적 상태로 표현했고, 한국어에서 강한 비난과 동요를 자연스럽게 드러내기 위해 ‘미쳐 버리기도 하고’로 옮겼습니다.
- source_word: προφητεύουσιν ψευδῆ
  english_pob_choice: they prophesy lies
  chosen_korean: 거짓을 예언하기도 하며
  alternatives_korean:
  - 거짓 예언을 하기도 하며
  - 거짓말을 예언하기도 하며
  - 헛된 예언을 하기도 하며
  lexicon: LSJ
  rationale: 동사-목적어 구조를 그대로 살려 ‘거짓을 예언하다’로 직역성을 유지했고, ‘거짓 예언’보다 원문의 날카로움을 더 분명히 했습니다.
- source_word: ζῶσιν ἀδίκως
  english_pob_choice: they live unjustly
  chosen_korean: 불의하게 살기도 하고
  alternatives_korean:
  - 불의하게도 살기도 하고
  - 의롭지 않게 살기도 하고
  - 부정하게 살기도 하고
  lexicon: LSJ
  rationale: 지혜문학의 윤리적 어조를 고려해 ἀδίκως를 ‘불의하게’로 옮겨, 단순한 도덕적 비난보다 정의-불의의 대조를 살렸습니다.
- source_word: ἐπιορκοῦσιν ταχέως
  english_pob_choice: they quickly swear false oaths
  chosen_korean: 곧바로 거짓 맹세를 하기도 합니다
  alternatives_korean:
  - 쉽사리 거짓 맹세를 하기도 합니다
  - 빨리 거짓 맹세를 하기도 합니다
  - 서둘러 거짓 맹세를 하기도 합니다
  lexicon: LSJ
  rationale: ἐπιορκοῦσιν의 ‘거짓 맹세/위증’ 의미를 명시하고, ταχέως는 속도보다 경솔한 즉시성을 드러내는 ‘곧바로’로 자연스럽게 풀었습니다.
theological_decisions:
- issue: ἀδίκως의 윤리적 뉘앙스
  chosen_reading: ‘불의하게’로 번역해 정의/불의의 윤리적 대조를 드러냈습니다.
  alternative_readings:
  - ‘불의하게 살다’ 대신 ‘불의를 행하다’
  - ‘의롭지 않게’
  - ‘악하게’
  rationale: 본문은 추상적 교리보다 생활 윤리의 왜곡을 고발하므로, 사회-윤리적 뉘앙스를 살리는 표현이 가장 적절합니다.
  doctrine_reference: 지혜문학의 의/불의 어휘 대비
