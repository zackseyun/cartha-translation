base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/028.yaml
  text: For either[a], while reveling, they go mad; or they prophesy lies; or they live unjustly; or they quickly swear false oaths[b];
  footnotes:
  - marker: a
    text: Or 'making merry, they are driven mad.' The Greek participle plus perfect verb can be rendered with slightly different aspect in English.
    reason: lexical_alternative
  - marker: b
    text: Or 'they readily perjure themselves.' The Greek ἐπιορκοῦσιν refers to swearing falsely or committing perjury.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 그들이 즐거워하며[a] 미쳐 있거나, 거짓을 예언하거나, 불의하게 살거나, 쉽사리[b] 거짓 맹세를 하기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘즐거워하며’(εὐφραινόμενοι)는 ‘기뻐하며’, ‘흥청거리며’로도 옮길 수 있습니다. 문맥상 축제나 연회의 즐거움을 가리킬 수 있으나, 그 뉘앙스가 단어 자체에 반드시 포함되는 것은 아닙니다.
    reason: lexical_alternative
  - marker: b
    text: ‘쉽사리’(ταχέως)는 ‘빨리’, ‘서둘러’라는 뜻도 될 수 있으며, 여기서는 거짓 맹세를 쉽게 또는 성급하게 하는 태도를 나타냅니다. ‘거짓 맹세를 하다’는 ἐπιορκοῦσιν, 곧 거짓으로 맹세하거나 위증하는 일을 옮긴 것입니다.
    reason: lexical_alternative
