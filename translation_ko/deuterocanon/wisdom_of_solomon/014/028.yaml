  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/028.yaml
  text: For either[a], while reveling, they go mad; or they prophesy lies; or they live unjustly; or they quickly swear false oaths[b];
  footnotes:
  - marker: a
    text: Or 'making merry, they are driven mad.' The Greek participle plus perfect verb can be rendered with slightly different aspect in English.
    reason: lexical_alternative
  - marker: b
    text: Or 'they readily perjure themselves.' The Greek ἐπιορκοῦσιν refers to swearing falsely or committing perjury.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그들은 즐기며 미쳐 버리기도 하고, 거짓을 예언하기도 하며, 불의하게 살기도 하고, 곧바로 거짓 맹세를 하기도 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘즐기며’는 축제적·향락적 상태를 간결하게 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘곧바로’는 ταχέως의 속도보다 경솔한 즉시성을 드러내기 위한 선택입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐφραινόμενοι
  english_pob_choice: while celebrating
  chosen_korean: 즐기며
  alternatives_korean:
  - 기뻐하며
  - 흥청거리며
  - 연회하며
  lexicon: LSJ
  rationale: 축제적·향락적 상태를 간결하게 드러내면서도, 본문의 부정적 문맥에서 지나친 해석을 피하기 위해 ‘즐기며’로 옮겼습니다.
- source_word: μεμήνασιν
