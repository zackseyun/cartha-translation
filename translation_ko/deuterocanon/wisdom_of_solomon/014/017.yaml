base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/017.yaml
  text: Since men were not able to honor them in person because they lived far away[a], they reproduced the distant appearance and made a visible image of the honored king[b], so that by their zeal they might flatter the absent one as though present.
  footnotes:
  - marker: a
    text: Or 'the appearance from afar' for 'the distant appearance.'
    reason: lexical_alternative
  - marker: b
    text: Or 'might court the favor of the absent one as if present.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사람들은 멀리 떨어져 살았기 때문에 그들을 직접 존중할 수 없었습니다. 그래서 그들은 멀리서 본 모습을 되살려, 존중받는 왕의 눈에 보이는 형상을 만들었으니, 부재한 이를 마치 حاضر한 사람처럼 그들의 열심으로 아첨하려는 것이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘멀리서 본 모습’으로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘부재한 이를 마치 حاضر한 사람처럼 비위를 맞추려는’으로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ὄψει / διὰ τὸ μακρὰν οἰκεῖν
  english_pob_choice: in person / because they lived far away
  chosen_korean: 직접 / 멀리 떨어져 살았기 때문에
  alternatives_korean:
  - 얼굴을 맞대고 / 멀리 거주했기 때문에
  - 대면하여 / 멀리 살았기 때문에
  lexicon: LSJ
  rationale: ἐν ὄψει는 단순한 시각보다 대면·현장성의 대비를 만들므로 ‘직접’이 자연스럽고, 이유절은 거리 때문에 불가능했다는 의미를 분명히 살립니다.
- source_word: τὴν πόρρωθεν ὄψιν
  english_pob_choice: the distant appearance
  chosen_korean: 멀리서 본 모습
  alternatives_korean:
  - 멀리서 본 형상
  - 먼 곳의 외양
  lexicon: LSJ
  rationale: ὄψις는 ‘모습/외양’의 뜻이 가능하고 πόρρωθεν이 거리감을 더하므로, 관찰된 인상을 자연스럽게 드러내는 표현을 택했습니다.
- source_word: ἀνατυπωσάμενοι
  english_pob_choice: reproduced
  chosen_korean: 되살려
  alternatives_korean:
  - 복제하여
  - 그대로 옮겨
  lexicon: LSJ
  rationale: 단순 복사보다 원형을 바탕으로 형상을 다시 만들어 내는 뉘앙스가 있어, 우상 제작의 과정과 잘 맞는 ‘되살려’를 택했습니다.
- source_word: ἐμφανῆ εἰκόνα
  english_pob_choice: a visible image
  chosen_korean: 눈에 보이는 형상
  alternatives_korean:
  - 분명한 형상
  - 가시적인 형상
  lexicon: LSJ
  rationale: εἰκών의 ‘형상’과 ἐμφανῆ의 ‘드러나 보이는’ 성격을 함께 살려, 시각적으로 확인되는 인공물을 분명히 했습니다.
- source_word: τοῦ τιμωμένου βασιλέως / τὸν ἀπόντα
  english_pob_choice: of the honored king / the absent one
  chosen_korean: 존중받는 왕 / 부재한 이
  alternatives_korean:
  - 존경받는 왕 / 없는 왕
  - 높임받는 왕 / 자리에 없는 이
  lexicon: LSJ
  rationale: 기본적으로는 사회적·정치적 ‘존중’의 의미가 앞서므로 이를 유지하되, 뒤의 ‘부재한 이’는 대조를 선명하게 하도록 간결하게 옮겼습니다.
- source_word: κολακεύωσιν
  english_pob_choice: might flatter
  chosen_korean: 아첨하려는
  alternatives_korean:
  - 비위를 맞추려는
  - 환심을 사려는
  lexicon: LSJ
  rationale: 본문은 단순 예우가 아니라 비판적 어조의 아첨을 가리키므로, 그 부정적 평가가 드러나는 말을 선택했습니다.
theological_decisions:
- issue: 이 절의 τιμᾶν을 예배적 언어로 번역할지 여부
  chosen_reading: ‘존중하다/존중받는’ 수준으로 유지했습니다.
  alternative_readings:
  - 예배하다
  - 경배하다
  rationale: 문맥은 우상숭배 일반이 아니라 멀리 있는 통치자에게 표하는 사회적·정치적 존중에서 출발하므로, 더 강한 종교어를 앞당기지 않았습니다.
  doctrine_reference: 원문 우선 원칙; 문맥이 말하는 의미보다 전통적 교회어를 앞세우지 않음
