- from: 사람들은 멀리 떨어져 살았기 때문에 그들을 직접 존중할 수 없었습니다. 그래서 그들은 멀리서 본 모습을 되살려, 존중받는 왕의 눈에 보이는 형상을 만들었으니, 부재한 이를 마치 حاضر한 사람처럼 그들의 열심으로 아첨하려는 것이었습니다.[a][b]
  to: 사람들은 멀리 떨어져 살았기 때문에 그들을 직접 공경할 수 없었습니다. 그래서 그들은 멀리서 본 모습을[a] 본떠, 공경받는 왕의 뚜렷한 형상을 만들었습니다. 이는 그들이 열성을 기울여 부재한 그 왕이 마치 곁에 있는 것처럼 그에게 아첨하려고[b] 한 것이었습니다.
  rationale: 아랍 문자 혼입을 제거하고, ἀνατυπωσάμενοι를 ‘본떠’로 바로잡았습니다. 또한 ὡς παρόντα의 대조가 아첨의 대상인 부재한 왕을 가리키도록 목적절을 재구성했습니다. 원문의 사회·정치적 공경, 형상 제작, 아첨이라는 비판적 흐름은 유지했습니다.
