  source_fidelity: 원문의 거리·부재 대조와 왕에 대한 정치적 존중에서 아첨으로 이어지는 비판적 흐름은 대체로 포착했습니다. 그러나 ‘되살려’는 ἀνατυπωσάμενοι의 ‘본떠 다시 형상화하다’보다 부정확하며, 본문에 남은 아랍 문자 ‘حاضر’는 명백한 오류입니다. 목적절도 한국어에서 ‘부재한 왕이 마치 곁에 있는 것처럼 그에게 아첨하다’로 명확히 표현할 필요가 있습니다.
  naturalness: ‘존중받는 왕’, ‘부재한 이’, ‘그들의 열심으로 아첨하려는 것’은 다소 추상적이고 결합이 어색합니다. ‘그 왕이 곁에 있는 것처럼 그에게 아첨하려고’로 하면 원문의 대조와 목적 관계가 자연스럽습니다.
  terminology: τιμᾶν은 이 문맥에서 ‘공경하다’로 옮겨 숭배를 선취하지 않았습니다. εἰκών은 ‘형상’, κολακεύω는 비판적 어조를 보존하는 ‘아첨하다’로 유지했습니다.
