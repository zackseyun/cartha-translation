  text: εἶτα ἐν χρόνῳ κρατυνθὲν τὸ ἀσεβὲς ἔθος ὡς νόμος ἐφυλάχθη, καὶ τυράννων ἐπιταγαῖς ἐθρησκεύετο τὰ γλυπτά·
