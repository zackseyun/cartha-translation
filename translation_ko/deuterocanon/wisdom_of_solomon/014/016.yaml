base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/016.yaml
  text: Then[a], as time passed, that ungodly custom grew strong and was kept as a law[b], and by the commands of tyrants the carved images were worshiped.
  footnotes:
  - marker: a
    text: Or 'in time' or 'over time.' The Greek expression marks gradual development.
    reason: lexical_alternative
  - marker: b
    text: Or 'the graven images.' The Greek literally refers to carved objects or images.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 뒤로 시간이 흐르면서[a] 그 불경한 관습이 강해져 법처럼 지켜졌고, 폭군들의 명령에 따라 새긴 형상들이[b] 숭배되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시간이 지나면서’, ‘오랜 시간이 흐르면서’. 그리스어 표현은 점진적인 전개를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘조각한 대상들’, ‘새긴 것들’. 그리스어는 문자적으로 조각하거나 새긴 대상들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν χρόνῳ
  english_pob_choice: as time passed
  chosen_korean: 시간이 흐르면서
  alternatives_korean:
  - 세월이 흐르면서
  - 시간이 지나면서
  lexicon: LSJ
  rationale: 점진적 발전을 나타내는 시간 표현으로, 단순한 시점보다 과정성을 살려 옮겼습니다.
- source_word: τὸ ἀσεβὲς ἔθος
  english_pob_choice: that ungodly custom
  chosen_korean: 그 불경한 관습
  alternatives_korean:
  - 그 경건하지 않은 관습
  - 그 신앙 없는 관행
  lexicon: LSJ
  rationale: ἀσεβής의 종교적·도덕적 비판을 ‘불경한’으로 보존하고, ἔθος는 ‘관습’으로 자연스럽게 옮겼습니다.
- source_word: ὡς νόμος ἐφυλάχθη
  english_pob_choice: was kept as a law
  chosen_korean: 마치 율법인 것처럼 지켜졌고
  alternatives_korean:
  - 법처럼 지켜졌고
  - 율법처럼 지켜졌고
  lexicon: LSJ
  rationale: ὡς는 실제 법적 효력이라기보다 ‘마치 ~인 것처럼’이라는 취지를 가지므로, 그 뉘앙스를 분명히 살렸습니다.
- source_word: τὰ γλυπτά
  english_pob_choice: the carved images
  chosen_korean: 새긴 형상들
  alternatives_korean:
  - 조각한 형상들
  - 새긴 우상들
  - 새긴 물건들
  lexicon: LSJ
  rationale: 직역하면 ‘새긴 것들/형상들’이므로, 예배 대상임은 동사 ‘숭배되었습니다’로 드러나게 하고 명사 자체는 제작성을 보존했습니다.
theological_decisions:
- issue: τύραννων을 중립적으로 옮길지, 평가적 어감을 살릴지
  chosen_reading: ‘폭군들’로 옮겨 원문의 비판적 어조를 보존했습니다.
  alternative_readings:
  - 통치자들
  - 지배자들
  rationale: 본문은 우상숭배 확산의 강압적 정치 권력을 비판적으로 지칭하므로, 중립화하지 않고 평가적 표현을 유지했습니다.
  doctrine_reference: 원어 평가어의 보존; 번역의 원문 우선 원칙
- issue: τὰ γλυπτά를 ‘우상들’로 해석할지, 제작성을 살려 옮길지
  chosen_reading: ‘새긴 형상들’로 옮기고, 숭배 행위로 우상적 의미를 드러냈습니다.
  alternative_readings:
  - 우상들
  - 새긴 것들
  rationale: 문맥상 우상숭배이지만, 그리스어 자체는 새긴 제작물을 가리키므로 lexical tension을 보존하는 쪽을 택했습니다.
  doctrine_reference: 원문 어휘와 해석의 긴장 보존; 문맥적 우상성
