  - 지은 것
  rationale: 앞뒤 문맥상 우상과 그 제작자를 가리키는 것이 분명하지만, 그 명칭은 그리스어 절 자체에 없으므로 본문은 과잉 특정화하지 않는 편이 원문 충실도에 맞습니다.
