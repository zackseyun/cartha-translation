lexical_decisions:
- source_word: τὸ πραχθέν
  english_pob_choice: the thing made
  chosen_korean: 그것을 행한 것
  alternatives_korean:
  - 행해진 것
  - 지어진 것
  - 만들어진 것
  lexicon: SBLGNT / BDAG
  rationale: 동사 πράσσω의 완료 수동 분사로서 ‘행해진 것/된 일’의 결과를 가리키므로, 본문이 우상 그 자체를 명시하지 않더라도 행위의 결과물을 한국어로 자연스럽게 살렸습니다.
