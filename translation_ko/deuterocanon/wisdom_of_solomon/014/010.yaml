  - …와 함께
  - …와 더불어
  lexicon: BDAG
  rationale: 대상과 행위자를 공동 책임 아래 묶는 결합 관계를 가장 직접적으로 드러내는 표현으로 옮겼습니다.
- source_word: τῷ δράσαντι
  english_pob_choice: the one who made it
  chosen_korean: 그 행한 자
  alternatives_korean:
  - 그것을 한 자
  - 그 만든 자
  - 행위자
  lexicon: BDAG
  rationale: δράω의 기본 의미는 ‘행하다/하다’이므로, 원문의 병렬 구조를 따라 ‘그 행한 자’로 두어 제작 행위까지 과잉 해석하지 않으면서도 주체를 분명히 했습니다.
- source_word: κολασθήσεται
  english_pob_choice: will be punished
  chosen_korean: 벌을 받게 됩니다
  alternatives_korean:
  - 형벌을 받게 됩니다
  - 벌받게 됩니다
  lexicon: BDAG
  rationale: 미래 수동형의 징벌적 의미를 현대 한국어의 공적·법적 어감으로 전달했습니다.
theological_decisions:
- issue: 본문의 ‘행해진 것’이 우상을 가리키는지를 본문에 명시할지 여부
  chosen_reading: 본문에는 일반적 표현을 유지하고, 주석 없이 ‘그것을 행한 것’으로 두었습니다.
  alternative_readings:
