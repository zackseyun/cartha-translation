  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/024.yaml
  text: They no longer keep either lives or marriages pure[a]; instead, one kills another by treachery[b], or by adultery causes grief.
  footnotes:
  - marker: a
    text: Or 'one destroys another by ambush'—the Greek suggests covert attack or lying in wait.
    reason: lexical_alternative
  - marker: b
    text: Or 'by corrupting marriage he causes pain'—the Greek verb can denote corrupting or violating marital fidelity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 더 이상 삶과 혼인을 깨끗하게 지키지 않습니다. 오히려 한 사람은 다른 사람을 숨어 기다려 죽이거나[a], 간음하여[b] 그를 괴롭게 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘간계로 죽인다’로 옮길 수 있습니다. 그리스어는 숨어 기다리며 공격하거나 매복하는 뜻을 시사합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘혼인을 더럽혀 그를 괴롭게 한다’로 옮길 수 있습니다. 그리스어 동사는 혼인 관계의 순결을 훼손하는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
