theological_decisions:
- issue: βίους … γάμους καθαρούς의 범위
  chosen_reading: 이 구절은 개인적·사회적 생명과 혼인 관계를 순결하게 지키지 못하는 도덕적 타락을 비난합니다.
  alternative_readings:
  - 생계 수단과 합법적 혼인을 깨끗하게 지키지 못한다는 뜻으로 좁게 읽을 수 있습니다.
  - 의식적 정결이나 결혼 예식의 순결을 가리킨다고 볼 수도 있습니다.
  rationale: 문맥이 우상숭배에서 비롯된 도덕적 혼란을 열거하므로 윤리적 의미가 우선이며, 지나치게 의례화하거나 βίους를 경제 영역으로 한정하지 않도록 했습니다.
  doctrine_reference: 'DOCTRINE.md: optimal equivalence; source 의미를 보존하되 교리적 확장을 피함.'
