  chosen_korean: 결혼
  alternatives_korean:
  - 혼인
  - 결혼 관계
  - 혼배
  lexicon: LSJ
  rationale: γάμος는 결혼, 혼인, 혼인 관계를 뜻할 수 있으며, 여기서는 ‘깨끗하게 지키다’와 함께 결합되어 혼인의 순결을 말하므로 현대 한국어에서 가장 자연스러운 ‘결혼’으로 옮겼습니다.
- source_word: φυλάσσουσιν
  english_pob_choice: keep
  chosen_korean: 지키지 않습니다
  alternatives_korean:
  - 보존하지 않습니다
  - 간직하지 않습니다
  - 수호하지 않습니다
  lexicon: LSJ
  rationale: φυλάσσω는 지키다, 보존하다의 뜻이지만, 도덕적 순결을 유지한다는 맥락에서는 ‘지키다’가 가장 직접적이고 한국어 문장 흐름도 자연스럽습니다.
- source_word: λοχῶν
  english_pob_choice: by treachery
  chosen_korean: 매복하여
  alternatives_korean:
  - 기습하여
  - 함정에 숨어
  - 은밀히
  lexicon: LSJ
  rationale: λοχάω/λόχος 계열은 매복, 잠복, 숨어서 기다림의 뜻을 가지므로, POB의 ‘treachery’가 강조하는 은밀한 공격성을 살려 ‘매복하여’로 구체화했습니다.
- source_word: νοθεύων
  english_pob_choice: by adultery
  chosen_korean: 간음으로
  alternatives_korean:
  - 부정을 저질러
  - 혼인을 더럽혀
  - 배신하여
  lexicon: LSJ
  rationale: νοθεύω는 훼손하다, 변질시키다의 뜻이 있으며 성적 문맥에서는 혼인 순결을 깨뜨리는 행위를 가리킬 수 있으므로, POB의 해석을 따라 ‘간음으로’ 옮겨 그 도덕적 위반을 드러냈습니다.
- source_word: ὀδυνᾷ
  english_pob_choice: causes grief
  chosen_korean: 그를 아프게 합니다
  alternatives_korean:
  - 고통을 줍니다
  - 괴롭게 합니다
  - 슬프게 합니다
  lexicon: LSJ
  rationale: ὀδυνάω는 아프게 하다, 고통을 주다의 뜻이므로, 관계적 상처와 신체적 고통을 함께 포괄할 수 있는 ‘아프게 합니다’를 선택했습니다.
theological_decisions:
- issue: βίους … γάμους καθαρούς의 범위
  chosen_reading: 이 구절은 개인적·사회적 생명과 혼인 관계를 순결하게 지키지 못하는 도덕적 타락을 비난합니다.
  alternative_readings:
  - 생계 수단과 합법적 혼인을 깨끗하게 지키지 못한다는 뜻으로 좁게 읽을 수 있습니다.
  - 의식적 정결이나 결혼 예식의 순결을 가리킨다고 볼 수도 있습니다.
  rationale: 문맥이 우상숭배에서 비롯된 도덕적 혼란을 열거하므로 윤리적 의미가 우선이며, 지나치게 의례화하거나 βίους를 경제 영역으로 한정하지 않도록 했습니다.
  doctrine_reference: 'DOCTRINE.md: optimal equivalence; source 의미를 보존하되 교리적 확장을 피함.'
