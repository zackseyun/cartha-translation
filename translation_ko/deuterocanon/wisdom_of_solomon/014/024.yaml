  - 생활
  - 생애
  lexicon: LSJ
  rationale: βίος는 ‘삶/생활’까지 넓게 될 수 있지만, 이 문맥에서는 γάμους와 짝을 이루며 도덕적·인간적 삶의 보존을 가리키므로 ‘생명이나 결혼’을 택해 관계의 훼손을 간명하게 드러냈습니다.
- source_word: γάμους
