  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/011.yaml
  text: Therefore there will also be a visitation upon the idols of the nations[a], because among God’s creatures they became an abomination, and a stumbling block to the souls of men[b], and a snare for the feet of fools.
  footnotes:
  - marker: a
    text: Or, more literally, “there will also be visitation upon the idols of the nations.”
    reason: lexical_alternative
  - marker: b
    text: “Men” here means human beings generally.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이방 민족들의 우상들도 감찰을 받을 것입니다[a]. 이는 그것들이 하나님의 창조 세계 안에서 가증한 것이 되었고, 사람들의 영혼에 걸림돌이 되었으며, 어리석은 자들의 발에 올무가 되었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “방문을 받을 것입니다.” 원문의 ‘감찰’은 문맥상 심판을 수반하는 방문을 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
