  lexicon: LSJ
  rationale: ἐπισκοπή는 문자적으로는 '방문/감찰'이지만, 여기서는 우상들에 대한 파괴적·형벌적 개입을 뜻하므로 한국어 본문에서는 의미를 드러내는 '징벌'로 옮겼습니다.
- source_word: ἐν κτίσματι θεοῦ
  english_pob_choice: among God’s creatures
  chosen_korean: 하나님의 창조 안에서
  alternatives_korean:
  - 하나님의 피조물 가운데
  - 하나님의 창조 가운데
  lexicon: LSJ
  rationale: 단수 κτίσμα과 하나님의 소유격을 함께 살려, 피조 세계 전체를 가리키는 넓은 범위로 '하나님의 창조 안에서'라고 번역했습니다.
- source_word: εἰς βδέλυγμα ἐγενήθησαν
  english_pob_choice: they became an abomination
  chosen_korean: 가증한 것이 되었고
  alternatives_korean:
  - 가증한 것이 되었으며
  - 혐오스러운 것이 되었고
  lexicon: LSJ
  rationale: βδέλυγμα의 강한 종교적 혐오와 도덕적 오염의 뉘앙스를 살려 '가증한 것'으로 옮겼습니다.
- source_word: παγίδα ποσὶν ἀφρόνων
  english_pob_choice: a snare for the feet of fools
  chosen_korean: 어리석은 자들의 발에 올무가 되었습니다
  alternatives_korean:
  - 어리석은 자들의 발을 위한 올무가 되었습니다
  - 어리석은 자들의 발에 덫이 되었습니다
  lexicon: LSJ
  rationale: 발이라는 구체적 이미지를 유지하고, 지혜문학에서 ἄφρων을 윤리적 무지와 어리석음을 함께 지닌 표현으로 보아 '어리석은 자들'로 옮겼습니다.
theological_decisions:
- issue: ἐπισκοπή의 의미를 한국어에서 어떻게 드러낼지
  chosen_reading: 직역적 '방문'보다 문맥상 형벌적 개입을 드러내는 '징벌'로 번역했습니다.
  alternative_readings:
  - 방문
  - 감찰
  - 심판
  rationale: 본문은 우상들이 가증한 것이 되고 걸림돌과 올무가 되었다는 이유를 제시하므로, 단순 방문이 아니라 하나님의 निर्ण적 개입과 처벌을 뜻합니다. 한국어 독자가 즉시 이해하도록 본문에서는 '징벌'을 택했습니다.
  doctrine_reference: Translation philosophy §1, §6
