- from: 그러므로 이방 나라의 우상들 위에도 징벌이 있을 것입니다[a]. 그들은 하나님의 창조 안에서 가증한 것이 되었고, 사람의 영혼에 걸림돌이 되었으며, 어리석은 자들의 발에 올무가 되었습니다.
  to: 그러므로 이방 민족들의 우상들도 감찰을 받을 것입니다[a]. 이는 그것들이 하나님의 창조 세계 안에서 가증한 것이 되었고, 사람들의 영혼에 걸림돌이 되었으며, 어리석은 자들의 발에 올무가 되었기 때문입니다.
