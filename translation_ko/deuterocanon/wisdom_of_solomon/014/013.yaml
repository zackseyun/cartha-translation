  rationale: 그리스어는 앞 문맥에 의존해 주어를 생략하므로, 본문에서 특정 명사를 보충하면 원문보다 더 단정적이 됩니다. 한국어 번역도 이 생략을 보존해 문맥 연계를 유지했습니다.
