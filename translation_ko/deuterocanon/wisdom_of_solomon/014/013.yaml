  rationale: 주어가 문맥상 암시되어 있으므로, 한국어에서도 구체적 명사를 덧붙이지 않고 그 대상의 비존재를 간결하게 드러내는 표현을 택했습니다.
- source_word: ἀπ' ἀρχῆς
