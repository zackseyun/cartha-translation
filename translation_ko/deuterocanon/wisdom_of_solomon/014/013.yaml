  lexicon: BDAG
  rationale: γάρ의 설명적 흐름은 앞뒤 문맥을 이어 주므로 접속사는 생략하지 않고 앞절과 이어지는 ‘그러나’로 처리했습니다. οὔτε의 부정 병렬은 한국어에서 자연스러운 반복 부정으로 옮겼습니다.
- source_word: ἦν
