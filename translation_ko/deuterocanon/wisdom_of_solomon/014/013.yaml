lexical_decisions:
- source_word: οὔτε γὰρ
  english_pob_choice: For ... not ... nor
  chosen_korean: 그러나 ... 않았고 ... 않(을 것입니다)
  alternatives_korean:
  - 이는 ... 아니며 ... 아닙니다
