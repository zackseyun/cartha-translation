  lexicon: LSJ
  rationale: ‘이름을 …에 돌리다/돌려 붙이다’는 우상에 신적 이름을 돌려 붙이는 행위를 자연스럽게 드러냅니다. ‘부여하다’보다 의미의 방향성이 더 분명합니다.
theological_decisions:
- issue: ἀκοινώνητον ὄνομα의 신학적 함의
  chosen_reading: 우상에게 돌려서는 안 되는, 본래 하나님께만 속한 배타적 이름을 가리키는 표현으로 유지했습니다.
  alternative_readings:
  - ‘나눌 수 없는 이름’으로 더 추상화
