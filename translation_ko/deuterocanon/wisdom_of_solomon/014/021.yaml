  rationale: 원문은 신적 이름의 고유성과 우상숭배의 오류를 강하게 대비하지만, 그 이름을 해설로 확정해 버리기보다 긴장을 보존하는 편이 본문에 더 충실합니다.
  doctrine_reference: 원문 우선, 우상숭배 비판의 신학적 긴장 보존
