  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/021.yaml
  text: And this became an ambush against life[a], because men, enslaved by calamity or by tyranny, bestowed the incommunicable name on stones and wood.
  footnotes:
  - marker: a
    text: Or 'the unshared name'—that is, the divine name or honor that should not be attributed to idols.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 생명에 대한 매복이 되었습니다[a]. 왜냐하면 재앙이나 폭정에 종속된 사람들이 그 공유될 수 없는 이름을 돌과 나무에 돌렸기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나눌 수 없는 이름’. 곧 하나님께만 속한 이름이나 영예를 가리키며, 우상에게 돌릴 수 없다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔνεδρον
  english_pob_choice: ambush
  chosen_korean: 매복
  alternatives_korean:
  - 함정
  - 덫
  lexicon: LSJ
  rationale: 군사적·위협적 이미지를 살리기 위해 ‘매복’을 택했습니다. ‘함정’이나 ‘덫’도 가능하지만, 생명에 대한 적의성을 더 직접적으로 드러내는 표현은 ‘매복’입니다.
- source_word: τῷ βίῳ
  english_pob_choice: against life
  chosen_korean: 생명에 대한
  alternatives_korean:
  - 생명을 향한
  - 삶에 대한
  lexicon: LSJ
  rationale: ἐγένετο εἰς ἔνεδρον과 결합된 방향성을 살려, 이 행위가 생명을 겨냥한 위협이 되었음을 한국어 조사구로 옮겼습니다.
- source_word: τὸ ἀκοινώνητον ὄνομα
  english_pob_choice: the incommunicable name
  chosen_korean: 그 공유될 수 없는 이름
  alternatives_korean:
  - 그 유일한 이름
  - 그 나눌 수 없는 이름
  lexicon: LSJ
  rationale: ἀκοινώνητον의 핵심인 ‘공유되지 않음/나눔 없음’을 직역에 가깝게 반영했습니다. ‘공유될 수 없는’은 우상에게 돌려서는 안 되는 신적 이름의 배타성을 유지합니다.
- source_word: λίθοις καὶ ξύλοις
  english_pob_choice: stones and wood
  chosen_korean: 돌과 나무
  alternatives_korean:
  - 돌과 목재
  - 돌과 나무 우상
  lexicon: LSJ
  rationale: 원문이 구체적으로 재료를 말하므로, 해석을 덧붙인 ‘우상’을 넣지 않고 재료 자체를 그대로 살렸습니다.
- source_word: περιέθεσαν
  english_pob_choice: bestowed
  chosen_korean: 돌렸기
  alternatives_korean:
  - 돌렸습니다
  - 부여했기
  - 돌려주었기
  lexicon: LSJ
  rationale: ‘이름을 …에 돌리다/돌려 붙이다’는 우상에 신적 이름을 돌려 붙이는 행위를 자연스럽게 드러냅니다. ‘부여하다’보다 의미의 방향성이 더 분명합니다.
theological_decisions:
- issue: ἀκοινώνητον ὄνομα의 신학적 함의
  chosen_reading: 우상에게 돌려서는 안 되는, 본래 하나님께만 속한 배타적 이름을 가리키는 표현으로 유지했습니다.
  alternative_readings:
  - ‘나눌 수 없는 이름’으로 더 추상화
  - ‘하나님의 이름’이라고 명시
  rationale: 원문은 신적 이름의 고유성과 우상숭배의 오류를 강하게 대비하지만, 그 이름을 해설로 확정해 버리기보다 긴장을 보존하는 편이 본문에 더 충실합니다.
  doctrine_reference: 원문 우선, 우상숭배 비판의 신학적 긴장 보존
