translation:
  language: ko
  text: 이 일은 삶에 덫이 되었습니다[a]. 이는 재앙이나 폭정에 예속된 사람들이 나누어 줄 수 없는 그 이름을 돌과 나무에 부여했기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘생명을 노리는 매복’. ‘나누어 줄 수 없는 이름’은 돌과 나무에 돌려서는 안 될 신적 이름 또는 영예를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔνεδρον
  english_pob_choice: ambush
  chosen_korean: 매복
  alternatives_korean:
  - 함정
  - 덫
  lexicon: LSJ
  rationale: 군사적·위협적 이미지를 살리기 위해 ‘매복’을 택했습니다. ‘함정’이나 ‘덫’도 가능하지만, 생명에 대한 적의성을 더 직접적으로 드러내는 표현은 ‘매복’입니다.
