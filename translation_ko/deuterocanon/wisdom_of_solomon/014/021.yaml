  - 그 나눌 수 없는 이름
  lexicon: LSJ
  rationale: ἀκοινώνητον의 핵심인 ‘공유되지 않음/나눔 없음’을 직역에 가깝게 반영했습니다. ‘공유될 수 없는’은 우상에게 돌려서는 안 되는 신적 이름의 배타성을 유지합니다.
- source_word: λίθοις καὶ ξύλοις
  english_pob_choice: stones and wood
  chosen_korean: 돌과 나무
  alternatives_korean:
  - 돌과 목재
  - 돌과 나무 우상
  lexicon: LSJ
  rationale: 원문이 구체적으로 재료를 말하므로, 해석을 덧붙인 ‘우상’을 넣지 않고 재료 자체를 그대로 살렸습니다.
- source_word: περιέθεσαν
