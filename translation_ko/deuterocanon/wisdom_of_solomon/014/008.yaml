  text: 그러나 손으로 만든 것은 저주받은 것이며[a], 그것과 그것을 만든 이 모두가 저주받은 것입니다. 이는 만든 이는 일을 하고 있었는데, 썩어 없어질 것은 신이라 불렸기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
