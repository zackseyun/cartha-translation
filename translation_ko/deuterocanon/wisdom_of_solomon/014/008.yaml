    text: 직역하면 ‘손으로 만든 것’입니다. 문맥상 우상을 가리키지만, 본문 자체의 표현은 더 넓습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘한 신으로 불렸다’입니다.
    reason: alternative_reading
