base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/006.yaml
  text: For when the proud giants were being destroyed at the beginning[a], the hope of the world, taking refuge on a raft, left to the age to come a seed of generation[b], steered by your hand.
  footnotes:
  - marker: a
    text: Or 'on a vessel' or 'on a small craft.' The Greek says 'raft,' a rhetorically marked term rather than the usual word for a ship or ark.
    reason: lexical_alternative
  - marker: b
    text: Or 'for posterity' or 'for the age.' The Greek distinguishes 'world' (κόσμος) earlier in the verse from 'age' (αἰών) here.
    reason: lexical_alternative
translation:
  language: ko
  text: 사실, 교만한 거인들이 처음에 멸망해 가고 있을 때, 세상의 희망은 당신의 손으로 조타된 뗏목[a] 위로 피신하여 그 시대[b]에 태어남의 씨앗을 남겼습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘배 위에서’나 ‘작은 배 위에서’로도 옮길 수 있습니다. 여기서 그리스어는 일반적인 배나 방주를 가리키는 말이 아니라, 수사적으로 두드러진 ‘뗏목’이라는 표현을 씁니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘후대를 위하여’ 또는 ‘시대를 위하여’로도 옮길 수 있습니다. 여기서는 κόσμος(세상)와 αἰών(시대)을 구별합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπερηφάνων γιγάντων
  english_pob_choice: the proud giants
  chosen_korean: 교만한 거인들
  alternatives_korean:
