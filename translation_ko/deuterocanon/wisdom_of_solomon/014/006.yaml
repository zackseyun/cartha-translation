  alternatives_korean:
  - 사라져 갈 때
  - 망해 가고 있을 때
  lexicon: BDAG
  rationale: 현재분사 수동/중간형의 진행성을 살리되, 심판 문맥에서 ‘멸망하다’가 가장 직접적으로 대응합니다.
- source_word: ἐπὶ σχεδίας
  english_pob_choice: on a raft
  chosen_korean: 뗏목 위에서
  alternatives_korean:
  - 뗏목 위에
  - 간이 뗏배 위에서
  lexicon: LSJ
  rationale: σχεδία의 비정형적 항해물 이미지를 살려 ‘뗏목’으로 옮기고, 위치 표현은 한국어에서 자연스러운 ‘위에서’로 처리했습니다.
- source_word: τῇ σῇ κυβερνηθείσῃ χειρί
  english_pob_choice: steered by your hand
  chosen_korean: 당신의 손이 조종하는 채로
  alternatives_korean:
  - 당신의 손에 이끌린 채로
  - 당신의 손으로 조종된 채로
  lexicon: LSJ
  rationale: κυβερνάω의 ‘조타하다/조종하다’ 뜻을 반영해 항해적 이미지를 유지했고, 수동분사의 결과 상태를 ‘-는 채로’로 드러냈습니다.
- source_word: ἡ ἐλπὶς τοῦ κόσμου
  english_pob_choice: the hope of the world
  chosen_korean: 세상의 희망
  alternatives_korean:
  - 세상의 소망
  - 세상의 희망이
  lexicon: BDAG
  rationale: 인격화된 표현을 과도하게 해석하지 않으면서도, κόσμος를 한국어에서 자연스러운 ‘세상’으로 옮겨 원문의 넓은 의미를 유지했습니다.
- source_word: τῷ αἰῶνι
  english_pob_choice: to the age
  chosen_korean: 그 시대에
  alternatives_korean:
  - 그 세대에
  - 그 시대를 위해
  lexicon: LSJ
  rationale: κόσμος와 구별되는 αἰών을 시간적 범주로 살려 ‘시대’로 옮겼고, 여기에 도착/귀속의 방향성을 ‘-에’로 표현했습니다.
- source_word: σπέρμα γενέσεως
  english_pob_choice: a seed of generation
  chosen_korean: 세대의 씨앗
  alternatives_korean:
  - 후손의 씨앗
  - 번성의 씨앗
  lexicon: LSJ
  rationale: ‘씨앗’의 은유를 그대로 두되 γενέσεως의 ‘생성/생겨남/세대’ 의미를 한국어에서 간결하게 살려 ‘세대의 씨앗’으로 옮겼습니다.
theological_decisions:
- issue: ‘희망’의 지시 대상과 인격화
  chosen_reading: 세상의 희망은 노아와 그를 통해 보존된 인류의 남은 자를 가리키는 인격화된 표현으로 유지했습니다.
  alternative_readings:
  - 추상적 ‘희망’ 자체가 살아남았다는 읽기
  - 노아를 직접 이름 없이 암시하는 읽기
  rationale: feminine participle와 ἐλπίς의 توافق을 무리 없이 살리면서, 본문이 말하는 구체적 구원을 추상화하지 않도록 했습니다.
  doctrine_reference: 원문이 허용하는 인격화는 유지하고, 해석적 평탄화는 피합니다.
- issue: κόσμος와 αἰών의 구별
  chosen_reading: κόσμος는 ‘세상’, αἰών은 ‘그 시대’로 달리 옮겨 두 단어의 대비를 드러냈습니다.
  alternative_readings:
  - 둘 다 ‘세상’으로 번역
  - αἰών을 ‘미래’나 ‘후손’으로 의역
  rationale: 동일어 반복을 피함으로써 원문의 시간-세계 구별을 보존하고, 후대 독자가 의미 차이를 추적할 수 있게 했습니다.
  doctrine_reference: 원어의 의미 차이를 보존하는 번역 원칙
