  - 거만한 거인들
  lexicon: LSJ
  rationale: ὑπερήφανος의 도덕적 함의는 ‘교만한’이 가장 자연스럽고, γίγαντες는 헬라적 유대 전승의 ‘거인들’로 옮기는 것이 직역성과 가독성을 함께 지킵니다.
- source_word: ἀπολλυμένων
