base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/022.yaml
  text: Then it was not enough for them to go astray concerning the knowledge of God[a], but also, living in a great war of ignorance[b], they call such great evils peace.
  footnotes:
  - marker: a
    text: Or 'to be led astray concerning the knowledge of God.' The Greek infinitive can be understood with a more passive nuance.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'a great war of ignorance' preserves the Greek metaphor; it describes life dominated by ignorance as though it were a state of warfare or deep conflict.
    reason: cultural_note
translation:
  language: ko
  text: 그것이 하나님에 대한 지식에서 길을 잘못 드는 것만으로는 부족하더니, 또한 무지의 거대한 전쟁 속에 살면서 이런 수많은 악을 평화라고 부릅니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님에 대한 지식에서 길을 잘못 들게 되는 것’으로도 볼 수 있습니다. 그리스어 부정사에는 더 수동적인 뉘앙스가 가능합니다.
    reason: alternative_reading
  - marker: b
    text: ‘무지의 거대한 전쟁’은 그리스어 은유를 살린 표현으로, 무지에 지배된 삶을 전쟁 상태처럼 묘사합니다.
    reason: cultural_note
lexical_decisions:
- source_word: πλανᾶσθαι
  english_pob_choice: to go astray
  chosen_korean: 길을 잘못 드는 것
  alternatives_korean:
