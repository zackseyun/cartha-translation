base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/022.yaml
  text: Then it was not enough for them to go astray concerning the knowledge of God[a], but also, living in a great war of ignorance[b], they call such great evils peace.
  footnotes:
  - marker: a
    text: Or 'to be led astray concerning the knowledge of God.' The Greek infinitive can be understood with a more passive nuance.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'a great war of ignorance' preserves the Greek metaphor; it describes life dominated by ignorance as though it were a state of warfare or deep conflict.
    reason: cultural_note
translation:
  language: ko
  text: 그들에게는 하나님에 대한 지식에서 길을 잘못 드는 것[a]만으로 충분하지 않았습니다. 또한 무지의 큰 전쟁[b] 속에서 살면서, 그처럼 큰 악들을 평화라고 부릅니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님에 대한 지식에서 길을 잘못 들게 되는 것’으로도 볼 수 있습니다. 그리스어 부정사에는 더 피동적인 뉘앙스도 가능합니다.
    reason: alternative_reading
  - marker: b
    text: ‘무지의 큰 전쟁’은 그리스어 은유를 살린 표현으로, 무지에 지배된 삶을 전쟁 상태나 깊은 갈등처럼 묘사합니다.
    reason: cultural_note
lexical_decisions:
- source_word: πλανᾶσθαι
  english_pob_choice: to go astray
  chosen_korean: 길을 잘못 드는 것
  alternatives_korean:
  - 방황하는 것
  - 속는 것
  - 잘못되게 되는 것
  lexicon: LSJ
  rationale: 지식의 주제와 결합된 도덕적·인지적 이탈을 자연스럽게 살리면서, 외적 기만을 과도하게 단정하지 않도록 했습니다.
- source_word: περὶ τὴν τοῦ θεοῦ γνῶσιν
  english_pob_choice: concerning the knowledge of God
  chosen_korean: 하나님에 대한 지식에서
  alternatives_korean:
  - 하나님을 아는 지식에서
  - 하나님을 아는 일에 관하여
  - 하나님의 지식에 관하여
  lexicon: LSJ
  rationale: γνῶσις의 대상 관계를 유지하되, 한국어에서는 ‘하나님에 대한 지식’이 가장 직역에 가깝고 문맥상 무리 없이 읽힙니다.
- source_word: ἀγνοίας πολέμῳ
  english_pob_choice: a great war of ignorance
  chosen_korean: 무지의 거대한 전쟁 속에
  alternatives_korean:
  - 무지의 큰 전쟁 속에
  - 무지라는 거대한 전쟁 속에
  - 무지의 치열한 싸움 속에
  lexicon: LSJ
  rationale: πόλεμος의 전쟁 이미지를 살리면서, ‘무지’가 그 상태를 규정하는 방식으로 연결해 원문의 은유를 보존했습니다.
- source_word: τὰ τοσαῦτα κακὰ
  english_pob_choice: such great evils
  chosen_korean: 이런 수많은 악
  alternatives_korean:
  - 그런 큰 악
  - 그토록 큰 악들
  - 이처럼 큰 악들
  lexicon: LSJ
  rationale: τοσαῦτα의 다량성과 강도를 함께 살리기 위해 ‘수많은’과 ‘악’을 결합해, 단순한 추상적 악이 아니라 다수의 중대한 악행이라는 뉘앙스를 담았습니다.
- source_word: προσαγορεύουσιν
  english_pob_choice: they call
  chosen_korean: 평화라고 부릅니다
  alternatives_korean:
  - 평화라 부릅니다
  - 평화라고 이름합니다
  - 평화라고 칭합니다
  lexicon: LSJ
  rationale: 원문의 아이러니—악을 평화로 잘못 명명하는 행위—를 한국어에서 가장 직접적으로 드러내는 표현입니다.
theological_decisions:
- issue: ‘knowledge of God’의 대상 관계와 문체 수준
  chosen_reading: 하나님에 대한 지식
  alternative_readings:
  - 하나님을 아는 지식
  - 하나님의 지식
  rationale: 원문의 초점은 하나님 자신이 아니라 하나님에 대한 참된 인식이므로, 한국어에서도 대상 관계를 분명히 했습니다.
  doctrine_reference: 'Translation philosophy: source-directed clarity'
- issue: ‘great war of ignorance’의 은유 보존 여부
  chosen_reading: 무지의 거대한 전쟁
  alternative_readings:
  - 무지의 큰 싸움
  - 무지라는 거대한 전쟁
  - 무지로 인한 큰 혼란
  rationale: 이 구절의 힘은 무지를 단순한 혼란이 아니라 전쟁적 상태로 묘사하는 데 있으므로, 은유를 약화시키지 않고 유지했습니다.
  doctrine_reference: 'Translation philosophy: preserve metaphor'
