  text: 그것은 맹세하는 대상의 힘이 아니라, 죄를 짓는 자들에게 내리는 벌이 늘 의로운 자들의 범법을 뒤따르기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
