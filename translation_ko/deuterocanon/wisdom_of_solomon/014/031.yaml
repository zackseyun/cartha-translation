    text: 또는 '맹세의 힘', 혹은 '맹세할 때 부르는 것들의 힘'입니다. 그리스어 표현은 압축되어 있어, 맹세 자체를 가리키는지 또는 맹세할 때 불러내는 대상을 가리키는지 모두 가능할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '죄를 짓는 자들의 벌이 늘 의로운 자들의 범법을 뒤따릅니다.'
