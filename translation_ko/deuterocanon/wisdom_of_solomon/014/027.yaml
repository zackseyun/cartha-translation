  lexicon: LSJ
  rationale: 범위를 포괄하는 속격 구문을 한국어로 압축해 옮기되, 과도한 확대 없이 총체성을 드러내도록 했습니다.
- source_word: ἀρχὴ ... καὶ αἰτία καὶ πέρας
  english_pob_choice: beginning and cause and end
  chosen_korean: 시작과 원인과 끝
  alternatives_korean:
  - 근원과 원인과 완성
  - 시초와 원인과 종결
  lexicon: LSJ
  rationale: 그리스어의 삼중 병렬을 그대로 드러내기 위해 ‘시작-원인-끝’의 구조를 유지했고, ‘끝’은 단순 종결과 궁극적 귀결을 함께 들리게 합니다.
theological_decisions:
- issue: ἀνωνύμων이 우상을 어떻게 규정하는지
  chosen_reading: ‘무명의 우상’으로 옮겨, 우상이 참된 이름과 권위를 갖지 못한다는 함의를 열어 둡니다.
  alternative_readings:
  - ‘이름 없는 우상’
  - ‘무명한 우상’
  rationale: 원문은 왜 ‘무명’한지 명시하지 않으므로, 설명을 덧붙여 신학적 결론을 미리 고정하지 않고 긴장을 보존합니다.
  doctrine_reference: Translation philosophy §3
- issue: 삼중 표현 ἀρχὴ καὶ αἰτία καὶ πέρας의 해석
  chosen_reading: ‘시작과 원인과 끝’으로 직역적 구조를 유지했습니다.
  alternative_readings:
  - ‘근원과 원인과 완성’
  - ‘시초와 원인과 종결’
  rationale: 원문의 수사적 압축과 단정적 비난을 약화시키지 않기 위해, 해석적 확장보다 병렬 구조를 우선했습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
