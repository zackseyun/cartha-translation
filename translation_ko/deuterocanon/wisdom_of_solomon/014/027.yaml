  lexicon: LSJ
  rationale: 직역성은 유지하면서 한국어 관용으로도 자연스러운 표현을 택해, 우상이 ‘참된 이름’이 없다는 뉘앙스를 보존합니다.
- source_word: παντὸς ... κακοῦ
  english_pob_choice: every evil
  chosen_korean: 모든 악
