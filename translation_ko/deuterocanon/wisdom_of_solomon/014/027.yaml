  text: For the worship of nameless idols is the beginning and cause and end of every evil[a][b].
  footnotes:
  - marker: a
    text: Or 'idols without a name.' The Greek adjective can stress that these idols lack a true or worthy name.
    reason: lexical_alternative
  - marker: b
    text: The sequence 'beginning and cause and end' may also be understood as 'origin, cause, and culmination.'
    reason: lexical_alternative
translation:
  language: ko
  text: 무명의 우상에 대한 숭배는 모든 악의 시작과 원인과 끝입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이름 없는 우상들’입니다. 그리스어 형용사는 이 우상들이 참되거나 마땅한 이름을 갖지 못함을 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘시작과 원인과 끝’은 ‘근원, 원인, 그리고 완성’으로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: θρησκεία
  english_pob_choice: worship
  chosen_korean: 숭배
  alternatives_korean:
  - 예배
  - 종교
