  doctrine_reference: Translation philosophy §3
- issue: 삼중 표현 ἀρχὴ καὶ αἰτία καὶ πέρας의 해석
  chosen_reading: ‘시작과 원인과 끝’으로 직역적 구조를 유지했습니다.
  alternative_readings:
  - ‘근원과 원인과 완성’
