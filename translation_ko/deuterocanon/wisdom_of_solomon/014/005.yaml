base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/005.yaml
  text: But you intend that the works of your wisdom should not be idle[a]; therefore even with the smallest piece of wood men entrust their lives, and passing through the waves on a raft[b], they were brought safely through.
  footnotes:
  - marker: a
    text: Or 'their souls.' Here the sense is likely 'their lives' in the context of risking oneself at sea.
    reason: lexical_alternative
  - marker: b
    text: Or 'a very small piece of wood.' The phrase highlights the frailty of the vessel in contrast to the preserving work of divine wisdom.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 당신께서는 당신의 지혜의 일들이 헛되지 않기를 원하십니다[a]. 그러므로 사람들은 가장 작은 나무 조각[b]에 자기들의 생명을 맡기고, 뗏목을 타고 물결을 지나 무사히 구원을 받습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무익하지 않기를.’ ἀργός는 ‘게으른, 활동하지 않는, 무익한’이라는 뜻을 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘아주 작은 나무 조각으로.’ 이 표현은 배의 재료가 매우 보잘것없음을 강조합니다.
    reason: lexical_alternative
