theological_decisions:
- issue: ‘당신의 지혜’의 신학적 대상
  chosen_reading: 이 구절은 하나님께 직접 말을 걸면서도 ‘당신의 지혜의 일들’이라고 말하므로, 지혜를 하나님의 활동 방식으로 번역하되 별도의 위격 교리로 과도하게 확장하지 않았습니다.
  alternative_readings:
  - 지혜를 더 강하게 인격화한 번역
  - 지혜를 단순히 ‘지혜로우심’으로 약화한 번역
  rationale: 원문은 하나님께 대한 직접 خطاب과 지혜의 일들을 함께 말하므로, 그 긴장을 그대로 보존하는 것이 가장 충실합니다.
