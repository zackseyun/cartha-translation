  lexicon: LSJ
  rationale: 우상의 실체 없음을 한국어로 자연스럽게 드러내기 위해 ‘생명 없는’을 선택했습니다. 이는 단순한 공허함보다 우상들의 무력함을 더 직접적으로 보여 줍니다.
