  rationale: κακῶς는 맹세의 도덕적 성격을 드러내므로 ‘악하게’로 옮겼고, ὀμόσαντες는 시간적 분사로 보아 ‘맹세한 뒤에도’로 처리했습니다.
- source_word: ἀδικηθῆναι
  english_pob_choice: to be harmed
  chosen_korean: 해를 입을 것이라고는
  alternatives_korean:
  - 억울한 일을 당할 것이라고는
  - 잘못을 당할 것이라고는
  - 벌을 받을 것이라고는
  lexicon: BDAG
  rationale: 이 동사는 넓게 ‘해를 입다/손해를 당하다’를 뜻할 수 있으므로, 문맥의 폭을 유지하는 가장 자연스러운 표현으로 처리했습니다.
theological_decisions:
- issue: 악한 맹세 후의 결과에 대한 기대의 범위
  chosen_reading: 우상들이 무력하다고 여기므로, 그들은 그 맹세에 대한 응보나 손해를 예상하지 않습니다.
  alternative_readings:
  - 우상들 자신에게서 해를 입지 않을 것으로 여깁니다.
  - 거짓 맹세에 대한 벌을 기대하지 않는다는 뜻입니다.
  rationale: 그리스어 ἀδικηθῆναι는 ‘불의한 일을 당하다’부터 ‘해를 입다/벌을 받다’까지 폭이 있으므로, 우상 숭배의 허망함과 그에 따른 도덕적 무감각을 함께 살리는 방향으로 열어 두었습니다.
  doctrine_reference: 의미의 폭을 보존하고, 문맥이 허용하는 긴장을 해소하지 않습니다.
