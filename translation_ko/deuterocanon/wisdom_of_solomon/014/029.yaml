  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/029.yaml
  text: For because they trusted in lifeless idols[b][a], after swearing wickedly they do not expect to be harmed.
  footnotes:
  - marker: a
    text: Or 'vain idols' or 'worthless idols.' The Greek adjective stresses the idols' emptiness or unreality.
    reason: lexical_alternative
  - marker: b
    text: Or 'they do not expect to be wronged' or 'they do not expect punishment.' The Greek can refer generally to suffering harm; in context it likely implies no feared retribution for wicked oath-taking.
    reason: alternative_reading
translation:
  language: ko
  text: 그들이 생명 없는 우상들을 의지했기 때문에[a], 악하게 맹세한 뒤 해를 입을 것이라고는[b] 기대하지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘헛된 우상들’, ‘무가치한 우상들’. 그리스어 형용사는 우상들의 공허함과 비실재성을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들은 부당한 일을 당할 것이라고 기대하지 않는다’ 혹은 ‘벌을 받을 것이라고 기대하지 않는다’. 문맥상으로는 무력한 우상 때문에 응보를 두려워하지 않는 뜻일 가능성이 큽니다.
    reason: alternative_reading
lexical_decisions:
- source_word: αἴγνιοι
  english_pob_choice: lifeless
  chosen_korean: 생명 없는
  alternatives_korean:
