lexical_decisions:
- source_word: ἐπίτασιν
  english_pob_choice: intensification
  chosen_korean: 강화
  alternatives_korean:
  - 증대
  - 심화
  - 고양
  lexicon: LSJ
  rationale: θρησκείας와 결합된 결과를 자연스럽게 드러내면서도, ‘더 강하고 더 두드러진 형태로’라는 뜻을 간결하게 살리기 위해 ‘강화’로 옮겼습니다.
- source_word: θρησκείας
  english_pob_choice: worship
  chosen_korean: 경배
  alternatives_korean:
  - 종교
  - 종교적 관행
  - 예배
  lexicon: LSJ
  rationale: 이 문맥은 우상숭배의 확대를 가리키므로, 추상적인 ‘종교’보다 실제 숭배 행위를 드러내는 ‘경배’가 원문의 실천적 의미를 더 직접적으로 반영합니다.
- source_word: ἀγνοοῦντας
  english_pob_choice: those who were ignorant
  chosen_korean: 무지한 사람들
  alternatives_korean:
  - 모르는 사람들
  - 알지 못하는 사람들
  - 무지한 자들
  lexicon: LSJ
  rationale: 분사로 표현된 사람들을 한국어에서도 인격적 대상을 유지해 번역하기 위해 ‘사람들’을 보강했고, 상태를 드러내는 ‘무지한’으로 옮겼습니다.
- source_word: φιλοτιμία
  english_pob_choice: ambition
  chosen_korean: 야심
  alternatives_korean:
  - 명예욕
  - 출세욕
  - 명예를 사랑하는 마음
  lexicon: LSJ
  rationale: 직역하면 ‘명예를 사랑함’이지만, 여기서는 장인이 자신의 명망과 성공을 추구하는 동기가 우상 숭배를 부추긴다는 의미이므로 ‘야심’이 가장 압축적이고 자연스럽습니다.
theological_decisions:
- issue: θρησκεία의 번역을 ‘종교’로 둘지 ‘경배’로 둘지
  chosen_reading: 경배
  alternative_readings:
  - 종교
  - 종교적 관행
  - 예배
  rationale: 본문은 일반 종교의 형성보다 우상에 대한 숭배 행위의 강화에 초점이 있으므로, 독자가 곧바로 숭배의 대상과 행위를 읽어내도록 ‘경배’로 번역했습니다.
  doctrine_reference: 문맥 우선 원칙; 우상숭배 경고 본문에서의 용어 투명성
