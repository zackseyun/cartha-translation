  lexicon: LSJ
  rationale: 문맥에서 하나님의 적극적 통치와 돌보심을 함께 담는 말이 필요하므로, 교회 한국어에서도 익숙하면서도 신학적 무게를 지닌 ‘섭리’가 가장 적절합니다.
