  - ‘다스립니다’로 권위 중심으로 옮길 수 있습니다.
  rationale: 본문은 단순한 추상 개념이 아니라 바다와 파도 속에서 길을 내시는 하나님의 실제적 통치를 말하므로, 항해적 동사를 살려 섭리의 능동성을 드러내는 것이 좋습니다.
  doctrine_reference: Wisdom literature on divine providence and guidance through chaos; cf. source context and POB lexical note on nautical sense.
