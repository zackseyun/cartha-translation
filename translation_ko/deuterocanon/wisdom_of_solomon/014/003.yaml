  text: 그러나 아버지, 주님의 섭리가 그것을 이끕니다. 주님께서 바다 가운데에 길을 주시고, 파도 가운데에 안전한 길을 내주셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
