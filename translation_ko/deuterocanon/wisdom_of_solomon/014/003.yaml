  lexicon: LSJ
  rationale: 두 명사 모두 ‘길’ 계열로 평행을 이루므로, 첫 번째는 기본 의미의 ‘길’, 두 번째는 형용사 ἀσφαλῆ를 살려 ‘안전한 길’로 옮겨 대구를 보존했습니다.
- source_word: ἐν θαλάσσῃ / ἐν κύμασι
  english_pob_choice: in the sea / in the waves
  chosen_korean: 바다 가운데에 / 파도 가운데에
  alternatives_korean:
  - 바다 속에 / 파도 속에
  - 바다 안에 / 파도 안에
  lexicon: LSJ
  rationale: 직역하면 ‘안에’이지만, 한국어에서는 시적이면서도 자연스럽게 바다와 파도 한가운데를 강조하는 ‘가운데에’가 원문의 강한 이미지와 잘 맞습니다.
