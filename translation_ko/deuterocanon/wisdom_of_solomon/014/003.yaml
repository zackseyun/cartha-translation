  lexicon: LSJ
  rationale: 이 동사는 항해적 이미지가 강하지만 한국어에서는 너무 기계적인 ‘조종하다’보다, 문맥의 배를 이끄는 뜻을 살리면서도 자연스러운 ‘이끕니다’가 적절합니다.
- source_word: ὁδὸν ... τρίβον ἀσφαλῆ
  english_pob_choice: a way ... a safe path
  chosen_korean: 길 ... 안전한 길
  alternatives_korean:
