lexical_decisions:
- source_word: διὰ τοῦτο
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이 때문에
  - 따라서
  lexicon: LSJ
  rationale: 앞선 논증을 받는 추론 접속사로 자연스럽게 연결하며, 한글 성경 문체에서도 간결하고 적절합니다.
- source_word: ὡς παισὶν ἀλογίστοις
  english_pob_choice: as to senseless children
  chosen_korean: 지각 없는 아이들에게 하듯이
  alternatives_korean:
