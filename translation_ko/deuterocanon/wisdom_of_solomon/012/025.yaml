translation:
  language: ko
  text: 그러므로 지각 없는 아이들에게 하듯이, 조롱을 위하여 심판을 보내셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '지각 없는 아이들처럼, 조롱으로 심판을 보내셨습니다.' 또는 '…심판을 조롱거리로 보내셨습니다.' 그리스어는 비교의 연결 방식과 εἰς ἐμπαιγμόν의 목적·방식·결과의 뉘앙스에 여지를 남깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이 때문에
  - 따라서
  lexicon: LSJ
  rationale: 앞선 논증을 받는 추론 접속사로 자연스럽게 연결하며, 한글 성경 문체에서도 간결하고 적절합니다.
- source_word: ὡς παισὶν ἀλογίστοις
  english_pob_choice: as to senseless children
  chosen_korean: 지각 없는 아이들에게 하듯이
  alternatives_korean:
  - 지각 없는 아이들처럼
  - 어리석은 아이들에게
  lexicon: LSJ
  rationale: ὡς의 비교적 의미를 살리되, 실제로 그들이 아이라는 뜻이 아니라 그렇게 대하셨다는 뉘앙스를 한국어로 분명히 했습니다. ἀλογίστοις는 단순한 '어린이'가 아니라 분별이 없는 상태를 가리켜 '지각 없는'이 적절합니다.
- source_word: τὴν κρίσιν
  english_pob_choice: judgment
  chosen_korean: 심판
  alternatives_korean:
  - 판결
  - 재판
  lexicon: LSJ
  rationale: 하나님의 행위로서의 κρίσις를 한국어 성경 어감에 맞게 '심판'으로 옮기되, 단순한 법정 절차보다 신적 판단과 징계의 의미를 함께 담았습니다.
- source_word: εἰς ἐμπαιγμόν
  english_pob_choice: for mockery / as a mockery
  chosen_korean: 조롱거리로
  alternatives_korean:
  - 조롱으로
  - 비웃음거리가 되게
  lexicon: LSJ
  rationale: εἰς의 방향·결과 의미를 살려, 심판이 그들에게 '조롱거리'가 되도록 주어졌다는 뜻을 자연스럽게 표현했습니다.
- source_word: ἔπεμψας
  english_pob_choice: you sent
  chosen_korean: 보내셨습니다
  alternatives_korean:
  - 보내셨다
  - 파견하셨습니다
  lexicon: LSJ
  rationale: πέμπω의 기본 의미를 그대로 살리면서, 하나님께 드리는 직접 خطاب이 아니라 서술문이므로 합쇼체로 정리했습니다.
theological_decisions:
- issue: ὡς παισὶν ἀλογίστοις의 비교 구문을 한국어로 어떻게 처리할지
  chosen_reading: 실제 아이들에 대한 진술이 아니라, 지각 없는 아이들처럼 대하셨다는 비교로 번역했습니다.
  alternative_readings:
  - 지각 없는 아이들로서
  - 지각 없는 아이들 같이
  rationale: 본문의 ὡς는 동일성보다 비교·대우의 기능이 강하므로, 오독을 막기 위해 '하듯이'로 옮겼습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
- issue: εἰς ἐμπαιγμόν의 의미를 '심판'보다 좁은 '벌'로 한정할지
  chosen_reading: '''심판''을 유지하고 그 결과를 ''조롱거리''로 표현했습니다.'
  alternative_readings:
  - 벌
  - 형벌
  rationale: 본문은 단순 형벌보다 신적 판정의 폭을 지닌 κρίσις를 사용하므로, 의미를 좁히지 않고 보존했습니다.
  doctrine_reference: Translation philosophy §1, §5
