  lexicon: LSJ
  rationale: εἰς의 방향·결과 의미를 살려, 심판이 그들에게 '조롱거리'가 되도록 주어졌다는 뜻을 자연스럽게 표현했습니다.
- source_word: ἔπεμψας
  english_pob_choice: you sent
  chosen_korean: 보내셨습니다
  alternatives_korean:
  - 보내셨다
  - 파견하셨습니다
  lexicon: LSJ
  rationale: πέμπω의 기본 의미를 그대로 살리면서, 하나님께 드리는 직접 خطاب이 아니라 서술문이므로 합쇼체로 정리했습니다.
theological_decisions:
- issue: ὡς παισὶν ἀλογίστοις의 비교 구문을 한국어로 어떻게 처리할지
  chosen_reading: 실제 아이들에 대한 진술이 아니라, 지각 없는 아이들처럼 대하셨다는 비교로 번역했습니다.
  alternative_readings:
  - 지각 없는 아이들로서
  - 지각 없는 아이들 같이
  rationale: 본문의 ὡς는 동일성보다 비교·대우의 기능이 강하므로, 오독을 막기 위해 '하듯이'로 옮겼습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
- issue: εἰς ἐμπαιγμόν의 의미를 '심판'보다 좁은 '벌'로 한정할지
  chosen_reading: '''심판''을 유지하고 그 결과를 ''조롱거리''로 표현했습니다.'
  alternative_readings:
  - 벌
  - 형벌
  rationale: 본문은 단순 형벌보다 신적 판정의 폭을 지닌 κρίσις를 사용하므로, 의미를 좁히지 않고 보존했습니다.
  doctrine_reference: Translation philosophy §1, §5
