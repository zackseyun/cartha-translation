  - 어리석은 아이들에게
  lexicon: LSJ
  rationale: ὡς의 비교적 의미를 살리되, 실제로 그들이 아이라는 뜻이 아니라 그렇게 대하셨다는 뉘앙스를 한국어로 분명히 했습니다. ἀλογίστοις는 단순한 '어린이'가 아니라 분별이 없는 상태를 가리켜 '지각 없는'이 적절합니다.
- source_word: τὴν κρίσιν
  english_pob_choice: judgment
  chosen_korean: 심판
  alternatives_korean:
  - 판결
  - 재판
  lexicon: LSJ
  rationale: 하나님의 행위로서의 κρίσις를 한국어 성경 어감에 맞게 '심판'으로 옮기되, 단순한 법정 절차보다 신적 판단과 징계의 의미를 함께 담았습니다.
- source_word: εἰς ἐμπαιγμόν
  english_pob_choice: for mockery / as a mockery
  chosen_korean: 조롱거리로
  alternatives_korean:
