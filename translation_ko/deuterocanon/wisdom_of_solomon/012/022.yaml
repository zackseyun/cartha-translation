translation:
  language: ko
  text: 그러므로 우리를 징계하시면서 우리 원수들을 무수한 채찍질로 치십니다.[a] 이는 우리가 심판할 때 하나님의 선하심을 깊이 생각하고, 우리가 심판받을 때 자비를 기대하도록 하시려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘만 단위의 채찍질로’입니다. 그리스어 표현 ἐν μυριότητι μαστιγοῖς는 헤아릴 수 없이 많은 채찍질 또는 그 극심함을 나타냅니다.
    reason: lexical_alternative
