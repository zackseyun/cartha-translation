  - 돌아보게 하시고
  lexicon: BDAG
  rationale: 문맥상 하나님의 선하심을 판단의 자리에서 의식하고 되새긴다는 뜻이므로, 자연스러운 현대 한국어로 ‘기억하게 하다’가 가장 가까운 효과를 냅니다.
