  lexicon: LSJ
  rationale: ‘무수한/수만’의 양감을 살리되, 본문의 강한 형벌 이미지를 한국어로 직접 드러내기 위해 ‘만 가지의 매질’로 옮겼습니다.
- source_word: μεριμνῶμεν
