translation:
  language: ko
  text: 그러므로 우리를 징계하시면서 우리 원수들을 만 가지의 매질로 치십니다. 이는 우리가 심판할 때 당신의 선하심을 기억하게 하시고, 우리가 심판받을 때는 긍휼을 기대하게 하시려는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘수없이 많은 매질로’로도 옮길 수 있습니다. 그리스어 표현 ἐν μυριότητι μαστιγοῖς는 엄청난 수의 매질이나 그 극심함을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεύων
