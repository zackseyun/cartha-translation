translation:
  language: ko
  text: 그러므로 당신께서도 삶의 어리석음 속에서 살았던 그 불의한 자들을 그들 자신의 가증한 것들을 통하여 괴롭히셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들 자신의 가증한 행위들을 통하여.’ 헬라어는 우상숭배와 관련된 행위나 대상을 포함하여, 넓게 가증한 것들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν καὶ
  english_pob_choice: Therefore you also
  chosen_korean: 그러므로 당신께서도
  alternatives_korean:
  - 그러므로 또한
  - 그리하여 당신께서도
  lexicon: LSJ
  rationale: ὅθεν은 앞선 논증의 결론을 잇는 말이므로 ‘그러므로’로 옮기고, καὶ의 강조를 ‘도’로 살려 앞선 행위와의 연속성을 드러냈습니다.
- source_word: τοὺς ... ἀδίκους
  english_pob_choice: those unrighteous men
  chosen_korean: 그 불의한 사람들을
  alternatives_korean:
  - 그 불의한 자들을
  - 그 의롭지 않은 사람들을
  lexicon: LSJ
  rationale: ἀδίκους는 의로움의 부재보다 불의한 성격을 가리키므로 ‘불의한’이 가장 직접적이며, substantival한 대상을 위해 ‘사람들’을 보탰습니다.
- source_word: ἐν ἀφροσύνῃ ζωῆς βιώσαντας
  english_pob_choice: who had lived in the folly of life
  chosen_korean: 삶의 어리석음 속에 살았던
  alternatives_korean:
  - 인생의 어리석음 속에 살았던
  - 어리석은 삶을 살았던
  lexicon: LSJ
  rationale: ἀφροσύνη는 ‘어리석음, 무분별함’이므로 ‘어리석음’으로 옮기고, ζωῆς의 수식 관계를 자연스럽게 살리기 위해 ‘삶의’로 표현했습니다.
- source_word: διὰ τῶν ἰδίων βδελυγμάτων
  english_pob_choice: through their own abominations
  chosen_korean: 그들의 자기 가증한 행위로 말미암아
  alternatives_korean:
  - 그들의 고유한 가증한 것들로 말미암아
  - 그들 자신의 혐오스러운 것들을 통해
  lexicon: LSJ
  rationale: διά + 속격은 수단/매개를 나타내므로 ‘-로 말미암아’로 자연스럽게 옮겼고, βδελύγματα는 단순한 물건보다 가증한 행위까지 포함할 수 있어 ‘가증한 행위’로 넓게 번역했습니다.
- source_word: ἐβασάνισας
  english_pob_choice: you tormented
  chosen_korean: 고통스럽게 하셨습니다
  alternatives_korean:
  - 고문하셨습니다
  - 괴롭게 하셨습니다
  lexicon: LSJ
  rationale: βασανίζω는 강한 고통과 괴로움을 뜻하지만 한국어 ‘고문’은 물리적 고문으로 너무 좁을 수 있어, 심판의 తీవ్ర함을 살리면서도 범위를 넓힌 ‘고통스럽게 하셨습니다’로 옮겼습니다.
theological_decisions:
- issue: βδελυγμάτων의 범위와 심판의 수단성
  chosen_reading: 하나님께서 그들의 가증한 것/행위 자체를 통해 합당한 되갚음을 하신다는 뜻을 유지했습니다.
  alternative_readings:
  - 그들의 가증한 행위 때문에 그들을 벌하셨다
  - 그들의 우상숭배적 대상들을 수단으로 삼아 벌하셨다
  rationale: διά + 속격은 원인보다 수단성에 무게가 있으므로, 본문이 말하는 ‘맞물린 심판’의 긴장을 보존했습니다. βδελύγματα의 구체 대상을 우상으로 지나치게 한정하지 않았습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
