translation:
  language: ko
  text: 그러므로 당신께서도 그들의 자기 가증한 행위로 말미암아, 삶의 어리석음 속에 살았던 그 불의한 사람들을 고통스럽게 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
