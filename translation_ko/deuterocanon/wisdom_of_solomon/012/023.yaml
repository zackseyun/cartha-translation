  to: 그러므로 당신께서도 삶의 어리석음 속에서 살았던 그 불의한 자들을 그들 자신의 가증한 것들을 통하여 괴롭히셨습니다.[a]
  rationale: ‘그들 자신의 가증한 것들’을 사용하여 βδελυγμάτων의 복수형 및 포괄적 의미를 보존하고, ‘통하여’로 διά+속격의 수단성을 유지했습니다. 각주는 ‘행위’라는 가능한 해석을 제시하되 본문에서 이를 단정하지 않습니다. 문체는 현대 표준어 합쇼체를 유지했습니다.
