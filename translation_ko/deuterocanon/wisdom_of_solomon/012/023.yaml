  - severity: medium
    issue: βδελυγμάτων를 본문에서 ‘가증한 행위’로 확정
    rationale: 원어는 가증한 것들 전반을 가리킬 수 있으며, 문맥상 우상숭배 행위 또는 대상도 가능하므로 본문은 포괄적으로 유지해야 합니다.
