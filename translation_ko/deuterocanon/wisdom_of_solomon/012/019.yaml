translation:
  language: ko
  text: 이러한 일들을 통해 당신은 당신의 백성에게 의로운 이는 사람을 사랑하는 마음을 지녀야 한다는 것을 가르치셨고, 당신의 자녀들을 좋은 소망으로 가득 차게 하셨습니다. 그것은 당신이 죄에 대해 회개를 베푸시기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τῶν τοιούτων ἔργων
  english_pob_choice: by such deeds
  chosen_korean: 이러한 일들을 통해
  alternatives_korean:
  - 그러한 행위들을 통해
  - 이런 일들을 거쳐
  lexicon: LSJ
  rationale: διά + 속격은 수단·매개를 나타내므로, 하나님의 구체적 행위를 가리키는 문맥에 맞게 자연스럽게 옮겼습니다.
- source_word: τὸν δίκαιον
  english_pob_choice: the righteous
  chosen_korean: 의로운 이는
  alternatives_korean:
  - 의로운 사람은
  - 의로운 자는
  lexicon: BDAG
  rationale: 그리스어 단수 남성형의 대표적 표현을 살리되, 한국어에서는 성별을 노출하기보다 품위를 유지하는 중립적 인칭 표현으로 옮겼습니다.
- source_word: φιλάνθρωπον
  english_pob_choice: humane
  chosen_korean: 사람을 사랑하는 마음을 지녀야 한다
  alternatives_korean:
  - 인간에게 친절해야 한다
  - 인류를 사랑해야 한다
  - 자애로워야 한다
  lexicon: LSJ
  rationale: φιλάνθρωπος의 핵심은 사람들에 대한 친절과 호의이므로, 추상적 형용사보다 의미가 드러나는 표현으로 풀어 옮겼습니다.
- source_word: εὐέλπιδας
  english_pob_choice: full of good hope
  chosen_korean: 좋은 소망으로 가득 차게
  alternatives_korean:
  - 희망에 차게
  - 좋은 희망을 품게
  lexicon: LSJ
  rationale: ‘좋은 소망’의 긍정적 뉘앙스를 살리면서, 형용사의 상태 의미를 한국어의 서술적 표현으로 자연스럽게 반영했습니다.
- source_word: τοὺς υἱούς σου
  english_pob_choice: your sons
  chosen_korean: 당신의 자녀들을
  alternatives_korean:
  - 당신의 아들들을
  - 당신의 아들자녀들을
  lexicon: BDAG
  rationale: 본문은 문자적으로 ‘아들들’이지만, 문맥상 하나님의 백성을 대표하는 집합적 표현으로 읽히므로 한국어에서는 오해를 줄이는 방향을 택했습니다.
- source_word: διδοῖς ἐπὶ ἁμαρτήμασιν μετάνοιαν
  english_pob_choice: you grant repentance for sins
  chosen_korean: 죄에 대해 회개를 베푸시기 때문입니다
  alternatives_korean:
  - 죄를 위한 회개를 주시기 때문입니다
  - 죄들에 대한 회개를 허락하시기 때문입니다
  lexicon: BDAG
  rationale: δίδωμι의 ‘주다/베풀다’와 μετάνοια의 ‘회개’ 의미를 살려, 하나님이 죄인에게 회개의 가능성을 주신다는 점을 드러냈습니다.
theological_decisions:
- issue: 의로운 이의 성격을 어떻게 표현할지
  chosen_reading: ‘의로운 이는 사람을 사랑하는 마음을 지녀야 한다’로 옮겨, 도덕적 필연성과 인간에 대한 호의를 함께 드러냈습니다.
  alternative_readings:
  - 의로운 이는 인자해야 합니다
  - 의로운 이는 사람들에게 친절해야 합니다
  rationale: φιλάνθρωπος는 단순한 온정이 아니라 사람을 향한 실제적 호의를 가리키므로, 한국어에서 그 함의를 분명히 전달했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 4
- issue: ‘아들들’의 대표적 의미 처리
  chosen_reading: 문맥상 대표적 집합 표현으로 보고 ‘자녀들’로 옮겼습니다.
  alternative_readings:
  - 아들들을
  - 아들들을 대표적으로
  rationale: 원문 형식은 남성 복수이지만, 지혜문맥에서 하나님의 백성을 포괄하는 표현으로 기능하므로 한국어에서는 의미 전달을 우선했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
