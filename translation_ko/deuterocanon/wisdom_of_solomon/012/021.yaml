translation:
  language: ko
  text: 얼마나 엄정하게 당신의 아들들을 심판하셨는지, 그들의 조상들에게 좋은 약속이 담긴 맹세와 계약을 주셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘얼마나 큰 엄정함으로’ 또는 ‘얼마나 엄격하게 당신의 아들들을 심판하셨는지’.
    reason: lexical_alternative
  - marker: b
    text: ‘아들들’은 ‘자녀들’로 옮길 수도 있으나, 그리스어는 분명히 ‘아들들’이라고 말합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘좋은 약속을 담은 맹세와 계약’.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ πόσης ἀκριβείας
  english_pob_choice: with how much care / with how much exactness
  chosen_korean: 얼마나 엄정하게
  alternatives_korean:
  - 얼마나 세밀하게
  - 얼마나 정확하게
  - 얼마나 신중하게
  lexicon: LSJ
  rationale: ἀκριβείας는 단순한 ‘주의’보다 판단의 엄격함·정밀함을 함께 드러내므로, 문맥상 하나님의 판결의 엄정함을 살리는 ‘엄정하게’가 가장 압축적으로 맞습니다.
- source_word: ἔκρινας
  english_pob_choice: you judged
  chosen_korean: 심판하셨는지
  alternatives_korean:
  - 판단하셨는지
  - 판결하셨는지
  - 다스리셨는지
  lexicon: LSJ
  rationale: κρίνω는 여기서 법정적·도덕적 판단을 가리키므로, 단순한 ‘다스리다’보다 심판의 성격을 드러내는 표현이 적절합니다.
- source_word: τοὺς υἱούς σου
  english_pob_choice: your sons
  chosen_korean: 당신의 아들들을
  alternatives_korean:
  - 당신의 자녀들을
  - 당신의 아들들
  lexicon: LSJ
  rationale: 그리스어가 분명히 남성 복수형 υἱούς를 사용하므로, 성별을 중화하지 않고 ‘아들들’로 옮겼습니다.
- source_word: ὅρκους καὶ συνθήκας ἔδωκας ἀγαθῶν ὑποσχέσεων
  english_pob_choice: you gave oaths and covenants with good promises
  chosen_korean: 좋은 약속이 담긴 맹세와 계약을 주셨습니다
  alternatives_korean:
  - 좋은 약속을 담은 맹세와 계약을 주셨습니다
  - 좋은 약속이 있는 맹세와 언약을 주셨습니다
  - 좋은 약속과 함께 맹세와 계약을 주셨습니다
  lexicon: LSJ
  rationale: ὅρκους와 συνθήκας를 각각 구분해 ‘맹세와 계약’으로 살리고, ἀγαθῶν ὑποσχέσεων은 그 맹세와 계약의 내용이 ‘좋은 약속’임을 드러내도록 묶어 표현했습니다. ‘언약’은 가능하지만 συνθήκας의 기본 의미를 살려 보다 직접적인 ‘계약’을 택했습니다.
theological_decisions:
- issue: 하나님의 판단을 나타내는 κρίνω의 뉘앙스
  chosen_reading: ‘심판하셨는지’로 옮겨 하나님의 বিচার적 엄정함을 드러냈습니다.
  alternative_readings:
  - ‘판단하셨는지’
  - ‘판결하셨는지’
  rationale: 이 절은 하나님의 공의로운 처리를 경탄하는 문맥이므로, 단순한 행정적 판단보다 न्याय적 심판의 뉘앙스를 유지하는 편이 본문 의도에 가깝습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 5
- issue: covenant language의 이중성 유지
  chosen_reading: ‘맹세와 계약’으로 두 용어를 분리해 번역했습니다.
  alternative_readings:
  - ‘맹세와 언약’
  - ‘서약과 계약’
  rationale: 본문은 ὅρκους와 συνθήκας를 병렬로 쌓아 족장들과의 엄숙한 관계를 강조하므로, 하나로 합치지 않고 두 항목을 유지하는 것이 중요합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 5
