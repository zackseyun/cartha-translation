  terminology: κρίνω는 ‘심판하셨습니까’로, ὅρκους와 συνθήκας는 서로 구별하여 ‘맹세와 언약’으로 옮겼습니다. ἀγαθῶν ὑποσχέσεων의 복수와 내용 관계는 ‘좋은 약속들을 담은’으로 나타냈습니다.
