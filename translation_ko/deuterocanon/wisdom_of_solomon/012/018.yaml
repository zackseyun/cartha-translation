base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/018.yaml
  text: But you[a], being master of strength, judge with gentleness, and with great forbearance you govern us[b]; for the power is yours whenever you will.
  footnotes:
  - marker: a
    text: Or 'with clemency' for 'with gentleness'; the Greek ἐπιείκεια can denote lenience or mild fairness as well as gentleness.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'for the being able is present to you whenever you will'—that is, the capacity to act is always at your disposal.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 당신은 힘을 다스리시는 분으로서 온유로 판단하시며, 큰 관용으로 우리를 다스리십니다. 왜냐하면 원하실 때마다 능력이 당신께 있기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἐπιείκεια는 ‘온유’ 외에도 ‘관대함’, ‘온건함’, ‘너그러움’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 문자적으로는 ‘능력이 당신께 있으며’에 가깝습니다. 즉, 행하실 수 있는 능력이 언제나 당신께 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεσπόζων ἰσχύος
  english_pob_choice: being master of strength / ruling over strength
  chosen_korean: 힘을 다스리시는 분
  alternatives_korean:
  - 힘의 주권자이신 분
  - 힘을 지배하시는 분
  lexicon: LSJ
  rationale: δεσπόζων은 ‘주권을 행사하다/다스리다’의 능동적 뉘앙스를 가지므로, 힘을 소유한 분이 아니라 힘을 다스리시는 분으로 옮겨 주체적 통치를 드러냈습니다.
- source_word: ἐν ἐπιεικείᾳ
  english_pob_choice: with gentleness
  chosen_korean: 온유로
  alternatives_korean:
  - 너그러움으로
  - 관용으로
  - 유순함으로
  lexicon: LSJ
  rationale: ἐπιείκεια는 단순한 부드러움보다 절제된 관대함·온건함을 뜻하므로, 한국어에서는 짧고 자연스러운 ‘온유로’로 옮기되 과도한 약화는 피했습니다.
- source_word: μετὰ πολλῆς φειδοῦς
  english_pob_choice: with great forbearance
  chosen_korean: 큰 관용으로
  alternatives_korean:
  - 많은 절제로
  - 크게 참으심으로
  - 넉넉한 너그러움으로
  lexicon: LSJ
  rationale: φειδώ는 아낌, 절제, 유보의 뜻이 있어 하나님이 심판을 서두르지 않으시는 태도를 드러내는 한국어로 ‘큰 관용’이 가장 자연스럽습니다.
- source_word: διοικεῖς ἡμᾶς
  english_pob_choice: you govern us
  chosen_korean: 우리를 다스리십니다
  alternatives_korean:
  - 우리를 통치하십니다
  - 우리를 관리하십니다
  lexicon: LSJ
  rationale: διοικέω는 질서를 세워 다스리다/통치하다의 의미이므로, 하나님의 섭리적 통치를 살리는 ‘다스리십니다’가 적절합니다.
- source_word: τὸ δύνασθαι
  english_pob_choice: the power is yours
  chosen_korean: 능력이 당신께 있기 때문입니다
  alternatives_korean:
  - 할 수 있는 능력이 당신께 있기 때문입니다
  - 행하실 능력이 당신께 있기 때문입니다
  lexicon: LSJ
  rationale: 표현은 문자적으로 ‘할 수 있음/능력’이며, 앞의 심판·통치와 중복되지 않도록 ‘능력’으로 옮겨 하나님께 항상 유효한 실행 능력이 있음을 드러냈습니다.
