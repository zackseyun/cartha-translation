translation:
  language: ko
  text: 이는 당신의 썩지 않는 영이 만물 안에 있기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이는 당신의 썩지 않는 영이 모든 것 안에 있기 때문입니다.’ 그리스어 ἐν πᾶσιν은 더 간결하게 ‘모든 것 안에’로도 옮길 수 있으나, ‘만물’은 피조 세계 전체를 가리키는 넓은 범위를 자연스럽게 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφθαρτόν
  english_pob_choice: imperishable
  chosen_korean: 썩지 아니할
  alternatives_korean:
  - 불멸의
  - 썩지 않는
  - 부패하지 않는
  lexicon: BDAG
  rationale: ἄφθαρτόν은 ‘부패/썩음에 이르지 않는’ 뜻이므로, 현대 한국어에서 자연스럽고 의미를 직접 드러내는 ‘썩지 아니할’이 가장 가깝습니다.
- source_word: πνεῦμά
