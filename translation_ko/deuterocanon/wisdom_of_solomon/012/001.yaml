  rationale: 여기서는 하나님의 소유격 ‘그분의’가 붙은 신적 실재를 가리키지만, 본문 자체가 삼위일체적 용어를 요구하지는 않으므로 표제어를 지나치게 교회어화하지 않고 ‘영’으로 옮겼습니다.
- source_word: ἐν πᾶσιν
  english_pob_choice: in all things
  chosen_korean: 만물 안에
  alternatives_korean:
  - 모든 것 안에
