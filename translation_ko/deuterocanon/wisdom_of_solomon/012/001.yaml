  lexicon: BDAG
  rationale: ἐν πᾶσιν은 문맥상 인격자보다 피조 세계 전체를 가리키는 중성 복수의 넓은 범위를 가지므로, ‘만물 안에’가 그 포괄성을 가장 잘 살립니다.
- source_word: γὰρ
  english_pob_choice: For
  chosen_korean: —
  alternatives_korean:
  - 이는
  - 왜냐하면
  - 실로
  lexicon: BDAG
  rationale: 이 절은 앞말의 이유를 제시하는 접속사로 시작하지만, 한국어에서는 앞뒤 문장 관계를 자연스럽게 잇기 위해 별도 접속사를 두지 않아도 의미가 유지됩니다.
