  source_fidelity: 핵심 의미는 잘 반영되어 있습니다. 다만 οὔτε ... ἢ ...의 상관 부정은 ‘왕도 폭군도’가 더 분명하며, σοι의 대면 대상은 높임말 문맥에서 ‘주님’으로 명시하는 편이 자연스럽고 충실합니다.
  naturalness: ‘왕이나 폭군도’는 ‘왕 또는 폭군도’처럼 느껴질 여지가 있고, 하나님을 가리키는 ‘당신’ 및 ‘당신의 얼굴’은 현대 표준 한국어의 공적 경건 문체에서 다소 어색하거나 오해될 수 있습니다. ‘주님’과 ‘왕도 폭군도’가 합쇼체 성경 문체에 더 자연스럽습니다.
  terminology: βασιλεύς와 τύραννος는 각각 ‘왕’, ‘폭군’으로 적절합니다. κολάζω의 심판적 의미도 ‘벌하신’으로 보존됩니다. ἀντοφθαλμῆσαι의 직접 대면 이미지는 ‘얼굴을 마주할 수 없습니다’와 각주에서 유지됩니다.
