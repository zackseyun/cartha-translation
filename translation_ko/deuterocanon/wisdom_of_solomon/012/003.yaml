lexical_decisions:
- source_word: καὶ γάρ
  english_pob_choice: For even
  chosen_korean: 그리고 또한 …도
  alternatives_korean:
  - 왜냐하면 또한 …도
  - 그러므로 또한 …도
  lexicon: LSJ
  rationale: γάρ의 설명적 연결과 καί의 강조를 함께 살려, 문맥상 자연스러운 ‘그리고 또한’으로 옮겼습니다. 본문이 다음 논지의 이유를 덧붙이는 흐름이므로 종속 접속의 뉘앙스도 유지했습니다.
- source_word: τοὺς παλαιοὺς
  english_pob_choice: the ancient
  chosen_korean: 옛
  alternatives_korean:
  - 오래된
  - 태고의
  lexicon: LSJ
  rationale: 이 형용사는 시간적으로 앞선 옛 사람들을 가리키므로, 지나치게 장중한 ‘태고의’보다 간결한 ‘옛’이 의미를 정확히 유지합니다.
- source_word: οἰκήτορας
  english_pob_choice: inhabitants
  chosen_korean: 거주자들
  alternatives_korean:
  - 주민들
  - 거민들
  - 사는 이들
  lexicon: LSJ
  rationale: οἰκήτωρ는 어떤 땅에 거주하는 사람들을 뜻하므로, 고어적이면서도 현대 문어에 맞는 ‘거주자들’이 적절합니다. EN POB의 ‘inhabitants’와도 대응됩니다.
- source_word: τῆς ἁγίας σου γῆς
  english_pob_choice: of your holy land
  chosen_korean: 당신의 거룩한 땅
  alternatives_korean:
  - 당신의 성스러운 땅
  - 당신의 거룩한 나라땅
  lexicon: LSJ
  rationale: γῆ는 이 문맥에서 ‘땅/토지’가 자연스럽고, ἁγίας는 예배적 뉘앙스를 살려 ‘거룩한’으로 옮겼습니다. 2인칭 소유격은 직접 호칭의 높임을 유지하기 위해 ‘당신의’로 처리했습니다.
theological_decisions:
- issue: ‘땅’의 범위와 신학적 함의
  chosen_reading: 이스라엘의 특정한 성별된 땅을 가리키는 것으로 ‘땅’을 유지했습니다.
  alternative_readings:
  - 세상
  - 대지
  rationale: 본문은 보편적 세계가 아니라 하나님께 속한 특정 지역을 말하므로, covenantal-geographical sense를 흐리지 않도록 ‘땅’을 유지했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; covenant geography'
