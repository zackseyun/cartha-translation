revisions:
- from: 그들이 자신들이 고통을 받고 분개하던 바로 그 일들 — 곧 그들이 신들로 여긴 것들 — 에서, 그 일들을 통해 벌을 받으면서도 보지 못했던 그 하나님을 보고 참되신 하나님으로 알아보았습니다[a]. 그러므로 정죄의 최종 끝도 그들에게 닥쳤습니다.
  to: 그들 자신이 고통을 겪고 분개하였던 바로 그 일들, 곧 그들이 신들로 여겼던 것들로 벌을 받으면서, 그들은 전에 알기를 거부했던 분을 보고 그분이 참되신 하나님이심을 알아보았습니다[a]. 그러므로 정죄의 마지막 결말도 그들에게 닥쳤습니다.
  rationale: 원문에 없는 ‘보지 못했던’을 삭제하고, ‘바로 그 일들’과 ‘그들이 신들로 여겼던 것들’ 및 ‘그것들로 벌을 받음’의 상응 관계를 한국어 문장 안에서 보존했습니다. ἀληθῆ의 문법적 모호성은 본문에서 형용사적 읽기를 따르되 각주에서 부사적 읽기를 제시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:58:38Z'
