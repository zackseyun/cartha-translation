  verdict: revise
  source_fidelity: 현 초안은 ‘보지 못했던’이라는 부정을 원문에 없이 삽입하여 ἰδόντες(‘보고/본 뒤에’)의 의미를 바꿉니다. 또한 ἐφʼ οἷς와 ἐν αὐτοῖς가 가리키는 ‘바로 그 것들’의 반복적 연결을 더 명료하게 드러낼 필요가 있습니다. 수정문은 고통과 분개의 계기/매개, 그 동일한 것들에 의한 징벌, 그리고 하나님을 알아봄의 순서를 보존합니다.
  naturalness: ‘그들이 자신들이’, 대시와 조사 사이의 띄어쓰기, ‘정죄의 최종 끝’은 현대 표준 한국어 합쇼체에서 어색합니다. ‘그들 자신이’, ‘곧’, ‘정죄의 마지막 결말’로 정리하고, 긴 문장을 원문의 수사적 연결을 유지한 채 자연스럽게 다듬었습니다.
  terminology: θεούς는 문맥상 복수 ‘신들’로, θεόν은 단수 ‘하나님’으로 유지했습니다. ἀληθῆ의 형용사적 이해는 ‘참되신 하나님’으로 반영하되, 부사적 이해 가능성은 각주에서 보존했습니다. κολαζόμενοι는 ‘벌을 받으면서’로 중립적으로 옮겼습니다.
