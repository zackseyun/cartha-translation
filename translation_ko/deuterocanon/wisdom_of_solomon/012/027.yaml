base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/027.yaml
  text: For in the very things by which they themselves suffered and were indignant—those things they thought were gods—by these[a], while being punished, they saw and recognized as the true God the one whom they had formerly refused to know. Therefore also the final end of condemnation came upon them.
  footnotes:
  - marker: a
    text: Or, 'they came to know truly the God whom they had formerly denied knowing.' The Greek can construe ἀληθῆ adverbially ('truly') rather than adjectivally ('true').
    reason: alternative_reading
translation:
  language: ko
  text: 그들 자신이 고통을 겪고 분개하였던 바로 그 일들, 곧 그들이 신들로 여겼던 것들로 벌을 받으면서, 그들은 전에 알기를 거부했던 분을 보고 그분이 참되신 하나님이심을 알아보았습니다[a]. 그러므로 정죄의 마지막 결말도 그들에게 닥쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “그들이 전에 알기를 거부했던 하나님을 참되게 알게 되었습니다.” 그리스어 ἀληθῆ는 부사적으로(“참되게”)도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐφʼ οἷς
  english_pob_choice: in the very things by which
  chosen_korean: “바로 그 일들 … 에서”
  alternatives_korean:
  - “그 일들로 인해”
  - “그 일들 안에서”
  - “그 일들을 통해”
  lexicon: LSJ
  rationale: 원문의 관계절이 고통의 매개/영역을 되받는 구조이므로, 한국어도 같은 대상-매개 연결을 드러내도록 ‘바로 그 일들 … 에서’로 옮겼습니다.
- source_word: ἐδόκουν θεούς
  english_pob_choice: they thought were gods
  chosen_korean: “신들로 여긴 것들”
  alternatives_korean:
  - “신이라고 생각한 것들”
  - “신들로 여겼던 것들”
  - “신이라고 여긴 것들”
  lexicon: LSJ
  rationale: δοκέω의 주관적 판단과 우상숭배의 아이러니를 살리기 위해, 해석을 덧붙이지 않고 ‘여긴 것들’로 간결하게 처리했습니다.
- source_word: ἐν αὐτοῖς κολαζόμενοι
  english_pob_choice: by these, while being punished
  chosen_korean: “그 일들을 통해 벌을 받으면서도”
  alternatives_korean:
  - “그 일들 가운데서 벌을 받으면서도”
  - “그것들로 인해 징벌을 받으면서도”
  lexicon: LSJ
  rationale: κολάζω의 징벌 의미를 살리되, 원문의 수동 분사 흐름을 한국어 현재 진행형으로 자연스럽게 옮겼습니다.
- source_word: ἐπέγνωσαν ἀληθῆ
  english_pob_choice: recognized as the true God
  chosen_korean: “참되신 하나님으로 알아보았습니다”
  alternatives_korean:
  - “참된 하나님으로 알아보았습니다”
  - “참되신 분으로 알아보았습니다”
  - “참으로 하나님이심을 알았습니다”
  lexicon: LSJ
  rationale: ἀληθῆ를 형용사적으로 읽는 해석을 따라, 우상들과 대비되는 실재성을 분명히 하기 위해 ‘참되신 하나님’으로 옮겼습니다.
- source_word: τὸ τέρμα τῆς καταδίκης
  english_pob_choice: the final end of condemnation
  chosen_korean: “정죄의 최종 끝”
  alternatives_korean:
  - “정죄의 마지막 끝”
  - “정죄의 끝”
  - “선고의 최종 결말”
  lexicon: LSJ
  rationale: καταδίκη를 단순한 처벌이 아니라 ‘정죄/유죄 선고’의 성격으로 보아, 문맥의 종결성을 드러내는 표현을 택했습니다.
theological_decisions:
- issue: ‘참되신 하나님’의 표현이 ἀληθῆ를 형용사적으로 읽는 해석을 반영하는지 여부
  chosen_reading: 본문은 우상으로 여긴 것들과 대비되는 분명한 실재로서 ‘참되신 하나님’을 말합니다.
  alternative_readings:
  - “그들이 전에 알기를 거부했던 하나님을 참되게 알게 되었습니다”
  - “그들이 전에 알기를 거부했던 하나님을 진실로 알게 되었습니다”
  rationale: 원문은 false gods와 true God의 대조를 강하게 세우므로, 형용사적 읽기를 본문에 반영하되 각주로 대안을 남겨 해석 여지를 보존했습니다.
  doctrine_reference: 우상과 참 하나님 대비를 유지하고, 문법적 모호성은 footnote로 보존합니다.
