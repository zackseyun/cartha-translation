  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/026.yaml
  text: But those who were not instructed by childish punishments will experience a judgment worthy of God[a][b].
  footnotes:
  - marker: a
    text: Or 'by playful rebukes' / 'by childish measures of correction.' The Greek παιγνίοις ἐπιτιμήσεως is compressed and may emphasize the comparatively light, almost childlike character of the earlier chastisements.
    reason: lexical_alternative
  - marker: b
    text: Or 'will test a judgment worthy of God,' that is, they will learn it by undergoing it.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 유치한 징벌로도 훈계받지 않은 자들은 하나님께 합당한 심판을 받게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유치한 훈계로’ / ‘장난 같은 징계로’. 그리스어 παιγνίοις ἐπιτιμήσεως는 압축된 표현으로, 앞선 징계의 비교적 가볍고 어린아이 같은 성격을 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하나님께 합당한 심판을 겪어 보게 될 것입니다.’ 곧 그 심판을 당함으로써 알게 된다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιγνίοις
  english_pob_choice: childish punishments
  chosen_korean: 유치한 징벌
  alternatives_korean:
  - 장난스러운 징벌
  - 어린아이 같은 징계
  - 가벼운 징벌
  lexicon: LSJ
  rationale: 지혜서는 앞선 가벼운 징계와 이후의 엄중한 심판을 대비하므로, literal한 ‘놀이’보다 문맥상 ‘유치한/장난 같은’ 성격의 징벌을 드러내는 표현이 적절합니다.
- source_word: ἐπιτιμήσεως
  english_pob_choice: punishments
  chosen_korean: 징벌
  alternatives_korean:
  - 책망
  - 훈계
  - 책벌
  lexicon: LSJ
  rationale: 원어는 책망의 의미도 있지만, 여기서는 하나님의 징계가 누적된 뒤 심판으로 이어지는 문맥이어서 penal force를 살리는 ‘징벌’이 더 자연스럽습니다.
- source_word: νουθετηθέντες
  english_pob_choice: were not instructed
  chosen_korean: 훈계받지 않은
  alternatives_korean:
  - 권면받지 않은
  - 경고받지 않은
  - 교훈받지 않은
  lexicon: LSJ
  rationale: 수동태의 교정적 가르침이라는 뉘앙스를 살리면서도, 한국어에서 징계와 짝을 이루는 ‘훈계’가 가장 정확하게 대응합니다.
- source_word: θεοῦ κρίσιν
  english_pob_choice: a judgment worthy of God
  chosen_korean: 하나님께 합당한 심판
  alternatives_korean:
  - 하나님의 심판
  - 하나님께 마땅한 심판
  - 하나님에 걸맞은 심판
  lexicon: LSJ
  rationale: ἀξίαν이 κρίσιν을 수식하고 θεοῦ가 뒤따르므로, 단순 소유격보다 ‘하나님께 합당한’으로 번역해 심판의 엄중함과 하나님의 성품에 걸맞음을 함께 드러냅니다.
theological_decisions:
- issue: ἀξίαν θεοῦ κρίσιν의 관계를 어떻게 살릴지
  chosen_reading: ‘하나님께 합당한 심판’으로 옮겨, 심판이 하나님에게서 나온다는 뜻으로만 좁히지 않고 하나님의 성품에 합당한 심판이라는 질적 의미를 보존했습니다.
  alternative_readings:
  - ‘하나님의 심판’
  - ‘하나님으로부터 오는 심판’
  rationale: 본문은 가벼운 교정과 최종 심판의 대비를 세우므로, 소유격으로 평평하게 만들기보다 ‘합당한’이라는 표현으로 긴장과 무게를 살리는 편이 더 원문에 가깝습니다.
  doctrine_reference: 문맥적 긴장을 보존하고 의미를 단순화하지 않음.
