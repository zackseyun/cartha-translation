base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/010.yaml
  text: But in judging them little by little[a], you were giving room for repentance, not being unaware that their origin was evil and their wickedness innate, and that their way of thinking would never change forever[b],
  footnotes:
  - marker: a
    text: Or 'you were giving an opportunity for repentance' or 'you were allowing time for repentance.' The Greek literally says 'giving room/place for repentance.'
    reason: lexical_alternative
  - marker: b
    text: Or 'their generation was evil' or 'their stock was evil' for 'their origin was evil.' The Greek γένεσις can refer to origin, birth, or lineage.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들을 심판하시는 가운데 조금씩[a] 회개의 여지를 주셨습니다. 그들의 출생의 근원이 악하고, 그들의 악이 본성에 새겨져 있으며, 그들의 생각이 영원히 바뀌지 않을 것을 모르지 않으셨기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '회개의 기회를 주셨습니다' 혹은 '회개할 시간을 주셨습니다'.
    reason: lexical_alternative
  - marker: b
    text: 또는 '그들의 세대가 악했다' 혹은 '그들의 혈통이 악했다'로 이해할 수 있습니다. 헬라어 γένεσις는 출생, 기원, 혈통을 가리킬 수 있습니다.
    reason: lexical_alternative
