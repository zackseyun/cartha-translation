- issue: 악의 기원과 회개 가능성 사이의 긴장
  chosen_reading: 하나님은 회개의 여지를 주셨지만, 그들의 악한 출생의 근원과 본성화된 악, 그리고 끝내 바뀌지 않을 사고를 아셨다는 긴장을 그대로 유지했습니다.
  alternative_readings:
  - 회개 가능성을 더 강하게 드러내는 완화 번역
  - 타고난 악을 절대적 운명처럼 보이게 하는 강한 결정론적 번역
  rationale: 본문은 하나님의 인내와 인간 악의 고착성을 함께 말하므로, 어느 한쪽으로 균형을 무너뜨리지 않도록 했습니다.
  doctrine_reference: 본문이 드러내는 긴장을 보존합니다.
