lexical_decisions:
- source_word: οὔτε γὰρ θεός ἐστιν πλὴν σοῦ
  english_pob_choice: For there is no god besides you
  chosen_korean: 참으로 당신 외에는 신이 없으시며
  alternatives_korean:
  - 당신 외에는 하나님이 없으시며
  - 당신 외에는 신이 하나도 없으시며
  lexicon: LSJ
  rationale: πλὴν σοῦ의 배타적 의미를 살려, 다른 존재들의 신격을 부정하는 표현으로 ‘신’을 썼습니다. 문두의 γάρ는 앞말을 받는 설명의 흐름이므로 ‘참으로’로 자연스럽게 연결했습니다.
- source_word: ᾧ μέλει περὶ πάντων
  english_pob_choice: who cares for all
  chosen_korean: 당신은 만물을 돌보시는 분이시니
  alternatives_korean:
  - 모든 것을 마음에 두시는 분이시니
  - 모든 것에 관심을 두시는 분이시니
  lexicon: LSJ
  rationale: μέλει περὶ πάντων은 단순한 정보가 아니라 돌봄과 관심의 뜻을 가지므로, 한국어에서는 ‘돌보시는 분’이 가장 직접적이고 자연스럽습니다. πάντων은 범위를 넓게 살려 ‘만물’로 옮겼습니다.
- source_word: ἵνα δείξῃς
  english_pob_choice: so that you should show
  chosen_korean: 당신이 … 보이시려는 것입니다
  alternatives_korean:
  - 당신이 … 드러내시려는 것입니다
  - 당신이 … 증명하시려는 것입니다
  lexicon: LSJ
  rationale: ἵνα + 접속법은 목적을 나타내므로, 결과를 매끄럽게 드러내는 의도 표현으로 옮겼습니다. ‘보이시려는 것입니다’는 전후 관계를 살리면서도 과도한 해석을 피합니다.
- source_word: οὐκ ἀδίκως ἔκρινας
  english_pob_choice: that you did not judge unjustly
  chosen_korean: 당신이 부당하게 판결하지 않으셨음을
  alternatives_korean:
  - 당신이 불의하게 판결하지 않으셨음을
  - 당신이 공정하게 판결하셨음을
  lexicon: LSJ
  rationale: Greek의 부정형을 그대로 살려 ‘부당하게 판결하지 않으셨음’으로 옮겼습니다. ‘판결하다’는 κρίνω의 법정적 의미를 드러내며, 전통적 교회어보다 원문에 더 밀착합니다.
theological_decisions:
- issue: 하나님에 대한 호칭을 ‘하나님’으로 할지 ‘신’으로 할지
  chosen_reading: ‘신’으로 번역하되, 바로 뒤의 2인칭 호칭과 전체 문맥이 유일하신 참 하나님을 가리키도록 유지했습니다.
  alternative_readings:
  - ‘하나님 외에는 하나님이 없으시며’
  - ‘참 하나님 외에는 신이 없으시며’
  rationale: 본문은 다른 존재들의 신격을 부정하는 배타적 진술이므로, 한국어에서 ‘신’이 범주 부정을 더 직접적으로 드러냅니다. 동시에 2인칭 직접 호칭이 유일하신 하나님을 가리키는 점은 문맥으로 분명합니다.
  doctrine_reference: '번역 원칙: 원문 범주를 보존하고 전통적 경어화로 의미를 완화하지 않기'
- issue: οὐκ ἀδίκως의 부정형을 긍정형으로 풀지 여부
  chosen_reading: ‘부당하게 판결하지 않으셨음’으로 부정형을 유지했습니다.
  alternative_readings:
  - ‘공정하게 판결하셨음’
  - ‘정당하게 심판하셨음’
  rationale: 원문은 긍정 선언보다 부정적 변론 형식을 취하므로, 그 긴장을 그대로 살렸습니다. 이렇게 해야 앞문장과 이어지는 논증의 결이 보존됩니다.
  doctrine_reference: '번역 원칙: 신학적 긴장을 해소하지 말고 원문의 수사 구조를 보존하기'
