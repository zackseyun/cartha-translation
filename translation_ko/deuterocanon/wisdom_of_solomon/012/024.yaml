translation:
  language: ko
  text: 그들은 오류의 길에서 더욱 멀리 떠돌았고, 적들의 동물들 가운데 있는 그 비천한 것들을 신들로 여기며, 어리석은 갓난아이들처럼 속임을 당했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오류에 더 깊이 빠져들었습니다.’ 그리스어는 그들의 스스로의 방황과 그들이 미혹된 상태를 함께 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘적들의 동물들 가운데 있는 그 비천한 것들을 신들로 받아들여.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν πλάνης ὁδῶν / μακρότερον ἐπλανήθησαν
  english_pob_choice: the ways of error / wandered even farther
  chosen_korean: 오류의 길에서 더욱 멀리 떠돌았고
  alternatives_korean:
  - 방황의 길에서 더 멀리 빗나갔고
  - 미혹의 길에서 더욱 멀리 헤맸고
  lexicon: LSJ
  rationale: πλάνη와 ἐπλανήθησαν의 중첩된 ‘그릇된 방향으로 감’의 이미지를 살리되, 현대 한국어에서는 ‘떠돌다’가 자연스럽게 그 지속적 이탈을 드러냅니다.
- source_word: θεοὺς ὑπολαμβάνοντες
  english_pob_choice: supposing as gods
  chosen_korean: 신들로 여기며
  alternatives_korean:
  - 신으로 생각하며
  - 신이라고 간주하며
  lexicon: LSJ
  rationale: ὑπολαμβάνω는 여기서 ‘판단하다/여기다’의 뜻이므로, 복수 목적어 ‘신들’과 함께 ‘신들로 여기다’가 가장 직관적입니다.
- source_word: τὰ ... ἄτιμα / ἐν ζῴοις τῶν ἐχθρῶν
  english_pob_choice: the dishonored creatures among the animals of their enemies
  chosen_korean: 적들의 동물들 가운데 있는 그 비천한 것들
  alternatives_korean:
  - 적들의 동물들 가운데 있는 그 수치스러운 것들
  - 적들의 동물들 가운데 있는 그 천한 것들
  lexicon: LSJ
  rationale: ἄτιμα의 핵심은 ‘명예가 없는, 비천한’이므로 외형적 ‘동물’ 언급을 유지하면서도 평가어를 살려 번역했습니다. 한국어에서는 ‘동물들 가운데 있는’으로 위치 관계를 드러냈습니다.
- source_word: ψευσθέντες
  english_pob_choice: having been deceived
  chosen_korean: 속임을 당했습니다
  alternatives_korean:
  - 기만당했습니다
  - 속아 넘어갔습니다
  lexicon: LSJ
  rationale: aorist passive participle의 수동성을 살려 ‘속임을 당하다’로 옮겼습니다. 이는 단순한 실수가 아니라 외적 기만의 결과임을 보여 줍니다.
theological_decisions:
