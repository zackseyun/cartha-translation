  chosen_reading: ‘오류의 길’, ‘비천한 것들’, ‘속임을 당했습니다’로 번역하여 본문의 부정적 평가를 그대로 유지했습니다.
  alternative_readings:
  - 더 중립적인 ‘실수’, ‘낮은 동물들’, ‘잘못 알았습니다’로 완화
  rationale: 본문은 우상숭배를 지적하는 강한 도덕·신학적 비판을 담고 있으므로, 평가를 완화하면 저자의 논지를 흐리게 됩니다.
  doctrine_reference: 'DOCTRINE.md: Original-language primacy; Preserve theological tension rather than resolve it.'
