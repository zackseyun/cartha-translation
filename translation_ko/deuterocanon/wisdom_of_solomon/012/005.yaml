translation:
  language: ko
  text: 그리고 자비 없는 아이들 살해자들, 그리고 내장 먹는 자들의 인간의 살과 피로 된 잔치가 있으며, 광란의 무리 가운데서 입문한 자들이 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “인간의 내장과 피로 된 잔치”에 가깝습니다. Greek 복합어 σπλαγχνοφάγων은 ‘내장을 먹는’이라는 뜻을 띱니다.
    reason: lexical_alternative
  - marker: b
    text: μύστας θιάσου는 비의적·제의적 무리에 입문한 사람들을 가리키는 문화적 표현입니다.
    reason: cultural_note
lexical_decisions:
