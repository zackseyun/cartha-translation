    reason: lexical_alternative
  - marker: b
    text: ‘입문자들’(μύστας)과 ‘제의 집단’(θιάσου)은 비의적·제의적 의례와 그 의례 공동체에 속한 사람들을 가리킵니다.
    reason: cultural_note
