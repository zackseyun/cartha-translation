  source_fidelity: 수정이 필요합니다. 초안은 그리스어의 대격 열거를 독립된 두 개의 서술문(‘잔치가 있으며… 자들이 있습니다’)으로 바꾸어 앞 절에 이어지는 문장 구조를 훼손합니다. 또한 ‘내장 먹는 자들’과 ‘입문자들’ 및 잔치의 관계가 부자연스럽게 분리되어 있습니다. 수정문은 아이들을 죽인 자들, 사람의 살과 피로 잔치를 벌이는 내장 먹는 자들, 그리고 그 제의 집단의 입문자들이라는 고발의 열거를 유지합니다.
  naturalness: ‘자비 없는 아이들 살해자들’은 현대 한국어에서 명사 중첩이 어색하며, ‘인간의 살과 피로 된 잔치’도 의미 관계가 불분명합니다. ‘무자비하게 아이들을 죽인 자들’ 및 ‘사람의 살과 피로 잔치를 벌이는 내장 먹는 자들’이 자연스럽고 원문의 잔혹한 표현을 유지합니다. 절 단독으로는 앞 절에 종속되는 목적어 열거이므로 종결 서술어를 덧붙이지 않는 것이 적절합니다.
  terminology: τέκνα는 이 문맥에서 ‘아이들’로 자연스럽습니다. σπλαγχνοφάγοι의 내장/내부 장기 섭식 뉘앙스는 본문의 ‘내장 먹는 자들’과 주석으로 보존했습니다. μύσται와 θίασος는 현대 독자에게 ‘제의 집단의 입문자들’로 명료하게 옮겼습니다. ‘광란’은 θίασος 자체에 항상 내재한 뜻은 아니므로 본문에서 단정하지 않았습니다.
