  lexicon: LSJ
  rationale: φονεύς의 폭력성과 ἀνελεήμων의 냉혹함을 함께 살리기 위해, ‘자비 없는’과 ‘살해자들’을 결합해 윤리적 강도를 유지했습니다.
- source_word: σπλαγχνοφάγων ἀνθρώπινων σαρκῶν
  english_pob_choice: of human flesh and blood / entrail-eaters
  chosen_korean: 내장 먹는 자들의 인간의 살과 피
  alternatives_korean:
  - 인간 내장과 피를 먹는 자들의
  - 인간의 살과 피를 먹는
  lexicon: LSJ
  rationale: σπλαγχνοφάγων은 문자적으로 ‘내장을 먹는 자들’이라는 복합어이므로, POB의 주석 취지를 반영해 본문에는 ‘내장 먹는 자들’로, 이어지는 ἀνθρώπινων σαρκῶν은 ‘인간의 살’로 분리해 표기했습니다.
- source_word: δοῖναν
  english_pob_choice: a feast
  chosen_korean: 잔치
  alternatives_korean:
  - 연회
  - 식사
  lexicon: LSJ
  rationale: δοῖνα는 단순한 식사보다 의례적·집단적 식사의 뉘앙스가 강해, 한국어에서는 ‘잔치’가 가장 자연스럽게 그 분위기와 충격성을 전달합니다.
- source_word: μύστας θιάσου
  english_pob_choice: initiates of their revel band
  chosen_korean: 광란의 무리 가운데서 입문한 자들
  alternatives_korean:
  - 그들의 광란의 무리의 입문자들
  - 비의(秘儀) 무리의 입문자들
  lexicon: LSJ
  rationale: μύστας는 비의·입문 의례에 참여한 ‘입문자들’이고, θιάσος는 단순한 모임보다 광적인 종교 집단성을 띠므로, ‘광란의 무리’로 풀어 그 문화적·종교적 색채를 살렸습니다.
