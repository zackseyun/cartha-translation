  - 식사
  lexicon: LSJ
  rationale: δοῖνα는 단순한 식사보다 의례적·집단적 식사의 뉘앙스가 강해, 한국어에서는 ‘잔치’가 가장 자연스럽게 그 분위기와 충격성을 전달합니다.
- source_word: μύστας θιάσου
  english_pob_choice: initiates of their revel band
  chosen_korean: 광란의 무리 가운데서 입문한 자들
  alternatives_korean:
  - 그들의 광란의 무리의 입문자들
  - 비의(秘儀) 무리의 입문자들
  lexicon: LSJ
  rationale: μύστας는 비의·입문 의례에 참여한 ‘입문자들’이고, θιάσος는 단순한 모임보다 광적인 종교 집단성을 띠므로, ‘광란의 무리’로 풀어 그 문화적·종교적 색채를 살렸습니다.
theological_decisions:
- issue: μύστας θιάσου의 cultic nuance를 어떻게 살릴지
  chosen_reading: ‘광란의 무리 가운데서 입문한 자들’로 옮겨, 단순한 사회적 집단이 아니라 의례적·종교적 집단을 지칭하는 점을 드러냈습니다.
  alternative_readings:
  - ‘그들의 의례 집단의 입문자들’
  - ‘그들의 제의적 무리의 입문자들’
  rationale: 본문은 폭력과 식인의 묘사뿐 아니라 우상 숭배적·제의적 타락을 함께 고발하므로, 입문과 무리의 성격을 함께 드러내는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §§1, 6
