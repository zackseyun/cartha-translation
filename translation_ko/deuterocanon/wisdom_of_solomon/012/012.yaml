base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/012.yaml
  text: For who will say[b][a], “What have you done?” Or who will oppose your judgment? And who will bring a charge against you concerning the nations that you destroyed? Or who will come before you as an avenger against unrighteous men?
  footnotes:
  - marker: a
    text: Or “who will come forward to oppose you as an avenger against unjust people?” The Greek expression behind “come before you” is difficult and may carry a more explicitly adversarial or legal sense.
    reason: lexical_alternative
  - marker: b
    text: Literally, “concerning nations having perished, which you made/did.” In context, the sense is that these are nations God brought to ruin, so the translation renders the implied force rather than the bare verb “made.”
    reason: lexical_alternative
translation:
  language: ko
  text: 과연 누가 「무엇을 하셨습니까?」라고 말하겠습니까? 누가 주님의 심판에 맞서겠습니까? 또 누가 주님께서 멸하신 민족들에 관하여 주님을 고발하겠습니까?[a] 또는 누가 불의한 사람들을 상대로 보복자로서 주님 앞에 나아오겠습니까?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주님께서 멸하신 민족들에 관하여’는 문자적으로 ‘멸망한 민족들에 관하여, 곧 주님께서 하신/만드신 민족들’에 가깝습니다. 문맥상 여기의 ‘하신’은 그 민족들을 멸망에 이르게 하신 행위를 가리키는 것으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘주님 앞에 나아오다’에 해당하는 그리스어 표현은 난해합니다. 대적하여 나서거나 법정에서 맞서기 위해 출두한다는 뜻을 더 분명히 나타낼 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γὰρ ἐρεῖ
  english_pob_choice: For who will say
  chosen_korean: 그러므로 누가 …라고 말하겠습니까?
  alternatives_korean:
  - 누가 말하겠습니까?
  - 누가 감히 말하겠습니까?
  lexicon: BDAG
  rationale: γάρ는 앞선 진술을 받는 연결어로서 ‘그러므로’로 풀어 주면 논증 흐름이 자연스럽고, τίς-질문은 수사적 질문으로 유지했습니다.
- source_word: Τί ἐποίησας
  english_pob_choice: What have you done
  chosen_korean: 「무엇을 하셨습니까?」
  alternatives_korean:
  - 「무엇을 하셨습니까?」
  - 「무슨 일을 하셨습니까?」
  lexicon: BDAG
  rationale: 하나님께 대한 직접 대면 질문이므로 합쇼체를 유지했고, ἐποίησας의 직접적 도전성을 살리되 불필요한 해석인 ‘왜’는 넣지 않았습니다.
- source_word: τῷ κρίματί σου
  english_pob_choice: your judgment
  chosen_korean: 주님의 심판
  alternatives_korean:
  - 주님의 판단
  - 주님의 판결
  lexicon: BDAG
  rationale: κρίμα는 이 문맥에서 사법적 판결/심판의 뜻이 강하므로 ‘심판’이 가장 자연스럽고, 하나님께 대한 경칭으로 ‘주님’이 적절합니다.
- source_word: ἐγκαλέσει σοι
  english_pob_choice: will bring a charge against you
  chosen_korean: 주님께 … 고발하겠습니까
  alternatives_korean:
  - 주님을 고발하겠습니까
  - 주님께 죄를 묻겠습니까
  lexicon: BDAG
  rationale: 법정적 언어를 살려 ‘고발하다’로 옮겼고, σοι의 방향성을 드러내기 위해 ‘주님께’로 처리했습니다.
- source_word: κατὰ ἐθνῶν ἀπολωλότων, ἃ σὺ ἐποίησας
  english_pob_choice: concerning the nations that you destroyed
  chosen_korean: 주님께서 멸하신 민족들에 관하여
  alternatives_korean:
  - 주님께서 멸망시킨 민족들에 관하여
  - 주님께서 없애 버리신 민족들에 관하여
  lexicon: BDAG
  rationale: ἀπολωλότων과 ἃ σὺ ἐποίησας의 결합은 단순한 ‘만드신’보다 ‘멸하신/멸망시키신’ 뜻이 문맥상 분명하므로, POB의 해석을 따라 파괴의 함의를 드러냈습니다.
- source_word: ἔκδικος
  english_pob_choice: as an avenger
  chosen_korean: 보복자로서
  alternatives_korean:
  - 원수 갚는 자로서
  - 보복하는 자로서
  lexicon: BDAG
  rationale: ἔκδικος는 응보/보복의 실행자를 가리키므로, 법정적·응보적 색채를 살리는 ‘보복자’가 적절합니다.
theological_decisions:
- issue: 수사적 질문의 신학적 기능
  chosen_reading: 이 절은 누가 하나님의 심판을 문제 삼을 수 있는지 묻는 연속된 수사적 질문으로, 하나님의 심판이 항변 불가능하다는 뜻을 강하게 드러냅니다.
  alternative_readings:
  - 단지 실제로 항의할 사람이 없다는 실용적 진술
  - 하나님의 심판을 약화시킨 일반적 경탄 표현
  rationale: τίς-질문들과 법정 어휘가 결합되어 있으므로, 단순한 감탄보다 하나님의 사법적 행위에 대한 항변 불가능성을 보존하는 것이 본문에 더 가깝습니다.
  doctrine_reference: 'DOCTRINE.md: 본문이 지닌 신학적 긴장을 평이하게 줄이지 말고 보존한다.'
- issue: ‘민족들’의 파괴를 언급하는 표현
  chosen_reading: 본문의 민족들은 하나님이 멸하신 대상이며, 이를 완곡하게 ‘그냥 지나간 민족들’처럼 만들지 않습니다.
  alternative_readings:
  - 민족들이 스스로 소멸했다는 중립적 표현
  - 하나님과 무관한 역사적 소멸로 읽는 표현
  rationale: ἃ σὺ ἐποίησας와 ἀπολωλότων이 결합되어 있어, 하나님의 행위로 인한 멸망이라는 인과를 살려야 합니다.
  doctrine_reference: 'DOCTRINE.md: 해석상 드러난 문맥적 강도를 희석하지 않는다.'
