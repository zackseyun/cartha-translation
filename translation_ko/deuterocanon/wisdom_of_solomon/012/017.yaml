  lexicon: LSJ
  rationale: 동사는 ‘보여 주다/드러내다’의 뜻이므로, 문맥상 행위의 표면화와 입증을 살리는 ‘나타내시며’가 적합합니다.
- source_word: ἀπιστούμενος ἐπὶ δυνάμεως τελειότητι
  english_pob_choice: when your perfect power is disbelieved
  chosen_korean: 당신의 완전한 능력이 믿어지지 않을 때에
  alternatives_korean:
  - 당신의 능력의 완전함이 믿어지지 않을 때에
  - 당신의 능력의 სრულ함이 의심될 때에
  - 능력의 완전성에 관하여 믿지 않을 때에
  lexicon: LSJ
  rationale: 압축된 분사구는 하나님에 대한 불신이든 능력의 완전성에 대한 의심이든 모두 포괄할 수 있으므로, 해석을 과도하게 좁히지 않으면서도 ‘완전한 능력’과 ‘믿어지지 않다’를 살렸습니다.
- source_word: τὸ θράσος
  english_pob_choice: boldness
  chosen_korean: 대담함
  alternatives_korean:
  - 무모함
  - 뻔뻔함
  - 오만함
  lexicon: LSJ
  rationale: θράσος는 여기서 긍정적 용기보다 부정적 뉘앙스의 ‘대담함/무례한 담대함’을 뜻하므로, 한국어에서는 중립적이지만 문맥상 책망을 유지할 수 있는 ‘대담함’이 적절합니다.
- source_word: ἐξελέγχεις
  english_pob_choice: you expose
  chosen_korean: 드러내십니다
  alternatives_korean:
  - 책망하십니다
  - 폭로하십니다
  - 꾸짖으십니다
  lexicon: LSJ
  rationale: ἐξελέγχω는 ‘드러내다, 밝혀내다, 책망하다’의 범위를 가지며, 여기서는 θράσος와 함께 쓰여 교만한 태도를 밖으로 드러내는 의미가 강하므로 ‘드러내십니다’가 가장 직접적입니다.
theological_decisions:
- issue: ἀπιστούμενος의 주어-대상 관계
  chosen_reading: 하나님의 능력이 믿어지지 않는 상황을, 하나님께서 오히려 자신의 능력을 나타내시는 계기로 옮겼습니다.
  alternative_readings:
  - 하나님 자신이 불신을 받으시는 것으로 볼 수 있음
  - ‘능력의 완전성’에 대한 회의로 더 구체화할 수 있음
  rationale: 헬라어는 압축되어 있어 불신의 방향을 완전히 풀어 쓰지 않으므로, 문맥의 긴장을 유지하면서도 독자가 이해할 수 있게 번역했습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
- issue: τὸ θράσος의 부정적 평가
  chosen_reading: ‘대담함’을 쓰되, 전체 문맥에서 책망·노출의 대상임을 통해 부정적 뉘앙스를 보존했습니다.
  alternative_readings:
  - 무모함
  - 뻔뻔함
  - 오만함
  rationale: 헬라어 θράσος는 이 문맥에서 칭찬이 아니라 비판의 대상이므로, 단어 선택보다 문장 전체의 행위(드러내다)를 통해 그 부정성을 유지하는 편이 원문에 가깝습니다.
  doctrine_reference: 'Translation philosophy: Maintain lexical tension without over-paraphrase.'
