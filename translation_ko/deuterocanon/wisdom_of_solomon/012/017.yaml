  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/017.yaml
  text: For you show your strength when your perfect power is disbelieved[b][a], and among those who know it you expose boldness.
  footnotes:
  - marker: a
    text: Or, 'when you are disbelieved concerning the perfection of your power.' The Greek is compressed and may focus either on disbelief directed toward God or on doubt about the fullness of his power.
    reason: alternative_reading
  - marker: b
    text: '''Boldness'' here carries a negative sense such as ''audacity'' or ''insolence.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 당신께서는 당신의 완전한 능력이 믿어지지 않을 때에 당신의 능력을 나타내시며, 그것을 아는 이들 가운데서 그 대담함을 드러내십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘당신의 능력의 완전성에 관하여 믿어지지 않을 때에’. 헬라어는 압축되어 있어, 불신이 하나님께 향한 것인지 능력의 완전성에 대한 의심인지 둘 다 가능할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘대담함’은 여기서 긍정적 용기라기보다 ‘무례한 담대함’, 곧 ‘무모함’이나 ‘오만함’에 가까운 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰσχὺν
  english_pob_choice: strength
  chosen_korean: 능력
  alternatives_korean:
  - 힘
  - 강함
  - 권능
  lexicon: LSJ
  rationale: ἰσχύς는 물리적 ‘힘’보다 맥락상 드러나는 효력·역량을 가리키므로, 뒤의 δύναμις와 중복을 피하면서 자연스러운 한국어로 ‘능력’이 적절합니다.
- source_word: ἐνδείκνυσαι
