    reason: lexical_alternative
translation:
  language: ko
  text: 이는 당신께 가장 귀한 그 땅이 하나님의 자녀들의 합당한 정착 공동체를 받아들이도록 하려는 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘합당한 식민지’. 그리스어 ἀποικία는 식민지 또는 이주하여 정착한 공동체를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘당신 곁에서 모든 것 중 가장 귀한 그 땅’입니다. 여기서 ‘당신 곁에서’는 당신께서 내리시는 평가를 나타냅니다.
    reason: lexical_alternative
