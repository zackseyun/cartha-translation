review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 맞지만, ἵνα 목적절을 ‘그리하여 … 하려 하셨습니다’로 옮기면서 원문에 없는 주어와 과거 서술을 보충했습니다. 또한 ἀποικία는 이 문맥에서 ‘식민지’보다 그 땅에 들어와 사는 이주 정착 공동체를 가리키므로, 한국어에서는 ‘정착 공동체’가 더 정확하고 자연스럽습니다.
  naturalness: ‘당신 앞에서 모든 것보다 가장 귀한 그 땅’은 한국어에서 평가의 기준을 나타내는 παρὰ σοὶ를 공간적 표현처럼 들리게 합니다. ‘당신께서 가장 귀하게 여기시는 모든 땅 가운데 가장 귀한 땅’은 중복되므로, ‘당신께 가장 귀한 그 땅’으로 간결하게 옮기는 것이 자연스럽습니다. 목적절은 ‘… 받아들이도록’으로 처리하는 편이 현대 한국어 합쇼체 성경 문체에 맞습니다.
  terminology: θεοῦ παίδων은 ‘하나님의 자녀들’이 적절합니다. ἀποικία는 현대 한국어 ‘식민지’가 지배·착취의 정치적 함의를 강하게 띠므로, 원문의 이주·정착 집단 의미를 보존하는 ‘정착 공동체’로 옮기고 대안을 각주에 제시합니다.
  issues:
  - severity: medium
    issue: 원문에 없는 ‘하려 하셨습니다’가 추가됨
    rationale: 그리스어는 ἵνα와 접속법(δέξηται)으로 목적을 표현할 뿐, 이 절 자체에는 ‘하셨습니다’의 주어나 시제가 명시되어 있지 않습니다. 한국어에서도 목적절 형태를 유지하는 것이 더 충실합니다.
  - severity: medium
    issue: ‘식민지’는 ἀποικία의 지시 대상을 부정확하게 좁힐 수 있음
    rationale: ἀποικία는 식민지라는 장소뿐 아니라 이주하여 정착한 사람들의 공동체를 뜻할 수 있습니다. 여기서는 땅이 ‘받아들이는’ 대상이므로 정착 공동체/이주 정착민의 뜻이 더 자연스럽습니다.
  - severity: low
    issue: ‘당신 앞에서’는 παρὰ σοὶ의 평가적 용법을 충분히 드러내지 못함
    rationale: παρὰ σοὶ는 하나님과 관련하여 ‘당신께/당신이 보시기에’라는 가치 평가를 나타냅니다. ‘당신께 가장 귀한’이 한국어에서 더 자연스럽습니다.
