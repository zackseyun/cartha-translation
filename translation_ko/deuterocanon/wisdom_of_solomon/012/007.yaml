  - 거주 공동체
  lexicon: LSJ
  rationale: ἀποικία는 단순한 거주지보다 ‘식민지/이주 집단’의 구체성을 가지므로, POB의 'colony'를 따라 '식민지'로 옮겼습니다.
- source_word: θεοῦ παίδων
  english_pob_choice: God's children
  chosen_korean: 하나님의 자녀들
  alternatives_korean:
  - 하나님의 아이들
  - 하나님의 아들들
  lexicon: LSJ
  rationale: παίδων은 여기서 성별을 한정하지 않는 친자 관계를 드러내므로, 남성화된 '아들들'보다 '자녀들'이 원문의 의미를 더 정확히 반영합니다.
- source_word: ἡ παρὰ σοὶ πασῶν τιμιωτάτη γῆ
  english_pob_choice: the land most precious of all in your sight
  chosen_korean: 당신 앞에서 모든 것보다 가장 귀한 그 땅
  alternatives_korean:
  - 당신 보시기에 만물 중 가장 귀한 그 땅
  - 당신께 가장 귀한 그 땅
  lexicon: LSJ
  rationale: παρὰ σοὶ는 단순한 위치가 아니라 하나님 앞에서의 평가 기준을 나타내므로 '당신 앞에서'로, τιμιωτάτη는 '가장 귀한'으로 옮겨 평가의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: θεοῦ παίδων의 성별 뉘앙스
  chosen_reading: 하나님의 자녀들
