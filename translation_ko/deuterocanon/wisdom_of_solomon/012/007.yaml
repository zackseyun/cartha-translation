translation:
  language: ko
  text: 그리하여 당신 앞에서 모든 것보다 가장 귀한 그 땅이 하나님의 자녀들의 합당한 식민지를 받게 하려 하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘합당한 정착지’로도 옮길 수 있습니다. 그리스어 ἀποικία는 식민지나 정착된 공동체를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘당신 앞에서 모든 것보다 가장 귀한 그 땅’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  english_pob_choice: so that
  chosen_korean: 그리하여 … 하려 하셨습니다
  alternatives_korean:
  - ~하기 위하여
  - ~하도록
  lexicon: LSJ
  rationale: 목적을 나타내는 접속을 한국어의 자연스러운 결과·목적 구문으로 옮겨, 문장의 telic force를 유지했습니다.
- source_word: ἀποικίαν
