  lexicon: LSJ
  rationale: παρὰ σοὶ는 단순한 위치가 아니라 하나님 앞에서의 평가 기준을 나타내므로 '당신 앞에서'로, τιμιωτάτη는 '가장 귀한'으로 옮겨 평가의 뉘앙스를 살렸습니다.
