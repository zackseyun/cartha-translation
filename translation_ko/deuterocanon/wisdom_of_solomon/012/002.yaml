review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. κατʼ ὀλίγον은 문맥상 ‘벗어나는’ 행위보다 주님의 ἐλέγχεις(꾸짖고 바로잡으심)를 한정하는 것으로 읽는 것이 더 자연스럽습니다. 또한 ἵνα 절은 주님의 책망과 훈계의 목적을 나타내므로, 독립된 직설의 ‘믿음을 두게 하십니다’보다 목적 표현으로 옮겨야 합니다.
  naturalness: ‘주님을 향해 믿음을 두게’는 현대 표준 한국어에서 다소 번역투이며, ‘경고하다’는 νουθετεῖς의 교정적 훈계의 뜻을 충분히 드러내지 못합니다. ‘주님을 믿도록’과 ‘훈계하십니다’가 자연스럽고 적절합니다.
  terminology: Κύριε는 ‘주님’으로, κακία는 넓은 윤리적 의미의 ‘악’으로 유지했습니다. πιστεύσωσιν ἐπὶ σέ는 하나님을 향한 믿음/신뢰를 뜻하지만, 한국어에서는 ‘주님을 믿도록’이 자연스럽게 그 방향성을 표현합니다. ἀπαλλαγέντες의 수동적 해방 의미는 ‘악에서 풀려나’로 보존했습니다.
  issues:
