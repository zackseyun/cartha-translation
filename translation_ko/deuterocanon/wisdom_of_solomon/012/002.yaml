    rationale: 이 구절의 문맥과 통상적인 구문 이해에서는 ‘조금씩’이 하나님의 점진적·절제된 책망(ἐλέγχεις)을 수식하는 것으로 보는 편이 타당합니다.
  - severity: medium
    issue: ‘...믿음을 두게 하십니다’가 ἵνα 목적절을 결과를 단정하는 직설문으로 바꿉니다.
    rationale: ἵνα는 책망과 훈계의 목적, 곧 그들이 악에서 풀려나 주님을 믿게 되는 것을 나타냅니다.
  - severity: low
    issue: ‘경고하셔서’는 νουθετεῖς의 훈계·교정의 의미보다 위험 경고의 의미로 치우칩니다.
    rationale: ‘훈계하십니다’가 앞의 ‘꾸짖으시고’와 구별되면서도 도덕적 교정의 뜻을 더 잘 전달합니다.
