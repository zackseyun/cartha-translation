translation:
  language: ko
  text: 그러므로 주님, 조금씩 벗어나는 자들을 꾸짖으시고, 그들이 죄를 짓는 일들을 상기시켜 경고하셔서, 악에서 풀려난 그들이 주님을 향해 믿음을 두게 하십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὸ
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 이러므로
  lexicon: LSJ
  rationale: 앞선 논지를 잇는 추론 표지이므로 한국어에서도 인과·결과 연결을 분명히 하는 ‘그러므로’가 가장 자연스럽습니다.
- source_word: τοὺς παραπίπτοντας κατʼ ὀλίγον
  english_pob_choice: those who fall away little by little
  chosen_korean: 조금씩 벗어나는 자들
  alternatives_korean:
  - 점점 떨어져 나가는 자들
  - 서서히 그릇되는 자들
  lexicon: BDAG/LSJ
  rationale: παραπίπτω의 도덕적 이탈과 κατʼ ὀλίγον의 점진성을 함께 살리기 위해 ‘조금씩 벗어나는’으로 옮겼습니다.
- source_word: ἐλέγχεις ... νουθετεῖς
  english_pob_choice: rebuke ... warn/admonish
  chosen_korean: 꾸짖으시고 ... 경고하셔서
  alternatives_korean:
  - 책망하시고 ... 훈계하셔서
  - 꾸짖으시고 ... 권면하셔서
  lexicon: BDAG/LSJ
  rationale: ἐλέγχεις는 잘못을 드러내며 바로잡는 꾸짖음이고, νουθετεῖς는 교정 목적의 훈계·경고이므로 두 동사를 구분해 살렸습니다.
- source_word: ἀπαλλαγέντες τῆς κακίας
  english_pob_choice: having been set free from wickedness
  chosen_korean: 악에서 풀려난
  alternatives_korean:
  - 악에서 해방된
  - 악에서 벗어난
  lexicon: BDAG/LSJ
  rationale: ἀπαλλαγέντες의 ‘풀려남/해방됨’의 수동성을 유지하면서, τῆς κακίας를 넓은 도덕적 악으로 보아 ‘악’으로 번역했습니다.
- source_word: πιστεύσωσιν ἐπὶ σέ
  english_pob_choice: they may put faith in you
  chosen_korean: 주님을 향해 믿음을 두게
  alternatives_korean:
  - 주님을 믿게
  - 주님께 신뢰를 두게
  lexicon: BDAG
  rationale: ἐπί+대격의 방향성을 살려 ‘향해’로 드러내고, 프로젝트 기본어인 ‘믿음’을 본문에 유지해 directed faith의 뉘앙스를 반영했습니다.
theological_decisions:
- issue: πιστεύσωσιν ἐπὶ σέ의 신앙 행위 표현
  chosen_reading: 주님을 향해 믿음을 두게 하십니다
  alternative_readings:
  - 주님을 믿게 하십니다
  - 주님께 신뢰를 두게 하십니다
  rationale: πιστεύω/πίστις 계열은 본문에서 단순 지적 동의보다 하나님께 향한 의탁을 뜻하므로, ‘믿음’과 방향 표지를 함께 써 신학적 강도를 유지했습니다.
