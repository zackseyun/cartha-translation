revisions:
- from: 그러므로 주님, 조금씩 벗어나는 자들을 꾸짖으시고, 그들이 죄를 짓는 일들을 상기시켜 경고하셔서, 악에서 풀려난 그들이 주님을 향해 믿음을 두게 하십니다.
  to: 그러므로 주님께서는 잘못을 저지르는 이들을 조금씩 꾸짖으시고, 그들이 죄를 짓는 일들을 일깨워 훈계하십니다. 이는 그들이 악에서 풀려나 주님을 믿도록 하시려는 것입니다.
  rationale: κατʼ ὀλίγον을 주님의 꾸짖음에 연결하여 문맥상의 점진적 교정을 반영했습니다. νουθετεῖς는 ‘훈계하십니다’로 옮겼고, ἵνα 목적절은 ‘...하도록 하시려는 것입니다’로 명시했습니다. ‘악에서 풀려나’는 수동적 해방의 뉘앙스를, ‘주님을 믿도록’은 πιστεύω ἐπί의 하나님을 향한 믿음을 자연스러운 한국어로 보존합니다.
