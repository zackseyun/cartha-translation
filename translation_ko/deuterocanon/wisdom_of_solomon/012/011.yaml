base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/011.yaml
  text: For it was a seed accursed from the beginning[a], and not fearing anyone because of the things in which they sinned[b], you granted them no pardon.
  footnotes:
  - marker: a
    text: 'Or ''offspring'' or ''race'': the Greek says ''seed,'' used figuratively for a line or people.'
    reason: lexical_alternative
  - marker: b
    text: The clause may also be rendered, 'nor, out of deference to anyone, did you grant them immunity for the things in which they sinned.'
    reason: alternative_reading
translation:
  language: ko
  text: 그것은 시작부터 저주받은 씨앗이었기 때문입니다[a]. 그리고 그들이 죄를 지은 일들로 말미암아, 당신은 아무도 두려워하지 않으시고 그들에게 아무 사면도 주지 않으셨습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘후손’, ‘족속’으로도 옮길 수 있습니다. 헬라어 σπέρμα는 문자적 ‘씨’뿐 아니라 한 계통의 사람들을 비유적으로 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절은 “아무에게도 사정을 두지 않으시고” 또는 “아무도 봐주지 않으시고”로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: σπέρμα
  english_pob_choice: seed
  chosen_korean: 씨앗
  alternatives_korean:
  - 후손
  - 자손
  - 씨
  lexicon: LSJ
  rationale: σπέρμα를 문자 그대로 옮기면 ‘씨’이지만, 여기서는 집단을 가리키는 비유적 용법이므로 한국어에서는 ‘씨앗’이 가장 자연스럽게 그 비유성과 집단성을 함께 살립니다.
- source_word: κατηραμένον
  english_pob_choice: accursed
  chosen_korean: 저주받은
  alternatives_korean:
  - 저주를 받은
  - 저주된
  lexicon: LSJ
  rationale: 분사형의 상태를 드러내면서도 단순한 ‘저주된’보다 판결·선고의 뉘앙스를 살리기 위해 ‘저주받은’으로 옮겼습니다.
- source_word: ἀπʼ ἀρχῆς
  english_pob_choice: from the beginning
  chosen_korean: 시작부터
  alternatives_korean:
  - 처음부터
  - 태초부터
  lexicon: LSJ
  rationale: 직역은 ‘처음부터’이지만, 문맥상 자연스럽고 간결한 시간 부사로 ‘시작부터’를 택했습니다.
- source_word: ἄδειαν ἐδίδους
  english_pob_choice: you granted them no pardon
  chosen_korean: 아무 사면도 주지 않으셨습니다
  alternatives_korean:
  - 아무 용서도 베풀지 않으셨습니다
  - 아무 면제도 주지 않으셨습니다
  lexicon: LSJ
  rationale: ἄδεια는 본래 허가·면제·면책의 뜻이 있어, 법정적 문맥에서 ‘사면’이 가장 근접합니다. ‘주지 않으셨습니다’는 헬라어의 부정 구조를 자연스럽게 반영합니다.
theological_decisions:
- issue: εὐλαβούμενός τινα의 의미를 ‘두려워하지 않다’로 옮길지, ‘사람을 봐주지 않다/편애하지 않다’로 풀지
  chosen_reading: “아무도 두려워하지 않으시고”로 옮겨, 그 뒤의 ‘아무 사면도 주지 않으셨습니다’와 함께 판결의 공정성과 비굴한 유예 없음의 뜻을 드러냈습니다.
  alternative_readings:
  - 아무에게도 사정을 두지 않으시고
  - 아무도 봐주지 않으시고
  rationale: 문맥상 εὐλαβούμενός는 단순한 내적 감정보다 상대를 고려해 처벌을 유예하는 태도를 가리킬 수 있으므로, 한국어에서는 ‘두려워하지 않다’로 번역하되 뒤 절과 함께 읽히도록 했습니다.
  doctrine_reference: 'Translation philosophy: 원문 우선, 해석적 과잉을 피하되 문맥적 함의를 살림'
- issue: 여기서 ‘사면’이 자비의 일반어인지, 법적 면책의 뜻인지
  chosen_reading: 법적·재판적 뉘앙스를 살리는 ‘사면’을 사용했습니다.
  alternative_readings:
  - 용서
  - 면제
  - 면책
  rationale: ἄδεια는 단순 감정적 용서보다 처벌에서 풀어주는 면책/면제의 성격이 강하므로, 본문 전체의 심판 맥락에 맞춰 법정어를 택했습니다.
  doctrine_reference: 'Translation philosophy: source-direct terminology; lexical tension preserved'
