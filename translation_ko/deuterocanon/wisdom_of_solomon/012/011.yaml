  - 씨
  lexicon: LSJ
  rationale: σπέρμα를 문자 그대로 옮기면 ‘씨’이지만, 여기서는 집단을 가리키는 비유적 용법이므로 한국어에서는 ‘씨앗’이 가장 자연스럽게 그 비유성과 집단성을 함께 살립니다.
