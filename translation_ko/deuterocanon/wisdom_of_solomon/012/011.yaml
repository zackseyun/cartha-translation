  to: 그들은 처음부터 저주받은 씨였기 때문입니다[a]. 또 당신께서는 아무도 두려워하지 않으신 채, 그들이 죄를 지은 일들에 관하여 그들에게 면책을 허락하지 않으셨습니다[b].
