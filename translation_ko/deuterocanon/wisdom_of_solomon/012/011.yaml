  lexicon: LSJ
  rationale: 분사형의 상태를 드러내면서도 단순한 ‘저주된’보다 판결·선고의 뉘앙스를 살리기 위해 ‘저주받은’으로 옮겼습니다.
- source_word: ἀπʼ ἀρχῆς
  english_pob_choice: from the beginning
  chosen_korean: 시작부터
  alternatives_korean:
