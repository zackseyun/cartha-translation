base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/011.yaml
  text: For it was a seed accursed from the beginning[a], and not fearing anyone because of the things in which they sinned[b], you granted them no pardon.
  footnotes:
  - marker: a
    text: 'Or ''offspring'' or ''race'': the Greek says ''seed,'' used figuratively for a line or people.'
    reason: lexical_alternative
  - marker: b
    text: The clause may also be rendered, 'nor, out of deference to anyone, did you grant them immunity for the things in which they sinned.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 처음부터 저주받은 씨였기 때문입니다[a]. 또 당신께서는 아무도 두려워하지 않으신 채, 그들이 죄를 지은 일들에 관하여 그들에게 면책을 허락하지 않으셨습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘후손’, ‘족속’으로도 옮길 수 있습니다. 헬라어 σπέρμα는 문자적 ‘씨’뿐 아니라 한 계통의 사람들을 비유적으로 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 구절은 “아무에게도 거리끼지 않으시고” 또는 “아무에게도 고려를 두지 않으시고”로도 이해할 수 있습니다. ‘면책’은 죄에 대한 처벌이나 책임에서 면제해 주는 것을 뜻합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: σπέρμα
  english_pob_choice: seed
  chosen_korean: 씨앗
  alternatives_korean:
