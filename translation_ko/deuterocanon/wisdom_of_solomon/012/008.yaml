base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/008.yaml
  text: But even these[a], since they were human beings, you spared, and you sent hornets ahead as forerunners of your army, so that they might destroy them little by little[c][b];
  footnotes:
  - marker: a
    text: Or 'as men' / 'inasmuch as they were human.' The Greek highlights that they were mortal human beings, which is given as the reason for God's restraint.
    reason: lexical_alternative
  - marker: b
    text: '''Hornets'' echoes the biblical motif of God sending stinging insects ahead of Israel against hostile peoples; compare Exod 23:28; Deut 7:20; Josh 24:12.'
    reason: cross_reference
  - marker: c
    text: Or 'of your camp.' The Greek στρατόπεδον can denote a camp or an army/host; the military image is retained either way.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이들까지도 사람이었으므로 당신께서 아끼셨고, 당신의 군대 앞잡이로 말벌들을 보내셔서 그들을 조금씩 멸망시키게 하셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람으로서’. 그리스어는 그들이 죽을 수밖에 없는 인간 존재라는 점을 이유로 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘말벌’은 출애굽기 23:28; 신명기 7:20; 여호수아 24:12의 연관 모티프를 떠올리게 합니다.
    reason: cross_reference
  - marker: c
    text: 또는 ‘당신의 진영’. στρατόπεδον은 진영 또는 군대/군세를 뜻할 수 있습니다.
    reason: lexical_alternative
