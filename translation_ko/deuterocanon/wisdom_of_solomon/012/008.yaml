  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 προδρόμους를 ‘앞잡이’로 옮긴 것은 현대 한국어에서 부정적 공모자라는 뜻이 강하여, 군대보다 앞서 보내진 존재라는 원문의 군사적 비유를 부정확하게 만듭니다. ‘군대에 앞서’가 이 관계를 직접적이고 중립적으로 전달합니다.
  naturalness: ‘당신의 군대 앞잡이’는 부자연스럽고 의미상 오해를 낳습니다. ‘당신의 군대에 앞서 말벌들을 보내셔서’는 현대 표준어 합쇼체로 자연스럽습니다. 각주 표지도 해당 어구에 붙여 독자의 참조 범위를 분명히 했습니다.
  terminology: ‘말벌’, ‘군대’, ‘멸망시키게 하셨습니다’는 각각 σφῆκες, στρατόπεδον, ἐξολεθρεύσωσιν의 강한 점진적 파괴 표현을 무리 없이 보존합니다. ‘사람이었으므로’는 ὡς ἀνθρώπων의 인과적 해석을 반영하되, 대안 각주를 유지합니다.
