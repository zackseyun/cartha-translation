  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/020.yaml
  text: For if you honored with such great care and forbearance the enemies of your children[a], even those deserving death, giving them time and opportunity by which they might be freed from wickedness,
  footnotes:
  - marker: a
    text: Or 'with such great attentiveness and entreaty'; the Greek uses terms literally meaning attention/care and petition/supplication.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 만일 주님의 자녀들의 원수이면서 죽어 마땅한 자들을 이처럼 큰 배려와 유예로 대하시며, 그들이 악에서 벗어날 수 있도록 시간과 자리를 주셨다면,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “큰 주의와 간구로”라는 뜻일 수 있습니다. 그리스어는 문자적으로 주의/배려와 청원/간구를 뜻하는 말을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχθρούς
  english_pob_choice: enemies
  chosen_korean: 원수들
  alternatives_korean:
  - 적들
  - 원수
  lexicon: LSJ
  rationale: ἐχθροί는 단순한 반대자보다 적대 관계에 있는 자들을 가리키므로, 한국어에서는 '원수들'이 가장 직접적입니다.
- source_word: παίδων σου
  english_pob_choice: your children
  chosen_korean: 주님의 자녀들
  alternatives_korean:
  - 주님의 아들들
  - 주님의 종들
  lexicon: LSJ
  rationale: παῖς는 문맥상 '자녀'로 읽는 것이 가장 자연스럽고, 하나님의 언약적 가족 관계를 보존합니다.
- source_word: ὀφειλομένους θανάτῳ
  english_pob_choice: deserving death
  chosen_korean: 죽어 마땅한 자들
  alternatives_korean:
  - 사형에 처해질 자들
  - 죽음에 빚진 자들
  lexicon: LSJ
  rationale: 이 분사구는 법정적 책임을 뜻하므로, 한국어에서는 그 힘을 살려 '죽어 마땅한 자들'로 옮겼습니다.
- source_word: μετὰ τοσαύτης ... προσοχῆς καὶ δεήσεως
  english_pob_choice: with such great care and forbearance
  chosen_korean: 이처럼 큰 배려와 유예로
  alternatives_korean:
  - 이처럼 큰 주의와 간구로
  - 이처럼 큰 관심과 간청으로
  lexicon: LSJ
  rationale: προσοχή는 '주의/배려'이고 δέησις는 문자적으로 '간구/청원'이지만, 문맥상 지체와 자비로운 보류의 뉘앙스를 살려 '유예'로 처리했습니다.
- source_word: δοὺς χρόνους καὶ τόπον
  english_pob_choice: giving them time and opportunity
  chosen_korean: 시간과 자리를 주셨다면
  alternatives_korean:
  - 시간과 기회를 주셨다면
  - 때와 자리를 주셨다면
  lexicon: LSJ
  rationale: τόπος는 문자적으로 '자리/장소'이지만, 여기서는 회개와 변화의 '여지'를 포함한 완곡한 표현으로 쓰여 '자리'가 원문 감각을 더 잘 보존합니다.
- source_word: ἀπαλλαγῶσι τῆς κακίας
  english_pob_choice: they might be freed from wickedness
  chosen_korean: 악에서 벗어날 수 있도록
  alternatives_korean:
  - 악에서 해방되도록
  - 악에서 풀려나도록
  lexicon: LSJ
  rationale: ἀπαλλάσσω의 수동적 의미를 한국어 자연문으로 살려 '벗어나다'를 택했고, κακία는 윤리적 악을 가리키므로 '악'으로 옮겼습니다.
theological_decisions:
- issue: δέησις를 하나님의 태도 묘사에서 어떻게 옮길지
  chosen_reading: 직역적인 '간구/청원' 대신, 문맥상 징벌을 미루며 베푸는 자비로운 태도를 드러내는 '유예'로 옮겼습니다.
  alternative_readings:
  - 간구
  - 청원
  - 간청
  rationale: 하나님이 피고에게 실제로 간청하는 장면으로 읽히지 않도록 하면서도, 심판을 유보하고 회개의 기회를 주는 본문의 논지를 살려야 했습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve source sense without wooden English.'
