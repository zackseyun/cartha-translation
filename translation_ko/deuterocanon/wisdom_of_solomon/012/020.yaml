translation:
  language: ko
  text: 만일 주님께서 주님의 자녀들의 원수들, 곧 죽어 마땅한 자들을 그처럼 세심한 배려와 간청으로 존중하여 대하시고,[a] 그들이 악에서 벗어날 수 있도록 시간과 기회를 주셨다면,
