translation:
  language: ko
  text: 당신께서 전열에서 악인들을 굴복시키실 수 없어서가 아니라, 사나운 짐승들이나 날카로운 말씀으로 한꺼번에 그들을 멸하실 수도 있었기 때문입니다.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘한꺼번에’는 ὑφʼ ἓν의 관용적 의미를 살린 표현으로, ‘한 번에’ 또는 ‘한칼에’의 뉘앙스를 가집니다.
    reason: lexical_alternative
  - marker: b
    text: ‘날카로운 말씀’은 ‘예리한 말씀’ 또는 ‘엄한 명령’으로도 옮길 수 있습니다.
    reason: lexical_alternative
