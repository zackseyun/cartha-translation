translation:
  language: ko
  text: 그러나 당신은 의로우시므로 만물을 의롭게 다스리시며, 형벌을 받을 의무가 없는 바로 그 사람을 정죄하는 것을 당신의 능력에 어긋나는 것으로 여기십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘형벌을 받을 책임이 없는 사람’. 그리스어는 문자적으로 ‘형벌을 받을 의무가 없는 사람’이라고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신의 능력에 낯선 것으로’ 또는 ‘당신의 능력과 일치하지 않는 것으로’.
    reason: lexical_alternative
