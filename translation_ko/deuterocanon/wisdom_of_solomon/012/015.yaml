theological_decisions:
- issue: '''foreign to your power''의 신학적 함의'
  chosen_reading: 하나님이 무력해서 할 수 없다는 뜻이 아니라, 의로운 성품과 능력에 비추어 부당한 정죄는 그분의 능력에 어긋난다는 뜻으로 읽었습니다.
  alternative_readings:
  - 단순히 '당신의 위엄에 어울리지 않는다'로 약화하는 읽기
  - '''능력''을 ''권한''으로 좁혀 읽는 해석'
  rationale: 본문은 의로우신 하나님이 만물을 의롭게 다스리신다는 진술과, 무죄한 자를 정죄하는 행위가 그분께 부적합하다는 판단을 연결합니다. 긴장을 완화하지 않고 원문의 논리를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; original-language primacy over translation tradition.'
