  - marker: b
    text: Or 'alien to your power' or 'inconsistent with your power.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 당신은 의로우시기에, 만물을 의롭게 다스리십니다. 당신의 능력에 어긋나는 일로 여기시며, 벌받을 자격이 없는 자를 정죄하지 않으십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘벌받을 책임이 없는 자’. 그리스어는 문자적으로 ‘벌받아야 할 의무가 없는 자’라고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신의 능력에 어긋나는’ 혹은 ‘당신의 능력과 일치하지 않는’.
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιος ... δικαίως
  english_pob_choice: righteous / righteously
  chosen_korean: 의로우시기에 / 의롭게
  alternatives_korean:
  - 정의로우시기에 / 정의롭게
  - 공의로우시기에 / 공의롭게
  lexicon: LSJ
  rationale: 형용사 δίκαιος와 부사 δικαίως의 어근 반복을 한국어에서도 살려, 하나님의 성품과 शासन 방식이 서로 대응되도록 했습니다. '의롭다/의롭게'가 가장 직접적이며, 반복 효과도 유지합니다.
- source_word: διέπεις
  english_pob_choice: govern
  chosen_korean: 다스리십니다
  alternatives_korean:
  - 통치하십니다
  - 운영하십니다
  - 주관하십니다
  lexicon: LSJ
  rationale: 문맥상 만물을 질서 있게 관리하고 심판하시는 통치 행위를 가리키므로 '다스리십니다'가 자연스럽고, 단순한 행정 관리보다 더 넓은 주권적 의미를 담습니다.
- source_word: μὴ ὀφείλοντα κολασθῆναι
  english_pob_choice: one who does not deserve to be punished
  chosen_korean: 벌받을 자격이 없는 자
  alternatives_korean:
  - 벌받아야 할 빚이 없는 자
  - 형벌을 받을 의무가 없는 자
  - 벌받을 책임이 없는 자
  lexicon: LSJ
  rationale: ὀφείλω+부정사 구조의 '형벌을 져야 할 의무/빚이 없음'을 현대 한국어에서 의미상 분명하게 옮겼습니다. '자격'은 원문의 책임 부재를 비교적 자연스럽게 전달합니다.
- source_word: ἀλλότριον
  english_pob_choice: foreign
  chosen_korean: 어긋나는 일
  alternatives_korean:
  - 낯선 일
  - 이질적인 일
  - 당신의 능력에 속하지 않는 일
  lexicon: LSJ
  rationale: 직역의 '이방한/외래한'보다, 문맥상 하나님의 능력과 성품에 맞지 않음을 드러내는 표현이 더 분명합니다. POB의 'foreign to your power'를 한국어 관용으로 풀되, 의미의 긴장을 유지했습니다.
- source_word: τῆς σῆς δυνάμεως
  english_pob_choice: your power
  chosen_korean: 당신의 능력
  alternatives_korean:
  - 당신의 힘
  - 당신의 권능
  - 당신의 권위
  lexicon: LSJ
  rationale: θεϊκή δύναμις는 단순한 물리적 힘보다 하나님의 능력/권능을 가리키지만, 본문은 권위보다 '능력'이 더 넓고 균형 잡힌 대응입니다. POB의 'power'를 직접 반영했습니다.
theological_decisions:
- issue: '''foreign to your power''의 신학적 함의'
  chosen_reading: 하나님이 무력해서 할 수 없다는 뜻이 아니라, 의로운 성품과 능력에 비추어 부당한 정죄는 그분의 능력에 어긋난다는 뜻으로 읽었습니다.
  alternative_readings:
  - 단순히 '당신의 위엄에 어울리지 않는다'로 약화하는 읽기
  - '''능력''을 ''권한''으로 좁혀 읽는 해석'
  rationale: 본문은 의로우신 하나님이 만물을 의롭게 다스리신다는 진술과, 무죄한 자를 정죄하는 행위가 그분께 부적합하다는 판단을 연결합니다. 긴장을 완화하지 않고 원문의 논리를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; original-language primacy over translation tradition.'
