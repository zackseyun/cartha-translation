    reason: lexical_alternative
  - marker: b
    text: 또는 '그들이 그 자리에 있었던 이들을 받아들이지 않았다'.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 '외국인 은혜자들을 노예로 삼았다' 또는 '외국인 은혜자들을 노예로 만들었다'입니다.
