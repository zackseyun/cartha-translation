translation:
  language: ko
  text: 그리고 그것만이 아니라[a], 그들에 대한 조사도 있을 것입니다. 그들이 이방인들을 적대적으로 맞아들였기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들에게 임하는 방문이 있을 것입니다’; 그리스어는 심판을 위한 하나님의 방문을 함축할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μόνον, ἀλλʼ
  english_pob_choice: not only that
  chosen_korean: 그것만이 아니라
  alternatives_korean:
