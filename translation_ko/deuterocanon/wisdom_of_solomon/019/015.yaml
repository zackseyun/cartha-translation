  rationale: 원어는 방문/감찰/조사/심판의 폭을 가지므로, 본문에 없는 결과를 미리 단정하지 않으면서도 경고의 분위기를 유지하는 번역이 적절합니다.
  doctrine_reference: Translation philosophy §1, §3, §5
