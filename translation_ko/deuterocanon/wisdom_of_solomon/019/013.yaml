- from: 그리고 형벌들이 죄인들 위에 임했습니다[a]. 그것은 번개들의 폭력 속에서 일어난 일들에 대한 증거를 결코 동반하지 않은 것이 아니었습니다. 그들은 자기들의 악행으로 마땅히 고난을 받았기 때문입니다[b]. 더구나 그들은 나그네를 더욱 심하게 미워하는 일을 일삼았습니다.
  to: 그리고 죄인들에게 형벌이 내렸습니다. 번개의 위력 가운데서 일어난 일들이 그 증거가 되었기 때문입니다[a]. 그들은 자기들의 악행 때문에 마땅히 고난을 받았습니다. 그들이 더 심한 나그네 혐오를 일삼았기 때문입니다[b].
