base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/013.yaml
  text: And punishments came upon the sinners[a], not without the evidence of what had happened in the violence of the thunderbolts; for they justly suffered for their own wicked acts[b], because they practiced a more grievous hatred of strangers.
  footnotes:
  - marker: a
    text: Or 'not without proofs from the events, in the force of the thunderbolts.' The Greek syntax is compressed, and the phrase may be taken slightly differently while keeping the same overall sense.
    reason: lexical_alternative
  - marker: b
    text: '''Hatred of strangers'' may also be rendered ''inhospitality,'' but the Greek term can imply active hostility toward foreigners or guests, not merely failure to welcome them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 죄인들에게 형벌이 내렸습니다. 번개의 위력 가운데서 일어난 일들이 그 증거가 되었기 때문입니다[a]. 그들은 자기들의 악행 때문에 마땅히 고난을 받았습니다. 그들이 더 심한 나그네 혐오를 일삼았기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘번개들의 위력 가운데서 일어난 일들의 증거 없이가 아니었습니다’입니다. 그리스어 구문은 압축되어 있어, ‘번개의 위력으로’와 ‘일어난 일들의 증거’의 연결은 약간 다르게 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘나그네 혐오’는 ‘낯선 이들 또는 손님들에 대한 적대’로도 옮길 수 있습니다. 그리스어는 단순히 접대하지 않는 태도보다 강한 적대감을 뜻할 수 있습니다.
    reason: lexical_alternative
