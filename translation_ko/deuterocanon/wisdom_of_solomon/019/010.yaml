base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/010.yaml
  text: 'For they still remembered the things in their time as foreigners: how[a], instead of the breeding of animals, the land brought forth gnats, and instead of creatures of the water[b], the river spewed out a multitude of frogs.'
  footnotes:
  - marker: a
    text: Or 'their sojourning' or 'their residence as aliens.' The Greek term refers to living in a place as foreigners.
    reason: lexical_alternative
  - marker: b
    text: The exact insect denoted by the Greek may be understood more broadly than 'gnats'; 'mosquitoes' or similar small biting insects are sometimes suggested.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 이방 땅에서 나그네로 지내던 때[a]의 일들, 곧 짐승들이 번식하는 대신 땅이 각다귀 떼를 내어놓고[b], 물에 사는 생물들 대신 강이 수많은 개구리를 토해 냈던 일을 아직도 기억하고 있었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 타국에 거류하던 때’로 옮길 수 있습니다. 여기의 그리스어는 낯선 곳에서 외국인으로 사는 처지를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어가 가리키는 곤충은 ‘각다귀’보다 더 넓게 이해될 수 있으며, ‘모기’나 그와 비슷한 작은 흡혈 곤충으로 보기도 합니다.
    reason: lexical_alternative
