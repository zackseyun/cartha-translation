  - severity: low
    issue: 각주 표지가 관련 어휘에 직접 붙지 않음
    rationale: a는 παροικία를 옮긴 구절에, b는 σκνίψ를 옮긴 ‘각다귀 떼’에 붙여 각주의 지시 대상을 명확히 해야 합니다.
