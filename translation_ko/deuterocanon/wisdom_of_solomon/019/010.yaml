  source_fidelity: 현 초안은 핵심 어휘와 대조 구조를 대체로 충실히 옮겼습니다. 그러나 δεύτε 문장을 ‘…때문입니다’로 처리하면서, 재앙들은 ‘기억한 일들의 내용’인데 그것들이 기억의 이유인 것처럼 읽힐 수 있습니다. 원문의 πῶς 이하가 기억의 내용을 설명하도록 문장 구조를 바로잡는 것이 필요합니다.
  naturalness: ‘곧 … 때문입니다’는 앞문장과의 논리 관계가 어색합니다. 기억의 대상과 그 내용을 한 문장으로 연결하면 현대 한국어 합쇼체에서 더 자연스럽고 분명합니다. 또한 각주 b의 ‘작은 물고는 곤충’은 비문에 가까우므로 ‘작은 흡혈 곤충’으로 고칩니다.
  terminology: παροικία의 외국인 거주 상태는 ‘이방 땅에서 나그네로 지내던 때’로 보존했습니다. σκνίψ는 정확한 곤충 식별이 불확실하므로 본문에서는 통상적인 ‘각다귀 떼’를 쓰고 각주에서 범위를 밝혔습니다. ἐξηρεύξατο의 강한 배출 이미지는 ‘토해 냈다’로 유지했습니다.
  issues:
  - severity: medium
    issue: πῶς 이하의 통사적 연결이 ‘기억한 내용’이 아니라 기억의 원인처럼 처리됨
    rationale: 원문은 ‘그들이 … 일들을 기억했다. 곧 어떻게 땅과 강이 … 했는지를’라는 구조입니다. 현행 ‘곧 … 때문입니다’는 재앙들이 기억의 이유라는 인상을 줍니다.
  - severity: low
