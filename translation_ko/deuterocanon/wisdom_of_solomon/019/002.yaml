  - marker: b
    text: '''Having changed their minds'' may also be rendered ''having regretted it.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 자신들이 그들을 놓아주는 것에서 돌아선 뒤, 또 서둘러 그들을 떠나보낸 뒤에, 마음을 바꾸었으므로 그들을 뒤쫓을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그들을 떠나가게 허락한 데서 돌아선 뒤'라고 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘마음을 바꾸었으므로’는 ‘후회했으므로’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστρέψαντες
  english_pob_choice: had turned back
  chosen_korean: 돌아선 뒤
  alternatives_korean:
  - 돌아간 뒤
  - 되돌아선 뒤
  lexicon: LSJ
  rationale: 반전의 동작을 드러내는 표현으로 옮겨, 처음 놓아주던 태도에서 다시 돌아서는 이미지를 살렸습니다.
- source_word: τοῦ ἀπεῖναι
  english_pob_choice: from letting them go
  chosen_korean: 그들을 놓아주는 것에서
  alternatives_korean:
  - 그들이 떠나가도록 허락하는 것에서
  - 그들을 떠나보내는 데서
  lexicon: LSJ
  rationale: 문맥상 단순한 부재가 아니라 출발을 허락하는 의미이므로, 출애굽 장면에 맞게 풀었습니다.
- source_word: μετὰ σπουδῆς προπέμψαντες
  english_pob_choice: had sent them on with urgency
  chosen_korean: 서둘러 그들을 떠나보낸 뒤
  alternatives_korean:
  - 급히 그들을 배웅한 뒤
  - 간절히 그들을 보내준 뒤
  lexicon: LSJ
  rationale: σπουδή의 속도감과 긴박함을 살리되, 한국어 문장에서는 자연스럽게 '서둘러'로 압축했습니다.
- source_word: μεταμεληθέντες
  english_pob_choice: having changed their minds
  chosen_korean: 마음을 바꾸었으므로
  alternatives_korean:
  - 후회했으므로
  - 뉘우쳤으므로
  lexicon: LSJ
  rationale: 후회·회개의 신학적 뉘앙스를 과도하게 불어넣지 않으면서, 행동의 방향 전환을 분명히 했습니다.
theological_decisions:
- issue: 행위의 연속성과 결과를 나타내는 분사구문 처리
  chosen_reading: 두 개의 aorist 분사를 모두 '—한 뒤' 구조로 살려, 먼저 되돌아선 다음 급히 떠나보냈고 그 결과 뒤쫓게 되었다는 흐름을 보존했습니다.
  alternative_readings:
  - 단순히 현재형 서술로 풀어 '돌아서며 떠나보내고'라고 할 수도 있습니다.
  rationale: 그리스어 분사들의 선행성을 한국어에서도 드러내야, 본문의 사건 진행이 흐려지지 않습니다.
  doctrine_reference: '번역 원리: 원문 사건 순서 보존'
