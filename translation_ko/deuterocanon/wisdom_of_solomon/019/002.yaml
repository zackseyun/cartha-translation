  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/002.yaml
  text: because after they themselves[a] had turned back from letting them go, and had sent them on with urgency, they would pursue them[b], having changed their minds.
  footnotes:
  - marker: a
    text: Or 'after they had returned from letting them depart' or 'after they had reversed themselves about letting them go.'
