  lexicon: LSJ
  rationale: δόξα 계열의 ‘영광’ 의미를 보존하면서, 문어체 한국어에서 신적 존귀를 자연스럽게 드러내는 ‘영화롭게 하다’를 택했습니다.
- source_word: οὐχ ὑπερεῖδες ... παριστάμενος
  english_pob_choice: you did not overlook ... standing by them
  chosen_korean: 간과하지 않으시고 ... 그들 곁에 서 계셨습니다
  alternatives_korean:
  - 외면하지 않으시고 ... 함께 서 계셨습니다
  - 돌보지 않으시지 않고 ... 곁에 계셨습니다
  lexicon: LSJ
