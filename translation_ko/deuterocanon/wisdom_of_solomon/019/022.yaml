theological_decisions:
- issue: 하나님의 임재를 나타내는 παριστάμενος의 표현 방식
  chosen_reading: ‘그들 곁에 서 계셨습니다’로 번역해 적극적 임재와 도움의 의미를 드러냈습니다.
  alternative_readings:
  - ‘그들과 함께 계셨습니다’
  - ‘그들 앞에 서 계셨습니다’
  rationale: 본문은 단순한 장소적 존재가 아니라 백성 곁에서 지지하시는 하나님의 행위를 말하므로, ‘서 계셨습니다’가 참여적 임재를 가장 잘 드러냅니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: Κύριε의 호칭
  chosen_reading: ‘주님’으로 옮겨 하나님께 드리는 직접 호칭을 살렸습니다.
  alternative_readings:
  - ‘주여’
  - ‘오 주님’
  rationale: 그리스어 호격의 직접 호칭을 자연스러운 현대 한국어 예배 문체로 살리되, 불필요한 ‘오’를 붙이지 않아 가독성을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — κύριος → Lord'
