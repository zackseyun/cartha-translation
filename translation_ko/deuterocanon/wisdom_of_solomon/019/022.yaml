translation:
  language: ko
  text: 주님께서는 모든 면에서 주님의 백성을 크게 하시고 영광스럽게 하셨으며, 언제나 어디서나 그들 곁에 서 계시면서 그들을 간과하지 않으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘간과하지 않으셨다’는 직역에 가까우며, ‘외면하지 않으셨다’ 또는 ‘돌보기를 소홀히 하지 않으셨다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ πάντα
  english_pob_choice: in every way
  chosen_korean: 모든 일에
  alternatives_korean:
  - 모든 면에서
  - 전반적으로
  lexicon: LSJ
  rationale: κατά + 대격 복수는 포괄성을 나타내므로, 한국어에서는 자연스러운 ‘모든 일에’로 옮겨 전체적·전면적 의미를 살렸습니다.
