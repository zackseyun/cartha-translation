  rationale: 직역적 ‘크게 하다’의 의미를 유지하되 한국어에서 어색하지 않도록 ‘크게 하시고’로 처리해 존귀하게 하시는 뉘앙스를 살렸습니다.
- source_word: ἐδόξασας
  english_pob_choice: glorified
  chosen_korean: 영화롭게 하셨으며
  alternatives_korean:
  - 영광스럽게 하셨으며
  - 영예롭게 하셨으며
  lexicon: LSJ
  rationale: δόξα 계열의 ‘영광’ 의미를 보존하면서, 문어체 한국어에서 신적 존귀를 자연스럽게 드러내는 ‘영화롭게 하다’를 택했습니다.
- source_word: οὐχ ὑπερεῖδες ... παριστάμενος
  english_pob_choice: you did not overlook ... standing by them
  chosen_korean: 간과하지 않으시고 ... 그들 곁에 서 계셨습니다
  alternatives_korean:
  - 외면하지 않으시고 ... 함께 서 계셨습니다
  - 돌보지 않으시지 않고 ... 곁에 계셨습니다
  lexicon: LSJ
  rationale: ὑπεροράω의 ‘눈여겨보지 않다/간과하다’ 의미와 παρίστημι의 ‘곁에 서다’ 이미지를 함께 살려, 단순한 존재보다 보호적 임재를 드러냈습니다.
theological_decisions:
- issue: 하나님의 임재를 나타내는 παριστάμενος의 표현 방식
  chosen_reading: ‘그들 곁에 서 계셨습니다’로 번역해 적극적 임재와 도움의 의미를 드러냈습니다.
  alternative_readings:
  - ‘그들과 함께 계셨습니다’
  - ‘그들 앞에 서 계셨습니다’
  rationale: 본문은 단순한 장소적 존재가 아니라 백성 곁에서 지지하시는 하나님의 행위를 말하므로, ‘서 계셨습니다’가 참여적 임재를 가장 잘 드러냅니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: Κύριε의 호칭
  chosen_reading: ‘주님’으로 옮겨 하나님께 드리는 직접 호칭을 살렸습니다.
  alternative_readings:
  - ‘주여’
  - ‘오 주님’
  rationale: 그리스어 호격의 직접 호칭을 자연스러운 현대 한국어 예배 문체로 살리되, 불필요한 ‘오’를 붙이지 않아 가독성을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — κύριος → Lord'
