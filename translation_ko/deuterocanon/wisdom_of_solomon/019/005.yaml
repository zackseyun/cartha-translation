  - 여정을 겪었지만
  - 기이한 여행을 겪었지만
  lexicon: LSJ
  rationale: πειράσῃ를 ‘시도하다’로 오해하지 않도록 ‘겪다’로 옮겨, 실제로 통과하고 당한 사건의 성격을 드러냈습니다.
- source_word: ξένον εὕρωσι θάνατον
  english_pob_choice: they found a strange death
  chosen_korean: 낯선 죽음을 만났습니다
  alternatives_korean:
  - 이상한 죽음을 만났습니다
  - 외국의 죽음을 만났습니다
  - 낯선 죽음을 발견했습니다
  lexicon: LSJ
  rationale: ξένον의 ‘낯선/이질적인’ 감각을 살리되, 죽음과의 결합에서 한국어로 자연스러운 ‘만나다’를 사용해 원문의 충격을 보존했습니다.
theological_decisions:
- issue: 이스라엘의 체험과 이집트의 죽음 사이의 대조
  chosen_reading: 하나님의 백성은 놀라운 여정을 겪었고, 다른 쪽은 낯선 죽음을 만났다는 강한 대조로 옮겼습니다.
  alternative_readings:
  - 두 절 모두 ‘이상한’ 계열의 단어로 맞추는 번역
  - 대조를 약화시켜 단순 서술로 옮기는 번역
  rationale: 그리스어의 παράδοξον과 ξένον은 같은 어근이 아니라 의도적 대조를 이루므로, 한국어에서도 긍정적 경이와 음산한 이질성을 갈라 살려야 합니다.
  doctrine_reference: Translation philosophy §§1, 5
