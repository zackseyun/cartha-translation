  lexicon: LSJ
  rationale: ὄψις의 시각적 의미를 살려 ‘모습’을 택했고, γεγονότων은 사건 자체보다 ‘일어난 일들’이 자연스럽습니다.
theological_decisions:
- issue: 비유의 성격을 철학적으로 과잉 해석할지 여부
  chosen_reading: 자연의 요소들이 재구성되는 현상을 하프의 음들에 빗댄 비유로 유지하고, 후기 철학적 우주론은 끌어들이지 않았습니다.
  alternative_readings:
  - 원소들을 우주적 원리나 영적 힘으로 읽는 해석
  rationale: 문맥은 출애굽 사건들에 대한 관찰 가능한 묘사이므로, 본문의 이미지가 말하는 범위를 넘겨 형이상학적 의미를 덧씌우지 않았습니다.
  doctrine_reference: 원문 우선 원칙; 본문이 남겨 둔 긴장을 보존
