  lexicon: BDAG
  rationale: ἀσεβής는 단순한 도덕적 악보다 하나님에 대한 경건 없음과 불경건을 가리키므로, ‘경건하지 않은 자들’이 의미를 가장 직접적으로 살립니다.
- source_word: ἀνελεήμων θυμὸς
