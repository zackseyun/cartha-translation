  source_fidelity: ‘그들과 장차 일어날 일을’은 그리스어 αὐτῶν을 공동격처럼 처리하여 원문의 관계를 잘못 나타냅니다. 여기서는 αὐτῶν이 뒤의 τὰ μέλλοντα와 연결되어, 그들이 장차 하게 될 일들을 미리 아셨다는 뜻으로 옮기는 것이 적절합니다. ‘무자비한 진노’, ‘끝까지 임했습니다’는 ἀνελεήμων θυμὸς 및 μέχρι τέλους ἐπέστη를 충실히 반영합니다.
  naturalness: 현행 ‘그가 그들과 장차 일어날 일을’은 현대 한국어에서 부자연스럽고 의미 관계가 불명확합니다. ‘그가 그들이 장차 하게 될 일들까지도’로 고치면 문장이 자연스럽고 원문의 강조도 드러납니다.
  terminology: ‘경건하지 않은 자들’은 ἀσεβέσιν의 종교적·윤리적 의미를 무리 없이 전달하며, ‘무자비한 진노’도 심판 문맥의 어조에 알맞습니다. 생략된 주어는 ‘그가’로 보존하고 주석에서 문맥상 하나님을 가리킴을 설명하는 처리가 적절합니다.
