    reason: lexical_alternative
  - marker: b
    text: 그리스어에서는 ‘미리 아셨기’의 주어가 생략되어 있으며, 문맥상 가장 자연스럽게는 하나님을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσεβέσιν
  english_pob_choice: the ungodly
  chosen_korean: 경건하지 않은 자들
  alternatives_korean:
