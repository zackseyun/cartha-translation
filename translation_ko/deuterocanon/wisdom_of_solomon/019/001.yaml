  text: 그러나 경건하지 않은 자들에게는 무자비한 진노가 끝까지 임했습니다. 이는 그가 그들과 장차 일어날 일을 미리 아셨기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
