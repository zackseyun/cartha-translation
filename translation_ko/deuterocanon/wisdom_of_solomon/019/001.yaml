  - 긍휼 없는 분노
  lexicon: LSJ; BDAG
  rationale: 형용사와 명사의 결합이 심판적 분노의 냉혹함을 강조하므로, 한국어에서도 짧고 강한 ‘무자비한 진노’로 압축해 살렸습니다.
- source_word: μέχρι τέλους
  english_pob_choice: to the very end
  chosen_korean: 끝까지
  alternatives_korean:
  - 마지막까지
  - 완전히
  lexicon: LSJ
  rationale: 시간적 종결을 나타내는 표현이므로 ‘끝까지’가 자연스럽고, 필요 이상의 해석을 더하지 않습니다.
- source_word: προῄδει ... καὶ τὰ μέλλοντα
  english_pob_choice: he knew beforehand both them and what was going to happen
  chosen_korean: 그가 그들과 장차 일어날 일을 미리 아셨기 때문입니다
  alternatives_korean:
  - 그가 그들과 앞으로 올 일을 미리 아셨기 때문입니다
  - 그가 그들과 장차 올 일을 미리 아셨기 때문입니다
  lexicon: BDAG; LSJ
  rationale: 동사의 전미래적 의미를 ‘미리 아셨기’로, τὰ μέλλοντα를 ‘장차 일어날 일’로 옮겨 미래 사건을 포괄적으로 드러냈습니다.
theological_decisions:
- issue: προῄδει의 주어가 그리스어에서 생략됨
  chosen_reading: 문맥상 하나님을 가리키는 것으로 이해되지만, 본문에는 주어를 노골적으로 넣지 않고 ‘그가’로 처리했습니다.
  alternative_readings:
  - ‘하나님이 미리 아셨기 때문입니다’로 명시적으로 번역
  rationale: 그리스어의 생략을 한국어 문장에서는 최소한의 대명사로만 보완해, 본문이 가진 경제성을 보존하면서도 문맥적 지시 대상을 자연스럽게 이해할 수 있게 했습니다.
  doctrine_reference: 문맥에 따른 생략된 주어 복원은 유지하되, 본문에 없는 명시적 추가는 피합니다.
