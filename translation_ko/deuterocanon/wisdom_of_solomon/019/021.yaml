  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/021.yaml
  text: Flames[a], on the contrary, did not wither the flesh of the perishable living creatures that walked among them, nor did they melt the meltable[b], crystal-like kind of ambrosial food.
  footnotes:
  - marker: a
    text: Or 'conversely' or 'in reverse' for 'on the contrary.' The Greek adverb marks the flames' behavior as the opposite of what would normally be expected.
    reason: lexical_alternative
  - marker: b
    text: '''Crystal-like'' may also be understood as ''ice-like'' or ''crystalline,'' describing the appearance or consistency of the miraculous food.'
    reason: lexical_alternative
translation:
  language: ko
  text: 불길은 그와 반대로, 그들 사이를 거니는 부패하기 쉬운 살아 있는 것들의 살을 시들게 하지도, 녹아내리기 쉬운 크리스털 같은 불사(不死)의 음식의 종류를 녹이지도 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그와 반대로’는 대조를 풀어쓴 표현입니다. 그리스어 부사는 불길이 통상 기대와 정반대로 행동했음을 표시합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘크리스털 같은’은 ‘얼음 같은’ 또는 ‘결정 같은’으로도 이해할 수 있으며, 기적의 음식의 모습이나 질감을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: φλόγες
  english_pob_choice: Flames
  chosen_korean: 불길
  alternatives_korean:
  - 화염
  - 불꽃
  lexicon: LSJ
  rationale: 복수의 불 현상을 가리키는 표현으로, 문맥의 재앙적 이미지에 맞게 자연스럽고 구체적인 ‘불길’로 옮겼습니다.
- source_word: ἀνάπαλιν
  english_pob_choice: on the contrary
  chosen_korean: 그와 반대로
  alternatives_korean:
  - 오히려
  - 반대로
  - 뒤집혀
  lexicon: LSJ
  rationale: 앞선 기대와 정반대의 작용을 표시하는 부사이므로, 한국어에서도 대비를 분명히 드러내는 ‘그와 반대로’가 적절합니다.
- source_word: εὐφθάρτων ζῴων
  english_pob_choice: the perishable living creatures
  chosen_korean: 부패하기 쉬운 살아 있는 것들
  alternatives_korean:
  - 쉽게 썩는 짐승들
  - 죽을 수밖에 없는 생물들
  lexicon: LSJ
  rationale: ζῷα의 기본 의미를 살리되 종을 좁히지 않기 위해 ‘살아 있는 것들’로 두고, εὐφθάρτων은 ‘부패하기 쉬운’으로 반영했습니다.
- source_word: κρυσταλλοειδὲς γένος ἀμβροσίας τροφῆς
  english_pob_choice: the meltable, crystal-like kind of ambrosial food
  chosen_korean: 녹아내리기 쉬운 크리스털 같은 불사(不死)의 음식의 종류
  alternatives_korean:
  - 녹기 쉬운 수정 같은 불사의 양식
  - 얼음 같은 불멸의 음식의 종류
  lexicon: LSJ
  rationale: κρυσταλλοειδές는 ‘크리스털 같은’의 표면적 이미지가 핵심이므로 이를 유지했고, ἀμβροσία는 그리스 신화적 ‘불사’의 뉘앙스를 살리기 위해 직역했습니다.
theological_decisions:
- issue: ἀμβροσίας τροφῆς의 신화적·문학적 뉘앙스를 어떻게 한국어로 살릴지
  chosen_reading: 불사(不死)의 음식
  alternative_readings:
  - 하늘의 음식
  - 영생의 음식
  rationale: 본문은 후대 교리어보다 헬레니즘 문학어의 높임을 띠므로, ‘불사’로 옮겨 원문의 고전적 울림을 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 6
- issue: ἐμπεριπατούντων의 관계를 어디까지 구체화할지
  chosen_reading: 그들 사이를 거니는
  alternative_readings:
  - 그들 가운데를 다니는
  - 그들 가운데서 걷는
  rationale: 불길 한가운데를 움직이는 장면을 과도하게 해설하지 않으면서도, 동작의 위치 관계를 분명히 드러내는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 6
