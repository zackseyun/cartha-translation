  source_fidelity: 전반적으로 불길이 생물들의 살을 시들게 하지 않고 기적의 음식을 녹이지 않았다는 대조 구조를 잘 보존합니다. 다만 ἐμπεριπατούντων은 불길 안에서 움직이는 생물들을 가리키므로 ‘그들 사이를 거니는’보다 ‘그 불길 속을 걸어 다니는’이 지시 관계와 동작을 더 정확히 드러냅니다. γένος도 ‘한 종류’로 나타내는 편이 안전합니다.
  naturalness: ‘부패하기 쉬운 살아 있는 것들’과 ‘그들 사이를 거니는’은 현대 한국어에서 다소 직역투이며, ‘거니는’은 한가로운 뉘앙스를 줄 수 있습니다. 또한 각주 표지는 해당 어구 바로 뒤에 두는 것이 독자에게 자연스럽습니다.
  terminology: ‘불사의 음식’은 ἀμβροσίας τροφῆς의 문학적·신화적 어감을 살리는 허용 가능한 번역입니다. 한자 병기는 필수적이지 않으므로 현대 표준어 본문에서는 생략하는 편이 낫습니다. κρυσταλλοειδές는 ‘수정 같은’으로 자연스럽게 옮길 수 있습니다.
