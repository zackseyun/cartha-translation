  text: 그러나 축제와 함께 그들을 맞아들였던 이들은, 이미 같은 권리를 함께 누리던 이들을 결국 끔찍한 고난으로 괴롭혔습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
