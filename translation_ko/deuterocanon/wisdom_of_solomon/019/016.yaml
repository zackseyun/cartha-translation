  source_fidelity: 원문의 대조 구조와 ‘이미 함께 참여했던’ 뜻은 대체로 반영되었으나, ‘결국’은 원문에 없는 시간적 첨가입니다. 또한 δικαίων을 단정적으로 ‘권리’로 옮기면 난해하고 논쟁적인 표현의 폭이 지나치게 좁아집니다. 전승 본문의 δείπνοις(통상 ‘식사들/연회들’)는 문장 안에서 문법적으로 곤란하므로, 본문에서는 매끄러운 의미 전달을 우선하되 각주에서 정확히 밝혀야 합니다. πόνοις에는 ‘끔찍한’이라는 강화어가 없습니다.
  naturalness: ‘축제와 함께 … 맞아들였던 이들은’보다 ‘축제를 벌여 … 맞아들였으며’가 현대 한국어 문장 흐름에 더 자연스럽습니다. ‘고통으로 그들을 학대했습니다’는 원문의 수단격과 가해 행위를 간결하게 살립니다.
