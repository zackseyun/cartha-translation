    reason: lexical_alternative
  - marker: b
    text: 전승된 그리스어의 δείπνοις는 보통 ‘식사들/연회들’이라는 뜻이지만, 문맥상 문장이 난해하여 여기서는 뒤따르는 학대의 의미를 옮겼습니다.
    reason: textual_variant
