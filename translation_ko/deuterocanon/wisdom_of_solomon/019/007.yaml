translation:
  language: ko
  text: 그 진을 그늘지게 한 구름이 보였고, 그들 앞에 먼저 서 있던 물에서 마른 땅이 나타났으며, 홍해에서는 막힘없는 길이, 거센 물결에서는 풀이 무성한 평야가 나타났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘갈대바다.’ 여기의 그리스어 본문은 ‘홍해’라고 읽으므로 본문에는 그 표현을 유지했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: σκιάζουσα
