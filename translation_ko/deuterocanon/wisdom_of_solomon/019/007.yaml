  source_fidelity: 그리스어는 ‘진영에 그늘을 드리우는 구름’과 ‘이미 서 있던 물에서 마른 땅이 드러남’을 병렬로 묘사합니다. 초안의 ‘그들 앞에’는 원문에 명시되지 않은 대상을 더하므로 삭제하는 것이 안전합니다. 또한 ‘그늘지게 한’보다 ‘그늘을 드리운’이 σκιάζουσα의 작용을 더 자연스럽고 정확하게 나타냅니다.
  naturalness: ‘그들 앞에 먼저 서 있던 물’은 현대 한국어에서 물의 상태를 부자연스럽게 표현합니다. ‘이미 멈추어 있던 물’로 옮기면 시간적 선행성과 정지의 이미지를 유지하면서 문장이 자연스러워집니다. 주석 표지는 해당 지명 바로 뒤에 두어 연결 대상을 분명히 해야 합니다.
  terminology: ‘진영’, ‘홍해’, ‘막힘없는 길’, ‘풀이 무성한 벌판’은 현대적이면서도 본문의 어휘와 격조에 잘 맞습니다. ἐρυθρᾶς θαλάσσης는 그리스어 본문에 따라 ‘홍해’로 유지합니다. ‘갈대 바다’는 본문의 이문이 아니라 더 넓은 출애굽 전승과 관련한 대안적 번역·명칭이므로 주석에서 그렇게 밝혀야 합니다.
