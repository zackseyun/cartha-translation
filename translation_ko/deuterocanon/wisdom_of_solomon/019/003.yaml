base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/003.yaml
  text: For while they still had their mourning in their hands and were still lamenting at the graves of the dead[a], they took up another plan of folly, and those whom they had driven out with pleading[c][b], these they pursued as fugitives.
  footnotes:
  - marker: a
    text: Greek literally, 'having the mourning in their hands,' a vivid idiom for still being occupied with mourning rites or signs of grief.
    reason: cultural_note
  - marker: b
    text: Or 'another senseless design' / 'another thought of folly.'
    reason: lexical_alternative
  - marker: c
    text: That is, the same people whom they had earlier urged to leave were later chased as if they were runaways.
    reason: cross_reference
translation:
  language: ko
  text: 그들은 아직 손에 애도를 지닌 채, 죽은 이들의 무덤에서 계속 통곡하고 있었는데, 또 다른 어리석음의 계획을 세웠으며, 애원하며 내쫓았던 이들을[a][b], 이제는 도망자처럼 뒤쫓았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어는 문자적으로 ‘손에 애도를 지닌 채’이며, 애도 의식이나 슬픔의 표지를 아직 계속 지니고 있었다는 생생한 관용구입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘또 다른 어리석은 생각’ / ‘또 다른 어리석은 계획’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν χερσὶν ἔχοντες τὰ πένθη
  english_pob_choice: had their mourning in their hands
  chosen_korean: 손에 애도를 지닌 채
  alternatives_korean:
  - 애도의 표지를 손에 든 채
  - 아직도 애도에 매여
  lexicon: LSJ
  rationale: 직역의 이미지인 ‘손에’와 ‘애도’를 살리되, 한국어에서는 자연스럽게 ‘지닌 채’로 풀어 비유의 생동감을 유지했습니다.
- source_word: προσοδυρόμενοι τάφους νεκρῶν
  english_pob_choice: were still lamenting at the graves of the dead
  chosen_korean: 죽은 이들의 무덤에서 계속 통곡하고 있었는데
  alternatives_korean:
  - 죽은 자들의 무덤 앞에서 계속 애곡하고 있었는데
  - 죽은 이들의 무덤을 향해 계속 슬퍼하고 있었는데
  lexicon: LSJ
  rationale: προσοδυρόμενοι의 지속적이고 큰 소리의 슬픔을 ‘통곡하다’로 옮기고, τάφους νεκρῶν은 ‘죽은 이들의 무덤’으로 간명하게 반영했습니다.
- source_word: ἕτερον ἐπεσπάσαντο λογισμὸν ἀνοίας
  english_pob_choice: they took up another plan of folly
  chosen_korean: 또 다른 어리석음의 계획을 세웠으며
  alternatives_korean:
  - 또 다른 우둔한 계획을 품었으며
  - 또 다른 어리석은 계획을 마련했으며
  lexicon: LSJ
  rationale: λογισμός은 단순한 생각보다 의도된 계획의 뜻이 강해 ‘계획’을 택했고, ἀνοίας는 그 성격을 ‘어리석음의’로 옮겨 의미를 살렸습니다.
- source_word: οὓς ἱκετεύοντες ἐξέβαλον
  english_pob_choice: those whom they had driven out with pleading
  chosen_korean: 애원하며 내쫓았던 이들을
  alternatives_korean:
  - 간청하며 내보냈던 이들을
  - 간청 끝에 내쫓았던 이들을
  lexicon: LSJ
  rationale: ἱκετεύοντες는 간청/애원을 가리키므로 ‘애원하며’로, ἐξέβαλον은 실제로 쫓아냄을 드러내는 ‘내쫓다’로 옮겼습니다.
- source_word: τούτους ὡς φυγάδας ἐδίωκον
  english_pob_choice: these they pursued as fugitives
  chosen_korean: 이제는 도망자처럼 뒤쫓았습니다
  alternatives_korean:
  - 이들을 도망자처럼 추격했습니다
  - 이들을 도망자로 여기며 뒤쫓았습니다
  lexicon: LSJ
  rationale: φυγάδας의 ‘도망자/도망친 자’ 의미를 살려 역설을 분명히 드러내는 ‘도망자처럼’으로 옮겼습니다.
theological_decisions:
- issue: 이집트가 먼저 내보낸 뒤 다시 추격한 역전의 아이러니
  chosen_reading: 본문의 반전을 설명으로 풀어 쓰되, 출애굽 사건의 세부를 덧붙이지는 않았습니다.
  alternative_readings:
  - 홍해 추격을 명시해 역사 배경을 확장하는 방식
  - 앞 문맥을 요약해 더 설명적으로 번역하는 방식
  rationale: 헬라어는 ‘간청하며 내쫓음’과 ‘도망자처럼 뒤쫓음’의 대조만으로 충분히 역설을 전달하므로, 번역도 그 긴장을 직접 보존하는 쪽이 적절합니다.
  doctrine_reference: 번역 원칙 §§1, 3, 6
