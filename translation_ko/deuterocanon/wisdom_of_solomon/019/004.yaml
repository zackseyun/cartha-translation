  language: ko
  text: 사실 합당한 필연성이 그들을 이 끝으로 끌어갔고[a], 일어난 일들에 대한 망각을 그들에게 던져 넣어, 그들이 고통들에서 부족한 형벌을 미리 채우게 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 마땅히 받아야 할 필연성’ 혹은 ‘합당한 필연성’이다. 그리스어는 도덕적 합당함(ἀξία)과 강제/필연(ἀνάγκη)을 함께 담고 있습니다.
    reason: lexical_alternative
