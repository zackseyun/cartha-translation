base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/017.yaml
  text: And they also were struck with blindness[a], like those at the doors of the righteous man, when, wrapped in deep darkness[b], each one kept seeking the way through his own door.
  footnotes:
  - marker: a
    text: The allusion is to Genesis 19:11, where the men at Lot’s door were struck with blindness and wearied themselves trying to find the entrance.
    reason: cross_reference
  - marker: b
    text: Greek literally has wording about 'his own doors' and 'the way through'; the source text here is somewhat awkward, so the translation renders the probable sense of repeated groping for an entrance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 눈멀게 되는 벌을 함께 받았습니다[a]. 그것은 의로운 사람의 문들 앞에 있던 자들과 같았는데, 깊은 어둠에 둘러싸인 채 각자 자기 문의 통로를 찾아 나갔습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이는 창세기 19:11에서 롯의 문 앞에 있던 사람들이 눈멀게 된 사건을 가리킵니다.
    reason: cross_reference
  - marker: b
    text: 그리스어는 ‘그의 문들’과 ‘통로’에 대한 다소 어색한 표현을 담고 있어, 문맥상 반복적으로 더듬으며 출입구를 찾는 뜻으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήγησαν δὲ καὶ ἀορασίᾳ
  english_pob_choice: were struck with blindness
  chosen_korean: 눈멀게 되는 벌을 함께 받았습니다
  alternatives_korean:
  - 눈멀었습니다
  - 맹목의 타격을 받았습니다
  lexicon: LSJ
  rationale: ἐπλήγησαν의 ‘맞다/타격을 받다’와 ἀορασίᾳ의 ‘보지 못함’이 결합된 표현으로, 한국어에서는 자연스럽게 ‘눈멀게 되는 벌’로 옮겨 강한 수동적 재앙성을 살렸습니다.
- source_word: ἐπὶ ταῖς τοῦ δικαίου θύραις
  english_pob_choice: at the doors of the righteous man
  chosen_korean: 의로운 사람의 문들 앞에 있던 자들
  alternatives_korean:
  - 의로운 이의 문 앞에 있던 자들
  - 의로운 사람의 문에 있던 자들
  lexicon: LSJ
  rationale: τοῦ δικαίου를 고유명사로 풀지 않고 직역해 ‘의로운 사람’으로 유지했고, θύραι는 복수형을 살려 ‘문들’로 반영했습니다.
- source_word: ἀχανεῖ περιβληθέντες σκότει
  english_pob_choice: wrapped in deep darkness
  chosen_korean: 깊은 어둠에 둘러싸인 채
  alternatives_korean:
  - 깊은 어둠에 감싸인 채
  - 캄캄한 어둠에 둘러싸인 채
  lexicon: LSJ
  rationale: ἀχανής의 ‘끝없고 깊은, 아득한’ 뉘앙스를 한국어의 ‘깊은 어둠’으로 자연스럽게 옮겼고, περιβληθέντες는 ‘둘러싸인 채’로 상태성을 유지했습니다.
- source_word: ἕκαστος τῶν αὐτοῦ θυρῶν τὴν δίοδον ἐξῄει
  english_pob_choice: each one kept seeking the way through his own doors
  chosen_korean: 각자 자기 문의 통로를 찾아 나갔습니다
  alternatives_korean:
  - 각자 자기 문의 길을 계속 찾았습니다
  - 각자 자기 문을 통해 나가려 했습니다
  lexicon: LSJ
  rationale: δώδια의 의미 범위(통로, 지나감, 출구)를 고려해 ‘통로’를 선택했고, ἐξῄει의 반복적 시도를 한국어의 ‘찾아 나갔습니다’로 간결하게 반영했습니다.
theological_decisions:
- issue: 의로운 사람의 정체를 본문에 직접 밝힐지 여부
  chosen_reading: 본문은 ‘의로운 사람’으로 유지하고, 이름 ‘롯’은 넣지 않았습니다.
  alternative_readings:
  - 롯의 문들 앞에 있던 자들
  - 의로운 이(롯)의 문들 앞에 있던 자들
  rationale: 그리스어 본문은 τοῦ δικαίου를 사용하며 고유명사를 말하지 않으므로, 본문은 서술 수준을 유지하고 알루전은 주석으로만 열어 두는 편이 원문에 더 충실합니다.
  doctrine_reference: original-language primacy; avoid importing identification not explicit in the source
