base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/011.yaml
  text: Later they also saw a new generation of birds[a], when, driven by craving, they asked for delicacies of luxury[b];
  footnotes:
  - marker: a
    text: Or 'a new kind of birds.' The Greek νέαν γένεσιν ὀρνέων can emphasize either a fresh production/appearance or, less likely, a new sort of bird.
    reason: lexical_alternative
  - marker: b
    text: That is, they sought special foods for pleasure rather than mere nourishment; compare the wilderness craving tradition in Exodus 16 and Numbers 11.
    reason: cross_reference
translation:
  language: ko
  text: 나중에 그들은 새로 생겨난 새 떼도 보았는데, 욕심에 이끌려 사치스러운 별미를 요구했기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '새로운 종류의 새들'이라는 뜻일 수 있습니다. 그리스어 νέαν γένεσιν ὀρνέων은 새로 생겨난 것일 수도, 덜 가능하지만 새의 새로운 종류를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 곧, 배고픔 때문이 아니라 즐거움을 위한 특별한 음식을 찾았다는 뜻입니다. 출애굽기 16장과 민수기 11장의 광야 식욕 사건을 떠올리게 합니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἐφʼ ὑστέρῳ
  english_pob_choice: Later on
  chosen_korean: 나중에
  alternatives_korean:
  - 그 후에
  - 이후에
  - 뒤에
  lexicon: LSJ
  rationale: 시간의 뒤이음을 자연스러운 현대 한국어로 옮겼습니다. '나중에'는 POB의 'Later on'이 가진 서사적 진행을 무리 없이 반영합니다.
- source_word: νέαν γένεσιν ὀρνέων
  english_pob_choice: a new generation of birds
  chosen_korean: 새로 생겨난 새 떼
  alternatives_korean:
  - 새로운 새의 세대
  - 새의 새로운 종류
  - 새로 생긴 새 종류
  lexicon: LSJ
  rationale: γένεσις의 '생겨남/발생' 뉘앙스를 살리되, 한국어에서는 '새의 세대'보다 '새로 생겨난'이 더 자연스럽습니다. ὀρνέων은 특정 종보다 넓게 '새 떼'로 풀어, POB의 열린 선택지를 유지했습니다.
- source_word: ἐπιθυμίᾳ προαχθέντες
  english_pob_choice: driven by craving
  chosen_korean: 욕심에 이끌려
  alternatives_korean:
  - 갈망에 이끌려
  - 욕구에 사로잡혀
  - 정욕에 이끌려
  lexicon: LSJ
  rationale: 이 문맥의 ἐπιθυμία는 단순한 욕구보다 과도한 탐닉을 가리키므로 '욕심'이 적절합니다. '이끌려'는 προαχθέντες의 수동적 강제성을 반영합니다.
- source_word: ἐδέσματα τρυφῆς
  english_pob_choice: delicacies of luxury
  chosen_korean: 사치스러운 별미
  alternatives_korean:
  - 호사스러운 음식
  - 호화로운 진미
  - 사치의 별미
  lexicon: LSJ
  rationale: ἐδέσματα는 단순한 음식이 아니라 특별한 먹거리를 가리키므로 '별미'가 적절합니다. τρυφή는 사치와 향락의 뉘앙스를 가지므로 '사치스러운'으로 옮겨, 필요가 아닌 탐닉을 위한 음식임을 드러냈습니다.
theological_decisions:
- issue: 광야에서의 음식 요구를 둘러싼 도덕적 평가
  chosen_reading: 본문의 비판적 뉘앙스를 살리되, 원문 이상으로 '정욕'이나 '탐식' 같은 과도한 도덕 규정을 덧붙이지 않았습니다.
  alternative_readings:
  - 더 중립적으로 옮겨 비판성을 약화시키는 읽기
  - '''정욕에 이끌려''처럼 더 강하게 비난하는 읽기'
  rationale: 그리스어는 욕망과 사치의 방향성을 분명히 하지만, 표현 자체가 가장 강한 도덕 단정까지 요구하지는 않습니다. 따라서 원문의 평가를 유지하되 과잉 해석은 피했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
