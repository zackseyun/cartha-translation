  naturalness: ‘새들이 새로 생겨나는 것도 보았습니다’는 현대 표준 한국어의 문장 흐름을 유지하면서 γένεσις의 발생·출현 의미를 자연스럽게 전달합니다. ‘광야 식욕 사건’은 한국어에서 다소 부자연스럽고 의미가 불명확하므로 ‘광야에서 음식을 탐낸 일’로 고치는 것이 좋습니다.
  terminology: ‘욕심에 이끌려’와 ‘사치스러운 별미’는 각각 ἐπιθυμίᾳ προαχθέντες 및 ἐδέσματα τρυφῆς의 평가적 뉘앙스를 무리 없이 반영합니다. ‘새로 생겨나는’은 γένεσις의 의미를 보존하며, 각주에서 ‘새의 새로운 종류’라는 가능한 대안을 유지합니다.
