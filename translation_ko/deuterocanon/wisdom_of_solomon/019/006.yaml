base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/006.yaml
  text: For the whole creation[a], in its own kind, was formed anew from above, serving your own commands, so that your children might be kept unharmed.
  footnotes:
  - marker: a
    text: Or 'was refashioned anew from the beginning.' The Greek ἄνωθεν can mean 'from above' or 'from the beginning,' and διετυποῦτο can suggest being reshaped or refashioned.
    reason: lexical_alternative
translation:
  language: ko
  text: 온 피조세계는 각기 제 종류대로 위로부터[a] 새로이 빚어졌으며, 주님의 명령들을 받들어 주님의 자녀들이 해를 입지 않고 보호받도록 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘처음부터’. 헬라어 ἄνωθεν은 ‘위로부터’ 또는 ‘처음부터’를 뜻할 수 있으며, διετυποῦτο는 ‘새로이 빚어지다’ 또는 ‘다시 짜이다’라는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅλη ἡ κτίσις
  english_pob_choice: the whole creation
  chosen_korean: 온갖 피조물
  alternatives_korean:
  - 온 세상 창조
  - 온 피조세계
  lexicon: LSJ
  rationale: ἡ κτίσις의 집합적·우주적 범위를 살리되, 한국어에서 자연스러운 총칭 표현으로 옮겼습니다.
- source_word: ἐν ἰδίῳ γένει
  english_pob_choice: in its own kind
  chosen_korean: 그 자체의 종류 안에서
  alternatives_korean:
  - 그 고유한 본성 안에서
  - 그 각기 고유한 부류 안에서
  lexicon: LSJ
  rationale: γένει는 ‘종류/부류’의 범주를 가리키므로, φύσις처럼 ‘본성’으로 밀어가지 않고 분류적 의미를 보존했습니다.
- source_word: πάλιν ἄνωθεν διετυποῦτο
  english_pob_choice: was formed anew from above
  chosen_korean: 다시 위로부터 형성되었고
  alternatives_korean:
  - 다시 처음부터 형성되었고
  - 위로부터 새롭게 짜였고
  lexicon: LSJ
  rationale: ἄνωθεν의 ‘위로부터/처음부터’라는 중의성을 살리면서, 지혜서 문맥의 신적 기원과 재형성의 의미를 자연스럽게 드러냈습니다.
- source_word: ὑπηρετοῦσα ταῖς ἰδίαις ἐπιταγαῖς
  english_pob_choice: serving your own commands
  chosen_korean: 주님의 명령들을 섬겨서
  alternatives_korean:
  - 주님의 명령에 복종하여
  - 당신의 명령들을 수행하여
  lexicon: LSJ
  rationale: ὑπηρετοῦσα는 단순히 ‘복종하다’보다 ‘섬기다/시중들다’의 능동적 봉사감을 가지므로 이를 반영했습니다.
- source_word: οἱ σοὶ παῖδες
  english_pob_choice: your children
  chosen_korean: 당신의 자녀들
  alternatives_korean:
  - 당신의 아이들
  - 당신의 자식들
  lexicon: LSJ
  rationale: 하나님의 백성을 가리키는 친자 관계를 살리되, 남성 중심의 ‘아들들’보다 포괄적인 ‘자녀들’이 적절합니다.
theological_decisions:
- issue: ἄνωθεν의 방향성(‘위로부터’)과 시간성(‘처음부터’)을 어떻게 처리할지
  chosen_reading: 본문에는 ‘위로부터’를 두어 신적 기원과 하향식 질서를 드러내고, 다른 가능성은 각주로 보존합니다.
  alternative_readings:
  - 처음부터
  - 새롭게
  rationale: 이 절은 창조가 하나님의 명령 아래 재구성되는 장면이므로, ‘위로부터’가 문맥의 신학적 방향성을 가장 잘 드러냅니다. 다만 헬라어의 시간적 뉘앙스도 배제하지 않기 위해 대안 독법은 주석으로 남깁니다.
  doctrine_reference: DOCTRINE.md §3 (의도적으로 해소하지 말고 번역에서 긴장 보존)
- issue: 피조물이 ‘명령들’을 섬긴다는 표현의 능동성
  chosen_reading: ‘섬겨서’로 옮겨 창조가 단지 기계적으로 조정되는 것이 아니라 하나님의 질서에 봉사하는 것으로 표현했습니다.
  alternative_readings:
  - 복종하여
  - 따라서
  rationale: 본 절은 우주적 창조 질서가 하나님의 보호 목적을 위해 작동함을 강조하므로, 봉사적·종속적 의미를 함께 담는 표현이 적절합니다.
  doctrine_reference: DOCTRINE.md §3 (창조-섭리의 질서 보존)
