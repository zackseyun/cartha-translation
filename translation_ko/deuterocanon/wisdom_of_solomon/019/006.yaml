  source_fidelity: 개정이 필요합니다. κτίσις는 여기서 개별 피조물들의 총칭보다는 창조된 질서 전체를 가리키므로 ‘온갖 피조물’보다 ‘온 피조세계’가 적절합니다. ἐν ἰδίῳ γένει는 범주적 구별을 보존하여 ‘각기 제 종류대로’로 옮길 수 있습니다. πάλιν ἄνωθεν의 ‘위로부터’는 본문에 남기고, ‘처음부터’라는 가능한 시간적 의미는 각주에 보존합니다. 마지막 ἵνα절은 자녀들이 보호받는 목적을 나타내므로, 피조세계가 직접 ‘해를 입지 않도록 하였다’고 하기보다 수동적 보호를 드러내야 합니다.
  naturalness: 초안의 ‘그 자체의 종류 안에서’와 ‘명령들을 섬겨서’는 한국어에서 다소 직역투입니다. ‘각기 제 종류대로’, ‘명령들을 받들어’가 현대 표준어 성서 문체에서 더 자연스럽습니다. 또한 하나님을 ‘주님’과 ‘당신’으로 혼용하지 않고 ‘주님의’로 통일하는 편이 자연스럽고 공경의 격식에 맞습니다.
  terminology: ‘피조세계’는 κτίσις의 우주적·집합적 범위를 잘 나타냅니다. ‘주님의 자녀들’은 οἱ σοὶ παῖδες의 포괄적 친자 관계를 보존합니다. ‘명령들을 받들어’는 ὑπηρετοῦσα의 섬김·수행의 의미를 한국어답게 전달하며, 특정 교리적 해석을 더하지 않습니다.
