theological_decisions:
- issue: βασκανία의 의미 범위
  chosen_reading: ‘마력’으로 옮겨, 악이 사람을 사로잡고 인식을 흐리는 해로운 영향력을 드러냈습니다.
  alternative_readings:
  - 시기심
  - 악한 눈
  - 질투
  rationale: 본문의 초점은 단순한 감정 상태보다 악이 선한 것을 가리게 만드는 왜곡력에 있습니다. ‘마력’은 이 부정적 영향의 성격을 현대 독자가 이해하기 쉽게 유지합니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: τὰ καλά의 범위
  chosen_reading: ‘좋은 것’으로 옮겨 도덕적 의미를 중심에 두되, καλά의 미적·고귀한 뉘앙스를 배제하지 않았습니다.
  alternative_readings:
  - 아름다운 것
  - 고귀한 것
  rationale: 이 절은 윤리적 타락과 인식의 어둠을 대조하므로, 넓은 의미의 ‘좋은 것’이 본문의 경고를 가장 안정적으로 전달합니다.
  doctrine_reference: Translation philosophy §1, §6
