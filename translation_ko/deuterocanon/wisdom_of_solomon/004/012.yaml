  doctrine_reference: Translation philosophy §1, §6
- issue: τὰ καλά의 범위
  chosen_reading: ‘좋은 것’으로 옮겨 도덕적 의미를 중심에 두되, καλά의 미적·고귀한 뉘앙스를 배제하지 않았습니다.
  alternative_readings:
