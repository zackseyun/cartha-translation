  text: For the bewitchment of wickedness darkens what is good[b][a], and the wandering of desire corrupts an innocent mind.
  footnotes:
  - marker: a
    text: Or 'envy of wickedness' or 'the evil eye of wickedness'; the Greek βασκανία can denote malign envy or harmful influence.
    reason: lexical_alternative
  - marker: b
    text: Or 'what is beautiful' or 'noble things'; the Greek τὰ καλά can include both moral and aesthetic goodness.
    reason: lexical_alternative
translation:
  language: ko
  text: 악의의 마력은 좋은 것을 어둡게 하고, 욕망의 방황은 순수한 마음을 타락시킵니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악의의 시기심’ 혹은 ‘악한 눈’; 그리스어 βασκανία는 해로운 시기심이나 해로운 영향력을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘아름다운 것’ 혹은 ‘고귀한 것’; 그리스어 τὰ καλά는 도덕적·심미적 선함을 함께 포함할 수 있습니다.
    reason: lexical_alternative
