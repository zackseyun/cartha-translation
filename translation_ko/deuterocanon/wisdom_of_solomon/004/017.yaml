revisions:
- from: 그러므로 그들은 지혜로운 사람의 끝을 보게 될 것이지만, 주께서 그에 관하여 무엇을 계획하셨는지는 이해하지 못할 것이며, 또 어떤 목적으로 그를 안전하게 하셨는지도 알지 못할 것입니다.[a][b]
  to: 그들은 지혜로운 사람의 끝[a]을 보게 될 것이나, 주께서 그에 관하여 무엇을 계획하셨는지, 또 무슨 목적으로 그를 안전하게 하셨는지[b] 깨닫지 못할 것입니다.
  rationale: ‘그러므로’를 삭제하여 γάρ의 설명적 연결을 왜곡하지 않도록 했습니다. 두 간접의문절을 그리스어의 병렬 구조에 맞추어 정리했으며, ‘끝’과 ‘안전하게 하셨다’의 의미 범위를 유지했습니다. 각 주석도 해당 어구에 직접 연결하고, b 주석이 εἰς τί의 명시적인 목적 표현을 부정하지 않도록 바로잡았습니다.
