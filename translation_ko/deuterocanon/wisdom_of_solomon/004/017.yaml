  lexicon: BDAG
  rationale: 하나님의 의도와 설계를 드러내는 동사로서, 현대 한국어에서 가장 분명한 ‘계획하다’로 옮겼습니다.
- source_word: ἠσφαλίσατο αὐτόν
  english_pob_choice: he made him secure
  chosen_korean: 그를 안전하게 하셨는지도
  alternatives_korean:
  - 그를 안전하게 지키셨는지도
  - 그를 보호하셨는지도
  - 그를 굳건히 하셨는지도
  lexicon: BDAG
  rationale: 동사가 암시하는 ‘안전하게 하다/안전하게 만들다’의 원인을 넓게 보존해, 육체적 보호로만 한정하지 않도록 했습니다.
theological_decisions:
- issue: ‘주께서 … ασφαλίζω’의 의미 범위
  chosen_reading: ‘그를 안전하게 하셨는지도’로 번역해, 하나님의 보전이 구체적으로 어떤 방식인지는 열어 두었습니다.
  alternative_readings:
  - 그를 보호하셨는지도
  - 그를 지키셨는지도
  rationale: 본문은 의인의 눈에 보이는 죽음과 하나님의 실제 보전 사이의 긴장을 유지합니다. 따라서 보호의 방식이나 범위를 지나치게 특정하지 않았습니다.
  doctrine_reference: Translation philosophy §3
