base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/017.yaml
  text: For they will see the end of the wise man[a], and will not understand what the Lord planned concerning him[b], or for what purpose he made him secure.
  footnotes:
  - marker: a
    text: Or 'the death of the wise man.' The Greek τελευτή can mean 'end' or 'death'; 'end' is retained in the main text to preserve the broader sense in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'to what end the Lord kept him safe' / 'protected him.' The Greek leaves the nature of this security implicit.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그들은 지혜로운 사람의 끝을 보게 될 것이지만, 주께서 그에 관하여 무엇을 계획하셨는지는 이해하지 못할 것이며, 또 어떤 목적으로 그를 안전하게 하셨는지도 알지 못할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지혜로운 사람의 죽음’. 그리스어 τελευτή는 ‘끝’ 또는 ‘죽음’을 뜻할 수 있으며, 문맥의 더 넓은 의미를 살리기 위해 본문에서는 ‘끝’을 유지합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주께서 그를 안전하게 지키신 목적이 무엇인지’ / ‘그를 보호하신 목적이 무엇인지’. 그리스어는 이러한 안전의 구체적 방식이나 목적을 분명히 밝히지 않습니다.
    reason: lexical_alternative
