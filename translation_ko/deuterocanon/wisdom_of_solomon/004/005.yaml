translation:
  language: ko
  text: 덜 다듬어진 가지들은 꺾여 나가고[a], 그 열매는 쓸모없어, 먹기에는 덜 익었고[b] 아무 데도 쓰이지 못합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘미성숙한 가지들’로 옮길 수 있습니다. 그리스어 형용사는 아직 완성되지 않은 상태를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘먹기에는 이르다’로 옮길 수 있습니다. 여기서는 열매의 이미지에 맞추어 ‘덜 익었고’가 가장 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: περικλασθήσονται
  english_pob_choice: will be broken off
  chosen_korean: 꺾여 나가고
  alternatives_korean:
  - 잘려 나가고
  - 부러져 나가고
  lexicon: LSJ
  rationale: 미래 수동의 결과를 한국어에서 자연스럽게 살리면서, 가지가 떨어져 나가는 이미지를 간결하게 전달합니다.
- source_word: κλῶνες ἀτέλεστοι
  english_pob_choice: unfinished branches
  chosen_korean: 덜 다듬어진 가지들
  alternatives_korean:
  - 미완성된 가지들
  - 미숙한 가지들
  - 완성되지 않은 가지들
  lexicon: LSJ
  rationale: ἀτέλεστοι는 ‘완성에 이르지 못한’ 뜻이므로, 식물 이미지에서는 ‘덜 다듬어진’이 자연스럽고 동시에 미완성의 감각을 보존합니다.
- source_word: ἄωρος εἰς βρῶσιν
  english_pob_choice: unripe for eating
  chosen_korean: 먹기에는 덜 익었고
  alternatives_korean:
  - 먹기에는 미숙하고
  - 먹을 만큼 익지 않았고
  lexicon: LSJ
  rationale: ἄωρος는 열매의 상태를 가리키는 말이므로 ‘덜 익었고’가 농업적 비유를 가장 직접적으로 옮깁니다.
- source_word: εἰς οὐδὲν ἐπιτήδειος
  english_pob_choice: fit for nothing
  chosen_korean: 아무 데도 쓰이지 못합니다
  alternatives_korean:
  - 아무 쓸모도 없습니다
  - 아무 데에도 적합하지 않습니다
  lexicon: LSJ
  rationale: ‘fit for nothing’의 강한 무용성을 살리되, 현대 한국어에서 지나치게 직역투가 되지 않도록 자연스럽게 옮겼습니다.
