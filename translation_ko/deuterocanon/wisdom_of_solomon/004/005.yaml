  rationale: 이 절 자체는 비유를 진술하므로, POB의 원문 대응 원칙에 따라 이미지를 보존하는 편이 저자의 의도를 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
