base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/006.yaml
  text: For children born from lawless unions are witnesses of their parents’ wickedness at their examination[a][b][c].
  footnotes:
  - marker: a
    text: Literally, 'from lawless beds,' a Greek euphemism for illicit sexual unions.
    reason: lexical_alternative
  - marker: b
    text: Or 'are witnesses against their parents of wickedness.'
    reason: alternative_reading
  - marker: c
    text: The phrase 'when they are examined' may also be understood more generally as 'under scrutiny,' and some may take the pronoun to refer to the parents rather than the children.
    reason: alternative_reading
translation:
  language: ko
  text: 불법한 잠자리에서 태어난 자녀들은 조사를 받을 때 그들의 부모의 사악함을 드러내는 증인이 됩니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘불법한 침상들에서’이며, 혼인 밖의 성적 결합을 가리키는 완곡어법입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 부모의 사악함을 불리하게 입증하는 증인들’로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: ‘조사를 받을 때’는 더 넓게 ‘조사 아래 있을 때’로도 이해할 수 있으며, αὐτῶν(‘그들의’)을 부모들을 가리키는 말로 보는 해석도 가능합니다.
    reason: alternative_reading
