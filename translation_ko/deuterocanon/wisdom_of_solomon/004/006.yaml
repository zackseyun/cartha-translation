base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/006.yaml
  text: For children born from lawless unions are witnesses of their parents’ wickedness at their examination[a][b][c].
  footnotes:
  - marker: a
    text: Literally, 'from lawless beds,' a Greek euphemism for illicit sexual unions.
    reason: lexical_alternative
  - marker: b
    text: Or 'are witnesses against their parents of wickedness.'
    reason: alternative_reading
  - marker: c
    text: The phrase 'when they are examined' may also be understood more generally as 'under scrutiny,' and some may take the pronoun to refer to the parents rather than the children.
    reason: alternative_reading
translation:
  language: ko
  text: 불법한 잠자리에서 태어난 자녀들은 심문받을 때 그들의 부모의 악함을 증언합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘불법한 침상들에서’이며, 혼인 밖의 성적 결합을 가리키는 완곡어법입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 부모를 거슬러 악함을 증언하는 자들’로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: ‘심문받을 때’는 더 넓게는 ‘조사 아래 있을 때’로 이해할 수 있으며, 대명사 αὐτῶν을 부모로 돌리는 해석도 가능합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνόμων ὕπνων
  english_pob_choice: lawless unions
  chosen_korean: 불법한 잠자리
  alternatives_korean:
  - 법 없는 결합
  - 불법한 결합
  - 불법한 침상
  lexicon: BDAG; LSJ
  rationale: ἄνομος와 ὕπνοι의 결합은 성적 결합을 완곡하게 가리키므로, 직역의 힘을 살리면서도 한국어에서 자연스러운 완곡 표현으로 옮겼습니다.
- source_word: τέκνα γεννώμενα
  english_pob_choice: children born
  chosen_korean: 태어난 자녀들
  alternatives_korean:
  - 나서진 자녀들
  - 태어나는 자녀들
  - 출생한 자녀들
  lexicon: BDAG
  rationale: 분사구는 그러한 관계에서 나온 자손을 가리키므로, 현재형보다 결과 상태가 드러나는 ‘태어난 자녀들’이 적절합니다.
- source_word: ἐξετασμῷ
  english_pob_choice: at their examination / when they are examined
  chosen_korean: 심문받을 때
  alternatives_korean:
  - 조사받을 때
  - 검사받을 때
  - 심사받을 때
  lexicon: LSJ
  rationale: ἐξετασμός는 단순 확인이 아니라 조사·심문·조리 있는 심사를 뜻하므로, 문맥의 법정적 성격을 살려 ‘심문받을 때’로 옮겼습니다.
- source_word: κατὰ γονέων
  english_pob_choice: of their parents’ / against their parents
  chosen_korean: 그들의 부모의
  alternatives_korean:
  - 그들의 부모를 향한
  - 그들의 부모에 대한
  - 부모를 거슬러
  lexicon: BDAG
  rationale: κατά+속격의 대항/대질 뉘앙스는 본문 흐름상 ‘부모의 악함을 증언한다’로 자연스럽게 드러나며, 영어 주석의 대항 의미는 본문 안에서 과도하게 명시하지 않았습니다.
theological_decisions:
- issue: ἄνομος와 ὕπνος의 완곡법을 한국어로 얼마나 직접적으로 드러낼지
  chosen_reading: ‘불법한 잠자리’로 옮겨 성적 부정의 의미와 완곡한 어조를 함께 보존했습니다.
  alternative_readings:
  - 불법한 결합
  - 불법한 침상
  - 불법한 성관계
  rationale: 원문은 노골적 표현이 아니라 완곡한 법정·도덕적 비판을 사용하므로, 한국어에서도 그 긴장을 유지하는 표현을 택했습니다.
  doctrine_reference: '번역 원칙: 원문의 도덕적 판정을 약화시키지 않으면서도 과도한 노골화를 피합니다.'
- issue: αὐτῶν의 지시 대상을 명시할지
  chosen_reading: ‘그들의 심문’처럼 모호하게 풀지 않고, 문맥상 자연스러운 ‘심문받을 때’로 처리했습니다.
  alternative_readings:
  - 그들이 심문받을 때
  - 그들의 부모가 심문받을 때
  - 심문 아래 있을 때
  rationale: 영어 POB가 남긴 모호성은 주석으로 보존되지만, 한국어 본문은 문맥상 가장 직접적인 독법을 담아야 하므로 과잉 설명을 피했습니다.
  doctrine_reference: 의미의 긴장을 해치지 않는 범위에서 본문 가독성을 유지합니다.
