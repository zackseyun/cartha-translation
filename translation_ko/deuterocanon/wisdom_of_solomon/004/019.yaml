review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 πρηνεῖς(엎어진/엎어져 있는)의 상태가 ‘엎드러뜨려’에 흡수되어 다소 불분명하고, ἐκ θεμελίων은 ‘그들의 기초에서’보다 ‘기초부터’로 옮기는 편이 원문의 철저한 흔들림을 더 정확히 드러냅니다.
  naturalness: 초안의 ‘그들의 기초에서 뒤흔들 것이며’는 현대 한국어로 다소 어색합니다. 또한 주어가 ‘시체가 되어 … 수치가 될 것입니다’라고 이어지는 표현은 가능하나, ‘치욕거리가 될 것입니다’가 ὕβρις의 공적 모욕·멸시의 뉘앙스를 더 자연스럽게 전달합니다.
  terminology: ‘불명예스러운 시체’는 πτῶμα ἄτιμον을 적절히 옮깁니다. 대안 각주의 ‘타락한 몸’은 πτῶμα의 ‘쓰러진/죽은 몸’이라는 뜻을 도덕적 ‘타락’으로 오해시킬 수 있으므로 수정이 필요합니다. 암시된 남성 단수 주어는 본문에서 ‘그가’로 보존하고, 관련 각주 표지는 해당 표현 바로 뒤에 두는 것이 적절합니다.
  issues:
  - severity: medium
    issue: ‘그들의 기초에서 뒤흔들 것이며’의 어색함과 의미 관계
    rationale: ἐκ θεμελίων은 ‘기초로부터/기초째’라는 철저한 전복의 표현입니다. ‘그들의 기초에서’는 한국어에서 부자연스럽고, 무엇을 흔드는지 अस्पष्ट해집니다. ‘그들을 기초부터 뒤흔드실’로 고치는 것이 자연스럽고 충실합니다.
  - severity: medium
    issue: πρηνεῖς의 상태 묘사가 충분히 드러나지 않음
    rationale: ἀφώνους πρηνεῖς는 ‘말 못 하고 엎어진 채’라는 병렬 상태를 나타냅니다. ‘엎드러뜨려 말 못하게 하고’는 원인·목적 관계처럼 읽힐 수 있으므로, 두 상태를 병렬로 명시하는 편이 안전합니다.
  - severity: low
    issue: 각주 a의 ‘타락한 몸’
    rationale: ‘타락한’은 윤리적·종교적 타락을 연상시킬 수 있으나 πτῶμα는 여기서 쓰러진 몸 또는 시체입니다. ‘쓰러진 몸’으로 바꾸어야 합니다.
  - severity: low
