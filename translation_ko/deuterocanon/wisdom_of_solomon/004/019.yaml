base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/019.yaml
  text: And after this they will become a dishonored corpse and a reproach among the dead forever[a]. For he will dash them down headlong and speechless, and shake them from their foundations; they will be laid waste to the uttermost, and they will be in pain[b], and their memory will perish.
  footnotes:
  - marker: a
    text: Or 'a dishonored fallen body'; the Greek πτῶμα can denote a fallen body/corpse, emphasizing the shame of their end.
    reason: lexical_alternative
  - marker: b
    text: The subject of 'he will dash' and 'shake' is implicit in Greek; in context it refers to God’s judgment, though the verse does not repeat the divine name.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그 뒤에 그들은 불명예스러운 시체가 되어 죽은 자들 가운데서 영원히 수치가 될 것입니다[a]. 그가 그들을 엎드러뜨려 말 못하게 하고, 그들의 기초에서 뒤흔들 것이며, 그들은 끝까지 황폐하게 되고, 고통 가운데 있을 것이며, 그들의 기억은 사라질 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불명예스러운 타락한 몸’. 그리스어 πτῶμα는 수치스러운 최후를 강조하는 ‘넘어진 몸/시체’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그가’의 주어는 그리스어에서 생략되어 있으며, 문맥상 하나님의 심판을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: πτῶμα ἄτιμον
  english_pob_choice: dishonored corpse
  chosen_korean: 불명예스러운 시체
  alternatives_korean:
  - 수치스러운 시체
  - 명예를 잃은 시체
  - 불명예스러운 몸
  lexicon: LSJ
  rationale: πτῶμα는 단순한 ‘넘어짐’이 아니라 여기서는 죽은 몸/시체를 가리키며, ἄτιμον은 그 결말의 수치를 강조하므로 두 요소를 함께 살린 ‘불명예스러운 시체’가 가장 자연스럽습니다.
- source_word: ὕβριν ἐν νεκροῖς διʼ αἰῶνος
  english_pob_choice: a reproach among the dead forever
  chosen_korean: 죽은 자들 가운데서 영원히 수치가 될 것입니다
  alternatives_korean:
  - 죽은 자들 가운데 영원한 수치가 될 것입니다
  - 죽은 자들 가운데서 영원한 조롱거리가 될 것입니다
  - 죽은 자들 가운데서 영원한 치욕이 될 것입니다
  lexicon: LSJ
  rationale: ὕβρις는 단순한 감정이 아니라 공개적 모욕·수치의 상태를 뜻하므로, ‘수치’로 옮겨 죽은 자들 가운데 있는 지속적 굴욕을 드러냈습니다.
- source_word: ῥήξει ... πρηνεῖς; καὶ σαλεύσει
  english_pob_choice: he will dash them down headlong ... and shake
  chosen_korean: 그가 그들을 엎드러뜨려 말 못하게 하고, 그들의 기초에서 뒤흔들 것이며
  alternatives_korean:
  - 그가 그들을 머리부터 내던져 말 못하게 하고, 그들의 기초에서 흔들 것이며
  - 그가 그들을 엎어뜨려 말문이 막히게 하고, 기초째 뒤흔들 것이며
  lexicon: LSJ
  rationale: ῥήξει와 πρηνεῖς는 폭력적으로 ‘엎드러뜨림/내던짐’의 이미지를, ἀφώνους는 ‘말 못하게 됨’을 나타내므로 이를 분리해 한국어로 선명하게 드러냈습니다.
- source_word: ἕως ἐσχάτου χερσωθήσονται
  english_pob_choice: they will be laid waste to the uttermost
  chosen_korean: 그들은 끝까지 황폐하게 되고
  alternatives_korean:
  - 그들은 완전히 황폐하게 되고
  - 그들은 지극히 황폐해지고
  - 그들은 철저히 황폐하게 되고
  lexicon: LSJ
  rationale: ἕως ἐσχάτου는 총체성과 극점을 나타내므로 ‘끝까지’로, χερσωθήσονται는 ‘황폐하게 되다’로 옮겨 파괴의 완결성을 살렸습니다.
- source_word: ἡ μνήμη αὐτῶν ἀπολεῖται
  english_pob_choice: their memory will perish
  chosen_korean: 그들의 기억은 사라질 것입니다
  alternatives_korean:
  - 그들의 기억은 없어질 것입니다
  - 그들에 대한 기억은 사라질 것입니다
  - 그들의 기억은 소멸될 것입니다
  lexicon: LSJ
  rationale: μνήμη는 ‘기억/기념’의 범위를 가지지만, 여기서는 그 사람들에 대한 기억이 지워지는 뜻이므로 간결하게 ‘그들의 기억’으로 옮겼습니다.
theological_decisions:
- issue: 암시된 심판 주체
  chosen_reading: 문맥상 하나님을 가리키지만, 본문에는 주체를 직접 이름하지 않고 ‘그가’로 유지했습니다.
  alternative_readings:
  - 하나님이 그들을 엎드러뜨려...
  - 심판이 그들을 엎드러뜨려...
  rationale: 그리스어는 단수 남성 주어를 암시하지만 여기서 이름을 반복하지 않으므로, 원문의 문법적 긴장을 보존하면서도 문맥적 심판 주체를 과도하게 명시하지 않았습니다.
  doctrine_reference: 원문 우선 원칙과 암시 주체 보존
- issue: πρηνεῖς의 이미지 처리
  chosen_reading: ‘headlong’를 단순한 방향 묘사로 줄이지 않고 ‘엎드러뜨려’로 폭력적 전도를 살렸습니다.
  alternative_readings:
  - 머리부터
  - 엎어져
  - 거꾸러져
  rationale: 이 표현은 단순 낙하가 아니라 심판에 의한 전복을 강조하므로, 한국어에서도 신체적·상징적 전복이 함께 들리도록 옮겼습니다.
  doctrine_reference: 심판 묘사의 강도 보존
