  to: 그리고 그 뒤에 그들은 불명예스러운 시체가 되고, 죽은 자들 가운데서 영원히 치욕거리가 될 것입니다[a]. 그가[b] 그들을 말 못 하고 엎어진 채 내던지시고, 그들을 기초부터 뒤흔드실 것이며, 그들은 끝까지 황폐해지고 고통 가운데 있을 것이며, 그들에 대한 기억은 사라질 것입니다.
