translation:
  language: ko
  text: 그때 의인은 자기를 괴롭힌 자들 앞에서 큰 담대함으로 서게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 단순히 ‘자기를 괴롭힌 자들 앞에서’로 옮길 수도 있습니다. 그리스어는 문자적으로 ‘자기를 괴롭힌 자들의 얼굴 앞에서’라고 하며, 직접 대면의 뜻을 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그런 다음
  - 그 후
  lexicon: LSJ
  rationale: 이전 심판 장면과 이어지는 시간적 순서를 자연스럽게 살리면서도 현대 한국어 문장 흐름에 맞췄습니다.
- source_word: στήσεται
