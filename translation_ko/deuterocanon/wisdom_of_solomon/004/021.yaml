  lexicon: LSJ
  rationale: 미래형의 ἵστημι를 과도하게 해석하지 않고, 공개적으로 ‘서다/서게 되다’라는 핵심 동작을 분명히 했습니다.
- source_word: ἐν παρρησίᾳ πολλῇ
  english_pob_choice: with great boldness
  chosen_korean: 큰 담대함으로
