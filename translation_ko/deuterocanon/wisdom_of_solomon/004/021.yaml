  - severity: medium
    issue: 각주의 대안 표기가 본문 표현과 중복됨
    rationale: 본문이 이미 ‘자기를 괴롭힌 자들 앞에서’인데 각주가 이를 ‘또는 단순히’라고 반복합니다. 원문의 πρόσωπον이 드러나는 ‘면전에서’ 또는 문자적 ‘얼굴 앞에서’를 대안으로 제시해야 합니다.
  revised_text: 그때 의인은 자기를 괴롭힌 자들 앞에서 큰 담대함으로 설 것입니다.[a]
