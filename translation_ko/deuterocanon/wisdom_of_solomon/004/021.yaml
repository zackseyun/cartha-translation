  - 면전에서
  - ~의 얼굴 앞에
  lexicon: LSJ
  rationale: 직역하면 ‘얼굴 앞에서’이지만, 한국어에서는 직접 대면과 정면 충돌의 뉘앙스를 ‘앞에서’가 가장 자연스럽게 전달합니다.
- source_word: τῶν θλιψάντων αὐτὸν
  english_pob_choice: those who afflicted him
  chosen_korean: 자기를 괴롭힌 자들
  alternatives_korean:
  - 그를 압제한 자들
  - 그를 괴롭혔던 이들
  - 그를 환난에 빠뜨린 자들
  lexicon: LSJ
  rationale: θλίβω의 폭넓은 ‘괴롭히다/압박하다/고통 주다’의 의미를 반영해, 경제적·정치적 압제에만 좁히지 않으면서도 문맥상의 적대성을 유지했습니다.
