  text: Then the righteous man will stand with great boldness before those who afflicted him[a].
  footnotes:
  - marker: a
    text: Or simply, 'before those who afflicted him.' The Greek literally says 'before the face of those who afflicted him,' preserving the sense of direct confrontation.
