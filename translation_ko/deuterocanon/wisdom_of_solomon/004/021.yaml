  naturalness: ‘그때 의인은 자기를 괴롭힌 자들 앞에서 큰 담대함으로 설 것입니다’는 현대 표준 한국어의 격식 있는 합쇼체로 자연스럽습니다. 기존 각주는 본문과 동일한 ‘앞에서’를 다시 대안으로 제시하여 기능적으로 부정확합니다.
  terminology: ‘의인’은 ὁ δίκαιος의 지혜문학적·대표적 단수 용례에 알맞고, ‘큰 담대함으로’는 ἐν παρρησίᾳ πολλῇ의 공개적이고 두려움 없는 확신을 적절히 보존합니다. ‘괴롭힌 자들’도 θλίβω의 폭넓은 적대적 고통 부과의 의미를 과도하게 한정하지 않습니다.
