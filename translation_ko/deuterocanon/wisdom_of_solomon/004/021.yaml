  - 아주 당당하게
  lexicon: LSJ
  rationale: παρρησία의 핵심인 두려움 없는 공개적 자신감을 살리되, 문맥상 ‘담대함’이 가장 자연스럽고 직결되는 표현입니다.
- source_word: κατὰ πρόσωπον
  english_pob_choice: before the face of
  chosen_korean: 앞에서
  alternatives_korean:
