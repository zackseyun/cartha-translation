translation:
  language: ko
  text: 그의 영혼은 주님께 기쁨이 되었기 때문에, 그분께서는 그를 악의 한가운데에서 서둘러 데려가셨습니다. 그러나 사람들은 보고도 깨닫지 못하고, 그러한 일을 마음에 두지도 않았습니다.[a]
  philosophy: optimal-equivalence
