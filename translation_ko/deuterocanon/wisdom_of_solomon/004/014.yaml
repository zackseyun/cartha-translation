    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρεστὴ ... Κυρίῳ
  english_pob_choice: pleasing to the Lord
  chosen_korean: 주님께 기쁨이 되었기 때문에
  alternatives_korean:
  - 주님께 기뻤기 때문에
  - 주님께 받아들여질 만했기 때문에
  lexicon: LSJ
  rationale: ἀρεστός는 ‘기쁘게 하다/마음에 들다’의 뜻이므로, 한국어에서는 관계적 수용을 드러내는 ‘기쁨이 되다’가 가장 자연스럽고 source-direct합니다.
- source_word: ἔσπευσεν
  english_pob_choice: he hastened him out of
  chosen_korean: 그분께서는 그를 ... 서둘러 데려가셨습니다
  alternatives_korean:
  - 그를 ... 급히 옮기셨습니다
  - 그를 ... 서둘러 빼내셨습니다
  lexicon: LSJ
  rationale: 동사는 ‘서두르다/재촉하다’의 속도를 강조하므로, 주체가 하나님이심을 드러내되 과도하게 풀지 않고 ‘서둘러 데려가셨습니다’로 옮겼습니다.
- source_word: ἐκ μέσου πονηρίας
  english_pob_choice: out of the midst of wickedness
  chosen_korean: 악의 한가운데에서
  alternatives_korean:
  - 악 가운데에서
  - 악한 것들 한가운데에서
  lexicon: LSJ
  rationale: ἐκ μέσου는 ‘한가운데에서/중심에서 밖으로’라는 공간적 이미지를 가지므로, 이를 살려 ‘한가운데에서’로 옮겼습니다. πονηρία는 이 문맥에서 도덕적 악/사악함을 가리킵니다.
- source_word: ἰδόντες καὶ μὴ νοήσαντες, μηδὲ θέντες ἐπὶ διανοίᾳ
  english_pob_choice: seeing and not understanding, nor taking such a thing to heart
  chosen_korean: 보고도 깨닫지 못하고, 그러한 일을 마음에 두지도 않았습니다
  alternatives_korean:
  - 보고도 이해하지 못하고, 그것을 마음에 새기지도 않았습니다
  - 보았으나 알아차리지 못하고, 마음에 두지도 않았습니다
  lexicon: LSJ
  rationale: 두 분사구는 ‘보았지만 이해하지 못함’과 ‘마음에 두지 않음’의 병렬 대비이므로, 한국어에서도 반대 구조를 유지해 의미와 수사를 함께 보존했습니다.
- source_word: λαοὶ
  english_pob_choice: the peoples
  chosen_korean: 사람들은
  alternatives_korean:
  - 백성들은
  - 여러 민족들은
  lexicon: LSJ
  rationale: 그리스어 복수형의 넓은 관찰자 집단을 드러내되, 현대 한국어에서는 문맥상 가장 자연스러운 일반 주어인 ‘사람들’로 처리했습니다.
theological_decisions:
- issue: 신적 행위의 주체와 의인 제거의 의미
  chosen_reading: 주님께서 의인의 영혼을 기뻐하시어 악의 영역에서 그를 서둘러 데려가셨다는 뜻으로 읽었습니다.
  alternative_readings:
  - 단순히 그의 죽음이 빨랐다는 서술로 읽는 방식
  - ‘주님’의 개입을 약화시켜 중립적으로 옮기는 방식
  rationale: 앞절의 ‘주님’과 본절의 문맥상, 조기 죽음은 우연이 아니라 하나님의 보호적 행위로 제시됩니다. 한국어에서도 그 신학적 인과를 살렸습니다.
  doctrine_reference: 'Wisdom literature theology: righteous early removal as divine mercy/protection.'
