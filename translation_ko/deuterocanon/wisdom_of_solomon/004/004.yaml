base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/004.yaml
  text: For even if it puts forth shoots for a time in its branches[a], standing insecurely it will be shaken by the wind[b], and by the force of the winds it will be uprooted.
  footnotes:
  - marker: a
    text: Or 'sprouts again' or 'buds for a season'; the Greek keeps the image of temporary plant growth.
    reason: lexical_alternative
  - marker: b
    text: The singular 'it' continues the plant metaphor from the previous verse rather than naming the referent explicitly.
    reason: cross_reference
translation:
  language: ko
  text: 비록 한동안 가지들 가운데서 싹을 내더라도[a], 서 있는 모습이 불안정하여 바람에 흔들릴 것이며[b], 바람들의 거센 힘에 뿌리째 뽑힐 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다시 싹트더라도’, ‘한동안 움트더라도’로 옮길 수 있습니다. 그리스어는 일시적인 식물 성장의 이미지를 유지합니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어의 단수형은 앞선 식물 비유를 이어가며, 여기서 특정 명사를 새로 덧붙이지 않습니다.
    reason: cross_reference
lexical_decisions:
- source_word: κἂν γὰρ
  english_pob_choice: For even if
  chosen_korean: 비록
  alternatives_korean:
  - 설령
  - 비록 ...일지라도
  lexicon: LSJ
  rationale: 양보 조건의 힘을 살리기 위해 ‘비록’으로 시작해 뒤 절의 결과를 자연스럽게 받게 했습니다.
- source_word: ἐν κλάδοις
  english_pob_choice: in its branches
  chosen_korean: 가지들 가운데서
  alternatives_korean:
  - 가지 안에서
  - 그 가지들 속에서
  lexicon: LSJ
  rationale: 그리스어는 가지라는 식물 이미지 안에서의 발생을 가리키므로, 한국어에서는 ‘가운데서’로 자연스럽게 풀되 불필요한 소유격은 피했습니다.
- source_word: ἀναθάλῃ
  english_pob_choice: puts forth shoots
  chosen_korean: 싹을 내더라도
  alternatives_korean:
  - 싹을 틔우더라도
  - 새싹을 내더라도
  - 다시 움트더라도
  lexicon: LSJ
  rationale: 일시적 식물 성장 이미지를 살리면서도 현대 한국어에서 자연스러운 동사구로 옮겼습니다.
- source_word: ἐπισφαλῶς βεβηκότα
  english_pob_choice: standing insecurely
  chosen_korean: 서 있는 모습이 불안정하여
  alternatives_korean:
  - 불안정하게 서서
  - 위태롭게 서서
  lexicon: LSJ
  rationale: 부사와 분사 결합이 표현하는 ‘불안정한 서 있음’을 한국어 문장으로 명료하게 드러냈습니다.
- source_word: ὑπὸ βίας ἀνέμων
  english_pob_choice: by the force of the winds
  chosen_korean: 바람들의 거센 힘에
  alternatives_korean:
  - 바람의 거센 힘에
  - 거센 바람들의 힘으로
  lexicon: LSJ
  rationale: βία의 ‘힘/강제력’ 뉘앙스를 살려 단순한 ‘세찬 바람’보다 힘의 작용을 더 직접적으로 드러냈습니다.
theological_decisions:
- issue: 대상 지시어의 명시 여부와 식물 비유의 유지
  chosen_reading: 이 절의 주어를 명시적으로 ‘그 아이/그 자손’으로 바꾸지 않고, 식물 비유를 그대로 이어가도록 번역했습니다.
  alternative_readings:
  - 비록 그 아이가 한동안 가지들 가운데서 싹을 내더라도
  - 비록 그 자손이 한동안 가지들 가운데서 싹을 내더라도
  rationale: 그리스어는 이 절에서 식물적 동사와 분사를 유지하며 앞뒤 문맥의 비유를 이어가므로, 독자가 문맥 속 비유를 그대로 따라가도록 했습니다.
  doctrine_reference: 원문 우선 원칙; 본문이 제공하는 비유적 긴장을 보존
