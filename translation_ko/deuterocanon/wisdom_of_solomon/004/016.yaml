base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/016.yaml
  text: But the righteous one[a], though dead, will condemn the living ungodly[b]; and youth brought to completion quickly will condemn the many-year old age of the unrighteous.
  footnotes:
  - marker: a
    text: Or, 'having died will condemn' or 'after dying will condemn.' The Greek participle can be rendered more literally, but the main text expresses the sense in natural English.
    reason: lexical_alternative
  - marker: b
    text: Or, 'youth made perfect quickly.' The Greek can be rendered with 'made perfect,' but the main text uses 'brought to completion' to preserve the idea without overloading the phrase in modern English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 의인은 죽었어도 살아 있는 불경한 자들을 정죄할 것이며, 또한 속히 완성된 젊음은 불의한 자의 여러 해 된 노년을 정죄할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죽은 뒤에도 정죄할 것입니다’, ‘죽어서 정죄할 것입니다’. 그리스어 분사는 문맥상 양보적 의미를 담을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘속히 완성된 젊음’. 여기서 τελεσθεῖσα는 ‘완성되다’의 의미를 지니며, ‘성숙하다’보다 종결감이 더 분명합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: κατακρινεῖ
  english_pob_choice: will condemn
  chosen_korean: 정죄할 것입니다
  alternatives_korean:
  - 판결할 것입니다
  - 유죄로 선고할 것입니다
  lexicon: BDAG
  rationale: 미래형 κατακρίνω의 핵심은 단순 판단보다 ‘정죄/유죄 선고’에 가깝기 때문에, 한국어에서는 법정적 의미가 분명한 ‘정죄하다’가 가장 직접적입니다.
- source_word: δίκαιος
  english_pob_choice: the righteous one
  chosen_korean: 의인
  alternatives_korean:
  - 의로운 사람
  - 의로운 자
  lexicon: BDAG
  rationale: 단수 형용사적 명사 용법이므로 ‘의인’이 간결하고, 인물 지칭을 자연스럽게 살립니다.
- source_word: καμὼν
  english_pob_choice: though dead
  chosen_korean: 죽었어도
  alternatives_korean:
  - 죽은 뒤에도
  - 죽은 상태로도
  lexicon: BDAG
  rationale: 문맥상 이른 죽음에도 불구하고라는 역접이 핵심이므로, 한국어에서는 ‘죽었어도’가 원문의 양보적 뉘앙스를 가장 자연스럽게 드러냅니다.
- source_word: νεότης τελεσθεῖσα ταχέως
  english_pob_choice: youth brought to completion quickly
  chosen_korean: 속히 완성된 젊음
  alternatives_korean:
  - 속히 완성된 청춘
  - 빨리 성숙한 젊음
  lexicon: LSJ; BDAG
  rationale: τελεσθεῖσα는 ‘완성되다/이뤄지다’의 종결감을 가지므로, ‘성숙’보다 더 중립적인 ‘완성’이 원문의 teleological 뉘앙스를 보존합니다.
- source_word: πολυετὲς γῆρας ἀδίκου
  english_pob_choice: the many-year old age of the unrighteous
  chosen_korean: 불의한 자의 여러 해 된 노년
  alternatives_korean:
  - 불의한 자의 오래된 노년
  - 불의한 자의 장수한 노년
  lexicon: LSJ; BDAG
  rationale: πολυετές는 문자적으로 ‘여러 해 된’이므로, 노년의 길이를 강조하는 표현을 살리기 위해 직역에 가까운 한국어를 택했습니다.
theological_decisions:
- issue: 같은 절의 두 절이 모두 ‘정죄하다’로 반복되는 평행구문 처리
  chosen_reading: 두 절 모두 ‘정죄할 것입니다’로 반복하여 원문의 평행과 강조를 보존했습니다.
  alternative_readings:
  - 둘째 절을 ‘드러낼 것입니다’나 ‘심판할 것입니다’로 완화함
  rationale: 그리스어는 같은 동사 κατακρινεῖ를 반복하므로, 한국어에서도 반복을 유지해야 의인의 죽음과 젊음의 완성이 불의한 삶을 판결하는 역설적 강조가 살아납니다.
  doctrine_reference: 원문 평행법 보존; 수사적 강조를 희석하지 않음
