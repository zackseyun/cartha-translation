    rationale: ἡλικία γήρως의 그리스어적 강조를 기계적으로 옮긴 표현으로 현대 한국어에서 불명확합니다. 문맥은 흠 없는 삶이 참된 노년임을 말하므로 ‘곧 노년입니다’가 자연스럽고 의미상 충실합니다.
