  rationale: 영어 본문이 'men'으로 좁혀져 있지만, 한국어에서는 성별 고정 느낌을 줄이면서도 일반적 인류를 가리키는 표현으로 '사람에게'를 사용했습니다.
- source_word: βίος ἀκηλίδωτος
  english_pob_choice: an unblemished life
  chosen_korean: 흠 없는 삶
  alternatives_korean:
  - 티 없는 삶
  - 흠잡을 데 없는 삶
  - 점 없는 삶
  lexicon: 일반 어휘
  rationale: '''ἀκηλίδωτος''의 ''얼룩/점이 없는'' 의미를 자연스러운 윤리적 표현으로 옮겨, 도덕적 흠결이 없는 삶이라는 뜻을 살렸습니다.'
- source_word: ἡλικία γήρως
  english_pob_choice: the age of old age
  chosen_korean: 늙음의 나이
  alternatives_korean:
  - 노년의 때
  - 늙은 나이
  - 노쇠의 시기
  lexicon: 일반 어휘
  rationale: 원문의 반복적·강조적 표현을 살리기 위해 다소 낯설더라도 '늙음의 나이'로 옮겨, 노년의 단계 자체를 강조했습니다.
theological_decisions:
- issue: 성별 일반화 표현의 처리
  chosen_reading: '''men''을 한국어에서 성별 배제 없이 일반 인간을 가리키는 ''사람에게''로 옮겼습니다.'
  alternative_readings:
  - '''남자에게'''
  - '''사람들 가운데'''
  rationale: 지혜문학의 일반 격언 형식에서 성별이 아니라 인간 일반을 말하는 취지로 읽히므로, 현대 한국어 독자가 오해하지 않도록 일반화했습니다.
  doctrine_reference: 성경 문맥의 보편적 인간 적용
