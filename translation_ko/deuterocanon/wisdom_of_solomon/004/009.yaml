  - 깨달음
  - 슬기
  lexicon: 일반 어휘
  rationale: 문맥상 노년의 외적 표지가 단순한 지식이 아니라 삶을 분별하는 지혜를 뜻하므로 '지혜'가 가장 직접적입니다.
- source_word: ἀνθρώποις
  english_pob_choice: men
