  source_fidelity: 핵심 의미는 대체로 보존되어 있으나, συλλογισμῷ는 단순히 ‘생각 속에서’라기보다 죄를 헤아리고 따져 보는 숙고를 가리킵니다. 또한 ἐλέγξει는 여기서 행위가 당사자를 공개적으로 드러내고 유죄를 입증하는 뜻이므로 ‘고발하다’보다 ‘유죄로 드러내다’가 더 정확합니다.
  naturalness: ‘자기 죄에 대한 생각 속에서 두려워하며 오고’는 현대 한국어에서 다소 직역투이고 미래 시제의 호응도 약합니다. ‘두려움에 떨며 자기 죄를 헤아리고 올 것이며’로 고치면 자연스럽고 원문의 병렬 구조도 살아납니다.
  terminology: ἁμαρτήματα는 ‘죄’, ἀνομήματα는 법을 거스르는 행위라는 구별을 유지하여 ‘불법 행위’로 옮길 수 있습니다. δειλοί의 두려움·비겁함의 어조는 본문에서 ‘두려움에 떨며’로, 대안은 주석으로 보완하는 것이 적절합니다.
