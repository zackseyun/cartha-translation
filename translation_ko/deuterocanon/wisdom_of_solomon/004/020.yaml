  text: 그들은 두려움에 떨며[a] 자기 죄를 헤아리고 올 것이며, 자기들의 불법 행위가 그들을 면전에서[b] 유죄로 드러낼 것입니다.
  philosophy: optimal-equivalence
  footnotes:
