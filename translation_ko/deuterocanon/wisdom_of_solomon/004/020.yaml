translation:
  language: ko
  text: 그들은 자기 죄에 대한 생각 속에서 두려워하며 오고, 자기들의 불법 행위가 그들을 면전에서 고발할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘겁쟁이로’, ‘비겁하게’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들 맞은편에서’입니다. 뜻은 그들 자신의 불법 행위가 공개적으로, 면전에서 그들을 맞서며 고발한다는 것입니다.
    reason: lexical_alternative
