  rationale: δειλός는 단순한 감정보다 겁많음·비겁함의 성격을 띠지만, 한국어 본문에서는 과도한 평가어보다 상황적 두려움으로 표현해 문맥의 수치심과 공포를 함께 살렸습니다.
