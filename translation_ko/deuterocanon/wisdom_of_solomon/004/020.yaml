  text: They will come in fear[a], reasoning over their sins[b], and their lawless deeds will convict them to their face.
  footnotes:
  - marker: a
    text: Or 'fearful' or 'as cowards' for 'in cowardice.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'from opposite them'; the sense is that their own lawless deeds confront and convict them openly, face-to-face.
