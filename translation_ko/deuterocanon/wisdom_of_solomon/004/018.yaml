lexical_decisions:
- source_word: ὄψονται
  english_pob_choice: They will see
  chosen_korean: 그들은 보고
  alternatives_korean:
  - 그들은 볼 것이며
  - 그들은 보게 될 것입니다
  lexicon: LSJ
  rationale: 미래형의 단순한 지각 의미를 살리되, 한국어에서는 서술의 흐름상 ‘보고’가 자연스럽습니다.
- source_word: ἐξουδενήσουσιν
  english_pob_choice: will despise
  chosen_korean: 경멸할 것이나
  alternatives_korean:
  - 하찮게 여길 것이나
  - 대수롭지 않게 여길 것이나
  lexicon: LSJ
  rationale: 문맥상 의인에 대한 멸시와 업신여김을 가리키므로 ‘경멸하다’가 가장 सीधे적이고 간결합니다.
- source_word: ὁ κύριος
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주께서
  lexicon: LSJ
  rationale: 지혜문학에서 하나님을 가리키는 κύριος이므로 한국어 관례에 따라 ‘주님’으로 옮겼습니다.
- source_word: ἐκγελάσεται
  english_pob_choice: will laugh at them / will mock them
  chosen_korean: 비웃으실 것입니다
  alternatives_korean:
  - 웃어넘기실 것입니다
  - 조롱하실 것입니다
  lexicon: LSJ
  rationale: 동사의 단순한 ‘웃다’보다 조소·멸시의 뉘앙스가 강하므로, 한국어에서는 ‘비웃다’가 문맥의 역전과 냉소를 잘 드러냅니다.
theological_decisions:
- issue: 주님의 반응을 단순한 웃음으로 완화하지 않고 조소의 뉘앙스를 드러낼지 여부
  chosen_reading: ‘비웃으실 것입니다’로 번역해 심판적 역전과 멸시의 어조를 유지했습니다.
  alternative_readings:
  - ‘웃으실 것입니다’
  - ‘웃어넘기실 것입니다’
  rationale: ἐκγελάω는 단순 유쾌한 웃음이 아니라 상대를 깔보는 조소를 함의하므로, 본문이 주는 심판적 긴장을 유지하는 번역이 필요합니다.
  doctrine_reference: Wisdom 4:18의 문맥적 심판 이미지
