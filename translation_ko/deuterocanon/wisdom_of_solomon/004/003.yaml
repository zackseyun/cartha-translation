revisions:
- from: 그러나 불경한 자들의 많은 자손은 아무 유익이 없고, 사생아 같은 새순들에서는 깊은 뿌리를 내리지 못하며, 견고한 터도 놓지 못합니다.[a][b]
  to: 그러나 불경한 자들의 많은 자손은 아무 쓸모가 없으며, 사생의 새순들은[a] 깊이 뿌리내리지 못하고[b], 견고한 기초도 세우지 못합니다.
