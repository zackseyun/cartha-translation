base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/003.yaml
  text: But the many offspring of the ungodly will be of no use[a], and from bastard shoots they will not give a root into depth[b], nor will they set a firm foundation.
  footnotes:
  - marker: a
    text: Or 'illegitimate offshoots' or 'spurious grafts.' The Greek uses a harsh term within a horticultural metaphor.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'will not give a root into depth'; that is, they will not put down deep roots.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 불경한 자들의 많은 자손은 아무 쓸모가 없으며, 사생의 새순들은[a] 깊이 뿌리내리지 못하고[b], 견고한 기초도 세우지 못합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘부정한 접순들’로 옮길 수 있습니다. 그리스어는 원예 비유 안에서 출생의 정통성 결여를 뜻하는 거친 표현을 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘깊이로 뿌리를 내지 못할 것이다’입니다. 곧 깊이 뿌리내리지 못한다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολύγονον ... πλῆθος
  english_pob_choice: the many offspring
  chosen_korean: 많은 자손
  alternatives_korean:
  - 수많은 자손
  - 번성한 자손
  lexicon: LSJ
  rationale: πλῆθος와 πολύγονον의 결합은 ‘자손이 많음’이라는 집합적 뜻을 전하므로, 자연스러운 합쇼체로 ‘많은 자손’이라 옮겼습니다.
- source_word: ἀσεβῶν
  english_pob_choice: of the ungodly
  chosen_korean: 불경한 자들
  alternatives_korean:
  - 경건하지 않은 자들
  - 불신한 자들
  lexicon: LSJ
  rationale: ἀσεβής는 단순한 도덕성보다 하나님을 향한 불경함을 가리키므로, ‘불경한 자들’이 그 종교적 뉘앙스를 가장 직접적으로 살립니다.
- source_word: ἐκ νόθων μοσχευμάτων
  english_pob_choice: from bastard shoots
  chosen_korean: 사생아 같은 새순들
  alternatives_korean:
  - 서출 같은 새순들
  - 불법한 접순들
  lexicon: LSJ
  rationale: νόθος의 거친 평가를 약화하지 않으면서도, 식물 은유를 살리기 위해 직역적이되 한국어에서 덜 낯선 ‘사생아 같은 새순들’로 옮겼습니다.
- source_word: οὐ δώσει ῥίζαν εἰς βάθος
  english_pob_choice: they will not give a root into depth
  chosen_korean: 깊은 뿌리를 내리지 못하며
  alternatives_korean:
  - 깊이 뿌리를 내리지 못하며
  - 깊은 데로 뿌리를 내리지 못하며
  lexicon: LSJ
  rationale: 문자적으로는 ‘깊이로 뿌리를 주지/내지 못하다’에 가깝지만, 한국어 관용에 맞게 ‘깊은 뿌리를 내리지 못하며’로 옮겨 동일한 이미지와 결과를 전달했습니다.
- source_word: οὐδὲ ἀσφαλῆ βάσιν ἐδράσει
  english_pob_choice: nor will they set a firm foundation
  chosen_korean: 견고한 터도 놓지 못합니다
  alternatives_korean:
  - 견고한 기초도 세우지 못합니다
  - 안전한 기반도 놓지 못합니다
  lexicon: LSJ
  rationale: βάσις는 ‘기초/터’의 뜻이므로, 식물 은유와 어울리고 현대 한국어에서도 자연스러운 ‘견고한 터’로 옮겼습니다.
theological_decisions:
- issue: νόθων의 강한 사회적·도덕적 표현 유지 여부
  chosen_reading: ‘사생아 같은’으로 강도를 살리되 식물 은유 안에 묶어 직설적 비하로만 읽히지 않게 했습니다.
  alternative_readings:
  - ‘서출 같은’으로 완화
  - ‘불법한’으로 중성화
  rationale: 원문은 horticultural metaphor 안에서 거친 평가어를 사용하므로, POB의 ‘bastard shoots’에 맞춰 완화하지 않는 방향을 택했습니다.
  doctrine_reference: Translation philosophy §1, §6
