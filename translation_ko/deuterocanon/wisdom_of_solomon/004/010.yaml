translation:
  language: ko
  text: 하나님께 기쁨이 되도록 되어 사랑을 받았고, 죄인들 가운데 살면서 옮겨졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 제거되었다’나 ‘그는 옮겨졌다’일 수 있습니다. 그리스어는 조기 죽음, 부패한 환경으로부터의 신적 제거, 또는 에녹 같은 취함 가운데 어느 쪽을 강조하는지 열어 둡니다.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐάρεστος τῷ θεῷ γενόμενος
  english_pob_choice: Having become pleasing to God
  chosen_korean: 하나님께 기쁨이 되도록 되어
  alternatives_korean:
  - 하나님 보시기에 기뻐 보이게 되어
  - 하나님께 기쁘신 존재가 되어
  lexicon: BDAG
  rationale: εὐάρεστος는 단순한 감정적 ‘좋아함’보다 하나님과의 관계 속에서 ‘기쁨이 되는/받아들여지는’ 상태를 뜻하므로, 결과 상태를 살려 합쇼체로 옮겼습니다.
- source_word: ἠγαπήθη
  english_pob_choice: was loved
  chosen_korean: 사랑을 받았고
  alternatives_korean:
  - 사랑받았고
  - 사랑을 입었고
  lexicon: BDAG
  rationale: 수동태의 직접성을 살리되 현대 한국어에서 자연스럽게 읽히도록 ‘사랑을 받다’로 옮겼습니다.
- source_word: ζῶν μεταξὺ ἁμαρτωλῶν
  english_pob_choice: while living among sinners
  chosen_korean: 죄인들 가운데 살면서
  alternatives_korean:
  - 죄인들 가운데서 살면서
  - 죄인들 한가운데 살면서
  lexicon: BDAG
  rationale: ζῶν의 동시성을 ‘살면서’로, μεταξὺ ἁμαρτωλῶν의 공간성을 ‘가운데’로 옮겨 문맥의 대비를 살렸습니다.
- source_word: μετετέθη
  english_pob_choice: he was taken away
  chosen_korean: 옮겨졌습니다
  alternatives_korean:
  - 데려가졌습니다
  - 취해졌습니다
  - 이동되었습니다
  lexicon: BDAG
  rationale: μετατίθημι 계열의 기본 의미인 ‘옮기다/이동시키다’를 살리면서도, 본문이 죽음만으로 확정하지 않고 신적 제거의 여지를 남기는 점을 반영해 ‘옮겨지다’로 번역했습니다.
theological_decisions:
- issue: 'μετετέθη의 의미 범위: 죽음, 제거, 혹은 에녹 같은 취함'
  chosen_reading: ‘옮겨졌습니다’로 번역해, 조기 죽음인지 신적 이동인지 확정하지 않았습니다.
  alternative_readings:
  - 죽임을 당했습니다
  - 제거되었습니다
  - 하늘로 옮겨졌습니다
  rationale: 지혜서 4:10의 문맥은 경건한 사람이 죄인들 가운데서 분리되는 신학적 긴장을 유지하므로, 본문이 열어 두는 모호성을 한국어에서도 보존했습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
