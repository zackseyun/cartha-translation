lexical_decisions:
- source_word: ἡρπάγη
  english_pob_choice: He was taken away
  chosen_korean: 데려가졌습니다
  alternatives_korean:
  - 빼앗기셨습니다
  - 끌려가셨습니다
  - 옮겨졌습니다
  lexicon: ἁρπάζω
  rationale: 수동형의 급작스러운 ‘끌어감/데려감’의 뉘앙스를 살리되, 한국어에서 자연스럽고 문맥에 맞는 중립적 수동 표현으로 옮겼습니다.
- source_word: μή κακία ἀλλάξῃ σύνεσιν αὐτοῦ
  english_pob_choice: lest evil change his understanding
  chosen_korean: 악이 그의 지혜를 바꾸지 못하게
  alternatives_korean:
  - 악이 그의 이해를 바꾸지 못하게
  - 악이 그의 분별을 바꾸지 못하게
  - 악이 그의 생각을 바꾸지 못하게
  lexicon: κακία / σύνεσις
  rationale: σύνεσις는 단순 지식보다 분별·이해력을 가리키므로, 문맥상 넓은 의미를 담을 수 있는 ‘지혜’를 택했습니다.
- source_word: ἢ δόλος ἀπατήσῃ ψυχὴν αὐτοῦ
  english_pob_choice: or deceit mislead his soul
  chosen_korean: 속임수가 그의 영혼을 미혹하지 못하게
  alternatives_korean:
  - 속임수가 그의 영혼을 속이지 못하게
  - 속임수가 그의 혼을 미혹하지 못하게
  - 속임수가 그의 생명을 미혹하지 못하게
  lexicon: δόλος / ἀπατάω / ψυχή
  rationale: δόλος는 ‘속임수’가 자연스럽고, ἀπατήσῃ는 단순 ‘속이다’보다 목표를 잘못 이끄는 ‘미혹하다’가 더 가깝습니다. ψυχή는 여기서 인격 전체를 가리키므로 ‘영혼’으로 옮겼습니다.
theological_decisions:
- issue: 수동 구문 ἡρπάγη의 의미 강도
  chosen_reading: ‘데려가졌습니다’로 옮겨, 하나님의 섭리 아래 갑작스럽게 거두어 가신다는 함의를 과도하게 해석하지 않고 보존했습니다.
  alternative_readings:
  - ‘빼앗기셨습니다’처럼 더 강한 박탈감을 주는 번역
  - ‘옮겨졌습니다’처럼 더 완화된 번역
  rationale: 문맥은 의인의 조기 죽음/보호를 암시하지만, 본문 자체는 원인을 명시하지 않으므로 수동의 사실성만 드러내는 것이 안전합니다.
  doctrine_reference: Wisdom of Solomon 4:10-14 문맥
- issue: σύνεσις와 ψυχή의 인간 이해
  chosen_reading: ‘지혜’와 ‘영혼’을 유지해, 단순한 인지 능력 이상의 도덕적·영적 전인성을 표현했습니다.
  alternative_readings:
  - ‘이해’와 ‘혼’으로 더 직역하는 방식
  - ‘분별’과 ‘생명’으로 의미를 좁히는 방식
  rationale: 지혜문학의 어휘는 인지, 도덕, 신앙적 차원을 함께 담는 경우가 많아, 한국어에서도 그 폭을 너무 좁히지 않는 것이 적절합니다.
  doctrine_reference: 지혜문학의 인간론
