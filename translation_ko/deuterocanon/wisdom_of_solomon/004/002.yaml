  rationale: 바로 앞 문맥의 의인화를 이어가므로, 한국어에서도 ‘그녀’로 유지해 문학적 장치를 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, preserve literary personification
- issue: ἐν τῷ αἰῶνι의 범위
  chosen_reading: 장구한 명예와 승리의 지속을 나타내는 표현으로 읽었습니다.
  alternative_readings:
  - 영원히
  - 이 시대 안에서
  rationale: 본문은 철학적 영원론을 정의하기보다 지속되는 공적 영광을 말하는 것으로 보이므로, 본문 의미를 과도하게 좁히거나 넓히지 않았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, preserve theological tension rather than resolve it
