translation:
  language: ko
  text: 그녀가 있을 때에는 사람들이 그녀를 본받고, 그녀가 떠난 뒤에는 그리워합니다. 그리고 그녀는 더럽혀지지 않은 상이 걸린 경기에서 이기고, 승리의 화관을 쓴 채 시대를 지나 개선 행진을 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영원히’. 그리스어 표현은 문자적으로는 ‘그 시대 안에서’이며, 지속되거나 영구한 명성을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παροῦσάν
  english_pob_choice: when she is present
  chosen_korean: 그녀가 있을 때에는
  alternatives_korean:
  - 그녀가 حاضر할 때
  - 그녀가 присутств할 때
  lexicon: LSJ
  rationale: παροῦσάν은 ‘현재함/있음’을 뜻하므로, 자연스러운 시간 부사절로 옮겨 παρουσία의 대조를 살렸습니다.
- source_word: μιμοῦνται
  english_pob_choice: they imitate
  chosen_korean: 사람들이 그녀를 본받고
  alternatives_korean:
  - 사람들이 그녀를 모방하고
  - 사람들이 그녀를 따라 하고
  lexicon: LSJ
  rationale: 단순 모방보다 인격적·도덕적 추종의 뉘앙스가 있어 ‘본받다’가 문맥에 가장 잘 맞습니다.
- source_word: ἐν τῷ αἰῶνι
  english_pob_choice: through the age
  chosen_korean: 영원한 세월 동안
  alternatives_korean:
  - 그 세대 동안
  - 그 시대를 지나
  lexicon: LSJ
  rationale: αἰών은 단순한 ‘시대’보다 지속되는 장구한 기간을 가리킬 수 있으므로, 영속적 명예의 이미지를 살리되 메타피지컬한 ‘영원’을 단정하지 않도록 옮겼습니다.
- source_word: στεφανηφοροῦσα
  english_pob_choice: wearing a victor’s wreath
  chosen_korean: 승리의 화관을 쓰고
  alternatives_korean:
  - 승리의 관을 쓰고
  - 면류관을 쓰고
  lexicon: LSJ
  rationale: στεφανηφορέω는 승자의 화관/관을 쓰는 뜻이므로, 경기 승리의 이미지를 살려 ‘승리의 화관’으로 번역했습니다.
- source_word: ἀμιάντων ἄθλων ἀγῶνα
  english_pob_choice: the contest of the undefiled prizes
  chosen_korean: 더럽혀지지 않은 상들의 경기에서 이겨
  alternatives_korean:
  - 더럽혀지지 않은 상을 위한 경기에서 이겨
  - 순결한 상들의 싸움에서 이겨
  lexicon: LSJ
  rationale: ἄθλων은 경기의 ‘상/상품’이고 ἀγῶνα는 ‘경기/경쟁’이므로, 두 명사를 함께 살려 ‘상들의 경기’로 옮겼습니다. ‘더럽혀지지 않은’은 moral purity의 형용사 ἀμίαςντων을 직역한 것입니다.
theological_decisions:
- issue: 여성 인칭의 지시 대상
  chosen_reading: 지혜/덕이 의인화된 문맥으로 보고 여성 인칭을 그대로 유지했습니다.
