  naturalness: ‘그녀가 있을 때에는/떠나면’과 합쇼체는 자연스럽습니다. 다만 마지막 절은 ‘상들의 경기’라는 명사 연쇄 때문에 매끄럽지 않습니다. ‘더럽혀지지 않은 상이 걸린 경기’로 풀면 경기의 상이라는 운동 경기 비유와 수식 관계가 자연스럽게 드러납니다.
