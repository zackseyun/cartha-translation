  rationale: γῆρας는 사람 자체보다 ‘늙은 상태/노년’ 자체를 가리키므로, 문맥의 격언성을 살려 ‘늙음’으로 옮겼습니다.
- source_word: τίμιον
  english_pob_choice: honorable
  chosen_korean: 있는 것
  alternatives_korean:
  - 존귀한 것
  - 귀한 것
  - 명예로운 것
  lexicon: LSJ
  rationale: 여기서는 노년의 가치를 직접 규정하기보다, 뒤의 부정절이 ‘무엇에 있지 않은가’를 밝히므로 한국어에서는 보어를 풀어 ‘있는 것’으로 처리해 문장의 대조를 자연스럽게 살렸습니다.
- source_word: οὐ τὸ πολύχρονον
  english_pob_choice: not because it is long-lived
  chosen_korean: 오래 산 데 있는 것이 아니며
  alternatives_korean:
  - 장수하기 때문이 아니며
  - 오래 지속된 데 있는 것이 아니며
  - 많은 세월을 산 데 있는 것이 아니며
  lexicon: LSJ
  rationale: πολύχρονον은 ‘많은 시간을 가진/오래 지속되는’ 뜻이므로, 노년의 존귀함이 단순한 장수에 있지 않음을 드러내도록 자연스러운 한국어로 옮겼습니다.
- source_word: ἀριθμῷ ἐτῶν
  english_pob_choice: by the number of years
  chosen_korean: 연수의 수로
  alternatives_korean:
  - 해의 수로
  - 세월의 수로
  - 년수로
  lexicon: LSJ
  rationale: ἀριθμῷ ἐτῶν은 ‘년들의 수/세는 수’라는 측정 기준을 가리키므로, ‘연수의 수로’라고 옮겨 수량 기준이라는 의미를 보존했습니다.
