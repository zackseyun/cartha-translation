  rationale: πολύχρονον은 ‘많은 시간을 가진/오래 지속되는’ 뜻이므로, 노년의 존귀함이 단순한 장수에 있지 않음을 드러내도록 자연스러운 한국어로 옮겼습니다.
- source_word: ἀριθμῷ ἐτῶν
  english_pob_choice: by the number of years
  chosen_korean: 연수의 수로
  alternatives_korean:
