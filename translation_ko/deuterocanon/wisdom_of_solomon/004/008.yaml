  terminology: γῆρας는 ‘노년’으로, τίμιον은 ‘존귀한 것’으로 옮겨 사람 자체가 아니라 노년의 상태와 그 가치에 관한 진술임을 보존했습니다. ‘존귀한’은 윤리적·사회적 존중의 뉘앙스를 무리 없이 전달합니다.
