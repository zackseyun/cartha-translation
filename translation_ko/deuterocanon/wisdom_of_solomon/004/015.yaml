  rationale: ἐπισκοπή는 방문, 돌봄, 감독, 개입까지 아우를 수 있어, POB가 'visitation'을 택한 투명성을 살리면서도 문맥의 호의적 의미를 드러내는 '방문하심'으로 옮겼습니다.
- source_word: ὁσίοις
