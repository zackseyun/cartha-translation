  alternative_readings:
  - 심판적 방문
  - 감독
  - 감찰
  rationale: 문맥에서 ἐπισκοπή는 앞의 은혜와 자비와 병렬되므로, 벌주는 방문보다 돌보고 개입하시는 하나님의 호의적 임재로 이해하는 것이 자연스럽습니다. 다만 단어 자체의 넓은 의미는 유지해 '방문하심'으로 처리했습니다.
