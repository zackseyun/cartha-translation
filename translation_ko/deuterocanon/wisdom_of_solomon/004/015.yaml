  rationale: ἔλεος는 자비/긍휼의 뜻이지만, 앞의 ἔν? not present; grace와 병렬되는 긍휼의 뉘앙스를 살려 현대 한국어에서 자연스러운 '자비'를 선택했습니다.
- source_word: ἐπισκοπή
  english_pob_choice: visitation
  chosen_korean: 방문하심
  alternatives_korean:
  - 방문
  - 돌보심
  - 감찰
  lexicon: BDAG
  rationale: ἐπισκοπή는 방문, 돌봄, 감독, 개입까지 아우를 수 있어, POB가 'visitation'을 택한 투명성을 살리면서도 문맥의 호의적 의미를 드러내는 '방문하심'으로 옮겼습니다.
- source_word: ὁσίοις
  english_pob_choice: holy ones
  chosen_korean: 거룩한 이들
  alternatives_korean:
  - 성도
  - 경건한 이들
  lexicon: BDAG
  rationale: ὅσιος는 '성도'보다 더 직접적으로 '거룩한/경건한' 사람들을 뜻하므로, 교회 용어로 고정하지 않고 원뜻이 보이도록 '거룩한 이들'로 번역했습니다.
theological_decisions:
- issue: ἐπισκοπή의 의미를 재난적 '심판적 방문'으로 좁힐지 여부
  chosen_reading: 은혜와 자비와 평행을 이루는 호의적 방문/돌보심
  alternative_readings:
  - 심판적 방문
  - 감독
  - 감찰
  rationale: 문맥에서 ἐπισκοπή는 앞의 은혜와 자비와 병렬되므로, 벌주는 방문보다 돌보고 개입하시는 하나님의 호의적 임재로 이해하는 것이 자연스럽습니다. 다만 단어 자체의 넓은 의미는 유지해 '방문하심'으로 처리했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.
