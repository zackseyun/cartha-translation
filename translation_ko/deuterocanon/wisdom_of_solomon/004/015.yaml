translation:
  language: ko
  text: 그분의 택하신 이들에게는 은혜와 자비가 있고, 그분의 거룩한 이들에게는 돌보심이 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘방문하심’, ‘감독’, ‘주의 깊은 보살핌’으로 옮길 수 있습니다. 그리스어 ἐπισκοπή는 하나님의 방문이나 살핌, 또는 점검을 뜻할 수 있습니다. 여기서는 은혜와 자비의 문맥상 호의로운 돌보심을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  english_pob_choice: grace
  chosen_korean: 은혜
  alternatives_korean:
