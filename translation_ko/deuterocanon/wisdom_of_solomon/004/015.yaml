  - 은총
  lexicon: BDAG
  rationale: χάρις는 하나님의 베푸심을 가리키는 표준적 용례이므로, POB의 'grace'에 맞춰 한국어에서도 신학적 무게를 살린 '은혜'로 옮겼습니다.
- source_word: ἔλεος
