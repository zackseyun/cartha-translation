  naturalness: Replacing '그의' with '그분의' and '선택받은 이들' with '택하신 이들' gives natural, reverent modern formal Korean. '돌보심이 있습니다' is substantially more idiomatic than '방문하심이 있습니다.'
  terminology: '''은혜,'' ''자비,'' ''택하신 이들,'' and ''거룩한 이들'' are accurate and avoid importing unnecessary ecclesiastical technicality. The footnote should identify ἐπισκοπή as potentially denoting visitation, oversight, or inspection and state that the immediate context favors benevolent care without excluding the broader lexical range.'
