  chosen_reading: ‘쉼 가운데’로 번역해 안식의 위로는 살리되, 사후 세계를 특정하는 표현은 추가하지 않습니다.
  alternative_readings:
  - 안식 가운데 있게 됩니다
  - 평안 가운데 있게 됩니다
  rationale: 헬라어 본문은 ‘쉼’의 상태를 말할 뿐 그 형이상학적 메커니즘을 규정하지 않으므로, 본문의 위로를 보존하면서도 신학적 긴장을 유지하는 번역이 적절합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
