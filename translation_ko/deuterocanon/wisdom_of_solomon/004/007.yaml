lexical_decisions:
- source_word: δίκαιος
  english_pob_choice: the righteous man
  chosen_korean: 의인
  alternatives_korean:
  - 의로운 사람
  - 의로운 이
  - 의로운 자
  lexicon: BDAG
  rationale: δίκαιος가 여기서는 단수 명사적으로 쓰여 한 사람을 가리키므로, 성별을 불필요하게 드러내는 ‘의로운 남자’보다 한국어 성서어법에 자연스러운 ‘의인’이 원문의 대표적 인물을 잘 살립니다.
- source_word: φθάσῃ τελευτῆσαι
  english_pob_choice: dies early
  chosen_korean: 때 이르게 죽게 되더라도
  alternatives_korean:
  - 일찍 죽더라도
  - 죽음에 이르게 되더라도
  - 죽게 되면
  lexicon: BDAG
  rationale: φθάσῃ + τελευτῆσαι는 단순한 ‘죽다’보다 ‘죽음에 미리 도달하다’, 곧 ‘때보다 일찍 죽다’라는 관용적 뜻이므로, 의미를 살려 ‘때 이르게 죽게 되더라도’로 옮겼습니다.
- source_word: ἐν ἀναπαύσει
  english_pob_choice: at rest
  chosen_korean: 쉼 가운데
  alternatives_korean:
  - 안식 가운데
  - 평안 가운데
  - 쉬는 가운데
  lexicon: BDAG
  rationale: ἐν ἀναπαύσει는 단지 상태를 말하므로, 후대 교리적 정교화를 덧붙이지 않고도 자연스럽게 읽히는 ‘쉼 가운데’가 원문의 평온한 톤을 보존합니다.
- source_word: ἔσται
  english_pob_choice: will be
  chosen_korean: 있게 됩니다
  alternatives_korean:
  - 될 것입니다
  - 있을 것입니다
  lexicon: BDAG
  rationale: 미래 직설법의 단순한 존재 서술이므로, 한국어에서는 ‘있게 됩니다’로 옮겨 문장의 상태성을 자연스럽게 전달했습니다.
theological_decisions:
- issue: ἐν ἀναπαύσει의 종말론적 함의를 한국어에서 얼마나 명시할 것인가
  chosen_reading: ‘쉼 가운데’로 번역해 안식의 위로는 살리되, 사후 세계를 특정하는 표현은 추가하지 않습니다.
  alternative_readings:
  - 안식 가운데 있게 됩니다
  - 평안 가운데 있게 됩니다
  rationale: 헬라어 본문은 ‘쉼’의 상태를 말할 뿐 그 형이상학적 메커니즘을 규정하지 않으므로, 본문의 위로를 보존하면서도 신학적 긴장을 유지하는 번역이 적절합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
