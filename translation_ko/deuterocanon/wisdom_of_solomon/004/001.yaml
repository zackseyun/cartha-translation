base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/001.yaml
  text: Better is childlessness with virtue[a], for immortality is in her memory[b], because she is known both by God and by men.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'for immortality is in her memory'—that is, in the memory of virtue. Some take the feminine pronoun to refer instead to childlessness or to the childless woman.
    reason: alternative_reading
  - marker: b
    text: Greek 'by men'; here the term means human beings generally.
    reason: lexical_alternative
translation:
  language: ko
  text: 덕을 지닌 자녀 없음[a]이 더 낫습니다. 덕의 기억 속에 불멸이 있기 때문입니다. 덕은 하나님과 사람들[b]에게 알려져 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘덕과 함께하는 자녀 없음’입니다. 이어지는 여성 단수 대명사는 가장 자연스럽게는 ‘덕’을 가리킵니다. 일부는 이를 의인화된 자녀 없음이나 자녀 없는 여성을 가리키는 것으로 봅니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어 ‘사람들’은 남녀를 포함한 일반 인간을 뜻합니다.
    reason: lexical_alternative
