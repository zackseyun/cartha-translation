base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/001.yaml
  text: Better is childlessness with virtue[a], for immortality is in her memory[b], because she is known both by God and by men.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'for immortality is in her memory'—that is, in the memory of virtue. Some take the feminine pronoun to refer instead to childlessness or to the childless woman.
    reason: alternative_reading
  - marker: b
    text: Greek 'by men'; here the term means human beings generally.
    reason: lexical_alternative
translation:
  language: ko
  text: 덕과 함께하는 자식 없음이 더 낫습니다. 그 기억 안에 불멸이 있기 때문이며, 하나님과 사람들 앞에서 알려져 있기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 관용적으로, ‘그 기억 안에 불멸이 있다’ — 곧 덕의 기억 안에 불멸이 있다는 뜻입니다. 일부는 여성 대명사가 자식 없음이나 자식 없는 여성을 가리킨다고 봅니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어는 ‘사람들 앞에서’입니다. 여기서는 일반 인류를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρείσσων
  english_pob_choice: Better is
  chosen_korean: 더 낫습니다
  alternatives_korean:
  - 더 좋습니다
  - 더 훌륭합니다
  lexicon: LSJ
  rationale: 비교 구문을 한국어 자연문으로 옮기되, 지혜문학의 격언적 판단을 살려 간명하게 표현했습니다.
- source_word: ἀτεκνία
  english_pob_choice: childlessness
  chosen_korean: 자식 없음
  alternatives_korean:
  - 무자녀
  - 불임
  lexicon: LSJ
  rationale: ἀτεκνία는 자녀가 없는 상태를 가리키므로, 생물학적 원인에 좁혀지는 ‘불임’보다 상태 자체를 드러내는 ‘자식 없음’이 소스에 더 가깝습니다.
- source_word: μετὰ ἀρετῆς
  english_pob_choice: with virtue
  chosen_korean: 덕과 함께하는
  alternatives_korean:
  - 덕을 지닌
  - 도덕적 탁월함과 함께하는
  lexicon: LSJ
  rationale: ἀρετή의 윤리적 의미를 살려 ‘덕’으로 옮기고, 비교의 동반 관계를 자연스럽게 보이도록 했습니다.
- source_word: ἐν μνήμῃ αὐτῆς
  english_pob_choice: in her memory
  chosen_korean: 그 기억 안에
  alternatives_korean:
  - 그녀의 기억 안에
  - 그 덕의 기억 안에
  lexicon: LSJ
  rationale: 영문 POB의 주석대로 대명사의 지시 대상은 덕(ἀρετή)로 보는 것이 가장 자연스럽습니다. 한국어에서는 그 대상을 직접 반복하지 않고도 ‘그 기억’으로 연결해 의미를 보존했습니다.
- source_word: παρὰ θεῷ ... καὶ παρὰ ἀνθρώποις
  english_pob_choice: both by God and by men
  chosen_korean: 하나님과 사람들 앞에서
  alternatives_korean:
  - 하나님과 사람들에게서
  - 하나님 앞과 사람들 앞에서
  lexicon: LSJ
  rationale: παρά + 여격은 단순한 행위자보다 ‘~의 시선/평가에서’의 뉘앙스를 띠므로, 인정받음의 의미를 살려 ‘앞에서’로 옮겼습니다. ἀνθρώποις는 일반 인간을 가리키므로 ‘사람들’이 적절합니다.
theological_decisions:
- issue: 여격구 ἐν μνήμῃ αὐτῆς의 대명사 지시 대상
  chosen_reading: ‘그’는 자식 없음이 아니라 덕(ἀρετή)을 가리킨다고 보았습니다.
  alternative_readings:
  - 자식 없음이 의인화된 것으로 볼 수 있습니다.
  - 자식 없는 여성을 암시적으로 가리킨다고 볼 수 있습니다.
  rationale: 가장 가까운 선행사는 ἀρετή이며, 문맥상 불멸과 기억은 덕의 지속성을 말합니다. 이렇게 해야 자식 없음 자체에 불멸을 돌리는 오해를 피하면서 본문의 긴장을 보존할 수 있습니다.
  doctrine_reference: 문맥 우선 원칙; 대명사 해석은 가장 직접적인 선행사에 근거해야 합니다.
