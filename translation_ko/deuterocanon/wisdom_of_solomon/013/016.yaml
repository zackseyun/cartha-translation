translation:
  language: ko
  text: 그러므로 그는 그것이 넘어지지 않도록 그것을 위하여 미리 조처하였습니다. 그것이 스스로 도움을 줄 수 없다는 것을 알고서 그렇게 한 것입니다. 그것은 형상이고 도움이 필요하기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우상’. 그리스어 εἰκών은 문자적으로 ‘형상’, ‘모습’, 또는 ‘이미지’를 뜻하지만, 여기서는 만들어진 숭배 대상을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μὲν οὖν μὴ καταπέσῃ
  english_pob_choice: So then, lest it fall
  chosen_korean: 그러므로 그것이 넘어지지 않도록
