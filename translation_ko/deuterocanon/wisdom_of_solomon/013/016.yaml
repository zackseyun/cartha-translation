  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/016.yaml
  text: So then[a], lest it fall, he made provision for it, knowing that it is unable to help itself; for it is an image and has need of help.
  footnotes:
  - marker: a
    text: Or 'idol' for 'image'; the Greek word is literally 'image' or 'likeness,' though the context is a crafted object of worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그것이 넘어지지 않도록 미리 대비하였으니, 그것이 스스로를 도울 수 없음을 알았기 때문입니다. 그것은 이미지이며 도움을 필요로 하기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우상’. 그리스어 단어는 문자적으로는 ‘이미지’ 또는 ‘형상’이지만, 문맥상 만들어진 예배 대상을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μὲν οὖν μὴ καταπέσῃ
  english_pob_choice: So then, lest it fall
  chosen_korean: 그러므로 그것이 넘어지지 않도록
  alternatives_korean:
  - 그러므로 그것이 쓰러지지 않도록
  - 그러므로 그것이 넘어질까 하여
  lexicon: LSJ
  rationale: ἵνα μή는 목적/방지의 뜻을 나타내므로, 한국어에서는 자연스러운 방지 표현으로 옮겼습니다.
- source_word: προενόησεν
  english_pob_choice: he made provision for it
  chosen_korean: 미리 대비하였으니
  alternatives_korean:
  - 미리 마련하였으니
  - 앞서 배려하였으니
  lexicon: LSJ
  rationale: 이 동사는 단순한 ‘생각함’보다 앞서 조치함의 의미가 강하므로, 우상의 넘어짐을 막기 위한 실제 조치를 드러내는 표현을 택했습니다.
- source_word: εἰκὼν
  english_pob_choice: image
  chosen_korean: 이미지
  alternatives_korean:
  - 형상
  - 우상
  - 형태
  lexicon: LSJ
  rationale: 본문의 그리스어는 εἰκών으로, 문자적으로는 ‘image/likeness’이므로, 해석어인 ‘우상’보다 원어의 직접 의미를 살린 ‘이미지’를 본문에 두었습니다.
- source_word: χρείαν ἔχει βοηθείας
  english_pob_choice: has need of help
  chosen_korean: 도움을 필요로 하기 때문입니다
  alternatives_korean:
  - 도움이 필요하기 때문입니다
  - 도움을 받아야 하기 때문입니다
  lexicon: LSJ
  rationale: 관용구적 구조를 한국어의 자연스러운 이유절로 옮기되, ‘필요하다’의 결핍 의미를 유지했습니다.
theological_decisions:
- issue: εἰκών의 번역을 ‘우상’으로 확정할지 여부
  chosen_reading: 본문에는 ‘이미지’를 두고, 의미는 문맥이 우상 비판임을 드러내도록 유지했습니다.
  alternative_readings:
  - 우상
  - 형상
  rationale: 문맥상 조각된 예배 대상을 가리키지만, 원어 자체는 εἰκών입니다. 본문에서는 어휘적 긴장을 보존하고, 해석은 문맥이 담당하도록 했습니다.
  doctrine_reference: 원어 우선 원칙 및 어휘-주석 구분
