  text: So then[a], lest it fall, he made provision for it, knowing that it is unable to help itself; for it is an image and has need of help.
  footnotes:
  - marker: a
    text: Or 'idol' for 'image'; the Greek word is literally 'image' or 'likeness,' though the context is a crafted object of worship.
