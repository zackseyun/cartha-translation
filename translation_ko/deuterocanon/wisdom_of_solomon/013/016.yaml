- from: 그러므로 그것이 넘어지지 않도록 미리 대비하였으니, 그것이 스스로를 도울 수 없음을 알았기 때문입니다. 그것은 이미지이며 도움을 필요로 하기 때문입니다.[a]
  to: 그러므로 그는 그것이 넘어지지 않도록 그것을 위하여 미리 조처하였습니다. 그것이 스스로 도움을 줄 수 없다는 것을 알고서 그렇게 한 것입니다. 그것은 형상이고 도움이 필요하기 때문입니다.[a]
  rationale: 그리스어의 목적절(‘넘어지지 않도록’)과 προενόησεν의 사전 조처를 명료하게 유지했습니다. εἰδώς는 ‘알고서’로 옮겨 선행 행동의 동기를 나타내되, 불필요하게 두 개의 독립 인과절로 만들지 않았습니다. εἰκών은 자연스러운 성서 한국어인 ‘형상’으로 번역하고, 문맥적 대안인 ‘우상’은 각주에서 제시했습니다.
