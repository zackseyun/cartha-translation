  source_fidelity: 초안은 넘어짐을 막기 위한 사전 조처, 대상의 무능력, 그리고 형상 자체가 도움을 필요로 한다는 핵심 의미를 대체로 보존합니다. 그러나 ‘미리 대비하였으니’와 연속된 ‘…때문입니다’는 그리스어의 ‘알면서/알고서’라는 분사 연결을 과도하게 인과절로 재구성하여 문장 관계를 다소 흐립니다.
  naturalness: ‘이미지’는 현대 한국어에서 디지털 이미지·인상 등의 뜻이 강하여 고전적 조각·숭배 대상의 문맥에는 부자연스럽습니다. ‘형상’이 εἰκών의 폭을 유지하면서도 문맥에 자연스럽습니다. 문장을 나누고 주어 ‘그’를 밝혀 합쇼체 산문으로 매끄럽게 다듬었습니다.
  terminology: εἰκών은 본문에서 ‘형상’으로 옮겼습니다. 이는 ‘우상’보다 덜 해석적이면서 한국어 성서 문맥에서 자연스럽습니다. ‘우상’은 문맥적 대안으로 각주에 남깁니다. βοηθείας는 ‘도움’으로 일관되게 옮겼습니다.
