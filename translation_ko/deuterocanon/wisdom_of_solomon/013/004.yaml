  - 창조주
  rationale: 헬라어는 이 절에서 창조자를 서술적으로만 지칭하므로, 본문이 주는 수사적 흐름을 살리기 위해 명칭을 덧붙이지 않았습니다.
  doctrine_reference: 번역 원칙 §1, §3
