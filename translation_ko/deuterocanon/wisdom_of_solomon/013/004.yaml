  - 운용
  - 일하심
  lexicon: BDAG
  rationale: δύναμις와 평행을 이루는 ‘활동 중인 작동성’을 살리기 위해, 결과보다 작동 자체를 드러내는 ‘작용’을 선택했습니다.
- source_word: ἐκπλαγέντες
  english_pob_choice: were astonished
  chosen_korean: 놀랐다
  alternatives_korean:
  - 경탄했다
  - 경악했다
  - 압도되었다
  lexicon: BDAG
  rationale: 문맥상 피조물의 힘에 강하게 놀란 상태를 뜻하므로, 과장되지 않으면서도 반응의 강도를 담는 ‘놀랐다’가 적절합니다.
- source_word: ποσῳ… δυνατώτερός ἐστιν
  english_pob_choice: how much more powerful is
  chosen_korean: 얼마나 더 강하신지
  alternatives_korean:
  - 얼마나 더 능력이 크신지
  - 얼마나 더 힘이 세신지
  lexicon: BDAG
  rationale: 비교 구문의 핵심은 피조물보다 창조자가 훨씬 우월하다는 점이므로, ‘더 강하신지’로 비교의 증폭을 자연스럽게 전달했습니다.
theological_decisions:
