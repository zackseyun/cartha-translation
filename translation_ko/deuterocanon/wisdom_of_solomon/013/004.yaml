translation:
  language: ko
  text: 그러나 그들의 힘과 작용[a]에 놀랐다면, 그것들을 통해 그것들을 만드신 분이 얼마나 더 강하신지 깨달아야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것들의 힘과 작용’. 헬라어 δύναμις와 ἐνέργεια가 피조물의 인상적인 힘과 실제로 작동하는 모습을 병렬로 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνάμει
  english_pob_choice: power
  chosen_korean: 힘
  alternatives_korean:
  - 능력
  - 권능
  lexicon: BDAG
  rationale: 피조물의 인상적인 강함을 가리키는 말이므로, 한국어에서는 자연스럽고 넓은 의미를 지닌 ‘힘’으로 옮겨 비교의 초점을 살렸습니다.
- source_word: ἐνεργείᾳ
