  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/011.yaml
  text: Or if some woodcutter[a], a carpenter, has sawed down a manageable tree and skillfully stripped off all its bark, and with proper craftsmanship made a useful vessel for the service of life[b],
  footnotes:
  - marker: a
    text: Or 'easy to work' for 'manageable tree'; the Greek adjective can suggest wood that is readily handled or workable.
    reason: lexical_alternative
  - marker: b
    text: Or 'for the needs of life' / 'for everyday use' for 'for the service of life.' The Greek expression refers to ordinary practical use in human life.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 어떤 나무꾼 곧 목수가 다루기 쉬운 나무를 톱으로 잘라 내고, 그 껍질을 모두 능숙하게 벗겨 낸 뒤, 공들여 보기 좋게 생활에 쓸모 있는 그릇을 만들었다면,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다루기 쉬운’은 작업하거나 취급하기 쉬운 나무라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘생활에 쓸모 있는’은 일상생활의 필요와 실용적 사용을 위한 것이라는 뜻입니다.
    reason: lexical_alternative
