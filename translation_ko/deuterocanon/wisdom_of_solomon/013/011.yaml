  rationale: 이 형용사는 실제로 손에 잘 잡히고 작업하기 쉬운 재료라는 뜻이므로, ‘다루기 쉬운’이 가장 간결하게 그 뉘앙스를 전달합니다.
- source_word: εἰς ὑπηρεσίαν ζωῆς
