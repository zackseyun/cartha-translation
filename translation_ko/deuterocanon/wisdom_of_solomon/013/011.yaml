  alternative_readings:
  - ‘그런 다음’처럼 시간 순서를 더 분명히 드러내는 번역
  rationale: 이 절은 시간 부사보다 행위의 연속을 보여 주는 분사 구조가 핵심이므로, 불필요한 시간적 뉘앙스를 추가하지 않았습니다.
  doctrine_reference: 문법-담화 충실성 원칙
- issue: 일상적 목공 기술 묘사의 비판적 과장 억제
  chosen_reading: 이 절 자체는 단순한 목공 과정과 실용적 그릇 제작을 말하므로, 우상 제작에 대한 부정적 뉘앙스를 미리 덧씌우지 않았습니다.
  alternative_readings:
  - 문맥상 우상 비판을 암시하도록 더 부정적으로 번역
  rationale: 신학적 평가는 뒤 문맥에서 드러나므로, 본 절의 서술 자체는 중립적으로 유지하는 것이 원문 의미에 충실합니다.
  doctrine_reference: 본문 우선 해석 원칙
