  - 모든 대상을 ‘우상’으로 통일함
  rationale: 그리스어는 수사 효과를 위해 표현을 바꾸므로, 이를 평준화하지 않고 한국어에서도 대비를 살려야 본문의 조롱과 논지가 유지됩니다.
