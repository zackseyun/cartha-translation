revisions:
- from: 그러나 생명에 대해서는 죽은 물건에게 구하고, 도움에 대해서는 가장 무능한 자에게 간청하며, 길을 떠나는 데 대해서는 발 하나도 사용할 수 없는 자에게 구합니다.[a]
  to: 그러나 생명을 위해서는 죽은 물건에게 청하고, 도움을 위해서는 가장 경험 없는 자에게 간청하며, 여행을 위해서는 제 발조차 쓸 수 없는 자에게 청합니다.[a]
