review_pass:
  verdict: revise
  source_fidelity: 첫 구문의 ἀξιοῖ는 이 문맥에서 죽은 우상에게 생명을 ‘청하다/요청하다’라는 뜻으로 옮기는 것이 자연스럽습니다. τὸν ἀπειρότατον은 ‘가장 무능한 자’보다 ‘가장 경험 없는 자’가 ἀπείρατος의 비교적 직접적인 의미와 최상급을 보존합니다. 마지막 βάσει는 본문에서 ‘발’로 번역하되, 받침대/기단의 가능성은 주석으로 남기는 것이 적절합니다.
  naturalness: 초안의 ‘생명에 대해서는’, ‘도움에 대해서는’, ‘길을 떠나는 데 대해서는’은 한국어에서 다소 번역투입니다. ‘~을 위해서는’과 ‘여행을 위해서는’이 현대 표준어 문맥에서 더 자연스럽습니다. ‘발 하나도 사용할 수 없는’은 ‘제 발조차 쓸 수 없는’으로 다듬는 편이 자연스럽습니다.
  terminology: 중성형 τὸ νεκρόν은 ‘죽은 물건’으로 유지하여 비인격성을 살리고, 뒤의 남성형 수식어는 ‘자’로 옮겨 원문의 풍자적 표현 전환을 유지합니다. ‘청하다’와 ‘간청하다’는 각각 요청과 간원의 강도를 자연스럽게 구별합니다.
  issues:
  - severity: medium
    issue: ἀπειρότατον을 ‘가장 무능한 자’로 번역함
    rationale: ἀπειρότατος의 기본 의미는 ‘가장 경험 없는/가장 익숙하지 않은’입니다. 문맥상 무능을 함축할 수 있으나, ‘무능한’은 해석을 한 단계 더 보태므로 직접적인 표현을 쓰는 편이 안전합니다.
  - severity: low
    issue: 본문의 일부 표현이 번역투이고 마지막 표현이 어색함
    rationale: ‘~에 대해서는’의 반복과 ‘발 하나도 사용할 수 없는’은 현대 한국어 문장으로 매끄럽지 않습니다. 의미를 바꾸지 않고 자연스러운 연결과 ‘제 발조차 쓸 수 없는’으로 다듬을 수 있습니다.
  - severity: low
    issue: 각주가 βάσις의 ‘발’ 의미를 ‘발판’과 바로 병렬함
    rationale: 본문 번역과의 연결을 분명히 하려면 βάσις가 ‘발/발걸음’ 또는 ‘받침대·기단’을 가리킬 수 있다고 밝혀 주는 편이 좋습니다.
  revised_text: 그러나 생명을 위해서는 죽은 물건에게 청하고, 도움을 위해서는 가장 경험 없는 자에게 간청하며, 여행을 위해서는 제 발조차 쓸 수 없는 자에게 청합니다.[a]
