  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/018.yaml
  text: But for life he considers the dead thing worthy; for help he begs the one most inexperienced; and for a journey[a], the one unable even to use its foot,
  footnotes:
  - marker: a
    text: Or 'the one unable even to make use of its base/pedestal.' The Greek βάσις can suggest either foot/step or base, and the line mocks the idol's inability to move itself.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 생명에 대해서는 죽은 물건에게 구하고, 도움에 대해서는 가장 무능한 자에게 간청하며, 길을 떠나는 데 대해서는 발 하나도 사용할 수 없는 자에게 구합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘발판/기단조차 사용할 수 없는 자’로도 옮길 수 있습니다. 그리스어 βάσις는 발걸음과 받침대를 모두 가리킬 수 있으며, 여기서는 스스로 움직이지 못하는 우상의 무능을 비웃습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ ζωῆς
  english_pob_choice: for life
  chosen_korean: 생명에 대해서는
  alternatives_korean:
  - 생명을 위해서는
  - 생명과 관련해서는
  - 살아 있음에 대해서는
  lexicon: LSJ
  rationale: περὶ + 속격은 여기서 요청의 대상이나 주제를 나타내므로, 한국어에서는 ‘~에 대해서는’이 가장 직접적이고 자연스럽습니다.
- source_word: τὸ νεκρὸν
  english_pob_choice: the dead thing
  chosen_korean: 죽은 물건
  alternatives_korean:
  - 죽은 것
  - 죽은 자
  - 시체
  lexicon: LSJ
  rationale: 중성 단수의 비인격적 대상을 살려 우상 비판의 뉘앙스를 유지하려고 ‘물건’으로 옮겼습니다. ‘죽은 것’도 가능하지만, 여기서는 더 노골적인 조롱의 힘이 살아납니다.
- source_word: τὸν ἀπειρότατον
  english_pob_choice: the one most inexperienced
  chosen_korean: 가장 무능한 자
  alternatives_korean:
  - 가장 미숙한 자
  - 전혀 경험이 없는 자
  - 가장 무지한 자
  lexicon: LSJ
  rationale: 문맥상 단순한 ‘경험 부족’보다 우상이 전혀 도움을 줄 수 없는 무능함이 핵심이므로, POB의 ‘most incapable’ 흐름에 맞춰 ‘무능한 자’로 풀었습니다.
- source_word: τὸ μηδὲ βάσει χρῆσθαι δυνάμενον
  english_pob_choice: the one unable even to use its foot
  chosen_korean: 발 하나도 사용할 수 없는 자
  alternatives_korean:
  - 걸음 하나도 뗄 수 없는 자
  - 발판조차 쓸 수 없는 자
  - 기단조차 사용할 수 없는 자
  lexicon: LSJ
  rationale: βάσις는 발/걸음의 의미와 받침대/기단의 의미를 가질 수 있어 여지를 남겨야 합니다. 본문 흐름상 스스로 움직이지 못하는 우상의 비꼼이 핵심이므로 ‘발 하나도 사용할 수 없는 자’로 옮겼습니다.
theological_decisions:
- issue: 우상 대상의 비인격적·인격적 표현 차이
  chosen_reading: 중성 표현은 ‘죽은 물건’으로, 이어지는 수식 대상은 ‘자’로 옮겨 우상의 사물성과 풍자적 의인화를 함께 살렸습니다.
  alternative_readings:
  - 모든 대상을 ‘그것’으로 통일함
  - 모든 대상을 ‘우상’으로 통일함
  rationale: 그리스어는 수사 효과를 위해 표현을 바꾸므로, 이를 평준화하지 않고 한국어에서도 대비를 살려야 본문의 조롱과 논지가 유지됩니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.'
