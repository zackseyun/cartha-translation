  rationale: 이 부사는 창조물의 성질에서 창조주를 추론하는 비유적·비례적 인식을 나타냅니다. 본문에서는 읽기 쉬운 ‘비유적으로’로 옮기고, 원문의 추론 성격은 그대로 보존했습니다.
