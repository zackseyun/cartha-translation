translation:
  language: ko
  text: 창조된 것들의 위대함과 아름다움을 통해 그 창조주를 유추해 볼 수 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “창조된 것들의 위대함과 아름다움에서 그 창조주가 그에 상응하여 인식됩니다” 또는 “그것들의 창조주가 비례에 따라 파악됩니다.” 그리스어 부사는 창조된 것들의 특성에 상응하여 그 창조주를 추론한다는 뜻을 나타냅니다.
    reason: lexical_alternative
