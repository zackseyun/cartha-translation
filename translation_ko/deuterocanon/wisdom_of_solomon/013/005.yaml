theological_decisions:
- issue: 자연을 통한 창조주 인식
  chosen_reading: 창조물의 위대함과 아름다움을 통해 창조주가 비유적으로 드러나 보입니다.
  alternative_readings:
  - 창조주가 창조물들로부터 상응하게 인식됩니다.
  - 창조주의 존재가 창조물에서 추론됩니다.
  rationale: 이 절은 창조물로부터 창조주를 알아차릴 수 있다는 자연계시의 진술입니다. 구원의 지식까지 확장하지 않고, 본문이 말하는 추론 가능성만 보존했습니다.
  doctrine_reference: 자연계시; 지혜서 13:5의 인식론적 진술을 과장하지 않음
