  lexicon: LSJ
  rationale: γενεσιουργός는 생성자, 산출자, 창조주를 뜻하는 드문 표현입니다. 한국어에서는 ‘창조주’가 가장 직접적이며, 소유 대명사 ‘그들의’로 κτισμάτων과의 대응을 살렸습니다.
