  text: For from the greatness and beauty of created things[a], their Creator is seen by analogy.
  footnotes:
  - marker: a
    text: Or “their Creator is perceived proportionately” or “the creator of them is discerned correspondingly.” The Greek adverb carries the idea of inference in due correspondence from the qualities of created things to their maker.
