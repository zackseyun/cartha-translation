  rationale: 앞선 문맥의 창조된 것들을 가리키므로 대명사로 자연스럽게 이어 받았습니다. 한국어 본문은 과도한 반복을 피하되, 주석 없이도 창조물의 의미가 유지되도록 했습니다.
