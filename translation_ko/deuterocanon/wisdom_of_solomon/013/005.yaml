  rationale: 원인이나 근거를 나타내는 관계를 자연스러운 한국어로 옮겼습니다. 단순한 장소적 ‘에서’보다 인식의 근거를 분명히 드러냅니다.
- source_word: μεγέθους καὶ καλλονῆς
