  lexicon: LSJ
  rationale: ἄξιος의 ‘worthy/fit’와 οἴκημα의 ‘dwelling’ 요소를 함께 살려, 우상에 맞추어 마련된 거처라는 뜻을 간결하게 옮겼습니다.
- source_word: ἔθηκεν αὐτὸ ἐν τοίχῳ
  english_pob_choice: he set it in a wall
  chosen_korean: 그것을 벽 안에 두고
  alternatives_korean:
