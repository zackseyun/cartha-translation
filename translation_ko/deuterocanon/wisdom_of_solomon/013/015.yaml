lexical_decisions:
- source_word: ποιήσας
  english_pob_choice: after making
  chosen_korean: 만든 뒤
  alternatives_korean:
  - 만들고 나서
  - 만들어
  lexicon: BDAG
  rationale: 앞선 분사 동작이 주동사보다 먼저 일어났음을 자연스럽게 나타내되, 한국어 문장 흐름은 과도하게 딱딱해지지 않도록 했습니다.
- source_word: αὐτῷ αὐτοῦ ἄξιον οἴκημα
  english_pob_choice: a dwelling fit for it
  chosen_korean: 알맞은 거처
  alternatives_korean:
  - 그것에 합당한 집
