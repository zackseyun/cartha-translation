  - 그것을 벽 속에 놓고
  lexicon: BDAG
  rationale: ἐν τοίχῳ의 위치 관계를 살려 벽 속에 고정해 둔 장면을 자연스럽게 표현했습니다.
- source_word: ἀσφαλισάμενος σιδήρῳ
  english_pob_choice: securing it with iron
  chosen_korean: 철로 고정했습니다
  alternatives_korean:
  - 철로 단단히 붙였습니다
  - 철로 안전하게 고정했습니다
  lexicon: BDAG
  rationale: ‘보호하다/안전하게 하다’의 분사적 수식을 한국어 동사구로 풀어, 철제 고정 장치를 사용해 붙들어 매는 의미를 분명히 했습니다.
