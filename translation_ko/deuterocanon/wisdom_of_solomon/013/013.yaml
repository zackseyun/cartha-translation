    reason: lexical_alternative
  - marker: b
    text: 원문은 한가한 시간에 기울인 정성과 여가에 익힌 솜씨를 나란히 말하여, 우상 제작에 들인 세심한 노력의 아이러니를 드러냅니다.
    reason: cultural_note
  revision_rationale: The revision corrects the contextual noun choice for discarded wood, uses natural and precise woodworking vocabulary, and makes the Korean syntax smoother. It preserves the source’s satirical juxtaposition of diligent craftsmanship with idleness/leisure without imposing a doctrinal reading. It also places each footnote marker immediately after the expression it documents.
