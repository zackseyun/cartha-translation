  lexicon: LSJ
  rationale: ξύλον은 여기서 구체적 재료인 나무조각으로, σκολιόν과 ὅζοις συμπεφυκός는 결함 있는 목재의 상태를 가리키므로 ‘비뚤어진’과 ‘마디투성이’로 압축해 살렸습니다.
- source_word: ἐν ἐπιμελείᾳ ἀργίας αὐτοῦ, καὶ ἐμπειρίᾳ ἀνέσεως
  english_pob_choice: with the diligence of his idleness, and with the skill of his leisure
  chosen_korean: 게으름의 부지런함으로 깎아내고, 한가함의 숙련으로
  alternatives_korean:
  - 한가한 틈의 정성으로
  - 게으른 여가의 세심함으로
  lexicon: LSJ
  rationale: 원문의 역설적 표현을 평이하게 풀지 않고 그대로 보존해, 우상 제작을 풍자하는 아이러니를 살렸습니다.
- source_word: ἀπεικάσεν αὐτὸ εἰκόνι ἀνθρώπου
  english_pob_choice: made it like the image of a man
  chosen_korean: 사람의 형상과 같게 만들었습니다
  alternatives_korean:
