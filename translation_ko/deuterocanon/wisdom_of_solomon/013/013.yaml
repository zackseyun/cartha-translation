base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/013.yaml
  text: But the refuse from these[a], useful for nothing, a crooked piece of wood and full of knots—taking it, he carved it with the diligence of his idleness, and with the skill of his leisure he shaped it, and made it like the image of a man[b],
  footnotes:
  - marker: a
    text: Or 'discarded piece,' 'waste,' or 'offcut' for 'refuse.' The Greek denotes something thrown away as worthless.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'with the diligence of his idleness, and with the skill of his leisure'—an ironic description of careful effort spent on making an idol.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 이들에서 나온 버려진 조각[a], 곧 아무 데도 쓸모 없는 뒤틀리고 옹이가 많은 나무조각을 그는 집어 들어, 자신의 한가한 시간에 기울인 정성[b]으로 깎고 여가에 익힌 솜씨로 그것을 다듬어 사람의 형상을 본떠 만들었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘버려진 조각’은 여기서 버려져 쓸모없게 된 나무의 잔여물을 뜻하며, ‘폐물’이나 ‘쓸모없는 조각’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 한가한 시간에 기울인 정성과 여가에 익힌 솜씨를 나란히 말하여, 우상 제작에 들인 세심한 노력의 아이러니를 드러냅니다.
    reason: cultural_note
