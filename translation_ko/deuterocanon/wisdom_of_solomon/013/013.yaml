  - 사람의 모습을 닮게 했습니다
  lexicon: LSJ
  rationale: εἰκών과 ἀνθρώπου의 결합을 자연스러운 한국어로 옮기되, 인간 형상의 우상이라는 점을 분명히 했습니다.
theological_decisions:
- issue: 우상 제작을 비꼬는 역설적 수식의 보존
  chosen_reading: ‘게으름의 부지런함’, ‘한가함의 숙련’이라는 역설을 그대로 살렸습니다.
  alternative_readings:
  - ‘한가한 틈의 정성’처럼 완화된 표현
  - 단순히 ‘정성껏’으로 정리하는 방식
  rationale: 본문은 우상 제작에 들인 세심한 수고를 조롱하는 수사이므로, 의미를 매끈하게 다듬어 풍자를 약화시키지 않는 것이 중요합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: ἀνθρώπου의 성별 표지
  chosen_reading: ‘사람의 형상’으로 옮기되, ‘인간’으로 추상화하지는 않았습니다.
  alternative_readings:
  - ‘인간의 형상’
  - ‘한 사람의 형상’
  rationale: 그리스어는 우상에 부여된 인간 형상을 가리키며, 성별 중립화가 본문의 구체적 묘사를 흐릴 수 있어 피했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
