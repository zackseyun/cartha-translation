  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/013.yaml
  text: But the refuse from these[a], useful for nothing, a crooked piece of wood and full of knots—taking it, he carved it with the diligence of his idleness, and with the skill of his leisure he shaped it, and made it like the image of a man[b],
  footnotes:
  - marker: a
    text: Or 'discarded piece,' 'waste,' or 'offcut' for 'refuse.' The Greek denotes something thrown away as worthless.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'with the diligence of his idleness, and with the skill of his leisure'—an ironic description of careful effort spent on making an idol.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 이들로부터 나온 찌꺼기는 아무 데도 쓸모없는, 비뚤어진 나무조각이며 마디투성이였습니다. 그것을 집어 들고 그는 게으름의 부지런함으로 깎아내고, 한가함의 숙련으로 그것을 다듬어, 사람의 형상과 같게 만들었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘찌꺼기’는 여기서 버려진 나무의 잔여물을 뜻하는 말로, ‘버려진 조각’이나 ‘폐물’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 ‘게으름의 부지런함, 한가함의 숙련’이라고 말해 우상 제작의 아이러니를 드러냅니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπόβλημα
  english_pob_choice: refuse
  chosen_korean: 찌꺼기
  alternatives_korean:
  - 버려진 조각
  - 폐물
  - 쓸모없는 조각
  lexicon: LSJ
  rationale: 버려져 쓸모없게 된 나무의 잔여물을 자연스럽게 드러내면서도, 단순한 쓰레기보다 문맥상의 ‘버림받은 나무조각’ 느낌을 살립니다.
- source_word: εἰς οὐδὲν εὔχρηστον
  english_pob_choice: useful for nothing
  chosen_korean: 아무 데도 쓸모없는
  alternatives_korean:
  - 아무 쓸모도 없는
  - 전혀 쓸모없는
  lexicon: LSJ
  rationale: 그리스어의 전면적 무용성을 한국어 구어가 아닌 현대 문어체로 분명하게 옮겼습니다.
- source_word: ξύλον σκολιὸν καὶ ὅζοις συμπεφυκός
  english_pob_choice: a crooked piece of wood and full of knots
  chosen_korean: 비뚤어진 나무조각이며 마디투성이
  alternatives_korean:
  - 굽은 나무조각이며 마디가 잔뜩 박힌
  - 뒤틀린 나무이며 옹이가 많은
  lexicon: LSJ
  rationale: ξύλον은 여기서 구체적 재료인 나무조각으로, σκολιόν과 ὅζοις συμπεφυκός는 결함 있는 목재의 상태를 가리키므로 ‘비뚤어진’과 ‘마디투성이’로 압축해 살렸습니다.
- source_word: ἐν ἐπιμελείᾳ ἀργίας αὐτοῦ, καὶ ἐμπειρίᾳ ἀνέσεως
  english_pob_choice: with the diligence of his idleness, and with the skill of his leisure
  chosen_korean: 게으름의 부지런함으로 깎아내고, 한가함의 숙련으로
  alternatives_korean:
  - 한가한 틈의 정성으로
  - 게으른 여가의 세심함으로
  lexicon: LSJ
  rationale: 원문의 역설적 표현을 평이하게 풀지 않고 그대로 보존해, 우상 제작을 풍자하는 아이러니를 살렸습니다.
- source_word: ἀπεικάσεν αὐτὸ εἰκόνι ἀνθρώπου
  english_pob_choice: made it like the image of a man
  chosen_korean: 사람의 형상과 같게 만들었습니다
  alternatives_korean:
  - 사람의 형상으로 만들었습니다
  - 사람의 모습을 닮게 했습니다
  lexicon: LSJ
  rationale: εἰκών과 ἀνθρώπου의 결합을 자연스러운 한국어로 옮기되, 인간 형상의 우상이라는 점을 분명히 했습니다.
theological_decisions:
- issue: 우상 제작을 비꼬는 역설적 수식의 보존
  chosen_reading: ‘게으름의 부지런함’, ‘한가함의 숙련’이라는 역설을 그대로 살렸습니다.
  alternative_readings:
  - ‘한가한 틈의 정성’처럼 완화된 표현
  - 단순히 ‘정성껏’으로 정리하는 방식
  rationale: 본문은 우상 제작에 들인 세심한 수고를 조롱하는 수사이므로, 의미를 매끈하게 다듬어 풍자를 약화시키지 않는 것이 중요합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: ἀνθρώπου의 성별 표지
  chosen_reading: ‘사람의 형상’으로 옮기되, ‘인간’으로 추상화하지는 않았습니다.
  alternative_readings:
  - ‘인간의 형상’
  - ‘한 사람의 형상’
  rationale: 그리스어는 우상에 부여된 인간 형상을 가리키며, 성별 중립화가 본문의 구체적 묘사를 흐릴 수 있어 피했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
