    reason: αἰών의 어휘적·해석적 범위를 밝혀, 본문의 의미상 여지를 보존합니다.
lexical_decisions:
- source_word: τὸν αἰῶνα
  english_pob_choice: the age
  chosen_korean: 그 시대
  alternatives_korean:
  - 세상
  - 세계
  - 영원
  lexicon: αἰών
  rationale: 이 절의 POB가 "the age"로 수정한 점을 따라, 창조세계 일반보다 특정한 시대적 질서와 역사적 국면을 가리키는 뉘앙스를 살려 "그 시대"로 옮겼습니다.
- source_word: στοχάσασθαι
