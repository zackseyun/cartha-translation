  alternatives_korean:
  - 추측하다
  - 논의하다
  - 가늠하다
  lexicon: στοχάζομαι
  rationale: 단순한 철학적 추론보다 표적을 향해 헤아려 도달한다는 느낌이 있어, 문맥상 자연스러운 현대 한국어로 "생각해 내다"를 택했습니다.
- source_word: δεσπότης
  english_pob_choice: Master
  chosen_korean: 주인
  alternatives_korean:
  - 주님
  - 주인님
  - 지배자
  lexicon: δεσπότης
  rationale: 하나님을 높이는 신앙 용어로 굳히기보다, 여기서는 피조물과 소유·통치의 관계를 드러내는 말로서 "주인"이 원문의 긴장을 가장 직접적으로 전달합니다.
theological_decisions:
- issue: δεσπότης를 신학적으로 어떻게 한국어화할지
  chosen_reading: '"주인"으로 옮겨, 창조주-피조물 및 소유주-피조물의 대비를 보존했습니다.'
  alternative_readings:
  - '"주님"'
  - '"주재자"'
  rationale: 문맥은 예배 호칭보다 식별 실패의 역설을 강조하므로, 경건한 호칭으로 완화하지 않고 관계적 지배를 드러내는 표현을 유지하는 편이 원문 효과에 더 가깝습니다.
  doctrine_reference: 창조주와 피조물의 구별, 지혜서의 우상 비판 문맥
