base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/019.yaml
  text: But concerning provision and work and success of his hands[b][a], he asks strength from that thing most inactive with his hands.
  footnotes:
  - marker: a
    text: Or 'the most lifeless thing' or 'what is utterly inert.' The Greek superlative stresses the idol's complete inability to act.
    reason: lexical_alternative
  - marker: b
    text: Literally 'success of hands,' meaning success in what one does or makes.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 생계를 마련하는 일과 노동과 손으로 하는 일의 성공[b]에 관해서는, 그는 자기 손으로 가장 무기력한 것[a]에게서 힘을 구합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '가장 무생명한 것' 또는 '완전히 무기력한 것'이라는 뜻입니다. 그리스어 최상급은 우상의 철저한 무능력을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 '손의 성공'으로, 손으로 하는 일에서의 성공을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορισμοῦ
  english_pob_choice: provision
  chosen_korean: 생계
  alternatives_korean:
  - 공급
  - 양식
  - 획득
  lexicon: LSJ
  rationale: 포리스모스는 생계를 이루는 수단이나 마련을 가리킬 수 있으므로, 문맥상 '일'과 병렬을 이루는 자연스러운 한국어인 '생계'를 택했습니다.
- source_word: ἐργασίας
  english_pob_choice: work
  chosen_korean: 일
  alternatives_korean:
  - 노동
  - 업무
  - 작업
  lexicon: LSJ
  rationale: '''일''은 현대 한국어에서 광범위한 노동·활동을 포괄하며, 앞의 ''생계''와 함께 간결하게 병렬을 살립니다.'
- source_word: χειρῶν ἐπιτυχίας
  english_pob_choice: success of hands
  chosen_korean: 손의 성취
  alternatives_korean:
  - 손의 성공
  - 손으로 하는 일의 성취
  - 손의 결과
  lexicon: LSJ
  rationale: 직역하면 '손의 성공/성취'이므로, 손으로 하는 행위의 결과라는 점을 살려 '손의 성취'로 옮겼습니다.
- source_word: τὸ ἀδρανέστατον
  english_pob_choice: that thing most inactive
  chosen_korean: 가장 무기력한 것
  alternatives_korean:
  - 가장 움직이지 않는 것
  - 가장 무생명한 것
  - 완전히 무력한 것
  lexicon: LSJ
  rationale: 최상급이 강조하는 무능력성과 사물성(neuter)을 살리면서, 우상 비판의 아이러니를 유지하는 표현으로 옮겼습니다.
- source_word: εὐδράνειαν
  english_pob_choice: strength
  chosen_korean: 힘
  alternatives_korean:
  - 능력
  - 활력
  - 효력
  lexicon: LSJ
  rationale: 행동의 유효함과 적극성을 뜻하는 어휘로, '가장 무기력한 것'과의 대비를 가장 분명하게 드러내는 기본어 '힘'을 사용했습니다.
theological_decisions:
- issue: 우상이 실제로는 무기력한 사물인데도 도움과 성취를 구하는 역설
  chosen_reading: 본문은 우상을 섬기는 사람이 자기 손으로 만든 무기력한 대상에게서 실제적 성공을 구하는 아이러니를 드러냅니다.
  alternative_readings:
  - 단순히 무능한 신상에 대한 일반적 비판으로 완화하는 읽기
  rationale: 문맥 전체가 우상 제작과 예배의 허구를 비판하며, 중성 최상급 표현은 대상의 사물성을 강조합니다. 따라서 역설을 약화하지 않고 그대로 살렸습니다.
  doctrine_reference: 원문 우선과 우상 비판의 아이러니 보존
