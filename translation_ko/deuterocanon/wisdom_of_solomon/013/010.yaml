theological_decisions:
- issue: ‘their hopes are among the dead’의 범위
  chosen_reading: 죽은 사람들만이 아니라 죽은 것들까지 아우르는 표현으로 유지해, 우상과 죽음의 결박을 동시에 암시하도록 했습니다.
  alternative_readings:
  - 그들의 희망은 죽은 자들 가운데 있습니다
  - 그들의 희망은 죽은 것들 안에 있습니다
  rationale: 본문은 희망의 대상이 생명이 없는 우상이며 동시에 죽음의 영역과 결부됨을 암시하므로, 의미를 한쪽으로 좁히지 않았습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
