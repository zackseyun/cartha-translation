base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/010.yaml
  text: But miserable are they[a], and their hopes are among the dead, who called gods the works of human hands—gold and silver, the product of skill, and images of animals, or a useless stone[b], the work of an ancient hand.
  footnotes:
  - marker: a
    text: Or, 'their hopes are in dead things' or 'their hopes are with the dead.' The Greek phrase is terse and may intentionally evoke both lifeless idols and death-associated futility.
    reason: alternative_reading
  - marker: b
    text: The phrase 'the work of an ancient hand' may mean a stone idol fashioned long ago, emphasizing both its age and its merely human origin.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들은 비참하며, 그들의 희망은 죽은 것들 가운데 있습니다.[a] 그들은 사람의 손으로 만든 것들, 곧 금과 은, 기술의 산물, 짐승의 형상들, 또는 쓸모없는 돌, 오래전 사람의 손으로 만든 것을[b] 신들이라고 불렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 표현은 ‘죽은 것들 가운데’, ‘죽은 자들 가운데’, 또는 ‘죽은 것들과 함께’로도 옮길 수 있습니다. 이 간결한 표현은 생명 없는 우상과 죽음에 결부된 허무를 함께 떠올리게 할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘오래전 사람의 손으로 만든 것’은 오래전에 만들어진 돌 우상을 가리킬 수 있으며, 그것이 인간의 손으로 만든 것에 지나지 않음을 강조합니다.
    reason: lexical_alternative
