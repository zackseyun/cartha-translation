translation:
  language: ko
  text: 혹은 그가 그것을 어떤 하찮은 동물[a]처럼 만들고, 붉은 황토와 염료를 발라 그 표면을 붉게 하고, 그 위의 모든 흠[b]을 덮어 칠했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어떤 보통 동물’, ‘어떤 값싼 동물’ 또는 ‘어떤 보잘것없는 동물’. 그리스어는 그 동물이 하찮거나 값싼 것이라는 뉘앙스를 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 색칠 재료들을 가리킵니다. ‘붉은 황토’(μίλτος)와 φῦκος, 곧 붉은 염료 또는 화장용 색소입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ζώῳ τινὶ εὐτελεῖ
  english_pob_choice: some lowly animal
  chosen_korean: 어떤 천한 동물
  alternatives_korean:
  - 어떤 값싼 동물
  - 어떤 흔한 동물
  - 어떤 보잘것없는 동물
  lexicon: LSJ
  rationale: εὐτελής는 낮은 신분·값어치·품격을 가리키므로, ‘천한’이 우상 제작의 경멸적 뉘앙스를 살리면서도 자연스럽습니다.
- source_word: καταχρίσας μίλτῳ καὶ φύκει
  english_pob_choice: smearing it with red ocher and with dye
  chosen_korean: 붉은 황토와 염료를 바르며
