  lexicon: LSJ
  rationale: μίλτος는 붉은 황토/붉은 흙 계열의 안료이고, φῦκος는 붉은 염료나 화장용 색소를 가리킬 수 있어 ‘염료’로 넓게 옮겼습니다.
- source_word: ἐρυθῆνας χρῶαν αὐτοῦ
  english_pob_choice: reddening its surface
  chosen_korean: 그 표면을 붉게 하고
  alternatives_korean:
  - 그 겉면을 붉게 하고
  - 그 피부를 붉게 하고
  - 그 겉색을 붉게 하고
  lexicon: LSJ
  rationale: χρώς/χρόα는 피부이기도 하지만 형상·표면의 겉면을 뜻할 수 있으므로, 우상 문맥에는 ‘표면’이 가장 적절합니다.
- source_word: πᾶσαν κηλῖδα τὴν ἐν αὐτῷ
  english_pob_choice: every blemish on it
  chosen_korean: 그 안의 모든 흠
  alternatives_korean:
  - 그 위의 모든 흠
  - 그 안의 모든 얼룩
  - 그 위의 모든 결점
  lexicon: LSJ
  rationale: κηλίς는 얼룩·점·흠을 뜻하며, 여기서는 우상 표면의 결함을 가린다는 맥락이므로 ‘흠’이 가장 자연스럽습니다.
theological_decisions:
- issue: 우상 제작 묘사의 직설성
  chosen_reading: 우상을 ‘어떤 천한 동물’처럼 만들고 색을 입히는 장면을 완곡하게 돌리지 않고 그대로 옮겼습니다.
  alternative_readings:
  - 우상을 동물처럼 꾸몄습니다
  - 우상을 보잘것없는 짐승처럼 만들었습니다
  rationale: 본문은 우상 제작의 인위성과 조작성을 풍자적으로 드러내므로, 이를 약화시키지 않는 직역적 표현이 문맥에 더 충실합니다.
  doctrine_reference: 우상 비판의 문맥적 보존
- issue: 형상과 표면의 구체성
  chosen_reading: χρώς를 사람의 ‘피부’가 아니라 우상 조형물의 ‘표면’으로 옮겼습니다.
  alternative_readings:
  - 피부
  - 겉모습
  rationale: 대상이 동물이 아니라 제작된 형상이라는 점을 고려하면, 한국어에서도 비인격적 표면 묘사가 원문 의도를 더 잘 전달합니다.
  doctrine_reference: 문맥 기반 의미 보존
