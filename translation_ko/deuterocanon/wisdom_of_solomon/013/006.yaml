  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/006.yaml
  text: Yet even for these there is only slight blame, for they too perhaps go astray while seeking God and wanting to find him;
  footnotes:
  - marker: a
    text: Or 'seeking a god'; the Greek lacks the article, but in context the author most likely means the true God whom they are trying, though mistakenly, to find.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 이들에게도 책망은 조금 있을 뿐입니다. 그들도 아마 하나님을[a] 찾고 발견하기를 바라면서 길을 잃기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어떤 신을’로 옮길 수 있습니다. 그리스어에는 정관사가 없지만, 문맥상 저자는 그들이 잘못 찾고 있는 참 하나님을 가리키는 것으로 보입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλʼ ὅμως
  english_pob_choice: Yet even
  chosen_korean: 그러나
  alternatives_korean:
  - 그럼에도 불구하고
  - 하지만 여전히
  lexicon: LSJ
  rationale: 앞선 비판을 인정하면서도 완화하는 양보·대조를 한국어에서는 간결한 역접 ‘그러나’로 살렸습니다.
- source_word: μέμψις ὀλίγη
  english_pob_choice: only slight blame
  chosen_korean: 약간의 책망만
  alternatives_korean:
  - 조금의 책망만
  - 작은 비난만
  - 경미한 허물만
  lexicon: LSJ
  rationale: μέμψις는 법정적 ‘유죄’보다 ‘책망/비난’에 가깝고, ὀλίγη의 축소를 ‘약간의 …만’으로 자연스럽게 반영했습니다.
- source_word: τάχα πλανῶνται
  english_pob_choice: perhaps go astray
  chosen_korean: 아마 … 길을 잃는 것이기 때문입니다
  alternatives_korean:
  - 아마 … 잘못 가는 것이기 때문입니다
  - 어쩌면 … 방황하는 것이기 때문입니다
  lexicon: LSJ
  rationale: τάχα의 불확실성을 ‘아마’로, πλανῶνται의 도덕적·인지적 이탈을 ‘길을 잃다’로 옮겨 오해와 오류의 뉘앙스를 함께 살렸습니다.
- source_word: θεὸν ζητοῦντες
  english_pob_choice: while seeking God
  chosen_korean: 하나님을 찾다가
  alternatives_korean:
  - 하나님을 구하다가
  - 하나님을 찾으며
  lexicon: LSJ
  rationale: 무관사 θεόν을 문맥상 참하나님으로 이해한 영어 POB의 결정을 따르되, 진행 중의 행동과 이탈이 겹치는 구조를 ‘-다가’로 표현했습니다.
theological_decisions:
- issue: 무관사 θεόν을 ‘어떤 신’으로 볼지, ‘하나님’으로 볼지
  chosen_reading: 하나님
  alternative_readings:
  - 어떤 신
  - 신
  rationale: 지혜서 13장은 창조물을 통해 창조주를 더듬어 찾는 맥락이므로, 여기서는 불특정한 신이 아니라 참하나님을 가리키는 것으로 이해하는 것이 본문 흐름에 가장 잘 맞습니다.
  doctrine_reference: 원문 우선 번역 원칙; 문맥이 지시하는 신학적 긴장을 보존
