  language: ko
  text: 그는 자기 작업에서 나온 자투리들을 음식을 마련하는 데 다 써서 배가 불렀습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘버려진 조각들’, ‘잘라 낸 조각들’, ‘작업에서 나온 찌꺼기’로 옮길 수 있습니다. 그리스어는 장인의 작업에서 떨어져 나오거나 버려진 것을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘배가 불렀습니다’는 남은 나무 조각을 음식을 마련하는 데 사용한 뒤 허기를 채웠다는 뜻일 가능성이 큽니다.
