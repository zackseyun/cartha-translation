  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/007.yaml
  text: For while moving among his works[a], they examine them closely, and they are persuaded by what they see, because the things being seen are beautiful.
  footnotes:
  - marker: a
    text: Or 'the visible things are good.' The Greek καλὰ can mean either 'beautiful' or 'good'; here 'beautiful' was chosen because the verse emphasizes persuasion through sight.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 일들 가운데서 다니면서 그것들을 자세히 살펴보고, 보이는 것들에 의해 설득되니, 보이는 것들은 아름답기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘보이는 것들은 좋다.’ 그리스어 καλὰ는 ‘아름답다’와 ‘좋다’ 둘 다 될 수 있습니다. 여기서는 시각을 통한 설득이 강조되므로 ‘아름답다’를 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστρεφόμενοι
  english_pob_choice: while moving among
  chosen_korean: 다니면서
  alternatives_korean:
  - 거닐면서
  - 오가면서
  - 살아가면서
  lexicon: BDAG
  rationale: 여기서는 하나님의 일들 가운데를 실제로 오가며 접하는 동작과 경험의 뉘앙스를 살려, 추상적인 '고려하면서'보다 공간적·체험적 흐름을 드러내는 표현을 택했습니다.
- source_word: διεραυνῶσιν
  english_pob_choice: examine them closely
  chosen_korean: 자세히 살펴보고
  alternatives_korean:
  - 면밀히 조사하고
  - 철저히 탐구하고
  - 깊이 조사하고
  lexicon: LSJ
  rationale: 강화된 '탐색/조사'의 뜻을 자연스러운 한국어로 옮기되, 단순 관찰이 아니라 의도적인 면밀함을 드러내기 위해 '자세히 살펴보고'를 선택했습니다.
- source_word: τῇ ὄψει
  english_pob_choice: by what they see
  chosen_korean: 보이는 것들에 의해
  alternatives_korean:
  - 보는 것으로
  - 시각에 의해
  - 보이는 바에 의해
  lexicon: BDAG
  rationale: 시각적 근거가 사람들을 설득한다는 인과를 살리기 위해, '시야'보다 대상성을 갖는 '보이는 것들'로 옮겼습니다.
- source_word: καλὰ
  english_pob_choice: beautiful
  chosen_korean: 아름답기
  alternatives_korean:
  - 좋기
  - 훌륭하기
  - 보기 좋기
  lexicon: LSJ
  rationale: 이 절은 눈에 보이는 것들의 매력과 설득력을 강조하므로, 도덕적 '좋음'보다 심미적 뉘앙스를 살리는 '아름답다'를 택했습니다.
theological_decisions:
- issue: αὐτοῦ의 지시 대상
  chosen_reading: 그의 일들
  alternative_readings:
  - 그것의 일들
  - 그분의 일들
  rationale: 문맥상 창조자와 그분의 행위에서 논증이 진행되므로, 인칭적 지시를 살려 '그의'로 옮겼습니다. 다만 번역문에서는 과도한 신학적 해석을 덧붙이지 않았습니다.
  doctrine_reference: 문맥 우선의 지시대명사 처리; 원문의 인과적 논증 유지
- issue: τῇ ὄψει와 뒤의 καλὰ 관계
  chosen_reading: 보이는 것들에 의해 설득되니, 보이는 것들은 아름답기 때문입니다
  alternative_readings:
  - 보이는 것에 설득되니, 보이는 것은 아름답기 때문입니다
  - 시각에 설득되니, 보이는 것들은 좋기 때문입니다
  rationale: 영어 POB처럼 시각적 인식이 설득을 낳는 구조를 유지하면서, καλὰ의 심미적 강조를 '아름답다'로 살렸습니다. '좋다'로 완화하면 눈에 보이는 창조의 매력이 약해집니다.
  doctrine_reference: 창조의 가시성과 심미적 증거에 대한 본문의 논리 보존
