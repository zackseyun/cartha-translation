  rationale: 고대 우주론적 이미지를 과도하게 풀이하지 않고, 별들의 원형 운동 또는 구체를 나타내는 이미지를 비교적 직역했습니다.
- source_word: πρυτάνεις κόσμου
  english_pob_choice: ruling the world
  chosen_korean: 세계를 다스리는
  alternatives_korean:
