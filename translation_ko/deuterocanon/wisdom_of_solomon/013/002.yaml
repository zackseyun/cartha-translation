theological_decisions:
- issue: πνεῦμα를 '영'이 아니라 '바람'으로 둘지 여부
  chosen_reading: 바람
  alternative_readings:
  - 영
  - 숨
  rationale: 이 절은 불, 바람, 공기, 별, 물, 광명체를 열거하며 피조 자연을 신격화한 잘못을 지적하므로, '바람'이 본문의 반(反)우상숭배 논지를 가장 분명하게 보존합니다.
  doctrine_reference: 원문 우선 번역; 문맥상 자연물 목록의 의미 유지
- issue: πρυτάνεις κόσμου와 θεούς의 관계
  chosen_reading: 세계를 다스리는 신들
  alternative_readings:
  - 세계의 통치자인 신들
  - 세계를 주재하는 신들
  rationale: '''신들''과 ''세계를 다스리는''을 붙여, 단순한 별칭이 아니라 그들이 세계를 주관한다고 여겼다는 문장 구조를 드러냈습니다.'
  doctrine_reference: 원문 구조 보존; 서술적 동격 관계 반영
