  lexicon: LSJ
  rationale: πρυτάνεις의 '주재하다/다스리다'를 동사구로 풀어 한국어 문장 흐름을 자연스럽게 했습니다.
- source_word: θεοὺς ἐνόμισαν
  english_pob_choice: they considered ... to be gods
  chosen_korean: 신들로 여겼습니다
