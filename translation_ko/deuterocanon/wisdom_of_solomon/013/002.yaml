base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/002.yaml
  text: Instead[a], they considered either fire, or wind, or swift air, or the circle of the stars, or violent water, or the lights of heaven, to be gods[c][b], rulers of the world.
  footnotes:
  - marker: a
    text: Or 'spirit' for 'wind' (Greek πνεῦμα); here the natural-elements context favors 'wind.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the circuit of the stars' for 'the circle of the stars.'
    reason: lexical_alternative
  - marker: c
    text: Literally, 'presiding rulers of the world.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들은 불이나 바람[a]이나 빠르게 움직이는 공기나 별들의 원[b]이나 거센 물이나 하늘의 광명체들을 세계를 다스리는 신들[c]로 여겼습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '영'으로 옮길 수 있습니다(그리스어 πνεῦμα). 그러나 여기서는 자연물의 문맥상 '바람'이 더 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '별들의 순환'으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 '세계의 주재자들'입니다.
    reason: lexical_alternative
