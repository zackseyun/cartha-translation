  source_fidelity: ‘ἐκ τῶν ὁρωμένων ἀγαθῶν’는 ‘보이는 좋은 것들로부터’보다 ‘눈에 보이는 좋은 것들을 통해’가 한국어에서 자연스럽고 원문의 인식 경로를 더 정확히 드러냅니다. ‘τοῖς ἔργοις προσχόντες’는 단순히 주의를 기울이지 않았다는 뜻보다 작품들을 살펴보았으나 알아보지 못했다는 대조를 나타내므로 이를 반영했습니다.
  naturalness: 초안의 ‘보이는 좋은 것들로부터도’와 ‘그의 일들’은 다소 직역투이거나 지시 대상이 모호합니다. 문장 연결과 지시 대상을 현대 표준어 합쇼체에 맞게 다듬었습니다.
