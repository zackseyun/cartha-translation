base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/001.yaml
  text: For all men are by nature futile, in whom there was ignorance of God; and from the good things that are seen they were not able to know the One who is, nor by paying attention to his works did they recognize the craftsman.
translation:
  language: ko
  text: 참으로 모든 사람은 본성상 헛되며, 그들에게는 하나님에 대한 무지가 있었습니다. 그들은 눈에 보이는 좋은 것들을 통해서도 존재하시는 분을 알 수 없었고, 그분의 작품들을 살펴보고도 그 장인을 알아보지 못하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μάταιοι
  english_pob_choice: futile
  chosen_korean: 헛되며
  alternatives_korean:
  - 헛되고
  - 무익하며
  - 허망하며
  lexicon: μάταιος
  rationale: POB의 ‘futile’는 단순한 감정적 ‘어리석음’보다 존재 방식의 헛됨을 가리키므로, 한국어도 ‘헛되다’로 옮겨 의미를 보존했습니다.
- source_word: πάντες ἄνθρωποι
  english_pob_choice: all men
  chosen_korean: 모든 사람은
  alternatives_korean:
  - 모든 남자들은
  - 모든 인류는
  lexicon: ἄνθρωπος
  rationale: 원문의 ἄνθρωποι는 일반적 인간을 뜻하므로, 성별을 불필요하게 강조하지 않는 현대 한국어로는 ‘모든 사람들’이 자연스럽지만, 문장 유지를 위해 ‘모든 사람은’으로 처리했습니다.
- source_word: θεοῦ ἀγνωσία
  english_pob_choice: ignorance of God
  chosen_korean: 하나님에 대한 무지
  alternatives_korean:
  - 하나님을 알지 못함
  - 하나님에 대한 무지함
  lexicon: ἀγνωσία
  rationale: ἀγνωσία는 단순한 ‘모름’보다 인식 부재를 뜻하므로, POB의 ‘ignorance’에 맞춰 ‘무지’로 옮겼습니다.
- source_word: τὸν ὄντα
  english_pob_choice: the One who is
  chosen_korean: 존재하시는 분
  alternatives_korean:
  - 계시는 분
  - 있는 분
  - 존재하는 분
  lexicon: ὁ ὤν
  rationale: 원문의 분사형 표현은 하나님을 존재의 근원으로 가리키므로, 직역적이면서도 한국어에서 자연스러운 ‘존재하시는 분’으로 옮겼습니다.
- source_word: τὸν τεχνίτην
  english_pob_choice: the craftsman
  chosen_korean: 그 장인
  alternatives_korean:
  - 그 기술자
  - 만드신 분
  - 조물주
  lexicon: τεχνίτης
  rationale: POB의 ‘craftsman’은 창조주를 장인의 이미지로 표현한 것이므로, 신학적으로 과장하지 않기 위해 ‘장인’을 유지했습니다.
theological_decisions:
- issue: ‘foolish’ 대신 ‘futile’를 따른 인식론적·신학적 뉘앙스
  chosen_reading: 인간의 상태를 도덕적 멍청함보다 ‘헛됨’으로 제시했습니다.
  alternative_readings:
  - 어리석음 강조
  - 죄책 중심의 번역
  rationale: 영문 POB가 환원한 ‘futile’을 따라, 본문이 말하는 것은 단순 지능 부족이 아니라 하나님을 알지 못하는 인간 인식의 공허함입니다.
  doctrine_reference: 지혜문학의 우상 비판 및 창조 인식론
- issue: ‘the One who is’의 존재론적 표현
  chosen_reading: 하나님을 ‘존재하시는 분’으로 옮겨 존재 자체를 드러내는 표현을 살렸습니다.
  alternative_readings:
  - 주어지는 존재
  - 참되신 분
  rationale: 원문은 출애굽기 3:14을 연상시키는 존재론적 호칭이므로, 신학적 긴장(하나님의 존재성)을 약화하지 않도록 직역성을 유지했습니다.
  doctrine_reference: 하나님의 자기계시와 존재론
