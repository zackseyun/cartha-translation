translation:
  language: ko
  text: 그러나 그의 재산과 결혼과 자녀에 관해서는[a], 기도하면서도 그는 생명 없는 것에 말하는 것을 부끄러워하지 않으며, 건강에 관해서는 약한 것[c][b]을 부릅니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘결혼 문제들’입니다. 그리스어에는 복수형 ‘결혼들’이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘생명 없는 것’입니다. 저자는 우상을 직접 이름하지 않고, 생명이 없는 것으로 묘사합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘약한 것’ / ‘허약한 것’입니다. 이 표현은 무력한 우상을 경멸적으로 가리킵니다.
