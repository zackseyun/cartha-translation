  yaml_path: translation/deuterocanon/3_maccabees/004/009.yaml
  text: 'And they were brought down, driven like beasts by the compulsion of iron chains: some with their necks fastened to the yokes of the ships, and others with their feet secured in unbreakable fetters,'
  footnotes:
  - marker: a
    text: Or 'being led'; the Greek participle can be rendered more neutrally, but the context favors the stronger sense 'driven.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'the yokes of the ships' may refer to ship timbers or bars to which prisoners were fastened; the Greek retains the imagery of an animal yoke.
    reason: cultural_note
  - marker: c
    text: '''Fastened'' could also be rendered ''nailed'' if the verb is taken in its strongest sense, but the immediate context does not require that narrower meaning.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 철제 결박에 강제로 붙들린 채 짐승들처럼 끌려 내려왔습니다.[a] 어떤 이들은 목이 배들의 멍에[b]에 단단히 매여 있었고[c], 어떤 이들은 발이 끊을 수 없는 족쇄에 단단히 채워져 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘끌려’(ἀγόμενοι)는 더 중립적으로 ‘인도되어’ 또는 ‘이끌려’라고도 옮길 수 있습니다. 그러나 짐승에 비유되는 문맥과 철제 결박의 묘사는 강제적으로 끌려가는 상황을 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘배들의 멍에’(τοῖς ζυγοῖς τῶν πλοίων)는 배의 들보나 가로장처럼 포로들을 묶어 두는 구조물을 가리킬 수 있습니다. 원문은 동물의 멍에 이미지를 그대로 사용합니다.
    reason: cultural_note
  - marker: c
    text: ‘단단히 매여’(προσηλωμένοι)는 단단히 고정되었다는 뜻입니다. 이 동사는 가장 강하게 이해하면 ‘못 박혀’로도 옮길 수 있으나, 이 문맥만으로 문자 그대로 못 박았다고 단정할 필요는 없습니다.
    reason: lexical_alternative
