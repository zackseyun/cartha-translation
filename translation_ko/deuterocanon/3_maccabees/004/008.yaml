  text: 그 친족들은 목에 가락지가 아니라 올가미를 두른 채, 한창 젊은 나이였음에도 혼인 잔치의 남은 날들을 잔치와 젊은이의 흥겨움이 아니라 슬픔 속에서 보내고 있었으며, 이미 음부가 자기 발앞에 누워 있는 것을 보고 있었습니다.[a]
