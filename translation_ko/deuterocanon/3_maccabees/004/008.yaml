translation:
  language: ko
  text: 그 친족들은 화관 대신 목에 올가미를 두르고, 젊음이 한창이었는데도 혼인 잔치의 남은 날들을 잔치와 젊음의 여유 대신 슬픔 속에서 보내며, 이미 하데스[a]가 자기들의 발밑에 놓여 있는 것을 보고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죽음’ 또는 ‘무덤’으로 옮길 수 있습니다. 그리스어 Ἅιδης는 최종 형벌을 특정하기보다 저승 또는 죽은 이들의 세계라는 이미지를 유지합니다.
    reason: lexical_alternative
