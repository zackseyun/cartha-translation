  yaml_path: translation/deuterocanon/3_maccabees/004/016.yaml
  text: And the king[a], greatly and continually filled with joy, was arranging banquets before all the idols, with a mind far removed from the truth and with a profane mouth, praising deaf things that were unable to speak or help them[b], but speaking improper things against God.
  footnotes:
  - marker: a
    text: Greek has a bracketed reading, '[the God],' in the source edition; the sense is that the king was speaking improperly against God.
    reason: textual_variant
  - marker: b
    text: Or 'in honor of all the idols' for 'before all the idols.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 왕은 크게 또 끊임없이 기쁨에 충만한 채, 모든 우상 앞에서 잔치를 베풀면서, 진리에서 멀리 떠난 마음과 더러운 입으로, 귀머거리이기에 자기들에게 말하거나 도울 수 없는 것들을 찬양하고, 또한 하나님을 향해서는 마땅하지 않은 말을 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문의 괄호 친 읽기와 문맥상, 뒤절은 하나님을 향한 부적절한 말을 가리킵니다.
    reason: textual_variant
lexical_decisions:
- source_word: Μεγάλως ... διηνεκῶς
  english_pob_choice: greatly and continually
  chosen_korean: 크게 또 끊임없이
  alternatives_korean:
  - 몹시 또 계속해서
  - 크게 그리고 끊임없이
  lexicon: LSJ
  rationale: 두 부사가 이어져 왕의 상태가 지속적으로 고조되어 있음을 나타내므로, 자연스러운 합쇼체 문맥에서 ‘크게’와 ‘끊임없이’로 각각 살렸습니다.
- source_word: συμπόσια
  english_pob_choice: banquets
  chosen_korean: 잔치
  alternatives_korean:
  - 연회
  - 술잔치
  lexicon: LSJ
  rationale: 왕권과 우상 숭배의 문맥에서 ‘잔치’가 가장 자연스럽고, 영어 POB의 격조 있는 어감을 무리 없이 반영합니다.
- source_word: ἐπὶ πάντων τῶν εἰδώλων
  english_pob_choice: before all the idols
  chosen_korean: 모든 우상 앞에서
  alternatives_korean:
  - 모든 우상을 위해
  - 모든 우상을 기리며
  lexicon: LSJ
  rationale: ἐπί+속격의 장소적·대면적 뉘앙스를 따라 ‘앞에서’로 옮겨, 우상숭배의 자리라는 점을 드러냈습니다.
- source_word: πεπληρωμένῃ πόρρω τῆς ἀληθείας φρενί
  english_pob_choice: with a mind far removed from the truth
  chosen_korean: 진리에서 멀리 떠난 마음
  alternatives_korean:
  - 진리에서 멀리 떨어진 생각
  - 진리와는 아주 먼 마음
  lexicon: LSJ
  rationale: φρήν을 ‘마음’으로, πόρρω τῆς ἀληθείας를 ‘진리에서 멀리 떠난’으로 처리해 내적 상태의 도덕적·영적 이탈을 유지했습니다.
- source_word: βεβήλῳ στόματι
  english_pob_choice: with a profane mouth
  chosen_korean: 더러운 입
  alternatives_korean:
  - 속된 입
  - 불경한 입
  lexicon: LSJ
  rationale: βεβήλος의 종교적 불결함과 모독성을 한국어로는 직관적인 ‘더러운 입’이 가장 자연스럽게 드러내지만, ‘불경한 입’도 가능한 대안입니다.
- source_word: κωφὰ καὶ μὴ δυνάμενα αὐτοῖς λαλεῖν ἢ ἀρήγειν
  english_pob_choice: deaf things ... unable to speak or help them
  chosen_korean: 귀머거리이기에 자기들에게 말하거나 도울 수 없는 것들
  alternatives_korean:
  - 말도 돕지도 못하는 귀먹은 것들
  - 말하거나 돕지 못하는 우상들
  lexicon: LSJ
  rationale: 그리스어는 우상들을 가리키지만 명사가 생략되어 있어, 형용사적 표현을 살리면서도 대상이 우상임을 문맥으로 유지했습니다.
- source_word: εἰς δὲ [τὸν θεὸν] τὶ μὴ καθήκοντα λαλῶν
  english_pob_choice: but speaking improper things against God
  chosen_korean: 또한 하나님을 향해서는 마땅하지 않은 말을 했습니다
  alternatives_korean:
  - 그러나 하나님께 불합한 말을 했습니다
  - 또 하나님을 거슬러 마땅치 않은 말을 했습니다
  lexicon: LSJ
  rationale: 괄호 친 본문은 하나님을 향한 부적절한 발화를 뜻하지만, εἰς의 방향성을 과도하게 확정하지 않도록 ‘향해서는’으로 유지했습니다.
theological_decisions:
- issue: εἰς δὲ [τὸν θεὸν]의 방향성 처리
  chosen_reading: 하나님을 향해서는 마땅하지 않은 말을 했습니다
  alternative_readings:
  - 하나님을 거슬러 마땅하지 않은 말을 했습니다
  - 하나님에 관해 마땅하지 않은 말을 했습니다
  rationale: 본문의 문맥은 우상에 대한 찬양과 대비되는 참하나님에 대한 불경한 발화이지만, 그리스어의 전치사적 방향성을 고려해 ‘향해서는’으로 옮겨 확정적 확대를 피했습니다.
  doctrine_reference: 원문이 허용하는 범위 안에서 대립을 보존하고, 해석을 과도하게 단정하지 않음.
