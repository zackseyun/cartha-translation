revisions:
- from: 그리고 왕은 크게 또 끊임없이 기쁨에 충만한 채, 모든 우상 앞에서 잔치를 베풀면서, 진리에서 멀리 떠난 마음과 더러운 입으로, 귀머거리이기에 자기들에게 말하거나 도울 수 없는 것들을 찬양하고, 또한 하나님을 향해서는 마땅하지 않은 말을 했습니다.[a]
  to: 그리고 왕은 매우 끊임없이 기쁨에 가득 차서, 모든 우상 앞에서[a] 연회를 베풀고, 진리에서 멀리 떠난 마음과 불경한 입으로, 듣지도 못하고 그 숭배자들에게 말하거나 그들을 도울 수도 없는 것들을 찬양하며, 하나님을 거슬러 마땅하지 않은 말을 했습니다.[b]
  rationale: 원문의 분사 병렬을 한국어 ‘-고, -하며, -하고’ 구조로 유지했습니다. κωφά와 μὴ δυνάμενα의 병렬을 ‘듣지도 못하고 … 수도 없는’으로 옮겨 인과관계의 첨가를 피했고, αὐτοῖς의 문맥상 지시 대상은 ‘그 숭배자들’로 밝혀 한국어의 대명사 모호성을 줄였습니다. βεβήλῳ를 ‘불경한’으로 바로잡았으며, 대괄호 읽기의 본문상 불확실성과 ἐπί 구문의 가능한 제의적 의미는 각각 각주로 보존했습니다.
  reviewer_model: gpt-5.6-terra
