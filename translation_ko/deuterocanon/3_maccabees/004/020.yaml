lexical_decisions:
- source_word: λεγόντων
  english_pob_choice: asserting
  chosen_korean: 말하기를
  alternatives_korean:
  - 주장하기를
  - 진술하기를
  lexicon: LSJ
  rationale: 분사로 이어지는 서술적 보고를 한국어 간접화법으로 자연스럽게 옮기되, 문맥의 공식적 보고 성격을 해치지 않도록 했습니다.
- source_word: μετὰ ἀποδείξεως
  english_pob_choice: with proof
  chosen_korean: 증거를 들어
  alternatives_korean:
  - 증명을 보이며
  - 입증하며
  lexicon: LSJ
  rationale: ἀπόδειξις의 핵심은 단순한 말이 아니라 입증된 근거이므로, 한국어에서는 ‘증거를 들어’로 옮겨 주장에 대한 근거 제시를 드러냈습니다.
- source_word: τὴν χαρτηρίαν
  english_pob_choice: the papyrus
  chosen_korean: 파피루스
  alternatives_korean:
  - 종이
  - 기록 재료
  lexicon: LSJ
  rationale: 고대 기록 재료인 χαρτηρίαν은 ‘종이’로 일반화하지 않고, 역사적 구체성을 살려 ‘파피루스’로 옮겼습니다.
- source_word: τοὺς γραφικοὺς καλάμους
  english_pob_choice: the writing reeds
  chosen_korean: 필기용 갈대붓
  alternatives_korean:
  - 갈대펜
  - 필기용 갈대펜
  lexicon: LSJ
  rationale: 직역하면 ‘쓰는 갈대들’이지만 한국어에서는 기능을 드러내는 ‘필기용’과 도구 의미를 살리는 ‘갈대붓’을 결합해 이해 가능성과 원문 밀착성을 함께 확보했습니다.
- source_word: ἐκλελοιπέναι
  english_pob_choice: had already run out
  chosen_korean: 이미 다 떨어졌다고
  alternatives_korean:
  - 이미 바닥났다고
  - 이미 소진되었다고
  lexicon: LSJ
  rationale: 완료상은 고갈이 이미 발생해 더 이상 남지 않은 상태를 나타내므로, 자연스러운 한국어로 ‘이미 다 떨어졌다고’ 옮겼습니다.
theological_decisions:
- issue: 해당 절의 서술체와 직접 인용의 성격
  chosen_reading: 보고 문체를 유지해, ‘말하기를’로 간접 인용 처리했습니다.
  alternative_readings:
  - 직접 인용형으로 옮겨 ‘…라고 하였습니다’에 더 강하게 묶기
  - 보다 평이하게 ‘…라고 말했습니다’로 낮추기
  rationale: 그리스어 분사구는 사건 보고의 흐름을 이어 주는 기능이 강하므로, 한국어에서도 설명적 재서술보다 보고체를 유지하는 것이 원문 효과를 더 잘 보존합니다.
  doctrine_reference: 문체/서술 신학
- issue: γραφικοὺς καλάμους의 도구 이미지
  chosen_reading: ‘갈대붓’으로 옮겨 고대 필기 도구의 물성을 살렸습니다.
  alternative_readings:
  - ‘펜’으로 일반화하기
  - ‘붓’으로 토착화하기
  rationale: 본문은 현대적 펜이 아니라 갈대라는 재료를 강조하므로, 역사적 구체성을 유지하는 번역이 원문 청중의 이해를 더 가깝게 재현합니다.
  doctrine_reference: 번역 원칙
