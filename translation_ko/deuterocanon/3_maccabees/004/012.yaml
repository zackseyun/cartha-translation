    rationale: The Greek distinguishes the city-associated compatriots from their secret going out. Korean should avoid implying two identical consecutive acts of leaving.
  - severity: low
    issue: Footnote markers are all placed at the sentence end rather than at their relevant words or clause.
    rationale: Placing the markers after ‘동족들,’ ‘빠져나간다는,’ and ‘고난 때문에’ makes each lexical or textual note readily identifiable.
  - severity: low
    issue: The note describes the contextual sense as ‘분명한,’ although the transmitted wording is acknowledged as difficult.
    rationale: A more cautious formulation better preserves the uncertainty of the problematic reading.
