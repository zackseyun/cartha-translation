- source_word: τοὺς ἐκ τῆς πόλεως ὁμοεθνεῖς
  english_pob_choice: his fellow countrymen from the city
  chosen_korean: 성읍에서 나온 자기 동족들이
  alternatives_korean:
  - 그 성읍의 자기 동족들이
  - 그 도시의 같은 민족 사람들이
  lexicon: LSJ
  rationale: ὁμοεθνεῖς는 같은 민족/동족을 뜻하므로 ‘동족’으로 살리고, 문맥상 귀속을 드러내기 위해 ‘자기’를 보탰습니다.
- source_word: κρυβῇ ἐκπορευομένους
  english_pob_choice: were secretly going out
  chosen_korean: 남몰래 나가고
  alternatives_korean:
  - 몰래 나가고
  - 비밀리에 나가고
  lexicon: LSJ
  rationale: κρυβῇ의 은밀함과 ἐκπορευομένους의 나감 동작을 간결하게 살려, 과도한 해석 없이 자연스럽게 표현했습니다.
- source_word: πυκνότερον ὑποδιδράσκειν
  english_pob_choice: more frequently slipping away
  chosen_korean: 더욱 자주 슬며시 빠져나간다는
  alternatives_korean:
  - 더 자주 빠져나간다는
  - 점점 더 자주 도망친다는
  lexicon: LSJ
  rationale: πυκνότερον은 반복적 빈도를 가리키므로 ‘더욱 자주’로, ὑποδιδράσκειν은 몰래 빠져나감의 뉘앙스를 가진 ‘슬며시 빠져나가다’로 옮겼습니다.
- source_word: τῶν ἀδελφῶν ταλαιπωρίαν / ἰχθεῖ
  english_pob_choice: because of the misery of their brothers
  chosen_korean: 자기 형제들의 고난 때문에
  alternatives_korean:
  - 형제들의 고난 때문에
  - 형제들의 고통 때문에
  lexicon: LSJ
  rationale: 전승 형태가 난해한 ἰχθεῖ는 문맥상 형제들의 고난/고통을 가리키므로, 본문이 분명히 요구하는 의미를 따라 ‘고난’으로 옮겼습니다.
theological_decisions:
- issue: 난해한 전승 형태 ἰχθεῖ의 처리
  chosen_reading: 본문의 문맥상 형제들의 고난을 원인으로 읽고 번역했습니다.
  alternative_readings:
  - 불명확한 낱말을 직역하려는 시도
  - 더 문자적인 음역 유지
  rationale: 이 절은 의미가 분명한 문맥이 전승상 난해한 형태를 압도하므로, 독자가 서술의 흐름을 이해하도록 문맥 우선으로 처리하는 것이 적절합니다.
  doctrine_reference: 본문비평 및 번역 원칙
- issue: ‘동족’과 ‘형제들’의 관계 표현
  chosen_reading: 같은 민족적 유대(동족)와 혈연/연대적 유대(형제들)를 함께 살렸습니다.
  alternative_readings:
  - 모두 ‘동포’로 평준화
  - 모두 ‘형제’로 통일
  rationale: 원문은 민족적 동일성과 형제들의 고난을 함께 제시하므로, 두 관계를 구분해 드러내는 편이 본문의 사회적 긴장을 더 잘 보존합니다.
  doctrine_reference: 서사 문맥의 의미 보존
