  source_fidelity: The draft broadly follows the Greek and appropriately retains the verse’s dependent, unfinished syntax. However, ‘성읍에서 나온 ... 남몰래 나가고’ produces an awkward and potentially confusing repetition of ‘나오다/나가다.’ The relation of ἐκ τῆς πόλεως to the compatriots is better expressed idiomatically as ‘성읍의 동족들,’ while the following participle retains the actual secret departure. The difficult transmitted ἰχθεῖ should remain identified as textually uncertain; the causal contextual rendering is acceptable when so qualified.
  naturalness: ‘그의 동족들,’ ‘그들의 형제들이 겪는 고난,’ and the repositioned footnote markers are more natural and make the referents clearer in modern formal Korean. ‘그런데’ provides a natural, non-overstated rendering of δέ.
  terminology: ‘동족’ suitably renders ὁμοεθνεῖς, while ‘형제들’ preserves ἀδελφοί without flattening the two expressions into one. ‘고난’ is an appropriate contextual rendering of ταλαιπωρία, with the textual difficulty of ἰχθεῖ disclosed in a note.
