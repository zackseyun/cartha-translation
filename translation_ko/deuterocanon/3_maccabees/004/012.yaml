lexical_decisions:
- source_word: ὡς δὲ τοῦτο ἐγενήθη
  english_pob_choice: And when this happened
  chosen_korean: 그리고 이 일이 일어나자
  alternatives_korean:
  - 이 일이 일어났을 때
  - 그런데 이 일이 일어났을 때
  lexicon: LSJ
  rationale: ὡς + aorist는 상황/시간 전환을 자연스럽게 이끌고, δέ는 한국어의 연결어미로 완만하게 처리하는 것이 적절합니다.
- source_word: ἀκούσας
  english_pob_choice: after hearing
