  text: Enraged[a], he ordered that these men too be treated in exactly the same way as those others, carefully, falling short in no way of their punishment.
  footnotes:
  - marker: a
    text: Or, 'to treat these also with the same method, carefully, as those others were treated.' The Greek phrase involving τρόπων is somewhat awkward in form, but the sense is that the same punishment was to be inflicted on this group as on the previous one.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 격노하여, 이 사람들도 저 사람들과 똑같은 방식으로 주의 깊게 대하되, 저 사람들이 받은 형벌에 어떤 면에서도 조금도 뒤지지 않도록 명령했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘똑같은 방식으로’에 해당하는 그리스어 τὸν αὐτὸν τρόπων은 형태가 다소 어색합니다. 그러나 문맥상 이 사람들에게도 앞서 언급된 사람들에게 가해진 것과 같은 처벌을, 조금도 모자람 없이 시행하라는 뜻입니다.
    reason: lexical_alternative
