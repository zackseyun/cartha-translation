base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/011.yaml
  text: When they had been brought down to the place called Schedia[a], and the voyage had been completed, as had been decreed by the king, he ordered them to encamp in the hippodrome before the city, an open area excellently suited for making an example of them, lying in full view of all who were traveling down into the city and of those being sent out from there into the country on a journey[b], so that they might neither associate with his forces nor, in general, be deemed worthy of an enclosure.
  footnotes:
  - marker: a
    text: Or 'racecourse' for 'hippodrome.' The Greek term refers specifically to a horse-racing venue before the city.
    reason: lexical_alternative
  - marker: b
    text: The final clause likely means they were to be kept from contact with the king's troops and denied even a proper enclosed lodging or protective compound.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 스케디아라 불리는 곳으로 내려가고, 왕이 정한 대로 항해도 끝나자, 그는 그들을 도시 앞의 히포드롬에 진을 치게 하도록 명령했습니다. 그곳은 그들을 본보기로 삼기에 매우 잘 맞는, 도시로 들어가는 모든 사람과 거기서 나라로 떠나가는 사람들[a]의 눈에 잘 띄는 탁 트인 곳이었으니, 그들이 그의 군대와 어울리지도 못하고, 아예 울타리가 있는 거처에도 합당하다고 여겨지지 않게 하려는 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘히포드롬’은 말 경주를 위한 경기장을 가리키는 말로, 여기서는 도시 앞의 특정 공개 장소를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: Σχεδίαν
  english_pob_choice: the place called Schedia
  chosen_korean: 스케디아라 불리는 곳
  alternatives_korean:
  - 스케디아
  - 스케디아라고 불리는 곳
  lexicon: 고유명사 표기(현대 외래어 표기법)
  rationale: 지명은 음역하되, λεγομένην의 ‘불리는’ 뉘앙스를 살려 장소명임을 분명히 했습니다.
- source_word: ἀχθέντων
  english_pob_choice: had been brought down
  chosen_korean: 내려가고
  alternatives_korean:
  - 데려가고
  - 끌려가고
  lexicon: BDAG
  rationale: 이동의 방향성을 살리면서도 한국어 문장 흐름에 맞게 ‘내려가다’로 옮겼습니다.
- source_word: ἱπποδρόμῳ
  english_pob_choice: hippodrome
  chosen_korean: 히포드롬
  alternatives_korean:
  - 경마장
  - 경주장
  lexicon: LSJ
  rationale: 그리스어 용어의 역사적·구체적 장소성을 보존하기 위해 음역을 택했고, 일반화된 ‘경마장’보다 원문 감각을 더 직접적으로 드러냅니다.
- source_word: πρὸς παραδειγματισμὸν
  english_pob_choice: for making an example of them
  chosen_korean: 그들을 본보기로 삼기에
  alternatives_korean:
  - 공적 망신을 주기에
  - 징벌의 본보기로
  lexicon: LSJ
  rationale: ‘본보기로 삼다’가 공개적 경고와 징벌의 기능을 함께 담아, 원문의 수치·위협 효과를 유지합니다.
- source_word: περιβόλῳ
  english_pob_choice: an enclosure
  chosen_korean: 울타리가 있는 거처
  alternatives_korean:
  - 둘러막힌 거처
  - 울타리 안의 거처
  lexicon: LSJ
  rationale: 단순한 시설 개념보다, 그들이 최소한의 보호된 거처조차 부여받지 못했다는 모욕적 뉘앙스를 한국어로 드러냈습니다.
theological_decisions:
- issue: 왕의 명령에 따른 공개적 수치 부여의 의미
  chosen_reading: 본문은 단순한 행정 지시가 아니라, 사람들을 공개적으로 노출시켜 통제와 수치를 동시에 가하는 폭력적 처분으로 읽었습니다.
  alternative_readings:
  - 중립적인 숙영 지시로 읽기
  - 단순 경비 배치로 읽기
  rationale: πρὸς παραδειγματισμόν과 시야 노출, 그리고 마지막의 배제 표현이 결합되어 있어, 본문은 공개적 모욕의 의도를 강하게 드러냅니다.
  doctrine_reference: 성경의 역사서술에 나타나는 권력의 폭력성과 수치의 신학
