translation:
  language: ko
  text: 그리고 온 민족을 이름대로[a] 등록하게 하되, 그들의 직무에 따른 앞서 잠시[오] 미리 알려진 봉사를 위한 것이 아니라, 명령된 잔혹한 고문[b]을 당하게 하여, 하루라는 한정된 때 안에 완전히 멸망시키려는 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘이름별로’에 가깝습니다. 개인마다 특정해 등록한다는 뜻을 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: 헬라어는 단순한 ‘고문’보다도, 공식적으로 명령된 잔혹한 가혹행위를 함께 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν τὸ φῦλον
  english_pob_choice: the whole nation
  chosen_korean: 온 민족
  alternatives_korean:
  - 온 백성
  - 온 사람들
  - 온 부족
  lexicon: LSJ
  rationale: φῦλον은 여기서 한 부족이 아니라 집단 전체를 가리키므로, 한국어에서는 국가 단위의 뉘앙스를 과도하게 만들지 않으면서 집합성을 살리는 ‘민족’이 가장 적절합니다.
- source_word: ἀπογραφῆναι
  english_pob_choice: should be registered
  chosen_korean: 등록하게 하되
  alternatives_korean:
  - 기록하게 하되
  - 명부에 올리게 하되
  - 조사해 적게 하되
  lexicon: LSJ
  rationale: 공적 명부 작성의 행정적 의미를 살려 ‘등록하다’로 옮겼습니다.
- source_word: ἐξ ὀνόματος
  english_pob_choice: by name
  chosen_korean: 이름대로[a]
  alternatives_korean:
  - 이름별로
  - 이름을 따라
  - 개인별로
  lexicon: LSJ
  rationale: 개별 식별의 힘을 드러내기 위해 ‘이름대로’로 옮겼고, 이는 ‘by name’의 개인화된 등록을 자연스럽게 전달합니다.
- source_word: τῶν ἔργων κατὰ τρόπον λατρείαν
  english_pob_choice: service according to their work
  chosen_korean: 그들의 직무에 따른 … 봉사
  alternatives_korean:
  - 그들의 일에 따른 봉사
  - 그들의 업무에 맞는 봉사
  - 그들의 일에 맞춘 섬김
  lexicon: LSJ
  rationale: ἔργα는 구체적인 ‘일/직무’를 가리키므로 추상적인 ‘기능’보다 ‘직무’가 원문의 구체성을 더 잘 살립니다.
- source_word: στρεβλούμεντας δὲ παρηγγελμέναις αἰκίαις
  english_pob_choice: but, by being tortured with the ordered cruelties
  chosen_korean: 명령된 잔혹한 고문[b]을 당하게 하여
  alternatives_korean:
  - 명령된 잔혹행위로 고문하며
  - 명령된 가혹한 형벌로 괴롭혀
  - 지시된 잔혹한 고문으로 괴롭게 하여
  lexicon: LSJ
  rationale: στρεβλόω의 고문 의미와 αἰκίαι의 폭력성을 함께 살려, 공식적으로 지시된 잔학함이라는 점을 드러냈습니다.
theological_decisions:
- issue: 하루라는 시간 표현의 압축과 처형 의도
  chosen_reading: ‘하루라는 한정된 때 안에 완전히 멸망시키려는 것’으로 옮겨, 단순한 기간 언급이 아니라 계획된 전멸 의도를 드러냈습니다.
  alternative_readings:
  - ‘하루 안에 멸망시키려는 것’
  - ‘하루라는 때에 파괴하려는 것’
  rationale: τὸ τέλος ἀφανίσαι와 μιᾶς ὑπὸ καιρὸν ἡμέρας는 전멸의 의도와 시간적 압축을 함께 전하므로, 한국어에서도 둘을 모두 드러내는 것이 적절합니다.
  doctrine_reference: 폭력의 전면성과 하나님의 백성에 대한 박해 묘사
