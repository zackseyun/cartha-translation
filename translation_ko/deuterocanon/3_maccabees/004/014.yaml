translation:
  language: ko
  text: 그리고 온 민족을 이름대로[a] 등록하게 하되, 그들의 직무에 따른 앞서 잠시[오] 미리 알려진 봉사를 위한 것이 아니라, 명령된 잔혹한 고문[b]을 당하게 하여, 하루라는 한정된 때 안에 완전히 멸망시키려는 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘이름별로’에 가깝습니다. 개인마다 특정해 등록한다는 뜻을 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: 헬라어는 단순한 ‘고문’보다도, 공식적으로 명령된 잔혹한 가혹행위를 함께 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν τὸ φῦλον
  english_pob_choice: the whole nation
  chosen_korean: 온 민족
  alternatives_korean:
  - 온 백성
  - 온 사람들
  - 온 부족
  lexicon: LSJ
  rationale: φῦλον은 여기서 한 부족이 아니라 집단 전체를 가리키므로, 한국어에서는 국가 단위의 뉘앙스를 과도하게 만들지 않으면서 집합성을 살리는 ‘민족’이 가장 적절합니다.
- source_word: ἀπογραφῆναι
  english_pob_choice: should be registered
  chosen_korean: 등록하게 하되
