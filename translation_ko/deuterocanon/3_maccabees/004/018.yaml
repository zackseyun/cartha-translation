translation:
  language: ko
  text: 비록 대부분이 아직 그 지방에[a] 있었고, 그들 가운데 어떤 이들은 아직 집집마다 모여 있었으며 또 어떤 이들은 그 장소에도[b] 있었지만, 애굽을 맡은 모든 장군에게는 그 형편이 감당할 수 없게 되어 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘대부분이 아직 그 땅 전역에 있었다’.
    reason: lexical_alternative
  - marker: b
    text: ‘그 장소에도’는 헬라어에서 생략된 표현으로, 다른 이들이 특정 장소 또는 지역에 있었음을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καίπερ
  english_pob_choice: even though
  chosen_korean: 비록 …-지만 / 비록 … 있었고
  alternatives_korean:
  - 그럼에도 불구하고
  - …이긴 하지만
  lexicon: LSJ
  rationale: 양보를 여는 접속사로, 뒤의 난처한 상황과 긴장을 이루는 뜻을 한국어에서도 분명히 살리기 위해 비록 구조를 택했습니다.
- source_word: κατὰ τὴν χώραν
  english_pob_choice: in the country
  chosen_korean: 그 지방에
  alternatives_korean:
  - 그 땅에
  - 온 땅에
  lexicon: LSJ
  rationale: χώρα는 여기서 넓은 지역이나 지방을 가리키므로, 애굽의 문맥을 유지하면서도 지나치게 현대적 행정구역처럼 들리지 않는 ‘그 지방’으로 옮겼습니다.
- source_word: τῶν μὲν κατὰ τὰς οἰκίας ἔτι συνεστηκότων
  english_pob_choice: some still assembled in their houses
  chosen_korean: 어떤 이들은 아직 자기 집들에서 함께 모여 있었으며
  alternatives_korean:
  - 어떤 이들은 아직 집들에서 모여 있었으며
  - 어떤 이들은 아직 집 안에 함께 서 있었으며
  lexicon: LSJ
  rationale: συνεστηκότων은 단순 존재보다 ‘함께 서 있다/모이다’는 집합의 뉘앙스가 강해, 한국어에서는 자연스럽게 ‘함께 모여 있었습니다’로 옮겼습니다.
- source_word: τῶν δὲ καὶ κατὰ τὸν τόπον
  english_pob_choice: and others also in the place
  chosen_korean: 또 어떤 이들은 그 장소에도 있었지만
  alternatives_korean:
  - 또 다른 이들은 그곳에도 있었지만
  - 그리고 다른 이들은 그 장소에 있었지만
  lexicon: LSJ
  rationale: τόπος 앞의 정관사는 문맥상 특정한 장소를 가리키지만, 본문이 그 장소를 더 규정하지 않으므로 엘립시스를 보존해 ‘그 장소’로 두었습니다.
- source_word: ὡς ἀδυνάτου καθεστῶτος
  english_pob_choice: since the situation had become impossible
  chosen_korean: 사정이 불가능하게 되었기 때문입니다
  alternatives_korean:
  - 상황이 불가능한 상태가 되었기 때문입니다
  - 형편이 더는 불가능해졌기 때문입니다
  lexicon: LSJ
  rationale: καθεστῶτος는 ‘상태가 정해지다/자리잡다’의 의미가 있어 단순 감정이 아니라 객관적 형편의 굳어진 상태를 나타내도록 ‘사정이 … 되다’로 옮겼습니다.
theological_decisions:
- issue: 애굽의 모든 장군(πᾶσιν τοῖς ἐπ᾽ Αἴγυπτον στρατηγοῖς) 표현
