  rationale: 본문은 특정 종교 용어가 아니라 권한을 가진 군사 지도층을 가리키므로, 과도한 관료화나 후대식 직함을 피하고 원문의 권위 범위를 간결하게 살렸습니다.
  doctrine_reference: 역사 서술의 직역 원칙
