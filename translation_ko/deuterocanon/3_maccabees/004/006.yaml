base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/006.yaml
  text: And the young women who had just entered the bridal chamber for the sharing of life in marriage[a], taking up lamentation instead of joy, and with their perfume-drenched hair smeared with dust, were being led away unveiled, and with one accord raised a dirge instead of wedding songs[c][b], as though torn apart by abuse from foreigners.
  footnotes:
  - marker: a
    text: Or 'the marriage-bed' for 'the bridal chamber' (γαμικὸν ... παστόν).
    reason: lexical_alternative
  - marker: b
    text: Literally 'unveiled' or 'with heads uncovered,' a sign of public humiliation in this context.
    reason: cultural_note
  - marker: c
    text: Or 'by foreigners' instead of 'from foreigners'; the Greek highlights abuse associated with people of another nation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 삶을 함께 나누는 혼인을 위해 이제 막 신방에 들어간 젊은 여자들은[a] 기쁨 대신 통곡을 맞이하였고, 향유로 젖은 머리칼에 먼지를 묻힌 채 머리를 가리지 않은 채 끌려가면서,[b] 혼인 노래 대신 애가를 한목소리로 불렀습니다. 마치 다른 민족 사람들에게 학대를 받아 찢긴 듯했습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘혼인침상’으로 옮길 수 있습니다(γαμικὸν ... παστόν).
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘덮개 없이’입니다. 문맥상 ‘베일을 쓰지 않고’ 또는 ‘머리를 가리지 않고’를 뜻하며, 이 장면에서는 공적 수치의 표시입니다.
    reason: cultural_note
  - marker: c
    text: 그리스어는 ‘다른 민족 사람들에게 학대를 받아’로 이해할 수 있습니다. 또한 ‘이질적이거나 외국의 학대에’라는 뉘앙스로 이해될 여지도 있습니다(αἰκίαις ἀλλοεθνεῖσιν).
    reason: lexical_alternative
