base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/006.yaml
  text: And the young women who had just entered the bridal chamber for the sharing of life in marriage[a], taking up lamentation instead of joy, and with their perfume-drenched hair smeared with dust, were being led away unveiled, and with one accord raised a dirge instead of wedding songs[c][b], as though torn apart by abuse from foreigners.
  footnotes:
  - marker: a
    text: Or 'the marriage-bed' for 'the bridal chamber' (γαμικὸν ... παστόν).
    reason: lexical_alternative
  - marker: b
    text: Literally 'unveiled' or 'with heads uncovered,' a sign of public humiliation in this context.
    reason: cultural_note
  - marker: c
    text: Or 'by foreigners' instead of 'from foreigners'; the Greek highlights abuse associated with people of another nation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이제 막 혼인의 삶을 함께하기 위해 신방에 들어간 젊은 여자들은[a] 기쁨 대신 통곡을 받아들였고, 향유로 젖은 머리칼에 먼지를 묻힌 채, 얼굴을 가리지 않은 상태로 끌려가며[b] 혼인 노래[c] 대신 애가를 한목소리로 불렀습니다. 마치 이방 사람들의 학대에 찢긴 것처럼 말입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘혼인침상’으로도 옮길 수 있습니다(γαμικὸν ... παστόν).
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘얼굴을 가리지 않고’ 또는 ‘머리를 가리지 않고’입니다. 이 장면에서는 공적 수치의 표시입니다.
    reason: cultural_note
  - marker: c
    text: 직역하면 ‘혼례 노래’ 또는 ‘결혼 노래’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: γαμικὸν ... παστόν
  english_pob_choice: the bridal chamber
  chosen_korean: 신방
  alternatives_korean:
  - 혼인방
  - 결혼방
  - 신혼방
  lexicon: LSJ
  rationale: 가나/혼인 장면에 자연스럽고, 혼인 직후의 방이라는 의미를 살리면서도 한국어 성경 문맥에서 이해하기 쉬운 표현입니다.
- source_word: ἀντὶ τέρψεως μεταλαβοῦσαι γόους
  english_pob_choice: taking up lamentation instead of joy
  chosen_korean: 기쁨 대신 통곡을 받아들였고
  alternatives_korean:
  - 기쁨 대신 애통을 지니고
  - 즐거움 대신 슬픔을 취했고
  - 기쁨 대신 애곡을 시작했고
  lexicon: LSJ
  rationale: ἀντί의 교체 대조를 살려 ‘대신’으로 옮기고, γόους는 예식의 파탄을 드러내는 강한 슬픔을 한국어의 ‘통곡’으로 표현했습니다.
- source_word: ἀκαλύπτως
  english_pob_choice: unveiled
  chosen_korean: 얼굴을 가리지 않은 상태로
  alternatives_korean:
  - 베일을 쓰지 않은 채
  - 머리를 가리지 않은 채
  - 무개로
  lexicon: LSJ
  rationale: 공적인 수치와 노출의 뉘앙스를 살리되, 현대 독자가 바로 이해할 수 있도록 ‘얼굴을 가리지 않은 상태로’로 풀었습니다.
- source_word: θρῆνον ἀνθ᾽ ὑμεναίων
  english_pob_choice: a dirge instead of wedding songs
  chosen_korean: 혼인 노래 대신 애가를
  alternatives_korean:
  - 혼례 노래 대신 만가를
  - 신방 노래 대신 애곡을
  - 혼인 축가 대신 곡조를
  lexicon: LSJ
  rationale: ὑμεναίων의 혼인 축가/혼례 노래와 θρῆνον의 장송적 성격을 대조적으로 살려 문맥의 반전을 드러냈습니다.
- source_word: ἀλλοεθνεῖσιν
  english_pob_choice: from foreigners
  chosen_korean: 이방 사람들의
  alternatives_korean:
  - 다른 민족의
  - 외국인의
  - 타민족의
  lexicon: LSJ
  rationale: 유대 문맥에서의 민족적 타자성을 살려 ‘이방 사람들’로 옮겼고, 이어지는 ‘학대’와 자연스럽게 연결되도록 했습니다.
theological_decisions:
- issue: 혼인 장면의 수치와 폭력성
  chosen_reading: 신방에 들어간 젊은 여자들이 공개적으로 끌려가며 애가를 부르는 장면을 그대로 살려, 수치와 폭력의 역전이 드러나게 했습니다.
  alternative_readings:
  - 부드럽게 완화하여 단순한 슬픔으로 옮길 수 있음
  - ‘끌려가며’를 약화해 단순 이동으로 처리할 수 있음
  rationale: 본문은 혼인의 기쁨이 공적 수치와 폭력으로 전복되는 충격을 강조하므로, 그 긴장을 약화하지 않는 번역이 필요합니다.
  doctrine_reference: 서사적·문학적 강조 보존
