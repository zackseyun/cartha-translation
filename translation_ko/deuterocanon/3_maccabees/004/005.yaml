base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/005.yaml
  text: For an old man was being led along[a], full of gray hair, bent over by the weakness in his feet that comes with age, driven by the violent force of being thrown down[c][b], making use of a swift march without any regard for all dignity.
  footnotes:
  - marker: a
    text: The Greek phrase rendered 'driven by the violent force of being thrown down' is compressed and difficult; it conveys harsh, violent compulsion, possibly with the sense of stumbling or being knocked about.
    reason: lexical_alternative
  - marker: b
    text: Or 'without any shame' / 'with no regard for propriety' for 'without any regard for all dignity.'
    reason: lexical_alternative
  - marker: c
    text: The final phrase may also be understood as 'being forced into a rapid pace' rather than 'making use of a swift march.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 한 노인이 이끌려 가고 있었는데, 머리는 온통 백발이었고, 나이로 인한 그의 발의 무기력 때문에 몸이 굽어 있었으며, 거칠게 내동댕이쳐진 힘에 밀려, 온갖 품위를 돌아보지 않고 재빠르게 걸어가고 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greek ἀνατροπή는 ‘넘어뜨림, 전복, 뒤집힘’ 등으로 이해될 수 있는 압축적이고 난해한 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ἁπάσης αἰδοῦς ἄνευ는 ‘모든 품위 없이’ 또는 ‘전혀 수치 없이’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: πρὸς ὀξειαν καταχρώμενος πορείαν은 ‘빠른 걸음으로 나아가며’ 혹은 ‘급히 이동하며’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγετο
  english_pob_choice: was being led along
  chosen_korean: 이끌려 가고 있었습니다
  alternatives_korean:
  - 끌려가고 있었습니다
  - 데려가고 있었습니다
  lexicon: LSJ
  rationale: 미완료 수동의 진행성을 살리면서도, 단순한 동행이 아니라 강제된 이동의 뉘앙스를 자연스럽게 드러냅니다.
- source_word: γέρων πλήρης πολιᾶς
  english_pob_choice: old man / full of gray hair
  chosen_korean: 한 노인 / 머리는 온통 백발이었고
  alternatives_korean:
  - 늙은 사람 / 백발이 가득했고
  - 연로한 남자 / 하얗게 센 머리였고
  lexicon: LSJ
  rationale: γέρων은 여기서 직분이 아닌 연령을 가리키므로 ‘노인’으로 옮기고, πλήρης πολιᾶς의 생생한 노화 이미지는 ‘온통 백발’로 살렸습니다.
- source_word: τὴν ἐκ τοῦ γήρως νωθρίτητα ποδῶν ἐπικύφων
  english_pob_choice: bent over by the weakness in his feet that comes with age
  chosen_korean: 나이로 인한 그의 발의 무기력 때문에 몸이 굽어 있었으며
  alternatives_korean:
  - 노쇠로 인한 발의 둔함 때문에 몸이 굽어 있었으며
  - 노쇠로 발이 무기력해져 몸이 굽어 있었으며
  lexicon: LSJ
  rationale: νωθρίτης는 ‘무기력/둔함/느림’의 뜻을 가지므로, 발의 기능 저하를 드러내는 한국어로 풀어 옮겼습니다. ἐπικύφων의 자세 묘사는 ‘몸이 굽어’로 반영했습니다.
- source_word: ἀνατροπῆς ὁρμῇ βιαίας
  english_pob_choice: driven by the violent force of being thrown down
  chosen_korean: 거칠게 내동댕이쳐진 힘에 밀려
  alternatives_korean:
  - 거센 전복의 힘에 밀려
  - 폭력적으로 쓰러뜨려진 힘에 밀려
  lexicon: LSJ
  rationale: 이 구절은 압축되고 난해하므로, ἀνατροπή가 지닌 ‘뒤집힘/넘어뜨림/전복됨’의 폭력성을 살리되 과잉 해석을 피하는 표현으로 옮겼습니다.
- source_word: ἁπάσης αἰδοῦς ἄνευ
  english_pob_choice: without any regard for all dignity
  chosen_korean: 온갖 품위를 돌아보지 않고
  alternatives_korean:
  - 아무런 수치도 없이
  - 전혀 체면을 돌아보지 않고
  - 모든 예의를 무시하고
  lexicon: LSJ
  rationale: αἰδώς는 ‘수치’만이 아니라 품위·예의·절도까지 포함할 수 있으므로, 노인에게 가해진 무례와 품위 상실을 함께 드러내는 ‘온갖 품위’로 옮겼습니다.
- source_word: πρὸς ὀξειαν καταχρώμενος πορείαν
  english_pob_choice: making use of a swift march
  chosen_korean: 재빠르게 걸어가고 있었습니다
  alternatives_korean:
  - 급한 걸음으로 가고 있었습니다
  - 서둘러 행진하고 있었습니다
  lexicon: LSJ
  rationale: καταχρώμενος + πορείαν은 단순한 보행보다 강요된 빠른 이동을 뜻하므로, 한국어에서는 자연스러운 진행형으로 옮기되 속도와 부자연스러움을 유지했습니다.
theological_decisions:
- issue: 노인의 학대적 이동 묘사에서 폭력성과 무례의 강도
  chosen_reading: 단순히 빨리 걷는 장면이 아니라, 몸이 굽은 노인을 거칠게 몰아세워 품위를 무시한 채 급히 이동시키는 폭력적 상황으로 읽었습니다.
  alternative_readings:
  - 그저 서둘러 가는 모습으로 완화해 읽기
  - 전복/정치적 ‘전복됨’으로 과도하게 구체화해 읽기
  rationale: 문맥상 핵심은 노인의 연약함과 그에 대한 폭력적 취급이며, Greek의 압축된 표현이 드러내는 잔혹함을 약화시키지 않도록 했습니다.
  doctrine_reference: 문학적·윤리적 맥락 해석
