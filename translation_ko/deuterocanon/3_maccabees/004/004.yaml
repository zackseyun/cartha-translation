  lexicon: LSJ
  rationale: ἔλεος의 핵심을 ‘연민’으로 살리되, κοινός가 가리키는 인간 보편의 공유 감각을 ‘공동의’로 간결하게 반영했습니다.
- source_word: τὴν ἄδηλον τοῦ βίου καταστροφήν
  english_pob_choice: the uncertain ruin of their life
  chosen_korean: 자기 생명의 불확실한 파멸
  alternatives_korean:
  - 삶의 불확실한 끝
  - 자기 삶의 알 수 없는 붕괴
  lexicon: LSJ
  rationale: ἄδηλον의 ‘알 수 없음/불확실함’과 καταστροφή의 ‘파멸/전복’을 함께 살려, 장차 닥칠 운명의 불안감을 드러냈습니다.
- source_word: τὴν δυσάθλιον ἐξαποστολήν
  english_pob_choice: their wretched deportation
  chosen_korean: 비참한 추방
  alternatives_korean:
  - 비참한 내보냄
