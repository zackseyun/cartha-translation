  naturalness: ‘자비 없는 영의 쓰라린 잔혹함’, ‘공동의 연민’, ‘자기 생명의 불확실한 파멸’은 현대 표준 한국어에서 다소 직역투이며 특히 ‘자기’의 지시 대상이 불명확합니다. ‘무자비한 마음에서 나온 쓰라린 잔혹함’, ‘인간이라면 누구나 느낄 연민’, ‘그들의 삶에 닥칠 알 수 없는 파멸’로 옮기면 의미와 문장 흐름이 자연스럽습니다.
  terminology: ψυχή는 여기서 신학적 의미의 ‘영’이라기보다 내적 성향을 가리키므로 ‘마음’이 적절합니다. στρατηγοί는 문맥상 ‘각 도시의 지휘관들’로 번역하여 직책의 정확한 성격을 과도하게 특정하지 않습니다. ἐξαπεστέλλοντο와 ἐξαποστολή는 강제 이송의 문맥을 반영해 본문에서는 ‘내보내다/내보냄’으로 대응시키고, 각주에서 ‘강제 추방’ 가능성을 밝힙니다.
