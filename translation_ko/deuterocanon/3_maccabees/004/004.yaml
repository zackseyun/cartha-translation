  lexicon: LSJ
  rationale: 동사의 문자적 의미는 ‘보내다/내보내다’이지만, 문맥상 강제적 제거를 가리키므로 POB의 해설에 맞춰 능동적 폭력을 드러내는 표현을 택했습니다.
- source_word: τὸν κοινὸν ἔλεον
  english_pob_choice: the common pity
  chosen_korean: 공동의 연민
  alternatives_korean:
