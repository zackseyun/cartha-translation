base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/004.yaml
  text: For with the bitter cruelty of a merciless spirit they were being sent out together by the generals in each city[a], so that, beyond the outrageous punishments, even some of their enemies, seeing the common pity before their eyes and considering the uncertain ruin of their life[b], were weeping over their wretched deportation.
  footnotes:
  - marker: a
    text: Or 'were being driven out' / 'were being deported' for 'were being sent out'; the Greek verb itself is literally 'sent out,' but the context is clearly forced removal.
    reason: lexical_alternative
  - marker: b
    text: '''The common pity'' means the ordinary compassion shared by human beings generally; even some enemies were moved by it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 각 도시의 총독들에 의해, 자비 없는 영의 쓰라린 잔혹함으로 함께 내쫓기고 있었습니다[a]. 그래서 그들은 터무니없는 형벌들에 더하여, 원수들 가운데서도 어떤 이들은 눈앞에 있는 공동의 연민을 보고, 자기 생명의 불확실한 파멸을 헤아리며, 그들의 비참한 추방을 두고 눈물을 흘렸습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내쫓기고 있었습니다’는 문자적으로는 ‘보내지고 있었습니다’에 가깝지만, 문맥상 강제 추방을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘공동의 연민’은 사람들에게 일반적으로 공유된 연민을 뜻하며, 심지어 원수들까지도 그 감정에 움직였다는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ πικρίας ἀνοίκτου ψυχῆς
  english_pob_choice: with the bitter cruelty of a merciless spirit
  chosen_korean: 자비 없는 영의 쓰라린 잔혹함으로
  alternatives_korean:
  - 무자비한 마음의 쓴 냉혹함으로
  - 긍휼 없는 영의 쓰라림으로
  lexicon: LSJ
  rationale: πικρίας와 ἀνοίκτου ψυχῆς가 함께 만드는 내적 태도의 강도를 살려, 감정의 차가움과 잔혹성을 모두 드러내는 표현으로 옮겼습니다.
- source_word: στρατηγῶν
  english_pob_choice: generals
  chosen_korean: 총독들
  alternatives_korean:
  - 장군들
  - 지휘관들
  lexicon: LSJ
  rationale: 이 문맥의 στρατηγός는 단순 군사 지휘관보다 도시별 공적 통치자를 가리킬 수 있으므로, 도시 행정권을 드러내는 ‘총독들’로 옮겼습니다.
- source_word: ἐξαπεστέλλοντο
  english_pob_choice: were being sent out
  chosen_korean: 내쫓기고 있었습니다
  alternatives_korean:
  - 내보내지고 있었습니다
  - 추방되고 있었습니다
  lexicon: LSJ
  rationale: 동사의 문자적 의미는 ‘보내다/내보내다’이지만, 문맥상 강제적 제거를 가리키므로 POB의 해설에 맞춰 능동적 폭력을 드러내는 표현을 택했습니다.
- source_word: τὸν κοινὸν ἔλεον
  english_pob_choice: the common pity
  chosen_korean: 공동의 연민
  alternatives_korean:
  - 보편적 연민
  - 모두가 나누는 연민
  lexicon: LSJ
  rationale: ἔλεος의 핵심을 ‘연민’으로 살리되, κοινός가 가리키는 인간 보편의 공유 감각을 ‘공동의’로 간결하게 반영했습니다.
- source_word: τὴν ἄδηλον τοῦ βίου καταστροφήν
  english_pob_choice: the uncertain ruin of their life
  chosen_korean: 자기 생명의 불확실한 파멸
  alternatives_korean:
  - 삶의 불확실한 끝
  - 자기 삶의 알 수 없는 붕괴
  lexicon: LSJ
  rationale: ἄδηλον의 ‘알 수 없음/불확실함’과 καταστροφή의 ‘파멸/전복’을 함께 살려, 장차 닥칠 운명의 불안감을 드러냈습니다.
- source_word: τὴν δυσάθλιον ἐξαποστολήν
  english_pob_choice: their wretched deportation
  chosen_korean: 비참한 추방
  alternatives_korean:
  - 비참한 내보냄
  - 가엾은 축출
  lexicon: LSJ
  rationale: ἐξαποστολή의 강제적 ‘보냄’은 문맥상 ‘추방’이 가장 자연스럽고, δυσάθλιον의 비참함을 그대로 보존했습니다.
theological_decisions:
- issue: 공동의 연민을 누가 느끼는가
  chosen_reading: 원수들 가운데서도 어떤 이들이 인간에게 공통된 연민에 마음이 움직였습니다.
  alternative_readings:
  - 모두가 동일한 연민을 느꼈다는 뜻으로 읽을 수 있습니다.
  - 원수들도 일시적으로 동정심을 보였다는 뜻으로 읽을 수 있습니다.
  rationale: 본문은 잔혹한 처벌에도 불구하고 적대자들조차 인간 보편의 연민을 외면하지 못했음을 강조하므로, 보편적 정서의 침투를 살렸습니다.
  doctrine_reference: 인간의 양심과 보편적 공감에 대한 성경적 증언
