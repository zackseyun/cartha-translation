  naturalness: ‘민중의 공개 잔치’는 현대 한국어에서 다소 어색하고 의미가 겹칩니다. ‘민족들 가운데서 함성과 기쁨을 곁들인 공적인 잔치가 벌어졌습니다’가 문맥과 합쇼체에 자연스럽습니다. 비교절은 ‘것과 같았습니다’로 처리하여 원문의 ὡς ἂν에 따른 비유적·설명적 연결을 유지했습니다.
  terminology: πρόσταγμα는 왕권의 공식 명령이라는 문맥에 맞추어 ‘칙령’으로 옮겼습니다. ἔθνεσιν은 본문에서 ‘민족들’로 유지하되, 비유대인 주민이라는 문맥적 가능성은 각주로 밝혔습니다. εὐωχία는 식사 자체보다 축제적 잔치의 뜻을 살려 ‘잔치’로, ἀπεχθεία는 교리적 함의 없이 ‘미움’으로 옮겼습니다.
