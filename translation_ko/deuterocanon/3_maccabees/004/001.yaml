base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/001.yaml
  text: And everywhere this decree arrived[a], a public celebration was organized among the nations with shouting and joy[b], as though the hatred long before dancing in their minds against them were now being openly displayed with boldness.
  footnotes:
  - marker: a
    text: Or 'among the nations.' The Greek ἔθνεσιν can denote nations generally, but here likely refers to the non-Jewish populace.
    reason: lexical_alternative
  - marker: b
    text: The Greek participle behind 'long before leaping within' is vivid and somewhat difficult; it suggests hostility already stirring or springing up in their inner thoughts before this moment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이 명령이 닿는 곳마다, 민중의 공개 잔치가 민족들 가운데서 함성과 기쁨으로 열렸습니다[a][b]. 마치 오래전부터 그들 마음속에서 뛰놀던 미움이 이제는 대담하게 드러나고 있는 것처럼 말입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘민족들 가운데서’. 그리스어 ἔθνεσιν은 일반적으로 민족들을 뜻할 수 있으나, 여기서는 아마 비유대인 주민들을 가리키는 듯합니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 분사구 뒤의 이미지는 난해합니다. 그 미움이 이미 오래전부터 마음속에서 움직이고 있었음을 시사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντῃ
  english_pob_choice: everywhere
  chosen_korean: 그리고 이 명령이 닿는 곳마다
  alternatives_korean:
  - 어디에나
  - 곳곳마다
  lexicon: LSJ
  rationale: 범위의 분포를 자연스러운 한국어로 살리면서, 뒤따르는 προσέπιπτεν의 ‘도착’ 이미지를 문맥상 드러냅니다.
- source_word: πρόσταγμα / προσέπιπτεν
  english_pob_choice: decree / arrived
  chosen_korean: 명령이 닿는 곳마다
  alternatives_korean:
  - 조서가 도착할 때마다
  - 칙령이 전해질 때마다
  lexicon: LSJ
  rationale: 왕의 공식 명령이라는 점은 살리되, 한국어에서는 ‘닿다’가 장소별 확산을 간결하게 보여 줍니다.
- source_word: δημοτελὴς συνίστατο τοῖς ἔθνεσιν εὐωχία
  english_pob_choice: a public celebration was organized among the nations
  chosen_korean: 민중의 공개 잔치가 민족들 가운데서 열렸습니다
  alternatives_korean:
  - 공공 잔치가 민족들 가운데 마련되었습니다
  - 백성의 잔치가 민족들 사이에서 열렸습니다
  lexicon: LSJ
  rationale: δημοτελής의 공적 성격과 εὐωχία의 축제/잔치를 함께 반영했습니다. τοῖς ἔθνεσιν은 본문과 영어 주석의 유보를 따라 ‘민족들 가운데서’로 두어, 비유대인 집단 전반을 뜻할 가능성을 열어 둡니다.
- source_word: ἀλαλαγμῶν καὶ χαρᾶς
  english_pob_choice: with shouting and joy
  chosen_korean: 함성과 기쁨으로
  alternatives_korean:
  - 외침과 기쁨으로
  - 환호와 기쁨으로
  lexicon: LSJ
  rationale: ἁλαλαγμός의 강한 소리 이미지는 ‘함성’이 가장 직접적으로 살리고, χαρά는 기본 의미인 기쁨으로 옮겼습니다.
- source_word: προκατεσκιρωμένης ... ἀπεχθείας
  english_pob_choice: the hatred long before dancing in their minds
  chosen_korean: 오래전부터 그들 마음속에서 뛰놀던 미움
  alternatives_korean:
  - 오래전부터 그들 생각 속에서 솟구치던 적대감
  - 미리부터 그들 마음에 일렁이던 증오
  lexicon: LSJ
  rationale: 영어 POB가 포착한 난해한 참여구문을 따라, ‘뛰놀다’로 동적 이미지를 살렸습니다. ἀπεχθεία는 ‘미움’으로 두어 감정의 적대성을 과도하게 해석하지 않게 했습니다.
theological_decisions:
- issue: τοῖς ἔθνεσιν의 번역 범위
  chosen_reading: ‘민족들 가운데서’로 옮겨, 비유대인 집단을 뜻할 수 있는 열린 표현을 유지했습니다.
  alternative_readings:
  - ‘열국 가운데서’
  - ‘이방인들 가운데서’
  rationale: 이 절은 유대-비유대 대조를 암시하지만, 본문 자체는 보다 일반적인 ‘민족들’도 허용합니다. 영어 POB 주석의 유보를 반영해 해석을 고정하지 않았습니다.
  doctrine_reference: 원문 우선 번역; 해석 여지를 보존하는 POB 스타일
- issue: 직접 인용 없이 서술체 유지
  chosen_reading: 본문은 서술형으로 유지하고, 감정적 대비를 설명하는 절의 구조를 그대로 살렸습니다.
  alternative_readings:
  - 문장을 더 압축해 단순 서술로 재구성
  - ‘마치’ 이하를 별도 절로 분리
  rationale: 본문의 비교절(ὡς ἂν)을 훼손하지 않기 위해, 문장 안에서 대비를 유지했습니다.
  doctrine_reference: 원문 수사 구조 보존
