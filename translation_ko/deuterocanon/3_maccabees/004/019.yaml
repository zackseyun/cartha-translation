translation:
  language: ko
  text: 그러나 그들은 자신들이 도피를 위한 계책의 일부로 뇌물을 받은 것이라고 하여, 오히려 더 엄하게 그들에게 설득되었습니다[a]. 그리고 그것에 대해 그가 분명히 확신하게 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 문장은 압축되고 다소 어색하므로, 마지막 절은 ‘그가 이것을 확신하게 되었습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπείσθησαν
  english_pob_choice: they were persuaded
  chosen_korean: 그들은 … 설득되었습니다
  alternatives_korean:
  - 그들은 … 납득되었습니다
  - 그들은 … 확신하게 되었습니다
  lexicon: LSJ
  rationale: 수동형 πείθω의 의미를 살리면서, 행위 주체를 드러내지 않는 영어 POB의 처리를 따라 한국어도 수동으로 옮겼습니다.
- source_word: αὐτοῖς
