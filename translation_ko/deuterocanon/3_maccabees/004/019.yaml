  chosen_korean: 그들에게
  alternatives_korean:
  - 그들에 맞서
  - 그들에게 불리하게
  lexicon: LSJ
  rationale: 여기서는 dative가 판결·여론이 그들 쪽에 불리하게 기울었다는 힘을 갖기 때문에, 문맥상 자연스러운 방향으로 옮겼습니다.
- source_word: σκληρότερον
  english_pob_choice: all the more harshly
  chosen_korean: 오히려 더 엄하게
  alternatives_korean:
  - 더 가혹하게
  - 한층 더 엄격하게
  lexicon: LSJ
  rationale: 비교급의 강화 의미를 살리되, 한국어에서는 ‘오히려 더’로 반전된 압박감을 드러내고 ‘엄하게’로 판단·처분의 성격을 반영했습니다.
- source_word: δεδωροκημένοις
  english_pob_choice: they had been bribed
  chosen_korean: 뇌물을 받은 것이라고
  alternatives_korean:
  - 뇌물로 매수된 것이라고
  - 뇌물을 받아넘긴 것이라고
  lexicon: LSJ
  rationale: 부패·매수의 뉘앙스를 가진 완전수동 분사이므로, ‘뇌물을 받은 것’으로 핵심 혐의를 직설적으로 전달했습니다.
- source_word: εἰς μηχανὴν τῆς ἐκφυγῆς
  english_pob_choice: as part of a scheme for escape
  chosen_korean: 도피를 위한 계책의 일부로
  alternatives_korean:
  - 도피하려는 계략의 일환으로
  - 탈출 계획의 일부로
  lexicon: LSJ
  rationale: μηχανή의 ‘계책/계략’과 ἐκφυγή의 ‘도피’를 함께 살려, 음모적 고발의 어조를 유지했습니다.
- source_word: πιστωθῆναι
  english_pob_choice: he was convinced of this
  chosen_korean: 그것에 대해 그가 분명히 확신하게 되었습니다
  alternatives_korean:
  - 그가 그것을 확신하게 되었습니다
  - 그것이 그에게 확실해졌습니다
  lexicon: LSJ
  rationale: aorist passive infinitive의 결과 상태를 자연스럽게 풀어, ‘분명히’와 ‘확신하다’로 확정된 인식을 반영했습니다.
theological_decisions:
- issue: 압축된 그리스어 문장 구조의 처리
  chosen_reading: 한국어에서는 마지막 절을 독립적으로 풀어, ‘그가 분명히 확신하게 되었습니다’로 결과를 분명히 드러냈습니다.
  alternative_readings:
  - ‘그것이 그에게 분명해졌습니다’
  - ‘그가 그것을 확신하게 되었습니다’
  rationale: 원문은 압축되고 다소 난해하므로, 의미를 과도하게 해석하지 않으면서도 독자가 사건 전개를 따라갈 수 있게 했습니다.
  doctrine_reference: '번역 원칙: 원문 의미의 명료화와 과도한 평탄화 방지'
