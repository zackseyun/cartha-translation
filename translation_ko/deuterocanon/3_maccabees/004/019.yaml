translation:
  language: ko
  text: 그러나 그들은 그들이 도피를 위한 계책의 일부로 뇌물로 매수되었다는 이유로, 그들에게 더욱 가혹하게 대해야 한다는 쪽으로 설득되었습니다. 그리고 그가 이 일에 대하여 확신하게 된 것이 분명히 드러났습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 문장은 압축되어 있고 다소 어색합니다. 마지막 절은 ‘그리고 그가 이 일을 확신하게 되었습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
