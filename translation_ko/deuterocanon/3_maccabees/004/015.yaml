base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/015.yaml
  text: So the registration of these people was carried out with bitter urgency and zealous exertion[a], from the rising of the sun to its setting[c][b], reaching no completion for forty days.
  footnotes:
  - marker: a
    text: Or 'enrollment' or 'census' for 'registration'; the Greek refers to an official administrative listing.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'from the risings of the sun to the settings,' an idiom for continual labor throughout the day.
    reason: cultural_note
  - marker: c
    text: The Greek expression means that the process did not come to completion even after forty days.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이들의 등록은 해가 뜰 때부터 질 때까지[b], 쓰라린 다급함과 열성적인 노력[a]으로 진행되었으나, 사십 일이 지나도록 끝나지 않았습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 고통스럽고 가혹한 다급함과 열성적으로 기울인 노력을 함께 나타냅니다. 후자의 표현에는 의욕적·경쟁적인 열심의 뉘앙스도 있을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘해가 뜨는 곳들로부터 지는 곳들까지’입니다. 여기서는 하루 종일 계속되었음을 나타내는 관용적 표현입니다.
    reason: cultural_note
  - marker: c
    text: 그리스어는 등록 절차가 사십 일이 지나도록 완료에 이르지 못했음을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπογραφὴ
  english_pob_choice: registration
  chosen_korean: 등록
  alternatives_korean:
  - 등록 절차
  - 명부 작성
  - 인구 조사
