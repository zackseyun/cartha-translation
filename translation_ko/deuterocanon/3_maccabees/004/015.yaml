  rationale: 공식 행정상 명단 작성이라는 뜻을 살리되, 여기서는 인구 전체를 세는 ‘인구 조사’보다 절차 자체를 가리키는 ‘등록’이 더 정확합니다.
- source_word: πικρᾶς σπουδῆς
  english_pob_choice: bitter urgency
  chosen_korean: 비통한 서두름
  alternatives_korean:
  - 쓴 서두름
  - 가혹한 급박함
  - 고통스러운 열심
  lexicon: LSJ
  rationale: πικρᾶς의 부정적 정조를 ‘비통한’으로 살리고, σπουδή의 시간적 압박을 ‘서두름’으로 자연스럽게 옮겼습니다.
- source_word: φιλοτίμου προσθεσίας
  english_pob_choice: zealous exertion
  chosen_korean: 열성적인 노력
  alternatives_korean:
  - 야심 찬 열심
  - 호의적인 추가 노력
  - 열렬한 분투
  lexicon: LSJ
  rationale: φιλοτίμος의 명예추구 뉘앙스는 한국어에서 직설적으로 옮기면 오해가 생기므로, 문맥상 과도하고 의욕적인 수행을 드러내는 ‘열성적인 노력’으로 처리했습니다.
- source_word: ἀπὸ ἀνατολῶν ἡλίου μέχρι δυσμῶν
  english_pob_choice: from the rising of the sun to its setting
  chosen_korean: 해가 떠오르는 데서부터 해가 지는 데까지
  alternatives_korean:
  - 해 뜰 때부터 해 질 때까지
  - 동쪽에서 서쪽까지
  lexicon: LSJ
  rationale: 시간 전체를 아우르는 관용적 표현이므로, 공간적 의미로 오해되지 않도록 해의 동작을 직접 풀어 옮겼습니다.
theological_decisions:
- issue: 사십 일이 지나도 완료되지 못한 상태의 강조
  chosen_reading: ‘끝내 완료되지 못했습니다’로 번역해 과정이 40일 동안 지속되었지만 완결에 이르지 못했음을 드러냈습니다.
  alternative_readings:
  - ‘40일 동안 끝나지 않았습니다’
  - ‘40일이 지나도 마무리되지 않았습니다’
  rationale: ἀνήνυτον λαμβάνουσα τὸ τέλος는 단순 지연보다 ‘완료 불가능/미완결’의 강한 뉘앙스를 가지므로, 결과의 불완전성을 분명히 해야 합니다.
  doctrine_reference: 문헌 서술의 과정적 미완결성
