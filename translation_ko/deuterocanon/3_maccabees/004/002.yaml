translation:
  language: ko
  text: 그러나 유대인들에게는 형언할 수 없는 슬픔과 눈물 섞인 온통 탄식의 외침이 있었고, 그들의 마음은 사방에서 탄식으로 불타올랐으며, 그들에게 예기치 않게, 그리고 갑자기 내려진 멸망을 슬퍼하고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘말로 다할 수 없는 애도와 온통 탄식하는 외침’. 그리스어는 매우 수사적이고 압축적입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλεκτον πένθος
  english_pob_choice: unspeakable grief
  chosen_korean: 형언할 수 없는 슬픔
  alternatives_korean:
  - 말로 다할 수 없는 애도
  - 헤아릴 수 없는 슬픔
  lexicon: LSJ
  rationale: ἄλεκτον은 말로 표현할 수 없음을, πένθος는 깊은 애도/슬픔을 가리키므로, 합쳐서 ‘형언할 수 없는 슬픔’으로 압축해 원문의 수사적 강도를 살렸습니다.
- source_word: πανόδυρτος ... βοή
  english_pob_choice: an all-lamenting cry
  chosen_korean: 눈물 섞인 온통 탄식의 외침
  alternatives_korean:
  - 온통 탄식뿐인 외침
  - 완전히 통곡하는 외침
  lexicon: LSJ
  rationale: πανόδυρτος는 ‘온전히/전적으로 통곡하는’ 강조를 담고, βοή는 큰 부르짖음이므로, 한국어에서는 ‘탄식의 외침’으로 풀어 수사적 결합을 살렸습니다.
- source_word: στεναγμοῖς πεπυρωμένης πάντοθεν αὐτῶν τῆς καρδίας
  english_pob_choice: their heart, burning on every side with groanings
  chosen_korean: 그들의 마음은 사방에서 탄식으로 불타올랐으며
  alternatives_korean:
  - 그들의 마음은 사방에서 신음으로 달아올랐으며
  - 그들의 마음은 온전히 탄식에 휩싸여 불탔으며
  lexicon: LSJ
  rationale: καρδία는 문자 그대로 ‘마음’으로 옮기고, πεπυρωμένης는 ‘불타오르다’의 이미지가 강하므로, ‘사방에서 탄식으로 불타올랐다’로 내부 압박과 수사적 생생함을 함께 반영했습니다.
- source_word: ἀπροσδόκητον ἐξαίφνης ... ἐπικριθεῖσαν ὀλεθρίαν
  english_pob_choice: the destruction unexpectedly and suddenly decreed against them
  chosen_korean: 그들에게 예기치 않게, 그리고 갑자기 내려진 멸망
  alternatives_korean:
  - 그들에게 뜻밖에, 그리고 갑자기 선고된 파멸
  - 그들에게 전혀 예상치 못하게 갑자기 내려진 재앙
  lexicon: LSJ
  rationale: ἐπικριθεῖσαν은 공식적·사법적 ‘내려진/선고된’ 뉘앙스가 있어 ‘내려진’으로 살리고, ὀλεθρίαν은 최종적 파괴를 가리켜 ‘멸망’으로 옮겼습니다.
