  lexicon: LSJ
  rationale: σανίδωμα은 널판으로 된 구조물을 뜻하고 πυκνός는 촘촘함을 더하므로, 물리적 이미지를 살리는 ‘촘촘한 널판’으로 옮겼습니다.
- source_word: ἐσκοτισμένοι τοὺς ὀφθαλμούς
  english_pob_choice: their eyes being darkened on every side
  chosen_korean: 사방에서 시야가 어두워진
  alternatives_korean:
  - 눈이 사방에서 어두워진
  - 사방이 어두워져 눈이 보이지 않게 된
  - 사방으로부터 눈이 가려진
  lexicon: LSJ
  rationale: 직역보다 한국어에서 자연스러운 결과 상태 표현을 택하되, 시각 차단이라는 의미는 유지했습니다.
- source_word: ἀγωγὴν ἐπιβόλων
  english_pob_choice: a transport fit for plotters
  chosen_korean: 음모자들에게 어울리는 운송
  alternatives_korean:
  - 음모자들의 운송
  - 반역자들에게 맞는 이동
  - 음모꾼들에게 어울리는 수송
  lexicon: LSJ
  rationale: ἐπιβόλων의 경멸적 뉘앙스를 살리기 위해 중립화하지 않고 ‘음모자들’로 옮겼고, ἀγωγήν은 운송/수송의 의미를 살렸습니다.
- source_word: ἐν παντὶ τῷ κατάπλῳ
  english_pob_choice: throughout the whole voyage
  chosen_korean: 온 항해 동안
  alternatives_korean:
  - 전 항해 동안
  - 전체 해상 항로 동안
  - 모든 항해 동안
  lexicon: LSJ
  rationale: κατάπλους는 해상 항해를 가리키므로, 간결한 한국어로 그 범위를 나타내는 ‘온 항해 동안’을 선택했습니다.
theological_decisions:
- issue: ἐπιβόλων의 경멸적 평가를 한국어에서 어떻게 보존할지
  chosen_reading: 단순한 ‘승객’이나 ‘죄인’이 아니라 ‘음모자들’로 옮겨, 그들에게 가해지는 처우의 비하적 성격을 드러냈습니다.
  alternative_readings:
  - 중립적 ‘범인들’
  - 완화된 ‘위험한 사람들’
  - 직역에 가까운 ‘공모자들’
  rationale: 본문은 그들의 항해가 무해한 이들이 아니라 위험한 자들에 대한 취급처럼 설계되었음을 강조하므로, 경멸적 의미를 약화시키지 않았습니다.
  doctrine_reference: 본문 해석 원칙 및 어휘의 사회적 뉘앙스 보존
- issue: ἀγωγὴν λαμβάνωσιν의 수동적 체험을 어떻게 표현할지
  chosen_reading: ‘운송을 받게 하였습니다’로 옮겨, 강제적 처우를 받는 느낌을 드러냈습니다.
  alternative_readings:
  - ‘운송을 받게 하다’
  - ‘수송되게 하다’
  - ‘이동을 겪게 하다’
  rationale: 동사의 주체가 배치된 구조에 의해 타자화된 처우를 받는 상황이므로, 단순 이동이 아니라 강제적 수송의 성격을 유지했습니다.
  doctrine_reference: 서술적 수동/강제성 보존
