  text: But after the previously mentioned interval of time[a], the scribes reported to the king that it was no longer possible to carry out the registration of the Jews because of their countless multitude.
  footnotes:
  - marker: a
    text: Or 'to make the census of the Jews.' The Greek ἀπογραφή can denote registration, enrollment, or census; 'registration' was chosen as the broader administrative term.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 앞서 언급된 그 기간이 지난 뒤에, 서기관들이 왕에게 유대인들의 등록을 그들의 헤아릴 수 없는 수효 때문에 더 이상 시행할 수 없다고 보고했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유대인들의 인구 조사를 시행하다’. 그리스어 ἀπογραφή는 등록, 명부 작성, 인구 조사를 뜻할 수 있으므로, 여기서는 더 넓은 행정 용어인 ‘등록’을 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ
  english_pob_choice: But after
  chosen_korean: 그러나 … 뒤에
  alternatives_korean:
  - 그리고 … 뒤에
  - 또 … 뒤에
  lexicon: LSJ
  rationale: μετά는 시간의 선후를 나타내고 δέ는 약한 전환을 더하므로, 한국어에서는 ‘그러나’와 ‘뒤에’로 자연스러운 서술 전환을 살렸습니다.
- source_word: τὸ προειρημένον τοῦ χρόνου διάστημα
  english_pob_choice: the previously mentioned interval of time
  chosen_korean: 앞서 언급된 그 기간
  alternatives_korean:
  - 앞서 말한 그 시간의 간격
  - 앞서 언급된 시간의 구간
  lexicon: LSJ
  rationale: προειρημένον과 διάστημα의 되돌아봄을 살리되, 한국어에서는 ‘시간의 간격’보다 문맥상 더 자연한 ‘기간’으로 옮겼습니다.
- source_word: προσηγγέλλον οἱ γραμματεῖς τῷ βασιλεῖ
  english_pob_choice: the scribes reported to the king
  chosen_korean: 서기관들이 왕에게 … 보고했습니다
  alternatives_korean:
  - 서기관들이 왕에게 … 알렸습니다
  - 서기들이 왕에게 … 보고했습니다
  lexicon: LSJ
  rationale: γραμματεῖς는 왕실 문서 업무를 맡은 관료적 ‘서기관들’이 가장 직접적이며, προσηγγέλλον은 공식 보고의 뉘앙스를 가진다고 보아 ‘보고했습니다’로 옮겼습니다.
- source_word: τὴν τῶν Ἰουδαίων ἀπογραφὴν ποιεῖσθαι
  english_pob_choice: to carry out the registration of the Jews
  chosen_korean: 유대인들의 등록을 시행할 수 없다고
  alternatives_korean:
  - 유대인들의 등록을 진행할 수 없다고
  - 유대인들의 명부 작성을 할 수 없다고
  lexicon: LSJ
  rationale: ἀπογραφή는 등록·명부 작성·인구 조사까지 아우를 수 있지만, 여기서는 행정적 ‘등록’이 가장 넓고 중립적인 대응이라 보았습니다. ποιεῖσθαι는 ‘시행하다/진행하다’의 실행 뉘앙스로 반영했습니다.
- source_word: διὰ τὴν ἀμέτρητον αὐτῶν πληθύν
  english_pob_choice: because of their countless multitude
  chosen_korean: 그들의 헤아릴 수 없는 수효 때문에
  alternatives_korean:
  - 그들의 헤아릴 수 없는 무리 때문에
  - 그들의 셀 수 없는 무수함 때문에
  lexicon: LSJ
  rationale: ἀμέτρητον과 πληθύς의 결합을 한국어에서 중복 없이 자연스럽게 살리기 위해, ‘헤아릴 수 없는 수효’로 수량의 과장을 유지했습니다.
