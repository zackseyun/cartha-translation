  - 긍정 서술로 완화하여 ‘모든 곳이 애도로 가득했다’고 옮김
  - 평서문으로 바꿔 수사성을 약화함
  rationale: 본문은 장소를 하나씩 열거한 뒤 ‘어디가 아니었겠느냐’는 수사적 질문으로 도시 전체의 비탄을 강조하므로, 그 압박감을 한국어에서도 유지했습니다.
