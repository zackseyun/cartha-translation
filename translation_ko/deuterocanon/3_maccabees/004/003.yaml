  text: 어느 지구나 도시나, 아니, 사람들이 사는 어떤 장소든지, 또 어떤 거리들도 그들에 대한 애도와 통곡으로 가득 차지 않은 곳이 어디 있었겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
