  terminology: νομός는 문맥상 ‘행정 구역’이 적절합니다. κόπετος와 γόος는 ‘애도와 통곡’으로 무난히 구별됩니다. οἰκτιστὸς는 ‘비참한’으로 옮기고, 문맥상 ‘사람들이 사는 곳’으로 이해하려는 해석은 각주에서만 언급합니다.
