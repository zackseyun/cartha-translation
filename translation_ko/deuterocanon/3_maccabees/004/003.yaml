translation:
  language: ko
  text: 어느 지구나 도시나, 아니, 사람들이 사는 어떤 장소든지, 또 어떤 거리들도 그들에 대한 애도와 통곡으로 가득 차지 않은 곳이 어디 있었겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지구’는 여기서 행정적 구역을 가리키는 νομός의 의미를 따른 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘애도’는 κοπετός의 더 구체적인 의례적 슬픔, 곧 가슴을 치는 상례적 통곡까지 포함할 수 있습니다.
    reason: lexical_alternative
