  source_fidelity: 본문은 하늘로부터 유대인들을 돕는 이를 가리키는 관형 분사와 그 섭리의 효과적 작용을 말합니다. ἐξ οὐρανοῦ의 수식 범위는 분사에 붙는 것으로 읽는 것이 자연스럽지만, ‘섭리’에 연결하여 이해할 여지도 있으므로 각주에서 이를 보존했습니다. ἀνίκητον은 섭리 자체보다 ἐνέργεια를 수식하는 것으로 옮겼습니다.
