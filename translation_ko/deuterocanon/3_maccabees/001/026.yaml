  - severity: medium
    issue: ‘앞서 말한 일을 끝내려는 생각이었습니다’
    rationale: δοκῶν의 주체는 ‘그’이며, 한국어 ‘생각이었습니다’는 주어의 의도적 판단을 자연스럽게 서술하지 못합니다. ‘끝내려는 생각으로’가 문법적 관계를 더 정확히 드러냅니다.
  revised_text: 그러나 그는 대담해져 모든 사람을 돌려보내고, 앞서 말한 일을 끝내려는 생각으로 이미 다가가고 있었습니다.
