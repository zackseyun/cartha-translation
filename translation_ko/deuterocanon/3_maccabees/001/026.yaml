  terminology: ‘대담해져’, ‘모든 사람을 돌려보내고’, ‘앞서 말한 일’은 원문의 의미 범위와 현대 표준어 합쇼체에 적절합니다. ‘끝내려는 생각으로’는 τέλος ἐπιθήσειν과 δοκῶν의 계획·의도 관계를 무리 없이 전달합니다.
