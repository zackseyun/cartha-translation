translation:
  language: ko
  text: 그러나 그는 대담해져 모든 사람을 돌려보내고, 앞서 말한 일을 끝내려는 생각으로 이미 다가가고 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θρασυνθεὶς
  english_pob_choice: after becoming emboldened
  chosen_korean: 대담해진 뒤에
  alternatives_korean:
  - 용감해진 뒤에
  - 뻔뻔해진 뒤에
  - 무모해진 뒤에
  lexicon: LSJ
  rationale: 분사적 선행 동작을 살리면서도, 문맥의 부정적 뉘앙스를 과도하게 단정하지 않도록 ‘대담해지다’를 택했습니다.
- source_word: παραπέμψας πάντας
  english_pob_choice: having sent everyone away
  chosen_korean: 모든 사람을 돌려보내고
  alternatives_korean:
  - 모두를 보내버리고
  - 모든 사람을 해산시키고
  - 모든 사람을 물러가게 하고
  lexicon: LSJ
  rationale: πάντας의 전면성을 드러내면서도 한국어에서 자연스럽게 읽히는 방식으로 ‘돌려보내다’를 사용했습니다.
- source_word: πρόσβασιν ἐποιεῖτο
  english_pob_choice: was already making his approach
  chosen_korean: 이미 다가가고 있었으니
  alternatives_korean:
  - 이미 접근하고 있었으니
  - 이미 나아가고 있었으니
  - 이미 그곳으로 다가서고 있었으니
  lexicon: LSJ
  rationale: πρόσβασις의 구체적 움직임 의미를 반영해, 추상적 ‘접근’보다 장면감이 있는 ‘다가가다’로 옮겼습니다.
- source_word: τῷ προειρημένῳ
  english_pob_choice: the matter spoken of before
  chosen_korean: 앞서 말한 일
  alternatives_korean:
  - 이전에 언급된 일
  - 미리 말해 둔 일
  - 앞서 언급한 일
  lexicon: LSJ
  rationale: 원문의 수동분사형이 가리키는 ‘앞서 말해진 것’을 과하게 압축하지 않고, 서술의 대상이 되는 사건을 한국어답게 풀었습니다.
