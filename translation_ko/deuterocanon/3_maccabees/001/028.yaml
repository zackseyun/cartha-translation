translation:
  language: ko
  text: 그리고 군중에게서 더없이 빽빽하고 힘겹게 터져 나오는 외침이 한데 모여, 말로 다 형언할 수 없는 아우성이 일어났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 군중의 큰 소리를 가리키는 두 단어를 겹쳐 사용합니다. 앞의 ‘외침’은 여러 목소리가 한데 모여 빽빽하게 이어지는 소리이고, 뒤의 ‘아우성’은 그로 인해 일어난 압도적인 집단의 소란스러운 외침을 가리킵니다.
    reason: lexical_alternative
