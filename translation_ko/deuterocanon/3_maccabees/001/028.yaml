  - 외침이 일어나는
  lexicon: LSJ
  rationale: κραυγή와 συναγομένης의 결합이 여러 목소리가 한데 모여 솟아오르는 장면을 그리므로, 직역과 관용을 함께 살려 표현했습니다.
- source_word: ἀνείκαστός τις ἦν βοή
  english_pob_choice: an indescribable outcry
  chosen_korean: 형언할 수 없는 아우성
  alternatives_korean:
  - 비길 데 없는 아우성
  - 묘사할 수 없는 소란
  - 형언할 수 없는 외침
  lexicon: LSJ
  rationale: ἀνείκαστός와 βοή는 단순한 외침보다 공개적 소요와 큰 소란을 가리키므로, ‘아우성’이 이 뉘앙스를 가장 잘 살립니다.
theological_decisions:
- issue: 공개 집단 소란의 강도 표현
  chosen_reading: 본절은 군중의 소리가 단순한 ‘외침’이 아니라, 여러 목소리가 한데 몰려 폭발한 공개적 아우성으로 묘사됩니다.
  alternative_readings:
  - 중립적인 군중의 외침으로 약화
  - 단순한 소리의 크기만 강조
  rationale: 그리스어의 중첩된 동의어 구조(κραυγή / βοή / συναγομένης)를 따라, 서술의 과장을 줄이지 않고 집단적 긴장감을 보존했습니다.
  doctrine_reference: 문학적-서술적 강조 보존
