  lexicon: LSJ
  rationale: 소리가 단순히 크다는 뜻이 아니라 많은 사람들이 힘을 들여 내는 소리라는 뉘앙스를 살려 ‘힘겨운’으로 옮겼습니다.
- source_word: συναγομένης κραυγῆς
  english_pob_choice: cry being raised
  chosen_korean: 외침이 모여 올라오는
  alternatives_korean:
