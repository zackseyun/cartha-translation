  to: 그리고 군중에게서 더없이 빽빽하고 힘겹게 터져 나오는 외침이 한데 모여, 말로 다 형언할 수 없는 아우성이 일어났습니다.[a]
  rationale: 수정문은 πυκνοτάτης의 최상급 강도를 ‘더없이’로, 소리의 밀집된 양상을 ‘빽빽하게 터져 나오는’으로 나타냈습니다. ἐμπόνου의 노력·긴장감은 ‘힘겹게’로, συναγομένης는 ‘한데 모여’로 반영했습니다. 또한 κραυγή와 βοή의 의도적인 중첩은 ‘외침’과 ‘아우성’의 반복적 구조로 유지했습니다.
