translation:
  language: ko
  text: 그리고 군중의 매우 빽빽하고도 힘겨운 외침이 모여 올라오는 가운데, 형언할 수 없는 아우성이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘외침’과 ‘아우성’은 모두 군중의 큰 소리를 가리키지만, 후자는 공적 소란과 격렬함을 더 강하게 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πυκνοτάτης
  english_pob_choice: very dense
  chosen_korean: 매우 빽빽한
  alternatives_korean:
  - 가장 빽빽한
  - 촘촘히 모인
  - 매우 조밀한
  lexicon: LSJ
  rationale: 사람들로 꽉 들어찬 상태에서 나는 소리라는 이미지를 살리기 위해, 자연스러운 한국어로 ‘매우 빽빽한’을 택했습니다.
- source_word: ἐμπόνου
