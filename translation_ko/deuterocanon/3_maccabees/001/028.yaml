  - severity: low
    issue: συναγομένης의 ‘한데 모임’이 ‘모여 올라오는’에 다소 불명확하게 반영됨
    rationale: 여러 군중의 소리가 집결·합쳐지는 동작을 ‘한데 모여’로 명시하면 원문의 분사 의미가 더 분명해집니다.
