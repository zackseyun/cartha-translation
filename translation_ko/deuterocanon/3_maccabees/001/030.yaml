  text: ἵνα δὲ μὴ τοῖς πᾶσιν ἐχθόμενος ἐχθαίνηται, ὑπέγραψεν Ἐὰν δέ τινες ἐξ αὐτῶν προαιρῶνται ἐν τοῖς κατὰ τελετὰς μεμυημένοις ἀναστρέφεσθαι, τούτους ἰσοπολίτας Ἀλεξανδρεῦσι ποιεῖ.
