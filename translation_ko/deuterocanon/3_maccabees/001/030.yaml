base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/030.yaml
  text: 'But so that he might not become hateful to everyone by being hostile[a], he issued a written order: “But if any of them choose to conduct themselves among those initiated in the rites, he makes these equal citizens with the Alexandrians.”'
  footnotes:
  - marker: a
    text: Or “among those initiated in the mysteries.” The Greek phrase uses cultic initiation language.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 그는 모든 사람에게 미움받게 되지 않도록, 곧 자기의 적대 행위 때문에 그렇게 되지 않도록, 문서로 명령을 내렸습니다. “그러나 그들 가운데서 어떤 이들이 의식에 따라 입문한 사람들 가운데서 살아가기를 스스로 택하면, 그는 그들을 알렉산드리아 사람들과 동등한 시민으로 삼습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “의식에 따라 입문한 사람들 가운데서.” 그리스어 구문은 제의적 입문 언어를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ μὴ
  english_pob_choice: But so that ... not
  chosen_korean: 그런데 그는 ... 되지 않도록
  alternatives_korean:
  - 그리고 ... 되지 않도록
  - 그리하여 ... 되지 않도록
  lexicon: LSJ
  rationale: ἵνα의 목적성을 살리되 δέ의 전환을 반영해 문맥상 자연스러운 ‘그런데’로 옮겼습니다.
- source_word: ἐχθόμενος ... ἐχθαίνηται
  english_pob_choice: by being hostile ... become hateful
  chosen_korean: 미움받게 되지 않도록, 곧 자기의 적대 행위 때문에 그렇게 되지 않도록
  alternatives_korean:
  - 원수가 되어 ... 미움을 사지 않도록
  - 적대하여 ... 미움받지 않도록
  lexicon: LSJ
  rationale: 상관 어근의 말놀이를 한국어에서 그대로 재현하기 어려워, ‘미움받다/적대 행위’의 대응으로 의미와 긴장을 함께 살렸습니다.
- source_word: ὑπέγραψεν
  english_pob_choice: he issued a written order
  chosen_korean: 문서로 명령을 내렸습니다
  alternatives_korean:
  - 문서로 명령을 반포했습니다
  - 서면으로 지시했습니다
  lexicon: LSJ
  rationale: 공적 문서의 행정적 뉘앙스를 살리기 위해 단순한 ‘기록했다’보다 ‘문서로 명령을 내리다’를 택했습니다.
- source_word: ἐν τοῖς κατὰ τελετὰς μεμυημένοις
  english_pob_choice: among those initiated in the rites
  chosen_korean: 의식에 따라 입문한 사람들 가운데서
  alternatives_korean:
  - 신비 의식에 입문한 사람들 가운데서
  - 제의에 입문한 사람들 가운데서
  lexicon: LSJ
  rationale: τελεταί/μεμυημένοις의 입문·의식 어감을 살리되, 본문이 가리키는 종교적 결사체를 단정하지 않도록 ‘의식’과 ‘입문’을 사용했습니다.
- source_word: τούτους ἰσοπολίτας Ἀλεξανδρεῦσι ποιεῖ
  english_pob_choice: he makes these equal citizens with the Alexandrians
  chosen_korean: 그들을 알렉산드리아 사람들과 동등한 시민으로 삼습니다
  alternatives_korean:
  - 그들을 알렉산드리아 사람들과 동등한 시민권자로 삼습니다
  - 그들을 알렉산드리아 사람들과 동등한 시민으로 만듭니다
  lexicon: LSJ
  rationale: ἰσοπολίτας의 시민권적 평등을 한국어로 가장 자연스럽게 드러내기 위해 ‘동등한 시민’으로 옮겼습니다.
theological_decisions:
- issue: 의식적 입문 표현의 범위
  chosen_reading: 본문의 cultic initiation 언어를 살리되, 특정 종교 전통으로 과도하게 고정하지 않았습니다.
  alternative_readings:
  - 신비 종교의 입문자들
  - 제의적 신비에 입문한 자들
  rationale: τελεταί와 μεμυημένοις는 입문 의례를 분명히 가리키지만, 한국어 본문에서는 독자가 불필요하게 후대의 전문 용어로 읽지 않도록 약간 열어 두는 것이 좋습니다.
  doctrine_reference: source_language_precision
- issue: ‘미움받다’와 ‘적대’의 병치
  chosen_reading: 반의미가 아닌 상관어근의 긴장을 보존하는 방향으로 옮겼습니다.
  alternative_readings:
  - 모든 사람에게 미워지지 않도록
  - 모든 사람에게 원한을 사지 않도록
  rationale: Greek의 ἐχθόμενος/ἐχθαίνηται가 만드는 수사적 긴장을 단순 평이한 표현으로 평탄화하지 않도록 했습니다.
  doctrine_reference: source_language_precision
