base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/012.yaml
  text: And even when the law had been read out[a], he still did not stop insisting that he ought to enter, saying, “Even if they have been deprived of this honor, I ought not to be.”
  footnotes:
  - marker: a
    text: Or, “I should not be deprived of it.” The Greek at the end is elliptical, literally, “but as for me, it ought not [be so].”
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 율법이 낭독되었는데도, 그는 자신이 들어가야 한다고 계속 주장하며 말했습니다. “그들이 이 명예를 빼앗겼더라도, 나는 빼앗겨서는 안 됩니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 끝부분은 생략적 표현입니다. 직역하면 “그러나 나는 그래서는 안 된다”에 가깝습니다. 여기서는 앞 절의 뜻을 따라 ‘이 명예를 빼앗기다’를 보충했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ τε νόμου παραναγνωσθέντος
  english_pob_choice: when the law had been read out
  chosen_korean: 율법이 읽혀졌을 때에도
  alternatives_korean:
  - 법이 낭독되었을 때에도
  - 율례가 읽혔을 때에도
  lexicon: LSJ
  rationale: νόμος는 여기서 단순한 관습보다 공적으로 제시된 규정/율법을 가리키므로 표준적으로 ‘율법’으로 옮겼고, παραναγνωσθέντος의 공적 낭독 성격은 ‘읽혀졌을 때’로 간결하게 반영했습니다.
- source_word: οὐδ᾽ ὣς ἀπέλειπεν
  english_pob_choice: he still did not stop
  chosen_korean: 여전히 멈추지 않았습니다
  alternatives_korean:
  - 그래도 그치지 않았습니다
  - 그럼에도 포기하지 않았습니다
  lexicon: LSJ
  rationale: οὐδ᾽ ὣς는 ‘그럼에도/그래도’의 양보를, ἀπέλειπεν은 지속적 중단 거부를 나타내므로 자연스러운 현대 합쇼체로 ‘여전히 멈추지 않았습니다’라고 옮겼습니다.
- source_word: ἑαυτὸν δεῖν εἰσελθεῖν
  english_pob_choice: that he ought to enter
  chosen_korean: 들어가야 한다고
  alternatives_korean:
  - 들어가야 마땅하다고
  - 반드시 들어가야 한다고
  lexicon: LSJ
  rationale: δεῖ는 필요/의무를 나타내며, 화자는 자신에게 해당하는 당위성을 주장하므로 ‘들어가야 한다’로 옮겨 과도한 강제보다 주장된 당위를 살렸습니다.
- source_word: ταύτης τῆς τιμῆς
  english_pob_choice: this honor
  chosen_korean: 이 영예
  alternatives_korean:
  - 이 존귀
  - 이 명예
  lexicon: LSJ
  rationale: τιμή는 여기서 접근 허가에 수반되는 사회적 지위와 존대의 의미이므로 ‘영예’가 가장 직접적이며, 문맥의 체면/특권 뉘앙스를 보존합니다.
- source_word: ἐμὲ δὲ οὐ δεῖ
  english_pob_choice: I ought not to be
  chosen_korean: 나는 박탈당해서는 안 됩니다
  alternatives_korean:
  - 나는 그래서는 안 됩니다
  - 나는 제외되어서는 안 됩니다
  lexicon: LSJ
  rationale: 문장 끝이 생략된 엘립시스이므로 한국어에서는 앞선 ‘박탈당하다’와의 대조를 최소한으로 보충해 뜻을 드러냈습니다. POB의 각주 취지처럼 ‘내가 이 영예를 박탈당해서는 안 된다’는 의미를 자연스럽게 살렸습니다.
