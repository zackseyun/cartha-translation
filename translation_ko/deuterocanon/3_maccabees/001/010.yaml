  text: And when he had marveled also at the good order of the sanctuary[a], he considered making plans to enter the temple.
  footnotes:
  - marker: a
    text: 'Greek uses two different terms here: ἱερόν for the sacred precinct or sanctuary, and ναός for the temple proper.'
