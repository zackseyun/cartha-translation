translation:
  language: ko
  text: 그리고 그는 또한 성전 구역의 질서 정연함에 감탄한 뒤, 성전 안으로 들어갈 계획을 세울 것을 숙고했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 여기서 ἱερόν(넓은 성전 구역 또는 성역)과 ναός(성전 건물 자체)라는 서로 다른 용어를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: θαυμάσας
  english_pob_choice: having marveled
  chosen_korean: 감탄한 뒤
  alternatives_korean:
  - 경탄한 뒤
  - 놀란 뒤
  - 경이로워한 뒤
  lexicon: LSJ
  rationale: aorist 분사로서 앞선 동작을 나타내므로, 뒤따르는 주동사보다 먼저 일어난 반응을 자연스럽게 드러내는 ‘-한 뒤’로 옮겼습니다.
- source_word: εὐταξίαν
  english_pob_choice: good order
  chosen_korean: 좋은 질서
  alternatives_korean:
  - 질서정연함
  - 정돈
  - 질서
  lexicon: LSJ
  rationale: 단순한 배열보다 긍정적 평가가 포함된 ‘좋은 질서’가 원문의 뉘앙스를 잘 살립니다.
- source_word: ἱεροῦ
  english_pob_choice: sanctuary
  chosen_korean: 성전
  alternatives_korean:
  - 성역
  - 성소
  - 성전 구역
  lexicon: LSJ
  rationale: 여기서는 ναός와 대비되는 넓은 성스러운 구역이지만, 한국어에서는 문맥상 가장 자연스러운 대응이 ‘성전’이어서 본문에서는 그렇게 옮기고, 구별은 주석으로 보완합니다.
- source_word: βουλεύσασθαι εἰσελθεῖν
  english_pob_choice: making plans to enter
  chosen_korean: 들어가기로 마음먹었습니다
  alternatives_korean:
  - 들어가기로 계획했습니다
  - 들어가고자 하였습니다
  - 들어가기로 결의했습니다
  lexicon: LSJ
  rationale: βουλεύσασθαι의 숙고/계획과 εἰσελθεῖν의 실제 목적을 함께 반영하면서도, 한국어에서 과도하게 두 단계로 늘리지 않기 위해 ‘마음먹었습니다’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: ἱερόν과 ναός의 구별 유지
  chosen_reading: 본문은 둘 다 자연스러운 한국어로 옮기되, ἱερόν과 ναός가 서로 다른 성스러운 공간을 가리킨다는 점을 각주로 밝혔습니다.
  alternative_readings:
  - 둘 다 ‘성전’으로 통일
  - ἱερόν을 ‘성역’으로, ναός를 ‘성전’으로 엄격히 구분
  rationale: 그리스어는 같은 절 안에서 두 용어를 구별하므로, 독자가 공간의 범위를 다르게 이해하도록 돕는 것이 중요합니다. 다만 본문 가독성을 위해 한국어는 너무 생경하지 않게 다듬었습니다.
  doctrine_reference: Translation philosophy §5 (Consistency of key terms, or documented exception)
