  lexicon: LSJ
  rationale: ‘현재의 형편’으로 시급한 상황을 자연스럽게 드러내어, 단순한 ‘현장의 사람들’로 오해되지 않게 했습니다.
- source_word: μὴ περιιδεῖν τὴν ἄνομον καὶ ὑπερήφανον πρᾶξιν
  english_pob_choice: not overlook the lawless and arrogant deed
  chosen_korean: 그 법 없고 교만한 행위를 그냥 보아 넘기지 마시라고
  alternatives_korean:
  - 그 법 없는 და 교만한 일을 눈감아 주지 마시라고
