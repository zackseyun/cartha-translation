  text: Therefore[a], when those around him saw these things[b], they turned to join our people in calling on the one who has all power to help in the present circumstances and not overlook the lawless and arrogant deed.
  footnotes:
  - marker: a
    text: Or 'along with ours'; the Greek leaves the referent implicit.
    reason: lexical_alternative
  - marker: b
    text: Or 'to come to the aid of the present situation'; the phrase can refer to the circumstances at hand rather than to persons present.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그와 함께 있던 사람들이 이 일들을 보고, 우리 사람들과 함께 그 모든 권세를 가지신 분께 현재의 형편을 도와주시고, 그 법 없고 교만한 행위를 그냥 보아 넘기지 마시라고 부르짖도록 마음이 기울었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘우리 사람들과 함께’로 옮길 수도 있습니다. 그리스어는 동반의 대상이 암시적으로 제시되어 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘현재의 형편’은 ‘지금 당면한 상황’으로도 옮길 수 있습니다. 여기서는 처한 사정을 가리키는 뜻으로 읽었습니다.
    reason: lexical_alternative
