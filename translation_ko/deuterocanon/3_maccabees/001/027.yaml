  lexicon: LSJ
  rationale: 정형화된 칭호를 덧씌우기보다 ‘가지신’이라는 서술적 표현으로 그리스어의 설명적 힘을 보존했습니다.
- source_word: τοῖς παροῦσιν
  english_pob_choice: in the present circumstances
  chosen_korean: 현재의 형편을
