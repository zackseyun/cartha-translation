  lexicon: LSJ
  rationale: περιιδεῖν의 ‘못 본 체하다/보아 넘기다’ 뉘앙스를 살렸고, ἄνομος는 ‘법 없고’로, ὑπερήφανος는 ‘교만한’으로 옮겼습니다.
