  source_fidelity: 그리스어 πᾶν τέμενος는 ‘어떤 성소’보다 ‘모든 성소’(문맥에 따라 ‘모든 신성한 구역’)라는 포괄 표현을 보존하는 편이 안전합니다. ‘어떤 성소’는 임의의 한 성소라는 뜻으로 읽힐 수 있어 πᾶν의 범위를 약화합니다. 나머지 문장은 αὐτόν εἰσερχόμενον, οὐθεὶς ἐκώλυσεν, τῶν παρόντων의 관계를 충실히 반영합니다.
  naturalness: ‘왜’도 가능하지만, 고전 문헌의 격식 있는 서술에서는 ‘무슨 이유로’가 διὰ τίνα αἰτίαν을 더 명시적으로 반영하며 자연스럽습니다. ‘그 자리에 있던 사람들’과 ‘막지 않았는지’는 현대 표준어 합쇼체 문체에 적절합니다.
  terminology: τέμενος의 기본 뜻을 본문에서는 ‘성소’로 유지하고, 각주에서 건물에 한정되지 않는 ‘신성한 구역/장소’의 넓은 뜻을 제시합니다. 교파적 해석을 더하지 않았습니다.
  issues:
  - severity: medium
    issue: ‘어떤 성소’
    rationale: πᾶν τέμενος의 πᾶν이 나타내는 포괄성을 한국어 ‘어떤’이 충분히 전달하지 못하며, 임의의 한 장소라는 의미로 오해될 수 있습니다.
  - severity: low
    issue: ‘왜’
    rationale: 의미상 오류는 아니나, διὰ τίνα αἰτίαν의 ‘무슨 이유로’를 드러내는 표현이 이 문체와 원문 충실성에 더 적합합니다.
