base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/013.yaml
  text: And he inquired for what reason no one among those present had prevented him from entering any sanctuary[a].
  footnotes:
  - marker: a
    text: Or 'every sacred precinct.' The Greek τέμενος can refer broadly to a consecrated place, not only to a temple building.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 무슨 이유로 그 자리에 있던 사람들 가운데 아무도 그가 모든 성소에 들어가는 것을 막지 않았는지 물었습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 신성한 구역’. 그리스어 τέμενος는 성전 건물만이 아니라 더 넓은 의미의 성별된 장소를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπυνθάνετο
  english_pob_choice: he inquired
  chosen_korean: 물었습니다
  alternatives_korean:
  - 물어보았습니다
  - 조사했습니다
  lexicon: BDAG
  rationale: 불완전한 시상의 ‘묻다/알아보다’라는 뜻을 자연스럽게 옮기되, 서술문의 격식도 유지했습니다.
- source_word: διὰ τίνα αἰτίαν
  english_pob_choice: for what reason
  chosen_korean: 왜
  alternatives_korean:
  - 무슨 이유로
  - 어떤 까닭으로
  lexicon: LSJ
  rationale: 그리스어는 분명히 원인이나 이유를 묻는 표현이므로, 한국어에서는 간결한 ‘왜’로 옮겼습니다.
- source_word: πᾶν τέμενος
  english_pob_choice: any sanctuary
  chosen_korean: 어떤 성소
  alternatives_korean:
  - 모든 성소
  - 어떤 신성한 구역
  lexicon: LSJ
  rationale: τέμενος는 특정 건물보다 넓은 성역/성소를 가리킬 수 있으므로, 의미 범위를 살리면서도 ‘any sanctuary’의 자연스러운 대응으로 ‘어떤 성소’를 선택했습니다.
- source_word: οὐθεὶς ἐκώλυσεν
  english_pob_choice: had prevented
  chosen_korean: 막지 않았는지
  alternatives_korean:
  - 저지하지 않았는지
  - 방해하지 않았는지
  lexicon: BDAG
  rationale: κωλύω의 핵심 의미인 ‘막다/저지하다’를 살리되, 문맥상 가장 자연스러운 한국어로 표현했습니다.
