  to: 그리고 이 일을 위해 모인 이들의 탄원[a]은 여러 가지였는데, 그가 불경하게[b] 넘기고 있는 이들을 위한 것이었습니다.
  rationale: 수동 분사 κατεγχειρουμένοις의 대상이 ‘이들’이며, 전치사구 ὑπʼ ἐκείνου가 그들을 넘기는 행위자를 가리키도록 문장을 재구성했습니다. ‘불경하게’는 ἀνοσίως의 종교적·도덕적 비난을 보존하되 특정 교리적 해석을 덧붙이지 않습니다. ἐπὶ + 여격이 나타내는 탄원의 대상·계기를 한국어의 자연스러운 ‘이들을 위한’으로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:51:50Z'
