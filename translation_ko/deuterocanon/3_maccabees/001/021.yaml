  source_fidelity: 수정이 필요합니다. 현 번역의 “그가 부당하게 넘겨지고 있는 이들”은 한국어 문법상 ‘그’가 넘겨지고 있는 것으로 읽혀, ὑπʼ ἐκείνου(‘그에 의해’)가 가리키는 행위 주체와 κατεγχειρουμένοις(‘넘겨지고 있는 이들’)의 수동 관계를 뒤바꿉니다. 또한 ἀνοσίως는 단순한 절차적 ‘부당하게’보다 불경·불경건 및 도덕적 무도함의 의미를 지닙니다.
  naturalness: “이 일을 위해 모인 이들의 탄원은 여러 가지였는데”는 자연스럽고, 뒤 절은 “그가 불경하게 넘기고 있는 이들을 위한”으로 고치면 행위자와 대상이 명료해집니다.
  terminology: δέησις의 ‘탄원’은 적절합니다. ἀνοσίως는 본문에서 ‘불경하게’로 옮기고, 각주에서 ‘사악하게’ 등의 대안을 제시하는 것이 원문의 종교적·도덕적 강도를 보존합니다.
