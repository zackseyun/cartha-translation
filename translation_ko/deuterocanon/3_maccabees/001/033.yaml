base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/033.yaml
  text: They had been instructed to obtain support[a], and they loathed those who withdrew from them, judging them as enemies of the nation[b], and depriving them of common association and serviceability.
  footnotes:
  - marker: a
    text: Or 'help' or 'assistance' for 'support' (ἀντιλήψεως).
    reason: lexical_alternative
  - marker: b
    text: The phrase 'common association and usefulness' refers to exclusion from ordinary social relations and beneficial participation in communal life.
    reason: cultural_note
translation:
  language: ko
  text: 그들은 도움을 얻도록 훈련되어 있었고[a], 그들에게서 물러나는 이들을 미워했으며, 그들을 민족의 적[b]으로 여기고, 공동의 교제와 유익한 활동에서 그들을 배제했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘도움’은 ἀντιλήψεως의 넓은 뜻을 따른 번역입니다. 이 말은 도움, 지원, 원조를 모두 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘민족의 적’은 이 구가 유대 공동체에 대한 정치·사회적 적대 판정을 뜻한다는 점을 살린 번역입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἐνπαιδεῖς τε καθηστήκεισαν
  english_pob_choice: had been instructed / trained
  chosen_korean: 훈련되어 있었고
  alternatives_korean:
  - 교육되어 있었고
  - 지시를 받아 있었고
  - 훈련을 받아 그런 상태에 있었고
  lexicon: LSJ
  rationale: ἐνπαιδεῖς와 καθηστήκεισαν은 단순한 과거 사건보다 이전에 형성되어 굳어진 상태를 가리키므로, 한국어에서는 ‘훈련되어 있었고’로 자연스럽게 옮겨 상태성과 준비성을 함께 살렸습니다.
- source_word: ἀντιλήψεως
  english_pob_choice: support
  chosen_korean: 도움
  alternatives_korean:
  - 지원
  - 원조
  - 보조
  lexicon: LSJ
  rationale: ἀντιλήψις는 넓게 ‘도움/원조/지원’을 뜻하므로, 문맥상 너무 행정적이지 않으면서도 의미가 넓은 ‘도움’을 선택했습니다.
- source_word: τοὺς ἀποχωροῦντας ἐξ αὐτῶν
  english_pob_choice: those who withdrew from them
  chosen_korean: 그들에게서 물러나는 이들
  alternatives_korean:
  - 그들 곁을 떠나는 이들
  - 그들로부터 떠난 이들
  - 그들에게서 돌아서는 이들
  lexicon: LSJ
  rationale: ἀποχωροῦντας는 단순 이동보다 관계적 이탈의 뉘앙스가 강하므로, ‘그들에게서 물러나는 이들’로 관계적 거리두기를 드러냈습니다.
- source_word: κοινῆς συναναστροφῆς καὶ εὐχρηστίας
  english_pob_choice: common association and usefulness
  chosen_korean: 공동의 교제와 유익한 활동
  alternatives_korean:
  - 일상적 교류와 유익
  - 공동의 사귐과 유익성
  - 보통의 사회적 교류와 실용성
  lexicon: LSJ
  rationale: 이 구는 공동체 안의 통상적 교류와 참여를 가리키므로, 지나치게 교회적 어휘를 피하면서도 의미가 살아 있는 ‘공동의 교제와 유익한 활동’으로 옮겼습니다.
theological_decisions:
- issue: ἔθνους의 공동체 정체성 표현
  chosen_reading: 민족
  alternative_readings:
  - 백성
  - 나라
  rationale: 여기서는 유대 공동체를 향한 정치·사회적 적대가 핵심이므로, 집단적 정체성을 드러내는 ‘민족’이 가장 직접적입니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 공동체 배제의 강도 표현
  chosen_reading: 배제했습니다
  alternative_readings:
  - 제외했습니다
  - 박탈했습니다
  - 멀리했습니다
  rationale: ἐστέροῦν은 단순한 거리두기가 아니라 공동생활의 이익과 관계를 빼앗는 뜻이어서, 사회적 배제를 분명히 드러내는 ‘배제했습니다’가 적합합니다.
  doctrine_reference: Translation philosophy §5, §6
