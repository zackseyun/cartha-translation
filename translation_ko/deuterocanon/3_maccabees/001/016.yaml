  footnotes:
  - marker: a
    text: '직역에 가까운 대안: “그러나 당신께서는 당신의 백성 이스라엘 가운데 당신의 영광을 기뻐하셨으므로, 이곳을 거룩하게 하셨습니다.”'
    reason: alternative_reading
  - marker: b
    text: ‘거룩하게 하셨습니다’는 ἡγίασας의 기본 의미를 살린 번역입니다. 문맥상 ‘성별하셨습니다’도 가능하지만, 한국어에서는 더 좁은 제의적 뉘앙스를 띨 수 있습니다.
    reason: lexical_alternative
