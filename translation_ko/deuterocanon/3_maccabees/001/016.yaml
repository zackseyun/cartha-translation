  text: 그러나 당신께서는 당신의 백성 이스라엘 가운데 당신의 영광을 두시기를 기뻐하셨으므로, 이곳을 거룩하게 하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλ᾽
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  lexicon: LSJ
  rationale: 앞 문맥과 대비되는 전환을 자연스럽게 드러내는 역접 접속사로 옮겼습니다.
- source_word: εὐδόκησας
  english_pob_choice: you were pleased
  chosen_korean: 기뻐하셨습니다
  alternatives_korean:
  - 좋아하셨습니다
  - 기뻐하셨으므로
  lexicon: LSJ
  rationale: 하나님의 자발적 호의와 만족을 나타내므로, 한국어에서는 단순한 감정보다 ‘기뻐하다’가 더 적절합니다.
- source_word: τὴν δόξαν σου
  english_pob_choice: your glory
  chosen_korean: 당신의 영광
  alternatives_korean:
  - 당신의 광채
  - 당신의 존귀
  lexicon: LSJ
  rationale: δόξα의 신학적 의미를 보존하기 위해 일반적이면서도 예배적 함의를 지닌 ‘영광’을 택했습니다.
- source_word: ἐν τῷ λαῷ σου Ἰσραήλ
  english_pob_choice: among your people Israel
  chosen_korean: 당신의 백성 이스라엘 가운데
  alternatives_korean:
  - 이스라엘 백성 안에
  - 당신의 백성 이스라엘 안에서
  lexicon: LSJ
  rationale: 사람들 사이에 임재하고 드러나는 의미를 살리기 위해 ‘가운데’를 사용했습니다.
- source_word: ἡγίασας τὸν τόπον τοῦτον
  english_pob_choice: you sanctified this place
  chosen_korean: 이곳을 거룩하게 하셨습니다
  alternatives_korean:
  - 이곳을 성별하셨습니다
  - 이곳을 성화하셨습니다
  - 이곳을 거룩하게 만드셨습니다
  lexicon: LSJ
  rationale: ἁγιάζω의 핵심인 ‘거룩하게 하다/구별하다’를 직접 드러내면서도 현대 한국어에서 자연스럽게 읽히도록 옮겼습니다.
theological_decisions:
- issue: 성전/장소에 대한 거룩하게 하심의 표현
  chosen_reading: 이곳을 거룩하게 하셨습니다
  alternative_readings:
  - 이곳을 성별하셨습니다
  - 이곳을 성화하셨습니다
  rationale: 본문은 ἁγιάζω의 직접적 거룩 언어를 사용하므로, 그 신학적 범주를 약화하지 않고 보존했습니다. ‘거룩하게 하다’는 독자에게도 분명하며, 특정 제도적 용어로 좁히지 않습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
