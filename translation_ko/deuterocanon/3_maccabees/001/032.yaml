revisions:
- from: 그러나 그들 대부분은 고결한 마음으로 용기를 내어 경건에서 떠나지 않았고, 삶을 위해 자기들의 재산까지 바꾸어 내놓으면서, 등록에서 자신들을 구해 내려고 담대히 애썼습니다.[a][b][c]
  to: 그러나 그들 대부분은 고결한 마음으로 용기를 내어 경건[a]에서 떠나지 않았고, 목숨을 건지기 위해 재산까지 내놓으면서 공식 등록 절차[c]에서 벗어나 자신들을 구해 내려고 담대히 애썼습니다.[b]
  rationale: 등록 절차와 자기 구원의 관계를 한국어로 자연스럽고 명확하게 조정하고, ‘삶을 위해’를 문맥상 더 자연스러운 ‘목숨을 건지기 위해’로 다듬었습니다. 원문의 난해한 ἐτιμῶντο에 대해서는 본문에서 과도하게 단정하지 않고 기존 POB의 ‘적극적으로 애썼다’는 제한된 해석과 각주의 유보를 유지했습니다. 각주 표지는 각각의 설명 대상 바로 뒤로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:51:52Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ‘등록에서 자신들을 구해 내다’는 한국어에서 등록 자체가 위험원인인 듯 들려 ἐκ τῶν ἀπογραφῶν(등록 절차/명부 작성에서 벗어남)의 관계를 충분히 드러내지 못합니다. ‘공식 등록 절차에서 벗어나 자신들을 구해 내다’로 보완하는 것이 안전합니다. 난해한 ἐτιμῶντο는 각주에서 유보하고 본문에서는 영어 POB의 절제된 적극적 시도라는 해석을 유지했습니다.
  naturalness: ‘삶을 위해 자기들의 재산까지 바꾸어 내놓으면서’보다 ‘목숨을 건지기 위해 재산까지 내놓으면서’가 현대 표준 한국어로 더 자연스럽고 문맥에 맞습니다. 또한 각주의 내용에 맞게 표지를 해당 어구 가까이에 배치하는 편이 독해상 명료합니다.
  terminology: ‘경건’은 εὐσέβεια에 적합한 성서적이면서도 비종파적인 표현입니다. ‘고결한 마음’, ‘담대히’, ‘공식 등록 절차’도 문맥과 합쇼체 문체에 적절합니다.
