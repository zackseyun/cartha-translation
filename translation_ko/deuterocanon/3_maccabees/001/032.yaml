base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/032.yaml
  text: But most of them[a] took courage with a noble spirit, did not depart from piety[c][b], exchanging even their possessions for life, and boldly sought to rescue themselves from the registrations.
  footnotes:
  - marker: a
    text: Or 'did not abandon godliness.' The Greek εὐσέβεια can denote reverence, devotion, or piety toward God.
    reason: lexical_alternative
  - marker: b
    text: The Greek clause rendered 'boldly sought to rescue themselves from the registrations' is difficult in the transmitted text, especially the verb ἐτιμῶντο. The translation reflects the probable sense of active effort to secure release from the official enrollment.
    reason: textual_variant
  - marker: c
    text: '''Registrations'' refers to the official enrollment/listing process imposed on them, not necessarily a population census in the modern sense.'
    reason: cultural_note
translation:
  language: ko
  text: 그러나 그들 대부분은 고결한 마음으로 용기를 내어 경건[a]에서 떠나지 않았고, 목숨을 건지기 위해 재산까지 내놓으면서 공식 등록 절차[c]에서 벗어나 자신들을 구해 내려고 담대히 애썼습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경건을 버리지 않았습니다.’ 여기서 εὐσέβεια는 하나님께 대한 경외, 헌신, 경건을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 전승된 본문의 마지막 절은 특히 ἐτιμῶντο 때문에 난해합니다. 이 번역은 공식 등록 절차에서 벗어나려는 적극적 시도로 이해한 의미를 반영합니다.
    reason: textual_variant
  - marker: c
    text: 여기서 ‘등록 절차’는 현대적 의미의 인구조사라기보다, 그들에게 부과된 공식적 등록·명부 작성 절차를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ πλεῖστοι
  english_pob_choice: But most of them
  chosen_korean: 그러나 그들 대부분은
  alternatives_korean:
  - 그리고 그들 대부분은
  - 대부분은
  lexicon: LSJ
  rationale: δέ의 대비를 살리되, 한국어에서는 문맥상 자연스러운 역접 접속으로 처리했습니다.
- source_word: γενναίᾳ ψυχῇ
  english_pob_choice: with a noble spirit
  chosen_korean: 고결한 마음으로
  alternatives_korean:
  - 고상한 정신으로
  - 용감한 영혼으로
  lexicon: LSJ
  rationale: ψυχή는 여기서 형이상학적 '영혼'보다 내적 태도와 결의를 가리키므로, '마음'으로 풀어 자연스럽게 옮겼습니다.
- source_word: ἐνίσχυσαν
  english_pob_choice: took courage
  chosen_korean: 용기를 내어
  alternatives_korean:
  - 굳세어져
  - 힘을 얻어
  lexicon: LSJ
  rationale: 문맥상 수동적 '강해지다'보다 결단을 나타내는 능동적 표현이 적절해 '용기를 내다'로 옮겼습니다.
- source_word: τὰ τε χρήματα περὶ τοῦ ζῇν ἀντικαταλλασσόμενοι
  english_pob_choice: exchanging even their possessions for life
  chosen_korean: 삶을 위해 자기들의 재산까지 바꾸어 내놓으면서
  alternatives_korean:
  - 목숨을 위해 자기들의 소유를 맞바꾸면서
  - 살기 위해 재산까지 내주면서
  lexicon: LSJ
  rationale: χρήματα를 '재산'으로, τε의 강조를 '까지'로 살렸고, περὶ τοῦ ζῇν은 관용적으로 '삶을 위해'로 옮겼습니다.
- source_word: ἀδέως
  english_pob_choice: boldly
  chosen_korean: 담대히
  alternatives_korean:
  - 두려움 없이
  - 거리낌 없이
  lexicon: LSJ
  rationale: 무모함보다 두려움 없는 담대함을 나타내므로 '담대히'가 가장 자연스럽습니다.
- source_word: ἐτιμῶντο ἑαυτοὺς ῥύσασθαι ἐκ τῶν ἀπογραφῶν
  english_pob_choice: boldly sought to rescue themselves from the registrations
  chosen_korean: 자신들을 구해 내려고 애썼습니다
  alternatives_korean:
  - 자신들을 해방시키려고 애썼습니다
  - 등록에서 벗어나려고 애썼습니다
  lexicon: LSJ
  rationale: 전승된 ἐτιμῶντο는 문맥상 어려워, POB의 해석을 따라 '애썼습니다'로 완곡하게 옮겨 적극적 시도를 드러냈습니다. ἀπογραφή는 공식적인 등록 절차를 가리키므로 '등록'으로 유지했습니다.
theological_decisions:
- issue: εὐσέβεια의 번역
  chosen_reading: 경건
  alternative_readings:
  - 경외
  - 신앙적 경건
  rationale: 유대인 박해 서사에서 εὐσέβεια는 하나님께 대한 경외와 신실한 종교적 충성을 함께 가리키므로, 한국어 성서 어휘로 가장 안정적인 '경건'을 택했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 문맥상 어려운 ἐτιμῶντο 처리
  chosen_reading: 의미를 단정하지 않고 '애썼습니다'로 처리
  alternative_readings:
  - 자신들을 구해 내는 것이 옳다고 여겼습니다
  - 자신들을 구해 내기를 원했습니다
  rationale: 전승 본문의 구문이 난해하므로, 과도한 해석을 피하면서도 적극적 구출 시도를 드러내는 방향으로 옮겼습니다.
  doctrine_reference: Translation philosophy §1, §5
