translation:
  language: ko
  text: '이는 법을 어기는 자들이 자기들의 분노 가운데서 자랑하거나[a], 자기들의 거만한 말로 의기양양해하지 못하게 하려는 것이었습니다[b]. 그들은 이렇게 말했습니다:'
  philosophy: optimal-equivalence
  footnotes:
