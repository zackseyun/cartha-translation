  lexicon: LSJ
  rationale: 단순한 도덕적 악함보다 율법/질서에 반하는 상태를 드러내기 위해 ‘불법한 자들’로 옮겼습니다.
- source_word: ἐν θυμῷ αὐτῶν
  english_pob_choice: in their wrath
  chosen_korean: 자기들의 분노 속에서
  alternatives_korean:
