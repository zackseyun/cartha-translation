  lexicon: BDAG
  rationale: θυμός의 강한 격정을 살리면서도, 한국어에서 ‘분노 속에서’가 가장 자연스럽고 문맥의 공격성을 잘 전달합니다.
- source_word: ἐν ὑπερηφανίᾳ γλώσσης αὐτῶν
  english_pob_choice: in the arrogance of their tongue
  chosen_korean: 자기들의 혀의 오만함 속에서
  alternatives_korean:
  - 자기들의 말의 오만함 속에서
  - 자기들의 교만한 말 속에서
  lexicon: LSJ
  rationale: 직역에 가까운 ‘혀’ 이미지를 유지해, 거만한 말씨라는 관용적 뉘앙스를 보존했습니다.
- source_word: λέγοντες
