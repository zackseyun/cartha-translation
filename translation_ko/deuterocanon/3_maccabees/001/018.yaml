    text: 또는 ‘격분’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들의 혀의 오만함’입니다. 거만하거나 불손한 말을 가리키는 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἵνα μὴ
  english_pob_choice: so that ... not
  chosen_korean: ~하지 못하도록 하시려는 것이었습니다
