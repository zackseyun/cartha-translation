base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/018.yaml
  text: so that the lawless might not boast in their wrath[a], nor exult in the arrogance of their tongue, saying[b],
  footnotes:
  - marker: a
    text: Or 'in their anger' for 'in their rage.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'in the arrogance of their tongue,' an idiom for proud or insolent speech.
    reason: cultural_note
translation:
  language: ko
  text: 그래서 불법한 자들이 자기들의 분노 속에서 자랑하지 못하고, 자기들의 혀의 오만함 속에서 기뻐하지 못하도록 하시려는 것이었습니다 — 말하면서[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘분노’는 POB 영어의 ‘wrath’에 해당하며, 본문은 격렬한 감정 상태를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘자기들의 혀의 오만함’으로, 거만하고 insolent한 말씨를 뜻하는 관용적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἵνα μὴ
  english_pob_choice: so that ... not
  chosen_korean: ~하지 못하도록 하시려는 것이었습니다
  alternatives_korean:
  - ~하지 않게 하시려는 것입니다
  - ~하지 못하게 하시려는 것입니다
  lexicon: LSJ
  rationale: 목적과 부정을 함께 드러내는 표현으로 옮겨, 뒤의 두 부정 목적절이 모두 하나의 의도 아래 놓여 있음을 자연스럽게 보여 줍니다.
- source_word: οἱ παράνομοι
  english_pob_choice: the lawless
  chosen_korean: 불법한 자들
  alternatives_korean:
  - 법 없는 자들
  - 악한 자들
  lexicon: LSJ
  rationale: 단순한 도덕적 악함보다 율법/질서에 반하는 상태를 드러내기 위해 ‘불법한 자들’로 옮겼습니다.
- source_word: ἐν θυμῷ αὐτῶν
  english_pob_choice: in their wrath
  chosen_korean: 자기들의 분노 속에서
  alternatives_korean:
