  source_fidelity: ‘그 음모를 제압한 뒤’는 κατακρατήσας τῆς ἐπιβουλῆς의 적대적 책략을 제어하거나 이긴 의미를 적절히 전달합니다. ‘결정했습니다’는 ἔκρινεν 뒤의 부정사구에 맞습니다. 다만 παρακαλέσαι의 목적어는 그리스어에서 명시되지 않았으며, 현재 번역의 ‘그들’은 바로 앞의 ‘도시들’을 가리켜 한국어에서는 도시 자체를 격려하는 듯 부자연스럽습니다. 방문한 도시의 사람들을 격려한다는 함의를 밝혀 자연스럽게 옮기는 것이 안전합니다.
