  text: But after gaining control of the plot[b][a], he decided to visit the neighboring cities and encourage them.
  footnotes:
  - marker: a
    text: Or 'after mastering the scheme' or 'after suppressing the plot.' The Greek participle κατακρατήσας can suggest getting the upper hand over a hostile plan.
    reason: lexical_alternative
  - marker: b
    text: Or 'he resolved to go to the nearby cities and exhort them.' The verb παρακαλέσαι can mean 'encourage,' 'exhort,' or 'appeal to.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 그 음모를 제압한 뒤, 그는 가까운 도시들을 찾아가 그들을 격려하기로 결정했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘제압한 뒤’는 κατακρατήσας의 ‘우위를 잡다/억누르다’는 뉘앙스를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: παρακαλέσαι는 ‘격려하다’ 외에도 ‘권면하다, 호소하다, 간청하다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
