    text: ‘제압한 뒤’는 κατακρατήσας의 ‘우위를 점하다’ 또는 ‘억누르다’라는 뉘앙스를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: παρακαλέσαι는 ‘격려하다’ 외에도 ‘권면하다’, ‘호소하다’, ‘간청하다’라는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
