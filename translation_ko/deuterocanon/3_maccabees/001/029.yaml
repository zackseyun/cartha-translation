  source_fidelity: 핵심 장면과 인과 관계는 대체로 반영되었으나, τείχη를 문맥상 단정하여 ‘성벽’으로 옮긴 것은 원문의 일반적인 ‘벽들’보다 구체적입니다. 또한 βεβηλώσεως는 단순한 물리적 ‘더러움’보다 거룩한 것을 속되게 하는 ‘모독/훼손’의 뜻이 분명하므로 본문에서 이를 더 정확히 드러내는 것이 좋습니다.
