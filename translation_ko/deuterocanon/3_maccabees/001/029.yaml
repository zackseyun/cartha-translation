  text: For it seemed that not only the people[a], but even the walls and the whole ground, were resounding[c][b], since then all things were being changed to death instead of the profanation of the place.
  footnotes:
  - marker: a
    text: Or 'were resounding.' The Greek verb conveys reverberating sound.
    reason: lexical_alternative
  - marker: b
    text: Or 'were being given over to death' or 'were being turned over to death.' The Greek expression is unusual and metaphorical.
    reason: lexical_alternative
  - marker: c
    text: '''The place'' refers contextually to the sacred precinct, likely the temple area; the Greek itself does not use the more specific word ''temple'' here.'
    reason: cross_reference
translation:
  language: ko
  text: 사람들만이 아니라 성벽과 온 땅도 울려 퍼지는 것처럼 보였습니다. 그때는 장소의 더러움 대신 모든 것이 죽음으로 바뀌고 있었기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘울려 퍼지는 것처럼’은 ἠχεῖν의 반향·공명 뉘앙스를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘장소’는 문맥상 거룩한 구역을 가리키지만, 그리스어는 여기서 더 구체적으로 ‘성전’이라고 말하지 않습니다.
    reason: cross_reference
  - marker: c
    text: ‘모독/더러움’의 뉘앙스를 담은 번역으로, βεβηλώσεως의 어휘적 강도를 반영합니다.
    reason: lexical_alternative
