base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/019.yaml
  text: We trampled the house of holiness[b][a], as the houses of abominations are trampled.
  footnotes:
  - marker: a
    text: Or 'the house of holiness' or 'the sanctuary.' The Greek literally says 'the house of sanctification.'
    reason: lexical_alternative
  - marker: b
    text: The rare Greek term rendered 'abominations' may also mean 'things devoted to destruction' or, more broadly, detestable or accursed things.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 거룩하게 구별된 집을 짓밟았습니다[a], 가증한 것들의 집들이 짓밟히듯이 말입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘성별(聖別)의 집’ 또는 ‘거룩하게 함의 집’입니다. 여기서는 성소를 가리키지만, 원문의 ‘집’이라는 표현을 보존했습니다.
    reason: lexical_alternative
  - marker: b
    text: 희귀어 προσολόθρευμα는 ‘멸절에 붙여진 것들’, ‘저주받은 것들’, 또는 더 넓게 ‘혐오스러운 것들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεπατήσαμεν
  english_pob_choice: we trampled
  chosen_korean: 짓밟았습니다
  alternatives_korean:
  - 밟았습니다
  - 짓이겼습니다
  - 유린했습니다
  lexicon: BDAG
  rationale: καταπατέω의 구체적 이미지인 ‘밟아 짓누르다’를 살리기 위해 ‘짓밟았습니다’를 택했습니다. ‘유린했습니다’는 결과를 잘 드러내지만 이미지가 더 해석적입니다.
- source_word: τὸν οἶκον
  english_pob_choice: the house
  chosen_korean: 집
  alternatives_korean:
  - 성전
  - 집
  lexicon: BDAG
  rationale: οἶκος의 기본 의미는 ‘집’이므로 이를 유지하되, 문맥상 성소/성전임을 한국어 수식어로 드러내도록 했습니다.
- source_word: τοῦ ἁγιασμοῦ
  english_pob_choice: of holiness
  chosen_korean: 거룩의
  alternatives_korean:
  - 성결의
  - 성화의
  - 성소의
  - 거룩한
  lexicon: BDAG
  rationale: ἁγιασμός는 ‘거룩함/성별됨/성결’의 범위를 가지므로, 영어 POB의 ‘of holiness’를 따라 ‘거룩의’로 옮겨 성소의 신성한 성격을 직접 보이게 했습니다.
- source_word: προσολοθρευμάτων
  english_pob_choice: abominations
  chosen_korean: 저주받은 것들
  alternatives_korean:
  - 가증한 것들
  - 멸절된 것들
  - 진멸된 것들
  lexicon: LSJ
  rationale: 희귀어 προσολόθρευμα는 ‘가증한 것’, ‘저주 아래 있는 것’, ‘멸절된 것’의 뉘앙스를 가질 수 있습니다. 본문 대비를 살리면서도 문자적 불확실성을 반영하기 위해 ‘저주받은 것들’로 옮겼습니다.
theological_decisions:
- issue: 성소 파괴의 수사적 대비를 한국어에서 어떻게 보존할지
  chosen_reading: ‘거룩의 집’과 ‘저주받은 것들의 집들’을 병렬로 두어 성스러움과 부정함의 대조를 유지했습니다.
  alternative_readings:
  - ‘성전’을 사용해 의미를 명시하기
  - ‘가증한 것들’로 번역해 도덕적 혐오를 더 직접화하기
  rationale: 그리스어는 성별된 집과 부정한 집들의 대비를 강하게 세웁니다. 해석을 앞세우기보다 원문의 수사적 긴장을 보존하는 것이 더 적절합니다.
  doctrine_reference: Translation philosophy §1, §3, §5
