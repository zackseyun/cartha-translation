review_pass:
  verdict: revise
  source_fidelity: 원문의 파견 대상과 목적은 대체로 반영했지만, ‘원로회의와 장로들에게서 온 사람들’은 두 집단이 파견자들의 출신지라는 뜻으로 다소 부자연스럽고, μᾶλλον의 비교·강조와 προθυμηθῆναι의 적극적 의지가 ‘가고 싶어지게 되었습니다’에서 충분히 드러나지 않습니다.
  naturalness: 현대 표준어 합쇼체로 문장을 다듬어, 원로회의와 장로들 가운데서 대표들을 보냈다는 관계를 분명히 하고 결말의 의욕·긴급성을 자연스럽게 표현했습니다.
  terminology: γερουσία는 ‘원로회의’로, πρεσβύτεροι는 별도로 ‘장로들’로 유지했습니다. ξένια는 손님을 맞이하고 예우하는 선물이라는 뜻을 보존하여 ‘환대의 선물’로 옮겼습니다.
  issues:
  - severity: medium
    issue: ‘원로회의와 장로들에게서 온 사람들’의 관계 표현
    rationale: 그리스어 ἀπὸ τῆς γερουσίας καὶ τῶν πρεσβυτέρων는 파견된 이들이 원로회의와 장로들로부터/그들 가운데서 뽑힌 것을 나타냅니다. ‘~에게서 온’은 문맥상 이동의 출발점처럼 들리고, 두 기관·집단과 대표들의 관계가 불분명합니다.
  - severity: medium
    issue: μᾶλλον의 비교 강조와 προθυμηθῆναι의 의미 약화
    rationale: ‘가고 싶어지게 되었습니다’는 단순한 욕구의 발생으로 들리며 ‘all the more eager’에 해당하는 비교적 강화와 적극적 열의를 충분히 전달하지 못합니다.
  revised_text: 유대인들이 원로회의와 장로들 가운데서 그를 맞이하고 환대의 선물을 가져오며 일어난 일로 기뻐할 사람들을 그에게 보냈을 때, 그는 가능한 한 빨리 그들에게 가기를 더욱 간절히 바라게 되었습니다.
  revised_footnotes:
  - marker: a
    text: ‘원로회의’로 옮긴 그리스어 게루시아(γερουσία)는 장로들로 이루어진 제도적 공의회를 가리킵니다. ‘원로원’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘환대의 선물’은 그리스어 크세니아(ξένια)를 옮긴 것으로, 손님을 맞이하거나 예우할 때 주는 선물을 가리킵니다.
    reason: cultural_note
  revision_rationale: ‘원로회의와 장로들 가운데서’로 파견 대표들의 출처를 자연스럽고 정확하게 밝혔습니다. 또한 ‘더욱 간절히 바라게 되었습니다’로 μᾶλλον과 προθυμηθῆναι의 강화된 의욕을 반영했으며, ‘가능한 한 빨리’로 ὡς τάχιστα의 긴급성을 유지했습니다. 각주는 원문의 제도적·문화적 어휘를 설명하기 위해 해당 표현 뒤에 a와 b 표지로 붙일 수 있습니다.
