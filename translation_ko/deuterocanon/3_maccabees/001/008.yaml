source:
  edition: lxx-swete-1909
  text: Τῶν δὲ Ἰουδαίων διαπεμψαμένων πρὸς αὐτὸν ἀπὸ τῆς γερουσίας καὶ τῶν πρεσβυτέρων τοὺς ἀσπασομένους αὐτὸν καὶ ξένια κομιοῦντας καὶ ἐπὶ τοῖς συμβεβηκόσιν χαρησομένους, συνέβη μᾶλλον αὐτὸν προθυμηθῆναι, ὡς τάχιστα πρὸς αὐτοὺς παραγενέσθαι.
  language: Greek
  pages: []
  confidence: high
base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/008.yaml
  text: But when the Jews had sent to him[a], from the council of elders and the elders, men to greet him, bring gifts of hospitality, and rejoice over what had happened[b], it happened that he became all the more eager to come to them as quickly as possible.
  footnotes:
  - marker: a
    text: Or 'senate' for 'council of elders'; the Greek term is γερουσία, an institutional body of elders.
    reason: lexical_alternative
  - marker: b
    text: '''Gifts of hospitality'' renders ξένια, gifts associated with receiving or honoring a guest.'
    reason: cultural_note
translation:
  language: ko
  text: 유대인들이 원로회의와 장로들에게서 온 사람들, 곧 그를 맞이하고 환대의 선물을 가져오며 일어난 일에 기뻐할 사람들을 그에게 보냈을 때, 그는 그들에게 가능한 한 빨리 가고 싶어지게 되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαπεμψαμένων
  english_pob_choice: had sent
  chosen_korean: 보냈을 때
  alternatives_korean:
  - 파견했을 때
  - 보내었을 때
  lexicon: LSJ
  rationale: 분사구문은 선행 행위를 나타내므로, 자연스러운 한국어로 과거 선행의 의미를 살려 ‘보냈을 때’로 옮겼습니다.
- source_word: γερουσίας
  english_pob_choice: council of elders
  chosen_korean: 원로회의
  alternatives_korean:
  - 장로회의
  - 장로 원로회의
  - 원로원
  lexicon: LSJ
  rationale: 공적 기관인 γερουσία의 제도적 뉘앙스를 살리면서도, 로마식 ‘원로원’보다 유대적 맥락을 덜 흐리게 하는 ‘원로회의’를 택했습니다.
- source_word: ξένια
  english_pob_choice: gifts of hospitality
  chosen_korean: 환대의 선물
  alternatives_korean:
  - 손님맞이 선물
  - 환영의 선물
  - 접대 선물
  lexicon: LSJ
  rationale: 단순한 선물이 아니라 손님을 맞이하고 예우하는 문화적 성격을 드러내기 위해 ‘환대의 선물’로 옮겼습니다.
- source_word: ἐπὶ τοῖς συμβεβηκόσιν χαρησομένους
  english_pob_choice: rejoice over what had happened
  chosen_korean: 일어난 일에 기뻐할 사람들을
  alternatives_korean:
  - 일어난 일로 기뻐할 사람들을
  - 생긴 일에 기뻐할 사람들을
  lexicon: LSJ
  rationale: 목적 분사들의 연속을 살려, envoys의 역할 설명으로 자연스럽게 읽히는 ‘기뻐할 사람들’을 택했습니다.
- source_word: μᾶλλον ... προθυμηθῆναι
  english_pob_choice: he became all the more eager
  chosen_korean: 그는 ... 가고 싶어지게 되었습니다
  alternatives_korean:
  - 그는 더욱 열망하게 되었습니다
  - 그는 한층 더 서두르게 되었습니다
  lexicon: LSJ
  rationale: προθυμέομαι의 의욕/열의를 현대 한국어에서 과도하게 종교화하지 않으면서, 비교 부사 μᾶλλον의 강화 의미를 살렸습니다.
