revisions:
- from: 그런데 어떤 이들이 이것은 그렇게 되어서는 안 된다고 말했습니다. 왜냐하면 이방인들도 들어가지 못하고, 모든 제사장도 아니라 오직 모든 것 위에 있는 대제사장만 — 그것도 일 년에 한 번만 — 들어가기 때문입니다. 그러나 그는 조금도 설득되지 않았습니다.[a]
  to: 그런데 어떤 이들이 이것은 그렇게 되어서는 안 된다고[a] 말했습니다. 이방인조차 들어가지 못하며, 모든 제사장이 들어가는 것도 아니고, 오직 모든 이들 위에 있는 대제사장만, 그것도 해마다 한 번만 들어가기 때문입니다. 그러나 그는 조금도 설득되지 않았습니다.
  rationale: The revision corrects the personal, hierarchical sense of πάντων, clarifies the coordinated Greek contrast regarding access, and moves the lexical footnote marker to the clause it documents. It retains the source’s cultic-access argument, its annual restriction, and the passive sense of “was not persuaded.”
