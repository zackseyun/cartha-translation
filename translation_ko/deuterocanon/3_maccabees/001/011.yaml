base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/011.yaml
  text: But when some said that this ought not to be done[a], because not even the Gentiles enter, nor all the priests, but only the high priest who is over all—and he only once a year—he would not be persuaded at all.
  footnotes:
  - marker: a
    text: Or, 'this is not fitting to be done.' The Greek emphasizes propriety or appropriateness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 어떤 이들이 이것은 그렇게 되어서는 안 된다고 말했습니다. 왜냐하면 이방인들도 들어가지 못하고, 모든 제사장도 아니라 오직 모든 것 위에 있는 대제사장만 — 그것도 일 년에 한 번만 — 들어가기 때문입니다. 그러나 그는 조금도 설득되지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이것은 행하기에 합당하지 않다고’로도 옮길 수 있습니다. 그리스어는 마땅함·적절함의 뜻을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ καθήκειν γίνεσθαι τοῦτο
  english_pob_choice: this ought not to be done
  chosen_korean: 이것은 그렇게 되어서는 안 된다고
  alternatives_korean:
  - 이 일은 마땅히 행해져서는 안 된다고
  - 이것은 하기에 합당하지 않다고
  lexicon: BDAG
  rationale: καθήκειν은 ‘마땅하다/합당하다’의 적절성 판단을 담고 있으므로, 한국어에서는 ‘되어서는 안 된다’로 옮겨 행위의 부적절성을 자연스럽게 살렸습니다.
- source_word: τοῖς ἔθνεσιν
  english_pob_choice: the Gentiles
  chosen_korean: 이방인들도
  alternatives_korean:
  - 민족들도
  - 나라들도
  lexicon: BDAG
  rationale: 성전 출입 제한 문맥에서 ἔθνη는 일반 ‘민족’보다 유대인 밖의 사람들을 가리키는 ‘이방인’이 가장 분명합니다.
- source_word: μόνῳ τῷ προηγουμένῳ πάντων ἀρχιερεῖ
  english_pob_choice: only the high priest who stands over all
  chosen_korean: 오직 모든 것 위에 있는 대제사장만
  alternatives_korean:
  - 오직 모든 것 위에 서 있는 대제사장만
  - 오직 만인의 우위에 있는 대제사장만
  lexicon: BDAG
  rationale: προηγουμένῳ πάντων은 ‘모든 것 위에/모든 사람 위에 있는’ 우선성과 우위를 나타내므로, 과도한 설명 없이 위계적 의미를 드러내는 표현을 택했습니다.
- source_word: κατ᾽ ἐνιαυτὸν ἅπαξ
  english_pob_choice: once a year
  chosen_korean: 일 년에 한 번만
  alternatives_korean:
  - 매년 한 번만
  - 일 년에 한 차례만
  lexicon: BDAG
  rationale: 성전 의례의 시간 제한을 한국어로 가장 직접적으로 드러내는 관용적 표현입니다.
- source_word: οὐδαμῶς ἐπείθετο
  english_pob_choice: he would not be persuaded at all
  chosen_korean: 그는 조금도 설득되지 않았습니다
  alternatives_korean:
  - 그는 전혀 설득되지 않았습니다
  - 그는 도무지 설득되지 않았습니다
  lexicon: BDAG
  rationale: ἐπείθετο의 수동적 의미를 살려 ‘설득되지 않다’로 옮겼고, οὐδαμῶς의 강한 부정을 ‘조금도’로 보강했습니다.
theological_decisions:
- issue: 성전 출입의 위계와 제한을 어떻게 드러낼지
  chosen_reading: 논지를 일반적인 법적 금지보다 성전 출입의 계층적 제한으로 읽히게 했습니다.
  alternative_readings:
  - 단순히 ‘그렇게 하면 안 된다’는 행위 규범으로 완화하는 읽기
  rationale: 본문은 이방인, 모든 제사장, 대제사장의 순차적 대비를 통해 성소 접근의 제한을 논증하므로, 그 구조를 한국어에서도 보존해야 합니다.
  doctrine_reference: 본문의 제의적 질서를 평탄화하지 않고 원문의 층위를 유지합니다.
