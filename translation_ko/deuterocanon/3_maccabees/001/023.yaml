  text: 그들이 무기를 향해 돌진하려고, 또 조상들의 율법을 위해 담대히 죽으려고 소리치자, 그들은 그곳에 큰 소란을 일으켰고, 노인들과 장로들이 간신히[a]
  philosophy: optimal-equivalence
  footnotes:
