  source_fidelity: 마지막의 ὑπό τε τῶν γεραιῶν καὶ τῶν πρεσβυτέρων는 뒤따를 동작의 행위자를 나타내는 수동적 ὑπό 구문입니다. 초안의 “노인들과 장로들이 간신히”는 이들을 주어로 바꾸어 문법적 관계를 흐립니다. 또한 ὑπὸ τοῦ πατρῴου νόμου는 ‘율법을 위해’라고 단정하기보다, 원문의 다소 압축된 ‘조상 전래의 율법 아래에서’를 보존하는 편이 안전합니다.
