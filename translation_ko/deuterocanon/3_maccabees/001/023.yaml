translation:
  language: ko
  text: 그들이 무기를 향해 돌진하려고, 또 조상 전래의 율법 아래에서 담대히 죽으려고 소리치자, 그들은 그곳에 큰 소란을 일으켰습니다. 그러나 노인들과 장로들에 의해서도 겨우 …[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제공된 그리스어 본문은 “노인들과 장로들에 의해서도 겨우” 뒤에서 문장이 중간에 끊깁니다. 따라서 번역도 원문에 없는 말을 보태지 않고 미완으로 남깁니다.
    reason: textual_variant
