base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/001.yaml
  text: Now Philopator[a], having learned from those who had returned of the seizure by Antiochus of the regions under his rule, gave orders to all his infantry and cavalry forces, took along his sister Arsinoe, and set out as far as the region of Raphia, where those with Antiochus had encamped.
  footnotes:
  - marker: a
    text: Greek 'those around Antiochus,' an idiom for Antiochus' party or forces; it may include Antiochus himself.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 필로파토르[a]는 돌아온 사람들에게서 안티오코스가 자기 통치 아래에 있던 지역들을 빼앗아 가고 있다는 소식을 듣고, 모든 보병과 기병에게 명령을 내린 뒤, 자기 누이 아르시노에를 데리고 라피아 부근까지 출정하였으며, 그곳에 안티오코스 편의 사람들이 진을 치고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 οἱ περὶ Ἀντίοχον은 ‘안티오코스 주변의 사람들’이라는 관용구로, 안티오코스의 일행이나 군세를 가리킬 수 있으며 그 자신을 포함할 가능성도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρὰ τῶν ἀνακομισθέντων
  english_pob_choice: from those who had returned
  chosen_korean: 돌아온 사람들에게서
  alternatives_korean:
  - 돌아와 소식을 전한 사람들에게서
  - 돌아온 자들로부터
  lexicon: LSJ
  rationale: ἀνακομισθέντων은 단순히 ‘돌아온 사람들’이라는 뜻을 담고 있으므로, 본문이 직접 말하지 않는 ‘사자’나 ‘전령’을 덧붙이지 않았습니다.
- source_word: τὴν γινομένην ... ἀφαίρεσιν
  english_pob_choice: the seizure ... was taking away
  chosen_korean: 빼앗아 가고 있다는
  alternatives_korean:
  - 빼앗는 중이라는
  - 철거하고 있다는
  lexicon: LSJ
  rationale: ἀφαίρεσις는 ‘빼앗음, 제거’의 뜻이므로, 한국어에서도 약탈·박탈의 동작을 분명히 드러내는 표현을 택했습니다.
- source_word: ταῖς πάσαις δυνάμεσιν πεζικαῖς καὶ ἱππικαῖς
  english_pob_choice: all his infantry and cavalry forces
  chosen_korean: 모든 보병과 기병에게 명령을 내린 뒤
  alternatives_korean:
  - 모든 보병과 기병 전력에게
  - 모든 보병 및 기병 부대에게
  lexicon: LSJ
  rationale: πεζικαῖς καὶ ἱππικαῖς는 군사 편제를 가리키므로, 현대 한국어의 자연스러운 군사어인 ‘보병과 기병’으로 옮겼습니다.
- source_word: οἱ περὶ Ἀντίοχον
  english_pob_choice: those with Antiochus
  chosen_korean: 안티오코스 편의 사람들
  alternatives_korean:
  - 안티오코스와 함께한 사람들
  - 안티오코스 주변의 사람들
  lexicon: LSJ
  rationale: οἱ περὶ + 대격은 지도자와 그 일행/세력을 가리키는 관용구이므로, 한국어에서는 그 정치·군사적 소속을 드러내는 ‘편의 사람들’로 옮겼습니다.
theological_decisions:
- issue: 필로파토르의 군사 원정 서술에서 동작의 진행성과 완료성
  chosen_reading: ‘소식을 듣고… 명령을 내린 뒤… 출정하였으며’로 원문의 사건 진행 순서를 따라 서술했습니다.
  alternative_readings:
  - ‘소식을 듣자마자… 나아갔습니다’
  - ‘듣고서… 행군했습니다’
  rationale: 이 절은 신학적 논쟁점이 크지 않으나, 그리스어 분사 연쇄가 만드는 시간적 순서를 한국어에서도 명료하게 유지하는 것이 중요합니다.
  doctrine_reference: 서사 구조와 시제-상(tense/aspect) 보존
