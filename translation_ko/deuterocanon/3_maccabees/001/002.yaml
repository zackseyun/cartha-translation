  lexicon: LSJ
  rationale: 수동형이므로 그가 스스로 간 것이 아니라 옮겨졌다는 뉘앙스를 살려 ‘옮겨져’로 렌더링했습니다.
- source_word: ὡς μόνος κτεῖναι αὐτόν
  english_pob_choice: to kill him himself
  chosen_korean: 그를 자신이 직접 죽여
