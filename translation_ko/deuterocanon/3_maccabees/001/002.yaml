  lexicon: BDAG
  rationale: μόνος는 ‘혼자서/직접’의 뉘앙스를 가지므로, 단순히 홀로 행동했다는 뜻과 자기 손으로 죽인다는 뜻을 함께 드러내기 위해 ‘자신이 직접’으로 옮겼습니다.
theological_decisions:
