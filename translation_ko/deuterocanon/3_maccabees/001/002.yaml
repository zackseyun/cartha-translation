base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/002.yaml
  text: But a certain Theodotus[a], having planned to carry out the plot, took the best of the Ptolemaic weapons that had been assigned to him and was conveyed by night to Ptolemy’s tent, to kill him himself and in this way bring the war to an end.
  footnotes:
  - marker: a
    text: Or 'to kill him alone' or 'to kill him single-handedly'; the Greek μόνος may emphasize that Theodotus intended to do the killing himself.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 어떤 테오도토스는 그 음모를 실행하려고 마음먹고, 자신에게 맡겨진 프톨레마이오스의 무기들 가운데 가장 좋은 것들을 가져다가 밤에 프톨레마이오스의 천막으로 옮겨져, 그를 자신이 직접 죽여 이로써 전쟁을 끝내려 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 혼자 죽이려’라는 뜻일 수 있습니다. 그리스어 μόνος는 테오도토스가 직접 그 일을 하려 했다는 점을 강조할 수 있습니다.
    reason: lexical_alternative
