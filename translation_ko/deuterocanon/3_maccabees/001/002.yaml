  lexicon: LSJ / BDAG
  rationale: τὰ κράτιστα의 최상급 의미를 살려 ‘가장 좋은 것들’로 옮기고, 무기들의 출처를 분명히 했습니다.
- source_word: διεκομίσθη νύκτωρ
