base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/002.yaml
  text: But a certain Theodotus[a], having planned to carry out the plot, took the best of the Ptolemaic weapons that had been assigned to him and was conveyed by night to Ptolemy’s tent, to kill him himself and in this way bring the war to an end.
  footnotes:
  - marker: a
    text: Or 'to kill him alone' or 'to kill him single-handedly'; the Greek μόνος may emphasize that Theodotus intended to do the killing himself.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 테오도토스라는 어떤 사람은 그 음모를 실행하기로 마음먹고, 자신에게 미리 배정된 프톨레마이오스의 무기들 가운데 가장 좋은 것들을 챙겨 밤에 프톨레마이오스의 천막으로 옮겨졌습니다. 그는 프톨레마이오스를 직접 죽이고, 그렇게 해서 전쟁을 끝내려 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘프톨레마이오스를 혼자서 죽이려’라는 뜻일 수 있습니다. 그리스어 μόνος는 테오도토스 자신이 그 일을 하려 했다는 점 또는 그가 혼자 행동하려 했다는 점을 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θεόδοτος δέ τις
  english_pob_choice: But a certain Theodotus
  chosen_korean: 어떤 테오도토스
  alternatives_korean:
  - 한 테오도토스
  - 테오도토스라는 어떤 사람
  lexicon: 고유명사 표기 관행
  rationale: 인물 소개의 불특정성을 살리기 위해 ‘어떤’으로 옮기고, 고유명사는 현대 외래어 표기법에 따라 테오도토스로 적었습니다.
- source_word: ἐπιβουλήν
  english_pob_choice: the plot
  chosen_korean: 그 음모
  alternatives_korean:
  - 그 계략
  - 그 모의
  lexicon: LSJ
  rationale: 암살 목적의 적대적 계획이라는 뜻을 살려 ‘음모’로 옮겼습니다.
- source_word: ἐκπληρῶσαι
  english_pob_choice: to carry out
  chosen_korean: 실행하려고
  alternatives_korean:
  - 수행하려고
  - 이루려고
  lexicon: BDAG
  rationale: 여기서는 선한 ‘성취’가 아니라 계획을 실제로 집행한다는 뜻이므로, ‘실행하다’가 가장 자연스럽고 정확합니다.
- source_word: ὅπλων Πτολεμαικῶν τὰ κράτιστα
  english_pob_choice: the best of the Ptolemaic weapons
  chosen_korean: 프톨레마이오스의 무기들 가운데 가장 좋은 것들
  alternatives_korean:
  - 프톨레마이오스 계열의 무기들 중 최상급의 것들
  - 프톨레마이오스의 무기들 중 가장 뛰어난 것들
  lexicon: LSJ / BDAG
  rationale: τὰ κράτιστα의 최상급 의미를 살려 ‘가장 좋은 것들’로 옮기고, 무기들의 출처를 분명히 했습니다.
- source_word: διεκομίσθη νύκτωρ
  english_pob_choice: was conveyed by night
  chosen_korean: 밤에 … 옮겨져
  alternatives_korean:
  - 밤중에 … 이송되어
  - 밤에 … 데려가져
  lexicon: LSJ
  rationale: 수동형이므로 그가 스스로 간 것이 아니라 옮겨졌다는 뉘앙스를 살려 ‘옮겨져’로 렌더링했습니다.
- source_word: ὡς μόνος κτεῖναι αὐτόν
  english_pob_choice: to kill him himself
  chosen_korean: 그를 자신이 직접 죽여
  alternatives_korean:
  - 그를 혼자서 죽여
  - 그를 홀로 죽이려고
  lexicon: BDAG
  rationale: μόνος는 ‘혼자서/직접’의 뉘앙스를 가지므로, 단순히 홀로 행동했다는 뜻과 자기 손으로 죽인다는 뜻을 함께 드러내기 위해 ‘자신이 직접’으로 옮겼습니다.
theological_decisions:
- issue: 전쟁 종결의 수단이 암살로 제시되는 서술을 어떻게 처리할지
  chosen_reading: 문장의 의도와 결과를 그대로 드러내어, 그가 프톨레마이오스를 죽여 전쟁을 끝내려 했다고 옮겼습니다.
  alternative_readings:
  - 전쟁을 끝장내려 하였다
  - 전쟁을 종결시키려 하였다
  rationale: 본문은 암살 시도가 전쟁 종결의 수단으로 제시되므로, 그 긴장을 희석하지 않고 직접적으로 전달하는 것이 원문의 서술 의도에 더 가깝습니다.
  doctrine_reference: 서술 본문
