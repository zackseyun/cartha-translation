theological_decisions:
- issue: τερατεύεσθαι의 수사적 강도
  chosen_reading: 단순한 ‘그릇되게 말하다’보다, 사건을 괴기하고 비정상적인 것으로 만들어 버리는 강한 왜곡감을 드러내는 번역을 택했습니다.
  alternative_readings:
