translation:
  language: ko
  text: 그리고 어떤 사람이 생각 없이, 바로 이 일이 괴이한 일로 잘못 꾸며지고 있다고 말하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바로 이 일이 기이한 징조처럼 다루어지고 있다’로도 옮길 수 있습니다. 그리스어 τερατεύεσθαι는 어떤 일을 경이로운 것, 징조, 또는 괴이한 것으로 꾸미거나 다루는 뜻을 지닙니다.
    reason: lexical_alternative
