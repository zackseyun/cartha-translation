  text: And the multitude, as before, kept on with these men, pleading; but the elders around the king were trying in many ways to turn his arrogant mind away from the plot he had conceived.
translation:
  language: ko
  text: 그리고 무리는 전과 같이 그들과 함께하며 간청하였고, 왕 주변의 장로들은 여러 가지 방법으로 그의 오만한 마음을 그가 품은 음모에서 돌려세우려 했습니다.
  philosophy: formal
lexical_decisions:
- source_word: τὸ μὲν πλῆθος ... ἀνεστρέφετο δεόμενον
  english_pob_choice: the multitude ... kept on with these men, pleading
  chosen_korean: 무리는 전과 같이 그들과 함께하며 간청하였고
  alternatives_korean:
  - 무리는 전과 같이 이 사람들에게 매달려 간청하였고
  - 무리는 전처럼 그들과 어울리며 애원하였고
  lexicon: πλῆθος → 무리; ἀνεστρέφετο + δεόμενον → 함께하며 간청하다
  rationale: ἀνεστρέφετο는 단순히 ‘머무르다’보다 ‘함께 어울리며 계속 움직이다/지내다’의 뉘앙스가 있어, POB의 ‘kept on with these men’에 맞춰 관계적 지속성을 살렸습니다.
- source_word: οἱ δὲ περὶ τὸν βασιλέα πρεσβύτεροι
  english_pob_choice: the elders around the king
  chosen_korean: 왕 주변의 장로들
  alternatives_korean:
  - 왕 곁의 장로들
  - 왕을 둘러싼 장로들
  lexicon: πρεσβύτεροι → 장로들
  rationale: πρεσβύτεροι는 연령 자체보다 지위와 원로성을 가리키므로 ‘장로들’이 가장 직접적입니다.
- source_word: τὸν ἀγέρωχον αὐτοῦ νοῦν
  english_pob_choice: his arrogant mind
  chosen_korean: 그의 오만한 마음
  alternatives_korean:
  - 그의 거만한 생각
  - 그의 교만한 마음
  lexicon: ἀγέρωχος → 오만한; νοῦς → 마음/생각
  rationale: ἀγέρωχος는 태도의 ‘거만함’보다 더 강한 ‘오만함’을 띠고, νοῦς는 단순 지성보다 의지와 내면 방향을 포함해 ‘마음’으로 옮기는 것이 적절합니다.
- source_word: τῆς ἐντεθυμημένης ἐπιβουλῆς
  english_pob_choice: the plot he had conceived
  chosen_korean: 그가 품은 음모
  alternatives_korean:
  - 그가 계획한 음모
  - 그가 생각해 낸 계책
  lexicon: ἐπιβουλή → 음모; ἐντεθυμημένη → 품은/마음에 둔
  rationale: ἐπιβουλή는 중립적 ‘계획’보다 해로운 의도가 담긴 ‘음모’가 더 정확하며, ἐντεθυμημένη는 이미 마음에 품은 상태를 나타냅니다.
theological_decisions:
- issue: 왕의 오만한 마음을 돌이키려는 시도의 의미
  chosen_reading: 이 절은 인간 조언자들이 폭군의 내면을 제어하려는 정치적·도덕적 긴장을 보여 주며, 구원론적 용어로 확장하지 않고 서술 자체를 유지합니다.
  alternative_readings:
  - 하나님의 섭리적 제어로 읽기
  - 도덕적 훈계의 일반 원리로 축소하기
  rationale: 문맥상 본문은 궁정 정치의 실제 충돌을 묘사하므로, 초점을 왕의 내면 변화와 조언자들의 시도에 그대로 두는 것이 원문에 충실합니다.
  doctrine_reference: 서술문맥 보존
