    rationale: δογμάτων은 신앙 일반뿐 아니라 조상에게서 전해진 신념·가르침·원칙을 가리킬 수 있습니다. ‘조상들에게서 물려받은 가르침’은 이를 보존하면서 현대 한국어로 자연스럽습니다.
