base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/003.yaml
  text: Now Dositheus[a], the one called son of Drimylus, a Jew by birth, but later having changed his customs and become estranged from the ancestral beliefs, lodged some obscure man in the tent in his place[c][b]; and it happened that this man received that one's punishment.
  footnotes:
  - marker: a
    text: Or, 'Dositheus, called the son of Drimylus.' The Greek wording likely gives a patronymic identification.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'having changed the customs/laws and become estranged from the ancestral dogmas.'
    reason: lexical_alternative
  - marker: c
    text: Or, 'some insignificant man' or 'some unknown man.'
    reason: lexical_alternative
translation:
  language: ko
  text: 드리뮈로스의 아들이라고 불리는 도시테오스는 태생은 유대인이었으나, 나중에 자기 관습을 바꾸고 조상들에게서 물려받은 가르침에서 멀어져, 어느 무명인을 자기 대신 천막에 눕혔습니다. 그리하여 그 사람은 그에게 돌아갈 벌을 받게 되었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘드리뮈로스의 아들이라고 불리는 도시테오스’로 옮길 수 있습니다. 그리스어 표현은 아버지 이름에 따른 식별을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘자기 관습을 바꾸고 조상들의 가르침에서 멀어진’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘어느 보잘것없는 사람’, ‘어느 이름 없는 사람’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δωσίθεος ὁ Δριμύλου λεγόμενος
  english_pob_choice: Dositheus, the one called son of Drimylus
  chosen_korean: 도시테오스—드리뮈로스의 아들이라고 불리는 사람
  alternatives_korean:
  - 드리뮈로스의 아들이라고 불리는 도시테오스
  - 도시테오스, 드리뮈로스의 아들로 불리는 사람
  lexicon: LSJ
  rationale: λεγόμενος는 단순한 이름 뒤 설명보다 ‘~라고 불리는’으로 옮기는 것이 자연스럽고, patronymic 식별을 드러내기 위해 ‘드리뮈로스의 아들’ 구조를 유지했습니다.
- source_word: τὸ γένος Ἰουδαῖος
  english_pob_choice: a Jew by birth
  chosen_korean: 태생은 유대인이었으나
  alternatives_korean:
  - 유대인 혈통이었으나
  - 유대인으로 태어났으나
  lexicon: LSJ
  rationale: τὸ γένος은 현재 신앙보다 출생·혈통의 범주를 가리키므로, ‘태생은’으로 출신 정체성을 분명히 했습니다.
- source_word: μεταβαλὼν τὰ νόμιμα καὶ τῶν πατρίων δογμάτων ἀπηλλοτριωμένος
  english_pob_choice: having changed his customs and become estranged from the ancestral beliefs
  chosen_korean: 자기 관습을 바꾸고 조상들의 신앙에서 멀어진
  alternatives_korean:
  - 율법적 관습을 바꾸고 조상들의 전통에서 멀어진
  - 조상들의 교리에서 소외된 채 관습을 바꾼
  lexicon: LSJ
  rationale: νόμιμα는 여기서 추상적 ‘율법’보다 생활 속 관습·규범에 가깝고, ἀπηλλοτριωμένος는 ‘소외되다’보다 관계적 거리감을 드러내는 ‘멀어지다’가 문맥상 덜 과장됩니다.
- source_word: ἄσημόν τινα
  english_pob_choice: some obscure man
  chosen_korean: 어느 무명인
  alternatives_korean:
  - 어느 보잘것없는 사람
  - 어느 이름 없는 사람
  lexicon: LSJ
  rationale: ἄσημος는 ‘표가 없는, 알려지지 않은, 두드러지지 않은’의 뉘앙스를 가지므로, 사회적 미미함을 담되 너무 평가적으로 굳어지지 않게 ‘무명인’으로 옮겼습니다.
- source_word: κατέκλινεν ἐν τῇ σκηνῇ
  english_pob_choice: lodged ... in the tent in his place
  chosen_korean: 자기 대신 천막에 눕혔습니다
  alternatives_korean:
  - 자기 대신 천막에 재웠습니다
  - 자기 대신 천막에 들여 눕혔습니다
  lexicon: LSJ
  rationale: κατακλίνω는 ‘눕히다, 자리에 들이다’의 뜻이므로, 대체 인물을 취약한 위치에 배치한 행위를 드러내기 위해 ‘눕혔습니다’로 간결하게 처리했습니다.
- source_word: τὴν ἐκείνου κόλασιν
  english_pob_choice: that one's punishment
  chosen_korean: 그에게 돌아갈 벌
  alternatives_korean:
  - 그 사람의 벌
  - 그의 처벌
  lexicon: LSJ
  rationale: κόλασις는 단순한 징계보다 응보적 ‘벌’의 힘이 강하므로, 귀속 관계를 살려 ‘그에게 돌아갈 벌’로 표현했습니다.
theological_decisions:
- issue: 도시테오스의 유대적 정체성과 배교적 평가를 어떻게 드러낼지
  chosen_reading: ‘태생은 유대인이었으나 나중에는 자기 관습을 바꾸고 조상들의 신앙에서 멀어진’으로 옮겨, 출생 정체성은 인정하되 이후의 이탈을 분명히 했습니다.
  alternative_readings:
  - ‘유대인으로 태어났으나 나중에 율법을 바꾸고 조상들의 교리에서 떠난’
  - ‘유대인 혈통이었으나 전통을 버린’
  rationale: 본문은 단순한 민족 정보가 아니라 조상 전승과의 단절을 도덕적으로 평가합니다. 한국어에서도 그 긴장을 약화하지 않되, 후대 교리 용어를 과잉 투사하지 않도록 조절했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; render clearly in modern Korean.'
- issue: ‘그에게 돌아갈 벌’의 귀속과 반어적 결과
  chosen_reading: 대체된 사람이 원래 다른 이에게 해당하던 벌을 받는 구조를 그대로 살렸습니다.
  alternative_readings:
  - ‘그 사람은 그를 위한 벌을 받았습니다’
  - ‘그는 남의 벌을 떠안았습니다’
  rationale: ἐκεῖνου κόλασιν은 벌의 귀속이 반전되는 비극적 아이러니를 포함하므로, 이를 평이한 문장으로 풀되 인과를 흐리지 않도록 했습니다.
  doctrine_reference: 'DOCTRINE.md: Retain narrative irony and moral consequence without smoothing.'
