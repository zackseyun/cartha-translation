revisions:
- from: 그런데 도시테오스는—드리뮈로스의 아들이라고 불리는 사람으로서, 태생은 유대인이었으나 나중에는 자기 관습을 바꾸고 조상들의 신앙에서 멀어진—어느 무명인을 자기 대신 천막에 눕혔습니다. 그 결과 그 사람은 그에게 돌아갈 벌을 받게 되었습니다.[a][b][c]
  to: 드리뮈로스의 아들이라고 불리는 도시테오스는 태생은 유대인이었으나, 나중에 자기 관습을 바꾸고 조상들에게서 물려받은 가르침에서 멀어져, 어느 무명인을 자기 대신 천막에 눕혔습니다. 그리하여 그 사람은 그에게 돌아갈 벌을 받게 되었습니다.[a][b][c]
  rationale: 원문의 약한 접속과 συνέβη의 서술적 귀결을 더 가깝게 반영하도록 ‘그런데’와 ‘그 결과’를 조정했습니다. 또한 δογμάτων을 ‘조상들에게서 물려받은 가르침’으로 옮겨, 유대적 전승과의 단절이라는 평가를 보존하되 ‘신앙’이나 ‘교리’ 어느 한쪽으로 의미를 좁히지 않았습니다. 대체 인물을 천막에 눕혀 그가 원래 도시테오스에게 해당하던 벌을 받게 된 사건의 반어는 유지했습니다.
