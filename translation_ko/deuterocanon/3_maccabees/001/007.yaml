    rationale: ‘이 일을 한 뒤에’는 앞 문맥을 가리키는 원문의 지시성을 더 직접적이고 문어적인 합쇼체 문체로 전달합니다.
  revised_text: 이 일을 한 뒤에, 성소들에 선물을 나누어 주고, 그의 통치 아래 있는 이들이 자신감을 갖게 하였습니다.
