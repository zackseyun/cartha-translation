  text: And after doing this, and distributing gifts to the sanctuaries, he made those under his rule confident.
translation:
  language: ko
  text: 이 일을 한 뒤에, 성소들에 선물을 나누어 주고, 그의 통치 아래 있는 이들이 자신감을 갖게 하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιήσας δὲ τοῦτο
  english_pob_choice: And after doing this
  chosen_korean: 그런 일을 하고 나서
  alternatives_korean:
  - 이 일을 한 뒤에
  - 그렇게 한 후에
  lexicon: LSJ
  rationale: 부정과거 분사로 앞선 행위를 먼저 처리한 뒤의 동작을 나타내므로, 한국어에서는 자연스러운 순서 표현인 ‘하고 나서’로 옮겼습니다.
- source_word: τοῖς τεμένεσι
  english_pob_choice: to the sanctuaries
  chosen_korean: 성소들에
  alternatives_korean:
  - 신전들에
  - 거룩한 구역들에
  - 사당들에
  lexicon: LSJ
  rationale: τέμενος는 단순한 건물보다 성별된 예배 공간/구역을 가리키므로, ‘성소들’이 가장 과도한 구체화를 피하면서도 의미를 살립니다.
- source_word: δωρεὰς ἀπονείμας
  english_pob_choice: distributing gifts
  chosen_korean: 선물을 나누어 주고
  alternatives_korean:
  - 선물들을 배분하고
  - 기증물을 베풀고
  - 헌물을 나누고
  lexicon: LSJ
  rationale: δώρεα는 본문의 문맥상 왕이 베푸는 선물/증여이며, ἀπονέμω는 나누어 주다·할당하다의 뜻이어서, 평이한 현대 한국어로 ‘나누어 주고’라고 옮겼습니다.
- source_word: εὐθαρσεῖς
  english_pob_choice: confident
  chosen_korean: 자신감 있게
  alternatives_korean:
  - 용기를 북돋운
  - 담대하게
  - 기운 나게
  lexicon: LSJ
  rationale: 형용사 ‘좋은 마음/기운이 난’의 결과 상태를 한국어 부사구로 자연스럽게 풀어, 백성의 내적 상태가 고양된 뜻을 살렸습니다.
- source_word: τοὺς ὑποτεταγμένους
  english_pob_choice: those under his rule
  chosen_korean: 자기에게 복속된 자들
  alternatives_korean:
  - 자기 통치 아래 있는 자들
  - 자기에게 굴복한 자들
  - 자기 휘하의 자들
  lexicon: LSJ
  rationale: 완료 수동 분사는 이미 복속된 상태를 나타내므로, 단순한 ‘백성’보다 종속 관계를 드러내는 ‘복속된 자들’이 원문을 더 직접적으로 반영합니다.
- source_word: κατέστησεν
  english_pob_choice: he made
  chosen_korean: 만들었습니다
  alternatives_korean:
  - 되게 했습니다
  - 만들어 주었습니다
  - 이끌어 주었습니다
  lexicon: LSJ
  rationale: ‘…을 어떤 상태에 놓다/되게 하다’의 사역 의미를 가지므로, 앞 절의 결과를 한국어에서 가장 자연스럽게 받는 동사로 처리했습니다.
theological_decisions:
- issue: 왕의 후원 행위와 그 효과의 표현
  chosen_reading: 본문은 제의 공간에 대한 선물과 그 결과로 복속된 자들의 심리적 안정/용기 부여를 병렬로 제시합니다.
  alternative_readings:
  - 단순한 정치적 인기 조성으로 볼 수 있습니다.
  - 종교적 공헌이 곧바로 민심 수습 수단이라는 뉘앙스로 볼 수 있습니다.
  rationale: 그리스어는 두 분사구와 결과 동사 하나로 구성되어 있어, 제의적 후원과 통치 효과를 함께 보여 줍니다. 한국어에서도 둘을 분리하지 않고 병렬 구조를 유지했습니다.
  doctrine_reference: 3 Maccabees의 역사서술적 문맥; 통치와 제의의 결합에 대한 본문 관찰
