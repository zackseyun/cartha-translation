    issue: ‘자신감 있게 만들었습니다’는 εὐθαρσεῖς κατέστησεν의 상태 사역을 부정확하고 어색하게 표현합니다.
    rationale: 그리스어는 복속된 이들을 ‘용기 있고 자신 있는 상태’가 되게 했다는 뜻입니다. 한국어 부사구 ‘자신감 있게’는 통상 행동의 방식을 나타내므로 ‘자신감을 갖게 하였습니다’로 고쳐야 합니다.
