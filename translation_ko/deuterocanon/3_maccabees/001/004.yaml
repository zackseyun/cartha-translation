base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/004.yaml
  text: And when the battle had become fierce and affairs were turning more strongly in Antiochus’s favor[a], Arsinoe went repeatedly among the troops and earnestly urged them, with pity and tears, her hair let down, to help themselves and their children and wives courageously, promising to give two minas of gold to each man if they won.
  footnotes:
  - marker: a
    text: A mina was an ancient unit of weight and money; the text promises each soldier two minas of gold upon victory.
    reason: cultural_note
translation:
  language: ko
  text: 그런데 전투가 치열해지고 상황이 안티오코스에게 더 유리해지자, 아르시노에는 군대 사이를 다니며 동정과 눈물로 간절히 그들을 권하였습니다. 그는 머리를 풀어헤친 채 자신과 자녀들과 아내들을 용감히 돕도록 권하고, 이기면 각 사람에게 금 두 미나를 주겠다고 약속하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 미나(mina)는 고대의 무게·화폐 단위입니다. 여기서는 승리하면 병사 각 사람에게 금 두 미나를 주겠다는 약속입니다.
    reason: cultural_note
lexical_decisions:
- source_word: γενομένης δὲ καρτερᾶς μάχης
  english_pob_choice: when the battle had become fierce
  chosen_korean: 전투가 치열해지고
  alternatives_korean:
  - 격렬한 전투가 벌어지고
  - 전투가 힘겨워지고
  lexicon: LSJ
  rationale: genitive absolute의 배경 상황을 자연스럽게 살리고, καρτεράς의 강도를 한국어 ‘치열하다’로 옮겼습니다.
- source_word: τῶν πραγμάτων μᾶλλον ἐρρωμένων τῷ Ἀντιόχῳ
  english_pob_choice: affairs were turning more strongly in Antiochus’s favor
  chosen_korean: 안티오코스에게 유리하게 형세가 더욱 강해지자
  alternatives_korean:
  - 상황이 안티오코스에게 더 유리해지자
  - 사정이 안티오코스 쪽으로 더 굳어지자
  lexicon: LSJ
  rationale: πράγματα의 넓은 의미를 ‘형세’로 옮기고, ἐρρωμένων의 ‘강해짐/굳어짐’과 비교급 μᾶλλον을 함께 반영했습니다.
- source_word: ἱκανῶς ... παρεκάλει
  english_pob_choice: earnestly urged
  chosen_korean: 간절히 그들을 권하여
  alternatives_korean:
  - 강하게 권하여
  - 절박하게 호소하여
  lexicon: BDAG
  rationale: ἱκανῶς는 단순한 충분함이 아니라 호소의 강도를 높이므로, 문맥에 맞는 정서적 강세로 ‘간절히’를 택했습니다.
- source_word: τοὺς πλοκάμους λελυμένη
  english_pob_choice: her hair let down
  chosen_korean: 머리를 풀어헤친 채
  alternatives_korean:
  - 머리칼을 풀어놓은 채
  - 머리를 풀어 내린 채
  lexicon: LSJ
  rationale: 사정과 애원의 표지인 문화적 몸짓을 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: βοηθεῖν ἑαυτοῖς τε καὶ τοῖς τέκνοις καὶ ταῖς γυναιξὶν θαρραλέως
  english_pob_choice: to help themselves and their children and wives courageously
  chosen_korean: 자기들과 자기 자녀들과 아내들을 위하여 용감히 싸우라고
  alternatives_korean:
  - 자기들과 자녀들과 아내들을 도우라고
  - 자기들과 자녀들과 아내들을 위해 담대히 지키라고
  lexicon: BDAG
  rationale: βοηθεῖν은 ‘돕다/구하다’이지만 전투 문맥에서 실제 행위는 방어·전투이므로, 의미를 과도하게 좁히지 않으면서도 자연스럽게 ‘싸우다’로 옮겼습니다.
- source_word: ἑκάστῳ δύο μνᾶς χρυσίου
  english_pob_choice: two minas of gold to each man
  chosen_korean: 각 사람에게 금 두 미나를
  alternatives_korean:
  - 각자에게 금 두 미나를
  - 각 사람마다 금 두 미나를
  lexicon: LSJ
  rationale: μνᾶς는 통화·중량 단위를 그대로 음역해 보존하고, 분배 대상은 문맥상 남성 복수로 읽히더라도 한국어에서는 포괄적 ‘각 사람’으로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 전투 지형이 안티오코스에게 유리하게 기울어가는 상황의 묘사
  chosen_reading: 외형을 완화하지 않고 ‘안티오코스에게 유리하게 형세가 더욱 강해지자’로 직설적으로 옮겼습니다.
  alternative_readings:
  - 상황이 안티오코스에게 더 유리해지자
  - 안티오코스 쪽 형세가 우세해지자
  rationale: 본문은 단순한 변화가 아니라 전황의 실제 우세화를 말하므로, 서술의 긴박함과 정치적 긴장을 유지하는 쪽을 택했습니다.
  doctrine_reference: 서사 맥락 보존 원칙
