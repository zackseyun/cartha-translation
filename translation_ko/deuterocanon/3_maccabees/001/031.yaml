base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/031.yaml
  text: But some, lightly despising the supports of the city's piety, readily gave themselves over, as though they would share in some great renown from the association with the king that was to come.
  footnotes:
  - marker: a
    text: Or 'the foundations of the city's piety.' The Greek uses a metaphor for supporting structures.
    reason: lexical_alternative
  - marker: b
    text: Or 'from the future association/companionship with the king.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 어떤 이들은 도시의 경건을 떠받치는 버팀목을 가볍게 멸시하며, 장차 올 왕과의 교제에서 큰 명성을 함께 누릴 것처럼 기꺼이 자신들을 내맡겼습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘도시의 경건의 기초들’. 그리스어는 지지 구조를 가리키는 비유를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘장차 올 왕과의 교제에서’.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνιοι
  english_pob_choice: some
  chosen_korean: 어떤 이들
  alternatives_korean:
  - 몇몇 사람들
  - 일부 사람들
  lexicon: LSJ
  rationale: 불특정 다수를 가리키는 표현이므로, 문맥상 자연스러운 ‘어떤 이들’로 옮겨 대조를 살렸습니다.
- source_word: ἐπιπολαίως
  english_pob_choice: lightly
  chosen_korean: 가볍게
  alternatives_korean:
  - 경솔하게
  - 대수롭지 않게
  lexicon: LSJ
  rationale: 경시의 태도를 나타내는 부사이므로, 비난의 뉘앙스를 유지하면서도 문장 흐름에 맞는 ‘가볍게’로 옮겼습니다.
- source_word: τὰς τῆς πόλεως εὐσεβείας ἐπιβάθρας
  english_pob_choice: the supports of the city's piety
  chosen_korean: 도시의 경건을 떠받치는 버팀목
  alternatives_korean:
  - 도시의 경건의 기초들
  - 도시 경건의 지지대
  lexicon: LSJ
  rationale: ἐπιβάθραι의 비유적 ‘받침/지지 구조’라는 이미지를 살리기 위해 ‘버팀목’을 택했고, εὐσέβεια는 여기서 도시 공동체의 종교적 경건을 가리키므로 ‘경건’으로 옮겼습니다.
- source_word: εὐσεβείας
  english_pob_choice: piety
  chosen_korean: 경건
  alternatives_korean:
  - 신앙심
  - 종교적 경외
  lexicon: LSJ
  rationale: 헬라스-유대교적 문맥에서 공적·종교적 경건을 가리키므로, 지나치게 후대 기독교적 어감을 주는 표현보다 ‘경건’이 가장 안정적입니다.
- source_word: ἑαυτοὺς ἐδίδοσαν
  english_pob_choice: gave themselves over
  chosen_korean: 자신들을 내맡겼습니다
  alternatives_korean:
  - 자신들을 넘겼습니다
  - 스스로를 내어주었습니다
  lexicon: LSJ
  rationale: 재귀적 뉘앙스와 자발적 항복의 느낌을 함께 살리기 위해 ‘내맡겼습니다’를 택했습니다.
- source_word: ἐσομένης τῷ βασιλεῖ συναναστροφῆς
  english_pob_choice: the association with the king that was to come
  chosen_korean: 장차 올 왕과의 교제
  alternatives_korean:
  - 장차 있을 왕과의 사귐
  - 오는 왕과의 교유
  lexicon: LSJ
  rationale: συναναστροφή는 단순 동행보다 ‘함께 지내는 교제/교류’에 가깝기 때문에 ‘교제’가 적절하며, ἐσομένης는 미래성을 나타내므로 ‘장차 올’로 반영했습니다.
- source_word: εὐκλείας
  english_pob_choice: renown
  chosen_korean: 큰 명성
  alternatives_korean:
  - 큰 영예
  - 큰 명예
  lexicon: LSJ
  rationale: 사회적 명예/명성을 뜻하는 어휘이므로, 영광보다 중립적인 ‘명성’이 문맥에 맞고, ‘큰’으로 수식을 보존했습니다.
theological_decisions:
- issue: 도시의 공적 ‘경건’과 그것을 떠받치는 비유적 구조를 어떻게 보존할지
  chosen_reading: ‘도시의 경건을 떠받치는 버팀목’으로 직역에 가깝게 살려, 종교적 헌신이 공동체를 지탱하는 구조라는 비유를 드러냈습니다.
  alternative_readings:
  - ‘도시 경건의 기초들’
  - ‘도시의 종교를 지탱하는 기반’
  rationale: 본문은 단순한 추상 개념이 아니라 공동체적·제도적 신앙의 지지 구조를 말하므로, 비유의 물질적 이미지를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, points 1 and 6
