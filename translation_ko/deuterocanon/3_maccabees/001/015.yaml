    reason: lexical_alternative
lexical_decisions:
- source_word: κατοικητήριόν
  english_pob_choice: dwelling place
  chosen_korean: 거처
  alternatives_korean:
  - 거주처
  - 주거지
  - 머무는 곳
  lexicon: LSJ
  rationale: 하나님의 거주 공간을 가리키는 구체적 명사로서, 현대 한국어에서 자연스럽고도 경건한 뜻을 살릴 수 있는 말은 ‘거처’입니다.
- source_word: οὐρανὸς τοῦ οὐρανοῦ
  english_pob_choice: the heaven of heaven
  chosen_korean: 하늘 위의 하늘
  alternatives_korean:
  - 하늘의 하늘
  - 하늘 중의 하늘
  - 하늘의 하늘들
  lexicon: LSJ
  rationale: 히브리식 최상급 표현을 너무 평면적으로 풀지 않으면서도, 한국어에서 의미가 곧바로 전달되도록 ‘하늘 위의 하늘’로 옮겼습니다.
- source_word: ἀνέφικτος
  english_pob_choice: unreachable
  chosen_korean: 닿을 수 없는
  alternatives_korean:
  - 접근할 수 없는
  - 도달할 수 없는
  - 이르지 못하는
  lexicon: LSJ
  rationale: 인간이 그곳에 미치거나 도달할 수 없다는 뜻을 가장 간결하게 드러내는 표현입니다.
- source_word: ἀνθρώποις
  english_pob_choice: men
  chosen_korean: 사람에게
  alternatives_korean:
  - 인간에게
  - 사람들로는
  - 인간으로는
  lexicon: LSJ
  rationale: 그리스어 일반 복수는 성별 특정이 아니므로, 한국어에서는 포괄적이고도 자연스러운 ‘사람에게’로 처리했습니다.
theological_decisions:
- issue: ‘하늘 위의 하늘’의 최상급 뉘앙스
  chosen_reading: 하나님의 거처가 피조 세계의 하늘을 넘어선 초월적 영역이라는 뜻을 살리되, 과도한 설명은 넣지 않았습니다.
  alternative_readings:
  - ‘가장 높은 하늘’
  - ‘하늘의 하늘’
  rationale: 본문은 하나님의 거처의 초월성을 강조하므로, 문학적이면서도 직접적인 한국어로 그 초월성을 유지하는 것이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy §1, §6'
