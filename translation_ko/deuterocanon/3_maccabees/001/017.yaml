lexical_decisions:
- source_word: οἱ κατὰ τὴν πόλιν ἀπολειπόμενοι
  english_pob_choice: Those left behind in the city
  chosen_korean: 그 도시에 남아 있던 사람들
  alternatives_korean:
  - 도시에 남겨진 사람들
  - 도시에 남아 있던 이들
  lexicon: LSJ
  rationale: 주어진 문맥에서 ‘도시에 남아 있던’은 수동적 뉘앙스를 자연스럽게 살리면서도 현대 한국어로 읽기 쉽습니다. ‘남겨진’은 다소 강한 수동색이 있어 본문보다 해석적일 수 있습니다.
- source_word: ταραχθέντες
  english_pob_choice: were thrown into confusion
  chosen_korean: 혼란에 빠져
  alternatives_korean:
  - 당황하여
  - 소동에 휩싸여
  - 동요하여
  lexicon: LSJ
  rationale: aorist passive participle의 수동적 충격과 동요를 ‘혼란에 빠져’로 옮기면, 단순한 감정 변화보다 집단적 동요를 잘 드러냅니다.
- source_word: ἐξεπήδησαν
  english_pob_choice: rushed out
  chosen_korean: 뛰쳐나왔으며
  alternatives_korean:
  - 급히 나왔으며
  - 달려 나왔으며
  - 튀어나왔으며
  lexicon: LSJ
  rationale: 갑작스럽고 급한 외출의 동작을 한국어에서 가장 자연스럽게 살리는 표현으로 ‘뛰쳐나왔으며’를 선택했습니다.
- source_word: ἄδηλον τιθέμενοι τὸ γινόμενον
  english_pob_choice: being uncertain about what was happening
  chosen_korean: 무슨 일이 일어나는지 분명히 알지 못했습니다
  alternatives_korean:
  - 일어나는 일이 불분명하다고 여기면서
  - 무슨 일이 벌어지는지 확실하지 않게 여기면서
  - 무슨 일이 일어나는지 알 수 없었습니다
  lexicon: LSJ
  rationale: 직역하면 ‘일어나는 일을 불분명한 것으로 여기다’이지만, 한국어에서는 행위 결과를 드러내는 ‘분명히 알지 못했습니다’가 자연스럽고 원문의 불확실성을 유지합니다.
