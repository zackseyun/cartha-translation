  rationale: 이 구절은 신적 칭호 논쟁보다 압도적 예배 공간의 위엄을 강조합니다. 따라서 과도한 교회 전통어를 피하고 원문의 수사적 강도를 보존했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; readable modern Korean'
