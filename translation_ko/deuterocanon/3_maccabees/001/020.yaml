base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/020.yaml
  text: And the mothers and nurses besides these[a], leaving behind the newborn children, some in their houses and others in the streets[b], kept gathering without turning back to the all-supreme sanctuary.
  footnotes:
  - marker: a
    text: Or 'wet nurses' for 'nurses'; the Greek term can refer specifically to women nursing infants.
    reason: lexical_alternative
  - marker: b
    text: Or 'the most high temple' / 'the supremely exalted sanctuary' for 'the all-supreme sanctuary.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이들에 더하여, 어머니들과 유모들은 갓난아이들을 어떤 이들은 집에, 어떤 이들은 거리에 남겨 둔 채, 뒤돌아보지 않고 지극히 높은 성소로 계속 모여들었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘유모들’은 영아를 돌보는 여성을 가리키며, 특히 젖을 먹이는 유모를 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘지극히 높은 성소’는 원문의 πανυπέρτατον ἱερόν을 옮긴 것입니다. ‘더없이 높은 성전’ 또는 ‘지극히 높이 exalted된 성소’로도 옮길 수 있습니다.
    reason: lexical_alternative
