  chosen_reading: 과거 서술은 합쇼체로 유지하되, 인물의 급박한 움직임은 동사 배열로 살렸습니다.
  alternative_readings:
  - 더 평이한 설명체
  - 더 장엄한 문어체
  rationale: 본문은 공적·서술적 톤이므로 현대적 합쇼체가 적절합니다. 다만 장면의 비상함은 문장 구조와 동사 선택으로 드러내었습니다.
