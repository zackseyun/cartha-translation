  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ‘그 일을’은 그리스어에서 생략된 압박의 대상을 불필요하게 명시하므로 제거하는 편이 낫습니다. τέλεον은 압박의 강도와 지속성을 드러내도록 ‘줄곧 강하게’로 옮겼습니다.
  naturalness: ‘시민들을 두고 대담해진 이들’은 문법상 가능하지만 현대 표준 한국어로는 다소 어색합니다. ‘시민들과 관련하여 대담해졌던 사람들’이 원문의 관계를 단정하지 않으면서 더 자연스럽습니다. ‘더 이상 견뎌 낼 수 없었습니다’도 합쇼체 문맥에 자연스럽습니다.
