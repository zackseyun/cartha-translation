  text: Along with these[a], those who had become emboldened concerning the citizens could no longer endure it when he pressed the matter completely and intended to carry out his purpose.
  footnotes:
  - marker: a
    text: Or 'those who had grown bold on behalf of the citizens.' The Greek phrase concerning the citizens may indicate either the subject matter of their boldness or advocacy for the citizens.
    reason: lexical_alternative
translation:
  language: ko
  text: 이런 것들과 더불어, 시민들을 두고 대담해진 이들은 그가 그 일을 완전히 밀어붙이고 자기 뜻을 실행하려는 것을 더는 참아 낼 수 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시민들을 위하여 대담해진 이들’일 수 있습니다. ‘시민들을 두고’에 해당하는 그리스어 표현은 그들의 대담함의 대상이나 시민들을 위한 대변 행위를 가리킬 수 있습니다.
    reason: lexical_alternative
