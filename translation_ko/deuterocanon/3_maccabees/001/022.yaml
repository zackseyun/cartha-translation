translation:
  language: ko
  text: 이와 더불어, 시민들과 관련하여 대담해졌던 사람들[a]은 그가 줄곧 강하게 압박하며 자기 의도를 실행하려 하는 것을 더 이상 견뎌 낼 수 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시민들을 위하여 대담해졌던 사람들’일 수 있습니다. ‘시민들과 관련하여’에 해당하는 그리스어 표현은 그들의 대담함이 시민들과 관련된 문제를 대상으로 했음을 가리킬 수도 있고, 시민들을 위한 대변을 가리킬 수도 있습니다.
    reason: 그리스어 περὶ τῶν πολιτῶν의 관계가 시민들에 관한 것인지 시민들을 위한 것인지 단정되지 않으므로, 본문은 넓은 표현을 쓰고 가능한 대안을 각주로 제시합니다.
