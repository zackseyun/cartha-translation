base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/009.yaml
  text: Then[a], after being conveyed to Jerusalem, and after sacrificing to the faithful God and offering thanks, and after doing something further for the place, indeed, when he came to the place and was struck with awe by its dignity and piety[c][b],
  footnotes:
  - marker: a
    text: Or 'the trustworthy God.' The Greek adjective can denote faithfulness or trustworthiness; 'faithful' is the more direct rendering here.
    reason: lexical_alternative
  - marker: b
    text: That is, the sacred site in Jerusalem, likely the temple precinct. The Greek says simply 'the place.'
    reason: cultural_note
  - marker: c
    text: The phrase 'doing something further for the place' is indefinite in Greek and does not specify the exact action.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 예루살렘으로 옮겨졌고, 신실하신 하나님께 희생제를 드리고 감사를 돌린 뒤, 그 장소를 위해 또 무엇인가를 행했습니다. 마침 그 장소에 이르러서는 그곳의 위엄과 경건함에 압도되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: μανifest?
    reason: source_note
lexical_decisions:
- source_word: διακομισθεὶς
  english_pob_choice: after being conveyed
  chosen_korean: 예루살렘으로 옮겨졌고
  alternatives_korean:
  - 예루살렘으로 실려 갔고
  - 예루살렘으로 이송되었고
  - 예루살렘으로 도착했고
  lexicon: LSJ
  rationale: 수동 분사로서 단순 도착보다 ‘옮겨짐’의 이동성을 살리되, 한국어에서는 가장 자연스러운 합쇼체 표현으로 정리했습니다.
- source_word: τῷ πιστῷ θεῷ
  english_pob_choice: to the faithful God
  chosen_korean: 신실하신 하나님께
  alternatives_korean:
  - 신뢰할 만하신 하나님께
  - 충실하신 하나님께
  - 참되신 하나님께
  lexicon: LSJ
  rationale: πιστός의 핵심 의미를 직접 따라 ‘신실하신’으로 옮겨, 영어 POB의 ‘faithful’과 같은 어휘적 긴장을 유지했습니다.
- source_word: χάριτας ἀποδιδοὺς
  english_pob_choice: offering thanks
  chosen_korean: 감사를 돌린 뒤
  alternatives_korean:
  - 감사하며
  - 감사를 드린 뒤
  - 감사를 올린 뒤
  lexicon: LSJ
  rationale: 관용구적으로 ‘감사를 돌리다/드리다’가 가능하지만, 앞의 희생제와 병렬되는 행위 연속을 살리기 위해 간결하게 처리했습니다.
- source_word: τῶν ἑξῆς τι τῷ τόπῳ ποιήσας
  english_pob_choice: doing something further for the place
  chosen_korean: 그 장소를 위해 또 무엇인가를 행했습니다
  alternatives_korean:
  - 그곳을 위해 추가로 무엇인가를 했습니다
  - 그 장소에 무언가 더 행했습니다
  - 그곳에 대해 더 어떤 일을 했습니다
  lexicon: LSJ
  rationale: 그리스어가 구체적 행위를 밝히지 않으므로, 불확정성을 유지하기 위해 ‘무엇인가’를 보존했습니다.
- source_word: τῷ τόπῳ / τὸν τόπον
  english_pob_choice: the place
  chosen_korean: 그 장소
  alternatives_korean:
  - 그곳
  - 그 성소
  - 그 자리
  lexicon: LSJ
  rationale: τόπος를 본문처럼 일반적 ‘장소’로 유지해, 문맥상 예루살렘 성소를 가리키더라도 본문의 절제된 표현을 보존했습니다.
- source_word: τῇ σπουδαιότητι καὶ εὐσεβείᾳ
  english_pob_choice: its dignity and piety
  chosen_korean: 그곳의 위엄과 경건함
  alternatives_korean:
  - 그곳의 존엄과 경건함
  - 그곳의 장중함과 경건함
  - 그곳의 엄숙함과 경건함
  lexicon: LSJ
  rationale: σπουδαιότης와 εὐσέβεια의 조합은 단순한 물리적 웅장함보다 종교적 품격과 신앙적 분위기를 함께 가리키므로, ‘위엄과 경건함’으로 자연스럽게 살렸습니다.
- source_word: καταπληγείς
  english_pob_choice: was struck with awe
  chosen_korean: 압도되었습니다
  alternatives_korean:
  - 경외심에 사로잡혔습니다
  - 놀라움을 금치 못했습니다
  - 깊은 경외를 느꼈습니다
  lexicon: LSJ
  rationale: 종교적 맥락에서 강한 정서적 충격과 경외를 함께 드러내는 동사로 이해해, 지나치게 평면적인 ‘놀랐다’보다 ‘압도되다’를 택했습니다.
theological_decisions:
- issue: ‘신실하신 하나님’의 어휘 선택
  chosen_reading: 직역에 가까운 ‘신실하신 하나님께’로 유지했습니다.
  alternative_readings:
  - ‘참되신 하나님께’
  - ‘신뢰할 만하신 하나님께’
  rationale: πιστός를 신학적으로 풀어 쓰기보다 원문의 형용사를 직접 반영하여, 본문이 가진 표현상의 밀도를 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘그 장소’의 지시 대상
  chosen_reading: 본문의 추상적 표현을 따라 ‘그 장소’로 두었습니다.
  alternative_readings:
  - ‘성전’
  - ‘성소’
  rationale: 문맥상 예루살렘 성전 구역을 가리킬 가능성이 높지만, 그리스어가 τόπος를 사용하므로 본문 수준의 절제를 유지했습니다.
  doctrine_reference: Translation philosophy §1, §5
