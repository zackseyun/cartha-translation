  text: διακομισθεὶς δὲ εἰς Ἰεροσόλυμα, καὶ θύσας τῷ πιστῷ θεῷ καὶ χάριτας ἀποδιδοὺς καὶ τῶν ἑξῆς τι τῷ τόπῳ ποιήσας, καὶ δὴ παραγενόμενος εἰς τὸν τόπον καὶ τῇ σπουδαιότητι καὶ εὐσεβείᾳ καταπληγείς,
