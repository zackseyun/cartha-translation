lexical_decisions:
- source_word: πάσης σκέπης ἔρημοι
  english_pob_choice: deprived of every protection
  chosen_korean: 모든 보호가 없는 것처럼
  alternatives_korean:
  - 모든 보호를 빼앗긴 것처럼
  - 어떤 보호도 없는 듯이
  - 온갖 보호에서 버림받은 듯이
  lexicon: LSJ
  rationale: σκέπη의 핵심은 물리적 ‘덮개’보다 비유적 ‘보호’이므로, 문맥에 맞게 한국어도 보호로 옮기되 ἔρημοι의 결핍감을 ‘없는 것처럼’으로 자연스럽게 살렸습니다.
- source_word: δοκοῦντες εἶναι
  english_pob_choice: seeming to be
  chosen_korean: …처럼 보였습니다
  alternatives_korean:
  - …인 듯 보였습니다
  - …로 여겨졌습니다
  - …처럼 생각되었습니다
  lexicon: LSJ
  rationale: 이 분사는 실제 상태의 단정이 아니라 외부 시각상의 인상을 나타내므로, ‘보였습니다’로 처리해 관찰자의 인식이라는 뉘앙스를 유지했습니다.
- source_word: τοῖς ἔθνεσιν
  english_pob_choice: to the nations
  chosen_korean: 그 민족들에게
  alternatives_korean:
  - 그 나라들에게
  - 이방인들에게
  - 민족들 앞에
  lexicon: LSJ
  rationale: 여기서 ἔθνη는 후기 신학적 대조어인 ‘이방인’보다 주변의 여러 민족들을 가리키는 일반적 의미가 강하므로, 문맥에 맞게 ‘민족들’로 옮겼습니다.
- source_word: πάντοθεν περιέχουσαν αὐτοὺς μετὰ δεσμῶν ἀνάγκην
  english_pob_choice: the necessity that surrounded them on every side with chains
  chosen_korean: 사방에서 그들을 에워싸고 있는 쇠사슬 같은 강제
  alternatives_korean:
  - 사방에서 그들을 옥죄는 사슬의 강제
  - 사방으로 그들을 둘러싼 쇠사슬의 압박
  - 사방에서 그들을 얽어매는 쇠사슬의 구속
  lexicon: LSJ
  rationale: ἀνάγκη의 ‘강제/구속력’과 περιέχω의 ‘둘러싸다’를 함께 살리기 위해, ‘에워싸고 있는’과 ‘강제’를 결합했고, δεσμοί는 물리적 구속 이미지를 분명히 하는 ‘쇠사슬’로 옮겼습니다.
