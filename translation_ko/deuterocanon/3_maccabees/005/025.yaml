base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/025.yaml
  text: But the Jews[a], as the indivisible time drew them together in soul, stretched out their hands to heaven and, with mournful songs, offered a tearful plea, begging the greatest God to help them again without delay.
  footnotes:
  - marker: a
    text: Or 'being united in soul during that unbroken time.' The Greek expression is unusual and compact, combining the ideas of continuous time and inward communal unity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 유대인들은 끊임없이 이어지는 그 시간 동안 한마음이 되어[a], 하늘을 향해 손을 펴 들고 애절한 노래로 눈물 어린 간구를 드리며, 가장 크신 하나님께서 다시 속히 도와주시기를 간청했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나뉘지 않은 그 시간 동안 영혼으로 하나 되어’로 옮길 수 있습니다. 그리스어 표현은 드물고 압축적이며, 끊임없이 이어지는 시간과 내적인 공동체적 일치를 함께 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμερῆ ... χρόνον
  english_pob_choice: the indivisible time
  chosen_korean: 그 분리될 수 없는 시간 동안
  alternatives_korean:
  - 그 나뉘지 않는 시간 동안
  - 그 끊어지지 않는 시간 동안
  lexicon: LSJ
  rationale: ἀμερῆ는 ‘나뉘지 않는, 분할되지 않은’이라는 뜻이므로 시간 표현을 자연스럽게 풀어 ‘그 분리될 수 없는 시간 동안’으로 옮겼습니다. 영어 POB의 낯선 표현성을 과도하게 평탄화하지 않되, 한국어 문장으로는 읽히게 했습니다.
- source_word: ψυχοκοινούμενοι
  english_pob_choice: drew them together in soul
  chosen_korean: 한마음으로 모여
  alternatives_korean:
  - 영으로 하나 되어
  - 혼이 서로 나뉘지 않게 되어
  lexicon: LSJ
  rationale: 이 희귀 합성어는 영혼/생명의 차원에서 공동체적 일치를 가리키므로, 직역보다 의미를 드러내는 ‘한마음으로 모여’로 옮겼습니다. 다만 ‘모여’에 공동체적 수렴의 동작을 남겼습니다.
- source_word: πολυδάκρυν ἱκετίαν
  english_pob_choice: a tearful plea
  chosen_korean: 눈물 어린 간구
  alternatives_korean:
  - 눈물 많은 간청
  - 많은 눈물의 청원
  lexicon: LSJ
  rationale: 눈물이 많은 간구라는 뜻을 살리면서 현대 한국어에서 자연스러운 종교적 어휘인 ‘간구’를 사용했습니다. 영어 POB의 정서적 강도도 유지됩니다.
- source_word: ἐν μέλεσιν γοεροῖς
  english_pob_choice: with mournful songs
  chosen_korean: 슬픈 노래를 부르며
  alternatives_korean:
  - 애통한 노래와 함께
  - 통곡의 곡조로
  lexicon: LSJ
  rationale: μέλεσιν은 노래나 곡조를, γοεροῖς는 애절하고 슬픈 성격을 나타내므로 ‘슬픈 노래를 부르며’로 옮겼습니다. 예배적·탄식적 분위기를 유지했습니다.
- source_word: τοῦ μεγίστου θεοῦ
  english_pob_choice: the greatest God
  chosen_korean: 가장 크신 하나님
  alternatives_korean:
  - 지극히 크신 하나님
  - 가장 위대하신 하나님
  lexicon: LSJ
  rationale: Greek의 직역인 superlative를 살려 ‘가장 크신 하나님’으로 옮겼습니다. 전통적 호칭인 ‘지극히 높으신’은 본문에 없는 표현이므로 피했습니다.
- source_word: συντόμως
  english_pob_choice: without delay
  chosen_korean: 속히
  alternatives_korean:
  - 지체 없이
  - 신속히
  lexicon: LSJ
  rationale: 이 부사는 신속성과 긴급성을 나타내므로 한국어에서는 간결하게 ‘속히’로 처리했습니다. 요청의 절박함을 유지하면서 문장을 매끄럽게 했습니다.
theological_decisions:
- issue: 기도 동작과 정서의 결합 표현
  chosen_reading: 손을 펴 드는 기도, 노래, 눈물 어린 간구를 함께 묶어 공동체적 탄원으로 제시했습니다.
  alternative_readings:
  - 단순히 ‘기도했다’로 평탄화하는 번역
  - ‘탄식하며’만 남기는 축약
  rationale: 본문은 신체 제스처, 노래, 눈물, 간구를 함께 제시하므로, 이를 분리하지 않고 병렬적으로 살려 집단적 절박함을 드러냈습니다. 이는 본문의 수사적 압력을 보존합니다.
  doctrine_reference: 번역 철학 §1, §6
- issue: 신적 칭호 τοῦ μεγίστου θεοῦ
  chosen_reading: ‘가장 크신 하나님’으로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘지극히 높으신 하나님’
  - ‘최고의 하나님’
  rationale: 이 구절은 특수 교리 용어가 아니라 서술적 최상급이므로, 전통적 칭호로 바꾸지 않고 그리스어의 직접성을 보존했습니다.
  doctrine_reference: 번역 철학 §1
