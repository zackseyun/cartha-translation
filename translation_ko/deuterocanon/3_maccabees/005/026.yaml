base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/026.yaml
  text: But the sun’s rays had not yet spread out[a], and while the king was receiving his friends, Hermon came forward and summoned them to the departure[b], pointing out that the king’s eagerness was in readiness.
  footnotes:
  - marker: a
    text: Or 'his courtiers' for 'his friends'; in Hellenistic court language, 'friends' can function as an official designation for royal companions.
    reason: lexical_alternative
  - marker: b
    text: The Greek expression 'called for the departure' likely means that Hermon summoned those present to set out.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 해의 광선이 아직 퍼지고 있지 않았으며, 왕이 벗들을[a] 맞이하고 있는 동안에 헤르몬이 앞으로 나아와 그들에게 출발하라고 불렀으며[b], 왕의 뜻이 이미 준비되어 있음을 보여 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 신하들’로도 볼 수 있습니다. 헬레니즘 왕실 언어에서 ‘벗들’은 왕의 공식 동반자들을 가리키는 호칭으로 쓰일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 표현은 문자적으로 ‘출발로 부르다’에 가깝지만, 문맥상 앞서 언급된 이들에게 떠나거나 출발하라고 부르는 뜻으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡλίου βολαὶ κατεσπείροντο
  english_pob_choice: the sun’s rays had not yet spread out
  chosen_korean: 해의 광선이 아직 퍼지지 않았고
  alternatives_korean:
  - 해의 빛이 아직 퍼지지 않았고
  - 태양의 광선이 아직 퍼지지 않았고
  lexicon: LSJ
  rationale: βολαί는 문자적으로는 ‘던짐/발사’이지만 ἡλίου와 결합할 때 ‘광선’ 또는 ‘빛줄기’의 관용적 의미가 자연스럽습니다. ‘퍼지지 않았고’는 분사형의 진행·확산 이미지를 한국어로 무리 없이 살립니다.
- source_word: τοῦ βασιλέως τοὺς φίλους
  english_pob_choice: while the king was receiving his friends
  chosen_korean: 왕이 자기의 벗들을 맞이하고 있는 동안에
  alternatives_korean:
  - 왕이 자기의 친구들을 맞이하고 있는 동안에
  - 왕이 자기의 신하들을 맞이하고 있는 동안에
  lexicon: LSJ
  rationale: φίλοι는 문자적으로 ‘벗들’이지만, 헬레니즘 왕실 문맥에서 왕의 공식 동반자들을 가리킬 수 있습니다. 본문은 직역의 투명성을 위해 기본 의미를 살리되, 한국어에서 과도하게 현대적이거나 제도화된 어감을 피했습니다.
- source_word: ἐπικαλεῖ πρὸς τὴν ἔξοδον
  english_pob_choice: summoned them to the departure
  chosen_korean: 출발하도록 그들을 불렀으며
  alternatives_korean:
  - 떠나도록 그들을 불렀으며
  - 출정하도록 그들을 불렀으며
  lexicon: LSJ
  rationale: ἔξοδος는 단순한 ‘나감/출발’의 뜻이 가장 직접적입니다. 문맥상 집합된 이들을 떠나게 하는 호출이므로, ‘출발하도록’이 의미를 가장 덜 왜곡합니다.
- source_word: ἐν ἑτοίμῳ κεῖσθαι
  english_pob_choice: was in readiness
  chosen_korean: 이미 마련되어 있다고
  alternatives_korean:
  - 준비되어 있다고
  - 대기 중이라고
  lexicon: LSJ
  rationale: κεῖσθαι ἐν ἑτοίμῳ는 ‘준비 상태에 놓여 있다’는 관용입니다. 한국어에서는 ‘이미 마련되어 있다’가 상태의 완결성과 준비됨을 가장 자연스럽게 전달합니다.
theological_decisions:
- issue: 왕실 문맥의 φίλοι와 출발 호출의 의미
  chosen_reading: 본문을 왕의 개인적 친구가 아니라 헬레니즘 왕실의 동반자들을 포함할 수 있는 표현으로 유지하되, 한국어 본문에서는 중립적 기본 의미인 ‘벗들’로 옮겼습니다.
  alternative_readings:
  - ‘신하들’로 제도적 의미를 강화하는 읽기
  - ‘동반자들’로 왕실 용어성을 강조하는 읽기
  rationale: 본문의 사회적 배경은 왕실 언어이지만, 그 뉘앙스는 해설에서 드러내고 본문은 원문 어휘를 보존하는 편이 문장과 증거 둘 다에 충실합니다.
  doctrine_reference: '번역 원칙: 어휘의 역사적·사회적 함의를 보존하되 본문 의미를 과잉 해석하지 않음'
