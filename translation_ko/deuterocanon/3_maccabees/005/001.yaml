  text: 그러자 그는 코끼리들을 맡아보던 헤르몬을 불러오게 하였는데, 몹시 심한 분노와 한으로 가득 차 있었고, 그 분노는 전혀 누그러질 수 없는 것이었습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문 줄은 여기서 ‘ἀμετά-’에서 끊어집니다. 번역은 보이는 본문과 즉각적인 문맥이 가장 잘 지시하는 뜻, 곧 그의 분노가 꺾이지 않거나 바뀌지 않는다는 의미를 반영합니다.
    reason: textual_variant
  - marker: b
    text: 마지막 형용사는 문맥상 더 관용적으로는 ‘유화될 수 없는’ 또는 ‘완고한’으로도 옮길 수 있습니다.
    reason: lexical_alternative
