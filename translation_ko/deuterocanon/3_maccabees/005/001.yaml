translation:
  language: ko
  text: 그러자 그는 코끼리들을 관리하던 헤르몬을 불러들였습니다. 그는 심한 분노와 격노로 가득 차 있었고, 마음을 전혀 바꾸지 않은 채 있었습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 여기서 ‘ἀμετά-’에서 줄바꿈과 함께 끊어집니다. 따라서 이 번역은 보이는 어두와 직전 문맥에 따라, 그가 마음이나 태도를 바꾸지 않았다는 가장 개연성 있는 뜻을 반영합니다.
    reason: textual_variant
  - marker: b
    text: 마지막의 절단된 말은 문맥상 ‘변하지 않는’, ‘완고한’, 또는 ‘유화될 수 없는’으로도 이해될 수 있습니다. 정확한 완성형과 수식 범위는 이 페이지에 보이는 본문만으로 확정할 수 없습니다.
    reason: lexical_alternative
