  rationale: 두 표현이 모두 외적으로 드러난 상태를 가리키므로, 의미를 분리해 한국어의 자연스러운 병렬로 옮겼습니다. ‘얼굴’은 POB의 countenance에 대응하되 지나친 의역은 피합니다.
- source_word: συνεστάλη
  english_pob_choice: he was shaken
  chosen_korean: 흔들렸습니다
  alternatives_korean:
  - 위축되었습니다
  - 당황했습니다
  - 몸을 움츠렸습니다
  lexicon: LSJ
  rationale: 이 동사는 물리적 수축과 심리적 위축을 함께 시사하므로, 문맥상 드러난 동요를 포괄하는 ‘흔들리다’로 처리해 외양과 표정의 변화까지 함께 반영했습니다.
