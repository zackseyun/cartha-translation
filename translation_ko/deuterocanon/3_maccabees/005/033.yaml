  yaml_path: translation/deuterocanon/3_maccabees/005/033.yaml
  text: Thus Hermon endured an unexpected and dangerous threat[a], and he was shaken in appearance and countenance.
  footnotes:
  - marker: a
    text: Or 'he was distressed in look and face' or 'he shrank back in appearance and expression.' The Greek verb can convey visible contraction, intimidation, or emotional disturbance.
    reason: lexical_alternative
translation:
  language: ko
  text: 이렇게 해서 헤르몬은 예기치 못하고 위험한 위협을 겪었고, 모습과 얼굴빛에 위축된 기색을 보였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘위축된 기색을 보였습니다’는 원문의 συνεστάλη가 지닐 수 있는 ‘움츠러들다’, ‘위축되다’, ‘동요하다’의 뉘앙스를 반영합니다. 이 동요는 그의 모습과 얼굴에 드러났습니다.
    reason: lexical_alternative
lexical_decisions:
