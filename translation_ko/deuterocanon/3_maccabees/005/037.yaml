  text: Then, summoning Hermon with a threat, he said, “How many times must I command you about these very matters, you most wretched man?”
translation:
  language: ko
  text: 그는 위협을 가하며 헤르몬을 불러다가 말했습니다. “도대체 내가 이 일들에 관해 몇 번이나 너에게 명령해야 하겠느냐, 이 비참한 자야?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “불러 자기 앞에 오게 한” 뜻입니다.
