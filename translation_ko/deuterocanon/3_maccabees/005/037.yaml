lexical_decisions:
- source_word: τὸν δὲ Ἕρμωνα
  english_pob_choice: Hermon
  chosen_korean: 헤르몬
  alternatives_korean:
  - 허몬
  - 에르몬
  lexicon: 고유명사 표기 관행
  rationale: 인명은 음역하는 것이 원문 대응을 가장 잘 살리므로 표준 음역인 ‘헤르몬’을 택했습니다.
- source_word: προσκαλεσάμενος
  english_pob_choice: summoning
  chosen_korean: 불러다가
  alternatives_korean:
  - 소환하며
  - 불러오게 하여
  lexicon: LSJ
  rationale: 중간태 분사의 행위성을 살리면서도 한국어 문맥에서는 ‘불러다가’가 자연스럽고, 그를 자기 앞에 오게 하게 했다는 점을 드러냅니다.
- source_word: μετὰ ἀπειλῆς
  english_pob_choice: with a threat
  chosen_korean: 위협을 가하며
  alternatives_korean:
  - 위협하면서
  - 협박과 함께
  lexicon: LSJ
  rationale: ‘with a threat’의 구체성을 살리되, 한국어에서는 부사적으로 자연스러운 ‘위협을 가하며’가 직접적이고 명확합니다.
- source_word: Ποσάκις δεῖ σοι ... προστάττειν
  english_pob_choice: How many times must I command you
  chosen_korean: 도대체 내가 ... 몇 번이나 너에게 명령해야 하겠느냐
  alternatives_korean:
  - 얼마나 자주 내가 너에게 명령해야 하겠느냐
  - 내가 몇 번이나 너를 명령해야 하겠느냐
  lexicon: LSJ
  rationale: ‘Ποσάκις’의 빈도 질문과 ‘δεῖ’의 필요성을 합쳐, 책망조의 자연스러운 한국어인 ‘몇 번이나 ... 명령해야 하겠느냐’로 옮겼습니다.
- source_word: ἀθλιώτατε
  english_pob_choice: you most wretched man
  chosen_korean: 이 비참한 자야
  alternatives_korean:
  - 가장 비참한 자야
  - 가엾기 짝이 없는 자야
  lexicon: LSJ
  rationale: 최상급 호격의 모욕적 책망을 살리되, 현대 한국어에서 지나치게 문어적인 ‘최불행한’보다 직접적인 ‘비참한 자’가 어조를 잘 드러냅니다.
theological_decisions:
- issue: 직접화법의 호칭 강도
  chosen_reading: ‘이 비참한 자야’로 옮겨 모욕적 책망의 강도를 유지했습니다.
  alternative_readings:
  - ‘이 불쌍한 자야’
  - ‘이 비참한 놈아’
  rationale: 원문 ἀθλιώτατε는 단순한 동정이 아니라 강한 질책이므로, 완곡화하지 않고 책망의 어조를 보존했습니다.
  doctrine_reference: 문체/화행 일치 원칙
