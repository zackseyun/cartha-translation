  text: ἀνεβόησαν φωνῇ μεγάλῃ σφόδρα, τὸν τῆς ἁπάσης δυνάστην ἱκετεύοντες, οἰκτείραι μετὰ ἐπιφανείας αὐτοὺς ἤδη πρὸς πύλας ᾅδου καθεστῶτας. VI
