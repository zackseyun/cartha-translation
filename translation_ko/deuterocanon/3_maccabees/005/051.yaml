base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/051.yaml
  text: They cried out very loudly[a], imploring the Sovereign of all to have mercy and visibly come to their aid, since they already stood at the gates of Hades.
  footnotes:
  - marker: a
    text: Or, 'show pity to them with a visible manifestation.' The Greek phrase 'with manifestation/appearing' may emphasize that the mercy sought was openly displayed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 매우 큰 소리로 부르짖으며, 만물의 주권자께 현현과 함께 그들에게 자비를 베푸시기를 간청하였습니다. 그들은 이미 하데스의 문들 곁에 서 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나타나심과 함께’라고 옮길 수 있습니다. 그리스어 표현은 자비가 현현, 곧 드러나는 나타남과 결부되어 베풀어지기를 구한다는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεβόησαν
  english_pob_choice: they cried out
  chosen_korean: 외치며
  alternatives_korean:
  - 소리치며
  - 부르짖으며
  lexicon: LSJ
  rationale: 집단적이고 긴박한 큰 외침을 자연스러운 현대 한국어로 옮기기 위해 ‘외치며’를 택했습니다.
- source_word: φωνῇ μεγάλῃ σφόδρα
  english_pob_choice: very loudly
  chosen_korean: 매우 큰 소리로
  alternatives_korean:
  - 엄청나게 큰 소리로
  - 지극히 크게
  lexicon: LSJ
  rationale: ‘매우’와 ‘큰 소리로’로 μεγάλῃ와 σφόδρα의 강도를 함께 살리되, 합쇼체 서술에 어울리는 자연스러운 표현으로 정리했습니다.
- source_word: τὸν τῆς ἁπάσης δυνάστην
  english_pob_choice: the Sovereign of all
  chosen_korean: 만물의 주권자
  alternatives_korean:
  - 모든 것의 통치자
  - 만유의 지배자
  lexicon: LSJ
  rationale: δυνάστης의 지배·통치 의미를 살리면서 ἁπάσης의 포괄성을 ‘만물의’로 담아, 숭고하지만 과도하게 교회화되지 않은 표현을 택했습니다.
- source_word: οἰκτείραι μετὰ ἐπιφανείας
  english_pob_choice: to have mercy and visibly come to their aid
  chosen_korean: 자비를 베푸시고 표나게 그들을 도우시기를
  alternatives_korean:
  - 긍휼을 베푸시고 나타나셔서 그들을 도우시기를
  - 불쌍히 여기시고 드러나게 그들을 도우시기를
  lexicon: LSJ
  rationale: οἰκτείραι는 단순 감정이 아니라 구원의 자비를 구하는 말이므로 ‘자비를 베푸시고’로, μετὰ ἐπιφανείας는 하나님의 분명한 현현을 가리키는 뉘앙스를 살려 ‘표나게’로 옮겼습니다.
- source_word: πρὸς πύλας ᾅδου
  english_pob_choice: at the gates of Hades
  chosen_korean: 하데스의 문들 곁에
  alternatives_korean:
  - 하데스의 문들 앞에
  - 죽음의 문턱에
  lexicon: LSJ
  rationale: ᾅδης를 해석어로 풀지 않고 음역 ‘하데스’로 유지해 원문 이미지를 보존했으며, πρὸς의 근접성을 ‘곁에’로 자연스럽게 나타냈습니다.
theological_decisions:
- issue: ἐπιφανείας의 의미 범위
  chosen_reading: 단순한 내적 자비가 아니라, 구원 행위가 눈에 드러나게 나타나는 하나님의 개입으로 이해했습니다.
  alternative_readings:
  - ‘나타남’ 자체를 직역하는 해석
  - ‘보여 주시는 자비’라는 완화된 읽기
  rationale: 영어 POB의 재판정이 지적하듯 이 표현은 ἐπιφάνεια의 현현/드러남 의미를 보존해야 하므로, 한국어에서도 ‘표나게’로 그 공개적·가시적 성격을 살렸습니다.
  doctrine_reference: LXX 현현어법(ἐπιφάνεια) 관련 번역 원칙
