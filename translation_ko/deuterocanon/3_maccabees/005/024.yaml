  text: And the crowds throughout the city were gathering for the most pitiful spectacle[a], eagerly awaiting the morning.
  footnotes:
  - marker: a
    text: Or 'to witness the most pitiable sight.' The Greek θεωρία can refer either to the act of viewing or to the spectacle viewed.
    reason: lexical_alternative
translation:
  language: ko
  text: 도시 전역의 군중은 가장 비참한 광경을 보기 위해 모여 있었고, 아침이 오기를 간절히 기다리고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가장 비참한 광경을 위해’. 그리스어 θεωρία는 보는 행위 자체를 가리킬 수도 있고, 보게 되는 광경을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ... πλήθη
  english_pob_choice: the crowds
  chosen_korean: 무리들
  alternatives_korean:
  - 군중
  - 사람들
  lexicon: LSJ
  rationale: πλήθη는 도시 안에 모여드는 다수의 사람들을 가리키므로, 한국어에서는 자연스럽고 집합성을 살리는 ‘무리들’이 적절합니다.
- source_word: κατὰ τὴν πόλιν
  english_pob_choice: throughout the city
  chosen_korean: 도시 곳곳에
  alternatives_korean:
  - 도시 전역에
  - 도시 전체에
  lexicon: LSJ
  rationale: 문맥상 도시 안의 여러 곳에서 군중이 모여드는 분포를 나타내므로 ‘도시 곳곳에’가 가장 자연스럽습니다.
- source_word: πρὸς τὴν οἰκτρότατην θεωρίαν
  english_pob_choice: for the most pitiful spectacle
  chosen_korean: 가장 가엾은 광경을 보려고
  alternatives_korean:
  - 가장 비참한 광경을 보려고
  - 가장 가엾은 구경거리를 보려고
  lexicon: LSJ
  rationale: θεωρία는 ‘보는 행위’와 ‘보여지는 광경’ 둘 다 가능하므로, 본문 흐름에 맞게 관람 목적을 드러내는 ‘보려고’와 ‘광경’을 함께 살렸습니다.
- source_word: μετὰ σπουδῆς
  english_pob_choice: eagerly
  chosen_korean: 애타게
  alternatives_korean:
  - 열심히
  - 간절히
  lexicon: LSJ
  rationale: σπουδή는 단순한 속도보다 강한 열심과 긴박함을 담으므로, 비극적 장면을 기다리는 태도를 드러내는 ‘애타게’가 적절합니다.
