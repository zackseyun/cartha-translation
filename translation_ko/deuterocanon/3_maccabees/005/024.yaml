revisions:
- from: 그리고 도시 곳곳의 무리들은 가장 가엾은 광경을 보려고 모여들고 있었으며, 아침을 애타게 기다리고 있었습니다.[a]
  to: 도시 전역의 군중은 가장 비참한 광경을 보기 위해 모여 있었고, 아침이 오기를 간절히 기다리고 있었습니다.[a]
  rationale: The revision corrects the aspectual force of συνῄθροιστο, uses idiomatic collective Korean for the citywide crowds, and renders μετὰ σπουδῆς as earnest expectation. The footnote continues to mark the lexical ambiguity of θεωρία, as in the English audit trail.
  reviewer_model: gpt-5.6-terra
