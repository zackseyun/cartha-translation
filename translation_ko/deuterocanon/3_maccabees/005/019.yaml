translation:
  language: ko
  text: 그런데 밤사이에 명령이 끝까지 수행되었다고 보고한 사람과, 그들의 친구들이 그 사실을 증언하자
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποδείξαντος
  english_pob_choice: had pointed out
  chosen_korean: 보고한
  alternatives_korean:
  - 지적한
  - 알려준
  - 가리킨
  lexicon: LSJ
  rationale: 이 분사는 단순히 가리키는 것보다 어떤 사실을 드러내어 알리는 의미가 강하므로, 문맥상 자연스러운 ‘보고한’으로 옮겼습니다.
- source_word: νυκτός
  english_pob_choice: during the night
  chosen_korean: 밤사이에
  alternatives_korean:
  - 밤에
  - 한밤중에
  lexicon: LSJ
  rationale: 시간의 부사적 용법을 자연스럽게 살리되, 사건이 밤 동안 진행되었음을 분명히 드러내는 표현으로 옮겼습니다.
- source_word: τὸ προσταγὲν ... ἐπὶ τέλος ἠγοχέναι
  english_pob_choice: the order had been carried through to completion
  chosen_korean: 명령이 끝까지 수행되었다
  alternatives_korean:
  - 명령이 완전히 이행되었다
  - 명령이 끝까지 집행되었다
  lexicon: LSJ
  rationale: ἐπὶ τέλος의 ‘완료/성취’와 δύσκολη한 완료 의미를 함께 반영하여, 결과가 실제로 끝까지 이루어졌다는 점을 살렸습니다.
- source_word: προσμαρτυρησάντων
  english_pob_choice: had borne witness to it
  chosen_korean: 그 사실을 증언하자
  alternatives_korean:
  - 그것을 증언하자
  - 그 사실을 입증하자
  lexicon: LSJ
  rationale: προσμαρτυρέω의 ‘덧붙여 증언하다’는 뜻을 살려, 단순 확인보다 증언 행위가 전면에 드러나도록 했습니다.
