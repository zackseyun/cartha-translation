base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/032.yaml
  text: Yet[a], if it were not for your affection because of the gathering together and the necessity[b], you would have been deprived of life instead of these things.
  footnotes:
  - marker: a
    text: Or 'your affection for the gathering' or 'your fondness for the crowd.' The Greek συστροφή can denote a gathering or massed crowd; the exact nuance here is context-dependent.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'and for need' may also be understood as 'and because of necessity.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 무리의 몰림과 필요 때문에 너에 대한 애정이 없었다면, 너는 이 일들 대신 생명을 빼앗겼을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무리의 몰림’은 συστροφή의 가능한 의미를 따른 것으로, 문맥상 ‘모여 있는 군중’ 또는 ‘집결’로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘필요’는 ‘필요성’ 또는 ‘necessity’의 뜻으로도 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καίπερ εἰ μή
  english_pob_choice: Yet, if it were not for
  chosen_korean: 그러나 … 없었다면
  alternatives_korean:
  - 그렇지 않았다면
  - 만약 … 없었다면
  lexicon: LSJ / 문맥적 결합
  rationale: καίπερ와 εἰ μή가 함께 만들어 내는 양보-조건 구조를 한국어에서는 자연스럽게 ‘… 없었다면’으로 풀어 주는 것이 가장 분명합니다.
- source_word: τῆς συστροφῆς
  english_pob_choice: the gathering together
  chosen_korean: 무리의 몰림
  alternatives_korean:
  - 모임의 모임
  - 모여 있음
  - 집결
  lexicon: LSJ
  rationale: συστροφή는 단순한 공식적 ‘회중’보다 ‘몰려 듦, 한데 모임’의 물리적 뉘앙스가 있어, 문맥의 긴박함을 살려 ‘몰림’으로 옮겼습니다.
- source_word: στοργὴν
  english_pob_choice: your affection
  chosen_korean: 너에 대한 애정
  alternatives_korean:
  - 너의 애착
  - 너에 대한 정
  - 너의 다정함
  lexicon: LSJ
  rationale: στοργή는 가족적·자연적 애정을 뜻하므로, 과장하지 않으면서도 감정적 결속을 드러내는 ‘애정’이 적절합니다.
- source_word: τῆς χρείας
  english_pob_choice: the necessity / need
  chosen_korean: 필요
  alternatives_korean:
  - 필연성
  - 필요성
  - 궁핍
  lexicon: LSJ
  rationale: χρεία는 ‘필요, 필요함, 필요 사항’의 폭이 있어, 간결하고 중립적인 ‘필요’가 문맥상 가장 잘 맞습니다.
- source_word: τὸ ζῆν ἀντὶ τούτων ἐστερήθης
  english_pob_choice: you would have been deprived of life instead of these things
  chosen_korean: 너는 이 일들 대신 생명을 빼앗겼을 것입니다
  alternatives_korean:
  - 너는 이 일들 대신 생명을 빼앗겼을 터입니다
  - 너는 이 일들 대신 목숨을 잃었을 것입니다
  lexicon: BDAG
  rationale: στερέω의 수동은 ‘빼앗기다/박탈당하다’가 핵심이므로, 생명을 직접 목적어로 두어 그 위협을 분명히 드러냈습니다.
theological_decisions:
- issue: καίπερ εἰ μή의 양보적 조건 처리
  chosen_reading: 직설적인 경고의 형식으로 ‘… 없었다면’이라고 옮겼습니다.
  alternative_readings:
  - ‘비록 … 일지라도’
  - ‘만일 … 아니라면’
  rationale: 이 구문은 단순 가정이 아니라 반사실적 양보를 띠므로, 한국어에서도 조건절로 압축해 원문의 긴장감을 유지했습니다.
  doctrine_reference: 문맥적 해석(비신학적)
