  to: 그러므로 모든 면에서 팔라리스와 같은 그 왕은 비합리성으로 가득 차서, 유대인들을 살피는 일과 관련하여 자기 마음속에서 일어나는 변화들을 아무것도 아닌 것으로 여기고, 이들을 지체 없이 하데스로 보내되 짐승들에게 무릎과 발을 잔혹하게 훼손당한 채로 보내겠다는 결코 이루어질 수 없는 맹세를 굳게 정했습니다.[a][c][b]
