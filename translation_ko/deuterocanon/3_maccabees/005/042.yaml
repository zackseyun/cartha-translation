base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/042.yaml
  text: Therefore the king[a], a Phalaris in every way, filled with irrationality and counting as nothing the changes of soul occurring within him for oversight of the Jews, firmly setting an utterly unfulfillable oath, that he would without delay send these men to Hades, cruelly mangled in the knees and feet by beasts[c][b],
  footnotes:
  - marker: a
    text: Phalaris was a proverbial tyrant noted for extreme cruelty; the text compares the king to him rather than merely calling him cruel.
    reason: cultural_note
  - marker: b
    text: Or 'the realm of the dead' for 'Hades.'
    reason: lexical_alternative
  - marker: c
    text: The Greek says literally 'changes of soul,' an idiom for inner changes or shifts of heart.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 모든 면에서 팔라리스와 같은 그 왕은 비합리성으로 가득 차서, 유대인들을 살피는 일과 관련하여 자기 마음속에서 일어나는 변화들을 아무것도 아닌 것으로 여기고, 이들을 지체 없이 하데스로 보내되 짐승들에게 무릎과 발을 잔혹하게 훼손당한 채로 보내겠다는 결코 이루어질 수 없는 맹세를 굳게 정했습니다.[a][c][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 팔라리스는 극심한 잔혹성으로 알려진 폭군의 전형적 이름입니다. 이 구절은 왕을 단지 ‘잔인하다’고 하는 것이 아니라 그와 같다고 비유합니다.
    reason: cultural_note
  - marker: b
    text: ‘하데스’는 여기서 ‘죽은 자들의 나라’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 그리스어는 문자적으로 ‘영혼의 변화들’이라고 하며, 내면의 변동이나 마음의 변화를 뜻하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅθεν
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그러해서
  - 그리하여
  lexicon: LSJ
  rationale: 앞 문맥에서 이어지는 결론 표지이므로, 현대 한국어에서 가장 자연스럽게 인과를 드러내는 ‘그러므로’를 택했습니다.
- source_word: ὁ κατὰ πάντα Φάλαρις βασιλεὺς
  english_pob_choice: the king, a Phalaris in every way
  chosen_korean: 모든 면에서 파할리스와 같은 자로서
  alternatives_korean:
  - 모든 면에서 파할리스인 왕으로서
  - 온전히 파할리스 같은 왕으로서
  lexicon: LSJ
  rationale: 본문은 단순한 ‘잔혹한 왕’이 아니라 악명 높은 폭군 파할리스와의 비교를 담고 있으므로, 고유명사를 살리면서 비교 의미가 드러나게 옮겼습니다.
- source_word: ἐνπληθυνθεὶς ἀλογιστίας
  english_pob_choice: filled with irrationality
  chosen_korean: 비합리성으로 가득 차 있었고
  alternatives_korean:
  - 무분별함으로 가득 차 있었고
  - 어리석음으로 가득 차 있었고
  lexicon: LSJ
  rationale: ἀλογιστία의 핵심은 이성의 부재와 무분별함이므로, 문맥에 맞게 ‘비합리성’으로 옮겨 왕의 정신적·도덕적 타락을 살렸습니다.
- source_word: τὰς γινομένας ... μεταβολὰς τῆς ψυχῆς
  english_pob_choice: the changes of soul
  chosen_korean: 자기 안에서 일어나는 마음의 변화
  alternatives_korean:
  - 영혼의 변화
  - 속마음의 변화
  lexicon: LSJ
  rationale: 직역하면 ‘영혼의 변화’이지만, 한국어에서는 내면의 흔들림을 자연스럽게 드러내는 ‘마음의 변화’가 본문의 관용적 뜻을 잘 전달합니다.
- source_word: πρὸς ἐπισκοπὴν τῶν Ἰουδαίων
  english_pob_choice: for oversight of the Jews
  chosen_korean: 유대인들에 대한 감독과 관련하여
  alternatives_korean:
  - 유대인들을 살피는 일과 관련하여
  - 유대인들에 대한 감찰을 위해
  lexicon: LSJ
  rationale: ἐπισκοπή는 ‘감독/감찰/살핌’의 범위를 가지며, 여기서는 행정적 감독의 맥락이므로 ‘감독’이 가장 직접적입니다.
- source_word: παρ' οὐδὲν ἡγούμενος
  english_pob_choice: counting as nothing
  chosen_korean: 아무것도 아닌 것으로 여기면서
  alternatives_korean:
  - 하찮게 여기면서
  - 전혀 대수롭지 않게 여기면서
  lexicon: LSJ
  rationale: 관용구의 의미인 ‘중요하지 않게 여기다’를 현대 한국어에서 자연스럽게 풀어, 경시의 태도를 분명히 했습니다.
- source_word: ἀτελέστατον ὅρκον
  english_pob_choice: an utterly unfulfillable oath
  chosen_korean: 가장 철저하게 지켜질 수 없는 맹세
  alternatives_korean:
  - 전혀 이행될 수 없는 맹세
  - 아주 완전히 이루어질 수 없는 맹세
  lexicon: LSJ
  rationale: ἀτελέστατος는 ‘완수되지 못한, 달성 불가능한’ 뜻이므로, 본문의 아이러니를 살리되 한국어로는 ‘지켜질 수 없는’으로 의미를 분명하게 했습니다.
- source_word: Ἅιδην
  english_pob_choice: Hades
  chosen_korean: 하데스로
  alternatives_korean:
  - 음부로
  - 죽은 자들의 나라로
  lexicon: LSJ
  rationale: 그리스어 지시 세계를 보존하기 위해 고유명사 음역을 유지했습니다.
- source_word: ἐν γόνασιν καὶ ποσὶν θηρίων ἠκισμένους
  english_pob_choice: cruelly mangled in the knees and feet by beasts
  chosen_korean: 짐승들에게 무릎과 발이 잔혹하게 짓찧인 채로
  alternatives_korean:
  - 짐승들에게 무릎과 발이 망가진 채로
  - 짐승들에게 무릎과 발을 난자당한 채로
  lexicon: LSJ
  rationale: ἠκισμένους는 단순한 상처보다 가혹한 훼손을 뜻하므로, 신체 부위를 유지하면서 폭력성을 드러내는 표현으로 옮겼습니다.
theological_decisions:
