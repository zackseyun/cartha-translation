  rationale: 이 구절은 지하 세계에 대한 그리스어 상을 직접 사용하므로, 전통적 신학 용어보다 원문 세계를 보존하는 음역이 더 적절합니다.
  doctrine_reference: 원문 우선 번역 원칙; 후기 교리적 함의의 과잉 유입 방지
