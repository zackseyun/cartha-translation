  - 믿음을 가지고
  lexicon: LSJ
  rationale: πίστις의 기본 의미를 살리되, 한국어에서는 부사격 ‘믿음으로’가 행위의 방식과 태도를 함께 자연스럽게 드러냅니다.
- source_word: τὰς δυνάμεις
  english_pob_choice: the forces
