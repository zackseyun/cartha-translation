  source_fidelity: 원문의 ἀναλύσαντες는 ‘되찾은 자신감’이 아니라, 모인 이들이 ‘흩어지다/해산하다’라는 뜻으로 옮기는 것이 적절합니다. 초안의 ‘흩어진 뒤’는 이를 잘 반영합니다. 다만 ‘믿음으로 흩어진 뒤’는 μετὰ πίστεως가 오직 흩어지는 행위를 수식하는 듯한 한국어 결속을 만들며, 원문에서는 배치 행위를 포함한 그들의 태도·방식을 나타낼 수도 있으므로 위치를 조정하는 편이 낫습니다. 또한 πρὸς τὴν τήρησιν은 병력에게 ‘경계를 맡게 하다’라기보다 경비/수비를 목적으로 배치했다는 뜻입니다.
