  rationale: 이 분사구는 단순한 ‘떠남’보다 함께 모인 무리에서 흩어짐을 더 잘 드러내므로, 전개된 행동의 흐름을 반영해 옮겼습니다.
- source_word: μετὰ πίστεως
  english_pob_choice: with faith
  chosen_korean: 믿음으로
