  alternative_readings:
  - 확신을 가지고
  - 신실하게
  rationale: 이 구절은 군사적 배치의 문맥이지만, πίστις 자체를 지우지 않고 남겨 두는 것이 POB의 어휘 보존 원칙에 더 부합합니다. 다만 한국어에서는 ‘믿음으로’가 ‘with faith’의 형식과 의미를 모두 무난하게 담습니다.
