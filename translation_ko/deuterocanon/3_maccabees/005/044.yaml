  - 군대
  - 병사들
  lexicon: LSJ
  rationale: 방어 배치의 문맥에서 ‘forces’는 군사적 인력을 뜻하므로, 과도하게 특정하지 않으면서도 자연스러운 ‘병력’을 택했습니다.
theological_decisions:
- issue: μετὰ πίστεως의 의미를 ‘믿음’으로 살릴지, ‘확신/신실함’으로 풀지
  chosen_reading: 본문에는 ‘믿음으로’를 두어 πίστις의 어휘 형태를 유지했습니다.
  alternative_readings:
  - 확신을 가지고
  - 신실하게
  rationale: 이 구절은 군사적 배치의 문맥이지만, πίστις 자체를 지우지 않고 남겨 두는 것이 POB의 어휘 보존 원칙에 더 부합합니다. 다만 한국어에서는 ‘믿음으로’가 ‘with faith’의 형식과 의미를 모두 무난하게 담습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: πίστις → faith'
