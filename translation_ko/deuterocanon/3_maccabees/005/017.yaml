source:
  edition: lxx-swete-1909
  text: ὃ δὲ καὶ γενομένου, παρῄνει εἰς εὐωχίαν δόντας ἑαυτούς, τὸ παρὸν τῆς συμποσίας ἐπὶ πολὺ γεραιρομένους εἰς εὐφροσύνην καταθέσθαι μέρος.
  language: Greek
  pages:
  - 743
  confidence: high
