base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/017.yaml
  text: And when this had happened, he urged them, having given themselves over to feasting, to devote the present occasion of the banquet, long honored, to gladness.
  footnotes:
  - marker: a
    text: Or 'to set aside the present banquet occasion, long honored, as a portion for gladness.' The Greek expression καταθέσθαι μέρος is idiomatic and can be rendered more literally as 'to set down/appoint a part.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일이 일어나자, 그는 잔치를 즐기고 있던 그들에게, 오랫동안 귀히 여겨 온 이 연회의 지금 이 기회를 기쁨을 위해 따로 정하도록 권하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오랫동안 귀히 여겨 온 이 연회의 지금 이 기회를 기쁨의 몫으로 삼도록’이라고 할 수 있습니다. 그리스어 καταθέσθαι μέρος는 직역하면 ‘몫을 내려놓다/정하다’이며, 문맥에서는 기쁨을 위하여 따로 정하거나 할당한다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ δὲ καὶ γενομένου
  english_pob_choice: And when this had happened
  chosen_korean: 이 일이 일어나자
  alternatives_korean:
  - 그 일이 또한 일어나자
  - 이 일이 또한 생기자
  lexicon: LSJ
  rationale: 완료된 앞선 사건을 가리키는 연결 표현으로, 한국어에서는 자연스러운 시간 순서를 드러내는 ‘이 일이 일어나자’가 가장 매끄럽습니다.
- source_word: παρῄνει
  english_pob_choice: he urged
  chosen_korean: 그들을 권하여
  alternatives_korean:
  - 그들을 권면하여
  - 그들을 격려하여
  lexicon: LSJ
  rationale: 문맥상 단순한 위로나 설교보다 조언하고 재촉하는 뉘앙스이므로 ‘권하다’가 가장 적절합니다.
- source_word: εἰς εὐωχίαν δόντας ἑαυτούς
  english_pob_choice: having given themselves over to feasting
  chosen_korean: 잔치에 몸을 내맡긴
  alternatives_korean:
  - 연회에 자신을 내맡긴
  - 먹고 마시는 잔치에 자신을 내준
  lexicon: LSJ
  rationale: εὐωχία의 잔치/연회 의미를 살리면서, 자기 자신을 넘겨준 상태를 ‘몸을 내맡긴’으로 압축해 표현했습니다.
- source_word: τὸ παρὸν τῆς συμποσίας
  english_pob_choice: the present occasion of the banquet
  chosen_korean: 이 잔치의 현재 자리
  alternatives_korean:
  - 이 잔치의 현재 때
  - 이 연회의 지금 이 기회
  lexicon: LSJ
  rationale: παρόν과 μέρος의 결합을 직역하기보다, 문맥상 ‘지금 주어진 몫/자리’를 뜻하는 것으로 보아 한국어에서 이해 가능한 ‘현재 자리’로 옮겼습니다.
- source_word: εἰς εὐφροσύνην καταθέσθαι μέρος
  english_pob_choice: to devote ... to gladness
  chosen_korean: 기쁨에 바치게 하였습니다
  alternatives_korean:
  - 기쁨을 위해 떼어 두게 하였습니다
  - 즐거움의 몫으로 정하게 하였습니다
  lexicon: LSJ
  rationale: καταθέσθαι μέρος의 관용적이고 압축된 표현을 ‘바치다’로 풀어, 이 시간을 기쁨의 몫으로 따로 떼어 두라는 뜻을 살렸습니다.
theological_decisions:
- issue: 잔치/연회 표현의 정서적 수위
  chosen_reading: ‘잔치에 몸을 내맡긴’으로 과도한 도덕적 해석을 덧붙이지 않고, 본문이 말하는 축제적 분위기만 드러냈습니다.
  alternative_readings:
  - ‘향락에 빠진’처럼 도덕 평가를 강화하는 번역
  - ‘연회를 즐기는’처럼 완화된 번역
  rationale: 본문은 단지 잔치에 자신을 내어준 상태를 묘사할 뿐이므로, 텍스트가 말하는 범위를 넘는 평가를 피했습니다.
  doctrine_reference: 번역의 절제와 본문 충실성
- issue: μέρος의 처리
  chosen_reading: ‘현재 자리’로 옮겨 μέρος의 ‘몫/부분’ 감각을 살리되, 한국어에서 지나치게 기계적인 직역을 피했습니다.
  alternative_readings:
  - ‘부분’
  - ‘몫’
  rationale: English POB가 held back the idiom by using ‘present occasion’; 한국어도 문맥상 자연스러운 표현을 택하되, 독자가 ‘일부를 따로 떼어 둔다’는 의미를 읽을 수 있게 했습니다.
  doctrine_reference: 원문 관용구의 의미 보존
