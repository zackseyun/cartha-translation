- from: 이 일이 일어나자 그는 그들을 권하여, 잔치에 몸을 내맡긴 그들이 오랫동안 귀히 여겨 온 이 잔치의 현재 자리를 기쁨에 바치게 하였습니다.[a]
  to: 이 일이 일어나자, 그는 잔치를 즐기고 있던 그들에게, 오랫동안 귀히 여겨 온 이 연회의 지금 이 기회를 기쁨을 위해 따로 정하도록 권하였습니다.[a]
  rationale: 본문의 의미를 바꾸지 않고 ‘현재 자리’라는 부자연스럽고 불명료한 표현을 ‘지금 이 기회’로 고쳤습니다. 또한 ‘바치다’를 ‘따로 정하다’로 바꾸어 καταθέσθαι μέρος의 관용적 의미를 살리고 봉헌적 함의를 피했습니다. ‘잔치를 즐기고 있던’은 εἰς εὐωχίαν δόντας ἑαυτούς의 축제적 참여를 자연스럽게 전달합니다.
