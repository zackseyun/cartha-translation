  - severity: low
    issue: περιστύλιον 관련 각주 표지가 문두에 놓임
    rationale: 각주는 ‘주랑 뜰’이라는 번역어의 건축·어휘 대안을 설명하므로 해당 표현 바로 뒤에 표지를 두어야 합니다.
  - severity: low
