  lexicon: LSJ
  rationale: 직역의 ‘상처받지 않은 마음’보다 한국어에서 자연스럽게 ‘자비나 연민에 닿지 않은 상태’를 드러내는 표현을 택했습니다.
- source_word: κόραις ὀφθαλμῶν
  english_pob_choice: with the pupils of his eyes
  chosen_korean: 눈동자로
  alternatives_korean:
  - 눈의 동공으로
  - 그의 눈동자로
  lexicon: LSJ
  rationale: ‘눈동자/동공’은 직접 보고자 하는 강한 강조를 한국어로 살리면서도, 반복적 직역의 어색함을 줄입니다.
- source_word: τῶν προσεσημαμμένων
  english_pob_choice: of those who had been marked out
  chosen_korean: 자신들이 지목된 이들
