  source_fidelity: ‘자신들이 지목된 이들’은 재귀 표현 때문에 ‘그들이 지목한 사람들’이라는 뜻으로 읽히며, 수동 완료분사 τῶν προσεσημαμμένων(이미 지목·지정된 사람들)의 뜻을 바꿉니다. 이를 바로잡아야 합니다. ἀτρώτῳ καρδίᾳ의 비유를 본문에서 더 직접적으로 보존하고 각주로 의미를 설명하는 편이 안전합니다.
  naturalness: 전반적으로 현대 한국어 합쇼체 문장으로 자연스럽습니다. 다만 ‘무감한 마음’은 다소 비관용적이며 ‘감각이 둔한 마음’처럼 이해될 여지가 있습니다. ‘상처 입지 않은 마음’은 원문의 표현을 보존하면서 각주로 냉혹함의 함의를 충분히 밝혀 줄 수 있습니다.
  terminology: ‘불경한 마음’, ‘짐승들’, ‘고통스럽고 비참한 파멸’은 각각 δυσσεβῆ φρένα, θηρίοις, ἐπίπονον καὶ ταλαίπωρον ... καταστροφήν을 적절히 반영합니다. ‘눈동자’도 κόραις ὀφθαλμῶν의 강조된 직시를 보존합니다.
