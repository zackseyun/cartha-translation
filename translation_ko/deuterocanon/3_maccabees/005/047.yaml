    rationale: 한국어의 ‘자신들이 지목된’은 주어인 그가 지목한 대상으로 해석되기 쉽습니다. 원문은 수동 완료분사로, 그가 보려 한 대상들이 이전에 지목되었음을 말합니다. ‘지목된 이들’ 또는 ‘미리 지목된 이들’로 고쳐야 합니다.
