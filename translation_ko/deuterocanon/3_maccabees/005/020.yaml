revisions:
- from: 그는 파랄리스보다 더 심한 잔혹함을 지녔다고 하며, 오늘 잠을 자게 해 준 것을 감사히 여기라고 말했습니다. 그러나 내일까지 살아 있게 된 뒤에는 같은 방식으로 코끼리들을 준비하여, 법을 어기는 유대인들을 멸망시키십시오.[a][b][c]
  to: 팔라리스[a]보다 더한 잔혹함을 지닌 그는, 그들이 오늘 잠을 잘 수 있게 된 것을 호의로 여기라고 말했습니다.[b] 그러나 그들을 다가오는 날까지 살려 둔 뒤에는, 같은 방식으로 무법한 유대인들을[c] 멸망시키기 위해 코끼리들을 준비하라고 명령했습니다.
  rationale: 주어의 분사구문을 바르게 처리하고, 왕의 명령을 한국어 간접 명령으로 명료하게 옮겼습니다. ‘다가오는 날’은 ὑποτέλλουσαν ἡμέραν의 임박함을 보존하며, ‘살려 둔’은 συντηρηθέντας의 수동적 보존 의미를 드러냅니다. 각주 표지는 해당 어구에 직접 배치했습니다.
