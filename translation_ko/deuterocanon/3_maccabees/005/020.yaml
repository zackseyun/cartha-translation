base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/020.yaml
  text: Having a savagery worse than Phalaris[a], he said that they should be thankful to sleep today; but, once they had been kept alive until the coming day[c][b], prepare the elephants in the same way for the destruction of the lawless Jews.
  footnotes:
  - marker: a
    text: Phalaris was remembered in Greek tradition as a notoriously cruel ruler; the comparison intensifies the king's brutality.
    reason: cultural_note
  - marker: b
    text: Or 'that they should count today's sleep as a favor.' The Greek idiom means they were to regard being allowed to sleep today as something for which they owed thanks.
    reason: lexical_alternative
  - marker: c
    text: '''Lawless'' renders a hostile epithet in the speaker''s words; alternatively, ''unlawful'' or ''impious.'''
    reason: alternative_reading
translation:
  language: ko
  text: 팔라리스[a]보다 더한 잔혹함을 지닌 그는, 그들이 오늘 잠을 잘 수 있게 된 것을 호의로 여기라고 말했습니다.[b] 그러나 그들을 다가오는 날까지 살려 둔 뒤에는, 같은 방식으로 무법한 유대인들을[c] 멸망시키기 위해 코끼리들을 준비하라고 명령했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 팔라리스는 그리스 전승에서 악명 높은 잔혹한 통치자로 기억된 인물입니다. 이 비교는 왕의 잔혹함이 더욱 심함을 강조합니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘오늘의 잠을 은혜로 여기라고’. 그리스어 관용구는 오늘 잠을 잘 수 있도록 허락된 일을 감사해야 할 호의로 여기라는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘무법한’은 박해자의 발화에 나오는 적대적 호칭입니다. 또는 ‘불법한’, ‘불경한’으로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ὠμότητα χείρονα Φαλάριδος
  english_pob_choice: Having a savagery worse than Phalaris
  chosen_korean: 파랄리스보다 더 심한 잔혹함을 지녔다
  alternatives_korean:
  - 파랄리스보다 더 심한 잔혹성을 지녔다
  - 파랄리스보다 더 심한 잔인함을 지녔다
  lexicon: LSJ
  rationale: ὠμότης는 단순한 ‘잔인함’보다 거칠고 야만적인 잔혹성을 가리키므로, 비교 대상인 파랄리스의 악명까지 살려서 옮겼습니다.
- source_word: τὸ τῆς σήμερον ὕπνῳ χάριν ἔχειν αὐτούς
  english_pob_choice: that they should be thankful to sleep today
  chosen_korean: 오늘 잠을 자게 해 준 것을 감사히 여기라고
  alternatives_korean:
  - 오늘 잠을 자는 것을 감사히 여기라고
  - 오늘의 잠에 대해 은혜로 여기라고
  lexicon: LSJ
  rationale: χάριν ἔχειν은 ‘은혜/호의로 여기다, 감사하다’는 관용구이므로, 단순히 ‘잠을 자다’가 아니라 ‘오늘 잠을 자게 해 준 것’을 감사의 대상으로 살렸습니다.
- source_word: συντηρηθέντας δὲ εἰς τὴν ὑποτέλλουσαν ἡμέραν
  english_pob_choice: once they had been kept alive until the coming day
  chosen_korean: 내일까지 살아 있게 된 뒤에는
  alternatives_korean:
  - 다가오는 날까지 보존된 뒤에는
  - 다음 날까지 살려 둔 뒤에는
  lexicon: LSJ
  rationale: συντηρέω는 여기서 생명을 보존해 두는 뜻이므로 ‘살아 있게 되다’로 풀었고, ὑποτέλλουσαν ἡμέραν은 ‘다가오는 날’의 의미를 자연스럽게 ‘내일’로 압축했습니다.
- source_word: τῶν ἀθεμίτων Ἰουδαίων
  english_pob_choice: the lawless Jews
  chosen_korean: 법을 어기는 유대인들을
  alternatives_korean:
  - 무법한 유대인들을
  - 불법한 유대인들을
  lexicon: LSJ
  rationale: ἀθέμιτος는 ‘관습/법에 어긋나는, 불법한’이라는 모욕적 표현이므로, 역사적·수사적 공격성을 유지하면서도 한국어에서 과도하게 신학화하지 않도록 옮겼습니다.
theological_decisions:
- issue: 화자의 모욕적 표현을 한국어로 어떻게 보존할지
  chosen_reading: 본문의 공격적 어조를 그대로 살려, ‘법을 어기는 유대인들’로 번역했습니다.
  alternative_readings:
  - 무법한 유대인들
  - 불경한 유대인들
  rationale: 이 절은 박해자의 발화를 인용하므로, 완화하거나 중화하지 않고 원문 수사 자체를 드러내는 것이 적절합니다.
  doctrine_reference: 원문 우선 번역 원칙; 서술자의 발화와 인용된 적대적 수사의 구분
