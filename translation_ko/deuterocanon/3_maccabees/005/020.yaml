source:
  edition: lxx-swete-1909
  text: τὴν ὠμότητα χείρονα Φαλάριδος ἐσχηκὼς ἔφη τὸ τῆς σήμερον ὕπνῳ χάριν ἔχειν αὐτούς· συντηρηθέντας δὲ εἰς τὴν ὑποτέλλουσαν ἡμέραν κατὰ τὸ ὅμοιον ἑτοίμασον τοὺς ἐλέφαντας ἐπὶ τὸν τῶν ἀθεμίτων Ἰουδαίων ἀφανισμόν.
