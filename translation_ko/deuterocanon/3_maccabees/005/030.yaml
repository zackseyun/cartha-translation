    reason: source_note
lexical_decisions:
- source_word: πλησθεὶς βαρεῖ χόλῳ
  english_pob_choice: filled with heavy anger
  chosen_korean: 무거운 분노로 가득 차서
  alternatives_korean:
  - 몹시 분노하여
  - 격한 분노로 가득 차서
  lexicon: πλησθεὶς / χόλος
  rationale: βαρεῖ χόλῳ의 무게감과 감정의 충만함을 함께 살려, 단순한 '화남'보다 강하고 눌린 분노를 나타내는 표현으로 옮겼습니다.
- source_word: διὰ τὸ ... προνοίᾳ θεοῦ
  english_pob_choice: because ... by the providence of God
  chosen_korean: 하나님의 섭리로
  alternatives_korean:
  - 하나님의 돌보심으로
  - 하나님의 섭리에 의해
  lexicon: πρόνοια θεοῦ
  rationale: πρόνοια는 단순한 예정보다 하나님의 다스리심과 돌보심을 아우르는 말이어서, 문맥에 맞게 '섭리'를 택했습니다.
- source_word: διεσκεδάσθαι πᾶν αὐτοῦ νόημα
  english_pob_choice: all his purpose ... had been frustrated
  chosen_korean: 자기의 모든 뜻이 흩어졌기 때문에
  alternatives_korean:
  - 자기의 모든 계획이 좌절되었기 때문에
  - 자기의 모든 의도가 무너졌기 때문에
  lexicon: διασκεδάζω / νόημα
  rationale: νόημα를 '뜻'으로, '흩어지다'의 이미지를 살려 그의 의도와 목적이 무너진 상태를 보다 직접적으로 반영했습니다.
- source_word: ἐντείνων μετὰ ἀπειλῆς
  english_pob_choice: spoke with threats, pressing the matter hard
  chosen_korean: 위협을 곁들여 말하며 일을 강하게 밀어붙였습니다
  alternatives_korean:
  - 위협하며 강하게 몰아붙였습니다
  - 위협을 섞어 말하며 압박했습니다
  lexicon: ἐντείνω / ἀπειλή
  rationale: ἐντείνω는 단순 발화가 아니라 긴장시키며 압박하는 뉘앙스가 있어, '강하게 밀어붙이다'로 옮겨 압박의 지속성을 살렸습니다.
theological_decisions:
- issue: 하나님의 섭리(πρόνοια θεοῦ)의 번역
  chosen_reading: 하나님의 섭리
  alternative_readings:
  - 하나님의 돌보심
  - 하나님의 예지
  rationale: 본문은 사건의 배후에 있는 하나님의 주권적 다스림을 말하므로, 전통적이면서도 문맥에 충실한 '섭리'가 가장 적절합니다.
  doctrine_reference: 섭리론
- issue: 하나님의 개입이 원수의 뜻을 무너뜨리는 서술
  chosen_reading: 자기의 모든 뜻이 흩어졌다
  alternative_readings:
  - 자기의 모든 계획이 좌절되었다
  - 자기의 모든 의도가 무너졌다
  rationale: 본문의 초점은 인간의 분노보다 하나님의 섭리로 인한 좌절에 있으며, 이 긴장을 보존하기 위해 완곡하게 약화하지 않았습니다.
  doctrine_reference: 하나님의 주권
