  source_fidelity: 핵심 의미는 대체로 충실하지만, ‘그 말들을 듣고’는 ἐπὶ τοῖς ῥηθείσιν(‘말해진 것 때문에/말해진 것을 두고’)에 ‘듣다’라는 행위를 덧붙입니다. 또한 ‘모든 뜻이 흩어졌다’는 직역적 이미지는 남기지만 현대 한국어에서는 계획의 좌절을 뜻한다는 점이 충분히 분명하지 않습니다.
