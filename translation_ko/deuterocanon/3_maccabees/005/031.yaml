base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/031.yaml
  text: All the parents who were present[a], and the children with them, have prepared this lavish feast for the wild beasts, instead of the Jews[b], who have been shown to me and to my forefathers to possess complete and steadfast faithfulness beyond reproach.
  footnotes:
  - marker: a
    text: Or 'their children' for 'the offspring of children'; the Greek expression is awkward in this witness and may broadly denote the children/descendants present with the parents.
    reason: lexical_alternative
  - marker: b
    text: Or 'full and firm faith' or 'complete and steadfast loyalty.' The Greek πίστις here likely refers to proven fidelity or loyalty rather than specifically religious faith.
    reason: alternative_reading
translation:
  language: ko
  text: 그 자리에 있던 모든 부모와 그들과 함께한 자녀들은, 야훼께서 나와 내 조상들에게 흠잡을 데 없고 완전한, 견고한 믿음성을 지닌 사람들로 드러내신 유대인들 대신, 이 잔치를 들짐승들을 위한 풍성한 연회로 마련했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들과 함께한 자녀들’로 풀 수 있습니다. 그리스어 표현이 다소 어색하여, 자녀/후손을 넓게 가리키는 말일 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘완전하고 견고한 신실함’ 혹은 ‘충성’으로 옮길 수 있습니다. 여기서 πίστις는 종교적 ‘믿음’보다 입증된 충성/신실성을 가리킬 가능성이 큽니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅσοι γονεῖς παρῆσαν
  english_pob_choice: All the parents who were present
  chosen_korean: 그 자리에 있던 모든 부모
  alternatives_korean:
  - 그 자리에 있던 모든 아버지들
  - 거기 있던 모든 부모들
  lexicon: LSJ
  rationale: Ὅσοι는 집합 전체를 가리키므로 ‘모든’으로 살리고, γονεῖς는 문맥상 ‘부모’가 가장 자연스럽습니다.
- source_word: παίδων γόνοι
  english_pob_choice: the children with them
  chosen_korean: 그들과 함께한 자녀들
  alternatives_korean:
  - 자녀들의 자녀
  - 아이들의 후손
  lexicon: LSJ
  rationale: 그리스어 표현이 다소 어색하고 중의적이므로, 영어 POB의 판단을 따라 동반한 자녀/후손을 뜻하는 흐름을 살려 옮겼습니다.
- source_word: θηρσὶν ἀγρίοις
  english_pob_choice: for the wild beasts
  chosen_korean: 들짐승들을 위한
  alternatives_korean:
  - 야생 짐승들을 위한
  - 사나운 짐승들을 위한
  lexicon: LSJ
  rationale: dative of purpose/advantage로서 ‘~을 위한’이 자연스럽고, θηρσίν ἀγρίοις의 거친 뉘앙스는 ‘들짐승’으로 살렸습니다.
- source_word: δαψιλῆ θοῖναν
  english_pob_choice: this lavish feast
  chosen_korean: 풍성한 연회
  alternatives_korean:
  - 호화로운 잔치
  - 넉넉한 식사
  lexicon: LSJ
  rationale: θοίνα는 잔치/연회를 뜻하고 δαψιλῆ는 풍성함을 나타내므로, 문맥의 비극적 아이러니를 살려 ‘풍성한 연회’로 번역했습니다.
- source_word: ἀνεγκλήτων ... ὁλοσχερῆ βεβαίαν πίστιν ἔχων
  english_pob_choice: to possess complete and steadfast faithfulness beyond reproach
  chosen_korean: 흠잡을 데 없고 완전한, 견고한 믿음성을 지닌
  alternatives_korean:
  - 흠잡을 데 없고 완전한, 변치 않는 신실함을 지닌
  - 책잡을 데 없고 온전한 충성을 지닌
  lexicon: LSJ; BDAG
  rationale: πίστις가 여기서는 종교적 ‘믿음’보다 입증된 신실성/충성의 뜻에 가깝고, ἀνεγκλήτων은 ‘흠잡을 데 없는’으로, ὁλοσχερῆ βεβαίαν은 ‘완전한, 견고한’으로 분리해 살렸습니다.
theological_decisions:
- issue: πίστις의 의미 범위
  chosen_reading: ‘믿음성’으로 표기하되, 문맥상 신앙 고백보다 검증된 신실성과 충성의 의미를 드러냈습니다.
  alternative_readings:
  - 믿음
  - 신실함
  - 충성
  rationale: 이 본문은 하나님에 대한 신앙 교리가 아니라 왕과 조상들에게 입증된 유대인의 신뢰성을 말하므로, 도식적으로 ‘믿음’만 고정하지 않고 의미 범위를 보존했습니다.
