theological_decisions:
- issue: 문장 구조와 동작의 선후 관계
  chosen_reading: ‘그가 말한 대로’와 ‘거의…이르게 하고’의 관게를 살려, 사육·준비 행위가 본격적 전개에 앞선 예비 동작임을 드러냈습니다.
  alternative_readings:
  - ‘그가 말했듯이’
  - ‘거의…상태로 만들고’
  rationale: 원문과 영어 POB 모두 준비 행위의 단계성과 화자 언급을 강조하므로, 이를 한국어에서도 분명히 보여 주는 것이 문맥 충실성에 유리합니다.
  doctrine_reference: 서술 구조 보존
