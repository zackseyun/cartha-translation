translation:
  language: ko
  text: 그런데 코끼리 대장은 — 그가 말한 대로 — 거의 그 짐승들을 매우 향기로운 음료와, 유향을 섞은 포도주로 광란의 상태에 이르게 하고, 두렵게 장식하여 장비를 갖추게 했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문은 원문의 난해한 분사형을 반영하여 ‘이르게’로 옮겼습니다. 영어 POB의 ‘after bringing’에 해당하는 준비 동작의 의미를 살렸습니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘유향 향이 배인 포도주로.’
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘장비’ 대신 ‘치장물’ 또는 ‘장식물’로 볼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
