translation:
  language: ko
  text: 그런데 코끼리 대장은 자기가 말한 대로 그 짐승들을 매우 향기로운 음료인 유향을 섞은 포도주로 거의 광란의 상태에 이르게 하고[a][b], 장비를 갖추어 위협적으로 꾸며 놓았습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이르게 하고’로 옮긴 원문의 분사형 ἀγιοχὼς는 이 본문 전승에서 형태와 어휘적 의미가 난해합니다. 여기서는 문맥에 따라 코끼리들을 그러한 상태로 만들기 위한 준비 행위를 가리키는 것으로 번역했습니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘유향 향이 밴 포도주로.’
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘장비’ 대신 ‘치장물’ 또는 ‘장식물’로 옮길 수 있습니다.
    reason: lexical_alternative
