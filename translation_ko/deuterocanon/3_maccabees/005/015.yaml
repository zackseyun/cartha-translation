translation:
  language: ko
  text: 그는 겨우 잠에서 깨어나자마자, 잔치 시간이 이미 지나가고 있음을 가리키며 이런 일들에 대해 말하고 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μόλις διεγείρας
  english_pob_choice: after barely rousing himself
  chosen_korean: 겨우 잠에서 깨어나자마자
  alternatives_korean:
  - 간신히 몸을 일으키자마자
  - 거의 깨어나자마자
  lexicon: LSJ
  rationale: μόλις의 최소·어려움의 뉘앙스를 살리고, διεγείρας를 자연스러운 한국어로 풀어 ‘잠에서 깨어나다’로 옮겼습니다. "자마자"는 부사절의 즉시성을 반영합니다.
- source_word: ὑπέδειξέ
  english_pob_choice: he pointed out
  chosen_korean: 가리키며
  alternatives_korean:
  - 지적하며
  - 알려 주며
  lexicon: LSJ
  rationale: 이 동사는 단순한 시각적 ‘보여 주다’보다 어떤 사실을 짚어 드러내는 기능이 강하므로, 문맥상 ‘가리키며’가 가장 자연스럽고 간결합니다.
- source_word: τὸν τῆς συμποσίας καιρὸν
  english_pob_choice: the time for the banquet
  chosen_korean: 잔치 시간
  alternatives_korean:
  - 연회 시간
  - 술자리 시간이
  lexicon: LSJ
  rationale: συμπόσιον은 연회/술잔치 모두 가능하지만, 문맥상 격식 있는 식사 자리를 가리키는 말로 읽히므로 ‘잔치 시간’으로 옮겼습니다.
- source_word: ἤδη παρατρέχοντα
  english_pob_choice: was already slipping by
  chosen_korean: 이미 지나가고 있음을
  alternatives_korean:
  - 이미 흘러가고 있음을
  - 벌써 지나가 버리고 있음을
  lexicon: LSJ
  rationale: 시간이 ‘옆으로 지나치는’ 동적인 이미지를 한국어의 관용적 표현으로 옮겼습니다. urgency를 살리되 과장하지 않도록 했습니다.
- source_word: τὸν περὶ τούτων λόγον ποιούμενος
  english_pob_choice: speaking about these matters
  chosen_korean: 이런 일들에 대해 말하고 있었습니다
  alternatives_korean:
  - 이런 것들에 대해 말하고 있었습니다
  - 이 일들에 대해 이야기하고 있었습니다
  lexicon: LSJ
  rationale: λόγον ποιεῖσθαι는 단순 발화보다 ‘말을 하다/말하고 있다’는 진행 상황을 드러내므로, 한국어에서는 장황한 직역보다 자연스러운 진행형으로 옮겼습니다.
