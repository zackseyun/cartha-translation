  to: 그러나 그분 자신이 원하시는 모든 이에게 잠을 베푸시는 분께서 밤과 낮에 아름답게 이어지게 하신, 태고부터 이어져 온 시간의 창조 질서[a]는 왕에게 잠을 조금 보냈습니다[b].
  rationale: 수정문은 원문의 긴 주어구를 한국어에서 자연스럽게 재배열했습니다. ‘밤과 낮에 아름답게 이어지게 하신’은 ἐν νυκτὶ καὶ ἡμέρᾳ ἐπιβαλλόμενον의 주기적·시적 표현과 ὑπό 이하의 행위자 관계를 함께 반영합니다. κτίσμα의 시적 모호성은 본문에서 ‘창조 질서’로, 각주에서 ‘창조물’이라는 대안으로 보존했습니다. ‘일부’는 한국어에서 다소 경직되므로 μέρος는 ‘조금’으로 자연화했으며, 각주에 직역을 남겼습니다.
