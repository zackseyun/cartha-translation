base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/011.yaml
  text: But the age-old ordinance of time[a], beautifully alternating in night and day by the One who grants sleep to all, to whomever he himself wills, sent a portion of sleep upon the king[b];
  footnotes:
  - marker: a
    text: Or 'from of old creation of time'; the Greek phrase is poetic and compact, describing the long-established created order of time expressed in night and day.
    reason: lexical_alternative
  - marker: b
    text: Literally 'sent a portion of sleep into/to the king.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그분 자신이 원하시는 모든 이에게 잠을 베푸시는 분께서 밤과 낮에 아름답게 이어지게 하신, 태고부터 이어져 온 시간의 창조 질서[a]는 왕에게 잠을 조금 보냈습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘태고부터의 시간의 창조물’. 그리스어 구는 압축된 시적 표현으로, 밤과 낮으로 드러나는 시간의 오래된 창조 질서를 가리킵니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘왕에게/왕 안으로 잠의 일부를 보냈다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δὲ ... κτίσμα χρόνου
  english_pob_choice: the age-old ordinance/creation of time
  chosen_korean: 오래전부터 있던 시간의 창조
  alternatives_korean:
  - 시간의 옛 질서
  - 시간의 창조물
  lexicon: LSJ
  rationale: κτίσμα은 문맥에 따라 '창조된 것' 또는 '창조'를 뜻할 수 있는데, 여기서는 밤과 낮의 주기와 연결되므로 시간의 সৃষ্টি된 질서를 가리키는 시적 표현으로 옮겼습니다.
- source_word: ἀπʼ αἰῶνος
  english_pob_choice: age-old
  chosen_korean: 오래전부터 있던
  alternatives_korean:
  - 옛적의
  - 영원한
  lexicon: LSJ
  rationale: 이 표현은 오래된 기원을 나타내므로, '영원한'처럼 형이상학적 의미를 더 강하게 만들지 않고 장구한 기원을 살렸습니다.
- source_word: ἐν νυκτὶ καὶ ἡμέρᾳ ἐπιβαλλόμενον
  english_pob_choice: alternating in night and day
  chosen_korean: 밤과 낮으로 아름답게 이어지는
  alternatives_korean:
  - 밤과 낮에 걸쳐 번갈아 드러나는
  - 밤과 낮에 내려앉는
  lexicon: LSJ
  rationale: ἐπιβαλλόμενον의 직역적 이미지를 살리되, 한국어에서는 시간의 순환을 자연스럽게 드러내기 위해 '이어지는'으로 옮겼습니다.
- source_word: ὑπὸ τοῦ χαριζομένου πᾶσιν, οἷς ἂν αὐτὸς θελήσῃ
  english_pob_choice: by the One who grants sleep to all, to whomever he himself wills
  chosen_korean: 자신이 원하시는 모든 이에게 잠을 주시는 분으로부터
  alternatives_korean:
  - 모든 이에게 은혜롭게 베푸시는 분으로부터
  - 그분이 원하시는 누구에게나 잠을 주시는 분으로부터
  lexicon: LSJ
  rationale: χαρίζομαι의 '은혜롭게 주다'라는 뜻을 반영하면서, 문맥상 앞의 ὕπνον과 연결되는 '잠'을 분명히 했습니다. 또한 οἷς ἂν αὐτὸς θελήσῃ의 주권성을 '자신이 원하시는'으로 살렸습니다.
- source_word: ὕπνον μέρος ἀπέστειλεν εἰς τὸν βασιλέα
  english_pob_choice: sent a portion of sleep upon the king
  chosen_korean: 왕에게 잠의 일부를 보내셨습니다
  alternatives_korean:
  - 왕 위에 잠의 일부를 내리셨습니다
  - 왕에게 잠의 몫을 보내셨습니다
  lexicon: LSJ
  rationale: μέρος는 '부분/일부'이므로 이를 유지했고, εἰς τὸν βασιλέα는 한국어에서 자연스러운 '왕에게'로 옮겼습니다. 동사의 주체는 문맥상 하나님이므로 존대 종결로 처리했습니다.
theological_decisions:
- issue: 잠을 주시는 분의 암시적 신적 주체
  chosen_reading: 문맥상 하나님을 가리키는 '잠을 주시는 분'을 그대로 드러내되, 본문에 없는 호칭은 덧붙이지 않았습니다.
  alternative_readings:
  - '''하나님''을 명시하는 번역'
  - '''주시는 분''만 두고 주체를 생략하는 번역'
  rationale: 그리스어 분사는 하나님을 암시하지만 직접 호칭은 없으므로, 문맥적 지시를 살리면서도 과도한 신학적 확정을 피했습니다.
  doctrine_reference: Translation philosophy §§1, 6
- issue: 밤과 낮의 순환을 나타내는 시적 표현
  chosen_reading: '''밤과 낮으로 아름답게 이어지는''으로 순환성과 시적 어조를 함께 살렸습니다.'
  alternative_readings:
  - '''밤과 낮에 번갈아 나타나는'''
  - '''밤과 낮 가운데 오가는'''
  rationale: 본문은 시간의 창조가 밤과 낮의 주기로 드러난다는 시적 진술이므로, 기계적 직역보다 리듬과 의미를 함께 전달하는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 3
