  rationale: διάνοια의 단순한 ‘마음’보다 정신적 태도와 상태를 함께 보여 주는 표현을 택했고, ἄσταθη의 ‘흔들림/불안정함’을 살렸습니다.
- source_word: προεφέροντο τάδε
  english_pob_choice: kept saying these things
  chosen_korean: 이런 말들을 계속했습니다
  alternatives_korean:
