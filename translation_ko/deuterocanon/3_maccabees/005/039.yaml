  - 그와 함께 상에 앉아 있던
  lexicon: LSJ
  rationale: 연회 자리의 관습인 ‘비스다’는 자세를 살리되, 현대 한국어에서 자연스럽게 읽히도록 표현했습니다.
- source_word: συγγενεῖς
