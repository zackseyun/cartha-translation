  - ‘상에 앉아 있던’으로 완곡하게 처리
  rationale: 본문의 συνανακείμενοι는 단순한 식사가 아니라 함께 비스는 고대 연회 관습을 가리키므로, 문화적 배경이 지워지지 않도록 했습니다.
  doctrine_reference: 문화-역사적 배경 보존
- issue: διάνοια의 정신적 상태 표현
  chosen_reading: ‘마음 상태’로 옮겨 단순한 생각보다 내적 상태를 드러냈습니다.
  alternative_readings:
  - ‘마음’
  - ‘생각’
  - ‘성향’
  rationale: 본문은 그의 판단 내용보다 불안정한 정신적 태도를 말하므로, 독자가 상태의 불안정을 바로 이해하도록 했습니다.
  doctrine_reference: 인간 심리/내적 상태 묘사
