  yaml_path: translation/deuterocanon/3_maccabees/005/039.yaml
  text: 'But the relatives who were reclining with him[a], marveling at his unstable state of mind[b], kept saying these things:'
  footnotes:
  - marker: a
    text: Or, 'who were dining with him' or 'who sat at table with him'; the Greek specifically evokes the ancient custom of reclining at meals.
    reason: cultural_note
  - marker: b
    text: Literally, 'his unstable mind'; the phrase refers to his unsettled mental disposition.
    reason: lexical_alternative
translation:
  language: ko
  text: 그와 함께 비스던 친척들은 그의 흔들리는 마음 상태를 놀라워하며, 이런 말들을 계속했습니다:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그와 함께 비스던’이며, 고대 연회에서 식사할 때의 비스는 자세를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 직역하면 ‘그의 불안정한 마음’이며, here는 흔들리고 불안한 정신 상태를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνανακείμενοι
  english_pob_choice: who were reclining with him
  chosen_korean: 그와 함께 비스던
  alternatives_korean:
