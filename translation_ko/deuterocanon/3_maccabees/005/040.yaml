  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ἤδη τρίτον의 누적적 강조는 ‘이제 이미’보다 ‘벌써 세 번째로’가 정확하고 자연스럽습니다. 또한 원문의 두 분사는 왕이 신하들을 ‘시험하는’ 방식으로 병렬되어 있으므로, 한국어에서도 불필요한 양보 연결 ‘-고도’는 피하는 편이 좋습니다.
