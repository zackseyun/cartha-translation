base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/040.yaml
  text: O king[a], how long will you keep testing us, now commanding for the third time that they be destroyed, and then again, in the matter at hand, reversing by a change of mind the decisions you have made?
  footnotes:
  - marker: a
    text: Or 'undoing your decrees.' The Greek τὰ σοὶ δεδογμένα can refer specifically to what has been officially decreed by the king, not merely private decisions.
    reason: lexical_alternative
translation:
  language: ko
  text: 임금이시여, 언제까지 우리를 시험하시렵니까? 이제 이미 세 번째로 그들을 멸하라고 명하시고도, 또다시 이 일에 관하여 마음을 바꾸어 당신이 정하신 결정을 뒤집으십니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “당신이 내리신 칙령을 뒤집으십니까.” τὰ σοὶ δεδογμένα는 왕이 공식적으로 정한 것, 곧 칙령을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βασιλεῦ
  english_pob_choice: O king
  chosen_korean: 임금이시여
  alternatives_korean:
  - 왕이시여
  - 임금님
  lexicon: LSJ
  rationale: 직접 호칭이므로 높임을 유지하되, 문맥상 왕권의 공식성을 살려 ‘임금이시여’로 옮겼습니다.
- source_word: μέχρι τίνος ὡς ἡμᾶς διαπειράζεις
  english_pob_choice: how long will you keep testing us
  chosen_korean: 언제까지 우리를 시험하시렵니까
  alternatives_korean:
  - 얼마나 더 우리를 시험하시렵니까
  - 언제까지 우리를 떠보시렵니까
  lexicon: LSJ
  rationale: διαπειράζω의 반복적·강한 ‘시험하다’의 뜻을 살려, 진행 중인 압박을 묻는 항의의 뉘앙스를 자연스러운 한국어로 옮겼습니다.
- source_word: προστάσσων ἤδη τρίτον αὐτοὺς ἀφανίσαι
  english_pob_choice: now commanding for the third time that they be destroyed
  chosen_korean: 이제 이미 세 번째로 그들을 멸하라고 명하시고도
  alternatives_korean:
  - 이미 세 번째로 그들을 멸하라고 명하시고도
  - 지금 세 번째로 그들을 없애라고 명하시고도
  lexicon: LSJ
  rationale: προστάσσων은 공식적 명령을 가리키므로 ‘명하시고도’로 처리했고, ἤδη τρίτον은 반복이 누적된 상황을 드러내는 ‘이제 이미 세 번째로’로 반영했습니다.
- source_word: ἐκ μεταβολῆς ἀναλύων τὰ σοὶ δεδογμένα
  english_pob_choice: reversing by a change of mind the decisions you have made
  chosen_korean: 마음을 바꾸어 당신이 정하신 결정을 뒤집으십니까
  alternatives_korean:
  - 변심하여 당신이 정하신 결정을 뒤집으십니까
  - 태도를 바꾸어 당신이 정하신 결정을 취소하십니까
  lexicon: LSJ
  rationale: ἐκ μεταβολῆς와 ἀναλύων의 결합은 이미 내린 결정을 되돌리는 행위를 뜻하므로, ‘마음을 바꾸어 … 뒤집으십니까’로 원문의 역동과 비판적 어조를 살렸습니다.
theological_decisions:
- issue: τὰ σοὶ δεδογμένα의 의미 범위
  chosen_reading: 개인적 생각보다 공식적으로 정하신 결정으로 읽었습니다.
  alternative_readings:
  - 당신의 개인적 결정
  - 당신의 칙령
  rationale: 데δογμένα는 단순한 사적 판단보다 공적으로 확정된 바를 가리킬 수 있어, 왕의 권위 아래 내려진 결정을 넓게 반영했습니다.
  doctrine_reference: 공문서/왕령 문맥의 의미 범위
