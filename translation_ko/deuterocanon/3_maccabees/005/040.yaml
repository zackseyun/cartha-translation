  terminology: ‘멸하다’, ‘명하다’, ‘칙령’은 왕의 공식적 명령과 파멸의 의미를 적절히 전달합니다. τὰ σοὶ δεδογμένα는 넓게는 ‘정하신 결정’, 좁게는 왕의 ‘칙령’일 수 있으므로 본문과 각주가 이 범위를 적절히 보존합니다.
