  text: For this reason the city is in turmoil because of the expectation[a], and as it grows with crowds[c][b], it is already in danger of being plundered many times.
  footnotes:
  - marker: a
    text: Or 'because of the anticipation' or 'because of the suspense'; the Greek term denotes a state of expectation.
    reason: lexical_alternative
  - marker: b
    text: Or 'with crowds' or 'with massed gatherings'; the Greek can suggest the city swelling with assembled groups.
    reason: lexical_alternative
  - marker: c
    text: Or 'often' instead of 'many times.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 때문에 도시는 그 기대[a] 때문에 소란스러우며, 군중[b]이 불어나면서 이미 여러 번[c] 약탈당할 위험에 놓여 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기대감 때문에’, ‘불안한 기다림 때문에’로도 옮길 수 있습니다. 그리스어 προσδοκία는 기대 상태를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘무리로’, ‘집결한 무리로’로도 옮길 수 있습니다. 그리스어는 도시가 모인 무리들로 부풀어 오르는 뉘앙스를 줄 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘자주’로도 옮길 수 있습니다.
    reason: lexical_alternative
