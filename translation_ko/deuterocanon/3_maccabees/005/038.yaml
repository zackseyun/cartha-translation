  text: Arm the elephants even now for tomorrow[b][a], for the destruction of the Jews.
  footnotes:
  - marker: a
    text: Or 'for the annihilation of the Jews.' The Greek noun can denote utter destruction or obliteration.
    reason: lexical_alternative
  - marker: b
    text: Or 'the Judeans,' though in this context the broader ethnic-religious sense 'the Jews' is more likely.
    reason: alternative_reading
translation:
  language: ko
  text: 지금이라도 내일을 위하여 코끼리들을 무장시키십시오[a][b]. 유대인들의 멸망을 위해서입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘절멸을 위해서’로 옮길 수 있습니다. 그리스어 명사는 철저한 파괴나 소멸을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘유다인들’로 옮길 수 있으나, 이 문맥에서는 더 넓은 민족·종교적 의미의 ‘유대인들’이 더 가능성이 높습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: καθόπλισον
