- source_word: ἐπὶ τὸν ... ἀφανισμόν
  english_pob_choice: for the destruction of
  chosen_korean: 멸망을 위해서
  alternatives_korean:
  - 파괴를 위해서
  - 절멸을 위해서
  - 완전한 파괴를 위해
  lexicon: LSJ
  rationale: ἀφανισμός는 단순 손상보다 ‘사라짐/소멸/멸절’의 강한 파괴를 가리키므로, 본문과 어조를 살리는 강한 표현인 '멸망'을 선택했습니다.
- source_word: τῶν Ἰουδαίων
