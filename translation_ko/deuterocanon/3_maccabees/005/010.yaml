base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/010.yaml
  text: But Hermon[a], after giving the savage elephants drink, with them filled from the abundant supply of wine and saturated with frankincense[b], came early in the morning to the court to report these things to the king.
  footnotes:
  - marker: a
    text: Or 'merciless elephants.' The Greek adjective can emphasize pitiless ferocity.
    reason: lexical_alternative
  - marker: b
    text: '''Frankincense'' translates λίβανος specifically, not incense in general.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 허몬은 잔혹한 코끼리들에게 술을 먹여, 그들을 포도주의 풍성한 공급으로 가득 채우고 유향으로 흠뻑 적신 뒤, 아침 일찍 왕에게 이 일들을 보고하려고 궁정에 나왔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘잔혹한’은 그리스어 ἀνηλεῖς가 지닌 ‘무자비한, 사나운’ 뉘앙스를 자연스럽게 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘유향’은 λίβανος를 가리키며, 일반적인 ‘향’보다 더 구체적인 향료를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕρμων
  english_pob_choice: Hermon
  chosen_korean: 허몬
  alternatives_korean:
  - 헤르몬
  - 헤르몽
  lexicon: 고유명사 음역
  rationale: 그리스어 고유명사 Ἕρμων을 현대 한국어 음역으로 옮겼습니다. 기존 교회식 인명보다 원음에 가까운 표기를 택했습니다.
- source_word: ἀνηλεῖς
  english_pob_choice: savage
  chosen_korean: 잔혹한
  alternatives_korean:
  - 사나운
  - 무자비한
  - 피도 눈물도 없는
  lexicon: LSJ
  rationale: 코끼리의 맹렬하고 자비 없음이라는 성격을 살리되, 동물 묘사로서 자연스러운 현대 한국어 형용사인 ‘잔혹한’을 선택했습니다.
- source_word: ποτίσας
  english_pob_choice: after giving ... drink
  chosen_korean: 술을 먹여
  alternatives_korean:
  - 물을 먹여
  - 마시게 한 뒤
  - 먹여
  lexicon: LSJ
  rationale: 동물이 마시게 했다는 행위를 한국어에서 가장 자연스럽게 드러내는 표현으로 옮겼습니다. 문맥상 단순 급수보다 의도적으로 마시게 함이 핵심입니다.
- source_word: πεπληρωμένους τῆς τοῦ οἴνου πολλῆς χορηγίας
  english_pob_choice: filled with an abundant supply of wine
  chosen_korean: 포도주의 풍성한 공급으로 가득 채우고
  alternatives_korean:
  - 포도주의 많은 공급으로 채우고
  - 포도주를 풍성히 먹이고
  - 포도주의 풍족한 제공으로 채우고
  lexicon: LSJ
  rationale: χορηγία의 ‘공급/제공’ 뉘앙스를 살려 ‘풍성한 공급’으로 옮겼고, 완료 분사 구조는 코끼리들이 그런 상태가 되었음을 반영해 ‘가득 채우고’로 처리했습니다.
- source_word: τοῦ λιβάνου μεμεστωμένους
  english_pob_choice: saturated with frankincense
  chosen_korean: 유향으로 흠뻑 적신
  alternatives_korean:
  - 프랑킨센스로 흠뻑 적신
  - 향으로 가득한
  - 유향으로 가득 채운
  lexicon: LSJ
  rationale: λίβανος는 일반적인 ‘향’이 아니라 ‘유향’이므로 그 차이를 보존했습니다. μεμεστωμένους의 충만함은 ‘흠뻑 적신’으로 강하게 살렸습니다.
- source_word: ὄρθριος
  english_pob_choice: early in the morning
  chosen_korean: 아침 일찍
  alternatives_korean:
  - 새벽에
  - 이른 아침에
  - 동틀 무렵
  lexicon: LSJ
  rationale: 정확한 시각을 특정하지 않으면서도 이른 시간의 도착을 자연스럽게 전달하는 표현입니다.
- source_word: αὐλὴν
  english_pob_choice: court
  chosen_korean: 궁정
  alternatives_korean:
  - 뜰
  - 안뜰
  - 왕궁
  lexicon: LSJ
  rationale: 왕 앞에 나아가는 공식적인 장소라는 점을 살려 ‘궁정’으로 옮겼습니다. 단순한 건물 공간보다 왕실 행정의 맥락이 드러납니다.
- source_word: προσαγγεῖλαι
  english_pob_choice: to report
  chosen_korean: 보고하려고
  alternatives_korean:
  - 알리려고
  - 전달하려고
  - 고하려고
  lexicon: LSJ
  rationale: 목적 부정사의 행정적·공식적 성격을 살려 ‘보고하다’로 옮겼습니다. 왕에게 올리는 설명이라는 문맥에 가장 잘 맞습니다.
theological_decisions:
- issue: 문장 첫머리 접속사 δέ의 처리
  chosen_reading: «그런데»로 옮겨 앞 절과의 서사적 전환을 표시했습니다.
  alternative_readings:
  - 그리고
  - 또
  - 하지만
  rationale: 본문의 δέ는 단순 연결보다 장면 전환을 나타내므로, 한국어 서술에서 자연스럽고 대비도 살리는 ‘그런데’가 적절합니다.
  doctrine_reference: 서사 담화 흐름 보존
- issue: λιβάνου의 의미
  chosen_reading: ‘유향’으로 구체화했습니다.
  alternative_readings:
  - 향
  - 향료
  rationale: 어휘적으로 λίβανος는 일반적 incense가 아니라 frankincense를 가리키므로, 종교적·물질적 대상을 흐리지 않도록 구체어를 택했습니다.
  doctrine_reference: 어휘 정밀성
