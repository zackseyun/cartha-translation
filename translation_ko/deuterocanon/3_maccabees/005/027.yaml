base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/027.yaml
  text: But when he had accepted it and was struck with astonishment at the lawless outcome[a], being in every way overcome by ignorance[b], he kept asking whether what had been decreed had indeed been carried out for him with urgency.
  footnotes:
  - marker: a
    text: Or 'the lawless result' or 'the unlawful issue'; the Greek phrase uses ἔξοδος in a context where 'departure' is possible lexically but unlikely in English.
    reason: lexical_alternative
  - marker: b
    text: Or 'what had been written down' or 'the issued order'; the Greek can refer specifically to a written decree.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그가 그것을 받아들이고, 불법한 결말에 놀라며 — 모든 면에서 무지에 사로잡힌 채 — 무엇이 이미 공포된 대로 그에게도 서둘러 이루어졌는지 계속 물었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불법한 결과’, ‘불법한 귀결’. 그리스어 ἔξοδος는 여기서 ‘떠남’보다 사건의 종결이나 귀결을 가리키는 뜻으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘무지로’, ‘무지에 의해 제압된 채’. 그리스어는 단순한 정보 부족이 아니라 판단력을 빼앗긴 상태를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποδεξαμένου
  english_pob_choice: had accepted it
  chosen_korean: 그것을 받아들이고
  alternatives_korean:
  - 그것을 받았고
  - 그것을 수용하고
  - 그것을 승인하고
  lexicon: LSJ
  rationale: 받아들이다는 ἀποδέχομαι의 수용·인수 의미를 자연스럽게 살리며, 문맥상 단순 수령보다 더 넓은 반응을 담을 수 있습니다.
- source_word: ἀνόμῳ ἐξόδῳ
  english_pob_choice: lawless outcome
  chosen_korean: 불법한 결말
  alternatives_korean:
  - 불법한 결과
  - 불법한 종결
  - 불법한 떠남
  lexicon: LSJ
  rationale: ἔξοδος는 문맥상 ‘떠남’보다 사건의 종결이나 귀결을 가리키는 뜻이 강하므로, 법적·서사적 충격을 함께 드러내는 결말로 옮겼습니다.
- source_word: ἀγνωσίᾳ κεκρατημένος
  english_pob_choice: overcome by ignorance
  chosen_korean: 무지에 사로잡힌 채
  alternatives_korean:
  - 무지에 압도된 채
  - 무지에 붙들린 채
  - 무지로 제압된 채
  lexicon: LSJ
  rationale: κρατέω의 지배·장악 의미를 반영해, 단순한 ‘모름’이 아니라 판단력을 잃은 상태를 나타내도록 했습니다.
- source_word: τὸ διαγραμμένον
  english_pob_choice: what had been decreed
  chosen_korean: 이미 공포된 것
  alternatives_korean:
  - 이미 기록된 것
  - 이미 내려진 명령
  - 이미 공표된 것
  lexicon: LSJ
  rationale: 이 문맥의 διαγράφω는 기록된 왕령·공포문을 가리키므로, ‘공포된 것’으로 옮겨 행정적 문서의 뉘앙스를 살렸습니다.
- source_word: μετὰ σπουδῆς
  english_pob_choice: with urgency
  chosen_korean: 서둘러
  alternatives_korean:
  - 급히
  - 열심히
  - 간절히
  lexicon: LSJ
  rationale: σπουδή의 속도와 진지함을 함께 살리되, 이 절의 질문 문장에서는 자연스러운 부사구로 압축하는 편이 적절했습니다.
theological_decisions:
