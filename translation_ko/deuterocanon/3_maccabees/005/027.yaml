  rationale: 본문은 도덕적·법적 위법성을 분명히 하므로, 충격을 완화하는 표현보다 원문의 긴장을 보존하는 쪽이 적절합니다.
  doctrine_reference: 서사 문맥의 법정·왕령 어휘 보존
