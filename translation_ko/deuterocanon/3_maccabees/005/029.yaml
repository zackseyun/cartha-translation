base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/029.yaml
  text: 'Hermon was showing them the beasts and all the forces: “They are prepared[a], O king[c][b], according to that intention of yours.”'
  footnotes:
  - marker: a
    text: Or 'was pointing out' or 'was displaying'; the Greek imperfect suggests ongoing action.
    reason: lexical_alternative
  - marker: b
    text: '''The friends'' may refer to royal associates or courtiers in a Hellenistic court setting.'
    reason: cultural_note
  - marker: c
    text: Or 'according to that plan of yours.'
    reason: lexical_alternative
translation:
  language: ko
  text: 헤르몬과 모든 친구들이 짐승들과 군대들을 보여 주고 있었습니다. 「그것들은 준비되어 있습니다[a], 왕이시여[b], 그때의 당신의 의도[c]에 따라。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '가리키고 있었습니다', '보여 주고 있었습니다', '지시하고 있었습니다'로도 옮길 수 있습니다. 그리스어 미완료 시제는 계속되는 동작을 시사합니다.
    reason: lexical_alternative
  - marker: b
    text: '''친구들''은 헬레니즘 궁정 맥락에서 왕의 측근이나 궁정 신하들을 가리킬 수 있습니다.'
    reason: cultural_note
  - marker: c
    text: 또는 '그 계획에 따라'로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπεδείκνυεν
  english_pob_choice: was showing
  chosen_korean: 보여 주고 있었습니다
  alternatives_korean:
  - 가리키고 있었습니다
  - 보여 주고 있었습니다
  - 지시하고 있었습니다
  lexicon: LSJ
  rationale: 미완료 과거의 지속적 동작을 살리기 위해 진행형으로 옮겼습니다. 문맥상 왕에게 준비된 것들을 계속 보여 주는 장면이므로 자연스럽게 표현했습니다.
- source_word: τὰ θηρία
  english_pob_choice: the beasts
  chosen_korean: 짐승들
  alternatives_korean:
  - 야수들
  - 동물들
  - 짐승들
  lexicon: LSJ
  rationale: 문맥상 위협적이고 처형용으로 준비된 짐승들을 가리키므로, 중립적인 '동물들'보다 강한 뉘앙스의 '짐승들'이 적절합니다.
- source_word: τὰς δυνάμεις
  english_pob_choice: all the forces
  chosen_korean: 군대들
  alternatives_korean:
  - 부대들
  - 군세들
  - 군대들
  lexicon: LSJ
  rationale: δυνάμεις의 복수형은 군사력이나 군대들을 가리킬 수 있으므로, 한국어에서는 복수성을 살려 '군대들'로 옮겼습니다.
- source_word: κατὰ τὴν σὴν ἐκείνην πρόθεσιν
  english_pob_choice: according to that intention of yours
  chosen_korean: 그때의 당신의 의도에 따라
  alternatives_korean:
  - 당신의 그 계획에 따라
  - 그때의 당신의 계획에 따라
  - 그때의 당신의 의도에 따라
  lexicon: LSJ
  rationale: πρόθεσις는 계획, 목적, 의도 모두 가능하지만, 여기서는 왕의 이전 결심을 가리키는 말로 보아 '의도'가 가장 무난합니다. ἐκείνην의 지시적 뉘앙스는 '그때의'로 살렸습니다.
theological_decisions:
- issue: 왕에게 대한 직접 호칭의 높임말 표현
  chosen_reading: 「왕이시여」로 공손한 직접 호칭을 유지했습니다.
  alternative_readings:
  - 왕이여
  - 전하
  - 임금님
  rationale: 그리스어 호격 βασιλεῦ를 직접 호칭으로 살리되, 한국어 합쇼체에 맞게 과도하게 현대 궁정어로 바꾸지 않았습니다.
  doctrine_reference: 문체/화법
