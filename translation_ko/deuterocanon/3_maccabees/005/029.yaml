    reason: lexical_alternative
  - marker: b
    text: ‘친구들’은 헬레니즘 궁정의 맥락에서 왕의 측근이나 궁정 신하들을 가리킬 수 있습니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘당신의 그 계획대로’로 옮길 수 있습니다.
    reason: lexical_alternative
