translation:
  language: ko
  text: 그는 다가오는 날까지, 모두 오백 마리인 코끼리에게 유향을 넉넉히 넣고 희석하지 않은 포도주를 많이 마시게 하며, 풍족한 음료로 사나워지게 한 뒤 유대인들을 멸망시키도록 들여보내라고 명령했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘유대인들의 파멸과 맞닥뜨리도록’입니다. 그리스어의 압축된 표현은 문맥상 코끼리들을 유대인들을 멸망시키기 위해 들여보내려 했다는 뜻입니다.
    reason: lexical_alternative
