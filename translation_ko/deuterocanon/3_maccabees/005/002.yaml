theological_decisions:
- issue: μόρος를 어떻게 한국어로 처리할지
  chosen_reading: ‘몰락’으로 옮겨, 결과를 직접 서술하되 인물 집단의 파멸이라는 문맥적 의미를 드러냈습니다.
  alternative_readings:
