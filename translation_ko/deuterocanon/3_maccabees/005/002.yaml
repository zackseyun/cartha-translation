  - ‘죽음’으로 단순화
  rationale: 이 표현은 교리적 쟁점이 아니라 문맥적 강도를 어떻게 보존할지의 문제입니다. ‘몰락’은 집단적 파괴의 의미를 자연스럽게 전달하면서도 원문의 압축된 표현을 지나치게 평이하게 만들지 않습니다.
  doctrine_reference: 문맥 우선의 의미 보존
