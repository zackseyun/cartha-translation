  lexicon: LSJ
  rationale: δράκες를 ‘양’으로 풀어 유향에 붙는 어색함을 줄이면서도, ἀκράτος는 ‘많이 타지 않은’으로 옮겨 희석되지 않은 포도주의 의미를 살렸습니다.
- source_word: πρὸς συνάντησιν τοῦ μόρου τῶν Ἰουδαίων
  english_pob_choice: for the destruction of the Jews
  chosen_korean: 유대인들의 몰락을 맞이하게 하려고
  alternatives_korean:
  - 유대인들의 파멸을 맞이하게 하려고
  - 유대인들의 죽음을 맞게 하려고
  lexicon: LSJ
  rationale: πρὸς συνάντησιν은 직역하면 ‘맞이함/대면함’의 뉘앙스를 가지므로, POB의 해석을 따라 ‘몰락을 맞이하게 하다’로 옮겨 파괴적 결과를 간접적으로 드러냈습니다.
theological_decisions:
- issue: μόρος를 어떻게 한국어로 처리할지
  chosen_reading: ‘몰락’으로 옮겨, 결과를 직접 서술하되 인물 집단의 파멸이라는 문맥적 의미를 드러냈습니다.
  alternative_readings:
  - ‘파멸’로 직역
  - ‘죽음’으로 단순화
  rationale: 이 표현은 교리적 쟁점이 아니라 문맥적 강도를 어떻게 보존할지의 문제입니다. ‘몰락’은 집단적 파괴의 의미를 자연스럽게 전달하면서도 원문의 압축된 표현을 지나치게 평이하게 만들지 않습니다.
  doctrine_reference: 문맥 우선의 의미 보존
