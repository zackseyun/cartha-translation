- source_word: δαψιλέσι δράκεσι λιβανωτοῦ καὶ οἴνῳ πλείονι ἀκράτῳ
  english_pob_choice: generous draughts of frankincense and much unmixed wine
  chosen_korean: 유향의 넉넉한 양과 많이 타지 않은 포도주
  alternatives_korean:
