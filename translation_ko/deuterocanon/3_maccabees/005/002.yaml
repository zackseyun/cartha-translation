  text: He ordered that[a], by the coming day, all the elephants—five hundred in number—be given drink with generous draughts of frankincense and much unmixed wine, and that, once made savage by the abundant supply of drink, they be brought in for the destruction of the Jews.
  footnotes:
  - marker: a
    text: Or 'for the doom/death of the Jews.' The Greek phrase is literally 'for a meeting with the doom of the Jews,' an idiom expressing their intended destruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 다가오는 날까지 모든 코끼리—수효가 오백 마리였습니다—에게 유향의 넉넉한 양과 많이 타지 않은 포도주를 먹이고, 음료의 풍부한 공급으로 사나워진 뒤에는 유대인들의 몰락을 맞이하게 하려고 들여보내라고 명령했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘유대인들의 몰락을 맞이함’입니다. 여기서는 그들이 겪게 될 파괴적 결말을 가리키는 관용적 표현으로 이해됩니다.
    reason: lexical_alternative
