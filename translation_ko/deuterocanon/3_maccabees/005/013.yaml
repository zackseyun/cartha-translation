  text: οἵ τε Ἰουδαῖοι τὴν προσημανθεῖσαν ὥραν Α διαφυγόντες, τὸν ἅγιον ἤγουν θεὸν αὐτῶν καὶ πάλιν ἤξιουν τὸν εὐκατάλλακτον δεῖξαι μεγαλοφθενῶς ἑαυτοῦ χειρὸς κράτος ἔθνεσιν ὑπερηφάνοις.
