base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/013.yaml
  text: And the Jews[a], having escaped the appointed hour, again were imploring their holy God to show to the proud nations, in magnificent generosity[c][b], the might of his hand.
  footnotes:
  - marker: a
    text: Or 'their God, that is, the Holy One.' The Greek includes an explanatory particle.
    reason: lexical_alternative
  - marker: b
    text: Or 'to the arrogant Gentiles.' The Greek word can mean either 'nations' or, in Jewish usage, 'Gentiles.'
    reason: lexical_alternative
  - marker: c
    text: The phrase rendered 'in magnificent generosity' reflects two Greek terms expressing both gracious readiness and grandeur; more literal alternatives include 'graciously' or 'with noble greatness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 유대인들은 미리 정해진 때를 벗어난 뒤, 다시 거룩하신 분, 곧 자기들의 너그러우신 하나님께서 교만한 민족들에게 그분의 손의 권능을 크게 보여 주시기를 간청하였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거룩하신 분, 곧 자기들의 하나님’은 설명을 덧붙이는 그리스어 표현(ἤγουν)을 반영한 것입니다.
    reason: source_note
  - marker: b
    text: ‘민족들’은 유대 문맥에서 ‘이방들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘너그러우신’은 하나님을 수식하는 εὐκατάλλακτον을, ‘크게’는 그분의 권능을 보이시는 방식을 나타내는 μεγαλοφθενῶς를 각각 반영한 것입니다. 전자는 ‘쉽게 화해하시는’ 또는 ‘쉽게 달래시는’으로도 직역될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαφυγόντες
  english_pob_choice: having escaped
  chosen_korean: 벗어나게 되었으므로
  alternatives_korean:
  - 도망쳐 나왔으므로
  - 피해 나왔으므로
  - 살아남았으므로
  lexicon: LSJ
  rationale: 위험과 정해진 시한을 통과해 무사히 벗어난 결과를 나타내므로, 단순한 회피보다 ‘벗어나다’ 계열이 더 가깝습니다.
- source_word: τὴν προσημανθεῖσαν ὥραν
  english_pob_choice: the appointed hour
  chosen_korean: 지정된 시간
  alternatives_korean:
  - 정해진 시간
  - 미리 알려진 시간
  - 미리 정해진 시각
  lexicon: LSJ
  rationale: 미리 표지된 때라는 뜻을 자연스럽게 살리되, 한국어에서 어색한 ‘appointed hour’ 직역은 피했습니다.
- source_word: τὸν ἅγιον ἤγουν θεὸν αὐτῶν
  english_pob_choice: their holy God
  chosen_korean: 자기들의 거룩하신 하나님
  alternatives_korean:
  - 자기들의 하나님, 곧 거룩하신 분
  - 자기들의 거룩한 하나님
  lexicon: LSJ
  rationale: ἤγουν의 설명적 성격은 문맥상 본문 속 어순으로 흡수할 수 있어, 소유와 거룩함을 함께 살린 표현으로 옮겼습니다.
- source_word: εὐκατάλλακτον + μεγαλοφθενῶς
  english_pob_choice: in magnificent generosity
  chosen_korean: 크신 너그러움으로
  alternatives_korean:
  - 위대하신 너그러움으로
  - 위엄 있는 너그러움으로
  - 크고 너그럽게
  lexicon: LSJ
  rationale: 두 단어가 함께 하나님 쪽의 은혜로운 태도와 장엄함을 나타내므로, ‘너그러움’으로 의미를 묶되 ‘크신’으로 장중함을 보존했습니다.
- source_word: χειρὸς κράτος
  english_pob_choice: the might of his hand
  chosen_korean: 그분의 손의 능력
  alternatives_korean:
  - 그분의 손의 힘
  - 그분의 강한 손
  - 그분의 손의 권능
  lexicon: LSJ
  rationale: 성경적 관용구인 ‘손의 힘/능력’을 직관적으로 살려, 물리적 이미지와 권능의 의미를 함께 유지했습니다.
- source_word: ἔθνεσιν ὑπερηφάνοις
  english_pob_choice: to the proud nations
  chosen_korean: 교만한 나라들 앞에
  alternatives_korean:
  - 교만한 민족들에게
  - 오만한 나라들에게
  - 교만한 이방들에게
  lexicon: LSJ
  rationale: ἔθνη는 여기서 ‘나라들’이 가장 중립적이며, ὑπερήφανοι의 도덕적 뉘앙스는 ‘교만한’으로 직접 옮겼습니다.
theological_decisions:
- issue: εὐκατάλλακτον을 하나님 성품의 ‘쉽게 달램’으로 오해하지 않도록 하는 문제
  chosen_reading: ‘크신 너그러움으로’로 옮겨, 하나님의 자비롭고 너그러운 응답 가능성을 강조했습니다.
  alternative_readings:
  - 쉽게 달래시는
  - 쉽게 화해하시는
  - 쉽게 용서하시는
  rationale: 본문은 이스라엘의 간구 문맥에 있으므로, 하나님을 조작 가능하게 만드는 뉘앙스보다 자비롭고 위엄 있는 응답의 이미지를 살리는 것이 더 적절합니다.
  doctrine_reference: 'DOCTRINE.md: 하나님 성품의 긴장을 보존하고, 현대 한국어로 읽히되 신학적 오해를 피한다.'
