  yaml_path: translation/deuterocanon/3_maccabees/005/046.yaml
  text: Around dawn[a], when the city was already filled with innumerable crowds at the hippodrome, he entered the court and urged the king on concerning the matter at hand.
  footnotes:
  - marker: a
    text: Or 'the palace court' or 'the courtyard'; the Greek αὐλή can denote the court area of a royal residence.
    reason: lexical_alternative
translation:
  language: ko
  text: 새벽 무렵, 도시에는 이미 경마장 곳곳을 가득 메운 셀 수 없이 많은 군중이 있었고, 그는 왕궁 뜰[a]로 들어가 그 당면한 일을 두고 왕을 재촉했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘궁정’ 또는 ‘안뜰’; 그리스어 αὐλή는 왕실 거주지의 뜰 구역이나 궁정 공간을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ τὴν ἕω
  english_pob_choice: Around dawn
  chosen_korean: 새벽 무렵
  alternatives_korean:
  - 동틀 무렵
  - 여명 무렵
  lexicon: LSJ
  rationale: περὶ는 대략성을 나타내므로, 한국어에서는 시간의 근접성을 자연스럽게 살리는 ‘무렵’이 적절합니다.
- source_word: πλήθεσιν ἀναριθμήτοις
  english_pob_choice: with innumerable crowds
  chosen_korean: 셀 수 없는 무리로
  alternatives_korean:
  - 헤아릴 수 없는 무리로
  - 무수한 무리로
  lexicon: LSJ
  rationale: πλήθεσιν은 ‘무리/군중’의 복수적 집합을 가리키고 ἀναριθμήτοις가 그 수를 넘어서는 과장을 더하므로, ‘셀 수 없는 무리’가 어감을 잘 보존합니다.
- source_word: κατὰ τοῦ ἱπποδρόμου
  english_pob_choice: at the hippodrome
  chosen_korean: 경기장에
  alternatives_korean:
  - 경마장에
  - 히포드롬에
  lexicon: LSJ
  rationale: ἱππόδρομος는 문자적으로 경마장이지만, 현대 한국어에서는 고유한 고대 시설명보다 기능을 살린 ‘경기장’이 더 자연스럽고 이해하기 쉽습니다.
- source_word: εἰς τὴν αὐλήν
  english_pob_choice: the court
  chosen_korean: 뜰로
  alternatives_korean:
  - 궁정으로
  - 왕궁 뜰로
  lexicon: LSJ
  rationale: αὐλή는 ‘뜰/안뜰’과 ‘궁정’ 모두 가능하지만, 이 절에서는 왕에게 들어가는 공간적 이동을 직접적으로 드러내는 ‘뜰’이 원어의 기본 의미에 가깝습니다.
- source_word: ἐπὶ τὸ προκείμενον
  english_pob_choice: in regard to the matter at hand
  chosen_korean: 현재의 일에 관해
  alternatives_korean:
  - 앞에 놓인 문제에 관해
  - 그 문제에 관해
  lexicon: LSJ
  rationale: 관용구적으로 ‘앞에 놓인 일/문제’를 뜻하므로, 문맥상 자연스러운 현대 한국어로 옮기되 구체적인 사안을 덧붙이지 않았습니다.
- source_word: ὤτρυνε
  english_pob_choice: urged ... on
  chosen_korean: 재촉했습니다
  alternatives_korean:
  - 부추겼습니다
  - 촉구했습니다
  - 재촉하여 움직이게 했습니다
  lexicon: LSJ
  rationale: ὀτρύνω는 단순한 요청보다 강한 압박을 포함할 수 있지만, 여기서는 내러티브 흐름에 맞게 과도한 해석을 피하면서도 행동을 밀어붙이는 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 이 절의 서술 어조와 인물 관계를 어떻게 나타낼지
  chosen_reading: 직접 인용이나 신학적 논쟁이 없는 서술문이므로, 과장 없이 사건 진행을 전달하는 중립적 서술체를 유지했습니다.
  alternative_readings:
  - 보다 극적이게 ‘부추겼습니다’로 옮길 수 있음
  - 더 완곡하게 ‘권했습니다’로 옮길 수 있음
  rationale: 원문 ὤτρυνε는 단순 권고보다 강한 압력이 있을 수 있지만, 이 절 자체는 그 동기의 신학적 평가를 명시하지 않으므로 해석을 과도하게 밀지 않았습니다.
  doctrine_reference: 서술 중립성 및 원문 의미 범위 보존
