base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/012.yaml
  text: And by the action of the Sovereign he was overcome with a most pleasant and deep stupor[b][a], having been greatly frustrated in his lawless purpose and utterly disappointed in his unchangeable resolve.
  footnotes:
  - marker: a
    text: Or 'was overcome by the most sweet and deep working of the Master.' The Greek imagery is unusual and metaphorical, combining pleasantness and depth with divine restraint.
    reason: lexical_alternative
  - marker: b
    text: '''The Sovereign'' renders Greek despotes, a title emphasizing absolute authority; alternatively, ''the Master.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 주권자의 작용으로 그는 가장 달콤하고 깊은 혼미에 사로잡혔으며, 자신의 불법적인 계획에서 크게 좌절되고 자신의 변치 않는 결의에서도 크게 기대가 어긋났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 주권자의 가장 달콤하고 깊은 작용에 의해 압도되었다.’ 그리스어 표현은 이례적이고 비유적이며, ‘달콤하고 깊은’ 상태로 그를 붙드는 신적 제어를 묘사합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: δεσπότου
  english_pob_choice: the Sovereign
  chosen_korean: 주권자
  alternatives_korean:
  - 주인
  - 주님
  lexicon: LSJ
  rationale: δεσπότης는 단순한 ‘주님’보다 절대적 소유권과 권위를 드러내므로, 신학적 오해를 줄이면서도 권위성을 살리는 ‘주권자’를 택했습니다.
- source_word: ἥδιστῳ καὶ βαθεῖ
  english_pob_choice: most pleasant and deep stupor
  chosen_korean: 가장 달콤하고 깊은 혼미
  alternatives_korean:
  - 가장 즐겁고 깊은 혼미
  - 가장 달콤하고 깊은 잠잠함
  lexicon: LSJ
  rationale: 직역 가능한 형용사 결합을 살리되, 문맥상 비정상적으로 강한 비유를 유지하기 위해 ‘달콤하고 깊은’을 그대로 반영했습니다.
- source_word: κατεσχέθη τῇ ἐνεργείᾳ
  english_pob_choice: was overcome with ... by the action
  chosen_korean: 활동으로 그는 ... 사로잡혔습니다
  alternatives_korean:
  - 작용으로 그는 ... 제압당했습니다
  - 역사하심으로 그는 ... 붙들렸습니다
  lexicon: LSJ
  rationale: ἐνέργεια는 단순한 추상적 ‘힘’보다 실제로 작동하는 ‘활동/작용’이 자연스럽고, κατεσχέθη는 외적 힘에 붙들린 상태를 살리기 위해 ‘사로잡히다’를 택했습니다.
- source_word: ἀθέσμου ... προθέσεως
  english_pob_choice: lawless purpose
  chosen_korean: 불법한 계획
  alternatives_korean:
  - 법 없는 목적
  - 무법한 의도
  lexicon: LSJ
  rationale: ἀθέσμος는 율법/질서에 어긋나는 도덕적 불법성을 가리키므로 ‘불법한’이 의미를 직접적으로 전달합니다. προθέσις는 여기서 내세운 의도이므로 ‘계획’이 자연스럽습니다.
- source_word: πολὺ διεσφαλμένος
  english_pob_choice: greatly thwarted
  chosen_korean: 크게 좌절되었고
  alternatives_korean:
  - 많이 방해되었고
  - 심하게 꺾였고
  lexicon: LSJ
  rationale: διασφάλλω는 실패하게 하다, 헛되게 하다의 뜻을 가지므로 결과적 붕괴를 드러내는 ‘좌절되다’가 한국어에서 가장 읽기 쉽습니다.
- source_word: ἀμεταθέτου λογισμοῦ
  english_pob_choice: unchangeable resolve
  chosen_korean: 변하지 않는 결의
  alternatives_korean:
  - 바뀌지 않는 생각
  - 흔들리지 않는 판단
  lexicon: LSJ
  rationale: λογισμός는 단순한 생각보다 굳어진 판단·결심에 가깝기 때문에 ‘결의’가 적절하며, ἀμετάθετος는 ‘변하지 않는’으로 직역했습니다.
- source_word: μεγάλως διεψευσμένος
  english_pob_choice: utterly disappointed
  chosen_korean: 완전히 빗나갔습니다
  alternatives_korean:
  - 크게 실망했습니다
  - 철저히 좌절했습니다
  lexicon: LSJ
  rationale: διαψεύδω의 수동은 기대가 틀어지거나 어그러진 상태를 나타내므로, 감정 중심의 ‘실망’보다 결과 중심의 ‘빗나가다’가 더 정확합니다.
theological_decisions:
- issue: δεσπότης의 한국어 신학적 어감
  chosen_reading: 주권자
  alternative_readings:
  - 주인
  - 주님
  rationale: 본문은 κύριος가 아니라 δεσπότης를 쓰므로, 통상적 호칭인 ‘주님’보다 절대 통치권을 드러내는 표현을 택해 어휘 차이를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; consistency of key terms, or documented exception.'
- issue: 비정상적으로 강한 비유(‘달콤하고 깊은 혼미’)의 보존
  chosen_reading: 문맥의 이질적이고 은유적인 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 자연스럽게 완화하여 ‘편안한 깊은 혼미’로 옮김
  - 의미 위주로 ‘강한 졸음’으로 정리함
  rationale: 원문은 ‘달콤함’과 ‘깊음’을 병치해 신적 제어의 기이한 체험을 묘사하므로, 매끈하게 평준화하지 않고 낯선 이미지를 보존했습니다.
  doctrine_reference: 'POB principle: retain source imagery where it carries meaning and rhetorical force.'
