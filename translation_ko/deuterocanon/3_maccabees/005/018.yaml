  yaml_path: translation/deuterocanon/3_maccabees/005/018.yaml
  text: But as the conversation kept dragging on[a], the king summoned Hermon and, with a bitter threat, asked for what reason the Jews had been spared, having survived beyond the appointed day.
  footnotes:
  - marker: a
    text: Or, more literally, 'why the Jews had been preserved/healed, having lived through the remaining day.' The Greek wording is compressed and somewhat difficult; the translation takes it to mean that they remained alive past the day set for them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 대화가 계속 지체되자, 왕은 헤르몬을 불러, 매서운 위협을 하며 유대인들이 정해진 날을 넘겨 살아남고도 무슨 이유로 보전되었는지를 물었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역에 가깝게는 ‘유대인들이 남아 있는 날을 살아 넘기고서 어찌하여 치유되었는지/보전되었는지’입니다. 그리스어 표현은 압축적이고 다소 난해합니다. ‘남아 있는 날’은 문맥상 그들에게 정해진 날로 이해될 수 있으나, ‘다음 날’ 또는 ‘남은 날’이라는 뉘앙스도 가능합니다. 여기서 ‘치유되다’는 질병 치유라기보다 보전되거나 살아남았다는 뜻일 수 있습니다.
    reason: lexical_alternative
