  lexicon: LSJ
  rationale: 이 문맥에서 ‘치유되다’가 아니라 죽음에서 벗어나 생존한 뜻이므로, POB의 해석을 따라 ‘살아남다’로 옮겼습니다.
- source_word: περιοῦσαν ἡμέραν περιβεβιωκότες
