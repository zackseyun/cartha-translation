base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/018.yaml
  text: But as the conversation kept dragging on[a], the king summoned Hermon and, with a bitter threat, asked for what reason the Jews had been spared, having survived beyond the appointed day.
  footnotes:
  - marker: a
    text: Or, more literally, 'why the Jews had been preserved/healed, having lived through the remaining day.' The Greek wording is compressed and somewhat difficult; the translation takes it to mean that they remained alive past the day set for them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 대화가 더욱 길어지자, 왕은 헤르몬을 불러들여, 쓰라린 위협을 담아 유대인들이 무슨 까닭으로 살아남았는지, 곧 정해진 날을 넘겨 살아 있었는지를 물었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘유대인들이 남아 있는 날을 살아 넘기며 보전/치유되었는지’에 가깝습니다. 그리스어 표현이 압축적이고 다소 난해하므로, 번역은 그들이 정해진 날을 지나 살아남았다는 뜻으로 풀었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ πλεῖον δὲ προσκοπτούσης τῆς ὁμιλίας
  english_pob_choice: But as the conversation kept dragging on
  chosen_korean: 그러나 대화가 더욱 길어지자
  alternatives_korean:
  - 그러나 대화가 계속 이어지자
  - 그러나 이야기가 더 지체되자
  lexicon: LSJ
  rationale: προσκοπτούσης와 ἐπὶ πλεῖον이 대화의 지연·길어짐을 나타내므로, 자연스럽게 ‘더 길어지자’로 옮겼습니다.
- source_word: προσκαλεσάμενος
  english_pob_choice: summoned
  chosen_korean: 불러들여
  alternatives_korean:
  - 소환하여
  - 불러
  lexicon: LSJ
  rationale: 왕이 헤르몬을 자기 앞으로 불러오게 한 권위를 살리면서도 현대 한국어 문맥에 자연스럽게 맞췄습니다.
- source_word: μετὰ πικρίας ἀπειλῆς
  english_pob_choice: with a bitter threat
  chosen_korean: 쓰라린 위협을 담아
  alternatives_korean:
  - 쓴 위협을 품고
  - 매서운 위협과 함께
  lexicon: LSJ
  rationale: πικρίας의 감정적·표현적 뉘앙스를 ‘쓰라린’으로 살리고, ἀπειλή는 단순한 불쾌감이 아니라 실제 위협이므로 ‘위협’을 유지했습니다.
- source_word: τίνος ἕνεκεν αἰτίας
  english_pob_choice: for what reason
  chosen_korean: 무슨 까닭으로
  alternatives_korean:
  - 무슨 이유로
  - 어떤 이유 때문에
  lexicon: LSJ
  rationale: 그리스어의 강조된 의문 표현을 한국어에서는 ‘무슨 까닭으로’로 간결하게 옮겨 의미의 압박감을 살렸습니다.
- source_word: ἰάθησαν
  english_pob_choice: had been spared
  chosen_korean: 살아남았는지
  alternatives_korean:
  - 구원받았는지
  - 살려졌는지
  - 보전되었는지
  lexicon: LSJ
  rationale: 이 문맥에서 ‘치유되다’가 아니라 죽음에서 벗어나 생존한 뜻이므로, POB의 해석을 따라 ‘살아남다’로 옮겼습니다.
- source_word: περιοῦσαν ἡμέραν περιβεβιωκότες
  english_pob_choice: having survived beyond the appointed day
  chosen_korean: 정해진 날을 넘겨 살아 있었는지를
  alternatives_korean:
  - 정해진 날을 지나 살아 있었는지를
  - 남은 날을 넘겨 살아 있었는지를
  lexicon: LSJ
  rationale: 압축된 그리스어는 ‘남은 날’보다, 문맥상 처형/파멸로 정해진 날을 넘겼다는 뜻이 드러나야 하므로 ‘정해진 날’로 풀었습니다.
theological_decisions:
- issue: ἰάθησαν의 의미 범위
  chosen_reading: ‘치유되다’의 표면적 의미를 따르지 않고, 문맥상 멸망에서 보전되어 살아남은 뜻으로 이해했습니다.
  alternative_readings:
  - 그들이 ‘치유되었다’는 문자적 번역
  - 그들이 ‘보전되었다’는 보다 직접적인 번역
  rationale: 왕의 분노가 담긴 질문은 질병 치유가 아니라 죽음의 계획에서 벗어난 생존을 겨냥하므로, 서술 의도를 드러내는 번역이 필요합니다.
  doctrine_reference: 문맥우선 번역 원칙
- issue: ‘정해진 날’의 해석
  chosen_reading: ‘남은 날’보다 ‘정해진 날’로 옮겨, 왕이 이미 설정한 파멸의 시점을 가리키는 것으로 드러냈습니다.
  alternative_readings:
  - 남은 날
  - 남아 있는 날
  rationale: 그리스어 표현이 압축적이지만 이야기 전체 맥락에서는 예정된 파괴의 날이 지나갔다는 의미가 핵심입니다.
  doctrine_reference: 문맥우선 번역 원칙
