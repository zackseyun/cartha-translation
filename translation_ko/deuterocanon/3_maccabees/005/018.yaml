  chosen_korean: 정해진 날을 넘겨 살아 있었는지를
  alternatives_korean:
  - 정해진 날을 지나 살아 있었는지를
  - 남은 날을 넘겨 살아 있었는지를
  lexicon: LSJ
  rationale: 압축된 그리스어는 ‘남은 날’보다, 문맥상 처형/파멸로 정해진 날을 넘겼다는 뜻이 드러나야 하므로 ‘정해진 날’로 풀었습니다.
theological_decisions:
- issue: ἰάθησαν의 의미 범위
  chosen_reading: ‘치유되다’의 표면적 의미를 따르지 않고, 문맥상 멸망에서 보전되어 살아남은 뜻으로 이해했습니다.
  alternative_readings:
  - 그들이 ‘치유되었다’는 문자적 번역
  - 그들이 ‘보전되었다’는 보다 직접적인 번역
  rationale: 왕의 분노가 담긴 질문은 질병 치유가 아니라 죽음의 계획에서 벗어난 생존을 겨냥하므로, 서술 의도를 드러내는 번역이 필요합니다.
  doctrine_reference: 문맥우선 번역 원칙
- issue: ‘정해진 날’의 해석
  chosen_reading: ‘남은 날’보다 ‘정해진 날’로 옮겨, 왕이 이미 설정한 파멸의 시점을 가리키는 것으로 드러냈습니다.
  alternative_readings:
  - 남은 날
  - 남아 있는 날
  rationale: 그리스어 표현이 압축적이지만 이야기 전체 맥락에서는 예정된 파괴의 날이 지나갔다는 의미가 핵심입니다.
  doctrine_reference: 문맥우선 번역 원칙
