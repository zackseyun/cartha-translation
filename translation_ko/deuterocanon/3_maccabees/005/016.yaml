  text: When the king considered this[a], and turned to drinking, he ordered those who had come to the banquet to recline around him.
  footnotes:
  - marker: a
    text: The final phrase is textually and syntactically difficult in the Greek. It refers to the guests taking their places in reclining posture in relation to the king; 'around him' is a contextual rendering. Possible alternatives include 'near him' or 'at his table position.'
    reason: textual_variant
translation:
  language: ko
  text: 왕이 이것을 숙고하고 술로 기울자, 잔치에 온 사람들에게 자기 곁에 둘러앉도록 명했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 마지막 구는 문법과 의미가 다소 난해하므로, 왕을 중심으로 한 식탁 배치라는 문맥에 따라 옮겼습니다. '가까이에' 또는 '그의 자리에서'로도 옮길 수 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: λογισάμενος
  english_pob_choice: considered this
  chosen_korean: 이것을 숙고하고
  alternatives_korean:
  - 이것을 고려하고
  - 이것을 생각하고
  lexicon: LSJ
  rationale: aorist middle participle로서 앞선 사안을 마음에 두고 판단하는 흐름을 나타내므로, 자연스러운 한국어로는 '숙고하고'가 가장 정확합니다.
- source_word: τραπεὶς εἰς τὸν πότον
  english_pob_choice: turned to drinking
  chosen_korean: 술로 기울자
  alternatives_korean:
  - 술에 빠지자
  - 마시기 시작하자
  lexicon: LSJ
  rationale: 직역보다 행동의 전환을 살려야 하므로, 술잔치 쪽으로 방향을 틀어 들어가는 뉘앙스를 담는 '술로 기울자'를 택했습니다.
- source_word: παραγεγονότας
  english_pob_choice: those who had come
  chosen_korean: 잔치에 온 사람들
  alternatives_korean:
  - 이미 와 있던 사람들
  - 도착한 사람들
  lexicon: LSJ
  rationale: 완료 분사로서 도착해 현장에 있는 참석자들을 가리키므로, 한국어에서는 의미를 풀어 '잔치에 온 사람들'로 옮겼습니다.
- source_word: ὑπὲρ ἀνακλίνα αὐτοῦ
  english_pob_choice: to recline around him
  chosen_korean: 자기 곁에 둘러앉도록
  alternatives_korean:
  - 자기 주위에 눕도록
  - 자기 자리 가까이에 앉도록
  lexicon: LSJ
  rationale: 본문은 식탁에서의 기대기/눕기 자세를 가리키는 난해한 표현이어서, 의미를 과도하게 특정하지 않으면서도 왕을 중심으로 한 배치감을 살려 '자기 곁에 둘러앉도록'으로 처리했습니다.
theological_decisions:
- issue: 연회 장면의 식사 자세 표현
  chosen_reading: 본문의 ἀνακλίνω 계열을 ‘둘러앉도록’으로 처리해, 당시 만찬의 기대어 먹는 관습을 한국어 독자가 과도한 설명 없이 감지하도록 했습니다.
  alternative_readings:
  - '''기대어 앉도록'''
  - '''자리에 눕도록'''
  rationale: 이 절의 핵심은 왕이 술에 기울며 연회 손님들의 배치를 명하는 장면이지 식사 예법의 세부가 아니므로, 장면 기능을 유지하는 번역이 적절합니다.
  doctrine_reference: 본문 서술의 역사·문학적 의미 보존
- issue: ‘술로 기울자’의 뉘앙스
  chosen_reading: 왕이 판단을 마친 뒤 향락 쪽으로 방향을 튼 점을 드러내는 표현으로 옮겼습니다.
  alternative_readings:
  - '''술을 마시기 시작하자'''
  - '''술에 빠지자'''
  rationale: τραπείς εἰς τὸν πότον은 단순 음주 시작보다 방탕한 연회의 전환을 암시하므로, 서술의 도덕적 긴장감을 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: 본문 서술의 윤리적 함의 보존
