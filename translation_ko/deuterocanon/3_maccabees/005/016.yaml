  text: ὃν ὁ βασιλεὺς λογισάμενος, καὶ τραπεὶς εἰς τὸν πότον, ἐκέλευσεν τοὺς παραγεγονότας ἐπὶ τὴν συμποσίαν ὑπὲρ ἀνακλίνα αὐτοῦ.
