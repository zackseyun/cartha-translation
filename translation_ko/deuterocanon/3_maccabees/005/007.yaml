translation:
  language: ko
  text: 그들은 모두 전능하신 주님, 곧 모든 권세를 다스리시는 분, 그들의 자비로운 하나님이자 아버지께 눈물과 끊이지 않는 외침으로 부르짖으며 간청하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘모든 지배/권세 위에 군림하시는 분’입니다. 그리스어는 통치와 지배를 나타내는 동족어를 겹쳐 하나님의 절대 주권을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν παντοκράτορα κύριον
  english_pob_choice: the almighty Lord
  chosen_korean: 전능하신 주님
  alternatives_korean:
  - 만군의 주님
  - 전능한 주님
  lexicon: SBLGNT/LSJ
  rationale: παντοκράτωρ는 하나님의 절대적 능력과 주권을 가리키므로 ‘전능하신’이 가장 직접적입니다. κύριος는 본문에서 하나님의 호칭이므로 ‘주님’으로 옮겼습니다.
- source_word: πάσης δυνάστην δυναστεύοντα
  english_pob_choice: the sovereign over every dominion
  chosen_korean: 모든 권세를 다스리시는 분
  alternatives_korean:
  - 모든 지배자 위에 군림하시는 분
  - 모든 통치권을 행사하시는 분
  lexicon: LSJ
  rationale: 동족어 반복이 지배의 총체성을 강조하므로 ‘권세’와 ‘다스리시다’로 그 힘을 살렸습니다. 영어의 ‘dominion’보다 한국어에서는 ‘권세’가 더 자연스럽고 본문의 권위적 뉘앙스를 유지합니다.
- source_word: ἐλεήμονα θεὸν αὐτῶν καὶ πατέρα
  english_pob_choice: their merciful God and Father
  chosen_korean: 그들의 자비로운 하나님이자 아버지
  alternatives_korean:
  - 그들의 긍휼이 풍성하신 하나님이자 아버지
  - 그들의 자비하신 하나님과 아버지
  lexicon: SBLGNT/LSJ
  rationale: θεός와 πατήρ를 둘 다 살리기 위해 ‘하나님이자 아버지’로 두 호칭의 결속을 드러냈습니다. ἐλεήμων은 전통적 교회어보다 직설적인 ‘자비로운’이 본문 의미를 분명히 전합니다.
- source_word: δυσκαταπαύστῳ βοῇ
  english_pob_choice: with an unceasing cry
  chosen_korean: 끊이지 않는 외침으로
  alternatives_korean:
  - 그치지 않는 부르짖음으로
  - 쉬지 않는 외침으로
  lexicon: LSJ
  rationale: ‘dys-’ 계열의 어렵게 가라앉지 않는 울부짖음을 자연스러운 한국어로 옮기기 위해 ‘끊이지 않는 외침’으로 처리했습니다. 긴급성과 지속성을 모두 살립니다.
- source_word: ἐπεκαλέσαντο
  english_pob_choice: called upon
  chosen_korean: 부르짖으며
  alternatives_korean:
  - 간구하며
  - 호소하며
  lexicon: LSJ
  rationale: 기도적 소환의 강한 동작을 나타내므로 단순한 ‘호소’보다 더 절박한 ‘부르짖다’가 문맥에 맞습니다.
theological_decisions:
- issue: 하나님을 향한 누적적 호칭을 평탄화하지 않음
  chosen_reading: 전능하신 주님, 곧 모든 권세를 다스리시는 분, 그들의 자비로운 하나님이자 아버지
  alternative_readings:
  - 전능하신 주님이신 모든 권세의 주인, 그들의 자비로운 하나님과 아버지
  - 전능하신 주님, 모든 지배 위에 계신 분, 그들의 자비로운 하나님과 아버지
  rationale: 본문은 기도 속에서 여러 호칭을 겹쳐 하나님의 초월성과 친밀성을 함께 드러냅니다. 이를 한 번에 매끈하게 합치기보다 누적 구조를 유지해 원문의 힘을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; preserve theological tension'
