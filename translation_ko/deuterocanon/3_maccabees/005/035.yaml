  source_fidelity: 현 번역의 ‘왕 중의 왕’은 의미상 가능하지만, 그리스어 βασιλευόντων은 명사 ‘왕들’이 아니라 ‘다스리는 이들’이라는 현재분사입니다. 또한 현 각주는 본문과 동일한 ‘왕 중의 왕’을 ‘또는’으로 제시하여 기능하지 않습니다. 이를 본문에서 참여분사적 표현으로 살리고 관용적 표현을 각주로 옮기는 것이 원문과 영어 POB의 선택을 모두 더 충실히 반영합니다.
  naturalness: ‘그리고’와 합쇼체 서술은 적절합니다. 다만 ‘얻었기 때문입니다’는 앞선 과거 서술과 문체적으로 다소 어울리지 않으며, 완료분사의 선행·인과 관계를 ‘얻었으므로’로 처리하면 더 자연스럽고 명료합니다. ‘왕에게서 전해진 내용’은 원문의 넓은 지시 대상을 ‘말’보다 덜 한정합니다.
