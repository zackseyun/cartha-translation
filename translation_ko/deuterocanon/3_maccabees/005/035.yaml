  to: 그리고 유대인들은 왕에게서 전해진 내용을 듣고, 그분에게서 이 도움을 얻었으므로 드러나신 하나님 곧 주님, 다스리는 이들의 왕을 찬양하였습니다.[a]
  rationale: 원문의 참여분사 βασιλευόντων을 본문에서 ‘다스리는 이들’로 보존하고, 관용적 대안 ‘왕 중의 왕’은 각주로 옮겼습니다. 각주가 본문과 중복되던 구조적 문제를 해결했으며, τετευχότες의 완료 및 인과적 관계를 ‘얻었으므로’로 자연스럽게 반영했습니다. ‘하나님 곧 주님’은 θεὸν Κύριον의 두 칭호와 동격 관계를 유지합니다.
