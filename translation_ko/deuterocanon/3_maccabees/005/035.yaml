  yaml_path: translation/deuterocanon/3_maccabees/005/035.yaml
  text: And the Jews[a], when they heard what came from the king, were praising the manifest God, the Lord, the King of kings, since they had obtained this help from him.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'the King of kings.' The Greek reads literally 'the King of those who rule.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 유대인들은 왕에게서 나온 말을 들었을 때, 드러나신 하나님, 주, 왕 중의 왕을 찬양하였으며, 그에게서 이 도움을 얻었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 관용적으로, ‘왕 중의 왕’. 그리스어는 문자적으로 ‘다스리는 자들/통치하는 자들의 왕’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ τε Ἰουδαῖοι
  english_pob_choice: the Jews
  chosen_korean: 유대인들
  alternatives_korean:
  - 유다 사람들
  - 유대 사람들
  lexicon: LSJ
  rationale: 그리스어 οἱ Ἰουδαῖοι는 민족 집단을 가리키므로, 현대 표준어에서 자연스럽고 중립적인 ‘유대인들’로 옮겼습니다.
- source_word: τὰ παρὰ τοῦ βασιλέως
  english_pob_choice: what came from the king
  chosen_korean: 왕에게서 나온 말
  alternatives_korean:
  - 왕에게서 온 것
  - 왕의 말
  - 왕의 칙령
  lexicon: LSJ
  rationale: 문구는 왕에게서 비롯된 전달 내용이나 사안을 넓게 가리키므로, formal decree로 한정하지 않으면서도 문맥상 자연스러운 ‘말’로 옮겼습니다.
- source_word: ἐπιφανῆ θεὸν Κύριον
  english_pob_choice: the manifest God, the Lord
  chosen_korean: 드러나신 하나님, 주
  alternatives_korean:
  - 나타나신 하나님, 주
  - 현현하신 하나님, 주
  lexicon: LSJ
  rationale: ἐπιφανῆ는 하나님이 구원 행위에서 분명히 드러나셨다는 뜻을 살리기 위해 ‘드러나신’으로 옮기고, κύριος는 본문 관례에 따라 ‘주’로 유지했습니다.
- source_word: Βασιλέα τῶν βασιλευόντων
  english_pob_choice: the King of those who rule
  chosen_korean: 왕 중의 왕
  alternatives_korean:
  - 다스리는 이들의 왕
  - 통치자들 중의 왕
  lexicon: LSJ
  rationale: 그리스어는 문자적으로 ‘다스리는 자들/통치하는 자들’에 해당하지만, 한국어에서는 관용적으로도 널리 통하는 ‘왕 중의 왕’이 동일한 위계적 의미를 가장 압축적으로 전달합니다.
- source_word: ᾔνουν
  english_pob_choice: were praising
  chosen_korean: 찬양하였으며
  alternatives_korean:
  - 찬양하고 있었습니다
  - 계속 찬양하였습니다
  lexicon: LSJ
  rationale: 미완료 과거의 지속성을 살리되, 한국어 서술 문맥에서는 ‘찬양하였으며’가 가장 자연스럽고 유려합니다.
- source_word: τῆσδε τῆς βοηθείας
  english_pob_choice: this help
  chosen_korean: 이 도움
  alternatives_korean:
  - 이 원조
  - 이 구원
  - 이 도움의 손길
  lexicon: LSJ
  rationale: βοήθεια는 기본적으로 도움·원조를 뜻하므로, 해석을 과도하게 덧씌우지 않는 ‘도움’을 채택했습니다.
- source_word: τετευχότες
  english_pob_choice: they had obtained
  chosen_korean: 얻었기 때문입니다
  alternatives_korean:
  - 받았기 때문입니다
  - 획득했기 때문입니다
  lexicon: LSJ
  rationale: 완료 분사는 이미 받은 은혜의 결과 상태를 나타내므로, 한국어에서는 인과를 분명히 하는 ‘얻었기 때문입니다’로 자연스럽게 풀었습니다.
theological_decisions:
- issue: Βασιλέα τῶν βασιλευόντων의 제목 번역
  chosen_reading: 왕 중의 왕
  alternative_readings:
  - 다스리는 이들의 왕
  - 통치자들 중의 왕
  rationale: 본문의 참여분사적 표현을 직역하면 다소 생경하지만, 한국어 독자는 이 칭호를 위계적 왕권의 극대화로 이해해야 하므로, 의미를 보존하는 관용적 제목을 사용했습니다.
  doctrine_reference: Translation philosophy §§1, 5
