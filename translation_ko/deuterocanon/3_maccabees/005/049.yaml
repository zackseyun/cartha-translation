source:
  edition: lxx-swete-1909
  text: ὑστάτην βίου ῥοπὴν αὐτοῖς ἐκείνην δόξαντες εἶναι τὸ τέλος τῆς ἀθλιωτάτης προσδοκίας, εἰς οἶκτον καὶ γόους τραπέντες, κατεφίλουν ἀλλήλους, περιπλεκό- μενοι τοῖς συγγενέσιν, ἐπὶ τοὺς τραχήλους ἐπιπίπτοντες, γονεῖς παισὶν καὶ μητέρες νεάνισιν· ἕτεραι δὲ νεογνὰ πρὸς μαστοὺς ἔχουσαι βρέφη τελευταῖον ἕλκοντα γάλα.
  language: Greek
  pages:
  - 745
  confidence: high
  validation: agree
base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/049.yaml
  text: Considering that moment to be for them the final turn of life[a], the end of their most miserable expectation, they turned to pity and lamentation and kept kissing one another, embracing their relatives, falling upon their necks—parents upon children and mothers upon young daughters; and others, holding infant babies to their breasts[c][b], were drawing out their last milk.
  footnotes:
  - marker: a
    text: Or 'the end of their most miserable waiting'; the Greek προσδοκία can denote expectation, suspense, or waiting for what is about to happen.
    reason: lexical_alternative
  - marker: b
    text: Literally 'falling upon the necks,' a Greek idiom for throwing oneself into another's embrace in grief or affection.
    reason: cultural_note
  - marker: c
    text: Or 'young women'; the context of family pairings favors 'young daughters.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그 순간을 자기들에게 생명의 마지막 전환점, 곧 가장 비참한 기대의 끝[a]으로 여기고, 연민과 통곡에 빠져 서로 입맞추며 친족들을 끌어안고 서로의 목에 매달렸습니다. 부모들은 자녀들에게, 어머니들은 어린 딸들에게 그렇게 하였습니다. 또 다른 이들은 갓난아기들을 젖가슴에 안고 있었는데, 그 아기들은 마지막으로 젖을 빨고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가장 비참한 기다림의 끝’. προσδοκία는 기대, 기다림, 다가올 일을 앞둔 긴장을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑστάτην βίου ῥοπὴν
  english_pob_choice: the final turn of life
  chosen_korean: 생명의 마지막 전환점
  alternatives_korean:
  - 생명의 마지막 순간
  - 생명의 끝자락
  - 삶의 결정적 기울어짐
  lexicon: LSJ
  rationale: ῥοπή의 비유적 ‘전환/기울어짐’과 ὑστάτην의 최종성을 함께 살려, 단순한 시간표현보다 결정적 국면을 드러내도록 옮겼습니다.
- source_word: τὸ τέλος τῆς ἀθλιωτάτης προσδοκίας
  english_pob_choice: the end of their most miserable expectation
  chosen_korean: 가장 비참한 기대의 끝
  alternatives_korean:
  - 가장 비참한 기다림의 끝
  - 가장 비참한 불안의 종결
  - 가장 비참한 예상의 끝
  lexicon: LSJ
  rationale: προσδοκία는 ‘기대/기다림/예상’의 폭이 있으나, 여기서는 죽음을 앞둔 절망적 기대를 가리키므로 ‘기대’로 두되, ἀθλιωτάτης의 강한 비참함을 반영했습니다.
- source_word: εἰς οἶκτον καὶ γόους τραπέντες
  english_pob_choice: they turned to pity and lamentation
  chosen_korean: 불쌍함과 통곡으로 돌아서서
  alternatives_korean:
  - 긍휼과 통곡으로 돌이켜
  - 연민과 곡성으로 돌아서서
  - 불쌍한 마음과 슬픔의 울음으로 돌아서서
  lexicon: LSJ
  rationale: τραπέντες의 ‘돌아서다/향하다’의 동작성을 살리면서, οἶκτος와 γόοι의 정서적 대비를 한국어로 자연스럽게 재현했습니다.
- source_word: ἐπὶ τοὺς τραχήλους ἐπιπίπτοντες
  english_pob_choice: falling upon their necks
  chosen_korean: 목에 엎드리며
  alternatives_korean:
  - 목에 달려들며
  - 서로의 목에 안기며
  - 목을 끌어안으며
  lexicon: LSJ
  rationale: 이 표현은 그리스어 관용구로 격정적 포옹을 뜻하므로, 직역을 유지하되 한국어에서 자연스럽고 장면이 선명한 ‘목에 엎드리며’로 처리했습니다.
- source_word: νεάνισιν
  english_pob_choice: young daughters
  chosen_korean: 어린 딸들에게
  alternatives_korean:
  - 젊은 여자들에게
  - 어린 처녀들에게
  - 소녀들에게
  lexicon: LSJ
  rationale: 문맥이 ‘부모는 자녀에게, 어머니들은 …’의 가족 짝짓기이므로, 관계를 분명히 드러내는 ‘어린 딸들’이 가장 적절합니다.
- source_word: τελευταῖον ἕλκοντα γάλα
  english_pob_choice: were drawing out their last milk
  chosen_korean: 마지막 젖을 짜내고 있었습니다
  alternatives_korean:
  - 마지막 젖을 빨고 있었습니다
  - 마지막 젖을 뽑아내고 있었습니다
  - 마지막 젖을 들이키고 있었습니다
  lexicon: LSJ
  rationale: ἕλκω는 여기서 젖을 ‘당겨 짜다/빨다’의 의미를 가지므로, 수유의 마지막 행위를 드러내는 한국어로 옮겼습니다. 아기 쪽 주체를 살리되 자연스럽게 표현했습니다.
