  text: ὑστάτην βίου ῥοπὴν αὐτοῖς ἐκείνην δόξαντες εἶναι τὸ τέλος τῆς ἀθλιωτάτης προσδοκίας, εἰς οἶκτον καὶ γόους τραπέντες, κατεφίλουν ἀλλήλους, περιπλεκό- μενοι τοῖς συγγενέσιν, ἐπὶ τοὺς τραχήλους ἐπιπίπτοντες, γονεῖς παισὶν καὶ μητέρες νεάνισιν· ἕτεραι δὲ νεογνὰ πρὸς μαστοὺς ἔχουσαι βρέφη τελευταῖον ἕλκοντα γάλα.
