- source_word: πρηνεῖς ὁμοθυμαδὸν ῥίψαντες ἑαυτούς
  english_pob_choice: they all together threw themselves down face-first
  chosen_korean: 모두 한마음으로 엎드러져 얼굴을 땅에 대고 쓰러졌으며
