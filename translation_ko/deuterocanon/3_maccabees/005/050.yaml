- source_word: τὰ νήπια χωρίσαντες τῶν μαστῶν
  english_pob_choice: separated the infants from the breasts
  chosen_korean: 젖가슴에서 갓난아이들을 떼어 놓았습니다
  alternatives_korean:
  - 젖에서 아이들을 떼어 놓았습니다
  - 젖먹이들을 가슴에서 분리했습니다
  lexicon: LSJ
  rationale: 직역은 ‘젖가슴들로부터 분리하다’이지만, 한국어에서는 수유 맥락을 드러내는 ‘젖가슴’과 ‘떼어 놓다’로 자연스럽고도 원문에 충실하게 표현했습니다.
