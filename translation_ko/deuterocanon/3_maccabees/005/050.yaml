- from: 그런데도 그들은 자기들에게 전에 하늘에서 임한 도움도 보았으므로, 모두 한마음으로 엎드러져 얼굴을 땅에 대고 쓰러졌으며, 젖가슴에서 갓난아이들을 떼어 놓았습니다.[a][b]
  to: 그런데도 그들은 또한 자신들에게 전에 하늘에서 온 도움[a]을 깨닫고, 모두 한마음으로 몸을 던져 얼굴을 땅에 대고 엎드렸으며, 젖먹이들을 젖가슴[b]에서 떼어 놓았습니다.
  rationale: 강한 전환과 καί의 첨가를 ‘그런데도 … 또한’으로 살리고, 이전에 경험한 천상적 도움을 깨닫는 참여구문의 뜻을 자연스럽게 반영했습니다. 엎드리는 행동은 원문의 강도와 자세를 유지하되 한국어의 불필요한 동작 중복을 제거했습니다. 각주 표지는 각각 ‘도움’과 ‘젖가슴’에 직접 붙여 참조 대상을 명확히 했습니다.
