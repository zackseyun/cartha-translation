base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/050.yaml
  text: Yet nevertheless[a], when they also saw the help from heaven that had come to them before, they all together threw themselves down face-first, and separated the infants from the breasts[b],
  footnotes:
  - marker: a
    text: Or 'the previous acts of help on their behalf'; the Greek refers to earlier assistance or deliverances experienced by them.
    reason: lexical_alternative
  - marker: b
    text: Literally 'separated the infants from the breasts,' that is, from nursing at their mothers’ breasts.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데도 그들은 자기들에게 전에 하늘에서 임한 도움도 보았으므로, 모두 한마음으로 엎드러져 얼굴을 땅에 대고 쓰러졌으며, 젖가슴에서 갓난아이들을 떼어 놓았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들 앞에 전에 일어난 도움’이 가능합니다. 헬라어는 이전에 그들이 경험한 도움이나 구원을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘젖가슴에서 분리한’입니다. 즉 어머니의 젖가슴에서 젖먹이를 떼어 놓았다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴν δὲ ἀλλὰ καὶ
  english_pob_choice: Yet nevertheless, when they also
  chosen_korean: 그런데도
  alternatives_korean:
  - 그러나 또한
  - 하지만 그럼에도
  lexicon: LSJ
  rationale: 강한 전환과 강조를 함께 담는 복합 접속사이므로, 한국어에서는 군더더기 없이 반전의 힘을 살리는 표현으로 옮겼습니다.
- source_word: τὰς ἔμπροσθεν αὐτῶν γεγενημένας ἀντιλήψεις
  english_pob_choice: the help ... that had come to them before
  chosen_korean: 자기들에게 전에 ... 임한 도움
  alternatives_korean:
  - 그들 앞에 전에 일어난 도움
  - 이전에 그들에게 베풀어진 구원
  lexicon: LSJ
  rationale: ἀντιλήψεις는 단순한 추상적 ‘도움’보다 실제로 임한 구원적 개입을 가리킬 수 있으므로, ‘임한 도움’으로 사건성을 살렸습니다.
- source_word: πρηνεῖς ὁμοθυμαδὸν ῥίψαντες ἑαυτούς
  english_pob_choice: they all together threw themselves down face-first
  chosen_korean: 모두 한마음으로 엎드러져 얼굴을 땅에 대고 쓰러졌으며
  alternatives_korean:
  - 모두 함께 얼굴을 땅에 대고 엎드렸으며
  - 한결같이 엎드려졌다
  lexicon: LSJ
  rationale: πρηνεῖς와 ῥίψαντες ἑαυτούς의 강한 신체적 동작을 분리해, ‘엎드러져’와 ‘얼굴을 땅에 대고 쓰러졌으며’로 중첩된 동작감을 살렸습니다.
- source_word: τὰ νήπια χωρίσαντες τῶν μαστῶν
  english_pob_choice: separated the infants from the breasts
  chosen_korean: 젖가슴에서 갓난아이들을 떼어 놓았습니다
  alternatives_korean:
  - 젖에서 아이들을 떼어 놓았습니다
  - 젖먹이들을 가슴에서 분리했습니다
  lexicon: LSJ
  rationale: 직역은 ‘젖가슴들로부터 분리하다’이지만, 한국어에서는 수유 맥락을 드러내는 ‘젖가슴’과 ‘떼어 놓다’로 자연스럽고도 원문에 충실하게 표현했습니다.
theological_decisions:
- issue: 하늘의 도움을 명시적 신적 개입으로 번역할지 여부
  chosen_reading: 하늘에서 임한 도움
  alternative_readings:
  - 하나님에게서 온 도움
  - 주님께서 주신 도움
  rationale: 본문은 ἐξ οὐρανοῦ라고만 하므로, 신적 주체를 덧붙이지 않고 유대교적 관용구를 그대로 살렸습니다.
  doctrine_reference: '번역 원칙: 원문에 없는 신적 명시화 지양'
