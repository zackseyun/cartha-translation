translation:
  language: ko
  text: 그런데도 그들은 또한 자신들에게 전에 하늘에서 온 도움[a]을 깨닫고, 모두 한마음으로 몸을 던져 얼굴을 땅에 대고 엎드렸으며, 젖먹이들을 젖가슴[b]에서 떼어 놓았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이전에 그들에게 일어난 도움들’. 헬라어는 그들이 앞서 경험한 도움이나 구원들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘젖가슴들에서 분리하여’입니다. 곧 어머니의 젖가슴에서 수유 중인 젖먹이들을 떼어 놓았다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
