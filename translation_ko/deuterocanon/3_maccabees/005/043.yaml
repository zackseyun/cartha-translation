base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/043.yaml
  text: But if he should campaign against Judea[a], he would quickly make it level with fire and spear, and after burning their sanctuary—untrodden by us[b]—with fire, he would put a stop forever to those who perform sacrifice there.
  footnotes:
  - marker: a
    text: Greek ἄβατον literally means 'not to be trodden' or 'not to be entered'; alternatively, 'their temple, forbidden to us.'
    reason: lexical_alternative
  - marker: b
    text: The Greek for 'after burning' is slightly uncertain in Swete's transcription, but the sense of setting the sanctuary on fire is clear.
    reason: textual_variant
translation:
  language: ko
  text: 그러나 그가 유대아를 상대로 원정한다면, 그는 곧 불과 창으로 그것을 평지로 만들고, 우리에게는 들어갈 수 없는 그들의 성소를 재빨리 불태운[a][b] 뒤, 거기서 제사를 드리는 이들이 영원히 제사를 드리지 못하게 할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἄβατον은 문자적으로 ‘밟을 수 없음’ 또는 ‘들어갈 수 없음’을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘불태운’으로 옮긴 그리스어 분사의 전승 표기에는 일부 불확실성이 있으나, 성소를 불태운다는 뜻은 분명합니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιστρατεύσαντα
  english_pob_choice: should campaign against
  chosen_korean: 원정하면
  alternatives_korean:
  - 쳐들어가면
  - 전쟁을 일으키면
  - 군사 행동을 하면
  lexicon: LSJ
  rationale: 군사적 적대 행위를 나타내되, 현대 한국어에서 자연스럽고 과도하게 구체화하지 않는 표현으로 옮겼습니다.
- source_word: ἰσόπεδον πυρὶ καὶ δόρατι στήσεσθαι
  english_pob_choice: make it level with fire and spear
  chosen_korean: 불과 창으로 평지처럼 만들 것이며
  alternatives_korean:
  - 불과 창으로 평평하게 만들 것이며
  - 불과 창으로 완전히 허물 것이며
  lexicon: LSJ
  rationale: ἰσόπεδον과 στήσεσθαι의 평평하게 만듦을 한국어의 관용적 이미지인 '평지처럼'으로 살려, 파괴의 강도를 보존했습니다.
- source_word: ἄβατον ἡμῖν αὐτῶν ναόν
  english_pob_choice: their sanctuary—untrodden by us
  chosen_korean: 우리에게는 출입할 수 없는 그들의 성소
  alternatives_korean:
  - 우리로서는 밟을 수 없는 그들의 성소
  - 우리에게는 들어갈 수 없는 그들의 성소
  lexicon: LSJ
  rationale: ἄβατον의 문자적 '밟지 못함/들어갈 수 없음'을, 한국어에서 자연스러운 금지·비접근 의미로 옮기되 '우리에게는'을 넣어 첫인칭 외부자 시점을 드러냈습니다.
- source_word: τῶν συντελούντων ἐκεῖ θυσίαν
  english_pob_choice: those who perform sacrifice there
  chosen_korean: 거기서 제사를 드리는 자들
  alternatives_korean:
  - 거기서 희생 제사를 드리는 자들
  - 거기서 제사 행위를 하는 자들
  lexicon: LSJ
  rationale: συντελέω의 '행하다/마치다'를 한국어 성경 문체에 맞는 '제사를 드리다'로 옮기되, 행위의 주체를 분명히 했습니다.
- source_word: εἰς τὸν ἅπαντα χρόνον καταστήσειν
  english_pob_choice: put a stop forever
  chosen_korean: 영원히 그치게 할 것입니다
  alternatives_korean:
  - 영원히 끝내게 할 것입니다
  - 영원히 중단시키게 할 것입니다
  lexicon: LSJ
  rationale: εἰς τὸν ἅπαντα χρόνον의 영구성을 분명히 하면서, 동작의 결과를 간결하게 표현했습니다.
theological_decisions:
- issue: ἄβατον의 뉘앙스와 성소의 접근 금지
  chosen_reading: 성소는 단순히 건물 의미가 아니라, 외부자에게 출입이 금지된 거룩한 공간으로 제시했습니다.
  alternative_readings:
  - 성전
  - 성역
  rationale: 문맥상 ἄβατον은 물리적 출입 불가와 거룩함을 함께 드러내므로, '출입할 수 없는'을 병기해 의미를 보존했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: ‘제사를 드리는 자들’의 지속적 종결
  chosen_reading: 영원한 중단을 뜻하는 καταστήσειν을 '영원히 그치게 할 것입니다'로 옮겼습니다.
  alternative_readings:
  - 영원히 중단시키게 할 것입니다
  - 영원히 없애게 할 것입니다
  rationale: 본문은 단순한 방해가 아니라 제사 행위의 영구적 종결을 말하므로, 종결성을 분명히 해야 합니다.
  doctrine_reference: Translation philosophy §1, §5
