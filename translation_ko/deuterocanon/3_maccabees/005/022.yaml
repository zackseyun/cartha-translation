  yaml_path: translation/deuterocanon/3_maccabees/005/022.yaml
  text: And they did not spend the time of the night so much in sleep as in devising every kind of mockery for those who seemed miserable[a].
  footnotes:
  - marker: a
    text: Or 'those pitiable wretches,' with the sense that the victims were viewed as miserable objects of scorn.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 밤 시간을 잠자는 데 보낸 것보다, 비참해 보이는 사람들을 조롱할 온갖 일을 궁리하는 데 더 많이 보냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가련한 자들.’ 이 표현은 그들이 비참하게 보이거나 그렇게 여겨진 사람들이라는 뉘앙스를 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεχρίζαντο
  english_pob_choice: spend
  chosen_korean: 보냈습니다
  alternatives_korean:
  - 지냈습니다
  - 소모했습니다
  - 허비했습니다
  lexicon: LSJ
  rationale: 밤의 시간을 어떻게 사용했는지를 나타내므로, 한국어에서는 자연스럽게 ‘보냈습니다’로 옮겨 시간의 사용 양태를 살렸습니다.
- source_word: οὐχ οὕτως ... ὡς
  english_pob_choice: not so much ... as
  chosen_korean: 그렇게 ... 않고, 오히려 ...
  alternatives_korean:
  - '...하기보다 ...'
  - '...만큼 ...'
  - '...가 아니라 ...'
  lexicon: Greek grammar
  rationale: 두 행위를 대비하는 상관 구조이므로, ‘그렇게 ... 않고, 오히려 ...’로 비교와 대비를 함께 드러냈습니다.
- source_word: παντοίως μηχανᾶσθαι
  english_pob_choice: devising every kind of
  chosen_korean: 모든 종류의 ... 꾸미는 데에
  alternatives_korean:
  - 온갖 ...를 꾸미는 데에
  - 여러 가지 ...를 꾀하는 데에
  - 모든 방식의 ...를 도모하는 데에
  lexicon: LSJ
  rationale: παντοίως의 포괄성과 μηχανᾶσθαι의 의도적 꾸밈/궁리를 함께 살려, 조롱의 ‘모든 종류’를 꾸민다는 뜻을 분명히 했습니다.
- source_word: τοῖς ταλαιπώροις δοκοῦσιν
  english_pob_choice: those who seemed miserable
  chosen_korean: 그 비참해 보이는 사람들에게
  alternatives_korean:
  - 그 불쌍해 보이는 사람들에게
  - 그 비참한 자들에게
  - 그들이 비참하다고 여긴 사람들에게
  lexicon: LSJ
  rationale: δοκοῦσιν은 관찰자들의 인상을 반영하므로 ‘비참해 보이는’으로 옮겨, 대상이 그렇게 ‘보였다’는 관점을 유지했습니다.
theological_decisions:
- issue: ἐμπαιγμούς의 성격
  chosen_reading: ‘조롱’으로 옮겨, 단순한 농담이 아니라 적대적이고 모욕적인 희화화임을 드러냈습니다.
  alternative_readings:
  - 희롱
  - 비웃음
  - 조롱거리
  rationale: 문맥상 고통받는 이들을 대상으로 한 적대적 조롱이므로, 중립적 표현보다 강한 어감을 가진 ‘조롱’이 원문에 더 가깝습니다.
  doctrine_reference: 수난 서사에서의 가학적 조롱에 대한 일반적 성서 이해
- issue: τοῖς ταλαιπώροις의 방향
  chosen_reading: 대상은 ‘비참해 보이는 사람들’로 유지하여, 화자 측의 인식과 대상의 실제 상태를 구분했습니다.
  alternative_readings:
  - 비참한 사람들
  - 불쌍한 사람들
  - 가련한 사람들
  rationale: δοκοῦσιν이 붙어 있으므로, 단정적 평정보다 관찰된 인상을 반영하는 번역이 원문 긴장을 더 잘 보존합니다.
  doctrine_reference: 서술자 시점과 인물 시점의 구분
