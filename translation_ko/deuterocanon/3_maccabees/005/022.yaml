  naturalness: ‘밤의 시간을 잠자는 데에 그렇게 보내지 않고’ 및 ‘조롱을 ... 사람들에게 꾸미는’은 현대 표준어 문장으로 다소 어색합니다. 비교 구문과 조롱의 대상을 명료하게 재구성하는 편이 자연스럽습니다.
  terminology: ἐμπαιγμούς는 ‘조롱’, παντοίως는 ‘온갖’, μηχανᾶσθαι는 ‘궁리하다/꾸미다’로 옮길 수 있습니다. 여기서는 ‘조롱할 온갖 일을 궁리하다’가 한국어 어법과 원문의 의도성을 함께 살립니다. δοκοῦσιν의 관점적 뉘앙스는 ‘비참해 보이는’으로 유지합니다.
