  text: And when the king had spoken, all who were present gladly agreed together with joy, and each departed to his own house.
translation:
  language: ko
  text: 왕이 말하자, 거기 있던 모든 사람이 기쁘게 한마음으로 동의하였고, 각자 자기 집으로 돌아갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἀσμένως는 ‘기쁘게’보다 ‘흔쾌히/기꺼이’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ὁμοῦ συναινέσαντες는 문자적으로 ‘함께 동의한’입니다.
    reason: source_note
lexical_decisions:
- source_word: εἰπόντος δὲ τοῦ βασιλέως
  english_pob_choice: And when the king had spoken
  chosen_korean: 왕이 말하자
  alternatives_korean:
  - 왕이 말을 마치자
  - 왕이 말했을 때
  lexicon: βασιλεύς → 왕; λέγω(부정과거 분사) → 말하다
  rationale: 원문은 왕의 발화가 끝난 뒤의 결과를 이끄는 시간 관계를 나타내므로, 한국어에서는 자연스러운 종속절로 간결하게 옮겼습니다.
- source_word: ἀσμένως πάντες
  english_pob_choice: all who were present gladly
  chosen_korean: 거기 있던 모든 사람이 기쁘게
  alternatives_korean:
  - 모두가 흔쾌히
  - 거기 있던 사람들이 즐겁게
  lexicon: ἀσμένως → 기쁘게/흔쾌히
  rationale: ἀσμένως는 단순한 감정 표현보다 ‘기꺼이, 반가이’에 가까워서, 군중의 호응을 드러내는 ‘기쁘게’를 택했습니다.
- source_word: ὁμοῦ συναινέσαντες
  english_pob_choice: agreed together
  chosen_korean: 한마음으로 동의하였고
  alternatives_korean:
  - 함께 동의하였고
  - 한뜻으로 찬성하였고
  lexicon: συναινέω → 동의하다/찬성하다; ὁμοῦ → 함께, 한데
  rationale: POB의 ‘agreed’는 단순한 표면적 찬성보다 공동의 합의를 뜻하므로, ‘한마음으로 동의하다’가 원문의 집단적 합의 뉘앙스를 잘 살립니다.
- source_word: εἰς τὸν ἴδιον οἶκον ἕκαστος ἀνέλυσε
  english_pob_choice: and each departed to his own house
  chosen_korean: 각자 자기 집으로 돌아갔습니다
  alternatives_korean:
  - 각자 자신의 집으로 물러갔습니다
  - 각 사람이 자기 집으로 갔습니다
  lexicon: ἀναλύω → 떠나다, 돌아가다; οἶκος → 집
  rationale: ἀναλύω는 ‘떠나다’와 ‘되돌아가다’ 모두 가능하지만, 문맥상 모임이 끝나고 각자 흩어지는 장면이므로 한국어에서는 자연스럽게 ‘돌아가다’로 옮겼습니다.
theological_decisions:
- issue: 왕의 발화 뒤에 나타나는 공동 동의와 해산의 서술 톤
  chosen_reading: 중립적 역사 서술로 처리하고, 왕권에 대한 찬양이나 신학적 확대는 덧붙이지 않았습니다.
  alternative_readings:
  - 왕의 말에 대한 적극적 승인으로 강조
  - 권위에 대한 복종으로 신학화
  rationale: 본문은 사건 전개를 단순하게 보고할 뿐이므로, 의미를 넘어서는 신학적 해석을 최소화하는 것이 원문에 충실합니다.
  doctrine_reference: 내러티브 절제 원칙
