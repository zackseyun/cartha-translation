revisions:
- from: 그리고 이미 여섯째 시각의 거의 중간쯤 되었을 때, 호령들을 맡은 사람이 모여 있는 자들을 보고 왕에게 다가가 신호를 보냈습니다.[a]
  to: 그리고 여섯째 시각이 이미 거의 중간에 이르렀을 때, 소집을 맡은 사람이 소집된 이들이 한데 모여 있는 것을 보고 왕에게 다가가 신호를 보냈습니다.[a]
  rationale: ‘여섯째 시각’이라는 고대 시간 표현을 유지하면서 ἤδη와 σχεδόν의 ‘이미’와 ‘거의’를 반영했습니다. κλήσεις와 κλητούς의 연결은 ‘소집’과 ‘소집된 이들’로 살렸고, ἀθρόους는 ‘한데 모여’로 옮겼습니다. 각주는 본문의 직역을 중복하지 않고 고대 시간 계산만 간결하게 설명하도록 고쳤습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:53:23Z'
review_pass:
  verdict: revise
  source_fidelity: 시간 표현은 대체로 충실하지만, κλήσεις를 ‘호령들’로 옮긴 것은 행정적 소집·호출의 뜻을 잘못 전달합니다. 또한 τοὺς κλητούς는 단순히 ‘모여 있는 자들’이 아니라 이미 소집된 사람들임을 나타내므로 이를 밝혀야 합니다.
  naturalness: ‘호령들을 맡은 사람’은 현대 표준 한국어에서 부자연스럽고 뜻도 불명확합니다. ‘소집을 맡은 사람’과 ‘소집된 이들이 한데 모여 있는 것을 보고’가 현대적이면서도 원문의 관계를 자연스럽게 드러냅니다.
  terminology: κλήσεις/κλητούς의 어휘 연결을 ‘소집’/‘소집된 이들’로 일관되게 번역했습니다. ἀθρόους의 집합성을 ‘한데 모여’로 반영했으며, ἔνευσε는 구체적 몸짓을 단정하지 않는 ‘신호를 보냈습니다’로 유지했습니다.
  issues:
  - severity: medium
    issue: ‘호령들’을 맡은 사람
    rationale: κλήσεις는 이 문맥에서 권위 있는 호출 또는 소집을 뜻하며, ‘호령’은 명령을 크게 외치는 행위로 이해되어 원문의 행정적 소집 의미를 왜곡합니다.
  - severity: medium
    issue: ‘모여 있는 자들’
    rationale: τοὺς κλητούς는 ‘소집된 사람들’을 뜻합니다. 현 번역은 이 핵심 수식어를 빠뜨리고 ἀθρόους의 집합성도 충분히 드러내지 못합니다.
  - severity: low
    issue: 각주의 ‘곧’
    rationale: 본문이 이미 해당 표현을 직역하고 있으므로 ‘곧’으로 다른 번역을 제시하는 형식은 부정확합니다. 시간 계산에 관한 문화적 설명만 제시하는 편이 명료합니다.
  revised_text: 그리고 여섯째 시각이 이미 거의 중간에 이르렀을 때, 소집을 맡은 사람이 소집된 이들이 한데 모여 있는 것을 보고 왕에게 다가가 신호를 보냈습니다.[a]
