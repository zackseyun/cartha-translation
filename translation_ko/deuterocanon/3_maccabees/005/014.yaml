base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/014.yaml
  text: And when it was already nearly the middle of the sixth hour[a], the man appointed over the summonses, seeing those who had been summoned assembled in a mass, came up and signaled to the king.
  footnotes:
  - marker: a
    text: Or, more literally, 'about the middle of the sixth hour.' In ancient reckoning this is roughly around midday.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 여섯째 시각이 이미 거의 중간에 이르렀을 때, 소집을 맡은 사람이 소집된 이들이 한데 모여 있는 것을 보고 왕에게 다가가 신호를 보냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여섯째 시각은 해 뜰 때부터 세던 고대의 시간 단위입니다. 그 중간은 대략 정오 무렵입니다.
    reason: cultural_note
lexical_decisions:
- source_word: μεσούσης ... ἑκάτης ὥρας σχεδόν
  english_pob_choice: when the sixth hour was already nearly halfway through
  chosen_korean: 이미 여섯째 시각의 거의 중간쯤 되었을 때
  alternatives_korean:
  - 여섯째 시각이 이미 거의 한가운데에 이르렀을 때
  - 여섯째 시각이 거의 절반쯤 지났을 때
  - 이미 거의 정오 무렵이었을 때
  lexicon: LSJ
  rationale: ὥρας의 ‘가운데’라는 시간표현과 ἤδη, σχεδόν의 ‘이미, 거의’라는 강도를 함께 살렸습니다. 현대 시각으로 바꾸기보다 고대 시간표현을 유지했습니다.
- source_word: ὁ πρὸς ταῖς κλήσεσιν τεταγμένος
  english_pob_choice: the man appointed over the summonses
  chosen_korean: 호령들을 맡은 사람
  alternatives_korean:
  - 호령을 담당한 사람
  - 소집들을 맡은 사람
  - 호명들을 맡은 관리
  lexicon: LSJ
  rationale: τεταγμένος는 ‘임명된/맡은’ 뜻이고, κλήσεις는 여기서 사람들을 불러 모으는 행정적 호령으로 읽는 것이 자연스럽습니다. ‘호령들’은 전반의 소집 상황을 살리면서도 과도하게 제도화하지 않습니다.
- source_word: ἀθρόους τοὺς κλητούς
  english_pob_choice: those who had been summoned assembled in a mass
  chosen_korean: 모여 있는 자들
  alternatives_korean:
  - 한데 모여 있는 사람들
  - 떼지어 모인 자들
  - 소집된 자들이 한데 모인 것
  lexicon: LSJ
  rationale: ἀθρόους는 ‘한데 모여 덩어리처럼’이라는 군집의 느낌이 있어, 지나치게 장황하지 않으면서도 집합된 모습을 드러내는 표현을 택했습니다.
- source_word: ἔνευσε
  english_pob_choice: signaled
  chosen_korean: 신호를 보냈습니다
  alternatives_korean:
  - 손짓했습니다
  - 고개를 끄덕였습니다
  - 신호했습니다
  lexicon: LSJ
  rationale: ἔνευσε는 특정 동작을 단정하기보다 ‘표시를 주다/신호하다’의 의미가 핵심이므로, 한국어에서도 동작을 특정하지 않는 표현을 사용했습니다.
theological_decisions:
- issue: 시간 표현을 고대식으로 유지할지 현대식으로 바꿀지
  chosen_reading: ‘여섯째 시각의 거의 중간쯤’으로 유지했습니다.
  alternative_readings:
  - ‘거의 정오 무렵’
  - ‘여섯째 시각이 거의 절반쯤 지났을 때’
  rationale: 본문의 시각 계산법을 그대로 보여 주어 독자가 고대 서술의 시간 감각을 확인할 수 있게 했습니다. 이는 주석의 ‘대략 정오’ 설명으로 보완됩니다.
  doctrine_reference: 성경 번역의 역사·문화적 맥락 보존
