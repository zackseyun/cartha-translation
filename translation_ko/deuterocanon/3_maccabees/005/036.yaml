  yaml_path: translation/deuterocanon/3_maccabees/005/036.yaml
  text: Then the king[a], having arranged the whole banquet according to the same rules, urged them to turn to rejoicing.
  footnotes:
  - marker: a
    text: Or 'the same laws.' The Greek νόμοι can denote laws, rules, or customary regulations; here the banquet setting favors a procedural sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 왕은 같은 규례에 따라 온 잔치를 마련한 뒤, 그들이 즐거움으로 돌이키도록 권하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘같은 법들에 따라’로도 옮길 수 있습니다. 그리스어 νόμοι는 법, 규례, 관례를 뜻할 수 있으며, 여기서는 잔치의 절차를 가리키는 뜻이 더 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ δὲ τοὺς αὐτοὺς νόμους
  english_pob_choice: according to the same rules
  chosen_korean: 같은 규례에 따라
  alternatives_korean:
  - 같은 법들에 따라
  - 같은 규칙에 따라
  - 같은 관례에 따라
  lexicon: LSJ
  rationale: νόμοι는 여기서 법 자체보다 잔치 진행을 규정하는 규례·절차의 뜻이 자연스럽기 때문에, POB의 'rules'에 맞추어 '규례'로 옮겼습니다.
- source_word: συστησάμενος πᾶν τὸ συμπόσιον
  english_pob_choice: having arranged the whole banquet
  chosen_korean: 온 잔치를 마련한 뒤
  alternatives_korean:
  - 잔치 전체를 준비한 뒤
  - 온 연회를 정돈한 뒤
  - 온 잔치를 조직한 뒤
  lexicon: LSJ
  rationale: συστησάμενος는 무엇인가를 갖추어 세우거나 준비하는 뉘앙스가 있어, 잔치 맥락에서는 '마련하다'가 가장 자연스럽고 의미도 잘 살립니다.
- source_word: εἰς εὐφροσύνην τραπῆναι
  english_pob_choice: to turn to rejoicing
  chosen_korean: 즐거움으로 돌이키도록
  alternatives_korean:
  - 기쁨으로 향하도록
  - 환희로 바뀌도록
  - 즐거움에 이르도록
  lexicon: LSJ
  rationale: εἰς + 목적어와 τραπῆναι의 변화/전환 이미지를 살려 '즐거움으로 돌이키다'로 옮겼습니다. '즐거움'은 εὐφροσύνη의 밝고 축제적인 정조를 반영합니다.
- source_word: παρεκάλει
  english_pob_choice: urged them
  chosen_korean: 권하였습니다
  alternatives_korean:
  - 간청하였습니다
  - 재촉하였습니다
  - 권면하였습니다
  lexicon: LSJ
  rationale: παρακαλέω는 부탁·권유·독려의 범위를 가지며, 여기서는 연회 분위기 속에서 손님들을 즐거운 상태로 이끌려는 뜻이므로 '권하다'가 무리 없이 힘을 전달합니다.
theological_decisions:
- issue: εἰς εὐφροσύνην τραπῆναι의 상태 전환 표현
  chosen_reading: 잔치의 외적 절차가 손님들의 내적 분위기 전환을 목표로 한다는 점을 살려, 단순한 명령보다 상태 변화의 방향성을 드러냈습니다.
  alternative_readings:
  - 즐거워지라고
  - 기쁨에 빠지도록
  - 환희로 전환되도록
  rationale: 본문은 단순히 기분 좋게 하라는 명령이 아니라, 이미 마련된 잔치가 '즐거움'이라는 상태로 바뀌게 하려는 목적을 말합니다.
  doctrine_reference: 서사적 문맥의 의미 보존
