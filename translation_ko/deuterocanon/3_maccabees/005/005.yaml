  rationale: πέρας는 단순한 종말보다 ‘끝’이나 ‘완결’의 뉘앙스가 있어, ὀλεθρίας와 결합한 압축된 표현을 ‘멸망의 끝’으로 살렸습니다.
theological_decisions:
- issue: τὸ φύλον의 집단 지칭과 파괴 의도
  chosen_reading: ‘그 민족’을 대상으로 한 전면적 멸망 시도로 이해했습니다.
  alternative_readings:
  - ‘그 백성’으로 더 중립적으로 옮길 수 있습니다.
  - ‘그 종족’으로 혈통적 뉘앙스를 더 살릴 수 있습니다.
  rationale: 이 절은 민족 집단 전체를 겨냥한 폭력의 의도를 드러내므로, 한국어에서도 그 집단성·적대성을 약화시키지 않도록 했습니다.
  doctrine_reference: Translation philosophy §5 (key-term consistency and documented exception)
