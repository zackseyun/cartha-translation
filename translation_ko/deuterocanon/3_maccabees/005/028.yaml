    issue: ‘목적을 잊게 하신’이 원문에 없는 ‘목적’을 첨가합니다.
    rationale: λήθην은 목적이나 계획을 명시하지 않고 ‘망각’을 뜻합니다. 문맥적 추론을 본문에 확정적으로 넣지 않아야 합니다.
  - severity: high
    issue: ‘그들이 전에 그를 상대로 꾸미던 사람들의 마음’은 문법적 연결이 부자연스럽습니다.
    rationale: ‘그들이’와 ‘사람들’의 관계가 혼란스럽고, 누가 무엇을 꾸몄는지 즉시 파악하기 어렵습니다.
  - severity: medium
    issue: ‘주관하시는’은 δεσποτεύω의 통치·주권 행사를 다소 약화할 수 있습니다.
    rationale: ‘다스리시는’은 모든 것을 지배하고 통치한다는 원문의 의미를 현대 한국어로 더 직접적으로 전달합니다.
