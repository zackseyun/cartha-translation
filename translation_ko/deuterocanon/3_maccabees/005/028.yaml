  text: But this was the working of God[a], who rules over all, having implanted in the minds of those who had previously plotted against them a forgetfulness of their purpose.
  footnotes:
  - marker: a
    text: Or 'having put forgetfulness into their mind.' The Greek pictures God as placing forgetfulness within those who had been plotting.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이것은 만물을 다스리시는 하나님[a]의 역사였습니다. 곧 하나님께서 이전에 그를 상대로 계략을 꾸몄던 사람들의 마음속에 망각을 넣으신 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 것을 다스리시는 하나님’.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ ἡ ἐνέργεια
  english_pob_choice: this was the working
  chosen_korean: 이것은 …의 역사였습니다
  alternatives_korean:
  - 이것은 …의 작용이었습니다
  - 이것은 …의 일하심이었습니다
  lexicon: LSJ
  rationale: ἐνέργεια는 단순한 결과보다 능동적인 작용과 역사하심을 가리키므로, 문맥에 맞게 '역사'로 옮겨 하나님의 능동적 개입을 드러냈습니다.
- source_word: τοῦ πάντα δεσποτεύοντος θεοῦ
  english_pob_choice: God, who rules over all
  chosen_korean: 만물을 주관하시는 하나님
  alternatives_korean:
  - 모든 것을 다스리시는 하나님
  - 만물을 지배하시는 하나님
  lexicon: LSJ
  rationale: δεσποτεύω는 주권적 통치와 주재를 뜻하므로, 현대 한국어에서 오해를 줄이면서도 권위의 강도를 살릴 수 있는 '주관하시는'을 택했습니다.
- source_word: τῶν πρὶν αὐτῷ μεμηχανημένων
  english_pob_choice: those who had previously plotted against them
  chosen_korean: 그들이 전에 그를 상대로 꾸미던 사람들
  alternatives_korean:
  - 그를 이전에 모의하던 사람들
  - 그에게 앞서 계책을 꾸미던 사람들
  lexicon: LSJ
  rationale: μηχανάομαι는 단순한 생각보다 해를 끼칠 계략을 꾸미는 뜻이 강하므로 '꾸미다'로 살리고, 관계를 자연스럽게 드러내기 위해 '상대로'를 붙였습니다.
- source_word: λήθην
  english_pob_choice: a forgetfulness
  chosen_korean: 목적을 잊게 하신
  alternatives_korean:
  - 망각을 넣으신
  - 잊어버림을 넣으신
  lexicon: LSJ
  rationale: 한국어에서는 '망각'보다 서술형 '잊게 하신'이 더 자연스럽고, 본문의 강한 인과를 살리면서도 과도한 명사화를 피할 수 있습니다.
theological_decisions:
- issue: 하나님의 직접적 개입
  chosen_reading: 하나님께서 적대자들의 마음에 잊어버림을 두셔서 그들의 계획을 무너뜨리셨다고 읽었습니다.
  alternative_readings:
  - 하나님께서 단지 허락하신 것으로 읽을 수 있습니다
  - 하나님께서 섭리적으로 혼란만 일으키신 것으로 완화할 수 있습니다
  rationale: 본문의 ἐνέργεια와 ἐντεθεικότος는 단순한 허용보다 적극적 행위를 가리키므로, 그 긴장을 약화하지 않고 직접성을 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
