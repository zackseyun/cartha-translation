  yaml_path: translation/deuterocanon/3_maccabees/003/016.yaml
  text: And after assigning very great revenues to the temples in the cities[a], we also went on and, going up to Jerusalem, to honor the temple of those never-winnowed and never-ceasing in their folly.
  footnotes:
  - marker: a
    text: The Greek expression rendered 'those never-winnowed' is rare and difficult. It may be a hostile metaphor for people viewed as unrefined or uncleansed; some interpreters take it more positively and render the phrase in a less pejorative way.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 각 도시의 성전들에 막대한 세입을 배정한 뒤, 우리는 또한 나아가 예루살렘으로 올라가, 한 번도 키질되지 않았고 어리석음을 결코 그치지 않는 이들의 성전을 공경하려 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘한 번도 키질되지 않은’으로 옮긴 그리스어 표현은 희귀하고 뜻이 어렵습니다. 이는 정제되지 않았거나 깨끗이 가려지지 않은 사람들을 가리키는 적대적인 농경 비유일 수 있습니다. 이를 덜 경멸적으로 이해하는 해석도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπονείμαντες
  english_pob_choice: after assigning
  chosen_korean: 배정한 뒤
  alternatives_korean:
  - 분배한 뒤
  - 할당한 뒤
  lexicon: LSJ
  rationale: 행정적으로 몫을 나누어 주는 뜻을 살려, 재정 항목을 다루는 문맥에 맞게 ‘배정하다’로 옮겼습니다.
- source_word: προσόδους πλείστας
  english_pob_choice: very great revenues
  chosen_korean: 매우 큰 수입
  alternatives_korean:
  - 매우 큰 세입
  - 풍부한 수입
  lexicon: LSJ
  rationale: πρόσοδοι는 일반적 ‘수입’보다 재정적 ‘수입/세입’에 가깝고, πλείστας의 강조를 ‘매우 큰’으로 살렸습니다.
- source_word: ἀναβάντες
  english_pob_choice: going up
  chosen_korean: 올라가
  alternatives_korean:
  - 올라가면서
  - 올라간
  lexicon: LSJ
  rationale: 예루살렘을 향한 이동을 나타내는 관용적 표현이라 한국어에서도 자연스럽게 ‘올라가’로 처리했습니다.
- source_word: τὸ ἱερὸν
  english_pob_choice: the temple
  chosen_korean: 신전
  alternatives_korean:
  - 성전
  - 성소
  lexicon: LSJ
  rationale: 여기서는 ἱερόν이 사원/신전 전체를 가리키므로, 전통적 교회어보다 중립적인 ‘신전’이 원문의 공간 감각을 더 직접적으로 전합니다.
- source_word: ἀλητρίων
  english_pob_choice: those never-winnowed
  chosen_korean: 결코 타작되지도 않은
  alternatives_korean:
  - 결코 키질되지도 않은
  - 결코 까부르지도 않은
  lexicon: LSJ
  rationale: 희귀하고 비유적인 농경 이미지를 보존하기 위해, ‘정결하게 걸러지지 않은’ 식의 완화보다 ‘타작되지도 않은’으로 직역해 조롱의 뉘앙스를 유지했습니다.
- source_word: μηδέποτε ληγόντων τῆς ἀνοίας
  english_pob_choice: never-ceasing in their folly
  chosen_korean: 결코 그 어리석음이 그치지도 않는
  alternatives_korean:
  - 그 어리석음이 결코 그치지 않는
  - 어리석음이 끝없는
  lexicon: LSJ
  rationale: 지속 상태를 나타내는 표현을 한국어 상대문으로 살려, ‘그치지도 않는’으로 대조적 반복을 유지했습니다.
theological_decisions:
- issue: τῶν ἀλητρίων καὶ μηδέποτε ληγόντων τῆς ἀνοίας의 수식 대상
  chosen_reading: ‘이들의 신전’으로 처리하여, 원문의 적대적 화자가 예루살렘 신전을 그 신전과 관련된 사람들을 빗대어 조롱하는 구성을 드러냈습니다.
  alternative_readings:
  - ‘타작되지도 않고 어리석음이 그치지도 않는 이들의 신전’
  - ‘정결하고 열심 있는 이들의 신전’
  rationale: 문맥상 호의적 완화보다 적대적 수사와 희귀한 농경 은유를 그대로 드러내는 편이 원문 의미를 더 충실히 보존합니다.
  doctrine_reference: 원문 우선 원칙; 난해한 은유와 조롱어를 매끈하게 중화하지 않음
