  rationale: 문맥상 호의적 완화보다 적대적 수사와 희귀한 농경 은유를 그대로 드러내는 편이 원문 의미를 더 충실히 보존합니다.
  doctrine_reference: 원문 우선 원칙; 난해한 은유와 조롱어를 매끈하게 중화하지 않음
