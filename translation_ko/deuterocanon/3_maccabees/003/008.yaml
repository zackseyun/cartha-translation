base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/008.yaml
  text: But the Greeks in the city[a], having suffered no wrong, seeing the unexpected turmoil concerning the men and the disorderly gatherings that were taking place, were not strong enough to help; for their disposition urged an appeal[b], and some also were in an agitated state and supposed that these things would change.
  footnotes:
  - marker: a
    text: Or 'their inclination prompted entreaty/encouragement.' The clause παρακλῆσιν γὰρ ἡ διάθεσις παρεκάλουν is syntactically compressed, so the exact nuance of παράκλησις is difficult to represent in smooth English.
    reason: lexical_alternative
  - marker: b
    text: Or 'some also were caught up in the commotion.' The rare adverb συνδρόμως may point either to inner agitation or to being swept along with the crowd activity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 성 안의 그리스인들은 아무런 해를 입지 않았는데도, 그 남자들에 관한 뜻밖의 소란과 일어나고 있는 무질서한 군중 모임을 보면서 도울 힘이 없었습니다. 그들의 성향이 호소를 촉구하고 있었기 때문입니다.[a] 그들 역시 동요한 상태에 있었고,[b] 이러한 일들이 바뀔 것이라고 생각했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: παρακλῆσιν γὰρ ἡ διάθεσις παρεκάλουν은 문장이 압축되어 있어, παράκλησις를 '호소', '간청', '권면' 가운데 어느 뜻으로 구체화할지는 단정하기 어렵습니다.
    reason: lexical_alternative
  - marker: b
    text: συνδρόμως는 드물게 쓰이는 부사로, 내적 동요를 뜻할 수도 있고 군중의 소용돌이에 휩쓸린 상태를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ κατὰ τὴν πόλιν Ἕλληνες
  english_pob_choice: But the Greeks in the city
  chosen_korean: 그러나 성 안의 그리스인들은
  alternatives_korean:
  - 그런데 그 도시의 그리스인들은
  - 성 안에 있던 그리스인들은
  lexicon: LSJ
  rationale: κατὰ τὴν πόλιν은 도시 안에 있는 위치를 가리키므로, 자연스러운 현대 한국어로 '성 안의'를 택했습니다. δέ는 앞 문맥과의 약한 대조를 살려 '그러나'로 옮겼습니다.
- source_word: οὐδὲν ἠδικημένοι
  english_pob_choice: having suffered no wrong
  chosen_korean: 아무런 해를 입지 않았는데도
  alternatives_korean:
  - 아무 일도 당하지 않았는데도
  - 전혀 부당한 일을 겪지 않았는데도
  lexicon: LSJ
  rationale: ἀδικέω의 수동 분사는 이들이 직접 피해나 부당함을 당하지 않았음을 뜻하므로, '해를 입지 않다'로 자연스럽게 옮겼습니다.
- source_word: συνδρομὰς ἀπροκόπους γινομένας
  english_pob_choice: the disorderly gatherings that were taking place
  chosen_korean: 일어나고 있는 무질서한 군중 모임
  alternatives_korean:
  - 일어나고 있는 소란스러운 모임
  - 진행되지 못한 군중의 모임
  lexicon: LSJ
  rationale: συνδρομή는 단순한 만남보다 사람들이 몰려드는 집합/모임을 가리키고, ἀπρόκοπος는 진전 없이 어수선한 상태를 시사하므로 '무질서한 군중 모임'으로 살렸습니다.
- source_word: βοηθεῖν μὲν οὐκ ἔσθενον
  english_pob_choice: were not strong enough to help
  chosen_korean: 돕기에 충분한 힘이 없었습니다
  alternatives_korean:
  - 도울 수 없었습니다
  - 도울 만한 힘이 없었습니다
  lexicon: LSJ
  rationale: σθενόω 계열은 단순 의지 부족이 아니라 힘/능력의 부족을 뜻하므로, '충분한 힘이 없었습니다'로 옮겨 능력의 결핍을 드러냈습니다.
- source_word: παρακλῆσιν γὰρ ἡ διάθεσις παρεκάλουν
  english_pob_choice: for their disposition urged an appeal
  chosen_korean: 그들의 성향이 호소를 부르고 있었기 때문이며
  alternatives_korean:
  - 그들의 성향이 간청을 요구하고 있었기 때문이며
  - 그들의 마음가짐이 호소를 촉구하고 있었기 때문이며
  lexicon: LSJ
  rationale: παράκλησις와 διάθεσις의 결합은 압축되어 있어 단정적 해석을 피하고, 내적 성향이 '호소' 쪽으로 기울어 있음을 드러내는 표현으로 옮겼습니다.
- source_word: οἱ δὲ καὶ συνδρόμως εἶχον
  english_pob_choice: and some also were in an agitated state
  chosen_korean: 또 어떤 이들은 동요한 상태에 있었고
  alternatives_korean:
  - 또 어떤 이들은 소란에 휩쓸려 있었고
  - 또 어떤 이들은 함께 몰려든 상태에 있었고
  lexicon: LSJ
  rationale: 희귀 부사 συνδρόμως는 내적 동요나 군중의 소용돌이에 휩쓸린 상태를 둘 다 시사하므로, 문맥상 넓게 '동요한 상태'로 잡았습니다.
- source_word: μεταπεσεῖσθαι ταῦτα ὑπελάμβανον
  english_pob_choice: supposed that these things would change
  chosen_korean: 이런 일들이 바뀔 것이라고 생각했습니다
  alternatives_korean:
  - 이런 사태가 달라질 것이라고 여겼습니다
  - 이러한 일들이 다른 국면으로 바뀔 것이라고 추정했습니다
  lexicon: LSJ
  rationale: μεταπίπτω는 상태의 변화나 전환을 뜻하므로, 과도하게 해석하지 않고 단순한 변화의 예상으로 옮겼습니다.
theological_decisions:
- issue: 중립적 역사 서술에서의 정서·사회 상태 표현
  chosen_reading: 이 구절은 신학적 진술보다 도시 안 그리스인들의 무력감과 내적 동요를 묘사하므로, 인물의 심리와 군중 상황을 직접적으로 드러내는 한국어를 택했습니다.
  alternative_readings:
  - 더 완곡하게 표현하여 사회적 분위기만 암시할 수 있음
  - '''분란''처럼 도덕적 평가를 강화할 수 있음'
  rationale: 원문의 초점은 원인 설명이 아니라 그들이 왜 즉각 돕지 못했는지에 대한 상황 묘사이므로, 평가를 덧붙이지 않고 서술적 긴장을 유지했습니다.
  doctrine_reference: 서술 문맥의 의미 보존 원칙
- issue: παράκλησις의 의미 범위
  chosen_reading: '''호소''로 옮겨 간청과 요청의 폭을 남겼습니다.'
  alternative_readings:
  - '''권면'''
  - '''간청'''
  - '''격려'''
  rationale: 문맥상 이들은 개입보다 호소 쪽으로 기울어 있었으나, 단일 정서로 고정하면 원문의 압축성을 잃기 쉬워 가장 넓은 중간값을 택했습니다.
  doctrine_reference: 어휘의 다의성 보존 원칙
