    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρρωμαι
  english_pob_choice: am well
  chosen_korean: 잘 지내고 있습니다
  alternatives_korean:
  - 건강합니다
  - 무사합니다
  - 잘 있습니다
  lexicon: LSJ
  rationale: ῥώννυμι의 완료형이 관용적으로 ‘안부가 좋다/건강하다’는 뜻으로 쓰이므로, 현대 한국어에서는 자연스럽게 ‘잘 지내고 있습니다’로 옮겨 개인의 안부 상태를 살렸습니다.
- source_word: καὶ αὐτὸς ἐγὼ
  english_pob_choice: I myself
  chosen_korean: 저도
  alternatives_korean:
  - 저 자신도
  - 바로 저도
  - 저 역시
  lexicon: LSJ
  rationale: 강조된 자기지시를 한국어에서는 ‘저도’로 간결하게 드러낼 수 있으며, 앞의 안부 표현과 함께 화자의 자기 언급을 자연스럽게 연결합니다.
- source_word: τὰ πράγματα ἡμῶν
  english_pob_choice: our affairs
  chosen_korean: 우리 일도 잘 진행되고 있습니다
  alternatives_korean:
  - 우리의 일도 괜찮습니다
  - 우리 사정도 좋습니다
  - 우리 형편도 좋습니다
  lexicon: LSJ
  rationale: πράγματα는 여기서 단순한 ‘사건’보다 공동체의 형편·일 전반을 가리키므로, 현대 한국어에서 문맥상 자연한 ‘우리 일’로 풀되, ‘잘 진행되고 있습니다’로 상태의 호전을 드러냈습니다.
theological_decisions:
- issue: 편지형 안부 관용구의 직역 여부
  chosen_reading: ‘잘 지내고 있습니다’와 ‘우리 일도 잘 진행되고 있습니다’로, 개인과 공동체의 상태를 함께 표현했습니다.
  alternative_readings:
  - ‘건강합니다’와 ‘우리 사정도 좋습니다’
  - ‘무사합니다’와 ‘우리 형편도 좋습니다’
  rationale: 그리스어는 동일한 안부 관용구를 사람과 ‘일/형편’에 모두 적용하므로, 한국어에서도 두 범주를 병렬로 드러내는 것이 원문의 수사와 의미를 가장 잘 보존합니다.
  doctrine_reference: source-language idiom and discourse tone
