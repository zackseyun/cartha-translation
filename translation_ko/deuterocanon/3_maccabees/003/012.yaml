  text: 'King Ptolemy Philopator to the generals and soldiers throughout Egypt and in every place: greetings and good health[a].'
  footnotes:
  - marker: a
    text: Or 'and in each district' / 'and place by place'; the Greek κατὰ τόπον is somewhat idiomatic and may refer to local postings or districts.
