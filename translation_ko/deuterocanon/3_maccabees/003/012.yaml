translation:
  language: ko
  text: '이집트의 왕 프톨레마이오스 필로파토르가 이집트에 있는 장군들과 모든 곳에 있는 병사들에게: 인사와 건강을 빕니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: κατὰ τόπον은 문자적으로는 ‘장소대로’라는 뜻이지만, 문맥상 ‘각 지역에’ 또는 ‘곳곳에’라는 분포적 의미일 수 있습니다.
    reason: lexical_alternative
