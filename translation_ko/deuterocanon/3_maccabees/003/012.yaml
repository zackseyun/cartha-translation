translation:
  language: ko
  text: 프톨레마이오스 필로파토르 왕은 이집트 전역과 각 지역에 있는 장군들과 병사들에게 인사와 건강을 빕니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: κατὰ τόπον은 문자적으로는 ‘장소에 따라’라는 뜻이며, 여기서는 ‘각 지역에’ 또는 ‘곳곳에’라는 분포적 의미일 수 있습니다.
    reason: lexical_alternative
