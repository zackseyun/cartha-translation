  rationale: 원문의 보상 약속과 ‘자유의 관’이라는 수사를 유지하면서, 비자연스러운 피동 표현을 현대 한국어 합쇼체로 다듬었습니다. 또한 εὔθυνα의 법적 심사·책임 추궁이라는 어휘 범위를 각주에서 보존하고, 원문이 명시하지 않는 ‘면제’는 삭제했습니다.
