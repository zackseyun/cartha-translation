  text: And whoever wishes to inform against them will[a], for this, receive the property of the one who falls under the penalty, and two thousand drachmas from the royal treasury[b], and will be crowned with freedom.
  footnotes:
  - marker: a
    text: Or 'of the one who comes under judicial scrutiny'; the Greek phrase can refer to being brought under official examination or liability, here in a punitive decree.
    reason: lexical_alternative
  - marker: b
    text: Literally 'will be crowned with freedom,' likely meaning that the informer would be granted freedom as a reward.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 누구든지 그들에 대해 고발하기를 원하는 사람은, 그로 말미암아 벌을 받게 되는 자의 재산과 왕실 금고에서 이천 드라크마를 받게 될 것이며, 자유의 관을 씌움받을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉, 당국의 공식 심사나 처벌상 책임 아래 들어가는 이를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 '자유의 관을 씌움받을 것입니다'로, 보상으로서의 해방/면제를 비유적으로 말한 표현일 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
- source_word: μηνύειν
  english_pob_choice: to inform against
  chosen_korean: 고발하기를 원하는
  alternatives_korean:
  - 알리기를 원하는
  - 보고하기를 원하는
  - 밀고하기를 원하는
  lexicon: LSJ
  rationale: 법적·징계적 문맥에서 단순한 통보가 아니라 당국에 불리한 정보를 제공하는 뜻이므로, '고발하다'가 accusatory force를 가장 잘 드러냅니다.
- source_word: τὸν βουλόμενον
  english_pob_choice: whoever wishes
  chosen_korean: 누구든지 … 원하는 사람은
