base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/028.yaml
  text: And whoever wishes to inform against them will[a], for this, receive the property of the one who falls under the penalty, and two thousand drachmas from the royal treasury[b], and will be crowned with freedom.
  footnotes:
  - marker: a
    text: Or 'of the one who comes under judicial scrutiny'; the Greek phrase can refer to being brought under official examination or liability, here in a punitive decree.
    reason: lexical_alternative
  - marker: b
    text: Literally 'will be crowned with freedom,' likely meaning that the informer would be granted freedom as a reward.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 누구든지 그들을 고발하고자 하는 사람은, 그 일로 책임 추궁을 받게 되는 사람의 재산[a]과 왕실 금고에서 이천 드라크마를 받고, 자유의 관을 받게 될 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘책임 추궁 아래 들어가는 사람’입니다. 그리스어는 당국의 공식 심사·감사 또는 법적 책임 추궁 아래 놓이는 이를 가리킬 수 있으며, 이 처벌 칙령의 문맥에서는 처벌을 받게 되는 사람을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역에 가까운 표현입니다. ‘자유의 관’은 보상으로 자유를 부여받는다는 영예적 비유이며, 특히 해방 또는 법적 자유의 부여를 뜻할 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
- source_word: μηνύειν
  english_pob_choice: to inform against
  chosen_korean: 고발하기를 원하는
  alternatives_korean:
  - 알리기를 원하는
  - 보고하기를 원하는
  - 밀고하기를 원하는
  lexicon: LSJ
  rationale: 법적·징계적 문맥에서 단순한 통보가 아니라 당국에 불리한 정보를 제공하는 뜻이므로, '고발하다'가 accusatory force를 가장 잘 드러냅니다.
- source_word: τὸν βουλόμενον
  english_pob_choice: whoever wishes
  chosen_korean: 누구든지 … 원하는 사람은
  alternatives_korean:
  - 원하는 누구든지
  - 누구나 원하면
  - 원하는 자는
  lexicon: LSJ
  rationale: 정관 분사구가 일반적·포괄적 대상을 가리키므로, 한국어에서는 자연스러운 포괄 표현으로 옮겼습니다.
- source_word: τοῦ ἐμπίπτοντος ὑπὸ τὴν εὔθυναν
  english_pob_choice: of the one who falls under the penalty
  chosen_korean: 벌을 받게 되는 자의
  alternatives_korean:
  - 책임 추궁을 받게 되는 자의
  - 심문 대상이 되는 자의
  - 징벌 아래 놓이는 자의
  lexicon: LSJ
  rationale: εὔθυνα는 본래 회계·감사·법적 심사를 뜻하지만, 이 칙령 문맥에서는 처벌상 책임을 지는 뜻이 자연스러워 '벌을 받게 되는'으로 옮겼습니다.
- source_word: τῆς ἐλευθερίας στεφανωθήσεται
  english_pob_choice: will be crowned with freedom
  chosen_korean: 자유의 관을 씌움받을 것입니다
  alternatives_korean:
  - 자유로 관을 쓰게 될 것입니다
  - 자유로 보상받을 것입니다
  - 해방의 관을 받게 될 것입니다
  lexicon: LSJ
  rationale: 동사 στεφανόω의 비유적·영예적 이미지를 살리기 위해 직설적으로 '관을 씌움받다'를 유지했고, 여기서 자유는 보상으로 주어지는 해방/면제의 의미를 드러냅니다.
theological_decisions:
- issue: '''자유의 관''의 의미'
  chosen_reading: 문맥상 실제 왕실 포상으로서의 해방 또는 면제를 가리키는 은유를 그대로 살렸습니다.
  alternative_readings:
  - 단순히 '자유를 받게 될 것입니다'로 평탄화할 수 있음
  - 시민권 특권의 부여로 볼 수 있음
  rationale: 이 절은 교리 논점보다 칙령의 수사와 보상 구조가 핵심이므로, 은유를 지우지 않고 한국어에서도 보상적 해방의 뉘앙스가 보이게 했습니다.
  doctrine_reference: 번역 원칙 §6(가독성 유지와 본문의 무게 보존)
