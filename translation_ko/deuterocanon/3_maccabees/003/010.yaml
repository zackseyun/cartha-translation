  text: And already some neighbors and friends and business associates[a], secretly drawing certain people aside, were giving assurances that they would join in protecting them and would offer every earnest effort toward their support.
  footnotes:
  - marker: a
    text: Or 'were giving pledges that they would join in defending them and would contribute their utmost for their help.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이미 몇몇 이웃과 친구들 및 거래 동료들은 몇 사람을 은밀히 따로 불러내어, 그들을 보호하는 데 함께하고 그들을 돕기 위해 온 힘을 다하겠다고 확약하고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 방어하는 데 함께하겠다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: γείτονές τε καὶ φίλοι καὶ συνπραγματευόμενοι
  english_pob_choice: neighbors and friends and business associates
  chosen_korean: 이웃과 친구들, 그리고 사업 동료들
  alternatives_korean:
  - 가까운 사람들
  - 친지와 친구와 거래 동료들
  - 이웃과 친구와 장사 동료들
  lexicon: LSJ
  rationale: 세 부류의 사회적 연대를 자연스러운 현대 한국어로 살리되, συνπραγματευόμενοι의 공동 거래·협력 뉘앙스를 ‘사업 동료들’로 무리 없이 전달했습니다.
- source_word: μυστικῶς
  english_pob_choice: secretly
  chosen_korean: 몰래
  alternatives_korean:
  - 은밀히
  - 비밀리에
  lexicon: LSJ
  rationale: 공개 지원이 위험한 정황이므로, 간결하고 구어적이면서도 문어체에 맞는 ‘몰래’가 적절합니다.
- source_word: τινας ἐπισπώμενοι
  english_pob_choice: drawing certain people aside
  chosen_korean: 어떤 사람들을 따로 끌어내어
  alternatives_korean:
  - 몇 사람을 따로 불러내어
  - 어떤 이들을 자기들 편으로 끌어들여
  lexicon: LSJ
  rationale: ἐπισπάω의 ‘자기 쪽으로 끌어옴’과 ‘따로 떼어냄’의 결을 함께 살리기 위해, 단순한 회유보다 ‘따로 끌어내어’를 택했습니다.
- source_word: πίστεις ἐδίδουν
  english_pob_choice: were giving assurances
  chosen_korean: 보증을 주고 있었습니다
  alternatives_korean:
  - 약속을 하고 있었습니다
  - 확신을 주고 있었습니다
  - 맹세를 하고 있었습니다
  lexicon: LSJ
  rationale: 직역하면 ‘믿음/신뢰를 주다’에 가깝지만 문맥상 지지와 협력을 약속하는 관용구이므로, 약속의 무게를 살린 ‘보증을 주다’로 옮겼습니다.
- source_word: πρὸς ἀντίλημψιν
  english_pob_choice: toward their support
  chosen_korean: 그들을 돕기 위해
  alternatives_korean:
  - 그들을 지원하기 위해
  - 그들의 도움을 위해
  - 그들을 거들기 위해
  lexicon: LSJ
  rationale: ἀντίλημψις의 도움·지지 의미를 한국어 행동 표현으로 자연스럽게 풀어, 뒤의 ‘온 힘을 다하겠다’와 평행을 이루게 했습니다.
theological_decisions:
- issue: 공동체적 보호와 지원의 표현
  chosen_reading: ‘그들을 보호하는 데 함께하겠다’와 ‘그들을 돕기 위해 온 힘을 다하겠다’로 옮겨, 비밀스러운 연대와 실질적 방어의 두 층위를 함께 드러냈습니다.
  alternative_readings:
  - ‘그들을 지키는 데 동참하겠다’
  - ‘그들을 변호하겠다’
  - ‘그들의 도움을 위해 최선을 다하겠다’
  rationale: συνασπίζειν은 단순한 호의가 아니라 방패를 드는 보호 행동의 이미지가 있으므로, 추상화하지 않고 공동 방어의 의미를 유지했습니다.
  doctrine_reference: 문맥상의 집단적 연대와 보호의 어휘 선택
