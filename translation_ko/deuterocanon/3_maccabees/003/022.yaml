lexical_decisions:
- source_word: τούναντίον
  english_pob_choice: the opposite
  chosen_korean: 그와는 반대로
  alternatives_korean:
  - 정반대로
  - 그 반대편으로
  lexicon: LSJ
  rationale: 문맥상 앞선 기대와 정반대의 방향을 가리키므로, 대조를 분명히 드러내는 ‘그와는 반대로’가 가장 자연스럽습니다.
- source_word: συμφύτῳ
  english_pob_choice: inborn
  chosen_korean: 태생적인
  alternatives_korean:
  - 선천적인
  - 타고난
  lexicon: LSJ
  rationale: ‘함께 자라난’이라는 원뜻을 한국어에서 가장 간결하게 살리면서, 악이 본성에 붙어 있음을 드러내는 표현으로 옮겼습니다.
- source_word: κακοηθείᾳ
  english_pob_choice: malice
  chosen_korean: 악의
  alternatives_korean:
  - 악한 성품
  - 악독함
  - 해로운 성향
  lexicon: LSJ
  rationale: 단순한 ‘악함’보다 의도적이고 적대적인 내적 성향을 드러내는 말로 ‘악의’가 적절합니다.
- source_word: ἀπωσάμενοι / ἐκνεύοντες
  english_pob_choice: pushed away / turning aside
  chosen_korean: 밀어내고 / 기울어져 가는
  alternatives_korean:
  - 물리치고 / 계속해서 빗나가며
  - 거부하고 / 계속해서 치우치며
  lexicon: LSJ
  rationale: 하나님께서 주시는 선을 거부하는 강한 동작과, 악을 향해 점점 방향이 틀어지는 이미지를 함께 살리기 위해 동적이면서도 과장되지 않은 표현을 택했습니다.
- source_word: φαῦλον
  english_pob_choice: what is base
  chosen_korean: 비천한 것
  alternatives_korean:
  - 천한 것
  - 사악한 것
  - 하찮은 것
  lexicon: LSJ
  rationale: φαῦλον은 단순히 ‘악한’보다 도덕적·가치적 저열함을 함께 가지므로, 도덕적 품격이 낮은 상태를 드러내는 ‘비천한 것’이 문맥에 맞습니다.
