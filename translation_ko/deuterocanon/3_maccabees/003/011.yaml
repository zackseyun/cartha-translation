  terminology: ‘가장 위대하신 하나님’은 τοῦ μεγίστου θεοῦ의 최상급을 충실히 보존하며, 관용적 칭호인 ‘지극히 높으신 하나님’으로 평준화하지 않은 점이 적절합니다. ‘번영’, ‘우쭐해 있었고’, ‘능력’도 문맥과 어휘에 부합합니다.
