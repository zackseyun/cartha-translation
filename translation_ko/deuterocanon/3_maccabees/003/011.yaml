  text: 그러므로 그는 당시의 번영에 우쭐해 있었고, 가장 위대하신 하나님의 능력을 보지 못하며, 자신이 같은 계획을 영원히 고수할 것이라고 생각하면서, 그들에게 불리한 이 편지를 썼습니다:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘가장 위대한 하나님’입니다. 익숙한 ‘지극히 높으신 하나님’과는 다른 그리스어 표현입니다.
