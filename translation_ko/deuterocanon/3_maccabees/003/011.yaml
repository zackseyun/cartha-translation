  text: 'So then[a], puffed up by his present prosperity, and not perceiving the power of the greatest God, but supposing that he would continue forever in the same purpose, he wrote this letter against them:'
  footnotes:
  - marker: a
    text: Or, 'the Most High God.' The Greek reads literally 'the greatest God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그는 당시의 번영에 우쭐해 있었고, 가장 위대하신 하나님의 능력을 보지 못하며, 자신의 계획이 같은 상태로 영원히 계속될 것이라고 생각하면서, 그들에 반대하는 이 편지를 썼습니다:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘가장 위대한 하나님’입니다. 영어 POB의 각주처럼, 익숙한 ‘지극히 높으신 하나님’과는 다른 그리스어 표현입니다.
    reason: lexical_alternative
