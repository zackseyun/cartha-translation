  rationale: 그리스어의 최상급 형용사 μεγίστου를 그대로 드러내되, 한국어에서는 신앙 언어로도 어색하지 않게 ‘가장 위대하신 하나님’으로 옮겼습니다.
- source_word: ἔγραφεν κατʼ αὐτῶν ἐπιστολὴν τήνδε
