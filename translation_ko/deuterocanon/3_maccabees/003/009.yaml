    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ... παροραθήσεσθαι
  english_pob_choice: must not be overlooked / disregarded
  chosen_korean: 간과되어서는 안 됩니다
  alternatives_korean:
  - 무시되어서는 안 됩니다
  - 지나쳐져서는 안 됩니다
  lexicon: LSJ
  rationale: παροράω는 ‘못 보고 지나치다, 간과하다, 무시하다’의 뜻이므로, 여기서는 수동적 금지로 한국어의 자연스러운 ‘간과되어서는 안 됩니다’가 핵심 의미를 가장 सीधे하게 살립니다.
- source_word: τηλικοῦτο
  english_pob_choice: so great
  chosen_korean: 그처럼 큰
  alternatives_korean:
  - 그토록 큰
  - 그만큼 큰
  lexicon: LSJ
  rationale: τηλικοῦτος는 크기·중대함의 강조이므로, 문맥상 장중한 수사를 유지하는 ‘그처럼 큰’이 적절합니다.
- source_word: σύστημα
  english_pob_choice: organization
  chosen_korean: 조직
  alternatives_korean:
  - 체계
  - 시스템
  - 단체
  lexicon: LSJ
  rationale: σύστημα는 함께 이루어진 전체, 조직된 집합을 가리킬 수 있으므로, 한국어에서 구체적이고도 중립적인 ‘조직’이 문맥상 가장 자연스럽습니다.
- source_word: μηδὲν ἠγνοηκός
  english_pob_choice: lacking no knowledge / having overlooked nothing
  chosen_korean: 아무것도 모르고 있지 않으므로
  alternatives_korean:
  - 아무것도 모르는 바가 없으므로
  - 아무것도 놓친 것이 없으므로
  lexicon: LSJ
  rationale: ἠγνοηκός의 직역은 ‘모르고 있는 것이 없는’이지만, 한국어에서는 상태를 풀어 ‘아무것도 모르고 있지 않으므로’가 무지의 부재를 가장 직접적으로 드러냅니다.
