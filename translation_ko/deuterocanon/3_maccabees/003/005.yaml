  text: And by adorning their way of life with the good conduct of the righteous, they had become well regarded by all people.
translation:
  language: ko
  text: 그러나 그들은 의인들의 선한 행실로 자신들의 생활 방식을 단장하여, 모든 사람에게 좋은 평판을 받고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘단장하여’는 κοσμέω의 비유적 표현을 살린 것입니다.
    reason: source_note
lexical_decisions:
- source_word: τῇ δὲ τῶν δικαίων εὐπραξίᾳ
  english_pob_choice: with the good conduct of the righteous
  chosen_korean: 의인들의 선한 행실로
  alternatives_korean:
  - 의인들의 좋은 행실로
  - 의인들의 의로운 행동으로
  - 의인들의 선행으로
  lexicon: LSJ
  rationale: εὐπραξία는 여기서 도덕적·윤리적 ‘좋은 행실’의 뜻이므로, ‘선한 행실’이 자연스럽고 본문 의미를 잘 드러냅니다.
- source_word: κοσμοῦντες τὴν συναναστροφήν
  english_pob_choice: adorning their way of life
  chosen_korean: 그들의 일상을 단장하며
  alternatives_korean:
  - 그들의 생활을 꾸미며
  - 그들의 삶을 단장하며
  - 그들의 교제를 단장하며
  lexicon: LSJ
  rationale: κοσμέω의 ‘단장하다/아름답게 하다’라는 비유를 살리면서, συναναστροφή는 여기서 공동생활·생활양식을 가리키므로 ‘일상’이 가장 무리 없이 전달됩니다.
- source_word: ἅπασιν ἀνθρώποις εὐδόκιμοι
  english_pob_choice: well regarded by all people
  chosen_korean: 모든 사람에게서 좋은 평판을 얻게 되어 있었습니다
  alternatives_korean:
  - 모든 사람에게서 인정받고 있었습니다
  - 모든 사람에게서 호평을 받고 있었습니다
  - 모든 사람에게서 좋은 평가를 받게 되어 있었습니다
  lexicon: LSJ
  rationale: εὐδόκιμος는 ‘잘 여겨지다, 평판이 좋다’의 사회적 수용성을 뜻하므로, ‘좋은 평판’을 택해 의미를 자연스럽게 옮겼습니다.
- source_word: καθειστήκεισαν
  english_pob_choice: they had become
  chosen_korean: 얻게 되어 있었습니다
  alternatives_korean:
  - 되어 있었습니다
  - 되어 있었습니다
  - 이미 그렇게 되어 있었습니다
  lexicon: LSJ
  rationale: 과거 완료형이 나타내는 ‘이미 형성된 상태’를 한국어로 드러내기 위해, 결과 상태를 강조하는 표현을 사용했습니다.
theological_decisions:
- issue: 의인들의 행실과 공적 평판의 관계
  chosen_reading: 본문은 의인들의 선한 행실이 그들의 일상을 ‘단장’하게 하여, 그 결과 모든 사람에게서 호평을 받는 상태에 이르렀다고 읽습니다.
  alternative_readings:
  - 단순히 외적 이미지가 좋아졌다는 읽기
  - 도덕적 행위보다 사회적 인상을 강조하는 읽기
  rationale: 그리스어의 동사 선택이 행실→일상→평판이라는 인과를 분명히 하므로, 그 연쇄를 흐리지 않도록 옮겼습니다.
  doctrine_reference: 지혜문학의 도덕적 증언과 공동체적 평판의 관계
