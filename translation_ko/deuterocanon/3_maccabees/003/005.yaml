  - severity: medium
    issue: ‘좋은 평판을 얻게 되어 있었습니다’는 καθειστήκεισαν 및 εὐδόκιμοι의 상태 표현을 다소 부정확하고 어색하게 옮깁니다.
    rationale: 원문은 이미 좋은 평판을 받는 상태에 이르러 있었음을 말합니다. ‘좋은 평판을 받고 있었습니다’는 수동적 사회적 평가와 결과 상태를 더 자연스럽게 드러냅니다.
