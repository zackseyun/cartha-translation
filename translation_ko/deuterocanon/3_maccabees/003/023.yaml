base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/023.yaml
  text: Not only have they rejected the honorable civic order[a], but they also detest, both in speech and in silence, the few among them who are genuinely well-disposed toward us, and at every opportunity, driven by the most impious pretext[c][b], they rush to bring our affairs to ruin.
  footnotes:
  - marker: a
    text: Or, more literally, 'by word and by silence,' implying both open and tacit hostility.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'the honorable civic order' renders πολιτεία broadly as the valued civic arrangement or constitution, not merely individual citizenship.
    reason: lexical_alternative
  - marker: c
    text: Or 'under the most impious pretext' for 'driven by the most impious pretext.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 존귀한 시민 질서[a]를 거부했을 뿐만 아니라, 말로든 침묵으로든 자기들 가운데 있는 적은 수의 사람들 곧 우리에게 진심으로 우호적인 이들까지도 혐오합니다. 또한 가장 경건하지 못한 구실[c][b]을 내세워, 매번 서둘러 우리의 형편을 무너뜨리려 달려듭니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘말로든 침묵으로든’이며, 공개적 적대와 묵시적 적대를 함께 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 πολιτία는 개인의 시민권이 아니라 공동체의 정치적·사회적 질서 전체를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘가장 경건하지 못한 의도/태도 아래서’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: τὴν ἄτιμητον πολιτίαν
  english_pob_choice: the honorable civic order
  chosen_korean: 존귀한 시민 질서
  alternatives_korean:
  - 존중받는 시민 체제
  - 귀한 시민 공동체
  - 명예로운 시민 질서
  lexicon: LSJ
  rationale: πολιτία는 단순한 개인 시민권보다 공동체의 정치·사회적 질서를 가리키므로, 이를 ‘시민 질서’로 옮기고 ἄτιμητον의 수사적 반어를 살려 존귀함을 표현했습니다.
- source_word: λόγῳ τε καὶ σιγῇ
  english_pob_choice: both in speech and in silence
  chosen_korean: 말로든 침묵으로든
  alternatives_korean:
  - 말과 침묵으로
  - 드러내어든 숨기어든
  - 공개적으로든 묵시적으로든
  lexicon: LSJ
  rationale: 두 방식의 적대가 함께 있다는 점을 살리기 위해, 직역에 가까우면서도 한국어로 자연스러운 대구 표현을 택했습니다.
- source_word: πρὸς ἡμᾶς γνησίως διακειμένους
  english_pob_choice: who are genuinely well-disposed toward us
  chosen_korean: 우리에게 진심으로 우호적인 이들
  alternatives_korean:
  - 우리에게 참으로 호의적인 이들
  - 우리에게 성실히 마음을 둔 이들
  - 우리에게 진정으로 잘 대해 주는 이들
  lexicon: LSJ
  rationale: διακεῖμαι의 ‘태도/마음가짐’ 의미를 살려 정치적 충성보다 더 넓은 ‘우호적 태도’로 옮겼고, γνησίως는 ‘진심으로’로 반영했습니다.
- source_word: παρʼ ἕκαστα
  english_pob_choice: at every opportunity
  chosen_korean: 매번
  alternatives_korean:
  - 기회가 닿을 때마다
  - 매 기회마다
  - 틈만 나면
  lexicon: LSJ
  rationale: 사건이 발생할 때마다 반복적으로 달려든다는 의미를 한국어에서 간결하게 드러내기 위해 관용적으로 옮겼습니다.
- source_word: μετὰ τῆς δυσσεβεστάτης ἐμφάσεως
  english_pob_choice: driven by the most impious pretext
  chosen_korean: 가장 경건하지 못한 구실
  alternatives_korean:
  - 가장 불경한 핑계
  - 가장 신성모독적인 구실
  - 가장 불경건한 명분
  lexicon: LSJ
  rationale: ἐμφάσις는 여기서 실제 동기가 아니라 내세우는 ‘구실/명분’의 뜻이 적절하므로, POB의 ‘pretext’를 따라 ‘구실’로 옮겼습니다.
theological_decisions:
- issue: ἄτιμητον πολιτίαν의 수사적 방향
  chosen_reading: 본문은 ‘존귀한 시민 질서’를 거부했다는 뜻으로 살리고, ‘존귀한’은 반어적으로 악역의 비난을 강화하는 표현으로 처리했습니다.
  alternative_readings:
  - ‘수치스러운 시민 질서’
  - ‘멸시받는 시민 체제’
  rationale: 주어진 영어 POB와 최신 수정 이력은 ἄτιμητον을 가치 있는 질서에 대한 거부로 읽고 있으므로, 한국어도 그 반어를 유지해야 본문의 공격적 수사가 보존됩니다.
  doctrine_reference: 수사적 반어와 문맥 우선 원칙
