  source_fidelity: 수정이 필요합니다. ἄτιμητον은 통상 ‘명예롭지 않은, 존중받지 못하는’이라는 부정 의미이므로, 본문의 ‘존귀한’은 그 어휘형과 직접 부합하지 않습니다. 영어 감사 이력에는 긍정 의미로 읽는 해석이 있으나, 이는 원문의 형태가 허용하는 가장 자연스러운 번역이 아니므로 한국어 본문에서는 부정 의미를 보존했습니다. 또한 ἐφορμώμενοι와 διὰ τάχους의 공격적·긴급한 뉘앙스를 ‘덤벼듭니다’와 ‘급히’로 반영했습니다.
  naturalness: ‘그들 가운데 있는 적은 수의 사람들’은 ‘그들 가운데서 우리에게 진심으로 우호적인 소수의 사람들’로 다듬어 수식 관계를 분명히 했습니다. ‘가장 경건하지 못한’보다 현대 한국어에서 자연스럽고 원문의 불경·불신성을 잘 드러내는 ‘가장 불경한’을 사용했습니다.
  terminology: πολιτεία는 개인 자격으로서의 시민권보다 공동체의 시민적·정치적 질서를 가리키므로 ‘시민 질서’로 유지했습니다. ἐμφάσεως는 실제 내심의 ‘의도’로 단정하지 않고 ‘구실’로 옮겼습니다. 기존 각주 표지가 본문과 서로 바뀌어 있던 문제를 바로잡았습니다.
  issues:
