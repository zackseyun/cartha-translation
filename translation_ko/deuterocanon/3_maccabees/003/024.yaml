translation:
  language: ko
  text: 그러므로 우리는 여러 증거로 이 사람들이 모든 면에서 우리에게 악의를 품고 있음을 충분히 확신하며, 훗날 갑작스러운 소요가 일어날 때 이 불경한 자들이 우리 뒤에서 배신자들과 야만인 적들이 될까 염려하여 미리 대비하고 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야만스러운 적들’. 그리스어 βαρβάρους는 여기서 정확한 민족 표지라기보다 화자의 경멸적 수사로 기능합니다.
    reason: lexical_alternative
