  text: Therefore[a], being well convinced by proofs that these people are in every way ill-disposed toward us, and taking thought lest, if some sudden disturbance should later arise, we should have these ungodly people at our back as traitors and barbarian enemies,
  footnotes:
  - marker: a
    text: Or 'savage enemies.' The Greek 'barbarous' is a pejorative label in the speaker's rhetoric, not necessarily a precise ethnic designation here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 우리는 증거들로 이 사람들이 모든 면에서 우리에게 적대적이라는 것을 잘 확신하고 있으며, 또 훗날 갑작스러운 소동이 일어나 우리에게 이 불경한 자들을 등 뒤에 두고 배신자들과 야만인 적으로 맞닥뜨리게 될까 염려하여 대비하고 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야만적인 적’. 그리스어 βαρβάρους는 여기서 정확한 민족 표지라기보다 화자의 경멸적 수사로 기능합니다.
    reason: lexical_alternative
