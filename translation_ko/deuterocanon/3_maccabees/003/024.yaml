  source_fidelity: 초안은 διὸ, τεκμηρίοις, κατὰ πάντα, δυσνοεῖν, προνοούμενοι, 갑작스러운 미래의 ταραχή, 그리고 ἀσεβεῖς·προδότας·βαρβάρους πολεμίους라는 화자의 적대적 규정을 대체로 충실히 반영합니다. 그러나 ‘이 불경한 자들을 등 뒤에 두고 배신자들과 야만인 적으로 맞닥뜨리게’는 τοὺς … ἔχωμεν의 ‘이들을 우리 뒤에 배신자와 야만인 적으로 두게/갖게 되다’라는 구문 관계를 한국어에서 불분명하게 만들며, ‘배신자들과’가 별도의 상대 집단처럼 읽힐 수 있습니다.
  naturalness: ‘잘 확신하고 있으며’보다 ‘충분히 확신하며’가 현대 격식체에 자연스럽습니다. 또한 ‘우리 뒤에서 배신자들과 야만인 적들이 될까’라고 하면 위험이 뒤에서 발생한다는 비유와, 동일한 대상에게 붙이는 두 술어를 분명히 드러낼 수 있습니다. ‘소동’도 가능하나, 정치·사회적 혼란을 넓게 가리키는 ταραχή에는 ‘소요’가 문맥상 자연스럽습니다.
