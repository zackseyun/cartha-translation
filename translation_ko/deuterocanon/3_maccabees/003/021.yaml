    rationale: ἀμνησικακία는 합성어의 문자적 뜻으로는 ‘악행/잘못을 기억하지 않음’이며, 문맥상 원한을 품지 않음 또는 잘못을 마음에 두지 않음입니다. 현 각주는 번역어를 직역으로 잘못 규정합니다.
