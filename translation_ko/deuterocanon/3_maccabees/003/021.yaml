theological_decisions:
- issue: 알렉산드리아 시민권과 성소 참여의 범위
  chosen_reading: 이 절은 유대인들에게 주어진 시민적 승격과 성소 관련 참여를 말하지만, 그 법적·예배적 범위를 더 좁게 단정하지는 않습니다.
  alternative_readings:
  - 완전한 정치적 동화로 이해할 수 있습니다.
  - 성전 봉사 특권만을 가리킨다고 볼 수 있습니다.
  rationale: 그리스어는 시민권과 ‘성소의 것들’을 말하지만 구체적 범위를 명시하지 않으므로, 번역도 그 폭을 유지해야 합니다.
  doctrine_reference: 해석의 폭을 보존하고 긴장을 해소하지 않음.
