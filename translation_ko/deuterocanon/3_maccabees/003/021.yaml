base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/021.yaml
  text: And in these matters[a], after making known to all their own countrymen our lack of resentment, and because of the alliance and the countless affairs entrusted to them from the beginning with sincerity, we decided to transform their status and deem them worthy of Alexandrian citizenship[b], and to appoint them as sharers in the things of the sanctuary.
  footnotes:
  - marker: a
    text: Or 'our forbearance' or 'our freedom from grudges'; the Greek term denotes not holding wrongs against someone.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the things of the sanctuary'; this may refer broadly to sacred privileges or responsibilities connected with the temple.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일들 가운데서, 그들의 동족 모두에게 우리의 원한 없음[a]을 알리고, 동맹과 더불어 처음부터 성실하게 그들에게 맡겨진 수많은 일들 때문에, 우리는 그들의 지위를 바꾸고 알렉산드리아 시민권[b]을 받을 만한 사람들로 여기며, 성소의 것들에 참여하는 자들로 삼기로 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘원한 없음’입니다. 원문은 누군가에게 해를 입은 일을 붙들고 있지 않음을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘성소의 것들’입니다. 이는 성전과 관련된 특권이나 책임을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμνησικακίαν
  english_pob_choice: lack of resentment
  chosen_korean: 원한 없음
  alternatives_korean:
  - 분한을 품지 않음
  - 원한을 잊음
  - 앙심 없음
  lexicon: LSJ
  rationale: 원어는 해를 입은 일을 붙들고 있지 않는 태도를 뜻하므로, 문맥상 자연스러운 ‘원한 없음’으로 옮겨 그 부정적 상태를 드러냈습니다.
- source_word: ὁμοφύλους
  english_pob_choice: their own countrymen
  chosen_korean: 그들의 동족
  alternatives_korean:
  - 같은 민족 사람들
  - 동포
  - 동족 사람들
  lexicon: LSJ
  rationale: 정치·공동체적 맥락에서 같은 혈통/민족의 사람들을 가리키므로, 생물학적 뉘앙스를 과도하게 좁히지 않는 ‘동족’이 적절합니다.
- source_word: τὰ πεπιστευμένα
  english_pob_choice: the countless affairs entrusted to them
  chosen_korean: 맡겨진 수많은 일들
  alternatives_korean:
  - 맡겨진 많은 일들
  - 위탁된 일들
  - 신임받은 일들
  lexicon: LSJ
  rationale: 완료분사로 된 표현이 ‘맡겨진 책임/사안들’을 뜻하므로, ‘수많은 일들’로 옮겨 양적 강조를 살리되 위탁의 의미를 유지했습니다.
- source_word: μετὰ ἁπλότητος
  english_pob_choice: with sincerity
  chosen_korean: 성실하게
  alternatives_korean:
  - 진실하게
  - 순전하게
  - 단순하게
  lexicon: LSJ
  rationale: 여기서 ἁπλότης는 단순함보다 진실하고 꾸밈없는 태도를 뜻하므로, 공문체에서 자연스러운 ‘성실하게’로 옮겼습니다.
- source_word: ἐξαλλοιῶσαι
  english_pob_choice: transform their status
  chosen_korean: 그들의 지위를 바꾸고
  alternatives_korean:
  - 그들을 변화시키고
  - 그들의 신분을 바꾸고
  - 그들의 상태를 바꾸고
  lexicon: LSJ
  rationale: 문맥상 시민권 부여와 직결된 지위 변화이므로, 과도하게 해석하지 않으면서도 행정적 변화를 드러내는 ‘지위를 바꾸고’로 표현했습니다.
- source_word: πολιτίας αὐτοὺς Ἀλεξανδρέων
  english_pob_choice: Alexandrian citizenship
  chosen_korean: 알렉산드리아 시민권
  alternatives_korean:
  - 알렉산드리아인의 시민권
  - 알렉산드리아 시민 자격
  - 알렉산드리아의 시민권
  lexicon: LSJ
  rationale: πολιτεία는 시민권/시민적 지위를 가리키므로, 현대 한국어에서 가장 직접적인 ‘시민권’으로 옮겼습니다.
- source_word: τῶν εἰς ἱερὸν
  english_pob_choice: the things of the sanctuary
  chosen_korean: 성소의 것들
  alternatives_korean:
  - 성소에 속한 것들
  - 성전의 일들
  - 성소 관련 특권들
  lexicon: LSJ
  rationale: 표현이 압축적이어서 특정 특권으로 미리 좁히기보다, 원문 범위를 보존하는 직역형 표현을 택했습니다.
theological_decisions:
- issue: 알렉산드리아 시민권과 성소 참여의 범위
  chosen_reading: 이 절은 유대인들에게 주어진 시민적 승격과 성소 관련 참여를 말하지만, 그 법적·예배적 범위를 더 좁게 단정하지는 않습니다.
  alternative_readings:
  - 완전한 정치적 동화로 이해할 수 있습니다.
  - 성전 봉사 특권만을 가리킨다고 볼 수 있습니다.
  rationale: 그리스어는 시민권과 ‘성소의 것들’을 말하지만 구체적 범위를 명시하지 않으므로, 번역도 그 폭을 유지해야 합니다.
  doctrine_reference: 해석의 폭을 보존하고 긴장을 해소하지 않음.
