  text: concerning our campaign into Asia[a], which you yourselves also know, which by the unfailing alliance of the gods was brought, as was fitting, to its conclusion[b],
  footnotes:
  - marker: a
    text: Or 'by the invincible alliance of the gods.' The adjective ἀρρωστῷ literally suggests something not weak or infirm, hence firm, unshaken, or unfailing.
    reason: lexical_alternative
  - marker: b
    text: Or 'was carried through to the end.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아시아로의 우리 원정에 관해서[a], 여러분도 직접 알고 계시듯이, 그것은 신들[b]의 흔들림 없는 동맹으로 마땅한 대로 끝까지 이르게 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아시아를 향한 우리의 군사 원정에 관하여’. ἐπιστρατεία는 군사 원정·출정의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘흔들림 없는 신들 사이의 동맹’. ἀρρωστός는 문자적으로 ‘약하지 않은’ 의미이므로, ‘unfailing’과 ‘invincible’ 모두 가능한 해석입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστρατείας
  english_pob_choice: campaign
  chosen_korean: 원정
  alternatives_korean:
  - 군사 अभियान
  - 군사 원정
  - 전쟁 원정
  lexicon: LSJ
  rationale: 전쟁 목적의 군사 행동을 가리키므로, 현대 한국어에서는 ‘원정’이 가장 자연스럽고 간결하게 군사적 성격을 살립니다.
- source_word: εἰς τὴν Ἀσίαν
  english_pob_choice: into Asia
  chosen_korean: 아시아로
  alternatives_korean:
  - 아시아 안으로
  - 아시아를 향해
  lexicon: LSJ
  rationale: εἰς + 장소는 방향성을 띠므로, ‘아시아로’가 이동·진입의 뉘앙스를 가장 सीधे하게 반영합니다.
- source_word: ἀρρωστῷ συμμαχίᾳ
  english_pob_choice: the unfailing alliance
  chosen_korean: 흔들림 없는 동맹
  alternatives_korean:
  - 무너지지 않는 동맹
  - 견고한 동맹
  - 불패의 동맹
  lexicon: LSJ
  rationale: ἀρρωστῷ는 문자적으로는 ‘약하지 않은, 허약하지 않은’ 뜻이어서, 관계의 견고함을 드러내는 ‘흔들림 없는’이 자연스럽고 과장도 덜합니다.
- source_word: τῶν θεῶν
  english_pob_choice: of the gods
  chosen_korean: 신들
  alternatives_korean:
  - 하나님
  - 신들의
  - 신들의 도움
  lexicon: LSJ
  rationale: 본문은 다신교적 왕실 발화를 그대로 전하므로, 단수의 ‘하나님’으로 정규화하지 않고 복수 ‘신들’을 유지해야 합니다.
- source_word: κατὰ λόγον
  english_pob_choice: as was fitting
  chosen_korean: 마땅한 대로
  alternatives_korean:
  - 이치에 맞게
  - 당연하게
  - 합당하게
  lexicon: LSJ
  rationale: 이 관용구는 결과가 기대나 적합성에 맞았다는 평가를 담으므로, 문맥상 ‘마땅한 대로’가 가장 매끈합니다.
theological_decisions:
- issue: 다신교 표현의 보존
  chosen_reading: ‘신들’로 옮겨, 화자가 실제로 가진 종교적 관점을 유지했습니다.
  alternative_readings:
  - ‘하나님’으로 단수화
  - ‘신적인 도움’으로 일반화
  rationale: 3마카베오의 왕실 연설은 역사적·종교적 음성을 보존하는 것이 중요하므로, 본문의 복수 표현을 지워 정통 신학으로 흡수하지 않았습니다.
  doctrine_reference: 원문 우선 원칙; 번역은 화자의 실제 발화를 재현해야 하며, 본문이 말하지 않는 단수 신론을 주입하지 않습니다.
- issue: 결말 표현의 강도
  chosen_reading: ἐπὶ τέλος ἀχθείσης를 ‘끝까지 이르게 되었습니다’로 옮겨 완료·도달의 의미를 유지했습니다.
  alternative_readings:
  - ‘완성되었습니다’
  - ‘끝마쳤습니다’
  rationale: 동사구는 단순 종결보다 ‘어떤 지점까지 이끌려 감’의 뉘앙스가 있어, 과정성과 완료성을 함께 보존했습니다.
  doctrine_reference: 문맥상 행위의 종결을 말하는 서술이므로, 과도한 신학적 해석 없이 서술 의미를 우선합니다.
