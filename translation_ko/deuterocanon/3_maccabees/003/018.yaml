translation:
  language: ko
  text: 오래된 오만에 사로잡혀[a], 그들은 우리가 들어가는 것을 막았고, 우리의 힘에 미치지 못했으며, 그 힘으로 우리는 모든 사람을 향해 호의를 품고 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오래된 오만에 휩쓸려’로 옮길 수 있습니다. 그리스어 τύφοις φερόμενοι παλαιοτέροις는 오래전부터 이어진 오만에 이끌리는 상태를 압축적으로 표현합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τύφοις φερόμενοι παλαιοτέροις
  english_pob_choice: carried away by ancient conceit / arrogance
  chosen_korean: 오래된 오만에 사로잡혀
  alternatives_korean:
  - 옛 자만에 끌려
  - 오래된 교만에 휩쓸려
  - 오랜 오만에 사로잡혀
  lexicon: LSJ; BDAG
  rationale: τύφοις는 단순한 ‘교만’보다 자기과시적 오만을 가리키므로 ‘오만’이 적절하고, φερόμενοι는 수동적으로 휩쓸리는 상태를 드러내어 ‘사로잡혀’로 옮겼습니다. παλαιοτέροις는 오래전부터 굳어진 성격을 나타내므로 ‘오래된’이 가장 자연스럽습니다.
- source_word: εἶρξαν ἡμᾶς τῆς εἰσόδου
  english_pob_choice: they barred us from entry
  chosen_korean: 그들은 우리의 출입을 막았고
  alternatives_korean:
  - 그들은 우리가 들어가는 것을 막았고
  - 그들은 우리를 입구에서 막았고
  - 그들은 우리에게 출입을 금했으며
  lexicon: LSJ; BDAG
  rationale: εἶρξαν은 들어오지 못하게 막는 뜻이므로 ‘출입을 막다’가 간결하고 본문 구조도 잘 살립니다. 명사구 τῆς εἰσόδου는 한국어에서 자연스럽게 ‘출입’으로 처리했습니다.
- source_word: λειπόμενοι τῆς ἡμετέρας ἀλκῆς
  english_pob_choice: falling short of our strength
  chosen_korean: 우리의 힘에 미치지 못했으며
  alternatives_korean:
  - 우리의 힘보다 부족했으며
  - 우리의 힘에 못 미쳤으며
  - 우리의 힘에 결여되어
  lexicon: BDAG; LSJ
  rationale: λειπόμενοι는 단순 결핍보다 비교적 부족함을 나타내므로 ‘미치지 못하다’가 가장 정확합니다. ἀλκή는 군사력만이 아니라 능력/힘의 뉘앙스를 가지므로 ‘힘’으로 옮겼습니다.
- source_word: φιλανθρωπίαν
  english_pob_choice: goodwill
  chosen_korean: 호의를 품고 있습니다
  alternatives_korean:
  - 인류애를 지니고 있습니다
  - 자비심을 가지고 있습니다
  - 사람들을 향한 호의를 가지고 있습니다
  lexicon: BDAG
  rationale: φιλανθρωπία는 인간에 대한 호의와 친절을 뜻하므로 ‘호의’가 가장 직접적입니다. 문맥상 상태적 소유를 나타내는 ἔχομεν은 한국어에서 ‘품고 있습니다’로 자연스럽게 풀었습니다.
theological_decisions:
- issue: πρὸς ἅπαντας ἀνθρώπους의 포괄성
  chosen_reading: 모든 사람을 향해
  alternative_readings:
  - 모든 남자를 향해
  - 모든 인간을 향해
  rationale: ἀνθρώπους는 성별 한정이 없는 일반적 인간을 가리키므로, 현대 한국어에서도 성중립적이고 자연스러운 ‘모든 사람’이 본문 의도를 가장 잘 드러냅니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
