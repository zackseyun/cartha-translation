- from: 우리는 콜로에 시리아와 페니키아에 거주하는 민족들을 창과 무력의 힘으로가 아니라, 온유와 큰 인애로 양육해야 한다고 여겼습니다[a][b]. 그래서 기꺼이 그들에게 선을 베풀었습니다.
