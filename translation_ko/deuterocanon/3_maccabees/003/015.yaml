base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/015.yaml
  text: We considered that the nations inhabiting Coele-Syria and Phoenicia should be nurtured not by the force of the spear[a], but with gentleness and great kindness[b], having gladly done them good.
  footnotes:
  - marker: a
    text: Or 'nurtured' or 'fostered'; the Greek verb evokes rearing or nursing, using paternalistic imagery for the treatment of subject peoples.
    reason: lexical_alternative
  - marker: b
    text: Literally 'not by the force of the spear,' a military image for coercive rule.
    reason: cultural_note
translation:
  language: ko
  text: 우리는 콜로에 시리아와 페니키아에 거주하는 민족들을 창과 무력의 힘으로가 아니라, 온유와 큰 인애로 양육해야 한다고 여겼습니다[a][b]. 그래서 기꺼이 그들에게 선을 베풀었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘창의 힘으로가 아니라’이며, 군사적 강압을 가리키는 구체적 표현입니다.
    reason: cultural_note
  - marker: b
    text: ἐπιεικείᾳ와 πολλῇ φιλανθρωπίᾳ는 각각 온유함/관용과 ‘사람 사랑’의 뉘앙스를 지닌 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡγησάμεθα
  english_pob_choice: We considered
  chosen_korean: 우리는 ... 여겼습니다
  alternatives_korean:
  - 우리는 ... 생각했습니다
  - 우리는 ... 판단했습니다
  - 우리는 ... 간주했습니다
  lexicon: BDAG
  rationale: aorist middle ἡγέομαι의 숙고·판단 의미를 살려, 정책적 결정을 나타내는 문맥에 맞게 ‘여기다’로 옮겼습니다.
- source_word: μὴ βίᾳ δόρατος
  english_pob_choice: not by the force of the spear
  chosen_korean: 창과 무력의 힘으로가 아니라
  alternatives_korean:
  - 창의 힘으로가 아니라
  - 무력과 창의 힘으로가 아니라
  - 무력으로가 아니라
  lexicon: LSJ
  rationale: βία와 δόρυ가 이루는 구체적 군사 이미지를 살리되, 한국어에서 자연스럽게 읽히도록 ‘창과 무력의 힘’으로 옮겼습니다.
- source_word: ἐπιεικείᾳ δὲ καὶ πολλῇ φιλανθρωπίᾳ
  english_pob_choice: with gentleness and great kindness
  chosen_korean: 온유와 큰 인애로
  alternatives_korean:
  - 관용과 큰 친절로
  - 온화함과 큰 자비로
  - 너그러움과 큰 인애로
  lexicon: BDAG
  rationale: ἐπιείκεια의 완곡한 관용·온화함과 φιλανθρωπία의 ‘사람을 사랑함/인애’의 뉘앙스를 함께 살리기 위해, 교회적 표현이지만 본문과 잘 맞는 ‘온유’와 ‘큰 인애’를 택했습니다.
- source_word: τιθηνήσασθαι
  english_pob_choice: should be nurtured
  chosen_korean: 양육해야 한다
  alternatives_korean:
  - 기르셔야 한다
  - 돌보아 키워야 한다
  - 유아처럼 보살펴야 한다
  lexicon: LSJ
  rationale: 이 동사는 기르다/젖먹이다의 양육 이미지를 띠므로, 통치의 가부장적 비유를 드러내는 ‘양육하다’를 사용했습니다.
- source_word: τὰ κατοικοῦντα Κοίλην Συρίαν καὶ Φοινίκην ἔθνη
  english_pob_choice: the nations inhabiting Coele-Syria and Phoenicia
  chosen_korean: 콜로에 시리아와 페니키아에 거주하는 민족들
  alternatives_korean:
  - 코일레 시리아와 페니키아에 사는 민족들
  - 콜레 시리아와 페니키아에 거하는 민족들
  - 그곳에 사는 나라들
  lexicon: BDAG
  rationale: ἔθνη는 ‘민족들/나라들’ 모두 가능하지만, 거주 표현과 함께 자연스럽고 본문의 대상 집단을 드러내는 ‘민족들’로 옮겼습니다.
- source_word: Κοίλην Συρίαν
  english_pob_choice: Coele-Syria
  chosen_korean: 콜로에 시리아
  alternatives_korean:
  - 코일레 시리아
  - 홀로 시리아
  lexicon: LSJ
  rationale: 고유 지명은 현대 외래어 표기법에 맞춰 음역하되, 한국어 독자가 읽기 쉬운 형태로 ‘콜로에 시리아’를 채택했습니다.
- source_word: εὖ ποιήσαντες ἀσμένως
  english_pob_choice: having gladly done them good
  chosen_korean: 기꺼이 그들에게 선을 베풀었습니다
  alternatives_korean:
  - 기쁘게 그들에게 잘해 주었습니다
  - 즐거이 그들을 선대했습니다
  - 기꺼이 그들에게 유익을 주었습니다
  lexicon: BDAG
  rationale: εὖ ποιέω의 ‘잘해 주다/선을 행하다’와 ἀσμένως의 기꺼움·기쁨을 간결하게 합쳐, 의미를 유지하면서 한국어 문장으로 매끄럽게 정리했습니다.
theological_decisions:
- issue: 통치의 폭력 대 양육의 은유
  chosen_reading: ‘창과 무력의 힘’과 ‘양육하다’를 함께 살려, 지배의 비인격적 폭력성과 양육 비유를 모두 드러냈습니다.
  alternative_readings:
  - ‘무력으로 통치하다’로 완화함
  - ‘돌보다’로 바꾸어 은유를 약화함
  rationale: 본문은 단순한 행정이 아니라 군사적 강압과 양육적 통치를 대비합니다. 이 긴장을 지우지 않는 것이 source-direct 번역에 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §5
