  rationale: ἐπιείκεια의 완곡한 관용·온화함과 φιλανθρωπία의 ‘사람을 사랑함/인애’의 뉘앙스를 함께 살리기 위해, 교회적 표현이지만 본문과 잘 맞는 ‘온유’와 ‘큰 인애’를 택했습니다.
