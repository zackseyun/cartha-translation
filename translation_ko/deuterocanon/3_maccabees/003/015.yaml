  rationale: 원문의 군사적 은유(βίᾳ δόρατος), 양육의 비유(τιθηνήσασθαι), 그리고 기꺼이 선을 베푸는 분사구(εὖ ποιήσαντες ἀσμένως)를 모두 보존했습니다. 지명은 통용적인 ‘코일레 시리아’로 바로잡았고, 표현은 현대 한국어 합쇼체에 맞추되 원문의 왕권적·가부장적 수사를 완화하지 않았습니다.
