base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/029.yaml
  text: But every place where a Jew is discovered while being concealed shall become inaccessible and burned with fire[a], and it shall appear altogether useless to every mortal creature for all time.
  footnotes:
  - marker: a
    text: Or 'where a Jew is detected while hidden'; the Greek around τὸ σύνολον σκεπαζόμενος is difficult, and the sense is that any place harboring a concealed Jew is to be treated as cursed and destroyed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 유대인이 완전히 몸을 숨긴 채 발각되는 모든 곳은 들어갈 수 없고 불타는 곳이 되어야 하며, 모든 죽을 생명체에게 영원토록 완전히 쓸모없는 것으로 드러날 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 τὸ σύνολον σκεπαζόμενος는 문법과 의미가 어려운 구절입니다. 이를 ‘완전히 몸을 숨긴 채’로 옮겼습니다. 또는 ‘숨겨진 채 발각되는 유대인이 있는 곳’으로 이해할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ... τόπος
  english_pob_choice: every place
  chosen_korean: 어디든지
  alternatives_korean:
  - 모든 곳
  - 모든 장소
  lexicon: LSJ
  rationale: 분배적 범위를 넓게 살리기 위해, 판결문의 포괄성을 한국어로 자연스럽게 드러내는 표현을 택했습니다.
- source_word: οὗ ἐὰν φωραθῇ
  english_pob_choice: where ... is discovered
  chosen_korean: 발견되는 곳은 어디든지
  alternatives_korean:
  - 드러나는 곳은 어디든지
  - 적발되는 곳은 어디든지
  lexicon: LSJ
  rationale: φωράω의 핵심인 ‘숨은 것이 드러나다/발각되다’의 의미를 살리되, 한국어 법령체에 맞게 간결하게 옮겼습니다.
- source_word: σκεπαζόμενος
  english_pob_choice: being concealed
  chosen_korean: 숨어 있는 상태에서
  alternatives_korean:
  - 숨겨진 채
  - 가려진 상태에서
  lexicon: LSJ
  rationale: 수동 분사와 현재적 상태를 함께 반영하여, ‘숨겨진 사람’이라기보다 ‘숨고 있는 상태’라는 뉘앙스를 유지했습니다.
- source_word: ἄβατος καὶ πυριφλεγὴς γινέσθω
  english_pob_choice: shall become inaccessible and burned with fire
  chosen_korean: 접근할 수 없는 곳이 되고 불에 타게 될 것이며
  alternatives_korean:
  - 들어갈 수 없는 곳이 되고 불타게 될 것이며
  - 출입할 수 없고 불타는 곳이 될 것이며
  lexicon: LSJ
  rationale: ἄβατος는 단순한 ‘폐쇄’보다 접근 불가능함을, πυριφλεγής는 상태적 화염을 나타내므로 결과를 풀어 ‘불에 타게 될’로 옮겼습니다.
- source_word: πάσῃ θνητῇ φύσει
  english_pob_choice: to every mortal creature
  chosen_korean: 모든 죽을 존재에게
  alternatives_korean:
  - 모든 죽을 피조물에게
  - 모든 유한한 존재에게
  lexicon: LSJ
  rationale: literal한 ‘죽을 본성’보다는 문맥상 범위를 보존하는 ‘죽을 존재’가 더 자연스럽고, 인류로 좁히지 않도록 했습니다.
- source_word: καθʼ ἅπαν ἄχρηστος φανήσεται εἰς τὸν ἀεὶ χρόνον
  english_pob_choice: it shall appear altogether useless ... for all time
  chosen_korean: 영원히 완전히 쓸모없는 것으로 드러날 것입니다
  alternatives_korean:
  - 항상 완전히 쓸모없게 보일 것입니다
  - 영원토록 전혀 쓸모없는 것으로 나타날 것입니다
  lexicon: LSJ
  rationale: φανήσεται의 ‘드러나다/나타나다’와 ἄχρηστος의 ‘쓸모없음’을 함께 살려, 단정적 판결문의 어조를 유지했습니다.
theological_decisions:
- issue: 유대인에 대한 박해를 지시하는 법령 문체
  chosen_reading: 본문의 명령문적 어조를 그대로 살려, 공동체 전체에 대한 적대적 처벌 조항으로 번역했습니다.
  alternative_readings:
  - 완곡하게 ‘유대 사람’으로 순화하는 방식
  - 설명적으로 ‘유대인을 숨긴 곳’으로 풀어 쓰는 방식
  rationale: 이 본문은 박해 명령의 공적·법적 강도를 지니므로, 현대어에서도 그 폭력성과 제재성을 약화시키지 않는 것이 원문 의도에 더 충실합니다.
  doctrine_reference: 원문 우선 원칙; 역사 서술의 법령체 보존
- issue: πάσῃ θνητῇ φύσει의 범위
  chosen_reading: ‘모든 죽을 존재’로 옮겨, 인간에 한정하지 않는 보편성을 유지했습니다.
  alternative_readings:
  - ‘모든 인간’으로 제한하는 해석
  - ‘모든 죽을 피조물’로 더 문자적으로 옮기는 해석
  rationale: 그리스어 표현의 넓이를 보존해야 하므로, 인류 한정 해석을 피하고 보편적 파괴 선언으로 읽히게 했습니다.
  doctrine_reference: 어휘 의미 범위 보존
