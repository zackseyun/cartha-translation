lexical_decisions:
- source_word: οἱ δὲ Ἰουδαῖοι
  english_pob_choice: But the Jews
  chosen_korean: 그런데 유대인들은
  alternatives_korean:
  - 하지만 유대인들은
  - 그리고 유대인들은
  lexicon: LSJ
  rationale: δέ의 대조를 살려 ‘그런데’로 옮겼고, Ἰουδαῖοι는 이 문맥에서 일반적인 민족 명칭인 ‘유대인들’로 옮겼습니다.
- source_word: εὔνοιαν
  english_pob_choice: goodwill
  chosen_korean: 호의
  alternatives_korean:
  - 선의
  - 호의적 태도
  - 우호
  lexicon: LSJ
  rationale: εὔνοια는 관계적 ‘호의/좋은 뜻’을 가리키므로, 왕들에게 향한 태도를 자연스럽게 드러내는 ‘호의’가 적절합니다.
- source_word: πίστιν
  english_pob_choice: loyalty
  chosen_korean: 충성
  alternatives_korean:
  - 신실함
  - 충실함
  - 믿음
  lexicon: BDAG
  rationale: 여기서는 종교적 ‘믿음’이 아니라 왕들을 향한 정치적·사회적 신의와 충실성을 뜻하므로 ‘충성’이 가장 분명합니다.
- source_word: ἀδιάστροφον
  english_pob_choice: unwavering
  chosen_korean: 변함없는
  alternatives_korean:
  - 흔들리지 않는
  - 굳건한
  - 일관된
  lexicon: LSJ
  rationale: ‘돌아선다/변질된다’는 뉘앙스를 지닌 형용사로, 호의와 충성의 지속성을 함께 수식하는 ‘변함없는’이 자연스럽습니다.
- source_word: φυλάσσοντες
  english_pob_choice: maintaining
  chosen_korean: 지키고 있었습니다
  alternatives_korean:
  - 유지하고 있었습니다
  - 간직하고 있었습니다
  - 보존하고 있었습니다
  lexicon: BDAG
  rationale: φυλάσσω는 본래 ‘지키다, 보존하다’이므로 추상명사와 결합한 여기서는 그 상태를 지속적으로 ‘지키고 있다’로 옮겼습니다.
theological_decisions:
- issue: πίστις의 비신학적 정치 문맥 번역
  chosen_reading: ‘충성’으로 옮겨 왕들을 향한 신의와 충실성을 나타냈습니다.
  alternative_readings:
  - 믿음
  - 신실함
  - 충실함
  rationale: 문맥상 대상이 왕들이므로, 신앙적 ‘믿음’보다 관계적·정치적 충실성을 드러내는 번역이 필요합니다.
  doctrine_reference: POB contested-terms principle for πίστις; context-sensitive rendering
