  text: And by making their hostility toward us plain, they, alone among the nations, act arrogantly toward kings and toward their own benefactors, and are willing to offer nothing sincere.
translation:
  language: ko
  text: 그리고 그들이 우리에게 품는 적의를 드러내 보이면서, 그들은 민족들 가운데서 홀로 왕들에게도, 자기들의 은인들에게도 거만하게 굴며, 아무런 진실한 것을 내놓으려 하지 않습니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 직역하면 “적의를 분명히 드러내면서”입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: δυσμένειαν ἔκδηλον καθιστάντες
  english_pob_choice: making their hostility toward us plain
  chosen_korean: 우리에게 품는 적의를 드러내 보이면서
  alternatives_korean:
  - 우리에게 대한 적의를 분명히 드러내며
  - 우리에게 품은 적의를 노골적으로 보이면서
  lexicon: δυσμένεια / ἔκδηλος / καθίστημι
  rationale: 적의(적대감)를 직접적으로 살리고, ἔκδηλον καθιστάντες의 ‘드러나게 하다’는 의미를 자연스러운 한국어로 옮겼습니다.
- source_word: ὡς μονώτατοι τῶν ἐθνῶν
  english_pob_choice: they, alone among the nations
  chosen_korean: 그들은 민족들 가운데서 홀로
  alternatives_korean:
  - 그들은 나라들 가운데 유독
  - 그들은 모든 민족 중 오직
  lexicon: μονώτατοι / τῶν ἐθνῶν
  rationale: μονώτατοι의 ‘홀로, 유일하게’라는 강조를 살려, 비교 대상인 ἐθνῶν은 ‘민족들’로 옮겼습니다.
- source_word: ὑψαυχνοῦντες
  english_pob_choice: act arrogantly
  chosen_korean: 거만하게 굴며
  alternatives_korean:
  - 오만하게 굴며
  - 고압적으로 행동하며
  lexicon: ὑψαυχνέω
  rationale: 행동 양상을 나타내는 현재분사로서의 뉘앙스를 살려, 한국어에서는 동작 상태를 자연스럽게 표현했습니다.
- source_word: οὐδὲν γνήσιον βούλονται φέρειν
  english_pob_choice: are willing to offer nothing sincere
  chosen_korean: 아무런 진실한 것을 내놓으려 하지 않습니다
  alternatives_korean:
  - 아무런 진실한 것을 바치려 하지 않습니다
  - 무엇 하나 성실한 것을 내놓으려 하지 않습니다
  lexicon: γνήσιος / φέρω
  rationale: POB의 ‘sincere’를 따라 γνήσιον을 ‘진실한’으로 번역하고, φέρειν은 문맥상 ‘내놓다’로 처리해 의도와 태도의 결핍을 드러냈습니다.
theological_decisions:
- issue: 민족들과 왕들, 은인들에 대한 태도 묘사
  chosen_reading: 이 절은 이스라엘의 배타성이 아니라, 그들이 주변 권력과 은인들에게까지 보이는 교만과 불성실을 고발하는 문맥으로 읽었습니다.
  alternative_readings:
  - 단순한 외교적 무례로만 읽는 해석
  - 집단적 민족주의 비판으로만 좁히는 해석
  rationale: 본문의 논지는 ‘우리에게 대한 적의’가 드러난 결과로서, 왕들과 은인들에게까지 확대되는 교만과 진실성의 부재를 비판하는 데 있습니다.
  doctrine_reference: 문맥 이해 / 수사적 비난
- issue: γνήσιον의 윤리적 성격
  chosen_reading: ‘진실한 것’으로 옮겨 태도와 말의 진정성 결핍을 드러냈습니다.
  alternative_readings:
  - ‘진짜인 것’처럼 물질적 진정성으로 이해하는 해석
  - ‘순수한 것’으로 추상화하는 해석
  rationale: 여기서는 물건의 진위보다, 상대에게 내보이는 태도와 약속의 진실성이 핵심이므로 윤리적·관계적 표현을 택했습니다.
  doctrine_reference: 언어 윤리 / 성실성
