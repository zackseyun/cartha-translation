base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/002.yaml
  text: While these matters were being arranged[a], a hostile rumor was spread against the nation among people of like mind for mistreatment, a pretext being given for their purpose[c][b], as though they were being hindered from their customary laws.
  footnotes:
  - marker: a
    text: Or 'a hostile report was circulated against the people to like-minded persons for ill-treatment.'
    reason: lexical_alternative
  - marker: b
    text: '''An occasion'' could also be rendered ''a pretext'' or ''an opportunity''; the Greek ἀφορμή can carry any of these nuances in context.'
    reason: lexical_alternative
  - marker: c
    text: '''Their customary laws'' may also be understood as ''their ancestral laws'' or ''their established customs.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일들이 정리되고 있을 때, 민족에 대한 적대적인 소문이 해를 끼치려는 같은 뜻을 가진 사람들 사이에 퍼져 나갔고, 그들의 목적을 위한 구실이 주어졌습니다[b], 마치 그들이 자기들의 전통적인 법들에서 막히는 것처럼 말입니다[a][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기들의 관습적인 법들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘구실’ 대신 ‘기회’나 ‘계기’로 옮길 수 있으며, ἀφορμή는 문맥에 따라 이런 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘전통적인 법들’은 ‘조상 전래의 법들’ 또는 ‘정해진 관습들’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκονομουμένων
  english_pob_choice: While these matters were being arranged
  chosen_korean: 이 일들이 정리되고 있을 때
  alternatives_korean:
  - 이 일들이 처리되고 있을 때
  - 이 일들이 관리되고 있을 때
  - 이 사안들이 정돈되고 있을 때
  lexicon: LSJ
  rationale: 진행 중인 행정적 조치를 자연스러운 현대 한국어로 옮기되, 누가 정리하는지 단정하지 않기 위해 수동적 상황을 살렸습니다.
- source_word: φήμη δυσμενὴς
  english_pob_choice: a hostile rumor
  chosen_korean: 적대적인 소문
  alternatives_korean:
  - 불리한 소문
  - 악의적인 소문
  - 험악한 소문
  lexicon: LSJ
  rationale: φήμη의 ‘소문/평판’과 δυσμενής의 적대성을 함께 드러내기 위해 ‘적대적인 소문’으로 옮겼습니다.
- source_word: ἀφόρμης ... διδομένης εἰς διάθεσιν
  english_pob_choice: a pretext being given for their purpose
  chosen_korean: 그들의 목적을 위한 구실이 주어졌고
  alternatives_korean:
  - 그들의 의도를 위한 계기가 주어졌고
  - 그들의 목적을 위한 기회가 주어졌고
  - 그들의 성향을 위한 구실이 주어졌고
  lexicon: LSJ
  rationale: ἀφορμή는 문맥상 ‘구실/계기/기회’의 폭을 가지므로, 본문이 시사하는 적대적 촉발점을 살려 ‘구실’로 번역했습니다. διάθεσιν은 여기서 그들이 추구하는 방향성, 곧 ‘목적’으로 자연스럽게 풀었습니다.
- source_word: νομίμων
  english_pob_choice: their customary laws
  chosen_korean: 자기들의 전통적인 법들
  alternatives_korean:
  - 자기들의 관습적인 법들
  - 자기들의 조상 전래의 법들
  - 자기들의 정해진 규례들
  lexicon: LSJ
  rationale: τὰ νόμιμα는 단순한 규칙보다 전통적으로 지켜 온 법/관습을 가리킬 수 있으므로, 문맥상 자연스러운 ‘전통적인 법들’로 옮겼습니다.
theological_decisions:
- issue: κατὰ τοῦ γένους의 집단 지시어
  chosen_reading: 민족
  alternative_readings:
  - 백성
  - 사람들
  - 족속
  rationale: 본문은 유대 집단 전체를 향한 적대적 선동을 말하므로, 현대 한국어에서 민족적·집단적 범위를 비교적 중립적으로 드러내는 ‘민족’을 택했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 대상 소문의 성격과 ἀφόρμης의 처리
  chosen_reading: 구실
  alternative_readings:
  - 기회
  - 계기
  - 전제
  rationale: 문맥은 단순한 중립적 ‘기회’보다 적대 행위를 정당화하는 명분에 가깝기 때문에, 본문이 암시하는 비난의 기능을 살려 ‘구실’로 반영했습니다.
  doctrine_reference: Translation philosophy §3, §5
