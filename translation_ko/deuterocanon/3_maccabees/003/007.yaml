base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/007.yaml
  text: But they kept spreading talk about the disagreement over acts of homage and foods[a], saying that these people would not become of one way with either the king or his forces, but were hostile and strongly opposed to the affairs of state[b]; and they attached to them no ordinary fear.
  footnotes:
  - marker: a
    text: Or 'worship and foods.' The Greek for 'acts of homage' can also be rendered 'worship' or 'obeisances,' preserving ambiguity between religious and courtly acts of reverence.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'they attached to them no ordinary fear,' meaning they burdened them with a serious public fear or suspicion.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 경배와 음식에 관한 분쟁을 두고 계속 떠들어댔습니다[a]. 그들은 이 사람들이 왕이나 그 권세들과도 한결같이 따르지 않을 것이며, 오히려 적대적이고 나라의 일들에 크게 맞서며[b], 그들에게 보통이 아닌 두려움을 덧씌웠다고 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘경배’는 왕에게 드리는 예와 종교적 예배의 가능성을 함께 남기는 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘나라의 일들에’인데, 문맥상 공적·정치적 질서를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκυνήσεων
  english_pob_choice: acts of homage
  chosen_korean: 경배
  alternatives_korean:
  - 예배
  - 경배 행위
  - 절
  lexicon: LSJ
  rationale: 이 문맥은 왕권 앞의 외적 경배와 종교적 예배를 함께 떠올리게 하므로, 보다 넓은 의미의 ‘경배’로 옮겨 정치적·의례적 애매성을 살렸습니다.
- source_word: τροφῶν
  english_pob_choice: foods
  chosen_korean: 음식
  alternatives_korean:
  - 식품
  - 먹는 것
  - 음식 규정
  lexicon: LSJ
  rationale: 헬라어 자체는 단순히 ‘음식들’을 말하므로, 해석을 앞세운 ‘음식 규정’보다 직접적인 ‘음식’이 원문에 더 가깝습니다.
- source_word: ὁμοτρόπως ... γίνεσθαι
  english_pob_choice: be in accord / become of one way
  chosen_korean: 한결같이 따르다
  alternatives_korean:
  - 같은 마음이 되다
  - 같은 방식이 되다
  - 동조하다
  lexicon: LSJ
  rationale: 표현의 핵심은 동일한 방식과 태도로 맞추는 것이어서, 한국어로는 자연스러우면서도 ‘한 방식/한 결’의 뉘앙스를 살린 ‘한결같이 따르다’로 옮겼습니다.
- source_word: ταῖς δυνάμεσιν
  english_pob_choice: his forces / the authorities
  chosen_korean: 그 권세들
  alternatives_korean:
  - 권력 기관들
  - 군대
  - 당국
  lexicon: LSJ
  rationale: 문맥상 왕의 지배력과 집행력 전반을 가리킬 수 있어, 군사력으로만 좁히지 않고 포괄적인 ‘권세들’로 옮겼습니다.
- source_word: περιήψαντο
  english_pob_choice: attached to them
  chosen_korean: 덧씌웠다고
  alternatives_korean:
  - 뒤집어씌웠다고
  - 부과했다고
  - 가했다
  lexicon: LSJ
  rationale: 원문은 ‘붙여 놓다/걸어 두다’의 비유로 공적 의심과 두려움을 누군가에게 얹는 뜻이어서, 한국어에서는 비난과 공포를 뒤집어씌우는 이미지가 드러나는 ‘덧씌웠다’로 옮겼습니다.
theological_decisions:
- issue: προσκυνήσεων을 종교적 예배로만 좁힐지, 왕 앞의 경배/예를 포함하는 넓은 의미로 둘지
  chosen_reading: 경배
  alternative_readings:
  - 예배
  - 절
  rationale: 이 절은 유대인들의 비협조를 왕권에 대한 정치적 문제로 부각시키는 장면이므로, 종교적 예배로만 한정하면 원문의 의도된 애매성이 사라집니다. 따라서 경배로 두어 왕 앞의 예와 종교적 숭배 가능성을 함께 남겼습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 3
- issue: τοῖς πράγμασιν을 ‘나라의 일들’처럼 자연어로 풀되 정치적 성격을 얼마나 분명히 드러낼지
  chosen_reading: 나라의 일들
  alternative_readings:
  - 국정
  - 공적 일
  - 정치 질서
  rationale: 원문은 체제와 공공 질서를 향한 반대라는 정치적 비난을 담지만, 한국어에서 너무 제도적으로 좁히면 과잉해석이 될 수 있습니다. ‘나라의 일들’은 공적·정치적 뉘앙스를 유지하면서도 원문 범위를 넘지 않습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 6
