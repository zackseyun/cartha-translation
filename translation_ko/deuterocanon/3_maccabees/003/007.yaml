revisions:
- from: 그들은 경배와 음식에 관한 분쟁을 두고 계속 떠들어댔습니다[a]. 그들은 이 사람들이 왕이나 그 권세들과도 한결같이 따르지 않을 것이며, 오히려 적대적이고 나라의 일들에 크게 맞서며[b], 그들에게 보통이 아닌 두려움을 덧씌웠다고 말했습니다.
  to: 그들은 경배 행위와 음식에 관한 차이를 두고 계속 소문을 퍼뜨렸습니다[a]. 그들은 이 사람들이 왕이나 그의 군대와 같은 방식으로 행동하지 않고, 적대적이며 나라의 일에 크게 맞선다고 말했습니다. 그리고 그들을 두고 결코 가볍지 않은 두려움을 불러일으켰습니다[b].
  rationale: 원문의 불완료 과거 ἐθρύλουν은 ‘계속 소문을 퍼뜨렸다’로, 차이를 뜻하는 διάστασις는 ‘차이’로 옮겼습니다. 왕과 군대에 대한 비동조의 표현은 복종 여부를 덧붙이지 않고 ‘같은 방식으로 행동하지’로 번역했습니다. 마지막 절은 원문의 문장 구조에 따라 독립 문장으로 처리했으며, περιήψαντο의 비유적 표현은 자연스러운 한국어로 풀되 각주에서 직역과 공적 의심의 뉘앙스를 밝혔습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:53:49Z'
