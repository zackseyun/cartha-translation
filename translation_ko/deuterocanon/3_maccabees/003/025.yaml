  lexicon: LSJ
  rationale: δεσμοί는 구속을 뜻하므로 ‘철사슬’로 구체화하되, 완전한 구금을 나타내는 ‘사방에서 가두어’로 상태를 드러냈습니다.
- source_word: εἰς ἀνήκεστον καὶ δυσκλεῆ πρέποντα δυσμενέσιν βόθρον
  english_pob_choice: for an incurable and disgraceful pit fit for enemies
  chosen_korean: 적들에게 어울리는 고치기 어려운 치욕스러운 구덩이
  alternatives_korean:
  - 적들에게 어울리는 불치의 치욕스러운 구덩이
  - 원수에게 마땅한 회복 불가능하고 수치스러운 구덩이
  lexicon: LSJ
  rationale: ἀνήκεστος는 ‘고치기 어려운/회복 불가능한’의 뜻이므로 병리적 표현을 피하되 의미를 보존했고, βόθρος는 문자적 ‘구덩이’로 옮겼습니다.
