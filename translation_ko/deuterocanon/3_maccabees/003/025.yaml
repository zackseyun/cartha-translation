  lexicon: LSJ
  rationale: ὕβρις는 단순 폭력이 아니라 모욕적·능욕적 학대를 포함하고, σκυλμός는 약탈/탈취의 의미이므로 두 요소를 구분해 살렸습니다.
- source_word: ἐν δεσμοῖς σιδηροῖς πάντοθεν κατακεκλεισμένους
  english_pob_choice: in iron bonds, shut in on every side
  chosen_korean: 철사슬에 묶은 채 사방에서 가두어
  alternatives_korean:
  - 철사슬로 묶어 사방에서 가두어
