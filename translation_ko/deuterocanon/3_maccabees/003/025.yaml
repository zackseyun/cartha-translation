base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/025.yaml
  text: We have ordered that[a], as soon as this letter arrives, those enrolled, together with their wives and children, be sent to us at once in iron bonds, shut in on every side, with abuse and plundering[c][b], for an incurable and disgraceful pit fit for enemies.
  footnotes:
  - marker: a
    text: Or 'those registered' or 'those listed by name'; the Greek participle refers to people officially entered in a register.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'with abuse and plundering' conveys both humiliating mistreatment (ὕβρις) and stripping/spoliation (σκυλμοί).
    reason: lexical_alternative
  - marker: c
    text: '''Pit'' may be literal or may function as a vivid image for a place of destruction and disgrace.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 이 편지가 도착하자마자, 등록된 사람들과 그들의 아내와 자녀를 함께 철사슬에 묶은 채 사방에서 가두어, 학대와 약탈을 가한 뒤, 적들에게 어울리는 고치기 어려운 치욕스러운 구덩이로 우리에게 즉시 보내도록 명령하였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘명부에 오른 사람들’, ‘이름이 적힌 사람들’. 그리스어 분사는 공식 명부에 기재된 사람들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘약탈’은 σκυλμοί의 핵심인 탈취·전리 의미를 살린 것입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘구덩이’는 문자적 장소를 가리킬 수도 있고, 파멸과 치욕의 생생한 이미지일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προστετάχαμεν
  english_pob_choice: We have ordered
  chosen_korean: 우리는 … 명령하였습니다
  alternatives_korean:
  - 우리는 … 지시하였습니다
  - 우리는 … 명령해 두었습니다
  lexicon: LSJ
  rationale: 완료형의 공문서식 명령은 한국어에서 ‘명령하였습니다’가 가장 자연스럽고 권위 있는 현재 효력의 명령을 드러냅니다.
- source_word: τοὺς ἐννεμομένους
  english_pob_choice: those enrolled
  chosen_korean: 등록된 사람들
  alternatives_korean:
  - 등록된 자들
  - 명부에 오른 사람들
  lexicon: LSJ
  rationale: 공식 명부에 기재된 사람들을 가리키므로 ‘등록된’이 행정적·법적 의미를 가장 잘 살립니다.
- source_word: μετὰ ὕβρεως καὶ σκυλμῶν
  english_pob_choice: with abuse and plundering
  chosen_korean: 학대와 약탈을 가한 뒤
  alternatives_korean:
  - 모욕과 약탈을 가한 뒤
  - 학대와 탈취를 가한 뒤
  lexicon: LSJ
  rationale: ὕβρις는 단순 폭력이 아니라 모욕적·능욕적 학대를 포함하고, σκυλμός는 약탈/탈취의 의미이므로 두 요소를 구분해 살렸습니다.
- source_word: ἐν δεσμοῖς σιδηροῖς πάντοθεν κατακεκλεισμένους
  english_pob_choice: in iron bonds, shut in on every side
  chosen_korean: 철사슬에 묶은 채 사방에서 가두어
  alternatives_korean:
  - 철사슬로 묶어 사방에서 가두어
  - 쇠사슬에 묶어 모든 면에서 가두어
  lexicon: LSJ
  rationale: δεσμοί는 구속을 뜻하므로 ‘철사슬’로 구체화하되, 완전한 구금을 나타내는 ‘사방에서 가두어’로 상태를 드러냈습니다.
- source_word: εἰς ἀνήκεστον καὶ δυσκλεῆ πρέποντα δυσμενέσιν βόθρον
  english_pob_choice: for an incurable and disgraceful pit fit for enemies
  chosen_korean: 적들에게 어울리는 고치기 어려운 치욕스러운 구덩이
  alternatives_korean:
  - 적들에게 어울리는 불치의 치욕스러운 구덩이
  - 원수에게 마땅한 회복 불가능하고 수치스러운 구덩이
  lexicon: LSJ
  rationale: ἀνήκεστος는 ‘고치기 어려운/회복 불가능한’의 뜻이므로 병리적 표현을 피하되 의미를 보존했고, βόθρος는 문자적 ‘구덩이’로 옮겼습니다.
theological_decisions:
- issue: 명령문의 폭력성과 목적 표현
  chosen_reading: 본문의 군사·징벌 명령을 완화하지 않고, ‘학대와 약탈’, ‘사방에서 가두어’, ‘고치기 어려운 치욕스러운 구덩이’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 완곡하게 ‘가혹한 처분’으로 일반화
  - ‘벌을 주기 위해’처럼 목적만 부각
  rationale: 원문은 적대자에 대한 공적 보복의 강도를 분명히 보여 주므로, 이를 약화하지 않고 한국어에서도 동일한 긴장을 보존해야 합니다.
  doctrine_reference: 본문은 서사적·역사적 진술이며, 폭력의 수위를 흐리지 않는 번역 원칙에 해당합니다.
