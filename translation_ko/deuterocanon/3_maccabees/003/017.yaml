  yaml_path: translation/deuterocanon/3_maccabees/003/017.yaml
  text: But although they accepted our presence in word[a], in deed they were false, when we eagerly desired to enter into their temple and honor it with the most splendid and finest offerings[b],
  footnotes:
  - marker: a
    text: Or 'verbally they welcomed our presence, but in practice acted insincerely.'
    reason: lexical_alternative
  - marker: b
    text: The Greek term for 'offerings' can also mean dedicated gifts or votive offerings placed in a temple.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 그들은 말로는 우리의 방문을 받아들였지만, 실제로는 거짓이었으니 — 우리가 그들의 성전에 들어가서 가장 화려하고 가장 아름다운 봉헌물을 드려 그곳을 공경하려고 열망하였을 때였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘방문’을 사용했지만, 문맥상 ‘현존’ 또는 ‘방문하심’에 가까운 뉘앙스도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: ἀναθήματα는 성전에 바쳐진 예물이나 봉헌물, 즉 봉헌된 헌물을 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: λόγῳ μὲν ... τῷ δὲ πράγματι
  english_pob_choice: in word ... in deed
  chosen_korean: 말로는 ... 실제로는
  alternatives_korean:
  - 말로는 ... 행위로는
  - 겉으로는 ... 실제로는
  lexicon: LSJ
  rationale: 말과 실제의 대조를 한국어에서도 짝지어 드러내어, 수사적 대비를 그대로 살렸습니다.
- source_word: ἀποδεξάμενοι παρουσίαν
  english_pob_choice: accepted our presence
  chosen_korean: 우리의 방문을 받아들였지만
  alternatives_korean:
  - 우리의 উপস্থিত를 받아들였지만
  - 우리의 존재를 환영했지만
  lexicon: LSJ
  rationale: παρουσίαν은 여기서 임금의 실제 방문/현존을 가리키므로, 문맥상 자연스러운 ‘방문’을 택해 과도한 환영의 뉘앙스는 피했습니다.
- source_word: νόθως
  english_pob_choice: were false
  chosen_korean: 거짓이었으니
  alternatives_korean:
  - 진실하지 않았으니
  - 불성실했으니
  lexicon: LSJ
  rationale: νόθως의 핵심은 겉말과 속행동의 불일치에서 드러나는 ‘거짓됨’이므로, 이를 단정적으로 반영했습니다.
- source_word: τοῖς ἐκπρεπέσιν καὶ καλλίστοις ἀναθήμασιν
  english_pob_choice: with the most splendid and finest offerings
  chosen_korean: 가장 화려하고 가장 아름다운 봉헌물을 드려
  alternatives_korean:
  - 가장 훌륭하고 가장 아름다운 봉헌물을 바쳐
  - 가장 장엄하고 가장 아름다운 헌물을 드려
  lexicon: LSJ
  rationale: ἀναθήματα는 성전 맥락의 바쳐진 예물/봉헌물로 이해하는 것이 적절하여, ‘봉헌물’로 옮기고 수식어의 최상급을 그대로 살렸습니다.
theological_decisions:
- issue: 성전 안으로 들어가려는 의도와 봉헌 행위의 표현
  chosen_reading: 화자는 유대인의 성전을 ‘그들의 성전’으로 지칭하며, 그 안에 들어가 공경하려는 실제 의도를 말하는 것으로 옮겼습니다.
  alternative_readings:
  - ‘성소’로 옮겨 더 종교적으로 완화할 수 있음
  - ‘사원’으로 옮겨 보다 일반화할 수 있음
  rationale: 이 구절은 역사적 발화의 내용 자체를 전달하는 대목이므로, 화자의 주장과 성전 관련 긴장을 해소하지 않고 직접적으로 옮겼습니다.
  doctrine_reference: 원문 우선 원칙; 역사 서술의 발화는 평가 없이 보존
