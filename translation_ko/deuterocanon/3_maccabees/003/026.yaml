  yaml_path: translation/deuterocanon/3_maccabees/003/026.yaml
  text: For if these men are punished all together[a], we will leave for the time that remains with complete confidence that our affairs will be established in stability and in the best condition.
  footnotes:
  - marker: a
    text: Or, more literally, 'we will leave ... our affairs to be established'; the Greek wording is somewhat compressed, and the sense is that after these people are punished, the kingdom's affairs will remain settled for the future.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 사람들이 모두 함께 처벌받으면, 우리는 남은 기간 동안 우리의 사정이 안정되고 최선의 상태로 정돈될 것이라고 온전히 확신할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 이 부분의 동사와 뒤따르는 부정사구의 연결이 압축되어 있습니다. 직역에 가까이 하면 ‘우리는 남은 기간을 위하여 우리의 사정이 완전히 안정과 최선의 상태로 정돈될 것이라고 남겨 둘 것이다’ 정도가 됩니다. 따라서 본문은 이들이 처벌된 뒤 장래의 국가 사정이 안정될 것이라는 뜻으로 옮겼습니다.
    reason: lexical_alternative
