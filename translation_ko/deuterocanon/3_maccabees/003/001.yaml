  - 이것을 전해 듣고 나서
  - 이것을 알게 되고 나서
  lexicon: LSJ
  rationale: μεταλαμβάνω는 단순 청취보다 넓게 ‘받아들이다/전해 듣다/알다’를 포함할 수 있어, 문맥상 정보 수용을 자연스럽게 드러내는 표현을 택했습니다.
- source_word: δυσσεβὴς
  english_pob_choice: impious man
  chosen_korean: 불경한 자
  alternatives_korean:
  - 경건하지 않은 자
  - 악한 자
  - 불의한 자
  lexicon: LSJ
  rationale: δυσσεβής는 주로 종교적 불경함을 가리키므로, 단순한 도덕적 악보다 신앙적 결을 살리는 ‘불경한 자’가 가장 가깝습니다.
- source_word: βαρυτέρως ἐναντιοῦσθαι
  english_pob_choice: opposed ... more harshly
  chosen_korean: 더욱 거칠게 적대하였으며
  alternatives_korean:
  - 더 심하게 반대하였으며
  - 더 강하게 적대하였으며
  - 더 가혹하게 대적하였으며
  lexicon: LSJ
  rationale: βαρυτέρως의 비교급 강도를 살리면서 ἐναντιοῦσθαι의 ‘맞서다/적대하다’를 함께 반영해, 자연스러운 한국어로 ‘더욱 거칠게 적대하다’를 택했습니다.
- source_word: χειρίστῳ μόρῳ
  english_pob_choice: by the cruelest fate
  chosen_korean: 가장 잔혹한 죽음으로
  alternatives_korean:
  - 가장 비참한 운명으로
  - 가장 끔찍한 운명으로
  - 가장 나쁜 죽음으로
  lexicon: LSJ
  rationale: μόρος는 단순한 ‘운명’이라기보다 끝에 닥치는 죽음/운명의 뉘앙스를 가지므로, 문맥의 살해 의도를 분명히 하는 ‘죽음’으로 옮기되 superlative를 유지했습니다.
- source_word: τοῦ ζῇν μεταστῆσαι
  english_pob_choice: to remove them from life
  chosen_korean: 이생에서 옮기려
  alternatives_korean:
  - 생명에서 제거하려
  - 목숨을 끊으려
  - 삶에서 옮기려
  lexicon: LSJ
  rationale: 직역적 우회 표현을 살리면서도 한국어에서 자연스럽게 살해 의도를 전달하기 위해 ‘이생에서 옮기다’를 선택했습니다.
theological_decisions:
- issue: 직설적 살해 의도 표현의 처리
  chosen_reading: ‘가장 잔혹한 죽음으로 그들을 이생에서 옮기려 하였습니다’라고 옮겨, 우회적 표현과 실제 의도를 함께 드러냈습니다.
  alternative_readings:
  - ‘가장 잔혹한 운명으로 그들을 삶에서 옮기려 하였습니다’
  - ‘그들을 죽이려 하였습니다’
  rationale: 그리스어의 완곡한 표현을 완전히 평평하게 만들지 않으면서도, 문맥상 실제 의미가 살해 의도임을 분명히 해야 하므로 두 층위를 함께 보존했습니다.
  doctrine_reference: 서술 본문에서의 의미 보존 원칙
