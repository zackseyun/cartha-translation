  to: 그러나 우리는 그들의 어리석음을 너그러이 대했고[a], 승리와 함께 이끌려 지나왔으며, 이집트에 있는 모든 민족을 인도적으로 맞이했고[b], 마땅한 일을 했습니다.
  rationale: 수동 분사 διακομισθέντες는 ‘이끌려 지나오다’로, ἀπαντήσαντες는 ‘맞이하다’로 각각 보존했습니다. φιλανθρώπως는 현대 한국어에서 뜻이 명료한 ‘인도적으로’로 옮겼습니다. 문장은 왕이 자신의 처사를 정당화하는 원문의 격식 있는 자기진술을 유지하며, 각주 표지도 해당 어구 바로 뒤에 배치했습니다.
