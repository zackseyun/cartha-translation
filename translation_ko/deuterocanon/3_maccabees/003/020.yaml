  text: But we[a], having borne with their folly, and having been carried through with victory, and having met all the nations in Egypt with humanity[b], did what was fitting.
  footnotes:
  - marker: a
    text: Or 'having dealt gently with their senselessness.' The Greek participle can suggest patient forbearance.
    reason: lexical_alternative
  - marker: b
    text: Or 'humanely' or 'benevolently' for 'with humanity.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 우리는 그들의 어리석음을 너그러이 대했고[a], 승리와 함께 이끌려 지나왔으며, 이집트에 있는 모든 민족을 인도적으로 맞이했고[b], 마땅한 일을 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 어리석음을 인내하며 참아 주었고’로 옮길 수 있습니다. 그리스어 분사는 인내 어린 관용의 태도를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자애롭게’ 또는 ‘인간애를 가지고’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοίᾳ
  english_pob_choice: folly
  chosen_korean: 어리석음
  alternatives_korean:
  - 우매함
  - 무지함
  - 망령됨
  lexicon: LSJ
  rationale: ἀνοία는 분별 없음과 어리석음을 가리키므로, ‘어리석음’이 도덕적·지적 무게를 가장 자연스럽게 담습니다.
- source_word: συμπεριενεχθέντες
  english_pob_choice: having borne with
  chosen_korean: 너그러이 대했고
  alternatives_korean:
  - 참아 주었고
  - 관용으로 대했고
  - 견디며 받아 주었고
  lexicon: LSJ
  rationale: 이 분사구는 단순히 참는 것보다 상대를 향한 인내와 관용의 태도를 나타내므로, 짧고 공문체에 어울리는 ‘너그러이 대했고’로 옮겼습니다.
- source_word: μετὰ νίκης
  english_pob_choice: with victory
  chosen_korean: 승리를 거두며
  alternatives_korean:
  - 승리와 함께
  - 승리 가운데
  - 승리하여
  lexicon: LSJ
  rationale: 직역의 어색함을 줄이면서도 승리라는 결과를 보존하기 위해 ‘승리를 거두며’로 다소 관용적으로 옮겼습니다.
- source_word: φιλανθρώπως
  english_pob_choice: with humanity
  chosen_korean: 사람답게
  alternatives_korean:
  - 인도적으로
  - 자애롭게
  - 인간적으로
  lexicon: LSJ
  rationale: φιλανθρωπ- 계열의 ‘인간에 대한 호의’와 ‘인간다움’의 뉘앙스를 살리기 위해, 한국어에서는 ‘사람답게’가 가장 응축되어 있습니다.
theological_decisions:
- issue: 왕의 자기변호적 진술의 어조
  chosen_reading: 원문의 왕실 자기정당화 어조를 그대로 살려, 서술을 완화하거나 반어적으로 해석하지 않았습니다.
  alternative_readings:
  - 반어적 뉘앙스를 드러내기 위해 표현을 비꼬아 번역
  rationale: 이 절은 서술자의 평가가 아니라 왕의 발언이므로, 번역은 발화의 자기진술을 그대로 보존해야 합니다.
  doctrine_reference: Translation philosophy §1, §6
