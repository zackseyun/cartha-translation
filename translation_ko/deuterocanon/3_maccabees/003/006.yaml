  yaml_path: translation/deuterocanon/3_maccabees/003/006.yaml
  text: So then[a], the foreigners did not at all take into account the beneficence for which the nation was spoken of everywhere;
  footnotes:
  - marker: a
    text: Or 'did not reckon with' or 'did not consider.' The Greek verb is literally related to counting or enumerating, but here carries the sense of giving no weight to something.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그 민족의 선행은 모든 사람 사이에 널리 알려져 있었지만, 이방인들은 그것을 전혀 헤아리지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전혀 고려하지 않았습니다’, ‘전혀 셈에 넣지 않았습니다’. 그리스어 동사는 본래 세거나 열거하는 것과 관련되지만, 여기서는 어떤 사실이나 가치를 고려하지 않는다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: θρυλουμένην εὐπραξίαν
  english_pob_choice: the beneficence / the good conduct
  chosen_korean: 그 선행
  alternatives_korean:
  - 그 좋은 행실
  - 그 선한 행위
  - 그 선행의 명성
  lexicon: LSJ
  rationale: εὐπραξία는 단순한 성공보다 선한 행위나 잘한 일의 공적 평판을 가리킬 수 있으므로, 문맥의 ‘널리 말해짐’과 함께 ‘선행’으로 옮겨 행위와 그 평판을 함께 살렸습니다.
- source_word: θρυλουμένην
  english_pob_choice: was spoken of
  chosen_korean: 말해지던
  alternatives_korean:
  - 널리 전해지던
  - 회자되던
  - 소문나 있던
  lexicon: LSJ
  rationale: 분사형의 반복적·수동적 뉘앙스를 살리면서, 공적 평판이 퍼져 있음을 자연스러운 현대 한국어로 표현했습니다.
- source_word: οἱ ἀλλόφυλοι
  english_pob_choice: the foreigners
  chosen_korean: 이방인들은
  alternatives_korean:
  - 외국인들은
  - 다른 민족 사람들은
  - 타민족 사람들은
  lexicon: LSJ
  rationale: ἀλλόφυλοι는 문자적으로 ‘다른 민족의 사람들’이므로, 본문 대조를 살리면서도 한국어 성서문맥에서 자연한 ‘이방인들’을 택했습니다.
- source_word: διηριθμήσαντο
  english_pob_choice: did not at all take into account
  chosen_korean: 전혀 헤아리지 않았습니다
  alternatives_korean:
  - 전혀 고려하지 않았습니다
  - 전혀 계산에 넣지 않았습니다
  - 전혀 중요하게 여기지 않았습니다
  lexicon: LSJ
  rationale: 동사가 본래 ‘세어 넣다/열거하다’ 계열이지만, 여기서는 어떤 가치를 인정하지 않는 평가적 의미이므로 ‘헤아리다’로 옮겨 무게를 두지 않음을 드러냈습니다.
theological_decisions:
- issue: ‘g e n o s’의 지시 대상
  chosen_reading: ‘민족’으로 옮겨 유대 민족 전체에 대한 집단적 지시를 살렸습니다.
  alternative_readings:
  - ‘백성’
  - ‘족속’
  - ‘사람들’
  rationale: γένος는 단순 혈통보다 민족/집단 정체성을 가리키므로, 본문이 말하는 공동체적 대상을 현대 한국어로 가장 자연스럽게 드러내는 표현을 선택했습니다.
  doctrine_reference: 집단 정체성/민족 표지
- issue: 부정의 강도
  chosen_reading: οὐδαμῶς를 ‘전혀’로 옮겨 완전한 무시를 분명히 했습니다.
  alternative_readings:
  - ‘결코’
  - ‘아예’
  - ‘전혀 ... 않다’
  rationale: 본문은 단순 부정이 아니라 강한 배제를 말하므로, 평가 절하의 강도를 유지하는 번역이 필요합니다.
  doctrine_reference: 문맥적 강조
