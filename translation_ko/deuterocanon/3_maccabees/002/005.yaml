  lexicon: LSJ
  rationale: 이 분사구는 이스라엘을 강제로 종된 상태로 만든 행위를 가리키므로, POB의 slavery 감각을 살려 "종으로 삼다"를 선택했습니다.
- source_word: ποικίλαις καὶ πολλαῖς
  english_pob_choice: varied and many
