  text: 주님께서는 주님의 거룩한 백성 이스라엘을 종으로 삼은 그 대담한[a] 파라오를 다양하고 많은 징벌로 시험하셔서[b] 주님의 능력을 알리셨고, 그 징벌들을 통해 주님의 큰 권능을 알리셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: θρασὺν은 ‘대담한’ 외에 ‘거만한’, ‘오만한’ 뉘앙스로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘다양하고 많은 징벌로 시험하여’입니다. 이는 연속된 심판 행위를 통해 파라오를 시험하셨다는 뜻으로도 읽힐 수 있습니다.
    reason: lexical_alternative
