  alternatives_korean:
  - 드러내셨고
  - 보이셨고
  - 알게 하셨고
  lexicon: LSJ
  rationale: 두 번 반복되는 동사의 공통 의미를 살려, 하나님이 자신의 능력과 권능을 공개적으로 드러내셨다는 뜻을 "알리셨고"로 일관되게 반영했습니다.
- source_word: δύναμιν / κράτος
  english_pob_choice: power / might
  chosen_korean: 능력 / 큰 권능
  alternatives_korean:
  - 권능 / 큰 권능
  - 힘 / 큰 힘
  - 능력 / 큰 힘
  lexicon: LSJ
  rationale: δύναμις와 κράτος의 의미 차이를 한국어에서 완전히 분리하기 어려우므로, 첫째는 "능력", 둘째는 수식어를 더한 "큰 권능"으로 옮겨 반복을 줄이면서도 강조를 유지했습니다.
theological_decisions:
- issue: 두 번 반복되는 ἐγνώρισας의 의미와 주어-목적 관계
  chosen_reading: 하나님께서 파라오에게 내리신 징벌을 통해 자신의 능력과 큰 권능을 드러내셨다는 뜻으로, 두 절 모두 같은 주어(주님)와 공적 계시의 의미를 유지했습니다.
  alternative_readings:
  - 파라오를 시험하셨다를 더 강하게 "검증하셨다"로 읽는 번역
  - 첫 번째 ἐγνώρισας를 단순히 '보이셨다'로 완화하는 번역
  rationale: 문맥은 출애굽 심판을 회고하는 기도문이므로, 반복된 동사는 하나님의 역사적 자기현시를 가리킵니다. 동일 동사를 일관되게 유지해야 수사적 평행이 보존됩니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms)
