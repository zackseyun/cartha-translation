    text: 제시된 그리스어 본문은 이 절의 구조가 다소 어색합니다. 앞에서는 ‘나는 약속했습니다’라고 1인칭으로 말하지만, 마지막 동사 εἰσακούσῃ는 형태상 3인칭 단수 접속법입니다. 본문은 이 불일치를 매끄럽게 1인칭으로 고치지 않고, 한국어에서는 주어를 명시하지 않은 채 보존했습니다.
