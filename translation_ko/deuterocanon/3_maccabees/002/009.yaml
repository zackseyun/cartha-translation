  text: And because I love the house of Israel[a], I have promised that if a turning away comes upon us and distress overtakes us, and we come to our place and pray[b], I will hear our prayer.
  footnotes:
  - marker: a
    text: Or 'apostasy' for 'a turning away'; the Greek ἀποστροφή can denote defection or turning away, but the broader context here does not require the more technical term in the main text.
    reason: lexical_alternative
  - marker: b
    text: The Greek text is somewhat awkward at this point, and the source record flags a major mismatch. The translation retains the first-person promise of the Greek rather than smoothing it into indirect speech.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 이스라엘의 집을 사랑하므로, 나는 약속했습니다. 만일 우리에게서 돌아섬이 생기고 환난이 우리를 덮치며, 우리가 우리 곳에 와서 기도하면, 내가 우리의 기도를 들을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '배도'로도 옮길 수 있습니다. 그리스어 ἀποστροφή는 '돌아섬'뿐 아니라 '이탈/배반'의 뜻도 가질 수 있지만, 여기서는 본문이 더 기술적인 용어를 요구하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절의 그리스어는 다소 어색한 구조를 보이므로, 본문에 있는 1인칭 약속 형식을 매끄럽게 바꾸지 않고 유지했습니다.
    reason: textual_variant
