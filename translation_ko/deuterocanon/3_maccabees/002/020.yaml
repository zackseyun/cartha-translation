  lexicon: LSJ
  rationale: ἐπόπτης의 핵심은 ‘살피다/감찰하다’이므로, 보편적 섭리의 의미를 살리되 한국어로 어색하지 않게 ‘모든 것을 살피시는’으로 옮겼습니다.
- source_word: προπάτωρ
