translation:
  language: ko
  text: 그곳에서 모든 것을 감찰하시는 하나님, 곧 거룩한 이들 가운데 거룩하신 조상께서[a] 법에 맞는 간구를 들으시고, 오만과 만용으로 크게 우쭐해진 그를 채찍으로 치셨습니다.
  philosophy: optimal-equivalence
  footnotes:
