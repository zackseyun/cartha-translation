  - 선조이신 분
  - 우리의 조상
  lexicon: LSJ
  rationale: 직역하면 ‘먼 조상/선조’이지만, 여기서는 하나님을 가리키는 호칭이므로 한국어로는 과도한 혈연 은유를 줄이고도 선조적 뉘앙스를 남기는 ‘조상’이 가장 무난합니다.
- source_word: ἅγιος ἐν ἁγίοις
  english_pob_choice: holy ... among the holy ones
  chosen_korean: 거룩한 이들 가운데 거룩하신
  alternatives_korean:
