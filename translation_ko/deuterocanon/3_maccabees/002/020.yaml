translation:
  language: ko
  text: 그곳에서 모든 것을 살피시는 하나님께서, 거룩한 이들 가운데 거룩하신 조상께서 법에 맞는 간구를 들으시고, 오만과 무모함으로 크게 부풀어 오른 그를 채찍질하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거룩한 곳들/거룩한 것들 가운데 계신 거룩하신 조상’으로도 읽을 수 있습니다. 그리스어의 ἐν ἁγίοις는 제의적 뉘앙스를 띨 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐνταῦθα
  english_pob_choice: There
  chosen_korean: 그곳에서
  alternatives_korean:
  - 거기서
  - 그때
  - 그 자리에서
  lexicon: LSJ
  rationale: 문맥상 앞선 사건이 일어난 장소를 가리키는 부사이므로, 시간 표지보다 장소적·서사적 지시를 살리는 ‘그곳에서’가 가장 자연스럽습니다.
- source_word: ὁ πάντων ἐπόπτης θεὸς
  english_pob_choice: the God who watches over all
  chosen_korean: 모든 것을 살피시는 하나님
  alternatives_korean:
  - 만물을 감찰하시는 하나님
  - 모든 것을 감독하시는 하나님
  - 모든 것을 지켜보시는 하나님
  lexicon: LSJ
  rationale: ἐπόπτης의 핵심은 ‘살피다/감찰하다’이므로, 보편적 섭리의 의미를 살리되 한국어로 어색하지 않게 ‘모든 것을 살피시는’으로 옮겼습니다.
- source_word: προπάτωρ
  english_pob_choice: forefather
  chosen_korean: 조상
  alternatives_korean:
  - 선조
  - 선조이신 분
  - 우리의 조상
  lexicon: LSJ
  rationale: 직역하면 ‘먼 조상/선조’이지만, 여기서는 하나님을 가리키는 호칭이므로 한국어로는 과도한 혈연 은유를 줄이고도 선조적 뉘앙스를 남기는 ‘조상’이 가장 무난합니다.
- source_word: ἅγιος ἐν ἁγίοις
  english_pob_choice: holy ... among the holy ones
  chosen_korean: 거룩한 이들 가운데 거룩하신
  alternatives_korean:
  - 거룩한 것들 가운데 거룩하신
  - 거룩한 곳들 가운데 거룩하신
  - 성도들 가운데 거룩하신
  lexicon: LSJ
  rationale: 문법상 하나님을 수식하는 압축된 구이므로 개인적 묘사로 읽되, ‘ἐν ἁγίοις’의 모호성을 살려 ‘거룩한 이들 가운데’로 처리했습니다.
- source_word: εὐθέσμου λιτανείας
  english_pob_choice: the lawful supplication
  chosen_korean: 법에 맞는 간구
  alternatives_korean:
  - 합당한 간구
  - 질서 있는 간구
  - 정당한 간구
  lexicon: LSJ
  rationale: εὐθέσμος는 법·질서에 합한 상태를 뜻하므로, 종교적 문맥을 흐리지 않으면서 규범성을 드러내는 ‘법에 맞는’이 적절합니다. λιτανεία는 여기서 전례적 ‘연도’가 아니라 간구이므로 ‘간구’로 옮겼습니다.
- source_word: ἐμάστιξεν
  english_pob_choice: scourged
  chosen_korean: 채찍질하셨습니다
  alternatives_korean:
  - 매질하셨습니다
  - 징계하셨습니다
  - 때리셨습니다
  lexicon: LSJ
  rationale: 동사의 기본 이미지는 실제 채찍질이므로, 하나님의 심판의 강도를 살리는 ‘채찍질하셨습니다’가 가장 직접적입니다.
theological_decisions:
- issue: ἅγιος ἐν ἁγίοις의 해석적 모호성
  chosen_reading: 주본문은 하나님을 ‘거룩한 이들 가운데 거룩하신’으로 옮기고, 공간적·제의적 뉘앙스를 주본문에 과도하게 고정하지 않았습니다.
  alternative_readings:
  - 거룩한 곳들 가운데 거룩하신
  - 거룩한 것들 가운데 거룩하신
  rationale: 그리스어는 인격적 칭호로 읽힐 수도 있고, 성소/거룩한 것들에 대한 제의적 표현으로도 들릴 수 있으므로, 본문에는 인격적 읽기를 택하되 해석을 닫지 않았습니다.
  doctrine_reference: Translation philosophy §3
