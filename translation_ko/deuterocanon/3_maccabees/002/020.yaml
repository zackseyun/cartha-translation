    text: 또는 ‘거룩한 곳들/거룩한 것들 가운데 거룩하신 조상’으로도 읽을 수 있습니다. 그리스어의 ἐν ἁγίοις는 제의적 뉘앙스를 띨 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐνταῦθα
  english_pob_choice: There
  chosen_korean: 그곳에서
  alternatives_korean:
