  yaml_path: translation/deuterocanon/3_maccabees/002/021.yaml
  text: There the God who watches over all[a], the holy forefather among the holy ones, having heard the lawful supplication, scourged him who had been greatly puffed up with insolence and boldness[b],
  footnotes:
  - marker: a
    text: Or, possibly, 'the holy one in the holy places,' if ἐν ἁγίοις is taken locatively rather than as 'among the holy ones.'
    reason: alternative_reading
  - marker: b
    text: The title rendered 'sovereign ancestor' translates the unusual Greek προπάτωρ, also expressible as 'forefather' or 'ancestor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그곳에서 만물을 살피시는 하나님, 거룩한 이들 가운데 계신 거룩한 조상[a]께서 법도에 따른 간구를 들으시고, 오만과 무모한 대담함으로 크게 우쭐해 있던 자를 채찍질하셨습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거룩한 곳들 가운데 계신 거룩한 이’로 읽을 수 있습니다. ἐν ἁγίοις는 ‘거룩한 이들 가운데’라는 인격적 뜻으로도, ‘거룩한 곳들 가운데’라는 장소적 뜻으로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘조상’은 하나님께 적용된 이례적인 칭호인 προπάτωρ를 옮긴 말입니다. ‘선조’ 또는 ‘조상’으로도 표현할 수 있습니다.
    reason: lexical_alternative
