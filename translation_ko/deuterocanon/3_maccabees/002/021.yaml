  alternative_readings:
  - 거룩한 곳들 안에 계신 거룩한 이
  - 거룩한 장소들 가운데 계신 거룩한 이
  - 거룩한 이들 가운데 계신 거룩한 이
  rationale: 문맥이 하나님에 대한 칭호들의 연속이므로, 성소 위치보다는 인격적 칭호의 흐름을 우선해 ‘거룩한 이들 가운데 계신’으로 옮겼습니다. 다만 원문의 압축성과 ἁγίοις의 모호성은 남겨 두었습니다.
  doctrine_reference: Translation philosophy §3
