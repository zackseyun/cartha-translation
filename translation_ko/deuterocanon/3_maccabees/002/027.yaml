  yaml_path: translation/deuterocanon/3_maccabees/002/027.yaml
  text: He publicly proposed to spread reproach against the nation; having set up a stele on the tower by the court, he engraved an inscription
  footnotes:
  - marker: a
    text: Or 'a pillar' or 'a monument' for 'stele' (στήλην). The Greek refers to an erected stone monument suitable for an inscription.
