  yaml_path: translation/deuterocanon/3_maccabees/002/027.yaml
  text: He publicly proposed to spread reproach against the nation; having set up a stele on the tower by the court, he engraved an inscription
  footnotes:
  - marker: a
    text: Or 'a pillar' or 'a monument' for 'stele' (στήλην). The Greek refers to an erected stone monument suitable for an inscription.
    reason: lexical_alternative
  - marker: b
    text: '''Court'' (αὐλή) may also mean a palace court or enclosed courtyard; the exact architectural reference is not fully specified by the Greek alone.'
    reason: cultural_note
translation:
  language: ko
  text: 그는 민족을 비난하는 말을 공공연히 퍼뜨리기로 작정하였으며, 뜰[b] 곁 탑 위에 석비[a]를 세우고 그 위에 글을 새겼습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: στήλην은 글을 새기기 위해 세운 돌기념물로서, ‘세움돌’이나 ‘기념비’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: αὐλή는 ‘뜰’ 외에 ‘궁정’ 또는 ‘궁궐 뜰’을 뜻할 수도 있습니다. 그 정확한 건축적 지시 대상은 그리스어만으로 확정되지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: προέθετο
  english_pob_choice: publicly proposed
  chosen_korean: 공공연히 퍼뜨리기로 작정하였으며
  alternatives_korean:
  - 공공연히 제안하였으며
  - 공개적으로 계획하였으며
  - 공공연히 내세우기로 작정하였으며
  lexicon: LSJ
  rationale: 중간태의 προέθετο는 단순한 ‘제안’보다 의도/결심을 드러내므로, 한국어에서는 ‘작정하다’로 의도성을 살리고 δημοσίᾳ와 결합된 공적 성격은 ‘공공연히’로 반영했습니다.
- source_word: διαδοῦναι ψόγον
  english_pob_choice: to spread reproach
  chosen_korean: 모욕을 ... 퍼뜨리기로
  alternatives_korean:
  - 수치를 퍼뜨리기로
  - 비난을 퍼뜨리기로
  - 치욕을 퍼뜨리기로
  lexicon: LSJ
  rationale: ψόγος는 공적 비난/수치를 뜻하므로 ‘모욕’이 문맥상 가장 자연스럽고, διαδοῦναι의 확산 의미는 ‘퍼뜨리다’로 살렸습니다.
- source_word: στήλην
  english_pob_choice: a stele
  chosen_korean: 석주
  alternatives_korean:
  - 스텔레
  - 비석
  - 기념비
  lexicon: LSJ
  rationale: στήλη는 새겨진 세워진 석재를 가리키므로, 기술적인 음역보다는 독자가 바로 이해할 수 있는 ‘석주’로 옮기되, inscription 문맥을 유지했습니다.
- source_word: ἐπὶ τοῦ κατὰ τὴν αὐλὴν πύργου
  english_pob_choice: on the tower by the court
  chosen_korean: 뜰 옆 탑 위에
  alternatives_korean:
  - 궁정 옆 탑 위에
  - 뜰 가까운 탑 위에
  - 뜰에 딸린 탑 위에
  lexicon: LSJ
  rationale: αὐλή는 정확한 건축 용례가 단정되지 않아 ‘뜰’로 넓게 잡고, πύργου와의 관계는 위치 전치사구대로 ‘옆 탑 위에’로 간결하게 반영했습니다.
- source_word: ἐκόλαψεν γραφὴν
  english_pob_choice: he engraved an inscription
  chosen_korean: 그 위에 글을 새겼습니다
  alternatives_korean:
  - 그 위에 새긴 글을 남겼습니다
  - 그 위에 명문을 새겼습니다
  - 그 위에 비문을 새겼습니다
  lexicon: LSJ
  rationale: γραφή는 여기서 문자 자체보다 새겨진 문안을 뜻하므로, 한국어로는 가장 직접적인 ‘글’이 자연스럽고, ἐκόλαψεν은 ‘새기다’로 대응했습니다.
theological_decisions:
- issue: 3 Maccabees 2:27의 서술 방식과 공적 조롱의 성격
  chosen_reading: 문장은 개인적 사적인 행위가 아니라 민족 전체를 향한 공개적 모욕의 조성으로 읽히므로, ‘공공연히’와 ‘퍼뜨리기로 작정하였으며’를 유지했습니다.
  alternative_readings:
  - 완곡하게 ‘공개적으로 제안하였으며’로 옮기는 읽기
  - 단순 서술로 낮추어 ‘모욕을 퍼뜨릴 계획을 세웠으며’로 옮기는 읽기
  rationale: 본문은 단순한 정보 전달이 아니라 적대적 공적 수치를 만들려는 의도를 강조하므로, 그 긴장감을 약화시키지 않는 방향을 택했습니다.
  doctrine_reference: 공적 수치/명예 훼손의 내러티브 기능
- issue: αὐλή의 공간성
  chosen_reading: αὐλή는 ‘뜰’로 두어 구체적 궁정인지 사원 뜰인지 단정하지 않고, 원문의 공간적 불확정성을 보존했습니다.
  alternative_readings:
  - ‘궁정’으로 좁혀 읽기
  - ‘왕궁 뜰’로 확대 해석하기
  rationale: 본문만으로는 건축적 범위를 단정할 근거가 충분하지 않으므로, 독자가 원문의 여지를 보도록 했습니다.
  doctrine_reference: 본문 주해의 절제
