  chosen_korean: 교만과 오만으로 행하는 자들
  alternatives_korean:
  - 거만과 자만으로 행동하는 자들
  - 무례와 오만으로 행하는 자들
  lexicon: LSJ
  rationale: τι πράσσω의 관용적 표현을 한국어에서 과도하게 직역하지 않고 ‘행하다’로 자연화했으며, ὕβρις와 ἀγερωχία의 짝을 ‘교만과 오만’으로 대응시켰습니다.
