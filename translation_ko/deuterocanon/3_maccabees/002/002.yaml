  text: For you are the one who created all things and rules over all; you are a righteous sovereign[a], and you judge those who do anything in insolence and arrogance.
  footnotes:
  - marker: a
    text: Or 'you are a just ruler.' The Greek can support either 'righteous' or 'just' for δίκαιος, and δυνάστης can be rendered 'ruler' or 'sovereign.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 주님께서는 만물을 창조하신 분이시며 만물 위에 군림하시는 분이십니다. 주님은 의로운 주권자이시며, 교만과 오만으로 행하는 자들을 심판하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘의로운 통치자’로 옮길 수 있습니다. δίκαιος는 ‘의로운’과 ‘정의로운’ 모두 가능하고, δυνάστης는 ‘주권자’와 ‘통치자’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ γὰρ εἶ
  english_pob_choice: For you are
  chosen_korean: 주님, 주님께서는 … 분이십니다
  alternatives_korean:
  - 주님, 주님은 … 이십니다
  - 왜냐하면 주님께서는 … 이십니다
  lexicon: LSJ
  rationale: γάρ의 설명적 연결을 한국어에서는 앞 문맥을 받는 서술형으로 자연스럽게 살리되, σὺ의 강조는 반복 호칭으로 보존했습니다.
- source_word: ὁ κτίσας τὰ πάντα
  english_pob_choice: the one who created all things
  chosen_korean: 만물을 창조하신 분
  alternatives_korean:
  - 모든 것을 지으신 분
  - 만물의 창조자
  lexicon: LSJ
  rationale: 아오리스트 분사와 관사 결합의 서술적 성격을 살려 ‘…하신 분’으로 옮기고, τὰ πάντα는 ‘만물’로 압축했습니다.
- source_word: τῶν ὅλων ἐπικρατῶν
  english_pob_choice: rules over all
  chosen_korean: 만물 위에 군림하시는 분
  alternatives_korean:
  - 만물을 다스리시는 분
  - 모든 것 위에 주권을 가지신 분
  lexicon: LSJ
  rationale: ἐπικρατέω의 지배·우위를 ‘군림하다’로 옮겨, 단순 통치보다 강한 지배감을 드러냈습니다.
- source_word: δυνάστης δίκαιος
  english_pob_choice: a righteous sovereign
  chosen_korean: 의로운 주권자
  alternatives_korean:
  - 의로운 통치자
  - 의로운 군주
  - 정의로운 주권자
  lexicon: LSJ
  rationale: δυνάστης는 단순한 통치자보다 권세를 가진 지배자를 가리키므로 ‘주권자’로 옮겼고, δίκαιος는 이 문맥의 도덕적 성격을 따라 ‘의로운’으로 처리했습니다.
- source_word: τοὺς ὕβρει καὶ ἀγερωχίᾳ τι πράσσοντας
  english_pob_choice: those who do anything in insolence and arrogance
  chosen_korean: 교만과 오만으로 행하는 자들
  alternatives_korean:
  - 거만과 자만으로 행동하는 자들
  - 무례와 오만으로 행하는 자들
  lexicon: LSJ
  rationale: τι πράσσω의 관용적 표현을 한국어에서 과도하게 직역하지 않고 ‘행하다’로 자연화했으며, ὕβρις와 ἀγερωχία의 짝을 ‘교만과 오만’으로 대응시켰습니다.
theological_decisions:
- issue: δίκαιος의 번역 뉘앙스
  chosen_reading: ‘의로운’으로 번역해 하나님의 성품과 심판의 정당성을 함께 드러냈습니다.
  alternative_readings:
  - ‘정의로운’
  - ‘공정한’
  rationale: 이 기도문에서는 단순한 법정적 공정보다 하나님의 거룩하고 바른 성품을 함께 드러내는 표현이 더 적절합니다.
  doctrine_reference: 'DOCTRINE.md: δικαιοσύνη / δίκαιος는 문맥에 따라 righteousness/justice 모두 가능'
