translation:
  language: ko
  text: 당신께서는 만물을 창조하신 분이시며 만물을 다스리시는 분이십니다. 당신께서는 의로운 주권자이시며, 오만과 거만으로 어떤 일을 행하는 자들을 심판하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정의로운 통치자’로 옮길 수 있습니다. δίκαιος는 ‘의로운’ 또는 ‘정의로운’으로, δυνάστης는 ‘주권자’ 또는 ‘통치자’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
