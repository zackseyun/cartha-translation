  rationale: μετάμελος의 핵심을 후회/뉘우침으로 보되, 반복적·강조적 부정을 한국어에서 가장 자연스럽게 살릴 수 있는 표현으로 처리했습니다.
- source_word: μετὰ ἀπειλῆς δὲ πικρᾶς θέμενος
