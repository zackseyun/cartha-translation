  rationale: πικρά를 단순한 감정의 ‘쓴’ 의미와 폭력적·가혹한 뉘앙스 모두로 보되, POB의 ‘bitter threat’를 반영해 직역에 가까운 ‘쓰디쓴 위협’으로 옮겼습니다.
- source_word: ἀνέλυσεν
  english_pob_choice: he departed
  chosen_korean: 떠났습니다
  alternatives_korean:
  - 물러났습니다
  - 자리를 떴습니다
  lexicon: LSJ
  rationale: 서사적 종결 동사로서 ‘departed’의 의미를 한국어에서 간결하고 중립적으로 재현했습니다.
theological_decisions:
- issue: 왕의 반응 서술에서 ‘뉘우침’의 범위
  chosen_reading: 도덕적 회개라기보다 책망을 받고도 태도를 바꾸지 않는 완강함을 드러낸 것으로 읽었습니다.
  alternative_readings:
  - 단순한 감정적 후회
  - 정치적 판단의 변경 거부
  rationale: μετάμελος와 문맥은 내적 반성의 결여를 가리키므로, 독자가 ‘회개’로 과도하게 종교화하지 않도록 ‘뉘우치지 않았습니다’로 유지했습니다.
  doctrine_reference: 문맥 우선 원칙; 어휘 의미 보존
