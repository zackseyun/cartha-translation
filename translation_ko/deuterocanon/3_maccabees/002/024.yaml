  text: But after some time[a], when he had recovered himself, he in no way came to regret it when he was rebuked; rather, having issued a bitter threat[b], he departed.
  footnotes:
  - marker: a
    text: Or 'having collected himself.' The Greek expression likely means that he regained composure after the preceding episode.
    reason: lexical_alternative
  - marker: b
    text: Or 'he did not change his mind at all.' The phrase can express lack of remorse or refusal to reconsider.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 얼마 뒤에 그는 정신을 가다듬은 뒤[a] 책망을 받았으나, 전혀 뉘우치지 않았습니다.[b] 오히려 가혹한 위협을 하고 떠났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘스스로를 수습한 뒤’입니다. 그리스어 표현은 앞선 사건 뒤에 그가 침착함을 되찾았다는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘전혀 마음을 바꾸지 않았습니다’입니다. 이 표현은 후회의 부재나 재고 거부를 나타낼 수 있습니다.
    reason: lexical_alternative
