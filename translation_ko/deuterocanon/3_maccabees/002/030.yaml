  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ἐν τοῖς κατὰ τελετὰς μεμυημένοις는 ‘의식에 입문한 사람들 가운데서’보다 ‘의례에 따라 입문한 이들과 함께’로 옮기는 편이, 전치사 ἐν이 나타내는 공동체 안에서의 생활·교제를 더 자연스럽고 정확하게 드러냅니다. προαιρῶνται의 자발적 선택도 ‘살기를 택한다면’으로 명시하는 것이 좋습니다.
  naturalness: 초안의 ‘사람들 가운데서 살기’는 한국어로 다소 부자연스럽습니다. ‘이들과 함께 지내기를 택한다면’은 현대 표준 한국어 합쇼체에서 자연스럽고, ἀναστρέφεσθαι의 생활 방식과 교제의 폭을 유지합니다. 인용문 안의 현재형 ‘삼습니다’는 원문의 ποιεῖ를 보존하므로 유지합니다.
  terminology: ‘알렉산드리아 사람들과 동등한 시민’은 ἰσοπολίτας의 시민적 동등성을 적절히 나타냅니다. τελεταί/μεμυημένοι에는 종교·제의적 입문 어휘가 있으므로 ‘의례에 따라 입문한 이들’로 표현하고, 각주에서 ‘신비 의례’라는 가능한 대안을 제시합니다. 현 각주는 본문과 사실상 동일한 문구를 반복하여 대안 기능을 하지 못하므로 교정이 필요합니다.
