theological_decisions:
- issue: Cultic initiation language in a Hellenistic-Jewish decree
  chosen_reading: ‘의식에 입문한 사람들’로 옮겨, 종교적 입문과 공동체 편입의 뉘앙스를 유지했습니다.
  alternative_readings:
  - ‘신비에 입문한 사람들’
  - ‘의례를 받은 사람들’
  rationale: 본문의 τελεταί/μεμυημένοι는 단순한 예식이 아니라 입문된 집단을 가리키므로, 그 문화적 긴장을 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy with visible cultic nuance'
