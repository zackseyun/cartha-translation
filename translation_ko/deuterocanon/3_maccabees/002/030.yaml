  yaml_path: translation/deuterocanon/3_maccabees/002/030.yaml
  text: 'But so that he might not appear hateful to everyone[a], he added in writing: “But if some of them choose to live among those initiated in the rites, he makes these equal citizens with the Alexandrians.”'
  footnotes:
  - marker: a
    text: Or “among those initiated in the mysteries.” The Greek uses cultic initiation language.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그가 모든 사람에게 미움받는 것처럼 보이지 않게 하려고, 그는 글로 다음과 같이 덧붙였습니다. 「그러나 그들 가운데 일부가 의례에 따라 입문한 이들과 함께 지내기를 택한다면, 그는 그들을 알렉산드리아 사람들과 동등한 시민으로 삼습니다」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “신비 의례에 입문한 이들과 함께”. 그리스어는 종교적·제의적 입문을 나타내는 언어를 사용합니다.
    reason: lexical_alternative
