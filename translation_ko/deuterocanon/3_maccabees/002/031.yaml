  chosen_reading: 문맥상 단순한 무관심이 아니라, 공적 종교 질서의 기반을 경시하는 태도로 읽었습니다.
  alternative_readings:
  - 그냥 대수롭지 않게 여겼다
  - 종교를 피상적으로만 여겼다
  rationale: ἐπιπολαίως와 στυγοῦντες의 결합은 가벼운 태도와 경멸을 함께 드러내므로, 이를 약화시키지 않고 ‘가볍게 멸시’로 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 6
