  text: But some[a], lightly despising the foundations of the city's piety, readily gave themselves up, as though they would share in some great renown from the association with the king that was to come.
  footnotes:
  - marker: a
    text: Or 'the supports of the city's devotions' or 'the foundations of the city's piety.' The Greek uses a metaphorical term for bases or supports.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 어떤 이들은 도시의 경건의 기반들을 가볍게 멸시하며, 마치 앞으로 올 왕과의 교제로 말미암아 큰 명성을 함께 누릴 것처럼, 쉽게 자기들을 내맡겼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘도시의 경건을 떠받치는 기반들’로도 옮길 수 있습니다. 그리스어 ἐπιβάθρας는 문자적으로 바닥/받침/기반의 비유적 표현입니다.
    reason: lexical_alternative
