  source_fidelity: ‘앞으로 올 왕과의 교제’는 ἐσομένης(‘앞으로 있게 될’)를 왕에게 수식시키므로, 원문의 뜻과 달리 ‘다가올 왕’을 뜻하게 됩니다. 이는 장차 있을 왕과의 교제를 수식하도록 바로잡아야 합니다. 나머지 핵심 의미(피상적/경솔한 멸시, 도시의 경건을 지탱하는 비유적 토대, 자발적 자기 양도, 기대된 명성)는 대체로 충실합니다.
