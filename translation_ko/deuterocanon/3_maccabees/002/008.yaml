  lexicon: LSJ
  rationale: 두 형용사의 중첩된 규모감을 보존하면서, 창조 행위의 선행성을 분사 구조로 반영했습니다.
- source_word: ἡγίασας τὸν τόπον τοῦτον εἰς σὸν ὄνομά
  english_pob_choice: made this place holy for your name
  chosen_korean: 이곳을 당신의 이름을 위하여 거룩하게 하셨습니다
  alternatives_korean:
  - 이곳을 당신의 이름을 위해 성별하셨습니다
