  lexicon: LSJ
  rationale: 문맥상 도성/장소를 하나님의 영광을 위해 세우셨다는 뜻이므로, 가장 포괄적인 동사 ‘세우다’로 옮겼습니다.
theological_decisions:
- issue: ἀπροσδεεῖ와 τῷ τῶν ἁπάντων의 난해한 결합을 어떻게 읽을지
  chosen_reading: 하나님을 ‘만물의 하나님’이며 ‘아무것도 필요로 하지 않으시는 분’으로 병렬 호칭한 것으로 옮겼습니다.
  alternative_readings:
  - ‘당신의 이름을 위하여, 만물 가운데 아무것도 필요로 하지 않으시는 분께’처럼 전치사구를 더 강하게 살리는 읽기
  - ‘당신은 모든 것에서 아무것도 필요로 하지 않으시는 분’이라는 더 직역적인 읽기
  rationale: 본문의 문법적 긴장을 해소하지 않고, 기도체 안에서 하나님의 자족성과 सार्व주권을 함께 드러내는 읽기를 택했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it; original-language primacy over translation tradition.
