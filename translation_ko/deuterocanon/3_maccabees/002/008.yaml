  lexicon: LSJ
  rationale: 문법적으로 난해한 삽입구를 POB의 해석에 따라 하나님에 대한 호격적 설명으로 풀어, ‘아무것도 필요로 하지 않으시는’이라는 직설적 표현으로 신적 자족성을 드러냈습니다.
- source_word: ἐν ἐπιφανείᾳ μεγαλοπρεπεῖ
  english_pob_choice: with majestic manifestation
  chosen_korean: 장엄한 나타나심으로
