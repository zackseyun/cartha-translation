  lexicon: LSJ
  rationale: ἐπιφάνεια의 현현/나타남 의미를 살리면서, 현대 독자가 읽기 쉬운 ‘나타나심’을 선택했습니다.
- source_word: σύστασιν ποιησάμενος αὐτοῦ
  english_pob_choice: having established it
  chosen_korean: 그것을 세우셨습니다
  alternatives_korean:
