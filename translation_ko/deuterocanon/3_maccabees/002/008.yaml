  rationale: 하나님께 드리는 호칭의 직접성을 살리면서도 현대 한국어 기도문으로 자연스러운 높임 표현을 택했습니다.
- source_word: κτίσας τὴν ἀπέρατον καὶ ἀμέτρητον γῆν
