base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/008.yaml
  text: You[a], O King, having created the boundless and immeasurable earth, chose this city and made this place holy for your name, though you have no need of anything[b], O God of all, and glorified it with majestic manifestation, having established it for the glory of your great and honored name.
  footnotes:
  - marker: a
    text: Or 'in majestic appearance' or 'by a splendid appearing'; the Greek phrase may refer to a visible divine epiphany.
    reason: lexical_alternative
  - marker: b
    text: The Greek text in this clause is syntactically difficult; the translation understands it as addressing God as the one who needs nothing and is God of all.
    reason: alternative_reading
translation:
  language: ko
  text: 주님, 무한하고 헤아릴 수 없는 땅을 창조하신 왕이시여, 이 도성을 택하시고 이곳을 당신의 이름을 위하여 거룩하게 하셨습니다. 만물의 하나님이시며 아무것도 필요로 하지 않으시는 분이시여, 장엄한 나타나심으로 그것을 영화롭게 하시고, 당신의 크고 존귀한 이름의 영광을 위하여 그것을 세우셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘장엄한 나타나심’은 ‘장엄한 현현’ 또는 ‘찬란한 나타남’으로도 옮길 수 있으며, 그리스어는 보이는 신적 현현을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 문법적으로 난해하지만, 여기서는 기도문에서 하나님을 ‘아무것도 필요로 하지 않으시는 분’으로 부르는 표현으로 이해했습니다.
    reason: alternative_reading
lexical_decisions:
