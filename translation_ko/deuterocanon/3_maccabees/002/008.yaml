- source_word: ἀπροσδεεῖ, τῷ τῶν ἁπάντων
  english_pob_choice: you have no need of anything, O God of all
  chosen_korean: 만물의 하나님이시며 아무것도 필요로 하지 않으시는 분이시여
  alternatives_korean:
