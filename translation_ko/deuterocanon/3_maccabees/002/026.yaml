  terminology: ‘부끄러움 없는 방탕’, ‘비방’, ‘왕의 뜻’은 적절합니다. 다만 δυσφημίας는 복수형이므로 ‘비방들이’로 반영할 수 있으며, ἐντείνοντας εἰς τὴν τοῦ βασιλέως πρόθεσιν은 단순한 내적 자기 몰아감보다 왕의 의도에 적극적으로 힘을 보태는 뜻으로 옮기는 것이 안전합니다.
