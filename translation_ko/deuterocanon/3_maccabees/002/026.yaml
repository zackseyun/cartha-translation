  lexicon: LSJ
  rationale: 두 형용사의 도덕적 강도를 살리되, 현대 한국어에서 문맥이 분명하고 과도하게 성적화되지 않도록 ‘방탕’을 중심어로 두었습니다.
- source_word: δυσφημίας ἐν τοῖς τόποις συνίστασθαι
  english_pob_choice: slanders were being stirred up in the places
  chosen_korean: 곳곳에서 비방이 퍼지게 되었고
  alternatives_korean:
  - 지역마다 비방이 일어나게 되었고
  - 그 지방들에서 중상모략이 조직되게 되었고
