base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/026.yaml
  text: He was not only inflamed with shameless debaucheries[a], but also advanced to such a degree of audacity that slanders were being stirred up in the places, and many of his friends, straining toward the king’s purpose[b], were themselves following his will.
  footnotes:
  - marker: a
    text: Or 'evil reports' or 'defamations' for 'slanders.' The Greek term can denote abusive or defamatory speech more broadly.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'in the places' may mean 'throughout the districts' or 'in the localities.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 부끄러움 없는 방탕에만 사로잡힌 것이 아니라, 그만큼 대담함까지 나아가 곳곳에서 비방이 퍼지게 되었고, 그의 친구들 가운데 많은 이들도 왕의 뜻을 향해 스스로를 몰아가며 그 사람의 뜻을 따랐습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악평들’, ‘중상들’로도 옮길 수 있습니다. 그리스어 δυσφημία는 비방이나 명예훼손적 언설을 더 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘곳곳에서’는 ‘지역마다’ 또는 ‘지방들에서’로도 옮길 수 있습니다. 그리스어 ἐν τοῖς τόποις는 범위를 다소 일반적으로 말합니다.
    reason: lexical_alternative
