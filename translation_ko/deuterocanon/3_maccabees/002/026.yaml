  rationale: 직역상의 ‘물리적으로 물리다/좀먹다’보다, 문맥상 죄에 끌려 들어가는 강한 내적 지배를 한국어로 자연스럽게 드러냈습니다.
- source_word: ἀναισχύστοις ἀσελγείαις
  english_pob_choice: shameless debaucheries
