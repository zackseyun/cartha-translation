  lexicon: LSJ
  rationale: δυσφημία는 단순한 ‘악평’보다 비방/중상에 가깝고, συνίστασθαι는 여기서 유포·조성의 결과를 보이므로 ‘퍼지다’로 자연스럽게 풀었습니다.
- source_word: ἐντείνοντας εἰς τὴν τοῦ βασιλέως πρόθεσιν
  english_pob_choice: straining toward the king’s purpose
  chosen_korean: 왕의 뜻을 향해 스스로를 몰아가며
  alternatives_korean:
