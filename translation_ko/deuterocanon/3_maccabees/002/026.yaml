  lexicon: LSJ
  rationale: ἐντείνοντας의 ‘긴장시키다/몰아붙이다’라는 힘겨운 움직임을 살려, 단순한 동조보다 적극적 추종의 뉘앙스를 드러냈습니다.
theological_decisions:
- issue: 왕의 의지와 친구들의 추종을 어떻게 표현할 것인가
  chosen_reading: 마지막 절을 ‘그 사람의 뜻을 따랐다’고 옮겨, 왕의 προσωπική 의지에 대한 편승과 복종의 의미를 분명히 했습니다.
  alternative_readings:
  - 그의 계획을 따랐다
  - 그의 소망을 따랐다
  - 그의 명령을 수행했다
  rationale: 본문은 정치적 권력자에 대한 사적 추종과 복종을 강조하므로, 지나치게 중립적인 ‘계획’보다 ‘뜻’이 원문의 긴장과 권위성을 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §1
