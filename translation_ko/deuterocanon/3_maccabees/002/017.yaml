  text: We trampled the house of holiness[b][a], just as the houses of the people of Jerusalem are trampled.
  footnotes:
  - marker: a
    text: Or 'the temple of holiness' or 'the house of consecration.' The Greek reads literally 'the house of sanctification.'
    reason: lexical_alternative
  - marker: b
    text: That is, the houses of the inhabitants of Jerusalem.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 거룩의 집을 짓밟았습니다[b][a], 예루살렘 주민들의 집들이 짓밟히는 것처럼 말입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘거룩의 집’입니다. 영어 POB의 ‘house of sanctification’에 해당하는 표현으로, ‘성전’처럼 해석해 풀지 않고 원문의 명사구를 보존했습니다.
    reason: lexical_alternative
  - marker: b
    text: 즉 예루살렘에 사는 사람들의 집들입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεπατήσαμεν
  english_pob_choice: we trampled
  chosen_korean: 짓밟았습니다
  alternatives_korean:
  - 밟아 짓눌렀습니다
  - 짓밟았습니다
  lexicon: LSJ
  rationale: 발로 거칠게 밟는 구체성을 살리면서도, 자기고백적 비난의 어조를 한국어에서 자연스럽게 드러냅니다.
- source_word: τὸν οἶκον
  english_pob_choice: the house
  chosen_korean: 집
  alternatives_korean:
  - 집
  - 성전
  lexicon: LSJ
  rationale: 원문은 οἶκος의 직역인 ‘집’을 쓰며, 신성한 대상은 뒤의 속격으로 규정됩니다. 한국어에서는 ‘집’이 가장 직접적이어서 이를 따랐습니다.
- source_word: τοῦ ἁγιασμοῦ
  english_pob_choice: of sanctification
  chosen_korean: 거룩의
  alternatives_korean:
  - 성화의
  - 성결의
  - 거룩의
  lexicon: LSJ
  rationale: ἁγιασμός의 명사성을 살리기 위해 ‘거룩의’로 옮겼습니다. POB의 영어 선택처럼 매끄러운 ‘성전’으로 풀지 않고, 원문의 낯선 결을 유지했습니다.
- source_word: τῶν προσολυμίων
  english_pob_choice: of the people of Jerusalem
  chosen_korean: 예루살렘 주민들의
  alternatives_korean:
  - 예루살렘 사람들의
  - 예루살렘 거주민들의
  lexicon: LSJ
  rationale: 지리적 추상명사가 아니라 도시의 실제 거주민을 가리키므로, ‘주민들’이 가장 분명합니다.
theological_decisions:
- issue: 성소를 가리키는 οἶκος를 ‘성전’으로 풀지 여부
  chosen_reading: ‘집’으로 두고, 속격 ‘거룩의’로 신성성을 표시했습니다.
  alternative_readings:
  - 성전
  - 성소
  rationale: 원문은 건물의 일반 명사 ‘집’을 유지하면서 그 성격을 속격으로 제한합니다. 이를 한국어에서도 보존해 파괴 행위의 물질성과 신성 모독의 긴장을 함께 살렸습니다.
  doctrine_reference: Translation philosophy §1, §5
