  source_fidelity: 핵심 동사 καταπατέω의 반복을 ‘짓밟았습니다/짓밟히듯이’로 일관되게 살린 점과 προσολύμιοι를 예루살렘 주민으로 옮긴 점은 원문에 충실합니다. 다만 ‘거룩의 집’은 한국어에서 비문에 가깝고, ἁγιασμός의 속격을 자연스럽게 반영하지 못합니다. ‘거룩한 집’은 원문의 명사구가 지닌 신성한 성격을 자연스럽게 전달하며, 각주에서 명사형의 가능한 직역을 밝혀 보완할 수 있습니다.
  naturalness: ‘예루살렘 주민들의 집들이 짓밟히는 것처럼 말입니다’도 이해되지만, 비교절은 ‘짓밟히듯이’가 더 간결하고 현대 표준어의 문장 흐름에 맞습니다. 또한 각주 표지는 해당 설명 대상에 바로 붙어야 합니다.
