  - 성소
  rationale: 원문은 건물의 일반 명사 ‘집’을 유지하면서 그 성격을 속격으로 제한합니다. 이를 한국어에서도 보존해 파괴 행위의 물질성과 신성 모독의 긴장을 함께 살렸습니다.
  doctrine_reference: Translation philosophy §1, §5
