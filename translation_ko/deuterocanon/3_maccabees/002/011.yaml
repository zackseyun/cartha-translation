  text: For even when our fathers were often afflicted[b][a], you helped them in their humiliation and rescued them from great evils.
  footnotes:
  - marker: a
    text: Or 'our ancestors.' The Greek reads 'our fathers.'
    reason: lexical_alternative
  - marker: b
    text: Or 'from great troubles' or 'from great calamities.' The Greek 'evils' here likely refers to severe harmful circumstances rather than moral evil alone.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리 조상들이 여러 번 고난을 당할 때에도, 당신께서는 그들의 비천한 처지에서 그들을 도우시고 큰 재난들에서 그들을 건져 주셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘우리 조상들’은 그리스어의 문자적 표현인 ‘우리의 아버지들’을 한국어에서 자연스럽게 풀어 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘큰 재난들’은 그리스어 κακά가 여기서 도덕적 악보다 해악·재앙의 의미로 쓰였음을 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλεονάκις
  english_pob_choice: often
  chosen_korean: 여러 번
  alternatives_korean:
  - 자주
  - 거듭
  lexicon: LSJ
  rationale: 반복성을 나타내는 부사로, 현대 한국어에서 자연스럽고 ‘often’의 뜻을 잘 살리는 표현으로 옮겼습니다.
- source_word: θλιβέντων
  english_pob_choice: were afflicted
  chosen_korean: 고난을 당할 때에도
  alternatives_korean:
  - 압박을 받을 때에도
  - 괴로움을 당할 때에도
  - 환난을 겪을 때에도
  lexicon: BDAG
  rationale: θλίβω의 수동 분사로서 외적 압박과 고통을 아우르므로, 문맥상 높은 어조의 기도문에 맞게 ‘고난을 당하다’로 옮겼습니다.
- source_word: τῶν πατέρων ἡμῶν
  english_pob_choice: our fathers
  chosen_korean: 우리 조상들
  alternatives_korean:
  - 우리 아버지들
  - 우리 선조들
  lexicon: LSJ
  rationale: 그리스어는 문자적으로는 ‘우리의 아버지들’이지만, 한국어에서는 직역보다 ‘조상들’이 혈연적 선조를 자연스럽게 드러냅니다. 성별 표지는 본문 의미에 큰 부담을 주지 않아 한국어 관용을 택했습니다.
- source_word: ἐν τῇ ταπεινώσει
  english_pob_choice: in their humiliation
  chosen_korean: 그들의 비천한 처지에서
  alternatives_korean:
  - 그들의 굴욕 속에서
  - 그들의 낮아짐 가운데
  - 그들의 비참함 속에서
  lexicon: BDAG
  rationale: ταπείνωσις는 단순한 ‘겸손’이 아니라 낮아짐, 비천함, 굴욕을 포함하므로, 맥락상 수난받는 상태를 드러내는 ‘비천한 처지’로 옮겼습니다.
- source_word: ἐρρύσω
  english_pob_choice: rescued
  chosen_korean: 건져 주셨습니다
  alternatives_korean:
  - 구해 주셨습니다
  - 구출해 주셨습니다
  - 건져 내셨습니다
  lexicon: BDAG
  rationale: ῥύομαι는 위험에서 건져 내다/구출하다의 뜻이므로, 구원의 전반적 신학어보다 구체적 구출감을 살리는 ‘건져 주셨습니다’를 선택했습니다.
- source_word: ἐκ μεγάλων κακῶν
  english_pob_choice: from great evils
  chosen_korean: 큰 재난들에서
  alternatives_korean:
  - 큰 악들에서
  - 큰 환난들에서
  - 큰 재앙들에서
  lexicon: LSJ
  rationale: κακά는 도덕적 악보다는 재난·해악을 가리킬 수 있으므로, 한국어에서는 오해를 줄이면서도 강도를 살리는 ‘큰 재난들’로 옮겼습니다.
theological_decisions:
- issue: 조상 지칭의 성별 표지와 한국어 자연성
  chosen_reading: 우리 조상들
  alternative_readings:
  - 우리 아버지들
  - 우리 선조들
  rationale: 원문은 πατέρων으로 남성 복수를 쓰지만, 한국어 기도문에서는 ‘우리 조상들’이 선조 집단을 가장 자연스럽게 전달합니다. 다만 의미상 혈통적 선조를 유지해 원문 취지는 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: κακά의 의미를 도덕적 악이 아닌 재난으로 이해
  chosen_reading: 큰 재난들
  alternative_readings:
  - 큰 악들
  - 큰 환난들
  - 큰 재앙들
  rationale: 문맥은 하나님이 과거에 백성을 위험한 상황에서 구원하신 회고이므로, 여기의 κακά는 도덕적 악 자체보다 해로운 처지와 재난을 가리키는 것으로 읽는 것이 적절합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 5
