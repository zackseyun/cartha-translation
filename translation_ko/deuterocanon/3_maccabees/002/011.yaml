  yaml_path: translation/deuterocanon/3_maccabees/002/011.yaml
  text: For even when our fathers were often afflicted[b][a], you helped them in their humiliation and rescued them from great evils.
  footnotes:
  - marker: a
    text: Or 'our ancestors.' The Greek reads 'our fathers.'
    reason: lexical_alternative
  - marker: b
    text: Or 'from great troubles' or 'from great calamities.' The Greek 'evils' here likely refers to severe harmful circumstances rather than moral evil alone.
    reason: lexical_alternative
translation:
  language: ko
  text: 왜냐하면 우리 아버지들[a]이 여러 번 고난을 당했을 때에도, 주님께서는 그들이 비천한 처지에 있을 때 그들을 도우시고 큰 재난[b]에서 그들을 건져 주셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘우리 아버지들’입니다. 여기서는 과거의 선조들을 가리키며, ‘우리 조상들’ 또는 ‘우리 선조들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 κακά는 여기서 도덕적 악만이 아니라 큰 해악, 환난 또는 재앙을 가리킬 수 있습니다.
    reason: lexical_alternative
