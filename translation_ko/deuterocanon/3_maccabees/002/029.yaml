translation:
  language: ko
  text: 그리고 등록되는 사람들[a] 또한 불로 몸에 디오뉘소스의 담쟁잎 표식을 낙인찍게 하고[b], 또한 제한된 지위에 편입되게 하였습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘등록되는 사람들’은 ‘등록한 사람들’ 또는 ‘등재되는 사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘디오뉘소스의 담쟁잎 표식으로’입니다. 이는 디오뉘소스 숭배와 관련된 담쟁잎 모양의 신체 낙인을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 그리스어 표현은 압축적이고 다소 불확실합니다. ‘제한된 시민적 지위’나 ‘축소된 법적 지위’, 또는 ‘제한된 권한 아래의 상태’로 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπογραφομένους
  english_pob_choice: those who registered
  chosen_korean: 등록된 사람들
  alternatives_korean:
  - 등록 중인 사람들
  - 기록된 사람들
  - 등록한 사람들
  lexicon: LSJ
  rationale: 행정적 등록/등재의 뜻을 살려 자연스러운 현대 한국어로 옮겼습니다. 중간/수동 분사라서 ‘등록된’이 가장 무난하고 원문의 공적 절차를 유지합니다.
- source_word: χαράσσεσθαι διὰ πυρὸς εἰς τὸ σῶμα
  english_pob_choice: be branded on the body ... by fire
  chosen_korean: 몸에 불로 ... 표식이 찍히게 하고
  alternatives_korean:
  - 몸에 불로 낙인이 찍히게 하고
  - 불로 몸에 새기게 하고
  - 화인(火印)으로 몸에 찍히게 하고
  lexicon: LSJ
  rationale: διὰ πυρός가 동반된 강제적 신체 표지를 반영해 ‘표식이 찍히다’로 옮기되, 불에 의한 가혹한 신체 표지라는 점을 유지했습니다.
- source_word: παρασήμῳ Διονύσου κισσοφύλλῳ
  english_pob_choice: with the ivy-leaf emblem of Dionysus
  chosen_korean: 디오뉘소스의 담쟁잎 표식
  alternatives_korean:
  - 디오뉘소스의 담쟁잎 문장
  - 디오뉘소스의 담쟁잎 배지
  - 디오뉘소스의 담쟁잎 마크
  lexicon: LSJ
  rationale: παράσημον은 구별 표지, 배지, 문장에 가까우므로 단순한 ‘표식’보다 상징적 소속 표시를 살리면서도 과도한 해석을 피했습니다. κισσοφύλλον은 디오뉘소스와 연관된 담쟁잎으로 옮겼습니다.
- source_word: προσυνεσταλμένην αὐθεντίαν
  english_pob_choice: his reduced status of authority
  chosen_korean: 그의 낮아진 권한의 상태
  alternatives_korean:
  - 그의 축소된 권한
  - 그의 제한된 시민적 지위
  - 그의 낮아진 법적 지위
  lexicon: LSJ
  rationale: 압축된 표현이라 정확한 사회·법적 범주를 단정하지 않고, ‘축소/낮아짐’의 핵심을 보존했습니다. αὐθεντία의 권한/지위 뉘앙스를 함께 살렸습니다.
theological_decisions:
- issue: 디오뉘소스의 종교적 표지와 강제 낙인
  chosen_reading: 디오뉘소스와 그의 담쟁잎 표지를 완곡하게 돌리지 않고 그대로 드러냈습니다.
  alternative_readings:
  - 이교도의 표지로 일반화하기
  - 종교적 문양으로 순화하기
  rationale: 본문은 특정 신과 상징을 명시하므로, 역사적·종교적 불쾌함과 강압성을 약화시키지 않는 것이 원문 충실성에 맞습니다.
  doctrine_reference: 번역 원칙 §1, §6
- issue: προσυνεσταλμένην αὐθεντίαν의 의미 불확실성
  chosen_reading: 주본문에서는 ‘낮아진 권한의 상태’로 보수적으로 옮기고, 단정적 법률용어로 좁히지 않았습니다.
  alternative_readings:
  - 제한된 시민적 지위
  - 축소된 법적 지위
  - 제한된 권위
  rationale: 그리스어가 압축적이고 다의적이므로, 해석의 폭을 남긴 채 원문의 사회적 격하를 전달하는 것이 적절합니다.
  doctrine_reference: 번역 원칙 §3
