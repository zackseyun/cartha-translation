  text: and that those who registered should also be branded on the body with the ivy-leaf emblem of Dionysus by fire[c][b][a], and should also be enrolled in his reduced status of authority.
  footnotes:
  - marker: a
    text: Or 'those being registered' or 'those enrolled.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'with the ivy-leaf emblem of Dionysus,' referring to a bodily brand identifying them with the cult of Dionysus.
