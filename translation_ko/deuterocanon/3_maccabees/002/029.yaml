  source_fidelity: ‘그의 낮아진 권한의 상태’는 그리스어에 없는 소유 관계를 삽입하며, 한국어로도 의미 관계가 불명확합니다. προσυνεσταλμένην αὐθεντίαν의 압축성과 사회적·법적 제한의 함의를 유지하되, 특정 인물의 ‘권한’으로 단정하지 않는 표현이 필요합니다. 또한 χαράσσεσθαι διὰ πυρός는 단순 표식보다 불에 의한 낙인을 분명히 나타내는 것이 적절합니다.
  naturalness: ‘몸에 불로 … 표식이 찍히게’와 ‘낮아진 권한의 상태에 등록되게’는 현대 표준 한국어에서 다소 부자연스럽습니다. ‘불로 몸에 … 표식을 낙인찍게’ 및 ‘제한된 지위에 편입되게’는 문장의 행정적·강압적 성격을 자연스럽게 전달합니다.
  terminology: 디오뉘소스와 담쟁잎 표식은 유지합니다. ‘낙인찍다’는 χαράσσεσθαι와 διὰ πυρός의 결합을 충실히 반영합니다. αὐθεντία의 정확한 제도적 지시 대상은 불확실하므로 본문에서는 ‘제한된 지위’로 절제해 옮기고, 각주에서 시민적·법적 지위 및 제한된 권한 아래의 상태라는 가능성을 제시합니다.
