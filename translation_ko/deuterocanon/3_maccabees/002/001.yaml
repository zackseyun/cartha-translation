  source_fidelity: 원문의 호칭 누적, ‘하늘들’의 복수, 지속적으로 억압받는 상태는 대체로 충실히 반영되었습니다. 그러나 βεβήλου를 ‘더러운’으로 옮기면 ‘속된/신성을 범한’이라는 핵심 뜻보다 물리적·의례적 오염의 뜻이 강해질 수 있습니다. 또한 원문의 단수 분사 수식어를 문장 뒤의 ‘그는’으로 분리하기보다 해당 ‘자’를 직접 수식하게 하는 편이 원문의 결속을 더 잘 보존합니다.
  naturalness: 현대 합쇼체 기도문으로 전반적으로 자연스럽습니다. 다만 ‘불경하고 더러운 자에게 … 그는’은 지시 대상이 이미 드러나 있음에도 문장이 분절되어 다소 어색합니다. 수식어를 한 덩어리로 배열하면 더 매끄럽고 엄숙한 문체가 됩니다.
  terminology: ‘주님’, ‘온 피조물의 주인’, ‘홀로 다스리시는 분’, ‘전능하신 분’은 각기 다른 그리스어 호칭을 무리 없이 구별합니다. βέβηλος는 여기서 ‘속된’으로 옮기는 것이 ‘불경한’과의 병렬 및 종교적 의미를 더 정확히 드러냅니다.
