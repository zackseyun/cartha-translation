base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/001.yaml
  text: Lord[a], Lord, king of the heavens and master of all creation, holy among the holy ones, sole ruler, Almighty[b], pay attention to us who are being oppressed by an unholy and profane man, swollen with arrogance and strength.
  footnotes:
  - marker: a
    text: Or 'holy in the holy ones.' The Greek phrase is compact and somewhat liturgical; 'among the holy ones' is a natural English rendering.
    reason: lexical_alternative
  - marker: b
    text: The Greek does not explicitly say 'man,' but the singular participial description points to a single hostile person; 'man' is supplied for clear English.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 주님, 하늘들의 왕, 온 피조물의 주인, 거룩한 이들 가운데 거룩하신 분, 홀로 다스리시는 분, 전능하신 분이시여, 불경하고 더러운 자에게 억눌려 있는 우리를 돌아보십시오. 그는 오만과 힘으로 부풀어 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하늘들의 왕’은 그리스어 복수형 τῶν οὐρανῶν을 반영한 것입니다.
    reason: source_note
  - marker: b
    text: ‘거룩한 이들 가운데 거룩하신 분’은 ἅγιε ἐν ἁγίοις의 압축된 예배적 표현을 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε, Κύριε
  english_pob_choice: Lord, Lord
  chosen_korean: 주님, 주님
  alternatives_korean:
  - 주여, 주여
  - 주님이여, 주님이여
  lexicon: LSJ
  rationale: 연호 형식의 직접 호칭이므로 두 번의 호칭을 살리되, 현대 합쇼체 예배문체에 맞는 ‘주님’으로 옮겼습니다.
- source_word: βασιλεῦ τῶν οὐρανῶν
  english_pob_choice: king of the heavens
  chosen_korean: 하늘들의 왕
  alternatives_korean:
  - 하늘의 왕
  - 하늘 나라의 왕
  lexicon: LSJ
  rationale: 복수형 τῶν οὐρανῶν을 반영해 ‘하늘들’로 옮겨, 단수 관용구로 평탄화하지 않았습니다.
- source_word: δέσποτα πάσης τῆς κτίσεως
  english_pob_choice: master of all creation
  chosen_korean: 온 피조물의 주인
  alternatives_korean:
  - 온 창조의 주인
  - 모든 창조의 주인
  - 만물의 주인
  lexicon: LSJ
  rationale: δέσποτα의 절대적 소유권과 통치 뉘앙스를 살리되, 이미 앞에서 나온 κύριε와 겹치지 않도록 ‘주인’으로 구분했습니다.
- source_word: ἅγιε ἐν ἁγίοις
  english_pob_choice: holy among the holy ones
  chosen_korean: 거룩한 이들 가운데 거룩하신 분
  alternatives_korean:
  - 거룩한 이들 가운데 거룩하신 이
  - 거룩한 자들 가운데 거룩하신 분
  - 거룩함 가운데 거룩하신 분
  lexicon: LSJ
  rationale: 전치사구의 압축된 예배적 표현을 유지하면서, ‘among the holy ones’의 의미를 한국어로 자연스럽게 드러냈습니다.
- source_word: μόναρχε
  english_pob_choice: sole ruler
  chosen_korean: 홀로 다스리시는 분
  alternatives_korean:
  - 유일한 통치자
  - 한 분뿐인 다스리심
  lexicon: LSJ
  rationale: ‘모나르케’의 유일한 주권을 현대 한국어의 동적 관용으로 풀어, 군주제적 오해를 줄였습니다.
- source_word: παντοκράτωρ
  english_pob_choice: Almighty
  chosen_korean: 전능하신 분
  alternatives_korean:
  - 전능자
  - 만물을 다스리시는 분
  lexicon: LSJ
  rationale: 하나님께 붙는 표제어를 한국 교회 용례에 맞으면서도 본문 어휘의 무게를 살려 옮겼습니다.
- source_word: πρόσχες ἡμῖν
  english_pob_choice: pay attention to us
  chosen_korean: 우리를 돌아보십시오
  alternatives_korean:
  - 우리를 살펴주십시오
  - 우리에게 주목해 주십시오
  - 우리에게 귀를 기울이십시오
  lexicon: LSJ
  rationale: 직역의 ‘주의를 기울이다’보다 청원 맥락에서 더 자연스러운 ‘돌아보다’를 택하되, 간구의 긴박함을 유지했습니다.
- source_word: καταπονουμένοις
  english_pob_choice: being oppressed
  chosen_korean: 억눌려 있는
  alternatives_korean:
  - 압제받고 있는
  - 괴롭힘을 당하고 있는
  - 고통받고 있는
  lexicon: LSJ
  rationale: 수동 현재 분사의 지속적 압박 상태를 반영하여, 외적 폭력 아래 눌린 상태를 분명히 했습니다.
- source_word: ἀνοσίου καὶ βεβήλου
  english_pob_choice: unholy and profane
  chosen_korean: 불경하고 더러운
  alternatives_korean:
  - 경건치 않고 속된
  - 신성하지 않고 속된
  - 불경하고 속된
  lexicon: LSJ
  rationale: 두 형용사의 종교적·도덕적 오염을 분리하되, 한국어에서는 ‘더러운’으로 βεβήλου의 의례적 부정함을 살렸습니다.
- source_word: θράσει καὶ σθένει πεφρυασμένου
  english_pob_choice: swollen with arrogance and strength
  chosen_korean: 오만과 힘으로 부풀어 있습니다
  alternatives_korean:
  - 대담함과 힘으로 부풀어 있습니다
  - 오만과 권세로 부풀어 있습니다
  - 뻔뻔함과 힘으로 부풀어 있습니다
  lexicon: LSJ
  rationale: πεφρυασμένου의 ‘부풀다/과장되다’ 이미지를 살리고, θράσει와 σθένει의 결합을 한국어로 과도한 자만과 القوة의 과시로 표현했습니다.
theological_decisions:
- issue: 여러 신적 호칭의 누적을 한국어에서 어떻게 보존할지
  chosen_reading: 각 호칭을 분리해 ‘주님, 주님, 하늘들의 왕, 온 피조물의 주인, 거룩한 이들 가운데 거룩하신 분, 홀로 다스리시는 분, 전능하신 분’으로 옮겼습니다.
  alternative_readings:
  - 호칭들을 묶어 한두 개의 일반 표현으로 축약하는 방법
  rationale: 본문은 기도문에서 신적 위칭을 누적해 강조하므로, 구별되는 칭호를 유지해야 수사적·신학적 밀도를 보존할 수 있습니다.
