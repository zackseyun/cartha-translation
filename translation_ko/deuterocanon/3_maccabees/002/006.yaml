theological_decisions:
- issue: 출애굽 암시의 명시 여부
  chosen_reading: 본문의 대명사와 분사 구조를 유지하고, 인명(바로, 이스라엘)은 본문에 보태지 않았습니다.
  alternative_readings:
  - ‘바로가’ 또는 ‘이스라엘을’ 본문에 명시하기
  rationale: 그리스어가 직접 이름을 제시하지 않으므로, 암시를 본문 밖으로 확장하지 않고 독자가 문맥으로 알아보도록 두었습니다.
  doctrine_reference: 원문 우선 원칙; 본문이 말하는 것만 말하기
- issue: 하나님 주권 칭호의 형식
  chosen_reading: ‘온 창조를 다스리시는 분’으로 옮겨, 보편적 통치의 신학적 무게를 살렸습니다.
  alternative_readings:
  - ‘온 창조의 주권자’
  - ‘온 창조를 다스리는 분’
  rationale: dυναστεύοντι의 통치성을 유지하면서도, 경건한 수식어를 과도하게 격식화하지 않아 본문이 가진 찬양의 어조를 보존했습니다.
  doctrine_reference: 하나님의 सार्व주권 표현을 직접적으로 유지하는 번역 원칙
