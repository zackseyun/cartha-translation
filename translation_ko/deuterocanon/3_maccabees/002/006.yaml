  yaml_path: translation/deuterocanon/3_maccabees/002/006.yaml
  text: And when he pursued him with chariots and a multitude of people[a], you overwhelmed him in the depths of the sea; but those who had put their trust in you, who rule over all creation[b], you brought safely through.
  footnotes:
  - marker: a
    text: 'The verse alludes to the Exodus: the Egyptian pursuer was overwhelmed in the sea, while God''s people were brought safely through.'
    reason: cross_reference
  - marker: b
    text: Or 'the sovereign over all creation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 병거들과 많은 무리와 함께 그를 뒤쫓았을 때, 주님께서는 그를 바다 깊은 곳에 잠기게 하셨습니다.[a] 그러나 온 창조를 다스리시는 주님께서는[b] 주님을 신뢰한 이들을 무사히 건너가게 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 구절은 출애굽 사건을 암시합니다. 이집트의 추격자는 바다에서 휩쓸리고, 하나님의 백성은 안전하게 건너갑니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘온 창조의 주권자’.
    reason: lexical_alternative
