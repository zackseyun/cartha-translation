  yaml_path: translation/deuterocanon/3_maccabees/002/015.yaml
  text: But since you were pleased to display your glory among your people Israel[a], you have sanctified this place.
  footnotes:
  - marker: a
    text: Or, more literally, 'you were pleased with your glory among your people Israel.' The Greek can be rendered more formally, but the main text expresses the likely sense in natural English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 주께서 당신의 영광을 당신의 백성 이스라엘 가운데 나타내시기를 기뻐하셨으므로, 이곳을 거룩하게 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 직역에 가깝게, “당신의 백성 이스라엘 가운데 있는 당신의 영광을 기뻐하셨으므로.” 그리스어 표현은 이처럼도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  lexicon: BDAG
  rationale: 앞뒤 진술의 대비를 드러내는 역접이므로, 합쇼체 문맥에서 자연스러운 ‘그러나’로 옮겼습니다.
- source_word: εὐδόκησας
  english_pob_choice: you were pleased
  chosen_korean: 기뻐하셨습니다
  alternatives_korean:
  - 흐뭇해하셨습니다
  - 좋아하셨습니다
  lexicon: BDAG
  rationale: 하나님의 뜻에 대한 호의를 나타내는 동사이므로, 단순 감정이 아니라 주권적 호의를 드러내는 ‘기뻐하셨습니다’가 적절합니다.
- source_word: τὴν δόξαν σου
  english_pob_choice: to glorify yourself / your glory
  chosen_korean: 당신의 영광
  alternatives_korean:
  - 당신 자신의 영광
  - 당신의 영예
  lexicon: BDAG
  rationale: 그리스어는 직역하면 ‘당신의 영광’이며, 문맥상 그 영광이 이스라엘 가운데 드러난다는 뜻이므로 본문에서는 명사형을 유지했습니다.
- source_word: ἐν τῷ λαῷ σου Ἰσραήλ
  english_pob_choice: among your people Israel
  chosen_korean: 당신의 백성 이스라엘 가운데
  alternatives_korean:
  - 당신의 백성 이스라엘 안에
  - 이스라엘 가운데
  lexicon: BDAG
  rationale: ἐν의 관계적 용법을 살려 ‘가운데’로 옮겨, 하나님의 영광이 이스라엘 공동체 안에서 나타난다는 의미를 자연스럽게 반영했습니다.
- source_word: ἡγίασας
  english_pob_choice: you have sanctified
  chosen_korean: 거룩하게 하셨습니다
  alternatives_korean:
  - 성별하셨습니다
  - 봉헌하셨습니다
  lexicon: BDAG
  rationale: ἁγιάζω의 핵심은 구별하여 거룩한 용도로 세우는 것이므로, 현대 한국어에서 가장 직접적인 ‘거룩하게 하셨습니다’를 택했습니다.
theological_decisions:
- issue: ‘your glory’의 번역 방식
  chosen_reading: 하나님의 영광이 이스라엘 가운데 나타난다는 의미를 살려 명사형으로 옮겼습니다.
  alternative_readings:
  - ‘당신의 영광을 드러내시기를 기뻐하셨으므로’처럼 동사화
  - ‘당신 자신을 영화롭게 하시기를’처럼 의역
  rationale: 본문의 ‘δόξαν’은 단순히 ‘영화롭게 하다’라는 동작보다 하나님의 영광 자체가 현현하는 초점을 가지므로, 과도한 의역을 피하고 명사형을 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
- issue: 거룩하게 하심의 의미
  chosen_reading: 예배 장소를 구별하여 성스러운 용도로 세우셨다는 의미로 이해했습니다.
  alternative_readings:
  - 도덕적으로 깨끗하게 하셨다는 의미
  - 성전 자체를 변화시켰다는 의미
  rationale: ἡγίασας는 장소를 정결의 의미로 도덕화하기보다, 하나님께 속한 거룩한 공간으로 구별하셨다는 뜻이므로 그 방향을 유지했습니다.
  doctrine_reference: BDAG ἁγιάζω / DOCTRINE.md §Translation philosophy 1
