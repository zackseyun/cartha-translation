  yaml_path: translation/deuterocanon/3_maccabees/002/028.yaml
  text: Let no one who does not sacrifice enter their sanctuaries[a], but let all the Jews be subjected to registration and slave status[c][b], and let those who object be taken by force and put to death.
  footnotes:
  - marker: a
    text: Or 'their sanctuaries' or 'their holy things'; the Greek τὰ ἱερά can refer to sacred places as well as sacred rites/things.
    reason: lexical_alternative
  - marker: b
    text: '''Registration'' may refer more specifically to enrollment for state control or taxation.'
    reason: cultural_note
  - marker: c
    text: Literally, 'remove from living'—that is, put to death.
    reason: lexical_alternative
translation:
  language: ko
  text: 제사하지 않는 사람은 누구도 그들의 성소에 들어가지 못하게 하며, 모든 유대인들은 등록과 노예 상태에 넘겨지게 하고, 거기에 이의를 제기하는 자들은 강제로 끌려가 생명을 빼앗기게 하십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 성전들’, ‘그들의 거룩한 것들’로도 옮길 수 있습니다. τὰ ἱερά는 성소와 거룩한 것들을 모두 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘등록’은 국가 통제나 과세를 위한 명부 작성일 수 있습니다.
    reason: cultural_note
  - marker: c
    text: 직역하면 ‘살아 있음에서 옮기다’라는 뜻으로, 곧 죽이라는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τὰ ἱερὰ αὐτῶν
  english_pob_choice: their sanctuaries
  chosen_korean: 그들의 성소
  alternatives_korean:
  - 그들의 성전들
  - 그들의 거룩한 것들
  - 그들의 신성한 예식
  lexicon: LSJ
  rationale: τὰ ἱερά는 성소·성역·거룩한 것들을 가리킬 수 있지만, 본문에서는 ‘들어가다’와 결합해 공간적 접근 제한이 핵심이므로 ‘성소’가 가장 직접적입니다.
- source_word: λαογραφίαν
  english_pob_choice: registration
  chosen_korean: 등록
  alternatives_korean:
  - 호구 등록
  - 인구 등록
  - 징세 등록
  lexicon: LSJ
  rationale: 이 명사는 인구를 명부에 올리는 행위를 가리키며, 과도한 구체화 없이 국가 통제의 성격을 살리기 위해 ‘등록’으로 옮겼습니다.
- source_word: οἰκετικὴν διάθεσιν
  english_pob_choice: slave status
  chosen_korean: 노예 상태
  alternatives_korean:
  - 노예 신분
  - 종의 상태
  - 예속 상태
  lexicon: LSJ
  rationale: 이 표현은 단순한 봉사가 아니라 강제적 종속 상태를 뜻하므로, POB의 ‘slave status’를 따라 억압성을 드러내는 ‘노예 상태’로 옮겼습니다.
- source_word: τοῦ ζῇν μεταστῆσαι
  english_pob_choice: put to death
  chosen_korean: 생명을 빼앗기게 하십시오
  alternatives_korean:
  - 죽이게 하십시오
  - 사형에 처하게 하십시오
  - 살아 있음에서 제거하게 하십시오
  lexicon: LSJ
  rationale: 직역하면 ‘살아 있음에서 옮기다’이지만 한국어에서는 관용적으로 이해되는 결과를 분명히 하기 위해 ‘생명을 빼앗다’로 풀었습니다.
