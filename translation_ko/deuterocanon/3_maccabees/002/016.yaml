    text: 또는 ‘그들의 부정함 가운데서 우리에게 원수를 갚지 마시고.’ ἐκδίκησῃς는 응보를 집행하거나 보복하는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘속되게 함’ 또는 ‘성물을 더럽힘.’ 이 명사는 거룩한 것을 속된 것으로 취급하는 행위를 가리킵니다.
