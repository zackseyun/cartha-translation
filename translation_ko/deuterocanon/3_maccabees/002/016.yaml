  text: 그들의 부정함 때문에 우리를 벌하지 마시고[a], 그 모독에 대하여 우리에게 책임을 묻지 마소서[b]. 그리하여 무법한 자들이 자기들의 분노 가운데서 자랑하거나 자기들의 거만한 말을 하며 기뻐하지 못하게 하소서. 그들이 말하기를,
  philosophy: optimal-equivalence
  footnotes:
