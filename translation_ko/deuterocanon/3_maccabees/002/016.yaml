theological_decisions:
- issue: τούτων의 지시 대상과 번역 처리
  chosen_reading: ‘그들의’는 앞선 적대자들을 가리키는 것으로 보아, 청자에게 귀속되는 오염이 아니라 외부 집단의 부정함과 더럽힘을 염두에 둔 기도로 읽었습니다.
  alternative_readings:
  - ‘이것들의/이것들 때문에’처럼 더 추상적으로 이해할 수 있음
  rationale: 문맥상 ‘우리’와 ‘불법한 자들’의 대조가 분명하므로, 인칭적 지시를 살려 기도의 논지를 보존하는 것이 가장 자연스럽습니다.
  doctrine_reference: 원문 우선 원칙; 문맥상 지시어의 인칭성 유지
- issue: μή...μηδὲ...ἵνα μὴ...의 연쇄 목적/결과 구조
  chosen_reading: 부정 간구 뒤에 ‘이는 ~하지 못하게 하려는 것입니다’로 옮겨, 악인들의 자랑과 환호가 막히는 목적을 분명히 드러냈습니다.
  alternative_readings:
  - 단순히 ‘그래서/그리하여’로 결과를 나타낼 수 있음
  rationale: 헬라어 ἵνα μὴ는 분명한 목적 절이므로, 한국어에서도 기도문의 논리적 흐름이 살아나도록 목적 표현을 선택했습니다.
  doctrine_reference: 원문 통사 보존; 기도문 목적절 처리
