  alternative_readings:
  - '''주의 능력으로 하신 일들''처럼 의미를 해석해 풀어쓰기'
  - '''전능자''로 축약'
  rationale: 원문의 비유적 표현인 '손'을 지우지 않고, 동시에 찬양의 대상이 신적 주권자임을 분명히 하기 위함입니다.
  doctrine_reference: 성경적 비유 보존 및 신적 호칭 일관성
