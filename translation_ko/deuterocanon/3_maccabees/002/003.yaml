  text: You destroyed those in former times who practiced unrighteousness—among whom were giants[b][a], trusting in their strength and boldness—by bringing immeasurable water upon them.
  footnotes:
  - marker: a
    text: Or 'audacity' or 'insolence' for 'boldness'; the Greek term can suggest reckless arrogance in this context.
    reason: lexical_alternative
  - marker: b
    text: Literally 'immeasurable water'; the sense is the overwhelming waters of the flood.
    reason: cross_reference
translation:
  language: ko
  text: 주께서는 예전에 불의를 행한 자들—그들 가운데는 자기들의 힘과 대담함을 믿던 거인들이 있었습니다—을 멸하시고, 헤아릴 수 없는 물을 그들 위에 내리심으로 그렇게 하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘대담함’은 이 문맥에서 단순한 용기보다 무모한 자신감이나 뻔뻔함의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘헤아릴 수 없는 물’은 문자적으로는 ‘헤아릴 수 없는 물’이지만, 뜻은 홍수의 압도적인 물을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: τοὺς ἔμπροσθεν
  english_pob_choice: those in former times
  chosen_korean: 예전에
  alternatives_korean:
  - 옛날에
  - 먼저 있던 자들을
  - 그 이전 세대의 자들을
  lexicon: LSJ
  rationale: 공간적 ‘앞’이 아니라 시간적으로 앞선 시대를 가리키므로, 간결한 ‘예전에’로 옮겨 문맥의 역사적 시간을 살렸습니다.
- source_word: ἀδικίαν ποιήσαντας
  english_pob_choice: who practiced unrighteousness
  chosen_korean: 불의를 행한 자들
  alternatives_korean:
  - 불의를 저지른 자들
  - 부정의를 행한 자들
  - 악을 행한 자들
  lexicon: BDAG/LSJ
  rationale: 직역하면 ‘불의를 행한’이므로 그 의미를 살리되, 한국어에서 자연스러운 완결형 명사구로 다듬었습니다.
- source_word: γίγαντες
  english_pob_choice: giants
  chosen_korean: 거인들이
  alternatives_korean:
  - 거대한 자들이
  - 강한 자들이
  - 티탄들이
  lexicon: LSJ
  rationale: 본문의 어휘력을 약화시키지 않기 위해 일반화하지 않고 ‘거인들’을 유지했습니다.
- source_word: θράσει
  english_pob_choice: boldness
  chosen_korean: 대담함
  alternatives_korean:
  - 담대함
  - 무모한 대담함
  - 뻔뻔함
  lexicon: LSJ
  rationale: 이 문맥에서는 긍정적 용기보다 위험한 자신감의 뉘앙스가 있으므로, ‘대담함’으로 옮기고 그 부정적 함의는 문맥이 드러내도록 했습니다.
- source_word: ἐπαγαγὼν αὐτοῖς ἀμέτρητον ὕδωρ
  english_pob_choice: by bringing immeasurable water upon them
  chosen_korean: 헤아릴 수 없는 물을 그들 위에 내리심으로
  alternatives_korean:
  - 헤아릴 수 없는 물을 그들 위에 가져오심으로
  - 헤아릴 수 없는 홍수를 그들 위에 내리심으로
  - 한량없는 물을 그들 위에 덮으심으로
  lexicon: LSJ
  rationale: 본문은 ‘물’을 말하므로 ‘홍수’로 풀어 쓰지 않고, 원문의 난점인 ἀμέτρητον ὕδωρ을 그대로 살리되 한국어에서 자연스러운 ‘내리심’으로 재구성했습니다.
theological_decisions:
- issue: γίγαντες와 홍수 심판의 관계를 해석으로 좁힐지 여부
  chosen_reading: ‘거인들’을 그대로 두고, 심판 수단도 ‘헤아릴 수 없는 물’로 유지했습니다.
  alternative_readings:
  - ‘힘센 자들’로 완화하기
  - ‘홍수’라고 명시하기
  rationale: 본문은 창세기의 홍수 전승을 분명히 환기하지만, 그리스어 자체는 ‘거인들’과 ‘헤아릴 수 없는 물’을 사용하므로, 원문 어휘의 긴장을 지우지 않았습니다.
  doctrine_reference: 원문 우선, 전승 조화보다 본문 보존
- issue: ‘대담함’의 평가적 뉘앙스
  chosen_reading: 중립적 단어를 쓰되 전체 문맥에서 부정적 평가가 드러나도록 했습니다.
  alternative_readings:
  - ‘무모한 오만’으로 강화하기
  - ‘용기’로 완화하기
  rationale: θράσει는 문맥상 칭찬이 아니지만, 한국어 본문에 해석을 과도하게 주입하지 않도록 절제했습니다.
  doctrine_reference: 어휘의 양가성 보존
