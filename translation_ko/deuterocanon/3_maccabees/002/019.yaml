translation:
  language: ko
  text: 주님의 긍휼이 속히 우리에게 먼저 이르게 하시고[a], 넘어져 영혼이 부서진 자들의 입에 찬양을 담아 주시어[b] 우리에게 평화를 이루어 주소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 긍휼이 속히 우리보다 앞서 가게 하시고.’ 그리스어 동사는 ‘앞서 오다’ 또는 ‘앞서 가다’, 곧 필요에 앞서 미리 이르다라는 뜻으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘넘어져 영혼이 부서진 자들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προκαταλαβέτωσαν
  english_pob_choice: come before us
  chosen_korean: 우리보다 앞서게 하시고
  alternatives_korean:
  - 우리 앞에 오게 하시고
  - 우리보다 먼저 오게 하시고
  - 우리보다 앞서 가게 하시고
  lexicon: LSJ
  rationale: 기도문 맥락에서 ‘미리 맞이하다/앞서다’의 뜻을 살려, 하나님의 긍휼이 지체 없이 먼저 이르기를 구하는 뉘앙스를 자연스럽게 옮겼습니다.
- source_word: οἰκτιρμοί
  english_pob_choice: mercies
  chosen_korean: 긍휼
  alternatives_korean:
  - 자비
  - 자애
  - 긍휼하심
  lexicon: LSJ
  rationale: 복수형의 감정적·행위적 자비를 한국어 성경체에서 가장 직접적으로 드러내는 말로 ‘긍휼’을 택했습니다.
- source_word: καταπεπτωκότων καὶ συντετριμμένων τὰς ψυχάς
  english_pob_choice: those who have fallen and whose souls are crushed
  chosen_korean: 넘어져 영혼이 부서진 자들
  alternatives_korean:
  - 엎드러져 영혼이 깨어진 자들
  - 넘어지고 마음이 상한 자들
  - 쓰러져 심령이 부서진 자들
  lexicon: LSJ
  rationale: Greek의 상태표현을 유지하되, ψυχή를 ‘영혼’으로 옮겨 원문과의 투명성을 살렸습니다.
- source_word: αἰνέσεις
  english_pob_choice: praise
  chosen_korean: 찬양
  alternatives_korean:
  - 찬미
  - 찬송
  - 찬양들
  lexicon: LSJ
  rationale: ‘입에 찬양을 두다’라는 이미지를 살리면서도 현대 한국어에서 가장 자연스럽고 예배적인 표현을 선택했습니다.
- source_word: ποιήσας ἡμῖν εἰρήνην
  english_pob_choice: having made peace for us
  chosen_korean: 우리를 위하여 평강을 이루셨습니다
  alternatives_korean:
  - 우리를 위하여 평강을 만드셨습니다
  - 우리에게 평강을 주셨습니다
  - 우리에게 평화를 이루셨습니다
  lexicon: LSJ
  rationale: aorist participle의 완료된 결과를 반영하여, ‘이루셨습니다’로 번역해 하나님의 행동이 이미 성취된 사실임을 드러냈습니다. ‘평강’은 POB 기본 용어를 따랐습니다.
theological_decisions:
- issue: ψυχή의 번역
  chosen_reading: ‘영혼’으로 직역하여 인간 내면의 상처와 붕괴를 드러냄
  alternative_readings:
  - 마음
  - 심령
  - 삶
  rationale: 원문이 명시적으로 ψυχαί를 사용하므로, 의미를 완화하지 않고 ‘영혼’으로 유지해 source transparency를 보존했습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: 문장의 기도적 호소와 완료된 평강의 관계
  chosen_reading: 간구와 선언을 함께 살리는 종결형 번역
  alternative_readings:
  - …평강을 주십시오
  - …평강을 이루게 하소서
  rationale: 첫 절은 간구이고 마지막 절은 하나님의 이미 이루신 행위를 나타내므로, 한국어에서도 청원과 완료 결과를 구분해 원문의 흐름을 유지했습니다.
  doctrine_reference: Translation philosophy §6
