    rationale: 원문은 긍휼이 주어를 앞서거나 미리 이르는 것을 말합니다. ‘긍휼이 우리보다 먼저 이르게 하시고’ 또는 ‘우리보다 앞서 가게 하시고’로 고쳐야 합니다.
  - severity: low
    issue: ‘우리보다 앞서게’는 한국어에서 비교 대상과 도달 지점이 다소 불분명합니다.
    rationale: ‘우리에게 먼저 이르게’는 긍휼이 필요를 미리 채우도록 해 달라는 기도 맥락을 더 자연스럽고 정확하게 드러냅니다.
