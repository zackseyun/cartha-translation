revisions:
- from: 그러나 그들 대부분은 고결한 영으로 용기를 내어, 생명을 위해 재산을 맞바꾸면서도 경건을 저버리지 않았고, 담대하게 자기들이 등록 명부에서 벗어날 만하다고 여겼습니다.[a][b]
  to: 그러나 그들 대부분은 고귀한 마음으로 용기를 내어, 생명을 보전하려고 재산을 내어 놓으면서도 경건을 저버리지 않았으며[a], 담대하게 스스로 등록 명부에서 벗어나는 것을 마땅히 여겼습니다.[b]
  rationale: 원문의 절 구조를 보존하면서, γενναίᾳ ψυχῇ를 현대 한국어에 자연스러운 ‘고귀한 마음’으로, περὶ τοῦ ζῇν을 ‘생명을 보전하려고’로 명료화했습니다. ἐτιμῶντο의 평가적 뉘앙스는 ‘마땅히 여기다’로 살렸으며, 각주 표지를 실제 설명 대상인 절과 명사구에 각각 연결했습니다.
