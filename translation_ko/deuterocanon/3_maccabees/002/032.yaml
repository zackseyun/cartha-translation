  yaml_path: translation/deuterocanon/3_maccabees/002/032.yaml
  text: But most of them[a], took courage with a noble spirit, did not abandon their piety by exchanging their possessions for life[b], but boldly counted themselves worthy to escape the registration lists.
  footnotes:
  - marker: a
    text: Or 'did not depart from their godliness by trading their property to preserve their lives.'
    reason: lexical_alternative
  - marker: b
    text: The 'registration lists' are the official enrollment records mentioned in the surrounding context, apparently used to identify Jews for the king's oppressive measures.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 그들 대부분은 고귀한 마음으로 용기를 내어, 생명을 보전하려고 재산을 내어 놓으면서도 경건을 저버리지 않았으며[a], 담대하게 스스로 등록 명부에서 벗어나는 것을 마땅히 여겼습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘생명을 보전하기 위하여 재산을 내어 놓으면서도 경건에서 떠나지 않았다’.
    reason: lexical_alternative
  - marker: b
    text: ‘등록 명부’는 주변 문맥에 나오는 공식 등록 기록으로, 왕의 박해 대상 식별에 사용된 것으로 보입니다.
    reason: cultural_note
lexical_decisions:
- source_word: πλεῖστοι
  english_pob_choice: most of them
  chosen_korean: 그들 대부분은
  alternatives_korean:
  - 대다수는
  - 그들 중 대부분은
  lexicon: LSJ
  rationale: πλεῖστοι는 여기서 집합 전체의 큰 부분을 가리키므로, 한국어에서는 자연스러운 ‘그들 대부분은’이 가장 직접적입니다.
- source_word: γενναίᾳ ψυχῇ
  english_pob_choice: with a noble spirit
  chosen_korean: 고결한 영으로
  alternatives_korean:
  - 고귀한 정신으로
  - 용기 있는 마음으로
  lexicon: LSJ
  rationale: ψυχή를 단순히 ‘영혼’으로 옮기기보다, 여기서는 성품과 내적 기개를 나타내므로 ‘영’으로 살리고 γενναίᾳ의 품격을 ‘고결한’으로 반영했습니다.
- source_word: οὐ διέστησαν τῆς εὐσεβείας
  english_pob_choice: did not abandon their piety
  chosen_korean: 경건을 저버리지 않았고
  alternatives_korean:
  - 경건에서 떠나지 않았고
  - 경건에서 물러서지 않았고
  lexicon: LSJ
  rationale: διίστημι의 ‘떼어 놓다/떠나다’는 뜻을 한국어의 ‘저버리다’로 옮겨, 단순한 거리감보다 신앙적 이탈의 뉘앙스를 살렸습니다.
- source_word: ἐτιμῶντο ἑαυτοὺς ῥύσασθαι ἐκ τῶν ἀπογραφῶν
  english_pob_choice: counted themselves worthy to escape the registration lists
  chosen_korean: 자기들이 등록 명부에서 벗어날 만하다고 여겼습니다
  alternatives_korean:
  - 자기들이 등록 명부에서 구출될 만하다고 여겼습니다
  - 등록 명부에서 도망칠 수 있다고 스스로 평가했습니다
  lexicon: LSJ
  rationale: τιμάω의 자기평가적 요소를 ‘여기다’로 살리고, ῥύσασθαι는 상황상 ‘벗어나다’로 자연스럽게 옮겼습니다. ‘registration lists’는 문맥상 박해를 위한 공식 등록 명부로 이해해 ‘등록 명부’로 번역했습니다.
theological_decisions:
- issue: εὐσέβεια의 번역
  chosen_reading: ‘경건’으로 번역해 하나님께 대한 충성된 신앙 태도를 드러냈습니다.
  alternative_readings:
  - 경건함
  - 신앙
  rationale: 이 문맥은 일반 도덕보다 박해 속에서 지켜낸 신앙적 충절을 말하므로, ‘경건’이 가장 정확하고 간결합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
