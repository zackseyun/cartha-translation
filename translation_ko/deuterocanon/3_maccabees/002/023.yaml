  doctrine_reference: 서사 문맥의 정서 표현 보존
- issue: 직역과 자연스러움의 균형
  chosen_reading: ‘그를 재빨리 끌어냈습니다—엄청난 두려움에 사로잡힌 채로.’
  alternative_readings:
  - ‘그들은 재빨리 그를 끌어냈습니다, 엄청난 두려움에 사로잡힌 채로.’
  - ‘그들은 그를 급히 끌어냈습니다[a], 극심한 두려움에 사로잡힌 채로.’
  rationale: 원문의 동작-상태 구조를 유지하면서도 한국어 문장 흐름이 매끄럽도록 대시로 보조절을 분리했습니다.
