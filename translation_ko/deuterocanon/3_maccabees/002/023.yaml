  lexicon: LSJ
  rationale: ‘ὑπερβάλλοντι’의 과도함·도량 초과를 살려, 단순한 두려움보다 강한 감정의 압도를 한국어에서 자연스럽게 표현했습니다.
theological_decisions:
- issue: 사건 서술의 정서 강도
