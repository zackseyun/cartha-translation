base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/025.yaml
  text: But after he had been conveyed to Egypt[a], and was increasing his wickedness through the previously mentioned drinking companions and associates, who had been estranged from all justice[c][b],
  footnotes:
  - marker: a
    text: Or 'transported to Egypt.' The Greek participle emphasizes his transfer there, not the specific means.
    reason: lexical_alternative
  - marker: b
    text: Literally 'drinking companions'; the phrase suggests corrupt convivial associates rather than neutral friends.
    reason: cultural_note
  - marker: c
    text: Or 'separated from all that is right.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 이집트로 옮겨진 뒤[a], 모든 올바름에서 멀어진 앞서 언급된 술친구들과 동료들을 통하여 자신의 악을 더욱 키워 갔습니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이집트로 실려 간 뒤’입니다. 그리스어 분사는 구체적인 운송 수단보다 그곳으로 옮겨진 사실 자체를 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘함께 마시는 사람들’입니다. 중립적인 친구라기보다 타락한 술자리 동료라는 뉘앙스가 있습니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘모든 옳은 것에서 멀어진’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διακομισθεὶς
  english_pob_choice: after he had been conveyed
  chosen_korean: 이집트로 옮겨진 뒤에도
  alternatives_korean:
  - 이집트로 옮겨진 후에
  - 이집트로 실려 간 뒤에
  - 이집트로 이송된 뒤에
  lexicon: LSJ
  rationale: 수동 분사로서 단순한 이동/이전을 나타내므로, 구체적 수단을 덧붙이지 않는 ‘옮겨진’이 가장 자연스럽고 원문의 초점도 살립니다.
- source_word: ἐπαύξων τὰ τῆς κακίας
  english_pob_choice: was increasing his wickedness
  chosen_korean: 자신의 악을 이전보다 더욱 키워 갔는데
  alternatives_korean:
  - 자신의 악을 더욱 늘려 갔는데
  - 악행을 더욱 확대해 갔는데
  - 악을 점점 더 증대시키며
  lexicon: LSJ
  rationale: ‘wickedness’는 단순한 나쁜 행동보다 넓은 도덕적 타락을 가리키므로, ‘악’을 주어로 두고 진행성을 살린 표현이 원문에 가깝습니다.
- source_word: συνποτῶν καὶ ἑταίρων
  english_pob_choice: drinking companions and associates
  chosen_korean: 술친구들과 … 동료들
  alternatives_korean:
  - 술을 함께 마시던 사람들과 동료들
  - 동석한 술꾼들과 동료들
  - 술동무들과 동료들
  lexicon: LSJ
  rationale: συνποτῶν은 문자적으로 ‘함께 마시는 사람들’이므로, POB의 경고적 뉘앙스를 살려 ‘술친구들’로 옮기고 ἑταίρων은 보다 일반적인 ‘동료들’로 구분했습니다.
- source_word: τοῦ παντὸς δικαίου κεχωρισμένων
  english_pob_choice: who had been estranged from all justice
  chosen_korean: 온갖 의로움에서 떠나 있는
  alternatives_korean:
  - 모든 의에서 떨어져 있는
  - 모든 옳음에서 분리된
  - 의로움에서 완전히 멀어진
  lexicon: LSJ
  rationale: 완료 수동 분사는 지속 상태를 나타내므로 ‘떠나 있는’으로 현재 지속성을 살렸고, δικαίου는 법정적 ‘의’보다 여기서는 도덕적 기준의 ‘의로움’이 더 자연스럽습니다.
theological_decisions:
- issue: 악의 증폭이 동반자 관계를 통해 진행된다는 서술
  chosen_reading: 외부의 관계가 이미 진행 중인 악을 더 키우는 수단으로 제시됩니다.
  alternative_readings:
  - 단순히 친구가 나빴다는 일반적 진술
  - 그가 우연히 나쁜 사람들을 만났다는 약한 묘사
  rationale: 원문은 인과를 분명히 하며, 술친구들과 동료들이 그의 악을 ‘더욱 키우는’ 매개로 기능한다고 말합니다.
  doctrine_reference: 성경의 책임 윤리와 유혹의 사회적 형성
