revisions:
- from: 그런데 우리의 몰락 가운데 이 뻔뻔하고 불경한 자가 땅 위에 있는, 당신의 영광의 이름으로 드러나게 된 거룩한 곳을 모욕하려 하고 있습니다.[a]
  to: 그런데 우리가 몰락한 가운데, 이 오만하고 불경한 자가 당신의 영광의 이름으로 지정된 땅 위의 거룩한 곳을 모욕하려 하고 있습니다.[a]
  rationale: The revision renders the perfect passive participle as ‘지정된,’ a natural and source-faithful option that does not overstate a particular theological interpretation. It also improves modifier placement, retains the broad ‘거룩한 곳’ rather than narrowing it to an inner sanctuary, and maintains the prayer’s modern formal-polite register.
