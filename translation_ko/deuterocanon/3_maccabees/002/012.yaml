  text: 'But look now, holy King: because of our many and great sins we are being oppressed, and we have been subjected to our enemies, and we are left in weakness.'
translation:
  language: ko
  text: '그러나 이제 보십시오, 거룩하신 왕이여: 우리의 많은 크고 큰 죄들 때문에 우리가 압박을 당하고 있으며, 원수들에게 복종하게 되었고, 무기력함 가운데 버려져 있습니다.[a]'
  philosophy: formal
  footnotes:
  - marker: a
    text: ἰδοὺ δὲ νῦν은 문자적으로는 “보십시오, 이제”에 가깝습니다.
    reason: source_note
lexical_decisions:
- source_word: ἰδοὺ δὲ νῦν
  english_pob_choice: But look now
  chosen_korean: 그러나 이제 보십시오
  alternatives_korean:
  - 보십시오, 이제
  - 보라, 이제
  lexicon: ἰδοὺ
  rationale: 감탄·호소를 현대 한국어의 정중한 명령형으로 살리면서, English POB의 ‘look’에 대응해 직역적 경계를 유지했습니다.
- source_word: ἅγιε Βασιλεῦ
  english_pob_choice: holy King
  chosen_korean: 거룩하신 왕이여
