  lexicon: LSJ
  rationale: παράδειγμα는 단순한 예시가 아니라 앞에 세워 보이는 본보기를 뜻하므로, ‘본보기로 세우셨습니다’가 경고적 성격을 가장 잘 드러냅니다.
theological_decisions:
- issue: 소돔 심판의 성격을 어떻게 드러낼 것인가
  chosen_reading: 교만과 악에 대한 하나님의 역사적 심판의 본보기로 드러냅니다.
  alternative_readings:
  - 성적 타락에 대한 심판으로 좁혀 읽는 방식
  - 일반적 ‘죄악’으로만 흐릿하게 표현하는 방식
  rationale: 본문은 이 절에서 교만과 악을 전면에 두므로, 후대의 특정한 해석을 덧씌우지 않고 본문 자체의 윤리적 초점을 유지하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
