  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ἀδήλους ταῖς κακίαις γενομένους는 전승된 그리스어 자체가 압축적이고 난해하므로, 본문에서는 문맥상 가능한 ‘악행으로 널리 알려지게 된’으로 매끄럽게 옮기되 각주에서 그 불확실성과 더 직역적인 가능성을 밝혀야 합니다. κατέφλεξας의 완결적 파괴는 ‘태워 없애시고’가 잘 나타냅니다.
  naturalness: ‘교만을 행하던’과 ‘그들의 악으로 드러나게 된 자들’은 현대 한국어에서 다소 번역투이고 겹쳐 보입니다. ‘교만을 일삼고 악행으로 널리 알려지게 된 소돔 사람들’은 원문의 두 분사 수식을 자연스럽게 유지합니다. 각주는 해당 어구 바로 뒤에 두어 독자가 지시 대상을 즉시 알 수 있게 해야 합니다.
  terminology: ‘소돔 사람들’, ‘불과 유황’, ‘본보기’는 적절합니다. ‘주님께서는’은 본문의 기도 대상이라는 문맥적 호칭으로 자연스럽고, 소돔의 죄를 특정 범주로 확대하지 않습니다. 기존 b 각주의 ‘전통적 영어’ 언급은 한국어 독자에게 직접적인 번역 정보를 주지 못하므로 유황의 어휘 의미와 전통적 번역어를 중심으로 고칩니다.
