  lexicon: LSJ
  rationale: 원문은 압축되어 있고 문맥상 ‘악으로 인해 드러난/두드러진’ 의미가 자연스럽습니다. ‘드러나게 된’은 공적 노출의 뉘앙스를 유지하면서 과도한 해석을 피합니다.
- source_word: πυρὶ καὶ θείῳ
