  - 일반적 ‘죄악’으로만 흐릿하게 표현하는 방식
  rationale: 본문은 이 절에서 교만과 악을 전면에 두므로, 후대의 특정한 해석을 덧씌우지 않고 본문 자체의 윤리적 초점을 유지하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
