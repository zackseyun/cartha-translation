  text: You burned up the Sodomites[a], who practiced arrogance and had become notorious for their evils, with fire and sulfur[b], setting them forth as an example for those who would come afterward.
  footnotes:
  - marker: a
    text: Or, more literally, 'had become manifest/conspicuous by their evils.' The Greek wording here is compressed and somewhat difficult, and 'notorious for their evils' expresses the likely sense in natural English.
    reason: lexical_alternative
  - marker: b
    text: Traditional English often has 'fire and brimstone.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서는 교만을 일삼고 악행으로 널리 알려지게 된[a] 소돔 사람들을 불과 유황으로[b] 태워 없애시고, 뒤에 올 이들에게 본보기로 세우셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 표현은 압축되어 있고 해석하기 어렵습니다. 여기서는 문맥상 ‘악행으로 널리 알려지게 된’으로 옮겼습니다. 더 직역하면 ‘악행으로 드러나게 된’ 또는 ‘악행으로 두드러지게 된’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 θείῳ는 ‘유황’을 뜻합니다. 전통적인 표현은 ‘불과 유황’입니다.
    reason: lexical_alternative
