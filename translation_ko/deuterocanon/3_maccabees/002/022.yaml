  source_fidelity: 원문의 ὀξεῖαν ... καταλαβοῦσαν αὐτόν은 그에게 닥쳐든 급박하고 심한 상태를 가리키며, 특정 병명을 뜻하지 않습니다. εὔθυναν은 완료되지 않은 시도가 아니라 그 상황을 바로잡기 위해 실제로 조처한 행동으로 옮기는 편이 적절합니다. 마지막 절은 그가 목숨마저 잃을 가능성을 두려워했다는 뜻입니다.
  naturalness: ‘급한 고통’은 현대 한국어에서 고통 자체의 성질보다 긴급성을 뜻하는 것으로 들릴 수 있고, ‘사태를 수습하려 했습니다’는 원문의 단순 과거 동작을 미완의 시도로 약화합니다. ‘그를 덮친 극심한 고통’과 ‘급히 상황을 수습했습니다’가 자연스럽고 문맥에 맞습니다.
  terminology: σωματοφύλακες는 ‘호위병들’이 왕의 신변을 지키는 사람이라는 뜻을 명료하게 전달합니다. τὸ ζῆν은 여기서 ‘목숨/생명’으로 옮길 수 있으며, ‘목숨마저 잃을까’가 자연스러운 대응입니다.
