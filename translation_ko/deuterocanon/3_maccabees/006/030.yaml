  - 잔치에 필요한 나머지 준비물
  lexicon: LSJ
  rationale: ἐπιτήδεια는 필요한 물품·준비물을 뜻하고, πρὸς εὐωχίαν은 잔치 목적을 한정하므로 이를 합쳐 간결하게 처리했습니다.
- source_word: σωτήρια
