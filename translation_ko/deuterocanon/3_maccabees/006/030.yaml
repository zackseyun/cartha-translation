  yaml_path: translation/deuterocanon/3_maccabees/006/030.yaml
  text: Then the king[a], after summoning to the city the one in charge of the revenues, ordered that wine and the other provisions suitable for feasting be supplied to the Jews for seven days, deciding that in the very place where they had expected to meet destruction, in that place they should celebrate their deliverance with all rejoicing.
  footnotes:
  - marker: a
    text: Or, 'celebrate salvation.' The Greek term can denote deliverance or salvation; here it refers to rejoicing over their rescue from destruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런 다음 왕은 세입을 맡은 관원을 도성으로 불러들여, 유대인들에게 포도주와 그 밖에 잔치에 필요한 물품들을 칠 일 동안 제공하라고 명령했습니다. 왕은 그들이 멸망을 당할 것으로 생각했던 바로 그곳에서 온갖 기쁨 가운데 구원을 기념하도록 정했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구출을 기념하도록’. 그리스어 σωτήρια는 ‘구원’ 또는 ‘구출’을 뜻할 수 있습니다. 여기서는 멸망에서 건짐받은 일을 기념하는 것을 가리킵니다.
    reason: lexical_alternative
