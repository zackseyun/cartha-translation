- from: 그런 다음 왕은 성 안으로 세입을 맡은 관원을 불러 와인과 그 밖의 연회에 필요한 것들을 유대인들에게 칠 일 동안 공급하라고 명령했습니다. 그리고 그들이 멸망을 맞을 것이라고 여겼던 바로 그 자리에서, 바로 그곳에서 그들은 온갖 기쁨으로 구원을 기념하게 하겠다고 결정했습니다.[a]
