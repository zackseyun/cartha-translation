  rationale: 문맥상 멸망에서 벗어난 구원을 가리키며, 본문이 요구하는 축하의 대상을 간명하게 드러내기 위해 ‘구원’을 택했습니다.
theological_decisions:
- issue: σωτήρια의 구원/해방 뉘앙스
