  rationale: πρόσοδοι는 수입·세입의 뜻이므로, 직함을 과도하게 특정하지 않으면서 행정 책임을 드러내는 표현을 택했습니다.
- source_word: χορηγεῖν
  english_pob_choice: be supplied
