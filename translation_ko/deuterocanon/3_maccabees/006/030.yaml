  - 살림
  rationale: 이 절은 임박한 멸망에서 건져진 사건을 기념하는 장면이므로, 신학적으로도 서사적으로도 ‘구원’이 가장 넓고 정확합니다. 다만 여기서는 체계신학적 용어로 고정하기보다 사건 중심의 구원으로 읽는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; deliverance/salvation range preserved in context.'
