theological_decisions:
- issue: 적대자들의 태도와 심판적 반전의 표현
  chosen_reading: 본문은 유대인들을 파멸로 넘겨주고 기쁘게 등록했던 자들의 수치와 좌절을 서술하는 것으로 읽었습니다.
  alternative_readings:
  - 단순한 행정적 등록의 서술로 약화하는 읽기
  - 감정적 반전만 강조하고 파멸 의도를 흐리는 읽기
  rationale: 문맥 전체가 사전적 적대 의도와 그 좌절을 강조하므로, 파멸·수치·소멸의 대비를 분명히 드러냈습니다.
  doctrine_reference: 서사적 응보와 교만의 붕괴
