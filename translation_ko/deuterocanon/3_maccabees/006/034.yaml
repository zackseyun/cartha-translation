revisions:
- from: 그리고 전에 그들을 파멸과 새들의 먹이가 되도록 넘겨주고, 기쁘게 등록했던 사람들은, 수치를 자신들에게 두른 채 깊이 탄식하였으며, 불같은 대담함은 세차게 꺼졌습니다.[a][b]
  to: 그리고 전에 그들을 파멸당하고 새들의 먹잇감이 될 자들로 여겼으며[a], 기뻐하며 그들을 명부에 올렸던 사람들은 수치를 몸에 두른 채 깊이 탄식하였고, 그들의 불을 내뿜는 대담함은 맹렬히 사그라졌습니다.[b]
  rationale: The revision preserves the original’s hostile evaluation and official registration while avoiding an overconfident reconstruction of the difficult participle. It restores the direct object of the registration, uses more idiomatic Korean for the shame-as-garment metaphor, and retains both the fiery metaphor and the forceful extinguishing image. Footnote a is reassigned to the actual textual difficulty, and footnote b documents the lexical metaphor.
  reviewer_model: gpt-5.6-terra
