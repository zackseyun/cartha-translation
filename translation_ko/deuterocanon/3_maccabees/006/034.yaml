base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/034.yaml
  text: And those who had previously been reckoning them for destruction and to be devoured by birds[a], and had registered them with joy, groaned deeply, clothing themselves with shame[b], and their fire-breathing boldness was vigorously quenched.
  footnotes:
  - marker: a
    text: The Greek participle translated 'been reckoning them' is textually and syntactically difficult in Swete's witness. The broader clause clearly conveys that these people had earlier regarded the Jews as destined for destruction and exposure to birds.
    reason: textual_variant
  - marker: b
    text: Or 'fiery audacity' for 'fire-breathing boldness.' The Greek image is metaphorical and strongly negative in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 전에 그들을 파멸과 새들의 먹이가 되도록 넘겨주고, 기쁘게 등록했던 사람들은, 수치를 자신들에게 두른 채 깊이 탄식하였으며, 불같은 대담함은 세차게 꺼졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘등록했던’은 ἀπογραφάμενοι의 공식적 명부 작성 뉘앙스를 살린 것입니다.
    reason: source_note
  - marker: b
    text: ‘불같은 대담함’은 문자적으로는 ‘불을 내뿜는 대담함’에 가까운 비유적 표현입니다.
    reason: lexical_alternative
