theological_decisions:
- issue: τὸν ἅγιον σωτῆρα θεὸν αὐτῶν의 호칭 구조
  chosen_reading: 하나님을 ‘거룩한 구원자’라는 단일 호칭으로 읽어, 별도의 두 칭호로 과도하게 분해하지 않았습니다.
  alternative_readings:
  - ‘그들의 거룩한 하나님이자 구원자’
  - ‘그들의 거룩한 구원자이신 하나님’
  rationale: 그리스어는 명사구를 압축적으로 배열해 하나님의 성품과 구원 행위를 함께 드러내므로, 한국어에서도 그 긴장을 유지했습니다.
  doctrine_reference: 원문 우선 원칙; 호칭의 압축성과 신학적 중량 보존
