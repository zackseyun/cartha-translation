  yaml_path: translation/deuterocanon/3_maccabees/006/029.yaml
  text: So he said these things[a]; but they, having been released in a moment, blessed their holy Savior God[b], having just escaped death.
  footnotes:
  - marker: a
    text: Or 'in a moment' or 'without delay.' The Greek idiom ἐν ἀμερεῖ χρόνῳ denotes a very short interval.
    reason: lexical_alternative
  - marker: b
    text: Or 'their holy God and savior.' The Greek phrase can be understood as a compact string of titles for God.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그는 이런 일들을 말했습니다[a]. 그러나 그들은 잠시 만에 풀려나 자기들의 거룩한 구원자 하나님[b]을 찬송했으며, 막 죽음을 벗어난 참이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘잠시 만에’, ‘지체 없이’로도 옮길 수 있습니다. 그리스어 관용구 ἐν ἀμερεῖ χρόνῳ는 매우 짧은 시간을 뜻합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그들의 거룩한 하나님이자 구원자’로도 이해할 수 있습니다. 그리스어 표현은 하나님에 대한 압축된 호칭들의 연속으로 볼 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ μὲν οὖν ταῦτα ἐξέλεξεν
  english_pob_choice: So he said these things
  chosen_korean: 그러므로 그는 이런 일들을 말했습니다
  alternatives_korean:
  - 그는 이런 일들을 말했습니다
  - 그러므로 그는 이것들을 말했습니다
  lexicon: LSJ
  rationale: ἐξέλεξεν은 여기서 앞선 말을 ‘말하다/진술하다’의 뜻으로 쓰였으므로, 문맥에 맞게 자연스러운 현대 한국어로 옮겼습니다.
- source_word: ἐν ἀμερεῖ χρόνῳ
  english_pob_choice: in a moment
  chosen_korean: 잠시 만에
  alternatives_korean:
  - 순식간에
  - 즉시
  lexicon: LSJ
  rationale: 이 관용구는 매우 짧은 시간을 가리키므로, ‘잠시 만에’로 즉각적인 구출의 뉘앙스를 살렸습니다.
- source_word: λυθέντες
  english_pob_choice: having been released
  chosen_korean: 풀려나
  alternatives_korean:
  - 해방되어
  - 놓여나
  lexicon: LSJ
  rationale: 수동 분사는 억류에서 풀린 상태를 가리키므로, 본문 상황에 맞게 ‘풀려나’로 옮겼습니다.
- source_word: τὸν ἅγιον σωτῆρα θεὸν αὐτῶν
  english_pob_choice: their holy savior God
  chosen_korean: 자기들의 거룩한 구원자 하나님
  alternatives_korean:
  - 자기들의 거룩한 구원하시는 하나님
  - 자기들의 거룩한 하나님이시며 구원자이신 하나님
  lexicon: LSJ
  rationale: 그리스어는 하나님을 한 덩어리의 호칭으로 묘사하므로, ‘거룩한 구원자 하나님’으로 분리하지 않고 압축된 호칭 구조를 살렸습니다.
- source_word: ηὐλόγουν
  english_pob_choice: blessed
  chosen_korean: 찬송했으며
  alternatives_korean:
  - 축복했으며
  - 찬양했으며
  lexicon: LSJ
  rationale: εὐλογέω는 하나님께 대해 ‘찬송하다/송축하다’의 예배적 의미가 강하므로, 한국어 성경 문맥에 맞는 ‘찬송하다’를 택했습니다.
- source_word: ἄρτι τὸν θάνατον ἐκπεφυγότες
  english_pob_choice: having just escaped death
  chosen_korean: 막 죽음을 벗어난 참이었습니다
  alternatives_korean:
  - 방금 죽음을 피한 참이었습니다
  - 겨우 죽음을 면한 참이었습니다
  lexicon: LSJ
  rationale: ἄρτι와 완료 분사 결합은 ‘방금 막…한 상태’의 긴박함을 나타내므로, 현재적 결과를 드러내는 한국어로 옮겼습니다.
theological_decisions:
- issue: τὸν ἅγιον σωτῆρα θεὸν αὐτῶν의 호칭 구조
  chosen_reading: 하나님을 ‘거룩한 구원자’라는 단일 호칭으로 읽어, 별도의 두 칭호로 과도하게 분해하지 않았습니다.
  alternative_readings:
  - ‘그들의 거룩한 하나님이자 구원자’
  - ‘그들의 거룩한 구원자이신 하나님’
  rationale: 그리스어는 명사구를 압축적으로 배열해 하나님의 성품과 구원 행위를 함께 드러내므로, 한국어에서도 그 긴장을 유지했습니다.
  doctrine_reference: 원문 우선 원칙; 호칭의 압축성과 신학적 중량 보존
