    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 거룩하신 하나님이자 구원자’로도 이해할 수 있습니다. 그리스어 표현은 하나님에 대한 압축된 호칭들의 연속으로 볼 수 있습니다.
    reason: lexical_alternative
