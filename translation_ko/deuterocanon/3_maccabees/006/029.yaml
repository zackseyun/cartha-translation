  text: 그는 이렇게 말했습니다. 그러나 그들은 순식간에[a] 풀려나, 막 죽음을 피한 뒤 그들의 거룩하신 구원자 하나님[b]을 송축했습니다.
  philosophy: optimal-equivalence
  footnotes:
