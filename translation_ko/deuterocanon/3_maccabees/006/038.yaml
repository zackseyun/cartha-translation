base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/038.yaml
  text: Copies were made for them from the twenty-fifth of Pachon until the fourth of Epiphi[a], over forty days; and they appointed their destruction from the fifth of Epiphi until the seventh[b], in three days.
  footnotes:
  - marker: a
    text: Pachon and Epiphi are Egyptian month names used in the administrative dating of the narrative.
    reason: cultural_note
  - marker: b
    text: The Greek verb behind 'Copies were made out' can suggest written copies or official documents being prepared; the object is not stated explicitly in the verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게는 파코온 스물다섯째 날부터 에피피 넷째 날까지 사본이 작성되었는데[a], 이는 사십 일에 걸친 일이었습니다. 그리고 그들의 멸망은 에피피 다섯째 날부터 일곱째 날까지, 삼 일에 걸쳐 정해졌습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 파코온과 에피피는 이 서사에서 사용되는 이집트 달 이름입니다.
    reason: cultural_note
  - marker: b
    text: 그리스어 동사에는 문서나 공식 기록을 작성한다는 뜻이 담길 수 있으며, 문장의 목적어는 본문에 직접 제시되지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀντιγράφονται
  english_pob_choice: Copies were made out
  chosen_korean: 사본이 작성되었는데
  alternatives_korean:
  - 사본이 만들어졌는데
  - 문서가 베껴졌는데
  - 필사본이 작성되었는데
  lexicon: LSJ
  rationale: 행정적·문서적 성격의 수동형을 살리되, 한국어에서는 ‘사본이 작성되다’가 가장 자연스럽고 원문의 문서 작성 뉘앙스를 잘 보존합니다.
- source_word: ἀπὸ πέμπτης τοῦ Παχὼν ... ἕως τῆς τετάρτης τοῦ Ἐπιφὶ
  english_pob_choice: from the twenty-fifth of Pachon until the fourth of Epiphi
  chosen_korean: 파코온 스물다섯째 날부터 에피피 넷째 날까지
  alternatives_korean:
  - 파코온의 스물다섯째 날부터 에피피의 넷째 날까지
  - 파코온 25일부터 에피피 4일까지
  lexicon: LSJ
  rationale: 이집트 달 이름은 음역으로 보존하고, 날짜는 현대 한국어의 ‘~째 날’ 표현으로 옮겨 행정 연대기의 감각을 살렸습니다.
- source_word: ἐπʼ ἡμέρας τεσσαράκοντα
  english_pob_choice: over forty days
  chosen_korean: 사십 일에 걸친 일이었습니다
  alternatives_korean:
  - 사십 일 동안이었습니다
  - 사십 일을 넘겼습니다
  lexicon: BDAG
  rationale: 기간의 범위를 자연스럽게 풀어내면서도, 단순 지속보다 ‘걸친’ 표현으로 기간 전체에 걸친 진행성을 반영했습니다.
- source_word: συνίστανται ... τὴν ἀπώλειαν
  english_pob_choice: they scheduled their destruction
  chosen_korean: 그들의 멸망은 ... 정해졌습니다
  alternatives_korean:
  - 그들의 멸망을 정했습니다
  - 그들의 파멸이 마련되었습니다
  - 그들의 멸망이 예정되었습니다
  lexicon: BDAG
  rationale: 주어가 생략된 행정적 결정을 한국어에서는 수동으로 드러내었고, ἀπώλεια는 단순 ‘손실’이 아니라 파괴·몰락의 강한 의미이므로 ‘멸망’이 적절합니다.
- source_word: ἀπὸ πέμπτης τοῦ Ἐπιφὶ ἕως ἑβδόμης
  english_pob_choice: from the fifth of Epiphi until the seventh
  chosen_korean: 에피피 다섯째 날부터 일곱째 날까지
  alternatives_korean:
  - 에피피의 다섯째 날부터 일곱째 날까지
  - 에피피 5일부터 7일까지
  lexicon: LSJ
  rationale: 앞선 날짜 표현과 동일한 방식으로 통일해, 두 번째 일정 범위도 자연스럽고 일관되게 전달했습니다.
- source_word: ἡμέραις τρισίν
  english_pob_choice: in three days
  chosen_korean: 삼 일에 걸쳐
  alternatives_korean:
  - 삼 일 동안
  - 사흘에 걸쳐
  lexicon: BDAG
  rationale: 정해진 기간을 나타내는 여격의 시간표현을 ‘~에 걸쳐’로 옮겨 앞 절과의 대칭을 살렸습니다.
theological_decisions:
- issue: 왕명/행정 조치의 서술에서 능동·수동 뉘앙스
  chosen_reading: ‘사본이 작성되었는데’와 ‘그들의 멸망은 ... 정해졌습니다’로 옮겨, 행정적 문체와 사건의 공적 확정성을 드러냈습니다.
  alternative_readings:
  - ‘사본이 만들어졌는데’
  - ‘그들의 파멸이 예정되었습니다’
  rationale: 본문은 개인적 감정이 아니라 궁정 행정의 결정과 기한을 기록하므로, 한국어에서도 공문서적·서술적 톤을 유지하는 것이 원문의 효과에 가깝습니다.
  doctrine_reference: 본문 해석의 행정사적 문맥 유지
