  naturalness: ‘공동체가 대대로 지키도록 공동 규례를 정하고’라고 하면 적용 범위와 공동체적 준수의 뜻이 자연스러우며, 이어지는 ‘지키기로 정했습니다’도 원문의 공식적 결정이라는 의미를 명료하게 전달합니다. ‘술 마심과 탐식 때문’보다는 목적을 나타내는 ‘술 마심과 탐식을 위한 것’이 χάριν의 대조를 더 직접적으로 반영합니다.
