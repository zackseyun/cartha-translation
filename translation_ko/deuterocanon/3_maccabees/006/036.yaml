translation:
  language: ko
  text: 그들은 이 일들에 관하여 그들의 온 공동체가 대대로 지키도록 공동 규례를 정하고, 앞서 말한 날들을 기쁨의 날로 지키기로 정했습니다. 이는 술 마심과 탐식을 위한 것이 아니라, 신들을 통하여 그들에게 이루어진 구원을 위한 것이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘신들을 통하여’(διὰ θεῶν)라고 복수형으로 되어 있습니다. 유대교 문맥상 한 분 하나님의 구원을 가리킬 가능성이 있으나, 본문에 전해진 복수형 표현을 그대로 옮겼습니다.
    reason: textual_variant
lexical_decisions:
- source_word: κοινὸν ὁρισάμενοι περὶ τούτων θεσμὸν
  english_pob_choice: having established a common ordinance
  chosen_korean: 공동의 규례를 정하여
  alternatives_korean:
  - 공동의 명령을 정하여
  - 공통의 규례를 마련하여
  - 공동의 법규를 제정하여
  lexicon: LSJ
  rationale: θεσμός는 단순한 관습보다 공동체에 의해 정해진 공식 규범에 가깝기 때문에, 교회적 전통어인 ‘규례’를 쓰되 ‘공동의’로 공동체적 성격을 살렸습니다.
- source_word: ἐπὶ πᾶσαν τὴν παροικίαν αὐτῶν εἰς γενεάς
  english_pob_choice: for all their community throughout their generations
  chosen_korean: 그들의 온 공동체를 위해 대대로
  alternatives_korean:
  - 그들의 모든 거주 공동체를 위해 세세대대로
  - 그들의 공동체 전체를 위해 모든 세대에 걸쳐
  - 그들의 나그네 공동체를 위해 대대로
  lexicon: LSJ
  rationale: παροικία는 여기서 단순한 ‘거주지’보다 이방 땅에 사는 유대인 공동체를 가리키므로, 이해 가능한 표현인 ‘공동체’로 옮기되 범위를 ‘온’과 ‘대대로’로 살렸습니다.
- source_word: τὰς προειρημένας ἡμέρας ἄγειν ἐστήσαν εὐφροσύνους
  english_pob_choice: the previously mentioned days should be observed as days of rejoicing
  chosen_korean: 앞서 말한 날들을 기쁨의 날로 지키기로 결정하였습니다
  alternatives_korean:
  - 앞서 언급한 날들을 기뻐하는 날로 지키기로 하였습니다
  - 앞서 말한 날들을 즐거운 날로 지키기로 정하였습니다
  - 앞서 언급된 날들을 기쁨 가운데 지키도록 하였습니다
  lexicon: LSJ
  rationale: ἄγειν은 절기·날을 ‘지키다/기념하다’의 뜻으로 쓰일 수 있어 ‘지키다’가 자연스럽고, εὐφροσύνους는 날의 성격을 ‘기쁨의 날’로 드러내는 것이 문맥상 적절합니다.
- source_word: σωτηρίας δὲ τῆς διὰ θεῶν γενομένης αὐτοῖς
  english_pob_choice: because of the deliverance that had come to them through God
  chosen_korean: 하나님을 통해 그들에게 일어난 구원을 위한 것이었습니다
  alternatives_korean:
  - 하나님을 통해 그들에게 주어진 구원을 위한 것이었습니다
  - 하나님으로 말미암아 그들에게 일어난 구원을 위한 것이었습니다
  - 그들에게 하나님을 통해 생긴 구원을 위한 것이었습니다
  lexicon: LSJ
  rationale: σωτηρία는 여기서 역사적 구출을 가리키므로 ‘구원’과 ‘일어난’으로 사건성을 살렸고, διὰ θεῶν은 전승 본문상의 복수형을 존중하되 문맥상 하나님 한 분의 구원 행위로 이해되는 점을 반영했습니다.
theological_decisions:
- issue: διὰ θεῶν의 복수형을 한국어에서 어떻게 처리할지
  chosen_reading: 본문에는 ‘하나님을 통해’라고 옮기고, 복수형의 이례성은 주석으로 남깁니다.
  alternative_readings:
  - 그 신들을 통해
  - 신들을 통해
  rationale: 이 유대교 서술 문맥에서 복수형을 문자 그대로 옮기면 신학적으로 오해를 낳을 수 있어, 본문 의미는 하나님 한 분의 구원으로 읽고 원문의 이례성은 투명하게 각주로 보존하는 것이 바람직합니다.
  doctrine_reference: 원문형 보존과 문맥상 단일신 신앙의 긴장 유지
- issue: ἄγειν εὐφροσύνους의 절기적 의미
  chosen_reading: ‘기쁨의 날로 지키다’로 옮겨 절기 준수의 뜻을 살렸습니다.
  alternative_readings:
  - ‘기뻐하며 보내다’
  - ‘즐거운 날로 지내다’
  rationale: 본문은 단순한 감정 표현이 아니라 특정 날을 공동체적으로 기념하도록 정하는 내용이므로, 절기 준수의 공적 성격을 드러내는 번역이 적절합니다.
  doctrine_reference: 공동체적 기억과 감사의 절기 형성
