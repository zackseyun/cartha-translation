translation:
  language: ko
  text: 전능하시고 하늘에 계시며 살아 계신 하나님[a]의 아들들을 놓아주십시오. 그분은 우리 조상들 때부터 지금까지 우리의 일들에 막힘 없는 안정과 영광을 가져오셨습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘아들들’(υἱοὺς)이라고 분명히 말합니다. 영어처럼 ‘자녀들’로 완화할 수 있지만, 본문은 남성 복수형을 유지합니다.
    reason: lexical_alternative
  - marker: b
    text: ἀπαραπόδιστον εὐστάθειαν은 ‘막힘 없는 안정’ 외에도 ‘장애 없는 안전’ 또는 ‘흔들림 없는 번영’으로 옮길 수 있습니다. 여기서는 공적·정치적 맥락에 맞게 ‘안정’을 택했습니다.
    reason: lexical_alternative
