  rationale: 본문의 ψαλμοῖς는 단순한 일반 노래보다 시편 낭송/노래의 성격이 강하므로, 전통적이되 직설적인 ‘시편’이 source-direct합니다.
  doctrine_reference: 유대교 예배와 성경시편의 사용에 관한 서술적 본문
