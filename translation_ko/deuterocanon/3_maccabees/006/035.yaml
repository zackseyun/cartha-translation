  lexicon: LSJ
  rationale: 이 문맥에서는 민족·종교 공동체를 가리키므로, 현대 한국어에서는 ‘유대인들’이 가장 자연스럽고 분명합니다.
- source_word: συστησάμενοι τὸν προειρημένον χορὸν
  english_pob_choice: having formed the previously mentioned chorus
  chosen_korean: 앞서 말한 합창대를 만들어서
  alternatives_korean:
  - 앞서 말한 합창단을 조직하여
  - 앞서 말한 무리를 구성하여
  lexicon: LSJ
  rationale: χορὸς는 여기서 노래·행진을 포함한 집단적 예배/축하 행렬의 뜻이므로, ‘합창대’가 ‘chorus’의 음향적·집단적 성격을 비교적 잘 살립니다.
- source_word: ἐν ἐξομολογήσεσιν ἱλαραῖς
  english_pob_choice: in joyful thanksgivings
  chosen_korean: 즐거운 감사
  alternatives_korean:
  - 기쁜 감사의 찬양
  - 즐거운 찬양
  lexicon: LSJ
  rationale: ἐξομολόγησις는 이 문맥에서 죄 고백이 아니라 감사·찬양의 뜻이므로, ‘감사’로 옮기되 ἱλαραῖς의 밝고 기쁜 뉘앙스를 ‘즐거운’으로 반영했습니다.
- source_word: διῆγον
  english_pob_choice: spent their time
  chosen_korean: 시간을 보냈습니다
  alternatives_korean:
  - 날들을 보냈습니다
  - 계속 지냈습니다
  lexicon: LSJ
  rationale: 미완료 과거의 지속성을 한국어로 자연스럽게 전달하기 위해 ‘시간을 보냈습니다’로 옮겼습니다.
