  text: And the Jews[a], as we said before, having formed the previously mentioned chorus, spent their time with feasting, in joyful thanksgivings and psalms[b],
  footnotes:
  - marker: a
    text: Or 'having organized the previously mentioned choir.' The Greek χορὸς can refer to a chorus or choir-like company.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'joyful thanksgivings' renders ἐξομολογήσεσιν ἱλαραῖς, where ἐξομολόγησις in this context likely means thanksgiving or praise rather than confession of sins.
    reason: lexical_alternative
translation:
  language: ko
  text: 유대인들은 우리가 앞서 말한 대로, 앞서 언급한 합창대를 구성하고, 잔치를 벌이며 기쁨으로 감사와 시편을 드리면서 지냈습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘앞서 언급한 합창단을 조직하고.’ 그리스어 χορὸς는 합창대나 합창단과 같은 노래하는 무리를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘기쁨으로 감사’는 ἐξομολογήσεσιν ἱλαραῖς를 옮긴 것입니다. 이 문맥에서 ἐξομολόγησις는 죄의 고백이라기보다 감사나 찬양을 뜻하는 것으로 보입니다.
    reason: lexical_alternative
