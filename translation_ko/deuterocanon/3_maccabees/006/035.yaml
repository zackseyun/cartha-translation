- issue: ψαλμοῖς의 예배적 어휘 처리
  chosen_reading: ‘시편’으로 옮겨, 유대인의 감사 예식이 성경적 노래와 결합된 예배 행위였음을 드러냈습니다.
  alternative_readings:
