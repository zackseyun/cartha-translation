  yaml_path: translation/deuterocanon/3_maccabees/006/035.yaml
  text: And the Jews[a], as we said before, having formed the previously mentioned chorus, spent their time with feasting, in joyful thanksgivings and psalms[b],
  footnotes:
  - marker: a
    text: Or 'having organized the previously mentioned choir.' The Greek χορὸς can refer to a chorus or choir-like company.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'joyful thanksgivings' renders ἐξομολογήσεσιν ἱλαραῖς, where ἐξομολόγησις in this context likely means thanksgiving or praise rather than confession of sins.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 유대인들은, 우리가 전에 말한 대로, 앞서 말한 합창대를 만들어서, 잔치와 함께 즐거운 감사와 시편으로 시간을 보냈습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘앞서 말한 합창단을 조직하여.’ 그리스어 χορὸς는 합창대나 합창단을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘즐거운 감사’는 ἐξομολογήσεσιν ἱλαραῖς를 옮긴 것으로, 이곳의 ἐξομολόγησις는 죄 고백보다 감사와 찬양의 뜻에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ τε Ἰουδαῖοι
  english_pob_choice: And the Jews
  chosen_korean: 그리고 유대인들은
  alternatives_korean:
