  yaml_path: translation/deuterocanon/3_maccabees/006/024.yaml
  text: You have exceeded kings and surpassed tyrants in cruelty; and you are now even attempting to remove me myself[a], your benefactor, from power and from life, secretly plotting what is not advantageous to the kingdom.
  footnotes:
  - marker: a
    text: Or 'from power and from spirit/breath.' The Greek πνεῦμα can mean 'spirit,' 'breath,' or by extension 'life.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신들은 왕의 도리를 넘어섰고, 잔혹함에서는 폭군들을 능가했습니다. 또 이제 여러분의 은인인 바로 저 자신에게서 통치권과 목숨을[a] 빼앗으려 하며, 왕국에 유익하지 않은 일을 몰래 꾸미고 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 πνεῦμα는 문맥에 따라 ‘영’, ‘숨결’, 또는 ‘생명’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παραβεβασιλεύετε
  english_pob_choice: You have overstepped kingship
  chosen_korean: 왕들을 넘어서고
  alternatives_korean:
  - 왕 노릇의 한계를 넘어서고
  - 왕권의 경계를 넘어서고
  lexicon: LSJ
  rationale: 복합어 παρα- + βασιλεύω의 비난 뉘앙스를 살리기 위해 단순한 ‘통치하다’가 아니라 ‘넘어서다’로 옮겼습니다. 한국어에서는 ‘왕들’과의 비교를 드러내어 왕다운 शासन의 경계를 넘은 행위를 표현했습니다.
- source_word: ὑπερβεβήκατε ὠμότητι
  english_pob_choice: surpassed ... in cruelty
  chosen_korean: 잔혹함으로는 폭군들을 뛰어넘었습니다
  alternatives_korean:
  - 잔인함으로는 폭군들을 능가했습니다
  - 포악함으로는 폭군들을 넘어섰습니다
  lexicon: LSJ
  rationale: ὑπερβαίνω의 비교 의미를 살려 ‘뛰어넘었습니다’로, ὠμότης는 현대 독자에게 분명한 ‘잔혹함’으로 옮겼습니다. 영어 본문의 ‘tyrants’와의 대조도 유지했습니다.
- source_word: τῆς ἀρχῆς ... καὶ τοῦ πνεύματος μεθιστᾶν
  english_pob_choice: from power and from life
  chosen_korean: 권위와 목숨에서조차 옮기려 하면서
  alternatives_korean:
  - 권력과 생명에서조차 옮기려 하면서
  - 통치와 숨결에서조차 옮기려 하면서
  lexicon: LSJ
  rationale: ἀρχή는 여기서 통치 권한을 가리키므로 ‘권위’로, πνεῦμα는 문맥상 생명/목숨의 상실을 뜻하므로 ‘목숨’으로 옮겼습니다. ‘옮기다’는 μεθιστάν의 제거·이동 의미를 함께 살립니다.
- source_word: λάθρα μηχανώμενοι τὰ μὴ συμφέροντα τῇ βασιλείᾳ
  english_pob_choice: secretly plotting what is not advantageous to the kingdom
  chosen_korean: 왕국에 유익하지 않은 일을 몰래 꾸미고 있습니다
  alternatives_korean:
  - 왕국에 이롭지 않은 일을 은밀히 도모하고 있습니다
  - 왕국에 유익이 되지 않는 일을 몰래 꾀하고 있습니다
  lexicon: LSJ
  rationale: λάθρα μηχανώμενοι의 은밀한 음모성을 ‘몰래 꾸미다’로 자연스럽게 살렸고, τὰ μὴ συμφέροντα τῇ βασιλείᾳ는 ‘유익하지 않은 일’로 직역에 가깝게 유지했습니다.
theological_decisions:
- issue: πνεῦμα의 한국어 처리
  chosen_reading: 문맥상 ‘목숨’으로 옮기고, ‘영/숨결’의 추상적 여지도 본문에는 노출하지 않았습니다.
  alternative_readings:
  - 영
  - 숨결
  rationale: 이 절은 왕권 장악과 암살 의도를 비난하는 정치적 맥락이므로, πνεῦμα를 생명에 대한 위협으로 읽는 것이 가장 직접적입니다. 다만 본문의 의미 긴장은 삭제하지 않고 ‘목숨에서조차’로 압축해 살렸습니다.
  doctrine_reference: 문맥 우선의 어휘 선택이며 인간론 교리를 확정하지 않습니다.
