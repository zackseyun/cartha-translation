  source_fidelity: 첫 동사 Παραβεβασιλεύετε는 단순히 ‘왕들을 넘어서다’라기보다 왕으로서의 정당한 한계 또는 왕의 도리를 넘었다는 비난을 담습니다. 이를 ‘왕의 도리를 넘어섰고’로 옮겨 παρα-의 비난적 뉘앙스를 보존했습니다. ὑπερβεβήκατε ὠμότητι는 ‘잔혹함에서는 폭군들을 능가했습니다’로 충실히 반영했습니다. τῆς ἀρχῆς καὶ τοῦ πνεύματος μεθιστᾶν은 통치권과 생명을 함께 빼앗으려 한다는 뜻으로 자연스럽게 옮겼으며, πνεῦμα의 다른 가능한 뜻은 각주에 남겼습니다.
  naturalness: 현행 ‘왕들을 넘어서고’는 한국어에서 비교 대상과 의미가 다소 불분명하고, 뒤의 완료 표현과도 연결이 매끄럽지 않습니다. 또한 ‘저 자신, 곧 여러분의 은인인 저를’은 강조가 중복되며, ‘권위와 목숨에서조차 옮기려’는 현대 한국어로 부자연스럽습니다. 수정문은 합쇼체를 유지하면서 고발의 어조를 자연스럽게 드러냅니다.
  terminology: ἀρχή는 이 문맥에서 ‘통치권’이 가장 구체적이며, εὐεργέτης는 ‘은인’, βασιλεία는 ‘왕국’으로 유지했습니다. πνεῦμα는 문맥상 ‘목숨’으로 번역하되, ‘영’과 ‘숨결’이라는 어휘적 가능성을 각주로 명시했습니다.
