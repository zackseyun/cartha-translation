  rationale: ὑπέρ를 감정의 대상으로 드러내도록 ‘일들을 두고’로 고쳤으며, 원문의 οἶκτος에 담긴 연민의 뉘앙스를 ‘연민’으로 간결하게 옮겼습니다. ‘왕 앞에서 전에 꾸며졌던’은 ἔμπροσθεν αὐτῷ의 다소 압축적이고 논쟁 가능한 관계를 특정 해석으로 과도하게 해소하지 않으면서 한국어 문장 안에서 읽히도록 한 표현입니다.
