  text: 그리고 왕의 분노는 왕 앞에서 전에 꾸며졌던 일들을 두고 연민과 눈물로 변했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘측은함과 눈물로’. 여기의 그리스어 표현은 본문 형태상 다소 어색하지만, 분노가 슬픔 어린 연민으로 뒤바뀌었다는 뜻은 분명합니다.
    reason: lexical_alternative
