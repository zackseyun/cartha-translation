  yaml_path: translation/deuterocanon/3_maccabees/006/022.yaml
  text: And the king’s anger was turned into grief and tears over those things that had previously been devised before him[a].
  footnotes:
  - marker: a
    text: Or 'into pity and tears.' The Greek expression after 'was turned' is textually/lexically awkward in this form, but the sense is clearly a reversal from anger to sorrowful compassion.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 왕의 분노는 그 앞에서 이전에 꾸며졌던 일들로 말미암아 불쌍히 여기는 마음과 눈물로 바뀌었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불쌍히 여김과 눈물로’. 그리스어 표현은 이 형태에서 다소 어색하지만, 뜻은 분노에서 슬픔 어린 연민으로 뒤바뀐 것임이 분명합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετεστράφη
  english_pob_choice: was turned
  chosen_korean: 바뀌었습니다
  alternatives_korean:
  - 돌아섰습니다
  - 변했습니다
  - 전환되었습니다
  lexicon: LSJ
  rationale: 상태의 반전이라는 동사를 자연스러운 서술형으로 옮기되, 원문의 변화 이미지를 유지했습니다.
- source_word: ἡ ὀργή
  english_pob_choice: anger
  chosen_korean: 분노
  alternatives_korean:
  - 노여움
  - 진노
  lexicon: LSJ
  rationale: 서사 문맥에서 신학적 고조가 강한 ‘진노’보다 일반적인 감정 상태인 ‘분노’가 더 정확합니다.
- source_word: εἰς οἶκτον καὶ δάκρυα
  english_pob_choice: into grief and tears
  chosen_korean: 불쌍히 여기는 마음과 눈물로
  alternatives_korean:
  - 측은한 마음과 눈물로
  - 슬픔과 눈물로
  lexicon: LSJ
  rationale: οἶκτος는 단순한 슬픔보다 ‘불쌍히 여김/측은함’의 정서가 더 강하므로, English POB의 여지를 반영해 ‘불쌍히 여기는 마음’으로 옮겼습니다.
- source_word: τῶν ἔμπροσθεν αὐτῷ μεμηχανευμένων
  english_pob_choice: those things that had previously been devised before him
  chosen_korean: 그 앞에서 이전에 꾸며졌던 일들
  alternatives_korean:
  - 그 앞에서 이전에 계획되었던 일들
  - 그 앞에서 이전에 짜였던 일들
  lexicon: LSJ
  rationale: μεμηχανευμένων은 ‘꾀하다/꾸미다/궁리하다’의 의미가 있어, 문맥상 지나치게 음모론적으로 굳히지 않으면서도 인위적으로 마련된 일을 드러내는 ‘꾸며졌던’이 적절합니다.
theological_decisions:
- issue: οἶκτος의 정서 범위
  chosen_reading: ‘불쌍히 여기는 마음’으로 번역해, 단순한 슬픔이나 애도보다 타인에 대한 연민이 섞인 정서로 나타냈습니다.
  alternative_readings:
  - ‘슬픔’
  - ‘애처로움’
  rationale: 본문은 왕의 분노가 연민 섞인 정서와 눈물로 뒤바뀌는 반전을 말하므로, pity/compassion의 뉘앙스를 살리는 것이 문맥에 맞습니다.
  doctrine_reference: 서사적 감정 전환; 본문 신학적 교리 쟁점 없음
