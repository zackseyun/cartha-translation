  source_fidelity: 원문의 μετεστράφη와 εἰς οἶκτον καὶ δάκρυα는 왕의 분노가 연민과 눈물이라는 상반된 정서 상태로 전환되었음을 나타냅니다. ὑπέρ는 해당 일들을 향한/두고 느끼는 정서를 가리키므로, ‘일들로 말미암아’처럼 단순 원인으로 고정하기보다 ‘일들을 두고’로 옮기는 편이 더 충실합니다. τῶν ἔμπροσθεν αὐτῷ μεμηχανευμένων의 압축되고 다소 불명확한 관계는 ‘왕 앞에서 전에 꾸며졌던 일들’로 보존했습니다.
