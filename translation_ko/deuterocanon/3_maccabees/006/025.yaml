base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/025.yaml
  text: Who was it that removed each one from the secure strongholds of our homeland and household[a], where they had held us in faith[b], and gathered them here without reason?
  footnotes:
  - marker: a
    text: Or 'faithfully,' 'in trust,' or possibly 'securely' for 'in faith' (ἐν πίστει); the Greek phrase is difficult in this context.
    reason: lexical_alternative
  - marker: b
    text: The Greek syntax in this clause is difficult; the sense is that the people were taken away from the secure places of their land and homes and assembled here without cause.
    reason: textual_variant
translation:
  language: ko
  text: 누가 우리를 믿음 안에서 붙들고 있던 우리 땅의 견고한 요새들과 집에서 각 사람을 떼어 내어, 까닭 없이 여기로 모아 왔습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘믿음 안에서’는 ἐν πίστει를 가능한 한 그대로 옮긴 것입니다. 이 표현은 문맥상 ‘신실하게’, ‘신뢰 가운데’, 또는 ‘안전하게’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 구절의 그리스어 문장 구조는 어렵습니다. 본문은 사람들이 자기 땅의 견고한 곳들과 집에서 떼어 내어 이곳에 모였다는 뜻을 가리키지만, ‘믿음 안에서’와 ‘붙들고 있던’ 및 장소 표현의 정확한 문법적 결합 관계는 확정하기 어렵습니다.
    reason: source_note
lexical_decisions:
- source_word: τίς
  english_pob_choice: Who was it that
  chosen_korean: 누가
  alternatives_korean:
  - 누가 과연
  - 도대체 누가
  lexicon: LSJ
  rationale: 수사적 질문을 자연스러운 현대 한국어로 옮기되, 원문의 추궁하는 어조를 살렸습니다.
- source_word: ἐν πίστει
  english_pob_choice: in faith
  chosen_korean: 믿음 안에서
  alternatives_korean:
  - 믿음으로
  - 신실하게
  - 신뢰 가운데
  lexicon: BDAG
  rationale: πίστις를 본문 그대로 살려 ‘믿음’으로 두고, 부사적으로 자연스러운 한국어인 ‘안에서’를 보탰습니다. 다만 의미는 확정하지 않고 원문의 모호성을 유지했습니다.
- source_word: τὰ τῆς χώρας ὀχυρώματα τῆς οἰκίας
  english_pob_choice: the secure strongholds of our homeland and household
  chosen_korean: 우리 땅의 견고한 요새들과 집안
  alternatives_korean:
  - 우리 고장의 요새들과 집
  - 우리 땅과 집의 견고한 곳들
  lexicon: LSJ
  rationale: ὀχυρώματα의 물리적 이미지를 ‘견고한 요새들’로 살리고, χώρα는 관계적 의미를 드러내는 ‘우리 땅’으로 옮겼습니다. οἰκία는 ‘집안’으로 번역해 공적 영역과 사적 영역의 병행을 유지했습니다.
- source_word: ἀποστήσας
  english_pob_choice: removed each one from
  chosen_korean: 각자를 떼어 내어
  alternatives_korean:
  - 각 사람을 떼어 내어
  - 각각을 옮겨 내어
  - 떼어 내셨습니까
  lexicon: LSJ
  rationale: 단순한 이동보다 분리·제거의 뉘앙스를 살릴 수 있는 표현을 택해, 뒤의 ‘모아 왔습니까’와 대조를 분명히 했습니다.
- source_word: ἕκαστον
  english_pob_choice: each one
  chosen_korean: 각자를
  alternatives_korean:
  - 각 사람을
  - 모두를
  lexicon: LSJ
  rationale: 분배적 의미를 유지하기 위해 집합적 표현보다 ‘각자’를 사용했습니다.
- source_word: ἀλόγως
  english_pob_choice: without reason
  chosen_korean: 이유도 없이
  alternatives_korean:
  - 까닭 없이
  - 무분별하게
  - 이치 없이
  lexicon: LSJ
  rationale: 직역 어투를 피하면서도 ‘without reason’의 무근거성을 분명히 드러내는 가장 자연스러운 표현을 택했습니다.
- source_word: ἤθροισεν ἐνθάδε
  english_pob_choice: gathered them here
  chosen_korean: 여기로 모아 왔습니까
  alternatives_korean:
  - 여기로 모았습니까
  - 여기로 집결시켰습니까
  lexicon: LSJ
  rationale: ἤθροισεν의 ‘모으다’와 ἐνθάδε의 ‘여기’가 함께 드러나도록 했고, 질문의 흐름에 맞게 이동의 함의가 보이는 ‘모아 왔습니까’를 선택했습니다.
theological_decisions:
- issue: πίστις의 처리
  chosen_reading: ‘믿음 안에서’로 옮겨, 본문이 지닌 모호성을 유지합니다.
  alternative_readings:
  - 믿음으로
  - 신실하게
  - 신뢰 가운데
  rationale: 이 구절은 교리적 진술이 아니라 서술 속 표현이므로, πίστις를 해석적으로 좁히지 않고 원문상의 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: 'DOCTRINE.md contested terms: πίστις → faith; preserve ambiguity where the context is difficult.'
- issue: ἐνθάδε의 지시성
  chosen_reading: ‘여기로’로 옮겨, 화자의 현재 위치를 드러냅니다.
  alternative_readings:
  - 이곳으로
  - 여기
  rationale: 단순한 장소 부사보다 이동의 종착점을 보이는 표현이 문맥에 더 잘 맞습니다.
  doctrine_reference: 원문 지시 부사의 현장성 보존
