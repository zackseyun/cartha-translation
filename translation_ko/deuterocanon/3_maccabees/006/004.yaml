base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/004.yaml
  text: Father[a], you who destroyed Pharaoh—the former ruler of this Egypt—when he was exalted with lawless arrogance and boastful speech, increasing in reckless acts, together with his proud army, drowning them in the sea, and who shone forth the light of mercy upon the people of Israel[c][b],
  footnotes:
  - marker: a
    text: Or 'multiplying acts of insolence' for the difficult phrase 'increasing in reckless acts' (πληθύνoντα θράμασιν).
    reason: lexical_alternative
  - marker: b
    text: Literally 'you destroyed [them] sea-swallowed,' an image of Pharaoh and his army being engulfed by the sea.
    reason: lexical_alternative
  - marker: c
    text: Literally 'you shone forth the light of mercy' upon Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 아버지여[a], 이집트의 그전 통치자 파라오를, 그가 불법한 대담함과 자랑스러운 말로 높아지고, 무모한 일들을 더해 가던 중에 그의 교만한 군대와 함께 그들을 바다 속에 익사시키셨으며, 이스라엘 백성에게는 자비의 빛을 비추어 주신 분이십니다[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직접 호칭을 살린 번역입니다.
    reason: korean_style_note
  - marker: b
    text: 직역하면 ‘바다에 삼켜지게 하셨다’는 뜻으로, 파라오와 그의 군대가 바다에 휩쓸려 멸망한 이미지를 담고 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘자비의 빛을 비추셨다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάτερ
  english_pob_choice: Father
  chosen_korean: 아버지여
  alternatives_korean:
  - 아버지시여
  - 아버지
  lexicon: LSJ
  rationale: 기도문의 직접 호칭을 살리되, 한국어에서 자연스러운 호격으로 옮겼습니다.
- source_word: τὸν πρὶν Αἰγύπτου ταύτης δυνάστην
  english_pob_choice: the former ruler of this Egypt
  chosen_korean: 이집트의 그전 통치자
  alternatives_korean:
  - 이집트의 이전 통치자
  - 이집트의 옛 지배자
  lexicon: LSJ
  rationale: πρὶν과 δυνάστης의 의미를 살려 ‘그전 통치자’로 옮기고, ταύτης의 지시성을 ‘이집트의’와 함께 자연스럽게 반영했습니다.
- source_word: ἐπαρθέντα ἀνόμῳ θράσει καὶ γλώσσῃ μεγαληγόμονι
  english_pob_choice: was lifted up in lawless boldness and boastful speech
  chosen_korean: 불법한 대담함과 자랑스러운 말로 높아지고
  alternatives_korean:
  - 불법한 교만과 떠드는 말로 높아지고
  - 율법 없는 뻔뻔함과 허풍 섞인 말로 높아지고
  lexicon: LSJ
  rationale: ‘높아지고’는 ἐπαρθέντα의 상승/자기고양 이미지를 살리고, θράσος와 μεγαληγόμονι의 결합을 ‘대담함’과 ‘자랑스러운 말’로 전달했습니다.
- source_word: πληθύνoντα θράμασιν
  english_pob_choice: increasing in reckless acts
  chosen_korean: 무모한 일들을 더해 가던 중에
  alternatives_korean:
  - 무례한 일들을 늘려 가던 중에
  - 불손한 짓을 더해 가던 중에
  lexicon: LSJ
  rationale: 난해한 구절의 행위적 확장을 한국어로 자연스럽게 풀되, POB의 ‘reckless acts’와 같은 과도함/무모함의 뉘앙스를 유지했습니다.
- source_word: ποντοβρόχους ἀπώλεσας
  english_pob_choice: drowning them in the sea
  chosen_korean: 그들을 바다 속에 익사시키셨으며
  alternatives_korean:
  - 그들을 바다에 삼켜지게 하셨으며
  - 그들을 바닷물에 잠기게 하셨으며
  lexicon: LSJ
  rationale: 포악하게 삼켜지는 이미지를 한국어에서 선명하게 전달하기 위해 결과적 의미를 살려 번역했습니다.
- source_word: φέγγος ἐπιφάνας ἐλέους
  english_pob_choice: shone forth the light of mercy
  chosen_korean: 자비의 빛을 비추어 주신
  alternatives_korean:
  - 자비의 광명을 드러내신
  - 자비의 빛을 밝히신
  lexicon: LSJ
  rationale: ‘빛’과 ‘비추다’로 광휘 이미지를 보존하면서, ἐλέους의 의미는 ‘자비’로 옮겼습니다.
theological_decisions:
- issue: 동일 문장 안에서 심판(파라오와 군대의 멸망)과 긍휼(이스라엘에게 비추신 빛)을 함께 유지할지 여부
  chosen_reading: 두 이미지를 모두 한 문장으로 유지하여, 하나님의 심판과 자비가 대비되는 기도문의 수사적 긴장을 살렸습니다.
  alternative_readings:
  - 문장을 둘로 나누어 가독성을 높이기
  - ‘자비를 베푸셨다’로 빛의 은유를 평이하게 바꾸기
  rationale: 본문은 파라오에 대한 심판과 이스라엘에 대한 자비를 병치합니다. 이를 풀어버리면 원문의 신학적 대비가 약해집니다.
  doctrine_reference: 'DOCTRINE.md: 신학적 긴장을 완화하지 말고, 본문이 가진 대비와 은유를 보존할 것.'
