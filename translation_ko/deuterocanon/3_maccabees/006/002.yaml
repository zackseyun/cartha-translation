translation:
  language: ko
  text: 오 위대하시고 권능 있으신 왕이시며, 지극히 높으시며, 전능하신 하나님이시여, 긍휼 가운데 온 피조 세계를 다스리시는 분이시여,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘긍휼 가운데’에 쓰인 그리스어는 복수형으로, 하나님의 풍성한 자비 또는 자비로운 행위들을 암시합니다. ‘자비로’ 또는 ‘자비롭게’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεῦ
  english_pob_choice: O King
  chosen_korean: 오 왕이시여
  alternatives_korean:
  - 왕이시여
  - 오 임금이시여
  lexicon: LSJ
  rationale: 기도문의 직접 호칭이므로 감탄호격을 살려 '오 …이시여'로 옮겼습니다.
- source_word: μεγαλοκράτωρ
