  lexicon: LSJ
  rationale: 단순한 '큰 통치자'보다 권능의 크기를 강조하는 복합어의 힘을 살렸습니다.
- source_word: ὕψιστε
  english_pob_choice: Most High
  chosen_korean: 지극히 높으신 이시며
  alternatives_korean:
  - 가장 높으신 분이시며
  - 지존하신 이시며
  lexicon: LSJ
  rationale: 하나님의 호칭으로 널리 알려진 표현을 유지하되, 한국어 문맥에 맞게 호격을 살렸습니다.
- source_word: παντοκράτωρ δέε
  english_pob_choice: almighty God
  chosen_korean: 만물의 주권자 하나님이시여
  alternatives_korean:
  - 전능하신 하나님이시여
  - 모든 것을 다스리시는 하나님이시여
  lexicon: LSJ
  rationale: παντοκράτωρ의 통치적 뉘앙스를 '주권자'로 살리고, δέε의 직접 호칭은 문맥상 반복된 호격 흐름 안에서 처리했습니다.
- source_word: τὴν πᾶσαν ... κτίσιν
  english_pob_choice: all creation
  chosen_korean: 모든 창조물
  alternatives_korean:
  - 온 창조
  - 온 피조 세계
  lexicon: LSJ
  rationale: κτίσις의 포괄적 '창조된 것들'이라는 뜻을 자연스러운 한국어로 옮겼습니다.
- source_word: διακυβερνῶν
  english_pob_choice: governing
  chosen_korean: 다스리시는
  alternatives_korean:
  - 이끄시는
  - 통치하시는
  lexicon: LSJ
  rationale: 배를 조종하듯 이끄는 어감을 포함하나, 기도문에서는 하나님의 통치로 자연스럽게 드러나는 '다스리다'가 적절합니다.
- source_word: ἐν οἰκτιρμοῖς
  english_pob_choice: with mercies
  chosen_korean: 긍휼로
  alternatives_korean:
  - 자비로
  - 긍휼 가운데서
  lexicon: LSJ
  rationale: 복수형 명사이지만 한국어에서는 '긍휼'이 하나님의 자비 행위들을 압축해 드러내므로 가장 간결하게 반영했습니다.
theological_decisions:
- issue: 호칭이 연속되는 기도문 구조
  chosen_reading: 각 호칭을 분리해 직접 부르며, 종결은 '-시여'로 통일했습니다.
  alternative_readings:
  - 호칭을 한 문장으로 압축하기
  - 일부 호칭을 서술형으로 바꾸기
  rationale: 그리스어는 왕, 지극히 높으신 이, 전능하신 하나님을 겹쳐 부르는 기도 수사이므로, 한국어도 이를 축약하지 않고 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 6
- issue: οἰκτιρμοῖς의 복수 뉘앙스
  chosen_reading: '''긍휼로''로 옮기되, 하나님의 자비 행위가 풍성하다는 의미를 살렸습니다.'
  alternative_readings:
  - '''긍휼들로''처럼 직역하기'
  - '''자비롭게''로 부사화하기'
  rationale: 복수형의 형식은 한국어에서 자연스럽지 않으므로, 결과적으로 드러나는 풍성한 자비의 성격을 보존하는 쪽이 더 충실합니다.
  doctrine_reference: Translation philosophy §6
