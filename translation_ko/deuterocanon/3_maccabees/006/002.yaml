  source_fidelity: 그리스어의 연속된 호격(왕, 위대하고 권능 있는 이, 지극히 높으신 이, 전능하신 하나님)과 온 창조를 자비로 다스리신다는 진술은 대체로 반영되었습니다. 다만 μεγαλοκράτωρ는 ‘권능이 크신 왕’보다 ‘위대하시고 권능 있으신 왕’으로 풀어 주는 편이 복합 호칭의 뜻과 한국어 호격 문체를 더 정확히 살립니다. κτίσις는 여기서 집합적 단수이므로 ‘모든 창조물’보다 ‘온 피조 세계’가 더 자연스럽고 포괄적입니다.
  naturalness: 초안은 ‘-이시며’가 연속된 뒤 마지막에 다시 ‘분이시여’가 와서 호격 기도문으로는 다소 무겁고 부자연스럽습니다. 각 칭호를 자연스럽게 연결하고, 마지막 분사구를 ‘…다스리시는 분이시여’로 두면 현대 한국어 합쇼체의 장엄한 기도문 어조가 살아납니다.
  terminology: παντοκράτωρ δέε는 한국어 성서 문체에서 널리 통용되는 ‘전능하신 하나님이시여’로 옮기는 것이 적절합니다. 이는 단순한 능력뿐 아니라 모든 것을 다스리시는 신적 칭호라는 문맥을 해치지 않습니다. οἰκτιρμοῖς의 복수는 본문에서 억지로 복수화하지 않고 ‘긍휼 가운데’로 옮기며 각주에서 보완합니다.
