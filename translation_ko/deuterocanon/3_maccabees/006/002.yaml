translation:
  language: ko
  text: 오 권능이 크신 왕이시며, 지극히 높으신 이시며, 만물의 주권자 하나님이시여, 모든 창조물을 긍휼로 다스리시는 분이시여,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''만물의 주권자''는 παντοκράτωρ의 통치적·우주적 의미를 살린 번역입니다.'
    reason: lexical_alternative
  - marker: b
    text: '''긍휼로''는 그리스어 복수 명사 οἰκτιρμοῖς가 암시하는 풍성한 자비의 행위를 한국어로 자연스럽게 반영한 표현입니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεῦ
  english_pob_choice: O King
  chosen_korean: 오 왕이시여
  alternatives_korean:
  - 왕이시여
  - 오 임금이시여
  lexicon: LSJ
  rationale: 기도문의 직접 호칭이므로 감탄호격을 살려 '오 …이시여'로 옮겼습니다.
- source_word: μεγαλοκράτωρ
