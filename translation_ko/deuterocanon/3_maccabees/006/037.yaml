  text: And they approached the king[a], asking for their release to their own homes.
  footnotes:
  - marker: a
    text: Or 'their own places.' The Greek idiom εἰς τὰ ἴδια can refer more broadly to what belongs to someone, but here likely means returning home.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 왕에게 나아가 자기들의 고국으로 돌아가게 해 달라고 요청하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기들의 곳으로’. 그리스어 관용구 εἰς τὰ ἴδια는 더 넓게 ‘자기에게 속한 곳’을 가리킬 수 있지만, 여기서는 아마 집으로 돌아감을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέτυχον
  english_pob_choice: approached
  chosen_korean: 나아가
  alternatives_korean:
