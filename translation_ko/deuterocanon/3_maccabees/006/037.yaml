  - 자기들의 곳으로
  - 자기들의 소유로
  lexicon: LSJ
  rationale: 이 관용구는 ‘자기에게 속한 곳’ 일반을 뜻할 수 있으나, 여기서는 POB의 판단처럼 귀가/귀환의 의미가 가장 자연스러워 ‘고국으로’로 풀었습니다.
