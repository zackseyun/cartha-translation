  text: And they approached the king[a], asking for their release to their own homes.
  footnotes:
  - marker: a
    text: Or 'their own places.' The Greek idiom εἰς τὰ ἴδια can refer more broadly to what belongs to someone, but here likely means returning home.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 왕에게 나아가 자신들을 풀어 자기들의 집으로 돌아가게 해 달라고 요청하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기들의 곳으로’. 그리스어 관용구 εἰς τὰ ἴδια는 더 넓게 자기에게 속한 곳을 가리킬 수 있지만, 여기서는 아마 집으로 돌아감을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέτυχον
  english_pob_choice: approached
  chosen_korean: 나아가
  alternatives_korean:
  - 다가가
  - 접근하여
  - 왕을 찾아가
  lexicon: LSJ
  rationale: 문맥상 왕에게 직접 나아가 청원하는 동작을 나타내므로, 지나치게 형식적인 법률 용어보다 자연스럽게 ‘나아가’로 옮겼습니다.
- source_word: τῷ βασιλεῖ
  english_pob_choice: the king
  chosen_korean: 왕에게
  alternatives_korean:
  - 임금에게
  - 대왕에게
  lexicon: Greek grammar
  rationale: 그리스어의 여격 목적어를 한국어 조사로 자연스럽게 처리했고, 본문은 단순히 ‘왕’이라고만 하므로 추가 존칭은 두지 않았습니다.
- source_word: τὴν ἀπόλυσιν
  english_pob_choice: release
  chosen_korean: 돌아가게 해 달라고
  alternatives_korean:
  - 석방
  - 해방
  - 풀어 주어
  lexicon: LSJ
  rationale: ἀπόλυσις는 ‘풀어 줌/떠나게 함’의 뜻이지만, 이 절에서는 단순한 면책이 아니라 떠나 귀환하게 해 달라는 요청이므로 결과를 분명히 드러냈습니다.
- source_word: εἰς τὰ ἴδια
  english_pob_choice: to their own homes
  chosen_korean: 자기들의 고국으로
  alternatives_korean:
  - 자기들의 집으로
  - 자기들의 곳으로
  - 자기들의 소유로
  lexicon: LSJ
  rationale: 이 관용구는 ‘자기에게 속한 곳’ 일반을 뜻할 수 있으나, 여기서는 POB의 판단처럼 귀가/귀환의 의미가 가장 자연스러워 ‘고국으로’로 풀었습니다.
