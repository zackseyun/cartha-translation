translation:
  language: ko
  text: 그리고 왕이 그들에게 동의하자, 그는 각 성의 장군들에게 보낼 다음과 같은 편지를 그들에게 썼는데, 그것은 너그러우면서도 자세한 내용을 담고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘아래에 적힌 편지’ 또는 ‘뒤에 덧붙인 편지’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 στρατηγοί는 여기서 ‘장군들’이 가장 자연스럽지만, 문맥에 따라 ‘지휘관들’ 또는 행정적 의미로 ‘총독들’로도 옮길 수 있습니다.
    reason: lexical_alternative
