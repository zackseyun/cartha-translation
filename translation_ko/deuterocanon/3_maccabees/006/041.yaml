  source_fidelity: 핵심 사건과 수신 대상은 대체로 반영했지만, ‘너그러우면서도’는 원문의 부사 μεγαλοψύχως를 부자연스러운 대조 연결로 바꾸며, 그 수식 범위도 불명확하게 합니다. 또한 ‘그들에게 썼는데, 그것은’은 αὐτοῖς와 장군들에게의 관계 및 편지의 상세한 성격을 어색하게 처리합니다.
  naturalness: 현행 문장은 ‘너그러우면서도 자세한 내용을’이라는 결합이 자연스럽지 않고, ‘그것은’의 지시 대상도 문체상 무겁습니다. 왕의 승인, 편지의 수신자, 편지의 상세한 내용을 분명히 하도록 문장을 재구성하는 것이 좋습니다.
  terminology: ‘왕’, ‘각 성’, ‘장군들’, ‘편지’는 적절합니다. στρατηγοί의 대안 가능성을 알리는 각주는 유지할 수 있습니다. ὑπογεγραμμένην은 본문에서 ‘다음’으로 자연스럽게 처리하되 각주에서 문자적 의미를 밝혀야 합니다.
