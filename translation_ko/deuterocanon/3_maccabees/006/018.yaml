translation:
  language: ko
  text: 그때 크게 영광스럽고 전능하며 참되신 하나님께서 자신의 거룩한 얼굴을 드러내시자, 하늘의 문들을 여셨고, 그 문들로부터 두 천사—영광스럽고 두려운 모습의 천사들—가 내려와 유대인들을 제외한 모든 사람에게 보였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 거룩한 임재’ 혹은 ‘그의 거룩한 얼굴(얼굴빛)’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγαλοδόξος
  english_pob_choice: greatly glorious
  chosen_korean: 크게 영광스럽고
  alternatives_korean:
  - 가장 영광스러운
  - 영광이 지극하신
  lexicon: LSJ
  rationale: 신적 위엄을 강조하는 복합 형용사의 증폭 효과를 살리되, 한국어에서는 자연스러운 부사+형용사 구조로 옮겼습니다.
- source_word: παντοκράτωρ
  english_pob_choice: almighty
  chosen_korean: 전능하며
  alternatives_korean:
  - 만물의 주권자이신
  - 모든 것을 다스리시는
  lexicon: LSJ
  rationale: 하나님께 대한 관용적 대응어로서 ‘전능하신’ 계열이 가장 자연스럽고, 앞의 형용사들과 병렬을 이루도록 동사형으로 정리했습니다.
- source_word: τὸ ἅγιον αὐτοῦ πρόσωπον
  english_pob_choice: his holy face
  chosen_korean: 자신의 거룩한 얼굴
  alternatives_korean:
  - 자신의 거룩한 임재
  - 자신의 거룩한 낯
  lexicon: LSJ
  rationale: 원문의 구체적 신체 이미지인 πρόσωπον을 약화시키지 않기 위해 ‘얼굴’을 본문에 유지했습니다. English POB의 주석이 제시한 해석적 대안은 본문이 아니라 주석으로만 보존했습니다.
- source_word: οὐρανίους πύλας
  english_pob_choice: gates of heaven
  chosen_korean: 하늘의 문들
  alternatives_korean:
  - 하늘 문들
  - 하늘의 성문들
  lexicon: LSJ
  rationale: οὐρανίους는 ‘하늘의’라는 속격적 관계를 분명히 하며, πύλας는 단순한 문보다 ‘문들/문턱’보다 넓은 प्रवेश 이미지를 지니므로 ‘문들’로 옮겼습니다.
- source_word: φοβεροειδεῖς
  english_pob_choice: of fearful appearance
  chosen_korean: 두려운 모습의
  alternatives_korean:
  - 무서운 생김새의
  - 공포를 자아내는 외모의
  lexicon: LSJ
  rationale: 형용사적 복합어의 관찰적 묘사를 유지하면서도 한국어 문맥에서 어색하지 않도록 간결하게 처리했습니다.
- source_word: φανεροὶ πᾶσιν πλὴν τοῖς Ἰουδαίοις
  english_pob_choice: visible to everyone except the Jews
  chosen_korean: 유대인들을 제외한 모든 사람에게 보였습니다
  alternatives_korean:
  - 유대인들만 빼고 모두에게 드러났습니다
  - 유대인들을 제외한 모든 이에게 나타났습니다
  lexicon: LSJ
  rationale: φανεροί의 ‘분명히 보이는/드러난’ 의미를 서술문으로 풀어, 서사적 사실 진술을 명확하게 했습니다.
theological_decisions:
- issue: 하나님을 가리키는 인격적 신체 이미지의 처리
  chosen_reading: ‘거룩한 얼굴’을 본문에 그대로 두어, 신적 현현의 구체적 이미지를 약화시키지 않았습니다.
  alternative_readings:
  - 거룩한 임재
  - 거룩한 존재
  rationale: 원문은 추상적 표현보다 얼굴이라는 인체 이미지를 사용합니다. 이를 완곡하게 바꾸면 현현의 생생함이 줄어들므로, 본문에서는 직설적 이미지를 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
- issue: 유대인들을 제외한 가시성 진술의 보존
  chosen_reading: ‘유대인들을 제외한 모든 사람에게’라는 배타적 진술을 그대로 유지했습니다.
  alternative_readings:
  - 모든 사람에게 드러났으나 유대인들은 보지 못했습니다
  rationale: 본문은 천사들의 현현이 특정 집단에게는 인지되지 않았다고 직접 말합니다. 역사적·서사적 긴장을 완화하지 않고, 원문의 진술을 그대로 전달했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
