  yaml_path: translation/deuterocanon/3_maccabees/006/017.yaml
  text: And when the Jews saw it[a], they cried out loudly to heaven, so that even the neighboring courtyards, echoing with them[b], produced uncontrollable terror throughout the whole camp.
  footnotes:
  - marker: a
    text: Or 'the adjacent courts resounded together,' emphasizing that the surrounding enclosed spaces reverberated with the Jews' cry.
    reason: lexical_alternative
  - marker: b
    text: Or 'caused uncontrollable panic throughout the whole camp.' The Greek πτοή can denote fright, terror, or panic.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다 사람들이 그것을 보고는 하늘을 향해 크게 외쳤습니다. 그래서 그들과 함께 울려 퍼진 주변 뜰들까지도 온 진영에 걷잡을 수 없는 공포를 일으켰습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주변 뜰들이 함께 울려 퍼졌다’로도 옮길 수 있습니다. 이 경우 주변의 폐쇄된 공간들이 유다 사람들의 외침을 되울렸다는 뉘앙스가 더 분명해집니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘걷잡을 수 없는 패닉을 온 진영에 일으켰습니다.’ πτοή는 공포, 전율, 패닉까지 포괄할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: θεωρήσαντες
  english_pob_choice: when they saw it
  chosen_korean: 그것을 보고는
  alternatives_korean:
  - 그것을 보자
  - 보고서
  lexicon: LSJ
  rationale: 부사적 분사로서 앞선 상황을 이끄는 값을 살려, 자연스러운 한국어 연결어미로 옮겼습니다.
- source_word: μέγα εἰς οὐρανὸν ἀνέκραξαν
  english_pob_choice: they cried out loudly to heaven
  chosen_korean: 하늘을 향해 크게 외쳤습니다
  alternatives_korean:
  - 하늘에 크게 부르짖었습니다
  - 하늘을 향해 큰 소리로 외쳤습니다
  lexicon: LSJ
  rationale: μέγα를 부사적으로 처리한 강한 외침을 살리면서, εἰς οὐρανόν의 방향성을 '향해'로 보존했습니다.
- source_word: τοὺς παρακειμένους αὐλῶνας συνηχήσαντας
  english_pob_choice: the neighboring courtyards, echoing with them
  chosen_korean: 그들과 함께 울려 퍼진 주변 뜰들까지도
  alternatives_korean:
  - 그들과 함께 메아리친 인접한 뜰들까지도
  - 곁에 있는 뜰들이 그 소리와 함께 울려 퍼져
  lexicon: LSJ
  rationale: αὐλῶνας는 단순한 '뜰'보다 넓은 울림 공간을 가리킬 수 있어 '주변 뜰들'로 옮기고, συνηχήσαντας는 '울려 퍼진'으로 공동 울림을 표현했습니다.
- source_word: ἀκατάσχετον πτοὴν
  english_pob_choice: uncontrollable terror
  chosen_korean: 걷잡을 수 없는 공포
  alternatives_korean:
  - 멈출 수 없는 공포
  - 제어할 수 없는 공황
  lexicon: LSJ
  rationale: πτοή의 의미 범위인 두려움/공포/패닉을 반영하되, 문맥상 군중 전체를 휩쓰는 반응을 한국어 관용으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: εἰς οὐρανόν의 신학적 직접화 여부
  chosen_reading: '''하늘을 향해''로 유지하고 하나님을 본문에 직접 덧붙이지 않았습니다.'
  alternative_readings:
  - 하나님께
  - 하늘로
  rationale: 그리스어 본문은 '하늘'을 말할 뿐 직접적으로 하나님을 명시하지 않으므로, 암시를 유지하면서도 해석을 과잉 확장하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3
