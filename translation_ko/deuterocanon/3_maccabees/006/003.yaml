  - ‘거룩하게 구별된 야곱의 자녀들’로 더 자유롭게 옮길 수 있습니다.
  rationale: 그리스어가 압축되어 있어 둘 다 가능하지만, 영어 POB의 최종 결정을 따라 분사의 직결감을 보존하는 쪽이 본문 구조를 더 잘 드러냅니다.
