theological_decisions:
- issue: ἡγιασμένου의 수식 대상
  chosen_reading: ‘거룩하게 된 야곱의 자녀들’로 옮겨, 분사가 야곱을 수식하는 주된 읽기를 따랐습니다.
  alternative_readings:
  - ‘거룩하게 된 자녀들’로 읽어 야곱의 자녀들을 수식할 수 있습니다.
  - ‘거룩하게 구별된 야곱의 자녀들’로 더 자유롭게 옮길 수 있습니다.
  rationale: 그리스어가 압축되어 있어 둘 다 가능하지만, 영어 POB의 최종 결정을 따라 분사의 직결감을 보존하는 쪽이 본문 구조를 더 잘 드러냅니다.
  doctrine_reference: 애매성을 해소하기보다 주석으로 보존하는 원칙을 따릅니다.
