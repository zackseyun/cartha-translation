  yaml_path: translation/deuterocanon/3_maccabees/006/003.yaml
  text: Look upon the offspring of Abraham[a], the children of Jacob who has been sanctified, your sanctified allotted people, perishing unjustly as strangers in a foreign land.
  footnotes:
  - marker: a
    text: Or, 'the sanctified children of Jacob.' The Greek phrase is compressed, and the participle 'sanctified' may be taken with 'children' rather than with 'Jacob.'
    reason: alternative_reading
translation:
  language: ko
  text: 아브라함의 씨를, 거룩하게 된 야곱의 자녀들을, 당신의 거룩하게 된 몫인 백성을, 이방 땅에서 낯선 이들처럼 부당하게 멸망해 가는 이들을 굽어보십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거룩하게 된 야곱의 자녀들’로도 읽을 수 있습니다. 그리스어 구문이 압축되어 있어, 분사 ‘거룩하게 된’이 ‘야곱’이 아니라 ‘자녀들’과 연결될 가능성도 있습니다.
    reason: alternative_reading
