review_pass:
  verdict: revise
  source_fidelity: The draft conveys the prayerful imperative, Abrahamic descent, the repeated sanctification language, God's people as his portion, and the ongoing unjust perishing. However, ‘이방 땅’ and especially ‘낯선 이들처럼’ do not naturally convey the paired ξένη/ξένως sense of living as foreigners in a foreign land. The appositional Greek nouns are also better represented as one people rather than as a sequence ending in a separate pronoun.
  naturalness: ‘거룩하게 된 야곱의 자녀들’ is understandable but somewhat awkward, and ‘낯선 이들’ normally means unfamiliar persons rather than resident foreigners. The revision uses modern formal Korean, makes the apposition explicit with ‘곧,’ and retains the source's purposeful foreign-land/foreigner repetition as ‘타국 땅에서 타국인으로서.’
  terminology: ‘후손’ is a natural collective equivalent for σπέρμα in modern Korean. ‘거룩하게 구별된’ clearly conveys ἡγιασμένος without importing a doctrinal interpretation. ‘당신의 몫으로 거룩하게 구별된 백성’ idiomatically renders the people as God's sanctified portion while preserving the repeated consecration motif.
  issues:
  - severity: medium
    issue: ‘낯선 이들처럼’ is not an idiomatic rendering of ξένως in this context.
    rationale: It can mean ‘like unfamiliar people,’ whereas ξένως describes the people's condition as foreigners/aliens. ‘타국인으로서’ expresses that status and preserves the rhetorical repetition with ξένῃ γῇ.
  - severity: low
    issue: The list of accusative phrases and final ‘이들을’ obscures their appositional relation.
    rationale: The Greek identifies Abraham's offspring, Jacob's children, and God's allotted people as the same referent. Restructuring around ‘곧 ... 백성이’ is clearer in Korean without reducing the source's apposition.
  - severity: low
    issue: ‘당신의 거룩하게 된 몫인 백성’ is grammatically heavy in modern Korean.
    rationale: ‘당신의 몫으로 거룩하게 구별된 백성’ maintains the relation of the people to God's sanctified portion and reads more naturally.
  revised_text: 아브라함의 후손, 거룩하게 구별된 야곱의 자녀들[a], 곧 당신의 몫으로 거룩하게 구별된 백성이 타국 땅에서 타국인으로서 부당하게 멸망해 가는 것을 굽어보십시오.
  revised_footnotes:
  - marker: a
    text: 또는 ‘야곱의 거룩하게 구별된 자녀들’로 읽을 수 있습니다. 그리스어 구문이 압축되어 있어, 분사 ‘거룩하게 구별된’이 ‘야곱’이 아니라 ‘자녀들’과 연결될 가능성도 있습니다.
    reason: alternative_reading
