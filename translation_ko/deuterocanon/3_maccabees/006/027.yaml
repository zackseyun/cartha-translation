  - marker: b
    text: Or 'setting aside what had been ordered.' The participle indicates abandoning the previously issued command.
    reason: lexical_alternative
translation:
  language: ko
  text: 부당한 결박을 풀어 주십시오. 완전히 풀어 주십시오. 앞서 명령된 것을 제쳐 두고[b], 그들을 평안히 자기들의 집으로[a] 돌려보내십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기들의 곳으로’입니다. εἰς τὰ ἴδια는 더 넓게는 자기들에게 속한 것, 또는 자기들의 집이나 장소를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘앞서 명령된 것을 포기하고’입니다. 이 분사는 앞서 내려진 명령을 거절하거나 제쳐 두는 행위를 나타냅니다.
    reason: lexical_alternative
