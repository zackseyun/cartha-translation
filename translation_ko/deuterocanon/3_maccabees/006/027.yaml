  text: Release[a], release the unjust bonds; send them away to their own homes in peace[b], setting aside what has been ordered.
  footnotes:
  - marker: a
    text: Or 'to their own places.' The Greek εἰς τὰ ἴδια can refer more broadly to what belongs to them or to their own households/places.
    reason: lexical_alternative
  - marker: b
    text: Or 'setting aside what had been ordered.' The participle indicates abandoning the previously issued command.
    reason: lexical_alternative
translation:
  language: ko
  text: 불의한 사슬을 풀고 또 풀어서, 자기 집으로 평안히 돌려보내고, 이전에 명령된 것은 내려놓으십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기들의 곳으로’입니다. εἰς τὰ ἴδια는 더 넓게는 자기에게 속한 것 또는 자기 집/장소를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘명령된 것을 내려놓고’입니다. 이 분사는 앞서 내려진 명령을 포기하거나 중단하는 뜻을 나타냅니다.
    reason: lexical_alternative
