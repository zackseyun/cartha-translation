  yaml_path: translation/deuterocanon/3_maccabees/006/033.yaml
  text: Likewise, the king also, holding a great banquet because of these things, was continually offering exalted thanksgiving to heaven for their astonishing deliverance that had taken place.
  footnotes:
  - marker: a
    text: Or 'a lavish feast'; the Greek literally says 'a heavy banquet,' an idiom for a grand or abundant feast.
    reason: lexical_alternative
  - marker: b
    text: Or 'their extraordinary salvation that had occurred.' Here 'deliverance' reflects the immediate sense of rescue in the narrative.
    reason: lexical_alternative
translation:
  language: ko
  text: 이와 같이 왕도 이 일들 때문에 큰 잔치를 베풀고는, 그들의 놀라운 구원이 이루어진 것에 대해 하늘을 향하여 끊임없이 큰 감사를 드렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡσαύτως
  english_pob_choice: Likewise
  chosen_korean: 이와 같이
  alternatives_korean:
  - 그와 같이
  - 마찬가지로
  lexicon: LSJ
  rationale: 앞선 사건과 병행되는 행동을 자연스럽게 이어 주는 표현으로, 비교적 간결하면서도 대응 관계를 잘 살립니다.
- source_word: συμπόσιον βαρὺ
  english_pob_choice: a great banquet
  chosen_korean: 큰 잔치
  alternatives_korean:
  - 성대한 잔치
  - 호화로운 잔치
  lexicon: LSJ
  rationale: συμπόσιον은 잔치/연회를 뜻하고, βαρύς는 여기서 물리적 무게보다 규모와 성격의 중대함을 나타내므로, 한국어로는 가장 자연스러운 '큰 잔치'가 적절합니다.
- source_word: ἀνθωμολογεῖτο μεγαλομερῶς
  english_pob_choice: was continually offering exalted thanksgiving
  chosen_korean: 끊임없이 큰 감사를 드렸습니다
  alternatives_korean:
  - 끊임없이 드높은 감사를 드렸습니다
  - 끊임없이 장엄한 감사를 드렸습니다
  lexicon: LSJ
  rationale: 동사와 부사의 결합은 감사의 행위를 반복적·지속적으로 나타내며, 한국어에서는 '감사를 드리다'가 가장 자연스럽습니다. μεγαλομερῶς는 지나친 해석 없이 규모가 큰 감사를 뜻하는 쪽으로 옮겼습니다.
- source_word: παραδόξῳ γενηθείσῃ αὐτῶν σωτηρίᾳ
  english_pob_choice: their astonishing deliverance that had taken place
  chosen_korean: 그들의 놀라운 구원이 이루어진 것
  alternatives_korean:
  - 그들의 놀라운 구원이 발생한 것
  - 그들에게 일어난 놀라운 구원
  lexicon: LSJ
  rationale: σωτηρία는 이 문맥에서 신학적 추상보다 실제 구출 사건을 가리키므로 '구원'으로 두되, 완료된 사건임을 살려 '이루어진 것'으로 표현했습니다.
theological_decisions:
- issue: εἰς οὐρανόν의 신학적 범위
  chosen_reading: 하늘을 향하여
  alternative_readings:
  - 하늘에
  - 하나님께
  rationale: 본문은 '하늘'을 직접 말할 뿐 '하나님'을 명시하지 않으므로, 원문의 절제를 유지하면서 방향성을 살린 표현을 택했습니다.
  doctrine_reference: 원문의 직설적 의미 보존; 명시되지 않은 신학적 대상을 과도하게 삽입하지 않음
- issue: σωτηρία의 번역 범위
  chosen_reading: 구원
  alternative_readings:
  - 구출
  - 구제
  rationale: 이 장면은 공동체의 실제적 구출 사건을 말하지만, 헬라어 σωτηρία가 지닌 더 넓은 의미도 함께 울리므로 '구원'으로 유지하되 문맥상 사건성을 분명히 했습니다.
  doctrine_reference: 서사적 맥락에서의 source-direct 번역; 신학적 함축을 지우지 않되 과잉 교리화하지 않음
