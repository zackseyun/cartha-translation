    issue: βαρύθυμον을 ‘거친’으로 옮긴 것은 어휘의 중심 뜻에서 벗어날 수 있습니다.
    rationale: 이 말은 무겁고 침울한 심성 또는 기질을 가리킵니다. ‘음울한’은 문맥상 가능한 범위에서 이를 더 직접적으로 반영합니다.
