base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/020.yaml
  text: And even the king’s body became seized with shuddering[b][a], and his heavy-hearted boldness was overcome by forgetfulness.
  footnotes:
  - marker: a
    text: Or 'his grim audacity was seized by confusion/forgetfulness.' The Greek λήθη is literally 'forgetfulness,' but in context it may describe sudden mental disorientation that undid his resolve.
    reason: lexical_alternative
  - marker: b
    text: Or 'audacity' or 'insolence' for θράσος, highlighting the king's arrogant presumption rather than neutral courage.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 왕의 몸도 떨림에 사로잡혔고, 그의 거친 boldness는 망각에 의해 사라졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘망각’은 문자적으로는 기억의 상실이지만, 문맥에서는 갑작스런 정신적 혼미나 결의의 붕괴를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: θράσος는 중립적 ‘용기’보다 ‘대담함’, ‘뻔뻔함’, ‘거친 배짱’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόφρικον
  english_pob_choice: seized with shuddering
  chosen_korean: 떨림에 사로잡혔고
  alternatives_korean:
  - 몸서리쳤고
  - 전율했고
  - 떨며
  lexicon: LSJ
  rationale: 몸의 반응을 나타내는 표현으로 살리되, 한국어에서는 ‘사로잡히다’를 써서 돌발적이고 전신적인 떨림을 자연스럽게 표현했습니다.
- source_word: σῶμα
  english_pob_choice: body
  chosen_korean: 몸
  alternatives_korean:
  - 육체
  - 신체
  lexicon: LSJ
  rationale: 본문이 왕의 내면이 아니라 실제 신체 반응을 말하므로, 일상적이면서도 직접적인 ‘몸’으로 옮겼습니다.
- source_word: βαρύθυμον
  english_pob_choice: heavy-hearted
  chosen_korean: 거친
  alternatives_korean:
  - 무거운 마음의
  - 침울한
  - 음울한
  lexicon: LSJ
  rationale: 이 형용사는 문자적으로는 무겁고 눌린 성향을 가리키며, 문맥상 왕의 완고하고 위압적인 태도를 함께 드러내므로 한국어에서는 감정 상태보다 성격의 거친 결을 살리는 쪽을 택했습니다.
- source_word: λήθη
  english_pob_choice: forgetfulness
  chosen_korean: 망각
  alternatives_korean:
  - 잊어버림
  - 혼미
  - 혼란
  lexicon: LSJ
  rationale: Pob의 ‘forgetfulness’를 따라가되, 한국어에서는 추상명사 ‘망각’이 문맥상 갑작스런 정신적 붕괴를 가장 압축적으로 드러냅니다.
theological_decisions:
- issue: 왕의 ‘θράσος’와 ‘λήθη’의 관계
  chosen_reading: 왕의 거친 담대함이 망각에 의해 꺾이고 사라지는 것으로 옮겼습니다.
  alternative_readings:
  - 망각이 그의 무례함을 덮쳤다
  - 혼란이 그의 대담함을 무너뜨렸다
  rationale: 본문은 단순한 기억 상실보다도 오만한 결연함이 무너지는 순간을 말하므로, ‘망각’의 어휘를 유지하면서도 그 기능을 ‘사라졌습니다’로 표현했습니다.
  doctrine_reference: 서사적 묘사; 교리적 쟁점 없음
