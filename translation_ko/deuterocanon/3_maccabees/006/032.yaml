base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/032.yaml
  text: And when they had ended their utterly mournful song of lamentation[a], they took up the song of their fathers, praising God, the savior of Israel and worker of wonders; and having cast off every cry of grief and wailing[b], they formed dances as a sign of peaceful rejoicing.
  footnotes:
  - marker: a
    text: Or 'their ancestral song.' The adjective πάτριον denotes what belongs to the fathers or ancestral tradition.
    reason: lexical_alternative
  - marker: b
    text: Or 'they organized choruses.' The Greek χοροὺς can refer to dancing groups or choruses; the context favors festive dancing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 통곡의 몹시 슬픈 노래를 마치자, 조상들의 노래를 다시 불러 하나님, 곧 이스라엘의 구원자이시며 기적을 행하시는 분을 찬양하였습니다. 그리고 모든 슬픔의 부르짖음과 곡성을 떨쳐 버리고, 평화로운 기쁨의 표시로 춤들을 이루었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘조상들의 전통의 노래’입니다. πάτριον은 조상에게 속한 것, 곧 전승된 것을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들은 합창들을 조직하였습니다.’ 그리스어 χοροὺς는 춤무리나 합창대를 가리킬 수 있으며, 문맥상 축제적 춤이 더 어울립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλήξαντες δὲ θρήνων πανόδυρτον μέλος
  english_pob_choice: when they had ended their utterly mournful song of lamentation
  chosen_korean: 통곡의 몹시 슬픈 노래를 마치자
  alternatives_korean:
  - 애곡의 노래를 끝내자
  - 지극히 슬픈 탄식의 노래를 마치자
  lexicon: LSJ
  rationale: θρήνων과 μέλος의 노래 이미지를 살리고, πανόδυρτον의 강한 비탄을 ‘몹시 슬픈’으로 옮겨 과도하게 약화하지 않았습니다.
- source_word: ᾠδὴν πάτριον
  english_pob_choice: the song of their fathers
  chosen_korean: 조상들의 노래
  alternatives_korean:
  - 선조들의 노래
  - 그들의 전통의 노래
  lexicon: LSJ
  rationale: πάτριον의 ‘조상/전승에 속한’ 뜻을 자연스럽게 살리되, 한국어에서 가장 바로 이해되는 표현으로 옮겼습니다.
- source_word: τερατοποιὸν
  english_pob_choice: worker of wonders
  chosen_korean: 기적을 행하시는 분
  alternatives_korean:
  - 이적을 행하시는 분
  - 경이로운 일을 하시는 분
  lexicon: LSJ
  rationale: τερατοποιὸν은 ‘놀라운 일/기적을 행하는 자’의 뜻이므로, 하나님을 가리키는 문맥에 맞게 동적이되 직접적인 표현으로 옮겼습니다.
- source_word: οἰμωγὴν δὲ πᾶσαν καὶ κωκυτὸν ἀπωσάμενοι
  english_pob_choice: having cast off every cry of grief and wailing
  chosen_korean: 모든 슬픔의 부르짖음과 곡성을 떨쳐 버리고
  alternatives_korean:
  - 모든 비탄의 외침과 울부짖음을 밀쳐 내고
  - 온갖 통곡과 곡성을 물리치고
  lexicon: LSJ
  rationale: οἰμωγή와 κωκυτός의 소리나는 애통을 각각 ‘부르짖음’과 ‘곡성’으로 살려, 단순한 감정보다 들리는 울음의 뉘앙스를 보존했습니다.
- source_word: χοροὺς συνίσταντο
  english_pob_choice: they formed dances
  chosen_korean: 춤들을 이루었습니다
  alternatives_korean:
  - 춤판을 만들었습니다
  - 춤의 무리를 이루었습니다
  lexicon: LSJ
  rationale: χοροὺς는 문맥상 의례적/축제적 춤의 무리로 이해되어, ‘춤들을 이루다’로 비교적 직역에 가깝게 옮겼습니다.
theological_decisions:
- issue: 하나님의 호칭을 설명하는 apposition의 처리
  chosen_reading: ‘하나님, 곧 이스라엘의 구원자이시며 기적을 행하시는 분’으로 한 문장 안에서 하나님께 직접 붙는 칭호로 처리했습니다.
  alternative_readings:
  - 이스라엘의 구원자와 기적을 행하시는 하나님
  - 이스라엘을 구원하시며 기적을 행하시는 하나님
  rationale: 그리스어는 τὸν Ἰσραὴλ σωτῆρα καὶ τερατοποιὸν θεόν으로 하나님을 설명하므로, 두 칭호가 모두 하나님께 속함을 드러내되 문장 흐름을 자연스럽게 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: 원문 우선, 칭호의 주어 귀속 유지'
