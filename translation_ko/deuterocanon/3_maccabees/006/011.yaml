theological_decisions:
- issue: τοῖς ματαίοις를 ‘우상들’로 좁힐지 여부
  chosen_reading: 본문의 직접 표현을 따라 더 일반적인 ‘허망한 것들’로 유지했습니다.
  alternative_readings:
  - 우상들
  - 헛된 신들
  rationale: 그리스어는 ‘허망한 것들’이라고만 말하며, ‘우상’은 가능한 함의이지만 본문 밖의 특정화를 더합니다. 원문 우선 원칙에 따라 넓은 의미를 보존했습니다.
  doctrine_reference: 원문 우선 번역 원칙
- issue: 직설적 조롱문과 기도문 사이의 어조
  chosen_reading: 간접 금지형과 청유형 기도로 처리했습니다.
  alternative_readings:
  - 직설 명령형
  - 저주적 선언형
  rationale: 이 구절은 하나님께 드리는 탄원 속에서 대적들의 조롱을 막아 달라는 형태이므로, 한국어에서도 기도문 어조를 유지하는 것이 적절합니다.
  doctrine_reference: 현대 한국어 성경문체 규범
