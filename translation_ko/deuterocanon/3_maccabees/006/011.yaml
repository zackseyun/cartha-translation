  yaml_path: translation/deuterocanon/3_maccabees/006/011.yaml
  text: Let not the empty-headed bless the empty things over the destruction of those beloved by you[a], saying[c][b], “Not even their God rescued them.”
  footnotes:
  - marker: a
    text: Or “vain things” or “idols.” The Greek says “the empty things,” likely with polemical force.
    reason: lexical_alternative
  - marker: b
    text: Or “the vain-minded.” The Greek deliberately pairs this with “empty things” as a wordplay.
    reason: lexical_alternative
  - marker: c
    text: Or “delivered them.”
    reason: lexical_alternative
translation:
  language: ko
  text: 허망한 생각을 품은 자들이[a] 허망한 것들[b]을 찬양하며 주님께서 사랑하시는 이들의 멸망을 두고 “그들의 하나님도 그들을 구해 내지 못했다”[c]라고 말하지 못하게 하소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “허망한 자들”. 그리스어는 이 표현을 “허망한 것들”과 어근을 반복하여 짝지어 씁니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “헛된 것들”, “우상들”. 그리스어는 문자 그대로 “허망한 것들”이라고 말하며, 조롱적 뉘앙스를 띱니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “그들을 건져 내지 못했다”.
    reason: lexical_alternative
