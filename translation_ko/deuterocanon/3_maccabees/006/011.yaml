base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/011.yaml
  text: Let not the empty-headed bless the empty things over the destruction of those beloved by you[a], saying[c][b], “Not even their God rescued them.”
  footnotes:
  - marker: a
    text: Or “vain things” or “idols.” The Greek says “the empty things,” likely with polemical force.
    reason: lexical_alternative
  - marker: b
    text: Or “the vain-minded.” The Greek deliberately pairs this with “empty things” as a wordplay.
    reason: lexical_alternative
  - marker: c
    text: Or “delivered them.”
    reason: lexical_alternative
translation:
  language: ko
  text: 허망한 것들을 향해 허망한 생각을 품은 자들이 주님의 사랑받는 이들의 멸망을 두고 기뻐하지 못하게 하시고, “그들의 하나님도 그들을 구해 내지 못했다” 하고 말하지 못하게 하소서.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “헛된 것들”, “우상들”. 그리스어는 문자 그대로 “허망한 것들”이라고 말하며, 조롱적 뉘앙스를 띱니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “허망한 자들”. 그리스어는 이것을 “허망한 것들”과 말장난처럼 짝지어 씁니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “그들을 건져 내지 못했다”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ... εὐλογησάτωσαν
  english_pob_choice: Let not ... bless
  chosen_korean: 기뻐하지 못하게 하시고
  alternatives_korean:
  - 찬양하지 못하게 하시고
  - 복을 빌지 못하게 하시고
  lexicon: LSJ
  rationale: 3인칭 금지형을 한국어 기도문 맥락에 맞게 간접 금지로 옮겼습니다. 여기서는 ‘복 주다’의 직역보다 문맥상 조롱 섞인 축하/찬미의 억제를 드러내는 표현이 더 자연스럽습니다.
- source_word: τοῖς ματαίοις
  english_pob_choice: the empty things
  chosen_korean: 허망한 것들
  alternatives_korean:
  - 헛된 것들
  - 공허한 것들
  - 우상들
  lexicon: LSJ
  rationale: μάταιοις의 직접적 반복성과 폄하적 뉘앙스를 살리되, 본문이 명시하지 않은 ‘우상들’로 한정하지 않았습니다.
- source_word: οἱ ματαιόφρονες
  english_pob_choice: the empty-headed
  chosen_korean: 허망한 생각을 품은 자들
  alternatives_korean:
  - 허망한 자들
  - 헛된 마음을 가진 자들
  - 허무한 생각을 지닌 자들
  lexicon: LSJ
  rationale: 복합어의 핵심인 ‘헛된/허망한 생각’과 사람을 지칭하는 효과를 함께 살렸습니다. 영어 POB의 말장난 대응을 한국어에서도 유지하려고 했습니다.
- source_word: ἐπὶ τῇ ... ἀπωλείᾳ
  english_pob_choice: over the destruction
  chosen_korean: 멸망을 두고
  alternatives_korean:
  - 멸망 위에서
  - 파멸을 근거로
  - 멸망 때문에
  lexicon: LSJ
  rationale: ἐπί + 여격의 ‘~을 두고/~을 계기로’라는 상황적 의미를 간결하게 반영했습니다.
- source_word: Οὐδὲ ὁ θεὸς αὐτῶν ἐρύσατο αὐτούς
  english_pob_choice: Not even their God rescued them
  chosen_korean: 그들의 하나님도 그들을 구해 내지 못했다
  alternatives_korean:
  - 그들의 하나님도 그들을 구원하지 못했다
  - 그들의 하나님도 그들을 건져 내지 못했다
  lexicon: LSJ
  rationale: ἐρύσατο를 ‘구해 내다’로 옮겨 구출의 동작성을 살렸습니다. 영어 POB의 ‘rescued’와 같은 현대적 전달력을 유지합니다.
theological_decisions:
- issue: τοῖς ματαίοις를 ‘우상들’로 좁힐지 여부
  chosen_reading: 본문의 직접 표현을 따라 더 일반적인 ‘허망한 것들’로 유지했습니다.
  alternative_readings:
  - 우상들
  - 헛된 신들
  rationale: 그리스어는 ‘허망한 것들’이라고만 말하며, ‘우상’은 가능한 함의이지만 본문 밖의 특정화를 더합니다. 원문 우선 원칙에 따라 넓은 의미를 보존했습니다.
  doctrine_reference: 원문 우선 번역 원칙
- issue: 직설적 조롱문과 기도문 사이의 어조
  chosen_reading: 간접 금지형과 청유형 기도로 처리했습니다.
  alternative_readings:
  - 직설 명령형
  - 저주적 선언형
  rationale: 이 구절은 하나님께 드리는 탄원 속에서 대적들의 조롱을 막아 달라는 형태이므로, 한국어에서도 기도문 어조를 유지하는 것이 적절합니다.
  doctrine_reference: 현대 한국어 성경문체 규범
