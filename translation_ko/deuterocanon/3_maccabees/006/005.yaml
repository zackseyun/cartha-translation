base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/005.yaml
  text: You shattered Sennacherib[a], the mighty king of the Assyrians, who had become arrogant because of his innumerable forces, who had already brought the whole land under his hand by the spear, and who had exalted himself against your holy city, speaking grievous things with boasting and insolence—you, Master[c][b], making your power plain to many nations.
  footnotes:
  - marker: a
    text: Or 'harsh' or 'terrible' king of the Assyrians'; the Greek adjective can denote something weighty, grievous, or oppressive.
    reason: lexical_alternative
  - marker: b
    text: Literally 'had already taken the whole land under his hand by the spear.'
    reason: lexical_alternative
  - marker: c
    text: The address here is 'Master' (Greek despotēs), not the more common 'Lord' (kyrios).
    reason: lexical_alternative
translation:
  language: ko
  text: 주권자여[c], 주께서는 수없이 많은 군대로 교만해진 앗시리아의 가혹한 왕 산헤립을[a], 이미 창으로 온 땅을 자기 손아래에 굴복시키고[b] 주의 거룩한 도성에 맞서 스스로를 높이며 허세와 오만으로 거친 말을 하던 그를 꺾으셔서, 많은 민족에게 주의 권능을 분명히 드러내셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: βάρυς는 여기서 ‘가혹한’ 외에 ‘무거운’, ‘압제적인’, 또는 ‘두려운 위세를 지닌’이라는 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그가 이미 창으로 온 땅을 자기 손 아래에 두었다’입니다.
    reason: lexical_alternative
  - marker: c
    text: δέσποτα는 일반적인 κύριος와 달리 절대적 소유권과 권위를 강조하는 호칭이며, 여기서는 ‘주권자여’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: βαρὺν
  english_pob_choice: oppressive
  chosen_korean: 무거운
  alternatives_korean:
  - 압제적인
  - 가혹한
  - 강력한
  lexicon: LSJ
  rationale: βάρυς는 여기서 왕의 성격을 직접 규정하기보다 위압적·가중한 뉘앙스를 지니므로, 본문이 지닌 중량감과 불편함을 살리면서도 자연스러운 한국어인 ‘무거운’으로 옮겼습니다.
- source_word: δόρατι τὴν πᾶσαν ὑποχείριον ἤδη λαβόντα γῆν
  english_pob_choice: had already brought the whole land under his hand by the spear
  chosen_korean: 이미 창으로 온 땅을 자기 수중에 넣고
  alternatives_korean:
  - 이미 창으로 온 땅을 굴복시켜
  - 이미 창으로 온 땅을 자기 손 아래 두고
  - 이미 창으로 온 땅을 정복하고
  lexicon: LSJ
  rationale: ἔχει/λαμβάνω + ὑποχείριον의 관용적 이미지인 ‘손 아래’는 한국어에서 ‘수중에 넣다’가 가장 비슷하게 살려 주며, ‘창으로’는 무력 정복의 구체성을 유지합니다.
- source_word: μετεωρισθέντα ἐπὶ τὴν ἁγίαν σου πόλιν
  english_pob_choice: had exalted himself against your holy city
  chosen_korean: 주의 거룩한 도성을 향해 높아져
  alternatives_korean:
  - 주의 거룩한 도성에 맞서 교만해져
  - 주의 거룩한 도성 위에 높아져
  - 주의 거룩한 도성을 향해 교만하게 올라서
  lexicon: LSJ
  rationale: μετεωρίζω는 단순한 ‘올라가다’보다 교만하게 치켜세워진 상태를 함의하므로, ‘높아져’로 옮기되 방향어 ‘향해’를 보태 공격의 표적성을 드러냈습니다.
- source_word: βαρέα λαλοῦντα κόμπῳ καὶ θράσει
  english_pob_choice: speaking grievous things with boasting and insolence
  chosen_korean: 거만과 오만으로 거친 말을 하던
  alternatives_korean:
  - 자랑과 무례로 무거운 말을 하던
  - 허세와 뻔뻔함으로 심한 말을 하던
  - 거만과 대담함으로 심한 말을 하던
  lexicon: LSJ
  rationale: βαρέα는 말의 내용이 무겁고 거슬리는 성격을 가리키므로 ‘거친 말’로 풀고, κόμπος/θράσος는 행위자의 태도로서 ‘거만과 오만’으로 압축해 자연스럽게 표현했습니다.
- source_word: δέσποτα
  english_pob_choice: Master
  chosen_korean: 주권자여
  alternatives_korean:
  - 주인이여
  - 주여
  - 통치자여
  lexicon: LSJ
  rationale: δέσποτα는 κύριος와 달리 절대적 주권을 강조하는 호칭이므로, 예배적 직역보다 ‘주권자여’가 구별성을 더 잘 보존합니다.
theological_decisions:
- issue: δέσποτα의 호칭 구별
  chosen_reading: 주권자여
  alternative_readings:
  - 주여
  - 주인이여
  - 통치자여
  rationale: 본문은 κύριος가 아니라 δέσποτα를 사용하므로, 일반적인 ‘주님’으로 평준화하지 않고 권세의 절대성을 드러내는 호칭을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; preserve lexical distinctions unless there is a documented carve-out.'
- issue: 주의 거룩한 도성에 대한 공격의 방향성
  chosen_reading: ‘향해’로 표적성을 드러내되, 본문에 없는 역사적 확장을 덧붙이지 않음
  alternative_readings:
  - ‘대항하여’로 보다 직접적으로 번역
  - 예루살렘 멸망의 서사를 보충
  rationale: 그리스어는 도시를 향한 교만한 상승과 위협을 말할 뿐이므로, 공격의 방향은 살리되 본문 밖 정보를 추가하지 않았습니다.
