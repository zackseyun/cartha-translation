  text: But let the nations cower today before your invincible power[a], O honored one, having power for the salvation of the race of Jacob.
  footnotes:
  - marker: a
    text: Or 'the people of Jacob' for 'the race of Jacob'; the Greek γένος can denote lineage, family line, or people descended from a common ancestor.
    reason: lexical_alternative
translation:
  language: ko
  text: 오늘 민족들이 당신의 무적의 권능 앞에서 두려워 움츠러들게 하십시오, 야곱의 후손[a]을 구원하실 능력을 지니신 존귀하신 분이시여.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야곱의 백성’으로 옮길 수 있습니다. 그리스어 γένος는 혈통, 가계, 또는 공통 조상에게서 난 사람들의 집단을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πτηξάτω
  english_pob_choice: let ... cower
  chosen_korean: 떨게 하십시오
  alternatives_korean:
  - 두려워하며 물러나게 하십시오
  - 주눅 들게 하십시오
  lexicon: LSJ
  rationale: Aorist imperative of fear-driven recoil를 살려, 단순 감정이 아니라 권능 앞에서 위축되고 물러나는 반응을 한국어 명령형으로 옮겼습니다.
- source_word: ἔθνη
  english_pob_choice: nations
  chosen_korean: 민족들
  alternatives_korean:
  - 나라들
  - 이방인들
  lexicon: LSJ
  rationale: 이 문맥은 유대-이방 대조보다 주변 집단 전체를 가리키므로, 교회적 용례가 강한 '이방인들'보다 중립적인 '민족들'이 더 가깝습니다.
- source_word: ἔντιμε
  english_pob_choice: O honored one
  chosen_korean: 존귀하신 분이시여
  alternatives_korean:
  - 존중받으시는 분이시여
  - 영예로운 분이시여
  lexicon: LSJ
  rationale: 하나님께 드리는 직접 호칭이지만 본문의 특이한 형용사적 호칭을 유지하기 위해, 통상적 칭호로 바꾸지 않고 존칭형으로 옮겼습니다.
- source_word: Ἰακὼβ γένους
  english_pob_choice: the race of Jacob
  chosen_korean: 야곱의 후손
  alternatives_korean:
  - 야곱의 족속
  - 야곱의 사람들
  lexicon: LSJ
  rationale: γένος의 혈통·가계·출생 집단 의미를 살리면서도 현대 한국어에서 자연스러운 집단 명사로 옮겼습니다.
theological_decisions:
- issue: ἔντιμε를 통상적 신적 호칭으로 평준화하지 않음
  chosen_reading: 직접 호칭의 특이성을 살려 '존귀하신 분이시여'로 옮겼습니다.
  alternative_readings:
  - 주님
  - 영광의 주여
  - 존귀하신 주님
  rationale: 본문은 일반적인 '주' 호칭이 아니라 존칭 형용사를 직접 부르는 형태이므로, 신학적으로 익숙한 호칭으로 대체하지 않고 어조의 낯섦을 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 6
