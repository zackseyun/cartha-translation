  text: But let the nations cower today before your invincible power[a], O honored one, having power for the salvation of the race of Jacob.
  footnotes:
  - marker: a
    text: Or 'the people of Jacob' for 'the race of Jacob'; the Greek γένος can denote lineage, family line, or people descended from a common ancestor.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 오늘, 존귀하신 분이시여, 야곱의 후손을 구원하실 능력을 가지셨으니, 민족들이 당신의 무적의 권능 앞에서 떨게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '야곱의 백성'으로도 옮길 수 있습니다. 그리스어 γένος는 혈통, 가계, 또는 공통 조상에게서 난 사람들을 가리킬 수 있습니다.
    reason: lexical_alternative
