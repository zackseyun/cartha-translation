base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/009.yaml
  text: And now[a], hater of insolence, abundant in mercy, judge of all, quickly appear to the holy ones of Israel’s race, who are being mistreated by the abominable[c][b], lawless nations.
  footnotes:
  - marker: a
    text: Or 'show yourself' for 'appear,' emphasizing visible intervention rather than mere arrival.
    reason: lexical_alternative
  - marker: b
    text: Or 'who are being outrageously abused'; the Greek verb can denote insolent, humiliating mistreatment, not only general suffering.
    reason: lexical_alternative
  - marker: c
    text: '''Nations'' here refers to non-Israelite peoples; ''Gentiles'' is a possible contextual alternative.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이제, 폭력을 미워하시는 분, 긍휼이 풍성하신 분, 모든 것의 심판자여, 아바람 없이 속히 나타나셔서 이스라엘 족속의 거룩한 이들을, 가증스럽고 불법한 민족들에게서 모욕당하는 이들을 보아 주십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나타나셔서’는 단순한 도착보다 구원적 개입이 드러나는 가시적 현현을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘모욕당하는’은 단순한 일반적 고난보다, 수치와 능멸을 동반한 학대의 뉘앙스를 살립니다.
    reason: lexical_alternative
  - marker: c
    text: ‘민족들’은 이스라엘이 아닌 이방 민족들을 가리키는 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: μισόβρι
  english_pob_choice: hater of insolence
  chosen_korean: 폭력을 미워하시는 분
  alternatives_korean:
  - 오만을 미워하시는 분
  - 횡포를 미워하시는 분
  - 무례를 미워하시는 분
  lexicon: LSJ
  rationale: 희귀한 호격 복합어로서 ‘insolence/outage/arrogance’ 계열의 강한 부정성을 지니므로, 문맥상 압제적 폭력성을 드러내는 ‘폭력’을 택해 강한 어조를 살렸습니다.
- source_word: πολυέλεε
  english_pob_choice: abundant in mercy
  chosen_korean: 긍휼이 풍성하신 분
  alternatives_korean:
  - 자비가 풍성하신 분
  - 긍휼이 많은 분
  - 많은 긍휼을 지니신 분
  lexicon: LSJ
  rationale: ‘많다’보다 ‘풍성하다’가 풍부함을 더 자연스럽게 살리며, 호칭형으로는 ‘긍휼이 풍성하신 분’이 가장 간결합니다.
- source_word: τῶν ὅλων δίκαστα
  english_pob_choice: judge of all
  chosen_korean: 모든 것의 심판자여
  alternatives_korean:
  - 만물의 심판자여
  - 모든 것들을 심판하시는 분이여
  - 온 세상의 심판자여
  lexicon: LSJ
  rationale: ‘judge of all’의 보편성을 살리되, 기도문 호격에 맞게 ‘심판자여’로 옮겼습니다. ‘모든 것’은 전체적 범위를 직관적으로 드러냅니다.
- source_word: ἐπιφάνηθι
  english_pob_choice: appear
  chosen_korean: 나타나셔서
  alternatives_korean:
  - 드러나셔서
  - 보여 주셔서
  - 현현해 주셔서
  lexicon: LSJ
  rationale: 기도문에서 단순 도착이 아니라 구원적 개입의 가시적 나타남을 청하는 동사이므로, 현대 한국어에서 자연스러운 ‘나타나셔서’를 택했습니다.
- source_word: τοῖς ἁγίοις
  english_pob_choice: the holy ones
  chosen_korean: 거룩한 이들
  alternatives_korean:
  - 성도들
  - 거룩한 사람들
  - 거룩한 무리
  lexicon: LSJ
  rationale: 이스라엘 안에서 하나님께 속한 자들을 가리키는 표현이므로, 후대 교회 용례를 덜 불러오는 ‘거룩한 이들’로 옮겼습니다.
- source_word: Ἰσραὴλ γένους
  english_pob_choice: of Israel’s race
  chosen_korean: 이스라엘 족속의
  alternatives_korean:
  - 이스라엘의 혈통의
  - 이스라엘의 종족의
  - 이스라엘의 백성의
  lexicon: LSJ
  rationale: γένος의 혈연·족속 의미를 살리기 위해 ‘족속’으로 옮겼습니다. 이는 단순한 종교집단보다 민족적 소속을 더 분명히 드러냅니다.
- source_word: ὑβριζομένοις
  english_pob_choice: who are being mistreated
  chosen_korean: 모욕당하는 이들을
  alternatives_korean:
  - 학대받는 이들을
  - 능멸당하는 이들을
  - 잔혹하게 다루어지는 이들을
  lexicon: LSJ
  rationale: 동사는 단순한 ‘괴롭힘’보다 모욕·능멸·비난이 섞인 폭압적 처우를 뜻할 수 있으므로, 문맥의 강도를 살려 ‘모욕당하는’으로 옮겼습니다.
theological_decisions:
- issue: 기도문 호격과 간청의 정서
  chosen_reading: ‘…여, …주십시오’로 직설적 간청을 유지했습니다.
  alternative_readings:
  - 존칭형 서술로 완화하기
  - ‘보여 주십시오’처럼 더 설명적으로 풀기
  rationale: 원문은 하나님께 대한 긴급한 청원으로 이루어져 있어, 한국어에서도 기도체의 직접성을 유지하는 것이 화자의 절박함을 더 정확히 반영합니다.
  doctrine_reference: Translation philosophy 1, 6
- issue: 이스라엘 안의 거룩한 자들에 대한 민족적 지시
  chosen_reading: ‘이스라엘 족속의 거룩한 이들’로 옮겼습니다.
  alternative_readings:
  - 성도들
  - 이스라엘 백성
  rationale: 본문은 특정한 언약 공동체를 가리키지만, 후대 교회적 호칭으로 일반화하기보다 원문의 민족·언약적 범위를 보존했습니다.
  doctrine_reference: Translation philosophy 1, 5
