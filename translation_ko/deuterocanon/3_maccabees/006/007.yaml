  text: You brought Daniel up into the light unharmed[b][a], when he had been thrown to the lions on the ground as food for the beasts through the slanders of envy.
  footnotes:
  - marker: a
    text: Or 'through accusations born of envy.' The Greek phrase combines 'slanders/accusations' with 'envy.'
    reason: lexical_alternative
  - marker: b
    text: The Greek includes a difficult phrase, literally 'on the ground.' The wording is retained rather than harmonized to the Daniel narrative.
    reason: textual_variant
translation:
  language: ko
  text: 당신은 시기에서 나온 중상으로 땅에 던져져 짐승들의 먹이가 된 다니엘을, 당신이 상처 없이 빛으로 끌어올리셨습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시기에서 비롯된 고발로.’ 그리스어 표현은 ‘중상/고발’과 ‘시기’를 함께 묶습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 직역하면 ‘땅에’라는 다루기 어려운 구절을 포함합니다. 다니엘 이야기와 조화시키지 않고 그대로 살렸습니다.
    reason: source_note
lexical_decisions:
- source_word: διαβολαῖς φθόνου
  english_pob_choice: through the slanders of envy
  chosen_korean: 시기에서 나온 중상으로
  alternatives_korean:
