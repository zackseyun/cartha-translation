translation:
  language: ko
  text: 주님께서는 시기에서 나온 중상으로[a] 사자들에게 땅에 던져져[b] 짐승들의 먹이가 되도록 내맡겨진 다니엘을 상처 하나 없이 빛으로 끌어올리셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시기에서 비롯된 고발로.’ 그리스어 표현은 ‘중상/고발’과 ‘시기’를 함께 묶습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 직역하면 ‘땅에’라는 다루기 어려운 표현을 포함합니다. 다니엘 이야기와 조화시키지 않고 이 표현을 그대로 살렸습니다.
    reason: source_note
lexical_decisions:
- source_word: διαβολαῖς φθόνου
  english_pob_choice: through the slanders of envy
  chosen_korean: 시기에서 나온 중상으로
  alternatives_korean:
  - 시기의 중상으로
  - 시기에서 비롯된 비방으로
  - 질투에서 나온 거짓 고발로
  lexicon: LSJ
  rationale: διαβολαῖς의 ‘중상/비방’ 의미와 φθόνου의 ‘시기’ 관계를 함께 살려, 원문의 인과·출처 관계를 자연스러운 한국어로 압축했습니다.
- source_word: λέουσι
