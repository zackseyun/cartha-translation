  - 시기에서 비롯된 비방으로
  - 질투에서 나온 거짓 고발로
  lexicon: LSJ
  rationale: διαβολαῖς의 ‘중상/비방’ 의미와 φθόνου의 ‘시기’ 관계를 함께 살려, 원문의 인과·출처 관계를 자연스러운 한국어로 압축했습니다.
- source_word: λέουσι
  english_pob_choice: to the lions
  chosen_korean: 사자들에게
  alternatives_korean:
  - 사자들 가운데
  - 사자들 속으로
  lexicon: LSJ
  rationale: 여격 복수는 대상을 가리키므로 ‘사자들에게’가 가장 सीधे하며, 다니엘 구출 암시도 잘 드러납니다.
- source_word: κατὰ γῆς ῥιφέντα
  english_pob_choice: when he had been thrown ... on the ground
  chosen_korean: 땅에 던져져
  alternatives_korean:
  - 땅바닥에 던져져
  - 땅으로 내던져져
  lexicon: LSJ
  rationale: 문맥상 낯선 표현이지만, POB의 영어처럼 본문이 가진 어색함을 과도하게 매끈하게 만들지 않고 최소한으로 반영했습니다.
- source_word: θηρσὶ βορὰν
  english_pob_choice: as food for the beasts
  chosen_korean: 짐승들의 먹이가 된
  alternatives_korean:
  - 짐승들의 먹이로
  - 들짐승의 먹이로
  lexicon: LSJ
  rationale: βορὰν은 ‘먹이’이며 θηρσί는 ‘짐승들’이므로, 희생·파멸의 의도를 드러내는 한국어 표현으로 옮겼습니다.
- source_word: εἰς φῶς ἀνήγαγες ἀσινῆ
  english_pob_choice: brought ... up into the light unharmed
  chosen_korean: 상처 없이 빛으로 끌어올리셨습니다
  alternatives_korean:
  - 상처 없이 빛 가운데로 이끄셨습니다
  - 무사히 빛으로 데려올리셨습니다
  lexicon: LSJ
  rationale: ἀνήγαγες의 ‘끌어올리다/올려 데려오다’와 εἰς φῶς의 ‘빛으로’를 함께 보존하면서, ἀσινῆ는 ‘상처 없이’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 다니엘 구출에 대한 암시를 어디까지 드러낼지
  chosen_reading: 다니엘의 이름과 사자, 빛으로의 인도를 그대로 살리되, ‘굴’ 같은 본문에 없는 세부는 덧붙이지 않았습니다.
  alternative_readings:
  - ‘사자의 굴’로 구체화하기
  - 다니엘서의 익숙한 표현으로 완전히 평준화하기
  rationale: 본문은 다니엘의 구출을 분명히 가리키지만, 실제 그리스어는 굴(den)을 명시하지 않으므로 원문이 말하는 만큼만 말합니다.
  doctrine_reference: 원문 우선 번역 원칙; 다니엘 전승의 암시를 보존하되 서사적 보충은 하지 않음
- issue: κατὰ γῆς의 어색한 전승 처리
  chosen_reading: ‘땅에’로 비교적 직역해 본문의 거친 결을 유지했습니다.
  alternative_readings:
  - 문맥에 맞춰 생략하기
  - ‘구덩이에’로 조화시키기
  rationale: POB 영어가 이 구절의 난점을 보존하듯, 한국어도 전승상의 어색함을 숨기지 않고 전달하는 쪽을 택했습니다.
  doctrine_reference: '번역 철학: 확인 가능한 본문 형태를 정직하게 반영'
