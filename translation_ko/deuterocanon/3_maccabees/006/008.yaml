  lexicon: LSJ
  rationale: ἀναδείκνυμι의 ‘드러내다, 드러내 보이다’ 의미를 따라, 구출과 공개적 현시를 함께 담아냈습니다.
theological_decisions:
- issue: 요나의 구출 표현에서 공개성과 보존을 어떻게 함께 살릴지
  chosen_reading: ‘온전히 해치지 않은 채 그의 모든 사람들 앞에 드러내셨습니다’로 옮겨, 무사한 구출과 공개적 현시를 함께 표현했습니다.
  alternative_readings:
  - ‘무사히 모든 사람들 앞에 내보내셨습니다’
  - ‘상처 없이 그의 사람들 모두에게 보이셨습니다’
  rationale: ἀναδείξας는 단순한 이동보다 ‘드러냄/현시’의 성격이 있고, ἀφθόνῳ/ἀσήμαντον의 결합은 해치지 않은 상태를 강조하므로 두 요소를 함께 반영했습니다.
  doctrine_reference: Translation philosophy §1, §5
