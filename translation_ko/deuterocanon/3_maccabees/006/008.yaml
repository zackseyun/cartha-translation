  - 그의 친족들 앞에
  lexicon: LSJ
  rationale: οἰκεῖοι는 가족에만 한정되지 않는 ‘자기 사람들’을 가리킬 수 있으므로, 과도하게 좁히지 않으면서 공개적 드러남을 함께 살렸습니다.
