translation:
  language: ko
  text: 또 심연에서 자란 바다 괴물[a]의 배 속에서 쇠약해지던 요나를 아무런 상처도 없이[b] 그와 가까운 모든 이들에게 아낌없이 드러내 보이셨습니다, 아버지여.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: κῆτος는 ‘바다 괴물’, ‘큰 물고기’, ‘고래’까지 아우를 수 있는 말로, 여기서는 특정 종보다 큰 해양 존재를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ἀσήμαντον은 문자적으로는 ‘표가 없는’에 가깝지만, 문맥상 ‘상처 없이, 해를 입지 않은’이라는 뜻입니다.
    reason: lexical_alternative
