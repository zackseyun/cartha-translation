translation:
  language: ko
  text: 그리고 배에서 자라난 바다 괴물의 배 속에서 쇠약해지던 요나를, 아버지여, 온전히 해치지 않은 채 그의 모든 사람들 앞에 드러내셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: κῆτος는 ‘바다 괴물’, ‘큰 물고기’, ‘고래’까지 아우를 수 있는 말로, 여기서는 특정 종보다 큰 해양 존재를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ἀσήμαντον은 문자적으로는 ‘표가 없는’에 가깝지만, 문맥상 ‘해치지 않은, 무사한’ 뜻입니다.
    reason: lexical_alternative
