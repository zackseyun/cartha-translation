review_pass:
  verdict: revise
  source_fidelity: 원문에는 ‘주님’이라는 명시적 호칭이 없으므로 삽입하지 않는 편이 안전합니다. 또한 ἀλόγιστον은 ‘부당하게’보다 ‘이유 없이/무분별하게’처럼 무분별하고 불합리한 가해의 뜻을 드러내야 합니다. ἐν ἐπιβούλων τρόπῳ는 음모자들의 방식이라는 모호한 표현으로 유지하되, ‘말입니다’는 원문에 없는 담화적 덧붙임입니다.
  naturalness: 현 번역은 전반적으로 이해할 수 있으나, ‘생명에서 … 끌려 나가고’와 문장 끝의 ‘말입니다’는 기도문의 현대 표준어 합쇼체로 다소 부자연스럽습니다. 호격들을 하나의 일관된 호격 구조로 정리하고 ‘삶에서 내쳐지고’로 옮기면 더 자연스럽습니다.
  terminology: ἀλκή와 δυναστεία의 구별에는 ‘힘과 권세’가 자연스럽고, ἀνόμων은 ‘무법한 자들’이 현대어에서 명확합니다. ἀπάναυε와 αἰώνιε는 각각 독립된 신적 호칭으로 보존했습니다.
  issues:
  - severity: medium
    issue: 원문에 없는 ‘주님’이 삽입되었습니다.
    rationale: 그리스어는 앞 문맥의 대상에게 ‘당신’이라고 직접 부르며, 이 절에서 κύριε나 θεέ를 쓰지 않습니다. 한국어 호칭을 위해 ‘주님’을 보태는 것은 불필요한 명시화입니다.
  - severity: medium
    issue: ἀλόγιστον을 ‘부당하게’로 옮겨 의미가 약화되었습니다.
    rationale: ‘부당하게’는 불의함을 나타낼 수 있으나, ἀλόγιστον의 무분별함·불합리함·이유 없음의 의미를 충분히 드러내지 못합니다.
  - severity: medium
    issue: ‘음모를 꾸미는 자들처럼 말입니다’가 원문의 방식 표현을 비유적 비교와 담화 종결로 바꿉니다.
    rationale: ἐν ἐπιβούλων τρόπῳ는 ‘음모자들의 방식으로’라는 표현을 유지하는 것이 더 가깝고, ‘말입니다’는 원문에 없습니다.
  - severity: low
    issue: ‘통치’와 ‘생명에서 … 끌려 나가고’는 문맥상 다소 어색합니다.
    rationale: ‘권세’는 δυναστεία의 지배 권능을 더 자연스럽게 표현하며, ‘삶에서 내쳐지고’는 μεθισταμένους의 제거 이미지를 유지하면서 한국어 문장에 더 잘 맞습니다.
  revised_text: 그러나 온갖 힘과 권세를 가지신 분, 쉬지 않으시는 분, 영원하신 분이시여, 이제 살펴보소서. 무법한 자들의 오만한 폭력으로 말미암아, 이유 없이 삶에서 내쳐지고 있는 저희를 불쌍히 여기소서, 음모자들의 방식으로.
  revised_footnotes:
  - marker: a
    text: ‘쉬지 않으시는 분’은 ἀπάναυε의 번역입니다. ‘지치지 않으시는 분’ 또는 ‘끊임없으신 분’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
