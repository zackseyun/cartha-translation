base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/012.yaml
  text: But you[a], who possess all might and dominion, unceasing One, eternal One, look now; have mercy on us[c][b], who through the insolent violence of lawless men are being irrationally removed from life in the manner of plotters.
  footnotes:
  - marker: a
    text: Or 'untiring One' for ἀπάναυε.
    reason: lexical_alternative
  - marker: b
    text: Literally 'being removed from life'; the sense in context is being put to death.
    reason: lexical_alternative
  - marker: c
    text: Or 'like conspirators' for 'in the manner of plotters.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 주님, 온갖 힘과 통치를 가지신 분이시여, 멈추지 않으시는 분, 영원하신 분이시여, 이제 살펴보소서. 법 없는 자들의 오만한 폭력으로 인해, 생명에서 부당하게 끌려 나가고 있는 저희를 불쌍히 여기소서 — 음모를 꾸미는 자들처럼 말입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘멈추지 않으시는 분’은 ἀπάναυε의 뜻을 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘생명에서 부당하게 끌려 나가고 있는’은 문자적으로는 ‘삶에서 옮겨지고 있는’에 가깝지만, 문맥상 죽임을 당하는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘음모를 꾸미는 자들처럼’은 ‘음모자들의 방식으로’라는 뜻을 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ ὁ πᾶσαν ἀλκὴν καὶ δυναστείαν ἔχων
  english_pob_choice: you, who possess all might and dominion
  chosen_korean: 온갖 힘과 통치를 가지신 분이시여
  alternatives_korean:
  - 온갖 능력과 권세를 가지신 분이시여
  - 모든 힘과 주권을 가지신 분이시여
  lexicon: LSJ
  rationale: ἀλκήν은 단순한 능력보다 전투적·실질적 힘의 뉘앙스가 있어 ‘힘’으로, δυναστείαν은 지배 권위를 가리켜 ‘통치’로 옮겨 둘을 구별했습니다.
- source_word: ἀπάναυε, αἰώνιε
  english_pob_choice: unceasing One, eternal One
  chosen_korean: 멈추지 않으시는 분, 영원하신 분이시여
  alternatives_korean:
  - 쉬지 않으시는 분, 영원하신 분이시여
  - 지치지 않으시는 분, 영원하신 분이시여
  lexicon: LSJ
  rationale: 두 형용사를 하나님께 대한 직접 호칭으로 보존하되, 한국어에서는 자연스러운 존칭 종결을 써서 두 겹의 호칭임을 살렸습니다.
- source_word: ἐπίδε
  english_pob_choice: look now
  chosen_korean: 이제 살펴보소서
  alternatives_korean:
  - 이제 보소서
  - 이제 돌보소서
  - 지금 주목하소서
  lexicon: LSJ
  rationale: 문맥상 단순 시선이 아니라 구원하시는 시선의 요청이므로, 간결한 명령형 ‘살펴보소서’로 옮겼습니다.
- source_word: καθʼ ὕβριν ἀνόμων
  english_pob_choice: through the insolent violence of lawless men
  chosen_korean: 법 없는 자들의 오만한 폭력으로 인해
  alternatives_korean:
  - 무법자들의 오만한 폭력으로 인해
  - 불법한 자들의 모욕적 폭력으로 인해
  lexicon: LSJ
  rationale: ὕβρις는 단순한 교만이 아니라 모욕적이고 폭력적인 가해를 포함하므로 ‘오만한 폭력’으로, ἀνόμων은 구체적 가해 주체를 가리켜 ‘법 없는 자들’로 옮겼습니다.
- source_word: ἐκ τοῦ ζῆν μεθισταμένους
  english_pob_choice: being removed from life
  chosen_korean: 생명에서 부당하게 끌려 나가고 있는
  alternatives_korean:
  - 생명에서 옮겨지고 있는
  - 생명에서 죽임을 당하고 있는
  - 살아 있음에서 떠밀려 나가고 있는
  lexicon: LSJ
  rationale: 직역하면 ‘삶에서 옮겨짐/제거됨’이지만 문맥상 사형 위협을 가리키므로, POB의 절제된 방식에 맞게 ‘부당하게 끌려 나가고 있는’으로 풀었습니다.
- source_word: ἐν ἐπιβούλων τρόπῳ
  english_pob_choice: in the manner of plotters
  chosen_korean: 음모를 꾸미는 자들처럼 말입니다
  alternatives_korean:
  - 음모자들의 방식으로 말입니다
  - 공모자들처럼 말입니다
  - 음모를 꾸미는 자들의 방식으로 말입니다
  lexicon: LSJ
  rationale: ἐπίβουλος는 ‘음모를 꾸미는 자’의 뜻이므로, 한국어에서는 비유 표현을 분명히 드러내되 원문의 모호성을 유지해 ‘처럼’으로 처리했습니다.
theological_decisions:
- issue: 두 개의 호격 표현 ἀπάναυε와 αἰώνιε의 처리
  chosen_reading: 둘 다 하나님께 드리는 직접 호칭으로 유지하고, 한국어에서도 나란한 호격으로 표현했습니다.
  alternative_readings:
  - 하나의 결합된 수식구로 묶기
  - 하나를 부사적으로 처리하기
  rationale: 본문은 두 호격을 연속 배치하여 기도의 장중함을 형성하므로, 이를 합쳐 버리면 원문의 수사적 긴장이 약해집니다.
  doctrine_reference: Translation philosophy §§1, 6
- issue: ἐκ τοῦ ζῆν μεθισταμένους의 의미
  chosen_reading: 단순한 이동이 아니라 생명에서의 제거, 곧 죽음의 위협 아래 놓인 상태로 이해했습니다.
  alternative_readings:
  - 삶의 방식에서 옮겨짐
  - 사회적 지위에서 밀려남
  rationale: 문맥상 폭력과 음모로 인한 처형 상황이므로, 추상화하지 않고 생명 상실의 방향을 분명히 해야 합니다.
  doctrine_reference: Translation philosophy §§1, 3
