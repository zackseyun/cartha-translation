  text: But if our way of life in the place of our exile has been caught up in ungodliness[a], then, after rescuing us from the hand of our enemies, destroy us by whatever death you choose[b], Master.
  footnotes:
  - marker: a
    text: Or 'in our colony/settlement'; the Greek term can denote a colony or settlement, but here likely refers to the community's life in exile.
    reason: lexical_alternative
  - marker: b
    text: Or 'Lord' or 'Sovereign' for 'Master'; the Greek address is δέσποτα, not κύριος.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 우리의 삶이 이 유배의 자리에서 경건치 않음에 사로잡혔다면, 우리를 원수들의 손에서 구해 내신 뒤, 주권자님, 당신이 택하시는 어떤 죽음으로든 우리를 멸하소서.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리의 식민지/거주지에서’. 그리스어 ἀποικία는 원래 식민지나 거주지를 가리킬 수 있지만, 여기서는 유배된 공동체의 삶을 뜻하는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주권자’나 ‘주인’일 수 있습니다. 그리스어 호칭은 κύριος가 아니라 δέσποτα입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσεβείας
  english_pob_choice: ungodliness
  chosen_korean: 경건치 않음
  alternatives_korean:
  - 불경건
  - 불경
  - 경건하지 않음
  lexicon: LSJ
  rationale: ἀσέβεια는 하나님께 대한 불경과 신앙적 무절제를 가리키므로, 현대 한국어에서 종교적·도덕적 힘을 함께 살리는 ‘경건치 않음’을 택했습니다.
- source_word: κατὰ τὴν ἀποικίαν
  english_pob_choice: in the place of our exile
  chosen_korean: 이 유배의 자리에서
  alternatives_korean:
  - 우리 유배의 자리에서
  - 유배 가운데
  - 우리의 이주 공동체 안에서
  lexicon: LSJ
  rationale: ἀποικία는 문자적으로는 식민지/거주지를 뜻할 수 있으나, 여기서는 추방된 삶의 처지를 가리키므로 ‘유배의 자리’로 옮겨 다니는 상태를 드러냈습니다.
- source_word: ἐνέσχηκται
  english_pob_choice: has been caught up
  chosen_korean: 사로잡혔다
  alternatives_korean:
  - 얽혀 있다
  - 연루되었다
  - 붙들렸다
  lexicon: LSJ
  rationale: 완료형은 이미 어떤 상태에 들어가 지속되고 있음을 나타내므로, ‘사로잡혔다’로 경건치 않음이 삶을 지배하는 상태가 되었음을 자연스럽게 표현했습니다.
- source_word: δέσποτα
  english_pob_choice: Master
  chosen_korean: 주권자님
  alternatives_korean:
  - 주인님
  - 주님
  - 주권자
  lexicon: LSJ
  rationale: δέσποτα는 κύριος가 아니라 절대 권세를 가진 주인을 직접 호칭하는 말이므로, ‘주권자님’으로 옮겨 권위와 호칭의 긴장을 함께 살렸습니다.
theological_decisions:
- issue: δέσποτα의 호칭을 ‘주님’으로 일반화하지 않음
  chosen_reading: 주권자님
  alternative_readings:
  - 주님
  - 주인님
  - 주권자
  rationale: 본문은 통상적인 신적 호칭 κύριος가 아니라 δέσποτα를 사용하므로, 한국어에서도 익숙한 예배 언어로 흡수하지 않고 절대 주권의 뉘앙스를 드러내는 표현을 택했습니다.
