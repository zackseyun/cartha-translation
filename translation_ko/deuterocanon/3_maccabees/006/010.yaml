  lexicon: LSJ
  rationale: δέσποτα는 κύριος가 아니라 절대 권세를 가진 주인을 직접 호칭하는 말이므로, ‘주권자님’으로 옮겨 권위와 호칭의 긴장을 함께 살렸습니다.
