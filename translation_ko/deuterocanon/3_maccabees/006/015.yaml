base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/015.yaml
  text: Let it be shown to all the nations that you are with us[a], Lord, and that you have not turned your face away from us; but just as you said, ‘Not even when they were in the land of their enemies did I disregard them,’ so accomplish it[b], Lord.
  footnotes:
  - marker: a
    text: The quoted line echoes covenant language about God not rejecting his people even in the land of their enemies; the Greek verb could also be rendered 'overlooked' or 'neglected.'
    reason: cross_reference
  - marker: b
    text: Or 'bring it to completion' for 'fulfill this.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 민족에게 나타나서 당신이 우리와 함께 계시며, 주님, 우리에게서 당신의 얼굴을 돌이키지 않으셨음을 알게 하소서. 또한 당신이 말씀하신 대로, ‘그들이 원수들의 땅에 있는 동안에도 내가 그들을 외면하지 않았다’고 하신 그 말씀을 이루소서, 주님.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ‘얼굴’을 말하여, 하나님이 우리에게서 돌아서지 않으셨다는 이미지를 보존합니다.
    reason: source_note
  - marker: b
    text: 또는 ‘그것을 완성하소서’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δειχθήτω
  english_pob_choice: Let it be shown
  chosen_korean: 나타나서 알게 하소서
  alternatives_korean:
  - 보이게 하소서
  - 드러나게 하소서
  lexicon: LSJ
  rationale: 수동 명령의 청원을 살리면서, 하나님의 임재와 신실하심이 ‘드러나’ 모든 민족이 알게 되는 흐름을 자연스럽게 담았습니다.
- source_word: πᾶσιν ἔθνεσιν
  english_pob_choice: to all the nations
  chosen_korean: 모든 민족에게
  alternatives_korean:
  - 모든 나라들에게
  - 모든 이방 민족에게
  lexicon: LSJ
  rationale: ἔθνεσιν의 직접 대응을 유지하되, 문맥상 넓은 관찰 대상이라는 점을 살려 ‘민족’으로 옮겼습니다.
- source_word: τὸ πρόσωπόν σου
  english_pob_choice: your face
  chosen_korean: 당신의 얼굴
  alternatives_korean:
  - 당신의 얼굴빛
  - 당신의 얼굴을
  lexicon: LSJ
  rationale: 히브리적 관용구를 반영해 ‘얼굴’을 살려, 하나님이 등을 돌리신 것이 아니라는 표상을 보존했습니다.
- source_word: ὑπεριδον
  english_pob_choice: did I disregard
  chosen_korean: 내가 그들을 외면하지 않았다
  alternatives_korean:
  - 내가 그들을 못 본 체하지 않았다
  - 내가 그들을 간과하지 않았다
  - 내가 그들을 버리지 않았다
  lexicon: LSJ
  rationale: ‘외면하다’는 단순히 보지 못했다는 뜻이 아니라, 언약적 맥락에서 사람들을 돌보지 않고 제쳐두는 의미를 자연스럽게 전달합니다.
- source_word: ἐπίτελεσον
  english_pob_choice: accomplish it
  chosen_korean: 이루소서
  alternatives_korean:
  - 완성하소서
  - 성취하소서
  - 마무리하소서
  lexicon: LSJ
  rationale: 앞선 말씀을 실제로 성취해 달라는 간구를 간결하게 살리기 위해, ‘이루소서’를 선택했습니다.
theological_decisions:
- issue: 주님께 드리는 청원의 높임말 처리
  chosen_reading: ‘알게 하소서’와 ‘이루소서’를 사용해 하나님께 직접 드리는 기도를 합쇼체로 유지했습니다.
  alternative_readings:
  - 알게 하십시오
  - 보이게 하십시오
  rationale: 기도문 형식의 직접 호칭이므로, 한국어 문체상 하나님께 드리는 간구는 높임말 종결을 유지하는 것이 적절합니다.
  doctrine_reference: 'POB Korean style: direct address to God uses honorific verb endings'
- issue: 인용문 속 다의적 언약 표현 보존
  chosen_reading: ‘그들이 원수들의 땅에 있는 동안에도 내가 그들을 외면하지 않았다’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 내가 그들을 돌보지 않았다
  - 내가 그들을 무시하지 않았다
  rationale: 본문은 포로/이방 땅에서도 하나님이 자기 백성을 버리지 않으셨다는 언약적 긴장을 담고 있으므로, 그 결을 약화하지 않도록 ‘외면하지 않았다’를 택했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it
