base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/039.yaml
  text: In these things also[a], after gloriously revealing his mercy[c][b], the Sovereign of all rescued them all together without stumbling.
  footnotes:
  - marker: a
    text: Or 'having manifested his mercy.' The Greek participle ἐπιφάνας can emphasize manifestation rather than simple appearance.
    reason: lexical_alternative
  - marker: b
    text: Literally 'without stumbling'; the phrase likely conveys that they were delivered unharmed.
    reason: lexical_alternative
  - marker: c
    text: Or 'with one accord.' The Greek ὁμοθυμαδόν can denote shared unity as well as collective action.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일들 가운데서도 그는 그분의 자비를 영광스럽게 드러내시고, 모든 이의 주권자께서 그들을 모두 함께 넘어지지 않게 구해 주셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 자비를 드러내신 뒤에’. 그리스어 ἐπιφάνας는 단순한 출현보다 ‘드러내심/나타내심’의 뉘앙스를 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘넘어지지 않게’입니다. 문맥상 그들이 해를 입지 않고 구출되었다는 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘한마음으로’. 그리스어 ὁμοθυμαδόν은 공동의 일치와 집합적 행동을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αἷς
  english_pob_choice: In these things
  chosen_korean: 이 일들 가운데서도
  alternatives_korean:
  - 이 일들 속에서
  - 그 가운데서도
  - 이 일들에서
  lexicon: LSJ
  rationale: 앞선 사건들을 가리키는 관계구를 한국어에서 자연스럽게 풀어, 사건의 흐름과 연결을 유지했습니다.
- source_word: μεγαλοδόξως ἐπιφάνας
  english_pob_choice: after gloriously revealing
  chosen_korean: 영광스럽게 드러내시고
  alternatives_korean:
  - 영광스럽게 나타내시고
  - 크게 영광 가운데 드러내시고
  - 영광스럽게 보여 주시고
  lexicon: LSJ
  rationale: ἐπιφάνας는 단순한 출현보다 ‘드러냄/나타냄’의 의미가 강하므로, ἔλεος의 목적어 관계를 살려 ‘드러내시고’로 옮겼습니다.
- source_word: ὁ τῶν πάντων δυνάστης
  english_pob_choice: the Sovereign of all
  chosen_korean: 모든 이의 주권자
  alternatives_korean:
  - 만물의 주권자
  - 모든 것의 통치자
  - 모든 것의 군주
  lexicon: LSJ
  rationale: δυνάστης는 일반적인 신적 칭호보다 ‘통치하는 주권자’에 가까워, 한국어에서 권세와 통치를 함께 드러내는 표현을 택했습니다.
- source_word: ἀπταίστους
  english_pob_choice: without stumbling
  chosen_korean: 넘어지지 않게
  alternatives_korean:
  - 실족하지 않게
  - 걸려 넘어지지 않게
  - 넘어짐 없이
  lexicon: LSJ
  rationale: 직역의 ‘넘어지지 않게’로 보존하되, 구출의 결과를 한국어에서 자연스럽고 선명하게 전달했습니다.
- source_word: ὁμοθυμαδόν
  english_pob_choice: all together
  chosen_korean: 모두 함께
  alternatives_korean:
  - 한마음으로
  - 일제히
  - 한뜻으로
  lexicon: LSJ
  rationale: 이 단어는 ‘한마음으로’의 의미도 가능하지만, 여기서는 구출의 집합성을 직접 강조하므로 ‘모두 함께’가 문맥에 가장 적합합니다.
theological_decisions:
- issue: ὁ τῶν πάντων δυνάστης의 신적 호칭을 어떻게 살릴지
  chosen_reading: ‘모든 이의 주권자’로 옮겨, 하나님의 통치권을 드러내되 영어 POB처럼 별도의 전통적 과장어는 덧붙이지 않았습니다.
  alternative_readings:
  - ‘만물의 주권자’
  - ‘모든 것의 통치자’
  - ‘전능하신 통치자’
  rationale: 본문 자체가 δυνάστης라는 통치 칭호를 사용하므로, 번역도 그 권세성과 주권성을 유지해야 합니다. ‘전능하신’은 다른 신학적 호칭을 불필요하게 보태는 소지가 있어 제외했습니다.
  doctrine_reference: 'DOCTRINE.md: Original-language primacy over translation tradition; consistency of key terms, or documented exception.'
