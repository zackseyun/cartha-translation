  source_fidelity: 수정이 필요합니다. ἀπέστρεψαν은 짐승들이 무장 병력을 향해 ‘돌아서다/방향을 돌리다’를 뜻하며, 초안의 ‘맞서 돌진하여’는 돌진이라는 동작을 추가합니다. 또한 συνεπομένας는 누구를 뒤따르는지 본문 안에서 명시하지 않으므로, ‘그들을 따라오는’은 선행 대상을 불필요하게 특정합니다.
