base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/021.yaml
  text: And the beasts turned against the armed forces following them[a], and they trampled them and destroyed them.
  footnotes:
  - marker: a
    text: Or 'the accompanying armed troops.' The Greek participle means 'following along' or 'accompanying.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 짐승들은 뒤따르던 무장 병력[a]을 향해 돌아서서, 그들을 짓밟고 멸망시켰습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘동행하던 무장 병력’. 그리스어 분사 συνεπομένας는 ‘함께 뒤따르다’ 또는 ‘동행하다’를 뜻하며, 누구를 따르는지는 이 절에서 명시하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστρεψαν
  english_pob_choice: turned against
  chosen_korean: 맞서 돌진하여
  alternatives_korean:
  - 돌아서 그들을 향하여
  - 그들을 향해 방향을 틀어
  lexicon: LSJ
  rationale: 주어가 짐승들이므로 단순한 방향 전환보다 적대적 표적 전환을 드러내는 표현이 필요합니다. '맞서 돌진하여'는 영어 POB의 hostile redirection을 자연스럽게 살립니다.
- source_word: τὰ θηρία
  english_pob_choice: the beasts
  chosen_korean: 짐승들
  alternatives_korean:
  - 동물들
  - 야수들
  lexicon: LSJ
  rationale: 문맥상 처형에 동원된 맹수이므로, 한국어에서는 가장 직접적인 '짐승들'이 위험성과 야성을 잘 보존합니다.
- source_word: τὰς συνεπομένας ἔνοπλους δυνάμεις
  english_pob_choice: the armed forces following them
  chosen_korean: 그들을 따라오는 무장한 군대
  alternatives_korean:
  - 동행하던 무장한 병력
  - 뒤따르던 무장 부대
  lexicon: LSJ
  rationale: συνεπομένας는 '함께 따라가다/뒤따르다'의 뜻이므로 '따라오는'으로 옮겼고, ἔνοπλους δυνάμεις는 '무장한 군대'로 풀어 군사적 성격을 분명히 했습니다.
- source_word: κατεπάτουν
  english_pob_choice: trampled them
  chosen_korean: 그들을 짓밟고
  alternatives_korean:
  - 그들을 밟아 짓이기고
  - 그들을 짓밟아
  lexicon: LSJ
  rationale: 미완료과거의 반복적·지속적 동작을 담아 '짓밟고'로 처리했습니다. 한국어에서 자연스럽게 연속 동작을 이어 주면서 폭력성을 유지합니다.
- source_word: ὠλέθρευον
  english_pob_choice: destroyed them
  chosen_korean: 멸망시켰습니다
  alternatives_korean:
  - 파멸시켰습니다
  - 멸했습니다
  lexicon: LSJ
  rationale: ὠλέθρευον은 단순 살해보다 파괴·멸망의 강한 의미가 있어, '멸망시켰습니다'가 의미 범위와 شدت(강도)을 함께 살립니다.
theological_decisions:
- issue: 폭력 서술의 직접성
  chosen_reading: 짐승들의 공격과 파괴를 완곡하게 누그러뜨리지 않고 그대로 드러냈습니다.
  alternative_readings:
  - '''상하게 했습니다''처럼 약화하기'
  - '''죽였습니다''로만 좁히기'
  rationale: 원문은 짐승들이 무장 군대를 짓밟고 멸망시키는 극적인 파괴를 말하므로, 서술의 충격을 보존하는 편이 본문의 의도를 더 잘 반영합니다.
  doctrine_reference: 문학적-서술적 충실성
- issue: '''무장한 군대''의 군사적 맥락'
  chosen_reading: ἔνοπλους δυνάμεις를 단순한 사람들로 약화하지 않고 군사 집단으로 유지했습니다.
  alternative_readings:
  - '''동행하는 사람들''로 일반화하기'
  - '''호위대''로 구체화하기'
  rationale: 그리스어는 명백히 무장 집단을 가리키므로, 독자가 사건의 전투성을 오해하지 않도록 군사적 의미를 살렸습니다.
  doctrine_reference: 본문 맥락 보존
