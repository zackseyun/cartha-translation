  naturalness: ‘왕의 지원을 받으며’와 ‘석방에 관한 청원’은 자연스럽고 격식 있는 표현입니다. 다만 문장을 나누어 ‘열넷째 날까지 잔치를 벌였습니다’라고 하면 현대 표준어 합쇼체에서 더 명료하고 원문의 연결도 잘 드러납니다.
