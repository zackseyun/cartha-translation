  text: And they all feasted[a], being supplied by the king, until the fourteenth day, on which they also made their petition concerning their release.
  footnotes:
  - marker: a
    text: Or 'presented their request for their release.' The Greek expression can denote making a formal petition or appeal.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 왕의 지원을 받으며 모두 잔치를 벌였고, 열나흗날까지 그렇게 지냈습니다. 그날 그들은 자기들의 석방에 관한 청원을 올렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘청원을 올렸습니다’는 그리스어 ἐντυχία가 가리킬 수 있는 공식적 요청의 의미를 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐωχοῦντο
  english_pob_choice: feasted
  chosen_korean: 잔치를 벌였고
  alternatives_korean:
  - 연회를 즐겼고
  - 흥겹게 먹고 마셨고
  - 잔치하였고
  lexicon: LSJ
  rationale: 동사는 단순한 식사가 아니라 축제적 연회 참석을 뜻하므로, ‘잔치를 벌였고’가 행사의 분위기와 구체성을 잘 살립니다.
- source_word: ὑπὸ τοῦ βασιλέως χορηγούμενοι
  english_pob_choice: being supplied by the king
  chosen_korean: 왕의 지원을 받으며
  alternatives_korean:
  - 왕의 공급을 받으며
  - 왕에게서 제공받으며
  - 왕의 부양을 받으며
  lexicon: LSJ
  rationale: χορηγούμενοι는 왕이 비용과 물자를 대는 후원을 가리키므로, 한국어로는 자연스럽게 ‘지원을 받으며’로 옮기되 왕의 후원이라는 관계를 유지했습니다.
- source_word: τὴν ἐντυχίαν ἐποιήσαντο
  english_pob_choice: made their petition
  chosen_korean: 청원을 올렸습니다
  alternatives_korean:
  - 청원했습니다
  - 요청을 드렸습니다
  - 간청했습니다
  lexicon: LSJ
  rationale: ἐντυχία는 상급자에게 드리는 공식 청원/상소의 뉘앙스가 있어, 평이한 ‘요청’보다 격식을 드러내는 ‘청원을 올렸습니다’가 더 적절합니다.
- source_word: περὶ τῆς ἀπολύσεως αὐτῶν
  english_pob_choice: concerning their release
  chosen_korean: 자기들의 석방에 관한
  alternatives_korean:
  - 자기들의 해방에 관한
  - 자기들의 풀려남에 관한
  - 자기들의 면제에 관한
  lexicon: LSJ
  rationale: ἀπόλυσις는 ‘석방/해제’의 의미가 핵심이므로, 문맥상 감금 상태에서 풀려나는 뜻을 살려 ‘석방’으로 옮겼습니다.
