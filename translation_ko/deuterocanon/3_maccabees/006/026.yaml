base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/026.yaml
  text: Who has so lawlessly surrounded with cruelties those who from the beginning have surpassed all nations in goodwill toward us in every respect, and who have repeatedly shown themselves to face the worst dangers among men?
  footnotes:
  - marker: a
    text: Or 'have excelled all nations in every way'; the Greek verb can mean either 'differ from' or, in context, 'surpass/excel.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'the worst dangers among men' is idiomatic and difficult; it likely refers to the gravest dangers encountered in human affairs, or dangers such as men suffer.
    reason: lexical_alternative
translation:
  language: ko
  text: 누가 처음부터 우리에게 온갖 면에서 모든 민족보다 우호로 뛰어났고, 사람들 가운데서 가장 심한 위험들 속에 반복해서 자신을 드러낸 이들을 이렇게 법도에 어긋나게 잔혹함으로 에워쌌습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘뛰어났고’로 옮긴 διαφέρω는 여기서 ‘다르다’보다 ‘우세하다/뛰어나다’의 뜻으로 읽었습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘사람들 가운데서 가장 심한 위험들’은 영어 주석이 지적하듯, 인간이 겪는 극심한 위험들을 가리키는 관용적 표현으로 이해했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  english_pob_choice: Who has
  chosen_korean: 누가
  alternatives_korean:
  - 어느 사람이
  - 누가 도대체
  lexicon: LSJ
  rationale: 수사적 질문의 첫머리로서 가장 자연스러운 표준어를 택해 원문의 비난적 질문 형식을 살렸습니다.
- source_word: τοὺς ἐξ ἀρχῆς
  english_pob_choice: those who from the beginning
  chosen_korean: 처음부터 … 이들을
  alternatives_korean:
  - 시초부터 … 이들을
  - 맨 처음부터 … 이들을
  lexicon: LSJ
  rationale: 시간적 출발점을 나타내므로 ‘처음부터’가 간결하고 직접적입니다.
- source_word: εὐνοίᾳ πρὸς ἡμᾶς κατὰ πάντα διαφέροντας πάντων ἐθνῶν
  english_pob_choice: have surpassed all nations in every respect, in goodwill toward us
  chosen_korean: 우리에게 온갖 면에서 모든 민족보다 우호로 뛰어났고
  alternatives_korean:
  - 우리에게 모든 면에서 모든 민족보다 호의를 보였고
  - 우리에게 모든 점에서 모든 민족보다 우의를 베풀었고
  lexicon: LSJ
  rationale: διαφέρω는 여기서 단순한 ‘다르다’가 아니라 ‘뛰어나다/우세하다’의 뜻이므로 이를 반영했고, εὔνοια는 ‘우호’로 옮겨 후원적 태도를 살렸습니다.
- source_word: πλεονάκις ἐπιδειγμένους
  english_pob_choice: who have repeatedly shown themselves
  chosen_korean: 반복해서 자신을 드러낸
  alternatives_korean:
  - 자주 자신을 보인
  - 여러 번 자신을 나타낸
  lexicon: LSJ
  rationale: πλεονάκις의 반복성을 ‘반복해서’로, ἐπιδείκνυμι의 중간태를 ‘자신을 드러낸’으로 옮겨 행위의 자기표현성을 유지했습니다.
- source_word: χειρίστους ... κινδύνους ἀνθρώπων
  english_pob_choice: the worst dangers among men
  chosen_korean: 사람들 가운데서 가장 심한 위험들 속에
  alternatives_korean:
  - 사람들 사이에서 가장 큰 위험들 속에
  - 인간사에서 가장 심한 위험들 가운데
  lexicon: LSJ
  rationale: 문맥상 ‘위험들’은 인간의 처지 안에서 겪는 극심한 위험을 가리키므로, 영어 주석의 난점을 반영해 과도한 해석 없이 살렸습니다.
- source_word: οὕτως ἀθέσμως περιέβαλεν αἰκίαις
  english_pob_choice: so lawlessly surrounded with cruelties
  chosen_korean: 이렇게 법도에 어긋나게 잔혹함으로 에워쌌습니까
  alternatives_korean:
  - 이렇게 법 없이 잔혹함으로 둘러쌌습니까
  - 이렇게 불법하게 고통으로 감쌌습니까
  lexicon: LSJ
  rationale: ἀθέσμως는 법과 질서에 어긋난 행위를 뜻하므로 ‘법도에 어긋나게’가 자연스럽고, αἰκίαις는 복수의 ‘잔혹함’으로 폭력성의 강도를 드러냈습니다.
theological_decisions:
- issue: 수사적 비난 질문의 보존
  chosen_reading: 직설적 비난을 담은 수사적 질문으로 옮겨, 행위의 부당함을 독자가 즉시 느끼도록 했습니다.
  alternative_readings:
  - 평서문으로 완화하여 옮김
  - 감탄문으로 바꿈
  rationale: 원문이 단순 정보 전달이 아니라 고발과 비난의 수사적 효과를 내므로, 질문형을 유지하는 것이 의미를 가장 잘 보존합니다.
  doctrine_reference: 문맥-수사 기능 보존
- issue: ‘우호/호의’의 중립적 표현
  chosen_reading: εὔνοια를 교회 전통어 ‘은혜’로 바꾸지 않고 ‘우호’로 처리했습니다.
  alternative_readings:
  - 호의
  - 선의
  rationale: 본문은 하나님의 은혜 개념이 아니라 왕권/민족 관계에서의 우호를 말하므로, 신학 용어를 덧씌우지 않는 것이 원문에 충실합니다.
  doctrine_reference: 어휘-문맥 구분
