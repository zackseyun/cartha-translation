  naturalness: 원안의 ‘머리카락 하나까지도 다 살려 내셨고’는 다소 중복되고 한국어 관용성이 약합니다. ‘머리카락 한 올도 잃지 않게 구해 내셨으며’가 현대 표준어 합쇼체로 자연스럽습니다. ‘이글거리는 풀무’와 ‘불꽃을 보내셨습니다’도 원문의 강한 불의 이미지를 자연스럽게 살립니다.
  terminology: ἑταίρους는 ‘세 동료들’로 유지합니다. ψυχή는 이 문맥에서 ‘목숨’, κάμινος는 ‘풀무’, ὑπεναντίοι는 ‘대적’이 적절합니다. 원안의 각주가 제시한 다니엘 전승의 식별은 본문에 없는 해설을 더하며, 영어 감사 기록의 각주 앵커도 본문 어구와 맞지 않으므로 삭제하는 것이 안전합니다.
