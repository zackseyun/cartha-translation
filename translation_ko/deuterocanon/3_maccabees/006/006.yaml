base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/006.yaml
  text: You rescued the three companions in Babylonia[a], who had willingly given up their lives to the fire so as not to worship empty things; after cooling the blazing furnace, you delivered them all unharmed[b], and sent a flame upon all their adversaries.
  footnotes:
  - marker: a
    text: Literally, 'you delivered them all to a hair,' that is, without even the loss of a hair.
    reason: lexical_alternative
  - marker: b
    text: '''Empty things'' refers to false objects of worship; alternatively, ''vain things'' or more interpretively ''idols.'''
    reason: alternative_reading
translation:
  language: ko
  text: 바빌로니아의 세 동료들이 헛된 것들을 섬기지 않으려고 기꺼이 목숨을 불에 내어 주었을 때, 당신께서는 이글거리는 풀무를 식히시고 그들 모두를 머리카락 한 올도 잃지 않게 구해 내셨으며, 그들의 모든 대적에게 불꽃을 보내셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑταίρους
  english_pob_choice: companions
  chosen_korean: 동료들
  alternatives_korean:
  - 동무들
  - 동료
  lexicon: LSJ
  rationale: ἑταῖροι는 단순한 친구보다 함께하는 동료·동반자에 가깝기 때문에, 이야기의 공동 체험을 살리면서도 과도한 해석을 피하는 ‘동료들’이 적절합니다.
- source_word: πυρὶ τὴν ψυχὴν αὐθαιρέτως δεδωκότας
  english_pob_choice: had willingly given up their lives into the fire
  chosen_korean: 자기 목숨을 불에 기꺼이 내어 주었으며
  alternatives_korean:
  - 기꺼이 목숨을 불에 맡겼으며
  - 자발적으로 자신의 생명을 불에 내주었으며
  lexicon: LSJ
  rationale: αὐθαιρέτως의 자원성은 ‘기꺼이’로, ψυχή는 문맥상 ‘목숨’으로 옮기면 자연스럽고, ‘불에’는 희생의 위협을 직접 드러냅니다.
- source_word: τοῖς κενοῖς
  english_pob_choice: empty things
  chosen_korean: 우상 숭배를 하지 않으려고
  alternatives_korean:
  - 헛된 것들을 섬기지 않으려고
  - 빈 것들을 섬기지 않으려고
  lexicon: LSJ
  rationale: 직역인 ‘빈 것들’도 가능하지만, 여기서는 문맥상 우상 숭배를 가리키는 폴레믹이 분명하므로 한국어 독자가 의미를 즉시 파악하도록 ‘우상 숭배를 하지 않으려고’로 풀었습니다.
- source_word: μέχρι τριχὸς ἁπάντων
  english_pob_choice: delivered them all unharmed
  chosen_korean: 그들 모두를 머리카락 하나까지도 다 살려 내셨고
  alternatives_korean:
  - 그들 모두를 상처 하나 없이 구하셨고
  - 그들 모두를 머리카락 하나 잃지 않게 하셨고
  lexicon: LSJ
  rationale: 이 관용구는 ‘한 올의 머리카락도 잃지 않다’는 완전한 보존을 뜻하므로, 본문의 강도를 살리는 ‘머리카락 하나까지도 다’가 가장 직접적입니다.
- source_word: φλόγα πᾶσιν ἐπιπέμψας τοῖς ὑπεναντίοις
  english_pob_choice: and sent a flame upon all their adversaries
  chosen_korean: 그들의 모든 대적에게는 불길을 보내셨습니다
  alternatives_korean:
  - 모든 반대자들에게 불꽃을 보내셨습니다
  - 그들을 대적한 모든 이에게 불을 내리셨습니다
  lexicon: LSJ
  rationale: φλόξ는 ‘불길’이 가장 자연스럽고, ὑπεναντίοι는 단순한 반대자보다 적대하는 자들을 가리키므로 ‘대적’이 문맥에 맞습니다.
theological_decisions:
- issue: 토ῖς κενοῖς의 해석 범위
  chosen_reading: ‘우상 숭배를 하지 않으려고’로 의미를 풀되, 본문이 말하는 헛된 대상에 대한 거부라는 점을 유지했습니다.
  alternative_readings:
  - ‘헛된 것들’을 더 직역하기
  - ‘우상들’로 명시하기
  rationale: 그리스어는 문자 그대로 ‘빈 것들’이지만, 이 구절의 신학적 초점은 참 하나님 대신 헛된 대상을 섬기지 않는다는 점이므로 한국어 본문에서는 의미를 자연스럽게 드러냈습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: 다니엘의 세 청년 전승에 대한 암시 처리
  chosen_reading: 이름을 덧붙이지 않고 ‘바빌로니아의 세 동료들’로만 유지했습니다.
  alternative_readings:
  - 하나냐, 아사랴, 미사엘을 명시하기
  - ‘세 젊은이들’로 바꾸기
  rationale: 원문은 전승을 전제하며 간결하게 ‘세 동료들’이라고만 말하므로, 전통 조화를 위해 인물을 확장하지 않고 암시성을 보존하는 것이 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §5
