    rationale: εἰς τὴν ἀπώλειαν은 단순히 얼굴을 향하는 방향이 아니라 그들이 처한 임박한 파멸의 상황을 나타냅니다. 한국어에서는 ‘멸망을 앞두고’가 이를 더 자연스럽게 전달합니다.
