    issue: 각주의 ‘시종들’은 φίλοι의 궁정 용례를 다소 부정확하게 좁힙니다.
    rationale: 헬레니즘 궁정에서 φίλοι는 통상 왕의 측근·친우·고위 신하를 가리킬 수 있으며, 일반적 의미의 시종과는 구별될 수 있습니다.
