  yaml_path: translation/deuterocanon/3_maccabees/006/023.yaml
  text: For when he heard the outcry[a], and saw all of them prostrate for destruction, he wept in anger and threatened his friends, saying,
  footnotes:
  - marker: a
    text: Greek φίλοι may refer not only to personal friends but also to royal associates or courtiers in a court setting.
    reason: cultural_note
translation:
  language: ko
  text: 그는 그 외침을 듣고, 그들 모두가 멸망을 향해 얼굴을 땅에 대고 있는 것을 보고는, 분노하여 울며 자기 친구들에게 위협하면서 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 φίλοι는 개인적 ‘친구들’만이 아니라 궁정의 동료나 시종들을 가리킬 수도 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἀκούσας γὰρ τῆς κραυγῆς
  english_pob_choice: For when he heard the outcry
  chosen_korean: 그는 그 외침을 듣고
  alternatives_korean:
  - 외침을 듣자
  - 그 함성을 듣고
  lexicon: BDAG
  rationale: ἀκούσας의 시간적 부사절을 자연스러운 서술로 옮기되, κραυγῆς는 단순한 ‘소리’보다 위급한 ‘외침’이 적절합니다.
- source_word: πρηνεῖς
  english_pob_choice: lying face down / prostrate
  chosen_korean: 얼굴을 땅에 대고 있는
  alternatives_korean:
  - 엎드린
  - 얼굴을 아래로 한
  lexicon: LSJ
  rationale: πρηνής는 ‘얼굴을 아래로 한, 엎드린’ 뜻이므로, 한국어에서는 몸의 자세를 분명히 드러내는 표현이 가장 정확합니다.
- source_word: εἰς τὴν ἀπώλειαν
  english_pob_choice: for destruction
  chosen_korean: 멸망을 향해
  alternatives_korean:
  - 파멸을 향해
  - 멸망을 위해
  lexicon: BDAG
  rationale: 전치사구는 단순한 결과보다 임박한 파국의 방향성을 띠므로, ‘향해’로 운동성을 살렸습니다.
- source_word: τοῖς φίλοις
  english_pob_choice: his friends
  chosen_korean: 자기 친구들에게
  alternatives_korean:
  - 자기 동료들에게
  - 궁정 신하들에게
  lexicon: BDAG
  rationale: 본문의 기본 의미는 ‘친구들’이지만, 헬라어 궁정 용례의 뉘앙스가 있을 수 있으므로 본문은 직역하고 별도 각주로 여지를 남깁니다.
- source_word: διηπείλει
  english_pob_choice: threatened
  chosen_korean: 위협하면서
  alternatives_korean:
  - 협박하며
  - 거듭 위협하며
  lexicon: LSJ
  rationale: 미완료시제의 지속적 뉘앙스를 한국어 부사어로 반영해, 단발적 행위보다 계속된 위협임을 드러냈습니다.
theological_decisions:
- issue: 감정 묘사와 행위의 결합
  chosen_reading: ‘분노하여 울며’로, 분노와 눈물이 함께 나타나는 복합 정서를 그대로 살렸습니다.
  alternative_readings:
  - ‘분하여 눈물을 흘리며’
  - ‘노하여 울면서’
  rationale: 본문은 단순한 슬픔이 아니라 분노가 섞인 통곡을 말하므로, 정서의 긴장을 완화하지 않도록 했습니다.
  doctrine_reference: 서사 본문의 심리 묘사는 평탄화하지 않고 원문의 정서적 긴장을 보존해야 합니다.
