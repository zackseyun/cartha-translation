  text: 그들은 일어섰고, 적대자들의 군세를 혼란과 비겁함으로 가득 채웠으며, 움직일 수 없는 족쇄로 그들을 묶었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘맞서 섰고’. 그리스어 동사는 대적하여 버티거나 맞서는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘적대자들의 군세를 혼란과 비겁함으로 가득 채웠다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντέστησαν
  english_pob_choice: rose up
  chosen_korean: 일어섰고
  alternatives_korean:
  - 맞섰고
  - 대항했으며
  - 일어나 저항했고
  lexicon: LSJ
  rationale: 문맥상 단순한 기립이 아니라 적에 맞서 행동에 나선 뉘앙스를 살리되, 한국어에서는 자연스러운 동작 표현인 ‘일어섰고’가 POB의 ‘rose up’과 가장 가깝습니다.
- source_word: τὴν δύναμιν τῶν ὑπεναντίων
  english_pob_choice: the force of their adversaries
  chosen_korean: 적대자들의 군세
  alternatives_korean:
  - 적대자들의 힘
  - 적들의 군대
  - 반대자들의 세력
  lexicon: LSJ
  rationale: δύναμις가 추상적 ‘힘’보다 대적하는 집단의 전력/병력을 가리키므로, 군사적 집합을 드러내는 ‘군세’가 원문의 범위를 가장 잘 살립니다.
- source_word: ταραχῆς καὶ δειλίας
  english_pob_choice: confusion and cowardice
  chosen_korean: 혼란과 비겁함
  alternatives_korean:
  - 소란과 두려움
  - 요동과 겁
  - 혼미와 겁냄
  lexicon: LSJ
  rationale: ταραχή와 δειλία의 결합을 한국어의 대립적 병렬로 옮기되, δειλία의 ‘비겁함/겁냄’ 중에서 여기서는 성격적 위축을 드러내는 ‘비겁함’을 택했습니다.
- source_word: ἀκινήτοις ἔδησαν πέδαις
  english_pob_choice: bound them with immovable fetters
  chosen_korean: 움직일 수 없는 족쇄로 그들을 묶었습니다
  alternatives_korean:
  - 움직이지 않는 쇠사슬로 그들을 묶었습니다
  - 풀 수 없는 족쇄로 그들을 묶었습니다
  - 움직일 수 없는 쇠고랑으로 그들을 묶었습니다
  lexicon: LSJ
  rationale: πέδαις는 발목을 묶는 결박을 가리키므로 ‘족쇄’가 구체적 이미지를 살리고, ἀκινήτοις는 ‘움직일 수 없는’으로 옮겨 고정성과 탈출 불가능성을 드러냈습니다.
theological_decisions:
- issue: 전투 서술에서 ἀντέστησαν의 동작성과 저항성의 균형
  chosen_reading: ‘일어섰고’로 옮겨 단순 정지보다 적대에 맞서 행동에 나선 역동성을 살렸습니다.
  alternative_readings:
  - ‘맞섰고’
  - ‘저항했고’
  rationale: 이 구절은 전투 서술이므로, 저항의 의미를 유지하면서도 장면의 급작스러운 움직임을 보여 주는 번역이 문맥에 가장 적합합니다.
  doctrine_reference: 문학적/서사적 뉘앙스 처리
