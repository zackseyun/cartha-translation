  rationale: δύναμις가 추상적 ‘힘’보다 대적하는 집단의 전력/병력을 가리키므로, 군사적 집합을 드러내는 ‘군세’가 원문의 범위를 가장 잘 살립니다.
- source_word: ταραχῆς καὶ δειλίας
  english_pob_choice: confusion and cowardice
  chosen_korean: 혼란과 비겁함
  alternatives_korean:
  - 소란과 두려움
  - 요동과 겁
  - 혼미와 겁냄
  lexicon: LSJ
  rationale: ταραχή와 δειλία의 결합을 한국어의 대립적 병렬로 옮기되, δειλία의 ‘비겁함/겁냄’ 중에서 여기서는 성격적 위축을 드러내는 ‘비겁함’을 택했습니다.
- source_word: ἀκινήτοις ἔδησαν πέδαις
  english_pob_choice: bound them with immovable fetters
  chosen_korean: 움직일 수 없는 족쇄로 그들을 묶었습니다
  alternatives_korean:
  - 움직이지 않는 쇠사슬로 그들을 묶었습니다
  - 풀 수 없는 족쇄로 그들을 묶었습니다
  - 움직일 수 없는 쇠고랑으로 그들을 묶었습니다
  lexicon: LSJ
  rationale: πέδαις는 발목을 묶는 결박을 가리키므로 ‘족쇄’가 구체적 이미지를 살리고, ἀκινήτοις는 ‘움직일 수 없는’으로 옮겨 고정성과 탈출 불가능성을 드러냈습니다.
