  text: But just as Eleazar was finishing his prayer[a], the king came along by the hippodrome with the beasts and all the tumult of his forces.
  footnotes:
  - marker: a
    text: Or 'with all the blustering of his forces.' The Greek phrase uses vivid language for the noisy, threatening uproar accompanying the king's military power.
    reason: lexical_alternative
translation:
  language: ko
  text: 엘르아자르가 기도를 막 마치려던 바로 그때, 왕이 짐승들과 자기 군대의 모든 소란을 거느리고 경마장 곁으로 지나가고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 군대의 모든 우쭐거림/코 고는 듯한 소란’에 가깝습니다. 그리스어 φρύαγμα은 짐승의 코고는 소리에서 나온 생생한 표현으로, 군사력의 요란하고 위협적인 기세를 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λήγοντος ἄρτι
  english_pob_choice: just as ... was finishing
  chosen_korean: 막 마치려던 바로 그때
  alternatives_korean:
  - 막 끝내려던 바로 그때
  - 거의 마치려던 바로 그때
  lexicon: LSJ
  rationale: 분사구의 긴박한 동시성을 살리기 위해 ‘막 …려던 바로 그때’로 옮겨, 엘르아자르의 기도가 끝나가는 순간과 왕의 등장 시점이 정확히 겹치도록 했습니다.
- source_word: προσευχῆς
  english_pob_choice: prayer
  chosen_korean: 기도
  alternatives_korean:
  - 기도함
  - 기도문
  lexicon: LSJ
  rationale: προσευχή의 기본 의미를 자연스러운 한국어로 옮겼습니다.
- source_word: θηρίοις
  english_pob_choice: the beasts
  chosen_korean: 짐승들
  alternatives_korean:
  - 야수들
  - 들짐승들
  lexicon: LSJ
  rationale: 행형 준비에 동원된 위험한 짐승들을 가리키지만, 본문이 별도의 수식 없이 단순히 θηρία를 쓰므로 과도한 설명을 덧붙이지 않고 ‘짐승들’로 유지했습니다.
- source_word: παντὶ τῷ τῆς δυνάμεως φρύαγματι
  english_pob_choice: all the tumult of his forces
  chosen_korean: 자기 군대의 모든 소란
  alternatives_korean:
  - 자기 군대의 모든 허세
  - 자기 군대의 모든 요란함
  - 자기 군대의 모든 기세
  lexicon: LSJ
  rationale: φρύαγμα의 감각적·위협적 울림을 ‘소란’으로 살리고, τῆς δυνάμεως는 왕의 군사력을 가리키므로 ‘군대’로 구체화했습니다. 영어 본문의 ‘tumult’처럼 소리와 위압을 함께 드러내려 했습니다.
- source_word: κατὰ τὸν ἱππόδρομον
  english_pob_choice: by the hippodrome
  chosen_korean: 경마장 곁으로
  alternatives_korean:
  - 경마장 옆으로
  - 경마장 따라
  - 경마장을 지나
  lexicon: LSJ
  rationale: κατά + 대격의 장소 관계를 자연스럽게 살려, 이동 경로가 경마장과 인접해 있음을 보여 주는 ‘곁으로’로 옮겼습니다. ‘경마장’은 ἱππόδρομος의 통용되는 현대어 대응어입니다.
theological_decisions:
- issue: 왕의 행렬과 위압적 군사력의 묘사
  chosen_reading: 본문의 핵심은 왕의 등장 자체보다, 그의 군사 권세가 짐승들과 함께 소란스럽게 지나가는 위압적 장면입니다.
  alternative_readings:
  - 단순한 이동 장면으로 완화하는 읽기
  - 군사력에 대한 과장된 풍자만 강조하는 읽기
  rationale: φρύαγμα와 τῆς δυνάμεως의 결합은 힘의 소란스러운 과시를 드러내므로, 이를 약화시키지 않고 그대로 살렸습니다.
  doctrine_reference: 문학적-역사적 서술의 위압적 이미지 보존
