lexical_decisions:
- source_word: ἱκετεύει
  english_pob_choice: entreats
  chosen_korean: 간청합니다
  alternatives_korean:
  - 애원합니다
  - 간절히 청합니다
  - 부탁합니다
  lexicon: BDAG
  rationale: ἱκετεύει는 단순한 요청보다 더 강한 탄원과 간구를 뜻하므로, 격식과 절박함을 함께 살리는 ‘간청합니다’가 적절합니다.
- source_word: τὸ πᾶν πλῆθος
  english_pob_choice: the whole multitude
  chosen_korean: 온 무리
  alternatives_korean:
  - 모든 무리
  - 전체 무리
  - 무리 전체
  lexicon: LSJ
  rationale: ‘온’은 총체성을 간결하게 드러내며, 집합명사인 πλῆθος의 집단적 울림을 자연스럽게 살립니다.
- source_word: τῶν νηπίων
  english_pob_choice: of the little children
  chosen_korean: 아이들
  alternatives_korean:
  - 어린아이들
  - 유아들
  - 어린 자녀들
  lexicon: LSJ
  rationale: νήπιοι는 매우 어린 아이들을 가리키지만, 이 문맥에서는 공개적 호소의 대상 집단을 넓게 가리키므로 한국어에서는 가장 자연스러운 ‘아이들’이 지나친 축소 없이 적절합니다.
- source_word: μετὰ δακρύων
  english_pob_choice: with tears
  chosen_korean: 눈물을 흘리며
  alternatives_korean:
  - 눈물로
  - 눈물과 함께
  - 울면서
  lexicon: LSJ
  rationale: 전치사구의 동반·상태 의미를 한국어 관용으로 살려, 감정의 장면을 더 생생하게 전하는 ‘눈물을 흘리며’를 택했습니다.
theological_decisions:
- issue: 청원 화행의 강도
  chosen_reading: 화자가 단순 요청이 아니라 눈물 섞인 집단적 탄원을 드리는 장면으로 옮겼습니다.
  alternative_readings:
  - 부드러운 부탁으로 완화하는 번역
  - 호소를 중성적으로 처리하는 번역
  rationale: 그리스어 ἱκετεύει와 ‘with tears’의 결합은 절박한 간구를 강조하므로, 그 긴장을 약화시키지 않는 번역이 본문의 정서와 서사력을 보존합니다.
  doctrine_reference: 성서 서사에서의 탄원과 애통의 표현
