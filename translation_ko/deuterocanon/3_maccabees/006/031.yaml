  source_fidelity: 전반적인 대조 구조와 하데스의 이미지는 잘 보존했습니다. 그러나 κλισίας는 단순히 ‘잔칫상 앉는 자리’가 아니라 고대 연회에서 기대어 앉거나 누워 식사하는 연회용 자리/침상을 가리키며, 원문의 κατεμέρισαν은 그 장소를 그러한 자리들로 나눈 행위입니다. 또한 πτῶσιν은 ‘멸망’보다 ‘몰락’ 또는 ‘파멸’에 더 가깝습니다.
  naturalness: 초안의 ‘잔칫상 앉는 자리들로 나누어 차지하며’는 현대 한국어로 부자연스럽고, ‘나누다’와 ‘차지하다’가 함께 쓰여 원문의 행위도 흐려집니다. 문장 구조를 정리하여 수식 관계와 사건의 순서를 분명히 했습니다.
  terminology: ‘하데스’는 ᾅδης를 교리적으로 평탄화하지 않는 적절한 선택입니다. κῶθων은 문맥상 술과 연회를 수반한 축하 모임이므로 ‘술잔치’로 옮기고, σωτήριον의 의미는 ‘구원의’로 유지했습니다. κλισία는 고대 연회의 기대어 앉는 자리를 각주에서 설명했습니다.
  issues:
  - severity: medium
    issue: ‘잔칫상 앉는 자리들로 나누어 차지하며’의 부정확성과 비문성
    rationale: κλισίας는 연회용 식탁 자체가 아니라 기대어 앉거나 누워 먹는 자리/침상이며, κατεμέρισαν은 장소를 그러한 자리들로 나누었다는 뜻입니다. ‘나누어 차지하며’는 원문에 없는 점유의 의미를 덧붙이고 문장도 어색하게 만듭니다.
