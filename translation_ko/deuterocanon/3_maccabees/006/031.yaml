  to: 그러자 전에 수치를 당하고 하데스 가까이에 있었던 사람들—아니, 오히려 그 위에 이미 발을 디뎠던 사람들—은 쓰고 마시기 어려운 운명 대신 구원의 술잔치를 마련하고, 자신들의 몰락과 무덤을 위해 예비되었던 그 장소를 기쁨에 가득 차 연회에서 기대어 앉는 자리들로 나누었습니다.[a][b][c]
