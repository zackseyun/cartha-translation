base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/031.yaml
  text: Then those who had formerly been disgraced and were near Hades—or rather[a], had already stepped onto it—in place of a bitter and hard-to-drink fate, prepared a saving drinking-bout, divided up as dining-couches, full of joy[c][b], the place prepared for them for downfall and a grave.
  footnotes:
  - marker: a
    text: Or 'near death' / 'near the grave'; Greek 'near Hades.'
    reason: lexical_alternative
  - marker: b
    text: The Greek expression literally says they had 'stepped onto' Hades, a vivid way of saying they were as good as dead.
    reason: cultural_note
  - marker: c
    text: The term rendered 'drinking-bout' may also be understood more broadly as a festive banquet or drinking feast.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 이전에는 수치를 당하고 하데스 가까이에 있었던 사람들 — 아니, 오히려 그 위에 이미 발을 디딘 사람들이 — 씁쓸하고 마시기 어려운 운명 대신 구원하는 잔치를 마련하고, 자신들을 위해 멸망과 무덤으로 예비된 그 장소를 잔칫상 앉는 자리들로 나누어 차지하며 기쁨에 가득 찼습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죽음 가까이에’ / ‘무덤 가까이에’로도 옮길 수 있습니다. 원문은 직설적으로 ‘하데스 가까이에’라고 말합니다.
    reason: alternative_reading
  - marker: b
    text: ‘그 위에 발을 디딘’은 하데스를 실제로 밟았다는 뜻이 아니라, 이미 죽은 것이나 다름없었다는 생생한 비유입니다.
    reason: cultural_note
  - marker: c
    text: 여기서 κῶθωνα는 잔이나 한 잔의 술보다, 더 넓게는 축제성 잔치나 술잔치를 가리킬 수 있습니다.
    reason: lexical_alternative
