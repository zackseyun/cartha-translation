base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/016.yaml
  text: But those who had held fast to God even to death[a], having obtained complete deliverance, departed from the city, strewn with all kinds of very fragrant flowers, with rejoicing and shouting, giving thanks with praises and full songs of hymns to God, the holy Savior of Israel[b], the God of their fathers.
  footnotes:
  - marker: a
    text: Or 'having enjoyed full salvation.' The Greek σωτηρία can denote rescue/deliverance in context, while also carrying broader salvation language.
    reason: lexical_alternative
  - marker: b
    text: Or 'the holy deliverer of Israel.' The Greek σωτήρ may be rendered either 'Savior' or 'deliverer' depending on whether the emphasis is on title or immediate rescue.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 죽음에 이르기까지 하나님을 붙들고 있던 사람들은, 완전한 구원을 얻은 채 성을 떠났습니다. 그들은 온갖 매우 향기로운 꽃들로 덮였고, 기쁨과 함성 가운데, 조상들의 하나님, 이스라엘의 거룩한 구원자께 감사하며 찬양과 온전히 갖추어진 찬송으로 하나님께 드렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘완전한 구출을 얻은’. 여기서 σωτηρία는 문맥상 구출/해방을 뜻할 수 있으나, 더 넓게는 구원 언어도 포함합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이스라엘의 거룩한 구원자’. σωτήρ는 칭호성을 살려 ‘구원자’로도, 즉각적 구출의 강조를 따라 ‘구출자’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέχρι θανάτου τὸν θεὸν ἐσχηκότες
  english_pob_choice: had held fast to God even to death
  chosen_korean: 죽음에 이르기까지 하나님을 붙들고 있던
  alternatives_korean:
  - 죽을 때까지 하나님께 매달리고 있던
  - 죽음에 이르기까지 하나님과 함께 있던
  lexicon: LSJ
  rationale: ἐσχηκότες는 단순한 소유가 아니라 충성스럽게 붙드는 태도를 가리키므로, 관계의 긴장을 살린 ‘붙들고 있던’이 자연스럽고 정확합니다.
- source_word: παντελῆ σωτηρίαν ἀπόλαυσιν
  english_pob_choice: complete deliverance
  chosen_korean: 완전한 구원을
  alternatives_korean:
  - 완전한 구출을
  - 온전한 спас됨을
  lexicon: LSJ
  rationale: 이 문맥은 위협에서의 실제적 구출이 핵심이지만, σωτηρία의 넓은 종교적 울림도 있으므로 ‘구원’을 택하되 ‘완전한’으로 πλήρης의 강도를 살렸습니다.
- source_word: παντοίοις εὐωδεστάτοις ἄνθεσι κατεστρωμένοι
  english_pob_choice: strewn with all kinds of very fragrant flowers
  chosen_korean: 온갖 매우 향기로운 꽃들로 덮였고
  alternatives_korean:
  - 온갖 향긋한 꽃들로 깔렸고
  - 여러 가지 매우 향기로운 꽃들로 장식되었고
  lexicon: LSJ
  rationale: κατεστρωμένοι는 ‘깔다/덮다/깔아놓다’의 느낌이 있어 행렬의 시각적 효과를 살린 ‘덮였고’가 적절합니다.
- source_word: ἐν αἴνοις καὶ παμμελέτοις ὕμνοις
  english_pob_choice: with praises and full songs of hymns
  chosen_korean: 찬양과 온전히 갖추어진 찬송으로
  alternatives_korean:
  - 찬양과 완전한 찬송으로
  - 찬미와 온전한 노래의 찬송으로
  lexicon: LSJ
  rationale: παμμελέτοις는 단순한 ‘음량’보다 노래가 온전히 갖춰진 상태를 가리키므로, 한국어에서는 직역보다 의미를 살린 ‘온전히 갖추어진 찬송’이 더 적합합니다.
- source_word: τῷ θεῷ τῶν πατέρων αὐτῶν ἁγίῳ σωτῆρι τοῦ Ἰσραήλ
  english_pob_choice: to God ... the holy Savior of Israel, the God of their fathers
  chosen_korean: 조상들의 하나님, 이스라엘의 거룩한 구원자께
  alternatives_korean:
  - 그들의 조상들의 하나님, 이스라엘의 거룩한 구원자께
  - 조상들의 하나님이신 이스라엘의 거룩한 구원자께
  lexicon: LSJ
  rationale: 원문은 감사의 대상이 곧 ‘조상들의 하나님’이며 ‘이스라엘의 거룩한 구원자’로 동격 설명되므로, 한국어에서도 호칭의 누적 구조를 유지했습니다.
theological_decisions:
- issue: σωτηρία와 σωτήρ의 한국어 구분
  chosen_reading: σωτηρία는 ‘구원’, σωτήρ는 ‘구원자’로 옮겼습니다.
  alternative_readings:
  - 둘 다 ‘구출’/‘구출자’로 옮김
  - 둘 다 ‘구원’/‘구원자’로 통일
  rationale: 이 장면은 역사적 구출과 예배적 선포가 함께 있으므로, 사건 측면은 ‘구원’으로, 하나님의 칭호는 ‘구원자’로 번역해 서술과 찬양을 함께 드러냈습니다.
  doctrine_reference: Translation philosophy §1, §5
