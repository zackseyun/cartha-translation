  lexicon: LSJ
  rationale: 두 법정 용어를 한국어의 자연스러운 짝으로 옮기되, 절차적 부재를 분명히 드러내는 ‘심문이나 조사’로 표현했습니다.
- source_word: νόμου Σκυθῶν ἀγριοτέραν
  english_pob_choice: more brutal than the law of the Scythians
  chosen_korean: 스키타이인의 법보다 더 야만적인
  alternatives_korean:
