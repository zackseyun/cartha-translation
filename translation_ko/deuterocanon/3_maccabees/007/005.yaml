  lexicon: LSJ
  rationale: ἀνδράποδα는 사람을 노예 상태로 전락시킨다는 점에서 ‘노예들’이 가장 강하게 대응하며, μᾶλλον δέ의 교정 효과를 살려 ‘아니, 오히려’로 구분했습니다.
- source_word: ἄνευ πάσης ἀνακρίσεως καὶ ἐξετάσεως
  english_pob_choice: without any hearing or examination
  chosen_korean: 어떤 심문이나 조사도 없이
