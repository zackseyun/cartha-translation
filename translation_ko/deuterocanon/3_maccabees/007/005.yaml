  lexicon: LSJ
  rationale: 이 표현은 단순 폭행보다 인격을 깎아내리는 가혹한 대우를 가리키므로, 맥락상 ‘모욕하며’가 가장 간결하게 그 뉘앙스를 전달합니다.
