base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/020.yaml
  text: After also inscribing these things on a pillar[a], and establishing a place of prayer at the site of the banquet, they departed unharmed, free, and overflowing with joy, being brought safely back by land and sea and rivers, by the king’s command[b],
  footnotes:
  - marker: a
    text: Or 'dedicating them on a pillar'; the Greek participle can carry the sense of publicly setting up or consecrating an inscription.
    reason: lexical_alternative
  - marker: b
    text: Or 'being preserved safely through land and sea and rivers.' The Greek participle emphasizes safe preservation during the journey.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 또한 이 일들을 기둥에 새기고[a], 잔치가 열렸던 곳에 기도하는 자리를 세운 뒤, 다치지 않고, 자유롭게, 매우 기쁘게 떠났습니다. 왕의 명령[b]에 따라 육지와 바다와 여러 강을 지나 안전하게 돌아오고 있었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기둥에 봉헌하고’로도 옮길 수 있습니다. 그리스어 분사는 공개적으로 세워 두거나 헌정하는 뜻을 함께 담을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘왕의 명령으로 안전하게 보전되며’로도 옮길 수 있습니다. 그리스어 분사는 여행 중 보호받는 상태를 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνιερώσαντες
  english_pob_choice: inscribing
  chosen_korean: 새기고
  alternatives_korean:
  - 기록하고
  - 봉헌하고
  - 새겨 두고
  lexicon: LSJ
  rationale: 기둥(στήλῃ)과 함께 쓰여 공개적으로 남기는 행위를 가리키므로, 한국어에서는 물리적으로 ‘새기다’로 옮겨 공적 표지의 성격을 살렸습니다.
- source_word: στήλῃ
  english_pob_choice: pillar
  chosen_korean: 기둥
  alternatives_korean:
  - 비석
  - 기념비
  - 돌기둥
  lexicon: LSJ
  rationale: στήλη는 세워 둔 돌 표지의 뜻을 가지며, 여기서는 공적 기념물의 느낌을 살리면서도 자연스러운 한국어인 ‘기둥’이 적절합니다.
- source_word: κατὰ τὸν τῆς συμποσίας τόπον προσευχῆς καθιδρύσαντες
  english_pob_choice: establishing a place of prayer at the site of the banquet
  chosen_korean: 잔치가 열렸던 곳에 기도하는 자리를 세운 뒤
  alternatives_korean:
  - 잔치 자리에 기도의 장소를 세운 뒤
  - 잔치 장소에 기도 처소를 마련한 뒤
  - 잔치가 있던 곳에 기도처를 세운 뒤
  lexicon: LSJ
  rationale: τόπον προσευχῆς는 ‘기도의 장소’라는 성격을 나타내므로, ‘기도하는 자리’로 옮겨 장소의 용도를 자연스럽게 드러냈습니다. καθιδρύσαντες는 일시적 설치보다 지속적 마련의 뉘앙스가 있어 ‘세우다’로 처리했습니다.
- source_word: ἀνέλυσαν ἀσινεῖς, ἐλεύθεροι, ὑπέρχαρεις
  english_pob_choice: they departed unharmed, free, and overflowing with joy
  chosen_korean: 다치지 않고, 자유롭게, 매우 기쁘게 떠났습니다
  alternatives_korean:
  - 무사히, 자유롭게, 기쁨이 넘쳐 떠났습니다
  - 상처 없이, 자유롭게, 크게 기뻐하며 떠났습니다
  - 해를 입지 않고, 풀려나, 매우 기쁘게 떠났습니다
  lexicon: LSJ
  rationale: 세 형용사가 귀환 상태를 압축적으로 수식하므로, ‘다치지 않고 / 자유롭게 / 매우 기쁘게’로 대등하게 살렸습니다. ἐλεύθεροι는 문자적으로 ‘자유로운’이므로 구속에서 벗어난 상태까지 열어 두는 번역입니다.
- source_word: διὰ τε γῆς καὶ θαλάσσης καὶ ποταμῶν ἀνασωζόμενοι
  english_pob_choice: being brought safely back by land and sea and rivers
  chosen_korean: 육지와 바다와 여러 강을 지나 안전하게 돌아오고 있었기 때문입니다
  alternatives_korean:
  - 육지와 바다와 강들을 통해 안전히 돌아오고 있었기 때문입니다
  - 땅과 바다와 강을 거쳐 안전하게 보호받고 있었기 때문입니다
  - 육지와 바다와 강들을 따라 무사히 돌아오고 있었기 때문입니다
  lexicon: LSJ
  rationale: ἀνασωζόμενοι는 단순한 ‘돌아옴’보다 안전한 보전/귀환을 나타내므로 ‘안전하게 돌아오고 있었습니다’로 옮겼습니다. διὰ…는 경로를 나타내어 ‘육지와 바다와 여러 강을 지나’로 자연화했습니다.
- source_word: τῇ τοῦ βασιλέως ἐπιταγῇ
  english_pob_choice: by the king’s command
  chosen_korean: 왕의 명령에 따라
  alternatives_korean:
  - 왕의 명령으로
  - 왕의 칙령에 따라
  - 왕의 명에 따라
  lexicon: LSJ
  rationale: ἐπιταγή는 권위 있는 명령을 뜻하므로 ‘명령’이 적절하며, 한국어에서는 행위의 근거를 드러내는 ‘~에 따라’가 가장 자연스럽습니다.
theological_decisions:
- issue: 귀환의 안전이 누구에 의해 보전되는가
  chosen_reading: 본문은 왕의 명령을 직접적 행정 수단으로 제시하면서도, 그 결과가 놀라운 안전과 기쁨으로 귀결되는 긴장을 유지합니다.
  alternative_readings:
  - 하나님의 직접 개입을 더 분명히 드러내는 번역
  - 단순한 행정적 귀환으로만 축소하는 번역
  rationale: 이 절 자체는 하나님을 명시하지 않으므로, 본문의 서술 초점을 벗어나지 않도록 안전한 귀환의 사실만을 드러냈습니다. 다만 문맥상 구원의 의미를 흐리지 않도록 ‘안전하게’와 ‘매우 기쁘게’를 함께 살렸습니다.
  doctrine_reference: Translation philosophy §3, §5
- issue: 기도의 자리와 기념 행위의 성격
  chosen_reading: 기둥에 새기는 행위와 기도하는 자리를 세우는 행위는 일시적 표시가 아니라 기억과 경배를 위한 공적 기념 행위로 읽었습니다.
  alternative_readings:
  - 임시적인 표시나 장소 지정으로 보는 읽기
  - 단순한 여행 기록으로 제한하는 읽기
  rationale: ἀνιερώσαντες와 καθιδρύσαντες의 결합은 공적이고 지속적인 설정을 시사하므로, 문맥이 허용하는 범위 내에서 기념·경배의 성격을 반영했습니다.
  doctrine_reference: Translation philosophy §1, §5
