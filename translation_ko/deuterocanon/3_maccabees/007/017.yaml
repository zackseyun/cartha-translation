translation:
  language: ko
  text: 그들이 그곳의 특성 때문에 ‘장미를 지닌’이라고 불리는 프톨레마이스에 이르렀을 때, 함대는 그들의 공동 결정에 따라 그곳에서 그들을 칠 일 동안 기다렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘장미가 나는.’ 그리스어 별칭 ῥοδοφόρον은 프톨레마이스에 붙은 묘사적 칭호로, 그곳의 독특한 특성과 관련됩니다.
    reason: lexical_alternative
