theological_decisions:
- issue: 장소 별칭 ῥοδοφόρον의 처리
  chosen_reading: 별칭을 설명하는 문구로 처리하고, 본문에는 '로도베어링'이라는 음역형 별칭을 유지했습니다.
  alternative_readings:
  - '''장미를 지닌''처럼 의미역으로 풀기'
  - 각주에서만 설명하고 본문에서는 생략하기
  rationale: 이 표현은 신학적 쟁점보다 지명 별칭의 문학적 효과가 핵심이므로, 본문 가독성과 원문의 고유한 색채를 함께 살리는 쪽이 적절합니다.
  doctrine_reference: '번역 원칙: 원문 수사와 지명 별칭을 보존'
- issue: προσέμεινεν αὐτοὺς ὁ στόλος의 주어-목적어 관계
  chosen_reading: '''배들은 ... 그들을 기다렸습니다''로 옮겨, στόλος를 함대/배들로 이해했습니다.'
  alternative_readings:
  - '''함대가 그들을 기다렸습니다'''
  - '''해군이 그들을 기다렸습니다'''
  rationale: στόλος는 여기서 모인 선단을 가리키므로, 군사적 조직보다 실제 선박 집단을 드러내는 것이 문맥에 더 정확합니다.
  doctrine_reference: 문맥-어휘 결정
