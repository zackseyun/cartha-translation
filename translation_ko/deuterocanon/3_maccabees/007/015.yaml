base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/015.yaml
  text: On that day they killed more than three hundred men[a], and they also made it a joyful celebration[b], having laid hands on the profane.
  footnotes:
  - marker: a
    text: Greek literally, 'they brought/led gladness'; the sense is that they kept or observed the day as a celebration.
    reason: lexical_alternative
  - marker: b
    text: The final clause is difficult in the Greek witness used here. 'Having laid hands on the profane' could also be understood as 'having overpowered the impious.'
    reason: alternative_reading
translation:
  language: ko
  text: 그날 그들은 남자 삼백 명이 넘는 사람들을 죽였고, 그날을 또한 기쁨의 잔치로 삼았습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 직역은 ‘더 큰 기쁨을 가져왔다/이끌었다’에 가깝지만, 문맥상 그날을 축제처럼 지냈다는 뜻으로 이해할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 끝절의 그리스어는 전승상 다소 난해합니다. ‘불경한 자들을 제압한 뒤’ 또는 ‘불경한 자들에게 손을 댄 뒤’로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνεῖλον
  english_pob_choice: they killed
  chosen_korean: 그들은 ... 죽였고
  alternatives_korean:
  - 그들은 ... 살해했고
  - 그들은 ... 죽였습니다
  lexicon: LSJ
  rationale: 서술적 과거에서 ἀναιρέω는 ‘죽이다’가 가장 직접적이며, 현대 한국어에서도 가장 자연스럽게 폭력을 전달합니다.
- source_word: ὑπὲρ τοὺς τριακοσίους ἄνδρας
  english_pob_choice: more than three hundred men
  chosen_korean: 남자 삼백 명이 넘는 사람들
  alternatives_korean:
  - 남자 삼백 명이 넘는 사람들보다
  - 삼백 명이 넘는 남자들
  lexicon: LSJ
  rationale: ὑπέρ + 대격의 초과 의미를 ‘...이 넘는’으로 옮겼고, ἄνδρας의 성별 표지도 살리기 위해 ‘남자’로 구체화했습니다.
- source_word: ἤγαγον εὐφροσύνην μετὰ χαρᾶς
  english_pob_choice: they made it a joyful celebration
  chosen_korean: 기쁨의 잔치로 삼았습니다
  alternatives_korean:
  - 기쁨으로 기념했습니다
  - 즐거운 잔치로 만들었습니다
  lexicon: LSJ
  rationale: 직역하면 ‘기쁨을 이끌다’지만 관용적으로는 축제를 열거나 기념하는 뜻이므로, 한국어에서는 ‘잔치로 삼다’가 사건의 축하적 성격을 자연스럽게 드러냅니다.
- source_word: βεβήλους χειρωσάμενοι
  english_pob_choice: having laid hands on the profane
  chosen_korean: 그날을 또한 기쁨의 잔치로 삼았습니다
  alternatives_korean:
  - 더럽혀진 자들을 제압한 뒤
  - 불경한 자들에게 손을 댄 뒤
  lexicon: LSJ
  rationale: 이 결구는 전승상 문장이 다소 난해하므로, 본문이 분명히 말하는 ‘기쁨/축제’의 행위는 살리되 ‘베베룰루스’를 과도하게 해석하지 않도록 주석으로 처리했습니다.
theological_decisions:
- issue: βεβήλους의 평가적 성격
  chosen_reading: ‘불경한/속된’ 사람들을 가리키는 평가어로 이해하되, 본문에는 그 함의를 직접 드러내기보다 주석으로 처리했습니다.
  alternative_readings:
  - 불경한 사람들
  - 경건치 않은 사람들
  rationale: 이 형용사는 종교적으로 부정하다는 서술자의 평가를 담지만, 한국어 본문에서 지나치게 신학적 용어로 고정하면 원문의 폭을 좁힐 수 있어 본문은 보수적으로 두었습니다.
  doctrine_reference: 번역 철학 §1, §3
- issue: 난해한 절구 ἣν καὶ ἤγαγον εὐφροσύνην μετὰ χαρᾶς βεβήλους χειρωσάμενοι
  chosen_reading: ‘그날을 또한 기쁨의 잔치로 삼았습니다’로 매끄럽게 읽되, 원문의 난점을 각주로 보존했습니다.
  alternative_readings:
  - ‘기쁨과 함께 즐거움을 가져왔습니다’
  - ‘불경한 자들을 제압한 뒤 그날을 축제로 보냈습니다’
  rationale: 현전 그리스어는 통사적으로 거칠어, 한국어 본문은 축제/기쁨의 핵심 의미를 살리고 세부 상관관계는 각주로 남기는 편이 소스 충실성과 가독성을 함께 지킵니다.
  doctrine_reference: 번역 철학 §1, §6
