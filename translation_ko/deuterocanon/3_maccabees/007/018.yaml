  text: 그곳에서 그들은 구원의 잔치[a]를 벌였습니다. 왕이 각 사람에게 자기 집에 이를 때까지 필요한 모든 것을 기꺼이 마련해 주었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
