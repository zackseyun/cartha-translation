  source_fidelity: ‘구원에 이르는 잔치’는 σωτήριον을 ‘구원으로 이끄는’이라는 목적·결과 의미로 바꾸어, 구출/해방을 기념하는 잔치라는 본문의 뜻을 충분히 반영하지 못합니다. ‘구원의 잔치’는 원문의 구원·해방 연관성을 자연스럽고 직접적으로 보존합니다. 왕이 각 사람의 귀가에 필요한 것을 제공했다는 나머지 뜻은 유지하되, ‘기꺼이 마련해 주었다’로 εὐψύχως와 χορηγήσαντος의 자발적이고 후한 제공의 뉘앙스를 살렸습니다.
