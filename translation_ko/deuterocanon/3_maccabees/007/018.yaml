translation:
  language: ko
  text: 그곳에서 그들은 구원에 이르는 잔치를 베풀었는데, 왕이 각 사람에게 그의 집에 이르기까지 필요한 모든 것을 너그럽게 공급해 주었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구원의 잔치’, ‘해방의 잔치’로 옮길 수 있습니다. 그리스어는 이 축하가 구출과 직접 연결됨을 분명히 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν πότον σωτήριον
  english_pob_choice: held a saving banquet
  chosen_korean: 구원에 이르는 잔치를 베풀었는데
  alternatives_korean:
  - 구원하는 잔치를 베풀었는데
  - 구원의 잔치를 열었는데
  - 구원에 이르는 술잔치를 베풀었는데
  lexicon: LSJ
  rationale: πότον은 단순한 ‘마심’보다 축하성 연회를 가리키므로 ‘잔치’를 택했고, σωτήριον은 그 잔치가 구원/해방과 연결됨을 드러내기 위해 ‘구원에 이르는’으로 옮겼습니다.
- source_word: χορηγήσαντος
  english_pob_choice: had generously supplied
  chosen_korean: 너그럽게 공급해 주었기 때문입니다
  alternatives_korean:
  - 후하게 마련해 주었기 때문입니다
  - 넉넉히 공급해 주었기 때문입니다
  - 관대하게 제공해 주었기 때문입니다
  lexicon: LSJ
  rationale: 왕의 제공이 단순한 공급이 아니라 후한 후원을 뜻하므로, ‘너그럽게 공급해 주다’로 관대함과 제공의 의미를 함께 살렸습니다.
- source_word: τὰ πρὸς τὴν ἄφιξιν πάντα
  english_pob_choice: everything for the journey
  chosen_korean: 그의 집에 이르기까지 필요한 모든 것을
  alternatives_korean:
  - 여정에 필요한 모든 것을
  - 도착에 필요한 모든 것을
  - 집에 도착할 때까지 필요한 모든 것을
  lexicon: LSJ
  rationale: 직역하면 ‘도착을 위한 모든 것’이므로, 문맥상 목적지인 집에 이르기까지의 경로 전체를 자연스럽게 드러내는 표현으로 풀었습니다.
- source_word: ἕως ἐπὶ τὴν ἰδίαν οἰκίαν
  english_pob_choice: all the way to his own house
  chosen_korean: 그의 집에 이르기까지
  alternatives_korean:
  - 자기 집에 이를 때까지
  - 자기 집까지
  - 자기 집에 도착할 때까지
  lexicon: LSJ
  rationale: 분배적으로 ‘각 사람’에게 적용되는 표현이므로, 영어처럼 3인칭 단수 형태를 유지하기보다 한국어에서는 각 사람의 집에 도달함을 자연스럽게 나타냈습니다.
theological_decisions:
- issue: σωτήριον의 의미 범위
  chosen_reading: 잔치를 단순한 축연이 아니라 ‘구원에 이르는’ 사건으로 표지했습니다.
  alternative_readings:
  - 구원하는 잔치
  - 해방의 잔치
  - 구원의 잔치
  rationale: 본문과 영어 POB 모두 이 잔치가 구조적 ‘구원/해방’과 연결됨을 분명히 하므로, 의미를 약화하지 않으면서도 단정적인 신학 용어로 좁히지 않는 표현을 선택했습니다.
  doctrine_reference: 구원/해방의 서술적 표지
