  lexicon: LSJ
  rationale: αὐτοὶ의 강조를 살리되 과도하게 번역하지 않고, τέκνα는 혈연·후손을 아우르는 기본어인 자녀로 옮겼습니다.
- source_word: κατευθύνοντος
  english_pob_choice: directs
  chosen_korean: 바로잡아 주시는
  alternatives_korean:
