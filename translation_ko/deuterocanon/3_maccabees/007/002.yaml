  rationale: 직역적 의미인 ‘곧게 하다/바로잡다’를 살리면서도, 하나님의 명령을 ‘바로잡아 주시는’으로 옮겨 명령의 방향을 정해 주는 뉘앙스를 드러냈습니다.
- source_word: τὰ προστάγματα
