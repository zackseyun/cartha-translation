  lexicon: LSJ
  rationale: προστάγματα는 명령·지시를 뜻하므로, 소유격을 반영한 ‘그분의 명령들’로 옮겼습니다.
- source_word: καθὼς προαιρούμεθα
  english_pob_choice: just as we choose
  chosen_korean: 우리가 택하는 바와 같이
  alternatives_korean:
