  - 우리가 결심하는 대로
  - 우리가 원하는 대로
  lexicon: LSJ
  rationale: προαιρέομαι의 선택·의도 의미를 보존하면서, 현대 한국어에서 자연스러운 ‘택하는 바’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 명령과 인간의 선택 사이의 긴장
  chosen_reading: 하나님이 명령들을 바로잡아 주시면서도, 화자들이 여전히 ‘택하는’ 주체로 남아 있다는 긴장을 그대로 유지했습니다.
  alternative_readings:
  - 우리가 뜻하는 대로
  - 우리가 계획하는 대로
  rationale: 본문은 하나님의 주권적 방향 설정과 인간의 자발적 선택을 동시에 제시하므로, 어느 한쪽으로 조정하지 않고 병렬로 드러냈습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
