  lexicon: LSJ
  rationale: 상태를 나타내는 관용적 표현이므로, 문맥에 맞게 자연스러운 현대 한국어로 건강 상태를 드러냈습니다.
- source_word: καὶ αὐτοὶ καὶ τὰ τέκνα ἡμῶν
