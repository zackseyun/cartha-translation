    text: 또는 ‘공개적으로’, ‘자유롭게’로도 옮길 수 있습니다(μετὰ παρρησίας).
    reason: lexical_alternative
  - marker: b
    text: 마지막 구절은 ‘왕실의 어떠한 허가나 점검도 없이’로도 이해할 수 있으며, 왕의 직접 개입이 없었음을 더 분명히 드러냅니다.
    reason: lexical_alternative
