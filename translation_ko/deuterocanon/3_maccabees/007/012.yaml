  text: And when he accepted that they were speaking the truth and encouraged them[a], he gave them full permission, so that they might destroy those who had transgressed the law of God throughout every place under his kingdom, with boldness[b], without any royal authority or oversight.
  footnotes:
  - marker: a
    text: Or 'with confidence' or 'openly' for 'with boldness' (μετὰ παρρησίας).
    reason: lexical_alternative
  - marker: b
    text: The final phrase may also be understood as 'without any royal authorization or inspection,' emphasizing the absence of direct royal involvement in the action.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들이 진실을 말하고 있음을 받아들이고 그들을 격려하자, 그가 그들에게 모든 것에 대한 완전한 허가를 주어, 그들이 그의 왕국 아래 있는 모든 곳에서 하나님의 율법을 어긴 자들을 담대히[a] — 어떤 왕의 권한이나 감독도 없이[b] — 멸망시키게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘공개적으로’, ‘자유롭게’로도 옮길 수 있습니다(μετὰ παρρησίας).
    reason: lexical_alternative
  - marker: b
    text: 마지막 구절은 ‘어떤 왕의 허가나 점검도 없이’로도 이해할 수 있어, 왕의 직접 개입이 없었음을 더 분명히 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τἀληθές ... λέγειν
  english_pob_choice: speaking the truth
  chosen_korean: 진실을 말하고 있음을
  alternatives_korean:
  - 사실을 말하고 있음을
  - 참말을 하고 있음을
  lexicon: LSJ
  rationale: τἀληθές는 λέγειν과 함께 ‘진실을 말하다’는 뜻으로 자연스럽게 읽히므로, 단순히 ‘사실’보다 증언의 진위에 초점을 둔 표현을 택했습니다.
- source_word: παραινέσας
  english_pob_choice: encouraged them
  chosen_korean: 그들을 격려하자
  alternatives_korean:
  - 그들을 권고하자
  - 그들을 권면하자
  - 그들을 권유하자
  lexicon: LSJ
  rationale: 문맥상 요청을 승인한 뒤 행동을 북돋는 의미이므로, 한국어에서는 과도하게 교훈적인 ‘권면’보다 ‘격려’가 가장 자연스럽고 소스에 가깝습니다.
- source_word: ἄδειαν πάντων
  english_pob_choice: full permission
  chosen_korean: 모든 것에 대한 완전한 허가
  alternatives_korean:
  - 전적인 허가
  - 모든 면에서의 허가
  - 완전한 허용
  lexicon: LSJ
  rationale: ἄδεια의 ‘허가/자유’와 πάντων의 포괄성을 함께 살리기 위해 ‘모든 것에 대한 완전한 허가’로 옮겼습니다.
- source_word: μετὰ παρρησίας
  english_pob_choice: with boldness
  chosen_korean: 담대히
  alternatives_korean:
  - 공개적으로
  - 당당히
  - 자유롭게
  lexicon: LSJ
  rationale: παρρησία는 단순한 공개성보다 두려움 없는 자유로운 실행을 가리키므로, 동사 부사형 ‘담대히’가 가장 압축적입니다.
- source_word: ἄνευ πάσης βασιλικῆς ἐξουσίας καὶ ἐπισκέψεως
  english_pob_choice: without any royal authority or oversight
  chosen_korean: 어떤 왕의 권한이나 감독도 없이
  alternatives_korean:
  - 어떤 왕의 승인이나 점검도 없이
  - 왕의 어떤 권위나 검열도 없이
  - 왕의 어떤 허가나 감찰도 없이
  lexicon: LSJ
  rationale: ἐξουσία는 ‘권한/권위’이고 ἐπισκέψις는 ‘감독/점검’의 뜻이므로, 왕의 직접 개입 부재를 드러내는 ‘권한이나 감독’이 적절합니다.
theological_decisions:
- issue: 강한 파괴 동사의 유지
  chosen_reading: ἐξολεθρεύσωσιν을 완화하지 않고 ‘멸망시키게 했습니다’로 옮겨, 허가된 행위의 강도를 그대로 보존했습니다.
  alternative_readings:
  - ‘처벌하게 했습니다’
  - ‘제거하게 했습니다’
  rationale: 본문은 단순 징계가 아니라 강한 파괴/멸절의 의미를 담고 있으므로, 의미를 약화시키는 완곡어법은 피해야 합니다.
  doctrine_reference: 원문 우선 번역 원칙; source-direct rendering
- issue: 문장 중간의 삽입적 대시 처리
  chosen_reading: ‘담대히 — 어떤 왕의 권한이나 감독도 없이 —’처럼 한국어에서 읽기 쉬운 방식으로 삽입구를 분리했습니다.
  alternative_readings:
  - 쉼표만으로 연결
  - 괄호로 처리
  rationale: 원문의 마지막 수식어구는 동작의 성격과 조건을 함께 규정하는 삽입구이므로, 현대 한국어에서는 대시가 의미 관계를 가장 분명히 보여줍니다.
  doctrine_reference: 현대 표준어 구문 명료화
