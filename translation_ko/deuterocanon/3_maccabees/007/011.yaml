  text: declaring that they should never show favor either to those who[a], for the sake of their belly, had transgressed the divine commandments[b], or to the king’s decrees.
  footnotes:
  - marker: a
    text: Or, 'for appetite’s sake' or 'for food.' The Greek literally says 'for the sake of the belly,' an idiom for yielding to bodily appetite.
    reason: lexical_alternative
  - marker: b
    text: The Greek wording of the final clause is compressed and may also be understood as referring to those aligned with the king’s decrees rather than the decrees themselves.
    reason: alternative_reading
translation:
  language: ko
  text: 배를 위한 욕심 때문에 신성한 명령들을 어긴 자들에게도, 왕의 칙령들에도 결코 호의를 보이지 않겠다고 선언하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘배를 위하여’로, 식욕이나 음식에 굴복하는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 문법적으로 압축되어 있어, ‘왕의 칙령들’ 자체를 가리키는 것으로도, 그 칙령 편에 선 사람들을 가리키는 것으로도 읽을 수 있습니다.
    reason: alternative_reading
