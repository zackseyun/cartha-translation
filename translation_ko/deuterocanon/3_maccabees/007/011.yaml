theological_decisions:
- issue: ‘배’를 둘러싼 관용구의 처리
  chosen_reading: 문자적 이미지를 유지하되 한국어에서는 의미가 드러나도록 ‘배를 위한 욕심 때문에’로 옮겼습니다.
  alternative_readings:
  - ‘배 때문에’
  - ‘식욕 때문에’
  - ‘음식을 위해’
  rationale: 원문은 육체적 욕망에 굴복함을 비유적으로 말하므로, 단순한 식사 행위로 축소하지 않고 도덕적 함의를 보존했습니다.
  doctrine_reference: 성경 번역에서 관용구의 문자성보다 의미와 윤리를 함께 보존해야 하는 원칙
- issue: 마지막 절의 병렬 구조
  chosen_reading: ‘왕의 칙령들에도’로 병렬을 유지해, 원문의 압축된 구조를 최대한 그대로 드러냈습니다.
  alternative_readings:
  - ‘왕의 칙령에 따르는 자들에게도’
  - ‘왕의 칙령을 따르지도’
  rationale: 전달된 그리스어는 압축적이고 다소 어색하지만, 보조 목적어를 임의로 보태지 않고 호의의 대상이 두 갈래라는 구조를 살렸습니다.
  doctrine_reference: 본문에 없는 대상을 보태지 말고, 전승된 문장을 정직하게 반영할 것
