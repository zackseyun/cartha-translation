  rationale: θεῖα προστάγματα는 ‘하나님’이 직접 명시되지 않으므로, 원문의 신적 권위를 살리면서도 과도하게 특정하지 않는 ‘신성한 명령들’로 옮겼습니다.
- source_word: μηδέποτε εὐνοήσειν
