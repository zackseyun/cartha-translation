  text: Then the priests of these people and the whole multitude[a], having praised him as was fitting, cried out[b], “Hallelujah!” and departed with joy.
  footnotes:
  - marker: a
    text: The pronoun 'him' most likely refers to God; the Greek does not repeat the noun explicitly.
    reason: alternative_reading
  - marker: b
    text: Or “Alleluia”; the Greek preserves a Hebrew liturgical acclamation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 이 사람들의 제사장들과 온 무리가 마땅한 바와 같이 그를 찬양하고, 「할렐루야!」라고 외친 뒤, 기쁨으로 떠났습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘그’를 가리키는 대상은 문맥상 하나님으로 보는 것이 가장 자연스럽지만, 그리스어는 명사를 반복하지 않고 대명사만 씁니다.
    reason: alternative_reading
  - marker: b
    text: ‘할렐루야’는 히브리어 예배 감탄사의 음역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατευφημήσαντες
  english_pob_choice: having praised
  chosen_korean: 찬양하고
  alternatives_korean:
  - 칭송하고
  - 찬미하고
  - 찬양한 뒤
  lexicon: LSJ
  rationale: 공적이고 경건한 찬양의 뉘앙스를 살리기 위해 ‘찬양하다’를 택했습니다. 문맥상 단순한 칭찬보다 예배적 환호에 가깝습니다.
- source_word: ὡς πρέπει ἦν
  english_pob_choice: as was fitting
  chosen_korean: 마땅한 바와 같이
  alternatives_korean:
  - 마땅하듯
  - 적절한 바와 같이
  - 합당하게
  lexicon: LSJ
  rationale: 형용사적 판단을 드러내는 관용구로서, 자연스러운 합쇼체 문맥에서 ‘마땅한 바와 같이’가 격식을 유지합니다.
- source_word: ἐπιφωνήσαντες ἀλληλουιά
  english_pob_choice: cried out, “Hallelujah!”
  chosen_korean: 「할렐루야!」라고 외친 뒤
  alternatives_korean:
  - 「알렐루야!」라고 외친 뒤
  - 「야훼를 찬양하라!」라고 외친 뒤
  lexicon: LSJ
  rationale: ἀλληλουιά는 히브리어 예배 감탄사를 음역한 것으로 보존하는 것이 원문의 예배적 울림을 가장 잘 살립니다. 한국어 교회 용례에 맞는 표기는 ‘할렐루야’입니다.
- source_word: ἀνέλυσαν
  english_pob_choice: departed
  chosen_korean: 떠났습니다
  alternatives_korean:
  - 헤어졌습니다
  - 물러갔습니다
  - 출발했습니다
  lexicon: LSJ
  rationale: 모임의 종료와 이동을 자연스럽게 드러내는 일반 동사로 옮겼습니다. ‘떠났습니다’가 가장 간결하고 문맥에 맞습니다.
theological_decisions:
- issue: αὐτόν의 지시 대상
  chosen_reading: 주어를 명시하지 않고 한국어에서는 ‘그를’로 유지해, 본문이 직접 말하는 대상을 그대로 반영했습니다.
  alternative_readings:
  - 하나님을
  - 그분을
  rationale: 문맥상 하나님을 가리키는 것이 가장 자연스럽지만, 그리스어 본문은 명시적 명사를 반복하지 않고 대명사만 사용합니다. 한국어 본문도 이 긴장을 보존하는 편이 source-direct합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ἀλληλουιά의 음역 유지
  chosen_reading: 예배적 외침을 ‘할렐루야’로 음역해 본문 안에 직접 넣었습니다.
  alternative_readings:
  - ‘주를 찬양하라’로 의역
  - ‘알렐루야’로 표기
  rationale: 이 표현은 단순 의미 전달보다 예전적 외침 자체가 중요하므로, 번역보다 보존이 더 충실합니다.
  doctrine_reference: Translation philosophy §6
