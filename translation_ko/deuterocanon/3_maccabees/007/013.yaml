revisions:
- from: 그러자 이 사람들의 제사장들과 온 무리가 마땅한 바와 같이 그를 찬양하고, 「할렐루야!」라고 외친 뒤, 기쁨으로 떠났습니다.[a][b]
  to: 그러자 그들의 제사장들과 온 무리가 마땅한 바에 따라 그를[a] 찬양하고, 「할렐루야![b]」라고 외친 뒤 기쁨으로 떠났습니다.
  rationale: 문맥상 자연스러운 지시 표현으로 ‘이 사람들의’를 ‘그들의’로 고치고, ‘마땅한 바에 따라’로 원문의 적합성 표현을 매끄럽게 다듬었습니다. 대명사 αὐτόν은 ‘하나님’으로 확대하지 않고 ‘그를’로 보존했습니다. 또한 두 각주 표지를 각주가 설명하는 어구에 직접 배치했습니다.
