  text: 악의를 품고 더 자주 우리 곁에 있던 몇몇 친구들이 우리를 설득하여, 우리 통치 아래 있는 유대인들을 집단으로[a] 모은 뒤, 그들이 반란을 일으켰다는 이유로 이례적인 형벌로[b] 벌해야 한다고 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: τὰ συστήματα는 ‘집단으로’ 외에도 ‘조직체로’ 또는 ‘무리로’ 옮길 수 있습니다. 이 말이 가리키는 집합의 정확한 성격은 다소 불확실합니다.
    reason: lexical_alternative
  - marker: b
    text: ξενιζούσαις τιμωρίαις는 ‘낯선 형벌로’ 또는 ‘특이한 처벌로’도 옮길 수 있습니다.
