  text: Some of our friends[a], being more constantly at our side out of malice, persuaded us that the Jews under our rule, after being gathered together in groups[b], should be punished with unusual penalties as rebels.
  footnotes:
  - marker: a
    text: Or 'in groups' or 'in organized bodies'; the Greek term can denote an organized body or association, and its precise force here is somewhat uncertain.
    reason: lexical_alternative
  - marker: b
    text: Or 'with extraordinary punishments.' The Greek describes penalties as strange, foreign, or unusual.
    reason: lexical_alternative
