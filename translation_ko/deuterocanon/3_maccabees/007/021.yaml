  text: each one to his former place[a], having obtained authority among their enemies with glory and fear[b], their whole body of possessions having been shaken by none.
  footnotes:
  - marker: a
    text: Greek is compressed and somewhat difficult here. 'To his former place' renders an elliptical expression that could also mean 'to what was formerly theirs' or 'to the previous position.'
    reason: lexical_alternative
  - marker: b
    text: Or 'their entire property having been disturbed by no one' / 'none of their possessions having been shaken.' The clause likely means that nothing belonging to them was harmed or unsettled.
    reason: lexical_alternative
translation:
  language: ko
  text: 각자 자기의 이전 자리로 돌아가, 적들에게서 권세를 얻어 영광과 두려움 가운데 있었고, 소유한 것들은 아무에게도 흔들리지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이전 자리’는 압축된 그리스어 εἰς τὴν ἔμπροσθεν을 풀어 옮긴 것으로, 문맥상 ‘전에 있던 곳/상태’까지도 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘적들에게서 권세를 얻어’는 ἐν τοῖς ἐχθροῖς ἐξουσίαν ἐσχηκότες의 관계적 의미를 따른 번역입니다. 문맥상 ‘적들 위에’라는 뉘앙스로도 읽힐 수 있습니다.
    reason: lexical_alternative
