theological_decisions:
- issue: τὰ ἔθνη의 범위
  chosen_reading: ‘민족들’로 옮겨, 특정 신학적 대조를 미리 고정하지 않고 집단 일반을 가리키는 폭을 남겼습니다.
  alternative_readings:
  - 이방인들
  - 나라들
  rationale: 이 절은 바울서신의 ‘유대인/이방인’ 대조를 전개하는 문맥이 아니라, 헬라어 표현의 일반적 범위를 전달하는 정치적 진술입니다. 따라서 한국어 본문에서는 넓은 의미를 유지했습니다.
  doctrine_reference: '번역 원칙: 원어 우선, 해석학적 과잉 특정화 지양'
