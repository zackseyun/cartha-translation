  text: 그들은 우리의 사정이 이 사람들이 민족들에 대해 품고 있는 적대감 때문에 결코 안정되지 못할 것이라고 주장하며, 이것이 이루어질 때까지 그렇게 될 것이라고 했습니다.[a]
