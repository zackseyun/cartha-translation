  lexicon: LSJ
  rationale: ὡς πατέρα의 비교를 살려 ‘아버지처럼’으로 옮기고, συμμαχοῦντα의 동반·동맹 전투 의미를 ‘우리 편에서 싸워 왔고’로 반영했습니다.
- source_word: τήν τε ... βεβαίαν ... εὔνοιαν
