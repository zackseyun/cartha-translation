  rationale: 그리스어는 동맹의 전투성(sυμμαχοῦντα)과 우정의 호의(εὔνοια)를 함께 제시하므로, 어느 한쪽으로만 평탄화하지 않았습니다.
  doctrine_reference: 문맥상 정치·외교적 서술이며 특별한 교리 용례는 없습니다.
