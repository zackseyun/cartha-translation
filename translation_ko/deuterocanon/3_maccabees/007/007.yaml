  lexicon: LSJ
  rationale: 강한 총칭 표현을 살려 ‘어떤 까닭으로도 아무 비난에서나’로 옮겨, 법적·공적 면책의 폭넓음을 표현했습니다.
- source_word: ἀπολελύκαμεν
  english_pob_choice: we have released
  chosen_korean: 정당하게 풀어 주었습니다
  alternatives_korean:
