base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/007.yaml
  text: Considering that he has always fought alongside us like a father for his sons[a], and reckoning the firm goodwill they have toward us and our forefathers as that of a friend[b], we have rightly released them in every way from any charge whatever.
  footnotes:
  - marker: a
    text: Or, 'has always been our ally like a father for his sons.' The Greek participle can emphasize either active military support ('fought alongside') or the broader idea of allied assistance.
    reason: lexical_alternative
  - marker: b
    text: 'The closing Greek expression is highly emphatic, literally something like ''from every cause in whatever way.'' The translation renders the overall legal sense: complete release from any possible charge.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 아들들을 위하여 항상 아버지처럼 우리 편에서 싸워 왔고, 우리와 우리 조상들에게 그들이 품고 있는 변함없는 우정을 친구의 그것으로 헤아려, 우리는 그들을 어떤 까닭으로도 아무 비난에서나 정당하게 풀어 주었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아들들을 위하여 항상 우리 편의 동맹으로서 싸워 왔습니다.” 그리스어 분사는 적극적 군사 지원과 보다 넓은 동맹적 협력을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 끝맺는 그리스어 표현은 매우 강조적이며, 문자 그대로는 ‘어떤 원인으로든 어떤 방식으로든’에 가깝습니다. 번역은 전체 법적 의미인 완전한 면책을 살렸습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς πατέρα ὑπὲρ υἱῶν διὰ παντὸς συμμαχοῦντα
  english_pob_choice: has always fought alongside us like a father for his sons
  chosen_korean: 아들들을 위하여 항상 아버지처럼 우리 편에서 싸워 왔고
