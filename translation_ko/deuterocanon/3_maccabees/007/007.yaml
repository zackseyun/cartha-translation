  lexicon: LSJ
  rationale: 그리스어의 소유격적 압축을 살려 우정이 ‘친구의 것’으로 성격 지어진다는 점을 드러냈습니다.
- source_word: καθʼ ὁντινοῦν αἰτίας τρόπον
  english_pob_choice: from any charge whatever
  chosen_korean: 어떤 까닭으로도 아무 비난에서나
  alternatives_korean:
