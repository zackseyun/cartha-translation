  - 해방해 주었습니다
  lexicon: LSJ
  rationale: 완료 시상의 결과 상태를 살리면서, 법적 해제의 의미를 현대 한국어에서 가장 자연스럽게 전달하는 표현으로 ‘풀어 주었습니다’를 선택했습니다.
theological_decisions:
- issue: 군사적 동맹과 도덕적 호의의 이중 이미지
