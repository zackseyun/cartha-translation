  yaml_path: translation/deuterocanon/3_maccabees/007/019.yaml
  text: And after they had been brought down in peace[a], with the fitting thanksgivings[b], there also they resolved to keep these days as joyful ones for the whole time of their sojourning.
  footnotes:
  - marker: a
    text: Or 'with the proper praises/confessions.' The Greek word can denote confession or thanksgiving; the festive context favors 'thanksgivings.'
    reason: lexical_alternative
  - marker: b
    text: '''Sojourning'' reflects the Greek term for living as resident aliens or temporary dwellers, not necessarily formal exile.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 평안 가운데 알맞은 감사로 내려온 뒤, 그곳에서도 그들은 이 날들을 자기들의 나그네 됨의 모든 기간 동안 기쁨의 날들로 지키기로 결의했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마땅한 고백들로’라는 뜻일 수 있습니다. 그러나 문맥상 축제적 감사가 더 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나그네 됨’은 헬라어 παροικία의 이방인/임시 거주 뉘앙스를 살린 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: καταχθέντες
  english_pob_choice: after they had been brought down
  chosen_korean: 내려온 뒤
  alternatives_korean:
  - 데려와진 뒤
  - 끌어내려진 뒤
  - 인도되어 내려온 뒤
  lexicon: LSJ
  rationale: κατάγω 계열의 하강/이동 이미지를 살리되, 한국어에서는 자연스럽게 ‘내려오다’로 옮겨 본문의 흐름을 유지했습니다.
- source_word: μετʼ εἰρήνης
  english_pob_choice: in peace
  chosen_korean: 평안 가운데
  alternatives_korean:
  - 평화롭게
  - 평안히
  - 평강 가운데
  lexicon: LSJ
  rationale: 안전하고 მშვიდ한 상태를 나타내므로 ‘평안 가운데’가 가장 무난하게 상태적 의미를 드러냅니다.
- source_word: ἐν ταῖς πρεπούσαις ἐξομολογήσεσιν
  english_pob_choice: with the fitting thanksgivings
  chosen_korean: 알맞은 감사로
  alternatives_korean:
  - 마땅한 고백들로
  - 적절한 찬양으로
  - 합당한 감사들로
  lexicon: LSJ
  rationale: ἐξομολόγησις는 문맥상 죄 고백보다 감사/찬양의 뜻이 더 적합하므로, ‘감사’로 옮기되 πρεπούσαις의 ‘알맞은’ 뉘앙스를 반영했습니다.
- source_word: ἄγειν τὰς ἡμέρας
  english_pob_choice: to keep these days
  chosen_korean: 이 날들을 ... 지키기로
  alternatives_korean:
  - 이 날들을 ... 기념하기로
  - 이 날들을 ... 지내기로
  - 이 날들을 ... 지키도록
  lexicon: LSJ
  rationale: 절기나 기념일을 ‘지키다/거행하다’는 한국어 표현이 ἄγειν의 관용적 의미를 가장 자연스럽게 살립니다.
- source_word: παροικίας
  english_pob_choice: sojourning
  chosen_korean: 나그네 됨
  alternatives_korean:
  - 거주함
  - 임시 거주함
  - 체류함
  lexicon: LSJ
  rationale: παροικία의 ‘나그네로 머묾/이방인처럼 사는 상태’를 살리기 위해, 단순한 거주보다 ‘나그네 됨’이 더 정확합니다.
theological_decisions:
- issue: ἐξομολόγησις의 의미 범위
  chosen_reading: 축제적 문맥에 따라 죄의 고백이 아니라 감사의 표현으로 읽었습니다.
  alternative_readings:
  - 고백
  - 찬양
  - 사죄의 고백
  rationale: 이 절은 기쁨의 날들을 정하는 문맥이어서, 문법적 가능성보다 문맥적 적합성이 더 큰 ‘감사’로 번역하는 것이 본문의 의도에 부합합니다.
  doctrine_reference: 본문 문맥 우선 원칙; 감사와 예배의 어휘 선택
