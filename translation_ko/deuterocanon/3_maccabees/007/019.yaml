  source_fidelity: 초안의 ‘내려온 뒤’는 καταχθέντες의 수동태(‘인도되어/데려와져 내려온’)를 충분히 드러내지 못합니다. 또한 ἐν ταῖς πρεπούσαις ἐξομολογήσεσιν은 문맥상 감사로 이해할 수 있으나, 한국어 문장에서는 ‘감사로 내려온’이 수식 관계상 부자연스럽습니다. 수정문은 수동 이동, 평안, 알맞은 감사, 그곳에서도, 결의, 기쁨의 날 준수, 나그네로 사는 전 기간을 모두 보존합니다.
  naturalness: ‘자기들의 나그네 됨의 모든 기간’은 직역투입니다. ‘그들이 나그네로 사는 동안 내내’가 현대 표준 한국어의 합쇼체 문장 안에서 자연스럽고, παροικία의 이방인·임시 거주라는 함의도 유지합니다.
  terminology: ἐξομολογήσεις는 축제 제정의 문맥에 따라 ‘감사’로 옮길 수 있으며, 각주에서 ‘고백’이라는 어휘적 가능성을 보존합니다. ἄγειν τὰς ἡμέρας는 절기·기념일을 ‘지키다’로 옮긴 것이 적절합니다. 각주 표지는 해당 어구인 ‘감사’와 ‘나그네로 사는’에 각각 붙여 내용과 일치시켰습니다.
