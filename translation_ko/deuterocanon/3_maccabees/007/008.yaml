  terminology: ‘명령하였으며’, ‘자기 집’, ‘해치다’, ‘모욕하다’, ‘이치에 어긋나게’는 원문의 행정적 어조와 어휘 의미를 무리 없이 전달합니다. εἰς τὰ ἴδια의 넓은 뜻과 παρὰ λόγον의 해석 가능성은 각주로 보존했습니다.
