  text: And we have ordered each and every one to return to his own home[a], with absolutely no one in any way harming them[b], nor insulting them over the things that happened contrary to reason.
  footnotes:
  - marker: a
    text: Or 'return to their own places.' The Greek εἰς τὰ ἴδια can denote one's own home, property, or place.
    reason: lexical_alternative
  - marker: b
    text: Or 'over what happened irrationally' / 'over the unreasonable things that happened.' The phrase 'contrary to reason' renders Greek παρὰ λόγον closely.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 우리는 모두가 각자 자기 집으로 돌아가도록 명령하였으며[a], 아무도 어떤 방식으로든 그들을 조금도 해치지 못하게 하고, 이치에 어긋나게 일어난 그 일들 때문에 그들을 모욕하지 못하게 하였습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘각자의 처소로 돌아가도록’으로 옮길 수 있습니다. 그리스어 εἰς τὰ ἴδια는 자기 집, 소유지, 또는 자기 처소를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이치에 어긋나서 일어난 일들 때문에’ 또는 ‘불합리하게 일어난 일들 때문에’로 옮길 수 있습니다. 그리스어 παρὰ λόγον은 문자적으로 ‘이치에 반하여’라는 뜻입니다.
    reason: lexical_alternative
