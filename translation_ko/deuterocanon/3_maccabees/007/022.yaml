  text: And all of them recovered all their own property from the registration, so that those who had anything gave it back to them with the greatest fear, since the great God had fully accomplished mighty deeds for their deliverance.
  footnotes:
  - marker: a
    text: Or 'from the inventory' or 'from the official record'; the Greek ἀπογραφή can refer to an administrative registration of persons or property.
    reason: lexical_alternative
  - marker: b
    text: Or 'for their salvation.' The Greek σωτηρία can denote both rescue in a concrete situation and salvation more broadly.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 모두 등록으로 자기들의 모든 소유를 되찾았으며, 그래서 무엇인가를 가지고 있던 사람들은 가장 큰 두려움으로 그것을 그들에게 돌려주었습니다. 이는 큰 하나님께서 그들의 구원을 위해 위대한 일들을 완전히 행하셨기 때문입니다.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 '등록부에서', '명부에서'일 수 있습니다. 여기서 ἀπογραφή는 사람이나 재산의 공식 등록을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '구출을 위해', '해방을 위해'일 수 있습니다. 여기서 σωτηρία는 구체적 구조와 더 넓은 구원의 의미를 모두 가질 수 있습니다.
    reason: lexical_alternative
