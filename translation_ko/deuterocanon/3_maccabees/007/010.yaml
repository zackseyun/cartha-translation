base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/010.yaml
  text: But when they received this letter[a], they did not immediately hasten about the departure; instead, they urged the king that those from the Jewish race who had willfully transgressed the law of the holy God might, through them[c][b], receive the punishment that was due.
  footnotes:
  - marker: a
    text: Or 'the return' instead of 'the departure'; the Greek term can be understood from either the perspective of leaving the present place or going back to a prior one.
    reason: lexical_alternative
  - marker: b
    text: Literally 'those from the race of the Jews.'
    reason: lexical_alternative
  - marker: c
    text: Or 'might suffer at their hands the punishment that was due.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 이 편지를 받았지만, 곧바로 출발에 급히 나서지는 않았습니다. 오히려 왕에게, 유대인 종족 가운데서 스스로 거룩하신 하나님의 율법을 범한 자들이 그들로 말미암아 마땅한 벌을 받게 해 달라고 요청했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἄφοδος는 문맥에 따라 ‘출발’ 또는 ‘귀환’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘유대인 종족 가운데서’입니다.
    reason: lexical_alternative
  - marker: c
    text: διʼ αὐτῶν은 ‘그들로 말미암아’ 외에 ‘그들의 손에 의해’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λαβόντες δὲ τὴν ἐπιστολὴν ταύτην
  english_pob_choice: when they received this letter
  chosen_korean: 그들은 이 편지를 받았지만
  alternatives_korean:
  - 이 편지를 받고서
  - 이 편지를 받은 뒤에
  lexicon: LSJ
  rationale: 부사적 분사구문을 한국어의 자연스러운 서술로 옮기되, 이후 전개되는 대조를 살리기 위해 ‘-지만’을 사용했습니다.
- source_word: οὐκ ἐσπούδασαν εὐθέως περὶ τὴν ἄφοδον
  english_pob_choice: they did not immediately hasten about the departure
  chosen_korean: 곧바로 출발에 급히 나서지는 않았습니다
  alternatives_korean:
  - 즉시 떠날 채비를 서두르지는 않았습니다
  - 곧바로 돌아갈 일에 서두르지는 않았습니다
  lexicon: LSJ
  rationale: ἄφοδος는 문맥상 ‘출발/떠남’ 또는 ‘귀환’으로 갈릴 수 있어, 본문 진행을 가장 직접적으로 드러내는 ‘출발’을 기본으로 두었습니다.
- source_word: τοὺς ἐκ τοῦ γένους τῶν Ἰουδαίων
  english_pob_choice: those from the Jewish race
  chosen_korean: 유대인 종족 가운데서
  alternatives_korean:
  - 유대인 족속 가운데서
  - 유대인 혈통 가운데서
  lexicon: LSJ
  rationale: γένος의 민족·혈통적 범주를 살리되, 한국어에서 과도하게 생경한 ‘race’ 직역을 피하면서도 집단의 출신 범위를 유지했습니다.
- source_word: τὸν ἅγιον θεὸν
  english_pob_choice: the holy God
  chosen_korean: 거룩하신 하나님
  alternatives_korean:
  - 거룩한 하나님
  - 성스러운 하나님
  lexicon: LSJ
  rationale: 하나님을 높이는 한국어 관용에 맞춰 ‘거룩하신’으로 옮기되, 원문의 형용사적 수식을 그대로 보존했습니다.
- source_word: αὐθαιρέτως παραβεβηκότας τοῦ θεοῦ τὸν νόμον
  english_pob_choice: those who had willfully transgressed the law of the holy God
  chosen_korean: 스스로 거룩하신 하나님의 율법을 범한 자들이
  alternatives_korean:
  - 자의로 하나님의 율법을 어긴 자들이
  - 자기 뜻대로 하나님의 율법을 어긴 자들이
  lexicon: LSJ
  rationale: αὐθαιρέτως의 자의적·자발적 책임성을 ‘스스로’로, παραβεβηκότας의 법률적 위반을 ‘범하다’로 옮겨 문맥의 고발 성격을 유지했습니다.
- source_word: τυχεῖν διʼ αὐτῶν τῆς ὀφειλομένης κολάσεως
  english_pob_choice: might, through them, receive the punishment that was due
  chosen_korean: 그들로 말미암아 마땅한 벌을 받게 해 달라고
  alternatives_korean:
  - 그들을 통해 마땅한 벌을 받게 해 달라고
  - 그들 손에 의해 마땅한 형벌을 받게 해 달라고
  lexicon: LSJ
  rationale: διʼ αὐτῶν의 수단성을 살리면서도 한국어에서 자연스러운 ‘그들로 말미암아’로 옮겼고, ὀφειλομένης는 ‘마땅한’으로, κολάσεως는 형사적 뉘앙스를 유지하는 ‘벌’로 처리했습니다.
theological_decisions:
- issue: ‘거룩하신 하나님’과 ‘하나님의 율법’의 관계
  chosen_reading: 본문은 특정 유대인 집단이 이스라엘의 하나님께 속한 율법을 자의적으로 범했다고 직설적으로 고발합니다.
  alternative_readings:
  - 보다 완곡하게 ‘하나님의 법’으로 옮길 수 있음
  - ‘성결하신 하나님’처럼 의역할 수 있음
  rationale: 원문의 긴장을 완화하지 않고, 공동체 내부의 위반이라는 역사적·윤리적 고발을 그대로 드러내는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 원어 우선 원칙; 신학적 긴장 보존
