    issue: ‘인사와 안녕을 전합니다’가 ἐρρῶσθαι의 건강·안녕 기원을 충분히 드러내지 못하고, 서신 관용구를 다소 부자연스럽게 처리합니다.
    rationale: ἐρρῶσθαι는 편지 첫머리에서 수신자의 건강과 평안을 비는 정형 표현입니다. ‘건강하시기를 바랍니다’가 그 기능을 명확하고 자연스럽게 전달합니다.
