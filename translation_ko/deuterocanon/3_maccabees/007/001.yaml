  text: '왕 프톨레마이오스 필로파토르가 이집트의 장군들과 모든 업무를 맡은 이들에게: 인사와 안녕을 전합니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βασιλεὺς
  english_pob_choice: King
  chosen_korean: 왕
  alternatives_korean:
  - 임금
  - 왕께서
  lexicon: LSJ
  rationale: 본문의 무관사 호칭용법을 살려 서두의 왕실 칭호로 옮겼습니다. 현대 문체에서는 ‘왕’이 가장 직접적입니다.
- source_word: τοῖς κατʼ Αἴγυπτον στρατηγοῖς
  english_pob_choice: to the generals in Egypt
  chosen_korean: 이집트의 장군들
  alternatives_korean:
  - 이집트 전역의 장군들
  - 이집트에 있는 장군들
  lexicon: LSJ
  rationale: κατʼ Αἴγυπτον의 분포적 뉘앙스는 유지하되, 한국어에서는 ‘이집트의’가 행정·군사 대상에게 자연스럽고 간결합니다.
- source_word: πᾶσιν τοῖς τεταγμένοις ἐπὶ πραγμάτων
  english_pob_choice: to all who are appointed over affairs
  chosen_korean: 모든 업무를 맡은 이들
  alternatives_korean:
  - 사무를 맡도록 임명된 모든 이들
  - 일들을 관장하도록 세워진 모든 이들
  lexicon: LSJ
  rationale: τεταγμένοις는 ‘배정/임명된’의 뜻이고, ἐπὶ πραγμάτων은 행정 업무를 가리키므로 ‘업무를 맡은’으로 압축해 행정적 의미를 살렸습니다.
- source_word: χαίρειν καὶ ἐρρῶσθαι
  english_pob_choice: greetings and good health
  chosen_korean: 인사와 안녕을 전합니다
  alternatives_korean:
  - 문안과 안녕을 전합니다
  - 문안 인사드립니다
  lexicon: LSJ
  rationale: 서신 관용구인 χαίρειν / ἐρρῶσθαι를 직역하기보다 한국어 편지체의 정형 표현으로 옮겨, 인사와 건강의 이중 뜻을 자연스럽게 전달했습니다.
