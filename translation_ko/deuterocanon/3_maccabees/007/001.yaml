  lexicon: LSJ
  rationale: τεταγμένοις는 ‘배정/임명된’의 뜻이고, ἐπὶ πραγμάτων은 행정 업무를 가리키므로 ‘업무를 맡은’으로 압축해 행정적 의미를 살렸습니다.
- source_word: χαίρειν καὶ ἐρρῶσθαι
  english_pob_choice: greetings and good health
  chosen_korean: 인사와 안녕을 전합니다
  alternatives_korean:
  - 문안과 안녕을 전합니다
