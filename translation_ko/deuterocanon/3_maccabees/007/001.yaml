  lexicon: LSJ
  rationale: 서신 관용구인 χαίρειν / ἐρρῶσθαι를 직역하기보다 한국어 편지체의 정형 표현으로 옮겨, 인사와 건강의 이중 뜻을 자연스럽게 전달했습니다.
