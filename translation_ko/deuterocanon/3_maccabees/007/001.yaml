  yaml_path: translation/deuterocanon/3_maccabees/007/001.yaml
  text: 'King Ptolemy Philopator to the generals in Egypt and to all who are appointed over affairs: greetings and good health[a][b].'
  footnotes:
  - marker: a
    text: Or 'to the generals throughout Egypt,' reflecting the distributive nuance of κατʼ Αἴγυπτον.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'greetings and to be strong/well'; this is a standard Greek letter formula expressing greeting and a wish for well-being.
    reason: cultural_note
translation:
  language: ko
  text: 왕 프톨레마이오스 필로파토르가 이집트의 장군들[a]과 업무를 맡도록 임명된 모든 이에게 문안하며, 건강하시기를 바랍니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이집트 전역의 장군들’. κατʼ Αἴγυπτον은 이집트 안에 있는 이들을 가리키며, 분포적인 뉘앙스를 지닐 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘문안하며 강건하기를’. 이는 인사와 수신자의 안녕을 비는 표준 그리스어 서신 관용구입니다.
    reason: cultural_note
