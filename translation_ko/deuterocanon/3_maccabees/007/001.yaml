review_pass:
  verdict: revise
  source_fidelity: 수신자 범위와 행정적 임명이라는 뜻은 대체로 반영되어 있습니다. 그러나 ‘인사와 안녕을 전합니다’는 χαίρειν καὶ ἐρρῶσθαι라는 서신 관용구의 건강 기원을 다소 흐리며, ‘전합니다’는 원문의 간결한 발신자 서두보다 부자연스럽게 덧붙은 표현입니다. 또한 τεταγμένοις의 ‘임명된’ 뜻을 드러내는 편이 더 충실합니다.
  naturalness: 수정문은 고대 왕실 서신의 표제·인사 형식을 현대 한국어 합쇼체로 자연스럽게 재현합니다. ‘문안하며 건강하시기를 바랍니다’는 수신자에 대한 인사와 안녕의 기원을 모두 명확히 합니다.
  terminology: ‘왕 프톨레마이오스 필로파토르’, ‘장군들’, ‘업무를 맡도록 임명된 모든 이’는 원문의 칭호, 군사·행정 용어, 고유명을 적절히 보존합니다. κατʼ Αἴγυπτον의 가능한 분포적 뉘앙스는 각주로 남깁니다.
  issues:
