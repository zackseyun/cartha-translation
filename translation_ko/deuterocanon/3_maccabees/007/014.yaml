  yaml_path: translation/deuterocanon/3_maccabees/007/014.yaml
  text: They themselves also killed along the road any compatriot of the defiled people who had fallen in with them[a], and they did away with them as examples.
  footnotes:
  - marker: a
    text: Or 'with exemplary punishments' or 'making a public example of them.' The Greek μετὰ παραδειγματισμῶν can emphasize public warning or disgrace in the manner of their killing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들 자신도 길에서 그들과 마주친 더럽혀진 사람들 가운데 자기 민족인 사람을 죽였고, 공개적인 수치를 주는 방식으로 그들을 죽였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘본보기로’, ‘공개적 본보기로’, ‘수치를 주는 본보기로’. 그리스어 μετὰ παραδειγματισμῶν은 그들의 살해 방식이 공개적 경고나 수치 주기의 성격을 띨 수 있음을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ τε
  english_pob_choice: They themselves also
  chosen_korean: 그들 자신도
  alternatives_korean:
  - 그들 또한 직접
  - 그들 스스로도
  lexicon: LSJ
  rationale: 강조점인 ‘그들 자신도’로 직접성을 살리면서, 한국어에서 자연스러운 연결감을 유지했습니다.
- source_word: τὸν ἐμπεσόντα
  english_pob_choice: who had fallen in with them
  chosen_korean: 그들과 마주친
  alternatives_korean:
  - 그들과 우연히 맞닥뜨린
  - 그들과 길에서 마주한
  lexicon: LSJ
  rationale: 길에서의 우연한 조우를 드러내기 위해 ‘마주친’을 택했습니다.
- source_word: τῶν μεμιαμμένων ὁμοεθνῆ
  english_pob_choice: any compatriot of the defiled people
  chosen_korean: 더럽혀진 사람들 가운데 자기 민족인 사람
  alternatives_korean:
  - 더럽혀진 사람들 가운데 같은 민족 사람
  - 부정해진 무리 가운데 자기 동족
  lexicon: LSJ
  rationale: μεμιαμμένων의 오염/더러움 의미를 ‘더럽혀진’으로 직접 옮기고, ὁμοεθνῆ는 ‘자기 민족인 사람’으로 풀어 의미 관계를 분명히 했습니다.
- source_word: μετὰ παραδειγματισμῶν
  english_pob_choice: as examples
  chosen_korean: 공개적인 수치를 주는 방식으로
  alternatives_korean:
  - 본보기로
  - 공개적 본보기로
  - 수치를 주는 본보기로
  lexicon: LSJ
  rationale: παραδειγματισμῶν이 단순한 ‘예시’가 아니라 공개적 망신·경고의 성격을 띠므로, 그 수치성과 공개성을 드러냈습니다.
theological_decisions:
- issue: 끝절의 παραδειγματισμῶν 의미를 어떻게 반영할지
  chosen_reading: 공개적인 수치를 주는 방식으로
  alternative_readings:
  - 본보기로
  - 공개적 본보기로
  - 그들을 본보기로 삼아
  rationale: 문맥상 처형 자체가 경고와 망신의 기능을 갖기 때문에, 의미를 완화하지 않고 공개적 수치라는 함의를 드러냈습니다.
  doctrine_reference: 공적 심판/수치의 문맥 보존
