  naturalness: ‘더럽혀진 사람들 가운데 자기 민족인 사람’은 지시 관계가 다소 어색하고, 단수 선행사를 뒤에서 복수 대명사로 받는 방식도 매끄럽지 않습니다. ‘더럽혀진 이들 가운데 자신들과 같은 민족인 사람들을’로 정리하면 현대 표준 한국어 합쇼체 문장으로 더 자연스럽습니다.
  terminology: ὁμοεθνῆ는 ‘자신들과 같은 민족인’으로, μεμιαμμένων은 평가적 명칭을 보존하는 ‘더럽혀진 이들’로 옮깁니다. παραδειγματισμῶν은 본문에서 ‘본보기로 삼아’로 보존하고, 공개적 망신 또는 경고의 함의는 각주에서 대안으로 제시합니다.
