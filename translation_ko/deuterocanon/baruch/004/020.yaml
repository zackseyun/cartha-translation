base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/020.yaml
  text: I have taken off the robe of peace[a], but I have put on the sackcloth of my supplication[b]; I will cry out to the Eternal One in my days.
  footnotes:
  - marker: a
    text: Or 'the Everlasting One.' The Greek title is literally 'the eternal [one],' used here as a divine designation.
    reason: lexical_alternative
  - marker: b
    text: '''Sackcloth'' refers to coarse mourning clothing worn as a sign of grief, repentance, or distress.'
    reason: cultural_note
translation:
  language: ko
  text: 나는 평화의 옷을 벗고, 내 간구의 베옷을 입었습니다[b]. 나는 내 날들 동안 영원하신 분께 부르짖을 것입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영원한 분’. 그리스어는 문자적으로 ‘영원한 자’를 뜻하는 형용사를 실체명사처럼 사용한 신적 호칭입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘베옷’은 슬픔, 회개, 고통의 표시로 입는 거친 옷을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἐξεδυσάμην τὴν στολὴν τῆς εἰρήνης
  english_pob_choice: I have taken off the robe of peace
  chosen_korean: 나는 평강의 겉옷을 벗어 버리고
  alternatives_korean:
  - 나는 평화의 옷을 벗었습니다
  - 나는 평강의 로브를 벗었습니다
  lexicon: SBLGNT/Swete Greek, BDAG
  rationale: στολή는 격식 있는 긴 옷을 가리키므로 ‘겉옷’으로 자연스럽게 옮기되, εἰρήνη는 POB 기본어인 ‘평강’을 살려 직역의 의미를 유지했습니다.
- source_word: σάκκον
  english_pob_choice: sackcloth
  chosen_korean: 베옷
  alternatives_korean:
  - 굵은 베옷
  - 상복
  lexicon: BDAG
  rationale: σάκκος는 애통과 회개의 표지인 거친 자루천 옷이므로, 한국어 성경에서 널리 통용되는 ‘베옷’으로 옮기고 주석 없이도 문맥상 애통의 의미가 드러나게 했습니다.
- source_word: δεήσεώς μου
  english_pob_choice: my supplication
  chosen_korean: 간구의
  alternatives_korean:
  - 나의 간구의
  - 나의 탄원의
  lexicon: BDAG
  rationale: δέησις는 단순한 기도보다 간절한 청원을 강조하므로 ‘간구’가 가장 직접적입니다. 소유격은 한국어 관형격으로 자연스럽게 처리했습니다.
- source_word: τὸν αἰώνιον
  english_pob_choice: the Eternal One
  chosen_korean: 야훼
  alternatives_korean:
  - 영원하신 분
  - 영원자
  lexicon: LXX divine-designation usage
  rationale: 본문의 ουσιαστικοποιημένος 형용사는 신적 호칭이지만, 바룩서의 다른 LXX 전승에서 가리키는 분이 하나님이므로 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다. 이는 호칭의 신학적 무게를 한국 독자가 즉시 인식하게 합니다.
- source_word: ἐν ταῖς ἡμέραις μου
  english_pob_choice: in my days
  chosen_korean: 내 날들 동안
  alternatives_korean:
  - 내 생애 동안
  - 내가 사는 동안
  lexicon: BDAG
  rationale: 직역의 시간 표현을 유지하되, 한국어에서 자연스럽게 읽히도록 ‘동안’을 덧붙였습니다.
theological_decisions:
- issue: τὸν αἰώνιον의 신적 호칭 처리
  chosen_reading: 고유한 신적 칭호를 드러내기 위해 ‘야훼’로 번역했습니다.
  alternative_readings:
  - 영원한 분
  - 영원하신 이
  rationale: 영어 POB는 문맥상 신적 호칭의 독특함을 보존하려고 ‘the Eternal One’을 택했습니다. 한국어에서도 일반 서술로 완화하지 않고, 본문이 누구를 향해 부르짖는지 분명하게 드러내는 것이 원문·전승의 의미를 더 잘 살립니다.
  doctrine_reference: 'DOCTRINE.md: Original-language primacy; preserve distinctive theological wording where source permits.'
