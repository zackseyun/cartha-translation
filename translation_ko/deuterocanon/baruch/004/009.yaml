base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/009.yaml
  text: 'For he saw the wrath that came upon you from God[a], and he said, “Hear, you neighbors of Zion: God has brought upon me great mourning.”'
  footnotes:
  - marker: a
    text: Or “you sojourners of Zion” or “you residents near Zion.” The Greek πάροικοι can denote those dwelling beside or among a place, sometimes with the nuance of resident aliens.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 하나님에게서 그들에게 임한 진노를 보았기 때문입니다. 그래서 말했습니다. 「들으십시오, 시온의 이웃들아. 하나님께서 나에게 큰 슬픔을 가져오셨습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “시온에 머무는 나그네들” 혹은 “시온 가까이에 사는 사람들”. 그리스어 πάροικοι는 어떤 장소 곁에 살거나 그곳 사이에 거주하는 이들을 가리킬 수 있으며, 때로는 임시 거주민의 뉘앙스를 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν ἐπελθοῦσαν ὑμῖν ὀργὴν
  english_pob_choice: the wrath that came upon you
  chosen_korean: 그들에게 임한 진노
  alternatives_korean:
  - 그들에게 닥친 분노
  - 너희에게 덮쳐 온 진노
  lexicon: BDAG
  rationale: ἐπελθοῦσαν의 ‘upon/come upon’ 감각을 살려 ‘임한’으로 옮기고, ὀργή는 이 문맥의 신적 심판을 드러내는 ‘진노’로 옮겼습니다.
- source_word: παρὰ τοῦ θεοῦ
  english_pob_choice: from God
  chosen_korean: 하나님에게서
  alternatives_korean:
  - 하나님으로부터
  - 하나님께로부터
  lexicon: BDAG
  rationale: 원문의 출처 표지를 자연스럽게 드러내면서도, 하나님의 직접적 기원을 약화하지 않도록 ‘하나님에게서’로 옮겼습니다.
- source_word: οἱ πάροικοι Σειών
  english_pob_choice: you neighbors of Zion
  chosen_korean: 시온의 이웃들아
  alternatives_korean:
  - 시온의 나그네들아
  - 시온 곁에 사는 이들아
  - 시온의 거주자들아
  lexicon: BDAG
  rationale: πάροικοι는 단순한 지리적 거주보다 ‘곁에 사는/이웃한’ 관계를 포함할 수 있어, POB의 선택을 따라 관계적 뉘앙스를 살린 ‘이웃들’로 옮겼습니다.
- source_word: ἐπήγαγέ μοι
  english_pob_choice: has brought upon me
  chosen_korean: 나에게 가져오셨습니다
  alternatives_korean:
  - 나에게 임하게 하셨습니다
  - 나에게 가져다주셨습니다
  lexicon: BDAG
  rationale: 동사의 ‘가져오다/불러오다’ 감각을 보존하되 한국어로는 문맥상 ‘슬픔’을 목적어로 하여 자연스럽게 구성했습니다.
- source_word: πένθος μέγα
  english_pob_choice: great mourning
  chosen_korean: 큰 슬픔
  alternatives_korean:
  - 큰 애도
  - 큰 통곡
  - 큰 애통
  lexicon: BDAG
  rationale: πένθος는 장례적·탄식적 슬픔을 가리키지만, 한국어에서는 직역어보다 본문의 절규를 잘 전달하는 ‘큰 슬픔’이 더 자연스럽고 과도한 의례적 뉘앙스를 피합니다.
theological_decisions:
- issue: 하나님의 심판과 슬픔의 직접적 귀속
  chosen_reading: 원문이 진노와 큰 슬픔의 발생을 하나님에게 직접 귀속하므로, 이를 완화하지 않고 분명히 옮겼습니다.
  alternative_readings:
  - 칼람처럼 중립화하여 ‘재앙이 닥쳤다’로 옮기는 방식
  - 행위자를 흐리는 수동형 표현
  rationale: 본문의 수사와 신학적 긴장을 유지하려면 하나님의 주도성을 약화시키지 않아야 합니다.
  doctrine_reference: Translation philosophy §1, §3
