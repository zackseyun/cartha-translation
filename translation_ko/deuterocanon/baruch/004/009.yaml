  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 πάροικοι를 ‘시온의 이웃들’로 옮기면 ‘시온에 속한 이웃’이라는 관계가 강하게 들려, ‘시온 곁에/그곳에 거주하는 이들’이라는 원문의 공간적·사회적 범위를 충분히 드러내지 못합니다. 또한 πένθος의 애도·애통의 뜻이 ‘큰 슬픔’에서는 다소 약화됩니다.
  naturalness: ‘하나님에게서’보다 ‘하나님께로부터’가 현대 표준어 문어체에서 더 자연스럽습니다. 합쇼체 직접 호명에는 ‘이웃들아’보다 ‘이들이여’가 문체적으로 더 안정적이며, 각주 표지는 해당 어휘 바로 뒤에 두는 편이 명확합니다.
  terminology: ὀργή는 ‘진노’, ἐπελθοῦσαν은 ‘임한’으로 적절합니다. πένθος μέγα는 문맥의 공적·애도적 성격을 살려 ‘큰 애통’으로 옮기는 것이 더 정확합니다. πάροικοι는 본문에서 ‘시온 곁에 사는 이들’로 번역하고 각주로 ‘나그네들’ 등의 가능성을 보존합니다.
  issues:
  - severity: medium
    issue: ‘시온의 이웃들’은 πάροικοι Σειών의 공간적 거주 의미를 불분명하게 합니다.
