- from: 그는 하나님에게서 그들에게 임한 진노를 보았기 때문입니다. 그래서 말했습니다. 「들으십시오, 시온의 이웃들아. 하나님께서 나에게 큰 슬픔을 가져오셨습니다.」[a]
  to: 그는 하나님께로부터 너희에게 임한 진노를 보았기 때문입니다. 그리고 이렇게 말했습니다. 「들으십시오, 시온 곁에 사는 이들이여[a]. 하나님께서 내게 큰 애통을 가져오셨습니다.」
  rationale: 원문의 신적 행위 귀속(‘하나님께로부터’, ‘하나님께서 … 가져오셨습니다’)과 심판의 어조를 그대로 유지했습니다. πάροικοι의 의미 범위를 본문에서는 자연스러운 공간 표현으로, 각주에서는 가능한 ‘나그네/거주자’ 의미로 보존했습니다. πένθος는 ‘큰 애통’으로 조정하여 애도와 비탄의 어감을 살렸습니다.
