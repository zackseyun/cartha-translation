    rationale: πένθος는 단순한 내적 슬픔보다 상실에 따른 애통과 애도의 뜻을 지닙니다. ‘큰 애통’이 문맥과 원어에 더 가깝습니다.
  - severity: low
    issue: 각주 표지가 인용문 끝에 있어 대체 어휘가 무엇인지 즉시 식별되지 않습니다.
